  md: '# Drive Interfaces


    There are two popular interfaces for hard drives: IDE (pronounced I-D-E) and SCSI
    (pronounced skuzzy). Each has its own advantages and drawbacks, as you''ll see
    in the following sections.


    # IDE


    Integrated Drive Electronics (IDE) is the "normal" interface for hard drives,
    and by far the most common. Most motherboards have two built-in 40-pin IDE connectors:


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_156_0.png)


    IDE

    Integrated Drive Electronics. A drive with a built-in controller.


    # ATA


    AT Attachment. A standard for IDE drives in PCs that makes it possible for PCs
    to share IDE devices without compatibility problems.


    Each of those connectors can support up to two drives (on the same ribbon cable),
    for a total of four. You can also add expansion cards that have additional IDE
    connectors on them.


    IDE is actually a generic term referring to any drive with a built-in controller.
    Back in the earliest days of hard drive technology, the hard drive and its controller
    were two separate pieces. With an IDE drive, however, the drive controller is
    part of the package. You have probably noticed that a hard drive has a little
    circuit board strapped to the bottom of a hard drive; that''s the integrated drive
    controller. When the controller goes bad, the drive is toast as well. IDE was
    a real revolution in PC technology when it first came out, because it meant that
    drive makers did not have to make their drives compatible with a particular controller
    standard, so they could develop higher-performance drive/controller combinations
    that spoke their own proprietary language between them.


    # AT Attachment (ATA)


    All IDE drives today (and for the last 10 years or more) are compatible with the
    AT Attachment (ATA) standard, and they are more or less compatible with one another.
    That means you can take an old hard drive and put it in a new system and the new
    system will be able to use it.'
