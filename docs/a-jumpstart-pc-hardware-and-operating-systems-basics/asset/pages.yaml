  md: '# Cleaning a PC


    Computers attract a lot of dust, both inside and out. Outside it''s just a nuisance
    making for a less pleasant working environment. Inside, dust can prevent components
    from being cooled properly, causing overheating and causing them to go bad faster.


    # Cleaning Supplies


    Using the right cleaning supplies is important. You don''t want to use heavy-duty
    solvents on components, nor do you want to do anything that will cause a short
    circuit. (For example, don''t get water on a circuit board.) Here are some safe,
    useful supplies to have on hand:


    +   * Compressed air in an aerosol, preferably with an extension straw that can
    direct the air precisely

    * Clean, lint-free soft cloths

    * Paper towels

    * Warm water with a small amount of very mild detergent (such as dish washing
    liquid), or a cleaning fluid designed for cleaning computer equipment

    * Antistatic spray-on cleaner specifically designed for computer equipment

    * Moist tolettes specifically designed for computer monitors

    * Cotton swabs

    * Alcohol (not rubbing alcohol)


    # Cleaning a Circuit Board


    Circuit boards accumulate dust. To remove the dust, blow it off with canned air.
    Avoid putting any kind of wet substance on a circuit board, because it can cause
    short-circuiting if the liquid is not completely dried when you power up. If you
    must use a liquid, use pure alcohol (not rubbing alcohol, which contains water).


    > WARNING

    canned air comes out very cold, so don''t blow it on yourself if you can help
    it. Because it does make whatever it touches very cold, some PC technicians use
    it to cool off an overheated chip on a circuit board.


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_27_0.png)'
  merge: -1
  pgno: 27
- img_proc: true
  md: '# Safety and Preventive Maintenance


    Avoid touching any of the chips or resistors on a circuit board because you might
    damage them; handle it only by its edges.


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_28_0.png)


    # Cleaning the Inside of the PC


    Big dust bunnies can grow inside a PC; you''ll be shocked the first time you open
    up an old PC. Fish out the large pieces by hand. Then blow the dust off everything
    with canned air. But hold your breath! All that dust will be floating around in
    the air, and you''ll be hacking and coughing. If you can blow it out outdoors,
    that''s all the better.


    > TIP

    If your CPU has a heat sink or fan on it, there''s probably a lot of dust accumulated
    in the little nooks and crannies of it. Make sure you get all that crud out too.


    # Cleaning a Monitor


    Always turn the monitor before cleaning it. Then wipe the screen with special
    glass cleaner designed specifically for computer monitors and a soft lint-free
    cloth. You can buy premoistened wipes for cleaning monitors if you prefer.'
