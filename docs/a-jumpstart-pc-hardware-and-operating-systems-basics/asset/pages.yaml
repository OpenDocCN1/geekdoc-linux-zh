  md: '# Chapter 8


    > WARNINGnYou can put a new hard drive in an old system, but you might not be
    able to use its full capacity due to BIOS and operating system limitations. Some
    older BIOSes''t support drives of more than 8GB; if you have a driver bigger than
    that, you must get a BIOS update or be ready to use a larger drive at the supported
    size. MS-DOS and Windows versions earlier than Windows 98 do not have large disk
    support. They means won''t support the FAT32 file system (32-bit File Allocation
    Table), so the drive size is limited to 2GB per logical drive. You can have multiple
    logical drives on a single physical drive, so the space isn''t wasted (with BIOS
    limitations); it''s just chopped off


    DMAnirect Memory Access. A way of increasing data transfer rates by enabling the
    device to bypass the CPU and access memory directly.


    Several additions have been made to the ATA standard over the years. Each one
    adds some new features or a new way of increasing the drive''s speed. You don''t
    need to know the details of each of the additions; just know that they are numbered,
    ATA-1 through ATA-6 (the 2000 revision).


    > NOTEnYou may occasionally hear IDE referred to EIDE. The extra E stands for
    "enhanced." EIDE originally meant any IDE device that supported ATA-2 or higher,
    but because all IDE devices nowadays do that, EIDE has to be almost a generic
    IDE itself.


    Starting with ATA-4, a new means of improving data transfer speed introduced UltraDMA
    (also called UltraATA). Originally it allowed for data transfers of up to 33MB/sec,
    but ATA-5 increased to 66MB/sec, and ATA-6 further increased it to 100MB/sec.


    UltraDMA comes with a couple of "gotchas," however. One is the 66MB/sec and 100MB/sec
    versions require a special ribbon cable that 80 wires instead of the usual 40.
    It has only 40 pins/holes, though; the extra wires are spacers that help eliminate
    EMI between the wires so they can transfer data more reliably. The other issue
    is that when two drives share the same ribbon cable, they''re limited to the maximum
    transfer rate that they can both support. For example, a 33MB/sec drive and a
    100MB/sec drive would both like 33MB/sec drives when on the same cable.


    The motherboard and the drive must also support a certain transfer rate to make
    Ultra speeds possible. An older motherboard may have been manufactured before
    some of the higher ATA standards were invented, putting a brand-new, high-speed
    drive in such a system would be a waste.


