    # SCSI


    Small Computer Systems Interface (SCSI) is the other important type of hard drive
    connector you need to know about. SCSI used to be very popular in high end systems
    because of the problems and limitations with IDE. However, IDE has improved over
    the years to the point where it is almost as good as SCSI in every way, so there
    is less reason to seek out SCSI equipment.


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_159_0.png)


    > NOTE

    SCSI is a parallel interface, like an LPT port or an IDE interface. FireWire (IEEE
    1394) is a serial variant of SCSI. Other serial variants of SCSI, including Serial
    Storage Architecture (SSA) and Fibre Channel, are not popular.


    SCSI has always been less popular than IDE for three reasons. One is that the
    drives themselves cost more, and price-sensitive consumers have been unwilling
    to spend the extra money for them. The second is that most motherboards do not
    natively support SCSI, so you must add a SCSI controller to your system in order
    to use a SCSI drive. Finally, SCSI manufacturers have not done a very good job
    of educating the public about the advantages of SCSI over IDE. Even many computer
    professionals are not sure exactly why SCSI is better, although they have heard
    that it is.


    Why is it better?


    +   * SCSI has a higher overall throughput rate than IDE in some cases.

    * You can chain multiple drives onto a single interface (at least seven, as opposed
    to only two with IDE). Because each interface requires system resources (such
    as IRQs), using SCSI drives can be an advantage if you are worried about running
    out of IRQs.

    * Multiple drives on the same bus share bandwidth more gracefully than IDE. If
    two or more devices on the same SCSI chain need to be used at once there is less
    likelihood of a bottleneck with IDE.


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_159_1.png)'
