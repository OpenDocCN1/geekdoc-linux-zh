  md: '# Chapter 13


    # Basic Network Concepts


    In the next several pages, I''ll run through some networking vocabulary that you
    might have heard thrown about, and I''ll break down networking in several different
    ways you can see how an average network fits together. You''ll need to know this
    stuff if you decide to take the A+ exams.


    A network is a group of computers connected together so they can share resources
    such as hard disks and printers. A network can also serve as a conduit to other
    resources. For example, you can share an Internet connection over a network, so
    that all the PCs in the network can take advantage of the same high-speed connection.
    The Internet is really just a big file-sharing system, after all a way of linking
    millions of users to one another.


    A Local Area Network (LAN) is a network in which computers are located near another.
    "Near" is rather subjective; some people consider a LAN if all the PCs are located
    in the same building, for example, while other people say a LAN exists if the
    computers are in adjacent buildings as well. A Wide Area Network (WAN) is a network
    where the computers are not near each other. The Internet is the biggest example
    of that.


    # Peer-to-Peer versus Client/Server


    There are two basic network architectures: client/server and peer-to-peer.


    A server is a computer that exists only to serve the needs of the other computers
    in the network. It manages the network traffic between the client PCs (that is,
    the PCs that are in everyday by end users) and serves as a central storage repository
    for files users want to make available to other users. A server network is a network
    that includes one or more servers and one or more clients. Almost all business
    networks are client/server. The advantage is that the server(s) handle the network
    overhead, the client PCs'' performance does not suffer. The disadvantages are
    that you must have at least one PC set aside to be the server and it must have
    a special server version of the operating system.


    **Network**nTwo or more computers connected together to share resources.


    **Local Area Network**nA in which all the resources are located near one another.


    **Wide Area Network**nA network in which resources are separated physically from
    one another (not in the same building).


    **Server**nA computer that serves data to other PCs and provides access to network
    resources.


    **Client**nA computer that uses network resources as an end user.


    **Client/server network**nA network that includes both client and server PCs.


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_249_0.png)


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_249_1.png)'
  merge: -1
  pgno: 249
- img_proc: true
  md: '# Introduction to Networking


    > ### NOTE

    A network can have more than one server. Big corporate networks often have lots
    of servers, each with a specific function as file server, print server, Internet
    hosting server, and so on.


    A peer-to-peer network has no central server; each of the client PCs takes on
    a portion of the burden of maintaining the network. For example, instead of a
    server managing the traffic, all the PCs in the network listen for traffic and
    grab any messages that are addressed to them. Instead of a server storing shared
    files, the shared files remain on the client hard disks. Whenever someone wants
    to access them, the client hard disk reads the file and the OS sends it down the
    network pipeline. Small networks (under five computers or so) work very well in
    peer-to-peer formation, but when the number of computers grows beyond that, peer-to-peer
    traffic begins to become too much of a strain on the participating PCs.


    ### Peer-to-peer network

    A network that consists only of clients, with no central server.


    ### Network topology

    The physical layout of a network.


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_250_0.png)


    # Network Topology


    The physical way in which a network is laid out with cabling or wireless connections
    is called the network topology. The topology has nothing to do with whether the
    network has a server or not. In the following pictures, I have made all clients,
    but any of them could just easily have been a server; the server does not need
    to occupy any particular physical spot on the network.


    If you decide to take the A+ exams, you will need to study the various network
    topologies. Briefly, the ones to know include:


    +   **Bus** PCs are arranged in a single line, running from PC to PC in a daisy-chain
    fashion. Messages travel back and forth along the line.


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_250_1.png)'
  merge: -1
  pgno: 250
- img_proc: true
  md: '# Chapter 13


    **Ring** PCs are connected in a circle. Messages travel around the circle to reach
    the intended recipient.


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_251_0.png)


    **Star** PCs all connect to a central gathering point in the center, such as a
    hub. The hub then manages the traffic among them.


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_251_1.png)


    You''ll need to know a lot more about these topologies if you get serious about
    networking, but since we''re just doing the once-over-lightly treatment here,
    let''s leave it at that.


    # Network Operating Systems


    As mentioned earlier, a network server must have a special operating system version;
    it can''t just use ordinary Windows. Microsoft makes special versions of Windows
    designed for servers; for Windows 2000, it''s called Windows 2000 Server. (Catchy
    name, eh?) The high-end version of it is called Windows 2000 Advanced Server.
    A peer-to-peer network doesn''t have a dedicated server, so it doesn''t need a
    special operating system; all the PCs in it can use their regular client versions
    of Windows.


    232'
  merge: -1
  pgno: 251
- img_proc: true
  md: '# Introduction to Networking


    Windows Server is not the only Network Operating System (NOS), however. Novell
    NetWare is another popular NOS. A NetWare server runs NetWare as its operating
    system, but client PCs can run any ordinary operating system that includes NetWare
    drivers in it. (All versions of Windows, for example.)


    # Types of Networks


    One of the reasons that people get stressed out about ''learning networking''
    is that there are so many ways of breaking a network down. So far we''ve looked
    at client/server peer-to-peer, network topology, and network operating system,
    but there is one other way to differentiate networks: the network type.


    Ethernet is the most popular type of network by far, but there are several alternatives
    to including Token Ring and Fiber Distributed Data Interface (FDDI). The network
    type has no direct relationship to the NOS or the topology, but all and NOSes
    will work with all network types. For example, an Ethernet network can use either
    NetWare or Windows Server as the NOS, and it can use the bus or the star topology.


    Network Operating System (NOS)

    An operating system designed to help a server PC access to files, printers, and
    other network resources to client PCs.


    Packet

    A piece of data packaged for network transit, including the data itself plus addressing
    information. Also called a frame.


    # How a Network Moves Data


    From a user perspective, network communications are pretty simple. You hook up
    some PCs and the cables send the data from place to place, just like the buses
    on a circuit board. But there are some complex standards and rules for the way
    data is sent, received, and interpreted. I won''t get too deep into that here,
    but I want you to at least get a feel for the basics of it.


    # Data Packets


    Data is transmitted over a network as bits and bytes translated into electronic
    signals. In preparation for the transmission, the data is divided into segments,
    each having a header and trailer attached (like an envelope for mailing). Every
    unit is called a packet. Data packets are sent as independent units over the network.
    The packet size varies depending on the NOS. When the receiving PC gets the data,
    it strips off the header and trailer and reads the data, just like you would open
    and discard an envelope and read the letter inside.


    # Network Protocols


    Remember how we talked about each piece of hardware speaking its own language
    and needing a driver to translate for it? Networking is the same way. Networks
    require protocols for communication. The protocol determines-


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_252_0.png)


    233'
  merge: -1
  pgno: 252
- img_proc: true
  md: '# Chapter 13


    # TCP/IP


    TCP/IP

    Stands for Transmission Control Protocol/Internet Protocol. A communications protocol
    used on the Internet and in many LANs.


    the type of error checking method; a data compression method; if any; how the
    sending device indicates that it has finished sending a message; and how the receiving
    device indicates that it has received a message.


    When you install a network card in Windows, you also install one or more protocols
    to work with it. The most common protocol in Windows-based networking is **TCP/IP**.
    It is also the dominant protocol on the Internet. However, there are many other
    protocols as well. For example, IPX/SPX is the standard protocol on Novell networks.
    NetBEUI is an older, very efficient protocol (that is, small packet size due to
    smaller headers and trailers) that works well on small networks but is not suitable
    for large-scale network use.


    When you work with the Internet, you encounter other protocols. These are still
    protocols in the sense that they are languages for exchanging data over a network,
    but they do not work directly with your network hardware and do not require drivers
    to be installed for them. They include FTP, HTTP, PPP, POP, IMAP, and SMTP. For
    more information about them see Chapter 19, ''Setting Up Internet Connections.'''
  merge: -1
