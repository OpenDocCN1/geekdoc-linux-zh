  md: '# Understanding the Differences in RAM


    There are lots of different types of RAM on the market today, and even more types
    if you look at the RAM in older systems. The following sections provide an overview
    to help you make sense of them.


    # RAM Banks and Packaging


    Recall from the earlier discussion in this chapter that a RAM chip has a width.
    Sometimes more than one RAM chip is mounted on a stick (that is, a SIMM or DIMM),
    giving that stick a width. For example, if you mount 1-bit RAM chips on a SIMM,
    you get an 8-bit SIMM.


    The width of a bank of RAM must match the PC''s address bus width. Nowadays, a
    single physical piece of RAM can function as a bank by itself because of advances
    in RAM packaging (for example, a 64-bit piece of RAM in a system with a 64-bit
    address bus), but in older PCs this was not always the case.


    Eight-bit SIMMs are the older, 30-pin variety. There are not always physically
    eight chips on one of these SIMMs, because some chips may be able to handle more
    than 1 bit.


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_101_0.png)


    Whenever you see slots for 30-pin SIMMs on a motherboard, they’re always in groups
    of four. All four slots are needed to comprise a single bank.


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_101_1.png)'
  merge: -1
  pgno: 101
- img_proc: true
  md: '# Understanding Memory


    Thirty-two-bit SIMMs are the 72-pin variety. The number and arrangement of chips
    may vary; here are several different 72-pin SIMMs:


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_102_0.png)


    On a motherboard with a 32-bit address bus, a single 72-pin SIMM can make a bank
    by itself. On a motherboard with a 64-bit address bus, two SIMM slots together
    make up a bank. (Systems using an i486 and higher CPU usually have a 64-bit address
    bus.) Here''s a motherboard that contains both 30-pin and 72-pin SIMM slots:


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_102_1.png)'
