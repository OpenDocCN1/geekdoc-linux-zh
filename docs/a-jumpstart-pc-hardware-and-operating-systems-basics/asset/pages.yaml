    # Pentium Pro CPUs


    The Pentium Pro was Intel''s attempt to produce an improvement to the Pentium.
    It included quad pipelining and an on-chip L2 cache.


    One other improvement the Pentium Pro offered dynamic processing. This allowed
    it to run commands out of queue order whenever it stalled waiting for something
    else to happen, optimizing overall throughput.


    The Pentium Pro was optimized for 32-bit operating systems and worked great with
    them, but with a 16-bit operating system like MS-DOS it was actually slower than
    a regular Pentium. It did not support MMX. These drawbacks made it unpopular in
    consumer-level PCs, and they ultimately led to its demise.


    # Pentium II, III, and 4 CPUs


    The last several years have brought newer and better versions of the Pentium.
    They''re light years ahead of their ancestors in performance, but the technology
    behind them is less interesting to study because at this point they''re just improving
    on existing technologies. The designers are making everything progressively smaller,
    faster and lower voltage (so cooler), and they''re coming up with better ways
    to use caches and to support multimedia.


    The Pentium II is basically a fast Pentium Pro with MMX added. Pentium II CPUs
    have an internal speed ranging from 233MHz to 450MHz, and they run


