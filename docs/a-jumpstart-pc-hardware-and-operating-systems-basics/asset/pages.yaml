  md: '# Chapter 16


    # Checklist of File Management Skills


    File


    A collection of computer data stored under a single name.


    Let''s start with the basics. Every Windows user—especially those who aspire to
    being PC technicians—needs a thorough understanding of file, folder, and disk
    structure and management.


    Individual files are organized in folders (which were called directories under
    MS-DOS), and folders are stored on drives. Each drive has a drive letter. You
    can work with folders and files at a command prompt, in Windows Explorer (shown
    here), or in My Computer window.


    Folder


    An organizing container for holding computer files, residing on a disk.


    Windows Clipboard


    A tool for copying and moving data between Windows applications.


    Recycle Bin


    A temporary storage area for files and folders that have been deleted.


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_303_0.png)


    Here''s a checklist of skills to practice:


    **Moving and copying files between folders and disks** There are several methods,
    using Cut/Copy and Paste, drag-and-drop, and Move Copy commands. You need to master
    them all. Familiarize yourself with the standard **Windows Clipboard** and the
    enhanced one in Microsoft Office. Brush up on the Clipboard viewer in Windows
    as well.


    **Deleting files and folders** Again there are several methods, including the
    Delete key, the right-click shortcut menu, and the regular Windows Explorer menu
    system. Always use the **Recycle Bin**, and how to retrieve files from it, empty
    it, and see its properties.


    **Renaming files and folders** Make sure you know the various ways of making a
    name editable, including pressing F2, clicking it, and using the Rename command.


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_303_1.png)


    284'
  merge: -1
  pgno: 303
- img_proc: true
  md: '# Essential Windows Tools and Skills


    **Creating new files and folders** The easiest way is to right-click and choose
    New, but master alternative methods as well, including menu commands and toolbar
    buttons. You should also know how to create new folders from within an Open Save
    dialog box in Microsoft Office.


    **Finding files and folders** You''ll need to know how to use the (Find or Search)
    feature in Windows to locate a file based on its name, contents, creation date,
    size, or any other search criterion. Different versions of Windows handle this
    a little differently, so make sure you study several of them.


    **Setting file management options** Make sure you know how to control the options
    for file management windows (hint: Tools ➤ Options, or in some versions of Windows
    it is View ➤ Options). This includes displaying or hiding file extensions, displaying
    or hiding hidden and system files, and choosing Classic versus Web view.


    **File extension** A code (usually three characters) following a file name that
    indicates the file type. For example, in MYFILE.DOC, the doc extension indicates
    a document.


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_304_0.png)


    # TIP


    For more help with file management in Windows, check out some of the excellent
    Windows books published by Sybex at www.syex.com. I won''t recommend any specific
    book because you''ll want different on the Windows versions you have, but the
    whole Mastering series is especially good. If you have Windows XP, you might like
    my book on the subject: Windows XP: Home Edition Simply Visual (also published
    by Sybex).'
