  md: '# Chapter 17


    # # Introduction tonDevice Resources


    # **Device resources**


    A resource is a tool or commodity that helps you get something done. For example,
    when you want to go out to a movie but you don''t have enough money, you might
    say "you don''t have the resources."


    Pathways or memory addresses that help a device communicate with the CPU and the
    operating system.


    In a computer, device resources are resources that help devices do their jobs—that
    is, communicate with the CPU and the operating system. A device can use four types
    of resources. Not all devices use all of these types.


    # **IRQ**


    Interrupt Request. A system resource assigned to a device so to signal the CPU
    that it is ready to communicate.


    Interrupt Requests (IRQs) IRQs are lines of communication to the CPU. There are
    16 of them in a PC, 0 through 15, but many of them are reserved for built-in system
    devices as the keyboard and the IDE interfaces. They are necessary because the
    CPU must initiate all conversations with devices, but sometimes the device needs
    to "raise its hands to ask for a conversation to be initiated. They do so by sending
    a signal on the interrupt request line, and the CPU responds by initiating a conversation.


    # **I/O address**


    Input/Output addresses in memory where devices place data for pickup by the operating
    system, and where the operating system places data for pickup by the device.


    I/O addresses are addresses, expressed in hexadecimal. They define areas of memory
    reserved for transferring data to and from the device. They are usually written
    using only the last four digits of the full address like this:03E8. They are usually
    expressed as a range of addresses, such as 03E8–03EF.


    # **Memory addresses**


    Memory addresses are also defined in RAM. They define areas of memory reserved
    for the device''s use. They are usually written with eight digits of hexadecimal,
    such as 0A0000, and they are usually expressed as a range, as 00A000–0FFFF.


    # **Direct Memory Access (DMA) Channels**


    These are pathways to a device directly into memory, bypassing the CPU. They are
    not popular anymore because of advances in hardware technology, but they used
    to be employed by devices like the keyboard and the sound card to improve their
    reaction time.


    Each built-in I/O port in a system has resources assigned to. For example, COM1
    uses IRQ4 and I/O addresses 03FB from 03FF. The port uses resources whether or
    not anything is actually plugged into (unless you disable it in the BIOS Setup
    program, that is). This is true for both COM (serial) and LPT (parallel) ports.


    In contrast, the expansion slots on a motherboard do not get any resources when
    they are empty. Instead the system waits until you plug an expansion board one
    of them, and then it assigns resources to that expansion board. For example, you
    might have four PCI expansion slots, and one of them is occupied by


