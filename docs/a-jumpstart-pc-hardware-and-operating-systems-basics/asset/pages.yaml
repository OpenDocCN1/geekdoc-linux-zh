  pgno: 220
- img_proc: true
  md: '# Chapter II


    This drive uses 0.9 amps of +5v power and 0.5 amps of +12v. That''s (0.9×5) +

    (0.5×12), or 10.5 watts.


    Not all devices say so clearly how much they draw, so use this list as a rough,

    onservative estimate:


    +   - A motherboard: 20 to 30 watts


    +   - CPU: 30 watts for Pentium II or III; 65 watts for Pentium 4, 70 watts for

    Athlon


    +   - An AGP video card: 20 to 50 watts


    +   - An average PCI circuit board (including video card): 5 watts


    +   - An average ISA circuit board: 10 watts


    +   - Floppy drive: 5 watts


    +   - CD-ROM drive: 10 to 25 watts


    +   - RAM: 8 watts for every 128MB


    +   - IDE hard drive: 5 to 15 watts


    +   - SCSI hard drive: 10 to 40 watts


    Name-brand PCs usually come with power supplies with adequate wattage, so

    t main occasion for worrying about wattage would be if you were assembling

    a PC from scratch and needed to select the power supply appropriate for the

    components you were going to put into it. The A+ example doesn''t go into

    much depth about wattages—you don''t need to know the specifics for any par-

    ticular device type, for example. The main thing to remember is the formula:

    volts × amps = watts


    # Troubleshooting Power Supply Problems


    A dead power supply is just that: dead. The fan won''t spin; the PC won''t start\dup.
    If you''ve got one of these, swapping out the power supply with a new one is

    first thing to try.


    A partially failing power supply, on the other hand, can cause all sorts of prob-

    lems that do not appear to be directly related, leading the less experienced tech-

    nician on a wild goose chase through memory, processor, motherboard, and

    hard disk errors. When troubleshooting an intermittent problem that seems to

    jump around—for example, a memory problem that reports a different memory

    address as faulty each time, or spontaneous rebooting after a random amount

    time—suspect the power supply.


    A power supply can cause a problem for three reasons: physical failure, over-\loading,
    and overheating.


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_221_0.png)


    202'
  merge: -1
