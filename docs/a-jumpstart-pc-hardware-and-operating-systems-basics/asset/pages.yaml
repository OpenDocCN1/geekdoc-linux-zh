  md: '# Avoiding and Removing Viruses


    Virus


    A program designed to spread itself from one PC to another and (usually) to cause
    damage to the PCs or annoyance to the user.


    Computer viruses have become a real problem in recent years because of the free
    exchange of files over the Internet. The results of having a virus depending on
    the virus. Some simply display a harmless message or play a sound. Some activate
    only on certain dates. Others destroys the master boot record on the disk, erase
    certain files, corrupt the FAT, or even flash-erase the EEPROM. Other viruses,
    especially those that spread via e-mail, send themselves to everyone in your address
    book without your permission.


    > A Trojan horse is a variant of a virus. The name comes from the old myth about
    the big wooden horse that hid the Trojan soldiers. A Trojan horse program pretends
    to be something useful, like a game or a video clip, but depretends to be something
    useful, like a game or a video clip, but harms your PC.


    There are only two ways to get a virus:


    +   * Boot from an infected disk

    * Run an infected program


    It''s simple to avoid the first one—just don''t boot from an unchecked floppy
    disk.


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_329_0.png)


    # WARNING


    If you accidentally leave a floppy disk in your drive and see an error at startup
    that says to remove the disk and press any key to continue, don''t do that. Instead,
    press the Reset button on the PC. If floppy contained a virus, the virus will
    have already transferred it into memory by the time you see that message. By resetting
    the PC, you dump the memory contents and start over.


    It can be more complicated to avoid running infected programs, however, not all
    programs look like programs on the surface. For example, some viruses spread as
    Visual Basic scripts (with a .vbs extension) or as Word macros. When you open
    a document that contains a macro virus, the macro runs and infect your system.
    To further camouflage themselves in e-mail attachments, some viruses have double
    extensions, such as gotimes.jpg.vbs. The ''real'' extension is the


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_329_1.png)


