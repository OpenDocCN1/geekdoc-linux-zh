- img_proc: true
  md: '# Introduction to Networking


    # Networking Hardware


    Now that your head is probably swimming with all the networking terminology and
    concepts you''ve just learned, let''s turn to the practical side of things: the
    hardware you need to buy and install in order to create a network.


    # Network Interface Card


    Each computer in the network needs a network interface card (NIC). This can be
    a circuit board inserted in a motherboard slot, an external USB device, or a PC
    Card in a notebook PC.


    The NIC must be matched to the network type. So, for example, if you are creating
    an Ethernet network, you need an Ethernet NIC. There are several sub-types of
    Ethernet, each with a different top speed, so when buying a NIC you must make
    sure you get the right type. The most popular by far is 100BaseT, which can transmit
    data at up to 100MB/sec. An earlier version of it was 10BaseT, which had a top
    rate of 10MB/sec. Most NICs for sale today advertise themselves as 10/100BaseT,
    which means they can work on either speed of Ethernet network. Both have the same
    type of cable connector on them-an RJ-45 jack, which looks like a wide telephone
    connector. Here''s a picture of a 10/100BaseT NIC:


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_254_0.png)


    An older type of Ethernet was 10Base2. It transmitted data at a lower speed and
    used coaxial cable (similar to the kind used for cable TV).


    > NOTE\NICs can be wired or wireless. Wireless networking connects the networked
    PCs using radio waves rather than cables. If you have a wireless NIC, you must
    also have a wireless access point or wireless router for it to communicate. More
    about those later.'
  merge: -1
  pgno: 254
- img_proc: true
  md: '# Hub


    Most networks these days use a form of the star topology for connecting PCs in
    a LAN. Sometimes several small stars are connected together, either in a larger
    star or in a bus arrangement. Recall that a star topology has all the PCs connecting
    to a central point called a hub.


    In my small peer-to-peer network in my home office, I have two PCs connected full-time
    plus a notebook PC that I connect occasionally. I have a small hub into which
    each of the PCs connects, and then they can all communicate with one another as
    if they were all individually connected to each other. Here''s a picture of my
    hub. Large networks have much bigger ones, and even entire closets full of hubs
    and other expansion devices such as routers and gateways. (See the section "Expansion
    Devices" later in the chapter to learn more about those.)


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_255_0.png)


    # Cables


    Assuming you''re working with a wired network rather than wireless, you will need
    some cables. As I mentioned earlier, most Ethernet adapters these days use cables
    with RJ-45 connectors on them.


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_255_1.png)


    This type of cable is called twisted-pair because inside the casing are pairs
    of wires twisted together. It can either be shielded (that is, protected from
    EMI) or unshielded. Unshielded is the most common type.'
  merge: -1
  pgno: 255
- img_proc: true
  md: '# Introduction to UTP


    Unshielded twisted-pair cabling can be further broken down into categories. You
    may have heard someone talk about ''Cat-5 cabling''-that refers to Category 5
    twisted-pair cabling. You don''t need to know the specifics of each category;
    just know that as the numbers go up, the speed at which the cable can transmit
    data increases. Standard telephone cable is Category 1; it can''t be used for
    data. The other categories (2 through 6) are all made for data and transmit data
    between 4Mbps and 155Mbps. A 10BaseT network can use category 3, 5, or a 100BaseT
    network must use category 5 or 6.


    Other types of cable are utilized in networking too, but not as often. For example,
    older Ethernet networks might use coaxial cable, and high-priced, high-speed networks
    might use fiber optic cable.


    # Router


    A traffic director box on a network that allows data addressed to a PC on a network
    segment pass through to segment while blocking other traffic from entering.


    # Expansion Devices


    For a simple peer-to-peer network, all you need are the NICs, the hub, and the
    cable. If you starting together more complex networks with lots of clients and
    servers located in various departments, you''need expansion devices to manage
    things. A hundred computers can''t connect to the same hub, for example, and you
    wouldn''t want them to become the amount of traffic would be burdensome. Instead,
    you would probably break the network into small workgroups of less than a dozen
    PCs each and then connect the workgroups together.


    A hub sends all the traffic to all PCs connected to it, but you can get better
    network performance by assigning each PC a specific address and keeping the traffic
    within that network separate from the outside traffic. Routers are hub-like devices
    that intelligently manage the traffic flow, so that only traffic addressed to
    a PC on a particular segment gets routed into it.


    # Gateway


    A network box that can translate and transfer data between unlike network systems.


    Networks can connect with other networks of a Token Ring network, for example,
    or to a Macintosh computer network, you need a device that can translate between
    the two systems: a gateway.


    # Wireless Networking


    The latest thing in local area networking is wireless Ethernet, a.k.a. IEEE 802.11b
    (another catchy). It works just like regular Ethernet without the cables. Each
    PC has a wireless NIC, and somewhere within a few hundred of the PC is a wireless
    access point, which is like a hub or router. The PC and the access point exchanges
    signals via a type of radio wave. The wireless access point typically has a connector
    for hooking into a regular network, so a network can use both wired and wireless
    technologies for different PCs.


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_256_0.png)'
  merge: -1
