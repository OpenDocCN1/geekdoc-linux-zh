    An older AT power supply will have the power switch for the PC built into the
    power supply itself. The switch is mounted on the inside of the case with screws;
    when you replace the power supply on an AT system, you must detach the switch
    from the case. Newer models have four plastic-coated leads on an AT power supply
    instead of the actual switch, and instead of removing the whole


    38'
