  md: '# Types of Memory


    "Memory" is a very generic term. It means any chip or other circuitry that stores
    data as its primary function. In everyday use, the term memory has come to be
    synonymous with Random Access Memory (RAM), but there are actually two types:
    RAM and ROM.


    ROM

    Stands for Read-Only

    Memory. A memory chip

    that can be read but not

    written to.


    # Read-Only Memory (ROM)


    Read-Only Memory is just what it sounds like: a memory chip that is read-only.
    You can''t change what''s on it (except by special means, which I''ll discuss
    in a moment). ROM is used in situations where the data is essential to system
    operation and does not change on a day-to-day basis. We''ve already talked about
    one example of ROM—the BIOS chip on the motherboard. Another example is the operating
    system on a PDA (Personal Digital Assistant).


    As mentioned in Chapter 3, ''A Closer Look at the Motherboard,'' sometimes an
    older BIOS can cause problems because it doesn''t recognize some new device or
    feature. In such cases, it''s useful to update the BIOS. On older systems, the
    only way to update the BIOS is to replace its ROM chip with a different ROM chip.
    However, newer motherboards include ROM variants that enable you to change what''s
    on the chip with specialized software.


    There are several types of ROM. The differences between them are primarily in
    if and how they can be modified.


    +   - Programmable ROM (PROM) A ROM chip that cannot be modified in any way.


    +   - Erasable Programmable ROM (EPROM) A ROM chip that can be erased and rewritten
    with ultraviolet light. This is also called Flash ROM because of the flash of
    light to erase it.


    +   - Electrically Erasable Programmable ROM (EEPROM) A ROM chip that can be erased
    and rewritten with an electrical charge. This is the most common type of ROM used
    for BIOS chips.


    > NOTE EPROM and EEPROM are both referred to as Flash ROM, even though only the
    EEPROM is modified with light.


    To update an EEPROM, you download a utility and an update file from the motherboard
    manufacturer containing it. You boot from a floppy disk containing the utility,
    which sends the specialized electrical pulses to the


