  md: '# A First Look at the Inside


    When you remove the cover, you''ll find a complex system of circuit boards and
    cables inside. Don''t let this intimidate you. In the following sections, we''ll
    break down each area and see what it contains.


    ![](img/e4cc2c51a02d134f2b6b98075a06643f_43_0.png)


    # Motherboard


    Let''s start with the large circuit board on the floor of the case—the motherboard.
    It''s called the motherboard because all other components plug into it, and so
    are "children" of it. Other names for it include main board, system board, and
    planar board.'
