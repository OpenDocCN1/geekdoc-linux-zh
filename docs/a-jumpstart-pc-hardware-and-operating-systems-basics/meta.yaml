  md: '# # Chapter 13

    # Basic Network Concepts


    In the next several pages, I''ll run through some networking vocabulary words
    that you might hear thrown about, and I''ll break down networking in several different
    ways so you can see how an average network fits together. You''ll need to know
    this stuff if you decide to take the A+ exams.


    A **network** is a group of computers connected together so they can share resources
    such as hard disks and printers. A network can also serve as a conduit to other
    resources. For example, you can share an Internet connection over a network, so
    that all the PCs in the network can take advantage of the same single high-speed
    connection. The Internet is really just a big file-sharing system, after all—a
    way of linking up millions of networks to one another.


    A **Local Area Network (LAN)** is a network in which the computers are located
    near one another. "Near" is rather subjective here; some people consider a network
    a LAN if all the PCs are located in the same building, for example, while other
    people would say a LAN exists if the computers are in adjacent buildings as well.
    A **Wide Area Network (WAN)** is a network where the computers are not near each
    other. The Internet is the biggest example of that.


    # ## Peer-to-Peer versus Client/Server


    There are two basic network architectures: client/server and peer-to-peer.


    A **server** is a computer that exists only to serve the needs of the other computers
    in the network. It manages the network traffic between the **client** PCs (that
    is, the PCs that are in everyday use by end users) and serves as a central storage
    repository for files that users want to make available to other users. A **client/server
    network** is a network that includes one or more servers and one or more clients.
    Almost all business networks are client/server. The advantage is that the server(s)
    handle the network overhead, so the client PCs'' performance does not suffer.
    The disadvantages are that you must have at least one PC set aside to be the server
    and it must have a special server version of the operating system.


    ![](bbox=[0.48, 0.66, 0.78, 0.75])


    +   - **Network**: Two or more computers connected together to share resources.

    - **Local Area Network**: A network in which all the resources are located near
    one another.

    - **Wide Area Network**: A network in which resources are separated physically
    from one another (not in the same building).

    - **Server**: A computer that serves data to other PCs and provides access to
    network resources.

    - **Client**: A computer that uses network resources as an end user.

    - **Client/server network**: A network that includes both client and server PCs.'
  merge: -1
  pgno: 249
- img_proc: false
  md: '# # Introduction to Networking


    > **NOTE**


    A network can have more than one server. Big corporate networks often have lots
    of servers, each with a specific function such as file server, print server, Internet
    hosting server, and so on.


    A **peer-to-peer network** has no central server; each of the client PCs takes
    on a portion of the burden of maintaining the network. For example, instead of
    a server managing the traffic, all the PCs in the network listen for traffic and
    grab any messages that are addressed to them. Instead of a server storing shared
    files, the shared files remain on the client hard disks. Whenever someone wants
    to access them, the client hard disk reads the file and the OS sends it down the
    network pipeline. Small networks (under five computers or so) work very well in
    peer-to-peer formation, but when the number of computers grows beyond that, peer-to-peer
    traffic begins to become too much of a strain on the participating PCs.


    **Peer-to-peer network**


    A network that consists only of clients, with no central server.


    **Network topology**


    The physical layout of a network.


    ![](bbox=[0.15, 0.44, 0.57, 0.52])


    # # Network Topology


    The physical way in which a network is laid out with cabling or wireless connections
    is called the **network topology**. The topology has nothing to do with whether
    the network has a server or not. In the following pictures, I''ve made them all
    clients, but any of them could just as easily have been a server; the server does
    not need to occupy any particular physical spot on the network.


    If you decide to take the A+ exams, you will need to study the various network
    topologies. Briefly, the ones to know include:


    **Bus**  PCs are arranged in a single line, running from PC to PC in a daisy-chain
    fashion. Messages travel back and forth along the line.


    ![](bbox=[0.08, 0.78, 0.68, 0.86])'
  merge: -1
  pgno: 250
- img_proc: false
  md: '**Ring** PCs are connected in a circle. Messages travel around the circle to
    reach the intended recipient.


    ![](bbox=[0.41, 0.127, 0.78, 0.36])


    **Star** PCs all connect to a central gathering point in the center, such as a
    hub. The hub then manages the traffic among them.


    ![](bbox=[0.41, 0.45, 0.78, 0.68])


    You''ll need to know a lot more about these topologies if you get serious about
    networking, but since we''re just doing the once-over-lightly treatment here,
    let''s leave it at that.


    # Network Operating Systems


    As I mentioned earlier, a network server must have a special operating system
    version; it can''t just use ordinary Windows. Microsoft makes special versions
    of Windows designed for servers; for Windows 2000, it''s called Windows 2000 Server.
    (Catchy name, eh?) The high-end version of it is called Windows 2000 Advanced
    Server. A peer-to-peer network doesn''t have a dedicated server, so it doesn''t
    need a special operating system; all the PCs in it can use their regular client
    versions of Windows.'
