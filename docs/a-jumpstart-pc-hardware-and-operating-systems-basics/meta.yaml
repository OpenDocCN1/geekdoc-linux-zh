  md: '![](bbox=[0.05, 0.04, 0.88, 0.44])


    Parity makes RAM more accurate, but it also adds overhead. Parity-type RAM was
    popular in earlier days when RAM was not very accurate or dependable, but these
    days it is not needed, and most systems do not require parity-type RAM. (Some
    systems are flexible and allow it to be used but do not require it.)


    # RAM Capacity


    Recall again that RAM has a width and a depth. Multiplying the two together gives
    you its capacity. For example, you might find an old 30-pin SIMM that''s marked
    4×8-70. That means it is 4 megabits (1,048,676 bits) in depth and 8 bits in width,
    and 70 nanoseconds in speed. Multiplying those two numbers together produces 33,667,632
    bits. Divide that by 8 to determine the number of bytes, and you get 4,194,704
    bytes. So it''s a 4MB stick of RAM.


    The width and depth measurements used to be important in older systems, where
    you could not assume a particular width. However, with the advent of 72-pin SIMMs,
    all SIMMs had a 32-bit width so the width measurement was no longer much of an
    issue. On 72-pin SIMMs, you will commonly see ×32 or ×36 in the measurement, as
    in 4×32 or 4×36. Both represent the same amount of memory, but the ones with ×36
    are parity memory, and therefore have an extra 4-bit width for the parity chip.
    You can assume that a 168-pin DIMM is 64 bits in width. Parity chips are not used
    in DIMMs.'
