    delete the affected files.


    **Broadband** High-speed connection to a network resource (usually refers to the
    Internet).


    **Aperture grille** A system of vertical wires that help guide the electrons so
    they hit the correct phosphors on a CRT.


    **Bus** A pathway between two or more components on the same circuit board.


    **API** Application Programming Interface. A set of standards that programmers
    can use to access the features of a piece of hardware in their programs.


    **Cache** A temporary holding area for data that needs to be kept close at hand
    for reuse.


    **ATA** AT Attachment. A standard for IDE drives in PCs that makes it possible
