    supported some new features, including virtual memory and virtual 8086.


    > **286 protected mode**


    An operating mode for an 80386 CPU that emulates an 80286 CPU.


    Starting with the 386, Intel began using an "I" at the beginning of the number,
    creating a trademarkable name. So we begin to see "I386" or "i386" on Intel brand
    CPUs.


    > **386 protected mode**


    An operating mode for an 80386 CPU that takes advantage of the 80386''s advanced
    features, but is incompatible with programs written for earlier CPUs.


    **Virtual memory** made it possible to use part of a hard disk to simulate extra
    RAM. This allowed a computer able to run programs that required more RAM than
    it physically had. **Virtual 8086** made it possible to multitask—that is, run
    several programs at once—by creating multiple virtual 8086 processors and running
    a separate program on each one. Even though each processor could run only a single
    program at a time, collectively a 386 system could run several programs at once.


    > **Virtual memory**


    Using the hard disk to simulate RAM.


    Not all motherboards at that time were 32-bit, because 32-bit motherboards were
    still rather expensive. Therefore, a variation on the 80386 chip was introduced
    called the 386SX, which was just like a regular 386 but had a 16-bit external
    data bus and a 24-bit address bus. It offered most of the benefits of a 386, but
    it could work on a motherboard designed for a 286.


    > **Virtual 8086**


    Using a single CPU to simulate multiple 8086 CPUs so several tasks can run concurrently.


