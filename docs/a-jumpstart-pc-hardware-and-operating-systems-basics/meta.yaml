  md: '# # Accessing Shared Network Resources


    Now let''s look at the other side of the equation: accessing the resources that
    someone else has shared. The sharer will have already gone through the sharing
    procedures described in the preceding section, so all you need to do is tap into
    those resources.


    # ## Accessing Shared Folders


    One way to access a shared folder is to browse the network until you find what
    you want. The Network Neighborhood (a.k.a. My Network Places) is just like My
    Computer, except it''s for the network rather than your local PC. Just keep double-clicking
    icons in it to move to the workgroup, then computer, then drive, and then folder
    that you want to see. Here''s a look at the available shared resources (both folders
    and printers) on a particular PC, for example:


    ![](bbox=[0.408, 0.49, 0.838, 0.688])


    If there''s a particular network location you use frequently, you can create a
    shortcut for it on your Desktop just as you would create a shortcut for any local
    file. Right-drag it to the Desktop, and choose Create Shortcut(s) Here from the
    menu that appears. You can also create network shortcuts with the Add Network
    Place Wizard in the My Network Places folder or the Network Neighborhood folder.


    You can also create a shortcut from within an application. Most 32-bit Windows
    applications enable you to choose Network Neighborhood or My Network Places from
    their Look In and Save In drop-down lists in the Open and Save As dialog boxes,
    respectively. From there you can select a network location as easily as you can
    a local folder.'
