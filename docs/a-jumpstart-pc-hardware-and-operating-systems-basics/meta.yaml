    # Chapter 9

    Working with Floppy Disks


    Entire shelves at the local office supply store are devoted to blank disks of
    every type, size, and specification. The following sections help make sense of
    the choices and explain how to care for the disks you buy.


    # Selecting Floppies


    Floppy disks are simple to select because there''s only one kind left on the market
    today: 3.5-inch high-density 1.44MB capacity ones. All the other standards and
    sizes have been obsolete for many years. You might run across some LS-120 (super
    disk) floppies for sale, but they''ll be much more expensive (around $1 per disk).


    The only decision to make when selecting floppies is whether to buy the ones that
    are preformatted for IBM-compatible PCs. The preformatted ones are more expensive,
    but they can save you some time in formatting. The unformatted ones must be formatted
    before you can use them (just like a hard disk must be), and it takes about 1-2
    minutes to do so.


    # Formatting a Floppy


    As I mentioned earlier, you can buy preformatted floppies or you can buy unformatted
    ones and do it yourself. The latter is a little cheaper.


    When you format a floppy, you perform both a low-level and high-level format on
    it with a single operation. After a floppy has been formatted once, you can do
    a **quick format** on it if you ever want to reformat it. A quick format is quick
    because it''s just a high-level format that just erases the FAT, rather than doing
    anything to the data area of the disk.


    To format a floppy from a command prompt:


    +   1. Type **FORMAT A:** and press Enter. That''s assuming, of course, that your
    floppy drive is drive A:.


    > **NOTE**

    There are lots of parameters you can add to the basic command, but you shouldn''t
    need most of them. If you''re interested, type **FORMAT /?** and press Enter to
    see the full list. One you might try is /Q for Quick format on a disk that has
    already been formatted once. The full command would look like this: FORMAT A:
    /Q.


