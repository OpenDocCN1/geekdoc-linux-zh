  md: '# # Chapter 8


    # ## Step 5: Set Up the BIOS


    On almost all PCs today, the BIOS setup program can automatically detect a new
    drive without any intervention on your part. You just turn on the PC and a message
    scrolls by during normal startup about the BIOS setup having been updated.


    However, if you want to check to confirm that the drive has been identified in
    the BIOS setup, enter your BIOS program (refer back to Chapter 3, “A Closer Look
    at the Motherboard,” if needed) and find the list of installed IDE devices. If
    the new hard drive does not appear on the correct IDE bus (Primary Master, Primary
    Slave, Secondary Master, or Secondary Slave), the BIOS has not detected it.


    ![](bbox=[0.38, 0.32, 0.89, 0.58])


    If the BIOS doesn’t detect the drive, one of the following is going on:


    +   - The drive is physically bad.

    - The ribbon cable is bad.

    - The ribbon cable is connected with the red stripe pointing the wrong direction
    at one or both ends.

    - The ribbon cable isn’t firmly seated at one or both ends.

    - The power supply connector is not firmly seated.

    - The BIOS program has been manually set to None for that IDE position, and it
    needs to be set to Auto so it can detect the drive.


    All of these are physical problems except the last one. If the BIOS setup reports
    None for the IDE position where the drive is installed, look for a Detect IDE
    feature in the BIOS, or try setting the drive type for that position to Auto.


    Then reboot. If you don’t see anything on the screen about the new drive being
    detected, return to BIOS setup and check it out. When BIOS setup sees the new
    drive, it’s physically installed correctly and ready to be prepared for use.'
  merge: -1
