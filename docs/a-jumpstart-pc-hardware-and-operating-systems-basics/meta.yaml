  md: '# Boot Sectors


    Each high-level formatted disk has a **boot sector**, which is a sector near the
    center of the disk reserved for boot files (that is, startup files). When a disk
    is bootable, that sector contains instructions for processing the startup routine
    for the operating system. When a disk is not bootable, that area is empty.


    When a PC starts up, it checks the disk drives in an order specified by the BIOS,
    looking in the boot sector for the files needed to help it load the operating
    system. (You''ll learn more about starting up a PC in Chapter 15, "Starting Up
    a PC.") If it finds the needed information, it tries to boot from that disk. If
    it doesn''t, it moves on to the next disk on its list.


    > **Boot sector**

    A reserved sector on the disk for commands that load an operating system when
    the PC starts up.


    > **File Allocation Table (FAT)**

    A table that keeps track of the content of each sector of the disk. The operating
    system consults the FAT whenever it needs to open or save a file.


    # File Allocation Tables (FATs)


    The **File Allocation Table (FAT)** is a table that tracks the content of each
    sector in the drive''s root directory. It''s stored on a reserved section of a
    disk, and the operating system knows where to look for it.


    The FAT is important because it provides the operating system with a central point
    of reference when opening and saving files. It''s like a card catalog in a library.


    Because each sector holds only 512 bytes, almost all files occupy more than one
    sector. A file does not necessarily use a group of contiguous sectors. Remember,
    part of "random access" is that each area is just as easily accessible as any
    other area, so a file could store its data in little pockets all over the disk
    just as easily as all in one place. When the operating system calls for the file,
    the read/write head jumps around picking up the pieces of that file and sends
    them to the operating system. It knows where to look for those pieces because
    of the data in the FAT.


    When you open a file stored on a disk, it''s like a game of telephone: the operating
    system consults the FAT, and then tells the drive controller to retrieve information
    from a specific sector. The drive controller tells the actuator arm, which moves
    the head, which reads the data and sends it back to the controller, which relays
    it to the operating system. It''s the same basic process when you write to a disk.


    Because the File Allocation Table is so important, two copies of it are stored
    on the disk; they are synchronized with one another. If the two copies don''t
    match, a utility such as ScanDisk (or Check Disk in Windows XP) can identify and
    correct the error. The FAT does not keep track of the location of every file on
    the whole disk; it''s in charge only of the root directory, and any files and
    folders stored directly therein. Each directory (folder) is then in charge of
    keeping its own mini-FAT detailing its own content.'
  merge: -1
  pgno: 150
- img_proc: false
  md: '# Chapter 7


    > Root directory

    The top-level or main storage area on a disk, not associated with any particular
    folder.


    ![](bbox=[0.27, 0.09, 0.34, 0.19])


    # NOTE


    FAT in the sense of “File Allocation Table” is different from FAT16 or FAT32 referring
    to a specific type of FAT. All operating systems have some type of FAT in a generic
    sense, in that they all keep track of data stored on disks. MS-DOS and Windows
    95 supported a 16-bit FAT known as FAT16, sometimes just called FAT. Windows 98
    and Me supported both FAT16 and a new 32-bit version called FAT32. Windows 2000
    and XP support FAT32, but they also support a completely different type of FAT
    called NT File System (NTFS).


    # Root Directories


    Each high-level formatted disk has a **root directory**. The root directory is
    like the lobby of an office building—when you’re there, you’re in the building,
    but not in any particular office. Similarly, when the root directory is active,
    the drive is active, but not any particular folder on it.


    The root directory can contain files and folders. Files stored directly in the
    root directory are like people standing in the lobby. Folders in the root directory
    are like office suites. Folders can, in turn, hold files, or they can hold subfolders
    (which are like individual rooms within a company’s office suite).


    The root directory is important because the File Allocation Table keeps track
    only of the root directory’s content, sort of like the lobby of a building listing
    only the names of the companies that have offices in it, not the names of all
    the individual employees. When a program references a file, it references a complete
    path to it, such as C:\Windows\win.ini. The operating system sees C: and knows
    it needs to query the C: drive. The C: drive’s FAT sees \Windows and directs the
    request to the Windows folder. The Windows folder has its own internal listing
    of its contents and is able to direct the operating system to the win.ini file.'
  merge: -1
