  md: '# Correcting Windows Problems


    "It doesn''t work right." That''s 90 percent of what you''ll hear, day after day,
    if you become a professional PC technician. Your challenge is to figure out what
    the customer means by that, and to fix it.


    In working with computers, a fix is always possible—it''s just a question of how
    drastic you have to get to fix it. No matter how badly a Windows installation
    is screwed up, you can always reformat the drive and start over with a fresh install,
    and just about any hardware piece that breaks can be replaced. The difference
    between a mediocre PC technician and a really great one is not that one gets the
    job done and the other doesn''t—anyone can get the job done eventually. The really
    great technician can do it faster and avoid overkill by trying the simple solutions
    first before resorting to the big time-consuming solutions like reinstalling everything.


    In the following sections, I''ll list some of the most common things that go wrong
    in Windows and provide some suggestions for troubleshooting them. The best teacher
    for this stuff is everyday experience, though, so I encourage you to dive into
    fixing as many PCs as you can to hone your skills. Just put the word out to friends
    and relatives that you are interested in fixing their computers for free, and
    soon you''ll have more dinner invitations than you can handle.


    > NOTE


    Sometimes distinguishing between a problem with Windows itself and a problem with
    an individual application can be tough. The line between them is rather fuzzy,
    especially with programs that load automatically at startup. The following sections
    do not draw a sharp dividing line between the two because you won''t always know
    which is the problem in real-life troubleshooting.


    # System Lockup with Frozen Mouse Pointer


    When Windows locks up completely, such that you can''t even move the mouse pointer,
    there''s not much hope for a normal shutdown. The only thing you can do is press
    the PC''s power button to shut it off, and then restart. This type of error is
    more common in Windows 9x than in Windows 2000/XP because Windows 2000 and XP
    run each 32-bit application in its own separate space.'
  merge: -1
  pgno: 332
- img_proc: false
  md: '# Chapter 18


    After an abnormal shutdown, you should run Scandisk (or Check Disk) to make sure
    no file system errors have been created. Some versions of Windows run Scandisk
    automatically when starting up after an abnormal shutdown.


    Once you''re back in, look for the underlying problem causing the error. Some
    reasons for this type of problem might include:


    **Corrupt or incompatible video driver** &nbsp;&nbsp;Download and install the
    latest version.


    **Conflicting or poorly written programs loading at startup** &nbsp;&nbsp;This
    is a problem I have quite often with my beginner-level clients—they''re suckers
    for any "free offers" they see on the Internet, many of which download little
    programs that load at startup and clog things. Clean out the Startup folder on
    the Start menu, and use Add/Remove Programs to remove as many of the nonessential
    installed programs as possible. If needed, use MSCONFIG to turn off certain programs
    from starting automatically to figure out which is causing the problem.


    **Overheating** &nbsp;&nbsp;If the system locks up after somewhere between 5 and
    30 minutes of operation, and it seems to be random, I suspect a faulty cooling
    fan on the CPU. Make sure the fan is spinning and firmly attached to the CPU.
    Also make sure there are no missing backplates or drive bay covers that could
    be changing the airflow through the case.


    **Bad or incompatible RAM** &nbsp;&nbsp;The wrong kind of RAM (wrong speed, non-ECC
    in an ECC system, etc.) can cause random lockups, as can bad RAM. Check the motherboard''s
    RAM requirements, and use a hardware diagnostic program to check the installed
    RAM for errors.


    # System Lockup with Operational Mouse Pointer


    If you still have control over the mouse pointer but nothing else seems to be
    working, you might be able to do a controlled shutdown and restart. This is advantageous
    whenever possible because it minimizes the possibility of file system errors.
    See the section "Doing a Controlled Shutdown" later in this chapter.


    As for fixing the problem, it may be a one-time thing. Just go about your business,
    and see if it happens again. If it does, refer to the troubleshooting suggestions
    in the preceding section. If it happens only when you run a certain application,
    try removing and reinstalling that application, or checking the manufacturer''s
    website to see whether a patch is available for it.'
