  md: '# Printing Basics


    # Cleaning a Printer


    All printers tend to accumulate paper particles and dust inside, and they must
    periodically be cleaned to remove it. The best tool for this job is a soft cloth;
    don''t use a vacuum because the toner particles can get through the vacuum filter
    and circulate in the air, where people could breathe them in and get sick. You
    will probably want to wipe down the outside of the printer casing as well occasionally,
    if only for cosmetic reasons, and make sure no dust balls are accumulating near
    the vents.


    Some printers have specific cleaning routines or features. For example, some Hewlett
    Packard laser printers have a cleaning procedure that involves running a sheet
    of paper through the printer so that a uniform layer of black toner is printed
    on it, and then running the same sheet back through again. This removes excess
    paper and toner particles on the fusing assembly.


    Some laser printers have a removable felt pad on a plastic mounting that you must
    change every time you change the toner cartridge. (For such printers the felt
    pad comes with the new toner, so you don''t have to buy the pad separately.)


    Inkjet printers periodically must have their inkjets cleaned to ensure smooth
    operation. In the printer''s manual, you should be able to find instructions for
    running this cleaning utility by pressing certain buttons on the printer in a
    certain order. You can also initiate the cleaning from Windows through the properties
    for the printer driver.


    Print quality problems such as white or black streaks on the page of a laser printer''s
    output are often caused by dirty corona wires. As you learned earlier in the lesson,
    the primary corona applies the negative charge to the drum and the transfer corona
    applies the positive charge to the paper. The primary corona is usually inside
    the toner cartridge; the transfer corona is somewhere near where the paper enters.
    One, both, or neither may be accessible, depending on the model. (In some newer
    models, the functions of the corona wires have been taken over by other technology,
    so they don''t exist. Check your manual.) If a corona wire is accessible, you
    can clean it either with a special cleaning tool or with an alcohol-dipped cotton
    swab. Be very careful, though; too much pressure and the wire will break.'
  merge: -1
