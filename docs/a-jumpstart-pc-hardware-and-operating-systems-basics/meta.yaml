  md: '# Chapter 7


    Two kinds of formatting must be done to a disk before you can use it for data
    storage: physical (low-level) and logical (high-level).


    When you format a floppy disk, either in Windows or DOS, the Format command performs
    both physical and logical formatting at the same time. However, with a hard disk,
    the Format command does only the logical format. The physical, low-level format
    must be done at the factory or performed by using a special utility from the drive
    manufacturer.


    A low-level format creates the sectors and the gaps between them (which are something
    like the blank spaces between songs on an audio recording). It also writes all
    the usable data areas with a placeholder value. You will probably never need to
    perform a low-level format on a hard disk because they come preformatted these
    days, but should the need ever arise (to repair a disk that has become unreadable,
    for example, or for security purposes), you should acquire a utility from the
    drive manufacturer to do it, rather than relying on a generic utility. That''s
    because different drive makers handle low-level formatting differently.


    ![](bbox=[0.505, 0.432, 0.712, 0.598])


    After a hard disk has been low-level formatted, it must be partitioned before
    it can be high-level formatted. Partitioning a drive allows more than one operating
    system to exist on a drive, each on its own partition. But even if you have only
    one operating system to install, you must still create at least one partition.


    After partitioning a drive, you can use the Format command (or the Format utility
    in Windows) to perform a high-level format on the disk. This operation writes
    some housekeeping features to the disk, such as the boot sector, two copies of
    a File Allocation Table (FAT), and a root directory. These features allow the
    operating system to interact with the disk, store files on it, and avoid any defective
    spots. The following sections explain each of those items in more detail.


    ![](bbox=[0.422, 0.882, 0.825, 0.968])'
  merge: -1
