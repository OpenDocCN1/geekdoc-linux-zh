  md: '# # Selecting and Configuring a Sound Card


    **Sound card**

    An expansion board that functions as a converter between analog sound and digital
    data, enabling the computer to generate and receive audio output and input.


    A **sound card**, like a modem, is also an analog-to-digital (and digital-to-analog)
    converter. It takes digital sounds from the operating system and its applications
    and converts them into sounds that play through the speakers, and it takes input
    from a microphone and converts it into binary data that can be stored in a file.


    To hear the sounds from a sound card, you must plug a speaker (or a set of speakers)
    into it. These speakers are usually designed specifically to work with computers,
    and they are EMI shielded in a way that normal speakers (i.e., the kind for a
    regular stereo system) are not.


    **Waveform**

    A sound that originates in the real world, rather than being originated by a computer.


    # ## Waveform and MIDI Sounds


    A sound card can play and receive two types of sounds: waveform and MIDI. **Waveform**
    sounds originate in the "real world." For example, suppose you take a microphone
    and plug it into your sound card, and then you use it to record a musician playing
    a song, a bird singing, or a friend telling a joke. You have made a waveform recording.


    **MIDI**

    Musical Instrument Digital Interface. An interface and method for creating sound
    and music files entirely digitally, with no analog origin.


    In contrast, **MIDI** sounds originate in the computer. Suppose, for example,
    you buy an electric musical keyboard and hook it up to your PC''s sound card.
    When you press a key, the keyboard sends digital signals to the sound card, which
    converts it to audio sound and plays it through the speakers. The entire process
    is digital—there is no conversion of analog audio to digital format.


    It''s important to note that waveform versus MIDI refers to the original source
    of the sound, not its current status. For example, if you buy the latest audio
    CD by your favorite diva, the music on the CD is digital. When you play it back
    on your PC or stereo, it continues to be digital up until it''s channeled through
    the speakers into the air. That doesn''t make the CD a MIDI recording. It is still
    waveform because there was a real-life singer with real-life instruments who sat
    in a studio and made music into the air as the origin of the recording.


    **FM synthesis**

    A method of computer simulating the sounds of various musical instruments. Results
    in artificial-sounding MIDI music.


    Now, why am I telling you all this? Because different sound cards handle different
    types of audio files with varying degrees of finesse. Waveform audio is easy to
    play back, but MIDI audio is more challenging, and a higher-quality sound card
    will make for much more natural-sounding MIDI playback than a cheaper one. See
    the following section for more shopping tips for sound cards.


    ![](bbox=[0.1, 0.86, 0.2, 0.94])'
  merge: -1
  pgno: 201
- img_proc: false
  md: '# # A Look at Some Expansion Boards


    # # Types and Features


    Throughout the history of sound cards, they have all been internal models, either
    on expansion boards or built into the motherboard. However, Creative Labs recently
    came out with an external sound card (actually it''s not a card at all, more like
    a box) that connects to the PC via USB port. Because it''s external, it isn''t
    subject to the constraints of the PCI or ISA bus and will work on any PC with
    USB support—even a notebook PC. It''s pretty cool—but also pretty high-end and
    overkill for most people.


    Assuming you go with an internal model, you''ll probably want a PCI bus version.
    ISA versions are still available (although becoming less common), but they are
    inferior for all the reasons I''ve outlined in earlier chapters concerning the
    differences in the buses.


    It is not uncommon for an ISA sound card to take two DMA channels, one or two
    IRQs, and a large range of I/O addresses.


    Next, there''s **FM synthesis** versus wave table synthesis. This has to do with
    the way MIDI music is played and recorded. Originally all sound cards were FM
    synthesis. FM synthesis simulates musical instrument sounds when a MIDI program
    is creating or playing music. For example, suppose you have some MIDI software
    for your electric keyboard that can make it sound like an oboe. With an FM synthesis
    sound card, the computer calculates what an oboe sounds like and sends that approximation
    through the speakers. It doesn''t sound exactly like a real oboe.


    **Wave table synthesis** cards became popular several years ago, and nowadays
    almost all sound cards use wave table synthesis. These sound cards store waveform
    audio clips of various instruments playing various notes in their own Read Only
    Memory (ROM), and when a MIDI program calls for a particular instrument to play
    a particular note, the sound card plays the recording from its database. This
    results in MIDI music that sounds almost exactly like real waveform music.


    Even though almost all sound cards support wave table synthesis to some extent,
    they vary in how many different instruments they have stored in them. Most cards
    have at least 128 instruments these days; some also have several different drums
    too. Cards also vary in how many voices they can support. A **voice** is a single
    instrument playing a single note. The more voices, the more notes and instruments
    can be heard simultaneously. Sixty-four-voice support is not uncommon in today''s
    sound cards.


    There are many other shopping specs for high-end sound cards, but they''re not
    important to know for the A+ exam. You may want to look into them on your own
    if you''re in the market for a sound card. Some of them include EAX Technology
    support, multi-speaker support (that is, support for multiple sets of stereo speakers),
    Surround Sound support, advanced encoders for creating MP3 files, and a digital
    signal processor.


    **Wave table synthesis**

    A method of storing waveform clips of various musical instruments in the sound
    card''s memory and then playing them back when playing MIDI music. Results in
    much more natural sounding MIDI music.


    **Voice**

    A channel in the sound card that plays a single note by a single instrument. A
    typical sound card might have 64 voices, so 64 different sounds could be played
    at once.'
