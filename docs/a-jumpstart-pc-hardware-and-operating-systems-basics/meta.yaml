    MPEG decoder card or to the video card if the video card does MPEG decoding. The
    directions that came with the drive should tell what is necessary.


    If it''s a CD-ROM drive, and you want to play audio CDs on it through your computer''s
    sound card and speakers, you must run an **audio cable** from the drive to the
    sound card (or to the motherboard if it''s got built-in sound support). This is
    a three-wire cable, and it can be shielded or have bare wires, depending on the
    model. On one end is a flat, black four-hole connector; on the other end may be
    an identical connector or a smaller white four-hole connector, depending on the
    model. Most sound cards have several different connectors, so a variety of different
    audio cables will work with them.


    > **Audio cable**

    A cable that runs from a CD-ROM drive to a sound card and enables the CD-ROM drive
    to play audio CDs through the sound card and its attached speakers.


    # Step 5: Set Up the BIOS


    Most BIOSes detect IDE devices automatically, so you shouldn''t have to worry
