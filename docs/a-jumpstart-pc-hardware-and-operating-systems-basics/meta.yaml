  md: '# Glossary


    **Switch** A code typed following a command-prompt command that further defines
    how the command should be executed.


    **System bus** The bus that carries data between the CPU and memory. Also called
    the external bus. "External" refers to the fact that the bus is outside the CPU;
    the CPU also has its own internal bus.


    **System crystal** A quartz oscillator on the motherboard that sets the pace for
    movement of data into and out of the CPU.


    **TCP/IP** Stands for Transmission Control Protocol/Internet Protocol. A communications
    protocol used on the Internet and in many LANs.


    **TCP/IP** Transmission Control Protocol/Internet Protocol. A set of communication
    standards for sending and receiving data over a network.


    **Terminate** To close the SCSI chain at the end, letting the system know that
    there are no other SCSI devices in the chain.


    **TFT** Thin Film Transistor. A type of LCD display that uses multiple transistors
    for each pixel, resulting in a very bright and high-quality display.


    **Thermal inkjet printer** An inkjet printer that heats the ink to create vapor
    bubbles that force the ink out.


    **Tower case** A PC case designed to stand upright.


    **Trackball** A mouse alternative in which the body stays stationary and the user
    rolls the ball manually.


    **Tracks** Concentric bands on a disk platter, like the rings on a tree.


    **Tractor fed** A paper feed system that uses continuous paper (where one sheet
    is attached to the next at top and bottom) and pulls the paper through the paper
    path with gears that grab onto perforated holes on the sides of the pages.


    **Transfer corona wire** A wire in a laser printer that applies a positive charge
    to the paper on which the image will be printed.


    **TrueType font** A software-based outline font that works with any Windows-supported
    printer and application. TrueType fonts are also used on Macintosh computers.


    **Typematic** The quick repetition of a typed character, such as holding down
    the period key to make a row of dots. Also called character repeat.


    **Upload** To transfer a file from your PC to another PC.


    **Upper memory** The last 360KB of a PC''s first megabyte of RAM. Reserved for
    system use.


    **URL** Stands for Uniform Resource Locator. The text-based name of a network
    (usually Internet) resource that maps to an IP address through a DNS server, expressed
    in `ttp://` format.


    **VGA display** A display mode consisting of 640×480 resolution and 4-bit color
    depth (16 colors).


    **Video card** An expansion board that adds a port into which a monitor can be
    connected. Also called *video board* or *video adapter*.


    **Video driver** A file that translates instructions from the operating system
    into commands that the video card understands.


    **Virtual 8086** Using a single CPU to simulate multiple 8086 CPUs so several
    tasks can run concurrently.


    **Virtual machine** A simulated separate CPU that runs programs independently
    of other activities occurring on the same physical system.


    **Virtual memory** Using the hard disk to simulate RAM.'
