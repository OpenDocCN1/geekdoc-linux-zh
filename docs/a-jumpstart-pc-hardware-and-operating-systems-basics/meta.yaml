  md: '# Glossary


    **Protected mode** A mode of operation for an 80286 CPU that enables it to take
    advantage of advanced features not available in the 8088 CPU.


    **Protected mode** A PC operating mode compatible with 80286 and higher CPUs,
    addressing multiple megabytes of RAM.


    **Protocol** A language or set of rules for transmitting data between devices.


    **Protocol** Generically, a set of rules governing a situation. When referring
    to communications, a set of rules that specify how the data is sent and received.


    **PS/2 port** A small round port used for connecting some keyboards and mice.
    The name derives from a model of IBM PC that used this type of connector. The
    PS/2 computer is long obsolete, but the plug type is still around.


    **Quick format** A faster than normal way of reformatting an already-formatted
    disk that just wipes out the FAT contents rather than physically reformatting
    the data area.


    **RAM** Chips that store data using electrical impulses that are constantly refreshed
    by the power supply. When the power goes off, the data is erased. Also known as
    memory, although memory actually is a broader term encompassing more than just
    RAM.


    **RAM** Random Access Memory. Memory that you can both read from and write to.


    **RAM depth** The number of rows that the RAM can simultaneously store. Analogous
    to a column on a spreadsheet.


    **RAM disk** A temporary virtual hard disk created out of RAM.


    **RAM width** The number of bits that the RAM can simultaneously accept. Analogous
    to a row on a spreadsheet.


    **Random access** Able to jump to and access any part of the data just as easily
    as any other part.


    **Read/write head** The recorder/reader unit on a drive that reads data from the
    disk and writes data to the disk.


    **Real mode** A mode of operation for an 80286 CPU that makes it compatible with
    applications written for the 8088 CPU.


    **Real mode** MS-DOS mode, in which only a single task can be performed at once.
    MS-DOS operates in Real mode; Windows does not.


    **Real mode** A PC operating mode compatible with 8086 CPU operation, addressing
    only 1MB of RAM.


    **Recovery Console** A command line interface for troubleshooting problems with
    a Windows 2000 or XP installation.


    **Recycle Bin** A temporary storage area for files and folders that have been
    deleted.


    **Refresh rate** The rate at which pixels are refreshed on a monitor, expressed
    in hertz (Hz).


    **Register** A work area inside the CPU that holds a numeric value while the CPU
    performs a calculation upon it.


    **Registry** A configuration file that specifies how Windows 95 and higher will
    look and act in relation to users, applications, and hardware.


    **Resident font** A font that is stored in the printer''s ROM and is available
    at all times, regardless of what PC is connected to it.


    **Resistance** The amount of obstacle in an electrical path.


    **Resolution** The number of pixels across and down in a particular video display
    mode.


    **Ribbon cable** A cable consisting of several wires laid out in a flat, side-by-side
    arrangement and encased in plastic. It gets its name from the fact that the flat,
    wide cable looks something like a piece of ribbon.'
