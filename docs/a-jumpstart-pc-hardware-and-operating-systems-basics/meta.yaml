    ![](bbox=[0.16, 0.07, 0.72, 0.17])


    A floppy connector is a 34-pin version of the same; it uses a slightly smaller
    ribbon cable to connect floppy drives.


    ![](bbox=[0.22, 0.24, 0.72, 0.34])


    Each ribbon cable can support up to two drives, so the end result is that the
