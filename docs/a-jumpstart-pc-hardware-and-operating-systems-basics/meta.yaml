  md: '# # Introduction to Disk Drives


    # ## Optical Storage


    Optical storage also relies on binary patterns to store data, but instead of magnetism,
    it uses light. The surface of a CD-ROM has tiny **pits** in it, and when light
    bounces off a pit, it reflects back less strongly than when it bounces off an
    unpitted area (called **land**). So a CD-ROM uses a pit to represent a 1 and a
    land area to represent a 0.


    ![](bbox=[0.15, 0.25, 0.695, 0.37])


    The read/write head in an optical drive has two parts: a laser that shines light
    on the disk surface and a light sensor that measures the amount of light that
    bounces back. Whenever it detects a change in the amount of reflectivity, it sends
    a "click" to the operating system, which the operating system interprets as a
    "1". When it detects no change during a certain time period (depending on the
    drive timing), it interprets that as a "0".


    ![](bbox=[0.18, 0.51, 0.695, 0.705])


    Regular CD-ROM drives are read-only, so the read/write head is actually just a
    read head. There''s no writing. However, a CD-Recordable or CD-Rewriteable drive
    can also write. CD-Recordable (CD-R) is a one-time writing process for a CD, and
    it requires a special kind of disc. CD-Rewriteable (CD-RW) is a multi-write process
    that enables the same CD disc to be written and rewritten many times; it requires
    its own special kind of disc too.


    **Pit**

    An area of an optical disk that is indented, resulting in less light reflecting
    back from it.


    **Land**

    An area of an optical disc that is unpitted, resulting in a full measure of light
    reflecting back from it.'
  merge: -1
