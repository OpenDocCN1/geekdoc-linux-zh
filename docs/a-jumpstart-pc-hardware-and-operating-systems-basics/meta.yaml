  md: '# Chapter 3


    The Peripheral Connect Interface (PCI) bus improved upon the VL-bus by providing
    an entirely separate slot and making the connector much smaller. PCI slots can
    run at up to 66MHz. PCI expansion slots are now standard on virtually every motherboard.


    > **IDE**

    Integrated Device Electronics. A type of drive connector provided on the motherboard
    for interfacing with hard drives and CD-ROM drives.


    As system speeds increased, manufacturers found that the video card was often
    not able to keep up with the system''s demands. For this reason, a new type of
    local I/O bus expansion slot was created called Accelerated Graphics Port (AGP).
    An AGP slot''s speed is typically the same as the system bus speed, so there are
    no lag-behind problems with the video card.


    The following figure shows both an AGP (top) and a PCI slot (bottom). Notice that
    the AGP slot is made of brown plastic (in the photo, it appears gray); the AGP
    is white. The AGP slot is also offset farther toward the center of the motherboard,
    and the ridge that separates one section of pins from another is in a different
    place.


    ![](bbox=[0.3, 0.49, 0.96, 0.69])


    > **NOTE**

    Motherboards typically have only one AGP slot. If you want two or more video cards,
    the other cards must be PCI models. (Some people like to hook up two monitors
    to the PC at the same time, and you would need two video cards to do that.)


    # Drive Connectors


    Most motherboards have two Integrated Device Electronics (IDE) connectors and
    one floppy drive connector. The IDE connector is a 40-pin male connector for plugging
    in a ribbon cable that connects to an IDE device such as a hard drive or CD-ROM
    drive.


    ![](bbox=[0.1, 0.89, 0.17, 0.98])'
  merge: -1
