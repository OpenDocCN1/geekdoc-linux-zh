  md: '# Appendix C


    **Download** To transfer a file from another PC to your PC.


    **Dpi** Dots per inch, a measurement of printer output quality.


    **DPMI** DOS Protected-Mode Interface. Like an MS-DOS command prompt interface
    except it''s in Protected mode rather than Real mode.


    **Drive timing** The amount of time that passes between reading one bit and reading
    the next bit on a drive.


    **D-sub** A type of connector with asymmetrically arranged pins or holes in multiple
    rows. The outer ring looks sort of like a capital D, which is where the term D-sub
    comes originates.


    **Dual-boot** A system on which two (or more) operating systems are installed,
    each on a separate partition. At startup the user can choose which one should
    run.


    **Dynamic IP address** An IP address that is assigned from a pool of available
    addresses upon connection, and released upon disconnection.


    **Dynamic RAM** RAM that requires constant electricity to retain its data. Abbreviated
    as DRAM.


    **Electromagnetic** A magnetic field created by electricity.


    **Electromagnetic interference (EMI)** The corruption of a signal by the magnetic
    field of another nearby electrical device.


    **Electrostatic discharge (ESD)** An electrical shock that occurs when two objects
    of uneven charge come in contact with one another. Otherwise known as static electricity.


    **EMM386.EXE** A memory management utility that allows the operating system to
    use extended memory to supply either EMS or XMS support to an application as needed.


    **EMS** Expanded Memory Standard. The industry standard specification for expanded
    memory usage.


    **Encoding method** The pattern that determines the distance between each bit
    of data on a disk.


    **Ergonomic keyboard** A keyboard designed to minimize the stress placed on the
    users'' hands and wrists.


    **Expanded memory** Additional memory over 1MB supplied via an expansion board
    for 80286 PC.


    **Expansion bus** The bus used by ISA expansion slots. Slow and old; soon to be
    obsolete.


    **Extended memory** Additional memory above 1MB on a motherboard.


    **External data bus** The bus that transfers data from outside the CPU to inside
    and then back out again.


    **External speed** The system crystal speed, which controls the CPU''s speed.


    **Female** A female connector is one that has holes rather than pins.


    **File** A collection of computer data stored under a single name.


    **File Allocation Table (FAT)** A table that keeps track of the content of each
    sector of the disk. The operating system consults the FAT whenever it needs to
    open or save a file.


    **File extension** A code (usually three characters) following a file''s name
    that indicates the file type. For example, in MYFILE .DOC, the doc extension indicates
    a document.


    **Fixed IP address** An IP address that never changes, assigned permanently to
    a specific client.


    **Flux** The direction of the flow of the magnetic field.'
