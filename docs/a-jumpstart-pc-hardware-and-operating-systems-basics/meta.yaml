  md: '# Chapter 2


    **CPU** The Central Processing Unit, or CPU, is the engine that drives the entire
    operation. It performs all the math calculations, processing millions of calculations
    per second.


    **Battery** The battery provides a small amount of constant power to the motherboard,
    so items that always need to be on (such as the system''s date/time clock) can
    stay that way even when the PC is unplugged.


    **Expansion slots** These are the slots into which expansion circuit boards fit.
    Three types are shown here. The single gray one in the center is an AGP slot for
    a video card. (Actually, it''s brown on most motherboards.) The white ones are
    PCI slots, and the black ones are ISA slots. Not all motherboards have all these
    slot types. You''ll learn about the slot types in Chapter 3.


    **Memory (RAM)** RAM stands for Random Access Memory; this is the main memory
    on the PC. Most RAM today comes on mini circuit boards. You''ll learn about memory
    in Chapter 5, “Understanding Memory.”


    **Drive connectors** Ribbon cables run from the drives to the motherboard, and
    they connect into these sets of pins.


    # Central Processing Unit (CPU)


    The Central Processing Unit (CPU) does the math calculations for the entire PC.
    Modern CPUs can process many millions of instructions per second; in Chapter 3,
    you''ll learn about the types of CPUs and their specifications.


    CPUs have two main shapes: pin grid array (PGA) chips and Single Edge Contact
    (SEC). The latter are sometimes called Single Edge Connector, but both refer to
    the same thing. The type you need depends on the type of motherboard you have.


    > NOTE

    There is no direct relationship between the motherboard form factor (AT versus
    ATX) and the type of CPU it uses.


    A PGA chip is flat on the top; on the bottom it has many tiny pins. Each pin fits
    into a hole in a socket in the motherboard. Here''s a PGA model, both front and
    back sides.


    **Ribbon cable**

    A cable consisting of several wires laid out in a flat, side-by-side arrangement
    and encased in plastic. It gets its name from the fact that the flat, wide cable
    looks something like a piece of ribbon.


    **CPU**

    Also called the processor, this large, powerful silicon chip takes in data, performs
    calculations on it, and spits it out again into memory. The CPU is sometimes called
    the “brain” of a PC, but the “calculator” of the PC is actually more accurate
    because it does not think or reason for itself.


    **PGA**

    Pin Grid Array. A type of CPU with a grid of pins on its underside that fit into
    a motherboard socket.


    ![](bbox=[0.46, 0.88, 0.71, 0.98])'
  merge: -1
  pgno: 45
- img_proc: false
  md: '# # A Look Inside a PC


    And here''s an **SEC** model:


    ![](bbox=[0.1, 0.12, 0.73, 0.36])


    **SEC**

    Single Edge Contact cartridge. A type of CPU mounted on a circuit board inside
    a plastic casing.


    Circuit board


    An SEC CPU is a chip too, but it''s mounted on a circuit board and then the circuit
    board is encased in a plastic cartridge. You plug an SEC CPU into the motherboard
    by inserting the circuit board into a slot. There are mounting braces on the motherboard
    to help hold the cartridge upright.


    In actual use, a CPU will almost always have a cooling device attached to it.
    There are two main types of cooling devices: fans and heat sinks. A fan is just
    what the name says—a small electric fan that cools the CPU. Here''s a PGA CPU
    mounted on a motherboard with a fan on top of it:


    ![](bbox=[0.18, 0.58, 0.56, 0.89])'
  merge: -1
  pgno: 46
- img_proc: false
  md: 'A **heat sink** is a porcupine-like block that channels heat away from the
    CPU. Some CPUs use a combination of both—a heat sink block with a fan mounted
    in the center of it.


    # RAM


    **Random Access Memory (RAM)** acts as short-term storage for the PC while it
    processes data. RAM keeps track of what programs and data files are open, what
    should appear on the screen at any given moment, and lots more. Writing to and
    from RAM is very fast—much faster than writing to and from a hard disk. RAM is
    volatile, which means whatever is stored there is only stored temporarily; when
    you turn off the PC, RAM''s content is erased. In Chapter 5, you''ll learn why
    this is so, and you''ll learn lots of other important details about RAM.


    Physically, RAM on a motherboard looks like a small rectangular circuit board,
    about 5.25 inches long. The type shown here is a Dual Inline Memory Module (DIMM).


    ![](bbox=[0.27, 0.45, 0.91, 0.6])


    There is also an older, shorter kind called a SIMM (Single Inline Memory Module)
    that you might encounter in older PCs.


    # Drives


    CD-ROMs, floppy disks, and hard disks are all nonvolatile storage. In other words,
    whatever you place on a disk stays there, even after you shut off the PC. That''s
    why it''s important to save your work to disk before shutting down the PC—because
    until you save, the data exists only in RAM.


    Disk drives are encased in metal boxes to keep them from being damaged. Some drives
    are separate from their disks, and you can remove one disk and insert another;
    CD-ROM and floppy drives are like that. Other drives integrate the disk and the
    drive in a single package, as with a hard disk.'
  merge: -1
  pgno: 47
- img_proc: false
  md: '# A Look Inside a PC


    > NOTE

    Because a hard disk cannot be removed from the hard drive, the terms *hard disk*
    and *hard drive* have come to be synonymous.


    All drives have at least two connectors on the back: one for power and one for
    data. The data connector accepts a ribbon cable, which then attaches to a drive
    connector on the motherboard. Here’s the back of a hard disk:


    ![](bbox=[0.14, 0.3, 0.65, 0.66])


    > NOTE

    Hard drives (and CD-ROM drives) use two types of interfaces: Integrated Drive
    Electronics (IDE) and Small Computer Systems Interface (SCSI). Most motherboards
    include IDE connectors, but not SCSI connectors; you must add an expansion card
    for SCSI device use. Most IDE hard drives are cheaper than SCSI drives too, so
    the vast majority of systems have only IDE hard drives. SCSI drives tend to be
    faster and have advantages in situations where there are many hard drives on the
    same system, such as on file servers. The drives shown in this chapter are IDE
    drives. You’ll learn more about drive types in Chapter 8, “Focus on Hard Disks.”'
  merge: -1
  pgno: 48
