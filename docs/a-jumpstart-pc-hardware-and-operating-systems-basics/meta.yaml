  md: '# What You See from the Outside


    On the front of a typical PC, you can see the following features:


    **Power button** Turns the PC on/off (duh!).


    **Floppy drive** Accepts 3.5-inch floppy disks, which for a long time were the
    only viable means of transferring files between PCs.


    **CD-ROM drives** Accepts CD-ROM discs, and if the drive is capable of it, might
    also write to writeable CDs and/or read DVD discs.


    **Power light** Illuminates when the PC is on; remains on all the time. Usually
    green.


    **Hard disk light** Illuminates when the hard disk is being accessed. Flashes
    while the hard disk reads or writes; goes out when there is no disk activity.
    Can be either red or green. Might not be operational at all on some home-built
    systems.


    ![](bbox=[0.36, 0.44, 0.88, 0.93])'
  merge: -1
  pgno: 37
- img_proc: false
  md: '# # A Look Inside a PC


    From the back, you can see:


    **Fan vent** Draws in air from the outside to cool the components inside. The
    fan runs constantly whenever the PC is on.


    **Power cord connector** Accepts a standard three-prong power cord.


    **Voltage switch** Most power supplies have a switch that enables them to operate
    at different voltages depending on the voltage of the wall outlet. In the United
    States, standard voltage is 110-volt (the switch may read 115-volt, but that''s
    basically the same thing). In Europe, it''s 200-volt.


    **Power supply** The fan vent, voltage switch, and power cord connector are built
    into the power supply, which is a separate metal box fastened to the case from
    the inside. From the outside, it looks like a part of the PC''s case.


    **Removable panel for additional fan** Some cases have extra vents; if the optional
    fan is not installed, a metal plate covers them as shown here.


    ![](bbox=[0.07, 0.41, 0.82, 0.91])'
  merge: -1
  pgno: 38
- img_proc: false
  md: '# # Chapter 2


    **Built-in ports** Ports that come with the PC that are used for plugging in keyboard,
    mouse, and other standard devices. We''ll look at these in more detail momentarily.


    **Expansion ports** Ports that are added in expansion slots on the motherboard
    and are not part of the base PC itself (for example, a video card or modem). We''ll
    look at these more closely in a moment as well.


    Your PC probably has a tangle of wires plugged into the back, as you saw in the
    preceding figures. With all those wires, sorting out what''s what can be difficult.
    Here''s a closer look at the built-in ports:


    **Keyboard port** On an ATX system (which is shown here), the keyboard port is
    a **PS/2 port**. On an AT system, the keyboard port is a larger round plug. You
    can buy different keyboards with the different connectors, or you can buy a plug
    that converts between them; the keyboards themselves are identical except for
    the plugs. You''ll learn about AT and ATX systems in Chapter 3, "A Closer Look
    at the Motherboard."


    **Mouse port** The mouse also plugs into a PS/2 port on most systems. On some
    older systems, there is no mouse port; on these systems, you must use a mouse
    that plugs into the serial port (which will be explained in a moment) instead.
    Even though the keyboard and mouse may both use PS/2 ports, the ports are not
    interchangeable. Notice in the following figure that there are pictures of a keyboard
    and a mouse next to the ports to help you avoid confusing them.


    **USB ports** These small rectangular slots accept Universal Serial Bus (USB)
    cables. Many types of devices use USB interfaces, including scanners, digital
    cameras, and printers.


    **PS/2 port** A small round port used for connecting some keyboards and mice.
    The name derives from a model of IBM PC that used this type of connector. The
    PS/2 computer is long obsolete, but the plug type is still around.


    ![](bbox=[0.476, 0.627, 0.728, 0.859])'
  merge: -1
  pgno: 39
- img_proc: false
  md: '# A Look Inside a PC


    **Serial ports** Some systems have one of these; others have two. They are typically
    9-pin **male D-sub** connectors. The nine pins are arranged with five pins in
    one row and four pins in the other. Some older systems have one 9-pin serial port
    and one 25-pin serial port. The 25-pin type is just an elongated model with more
    pins, and you can buy converters that switch between 9-pin and 25-pin formats
    if you happen to need the connector to be a different size than it is. Serial
    ports used to be used for many devices, but today the USB type of connector is
    more popular. You might connect an external modem to a serial port or a mouse
    (if your system does not have a PS/2 mouse port) or the cradle for a handheld
    computer such as a PalmPilot.


    **Male**


    In computer jargon, a male connector is one that has pins rather than holes.


    **Parallel port** This is a 25-pin **female** D-sub connector. The 25 pins are
    arranged with 13 pins in one row and 12 in the other. Printers are by far the
    most common device to use a parallel port, although some models of scanners are
    parallel as well.


    **D-sub**


    A type of connector with asymmetrically arranged pins or holes in multiple rows.
    The outer ring looks sort of like a capital D, which is where the term D-sub comes
    originates.


    **Female**


    A female connector is one that has holes rather than pins.


    ![](bbox=[0.25, 0.4, 0.72, 0.65])


    **Sound connectors** On some PCs, the sound connectors are built-in; on other
    systems, they''re on a separate sound card in an expansion slot. Here they''re
    built-in. There are three identical round plugs—output for speakers, input for
    a microphone, and input for other devices.


    **Joystick connector** If the PC has a separate sound card, the joystick port
    will be on that expansion card. If sound is built in, as shown here, it''ll appear
    with the built-in ports. A joystick connector is a 15-pin female D-sub connector
    with two rows: one with 8 holes and one with 7.


    In addition to the built-in ports, your PC has an area of rectangular holes covered
    by metal panels. Each of these panels corresponds to an expansion slot in the
    motherboard. When an expansion card is plugged into a slot, its ports stick out
    of that hole. In the following figure, there are two expansion cards: a video
    card and a network card. On some budget systems, the video port is among the built-in
    ones; on higher-end systems, you can expect to find a separate video card.'
  merge: -1
  pgno: 40
- img_proc: false
  md: '# Chapter 2


    You can tell what type of card it is by the connectors. A video card has a 15-pin
    female connector with three rows of pins (the only D-sub connector type to have
    three rows rather than two); a network card has an **RJ-45** connector.


    > **RJ-45**

    A type of connector that looks like a wider-than-normal telephone plug. Used for
    network cables and ISDN phone lines.


    ![](bbox=[0.35, 0.17, 0.89, 0.45])


    ![](bbox=[0.41, 0.5, 0.84, 0.85])'
