  md: '# **Appendix C**


    **RJ-45** A type of connector that looks like a wider-than-normal telephone plug.
    Used for network cables and ISDN phone lines.


    **SIMM** Single Inline Memory Module. An older type of RAM packaging with either
    72 or 30 pins.


    **ROM** Stands for Read-Only Memory. A memory chip that can be read but not written
    to.


    **Slave** The drive that receives all its data through the drive designated as
    master.


    **ROM Shadowing** Copying the data from a ROM BIOS chip into RAM for quicker access
    to it.


    **Slot 1** A motherboard slot that accepts an Intel SEC cartridge CPU.


    **Root directory** The top-level or main storage area on a disk, not associated
    with any particular folder.


    **Slot A** A motherboard slot that accepts an AMD SEC cartridge CPU.


    **Router** A traffic director box on a network that allows data addressed to a
    PC on a network segment to pass through to that segment while blocking other traffic
    from entering.


    **Slot mask** A hybrid technology combining shadow mask and aperture grille.


    **Safe mode** A limited-functionality Windows troubleshooting mode in which only
    essential drivers are loaded.


    **Software font** A font provided to the printer via software stored on the PC.


    **Software modem (Winmodem)** A modem that relies on a Windows application to
    team with its hardware in order to work. Software modems work only with a specific
    operating system (usually Windows).


    **SCSI** Small Computer Systems Interface. An interface for connecting drives
    and other devices to a PC that allows chaining of up to seven devices together.
    An alternative to IDE.


    **Sound card** An expansion board that functions as a converter between analog
    sound and digital data, enabling the computer to generate and receive audio output
    and input.


    **SDRAM** Synchronous Dynamic RAM. RAM in which the speed is the same as the system
    bus speed. Speeds are measured in megahertz (MHz).


    **Splash screen** The graphic that appears while Windows or some other program
    is loading. It usually lists the program name and version number.


    **SEC** Single Edge Contact cartridge. A type of CPU mounted on a circuit board
    inside a plastic casing.


    **Standard VGA** VGA stands for Video Graphics Array; it''s the standard for basic
    operation of all modern monitors. Standard VGA is 640×480 pixels of resolution
    and 16 colors.


    **Sector** A section of a track created by straight lines cutting across the diameter
    of the disk platter.


    **Server** A computer that serves data to other PCs and provides access to network
    resources.


    **Startup disk** A bootable floppy disk containing command line utility programs
    for troubleshooting.


    **Shadow mask** A grid of perforated metal with holes that guide electron placement
    to ensure that the correct phosphors are illuminated on a CRT.


    **Static RAM** RAM that retains its data until new data is received. Abbreviated
    as SRAM.


    **Sheet fed** A paper feed system that uses individual pre-cut sheets of paper.


    **Stick** A small circuit board on which is mounted multiple RAM chips. SIMMs
    and DIMMs are both sticks.'
