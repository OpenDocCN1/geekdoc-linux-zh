  md: '# # Introduction to Disk Drives


    ![](bbox=[0.17, 0.088, 0.635, 0.376])


    # **Flux transition**


    A spot where the flux changes directions.


    When the read/write head writes, electrical voltage applied to the head makes
    the magnet active and polarity changes in the magnetic field cause different values
    to be written. Whenever there is a polarity change, there is a **flux transition**.
    When the read/write head reads, it does not actually look for individual magnetized
    particles; rather, it looks for flux transitions, and when it finds one, it sends
    a small electrical pulse to the circuitry saying "Found one!" The pattern of these
    pulses received from the head, in relation to the drive timing, is translated
    into data and sent to the CPU.


    ![](bbox=[0.161, 0.604, 0.62, 0.847])'
  merge: -1
