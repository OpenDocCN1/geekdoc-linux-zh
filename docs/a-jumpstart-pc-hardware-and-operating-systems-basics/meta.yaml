  md: '# Chapter 16

    # Installing and Removing Windows Programs


    As you probably already know, installing a Windows program is more than just copying
    files to your hard drive. You must run a Setup utility for that program to make
    the required changes in the Windows Registry. Similarly, removing a Windows program
    involves more than just deleting the program''s files from the hard disk. You
    must either use the program''s Uninstall utility (if it has one) or Add/Remove
    Programs in the Windows Control Panel to remove it. Otherwise, you end up with
    out-of-date entries in the Registry that can slow down system performance and
    cause error messages to appear.


    As far as Windows'' Add/Remove Programs applet is concerned, there are two types
    of Windows programs: those that come with Windows itself (referred to as **Windows
    components**) and those that are separate. The procedures for adding and removing
    them are different, so let''s look at each individually.


    # ## Adding and Removing Applications


    Adding a new program that comes on CD-ROM is usually just a matter of pop-ping
    the CD in the drive and following the onscreen prompts. If nothing happens when
    you insert a CD, browse its contents in My Computer and double-click on SETUP
    .EXE.


    Most programs you can download from the Internet come in executable form (with
    an .exe extension), so you just double-click the file after downloading it and
    the setup program runs. If a downloaded program comes in ZIP format (with a .zip
    extension), use an unzipping program to extract the files to a folder on your
    hard disk and then run the Setup program from there. One popular unzipping program
    is WinZip (www.winzip.com). Windows XP has zip support built in, so no unzipping
    program is required; so does America Online.


    Some applications come with their own Uninstall program, which you''ll find next
    to the program itself on the Start menu:


    ![](bbox=[0.5, 0.8, 0.77, 0.88])


    Windows components

    Programs, utilities, and add-ons that come with Windows itself rather than being
    purchased separately.'
  merge: -1
