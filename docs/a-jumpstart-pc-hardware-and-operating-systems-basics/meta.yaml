  md: '# Correcting the Underlying Problem


    Think back—what was the last thing you did to the PC before the problem started
    happening? If it’s not your PC, ask the person who uses it the most. Maybe there
    was a new piece of hardware installed or a new program loaded? It’s a good bet
    that the new item is part of the current problem. Try removing it. If it’s hardware
    that came with its own software, remove the software too. See Chapter 16 for help.


    If you can’t get the system back the way it was by normal means (i.e., by using
    Add/Remove Programs), try the System Restore utility (Windows Me and XP only).
    This is not covered on the A+ exam because it came out after the exam was written,
    but it’s really handy. You’ll find it in the System Tools subfolder on the Start
    menu. It lets you restore an earlier copy of the Registry, wiping out any bad
    edits that the errant program might have made to it.


    There’s a possibility that the problem is being caused by a corrupt or outdated
    driver for a certain hardware device, so check the manufacturers’ websites for
    all your hardware and make sure you have all the latest drivers. There’s also
    a possibility that two or more devices are causing the problem together by conflicting
    with one another, so check your device resource allocations in Device Manager
    (see Chapter 17, “Working with Devices in Windows”).


    If nothing works and you’re still having problems, try reinstalling Windows. There
    are several ways to go about this, and it can be a crapshoot to determine which
    one is appropriate for a given situation.


    +   - Reinstalling over the top of an existing Windows installation is fairly
    easy to do and takes only about a half-hour. You keep all your installed programs.
    However, it doesn’t always solve the problem.

    - Reinstalling Windows in a different folder on the hard disk gives you a fresh
    Windows installation but you must reinstall all your Windows applications. It’s
    about 95 percent sure to fix the problem, but it requires that you have adequate
    hard disk space to support two separate installations of Windows temporarily.
    (You can delete the old installation once you’ve confirmed that the new one works.)

    - Reformatting the hard disk and reinstalling Windows is about 99.9 percent sure
    to correct the problem. However, this is a tremendous amount of work because you
    have to back up all your data files first, format the drive, reinstall Windows,
    reinstall each application, and then restore the data files. That’s a whole-day
    project.'
