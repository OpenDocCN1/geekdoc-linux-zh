  md: 'Chapter 12


    # Common Printer Features


    No matter what type of printer you have, it works basically the same way conceptually.
    So before we get into the differences, let’s first look at the similarities.


    **Line printer**

    A printer that prints one line of a page at a time.


    # Electronic Control Unit


    **Page printer**

    A printer that waits until it has a whole page of data in its memory and then
    prints the entire page at once.


    The Electronic Control Unit (ECU) is a circuit board or a series of boards that
    handles all the “brain” functions of the printer. The incoming data goes to the
    ECU, and the ECU gives commands based on it. The ECU tells all the mechanical
    parts when and how to operate—when the paper should feed, how much ink should
    be dispensed, what image should be created on the paper, and so on.


    **Sheet fed**

    A paper feed system that uses individual pre-cut sheets of paper.


    # Memory (RAM)


    A printer has some RAM, just like a PC does. A printer’s RAM holds any fonts that
    the operating system has downloaded to it, plus it acts as a holding tank and
    funnel for the incoming print data.


    The amount of memory a printer has depends partly on the type of printer. Printers
    can be broken down into two categories: line printers and page printers. Line
    printers require much less memory.


    **Tractor fed**

    A paper feed system that uses continuous paper (where one sheet is attached to
    the next at top and bottom) and pulls the paper through the paper path with gears
    that grab onto perforated holes on the sides of the pages.


    A **line printer** accepts data from the PC and prints it out one line at a time;
    examples include inkjet and dot matrix printers. The paper feeds through gradually
    as the printer continues to accept data for that page from the PC. Because it
    does not need to hold the entire page of data in its memory before it begins printing,
    a line printer needs only a few kilobytes of memory—enough to hold a single line.
    If it has more memory than that, the extra memory functions as a buffer to hold
    incoming data until the printer is ready for it. With line printers, the amount
    of memory is not an important issue.


    A **page printer**, in contrast, accepts data from the PC and holds it in its
    memory until it gets a full page; then it prints it all at once to the page. A
    laser printer is the most common type of page printer. Because it must compose
    the entire page in memory, a page printer requires quite a bit of memory. Very
    old laser printers came with only 512KB of memory, but this was not enough for
    a full-page graphic and, therefore, out-of-memory error messages were common with
    those printers. Today’s laser printers all come with at least 2MB of memory—usually
    more.


    210'
  merge: -1
  pgno: 229
- img_proc: false
  md: '**Printing Basics**


    # Paper Transport System


    The paper transport system is a series of gears, rollers, grabbers, etc. that
    feeds the paper through the printer. Depending on the type of printer, it could
    be a set of rollers that pull in single sheets at a time, or it could be a set
    of tractor-feed gears that pull through a continuous stream of paper.


    All printers have a means of feeding paper in and out. Most printers today are
    **sheet fed**, which means they use individual pre-cut sheets of paper. The exception
    is dot matrix printers (which are uncommon these days but do still exist); these
    are **tractor fed**. They use continuous paper and employ a system of gears to
    pull the paper through by means of perforated holes on the sides.


    **Font**

    Strictly defined, a particular typeface at a particular size. However, *font*
    has lately come to be synonymous with *typeface*.


    # Printing System


    All printers have a way of making marks on the page—the printing system. The printing
    system varies depending on the type of printer. In an inkjet printer, it''s the
    ink delivery system; in a laser printer, it''s the system that writes to the drum,
    applies the toner, and fuses it to the paper. Later in the chapter, I''ll discuss
    the types of printers in more detail.


    **Resident font**

    A font that is stored in the printer''s ROM and is available at all times, regardless
    of what PC is connected to it.


    # ROM and Fonts


    Just like a PC, a printer has some Read Only Memory (ROM) that contains its startup
    instructions (for self-testing, etc.) and any built-in **fonts**. All printers
    have at least one **resident font**, which is used to print test pages. A resident
    font is one that''s built into the printer itself—that is, the printer is not
    dependent on the PC to provide it. Most printers have at least two or three.


    **Software font**

    A font provided to the printer via software stored on the PC.


    When you install a printer driver in Windows, the driver knows what resident fonts
    the printer has, and it makes them available in your applications. If you want
    to print using a font that the printer does not have, you must download a **soft
    font** (that is, a software version of the font) to the printer. Windows does
    this automatically when you send a document to the printer that requires a font
    the printer does not natively have. Windows comes with several **TrueType** soft
    fonts, which are scaleable to any size and work with any printer and any Windows
    program.


    **TrueType font**

    A software-based outline font that works with any Windows-supported printer and
    application. TrueType fonts are also used on Macintosh computers.


    # Viewing Installed Fonts in Windows


    To see what soft fonts are installed, open the Fonts utility in the Windows Control
    Panel. Notice the different icons for the fonts. The O icons are for OpenType


    ![](bbox=[0.8, 0.88, 0.91, 0.97])'
  merge: -1
