  md: '# # Installing a Sound Card


    Installing the actual sound card in an expansion slot is the same old thing that
    you learned at the beginning of the chapter. Prepare a slot, insert the card,
    and away you go.


    After installing the card, however, you have some cables to run that connect to
    it, and this can get tricky.


    First, hook up the speakers. The sound card has only one speaker jack (usually),
    so only one of the speakers can connect to it. The other speaker connects to the
    first speaker, rather than directly to the sound card. Some speakers run on batteries,
    but most of them run on AC power, so a power cord must plug into one or both of
    them. The port on the sound card for the speaker may be labeled as such, or it
    may be labeled SPK or Output. (Some cards have a separate Output port besides
    the speaker output; most don''t.) On a sound card with color-coded ports, the
    speaker is the black one.


    Next, if you have a microphone, hook it up to the MIC port on the sound card.
    It may be labeled as MIC or may have some cryptic little picture next to it that
    is supposed to represent a microphone. If there is color-coding, the microphone
    port is the red one.


    The sound card will probably also have a Line Out port. This would be for an external
    recording device or an alternative set of speakers. This port is green on a color-coded
    card.


    Depending on the model, there may be a fourth round port, Line In. This is for
    an external input source. For example, if you want to make a CD of your favorite
    LP, you could hook up your stereo receiver to the sound card through the Line
    In port. If there is color coding, this port is blue.


    Finally, there will be a 15-pin female plug (two rows of pins, rather than the
    three on a video connector) for a MIDI instrument or joystick.


    # # Common Sound Card Problems


    Here are some problems people experience with sound cards and some ideas for fixing
    them.


    # ## Windows Doesn''t See Sound Card


    Look for the sound card in Device Manager (see Chapter 17). If it''s not there
    at all, the card may be physically defective or not installed correctly (for example,
    not completely seated in the expansion slot). If it''s there but there''s an exclamation'
  merge: -1
