  md: 'A floppy drive uses a different size of power connector than a CD-ROM or hard
    drive, and it also uses a slightly shorter data connector:


    ![](bbox=[0.15, 0.13, 0.9, 0.52])


    Notice in the preceding figure that the front of the floppy drive has a light
    on it; it illuminates when the PC is reading or writing the disk. CD-ROM drives
    have them too. Hard disks don''t, because they are not accessible from the outside.
    However, as you saw near the beginning of the chapter, a hard disk can be attached
    to a light on the front of the computer case itself so that the light indicates
    when it is in use.


    # Expansion Boards


    Expansion boards are circuit boards that fit into expansion slots on the motherboard,
    adding some new or improved capability. Examples include modems, network interface
    cards, sound cards, and video cards. Here''s a network interface card (NIC), for
    example.'
