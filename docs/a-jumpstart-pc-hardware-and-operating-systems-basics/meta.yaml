  md: '# # Working with Devices in Windows


    - ◆ A New Hardware Wizard may appear onscreen walking you through the process
    of identifying the location of the driver for the device. Point the wizard to
    the driver (probably on a disk that came with the device) or let the wizard search
    for the best driver available for it. The latter is the best way to go in most
    cases because it compares all the available drivers (such as the one that came
    with the device on disk versus the one that came with Windows for it), decides
    which one is most recent, and uses that one.


    If the instructions that came with the device prescribe that you should run a
    Setup program on a disk provided, it''s perfectly okay to click Cancel instead
    of running through the wizard. Clicking Cancel will enable Windows to finish loading
    and then you can run the Setup program from the disk. You might also want to cancel
    the wizard if no driver is available for the device; then after Windows finishes
    loading, you can use the Internet to locate a driver for it (or at least you can
    try).


    If Windows does not detect the new device automatically at startup, one of these
    things is true:


    +   - ◆ The device is not fully Plug and Play compatible. See the next section
    for guidance.

    - ◆ The device is malfunctioning or not correctly installed. Check the install
    instructions and try to correct the problem.

    - ◆ There are resource allocation problems. See the section "Resolving Resource
    Conflicts" later in this chapter.


    To confirm that a device has been installed, open up Device Manager as described
    earlier in the chapter and look for the device. Double-click it to open its properties,
    and check its status. If it reports that the device is working properly, it should
    be good to go.


    # ## Non–Plug and Play Devices


    If the device, the chipset, or the operating system is not Plug and Play compatible,
    Plug and Play won''t work. As long as you are using Windows 95 or higher, you
    should be fine on the operating system front, but the chipset and the device may
    be another matter. If you have other Plug and Play devices installed in Windows,
    you can eliminate the motherboard chipset as the source of the problem as well.
    That leaves the device itself.


    Windows'' New Hardware Wizard (or Add/Remove Hardware Wizard in some Windows versions)
    has a feature in it that tries to detect non–Plug and Play hardware, and it actually
    works fairly well. But it doesn''t notice the new device


