  md: '# What an Operating System Does


    The **operating system (OS)** has two functions: to start things up and to keep
    things running.


    When you turn on the PC, it goes through some self-tests (described in Chapter
    15, ''Starting Up a PC'') and then passes control to the OS. From that point on,
    the OS handles the tasks of loading the needed programs that will display the
    user interface, load the drivers for the hardware, and execute any programs that
    are set to load at startup.


    As soon as everything is ready to roll, the OS starts its second job, as ''site
    supervisor'' of the entire operation. It accepts commands from the user and executes
    those commands, doing whatever it takes to get the job done—running a program,
    translating some code for the benefit of a driver, displaying a message, and so
    on.


    Operating systems come in two basic classes:


    +   - Command line based, like MS-DOS and some versions of Unix

    - **Graphical User Interface (GUI)** based, like Microsoft Windows and the Macintosh
    OS


    The difference has to do with the way the OS accepts commands from the user and
    displays the results of them.


    # Command Line Operating Systems


    A **command line** operating system displays an onscreen command prompt, like
    this:

    `C:\>`


    The user types on the keyboard, and the words being typed appear next to that
    command prompt. The user presses Enter to execute that line:

    `C:\>COPY A:\MYFILE.DOC C:\BOOKS\MYFILE.DOC`


    A lot of typing (as well as a lot of command and syntax memorization) is required
    to use a command line operating system.


    Command line OSes are mostly single-tasking systems (although there are some exceptions),
    which means they do only one thing at a time. They run one command, and then they
    accept another.


    The primary advantage of a command line OS is efficiency. It requires very little
    in the way of processing power and memory, so even a very old PC can work well
    with a command line OS like MS-DOS.


    ![](bbox=[0.105, 0.835, 0.185, 0.893])'
  merge: -1
  pgno: 271
- img_proc: false
  md: '# # GUI Operating Systems


    A GUI operating system, such as Microsoft Windows, uses pictures and a pointing
    device as the primary user interface. Whereas a command line operating system
    is typing based, a GUI operating system is point-and-click based, making it less
    intimidating for beginners.


    A GUI interface requires much less memorization because users select from menus
    of available commands rather than relying on memory to determine which command
    to use in a particular situation.


    Users can also **multitask** more freely with a GUI operating system because multiple
    programs can run in different areas of the screen simultaneously.


    The disadvantage to multitasking is its high overhead. Executing the programs
    required for creating and maintaining the pictures on the screen takes up a good
    deal of the CPU''s time and the RAM''s storage space, leaving less for running
    programs. Therefore, a PC running a GUI OS must have a much more powerful CPU
    and a lot more memory than a PC running a command line OS. Each successive version
    of Windows has required more of the CPU and RAM''s attention, with the result
    that only fairly new PCs (a few years old or less) are capable of running the
    latest Windows versions.


    +   **Multitask**: To execute more than one program at once.


    **Conventional memory**: The first 640KB of a PC''s RAM. Used for running programs.


    **Upper memory**: The last 360KB of a PC''s first megabyte of RAM. Reserved for
    system use.


    **ROM Shadowing**: Copying the data from a ROM BIOS chip into RAM for quicker
    access to it.


    # # It''s All about Memory Management


    Later in the chapter, you''ll learn about the differences between various versions
    of MS-DOS and Microsoft Windows; however, for that information to make sense,
    you first need to know something about how an operating system uses memory.


    # ## Conventional and Upper Memory


    Remember from earlier chapters that PCs based on the 8086 CPU had only 1MB of
    RAM. It was divided into two sections. The first 640KB was **conventional memory**,
    and the rest was **upper memory**. Only conventional memory could be used for
    running programs and loading the operating system files and drivers; upper memory
    was reserved for system use. One "system use" was for **ROM shadowing**; another
    was to serve as a staging area for copying data to and from the RAM on the video
    card. However, a good deal of the upper memory went unused and wasted.


    The main problem with this conventional/upper memory split was that as programs
    got bigger, they began to require more than 640KB. Additional memory was available
    in upper memory, but it was reserved and programs couldn''t utilize it. More non-reserved
    memory was needed.


    ![](bbox=[0.77, 0.89, 0.87, 0.97])'
  merge: -1
  pgno: 272
- img_proc: false
  md: '# Chapter 14


    **Expanded memory**

    Additional memory over 1MB supplied via an expansion board for 80286 PCs.


    **Page frame**

    The 64KB area in upper memory used to swap data into and out of expanded memory.


    **EMS**

    Expanded Memory Standard. The industry standard specification for expanded memory
    usage.


    **Real mode**

    A PC operating mode compatible with 8086 CPU operation, addressing only 1MB of
    RAM.


    **Protected mode**

    A PC operating mode compatible with 80286 and higher CPUs, addressing multiple
    megabytes of RAM.


    **Extended memory**

    Additional memory above 1MB on a motherboard.


    # Expanded Memory


    The next generation of PCs, the 80286s, allowed the use of add-on memory boards
    with **expanded memory**. Expanded memory was divided into 16KB sections called
    pages, and a typical expanded memory board contained a couple of megabytes in
    total. The **page frame**, a 64KB area in the PC’s upper memory, could hold four
    of these pages at a time. Data was swapped into and out of this upper memory area
    from the expanded memory, enabling the PC to access the full amount of the expanded
    memory (typically about 2MB, but up to 16MB was available).


    A driver for the board was loaded at startup. Each brand of board required a different
    driver, and only programs written specifically for use with expanded memory could
    take advantage of it. The standard for expanded memory was called **EMS** (Expanded
    Memory Standard). Another name for EMS was LIM, which stood for Lotus-Intel-Microsoft
    (the three companies that jointly developed the standard).


    # Real and Protected Modes


    At this point, Microsoft might have rewritten MS-DOS to allow programs to directly
    access multiple megabytes of RAM, scrapping the entire conventional/upper memory
    limitation. If MS-DOS had been rewritten, however, it would have lost all backward-compatibility
    with older programs, and Microsoft was afraid PC users wouldn’t buy it. Their
    solution was to create two separate modes in which a PC could run. **Real mode**
    would run all the older programs, and it would be limited to 1MB; **Protected
    mode** could access up to 16MB of RAM. (Later versions of Protected mode would
    address even more RAM than that.)


    # Extended Memory


    Soon motherboards began to be built to accept multiple megabytes of memory on
    them (**extended memory**). Utilizing these advanced motherboards was much easier
    than utilizing add-on memory boards, so expanded memory quickly became a thing
    of the past. Concurrently with this advance, programmers began writing applications
    to take advantage of extended memory using the eXtended Memory Specification (**XMS**).


    In order for an application to be able to use XMS memory, a device driver called
    **HIMEM.SYS** needed to be loaded into memory. It was placed in the **CONFIG.SYS**
    startup file so that it loaded automatically at startup. A side benefit of HIMEM.SYS
    was that it enabled another command to be used in CONFIG.SYS (DOS=HIGH) that relocated
    parts of MS-DOS from conventional memory to the first 64KB of extended memory
    above the 1MB mark, freeing a few kilobytes of precious


    ![](bbox=[0.12, 0.88, 0.18, 0.95])'
  merge: -1
