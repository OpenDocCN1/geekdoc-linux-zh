  md: '# Chapter 18


    # Working without a Mouse


    You might occasionally run into a situation where the mouse pointer disappears
    (not freezes), but the keyboard still works. When this happens, you must rely
    on shortcut keys to get yourself out of the mess. It might affect only one program,
    such that when you terminate that program the problem goes away—or it might affect
    Windows in general.


    Table 18.1 provides some essential key combinations you will need when trying
    to feel your way around Windows without a mouse. Two of them, the Windows key
    and the Menu key, are found only on Windows-style keyboards.


    # Table 18.1: Keyboard Navigation in Windows


    | Keys | Purpose |

    |---|---|

    | Alt+F4 | Closes the active program window. If no program window is active, brings
    up the Shut Down dialog box for Windows itself. |

    | Ctrl+Alt+Delete | Opens a Task Manager window (may have a different name in
    some Windows versions) from which you can select and terminate individual running
    programs or choose Shut Down to shut down Windows in general. |

    | Windows key | Opens the Start menu. Then you can use the arrow keys to move
    around on it and press Enter to select a command. |

    | Menu key | Same as right-clicking an object; brings up a shortcut menu for whatever
    item is at the mouse pointer location. (Of course, if you can''t see the mouse
    pointer onscreen, this isn''t all that useful.) |

    | Alt+letter | Pressing Alt makes underlined letters appear in menu names if they
    don''t appear already. Then following that up with a typed letter opens the menu
    with that letter underlined in its name. You can then use the arrow keys to move
    up or down the menu, and press Enter to select a command. |

    | Alt+Tab | Switches between the open windows. Press and release to move one-by-one,
    or hold down Alt and tap Tab to see a box with icons for them and move among those
    icons. |

    | Alt+Enter | Switches between the open windows by bringing the currently active
    one to the bottom of the pile and moving the next one up. Press this multiple
    times until the window you want comes to the top. |'
  merge: -1
