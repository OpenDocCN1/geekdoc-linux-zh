  md: '![](bbox=[0.0, 0.0, 1.0, 0.25])


    In only a decade, the Internet has gone from a specialized geek tool to a mainstream
    community with millions of members. Nearly everyone, from kids to seniors, is
    on the Internet these days. As a PC technician, you will need to know how to set
    up and configure Internet connections of various types. I won''t explain how to
    use the Internet here—that''s a subject for a whole ''nother book and besides,
    you probably know already. Instead, I''ll cover the following topics:


    +   - Understanding Internet connectivity

    - Types of Internet connections

    - Understanding Internet protocols

    - Setting up an Internet connection

