    # How RAM Stores Data


    RAM stores data in rows and columns, much like a spreadsheet, and each intersection
    of a row and column is a unique address containing one bit (containing either
    a one or a zero).


    Just like a spreadsheet, a RAM chip’s memory space has a vertical size and a horizontal
    size. Its **width** is the number of cells across, and its **depth** is the number
    of cells down. (This concept of width will become important later when we talk
    about memory banks.)


    The operating system uses RAM’s “spreadsheet” as a holding tank for itself, for
    open applications, for open data files, and for many other purposes. The operating
    system keeps track of what is stored where, and it then signals to RAM to deliver
    the content of a particular memory address to the CPU at the needed time.


    Memory addressing in a PC is referred to in hexadecimal (“hex”), which you may
    remember is a numbering system with a base of 16. A hexadecimal number can have
    digits 0 through 9 plus the letters A through F in it. Memory addressing is done
    in hex rather than decimal because everything is in multiples of 8 or more, and
    a base-16 numbering system fits the requirements very well.


