    It''s good to know something about MS-DOS because you''ll find many remnants of
    it in Windows 9x (that is, Windows 95, 98, and Me). To really understand Windows
    9x, you need to know what items are there for backward-compatibility and which
    are necessary for Windows 9x operation.


    A disk requires three files on it in order to boot MS-DOS:


    +   - IO.SYS: The controller for hardware interaction

    - MSDOS.SYS: The controller for software interaction including the **MS-DOS kernel**
    itself

    - COMMAND.COM: The command interpreter that interacts with the user


    **AUTOEXEC.BAT**

    A file that lists the programs that should automatically be run at startup.


    They load in that order. The functions of IO.SYS and MSDOS.SYS are actually a
    little more complicated than that, but let''s keep it simple for now.


    An MS-DOS bootable disk can have two startup configuration files: **CONFIG.SYS**
    and **AUTOEXEC.BAT**. Both are optional; MS-DOS can boot just fine without them.
    Both are plain text files that you can edit in a text editor such as EDIT (MS-DOS''s
    own text editor program).


    CONFIG.SYS contains instructions to load device drivers for various pieces of
    hardware and to set environment settings. You learned about HIMEM.SYS and EMM386.EXE
    in Chapter 14, "Operating System Basics." Both of these files are loaded through
    CONFIG.SYS. A driver for a CD-ROM drive would also be in CONFIG.SYS. CONFIG.SYS
    can run only at startup.


    AUTOEXEC.BAT contains instructions to run any programs that you want to automatically
    execute at startup. It runs automatically at startup, but it can be rerun at any
    time by typing **AUTOEXEC** and pressing Enter. The .BAT extension stands for
    "batch file;" a batch file is a list of commands that should be run as a group,
    or batch. Examples of commands in AUTOEXEC.BAT might include MSCDEX.EXE (the DOS
    utility for controlling the CD-ROM driver), PROMPT (which specifies the appearance
    of the command prompt itself), and MOUSE.COM (which loads a mouse driver).'
