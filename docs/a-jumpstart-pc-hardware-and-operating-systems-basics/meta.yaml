- img_proc: false
  md: '# A Look at Some Expansion Boards


    point next to it, or it''s in the Other Devices category (or there''s an unknown
    device in the Other Devices category), Windows has detected that it''s a new device
    but it doesn''t have the needed information about it. Run the setup program that
    came with the sound card to install the drivers for it, or install a driver manually
    as explained in Chapter 17.


    # No Speaker Icon in Notification Area of Windows


    The lack of a speaker icon in the notification area (a.k.a. the System Tray) in
    Windows, down by the clock, can indicate that Windows doesn''t see the sound card
    (see above). But it can also mean just that someone has turned off the display
    of that icon.


    To turn the speaker icon display back on again:


    +   1. From the Control Panel, double-click Multimedia (or Sounds and Multimedia
    in Windows 2000).

    2. Select the Show volume control on the Taskbar check box.

    3. Click OK.


    # No Sound At All


    Check the easy fix first: check that the speakers are plugged into the correct
    port on the sound card, are turned on, are turned up, and are receiving power
    from whatever source they use (AC or battery).


    Still no sound? Check in Device Manager to make sure Windows sees the sound card.
    (See Chapter 17.) Also make sure the sound has not been muted in Windows. To check
    this, double-click the speaker icon in the notification area to open the Volume
    properties box. Clear any Mute check boxes that are marked, and drag the volume
    slider up to increase the volume.


    ![](bbox=[0.135, 0.63, 0.62, 0.82])'
