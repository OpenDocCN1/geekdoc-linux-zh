  md: '# Appendix C


    **PCMCIA** Also called PC Card. A standard for credit-card size devices that plug
    into a notebook PC. There are three sizes: Type I (for memory), Type II (for most
    devices), and Type III (for drives).


    **Peer-to-peer network** A network that consists only of clients, with no central
    server.


    **PGA** Pin Grid Array. A type of CPU with a grid of pins on its underside that
    fit into a motherboard socket.


    **Physical drive** The entire physical hard disk, encompassing all partitions
    and logical drives.


    **Piezoelectric inkjet printer** An inkjet printer that moves the ink through
    the print nozzles by applying electrical charges to piezoelectric crystals.


    **Pit** An area of an optical disk that is indented, resulting in less light reflecting
    back from it.


    **Pixel** A dot with a separately described color from the surrounding dots on
    the display.


    **Platen** The roller bar behind the ribbon on an impact printer that absorbs
    the impact and keeps the paper in place.


    **Plug and Play** A standard for devices to talk to operating systems to report
    their specifications and driver requirements so the operating system can set them
    up without user intervention.


    **Plug and Play** A standard for detecting new devices and installing drivers
    for them automatically. To work, it must be supported by the device, the motherboard
    chipset, and the installed operating system.


    **Polarity** The positive or negative aspect of an electrical voltage. A charge
    can have either a positive polarity or a negative polarity.


    **POST** Power-On Self Test. A set of low-level hardware diagnostics that confirm
    the basic operability of the motherboard, memory, CPU, and some other essential
    components.


    362


    **Power sag** Occurs when the power supply doesn''t get enough power. It''s also
    called a brown-out. You may have experienced this in your home when the lights
    dim and buzz for a moment but don''t go out completely.


    **Power surge** A power surge occurs when the power supply gets too much power.
    It can cause the PC to reset, the power supply to burn out, or circuit boards
    to go bad. A power spike is like a surge only more so. Power spikes are even more
    likely to permanently damage hardware.


    **Power_Good Wire** Also called Power_OK wire. The wire from the power supply
    to the motherboard that tests the power supply''s performance before the rest
    of the system starts up.


    **Ppm** Pages per minute, a measurement of printer output speed.


    **Preemptive multitasking** Multiple applications taking turns using the main
    CPU with the CPU itself being in charge of how much time each application gets
    at once.


    **Primary corona wire** A negatively charged wire in a laser printer that applies
    a uniform –600v charge to the drum in preparation for writing a page image to
    it.


    **Print resolution** The number of individual dots that make up a printed image,
    measured in dpi.


    **Print spooler** A program that holds print jobs in a queue while they are waiting
    to be printed. The spooler takes the pressure off the operating system, freeing
    it to work on other tasks.


    **Printer driver** A piece of software that acts as a translator and traffic director
    between a printer and the operating system.


    **Product activation** An anticopying measure in Windows XP and some other Microsoft
    applications that makes it nearly impossible to install the software on additional
    PCs once it has been installed and activated on another PC.'
