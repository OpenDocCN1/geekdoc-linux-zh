  md: '# # Considerations for Specific Drive Types


    Is that all there is to setting up a removable drive? Usually, yes. But there
    are a few special cases where some more info or configuration would be helpful.
    Let''s look at those now.


    **LS-120**

    An IDE-based floppy drive that accepts both normal floppy drives and 120MB super
    disks.


    # ## LS-120 Drive


    An LS-120 drive, also called a "super drive," is a floppy drive that runs on the
    IDE interface rather than the normal floppy interface. It reads and writes normal
    1.44MB floppies, but it also reads and writes special 120MB "super disks."


    You install and set one of these up just like a hard disk, CD-ROM, or any other
    IDE device. The BIOS will probably detect it automatically. If it doesn''t, you
    might poke around in the BIOS setup to see whether there is a specific IDE Removable
    setting you can use for that IDE position.


    ![](bbox=[0.38, 0.43, 0.88, 0.71])


    # ## CD-RW Drive


    A CD-R or CD-RW drive installs and sets up the same as a regular CD-ROM drive
    as far as the BIOS is concerned. It will operate just fine in any version of Windows
    right out of the box, but it won''t have any writing capabilities until you install
    a CD writing application. The necessary software probably came with the drive,
    and you can also buy higher-end applications separately such as Adaptec''s Easy
    CD Creator Platinum.


    A CD-RW drive can write either to CD-R discs or to CD-RW ones. The CD-R blanks
    are write-once, and to write to them you use a CD burning application. The CD-RW
    discs are treated like ordinary floppy or hard disks, complete with'
  merge: -1
  pgno: 183
- img_proc: false
  md: '# Focus on Removable Disk Drives


    drag-and-drop capability, thanks to a feature called **packet-writing**. You must
    install packet-writing software in order to enable this feature. Most drives come
    with a packet-writing program; one such program is Adaptec''s DirectCD. Once installed,
    it loads automatically when Windows starts up.


    ![](bbox=[0.02, 0.17, 0.08, 0.25])


    > **TIP**


    When referring to a CD-ROM, the spelling is *disc* rather than *disk*. To keep
    it straight, think round versus square. Any disk that is square is a disk with
    a *K* (hard disks and floppy disks). Any disk that is round is a disc with a *C*
    (CD-ROM, DVD, and so on).


    **Packet writing**

    A feature that enables a CD-RW disc to be treated as a regular disk, and to be
    written and rewritten multiple times.


    # DVD Drive


    A DVD drive looks and works just like a regular CD-ROM drive most of the time,
    but it can also read DVD data discs as well. It needs no special utilities, applications,
    or support to do this.


    However, if you want to play DVD movies on your PC using a DVD drive, you must
    have MPEG decoding capabilities. MPEG compression is used to store the sound and
    picture for movies. A PC and its normal components don''t have enough firepower
    to handle that amount of data all by themselves. An MPEG decoder takes on that
    burden and does all the decompressing needed for displaying the movie.


    Early DVD drives required a separate expansion board to function as the MPEG decoder.
    Later on, some video cards were introduced that handled this function as a piggyback
    to their regular video card duties. Lately, software MPEG decompression has become
    popular, as programmers have figured out ways to make software do a good job of
    decoding without unduly burdening the rest of the PC. However, a separate expansion
    board for MPEG decoding still results in the best quality movie playback with
    the least disruption to the PC''s other operations.


    If you do have a separate MPEG decoder board, or decoding on the video card, a
    cable must be installed that runs from the DVD drive to that circuit board.'
