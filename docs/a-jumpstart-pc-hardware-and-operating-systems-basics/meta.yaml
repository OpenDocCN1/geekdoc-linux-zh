  md: '# Chapter 1


    # Avoiding Hurting the PC


    It''s much easier to hurt the PC than it is for the PC to hurt you. In many cases,
    you won''t even realize you''ve harmed it until it stops working or starts acting
    all squirrelly.


    # Electrostatic discharge (ESD)


    An electrical shock that occurs when two objects of uneven charge come in contact
    with one another. Otherwise known as static electricity.


    # The Evils of Electrostatic Discharge


    **Electrostatic discharge** (ESD) is another name for static electricity, the
    same stuff that shocks you after you''ve scuffed your feet across the carpet on
    a low-humidity day.


    # Ground


    To bleed off electrical charge to a safe location where it can dissipate, such
    as to the earth itself.


    Computer components are extremely sensitive to ESD. It takes about 3,000 volts
    of ESD for a human to feel it, but only about 300 volts (or even less) to weaken
    or even ruin a circuit board. This means you can cause major damage to a PC without
    any evidence of it at all—until you turn it on and it doesn''t work anymore. The
    damage might not show up immediately; an ESD shock can weaken a component such
    that it fails a day or a month later, or it can make it malfunction in intermittent,
    unexplainable ways.


    To prevent ESD damage, you need to keep the charge equalized between you and the
    PC. The best way to do that is to wear an antistatic wrist strap. It has a wristband
    at one end and an alligator clip at the other; attach the clip to the PC''s metal
    frame. If you don''t have a wrist strap available and need to work on a PC, an
    alternative is to touch the chassis or power supply frequently as you work on
    the PC, to keep equalizing that charge.


    The second part of preventing ESD is to **ground** yourself. One way is to keep
    the PC plugged in as you work on it, because its power cord connects to a grounding
    plug in the wall outlet, and then touch the PC chassis periodically as you work.
    However, as discussed earlier, for your own safety this is not a good idea. When
    what''s best for you and what''s best for the PC conflict, your safety should
    prevail. A better way is to buy an antistatic mat that comes with a grounding
    plug, and then plug it into the wall outlet. Stand on the mat as you work, or
    place the mat on the work surface next to the PC. Connect your wrist strap to
    the grounding mat, instead of to the PC frame.


    You can also minimize the chances of ESD damage by wearing appropriate clothing.
    Rubber-soled shoes are better than leather ones, cotton socks are better than
    nylon, and fabrics that generate static electricity are a no-no. You can also
    help the situation by keeping the humidity up in the room in which you''re working;
    a portable humidifier can make all the difference.'
  merge: -1
  pgno: 23
- img_proc: false
  md: '# Safety and Preventive Maintenance


    When storing circuit boards, don''t just stack them in a box; place each board
    in a separate ESD-protected storage bag. You have probably seen such bags before—they
    look like plastic bags, but they have a coating on the inside that inhibits static.
    Most circuit boards you buy come in them, and you can also buy extras at your
    local computer store.


    Some PC technicians scoff at ESD damage and don''t take any of these precautions.
    They claim that they''ve never damaged anything with ESD, and it''s all a bunch
    of hooey. However, as I mentioned before, not all ESD damage is immediate and
    obvious, so how would they know for sure? I have personally ruined more than one
    motherboard by failing to take ESD precautions, so let me assure you that this
    danger is real.


    # Understanding Electromagnetic Interference (EMI)


    Perhaps you learned in science class that electricity generates a magnetic field.
    When current travels through a cable, a magnetic field builds up around that cable.
    When two cables run close together, one can interfere with another. This is **electromagnetic
    interference**, or EMI. EMI causes no permanent damage to components; when you
    remove the electrical flow through the cable, the interference ceases.


    EMI can manifest itself in a number of ways. On a cable carrying data, you might
    get garbage characters in your data. For example, in a printer cable the printout
    might contain extra characters or have odd formatting. On a cable carrying power,
    you might get power spikes and sags.


    To avoid EMI, try to use shielded cables whenever possible. A shielded cable contains
    a sheath around the outside that prevents a magnetic field from passing through.
    Using shorter cables can also minimize EMI, and keeping cables separated physically
    from one another helps as well.


    # The Hazards of Magnets


    Hard disks and floppy disks are coated with metal particles, and the write head
    on the drive magnetizes them to store the data. So you can imagine what happens
    to the data on the disk when the disk is exposed to a magnet, right? All kinds
    of headaches.


    Most people wouldn''t be so blatant as to stick a magnet inside a PC, although
    there''s always the occasional doofus who affixes a floppy disk to his filing
    cabinet


    # Electromagnetic interference (EMI)


    The corruption of a signal by the magnetic field of another nearby electrical
    device.'
