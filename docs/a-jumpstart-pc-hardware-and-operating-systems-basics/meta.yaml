    # Removing Devices


    To remove a piece of hardware, shut down Windows (unless it''s a USB, FireWire,
    or PCMCIA device) and physically remove it. The next time you start Windows, there
    should be no trace of the device in Device Manager if it was a fully Plug and
    Play device.


    If you do see the device''s driver in Device Manager after it has been physically
    removed, delete it from there by clicking on it and then pressing Delete or clicking
    Remove.


