- img_proc: false
  md: '# Chapter 1


    > ## NOTE


    Nothing bad is likely to happen if you clean the monitor with the power on, but
    it never hurts to play it safe. A long time ago I saw a store employee fry a monitor
    by spraying glass cleaner on it while it was running, and that image has stayed
    with me ever since. Besides, it''s much easier to see the spots and dirt on the
    monitor when it''s turned off.


    Don''t use regular glass cleaner on a monitor because it contains ammonia and
    can potentially harm the anti-glare coating used on some monitors. Don''t use
    soap because it can leave a residue.


    Clean the plastic parts of the monitor with a clean damp cloth and a mild soap
    solution. Make sure the cloth is just barely damp—not wet! Damage can result if
    you drip water down inside the vent holes on the monitor.


    # Cleaning a Keyboard


    A keyboard can get pretty filthy, because it''s always being touched. To clean
    one, first make sure the PC is off. (You don''t necessarily need to unplug the
    keyboard from the PC.) Then do the following:


    +   1. Turn the keyboard upside down and shake it. This clears the debris out
    from under the keys.

    2. Wipe the keycaps with a damp cloth and mild soapy water.

    3. Use a folded moistened paper towel to reach in the cracks between the keys.
    Be careful not to drip water under the keys.

    4. Allow the keyboard to dry before using it.


    If you ever spill liquid on the keyboard, turn off the PC right away, shake the
    keyboard upside down to get rid of the bulk of the liquid, and then clean it and
    let it dry thoroughly. If the liquid contained sugar, and it went down below the
    keys, you probably won''t be able to get it clean; just buy a new keyboard. Some
    people have had success washing a keyboard in a dishwasher (on the top rack, with
    no heated drying), so if you''re going to throw the keyboard away anyhow, you
    might try it.


    > ## WARNING


    Don''t try to remove the individual keys on a keyboard for cleaning. You''ll find
    it very difficult to get it reassembled.'
  merge: -1
  pgno: 29
- img_proc: false
  md: '# Cleaning a Mouse


    Like the keyboard, the mouse gets very dirty because people have their hands on
    it. And that''s just the top of it–the bottom also gets dirty from picking up
    debris and dust from the mouse pad.


    When the mouse ball picks up dirt, it conveys it inside the mouse as it rolls.
    Over time, the rollers inside the mouse can get so dirty that they don''t work
    well anymore. The sensors inside the mouse that tell it how much the rollers are
    moving can also become impaired. When a mouse is dirty, the pointer often jumps
    or stutters across the screen.


    To clean a mouse:


    +   1. Turn the mouse on its back, and rotate the plastic plate that holds the
    mouse ball in place.

    2. Turn the mouse over again. The ball and plate should fall into your hand.


    > WARNING: Don''t clean the mouse ball with alcohol, because it dries out the
    rubber.


    ![](bbox=[0.19, 0.49, 0.62, 0.84])


    +   3. Clean the ball with soap and water; then dry it with a lint-free cloth.

    4. With a cotton swab and alcohol, clean the rollers and contact points inside
    the mouse. Let the alcohol evaporate completely before reassembling the mouse.

    5. Replace the ball and the plastic plate, and rotate the plate to secure it.'
  merge: -1
