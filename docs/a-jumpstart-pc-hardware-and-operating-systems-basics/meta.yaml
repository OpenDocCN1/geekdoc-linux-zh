- img_proc: false
  md: '# Focus on Hard Drives


    Are these reasons significant enough to warrant the extra cost and hassle? That''s
    a question to answer on a case-by-case basis.


    # Types of SCSI


    SCSI has been around a long time and, like ATA, has gone through several changes.
    Here are the three main types of SCSI:


    +   - **SCSI-1** The original. It used an 8-bit expansion card, and its bus operated
    at 5MHz. It could support up to seven devices on a chain. The standard was very
    loose, and as a result, proprietary SCSI devices sprang up like weeds, each with
    its own proprietary expansion card. It is now obsolete.

    - **SCSI-2** Introduced in 1990 as a way to standardize SCSI so that devices could
    use common interfaces. SCSI-2 came in two speeds–standard (5MHz) and fast (10MHz).
    It also came in three bit widths: 8-bit (standard or narrow), 16-bit (wide), and
    the less-common 32-bit (also called wide).

    - **SCSI-3** Improved SCSI standards operating at higher speeds. Also called Ultra
    SCSI. There are three speeds: 20MHz, 40MHz, and 80MHz, and two widths: 8-bit (narrow)
    and 16-bit (wide).


    There are many descriptors out there for SCSI specifications, but they can all
    be grouped into one of the three types. For example, if you see "Fast Wide SCSI,"
    you can assume that they''re talking about a 10MHz, 16-bit SCSI-2. If you see
    "Ultra-20 wide SCSI," you can assume it''s a 16-bit, 20MHz SCSI-3.


    One of the main advantages of SCSI is that you can chain together multiple devices
    off a single expansion card. Most SCSI variants will work compatibly with other
    variants on the same chain. If you have a SCSI-3 expansion card, you can use it
    to run SCSI-2 and SCSI-1 devices as well. However, these older-standard devices
    are limited, and they will slow down the data access to any devices that follow
    them in the chain.


    # SCSI Interface Cards


    A SCSI interface card adds the needed port(s) to the computer to support SCSI
    drives. Drives are not the only type of SCSI device—there are also SCSI scanners,
    CD-ROM drives, and so on. A single SCSI interface card can support up to seven
    different SCSI devices.


    SCSI devices can be either internal or external. Internal devices are those that
    connect to the SCSI interface from inside the PC. This would include any drives,
    including hard or CD-ROM. External devices are those that sit outside the PC and
    plug into it via an external cable. A scanner would be one example; an external
    backup tape drive would be another. Many SCSI interface cards have both internal
    and external connectors, so you can use both types of devices.


    ![](bbox=[0.79, 0.845, 0.9, 0.97])'
  merge: -1
  pgno: 160
- img_proc: false
  md: '# Chapter 8


    You might find two types of internal SCSI connectors on SCSI interface cards.
    One is the SCSI A cable; it looks just like an IDE ribbon cable except it has
    50 wires instead of 40. It’s used for 8-bit SCSI-1 and SCSI-2. The other type
    is the SCSI P cable; it has 68 wires and a D-shaped connector (but there are the
    same number of pins in both rows, unlike on a traditional D-sub connector).


    > **Terminate**

    To close the SCSI chain at the end, letting the system know that there are no
    other SCSI devices in the chain.


    The external connector type depends on the SCSI type. SCSI-1 always has a 50-pin
    Centronics external connector (like on a parallel printer), and SCSI-3 always
    has a 68-pin female D-sub connector. However, a SCSI-2 card could have a 25, 50,
    or 68-pin female D-sub, depending on the model.


    # SCSI ID and Termination


    Up to seven SCSI devices can be chained together so they run off the same interface.
    Internal SCSI devices usually run off the same ribbon cable; external SCSI devices
    usually have both an “In” and an “Out” port, so you can run one cable into the
    device and another cable out of it.


    Because all the devices share an interface, there needs to be a way to keep the
    traffic for each device separate. In IDE, this is the master/slave setup; in SCSI
    it’s an ID number assigned to each device. When a message comes from the operating
    system to the expansion card, it’s accompanied by an identifier that tells which
    device number should have the message delivered to it. Each device listens only
    for its own ID number and ignores everything else. Therefore, it’s important that
    you set each device to a unique ID number. Some devices are set with jumpers;
    others have a thumbwheel or a counter that increments when you press a button
    on it.


    ![](bbox=[0.3, 0.61, 0.34, 0.66])


    On devices that use jumpers to set the ID, the jumper settings are not nearly
    as obvious as on an IDE device. You might see three pairs of jumper pins, like
    this.


    In this example, the 1 and 4 pins are “jumped,” which adds up to a SCSI ID of
    5.


    The expansion card usually takes the SCSI ID 0 for itself, leaving IDs 1 through
    7 for attached devices. If you are going to boot from a SCSI hard drive, you should
    set its ID to 1, so it is the first device on the chain. Other than that, the
    ID numbers are up for grabs.


    Regardless of the number of connectors on the drive, the last device in the chain
    must be **terminated**—that is, it must be capped or blocked, either with a physical
    plug or with jumpers, to indicate that there are no more devices after it. On
    most hard drives, there is an extra jumper block for termination. When the jumper
    covers the pins, it’s terminated; when it doesn’t, it’s not. Almost all problems
    that users experience with SCSI devices are due either to improper ID assignment
    or improper termination.'
  merge: -1
