  md: 'From self-study guides to advanced computer-based training, simulated testing
    programs to last-minute review guides, Sybex has the most complete CompTIA training
    solution on the market.


    # # Sybex Covers CompTIA

    ## CERTIFICATION PROGRAMS


    # ### Study Guides


    Designed for optimal learning, Sybex Study Guides provide you with comprehensive
    coverage of all exam objectives. Hands-on exercises and review questions help
    reinforce your knowledge.


    # #### STUDY


    +   - In-depth coverage of exam objectives

    - Hands-on exercises

    - CD includes: test engine, flashcards for PCs and Palm devices, PDF version of
    entire book


    # ### Virtual Trainers™


    Based on the content of the Study Guides, Sybex Virtual Trainers offer you advanced
    computer-based training, complete with animations and customization features.


    +   - Customizable study planning tools

    - Narrated instructional animations

    - Preliminary assessment tests

    - Results reporting


    # ### Virtual Test Centers™


    Powered by an advanced testing engine, Sybex''s new line of Virtual Test Centers
    give you the opportunity to test your knowledge before sitting for the real exam.


    # #### PRACTICE


    +   - Hundreds of challenging questions

    - Computer adaptive testing

    - Support for drag-and-drop and hot-spot formats

    - Detailed explanations and cross-references


    # ### Exam Notes™


    Organized according to the official exam objectives, Sybex Exam Notes help reinforce
    your knowledge of key exam topics and identify potential weak areas requiring
    further study.


    # #### REVIEW


    +   - Excellent quick review before the exam

    - Concise summaries of key exam topics

    - Tips and insights from experienced instructors

    - Definitions of key terms and concepts


    Look to Sybex for exam prep materials on major CompTIA certifications, including
    A+, Network+, I-Net+, Server+, and Linux+. For more information about CompTIA
    and Sybex products, visit **www.sybex.com**.'
