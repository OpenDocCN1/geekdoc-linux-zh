  md: '# Chapter 10


    # No Microphone Input


    If sound goes out of the sound card but it doesn''t come in, check that the microphone
    is plugged into the MIC jack on the sound card. Also check whether the microphone
    has an On/Off switch that might be off and that the Mic has not been muted in
    the Volume properties.


    Notice in the figure shown in the preceding section that the Volume properties
    title bar reads Play Control. The sliders shown are for playback only. The Mic
    control doesn''t appear there because microphones do not play back. If you want
    to check the input controls, such as the Microphone, choose Options > Properties,
    click Recording, and click OK. This changes to the Record Control settings, which
    include Microphone. Notice also that instead of a Mute check box, there''s a Select
    check box. The check box must be marked for the device(s) you want to record from.


    ![](bbox=[0.425, 0.38, 0.835, 0.605])


    # Crackling Noises


    A persistent crackling from the speakers usually means that a recording device
    has been enabled and is picking up ambient static. Display the Record Control
    settings, as described in the preceding section, and clear all the Select checkboxes.
    If you ever need to do any recording, you can come back here and reselect the
    one for the recording device.'
