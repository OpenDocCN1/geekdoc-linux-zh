- img_proc: false
  md: '# Cleaning a Printer


    Different types of printers have different cleaning procedures. If any portion
    of the discussion of the printer''s parts doesn''t make sense to you here, wait
    until you''ve learned more about printers in Chapter 12, "Printing Basics."


    # Cleaning an Inkjet Printer


    Wipe the outside casing of an inkjet printer with a damp cloth and mild soapy
    water. It won''t necessarily make the printer perform any better, but it''ll make
    for a nicer office environment.


    The only parts of the inside that need cleaning are the inkjets, and you don''t
    clean them manually; instead you use a utility built into the printer to clean
    them. When printouts seem to be missing one color or another in a certain area,
    or there are gaps in the printout, it''s probably a dirty inkjet nozzle problem.


    > **NOTE**


    How do the inkjet nozzles get dirty? Well, the ink in an inkjet printer is liquid,
    and if you don''t use the printer frequently, it dries out, and bits of dried
    ink remain in the nozzles. The head cleaning utility flushes out any dried-up
    ink from the nozzles.


    On most printers there are two ways to activate the cleaning utility:


    +   - You can press a sequence of buttons on the printer itself.

    - You can choose a command from the printer''s Properties box in Windows.


    Here''s how to do it from Windows.


    +   1. Choose Start > Settings > Printers. (In Windows XP, it''s Start, Printers
    and Faxes.)

    2. Right-click your printer and choose Properties.

    3. Click the Utilities tab. The tab you want may not be named Utilities; it varies
    with the printer model and driver. However, you''re looking for a tab with a Head
    Cleaning option on it.

    4. Click the Head Cleaning button (or whatever it''s called for your printer)
    and then follow the onscreen prompts.

    5. Use the Nozzle Check feature (or similarly named feature for your printer model)
    to print a test that checks to make sure the print heads are clean.'
  merge: -1
  pgno: 31
- img_proc: false
  md: '![](bbox=[0.12, 0.06, 0.72, 0.44])


    You can also use compressed air to blow any paper dust out of the inside of the
    printer.


    # Cleaning a Laser Printer


    Laser printers use toner rather than ink. Because toner is a dry substance (made
    up of a mixture of plastic resin and iron oxide), it doesn''t clog things up the
    way liquid ink does. However, toner is a loose powder that can get all over your
    clothes and workspace if you don''t handle the cartridges with care.


    If you do happen to spill some toner, use a slightly damp paper towel to clean
    it up as best you can. If you get it on your clothing, the best way to get it
    out is with a magnet. Because toner is half iron, it''s very magnetic.


    Several parts of a laser printer can accumulate toner on them, making them less
    effective over time. Until you learn about the inside parts of a laser printer
    (in Chapter 12), this discussion might not make much sense to you, but remember
    it for later.


    The parts to clean on a laser printer include:


    **Corona wires**  These are individual wires strung horizontally across the inside
    of the printer. Most printers have two: the primary corona and the transfer corona.
    The latter is inside the toner cartridge on some models. Check the printer''s
    manual to find out whether you can clean them. If you can, clean them with a cleaning
    tool especially designed for that purpose, or'
  merge: -1
  pgno: 32
- img_proc: false
  md: 'use an alcohol-dipped cotton swab if you don''t have one. Be very careful not
    to break them. On some printers, corona wires are not present at all or not user-accessible.


    **Drum** You should never, *ever* touch the drum directly, because it''s easy
    to scratch, and a scratched drum leaves a scratched image on every printout. Instead,
    use the printer''s built-in cleaning utility program if there is one. Many Hewlett-Packard
    LaserJet printers have such a utility. The procedure involves running a sheet
    of paper through the printer so that a heavy layer of toner adheres to the paper,
    and then running the same sheet through again to pick up excess toner from the
    drum. If your printer doesn''t have such a utility, you don''t need to clean the
    drum. Some models include the drum in the toner cartridge, so that it''s replaced
    with each new toner cartridge; on such printers drum cleaning is not an issue.


    **Cleaning pad** On some printers, a felt pad cleans off excess toner. It''s mounted
    on a hard plastic strip. If your printer model uses a felt pad, a new one will
    be included with the toner cartridge and will need to be replaced at the same
    time as the cartridge. Look in the printer''s manual to determine the location
    of the pad and how to change it.


    ![](bbox=[0.43, 0.47, 0.81, 0.9])


    **Inside plastic parts** If any paper debris or dust is on the open plastic areas
    inside a printer, you can wipe it off with a slightly damp cloth.'
