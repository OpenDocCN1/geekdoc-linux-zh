  md: '# # Chapter 15


    **Splash screen**

    The graphic that appears while Windows or some other program is loading. It usually
    lists the program name and version number.


    ![](bbox=[0.24, 0.06, 0.34, 0.15])


    > ### NOTE

    In Windows 9x, all the functions of the MS-DOS IO.SYS and MSDOS.SYS have been
    combined into IO.SYS. There is still an MSDOS.SYS file (see Step 4), but it has
    a totally different purpose. Rather than being in charge of anything itself, it''s
    just a passive list of settings with which IO.SYS works.


    +   5. IO.SYS looks for a LOGO.SYS file, which is a graphic file that contains
    the Windows **splash screen**, and displays it.


    ![](bbox=[0.24, 0.29, 0.34, 0.37])


    > ### TIP

    You can press Esc while the splash screen displays to clear it away so you can
    watch startup commands being executed at the command prompt.


    +   6. IO.SYS looks for the Registry files, SYSTEM.DAT and USER.DAT, and checks
    them. Then it loads SYSTEM.DAT.


    7. IO.SYS looks for CONFIG.SYS and AUTOEXEC.BAT and executes them if found. They
    are not integral to Windows 9x, but they might exist for backward compatibility.


    8. IO.SYS loads HIMEM.SYS if it was not already loaded in CONFIG.SYS. (Remember
    from Chapter 14 that HIMEM.SYS enables the use of extended memory.)


    9. IO.SYS loads WIN.COM, which is the main Windows program, and then it hands
    off control to it.


    10. WIN.COM loads the virtual memory manager, VMM386.VXD.


    11. VMM386.VXD loads the 32-bit device drivers into memory.


    12. WIN.COM reads SYSTEM.INI if present and executes its instructions. SYSTEM.INI
    was the Windows 3.1 equivalent of SYSTEM.DAT.


    13. WIN.COM loads the GUI by loading three files: KRNL32.DLL, GDI.EXE, and USER.EXE.


    14. WIN.COM reads and executes any commands from WIN.INI if present. WIN.INI was
    the Windows 3.1 equivalent of USER.DAT.


    15. WIN.COM checks the content of the StartUp folder on the Start menu, and executes
    any programs that have shortcuts there.


    Knowing the functions of all these files can help greatly in troubleshooting Windows
    problems. For example, suppose you see an error message involving


