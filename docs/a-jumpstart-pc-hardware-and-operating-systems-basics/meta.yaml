  md: 'A Few Other Essential Components


    # Mouse


    You already know what a mouse is too, right? The thing that makes the pointer
    move onscreen. A basic mouse consists of four parts:


    +   - The body--that is, the part you hold with your hand.

    - A ball that moves as you move the body, or sensors that notice how much you
    have moved the body.

    - Buttons (usually two or three) that you press to make selections.

    - A cord or wireless interface for transmitting the data to the PC.


    The mouse works by converting physical movement to a digital code. The PC then
    takes that digital code and converts it to pointer movement. It''s a type of analog-to-digital
    converter similar to a sound card or modem, but in this case the analog part is
    movement rather than sound. (Remember, analog means something that is continuously
    variable, rather than digitally defined.)


    **Optical mouse**

    A mouse that uses light sensors instead of a ball to record movement.


    **Trackball**

    A mouse alternative in which the body stays stationary and the user rolls the
    ball manually.


    # Types and Features


    Several interfaces are available for mice. The original mouse interface was a
    COM (serial) port, because all PCs had them. Then PS/2 style mouse ports became
    popular. Finally, in the last several years USB mice have begun to be popular.
    Many mice for sale today come with adapters so you can use them in any of these
    ports. Because those ports are all serial, the data transfer is the same--bit
    by bit. The only difference is the connector and the speed at which the data is
    transmitted. Because a mouse''s operation is very low-bandwidth, the speed of
    the interface is not a big factor.


    The basic mouse has a roller ball on its underside and a "tail" cord that connects
    to the PC. Several variations are available that do away with one or both of those
    signature features, however. An **optical mouse** uses light sensors instead of
    a roller ball; the advantage here is that the inside stays clean because there''s
    no ball to convey dirt inside. (See Chapter 1, "Safety and Preventive Maintenance,"
    for mouse cleaning info.) A cordless mouse uses infrared signals to transmit data
    to the PC rather than a cord.


    Instead of a mouse, some users prefer a **trackball**. Take a mouse and hold it
    on its back, and then roll the ball with your finger. That''s the principle behind
    a trackball. The body sits still and you roll the ball manually. Trackballs are
    handy'
