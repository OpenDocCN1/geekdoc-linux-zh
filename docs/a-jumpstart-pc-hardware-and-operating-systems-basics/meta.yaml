  md: '# Chapter 8


    # Common Hard Drive Problems


    Here are some tips for troubleshooting problems with hard drives.


    # BIOS Doesn''t See the Drive


    This is almost always a physical or installation problem with the drive, and not
    the BIOS''s fault. Check all the connections, and check the jumper settings. If
    you have two masters and no slave on a cable, or two slaves and no master, the
    BIOS won''t see them. Try the drive in a different computer if possible.


    # No Drive Letter at Command Prompt or in My Computer


    This usually means the drive hasn''t been partitioned yet. It can also mean the
    drive has been partitioned using a system that the current operating system doesn''t
    recognize. For example, Windows 2000 and XP have an option called Dynamic Disk
    that offers disk management improvements, but if you use that feature none of
    the drive''s partitions can be seen in earlier Windows versions.


    # Can''t See Files on Drive


    If you can see the drive letter but can''t get a file listing on it, the drive
    has probably not been formatted yet, or it''s formatted with a file system that
    the current operating system doesn''t recognize. For example, Windows NT doesn''t
    recognize FAT32, and Windows 95, 98, and Me don''t recognize NTFS.


    # Data Error or Problems with a Specific File


    If you get an error message that says something about a data error, or if one
    particular file can''t be read, there is probably a bad spot physically on the
    disk. Run the Scandisk utility (in MS-DOS or Windows 9x) or the Check Disk utility
    in Windows 2000 or XP and specify that you want a surface scan. This takes a long
    time (up to a few hours), but it will identify and isolate bad spots on the disk.'
  merge: -1
