  md: '# Chapter 14


    # Windows Setup


    Each version has a Setup program (SETUP.EXE) that guides you through the installation
    process. Once you get that program started, installation is fairly self-explanatory.
    There are several ways to run the Setup program:


    **From an earlier Windows version** If you are upgrading from an earlier version
    of Windows, insert the CD-ROM and a box should appear informing you that the CD-ROM
    contains a more recent version and offering to perform the upgrade. Click Yes.
    Then follow the onscreen instructions. If nothing appears automatically, open
    My Computer and double-click the icon for the CD-ROM drive, and then double-click
    SETUP.EXE. See the section "Upgrading from Earlier Windows Versions" later in
    this chapter for more details.


    **From a bootable CD-ROM** Most Windows versions come on bootable CD-ROM discs.
    In order to boot from the CD-ROM, you will probably need to change the boot drive
    order in the BIOS Setup program. Change it so that the CD-ROM is searched before
    the hard disk. Then restart the PC, and the Windows Setup program should load
    from the CD, without any special drivers needed. This is useful for installations
    on a new or empty hard disk. It works only on systems that have a BIOS that supports
    bootable CDs.


    **From CD-ROM at a command prompt** If you have a bootable floppy disk containing
    CD-ROM drivers, such as one created in Windows 98, you can select the CD-ROM drive
    (by typing its drive letter and pressing Enter) and then type Setup and press
    Enter. This is useful for installations on a new or empty hard disk when installing
    a version of Windows that does not come on a bootable CD. The downside is that
    you must have a bootable floppy, or you must have access to a Windows 98/Me PC
    on which you can make one.


    **From Setup files copied to the hard disk** Some people prefer to copy the Windows
    Setup files to the hard disk first, and then run the Setup program from the hard
    disk instead of from CD-ROM. This makes for a slightly faster Windows installation,
    and it also keeps the Windows Setup files close at hand so you don''t have to
    reinsert the Windows CD-ROM later when you add or remove Windows components. A
    folder on the CD contains all the files you need; its name depends on the Windows
    version. For Windows 98, for example, it''s called WIN98. You don''t have to copy
    the entire CD''s contents to the hard disk—just that one folder.


    **Network installation** You can install over a network just as you can from files
    copied to the hard disk. All you need is command-prompt network access, which
    you can get by booting from a startup disk containing MS-DOS network drivers.
    Once you have command prompt access to the network drive containing the Windows
    Setup files, you can either run SETUP.EXE directly from there, or you can create
    a folder on the hard disk and copy the Setup files there as in the preceding section.'
