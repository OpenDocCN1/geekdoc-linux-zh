  md: '# Chapter 17


    # Introduction to Device Resources


    **Device resources** — Pathways or memory addresses that help a device communicate
    with the CPU and the operating system.


    A resource is a tool or commodity that helps you get something done. For example,
    when you want to go out to a movie but you don''t have enough money, you might
    say you "don''t have the resources."


    In a computer, **device resources** are resources that help devices do their jobs—that
    is, communicate with the CPU and the operating system. A device can use four types
    of resources. Not all devices use all four of these types.


    **IRQ** — Interrupt Request. A system resource assigned to a device so it can
    signal to the CPU that it is ready to communicate.


    **Interrupt Requests (IRQs)** IRQs are lines of communication to the CPU. There
    are 16 of them in a PC, numbered 0 through 15, but many of them are reserved for
    built-in system devices such as the keyboard and the IDE interfaces. They are
    necessary because the CPU must initiate all conversations with devices, but sometimes
    the devices need to "raise their hands" to ask for a conversation to be initiated.
    They do so by sending a signal on the interrupt request line, and the CPU responds
    by initiating a conversation.


    **I/O address** — Input/Output addresses in memory where devices place data for
    pickup by the operating system, and where the operating system places data for
    pickup by the device.


    **I/O addresses** I/O addresses are memory addresses, expressed in hexadecimal.
    They define areas of memory reserved for transferring data to and from the device.
    They are usually written using only the last four digits of the full address like
    this: 03E8. They are usually expressed as a range of addresses, such as 03E8–03EF.


    **Memory addresses** Memory addresses are also defined addresses in RAM. They
    define areas of memory reserved for the device''s use. They are usually written
    with eight digits of hexadecimal, such as 00A0000, and they are usually expressed
    as a range, such as 00A0000–00BFFF.


    **Direct Memory Access (DMA) Channels** These are pathways from a device directly
    into memory, bypassing the CPU. They are not popular anymore because of advances
    in hardware technology, but they used to be employed by devices like the keyboard
    and the sound card to improve their reaction time.


    Each built-in I/O port in a system has resources preassigned to it. For example,
    COM1 uses IRQ4 and I/O addresses 03F8 through 03FF. The port uses those resources
    whether or not anything is actually plugged into it (unless you disable it in
    the BIOS Setup program, that is). This is true for both COM (serial) and LPT (parallel)
    ports.


    In contrast, the expansion slots in a motherboard do not get any resources when
    they''re empty. Instead the system waits until you plug an expansion board into
    one of them, and then it assigns resources to that expansion board. For example,
    you might have four PCI expansion slots, and one of them is occupied by a


    ![](bbox=[0.06, 0.88, 0.14, 0.96])'
  merge: -1
  pgno: 317
- img_proc: false
  md: '# # Working with Devices in Windows


    modem. That modem uses an IRQ and an I/O address range. If the motherboard is
    **Plug and Play** capable, its chipset communicates with that modem, finds out
    what resources it needs, and assigns them.


    Some older expansion boards have jumpers on the board for setting the I/O address
    and IRQ. These are non-Plug and Play models; you choose the resources they will
    get, and then the chipset takes its cue from the expansion board. Most cards these
    days, however, are Plug and Play and, therefore, jumperless. Some expansion boards
    that were manufactured during the changeover period can operate either way—they
    have jumpers, but one of the jumper positions is Plug and Play rather than a specific
    assignment.


    > ## Plug and Play

    A standard for detecting new devices and installing drivers for them automatically.
    To work, it must be supported by the device, the motherboard chipset, and the
    installed operating system.


    Of the four resource types listed here, the most critical is the IRQ. That’s because
    there is a limited number of them and almost every device requires one. Older
    systems with lots of ISA devices would run out of IRQs and no more devices could
    be installed in them. One of the advantages of the PCI interface over ISA is that
    PCI devices can share IRQs; each expansion board need not have a unique IRQ assigned
    to it.


    There are other interfaces that help devices share resources too. Certain device
    types—such as SCSI, USB, and FireWire—work off a central controller that handles
    resource assignments for multiple devices. The controller requires an IRQ (and
    other resources too), but the individual devices do not.


    # # Viewing Resource Assignments


    To check out the current resource assignments of a device, use Device Manager
    in Windows. To open Device Manager:


    +   1. Right-click My Computer and choose Properties. The System Properties box
    appears.

    2. In Windows 9x, click the Device Manager tab. In Windows 2000, click the Hardware
    tab and then click the Device Manager button.

    3. To open a device category, click the plus sign next to it.


    ![](bbox=[0.2, 0.76, 0.52, 0.94])'
  merge: -1
  pgno: 318
- img_proc: false
  md: '# Chapter 17


    4. To see the resources assigned to a particular device, double-click it and then
    click its Resources tab.


    5. Check the Conflicting Device List to make sure there are no conflicts with
    other devices. (If the device is working, there are probably no conflicts.)


    ![](bbox=[0.485, 0.185, 0.78, 0.445])


    6. When you are finished, close all open dialog boxes.

    If you decide to take the A+ exam, you will need to memorize the default IRQ assignments
    for all devices. Table 17.1 summarizes them. Here are a few notes about them:


    +   - IRQS 2 and 9 cascade (i.e., connect) to one another, and they are, in fact,
    a single IRQ going by two different names. This connection is necessary because
    there are actually two banks of IRQs: 0 through 8 and 9 through 16.

    - Most systems do not have an LPT2, but there is a default assignment for it anyway
    (IRQ 5). If there is no LPT2, IRQ5 is free. This point often shows up on the A+
    exam, so make sure you remember the default assignment for LPT2.

    - COM ports 2 and 4 share an IRQ, as do COM ports 1 and 3. However, they don''t
    always share very gracefully, so if you ever have a choice of which COM port to
    use, try to use an odd-numbered one and an even-numbered one rather than two odd
    or two even.

    - When trying to remember which COM port goes with which IRQ, first remember that
    they use IRQs 3 and 4. Then remember that odd and even don''t go together. The
    odd COM ports go with the even IRQ (4).'
