- img_proc: false
  md: '# Chapter 11


    # Multimeter Basics


    Computer technicians use a device called a **multimeter** when taking electrical
    measurements. The “multi” part of the word refers to the fact that it is actually
    several meters in one: a voltmeter to measure volts, an ammeter to measure amps,
    and an ohmmeter to measure ohms. The meter has a dial or switch that can change
    between the different measurements.


    There are two types of multimeters: analog and digital. Remember that analog refers
    to continuously variable devices. An analog multimeter has a gauge with a needle,
    and the needle moves to show the measurement. It is continuously variable, meaning
    that there is no fixed division between one measurement and the next. A digital
    multimeter, in contrast, has an LED screen that shows the measurement as a number,
    and the division between one value and another value is mathematically quantifiable.


    Analog multimeters are fine for some jobs, but digital ones are much better for
    working on computer equipment. There are three reasons for this. One is that the
    digital readout is easier to read accurately. Another is that an analog meter
    does not show negative voltages; to test something with negative voltage, the
    probes must be reversed. The final, most important reason is that when a multimeter
    measures resistance, it sends a small pulse of electricity through the device
    being tested to see how much it impedes that pulse’s progress. Analog multimeters
    must send a much stronger pulse because they need more electricity to move the
    needle. This stronger pulse of electricity can damage some sensitive electronic
    components. A digital multimeter, on the other hand, can use a much weaker pulse
    that won’t hurt anything.


    > **Multimeter**

    A meter that is capable of taking several electrical measurements, including voltage,
    amperage, and resistance.


    ![](bbox=[0.46, 0.47, 0.76, 0.67])'
  merge: -1
  pgno: 223
- img_proc: false
  md: '# # A Few Other Essential Components


    The multimeter has two long skinny probes: one red and one black. The red probe
    goes on the live wire and the black one on a ground wire, and the gauge reports
    the measurement. There are typically at least two dials or range selectors: one
    to switch between the various functionalities (ohms, amps, or volts) and one to
    switch between ranges. Some newer multimeters adjust the range automatically,
    so there is no manual selector for it.


    **Back probing**

    Testing electricity while the device is on by sticking the multimeter probes down
    the back of the connector.


    # ## Measuring Voltage


    Voltage must be tested with the computer on. Because a connector must not be unplugged
    while the PC is running, you must stick the probe down into the back of the connector,
    where the wire comes into it. This is called **back probing**. To test a wire,
    set the multimeter to volts. Then place the red probe as far down as possible
    inside the connector where the wire in question enters the plug, and place the
    black probe down inside where a black wire (a ground wire) enters the same plug.
    So, for example, on an ATX power supply, you would test the Power_Good wire (gray
    wire) by sticking the red probe down inside the gray wire''s hole and the black
    probe down inside one of the black wires'' holes.


    ![](bbox=[0.16, 0.46, 0.63, 0.75])


    > **NOTE**

    Electrical testing is one of the few reasons for working on the inside of a PC
    while it is running. But you''re not really "working on" it in terms of adding
    or removing anything—you''re just running a test. Besides, if you suspect voltage
    problems, the computer will probably not start up at all, so the fact that the
    power is on does not mean that the computer is necessarily operating.'
  merge: -1
