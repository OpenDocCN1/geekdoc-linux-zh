  md: '# Measurements of Printer Performance


    Choosing a printer is a complex matter—you must think about the printer’s technology,
    the paper tray size, the resident fonts, and many other factors. However, when
    it comes right down to it, the two most important factors are


    +   - The quality of the output

    - The speed at which the output occurs


    # Print Quality


    One of the most critical factors in a printer’s output quality is the resolution
    at which it prints. **Print resolution** refers to the fineness of the individual
    dots that make up the printout. On modern printers, print resolution is measured
    in dots per inch, or **dpi**.


    Page printers typically have only one dpi measurement that refers to the dot spacing
    both vertically and horizontally. That is, a 300dpi printer will print 300 dots
    per vertical inch and 300 dots per horizontal inch, for a total of 9,000 possible
    dots per square inch. Some line printers, however, will have two separate measurements
    for vertical and horizontal, such as 720×1440. The first number is the horizontal;
    the second is the vertical.


    Most printers enable you to use them in any of several different resolutions;
    the lower the resolution you choose, the faster the printing speed. Look for a
    resolution setting in the printer driver’s Properties box—see “Printer Drivers”
    later in this chapter for help.


    ![](bbox=[0.216, 0.692, 0.563, 0.953])'
  merge: -1
  pgno: 232
- img_proc: false
  md: '# Chapter 12


    **NOTE**

    Very old dot-matrix printers measure quality in the number of pins in the print
    head rather than the dots per inch, so you might hear such a printer referred
    to as 9-pin (Near Letter Quality) or 24-pin (Letter Quality).


    Color is also an issue if the printer is capable of color output. The original
    printers were black ink only; color printers are a relatively recent innovation.
    Some printer technologies, such as inkjet, translate naturally and easily into
    color. Color inkjets are now the norm; you''d be hard-pressed to find a black-only
    inkjet on the market today. Other technologies, such as laser, are very difficult
    to convert to color output, so color models of these printers are very expensive
    and high-end.


    Some printers produce much more accurate color output than others. There is no
    industry-wide rating system for evaluating color quality on a printout; you have
    to see a sample from a printer and evaluate it subjectively. Various schemes for
    improving the color accuracy of a printout may be available through the printer
    driver''s Properties; experimentation with these is the best way to figure out
    which are valuable for your situation.


    # Print Speed


    On very old printers, speed was rated in characters per second (cps). Printer
    speed on most printers today is expressed in pages per minute (ppm). An average
    speed these days is about 8ppm (higher for laser printers and black-and-white
    printouts, lower for inkjet printers and color printouts).


    A printer''s rated speed is its physical maximum—that is, the amount of time it
    takes for the paper to physically feed through the paper path. If there is any
    delay while the printer processes data or lays down ink for a complex printout,
    extra time is required. Therefore, you can''t expect to achieve the rated speed
    in real-life usage. The rated speeds are useful primarily for comparing one printer
    to another.


    As I mentioned in the last section, one way to improve a printer''s actual speed
    is to turn down the resolution. Depending on the printer, there might also be
    some sort of Draft setting in the Properties that can improve print speed at the
    expense of print quality. For a color printer, you might also be able to temporarily
    set it to black-and-white mode to improve the quality of a draft print.


    **Ppm**

    Pages per minute, a measurement of printer output speed.'
  merge: -1
