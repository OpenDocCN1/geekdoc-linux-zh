  md: '# Chapter 3


    Power supply units come in two styles too: AT and ATX. An AT-style power supply
    has two motherboard connectors, labeled P8 and P9; these fit down over the 12
    pins—six pins each. These must be oriented so the black (ground) wires on each
    plug points toward the center; if you switch them, you can ruin the motherboard.


    ![](bbox=[0.34, 0.23, 0.83, 0.62])


    > NOTE


    There’s an apocryphal story in the industry that the AT power supply plug to the
    motherboard is in two pieces because the original designer didn’t have a large
    enough connector, so he rigged it temporarily with two separate connectors and
    the design caught on so fast they didn’t have time to fix it before it became
    the industry standard.


    An older AT power supply will have the power switch for the PC built into the
    power supply itself. The switch is mounted on the inside of the case with screws;
    when you replace the power supply on an AT system, you must detach the switch
    from the case. Newer models have four plastic-coated leads on an AT power supply
    instead of the actual switch, and instead of removing the whole'
  merge: -1
