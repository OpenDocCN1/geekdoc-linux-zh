  md: '# # Introducing the Hard Drive


    A hard disk and the drive mechanism are built together in a single package, so
    the terms "disk" and "drive" are more or less synonymous. In this chapter, I''ll
    use "hard drive" for consistency.


    Inside the hard drive''s metal box are a series of rigid aluminum platters coated
    with a nickel-cobalt or ferro-magnetic material. Each platter is double-sided,
    and each side of each platter has its own read/write head. As the drive spins,
    the read/write heads are held slightly off the surface of the disk by air pressure
    from the spinning. When the computer is off and the platters are not spinning,
    the read/write heads rest lightly on the platter surfaces.


    ![](bbox=[0.41, 0.35, 0.842, 0.611])


    Because the hard drive''s performance depends on the ability to keep the space
    between the read/write heads and the platters free of dust, hard drives are sealed
    in a metal casing. You should never attempt to open this casing yourself; such
    repairs are performed only in special ultra-clean facilities.


    Hard drives can store a lot more information than floppies, for several reasons.
    One is that there are multiple platters. Another is the physical composition of
    the platters—because they are rigid and coated with a superior surface, they can
    store more data per inch. Still another is that because the disks are sealed inside
    a dust-free metal casing, the read/write head can be much smaller and more sensitive.


    Hard drives are also much faster than floppies. One reason is the use of the IDE
    bus instead of the much slower floppy one. Another reason is the superior performance
    of the read/write heads and the fact that there are multiple platters, not a single
    large platter, on which to locate data. Today''s hard drives can read and write
    data at up to 100MB/sec.'
  merge: -1
