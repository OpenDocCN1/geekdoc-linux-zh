  md: '**Bus**

    A pathway between two or more components on the same circuit board.


    # What Makes Up a Motherboard?


    The motherboard is the “boss” of the system, handling dozens of administrative
    functions including starting things up, directing traffic, and interfacing with
    external devices. In the following sections, we’ll look at various parts of the
    motherboard to see what they accomplish.


    # Buses: The Circuits in “Circuit Board”


    A motherboard contains many chips and connectors. How do they communicate with
    one another? The secret’s in the circuits.


    All those tiny lines of metal thread zig-zagging across a circuit board are pathways
    (a.k.a. **buses**) that carry data. Data is sent via electrical pulses: a +5v
    signal stands for a 1 and no signal (that is, a +0v signal) stands for a 0. As
    you probably know, computers use binary numbers, so 1s and 0s are the only digits
    it needs.


    ![](bbox=[0.404, 0.484, 0.831, 0.865])


    You can think of a bus as a “highway” for data. One bus is differentiated from
    another by the number of lanes of traffic it can carry and by its maximum speed
    at which the data can travel.'
  merge: -1
  pgno: 61
- img_proc: false
  md: '# A Closer Look at the Motherboard


    The **system bus** is the bus that transports data among the processing portions
    of the system. It''s the fastest, widest bus on the whole PC, and necessarily
    so because almost every bit of data in the whole computing process must pass through
    it. The speed of the system bus is either the same as that of the CPU (measured
    in megahertz, or MHz) or a fraction of it. Newer systems are more likely to have
    CPUs that operate at multiples of the system bus. For example, on a system with
    a 1GHz CPU, you might have a system bus of 100MHz (1/10th of the CPU speed). On
    modern motherboards, the system bus is 64 bits in width, which means it can handle
    up to 64 bits of data simultaneously.


    The motherboard has other bus types, but let''s postpone their discussion for
    a bit. They''re associated with the expansion slots on the motherboard, and those
    items deserve their own section later in the chapter.


    # CPU Slot or Socket


    As you learned in Chapter 2, there are two basic types of CPU: pin grid array
    (PGA) and single edge contact (SEC). A motherboard will support one or the other,
    but not both.


    A motherboard that supports a PGA CPU will have a square socket with lots of little
    holes in it, as shown here. There have been various versions of such a socket
    over the years, and each version has a number. The one shown below is called Socket
    7. It''s a staggered pin grid array (SPGA) socket, because the concentric circles
    of pins are offset from one another. Manufacturers do this so they can fit more
    pins on the back of a chip without increasing the overall chip size. Earlier PGA
    CPUs did not have staggered pins.


    ![](bbox=[0.211, 0.652, 0.562, 0.951])


    # System bus


    The bus that carries data between the CPU and memory. Also called the external
    bus. "External" refers to the fact that the bus is outside the CPU; the CPU also
    has its own internal bus.'
  merge: -1
  pgno: 62
- img_proc: false
  md: '# ZIF


    Zero insertion force. A type of socket into which you can insert a chip without
    applying any pressure to it. ZIF sockets are advantageous when you''re working
    with a chip that has many "legs" or pins because it reduces the chance of bending
    one of them.


    The socket has a lever to its right; you lift the lever to install the CPU and
    then lower it to secure it. This type of socket is called zero insertion force
    (**ZIF**) because you don''t have to apply any pressure to secure the CPU in the
    socket.


    Not all PGA sockets are ZIF, as you will see in Chapter 4; ZIF sockets started
    being used with the later i486 models.


    A motherboard that supports a SEC CPU will have a slot, similar to the expansion
    slots but oriented differently, into which the cartridge fits. The motherboard
    will come with plastic brackets that you install on both ends of the slot to help
    hold the CPU cartridge in place. This is not a ZIF socket because you have to
    apply some pressure to insert the cartridge fully.


    ![](bbox=[0.284, 0.321, 0.957, 0.608])


    # RAM Slots


    All motherboards have two or more slots for random access memory (RAM). As mentioned
    in Chapter 2, modern RAM comes on small circuit boards that you plug into the
    motherboard. When we discuss RAM in Chapter 5, "Understanding Memory," you''ll
    learn all about the various types of it.


    For our discussion of the motherboard, the only thing you need to know about RAM
    is that it comes in different physical sizes. Most motherboards made in the last
    five years have slots for 168-pin Dual Inline Memory Modules (DIMMs). The "pins"
    are not actually pins in the same sense as on the ports and on PGA CPUs; they''re
    more like metal tabs that lie flat against the circuit board.'
