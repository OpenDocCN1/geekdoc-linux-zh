  md: '# Chapter 16


    # Using a Command Prompt


    > **Switch**

    A code typed following a command-prompt command that further defines how the command
    should be executed.


    Command-prompt commands and Windows menu selections are two different ways of
    accomplishing the same kinds of results. At a command prompt, a typical way of
    specifying settings for a command is to type **switches** following it. For example,
    FORMAT C: /Q means to format the C: drive using Quick Format mode, which does
    no physical checking of the disk and saves time. If this were a command in Windows,
    you might choose Format and be presented with a dialog box in which you chose
    which drive to format (C:) and what options you wanted (Quick Format).


    Most of the time users find it easiest to interact with Windows'' point-and-click
    GUI interface, but sometimes a command prompt will do a better job of an activity.
    For example, suppose you have a game that will operate in any of several video
    modes, and you sometimes want to use one mode, other times another mode. At a
    command prompt, you could type a switch following the command name that chooses
    the video mode you want. You can set up a shortcut in Windows for each video mode
    you want, but it''s more involved to do so.


    A PC technician should have a good grasp of a basic set of commands and their
    syntax, to be able to work confidently from a command prompt. Sometimes it''s
    necessary to work with files from a command prompt when preparing a new hard disk,
    for example, or when recovering from a system disaster that requires repartitioning
    and/or reformatting.


    # Displaying a Command Prompt


    There are two ways to execute command-line commands in Windows. One is with the
    Run command. Choose Start > Run and then type the complete command and click OK.
    This works well when you need to run a program that doesn''t have a Windows shortcut
    set up or when you want to specify switches along with the command.


    The other way is to open a command-prompt window, which is like running a mini
    version of MS-DOS from within Windows. To do that, choose MS-DOS Prompt or Command
    Prompt (depending on the Windows version) from the Start > Programs menu (or Start
    > Programs > Accessories in some Windows versions). This is useful when you need
    to see text-based results of the command you are executing, like with the IPCONFIG
    command shown in the figure. To close a command-prompt window, type **EXIT** and
    press Enter or close the window with its Close (X) button.'
