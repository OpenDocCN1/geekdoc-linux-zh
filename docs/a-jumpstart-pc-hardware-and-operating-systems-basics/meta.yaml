  md: '# # Troubleshooting Windows Problems


    # ## Application Quits with Error Message


    If you''re using an application (or you have just attempted to start it) and the
    program quits with an error message, the problem is either that application directly
    or its relationship to some other program that was running at the same time. Some
    error messages you might see include:


    **General Protection Fault (GPF)** A GPF happens when an application tries to
    do something that Windows can''t allow it to do because it would cause a problem
    with Windows itself or with other running applications. For example, the application
    might try to use memory space that is already in use or try to access hardware
    directly. This type of error usually occurs with 16-bit applications, and it can
    be solved by removing and reinstalling the program. If you see it on a 32-bit
    application, there is probably an internal flaw in the program itself, and you
    will need a patch from the manufacturer to correct it.


    **Illegal Operation** An illegal operation error occurs when the application requests
    an operation that Windows cannot carry out. It is not necessarily one that would
    harm anything else, as with a GPF. It could result from an internal flaw in the
    program or from a corrupted file. Typically, you''ll see a message such as "This
    program has performed an illegal operation, and will be shut down." Click the
    Details button to see more information about it. Rebooting the PC may solve the
    problem; if not, remove and reinstall the program. If the problem still occurs,
    look for a patch on the manufacturer''s website.


    **Invalid Working Directory** Each program needs a working directory (folder)
    in which to store temporary files as it operates. Some programs use the same folder
    that the application itself uses; others use C:\Windows\Temp or some other location.
    You might see this error if the working directory is located on a network that''s
    temporarily down. You can change the working directory for the program by right-clicking
    the shortcut that starts the program and choosing Properties, and then changing
    the Start In location.


    > GPF General Protection Fault. A type of program error that occurs when Windows
    protects itself against a program''s request to do something that would cause
    problems. Usually results in program termination.


    > Illegal operation A program error that occurs when an application asks Windows
    to do something that it cannot comply with. Usually results in program termination.


    # ## Nothing Happens When Starting Application


    Sometimes when you start an application, Windows acts as if nothing happened.
    Restarting the PC usually clears this up. If it doesn''t, remove and reinstall
    the application (see Chapter 16, "Essential Windows Tools and Skills").'
  merge: -1
