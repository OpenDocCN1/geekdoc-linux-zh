  md: '# Chapter 6


    # Monitors


    Monitors come in two types: **CRT** and **LCD**. A CRT is a "normal" monitor (the
    box type), and an LCD is the flat panel type of monitor found on notebook PCs.
    The following sections explain how each of them works.


    **CRT**

    Cathode Ray Tube. A type of monitor that uses a large vacuum tube and electrons
    to light up phosphors on a glass screen.


    # How CRTs Work


    The most common type of monitor today is the cathode-ray tube, or CRT. It''s essentially
    a large vacuum tube. At the back of the CRT is a long, narrow neck containing
    a cathode, and at the front is a broad rectangular surface with colored phosphors
    on it.


    **LCD**

    Liquid Crystal Display. A type of monitor that sends an electrical charge through
    liquid crystals to bend their reflectivity, changing the light passing through
    them.


    When the cathode is heated, it emits negatively charged electrons. Those electrons
    are attracted to the positively charged front of the CRT, where they strike the
    phosphors and cause them to light. One or more electron guns inside the monitor
    direct the electrons precisely, so they don''t just fly around aimlessly. A **monochrome**
    monitor has only one gun; a color CRT has three guns: one each for red, blue,
    and green.


    **Monochrome**

    Consisting of only one color. A monochrome monitor shows a single color on a black
    or white background (usually black).


    The guns don''t emit colored electrons, of course, so how are the colors formed
    on the screen? That''s a function of the phosphors on the screen. For each pixel
    on the screen (that is, each uniquely identifiable "dot"), there are three phosphors—one
    red, one blue, and one green—arranged in a triangle, or triad. Each electron gun
    works only on dots of a certain color. So, for example, if a certain pixel is
    supposed to be purple, the red and blue guns will fire at that triad but the green
    gun won''t, and your eye will see purple.


    **Dot pitch**

    The measurement of the distance between one colored dot in a triad and the same
    color in an adjacent triad.


    The distance between one color in a triad and the same color in the adjacent triad
    is the **dot pitch** of the monitor, one measure of CRT quality. A lower number
    means the dots are closer together, which makes for a better-quality picture.
    LCD monitors (covered in the next section) are also evaluated in terms of dot
    pitch.


    **Shadow mask**

    A grid of perforated metal with holes that guide electron placement to ensure
    that the correct phosphors are illuminated on a CRT.


    ![](bbox=[0.41, 0.72, 0.83, 0.86])


    As you can imagine, the potential for misalignment error is great when you are
    dealing with such small phosphors. Several technologies are available for keeping
    the electron beams properly aligned. The most common is a **shadow mask**, a thin
    sheet of perforated metal that sits between the guns and the phosphors.'
  merge: -1
  pgno: 125
- img_proc: false
  md: '# How Video Cards and Monitors Work


    Each gun directs itself through the designated hole for a particular triad, masking
    any stray electrons.


    ![](bbox=[0.18, 0.15, 0.55, 0.4])


    > **Aperture grille**

    A system of vertical wires that help guide the electrons so they hit the correct
    phosphors on a CRT.


    > **Slot mask**

    A hybrid technology combining shadow mask and aperture grille.


    Another technology for accomplishing the same thing is an **aperture grille**,
    made up of vertical wires between the guns and the phosphors. Still a third method,
    **slot mask**, is a combination of the two other technologies. In both aperture
    grille and slot mask, red, green, and blue stripes run the full length of the
    monitor rather than interspersed dots. The main difference between them is the
    number and placement of the stabilizing wires.


    On an aperture grille or slot mask monitor, *stripe pitch* rather than dot pitch
    measures the distance from one colored stripe to another stripe of the same color.
    Stripe pitch is basically the same thing though: lower is better. Entry-level
    CRTs have a dot pitch or stripe pitch of about 0.28mm, while the highest quality
    monitors have .22mm or so.


    # How LCDs Work


    The other common display type nowadays is a liquid crystal display, or LCD. You''ll
    find them in laptops and also in flat-panel workstation monitors.


    An LCD screen has two polarized filters, and between them are liquid crystals.
    In order for light to appear on the display screen, it must pass through both
    filters and the crystals. The second filter, however, is at an angle to the first,
    so by default nothing can pass through to the display. By applying current to
    a crystal, you can cause it to twist, which also twists the light passing through
    it. If the light twists so that it matches the angle of the second filter, it
    can pass through it and light up an area of the display. On a color LCD, an additional
    filter splits the light into separate cells for red, green, and blue. Because
    there is no need for a mask to help direct electrons, there is less dark area
    between each pixel; that''s what gives an LCD display that "saturated" appearance
    that most CRTs cannot fully duplicate.'
