  md: '# Chapter 16


    # Checklist of File Management Skills


    Let''s start with the basics. Every Windows user—especially those who aspire to
    being PC technicians—needs a thorough understanding of file, folder, and disk
    structure and management.


    Individual **files** are organized in **folders** (which were called directories
    under MS-DOS), and folders are stored on drives. Each drive has a drive letter.
    You can work with folders and files at a command prompt, in Windows Explorer (shown
    here), or in the My Computer window.


    ![](bbox=[0.36, 0.36, 0.91, 0.65])


    Here''s a checklist of skills to practice:


    **Moving and copying files between folders and disks** There are several methods,
    including Cut/Copy and Paste, drag-and-drop, and Move and Copy menu commands.
    You need to master them all. Familiarize yourself both with the standard **Windows
    Clipboard** and the enhanced one in Microsoft Office. Brush up on the Clipboard
    Viewer utility in Windows as well.


    **Deleting files and folders** Again there are several methods, including the
    Delete key, the right-click shortcut menu, and the regular Windows Explorer menu
    system. Also review the **Recycle Bin**, and how to retrieve files from it, empty
    it, and set its properties.


    **Renaming files and folders** Make sure you know the various ways of making a
    name editable, including pressing F2, clicking inside it, and using the Rename
    command.'
