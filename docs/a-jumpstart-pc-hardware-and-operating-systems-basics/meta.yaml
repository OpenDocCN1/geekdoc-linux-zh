  md: '# Electromagnetic


    A magnetic field created by electricity.


    # Polarity


    The positive or negative aspect of an electrical voltage. A charge can have either
    a positive polarity or a negative polarity.


    # Flux


    The direction of the flow of the magnetic field.


    As the name implies, a read/write head serves two purposes: it reads data already
    on the disk, and it writes new data to the disk. Most disk drives have more than
    one read/write head. A typical floppy disk has two heads, one on either side of
    the disk, for example. The disks are double-sided, so data is stored on both sides.
    A typical hard disk has many more heads; within that hard disk casing are multiple
    platters, each with a separate read/write head on each side of it. We''ll discuss
    more about hard disks later.


    # Electromagnetic Storage


    Hard and floppy disks store data **electromagnetically**, on disks coated with
    a very magnetic iron oxide mixture. This magnetic material is used to store patterns
    of electromagnetic charges on the surface of the disk.


    To understand what that means, let''s review some electromagnetic basics. Remember
    from our discussion of EMI earlier in the book that whenever you pass electric
    current through a wire, it generates a magnetic field around the wire. There''s
    a second part to that: if you reverse the flow of the current, the magnetic field
    reverses too. The conversion also works the other way as well: not only can electric
    current generate a magnetic field, but a magnetic field can generate electric
    current, and you can reverse the current flow by reversing the magnetic field.


    On an electromagnetic disk drive, the read/write head is a U-shaped piece of metal
    wrapped in the center with conductive wire. The ends of the U sit close to the
    disk surface. When electricity passes into the U-shaped piece (via the wire),
    it generates a magnetic field, which in turn affects the tiny magnetic particles
    on the surface of the disk. When the **polarity** of the current changes, the
    polarity of the magnetic field changes too. Because there are two possible polarities,
    there are two possible states for each area of the hard disk over which the read/write
    head passes: on or off (that is, 1 or 0 in binary-speak).


    The disk surface is some sort of non-magnetic base material (Mylar for floppies,
    usually aluminum for hard disks), with a thin covering of iron oxide or some similar
    magnetic material. A blank disk starts out with all the particles in a random
    assortment of polarities that cancel each other out. As the read/write head writes
    to the disk, each particle that passes beneath the head is individually set for
    one of the two magnetic polarities, depending on the direction (the **flux**)
    of the magnetic field at that instant.'
  merge: -1
