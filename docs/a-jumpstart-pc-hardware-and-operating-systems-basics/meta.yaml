  md: '# A Closer Look at the Motherboard


    # NOTE


    On very old motherboards you''ll see a few shorter ISA slots and a few longer
    ones. The shorter ones were 8-bit slots. Because you can use an 8-bit expansion
    card (if you can even find one anymore) in either an 8-bit or 16-bit slot, later
    motherboard designs made them all 16-bit slots.


    # Local I/O bus


    A bus for connecting certain types of high-speed expansion slots to the system
    bus.


    # Local I/O Bus


    Motherboard makers knew that they needed to make a faster expansion slot in order
    to avoid bottlenecks caused by the slow ISA bus, so they arrived at the idea of
    a **local I/O bus** (sometimes just called *local bus*). The local I/O bus is
    much like the system bus in that it works in synch with the CPU and has a more
    direct pathway to it.


    Several types of expansion slots have used a local I/O bus throughout PC history.
    The oldest was the VESA local bus (VL-bus). VESA was an international video standards
    committee, and the VL-bus was the bus they created. It used a normal ISA slot
    with an extender at the end, and the circuit boards that plugged into it had to
    be very long. This bus was popular on 486 PCs, but fell by the wayside by the
    time Pentiums were introduced. The VL-bus ran at up to 33MHz.


    ![](bbox=[0.146, 0.599, 0.657, 0.818])


    # NOTE


    The nice thing about VL-bus slots was that you could use them as ISA slots in
    a pinch. You can''t do that with any other slot types, including any of the expansion
    slots on modern motherboards.'
  merge: -1
