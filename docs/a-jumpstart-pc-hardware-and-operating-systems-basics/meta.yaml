  md: '# Essential Windows Tools and Skills


    would produce a listing of the files and subdirectories (folders) within C:\Windows.
    You can get a directory of other locations by specifying them in the command.
    For example, this command would give you a listing of what''s on the A: drive''s
    floppy disk:


    ```

    C:\Windows>DIR A:

    ```


    A couple of useful switches for the DIR command: /W displays the listing in a
    “wide” (multi-column) format, and /P displays them in a page-by-page format (one
    screenful at a time).


    Another useful command is COPY, which copies files from place to place. For the
    syntax, just remember COPY *What Where*. For example, to copy everything from
    the root directory of the A: drive to C:\MYFILES, use this command:


    ```

    C:\Windows>COPY A:*.* C:\MYFILES

    ```


    Yet another command you will need to know is DEL, short for Delete. It deletes
    the specified file(s). For example, to delete the file TEXT.DOC from the A: drive,
    you would use this command:


    ```

    C:\Windows>DEL A:\TEXT.DOC

    ```


    As usual, you don''t have to type the location if the file is in the current directory.
    So, for example, to delete all the files in C:\Backup, first change to that directory
    (CD \BACKUP) and then delete the files like this:


    ```

    C:\Backup>DEL *.*

    ```


    One last command: REN, short for Rename. Its syntax is REN Oldname Newname. So
    to rename the file APRIL.DOC to MAY.DOC, use this command:


    ```

    C:\Backup>REN APRIL.DOC MAY.DOC

    ```


    This chapter''s discussion barely scratched the surface of the commands a good
    technician should be able to use at a command prompt, but by now you should have
    a sense of what command prompt work is about. For more information, pick up a
    basic book on MS-DOS or an advanced book on Windows that covers command prompts.'
