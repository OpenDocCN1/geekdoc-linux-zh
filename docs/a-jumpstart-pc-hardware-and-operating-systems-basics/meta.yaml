  md: 'Chapter 11


    # Electricity Basics


    Most PC technicians don''t need to work with electricity—at least not much. Nevertheless,
    the A+ exam has several questions about electricity, so if you want to ace the
    test you have to study electrical concepts. With that in mind, the following is
    an extremely abbreviated tutorial in electrical concepts and measurements.


    Volts

    The measurement of the strength of a positive or negative electrical charge.


    # Positive and Negative Charge


    When you plug in an electrical device to a wall outlet, two prongs must insert
    into that outlet (some plugs have an optional third prong for grounding). One
    prong is positive; the other is negative. Electricity flows into the negative
    prong, through the device, and then back out the positive prong into the socket.


    Positives and negatives are very attracted to one another, and they are always
    looking for any opportunity to get together. (Think Romeo and Juliet—or the neighbor''s
    male cat and your female cat.) Positives are repelled by other positives, and
    negatives are repelled by other negatives. We start out with a whole bunch of
    negatives together in one prong of an electrical outlet. They don''t want to be
    there together—they want to go out and find positives. So when an electrical cord
    is connected to the outlet, the negatives immediately travel down the path provided
    for them. They travel through the outgoing wire in the cable, up into the electrical
    device, and the flow of the negatives through the device is like water current
    that turns a waterwheel. Then they travel down a second wire that leads back toward
    the outlet, and this second wire points directly into the positive side of the
    socket.


    # Volts


    The greater the difference in charge between the positives and the negatives,
    the greater the drive for them to get together and the more power each positive/negative
    pair supplies on their way to meet one another. This drive is measured in **volts
    (v)**. Ordinary household electricity is 110v in the United States; in some other
    countries, it is different (such as 220v in most of Europe). It''s important that
    the entire country has a standard agreed-upon voltage because electrical devices
    are designed to work only with a specific voltage. Too much voltage and a device
    will fry; too little and it won''t work.


    The devices in a PC (drives, etc.) each have different voltage requirements. For
    example, the CPU might need +3.3v and a drive might need +12v, +5v, or both. One
    of the jobs of the power supply is to step down the 110-volt power to the voltage
    required by each component.


    ![](bbox=[0.105, 0.87, 0.2, 0.955])'
  merge: -1
  pgno: 217
- img_proc: false
  md: '# A Few Other Essential Components


    # Amps


    There is not just one pair of positives/negatives; there are billions upon billions
    of them, just like there are billions of water molecules in a rushing river. A
    single water molecule can''t turn a waterwheel; but when billions of them work
    together, they can make the wheel spin really fast. The volume of electricity
    is the **current**, just like with water flow. Current is measured in amperes,
    or **amps** for short.


    # Watts


    **Wattage** is the overall amount of power a device actually uses. It''s determined
    by multiplying volts by amps. So, for example, a 75-watt light bulb uses 0.68
    amps of 110v power (because 110 times 0.68 is approximately 75).


    A light bulb is a good example because different wattages of bulbs will work in
    the same light socket. For example, suppose someone replaces a 75-watt bulb with
    a 100-watt bulb; the device would still use 110v, but it would draw about 0.91
    amps.


    This illustrates an important point: the amperage is controlled by the device
    receiving the power. The device "draws" the amps it needs out of the outlet; the
    outlet doesn''t push the amps onto the device proactively. When several different
    devices connect to the same extension cord, each one uses the same voltage but
    different amps, resulting in different wattages.


    # Resistance


    The positives and negatives always seek each other through the shortest, easiest
    path they can find; this is the path of least resistance. That''s not just an
    old cliché. **Resistance** is an electrical term that measures the amount of obstacle
    placed in the electricity''s path, and it''s measured in **ohms**. The Greek omega
    symbol (Ω) represents ohms as a unit of measure.


    Resistance measurements are used to describe the path(s) that electricity can
    take. Given the choice, the electricity will always prefer the lower resistance.
    Electricity needs a resistance of less than 20 ohms in order to be able to connect
    negative and positive. Infinite ohms (abbreviated with the "infinity" symbol ∞)
    means there is total resistance—that is, no possible path.


    Resistance does not have anything to do with any of the other factors discussed
    so far—it''s a measure of the device itself. So resistance is always tested when
    the device is removed from any power source. Why? Because a device will always


    +   **Current**

    The volume of electricity flowing through a circuit. Measured in amps.


    **Amps**

    Short for amperes. A measurement of electrical current or rate of flow.


    **Wattage**

    The amount of electricity a device uses, determined by multiplying volts by amps.


    **Resistance**

    The amount of obstacle in an electrical path.


    **Ohms**

    The unit of measurement for resistance.'
