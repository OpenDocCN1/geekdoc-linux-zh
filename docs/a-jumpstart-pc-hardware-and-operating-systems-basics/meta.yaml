  md: '# # A+ JumpStart


    PC Hardware and Operating Systems Basics


    # ## Build Your Computer Career on a Solid Foundation


    Whether you''re setting out to earn your A+ certification or just want to know
    more about how a PC works, *A+ JumpStart: PC Hardware and Operating Systems Basics*
    is the place to start. Inside, an experienced PC technician and author demystifies
    every aspect of PC technology, giving you a firm footing from which you can work
    towards and realize your goals. Coverage includes:


    +   - PC safety and preventive maintenance

    - Motherboard selection and setup

    - CPU and memory types

    - How video cards and monitors work

    - Setting up hard drives

    - Selecting and configuring expansion boards

    - Electricity basics

    - Selecting, installing, and troubleshooting printers

    - Selecting and setting up network components

    - Configuring Windows for network file and printer sharing

    - Device resource management in Windows

    - Troubleshooting Windows

    - Setting up Internet connections


    **About the Author** Faitehe Wempen, M.A., is an A+ Certified PC Technician and
    owner of Your Computer Friend, a PC support business in central Indiana. The author
    of over 50 books on computer hardware and software, she provides custom training
    services and specializes in PC hardware, Microsoft Windows, and Microsoft Office.


    Begin Working Towards Your A+ Certification


    Filled With Easy-to-Understand Explanations and Realistic Examples


    Learn How a PC Works, Basic Hardware Installation and Troubleshooting Techniques,
    and the Ins and Outs of Windows Configuration


    Includes Special Section on the Tools You Need for Your Personal PC Toolkit


    Visit our website for more information: www.sybex.com


