    # Parity Checking


    Because RAM was not completely reliable in the earlier days, a system of error
    checking was developed called **parity**. Memory with parity checking had an extra
    1-bit chip that functioned as a cross-check to make sure the data was being stored
    correctly. A parity check compares the number of 1 values stored in a particular
    byte with the number of 1 values found when accessing that byte. If the values
    are the same, the data is assumed to be correct. If the values are not the same,
    a parity error occurs and you see an error message.

    Here are a couple of sticks of memory—one parity and one non-parity. Count the
    number of chips; the parity model has an extra one. (It wouldn''t be quite as
    obvious if the SIMMs didn''t have eight and nine chips.)


    > **Parity**

    An error checking mechanism in RAM that uses an extra bit to ensure data accuracy.'
