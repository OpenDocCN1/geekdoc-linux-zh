- img_proc: false
  md: '# ## Mouse Pointer Freezes Up


    If the mouse pointer works at first in Windows and then stops responding, the
    problem is likely a device resource conflict. In other words, the mouse wants
    to use a certain system resource, such as an IRQ, that some other device wants
    as well. See Chapter 17, "Working with Devices in Windows," to troubleshoot device
    conflicts.


    A problem with an application or with Windows itself could also cause the mouse
    to freeze up and the entire system to stop responding, but this is not the mouse''s
    fault. The mouse pointer being nonoperational is a side effect of the main problem,
    which is a program error. See Chapter 18, "Troubleshooting Windows Problems,"
    to troubleshoot system problems.


    ![](bbox=[0.29, 0.33, 0.365, 0.395])


    > **TIP**


    To tell whether the mouse is the problem or the whole system is locked up, try
    using a keyboard alternative for an operation. For example, try closing the active
    window by pressing Alt+F4, or try opening the Start menu with the Windows key.
    If you seem to be able to navigate okay with the keyboard, the mouse itself is
    the problem.


    # ### Mouse Pointer Jumps Around


    This is almost always the result of a dirty mouse. Clean it, as described in Chapter
    1. If it still doesn''t work afterward, one of its contacts or rollers inside
    is probably damaged or worn out—time for a new mouse.


    # ### Pointer Won''t Move in One Direction


    This indicates that one of the directional rollers inside the mouse is either
    so caked with dirt that it doesn''t work anymore or has physically worn out. Clean
    the mouse; if the problem persists, buy a new one.'
