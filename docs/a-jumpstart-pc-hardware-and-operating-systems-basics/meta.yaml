  md: 'Focus on Hard Drives


    # Preparing a Hard drive for Use


    A brand-new hard drive has already been low-level formatted at the factory; all
    that remains is for you to partition and format it. You already know about partitioning
    and formatting from the discussion in Chapter 7, "Introduction to Disk Drives,"
    so let''s dive right in.


    # Starting the PC


    If you are adding a second drive and have kept your first one, you can boot to
    Windows normally and then do the partitioning and formatting from within Windows.
    If not, you''ll need to start the PC from a boot disk.


    # Windows 9x


    Windows 9x (including Windows Me) enables you to create an emergency startup disk
    that contains utilities you''ll need to prepare a hard drive such as FDISK and
    FORMAT. To create a boot disk, go to the Control Panel, choose Add/Remove Programs,
    and then click the Startup Disk tab and follow the instructions there.


    Then start the PC using the startup disk you created, and when prompted to start
    the PC with or without CD-ROM support, choose Without. A command prompt will appear,
    and you''ll be ready to start partitioning and formatting.


    You can also access the partitioning utility, FDISK, from a command prompt window
    within Windows itself, but I prefer to do it from a "clean" boot from a startup
    disk, just for added safety. (I''m always a little afraid of running disk utilities
    from a command prompt in Windows because of the way disk utilities take command
    of the system at a low level.) Formatting can be done either from the command
    prompt or from within Windows; it''s safe either way.


    # Windows 2000 or XP


    Windows 2000 and Windows XP do not have the emergency startup disk feature because
    they are not based on MS-DOS. If you have a new drive to prepare in one of these
    Windows versions, you can do it through the Windows setup program or from within
    Windows itself.


    To start the PC with the Windows 2000 or XP setup CD-ROM, set up your PC to boot
    from CD. To do so, go into the BIOS setup program and change the boot order for
    the system so that the CD-ROM drive comes first.


    ![](bbox=[0.82, 0.87, 0.97, 0.97])'
  merge: -1
