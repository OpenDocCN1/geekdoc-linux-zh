    jacks: one for incoming (from the wall) and one for outgoing (for a phone).


    Your next choice to make is whether to use a **hardware modem** versus a **software
    modem**. Another name for a software modem is a **Winmodem**; it’s a modem that
    is designed to work only under some version of Microsoft Windows. It’s cheaper
    than a hardware modem because it doesn’t have to be as smart—it offloads some
    of its processing duties to the PC’s own CPU through its Windows driver.


    I encourage my clients to buy hardware modems. Even with today’s better versions
    of Windows, a Winmodem can be more difficult to install and configure, and it
    can use more device resources than a hardware modem. On top of that, sometimes
    a hardware modem is required for a task, and a software modem simply won’t do.
