    **Hot-pluggable**

    Able to be connected and disconnected without shutting down the PC. Sometimes
    called *hot-swappable*.


    > **NOTE**

    For more detailed information about resource usage, check out the System Information
    utility in Windows. To run it, choose Start > Programs > Accessories > System
    Tools > System Information.


    **PCMCIA**

    Also called PC Card. A standard for credit-card size devices that plug into a
    notebook PC. There are three sizes: Type I (for memory), Type II (for most devices),
    and Type III (for drives).


    # Installing New Devices


    Installing new hardware used to be a great big production in early Windows versions,
    because Plug and Play didn''t work very well (if it worked at all) and because
    not all motherboards and devices were Plug and Play compatible. Nowadays, however,
    almost everything is Plug and Play compatible, so installing new hardware is basically
    a matter of plugging it in and turning on the PC.


    > **WARNING**

    Most types of hardware are not **hot-pluggable**. In other words, you must turn
    off the PC before you hook them up. Damage can result if you try to connect a
    device while the PC is running. If in doubt, you should assume that you need to
    turn off the PC. Hot-pluggable devices are those that connect via USB, FireWire,
    or **PCMCIA** only.


    Read and follow the instructions that came with the device to install it. In many
    cases, Windows may be able to detect the new device automatically but the instructions
    will say that you should run the software on the CD-ROM that came with the device.
    That''s because the device might have its own application software or extra driver
    files that provide added functionality over the driver built into Windows for
    the device. If the instructions contradict what''s in this chapter at any point,
    go with what the instructions say.


    # Plug and Play Devices


    If Windows detects the new device at startup, one of two things may happen:

    - A message may flash briefly on the screen about detecting new hardware and installing
    the drivers for it, and then the new device will start working automatically.


    ![](bbox=[0.13, 0.9, 0.2, 0.97])'
