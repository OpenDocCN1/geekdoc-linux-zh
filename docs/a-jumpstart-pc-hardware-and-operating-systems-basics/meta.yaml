- img_proc: false
  md: '# ## Printing Basics


    **Developing** The drum rotates past toner on a developing cylinder, which has
    the same 600v charge as the un-lasered portions of the drum. The areas of lesser
    negative charge on the drum attract the metallic toner, which jumps onto the drum
    and sticks to it at those spots, but the toner and the drum ignore one another
    in the spots where the charge is the same. Now the image of the page exists on
    the drum in toner.


    **Transferring** The **transfer corona wire** applies a +600v charge to the incoming
    paper. When the paper passes by the drum, the –100v toner particles on the drum
    jump off onto the paper because its positive charge, at 600v, is greater than
    the drum''s negative charge at 100v. Then the paper runs past a static charge
    eliminator, a row of metal teeth with a negative charge that neutralizes the paper''s
    high positive charge.


    **Fusing** At this point, toner is held on the paper by gravity and weak electrostatic
    forces. The fuser applies pressure and heat to the paper, melting the plastic
    resin particles in the toner so that they stick to the paper. The paper then ejects
    from the printer.


    Color laser printers are typically much more expensive than regular ones because
    the laser printing technology does not lend itself very readily to multicolor
    printing. To print in color, a laser printer must make four passes across the
    same page, laying down a different color each time (cyan, magenta, yellow, and
    black). The need for cheap color printing has fueled the popularity of inkjet
    printers, which are discussed next.


    # ## Inkjet


    Inkjet printers are the most popular printers for personal or home use these days
    because they provide a cheap way for the average person to get color printouts.


    Inkjet printers blow jets of ink onto paper. They utilize a nonimpact print technology;
    the print heads do not touch the paper at all. There are somewhere between 21
    and 256 nozzles for each of the four colors (cyan, yellow, magenta, and black)
    in the print head, and the ECU tells the jets to squirt ink in different combinations
    and proportions to form whatever colors are needed.


    Two technologies are used to force the ink out of the nozzles: thermal and piezoelectric.


    A **thermal inkjet printer** heats the ink to about 400 degrees Fahrenheit, which
    creates vapor bubbles that force the ink out. This creates a vacuum inside the
    cartridge, which in turn draws ore ink into the nozzles. This technology is also
    called bubble jet. Most inkjet printers made by Hewlett Packard and Canon use


    # ### Transfer corona wire


    A wire in a laser printer that applies a positive charge to the paper on which
    the image will be printed.


    # ### Thermal inkjet printer


    An inkjet printer that heats the ink to create vapor bubbles that force the ink
    out.'
  merge: -1
  pgno: 236
- img_proc: false
  md: '# Chapter 12


    this technology. Because the heat tends to degrade the print heads over time,
    ink replacement cartridges for these models often include replacement print heads
    as well. (That''s one reason why you should avoid home-refilling inkjet kits—because
    when you simply refill the ink, you don''t get a new print head.)


    A **piezoelectric inkjet printer** moves the ink with electricity instead of heat.
    The nozzles contain piezoelectric crystals, which change their shape when electricity
    is applied to them and force the ink out. Piezo technology is newer and is used
    in most of the inkjet printers sold today by Epson and Lexmark. It''s easier on
    the printer because the printer doesn''t need to contain a heating element, and
    it''s better for the output because the ink used is less prone to smearing.


    The main gripe people have with inkjets is the cost of operation. The ink cartridges
    are rather expensive, and they don''t last very long, making the cost per page
    (cpp) very high for inkjet printers compared to laser or dot matrix printers.


    > **Piezoelectric inkjet printer**

    An inkjet printer that moves the ink through the print nozzles by applying electrical
    charges to piezoelectric crystals.'
