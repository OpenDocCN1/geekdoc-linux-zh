  md: '# Appendix C


    **Internet client** A computer that uses Internet services.


    **Internet server** A computer that provides Internet services to other computers.


    **IRQ** Interrupt Request. A system resource assigned to a device so it can signal
    to the CPU that it is ready to communicate.


    **ISP** Internet Service Provider. A company that charges people money to help
    them connect to the Internet.


    **Java** A platform-independent programming language for creating applications
    that users using any type of PC can run through a web browser interface.


    **Joule** A unit of electrical energy. Surge suppressors are rated in joules,
    such as 800 or 1,300 joules.


    **Jumper** A cap that fits over a pair of pins, changing the electrical flow through
    a circuit board.


    **Jumper** A metal and plastic cap that fits over two pins on a circuit board,
    completing an electrical circuit between them and changing the flow of electricity
    through the board.


    **Key matrix** The grid of keys on a keyboard.


    **Keyframes** A set of still images that represent the start, middle, and end
    points of an animation; the computer can then generate the additional frames between
    the points.


    **L1** Stands for Level 1. A cache that holds data that is waiting to enter the
    CPU. Sometimes called a front-side cache.


    **L2** Stands for Level 2. A cache that holds data that is waiting to leave the
    CPU. Also called a back-side cache.


    **Land** An area of an optical disc that is unpitted, resulting in a full measure
    of light reflecting back from it.


    **LCD** Liquid Crystal Display. A type of monitor that sends an electrical charge
    through liquid crystals to bend their reflectivity, changing the light passing
    through them.


    **Line printer** A printer that prints one line of a page at a time.


    **Local Area Network** A network in which all the resources are located near one
    another.


    **Local I/O bus** A bus for connecting certain type of high-speed expansion slots
    to the system bus.


    **Logical drive** A section of a physical hard disk that''s identified by a unique
    drive letter, such as C:, D:, etc.


    **Low-order bits** The first four bits in a byte (reading from right to left),
    representing data to be processed.


    **LS-120** An IDE-based floppy drive that accepts both normal floppy drives and
    120MB super disks.


    **Machine language** The set of codes that the CPU understands for accepting numbers
    and instructions for calculating them.


    **Male** In computer jargon, a male connector is one that has pins rather than
    holes.


    **Master** The drive designated to handle all the data traffic on the IDE cable.


    **Math coprocessor** An extra chip that provides additional registers with which
    the CPU can process complex math calculations more quickly and efficiently.


    **MBR** Master Boot Record. Information stored on a drive about its partitions
    and boot capabilities.'
