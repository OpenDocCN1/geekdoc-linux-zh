  md: '# Chapter 3


    # Motherboard Form Factors


    *Form factor* refers to the size and shape of a device, as you learned in Chapter
    2, "A Look Inside a PC." Let''s begin this chapter by talking about the two form
    factors that a motherboard can have, because many details later in the chapter
    will depend on which form factor of motherboard you have.


    # The AT Motherboard


    The older of the two form factors is AT, which stands for Advanced Technology.
    Its name comes from a very old PC, the IBM AT. It was the first PC based on the
    80286 CPU, which we''ll talk more about in Chapter 4, "Understanding CPUs." For
    many years, AT was the most popular motherboard form factor.


    Size-wise, there are actually several AT motherboard subtypes. The original was
    12"×13". Eventually, as computers became smaller, a smaller version of the AT
    motherboard was introduced called Baby AT. It measured only 8.5"×13", or about
    the size of a sheet of legal paper. Later models of Baby AT motherboards were
    even smaller—8.5"× 9.5". Today, all AT motherboards are actually Baby AT boards;
    the full-size models are obsolete. Here''s one of the modern 8.5"×9.5" models:


    ![](bbox=[0.39, 0.55, 0.84, 0.87])'
  merge: -1
  pgno: 55
- img_proc: false
  md: '# A Closer Look at the Motherboard


    > **TIP**


    You can tell an AT motherboard at a glance because the expansion slots on it run
    parallel to the long edge of the board. (In the preceding figure, there is only
    a 1-inch difference between the lengths of the two sides, so you need to look
    close.) On an ATX motherboard (the second kind, which we''ll discuss in a moment),
    the expansion slots run parallel to the short edge.


    Notice where the CPU sits in relation to the expansion slots. It sits behind them.
    When the motherboard is mounted into a case, the expansion slots point toward
    the back, and the CPU points toward the front.


    An AT motherboard also has an AT style of keyboard connector, rather than the
    PS/2 style you saw in Chapter 2.


    ![](bbox=[0.05, 0.39, 0.89, 0.65])


    An AT motherboard has an AT style of connector for the power supply as well. It
    has 12 pins sticking up out of it.


    ![](bbox=[0.17, 0.78, 0.83, 0.95])'
  merge: -1
