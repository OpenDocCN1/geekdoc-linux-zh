  md: '# Recordable CD-ROM


    When you make your own CDs, you don''t have the manufacturing equipment to create
    the pitted aluminum layer that exists on a mass-produced CD. Therefore, the recording
    process must be different.


    The recording process for CD-R is made possible by the fact that CD-ROM readers
    don''t actually touch the surface of the disc—they only look at it. As you just
    learned, a CD-ROM drive bounces light off the surface of the CD, and it reads
    data depending on the amount of reflectivity it finds there. So a home-recorded
    CD need not actually have the pits and land areas of a normal CD, as long as it
    *appears* to have them.


    Recordable CDs are coated with metal and then overlaid with photosensitive organic
    dye. The dye layer reflects back to a CD-ROM drive just as a blank CD would (that
    is, all land). Then during the recording process, a laser heats the metal and
    the dye layers in certain spots so that they change their reflectivity to resemble
    a pit on an aluminum-pitted CD. When a drive reads the CD, the CD appears to have
    the normal pit and land areas of a commercially produced CD, even though there
    are not actually any pits.


    ![](bbox=[0.31, 0.48, 0.82, 0.62])


    A recordable CD-ROM drive can write once to a disk; then that disc cannot be written
    to any more. The laser on the read/write head has two power settings: one for
    reading (low) and one for writing (high).


    # Rewriteable CD-ROM


    The CD-RW medium is physically different from a CD-R disc. It is more complex
    and costs more to manufacture, which is why CD-RW discs cost so much more.


    Data is burned into a regular CD-R by heating the dye and metal to change how
    it reflects in certain spots on the disc. That change is permanent, which is why
    you can''t make changes to the data on a CD-R. A CD-RW disc, in contrast, does
    not have the traditional dye-and-metal coating. Instead it is coated with a metal
    alloy (containing silver, indium, antimony, and tellurium, in case you''re curious)'
  merge: -1
  pgno: 143
- img_proc: false
  md: '# Introduction to Disk Drives


    with reflective properties that change depending on the temperature to which you
    heat it.


    A CD-RW drive has a laser that has three different power settings. The high setting
    heats the alloy to around 600 degrees Celsius, at which temperature it liquefies.
    When it solidifies again, it has lost its reflective properties. This imitates
    a pit. The same spot can be reheated to a lower temperature (around 200 degrees
    Celsius), causing it to revert back to its original reflectivity, imitating a
    land area. That''s how it rewrites an area. The lowest power setting is used to
    read the data without changing it.'
