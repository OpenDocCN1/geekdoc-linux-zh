  md: '# # A First Look at the Inside


    When you remove the cover, you''ll find a complex system of circuit boards and
    cables inside. Don''t let this intimidate you. In the following sections, we''ll
    break down each area and see what it contains.


    ![](bbox=[0.28, 0.23, 0.93, 0.72])


    # ## Motherboard


    Let''s start with the large circuit board on the floor of the case—the motherboard.
    It''s called the motherboard because all other components plug into it, and so
    are "children" of it. Other names for it include main board, system board, and
    planar board.'
  merge: -1
  pgno: 43
- img_proc: false
  md: '# # A Look Inside a PC


    > **NOTE**


    AT and ATX are two **form factors** of motherboards. You''ll learn about them
    in Chapter 3. For now, just keep in mind that things are laid out a little differently
    on one versus the other. I''ll point out the differences as we go along.


    **Form factor**


    The size and shape of a device. Most commonly applied to motherboards, but it
    can also apply to other devices that come in a variety of sizes.


    It can be difficult to see the whole motherboard because of all the components
    installed on it, so here''s a picture of a bare motherboard removed from the case.
    (It''s a slightly different model from the one shown in the preceding figure.)


    ![](bbox=[0.02, 0.32, 0.75, 0.71])


    **Power supply connector**  A group of wires runs from the power supply to the
    motherboard. An ATX motherboard uses a single connector with holes (shown here).
    An AT model has two adjacent connectors with six pins each.


    **Built-in ports**  These are the same built-in ports that were peeking out of
    the back of the computer when you took the external tour. As you can see, they''re
    built directly into the side of the motherboard on this ATX model. On an AT motherboard,
    the ports are not physically built-in, but instead attach to the motherboard with
    cables. You''ll see the difference in Chapter 3.'
  merge: -1
