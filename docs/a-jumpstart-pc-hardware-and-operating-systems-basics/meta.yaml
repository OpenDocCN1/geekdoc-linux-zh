  md: '# # How a CPU Works


    CPU stands for Central Processing Unit, often shortened to just “processor” or
    “microprocessor.” The CPU’s sole job is to perform mathematical calculations.
    Data comes in, data gets processed, and data goes back out again. The CPU is sort
    of like Rain Man; it’s great at what it’s great at (math), but it’s limited. It
    doesn’t figure out what to do with that data; it just crunches the numbers, many
    millions of them per second. The PC relies on the operating system to be the sensible
    guy who figures out what needs to be calculated and why.


    +   **External data bus**

    The bus that transfers data from outside the CPU to inside and then back out again.


    **Register**

    A work area inside the CPU that holds a numeric value while the CPU performs a
    calculation upon it.


    **Low-order bits**

    The first four bits in a byte (reading from right to left), representing data
    to be processed.


    **High-order bits**

    The second four bits in a byte (reading from right to left), representing the
    instructions for processing the data.


    > NOTE

    The following sections contain more technical theory than you will need to work
    on PCs in real-life; I’m telling you all this stuff only because I think you might
    find it interesting and because some of it might come up on the A+ exam if you
    decide to take it.


    # # How Data Is Processed


    Data comes in and goes out of the CPU on the **external data bus**. It’s called
    external because it enables data that’s outside the CPU (external to it) to get
