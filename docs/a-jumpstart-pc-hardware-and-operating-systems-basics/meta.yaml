  md: '# # Introduction to Disk Drives


    Or, it may be occupied by multiple logical drives, like this:


    ![](bbox=[0.155, 0.125, 0.605, 0.243])


    The primary partition always contains only a single logical drive, however.


    FDISK does not allow more than one primary partition per physical drive, but if
    you partition using some other utility, such as Disk Management in Windows 2000,
    you can have multiple primary partitions per drive. The difference between a primary
    partition and an extended one is that a primary partition is bootable.


    Even though only a primary partition is bootable, you can still store an operating
    system on an extended partition''s logical drive, as long as the operating system
    on the primary partition is multi-boot capable. When the computer is starting
    up, the primary partition will be read first, and the primary partition will contain
    the instructions for displaying a menu from which you will select an operating
    system.


    Some people like having multiple logical drives because it gives them more storage
    flexibility; it also enables them to install multiple operating systems on a single
    PC, each on its own partition. Other people prefer to have a single large logical
    drive for each physical drive so they don''t have to worry about running out of
    room on one logical drive while another one has space to spare.


    # # Formatting


    Before it can be used, a disk must be formatted. (The exception is a CD-R disc,
    which gets formatted simultaneously as you write to it.) The operating system
    does the formatting, and thereby ensures that the formatted disk will be readable
    in that operating system. This used to be a much more critical issue back in the
    days when there were lots of different operating systems, but nowadays almost
    all PCs use Windows so a disk could theoretically be formatted using almost any
    PC and then used on another PC.


    On MS-DOS and Windows operating systems, formatting specifies that each sector
    will hold 512 bytes of data. In addition to the 512 data bytes per sector, some
    of each sector is occupied by header and trailer identifier information about
    that sector. You might hear about a drive having a different formatted and unformatted
    capacity, and that''s the reason. A 1.44MB floppy, for example, actually has a
    raw capacity of 2MB, but only 1.44MB of data can be stored.'
  merge: -1
