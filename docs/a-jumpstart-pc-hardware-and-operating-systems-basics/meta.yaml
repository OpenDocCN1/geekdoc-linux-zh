  md: '# # Glossary


    **flux transition** A spot where the flux changes directions.


    **FM synthesis** A method of computer simulating the sounds of various musical
    instruments. Results in artificial-sounding MIDI music.


    **Folder** An organizing container for holding computer files, residing on a disk.


    **font** Strictly defined, a particular typeface at a particular size. However,
    *font* has lately come to be synonymous with *typeface*.


    **form factor** The size and shape of a device. Most commonly applied to motherboards,
    but it can also apply to other devices that come in a variety of sizes.


    **formatting** Laying down guide tracks for the read/write heads on a disk in
    a drive.


    **FPM** Fast Page Mode. An older type of RAM in which the speed does not correspond
    to the system bus speed. Speeds are measured in nanoseconds.


    **FTP site** A server that provides FTP access for a hard disk that accepts uploading
    or downloading operations.


    **gateway** A network box that can translate and transfer data between two unlike
    network systems.


    **geometry** A drive''s organizational structure, including the number of cylinders,
    number of read/write heads, and number of sectors.


    **GPF** General Protection Fault. A type of program error that occurs when Windows
    protects itself against a program''s request to do something that would cause
    problems. Usually results in program termination.


    **Graphical User Interface (GUI)** An operating system that provides a picture-based
    interface with which the user interacts.


    **ground** To bleed off electrical charge to a safe location where it can dissipate,
    such as to the earth itself.


    **Hardware modem** A modem that contains everything it needs to operate within
    its own hardware, so it can work with any operating system.


    **Heat sink** A porcupine-like block that channels heat away from the CPU.


    **High memory** The first 64KB of RAM above the 1MB mark. Also called High Memory
    Area (HMA).


    **High-order bits** The second four bits in a byte (reading from right to left),
    representing the instructions for processing the data.


    **HIMEM.SYS** A memory management driver loaded at startup that allows programs
    to use extended memory under the XMS specification.


    **Hot-pluggable** Able to be connected and disconnected without shutting down
    the PC. Sometimes called *hot-swappable*.


    **HTML** Hypertext Markup Language. A text-based programming language used to
    create Web content.


    **I/O address** Input/Output addresses in memory where devices place data for
    pickup by the operating system, and where the operating system places data for
    pickup by the device.


    **IDE** Integrated Device Electronics. A type of drive connector provided on the
    motherboard for interfacing with hard drives and CD-ROM drives.


    **IDE** Integrated Drive Electronics. A drive with a built-in controller.


    **Illegal operation** A program error that occurs when an application asks Windows
    to do something that it cannot comply with. Usually results in program termination.


    **Internal speed** The maximum speed at which a particular CPU can operate.


    **Internet** A global network of interconnected computers that share data.'
