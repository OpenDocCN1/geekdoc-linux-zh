  md: 'Working with Devices in Windows


    # Resolving Resource Conflicts


    Plug and Play is not perfect, and sometimes it can''t find free resources to assign
    to a device. This is especially true when other non-Plug and Play devices are
    installed or when there are many ISA expansion cards.


    A device with a yellow-background exclamation point next to it in Device Manager
    may be having problems with resource assignments, as shown here:


    ![](bbox=[0.16, 0.25, 0.56, 0.52])


    To check out the device''s resources, double-click it and look on the General
    tab for a status message. For example, the message in the following figure says
    there is not enough of one of the resource types available.


    ![](bbox=[0.18, 0.615, 0.57, 0.875])'
  merge: -1
