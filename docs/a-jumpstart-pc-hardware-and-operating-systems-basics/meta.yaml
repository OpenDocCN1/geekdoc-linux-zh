  md: '# How Video Cards and Monitors Work


    # Video Cards


    The monitor itself doesn''t have any computing abilities, nor memory, nor any
    ability to communicate with the PC. All it does is turn little dots of light on
    and off. It''s basically just a glorified Lite-Brite. The video card is the brain
    of the operation. The next few sections look at the video card and its features
    and capabilities.


    # Video Card Memory


    Remember how we talked about memory addressing in a PC being stored in a big spreadsheet-like
    table? Well, the video card has its own memory and its own grid of memory addresses
    that keep track of what color each individual dot on the display should be at
    any given moment. This table is constantly updated by the operating system, and
    at the same time the table content is constantly sent to the monitor so it can
    update the image onscreen. The more video memory, the more data it can store.


    Most video cards sold today have at least 8MB of memory on them; some have up
    to 64MB. This memory is for the video card''s use only; the PC in general cannot
    access it. It''s a different kind of memory, too—both physically and in terms
    of how it works. The RAM on a video card is typically in a DIPP package (remember,
    that''s the one that''s a rectangular chip with legs on two sides; it looks like
    a centipede). The chip might have lettering that says how much RAM it represents,
    but more likely it will just have the manufacturer''s name on it.


    Some of the older video cards were memory-upgradeable, meaning there were expansion
    sockets for extra RAM on them. Most of today''s video cards don''t have this feature,
    however, so it''s important to choose a video card that comes with an ample amount
    of memory. "Ample" can mean different things depending on the applications you
    plan to run, as explained in this section.


    One way to determine the amount of video memory is to watch the screen as the
    PC starts up. For a brief second or two at the very beginning of the boot process,
    a message will appear on the screen reporting the video card manufacturer and
    model and the amount of video memory.


    If you miss that message, you can also utilize Windows to find out how much video
    memory you''ve got. To do so, right-click the Desktop and choose Properties. Then
    click the Settings tab, the Advanced button, and then the Adapter tab. On this
    tab you''ll find information about the video card, including the memory size.


    Video memory is important because it enables you to run higher resolution and
    color depth combinations. On some video cards, having more memory can also result
    in better video card performance, but we''ll get into that in the section ''What'
