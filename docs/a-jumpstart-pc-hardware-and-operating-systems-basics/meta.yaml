- img_proc: false
  md: '# Operating System Basics


    conventional memory for running programs. This 64KB area is known as **high memory**
    or the HMA (High Memory Area).


    Back then, some applications required the memory to be available in the EMS standard,
    while other applications required the XMS standard. A utility called **EMM386.EXE**,
    also loaded in **CONFIG.SYS**, enabled the OS to take charge of the extended memory
    so it could emulate whatever type of memory was needed—either EMS or XMS.


    On PCs with an 80386 chip or higher, **EMM386.EXE** also has a side benefit. Remember
    that as a side benefit **HIMEM.SYS** loads part of MS-DOS into high memory. **EMM386.EXE**
    (when used with the DOS=UMB command in **CONFIG.SYS**) takes any leftover portions
    of DOS that could not load into high memory and places them in upper memory, further
    freeing up conventional memory.


    Windows 95 (and higher) handles all memory management automatically, so you do
    not need to know any of what you just learned in 99 percent of real-life PC technician
    work today. So why did I go to the trouble of telling you? For two reasons. One
    is that a familiarity with all these terms will make the next sections of the
    chapter much easier to understand. Another is that memory management is still
    part of the A+ exam, and you need to know this stuff to pass.


    **XMS**

    Stands for eXtended Memory Specification. A standard for using extended memory
    in applications.


    **HIMEM.SYS**

    A memory management driver loaded at startup that allows programs to use extended
    memory under the XMS specification.


    **CONFIG.SYS**

    A file that lists the drivers that should automatically be loaded each time the
    PC starts.


    **High memory**

    The first 64KB of RAM above the 1MB mark. Also called High Memory Area (HMA).


    **EMM386.EXE**

    A memory management utility that allows the operating system to use extended memory
    to supply either EMS or XMS support to an application as needed.'
