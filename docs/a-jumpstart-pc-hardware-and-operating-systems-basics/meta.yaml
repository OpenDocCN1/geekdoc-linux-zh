    # Adding and Removing Windows Components


    When you do a default install of Windows, some accessory programs are installed
    too, such as Calculator, Notepad, and so on. A few of the less popular ones are
    not installed by default, however, so you might want to add them later. You can
    also remove any of the installed accessories that you don''t use, freeing up disk
    space.


    To check out the assortment of Windows components to be installed or removed:


    +   - In Windows 95, 98, or Me, double-click Add/Remove Programs in the Control
    Panel and then click the Windows Setup tab.

    - In Windows 2000 or XP, double-click Add/Remove Programs in the Control Panel
    and then click the Add/Remove Windows Components icon.


    From the window that appears, clear or mark the check boxes for the components–or
    entire categories of components–that you want to remove or add. Windows 9x has
    a huge array of programs to be added or removed, but Windows 2000 has only a few
    specialized tools there; all the mainstream end-user applications are non-removable
    in Windows 2000. Windows XP goes back to a more balanced list; there are both
    the end-user applications and the special tools and drivers.


    The Details button becomes available when a category containing multiple items
    is selected; you can click Details to see a list of the individual items in the
    selected category. Notice that some check boxes have a gray background; this indicates
    that some–but not all–of the items in that category are selected.'
