    **Jumper**

    A cap that fits over a pair of pins, changing the electrical flow through a circuit
    board.


    > **NOTE**

    On a motherboard that has built-in sound, video, or other capabilities, you''ll
    find chips for each of those built-in items on the motherboard. Don''t confuse
    these with the chipset for the motherboard itself.


    # # Jumpers


    Some motherboards can operate in different modes or with different options depending
    on what CPU, memory, or other components are installed. On such motherboards,
    you''ll find **jumpers**.


    A jumper is a little plastic/metal cap that fits down over two tiny metal pins.
    When the cap is over the pins, electricity can pass between those pins, “jumping”
    them. When the cap is not over the pins, electricity cannot pass. This change
    in the electrical flow through the circuit signals to the motherboard that a different
    setting is in effect.


    Here''s a bank of jumpers. Each set of pins (up/down) has a jumper cap that is
    either on (over both pins) or off (over only one of the pins). When the jumper
    is over only one pin, it''s functionally the same as if it were not there at all.


    ![](bbox=[0.24, 0.75, 0.52, 0.91])


    Other times there will be a set of more than two pins, and the jumper''s setting
    depends on which of the pins it covers. For example, in the following figure'
