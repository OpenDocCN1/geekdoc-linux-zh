  md: '# # A Few Other Essential Components


    # ## Loading Mouse Drivers


    Windows recognizes a mouse automatically (at least in a generic way), so you probably
    will not need to load a mouse driver in order to use Windows. If you have a mouse
    or trackball with special features (such as buttons on it that perform special
    tasks), however, you might need to install the software that came with it in order
    to enable them.


    In MS-DOS, you must load a **real-mode** mouse driver in order for the mouse to
    work in DOS-based programs. Most mice come with a driver disk containing the needed
    file. The mouse file usually comes in two versions: MOUSE.COM (which can be loaded
    from Autoexec.bat or just by typing **MOUSE** at a command prompt) and MOUSE.SYS
    (which must be loaded from Config.sys).


    You do not need to load a real-mode mouse driver when using a DOS-based program
    from within Windows because Windows takes care of it automatically. Therefore,
    you will probably never need to load a real-mode mouse driver (unless you spend
    time working with DOS-only PCs).


    > **Real mode**

    MS-DOS mode, in which only a single task can be performed at once. MS-DOS operates
    in Real mode; Windows does not.


    > **Double-click speed**

    The speed at which one click must follow another in order for the PC to perceive
    it as a double-click rather than two single clicks.


    # ## Adjusting Mouse Operation


    Windows'' Mouse controls in the Control Panel enable you to adjust several aspects
    of mouse operation, including the pointer movement, pointer appearance, **double-click
    speed**, and so on. I won''t get into all those here, but you might want to check
    them out on your own.


    Slowing down the double-click speed can be useful when training a novice to use
    a mouse. Beginners seem to have trouble double-clicking fast enough. They also
    tend to move the mouse between the clicks.


    # ## Mouse Troubleshooting


    Here are some ideas for troubleshooting mouse problems.


    # ### Windows Doesn''t See Mouse


    If Windows can''t detect a mouse at startup, a message appears to that effect.
    Check that a mouse is firmly plugged into the PC. Try that mouse with a different
    PC if there is any doubt as to its working order.


    ![](bbox=[0.8, 0.86, 0.88, 0.94])'
  merge: -1
