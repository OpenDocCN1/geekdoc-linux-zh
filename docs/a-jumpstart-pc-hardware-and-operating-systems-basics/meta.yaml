  merge: -1
  pgno: 374
- img_proc: false
  md: '# Appendix C


    **286 protected mode** An operating mode for an 80386 CPU that emulates an 80286
    CPU.


    **AUTOEXEC.BAT** A file that lists the programs that should automatically be run
    at startup.


    **386 protected mode** An operating mode for an 80386 CPU that takes advantage
    of the 80386''s advanced features, but is incompatible with programs written for
    earlier CPUs.


    **Back probing** Testing electricity while the device is on by sticking the multimeter
    probes down the back of the connector.


    **3D video acceleration** Memory buffers on a video card that give it better performance
    when displaying graphically intense programs that draw images with depth perspective.


    **Backplate** A plate at the back of an expansion slot to keep the dust out of
    the PC case when that slot is not being used. You remove the backplate before
    you install an expansion card in that slot. Can also refer to the metal plate
    attached to the expansion card itself that fits into the same spot that the blank
    backplate occupied.


    **Active matrix** A type of LCD monitor that uses a separate transistor for each
    pixel.


    **BNC** Stands for British Naval Connector. The type of connector used on coaxial
    cable (the kind used with cable TV). Some dictionaries show BNC as an abbreviation
    of different words, including Bayonet Neill-Concelman or Bayonet Nut Coupler.


    **Actuator** The arm on which the read/write head is mounted, which moves the
    head in and out on the disk surface.


    **Address bus** The portion of the system bus that transports data between the
    CPU and RAM. Also called *frontside bus*.


    **Boot sector** A reserved sector on the disk for commands that load an operating
    system when the PC starts up.


    **Amps** Short for amperes. A measurement of electrical current or rate of flow.


    **Broadband** A high-speed connection between computers.


    **Antivirus program** Software that monitors files for specific strings of characters
