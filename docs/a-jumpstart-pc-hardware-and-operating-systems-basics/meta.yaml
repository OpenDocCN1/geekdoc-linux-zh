  md: '# Drive Interfaces


    There are two popular interfaces for hard drives: IDE (pronounced *I-D-E*) and
    SCSI (pronounced *skuzzy*). Each has its own advantages and drawbacks, as you''ll
    see in the following sections.


    # IDE


    Integrated Drive Electronics (IDE) is the “normal” interface for hard drives,
    and by far the most common. Most motherboards have two built-in 40-pin IDE connectors:


    ![](bbox=[0.12, 0.32, 0.64, 0.47])


    Each of those connectors can support up to two drives (on the same ribbon cable),
    for a total of four. You can also add expansion cards that have additional IDE
    connectors on them.


    **IDE** is actually a generic term referring to any drive with a built-in controller.
    Back in the earliest days of hard drive technology, the hard drive and its controller
    were two separate pieces. With an IDE drive, however, the drive controller is
    part of the package. You have probably noticed that a hard drive has a little
    circuit board strapped to the bottom of a hard drive; that’s the integrated drive
    controller. When the controller goes bad, the drive is toast as well. IDE was
    a real revolution in PC technology when it first came out, because it meant that
    drive makers did not have to make their drives compatible with a particular controller
    standard, so they could develop higher-performance drive/controller combinations
    that spoke their own proprietary language between them.


    # AT Attachment (ATA)


    All IDE drives today (and for the last 10 years or more) are compatible with the
    AT Attachment (**ATA**) standard, and they are more or less compatible with one
    another. That means you can take an old hard drive and put it in a new system
    and the new system will be able to use it.


    **IDE**

    Integrated Drive Electronics. A drive with a built-in controller.


    **ATA**

    AT Attachment. A standard for IDE drives in PCs that makes it possible for PCs
    to share IDE devices without compatibility problems.'
  merge: -1
  pgno: 156
- img_proc: false
  md: '# Chapter 8


    > **WARNING**


    You can put a new hard drive in an old system, but you might not be able to use
    its full capacity due to BIOS and operating system limitations. Some older BIOSes
    don''t support drives of more than 8GB; if you have a drive bigger than that,
    you must get a BIOS update or be resigned to use a larger drive at the supported
    size. MS-DOS and Windows versions earlier than Windows 98 do not have large disk
    support. That means they don''t support the FAT32 file system (32-bit File Allocation
    Table), so the drive size is limited to 2GB per logical drive. You can have multiple
    logical drives on a single physical drive, however, so the space isn''t wasted
    (as with BIOS limitations); it''s just chopped up.


    **DMA**

    Direct Memory Access. A way of increasing data transfer rates by enabling the
    device to bypass the CPU and access memory directly.


    Several additions have been made to the ATA standard over the years. Each one
    adds some new features or a new way of increasing the drive''s speed. You don''t
    need to know the details of each of the additions; just know that they are numbered,
    ATA-1 through ATA-6 (the 2000 revision).


    > **NOTE**


    You may occasionally hear IDE referred to as EIDE. The extra E stands for "enhanced."
    EIDE originally meant any IDE device that supported ATA-2 or higher, but because
    all IDE devices nowadays do that, EIDE has come to be almost as generic a term
    as IDE itself.


    Starting with ATA-4, a new means of improving data transfer speed was introduced
    called **UltraDMA** (also called UltraATA). Originally it allowed for data transfer
    rates of up to 33MB/sec, but ATA-5 increased that to 66MB/sec, and ATA-6 further
    increased it to 100MB/sec.


    UltraDMA comes with a couple of "gotchas," however. One is that the 66MB/sec and
    100MB/sec versions require a special ribbon cable that has 80 wires instead of
    the usual 40. It still has only 40 pins/holes, though; the extra wires are spacers
    that help eliminate EMI between the wires so they can transfer data more reliably.
    The other issue is that when two drives share the same ribbon cable, they''re
    limited to the maximum transfer rate that they can both support. So, for example,
    a 33MB/sec drive and a 100MB/sec drive would both act like 33MB/sec drives when
    on the same cable.


    The motherboard and the drive must both be able to support a certain transfer
    rate to make UltraDMA speeds possible. An older motherboard may have been manufactured
    before some of the higher ATA standards were invented, so putting a brand-new,
    high-speed drive in such a system would be a waste.'
