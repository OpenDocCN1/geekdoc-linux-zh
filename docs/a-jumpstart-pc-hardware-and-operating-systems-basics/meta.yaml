  md: '# Setting Up Internet Connections


    # Internet Connection Sharing


    Windows 98 Second Edition, Windows Me, Windows 2000, and Windows XP all have a
    feature built in called Internet Connection Sharing (ICS) that allows a LAN-connected
    computer to share its Internet connection with other PCs on the LAN. This makes
    it possible for a family to have a single broadband Internet connection with multiple
    PCs able to access the Internet simultaneously. The PCs that will be using the
    shared connection do not necessarily have to have a particular Windows version,
    as long as they have at least Windows 95, because the wizard that sets up the
    feature can make a configuration floppy disk to take to each PC that enables it
    to access the shared connection.


    In a nutshell, here''s how it works. The main Internet-connected PC has a single
    IP address by which it is known on the Internet for the duration of its connection.
    That''s the "real" IP address. When another PC on the network wants to use that
    connection, the sharing PC assigns it a separate IP address using a set of private
    IP addresses for local use. Then whenever traffic comes in or out, the sharing
    PC shuttles the data off to the internal IP address for the requesting PC. This
    is known as **virtual private IP addressing**. It''s kind of like when a group
    of people are at a restaurant and one person orders for the entire table. Each
    person tells the orderer what he or she wants, and then the orderer speaks in
    a single voice to the waiter, conveying all the orders.


    Windows 98 Second Edition has a special wizard that sets this up; it is found
    on the Accessories menu. In Windows Me, its setup is built into the Internet Connection
    Wizard. In Windows XP, the setup is built into the New Connection Wizard. When
    you set up the connection, you are asked whether you want to share it or not.


    To turn the sharing feature off or on after the initial configuration, display
    the properties for the shared connection. In Windows 98 and Me, a Sharing button
    opens a dialog box where you can turn it on or off. In Windows XP, a check box
    for Internet Connection Sharing appears on the Advanced tab.


    Another way to share an Internet connection is with a router. If you have cable
    or DSL Internet service and a home network, you can hook the incoming cable or
    DSL line to a router and then hook up each PC in the network to that router. The
    router will then provide the internal IP address translation needed to share the
    connection. You don''t need any special version of Windows in order to do that,
    but you may find that the router costs as much as a Windows upgrade would cost.
    Some ISPs frown on this sharing, and they even explicitly forbid it in their member
    agreements and terminate your service if they find out you are doing it. Others
    don''t mind and will even help you set it up.


    Virtual private IP addressing

    Assigning internal IP addresses to PCs that are separate from their external IP
    addresses in order to share an external IP address among multiple PCs. Private
    IP addresses begin with 192.168 and range from 192.168.0.1 to 192.168.255.254.


