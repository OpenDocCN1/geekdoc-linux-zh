  md: '# Understanding CPUs


    **machine language.** Each CPU has its own machine language, although new generations
    of CPUs usually have machine languages that build upon the core set of commands
    from the previous CPUs.


    > **NOTE**


    Have you ever wondered why a given model of motherboard supports only certain
    CPUs? Machine language is the reason. The motherboard''s CPU socket, and the external
    data bus associated with it, must be able to send commands to the CPU using the
    correct machine language.


    # Data Processing Speed


    Data doesn''t just flow freely into and out of the CPU at any speed it wants;
    there''s a very orderly cadence to the process. That tempo is set by the **system
    crystal**, which is a timekeeping unit similar to what''s in a modern wristwatch
    (except it ticks much faster). Each tick of the system crystal is a **clock cycle**,
    and data movement occurs in rhythm with this ticking. The system bus operates
    at the same speed as the system crystal. On modern motherboards, such as the one
    shown here, 100MHz and 133MHz are common system crystal speeds.


    ![](bbox=[0.21, 0.54, 0.54, 0.71])


    Each CPU has a rated speed at which it can reliably operate, measured in megahertz
    (MHz). This speed represents the number of clock cycles per second that the CPU
    can handle. This is known as the CPU''s **internal speed**.


    It is the system crystal, however, not the CPU, that determines the speed at which
    the PC operates. A CPU will work reliably on a motherboard with a slower system
    crystal than its own top speed, but it will run at the crystal''s speed. (This
    is called underclocking.) If you operate a CPU with a crystal that pushes it faster
    than its own rated speed, that''s called **overclocking**. It can result in faster
    system performance, but it can also cause overheating and instability. The actual
    speed at which the CPU operates as directed by the system crystal is its **external
    speed**. Some motherboards have a jumper that sets the system crystal speed; others
    can detect the CPU installed and automatically adjust the system crystal speed.


    **Machine language**


    The set of codes that the CPU understands for accepting numbers and instructions
    for calculating them.


    **System crystal**


    A quartz oscillator on the motherboard that sets the pace for movement of data
    into and out of the CPU.


    **Clock cycle**


    One "beat" or "tick" of the system crystal''s oscillator.


    **Internal speed**


    The maximum speed at which a particular CPU can operate.


    **Overclocking**


    Operating a CPU at a higher clock speed than the speed for which it is rated.


    **External speed**


    The system crystal speed, which controls the CPU''s speed.'
