  md: '# # Introduction


    Welcome to my favorite hobby—personal computing! I love tinkering with computers
    so much that I''ve turned it into my full-time business. I find working with computer
    hardware really fascinating, and I hope that by the end of this book, I will have
    passed some of that enthusiasm along to you.


    Judging from the title, you can probably guess the primary purpose of this book:
    to help people prepare for CompTIA''s A+ exams. But unlike many other study guides,
    which assume you are already a working PC technician, this book starts at the
    very beginning. That makes it a great first book to pick up in your journey toward
    A+ certification.


    Many people who sign up for A+ certification classes end up dropping out because
    the material is over their heads. Most good A+ certification courses—the kind
    that really go into the needed depth on each topic—are not for beginners! They''re
    for people who are already working as PC technicians and want the certification
    to demonstrate the proficiency that they—for the most part—already possess. If
    you aren''t already experienced with PC terminology and procedures, this book
    can bring you up to the level of the other students in the class, so you won''t
    get lost or intimidated.


    # # Introducing CompTIA''s A+ Exams


    A+ certification is administered by a company called CompTIA. This same company
    also administers several other certifications, including Network+ and iNet+.


    To become A+ certified, you must pass two separate exams. You can take them both
    on the same day or spread them out, and you can pass them in any order. They are


    +   - **A+ Core Hardware Service Technician** This exam tests your knowledge of
    PC hardware—including theory, safety, terminology, assembly, and troubleshooting.

    - **A+ Operating System Technologies** This exam tests your knowledge of Microsoft
    Windows (NT 4, 2000, 95, and 98), including installation, startup, device interaction,
    file management, and troubleshooting.


    Most people find the hardware exam tougher because they have less day-to-day experience
    with it. People who enjoy computers tend to fiddle around with Windows quite a
    bit, so they already know a lot of what''s covered on the operating system exam.
    Fewer people take the time to fiddle around with hardware.'
  merge: -1
  pgno: 15
- img_proc: false
  md: '# Introduction


    In addition, the hardware exam requires that you know quite a lot of specifications
    about various hardware types, and that kind of information doesn''t normally come
    up in an average person''s experience. This book, therefore, spends about 2/3
    of its space on hardware. I have also included lots of pictures of various pieces
    of hardware, because not everybody reading this book will have access to a PC
    they can tear apart and examine.


    You take the exams on a computer, with multiple-choice questions appearing onscreen.
    The testing software is mouse-based, so you click the answer you think is right
    and then click Next to move on to the next question.


    Both exams are adaptive, which means they throw different questions at you based
    on your answers to previous ones. For example, if the testing software asks you
    a question about networking and you get it right, you probably won''t get any
    more networking questions. But if you get it wrong, you might get several more
    questions about networking. This makes it hard to avoid the areas that you''re
    weak in, and it forces you to study everything! The good part is that adaptive
    exams are usually shorter than nonadaptive ones. If you answer all the questions
    correctly, you could finish an exam in only 15 minutes or so.


    To register to take an exam, visit Prometric (www.2test.com) or NCS/VUE (www.vue.com/comptia).
    Each exam costs $132, but volume discounts for 50 or more vouchers are available
    for corporations. If you take an A+ certification class, it might include the
    vouchers as part of the course fee. Then you go to a testing center in your area
    and take the exam at a testing workstation.


    # Who Needs A+ Certification?


    A+ certification is useful for anyone who wants to work in the PC support industry.
    This could include people who do any of the following in their daily jobs (or
    want to):


    +   - Fix broken computers

    - Build new PCs from scratch

    - Troubleshoot Windows problems

    - Set up new PCs

    - Install hardware upgrades

    - Advise users about hardware and software purchases

    - Train people to use Windows and applications


    A+ certification is not meant to be a "master" level designation; it is supposed
    to measure the amount of competency gained by having six months of experience.
    At this time, there is no higher-level certification program for PC technicians.'
