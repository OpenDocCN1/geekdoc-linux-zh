  md: '# Monitor Driver


    The monitor has a driver file in Windows too, but it''s not the same as a video
    card driver. It''s only an information file that tells Windows about the monitor''s
    capabilities. Windows uses that information to set limits on the video card''s
    behavior so that it will not push the monitor to do something that it can''t do.


    Windows doesn''t do perfect Plug and Play on monitors, so your monitor may be
    identified as a Plug and Play monitor by default. That''s a generic set of settings.
    If your monitor is capable of more than those settings specified, your monitor''s
    true capabilities are wasted until you install the driver for your exact monitor
    model. For example, your monitor might be capable of a higher refresh rate than
    the maximum setting specified for the generic Plug and Play monitor.


    To check the monitor driver installed in Windows, and change it if need be, do
    the following:


    +   1. Right-click the Desktop, and choose Properties.

    2. Click the Settings tab, and then check to see what monitor is reported under
    the Display heading.

    3. If the monitor that appears in the display is correct, you''re done; click
    OK. Otherwise, click Advanced.

    4. Click the Monitor tab, and then click Properties.

    5. Click the Driver tab, and then click Update Driver.

    6. The Hardware Update Wizard runs; choose Install from a list or specific location
    and then click Next.

    7. Click Don''t Search, and then click Next.

    8. Deselect the Show Compatible Hardware checkbox. A list appears of monitor manufacturers
    and models. Select yours from the list.


    ![](bbox=[0.45, 0.7, 0.78, 0.9])


    +   9. Click Next, and then click Finish. Then close all open dialog boxes.'
