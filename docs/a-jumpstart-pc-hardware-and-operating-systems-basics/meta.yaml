  md: '# Chapter 1


    # Preventing the PC from Hurting You


    # Cathode Ray Tube (CRT)


    Let''s start with this topic because your safety as a human being comes before
    the safety of the equipment–or at least it should!


    The technology behind the box-type display monitors sold today. It consists of
    a vacuum tube that sends electron rays to charge photosensitive phosphors on the
    monitor screen. The phosphors light up, creating the display picture.


    # Electricity Precautions


    Most of us take electrical precautions in daily life as a matter of course. Things
    such as not operating electrical items near water and not sticking your finger
    in a wall outlet are no doubt everyday life skills for you, since you have survived
    to reach adulthood. All those common sense warnings about electricity apply when
    you''re working on PCs as well.


    The biggest danger comes not from the PC itself, but from the monitor. The traditional
    type of PC monitor (known as a **CRT**) contains a large capacitor in the back
    that can store up to 30,000 volts–more than enough to kill a person. Further,
    it maintains its charge even after the monitor has been unplugged from the wall
    outlet for many months. Because of this, you should not attempt to work on your
    own monitor, nor should you remove the monitor''s cover. If you ever do remove
    the cover, don''t touch the thing that looks like a suction cup; that''s the high-voltage
    anode.


    Inside the PC itself, nothing has enough voltage to kill, but the power supply
    can deliver a nasty 110-volt shock if you tamper with it. The power supply is
    the metal box inside the PC with a tangle of colored wires emerging from it. This
    metal box is sealed, but it has some screws that enable you to disassemble it.
    Don''t.


    When working on a PC, you should always unplug it first. This is as much to protect
    the PC itself as to protect you. No matter what the reason, it''s a good practice.


    ![](bbox=[0.27, 0.76, 0.34, 0.83])


    > **NOTE**


    Some people leave the PC plugged in so its power cord will act as a grounding
    wire to avoid electrostatic discharge (ESD) damage; but as you''ll learn later
    in the chapter, there are better ways of preventing ESD that don''t involve leaving
    the PC plugged in.


    As another precaution when you''re working on PCs, try to work with one hand at
    a time, rather than both hands at once. That way electricity is not as likely
    to'
  merge: -1
  pgno: 21
- img_proc: false
  md: '# Safety and Preventive Maintenance


    travel through your body to complete a circuit. Finally, try to have someone else
    around when you’re working on anything electrical. That way, someone will be there
    to call for the ambulance if you hurt yourself.


    Don’t let all this scare you off! Working on PCs is not particularly dangerous,
    and your chances of getting an electrical shock are actually quite remote if you
    just use ordinary care.


    # Proper Working Attire


    As a PC technician, you will probably spend some time crawling around underneath
    desks hooking up cables, so dress comfortably in clothes that allow you to bend.
    As is the case with appliance repairpersons, everyone will appreciate it if you
    wear a belt and avoid low-riding pants.


    Avoid jewelry made out of conductive materials, and avoid any jewelry that might
    get caught on something. That means no dangling earrings, no necklaces, no bracelets,
    and no watches.


    # Safe Hazardous Materials Disposal


    PCs can not only hurt you directly, but they can also hurt your environment. Several
    parts inside a PC require special disposal procedures:


    **Batteries** A motherboard has a very small battery; a notebook PC has a big
    one. These batteries can contain lead, lithium, nickel-cadmium, and/or mercury—all
    of which can seep into groundwater in a landfill.


    **Toner cartridges** These cartridges from laser printers can contain traces of
    leftover toner, which can cause lung problems if breathed. Depending on the model,
    you might be able to sell your old cartridges to a company that remanufactures
    them.


    **Monitors** These big plastic shells take up a lot of space in a landfill, and
    they also contain phosphorous, mercury, and lead coatings on the back side of
    the monitor glass.


    **Circuit boards** These contain small amounts of lead in the soldering.


    **Cleaning chemicals** Some cleaning solvents used for PCs can pollute groundwater
    and soil.


    If your community has a hazardous waste disposal facility, take the above materials
    there. Check the Environmental Protection Agency (EPA) website at www.epa.gov
    if you do not know where to go.


    ![](bbox=[0.82, 0.89, 0.9, 0.97])'
  merge: -1
