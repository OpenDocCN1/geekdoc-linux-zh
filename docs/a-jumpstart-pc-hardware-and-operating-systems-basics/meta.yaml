  md: '# Chapter 14


    **Windows virtual machines** Windows 95 greatly improves on the virtual machine
    (VM) concept. Windows 3.1 segmented each running program in a separate VM, but
    Windows 95 runs multiple Windows programs in a single VM, so they can exchange
    data more easily.


    **Object Linking and Embedding (OLE)** Windows 95 greatly improved on the Clipboard
    in Windows 3.1 by adding **OLE** support. Not only can you move and copy data,
    but you can create dynamic links between them so that when data changes in one,
    it also changes in another.


    **Registry** Rather than storing settings in SYSTEM.INI and WIN.INI, Windows 95
    stores all settings in a central location called the **Registry**. The Registry
    actually consists of two separate files: USER.DAT and SYSTEM.DAT. However, they
    are accessed as a single unit using the Registry Editor (REGEDIT.EXE).


    Windows 98 is nearly the same as Windows 95 in all the important system-level
    ways. It offers a few improvements, such as support for the FAT32 file system,
    for USB devices, and for power management.


    Windows Me (Millennium Edition) is a minor update to Windows 98. It offers some
    new utilities and home/small business user features, and it provides wizards that
    make it easier to perform some complex tasks like setting up a home network. It
    is not covered on the A+ examinations.


    # Windows NT and 2000


    Windows NT is a whole different class of operating system, predating Windows 95.
    NT stands for New Technology. It was designed for business use, especially for
    servers and other mission-critical network PCs. Windows NT did not promise universal
    backward compatibility; instead it offered a true 32-bit environment, enhanced
    stability, and solid networking features.


    The significant versions of Windows NT were 3.51, which resembled Windows 3.1
    in its interface, and NT 4, which resembled Windows 95. We won''t get into Windows
    NT 3.51 here, as it''s just too old and hardly anybody uses it anymore.


    Windows NT 4 was similar to Windows 95 in appearance, and in many facets of its
    operation. For example, it used 32-bit code, a Registry, preemptive multitasking,
    and OLE.


    Some of the benefits of Windows NT include:


    **Server version** Windows NT came in two versions: Workstation and Server. It
    was the first Microsoft operating system to offer two separate versions,


    OLE

    Object Linking and Embedding. A standard for sharing information between applications
    that allows data to maintain a link with its data file and/or application of origin.


    Registry

    A configuration file that specifies how Windows 95 and higher will look and act
    in relation to users, applications, and hardware.'
