  md: '# Chapter 4


    “But wait a minute,” you are probably thinking. “Today’s PCs run a lot faster
    than 133MHz. How do they do that?” The secret is that they use a clock multiplier.


    On 386 computers and earlier, the internal and external speeds were the same,
    but on later PCs a technology was developed that made it possible for the CPU
    to execute two or more instructions per clock tick. This is known as clock doubling
    (or tripling, or quadrupling, etc.), and the multiplier by which the internal
    speed exceeded the external speed is the **clock multiplier**. The clock multiplier
    need not be a whole number. For example, a 1.6GHz CPU mounted on a motherboard
    with a 133MHz external speed would use a multiplier of 12.5.


    **Clock multiplier**

    The number of times by which the internal speed exceeds the internal speed.


    **Address bus**

    The portion of the system bus that transports data between the CPU and RAM. Also
    called *frontside bus*.


    # Interaction with RAM


    Because the storage space inside the CPU is very limited, the CPU relies extensively
    on RAM for holding data close at hand until the CPU is ready to process it. RAM
    is a waypoint for almost all information that enters and exits the CPU, so the
    pathway between those two objects is critical. The subsection of the system bus
    that directly connects the CPU and the RAM is called the **address bus**.


    Besides the main RAM that you can physically see and install on a motherboard
    (see Chapter 3, “A Closer Look at the Motherboard”), there are additional pockets,
    or caches, of memory into which a CPU can stash data temporarily. Chapter 5, “Understanding
    Memory,” talks about the various types of RAM and how they store data, and you’ll
    learn about these extra memory caches later in this chapter when we talk about
    the differences between various types of CPUs.


