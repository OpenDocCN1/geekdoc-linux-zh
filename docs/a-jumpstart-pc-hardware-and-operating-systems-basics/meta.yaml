  md: '# Appendix C


    **Virtual private IP addressing** Assigning internal IP addresses to PCs that
    are separate from their external IP addresses in order to share an external IP
    address among multiple PCs. Private IP addresses begin with 92.168 and range from
    92.168.0.1 to 192.168.255.254.


    **Virus** A program designed to spread itself from one PC to another and (usually)
    to cause damage to the PCs or annoyance to the user.


    **Virus definitions** A data file containing the text strings that the antivirus
    program searches for to determine whether virus infection exists.


    **Voice** A channel in the sound card that plays a single note by a single instrument.
    A typical sound card might have 64 voices, so 64 different sounds could be played
    at once.


    **Volts** The measurement of the strength of a positive or negative electrical
    charge.


    **Volume label** An internal identifier for a formatted disk. It appears under
    the drive icon in My Computer in Windows and at the top of a file listing from
    a command prompt. It has no relationship to any physical label on the outside
    of the disk.


    **Wattage** The amount of electricity a device uses, determined by multiplying
    volts by amps.


    **Wave table synthesis** A method of storing waveform clips of various musical
    instruments in the sound card''s memory and then playing them back when playing
    MIDI music. Results in much more natural sounding MIDI music.


    **Waveform** A sound that originates in the real world, rather than being originated
    by a computer.


    **Web browser** A program that displays web pages.


    **Web hosting company** A company that charges people money to store their websites
    and keep them available at all times to other clients.


    **Web page** A text document with embedded HTML codes that make it appear to be
    formatted and/or to contain pictures and other elements when viewed with a web
    browser.


    **Wide Area Network** A network in which resources are separated physically from
    one another (not in the same building).


    **Wildcard** A character that represents any value. Two standard wildcards are
    * for any number of characters and ? for a single character.


    **Windows Clipboard** A tool for copying and moving data between Windows applications.


    **Windows components** Programs, utilities, and add-ons that come with Windows
    itself rather than being purchased separately.


    **World Wide Web** A network of web pages available for public display on the
    Internet.


    **Write-protect** To make a disk read-only so that nothing can be changed, added,
    or deleted on it.


    **XMS** Stands for eXtended Memory Specification. A standard for using extended
    memory in applications.


    **ZIF** Zero insertion force. A type of socket into which you can insert a chip
    without applying any pressure to it. ZIF sockets are advantageous when you''re
    working with a chip that has many "legs" or pins because it reduces the chance
    of bending one of them.'
