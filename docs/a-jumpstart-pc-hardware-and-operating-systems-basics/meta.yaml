  md: '# # What Makes One Video Card Better than Another?


    If you shop around for video cards, you’ll quickly see that some cards cost under
    $50, and others cost over $500. Why? Here are a few of the reasons.


    # ## Memory Type


    As pointed out in the preceding section, different video cards have different
    amounts of memory on them. Not only is the amount of memory important, but also
    the type of memory.


    There have been various types of video RAM over the years, with different prices,
    speeds, and capabilities. Some of these types have been unique to video cards;
    others have simply been different packaging of the same kind of memory found on
    SIMMs and DIMMs. Originally video cards used FPM DRAM, which you may remember
    from Chapter 5, “Understanding Memory.” It was rather slow, but it was cheap.
    The alternative at that time was to pay big bucks for a video card with Video
    RAM (VRAM), which was fast but expensive. A variant of it called Window RAM (WRAM)
    also came and went; it was also fast and expensive. When Extended Data Out (EDO)
    RAM was popular in PCs, it also began to be used on video cards. You may still
    find it used on low-end video cards today. It’s cheap, but it’s not particularly
    fast.


    Most video cards today use SDRAM or DDR SDRAM, which is the same stuff that the
    PCs themselves use (although of course it’s in a different physical package, to
    fit on the video card). Remember from Chapter 5 that the “S” stands for synchronous;
    it means the RAM is synchronized with the bus. In this case, however, it’s the
    bus on the video card. DDR SDRAM is double data rate, so it performs two operations
    per clock cycle and is twice as fast as regular SDRAM; not surprisingly, it’s
    also more expensive.


    # ## 3D Acceleration


    As you learned in the “Video Card Memory” section earlier in the chapter, some
    video cards support 3D acceleration. This basically means that they use part of
    their RAM for multiple buffers that store data for quicker graphics handling in
    programs that have 3D graphics.


    To understand 3D animation in terms of the video card, think about an animated
    cartoon. In the old days, each frame of the cartoon had to be drawn and colored
    by hand, so animation was very labor intensive. Computers have greatly simplified
    the process in several ways. One is that animators can create each individual


    ![](bbox=[0.09, 0.87, 0.2, 0.97])'
  merge: -1
  pgno: 121
- img_proc: false
  md: '# How Video Cards and Monitors Work


    frame on a computer, but the other is that the computer itself can actually create
    some of the frames automatically with the use of **keyframes**. Let''s say you
    want to animate an object moving from point A to point B. With computer animation,
    you could create a still image of the object at point A and another one at point
    B, and the computer could fill in all the other frames between them.


    Many computer programs that contain lots of animation employ keyframes for their
    animation, so that the computer program doesn''t have to send such a staggering
    amount of data to the video card through its relatively slow connection. Instead,
    the program sends only selected keyframes to the video card, and the video card
    uses its extra memory and processing capabilities to generate all the other frames
    needed for the animation. It''s more complicated than that, because the moving
    object also needs to have shading, texture, smoothed edges, and so on, but this
    example gives you the basic idea.


    > **Keyframes**

    A set of still images that represent the start, middle, and end points of an animation;
    the computer can then generate the additional frames between the points.


    Video cards that are better at helping programs generate 3D animation are more
    expensive than those that are not so good at it, or that don''t have that capability
    at all. When you install certain 3D games, the setup program might allow you to
    choose between low-, medium-, or high-definition graphics; if you have a high-end
    video card, the high-definition graphics will be no problem. However, on a cheaper
    video card, the high-definition setting might cause the game to play with sputtering
    and jerking, and you might need to resort to a lower-quality setting.


    > **API**

    Application Programming Interface. A set of standards that programmers can use
    to access the features of a piece of hardware in their programs.


    The programmers who write these 3D games use **application programming interfaces
    (APIs)** to create the lines of code that tell the video card what to do. This
    makes it possible for a program to work with many different video cards, rather
    than being written specifically for one model. The most popular APIs are OpenGL,
    3Dfx Glide, Direct 3D, and DirectX. When installing certain applications, a question
    may appear asking which API you want to use. If in doubt, check the documentation
    for your video card to find out which ones it supports.


    # Bus Type


    As you learned in Chapter 3, "A Closer Look at the Motherboard," different buses
    have different speeds and widths. The bus that the video card uses to attach to
    the motherboard makes a big difference in how quickly data can transfer between
    them. By using a card that plugs into a high-speed bus slot such as an AGP slot
    rather than a low-speed one like an ISA, you can dramatically improve the speed
    at which complex images are drawn onscreen.


    The first video cards used the ISA interface, which is limited to 16-bit, 8MHz
    data transfer. When local bus interfaces became available, video card manufacturers
    immediately began taking advantage of them. Many 486 PCs used VLB video


    ![](bbox=[0.83, 0.89, 0.94, 0.99])'
