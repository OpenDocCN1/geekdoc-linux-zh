  md: 'Understanding CPUs


    # A History of CPU Features


    Now that you know about the shapes and sizes of CPUs, let''s look at the evolution
    of the features.


    # 8086/8088 CPUs


    One of the first viable CPUs developed for a personal computer was the Intel 8086.
    It used the DIPP packaging you saw earlier in the chapter. The problem with the
    8086 was that it was ahead of its time. It was a 16-bit processor that ran on
    a 16-bit motherboard, but 16-bit motherboards did not exist at that time—only
    8-bit did. Therefore, the 8086 was never widely used.


    So what does a company do when they have a great product that nobody wants to
    buy? They dumb it down. And that''s exactly what Intel did. They came out with
    an 8-bit version called the 8088. IBM chose it for use in the original IBM PC,
    the first widely used personal computer. The 8088 had two 16-bit registers and
    one 20-bit register, and it used a 20-bit address bus. It came in speeds ranging
    from 4.77MHz to 10MHz.


    > **Protected mode**

    A mode of operation for an 80286 CPU that enables it to take advantage of advanced
    features not available in the 8088 CPU.


    > **Real mode**

    A mode of operation for an 80286 CPU that makes it compatible with applications
    written for the 8088 CPU.


    # 80286 CPUs


    The next generation of CPUs was the 80286, or 286 for short. This chip was used
    in the IBM AT (Advanced Technology) personal computer. It had a 16-bit register,
    16-bit external data bus, and 24-bit address bus. (By that point, 16-bit motherboards
    were available.) Clock speeds ranged from 8MHz to 20MHz.


    Here''s where all the hassles with backward-compatibility began, troubles that
    are still plaguing the industry today. The 286 had some advanced features that
    made it much better than the 8088; but in order to use them, the computer had
    to be switched to **protected mode**, which was incompatible with all the programs
    written for the 8088. Therefore, 286 computers also could function in **real mode**,
    which provided backward-compatibility. In real mode, the 286 functioned essentially
    as a high-powered 8088.


    The 8088 could use only 1MB of RAM, but in protected mode the 286 could use up
    to 16MB, provided you were using an operating system that could support that much
    memory. (MS-DOS couldn''t. Some versions of UNIX could, as could the early IBM
    OS/2 operating system.) Protected mode also offered the ability to switch back
    and forth between two or more running programs simultaneously'
