  md: '# Essential Windows Tools and Skills


    ![](bbox=[0.13, 0.08, 0.6, 0.31])


    You can also boot to a command prompt rather than to the Windows GUI interface
    at startup, as you learned in Chapter 15, "Starting Up a PC."


    # Navigating Between Locations at a Command Prompt


    When working with a command prompt, folders are known as **directories**. Only
    one directory is active at once; it''s known as the **current directory**. The
    current directory''s name appears in the command prompt. For example, a prompt
    like this:


    ```

    C:\Windows>

    ```


    means that the Windows directory on the C: drive is current. Whatever commands
    you issue apply to the current directory unless you specify otherwise. For example,
    if you type this command (the part in bold below):


    ```

    C:\Windows>**COPY *.* A:**

    ```


    it will copy all the files from the current directory to the A: drive. The asterisk
    (*) represents "all", so *.* means "all files, all extensions." It''s the same
    as selecting the entire contents of a folder in Windows Explorer.


    > **TIP**

    The asterisk (*) is called a **wildcard** because it can stand for anything. An
    asterisk stands for any number of characters. A question mark (?) is used as a
    wildcard to represent a single character.


    **Directory**

    Same thing as a folder. The term Directory is often used rather than folder when
    referring to work at a command prompt.


    **Current directory**

    The directory (folder) specified in the command prompt, to which any commands
    will apply that are not specifically directed at some other location.


    **Wildcard**

    A character that represents any value. Two standard wildcards are * for any number
    of characters and ? for a single character.'
