  md: 'pathway to the CPU, called an expansion bus. In Chapter 3, which covers motherboards,
    we''ll look at the various types of expansion slots in great detail, including
    their specifications and advantages/disadvantages.


    # ## Power Supply


    The power supply is essential because the motherboard cannot use 110-volt AC electricity.
    It requires a much lower voltage (around 3v to 12v), and it requires direct current
    (DC). The power supply takes in the electricity from the wall outlet, converts
    it, and sends the appropriate voltages to each device attached to it. Each different
    colored wire supplies a different voltage or performs a unique monitoring or management
    task. For example, all the red wires supply +5v current, and all the black wires
    are for grounding purposes. Other voltages supplied include +12v, −12v, −5v, and
    +3.3v.


    The power supply mounts inside the back wall of the PC case, so that its fan and
    plug stick out the back. Inside, a tangle of colored wires emerges from the power
    supply, leading to various types of connectors. In Chapter 11, "A Few Other Essential
    Components," you''ll learn about the types of power supplies, the types of connectors,
    and the voltages they supply. The following figure shows a power supply removed
    from the case, but in real life you will probably buy the case and power supply
    as a set, with the power supply already installed.


    ![](bbox=[0.335, 0.556, 0.869, 0.886])'
