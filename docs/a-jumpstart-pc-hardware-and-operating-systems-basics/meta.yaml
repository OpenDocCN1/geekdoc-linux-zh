  md: 'VMM386.VXD. You know that this is the virtual memory manager, so you know there
    is likely a problem with the virtual memory paging file. Without knowing what
    VMM386.VXD is, you would have no idea where to start.


    # The Windows 2000 Boot Process


    Windows 9x is based on MS-DOS, so all of the boot processes start out the same
    way and involve the same files: IO.SYS and MSDOS.SYS. Windows 2000 is a totally
    different animal. It''s based on Windows NT, not MS-DOS, so it involves different
    files and processes.


    Here''s the Windows 2000 boot process.


    +   1. The BIOS performs a POST.

    2. The BIOS searches the drives for the MBR.

    3. The MBR takes control and locates NTLDR (which stands for NT Loader). NTLDR
    is the Windows 2000 equivalent of IO.SYS.

    4. NTLDR switches the CPU into 32-bit Protected mode.

    5. NTLDR finds and reads BOOT.INI, the file that controls the menu for dual-booting.
    If there are multiple operating systems, it displays a menu for user choice. If
    the user chooses Windows 2000, or if there are no other operating systems, it
    continues the Windows 2000 boot process. Otherwise, the other chosen OS takes
    over.

    6. NTLDR runs NTDETECT.COM, which detects the installed hardware and sends the
    information to the Registry.

    7. NTLDR reads NTOSKRNL.EXE into memory. This is the equivalent of the DOS kernel
    loaded in MS-DOS by MSDOS.SYS.

    8. NTLDR locates the drivers for the hardware that the Registry reports is installed
    (but does not install them yet).

    9. NTLDR hands over control to NTOSKRNL.EXE.

    10. NTOSKRNL.EXE loads the device drivers and the GUI.


    # How Dual Booting Works


    You can buy add-on programs that enable PCs to dual-boot among multiple operating
    systems. If one of your operating systems is Windows 2000 or XP, however, all
    the needed software is built-in. As discussed in Chapter 14, install the other
    OS first and then Windows 2000 or XP (on a different partition). The Setup program
    creates the BOOT.INI file and configures it for your installed OSes.'
