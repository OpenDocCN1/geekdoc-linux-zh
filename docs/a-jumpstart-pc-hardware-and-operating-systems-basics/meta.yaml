    # Working with Files at a Command Prompt


    If you are accustomed to working with files in Windows using Windows Explorer
    or My Computer, you''ll find the command-prompt method of managing files slow
    and awkward. It''s much better to do your file management from within Windows
    whenever possible.


    However, sometimes you might not have a choice. Therefore, you should have a good
    grasp of the commands necessary for manipulating files at a command prompt.


    Let''s start with the most basic command: DIR. It''s short for Directory, and
    it lists the contents of the current directory. So, for example, this command:


    ```

    C:\Windows>DIR

    ```'
