  md: '# Chapter 13


    the type of error checking method; a data compression method, if any; how the
    sending device indicates that it has finished sending a message; and how the receiving
    device indicates that it has received a message.


    When you install a network card in Windows, you also install one or more protocols
    to work with it. The most common protocol in Windows-based networking is **TCP/IP**.
    It''s also the dominant protocol on the Internet. However, there are many other
    protocols as well. For example, IPX/SPX is the standard protocol on Novell networks.
    NetBEUI is an older, very efficient protocol (that is, small packet size due to
    smaller headers and trailers) that works well on small networks but is not suitable
    for large-scale network use.


    When you work with the Internet, you encounter other protocols. These are still
    protocols in the sense that they are languages for exchanging data over a network,
    but they do not work directly with your network hardware and do not require drivers
    to be installed for them. They include FTP, HTTP, PPP, POP, IMAP, and SMTP. For
    more information about them see Chapter 19, "Setting Up Internet Connections."


    > **TCP/IP**

    Stands for Transmission Control Protocol/Internet Protocol. A communications protocol
    used on the Internet and in many LANs.'
  merge: -1
