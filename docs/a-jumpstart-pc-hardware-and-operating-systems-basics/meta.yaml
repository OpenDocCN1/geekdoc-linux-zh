  md: '# Chapter 10


    # Selecting and Configuring a Modem


    **Modem**

    A device that converts digital data to analog sound and vice-versa so data can
    be transferred between computers via telephone line.


    **Modem** is short for *modulator-demodulator*; it converts digital data to analog
    sound and then back again so digital data can be transmitted over analog telephone
    lines. Even though **broadband** Internet access is becoming more common with
    cable, DSL, and satellite service, the modem is still the tool of choice for most
    people for connecting to the Internet.


    PC technicians need to know a lot about modems because modems are responsible
    for more than their fair share of problems with PCs. Some models can be quirky
    to install and have lots of confusing settings to adjust, and almost all modems
    are very susceptible to power spike and lightning strike damage. The following
    sections provide some essential information about modems for the would-be PC technician.


    **Broadband**

    A high-speed connection between computers.


    > **TIP**

    When you''re troubleshooting modem problems, the problem is not always the modem
    itself; sometimes it is the Internet connectivity. A user might think that the
    problem is the modem, but it might actually be Windows'' dial-up networking. Chapter
    19, "Setting Up Internet Connections," covers dial-up networking connections.


    ![](bbox=[0.28, 0.44, 0.36, 0.51])


    # Types and Features


    Modems come in both internal and external models. An external modem is a separate
    box with its own power cord; it connects to the PC via a built-in COM port. An
    internal modem is an expansion board that fits into a motherboard slot.


    An external modem is best if any of these conditions apply:


    +   - The person who will be installing it does not feel comfortable working inside
    the PC case.

    - It''s a very old PC (pre-Pentium).

    - There are no open PCI slots.

    - The PC is running MS-DOS and Windows 3.x.


    Otherwise, an internal modem would be better. External modems are more expensive,
    they take up desk space, and they consume more electricity. They


