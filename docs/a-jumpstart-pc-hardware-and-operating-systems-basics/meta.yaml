  md: '# Chapter 19


    # Non-Dial-Up Connections


    Most non-dial-up connections come with their own setup software. Your cable, DSL,
    or satellite service provider will probably give you a CD-ROM or specific instructions
    for setting up the connection.


    Cable and DSL connections aren''t usually fussy about settings—they simply work,
    right out of the box in most cases. When I had cable access for a while, for example,
    it connected to a network card in my PC, and my PC saw the Internet connection
    as a network connection in My Network Places.


    To test the settings for a non-dial-up connection, try viewing a web page. If
    it appears, the connection is working. If it doesn''t work, try rerunning the
    Internet Setup Wizard (or New Connection Wizard, depending on the Windows version).
    To do this, you can select it from one of the Accessories submenus off the Start
    menu (the exact location depends on Windows version) or by opening the Internet
    Properties from the Control Panel and clicking the Setup button on the Connections
    tab. The wizard asks how you connect to the Internet; specify that you have a
    network connection.


    ![](bbox=[0.395, 0.49, 0.855, 0.735])


    Satellite access is a little trickier and quirkier. To set it up, you must run
    the software that comes with the hardware and follow the instructions to the letter.
    I currently have two-way satellite Internet service on my PC, and it consists
    of two external modem-like boxes that connect to my PC via USB. They are each
    connected to a coaxial cable that leads to my satellite dish. To establish the
    connection initially, I had to go through a long and involved software setup process
    that involved using a dial-up modem to download some files.'
