    > **Video driver**

    A file that translates instructions from the operating system into commands that
    the video card understands.


    # Video Driver


    As I mentioned way back in Chapter 2, "A Look Inside a PC," various pieces of
    hardware in a PC speak different languages. The motherboard speaks machine language;
    the printer speaks printer language; the modem speaks modem language; and so on.
    Driver files within the operating system (Windows, for example) translate commands
    into the languages needed to give instructions to the devices.


    The operating system uses a **video driver** to communicate with the video card,
    and then the video card communicates with the monitor. That''s how the operating
    system controls what should appear on the screen. That''s important because it
    means you can radically change the video performance of your PC by using a different
    video driver.


    The video card works best when you use a driver for it that was specifically designed
    for that video card model and for the version of Windows that you have installed.
    Other drivers might work after a fashion, but you''ll lose out in features, options,
    and/or performance quality. We''ll talk more about drivers in Chapter 10, "A Look
