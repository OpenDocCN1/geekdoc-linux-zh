  md: '# Chapter 19


    # Understanding Internet Protocols


    There''s a veritable alphabet soup associated with Internet connectivity, but
    you don''t have to memorize all of the acronyms and **protocols** to set up an
    Internet connection—thankfully! However, if you decide to take the A+ exam, you
    will want to study them. Here''s the briefest of overviews.


    # TCP/IP


    A lot of other standards fall under the big tent of **TCP/IP**, because it''s
    not actually a single standard, but rather a whole collection of standards, and
    they apply not only to the Internet but to networking in general. Here are some
    of the key points involved in TCP/IP.


    # IP Addresses


    The "IP" part of TCP/IP stands for Internet Protocol. You may have heard of IP
    addressing before—it''s a way of assigning a unique numeric address to a particular
    PC or network resource so that other PCs can access it from anywhere in the network.
    An IP address is a string of four three-digit numbers separated by periods, like
    this:


    `207.150.192.12`


    Each number does not necessarily have to be a full three digits; leading zeros
    are assumed (i.e., 012 is the same as 12).


    An IP address is actually four eight-digit binary numbers. For example, 207.150.192.12
    is 11001111.10010110.11000000.00001100 in binary. But just try typing that into
    a web browser! That''s why IP addresses are normally converted to decimal. It
    just makes them easier to read and remember.


    > **TIP**


    You can use the Windows Calculator to convert numbers between binary and decimal.
    To do so, choose View > Scientific and then click the Dec button. Type in the
    decimal-base number, and then click the Bin button. The binary equivalent appears.


    When you set up an Internet connection on a PC, you can handle IP addressing in
    two ways. One is to enter a **fixed IP address** for it. Such an address would
    be'
  merge: -1
  pgno: 345
- img_proc: false
  md: '# Setting Up Internet Connections


    assigned by your ISP. Most ISPs, however, do not assign fixed IP addresses because
    there are only a limited number of them to go around and not every customer will
    be connected to the Internet at the same time. Therefore, whenever you connect,
    the ISP assigns a **dynamic IP address**. You keep this IP address for as long
    as you''re connected, and when you terminate the connection, it goes back into
    that ISP''s pool of addresses. You don''t decide this yourself; your ISP tells
    you what settings to use. Almost all dial-up connections use dynamic IP addressing.
    Always-on connections such as cable or DSL can use either.


    > **Dynamic IP address**


    An IP address that is assigned from a pool of available addresses upon connection,
    and released upon disconnection.


    # DNS


    Even with the decimal numbering system and the separators, IP addresses are not
    exactly catchy, and remembering them can be difficult. A **DNS** server, therefore,
    is used to translate IP addresses into text-based addresses called **URLs** that
    have familiar words in them that people can remember.


    > **DNS**


    Stands for Domain Name System. A method of translating numeric IP addresses to
    text-based URLs.


    DNS servers are all over the world. These specialized servers have the job of
    translating each address that a client requests in URL form into an IP address
    and sending that IP address back to the client for its use. All the DNS servers
    share information with one another, so they all contain the same data (although
    sometimes when there''s a change, it takes a day or so for that change to filter
    out to all the DNS servers in the world).


    > **URL**


    Stands for Uniform Resource Locator. The text-based name of a network (usually
    Internet) resource that maps to an IP address through a DNS server, expressed
    in http:// format.


    For example, suppose the client types www.sycamorekno11.com. The DNS server comes
    back with the information that this address translates to 207.150.192.12, and
    the web browser software uses that information to connect to the website. This
    is called a DNS lookup. If you ever see a DNS Lookup Error in a web browser, it
    means the DNS server has failed to provide a translation for the address you entered.
    It could be because there is no information available or because the DNS server
    is not working.


    When you set up an Internet connection, you can enter the IP address of a specific
    DNS server that your ISP has instructed you to use, or you can set it up to automatically
    find a DNS server. Again this is not a decision you make yourself; your ISP tells
    you how to set it up.


    # Subnet Masks


    When you set up an Internet connection with a static IP address, you also have
    the opportunity to enter a subnet mask. This is usually something involving 255s
    and 0s, like this: 255.255.255.0. The easy answer here is to just enter what your
    ISP instructs and leave it at that. Those of you who are curious about how things
    work can read the next few paragraphs; the rest of you can skip them and not be
    any less prepared for the A+ exams.'
  merge: -1
  pgno: 346
- img_proc: false
  md: 'Earlier I said that IP addressing was not just for the Internet, but for corporate
    LANs as well. In a TCP/IP network, each IP address can be broken down into two
    parts. The first part tells what domain the PC belongs to, and the second part
    is the unique identifier of that device within that domain. It''s sort of like
    area codes and prefixes in a telephone number except in that case there are three
    levels of division rather than two.


    The dividing line between the first and second parts of the IP address is not
    a fixed point; it can vary depending on the way the network is set up. This is
    great for people designing networks because it gives them lots of flexibility.
    You could have lots of domains with a few addresses each, a few domains with lots
    of addresses each, or anywhere in the middle between those extremes. The subnet
    mask defines where the separator line should be placed. In very simplistic terms,
    the separator comes at the point where the 0s begin. So, for example, in 255.255.255.0,
    the separator comes after the third group of digits.


    In actual use, however, it becomes more complicated—at least from a human-understanding
    perspective—because an IP address is actually a 32-digit binary number, not decimal,
    as you''ll recall. Each number between the periods is an 8-digit binary. So the
    address 255.255.255.0 is actually 11111111111111111111111100000000. So the breaking
    point between 1 and 0 is actually after the 24th digit. It doesn''t necessarily
    need to break on an even 8, so you could potentially have a subnet mask such as
    255.255.248.0, which would break after the 21st digit.


    If you ever take a course on networking, or study for the Network+ exam, you will
    spend a lot of time learning how to calculate subnet masks. But for our purposes
    in this chapter, all you need to know is how to type one into a dialog box.


    # Connection Protocols


    In the early days of the Internet, several different connection protocols were
    used to establish a TCP/IP Internet connection: SLIP (Serial Line Interface Protocol),
    CSLIP (Compressed SLIP), and PPP (Point to Point Protocol). Today, however, PPP
    is the dominant connection protocol, to the point where it is the default and
    hardly anybody ever needs to change it. Many specifications are associated with
    each of these, but you don''t need to know about them for the A+ exam.


    # Communication Protocols


    Once you get an Internet connection established, then what? Then you need some
    TCP/IP communication protocols to send and receive data.'
  merge: -1
  pgno: 347
- img_proc: false
  md: '# Setting Up Internet Connections


    Several different protocols are standard on the Internet. In earlier days, you
    needed separate applications on your PC to work with each one of them, but today
    some programs can handle multiple protocols. Here are the most important ones
    to know:


    **Hypertext Transfer Protocol (HTTP)** This is the protocol for the **World Wide
    Web** (or Web for short). You use a **web browser** such as Internet Explorer
    to view **web pages**. A web page''s address usually starts with `http://`. Pages
    written to be viewed with the HTTP protocol are written in a text-only programming
    language called **HTML** (Hypertext Markup Language). Within an HTML document,
    there might be additional commands that run mini-applications that produce the
    animation and other bells-and-whistles associated with the fancier web pages.
    These mini-applications are usually written in a system-independent programming
    language such as **Java**, so they will run on any computer.


    +   **World Wide Web**

    A network of web pages available for public display on the Internet.


    **Web browser**

    A program that displays web pages.


    **Web page**

    A text document with embedded HTML codes that make it appear to be formatted and/or
    to contain pictures and other elements when viewed with a web browser.


    **HTML**

    Hypertext Markup Language. A text-based programming language used to create Web
    content.


    **Java**

    A platform-independent programming language for creating applications that users
    using any type of PC can run through a web browser interface.


    **Upload**

    To transfer a file from your PC to another PC.


    **Download**

    To transfer a file from another PC to your PC.


    **FTP site**

    A server that provides FTP access for a hard disk that accepts uploading or downloading
    operations.


    > **NOTE**

    HTML uses only the characters found on a normal keyboard. It embeds codes within
    the text to represent different kinds of formatting. For example, the code `<p>`
    starts a new paragraph.


    **File Transfer Protocol (FTP)** This is a protocol for file **uploading** and
    **downloading**. For a long time, it was the only protocol for this purpose, but
    today many web pages integrate file transfer too. You use an FTP program to connect
    to an **FTP site** and upload or download files from an FTP server. Some web browsers
    enable you to connect to FTP sites through them—without a special FTP program—by
    preceding an IP address with `ftp://`.


    **Telnet**

    Telnet is a very old protocol, used for making a direct connection to a computer
    network. You log in as a remote user through Telnet and have access to the text-based
    operating system on the server (usually Unix). You can use a separate Telnet program
    or you can make a telnet connection from within a web browser by preceding the
    IP address with `Telnet://`.


    **E-mail protocols** These protocols are used on mail servers for picking up and
    sending e-mail. The most common one is Post Office Protocol (POP); a close second
    in popularity is Internet Message Access Protocol (IMAP). Both of these require
    separate e-mail programs, such as Outlook Express or Eudora. Each of these receives
    mail only; they use a third protocol called Simple Mail Transfer Protocol (SMTP)
    to send mail. Depending on your ISP there might be an alternative web access to
    your POP or IMAP e-mail account as well. In addition to these "normal" e-mail
    protocols, there are e-mail accounts that are entirely web based and use only
    the HTTP protocol (for example, those free e-mail accounts you can get through
    Yahoo!, Hotmail, and other services).


    ![](bbox=[0.835, 0.905, 0.895, 0.945])'
  merge: -1
  pgno: 348
