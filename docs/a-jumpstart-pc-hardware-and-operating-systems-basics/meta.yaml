  md: '# Chapter 18


    Do not boot from an unknown floppy. If you accidentally leave a floppy disk in
    the drive at startup, try to catch your mistake as soon as possible, and turn
    the computer completely off. Then remove the floppy and reboot. An infected floppy
    transfers its infection to RAM immediately, even before it displays an error message
    onscreen about the disk not being bootable. If you simply remove it and press
    a key to continue, as suggested onscreen, the virus is already in RAM.


    # Detecting and Removing Viruses


    Windows does not have any antivirus capability; you must rely on third-party programs
    for this. The two biggest sellers are Norton Antivirus and McAfee VirusScan. Both
    are full-featured and easy to use, and both offer automatic updating via the Internet.


    I use Norton Antivirus 2002, and it pretty much takes care of itself. It downloads
    new definitions whenever they are available and installs them automatically, and
    it performs a full system scan for viruses every week (in the middle of the night
    when I''m not using the PC anyway.) I recommend it to all my clients.


    ![](bbox=[0.41, 0.47, 0.84, 0.71])


    When an antivirus program detects a virus, a message pops up on the screen asking
    what you want to do with it. Your choices are usually Quarantine (move the file
    to a folder where it cannot infect other files), Repair (get rid of the virus
    but keep the file in place), or Delete.


    Most antivirus programs also enable you to make a rescue disk, which is a floppy
    disk containing a stripped-down set of virus checking tools. You can boot a system
    with this disk to check for and repair virus infections in the event that Windows
    won''t start. If you do make a rescue floppy disk, make sure you write-protect
    it immediately after making it so no virus can infect it.'
