  md: '# Understanding Internet Connectivity


    The **Internet** is a huge network of computers all over the world. Some of those
    computers are connected 24/7; others connect only when needed.


    All the computers on the Internet can be divided into two broad categories, just
    like on a LAN: clients and servers. An **Internet client** is one where an end
    user sits, surfing the Web, reading e-mail, and so on. An **Internet server**
    is one that either offers client PCs an access point for tapping into the Internet
    or stores Internet content for client PCs to retrieve, such as web pages and e-mail.


    Sometimes the line between an Internet client and Internet server can be fuzzy.
    For example, a home PC user with a full-time cable or DSL connection to the Internet
    might host a small website on his PC or might share that connection with several
    PCs in his home. In those cases, his PC is serving both as a client and a server.
    However, when people talk about Internet servers, they usually mean large, powerful
    corporate servers such as those owned by **ISPs** and **web hosting companies**.


    Large corporations sometimes have their own web servers and provide their employees
    with full-time access to the Internet through the corporate LAN. Individuals who
    want to connect to the Internet, however, must sign up with an ISP, a company
    that provides Internet connectivity for a fee. The services provided by ISPs vary,
    but the average package includes a username and password for connecting, at least
    one e-mail account, and a small amount of space for storing a personal website.


    # Types of Internet Connections


    Until a few years ago, only clients connecting through a corporate network had
    high-speed Internet access; everyone else struggled along with dial-up modems.
    This has changed dramatically lately, however, and high-speed access is available
    to almost any home user who wants it.


    There are different ways of breaking down the various connection types into categories.
    Table 19.1 lists the major players along with some pertinent details about them,
    such as connection speed, telephone usage, and whether or not they use Windows
    **Dial-Up Networking (DUN)**. The alternative is for them to be always on, so
    you don''t connect each time.


    As far as Windows is concerned, there are only two kinds of Internet connections:
    those that require Dial-Up Networking and those that don''t. All the rest is just
    details. I''ll explain how to set up DUN and non-DUN connections later in the
    chapter.


    **Internet**

    A global network of inter-connected computers that share data.


    **Internet client**

    A computer that uses Internet services.


    **Internet server**

    A computer that provides Internet services to other computers.


    **ISP**

    Internet Service Provider. A company that charges people money to help them connect
    to the Internet.


    **Web hosting company**

    A company that charges people money to store their websites and keep them available
    at all times to other clients.


    **Dial-up networking**

    A Windows feature that enables clients to log into a remote network via telephone.'
  merge: -1
  pgno: 343
- img_proc: false
  md: '# Setting Up Internet Connections


    Table 19.1: Internet Connection Types


    | Service | Phone Line? | DUN? | Speed | Notes |

    |---|---|---|---|---|

    | Modem | Yes | Yes | 56Kbps | Available everywhere there is telephone service.
    Slowest type. Ties up phone line when in use. |

    | Integrated Digital Subscriber Network (ISDN) | Yes (special digital line required)
    | Yes | 64Kbps to 200Kbps | Expensive, and speed not much faster than modem. Requires
    special digital type of phone line. |

    | Cable | No | No | 512Kbps to 2Mbps | Uses cable TV line but does not interfere
