    # Windows XP


    Windows XP is the latest version of Windows. It is not covered on the A+ examinations.
    The main thing to know about Windows XP is that it is the culmination of a 10-year
    project to merge the two Windows tracks: the consumer side with Windows 95/98/Me
    and the business side with Windows NT/2000. From an internal standpoint, it is
    based on Windows NT/2000, so it is very stable, but the user interface is chock-full
    of features designed to make the average end user feel at home. The end user (client)
    product comes in two versions: Professional and Home Edition. The Home Edition
    is the same as Professional except it lacks a few features and utilities and costs
    about $100 less. The server version is called .NET rather than XP, and it is scheduled
    for release in early 2003.


    # Selecting an Operating System


    Now that you know the differences between some Windows versions, and the key concepts
    behind them, you can select the right operating system for a particular PC.


    Each version of Windows requires a certain minimum hardware configuration. Table
    14.1 lists the requirements. For the A+ exam, you should familiarize yourself
    with the requirements for Windows 98 and Windows 2000 especially.'
