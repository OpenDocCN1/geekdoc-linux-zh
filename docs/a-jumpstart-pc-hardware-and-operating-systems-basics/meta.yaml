  md: '**Printing Basics**


    # # Printer Types


    Printer types can be broken into two big categories: impact and nonimpact. This
    has to do with the way the image is placed on the page.


    An impact printer is one that uses physical force to place an image on a page.
    If any of you still remember typewriters, you’ll recall that a typewriter was
    an impact device. A typewriter used little hammers with pictures of the various
    letters on them; when you struck a key, the hammer jumped up and hit an inked
    ribbon, which left ink on the paper behind it. Nonimpact printers squirt or fuse
    colored material (liquid ink or dry toner) onto a page instead.


    The following sections explain briefly how several different printer types work
    and why you might—or might not—want one of them.


    # ## Dot Matrix


    Dot matrix printers are impact printers; they strike an inked ribbon with an array
    of metal pins, forming an image on the paper behind the ribbon.


    The dot matrix print head consists of a grid of pins that can pop in or out depending
    on instructions from the ECU. The pattern of popped-out pins form each character.
    The original models had only 9 pins, but later models had 24 pins, resulting in
    much easier-to-read letters.


    > **NOTE**

    How can only nine pins form a character? Simple—they can’t. Dot matrix printers
    do not print an entire line of text at once; they make two or more passes per
    line of text. So the pins arrange themselves to print just the top half of a letter
    in one pass, then the bottom half of it in the next pass.


    A dot matrix printer can—in theory—generate any typeface at any size because it’s
    not really printing the letters but only the images of them. However, most dot
    matrix printers have only two or three resident fonts, so you need an application
    with software fonts or an operating system that supports TrueType fonts in order
    to get much font flexibility.


    The paper feeds past the print head vertically, and the print head moves horizontally.
    Sprockets in the sides of the printer pull continuous-feed paper through by grabbing
    onto the holes along the sides of the paper. After the printing, the rows of holes
    can be removed by tearing off the perforated edges.'
  merge: -1
  pgno: 234
- img_proc: false
  md: '# Chapter 12


    Dot matrix printers are mostly obsolete now, but some businesses still use them
    for multipart forms that need an impact strike to make several carbon copies at
    once. Dot matrix printers are also very economical to operate because they use
    low-cost ribbons rather than the more expensive ink or toner cartridges of other
    types of printer.


    > **Primary corona wire**

    A negatively charged wire in a laser printer that applies a uniform –600v charge
    to the drum in preparation for writing a page image to it.


    # Laser


    The main problem most people had with dot matrix printers was the print quality.
    It just didn''t look as good as output from a typewriter, even at the highest
    quality printing modes. Laser printers solved this problem by producing extremely
    high quality output (300dpi on the early models) that looked even better than
    a typewriter''s. Laser printers remain the workhorses of business today because
    they continue to produce beautiful text output—nowadays in resolutions of up to
    1200dpi.


    Laser printers are page printers—they form the entire page''s image in memory
    and then transfer it all at once to the page. Therefore, the amount of memory
    a laser printer has is significant, as is the speed and power of the printer''s
    ECU.


    If you are old enough to remember mimeograph machines, they provide an excellent
    analogy to the way a laser printer works. Recall that a mimeograph machine took
    a typed sheet of paper and wrapped it around a metal cylinder. As that cylinder
    rotated past ink and then paper, it created copies of the page clinging to the
    drum. That''s what a laser printer does except electrical charges cling to the
    drum and pick up toner. The drum has a very powerful negative electrical charge,
    and a laser neutralizes the charge in certain spots. When the drum passes by a
    reservoir of toner, the toner jumps out and clings to the neutralized spots. Then
    when it passes by some paper, it jumps off onto the paper, and a heater fuses
    it there.


    If you take the A+ exam, you will need to memorize the sequence of events involved
    in laser printing. Here are the events, which you can study now or just file away
    for future reference:


    +   - **Cleaning** All remnants of the previous print job are scraped off the
    drum with a cleaning blade, and any residual electrical charges are removed.

    - **Conditioning** The **primary corona wire** applies a uniform negative charge
    of –600v to the drum''s surface.

    - **Writing** The laser sweeps across the drum''s surface, turning itself on and
    off at precise moments. Wherever the laser was on, the drum surface charge is
    reduced to about –100v. The image of the entire page is written to the drum this
    way.'
