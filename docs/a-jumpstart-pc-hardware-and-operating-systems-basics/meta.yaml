  md: '# Troubleshooting Windows Problems


    last one—it''s a .vbs script, and probably a virus. If your PC is set up to hide
    extensions for known file types, it''ll suppress the .vbs extension in the display
    and appear as goodtimes.jpg. Tricky, eh?


    Viruses cannot infect nonexecutable files, so a virus cannot hide in a text or
    graphic file unless it contains a macro. However, viruses can destroy text and
    graphics files as part of their damage.


    > **Antivirus program**

    Software that monitors files for specific strings of characters that are associated
    with viruses and then quarantines and offers to repair or delete the affected
    files.


    # Precautions to Avoid Viruses


    You can do several things to prevent virus infections on a PC:


    +   - Buy and install an **antivirus program** such as Norton Antivirus, and keep
    it updated by downloading the latest **virus definitions** regularly. Some programs
    check for updates automatically at certain intervals. An antivirus program cannot
    catch the latest viruses if it has out-of-date definitions.


    > **Virus definitions**

    A data file containing the text strings that the antivirus program searches for
    to determine whether virus infection exists.


    +   - Do not open e-mail attachments received from people you don''t know. Even
    if it comes from someone you do know, scrutinize it carefully before opening.
    If the message has odd wording, or if it just doesn''t "sound" like your friend
    the sender, it''s probably a virus. Remember that some viruses e-mail themselves
    to everyone in an address book, so your friend might himself be a virus victim.


    +   - If possible, use an antivirus program that scans incoming e-mail.


    +   - So you can accurately see the extensions of all files, turn the file extension
    display back on in Windows. From a file management window, choose Tools ➤ Folder
    Options, click the View tab, and clear the Hide Extensions for Known File Types
    check box.


    ![](bbox=[0.25, 0.685, 0.5, 0.93])'
