    # Keyboard Troubleshooting


    Most keyboard problems result either from a defective cable or a stuck key. If
    the keyboard is not working in general, or if the wrong characters appear onscreen
    for the keys you pressed, the cable is probably bad. It''s easier and usually
    more cost-effective to buy a new keyboard than to try to disassemble the keyboard
    to replace the existing cable.


    A stuck key at startup could possibly generate an error message. More often the
    key is not actually stuck but has something leaning on it. For example, if you
    have books and papers stacked all over your desk, you might have the corner of
    a book sitting on a key without realizing it. If a key is truly stuck, you can
    try prying it up gently; if that doesn''t work, you can give up and buy a new
    keyboard or futz around with it for awhile if you''ve got some time on your hands.


    ![](bbox=[0.27, 0.47, 0.35, 0.54])


    > **TIP**

    If the stuck key is a result of spilling sticky liquid inside the keyboard, try
    washing the keyboard in your dishwasher (top rack, no heated dry). Then let it
    sit for several days to dry before you try to use it.'
