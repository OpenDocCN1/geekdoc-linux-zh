    # # Random Access Memory (RAM)


    Most of the memory in a PC is **RAM** rather than ROM—Random Access Memory. "Random
    access" refers to the fact that data is not stored in any particular order. One
    area of RAM storage is just as easy to access as any other, unlike on a cassette
    tape where you must rewind and fast-forward to hit a particular spot.


    # ## Static and Dynamic RAM


    There are two broad types of RAM: dynamic and static.


    **Dynamic RAM** (DRAM) is what most people mean when they talk about RAM; it''s
    RAM that loses its data whenever there is no electrical charge flowing through
    the system. Inside a DRAM chip is a grid of tiny capacitors, each of which can
    store an electrical charge for a few milliseconds before it must be refreshed.
    When a particular capacitor has a charge, it represents a 1 value. When it does
    not, it represents a 0. Because of this need to be continually refreshed, DRAM
    retains the data placed into it only as long as the PC is turned on. When electrical
    power is removed, everything in DRAM reverts to an uncharged (0 value) state.
    That''s what we mean when we say RAM is volatile.


    **Static RAM** (SRAM) retains whatever it holds until it receives instructions
    to change. You can think of it as a series of switches—the switch is on until
    you flip it off, or it is off until you flip it on. No electricity is required
    to maintain its state. SRAM is used mostly for caches that assist the CPU by acting
    as temporary storage, as you learned in Chapter 4, "Understanding CPUs." SRAM
    is very fast because it has low overhead—it does not need to expend any effort
    in retaining its data. In theory, a computer could use all SRAM, but it would
    be very expensive.


    The most common usage for SRAM is in the caches that support the CPU. These SRAM
    caches are necessary because of the speed limitations of DRAM. Because DRAM is
    slower than the CPU, sometimes there are delays when moving data between DRAM
    and the CPU. To minimize the performance hit, most CPUs have


    **RAM**


    Random Access Memory. Memory that you can both read from and write to.


    **Dynamic RAM**


    RAM that requires constant electricity to retain its data. Abbreviated as DRAM.


    **Static RAM**


    RAM that retains its data until new data is received. Abbreviated as SRAM.


