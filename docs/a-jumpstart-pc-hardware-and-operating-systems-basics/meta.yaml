  md: '# Operating System Basics


    **Data sharing** The Windows Clipboard used a technology called Dynamic Data Exchange
    (DDE) that enabled users to cut and paste data from one application to another.
    This was a really big deal at the time, and one of the primary benefits to Windows
    programs over MS-DOS ones.


    **Virtual memory** The hard disk could be used to simulate RAM, making it possible
    to load more programs into memory at once than the physical RAM would support.
    This was needed because of Windows’ ability to run two or more programs at once
    and also because of its high overhead that ate into the available RAM with its
    own functions. You learned about how virtual memory works in Chapter 5, “Understanding
    Memory.”


    Windows 3.1 had three key components that stayed loaded in memory at all times
    while it operated: User, Kernel, and GDI. It stored all its system settings in
    a file called SYSTEM.INI and all its user and program settings in a file called
    WIN.INI.


    # Windows 95, 98, and Millennium Edition


    Windows 95 was a combination of 16-bit and 32-bit operating system. It could run
    the 16-bit Windows programs designed for Windows 3.1, but it could also run a
    new breed of 32-bit Windows programs that worked only with it. For MS-DOS compatibility,
    Windows 95 allowed MS-DOS programs to run in a window inside Windows, but it also
    offered an MS-DOS Mode that enabled the system to reboot into a pure MS-DOS environment
    for running programs that did not work well from within Windows. Some of the benefits
    of Windows 95 included:


    **32-bit code** Windows 95 is mostly a 32-bit OS. It retains just enough 16-bit
    code for compatibility with older applications. It runs 32-bit programs and uses
    32-bit device drivers. This is useful because 32-bit programs execute faster.


    **Preemptive multitasking** Windows 95 allows more than one program to timeshare
    the CPU, as with cooperative multitasking, but it allows the CPU itself to control
    the shares doled out to each program. This is **preemptive multitasking**, and
    it increases stability because the system does not have to rely on the individual
    programs being correctly written for multitasking.


    **Plug and Play** With **Plug and Play**, Windows 95 can “talk” to new hardware
    you install, determine its specifications, and install a driver for it automatically.
    The actual success rate of the feature has improved in later Windows versions.


    **Preemptive multitasking** Multiple applications taking turns using the main
    CPU with the CPU itself being in charge of how much time each application gets
    at once.


    **Plug and Play** A standard for devices to talk to operating systems to report
    their specifications and driver requirements so the operating system can set them
    up without user intervention.


