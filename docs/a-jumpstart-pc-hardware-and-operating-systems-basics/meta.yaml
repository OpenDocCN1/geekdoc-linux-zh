    **Stability** In Windows 95, when one program crashed, all the other programs
    usually did too. Windows NT keeps each running program more separate in memory
    than Windows 95 does, so programs affect each other to a lesser extent.


    **Security** In Windows NT, you can set up complex systems of security permissions
    for various individual users and groups.


    **NTFS** Windows NT supports an alternative file system: New Technology File System
    (**NTFS**). When you use NTFS rather than FAT16, you gain additional file management
    features such as the ability to assign permissions to individual files. Windows
    NT 4''s version of NTFS was called NTFS4.


    **Dual Boot** Windows NT offers the ability to dual-boot—that is, to have both
    Windows 95 and Windows NT installed on different partitions of the same PC. To
    set up dual booting, you simply install Windows 95 on the primary partition, and
    then run the Windows NT Setup program and install it on a separate partition.


    > **WARNING**


    Windows 95 and 98 cannot read NTFS partitions, and Windows NT cannot read FAT32
    partitions. The only common file system they share is FAT16, so if you dual-boot
    Windows 95/98 and Windows NT, all of the drives that are accessible to both must
    be FAT16.


    One big drawback to Windows NT is that it doesn''t support Plug and Play hardware
    installation. You must run a Setup program to install each device''s driver, and
    you must have a driver disk that came with the device.


    The most important thing to know about Windows NT is that it was a precursor to
    Windows 2000, and that Windows 2000 was built on the same basic technology as
    NT 4.


    Windows 2000 is an upgraded version of Windows NT. It contains all the features
    and capabilities of Windows NT listed in the preceding section, plus it adds the
    major Windows 95 features that Windows NT lacked. It also has many new features
    of its own.


    Windows 2000 is built on the Windows NT kernel. That means that Windows 2000''s
    behind-the-scenes operation is much more similar to Windows NT 4 than it is to
    Windows 95. The way Windows 2000 runs programs is similar to Windows NT (each
    32-bit application in its own separate space), and the way it deals with hardware
    is similar. That''s why device drivers designed for Windows NT 4


