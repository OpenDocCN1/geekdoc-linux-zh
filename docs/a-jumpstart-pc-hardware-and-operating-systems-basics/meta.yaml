  md: '# # Glossary


    **Chipset** The set of chips built into the motherboard that collectively control
    its operation.


    **Client** A computer that uses network resources as an end user.


    **Client/server network** A network that includes both client and server PCs.


    **Clock cycle** One "beat" or "tick" of the system crystal''s oscillator.


    **Clock multiplier** The number of times by which the internal speed exceeds the
    internal speed.


    **Color depth** The number of unique colors that a particular video mode supports.


    **Command line** A line onscreen where user-typed text appears.


    **CONFIG.SYS** A file that lists the drivers that should automatically be loaded
    each time the PC starts.


    **Conventional memory** The first 640KB of a PC''s RAM. Used for running programs.


    **Convergence** The ability of the electron guns in a monitor to align precisely
    on each triad. If one of the guns is slightly off, it will result in a green,
    red, or blue tinge to the screen, either overall or in certain areas.


    **Cooperative multitasking** Multiple virtual machines taking turns using the
    main CPU one at a time, with each application being in charge of releasing the
    CPU when it is finished with it.


    **CPU** Also called the processor, this large, powerful silicon chip takes in
    data, performs calculations on it, and spits it out again into memory. The CPU
    is sometimes called the "brain" of a PC, but the "calculator" of the PC is actually
    more accurate because it does not think or reason for itself.


    **CRT** Cathode Ray Tube. A type of monitor that uses a large vacuum tube and
    electrons to light up phosphors on a glass screen.


    **Current** The volume of electricity flowing through a circuit. Measured in amps.


    **Current directory** The directory (folder) specified in the command prompt,
    to which any commands will apply that are not specifically directed at some other
    location.


    **Cylinder** The same head position on a stack of platters in a multiplatter disk
    such as a hard disk.


    **Desktop case** A PC case designed to sit with its largest side flat on a desk.


    **Device resources** Pathways or memory addresses that help a device communicate
    with the CPU and the operating system.


    **Dial-up networking** A Windows feature that enables clients to log into a remote
    network via telephone.


    **DIMM** Dual Inline Memory Module. A modern type of RAM packaging with 168 pins.


    **Directory** Same thing as a folder. The term Directory is often used rather
    than folder when referring to work at a command prompt.


    **DMA** Direct Memory Access. A way of increasing data transfer rates by enabling
    the device to bypass the CPU and access memory directly.


    **DNS** Stands for Domain Name System. A method of translating numeric IP addresses
    to text-based URLs.


    **Dot pitch** The measurement of the distance between one colored dot in a triad
    and the same color in an adjacent triad.


    **Double-click speed** The speed at which one click must follow another in order
    for the PC to perceive it as a double-click rather than two single clicks.


    **Double-scan passive matrix** An improved passive matrix display that divides
    the screen into separate sections and has one transistor for each row and column
    in each section.'
