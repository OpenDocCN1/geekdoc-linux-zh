  md: '# Appendix A


    # What''s in a PC Technician''s Toolkit?'
  merge: -1
  pgno: 358
- img_proc: false
  md: '# Appendix A


    If you plan to take apart, repair, and reassemble PCs, a good toolkit is an essential
    investment. The right tools can save you a lot of time, and help you avoid damage
    to your equipment or injury to yourself.


    Most computer stores sell toolkits of various sizes. You don''t need the largest,
    fanciest one, as long as you have the few basic tools you need for the PCs that
    you''ll be working on. For example, Compaq laptops happen to use a small Torx
    screw (T-8 size), so if you work on those, you''ll need a T-8 screwdriver; otherwise,
    you probably won''t need one.


    Generally speaking, a good toolkit should contain:


    **At least two sizes of Phillips head screwdrivers** You''ll need a medium-sized
    one for large screws such as those on the cover of the computer case, plus a small
    one for tiny screws such as those holding a disk drive in place. Most screws in
    a typical computer are Phillips (a four-prong star) rather than regular flathead
    screws (a straight line).


    > **WARNING**


    Do not use a magnetized screwdriver inside the computer. Some technicians enjoy
    the convenience of using a screwdriver with a magnetized tip to fish dropped screws
    out of crevices, but it''s easy to damage disks by touching them with a magnet.
    If the only screwdriver you have available is magnetized, exercise extreme care
    not to touch its tip to any part of the PC except the screws themselves.


    ![](bbox=[0.27, 0.43, 0.35, 0.52])


    **At least two sizes of flathead screwdrivers** Although flathead screws are less
    common in computer equipment, you will occasionally encounter them.


    **Needle-nose pliers** These are useful for grasping small items and for removing
    and replacing circuit board jumpers.


    **Tweezers** Or even better, a part retriever, which is like a tiny set of retractable
    claws with a spring-loaded handle.


    The above constitutes the basic set; you might also want the following tools:


    **Wire snips** A pair of wire snips for cutting wire and stripping insulation.


    **Small flashlight** This is useful to see small areas inside the computer, for
    example, the pin 1 marking on a connector.


    **3/16-inch nut driver** This tool helps place 3/16-inch hexagonal nuts into the
    computer. The nuts are useful for mounting hardware on motherboards as well as
    serial and parallel ports.'
  merge: -1
  pgno: 359
- img_proc: false
  md: '# What''s in a PC Technician''s Toolkit?


    **Torx screwdrivers or bits** A six-pointed star-shaped screwdriver head. Torx
    screws are often used to secure the covers on places where the manufacturer does
    not want the average consumer to venture, because most people do not have this
    type of screwdriver.


    **Knife** A cutting blade or utility knife of some sort.


    **Windows 98 or Me startup disk** Windows 95 startup disks do not contain real-mode
    CD-ROM drivers so that your CD-ROM drives will work from the command prompt. You
    must manually edit the CONFIG.SYS and AUTOEXEC.BAT files on a Windows 95 startup
    disk to add CD-ROM support. It''s a good idea, therefore, to have a Windows 98
    or Me startup disk in your troubleshooting toolkit. It can be used on Windows
    95 systems.


    Besides your toolkit, you will also want to carry a bag containing these useful
    items:


    **Antistatic wrist strap** A safety device that greatly reduces the chance of
    static damage to components by channeling any static electric charge to the ground
    instead of through computer components.


    **Roll of black electrical tape** Helpful for wrapping wire ends and insulating
    components.


    **Can of compressed air** For cleaning components without using any hazardous
    liquids.


    **Soft, lint-free cloth** For cleaning the monitor and other components.


    **Digital multimeter** A meter that measures multiple types of electrical specs
    (ohms, amps, and volts).


    Finally, it is a good idea to accumulate a stockpile of spare parts if you do
    many PC repairs. Some suggestions are as follows:


    **Screws** A supply of various sized screws.


    **Expansion card backplates** Save the metal inserts that you take out of the
    back of a case when you put a modem or other card into the PC. You may need them
    again later.


    **Drive faceplates** Save the plastic faceplates that you remove from the front
    of cases so you can replace them later if needed.


    **Mounting kits** These are sometimes supplied with retail hard disks and allow
    you to put a 3.5-inch drive into a 5.25-inch bay. They are useful when your case
    has more free 5.25-inch bays than 3.5-inch bays.


    **Cables** Save any power, IDE, floppy, CD-ROM, or other cables that you may accumulate.'
  merge: -1
  pgno: 360
- img_proc: false
  md: '# Appendix A


    **Keyboard, mouse, and 3.5-inch floppy drive** Keep an extra one of each of these
    components to help with troubleshooting problems.


    **Alcohol and Swabs** A small vial of denatured alcohol and some cotton swabs
    can come in handy for cleaning the corona wires on laser printers.


    **Monitor cleaner** Because monitor screens should not be cleaned with ordinary
    glass cleaner, you might want a supply of premoistened monitor cleaner towelettes
    on hand.


    **Information** Make a notebook you can carry around to work sites that lists
    information you are likely to need. This might include the toll-free support numbers
    for various brands of hardware, a list of hazardous materials disposal sites in
    various towns, and so on.'
