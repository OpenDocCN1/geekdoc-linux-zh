  md: '# # How Video Cards and Monitors Work


    If you have a monitor testing program, run it. (You can download one for free
    from almost any download site, such as CNet.) Some are very sophisticated, allowing
    you to take a monitor through several resolutions and color depths; others are
    simply test patterns and solid color screens that you can use to visually check
    for display flaws such as damaged phosphors. If one of the dots in a triad is
    faulty, for example, the display will look fine when displaying a pure screen
    of two of the colors, but you''ll notice a black speck when displaying a pure
    screen of the other color.


    Display a pure-white screen and look for **convergence** problems. This will appear
    as places onscreen with a red, green, or blue tint, and it indicates a problem
    with the dots in the triads not aligning properly. Some monitors have an adjustment
    to correct this. If you don''t have a utility that will give you a pure white
    screen, a shortcut is to open a new document in a word processing program and
    maximize the window. Also look for any individual pixels that are not white; this
    can indicate a damaged phosphor in that spot.


    If possible, display pure red, pure green, and pure blue screens and look for
    any dropped-out pixels. A monitor testing program usually provides such screens.


    If you find damaged phosphors, convergence problems, or uncorrectable screen distortion,
    you can''t do much about it other than recommend that the client buy a replacement.
    It is possible to make some internal adjustments to some monitors, but that involves
    removing the cover from the monitor, and on a CRT you''ve got that big bad capacitor
    that can potentially kill you, so it''s usually just time for a new monitor when
    problems like that occur.


    # ## Black Ring


    This one''s easy. Some resolutions and refresh rates require that you fine-tune
    the image size on the monitor. Adjust the controls on the monitor front or back
    to expand and position the image on the screen so it is centered and as large
    as possible.


    # ## Display Problems with a Specific Application


    Sometimes an application (usually a game) that has 3D graphics will have a problem
    running with certain video cards. If this happens, there are several tools you
    can use to troubleshoot the situation.


    If the game itself has a display troubleshooting feature, start with that. You
    can also adjust the overall hardware acceleration setting in Windows. By default,
    it''s


    # ### Convergence


    The ability of the electron guns in a monitor to align precisely on each triad.
    If one of the guns is slightly off, it will result in a green, red, or blue tinge
    to the screen, either overall or in certain areas.'
