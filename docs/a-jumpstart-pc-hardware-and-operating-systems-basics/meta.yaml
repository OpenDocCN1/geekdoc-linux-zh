  md: '# Introduction to Networking


    Windows Server is not the only **Network Operating System (NOS)**, however. Novell
    NetWare is another popular NOS. A NetWare server runs NetWare as its operating
    system, but client PCs can run any ordinary operating system that includes NetWare
    drivers in it. (All versions of Windows do, for example.)


    # Types of Networks


    One of the reasons that people get so stressed out about "learning networking"
    is that there are so many ways of breaking a network down. So far we''ve looked
    at client/server versus peer-to-peer, network topology, and network operating
    system, but there is one other way to differentiate networks: the network type.


    Ethernet is the most popular type of network by far, but there are several alternatives
    to it including Token Ring and Fiber Distributed Data Interface (FDDI). The network
    type has no direct relationship to the NOS or the topology, but not all topologies
    and NOSes will work with all network types. For example, an Ethernet network can
    use either Novell NetWare or Windows Server as the NOS, and it can use either
    the bus or the star topology.


    # How a Network Moves Data


    From a user perspective, network communications are pretty simple. You hook up
    some PCs and the cables send the data from place to place, just like the buses
    do on a circuit board. But there are some rather complex standards and rules for
    the way data is sent, received, and interpreted. I won''t get too deep into that
    here, but I want you to at least get a feel for the basics of it.


    # Data Packets


    Data is transmitted over a network as bits and bytes translated into electronic
    signals. In preparation for the transmission, the data is divided into segments,
    each having a header and trailer attached (like an envelope for mailing). The
    entire unit is called a **packet**. The data packets are sent as independent units
    over the network. The packet size varies depending on the NOS. When the receiving
    PC gets the data, it strips off the header and trailer and reads the data, just
    like you would open and discard an envelope and read the letter inside.


    # Network Protocols


    Remember how we talked about each piece of hardware speaking its own language
    and needing a driver to translate for it? Well, networking is the same way. Networks
    require **protocols** for communication. The protocol determines


    **Network Operating System (NOS)**


    An operating system designed to help a server PC provide access to files, printers,
    and other network resources to client PCs.


    **Packet**


    A piece of data packaged for network transit, including the data itself plus addressing
    information. Also called a frame.


    **Protocol**


    A language or set of rules for transmitting data between devices.'
  merge: -1
