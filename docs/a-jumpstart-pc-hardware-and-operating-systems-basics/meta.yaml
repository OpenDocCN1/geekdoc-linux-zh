  md: '# # Common Printer Problems


    Here are some ideas for troubleshooting problems with printers.


    # ## Paper Jams


    With laser printers, because they run at faster speeds than other printers, most
    errors occur due to paper jams. Other printer types can also have jams too.


    A lot of paper jam problems can be avoided simply by using the right type of paper.
    Any paper that is extra-heavy (more than 24 pounds) or extra-light (less than
    16 pounds), or is torn, curled, or wrinkled is likely to cause a jam—so is paper
    that is heavily textured or embossed. Paper jams can also be the result of paper
    and toner particles inside the printer, so clean the printer thoroughly as a first
    step. See the printer''s manual for instructions.


    Sometimes when the humidity is high, the paper can stick together in the paper
    tray, feeding multiple sheets at once and causing jams that way. To avoid this,
    take the paper out and fan it.


    If you''re still having jam-ups, check to see whether the printer has some sort
    of control that specifies the thickness of the paper it is using. If this adjustment
    does not match the actual paper in use, jams can result.


    If none of these solves the problem, and the printer is old, perhaps the paper
    feed rollers are getting worn and too smooth. Try roughening them up slightly
    with a kitchen pot-scrubber or fine-grain sandpaper. This helps the paper advance
    through the feed mechanism.


    # ## Laser Quality Problems


    Here are some common problems with laser output:


    **Printout faint in some spots** This can happen when the toner in the cartridge
    starts running low. Take out the toner cartridge and shake it from side to side
    several times (never up-and-down, or it could spill). Then put it back in and
    it should be good for another 100 pages or so.


    Faint printing can also be the result of the drum reaching the end of its useful
    life. On printers where the drum and toner are separate, the drum has a longer
    life but must eventually be changed. Such printers usually have a print density
    control that adjusts the amount of toner used for each page. When the drum is
    new, this setting should be on Low, but as the drum ages, you might need to turn
    it up gradually to compensate for the drum''s growing ineffectiveness.'
  merge: -1
