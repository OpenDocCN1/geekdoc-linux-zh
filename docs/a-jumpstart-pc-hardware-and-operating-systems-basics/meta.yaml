  md: '# Chapter 11


    have the same resistance—that is, the same capacity for impeding electricity from
    passing through it freely—no matter what electricity is available to it.


    # Grounding


    Just as water is always seeking sea level, and will flow downward until it gets
    there, electricity is always seeking the ground. When people get struck by lightning,
    the electricity takes a path to the ground through their bodies. When birds sit
    on an electrical line, they don''t get electrocuted because they are not touching
    the ground. The electricity has no reason to pass through the bird''s bodies because
    the birds do not offer a path to the ground. If a bird (okay, a really big bird)
    were to put one foot on the wire and the other foot on the ground, the bird would
    get fried, as would a human.


    Remember back in Chapter 1 when we talked about the importance of grounding with
    static electricity? That same principle is in effect for the power coming from
    the wall outlet to the PC as well. The third prong on a connector—the round one—is
    a ground line, and it plays no role in the normal in-and-out electrical flow through
    the socket. Instead, it''s there to provide a path of very little resistance to
    the ground should it be needed (for example, if a short-circuit occurs that dumps
    a lot of electricity into the system at once). It''s a safety feature—nothing
    more.


    # AC versus DC


    Earlier I explained how the negatives travel from one of the holes in the wall
    outlet to the other, looking for positives. That was an oversimplification. In
    fact, the holes alternate between being positive and negative many times per second.
    The speed at which they alternate is measured in cycles per second, or hertz (Hz).
    Ordinary household electricity alternates at 60Hz. This type of electrical delivery
    is called *alternating current* (AC). AC is a more efficient way of sending power
    over wires, especially over long distances. When devices run on battery power,
    however, they use *direct current* (DC). With direct current, power always flows
    the same direction all the time—from negative to positive. Batteries use DC because
    they have no need to be far away from the devices they power and because it requires
    lower overhead (which is desirable for a simple, battery-operated system).


    PC components require DC power, but the wall outlet supplies AC, so one of the
    jobs of the power supply is to convert AC to DC. We''ll look at this further in
    the next section.'
  merge: -1
  pgno: 219
- img_proc: false
  md: '# A Few Other Essential Components


    # Power Supplies


    Now that you know about electricity, this discussion of power supplies will probably
    make a lot more sense to you than it otherwise might.


    The power supply in a PC takes in 110-volt AC current from the wall outlet and
    converts it into DC current. It also steps down the voltage and sends different
    voltages to the various components via the different colored wires. For example,
    the red wires are for +5v and the black wires are for grounding.


    Power supplies come in two styles: AT and ATX. The power supply must match up
    with the case and motherboard type because the power supply connector on the motherboard
    is different for each. Besides that, the main differentiation of one power supply
    from another is in its wattage, which is discussed next.


    # Wattage Ratings


    A power supply has a maximum wattage, such as 200 or 300 watts. The more devices
    you connect to the PC, the higher wattage power supply you need. That''s why cases
    with more drive bays usually come with higher wattage power supplies than smaller
    cases—because there is the potential for hooking up more drives that each need
    wattage.


    Remember, wattage is voltage times amps, and each device draws amps as needed.
    To determine what wattage power supply a system needs, you multiply the volts
    by the amps for each device and then add the answers together.


    Many devices indicate on their label the amount of amps they draw, like this CD-RW
    drive, for example:


    ![](bbox=[0.1, 0.66, 0.88, 0.92])'
  merge: -1
  pgno: 220
- img_proc: false
  md: 'This drive uses 0.9 amps of +5v power and 0.5 amps of +12v. That''s (0.9× 5)
    + (0.5×12), or 10.5 watts.


    Not all devices say so clearly how much they draw, so use this list as a rough,
    conservative estimate:


    +   - A motherboard: 20 to 30 watts

    - CPU: 30 watts for Pentium II or III; 65 watts for Pentium 4, 70 watts for Athlon

    - An AGP video card: 20 to 50 watts

    - An average PCI circuit board (including video card): 5 watts

    - An average ISA circuit board: 10 watts

    - Floppy drive: 5 watts

    - CD-ROM drive: 10 to 25 watts

    - RAM: 8 watts for every 128MB

    - IDE hard drive: 5 to 15 watts

    - SCSI hard drive: 10 to 40 watts


    Name-brand PCs usually come with power supplies with adequate wattage, so the
    main occasion for worrying about wattage would be if you were assembling a PC
    from scratch and needed to select the power supply appropriate to the components
    you were going to put into it. The A+ exam doesn''t go into too much depth about
    wattages—you don''t need to know the specifics for any particular device type,
    for example. The main thing to remember is the formula:


    > volts × amps = watts


    # Troubleshooting Power Supply Problems


    A dead power supply is just that: dead. The fan won''t spin; the PC won''t start
    up. If you''ve got one of these, swapping out the power supply with a new one
    is the first thing to try.


    A partially failing power supply, on the other hand, can cause all sorts of problems
    that do not appear to be directly related, leading the less experienced technician
    on a wild goose chase through memory, processor, motherboard, and hard disk errors.
    When troubleshooting an intermittent problem that seems to jump around—for example,
    a memory problem that reports a different memory address as faulty each time,
    or spontaneous rebooting after a random amount of time—suspect the power supply.


    A power supply can cause a problem for three reasons: physical failure, overloading,
    and overheating.'
  merge: -1
  pgno: 221
- img_proc: false
  md: '# A Few Other Essential Components


    In a physically failing power supply, the power supply is not generating its rated
    amount of power, or it is providing the wrong voltages on some wires. The PC generally
    will not start at all if such a condition exists. See the next section, "Testing
    a Power Supply," for help determining whether a power supply is working correctly.
    Replacing a faulty power supply is the best solution; repairing power supplies
    can be dangerous for inexperienced technicians, and it is seldom cost-effective.


    On an overloaded power supply, there is not enough wattage to support all the
    devices plugged into it. On a system with an overloaded power supply, problems
    will often occur at startup, when all the drives are spinning up, or when accessing
    a drive. See the preceding section to calculate how much wattage the system needs.
    Then replace the power supply with a higher-wattage model if needed.


    Overheating happens when the power supply fan (or in some cases the processor
    cooling fan) is not doing its job adequately, or when the system case''s airflow
    is obstructed. Most computer cases are designed to pull fresh air through the
    case, across the major heat-producing components. The air flowing through the
    restricted space is very important. Removing the case cover, or leaving empty-slot
    backplates off, prevents the air from flowing as designed, and overheating can
    result. If the system starts up okay but then starts having problems after several
    minutes of operation, inadequate cooling is almost always the problem. Make sure
    the airflow path is unobstructed, that the processor heat sink or cooling fan
    is in place and operational, and that the power supply fan is working quietly
    and correctly.


    > Power_Good Wire

    Also called Power_OK wire. The wire from the power supply to the motherboard that
    tests the power supply''s performance before the rest of the system starts up.


    # Testing a Power Supply


    When the PC starts up, the power supply sends a signal to the motherboard via
    the **Power_Good wire** (one of the wires that leads from the power supply to
    the motherboard). The motherboard looks for a voltage of between +3v and +6v on
    this wire. When it receives it, it knows the power is "good" and it allows the
    system to start up. If it doesn''t receive it, or if it receives some other voltage,
    it suspects the power supply is bad and it continually resets itself, refusing
    to start up. This is a protection system built into every motherboard to prevent
    damage from a faulty power supply.


    Therefore, when you suspect that a power supply is at fault, the first thing to
    test is that Power Good pin. On an AT power supply, it''s the orange wire, the
    first pin on the P8 connector. On an ATX power supply, it''s the gray wire. If
    those test okay, you can test the rest of the wires too. See the following sections
    to learn more about it.


    ![](bbox=[0.8, 0.84, 0.86, 0.88])


    203'
  merge: -1
