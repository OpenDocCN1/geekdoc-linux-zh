  md: '# Korn Shell User and Programming Manual


    # Variable Attributes


    Korn shell variables can have one or more attributes that specify their internal
    representation, access or scope, or the way they are displayed. This concept is
    similar to a data type in other high-level programming languages, except that
    in the Shell it is not as restrictive. Variables can be set to integer type for
    faster arithmetic operations, read-only so that the value cannot be changed, left/right
    justified for formatting purposes, and more. To assign a value and/or attribute
    to a Korn shell variable, use the following format with the typeset command:


    ```

    typeset--attribute variable=value

    orntypeset --attribute variable

    ```


    Except for readonly, variable attributes can be set before, during, or after assignment.
    Functionally it makes no difference. Just remember that the attribute has precedence
    over the value. This means that if you change the attribute after a value has
    been assigned, the value may be affected.


    # Lowercase (-l) and Uppercase (-u) Attributes


    These attributes cause the variable values to be changed to lower or uppercase.
    For example, the lowercase attribute and uppercase value ASPD are assigned to
    variable MYSYS:


    ```

    $ typeset -l MYSYS=ASPD

    ```


    Despite the fact that MYSYS was assigned uppercase ASPD, when'
