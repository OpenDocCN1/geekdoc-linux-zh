    # The select Menu Format


    The format of the select menu can be controlled by assigning values to the LINES
    and COLUMNS variables. The LINES variable specifies the number of lines to use
    for the menu. The menu choices are displayed vertically until about two-thirds
    of lines specified by LINES are filled. The COLUMNS variable specifies the menu
    width. This example displays how the COLUMNS and LINES variables affect a select
    menu. With the default setting, the select menu is displayed like this:


    ```

    $ stest

    1) Choice-A

    2) Choice-B

    3) Choice-C

    Enter selection>

    ```


    If LINES is set to 2, the menu choices are displayed on one line:


    ```

    $ types -x LINES=2

    $ stest

    1) Choice-A 2) Choice-B 3) Choice-C

    Enter selection>

    ```


    while COLUMNS is set to 50, the menu choices are displayed closer together on
    one line:


    ```

    $ types -x COLUMNS=50

    $ stest

    1) Choice-A 2) Choice-B 3) Choice-C

    Enter selection>

    ```


    If these variables are not explicitly set, the default used is 80 for COLUMNS,
    and 24 for LINES.'
