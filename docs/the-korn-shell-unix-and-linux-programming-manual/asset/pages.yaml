  md: '# Korn Shell User and Programming Manual


    +   - Other miscellaneous features. New test operators, special variables, special
    commands, control commands, command-line options, and security features have also
    been added.


    # Where To Get the Korn Shell


    The Korn shell is included as an optional shell, along with the Bourne and C shells
    by most vendors, including Sun for Solaris, SCO for Unix, Hewlett-Packard for
    HP-UX, and others. It is also available as an unbundled product from many vendors.


    The Desktop Korn shell (dtksh) is another version of the Korn shell that is available
    by many vendors as an upgrade to Kornshell88-based versions. It is usually located
    in/`usr/dt/bin/dtksh`.


    The Public Domain Korn shell, or pdksh, as the name suggests, is a public domain
    version of the Korn shell. It''s compatible with most version of Unix, but is
    mostly used on Linux-based systems. At the time of this writing, the current version
    (5.2,14) has most of the Kornshell88, as well as some of the Kornshell93 and additional
    features that are not in either. For more detailed information, refer to Appendices
    F-H.


    David Korn and AT&T offer U/WIN, a non-commercial version of the Korn shell for
    Windows-based systems (NT and 98). It is based on KornShell98 and contains almost
    200 of the popular Unix commands. We''ve included a version in the accompanying
    CD, but it is also available from http://www.research.att.com/sw/uwin.


    More information including links for the source distribution the Korn Shell and
    U/Win is available at this URL: http://www.kornshell.com.'
  merge: -1
