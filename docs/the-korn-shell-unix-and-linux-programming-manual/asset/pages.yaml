    0\n```\n\n# Other if Syntax: elif\n\nThis form of the **if** command is used to\
    \ execute one set of commands if one condition is true, another set of commands\
    \ if another condition is true, and so on, or else execute a set of commands if\
    \ none of the conditions are true. The syntax for this **if** command is:\n\n\
    ```\nif command1\nthen\n  commands\nelif command2\nthen\n```"
