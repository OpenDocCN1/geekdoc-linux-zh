  md: '# # Chapter 5:

    Job Control


    Manipulating Jobs

    Checking Job Status

    Background Jobs and I/O

    Job Names

    Leaving Stopped Jobs


    The Korn shell provides a job control mechanism that is virtually identical to
    the C shell version of BSD Unix. Job control allows programs to be stopped and
    restarted, moved between the foreground and background, their processing status
    to be displayed, and more. To enable the job control feature, the **monitor**
    option must be enabled with the `set` command:


    ```

    $ set -o monitor

    or

    $ set -m

    ```


    This can be put into the **profile** file so that job control is automatically
    enabled at login. On most systems that provide the job control mechanism, this
    option is automatically enabled for interactive shells.'
