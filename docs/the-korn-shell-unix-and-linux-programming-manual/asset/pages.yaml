    # The exec Command


    The exec command is used to perform I/O redirection with file descriptors 0 through
    9 using this format:


    ```

    exec I/O-redirection-command

    ```


    The I/O redirection performed by the exec command stays in effect until specifically
    closed, changed, or if the script or shell terminates. We could use this idea
    to direct standard output to a file. First, let''s start a subshell. You know
    that 1>std.out directs standard output to std.out. So if we put the exec command
    in front of it, all subsequent standard output will be redirected.


    ```

    $ ksh

    $ exec 1>std.out

    ```


    Now anything that goes to standard output is redirected to std.out until file
    descriptor 1 is specifically reset.


    ```

    $ pwd

    $ whoami

    $ print "Where is this going?"

    ```


    Notice that standard error is still attached to your terminal:


    ```

    $ print -u2 "This is going to standard error"

    This is going to standard error

    ```


    Let''s exit from the subshell, and take a look at the output file:


    ```

    $ exit

    $ cat std.out

    /home/anatole/bin

    anatole

    Where is this going?

    ```


    215'
