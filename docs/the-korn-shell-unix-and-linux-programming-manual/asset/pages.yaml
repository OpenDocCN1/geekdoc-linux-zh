    ```


    Without options, special characters, or quotes, each argument is displayed separated
    with a space, and all the arguments are terminated with a newline:


    ```

    $ print X       Y       Z

    X X Y Z

    ```


    Notice that all the extra whitespace between the arguments was truncated. We could
    keep the whitespace by enclosing the arguments in quotes like this:


    ```

