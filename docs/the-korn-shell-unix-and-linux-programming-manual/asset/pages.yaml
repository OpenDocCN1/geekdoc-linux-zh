    an error or interrupt.


    The trap_test script creates some files, then removes them when an interrupt is
    received. Notice that the trap command is surrounded by single quotes. This is
    because the FILES variable is evaluated when the signal is received, not when
    the trap is set.


    ```

    $ cat trap_test

