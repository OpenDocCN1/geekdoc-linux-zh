    If there is an attempt to reset PATH, an error message is generated:


    ```

    $ PATH=$PATH:/usr/bin:

    /bin/ksh: PATH is read only

    ```


    We''ll come back to this in a few pages. Unlike other variable attributes, once
    the readonly attribute is set, it cannot be removed.


    The readonly command can also be used to specify a readonly variable.


    # Integer (-i) Attribute


    The integer attribute (-i) is used to explicitly declare integer variables. Although
    it is not necessary to set this attribute when assigning integer values, there
    are some benefits to it. We''ll cover this later in Chapter 6. In the meantime,
    NUM is set to an integer-type variable and assigned a value:


    ```

    $ typeset -i NUM=1

    $ print $NUM

    1

    ```


    We could also assign NUM the number of users on the system using command substitution
    like this:


    ```

    $ typeset -i NUM=$(who | wc -1)

    $ print $NUM

    3

    ```


    There is one restriction on integer variables. Once a variable is set to integer
    type, it can''t be assigned a non-integer value:


    ```

    $ typeset -i NUM=abc

    /bin/ksh: NUM: bad number

    ```


