    \ a way to include text that is not executed. Good commenting makes it easier\
    \ for you or someone else to read your scripts. Words beginning with # up to end\
    \ of the current line are treated as comments and ignored. The listargs script\
    \ could be commented like this:\n\n```\n$ cat listargs - List arguments\n# listargs\n\
    \n# Loop on each argument\nwhile ([$# != 0])\ndn    # Make sure argument is alphanumeric\n\
    \    if [[ $1 = +([A-z]) ]];\n    then\n        print \"$1: arg ok\"\n       \
    \ shift\n    else\n        print \"$1: Invalid argument!\"\n        shift\n  \
    \      continue\nfi\ndone\n```\n\nThe # character can also be used to make your\
    \ Korn shell scripts compatible with other shells. Any Korn shell script that\
    \ begins with:\n\n```\n#!interpreter\n```\n\nis run by the given interpreter.\
    \ So, for the C and Bourne shell users on your system, if you want your shell\
    \ scripts to be run by the Korn shell (assuming it is installed in /bin), make\
    \ sure they start with:\n\n```\n#!/bin/ksh\n```"
