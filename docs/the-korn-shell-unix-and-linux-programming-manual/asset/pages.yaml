    is relatively easy. The vi in-line editor is a subset of the vi editor program,
    so most of the commands are the same.


    In vi edit mode, there are two operating modes: input and command. Operating in
    and out of input mode is virtually the same. Commands are entered and executed
    just as if you were not using the in-line editor. As soon as you press the <Escape>
    key, you are put in command mode. This is where you can enter your vi commands
    to access and edit commands from the history file, or current command line.


