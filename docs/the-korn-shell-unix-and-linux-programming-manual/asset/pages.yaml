    # Tracked Aliases


    Tracked aliases are used to associate an alias with the full pathname of a program.
    When a tracked alias is invoked, instead of searching each directory in PATH,
    the full pathname of the corresponding command is returned from the alias table.
    This speeds execution by eliminating the path search.


    Most implementations of the Korn shell come with a few tracked aliases. These
    are usually set to frequently used commands. Tracked aliases and their values
    can be displayed with the alias -t command. Let''s see what we''ve got:


    ```

    $ alias -t

    ls=/usr/bin/ls

    mv=/usr/bin/mv

    rm=/usr/bin/rm

    vi=/usr/ucb/vi

    ```


    On this version of the Korn shell, the ls, mv, rm, and vi commands are standard
    tracked aliases. On other implementations, they may be different.


    Tracked aliases are basically the same as normal aliases, except that'
