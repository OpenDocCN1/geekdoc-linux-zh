    # PATH


    The PATH variable contains a list of colon-separated directories to check when
    a command is invoked. Each directory in PATH is searched from left-to-right for
    a file whose name matches the command name. If not found, an error message is
    displayed. A : alone in PATH specifies to check the current directory. This PATH
    setting specifies to check the /bin directory first, then /usr/bin. /usr/spool/news/bin,
    and finally the current directory:


    ```

    $ print $PATH

    /bin:/usr/bin:/usr/spool/news/bin:

    ```


    Don''t let PATH get too large, because performance can be adversely affected by
    having to check so many directories each time a command is invoked.


    If not set, the default value for PATH is /bin:/usr/bin.


