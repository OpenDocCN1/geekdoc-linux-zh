  md: '# Korn Shell User and Programming Manual


    # Simple Script


    Most of this chapter deals with how the Korn shell interacts with Unix , but to
    briefly explain the scripting concept a very simple example is provided. First
    of all, ls is a Unix command that lists the name of the files in the current directory,
    and print is a Korn shell command that displays its argument. Using your favorite
    Unix editor, enter the following text into a file called simple_script.ksh:


    ```

    print "Here are the current files:"

    ls

    ```


    Assuming that you are using the Korn shell, have execute permission in your default
    umask and that you have the current path included in your environment (this will
    also be covered later!), run the script like this:


    ```

    $ simple_script.ksh

    Here are the current files:

    simple_script.ksh /tmp report.txt

    ```


    If this does not work, you can also try running the script like this:


    ```

    $ ksh simple_script.ksh

    Here are the current files:

    simple_script.ksh tmp report.txt

    ```


    As you can see, a script is just a ''batch'' file of commands that is passed to
    the Korn shell to be executed. More about writing Korn shell scripts is covered
    in Chapter 8.


    # Process Execution


    This section provides a quick overview of how the Korn shell interacts with Unix.
    For the following sections, it is assumed that you'
  merge: -1
  pgno: 33
- img_proc: true
  md: 'are logged as a regular user


    # Multiple Commands


    Multiple commands can be given on the same line if separated with

    the ; character. Notice that the command prompt is not displayed

    until the output from all three commands is displayed:


    ```

    $ pwd ; ls dialins ; echo Hello

    /home/anatole

    dialins

    Hello

    $

    ```


    This is also useful when you want to run something more complex

    from the command line, like rename all the files in the current

    directory using flow control commands:


    ```

    $ for i in $(ls); do mv $i $i.bak; done

    ```


    The for loop command is covered in more detail in Chapter 8.


    # Continuing Commands


    If a command is terminated with a \ character, it is continued on the

    next line. Here, the echo arguments are continued onto the next line:


    ```

    $ echo a b \

    > c

    a b c

    ```


    This is often used to make Korn shell scripts mode readable. Refer to

    Appendix D for some good examples. The echo command itself can'
  merge: -1
  pgno: 34
- img_proc: true
  md: '# Korn Shell User and Programming Manual


    be continued onto the next line by using the \ character:


    ```

    $ ec\

    > ho a b c

    a b c

    ```


    # Background Jobs


    Commands terminated with a & character are run in the background. The Korn shell
    does not wait for completion, so another command can be given, while the current
    command is running in the background. In this example, the ls command is run in
    the background while pwd is run in the foreground.


    ```

    $ ls -LR /usr > ls.out &

    [1] 221

    $ pwd

    /home/anatole/bin

    ```


    This feature is discussed in detail in Chapter 5.


    # Pipes


    The output of a command can be directed as the input to another command by using
    the | symbol. Here, a pipe is used to see if root is logged on connecting the
    output of who to grep:


    ```

    $ who | grep root

    root console Sep 12 22:16

    ```


    It can also be used to count the number of files in a directory connecting the
    ls and we commands. This shows that there are eleven files in the current directory:'
  merge: -1
  pgno: 35
- img_proc: true
  md: '# Chapter 2: Korn Shell Basics


    ```

    $ ls | wc -u

    11

    ```


    You can also have multiple pipes to connect a series of commands together. The
    name of each unique user that is logged on is displayed using this command:


    ```

    $ who | cut -f1 -d'' '' | sort -u

    atole root

    ```


    You could even add another pipe to give you just the count of unique users:


    ```

    $ who | cut -f1 -d'' '' | sort -u | wc -l

    3

    ```


    # Conditional Execution


    The Korn shell provides the && and || operators for simple conditional execution.
    First you need to know that when programs finish executing, they return an exit
    status that indicates they ran successfully or not. A zero exit status usually
    indicates that a program executed successfully, while a non-zero exit status usually
    indicates that an error occurred.


    If two commands are separated with &&, the second command is only executed if
    the first command returns a zero exit status. Here, the echo command is executed,
    because ls ran successfully:


    ```

    $ ls temp && echo "File temp exists"

    temp

    File temp exists

    ```


    Now, file temp is removed and the same command is run again:'
  merge: -1
  pgno: 36
- img_proc: true
  md: '# Korn Shell User and Programming Manual


    ```

    $ rm temp

    $ ls temp && echo "File temp exists"

    ls: temp: No such file or directory

    ```


    If two commands are separated by ||, the second command is only executed if the
    first command returns a non-zero exit status. In this case, the echo command is
    executed, because ls returned an error:


    ```

    $ ls temp || echo "File temp does NOT exist"

    ls: temp: No such file or directory

    File temp does NOT exist

    ```


    Remember that basic conditional execution using these operators only works with
    two commands. Appending more commands to the same command-line using ; does not
    cause these to also be conditionally executed. Here, the touch temp command is
    executed, regardless if ls temp failed or not. Only the echo command is conditionally
    executed:


    ```

    $ ls temp || echo "File temp does NOT exist"; \

    touch temp

    ls: temp: No such file or directory

    File temp does NOT exist

    ```


    The next section talks about how you can conditionally execute more than one command
    by using {} or (). As you can see, the && and || operators can come in handy.
    There are certainly many situations where they can be more efficient to use the
    if command.


    There is one more type of logic you can perform using these operators. You can
    implement a simple if command using the && and || operators together like this:


    ```

    command1 && command2 || command3

    ```


    If command1 returns true, then command2 is executed, which causes command3 to
    not be executed true, then command2 is not executed, which causes command3 to
    be executed.'
