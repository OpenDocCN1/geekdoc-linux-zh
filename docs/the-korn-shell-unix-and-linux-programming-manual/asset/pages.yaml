  md: '# Chapter 8: Writing Korn Shell Scripts


    # Miscellaneous Programming Features


    The next sections cover some miscellaneous programming features.


    # The . Command


    The . command reads in a complete file, then executes the commands in it as if
    they were typed at the prompt. This is done in the current shell, so any variable,
    alias, or function settings stay in effect. It is typically used to read in and
    execute a profile, environment, alias, or functions file. Here the .profile file
    is read in and executed:


    ```

    $ . .profile

    ```


    The following example illustrates the difference between executing files as Korn
    shell scripts and reading/executing them using the .command. The .test file sets
    the variable X:


    ```

    $ cat .test

    X=ABC

    ```


    When the .test file is executed as a Korn shell script, variable X is not defined
    in the current environment, because scripts are run in a subshell:


    ```

    $ ksh .test

    $ print $X

    $

    ```


    After the .test file is read in and executed using the .command, notice that the
    variable X is still defined:


    ```

    $ . .test

    ```'
