  md: '# Korn Shell User and Programming Manual


    Arithmetic expressions are made up of constants, variables or any of the arithmetic
    operators in Table 6.1.


    # The ((...)) Command


    The ((...)) command is equivalent to the let command, except that all characters
    between the (( and )) are treated as quoted arithmetic expressions. This is more
    convenient to use than let, because many of the arithmetic operators have special
    meaning to the Korn shell. The following commands are equivalent:


    ```

    $ let "X=X + 1"

    and

    $ ((X=X + 1))

    ```


    Before the Korn shell let and ((...)) commands, the only way to perform arithmetic
    was with expr. For example, to do the same increment X operation using expr:


    ```

    $ X=`expr $X + 1~

    ```


    In tests on a few systems, the let command performed the same operation 35-60
    times faster! That is quite a difference.


    # Declaring Integer Variables


    As with ordinary variables, integer variables need not be declared. A variable
    can simply be given an integer value, and then used in an arithmetic expression.'
