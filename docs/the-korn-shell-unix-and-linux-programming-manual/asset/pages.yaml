  md: "# Chapter 8: Writing Korn Shell Scripts\n\n```\ncommands\n...\nelif commandn\n\
    then\n  commands\nelse\n  commands\nfi\n```\n\nIf command1 returns a zero exit\
    \ status, or command2 returns a zero exit status, or command3 returns a zero exit\
    \ status, then execute the commands corresponding to the if/elif that returned\
    \ a zero exit status. Otherwise, if all the if/elif commands return a non-zero\
    \ exit status, execute the commands between else and fi. This if format is much\
    \ easier to explain with an example. The following Korn shell script checks how\
    \ many users are logged on, and prints the appropriate message:\n\n```\ncat whonu\n\
    USERS=$(who | wc -1)\nif ((USERS == 1))\nthen\n  print \"There is 1 user logged\
    \ on.\"\nelif ((USERS == 2))\nthen\n  print \"There are 2 users logged on.\"\n\
    elif ((USERS == 3))\nthen\n  print \"There are 3 users logged on.\"\nelse\n  print\
    \ \"More than 4 users are logged on.\"\nfi\n```"
  merge: -1
