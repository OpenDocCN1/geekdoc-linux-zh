  md: '# Korn Shell User and Programming Manual


    # Files


    $HOME/.profile contains local environment settings, such as the search path, execution
    options, local variables, aliases, and more. At login time, it is read in and
    executed after the /etc/profile file.


    $HOME/.sh_history contains previously executed commands


    $ENV contains the name of the file that has aliases, function, options, variables,
    and other environment settings that are to be available to subshells


    # Example Commands


    ```

    # Execute multiple commands on one line

    $ pwd ; ls tmp ; print "Hello world"

    # Run the find command in the background

    $ find . -name tmp.out -print &

    ```


    ```

    # Connect the output of who to grep

    $ who | grep fred

    # Talk to fred if he is logged on

    $ { who | grep fred } && talk fred

    # Send ls output to ls.out, even if noclobber is set

    $ ls | ls.out

    ```


    ```

    # Append output of ls to ls.out

    $ ls >> ls.out

    # Send invite.txt to dick, jane, and spot

    $ mail dick jane spot < invite.txt

    # List file names that begin with z

    $ ls z*

    ```


    ```

    # List two, three, and four character file names

    $ ls ?? ??? ????

    ```'
