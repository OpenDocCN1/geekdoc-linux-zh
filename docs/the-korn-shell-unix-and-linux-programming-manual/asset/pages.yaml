  md: '# Korn Shell User and Programming Manual


    # The newgrp Command


    The **newgrp** command changes the group id and is equivalent to ''exec /bin/newgrp
    group''. In this example, the group id is changed from **users to networks:**


    ```

    $ id

    uid=100 (anatole) gid=101 (users)

    $ newgrp networks

    uid=100 (anatole) gid=12 (networks)

    ```


    Without arguments, **newgrp** resets the group-id to the default:


    ```

    $ newgrp

    uid=100 (anatole) gid=101 (users)

    ```


    # The pwd Command


    The **pwd** command prints the current working directory. It is a Korn shell built-in
    command and is equivalent to the **print -r - SPWD** command.


    # The readonly Command


    The **readonly** command sets the value and/or **readonly** attribute of variables.
    It is equivalent to the **typeset -r** command, except when used within a function,
    a local variable is not created. This command sets **X** to readonly and assigns
    it a value of **1:**


    256'
