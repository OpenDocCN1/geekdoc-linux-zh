  md: "# Chapter 8: Writing Korn Shell Scripts\n\nIt can save quite a bit of code,\
    \ and it's easier to maintain. One more thing: because functions need to be read\
    \ in before they can be invoked, it's a good idea to put all function definitions\
    \ at the top of Korn shell scripts.\n\n# Function Variables\n\nAll function variables,\
    \ except those explicitly declared locally within the function with the typeset\
    \ command, are inherited and shared by the calling Korn shell script. In this\
    \ example, the X, Y, and Z variables are set within and outside of the function\
    \ f:\n\n```\n$ cat ftest\nX=1\nfunction f {\n  Y=2\n  typeset Z=4\n  print \"\
    In function f, X=$X, Y=$Y, Z=$Z\"\n  X=3\n}\nprint \"Outside function f, X=$X,\
    \ Y=$Y, Z=$Z\"\n```\n\nNotice that when executed, all the variable values are\
    \ shared between the function and calling script, except for variable Z, because\
    \ it is explicitly set to a local function variable using the typeset command.\
    \ The value is not passed back to the calling Korn shell script:\n\n```\n$ ftest\n\
    In function f, X=1, Y=2, Z=4\nOutside function f, X=3, Y=2, Z=\n```\n\nThe current\
    \ working directory, aliases, functions, traps, and open files from the invoking\
    \ script or current environment are also shared with functions."
