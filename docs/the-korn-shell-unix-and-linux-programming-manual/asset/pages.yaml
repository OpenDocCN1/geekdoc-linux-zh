  md: '# Korn Shell User and Programming Manual


    # Terminal Requirements


    The in-line editor and command re-entry features require that the terminal accepts
    <Return> as carriage return without line-feed, and the space character to overwrite
    the current character on the screen and move right. Some terminals may require
    special settings. For more information, see Appendix E.


    # Command History File


    The Korn shell stores the commands that you enter at your terminal in a file,
    called the command history file. This file is specified by the HISTFILE variable.
    If not set, the default is HOME/.sh_history.


    The number of commands accessible via the command history file is specified by
    the HISTSIZE variable. If not set, the last 128 commands are saved, starting from
    your most recent command. The command history file operates on a first-in, last-out
    basis, so that as new commands are entered, the oldest commands are not accessible.


    There are two ways to access the command history file: using the fc command, or
    the in-line editor. These are discussed in the following sections.


    # The fc Command


    The fc command allows you to list, or edit and re-execute history file commands.
    It is the simplest interface to the command history file provided with the Korn
    shell. The fc command also allows you to manipulate the history file using your
    own choice of editors.'
  merge: -1
  pgno: 111
- img_proc: true
  md: '# # Chapter 4: Editing Commands


    #  Displaying the Command History File


    The command history file can be displayed using the fc command in a number of
    ways: with or without command numbers, using a range of line numbers, in reverse
    order, and more. The format for displaying the command history with the fc -l
    command is:


    ```

    fc -[nr] [ range ]

    ```


    where the -n option causes the command numbers to not be displayed, and the -r
    option specifies reverse order (latest commands first). The range of commands
    to list is given as:


    +   - n1 [n2] display list from command n1 to command n2. If n2 is not specified,
    display all the commands from current command back to command n1.

    - count display the last count commands

    - string display all the previous commands back to the command that matches string


    If no range argument is given, the last sixteen commands are listed. Let''s look
    at the last five commands:


    ```

    $ fc -l -5 set

    250 vi /etc/env

    251 . /etc/env

    252 set

    253 alias

    254 functions

    ```


    The history command is equivalent to fc -l. It is much easier to remember than
    fc -l, especially for C shell users. The last command could also be given like
    this. Notice that the order is reversed.'
