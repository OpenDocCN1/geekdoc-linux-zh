    If an invalid trap is set, an error is generated.


    # Ignoring Signals


    The trap command can be used to ignore signals by specifying null as the command
    argument:


    > trap " signals


    This could be used to make all or part of a Korn shell script uninterruptible
    using normal interrupt keys like Ctl-c. This trap command causes signals 2 and
    3 to be ignored:


    ```

