  md: "# Chapter 8: Writing Korn Shell Scripts\n\n# The if Command\n\nThe if command\
    \ is used to execute commands if a given condition if true. The basic syntax of\
    \ the if command is:\n\n```\nif command1\nthen\n    commands\nfi\n```\n\nIf command1\
    \ returns a zero exit status, then the commands between then and fi are executed.\
    \ Otherwise, the commands are skipped. For example, if ANSWER is set to YES, then\
    \ the print command is executed.\n\n```\nif [[ $ANSWER = YES ]]\nthen\n    print\
    \ \"Ok, the answer is $ANSWER\"\nfi\n```\n\nHere is a Korn shell script that uses\
    \ the if command to check if a file exists, before trying to copy it.\n\n```\n\
    $ cat fileck\nFILE=$1\nif [ -f $FILE ];\nthen\n    print \"Copying $FILE to PUBDIR\"\
    \ncp $FILE /usr/spool/uucppublic\nfi\n```\n\nWe could add another if command to\
    \ check the number of arguments. If there is less than one command-line argument,\
    \ a usage message is printed and the script exits."
  merge: -1
  pgno: 210
- img_proc: true
  md: "# Korn Shell User and Programming Manual\n\n```\n$ cat fileck\nif (($# < 1))\n\
