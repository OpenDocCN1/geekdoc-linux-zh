    In-Line Editor


    One of the major features of the Korn shell is the ability to manipulate current
    and previous commands using the built-in editors and the fc command.


    If you make a mistake on the current command line, instead of having to backspace
    to fix it, or killing the entire line and starting over, you can use the in-line
    editor to make the correction much more quickly and efficiently.


    If you want to re-execute a command, instead of having to type it in all over
    again, you can use the command re-entry feature to call it back up. You can even
    make changes to it before re-executing!'
