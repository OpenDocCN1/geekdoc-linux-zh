  md: '# Chapter 1: Introduction


    Mortice Kern Systems sells a version of the Korn shell for MS-DOS and Windows.
    There are also a number of shareware shells that have Korn shell-like functionality.


    # Which Version Do You Have?


    To determine which version of the Korn shell you are using, run the following
    command:


    ```

    $ print ${.sh.version}

    Version 1993-12-28 i

    ```


    If you don''t get a version back from this command, then you are probably using
    an older version of the Korn shell. Try running the what command on the Korn shell
    binary (usually located in/bin/ksh):


    ```

    $ what /bin/ksh

    Version 12/28/93

    ```


    # Logging In


    A number of things happen before you see the login: prompt on your terminal. After
    you enter the login name, the login program is started. It finishes the process
    of logging you in by prompting for a password, checking the /etc/passwd file,
    and finally starting up your login shell. Your login shell is specified in the
    /etc/passwd file like this:


    ```

    larissa*:101:102::home/larissa:/bin/sh

    renata*:102:101::home/renata:/bin/ksh

    ```


    For larissa, the login shell is /bin/sh, while for renata it is /bin/ksh.'
  merge: -1
  pgno: 28
- img_proc: true
  md: '# Korn Shell User and Programming Manual


    # Changing the Login Shell


    To make the Korn shell your default login shell. have your system administrator
    change it to /bin/ksh or the pathname of wherever the Korn shell binary is located,
    or run the chsh command (if available on your system). Until that is done, you
    can still run the Korn shell by simply invoking:


    ```

    $ ksh

    ```


    This will give you a Korn subshell. To get back to your login shell, press Ctrl-d
    (Control-d). If you get an error message complaining about ksh not being found,
    you can try to find it by executing:


    ```

    $ find /name ksh -print

    /usr/local/bin/ksh

    ```


    Once you''ve found it, add the directory in which it was found to your PATH variable.
    If you''re using the Bourne shell, it would be done like this:


    ```

    $ PATH=$PATH:/usr/local/bin

    $ export PATH

    $ ksh

    ```


    while for the C shell:


    ```

    % set path=($path /usr/local/bin)

    % ksh

    ```


    You could also invoke the Korn shell with the full pathname:


    ```

    $usr/local/bin/ksh

    ```


    More about the PATH variable is explained later in Chapter 7.'
  merge: -1
  pgno: 29
- img_proc: true
  md: '# Chapter 1: Introduction


    # Invoking The Korn Shell Separately


    If you would like to use the Korn shell, but keep your login shell the same, you
    can avoid conflicts between the two shells by putting all of your Korn shell environment
    and startup commands in the environment file. This is specified by the ENV variable,
    which could be set in your Bourne shell .profile file like this:


    ```

    $ grep ENV $HOME/.profile

    ENV=$HOME/.kshrc

    ```


    or in the C shell .login file:


    ```

    $ grep ENV $HOME/.login

    setenv ENV $HOME/.kshrc

    ```


    This way, when you invoke the Korn shell, it will know where to look and find
    the environment settings. Here are some basic commands that should be in the environment
    file:


    ```

    $ cat $HOME/.kshrc

    SHELL=/usr/local/bin/ksh

    EDITOR=vi

    export SHELL EDITOR

    ```


    The EDITOR variable specifies the editor to use for command-line editing. Here
    it is set to vi, but it can also be set to emacs or gmacs. This will be covered
    in detail later in Chapter 7.'
  merge: -1
  pgno: 30
- img_proc: true
  md: '# Korn Shell User and Programming Manual


    # Using The Korn Shell in Scripts


    For those experienced users that are ready to dive into writing some Korn shell
    scripts, but do not have their login shells configured for the Korn shell, make
    sure to add this to the top of your Korn shell script to make sure that it is
    executed by the Korn shell:


    ```

    #!/bin/ksh

    ```


    Use the full pathname of **ksh** if it is not located in /bin.'
