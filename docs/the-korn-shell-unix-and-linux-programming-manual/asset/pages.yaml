    # Redirecting Standard Error


    Most Unix commands write their error messages to standard error. As with standard
    output, standard error is by default directed to your terminal, but it can be
    redirected using the standard error descriptor (2) and the > operator. For example,
    the ls command displays a message on standard error when you attempt to display
    information about a non-existent file:


    ```

    $ ls tmp

    tmp not found

    ```


    Now, if you do an ls on an existent and non-existent file on the same command-line,
    a message about the non-existent file goes to standard error, while the output
    for the existing file goes to standard output:


    ```

    $ ls tmp t.out

    tmp not found

    t.out

    ```


    By using the > operator, the standard error of the same command is redirected
    to ls.out. The standard output is still displayed directly to your terminal:


    ```

    $ ls tmp t.out 2>ls.out

    t.out

    $ cat ls.out

    tmp not found

    ```


