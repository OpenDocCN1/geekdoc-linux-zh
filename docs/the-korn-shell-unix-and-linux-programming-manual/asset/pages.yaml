  md: "# Korn Shell User and Programming Manual\n\n```\n$ print $X\nABC\n```\n\nThe\
    \ standard search path, PATH, is checked if the file is not in the current directory.\n\
    \n# Functions\n\nFunctions are a form of commands like aliases, scripts, and programs.\
    \ They differ from Korn shell scripts, in that they do not have to be read from\
    \ the disk each time they are referenced, so they execute faster. Functions differ\
    \ from aliases, in that functions can take arguments. They provide a way to organize\
    \ scripts into routines in the same way as in other high-level programming languages.\
    \ Since functions can have local variables, recursion is possible. Functions are\
    \ most efficient for commands with arguments that are invoked fairly often, and\
    \ are defined with the following format:\n\n```\nfunction name {\n  commands\n\
