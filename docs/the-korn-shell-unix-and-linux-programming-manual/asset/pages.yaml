    The trap command is used to execute commands when the specified signals are received.


    > trap commands


    Trap commands are useful in controlling side effects from Korn shell scripts.
    For example, if you have a script that creates a number of temporary files, and
    you hit the <Break> or <Delete> key in the middle of execution, you may inadvertently
    leave the temporary files. By setting a trap command, the temporary files can
    be cleaned up on'
