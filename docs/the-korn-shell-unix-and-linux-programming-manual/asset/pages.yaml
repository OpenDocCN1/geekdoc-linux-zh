  md: '# Chapter 2: Korn Shell Basics


    | Table 2.1: Command Execution Format |

    | --- |

    | command1 ; command2 | execute command1 followed by command2 |

    | command & | execute command asynchronously in the background; do not wait for
    completion |

    | command1 | command2 | pass the standard output of command1 to standard input
    of command2 |

    | command1 && command2 | execute command2 if command1 returns zero (successful)
    exit status |

    | command1 || command2 | execute command2 if command1 returns non-zero (unsuccessful)
    exit status |

    | command & | | execute command asynchronously with its standard input and standard
    output attached to the parent shell; use read - p/print -p to manipulate the standard
    input/output (see Chapter 8) |

    | command \ { command ; } | continue command onto the next line |

    | (command) | execute command in the current shell execute command in a subshell
    |'
