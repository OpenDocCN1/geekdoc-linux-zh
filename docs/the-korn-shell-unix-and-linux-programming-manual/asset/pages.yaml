    Commands can be chained together using the | token to form pipelines, in which
    the standard output of each command but the last is piped to the standard input
    of the following command. The exit status of a pipeline is that of its last command.
    A pipeline may be prefixed by the ! reserved word which causes the exit status
    of the pipeline to be logically complemented: if the original status was 0 the
    complemented status will be 1, and if the original status was not 0, then the
