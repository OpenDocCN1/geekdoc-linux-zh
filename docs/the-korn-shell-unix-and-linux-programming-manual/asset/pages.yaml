  md: '# Chapter 5: Job Control


    # Killing Jobs


    Stopped or background jobs are terminated with the kill command. Unlike bg or
    fg, a job argument must be given. Here, a sleep command is put in the background,
    then killed:


    ```

    $ sleep 100 &

    [1] 254

    $ kill %1

    ```


    It could also be given as kill 254.


    # Waiting for Jobs


    You can make the Korn shell wait for some or all background jobs to complete with
    the wait command. If no argument is given, the Korn shell waits for all background
    jobs to complete.


    # Background Jobs and I/O


    Jobs being executed in the background will stop if they attempt to read input
    from your terminal. If you tried to interactively remove SPUBDIR/junk in the background,
    this is what would happen:


    ```

    $ rm -i $PUBDIR/junk &

    [2] +Stopped (tty input) rm -i $PUBDIR/junk &

    ```'
  merge: -1
  pgno: 132
- img_proc: true
  md: '# Korn Shell User and Programming Manual


    The job is stopped because it needs to prompt you for input. The rm

    -i job is brought back into the foreground with the fg command and its

    prompt is displayed:


    ```

    $ fg %2

    rm -i $PUBDIR/uucpublic/junk

    rm: remove /usr/spool/uucpublic/junk? y

    ```


    By default, jobs send their output to your terminal, even while running

    in the background. Here, the find command sends its output to the

    terminal, even though it is running in the background:


    ```

    $ find / -name core -print &\n[2] 1453

    $ /usr/lbin/core

    /home/anatole/bin/core

    ```


    That can be annoying, especially if you are in the middle of something

    else. To avoid this problem, redirect the output of background jobs to

    a file. Make sure to be careful with the redirection. If you don''t

    irect standard error, error messages will go to your terminal and

    not to the output file. Let''s kill the find job, then restart and start the

    output to c.out:


    ```

    $ kill %2

    [2]+ Terminated find /-name core -print>c.out &

    $ find / -name core -print >c.out &

    [2] 1453

    $ jobs

    [2] - Runningfind / -name core -print &

    [1] Runningsleep 1000 &

    ```


    We can work on something else until we get the completion message.


    ```

    [2] +Done find /-name core -print>c.out &

    ```'
