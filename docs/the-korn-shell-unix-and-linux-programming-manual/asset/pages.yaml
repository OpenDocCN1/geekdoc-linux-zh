    # Arithmetic Evaluation


    The shell performs arithmetic evaluation for arithmetic substitution, to evaluate
    an arithmetic command, to evaluate an indexed array subscript, and to evaluate
    arguments to the builtin commands shift and let. Evaluations are performed using
    double precision floating point arithmetic. Floating point constants follow ANSI-C
    programming language conventions. Integer constants are of the form [base#] where
    base is a decimal number between two and sixty-four representing the arithmetic
    base and n is a number in that base. The digits above 9 are represented by the
    lower case letters, the upper case letters.@ and _ respectively. For bases less
    than 36, upper and lower case characters can be used interchangeably. If base
    is omitted, then base 10 is used.


    An arithmetic expression uses the same syntax, precedence, and associativity of
    expression as the C language. All C language operators that apply to floating
    point quantities can be used. In addition, when the value of an arithmetic variable
    or sub-expression can be represented as a long integer, all C language integer
    arithmetic operations can be performed. Variables can be referenced by name within
    an arithmetic expression without using the parameter expansion syntax. When a
    variable is referenced, its value is evaluated as an arithmetic expression.'
