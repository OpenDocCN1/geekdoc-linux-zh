- img_proc: true
  md: '# # Chapter 2: Korn Shell Basics


    Confusing, right? Let''s look at a real example to make sense out of this. Here,
    if the file `temp` exists, then one message is displayed, and if it doesn''t exist,
    the another message is displayed:


    ```

    $ touch temp

    ls temp && echo "File temp exists" || echo \

    File temp does NOT exist

    temp

    File temp exists

    ```


    Now we remove file `temp` and run the same command:


    ```

    $ rm temp

    ls temp && echo "File temp exists" || echo \

    "File temp does NOT exist"

    ls: temp: No such file or directory

    File temp does NOT exist

    ```


    Although compact, this format may not be considered readable as the `if` command.
    We look at comparing the `&&` and `||` operators to the `if` command later in
    Chapter 8.


    # # Grouping Commands


    Multiple commands can be grouped together using `{}` or `()`. Commands enclosed
    in `{}` are executed in the current shell. This is useful for you want to combine
    the output from multiple commands. Here is file `temp`:


    ```

    $ cat temp

    The rain in Spain

    falls mainly on the plain

    ```


    Let''s say we want to add a header to the output, then line-number the whole thing
    with the `nl` command (or `pr -n` if you don''t have `nl`). We could try it like
    this:'
  merge: -1
  pgno: 38
- img_proc: true
  md: '# Korn Shell User and Programming Manual


    ```

    $ echo "This is file temp:"; cat temp | nl

    This is file temp:

    1 The rain in Spain

    2 falls mainly on the plain

    ```


    Only the output from cat temp was line numbered. By using {}''s, the output from
    both commands is line numbered:


    ```

    $ echo "This is file temp:"; cat temp ; } | nl

    1 This is file temp:

    2 The rain in Spain

    3 falls mainly on the plain

    ```


    There must be whitespace after the opening {, or else you get a syntax error.
    One restriction: commands within the {}''s must be terminated with a semi-colon
    when given on one line. This keeps commands separated so the Korn Shell knows
    where one command ends, and another one begins.


    This means commands can be grouped within {}''s even separated with newlines like
    this:


    ```

    $ { pwd; echo "First line"

    > echo "Last line"

    >

    /usr/spool/snail

    First line

    Last line

    ```


    Another use for this feature is in conjunction with the && and || operators to
    allow multiple commands to be conditionally executed. This is similar to the example
    from the previous section. What we want this command to do is check if file temp
    exists, and if it does, display a message, then remove it. Unfortunately, the
    way it is written, rm temp is executed regardless of whether it exists or not.


    ```

    $ rm temp

    $ ls temp && echo "temp exists.removing";rm temp

    ls: temp: No such file or directory

    rm: temp: No such file or directory

    ```'
