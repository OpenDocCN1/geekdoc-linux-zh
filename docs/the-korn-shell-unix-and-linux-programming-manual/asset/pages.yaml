  md: '# Chapter 7: The Environment


    # Aliases


    Aliases are command name macros used as shorthand for other commands, especially
    frequently used ones. This saves a lot of typing time. Aliases are defined with
    the **alias name=value** command. For example, we could create an alias for the
    **print** command like this:


    ```

    $ alias p=print

    ```


    Whenever **p** is invoked, **print** is executed:


    ```

    $ p Hello

    Hello

    ```


    Make sure to enclose the value in quotes if it contains whitespace. Here we create
    an alias **l** that is set to the **ls -Fac** command:


    ```

    $ alias l="*ls -Fac"

    ```


    Now when you type in **l**, **ls -Fac** is executed:


    ```

    $ 1

    ..

    compress.Z*

    func.Z*

    test/

    uncompress.Z*

    ..

    ```


    Alias values can contain any text, including special characters, like wildcards,
    pipes, or I/O redirection operators. Let''s change alias **l** so that the output
    is piped to the **more** command:


    ```

    $ alias l="*ls -Fac | more"

    ```


    But what if you wanted to make this a global alias by setting it in the'
  merge: -1
  pgno: 172
- img_proc: true
  md: '# Korn Shell User and Programming Manual


    /etc/profile file, and some people wanted to use more, while others wanted to
    use pg? We could add the PAGER variable to the l alias, and let each user set
    PAGER to whatever they wanted.


    ```

    $ alias l=''ls -Fac | ${PAGER:-/bin/pg}''

    ```


    Notice that if PAGER is not set, the default /bin/pg will be used. One last point.
    Using double quotes causes alias values to be expanded only when the alias is
    set. This means that if we reset PAGER l is defined, it would have no effect on
    the alias. To have the alias value expanded each time it is invoked, use single
    quotes like this:


    ```

    $ alias l=''ls -Fac | ${PAGER:-/bin/pg}''

    ```


    Now whenever PAGER is redefined, the next time alias l is invoked, it uses the
    new value.


    If an alias value ends with a blank, then the next word following the alias is
    also checked if it is an alias. Here we set two aliases: p and h. When invoked,
    we get h instead of Hello.


    ```

    $ alias p=''print'' h=Hello

    $ p h

    Hello

    ```


    After the p alias is reset with a trailing blank, h gets substituted in the next
    command correctly:


    ```

    $ alias p=''print '' h=Hello

    $ p h

    Hello

    ```


