    # ## Directory Functions


    These Korn shell functions implement the C shell directory management commands:
    **dirs**, **popd**, and **pushd**. They can be put into a separate **cshfuncs**
    file and read in with the , command when necessary. Their basic functionality
    is:


    +   - **dirs** display directory stack

    - **popd** remove directory stack entry and **cd** to it

    - **pushd** add directory stack entry and **cd** to it


    269'
