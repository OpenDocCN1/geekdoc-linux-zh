  md: '# Chapter 9: Miscellaneous Commands


    # The export Command


    The **export** command sets and/or exports variables to the environment. It is
    equivalent to `typeset` -x, except when used within functions. Here, the PATH
    variable is set and exported:


    ```

    $ export PATH=$PATH:/usr/5bin

    ```


    Multiple variables can be given to the **export** command. In this example, the
    variables **A**, **B**, **C**, and **D** are set and/or exported:


    ```

    $ export A B=1 C D=2

    ```


    If no arguments are specified, the **export** command lists the names and values
    of exported variables:


    ```

    $ export

    EDITOR=vi

    HOME=/home/anatole

    LOGNAME=anatole

    PATH=/usr/bin:/usr/uc:/etc:/usr/5bin:

    PWD=/home/anatole/asp/pubs/ksh/v2

    SHELL=/bin/ksh

    TERM=sun

    USER=anatole

    ```


    # The false Command


    The **false** command returns a non-zero exit status. That''s all. It is often
    used to generate infinite **until** loops. In some versions of Korn shell, **false**
    is a preset alias **let 0**. In either case, it does the same thing.'
  merge: -1
  pgno: 278
