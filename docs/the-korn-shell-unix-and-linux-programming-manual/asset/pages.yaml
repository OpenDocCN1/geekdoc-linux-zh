  md: '# Chapter 3:

    Variables and Parameters


    Variables

    Special Parameters

    Variable Expansion

    Array Variables

    Compound Variables

    Quoting


    Variables and parameters are used by the Korn shell to store values. Like other
    high-level programming languages, the Korn shell supports data types and arrays.
    This is a major difference with the Bourne, C shell, and other scripting languages,
    which have no concept of data types.


    The Korn shell supports four data types: string, integer, float, and array. If
    a data type is not explicitly defined, the Korn shell will assume that the variable
    is a string.


    By default, all variables are global in scope. However, it is possible to declare
    a local variable within a function. This is discussed in more detail later in
    this chapter.'
  merge: -1
  pgno: 68
- img_proc: true
  md: '# Korn Shell User and Programming Manual


    # Variables


    Korn shell variable names can begin with an alphabetic (a–Z) or underscore character,
    followed by one or more alphanumeric (a–Z, 0–9) or underscore characters. Other
    variable names that contain only digits (0–9) or special characters (!, @, #,
    %, *,, $) are reserved for special parameters set directly by the Korn shell.


    To assign a value to a variable, you can simply name the variable and set it to
    a value. For example, assign abc to variable X:


    ```

    $ X=abc

    ```


    The types command can also be used to assign values, but unless you are setting
    attributes, it''s a lot more for nothing. If a value is not given, the variable
    X is reassigned the null value:


    ```

    $ X=

    ```


    This is not the same as being undefined. As we''ll see later, accessing the value
    of an undefined variable may return an error, while accessing the value of a null
    variable returns the null value.


    # Accessing Variable Values


    To access the value of a variable, precede the name with the $ character. There
    can be no space between $ and the variable name. In this example, CBIN is set
    to /usr/ccs/bin.


    ```

    $ CBIN=/usr/ccs/bin

    ```'
  merge: -1
