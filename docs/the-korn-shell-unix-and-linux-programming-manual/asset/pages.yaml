  md: '# Chapter 4: Editing Commands


    # Displaying Long Command Lines


    For lines longer than the window width, a mark is displayed at the end of the
    line to indicate the position. Only part of the command is displayed. The text
    position markers can be:


    +   - line extends to the right of the edit window

    - line extends to the left of the edit window

    - line extends to both sides of the edit window


    Moving around the command line makes different parts of the command line visible.
    If the cursor is moved past the last character, the line is redisplayed with the
    cursor in the middle of the screen. The COLUMNS variable setting, and the size
    of your command prompt also affect the width of the editing window.


    # Emacs/Gmacs Edit Modes


    Like the vi in-line editor, the emacs/gmacs in-line editor is also basically a
    subset of the same text editors. However, there are a few commands in the emacs/gmacs
    in-line editors that are not in the regular program.


    This only difference between the emacs and gmac editors is the way Ctl-t is handled.
    In emacs mode, Ctl-t transposes the current and next character. In gmac mode,
    Ctl-t transposes the previous two characters.


    Table 4.3 lists the basic commands available in emacs/gmacs edit mode. Appendix
    E contains a complete listing of the commands.'
