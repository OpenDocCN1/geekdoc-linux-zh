  md: '# Chapter 8: Writing Korn Shell Scripts


    # Discipline Functions


    Discipline functions are a new feature in KornShell 93. They are a special type
    of function used to manipulate variables. They are defined but not specifically
    called. Rather, they are called whenever the variable associated with the function
    is accessed.


    There are some specific rules as to how discipline functions are named and accessed.
    First of all, discipline functions are named using this syntax:


    name.function


    Notice the function has two parts separated with a dot. The first part corresponds
    to the name of a variable, and the second part must be get, set, or unset. These
    correspond to the following operations on the variable:


    +   - get whenever the base discipline variable is accessed

    - set whenever the base discipline variable is set

    - unset whenever the base discipline variable is unset


    For example, the discipline function LBIN.get, LBIN.set, LBIN.unset is called
    whenever the variable LBIN is accessed, set, or unset.


    All three discipline functions are optional, so not all need to be specified.


    Within a discipline function, the following special reserved variables can be
    used:


    +   - .sh.name name of current variable

    - .sh.value value of the current variable

    - .sh.subscript name of the subscript (if array variable)'
  merge: -1
  pgno: 256
