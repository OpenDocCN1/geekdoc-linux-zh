    # Functions


    Functions are a form of commands like aliases, and scripts. They differ from Korn
    shell scripts, in that they do not have to read from the disk each time they are
    referenced, so they execute faster. They also provide a way to organize scripts
    into routines, like in other high-level programming languages. Since functions
    can have local variables, recursion is possible. Functions are defined with the
    following format:


    ```

    function name { commands ; }

    ```


    Local function variables are declared with the typeset command within the function.'
