    \ one using the if command.\n\nUse this format if you want to give an if command\
    \ on one line:\n\n```\nif command1 ; then command2 ; fi\n```\n\nThe ; characters\
    \ are needed to separate then and fi from the previous commands.\n\n# Other if\
    \ Syntax: else\n\nThis form of the if command is used to execute one set of commands\
    \ if a condition is true, or another set of commands if the condition is not true."
