    abnormally (the name of the signal corresponding to the exit status can be obtained
    via the -l option of the -kill built-in utility).


    A pipeline is a sequence of one or more commands separated by |. The standard
    output of each command but the last is connected by a pipe(2) to the standard
    input of the next command. Each command, except possibly the last, is run as a
    separate process; the shell waits for the last command to terminate. The exit
    status of a pipeline is the exit status of the last command. Each pipeline can
    be preceded by the reserved word ! which causes the exit status of the pipeline
    to become 0 if the exit status of the last command is non-zero, and 1 if the exit
    status of the last command is 0.


    A list is a sequence of one or more pipelines separated by;, &, |, &&, & or ||;,
    and optionally terminated by;, &, or|. Of these five symbols;, & and | have equal
    precedence, which is lower than that of && ||. The symbols && and || also have
    equal precedence. A semicolon (;) causes execution of the preceding pipeline;
    an ampersand (&) causes asynchronous execution of the preceding pipeline (i.e.,
    the shell does not wait for that pipeline to finish). The symbol& causes asynchronous
    execution of the preceding pipeline with a two-way pipe established to the parent
    shell; the standard input and output of the spawned pipeline can be written to
    and read from the parent shell by applying the redirection operators <& and>&
    with arg p using-p built-in commands read and print described later. The symbol
    && (||) causes the list following it to be executed only if the preceding pipeline
    returns a zero (non-zero) value. One or more new-lines may appear in a list instead
    of a semicolon, to delimit a command.


    A command is either a simple-command or one of the following. Unless otherwise
    stated, the value returned by a command is that of the last simple-command executed
    in the command.'
