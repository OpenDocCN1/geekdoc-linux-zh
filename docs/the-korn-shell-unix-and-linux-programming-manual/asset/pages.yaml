  md: "# Chapter 8: Writing Korn Shell Scripts\n\n```\nif command1\nthen\n    commands\n\
    else\n    commands\nfi\n```\n\nIf command1 returns a zero exit status, then the\
    \ commands between then and else are executed. If command1 returns a non-zero\
    \ exit status, then commands between else and fi are executed. In this example,\
    \ if ANSWER is YES, then the print command is executed. Otherwise, it exits:\n\
    \n```\nif [[ $ANSWER = YES ]]\nthen\n    print \"Ok, the answer is $ANSWER\"\n\
    else\n    exit 1\nfi\n```\n\nWe could add the else part to the if command in fileck\
    \ to make sure the file existed before it was copied:\n\n```\n$ cat fileck\nif\
    \ (($# < 1))\nthen\n    print \"Usage: $0 file\"\n    exit 1\nfi\nFILE=$1\n\n\
    if [[ -f $FILE ]]\nthen\n    print \"Copying $FILE to PUBDIR\"\n    cp $FILE /usr/spool/uucpublic\n\
    else\n    print \"$FILE non-existent\"\n    exit 2\nfi\n```"
