  md: '# Korn Shell User and Programming Manual


    # The noclobber Option


    To prevent redirecting output to an existing file, set the noclobber option. By
    default, this feature is usually disabled, but can be enabled with the set -o
    noclobber command:


    ```

    $ ls > file.out

    $ set -o noclobber

    ```


    Now when we try to redirect output to file.out, an error message is returned:


    ```

    $ ls > file.out

    /bin/ksh: file.out: file already exists

    ```


    The > operator is used to force overwriting of a file, even if the noclobber option
