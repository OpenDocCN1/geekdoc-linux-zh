  md: '# Korn Shell User and Programming Manual


    It can also be used to "manually" reset positional parameters. For example:


    ```

    $ set X Y Z

    ```


    would set $1 to X, $2 to Y, $3 to Z, and $# to 3:


    ```

    $ print $1 $2 $3 $$\nX Y Z 3

    ```


    The positional parameters $@ and $* would be set X Y Z:


    ```

    $ print *$

    X Y Z

    $ print @

    X Y Z

    ```


    The $* and $@ parameters are basically the same, except for the way they are expanded
    when surrounded by double quotes. The positional parameters in $@ are interpreted
    as separate strings, while in $*, they are interpreted as a single string. Using
    $@, the wc command counts three separate strings


    ```

    $ print "$@" | wc -w

    3

    ```


    while with *, only one string is counted:


    ```

    $ print "$*" | wc -w

    1

    ```


    To manually set positional parameters that begin with the\-character, use the
    set - command.'
  merge: -1
