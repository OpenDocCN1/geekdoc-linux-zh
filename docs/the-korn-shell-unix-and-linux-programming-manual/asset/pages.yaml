  md: "# # Chapter 8: Writing Korn Shell Scripts\n\n```\n$ cat nloop\nfor i in 1 2\
    \ 3\ndo\n    for j in 0 5\n    do\n        print \"$i$j\"\n    done\ndone\n```\n\
    \nFor each outer loop, the inner loop is executed twice. So, the first inner loop\
    \ sets **j to 0**, and the second inner loop sets **j to 5**. This is repeated\
    \ for each outer loop. The output explains this much better.\n\n```\n$ nloop\n\
    10\n15\n20\n25\n30\n35\n```\n\n# # Breaking Out of Loops\n\nYou may want to exit\
    \ from a loop before the loop condition is satisfied. This is where the **break**\
    \ command comes in. It causes an exit from a loop-type command, but not from the\
    \ entire script. Once you **break** from a loop, execution continues with the\
    \ next command following the loop. For example, we could change the `listargs`\
    \ script so that if a character argument was not given, the **while** loop would\
    \ be terminated.\n\n```\n$ cat listargs\nwhile (($# != 0))\ndo\n    if [[ $1 =\
