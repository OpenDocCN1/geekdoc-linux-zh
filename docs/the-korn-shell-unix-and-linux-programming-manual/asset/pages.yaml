    # ## The read Command


    The **read** command is used to read input from a terminal or file. The basic
    format for the **read** command is:


    ```

    read variables

    ```


    where a line is read from standard input, so the first variable gets the first
    word, assigned to a corresponding variable, the second variable the second word,
    and so on. Here, **"This is output"** is read in to the variables **X**, **Y**,
    and **Z**. The first word of the input is **This**, so it is assigned to the first
    variable **X**. The second word is is, so it is assigned to the second variable
    **Y**. The third word is output, so it is assigned to **Z**.


    ```

    $ print "This is output" | read X Y Z

    $ print $X

    This

    $ print $Y

    isis

    $ print $Z

    output

    ```


    If there aren''t enough variables for all the words in the input, the last variable
    gets all the remaining words. This command is the same as the last one, except
    that an extra string "again" is given.


    ```

    $ print "This is output again " | read X Y Z

    $ print $X

    This

    $ print $Y

    is

    ```


    Because there are four strings, but only three variables, **Z** gets the remaining
    unassigned words:'
