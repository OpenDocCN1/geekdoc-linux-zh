    # CDPATH


    The CDPATH variable is provided to make directory navigation easier. It contains
    a list of colon-separated directories to check when a full pathname is not given
    to the cd command. Each directory in CDPATH is searched from left-to-right for
    a directory that matches the cd argument. A : alone in CDPATH stands for the current
    directory. This CDPATH:


    ```

    $ print $CDPATH

    :/home/anatolele:/usr/spool

