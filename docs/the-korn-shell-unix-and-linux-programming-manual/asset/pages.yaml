  md: "# Chapter 8: Writing Korn Shell Scripts\n\n# The while Command\n\nHere is another\
    \ type of looping command. The syntax for the while command is: \n\n```\nwhile\
    \ command1\ndo\n    commands\ndone\n```\n\nwhere command1 is executed, and if\
    \ the exit status is zero, the commands between do and done are executed. Command1\
    \ is executed again, and if the exit status is zero, the commands between do and\
    \ done are also executed again. This continues until command1 returns a non-zero\
    \ exit status. The listargs script loops on the command-line arguments. For each\
    \ loop, the positional parameter $1 is displayed, then the positional parameters\
    \ are shifted. This continues until the number of positional parameters is 0.\n\
    \n```\n$ cat listargs\nwhile (($# != 0))\ndo\n    print $1\n    shift\ndone\n\
    ```\n\nIn the first loop, $$ equals 4, the value of $1 is printed and the positional\
    \ parameters are shifted left once. In the second loop, $$ equals 3 and the loop\
    \ commands are executed again. This continues until the fourth loop, after the\
    \ print command, shift sets $$# to 0. Back at the top of the loop on the fifth\
    \ try, $$ is now 0, so the commands between do and done are skipped. Execution\
    \ continues with commands done."
  merge: -1
