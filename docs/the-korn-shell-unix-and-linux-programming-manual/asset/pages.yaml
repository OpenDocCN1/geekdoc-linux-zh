  md: '# # The Korn Shell

    Unix and Linux Programming

    Third Edition


    ANATOLE OLCZAK


    If you are a Unix or Linux Shell programmer, this book will provide you with the
    practical advice and technical tips you will need in order to become proficient
    in all aspects of the Korn Shell and enhance your programming skills. From basic
    introductory concepts through advanced programming techniques, you will learn
    how to:


    +   - Customize your Unix and Linux environments

    - Write and debug Korn Shell scripts

    - Fine-tune Korn Shell scripts for faster execution.


    Illustrated with expansive sample programs and easy-to-apply examples, plus complete
    ready-to-run scripts, this book will prove an indispensable guide and technical
    reference for the Korn Shell.


    +   - NEW! Chapter on Pdksh, the public domain Korn Shell for Linux

    - NEW! Appendices of Pdksh quick reference and Man Page

    - NEW! CD containing Pdksh source code and evaluation of U/WIN commands.


    The author

    Anatole Olczak has over 10 years'' experience programming and working with Unix
    operating systems. He founded the ASP consulting group and is now a Vice President
    for Connaissance Consulting.


    > "This is the best Korn Shell book I have seen. I presently have at least five
    different books on Shell programming in Unix. I was able to read this book cover
    as a reference ... I found this book to cover and able to be very complete."


    John A. Siegel

