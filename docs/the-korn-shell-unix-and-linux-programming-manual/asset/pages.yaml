  md: '# Appendix E: Korn Shell Man Page


    # Command Substitution


    The standard output from a command enclosed in parentheses preceded by a dollar
    sign ($()) or a pair of grave accents (``) may be used as part or all of a word;
    trailing new-lines are removed. In the (obsolete) form, the string between the
    quotes is processed for special quoting characters before the command is executed
    (see *Quoting* below). The command substitution `$(cat file)` can be replaced
    by the equivalent faster \`< file )`


    # Arithmetic Substitution


    An arithmetic expression enclosed in double parentheses preceded by a dollar sign
    ($(())) is replaced by the value of the arithmetic expression within the double
    parentheses.


    # Process Substitution


    This feature is only available on versions of the Unix operating system that support
    the /dev/fd directory for open files. Each command argument of the form `<list>`
    or `>(list)` will run process list asynchronously connected to the file in /dev/fd.
    The name of this file will become the argument to the command. If the form with
    > is selected writing on this file will provide input for list. If < is used,
    the file passed as an argument will contain the output of the list process. For
    example:


    ```

    paste <cut -f file1> <cut -f3 file2> | tee >(process1)>(process2)

    ```


    cuts 1 and 3 from the file1 and file2 respectively, pastes the results together,
    and sends it to the processes process1 and process2, as well as putting it onto
    the standard output. Note that the file, which is passed as an argument to the
    command, is a Unix system pipe(2) so programs that expect to lseek(2) on the file
    will not work.'
  merge: -1
