  md: '# Preface


    orn Shell 93: The Latest Version

    Acknowledgements

    Miscellaneous

    Conventions

    Source Code Listing


    The Korn Shell User and Programming Manual is designed to be a reference and learning
    tool for a range of users - from the novice with some experience to the pro who
    is familiar with both the Bourne and C shells. It contains complete technical
    information, as well as hands-on examples and complete programs to help guide
    you and illustrate all the features of the Korn Shell. This edition of the book
    has been updated to cover Korn Shell 93, the latest version of the Korn shell.
    This book also assumes that you are familiar with the basic Unix commands, and
    understand file system concepts. You should also be able to login to a system,
    and enter basic commands.


    If you are an experienced user, you may want to skip Chapter 1 and the first half
    of Chapter 2. The first seven chapters deal primarily with interactive use, while
    Chapter 8 and 9 cover the programming concepts.


    The goal of this book to teach you the Korn shell, and this is done by walking
    you through examples. So by the time you are finished reading the book, you''ll
    be comfortable with it, and writing your own Korn shell scripts.


    XVII'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# Korn Shell User and Programming Manual


    Don''t just read the book. The best way for you to learn about the Korn shell
    is to type in the examples yourself. Then do some experimentation on your own
    by modifying the examples or coming up with your own commands.


    Chapter 1 contains an overview of the major features in the Korn shell. It covers
    where to get it, how your login shell is configured, and setting up the Korn shell
    to co-exist with other shells while you are on the learning curve. It also includes
    brief descriptions of other related shells, including the Born Again shell (**bash**),
    Mortice Kern shell (**ksh**) for PC/Windows, and the public Korn shell (**pdksh**)
    for Linux.


    Chapter 2 covers the Korn shell basics: how commands can work together to do other
    things, and some basic shortcuts to improve productivity, and Korn shell I/O.
    You''ll be introduced to file name, command, and tide substitution: important
    concepts that are the basis of much of the Korn shell.


    Chapter 3 teaches you about Korn shell variables, variable attributes, and parameters.
    You''ll learn all the different types of variable expansion, including the substring
    features. Array variables and quoting are also discussed in detail.


    Chapter 4 discusses the Korn shell command history mechanism and emacs in-line
    editors. Here you will learn how to call up previous commands and manipulate them.


    Chapter 5 shows you how to manage and manipulate multiple processes using the
    job control mechanism, a feature almost directly copied from the C shell.


    In Chapter 6, you will learn how to perform arithmetic with the Korn shell. It
    contains sections on multi-base arithmetic, declaring integer-type variables,
    and random numbers, along with examples for each type of arithmetic operator.'
  merge: -1
  pgno: 19
- img_proc: true
  md: '# Preface


    Chapter 7 will show you how to set up your own customized environment: from setting
    up the prompt how you like it, to configuring your personal email. Korn shell
    options, environment variables, aliases, and the .profile file, and subshells
    are also covered.


    In Chapter 8, you are taught how to write programs using the many Korn commands
    and features. Executing and debugging scripts, input/output commands, positional
    parameters, flow control commands such as case, for, if, select, while, and until
    are also discussed. Step-by-step examples are included, and complete usable scripts
    are built from the bottom up. For those experienced programmers, important differences
    between the Korn and Bourne shells are discussed, and something else new to Unix
    programming - performance. You will learn a few tricks that can speed execution
    of your Korn shell scripts.


    Chapter 9 covers miscellaneous commands, such as readonly, ulimit, whence, and
    Korn shell functions.


    Appendix A and B include a sample ready-to-use profile and environment file.


    Appendix C contains the Korn shell versions of a number of C shell commands and
    functions.


    Appendix D contains the source code listing for a number of handy ready-to-run
    Korn shell scripts, including an interactive calendar program.


    Appendix E contains the Korn shell man pages.


    Appendix F contains information about pdksh, the public domain version of the
    Korn shell for Linux..


    Appendix G contains the Pdksh quick reference guide, and Appendix H contains the
    Pdksh man page.


    XIX'
