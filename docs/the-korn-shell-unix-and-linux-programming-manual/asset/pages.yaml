- img_proc: true
  md: "# Korn Shell User and Programming Manual\n\nIf USERS equals 1, 2, or 3, then\
    \ the corresponding if/elif..then clause is executed:\n\n```\n$ whonu\nThere are\
    \ 3 users logged on.\n```\n\nOtherwise, the else clause is executed:\n\n```\n\
    $ whonu\nMore than 4 users are logged on.\n```\n\n# if/elif vs case\n\nWhen there\
    \ are more than a few conditions to check, the case statement should be considered\
    \ instead of if/elif. Not only is it more readable, but less code is actually\
    \ needed. The whonu script could be written using a case statement needed like\
    \ this:\n\n```\nUSERS=$$(who | wc -l)\ncase $USERS in\n1 ) print \"There is 1\
    \ user logged on\"; ;\n2 ) print \"There are 2 users logged on\"; ;\n3 ) print\
    \ \"There are 3 users logged on\"; ;\n*) print \"There are 4 or more users \\\"\
    \n   logged on\"; ;\nesac\n```\n\nThe whonu script had thirteen lines of code\
    \ using if/elif/else, and only seven lines of code using a case statement."
