    # Debugging Korn Shell Scripts


    The Korn shell provides a number of options that are useful in debugging scripts:
    noexec, verbose, and xtrace. The noexec option causes commands to be read without
    being executed. It is used to check for syntax errors in Korn shell scripts. The
    verbose option causes the input to be displayed as it is read. The xtrace option
    causes the commands in a script to be displayed as they are executed. This is
    the most useful, general debugging option.


