    documentation for discrepancies.


    # The umask Command


    The umask command sets the file-creation mask using this format:


    ```

    umask mask

    ```


    where mask is an octal number or symbolic value that correspond to the permissions
    to be disabled. Here, the write and execute permissions for group and others are
    removed:


    ```

    $ umask 033

    $ touch tmp

    $ ls -1 tmp

    -rw-r---- 1 root 9 Sep 2 11:18 tmp

    ```


    262'
