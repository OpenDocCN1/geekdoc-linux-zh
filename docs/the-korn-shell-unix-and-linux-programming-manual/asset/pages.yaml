    # Debugging with trap


    The trap command can be helpful in debugging Korn shell scripts. The special signal
    arguments DEBUG and ERR are provided to execute trap commands after each command
    or only when commands in a script fail. This is discussed in the next section.


    # Trap Signal Precedence


    If multiple traps are set, the order of precedence is:


    +   - DEBUG

    - ERR

    - Signal Number

    - EXIT


    # Trapping Keyboard Signals


    The Korn shell traps KEYBD signals (sent when you type a character) and automatically
    assigns the following reserved variables:


    ```

    .sh.edchar contains last character of key sequence

    .sh.edtext contains current input line

    .sh.edmode contains NULL character (or escape character)

    ```'
