  md: "# Korn Shell User and Programming Manual\n\n# ## Scope and Availability\n\n\
    By default, functions are not available to subshells. This means that a regular\
    \ function that was read in your working environment, .profile file, or environment\
    \ file would not be available in a Korn shell script. To export a function, use\
    \ the typeset -fx function-command:\n\n```\ntypeset -fx function-name\n```\n\n\
    To make a function available across separate invocations of the Korn shell, include\
    \ the typeset -fx function-name command in the environment file.\n\n# ## Using\
    \ Functions in Korn Shell Scripts\n\nFunctions are very useful in Korn shell scripts.\
    \ Not only because you can organize scripts into routines, but they also provide\
    \ a way to consolidate redundant sequences of commands. For example, instead of\
    \ printing out an error message and exiting each time an error condition is encountered,\
    \ an all-purpose error function can be created. The arguments passed to it are\
    \ the message to display and the exit code:\n\n```\n$ cat error\nfunction error\
    \ {\n    print ${1:-\"unexplained error encountered\"}\n    exit ${2:-1}\n}\n\
    ```\n\nIf function error is called without arguments, then you get the default\
    \ error message \"unexplained error encountered\" and a default exit code of 1.\
    \ Now on a non-existent file error, function error could be called like this:\n\
    \n```\nerror \"$FILE:non-existent or not accessible\" 3\n```"
