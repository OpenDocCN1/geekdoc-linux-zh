    ```


    This also means that variable and command substitution does not take place within
    single quotes (because $ and `` lose their special meaning). If you want to access
    the value of a variable, use double quotes instead of single quotes (discussed
    in the next section). So, instead of displaying /home/anatole, we get $HOME:


    ```

    $ print ''$HOME''

    $HOME

    ```


    and instead of the date, we get `date`:


    ```

    $ print ''Today is `date`''

    Today is `date`

    ```


    Korn shell command substitution $(...) also doesn''t work in single quotes, because
    of the $ character. You may be thinking what good are single quotes anyway? Well,
    there are still some good uses for them. You could print a menu border like this:


