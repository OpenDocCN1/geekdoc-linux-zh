    # ## Parameter Expansion


    A parameter is a variable, one or more digits, or any of the characters *, @,
    #, ?, -, S, and ! . A variable is denoted by a *vname*. To create a variable *vname*
    contains a variable whose *vname* consists of everything before the last . must
    already exist. A variable has a value and zero or more attributes. Variables can
    be assigned values and attributes using the **typeset** special built-in command.
    The attributes supported by the shell are described later with the **typeset**
    special built-in command. Exported variables pass values and attributes to the
    environment.


    The shell supports both indexed and associative arrays. An element of an array
    variable is referenced by a *subscript*. A *subscript* for an indexed array is
    denoted by an arithmeticexpression (see *Arithmetic Evaluation* later in this
    appendix) between [ and ]. To assign values to an indexed array, using **set -A
    vname value . . . The value of all subscripts must be in the range of 0 through
    4095. Indexed arrays need not be declared. Any reference to a variable with a
    valid subscript is legal and an array will be created if necessary.


    An associative array is created with the -A option to **typeset**. A subscript
    for an associative array is denoted by a string enclosed between [ and ].


    Referencing any array without a subscript is equivalent to referencing the array
    with subscript 0.


    The value of a variable [ value ] may be assigned by writing:


    ```

    vname=value [ vname=value ] . . .

    or

    vname[subscript]=value [ vname[subscript]=value ] . . .

    ```


    Note that no space is allowed before or after the =.


