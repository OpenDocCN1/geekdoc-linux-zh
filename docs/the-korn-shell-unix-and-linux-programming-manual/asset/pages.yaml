  md: '# Korn Shell User and Programming Manual


    It can be checked by executing the set -o command. Let''s see if it is set:


    ```

    $ set -o | grep monitor

    monitor on

    ```


    If a command is run in the background, the Korn shell returns a job number and
    process id. Here, the find command is assigned job number 1 and process id 1435:


    ```

    $ find / -name core -exec rm -rf {} \; &

    [1] 1435

    ```


    The next command is assigned job number 2 and process id 1437:


    ```

    $ cpio -iBcdu < /dev/rmt0 &

    [2] 1437

    ```


    When background jobs are completed, a message is given before the next prompt
    is displayed. This is done so that other work is not interfered with. In this
    example, the ls command is put in the background. Although it finished before
    the sleep command, the completion message is not displayed until sleep is finished:


    ```

    $ ls -x > ls.out &\n[3] 1438

    $ sleep 30

    ls -x > ls.out &

    [3] + Done

    $

    ```'
