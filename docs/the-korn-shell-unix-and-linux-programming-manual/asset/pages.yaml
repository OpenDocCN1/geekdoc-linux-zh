    Any remaining arguments become positional parameters starting at 0.


    +   - If the -s option is present or if no arguments remain, then commands are
    read from the standard input. Shell output, except for the output of the special
    commands listed earlier in this appendix, is written to file descriptor 2.


    +   - If the -i option is present or if the shell input and output are attached
    to a terminal (as told by getattr(2)), then this shell is interactive. In this
