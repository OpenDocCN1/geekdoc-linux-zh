  md: "# Korn Shell User and Programming Manual\n\n# Display Files - kcat\n\nHere\
    \ is a simple Korn shell version of the Unix cat command. It is only 3-4 times\
    \ slower than the Unix version (on a 100-line file), because it uses the exec\
    \ command for the file I/O.\n\n```\n#!/bin/ksh\n#\n#   kcat - Korn shell version\
    \ of cat\n#\n\n# Check usage\nif (($# < 1));\nthen\n    print \"Usage: $0 file\
    \ ..\"\n    exit 1\nfi\n\n# Process each file\nwhile (($# > 0));\ndo\n    # Make\
    \ sure file exists\n    if [[ ! -f $1 ]]; ]\n    then\n        print \"$1: non-existent\
    \ or not accessible\"\n    else\n        # Open file for input\n        exec 0<$1\n\
    \        while read LINE\n        do\n            # Display output\n         \
    \   print $LINE\n        done\n    fi\n\n    # Get next file argument\n    shift\n\
    done\n```"
  merge: -1
  pgno: 301
- img_proc: true
  md: "# # Appendix D: Sample Korn Shell Scripts\n\n# ## Interactive uucp - kuucp\n\
    \nHere is an interactive version of the **uucp** command. Instead of looking for\
    \ a system name in the uucp systems file using **grep**, the remote system name\
    \ is verified by using file I/O substitution and Korn shell patterns.\n\n```\n\
    #!/bin/ksh\n#\n# kuucp - Korn shell interactive uucp\n#\n# Check usage\nif (($#\
    \ > 0));\nthen\n    print \"Usage: $0\"\n    exit 1\nfi\n\n# Set variables\nPUBDIR=${/usr/spool/uucpublic}\n\
    \n# This sets UUSYS to the contents of the HDB-UUCP\n# Systems file. It may be\
    \ different on your system.\nUUSYS=$</usr/lib/uucp/Systems)\n\n# Get source file\n\
    read SOURCE?\"Enter source file: \"\"\n\n# Check source file\nif [ ! -f $SOURCE\
    \ ];\nthen\n    print \"$SOURCE: non-existent or not accessible\"\n    exit 2\n\
    fi\n\n# Get remote system name\nread RSYS?\"Enter remote system name: \"\"\n\n\
    # Check remote system name. It looks for a pattern\n# match on the system name\
