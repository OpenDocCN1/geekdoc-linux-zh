  md: '# Korn Shell User and Programming Manual


    $ CA=ca


    What if we wanted to reset CA to california? It could be reset to the entire value,
    but to make to a point, let''s try using the current value like this:


    ```

    $ CA=$California

    $ print $CA

    ```


    Nothing is printed, because without the braces around the variable CA, the Korn
    shell looks for a variable named SCAlifornia. None is found, so nothing is substituted.
    With the braces around variable CA, we get the correct value:


    ```

    $ CA=${california}

    $ print $CA

    california

    ```


    Braces are also needed when attempting to expand positional parameters greater
    than 9. This ensures that both digits are interpreted as the positional parameter
    name.


