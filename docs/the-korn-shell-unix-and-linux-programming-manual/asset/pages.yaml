- img_proc: true
  md: "# Korn Shell User and Programming Manual\n\nThe **dirs** function lists the\
    \ current directory stack.\n\nWith no argument, the **popd** function removes\
    \ the top entry (previous working directory) from the directory stack and changes\
    \ directory to it. If a *+n* argument is given, the *nth* directory stack entry\
    \ (nth previous working directory) is removed.\n\nWith no argument, the **pushd**\
    \ function switches the two top entries (current and previous working directory)\
    \ and changes directory to the previous working directory. This is equivalent\
    \ to **cd -**. If a directory argument is given, **pushd** puts the directory\
    \ on the top of the directory stack and changes directory to it. If a *+n* argument\
    \ is given, **pushd** puts the *nth* directory stack entry (nth previous working\
    \ directory) on the top of the stack and changes directory to it.\n\n# # Sample\
    \ C Shell Directory Management Functions #\n\n```\n# Function fcd - verify accessibility\
    \ before changing\n# to target directory\nfunction fcd\n{\n    # Make sure directory\
    \ exists\n    if [[ ! -d $1 ]]\nn    then\n        print \"$1: No such file or\
    \ directory\"\n        return 1\n    else\n        # Make sure directory is searchable\n\
    \        if [[ ! -x $1 ]]\\n        then\n            print \"$1: Permission denied\"\
    \n            return 1\n    fi\n    # Otherwise change directory to it\n    cd\
    \ $1\n    return 0\n}\n```"
  merge: -1
  pgno: 293
- img_proc: true
  md: "# Appendix C: C Shell Functionality\n\n```\n# Function dirs - display directory\
    \ stack\nfunction dirs\n{\n    # Display current directory and directory stack\n\
    \    print \"$PWD ${DSTACK[*]}\"\n}\n```\n\n```\n# Function pushd - add entry\
    \ to directory stack\nfunction pushd\n{\n    # Set stack depth (number of stack\
    \ entries)\n    integer DEPTH=${#DSTACK[*]}\n    case $1 in\n        \"\" ) #\
    \ No argument - switch top 2 stack elements\n            if (( ${DSTACK[*]} <\
    \ 1 ))\n            then\n                print \"$0: Only one stack entry.\"\n\
    \                return 1\n            else\n                cd ${DSTACK[0]} ||\
    \ return\n                DSTACK[0]=$OLPWD\n                dirs\n           \
    \ fi\n    esac\n```\n\n```\n+@([1-9]*[0-9]) )\n    # Number argument 1-999* -\
    \ move entry to top\n    # of directory stack and cd to it\n    integer ENTRY=${#1+}\n\
    \    if (( ${DSTACK[*]} < $ENTRY ))\n    then\n        print \"$0: Directory stack\
    \ not that deep\"\n        return 1\n    else\n        cd ${DSTACK[ENTRY-1]} ||\
    \ return\n        DSTACK[ENTRY-1]=$OLPWD\n        dirs\n    fi\n```"
