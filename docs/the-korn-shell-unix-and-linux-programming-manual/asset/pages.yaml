    Besides executing commands and being a programming language, the Korn shell also
    provides a number of commands, variables, and options that allow you to customize
    your working environment.


    # ## After You Log In


    After you login, the Korn shell performs a number of actions before it displays
    the command prompt. Usually it first looks for /etc/profile. If it exists, it
    is read in and executed. The /etc/profile file contains system-wide environment
    settings, such as a basic PATH setting, a default TERM variable, the system umask
    value and more. The Korn shell then reads and executes HOME/.profile. This file'
  merge: -1
  pgno: 158
- img_proc: true
  md: '# Korn Shell User and Programming Manual


    contains your local environment settings, such as your search path, execution
    options, local variables, aliases, and more. A sample profile file is included
    in Appendix A.


    # ## The Environment File


    Once the profile files are processed, the Korn shell checks the environment file,
    which is specified by the ENV variable. The environment file usually contains
    aliases, functions, options, variables and other environment settings that you
    want available to subshells. Besides being processed at login, the environment
    file is processed each time a new Korn shell is invoked. There is no default value
    for ENV, if not specifically set, this feature is not enabled. A sample environment
    file is included in Appendix B.


    Because the environment file must be opened and read each time a new Korn shell
    is invoked, performance can be adversely affected by having a large environment
    file with lots of functions.


    # ## Environment Variables


    There are a number of variables provided by the Korn shell that allow you to customize
    your working environment. Some are automatically set by the Korn shell, some have
    a default value if not set, while others have no value unless specifically set.


    Table 7.1 lists some of the Korn shell variables. The following sections cover
    some of the important variables and how they affect your working environment.
    All the available variables are listed in the Appendix E.'
  merge: -1
