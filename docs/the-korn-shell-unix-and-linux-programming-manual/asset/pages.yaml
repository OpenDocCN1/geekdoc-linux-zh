  md: '# Korn Shell User and Programming Manual


    In this Korn shell script, the eval command is used to display the last command-line
    argument:


    ```

    $ cat eval test

    print "Total command-line arguments is $$#"

    print "The last argument is $$#"

    ```


    What you want $$# to be expanded first to the number of arguments, then $n to
    be expanded to the value of the last argument. Without the eval command, this
    is the output of eval_test:


    ```

    $ eval_test a b c

    Total command-line arguments is 3

    The last argument is 581#

    ```


    The output 581# is generated because $$ is first expanded to the process id. Using
    the eval command to expand the print command twice, we get the correct result.


    The \ is needed so that the $ character is ignored on the first expansion. After
    the first expansion, the $(eval print\$$#) command becomes $(print S3). This is
    then expanded to c.


    254'
