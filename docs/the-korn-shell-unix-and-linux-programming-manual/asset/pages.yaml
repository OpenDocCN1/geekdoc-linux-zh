    Notice that a value is not given, as in normal alias -name=value syntax. This
    is because the Korn shell assigns a value automatically by doing a search on PATH.
    In the case of the tracked alias ls, the value is set to /usr/bin/ls, since /usr/bin
    is the first directory in PATH that contains ls.


    We could set up a tracked alias for the cp command like this:


    ```

    $ alias -t cp

    ```


    If the trackall option is set (set -h, or set -o trackall), then the Korn shell
    attempts to generate tracked aliases for all commands that it encounters for the
    first time. By default, this option is usually disabled.


    Tracked aliases become undefined if the PATH variable is unset. However, they
    continue to be tracked aliases. The next reference to the tracked alias causes
    the value to be reassigned.


