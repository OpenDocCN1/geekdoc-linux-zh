    # The times Command


    The times command displays the amount of time the current Korn shell and child
    processes. The first line shows the total user and system time (in hundredhundreds
    of a second) for the current Korn shell, while the second line shows the totals
    for the child processes.


    # The true Command


    The true command does one thing: return a zero exit status. It is often used to
    generate infinite loops for argument-processing. In some versions of the Korn
    shell, true is a preset alias ":". It also returns a zero exit status.


    # The ulimit Command


    The ulimit command manipulates system resource limits for current and child processes
    using the following format:


    ```

    ulimit [options]

    or

    ulimit [options] n

    ```


    where n indicates to set a resource limit to n (except with the -a option). If
    n is not given, the specified resource limit is displayed. If no option is given,
    the default-f (file size limit) is used. Here, all the current resource limits
    are displayed:'
