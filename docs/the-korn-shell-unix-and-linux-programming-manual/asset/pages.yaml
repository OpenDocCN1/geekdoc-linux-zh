  md: '# Korn Shell User and Programming Manual


    for identifier [ in word ... ]; do list ; done


    Each time a for command is executed, identifier is set to the next word taken
    from the word list. If in word ... is omitted, then the for command executes the
    do list once for each positional parameter that is set (see Parameter Substitution
    below). Execution ends when there are no more words in the list.


    for (( [ expr1 ] ; [ expr2 ] ; [ expr3 ] )); do list : done


    The arithmetic expression expr1 is evaluated first (Arithmetic Evaluation below).
    The arithmetic expression expr2 is repeatedly evaluated until it evaluates to
    zero and when non-zero, list is executed and the arithmetic expression expr3 evaluated.
