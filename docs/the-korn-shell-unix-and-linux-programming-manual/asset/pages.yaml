    the name of the script to execute. The script arg must have read permission and
    any setuid and setgid settings will be ignored. If the script is not found on
    the path, arg is processed as if named a built-in command or function. Commands
    are then read as described below; the following options are interpreted by the
    shell when it is invoked:


