  md: '# # Appendix G: Pdksh Quick Reference


    # ## Command Execution


    The primary prompt (**PS1** - default $ or # for super-users) is displayed whenever
    the Korn shell is ready to read a command. The secondary prompt (**PS2** - default
    >) is displayed when the Korn shell needs more input.


    # ## Command Execution Format


    ```

    command1 ; command2

    execute command1 followed by command2

    command & execute command asynchronously in the background;

    do not wait for completion

    command1 | command2

    pass the standard output of command1 to standard

    input of command2

    command1 && command2

