    # Quoting


    Quoting is used to prevent the shell from treating characters or words specially.
    First, there are three methods of quoting: \ quotes the following character, unless
    it is at the end of a line, in which case both the \ and the newline are stripped.
    a single quote ('''') quotes everything up to the next single quote (this may
    span lines). Third, a double quote ("") quotes all characters, $, '' and \ up
    to the next unquoted double quote. $ " inside double quotes have their usual meaning
    (i.e., parameter, command or arithmetic substitution) except no field splitting
    is carried out on the results of double-quoted substitutions. If a '' inside a
    double-quoted string is followed by \$, \'' or \", it is replaced by the second
    character; if it is followed by a newline, both the \ and the newline are stripped;
    otherwise, both the \ and the character following are unchanged. see: POSIX Mode
    below for a special rule regarding sequences of the form "..."`..."`


    # Aliases


    There are two types of aliases: normal command aliases and tracked aliases. Command
    aliases are normally used as a short hand for one or often used command. The shell
    expands command aliases (i.e., substitutes the alias name for its value) when
    it reads the first word of a command. An expanded alias is re-processed to check
    for more aliases. If a command alias ends in a space or tab, the following word
    is also checked for alias expansion. The alias expansion process stops when a
    word that is not an alias is found, when a quoted word is found or an alias word
    that is currently being expanded is found.'
