  md: '# Korn Shell User and Programming Manual


    # Removing Variable Attributes


    Except for readonly, variable attributes are removed with the typeset +attribute
    command. Assuming that the integer attribute was set on the NUM variable, we could
    remove it like this:


    ```

    $ typeset +i NUM

    ```


    and then reassign a non-integer value:


    ```

    $ NUM=abc

    ```


    Once the readonly attribute is set, it cannot be removed. When we try to do this
    with the PATH variable that was previously set, we get an error message:


    ```

    $ typeset +r PATH

    bin/ksh: PATH: is read only

    ```


    The only way to reassign a readonly variable is to unset it first, then assign
    a value from scratch.


    # Multiple Attributes


    Multiple attributes can also be assigned to variables. This command sets the integer
    and autoexport attributes for TEOUT:


    ```

    $ typeset -ix TEOUT=3000

    ```


