    If you run up against this problem, you can try running XSane root by going to
    the Applications menu and selecting System Tools > Run as different user. When
    the Run window appears, type xsane in the Run box, and if you stars are in alignment,
    XSane should detect your scanner, pop up a message that is dangerous to run XSane
    as root, and then open up in its full multi-windowed glory. If your scanner isn''t
    detected, a trip to www.sample-project.org or www.ubuntuforums.org might be in
    order to see if there are any workarounds for your particular scanner model.


    To actually scan something, place the photo, document, or whatever it is planning
    to scan on the scanner bed, and click the Acquire preview at the bottom-left corner
    of XSane Preview window (which usually opens up at the right end of your). Once
    the preview appears, use the selection tools in the same window to define the
    exact area you want to scan, and then choose your resolution and color depth settings
    in the main XSane window (which usually opens up at the top left of your). When
    everything is ready, click the Scan button, after which your scanned image will
    appear in a New viewer (as shown in Figure 10-10).


    In that, you can perform some tweaks of the scanned image using the buttons and
    menu items provided, and then save the image by going to the File menu and selecting
    Save. If you scanned a document you want to convert to text, click the second
    button from the left (the one that says ABCDEF), and you will also be able to
    save the file as a text document.


    NOTE: If you happened to download and install a driver for your scanner or multifunction
    printer from the device manufacturer''s site (or elsewhere), you may find yourself
    with another scanning application provided within the driver package. If you prefer,
    you can use that application instead of XSane to perform your scanning chores.'
