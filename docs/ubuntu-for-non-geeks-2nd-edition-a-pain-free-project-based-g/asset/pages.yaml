    ![](img/8c9883c4544150d676aa7a1c159e9153_268_0.png)


    Figure 15-2: Playing an audio file from Nautilus


    # # Audio Players


    Now that you know how to rip your audio CDs and encode them to MP3 and Ogg Vorbis
    files, you need to use another application to play them. Fortunately, this is
    an area where Linux shines, as there is quite a selection of audio players available,
    two of which I will discuss here.


    # ## Rhythmbox


    The default audio player in Ubuntu is called Rhythmbox (see Figure 15-3). Rhythmbox,
    using Sound Juicer as its ripper/encoder, seems to function pretty much like a
    simplified version of Apple''s iTunes, though it is not. It is, however, a relatively
    easy-to-use audio player which, despite some quirkiness in its early stages, has
    developed quite a following in the Linux world.'
