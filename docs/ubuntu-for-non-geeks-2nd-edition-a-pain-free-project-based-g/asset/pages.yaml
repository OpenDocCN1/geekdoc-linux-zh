  md: '# 8C-1: Getting Briscola


    You are just about ready to begin “installing” Briscola, but before you do, you
    must get it. You can get Briscola by going to the project''s home page at www.rigacci.org/comp/software
    and downloading in the traditional manner, but since we''re working with commands,
    let''s instead get Briscola by using a new command: wget.


    To do this, just open a Terminal window, type the following command string, and
    then press ENTER:


    ```

    wget http://www.rigacci.org/comp/software/briscola/briscola-4.1.tar.gz

    ```


    In your Terminal window you will see wget action as it connects to the site where
    Briscola is stored and downloads the file. When it''s done, you will find the
    Briscola tarball in your home folder.


    # 8C-2: Extracting the Briscola Tarball and Renaming the Briscola Folder


    Extracting the Briscola tarball is essentially the same process as for pyWings;
    however, Briscola is already packaged within its own folder, so you won''t have
    to create a special folder for.


    Although I am sure you now know the drill, I will tell you again. Open a Terminal
    window, type the following command, and press ENTER:


    ```

    tar -xzvf briscola-4.1.gz

    ```


    A new folder, Briscola-4.1, will now appear in your home folder with all of the
    Briscola files in it. To make things easier to deal with in the future, let''s
    shorten the name of the folder to simply Briscola. We already know how to do this
    via the right-click method, but this time around''s to do it via the command line.
    To do this, you use, perhaps surprisingly, the mv command followed by the name
    of the file name you are going to change, followed by the new name of the file.


    Give it a go by typing the following command and pressing ENTER:


    ```

    mv briscola-4.1 briscola

    ```


    # 8C-3: Preparing the Briscola Script


    Most applications that come in tar form include a README file, which includes
    information on what you need to do in order to install and use the application.
    If you double-click the README file in the Briscola folder in Nautilus, you will
    see that the “HOW TO START” section tells you to adjust the first line of the
    briscola.tk script to point it to your Tk shell, and to adjust the second line
    of the script to point to the directory where the various Briscola files are located.'
  merge: -1
