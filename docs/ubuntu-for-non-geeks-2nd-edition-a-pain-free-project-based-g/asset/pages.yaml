    # # 3A-7: Adding the Entire Contents of Adding a Menu to the Panel


    If you find that you use the applications in a particular submenu of your Applications,
    Places, or System menus a lot, you can opt to add the entire menu to the panel
    as either a menu or as a drawer in a manner similar to the one used in Project
