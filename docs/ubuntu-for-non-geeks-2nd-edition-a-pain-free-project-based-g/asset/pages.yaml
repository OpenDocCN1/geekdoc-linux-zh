    # 8B-4: Moving the pyWings Folder to Your LocalApps Folder


    The extraction process is now complete. Before going on running pyWings, however,
    let''s move to the new LocalApps folder you created in Project 8B-2 on page 143.
    To do this, type the following command, and then press ENTER:


    ```

    mv pywings LocalApps

    ```


    # 8B-5: Running pyWings


    Now that you have pyWings in place and ready for action, let''s start up the great
    oracle right now that you can get a better perspective on how to deal with the
    aspects of life that trouble you.

    In the Terminal, make sure you are in your home directory, type LocalApps/pywings/pywings.py,
    and press ENTER.

    If all went to plan, pyWings should be up and will be making you a wiser person.


    # 8B-6: Creating a Launchable Link for pyWings


    The method of running pyWings that you''ve just used works enough, but it is a
    pain in the posterior to open your Terminal and that some length string every
    time you want to find what fate has in store for you. Let''s find a way to make
    things easier in the future.

    To run an application from the Terminal, or to put it more precisely, the name
    of that program''s executable file; the application''s name acts as a sort of
    command. In order for your to recognize that command, the command (the executable
    file, or a link to it) must be in a location where the system can find it. Whenever
    you run a command of any sort, your system checks a series of locations (most
    of which are bin folders, where executable files are located) to find that command.'
  merge: -1
  pgno: 163
- img_proc: true
  md: 'You can easily find out where these locations are by typing echo PATH in your
    New Terminal window and then pressing ENTER. As you will see, on your Ubuntu system,
    these locations are:


    +   * /usr/local/bin

    * /usr/local/sbin

    * /sbin

    * /usr/sbin/sbin

    * /bin

    * /usr/bin

    * /usr/bin/X11

    * /usr/games


    If the command you typed is in one of these locations, the program, or script,
    will run. As you do know, however, pyWings is not in any of those locations. It
    is in /home/username/LocalApps/pyWings and is thus, in a sense, out of your system''s
    sight.


    To remedy this issue, you could add the path of your pyWings script to the list
    of paths that the system checks for commands, so as to make the system aware of
    your new application''s existence. However, let''s try another method that I think
    is easier. What you will do is create a link to pyWings, a sort of launchable
    alias, in one of the locations your system does check for commands.


    To create this link, you will be using three commands: cd (to change directories),
    sudo ln (to give yourself write access to the destination folder), and ln -s (to
    create the link).


    +   1. In the Terminal, cd /usr/games, and press ENTER. This puts you in one of
    the folders your system searches when you enter your commands.

    2. Type sudo ln -s /home/username/LocalApps/pyWings/pywings.py pyWings, and press
    ENTER. (Note that there is a space between the words pyWings.py and pywings at
    the end of that command string).


    The pyWings at the end of command string is the name that you are giving the link;
    the name of the link becomes the command you will use to run the application.
    If you type nothing, the link will be called pywings.py, which would mean three
    more keystrokes for every time you wanted to start the program.


    +   3. Type your password when prompted to do so, and then press ENTER.

    4. Type cd, and press ENTER to return the Terminal to your home folder.


    # # 8B-7: Running pyWings Again


    Now that you have created the link, you should be able to run the pyWings program
    more easily. To try it out, quit pyWings (if it is still running), type pyWings
    in the Terminal, and press ENTER. Your personal pyWings oracle should appear again.


    You''ve managed to cut down the number of keystrokes required to run pyWings from
    the Terminal. However, if you are really into this pyWings thing and want to use
    it, it will probably be handiest to add a launcher to your panel, a drawer, or
    the Applications menu.'
  merge: -1
