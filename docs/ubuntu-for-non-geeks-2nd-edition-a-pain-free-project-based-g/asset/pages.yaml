    # Converting Audio File Formats


    SoundConverter (shown in Figure 16-10) makes it easy to convert MP3 files to Ogg
    Vorbis format or vice versa. Because SoundConverter does not come bundled with
    Ubuntu, you will have to install it if you haven''t already done so. So to do,
    just run Synaptic, search for soundconverter, and install the application.


    To use SoundConverter, just select Applications & Sound SoundConverter. Once SoundConverter
    starts up, add the songs you want to convert to the main pane by clicking the
    Add File or Add Folder buttons. You can also drag files from your Music folder
    (wherever you store them).


    ![](img/8c9883c4544150d676aa7a1c159e9153_298_0.png)


    Figure 16-10: Converting audio file formats to convert, you need to choose which


    format to convert them to. You can do this by selecting Edit > Preferences

    and making your choice in the Preferences window (Figure 16-11).

    While you''re there, it is also a good idea to tell SoundConverter to place

    y converted files in a location other than the folder where the original

    files are stored. This prevents having to deal with duplicates in Linux

    audio playback applications that automatically scan your Music folder, like

    Rhythmbox. This is not an issue in either gtkpod or RaspberryPod, as they will

    not allow you to add Ogg Vorbis files to their library lists. You might also\want
    to check the box next to the Create subfolders in order to keep

    things organized.


    Once you have set things up and are ready to convert, click Close

    the Preferences window, and then click Convert in the main window. Sound-

    Converter will then begin doing its stuff.'
