    # 3A-6: Adding Program Launchers to the Drawer


    The drawer you''ve just added is, of course, empty at this stage, so let''s put
    it to good by adding launchers for three useful, yet less glamorous, system utilities.
    These are System Monitor, which allows you to view your computer''s running applications
    and processes, memory and CPU usage, and storage device: Terminal, in which you
