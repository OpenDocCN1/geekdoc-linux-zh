    # # Wanda Revisited—GNOME Easter Eggs


    Now, that we''ve finished with our work in this chapter, it''s time to go

    around a bit by revisiting our precocious pearson pal, Wanda. Knowing what

    you do now about Wanda the Fish, you might find it out for me to start

    talking about her, but Wanda has a few more tricks beneath her.

    In fact, she is a good means by which to introduce two of GNOME''s most

    famous Easter Eggs. Code eggs are snippets that

    are usually useless things, but they can be found in all operating

    systems, numerous applications, and even on DVDs (to find out more

    about those, go to www.dvdeastereggs.com).


    A good example of an Easter egg is my first encounter with one my

    first Mac, an ancient SE with a whopping 2MB of RAM. On that machine,

    y could bring up an image (or was a slideshow?) of the Mac SE develop-

    ment team by using the seldom debug key on the side of the machine

    and then typing G 41D89. Pretty cool. I guess, but I would never ever have

    stumbled upon it if I did not read about it in some magazine.


    As my example shows, accessing these Easter eggs usually requires

    unusual maneuvers, ones that you would never perform in the normal

    course of things. To see a Wanda-related Easter egg in action, click the Run

    Application you just added to the panel, type eggs from outer space

    in Command box, and then click Run. You will then see an odd little

    game of the Space Invaders game, shown in Figure 3-15, in which Wanda

    defended our beloved planet from . . well, geeks, I guess.


    To try out the other Wanda Easter egg, open the Run Application

    applet, but this time free the fish, and then click Run. Wanda will

    ow appear swimming around your desktop. Then you click directly on her,

    she will swim away and out of the picture . . but she will be back.'
