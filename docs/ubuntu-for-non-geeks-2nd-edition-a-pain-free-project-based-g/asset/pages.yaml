    # Learning More


    It is lots of fun to learn to use the GIMP by just playing around with it for
    a while. Most of the fun stuff, you get started, is located in the Filters and
    Script-Fu menus of any image window. Of course, you should make a backup copy
    of any file you are planning to experiment with before altering it.


    If you prefer working through manuals and tutorials to just finding things out
    going around, you can download and install the GIMP User Manual via Synaptic by
    searching for *gimp* and then marking *gimp-help-en* for installation. Once it
    is installed, you can access the manual within GIMP from the Help menu. If you
    prefer, you can find the manual at http://docs.gimp.org/en. You can also find
    a series of skill-level tutorials at www.gimp.org/tutorials.


    # XPaint


    If the GIMP comes as a bit overwhelming for you, or if it seems to be overkill
    for your simpler tasks, you might want to try out an application known as XPaint,
    which you can download and install via Synaptic (search for xpaint*). XPaint is
    similar to Windows Paint and MacPaint.


    Even if you are a satisfied GIMP user, there is still good reason to download
    and install XPaint, because in addition to its simple paint tools, you can take
    screenshots of regions (Figure 14-14) rather than just of a particular window
    or the full screen. If you have ever used the Mac OS X application Grab, you may
    well be familiar with this feature.


    By the way, once installation is complete, there will be no launcher for XPaint
    in the Applications menu, so you will have to run from the Run Application panel
    applet or from a Terminal by typing **xpaint**.'
