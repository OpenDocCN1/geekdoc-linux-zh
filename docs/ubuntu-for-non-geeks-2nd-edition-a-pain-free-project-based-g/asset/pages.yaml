    # # Running Windows Applications with Wine


    Now that you''ve learned just every way there is to add applications to your system,
    I might as well throw in one more—running applications. Despite the fact that
    there is a Linux equivalent to most of the Windows programs that people use or
    need, there may be one or two programs that you will come to miss. For me it has
    long been the Austrian card game Schnapsen. Unfortunately, it is possible to run
    some Windows applications from within Linux with the help of a program called
    Wine.


    The folks at Wine seem keen on pointing out that Wine is not a Windows emulator,
    preferring to call it a Windows compatibility layer. In fact, even the name itself
    draws the point, as Wine is a recursive acronym for *Wine Is Not Emulator*. Whatever
    way you choose to look at it, its function is to allow you run Windows apps without
    having Windows installed on your machine.


    It is only fair to point out that Wine continues to be a work in progress. It
    works fairly well with some programs and not at all with others. Things have improved,
    however, and Wine now seems to work better with more applications. Until the latest
    release, for example, I had been unable to get my beloved Schnapsen game to run.
    Now it does, and pretty well at that (Figure 9-11).'
  merge: -1
  pgno: 188
- img_proc: true
  md: '![](img/8c9883c4544150d676aa7a1c159e9153_189_0.png)


    Figure 9-11: A Windows application [Schnapsen] running under Linux


    If you are curious as to which apps are known to run under Wine, and to what degree
    of success, check out the Wine homepage at www.winehq.org, and click the AppDB
    link. If you are curious about Schnapsen and aren''t afraid of wading through
    a bit of German, get the program at www.members .al.net/zinger. You can also learn
    the rules of Schnapsen (and any other code in the world) at www.pagat.com.


    # Installing and Checking Out Wine


    You can get Wine via Automix by clicking Virtualization in the left pane of the
    window and checking the box next to the word Wine in the right pane. After, click
    Start, and you''ll be on your way. Once the installation is complete, quit Automix.


    Before the installation completes, the Wine installation script will auto-matically
    try to create a fake Wine C: drive within your user folder by running Wine Configuration.
    Automax will warn you of this, and all you need to do is click OK, the Wine configuration
    window will close, and Wine itself will be ready for action.


    If the installation completes without the Wine configuration window appearing,
