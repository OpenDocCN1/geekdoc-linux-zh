  md: '# # Project 9A: Installing DEB Packages Not Available via the Ubuntu Repositories:
    Automix


    As you may recall, the applications you install from the various Ubuntu repositories
    via Synaptic or Add/Remove Programs are in form of DEB packages—and the repositories
    are filled with such packages. Unfortunately, although these repositories seem
    to contain just every piece of software out there, for different reasons not every
    package finds its way into the repositories, even if it is available in DEB form.
    At the present time, the application Automix is one of these.


    Automix is, interestingly, yet another front end for the structural heart of all
    Debian-based systems. Like Synaptic, Automix provides you with a graphical means
    to select, download, and install packages. What is different, however, Automix
    provides a fairly automatic way for you to fill in the holes left in your distro
    due to licensing and copyright concerns. In case what I''m talking about, I am
    referring to MP3 playback and encoding, unencrypting DVD playback, and allowing
    you to write to NTFS partitions on your hard drive. You can accomplish all this
    without Automix, but using it makes the process no-brainer.


    # ## 9A-1: Getting and Installing Automix


    Getting and installing Automix is a very simple process. To get started, go to
    www.getautomix.com, and then click the Installation button. On the next page,
    click the 2.1 Ubuntu 7.04 (Feisty 386) link near the top of the page, and then
    click the URL below under either Ubuntu 7.04 (Feisty 386) or Ubuntu 7.04 (Feisty
    amd64), depending on the type of processor you have in your machine.


    At this point Firefox will bring up a window asking you what you want to do with
    the Automix DEB package: either option will do. For the sake of experience, let''s
    accept the default, Open with GDebi Package Installer, by clicking OK. Within
    a moment or two, GDebi, yet another APT front end, will appear with information
    about the package you are about to install (Figure 9-1). In that window, click
    the Install Package button, after which you will be prompted for your password.
    Once the formalities are complete, things should start looking rather Synaptic-esque,
    with the same orange bars zipping back and forth in progress windows until the
    process is complete. Then, just click the Close button in the progress window,
    and close the GDebi window. Mission accomplished.


    # ## 9A-2: Running Automix


    Once Automix is installed, you can run it by going to the Applications menu and
    selecting System Tools ▶ Automix. You will then be prompted for your password,
    so type it and click OK. A window will appear telling you that installing things
    without paying a fee is a legal no-no, depending'
  merge: -1
  pgno: 173
- img_proc: true
  md: 'on where you live. Read the message, remember what it says, and then click
    Yes. A couple of windows appear and disappear as Automix checks the available
    package lists and adds a few repositories of its own. Once it''s done, the main
    Automix2 window, shown in Figure 9-2, will appear. Automix is ready for action.


    ![](img/8c9883c4544150d676aa7a1c159e9153_174_0.png)


    Figure 9-1: Installing individual DEB packages via GDebi


    As you can see, Automix looks very similar to Add/Remove Programs. The main difference
    is that its package collection is more specific, and as I mentioned before, geared
    towards plugging the holes in your system. In fact, most of the packages available
    from Automix are also available via Synaptic and Add/Remove Programs; Automix
    just groups the most commonly desired ones, making things a bit more convenient.


    ![](img/8c9883c4544150d676aa7a1c159e9153_174_1.png)


    Figure 9-2: Plugging up system holes using Automix


    Automix and Not So Automix 155'
