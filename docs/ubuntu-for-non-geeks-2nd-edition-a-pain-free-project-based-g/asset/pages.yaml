    # # Burning Images to Disk


    When you download Fedora Core or other Linux distributions from the Internet,
    you usually download them in the form of one or more disc images, which are commonly
    referred to as ISOs because such files end in the .iso extension. An ISO is an
    image of a CD''s file contents, which means that the CD means the media itself.
    To put it another way, if CDs have souls, the ISO would be the soul of a CD; take
    away the CD''s metal and plastic, and the remaining data would be an ISO.


    As it is impossible to download a physical CD over the Internet, bodiless ISOs
    are the next best thing. For example, to get a working copy of Ubuntu from the
    Web, you need to download an ISO, which you burn to a blank CD in order to get
    the images back, so to speak. In the process you create the working installation
    disk that you need to install Ubuntu.


    Fortunately, burning an ISO is a pretty simple choice. Just open a Nautilus window,
    and locate the icon for the ISO file you want to burn to disc. Right-click the
    ISO file, and in the popup menu that appears, select **Write to Disc**. Once you
    do this, the Write to Disc window will appear; click the Write button, and you''ll
    be on your way.


    # # Duplicating Data CDs


    Duplicating CDs and DVDs is also easily accomplished in Ubuntu. Just right-click
    the desktop icon for the disc you want to copy, and then select **Copy Disc**
    in the popup menu. The Write to Disc window will then appear. Click the **Write**
    button in that window, and the Nautilus CD/DVD Creator will begin copying the
    contents of the disc as a disc image to your hard disk. This may'
  merge: -1
  pgno: 113
- img_proc: true
  md: 'take a bit of time, so don''t worry. When it is done, you will be prompted
    to insert a blank disk into your drive. Once you''ve done that, the Creator will
    begin copying the disk image to the blank disk.


    If you want to know how to duplicate audio CDs, hang on until to Chapter 15.


    #  Burning Multisession CDs


    If you are coming from the Windows environment, you are no doubt familiar with
    multisession CDs. These are CDs on which data is added one session at a time.
    For example, you burn a few files to disk today, add a few more to the disk tomorrow
    and a few more files the day after. Each time you burn additional files to the
    same disk, you are adding a session, which explains the name multisession. If
    that explanation seems a bit obtuse, you can basically think of them working like
    floppy disks (albeit with considerably more storage capacity). While Nautilus
    can read and display the contents of multisession disks, it cannot (yet) write
    multisession disks. To do that, you will need a different disk-burning application.
    I recommend GnomeBaker.


    You can download and install GnomeBaker via Synaptic (search for gnomebaker).
    Once installed, you can run it from the Applications menu by Sound & Video > CD/DVD
    Writer GnomeBaker.


    To burn the first session to CD, click the Data CD in the bottom half of the GnomeBaker
    window. After that, drag the files that you want to burn during the session to
    the bottom-right pane of the GnomeBaker window, under the Data CD tab (Figure
    6-15). You can drag files from the browser in the top panes of the GnomeBaker
    window, from a Nautilus window, or from the desktop.


    When you have all the files in place that you want to burn, click the Burn button
    at the bottom-right corner of the screen. A new window, Create CD will appear.
    In that window, select tao in the drop-down menu next to the word Mode. Once you''ve
    done that, insert a blank disk in the drive, and click Start. The burning process
    will begin. GnomeBaker will eject the disk when it is complete.


    # Burning Subsequent Sessions


    To add a new session to a multisession disk, make sure that the bottom-right pane
    of the GnomeBaker window is empty (click the Clear button if it isn''t), and then
    insert the multisession disk into your drive. After your drive has finished its
    session and you have pushed the Navigator window for disk out of the way, go to
    the GnomeBaker Project menu, and select Import Session. A small window will appear
    asking you to select the drive the multisession disk is located. You most likely
    have one drive, the correct device should already be displayed. If so, click OK.


    The files burned in previous sessions will now appear in the bottom pane. Add
    additional files to burn the disk (thus creating a new session), just follow the
    procedures used for burning the initial session.'
