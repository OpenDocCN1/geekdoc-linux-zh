  md: 'launchers that you do not want to place in your GNOME Panel because space considerations.
    This is also a handy location to place launchers for applications that you must
    normally run in a Terminal window or via the Launch Application window, such as
    those you compile from source code or are run via scripts. You''ll learn how to
