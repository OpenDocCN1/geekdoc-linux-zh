    # # Reading Data CDs and DVDs


    Dealing with CDs and DVDs in Ubuntu is quite simple, as everything is automatic.
    To read a CD or DVD with data on it, rather than music or video, place the disk
    in your drive, and a CD or DVD icon (they look the same) will automatically appear
    on the desktop. A Nautilus window displaying the disk''s contents will also appear,
    after which you can copy files from the CD or DVD to your hard disk using standard
    drag-and-drop procedures.


    When you want to remove the CD or DVD, just close its Nautilus window, right-click
    the desktop icon for that disk, and in the popup menu, select **Eject**. The disk
    will then be ejected automatically.


    # # Burning CDs and DVDs


    Burning CDs and DVDs in GNOME is extremely easy. All you have to do is place a
    blank CD-R (CD-Recordable) or DVD (DVD-RW, DVD-R, and DVD-RW are all supported
    by Ubuntu) in your drive, making sure to select a media format supported by your
    drive, and a window will appear asking you what you want to do with the disk.
    Click the **Burn Data CD** button, or in the case of a blank DVD, the **Make DVD**
    button. Nautilus''s CD/DVD Creator window will then appear, as you no doubt looks
    pretty similar to other Nautilus windows, save for the brown band below the location
    bar and the Write to Disc button (Figure-12).'
  merge: -1
