  md: '# # 13


    #  PENGUINS BACK AT WORK


    Getting Down to Business in Linux


    ![](img/8c9883c4544150d676aa7a1c159e9153_230_0.png)


    I have to admit it: When I think about the joys of computing, I tend to think
    of the more hedonistic, self-indulgent areas like gaming, music, and graphics.
    Still, as is the case for most computer users, what I usually end up doing on
    my computer is work, and writing this book falls into that category.


    Fortunately, Linux can get down to business and do it it as well as the next OS.
    I think it''s safe to say that you are missing nothing and are probably gaining
    quite a bit in terms of home and office productivity programs in the world of
    Linux. In this chapter, I''ll walk you through the Linux offerings in this department.'
  merge: -1
  pgno: 230
- img_proc: true
  md: '# OpenOffice.org


    Whether they should be or not, people are quite obsessed with office suites, even
    though people seldom need more than a word processor. The facto standard among
    office suites is Microsoft Office, which is available in both the Windows and
    Macintosh worlds. as it is a Microsoft product, you can quite sure that there
    is no Linux version available.


    Fortunately, Linux has an exceedingly capable office suite in the form of OpenOffice.org,
    which is, incidentally, also available (as in free) in Windows and Mac OS versions.
    OpenOffice.org is not some lightweight sour-grapes substitute for the Microsoft
    Office–less Linux world; it is a fully featured content, and in some cases, OpenOffice.org
    is a clear winner.


    # OpenOffice.org Applications


    The entire OpenOffice.org suite consists of six applications: a word processor
    (Writer), a spreadsheet (Calc), a presentation layer and player (Impress), a vector
    drawing program (Draw), a database (Base), and a mathematical formula editor (Math).
    Most of these can be accessed at


    +   • Office


    Since giving full and detailed instructions on how to use each of these applications
    would take up an entire book (and there are books on the subject), I will simply
    introduce each module to you. Being a bit of a mathematics quince, however, I
    won''t be venturing too deeply into what you can do with Math. That said, here
    goes.


    # Writer


    As mentioned, the word processor is the application that the majority of users
    turn to most often. Fortunately, OpenOffice.org Writer is a good one (see Figure
    13-1). It is chock full of features and can read and see Microsoft Word files.
    Like Word, it will let you change your documents into web pages.


    ![](img/8c9883c4544150d676aa7a1c159e9153_231_0.png)


    Figure 13-1: OpenOffice.org Writer'
  merge: -1
  pgno: 231
- img_proc: true
  md: 'As I said, Writer is a very straightforward word processor, so I won''t go
    on about it, but if you would like an introduction to using Writer, check out
    the First Steps tutorial at the OpenOffice.org website (www.openoffice.org/writerfirststeps/writerfirststeps.html).


    # Calc


    Calc is the OpenOffice.org spreadsheet application, and it is similar to Excel
    in terms of capabilities and general layout. It can also, quite importantly, read
    and save Microsoft files.


    ![](img/8c9883c4544150d676aa7a1c159e9153_232_0.png)


    Figure 13-2: A graph created in OpenOffice.org Calc


    Most people who use spreadsheets generally understand what they are all about
    and, after a bit of poking around, can can figure out how to use them, I won''t
    go into any sort of primer about using Calc. However, as there are many others
    who don''t see any need to even try using spreadsheets, I will mention a few of
    the simpler things that can be done with Calc, in the hope of enticing some of
    you into trying it.


    Most people who don''t use spreadsheets think of them as a sort of giant calculators
    for computing uncomfortable sets of data like payrolls (which was the original
    purpose of such applications). That''s right, of course but spreadsheets can be
    used for everyday tasks too, as projecting household budgets, calculating grade
    averages (by teachers or students), figuring out how long it will take you to
    save up for your trip to Hungary, or even for something as weird as comparing
    the seat heights for the four or five motorcycles you are trying to choose. And
    when doing any of these minor mathematical tasks, you can easily create graphs
    in order to make all the abstract numbers speak to you visually.'
  merge: -1
  pgno: 232
- img_proc: true
  md: 'If numbers are just not your thing, you can still use Calc for creating lists
    of information, such as birthday lists, class rosters, shopping lists, address
    lists... whatever. You can even have Calc put the lists in alphabetical order,
    or sort them by date of birth, and so on. Everyone seems to find some use for
    Calc, don''t ignore it entirely.


    # Impress


    Impress is OpenOffice.org''s answer to Microsoft''s PowerPoint, with slides for
    use which it is compatible. It allows you to create graphically attractive slides
    in presentations and also allows you to create notes or handouts to accompany
    them. While these features make Imp handy in business and education settings,
    you may not find as much value in it as a home user.


    # Draw


    More to the home user is OpenOffice.Draw. Although Draw isn''t all that great
    program for creating true graphics in the artistic sense, it is very useful for
    creating flowcharts, organizational diagrams (like seating arrangements for wedding
    receptions or conferences), or any other document in which you want a bit more
    control over the placement of text and graphics (especially when the two are combined),
    such as for flyers, awards, diagrams, and newsletters. In this sense, Draw can
    be used effectively as a simple page layout program, as you can see in Figure
    13-3.


    ![](img/8c9883c4544150d676aa7a1c159e9153_233_0.png)


    > Figure 13-3: A newsletter created (and displayed) in OpenOffice.org Draw


    Although Draw bundled with Ubuntu, is no longer listed in the Applications menu,
    probably because its functions can be accessed through the other OpenOffice modules.
    Still, it is a handy application to use on its own, if you would like to use it
    in its stand-alone form, you can run it


    Chapter 13'
  merge: -1
  pgno: 233
- img_proc: true
  md: 'either via the Run Application panel applet by typing office -draw or by adding
    the launcher yourself to the Applications menu.


    To add Draw to the Applications menu, open the Menu Editor by right-clicking Applications
    and selecting Edit Menus. Once the editor appears, click Graphics or Office (or
    both) in the left pane, depending on where you want the menu launcher to appear.
    In the right pane of the window, check the box next to the words OpenOffice.org
    Drawing. Once you''re done, click the Close button, and the Draw will appear in
    the menu.


    # Base


    New to OpenOffice.org is Base, which is a graphical front end to any data-bases
    you have on your machine, using Base''s one database, HSQL. Unfortunately, learning
    how to use Base is noewalk if you have any experience working with database applications,
    or if the database module in AppleWorks is the extent of your contact with such
    applications, you might want to try a relatively easy-to-follow tutorial (with
    a not-so-easy-to-follow URL) at http://searchopensource.techtarget.com/tip/1289483,sid39_gci114827.00.html.


    # Math


    Finally, we can open OpenOffice.org Math As I am a bit out of it in terms of math,
    I can really tell you that allows you to produce complex mathematical formulae
    and then paste them as embedded objects into other OpenOffice.org programs. It
    is strictly an editor and does not calculate. I think I am in saving that most
    common folk have no need for it in everyday lives, unless of course, you write
    math textbooks for life.


    Like Draw, OpenOffice.org Math is not listed in the Applications menu, but you
    can access it via the Run Application panel applet by typing office -math. Oh,
    and if you do to write math textbooks for life, you can also add a launcher for
    Math to your Applications menu, just as you did for Draw, by means of the Menu
    Editor. In the editor window, just click Office, and click the New Item button.
    In the Create Launcher window that appears, type OpenOffice.org Math in the Name
    box, and office -math in the Command box. Once you''re done, click OK. The new
    item will appear in the Menu Editor window, selected and ready to go.


    # Microsoft Office and OpenOffice.org File Compatibility


    Although I mention the point throughout this section, it is worthwhile to re-emphasize
    that OpenOffice.org can read and write Microsoft Office files. This compatibility
    is quite good, though tables sometimes prove slightly problematic.


    In order to read Microsoft Office files, all you need to is double-click the file
    in question, and it will open in the appropriate OpenOffice.org module. When saving
    files within OpenOffice.org to use within Microsoft Office, however, you must
    save them into the appropriate format,'
  merge: -1
  pgno: 234
- img_proc: true
  md: 'OpenOffice.org will otherwise save files into its native format .odt for Writer
    documents, .ods for Calc documents, and odp for Impress next to the words by default.


    To do this when saving a file, click the small arrow next to the Save window,
    and select the appropriate Microsoft Office format from the list of available
    file formats listed in the pane that then appears—Microsoft Word 97/2000/XP for
    Writer document, for example.


    # OpenOffice.org Features


    The three applications in OpenOffice.org (Writer, Calc, and Imp) are respectively,
    quite similar to their equivalents in Microsoft Office (Word, Excel, and PowerPoint),
    so switching over to the OpenOffice.org applications should be relatively easy.


    If you don''t have any experience with Microsoft Office, you should find it all
    pretty straightforward, the basic layout is pretty intuitive. If you are lacking
    in the intuition department, the built-in Help files are pretty good, too. To
    further help you, the Tips system works like tooltips in the Windows and Mac worlds.
    In you''re not sure what I''m talking about, tooltips are those little yellow
    boxes that pop up to tell what a button or menu item does when you place your
    mouse over it or menu item.


    Despite all the straightforwardness I am speaking of, there are a few interface
    items that most likely be unfamiliar to you. That being the case, I will briefly
    discuss these items. I''ll be using the word processor, Writer as I describe these
    things, if you want to run OpenOffice.org while following along, Writer might
    be a convenient starting point for you.


    # Getting to Know the Buttons


    Although you should pretty be able to figure out all of the buttons on the OpenOffice.org
    toolbars, do are a few buttons common to all OpenOffice.org modules that most
    likely require, or at least deserve, a bit explanation.


    # Export to PDF


    This button is situated to the left of the two printer buttons (Print and Print
    Preview). You can use this button to export, or save, your document as a PDF file,
    in a manner that is similar to (albeit easier) the one in Chapter 10.


    ![](img/8c9883c4544150d676aa7a1c159e9153_235_0.png)


    # Hyperlink


    Clicking the Hyperlink button, the button to the left of the Table button, brings
    up the Hyperlink window, from which you can assign links to specified documents—not
    only to web pages, but also to documents on an individual computer, and even targets
    within document. While a hyperlink on a web page is something we all come to granted,
    the idea of hyperlinking between text documents sounds like a pretty radical concept.
    It is, in fact, a rather old one that has been around before you or I even heard
    of the Internet.


    ![](img/8c9883c4544150d676aa7a1c159e9153_235_1.png)'
  merge: -1
  pgno: 235
- img_proc: true
  md: '# Navigator


    The fourth to the last button in the top row (the one that looks like a starburst)
    is the Navigator button. Clicking this button brings up the Navigator window (see
    Figure 13-4), which is a pretty cool navigational feature that comes in handy
    when working with lengthy or otherwise complex documents.


    ![](img/8c9883c4544150d676aa7a1c159e9153_236_0.png)


    The Navigator allows you to easily bounce back and forth between pages in the
    document or even elements therein, such as sections, links, and so on. Let''s
    say you have a document with lists of illustrations in it (like this chapter),
    and you want to jump directly from graphic to graphic. In this case, you double-click
    the main pane of the Navigator window and then click the jump buttons (the odd
    little buttons to the left of the page number) to begin jumping.


    If you are dealing with a document containing various heading levels, all of the
    chapters in this book, you can also use Navigator to switch among levels. Say
    you decided to add a new heading at the last minute to a document you''ve been
    writing. All of the headings you had before then need to be dropped down a notch;
    the former main heading becoming a subheading, and so on. By double-clicking the
    work Headings, the text of all the headings you have listed in the document would
    then appear. You could then select a heading in that list, and then click the
    Demote level button (the one at the far right of the second row of buttons) to
    move it down a notch.


    # Gallery


    ![](img/8c9883c4544150d676aa7a1c159e9153_236_1.png)


    To the right of the Navigator button is the Gallery button. By clicking this button,
    the Gallery, a library of graphical elements for use in your documents or web
    pages, will appear in a separate pane at the top of your document window (see
    Figure 13-5). The elements in the Gallery range from various types of buttons
    to colored three-dimensional doughnuts, and you can add items of your own.


    Inserting a graphic into your document is a simple enough task when not using
    the Gallery. All you need to do is to go to the Insert menu, select Picture >
    From File, and locate the file you want to insert. It can be handier to use the
    Gallery, however, when you intend to use


    Figure 13-4: The Navigator window'
  merge: -1
  pgno: 236
- img_proc: true
  md: 'certain graphics frequently. Once in the Gallery, your graphics are always
    only a click or two away and can be conveniently viewed in the Gallery browser
    window.


    ![](img/8c9883c4544150d676aa7a1c159e9153_237_0.png)


    Figure 13-5: The Gallery


    The collection of artwork that comes with OpenOffice.org is mostly geared towards
    building web pages, but there is other clipart available, and Automix provides
    an easy way to get and install it. Just run Automix, click Office in the left
    pane, check the box next to Open Office Clipper in the right pane, and then click
    the Start button. Once the rather installation process is complete (there’s a
    lot of clipart in the collection), you will find it all, nicely organized and
    waiting for you, in the Gallery, including your favorite “stickmen” collection
    (Figure 13-6).


    ![](img/8c9883c4544150d676aa7a1c159e9153_237_1.png)


    Figure 13-6: Adding clipart (including some cool stickmen) to the Gallery


    Adding your graphics to the Gallery is also relatively easy to do. First you have
    to create a new category (called a theme) for each group of images you wish to
    add. To create a Gallery theme of your own, click the New Theme button in the
    Gallery window. This will open the New Theme Properties


    Chapter 13'
  merge: -1
  pgno: 237
- img_proc: true
  md: 'window, where you should first click the General tab and give your theme name.
    Once you''ve done that, click the Files tab, and then the Find Files button, which
    will bring up a Select Path window to navigate to the folder in which you are
    storing your clip art, photos, or other graphics. Once you have found the folder,
    click the Select button, which after a list of all the files in that folder will
    appear in New Theme properties.


    You can easily add images to your new Gallery by clicking the name of each image
    you wish to add (you make sure that the box to the word Preview is checked to
    make things bit easier), and then clicking the Add button. Once you have done
    that, a copy of the image will immediately appear in the Gallery browser, where
    it will remain for future use. To use one of the images in the Gallery, right-click
    the image you wish to insert into your document, and select Copy or Link to it


    # Data Source


    The second to the last button in the top row is the Data Source button. Clicking
    this opens a Data Source browser in the new top of your document. From that you
    can access and edit any records stored within any databases you have registered
    in OpenOffice.org. From a database containing personal information (such as Evolution''s
    Addressbook), for example, you could simply do a search for an individual entry,
    and then drag the name, address, phone number, and/or email address for that entry
    into your document, rather than searching for the data element where and typing
    it all over again.


    # Styles and Formatting


    The final stop on our tour OpenOffice''s unfamiliar buttons is the Styles and
    Formatting button, which is located at the far left side of the second row of
    buttons. This button acts as a toggle for the Styles and Formatting window (13-7),
    from which you can select and then apply to any of the various elements within
    your document. Oh, and if you can''t take your hands off the keyboard for a moment
    to fiddle with the mouse, you can also open the window by pressing the F11 key.


    ![](img/8c9883c4544150d676aa7a1c159e9153_238_0.png)


    Figure 13-7: The Styles and Formatting window'
  merge: -1
  pgno: 238
- img_proc: true
  md: 'To give you an example of how convenient using styles can be, imagine that
    you are typing a bibliography page for some document you''ve prepared. You typed
    each entry as you might any paragraph, as in:


    Smythe, W. (2004). Considering the need for speech between non-human interlocutors
    beyond the age of seven. The Journal of the Society of Elves, Faeries, and Garden
    Gnomes 20 (2), 125-147.


    Most paragraphs you type, the entry is formatted except for the fact that you
    want a hanging-indent, which is the norm for bibliography entries. Rather than
    messing around with tabs or margins to get things the way you want, all you have
    to click your mouse anywhere within the paragraph, and then double-click the Hanging
    Indent entry in the Styles and Formatting window. After that, as by magic (though
    you know better), the transformation is:


    Smythe, W. (2004). Considering the need for speech between non-human interlocutors
    beyond the age of seven. The Journal of the Society of Elves, Faeries, and Garden
    Gnomes, 20 (2), 125-147.


    You could follow the procedure for any of your other entries, or, with Hanging
    Indent selected, click the paint can button in the Styles and Formatting window,
    after which your cursor, when placed over the document, will appear as a paint
    can. Place that paint-can in any other paragraph in your bibliography, and that
    entry, too, will be formatted in the new style. The process is essentially the
    same when applying different styles to any other document elements.


    # Word Processing Done Lightly with AbiWord


    If OpenOffice.org''s Writer is a bit more powerful than what you need for your
    everyday word processing chores, and you would prefer something that pops up as
    soon as you click the launcher, then you might want to consider giving another
    word processor, AbiWord, a try (Figure 13-8).


    AbiWord has a very straightforward and easy-to-use interface, which you should
    be able to figure out without much, if any. It also has a couple of rather interesting
    features, such as its auto-resize function, which magnifies the onscreen document
    size (fonts, images, and everything) or shrinks it as you increase or decrease
    the size of the program window. And if you''re wondering, AbiWord can read Word
    DOC files and save documents as PDF files.


    You can easily install AbiWord via Synaptic by performing a search for abiword,
    and then . . well, you know the drill by now. Once you have AbiWord installed,
    you can run it by going to the Applications menu and selecting Office > AbiWord
    Processor.'
  merge: -1
  pgno: 239
- img_proc: true
  md: '# Some Other Cool Productivity Apps


    In addition to the more traditional office applications, there are a number of
    other applications included with or available for your system that can be grouped
    together under the “productivity” label. I will introduce a few of those to you
    here.


    # Sticky Notes


    Mac users will be familiar with the digital version of the more ubiquitous little
    yellow Post-It-like notes called Sticky Notes (Figure 13-9) that come as part
    of the GNOME desktop. GNOME’s Sticky Notes is a panel applet that you can add
    to your own panel by right-clicking on any open panel space and then selecting
    Add to Panel in the popup menu that then appears. When the Add to Panel window
    appears, go to the Accessories section, click Sticky Notes, and then click the
    Add button. You will then be ready for note-taking action.


    ![](img/8c9883c4544150d676aa7a1c159e9153_240_0.png)


    ![](img/8c9883c4544150d676aa7a1c159e9153_240_1.png)'
  merge: -1
  pgno: 240
- img_proc: true
  md: 'I should mention that there is one slightly annoying “feature” of Sticky Notes
    that makes it a bit different from what you might be used to. When you click on
    the desktop, all of your notes will disappear. This is as it is supposed to be,
    though I personally can''t see the point (and wouldn''t like it even if I could).
    Fortunately, however, you can bring all of your notes back by simply clicking
    the Sticky Notes panel. In fact, if you decide to remove the panel and then bring
    it back at some later point in time, you''ll be happy to know that all of the
    notes you created will be back too.


    # Tomboy


    If Sticky Notes just doesn''t cut it for you and your dramatic note-taking needs,
    perhaps you will find yourself served by another application that comes with your
    system by the name of Tomboy (Figure 13-10). Like Sticky Notes, Tomboy also works
    as a panel, but it is a much more featured feel, without making any claims to
    sticking. Instead, the various notes you can create by selecting them from the
    menu that appears when you click the Tomboy panel itself. In all ver, a very handy
    approach.


    ![](img/8c9883c4544150d676aa7a1c159e9153_241_0.png)


    Figure 13-10: Notes taken seriously—Tomboy


    What really gives Tomboy''s bragging rights, however, is its search and hyperlink
    functions. These allow you to search for entries within your entire Tomboy note
    library, and create hyperlinks that connect text in one note to another linked
    note. In fact, Tomboy will automatically create a hyperlink whenever you type
    a word that matches one of your existing note headings.'
  merge: -1
  pgno: 241
- img_proc: true
  md: 'To make matters even more exciting (or at least useful), Tomboy, by means of
    its plugins feature, allows you to export notes to HTML or print them out, either
    as hard copy or as PDF docs.


    If you''d like to give Tomboy a try, start by going to Applications ► Accessories
    ► Tomboy Notes, after which Tomboy will appear in the top GOME Panel.


    # GnuCash


    If you are familiar with the personal financial management software Quicken, then
    you might be interested in GnuCash (shown in Figure 13-11), which is the Linux
    world''s best-known offering in the personal finance arena. It reads Quicken and
    Intuit QIF files, which makes things even easier should you be making the transition
    from another operating system. Unfortunately, unless you live in Germany, you
    cannot use GnuCash for online banking; but as the GnuCash folks themselves say,
    don''t blame them, blame your.


    To install GnuCash, just do a Synaptic search for gnucash, and mark both gnucash
    and gnucash-docs for installation. Once these are installed, you can run the application
    by going to Applications ► GnuCash Finance Management.


    ![](img/8c9883c4544150d676aa7a1c159e9153_242_0.png)


    Figure 13-11: GnuCash


    # Scribus


    To round things out, we come to the open source desktop publishing application,
    Scribus (shown in Figure 13-12), for those times when OpenOffice.org Writer and
    Draw just don''t cut it. Scribus is designed to produce commercial-grade output,
    with support for professional publishing features, such as CMYK colors, PostScript
    handling, and creation of color separations, to name but a few.'
  merge: -1
  pgno: 242
- img_proc: true
  md: '![](img/8c9883c4544150d676aa7a1c159e9153_243_0.png)


    Figure 13-12: Scribus


    You can download and install Scribus by doing a Synaptic search for Scribus. Once
    the installation is complete, you can run the application from Applications >
    Office > Scribus.


    224 Chapter 13'
  merge: -1
