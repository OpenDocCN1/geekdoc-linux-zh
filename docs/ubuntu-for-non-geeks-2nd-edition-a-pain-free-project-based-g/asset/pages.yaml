- img_proc: true
  md: '![](img/8c9883c4544150d676aa7a1c159e9153_200_0.png)


    Figure 10-5: Printing a file to PDF in most GNOME applications


    # # Printing Web Pages to PDF


    Printing to PDF is also a very handy way of saving a web page that you would like
    to keep on hand in its graphical entirety for future reference. At this time,
    Firefox does not support this feature, though it allows you to print a page to
    PostScript. As long as you are strictly using the file on your own system or giving
    it to someone else with a Linux system, you likely won''t notice any difference
    between PS and PDF files, which will look and act much the same.


    To print a web page to PostScript, go to the Firefox **File** menu, and select
    **Print**. When the Print dialog appears, select **Print to file**, and then give
    your a page name, being sure to keep the `.ps` file ending. Click **Print**, and
    within seconds, the file will appear over your hard disk.


    This is all fine and d, but if you want to distribute the document to a broader
    audience, the PostScript alternative just won''t do, as most Windows users won''t
    have any way to view the file. One way is to create the PS document and convert
    it to PDF using the `ps2pdf` command. This is easy to do, though it always works
    so well. You may find, for example, that the text within your **PS** document
    vanishes in the output PDF file, or that the text appears, while the graphics
    vanish. Giving it a try can''t hurt, so here''s how you do it. Just type `ps2pdf
    filename.ps filename.pdf` in your Terminal, and press ENTER. Yup, that''s all
    there is to.


    # # Project 10: Creating a Virtual PDF Printer


    If you aren''t satisfied with the results of a `ps2pdf` conversion, but you will
    still be able to print web pages to PDF, then there is a fairly simple solution—create
    a virtual PDF printer. By doing so, you will be able to print to PDF in any application
    that allows printing (sorry gamers).'
  merge: -1
  pgno: 200
- img_proc: true
  md: '# 10-1: Getting and Setting Up the Files You Need


