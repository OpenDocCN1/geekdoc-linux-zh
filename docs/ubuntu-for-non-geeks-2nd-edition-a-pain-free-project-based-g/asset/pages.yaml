  md: '# 9


    # AUTOMATIX AND

    NOT SO AUTOMATIX


    More Ways to Install Programs


    ![](img/8c9883c4544150d676aa7a1c159e9153_172_0.png)


    In the past few chapters, you learned how to install applications via Synaptic
    and run script-type applications from the command line, which gives you quite
    a variety of applications to choose from. It is now time, however, to expand your
    application-gathering repertoire even further.


    In this chapter you will learn how you can add applications to your system in
    even more ways, a couple that involve working with APT, and a couple that don''t.
    In fact, you will be dealing with one of the newest ways of making your Ubuntu
    system as functionally well rounded as any other system out there, and you will
    still be using one of the most manual and traditional ways to install an application,
    that is, compiling it from source. You will also learn how to convert Red Hat
    Package Manager (RPM) packages for use in your Debian-based system environment,
    running Java-based applications, and—say it ain''t so—even running some Windows
    applications. When you are done, you will have more options at your disposal than
