- img_proc: true
  md: '# RESOURCES


    As Linux owes much of its growth and development to the Internet, it should come
    as no surprise that there is a wealth of information about Ubuntu available to
    you online. In addition to the usual news, how-to, and download sites, you will
    also find a variety of tutorials, forums, blogs, and other sources of useful information—all
    of which you can turn to as you use and learn more about your system.


    # Forums


    When you are looking for advice, trying to solve a particular problem, or just
    looking for some general tips, online forums are the way to go. Fortunately, Ubuntu
    has a forum for all its, and since Ubuntu is primarily a desktop-oriented Linux
    distro, you are likely to find many fellow newbies and newbie-friendly posters
    there, rather than the hard-core geekiness you might find on'
  merge: -1
  pgno: 324
- img_proc: true
  md: 'some other sites. There are, of course, newbie-friendly forums, which, although
    not Ubuntu-specific, should also be able to provide you with lots of helpful information.


    Regardless of which forum you are posting in, be sure to mention that you are
    new to Linux, which version you have (Feasty, in case you forgot), and that you
    are to always seek clarification when you get an answer you don''t understand.
    The poster will usually come back and clarify things for you. You should feel
    right home at most of these sites, though you will probably come to one or two
    more than the others.


    http://www.ubuntuforums.org The official Ubuntu community forum. Always a good
    place to start when you''re in a fix, have a question, or just to find out what''s
    going on.


    http://www.ubuntu.org/forum Another slightly smaller Ubuntu-specific forum. A
    good place to turn if you find UbuntuFororg a bit much to wade through.


    http://www.kubuntuforums.net A forum dedicated to Kubuntu, an official Ubuntu
    edition based on the KDE desktop environment.


    http://www.justlinux.com If you can''t find what you are looking in the previously
    mentioned forums, you can try this or the following forums dealing with general
    Linux issues. You are sure to find many Ubuntu users on any of them.


    http://www.linux.com


    http://www.linuxquestions.com


    # Linux Reference


    These are sites, many of which are geared towards newbies, where you can learn
    more about using Ubuntu or Linux in general.


    http://ubuntuguide.org/wiki/ubuntu:feisty An unofficial Ubuntu startup guide.


    https://help.ubuntu.com Official documentation for the current release of Ubuntu.


    http://www.tuxfiles.org Lots of tutorials and information for Linux newbies.


    http://www.linuxcommand.org Learn to use commands in Linux.


    http://www.linux.org News, book reviews, downloads, and all sorts of other stuff—all
    about Linux!


    # Blogs


    A lot of great information can also be found in blogs. In these, you can discover
    the findings of fellow users as they try new things, share tips, and offer solutions
    to problems.'
  merge: -1
  pgno: 325
- img_proc: true
  md: 'http://ubuntu.wordpress.com Ubuntu news with some tips thrown in.


    http://www.ubuntuux.org/blog Mostly an Ubuntu-oriented news blog.


    http://www.ubuntugeek.com Despite having the word geek in the name, this is a
    pretty accessible set of most useful Ubuntu system and software tweaks.


    # Hardware Compatibility Issues


    If you want to find out or not your hardware is compatible with Linux, or if you
    want to read up on other matters related to hardware support, take a look at the
    following sites:


    https://wiki.ubuntu.com/HardwareSupport Ubuntu-specific hardware information.


    http://www.linuxcompatible.org/compatibility.html Numerous compatibility lists,
    arranged by distribution.


    http://www.linuxprinting.org A great spot for reading up on printer compatibility
    issues.


    http://www.linmodems.org Find out if your modem is supported.


    http://www.sane-project.org Check to see if your scanner is Linux compatible,
    and look for fixes if it isn''t.


    http://www.linux-laptop.net Have laptop, want Linux? Check it out here.


    http://www.tuxmobil.org Info for Linux with anything that isn''t stuck to your
    desk (laptops, PDAs, phones, etc.).


    # Wireless Connections


    If you use a wireless card to connect to the Internet and trouble getting your
    card to work, or if you just want to know where all the free wireless hotspots
    happen to be, the following sites should help.


    http://www.hpl.com/personal/Jean_Tourrilles/Linux


    http://www.ezgoal.com/hotspots/wireless


    # Free Downloads


    If you find yourself looking for more goodies to play around with, you should
    be able to find plenty of free stuff to download at one of these sites.


    # Applications and Other Packages


    http://sourceforge.net


    http://www.freshmeat.net


    http://www.gnomefiles.org'
