  md: '# Project 14C: Emblems Again! (Creating Your Own)


    One of the first things my mother asked me after she got Linux up and running
    was how to create her own emblems. You already learned how to deal with emblems
    in Chapter 7, but now that I have introduced many of the graphics tools at your
    disposal, it might be a good time to address my mother''s question as well.


    # 14C-1: Using an Existing Icon as an Emblem


    You can use any image as the basis of an emblem, but the easiest way to get created
    emblems is to use one of the icons on your system as the base. The only problem
    with that is that most of your system icons are 48 by 48 pixels in size, while
    emblems are 36 by 36 pixels. If you don''t want your emblem to look weirdly oversized
    and out of place, it is best to resize it.


    As I mentioned in the previous section, the gThumb application is very helpful
    for resizing images. For this project, we will use the gnome-tiger icon, choose
    the drop menu button above the left pane, and then navigate to /usr/share/pixmaps.
    Once, choose **View ▸ As List**, then for the **gnome-tiger.png** file (it looks
    like an orange character), double-click it, and then go to the **Image** menu
    and **Resize**. This will bring up the Scale window to 36 pixels (the height will
    change automatically, as long as the box next to *Keep aspect ratio* is checked).
    Once you are, click **Scale**.


    Now you need to save the newly sized icon to your home folder, while keeping the
    original as it was. To do this, go to the **File** menu and select **Save As**,
    which will bring up the Save window. Save the file as gnome-tiger_emblem.png in
    your home folder. You can do this by clicking the drop-down menu button next to
    the words **Save in folder** and navigating your home away. Once that''s done,
    click **Save**.


    # 14C-2: Adding the Newly Sized Image to the Emblem Collection


    Now that you have an image of the appropriate size, it is time to add it to your
    system''s collection of emblems. To do this, go to the **Edit** menu, and then
    select **Backgrounds** and **Emblems**. Once the Backgrounds and Emblems window
    opens, click the **Emblems** button on the left side of the window, and then click
    the **Add a New Emblem** button at the bottom of that window. This will bring
    up a small Create New Emblem window (see Figure 14-9).


    In that window, start out by giving your emblem a name. As the image is that of
    a tiger, I called mine *Kitten Stuff*, but you can call it something else if you''d
    like. Just type the name in the Keyword box.'
  merge: -1
  pgno: 252
- img_proc: true
  md: '![](img/8c9883c4544150d676aa7a1c159e9153_253_0.png)


    ![](img/8c9883c4544150d676aa7a1c159e9153_253_1.png)


    After you have done that, it is time to work on adding your new emblem to your
    system''s collection. To do this, just click the big button next to the word Image.
    This will open a window from which you can select the image. In the text box at
