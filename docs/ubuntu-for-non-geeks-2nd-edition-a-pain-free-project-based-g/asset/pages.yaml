    it is installed, open a Terminal window, type sudo chmod +s /usr/lib/cups/backend/cups-pdf,
    and press ENTER. When prompted for your password, type it, and press ENTER.


    # 10-2: Setting Up Your PDF Printer


    After the cups-PDF installation and preparation is complete, you can go on to
    setting up your printer. To do this, select the System menu, and select Administration
    Printing. Provide your password when prompted, and then, when the Printers window
    appears, double-click the New Printer icon. In the Add Printer wizard appears,
    select Local Printer and Use a detected printer, and then click on PDF Printer
    to select. Once you''re done, click Forward.


    On the second page of the wizard, select Generic in the Manufacturer menu, and
    select postscript color printer rev3b in the Model section. Your window should
    look like that in Figure 10-6. If it does, click Forward.


    ![](img/8c9883c4544150d676aa7a1c159e9153_201_0.png)


    Figure 10-6: Creating a virtual PDF printer


    Finally, on the last page of the wizard, fill in the text boxes as you like and
    click Apply to seal the deal. You might want to shorten the name of the printer
    to something more manageable, such as My PDF Printer.'
