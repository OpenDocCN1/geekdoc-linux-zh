- img_proc: true
  md: 'Well, now that you know how to compress and extract a gzipped tarball, you
    probably want to know how to create one. This is, again, different than creating
    the tar archive itself; you would just add the -z tag to tell the program to use
    gzip to compress the folder. For example, to create a compressed version of your
    Documentia folder, which we''ll call tightdocs.tar.gz, for example, you would
    type the following, and press ENTER:


    ```

    tar -czvf tightdocs.tar.gz Documentia

    ```


    It''s worth mentioning at this point that you may also come across some files
    compressed with the bzip program. Such files are recognizable by some variation
    on the .bz extension. Dealing with these files should pose no problem, as the
    commands are all identical to those for gzip. Just substitute -j for -z in the
    command string.


    If you want to compress or decompress a single file, there is no real need to
    use the tar program at all; since its purpose is to create archives of several
    files. You can instead use the gzip and unzip commands directly. For example,
    to compress a file called matilda.jpg, you would type gzip matilda.jpg, and press
    ENTER. The matilda.jpg file would then become matilda.jpg.gz. To decompress the
    file, you would use unzip matilda.jpg.gz, and press ENTER, after which the matilda.jpg
    file would be back to normal.


    So can you compress an archive you''ve already created with the tar command? Sure.
    For example to compress the spicyfood.tar and voilà–you''ve got yourself a compressed
    spicyfood.tar.gz archive. Pretty cool, don''t you think?


