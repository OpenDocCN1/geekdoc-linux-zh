- img_proc: true
  md: 'and a subsystem with which to handle them (somewhat confusingly referred to
    as the X Window System) were developed by the community at large to bring about
    the change. The graphical desktop environment, GNOME, that is included in your
    Ubuntu distribution is one example of the fruit of that development.


    # About the Penguin


    You may have been wondering about the penguin in the chapter title, so I might
    well explain that now. The penguin was chosen by Linus Torvalds for the Linux
    mascot, and what has come to be thought of as the Linux penguin designed by Larry
    Ewing and is named Tux (see Figure 1-1). This explains not only the ornithological
    references and graphics throughout the book, but also why there are so many penguin
    icons in Linux distributions and so many programs that include penguin or Tux,
    such as TuxRacer, XPenguinsins, and Pingus. This, combined with the fact that
    Linux is a revolutionary OS, helps to explain why Linux users are sometimes referred
    to as Penguinistas.


    ![](img/8c9883c4544150d676aa7a1c159e9153_30_0.png)


    Figure 1-1: Tux, the Linux mascot


    # Why Should I Use Linux?


    People use Linux for different reasons. For many it is a matter of power, stability,
    multilingual capabilities, or even personal philosophy. However, for others, crass
    as it might sound, it is a matter of money. Just for a moment about what it usually
    costs to get started with an operating system. Go to wherever you go to buy software,
    and take a walk down the aisles. Make a list in your head of all the things you
    want to buy and how each costs: an office suite; a game or two; maybe a graphics
    program with which to make yourself look better in your digital photos; and a
    collection of all firewall, antivirus, antisym, and anti-antiaware programs that
    you really need to protect yourself in the Windows world. Now do the math.


    After you pick yourself up off the floor, you will understand that we are talking
    big bucks here. On the other hand, for the price of this book you will have all
    of the things you wanted and more in the Linux world. Despite the'
  merge: -1
