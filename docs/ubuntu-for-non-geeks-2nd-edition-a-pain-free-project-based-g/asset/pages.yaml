  md: '# 9B-3: Converting the TuxCards RPM


    Now that the TuxCards RPM is in your home folder, you can convert it to an Ubuntu-friendly
    DEB package by typing the following command and pressing ENTER:


    ```

    sudo alien --scripts tuxcards*.rpm

    ```


    After you type your password, nothing much will seem to happen. Once Alien is
    doing its thing, however, you will get the message tuxcards_3.2.2_i386.deb generated
    (or something like that) in the Terminal window. If you look in your home folder,
    you will find the newly generated DEB package along with the original RPM.


    # 9B-4: Installing the Newly Generated TuxCards DEB Package


    You can now install the TuxCards DEB package by using the dpkg (Debian package)
    command with the -i (install) flag and then pressing ENTER. The command should
    be:


    ```

    sudo dpkg -i tuxcards*.deb

    ```


    If I haven''t won you over the world of commands (not that I''m trying to), and
    you still prefer going about things graphically whenever possible, you can install
    the TuxCards DEB package the same way you installed Skype in Project 9A—by double-clicking
    the DEB package and using the Package Installer window. It all works out in the
    end, so it''s strictly to you.


    # 9B-5: Running TuxCards


    Once TuxCards has been installed, you can run it via the Run Application applet.
    Just type tuxcards in the command box, and then click the Run button.


    # Compiling Programs from Source


    For the beginner, just the mention of compiling a program from source seems off-putting
    enough. The words compile and source seem to instill a sense of foreboding in
    the heart of the new user. That certainly was the case for me, anyway.


    However, this method of installing programs is it easier than it sounds. In fact,
    now that you have some experience using the Terminal and command line, it is just
    plain easy—a sort of one, two, three, and you''re done process.


    Of course, you can live long and without ever bothering to anything on your system.
    You can move along happily with your system as is, or you can just install programs
    by means of the very convenient Synaptic application, which you learned about
    in Chapter 5.'
  merge: -1
  pgno: 178
- img_proc: true
  md: 'So why would you want to bother compiling programs from source? Well, although
    there are lot of DEB packages that Synaptic can ease into your system, not every
    bit of software in Linuxdom is available in that format. Or perhaps you want the
    newest version of the software you have your eyes on, but the version via Synaptic
    is a slightly older version. Of course, there is that old human nature factor
    at play as well—there may come a time when curiosity gets the best of you, and
    you will want to just one step beyond the way you''re accustomed to doing things.
    After working through this short project, you will be able to do that, and I am
    sure you will find that your initial worries will have been for naught.


    # What Is Source?


    In order to understand what source is, you should understand a bit about how a
    program actually gets from its primitive state on the programmer''s computer to
    an up-and-running application on your machine. The first programmer writes a program
    in a programming language. You probably heard of programming languages as BASIC
    or C, and there are many others. The programmer actually writes with such a language
    is a set of instructions called the source code, or source. Your computer, however,
    cannot understand any of that on its own. It is as if the computer speaks ancient
    Greek, and the source code is all written in French. The computer needs some sort
    of interpreter to help it out.


    The various languages that programmers use are high-level languages—they are relatively
    easy for programmers to read. The computer, on the other hand, only understands
    low-level languages, which are quite difficult for most mortal programmers to
    deal with. To convert the high-level language instructions to a low-level language,
    the computer needs some other program to translate.


    This can be done while a program is running, in which case the translator usually
    scripts. Applications that using an interpreter are the PyWindows and Briscola
    applications in Chapter 8 are examples of script compilation.


    The problem with scripts is that they can be slower than the applications you''re
    familiar with because the computer must run an interpreter, interpret the source
    code, and run the actual application at the same time. This is like having a French
    book translated into Greek by a very slow interpreter—very slow indeed.


    As an alternative, most programs use a compiler instead of an interpreter. A compiler
    translates the high-level source code into low-level machine code, or object code,
    that the computer can understand before the application is actually run. Once
    this translation is done, the computer never has to bother with the high-level
    instructions again; it can merely read the translated version and every time it
    runs the program. This is like having a translated version of a foreign book that
    you can read any time you want. Because computers can run compiled programs without
    simultaneously using an interpreter, compiled programs faster than scripts. Most
    applications for all operating systems are, compiled.'
  merge: -1
  pgno: 179
- img_proc: true
  md: '# Tarballs: The Containers of Source


    Almost all packages come in the form of tarballs (tarballs, DEBs, and even the
    RPMs, such as those used in Red Hat-based systems, are all referred to as packages,
    which is why the icon for such files looks like a little parcel-box). As you learned
    in Chapters 6 and 8, tarballs consist of a group of files that have been archived
    into a single file, which is most often compressed to save disk space, like Zip
    files on Windows or SIT (Stuff) files on Macs. In Linux, the most common method
    of creating such archives is through the tar program, from which the tarball gets
    its name, the compression of which is usually accomplished by means of the bzip
    program. Compressed tar files, or tarballs, can then be recognized by their file
    endings, which are .tar.gz, or when compressed with the bzip program, .tar.bz2.


    As you learned in Chapter 8, the files archived in tarballs can be extracted by
    using the command line, but to keep things easy in this chapter, you can just
    use the simple double-click method that you used in Chapter 6, if you prefer.


    # The Basics


    As I mentioned before, the process of compiling an application from source and
    then installing it is actually simple. Basically, after untarning the tarball,
    you will use the following commands to accomplish the task:


    ```

    .configure To configure a makefile, which provides instructions for the make

    make command

    ```


    ```

    make install To translate the source code into object code that the computer can
    understand

    ```


    ```

    sudo make install To give yourself write privileges in protected folders and then
    install the application

    ```


    ```

    make clean To clean up the leftovers once the process is complete (to clean up
    the mess)

    ```


    I know that sounds like a lot of commands, but as I always say, it is easier to
    actually do what it looks like on the page, so fear not.


    # Installing the Tools You Need


    Because Ubuntu is designed with the average computer user in mind, it does not
    come with the various applications and libraries you need to compile applications
    from source. Fortunately, however, just about everything you need to get the job
    done is available via Synaptic. To get ready for the work at hand in this chapter
    (and many other jobs you are likely to do on your own in the future) perform searches
    for and install the following packages:


    +   - build-essential

    - checkinstall

    - libgtk1.2-dev'
