  md: '# 18


    # # DEFENDING THE NEST


    Security


    ![](img/8c9883c4544150d676aa7a1c159e9153_310_0.png)


    Many Windows user has entered the Linux fold after a host of bad experiences with
    malware in the Windows world—viruses, spyware, and all sorts of other malicious
    bits of software code, too numerous to imagine. Windows is also plagued by a seemingly
    endless array of security vulnerabilities, leaving the system easy pray to invaders
    with less noble intentions. Every trip into cyberspace becomes something like
    a run through the infectious diseases ward of a hospital. For a Windows user,
    it sometimes seems that more time is spent riding the system of viral pests and
    defending it from invaders than actually getting things done.


    Fortunately, Linux does not suffer greatly from such problems, leading to the
    much-touched claim that Linux is practically free and quite secure. There are
    numerous lines of reasoning proffered to explain Linux''s malware-and exploit-resistant
    nature. One reason is simply popularity—or lack thereof. As Linux is not as widespread
    as a system as Windows is, it is also a much less attractive target of digital
    evil-doers, who often seem to be motivated by the challenge and headline-catching
    glory that comes with creating a truly global virus or finding a heretofore unknown
    back door.'
  merge: -1
  pgno: 310
- img_proc: true
  md: 'Another reason is that Linux users, as a general rule, work on their computers
    in a non-privilege mode, one in which the user does not have the right to install
    software without a password. This is not the case, at least not by default, in
    Windows. A virus or other form of malware attached to an email or piggybacked
    upon another file or application can, therefore, install itself in your Linux
    system without... . . . well, theoretically, this is a point of at least an issue.


    There is also the matter of structural design. Every system out there security
    holes that can be exploited by digital and human foe. Windows might well be the
    Swiss cheese of operating systems in this regard. Of course, Linux has its holes
    too, though far fewer of them than Windows does; and Linux plugs them up through
    downloadable updates factor, once they are found.


    Finally, there is the defensive edge that Ubuntu''s pre-configured security policy
    brings—there are no incoming ports in Ubuntu desktop systems. This means that
    your Ubuntu Linux system is even less susceptible to unwanted intrusions.


    # Does My System Need Protection?


    So with all this talk about Linux''s great security, you might wonder whether
    you need to bother worrying about it all. Well, if you take a look at the Ubuntu
    forums, you might find yourself a bit confused. When asked Linux users need to
    install antivirus software or firewalls, most users answer with an emphatic *no*.
    On the other hand, you''ll find that there are an awful lot of people out there
    who have installed or are trying to install that software. Hmm.


    So what''s a Linux user to do?


    If you are on a network where you transfer a lot of files among a lot of Windows
    machines, you might want to think about installing some antivirus software, if
    not more than the good of the Windows systems involved and the users of those
    systems—your unlightened (i.e., Windows-using) email pals, for example. You might
    also want to give it a go if you are, by nature, on the cautious side of the spectrum.
    Basically, if it makes you feel safer to install some protection, go ahead. If
    it makes you feel safer to go hog and install the full line of defense mechanisms
    I cover in this chapter, go after. After either way you go, it''s not going to
    cost you anything, and it certainly isn''t going to hurt you any.


    # The First Line of Defense


    Regardless of the system you happen to be using (though I am assuming that you
    become a Linux devotee by now), the first line of defense for any computer permanently
    hooked up to the Internet is—an electronic'
  merge: -1
  pgno: 311
- img_proc: true
  md: 'device allows a number of computers on a local network (such as in your home
    or at your office) to connect to and share a single connection from your Internet
    service provider (ISP). While the router is connected to your modem via cable,
    the connection from the router to the computers on your local network can be wired,
    wireless, or other.


    What has a router got to do with the defense of your computer? Well, most routers
    include a firewall, which essentially functions to keep all of the bad stuff out
    there on the Web away from your computer, in the way the firewall in your car
    keeps the heat, fumes, and noise from your engine out of the passenger compartment.
    This built-in firewall is one reason even people with only one computer, could
    just as easily connect their computer directly to their or DSL modem, use a router.
    Of course, which filters you select in the firewall setup software depends on
    which. For example, a very common and useful filter (particularly for a wireless
    router) limits Internet access to those machines specified in the firewall''s
    access list. This prevents your next-door neighbors from hitching a wireless ride
    via your ISP connection. They aren''t paying the bill, after all.


    The setup for a router is built into the router itself, so you don''t have to
    worry about software installation and system compatibility. Using your router
    with Linux is no different than using it with Windows. You can access the setup
    and modify your settings via a simple web browser, as you can see in Figure 18-1.
    Just type the IP address of your router (usually provided in the owner''s manual)
    in the browser''s location bar, press Enter, and you''ll be ready to go.


    ![](img/8c9883c4544150d676aa7a1c159e9153_312_0.png)


    Figure 18-1: Setting up a router


    Defending the Nest 293'
  merge: -1
  pgno: 312
- img_proc: true
  md: '# Software Firewalls


    If you don''t have a router and don''t plan on getting one, or if you have one,
    but you are bordering on paranoia, you might want to consider using a soft- firewall,
    in particular one of the most popular software firewalls for Linux, Firestarter.


    You can download and install Firestarter via Automix by clicking Utilities in
    the left pane, selecting Gnome Security Suite in the right pane, and then clicking
    the Start button. Once it is installed, run Firestarter by choosing System Administration
    ► Firestarter. You will be prompted for your password, so type that, and click
    the OK button.


    Firestarter will open with a pretty self-explanatory wizard the first time out.
    If the wizard doesn''t seem all self-explanatory to you, and you''re not sure
    what to do, just accept the default settings by clicking the Forward button in
    each of the wizard screens until you get to the last one (shown in Figure 18-2).
    In Save, make the box that Start firewall now checked, click the Save button,
    and then click Quit. When the wizard is finished, the main network device was
    detected and selected, the firewall will be up and running.


    ![](img/8c9883c4544150d676aa7a1c159e9153_313_0.png)


    Figure 18-2: The last screen of the Firestarter setup wizard


    If the wrong network device was selected, a warning window will appear telling
    you. In that case, you can do a bit of trial-and-error manipulation by clicking
    the Preferences button in the main Firestarter window and clicking Network Settings
    in the Preferences window that appears (Fig- 18-3). In that window, select one
    of the other devices in the drop-down menu next to the words Detected device(s),
    and then click the Accept button. Once back at the main Firestarter window, click
    the Start Firewall button, and see what happens. If you still can''t start the
    firewall, repeat the process I''ve described, this time selecting a different
    network device.'
  merge: -1
