    # Choosing a Screensaver


    Screensavers used to be a must-have (and must-use) item for computer users who
    wanted to prevent damage (burn-in) to their monitors. Video display technology,
    has now advanced to the point where screensavers are no longer completely necessary.
    Nevertheless, screensavers are cool to look at, and one nice thing about Ubuntu
    is that it comes with an unusually collection of screensaver modules—nearly 200
