  md: '# 6


    # A TIDY NEST

    File and Disk Handling in Ubuntu


    ![](img/8c9883c4544150d676aa7a1c159e9153_98_0.png)


    No matter which operating system you are using, you have to deal with files. Some
    people are very organized, placing every file in a logically named folder as soon
    as that file is saved for the very first time. Then there are people like me,
    who save everything to the desktop until it is full of junk that they can no longer
    make out the wallpaper, and only at that point they start organizing in earnest
    (if placing all of those files in a single folder called March17Cleanup can be
    called organizing). Ah.


    Of course, files not only get stored on your hard disk, flash drives, and other
    copied to and from CDs, DVDs, external hard disks, storage media and devices.
    They are also often saved in archives, which are then compressed to reduce their
    spatial footprint, making them easier to send via email or fit onto spatially
    challenged removable storage media.


    With that intro, you may have already guessed that in this chapter I will be dealing
    with file handling in Ubuntu, particularly in relation to the Nautilus File Manager,
    which is at the heart of GNOME''s file-handling capabilities.'
