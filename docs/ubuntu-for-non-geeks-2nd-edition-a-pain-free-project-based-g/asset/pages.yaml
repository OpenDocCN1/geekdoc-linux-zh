    # Why Are My Scanned Images So Big?


    To wrap up on scanning (and, for that matter, this chapter), let me address a
    question that seems to confuse a lot of people. One of the first areas of confusion
    is that there is a general blurring of how the terms *ppi* (pixels per inch) and
    *dpi* (dots per inch) are used. Most applications use these terms interchangeably,
    and yet they aren''t really the same thing. To make things simple, when you are
    talking about images on your screen, you are talking about *pixels* (the little
    squares that make up your screen) per inch, and when you are talking about printer
    resolution, you are talking about *dpi* (of printer inch).


    Your computer screen generally has a resolution of 76ppi, while modern inkjet
    and laser printers have a resolution of 300 to 1200dpi, or sometimes even more.
    This means that a photo scanned at 76ppi, looks just fine on your screen, ending
    up pretty lame when you print it out. On the other hand, when you scan a picture
    at 300ppi, the image will look much better in your printout but seem gigantic
    on your screen. This makes sense, as the resolution of your image is more than
    three times of your computer screen''s resolution. The result is that your computer
    can accommodate the higher resolution of the image only by displaying that image
    three times its original size.


    186 Chapter 10'
  merge: -1
  pgno: 205
- img_proc: true
  md: 'As an example, have a look at Figure 10-11, where you can see an identical
    image scanned at three different resolutions: 76ppi, 150ppi, and 300ppi. As you
    can see, the 76ppi image at the far left (measuring $5 \times 6$ inches—the size
    of the hard copy itself) is the smallest, while the other two images are proportionally
    bigger (about $10 \times 12$ inches for the 150ppi image and about $22 \times
    25$ inches for the 300ppi image).


    ![](img/8c9883c4544150d676aa7a1c159e9153_206_0.png)


    Figure 10-11: The same image scanned at three different resolutions


    # What Resolution Should I Use When Scanning?


    What resolution you use when scanning really depends on a variety of factors,
    the most important of which is what you plan to do with the image when you''re
    finished. When I look at Figure 10-11 on my computer screen, the smallest image
    looks best, the middle image looks okay, and the largest looks a bit odd, not
    as sharp as the other two. Basically, when scanning images for display on a computer—on
    web pages, for instance—it is best to stick with a ppi similar to typical scanning
    resolutions or slightly larger: 76 to 150ppi.


    When it comes to printing, a whole new set of considerations comes into play.
    First of all, there are the limitations of your scanner, since different models
    have different maximum resolutions. The resolution limits of your printer itself
    are also, naturally enough, a major consideration. For example, laser printers
    and inkjet printers have different characteristics; laser printers will produce
    better-quality than inkjet printers, while inkjet output will be more affected
    by the type of paper used than a laser printer will be.


    Of course, your printed output is not going to suffer if you scan images at higher
    resolutions than those at which you plan to print them out, but you will end up
    with a lot of files taking too much disk space. Remember: The higher the resolution
    of a scanned image, the greater the file size in terms of disk space. If this
    is of concern to you, you can simply resize the images you''re'
  merge: -1
  pgno: 206
- img_proc: true
  md: 'done printing using an application such as the GIMP (more on that in Chapter
    14), but if you would prefer not so cavalier with your use of disk space from
    the get-go, you can follow these very general guidelines:


    +   * If you are using a laser printer, scan at the same resolution at which you
    are going to print.

    * If you are going to use an inkjet printer with photo-quality paper, scan at
    about 80 percent of your target printout resolution—about 240ppi for a printout.

    * If you are using an inkjet printer with regular paper, scan at about 65 percent
    of your target printout resolution—about 195ppi for a 300dpi printout.


    Needless to say, these are just suggestions to get you started. What works best
    for you and your particular scanner/printer setup may be slightly different. Nothing
    works better than a bit of experimentation and trial and error. In this case,
    you can''t really go wrong. Just give yourself some time, don''t get frustrated,
    and, most importantly, don''t wait until you desperately need to scan something
    before trying things out—stay ahead of the game.'
  merge: -1
