  md: '# Dependable and robust


    I know these terms come across as mere hype, but after smack Ubuntu around a bit,
    you come to understand what they mean. Knock things down and around, and they
    bounce right back—this is very important for beginners who often have a knack
    for screwing things up. Nothing turns a new user more than a twitchy system that
    has to be gloved all the time.


    # Desktop user-oriented


    A lot of Linux distributions, although quite capable in the desktop area, cater
    more to geeks and developers, taking up valuable disk space with a lot of junk
    you''ll probably never use. Ubuntu''s purpose is to grab desktop market share
    from the Red folks, so the needs of the common end user are always in mind. The
    result is Ubuntu''s GNOME desktop environment is a very comfy place for the average
    desktop user to be.


    # Hardware Compatibility


    Well, enough of this background babble; it''s time to get things rolling. If you
    haven''t installed Linux on your machine yet and are wondering whether you can,
    it is relatively safe to say that Ubuntu will run on most machines you have today.
    Of course, this statement has a major caveat: you will never know until you get
    up and running. There are so many minor parts to your machine that it is difficult
    to say whether each part will cooperate with your installation. Ignoring minor
    parts for the time being, there are video cards, sound chips, LAN cards, monitors,
    and so on, and they all need to be considered.


    # Diving In


    If you are going to buy a new machine on to run Ubuntu, then it is reasonable
    enough to do a bit of worrying and check things out first, but if you are going
    to install it on the machine you have, I recommend just diving in. After all,
    you don''t really have to install anything the first time out. You have a live
    CD right here in this book, after all, so you can just pop CD in your drive, boot
    up your machine, and sniff, bam, zowie, you''ll be up and running (or) in a minute
    or two. Everything is going to be as you well ... your worries are over, and you
    can go ahead and install the system when you''re ready and waiting. That is one
    of the Ubuntu advantages—not only do all the essentials fit on a single CD (compared
    to four or more for other distros), but that CD is both a live operating environment
    and the installer! You can''t get more convenient than that.


    # When Research Is Required


    If things don''t work out with the live CD, you can search the Web to see if you
    identify what part of your hardware puzzle is causing your problems. (Or if you
    are looking for a machine on to install Ubuntu, you can search for hardware that
    is supported by Linux.) Of course, before you do'
