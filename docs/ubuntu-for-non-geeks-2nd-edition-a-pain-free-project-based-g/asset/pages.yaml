    In this case, you can simply close the INSTALL file, as it prescribes the same
    steps as I''ve listed below. However, in the future, when you install other programs
    from source, you will need to follow the instructions in the INSTALL files that
    come with the source files for these programs. With most INSTALL files, the instructions
    will match those that follow, though I would suggest using the alternative method
    I''m presenting for the make install step.'
