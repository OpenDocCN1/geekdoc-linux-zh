    can get this from the Xmahjongogg project at www.lcdf.org/xmahjongogg. Download
    the tarball xmahjongogg-3.7.tar.gz or a newer version if there is one. Do not
    download any of the other file types available on that page.


    If you prefer, you can install the Xmahjongogg tarball by using the wget command
    that you learned in Chapter 8. Just open a Terminal window, type the following
    command, and press ENTER.


    ```

