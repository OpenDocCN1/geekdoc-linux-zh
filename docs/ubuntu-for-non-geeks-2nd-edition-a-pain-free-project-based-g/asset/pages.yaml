    # More Panel Fun


    In addition to the basic customization you did in Project 3A on page 35, you can
    do a lot to change the look and feel of your panel. Of course, you can remove
    any of your launchers, drawers or menus by right-clicking the item in question
    and then selecting Remove Panel in the popup menu, but there are still more options.
    Most of these are available by right-clicking any open space in the panel and
    selecting Properties, which will bring up the Panel Properties window.


    From this window you can change the position of the panel, after its size, change
    its color, or make it transparent—very cool. You can also set the panel so it
    will automatically disappear when you are not using it and have it reappear when
    you move your mouse cursor into the area where the panel normally resides. Don''t
    feel afraid to play around and give things a try—that''s half the fun!


    # Project 3B: Manipulating Menus


    Now that you have learned about some of the cool and useful things you can do
    with your panel, let''s now move on to the topic of menus. A very nice feature
    of GNOME is that it allows you to edit your menus. You can add launchers, remove
    items, menus, and even change the icons that appear within the menus. In all in,
    you have a lot of control over things, but for this project, we''ll limit our
    work to these two areas: changing icons and moving menus.


    # 3B-1: Changing Icons Within Menus


    As you doubt recall, one of the problems with the OpenOffice.Writer and Calc launchers
    we added to the panel was that they shared similar icons. If you go to Applications
    Office, you will see that the icons for the various OpenOffice modules, although
    not the same, are a bit similar.'
