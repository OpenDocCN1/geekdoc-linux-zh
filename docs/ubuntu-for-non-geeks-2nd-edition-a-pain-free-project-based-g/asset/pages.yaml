  md: '# Playing Tracks on Your iPod with gtkpod


    You can use gtkpod to play the tracks on your iPod, though gtkpod must use a helper
    application to do so, as it has no playback capabilities of its own. The default
    helper app for this purpose is XMMS, which is not a bad choice, especially if
    you want to have headache-free AAC file support.


    Of course, if you haven''t installed XMMS, you will need to install it or choose
    a different helper, as Rhythmbox or amaroK. To install XMMS, run Synaptic and
    search for *xmms* and if you want AAC playback support, *xmms-mp3*. To change
    the audio helper application for gtkpod, open the gtkpod Preferences window by
    going to the **Edit** menu and select **Edit Preferences**. Once in the Preferences
    window, click the **Tools** tab, and then change the command in the uppermost
    box from *xmms* to rhythmbox or elever whatever app you prefer. Once your choice
    is made, click **Apply** and then click **OK** to record your tracks and close
    the Preferences window.


    # Fin Up the Job with gtkpod


    Once you''ve done all you want to do with gtkpod, click the **Load iPod(s)** button
    to save any changes you''ve made to the files on your iPod. Then right-click your
    iPod''s icon in the left pane of the gtkpod window and select **Eject iPod**.
    If the desktop icon for your iPod does not appear after that, right-click it,
    and select **Eject**. When the desktop icon disappears, you can disconnect your
    iPod from your computer.


    # Floola and YamiPod


    There is another pair of iPod management applications that might be of interest
    to you as alternatives to gtkpod: Floola and YamiPod. Both are relative newcomers
    to the iPod file management arena, but they are attractive and capable alternatives
    with significant followers. In addition to their clean interfaces, both allow
    audio-direct and helper-less playback (which gtkpod doesn''t), and their playlist
    creation and handling is more refined.


    # Downloading, Installing, and Running Floola


    As of writing, neither Floola nor YamiPod are available via Automix or Synaptic,
    so you''ll probably need to download them from each project''s website. To get
    Floola, go to floola.com and download the linux (GTK) version. When Firefox asks
    you what to do with the file, accept the default **Open with Archive Manager**
    by clicking **OK**, and then extract the Floola-linux folder to your home folder.
    You can run Floola by opening the Floola-linux folder and double-clicking the
    Floola binary file. Floola, as shown in Figure 16-6, should appear.'
