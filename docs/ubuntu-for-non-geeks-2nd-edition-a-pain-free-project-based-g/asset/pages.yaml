    # # Gnome Storage Devices


    No chapter dealing with file handling and storage would be complete without touching
    the topic of USB storage devices, so that is exactly what I will now turn. Unless
    you have been using a digital radical for the past few years, you no doubt well
    familiar with USB devices. Your printer is very likely a USB device, as is your
    scanner. And although your digital camera is not a USB device in the traditional
    sense, chances are that every time you connect it to your computer in order to
    transfer photos, you are doing so via a USB connector.


    Among the most popular USB devices out there are for file storage. These include
    external hard disks, flash memory card readers, and tiny, finger-sized devices
    known as *flash drives* (6-16). Flash drives are especially popular today, and
    deservedly so: they are quite inexpensive, extremely handy when you need to transfer
    fairly large, but not gigantic, amounts of data from computer to computer (from
    work to home, for example); and pretty safe in terms of cross-platform (including
    Linux) compatibility.'
  merge: -1
  pgno: 115
- img_proc: true
  md: '![](img/8c9883c4544150d676aa7a1c159e9153_116_0.png)


    Figure 6-16: USB storage devices


    # # Putting USB Storage Devices to Work


    Let''s start with some good news here by pointing out that working with USB storage
    devices is really easy. Just plug the device into one of the USB ports on your
    computer. The LED on the device will do a bit of blinking as the system reads
    what''s on it, and after that, a disk icon for that device will appear on your
    desktop. A few moments later, a Nautilus window will open, revealing the contents
    of the device. You can then copy files to and from the device using the drag-and-drop
    or copy/and-paste procedures I mentioned earlier in this chapter.


    Once you are done and wish to remove the device, right-click its desktop icon,
    and select Unmount in the popup menu. If there is any data that needs to be written
    to the device, the system will start writing and tell you so in a message at the
    bottom-right corner of the screen (shown at left in 6-17). Another message will
    appear in the same location where the writing process is complete, telling you
    that it is safe to remove the drive from the USB port (Figure 6-17, right).


    ![](img/8c9883c4544150d676aa7a1c159e9153_116_1.png)


    Figure 6-17: Ubuntu lets you know what is happening with your USB drives


    A Tiny Nest 97'
