- img_proc: true
  md: 'To perform the adjustments as instructed in the README file, just follow

    these steps:


    +   1. Find the Tk file, called Wish, by typing locate wish in the Terminal

    window and pressing ENTER, and note the location given on a piece

    paper. It should be /usr/bin/wish.


    +   2. Direct the Terminal to the briscola folder by typing cd briscola and

