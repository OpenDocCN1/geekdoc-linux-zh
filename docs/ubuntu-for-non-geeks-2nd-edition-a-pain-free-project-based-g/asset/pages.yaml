  md: '# 7


    # # DRESSING UP THE BIRD


    Customizing the Look and Feel of Your System


    ![](img/8c9883c4544150d676aa7a1c159e9153_120_0.png)


    Before entering the world of Linux, I had used just about every desktop operating
    system around. Despite the differences among them, however, one thing that I eventually
    suffered from each case was a kind of visual boredom. I suppose you might call
    it GUI fatigue. It wasn''t that I was tired of using a graphical interface; it
    was just that I couldn''t help but get sick of looking at the same old icons,
    window borders, and color schemes. Of course, there were changes that could be
    made, but it just wasn''t possible to get around the basic look and feel without
    add-ons that demanded a price in terms of performance.


    One of the features of Linux that pleased me to no end, and continues to do, is
    that users can drastically change the look of things. I don''t mean just the icons
    and backgrounds, but everything, including the actual window borders and controls.
    Add to that the variety of graphical desktop environments and window managers
    available for Linux, and you have a totally customizable system. Is it any wonder
