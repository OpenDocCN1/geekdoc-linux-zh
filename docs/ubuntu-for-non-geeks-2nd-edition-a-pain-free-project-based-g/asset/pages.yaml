  md: 'only want to rip and encode a few of songs in the list, it might be better
    to first go to the Edit menu, select Deselect All, and then check the checkboxes
    next to the songs you want to rip before clicking Extract.


    While the songs are being ripped and encoded, Sound Juicer will show you your
