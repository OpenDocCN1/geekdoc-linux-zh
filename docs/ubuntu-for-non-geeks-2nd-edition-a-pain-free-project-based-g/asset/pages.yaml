  md: '# 9C-3: Installing Xmahjongg


    Normally at this point of the process, you would type sudo make install and press
    ENTER, after which the files were compiled in the make step would be installed
    in various locations throughout your system. You would then follow this up with
    the make clean command to tidy things up in the Xmahjong folder by getting rid
    of any unnecessary files.


    This traditional approach works fine enough, but things can get a bit messy if
    you find yourself wanting to upgrade or remove the application later on, as you
    have to keep track of where everything is and remove each item piece by piece
    using a series of sudo commands. Sometimes an application package will provide
    a make install routine, but such routines don''t always work perfectly, aren''t
    available for every package, and require you to keep the project folder on your
    hard disk in order for you to perform the procedure.


    If you are a traditionalist, you go ahead and install Xmahjongg in this traditional
    manner. In the same terminal that you performed the ./configure and make steps,
    just type sudo make install, and then press ENTER. You will be prompted for your
    password, so type it, and press ENTER again. Xmahjongg will be installed and ready
    for use.


    # The Alternative Installation Method


    The traditional installation step is fine enough, but because of the limitations
    I mentioned in terms of removing the application, I recommend finishing things
    off in a slightly different way. What are you going to do, assuming you are willing
    to go this route, is to skip the make install step and instead convert the compiled,
    uninstalled, application into a DEB package, and then install it. By doing this,
    you can remove the package quite easily using Synaptic whenever the desire strikes.
    Having a DEB package for your application, you don''t need to keep the project
    folder, and you save on hard disk. To install the DEB package, here''s what you
    need to do:


    +   1. Make sure that Add/Remove Programs, or any other APT installation tool
    is closed. As I mentioned before, you cannot have two APT tools running at the
    same time, and after all, checkinstall will be installing a DEB package.


    +   2. Assuming you are using the still-open Terminal window in which you entered
    the make command, type sudo checkinstall, and then press ENTER.


    +   3. A message will soon appear in the Terminal telling you the ./doc-pak directory
    does not exist, and asking you if the program will create it. You want it to,
    so type Y, and press ENTER.


    +   4. The checkinstall program will then begin performing a mock install, after
    which it will create the DEB package. Before completing the process it will ask
    you for a description of the package. Type something like an easy-to-see Mahjongg
    game, press ENTER, and then press ENTER again.'
  merge: -1
  pgno: 184
- img_proc: true
  md: '5. You will be presented with a screen, such as that in Figure 9-8, giving
    you the chance to change the package information. You don''t need to change anything,
    just press ENTER.


    ![](img/8c9883c4544150d676aa7a1c159e9153_185_0.png)


    Figure 9-8: Accepting checkinstall default package information


    6. The checkinstall program will finish up the packaging of the DEB package, install
    it, and then let you know when it is done.


    And that is that. The Xmahjogg is now installed on your system, and you will find
    an Xmahjogg DEB package within the Xmahjogg folder. You should move DEB package
    to a safe place, such as a Tarballs or Software folder (or whatever you choose
    to call it) so that you can use it if you need some to reinstall your system.
    Once you''ve moved the DEB package, dump the Xmahjogg folder, assuming it is in
    your home folder, by typing `cd sudo rm -r xmahjogg*` and pressing ENTER.


    > NOTE The semicolon, surrounded by spaces on either side, is used to separate
    commands on a single line. In following the directions given, you are really performing
    two operations in a single line: `cd and sudo rm -ir xmahjogg*`


    # 9C-4: Running Xmahjogg


    As a general rule, programs compiled from source do not automatically install
    a launcher you must intend run them by command. Although you can run a program
    for the first time by typing a command in the Run Application panel applet, it
    is better to run the program for the first time by typing the command in your
    Terminal window. If anything has gone amiss during installation, the Terminal
    will tell you what the problem is, whereas the Run Program method would leave
    you wondering what''s going on.


    To run Xmahjogg, just type xmahjogg in a Terminal window, and then press ENTER.
    If everything goes as it should, you can create a program launcher for Xmahjogg
    in your Applications menu, on the GNOME Panel, or in a panel drawer.'
