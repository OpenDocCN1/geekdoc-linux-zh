  md: 'In your GNOME Panel, click the Wanda, OpenOffice.org Writer, and Firefox launchers.
    You will have three windows open in your present desktop, workspace. Now look
    at the Workspace Switcher to the right of the bottom panel. There will be four
    boxes, with the one on the left, your present workspace, in brown. Click one of
    the gray-out boxes, and all your open windows will suddenly disappear.


    Actually, nothing has really disappeared—you are just viewing a new desktop. All
    your windows are still open and running in the present desktop. In this second
    desktop you can open something else: Go to the Applications menu, and select Games
    ▸ AisleRIOT Solitaire. The AisleRIOT Solitaire game will soon appear.


    You now have windows open in two different desktops, and you can switch back and
    forth between them. To do so, just go to the Workspace Switcher in your panel
    and click the first gray box, which will take you to your original desktop. Once
    you done, the box where you were in just gray, and you then click that to go back
    to your game desktop.


    As you can imagine, this feature has some potential benefits for you, adding to
    helping you avoid clutter. Imagine that you are at typing some long document in
    OpenOffice.org Writer. Eventually, you get tired and decide to goof off a bit
    by playing a game, such as Mines. To do this, you switch to another desktop where
    you open and play the game. A bit later, when you notice your boss making the
    rounds of the office, you simply switch back to the first desktop so that you
    look busy when he walks and by, “Keeping yourself busy, Boaz?”


    Phew!


    By the way, you can also switch between virtual desktops by simultaneously pressing
    and holding CTRL-ALT and then pressing your left and right cursor keys to move
    to your targeted desktop.


    # Moving Running Applications Between Virtual Desktops


    So what happens, let''s say, you are running OpenOffice.org Writer in one workspace
    and the GIMP in another, but suddenly think that it would be handy to have both
    running in the same workspace? Do you question the GIMP and start it up again
    in the other desktop? Fortunately, things are simpler than that, and there are
    actually two ways to get the job done.


    The first of these ways is to right-click on the title bar of the window you want
    to move, and then select Move to Workspace Left or Move to Workspace Right. If
    it isnt confusing to select Move to Another Workspace, and then select the workspace
    I want to move the window to number: Workspace 1, Workspace 2, and so on.


    Another way to move from one workspace to another is via the Workspace Switcher
    on the bottom panel. Within the four boxes of the Workspace Switcher, each representing
    a different workspace, tiny icons will appear for each of the windows you have
    open in a given workspace. The icons, as you can see in Figure 3-14, will resemble
    the shape of the actual windows you yourself. You can use these icons to move
    windows from one workspace to another using a basic drag-and-drop maneuver.'
