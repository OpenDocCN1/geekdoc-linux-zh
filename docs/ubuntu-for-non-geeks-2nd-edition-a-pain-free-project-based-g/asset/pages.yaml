  md: '# A Couple of Other Totem Features


    There are a couple of other cool features in Totem that you might like to know
    about. Its is ability to perform screen captures of whatever video you happen
    to be viewing at the time. Just go to the Edit menu, select Take Screenshot, and
    you''ve got yourself a screen capture—a still image taken from a file.


    Another feature worth mentioning is Totem''s Sidebar. As you no doubt, at the
    bottom-right corner of the Totem window, there is a Sidebar button. If you click
    that button, a new pane will open at the right side of the Totem window. In that
    pane you can load, create and save playlists. Such lists can consist of any combination
    of supported video or audio files, providing you with the whole multimedia banana.
    Any time you play a file in Totem, that file appears in the Playlist pane, but
    you can add items to the list by simply dragging the files from your desktop or
    Nautilus window.


    # Using Your Digital Video Camera


    Although they haven''t achieved the ubiquitous status of digital cameras, digital
    video cameras have become increasingly common in recent years. Likewise, Linux
    support for still digital cameras is quite good, its support for DV cameras can
    be... well, let''s say it''s "progressing."


    Don''t be discouraged by my tone in that last sentence, though. You should have
    no trouble downloading video from your camera to your computer, editing those
    video files, and adding effects and subtitles. To be honest, there are some problems,
    especially in the area of file format conversions, but with all things Linux,
    it will only be a matter of time until the wrinkles are ironed out. There are
    also a couple of cool video editing apps, that not quite ready for quick use seem
    promising and are worth an eye on: PiTiVi and Diva.


    For the time, however, the application of choice for the digital camera user is
    Kino. Kino, shown in Figure 17-6, is an iMovie-like application with which you
    can capture video from your camera and then edit it. To install Kino, run Automatix,
    click Media Players and Editors in the left pane, click Kino in the right pane
    and then click the Start button. Once it''s installed, you can run Kino by going
    to the Applications menu and selecting Sound & Video Kino.


    # Capturing and Editing Digital Video with Kino


    Once you have gone through the preparatory steps I''ve just mentioned, you are
    ready to capture video from your camera. To do this, connect your camera to your
    computer by FireWire cable (if it isn''t still connected), turn on your camera
    to Play mode, and then start up Kino. Once Kino is open, click the Capture tab
    to the right of the playback pane.'
