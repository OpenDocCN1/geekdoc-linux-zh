  md: '# 10


    # GUTENBIRD

    Setting Up and Using Your Printer and Scanner


    ![](img/8c9883c4544150d676aa7a1c159e9153_194_0.png)


    Two of the most common computer peripherals are printers and scanners. This only
    makes sense, as it is those tools that turn a web-surfing, game-playing, music-churning,
    number-crunching box of chips into a meaningful production tool—a virtual publishing
    house, if you will. These two tools help you convert digital information into
    hard copy (in the case of printers) and hard copy into digital information (in
    the case of scanners). It is not surprising, therefore, that these tools often
    come together these days in the form of multifunction printers.


    In this chapter, you will learn how to connect these useful devices to your computer,
    how to set them up, and how to use them. If you''re more into working with your
    digital camera than with a scanner, you might want to sneak a peek at Chapter
    14; otherwise, put on your printer''s smock, and follow on. . . .'
  merge: -1
  pgno: 194
- img_proc: true
  md: '# Printers


    Unless the only thing you use your computer is for playing games, listening to
    MP3s, or stopping doors on hot, breezy days, you will no doubt want to hook up
    your machine to a printer. Despite the paperless office era that the personal
    computer was supposedly going to usher in, it seems the computer''s strength as
    a desktop-publishing and general work tool has made producing high-quality printed
    documents an even more attractive than ever before.


    # Confirming That Your Printer Is Supported


    Setting up a printer to work with your new system is a pretty easy task, but you
    do have to make sure that your printer is supported by Linux. Fortunately, it
    seems that support in the Linux world is getting much, much better than once was.
    In general, support for Epson, Brother, Samsung, and Hewlett-Packard printers
    is pretty good, while support for other makers and other printer types is a bit
    spottier, though improving.


    If you really want to make sure your printer is supported (and wouldn''t you?),
    the best thing to do is go to www.linuxprinting.org. On that site, you can check
    the online database to see if your printer is currently supported and, if so,
    to what degree. Listings for supported printers also include information on what
    drivers are best for your purposes. If you''re thinking of buying a printer, there
    is also a page of suggested makes and models. Read this before making your purchase
    decision. You might also want to consult Ubuntu''s list at https://wiki.ubuntu.com/HardwareSupport-ComponentsPrinter


    # Setting Up Your Printer


    If you have a USB printer, get started by connecting it to your computer and powering
    up the printer. If your printer connects to your computer''s parallel port, you
    will first have to turn your computer off, connect your printer to the computer,
    turn on the printer, and start your computer. Of course, if your printer was connected
    and on during installation, you can skip this step. Either way, your printer will
    be detected, though you won''t get one of these immediate new-hardware-found alerts
    that you do in Windows.


    Once your system has restarted, here is what you need to do:


    +   - Go to the System menu, and select Administration Printing.

    - A window will appear, showing a printer with the name New Printer. Double-click
    that icon, after which a setup wizard will appear (Figure 10-1).


    The name of your printer should appear in the pane below the words Use a detected
    printer, due to the wonders of plug and play (which means your printers, scanners,
    and other devices can tell your computer what they are). Unfortunately, just because
    your system knows which'
  merge: -1
  pgno: 195
- img_proc: true
  md: 'printer you have hooked up to hardware-wise doesn’t actually mean it can communicate
    with that printer in terms of printing (ditto for Windows and Mac OS X). That’s
    what drivers are for.


    ![](img/8c9883c4544150d676aa7a1c159e9153_196_0.png)


    Figure 10-1: The printer setup wizard


    3. Continue by clicking the Forward button, which will take you to the second
    page of the wizard, shown in Figure 10-2.


    ![](img/8c9883c4544150d676aa7a1c159e9153_196_1.png)


    Figure 10-2: Selecting the make and model of the printer in the printer setup
    wizard'
