    be split into several files, the number of which depends on the length of the
    video played.


    You will notice that after you click the Capture button, the video playback in
    the playback pane will stop moving. This is the case, you will need to view the
    action in your camera''s view in order to know where you are in the capture process.
    When you get to the point where you click the stop button. You can then view the
    captured video by clicking the Edit button and then using the playback controls
    at the bottom of the back pane. You can also see the video in Timeline view (as
    shown in Figure 17-7) in order to navigate between the various segments of the
    video; click the Timeline tab, the segment you wish to view, and then use the
    playback controls below the playback pane.


