  md: '# 14


    # BRUSH-WIELDING PENGUINS


    Linux Does Art


    Now that you know that you can get down

    to business in Linux, it is time to don that

    beret of yours and address the artistic side of

    things. Yes, Linux does art, and as you will soon

    find out, there are a good number of programs on your

    system that allow you to create and manipulate graphic files. These days,

    however, there is perhaps nothing as important to most users'' graphical

    retoires as their digital cameras, so that is where we''ll begin.


    # Project 14A: Digital Cameras


    While scanner support for Linux is still a bit spotty, support for digital

    cameras is significantly better. Linux supports over 800 cameras through the

    gPhoto2 digital camera software package, which comes bundled with your

    system. What gPhoto2 essentially consists of is a collection of drivers that

    works in the background to tell your computer how to communicate with

    your camera. To see if your camera is supported, go to the gPhoto2 website

    (www.gphoto.org), scroll down, and click 800 cameras (the number may'
  merge: -1
  pgno: 244
- img_proc: true
  md: 'actually be higher when you check. On that page you will find a complete list
    of all the cameras supported by gPhoto2. If your camera isn''t on the list, it
    likely means (as the page points out) that your camera is so old that there is
    little enough demand for support for it or it is so new that there has been enough
    time to support it. Of course, gPhoto2 is constantly being updated, so if your
    camera isn''t on the list, it could be in the near future. Updating gPhoto2 with
    Synaptic now and again will keep you up to date as possible.


    If your camera is not supported by gPhoto2, all is not lost. There are some cameras
    that utilize the USB Mass Storage function, without the help of gPhoto2, as USB
    storage devices, just like a thumb drive or USB external disk. You can access
    the photos on such cameras as you would data on any other USB storage device—connect
    it to your computer, and Nautilus window appears its contents. You can then transfer
    files via conventional drag-and-drop procedures.


    Even if your camera doesn''t seem to communicate with your computer by either
    of these methods, you can still get your images to your hard by removing the memory
    card from your camera, inserting it into a USB flash memory card reader, and plugging
    reader into one of your USB ports. Once you''ve done that, your system will mount
    the reader as if it were an external drive (which is pretty much what it is),
    allowing you to use simple drag-and-drop procedures to get the images to your
    hard. Of course, you can use this method if your camera is supported by gPhoto2
    or compliant with the USB Mass Storage protocol—sometimes it is the easiest way
    to deal with things anyway.


    # 14-1: Connecting Your Camera and Starting the Import Process


    If your camera is supported by gPhoto2 and you prefer to access your photos directly
    from your camera rather than fiddle with flash storage cards (or if you''re not
    sure whether your camera is supported or not), connect the USB cord supplied with
    your camera to the camera itself and to one of the USB ports on your computer.


    Once you''ve done that, turn the camera on, and let it communicate with your computer.
    Switching the camera to Play mode, rather than Camera mode, usually does the trick,
    but you should check your owner''s manual to be sure. If your camera is supported
    by gPhoto2, and the chances of that are quite good, a small window will appear,
    showing in Figure 14-1. To view the images on your camera, click the Import Photos
    button.


    ![](img/8c9883c4544150d676aa7a1c159e9153_245_0.png)


    Figure 14-1: Your system seeks your approval before importing photos from your
    digital camera.


    Chapter 14'
  merge: -1
  pgno: 245
- img_proc: true
  md: '# 14A-2: Setting Up and Cleaning Up Before Importing the Images


    After you have clicked the Import Photos button in that first window, another
    window (Figure 14-2) will appear displaying the photos currently in your camera.
    In this window, you can do a little housekeeping and setup before saving photos
    to your hard disk.


    ![](img/8c9883c4544150d676aa7a1c159e9153_246_0.png)


    Figure 14-2: Importing digital photos from a camera


    If you would like to delete all of the photos on your camera after importing them,
    check the box next to the words *Delete imported images from the camera*. If you
    would like to delete only a few images before getting around the business of importing,
    click on the image or images you want to delete (holding down the CTRL key if
    selecting more than one), and click the Delete icon.


    As you can see, there is also an option that allows you to keep the original filenames
    assigned by your camera. I will tell you that not selecting this option means
    instead. When you import images from your digital camera, they will be saved in
    a folder and named in date-and-time-format, such as 2006-02-19-19.08.13, while
    the images within that folder will be saved in numeric format, such as 0002.jpg.
    If you prefer to keep the filenames assigned by your camera (and as they appear
    in the Import Photos window), check the box to *Keep original filenames*.


    Finally, there is the question of where you save these date-and-time named folders.
    The default location is in your home folder, which is convenient enough; however,
    if you take a lot of photos, you will find that after some time your home folder
    contains so many folders it is difficult to find anything. you may want to have
    your photos downloaded to a more specific location, such as a Photos folder.'
  merge: -1
  pgno: 246
- img_proc: true
  md: 'To do this, click the drop-down menu button next to the word Destination, and
    select Other. This will bring up a Choose Destination Folder window. In that window,
    navigate to your Photos folder (or create one by clicking the Create Folder button
    in that window), and select that folder by clicking it once. Once your selection
    is made, click the Open button, after which you will be returned to the Import
    Photos window with your new destination folder listed in the Destination box at
    the top of the window.


    # 14A-3: Saving Images to Your Hard Disk


    Now that everything is set up, you can save all of the photos in the Import Photos
    window by clicking the Import button. If you are in a pick-and-choose sort of
    mood, you can save only the images by holding the CTRL key and then selecting
    those images by clicking each of them before clicking the Import button.


    Once you have selected your photos (if you choose) and clicked the Import button,
    the images will be saved to your hard disk with the progress of the process indicated
    at the bottom of the Import window. When the process is complete, the images you
    have just saved to your hard disk will appear in a new window, as you can see
    in Figure 14-3.


    ![](img/8c9883c4544150d676aa7a1c159e9153_247_0.png)


    Figure 14-3: Imported images displayed in the gThumb image viewer


    # Viewing Your Images with gThumb


    The images that appeared in Figure 14-3 are being displayed by an application
    called gThumb. As you can see, gThumb is an elegant viewer, but it can actually
    do a lot more. Although not as elegant in appearance as Apple''s iPhoto, gThumb
    can actually perform many of the same functions, and it can even perform some
    functions that iPhoto can''t. If you don''t happen to'
  merge: -1
  pgno: 247
- img_proc: true
  md: 'be importing any images from your digital camera right now and would like to
    give gThumb a look, you can do so by going to the Applications menu and selecting
    **Graphics** ▶ **gThumb Image Viewer**.


    # Getting to Know Some of gThumb''s Features


    Now you know how to view images in gThumb, but what so, right? Well, as I said,
    gThumb does a lot more—so much, in fact, that it is a really useful tool for the
    digital photographer. With gThumb you can view your images as a slideshow by clicking
    the **Slide Show** button; view them at full-screen (**View** ▶ **Fullscreen**,
    or just click the **Fullscreen** button); rotate and mirror them (**Tools** ▶
    **Rotate Images**); and convert their file formats, from JPEG to PNG, using (**Tools**
    ▶ **Convert Format**).


    If you want to adjust the actual look of things, you have still more options.
    To access most of these editing options, first select the image you want to tackle,
    and then go to the Image menu menu and select **Enhance**. Once you''ve done that,
    gThumb will have a go at making your look Sunday (if it supports your image format).


    If your aesthetic sense is a bit different than gThumb''s, you can go for the
    manual route, vetoing the changes gThumb made by clicking once on the image and
    then clicking the **Do Not Save** button. You can then go to the Image menu, and
    change the brightness, contrast, color balance, and hue saturation of your image.
    You can also resize and crop your images from the same menu.


    If you want to print out one of your images, doing so via gThumb is extremely
    easy. Just click the image you want to print, and then select **Print in the File
    menu.**


    # Saving Photos to CD in gThumb


    One of gThumb''s very iPhoto-ish features is its ability to burn images to CD.
    To use this feature, select the images you want to save to CD (in Folder view—just
    click the **Folders** button to get there), and then select **Write to CD in the
    File menu**. After that, you will be asked in a separate window whether you want
    to save the whole shebang to disk or just those items you selected. Select your
    choice, and then click **OK**. A Nautilus CD/DVD Creator window will appear showing
    the items you selected. After that, it is all the same process as described in
    Chapter 6, so it is pretty much smoothing.


    # Project 14B: Creating Web Albums with gThumb


    The gThumb features I''ve mentioned so far are pretty much the same as those found
    in Apple''s iPhoto. Now, however, we come to one feature that isn''t: gThumb''s
    ability to create web albums of your photo collection. These albums can be used
    on your computer itself, distributed on CDs, or uploaded to your website for the
    world to see . . . and look pretty nice.'
  merge: -1
  pgno: 248
- img_proc: true
  md: '# 14B-1: Selecting Images


    To create a web album of your own (while holding down the CTRL key), go to the
    Tools menu, and select Create Web Album. A new window, Web Album (shown in Figure
    14-4), will appear.


    ![](img/8c9883c4544150d676aa7a1c159e9153_249_0.png)


    Figure 14-4: Creating a web album in gPhoto


    # 14B-2: Selecting a Destination Folder


    In the Web Album window, select a folder other than your home folder in to place
    your web album (you''ll end up with a mess in your home folder if you don''t).
    After that, select the new folder you created as the destination folder by clicking
    the drop-down menu next to the word Destination and then selecting Other. In the
    choose folder window that appears, navigate to the new target folder, select it
    by clicking its name, and then click Open.


    # 14B-3: Copying Images and Page Layout Options


    Once you''ve set the destination folder for your web album, you can decide whether
    or not to copy the images in your album to the destination folder. In the same
    window, check the box next to Copy originals to destination if you plan to upload
    the web page to your website or distribute it as an archive or on CD. If you just
    want to view the album on your own computer, leave the box blank.


    Once you''ve done that, decide how many images you want to appear on each page
    of your album by adjusting the numbers in the Index Layout section of the window.
    For most screen resolutions, 2 or 3 rows by 4 columns works nicely.'
  merge: -1
  pgno: 249
- img_proc: true
  md: '# 14B-4: Adding Headers and Footers


    While still in the same window, give your album a title by typing that title in
    the Header box. You can also use a string of text to appear at the bottom of the
    page by typing text in the Footer box.


    # 14B-5: Choosing a Theme


    Finally, choose a theme for your album by clicking the ... button to the right
    of the Theme box. As you can see in Figure 14-5, there are six themes available.
    Click on each of the themes once to see a preview of that theme in the right half
    of the window. Once you have made your selection, click the Select button. For
    my part, I will be using the Classic Clips.


    ![](img/8c9883c4544150d676aa7a1c159e9153_250_0.png)


    Figure 14-5: Selecting a theme for your web album


    # 14B-6: Creating and Viewing a Web Album


    Once your selections are made, you can create your web album by clicking the Save
    button. If you chose to create a web folder, a small window will appear, telling
    you there is no such folder and asking you if you want to create it. Of course
    do you, click Create in that window. After a few seconds, your web album will
    be ready for viewing.


    To see your new creation, open a Nautilus, navigate to the target folder you created
    for your web album, double-click it, and then look for the file index.html within
    that folder. Once you''ve found it, double-click it. Firefox will then open to
    your new album.'
  merge: -1
  pgno: 250
- img_proc: true
  md: '# Bonnie in SC


    ![](img/8c9883c4544150d676aa7a1c159e9153_251_0.png)


    Figure 14-6: Viewing thumbnail images in a web album


    As you can see, the web album presents your photos as a set of thumbnails in a
    photo or slide motif (depending on the theme you choose), with buttons there to
    connect you to whatever pages your album happens to have. Click any of the thumbnails
    in your web album, and that image will appear in enlarged form within the same
