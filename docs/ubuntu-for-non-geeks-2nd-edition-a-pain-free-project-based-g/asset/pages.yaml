  md: '# 9A-3: Installing Software with Automix: Skype


    Now that you know Automix does, let''s give it a spin by installing a package
    that is not in the Ubuntu repositories but is in the new repositories added by
    Automix: Skype, shown in Figure 9-3, Voice over (VoIP) software that allows you
    to speak to other users over the Internet with the clarity of a regular telephone
    line. And it doesn''t cost anything—even if you call over overseas. There are
    also for-fee services, such as SkypeOut, which allows you to call regular mobile
    and landline telephone numbers from your computer at a fraction of


    While it is true that Ubuntu comes with a VoIP package of its own, called Ekiga
    Skype, it is not compatible with the much better known and more widespread Skype.
    It is very likely that the majority of people you know are using a VoIP software
    package or using Skype, it only makes sense to go the Skype route so that you
    can easily communicate with them. It''s nice anyway.


    # Installing and Running Skype


    To install Skype via Automix, click Chat Clients in the left pane of the Automix
    window, check the box next to the word Skype, then click the Start button. The
    Automix window will suddenly metamorphose into a Half-Terminal window with a bunch
    of white text streaming down a black background in the bottom half of window.
    That stream of text will then stop at a configuration screen.


    Once you''re in that screen, press the TAB key to highlight the OK button (in
    red), as shown in Figure 9-4, and then press ENTER. In the next screen, select
    Yes by pressing the TAB key once and then pressing ENTER. After another second
    or two of rolling white text, you will be back to the regular Automix window,
    and Skype will have been installed. You can go ahead and quit Automix.


    Once all the pieces have been installed, you can run Skype by going to the Applications
    menu and selecting Internet > Skype. After setting up a Skype user account, I
    would advise you to restart your computer. Skype seems to have better sound quality
    after an initial restart. Also remember, while we''re on the topic of sound quality,
    that it is best to use Skype with a headset. Trying to talk with a stick microphone
    could cause feedback or echoes because the microphone will pick up and transmit
    sounds from the speakers.


    ![](img/8c9883c4544150d676aa7a1c159e9153_175_0.png)


    Figure 9-3: Internet telephony made with Skype'
  merge: -1
  pgno: 175
- img_proc: true
  md: '![](img/8c9883c4544150d676aa7a1c159e9153_176_0.png)


    # 9A-4: Installing Other Packages with Automix: NTFS Partition Write Support


    If you have Windows installed on another partition and want to play around a bit
    with Automix right now, I would suggest installing the package Automix read/write
    NTFS and FAT32 Mounter, which you can find by clicking **Miscellaneous** in the
    left pane of the Automix window.

    This package allows your system to automatically mount your partitions at startup,
    and even more importantly, it allows you to write data to an NTFS partition, should
    you happen to have one. Pretty useful if you''re a dual boot (pretty much useless
    unless you''re not).

    The procedure for installing the package is almost the same one you used when
    installing Skype. Just check the box next to the words Automix read/write NTFS
    and FAT32 Mounter, agree to whatever you are asked to do along the way, and then
    once the installation is complete, restart your system.


    # Project 9B: Converting RPMs to DEB Packages Using Alien


    While it is true that not all DEB packages make their way into the Ubuntu repositories,
    it is also true that some, albeit few, applications are not available as DEB packages
    at all. Some, however, are available as RPMs, which are the packages used in Red
    Hat, Fedora, Mandriva, and a few other Linux distributions. While this may not
    sound particularly promising to you as an Ubuntu user, there are a few rays of
    hope emanating from a handy utility by the name of Alien.'
  merge: -1
  pgno: 176
- img_proc: true
  md: 'If you haven''t guessed already, what Alien does is convert RPM packages to
    DEB packages that you can install and run in your DEB-based system. It doesn''t
    work perfectly 100 percent of the time, and it isn''t as desirable an alternative
    to a properly compiled Deb-from-source package, but if there''s an application
    you need, it might just get the job done. To give Alien a try, we''ll convert
    and install an application called TuxCards (shown in Figure 9-5) that calls itself
    a hierarchical notebook.


    ![](img/8c9883c4544150d676aa7a1c159e9153_177_0.png)


    Figure 9-5: TuxCards—a hierarchical notebook


    # 9B-1: Installing Alien


    Before downloading, converting, and installing the TuxCards RPM, you have to install
    Alien first. Fortunely, Alien is available via Synaptic, so you have to perform
    a search for *alien*, and then follow the standard installation procedures. If
    you prefer, you can download and install it using the apt-get command you learned
    about in the previous chapter. If you go this route, first type sudo apt-get update,
    and then press ENTER. After the repository database update is complete, go ahead
    and install Alien by typing sudo apt-get install alien pressing ENTER.


    # 9B-2: Getting the TuxCards RPM


    Once Alien is installed, you need to download the TuxCards RPM, You can get from
    www.tuxcards.de/requirements.html. On that page, right-click **tuxcards-1.2.imdk.i586.rpm**,
    and then select **Save Link As** in the popup menu. There are other versions on
    the page that might work, but for the sake of this project, stick with the one
    I mentioned.


    Once the download is complete, make sure to place the RPM in your home folder,
    if it isn''t already there.'
