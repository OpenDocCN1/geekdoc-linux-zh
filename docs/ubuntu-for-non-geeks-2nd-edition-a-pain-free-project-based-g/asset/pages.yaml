    are using your disk burning for the day, click **Eject**, and then click **Close**.


    In case you are wondering, the disks you burn in Linux will be readable in other
    operating systems.


    # Dealing with CD-RW Disks


    CD-RW disks are pretty much like CD-R disks except that they can be erased and
    then written to again. They are also quite bit more expensive than CD-R disks,
    and generally, cannot handle faster burning speeds.


    Using CD-RW disks is much like working with CD-R disks. If the disk is blank,
    there is no difference in the process at all, which makes things quite simple.
    And, if the CD-RW disk has data on it that you wish to replace with something
    else, the process is only slightly different.


    One of these differences is that Nautilus will treat your CD-RW disk as a regular
    data disk rather than a blank one. This means that when you pour your disk into
    the drive, a regular Nautilus window will automatically open, rather than a CD/DVD
    Creator window.


    To write to the disk, you will need to manually switch from the Nautilus window
    to a CD Creator window, which is easily done by selecting **CD/DVD Creator** in
    the **Go** menu of the Nautilus window opened for that disk.'
