    but despite its obvious attractions and popularity, I have to say that I don''t
    like it, though I can''t quite put a finger on the reason why. I just prefer the
    more straightforward Thunderbird for my chores. Contrast to the functional Evolution,
    Thunderbird (Figure 4-15) is a more mail-oriented program that is very straightforward
    to use, yet includes most of the most important functions you''ve come to expect,
    such as junk filters. In fact, it is remarkably similar to Outlook Express in
    appearance and handling. It also lacks the quirkiness that always seems to squirrel
    its way into Evolution in some form or another. That Thunderbird is also available
    in both Mac and Windows versions means you may already be familiar with it, or
    prepared to deal with it if you find it in any other system you are using.


