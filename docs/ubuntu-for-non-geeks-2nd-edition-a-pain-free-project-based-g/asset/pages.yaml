    # $ sudo


    When you run Synaptic back in Chapter 5, you were first asked to input your password
    before you could run the program. The reason for this, as I mentioned then, is
    that Synaptic installs the files in various folders throughout your system, almost
    all of which are protected. By supplying your password, you are telling the system
    that you, holder of the password, have the right to allow Synaptic to do that.


    The command version of that password-giving process is the sudo command. To perform
    an operation in a folder that is write protected, you would first type sudo and
    then the command you want to perform. For example, if you wanted to copy an icon
    image, let''s call it myicon.png, to the globally located and write-protected
    /usr/share/pixmaps), you would type sudo cp myicon.png /usr/share/pixmaps.


    After typing a command with sudo and pressing ENTER, you will be prompted for
    your password. Once you type your password and press ENTER again, the command
    will be executed. I should mention that once you input your password, it will
    stay in memory for about 15 minutes. This means that you will not be prompted
    for your password when using the sudo command again within that time frame.


    # $ locate


    In contrast to the seemingly lightweight commands you have learned so far, the
    locate command is really quite useful. In fact, you might find it much easier,
    faster, and more effective method of finding files than the graphical search tool
    in the Places menu. Using the command followed by a space and the name of the
    file you are searching for is easy: you simply type the command and the file name.


    Before you use this command, though, you will need to create a database of filenames
    for locate to use. This is quite easily done by using the sudo command, which
    you just learned, and then typing updateddb (Whoa, Nellie! Yet another command!),
    followed by a tap on the ENTER key (that would be sudo updateddb). After you type
    your password when asked to do so, it will seem that nothing is happening for
