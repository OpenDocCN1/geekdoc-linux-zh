  md: '# Sodipodi


    The GIMP, like so-called *paint programs*, create bitmap images in various file
    formats. These images are in which the location and color of every single pixel
    is recorded. The image is essentially a collection of dots, or bits. The file
    you create is a rather hefty map of these bits (hence its name), and this map
    tells your system where everything in image is supposed to go when it is displayed
    or printed.


    *Drawing programs*, on the other hand, vector images, or drawings. The vector
    image is a collection of mathematical formulae representing the various shapes
    in your image. This may sound rather unimportant to you, but such drawings have
    advantages in certain cases. One of these advantages is that vector images take
    less space on your hard disk than bitmaps. Another, and perhaps the most important,
    advantage is that shapes in vector images retain their smooth edges when the images
    are enlarged. A smooth circle created as a bitmap, for example, would show jagged
    edges (the “jaggies”) when enlarged to any extent, while the same circle in a
    vector image would remain smooth and round no matter how much you increased its
    size.


    If you are interested in creating a drawing program, then pick my for creating
    graphics Sodipodi—the name is Estonian for *mishmash* (see Figure 14-15).


    To download and install Sodipodi, a synaptic search for *sodipodi*, and then mark
    the file for installation. Once it is installed, you can run it from the **Applications**
    menu by selecting **Graphics** **► Sodipodi**.


    If you would like to learn how to use Sodipodi, go to the Sodipodi home page at
    www.sodipodi.com. Be sure to click the **Galleries** link at the top of page to
    see examples of what you can do with the program.


    ![](img/8c9883c4544150d676aa7a1c159e9153_257_0.png)'
  merge: -1
