- img_proc: true
  md: 'missing, or when you connect a piece of hardware and can''t get it to run,
    no one asks if that operating system is ready for the desktop.

    In my experience, I have found no reason to doubt that Linux is ready. Linux has
    its occasional quirks, but so does every other operating system. If my mother,
    hardly a computer wiz, can do the work she needs to do and keep herself amused
    till the middle of the night using her Linux system (blowing the whole thing up),
    then I think it''s pretty safe to say that you''ll do it right.


    # # What Is a Distribution?


    An operating system consists of a lot of files that perform a lot of different
    functions. And because there is no Linux corporation to package and distribute
    the files that make up Linux, the task of getting Linux onto your computer in
    working order, along with the applications that you are likely to want, has fallen
    to a varied group of entities—companies, universities, user groups, and even private
    individuals. These entities create Linux system and application collections *distributions*,
    or *distros*. You could bypass these and try to collect everything you need to
    set up a system all of your own, but would undoubtedly lose your mind in the process.
    Most people, even the quickest, opt for the distro.

    The majority of these distros, whatever their target audience, basically consist
    of the same main elements: the operating system (better known as the Linux kernel),
    some sort of installer program to get all the system parts and applications properly
    installed on your machine, the X Window System to provide graphical interface,
    one or more graphical environments, and a series of applications, such as word
    processors, audio players, and games, as well as all the files needed to make
    this work.

    There are, of course, a large number of distros. Some are geared toward specific
    audiences, such as businesses, educators, students, programmers, system administrators,
    and specific language users. What makes each distro is the specific software that
    is bundled with the Linux kernel, as well as other features like the package,
    or installation mechanism, and the installer for the system itself. Some distros
    are especially appropriate for home users due to their ease of installation. Ubuntu,
    a relatively newcomer to the Linux world, is one of these, joining other distros
    that have long been popular in the ease-of-use arena, such as Mandrake, SUSE,
    and Fedora Core. There are also many other distros, like Xandros and Linspin,
    that are specifically geared toward making the transition for Windows users easier.
    While many of these entities create their distro, most also provide them free
    for download.


    # # What Is Ubuntu?


    Ubuntu is a completely free, easy-to-use, and extremely popular Linux distribution
    is geared toward the desktop user. It is one of the hottest distros in the marketplace
    today. It is also one of the Linux distros with what could be described as a social
    agenda behind it.'
