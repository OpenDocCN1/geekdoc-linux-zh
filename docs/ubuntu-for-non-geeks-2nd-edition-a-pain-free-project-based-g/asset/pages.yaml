    # # Welcome to the GNOME Desktop


    Ubuntu''s implementation of the GNOME desktop is shown in Figure 3-2, as you can
    see, it isn''t all that different from what you might be used to be in a Windows
    or Mac OS 9 environment, other than the fact that it has taskbars, or *panels*,
    at both the top and the bottom of the screen. There are also no desktop icons,
    except when running a live session from the Ubuntu CD, in which case you''ll see
    a launcher to run the installation wizard (labeled Install) and a folder (labeled
    Examples), which contains a number of sample files. Among these is a video clip
    of Nelson Mandela discussing the meaning of ubuntu (the concept, not the distro).
    All in all, it is a very cluttered place to be, and despite its superficial similarities
    to other OS desktop environments, things in the GNOME are different enough to
    be interesting.


    The main elements of the GNOME desktop are the panels at the top and bottom of
    the screen and the icons that appear upon those panels. The desktop itself, although
    empty at startup, does see its share of action, and I''ll come to that later.
    For now, I''ll focus on the two panels.


    # # The Top Panel


    The two GNOME Panels on your desktop, the top panel is basically where all the
    action is. As you can see, there are three menus and two icons at the left end
    of the panel, and a few icons and a clock/calendar at the other end (Figure 3-3).
    So that you understand what panel items does, I will briefly describe each of
    them, moving from left to right, as seems to be the fashion days.'
