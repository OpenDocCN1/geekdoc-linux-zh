- img_proc: true
  md: 'When the process is complete, a new window will appear asking you to name your
    iPod, and asking whether you want iTunes to automatically synchronize your iPod
    with your photo and music collections (Figure 16-2). What you name your iPod is
    up to you (short names show up better on the GNOME desktop), but I strongly recommend
    checking the two auto-sync checkboxes; otherwise could lead to unintended weirdness
    down the line. Once you''re done, click OK.


    ![](img/8c9883c4544150d676aa7a1c159e9153_289_0.png)


    Figure 16-2: Completing your iPod’s HFS+ to FAT32 conversion process


    Once the process is complete, you will have a properly configured, FAT32-formatted,
    and all-but-empty iPod that is ready for Linux, Windows, and Mac OS. You can even
    use your iPod now on all three systems interchangeably, though I would only do
    so if the auto-update function is disabled.


    # (Not) Auto-Updating Your iPod


    When you enable-update on your iPod via iTunes, you can use it within your iPod
    itself. With a FAT32-formatted iPod, you can use it on a Winbox, Mac, or Linuxbox—or
    all of them interchangeably. If you set your iPod to auto-update songs and playlists,
    you are leaving yourself for trouble unless you have exactly the same music collection
    on your Linux, Mac, and Windows machines.


    The reason for this is simple. While iTunes allows you to add files to your iPod,
    it does not allow you to copy files from it. The auto-update feature is strictly
    one-way street. This means that whenever you hook up your auto-update-enabled
    iPod to an iTunes-enabled computer, iTunes will automatically add tracks to its
    library to your iPod, and, frighteningly, it will remove any tracks from your
    iPod that are not present in its library. I learned this hard way when I took
    my wife’s loaded iPod to work and plugged it into my office Winbox with its completely
    empty iTunes library. When I brought the little Podster back to her with nothing
    at all on it, what wasn''t pretty.


    270 Chapter 16'
  merge: -1
