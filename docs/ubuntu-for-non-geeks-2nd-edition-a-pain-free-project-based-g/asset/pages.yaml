- img_proc: true
  md: '# Taking Control of Firestarter


    You can control how Firestarter deals with various network events by creating
    your own policies. The default policy set in Firestarter allows you to basically
    do whatever you normally do via the Internet, while it blocks new connections
    to your computer from any other computer on your network.

    To make it bit more draconian, you can click the Policy tab, select Outbound traffic
    policy in the drop-down menu next to the Editing, and then select Restrictive
    by default, if you want to deny anyone working on your computer access to a specific
    website, simply click the Deny connections to host field to select it, and then
    click the Add Rule button. In the Add New Outbound Rule window, enter the URL
    for the targeted site, click Add, and then click the Apply Policy in the main
    Firestarter window.


    # Confirming That Firestarter Runs Automatically


    After you run Firestarter the first time, it will set itself to automatically
    start whenever you start up your system. Don''t be concerned when you don''t see
    the graphical interface when you started it; Firestarter will be running in the
    background, silently protecting your computer.

    If you are doubting the type, you can check to see whether or not Firestarter
    is actually running in the background by opening a Terminal window, typing /etc/init.d/firestarter
    status, and then pressing ENTER. If Firestarter is running, you will see the message
    * Firestarter is running. . . in the Terminal window. Worries over. If Firestarter
    isn''t running, the response will respond * Firestarter is stopped.


    # Finding Out More


    If the world of firewalls is new to you, you can check out the Firestarter page
    to learn a bit more. To check out the online manual, just go to the Firestarter
    Help menu, and select Online Users'' Manual, which will bring you the page in
    your web browser. If you prefer to check out the manual before installing Firestarter,
    point your browser to www.fs-security.com/docs. You will also find a pretty good
    tutorial there.


    # ClamAV: Antivirus Software, Linux Style


    Despite the lack of viruses out there that can wreak havoc upon your Linux system,
    your computer could still act as a transmitter of viruses. As a result, there
    are a number of free antivirus scanners out for Linux users interested in helping
    to protect Users from viruses. These include Aegis (available via Synaptic), Panda
    Antivirus (www.pandasoft.com/download/linux.htm), f-Prot (www.f-prot.com), and
    numerous others. For most Linux users, however, the virus scanner of choice is
    the open source contender—ClamAV.'
  merge: -1
  pgno: 315
- img_proc: true
  md: 'Although it can be used on a number of operating systems, ClamAV is considered
    to be the Linux antivirus software package. It is open source, totally free, and
    you don''t have to worry about licenses or the bother of renewing them. Unfortunately,
    in its own, ClamAV is a command-driven application, which makes it a bit less
    user-friendly. Fortunately for all involved, there is also a graphical interface
    available, albeit a simple one, by name of ClamTk. Both ClamAV and ClamTk are
    available via Automix. In fact, they come bundled together with Firestarter in
    the Gnome Security Suite, so if you want to give them a try, just follow the directions
    for installing Firestarter in the previous section.


    # Using the ClamAV/ClamTk Duo


    Once ClamAV is installed, you can perform a virus scan by going to Applications
    > Accessories > Virus Scanner. This will bring up the Clam Tk Virus Scanner window
    (Figure 18-5). After it appears, you should set up ClamAV so that it will automatically
    scan any viruses. To do this, go to the Actions menu, and select Quarantine Infected
    Files. Then go to the File menu, select Scan Directory, and in the left pane find
    the folder or disk you want to scan. Once you''ve done that, click the OK button,
    and ClamAV will start scanning your system. ClamTk will let you know what it (or,
    ClamAV) is scanning at any moment in the empty space below the button bar. If
    it finds anything suspicious, it will list that item in the main pane of the window.


    ![](img/8c9883c4544150d676aa7a1c159e9153_316_0.png)


    Figure 18-5: ClamTk—the graphical interface for ClamAV


    As mentioned before, the only viruses you are likely to encounter during a virus
    scan are those designed for Windows systems, because those viruses cannot affect
    your Linux system, focusing your efforts where they are likely to do the most
    good seems a sound way of doing things. Although it won''t hurt you to scan your
    system for viruses, especially if doing so makes you feel better, it is probably
    better to focus your virus scanning activities on your Windows partition, if you
    have one, and on any files that you will be sending as email attachments, particularly
    to Windows users.'
  merge: -1
  pgno: 316
- img_proc: true
  md: '# Project 18: Virus Scanning with avast!


    While ClamAV may be the virus scanner of choice in the Linux world, my personal
    favorite is still avast!, defended me during my Windows years. I think it is easier
    to use and, for what it''s worth, nicer to look at. On the downside, it does require
    you to register every year so you can get a license key, but that is hardly a
    monumental task, and it is still free—at least for home and noncommercial use,
    which, if my audience for this book was correctly predicted, should include you.
    If nothing else, it is worth a try, so just go for it.


    # 18-1: Downloading the avast! DEB Package and License Key


    First you have to get the avast! file and license key. You can do this by opening
    your web browser and going to www.avast.com/eng/download-avast-linux-edition.html.
    Once you''re there, click the **Download** button for the DEB package of the avast!
    Linux Home Edition. When Firefox does-what-you-want-with-this-file window appears,
    accept the default (gdebi-gtk) by clicking **OK**. Once the download is complete,
    you can, of course, save the package to your hard disk and double-click it to
    open the Debian installer.


    When the Package Installer window appears, provide your password when prompted,
    and click **OK**. The download and installation will then begin. When these processes
    are complete, close the notification window and the Package Installer itself.
    Once you''ve downloaded and installed avast!, you''ll need a license key in order
    to use it. Just go back to the avast Download page in Firefox, click the **registration
    form** link, and then fill out and submit that form. You should receive your license
    key by email a few minutes later, even though the page says it could take up to
    24 hours.


    # 18-2: Running and Using avast!


    Once avast! is installed, you can run it by clicking the Run Application panel
    (or pressing ALT-F2), typing `avastgui` in that window, and clicking the **Run**
    button. The first time you run avast!, a small window (Figure 18-6) will appear
    asking you to input your license code. Assuming you registered your free code
    of avast! at the beginning of the project as I instructed you to do, your registration
    key should already be waiting for you in your email''s inbox. Go have a look,
    copy the key, and paste it into the text field in the Registration window (you''ll
    have to use CTRL-V combination to do this). Once the license key is in place,
    click the **OK** button.'
