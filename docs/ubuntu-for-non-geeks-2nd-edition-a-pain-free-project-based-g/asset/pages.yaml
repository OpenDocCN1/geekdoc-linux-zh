    # # Project 3A: Customizing the GNOME Panel


    The GNOME Panel is not a static thing. You can add launchers (respectively known
    as program shortcuts or aliases to Windows and Mac users), utilities, and even
    amusements to make it do almost anything you want to it—within limits, of course.
    In the various stages of this project, you will customize your panel to get hands-on
    experience working with it and to make things more convenient for you as you make
    your way through the rest of this book. You are of course, free to change any
    of the customizations I ask you to (though you won''t have a say in the matter
    if you''re working in live session from the desktop CD, as you won''t be able
    to save your settings).


    Each of the following subprojects is very simple. Most are three-step, point-and-click
    procedures that you should be able to handle without any difficulty.


    # ## 3A-1: Adding Utility Buttons to the Panel


    The GNOME Panel allows you to add a number of utility applets. Each of these has
    some specific function, such as tracking your stocks, telling you the weather,
    or performing some particular system-related function. To start out, let''s add
    a useful utility to the panel: the Force Quit button. The Force Quit lets you
    quickly and easily deal with non-responding windows.


    Yes, it happens on occasion: A window suddenly refuses to do anything. Regardless
    of what you want to do it or what it is supposed to be doing, it sits there as
    if it is on strike (maybe it is). With just one of the Force Quit button, your
    cursor becomes a powerful instrument that will kill the window. You definitely
    don''t want to be without this button, so here''s how to add it to the panel:


    +   - Right-click any open space on the top panel.

    - From the popup menu, select Add to Panel, after which the Add to Panel window
    will appear.

    - In this window, click Force Quit once to highlight it, as I''ve done in Figure
    3-5. Click the Add button, and then Close to finish the job.


    To reinforce what you''ve learned to do, let''s add another utility to the panel:
    the Run Application applet. When you install applications in Ubuntu, you will
    find that some of those applications do not automatically install launchers in
    your Applications menu. This means that you have to open a Terminal window and
    type a command every time you want to run such programs, which can get rather
    fast. The Run Application panel applet is one way to solve this problem.'
