  md: '# Using the Keyboard Indicator


    If you often type in a particular foreign language, it might be more convenient
    for you to use the Keyboard Indicator GNOME Panel utility. This utility lets you
    switch quickly among various keyboard layouts. For example, if you often type
    in Swedish, and thus the characters å, ä and ö, the appropriate keyboard layout
    would be easier than repeatedly using the Character Map. Of course, you will have
    to familiarize yourself with the keyboard layout, or keymap, for each language
    you choose, which is a relatively easy task.


    The Keyboard Indicator is already included in your system, so there is no need
    to install it. To access it, simply right-click somewhere on the GNOME Panel where
    you would place a launcher. Then, from the popup menu select Add to Panel. When
    the Add to Panel window appears, scroll down and click Keyboard Indicator, then
    click the Add button. The layouts US or GB will then appear on the panel.


    Now, this will give you nothing except your default keymap, so you must configure
    Keyboard Indicator if you want to be able to use other keymaps. To do so, just-click
    the icon, and from the popup menu select Open Keyboard Preferences, which will
    open the Keyboard Preferences window.


    To add a keymap, click the Layouts tab in that window, and then in the new tab,
    click Add. After you do this, the Choose Layout window will appear with a list
    of the keymaps available to you (Figure 12-3). In the left pane of that window,
    scroll down for the country of the language you want to add, and then click it
    to select the standard keyboard layout for that locale (click the arrow to the
    country for a list of options you prefer). Once you''ve made your selection, click
    the OK button, which will bring you back to the Keyboard Preferences window, where
    you will find your new keymap listed along with the original. You then click the
    Close button to complete the setup.


    ![](img/8c9883c4544150d676aa7a1c159e9153_223_0.png)


    Figure 12-3: Adding keyboard layouts to the Keyboard Indicator


    After closing the Keyboard Preferences window, the keyboard layouts can be changed
    by clicking the icon in the panel. You can also change between keyboard layouts
    by going to the Layout Options tab of the Keyboard Preferences window and assigning
    a keyboard shortcut. If you are not where'
  merge: -1
  pgno: 223
- img_proc: true
  md: 'the keys you want to type are located in your new keymap, switch to the keymap
    in question by clicking the panel Keyboard Indicator until it appears and then
    right-clicking it. In the popup menu that appears, select Layout View, after which
    a map of the new layout will appear in a separate window. The default window size
    is quite small, but it can be resized in the usual dragging-corner.


    If you just want to choose a single keyboard layout to replace your present one
    (as British English instead of American English or German instead of Spanish),
    you can do so from the Keyboard Preferences window by adding the keyboard layout
    you want to use, checking the box next to the word Default, and removing the original
    layout by clicking it once to select it and clicking the Remove.


    # Viewing Your System in Another Language


    One of the things that originally attracted me to the Linux world was being able
    to install support for languages other than English. On one of my machines, I
    have installed support for Chinese, Japanese, Swedish, and my default, English.
    With just a logout and a few clicks, I can log back with an interface in a totally
    different language. I have a Chinese, Japanese, or Swedish system whenever I want.


    This is very useful if you are going to do a lot of work in a foreign language,
    or if you are studying a foreign language and want to give as much exposure possible
    to it. It is also very handy when you have users with native languages using the
    same machine. At my former university, for example, where my Japanese and Chinese
    students sometimes used my computer, the additional language support allowed them
    to log in their own language. All in all, it is a very useful feature.


    Taking advantage of this feature in the GNOME environment is very easy and easy,
    depending on the language you wish to use, requires little in terms of special
    installations. Basically all you have to do is install a group of support files
    for each language you want to add to your system. You can do this quite easily
    by going to the System and selecting Administration Language Support.


    You will be prompted for your password at this point, so what is required, and
    the Language Support window (Figure 12-4) will appear. In that window, check the
    boxes next to the languages for you want to install support. Once you have made
    your selections, click the Apply button, and the Language Selector will begin
    downloading and then installing the support packages specified.


    ![](img/8c9883c4544150d676aa7a1c159e9153_224_0.png)


    Figure 12-4: Installing additional language support


    Polyglot Penguins 205'
