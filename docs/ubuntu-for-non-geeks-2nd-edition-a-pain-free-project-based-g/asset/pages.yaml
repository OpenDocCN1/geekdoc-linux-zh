  md: 'While we''re on the topic of dragging and dropping, it is worth noting that
    you can add songs to your iPod by simply dragging them from your Music folder
    (or any other folder) and then dropping them in the right pane of the gtkpod window.
    To add a song to both your iPod''s library and a specific playlist, drag a file
    or directory from your Music folder to the icon of the playlist in question. Pretty
    cool.


    # Setting Album Art and Editing Tags with gtkpod


    Tag editing, including album cover images, is another area in which gtkpod can
    prove useful. To edit a track, click any track in the playlist and select **Edit
    Track Details**: The Details window for that track will appear (Figure 16-5).
    In that window you can edit all of the tag entries (artist, album, track title,
    genre, and so on), and you can set the album cover for the track. Once you have
    finished making your changes, click the **Apply** button, and then click **OK.**


    ![](img/8c9883c4544150d676aa7a1c159e9153_293_0.png)


    Figure 16-5: Editing tags in gtkpod


    # Copying Files from your iPod to Your Hard Disk with gtkpod


    Like Rhhythmbox, gtkpod can copy tracks from your iPod to your hard disk. To do
    this, select the tracks or playlists you want to export (hold down the CTRL key
    to make multiple selections, or use the tabs to select all of the tracks by a
    particular artist or in a particular genre). Then click the **File** menu, **Export
    from Database**, and choose one of the destinations from the submenu: *Selected
    Playlist, Selected Tab Entry,* or *Selected Tracks.*


    As with Rhhythmbox, AAC files exported from gtkpod will not have the filenames
    they started out with. The remedy is same as before: Just change the filenames
    manually. The correct track title and artist information will appear in any player
    window, whether or not you change the filename.'
