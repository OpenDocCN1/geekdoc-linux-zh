  md: '# Other Video Apps


    I''ve covered the main video applications in Ubuntu, but there are still others
    available that you might want to consider. A very popular alternative video/DVD
    player, for example, MPlayer, which you can download and install by performing
    a Synaptic search for mplayer. Be sure to download not only mplayer, but also
    mplayer-front so to avoid annoying error messages. Mplayer is also available via
    Automatix.


    The cross-platform player, VLC Media Player, is another player with a significant
    following. It is noted for handling a number of video formats, and for having
    a simple and easy-to-use interface. You can get it via Automatix (click Media
    Players and Editors in the left pane, click VLC Media Player in the right pane,
    and then click Start!)


    Another video/DVD player you might want to consider is gxine, which is similar
    in several ways to Totem, and it gives you a bit more control over things. Again,
    you can download and install gxine by Synaptic by performing a search for gxine.


    If you are not only a video watcher but also a budding video artist, then you
    might want to consider a few handy video/DVD auditing and editing tools: the multiplatform
    video editor, Avidemux (Figure 17-9); QVDD-Author, a DVD creator in the iDVD video
    (albeit without the superficial polish of Apple''s offering); and QVDD:Rip, as
    you might imagine, allows you to rip the contents of a DVD to your hard disk.
    applications are also available via Synaptic by performing searches for avidem,
    qvdauthor and dvdrip. Avidemux and QVDD:Rip are also available via Automatix.


    ![](img/8c9883c4544150d676aa7a1c159e9153_309_0.png)


    Figure 17-9: Cross-platform video editor, Avidemux'
