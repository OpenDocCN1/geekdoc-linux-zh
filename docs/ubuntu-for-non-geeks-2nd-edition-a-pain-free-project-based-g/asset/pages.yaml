  md: '# Nautilus: Your File Manager


    As I mentioned, the program that creates the file viewing and organizing interface
    in your system is called Nautilus, and it comes as part of the GNOME desktop environment.
    You may not have thought of an operating system''s file manager as a program before,
    but in fact, that is what it is.(The Windows file manager is called Windows Explorer.)
    To have a look at Nautilus, just go to the Places menu, and select Home Folder.

    When Nautilus opens up your home folder, you should find nothing the first time
    out than a folder Desktop (shown in Figure 6-1), which, if double-clicked, will
    show everything you have stored there (a lot in my case; most likely yours). There
    is also another folder, called Examples, which is the same as the one that appears
    when Ubuntu off the live CD. It contains sample files that give you an idea of
    what Ubuntu has in store for you, along with Nelson Mandela video I mentioned
    in Chapter 3.

    nYou can create additional folders and, of course, to your heart''s content, so
    that rather Spartan state of affairs is to change once you get down to really
    using your system. In fact, you will be creating a number of folders in Chapter
    7, which will make everything a bit more lived.


    ![](img/8c9883c4544150d676aa7a1c159e9153_99_0.png)


    Figure 6-1: The contents of your home folder as viewed in a Nautilus window


    # The Side Pane


    Nautilus has a lot of interesting features that deserve mention, and the most
    obvious of these is the side pane, which appears at the left side of the window.
    The side pane allows you to view a variety of information by selectable views.
    You can make your choices by clicking the drop-down menu at the top of the side
    pane (Figure 6-2).'
  merge: -1
  pgno: 99
- img_proc: true
  md: '![](img/8c9883c4544150d676aa7a1c159e9153_100_0.png)


    # Figure 6-2: Selecting views for the Nautilus side pane


    The default in Ubuntu is Places, which is a sort of quick navigation tool. In
    Places you will find icons representing various data-storage locations available
    to your system, such as your home folder, desktop, fullscreen, any network shares
    you are connected to (more or on that in a moment), and any removal storage media
    or devices you have in or connected to your system. Double-clicking any of these
    icons will show the contents of that location in the right pane of the Nautilus
    window.


    There are, course, other views, such as Tree, which provides you with an expandable
    hierarchical view of your filesystem, and History, which shows where you are in
    your filesystem you have been most recently, in the way the history function works
    in a web browser. There are still other views for you to choose from, a couple
    of which you will work with in Chapter 7.


    # Now You See It; Now You Don’t


    The side pane is a rather handy feature, but there may be times when you would
    prefer to have more space to view the contents of your window and want to get
    rid of the side pane temporarily. You can do this easily by going to the View
    menu of a Nautilus window and deselecting Side Pane. The check mark next to that
    will disappear, as will the side pane. To get it back, return to the View menu,
    and select Side Pane again. The check mark will reappear, as will the side pane
    itself.


    There is another way to hide the side pane that many people see to stumble upon
    accidentally, usually resulting in a bit of unnecessary panic. If you look at
    the gray border at the right side of the side pane, you will notice that there
    is a small ribbed section in the center (see Figure 6-3). Clicking that ribbed
    section acts to toggle hide or show the side pane. The panic most users suffer
    is a result of the fact that when the side pane is hidden in this way, the Side
    Pane entry in the View menu is still checked, indicating the side pane is still
    in view, though your eyes tell you differently.


    So there it is—the side pane’s little secret. No, it’s not a particularly interesting
    secret, but one that should not only provide you with an added layer of convenience,
    but also some peace of mind.'
