  md: 'If you have an iPod that is already in FAT32 format, it is best for you to
    disable the auto-update function on your iPod while it is connected to your Winbox,
    before bringing your iPod into the Linux world. To do this, start connecting your
    iPod to your machine. In the left pane of the iTunes window, click your iPod in
    the Devices section, and then click the Music tab in the right pane. In that tab,
    uncheck the box to the words Sync sync (Figure-16-3). If you have a photo-capable
    iPod, repeat the same process for your photos by clicking the Photos tab in the
    right pane and unchecking the box to the words Sync photos from.


    ![](img/8c9883c4544150d676aa7a1c159e9153_290_0.png)


    Figure 16-3: Disabling the auto-update function on your iPod via iTunes in Windows


    # # Managing Your iPod in Ubuntu


    Normally in Windows and Mac OS, you should load files to your iPod via iTunes,
    but of course, since Apple has not created a Linux version of that popular application
    (and I doubt it will ever), you will find to some other way to go about things.
    Fortunately, there are a few Linux applications that can work with your iPod to
    various degrees, including one you learned in Chapter 15–Rhythmbox.


    # ## Managing Your iPod''s Audio Files with Rhythmbox


    Rhythmbox is set as the default application for iPods in Ubuntu, and as such it
    will automatically appear once your iPod is connected to your machine and mounted
    by your system. You all should have to do this is click the icon for your iPod
    in the left pane of the Rhythmbox window to see its contents.'
  merge: -1
  pgno: 290
- img_proc: true
  md: 'To copy a song from your library to your iPod, just click Library in the left
    pane, and then drag the artists, albums, or single tracks you want from the right
    pane to your iPod''s icon in the left pane. The copy progress will be shown in
    an orange progress bar in the lower-right corner of the Rhythmbox window.


    # Copying Files from iPod to Your Hard Disk


    One feature that isn''t available in iTunes (at least not without the installation
    of a special free plugin) is the ability to copy songs from your iPod to your
    hard disk (even to an external USB drive). Luckily, Rhythmbox, and in fact about
    all Linux audio players with iPod support, allow you to do this easily.


    To copy music from your iPod with Rhythmbox, select the tracks you want to export
    (hold down the CTRL key to make multiple selections or use the tabs to select
    whole artists or genres if you like), and then drag the items to your desktop,
    music folder, wherever you want them.


    > This approach works well enough, but it doesn''t work perfectly for AAC files
    (which end with a .m4a extension). While these files can be copied using the process
    just described, the copied files will not have their original filenames. The File
    Over AAC.m4a on my iPod becomes ZPAD.m4a on my desktop. The files themselves are
    fine, though; if you add them to your Rhythmbox Library, they will appear with
    the original name and artist information. If you would like the files that you
    see in a Nautilus window to have to a recognizable filename, however, just rename
    them as you would any file (right-click the file and select Rename—in case you
    favor).


    # Ejecting Your iPod


    When you''re done with your iPod in Rhythmbox, you can eject it by either clicking
    its entry in the left pane of the Rhythmbox window and clicking the Eject button
    at the top of the window, or by right-clicking it in the left pane and selecting
    Eject in the pop-up menu that appears.


    # Managing your iPod''s Audio Files in gtkpod


    While the latest version of Rhythmbox should be able to meet your typical iPod
    needs, there are other apps that can do the job. For example, the audio players
    Songbird and amass (mentioned briefly in Chapter 15), have iPod support capabilities.
    There are also a few other applications that are iPod-dedicated, one of which
    is gtkpod. Shown in Figure 16-4, gtkpod is a pretty straightforward application
    with a fairly large user base, which means you should be able to get a lot of
    questions answered in Ubuntu and other Linux online forums you have any. It also
    handles many of the functions that one uses when dealing with an iPod, including
    album cover art (but not photos). However gtkpod is not an audio player; instead,
    it uses XMMS as its default playback program, though you can change the settings
    if you have another player in mind.'
