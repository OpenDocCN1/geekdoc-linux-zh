    # What Is Linux?


    Your computer, despite being a collection of highly sophisticated parts, is really
    just . . well, a collection of highly sophisticated parts. On its own, it can
    do nothing other switch on and off and spin a disk or two. In order for it to
    do anything truly useful, it needs an operating system (OS) to guide it. The OS
    takes an essentially well-endowed but completely uneducated hunk of a machine
    and educates it, at least so that it will understand what you want to.


    You already know of and have probably used at least one of the many operating
    systems, Windows, OS and the Mac OS are all such operating systems, and Linux
    is yet another. Linux is, different from these other operating systems, but in
    terms of its capabilities and its heritage. Linux was not created by a corporation
    or by some corporate wannabes to make money. The Linux core, referred to as the
    *kernel*, is Finn and a member of Finland''s Swedish ethnicity, who wanted to
    create a Unix-like system that would work on home computers, particular himself.


    Rather than keeping his vision to himself, Torvalds opened up it to the world,
    so to speak, and the Linux kernel, which communicates with the hardware, and it
    accessible to the other applications and support libraries created by comp-geeks
    around the globe who work to make Linux better and more powerful. It is this combination
    of applications built around the core of Linux which is the essence of all Linux
    distributions today.


    Linux has acquired many fans and followers since its creation in 1991. Some devotees
    praise Linux for its features, as well as being robust, reliable, free, and open.
    Despite these positive characteristics, however Linux, is on its, just a text-based
    system. There is no desktop, and there are no windows or charming icons to make
    you feel safe and comfy when you are behind the keyboard. Powerful though it may
    be, Linux is strictly a black-screen, command line-driven operating system. I
    guess you could think of it as DOS on steroids, though a Linuxist will surely
    cringe at the thought.


    Although you can use Linux by itself, accomplishing all your tasks by typing commands
    on a black screen (the most common way of doing things when Linux is used as a
    server), you don''t have to. It is fair to say that with the advent of the Macintosh
    and its easy-to-use graphical user interface (GUI), pronounced *goo-ee* in 1984,
    users of other operating systems began wanting something to GUI envy. They began
    clamoring for a GUI to call their own. The final result was Windows, which gave
    DOS a GUI and eased many command-uary users into the Microsoft world.


    Similarly, many members of the Linux world felt the need and desire to go graphical.
    Various GUIs (called window managers and desktop environments)'
  merge: -1
