    # # Running and Setting Up Rhythmbox


    To run Rhythmbox, go to the Applications menu and select **Sound & Video ▸ Rhythmbox
    Music Player**. When first time you run Rhythmbox, you are greeted with a three-step
    setup wizard. To get through the introduction, click **Forward**. In the second
    screen, you should tell Rhythmbox where it is (or plan to keep) your music files.
    The Music folder you created in "Setting the Default Folder for Ripped Files in
    Sound Juicy" on page 248. Just click the **Browse** button to locate the folder
    graphically, and then click **Forward** in the wizard window. In the third and
    final screen, click **Apply**, and Rhythmbox will scan your Music folder and add
    any songs it finds to its Library.


    # ## Adding Songs and Albums to the Rhythmbox Library


    If you are familiar with Apple''s iTunes, then you should understand the same
    concept, though the Library in Rhythmbox too, as it does not physically move your
    files as iTunes does.


    To add new albums to your Rhythmbox Library, go to the **Music** menu, select
    **Import Folder**, and then navigate to the folder for the new album you want
    to add. If you want to add a number of albums by the same artist, just navigate
    and select the folder for that artist instead. If you just want to add a single
    audio file, you can also do that—just select **Music ▸ Import File**, and then
    navigate to the song in question.


    If you are not the technical type, you can also add files and folders by other
    means. The simplest way is to drag the folder or song you want to add to the Library
    into the right pane of the Rhythmbox window. You can also add a song to the Library
    directly by right-clicking the file and selecting **Open with ▸ Open with Rhythmbox
    Music Player** in the popup menu that appears.


    Chapter 15'
