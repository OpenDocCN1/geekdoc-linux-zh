    # Dual-Booters Take Note


    If you are going to be creating a dual-boot setup, it is a good idea to first
    defragment your Windows disk before moving on installing Ubuntu. This will make
    the repartitioning of the installation process much faster and safer.


    You can do this while running Windows My Computer, right-clicking the icon for
    your hard disk, and selecting Properties. You can then defragment your hard disk
    (in Windows XP) by clicking the Tabs in the Properties window and clicking the
    Defragment Now. In Windows NT, you can do this by going to the Start menu and
    selecting Control Panel Administrative Tools Computer Management > Defragmenter,
    while in Windows 98 and some other versions, you can do the same by selecting
    Programs System Tools Disk Defragmenter.


    # Doing the Deed


    Well, now that we''ve covered all prelim stuff, let''s get to the actual Linux
    installation. Set this book on your lap so you can follow along, and then get
    ready for action. It''s time to do the deed!


    Fortately for you, the installation process is extremely easy, as there are very
    few steps in which you actually have to do anything. Most of what you will be
    doing is clicking buttons on your screen. Nothing hard that, eh?


    Of course, when you look at the directions and descriptions listed here, it may
    look like quite and cumbersome process. It is not be over quickly than you can
    imagine. A beginner frequently referring to this text, might take a bit longer,
    of course, but don''t worry. In all, the process is faster and easier than that
    for Windows XP or Mac OS X. Keep in mind that you are installing the operating
    system with a few bundled applications. In an Ubuntu installation, on the other
    hand, you are installing not the operating system itself, but also most of the
    applications you will ever want or need to use. You will be getting a lot done
    in one swoop.


    One more thing before we start. Some people approach installing a system with
    a good deal of trepidation. The process makes them nervous, as if the house is
    going to go in up if they think the wrong thing where along the line. Needless
    to say, there is no need for such concern. As long as you have backed up your
    data, you will be okay. If you screw up the installation first time out, so what?
    Just start over again. No harm, as you have nothing to harm. Just make sure that
    you give yourself more time'
