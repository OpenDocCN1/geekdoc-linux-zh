  md: '# INTRODUCTION


    My computing life began long ago in the Commodore/Atari days. No doubt inspired
    by Alan Alda’s television commercials at the time, I purchased my first machine,
    an Atari 600XL with a cassette drive for storage and 16KB of RAM—more than I thought
    I would ever need. Most of my time on that machine, I must admit, was spent playing
    cartridge-based games and transcribing pages and pages of machine code from the
    non-defunct magazine Antic to create even more games. Eventually, my interest
    in computers increased, especially after seeing my first (and actually the first)
    Macintosh at the UCLA bookstore. The very in-your-face nature of the Mac’s operating
    system caused me to become an operating system maniacac. To date, I have worked
    with a lot of different operating systems, including Mac OS up to and including
    OS X, Windows versions from 3.1 to XP, and IBM’s much forgotten OS/2.

    Though tempted to join the Linux fray, I continued to steer away from it for a
    long time because I could not help but see it, as so many others do, as a system
    for never-seen-the-light-of-day-fade, late-night Dr. Pepper-drinking.


    ![](img/8c9883c4544150d676aa7a1c159e9153_20_0.png)'
  merge: -1
  pgno: 20
- img_proc: true
  md: 'Domino’s-pizza-eating-geeks. However, when I moved to Japan and was suddenly
    surrounded by machines loaded with Japanese versions of Windows, I encountered
    numerous problems, as language constraints. Since everything, including Help files,
    was written in Japanese, I ended up using only a fraction of the full potential
    of most software. Then there were annoying Windows-type problems, such as the
    constant freezes and restarts and the gradual system slowdowns, which were eventually
    remedied by reinstalling the system. Getting the software I to do the things I
    wanted to do also took its toll on my wallet, and I began to rethink my initial
    resistance to Linux. With Linux’s multilingual support, stability, and everywhere
    free software packages there were plenty of incentives for me to get over my notions
    about the Linux user.


    After a few attempts at getting Linux to work on the oddball, Frankenstein-like
    collection of junk that was my computer, I finally succeeded well to enough me
    in a little further. I moved on Mandrake (now known as Mandriva) next, since that
    was claimed to be the most newbie-friendly version, and tried out SuSE as well,
    which I found to be rather quirky. Eventually, I tried out Red Linux and stuck
    to that because it didn’t give me any grief; and I, like most others, do not want
    any grief than necessary.


    I started off my three desktop machines at work and home set up as dual-boot systems
    running Linux and Windows, and I gradually found myself using only Linux. Although
    I had expected to encounter numerous limitations in Linux that would force me
    to return to Windows often, instead found that I had actually increased my productivity.
    But that of lack of support for Windows streaming media, I was actually able to
    do more due to the extensive software base that was now installed on my machine.
    Without having to fork out money that I could afford to spend, I was able to manipulate
    my digital images, rip songs from CDs, create vector drawings, PDF files, and
    a variety of things that I wasn’t able to do under Windows. It was only a matter
    of time before my dual-boot setups became full-linux only, which is to be a Windows
    user.


    Since those early Linux days, I have gone to try out a number of distributions
    including AMD, Xand, Damn Stall Linux, and I am happy to report that these have
    continued to get easier and better, and those early frustrations I suffered to
    get things to work with this machine or that piece of hardware are becoming more
    and more a thing of the past. Best of all, with the advent of CDs, which also
    allow you to try Linux before you actually install it, you don’t even have to
    take a leap of faith to get started.


    # Who Is This Book For?


    If you are standing in the aisle of your local bookstore reading right now, you
    may well be wondering what this book is. If you also happen to see my previous
    books, Linux for Non-Geeks and Linux Made Easy on the'
  merge: -1
  pgno: 21
- img_proc: true
  md: 'same shelf (or have at least heard about them), you might be wondering what
    the differences among these books are. These questions are reasonable enough.
    To put it simply, there are two differences: the experience level of the target
    reader and the distribution covered in each book. Linux for Non-Geeks, based on
    Fedora Core 1, was my first book and was written with folks like my mind—average
    computer users with some experience in the Windows or Mac worlds who had an interest
    in Linux but were afraid to give it a go. My second book, Linux Made Easy, was
    based on Xandros 3 and was written at a more basic level for those who just wanted
    a free and easy way out of the greatrating tangles of the Microsoft empire.


    Ubuntu for Non-Geeks, as you might imagine, is based on Ubuntu Linux, and the
    original Linux for Non-Geeks, it targets readers who are interested in Linux but
    feel the need for a jumping-point of sorts. Although there are similarities with
    its predecessor, Ubuntu for Non-Geeks is different due to the inherent differences
    between the Debian-based Ubuntu and the RPM-based Fedora Core, but also to the
    advances made by Linux as a whole. These advances have resulted in a system that
    is easier and more convenient to use than ever before.


    If you are familiar with computers, but unfamiliar with Linux but not Ubuntu,
    you are essentially the reader for whom I have written this book. To avoid any
    misunderstanding on your part (and at the risk of being redundant), I must re-emphasize
    that this is not a book for seasoned geeks or power users. It is an introductory
    guide that will provide new users with hands-on experience to get them up running,
    and comfortable with the Ubuntu distribution.


    # Version Compatibility


    This book was prepared for use with Ubuntu 7.04 (Feisty Faun) Desktop edition.
    Included with this book is a full working copy of that system on one CD, which
    functions not only as an install CD, but also as a live CD. This means that you
    can run Ubuntu directly off the CD without so much as touching your hard disk.
    You can give Ubuntu a try before making any hardware commitments. And since we''re
    talking hardware, it is worth pointing out that running a live CD gives you the
    chance to see if Ubuntu works with the hardware you''ve got.


    If you like what you see and all the hardware seems to work, you can go ahead
    and install the full shebang on your computer . . . using the same disk, no less
    (instructions included in Chapter 2).


    The world of computers is exceedingly dynamic, and as such, there may be changes
    in the software or the links to the files for projects in this book after the
    book is released. I''ll post any such changes at www.edgy-penguins.org/UFNG.'
  merge: -1
  pgno: 22
- img_proc: true
  md: '# Concept and Approach


    As a language teacher, I have always enjoyed programming books, mathematics, and
    old-fashioned foreign language-learning texts because of their straightforward,
    skill-based orientation, one in which each chapter builds upon the skills acquired
    in the previous chapter. I have tried to organize this book in manner so that
    you will never be called upon to do something that you have not already learned.
    I also like such books because they not only teach you how to do something, but
    also provide you with the chance to put those morsels of knowledge into practice
    with exercises. I have included several exercises, or projects, in this book so
    will have opportunities to apply your knowledge. This book will serve as a reference
    and will also provide a dynamic learning experience so you can learn by doing,
    as they say.


    By working through them, you will properly configure and round out your Ubuntu\u003
    system so that it can do anything you want it to. By the time you finish with
    this book, your system will have all the bases covered. If that is still not enough
    to satisfy you, you will be happy to know that you will have access to even more—an
    unbelievably greater amount more—via the online Ubuntu repositories, which you
    will learn to use in Chapter 5. If your interest is already piqued, take a look
    at these chapter descriptions:


    Chapter 1: Becoming a Penguinist—Welcome to the World of Linux


    What\u0019s Linux? What\u0019s Ubuntu? What\u0019s a distribution? Can I . .?
    Will me\u0019s .? Chapter 1 holds the answers to these and many other questions
    you might have as it introduces you to the world of Linux and what it takes to
    get it up and running on your machine.


    Chapter 2: Wading and Diving—Running and (If You Like) Installing Ubuntu


    The Ubuntu Desktop CD that with this book works as both live and an install CD.
    Chapter 2 tells you how to run a live Ubuntu session off the CD, assuming you
    catch the Linux after doing that, how to install the full Ubuntu system on your
    hard disk as your sole operating system or in a dual-boot setup with Windows.


    Chapter 3: A New Place to Call Home—Getting to Know the Windows or Mac


    Regardless of whether you are an emigr\u0019e from Windows or Mac worlds, the
    desktop is something you are already familiar with. Chapter 3 will point out the
    differences between Ubuntu desktop and the one on your previous operating system,
    and it will teach you a number of cool tricks you can use to customize the look
    and feel of things. A couple of nifty GNOME Easter eggs are also introduced.


    Chapter 4: More Webbed Feet—The Internet, Linux Style


    \u201CHave computer, will cyber-travel"\u2019 be the mantra of the Internet age,
    and that being the case, Chapter 4 is an indispensable part of your Ubuntu experience.
    In this chapter you will learn how to'
  merge: -1
  pgno: 23
- img_proc: true
  md: 'connect to the Internet and set up wireless connections, and you will meet
    the various software entities that allow you to interact with the Web.


    # Chapter 5: Rounding Out the Bird—Downloading, Installing, and Updating Programs
    the Easy Way


    Ubuntu comes bundled with most of the software you need, but there is still more
    available out there, free and waiting on the Web. Chapter 5 teaches you how to
    easily download and install applications using Advanced Package Tool (APT) and
    Synaptic. System and application updating is also covered.


    # Chapter 6: A Tidy Nest—File and Disk Handling in Ubuntu


    From creating folders to copying files to browsing your system and network, all
    things file management are covered in Chapter 6. You will also learn how to work
    with USB storage devices, burn data CDs and DVDs, deal with CD-RW disks and multission
    CDs, and create space-saving compressed archives of file folders.


    # Chapter 7: Dressing Up the Bird—Customizing the Look and Feel of Your System


    Tired of looking at the same old desktop? Feeling nostalgic for the desktop in
    your previous operating system? Chapter 7 tells you how you can beat the deja
    vu by changing the look and feel of just every visual element of your system.


    # Chapter 8: Simple Ways—Getting to Know the Linux Terminal and Command Line


    Many people still shy away from Linux because they perceive it as a system where
    everything still needs to be done by typing commands. That perception is, as the
    saying goes, a load of squash avocados. Still, there is a lot of cool stuff that
    can be done via the command Terminal, and Chapter 8 will tell you all about it
    as it fears and rears your interest in commands.


    # Chapter 9: Automix and Not So Automix—Ways to Install Programs


    Ever wanted to convert your application? Or you''d like to convert an RPM to a
    DEB package? Or you''d just like to learn a easy way to install all of the essential
    missing bits of your system? In Chapter 9 you learn how to do all these things,
    and you will even find out you can run some Windows applications from within Linux.


    # Chapter 10: Gutenbird—Setting Up and Your Printer and Scanner


    Just about everyone with a computer has needs a printer, and Chapter 10 tells
    you exactly how to get yours working with your new Linux system. Scanner usage
    and support are also discussed.


    # Chapter 11: Font Feathered Frenzy—Adding New Fonts to Your System


    Whether you want to use the same fonts that you are plugging into their documents
    or you just want to add a bit of flair to your own, Chapter 11 will tell you how
    to do it in Ubuntu.'
  merge: -1
  pgno: 24
- img_proc: true
  md: '# Chapter 12: Polyglot Penguins—Speaks Your Language


    Need to jot off a note in Urdu? Write a book in Korean? Send a letter in Chinese
    to your friend in Chengdu? All of the basics you need to know to read and write
    in just any language in the world are provided in Chapter 12.


    # Chapter 13: Penguins at Work—Getting Down to Business in Linux


    Work can be a drag, especially when there are so many things you could be doing.
    Still, wearing the ''ol'' fingers to the bone is a part of life for just everyone
    outside of a Jane Austen novel, so you''ll be glad to know that Linux is a very
    capable system in this. Chapter 13 introduces you to the various productivity
    applications bundled with or for your system.


    # Chapter 14: Brush-Wielding Penguins—Linux Does Art


    Those of you with an artistic bent will find Chapter 14 especially useful. Working
    with your digital camera, modifying images, and building web albums are just some
    of the topics covered.


    # Chapter 15: Tux Rocks—Music à la Linux


    Chapter 15 is the music lover''s treasure trove. You will learn how to rip CDs,
    encode MP3 or Ogg audio files, and find out how to create your own mix-and-match
    audio CDs from those files. A number of audio ripping and playback applications
    are covered.


    # Chapter 16: Pluggin'' In the Penguin—Ubuntu and Your iPod


    Need I say more iPod? Want to use it in Ubuntu? Chapter 16 tells you how.


    # Chapter 17: Couch Penguins—Video and DVD Playback in Ubuntu


    Sitting in your dorm room trying to figure out how to play your DVD copy of the
    Baxter for your Ubuntu-sized computer? Just finished filming a video of your sibling
    talking while asleep and to create some editing of the evidence? Chapter 17 covers
    this and other video-related topics.


    # Chapter 18: Defending the Nest—Security


    Although Linux is about as safe and secure a system as you are likely to come
    across, folks feel a bit more secure . . . , feeling a bit more secure. Chapter
    18 tells you how to add a few lines of defense to your system.


    # Appendix A: Ubuntu Desktop CDs for AMD64 Users


    The CD bundled with this book is designed to work with AMD64 processors. It will
    also work with AMD64 processors, although not in 64-bit mode. Want to run Ubuntu
    with an AMD64 processor in 64-bit mode? It''s easy enough to do. Appendix A shows
    how to download Ubuntu Desktop CDs and burn them to disk.'
  merge: -1
  pgno: 25
- img_proc: true
  md: '# Appendix B: Resources


    Are you crazy for Ubuntu and want to say so? Check out a forum. Do you have hardware
    compatibility question? Some websites seem to have all the answers. Are you looking
    for free downloads or do you want to read up on the other Linux distributions?
    Appendix B is a great place to start.


    # How to Use This Book


    It is possible, to use this book as a mere reference text that you only consult
    when you have a problem to solve, but that would negate the basic concept behind
    its design. Instead, I recommend that you go through the entire book by chapter,
    doing the projects along the way. This will give you a much broader understanding
    of how things are done (and of how you can get things done), and it will reduce
    the chance for anxiety, confusion, and worse yet, mistakes.


    It is best to read this book and complete your projects when you are relaxed and
    have time to spare. Nothing things go worse than working in a rush. And keep in
    mind that Linux and the projects in this book are fun, not just work exercises.
    The whole point of the Linux world, in my opinion, is that it offers all kinds
    of fun. So go ahead and enjoy it.


    # About the Conventions Used in This Book


    There are only few minor points worth noting about the conventions I have used
    here. I have put in **bold** type the items within your system that you need to
    click or directly manipulate in any way, such as buttons, tabs, and menus. Where
    words or phrases are defined, they have been set in *italics*. Any text that I
    ask you to input will be indicated by `monospace` font. I have also opted to use
    the more graphically suggestive term `folder` instead of `directory`-no doubt
    the legacy of my many years as a Mac user.


    # About the Projects in This Book


    The projects and other information in this book are primarily geared towards users
    who have installed Ubuntu using the CD that comes with this book. Most of the
    information also applies to Ubuntu live sessions from the CD. You should note,
    however, that some projects and actions cannot be performed in live sessions,
    as they require write access to your hard disk, and this is not possible during
    live sessions.'
  merge: -1
