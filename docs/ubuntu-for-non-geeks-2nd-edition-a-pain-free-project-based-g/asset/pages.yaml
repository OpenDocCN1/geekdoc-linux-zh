  md: '# Creating Audio CDs


    All this talk about encoding and listening to MP3 and Ogg Vorbis files on your
    computer is fine and dandy, but there are no doubt times when you would like to
    have your songs on a plain audio CD that you can play while you slog your way
    to the New Jersey Turnpike or the Ventura Freeway. Frankly, this is easy enough
    to do, and there couple of ways to go about it.


    # Burning Audio CDs with Rhythmbox


    For Rhythmbox users, the easiest way of going about things is to do it all from
    Rhythmbox. To do this, first create a playlist with the songs you want to burn
    to CD, and then click the Create Audio CD button. A confirmation window will appear,
    asking you if you want to create the CD you''ve just set out. You do no doubt,
    so click the Create button, and copies of your tracks will be created in WAV format.
    When that process is complete, you will be prompted for a blank CD, so pop one
    into your drive, click OK, and the burn will begin. When it''s done, the progress
    window will vanish, and your new audio CD should pop out of your drive. Simple.


    # Burning Audio CDs with Serpentine


    Another way to play-anywhere audio CDs from your ripped MP3 and Ogg Vorbis files
    is with Serpentine Audio CD Creator, an application that comes bundle with your
    system. To go this route, go to the Applications menu and select Sound & Video
    > Serpentine Audio CD Creator. When Serpentine adds songs to the main pane by
    clicking the Add button and navigating to songs you want to add. You can add any
    mix of songs, in any mix of audio formats. You can also add songs you have saved
    to a playlist by going to the File menu and selecting Open Playlist or Rhythmbox
    Playlist, depending on the type of playlist in question. If you drag-and-drop
    kind of person, you can also drag the icons for your audio files directly from
    one or Nautilus window, from playlists within Rhythmbox, to the main pane of the
    Serpentine window.


    As you add songs to the Serpentine window, the CD image in the bottom of the window
    will show how much more space you have available on the disk (Figure 15-11). The
    default disk size is 74 minutes, which is the norm for a 650MB blank CD, so if
    you are using a 700MB CD, change the setting to 80 minutes by clicking the drop-down
    menu button next to the Disc Capacity and making the appropriate selection.


    When you have added all the songs you want to burn to the CD, click the Write
    to Disc button. Serpentine will then begin preparing the tracks to burn to disk.
    When it is ready, it will prompt you to insert a blank CD into your drive, so
    do that, and and once the LED on your drive starts blinking, click the OK button.
    Serpentine will then begin burning the disk, and'
  merge: -1
  pgno: 276
- img_proc: true
  md: 'when it is done, it will automatically eject your disk and let you know in
    yet another window that the job is done. You can then take the disk, plop it in
    your car stereo or wherever you want to play it, and enjoy the results.


    ![](img/8c9883c4544150d676aa7a1c159e9153_277_0.png)


    Figure 15-11: Preparing to burn an audio CD with Serpentine


    # Part 15B: Listening to RealMedia Streams with RealPlayer


    Now that you know how to play Ogg Vorbis and MP3 files and Internet broadcast
    streams, it is time to help your system go a bit more mainstream by installingPlayer
    10 (Figure 15-12). RealMedia streams are widely available on the Internet and
    are provided by many broadcasters, both local and international. You can also
    use RealPlayer to play RealVideo streams, when they''re available.


    ![](img/8c9883c4544150d676aa7a1c159e9153_277_1.png)


    Figure 15-12: RealPlayer


    Linux users familiar with earlier versions of RealPlayer will be happy to know
    RealPlayer 10 is much improved over previous Linux offerings. One of the big advantages
    is that RealPlayer 10 now has a working Firefox-compatible plugin, which means
    you can now listen to RealMedia streams that were previously unavailable because
    they could only be accessed through browser-embedded players. If you don''t know
    what I''m talking about, take a look at the example from the Radio Sweden site
    in Figure 15-13.'
  merge: -1
  pgno: 277
- img_proc: true
  md: 'The Radio Sweden (www.sr.se), like many others, uses an embedded player for
    the broadcast streams it provides; without installing the plugin, the player cannot
    be used (Figure 15-13, left). But once the RealPlayer plugin is installed, it
    controls everything automatically (Figure 15-13, right), allowing you to use the
    embedded player just as you want (shown in Figure 15-12).


    ![](img/8c9883c4544150d676aa7a1c159e9153_278_0.png)


    Figure 15-13: Embedded media players in Firefox before and after installing the
    RealPlayer plugin


    While on the topic of changes, I should also mention that RealPlayer 10 is now
    compatible. This means that if you change your system theme from Human to Cru,
    those effects take place in RealPlayer 10 too. You are no longer stuck with the
    fact that Real looks like you. things just keep getting better.


    Now that you know what is in store for RealPlayer 10, it''s time to get installing
    it. Before we begin, I should mention that there are actually three ways to install
    RealPlayer. In this project, I am going to focus on the easiest. It is also the
    standard and, without question, the most legal way of doing it.


    #  Installing RealPlayer


    Installing RealPlayer is easily accomplished via Automix. Just click Media Players
    and Editors in the left pane of the Automix window, and then check the box next
    to RealPlayer in the right pane. After that, just click the Start button, and
    you''ll be rolling.'
  merge: -1
  pgno: 278
- img_proc: true
  md: '# Setting Up RealPlayer and Testing Your Installation


    Now that Real Player 10 is installed on your machine, it is time to go through
    the final steps and test it all out. You can start going to the Applications menu
    and selecting Sound & Video > RealPlayer 10. A simple setup wizard will appear,
    which you will have no trouble with on your own, as you really have to do click
    the button in the bottom-right of the window four times. Once you have completed
    the wizard, the RealPlayer window will appear. To test the installation, close
    the RealPlayer window and open Firefox.


    The next step is to check the RealPlayer plugin is doing what it should. You can
    determine this by going to npr.org and clicking the 24-hour Program Stream link
    at the top of the page. Because you installed the two audio codecs via Automatrix
    earlier in the chapter, embedded Media Player window will appear. To switch over
    to RealPlayer, click the Set Preference at the bottom of the window, click the
    RealPlayer icon in the screen that then appears, and then click Set Preference
    again at the bottom of the window. The embedded player near the top of the page
    should now be RealPlayer (as you can tell by the RealPlayer icon at the right
    of the side).


    # Playing MP3 and Ogg Vorbis Streams with RealPlayer


    An interesting and not unwelcome result of installing RealPlayer with the Firefox
    plugin is that you can now play MP3 and Ogg Vorbis Internet streams with a single
    click of your mouse. Go to www.shoutcast.com and click the Tune In! next to one
    of the streams to see what I mean. All very handy, you''ve got to admit.


    # Going to Town with RealPlayer


    Now that you are all set up, you probably want some streams to try out. There
    are plenty of sites with RealMedia streams, but let me steer you to some of my
    favorites to get started (you may already know of these):


    +   - Världen (world music from Radio Sweden)

    www.sr.se/svärlden


    +   - Car Talk (car talk)

    www.cartalk.com/radio/show


    +   - Michael Feldman''s Whad''Ya Know? (comedy/game)

    www.notmuch.com


    +   - A Prairie Home Companion (Garrison Keillor, et al.)

    www.prairiehome.org


    +   - Radio Netherlands (public music)

    www.rnw.nl


    +   - Sounds Eclectic (alternative/world music)

    www.soundeclectic.com'
  merge: -1
  pgno: 279
- img_proc: true
  md: '# Other Cool Audio Apps


    The applications I have covered so far are only a taste of what Ubuntu has in
    store for you in its repositories. You can start out by browsing the offerings
    in the Add Applications tool or Automatis. You can also perform searches in Synaptic
    for other applications you hear about the Internet or that I mention in this section.
    Try them out, keep them if you like them, or remove them if you don''t. After
    all, it doesn''t cost you anything in Linux.


    To give you a starting point, I will mention a few applications that I think might
    be worth investigating.


    # Other Audio Players


    If music players that I''ve covered in this chapter have whetted your appetite
    for more, you are in luck—there are plenty, a few of which I will briefly introduce
    now.


    # Listen


    The very appropriately named Listen is a nice variation on the Exaile theme, though
    many find it more intuitive to use. Listen provides album cover art and lyrics
    fetching and display; onscreen display of currently playing track info; Wikipedia
    searches; Internet radio streams, including Last.fm similar artists (Figure 15-14);
    and a whole lot more. Check it out by downloading and installing via Automatis
    (click Media Players and Editors in the left pane, and then click Media Manager
    in the right pane). Once you have installed Listen, start it up from Applications
    > Sound & Video Listen Music Player.


    ![](img/8c9883c4544150d676aa7a1c159e9153_280_0.png)


    Figure 15-14: Last.fm similar artists suggestions in Listen'
  merge: -1
  pgno: 280
- img_proc: true
  md: '# Songbird


    Another, somewhat more recent entry in the Linux music player sweeps Songbird
    (15-15), which is very similar to and yet very different from everything out there.
    It is essentially what the Songbird folks describe themselves as a “desktop Web
    player, a digital jukebox and Web browser mash-up”. Hard to resist any sort of
    “mash-up” a, isn''t it?


    If you find yourself losing the resistance game, try Songbird by installing it
    via Automedia (Media Players and Editors) ▸ Songbird once it''s installed.


    ![](img/8c9883c4544150d676aa7a1c159e9153_281_0.png)


    Figure 15-15: The well-connected browser, jukebox, and player mash-up—Songbird


    # Beep


    With all the, multi-featured music players out there, it is easy to overlook the
    original, or in this case, a clone of the original—Beep. Beep is essentially a
    more GNOME-friendly version of the classic X Multimedia Stereo (XMMS) player,
    which was the original king of Linux audio players. Beep, like XMMS, is set up
    to work like a component stereo (with movable components!). The fact that it is
    skinnable means that you can make it look like a real component stereo, as well
    (Figure 15-16). You can download and install Beep via either Automatrix or Synaptic.
    To take it for a spin, go to Applications ▸ Sound &'
  merge: -1
  pgno: 281
- img_proc: true
  md: '![](img/8c9883c4544150d676aa7a1c159e9153_282_0.png)


    Figure 15-16: Different faces of the versatile, skinnable audio player Beep


    If you are an Internet junkie, there is probably no application as useful to you
    as Streamtuner (Figure 15-17). Streamtuner, as its name implies, an online radio
    stream tuner. It works by downloading available streams from a variety of sources,
    which you can then easily. When you find something you like, just select the stream,
    click the Play button, and the stream will open in the player of your choice (though
    it works best with RealPlayer or XMMS). If you will be using a different player
    for playback, select Preferences, and in the pane of the Preferences window, change
    the default applications for playback (most will be as XMMS). For example, if
    you want your playback to be from Beep, you should Listen to a .m3u file, scroll
    to the right, and change XMMS to beep-media-player.


    If you''re installing Streamtuner, you might as well install Streamri, which is
    a sort of Internet audio stream recorder. It works in conjunction with Streamtuner,
    allowing you to rip the streams you are listening to (and even if you aren''t
    listening to) and save them as MP3 files. To record a stream from Streamtuner,
    just right-click the target stream, and then select Record in the popup menu.


    ![](img/8c9883c4544150d676aa7a1c159e9153_282_1.png)


    Figure 15-17: Browsing Internet radio streams with Streamtuner'
