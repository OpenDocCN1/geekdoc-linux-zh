- img_proc: true
  md: 'Your printer is now set up and ready for use. However, just to make sure everything
    is hunky-dory, it is always a good idea to print a test page.


    +   - Right-click the icon for your printer in the Printers window, and select
    Properties in the popup menu.


    +   - In the Properties window that appears, click the Test Page button.


    Your system will send a document to your printer and let you know it''s done so
    in a small window, which you can close. The printer should print out the test
    document shortly.


    NOTE If your test page didn''t come out the way it should, or if your printer
    wasn''t configured automatically or correctly by the system, check www.linuxprinting.org,
    and see if there are any special requirements or caveats for your model.


    # For the Driverless Among You


    As I mentioned, there are some printers for which Linux does not have built-in
    support. For those of you who finds yourself with such printers, there are a few
    routes you can take in order to get things moving.


    # Checking the Connections


    You''d be surprised how many times I have triumphantly solved someone''s printer
    problems by simply wiggling or replugging your USB or parallel connectors. Loose
    connections are often the culprit when your printer''s model name fails to appear
    in the first page of the printer setup.


    If that approach fails, browse to www.linuxprinting.org, as it is sometimes the
    case that Linux can only support certain printers if they are connected via the
    parallel port, even if they work via USB in other systems.


    # Third-Party Drivers


    Recently, and more Linux printing drivers are becoming available. If you don''t
    find your printer on second page of the printer setup wizard, just trying Googling
    the make and model of your printer the word linux. In my case, having a Samsung
    SCX4100 printer driver that did not appear at www.linuxprinting.org, I searched
    for samsungs-SCX4100+linux.


    This led me to www.driver.com, which provides free printer drivers for most operating
    systems, including Linux. On that site, I found not only the driver for my printer,
    but also the driver for its built-in scanner.


    You might also want to check the website for the manufacturer of your printer,
    as many now provide Linux drivers for a number of printers. Brother, Lexmark,
    Hewlett-Packard, and Samsung, do to name a few. Canon seems to be the main holdout
    as far as the big guys. There is also a German company (www.turbprint.info) that
    provides Linux drivers, albeit for a fee, for machines that are really hard to
    deal with and for high-quality graphic solutions.'
