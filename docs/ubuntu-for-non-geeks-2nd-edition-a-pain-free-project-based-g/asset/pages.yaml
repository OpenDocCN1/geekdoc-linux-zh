    ```


    Once you have on your hard disk, extract the xmahjongogg-3.7.gz file either via
    the command line, as you learned to do in Chapter 8, or via the simple double-click
    method. It is easier for you to follow along with the directions I''ll be giving
    you, be sure to place the untared Xmahjongogg folder in your Home folder. Then
    you will need to roll through.


    Normally at this point, you would look through the folder to find some instructions
