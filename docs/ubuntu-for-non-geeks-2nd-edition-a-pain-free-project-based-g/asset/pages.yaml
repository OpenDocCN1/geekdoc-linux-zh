  md: '# Going in for Dip


    To get a taste of Ubuntu is all about (and to check out your hardware to see if
    it''s all comfy-cozy with Ubuntu), there is probably no better way to go run Ubuntu
    directly from the live CD. To do this, just place the Ubuntu Desktop CD in your
    disk drive and restart your machine. When the machine starts up again, it should
    boot up from the CD, and after a bit of white text scrolls the screen, you will
    see the first Ubuntu startup screen (Figure 2-1). If the screen does not appear,
    and your machine instead boots up into your usual operating system, then it is
    very likely that your machine''s BIOS needs to be changed so as to allow you to
    boot from CD.


    ![](img/8c9883c4544150d676aa7a1c159e9153_41_0.png)


    **Figure 2-1:** An Ubuntu live session startup screen


    You can access your machine''s BIOS by restarting and then pressing whatever key
    the onscreen instructions assign to accessing the BIOS setup. This is DELETE or
    F1, but not all machines are the same. The onscreen information passes so fast
    that you miss it, you can check your user''s manual to see what the correct key
    is. Once you get into the BIOS setup, change the boot sequence so that your CD
    drive is first.


    Once your machine does boot from the live CD, and you do see the Ubuntu live session
    startup screen shown in Figure 2-1, either press ENTER or do nothing for about
    30 seconds in order to continue. This will start up your Ubuntu in English with
    a US keyboard layout. Remember, your hard disk will go untouched, so rest easy—you''re
    not going to touch it, let alone hurt anything.


    If you would like your system to appear in a different language, press F2, select
    your language of choice using the cursor keys, and then press ENTER. You can change
    the default keyboard layout by pressing F3 and then following the same steps.
    Once you''re done, press ENTER to start up the system.'
  merge: -1
  pgno: 41
- img_proc: true
  md: 'Special input mechanisms required for typing in certain languages (i.e., Chinese,
    Japanese, and Korean) are not supported in live CD sessions.


    From then out, it is strictly autopilot time for you—all you have to do is wait.
    There will be some scrolling white text now and then, an occasional period when
    things will go back for a few seconds, but eventually things will go totally graphical
    when the GNOME desktop environment begins its initialization process, and when
    that is done . . . you will have to face with the Ubuntu desktop, meaning you''re
    ready to roll—but I''ll hold off on talking about until Chapter 3.


    # Taking the Plunge—Installing Ubuntu


    If you have already installed Ubuntu on your machine, are satisfied running it
    from the live CD, or still haven''t made up what to do, you can skip right over
    the rest of this chapter and go to the next one to get working with the Ubuntu
    desktop. If, however, you haven''t installed Ubuntu yet and are ready and ready
    to do so, then had better stay where you are and read on.


    # Single- or Dual-Boot Setup?


    If you don''t have Windows installed on your machine, you can skip right over
    this section. If, on the other hand, then you are going to decide whether or not
    you want to keep it.


    It is possible to have both Windows and Linux installed on the same machine and
    for them to happily coexist. This is known as a dual-boot setup. It also become
    incredibly easy to set up such a system. I started out with a dual-boot setup;
    however, eventually found that I used the Linux side of things exclusively. Having
    so much disk space being taken up by a Windows system I didn''t use waste of pristine
    real estate, so I dumped the whole thing and for a straight Linux-only setup.
    My feeling is that unless there is some application that you really need that
    is not available on the Linux side (probably some game), then go for the Linux-only
    setup and just forget about Windows. Linux has most of what you will need anyway,
    and the applications in the OpenOffice office suite can read and write Microsoft
    Office files, you''ll still be able to collaborate with Windows users, if that
    is of concern to you.


    You may be thinking that if you do as I suggest and dump your Windows system when
    you install Linux, you might have to reinstall Windows if you don''t like Linux
    or if you can''t get it installed properly. That would be a considerable waste
    of time and energy, to be sure. However believe it or not, there are advantages
    to my suggestion if your no-go scenario turns out to be the case.


    You may have noticed that your Windows system, you''ve used it over time, has
    gotten sort of gunked up—it is no longer the quick little kitten used to be. Menus
    don''t pop open as quickly as they used to be, thinks'
  merge: -1
  pgno: 42
- img_proc: true
  md: 'longer to start up than they did before, and you find yourself asking, "What
    the Sam Habberack is that?!" all the time as mysterious things happen with increasing
    frequency.


    This is just the nature of the beast, and a very good way of getting things back
    to normal is to reinstall the whole thing. So even if you decide to come back
    to Windows later, you''ll be doing yourself a favor, because it should run better
    than before. It''s a little more work up front, but in the long run, you''ll be
    a happy camper.


    If, on the other hand, you opt for a dual-boot setup, from which you can run both
    Windows and Linux, you will have the best of both worlds. Starting up either is
    easy. When you start up your machine, you will be greeted by the GRand Unified
    Bootloader (GRUB) screen, from which you can choose booting Linux or choose Windows
    in its stead. After that, bootup proceeds as normal for the system you selected.
    This system works fine, so you needn''t worry.


    So as you see, either way you decide to go, you can''t really go wrong. Just be
    sure to back your important files before starting the installation; proceed with
    common sense, patience, and a positive attitude; and you''ll be fine. Short: Don''t
    worry.


    # Getting Ready for Action


    There is less you need to prepare for an Ubuntu installation than for many other
    Linux distributions. Once you''ve decided whether or not you want to go the dual-boot
    route, all you really need to have on hand is your single Ubuntu Desktop disk,
    and for guidance and security, this. The only mental energy you''ll probably need
    to expend is to come up with a user-name and password, as you do for most other
    operating systems.


    # Usernames and User Passwords


    Your username is something that you will use quite a bit. You will input it every
    time you boot your system, so be sure it is something you can live with, especially
    in terms of typing. It can be your first name, or your initials, or whatever you
    want to be. It must, however, begin with a lowercase letter, followed by numbers
    and/or other lowercase letters. Mine, for example, is ng, but you could use something
    like hope4u2pal, that would get rather tiring to type at login day after day.
    Think of your fingers choosing your username.


    You also need to come up with a user password, which you will need to type every
    time you log in. You will need to use it when you install new software or change
    system settings, well. It should be a minimum of eight characters in length and
    consist of numbers and letters (upper- and lowercase) for improved security. You
    can, of course, get by with fewer characters and only letters if you prefer. The
    installer will advise you if the password entry is unacceptable, so don''t worry
    too much. Be sure to write it down and keep the paper you''ve written it on in
    a safe place so you don''t end locking yourself out of your system.


    Chapter 2'
