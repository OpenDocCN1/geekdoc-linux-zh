  md: '# Determining Your iPod''s Format


    How do you know whether your iPod is HFS+ or FAT32 formatted? Well, I said, it
    is basically a matter of knowing which system you''ve been using your iPod with
    up until now. When you first plugged your fresh, the out-of-box iPod into your
    computer, you really couldn''t do anything. At that time, your Windows or Mac
    system popped up asking you to run the iPod Updater. That tool is primarily a
    formatter, which formats your device.


    If you''ve been a two-OS sort of person upon happily using your iPod on both a
    Mac and a Winbox, then you can be sure that your iPod was formatted using FAT32
    because Windows sweeps out chalk when it tries to deal with anything that Microsoft
    itself didn''t create. In other words, Windows can''t read drives formatted HFS+,
    while Mac OS can read both HFS and FAT32 drives. If you are using an iPod Shuffle,
    you can also be sure that it is FAT32 formatted, because all iPod Shuffles are—period.


    Of course, if you''re a prove-it-to-me kind of person, you can seek truth from
    facts by plugging your iPod into your iTunes-equipped Mac or Winbox, and seeing
    what it says in the right pane of the iTunes window next to the Format. If it
    says Windows, you''re ready to go.


    If you don''t have a Mac or Winbox, you can check from Ubuntu by going to the
    Applications menu and selecting Accessories > Text Editor. Choose Open and File
    System in the right pane, double-click etc in the right pane, select the file
    tab, and then click the Open button to reveal the format of your iPod. Look for
    a line that says something like /dev/sda2 /media/ipod or /dev/sdb2 /media/ipod
    and see what is listed to the right of that. If it says vfat, then you know your
    device is FAT32 formatted. If it reads hfsplus, ... are just going to change it.


    # Reforming Your iPod


    And do you change your iPod from HFS+ to FAT32 format? Well, the easiest way is
    to find a machine running Windows 2000 or newer and a recent edition of iTunes.
    But, before you go any further, make sure that everything on iPod backed up, you
    are going to be reforming it, which means wiping it clean.


    Once you are ready to roll, make sure the Windows machine is connected to the
    Internet, start up iTunes, and plug your iPod into one of the Windows machine''s
    USB ports. A window should appear telling that you have a Mac-formatted iPod that
    must be restored before you can use it in Windows. Click OK.


    To bring your iPod to a comfy state of Linux usability, click the Restore button
    in the right pane of the iTunes window. A warning will appear telling you that
    everything on your iPod is about to be removed (hence my warning about backing
    up everything first). Click the Restore and Update button, and then follow along
    with the brief wizard. Once the wizard is complete, sit back and wait for your
    iPod to be restored (Windows-sized). This will take a couple of minutes, so enjoy
    the brief respite.


    Plugging'' In the Penguin 269'
