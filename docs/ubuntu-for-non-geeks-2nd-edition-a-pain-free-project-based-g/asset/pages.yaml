  md: '# Project 7E: Changing Your Splash Screen


    Well, now you''ve changed just about all there is to change system-wise, but there
    is actually one more item that you can tinker with—your splash screen. In case
    you''re not familiar with the term splash screen, it''s the screen that appears
    when GNOME is starting up after you log in before you get to your desktop. The
    default splash screen, shown in Figure 7-18, is pleasant enough, but you can choose
    something a bit wilder or at least most colorful if you are inclined.


    ![](img/8c9883c4544150d676aa7a1c159e9153_139_0.png)


    Figure 7-18: The default Ubuntu splash screen


    # 7E-1: Enabling Automatic Login


    When the Login Window preferences is open, it''s as good as a time to mention
    to an option that may be of interest to you. If you find it a drag to type your
    username and password every time you start your machine, you''ll be happy to know
    that you can bypass the whole login process. If you share your machine with other
    users, of course, this isn''t something you''d want to do because anybody with
    access to your user account. I wouldn''t recommend doing this on a laptop, as
    they are more easily lost or stolen, leaving your data at risk to absolute strangers.


    To enable automatic login, click the Security tab in the Login Window preferences,
    and then click the checkbox at the top of the next page to the Enable Automatic
    Login. After that, click the arrow on the right of the drop-down menu next to
    the User, and select your username from the list. Once you''re done, click the
    Close button. The next time you start up your machine, you will bypass the login
    screen and be delivered directly to the desktop.


    # 7E-2: Installing New Splash Screens


    Ubuntu does not come with alternative splash screens for you to play with, so
    in order to make changes, you first need to download and install some splash screens
    with which to work. This can be done easily by opening Art Manager (System ▸ Preferences
    ▸ Art Manager) and following these steps:


    +   - Go to the Art menu, and select Other Themes ▸ Splash Screen. Art Manager
    will download the available splash screens.

    - Once the download is complete, scroll through the workings, and select one that
    suits your fancy by clicking it once.


    Chapter 7'
