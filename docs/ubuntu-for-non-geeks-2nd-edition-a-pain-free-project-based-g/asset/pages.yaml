  md: 'You can switch users in much the same way you would using the logout/login
    approach. After clicking the Quit button in the top panel, you can click Switch
    User instead of Log Out. You are then delivered to the login screen where you
    type the username and password for the other account (each followed by a press
    of the ENTER key), just as you would normally in.


    To get back to your original user account after going the switch-user route, just
    click the Quit button at the right corner of the top panel, click Switch User
    (if you plan to return to the new account) or Log Out (if you don''t plan to return
    soon), and then once back at the login screen, type your username, press ENTER,
    type your password, and press ENTER again. In the small window that then appears,
    click the Return to previous login.


    Another window will appear, in which you must type the user password of the account
    you are returning to. Type your password, click Unlock, and you will be at your
    original desktop, with everything as it was when you last saw it, open windows
    and all. Pretty cool.


    # Logging In Another Account in a Separate Window


    If switching back and forth between accounts seems like too bit of a hassle to
    you, there is yet another, alternative—logging in to another account in a separate
    window while still in your regular user account.


    This being-two-places-at-the-same-time approach requires a bit of work front,
    but it provides a lot of convenience in the long run, not only when going through
    Project 7B on page 106, but whenever of those “rents, can I check my email for
    a second?” moments arises. To set things up so that you can do this, you need
    to install, set, and use an application Xnext. Do here are the steps:


    +   1. Run Synaptic, do a search for xnext, and install it.

    2. Once Xnext is installed, click Synaptic, right-click the Applications menu,
    and select Edit Menus in the pop-up menu.

    3. When the menu editor window appears, click System Tools in the left pane, and
    then click the next box to New Login in the right pane.

    4. Right-click New Login, and in the Launcher Properties window that appears,
    click the command to gdmlexiserver -n (making sure there is a space before -n).

    5. Click Close in both windows to finish.


    After performing these steps, you can log in to your new account by going to the
    Applications menu and selecting Tools > New Login. An Xnext window will appear,
    and after a few seconds, the Ubuntu login screen will appear within window. In
    that, type your new username (graphics, or whatever name you chose) and password
    as you would using any other login. Your new desktop will appear in the Xnext
    window (Figure 7-4).


    When you are done with your Xnext session, click the Logout button at the far
    right of the top panel within the Xnext window, and then click Logout in the set
    of choices that appears. The Xnext window will automatically close after you have
    been logged out of that session.'
