  md: '# FONT FEATHERED FRENZY


    Adding New Fonts to Your System


    ![](img/8c9883c4544150d676aa7a1c159e9153_208_0.png)


    There are basically two kinds of fonts: bitmap and outline. The difference between
    these two is essentially the same as that between bitmap and vector graphics,
    which I will talk more about in Chapter 14. *Bitmap* characters are stored as
    a map of dots—the bitmap. The main limitation of bitmaps is that they only look
    good at the size and resolution they were designed for. Just like bitmap images,
    the more you enlarge a bitmap character, the worse it looks. This is particularly
    noticeable in rounded characters, such as *O* and *P*, where “the jaggies” becomes
    an issue.


    Outline fonts, on the other hand, are similar in concept and design to vector
    graphics. Each character is stored as a mathematical formula, and just like vector
    graphics, outline characters keep their clean shape no matter how much you enlarge
    them. The main outline font formats are Type 1, or PostScript, which was developed
    by Adobe, and TrueType, which was developed by Apple. As free TrueType fonts are
    so readily available on the Internet and easily handled in Ubuntu, I will focus
    on TrueType fonts in this chapter.


    *'
  merge: -1
  pgno: 208
- img_proc: true
  md: 'Your Ubuntu system comes with a wide variety of very usable, and least to my
    eyes, rather handsome TrueType fonts. However, these tend to be on the conservative
    side of the aesthetic concern, and many users will want to add a few more distinctive
    fonts to the system repertoire. In my own case, I had this really cool idea of
    writing messages to my friend in old Scandinavian runes. (Of course, my friend
    wet blanked the idea, so it all came to naught. . . .)


    You probably won''t be interested in sending cryptic, runic messages to your friends,
    but you may want to print out an award for an event using some of Gothic font,
    or you might be preparing a newsletter for the local chapter of your snail-breeders
    society and to use a font that is round, bubbly, and slimy. Whatever your penchant,
    purpose, or desire, you will probably come to the point when you want to install
    some other TrueType fonts on your system.


    Before you install anything, of course, you will have to find fonts. The Internet
    is always good source, and there are many sites that have a variety of freeware,
    shareware, and for-sale TrueType fonts available for download. When choosing and
    downloading fonts, it is best to select those designed for Windows rather than
    those designed for Mac. Fonts designed for Windows will most likely be in the
    Zip files, which will pose no problem for you, because you can extract them with
    File Roller. Simply double-click them, just as you have with the other archived
    files you used far, and click the Extract button in the File Roller window when
    it appears. The font file will appear on your desktop (or wherever your Zip file
    happened to be) as an icon showing an upper- and lowercase case of the first letter
    in that font (Figure 11-1).


    ![](img/8c9883c4544150d676aa7a1c159e9153_209_0.png)


    Figure 11-1: Font icons display the first letter in the font.


    In addition to getting a glimpse of what the fonts look like these icons, you
    can also see all, or at least most all, of the characters in a given font by double-clicking
    the font icon. A window, as shown in Figure 11-2, will open, showing you most
    of the characters in A-to-Z format and then in the traditional “The quick brown
    fox jumps over the lazy dog” format that you may well remember from your junior
    or senior high school typing classes.'
  merge: -1
  pgno: 209
- img_proc: true
  md: '![](img/8c9883c4544150d676aa7a1c159e9153_210_0.png)


    # # Project 11A: Installing TrueType Fonts Locally


    How you install fonts depends on who is going to use them. If you have only one
    user account on your machine, the easiest way is to install the fonts locally.
    Locally installed fonts are ones that you or someone logged in to your user account
    will be able to use. On the other hand, if you have more than one user account
    and want the fonts to be available to all of the users on your machine, use the
    method described in Project 11B on page 193.


    # ## 11A-1: Getting the Fonts


    The Internet is free for fonts. In this project, I will point you to the www.fontfreak.com
    site, which has a very nice collection of fonts. Once you get to the FontFreak
    splash page, click **ENTER SITE HERE**, which will lead you to the main page.
    Then click the button on the left that says **Fonts**, which will bring you to
    the first page of fonts. You can browse through the various pages until you find
    some fonts to your liking. Which fonts you download is completely up to you, but
    be sure to choose the PC version of the font you want, not the Mac version to
    the right of the font sample.


    Since you will also need fonts for Project 11B, you may well download them now.
    In all in, for the two projects, you will need at least four fonts. When you''ve
    finished downloading, drag the font files to your home folder so it''s easy to
    follow along with my instructions. Also be sure to unzip your fonts before going
    on the installation steps.


    # ## 11A-2: Installing the Fonts


    For this project, let''s use one of the fonts you downloaded. After you''ve decided
    which font to use, follow these steps:


    +   1. Open a new Nautilus window by going to the **Places** menu in the GNOME
    Panel and selecting **Home Folder**. Once you''ve done that, open another Nautilus
    window by doing the same thing.'
  merge: -1
  pgno: 210
- img_proc: true
  md: '+   2. In one of the Nautilus windows, go to the Go menu, and select Location.
    A Location input box will then appear below the button bar in that window. You
    can also achieve the same result by pressing CTRL-L.


    +   3. In Location box, type fonts://, and press ENTER. Once you''ve done this,
    the window will be filled with the many icons representing the fonts you already
    have installed on your system. While you''re there, it wouldn''t be a bad idea
    to bookmark this window for future use.


    +   4. From the other open Nautilus window (your home folder window), select the
    unzipped font you want to install, and drag it to the fonts:// window.


    You will notice that when you dragged your new font from your home folder to the
    fonts:// window, the icon for your new font did not immediately appear. In fact,
    it will seem as if nothing had happened and your installation attempt was a bust.
    Well, despite this lack of acknowledgment, things were happening. The first time
    you install a font in this way, your system automatically creates a hidden .fonts
    folder in your home folder and places it there. If you don''t like this lack of
    immediate feedback, you can check your fonts by typing ~/.fonts in the Location
    box of one of the Nautilus windows. This will show you what fonts you have installed
    locally—at this point there will be only one.


    Now that you have installed your font, you can go ahead and give it a try in one
    of your applications, such as OpenOffice.org Writer.(Any running applications
    need to be restarted before the new font will appear in your application''s font
    menu.)


    # 11A-3: An Alternative Approach to Installing Fonts Locally


    If you prefer truly immediate feedback on your installation process, you can try
    the following variation of the installation process, which yields the same results
    as in Project 11A-2 on page 191. However, because this installation method uses
    the .fonts folder that is created in step 4 of Project 11A-2, you must either
    go through the process of Project 11A-2 with at least one font prior to trying
    this installation method, or create the folder yourself by opening a Terminal
    window (Applications ▸ Accessories ▸ Terminal), typing mkdir fonts in that window,
    and pressing ENTER. Now that you''ve got out .fonts folder, let''s use two more
    of the fonts you downloaded to try out the steps:


    +   1. Assuming you have already closed the two windows from Project 11A-2, open
    two new windows.


    +   2. In one of the Nautilus folders, type "/.fonts", and press ENTER. The main
    pane of Nautilus window will show only one font or, if you bypassed Project 11A-2
    and created the .fonts folder yourself, nothing at all. It would definitely be
    useful to bookmark this location while you''re there.'
  merge: -1
  pgno: 211
- img_proc: true
  md: '+   3. In the open Nautilus window, which is your home folder window, highlight
    both of the fonts you want to install by holding down the CTRL key and clicking
    the icon for each font. Release the CTRL key, right-click either of the highlighted
    fonts, and select Copy Files in the popup menu.


    +   4. In the .fonts window, right-click on any open space in the window, and
    select Paste Files from the popup menu. The fonts will appear in the Nautilus
    window.


    Of course, you can drag the fonts from your home folder to the .fonts folder instead
    of going through the procedure in steps 3 and 4. It''s strictly to you. Either
    way, the procedure outlined in Project 11A-3 yields exactly the same results as
    in Project 11A-2. The only difference is that you will immediately see that your
    fonts have been copied to the .fonts folder. Which method you choose in the future
    is, therefore, strictly a matter of personal preference.


    # 11A-4: Uninstalling Locally Installed Fonts


    Whether you used the installation method in Project 11A-2 or Project 11A-3, you
    can uninstall any fonts installed locally by opening the fonts folder in your
    home folder and then dragging the fonts you want to remove to the Trash.


    # Project 11B: Installing TrueType Fonts Globally


    As mentioned above, the fonts you have installed so far can only be used by when
    you log in under your usual username. If, however, you want to install fonts that
    can be used by you and anyone else who has an account on your computer, the process
    is slightly different. We''ll use one of the you downloaded for this part of the
    project.


    # 11B-1: Installing Individual Fonts Globally


    The font folder for globally installed fonts is in root territory, so you will
    need to use the sudo command in order to install fonts in this way. Here are the
    steps:


    +   1. Open a Terminal window, and create a new folder for your fonts within the
    global location (let''s call it MyFonts) by typing sudo mkdir /usr/share/truetype/MyFonts
    and pressing ENTER.


    +   2. Type your password when prompted to do so, and press ENTER.


    +   3. Copy the font you want to install to your newly created global folder by
    typing sudo cp font.ttf /usr/share/truetype/MyFonts and pressing ENTER. Be sure
    to include spaces on both sides of cp and after .ttf.'
  merge: -1
  pgno: 212
- img_proc: true
  md: 'Be sure to include spaces on both sides of font.ttf. Also, be sure to use the
    name of your font in place of the word font. For example, if your font is called
    arachnid, you would type sudo cp arachnid.ttf /usr/share/fonts/truetype/MyFonts.


    You shouldn''t have to enter your password after step 3 since you provided it
    in step 2, so the process is now complete. That being the case, go ahead and test
    things out by opening OpenOffice.org and looking for the font in the menu. Remember
    that you will need to restart OpenOffice if it was already open when you installed
    the font.


    # 11B-2: Installing Multiple Fonts Globally


    If you want to install several fonts globally at the same time, you can do so
    easily. The process is essentially the same as Project 11B-1 on page 193, with
    a slight variation. Here''s what you''ve got to do:


    +   Create a new subfolder in your home folder window. You can call anything you
    like, but I''ll be using the name fonts2go in this project.

    Unzip the fonts and then place the ones you want to install via this method into
    the new fonts2go folder.

    Open a Terminal, and then copy all the fonts in your new global font folder by
    typing `sudo cp fonts2go*.ttf /usr/share/fonts/truetype/MyFonts` and pressing
    ENTER. Note the spaces surrounding cp and after *.

    Type your password if prompted to do, and press ENTER.


    > In step 3, you did not need to type the names of the fonts, the wildcard character
    (*) was essentially telling your system to copy all files ending in .ttf within
    the fonts2go folder.


    Now that you are done, check your results in OpenOffice.org. You should also back
    up the font files in the fonts2go folder to CD or floppy (just in case you need
    to install them on another system) and then trash the files. Keep the folder,
    so that you can use it again in the future.


    # 11B-3: Uninstalling Globally Installed Fonts


    If you want to remove any fonts that you installed using either of the global
    installation methods introduced in this project, you can do so in the following
    manner:


    +   Open a Terminal window, type `sudo rm /usr/share/fonts/truetype/font.ttf`,
    and press ENTER. Be sure to replace `font.ttf` with the name of the font you are
    installing.

    Type your password, and press ENTER when prompted to do so.'
  merge: -1
  pgno: 213
- img_proc: true
  md: '# Project 11C: Installing Microsoft Windows Core Fonts via Synaptic


    It like or not, the computing world is still pretty much a Microsoft world, and
    that means the vast majority of users, even Mac users, are using Microsoft fonts.
    That being the case, it is inevitable that you will have to deal with documents
    using fonts such as Georgia, Verdana, New Roman, and Courier, to name a few. Of
    course, your system can substitute the fonts it has for in the document, but in
    order for you to see things as you were intended and to allow others to see your
    documents the way you intended (web pages are good examples), it will probably
    behoove you to install Microsoft core fonts on your own system.


    Fortunately for you, there are two ways to get these fonts. One is to download
    and install them via Synaptic, the other, for those of you with a dual-boot system,
    is to simply copy them from your Windows partition. In this project, I will explain
    how to perform the first of these procedures, if you''re a Windows-less Ubuntu
    user (or a dual-booter who thinks the Synaptic approach is easier), here''s what
    you need to:


    +   1. Run the Package Manager (System ► Administration ► Package Manager), and
    provide your username when prompted.

    2. Click the Search button. In the Search window that appears, type mstcorefonts,
    and then click the Search button in that window.

    3. The mstcorefonts package should now appear in the list pane of the main Synaptic
    window, so click on the package name, select Mark for installation in the popup
    menu, and then follow the standard procedures you learned in Chapter 5 for installing
    a package via Synaptic.


    When the process is complete, your new Microsoft fonts will have been successfully
    installed and ready for immediate use by every user account on your machine.


    # Project 11D: Installing Microsoft Core Fonts from Your Windows Partition (for
    Dual-Booters)


    If you''re a dual-booter with Windows installed on another partition of your hard
    disk, you can take advantage of the fonts you already have on your Windows partition.
    This can be as easy as what you did in Projects 11A and 11B or more difficult,
    depending on whether or not you installed the Automatis read/write NTFS and FAT32
    Mounter in Chapter 9. If you did install it, your Windows partition should already
    be mounted and you can just shoot down to Project 11D-3.


    If you did not install the Automatis M, you can either go back and do so, or you
    can mount your Windows partition manually. If you are going to go this more cumbersome
    manual route, continue on to 11D-1.'
  merge: -1
  pgno: 214
- img_proc: true
  md: '# 11D-1: Finding Your Windows Partition


    Before you can actually mount your Windows partition, you need to find out where
    it is, and in what filesystem it is formatted, either File Allocation Table (FAT)
    or New Technology File System (NTFS). As is common in Linux, there are a couple
    of ways to do this. If there is a command, you can check things out by opening
    a Terminal window, typing sudo fdisk -l (that''s the lowercase L, not a numeral
    J), and then pressing ENTER. You will be prompted for your password, so type it,
    and list of the partitions on your hard disk will appear (Figure 11-3).


    ![](img/8c9883c4544150d676aa7a1c159e9153_215_0.png)


    Figure 11-3: Finding your Windows partition in the fdisk table


    Take a look at this seemingly incomprehensible list, and then find the location
    and format of the Windows partition on your hard disk by scanning the column on
    the right for the first entry with the word FAT32 or NTFS. In most cases, this
    will be the first partition, /dev/hda1, but in the list for your hard disk, shown
    in Figure 11-3, the first partition is taken up by some diagnostic utility that
    the manufacturer''s Windows install disk had on it. If you''re using a computer
    from a brand-name manufacturer, you might find yourself in a similar situation.


    Once you''ve found the FAT32 or NTFS partition, jot down the filesystem type,
    and then do the same for its location at the left far of the list. In my case,
    that would be /dev/hda2 and FAT32.


    # 11D-2: Mounting Your Windows Partition


    Armed with the information you gathered, you can now mount your Windows partition
    by doing the following:


    +   1. Create a mount point for your Windows partition by opening a Terminal window,
    typing sudo mkdir /media/windows, and pressing ENTER. You need to perform this
    step the first time you try to mount your partition. After that, you need only
    perform steps 2 and 3.'
  merge: -1
  pgno: 215
- img_proc: true
  md: '2. What do you do in this step depends on whether your Windows partition is
    FAT32 or NTFS formatted. Choose the appropriate step, being sure to substitute
    /hda2 if that is what your Windows partition has to be.


    If your Windows is in FAT32 format, type


    ```

    sudo /dev/hda1 /media/windows/- -t vfat -o charset=utf8,umask=000

    ```


    If it is in NTFS format, type


    ```

    sudo /dev/hda1 /media/windows/- -t ntfs -o nls=utf8,umask=0222

    ```


    3. Once you''ve typed the appropriate entry, press ENTER. If asked for your password,
    type it, and press ENTER. The Windows partition will then be mounted. You can
    double-check by opening a Nautilus window and clicking the Computer button. You
    should find a hard disk icon with the word windows beneath it. You can even double-click
    that icon to access the files you have, but you cannot save files to the partition
    if it is in NTFS format (a good reason for installing the Automatrix Mounter is
    it allows you to do so).


    #  11D-3: Installing Fonts From Your Windows Partition


    Now that your Windows partition is mounted, you can copy the fonts you have and
    install them for within Linux. To start, go back to the Terminal window, type
    cd press the space, and then type the path to your Windows folder. Most likely,
    the path to your font folder will be /mnt/windows/WINDOWS/Fonts, but it might
    be slightly different (/mnt/windows/Fonts, for example) depending on the version
    of Windows you are using. Once you''ve typed what you need to install, press ENTER.


    Depending on whether you want to install your Windows fonts locally or globally,
    the next steps will be different.


    # Installing Windows Fonts Locally


    To install your Windows fonts locally, just copy the font that you want to install
    to your .fonts folder by typing cp fontname.ttf ~/.fonts/ in the still Terminal
    window and pressing ENTER. Be sure to replace fontname with the name of the font
    you want to install.


    If you want to go wild and copy all the fonts in your Windows font directory (that''s
    a lot of fonts, mind you!), you can type *.ttf instead of fontname.ttf. Be sure
    that there is a space between cp and fontname.ttf and ~/.fonts/. Once you''re
    done, youre.


    # Installing Windows Fonts Globally


    To install your Windows fonts so that all users on your machine can use them,
    just return to the still open Terminal window. Copy the font you want to the personal
    system font folder created in step 1 of Project 11B-1 on page 193 (and if you
    didn''t perform that step then, so now) by typing'
  merge: -1
  pgno: 216
- img_proc: true
  md: 'sudo fontname.ttf /usr/share/fonts/truetype/MyFonts. If you want to copy and
    install all of the fonts in your Windows font directory, you can do so by typing
    sudo cp *.ttf /usr/share/fonts/truetype/MyFonts instead. After typing either of
    those strings, press ENTER, which you will probably be prompted for your password,
    so type it, and press ENTER again. The job will then be done.


    # Unmounting Your Windows Partition


    If you mounted your Windows partition manually, you can unmount it immediately
    after finishing your work with it, or you can wait until you shut down your system,
    whereupon it will be automatically unmounted. Before you can unmount it, you must
    first be certain you aren''t accessing the directory, either from the Terminal
    window or Nautilus. So, before issuing the unmount command, close any Nautilus
    windows open to that partition or, if you are using the Terminal, use cd to change
    back to your home directory. Type sudo unmount /media/windows (that''s u-mount,
    not un-mount), and press ENTER.


    # Customizing Your System Fonts


    Now that you know how to get and install fonts, you might be itching to use some
    of them to further customize your system. To get starting this, just select **Preferences
    > Font in the System** menu, which will bring up the Font Preferences window,
    shown in Figure 11-4.


    ![](img/8c9883c4544150d676aa7a1c159e9153_217_0.png)


    Figure 11-4: Setting system font preferences


    As you can see, you can specify font preferences in five categories: applications,
    documents, desktop, window titles, and the Terminal (fixed width font).'
  merge: -1
  pgno: 217
- img_proc: true
  md: 'The choices you make effect immediately, so you will soon know whether or not
    you can live with them. Unlike the other aspects of custom-ization, those choices
    could drive you starving mad. Sure, it is easy and fun to live with the gaudiest
    desktop imaginable, the wildest and most mis-matched color scheme on the planet,
    and the goofiest icons ever to be seen by post-Neanderthal man, but if your font
    selections get too out of hand, watch out! You do have to be able to read the
    results, after all.


    # Making Things Look Better


    The fonts you use on your screen generally look quite smooth and clean. If you
    are using an LCD monitor, however, you may find that fonts will look even better
    if you use Subpixel smoothing (LCDs) in the Font Preferences window. If you are
    not sure whether you need to do this, just give it a try, and if you see any difference.
    GNOME applies changes immediately upon selection, so if you keep a window with
    it open before the pref-ferences window, you can easily see the effect of each
    of your selections as you make them.


    # Creating Your Fonts with FontForge


    After all this font talk, it seems appropriate that I end this chapter by giving
    you the means to create your own fonts (or at least modify someone else''s). FontForge
    (previously known as PEdit) allows you to create or modify TrueType, PostScript,
    and bitmap fonts (see Figure 11-5). The interface itself seems a bit dated, but
    don''t let that fool you; FontForge is quite capable and easy to use.


    ![](img/8c9883c4544150d676aa7a1c159e9153_218_0.png)


    Figure 11-5: Using FontForge to create and modify fonts


    Font Feathered Frenzy 199'
  merge: -1
  pgno: 218
- img_proc: true
  md: '# Downloading, Installing, and Running FontForge


    You can easily download and install FontForge via Synaptic. Just do a search for
    fontforge, mark the **fontforge** and **fontforge-doc** packages for installation
    when they appear in the list of search results, and then follow the usual procedure
    for installing packages via Synaptic. You can run FontForge by going to the **Applications**
    menu and selecting **Graphics > FontForge**. An Open Font window will appear,
    in which you can select the font you want to work with. Make sure that it is not
    an installed font, but rather a font located within the home folder itself, or
    within another visible folder.


    After that, I think I had better leave you to your own resources (and those of
    theirs). Font creation and modification is, after all, too complex a topic for
    this book, but those of you already into this stuff probably just needed a pointer
    to the right tool and not my meager instructions. If you need more than a pointer,
    the FontForge help files are a good place to start, as is the FontForge project
    page at http://fontforge.sourceforge.net.'
  merge: -1
  pgno: 219
- img_proc: true
  md: '# 12


    # # POLYGLOT PENGUINS


    *Linux Speaks Your Language*


    ![](img/8c9883c4544150d676aa7a1c159e9153_220_0.png)


    These days, almost all operating systems are multilingual, or at least capable
    of becoming so. This is true of Linux as well.


    The multilingual capabilities of Linux are much greater than this, and the way
    GNOME-based distros, such as Ubuntu, handle multilingual makes it quite easy to
    take advantage of these capabilities. As you will soon see, you can even set up
    your system to give you a totally foreign language environment, allowing you to
    function completely in the language of your choice. Add to this the ever-expanding
    number of free programs available for language study, and you have a truly meaningful
    language-learning tool.'
  merge: -1
  pgno: 220
- img_proc: true
  md: '# Read-Only Language Support


    If all you want to be able to read web pages or documents written in a foreign
    language, you don''t need to install any additional language support except in
    some cases. From the get-go, you will be able to view documents in just about
    any language you have thrown at your system—doesn''t matter if it''s Swedish,
    Chinese, Italian, Japanese, Arabic, Hebrew, Russian, Vietnamese, Armenian, or
    Thai. You will be able to read whatever you are linguistically capable of reading
    (see Figure 12-1 for an example).


    ![](img/8c9883c4544150d676aa7a1c159e9153_221_0.png)


    # Changing the Character Encoding in Firefox


    Firefox usually automatically recognizes the language in which a web page is written
    and displays the page correctly. Sometimes, the author of the page may neglect
    to include the character coding for that page in the HTML, in which case Firefox,
    not knowing that the page is prepared in another language, will use the default
    language of your system. The result is a page in which you see nothing but odd
    combinations of symbols and letters that have no meaning. In this case, try changing
    the character coding in Firefox to the language you believe the page to be in.
    Some languages employ more than one encoding scheme, if you''re not sure, give
    each one a try. You can make your choices by going to the Firefox View menu and
    selecting Character Encoding. From the submenu there, you can select the appropriate
    coding for the language of that page.


    # Typing Nonstandard Characters


    Typing characters that are not standard in English, such as é, ç, ß, ø, æ, and
    å, can be done quite easily in Linux without modifications. In most situations,
    you can do this by using the Character Map utility included in your'
  merge: -1
  pgno: 221
- img_proc: true
  md: 'system, which can be found at Applications ▸ Accessories ▸ Character Map. Upon
    running Character Map, a window like the one shown in Figure 12-2 will appear.


    ![](img/8c9883c4544150d676aa7a1c159e9153_222_0.png)


    Figure 12-2: Inputting characters with the Character Map


    To input the character you want, select the language or character in the left
    pane of the window, and then, in the right pane, click on the character you want
    to input. The character will appear in the little input box next to the words
    Text to copy and then click the Copy button, and paste that wherever you want
    to place it.


    In certain applications, the various OpenOffice modules, this method will not
    work. In these cases, the program usually offers a method of its own. In OpenOffice,
    for example, you can click Insert in the menu bar and select Special Character.
    A selection window will open, and you can select the character you want there.
    Once you''ve done that, click the OK button, and the character will appear in
    your document, after which selection window will close by itself.


    # Using the Compose Key Option


    If you only need to type an accent or umlaut once in a while, and don''t feel
    particularly keen on opening an application or going to a special menu to do so,
    the compose key option for your keyboard is a good way to go. Basically what this
    means is that you use one of the lesser-used keys on your keyboard in conjunction
    with some symbols ('', ''~'', ^) to help in the creation, to speak, accented characters.
    By default, the compose key is the right ALT key.


