    # $ ln


    The ln (link) command is used to create a link file that launches or activates
    another file located in a separate folder. This is very useful when trying to
    activate a file that is buried deep in the subfolder of a subfolder of a subfolder
    somewhere on your hard disk. The command is very often used with the -s (symbolic)
    flag, which provides essentially the same thing as the shortcut you''ve come to
    know in Windows, or the alias on the MacnThe easiest way to use ln is to first
    use the cd command to change the Terminal''s location to the folder where you
    want to place the link. You can then type the ln command on the command line,
    followed by the path of the file you wish to link. For example, let''s say that
    you want to put a link in your home folder for an OpenOffice Writer file of your
    autobiography called myLife.sxw. The file is pretty well buried in a nest of subfolders
    deep within your home folder: /home/username/Documentia/personal/self/autobiography/myLife.sxw.
    To create the link, you would press the following string, and


    ```

    ln -s Documentia/personal/self/autobiography/myLife.sxw

    ```


    Once you are finished, the link will appear in your home folder as an icon matching
    the original file in appearance, albeit sporting an arrow to signify that it is
