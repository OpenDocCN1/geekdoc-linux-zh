  md: '# # gtkpod


    ![](img/8c9883c4544150d676aa7a1c159e9153_292_0.png)


    # ## Figure-14: Managing your iPod with gtkpod


    # ### Downloading, Installing, and running gtkpod


    Of course, in order to use gtkpod, you first have to download and install it.
    You can do this by Synaptic: doing a search for gtkpod and installing gtkpod-aac
    by following the installation steps in Project 5A on page 68. If you didn''t install
    the multimedia codec packages on Project 15A on page 246, now would be a good
    time to do so. After that, plug your iPod into your computer''s USB ports, if
    you haven''t already. Once your iPod is mounted (once the icon appears and Rhythmbox
    opens), go to the Applications menu and Sound & Video gtkpod. You can close Rhythmbox
    if you like.


    # ### Using gtkpod


    When the gtkpod window opens, you should see three entries in the left pane: Local,
    Podcasts, and iPod. To display the contents of your iPod, click the entry for
    your iPod in the left pane and click the Load iPod(s) button. The contents of
    your iPod will appear in the right pane. If you have any playlists on your iPod,
    click the small arrow to the left of your iPod''s name in the left pane of the
    window to reveal your lists.


    To add new songs or folders of full songs, click the Files or Dirs menu bar and
    navigate to the items you want to add. You can also create playlists by clicking
    Playlist to create a playlist of the contents of a particular folder, or by clicking
    the New PL to build your playlist.


    When you click New PL, a new list will appear in the Playlist pane on the left
    side of the window. Drag the songs you want from the right pane to the new list
    in the left pane in order to build your list. (Just be sure to drag the files
    directly onto the playlist icon, as gtkpod can be a bit finicky in this department.)
    You can also add songs to existing lists in the same way.'
