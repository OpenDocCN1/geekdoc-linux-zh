- img_proc: true
  md: 'This second page of the wizard should automatically open with the make and
    model of your printer selected, as well as the recommended driver for your printer.
    If the model chosen is not correct, scroll down the list until you find the correct
    model. If your model is not listed, try the one that selected by default.


    +   Once your printer is selected, click the Forward button, which will bring
    you to the last page of the wizard.


    +   On this page, type a name for your printer, and, if you want, a description
    and its location. When you''re finished, your window should look like mine in
    Figure 10-3. You can then click Apply.


    ![](img/8c9883c4544150d676aa7a1c159e9153_197_0.png)


    Figure 10-3: The final page of the printer setup wizard


    The wizard will close, leaving you in the Printers window where you started this
    quest. An icon for your printer should now appear in that window alongside the
    New Printer icon that you originally found. If you have set up more than one printer,
    you can choose which one would be the default by right-clicking it and selecting
    Make Default in the menu that appears. The icon for that printer should then be
    emblazoned with a blue checkbox (Figure 10-4), indicating that it is the default
    printer for your system.


    ![](img/8c9883c4544150d676aa7a1c159e9153_197_1.png)


    Figure 10-4: The New Printer icon in the Printers window after completion of the
    printer setup wizard


    178 Chapter 10'
