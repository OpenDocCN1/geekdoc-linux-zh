  md: '![](img/8c9883c4544150d676aa7a1c159e9153_318_0.png)


    Figure 18-6: Entering your avast!

    license key


    The main avast! window (Figure 18-7) will now appear, before you get started scanning
    any, it is a good idea to check for any updates to your virus database. New viruses
    are constantly appearing in cyberspace, so you should keep avast!'' virus database
    up to date so that it recognizes any viral newcomers. To perform the update, just
    click the Update database button, and let avast! do its thing.


    ![](img/8c9883c4544150d676aa7a1c159e9153_318_1.png)


    Figure 18-7: avast! virus scanner


    When avast! is updating the virus database, you can get on to the work of virus
    scanning by first deciding whether you want to scan just your Home directory,
    the entire system, or selected folders. You can also decide how thorough a scan
    you wish to perform via the three choices available in the middle of the window:
    Quick, Standard, or Thorough.'
  merge: -1
  pgno: 318
- img_proc: true
  md: 'Which one of these sensitivity modes you choose depends on how thorough you
    want the scan to be. The Quick scan just scans files that end in certain extensions
    (.exe, .com, .doc, and so on), because these are the file types that are most
    often virus carriers. The Standard scan targets more files, ignoring extensions,
    but still limiting the scan to those file types that are usually associated with
    viruses. Finally, the Thorough scan scans everything and searches for every type
    of virus.


    Once you have made your selections, click the Start scan button, and avast! will
    start doing exactly that—showing its progress within the same window, no less.
    When the scan is complete, a small window will pop up telling you, hopefully,
    that no viruses were found. (When was the last time you got a message like that
    on your Windows machine?)'
  merge: -1
