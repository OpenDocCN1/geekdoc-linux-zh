  md: '# ## SIMPLE KITTEN WAYS

    Getting to Know the Linux Terminal and Command Line


    Many people shy away from Linux because they envy it as a system for compu-geeks,
    an environment in which you do everything the hard way—by command line. In this
    era of graphical interfaces, the idea of typing commands to get things done seems
    a dreadful drawback to the days of DOS, and that puts many people off—especially
    those who remember what it was like in the “old days.”


    This reaction is fair enough, but it is not really an accurate reflection of the
    reality of the Linux world. After all, most Linux users today utilize some sort
    of graphical interface. They can, and often do, achieve all through drop-down
    menus and mouse clicks alike. Many are able to survive quite happily without ever
    once opening their Terminal. The same could be true of you.'
  merge: -1
  pgno: 144
- img_proc: true
  md: 'Be that as it may, there is still much to be said for the power and convenience
    of the command line. The fact that the command line can now be utilized within
    a graphical environment makes it much less forbidding. The Terminal is just a
    tiny text-based island in a sea of graphical bodies (see Figure 8-1). Using the
    command line can be as pain-free as anything else you do on your system, and it
    can actually produce a little life if you are giving it a try.


    ![](img/8c9883c4544150d676aa7a1c159e9153_145_0.png)


    Figure 8-1: Putting the Terminal in perspective


    Unfortunately, many guides to using the command line are written by hard-core
    command-line junkies, whose enthusiasm for what they see as a really good thing
    inadvertently makes what they write even more off-putting to the recent Linux
    immigrant or wannabe.


    For your sake, I will try to curb my own enthusiasm so as not to scare you back
    to Chapter 5 and the comfortable world of Synaptic. I will also try to help you
    keep things in perspective by teaching you, whenever possible, to use the command
    line as a complement to the various graphical tools that you have at your disposal,
    rather than presenting it as the sole way of going about things. Of course, I
    am not going to cover every possible angle in this regard—just enough to give
    you some exposure and experience and, hopefully, make you feel at least a little
    more at ease with the command line. Who knows; could you actually come to think
    of using the command line as . . . fun? Well, I won''t get carried away.


    126 Chapter 8'
  merge: -1
  pgno: 145
- img_proc: true
  md: '# Meet the Terminal


    The Linux Command Terminal application in your Ubuntu system can be run by going
    to the Applications menu and selecting Accessories > Terminal. When the Terminal
    opens, it will, in all its simplicity, look much like Figure 8-2.


    ![](img/8c9883c4544150d676aa7a1c159e9153_146_0.png)


    Figure 8-2: The Terminal application


    As you see, all it says is rg@UbuntuAcer:$. In this case, the rg is username,
    UbuntuAcer is the name I gave my computer during installation, and the tilde (~)
    signifies that I am in my folder. If it were to say ~/Music, for example, it would
    mean that I am currently in the Music folder within my home folder. Of course,
    all this will be different in your case, your username and computer name will
    be different. If your username is frogand your computer''s name is wetrock, for
    example, the command line will say frog@wetrock:$. If all this is sounding rather
    obtuse to you, just think of it this way: username@computer_name~$ in the Terminal
    is the equivalent of your home folder in Nautilus


    Typing in the Terminal is straightforward enough; just as you usually do. You
    can also delete and insert letters or phrases by using the DELETE and BACKSPACE
    keys and the cursor keys. For practice, try the following:


    +   1. Type I like strawberries very much.

    2. Change strawberries to cherries (because cherries are, in fact, so much better).
    Use your left cursor key to move the cursor in front of the first s in strawberries.

    3. Tap the DELET key as many times as necessary to erase the word strawberries
    (uh, that would be 12 times, methinks).

    4. Just type cherries, and use your right cursor key to move the cursor back to
    the end of this meaningful sentence.


    Now you''ve completed this fascinating bit of typing practice, press the ENTER
    key. As you will immediately see, the Terminal''s response to your efforts far
    is merely a dismissive bash: i command not found. Although you typed a string
    of text that has meaning to you, it means absolutely nothing to your system. In
    fact, the system was so shortsighted'
  merge: -1
  pgno: 146
- img_proc: true
  md: 'that it could see nothing other than the first word you typed in the Terminal
    (I); and because I is not a valid command, the system had no idea what to do with
    it.


    # Shells


    You may be wondering what this bash business is all about and why it is talking
    to you. Well, Bash (Bourne Again Shell) is one of the many shells that are used
    in Linux systems, and it''s the one that happens to come with your Ubuntu distro
    (and most others, for that). Bash is a program that interprets the commands you
    type into the Terminal and delivers them, to speak, to your system so it can act
    upon them. I like to think of it as a command-handling subsystem, for which the
    Terminal acts as a graphical front end. Some scripting languages, as you will
    find out in Project 8C on page 146, also have their own shells; but those few
    exceptions, you generally need not be unduly concerned with shells other than
    to know what they are and what people are talking about referring to them.


    # Some Goofy, Yet Useful, Fun with the Command Terminal


    A cool thing about typing in the command Terminal is that it has what you might
    call short-term memory. It works by typing the word **cherry** and then pressing
    ENTER. Ignoring the command-not-found-message, go on and type **vanilla**, and
    press ENTER. Now you type **icecream**, and press ENTER. So, so right? Well, not
    really. Let''s type everything we''ve typed far again, but this time let''s do
    with only one key.


    Huh?


    Yes, just press the up key once, and what do you see? That''s—the last command
    you type appears, and in this case it would be *icecream*. Press the up key again,
    and the command that you typed before that *vanilla*—appear. One more time? Yes,
    cherry. And one more time for the grand finale . . . I like cherries so very much.


    Considering what we have typed so far, this all seem a bit silly, but imagine
    you''re not typing goofy little words and instead have to deal with considerably
    longer strings, such as a simple command (which you''ll learn later in this chapter)
    like


    ```

    cp photos/stpieer/co/onthebeach27.jpg /home/frog/

    photos_for_mom/stpieer

    ```


    By typing that string, you are copying an image from the coastal folder to another
    folder called stpieer. If you want to copy another photo to the coastal folder,
    beach1_16.jpg, for instance, you could simply press the up arrow key once, use
    the left key and DELETE key to move over and delete the 27, replace it with 16,
    and use the right arrow to get back to the end of the command. In all, it would
    be much simpler and much faster. It would also help you avoid mistakes in typing.
    Not so dumb anymore, eh?'
  merge: -1
  pgno: 147
- img_proc: true
  md: '# Nontoxic Commands


    As you now know, all of this typing is easy enough, but in order to actually do
    something useful with your Terminal, you need to type commands—and there are more
    of them than you could hope or need to know. To get you started, we will begin
    with some commands that are easy to understand, nontoxic, and completely kitten-friendly.


    # $ whoami


    There is no command as easy, safe, or even seemingly useless, as whoami. Rather
    than help those with multiple-personality disorders discover who they are at any
    given moment, the whoami command simply tells you which user is logged in. Try
    it out by typing whoami at the $ and then pressing the ENTER key. Remember that
    commands are sensitive, so type accordingly.


    The Terminal will tell you the username of the person currently logged in. If
    you are logged in as frog, you should get frog as the answer to your finger


    # $ finger


    If you involved discovering who you are with the whoami command, then you might
    enjoy finding out more about yourself using finger command. The finger command
    can be used in a number of ways, but a very simple one is finding out about a
    particular user. Try this out by typing finger and your username. In my case,
    that would be finger rg. Once youve typed the command, press ENTER and see what
    you get. You can see my results in Figure 8-3.


    ![](img/8c9883c4544150d676aa7a1c159e9153_148_0.png)


    Figure 8-3: Output from the finger command


    As you can see, my login name is rg, my real name is Rickford Grant, my home directory
    is /home/rg, I am using the bash shell for typing my commands, I have been logged
    on since Sun Apr 1 at 18:44 EDT, and I have no mail or plan. It doesn''t tell
    you my social security number or your mother''s maiden name, but it is pretty
    cool, don''t you think?


    I mentioned that the results said no plan, and you may be wondering what that
    is all about, I''ll fill you in. A .plan file is a small file kept in your home
    folder that other users see when they use the finger'
  merge: -1
  pgno: 148
- img_proc: true
  md: 'command on. Traditionally, a .plan file contained information about where you
    were going to be or what you were working on. These days, however, most people
    use them to leave little messages, quotations, or whatever, they do in email signatures.
    Take a look at Figure 8-4 to see what happens after I add a .plan file to my home
    folder.


    ![](img/8c9883c4544150d676aa7a1c159e9153_149_0.png)


    Figure 8-4: Output from the finger command with a plan


    You can now see my plan, which is a quotation from Kurt Vonnegut The Sirens of
    Titan (or Al Stewart) by the same name, for that matter), though you could put
    anything in your own. You will get the chance to create your plan file in Project
    A on page 140, so if this seems far to you, just hang in there.


    Before moving, I should mention that you can also use the finger command to do
    a domestic espionage of sorts. Let''s say your friend, Chris, has a user account
    on mine. Chris who wants your permission to go to the movies, claims to have been
    hard at work on the computer all day writing up a report for school. Having your
    doubts, you could type finger chris to see what the facts actually are. It may
    be a bit underhanded and rotten, but it works. It works both ways, so others can
    check up on you as well. You can give it a try right now by seeing the last time
    you logged into your graphica account. Just type finger graphika, and press ENTER.


    You can even use the finger command to find out about people on other systems,
    providing their network''s finger service is active and you know their email address.
    Typing something like username@hostname.com will do the trick. Kind of cool, but
    also kind of spooky.


    # ### Pwd


    If you know but are not exactly sure where you are, pwd (print working directory)
    should come in handy. The pwd command tells you exactly where the Terminal is
    in your directory tree.


    Let''s say, for example, that my Terminal is in my personal home directory (which
    is actually called home, and where is all the user account directories are located)
    when I use the pwd command; after pressing the ENTER key, get /home/reg printed
    to my Terminal. You should get similar results if you try it out.


    +   NOTE The word print, in this case, has nothing to do with your printer; it
    merely means the response will be printed to, or displayed in, the Terminal.


    Chapter 8'
