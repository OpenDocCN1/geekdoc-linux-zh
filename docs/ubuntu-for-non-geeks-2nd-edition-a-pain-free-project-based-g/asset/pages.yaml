- img_proc: true
  md: 'Despite limitations, there are still many people who prefer Sound Juicer to
    the competition, so you might as well give it a try and see you like it. To started,
    just place the CD you want to rip in your drive; Sound Juicer will start up automatically
    and display the title of the CD, the artist''s name, and titles of all the tracks
    in the application window.


    It is important to mention at this point that if you are not connected to the
    Internet these bits of album information will not appear because album and track
    data are not embedded in the CD itself. What happens instead is that the audio
    ripper or player on your machine senses the digital ID of the CD you''re playing
    to an online database, as freeDB or CD DataBase (CDDB), which is now officially
    known as Gracenote. In turn, the online database sends the album information for
    that CD back to the player or writer.


    You can go about another way by going to Applications > Sound Juicer CD Extractor
    and then placing your CD in the drive. In this case, you might have to go to the
    Sound Juicer Menu and select Re-read Disc before your album and track information
    will appear.


    # Setting the Default Folder for Ripped Files in Sound Juicer


    By default, Sound Juicer is set up to rip your CDs and encode audio tracks in
    Ogg Vorbis format, and the default location in your home folder. Because Sound
    Juicer, like all rippers, will create an artist folder for every CD you rip, you
    will end up with a lot of folders in your home folder if you rip albums from a
    large number of artists. It is best to create a Music folder within your home
    folder, as you did for your graphika account, and make that your default location
    for ripped music.


    To set the default from within Sound Juicer, go to the Edit menu and select Preferences.
    This will open the Preferences window where you can change the output path by
    clicking the button next to the Folder (the button should say Home at this point)
    and then selecting Other in the menu that appears. After that, to choose your
    Music folder, click once in the list to select it, and then click the Open button.


    # Ripping and Encoding Sound Files in Sound Juicer


    To start the audio tracks from the CD you have in your drive, you first need to
    select the format in which you wish to encode the tracks. To do this, go to Edit
    > Preferences, and then in the Output Format menu select the encoding format of
    your liking. Most of common of these is MP3 (MP3 audio) or, in the Linux world,
    CD Quality, Lossy (Ogg multimedia). Once you''ve chosen your choice, click Close.


    After that, you will need to do the click Extract button at the bottom of the
    Sound Juicer window to rip and encode all of the tracks on the CD. If there are
    certain tracks you do not care to rip and encode, just uncheck the checkboxes
    next to the names of those songs before you click Extract. If you'
  merge: -1
  pgno: 267
