  md: 'NOTE The transparency effect used in the Terminal is a pseudo-transparency,
    as it is really just a mirroring of the desktop image. You will thus find, if
    you have any icons on your desktop, when you pass the transparent terminal across
    such icon-laden areas, those icons will not appear in the seemingly transparent
    Terminal—all you will see the desktop wallpaper or background color.


    Depending on the colors present in your background image or in your desktop wallpaper
    (if you''ve gone the transparent route), you may also want to change the font
    color for the Terminal to make things easier to see. To do this, click the Colors
    tab, deselect Colors from system theme, and then make the appropriate font color
    selection.


    # Tabbed Shell Sessions in the Terminal


    To wrap things up in this chapter, I thought I mention one particularly convenient
    feature of the GNOME Terminal: tabs. Just as you can view multiple pages in one
    Firefox browser window through the use of tabs, tabs in the Terminal application
    allow you to have more than one shell running at the same time without having
    more Terminal windows (see Figure 8-15). This reduces the amount of desktop clutter
    and generally makes things easier to deal with. You can open a new tab within
    the Terminal by going to the Terminal File menu and selecting Tab Default.


