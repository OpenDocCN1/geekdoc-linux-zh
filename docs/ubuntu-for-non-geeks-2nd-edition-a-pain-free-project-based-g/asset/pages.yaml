    # # Multilingual Login


    Once you have installed support for any additional languages you want, you can
    log out of your current session and log in to a new one in a different language
    environment. The actual switch is made from your login screen.


    Just below the text box where you would normally type your username, click the
    link that says Language, after which a window will appear with a list of the languages
    you have installed. Select the language you want to use in the next session by
    clicking on its name and then clicking the OK button. The language list will then
    close automatically, and you can proceed as usual by typing your login name and
    password (pressing the ENTER key after each, of course). A little window will
    pop up if you want to use the language you''ve chosen as your default language
    forever and ever. You can either click Just for This Session or Make Default depending
    on your preferences. Whatever you end up choosing, fear not; it''s no big deal
    to get back at a later point in time by logging out of your system, logging back
    in your system under your previous default language, and clicking Make Default.


    Your startup process will then continue, and everything as it usually does. Depending
    on what language you''ve chosen, your desktop appears will be in another linguistic
    world. Your menus, applications, and the little windows that pop up when you move
    your mouse over a panel will all be in the newly selected language. (Figure 12-5
    shows the System in a variety of languages.)


    ![](img/8c9883c4544150d676aa7a1c159e9153_225_0.png)


    Figure 12-5: The Applications and Sound & Sound menus shown in Japanese


    # # Chinese, Japanese, and Korean Input


    For most European languages (and many other alphabet-based languages), pressing
    a letter on the keyboard simply prints it to the screen. However, Chinese, Japanese,
    and Korean require a kind of conversion process that is handled by a special application
    (actually


    206 Chapter 12'
  merge: -1
  pgno: 225
- img_proc: true
  md: 'a set of applications) called an Input Method Editor (IME). Of course, this
    is a Windows-world term, but I will use it here for convenience’s sake. In any
    case, each of these languages has its own IME, and each is different due to the
    basic differences in the three writing systems.


    # Chinese


    While most people (at least those in the linguistic know) would think Chinese
    would be the most complicated system, because the writing system consists of thousands
    of characters, it is in fact the simplest. The Chinese IME simply takes the romanized
    keyboard input, known as *pinyin*, and converts it into Chinese characters, or
    *Hanzi*. For the IME, it is essentially a simple dictionary lookup task—big dictionary,
    simple IME. In the event that there is more than one character for the pinyin
    input, a list of candidates will appear, and the user can then select the appropriate
    character from that list.


    # Japanese


    The Japanese IME has a considerably more complicated task to perform, as it has
    three writing systems to deal with: *Kanji* (ideographic characters borrowed long
    ago from China), *hiragana* (the phone-alphabetic system used for tense and case
    endings), and *katakana* (used mainly for borrowed words from other languages).
    Still, the standard input method for Japanese is primarily via the standard Roman
    keyboard layout, plus a few extra function-keys. Thus, typing in Japanese is a
    two-step process whereby the IME first converts the romanized text to hiragana
    as it is typed and converts it to appropriate Kanji, katakana, or hiragana elements
    the spacebar is pressed.


    You can see an example of these steps in Figure 12-6. In the first line, the IME
    has already converted the romanized input on the flow. It has converted *rinakkusidehonyogoku
    dekimasu* (which means *You can also input Japanese in Linux*) to hiragana. The
    fact that this line is underlined means it has not yet been converted beyond.
    In the second line, however, the user has subsequently pressed the spacebar, caused
    the IME to convert the hiragana string into the appropriate Kanji, hiragana, and
    katakana elements. The first word, *Linux*, has been converted to katakana text,
    as it is a borrowed word, while *Japanese input* has been converted to Kanji;
    the rest stays in hiragana.


    # りなっくすですでにほんごににゅうりょくもできます。


    # リナックスで日本語入力もできます。


    Figure 12-6: IME conversions while typing in Japanese'
  merge: -1
  pgno: 226
- img_proc: true
  md: '# Korean


    The job of the Korean IME is again quite different from that of the Chinese and
    Japanese IMEs, as the language itself is written in a very different way. Korean
    is written entirely in alphabetic letters, called Hangul, or in a combination
    of Hangul and ideographic characters borrowed from Chinese Hanja. While the Hanja
    characters are essentially the same as their Chinese and Japanese counterparts,
    Hanzi and Kanji, the Korean phonetic alphabet, Hangul, has it its own unique appearance,
    as you can see in the Korean word for Korea, Hanguk(k), in Figure 12-7.


    ![](img/8c9883c4544150d676aa7a1c159e9153_227_0.png)


    Figure 12-7: Korea (Hangug) written

    hizontally in hangul


    This seems; however, the representation is not correct, as Korean is very unique
    in the way that its alphabetic characters are put to the page. Unlike the usual
    side-by-side positioning of hiragana, katakana, and most other languages written
    with an alphabet, Hangul letters are grouped in pairs, triplets, or quadruplets,
    which are written as a general rule, clockwise. The IME, therefore, must take
    the input (usually based on a Korean alphabetical keyboard layout) while it is
    being typed, and it must adjust the size, spacing, and positioning of each of
    the letters as it puts them into appropriate clusters (see Figure 12-8).


    ![](img/8c9883c4544150d676aa7a1c159e9153_227_1.png)


    Figure 12-8: An example of the clustering

    process in the Korean IME


    # Project 12: Installing Asian Language Input

    Support for SCIM


    What do you do if, for example, you want to be able to type Chinese, Japanese,
    Korean, Hindi, Thai, or Nepali while still in your usual English environment?
    What if you want to be able to type all of those languages in the same document?
    Can you do it?

    You bet.'
  merge: -1
  pgno: 227
- img_proc: true
  md: 'There are actually several ways of going about this, but the one of the most
    straightforward to use is Smart Common Input Method (SCIM), the base for which
    comes preinstalled in Ubuntu. SCIM supports Asian languages, including Chinese,
    Japanese and Korean, and it provides a number of input methods for many of these.


    # 12-1: Downloading and Installing SCIM Input Method Modules


    Despite coming preinstalled on Ubuntu, SCIM will not be able to do anything for
    you right out of the box. In order to enable SCIM you can input CJK and other
    similar types of characters, you will need to install a package called im-switch.
    Then you will need to install the appropriate input methods for the language you
    wish to type.


    The easiest and least problematic way of getting these packages is via the Language
    Support utility. Just go to the System menu, select Administration ► Language
    Support, and then install for the languages you want.


    After the installation of the language support modules is complete, there is still
    one simple step left. Log out, and then once you''re back at the login screen,
    log back in. A SCIM applet will appear at the right side of the top panel, letting
    you know that SCIM is ready for action.


    # 12-2: Typing in Asian Languages with SCIM


    To get a feel for how SCIM works, try it with Gedit (Applications ► Accessories
    ► Text Editor).


    Once Gedit appears, click the SCIM applet. A list of the languages that can be
    handled by SCIM will appear in a drop-down menu (Figure 12-9). Remember, however,
    the number of languages appearing in that menu will be dependent on the number
    of languages you installed.


    ![](img/8c9883c4544150d676aa7a1c159e9153_228_0.png)


    Figure 12-9: A list of the languages that can be handled by SCIM'
  merge: -1
  pgno: 228
- img_proc: true
  md: 'From that list, select the language you want to use, and then, for those languages
    where you are given a choice, select the input method you prefer. The icon for
    the SCIM panel applet will reflect the change by showing the icon for the language
    you have chosen. You can then start typing.


    At this point, a small input palette like the one in Figure 12-10 will appear
    at the bottom-right corner of the screen. In this palette, in addition to displaying
    the language and input method currently used in, also allows you to easily switch
    between English and the current language of input, or to switch from the language
    in which you are currently typing to another. By clicking the red button at the
    far-right end of the palette, you can also find out what hotkeys are for the input
    method you are currently using.


    ![](img/8c9883c4544150d676aa7a1c159e9153_229_0.png)


    Figure 12-10: The SCIM input palette


    Regardless of the input method you are dealing with, probably the most important
    hotkey combination you want to use is SHIFT-spacebar, which toggles back and forth
    between English and the language you currently have selected in SCIM.


    You must be working with a document or application that accepts text input, or
    no menu will appear when you click the SCIM applet.


    # 12-3: Installing Additional Input Methods


    You may find that the input methods supplied for the languages you have chosen
    include those that you are not familiar with. For example, the default Korean
    is not based on the standard keyboard (the only one I''m familiar with), and it
    does not have Hangul-to-Hanja conversion capabilities like the hiragana-to-Kanji
    ones included by the Japanese module. Fortunately, this is easily remedied by
    using Synaptic to install additional input modules. Which package you download
    depends, of course, on the language in question. To add additional input modules
    for Korean, install scim-tables-ko. For additional Japanese input methods, install
    scim-tables-ja. Finally, for additional Chinese modules, install scim-tables-zh.


    You can also use SCIM to conveniently type in other Asian languages that do not
    require special conversion routines, such as Thai, Hindi, Telugu, Bengali, and
    Punjabi. To get input support for these languages, install scim-tables-additional.'
  merge: -1
