  md: '# Can I Do the Same Thing with pyWings?


    Sure. If you want to move pyWings to a global location, just follow the same procedure
    for moving the pywings folder and Briscola, making the necessary substitutions,
    of course. You will have to remove the previously created pyWings link, though,
    by typing the following command:


    ```

    sudo rm /usr/games/pywings

    ```


    After, that moves the pywings folder to global territory by typing sudo mv "~/LocalApps/pywings/share/games/pywings",
    and pressing ENTER. When prompted for your password, type it, and press ENTER.
    You can then create the launchable link by typing cd /usr/games, pressing ENTER,
    sudo ln -s /usr/share/games/pywings/pywings.py pywings, and pressing ENTER once
    more.


    # Playing Briscola


    As I already mentioned, Briscola is easy—about as easy a card game as there is.
    It is a trick-taking game, which means you put out a card, and then your opponent
    puts out a card, and the one who puts out the higher-value card wins the hand.
    Points are awarded on the basis of the cards involved in that trick. The winner
    of the trick then goes on to lead the next trick, meaning that the winner puts
    out his her card first the next time around. When all the cards are played, the
    points for each player are tallied, and the player with the higher points wins.
    All much simpler to do than it is to describe.


    # The Cards and Their Rankings


    Like many Italian and Spanish games, Briscola is played with a 40-card deck, consisting
    of the following cards: K, Q, J, 7, 6, 5, 4, 3, 2, and the Ace. Traditionally,
    it is played with either French-suited cards (hearts, diamonds, clubs, spades)
    or Italian-suited cards (words, batons, chalices), usually dependent upon the
    region in which it is played. In the software version you have just installed,
    you will be playing with French-suited cards


    Unlike most card games you are probably familiar with, the ranking and point values
    of the cards in Briscola is somewhat different, as you can see in the following
    chart.


    | Ranking of Cards | Point Value |

    | Ace | 11 |

    | 3 | 10 |

    | King | 4 |

    | Queen | 3 |

    | Jack | 2 |

    | 7, 6, 5, 4, 2 | 0 |'
  merge: -1
  pgno: 168
- img_proc: true
  md: 'While this ranking arrangement might seem odd, it is actually fairly common
    in card games from the southern and Catholic regions of Central Europe. With that
    bit of information in mind, it should all be pretty easy enough to fathom, taking
    a religious view, that God (Ace) and the Holy Trinity (K, Q, J) and their decidedly
    mortal subjects (7, 6, 5, 4, 2). The rankings are quite subtle, albeit slightly
    ironic, given that some religions frown upon playing cards, calling them "devil''s
    trick."


    # Game Play in Briscolao


    Once Briscola starts up, it will deal three cards to each player. It will then
    make the seventh card and place it up under the downward-facing pile of undealt
    cards, known as the stock or talon. Seventh card is called the Briscola (from
    which the game gives its name), and it determines the trump suit for that particular
    game. This means that any card of the same suit as the Briscola will beat any
    card of any other suit, even one of a higher ranking. Of course, when you play
    a card against another trump card, the normal rankings of the cards come back
    into play.


    It is important to note at this point unlike other trickgames, you are neither
    required to follow the suit of the card in a trick in Briscola, nor are you required
    to beat it if you want. This means that if your opponent plays a club card, you
    can play any card of suit you like, even if you have a card that can beat it,
    all depending on your strategy for ultimately winning the game.


    Before getting started, it is a good idea to first know how you''re doing as you
    and select Show Score. This will allow you to see your play. Once you''ve done
    that, you are ready for action, and as your opponent is always kind enough to
    allow you to lead, you can begin by clicking the card you want to put into play.
    Your comp-oppo-opponent will then play its card.


    Once you''ve assessed the situation, click on one of the blank spaces in your
    hand, and the points for that trick will be displayed in the box labeled You (if
    you won the trick) or the box labeled Me (if the computer won the trick). Of course,
    if the trick only involved the 7, 6, 5, 4, or 2 cards, no points will appear,
    as those cards have no value.


    # Want to Know More?


    If you would like a more detailed set of rules for playing Briscola (and about
    any other card game in the world), check out www.pagat.com.


    # Customizing the Terminal


    As you now know, the Terminal is a very simple application in terms of looks.
    It doesn''t have to be, however, because you can spice things up a bit if you
    re so inclined. Not only can you change the background and text colors in the
    Terminal, but you can display one of your favorite photos as a background (as
    shown in Figure 8-13) or make the background trans . . . well, kind of transparent
    anyway.'
