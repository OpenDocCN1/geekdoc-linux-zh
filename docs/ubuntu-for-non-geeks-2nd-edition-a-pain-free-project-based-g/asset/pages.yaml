- img_proc: true
  md: '# Free Fonts


    http://www.fontfreak.com

    http://www.fontparadise.com

    http://www.fonts.tom7.com


    # News and Information


    These sites are mainly informational, keeping you abreast of what’s going on in
    the Linux world. DistroWatch focuses on the various distributions available out
    there, whereas Linux Today and LinuxPlanet fit better in the online magazine/newspaper
    genre.


    http://www.distrowatch.com

    http://www.linxtoday.com

    http://www.linuxplanet.com


    # Magazines


    If you are more of a tactile type who enjoys the feel of paper pressed between
    your fingers, then you might like to turn to some of the Linux magazines available
    at most major newsstands. All have a good deal of online content, even if you’re
    not interested in the pleasures of holding a magazine in your hand, their sites
    are worth checking out.


    http://www.tuxmagazine.com

    http://www.linux-magazine.com (European)

    http://www.linuxmagazine.com (US)

    http://www.linuxjournal.com


    There are two (unrelated) magazines sharing almost the same name: One of them
    is from the United States, one from Europe. The newbie wants some pizzazz in his
    or her reading materials, plus some useful tips, and some things to play around
    should go for the European version. The US version is targeted toward business
    users and power geeks, not newbies.


    # Books


    Once you’ve finished working through this book, you should be able to do just
    whatever you want in Ubuntu. Still, your interest may have been piqued enough
    that you would like to find out a bit more about Linux. There are some books that
    might help in that quest.


    How Linux Works by Brian Ward. (No Starch Press, 2004).

    The Debian System by Martin Krafft. (No Starch Press, 2005).

    The Linux Cookbook 2nd Ed. by Michael Stutz. (No Starch Press, 2004).'
