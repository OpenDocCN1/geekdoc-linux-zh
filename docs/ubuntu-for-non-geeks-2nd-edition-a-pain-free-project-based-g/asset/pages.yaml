- img_proc: true
  md: '![](img/8c9883c4544150d676aa7a1c159e9153_156_0.png)


    Figure 8-8: The meaning of permissions numbers


    Now if you''re more of a letters sort of person, you''ll be happy to know that
    there is another way to change permissions that is probably even easier. In this
    approach, you only have to deal with groups of letters and the symbols + and -.


    The first group consists of the following:


    +   - User (owner of the file)

    - Group (specified group of users)

    - Others (anyone who is not the user or a member of the group)

    - All (all of the above)


    The second group consists of:


    +   - Read

    - Write

    - Execute


    You might already be able to figure out how this is all going to work, but I''ll
    spell it out in case your intuition is worn out for the day. Let''s say you want
    to change the permissions of a file (butterhaters.txt, for example) so all users
    on your machine can read and write to it. After opening a Terminal window, you
    can make the change by typing chmod a+rw butterhaters.txt and pressing ENTER.


    Oops! Just remembered that you don''t anyone changing the content of the file,
    eh? Well, to take back the write permissions for that file, you just need to type
    chmod -w butterhaters.txt and then press ENTER. As you can see, the + gives permissions,
    while the - takesth away.

    Much simpler, you''ve got to admit.


