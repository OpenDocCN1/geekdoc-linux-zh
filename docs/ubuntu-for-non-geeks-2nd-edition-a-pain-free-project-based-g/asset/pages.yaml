  md: "# 1\n\n# # BECOMING A PENGUINISTA\n\n*Welcome to the World of Linux*\n\n![](img/8c9883c4544150d676aa7a1c159e9153_28_0.png)\n\
    \nNow we begin our project to get you up and running in the world of Linux. If\
    \ you have already made the commitment and have Ubuntu installed on your machine,\
    \ you are essentially ready to go. Others of you might have made the commitment\
    \ psychologically, but have yet to act on that commitment. And some of you are\
    \ probably reading these words in the aisle of a bookstore, wondering about Linux\
    \ and about whether you should spend your money on this book or on a latte morning\
