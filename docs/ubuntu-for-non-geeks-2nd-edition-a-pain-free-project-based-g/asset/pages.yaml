- img_proc: true
  md: '# Moving Files and Folders


    Perhaps the easiest of all file manipulations you can perform in Nautilus is moving
    a file by means of drag-and-drop. I am pretty sure that anybody who has wielded
    a mouse with that particular move. There is another way of moving files and folders,
    however: cut and paste.


    The easiest way of doing this is to right-click the file (or folder) you want
    to move, and select Cut from the popup menu (Edit ▸ Cut will also do (the trick).
    At this point, it will seem as if nothing has happened, as the file will still
    be there, so don''t worry. After that, right-click any open space in the folder
    to you wish to move the file, and select Paste in the popup menu. The file will
    then disappear from its original location and appear in its new.


    Can you use key combinations to do this, you ask? Simply follow the directions
    I just gave, but use CTRL-X to cut and CTRL-V to paste.


    # Copying Files and Folders


    Based on the instructions I just gave, you can pretty well imagine the methods
    for copying files and folders, as they are essentially a variation on the same
    theme. Just right-click the file you want to copy, select Copy from the popup
    menu, right-click any open space within the target location, and then select Paste.
    Keystroke-wise, that would be CTRL-C to copy and, before, CTRL-V to paste.


    It is also possible to copy files and folders via the wonders of dragandrop, though
    this involves more handlers than required for a simple dragandrop move; fortunately,
    the two have will do nicely. Just press and hold the CTRL key while you drag the
    file or folder you want to copy to the location. Be sure to release the mouse
    button and then the CTRL key (releasing in the opposite order will not work),
    and you will find a copy of the file in its new location.


    # Navigating in Nautilus


    Navigating through your various folders and subfolders in Nautilus is quite straightforward.
    In fact, it is conceptually pretty much the same as what you are accustomed to
    in Windows and Mac OS. You can simply move into and out of folders through a combination
    of double-clicking and clicking the Back, Forward, and Up buttons.


    # Tabbed Browsing in Nautilus


    In addition to the hierarchical view option provided in the side pane, there is
    another handy feature that can make your navigation chores even easier: Nautilus''s
    tabbed browsing feature. These tabs (they look like buttons, actually) appear
    in the navigation bar for each folder you opened on the way to the one you are
    currently viewing.'
