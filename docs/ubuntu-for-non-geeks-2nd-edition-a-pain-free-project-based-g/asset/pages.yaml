  md: '# 17


    # # COUCH PENGUINS

    Video and DVD Playback in Ubuntu


    ![](img/8c9883c4544150d676aa7a1c159e9153_300_0.png)


    Now that we''ve covered much of what Ubuntu can do in terms of audio, let''s turn
    our attention to what is arguably the second most important of its talents in
    our CNN/MTV-era world: video. Ubuntu is quite capable in terms of video playback,
    allowing you to view video files you download from the Internet or from your digital
    movie camera, video CDs (VCDs), unencrypted DVDs (encrypted ones, too, if you
    installed the codec packages via Automix in Chapter 15), and some Internet video
    streams. It allows you to download movies from your digital video camera and then
    edit them.


    # ## Playing Video Streams with RealPlayer


    In Chapter 15, we covered RealPlayer''s role as an audio application that allows
    you to play Internet audio streams. Audio streams are not the only thing that
    RealPlayer can handle, however; you can use it to play video streams as well.
    If you would like to try out RealPlayer''s capabilities for playing video streams,
    or if you just happen to be a fan of Katie Holmes, point your web'
