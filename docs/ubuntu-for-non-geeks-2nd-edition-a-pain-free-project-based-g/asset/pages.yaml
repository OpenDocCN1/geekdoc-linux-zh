  md: '# Totem Movie Player


    The default video player in Ubuntu is Totem, which, as you can see in Figure 17-3,
    has a very simple interface that makes using it equally simple. You can run Totem
    by going to the Applications menu and selecting Sound & Video Movie Player. You
    can also run it by simply placing a DVD in your drive, because Ubuntu is set up
    to run Totem any time you do. If you don''t happen to have a DVD on hand but want
    to see Totem in action, you can also bring it by double-clicking that Ubuntu video
    that comes with your system in the Examples folder (Experience Ubuntu.ogg).


    # Switching Totems


    Before going on further, I should mention that if you installed the two codec
    packages back in Project 15a, you are not using the same Totem when you were first
    installed your system. How can that be, you ask? Well, despite all that simplicity
    I talked about, Totem can be an absolute pain in the proverbial posterior at times.
    Totem may be one of the lucky ones, but for me and many others, Totem can be as
    cooperative as a cat on a leash (mine excluded, of course). The problem is not
    actually Totem itself, but rather gstreamer back end that performs its video processing.


    ![](img/8c9883c4544150d676aa7a1c159e9153_303_0.png)


    Figure 17-3: Totem Movie Player


    Totem, you see, is merely a graphical front end that provides you with an easy
    way to use software that works in the background—a back end, which in this case
    is gstreamer. When you installed the multimedia and DVD codec packages with Automatix,
    that gstream version of Totem was replaced with'
  merge: -1
  pgno: 303
- img_proc: true
  md: 'version of Totem that utilizes the Xine-processing back end instead.

    The reason Automat automatically performed the switch is that its designers know
    Xine is a much more cooperative beastie when it comes to video.

    If you haven''t made the switch and find yourself having problems with Totem,
    try installing the Xine version along with the other multimedia codecs packages.
    The instructions for doing this are given in Project 15a, but to save your some
    wear and tear, I will repeat the procedure for you here. Just run Automat (Applications
    -> System Tools -> Automat), and once the Automatic window opens, click Codes
    and Plugins in the left pane of window, and click AUD-DVD Codecs and Multimedia
    Codecs in the right pane. Finish by clicking the Start.

    Once you''re done, you won''t notice any changes in Totem up front. But you''ll
    likely be a much happier camper because Totem should then work as it''s supposed
    to. You will experience, among other things, superior sound (at least better volume),
    more dependable DVD playback, and less quirky playback of Windows Media Video
    (WMV) files. If it''s still giving you trouble after that, try one of the other
    playback applications mentioned at the end of this chapter.


    # Totem to Play DVDs, VCDs, and Other Multimedia Files


    As already mentioned, you can play a DVD in Totem by simply placing your DVD in
    the drive, after which Totem will open and begin playing your movie.

    If you''ve got a copy of Red Detachment of Women on VCD that you''re aching to
    watch, you can do so in the same way. Just pop the VCD in your drive; Totem should
    start up and begin playing it.

    Totem not only plays DVDs and VCDs, but it can also play MPEG files and, because
    you installed that big cocktail of packages I keep going on, about it can play
    WMV files too. You can play such files by doubleclicking them directly or going
    to the Totem menu, selecting Open, and then navigating to the video file you want
    to view.


    # Making Things Look a Bit Better in Totem


    One thing you might notice when using the Xine version of Totem is that videos
    seem to look a bit washed out. This can be easily fixed by going to the Totem
    Edit menu and selecting Preferences. In the Totem Preferences window, click the
    Display tab, and then lower the Brightness and Contrast sliders to points similar
    to those shown in Figure 17-4. You can, of course, change things to suit your
    own tastes. Once you''re done, click Close.'
  merge: -1
  pgno: 304
- img_proc: true
  md: '![](img/8c9883c4544150d676aa7a1c159e9153_305_0.png)


    Figure 17-4: Adjusting brightness and contrast settings in Totem


    # # Totem as an Audio Player?


    You may have noticed in the Display tab of the Preferences window that there was
    a Visual Effects section. Well, those visual effects aren''t for the videos you
    play, but rather visualizations to accompany your audio files when played via
    Totem (Figure 17-5). Yes, Totem not only does video, it does audio as well. In
    fact, it is, somewhat oddly, the default audio player for Ogg Vorbis and MP3 files
    in Ubuntu. Just double-click one of those files, and sure enough, Totem will be
    the application that pops up, blasting your ears out with your favorite melodies.
    Of course, you can also play such files from the Totem Movie menu, by selecting
    Open and then navigating to the songs you want to play. If you have a CD in your
    disk drive, going to Movie menu and selecting **Play Disc** ‘Audio Disc’.


    ![](img/8c9883c4544150d676aa7a1c159e9153_305_1.png)


    Figure 17-5: Totem as an audio player


    286 Chapter 17'
