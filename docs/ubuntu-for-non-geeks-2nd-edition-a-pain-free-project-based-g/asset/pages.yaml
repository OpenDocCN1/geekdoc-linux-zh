    of adware. Finally, at least in my experience, the majority of such programs are
    hardly worth the money asked. The only shareware programs I ever found worth buying
    were Lemke'''' GraphicConverter and Plask''s Comic Life, both for the Mac.


    # Is It All Just About Money?


    While mine is important to the average user, it is certainly not the only reason
    for taking the Linux plunge; As I mentioned before, Linux is noted for its stability.
    Try running your present system for a month without restarting and what happens.
    Linux has been known to run without a reboot for a year without a decrease in
    performance. With its multilingual capabilities, Linux is also a perfect choice
    for language students or users in a multilingual environment.


    In addition, Linux is infinitely customizable: You can get your system to look
    and act the way you want it without being wizarded to death. And then there are
    the applications that come with most Linux distributions. In addition to their
    wide variety, most are well up to industry sniff, with such as Evolution and the
    GIMP, being sources of envy for those outside the Linux world.


    Finally, with the advent of Microsoft''s new Windows system and its more demanding
    hardware requirements (especially if you want to take advantage of its most touted
    new features), you may find your present machine on the fast track to obsolescence.
    Turning it into a Linux machine will ensure several more years of working life.
    Shame to put good hardware out to pasture early, after all.


    # Is Linux Really Ready for the Desktop?


    Despite the advances Linux has made in recent years, this question still pops
    up quite often, and that''s fair enough. Consider this: When you install a program
    on your present Windows system and get an error message saying that the program
    can''t run because some DLL file is'
  merge: -1
