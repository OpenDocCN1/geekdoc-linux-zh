  md: '![](img/8c9883c4544150d676aa7a1c159e9153_105_0.png)


    Figure 6-6: The location of your users'' folders within the Linux filesystem


    In Ubuntu there are four folders that contain most of the applications on your
    system. The essential elements of your system are located in /bin. Other elements
    that need to be there, though they may not be used, such as commands and the like,
    are located in /bin. Most of the applications that you actually think as applications
    and use in hands-on ways are located in /usr. Finally, there are some add-on applications,
    such as RealPlayer, that install themselves into /opt.


    There other top-level folders that might be of interest to you are /etc, /lib,
    and /media. The first of these, /etc, is the location of all the configuration
    files on your system. The second, /lib, is the location of all the libraries that
    are required by your system or applications installed on it. These libraries are
    the Linux equivalent of a Windows .dll file. Finally, /media is where the contents
    of your various attached external media (such as USB drives and CDs) appear when
    present.


    There are other top-level folders, but their purposes are a bit less straightforward
    for the Linux newbie and, to be honest, not all that are interesting to you at
    this stage of the game. Anyway, as I mentioned before, there is no reason for
    you to be mucking around with any of these folders for the time being, as the
    items located within them can be accessed in different, and much safer, ways.


    # Using Nautilus as a Network Browser


    Another Nautilus feature is its ability to function as a network browser. You
    can, for example, see what networks and shares are available to you your home
    or office network by going to the Places menu in the GNOME Panel and selecting
    Network Servers. You can also do this from within a Nautilus window by going to
    its Go menu and selecting Network. Icons for any'
  merge: -1
  pgno: 105
- img_proc: true
  md: 'networks or computers on that network would then appear in the Nautilus window,
    as you can see in the case of my own setup in Figure 6-7. From that window, you
    can then double-click your way to a share that you have permission to access,
    as the Shared Documents folder of a Windows machine or the public folders of a
    Mac.


    ![](img/8c9883c4544150d676aa7a1c159e9153_106_0.png)


    Figure 6-7: Network browsing in Nautilus


    By the way, in case you are wondering what a share is, I''ll clear up for you.
    Basically, a network share is a location on a computer, as a folder, where other
    users on a network can access and save files. The Shared Documents folder on a
    Windows system is a good example. Other users on a network can copy files from
    and (usually) write files to the Shared Documents folder, whereas they cannot
    access any other part of the filesystem on that host machine.


    If you are trying to open requires a username and password, you will be asked
    for those in a new window (Figure 6-8). Note that in this case, the username and
    password you need to enter are those for the machine to you are trying to connect—not
    the ones you are using in Ubuntu (unless the username/or passwords happen to be
    the same, of course). You can then copy files to that share if it is a folder
    on your hard disk.


    ![](img/8c9883c4544150d676aa7a1c159e9153_106_1.png)


    Figure 6-8: Entering network usernames and passwords for the machine to which
    you''re trying to connect'
