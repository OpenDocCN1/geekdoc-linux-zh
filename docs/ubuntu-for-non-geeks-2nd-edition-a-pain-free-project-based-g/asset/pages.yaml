  md: "The companion CD\nlets try out\nUbuntu 7.04 (Feisty\nFawn) without making any\n\
    changes to your computer\nand then install it when\ny're ready.\n\n# LEARN LINUX\n\
    AND\nLOVE IT!\n\nA fast, crystal-clear top out of the amazing\ncollective accomplishment\
    \ embodied in Ubuntu.\"\n—Cory Doctorow, Boing Boing\n\nUbuntu has been hailed\
    \ as the Linux distribution for\nnewbies, and it's certainly the Linux for the\
    \ less geek\nam among us. It is next user-friendly—it’s a South\n team that translates\
    \ roughly as “humanity toward\nothers” and could also describe Richard Grant’s\n\
    approach to teaching Linux.\n\nFull of tips, tricks, and helpful pointers, Ubuntu\
    \ for\nNon-Geeks, 2nd Edition is a hands-on, project-based,\ntake-it-slow guidebook\
    \ for those interested in—but\nervous—switching to the Linux operating system.\n\
    This edition has been updated for Feisty Fawn, the\nlatest Ubuntu (7.04), which\
    \ puts the spotlight on\nmultimedia support and desktop effects. Step-by-step\n\
    projects build upon earlier tutorial concepts, helping\nyou absorb and learn what\
    \ you’ve learned.\n\nUbuntu for Non-Geeks covers all the topics likely to be\n\
    interest to an average desktop user. Inside, you’ll learn to:\n\n+   - Configure\
    \ your hardware, including printers, scanners,\nand removable storage devices\n\
    - Watch DVDs, listen to music, and even sync your iPod\n- Download photos and\
    \ videos from your digital\ncamera, then edit and share them\n- Tackle more advanced\
    \ tasks as soon as you're ready\n\n+   - Download and install free applications,\
    \ games,\nand utilities\n- Connect to the Internet and wireless networks\n\nWhether\
    \ you're into computers, looking for a pain-\nfree way to make the Linux switch,\
    \ or just a low-cost\nalternative to Windows, Ubuntu is for you.\n\nRichard Grant,\
    \ author of Linux for Non-Geeks, and\nLinux Made Easy (both No Starch Press),\
    \ has been\na operating system manic for more than 20\nyears. From the Atari 600XL\
    \ to your Linux machines,\nhas been the guy behind the help desk for family,\n\
    riends, and colleagues. Richard currently resides in\nboro, North Carolina, where\
    \ he spends his work-\ning hours as a teacher and his free time coding, writing,\n\
    and annoying his neighbors with his Nyckelthorpe\n\n# COVERS UBUNTU 7.04\n(FEISTY\
    \ FAWN)\n\nTHE FINEST IN GEEK ENTERTAINMENT\"\nwww.noostarch.com\nNo Stack Paste\n\
    \"I LAY FLAT.\"\nThis book by Repoker—a durable kindling that won’t snap.\nPrinted\
    \ on recycled paper\n\n$34.95 ($33.95 CDN)\n\n| ISBN:978-1-59327-152-7 |\n| 5\
    \ 3 4 9 5 |\n| 97815193 271522 4 |"
