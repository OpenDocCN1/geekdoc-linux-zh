  md: '# A Few Other Graphics Apps to Consider


    In addition to the graphics applications I have covered in this chapter, there
    are still more available. One comes preinstalled with your system, while the others
    can be grabbed via Synaptic (or for some easy browsing, via the Add Applications
    tool). While you can experiment with what''s available, I will point out a few
    others worth noting. If nothing else, these applications will give you an of the
    breadth of stuff out there waiting for you.


    # F-Spot Photo Manager


    In addition to gThumb Image Viewer, your system comes with yet another application
    for your image viewing and managing needs, F-Spot Manager (Figure 14-17).


    ![](img/8c9883c4544150d676aa7a1c159e9153_260_0.png)


    Figure 14-17: F-Spot Photo Manager


    When it comes down to it, the features of F-Spot are quite similar to gThumb,
    so it really boils down to your personal preferences. Have a go at both (and Picasa
    too, for that matter), and see which one you like. You can run F-Spot from Applications
    ▸ Graphics ▸ F-Spot Photo Manager.'
