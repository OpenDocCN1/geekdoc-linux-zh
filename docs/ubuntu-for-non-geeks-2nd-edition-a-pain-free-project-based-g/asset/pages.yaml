    # DVDs


    Your system also allows you to play DVDs; however, due to licensing concerns,
    playback is limited to unencrypted disks. Unfortunately, this rules out a majority
    of the DVDs you buy or rent at your local video shop and leaves you with a limited
    choice of movies that you can play on your computer. Of course, DVDs created on
    personal computers (such as the DVD slideshow that people create these days with
    applications as iDVD


    Chapter 17'
  merge: -1
  pgno: 301
- img_proc: true
  md: 'on the Mac) pose no problem. Given the limited offerings in the unencrypted
    DVD world, you would no doubt want to enable your system to play back the encrypted
    variety, and, assuming you installed the two codec packages via Automatiack in
    Project 15A, you would now can.


    # Can I Play Foreign DVDs?


    Your computer can play DVDs of any broadcast standard (NTSC, PAL, SECAM) and any
    regional encoding. This is a better setup than DVD player you have hooked up to
    your TV, because the vast majority of standalone DVD players in the United States
    (and I would venture to guess that the size of that majority is 99.9 percent)
    do not allow you to play anything other than Region 1 NTSC (NTSC being the broadcast
    standard in the United States and its televisions are designed to display, while
    the DVD region is 1). This information is usually provided on the back of DVD
    packages (see examples in Figure 17-2), though the packaging for most disks produced
    for the US market does not include it.


    ![](img/8c9883c4544150d676aa7a1c159e9153_302_0.png)


    Figure 17-2: Examples of regional encoding labels on DVD packages


    Despite the whatever-everything-goes nature of your computer in DVD playback,
    there is a serious caveat to bear in mind. Depending on the manufacturer of your
    DVD drive, you will be able to switch and forth between DVDs of differing regional
    encodings four or five times. the drive will be locked into the regional encoding
    of the disk you were playing at time... forever. This is unrelated to your operating
    system—it is strictly a hardware matter. The only exception to this region-lock
    are those DVDs Region Free or ALL (sometimes inaccurately labeled as Region 0),
    which can be played on any DVD player in any region, and thus do not register
    a regional encoding when you ploy one of them in your computer''s drive.


    If your drive does eventually lock into one regional encoding, especially for
    which you have few DVDs, there is some good news. That news comes in the form
    of Videolan''s libdvdcss2, the library that bundles with the codec packages you
    installed in Project 15A, and allows you to play back encrypted DVDs. In addition
    to primary function, it allows you to play back DVDs from multiple regions even
    if your drive is already locked into one region. It does so by performing a cryptic
    attack (to use Videolan''s term for) on your drive until you find the disk key
    for it. Of course, this process of cryptic bombardment can take several minutes,
    so it is not the optimal way of getting anything. Better than being, though. Whether
    or not this process of bypassing regional encodings is legal remains a subject
    of debate, so if you are concerned about such things, you should do a little research.


    Couch Penguins 283'
