    # Setting Up a Dial-Up Connection


    Much of the world is moving to high-speed Internet connections, which many of
    you may still be using dial-up connections, which means that you need to have
    a traditional dial-up modem to reach beyond your box to the outside world. In
    case you broadband-surfers have forgotten, modems are those wonderful machines
    that whine, chime, screech, and spit whenever you dial up your Internet provider.
    I suppose you could think of them as noisy telephones in need of a good burb


    The good news is that setting your dial-up connection is a simple process that
    resembles what I covered far for other connection types. Now come the bad news—in
    the world of Linux, very few internal most- built-in modems are software dependent,
    and the software you depend on is part of, or designed for, Windows. Such modems
    are called Winmodems.


    Of course, the Linux community has been working on ways to deal with these Winmodem
    beasts that they will work with Linux systems. Support for the wide variety of
    Winmodem models out there is still rather spotty, things better than before, so
    you might just luck out. My advice is to hold off on the wondering and worrying
    and just give your modem a try to see if it works. If it does, then you''re all
    set. If it doesn, well, then you''ve got some options to use, but at least you
    haven''t done any damage to your system.


    With all that intro-babble out of the way, let''s get down to the steps for setting
    up your dial-up connection. First, get the information you need from your Internet
    provider. Most providers gear their operations to Windows and Mac users, and very
    few offer support, other than NeanderTech and a few others. So, there is no technical
    reason for your Linux system not to work by their setup, just nag and push until
    they give you the information you want. After make sure your modem is connected
    to a live telephone connection—for example, the phone jack in your wall—and then
    do the:


    +   Go to the System menu, and select Administration -> Network. After typing
    your password when prompted to do so, the Network Settings window will appear.


    +   In that window, click Modem connection to select it, and then click the Properties
    button.


    +   When the Interface window appears, check the box next to the words Enable
    this connection.'
