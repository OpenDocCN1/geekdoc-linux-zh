    # # Project 14D: Installing Picasa via Automatix


    It wouldn''t be right to dedicate a whole chapter to Linux’s graphical capabilities
    without mentioning one of the newest entries in the Linux application arena—Picasa.
    These of you coming from the Windows world are no doubt familiar with this very
    popular image viewing, organizing, and editing application and you will be no
    doubt to discover that it is now available for Linux. Picasa is not an open source
    application, which may cause some Linux diehards to turn away, but it is free,
    feature rich, nice to look at, and decidedly cool (Figure 14-16). It gives you
    easy access to various online blogs, photo finishers, and product providers, such
    as PhotoStamps, Shutterfly, Kodak, and even Walgreens.


    # ## 14-1: Downloading and Installing the Picasa Package


    The easiest way to get Picasa is via Automatix, which you installed and learned
    to use in Chapter 9. Open Automatix (Applications ► System Tools ► Automatix),
    and once it is up and running, click Office in the left pane. In the right pane
    of the Automatix window, and then click the Start at the top of the window. The
    download and installation process will then begin.


    A small window will appear, telling you that you need administrative rights in
    order to proceed. Click Grant, and you will be prompted for your password. Type
    that, and click OK to begin the installation. Automatix will show the progress
    of the download and installation and let you know it is done.'
  merge: -1
  pgno: 258
- img_proc: true
  md: '![](img/8c9883c4544150d676aa7a1c159e9153_259_0.png)


    # 14D-2: Running and Setting Up Picasa


    Once Picasa is installed, you can run it by going to the **Applications** menu
    and selecting **Graphics > Picasa**. The first time you do this, you will be greeted
    by a Picasa License Agreement window. Agree to what you''re asked by clicking
    **I Agree**.


    You will be asked in another window, and again only the first time out, whether
    you want to scan your entire computer for images (the default selection) or just
    your desktop. Do not repeat, do not accept the default (Completely scan your computer
    and all network directories for pictures).


    The reason for this is that even though you may have to scan a single image to
    your computer, your system is already check-full of them. If you were to accept
    the default, Picasa would be filled with all sorts of stuff that you wouldn''t
    really want. It is supposed to be an organizer for **your** photos, after all.
    With that in mind, select **Only scan the Desktop**, and then click the **Continue**
    button. Picasa will scan your desktop for images and add any images to its library.


    Working with Picasa should be very straightforward, but if you want to find out
    more, check out http://picasa.google.com/linux. On that page, you will find a
    basic overview, links to more Linux-specific information (including FAQ and forum
    pages), and a Picasa tour.'
