    doubleclick the artist''s name in the left pane. All in all, a very handy feature.


    If you would like to add an additional layer of categorization then by Genre pane.
    To do this, just go to the Edit menu, select Preferences, the General tab of the
    window that appears, and then select Genres, artists, and albums. After clicking
    the Close button in the Preferences, you will have a three-pane browser in Rhythmbox
    (Figure 1-54).


    ![](img/8c9883c4544150d676aa7a1c159e9153_270_0.png)


    Figure 1-54: The Rhythmbox browser


    # Creating Playlists in Rhythmbox


    Of course, you can tailor things even further so to match every situation and
    every mood. There are days, after all, when you''re feeling a bit too ethereal
    for Kelly Clarkson (and thank goodness for that). To prepare'
  merge: -1
  pgno: 270
- img_proc: true
  md: 'for such moments, you can create playlists, which are lists of songs to be
    played in a predetermined order. Just think of each playlist as an all-request
    radio station ... where all the requests are your own.


    To create a playlist in Rhythmbox, go to the **Music** menu and select **Playlist
    ▸ New Playlist**. When the Playlist icon appears in the left pane of the Rhythmbox
    window, type a name for the list, and then add the songs by simply dragging them
    from the Library pane to the Playlist icon. The songs themselves will remain in
    the Library, so you aren''t really moving anything—just creating.


    You can also create automatic playlists, which are lists that automatically scan
    the Library for songs that match your creation criteria. You could choose to create
    a list for all the songs in your Library by a particular artist or of a specific
    genre. To do this, select **Music ▸ Playlist ▸ New Automatic Playlist**. A window
    will appear in which you can specify what the list is to contain.


    Once you''ve created your lists, you can play one by clicking the list once and
    then clicking the Play button near the top of the window, or by double-clicking
    the list.


    # Streaming Media with Rhythmbox


    In addition to play the music you have on your hard disk, Rhythmbox also allows
    you to play Internet streams in MP3 or Ogg Vorbis format. To add a stream, click
    the Radio icon in the left pane of the Rhythmbox window, and you will come to
    face with ... well not that the first time you around. Still, you can try out
    what there is to try. Make sure you''re online and double-click one of the stations
    listed, and your computer should start play music downloaded from Internet radio
    station.


    Once you''ve had a taste of what Rhythmbox does with radio, you won''t be hungry
    for more. To add a bit more choice to your listening diet, you can add new streams
    by clicking the **New Internet Radio Station** button. When the New Internet Radio
    Station window appears, type the URL for the stream, and then click Add. The stream
    will appear in URL form in the right pane of the Rhythmbox window. If you would
    prefer the stream to appear in the list as a name rather than a URL, right-click
    the entry for the stream, select **Properties** in the pop-up menu, and then make
    the appropriate changes in the Properties window.


    Ah, where do I find these radio stations, you ask? For the largest collection
    of MP3 streams, go to shoutcast.com, find a stream that interests you, right-click
    the **Tune In** button for that stream, and then select **Copy Link Location**
    in the popup menu. After that, paste the URL in the URL box of Rhythmbox''s New
    Internet Radio Station window, and click Add. Now you can double-click the right
    pane of the Rhythmbox window to play it.


    Of course, many broadcasters also offer live feeds that do not appear on SHOUTcast
    lists. An example of this would be Radio France, which offers a number of streams.
    The stream I recommend try out of Fip, which is an exceedingly cool collection
    of music of all genres; you will'
  merge: -1
  pgno: 271
- img_proc: true
  md: 'be constantly surprised by what they play. If you are worried about understanding
    the language, don''t; there is very little talk, and roughly 80 percent of the
    music is played in English. I don''t speak any French other than je suis fatigé,
    but I have no problems at all.


    If you want to go streaming media in general (and Radio France in particular)
    type http://http.yacast.net/v4/radiofrance/fip.fd in the URL box of Rhythmbox''s
    New Internet Radio window, and click Add. Assuming you are already connected to
    the Internet, double-click the new addition to your list, and Fip start playing
    after a few seconds of pre-buffering.


    # Other Cool Features in Rhythmbox


    Rhythmbox includes a couple of cool features worth noting. One is pretty obvious
    once you start playing your tracks: album cover art. As you can see in both Figures
    15-3 and 15-4, whenever you play a track in Rhythmbox, the album cover art for
    that track is automatically downloaded and displayed in the lower-left corner
    of the window (assuming Rhythmbox can find it).


    Another cool and somewhat similar feature has to do with Lyrics. To utilize this
    feature you must first activate it by going to the Edit menu and selecting Plugins.
    In the Configure Plugins window that appears (Figure 15-5), check the box next
    to Song Lyrics and then click Close button. After that, go to the View menu and
    select Song Lyrics. Rhythmbox will then search the Net for the lyrics that you
    are currently playing and displaying them in a separate window (Figure 15-6).


    ![](img/8c9883c4544150d676aa7a1c159e9153_272_0.png)


    Figure 15-5: Activating Rhythmbox''s lyrics function


    Finally, if you are an iTunes user and attached to a bit of visual stimulation
    while playing your tunes, Rhythmbox can now satisfy you with a visualizer of its
    own. To activate it, go to the Control menu and select Visualization (you can
    turn it off in the exact same way). The right half of the Rhythmbox window will
    then be filled with the wild, swirling shapes and colors of psychedelic that you''ve
    come to know and love.'
  merge: -1
  pgno: 272
- img_proc: true
  md: '![](img/8c9883c4544150d676aa7a1c159e9153_273_0.png)


    15-6: Rythmbox displays the lyrics to the track currently playing.


    # Exile—An amarok-like Audio Player for GNOME


    Now Rythmbox has, for the most part, matured into a usable and multi-featured
    application, you may not want to bother with any other players. There are other
    interesting players out there.


    One of the newest is Exile (Figure 15-7). Exile is essentially a clone of the
    Linux application amarok, which I covered in the previous edition of this book.
    While amarok was (and is) a great player, it is a KDE application, so when it''s
    running in Ubuntu''s GNOME environment, it can also be a bit quirky at times.
    A look at it also, fails to adopt the look-and-feel customizations that you have
    made to Ubuntu environment.


    ![](img/8c9883c4544150d676aa7a1c159e9153_273_1.png)


    15-7: Exile


    Chapter 15'
  merge: -1
  pgno: 273
- img_proc: true
  md: 'Exile, on the other hand, is a GNOME app through and through. It looks like
    the rest of your system, reflects any customizations you may have made to the
    rest of your system, and runs as smoothly and quickly as any GNOME native application.


    # Installing and Running Exile


    The easiest way to install Exile is via Automix. Just go to the Applications menu,
    and select System Tools ▸ Automix to get started. Once the main Automix window
    appears, click Media Players and Editors in the left pane. Then in the right pane,
    check the Box next to Exile and click the Start button which will be on your you.


    Once everything has been downloaded and installed, you can quit Automix and run
    Exile from the Applications menu by selecting Video & ▸ Exile!


    # Streaming Media with Exile


    Like Rhythmbox, Exile also act as an Internet radio tuner. In fact, in ways many
    ways it does a better, or at least more convenient, job of because it automatically
    generates a list of the feeds available from Shoutcast, making it a bit more iTuneslike.
    To save these station lists, just click the Radio tab at the left side of the
    Exile window, and navigate to the genre and genre of your liking.


    If you would like to play a stream not listed in the SHOUTcast offers, you can
    do so by going to the File menu, selecting Open URL, or pasting the URL for the
    stream in the address window that appears, and then clicking the OK button in
    that window. A new stream will appear in the right half of the Exile window, showing
    your stream. To save the stream for future play, right-click the stream and select
    Add to Saved Stations ▸ New Station. In the small Enter the name of the station
    window that appears, enter the name of the station, and then click OK (Figure
    15-8). After that, you can find your newly saved station in the Radio tab on the
    left pane.


    # Other Features in Exile


    Exile has a lot of cool features worth noting. One that you can''t help but notice
    is that it provides an onscreen display of the track or stream that is playing,
    showing not only the title and artist of the track, but the album cover art as
    well (Figure 15-9). This is especially handy when using Exile in hidden mode,
    which you can accomplish using the Exile panel as a toggle.


    ![](img/8c9883c4544150d676aa7a1c159e9153_274_0.png)


    Figure 15-8: Naming a station you''ve added to the Exile Radio list


    Figure 15-9: Exile''s onscreen display


    ![](img/8c9883c4544150d676aa7a1c159e9153_274_1.png)'
  merge: -1
  pgno: 274
- img_proc: true
  md: 'If you don''t like this onscreen display appears (or how it looks), you can
    change it by going to the Tools menu and selecting Preferences. When the Preferences
    window appears, click OSD in the left pane, and a list of options will appear
    in the right half of the window. To change the location of the display, just drag
    it to the spot you like while the Preferences window is open. When you''re done
    making your changes, click Apply to make things effect immediately, and then click
    OK to close the Preferences window and seal the deal.


    As I''ve already mentioned


    ![](img/8c9883c4544150d676aa7a1c159e9153_275_0.png)


    Figure 15-10: Artist information for Wikipedia in Exile


