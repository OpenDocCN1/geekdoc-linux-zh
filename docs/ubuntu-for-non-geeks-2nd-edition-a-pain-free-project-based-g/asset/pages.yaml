  md: '# Project 6: Creating and Extracting Compressed Files


    Since I have been talking about file storage, it seems fitting to wrap things
    up in this chapter by teaching you how to create and extract compressed files.
    In the Windows world, these are generally referred to as Zip files, while in the
    Linux world, tarball is the operative name. The Linux name, in case you''re wondering,
    comes from the application that is used to create the archive for such files,
    Tar.


    Anyway, to get some of the hands-on stuff, we''ll be creating a Windows/Mac-friendly
    Zip file, and extracting it. We can get down to business by opening a Nautilus
    window and creating a couple of dummy files to work with. You can do this by going
    to the Nautilus File menu and selecting Create Document -> Empty File. A new file
    will appear in the Nautilus window, with its name highlighted. You can now type
    a name for the file, such as the one I''m using: dogwood. Now repeat the process
    to create a second file. I''ll be calling that one violet. Use something equally
    for yours.


    Now that we have two files to work with, let''s start creating the compressed
    archive following these steps:


    +   1. Select the two files by clicking your mouse to the side of the files, and
    then dragging the cursor (with the mouse button still pressed) over both files
    until they are highlighted, or by holding down the CTRL key and clicking on each
    file individually.

    2. Once both files are highlighted, right-click either one, and select Create
    Archive from the popup menu.

    3. In the Create Archive window that then appears, type blossoms in the Archive
    box, and then select zip from the drop-down menu button to the right of that.
    Everything looks like we''ve set up in Figure 6-18, click the Create button, after
    which a compressed archive of your two files (blossoms.zip) will appear in your
    home folder.


    ![](img/8c9883c4544150d676aa7a1c159e9153_117_0.png)


    Figure 6-18: Creating a compressed archive'
  merge: -1
  pgno: 117
- img_proc: true
  md: 'Now that you know how to put things together, let''s get back to work and learn
    the equally simple task of ripping it all apart—well, okay, extracting it.


    +   1. Drag the original dogwood and violet files to the Trash to get them out
    of the way.


    +   2. Double-click the blossoms.zip file you''ve created. A window showing the
    contents of the file will then appear (Figure 6-19).


    ![](img/8c9883c4544150d676aa7a1c159e9153_118_0.png)


    Figure 6-19: Extracting a compressed archive


    +   3. In that window, click the Extract button, after which another window, Extract,
    will appear. Click the Extract button in that window, and within a second (two
    at the most), you will find two new copies of dogwood and violet in your home
    folder.


    You''ve created and extracted a compressed archive, which is in this case a Zip
    file. You can also create a compressed tarball in the future by following the
    same procedure with real rather than dummy dummy (files), but when it''s time
    to select an archive type, select .tar.gz instead of .zip. Other than that single
    step, it is the same creation and extraction process.'
