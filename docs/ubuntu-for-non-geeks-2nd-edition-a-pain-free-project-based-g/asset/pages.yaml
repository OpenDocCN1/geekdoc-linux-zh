  md: '# 16


    # # PLUGIN'' IN THE PENGUIN


    Ubuntu and Your iPod


    ![](img/8c9883c4544150d676aa7a1c159e9153_286_0.png)


    With all the talk in the previous chapter about ripping, encoding, and playing
    back audio files, you may be wondering whether or not you''ll be able to transfer
    any of those files to your iPod using Linux.


    Well, you will be happy to know that Ubuntu does iPods, even Nanos. You will also
    be happy to know that using your iPod on your Ubuntu system is quite easy. All
    you have to do is plug your iPod into one of your computer''s USB ports, after
    which Ubuntu will automatically mount the iPod and place an iPod icon on your
    desktop (Figure 16-1). No longer do you have to mess around with mount and unmount
    commands or editing system tables. Just plug in your pod, and Ubuntu will do the
    rest.


    ![](img/8c9883c4544150d676aa7a1c159e9153_286_1.png)


    Figure 16-1: A desktop icon for a mounted iPod'
  merge: -1
  pgno: 286
- img_proc: true
  md: '# Knowing Your Limits


    Although you can use your iPod in Ubuntu, you should remember that support for
    such devices is still rather new. Because of that, there is likely to be the occasional
    odd moment while working with your iPod. I have been using mine without problems,
    but a friend did lose his data when he managed to freeze his system while doing
    something bizarre. The same thing happened to me on a Mac, so I guess that''s
    the life of the iPod. Anyway, if you do not lose all the data on your iPod or
    somehow corrupt your system, you can just use Apple''s iPod Updater in Windows
    to bring it back to normal and repopulate its library from your hard disk.


    As you downloaded and installed the two packages via Automix in Project 15a on
    page 246, you shouldn''t encounter problems if your iPod already has songs on
    it either MP3 or iTunes format that you ripped using iTunes. As for protected
    AAC files you have bought from the iTunes—well, forget playing those back in Linux
    unless you''re willing to do a bit of geeking around (https://ubuntu.com/community/RestrictedFormats/iTunesStore).
    Nevertheless, the playback support shouldn''t be a problem—you can add AAC files
    to playlists, copy them to your hard disk, and delete them from your iPod in Linux.


    For a Linux however, there is one big problem with regard to encoded audio formats
    (and it''s a limitation only in Linux): iPods do not support Vorbis files. There
    is talk that Apple might include support in future iPads, but I wouldn''t hold
    my breath. In the meantime, you can simply convert your Vorbis files to MP3 format
    for your iPod, though there will be a bit of a loss in quality. (This is understandable,
    considering that both formats are however, incompatible methods of compression,
    which require the throwing out of actual music data.) Of course, if you originally
    encoded your audio files in FLAT, this quality issue will be moot. You''ll learn
    more about this in "Converting Audio File Formats" on page 279.


    # iPod System Formats


    All iPods have a formatted filesystem, just like your hard disk. In fact, with
    the exception of the Shuffle and the Nano, they actually have hard disks inside
    them. The filesystem format that is in place on your iPod depends on which system
    you originally used it on. If you first used it on a Mac, it will be in Apple''s
    HFS+ file format. If you first used it on your Windows machine, it will be in
    Microsoft''s FAT32 format.


    Actually, in the short term, it doesn''t matter which filesystem formatted your
    iPod; Ubuntu usually means one either, allowing you to browse through all the
    files on your little beastie. If your iPod is HFS+-format, however, browsing and
    exporting tracks is just all you you will be able to dependably, assuming your
    system does mount. It is important that your iPod is FAT32 formatted if you want
    to really use it as you would in Windows or, ironically, Mac OS.


    Chapter 16'
