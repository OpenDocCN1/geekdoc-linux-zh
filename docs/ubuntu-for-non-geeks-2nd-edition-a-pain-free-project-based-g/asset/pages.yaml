    Blender (Figure 14-18) is a professional-level 3D modeling, animation, and rendering
    program. It is rather complex, but that is the source of its power and popularity
    (it comes in verses for just about every operating system there). If you would
    like to find out more about Blender before taking the time (and disk space) to
    install it, go to www.blender3d.org. Find it via Synaptic by searching for blender;
    once the program is installed, you can run it from Applications > Graphics > Blender
    3D modeller.


    ![](img/8c9883c4544150d676aa7a1c159e9153_261_0.png)


    Figure 14-18: Blender


    # QCad


    Another open source application that has found its way into almost all operating
    systems as QCad (Figure 14-19). QCad is a 2D computer-aided design (CAD) program
    with which you can create technical drawings as room interiores, machine parts,
    or even musical instruments (I’ve seen a plan for a Nyckelharpe on QCad!). To
    find out more, go to the project home page at www.ribbonsoft.com/qcad.html. Search
