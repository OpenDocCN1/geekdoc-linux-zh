  md: '# $ df


    Another safe and easy, but much more useful, command is df (file system). The
    df command tells you how much disk space you have used, as well as how much space
    you still have available, on each of the partitions on your mounted disks. Try
    it out by typing df and then pressing ENTER. Your output should look something
    like that shown in Figure 8-5 (depending, of course, the size of your mounted
    disks and how they are set).


    ```

    user@ubuntu:~$ df

    Filesystem     Size Used Available Mounted on

    /dev/sda1        46G  20G   25G  47% /

    varrun           112M   0K  112M   0% /var/run

    locks            4.0M   0K  4.0M   0% /var/lock

    procbususb       72M   0K   72M   1% /proc/bus/usb

    shm                4G   0M   4G   0% /dev/shm

    devm             4G   0K   4G   0% /devm

    tre               248M   1M  247M   1% /lib/modules/2.6.0-13-generic

    u@ubuntu:~$

    ```


    Figure 8-5: Output from the df command


    As you will notice, the sizes are given in kilobytes (KB) rather than the gigabytes
    (GB) and megabytes (MB) you are probably used to, but there is a way around this.
    Many commands accept a flag, or option, to further tune how the command performs.
    These flags are written directly after the main command and are preceded by a
    space and a hyphen.


    In this case, you can try using the -h (human readable) flag to have your figures
    come out the way you are most familiar with. Try this by typing df -h on the command
    line and pressing ENTER. The output should appear in a more familiar format (see
    Figure 8-6).


    ```

    user@ubuntu:~$ df -h

    Filesystem     Size Used Available Mounted on

    /dev/sda1        46G  20G   25G  47% /

    varrun           112M   0K  112M   0% /var/run

    locks            4.0M   0K  4.0M   0% /var/lock

    procbususb       72M   0K   72M   1% /proc/bus/usb

    shm                4G   0M   4G   0% /dev/shm

    devm             4G   0K   4G   0% /devm

    tre               248M   1M  247M   1% /lib/modules/2.6.0-13-generic

    latlat

    u@ubuntu:~$

    ```


    Figure 8-6: Output from the df command with the -h flag


    # $ ls


    Another harmless but handy command is ls (list directory contents). The ls command
    shows you what is in your current directory. This is the non-graphical equivalent
    of double-clicking a folder in Nautilus to see what is inside. Try it out by typing
