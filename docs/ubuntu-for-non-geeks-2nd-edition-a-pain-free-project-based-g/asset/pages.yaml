  pgno: 198
- img_proc: true
  md: 'If you happen to find and download a driver for your printer that does not
    come with its own installer (the driver file should end in .ppd), go back to the
    printer setup wizard, click the Install Driver button on the page, and navigate
    to the driver file you downloaded.


    Don''t forget to ask the Ubuntu forums (www.ubuntuforums.org) a try to see if
    anyone has any experience getting the printer in question to work on their system.


    # Trial and Error


    Finally, there is always the old trial-and-error approach, which works on occasion.
    When setting up your printer via the wizard window, by selecting Generic > PostScript
    Printer, which works with some machines. If that fails, try choosing from one
    of the other models and/or drivers available for printers from your manufacturers.


    After you are done with the wizard, click the Preferences for the printer you
    added, click the Test Page button, and see what happens. If nothing happens, click
    the Driver tab, select a different printer model, and then press the Print Test
    Page button again. Repeat until something works. With any luck, something will
    . . might . . well, just give it a try if you''re desperate.


    # Printing Details


    Now that your printer is set up, you will no doubt want to start printing. This
    is an easy task and not much different from how it works in the Windows and Mac
    worlds, so you will need little explanation in this regard. There are a few points
    of difference, however, so I will touch upon these.


    # Printing to PDF


    One of the features of Linux is that you can save most documents as PDF files.
    In some cases, such as OpenOffice.org, you do this by exporting the document to
    PDF. In most other applications, however, you do it via the Print dialog box,
    in which case you are said to be "printing to PDF". Whether you are saving to
    PDF, exporting to PDF, or printing to PDF, you are essentially doing the same
    thing: creating a PDF file of your document.


    This is vary as it allows you to create documents that cannot be altered by others
    and can easily be read regardless of what word processor or computer platform
    the reader is using. Best of all, this feature, which you would have to pay a
    pretty penny for in the Windows world, costs nothing, as it is built into your
    system.


    In most GNOME applications, you can print to PDF by going to the File menu of
    the application in question and selecting Print. When the window (Figure 10-5)
    appears, select Create a PDF document in the Printer pane, and then click the
    Print.'
