  md: '# CD/DVD Creator - File Browser


    ![](img/8c9883c4544150d676aa7a1c159e9153_111_0.png)


    **6-12: A Nautilus/CD/DVD Creator window is open, copying the files you want to
    burn to disk**


    Once the CD/DVD Creator window is open, copying the files you want to burn to
    disk is quite a simple drag-and-drop maneuver. Just open a new Nautilus window,
    and drag the files you want to burn over to the CD/DVD Creator window. If you
    prefer to do this in Windows-esque fashion, you can select the files you want
    to transfer to disk by clicking each file once, holding the CTRL key while doing
    so, for multiple selections. If you want to select consecutive files, you can
    click the first file in the group, and hold SHIFT, and then click the last file
    in the group, automatically selecting all the files in between. Release the CTRL
    or SHIFT key, right-click any of the highlighted files, and select **Copy** in
    the popup menu. After that, go back to the CD/DVD Creator window, right-click
    any open space, and select **Paste** in the menu.


    It is probably worth mentioning that the files you copy to the CD/DVD Creator
    window are not actually copied. Instead, they are essentially aliasing to the
    original files in their original locations. Thus, if you move one of the files
    from their original location before burning the contents of the CD/DVD Creator
    window to disk, the file will automatically vanish from the window, and it will
    not be burned when you finally get around to that step. This is not problematic,
    but it is something worth aware of.


    Once you have copied all of the files you want to burn to disk, click the **Write
    to Disc** button, after which a window (shown in Figure 6-13) will appear, telling
    you, other things, how many megabytes of files you have selected to write to disc.
    In this, you can give your disk a title and adjust the speed at which your disk
    will be burned (slower speed = fewer chances for errors), though you can just
    as well accept the defaults.


