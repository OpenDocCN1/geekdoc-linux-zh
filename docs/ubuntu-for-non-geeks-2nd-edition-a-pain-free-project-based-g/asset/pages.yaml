  md: '# 4


    # # MORE THAN WEBBED FEET


    *The Internet, Linux Style*


    ![](img/8c9883c4544150d676aa7a1c159e9153_68_0.png)


    These days, average home computer users spend more time surfing the Web and writing
    email messages than doing just about anything else. Even if you''re not much of
    a surfer, there are still numerous other applications that aren''t really Internet
    applications per se but still make use of the Internet in some way, such as gathering
    and album information when you rip audio CDs to create MP3 files. Having a computer
    that isn''t hooked up to the Internet is like buying a Maserati and refusing to
    take it out of the garage.


    Of course, how you connect to the Internet depends on your hardware and provider.
    There are a number of possibilities in this area, including high-speed local area
    networks (LANs), cable modems, and ADSL connections from phone lines. Most computers
    also have an internal 56Kb/s modem or can be connected to external dial-up modems
    for slower connections over regular phone lines. Depending on what you''ve got,
    setting up on your system should prove a cinch in the case of LAN connections
    and any others that make use of your Ethernet port (such as cable modems),'
  merge: -1
  pgno: 68
- img_proc: true
  md: 'possibly a bit more work in the case of wireless connections, and sometimes
    a bit of a challenge when it comes to the ol'' dial-up connections. In this chapter,
    you will learn how to set up these connections and learn a bit about what Linux
    has to offer in terms of the most commonly used Internet applications—your web
    browser and email client.


    # Setting Up a High-Speed Connection


    If you have a high-speed Internet connection from your cable television company,
    or if you are connected to the Internet by a LAN at your office, you are really
    in luck, because these setups are already the easiest to deal with. Most likely,
    all you have to connect the Ethernet cable from the port of the network card on
    your machine. If you''re using a LAN) or from your cable modem to a wireless router,
    then the Ethernet cable will connect to the wide area network (WAN) port of your
    wireless router. After that, once you start up your machine, you should be ready
    to go without any further settings to fool. If you like, you can see if you''re
    connected by opening Firefox (click your Firefox launcher in the top menu, right
    next to the System menu), and then it starts up, trying to navigate to a commons
    site, such as yahoo.com. If the site comes up, you know you''re all set.


    If you have a problem online, and you are trying to connect via a LAN or cable
    modem, the problem could very likely be that your network card is not supported
    by Linux. This is relatively rare, but unfortunately, easily remedied (by replacing
    it).


    The problem could also be that your network or service provider does not automatically
    assign addresses via Dynamic Host Configuration Protocol (DHCP). DHCP is a means
    by which your Internet provider can automatically (dynamically) provide your system
    with the configuration information in order to connect to the Internet. If your
    provider does not utilize DHCP, you will have to get the necessary information
    about settings from the network administrator or service provider and enter them
    yourself.


    # Setting Up a Cable or Ethernet Connection for Providers Not Utilizing DHCP


    To input your network or Ethernet settings, first get the settings from your network
    administrator or Internet provider, and then perform the following steps:


    +   1. From the System menu, select Administration > Network.

    2. You will be prompted for your password at this point, so type it (that would
    simply be your user password), and click Continue.

    3. The Network Settings window (shown in Figure 4-1) will soon appear, and when
    it does, select Wired connection by clicking it once (make sure the box to it
    is checked). Once you''re done, click the Properties button.

    4. In the Settings window that appears, change the Configuration selection from
    Automatic configuration (DHCP) to Static IP address.'
  merge: -1
  pgno: 69
- img_proc: true
  md: '![](img/8c9883c4544150d676aa7a1c159e9153_70_0.png)


    Figure 4-1: The Network Settings window


    +   5. The three text boxes shown in Figure 4-2 will become active, thus allowing
    you to enter the information provided to you by your Internet provider or network
    administrator. Once you''ve entered the settings, click the **OK** button.


    ![](img/8c9883c4544150d676aa7a1c159e9153_70_1.png)


    Figure 4-2: Manually inputting network

    IP settings


    +   6. Your system will then try to connect to the Internet with the settings
    you have provided and will show its progress in the Network Manager applet, which
    will look ... well, blue and kind of space. Once the connection is made, a message
    will appear directly below the applet telling you can then close the Network Settings
    window and surf to your heart''s content.


    **NOTE** If you are wondering what Internet protocol (IP) and domain name service
    (DNS) are all about, you can simply think of them in this: the DNS translates
    the easy-to-remember URLs that you have come to, such as *yahoo.com*, into numerical,
    or IP, addresses that the Internet can understand. The address *http://yahoo.com*
    becomes http://216.109.118.68. You can type the numerical version into your browser
    later to see for yourself.'
  merge: -1
  pgno: 70
- img_proc: true
  md: '# Setting Up a Wireless Connection


    Laptops have made the computer a more versatile tool. With the right wireless
    hardware, you can now surf the Web just about anywhere you can catch a wave, to
    speak. Whether you happen to be at your breakfast table, on your backyard deck,
    in the library of your university, or at your local Starbucks, Port City Java,
    or Dunkin Donuts, you can now go online without having to physically hook your
    computer to anything. Fortunately, the process of setting up wireless networking
    in Ubuntu is easy—different than what you just read in "Setting Up a High-Speed
    Connection" on page 50. In fact, as I mentioned, chances are that everything will
    just work from the get-go.


    # Hardware


    If you lead a widely existed or are just inexperienced in this particular area,
    there are a few things worth knowing. To get started, you need to have the right
    hardware. If you just want to go wireless outside of the home, then all you need
    is a wireless network interface card (NIC). These are often built in modern laptops,
    while for others they are usually add-ons in the form of cards that pop into the
    PCMCIA slot on the side of your computer (as seen on the right of Figure 4-3).


    ![](img/8c9883c4544150d676aa7a1c159e9153_71_0.png)


    Figure 4-3: All you need for a WiFi setup—an access point and a network interface
    card


    There are, however, also some NICs that plug into one of your machine''s USB ports,
    or in the case of desktop models, one of its PCI slots. Support for NICs of this
    type has improved through the last couple of years, there are still gaps, and
    some can be rather tricky to deal with. If you''re looking for a sure thing, Centrino
    IPW-2100 and IPW-2200 cards are definitely supported by Ubuntu. As for NICs of
    the built-in or PC card variety, you will find support much better, but even then
    you have to make sure, or at least hope, that the card you are using is Linux
    compatible. No matter what NIC you are wondering about, the easiest way to find
    out whether or not it will work is just'
  merge: -1
  pgno: 71
- img_proc: true
  md: 'try it out. The Linux kernel now comes with several wireless drivers built
    in, and Ubuntu updates often provide new ones, so if you use a card that is compatible
    with one of those, things will be smooth sailing. If they don''t seem to work,
    check the Ubuntu forums to find a driver that is compatible or to see anyone who
    has experience with your particular card.


    If you want to set up a wireless system in your home or office, then you will
    also need to a wireless access point (WAP), shown on the left of Figure 4-3. Fortunately,
    Linux compatibility is not really much of an issue in this department, because
    the access point doesn''t physically interface with your computer.


    Unfortunately (for Linux users, anyway), there are a few WAPs that require you
    to use Internet Explorer to handle their setup chores. Because a Linux version
    of Internet Explorer does not exist, you will find yourself stuck unless you have
    a Mac or Windows machine elsewhere in the house to complete the job. Worse yet
    is the fact that some machines do not support browser-based settings at all. Instead,
    they require you to install Windows software to do the job. When selecting hardware
    for your wireless setup, it is obviously best to stay clear of WAPs of this kind.


    # Activating Your Wireless Card


    Setting up a Linux-compatible PC card is actually relatively simple. First connect
    your WAP to your Internet source, and turn on the WAP. Once it is up and running,
    plug your wireless NIC into the PCMCIA slot on your laptop, of course, or your
    NIC is built in, in which case you can forgo this step. Any LEDs on the external
    card will most likely light up at this time.


    If your WAP was on when you booted your computer, and your wireless card was less
    in place during booting, you probably don''t need to do much to access the Internet.
    Just follow these steps:


    +   1. Click the Network Manager applet to reveal a drop-down menu showing the
    wireless signals that are present in your vicinity and the strength of each signal
    (Figure 4-4).

    2. From that menu, select the signal for your WAP (or any other wave you are entitled
    to latch onto) by clicking it.

    3. Your system will then try to connect to the Internet, and once a connection
    is made, you will be notified of it in a message below the Network Manager applet.
    The Network Manager app icon will morph into a small-strength indicator. Pretty
    handy.


    > NOTE Some WAPs employ an added level of security in the form of Wired Equivalent
    Privacy (WEP) or, more recently (and more securely), a WEP key. If the WAP to
    which you are trying to connect requires such a key, a window will appear prompting
    you to enter it. If you don''t happen to know the key, then the chances you are
    not supposed to be making the connection in the first place. Naughty, naughty.'
  merge: -1
  pgno: 72
- img_proc: true
  md: '![](img/8c9883c4544150d676aa7a1c159e9153_73_0.png)


    Figure 4-4: The Network Manager applet shows you available wireless networks and
    their signal strengths


    If it turns out you were not successful in making your wireless connection (the
    system will tell you if that''s the case), there are a few possibilities besides
    the annoying non-compatible card scenario. First of all, double-check to make
    sure your card is actually turned on. I know that sounds dumb, but I have been
    guilty of this oversight on numerous occasions.


    Another possibility is that your network does not utilize DHCP, in case you will
    have to manually input your connection settings provided by your network administrator
    or service provider. Armed with that information, simply follow the steps listed
    earlier in “Setting Up a Cable or Ethernet Connection for Providers Not Utilizing
    DHCP” on page 50. Just be sure to *Wireless connection* instead of Wired connection
    in Step 3.


    # Releasing and Renewing Your Wireless Connection


    There will be times when you want to turn your wireless card off, such as when
    you use your laptop on an airplane, or when you just want to flush the IP address
    in your network settings (*release*) and update the settings with the IP address
    of a new network (*renew*), as you might be moving your laptop from one wireless
    hotspot to rebooting your computer.


    This last point might seem a bit mysterious to you, so I will explain things briefly.
    When you boot up your computer, your wireless card (NIC) performs a scan of available
    networks (WAPs) in order to see which one it can connect to. Once it finds a network,
    it gathers an IP address from that via DHCP in order to allow you to access the
    Internet. Using release and renew allows you to change WAPs without having to
    reboot your computer or when your machine, whatever reason, just can''t make the
    change on its own.


    To perform a quick and release/renew operation, click the Network Manager applet
    to reveal the list of available wireless networks (i.e., signals). In that list,
    click the network to which you are connected. Within a second or two, you will
    be advised that you have been disconnected. A few seconds after that, you will
    be advised that a connection to that same network has been established. Wow.'
  merge: -1
  pgno: 73
- img_proc: true
  md: 'Okay, so do you turn off your wireless card, particularly if you don''t have
    a physical way to do it? Just right-click the Network Manager applet, and then
