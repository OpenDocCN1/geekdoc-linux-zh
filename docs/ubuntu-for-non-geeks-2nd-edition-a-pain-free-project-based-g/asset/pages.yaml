    # Audio Rippers and Encoders


    The application you use to rip audio files from CD and encode them into space-saving
    MP3 or Ogg Vorbis formats is commonly referred to as a ripper. For some time now,
    the most commonly used command-line ripper is Grip, which still has its dedicated
    following. Other simpler-to-use rippers, have surfaced more recently, such as
    RipperX, Goobox, and the one that came with Ubuntu: Sound Juicer.


    # Sound Juicer


    Sound Juicer (Figure 15-1) is a relatively new program that is pretty straightforward
    to use and quite capable in terms of what it does. It''s not perfect, though,
    and it can be a bit quirky. In addition, unlike many of its ripping cousins, Sound
    Juicer does not automatically create a playlist for the songs you rip and encode,
    and it lacks simple methods which to adjust the encoding bitrate.


    ![](img/8c9883c4544150d676aa7a1c159e9153_266_0.png)


    Figure 15-1: Ubuntu''s default ripping and encoding application—Sound Juicer'
  merge: -1
