  trans: '


    希望你喜欢这本书，并希望它能解答你对 Linux 和购买电脑的许多疑问。我从 1980 年左右开始在 VAX 多用户分时系统上使用 Unix，从那次接触该操作系统起，我一直是
    Unix 的忠实粉丝。现在我们有一个名为 Linux 的类似操作系统，可以将其安装在自己的个人电脑上。我喜欢这种操作系统简单、健壮的特性，它让我能够轻松创建新应用程序并修改用户界面。在许多情况下，使用
    Linux 命令行可能比在复杂的菜单系统中查找（或寻找）特定工具更简单、更快速。可能有六百多种 Linux 发行版，为用户提供了巨大的选择。我一直使用基于
    Ubuntu 的发行版，因为它们非常流行且支持良好。希望你也像我一样喜欢它们。


    ## Definitions


    ### Note

    > 维基百科对技术术语有极佳的定义，也有关于技术主题的优秀论文。这里的简要定义仅为了方便。如果你需要更多信息，请查阅维基百科。


    ### `2FA`

    > 当你登录网站时，对方通过电子邮件或短信向你发送额外的密码，即使用了双重身份验证。


    ### `Android`

    > Google 设计的基于 Linux 的平板电脑操作系统。


    ### `AOSP`

    > Android 开源项目 (Android Open Source Project)


    ### `Applet`

    > 通常用于用户界面的小型计算机应用程序。


    ### `Boot`

    > 计算机启动过程。


    ### `Chip`

    > 封装在塑料中带有外部连接引脚的单个集成电路。


    ### `Chipset`

    > 计算机主板上的集成电路，用于控制总线并决定总线性能。更多信息请参阅维基百科。


    ### `ChromeBook`

    > 运行 ChromeOS 的笔记本电脑。


    ### `ChromeBox`

    > 运行 ChromeOS 的小型桌面电脑。


    ### `ChromeOS`

    > Google 设计的用于笔记本电脑的 Linux 操作系统。


    ### `Cloud`

    > 通常通过互联网访问的远程计算机存储。


    ### `Command Line`

    > 当你在终端窗口中输入命令时使用的 `command line`。


    ### `Core i3, i5, i7`

    > 现代英特尔 Intel CPU 芯片。


    ### `CPU`

    > 控制计算机运行的硬件中央处理器。


    ### `Distribution`

    > Linux 的特定版本，如 Ubuntu、Mint、Lubuntu、Peppermint 等。


    ### `FOSS`

    > 自由开源软件 (Free Open Source Software)


    ### `Gb`

    > 吉字节是现代计算机的基本存储单位。


    ### `GNU`

    > Linux 操作系统的基础应用程序软件。没有 GNU，Linux 就不复存在。


    ### `GNU/Linux`

    > 对 Linux 操作系统的技术性准确定义。


    ### `GPU`

    > 图形处理单元或图形处理器。


    ### `GUI`

    > 图形用户界面。


    ### `Hard Drive`

    > 用于程序和文件的永久存储设备。


    ### `Hardware`

    > 计算机物理组件。


    ### `Integrated Circuit`

    > 单个硅片上一组互连的晶体管和其他组件。


    ### `Intel`

    > 计算机芯片制造商。


    ### `Kernel`

    > 操作系统系统的内核。


    ### `Linux System`


    ### `Linux Computer`

    > 指安装了 Linux 系统的任何计算机。


    ### `LTS`

    > 长期支持的 Linux 版本


    ### `Lubuntu`

    > 用于旧电脑的轻量级 Linux 发行版。


    ### `Malware`

    > 计算机病毒或任何其他恶意或破坏性软件。


    ### `Memory`

    > 用于正在使用的计算机程序和数据的临时存储。


    ### `Motherboard`

    > 包含总线、CPU、内存和图形处理器 (GPU) 的计算机主板。


    ### `NAS`

    > 网络附属存储。


    ### `Open Source`

    > 开源软件源代码免费可用，而专有软件源代码则不然。


    ### `Operating System or OS`

    > 计算机的基础控制软件。


    ### `Peppermint`

    > 一种带有开始菜单和用户可配置云应用程序的轻量级 Linux 发行版。


    ### `POST`

    > 开机自检。


    ### `Processor`

    > 控制计算机运行的硬件中央处理器。


    ### `Robust`

    > 一个软件技术术语，指能够从错误中恢复的能力。


    ### `RSS`

    > 简站点摘要提供下方示例所示简单的新闻订阅。


    ### `RSS example`


    ### `Sideload`

    > 使用操作系统提供的以外的工具加载或安装新软件。


    ### `Software`

    > 像操作系统和应用程序之类的计算机程序。


    ### `SSD`

    > 固态硬盘。这些硬盘通常更快，但比机械硬盘更贵。


    ### `Super Key`

    > 计算机键盘上通常位于 Alt 键旁边的键，可能有一个窗口图标。


    ### `TUI`

    > 文本用户界面。


    ### `Ubuntu`

    > 最流行的 Linux 发行版之一。


    ### `UI`

    > 用户界面。


    ### `USB`

    > 现用于大多数 PC 连接的通用串总总。


    ### `UX`

    > 用户体验。


    ### `Ultrabook`

    > 性能良好的超薄轻型笔记本电脑。


    ### `Version`

    > Linux 发行版的日期发布版本。


    ### `Zero Day Attack`

    > 开发人员没有时间准备的任何恶意软件。维基百科对这种恶意软件术语有极佳的解释。


    '
