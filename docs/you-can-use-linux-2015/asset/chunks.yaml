    **致谢**

    本书献给 Alex, Anya, Dasha, Drew, Emily, Galena, Hannah, Havalah, Jamie, Julie, Kylie,
    Nathan, Paige, Phoebe, Rebecca, Sam, Tommy, Zac, Zeke 以及其他希望在计算机自自给足的年轻人。他们激励我写这本书，以便向他们和其他人展示如何安装、使用、自定义、备份、恢复和维护计算机软件。


    我的 Android 平板电脑测试员是 Joelle 和 Matthias。他们将我的 `Nexus 7` 平板电脑摔了三十多次，除了铝框上有划痕和凹痕外，电脑没有任何损坏，这证明了它是多么坚固且制作良好。


    Kathleen 担任本书的编辑。


