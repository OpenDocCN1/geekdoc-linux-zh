    ## 1 - Introduction


    ### Guide to This Book


    ### About the Author

    I have forty five years of experience in computer hardware/software design and
    development along with pieces of paper from colleges so my opinions are based
    on experience and education. However, the years of experience are worth more than
    any college degree. I also attended 52 weeks of Navy electronics schools and served
    in the Navy for several years as an electronics technician. One of my pastimes
    is buying used computers, upgrading, repairing, and evaluating them. If you know
    someone with more experience, please stop reading this book now and get advice
    from your friend who has more experience. This book is for the average user and
    not for power users who need the latest `cpu`, multi gigabytes of memory, the
    fastest motherboard, and a warp speed hard drive. If you are a power user, stop
    reading this book now.


    ### Book Description

    This chapter, Chapter 1, will provide information regarding the benefits of using
    Linux, including features, applications, hardware, and different flavors of Linux.


    Chapter 2 of this book will have information about some of the computers that
    I have installed Linux on and how to save money on computers. Chapter 3 of the
    book contains background information about `GNU/Linux` and definitions of some
    of the technical terms used in the book along with other commonly used acronyms.


    This is just a brief introduction to Linux. More detailed information are in my
    other books about specific Linux distributions, including how to install, update,
    customize, use and maintain Linux. Please see my web site at `weidmanenterprises.com`
    for more information.


    This booklet is about getting started with Linux and purchasing computers for
    Linux. I prefer Linux over all other operating systems, because Linux allows me
    to control the user interface, choose the computers to install it on, and choose
    the application software. I also like Linux because it is more secure, more reliable,
    customizable, easier to install and easier to update than other operating systems.
    The next pages list some of the advantages of using Linux.


    ### Linux Advantages

    * Easy to install

    * Easy to use

    * Installation in about 5 minutes on a `core i3` computer

    * You choose a user interface that suits your needs

    * You decide when to upgrade to a new version

    * You choose the computer that fits your needs or budget

    * It is virtually immune to malware

    * No forced software updates

    * Minor software updates take about 1 minute

    * Runs on older computers

    * Linux is free

    * Highly customizable

    * There are lots of different Linux distributions

    * It has a well documented, logical file system hierarchy

    * It comes with a very large programming toolset

    * Linux history goes back to the creation of `Unix` in 1969


    My other Linux books contain simple step by step instructions with regard to installing,
    updating, using and customizing Linux. Please see my website, `weidmanenterprises.com`,
    for more information. New users have easily installed and used Linux by following
    the instructions in my books.


    ### Linux Applications

    Linux has over 40000 free applications in addition to some paid applications.
    Linux is capable of satisfying the daily computing needs for most users. Here
    are some Linux categories:

    * Database

    * Games

    * Photo

    * Programming

    * Presentation

    * Spreadsheet

    * Video

    * Web Browsers

    * Word Processing


    ### You Will not Need Expensive Computers

    Don''t buy the latest whiz-bang, slim, light, ultrabook for $1000 or more. There
    are much better deals that may not be slim or light or fashionable, but will save
    you as much as $1000. Installing a free operating system like Linux will also
    save money compared to upgrading to the newest version of other operating systems.
    Linux will read Microsoft Office documents so you will be able to keep all of
    those files. However, many used or new computers already have the latest version
    of `Windows` installed. So you may keep `Windows` if you want to and install Linux
    by creating a dual boot system.


    The four basic parts of computers that determine their performance are the `CPU`,
    memory, hard drive and the `bus`. The `bus/chipset`, which is part of the motherboard
    and cannot be replaced, connects the `CPU`, memory and hard drive, so the `bus/chipset`
    speed could be a limiting factor. Upgrading the `CPU`, memory and hard drive will
    have little effect if the `bus` speed is slow. A basic computer block diagram
    is shown on the next page.


    ### Computer Block Diagram

    Note that the `I/O` block is the `Input/Output` subsystem or chip. The `BIOS`
    or `UEFI` contains the computer initial boot code. Memory is short term volatile
    storage and the hard drive is long term permanent storage. The thick vertical
    line is a classic symbol that represents the `bus/chipset`. More information may
    be found in the `Definitions` section at the end of this book.

