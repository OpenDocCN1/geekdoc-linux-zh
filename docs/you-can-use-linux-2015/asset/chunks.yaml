    我最近在 ebay 上花 182 美元购买了另一台 HP Elitebook 笔记本，这是一台配备 4GB 内存的 8440p  i5 笔记本。它看起来像
    HP 2530p，但更大、更重，拥有 14 英寸显示。8440p Elitebook 的性能非常好，但如果使用 `SSD` 而不是机械硬盘，性能会显著提升。使用机械硬盘启动需要
    35 秒以上，而使用 `SSD` 仅需约 17 秒，这意味着 `SSD` 的速度快了一倍。


    HP Elitebook 系列电脑是非常出色的二手选择，因为它们是为商务出差人士设计的，能够承受剧烈的磨损。


    ### HP Elitebook 2530p 照片


    ### 购买新机还是翻新机

    买到便宜电脑并不限于二手电脑。新电脑或翻新电脑有很多优惠活动。买到一台划价的新电脑可能像买去年的型号一样简单，也可能像寻找一个不流行的型号一样困难——因为那不是那种在你喜欢的十六种时尚色彩中的、最新的酷炫、超薄本、像素级电脑。电脑不是时尚配件！如果你想要时尚配件类的电脑，可能需要支付溢价，甚至可能无法满足你的技术需求。电脑是工具，就像面包机、收音机、咖啡机之类的。如果你想要时尚配件，去买双新鞋或新皮夹克。如果我们想买最薄、最酷炫、最前端的电脑，就无法上省钱。


    ### 笔记本电脑优惠

    这里是我发现的一些新电脑优惠。我最近在 Tiger Direct 花 499 美元买了一台新的 HP 430 g1 Probook core i3 笔记本，它提供了一些其他系统的选择。我刚刚拒绝了其他操作系统选项，安装了
    `Linux`（`Ubuntu 14.04 Unity`），它超出了我的预期。（等等，检查文本：`installed Linux ( (Ubuntu 14.04
    Unity)`)）并且它超出了我的预期。我正用它来输入本文，它从完全关机状态启动只需 11 秒，运行完美无缺，非常安静，配有固态硬盘（`SSD`）和一个移动宽带卡槽。我搜索过类似的电脑，HP
    的价格比任何竞争对手都低。HP Probook 也有配备 core i5 或 core i7 cpu 的版本，除非你计划在电脑上玩一些激烈的游戏，否则那是多余的。我也不建议在笔记本中使用
    core i7 cpu，因为我认为这是一个失败的根源。我不认为笔记本的冷却系统足以散热 core i7 cpu 可能产生的热量，但这仅仅是我个人的主观见解。


    ### HP Probook 430 g1 照片

    我最近购买的另一台新笔记本是一台仅售 199 美元的 HP 11 Chromebook。这是一台用于上网和使用 `Google Docs` 的极佳电脑。这可能就是许多人需要的全部。在这个价位附近有很多
    `Chromebooks`，所以有很多选择。`Chromebook` 启动极快，屏幕非常亮，音质良好，且纤薄轻。把它想象成减价了一千美元的超薄本。当然，`Chromebook`
    在功能上并不等同于超薄本，但在外观、尺寸和重量上是类似的。想想看你省下的那一千美元可以买多少双靴子、皮夹克或摩托车配件！


    如果你讨厌电脑，现在就停止读这本书，去买一台 199 美元或更低的 `Chromebook`。如果你知道如何使用浏览器，那么你会发现 `Chromebook`
    非常易用。`Chromebook` 的照片在下一页。


    ### Hp 11 Chromebook 照片


    ### 平板电脑优惠

    去年我在 Newegg 购买了一台 `Android Nexus 7` 平板电脑，大约 200 美元，因为是去年的型号，便宜了约 100 美元。我对这台 `Android`
    平板非常满意，它表现完美，经受了多次跌落，金属框上的许多划痕也证明了它非常坚固。与 `iPad` 的价格相比，我省下了几百美元甚至更多。


    ### Nexus 7 平板照片


    ### 台式电脑优惠

    我最近花 149 美元买了一台 `ASUS CN60 Chromebox`，并将其连接到 27 英显示器上，这样我就可以看 `Netflix` 电影和 `Amazon
    Instant Videos` 了。`Chromebox` 内置了 wifi、四个 `USB 3.0` 端口、一个 `HDMI` 视频接口和一个 `DisplayPort`。还有一个用于额外存储容量的
    `SD` 卡槽。`Chromebox` 很容易安装在显示器背面，通电并设置。在我拥有过的所有电脑中，搭载 `ChromeOS` 的 `Chromebox`
    是最容易设置和使用的电脑系统。


    ### 连接到显示器上的 Chromebox


    ### 翻新电脑

    节省电脑费用的最后策略是购买翻新机。许多“翻新”电脑拥有与新机相同的保修，并且可能是“开箱”电脑，即客户因为某些原因不符合需求而退回。翻新电脑可以在 ebay、amazon、Tiger
    Direct、Newegg、Microcenter 和一些当地零售商处购买。与新机的成本相比，你可以轻松节省 10%到 20% 或更多。如果你不想自己动手，可以找一个极客朋友帮你选一台电脑。


    ### 3 - Linux 基础信息


    #### GNU/Linux

    `Linux` 发行版最好的特性之一是它们是免费开源的 `GNU/Linux` 软件。这意味着软件可以自由使用、复制、修改和重新分发。开源软件由全球范围社区开发、维护和分发。软件归社区所有，开发过程是透明的。这使得代码更加稳定可靠，几乎没有恶意软件，且易于安装、易于使用。


    `GNU` 是一组类 Unix 的程序，为 `Linux` 系统提供基本功能。没有 `GNU` 工具和应用程序，Linux 就不存在。这就是为什么有些人将操作系统称为
    `GNU/Linux` 而不仅仅称为 `Linux`。`GNU` 是 *GNU''s Not Unix*（GNU 不是 Unix）的缩写。`GNU` 是基本
    Unix 程序的 FOSS（自由开源软件）实现。


    `GNU/Linux` 已开发了二十年，是一个非常成熟的操作系统。`Linux` 内核由 `Linus Torvalds` 于 1991 年设计。`GNU`
    系统由 Richard Stallman 设计。`GNU/Linux` 现在由自由软件基金会维护。`GNU/Linux` 的设计基于 `Unix`，后者由
    AT&T 贝尔实验室从 1969 年开始创建。因此，`GNU/Linux` 的历史跨越了四十。


    ### Linux 命令行

    有 10,000 个 `Linux` 命令，所以如果我的猫走过键盘，它可能会输入出一个 `Linux` 命令。这里有一个关于命令行有多用的简单例子。如果我想知道
    1776 年 7 月 4 日是星期几该怎么办。使用日历 GUI 需要点击 200 多次鼠标，或者我只需要在命令行中输入 `cal jul 1776`。在许多其他情况下，输入一个简单的命令要比与
    GUI 斗争几分钟容易得多。`cal jul 1776` 命令的结果如如下截图所示。


    **cal 命令**


    **关于本书**

    '
- fmt: '

    I hope you enjoyed this book and that it answered many of the questions you may
    have had about Linux and buying computers. I started using Unix on a VAX multi-user
    time-sharing system around 1980 and I have been a Unix fan ever since that first
    experience with the operating system. Now we have a similar operating system called
    Linux, that we can install on our own personal computers. I enjoy the simple,
    robust nature of an operating system that allows me to easily create new applications
    and to modify the user interface. Using the Linux command line may, in many cases,
    be easier and quicker than searching through a complex menu system to find, or
    not find, a specific tool. There may be over six hundred Linux distributions giving
    users a tremendous amount of choice. I have stayed with Ubuntu based distributions
    because they are very popular and well supported. I hope that you like them as
    much as I do.


    ## Definitions


    ### Note

    > Wikipedia has great definitions of technical jargon and excellent papers on
    technical topics. The following terse definitions are here for convenience only.
    Consult Wikipedia if you want more information.


    ### `2FA`

    > Two factor authentication is in use when you log in to a website and they email
    or text an additional password to you.


    ### `Android`

    > A Linux based OS for tablets designed by Google.


    ### `AOSP`

    > Android Open Source Project


    ### `Applet`

    > A small computer application usually used for user interfaces.


    ### `Boot`

    > The computer start up process.


    ### `Chip`

    > A single integrated circuit encapsulated in plastic with external connector
    pins.


    ### `Chipset`

    > Integrated circuits on a computer motherboard which control the bus and determine
    the bus performance. See Wikipedia for more information.


    ### `ChromeBook`

    > A notebook computer running ChromeOS.


    ### `ChromeBox`

    > A small desktop computer running ChromeOS.


    ### `ChromeOS`

    > A Linux based OS for notebooks designed by Google


    ### `Cloud`

    > Storage on a remote computer usually accessed via the internet.


    ### `Command Line`

    > The `command line` is used when you are typing a command in a terminal window.


    ### `Core i3, i5, i7`

    > Modern Intel CPU chips.


    ### `CPU`

    > The hardware Central Processing Unit which controls the operation of the computer.


    ### `Distribution`

    > A specific flavor of Linux like Ubuntu, Mint, Lubuntu, Peppermint etc...


    ### `FOSS`

    > Free Open Source Software


    ### `Gb`

    > The Gigabyte is a basic unit of storage for modern computers.


    ### `GNU`

    > The basic application software for the Linux OS. Linux could not exist without
    GNU.


    ### `GNU/Linux`

    > The technically correct definition for the Linux OS.


    ### `GPU`

    > The graphics processing unit or graphics processor.


    ### `GUI`

    > Graphical User Interface


    ### `Hard Drive`

    > The permanent storage device for programs and files.


    ### `Hardware`

    > The physical computer components.


    ### `Integrated Circuit`

    > A group of interconnected transistors and other components on a single slice
    of silicon.


    ### `Intel`

    > A manufacturer of computer chips.


    ### `Kernel`

    > The core of an operating system.


    ### `Linux System`


    ### `Linux Computer`

    > Any computer with the Linux OS installed.


    ### `LTS`

    > Long Term Support Linux release


    ### `Lubuntu`

    > A lightweight Linux distribution for older computers.


    ### `Malware`

    > A computer virus or any other malicious or destructive software.


    ### `Memory`

    > Temporary storage for computer programs and data that are in use.


    ### `Motherboard`

    > The computer main board containing the bus, CPU, memory and graphics processor
    (GPU.)


    ### `NAS`

    > Network Attached Storage


    ### `Open Source`

    > The source code for open source software is freely available where proprietary
    software source code is not.


    ### `Operating System or OS`

    > The basic control software for a computer.


    ### `Peppermint`

    > A lightweight Linux distribution with a start menu and user configurable cloud
    based applications.


    ### `POST`

    > Power On Self Test


    ### `Processor`

    > The hardware Central Processing Unit which controls the operation of the computer.


    ### `Robust`

    > A technical term for software meaning the ability to recover from errors.


    ### `RSS`

    > Rich Site Summary provides simple news feeds as shown in the example below.


    ### `RSS example`


    ### `Sideload`

    > Loading or installing new software using tools other than those supplied with
    the operating system.


    ### `Software`

    > Computer programs like the OS and applications.


    ### `SSD`

    > A solid state drive. These are generally faster, but more expensive that mechanical
    hard drives.


    ### `Super Key`

    > The key on a computer keyboard that is usually located next to the Alt key and
    may have a window icon.


    ### `TUI`

    > Text User Interface


    ### `Ubuntu`

    > One of the most popular Linux distributions.


    ### `UI`

    > User Interface


    ### `USB`

    > Universal Serial Bus that is used for most pc connections today.


    ### `UX`

    > User Experience


    ### `Ultrabook`

    > A slim and lightweight laptop with good performance.


    ### `Version`

    > A dated release of a Linux distribution.


    ### `Zero Day Attack`

    > Any malware that developers have no time to prepare for. Wikipedia has a great
    explanation for this malware terminology.

    '
