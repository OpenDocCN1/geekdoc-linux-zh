    在我看来，最易安装和使用的 Linux 发行版是 Linux Mint 和 elementary OS，其次是 Ubuntu Unity、Lubuntu、LXLE
    和 Peppermint。LXLE 和 Linux Mint 拥有类似 Windows 的桌面和菜单系统，而 Ubuntu Unity 则拥有类似 Mac
    的桌面和菜单系统。由于 Lubuntu、LXLE 和 Peppermint 因为它们是轻量级发行版，因此在旧电脑上运行速度极快，而且它们都拥有一个与 Windows
    类似的简单菜单系统。


    ## Linux 发行版与硬件要求


    Linux Mint 和 Ubuntu 设计用于运行带有较快处理器的现代电脑。它们至少需要一个 `Core 2 Duo` 处理器、约 1 Gb 的内存和 8
    Gb 的硬盘空间。然而，我建议至少在核心 i3 电脑上使用 Ubuntu Unity 和 Linux Mint 以获得更好的性能。像 `Lubuntu` 和
    `Peppermint` 这样轻量级的发行版可以在较旧的处理器上运行，可能只需要 512 mb 内存。不过，建议使用 1 Gb 内存。这些轻量级发行版在曾经安装过
    Windows XP 的电脑上运行速度异常快。Lubuntu 和 Peppermint 这样的轻量级发行版具有高度定制性，而 Mint 和 Ubuntu 则没有那么容易定制。


    接下来的页面展示了几个定制化的 Linux 桌面，包括 `Ubuntu Unity, Lubuntu, elementary OS 和 Peppermint`。


    ### 定制化的 Ubuntu Unity 桌面


    如果你喜欢 MacOs，那么你就会喜欢 Ubuntu Unity。Ubuntu 在屏幕左侧有一个“停坞”（dock），被称为“启动器”（launcher），而不是在屏幕底部。你可以将所有喜欢的应用程序放在启动器上，这样只需快速点击即可启动。


    ### 定制化的 Lubuntu 桌面


    如果你习惯了 Windows，那么你就会喜欢 Lubuntu。Lubuntu 拥有与 Windows 类似的开始按钮和菜单。Lubuntu 具有高度定制性，你可以向菜单中添加自定义应用程序并添加自定义快捷键。请注意面板最左侧的企鹅开始按钮。Tux
    企鹅（即 Linux 的标志和吉祥物）是由 Larry Ewing 创建的。


    ### elementary OS 桌面


    如果你喜欢 MacOs，那么你就会喜欢 eOS。eOS 在显示底部有一个停坞（dock）。你可以将所有喜欢的应用程序放在停坞上，这样只需快速点击即可启动。eOS
    拥有非常简单且易用的桌面。关于 eOS 的更多信息可以在 Kindle 商店的我的《elementary OS User Manual Freya Beta
    2》书中找到。


    ### 定制化的 Peppermint 5 桌面


    Peppermint 拥有与 Lubuntu 菜单和桌面类似的菜单系统和桌面。然而，Peppermint 允许用户将网站添加到菜单中，允许通过 `site
    specific browser`（也称为 `SSB`）直接访问所需的网页。Peppermint 和 Lubuntu 一样也是高度定制的。请注意面板右侧的自定义触摸板控制。


    关于 Ubuntu、Lubuntu 和 Peppermint 发行版的更多信息可以在 `weidmanenterprises.com` 找到。


    ## 关于 ChromeOS


    ChromeOS 是一种基于云的操作系统，由 Google 设计并支持 Linux 内核。它使用 Chrome 浏览器访问 Google Docs 和 Google
    Drive。也可以离线使用 Google Docs 或 Google Drive。ChromeOS 提供一些应用程序软件，但目前并不多。如果你大部分时间都用来上网和检查邮件，那么
    Chromebook 可能是你最便宜且最好的电脑。Chromebook 的价格从新机的约 $179 美到 $300 美不等，并带有两年的 Google Drive
    100 Gb 存储空间。如果你会使用网络浏览器，但发现计算的其他方面很困难，请现在停止读这本书并买一台 $199 的 Chromebook。你可以用你的 ChromeOS
    电脑观看 Netflix 电影和 Amazon Instant Videos。关于 ChromeOS 的更多信息可以在网上和维基百科上找到。


    ### ChromeOS 桌面


    ## 关于 Android


    Android 是由 Google 开发并支持的基于 Linux 的平板电脑和手机操作系统。它使用触摸界面，并拥有大量的应用程序。

