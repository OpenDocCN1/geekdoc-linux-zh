- fmt: '

    Mechanical hard drives are significantly slower than solid state drives (SSDs.)
    Many computers today, like the MacBook Air and other ultrabooks, have solid state
    drives. The one upgrade that should always result in faster performance is the
    replacement of a mechanical hard drive with a SSD. Unless you are playing some
    intense games, you will not need the fastest motherboard and processor or 8 Gb
    of memory. Most users will get by fine with a core i3 processor, 2 Gb of memory
    and a 128 Gb solid state drive. Linux does not require as much memory as other
    operating systems so most users will not need more than 2 Gb of memory.


    ## Managing Your Computers


    Some operating systems or application software programs are continually accessing
    the computer hard drive. If your hard drive light is always on, then this is the
    case. It will shorten the life of your hard drive, even if it is a solid state
    drive. You should try to find what is causing this problem or install another
    operating system on your computer. A thrashing hard drive could be an indication
    that your computer does not have enough memory, so installing more memory could
    solve the problem. The hard drive light on my Linux computers are rarely on, but
    they do blink occasionally. Hard drives will last much longer with Linux thus
    saving you time and money. Do a web search for "thrashing hard drive" and you
    will find many examples.


    Does your laptop have a user replaceable battery and hard drive? If not, then
    it could cost as much as $300 to replace the battery and maybe the same or more
    to replace the hard drive. There are many laptops available which have batteries
    that may be replaced for as little as $10 and hard drives that could be replaced
    for under $100\. These are important considerations when buying any laptop if
    you want to save money on maintenance.


    You should power off your computers if you are not using them. This is especially
    true for laptops, regardless of what operating system is installed, because laptops
    may overheat very easily. There just is not enough space or cooling fan power
    in some laptops to adequately cool them. Leaving your computer running 24/7 accomplishes
    nothing other than shortening the life of the computer. It will last longer if
    you power it off when you are not using it. Using screensavers may also cause
    your laptop to overheat and it is an unnecessary use of electricity.


    Lithium Ion batteries that are used in practically all personal electronic devices
    today will have a much longer useful life if they are continually charged and
    their life will be shortened if they are discharged below 40%. Ignore any advice
    or instructions to fully discharge Lithium Ion batteries. That is wrong and it
    will shorten the life of your batteries. Do not discharge your Lithium Ion batteries
    below 40%.


    ## About Linux


    The development of Linux began in 1969 when AT&T Bell Labs created the `Unix`
    operating system. Linux, which was created in 1991 by Linus Torvalds, is based
    on Unix. Unix was designed to operate on practically any computer and has the
    best architecture of any modern operating system. For more detailed information
    about Unix and Linux, try Wikipedia or The Linux Foundation. This book is just
    a quick introduction to Linux and will not go into a lot of the fine details about
    the operating system.


    Linux has a modern desktop and it has modern application software that is just
    as functional and just as easy to use as any other software. If fact, modern Linux
    is much easier to use than some other popular operating systems. Linux has word
    processing, spreadsheet, database, and slide show software and it is all free
    to use, free to customize, and free to update. The only downsides are that Linux
    does not come installed on many computers and it is not well documented. So get
    one of your geek friends to install it for you if you don''t want to do it yourself.
    She will gladly do it for a smile, a cup of coffee, a piece of cake or a glass
    of wine. While she is installing Linux, ask her to check the hard drive and battery
    and replace them if necessary.


    Linux is in more devices than any other operating system. Linux powers everything
    from watches to the International Space Station. It''s in your car, your tv, your
    toaster, your radio, and maybe even in your refrigerator. Linux powers 98% of
    the worlds supercomputers, it is in Navy Submarines, Air Force Drones, it is in
    every Android phone and tablet, it powers servers on the internet, it is used
    by Google, HP, IBM, Intel, Oracle, the New York Stock Exchange and numerous other
    organizations. Linux is used by more people and more organizations every year
    and it represents the future of computing.


    ## Linux Operating Systems


    There are many popular flavors of Linux including Android, ChromeOS, Ubuntu, and
    many Ubuntu derivatives. Linux will do almost everything that other computers
    will do and it will do it at a much lower cost. In addition, Linux will do things
    that other operating systems cannot do. I like Linux because it saves me money
    compared to the cost of periodically upgrading costly operating systems or purchasing
    expensive ultrabook computers, and because Linux is highly customizable.


    Linux desktop operating systems are called `distributions`. A Linux `distribution`
    consists of the Linux kernel, which is the core of the operating system, packaged
    with a unique desktop along with a unique mix of application software. The illustration
    on the next page shows where the `kernel` fits within the Linux distribution.


    ## Linux System: Linux Distributions


    The following sentence from the previous paragraph is worth repeating here. A
    Linux `distribution` consists of the Linux kernel packaged with a unique desktop
    along with a unique mix of application software.


    Which Linux distribution to use is a matter of personal choice. People who like
    MacOs may prefer Ubuntu Unity, elementary OS, or LXLE. People who like Windows
    may prefer Lubuntu, Peppermint, or Ubuntu Gnome. I have created a user manual
    for each of these Linux distributions. All Linux distributions are free to try.


    The LTS (Long Term Support) versions of these distributions, which are supported
    for five years, are the best distributions to install. The Ubuntu LTS versions
    are released every two years and the most recent ones are 12.04 and 14.04 which
    were released on April 2012 and April 2014\. Interim distributions like 12.10,
    13.04, and 13.10 may only be supported for about nine months and generally are
    not as stable as the LTS versions. The next Ubunutu LTS version should be 16.04
    which may be released in April of 2016.


    Android is a tablet OS designed by Google and ChromeOS is a notebook operating
    system designed by Google. Both operating systems use a Linux kernel.


    ## More about Linux Distributions


    There are more than 600 flavors of Linux called `distributions`. Each Linux distribution
    has a different purpose and they have different functionality. The most popular
    Linux distributions are `Linux Mint` and `Ubuntu`. There are many Ubuntu based
    distributions. Some of them are `Ubuntu Unity, Ubuntu Gnome, Lubuntu, Xubuntu,
    elementaryOS, LXLE and Peppermint`.


    Each distribution has `versions or releases` that are made available to the public
    periodically. Many releases are identified by the release date, like 14.04 which
    would be the April, 2014 release. Some releases just have a number like `Linux
    Mint 17` or `Peppermint 5`. Finally some releases are `LTS, Long Term Support`,
    which may be supported for three or five years. The best choice for any Linux
    distribution would be the `LTS` release which is supported for a longer time than
    other periodic releases.

