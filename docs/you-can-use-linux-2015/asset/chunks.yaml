    ## 1 - 引言


    ### 本书指南


    ### 关于作者

    我在计算机硬件/软件设计与开发方面拥有四十五年的经验，此外还有大学的文凭，因此我的观点是基于经验和教育的。然而，多年的经验比任何大学学位更有价值。我还参加过
    52 周的海军电子设备学校，并在海军中担任了多年的电子技术员。我的爱好之一是购买旧电脑并对其进行升级、维修和评估。如果你认识比我更有经验的人，请现在停止阅读本书，向你那位更有经验的朋友寻求建议。本书是面向普通用户的，而不是面向那些需要最新
    `cpu`、数 GB 内存、最快主板和曲速硬盘的高级用户。如果你是高级用户，请现在停止阅读本书。


    ### 书籍简介

    本章（第一章）将提供有关使用 Linux 处的信息，包括特性、应用程序、硬件和不同版本的 Linux。


    本书的第 2 章将介绍我安装过 Linux 的某些电脑以及如何在计算机上节省费用。本书的第 3 章包含关于 `GNU/Linux` 的背景信息、书中用到的一些技术术语的定义以及其他常用缩写。


    这只是对 Linux 的简要介绍。更多详细信息请见我关于特定 Linux 发行版的其他书籍，包括如何安装、更新、自定义、使用和维护 Linux。更多信息请访问我的网站
    `weidmanenterprises.com`。


    本手册关于 Linux 入门以及为 Linux 购买电脑。我比所有其他操作系统都喜欢 Linux，因为 Linux 允许我控制用户界面、选择安装它的电脑以及选择应用程序。我喜欢喜欢
    Linux，还因为它比其他操作系统更安全、更可靠、更可定制、更容易安装且更容易更新。接下来的页面列出了使用 Linux 的一些优点。


    ### Linux 优点

    * 于安装

    * 易于使用

    * 在 `core i3` 电脑上安装约需 5 分钟

    * 你选择适合自己的用户界面

    * 你决定何时升级到新版本

    * 你选择符合需求或预算的电脑

    * 它对恶意软件几乎免疫

    * 无强制软件更新

    * 小幅软件更新约需 1 分钟

    * 在旧电脑上运行

    * Linux 是免费的

    * 高度可定制

    * 有许多不同的 Linux 发行版

    * 它具有文档齐全、逻辑清晰的文件系统层次结构

    * 它带有一个非常强大的编程工具集

    * Linux 历史可以追溯到 1969 年 `Unix` 的创建


    我的其他 Linux 籍包含了关于安装、更新、使用和自定义 Linux 的简单步骤说明。请访问我的网站 `weidmanenterprises.com` 了解更多信息。新用户已经通过遵循我书中的说明轻松地安装并使用了
    Linux。


    ### Linux 应用程序

    除了一些付费应用程序外，Linux 有超过 40000 个免费应用程序。Linux 能够满足大多数用户的日常计算需求。以下是一些 Linux 类别：

    * 数据库

    * 游戏

    * 摄影

    * 编程

    * 演示文稿

    * 电子表格

    * 视频

    * 浏览器

    * 文字处理


    ### 你不需要昂贵的电脑

    不要花 1000 美元或更多购买最新的新款、纤薄、轻便的超薄笔记本。有许多更好的选择，它们可能不薄、不轻或时尚，但能为你节省高达 1000 美元。安装像 Linux
    这样的免费操作系统比升级到其他操作系统的最新版本更省钱。Linux 可以读取 Office 文档，因此你可以保留所有这些文件。然而，许多旧或新电脑已经安装了最新版本的
    `Windows`。因此，如果你愿意，可以保留 `Windows` 并通过创建双系统来安装 Linux。


    决定性能的四个基本部分是 `CPU`、内存、硬盘和 `bus`。`bus/chipset` 是主板的一部分且无法更换，它连接了 `CPU`、内存和硬盘，因此
    `bus/chipset` 的速度可能是限制因素。如果 `bus` 速度慢，升级 `CPU`、内存和硬盘的效果很小。基础计算机框图见下一页。


    ### 计算机框图

    注意 `I/O` 框是输入输出子系统或芯片。`BIOS` 或 `UEFI` 包含计算机初始启动代码。内存是短期易性存储，硬盘是长期永久存储。粗竖线是代表 `bus/chipset`
    的经典符号。更多信息可以在书末的“定义”部分找到。


