    Another HP Elitebook laptop that I recently purchased on ebay for $182 is the
    8440p core i5 laptop with 4 Gigabytes of memory. It looks like the HP 2530p but
    is larger and heavier with a 14 inch display. The 8440p Elitebook performance
    is very good, but it is significantly better with an `SSD` instead of a mechanical
    hard drive. It took more than 35 seconds to boot with the mechanical hard drive
    and about 17 seconds with the `SSD`, making it twice as fast with the `SSD`.


    The HP Elitebook series computers are especially good used buys because they were
    built for business road warriors and they can take a lot of punishment.


    ### HP Elitebook 2530p Photo


    ### Buy New or Refurbished

    Getting a good deal on a computer is not limited to used computers. There are
    many good deals on new or refurbished computers. Getting a good price on a new
    computer may be as easy as buying last years model or as difficult as searching
    for a model that just is not popular because it is not the latest whiz bang, ultrabook,
    pixel, computer in your choice of sixteen fashionable colors. Computers are not
    fashion accessories! If you want a fashion accessory computer, it may come at
    a premium price, and may not even meet your technical needs. Computers are tools
    or appliances like toasters, radios, coffee makers and the like. If you want a
    fashion accessory, buy some new shoes or a new leather jacket. We cannot save
    money on computers if we want to buy the slimmest, whiz-bang, leading edge computer.


    ### Deals on Laptops

    Here are some new computer deals that I found. I recently purchased a new HP 430
    g1 Probook core i3 from Tiger Direct for $499 and it came with a choice of some
    other operating systems. I just said no to the other OS options and installed
    `Linux` (`Ubuntu 14.04 Unity`) and it has exceeded my expectations. (Wait, checking
    text: `installed Linux ( (Ubuntu 14.04 Unity)`) and it has exceeded my expectations.
    I am using it right now to type this document, it boots from complete power off
    in eleven seconds, it has performed flawlessly, it is very quiet, it has a solid
    state drive (`SSD`) and a slot for a mobile broadband card. I have searched for
    a similar computer and the HP is priced lower than any competitor. The HP Probook
    is also available with a core i5 or core i7 cpu but that is overkill unless you
    plan on playing some intense games on the computer. I would also not recommend
    getting a core i7 cpu in a laptop computer because I think it is a recipe for
    failure. I don''t think that a laptop cooling system is adequate enough to dissipate
    the heat that may be generated by a core i7 cpu, but that is just my own educated
    opinion.


    ### HP Probook 430 g1 Photo

    The other new laptop that I purchased recently is an HP 11 Chromebook for only
    $199\. This is a great computer for surfing the web and working with `Google Docs`.
    This may be all many people need. There are many `Chromebooks` near this price
    point, so there are many choices. The `Chromebook` starts instantly, has a very
    bright screen, good audio and is slim and light. Think ultrabook for a thousand
    dollar discount. Of course, the `Chromebook` is not equivalent to the ultrabook
    in functionality, but it is similar in looks, size and weight. Think about how
    many boots or leather jackets or motorcycle accessories that you could buy with
    the thousand dollars that you saved!


    If you hate computers, stop reading this book now and buy a `Chromebook` for $199
    or less. If you know how to use a web browser, then you will find the `Chromebook`
    very easy to use. A photo of a `Chromebook` is on the next page.


    ### Hp 11 Chromebook Photo


    ### Deals on Tablets

    Last year I purchased an `Android Nexus 7` tablet for about $200, which was discounted
    about $100 because it was last years model, from Newegg. I am very happy with
    the `Android` tablet, it has performed perfectly, has survived numerous drops,
    and it has numerous gouges in the metal frame to prove the point that it is very
    rugged. I saved a few hundred or more of my dollars when compared to the price
    of an `iPad`.


    ### Nexus 7 Tablet Photo


    ### Deals on Desktops

    I recently purchased an `ASUS CN60 Chromebox` for $149 and attached it to a 27"
    computer monitor so I could watch `Netflix` films and `Amazon Instant Videos`.
    The `Chromebox` has built in wifi, four `USB 3.0` ports, an `HDMI` video port
    and a `DisplayPort`. There is also an `SD` card slot for additional storage capacity.
    The `Chromebox` was easy to attach to the back of the monitor, power on and setup.
    Among all of the computers that I have owned, the `Chromebox` with `ChromeOS`
    is the easiest computer system to set up and use.


    ### Chromebox attached to monitor


    ### Refurbished Computers

    The final strategy for saving money on computers is to buy a refurbished model.
    Many "refurbished" computers have the same warranty as a new model and may be
    "open box" computers that customers have returned because it did not suit their
    needs for some reason. Refurbished computers are available on ebay, amazon, Tiger
    Direct, Newegg, Microcenter and some local retailers. You will easily save between
    ten and twenty percent or more compared to the cost of a new model. Get one of
    your geek friends to help you choose a computer if you don''t want to do it yourself.


    ### 3 - Linux Background Information


    #### GNU/Linux

    One of the best features of `Linux` distributions is that they are free open source
    `GNU/Linux` software. This means that the software may be freely used, copied,
    modified and redistributed. Open source software is developed, maintained and
    distributed by a worldwide community of people. The software is owned by the community
    and the development process is transparent. This makes for more stable and reliable
    code that is practically malware free, easy to install and easy to use.


    `GNU` is a set of Unix like programs which provide basic functionality for the
    `Linux` system. Linux Linux would not exist without the `GNU` tools and applications.
    This is why some people refer to the `GNU/Linux` operating system as opposed to
    just `Linux`. `GNU` is an acronym for *GNU''s Not Unix*. `GNU` is a FOSS (Free
    Open Software) implementation of basic Unix programs.


    `GNU/Linux` has been under development for twenty years and is a very mature operating
    system. The `Linux` kernel was designed by `Linus Torvalds` in 1991\. The `GNU`
    system was designed by Richard Stallman. `GNU/Linux` is now maintained by The
    Free Software Foundation. The design of `GNU/Linux` is based on `Unix` which was
    created by AT&T Bell Labs starting in 1969\. So the heritage of `GNU/Linux` spans
    more than forty years.


    ### The Linux Command Line

    There are about 10,000 `Linux` commands, so if my cat walked across the keyboard,
    it would probably type a `Linux` command. Here is a simple example of how useful
    the command line could be. What if I wanted to know what day of the week July
    4, 1776 fell on. It would take over 200 mouse clicks using a calendar gui or I
    could simply type `cal jul 1776` on the command line. There are many other cases
    where typing a simple command is much easier than spending several minutes fighting
    with a gui. The `cal jul 1776` command result is shown in the following screenshot.


    **cal command**


    **About this book**

    '
