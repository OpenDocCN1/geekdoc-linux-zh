  trans: '

    机械硬盘的速度明显慢于固态硬盘（SSD）。如今的许多电脑（如 MacBook Air 和其他超薄笔记本电脑）都配备了固态硬盘。一种总能带来性能提升的升级方案是将机械硬盘更换为固态硬盘。除非你正在玩某些激烈的游戏，否则你不需要最快的主板和处理器或
    8 Gb 内存。大多数用户使用酷 i3 处理器、2 Gb 内存和 128 Gb 固态硬盘就能运行得很好。Linux 所需的内存不像其他操作系统那样那么多，因此大多数用户不需要超过
    2 Gb 的内存。


    ## 管理你的计算机


    某些操作系统或应用程序程序正在不断地访问计算机硬盘。如果你的硬盘指示灯一直亮着，那么情况就是这样。这会缩短你硬盘的寿命，即使是固态硬盘也是如此。你应该尝试找到导致这个问题的原因，或者在你的电脑上安装另一个操作系统。硬盘抖动（thrashing）可能是计算机内存不足的指示，因此增加内存可能会解决问题。我的
    Linux 电脑上的硬盘灯很少亮，但偶尔会闪烁。使用 Linux 时，硬盘的寿命会长得多，从而为你节省精力和金钱。在网上搜索“thrashing hard
    drive”，你会发现很多例子。


    你的笔记本电脑有用户可以更换的电池和硬盘吗？如果没有，更换电池可能花费高达 300 美元，更换硬盘可能花费同样甚至更多。市面上有很多笔记本电脑，其电池仅需
    10 美元即可更换，硬盘也可以在 100 美元以下更换。如果你想在维护上节省费用，这些是购买任何笔记本电脑时都是重要的考虑因素。


    如果不使用电脑，你应该关闭电源。对于笔记本电脑来说尤其如此，无论安装了什么操作系统，因为笔记本电脑很容易过热。某些笔记本电脑没有足够的空间或风扇功率来让它们充分冷却。让电脑
    24/7 全天运行除了缩短电脑寿命外毫无用处。在不用时关闭电源，它的寿命会更长。使用屏幕保护程序也可能导致笔记本电脑过热，而且这是对电力的浪费。


    今天几乎所有个人电子设备使用的锂离子电池如果持续充电，其使用寿命会长得多；如果电量低于 40%，其寿命就会缩短。忽略任何关于完全放电锂离子电池的建议或指示。那是错误的，会缩短你电池的寿命。不要让你的锂离子电池电量低于
    40%。


    ## 关于 Linux


    Linux 的开发始于 1969 年，当时 AT&T 实验室创建了 `Unix` 操作系统。Linux 由 Linus Torvalds 于 1991 年创建，基于
    Unix。Unix 的设计可以在几乎任何计算机上运行，并拥有任何现代操作系统中最好的架构。有关 Unix 和 Linux 的更多详细信息，请尝试访问维基百科或
    Linux 基金。这本书只是对 Linux 的快速介绍，不会深入探讨该操作系统的许多细节。


    Linux 拥有现代化的桌面，并拥有现代应用程序，这些软件的功能与其他任何软件一样强大且易于使用。事实上，现代 Linux 比某些其他流行的操作系统更容易使用。Linux
    拥有文字处理、电子表格、数据库和幻灯片软件，而且它们都是免费使用、免费自定义和免费更新的。唯一的缺点是许多电脑上没有预装 Linux，而且它的文档并不完善。所以，如果你不想自己动手，就找一个极客朋友帮你安装吧。她会乐意为了一个微笑、一杯咖啡、一块蛋糕或一杯酒而为此努力。在她安装
    Linux 期间，请她检查硬盘和电池，并在必要时更换它们。


    Linux 出现在设备比任何其他操作系统都多。Linux 驱动着从手表到国际空间站的一切设备。它出现在你的汽车、电视、烤面包机、收音机，甚至可能出现在你的冰箱里。Linux
    驱动着世界上 98% 的超级计算机，出现在海军潜艇、空军无人机、每部 Android 手机和平图中，它驱动互联网上的服务器，被 Google、HP、IBM、Intel、Oracle、纽约证券交易所及众多组织使用。每年使用
    Linux 的人数和组织越来越多，它代表了计算的未来。


    ## Linux 操作系统


    有许多流行的 Linux 版本，包括 Android、ChromeOS、Ubuntu 以及许多 Ubuntu 衍生体。Linux 几乎可以完成其他电脑能做的一切，而且成本低得多。此外，Linux
    还能做其他操作系统无法做的事情。我喜欢 Linux 是因为与定期升级昂贵的操作系统或购买昂贵的超薄本相比，它可以帮省钱，而且 Linux 具有高度定制性。


    Linux 桌面操作系统被称为 `distributions`（发行版）。一个 Linux `distribution` 由 Linux 内核（操作系统的核心）与独特的桌面以及独特的应用程序软件组合打包在一起。下一页的插图显示了
    `kernel`（内核）在 Linux 发行版中的位置。


    ## Linux 系统：Linux 发行版


    上一段中的这句话值得在这里重复一遍。一个 Linux `distribution` 由 Linux 内核与独特的桌面以及独特的应用程序软件组合打包在一起。


    使用哪种 Linux 发行版取决于个人喜好。喜欢 MacOS 的人可能更喜欢 Ubuntu Unity、elementary OS 或 LXLE。喜欢 Windows
    的人可能喜欢 Lubuntu、Peppermint 或 Ubuntu Gnome。我为这些 Linux 发行版中的每一个都创建了用户手册。所有的 Linux
    发行版都可以免费尝试。


    这些发行版的 LTS（长期支持）版本提供五年的支持，是最适合安装的发行。Ubuntu LTS 版本每两年发布一次，最近的版本是 12.04 和 14.04，分别于
    2012 年 4 月和 2014 年 4 月发布。过渡性发行版如 12.10、13.04 和 13.10 可能只支持约九个月，通常没有 LTS 版本那么稳定。下一个
    Ubuntu LTS 版本应该是 16.04，可能在 2016 年 4 月发布。


    Android 是由 Google 设计的平板电脑操作系统，ChromeOS 是由 Google 设计的笔记本操作系统。这两个操作系统都使用 Linux 内核。


    ##更多关于 Linux 发行版


    有超过 600 种被称为 `distributions` 的 Linux 版本。每个 Linux 发行版都有不同的目的和功能。最流行的 Linux 发行版是
    `Linux Mint` 和 `Ubuntu`。有很多基于 Ubuntu 的发行版，其中一些是 `Ubuntu Unity, Ubuntu Gnome, Lubuntu,
    Xubuntu, elementaryOS, LXLE 和 Peppermint`。


    每个发行版都有定期向公众提供的 `versions or releases`（版本或发布版）。许多发布版本以发布日期标识，例如 14.04 代表 2014
    年 4 月的版本。某些版本仅有一个数字，如 `Linux Mint 17` 或 `Peppermint 5`。最后，某些版本是 `LTS, Long Term
    Support`（长期支持），可能会支持三到五年。对于任何 Linux 发行版来说，最好的选择都是 `LTS` 版本，它的支持时间比其他定期发布的版本更长。

