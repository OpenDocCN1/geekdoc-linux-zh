- fmt: '

    The easiest Linux distributions to install and use, in my opinion, are Linux Mint
    and elementary OS followed by, Ubuntu Unity, Lubuntu, LXLE and Peppermint. LXLE
    and Linux Mint have a Windows like desktop and menu system and Ubuntu Unity has
    a Mac like desktop and menu system. Lubuntu, LXLE and Peppermint, because they
    are lightweight distributions, will run at blazing speed on older computers, and
    they both have a simple menu system which is similar to Windows.


    ## Linux Distributions and Hardware Requirements


    Linux Mint and Ubuntu are designed to run on relatively modern computers with
    faster processors. They require at least a `Core 2 Duo` processor, about 1 Gb
    of ram, and 8 Gb of hard drive space. However, I would recommend using Ubuntu
    Unity and Linux Mint on at least a core i3 computer for better performance. Lighter
    weight distributions like `Lubuntu` and `Peppermint` will run on relatively older
    processors and may only require 512 mb of memory. However, 1 Gb of memory is recommended.
    The lighter weight distributions will run exceptionally fast on computers that
    formerly had Windows XP installed. The lighter weight distros like Lubuntu and
    Peppermint are highly customizable where Mint and Ubuntu are not as easily customized.


    Several customized Linux desktops are shown on the following pages including `Ubuntu
    Unity, Lubuntu, elementary OS and Peppermint`.


    ### Customized Ubuntu Unity Desktop


    If you like MacOs, then you will like Ubuntu Unity. Ubuntu has a "dock," which
    is known as the "launcher," on the left side of the display instead of the bottom
    of the screen. You can put all of your favorite applications on the launcher so
    that they may be launched with one quick click.


    ### Customized Lubuntu Desktop


    If you are used to Windows, then you will like Lubuntu. Lubuntu has a Start button
    and menus which are similar to Windows. Lubuntu is highly customizable so you
    may add custom applications to the menus and add custom keyboard shortcuts. Note
    the penguin Start button on the far left side of the panel. Tux the penguin, which
    is the Linux logo and mascot, was created by Larry Ewing.


    ### elementary OS Desktop


    If you like MacOs, then you will like eOS. The eOS has a dock, on the bottom of
    the display. You can put all of your favorite applications on the dock so that
    they may be launched with one quick click. The eOS has a very simple and easy
    to use desktop. Additional information about eOS may be found in my book "elementary
    OS User Manual Freya Beta 2" in the kindle book store.


    ### Customized Peppermint 5 Desktop


    Peppermint has a menu system and desktop that is similar to the Lubuntu menus
    and desktop. However, Peppermint allows users to add web sites to their menus,
    which allow direct access to desired web locations through a `site specific browser`,
    also known as a `SSB`. Peppermint, like Lubuntu, is also highly customizable.
    Note the custom touchpad controls on the right side of the panel.


    Additional information about the Ubuntu, Lubuntu and Peppermint distributions
    may be found at `weidmanenterprises.com`


    ## About ChromeOS


    ChromeOS is a cloud based operating system with a Linux kernel designed and supported
    by Google. It uses the Chrome web browser to access Google Docs and Google Drive.
    You may also work offline with Google Docs or Google Drive. Some application software
    is available for ChromeOS, but not much at this time. If you spend most of your
    time using the web and checking email, then a Chromebook might be the cheapest
    and best computer for you. Chromebook prices range from about $179 to $300 new
    and they come with 100 Gb of storage space on Google Drive for two years. If you
    can use a web browser, but find other facets of computing difficult, stop reading
    this book now and buy a $199 Chromebook. You will be able to view Netflix films
    and Amazon Instant Videos with your ChromeOS computer. More information about
    ChromeOS may be found online and on Wikipedia.


    ### ChromeOS Desktop


    ## About Android


    Android is a Linux based operating system developed and supported by Google for
    tablets and cell phones. It uses a touch interface and it has as many applications
    in the Google Play Store as Apple has for the iPad. More android devices are being
    sold today than any other mobile devices. Android tablets are priced from about
    $100 to about $500\. Android phones may also be found for $100 without a contract.
    More information about Android may be found online and on Wikipedia. You will
    be able to view Netflix films with your Android device.


    ### Android Desktop


    ## 2 - Save Money on Computers


    ### Buy or Repurpose Used Computers


    I have purchased numerous used computers on eBay for about $100 and installed
    Linux on them giving me a savings of anywhere from several hundred to over a thousand
    dollars. You may already have an older laptop that runs XP or 7 very slowly. It
    is the perfect candidate for Linux. Your slow Windows laptop will run Linux at
    unbelievable speed. Linux may also be installed on old Apple computers but it
    is very difficult and I would not recommend it unless you are already a Linux
    expert. So you might spend $100 or $0 on a used laptop and install Linux on it.
    Did I mention that Linux is free? If you are not comfortable with purchasing a
    used computer on ebay, find a local computer shop or buy from well known retailers
    like amazon, Microcenter, Tiger Direct, or Newegg. You may also enlist the help
    of one of your geek friends to choose a used computer and install Linux on it.
    She will be very happy to help you choose a computer and a Linux distribution
    that suits your needs.


    The Dell Latitude series and the HP Elitebook series computers are especially
    good used buys because they were built for business road warriors and they can
    take a lot of punishment.


    #### Used Dell Computers


    Two used computers that I purchased recently are a Dell E5410 and a Dell E4200
    for about $100 each. There are numerous deals like this on ebay, Microcenter,
    Newegg, amazon and other local or online retailers. If there are problems with
    the computer, I am only out $100\. However, Dell computers like this one make
    it very easy to replace batteries or hard drives and a new battery and hard drive
    for either of these computers would cost less than $100 on ebay.


    The Dell Latitude series computers are especially good used buys because they
    were built for business road warriors and they can take a lot of punishment.


    The photo here is a Dell E5410, core i3 running Ubuntu 14.04 Unity Linux, that
    I purchased on ebay for about $100\. The E5410 is a very rugged, heavy, 14" business
    computer. The E5410 with the core i3 processor is very fast.


    **DELL E5410 Photo**


    #### DELL E4200 Photo


    The photo here is a Dell E4200 with an Intel Core 2 Duo U9600 1.6 GHz cpu running
    Ubuntu Unity, that I purchased on ebay for about $100\. The E4200 is a lightweight
    12" personal computer with a backlit keyboard. The E4200 boots Ubuntu Unity in
    just 17 seconds and application software launches instantly. This performance
    is achieved because the E4200 has a solid state drive which is much faster than
    conventional hard drives.


    **DELL E4200 Photo**


    #### Used HP Computers


    It is worth repeating everything that I mentioned about the Dell Latitude computers
    here because it also applies to the HP Elitebook series. A used computer that
    I purchased recently is a HP Elitebook 2530p for about $100\. There are numerous
    deals like this on ebay, Microcenter, Newegg, amazon and other local or online
    retailers. If there are problems with the computer, I am only out $100\. HP computers
    like this one make it very easy to replace batteries or hard drives and a new
    battery and hard drive for this computer would cost less than $100 on ebay.

