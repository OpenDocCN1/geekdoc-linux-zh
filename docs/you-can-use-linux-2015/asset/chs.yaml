  ### 本书指南


  ### 关于作者

  我在计算机硬件/软件设计与开发方面拥有四十五年的经验，此外还有大学的文凭，因此我的观点是基于经验和教育的。然而，多年的经验比任何大学学位更有价值。我还参加过 52
  周的海军电子设备学校，并在海军中担任了多年的电子技术员。我的爱好之一是购买旧电脑并对其进行升级、维修和评估。如果你认识比我更有经验的人，请现在停止阅读本书，向你那位更有经验的朋友寻求建议。本书是面向普通用户的，而不是面向那些需要最新
  `cpu`、数 GB 内存、最快主板和曲速硬盘的高级用户。如果你是高级用户，请现在停止阅读本书。


