  ## 3 - Linux 基础信息


  ### GNU/Linux

  `Linux` 发行版最好的特性之一是它们是免费开源的 `GNU/Linux` 软件。这意味着软件可以自由使用、复制、修改和重新分发。开源软件由全球范围社区开发、维护和分发。软件归社区所有，开发过程是透明的。这使得代码更加稳定可靠，几乎没有恶意软件，且易于安装、易于使用。


  `GNU` 是一组类 Unix 的程序，为 `Linux` 系统提供基本功能。没有 `GNU` 工具和应用程序，Linux 就不存在。这就是为什么有些人将操作系统称为
  `GNU/Linux` 而不仅仅称为 `Linux`。`GNU` 是 *GNU''s Not Unix*（GNU 不是 Unix）的缩写。`GNU` 是基本 Unix
  程序的 FOSS（自由开源软件）实现。


  `GNU/Linux` 已开发了二十年，是一个非常成熟的操作系统。`Linux` 内核由 `Linus Torvalds` 于 1991 年设计。`GNU` 系统由
  Richard Stallman 设计。`GNU/Linux` 现在由自由软件基金会维护。`GNU/Linux` 的设计基于 `Unix`，后者由 AT&T 贝尔实验室从
  1969 年开始创建。因此，`GNU/Linux` 的历史跨越了四十。


