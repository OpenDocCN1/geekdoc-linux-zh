  ## 关于 Android


  Android 是由 Google 开发并支持的基于 Linux 的平板电脑和手机操作系统。它使用触摸界面，并拥有大量的应用程序。




  我最近在 ebay 上花 182 美元购买了另一台 HP Elitebook 笔记本，这是一台配备 4GB 内存的 8440p  i5 笔记本。它看起来像 HP
  2530p，但更大、更重，拥有 14 英寸显示。8440p Elitebook 的性能非常好，但如果使用 `SSD` 而不是机械硬盘，性能会显著提升。使用机械硬盘启动需要
  35 秒以上，而使用 `SSD` 仅需约 17 秒，这意味着 `SSD` 的速度快了一倍。


  HP Elitebook 系列电脑是非常出色的二手选择，因为它们是为商务出差人士设计的，能够承受剧烈的磨损。


