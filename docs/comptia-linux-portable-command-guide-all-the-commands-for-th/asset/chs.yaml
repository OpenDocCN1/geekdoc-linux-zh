  \n#### GRUB\n\nGRand Unified Bootloader 也称为 Legacy GRUB，是一种较旧的引导程序，在现代 Linux 系统上很少使用。考试中的大多数配置文件和命令都关注\
  \ GRUB2，它是 GRUB 的改进版本。更多详情请参阅接下来的 `GRUB2`小节。\n\n#### GRUB2\n\nGRUB2 设计用于替代 Legacy\
  \ GRUB。两者之间有几处变化，包括以下内容：\n\n* 不同的配置文件。\n* GRUB2 支持更多启动设备，包括 LVM（逻辑卷管理）和软件 RAID 设备。\n\
  * GRUB2 支持 UEFI 和 EFI。更多详情请参阅本章的 `UEFI/EFI`小节。\n\n启动选项\n\nGRUB2 设计用于替代 Legacy GRUB。两者之间有几处变化，包括以下内容：\n\
  \n* 不同的配置文件。\n* GRUB2 支持更多启动设备，包括 LVM（逻辑卷管理）和软件 RAID 设备。\n* GRUB2 支持 UEFI 和 EFI。更多详情请参阅本章的\
  \ `UEFI/EFI`小节。\n\n预计考试题将关注 GRUB2，因为 Legacy GRUB 很少使用。\n\n\n\n\n\n有多个 Live Linux\
  \ 发行版允许你直接从 CD 或 DVD 启动。这种技术被称为“从 ISO 启动”，因为在这些介质上存储操作系统的文件格式被称为 ISO 镜像。\n\n以下是从\
  \ ISO 启动的几个优点和原因：\n\n*   系统可能是一个没有硬盘的轻量级客户端（thin client）。\n*   从基于安全的 ISO 镜像启动对于解决宿主机操作系统上的问题（病毒、蠕虫或其他安全完整性破坏）非常有帮助。\n\
  *   某些 Live Linux 发行版可以通过启动宿主机操作系统来修复问题。\n*   ISO 也可以用于在系统上安装新的发行版。\n\n在大多数情况下，从\
  \ ISO 镜像启动需要指示 BIOS/UEFI/EFI 从包含 ISO 介质的驱动器启动。不过，也可以配置 `GRUB` 同样从 ISO 介质启动（尽管这种情况很少见）。\n\
  \n## 从 HTTP/FTP 启动\n\n从 HTTP 或 FTP 启动几乎完全是为了从安装服务器进行安装。这种介质通常是“只读的”，这意味着它无法提供一种良好的方法来提供实时文件系统，以便可以在其中同时读取和写入数据。\n\
  \n### 文件位置\n\n本节重点介绍旧版 `GRUB` 和 `GRUB2` 配置数据存储的文件和目录。\n\n### /etc/default/grub\n\
  \n`GRUB` 2 通过编辑 `/etc/default/grub` 文件或 `/etc/grub.d` 目录下的文件进行配置。`/etc/grub.d` 目录中的文件是“高级文件”，超出了本书的范围。这些文件通常由软件开发者创建，并作为软件包安装的一部分插入该目录。\n\
  \n这里是一个典型的 `/etc/default/grub` 文件的示例：\n\n点击此处查看代码图像\n\n```\n[root@localhost ~] cat\
  \ /boot/grub/grub.conf\nGRUB_TIMEOUT=5\nGRUB_DEFAULT=saved\nGRUB_TERMINAL_OUTPUT=\"\
  console\"\nGRUB_CMDLINE_LINUX=\"crashkernel=auto rhgb quiet\"\n```\n\n图 1.4 描述了\
  \ `/etc/default/grub` 文件的典型设置。\n\n![图中显示了 \"/etc./default/grub\" 组件的典型设置。](img/01fig04.jpg)\n\
  \n**图 1.4** `/etc/default/grub` 组件\n\n### /etc/grub2.cfg\n\n`GRUB2` 的主要配置文件是 `/boot/grub2/grub.cfg`。此文件永远不应直接编辑，因为它是由\
  \ `grub2-mkconfig` 命令创建的（更多详情请参见本章中的“grub2-mkconfig”小节）。\n\n`/etc/grub2.cfg` 文件只是指向\
  \ `/boot/grub2/grub.cfg` 文件的符号链接。\n\n### /boot\n\n`/boot` 目录是启动文件所在的位置。它包括：\n\n\
  *   内核文件（例如 `vmlinuz-4.17.8-200.fc32.x86_64`）\n*   `initramfs` 文件（例如 `initramfs-4.17.8-200.fc32.x86_64.img`）\n\
  *   `grub2` 目录，其中存放 `GRUB2` 配置文件。\n\n### /boot/grub\n\n`/boot/grub` 目录是传统的 `GRUB`\
  \ 配置文件的位置。\n\n### /boot/grub2\n\n`/boot/grub2` 目录是 `GRUB2` 配置文件的位置。\n\n### /boot/efi\n\
  \n在利用 UEFI 的系统中，`/boot/efi` 目录是 `GRUB` 配置文件的位置。\n\n### 启动模块和文件\n\n内核模块是为内核提供更多功能的小代码。有关内核模块以及如何在已启动的系统中使用它们的更多详情，请参阅第\
  \ 2 章“在给定场景下，安装、配置和监控内核模块](#ch02.xhtml_ch02)”。\n\n通常情况下，在启动过程中需要这些内核模块。例如，内核默认并并不知道如何读取\
  \ LVM（逻辑卷管理）卷，因此如果关键文件系统位于 LVM 卷上，可能需要一个提供该功能的内核模块来正确启动系统。\n\n本节重点介绍如何在启动过程中为内核提供必要的模块。\n\
  \n#### 命令\n\n本小节重点介绍你需要了解的用于管理启动过程中所需的内核模块的命令。\n\n#### mkinitrd\n\n此 `initramfs`\
  \ 文件由 `mkinitrd` 命令创建，该命令反过来调用 `dracut` 工具：\n\n点击此处查看代码图像\n\n```\n[root@localhost\
  \ ~]# mkinitrd /boot/initramfs-2.6.32.68.x86_64.img\n  2.6.32.68\n```\n\n`mkinitrd`\
  \ 命令的第一个参数是你想要创建的 `initramfs` 文件名。第二个参数是内核版本。\n\n注意，你很少直接使用 `dracut` 实用；但它被列为考试目标，因此请注意\
  \ `mkinitrd` 会在后台执行 `dracut` 命令。\n\n注意，如果你在基于 Debian 的系统上工作，则使用 `mkinitramfs` 命令代替\
  \ `mkinitrd` 命令。\n\n#### dracut\n\n参见本章中的“mkinitrd”小节。\n\n#### grub2-install\n\n\
  通常引导加载程序是在启动过程中安装的，但引导加载程序可能会损坏并需要重新安装。要安装引导加载程序，执行 `grub-install` 命令并提供你想要安装 `GRUB`\
  \ 的设备。例如，以下命令将 `GRUB` 安装在第一个 SATA 硬盘上：\n\n点击此处查看代码图像\n\n```\n[root@localhost ~]#\
  \ grub2-install /dev/sda\n```\n\n#### grub2-mkconfig\n\n`grub2-mkconfig` 仅用于 `GRUB2`，它将从\
  \ `/etc` 目录下的可编辑文件生成 `GRUB2` 配置文件。此命令将 `/etc/default/grub` 文件和 `/etc/grub.d` 目录下的文件转换为\
  \ `GRUB2` 配置文件（`/boot/grub/grub.cfg` 或 `/boot/grub/menu.lst`）。\n\n图 1.5 提供了一个视觉示例。\n\
  \n![图中，命令“etc./default/grub/etc./grub.d/*”用于编辑文件，“grub-mkconfig”用于执行此命令，“boot/grub/grub.cfg/boot/grub/menu.1st”用于生成文件之一。](img/01fig05.jpg)\n\
  \n**图 1.5** `grub-mkconfig` 命令\n\n注意\n\n在某些系统中，命令名称为 `grub-mkconfig`。\n\n#### initramfs\n\
  \n此文件包含启动所需的内核模块的微型根系统。它位于 `/boot` 文件系统中，每个内核都有唯一的 `initramfs` 文件。`initramfs` 文件由\
  \ `mkinitrd` 命令创建（更多信息请参见本章的小节）。\n\n#### vmlinuz\n\n`vmlinuz` 文件存储在 `/boot` 目录中。每个版本的内核都有不同的\
  \ `vmlinuz` 文件，名称通常包含内核版本。以下是一个示例：\n\n点击此处查看代码图像\n\n```\nvmlinuz-4.17.8-200.fc32.x86_64\n\
  ```\n\n与 `vmlinux` 文件不同，`vmlinuz` 文件是内核的压缩版本。\n\n#### vmlinux\n\n`vmlinux` 文件指的是内核本身，采用“静态链接可执行文件格式”。此文件通常不是管理员查看或修改的文件。通常此文件用于构建\
  \ `vmlinuz` 文件，即 `vmlinux` 文件的压缩版本。\n\n### 内核恐（Kernel Panic）\n\n当内核出现问题导致系统崩溃时，就会发生内核恐。通常当发生发生时，数据会使用\
  \ `kdump` 功能存储。内核专家可以查看这些数据以确定崩溃的原因。\n\n\n\n\n\n* rmmod\n* depmod\n\n### 位置\n\n\
  * [/usr/lib/modules/[kernelversion]](#ch02.xhtml_ch02lev2sec8)\n* /usr/lib/modules\n\
  * /etc/modprobe.conf\n* /etc/modprobe.d/\n\n#### 命令\n\n本节涵盖了与管理 Linux 系统上模块相关的命令。模块是存储在文件中的代码，允许内核执行特定任务。模块可以提供如网络功能或处理特定类型文件系统的能力。\n\
  \n### lsmod\n\n`lsmod` 命令显示加载到内存中的内核模块。\n\n语法：\n\n```\nlsmod\n```\n\n`lsmod` 命令的输出：\n\
  \n每行描述一个模块。每行包含三列信息：\n\n* 模块名称。\n* 模块的大小（字节）。\n* 使用该模块的“实体”。“实体”可以是文件系统、进程或另一个模块。如果另一个模块正在使用此模块，则会列出依赖模块的名称。否则，将提供指示有多少个“实体”使用该模块的数值。\n\
  \n示例：\n\n点击此处查看代码图像\n\n```\n[root@OCS ~]# lsmod | head\nModule                 \
  \         Size       Used by\ntcp_lp                          12663      0\nbnep\
  \                            19704      2\nbluetooth                       372944\
  \     5     bnep\nrfkill                          26536      3     bluetooth\nfuse\
  \                            87741      3\nxt_CHECKSUM                     12549\
  \      1\nipt_MASQUERADE                  12678      3\nnf_nat_masquerade_ipv4 \
  \         13412      1     ipt_MASQUERADE\ntun                             27141\
  \      1\n```\n\n### insmod\n\n`insmod` 命令用于向当前运行的内核添加模块。\n\n语法：\n\n```\ninsmod\
  \ [module_name]\n```\n\n需要指定模块的精确位置。例如：\n\n点击此处查看代码图像\n\n```\n[root@OCS ~]# lsmod\
  \ | grep fat\n[root@OCS ~]# insmod /usr/lib/modules/3.19.8-100.fc20.x86_64/kernel/fs/\n\
  \  fat.ko\n[root@OCS ~]# lsmod | grep fat\nfat                    65107  0\n```\n\
  \n`insmod` 命令没有选项；但每个模块可能可以通过以下语法将模块传递到模块中：\n\n```\ninsmod module options\n```\n\
  \n`insmod` 命令有两个缺点：\n\n* 你必须知道模块的精确位置。\n* 如果模块有任何依赖关系（即需要另一个模块的模块），则加载将失败。\n\n###\
  \ modprobe\n\n`modprobe` 命令用于从当前运行的内核中添加和删除模块。注意，它还会尝试加载模块依赖项。\n\n语法：\n\n点击此处查看代码图像\n\
  \n```\nmodprobe [options] [module_name]\n```\n\n当用于删除模块（使用 `-r` 选项）时，`modprobe`\
  \ 命令也会删除依赖模块，除非它们正被子系统的其他部分（例如内核或进程）使用。\n\n`modprobe` 命令的关键选项：\n\n* `-c` 显示当前的 `modprobe`\
  \ 配置。\n* `-q` 使 `modprobe` 在静音模式下运行。\n* `-R` 显示所有与别名匹配的模块，帮助你调试问题。\n* `-r` 从内存中移除指定的模块。\n\
  * `-v` 显示详细信息；这有助于确定 `modprobe` 如何执行任务。\n\n### modinfo\n\n`modinfo` 命令用于提供有关模块的详细信息。\n\
  \n语法：\n\n```\nmodinfo [module_name]\n```\n\n示例：\n\n点击此处查看代码图像\n\n```\n[root@OCS\
  \ ~]# modinfo xen_wdt\nfilename:        /lib/modules/3.19.8-100.fc20.x86_64/kernel/drivers/\n\
  watchdog/xen_wdt.ko\nlicense:         GPL\nversion:         0.01\ndescription: \
  \    Xen WatchDog Timer Driver\nauthor:          Jan Beulich <jbeulich@novell.com>\n\
  srcversion:      D13298694740A00FF311BD0\ndepends:\nintree:          Y\nvermagic:\
