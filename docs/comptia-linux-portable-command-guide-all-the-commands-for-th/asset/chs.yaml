  \n### ls -Z\n\n每个进程都在安全上下文中运行。要查看此，请使用 `ps` 命令的 `-Z` 选项（此处使用 `head` 命令仅是为了限制命令输出）：\n\
  \n点击此处查看代码图像\n\n```\nroot@OCS:~# ps -fe | grep httpd | head -2\nsystem_u:system_r:httpd_t:s0\
  \ root   1109    1  0   2018 ?\n  00:51:56 /usr/sbin/httpd\nsystem_u:system_r:httpd_t:s0\
  \ apache 1412 1109  0 Dec24 ?\n  00:00:09 /usr/sbin/httpd\n```\n\n安全上下文 (`system_u:system_r:httpd_t:s0`)\
  \ 是复杂的，但对于理解 SELinux 基础知识，重要的部分是 `httpd_t`，它类似于安全组或域。作为此安全域的一部分，`/usr/sbin/httpd`\
  \ 进程只能访问安全策略允许 `httpd_t` 访问的文件。该策略通常由 SELinux 专家编写，该专家应该对于哪些进程可以访问系统上的特定文件和目录拥有丰富的经验。\n\
  \n文件和目录也有由策略定义的 SELinux 安全上下文。要查看特定文件的安全上下文，请使用 `ls` 命令的 `-Z` 选项。\n\n\n\n\n\n权限提升的核心概念是，用户可能需要能够使用比其用户账户拥有权限的账户来执行命令。例如，普通用户可能需要执行一个需要\
  \ root 用户访问权限的命令。有几种技术可以提供权限访问；本小节涵盖了考试可能涉及的技术。\n\n#### su\n`su` 命令允许用户切换用户账户：\n\
  \n点击此处查看代码图像\n\n```\n[student@OCS ~]# id\nuid=1000(student) gid=1000(student) groups=1000(student)\n\
  context=unconfined_u:unconfined_r:unconfined_t:s0-s0:c0.c1023\n[student@localhost\
  \ ~]# su root\nPassword:\n[root@OCS ~]# id\nuid=0(root) gid=0(root) groups=0(root)\n\
  context=unconfined_u:unconfined_r:unconfined_t:s0-s0:c0.c1023\n```\n\n在执行 `su` 命令时，有一个允许的选项：`-`\
  \ 选项。当你使用 `-` 字符执行 `su` 命令时，将提供一个新的登录 shell（login shell）。当你不使用 `-` 字符时，提供的将是非登录\
  \ shell（non-login shell）。\n\n#### sudo\n经过管理员正确配置，用户可以使用 `sudo` 命令以其他用户（通常是 root\
  \ 用户）身份运行命令。要以 root 身份执行命令，请输入：\n\n```\nsudo command\n```\n\n系统会提示输入自己的密码，如果 `/etc/sudoers`\
  \ 文件中的设置正确，命令将正确执行。如果设置 get，将显示错误消息。\n\n下表描述了 `sudo` 命令的常用选项：\n\n| 选项 | 描述 |\n|\
  \ --- | --- |\n| `-b` | 在后台运行命令。 |\n| `-e` | 像 `sudoedit` 命令一样运行。参见本章中的“sudoedit”小节。\
  \ |\n| `-l` | 列出此用户允许的命令。 |\n| `-u user` | 以 `user` 而不是 root 用户的身份运行命令。 |\n\n另请参见本章中的“visudo”部分获取关于\
  \ `/etc/sudoers` 文件的详情。\n\n#### wheel\n为非 root 用户提供 root 访问的常用方法是使用 wheel 组。如果在\
  \ `/etc/sudoers` 文件中启用（通常该行是被注释掉的），wheel 组中的任何人都将通过 `sudo` 命令以 root 用户身份运行任何命令：\n\
  \n```\n%wheel   ALL=(ALL)    ALL\n```\n\n#### visudo\n`/etc/sudoers` 文件用于确定哪些用户可以使用\
  \ `sudo` 命令以其他用户（通常是 root 用户）身份执行命令。要编辑此文件，你必须以 root 用户身份登录，并且应该使用 `visudo` 命令而不是直接编辑该文件。\n\
  \n下表描述了 `/etc/sudoers` 文件的重要定义：\n\n| 选项 | 描述 |\n| --- | --- |\n| `User_Alias` |\
  \ 代表一组用户的名称（例如，`User_Alias ADMINS` = `julia, sarah`） |\n| `Cmnd_Alias` | 代表一组命令的名称（例如，`Cmnd_Alias\
  \ SOFTWARE` = `/bin/rpm, /usr/bin/yum`）。 | |\n\n`/etc/sudoers` 文件条目的格式使用以下语法：\n\n\
  点击此处查看代码图像\n\n```\nuser             machine=commands\n```\n\n要允许 student 用户以 root\
  \ 用户身份执行 `/usr/bin/yum` 命令，请在 `/etc/sudoers` 文件中添加如下条目：\n\n点击此处查看代码图像\n\n```\nstudent\
  \        ALL=/usr/bin/yum\n```\n\n要允许 ADMINS 的所有成员以 root 用户身份执行所有 `SOFTWARE` 命令，请在\
  \ `/etc/sudoers` 文件中添加如下条目：\n\n```\nADMINS      ALL=SOFTWARE\n```\n\n#### sudoedit\n\
  如果你想使用 sudo 权限编辑文件，请考虑使用 `sudeedit` 或 `sudo -e` 命令。使用此功能需要能够使用用于编辑文件的命令（如 `nano`、`vi`\
  \ 或 `vim`）来编辑文件。\n\n示例：\n\n```\nsudoedit file1\n```\n\n注意，所选的编辑器取决于变量。将参考以下变量：\n\
  \n* `SUDO_EDITOR`\n* `VISUAL`\n* `EDITOR`\n\n如果未设置这些任何变量，则通常默认使用 `vi` 编辑器。\n\n###\
  \ 用户类型\n本节介绍了你可能在基于 Linux 的系统中遇到的不同用户类型。\n\n#### Root\nroot 账户是系统管理员账户。需要注意的是，root\
  \ 账户特殊之处在于 UID `0`。任何 UID 为 `0` 的用户都是全系统管理员。作为安全提示，当你进行审计时，寻找任何 UID 为 `0` 的用户，因为这是常见的攻击技术。\n\
  \n#### Standard\n任何 UID 为 `1000` 或更高的账户都被视为标准用户或普通用户账户。人们通常被分配标准用户账户，以便他们登录系统并执行任务。\n\
  \n#### Service\n典型的 Linux 系统将有很多服务用户账户。这些服务用户账户的 UID 值通常小于 `1000`，便于管理员识别这些为特殊账户。\n\
  \n这些服务账户通常被称为“守护进程账户”（daemon accounts），因为它们被基于守护进程的软件使用。*Daemons*是在后台运行并执行特定系统任务的程序。\n\
  \n其他服务账户可能存在，用于为操作系统提供功能。例如，“nobody”账户用于对通过 NFS（网络文件系统）共享的文件应用权限。\n\n此外，如果你向系统添加新软件，可能会增加更多用户，因为软件供应商会同时使用用户和组账户来对软件部分文件提供受控的访问。\n\
  \n## 第 16 章 给定场景，配置并实现适当访问和身份验证方法\n\n本章提供了有关以下主题的信息和命令：\n\n* PAM\n* 密码策略\n* LDAP\
  \ 集成\n* 用户锁定\n* 必须的、允许的或足够的\n* `etc/pam.d/`\n* pam_tally2\n* faillock\n* SSH\n*\
  \ `~/.ssh/`\n* known_hosts\n* authorized_keys\n* config\n* id_rsa\n* id_rsa.pub\n\
  * 用户特定访问\n* TCP 封装器\n* `etc/ssh/` (ssh_config, sshd_config)\n* ssh-copy-id\n* ssh-keygen\n\
  * ssh-add\n* TTYs\n* `etc/securetty`\n* `dev/tty`\n* PTYs\n* PKI\n* 自签名\n* 私钥\n\
  * 公钥\n* 哈希\n* 数字签名\n* 消息摘要\n* 作为客户端的 VPN\n* SSL/TLS\n* 传输模式\n* 隧道模式\n* IPSec\n*\
  \ DTLS\n\n\n\n\n\nPAM（可插拔认证模块）已用于几乎所有尝试验证用户的 Linux 实用程序。这很重要，因为你不需要调整实用程序来更改用户身份验证的方式，而是修改\
  \ PAM 配置文件。\n\n为了理解 PAM 有多有益，你应该意识到 PAM 可以完成的某些工作。虽然我们不会详细介绍所有内容，但以下是你使用 PAM 可以实现的一些示例：\n\
  \n* PAM 可用于强制更强健的密码策略。\n* 你可以使用 PAM 限制用户登录系统的日期和时间。\n* PAM 可以限制用户登录的来源。\n* PAM 可以设置或取消环境变量。由于你可以为不同的实用程序设置不同的\
  \ PAM 规则，这意味着你可以为本地登录设置一套环境变量，SSH 登录有一套，FTP 登录又有一套。\n* 可以 PAM 对用户账户设置限制。例如，可以限制用户可以执行的进程数。\n\
  * 你可以限制 root 用户登录的来源。通过只允许 root 用户本地登录或使用 `su` 命令获取 root 账户访问权限，可以提高系统的安全性。\n\n\
  请记住，这些只是你使用 PAM 可以完成的几件事。几十种不同的 PAM 模块提供了许多不同的身份验证功能。\n\n### Note\nPAM 可能是一个复杂的系统。请记住，本书内容的目标是为每个主题提供总结，而不是完整的描述。\n\
  \n### Password Policies\n\n`pam_unix` 模块提供了许多修改密码设置方式的功能。例如，考虑以下命令：\n\n点击此处查看代码图片\n\
  \n```\n[root@OCS ~]# grep ^password /etc/pam.d/passwd\npassword    include     \
  \  system-auth\n[root@OCS ~]# grep ^password /etc/pam.d/system-auth\npassword  \
  \  requisite     pam_cracklib.so try_first_pass retry=3\npassword    sufficient\
  \    pam_unix.so md5 shadow nullok\n  try_first_pass use_authtok\npassword    required\
  \      pam_deny.so\n```\n\n`pam_unix` 模块的 `shadow` 选项使得密码使用 shadow 系统存储。密码存储在 `/etc/shadow`\
  \ 文件中，而不是 `/etc/passwd` 文件中。\n\n你可以对该模块进行一些更改以使系统更安全。例如，如果你修改 `/etc/pam.d/system-auth`\
  \ 文件中的 `pam_unix` 行以匹配以下内容，系统将不允许用户重复相同的密码：\n\n点击此处查看代码图片\n\n```\npassword     sufficient\
  \      pam_unix.so md5 shadow nullok\n  try_first_pass use_authtok remember=5\n\
  ```\n\n现在，每个用户的最后五个密码都会被记录，且用户在更改新密码时无法使用这五个密码之一。这防止了用户反复使用相同的密码。\n\n下表描述了一些其他重要的\
  \ `pam_unix` 选项：\n\n| Option | Description |\n| --- | --- |\n| `md5` | 使用 MD5 加密算法加密密码。\
  \ |\n| `sha256` | 使用 SHA256 加密算法加密密码。 |\n| `nullok` | 允许 root 用户为用户提供空密码。 |\n| `remember=x`\
  \ | 记住用户的旧密码，并在用户更改密码时不允许其使用这些密码。 |\n\n### LDAP Integration\n\n请注意，轻量级目录访问协议 (LDAP)\
  \ 客户端配置不仅包含添加 PAM 组件。然而，考试目标是了解如何为 PAM  LDAP 集成，因此本小节涵盖该内容。\n\nLDAP 也可以在不同级别实现。例如，你可以让\
  \ LDAP 在用户登录时为用户创建家目录（或者你可以使用完全不同的技术，通过使用 `automount` 实用程序挂载网络驱动器）。至少应该在 `/etc/pam.d/system-auth`\
  \ 文件中添加以下行：\n\n点击此处查看代码图片\n\n```\nauth        sufficient pam_ldap.so\nauth     \
  \     required       pam_env.so\nauth          sufficient     pam_unix.so try_first_pass\
  \ nullok\nauth          required       pam_deny.so\n\naccount     sufficient pam_ldap.so\n\
  account       required       pam_unix.so\n\npassword    sufficient pam_ldap.so\n\
  password      requisite      pam_pwquality.so try_first_pass local_use\nrs_only\
  \ retry=3 authtok_type=\npassword      sufficient     pam_unix.so try_first_pass\
  \ use_authtok nullok sha512 shadow\npassword      required       pam_deny.so\n\n\
  session       optional       pam_keyinit.so revoke\nsession       required     \
  \  pam_limits.so\n-session       optional      pam_systemd.so\nsession     optional\
  \  pam_ldap.so\nsession       [success=1 default=ignore] pam_succeed_if.so service\
  \ in\n crond quiet use_uid\nsession       required       pam_unix.so\n```\n\n以下列表描述了在\
  \ PAM 中启用 LDAP 时可以启用的其他配置：\n\n* `“auth sufficient pam_ldap.so” 在 `/etc/pam.d/su`\
  \ 和 `/etc/pam.d/su-l` 文件中`：为 `su` 命令启用 LDAP\n* `“password sufficient pam_ldap.so”\
  \ 在 `/etc/pam.d/passwd` 文件中`：允许用户更改其 LDAP 密码\n* `“session required pam_mkhomedir.so\
  \ skel=/etc/skel umask=0022” 在 `/etc/pam.d/system-login` 文件中`：在用户登录时为用户创建包含骨架目录文件的家目录\n\
  * `“auth sufficient pam_ldap.so” 在 `/etc/pam.d/sudo` 文件中`：允许 LDAP 用户使用 `sudo` 命令（前提已为该用户配置了\
  \ sudo 访问的其他配置设置）\n\n### User Lockouts\n\n请参本章中的 `faillock` 和 `pam_tally2` 小节。\n\
  \n### Required, Allowed, or Sufficient\n\n要理解 PAM 配置文件的含义，你首先必须理解第一列数据。第一列有四种类型：`auth`、`account`、`session`\
  \ 和 `password`。它们的使用方式在图 16.1 中进行了视觉描述。\n\n![一张显示 PAM 类型的图片](img/16fig01.jpg)\n\n\
  **图 16.1** PAM 类型\n\n配置文件每行的第一个值（类型）基本上决定了何时使用该模块。每行的最后一个值是运行运行的 PAM 模块（或要查询的另一个配置文件）。中间的值称为控制值（control\
  \ value）。当 PAM 模块返回成功或失败时，该返回值如何使用取决于控制值。\n\n下表描述了不同的传统控制值。在阅读此表中的描述时，请注意，当解析一组规则时，最终结果必须成功，操作才能执行。例如，考虑以下规则：\n\
  \n点击此处查看代码图片\n\n```\naccount     required      pam_nologin.so\naccount     include\
  \       system-auth\n```\n\n为了验证用户账户，规则链的最终结果必须是成功的。这链规则也被称为规则栈（rule stack）。\n\n\
  | Value | Description |\n| --- | --- |\n| `required` | **返回成功**：如果当前 PAM 模块返回成功，则检查列表中的下一条规则。如果这是最后一条规则，栈将返回成功值（除非之前的\
  \ requisite 规则执行失败）。**返回失败**：如果当前 PAM 模块返回失败，则不执行任何额外的模块。栈将返回失败值。换句话说，具有 required\
  \ 值的模块必须返回成功，栈才能返回成功。 |\n\n\n\n\n\n| `requisite` | 在某些方面，此值与 `required`（强制）相似。区别在斜体部分已突出显示。**返回成功**：如果当前\
  \ PAM 模块返回成功，则检查列表中的下一个规则。如果这是最后一个规则，栈将返回成功值。**返回失败**：如果当前 PAM 模块返回失败，则会执行额外的模块；然而，无论这些其他模块发生了什么，栈都将返回失败值。这有时很有用，因为额外的模块可能在日志文件中提供更多信息。\
  \ |\n| `optional` | **返回成功**：如果当前 PAM 模块返回成功，则检查列表中的下一个规则。如果这是最后一个规则，栈将返回成功值（除非之前的\
  \ `requisite` 规则失败了除外）。**返回失败**：如果当前 PAM 模块返回失败，则检查列表中的下一个规则。如果这是最后一个规则，栈将返回成功值（除非之前的\
  \ `requisite` 规则失败了除外）。换句话之，模块的返回值对堆栈的成功或失败没有影响。异常：如果这是栈中唯一的规则，`optional` 的作用等于\
  \ `required`。 |\n| `sufficient` | **返回成功**：如果当前 PAM 模块返回成功，则不再检查额外的规则。栈将立即返回成功值（除非之前的\
  \ `requisite` 规则失败了除外）。**返回失败**：如果当前 PAM 模块返回失败，则检查列表中的下一个规则。如果这是最后一个规则，栈将返回成功值（除非之前的\
  \ `requisite` 规则失败了除外）。换句话说，如果模块的返回值为成功，则不会检查其他模块，且栈自动为成功。返回失败对栈的整体返回值没有影响。 |\n\
  | `include` | 此值告诉 PAM 使用指定文件中的所有规则。仅使用当前类型（auth、account 等）的规则。 |\n\n对于那些喜欢有更多直观视觉示例的读者，请查看图\
  \ 16.2 中的流程图。注意，此图使用了以下信息：\n\n![显示了 PAM 控制值的流程图。](img/16fig02.jpg)\n\n**图 16.2**\
  \ PAM 控制值示例\n\n点击此处查看代码图像\n\n```bash\n[root@OCS ~]# grep ^account /etc/pam.d/sshd\n\
  account     required       pam_nologin.so\naccount     include        system-auth\n\
  [root@OCS ~]# grep ^account /etc/pam.d/system-auth\naccount     required       pam_unix.so\n\
  account     sufficient     pam_succeed_if.so uid < 500 quiet\naccount     required\
  \       pam_permit.so\n```\n\n### /etc/pam.d/\n\n如果你查看 `/etc/pam.d` 目录的内容，它看起来类似于输出输出：\n\
  \n点击此处查看代码图像\n\n```bash\n[root@OCS ~]# ls /etc/pam.d\natd                other \
  \           runuser-l        su-l\nchfn               passwd           screen  \
  \         system-auth\nchsh               password-auth    smartcard-auth   systemd-user\n\
  config-util        polkit-1         smtp             usermin\ncrond            \
  \  postgresql       smtp.postfix     vlock\ncups               postlogin       \
  \ smtp.sendmail    vsftpd\ncvs                ppp              sshd            \
  \ webmin\ndovecot            proftpd          su               xserver\nfingerprint-auth\
  \   remote           sudo\nlogin              runuser          sudo-i\n```\n\n每个文件都设计用于配置使用\
  \ PAM 验证用户账户的命令或实用。例如，以下文件用于配置 Secure Shell 服务器如何使用 PAM：\n\n点击此处查看代码图像\n\n```bash\n\
  [root@OCS ~]# more /etc/pam.d/sshd\n#%PAM-1.0\nauth        include      system-auth\n\
  account     required     pam_nologin.so\naccount     include      system-auth\n\
  password    include      system-auth\nsession     optional     pam_keyinit.so force\
  \ revoke\nsession     include      system-auth\nsession     required     pam_loginuid.so\n\
  ```\n\n### pam_tally2\n\n你可以通过使用 `/etc/pam.d/password-auth` 文件中的以下加粗设置，来因登录尝试失败而锁定用户：\n\
  \n点击此处查看代码图像\n\n```bash\nauth          required      pam_env.so\nauth          required\
  \      pam_tally2.so file=\n   /var/log/tallylog deny=3 even_deny_root unlock_time=1200\n\
  auth          sufficient    pam_unix.so try_first_pass nullok\nauth          required\
  \      pam_deny.so\naccount       required      pam_unix.so\naccount       required\
  \      pam_tally2.so\n```\n\n以下是这些行的键值：\n\n* `file`：存储失败登录尝试的文件名\n* `deny`：何时锁定用户（在达到此次数失败尝试后）\n\
  * `even_deny_root`：使此设置也适用于 root 账户和普通用户\n* `unlock_time`：保持账户锁定状态的时间（秒）\n\n###\
  \ faillock\n\n你可以通过使用 `/etc/pam.d/system-auth` 文件中的以下加粗设置，来因登录尝试失败而锁定用户：\n\n点击此处查看代码图像\n\
  \n```bash\nauth          required     pam_env.so\nauth      required      pam_faillock.so\
  \ preauth\n  silent audit deny=4 unlock_time=1200\nauth        sufficient     pam_unix.so\
  \ try_first_pass nullok\nauth    [default=die]  pam_faillock.so authfail\n  audit\
  \ deny=4 unlock_time=1200\nauth         required      pam_deny.so\n```\n\n以下是这些行的键值：\n\
  \n* `deny`：何时锁定用户（在达到此次数失败尝试后）\n* `unlock_time`：保持账户锁定状态的时间（秒）\n\n### SSH\n\n`ssh`\
  \ 命令是一个允许你连接到 Secure Shell (SSH) 服务器的实用程序。该命令的语法如下：\n\n```bash\nssh user@hostname\n\
  ```\n\n将 `user` 替换为想要登录的用户名，并将 `hostname` 替换为系统主机名或 IP 地址。\n\n第一次使用 `ssh` 命令连接到系统时，它将发出以下提示：\n\
  \n点击此处查看代码图像\n\n```bash\n[root@OCS ~]# ssh bob@server1\nThe authenticity of host\
  \ 'server1' can't be established.\nECDSA key fingerprint is\n  8a:d9:88:b0:e8:05:d6:2b:85:df:53:10:54:66:5f:0f.\n\
  Are you sure you want to continue connecting (yes/no)?\n```\n\n这是为了确保你登录的是正确的系统。通常用户会对此提示回答“yes”，假设他们正在登录正确的机器，但也可以通过联系远程系统的管理员来独立验证此信息。\n\
  \n在用户对此提示回答“yes”后，SSH 服务器指纹将存储在 `~/.ssh` 目录下的 `known_hosts` 文件中。\n\n下表描述了 `ssh`\
  \ 命令的选项：\n\n| 选项 | 描述 |\n| --- | --- |\n| `-F` *configfile* | 指定 ssh 客户端使用的配置文件。默认配置文件为\
  \ `/etc/ssh/ssh_config`。有关此文件的详情，请参见本章中的“ssh_config”节。 |\n| `-4` | 仅使用 IPv4 地址。\
  \ |\n| `-6` | 仅使用 IPv6 地址。 |\n| `-E` *logfile* | 将错误放在指定的日志文件中，而不是显示在标准输出上。 |\n\n\
  #### ~/.ssh/\n\n单个用户的 SSH 数据存储在每个用户家目录下的 `.ssh` 子目录中。SSH 使用该目录存储重要数据，用户可以修改该目录中的配置。本小节重点关注可能存储在\
  \ `~/.ssh` 目录中的文件。\n\n##### known_hosts\n\n\n\n\n与 SSH 服务器建立连接后，SSH 客户端会将服务器唯一的“指纹”密钥存储在用户的\
  \ `.ssh/known_hosts` 文件中：\n\n点击此处此处查看代码图片\n\n```\n[root@OCS ~]# cat .ssh/known_hosts\n\
  |1|trm4BuvRf0HzJ6wusHssj6HcJKg=|EruYJY709DXorogeN5Hdcf6jTCo=\n  ecdsa-sha2-nistp256AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzd\n\
  \  HAyNTYAAABBBG3/rARemyZrhIuirJtfpfPjUVnph9S1w2NPfEWec/f59V7nA\n  ztn5rbcGynNYOdnozdGNNizYAiZ2VEhJ3Y3JcE=\n\
  ```\n\n通常情况下，该文件的内容应该保持不变；然而，如果重新安装了 SSH 服务器，它将拥有新的“指纹”密钥。这将要求所有用户删除 `.ssh/known_hosts`\
  \ 文件中对应 SSH 服务器的条。\n\n### authorized_keys\n\n当用户想要使用基于密码的 SSH 认证时，第一步是使用 `ssh-keygen`\
  \ 命令创建认证密钥。有关此过程的详细信息，请参见“ssh-keygen”节。\n\n创建认证密钥文件后，需要将公钥（`~/.ssh/id_dsa.pub` 或\
  \ `~/.ssh/id_rsa.pub` 文件的内容）复制到用户尝试登录的系统中。这需要将公钥放入 SSH 服务器上的 `~/.ssh/authorized_keys`\
  \ 文件中。可以通过从客户端系统手动复制公钥文件的内容，并将其粘贴到 SSH 服务器上的 `~/.ssh/authorized_keys` 文件中来实现。或者，你也可以使用\
  \ `ssh-copy-id` 命令：`ssh-copy-id user@server`。\n\n### config\n\n用户可以通过创建 `~/.ssh/config`\
  \ 文件来自定义 `ssh`、`scp` 和 `sftp` 等命令的工作方式。该文件中的格式和设置与 `/etc/sshd/ssh.conf` 文件中的相同。有关更多信息，请参见本章中的“ssh_conf”小节。\n\
  \n### id_rsa\n\n`~/.ssh/id_rsa` 和 `id_rsa.pub` 文件的内容用于结合 `ssh-agent` 和 `ssh-add`\
  \ 工具进行密码认证。有关这些工具的详细信息，请参见本章中的“ssh-add”小节。\n\n### id_rsa.pub\n\n`~/.ssh/id_rsa`\
  \ 和 `id_rsa.pub` 文件的内容用于结合 `ssh-agent` 和 `ssh-add` 工具进行密码认证。有关这些工具的详细信息，请参见本章中的“ssh-add”小节。\n\
  \n#### 用户特定访问\n\n本小节提到了一种名为“无密码登录”的功能。如果用户经常登录特定的 SSH 服务器，该用户可能想要设置无密码登录。要实现这一点，你需要遵循以下步骤：\n\
  \n**第 1 步**。在 SSH 客户端机器上执行 `ssh-keygen` 命令，如本章中“ssh-keygen”小节所示。当提示输入密码（passphrase）时，按回车键留空（或者，你可以在\
  \ `ssh-keygen` 命令中使用 `-N` 选项，这样就不会提示密码）。\n\n**第 2 步**。将 `~/.ssh/id_rsa.pub` 文件中的公钥复制到目标系统，即\
  \ SSH 服务器上的 `~/.ssh/authorized_keys` 文件中。这可以通过手动从客户端系统复制公钥文件的内容并粘贴到 SSH 服务器上的 `~/.ssh/authorized_keys`\
  \ 文件来实现。或者，你也可以使用 `ssh-copy-id` 命令：`ssh-copy-id user@server`。\n\n**第 3 步**。将 `authorized_keys`\
  \ 文件的权限设置为 `600`：点击此处查看代码图片\n\n```\nchmod 600 ~/.ssh/authorized_keys\n```\n\n\n\n\
  \n\n`/etc/ssh/ssh.conf` 文件用于修改 SSH 客户端工具的行为，如 `ssh`、`scp` 和 `sftp`。此文件影响所有用户，但用户可以通过在自己的家目录中创建自己的配置文件（即\
  \ `~/.ssh/config` 文件）来覆盖这些设置。\n\n`ssh_config` 文件的某些组件与 `sshd_config` 文件不同（在继续之前，请考虑回顾本章中的“sshd_config”小节）。首先，有一个系统级的\
  \ `/etc/ssh/ssh_config` 文件，它适用于所有用户。此外，每个用户可以在其家目录（`~/.ssh/config`）中创建一个文件，用于覆盖\
  \ `/etc/ssh/ssh_config` 文件中的设置。\n\n除了文件之外，命令行选项也可以覆盖配置文件中指定的值。以下是所有信息解析的顺序：\n\n\
  1. 命令行选项\n2. 用户的 `~/.ssh/config` 文件\n3. `/etc/ssh/ssh_config` 文件\n\n找到的第一个参数即为使用的。例如，如果在用户的\
  \ `~/.ssh/config` 文件中设置了 `ConnectTimeout`，而在 `/etc/ssh/ssh_config` 文件中设置了不同的值，则将使用用户的配置文件来设置该值。\n\
  \n`ssh_config` 文件与 `sshd_config` 文件之间的另一个重要区别是，`ssh_config` 文件中的大多数设置都是 `Host` 设置的子设置。`Host`\
  \ 设置允许你为连接的不同 SSH 服务器指定不同的规则。例如，以下将在连接到 server1.localhost.com 时应用 `0` 的 `ConnectTimeout`\
  \ 值，在连接到 test.example.com 时应用 `600` 的值：\n\n```\nHost server1.localhost.com\nConnectTimeout\
  \ 0\nHost test.example.com\nConnectTimeout 600\n```\n\n`ssh_config` 中的许多设置与 SSH\
  \ 服务器配置文件中的设置相关，例如以下 `/etc/ssh/sshd_config` 文件设置：\n\n```\nX11Forwarding yes\n```\n\
  \n在客户端，通常通过执行基于 `ssh` 的命令时使用 `-X` 或 `-Y` 选项来启用此功能。然而，如果你希望此功能成为默认设置，可以在 `/etc/ssh/ssd_config`\
  \ 或 `~/.ssh/config` 文件中使用以下设置：\n\n点击此处查看代码图像\n\n```\nForwardX11 and ForwardX11Trusted\n\
  ```\n\n### sshd_conf\n\n`sshd_conf` 文件用于配置 SSH 服务器。该文件中的重要设置包括：\n\n*   **Protocol**：设置为“1”、“2”或“1,2”，此设置定义了\
  \ SSH 服务器的协议类型。Protocol 1 不再支持，因此此值通常应设置为“2”。\n*   **ListenAddress**: 指定分配给 SSH\
  \ 接受连接的网卡的 IP 地址。例如：`ListenAddress 192.168.1.100:192.168.1.101`。\n*   **Port**:\
  \ SSH 服务器监听入站连接的端口。例如：`Port 2096`。\n*   **LogLevel**: 你希望 SSH 服务器记录的日志。允许以下值：`QUIET`、`FATAL`、`ERROR`、`INFO`、`VERBOSE`、`DEBUG`、`DEBUG1`（与\
  \ `DEBUG` 相同）、`DEBUG2`、`DEBUG3`。\n*   **PermitRootLogin**: 当此设置为“no”时，root 用户无法通过\
  \ SSH 直接登录。\n*   **AllowUsers** 或 **DenyUsers**: 定义哪些用户可以通过 SSH 登录（`AllowUsers`）或哪些用户不能通过\
  \ SSH 登录（`DenyUsers`）。例如：`AllowUsers bob sue ted`。\n*   **PasswordAuthentication**:\
  \ 设置设置为“yes”（默认值），此设置允许用户通过提供用户名和密码登录。如果设置为“no”，用户将仅可以使用身份密钥登录。\n*   **PubkeyAuthentication**:\
  \ 当此设置为“yes”时，用户可以在服务器上存储公钥。公钥是由用户客户端系统上的 `ssh-keygen` 命令生成的。有关更多信息，请参阅本章中的“ssh-keygen”部分。\n\
  *   **Banner**: 指定一个文件，在用户验证过程之前显示该文件的内容。\n*   **PrintMotd**: 如果此设置为 yes（默认值为 no），当用户通过\
  \ SSH 登录系统时，将显示 `/etc/motd` 文件的内容。有关 `/etc/motd` 文件的更多信息，请参阅 第 17 章 中的“MOTD”和“总结\
  \ Linux 环境中的安全最佳实践”。\n*   **X11Forwarding**: 如果设置为 yes（默认值为 no），则提供了一种允许在 SSH 服务器上执行图形程序并在\
  \ SSH 客户端上显示的简单方法。这要求执行 SSH 客户端命令（`ssh` 命令）时带有 `-X` 或 `-Y` 选项。有关更多信息，请参阅 第 14 章\
  \ 中的“SSH 端口转发”和“比较与对比 Linux 图形用户界面”。\n*   **MaxAuthTries**: 设置为数值，表示用户输入正确密码的尝试次数。默认值为\
  \ 6。\n*   **PermitEmptyPasswords**: 如果此设置为 no（默认值），如果用户账户的密码字段为空，则用户无法通过 SSH 登录。\n\
  \n### ssh-copy-id\n\n`ssh-copy-id` 命令用于将 `ssh-keygen` 命令创建的登录密钥复制到远程系统（另请参见本章中的“ssh-keygen”小节）。该命令的格式如下：\n\
  \n```\nssh-copy-id user@hostname\n```\n\n### ssh-keygen\n\n`ssh-keygen` 命令可生成身份密钥。它的常见用途是创建身份文件：\n\
  \n点击此处查看代码图像\n\n```\njulia@OCS ~]$ ssh-keygen\nGenerating public/private rsa key\
  \ pair.\nEnter file in which to save the key (/home/julia/.ssh/id_rsa):\nEnter passphrase\
  \ (empty for no passphrase):\nEnter same passphrase again:\nYour identification\
  \ has been saved in /home/julia/.ssh/id_rsa.\nYour public key has been saved in\
  \ /home/julia/.ssh/id_rsa.pub.\nThe key fingerprint is:\n6d:40:24:e2:3e:62:7f:a4:f0:5d:d5:05:1b:06:fd:d7\
  \ bo@ubuntu\nThe key's randomart image is:\n+--[ RSA 2048]----      +\n|       .\
  \ ..o .o+..   |\n|   . . o   o.+         |\n|    .          . o.   |\n|   .    \
  \ +     . S    |\n|  + o . S .             |\n|    + o                |\n|     .\
  \                 |\n|                       |\n+-----------------      +\n```\n\
  \n此命令的结果是两个新文件：`~/.ssh/id_rsa` 和 `~/.ssh/id_rsa.pub`。这些文件的内容将配合 `~/.ssh/authorized_keys`\
  \ 文件用于密码验证。\n\nRSA 是一种加密算法。另一种流行的加密算法是 DSA。使用 DSA 代替 RSA 需要对 `ssh-keygen` 命令使用 `-t\
  \ DSA` 选项。使用该选项的结果是两个新文件：`~/.ssh/id_dsa` 和 `~/.ssh/id_dsa.pub`。\n\n### 注意\n\n在执行\
  \ `ssh-keygen` 命令期间如果提示输入密码短语，则在每次建立 SSH 连接时都需要输入该密码短语。通过使用 `ssh-agent` 和 `ssh-add`\
  \ 工具可以避免重复输入此密码短语。有关这些工具的详细信息，请参阅本章中的“ssh-add”章节。\n\n### ssh-add\n\nssh-agent 工具用于在使用无密码\
  \ SSH 身份验证时避免需要输入密码短语。有关设置无密码 SSH 身份验证的详细信息，请参阅本章中的“ssh-keygen”部分。\n\n\n\n\n\n使用此功能的一种方法是执行以下命令：`ssh-agent\
  \ bash`。这将启动一个 shell，其中 SSH agent 将缓存已添加的 RSA 和 DSA 密钥。可以使用 `ssh-add` 命令将这些密钥添加到\
  \ SSH agent 缓存中。\n\n启动 `ssh-agent` 实用后，可以使用 `ssh-add` 命令将 RSA 和 DSA 密钥添加到 SSH agent\
  \ 的缓存中。\n\n要使用 `ssh-add` 工具，请执行不带参数的命令：\n\n点击此处查看代码图像\n\n```\n[julia@OCS ~]$ ssh-add\n\
  Identity added: /home/julia/.ssh/id_rsa (/home/julia/.ssh/id_rsa)\n```\n\n密钥添加后，它们将在未来的\
  \ SSH 连接中被自动使用。\n\n### TTYs\n\n“TTY”是一个与终端显示关联的设备文件。终端显示传统上是命令行登录屏幕，但带有显卡的现代 Linux\
  \ 系统也可以将 GUI 或基于 Windows 的输出到 TTY 文件。\n\n请参阅本章的“/dev/tty#”小节以获取更多信息。\n\n#### /etc/securetty\n\
  \n`/etc/securetty` 文件列出了 root 用户可以登录系统的所有设备文件。例如，如果你从该文件中删除所有 `/etc/tty#` 设备文件名，那么当用户坐在系统面前时，root\
  \ 用户将无法登录。\n\n默认情况下，此文件将包含用户可以从其登录的所有可能的设备文件。在安全至上的系统中，此文件通常会经过大幅修改，以防止 root 用户直接登录。这提供了更高的安全性，因为为了获得\
  \ root 权限，必须同时知道普通用户和 root 用户的密码（登录所需的普通用户密码和使用 `su` 命令切换到 root 账户所需的 root 密码）。\n\
  \n#### /dev/tty#\n\nTTY 设备文件均命名为 `/dev/tty#`，其中 `#` 实际上是一个数字：\n\n点击此处查看代码图像\n\n\
  ```\n[julia@OCS ~]$ ls /dev/tty*\n/dev/tty    /dev/tty20  /dev/tty33   /dev/tty46\
  \   /dev/tty59\n/dev/tty0   /dev/tty21  /dev/tty34   /dev/tty47   /dev/tty6\n/dev/tty1\
  \   /dev/tty22  /dev/tty35   /dev/tty48   /dev/tty60\n/dev/tty10  /dev/tty23  /dev/tty36\
  \   /dev/tty49   /dev/tty61\n/dev/tty11  /dev/tty24  /dev/tty37   /dev/tty5    /dev/tty62\n\
  /dev/tty12  /dev/tty25  /dev/tty38   /dev/tty50   /dev/tty63\n/dev/tty13  /dev/tty26\
  \  /dev/tty39   /dev/tty51   /dev/tty7\n/dev/tty14  /dev/tty27  /dev/tty4    /dev/tty52\
  \   /dev/tty8\n/dev/tty15  /dev/tty28  /dev/tty40   /dev/tty53   /dev/tty9\n/dev/tty16\
  \  /dev/tty29  /dev/tty41   /dev/tty54   /dev/ttyS0\n/dev/tty17  /dev/tty3   /dev/tty42\
  \   /dev/tty55   /dev/ttyS1\n/dev/tty18  /dev/tty30  /dev/tty43   /dev/tty56   /dev/ttyS2\n\
  /dev/tty19  /dev/tty31  /dev/tty44   /dev/tty57   /dev/ttyS3\n/dev/tty2   /dev/tty32\
  \  /dev/tty45   /dev/tty58\n```\n\n虽然有许多 TTY 文件，但在标准 Linux 发行版中通常只有七个在使用。其中一个一个预留给基于\
  \ GUI 的登录，另外六个提供命令行登录。通常 `/dev/tty1` 或 `/dev/tty7` 提供基于 GUI 的登录，但这因发行版而异。你可以通过按住\
  \ Ctrl 和 Alt 键并按下功能键在这些 TTY 接口之间切换。例如，Ctrl-Alt-F1 将切换到 `/dev/tty1` 设备接口。\n\n注意，`/dev/ttyS#`\
  \ 设备用于物理串口端口访问。\n\n了解这些设备文件是非常重要的，因为有一项安全功能可以限制 root 用户登录系统的位置。请参阅“/etc/securetty”小节获取有关该功能的更多信息。\n\
  \n### PTYs\n\n“PTY”术语指的是伪终端。这些是当用户远程登录（如 SSH 连接）或用户在基于 GUI 的环境中打开新终端窗口时为 shell 提供的终端。PTY\
  \ 设备文件通常根据需要创建，并出现在 `/dev/pts` 目录中。每个 PTY 设备文件都有一个数字名称；例如，`/dev/pts/0` 将是第一个 PTY\
  \ 设备文件。\n\n了解这些设备文件是非常重要的，因为有一项安全功能可以限制 root 用户登录系统的位置。请参阅“/etc/securetty”小节获取有关该功能的更多信息。\n\
  \n### PKI\n\n当用户尝试连接到服务器（如 Web 服务器）时，使用公钥基础设施（PKI）来确保该服务器确实是用户想要去的地方，而不是恶意服务器。这种结构通常还会提供服务器和用户之间加密数据的手段。\n\
  \nTLS 使用的技术（请参见本章的“SSL/TLS”小节）被称为非对称加密（也称为 PKC 或公钥加密）。在非对称加密中，使用了两个密钥：`public key`\
  \ 和 `private key`。这些密钥用于加密和解密数据。\n\n公钥用于加密发送到 Apache Web 服务器的数据。所有系统在请求时提供此密钥。例如，当\
  \ 浏览器首次连接到使用 TLS 的 Apache Web 服务器时，浏览器会请求服务器的公钥。该公钥会免费提供给浏览器。\n\n从 浏览器发送到服务器的任何额外数据（如用户名和密码）都使用此公钥进行加密。这些数据只能由服务器使用私钥解密（此过程称为*哈希*）。这就是*非对称加密*术语出现的地方。在对称加密中，使用同一个密钥来加密和解密数据。在使用非对称加密时，需要两个独立的密钥：一个加密数据，另一个解密数据。这意味着只有\
  \ Web 服务器可以解密从浏览器发送的数据。\n\n你可能好奇浏览器究竟是如何知道它到达了正确的 Web 服务器而不是某些“恶意”Web 服务器的。当服务器发送其公钥时，它包含一个`digital\
  \ signature`（称为`message digest`）。该数字签名可以发送到 CA（证书颁发机构）服务器，这是一个用于验证数字签名的受信任第三方系统。在某些情况下，服务器本身会通过名为`self-signed`（自签名）证书的过程提供签名。\n\
  \n从用户的角度来看，这一切都在后台发生，并且是完全透明的——除非出现问题且浏览器显示了警告消息。由于数字证书通常有有效期，最常见的问题是 CA 没有更新的数字证书，或者用户更改了计算机上的日期。\n\
  \n请参阅图 16.3 查看此过程的视觉示例。\n\n![图中显示了 SSL 过程的视觉样本。](img/16fig03.jpg)\n\n**图 16.3**\
  \ SSL 过程\n\n### VPN 作为客户端\n\n考虑一家位于加利福尼亚州圣地亚某栋建筑内的组织。该组织为员工提供访问本地管理数据库中敏感数据的权限。通过将所有敏感数据的数据传输保留在公司的物理网络（局域网，或\
  \ LAN）中，公司获得了比数据通过互联网（广域网，或 WAN）传输时更高的安全性。\n\n\n\n\n然而，随着公司的规模扩大，这种提供数据的方法变成了一种阻碍。需要出差会会的员工无法访问这些重要数据。公司还在考虑通过收购一家位于纽约市的公司来扩大规模，但对于数据将如何共享存在担忧。\n\
  \n你是公司的系统管理员，你的责任是开发一个可行的（且安全的）解决方案。幸运的是，有虚拟专用网络（`VPN`）。通过这个 `VPN`，你可以在 VPN 服务器和\
  \ VPN 客户端之间安全地传输数据。此功能与安全外壳（`SSH`）提供安全数据传输的方式非常；它利用公钥和私钥对数据进行加密和解密。VPN 服务器和 VPN\
  \ 客户端之间的所有路由器只能看到加密的数据。\n\n有很多不同的 VPN 软件解决方案可用，因此对于 Linux+ 考试来说，重要的是理解这些概念。如果你想进行一些实践，`OpenVPN`\
  \ 是一个很好的选择，但请注意，任何考试题都应该关注技术本身，而不是任何特定的软件解决方案。\n\n本节涵盖了你在使用 VPN 时应该了解的不同概念。\n\n\
  ### SSL/TLS\n\n传输层安全（`TLS`）是一种加密协议，用于 `VPNs` 以提供数据的安全传输。安全套接层（`SSL`）是 `TLS` 的前身，被认为已过时。\n\
  \n`TLS` 不仅用于 `VPNs`；它通常用于 Web 服务器通信、电子邮件传输和 IP 语音（`VoIP`）。\n\n### 传输模式\n\n对于 `VPN`\
  \ 而言，传输模式是指仅对数据进行加密。在传输模式下，数据包中的 IP 信息是不加密的。这是配置站点间 `VPN` 的常用方法。站点间 `VPN` 在大型组织中很常见，网络流量必须穿越互联网从一个网络到达另一个网络。使用站点间\
  \ `VPN` 可以使数据传输更安全。\n\n### 隧道模式\n\n对于 `VPN` 而言，隧道模式是指数据和元数据（数据包中的 IP 数据）都被加密。这是配置客户端到站点\
  \ `VPN` 时的一种常用方法。\n\n### IPSec\n\n网协议安全（`IPSec`）用于 `VPNs` 中的身份验证和网络数据包加密。`IPSec`\
  \ 与 `TLS` 有几点不同（参见本章中的“SSL/TLS”小节），但主要区别在于安全增强发生在 OSI 模型的哪个位置。`TLS` 在第 3 层以上执行操作，而\
  \ `IPSec` 在第 3 层执行。这是一个重要的区别，因为某些网络设备具有第 3 层功能但在第 3 层以上不起，这使得在这些设备上实现 `VPN` 非常困难。\n\
  \n### DTLS\n\n数据报传输层安全（`DTLS`）利用基于数据报的安全特性提供安全的 `VPN` 传输。数据报在分组交换网络中作为传输的基本单元，并使用无连接的通信方法。`DTLS`\
  \ 基于 `TLS`（参见本章中的“SSL/TLS”小节）。\n\n## 第 17 章总结 Linux 环境下的安全最佳实践\n\n本章提供了有关以下主题的信息和命令：\n\
  \n#### 启动安全\n\n* 启动加载程序密码\n* UEFI/BIOS 密码\n\n#### 额外的身份验证方法\n\n* 多因素身份验证 (令牌, 硬件,\
  \ 软件, OTP, 生物识别)\n* RADIUS\n* TACACS+\n* LDAP\n* Kerberos (kinit, klist)\n\n####\
  \ 通过 SSH 禁用 root 登录的重要性\n\n#### 无密码登录 (强制使用 PKI)\n\n#### Chroot 监狱服务\n\n#### 不使用共享\
  \ ID\n\n#### 拒绝主机的重要性\n\n#### 操作系统数据与应用数据分离 (磁盘分区以最大化系统可用性)\n\n#### 更改默认端口\n\n####\
  \ 禁用或卸载未使用且不安全服务的的重要性\n\n* FTP\n* Telnet\n* Finger\n* Sendmail\n* Postfix\n* 磁盘加密)\n\
  * 限制 cron\n* 禁用 Ctrl-Alt-Del\n* 添加横幅\n* MOTD\n\n注意\n\n对于 Linux+ 考试，重要的是，对于此目标下列出的主题，你应该能够“**总结\
  \ Linux 环境下的安全最佳实践**”。换句话说，不要求你了解有关设置、配置或管理安全实践的细节，而是要理解安全实践的功能是什么。\n\n\n\n\n通过多因素身份验证，用户被要求提供多项证明其身份的证据。一种常见的多因素身份验证方法称为双因子身份验证，或\
  \ 2FA。对于这种方法，用户需要提供两种形式的身份，可能包括以下内容：\n\n* 用户所知的\n* 用户拥有的\n* 用户“是”的\n\n本节涵盖了用于多因素身份验证的不同技术。\n\
  \n## 令牌 (Tokens)\n令牌是由硬件设备或软件程序生成的唯一值（通常是数字或字母数字值）。令牌通常是持续性地自动生成的，并且通常只在短时间内有效，例如\
  \ 30 秒。\n\n## 硬件\n硬件令牌是由硬件设备生成的。这通常是一个非常小的设备，例如钥匙扣（key fob）。该硬件设备可能具有额外的身份验证方法，例如指纹扫描器，但这种情况较为罕见。\n\
  \n## 软件\n软件令牌是由程序生成的。一个常见的例子是移动设备上的应用程序。\n\n## OTP\nOTP 代表一次性密码。这是一种经常包含在双因子身份验证中的身份验证技术。在用户丢失或忘记密码时也可以使用这种技术。\n\
  \n## 生物识别\n生物识别利用了多因素身份验证中“人所是的”的部分。用户的指纹、虹膜扫描或其他生物数据可用于验证用户的身份。\n\n## RADIUS\n\
  远程认证拨入服务 (RADIUS) 是一种允许客户端系统使用服务器对用户进行认证的协议。该服务在集中位置提供 AAA（认证、授权和审计）管理。\n\nRADIUS\
  \ 经常与 TACACS+ 进行比较，但了解这些协议之间的差异超出了 Linux+ 考试的范围。最重要的是，要意识到 RADIUS 可以在安全策略中提供非常强大的功能，因为它提供了化的\
  \ AAA 管理。此外，你应该意识到 RADIUS 比 TACACS+ 具有更好的厂商无关性。\n\n## TACACS+\n终端访问控制器访问系统加+ (TACACS+)\
  \ 是一种允许客户端系统使用服务器对用户进行认证的协议。该服务在集中位置提供 AAA（认证、授权和审计）管理。\n\nTACACS+ 经常与 RADIUS 进行比较，但了解这些协议之间的差异超出了\
  \ Linux+ 考试的范围。最重要的是，要意识到 TACACS+ 可以在安全策略中提供非常强大的功能，因为它提供了集中 AAA 管理。此外，你应该意识到 TACACS+\
  \ 是 Cisco 开发的，不像 RADIUS 那样具有厂商无关性。\n\n## LDAP\n轻量级目录访问协议 (LDAP) 是一种提供目录服务信息的协议。这意味着该协议可以提供用户账户信息，但它不提供\
  \ RADIUS 或 TACACS+ 那种完整的 AAA 功能。LDAP 也经常用于存储与其他用户账户不直接相关的信息，例如主机名。\n\nLDAP 可用于验证用户，但在考虑安全策略时，你应该意识到\
  \ RADIUS 和 TACACS+ 提供了更健壮的解决方案。例如，LDAP 不提供 RADIUS 和 TACACS+ 等 AAA 协议提供的“审计 (Accounting)”功能。\n\
  \n## Kerberos\nKerberos 协议利用基于票据的系统来验证用户。当客户端系统最初从用户处获取凭据进行认证时，这些信息会被发送到 Kerberos\
  \ 认证服务器进行验证。认证服务器随后将信息传递给密钥分布中心 (KDC)，由其发放票据授予票 (TGT)。TGT 使用票据发放服务加密，并将加密所需的秘密密钥传回客户端系统。\n\
  \n该秘密密钥现在将用于后续的身份验证请求（例如，如果用户尝试登录 Kerberos 域内的另一个系统）。\n\n### kinit\nKerberos 使用\
  \ `kinit` 工具来获取个人票据。该票据随后会被缓存在本地系统中，供未来的身份验证尝试。\n\n### klist\n`klist` 工具用于显示缓存的\
  \ Kerberos 票据列表。\n\n## 通过 SSH 禁用 Root 登录的重要性\n默认情况下，SSH 服务器将允许 root 用户直接登录。对于可以直接访问互联网的服务器，这构成了安全风险，因为黑客可以尝试直接登录\
  \ root 账户。通过禁用直接 root 登录，黑客首先需要破解一个非 root 账户，然后通过其他方法（如 `su` 或 `sudo` 命令）破解 root\
  \ 账户。\n\n通过修改 `/etc/ssh/sshd_config` 文件中的以下设置来实现禁用 SSH 直接 root 登录：\n\n```\nPermitRootLogin\
  \ no\n```\n\n## 无密码登录\n无密码登录系统允许用户无需密码登录。这通常与 SSH 相关，被认为既是便利特性也是安全特性。\n\n该功能背后的原理是利用\
  \ SSH 密钥来验证用户身份。执行以下步骤：\n\n**步骤 1**。在客户端系统上执行 `ssh-keygen` 命令以创建公私钥对。\n\n**步骤 2**。将公\
  \ SSH 密钥复制到远程系统用户的 `.ssh` 目录中。大多数系统提供 `ssh-copy-id` 来执行此任务，也可以通过手动复制公钥来完成。\n\n**步骤\
  \ 3**。登录远程系统以验证在不需要密码的情况下提供访问。本地系统的私钥与远程系统对应的公钥的组合用于验证用户身份。\n\n### 强制使用 PKI\n公钥基础设施\
  \ (PKI) 可以应用于 SSH；它利用公 SSH 密钥进行用户账户认证（有关 SSH 密钥的更多细节请参见本章的“无密码登录”部分）。在鼓励使用 SSH 密钥进行认证的安全策略系统上，最好强制使用\
  \ PKI 以确保所有用户都使用这种方法。\n\n通过对 `/etc/ssh/sshd_config` 文件进行以下更改可以：\n\n```\nPasswordAuthentication\
  \ no\nRSAAuthentication yes\nPubkeyAuthentication yes\n```\n\n## chroot 监狱服务 (Chroot\
  \ Jail Services)\nchroot 监狱是一种仅访问文件系统一小部分的服务。该服务无法访问整个文件系统，只能访问一个子目录，该目录通常存放其配置数据。\n\
  \nchroot 监狱服务的主要安全优势是该服务无法看到或修改关键系统数据。例如，如果服务只能看到 `/var/chroot` 目录的内容，那么 `/etc/passwd`\
  \ 和 `/etc/shadow` 等文件对该服务不可用。这对于容易受到黑客攻击的面向网络的服务器尤为重要。\n\n某些服务（如 BIND）内置了 chroot\
  \ 监狱配置。其他服务可能需要管理员使用 `chroot` 命令等命令手动创建监狱。\n\n### 不共享 ID (No Shared IDs)\n考虑以下输出：\n\
  \n点击此处查看代码图像\n\n```\n[root@OCS ~]# grep \"x:1099:\" /etc/passwd\nted:x:1099:1099:Ted\
  \ Jones:/home/ted:/bin/bash\nbob:x:1099:1099:Bob Smith:/home/bob:/bin/bash\n```\n\
  \n\n\n\n\n由于两个用户共享相同的用户 ID (UID)，无法对他们的行为进行追溯。用户的身份是与账户 `UID` 绑定的，而不是账户名。任何审计策略都会将操作与\
  \ `UID` 关联，在这种情况下，当用户的账户关联相同的 `UID` 时，无法确定是哪个人执行了特定事件。这违背了最佳的安全措施。\n\n## 拒绝主机的重要性\n\
  \n有几种不同的方法可以拒绝访问系统、服务或网络，包括：\n\n* 防火墙\n* TCP Wrappers\n* PAM (可插拔认证模块)\n* 个别服务配置\n\
  \n安全策略中拒绝主机的重要性源于：某些系统已知被用作黑客攻击的跳板点。这些主机应该始终被拒绝访问你的系统。注意：一些网站提供了受损系统的列表（搜索“黑名单网站”）。其中一个示例是\
  \ [`mxtoolbox.com`](https://mxtoolbox.com)。\n\n## 将操作系统数据与应用程序数据分离\n\n假设你正在测试的一个新应用程序“失控”了并破坏了存储它的文件系统。这可能是任何情况，从用巨大的日志文件填充文件系统到执行不安全的文件系统操作。\n\
  \n受破坏的文件系统可能会导致整个操作系统（OS）无法使用。因此，最好是将操作系统数据与应用程序数据分离。实现这一点的主要手段是使用单独的分区（详情请参见本章下一节的“最大化系统可用性的磁盘分区”）。\n\
  \n### 最大化系统可用性的磁盘分区\n\n你有一些 IT 部门正在非生产系统上测试的新软件，你希望避免它对操作系统运行所需的文件造成任何伤害。最佳行动方案是创建一个单独的分区（或逻辑卷），并在该位置安装新软件。\n\
  \n即使在生产系统上，你也应该将应用程序安装位置与操作系统数据分开。这意味着你至少应该创建以下分区或卷：\n\n* `/usr`：大多数软件都安装在这里。\n\
  * `/opt`：某些软件安装在这里（通常是第三方软件）。\n* `/var`：用于分离日志文件和其他打印数据。\n* `/boot`：将启动文件与所有其他内容分开。\n\
  * `/home`：将任何用户生成或安装的软件与操作系统数据分开。\n* `/`：系统其余数据的位置（大部分是操作系统数据）。\n\n## 更改默认端口\n\n\
  服务监听网络端口以获取入站连接`/etc/services` 文件按服务类型列出了标准端口号。例如：\n\n点击此处查看代码\n\n```\n[root@OCS\
  \ ~]# egrep \"22/tcp| 22/udp\" /etc/services\nssh   22/tcp       # The Secure Shell\
  \ (SSH) Protocol\nssh   22/udp       # The Secure Shell (SSH) Protocol\n```\n\n\
  标准服务（如上一个示例所示的 SSH 服务器）使用的端口被称为“良已知端口”。使用这些良已知端口的缺点是，黑客会尝试对这些端口上的服务进行破解攻击。因此，提供更级别安全性的一种方法是使用与标准不同的端口。例如，可以将\
  \ SSH 服务器配置为监听不同于端口 `22` 的端口。\n\n这种安全技术的缺点是，黑客仍然可以通过执行端口扫描攻击来确定正确的端口。因此，虽然这种技术可能成功阻止新手或自动攻击，但它并不是万无一失的。\n\
  \n## 禁用或卸载未用和不安全服务的重要性\n\n某些服务应该永远不要使用或应谨慎使用。下一节重点关注不安全的服务以及应该使用的有限范围。\n\n### FTP\n\
  \n文件传输协议（FTP）是一种常用的用于在系统之间传输文件的协议。由于数据在 FTP 客户端和服务器之间是以明文发送的，因此该协议是不安全的。这些数据包括任何用户账户信息，这意味着任何可以“嗅探”网络的人都能看到用户名和密码。\n\
  \nFTP 服务器确实提供了一个重要且实用的功能：匿名 FTP 服务。匿名 FTP 服务器不需要任何用户验证，并且应该只允许下载内容（不允许上传）。这允许某创建一个仓库，其中存储供任何人下载的内容（例如\
  \ Linux 发行版的 ISO 文件）。\n\n### Telnet\n\ntelnet 协议允许远程登录，但与 ssh 不同，它不提供加密。虽然可以使用 `telnet`\
  \ 命令测试到远程端口的连接，但在安全至重要的现代系统中，不应使用 telnet 服务器。\n\n### Finger\n\nfinger 术语与 Name/Finger\
  \ 协议有关，该协议旨在提供有关计算机和用户的信息。`finger` 命令长期以来用作提供用户报告的方法。然而，由于这些信息是通过网络以明文发送的，在安全至重要的现代系统中，绝不应使用此命令和协议。\n\
  \n### Sendmail\n\n参见下一节的“Postfix”。\n\n### Postfix\n\nsendmail 和 postfix 都是邮件服务器。通常，本地系统不需要电子邮件服务，或者至少外部不需要电子邮件。真正的邮件服务器应该配置为在远程邮件服务器之间发送和接收消息。\n\
  \n桌面系统和绝大多数非邮件服务器不应被配置为处理外部电子邮件。这可能需要对这些服务进行一些配置更改。\n\n实际上，除非有需要进行远程访问，否则你真的应该考虑禁用或限制所有服务。例如，在大多数\
  \ Linux 发行版中，CUPS 打印服务器默认安装并配置为启动。如果相关系统不需要打印，请禁用并可能删除 CUPS 软件。\n\n## 启用 SSL/TLS\
  \ 的重要性\n\n安全套接层（SSL）和传输层安全（TLS）是超文本传输安全协议（HTTPS）背的技术。HTTPS 允许网络客户端和服务器以安全的方式连接。在访问敏感数据的\
  \ Web 服务器（如银行账户或在线购物网站）上，启用这些技术至关重要。用户可能会登录网站也应启用这些技术以保护用户账户数据。这些技术确保网络客户端访问的是正确的\
  \ Web 服务器，而不是伪装成真实网站的某些恶意 Web 服务器。\n\n## 启用 auditd 的重要性\n\n`auditd` 守护进程用于记录用户账户活动。它允许管理员确定用户是否执行了任何未经授权的操作。\n\
  \n## CVE 监控\n\n常见漏洞披露（CVE）是一个提供有关公开漏洞信息的系统。一旦在软件程序或操作系统中发现了漏洞，就会创建一个 CVE 报告。出于安全考虑，管理员应该监控相关报告并尽快对漏洞实施修复。未能这样做可能会导致系统被破坏。\n\
  \n### 不建议使用 USB 设备\n\nUSB 设备通常用于在桌面系统上存储和传输数据。但在服务器上，它们可能会带来安全风险，因为黑客可能向服务器注入数据或直接从服务器窃取数据。因此，禁用\
  \ USB 设备是常见做法，通常通过 BIOS 中的设置来实现。\n\n\n\n\n\n即使在桌面级系统上，使用 USB 设备也会带来风险。如果桌面系统访问了敏感信息，USB\
  \ 设备可能被用于窃取数据。此外，用户可能会无意中通过 USB 设备带入病毒或蠕虫软件。在某些组织中，USB 设备不仅被不建议使用，是被禁止的。\n\n## 磁盘加密\n\
  \n磁盘加密技术使得，除非磁盘未加密，否则几乎无法访问硬盘上的数据。这可以在系统被盗时保护硬盘上的数据，因此它被广泛用于笔记本电脑设备。\n\n当系统启动时，磁盘上的文件系统是未加密的。这意味着当用户当前登录时，磁盘并不是加密状态；相反，它只在系统未运行运行时处于加密状态。\n\
  \n更多细节请参阅下一节的 `LUKS` 小节。\n\n### LUKS\n\nLinux 统一密钥设置 (LUKS) 是一种常用在 Linux 系统的磁盘加密方法。当前版本的\
  \ LUKS 使用内核模块（`dm-crypt`）来执行加密和解密操作。\n\n## 限制 cron 访问\n\n普通用户有时会使用 cron 在非工作时间执行系统操作和运行代码。这种设计是为了利用系统活动较少的时间段。\n\
  \n有时用户会滥用此服务，在关键系统上执行他们不应执行的代码。作为管理员，你可以通过将用户名添加到 `/etc/cron.deny` 文件来限制 cron 访问。\n\
  \n## 禁用 Ctrl-Alt-Del\n\n有多种方法旨在防止执行 Ctrl-Alt-Del（取决于你特定的 Linux 发行版）。然而，禁用 Ctrl-Alt-Del\
  \ 的目的在所有 Linux 发行版上都是类似的：你想防止用户通过“三指礼”重启系统。\n\n在 x86 系统上，按住 `Ctrl` 和 `Alt` 键同时按下\
  \ `Del` 键会导致系统重启。在桌面系统中可能不是坏事，但在服务器上这无疑会导致问题。\n\n如果你有物理可访问的服务器（实际上任何带有键盘的服务器），请研究如何禁用\
  \ Ctrl-Alt-Del，并将此更改作为常规安全策略的一部分启用。\n\n## 添加 Banner\n\n许多提供远程访问的服务（如 FTP、SSH 或 Web\
  \ 服务器）都有“横幅”（Banner）的概念。Banner 是在用户尝试登录系统之前显示的消息。通常，这用于向用户提供有关访问系统的警告，例如只有授权用户才应尝试访问系统。在某些情况下，这些\
  \ Banner 消息是法律要求的。\n\n每个服务都有设置 Banner 的方法。你需要查阅文档来确定具体如何执行此操作。\n\n## MOTD\n\n用户登录系统后，系统会显示\
  \ `/etc/motd` 文件的内容。“每日消息”（MOTD）文件的目的是让管理员为用户提供有关其刚刚登录的系统的有用信息。\n\n## 第 18 章. 在给定场景下，实现日志服务\n\
  \n本章提供了有关以下主题的信息和命令：\n\n**关键文件位置**\n\n- `/var/log/secure(#ch18.xhtml_ch18lev2sec1)`\n\
  - `/var/log/messages(#ch18.xhtml_ch18lev2sec2)`\n- `/var/log/application`\n- `/var/log/kern.log(#ch18.xhtml_ch18lev2sec4)`\n\
  \n**日志管理**\n\n- 第三方代理\n- logrotate\n- `/etc/rsyslog.conf(#ch18.xhtml_ch18lev2sec7)`\n\
  - journald, journalctl\n- lastb\n\n### 关键文件位置\n\n`/var/log` 目录是放置日志文件的标准位置。这些日志文件某些由日志守护进程创建，另一些由单个应用程序创建。本节涵盖了部分关键日志文件。\n\
  \n### /var/log/secure\n\n`/var/log/secure` 文件包含与身份验证和授权操作相关的日志条目。这可能包括用户登录、尝试获取权限以及其他安全相关的任务条目。\n\
  \n下面的示例演示了通过 SSH 成功登录：\n\n点击此处查看代码图像\n\n```\n[root@OCS ~]# tail -n 2 /var/log/secure\n\
  Oct 13 16:34:55 OCS sshd[7547]: Accepted password\n  for sarah from 72.220.222.74\
  \ port 63970 ssh2\nOct 13 16:34:55 OCS sshd[7547]: pam_unix(sshd:session):\n  session\
  \ opened for user sarah by (uid=0)\n```\n\n注意 `/var/log/secure` 条目是由日志守护进程生成的。详情请参阅本章的\
  \ `LUKS` 小节。\n\n### /var/log/messages\n\n`/var/log/messages` 文件包含各种条目。你可以预期看到来自许多服务的消息，包括内核和邮件系统。\n\
  \n`/var/log/secure` 文件包含与身份验证和授权操作相关的日志条目。这可能包括用户登录、尝试获取权限以及服务器的条目。\n\n下面的示例演示了\
  \ `crond` 重重启：\n\n```\n[root@OCS ~]# tail -n 2 /var/log/secure\nOct 13 16:34:55\
  \ OCS systemd: Stopping...\nOct 13 16:34:55 OCS systemd: Starting...\n```\n\n注意\
  \ `/var/log/messages` 条目是由日志守护进程生成的。详情请参阅本章的 `LUKS` 小节。\n\n### /var/log/[application]\n\
  \n大多数现代应用程序或服务器在没有日志服务协助的情况下创建日志文件。例如，考虑以下输出：\n\n点击此处查看代码图像\n\n```\n[root@OCS ~]#\
  \ ls /var/log\naudit                journal                  ppp\nboot.log     \
  \        mail                    README\nclamav               mailman          \
  \        sa-update\ncron                 mariadb                  wtmp\ndrupal.log\
  \           ntp                     xferlog\nhttpd\n```\n\n在之前的输出中显示的的日志文件中，只有少数几个由日志守护进程管理。例如：\n\
  \n- `yum` 工具将消息写入 `/var/log/yum.log`。\n- MariaDB 数据库程序将日志文件存储在 `/var/log/mariadb`。\n\
  - CUPS 打印服务器将日志文件存储在 `/var/log/cups`。\n\n应用程序日志文件是否存在取决于系统中安装并启用了哪些软件。\n\n### /var/log/kern.log\n\
  \n`/var/log/kern.log` 文件包含来自内核的消息。例如，以下内容演示了启动过程中生成的一些内核消息：\n\n点击此处查看代码图像\n\n```\n\
  [root@OCS ~]# ls /var/kern.log\nJun 22 04:03:53 mail kernel: [ 0.000000] Initializing\n\
  \  cgroup subsys cpuset\nJun 22 04:03:53 mail kernel: [ 0.000000] Initializing\n\
  \  cgroup subsys cpu\nJun 22 04:03:53 mail kernel: [ 0.000000] Initializing\n  cgroup\
  \ subsys cpuacct\nJun 22 04:03:53 mail kernel: [ 0.000000] Linux\n  version 3.19.8-100.fc20.x86_64\
  \ (mockbuild@bkernel01.phx2\n  .fedoraproject.org) gcc version 4.8.3 20140911 (Red\
  \ Hat 4.8.3-7)\n  (GCC) ) #1 SMP May 12 17:08:50 UTC 2015\nJun 22 04:03:53 mail\
  \ kernel: [ 0.000000] Command line:\n  root=LABEL=root ro quiet biosdevname=0 LANG=en_US.utf8\n\
  ```\n\n\n\n\n请注意 `/var/log/kern.log` 条目是由日志守护进程生成的（尽管某些 Linux 发行版不创建此文件，而是将内核消息存储在\
  \ `/var/log/messages` 文件中）。有关这些守护进程的详细信息，请参阅本章中的“第三方代理”子节。\n\n## 日志管理\n\n作为管理员，你不仅需要知道日志文件存储在哪里，还需要知道如何管理这些文件。这包括配置生成哪些日志，以及备份和丢弃旧日志条目的频率。本节将重点关注这些重要任务。\n\
  \n### 第三方代理\n\nsyslog 服务自 1980 年以来一直存在。尽管它在创建时是非常先进的，但随着对复杂日志技术的需求，其局限性随着时间的推移而增加。\n\
  \n在 21 世纪 20 年代中期，了 `rsyslog` 服务，它是传统 syslog 服务的扩展。`rsyslog` 服务包含了通过模块扩展功能的能力。\n\
  \n这些服务的配置（`syslog.conf` 文件的格式）是一致的，不同之处在于命名略略不同（例如 `rsyslog.conf`）以及日志文件中提供的额外功能。\n\
  \n`syslogd` 或 `rsyslogd` 守护进程负责应用程序和系统事件的记录。它通过位于 `/etc/syslog.conf` 文件中的配置设置，决定记录哪些事件以及将日志条目放在何处。\n\
  \n以下是 `syslogd` 和 `rsyslogd` 命令的一些重要选项：\n\n| 选项 | 说明 |\n| --- | --- |\n| `-d` |\
  \ 启用调试模式。 |\n| `-f` | 指定配置文件（默认为 `/etc/syslog.conf`）。 |\n| `-m x` | 每隔 `x` 分钟在日志文件中创建一个时间戳。设置为\
  \ 0 则省略时间戳。 |\n| `-r` | 使 `syslogd` 守护进程接受来自远程系统的日志。 |\n| `-S` | 启用详细模式。 |\n| `-x`\
  \ | 禁止对 IP 地址进行 DNS 查询。 |\n\n### logrotate\n\n`logrotate` 命令是一个实用程序，用于确保存放日志文件的分区有足够的空间处理它们。日志文件的大小随时间推移而增加。`logrotate`\
  \ 命令随时间轮转日志文件，以限制日志使用的文件系统空间。\n\n该命令通过 `/etc/logrotate.conf` 文件和 `/etc/logrotate.d`\
  \ 中的文件进行配置。通常，`logrotate` 命令被配置为作为 cron 作业自动运行：\n\n点击此处查看代码图像\n\n```\n[root@OCS\
  \ ~]# cat /etc/cron.daily/logrotate\n#!/bin/sh\n\n/usr/sbin/logrotate /etc/logrotate.conf\n\
  EXITVALUE=$?\nif [ $EXITVALUE != 0 ]; then\n     /usr/bin/logger -t logrotate \"\
  ALERT exited\n  abnormally with [$EXITVALUE]\"\nfi\nexit 0\n```\n\n`/etc/logrotate.conf`\
  \ 文件是 `logrotate` 命令的主要配置文件。这是一个典型的 `/etc/logrotate.conf` 文件示例：\n\n点击此处查看代码图像\n\n\
  ```\n[root@OCS ~]# cat /etc/logrotate.conf\n# 详情请参阅 \"man logrotate\"\n# 每周轮转日志文件\n\
  weekly\n\n# 保留 4 周的备份日志\nrotate 4\n\n# 在轮转旧文件后创建新的（空）日志文件\ncreate\n\n# 如果你想压缩日志文件，请取消注释\n\
  #compress\n\n# RPM 包将日志轮转信息放入此目录\ninclude /etc/logrotate.d\n\n# 没有包拥有 wtmp -- 我们将在这里进行轮转\n\
  /var/log/wtmp {\n     monthly\n     minsize 1M\n     create 0664 root utmp\n   \
  \  rotate 1\n}\n```\n\n该文件的顶部部分用于启用适用于 `logrotate` 实用程序轮转的所有文件的全局设置。这些全局设置可以通过如下定义的节对单个文件进行覆盖：\n\
  \n点击此处查看代码图像\n\n```\n/var/log/wtmp {\n     monthly\n     minsize 1M\n     create\
  \ 0664 root utmp\n     rotate 1\n}\n```\n\n这些部分也出现在 `/etc/logrotate.d` 目录下的文件中。在本节的稍后部分将介绍更多相关内容。\n\
  \n###表详细说明了 `/etc/logrotate.conf` 文件中的一些重要设置：\n\n| 设置 | 说明 |\n| --- | --- |\n| `daily|weekly|monthly`\
  \ | 轮转文件的频率。 |\n| `rotate x` | 保留 `x` 个旧（备份）文件。 |\n| `create` | 在备份旧日志文件时创建一个新的日志文件。\
  \ |\n| `compress` | 压缩备份日志文件，默认使用 gzip；可以通过 `compresscmd` 设置更改 `compress` 命令。 |\n\
  | `compresscmd` | 指定在压缩备份日志文件时使用的压缩工具。 |\n| `datetext` | 备份日志文件的通常命名规则为 `logfile.x`，其中\
  \ `x` 代表数字（0, 1, 2 等）；使用 `datetext` 将将扩展名改为日期值（YYYYMMDD）。 |\n| `mail address` |\
  \ 将备份日志文件邮件发送到 `address`。 |\n| `minsize x` | 仅当日志文件大小至少达到 `x` 指定的值时才进行轮转。 |\n| `nocompress`\
  \ | 不压缩日志文件的备份副本。 |\n| `olddir dir` | 将备份日志文件放在 `dir` 目录中。 |\n\n`/etc/logrotate.d`\
  \ 目录下的文件用于覆盖 `logrotate` 实用程序 `/etc/logrotate.conf` 文件中的默认设置。这些文件的设置与 `/etc/logrotate.conf`\
  \ 文件的设置相同。\n\n### /etc/rsyslog.conf\n\n`/etc/rsyslog.conf` 文件是 `syslogd` 守护进程配置文件之一。以下展示了一个典型的\
  \ `rsyslog.conf` 文件，并删除了注释和空行（同样注意，输出中还删除了名为模块的更高级功能）：\n\n点击此处查看代码图像\n\n```\n[root@OCS\
  \ ~]# grep -v \"^$\" /etc/rsyslog.conf | grep -v \"^#\"\n*.info;mail.none;authpriv.none;cron.none\
  \    /var/log/messages\nauthpriv.*                                  /var/log/secure\n\
  mail.*                                      -/var/log/maillog\ncron.*          \
  \                            /var/log/cron\n*.emerg                            \
  \         *\nuucp,news.crit                              /var/log/spooler\nlocal7.*\
  \                                    /var/log/boot.log\n```\n\n每一行代表一条日志规则，分为两个主要部分：选择器（例如\
  \ `uucp,news.crit`）和动作（`/var/log/spooler`）。选择器也分为两部分：设施（`uucp,news`）和优先级（`crit`）。\n\
  \n以下列表列出了可用的设施：\n\n* auth（或 security）\n* authpriv\n* cron\n* daemon\n* kern\n* lpr\n\
  * mail\n* mark\n* news\n* syslog\n* user\n* uucp\n* local0 到 local7\n\n以下列表列出了可用的优先级：\n\
  \n* debug\n* info\n* notice\n* warning（or warn )\n* err（or error)\n* crit\n* alert\n\
  * emerg（or panic)\n\n以下列表列出了可用的动作：\n\n* 普通文件（在文件名前使用 \"-\" 可以跳过每次日志条目的同步，从而减少硬盘写入）\n\
  * 命名管道\n* 控制台或终端设备\n* 远程主机\n* 用户(s)，将日志写入指定用户的终端窗口（使用 ***** 表示所有用户）\n\n### journald\n\
  \n`journald` 服务（有时也称为 `systemd-journald`）以特殊文件格式存储日志条目，以优化日志记录。本节介绍了 `journalctl`\
  \ 命令，它用于显示 `journald` 日志条目。\n\n### journalctl\n\n在现代 Linux 系统中，日志处理由 `systemd-journald`\
  \ 服务处理。查询 systemd 日志条目请使用 `journalctl` 命令：\n\n点击此处查看代码图像\n\n\n\n\n\n```\n[root@OCS\
  \ ~]# journalctl | head\n-- Logs begin at Tue 2017-01-24 13:43:18 PST, end\n  at\
  \ Sat 2017-03-04 16:00:32 PST. --\nJan 24 13:43:18 localhost.localdomain\n  systemd-journal[88]:\
  \ Runtime journal is using 8.0M\n  (max allowed 194.4M, trying to leave 291.7M free\n\
  \  of 1.8G available → current limit 194.4M).\nJan 24 13:43:18 localhost.localdomain\n\
  \  systemd-journal[88]: Runtime journal is using 8.0M\n  (max allowed 194.4M, trying\
  \ to leave 291.7M free of 1.8G\n  available → current limit 194.4M).\nJan 24 13:43:18\
  \ localhost.localdomain kernel:\n  Initializing cgroup subsys cpuset\nJan 24 13:43:18\
  \ localhost.localdomain kernel:\n  Initializing cgroup subsys cpu\nJan 24 13:43:18\
  \ localhost.localdomain kernel:\n  Initializing cgroup subsys cpuacct\nJan 24 13:43:18\
  \ localhost.localdomain kernel:\n  Linux version 3.10.0-327.18.2.el7.x86_64\n  (builder@kbuilder.dev.centos.org)\
  \ (gcc version\n  4.8.3 20140911 (Red Hat 4.8.3-9) (GCC) ) #1 SMP\n  Thu May 12\
  \ 11:03:55 UTC 2016\nJan 24 13:43:18 localhost.localdomain kernel: Command\n  line:\
  \ BOOT_IMAGE=/vmlinuz-3.10.0-327.18.2.\n  el7.x86_64 root=/dev/mapper/centos-root\
  \ ro\n  rd.lvm.lv=centos/root rd.lvm.lv=centos/swap\n  crashkernel=auto rhgb quiet\
  \ LANG=en_US.UTF-8\nJan 24 13:43:18 localhost.localdomain kernel:\n  e820: BIOS-provided\
  \ physical RAM map:\nJan 24 13:43:18 localhost.localdomain kernel:\n  BIOS-e820:\
  \ [mem 0x0000000000000000-0x000000000009fbff] usable\n```\n\n以下是 `journalctl` 命令的一些重要选项：\n\
  \n| 选项 | 说明 |\n| --- | --- |\n| `--all` 或 `-a` | 以完整格式显示所有字段。 |\n| `-r` | 反转日志顺序，使最新的条目显示在前。\
  \ |\n| `-k` | 仅显示内核消息。 |\n| `--priority=value` | 仅显示优先级匹配 `value` 的消息（`emerg`、`alert`、`crit`、`err`、`warning`、`notice`、`info`\
  \ 或 `debug`）。 |\n\n`/etc/systemd/journald.conf` 文件用于配置 `systemd-journald` 服务。通常情况下，该文件默认包含所有被注释掉的取值。以下是\
  \ `/etc/systemd/journald.conf` 文件的某些重要设置：\n\n| 设置 | 说明 |\n| --- | --- |\n| `Storage=value`\
  \ | 指明存储日志数据的位置；`value` 可以是 `volatile`、`persistent`、`auto` 或 `none`。 |\n| `compress=[1|0]`\
  \ | 如果设置为 `1`（真），则该选项表示在写入文件之前对日志条目进行压缩。 |\n\n如果在 `/etc/systemd/journald.conf` 文件中设置了\
  \ `Storage=persistent`，`systemd-journald` 服务会将日志条目存储在 `/var/log/journal` 目录下。\n\n\
  ### lastb\n\n`lastb` 命令显示失败的登录尝试。\n\n示例：\n\n点击此处查看代码图片\n\n```\n[root@OCS ~]# lastb\
  \ -n 8\nzabbix ssh:notty 203.153.32.67  Mon Oct 1 05:03 - 05:03 (00:00)\nzabbix\
  \ ssh:notty 203.153.32.67  Mon Oct 1 05:03 - 05:03 (00:00)\nsteven ssh:notty 211.73.25.162\
  \  Mon Oct 1 04:45 - 04:45 (00:00)\nsteven ssh:notty 211.73.25.162  Mon Oct 1 04:45\
  \ - 04:45 (00:00)\nadmin  ssh:notty 41.41.98.82    Mon Oct 1 03:42 - 03:42 (00:00)\n\
  admin  ssh:notty 41.41.98.82    Mon Oct 1 03:42 - 03:42 (00:00)\nadmin  ssh:notty\
  \ 143.255.154.98 Mon Oct 1 03:42 - 03:42 (00:00)\nadmin  ssh:notty 143.255.154.98\
  \ Mon Oct 1 03:42 - 03:42 (00:00)\n\nbtmp begins Mon Oct 1 03:42:01 2018\n```\n\n\
  以下是 `lastb` 命令的一些重要选项：\n\n| 选项 | 说明 |\n| --- | --- |\n| `-a` | 在输出的最后一列显示主机名或 IP\
  \ 地址。 |\n| `-d` | 以 DNS 查询结果显示主机名（查询所有条目可能需要很长时间）。 |\n| `-F` | 显示完整的日期时间戳。 |\n|\
  \ `-n x` | 显示最后 `x` 条条目（用数字替换 `x`）。 |\n\n## 第 19 章. 给定场景下，实现并配置 Linux 防火墙\n\n本章提供了关于以下主题的信息和命令：\n\
  \n### 访问控制列表\n*   源\n*   目的\n*   端口\n*   协议\n*   日志\n*   有状态 vs 无状态\n*   允许 (Accept)\n\
  *   拒绝 (Reject)\n*   丢弃 (Drop)\n*   日志记录\n\n### 技术\n*   firewalld (区域，运行时)\n*  \
  \ iptables (持久性，链)\n*   ufw (`/etc/default/ufw`, `/etc/ufw/`)\n*   Netfilter\n\n\
  ### IP 转发\n*   `/proc/sys/ipv4/ip_forward`\n*   `/proc/sys/ipv6/conf/all/forwarding`\n\
  \n### 动态规则集\n*   Fail2ban\n*   防火墙\n\n### 访问控制列表\n\n*防火墙*（又称访问控制列表）是一种网络设备（硬件或软件），设计用于允许或阻塞网络流量。防火墙可以实现在多种设备上，包括路由器、服务器和用户系统。本节探讨了防火墙的基本概念。注意，`iptables`\
  \ 子节中提供了具体的示例。\n\n#### 源 (Source)\n*源*指的是网络数据包的来源。可以创建防火墙规则，根据源的 IP 地址、端口或 MAC 地址过滤来自源的网络流量。\n\
  \n#### 目的 (Destination)\n*目的*指的是网络数据包发送去。可以创建防火墙规则，根据目的的 IP 地址、端口或 MAC 地址过滤用于目的的网络流量。\n\
  \n#### 端口 (Ports)\n端口是一个用于标识系统中服务的唯一数字。网络数据包包含源端口和目的端口。可以创建防火墙规则根据源端口或目的端口过滤网络流量。\n\
  \n#### 协议 (Protocol)\n按协议过滤数据包是常见的。这可以是像 ICMP、TCP 或 UDP 的协议，也可以与特定端口相关的协议。\n\n####\
  \ 日志记录 (Logging)\n防火墙规则通常用于允许或阻塞网络数据包；但也有规则设计用于记录有关网络数据包的信息。当你想要查看将被稍后规则拦截的数据包信息时，这非常有用。\n\
  \n#### 有状态 vs 无状态 (Stateful vs. Stateless)\n有状态规则是指适用于任何已建立连接的规则。假设你有一如下如下防火墙：\n\
  \n*   允许大多数出站连接，包括访问网站、SSH 访问、FTP 站点等。\n*   阻止大多数入站连接，以便外部用户无法连接你可能运行的服务。\n\n这种场景下的问题是，当你连接到远程系统时，出站和入站规则都会生效。出站规则在你建立连接时生效，而入站规则在远程服务器响应时生效。如果你有一条阻止大多数入站连接的规则，你可能永远无法收到想要访问的网站的响应。\n\
  \n你可以通过创建“有状态规则”来克服这个问题。有状态规则本质上意味着“如果网络数据包是对本地发起请求的响应，则允许其通过防火墙”。\n\n\n\n\n\n无状态规则是指无论之前是否建立了连接都生效的规则。\n\
  \n### Accept\n\n一旦网络数据包匹配了防火墙规则的标准，将使用一个目标（target）来决定采取什么操作。`iptables` 有四个标准目标：`Accept`、`Reject`、`Drop`\
  \ 和 `Log`。\n\n`Accept` 目标告诉 `iptables` 允许数据包进入下一个过滤点。\n\n### Reject\n\n`Reject`\
  \ 目标告诉 `iptables` 带错误消息将数据包返回给源。该消息不会传递到下一个过滤点。\n\n另请参阅本章中的“Accept”子节。\n\n### Drop\n\
  \n`Drop` 目标告诉 `iptables` 丢弃数据包。不会向源发送任何响应，消息也不会传递到下一个过滤点。\n\n另请参阅本章中的“Accept”子节。\n\
  \n### Log\n\n`Log` 目标告诉 `iptables` 创建包含数据包详细信息的日志记录。使用此目标，数据包既不被显式允许也不被阻塞，但规则集（链）中的后续规则可能会决定最终结果。\n\
  \n另请参阅本章中的“Accept”子节。\n\n### Technologies\n\nLinux 系统上可以实现许多防火墙技术。本节重点介绍你将在考试中遇到的技术。\n\
  \n#### firewalld\n\n在基于 Red Hat 的发行版中，通常使用名为 `firewalld` 的实用来配置 `iptables` 规则。规则被配置为称为“区域”（zones）的类别，并通过\
  \ `firewall-cmd` 命令管理。\n\n##### Zones\n\n例如，你可以执行命令 `firewall-cmd --get-zones` 来显示所有可用区域：\n\
  \n点击此处查看代码图像\n\n```\nroot@OCS:~# firewall-cmd --get-zones\nblock dmz drop external\
  \ home internal public trusted work\n```\n\n你可以在每个区域上设置不同的规则，并将区域规则集分配给不同的接口。例如，你的\
  \ `eth0` 接口可能连接到内部网络，因此你可能应用“trusted”或“internal”区域，这些区域的限制较少。相反，你的 `eth1` 接口可能连接到互联网，这意味着“dmz”或“external”区域可能是更好的解决方案。\n\
  \n##### Run Time\n\n使用 `firewall-cmd` 命令在命令行创建的规则会影响系统中运行的防火墙。这被称为“运行时”（run time）防火墙。如果系统重启或重启防火墙服务，这些规则将会丢失。\n\
  \n要使“运行时”规则在系统或防火墙重置后持续，请使用以下命令：\n\n点击此处查看代码图像\n\n```\nroot@OCS:~# firewall-cmd\
  \ --runtime-to-permanent\n```\n\n#### iptables\n\n规则集（称为*链* chains）应用于不同的位置（称为*过滤点*\
  \ filter points），使得此 ACL 软件更具灵活性。图 19.1 展示了这些过滤点。\n\n![插图描述了过滤点。](img/19fig01.jpg)\n\
  \n**图 19.1** 数据包过滤——出站数据包\n\n规则类型（称为*表* table）可以放置在过滤点上。一个过滤点可以有一组或多组规则，因为 `iptables`\
  \ 执行多种功能：过滤（阻止或允许）数据、对数据包执行 NAT 操作，或篡改（mangle）数据包。过滤点加上表（filter、nat 或 mangle）形成了一个单一的规则集，称为*链*\
  \ chain。\n\n将链视为一组决定对特定数据包采取什么操作的*规则*。例如，“filter INPUT”链上的某条规则可以根据源 IP 地址拦截入站数据包。另一个规则可以用于允许发往特定网络端口的数据包。\n\
  \n规则的顺序也非常重要。一旦找到匹配的规则，就会执行操作（称为*目标* target），并忽略额外的规则（如下文所述，有一个例外）。\n\n有关目标的更多信息，请参阅本章中的“Accept”、“Drop](#ch19.xhtml_ch19lev2sec9)”、“Reject](#ch19.xhtml_ch19lev2sec8)”和“Log”子节。\n\
  \n下表描述了若干常见的 `iptables` 规则：\n\n| Rule | Description |\n| --- | --- |\n| `iptables\
  \ -t filter -L INPUT` | 显示 INPUT-filter 链的所有规则。 |\n| `iptables -D INPUT 1` | 从 INPUT-filter\
  \ 链中删除第 1 条规则。 |\n| `iptables -F INPUT` | 清空 INPUT-filter 链的所有规则。 |\n| `iptables\
  \ -A INPUT -s 192.168.10.100 -j DROP` | 在 INPUT-filter 链末尾添加规则，丢弃所有来自 192.168.10.100\
  \ 系统的数据包。 |\n| `iptables -A INPUT -s 192.168.20.0/24 -j DROP` | 在 INPUT-filter 链末尾添加规则，丢弃所有来自\
  \ 192.168.10.0/24 的数据包。 |\n\n##### Persistency\n\n`iptables` 进行的所有更改只影响当前防火墙。如果系统重启，规则将会丢失。\n\
  \n你可以使用 `iptables-save` 命令将规则保存到文件中。通常，该命令的输出会到屏幕，但你可以将输出重定向到文件：\n\n```\nroot@OCS:~#\
  \ iptables-save > /etc/iptables.rules\n```\n\n\n\n\n\n-   `MASQUERADE`（伪装）：当你的一个具有*动态分配*私有\
  \ IP 地址的内部网络（例如使用 DHCP）时使用。通过 `MASQUERADE`，你可以通过具有活动 IP 地址（在互联网上可路由的地址）的单一机器访问互联网。该系统通过\
  \ `MASQUERADE` 配置，用于将内部地址映射到外部通信。`MASQUERADE` 规则放置在 `POSTROUTING` 过滤点上。\n\n由于大多数内部网络使用\
  \ DHCP 分配 IP 地址，因此 `MASQUERADE` 比 `SNAT` 更常见。它也更容易配置，因为 `SNAT` 要求你为每个内部系统创建规则。而使用\
  \ `MASQUERADE`，一个命令即可处理所有内部系统：\n\n点击此处查看图片\n\n```\nroot@OCS:~# iptables -t nat -A\
  \ POSTROUTING -j MASQUERADE\n```\n\n注意，`NAT` 本身是不够的。你还必须在内核中实现 IP 转发功能。请查看下一节“IP\
  \ 转发”。\n\n### IP 转发\n\nIP 转发是一个内核功能，允许数据包从一个网络传递到另一个网络。此功能通常用于在服务器上创建路由器。\n\n这很简单，你只需要将以下文件的值设置为“1”：\n\
  \n- `/proc/sys/net/ipv4/ip_forward`：启用 IPv4 网络数据包的 IP 转发。\n- `/proc/sys/net/ipv6/conf/all/forwarding`：启用\
  \ IPv6 网络数据包的 IP 转发。\n\n### 动态规则集\n\n并不是所有规则都是手动创建的。一些工具会动态创建防火墙规则。这些工具的目标是识别系统受攻击并创建规则阻止入侵尝试。\n\
  \n#### DenyHost\n\n`DenyHost` 工具类似于 `fail2ban`，但它专门为保护 SSH 服务器设计，它不创建 `iptables`\
  \ 规则，而是创建 TCP Wrapper 规则。如果远程系统试图进行暴力攻击（使用可能的密码字典作为猜测用户密码的方法），`DenyHost` 将将在 `/etc/hosts.deny`\
  \ 文件中创建规则以阻止该远程系统。\n\n#### Fail2ban\n\n`fail2ban` 守护进程将扫描特定的日志文件，搜索通过反复连接尝试试图破解系统的系统\
  \ IP 地址。\n\n主配置文件是 `/etc/fail2ban/jails.conf` 文件。然而，如果你查看此文件，可能会看到以下消息：\n\n点击此处查看图片\n\
  \n```\n# 如何激活监狱 (JAILS)：\n#\n# 你不应该修改此文件。\n#\n# 它在发行版更新中可能会被覆盖或改进。\n#\n# 请在 jail.local\
  \ 文件或\n#  jail.d/customisation.local 中提供自定义内容。\n# ，，要更改所有监狱的默认禁封时间 (bantime)\n#\
  \ 并启用 ssh-iptables 监狱，以下（未注释的）内容将\n#  出现在 .local 文件中。\n# 详情请参阅 man 5 jail.conf。\n\
  ```\n\n你在直接修改此文件时遇到的问题是，fail2ban 软件包的更新可能会覆盖此文件。正如文件中的警告建议的那样，你可以创建带有自定义内容的 `.local`\
  \ 文件。\n\n该文件命名为 `jails.conf`，是因为远程主机由于可疑活动被放入“监狱”（jail）中。就像真正的监狱一样，意图是在特定时间后让主机离开。\n\
  \n下表描述了文件中的一些关键设置：\n\n| 设置 |  |\n| --- | --- |\n| `bantime` | 主机被封禁的时间（秒）。 |\n|\
  \ `maxretry` | 在主机被封禁之前在“findtime”内连接失败的次数。 |\n| `findtime` | “maxretry”条目使用的时间段（秒）。例如，如果应用了\
  \ `bantime = 600` `findtime = 600` `maxretry = 5` 的设置，那么在 600 秒内五次失败将导致封禁 600 秒。\
  \ |\n| `enabled` | 如果 `enabled` 设置为“true”，则启用该监狱。这是一个非常重要的设置，因为 `jail.conf` 文件中该设置的默认值为“false”。只应该启用特定的部分（你想要使用的部分）。\
  \ |\n| `ignoreip` | 允许你创建永远不封禁的 IP 地址“白名单”。 |\n\n#### IPset\n\n`IPset` 工具旨在创建 IP\
  \ 地址的“集”，然后使用该集将规则应用于一组系统。例如，以下命令将创建一个集：\n\n点击此处查看图片\n\n```\nroot@OCS:~# ipset create\
  \ test hash:net\n```\n\n接的一组规则将把 IP 地址添加到“test”集中：\n\n点击此处查看图片\n\n```\nroot@OCS:~#\
  \ ipset add test 192.168.100.0/24\nroot@OCS:~# ipset add test 192.168.100.0/24\n\
  ```\n等等，我看到原文中有两次 `192.168.100.0/24`。我将保持内容不变。\n\n```\nroot@OCS:~# ipset add test\
  \ 192.168.100.0/24\nroot@OCS:~# ipset add test 192.168.100.0/24\n```\n事实上，查看提供的源文本：\n\
  ```\nroot@OCS:~# ipset add test 192.168.100.0/24\nroot@OCS:~# ipset add test 192.168.100.0/24\n\
  ```\n等等，源文本实际上写的是：\n```\nroot@OCS:~# ipset add test 192.168.100.0/24\nroot@OCS:~#\
  \ ipset add test 192.168.100.0/24\n```\n我重新检查一下。\n\n\n\n\n\n当灾难发生时（例如硬盘故障或自然灾害），数据可能会损坏。使用归档和恢复工具可以帮助降低数据丢失的风险，并使信息从一个系统传输到另一个系统变得更容易。本节重点介绍这些工具。\n\
  \n## tar\n\n`tar` 命令的作用是将多个文件合并为一个文件。要创建一个名为 `sample.tar` 的 tar 文件，请执行以下操作：\n\n\
  点击此处查看代码图像\n\n```\ntar -cf sample.tar files_to_merge\n```\n\n列出 `.tar` 文件的内容：\n\n\
  ```\ntar -tf sample.tar\n```\n\n提取 `.tar` 文件的内容：\n\n```\ntar -xf sample.tar\n```\n\
  \n下表详细列了一些重要的选项：\n\n| Option | Description |\n\n| --- | --- |\n| `-c` | 创建一个 `.tar`\
  \ 文件。 |\n| `-t` | 列出 `.tar` 文件的内容。 |\n| `-x` | 提取 `.tar` 文件的内容。 |\n| `-f` | 指定 `.tar`\
  \ 文件的名称。 |\n| `-v` | 详细模式（提供更多关于命令正在执行的操作细节）。 |\n| `-A` | 将新文件追加到现有的 `.tar` 文件。\
  \ |\n| `-d` | 比较 `.tar` 文件与目录中文件的差异。 |\n| `-u` | 更新；仅将更新的文件追加到现有的 `.tar` 文件中。 |\n\
  | `-j` | 使用 `bzip2` 工具压缩/解压 `.tar` 文件。 |\n| `-J` | 使用 `xz` 工具压缩/解压 `.tar` 文件。 |\n\
  | `-z` | 使用 `gzip` 工具压缩/解压 `.tar` 文件。 |\n\n## cpio\n\n`cpio` 命令的作用是创建归档。你可以通过将文件名作为标准输入（STDIN）发送到命令中来创建文件归档，如下例所示：\n\
  \n点击此处查看代码图像\n\n```\n[student@OCS ~]$ find /etc -name \"*.conf\" | cpio -ov > conf.cpio\n\
  ```\n\n下表详细列了一些重要的选项：\n\n| Option | Description |\n\n| --- | --- |\n| `-d` | 与 `-i`\
  \ 选项配合使用，提取 `cpio` 文件中的目录结构及文件。 |\n| `-i` | 从 `cpio` 文件提取数据；文件应通过 STDIN 提供（例如，`cpio\
  \ -i < conf.cpio`）。 |\n| `-o` | 创建归档（输出文件）。 |\n| `-t` | 列出 `cpio` 文件的目录。 |\n| `-v`\
  \ | 详细模式。 |\n\n## dd\n\n`dd` 命令可以执行与数据备份和创建文件相关的多种操作。一种常见用途是为整个驱动器备份；例如，以下命令将整个\
  \ `/dev/sdb` 设备备份到 `/dev/sdc` 设备：\n\n点击此处查看代码图像\n\n```\n[student@OCS ~]$ dd if=/dev/sdb\
  \ of=/dev/sdc bs=4096\n```\n\n`dd` 命令的另一个用途是创建一个可以作为交换文件的大文件：\n\n点击此处查看代码图像\n\n\
  ```\n[student@OCS ~]$ dd if=/dev/zero of=/var/swapfile bs=1M count=50\n```\n\n下表详细列了一些重要的选项：\n\
  \n| Option | Description |\n\n| --- | --- |\n| `if=` | 指定输入文件。 |\n| `of=` | 指定输出文件。\
  \ |\n| `bs=` | 指定块大小。 |\n| `count=` | 指定要创建/传输的块数。 |\n\n## Compression\n\n归档文件、日志文件和邮件队列随着时间的推移可能会变得很大。使用本节涵盖的压缩工具来缩小这些文件的大小。\n\
  \n### gzip\n\n使用 `gzip` 命令压缩文件：\n\n点击此处查看代码图像\n\n```\n[student@OCS ~]$ ls -lh juju\n\
  -rwxr-xr-x 1 vagrant vagrant 109M Jan 10 09:20 juju\n[student@OCS ~]$ gzip juju\n\
  [student@OCS ~]$ ls -lh juju.gz\n-rwxr-xr-x 1 vagrant vagrant 17M Jan 10 09:20 juju.gz\n\
  ```\n\n注意，`gzip` 命令会用压缩文件替换原始文件。\n\n下表详细列了一些重要的选项：\n\n| Option | Description |\n\
  \n| --- | --- |\n| `-c` | 将输出写入 STDOUT 且不替换原始文件。使用重定向将输出数据放入新文件中（例如，`gzip -c juju\
  \ > juju.gz`）。 |\n| `-d` | 解压缩文件（你也可以使用 `gunzip` 命令）。 |\n| `-r` | 递归：当给定目录参数时，用于压缩目录（及其子目录）中的所有文件。\
  \ |\n| `-v` | 详细：显示压缩百分比。 |\n\n`gzip`、`xz` 和 `bzip2` 非常非常。最大的区别在于用于压缩文件的技术。`gzip`\
  \ 命令使用 Lempel-Ziv 编码方法，而 `bzip2` 命令使用 Burrows-Wheeler 块排序文本压缩算法和霍曼编码。`xz` 命令使用 LZMA\
  \ 和 LZMA2 压缩方法。\n\n使用 `gzip` 命令解压 gzipped 文件：\n\n点击此处查看代码图像\n\n```\n[student@OCS\
  \ ~]$ ls -lh juju.gz\n-rwxr-xr-x 1 vagrant vagrant 17M Jan 10 09:20 juju.gz\n[student@OCS\
  \ ~]$ gunzip juju\n[student@OCS ~]$ ls -lh juju\n-rwxr-xr-x 1 vagrant vagrant 109M\
  \ Jan 10 09:20 juju\n```\n\n## xz\n\n使用 `xz` 命令压缩文件：\n\n点击此处查看代码图像\n\n```\n[student@OCS\
  \ ~]$ ls -lh juju\n-rwxr-xr-x 1 vagrant vagrant 109M Jan 10 09:20 juju\n[student@OCS\
  \ ~]$ xz juju\n[student@OCS ~]$ ls -lh juju.xz\n-rwxr-xr-x 1 vagrant vagrant 17M\
  \ Jan 10 09:20 juju.xz\n```\n\n下表详细列了一些重要的选项：\n\n| Option | Description |\n\n| ---\
  \ | --- |\n| `-c` | 将输出写入 STDOUT 且不替换原始文件。使用重定向将输出数据放入新文件中（例如，`xz -c juju > juju.xz`）。\
  \ |\n| `-d` | 解压缩文件（你也可以使用 `unxz` 命令）。 |\n| `-l` | 列出现有压缩文件的信息（例如，`xz -l juju.xz`）。\
  \ |\n| `-v` | 详细：显示压缩百分比。 |\n\n`gzip`、`xz` 和 `bzip2` 命令非常相似。最大的区别在于用于压缩文件的技术。\n\n\
  ## bzip2\n\n使用 `bzip2` 命令压缩文件：\n\n点击此处查看代码图像\n\n```\n[student@OCS ~]$ ls -lh juju\n\
  -rwxr-xr-x 1 vagrant vagrant 109M Jan 10 09:20 juju\n[student@OCS ~]$ bzip2 juju\n\
  [student@OCS ~]$ ls -lh juju.bz2\n-rwxr-xr-x 1 vagrant vagrant 14M Jan 10 09:20\
  \ juju.bz2\n```\n\n注意，`bzip2` 命令会用压缩文件替换原始文件。\n\n下表详细列了一些重要的选项：\n\n| Option | Description\
  \ |\n\n| --- | --- |\n| `-c` | 将输出写入 STDOUT 且不替换原始文件。使用重定向将输出数据放入新文件中（例如，`bzip2\
  \ -c juju > juju.bz2`）。 |\n| `-d` | 解压缩文件（你也可以使用 `bunzip2` 命令）。 |\n| `-v` | 详细：显示压缩百分比。\
  \ |\n\n## zip\n\n`zip` 命令用于将多个文件合并为一个压缩文件。创建一个包含 `/etc/mail` 目录下所有文件的压缩文件 `mail.zip`，使用以下格式：\n\
  \n点击此处查看代码图像\n\n```\n[student@OCS ~]$ zip mail /etc/mail*\n  adding: etc/mail/ (stored\
  \ 0%)\n  adding: etc/mailcap (deflated 53%)\n  adding: etc/mailman/ (stored 0%)\n\
  \  adding: etc/mail.rc (deflated 49%)\n```\n\n下表详细列了一些重要的选项：\n\n| Option | Description\
  \ |\n\n| --- | --- |\n\n\n\n\n| `-d` | 解压文件（你也可以使用 `unzip` 命令）。注意，压缩文件不会被删除。 |\n\
  | `-v` | 详细模式：显示压缩百分比。 |\n| `-u` | 用新内容更新 `.zip` 文件。 |\n| `-r` | 递归压缩，意味着你可以指定目录，该目录下的所有内容（包括所有子目录及其内容）都将被压缩。\
  \ |\n| `-x file(s)` | 指定要从 .zip 文件中排除的 `file(s)`。 |\n\n## 备份类型\n\n许多备份工具允许你通过预定义的类型来指定备份内容。本节将介绍这些类型。\n\
  \n### 增量备份\n\n增量备份将包含自上次增量备份或全量备份以来发生变化的所有文件。\n\n增量备份具有几个优势：\n\n* 每次备份所需的时间比全量备份短，在大多数情况下也比差异备份更短。\n\
  * 增量备份通常比全量备份和差异备份小，因此占用的存储空间更少。\n\n然而，它也有一些缺点：\n\n* 从增量备份中恢复可能非常耗时。首先，必须恢复全量备份，然后必须恢复每个增量备份，直到达到导致数据丢失的事件。\n\
  * 从增量备份中查找特定文件可能是很困难的，因为文件可能位于不同的位置。\n\n另请参考本章中的“全量”和“差异”子节。\n\n### 全量备份\n\n通过全量备份，源端的所有内容都会被备份。这可能包括自上次备份以来没有变化的文件。\n\
  \n全量备份具有几个优势：\n\n* 所有的源数据都位于一个备份中，更容易查找。\n* 从全量备份中恢复比其他备份方法更快。\n\n然而，它也有一些缺点：\n\n\
  * 全量备份可能是一个非常耗时的过程。\n* 通常，全量备份占用的存储空间比其他方法多。\n* 如果远程执行备份，全量备份将使用的带宽比其他方法多得多。\n\n\
  另请参考本章中的“增量”和“差异”子节。\n\n### 快照克隆\n\n使用逻辑卷管理 (LVM)，你可以为逻辑卷创建一个快照，它是文件系统的冻结镜像。这允许你安全地备份运行中的文件系统，因为快照克隆始终提供快照创建时文件系统的静态视图。\n\
  \n更多关于 LVM 的细节，请参阅第 4 章中的“LVM”节，“给定场景，在 Linux 环境中管理存储](#ch04.xhtml_ch04)”。\n\n###\
  \ 差异备份\n\n差异备份将存档自上次全量备份后的任何文件。差异备份不考虑之前的差异备份或增量备份备份的文件。\n\n差异备份具有几个优势：\n\n* 所有的源数据都位于两个备份（全量和差异）中，比增量备份更容易查找文件。\n\
  * 从差异备份中恢复比增量方法更快。\n\n然而，它也有一些缺点：\n\n* 与增量备份相比，使用差异备份方案可能是一个耗时的过程。\n* 通常，差异备份占用的存储空间比增量备份多。\n\
  * 如果远程执行备份，差异备份使用的带宽比增量备份多。\n\n另请参考本章中的“增量”和“全量”子节。\n\n### 镜像\n\n*镜像* 是用于备份数据格式的术语。有几种不同的类型，包括：\n\
  \n* `tar`：由 `tar` 命令生成的文件格式。\n* `ISO`: 通常用于生成 CD-ROM 文件系统的格式。\n\n镜像非常重要，因为你需要使用正确的工具来正确处理镜像。有时文件名的扩展名（`file.tar`、`sample.iso`\
  \ 等）会提供镜像类型。在镜像没有描述性的情况下，使用 `file` 命令：\n\n点击此处查看代码镜像\n\n```\n[student@OCS ~]$ file\
  \ sample\nsample: POSIX tar archive (GNU)\n```\n\n## 离地/异地存储\n\nLinux+ 考试的目标是了解如何使用工具将数据传输到远程存储位置（称为“离地存储”）。本节介绍了这些工具。\n\
  \n### SFTP\n\n`sftp` 命令使用 SSH（Secure Shell）协议在网络上安全地传输文件。要访问远程系统，使用以下语法：\n\n```\n\
  sftp user@machine\n```\n\n登录远程系统后，你将获得一个以以下提示符开头的接口：\n\n```\nsftp>\n```\n\n在此提示符下，可以使用多个命令传输文件并执行其他操作。下表描述了这些命令中较重要的：\n\
  \n| 命令 |  |\n| --- | --- |\n| `pwd` | 显示当前远程目录。 |\n| `lpwd` | 显示当前本地目录。 |\n| `cd`\
  \ | 切换到远程系统的另一个目录。 |\n| `lcd` | 切换到本地系统的另一个目录。 |\n| `get` | 从远程系统的当前目录下载文件到本地系统的当前目录。使用\
  \ `-r` 获取整个目录结构。 |\n| `put` | 从本地当前目录上传文件到远程系统的当前目录。使用 `-r` 上传整个目录结构。 |\n| `ls`\
  \ | 显示远程系统当前目录下的文件。 |\n| `lls` | 显示本地系统当前目录下的文件。 |\n| `exit` | 退出 `sftp`。 |\n\n\
  ### SCP\n\n另参阅第 9 章中的“scp”子节，“给定场景，创建、修改和重定向文件](#ch09.xhtml_ch09)”。 |\n\n### rsync\n\
  \n另参阅第 9 章中的“rsync”子节。\n\n## 完整性检查\n\n当文件通过网络或其他手段从一个系统传输时，文件可能会被伪冒者或假文件替换。想象一下使用来自黑客注入数据的远程备份数据，这可能导致系统被破坏。\n\
  \n本节涵盖了用于验证文件完整性的技术。\n\n### MD5\n\n`md5sum` 命令创建一个唯一的“消息摘要”，可用于此后验证文件。以下操作创建了此摘要：\n\
  \n点击此处查看代码镜像\n\n```\n[student@OCS ~]$ md5sum output\nb46d07ef1778eaaabbffca5e1cc94f81\
  \ output\n```\n\n如果文件发生变化，`md5sum` 的输出也会随。\n\n以下是 `md5sum` 命令的一些重要选项：\n\n| 选项 |\
  \ 说明 |\n| --- | --- |\n| `-b` | 将文件视为二进制文件。 |\n| `-c` | 从文件中读取消息摘要并与现有文件进行比对。 |\n\
  \n### SHA\n\n与 `md5sum` 命令类似，另一组命令（`sha224sum`、`sha256sum`、`sha384sum` 和 `sha512sum`）也会创建消息摘要，但使用了不同的算法：\n\
  \n点击此处查看代码镜像\n\n```\n[student@OCS ~]$ sha256sum output\n3c00f1d1b69b5fd901d6ff087d603bb07d272911254926d870c04\n\
  \  8a69614ae96  output\n[student@OCS ~]$ sha512sum output\n5da0fb5eba5f8ac5bf9c7a58f3ca6c325294fc94595f386863c41\n\
  \  f236ea84abf115642667ef16fc5d632466a91410929339e8b80fa8\n  351f7cf982f9a20eee738\
  \  output\n```\n\n尽管算法和输出不同，这些命令与 `md5sum` 命令共享相同的选项。更多细节请参阅上一个子节“MD5”。\n\n# 第四部分：Linux\
  \ 故障排除与诊断\n\n\n\n\n\n# 第 21 章。给定场景，分析系统属性并相应修复\n\n本章提供了有关以下主题的信息和命令：\n\n## 网络监控与配置\n\
  \n- 延迟（带宽 `bandwidth`、吞吐量 `throughput`）\n- 路由路由\n- 丢包\n- 超时\n- 域名解析\n- Localhost\
  \ 与 Unix 套接字\n- 接口配置\n- 命令\n    - `nmap`\n    - `netstat`\n    - `iftop`\n    -\
  \ `route`\n    - `iperf`\n    - `tcpdump`\n    - `ipset`\n    - Wireshark\n    -\
  \ `tshark`\n    - `netcat`\n    - `traceroute`\n    - `mtr`\n    - `arp`\n    -\
  \ `nslookup`\n    - `dig`\n    - `host`\n    - `whois`\n    - `ping`\n    - `nmcli`\n\
  \    - `ip`\n    - `tracepath`\n\n## 存储监控与配置\n\n- `iostat`\n- `ioping`\n- IO 调度（`cfq`、`noop`、`deadline`）\n\
  - `du`\n- `df`\n- LVM 工具\n- `fsck`\n- `partprobe`\n\n## CPU 监控与配置\n\n- `/proc/cpuinfo`\n\
  - `uptime`\n- 负载 `loadaverage`\n- `sar`\n- `sysctl`\n\n## 内存监控与配置\n\n- `swapon`\n\
  - `swapoff`\n- `mkswap`\n- `vmstat`\n- 内存溢出 (Out of memory)\n- `free`\n- `/proc/meminfo`\n\
  - 缓冲区缓存\n- 丢失根密码\n- 单用户模式\n\n### 网络监控与配置\n本节重点关注网络接口监控相关的命令。\n\n#### 延迟\n将延迟视为通信中的任何延迟（例如，数据包从一个主机传输到另一个主机所需的时间）。有时通过往返时间（发送网络数据包并接收响应的时间）来衡量。使用\
  \ `ping` 和 `traceroute` 等工具来确定是否存在延迟问题。\n\n#### 带宽\n带宽是可以通过介质传输的最大数据量。介质可以是网络电缆、无线网络甚至是接口本身。确定带宽的一个实用工具是\
  \ `netstat`。\n\n#### 吞吐量\n吞吐量是通过介质的实际数据量。此值受许多因素限制，包括带宽和干扰。`netstat` 和 Wireshark\
  \ 工具有助于确定吞吐量。\n\n#### 路由\n路由是通过网关将网络数据从一个协议（IP）发送到另一个协议的过程。网关是一个具有多个接口并在网络之间传输数据的系统。使用\
  \ `route` 或 `netstat` 来确定主机上的路由情况。\n\n#### 饱和\n当吞吐量达到带宽值时就会发生饱和。一旦饱和成为经常发生的情况，网络就会变得缓慢或迟钝。这将增加问题并让用户感到沮丧。使用\
  \ Wireshark 等网络监控工具来确定是否频繁发生饱和。\n\n#### 丢包\n丢包是指远程系统不对传入的数据包做出响应。这可能是防火墙规则、饱和或网络配置不当导致。\n\
  \n#### 超时\n超时用于判断是否发生丢包的软件组件。程序将向远程系统发送网络数据包并等待特定的时间。如果在此期间没有收到响应，则软件认为响应超时。超时会导致错误信息。某些软件会在发生问题时使用重试值再次发送网络数据包。\n\
  \n#### 域名解析\n域名解析是将主机名转换为 IP 地址。反向域名解析是将 IP 地址转换为主机名。`dig`、`host` 和 `nslookup` 等工具可以提供域名解析功能。\n\
  \n#### Localhost 与 Unix 套接字\n“localhost”术语指的是通过本地网络接口通信系统。发送到 `localhost`（IP 地址\
  \ `127.0.0.1`）的任何网络流量都不会发送网络，而是保留在内部。然而，它的行为类似于网络流量，因此如果你在本地机器上，可以使用 Wireshark 等网络嗅探工具来查看此类流量。\n\
  \n使用“Unix 套接字”是允许同一系统上的进程相互通信的方法。此信息不通过任何网络接口发送，无法使用网络嗅探工具查看流量。这使得排查 Unix 套接字问题变得困难得多。\n\
  \n#### 接口配置\n接口配置涉及向网络接口分配设置，如 IP 地址、子网掩码和路由器信息。使用 `ip` 和 `route` 命令显示此类信息。\n\n\
  #### 命令\n本节重点关注一组对排查网络问题用的命令。\n\n##### nmap\n`nmap` 命令用于探测远程系统，以确定哪些网络端口可以从本地系统访问。要使用\
  \ `nmap` 命令，请提供要扫描的系统的 IP 地址或主机名。这是一个示例：\n\n```\n# nmap 192.168.1.1\nStarting Nmap\
  \ 5.51 ( http://nmap.org ) at 2015-10-31 23:22 PDT\nNmap scan report for 192.168.1.1\n\
  Host is up (2.9s latency).\nNot shown: 987 closed ports\nPORT     STATE SERVICE\n\
  23/tcp   open  telnet\n25/tcp   open  smtp\n53/tcp   open  domain\n80/tcp   open\
  \  http\n110/tcp  open  pop3\n119/tcp  open  nntp\n143/tcp  open  imap\n465/tcp\
  \  open  smtps\n563/tcp  open  snews\n587/tcp  open  submission\n993/tcp  open \
  \ imaps\n995/tcp  open  pop3s\n5000/tcp open  upnp\nNmap done: 1 IP address (1 host\
  \ up) scanned in 4.89 seconds\n```\n\n\n\n\n\n`netstat` 命令用于显示网络统计信息，以确定数据传输或接收是否存在问题。有关此命令的详情，请参阅第\
  \ 3 章中的“route”节或“给定场景，配置并验证网络连接参数”。\n\n### iftop\n\n`iftop` 命令提供了一种显示占用带宽最大的网络连接的方法。它是一个交互式显示，默认每秒更新一次，用于显示“顶部”网络连接。示例请参见图\
  \ 21.1。\n\n![截图显示了“iftop 命令”窗口，其中显示了带有累计值、峰值和速率速率的传输和接收率。](img/21fig01.jpg)\n\n\
  **图 21.1** `iftop` 命令\n\n### route\n\n`route` 命令用于显示路由表，以确定到另一个网络的路由是否配置正确。有关此命令的详情，请参阅第\
  \ 3 章中的“route”节。\n\n### iperf\n\n`iperf` 命令提供创建两个系统之间吞吐量测试的方法。它需要在两个系统上安装并配置该工具：一个客户端和一个服务器。该命令的完整用法超出了考试范围。你应该了解该工具的作用以及它需要同时设置客户端和服务器这一事实。\n\
  \n### tcpdump\n\n在排排除网络问题或执行网络安全审计时，查看网络流量（包括与本地机器相关的流量）会有帮助。`tcpdump` 命令是一个“数据包嗅探器”，允许你查看本地网络流量。\n\
  \n默认情况下，`tcpdump` 命令会将所有网络流量输出到标准输出，直到你终止命令。这可能会导致屏幕上飞过大量数据。你可以使用 `-c` 选项将输出限制为特定的网络包数量：\n\
  \n点击此处查看代码图像\n\n```\n# tcpdump -c 5\ntcpdump: verbose output suppressed, use -v\
  \ or -vv for full\n  protocol decode\nlistening on eth0, link-type EN10MB (Ethernet),\
  \ capture size 65535 bytes\n11:32:59.630873 IP localhost.43066 > 192.168.1.1.domain:\n\
  \  16227+ A? onecoursesource.com. (37)\n11:32:59.631272 IP localhost.59247 > 192.168.1.1.domain:\n\
  \  2117+ PTR? 1.1.168.192.in-addr.arpa. (42)\n11:32:59.631387 IP localhost.43066\
  \ > 192.168.1.1.domain:\n  19647+ AAAA? onecoursesource.com. (37)\n11:32:59.647932\
  \ IP 192.168.1.1.domain > localhost.59247:\n  2117 NXDomain* 0/1/0 (97)\n11:32:59.717499\
  \ IP 192.168.1.1.domain > localhost.43066:\n  16227 1/0/0 A 38.89.136.109 (53)\n\
  5 packets captured\n5 packets received by filter\n0 packets dropped by kernel\n\
  ```\n\n### ipset\n\nIPSet 工具设计用于创建 IP 地址的“集合（set）”，然后使用该集合对一组系统应用规则。例如，以下命令将创建一个集合：\n\
  \n点击此处查看代码图像\n\n```\nroot@OCS:~# ipset create test hash:net\n```\n\n下一组规则将将 IP 地址\
  \ 添加到“test”集合中：\n\n点击此处查看代码图像\n\n```\nroot@OCS:~# ipset add test 192.168.100.0/24\n\
  root@OCS:~# ipset add test 192.168.110.0/24\nroot@OCS:~# ipset add test 192.168.120.0/24\n\
  ```\n\n接下来的命令将此规则应用到该集合：\n\n点击此处查看代码图像\n\n```\nroot@OCS:~# iptables -I INPUT -m\
  \ set --match-set\n  test src -j LOG\n```\n\n有关 `iptables` 命令和防火墙配置的更多详情，请参阅第 19\
  \ 章“给定场景，实现并配置 Linux 防火墙”。\n\n### Wireshark\n\nWireshark 是一个强大的网络嗅探器，提供了基于 GUI 和\
  \ TUI 的工具。要启动 GUI 工具，执行 `wireshark` 命令。输出应类似于图 21.2。\n\n![截图显示了“Wireshark 网络分析器”窗口，其中选中了“Welcome\
  \ to Wireshark”按钮。在“Capture using this filter”字段中选择了“enp0s3”，另一个下拉菜单设置为“All interfaces\
  \ shown”。](img/21fig02.jpg)\n\n**图 21.2** `wireshark` 命令\n\n要查看网络流量，你需要启动捕获。点击 **Capture**、**Start**。你还可以通过设置过滤器和选项来限制捕获的内容（点击\
  \ **Capture**、**Options**）。\n\n要使用基于 TUI 的版本的 Wireshark，请以 root 用户身份执行 `tshark`\
  \ 命令。这是一个示例：\n\n点击此处查看代码图像\n\n```\n# tshark\nCapturing on 'enp0s3'\n    1 0.000000000\
  \      10.0.2.15 → 68.105.28.11 DNS\n  81 Standard query 0xeec4 A google.com OPT\n\
  \    2 0.001031279      10.0.2.15 → 68.105.28.11 DNS\n  81 Standard query 0x3469\
  \ AAAAgoogle.com OPT\n    3 0.017196416 68.105.28.11 → 10.0.2.15 DNS\n  109 Standard\
  \ query response 0x3469 AAAA google.com AAAA\n2607:f8b0:4007:800::200e OPT\n   \
  \ 4 0.017265061 68.105.28.11 → 10.0.2.15 DNS\n  97 Standard query response 0xeec4\
  \ A google.com A 172.217.14.110 OPT\n    5 0.018482388 10.0.2.15 → 172.217.14.110\
  \ ICMP\n  98 Echo (ping) request id=0x122c, seq=1/256, ttl=64\n    6 0.036907577\
  \ 172.217.14.110 → 10.0.2.15 ICMP\n  98 Echo (ping) reply id=0x122c, seq=1/256,\
  \ ttl=251 (request in 5)\n    7 1.021052811 10.0.2.15 → 172.217.14.110 ICMP\n  98\
  \ Echo (ping) request id=0x122c, seq=2/512, ttl=64\n    8 \n```\n\n### tshark\n\n\
  请参本章中的“Wireshark”节。\n\n### netcat\n\n`nc`（也称为 netcat）的帮助页提供了关于 `nc` 的精彩总结：“nc（netcat）工具用于任何涉及\
  \ TCP 或 UDP 的操作。它可以打开 TCP 连接、发送 UDP 数据包、在任意 TCP 和 UDP 端口进行监听、进行端口扫描并处理 IPv4 和 IPv6。”\n\
  \n你可以使用 `nc` 命令显示开放端口，类似于 `netstat` 命令：\n\n点击此处查看代码图像\n\n```\n# nc -z localhost\
  \ 1000-4000\nConnection to localhost 3260 port [tcp/iscs-target] succeeded!\nConnection\
  \ to localhost 3333 port [tcp/dec-notes] succeeded!\n```\n\n`-z` 选项也可对远程主机进行端口扫描。下表描述了该命令的其他选项：\n\
  \n| 选项 | 描述 |\n| --- | --- |\n| **-w** | 用于客户端在达到值后关闭连接。例如，`nc -w 30 server 333`\
  \ 在建立连接 30 秒后关闭。 |\n| **-6** | 使用此选项启用 IPv6 连接。 |\n| **-k** | 在客户端断开后保持服务器进程活跃。默认行为是在客户端断开时停止服务器进程。\
  \ |\n| **-u** | 使用 UDP 连接而非 TCP（默认）。这对于正确测试防火墙配置非常重要，因为 UDP 端口可能未被阻塞而 TCP 端口却被。\
  \ |\n| **-l** *port_num* | 使 `nc` 命令作为服务器运行，监听由 *port_num* 参数指定的端口。 |\n\n### traceroute\n\
  \n当你向远程系统发送网络数据包（特别是跨越 Internet 时），它通常需要经过多个网关才能到达目的地。你可以通过执行 `traceroute` 命令查看数据包通过的网关：\n\
  \n点击此处查看代码图像\n\n\n\n\n\n```\n# traceroute onecoursesource.com\ntraceroute to onecoursesource.com\
  \ (38.89.136.109), 30 hops max, 60 byte\npackets\n 1  10.0.2.2  (10.0.2.2) 0.606\
  \ ms  1.132 ms   1.087 ms\n 2  b001649-3.jfk01.atlas.cogentco.com (38.104.71.201)\n\
  \  0.738 ms  0.918 ms  0.838 ms\n 3  154.24.42.205 (154.24.42.205)  0.952 ms   0.790\
  \ ms 0.906 ms\n 4  be2629.ccr41.jfk02.atlas.cogentco.com (154.54.27.66)\n  1.699\
  \ ms  1.643 ms 1.347 ms\n 5  be2148.ccr41.dca01.atlas.cogentco.com (154.54.31.117)\n\
  \  8.053 ms  7.719 ms  7.639 ms\n 6  be2113.ccr42.atl01.atlas.cogentco.com (154.54.24.222)\n\
  \  18.276 ms 18.418 ms 18.407 ms\n 7  be2687.ccr21.iah01.atlas.cogentco.com (154.54.28.70)\n\
  \  32.861 ms  32.917 ms  32.719 ms\n 8  be2291.ccr21.sat01.atlas.cogentco.com (154.54.2.190)\n\
  \  38.087 ms  38.025 ms  38.076 ms\n 9  be2301.ccr21.elp01.atlas.cogentco.com (154.54.5.174)\n\
  \  48.811 ms  48.952 ms  49.151 ms\n10  be2254.ccr21.phx02.atlas.cogentco.com (154.54.7.33)\n\
  \  57.332 ms 57.281 ms  56.896 ms\n11 te2-1.mag02.phx02.atlas.cogentco.com (154.54.1.230)\n\
  \  56.666 ms 65.279 ms  56.520 ms\n12  154.24.18.26 (154.24.18.26)  57.924 ms 58.058\
  \ ms  58.032 ms\n13  38.122.88.218 (38.122.88.218)  79.306 ms 57.740 ms 57.491 ms\n\
  14  onecoursesource.com (38.89.136.109)  58.112 57.884 ms 58.299 ms\n```\n\n###\
  \ mtr\n\n如果你想要一个非常酷的 `traceroute` 命令变体（参见本章的 `traceroute` 小节），请安装 `mtr` 命令。该命令每秒执行一次类似\
  \ `traceroute` 的操作，并用统计数据更新显示，如图 21.3 所示。\n\n![截图显示了“mtr 命令”窗口，其中列出了主机、数据包和 ping。数据包列表列出了“丢失百分比和发送数”，ping\
  \ 列出了“平均值、最佳值、最差值和标准差”。](img/21fig03.jpg)\n\n**图 21.3** `mtr` 命令\n\n### arp\n\n\
  `arp` 命令用于查看 ARP 表或对其进行更改。当在不带参数的情况下执行时，`arp` 命令会显示 ARP 表：\n\n点击此处查看代码图片\n\n```\n\
  # arp\nAddress         HWtype   HWaddress             Flags Mask    Iface\n192.168.1.11\
  \    ether    30:3a:64:44:a5:02     C             eth0\n```\n\n如果远程系统更换了网卡，可能需要从\
  \ ARP 表中删除条目。可以通过使用 `arp` 命令的 `-d` 选项来实现：\n\n```\n# arp -i eth0 -d 192.169.1.11\n\
  ```\n\n一旦地址从 ARP 表中删除，就不需要手动添加新地址了。当本地系统下次使用此 IP 地址时，它将在适当的网络上发送广播请求，以确定新的 MAC 地址。\n\
  \n#### nslookup\n\n`nslookup` 命令用于显示主机名到 IP 地址的查询结果（或反向）。有关此命令的详情，请参见第 3 章的 `nslookup`\
  \ 节。\n\n#### dig\n\n`dig` 命令用于显示主机名到 IP 地址的查询结果（或反向）。有关此命令的详情，请参见第 3 章的 `dig` 节。\n\
  \n### host\n\n`host` 命令用于显示主机名到 IP 地址的查询结果（或反向）。有关此命令的详情，请参见第 3 章的 `host` 节。\n\n\
  ### whois\n\n`whois` 命令用于确定域名属于哪个公司或个人。输出通常还会包含如何联系该组织的信息，尽管出于隐私原因，这些信息可能会被隐藏：\n\
  \n点击此处查看代码图片\n\n```\n# whois onecoursesource.com | head\n   Domain Name: ONECOURSESOURCE.COM\n\
  \   Registry Domain ID: 116444640_DOMAIN_COM-VRSN\n   Registrar WHOIS Server: whois.tucows.com\n\
  \   Registrar URL: http://www.tucows.com\n   Updated Date: 2016-01-15T01:49:45Z\n\
  \   Creation Date: 2004-04-07T19:45:31Z\n   Registry Expiry Date: 2021-04-07T19:45:31Z\n\
  \   Registrar: Tucows Domains Inc.\n```\n\n#### ping\n\n`ping` 命令用于判断远程系统是否可达。它测量发送到主机的消息往返时间。请参见\
  \ `ping` 节。\n\n#### nmcli\n\n`nmcli` 命令用于管理网络设置。请参见 `nmcli` 节。\n\n### ip\n\n`ip`\
  \ 命令用于显示网络接口信息。请参见 `ip` 节。\n\n### tracerpath\n\n`tracerpath` 命令用于显示数据包经过的路径。请参见\
  \ `tracerpath` 节。\n\n### iostat\n\n`iostat` 命令用于报告系统 I/O 统计数据。请参见 `iostat` 节。\n\n\
  ### ioping\n\n`iop` 命令用于监控 I/O 操作的延迟和吞吐量。\n\n#### IO 调度\n\n内核参数可优化 IO 调度。可以设置若干参数来更改行为。本节涵盖了\
  \ Linux+ 考试重要的参数。\n\n要查看当前调度器，请查看 `/sys/block/**<device*>/queue/scheduler` 文件的内容（将\
  \ <*device*> 替换为实际设备名称）。例如：\n\n点击此处查看代码图片\n\n```\n[root@OCS ~]# cat /sys/block/sda/queue/scheduler\n\
  [noop] deadline cfq\n```\n\n括号内的值是默认值。要更改此值，如下所示使用 `echo` 命令：\n\n点击此处查看代码图片\n\n\
  ```\n[root@OCS ~]# echo \"cfq\" > /sys/block/sda/queue/scheduler\n[root@OCS ~]#\
  \ cat /sys/block/sda/queue/scheduler\nnoop deadline [cfq]\n```\n\n#### cfq\n\n完全公平队列（Completely\
  \ Fair Queuing）调度为每个进程都有一个独立的队列，并循环处理每个队列。\n\n#### noop\n\n该调度遵循先进先出（FIFO）原则。\n\n\
  #### deadline\n\n这是标准调度器。该调度器创建两个队列——读队列和写队列。它还会为每个 I/O 请求加上时间戳，以确保请求得到及时处理。\n\n\
  \n\n\n\n有关此命令的详情，请参阅第 4 章中的`du`节。\n\n### df\n\n有关此命令的详情，请参阅第 4 章中的`df`节。\n\n###\
  \ LVM Tools\n\n有关此命令的详情，请参阅第 4 章中的`LVM Tools`节。\n\n### fsck\n\n有关此命令的详情，请参阅第 4 章中的`fsck`节。\n\
  \n### partprobe\n\n`partprobe` 命令通常在分区表发生变化且系统需要感知这些变化时才需要。最常见的例子是当你使用 `fdisk` 命令在当前已挂载文件系统的设备上更改分区时。`fdisk`\
  \ 命令尝试通过内核调用通知系统分区表的变化，但由于文件系统正在“运行中”，该操作会失败。\n\n为了解决这个问题，只需在退出 `fdisk` 工具后执行 `partprobe`\
  \ 命令即可。\n\n### CPU 监控与配置\n\n本节重点介绍与 CPU 监控和配置相关的命令和文件。\n\n#### /proc/cpuinfo\n\n\
  获取 CPU 信息的一种方法是查看 `/proc/cpuinfo` 文件的内容。该文件包含每个 CPU 的详细信息，如下所示：\n\n点击此处查看代码图像\n\n\
  点击此处查看代码图像\n\n```\n[root@OCS ~]# cat /proc/cpuinfo\nprocessor       : 0\nvendor_id\
  \       : GenuineIntel\ncpu family      : 6\nmodel           : 13\nmodel name  \
  \    : QEMU Virtual CPU version (cpu64-rhel6)\nstepping        : 3\nmicrocode  \
  \     : 0x1\ncpu MHz         : 2666.760\ncache size      : 4096 KB\nphysical id\
  \     : 0\nsiblings        : 1\ncore id         : 0\ncpu cores       : 1\napicid\
  \          : 0\ninitial apicid  : 0\nfpu             : yes\nfpu_exception   : yes\n\
  cpuid level     : 4\nwp              : yes\nflags           : fpu de pse tsc msr\
  \ pae mce cx8 apic\n  sep mtrr pge mca cmov pse36 clflush mmx fxsr sse sse2\n  syscall\
  \ nx lm nopl pni cx16 hypervisor lahf_lm\nbugs            :\nbogomips        : 5333.52\n\
  clflush size    : 64\ncache_alignment : 64\naddress sizes   : 40 bits physical,\
  \ 48 bits virtual\npower management:\n\nprocessor       : 1\nvendor_id       : GenuineIntel\n\
  cpu family      : 6\nmodel           : 13\nmodel name      : QEMU Virtual CPU version\
  \ (cpu64-rhel6)\nstepping        : 3\nmicrocode       : 0x1\ncpu MHz         : 2666.760\n\
  cache size      : 4096 KB\nphysical id     : 1\nsiblings        : 1\ncore id   \
  \      : 0\ncpu cores       : 1\napicid          : 1\ninitial apicid  : 1\nfpu \
  \            : yes\nfpu_exception   : yes\ncpuid level     : 4\nwp             \
  \ : yes\nflags           : fpu de pse tsc msr pae mce cx8 apic sep\n  mtrr pge mca\
  \ cmov pse36 clflush mmx fxsr sse sse2 syscall nx\n  lm nopl pni cx16 hypervisor\
  \ lahf_lm\nbugs             :\nbogomips         : 5333.52\nclflush size     : 64\n\
  cache_alignment  : 64\naddress sizes    : 40 bits physical, 48 bits virtual\npower\
  \ management :\n```\n\n#### uptime\n\n`uptime` 命令显示系统运行的时间。对于系统监控来说，更重要的是它提供了系统当前用户数量的快速快照，以及过去\
  \ 1、5 和 15 分钟的系统平均负载：\n\n点击此处查看代码图像\n\n```\n[root@OCS ~]# uptime\n 16:16:00 up 1\
  \ day,  1:05,  6 users,  load average: 0.60, 0.51, 0.25\n```\n\n#### loadaverage\n\
  \n`loadaverage` 命令显示系统平均负载。请参阅本章中的`uptime`子节。\n\n#### sar\n\n`sar` 命令显示的信息与 `iostat`\
  \ 相同；但这些是随时间记录的（通常每隔 10 分钟一次）。这是一个示例：\n\n点击此处查看代码图像\n\n```\n[root@OCS ~]# sar |\
  \ head\nLinux 3.10.0-229.el7.x86_64 (localhost.localdomain)\n  09/06/2015      _x86_64_(1\
  \ CPU)\n\n12:00:01 AM  CPU   %user  %nic  %syste   %iowai  %stea  %idle\n12:10:01\
  \ AM  all   0.11   0.00  0.10     0.01    0.00   99.78\n12:20:01 AM  all   0.08\
  \   0.00  0.07     0.02    0.00   99.84\n12:30:01 AM  all   0.10   0.00  0.11  \
  \   0.01    0.00   99.79\n12:40:01 AM  all   0.10   0.00  0.11     0.01    0.00\
  \   99.79\n```\n\n\n\n\n\n```\n[root@OCS ~]# dd if=/dev/zero of=/var/extra_swap\n\
  \  bs=1M count=200\n200+0 records in\n200+0 records out\n209715200 bytes (210 MB)\
  \ copied, 4.04572 s, 51.8 MB/s\n[root@OCS ~]# mkswap /var/extra_swap\nmkswap: /var/extra_swap:\
  \ warning: don't erase bootbits sectors\n         on whole disk. Use -f to force.\n\
  Setting up swapspace version 1, size = 204796 KiB\nno label, UUID=44469984-0a99-45af-94b7-f7e97218d67a\n\
  [root@OCS ~]# swapon /var/extra_swap\n[root@OCS ~]# swapon -s\nFilename        \
  \    Type        Size      Used    Priority\n/dev/dm-1           partition   1048568\
  \   37664   -1\n/dev/sdb1           partition   203768    0       -2\n/var/extra_swap\
  \     file        204792    0       -3\n```\n\n### vmstat\n\n如果你需要比 `free` 命令提供的更详细的信息，可以执行\
  \ `vmstat` 命令。请参考以下示例的输出：\n\n点击此处查看代码图片\n\n```\n[root@OCS ~]# vmstat\nprocs -----------memory----------\
  \ ---swap-- -----io----\n  -system-- ------cpu-----\n r  b   swpd    free   buff\
  \   cache  si    so    bi    bo   in\n  cs us sy id wa st\n 2  0      0  776828\
  \   1704 2329456   0     0    49    89  115\n  120  6  1  93  0  0\n```\n\n记住每一行内容并不是关键的，但你应该熟悉\
  \ `vmstat` 命令可以提供的输出内容。例如，在前一个示例的输出中，有一列标记为 `-----io----`。该列下有两个子列：\n\n*   `bi`:\
  \ 也称为“块入（blocks in）”，此值代表从块设备（如硬盘）接收的块数。\n*   `bo`: 也称为“块出（blocks out）”，此值代表发送到块设备（如硬盘）的块数。\n\
  \n这些值可以用于判断性能问题是基于内存的还是基于磁盘的。如果 `bi` 和 `bo` 值较高，可能意味着进程正在被 I/O 阻塞。\n\n字体 OOM Killer（内存溢出杀死）\n\
  \n当系统使用过多内存时会发生什么？Linux 内核有一个名为 OOM Killer（内存溢出杀死）的功能，它会通过杀死进程来释放内存。如果没有此功能，系统可能会停滞，且新进程将无法执行。\n\
  \nOOM Killer 通过为每个进程分配一个分数（称为“恶性评分”）并杀死得分最高的一个来决定杀死哪个进程。通常，这是占用内存最多的进程，而且很可能是服务器上的关键进程，例如邮件服务或\
  \ Web 服务器。\n\n你可以搜索日志文件（通常为 `/var/log/messages` 或 `/var/log/kern.log`）来寻找 OOM Killer\
  \ 已触发的证据。错误信息看起来如下：\n\n点击此处查看代码图片\n\n```\nhost kernel: Out of Memory: Killed process\
  \ 1466 (httpd).\n```\n\n#### 注意事项\n\n有配置 OOM Killer 的方法（使用内核参数），但这些超出了 Linux+ 考试的范围。对于考试，你应该了解\
  \ OOM Killer 的功能以及如何判断 OOM Killer 是否已采取了行动。\n\n### free\n\n`free` 命令提供了虚拟内存（RAM\
  \ 和交换空间利用率）的摘要，如下所示：\n\n点击此处查看代码图片\n\n```\n[root@OCS ~]# free\n          total \
  \    used    free   shared   buff/cache   available\nMem:      3883128   774752\
  \  777300 18200    2331076      2784820\nSwap:     839676         0  839676\n```\n\
  \n`Mem:` 行描述 RAM，`Swap:` 行描述虚拟内存。输出列的描述如下：\n\n*   `total`: 操作系统上的内存总量。\n*   `used`:\
  \ 当前正在使用的内存量。\n*   `free`: 可用的内存量。\n*   `shared`: 这是 `tmpfs` 使用的内存，`tmpfs` 是一种看起来像普通硬盘空间但实际上将数据存储在内存中的系统。\n\
  *   `buff/cache`: 缓冲区（buffer）或缓存（cache）是临时存储位置。\n*   `available`: 新进程可用的内存。\n\n\
  下表描述了该命令的实用选项：\n\n| 选项 | 说明 |\n| --- | --- |\n| `-b` 或 `--bytes` | 以字节为单位查看信息。 |\n\
  | `-m` 或 `--mega` | 以兆字节为单位查看信息。 |\n| `-g` 或 `--giga` | 以吉字节为单位查看信息。 |\n| `-h` 或\
  \ `--human` | 以人类可读格式查看信息。 |\n\n\n\n\n\n僵尸进程（zombie process）是指已经终止但尚未完全从内存中清除的进程。每个进程都由另一个进程启动，从而形成“父子”关系。当子进程结束时，父进程负责通知系统从内存中删除关于该子进程的所有细节。\n\
  \n在某些少数情况下，子进程可能会在父进程未感知的情况下结束。这将导致僵尸进程。在现代 Linux 系统上，僵尸进程相当罕见，通常表明存在需要修复的错误（bug）。\n\
  \n## 不可中断睡眠 (Uninterruptible Sleep)\n\n处于不可中断睡眠状态的进程正在执行某些系统调用，这些调用会阻止其进程被中断（杀死）。在大多数现代\
  \ Linux 系统上，这种情况非常罕见，因为这些系统调用执行速度非常快。\n\n如果一个进程在不可中断睡眠状态中持续了相当长的时间，很可能是软件 bug 导致的。\n\
  \n## 可中断睡眠 (Interruptible Sleep)\n\n处于可中断睡眠状态的进程正在执行某种 I/O（输入/输出）操作，例如访问硬盘。这是一个非常常见的状态，因为\
  \ I/O 操作可能需要一些时间。\n\n然而，如果一个进程处于可中断睡眠状态的时间很长，特别是当它影响了系统性能时，可能表明存在问题。可能是该进程尝试访问的设备存在错误（如硬盘上的坏数据块），或者程序存在\
  \ bug。\n\n## 运行 (Running)\n\n运行进程是指当前正在 CPU 上执行操作或在 CPU 队列中有操作的进程。\n\n## 优先级 (Priorities)\n\
  \nNice 值（Nice values）用于指示 CPU 哪个进程访问 CPU 的优先级更高。这些值的范围从 −20（最高优先级）到 19（最低优先级）。用户创建的任何任务的默认优先级均为\
  \ 0。\n\n请参阅本章中的“nice”小节，了解在执行命令时设置不同优先级的详细信息。\n\n## 杀死信号 (Kill Signals)\n\n`kill`\
  \ 命令可更改进程的状态，包括停止（杀死）它。要停止一个进程，首先确定其进程 ID（PID）或作业号，然后将该数字作为参数提供给 `kill` 命令：\n\n\
  点击查看代码图像\n\n```\n[student@OCS ~]$ jobs\n [1]- Running                       sleep\
  \ 999 &\n [2]+ Running sleep 777 &\n[student@OCS ~]$ kill %2\n [student@OCS ~]$\
  \ jobs\n [1]- Running                       sleep 999 &\n [2]+ Terminated      \
  \              sleep 777\n[student@OCS ~]$ ps -fe | grep sleep\n student 17846 12540\
  \ 0 14:30 pts/2          00:00:00 sleep 999\n student 17853 12540 0 14:31 pts/2\
  \          00:00:00 grep\n  --color=auto sleep\n[student@OCS ~]$ kill 17846\n[student@OCS\
  \ ~]$ ps -fe | grep sleep\n student 17856 12540 0 14:31 pts/2          00:00:00\
  \ grep\n  --color=auto sleep\n [1]+ Terminated                    sleep 999\n```\n\
  \n下表详细列出了 `kill` 命令的一些重要选项：\n\n| 选项 |  |\n| --- | --- |\n| `-9` | 强制杀死。当执行普通 kill\
  \ 命令时进程未退出时使用。 |\n| `-l` | 用于提供其他数值列表，这些数值可向进程发送不同的 kill 信号。 |\n\n信号（signal）是一种特殊的代码，用于指示进程应该采取何种操作。信号被用于暂停进程、停止进程、重启进程或其他操作。\n\
  \n下表详细列出了 `kill` 命令的一些重要信号：\n\n| 信号 | 说明 |\n| --- | --- |\n| `SIGHUP` | 也称为信号 1；用于模拟终端断开（例如远程连接丢失）。通常情况下\
  \ SIGHUP 会导致程序终止，但可以使用 `nohup` 命令避免这种情况。请参阅第 12 章 中的“给定场景，自动化并调度作业”，以获取有关 `nohup`\
  \ 命令的详细信息。 |\n| `SIGINT` | 也称为信号 2；用于模拟 `Ctrl-c` 操作。请参阅第 12 章 中的“Ctrl-c”小节，获取 `Ctrl-c`\
  \ 操作的详细信息。 |\n| `SIGKILL` | 也称为信号 9；用于强制终止进程。 |\n| `SIGTERM` | 也称为信号 15；用于正常终止进程。这是\
  \ `kill` 命令的默认信号。 |\n| `SIGTSTP` | 也称为信号 20；用于停止（暂停）程序，类似于 `Ctlr-z` 操作。请参阅第 12 章\
  \ 中的“Ctrl-z”小节，获取 `Ctrl-z` 操作的详细信息。 |\n\n## 命令 (Commands)\n\n可以使用若干条 Linux 命令来控制进程。本节将介绍这些命令。\n\
  \n### nice\n\n要指定一个与默认值不同的 nice 值，请通过 `nice` 命令执行作业：\n\n点击查看代码图像\n\n```\n[student@OCS\
  \ ~]$ nice -n 5 firefox\n```\n\n注意，普通用户不能分配负的 nice 值。这些值只能由 root 用户使用。除了 `-n` 选项外没有其他有选项。\n\
  \n要查看进程的 nice 值，使用 `ps` 命令的 `-o` 选项并包含“nice”值：\n\n点击查看代码图像\n\n```\n[student@OCS\
  \ ~] ps -o nice,pid,cmd\n NI PID CMD\n 0 23865 -bash\n 0 27969 ps -o nice,pid,cmd\n\
  ```\n\n### renice\n\n使用 `renice` 命令更改现有作业的 nice 值。这里是一个示例：\n\n点击查看代码图像\n\n```\n\
  [student@OCS ~] ps -o nice,pid,cmd\n NI PID CMD\n 0 23865 -bash\n 5 28235 sleep\
  \ 999\n 0 28261 ps -o nice,pid,cmd\n[student@OCS ~] renice -n 10 -p 28235\n28235\
  \ (process ID) old priority 5, new priority 10\n[student@OCS ~] ps -o nice,pid,cmd\n\
  \ NI PID CMD\n 0 23865 -bash\n 10 28235 sleep 999\n 0 28261 ps -o nice,pid,cmd\n\
  ```\n\n注意\n\n普通（非 root）用户只能将现有进程的优先级更改为更低优先级。只有 root 用户可以将进程优先级更改为更高优先级。\n\n下表详细列出了\
  \ `renice` 命令的一些重要选项：\n\n| 选项 |  |\n| --- | --- |\n| `-g` *group* | 更改所有属于组文件的优先级。\
  \ |\n| `-u` *user* | 更改所有属于用户文件的优先级。 |\n\n### top\n\n`top` 命令显示定期更新的进程信息（默认每 2 秒一次）。`top`\
  \ 命令输出的前半部分包含整体信息，而后半部分显示一个选定的进程列表（默认是使用 CPU 最多的进程）。\n\n图 22.1 显示了 `top` 命令的一些典型输出。\n\
  \n![一张显示 top 命令输出的截图。](img/22fig01.jpg)\n\n**图 22.1** **top** 命令输出\n\n下表描述了在图 22.1\
  \ 中显示的输出：\n\n| 输出 |  |\n| --- | --- |\n| 第一行 | 源自 `uptime` 命令的输出。 |\n| 第二行 | 系统上运行进程的摘要。\
  \ |\n| 第三行 | 自上一次 top 数据刷新以来的 CPU 统计数据。 |\n| 第四行 | 物理内存统计。（注意：在 **top** 命令中按 `E`\
  \ 可以将值从字节转换为其他值。） |\n| 第五行 | 虚拟内存统计。 |\n| 剩余行 | 进程列表及相关信息。 |\n\n在 `top` 命令运行时，可以使用交互式命令执行操作，如更改显示值、重新排序进程列表和杀死进程。这些交互式命令是单个字符。重要的交互式命令见下表：\n\
  \n| 命令 | 说明 |\n| --- | --- |\n| `h` | 帮助。显示交互式命令的摘要。 |\n\n\n\n\n\n| **E** | 将默认值从千字节（KB）更改为其他值；值将循环回到千字节。\
  \ |\n| **Z** | 切换颜色高亮的开启与关闭；使用小写 `z` 切换颜色显示和非颜色显示。 |\n| **B** | 切换粗体的开启与关闭。 |\n\
  | **< >** | 将排序列向左 (<) 或向右 (>) 移动。 |\n| **s** | 将更新值设置为与默认的 2 秒不同的值。 |\n| **k**\
  \ | 通过提供进程 ID (PID) 来杀死进程。 |\n| **q** | 退出 `top` 命令。 |\n\n`top` 命令还支持几个命令行选项，包括：\n\
  \n| 选项 | 描述 |\n| --- | --- |\n| **-d** | 设置数据刷新之间的时间。 |\n| **-n** *number* | 在 `top`\
  \ 命令退出之前的最大数据刷新次数。 |\n| **-u** *username* | 仅显示由用户名拥有的进程。 |\n\n### time\n\n`time`\
  \ 命令用于确定运行命令所需的时间。这里有一个示例：\n\n点击此处查看代码图像\n\n```\n[student@OCS ~]$ time wget www.onecoursesource.com/index.php\n\
  --2019-05-04 05:17:29--  http://www.onecoursesource.com/index.php\nResolving www.onecoursesource.com\
  \ (www.onecoursesource.com)\n  ... 38.89.136.109\nConnecting to www.onecoursesource.com\n\
  \  (www.onecoursesource.com)|38.89.136.109|:80... connected.\nHTTP request sent,\
  \ awaiting response... 200 OK\nLength: unspecified [text/html]\nSaving to: 'index.php'\n\
  \nindex.php [ <=> ] 12.25K --.-KB/s in 0s\n\n2019-05-04 05:17:29 (97.0 MB/s) - 'index.php'\
  \ saved [12548]\n\nreal 0m0.404s\nuser 0m0.000s\nsys 0m0.000s\n```\n\n输出包含了总共经过的时间（“real”值）、用户进程占用的\
  \ CPU 时间（“user”值）以及系统进程占用的 CPU 时间（“sys”值）。\n\n### ps\n\n`ps` 命令用于列出在系统上运行的进程。在不带参数的情况下，该命令将列出当前\
  \ shell 的任何子进程以及 BASH shell 本身，如下：\n\n点击此处查看代码图像\n\n```\n[student@OCS ~]$ ps\n \
  \   PID TTY          TIME CMD\n18360 pts/0          00:00:00 bash\n18691 pts/0 \
  \         00:00:00 ps\n```\n\n`ps` 命令的特殊之处在于，它支持较旧的 BSD 选项，这些选项通常前面没有连字符字符 (`-`）。\n\
  \n下表详细列出了 `ps` 命令的一些重要选项：\n\n| 选项 | 描述 |\n| --- | --- |\n| **-e** | 显示系统上运行的所有进程；也可以使用\
  \ BSD 的方法 `ps ax`。 |\n| **-f** | 显示完整信息（关于每个进程的额外信息）。 |\n| **-u** *username* | 显示所有由\
  \ *username* 拥有的进程。 |\n| **-forest** | 提供进程分级结构树。 |\n\n### lsof\n\n`lsof` 命令用于列出打开的文件。当不带任何参数使用时，它将列出操作系统所有打开的文件，如下：\n\
  \n```\n[root@OCS ~]# lsof | wc -l\n25466\n```\n\n更实用的技术是列出所有与打开的网络连接相关的文件：\n\n点击此处查看代码图像\n\
  \n```\n[root@OCS ~]# lsof -i\nCOMMAND  PID    USER      FD     TYPE      DEVICE\
  \     SIZE/OFF   NODE  NAME\navahi-dae   674     avahi        13u        IPv4  \
  \      15730           0t0\n                UDP      *:mdns\navahi-dae   674   \
  \  avahi        14u        IPv4        15731           0t0\n                UDP\
  \      *:49932\nsshd       1411     root          3u        IPv4        18771  \
  \         0t0\n                TCP      *:ssh (LISTEN)\nsshd       1411     root\
  \          4u        IPv6        18779           0t0\n                TCP      *:ssh\
  \ (LISTEN)\nmaster     2632     root         14u        IPv4        20790      \
  \     0t0\n                TCP      localhost:smtp (LISTEN)\nmaster     2632   \
  \  root         15u        IPv6        20791           0t0\n                TCP\
  \      localhost:smtp (LISTEN)\ndnsmasq    2739     nobody        3u        IPv4\
  \        21518           0t0\n                UDP        *:bootps\ndnsmasq    2739\
  \     nobody         5u       IPv4        21525           0t0\n                UDP\
  \      192.168.122.1:domain\ndnsmasq    2739     nobody         6u       IPv4  \
  \      21526           0t0\n                TCP      192.168.122.1:domain (LISTEN)\n\
  cupsd      4099     root          12u       IPv6        564510          0t0\n  \
  \              TCP      localhost:ipp (LISTEN)\ncupsd      4099     root       \
  \   13u       IPv4        564511          0t0\n                TC       localhost:ipp\
  \ (LISTEN)\ndhclien    26133    root           6u       IPv4        1151444    \
  \     0t0\n                UDP      *:bootpc\ndhclient   26133    root         \
  \ 20u       IPv4        1151433         0t0\n                UDP      *:14638\n\
  dhclient   26133    root          21u       IPv6        1151434         0t0\n  \
  \              UDP      *:47997\n```\n\n下表描述了 `lsof` 命令的常用选项：\n\n| 选项 | 描述 |\n|\
  \ --- | --- |\n| **-i** | 匹配 Internet 地址；也可以用于基于 IP 版本（`-i4` 或 `-i6`）或端口（`-i TCP:80`），或显示所有打开的连接。\
  \ |\n| **-u** *user* | 列出由 *user* 打开的文件。 |\n| **-p** *pid* | 列出进程 ID 为 *pid* 的进程打开的文件。\
  \ |\n\n### pgrep\n\n通常你利用 `ps` 和 `grep` 命令的组合来显示特定的进程，如下：\n\n点击此处查看代码图像\n\n```\n\
  [student@OCS ~]$ ps -e | grep sleep\n25194 pts/0 00:00:00 sleep\n```\n\n然而，`pgrep`\
  \ 命令可以提供类似的功能：\n\n```\n[student@OCS ~]$ pgrep sleep\n25194\n```\n\n下表详细列出了 `pgrep`\
  \ 的的一些选项：\n\n| 选项 | 描述 |\n| --- | --- |\n| **-G** *name* | 按组名匹配。 |\n| **-l** |\
  \ 显示进程名称。 |\n| **-n** | 显示最近启动的进程。 |\n| **-u** *name* | 按用户名匹配。 |\n\n### pkill\n\
  \n在使用 `kill` 命令发送信号时，通过提供进程 ID 来指定。使用 `pkill` 命令，你可以提供进程名称、用户名或其他方法来指定发送信号的进程。例如，以下命令将向属于\
  \ sarah 的进程发送信号：\n\n```\n[student@OCS ~]$ pkill -u sarah\n```\n\n\n\n\n\n* 存储\n\
  * Inode 耗尽\n* 不可变文件\n\n## 授权权限不足](#ch23.xhtml_ch23lev1sec5)\n\n* SELinux 违规\n\n\
  ## 环境和 shell 问题](#ch23.xhtml_ch23lev1sec6)\n\n注意\n\n本章侧重于解决用户问题的工具和技术。在许多情况下，内容的核心知识已经在其他章节中涵盖过。因此，本章的重点将完全放在故障排除技术上，并为特定主题提供更多细节参考。\n\
  \n### 权限\n\n当用户尝试访问文件或目录时，该对象的权限将决定是否允许访问。本节涵盖了如何处理有关文件和目录权限的问题。\n\n更多信息请参阅第 15\
  \ 章“给定场景，应用或获取适当的用户和/组权限及所有权](ch15.xhtml_ch15)”。\n\n## 文件\n\n有时，确定为什么无法访问某个文件或目录会非常令人沮丧。例如，考虑以下命令：\n\
  \n点击此处查看代码\n\n```\nbob@OCS:~# cp sample /etc/skel\ncp: cannot create regular file\
  \ '/etc/skel/sample1':\n  Permission denied\n```\n\n问题出在哪里？请记住系统会检查多种权限，例如 `sample`\
  \ 文件的读取权限、`/`、`etc` 和 `skel` 目录的执行权限，以及 `skel` 目录的写权限。\n\n要发现错误，首先仔细查看错误消息的输出。在这种情况下，问题似乎是在于\
  \ `/etc/skel` 目录中创建文件，而不是 `sample` 文件本身（后者会导致类似“无法读取‘sample1’”的错误）。\n\n接下来，通过查看每个目录的权限或使用\
  \ `cd` 命令进入每个目录，确定你是否可以进入所有目录。最后，检查目标目录是否有写权限。\n\n#### 目录\n\n目录权限可能很复杂，导致难以排除访问目录的故障。例如，考虑以下情况：\n\
  \n点击此处查看代码\n\n```\n[julia@OCS mydata]$ ls -l info\n-rwxrwxrwx 1 julia julia 240\
  \ Feb 4 22:16 info\n[julia@OCS mydata]$ rm info\nrm: cannot remove 'info': Permission\
  \ denied\n```\n\njulia 用户无法删除 `info` 文件这似乎不合逻辑。该文件属于 julia 账户，且 julia 账户对文件拥有所有权限。这里的问题在于，删除文件所需的权限是文件所在目录的写权限，如下：\n\
  \n点击此处查看代码\n\n```\n[julia@OCS mydata]$ ls -ld .\ndr-xrwxr-x 2 julia julia 4096 Feb\
  \ 4 22:16 .\n[julia@OCS mydata]$ chmod u+w .\n[julia@OCS mydata]$ ls -ld .\ndrwxrwxr-x\
  \ 2 julia julia 4096 Feb 4 22:16 .\n[julia@OCS mydata]$ rm info\n```\n\n每当你遇到权限问题时，首先问问自己完成此任务需要哪些权限。考虑使用完整路径编写命令。例如，在这种情况下，与其考虑\
  \ `rm info` 命令，不如考虑 `rm /home/julia/data/info` 命令。检查每个目录的权限以确定问题可能所在的地方。\n\n###\
  \ 访问\n\n当用户尝试访问系统时（例如尝试登录时），必须考虑两个组件：访问本身和认证。本节侧重于用户尝试访问系统时可能出现的问题，而“认证”节侧重于用户账户通过认证时出现的问题。\n\
  \n### 本地\n\n本地访问系统的能力是指坐在系统面前并尝试直接登录。与远程访问相比，本地访问产生的问题较少：\n\n* 硬件故障。\n* 输入错误的用户账户信息。查看日志文件以发现此类错误。\n\
  * PAM 限制（参阅第 16 章“给定场景，配置并实施适当的访问和认证方法](ch16.xhtml_ch16)”获取更多关于 PAM 的信息）。\n\n####\
  \ 远程\n\n远程访问是指用户尝试通过网络连接系统。除了上一节描述的问题外，“本地](#ch05.xhtml_ch05lev2sec17)”其他远程访问问题还包括以下内容：\n\
  \n* **TCP Wrapper 规则**：参阅第 16 章获取更多关于 TCP Wrappers 的信息。\n* **服务配置错误**：例如，如果用户通过\
  \ SSH 连接，则 SSH 服务器可能配置错误或甚至没有运行。\n* **基于服务的安全限制**：每个服务通常都有自己的安全功能。例如，可以配置 SSH 服务器\
  \ 允许 root 用户直接登录（参阅第 16 章获取更多关于 SSH 服务配置的信息）。\n* **网络问题**：如果无法通过网络访问远程系统，用户将因为此网络问题无法访问。\n\
  * **防火墙限制**：防火墙可以阻止访问远程系统，使用户无法通过网络访问系统（参阅第 19 章“给定场景，实施并配置 Linux 防火墙](ch19.xhtml_ch19)”获取更多关于防火墙的信息）。\n\
  \n### 认证\n\n认证过程与确定用户是否允许访问系统有关。例如，用户是否提供了正确的凭据（如正确的密码）？或者，用户是否在正确的时间和日期登录？本节侧重于如何确定在认证过程中是否发生了问题。\n\
  \n### 本地\n\n本地用户认证通常依赖于存储在 `/etc/shadow` 文件中的密码信息。用户可能由于以下原因出现本地认证问题：\n\n* 用户忘记了账户密码。\n\
  * 账户已过期。\n* 账户有密码老化限制，且用户违反了这些限制。例如，可以配置账户每 60 天要求更改新密码。如果用户在此时间段内未更改账户密码，账户可能会被锁定。\n\
  * 管理员可能手动锁定了用户账户。\n* PAM 限制可能会限制用户认证。\n\n以下是排除本地认证问题的一些有用提示：\n\n* 检查安全日志文件中的错误消息。\n\
  * 检查 `/etc/shadow` 文件中的用户账户设置。参阅第 8 章“给定场景，管理用户和组](ch08.xhtml_ch08)”获取有关该文件的详情。\n\
  * 检查 PAM 限制。参阅第 16 章获取更多关于 PAM 的信息。\n\n#### 外部\n\n外部认证由轻量级目录访问协议（LDAP）等服务处理。参阅第\
  \ 16 章获取更多关于 LDAP 的信息。\n\n#### 策略违反\n\n策略通常由 PAM 定义。参阅第 16 章获取更多关于 PAM 的信息。\n\n\
  ### 创建文件\n\n用户可能因为几个不同问题导致创建文件的能力受到限制。本节侧重于用户被阻止创建文件的主要原因。请注意，这个问题最常见的原因之一——权限，已经在本章的“权限”节中涵盖过。\n\
  \n### 配额\n\n\n\n\n\n如果文件系统启用了配额（quota），用户创建新文件的能力可能会受到限制。要确定配额是否是问题的原因，请考虑使用以下命令：\n\
  \n*   系统管理员应使用 `repquota` 命令显示文件系统上所有用户的配额。\n*   普通用户应使用 `quota` 命令显示自己账户的配额限制。\n\
  \n请参阅第 8 章获取有关配额的更多信息。\n\n## 存储\n\n如果文件系统满了，用户将无法在文件系统中创建新文件。`df` 命令对于排查此类问题很有用。请参阅第\
  \ 4 章“给定场景，在 Linux 环境中管理存储”获取有关显示文件系统使用情况的详情。\n\n## Inode 耗尽\n\n每个文件必须有一个唯一的 inode，用于跟踪文件元数据。每个文件系统的\
  \ inode 数量是有限的。通常这个限制非常高，耗尽 inode 的情况罕见，但如果一个文件系统有很多小文件，这可能会引发问题。\n\n`df` 命令的 `--inodes`\
  \ 选项对于排查此类问题很有用：\n\n点击此处查看代码\n\n```\n[student@OCS ~]$ df --inodes | grep /tmp\n\
  tmpfs             505992    602   505390    1%  /tmp\n```\n\n## 不变文件\n\n文件属性影响用户访问文件和目录的方式。例如，一种非常有用的属性是使文件变为“不可变”（immutable）。不可变文件是完全无法更改的；任何人（包括\
  \ root 用户）都无法删除或修改它。要使文件不可变，请使用所示的 `chattr` 命令：\n\n点击此处查看代码\n\n```\nroot@localhost:~#\
  \ chattr +i /etc/passwd\n```\n\n请注意，现在没有用户可以更改 `/etc/passwd` 文件，这意味着无法向系统添加新用户（也无法删除现有用户）。\n\
  \n要查看文件的属性，请使用 `lsattr` 命令：\n\n点击此处查看代码\n\n```\nroot@OCS:~# lsattr /etc/passwd\n\
  ----i--------e-- /etc/passwd\n```\n\n连字符 `-` 表示未设置的文件属性。可以在 `chattr` 命令的帮助页中找到属性属性列表。下表描述了对系统安全重要的文件属性：\n\
  \n| 属性 | 说明 |\n| --- | --- |\n| `a` | 仅追加模式；仅允许将新数据放入文件中。 |\n| `A` | 禁用修改访问时间戳。出于安全考虑，该时间戳对于确定关键系统文件何时被访问可能非常重要。然而，对于非关键文件，禁用访问时间可以提高系统速度，因为减少了硬盘写入次数。\
  \ |\n| `e` | 区格式（Extent format），允许 SELinux 等关键功能（在本章稍后部分讨论）。 |\n| `i` | 不可变；文件无法被删除或修改。\
  \ |\n| `u` | 不可删除；文件无法删除，但可以修改内容。 |\n\n要移除不可变属性，请使用以下命令：\n\n点击此处查看代码\n\n```\nroot@OCS:~#\
  \ chattr -i /etc/passwd\nroot@OCS:~# lsattr /etc/passwd\n-------------e-- /etc/passwd\n\
  ```\n\n`chattr` 命令的重要选项包括：\n\n*   `-R`: 递归地将更改应用于整个目录结构。\n*   `-V`: 详细模式。输出显示所做更改的输出。\n\
  \n## 授权权限不足\n\n两个主要机制可能会基于权限的限制拒绝用户授权：PAM 和 SELinux。PAM 在第 16 章中介绍。第 15 章提供了有关 SELinux\
  \ 的详细信息以及如何确定是否发生了 SELinux 违规。\n\n## 环境和 Shell 问题\n\n用户账户的配置会影响账户的功能。主要考虑因素之一是用户\
  \ shell 变量的配置。请参阅第 25 章“给定场景，部署并执行基础 BASH 脚本”获取 shell 变量的详情。请注意，你需要特别关注 `PATH` 变量，因为它影响用户在不提供完整路径名的情况下执行哪些命令。\n\
  \n## 第 24 章 给定场景，分析并排排除应用程序和硬件问题\n\n本章提供了有关以下主题的信息和命令：\n\n**SELinux 上文违规**\n\n**存储**\n\
  \n*   性能下降的存储\n*   设备设备\n*   缺失挂载点\n*   性能问题\n*   资源耗尽\n    *   适配器\n    *   SCSI\n\
  \    *   RAID\n    *   SATA\n    *   HBA\n*   存储完整性\n    *   坏块\n\n**防火墙**\n\n*\
  \   限制性 ACL\n*   被拦截端口\n*   被拦截协议\n\n**权限**\n\n*   所有权\n*   可执行文件\n*   继承\n*   服务账户\n\
  \n**依赖关系**\n\n*   补丁\n*   更新问题\n*   版本控制\n*   库\n*   仓库\n\n**排排除其他硬件问题**\n\n*  \
  \ 内存\n*   打印机\n*   视频\n*   GPU 驱动程序\n*   通信端口\n*   USB\n*   键盘映射\n*   硬件或软件问题\n\
  *   命令\n    *   dmidecode\n    *   lshw\n\n### SELinux 上文违规\n\n请参阅第 15 章“给定场景，应用或获取适当的用户组权限和所有权”获取有关\
  \ SELinux 违规的详情。\n\n## 存储\n\n本节讨论了存储设备的故障排除概念。你将介绍常见的存储问题，并学习从哪里查找问题原因。\n\n####\
  \ 性能下降的存储\n\n随着时间的推移，存储设备会变差并有时突然故障。为了在驱动故障之前确定是否存在任何问题，请考虑以下预防措施：\n\n*   **搜索坏块**：设备坏块的增加可能意味着存储性能下降。请参阅本章的“坏块”章节获取更多详情。\n\
  *   **使用 SMART 工具**：自我监控、分析和报告技术（SMART）是硬盘和 SSD 中的的一种监控驱动健康的工具。并不是所有磁盘都支持此实用，但大多数现代磁盘都支持。`smartctl`\
  \ 命令用于硬盘信息。例如，要进行健康检查，请尝试 `smartctl -HH` *device_name* 命令。\n\n\n\n\n\n* 如果是可拆卸设备，它可能未连接（或未妥善连接）。\n\
  * 如果是可拆卸设备，它可能需要开启电源。\n* 如果是内部设备，可能存在连接松动。这在系统运输过程中经常发生。\n* 它可能刚刚损坏了。\n* 存储设备还需要内核适配器（又内核模块），并且模块可能没有加载到内存中。\n\
  \n### 缺失挂载点\n\n当你挂载分区或卷时，挂载点（又称挂载目录）必须已经存在。如果不存在，将出现以下错误（用 `/data` 替换为你的挂载点）：\n\n\
  点击此处查看代码图片\n\n```\nmount: mount point /data does not exist\n```\n\n要解决此问题，请创建挂载点：\n\
  \n```\nroot@OCS:~# mkdir /data\n```\n\n### 性能问题\n\n可以使用 `dd` 命令测试存储设备的性能：\n\n点击此处查看代码图片\n\
  \n```\nroot@OCS:~# dd if=/dev/zero of=/var/test bs=1G\n  count=1 oflag=direct\n\
  1+0 records in\n1+0 records out\n1073741824 bytes (1.1 GB) copied, 42.474 s, 25.3\
  \ MB/s\n```\n\n`dd` 命令用于创建大文件。该命令的优点是它可以精确地显示创建文件所需的时间，让你对存储设备的性能有一个直观的了解。你可以在不同的时间运行此命令（系统忙时、空闲时、一天的不同时间段等）以建立基准。\n\
  \n性能还与使用缓存有关。要激活缓存，请执行以下命令：\n\n```\nhdparm -W1 /dev/sda\n```\n\n要禁用缓存，使用以下命令：\n\n\
  ```\nhdparm -W0 /dev/sda\n```\n\n考虑在两种情况下（缓存开启和关闭）都运行 `dd` 命令，以查看它如何影响性能。\n\n###\
  \ 资源耗尽\n\n对于存储设备，资源耗尽可能意味着以下情况之一：\n\n* 设备没有更多可用空间来创建更多文件。可以使用 `df` 命令判断是否存在此问题。请参阅第\
  \ 4 章中“给定场景，在 Linux 环境中管理存储”的“df”部分，了解更多关于该命令的信息。\n\n* 设备 inode 耗尽。每个文件都需要一个 inode\
  \ 来存储元数据。如果没有剩余的 inode，就无法创建新文件。可以使用 `df` 命令判断是否存在此问题。请参阅第 4 章中的“df”部分，以及第 9 章中“给定场景，创建、修改和重定向文件”的“inodes”小节，了解更多关于该命令和\
  \ inode 的知识。\n\n* 用户受到磁盘配额的限制。请参阅第 8 章中“给定场景，管理用户和组”的“配额”部分，了解磁盘配额。\n\n### 适配器\n\
  \n在 Linux 术语中，适配器是用于访问设备的内核模块。要查看此信息，请使用 `lspci -v` 命令（在此例中使用 `tail` 命令是因为 SATA\
  \ 驱动器是列出的最后一个设备）：\n\n点击此处查看代码图片\n\n```\nroot@OCS:~# lspci -v | tail -13\n00:0d.0\
  \ SATA controller: Intel Corporation 82801HM/HEM\n  (ICH8M/ICH8\nM-E) SATA Controller\
  \ [AHCI mode] (rev 02) (prog-if 01 [AHCI 1.0])\n         Flags: bus master, fast\
  \ devsel, latency 64, IRQ 21\n         I/O ports at d040 [size=8]\n         I/O\
  \ ports at 0000\n         I/O ports at d050 [size=8]\n         I/O ports at 0000\n\
  \         I/O ports at d060 [size=16]\n         Memory at f080a000 (32-bit, non-prefetchable)\
  \ [size=8K]\n         Capabilities: [70] Power Management version 3\n         Capabilities:\
  \ [a8] SATA HBA v1.0\n         Kernel driver in use: ahci\n         Kernel modules:\
  \ ahci\n```\n\n注意列出“Kernel driver”为“ahci”的行。这是用于此 SATA 设备的内核模块。请参阅第 2 章中“给定场景，安装、配置和监控内核模块”获取更多关于内核模块的信息。\n\
  \n#### SCSI\n\n小型计算机系统接口（SCSI）是一种用于将存储设备连接到系统的设备类型。请参阅本章中的“适配器”小节，了解更多关于查看 SCSI\
  \ 设备驱动程序的方法。\n\n#### RAID\n\n独立磁盘冗余阵（RAID）是一种用于将存储设备连接到系统的设备类型。请参阅本章中的“适配器”小节，了解更多关于查看\
  \ RAID 设备驱动程序的方法。要了解更多关于 RAID 设备，请参阅第 4 章中的“mdadm”部分。\n\n#### SATA\n\n串行 ATA 连接（SATA）是一种用于将存储设备连接到系统的设备类型。请参阅本章中的“适配器”小节，了解更多关于查看\
  \ SATA 设备驱动程序的方法。\n\n#### HBA\n\n主机总线适配器（HBA）是一种用于将各种设备连接到系统的设备类型。通过 HBA 连接系统的常用存储设备是光纤（FC）和串行连接\
  \ SCSI（SAS）。请参阅本章中的“适配器”小节，了解更多关于查看 HBA 驱动程序的方法。\n\n### 完整性\n\n本节介绍了如何扫描坏块。\n\n\
  #### 坏块\n\n要测试坏块，请使用 `badblocks` 命令：\n\n点击此处查看代码图片\n\n```\nroot@OCS:~# badblocks\
  \ -v /dev/sdb1\nChecking blocks 0 to 1047551\nChecking for bad blocks (read-only\
  \ test): done\n\nPass completed, 0 bad blocks found. (0/0/0 errors)\n```\n\nSMART\
  \ 工具也可以用于查找坏块。请参阅本章中的“降级存储”小节获取更多关于 SMART 的信息。\n\n### 防火墙\n\n当你排查位于防火墙后的系统访问问题时，了解如何查找规则非常重要。本节重点介绍你可能在\
  \ Linux+ 考试看到的某些规则。\n\n注意\n\n关于防火墙的更详细讨论可以在第 19 章中“给定场景，实施和配置 Linux 防火墙”找到。本节的重点仅在于由于防火墙引起的访问问题。\n\
  \n#### 限制性 ACL\n\n如果对远程系统的访问被限制性防火墙 ACL 阻塞，它将是一个具有以下目标之一的 ACL：\n\n* drop（丢弃）\n\n\
  * reject（拒绝）\n\n重要的是，如果具有“reject”目标的 ACL 阻塞了访问，则应向数据包源返回某种“拒绝访问”的响应。如果具有“drop”目标的\
  \ ACL 阻塞访问，则完全不会返回任何响应。\n\n#### 阻塞端口\n\n要确定数据包是否根据其协议被阻塞，首先确定正在使用哪个端口。通常，服务将使用“标准”端口（在\
  \ `/etc/services` 文件中定义），但客户端和服务器软件都可以配置为使用非标准端口。先调查这一点，一旦你确定了正在使用的端口号，就查找阻塞该端口号的规则。\n\
  \n在接下来的示例中，你可以看到任何指向端口 23（通常用于 telnet 服务）的入站包都会被丢弃：\n\n点击此处查看代码图片\n\n```\nroot@OCS:~#\
  \ iptables -L INPUT\nChain INPUT (policy ACCEPT)\ntarget     prot opt source   \
  \                  destination\nDROP       icmp --  anywhere                   anywhere\n\
  DROP       tcp  --  anywhere                   anywhere  tcp dpt:telnet\n```\n\n\
  #### 阻塞协议\n\n\n\n\n\n要确定数据包是否根据其协议被拦截，你应该首先确定该协议是什么。防火墙规则可以应用于 ICMP、TCP 和 UDP 等协议，这些协议包含了许多不同的网络通信（请查看\
  \ `/etc/protocols` 以获取所有可能被拦截的协议列表）。当你查看防火墙规则时，一个基于 ICMP 目标并拦截数据包的 ACL 看起来如下：\n\n\
  点击此处查看代码图像\n\n```\nroot@OCS:~# iptables -L INPUT\nChain INPUT (policy ACCEPT)\n\
  target     prot opt source                        destination\nDROP       icmp --\
  \ anywhere                       anywhere\n```\n\n## 权限\n\n文件和目录权限经常困扰扰用户，他们可能难以理解这些权限如何影响对这些对象的访问。本节探讨了其中的一些概念。有关权限的更多信息，请参阅第\
  \ 15 章。\n\n### 所有权\n\n文件和目录所有权在权限中起着至关重要的作用。考虑以下情况：\n\n* 文件或目录的用户所有者具有更改权限的能力。详情请参阅第\
  \ 15 章中的“用户、组、其他”章节。\n* 用户所有者还拥有一与其他所有用户不同的权限。详情请参阅第 15 章中的“用户、组、其他”章节。\n* 组所有者拥有一组其他用户不的权限。详情请参阅第\
  \ 15 章中的“用户、组、其他”章节。\n* 用户和组所有权可以修改。详情请参阅第 15 章中的 `chown` 和 `chgrp` 章节。\n\n### 可执行文件\n\
  \n可执行文件是设置了执行权限的文件。这对于像程序一样运行文件至关重要。详情请参阅第 25 章中的“目录和文件权限”以及“给定场景，部署并执行基础 BASH 脚本”。\n\
  \n### 继承\n\n详情请参阅第 15 章中的“继承”章节。\n\n### 服务账户\n\n详情请参阅第 15 章中的“服务”章节。\n\n### 组成员关系\n\
  \n参阅本章中的“所有权”小节，获取组关系如何影响权限的信息。\n\n## 依赖关系\n\n处理软件包时最大的问题之一就是依赖关系。幸运的是，`yum` 和 `apt`\
  \ 命令等工具可以处理依赖问题。然而，在某些情况下，必须使用手动方法，而无法利用这些自动化工具。\n\n本节重点关注 Linux+ 考试中你应该掌握的与软件包依赖相关的某些概念。\n\
  \n### 补丁\n\n补丁是更新软件的过程。通常，组织遵循补丁策略，该策略规定了执行补丁的频率和方式。例如，策略可能要求对所有系统进行 nightly 补丁。或者，策略可能要求使用“滚动方法”进行每月补丁，即某些系统（通常是非生产系统）首先进行补丁，在对新补丁系统进行初始测试后再对其他系统进行补丁。\n\
  \n### 更新问题\n\n当你尝试更新系统或特定的软件软件包时，可能会出现几个问题，包括：\n\n* 可能无法访问存储库。\n* 你可能没有权限安装更新。通常这需要\
  \ root 权限。\n* 更新可能包含导致软件损坏的缺陷（bug）。\n* 更新可能包含导致整个操作系统崩溃的缺陷。\n* 更新可能会覆盖之前的配置文件。在升级之前备份所有配置数据以避免出现此问题。\n\
  * 更新可能会覆盖现有的数据文件或数据库。在升级之前备份所有数据文件以避免出现此问题。\n* 更新可能会导致程序行为发生变化。请务必确保让用户知晓程序中将发生的变化。\n\
  \n### 版本控制\n\n当你显示软件软件包时，软件版本包含在包名中。以下是一个示例：\n\n点击此处查看代码图像\n\n```\nlibXau-devel-1.0.8-2.fc32.x86_64.rpm\n\
  ```\n\n上一个软件包的版本是“1.0.8-2.fc32”。包名很重要，因为你不想尝试安装比系统中现有包更旧的包。\n\n### 库\n\n有关库的信息，请参阅第\
  \ 7 章中的“给定场景，进行软件安装、配置、更新和卸载”。\n\n### 存储库\n\n有关存储库的信息，请参阅第 7 章中的“存储库”。\n\n## 排除额外的硬件故障\n\
  \n与硬件设备相关的故障排除主题有很多。本节回顾了在处理这些设备时应该考虑的一些基础知识。\n\n### 内存\n\n关于排除内存问题的大部分有用信息在本章前面的部分，以及第\
  \ 21 章中的“内存监控与配置”、“给定场景，分析系统属性并相应修复”。除了这些信息外，始终要考虑任何硬件（包括内存条）的兼容性问题。\n\n### 打印机\n\
  \n打印机服务 (CUPS) 在第 13 章“解释 Linux 设备的使用和操作”中介绍过。通常，排除新打印机故障最大的问题与打印机驱动程序有关（访问 `cups.org`\
  \ 网站获取新驱动）。其他常见问题包括：\n\n* 卡纸：阅读打印机用户手册学习如何从打印机中清除纸。\n* 禁用的打印队列：参阅第 16 章“给定场景，配置并实施适当访问和验证方法”，学习如何更改打印机状态。\n\
  * 无效的打印任务：参阅第 16 章学习如何从打印队列中删除打印任务。\n\n### 视频\n\n视频硬件问题通常源损坏的硬件设备（如显示器、显卡或显示器线）或兼容性问题，后者在使用较新的硬件时经常出现。对于兼容性问题，请咨询你的\
  \ X 服务器网站获取可能的新驱动。\n\n### GPU 驱动程序\n\n图形处理器 (GPU) 是用于处理与显卡（又称视频卡）相关数据的设备。通常，这些设备需要驱动程序才能正常工作。对于任何新的\
  \ GPU 尤其是如此。咨询 GPU 供应商网站获取详情。\n\nGPU 管理的完整讨论超出考试范围。如果你想了解更多关于此主题，请考虑以下网站：\n\n[`www.kernel.org/doc/html/v4.20/gpu/index.html`](https://www.kernel.org/doc/html/v4.20/gpu/index.html)\n\
  \n（注意：将“v4.20”替换为你系统上当前的内核版本以获得更准确的文档。）\n\n### 通信端口\n\n通常*通信端口*（communication ports）指的是服务使用的网络端口，但由于此主题与硬件排除有关，它更有可能指的是\
  \ I/O 端口或“串口”（comm ports）。I/O 端口用于与键盘、鼠标以及终端设备进行通信。\n\n\n\n\n要显示 I/O 端口，请查看 `/proc/ioports`\
  \ 文件（在以下示例中，仅使用了 `head` 命令来减少大量的输出内容）：\n\n点击此处查看代码图片\n\n```\n[root@OCS ~]# cat /proc/ioports\
  \ | head\n0000-001f : dma1\n0020-0021 : pic1\n0040-0043 : timer0\n0050-0053 : timer1\n\
  0060-0060 : keyboard\n0064-0064 : keyboard\n0070-0071 : rtc0\n0080-008f : dma page\
  \ reg\n00a0-00a1 : pic2\n00c0-00df : dma2\n```\n\n另一种显示硬件信息的技巧是执行 `lsdev` 命令（在以下示例中，仅使用了\
  \ `head` 命令来减少大量的输出内容）：\n\n点击此处查看代码图片\n\n```\n[root@OCS ~]# lsdev | head\nDevice\
  \             DMA   IRQ  I/O Ports\n------------------------------------------------\n\
  0000:00:01.1                  0170-0177 01f0-01f7 0376-0376\n  03f6-03f6 d000-d00f\n\
  0000:00:03.0                  d010-d017\n0000:00:04.0                  d020-d03f\n\
  0000:00:05.0                  d100-d1ff d200-d23f\n0000:00:0d.0                \
  \  d240-d247 d250-d257 d260-d26f\nACPI                          4000-4003 4004-4005\
  \ 4008-400b 4020-4021\nacpi                          9\n```\n\n`lsdev` 命令的主要重点是显示硬件\
  \ DMA、IOPorts 和中断。该命令从 `/proc/dma`、`/proc/ioports` 和 `/proc/interrupts` 文件收集信息，并以易读的格式显示它们。\n\
  \n### USB\n\n要查看连接到你系统的 USB 设备信息，请执行 `lsusb` 命令。如果当前没有连接设备，输出将如下所示：\n\n点击此处查看代码图片\n\
  \n```\n[root@OCS ~]# lsusb\nBus 001 Device 001: ID 1d6b:0001 Linux Foundation 1.1\
  \ root hub\n```\n\n之前的输出显示了根集器（root hub），它本质上就是 USB 端口。即使你有多个 USB 端口，可能也只会看到一个根集器。在某些情况下，你可能会看到多个；例如，如果你同时拥有\
  \ USB 2.0 和 USB 1.1 端口，每组端口都可能显示为一个根集器。\n\n如果你向系统连接了设备，`lsusb` 命令的输出将类似于以下：\n\n\
  点击此处查看代码图片\n\n```\n[root@OCS ~]# lsusb\nBus 001 Device 001: ID 1d6b:0001 Linux Foundation\
  \ 1.1 root hub\nBus 001 Device 005: ID 058f:6387 Alcor Micro Corp. Flash Drive\n\
  ```\n\n`-v` 选项显示详细信息，而 `-d` 选项用于将供应商：产品号作为参数传递，以便将详细输出限制为单个 USB 设备（在以下示例中，仅使用了 `head`\
  \ 命令来减少大量的输出内容）：\n\n点击此处查看代码图片\n\n```\n[root@OCS ~]# lsusb -v -d 058f:6387\n\nBus\
  \ 001 Device 005: ID 058f:6387 Alcor Micro Corp. Flash Drive\nDevice Descriptor:\n\
  \  bLength                 18\n  bDescriptorType          1\n  bcdUSB          \
  \      1.10\n  bDeviceClass             0 (Defined at Interface level)\n  bDeviceSubClass\
  \          0\n  bDeviceProtocol          0\n  bMaxPacketSize0         64\n```\n\n\
  每当你向系统添加任何硬件设备时，查看基于 Red Hat 的系统上的 `/var/log/messages` 文件内容（或基于 Debian 的系统上的 `/var/log/syslog`\
  \ 文件）都会帮助，因为该文件向你展示了内核是如何识别该设备的。例如，当 USB 优存盘插入系统时，出现了以下消息：\n\n点击此处查看代码图片\n\n```\n\
  [root@OCS ~]# tail /var/log/messages\nNov 10 12:50:15 localhost kernel: scsi10 :\
  \ SCSI emulation\n  for USB Mass Storage devices\nNov 10 12:50:16 localhost kernel:\
  \ scsi 10:0:0:0: Direct-Access\n  Generic Flash Disk         8.07 PQ: 0 ANSI: 2\n\
  Nov 10 12:50:16 localhost kernel: sd 10:0:0:0: Attached\n  scsi generic sg8 type\
  \ 0\nNov 10 12:50:16 localhost kernel: sd 10:0:0:0: [sdg]\n  7831552 512-byte logical\
  \ blocks: (4.00 GB/3.73 GiB)\nNov 10 12:50:16 localhost kernel: sd 10:0:0:0: [sdg]\n\
  \  Write Protect is off\nNov 10 12:50:16 localhost kernel: sd 10:0:0:0: [sdg]\n\
  \  Assuming drive cache: write through\nNov 10 12:50:16 localhost kernel: sd 10:0:0:0:\
  \ [sdg]\n  Assuming drive cache: write through\nNov 10 12:50:16 localhost kernel:\
  \ sdg: sdg1\nNov 10 12:50:16 localhost kernel: sd 10:0:0:0: [sdg]\n  Assuming drive\
  \ cache: write through\nNov 10 12:50:16 localhost kernel: sd 10:0:0:0: [sdg]\n \
  \ Attached SCSI removable disk\n```\n\n通过查看此输出，你可以确定连接的是什么类型的设备（通用闪存盘）以及设备名称是什么（`[sdg]`）。因此，现在你可以挂载\
  \ `/dev/sdg` 设备并访问 USB 闪盘上的数据。\n\n### 键盘映射\n\n键盘映射是确保键盘上的按键与你希望按键执行的操作的过程。使用 `xev`\
  \ 命令来执行键盘映射操作。\n\n### 硬件或软件兼容性问题\n\n你经常需要回答的问题之一是当前的硬件错误是由于实际硬件问题，还是访问硬件软件的问题。没有绝对的规则来确定答案，但有一些方法可以用来确定问题来源，包括：\n\
  \n*   将设备移动到另一个系统看看问题是否仍然。\n*   尝试另一个类似的硬件设备。\n*   重新安装软件。\n*   升级硬件驱动。\n\n####\
  \ 命令\n\n本节介绍了一些显示硬件信息的命令。\n\n#### dmidecode\n\n`dmidecode` 命令用于显示硬件组件的描述（在以下示例中，仅使用了\
  \ `head` 命令来减少大量的输出内容）：\n\n点击此处查看代码图片\n\n```\n[root@OCS ~]# dmidecode | head\n#\
  \ dmidecode 3.1\nGetting SMBIOS data from sysfs.\nSMBIOS 2.5 present.\n10 structures\
  \ occupying 450 bytes.\nTable at 0x000E1000\n```\n\n#### lshw\n\n`lshw` 命令产生关于系统的大量信息，因此以下输出仅限于前几行：\n\
  \n点击此处查看代码图片\n\n```\n[root@OCS ~]# lshw | head\n    description: Computer\n    product:\
  \ VirtualBox\n    vendor: innotek GmbH\n    version: 1.2\n    serial: 0\n    width:\
  \ 64 bits\n    capabilities: smbios-2.5 dmi\n```\n\n\n\n\n\n* stdin\n* stdout\n\n\
  ## 元字符](#ch25.xhtml_ch25lev1sec11)\n\n## 位置参数](#ch25.xhtml_ch25lev1sec12)\n\n##\
  \ 循环结构](#ch25.xhtml_ch25lev1sec13)\n* while\n* for\n* until\n\n## 条件语句](#ch25.xhtml_ch25lev1sec14)\n\
  * if\n* case\n\n## 转义字符](#ch25.xhtml_ch25lev1sec15)\n\n### Shell 环境与 Shell 变量\n\n\
  Shell 变量用于存储信息。这些信息用于修改 Shell 本身的行为或外部命令。下表详细列出了一些常用的 Shell 变量：\n\n| 变量 | 描述 |\n\
  | --- | --- |\n| `HOME` | 当前用户的家目录。 |\n| `ID` | 当前用户的 ID。 |\n| `LOGNAME` | 登录当前会话的用户用户名。\
  \ |\n| `OLDPWD` | 上一个目录位置（在上一次 `cd` 命令之前）。 |\n| `PATH` | 查找命令的路径；更多信息请参阅 `PATH`\
  \ 章节。 |\n| `PS1` | 主提示符。 |\n| `PWD` | 当前目录。 |\n\n例如，`PS1` 变量定义了主提示符，通常使用特殊字符序列（`\\\
  u` = 当前用户名，`\\h` = 主机名，`\\W` = 当前目录）：\n\n```\n[student@OCS ~]$ echo $PS1\n[\\u@\\\
  h \\W]\\$\n```\n\n注意，定义变量时不带美元符号，但在引用时需要使用美元符号：\n\n点击此处查看代码图片\n\n```\n[student@OCS\
  \ ~]$ PS1=\"[\\u@\\h \\W \\!]\\$ \"\n[student@OCS ~ 93]$ echo $PS1\n[\\u@\\h \\\
  W \\!]$\n```\n\n要查看所有 Shell 变量，请使用 `set` 命令，如下所示：\n\n点击此处查看代码图片\n\n```\n[student@OCS\
  \ ~ 95]$ set | head -5\nABRT_DEBUG_LOG=/dev/null\nAGE=25\nBASH=/bin/bash\nBASHOPTS=checkwinsize:cmdhist:expand_aliases:extglob:\n\
  \  extquote:force_fignore:\nhistappend:interactive_comments:progcomp:promptvars:sourcepath\n\
  BASH_ALIASES=()\n```\n\n当变量最初被创建时，它仅在创建它的 Shell 中可用。这种变量被称为*局部变量*。在某些情况下，你需要将变量传递给子进程。这是通过使用\
  \ `export` 命令实现的。更多细节请参阅本章的 `export` 章节。\n\n注意，在 Shell 中创建的所有变量都是临时的。要使 Shell 变量持久化（即跨登录时持续存在），请参阅第\
  \ 8 章中的 `Profiles` 部分，“给定场景管理用户和组](#ch08.xhtml_ch08)。”\n\n#### PATH\n\n脚本应放置于 `$PATH`\
  \ 变量定义的目录之一：\n\n点击此处查看代码图片\n\n```\n[root@OCS ~]$ echo $PATH\n/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:\n\
  /usr/games:/usr/local/games\n```\n\n通常，只有 root 用户才能在这些目录之一中放置文件，因此普通用户可以创建自己的目录并将其添加到\
  \ `$PATH` 变量中：\n\n点击此处查看代码图片\n\n```\n[bob@OCS ~]$ mkdir /home/bob/bin\n[bob@OCS\
  \ ~]$ PATH=\"$PATH:/home/bob/bin\"\n```\n\n#### 全局\n\n参阅本章中的 `Shell 环境与 Shell 变量`\
  \ 和 “export”章节。\n\n#### 局部\n\n参阅本章中的 `Shell 环境与 Shell 变量` 和 `set` 部分。\n\n#### export\n\
  \n要将现有的局部变量转换为环境变量，请使用 `export` 命令：\n\n点击此处查看代码图片\n\n```\n [student@OCS ~]$ echo\
  \ $NAME\nSarah\n  [student@OCS ~]$ export NAME\n```\n\n如果变量不存在，`export` 命令可以直接将其创建为环境变量：\n\
  \n当变量转换为环境变量时，当你想通过修改关键变量来更改进程的行为时，这非常有用。例如，`crontab -e` 命令允许你编辑 crontab 文件。要选择\
  \ `crontab` 命令使用的编辑器，请创建并导出 `EDITOR` 变量：`export EDITOR=gedit`。参见图 25.1 获取局部变量与环境变量的视觉示例。\n\
  \n![图片显示了局部变量与环境变量的示例](img/25fig01.jpg)\n\n**图 25.1** 局部变量与环境变量\n\n`export` 命令也可以用于显示所有环境变量：\n\
  \n```\nexport -p\n```\n\n#### env\n\n`env` 命令显示当前 Shell 中的环境变量。在执行 `env` 命令时，不会显示局部变量。\n\
  \n`env` 命令的另一个用途是为命令的执行临时设置变量。\n\n示例：\n\n点击此处查看代码图片\n\n```\n[student@OCS ~]# echo\
  \ $TZ\n\n[student@OCS ~]# date\nThu Dec 1 18:48:26 PST 2016\n[student@OCS ~]# env\
  \ TZ=MST7MDT date\nThu Dec 1 19:48:31 MST 2016\n[student@OCS ~]# echo $TZ\n\n[student@OCS\
  \ ~]#\n```\n\n在执行命令时取消变量，请使用 `--unset=VAR` 选项（例如 `env --unset=TZ date`）。\n\n####\
  \ set\n\n`set` 命令在不带参数执行时会显示所有 Shell 变量和值。输出还包括在 Shell 中声明的任何函数。\n\n`set` 命令也可以用于修改\
  \ Shell 的行为。例如，通常使用**未设置的**变量会导致返回“空字符串”。执行命令 `set -u` 在使用未定义变量时将产生错误消息，所示：\n\n\
  点击此处查看代码图片\n\n```\n[student@OCS ~]$ echo $NOPE\n\n[student@OCS ~]$ set -u\n[student@OCS\
  \ ~]$ echo $NOPE\nbash: NOPE: unbound variable\n```\n\n下表提供了一些额外的 `set` 选项：\n\n\
  | 选项 | 描述 |\n| --- | --- |\n| `-b` | 当后台作业终止时，立即向 Shell 报告此情况。使用 `+b`（默认）以便在显示下一个提示符之前进行此报告。\
  \ |\n| `-n` | 一种 Shell 编程功能，读取脚本中的命令但不执行它们。用于检查脚本的语法错误。 |\n| `-u` | 当使用**未设置的**变量时抛出错误消息。\
  \ |\n| `-C` | 不允许使用重定向操作符覆盖现有文件，例如 `cmd > file`。 |\n\n使用 `unset` 命令从 Shell 中移除变量（例如\
  \ `unset VAR`）。\n\n#### printenv\n\n与 `env` 命令一样，`printenv` 命令用于显示环境变量；然而，`env`\
  \ 命令具有额外的功能，而 `printenv` 命令仅用于显示环境变量。\n\n### echo\n\n`echo` 命令用于显示信息。通常，它用于显示变量的值。\n\
  \n示例：\n\n点击此处查看代码图片\n\n```\n [student@OCS ~]$ echo $HISTSIZE\n1000\n```\n\n`echo`\
  \ 命令只有几个选项。最有用的是 `-n` 选项，它不在输出末尾打印换行符。\n\n在 `echo` 命令的参数中可以包含一些特殊字符序列。例如，命令 `echo\
  \ “hello\\nthere”` 将发送以下输出：\n\n```\nhello\nthere\n```\n\n下表描述了 `echo` 命令的一些实用字符序列：\n\
  \n| 序列 | 描述 |\n| --- | --- |\n| `\\a` | 响终端铃声。 |\n| `\\n` | 换行符。 |\n| `\\t` | 制表符。\
  \ |\n\n\n\n\n\n| `\\\\` | 单个反斜符字符。 |\n\n### #!/bin/bash\n\n脚本的第一行应该包含解释器的路径。对于 BASH\
  \ 壳脚本，这应该是 `bash` 命令的可执行文件路径。可以通过执行以下命令来找到此路径：\n\n```\n[root@OCS ~]$ which bash\n\
  /bin/bash\n```\n\n使用以下语法将此路径添加到脚本的第一行：\n\n```\n#!/bin/bash\n```\n\n`#`（哈希字符）和 `!`（惊感叹号字符）的组合形成了\
  \ shebang 序列。（快速读出“hash bang”这个词你就能发现 *shebang* 一词的来源；通常读法中末尾的 *e* 是不发音的）。\n\n###\
  \ 资源化脚本 (Sourcing Scripts)\n\n大多数命令作为独立的进程进行执行，它们有自己的环境。`source` 命令允许你执行 bash 脚本，就好像脚本中的命令直接在命令行中执行的一样。\n\
  \n示例：\n\n点击此处查看代码图片\n\n```\nroot@OCS ~ ~ source ./functions.sh\n```\n\n使用 `.` 命令可以实现与\
  \ `source` 命令相同的功能，如下：\n\n[点击此处查看代码图片\n\n```\n[root@OCS ~]$ . ./functions.sh\n```\n\
  \n这种技术通常用于 shell 脚本内部，从其他 shell 脚本加载代码。例如，一个脚本可能需要在另一个脚本中声明的变量。\n\n### 目录和文件权限\n\
  \n脚本应该由普通用户所有，而不是 root 用户。运行 root 所有的脚本可能会导致安全问题。如果脚本由 root 所有，则永远不应该设置 suid 权限，因为这会导致严重的安全风险（大多数现代\
  \ Linux 发行版不允许 root 拥有的脚本设置 suid）。\n\n创建脚本后，你需要添加执行权限以便像程序一样运行它：\n\n```\nchmod a+x\
  \ script_name\n```\n\n#### chmod\n\n查看 第 15 章 中的 “chmod”节，“对于给定的场景，应用或获取适当的用户和/或组权限及所有权](#ch15.xhtml_ch15)。”\n\
  \n### 扩展\n\nBASH 壳脚本应该以 `.sh` 扩展结尾，以指示文件内容包含 BASH 壳脚本。`.bash` 扩展也被使用，但并不常用。\n\n\
  其他脚本语言应该有扩展名来指示语言类型：\n\n*   Perl 脚本使用 `.pl`。\n*   Python 脚本使用 `.py`。\n*   TC shell\
  \ 脚本使用 `.tcsh`。\n*   C shell 脚本使用 `.csh`。\n\n### 注释\n\n在你的 BASH 壳脚本中创建注释很重要，因为它们可以帮助他人理解脚本中代码的作用。本节重点介绍如何创建注释。\n\
  \n#### #\n\n注释以井号 `#` 字符开始，并延伸到行末尾。以下示例显示了整行的注释：\n\n```\n#设置计数变量:\ncount = 100\n\
  ```\n\n接下来的示例显示了包含代码的行中的注释：\n\n点击此处查看代码图片\n\n```\ncount = 100 #设置计数变量\n```\n\n###\
  \ 文件通配符 (File Globbing)\n\n文件通配符（也称为 *wildcard*）是命令行提供的任何字符，代表文件名的的一部分。支持以下通配符：\n\
  \n| 通配符 | 说明 |\n| --- | --- |\n| `*` | 匹配文件名中的零个或多个字符。 |\n| `?` | 匹配文件名中的任意单个字符。\
  \ |\n| `[ ]` | 匹配文件名中的单个字符，只要该字符在 `[ ]` 字符内表示。 |\n\n此示例复制所有以 `.txt` 结尾的文件：\n\n```\n\
  [student@OCS ~]$ cp *.txt ~\n```\n\n下一个一个示例将删除所有长度为四个字符的文件：\n\n```\n[student@OCS\
  \ ~]$ rm ????\n```\n\n要查看当前目录下所有以 `a`、`b` 或 `c` 开头的文件类型，请执行以下命令：\n\n```\n[student@OCS\
  \ ~]$ file [abc]*\n```\n\n上一个命令也可以这样执行：\n\n```\n[student@OCS ~]$ file [a-c]*\n```\n\
  \n其中 `a-c` 代表一个字符范围。这必须是 ASCII 文本表内的有效范围。要查看此表，请执行以下命令：\n\n```\n[student@OCS ~]$\
  \ man ascii\n```\n\n允许多个范围或值列表：\n\n点击此处查看代码图片\n\n```\n[student@OCS ~]$ file [a-cg-jz]*\n\
  ```\n\n通过在范围开头放置一个 `!` 字符，你可以指定哪些字符不能匹配。例如，以下命令将复制当前目录下所有不 `a`、`b` 或 `c` 开头的文件：\n\
  \n```\n[student@OCS ~]$ cp [!abc]* ~\n```\n\n上一个示例还说明可以使用多个通配符字符创建复杂的模式。\n\n###\
  \ Shell 扩展 (Shell Expansions)\n\nBASH 壳将许多字符视为“特殊”并将它们扩展为不同的含义。shell 扩展的一个示例是文件通配符（参见本章的“文件通配符”）。本节还提供了其他文件扩展功能的细节。\n\
  \n#### ${}\n\n通过变量扩展 BASH 功能，你可以返回不同的值。例如，如果 `$name` 变量未设置，以下内容将返回“Bob”：\n\n```\n\
  $ echo \"Hello, ${name:-Bob}\"\nHello, Bob$\necho \"Hello, $name\"\nHello,\n```\n\
  \n注意，使用上述语法不会设置变量，而是针对这种情况使用提供的值。要返回一个值并同时设置变量，请使用以下语法：\n\n```\n$ echo \"Hello,\
  \ ${name:=Bob}\"\nHello, Bob\n$ echo \"Hello, $name\"\nHello, Bob\n```\n\n还有其他变量扩展功能。例如，以下语法将仅返回变量的前\
  \ 24 个字符，产生一个更“振奋人心”的语句：\n\n点击此处查看代码图片\n\n```\n$ times=\"It was the best of times,\
  \ it was the worst of times.\"\n$ echo ${times: 0:24}\nIt was the best of times\n\
  ```\n\n注意在上述示例中，0 代表返回的起始位置，24 代表返回的字符数。\n\n#### $()\n\n命令替换是在较大的命令中执行子命令。这通常用于收集数据并存储在变量中。例如，以下命令将\
  \ `date` 命令的输出存储在 `$today` 变量中：\n\n```\ntoday=$(date)\n```\n\n命令替换可以通过使用两种方法之一完成：\n\
  \n*   `$(cmd)`\n*   `‘cmd’`\n\n注意第二方法使用的是反引号（也称为 *backtick*），而不是单引号。\n\n#### ‘\n\
  \n参见本章的“$()”节。\n\n### 重定向与管道\n\n参见 第 9 章中的“输出重定向”节，“给定场景创建、修改和重定向文件。”\n\n### 退出状态\
  \ (Exit Codes)\n\n当命令执行时，它会向执行它的 shell 或脚本返回一个成功（0）或失败（>1）。此状态存储在 `$?` 变量中。这是一个示例：\n\
  \n点击此处查看代码图片\n\n```\n[root@OCS ~]$ ls /etc/skel\n[root@OCS ~]$ echo $?\n0\n[root@OCS\
  \ ~]$ ls /junk\nls: cannot access /junk: No such file or directory\n[root@OCS ~]$\
  \ echo $?\n2\n```\n\n此返回值可以用于条件语句以判断命令是否成功执行：\n\n点击此处查看代码图片\n\n```\nsome_command\n\
  if [ $? -eq 0 ]\nthen\n     echo \"command executed successfully\"\nelse\n     echo\
  \ \"command failed\"\nfi\n```\n\n更多细节请参见本章的节。\n\n#### stderr\n\n参见 第 9 章”节。\n\n\
  #### stdin\n\n参见 第 9 章”节。\n\n#### stdout\n\n参见 第 9 章”节。\n\n\n\n\n\n元字符是针对 BASH shell\
  \ 的特殊字符。例如，文件通配符（`*`、`[ ]` 和 `?`）被视为元字符。本书中涵盖的额外元字符包括重定向字符（参见第 9 章中的“输出重定向”部分）和\
  \ `$` 字符（用于变量替换）。\n\n### 位置参数\n\n你可以像这样运行脚本：\n\n```\n./example.sh arg1 arg2 arg3\n\
  ```\n\n每个参数都存储在 `$1`、`$2`、`$3` 等。`$0` 是脚本本身的名字。\n\n特殊的 BASH 变量 `$#` 包含传递脚本的参数数量。\n\
  \n### 循环结构\n\n循环结构是 BASH 脚本中执行一组操作的代码，这些可能会执行多次。本节检查了三种常用的循环结构：`while`、`until` 和\
  \ `for` 循环。\n\n#### while\n\n`while` 循环设计用于只要条件语句返回真值就执行一组任务（命令）。例如，以下代码可用于检查用户输入以验证是否提供了正确的值：\n\
  \n点击此处查看代码图像\n\n```\nread -p \"Enter a zip code: \"\nwhile echo $zip | egrep -v\
  \ \"^[0-9]{5}$\"\ndo\n   echo \"$zip is not a valid ZIP code, try again\"\n   read\
  \ -p \"Enter a zip code\" zip\ndone\n```\n\n示例输出：\n\n点击此处查看代码图像\n\n```\nEnter a\
  \ zip code: 8888\n8888 is not a valid ZIP code, try again\nEnter a zip code: huh?\n\
  huh? is not a valid ZIP code, try again\nEnter a zip code: 92020\n```\n\n注意\n\n\
  `read` 命令从 `stdin` 读取输入，通常是用户的键盘输入。\n\n#### for\n\n`for` 循环用于遍历值列表。例如，以下代码将对文件列表执行\
  \ `wc -l` 命令：\n\n```\nfor file in \"/etc/r*.conf\"\ndo\n    wc -l $file\ndone\n\
  ```\n\n示例输出：\n\n```\n43 /etc/request-key.conf\n 3 /etc/resolv.conf\n61 /etc/rsyslog.conf\n\
  ```\n\n#### until\n\n`until` 语句的作用类似于 `while` 语句，但它在条件语句为假值时执行其代码集。对比 `while` 语句和\
  \ `until` 语句的伪代码：\n\n点击此处查看代码图像\n\n```\nwhile conditional_check\ndo\n    #如果 conditional_check\
  \ 返回真则执行\ndone\n\nuntil conditional_check\ndo\n    #如果 conditional_check 返回假则执行\n\
  done\n```\n\n### 条件语句\n\n`test` 语句用于执行条件测试。这些条件测试用于比较值和执行文件测试操作。\n\n运行 `test` 语句的常用方法是将操作放在方括号内。例如，以下两个语句执行相同的操作：\n\
  \n```\ntest $name1 = $name2\n[ $name1 = $name2 ]\n```\n\n下表描述了常用的 `test` 操作：\n\n\
  | 操作 | 描述 |\n| --- | --- |\n| `str1` = `str2` | 如果两个字符串相等则返回真。 |\n| `str1` != `str2`\
  \ | 如果两个字符串不相等则返回真。 |\n| `-z` `str` | 如果 `str` 长度为零则返回真；例如 `[ -z $name ]`。 |\n|\
  \ `-n` `str` | 如果 `str` 长度不为零则返回真；例如 `[ -n $name ]`。 |\n| `int1 -eq int2` | 如果两个整数相等则返回真。\
  \ |\n| `int1 -ne int2` | 如果两个整数不相等则返回真。 |\n| `int1 -gt int2` | 如果第一个整数大于第二个整数则返回真。\
  \ |\n| `int1 -ge int2` | 如果第一个整数大于等于第二个整数则返回真。 |\n| `int1 -lt int2` | 如果第一个整数小于第二个整数则返回真。\
  \ |\n| `int1 -le int2` | 如果第一个整数小于等于第二个整数则返回真。 |\n| `-d file` | 如果文件是目录则返回真。 |\n\
  | `-f file` | 如果文件是普通文件则返回真。 |\n| `-e file` | 如果文件存在（无论它是什么类型的文件或目录）则返回真。 |\n| `-r\
  \ file` | 如果文件可读则返回真。 |\n| `-w file` | 如果文件可写则返回真。 |\n| `-x file` | 如果文件可执行则返回真。\
  \ |\n\n#### if\n\n`if` 语句用于根据条件语句的结果执行一个或多个命令。例如，如果变量 `$name` 被设置为“Bob”，则将显示“hi”：\n\
  \n```\nif [ $name = \"Bob\" ]\nthen\n   echo \"hi\"\nfi\n```\n\n注意，要结束 `if` 语句内执行的命令，请使用\
  \ `fi` 语句（“if”的倒写）。\n\n`else` 语句与 `if` 语句配合使用，在条件返回假值时提供替代方案。这里有一个示例：\n\n```\nif\
  \ [ $name = \"Bob\" ]\nthen\n   echo \"hi\"\nelse\n   echo \"I don't know you\"\n\
  fi\n```\n\n可以执行多个条件检查，如下所示：\n\n```\nif [ $name = \"Bob\" ]\nthen\n    echo \"hi,\
  \ Bob\"\nelif [ $name = \"Sue\" ]\nthen\n    echo \"hi, Sue\"\nelse\n    echo \"\
  I don't know you\"\nfi\n```\n\n有关条件表达式更多信息，请参见本章中的“条件语句”部分。\n\n#### case\n\n`case`\
  \ 语句将变量的值与通配模式进行比较。\n\n语法：\n\n```\ncase $var in\nglob 1)\n    #statements\n    #statements;;\n\
  glob 2)\n    #statements;;\nesac\n```\n\n使用两个分号（`;`）结束一组语句，并且必须在下一个通配符之前使用它们。\n\n\
  示例：\n\n点击此处查看代码图像\n\n```\ncase $1 in\nstart)\n echo \"Starting the process\" ;;\n\
  stop)\n echo \"Stopping the process\" ;;\n*)\n echo \"I need start or stop\" ;;\n\
  esac\n```\n\n### 转义字符\n\n转义字符是指让特殊字符（又称元字符）被视为普通字符。例如，以下使用双引号禁用了重定向字符：\n\n```\n\
  $ echo \"this | that\"\nthis | that\n```\n\n以下是一些转义字符：\n\n- 双引号禁用重定向字符（`<`、`>`、`|`）和通配符字符（`*`、`[`、`]`）的特殊含义。\n\
  - 使用单引号禁用元字符。\n- 在任何元字符之前放置一个 `\\`（反斜杠字符）。\n\n## 第 26 章：在给定的场景下，使用 Git 进行版本控制\n\n\
  本章提供了有关以下主题的信息和命令：\n\n**参数**\n\n- clone\n- push\n- pull\n- commit\n- merge\n- branch\n\
  - log\n- init\n- config\n\n**文件**\n\n- .gitignore\n- .git/\n\n### 参数\n\nLinux+ 将包含关于\
  \ `git` 命令参数的问题。本节涵盖了这些可测试的参数。\n\n#### clone\n\n`git clone` 命令从远程仓库的内容创建本地仓库。提供的参数是远程仓库的位置。\n\
  \n示例：\n\n点击此处查看代码图像\n\n```\n$ git clone https://gitlab.com/borothwell/ocs.git\n\
  Cloning into 'ocs'...\nUsername for 'https://gitlab.com': borothwell\nPassword for\
  \ 'https://borothwell@gitlab.com':\nremote: Counting objects: 3, done.\nremote:\
  \ Total 3 (delta 0), reused 0 (delta 0)\nUnpacking objects: 100% (3/3), done.\n\
  Checking connectivity... done.\n```\n\n\n\n\n\n以下是 `git clone` 命令的一些重要选项：\n\n| 选项\
  \ | 描述 |\n| --- | --- |\n| `-v` | 详细模式 |\n| `--single-branch` |仅克隆单个分支，而不是克隆整个仓库。\
  \ |\n\n### push\n\n`git commit` 命令仅更新本地仓库。要将本地仓库的更改送到远程仓库，请使用 `git push` 命令：\n\n\
  点击此处查看代码图片\n\n```\n$ git push -u origin master\nUsername for 'https://gitlab.com':\
  \ borothwell\nPassword for 'https://borothwell@gitlab.com':\nCounting objects: 4,\
  \ done.\nCompressing objects: 100% (3/3), done.\nWriting objects: 100% (3/3), 370\
  \ bytes | 0 bytes/s, done.\nTotal 3 (delta 0), reused 0 (delta 0)\nTo https://gitlab.com/borothwell/ocs.git\n\
  \   12424f5..3b36054 master -> master\nBranch master set up to track remote branch\
  \ master from origin.\n```\n\n注意，上述输出中的最后信息解释了“origin”和“master”术语。“origin”指的是远程仓库，而“master”指的是应该更新的分支。\n\
  \n注意\n\n`git push` 命令将尝试将更改合并到现有文件中。如果无法自动处理，你可能需要执行手动合并操作。更多信息请参阅本章的“合并（merge)”节。\n\
  \n### pull\n\n如果远程仓库已发生更改，并且你想将这些更改下载到本地仓库，请使用 `git pull` 命令：\n\n```\n$ git pull\
  \ origin master\n```\n\n`origin`指的是远程仓库，而`master`指的是应该更新的分支。\n\n注意\n\n`git pull`\
  \ 命令将尝试将更改合并到现有文件中。如果无法自动处理，你可能需要执行手动合并操作。更多信息请参阅本章的“合并（merge)”节。\n\n### commit\n\
  \n要将工作目录中的更改放入本地仓库，你首先需要先将其添加到暂存区（staging area），然后需要将它提交到仓库，如下所示：\n\n点击此处查看代码图片\n\
  \n```\n$ git add first.sh\n$ git commit -m \"added first.sh\"\n[master 3b36054]\
  \ added first.sh\n 1 file changed, 5 insertions(+)\n create mode 100644 first.sh\n\
  ```\n\n`git add` 命令将文件放入暂存区。`git commit` 命令将取暂存区中的所有新文件并将它们提交到本地仓库。`-m` 选项用于添加消息（在本例中，给出了提交的原因）。\n\
  \n### merge\n\n假设你创建了一个新分支为文件添加一个新功能。在测试完此新功能后，你准备好在 `master` 分支中实现它。要做到这一点，你需要将新分支的内容（示例中的\
  \ `feature127` 分支）合并到 `master` 分支。首先提交 `feature127` 分支中的所有更改，然后切换回 `master` 分支：\n\
  \n点击此处查看代码图片\n\n```\n$ git commit -a -m \"feature added to showmine.sh\"\n[feature127\
  \ 2e5defa] feature added to showmine.sh\n 1 file changed, 5 insertions(+), 2 deletions(-)\n\
  $ git checkout master\nSwitched to branch 'master'\nYour branch is ahead of 'origin/master'\
  \ by 3 commits.\n  (use \"git push\" to publish your local commits)\n```\n\n你必须处于你想要合并入的分支中，才能正确运行下一个命令。下面的\
  \ `git merge` 命令将将 `feature127` 分支的更改合并到 `master` 分支：\n\n点击此处查看代码图片\n\n```\n$ git\
  \ merge feature127\nUpdating 4810ca8..2e5defa\nFast-forward\n showmine.sh | 7 +++++--\n\
  \ 1 file changed, 5 insertions(+), 2 deletions(-)\n```\n\n这种合并过程可能会更加复杂。例如，考虑以下命令的输出：\n\
  \n点击此处查看代码图片\n\n```\n$ git merge master\nAuto-merging showmine.sh\nCONFLICT (content):\
  \ Merge conflict in showmine.sh\nAuto-merging hidden.sh\nCONFLICT (content): Merge\
  \ conflict in hidden.sh\nAutomatic merge failed; fix conflicts and then commit the\
  \ result.\n```\n\n你可以看到合并没有完成，因为自动合并过程遇到了一些冲突。你也可以通过执行 `git status` 命令查看这些冲突：\n\n\
  点击此处查看代码图片\n\n```\n$ git status\nOn branch test\nYour branch is ahead of 'origin/test'\
  \ by 1 commit.\n  (use \"git push\" to publish your local commits)\n\nYou have unmerged\
  \ paths.\n  (fix conflicts and run commit)\n```\n\n\n\n\n```\n$ git checkout master\n\
  Switched to branch 'master'\nYour branch is ahead of 'origin/master' by 2 commits.\n\
  \  (use \"git push\" to publish your local commits)\n$ more hidden.sh\n#!/bin/bash\n\
  #hidden.sh\n\nls -ld .* $1\n```\n\n## log\n\n你可以使用 `git log` 命令查看在不同分支上的更改，以及你为每次更改提供的注释：\n\
  \n点击此处查看代码图片\n\n```\n$ git log --oneline --decorate --all\nef2d7d5 (test) changed\
  \ hidden.sh\n2b44792 (HEAD, master) deleting test.sh file\n19198d7 update 27\n07bb91c\
  \ (origin/master, origin/HEAD) adding showmine.sh\n  and hidden.sh\n75d717b added\
  \ first.sh\n9eb721e demostrating status\n3b36054 added first.sh\n12424f5 add README\n\
  ```\n\n`--oneline` 允许 `git log` 命令提供每次更改的单行摘要。`--decorate` 请求额外信息，如分支名称。`--all`\
  \ 要求查看所有分支的日志，而不仅仅是当前分支。\n\n## init\n\n要在当前本地目录中创建新仓库，请使用 `git init` 命令：\n\n点击此处查看代码图片\n\
  \n```\n$ git init test\nInitialized empty Git repository in /tmp/test/.git/\n```\n\
  \n## config\n\n`git config` 命令用于配置 `git` 工具。以下是一些常用选项：\n\n点击此处查看代码图片\n\n```\n$ git\
  \ config --global user.name \"Bo Rothwell\"\n$ git config --global user.email bo@onecoursesource.com\n\
  ```\n\n`--global` 选项会将配置选项存储在用户主目录下的配置文件中，如下：\n\n点击此处查看代码图片\n\n```\n$ more ~/.gitconfig\n\
  [user]\n        name = Bo Rothwell\n        email = bo@onecoursesource.com\n```\n\
  \n`git` 命令默认将使用此文件中的设置。你也可以通过 `--local` 选项将这些设置存储在当前仓库目录（当前目录下的 `.git` 目录）中。本地设置会覆盖全局设置。\n\
  \n还有几十个额外的设置，但大多数 `git` 命令的用户只会设置 `user.name` 和 `user.email`。\n\n## Files\n\nLinux+\
  \ 考试将包含一些影响 `git` 命令行为的文件问题。本节涵盖了这些考试中测试的文件。\n\n### .gitignore\n\n要让 `git` 命令忽略某个文件，请在工作目录中创建一个名为\
  \ `.gitignore` 的文件，并将要忽略的文件放入该文件中。以下是一个示例：\n\n点击此处查看代码图片\n\n```\n$ touch notes\n\
  ~/ocs$ git status -s\n?? notes\n$ vi .gitignore     #如下所示添加了 notes:\n$ cat .gitignore\n\
  notes\n$ git status -s\n?? .gitignore\n```\n\n注意，`.gitignore` 文件本身也必须放在 `.gitignore`\
  \ 文件中：\n\n点击此处查看代码图片\n\n```\n$ git status -s\n?? .gitignore\n$ vi .gitignore   \
  \    #如下所示添加了 .gitignore:\n$ cat .gitignore\nnotes\n.gitignore\n$ git status -s\n\
  ```\n\n注意\n\n你也可以在 `.gitignore` 文件中使用通配符（`*`、`?` 和 `[*range]`）来匹配一组文件。\n\n### .git/\n\
  \n本地仓库数据存储在 git 命令创建的目录下的 `.git` 目录下。例如，考虑以下命令：\n\n点击此处查看代码图片\n\n```\n$ git init\
  \ test\nInitialized empty Git repository in /tmp/test/.git/\n```\n\n该命令在 `/tmp`\
  \ 目录下执行，并创建了本地仓库目录 `/tmp/test`。仓库数据实际上存储在 `/tmp/test/.git` 目录中：\n\n点击此处查看代码图片\n\n\
  ```\n$ ls /tmp/test/.git\nbranches config description HEAD hooks info objects refs\n\
  ```\n\n`.git` 目录不应直接修改。该目录包含包含 git 仓库所有文件和版本的数据库集。\n\n## 第 27 章. 总结编排流程和概念\n\n本章提供了有关以下主题的信息和命令：\n\
  \n*   Agent\n*   Agentless\n*   Procedures\n*   Attributes\n*   Infrastructure automation\n\
  *   Infrastructure as code\n*   Inventory\n*   Automated configuration management\n\
  *   Build automation\n\n注意\n\n对于 Linux+ 认证考试，重要的是，对于列出的目标主题，你被要求能够“总结”编排流程和概念。换句话说，并不要求你了解有关设置、配置和管理编排流程的细节；相反，你应该理解编排的功能。\n\
  \n### Agent\n\n编排目的是简化复杂的设置任务。通常，设置软件或服务需要多个步骤，而且有时这些步骤需要在多个系统上执行。通过编排，这些步骤被提前计划并自动执行，方法可以是运行单个命令或点击\
  \ GUI 或基于 Web 的界面上的按钮。\n\n通常编排的组件之一是监控。监控用于判断是否因为系统发生了某些情况而需要采取操作。监控有两种类型：代理（agent）监控和无代理（agentless）监控。\n\
  \n`agent` 监控解决方案意味着在被监控的系统或组件上安装了某些软件。该代理会主动探测系统，并根据这些探测结果确定是否发生了需要采取操作的更改。\n\n\
  `agentless` 监控解决方案意味着系统中没有安装任何软件。无代理系统可以从系统接收数据，也可以通过进行远程查询来确定是否发生了更改。\n\n### Agentless\n\
  \n参见本章中的“[Agent”。\n\n### Procedures\n\n编排的 `procedure`（程序）是完成操作所需的步骤集合。程序可以是一个相当直观的步骤集合，也可以非常复杂并与属性的值绑定。\n\
  \n### Attributes\n\n`attribute`（属性）用于定义自定义自动化程序的参数。这些属性包含在每个编排流程中可能（且很可能）不同的数据。例如，假设程序被设计用于设置一个需要访问网络的系统。则需要为系统的\
  \ IP 地址、子网掩码、网关和路由器等项目定义属性。\n\n### Infrastructure Automation\n\n基础设施自动化是编排的一个组件。虽然许多人交替使用编排和自动化这两个术语，但它们之间存在区别。你完全可以有没有自动化的编排，但编排的主要目标之一是使过程自动化。\n\
  \n考虑以下编排场景：用户在基于 Web 的表单中填写数据字段。数据被用于填充属性（参见本章中的“#Attributes”）。用户随后点击“确定”按钮，然后执行程序（参见本章中的“#Procedures”）来编排一项服务。这就是没有自动化的编排。\n\
  \n\n\n\n\n现在考虑以下场景：一个代理正在监控系统，当达到某个阈值时（例如一小时内的最大 CPU 使用率），这会触发一个程序，该程序利用从数据库自动填充的属性来生成服务的第二个实例。整个过程中没有人工干预；编排过程自动处理了一切。这就是带有自动化的编排。\n\
  \n## 基础设施即代码\n基础设施即代码（也称为 `IaC`）是编排过程的核心。`IaC` 不再手动配置或供应系统，而是利用软件工具（编排产品）来执行这些任务。\n\
  \n## 清单\n当某项被编排时，编排软件需要对其进行跟踪。通常这个“某项”被称为 `instance`（实例），而关于该实例的信息存储在一个名为 `inventory`（清单）的数据库中。\n\
  \n## 自动化配置管理\n长期以来，配置管理一直是系统管理员手动处理的标准流程。由于没有实现自动化，这一过程通常非常耗时，并会导致系统配置错误。\n\n自动化配置管理的目的是确保软件、服务和系统维护在一致、可预测的状态。通过使用自动化配置管理工具，大量的工作负载将由自动化过程处理。与手动配置管理操作相比，这也能减少错误的发生。\n\
  \n常见的配置管理工具包括：\n* `Chef`\n* `Puppet`\n* `Ansible`\n\n## 构建自动化\n构建（也称为软件构建）是将新的源代码构建成可执行代码的过程，通常通过称为“编译”的过程来实现。如果手动执行，这可能是一个枯燥的过程且容易出错，因为构建大型程序时可能会涉及许多复杂的步骤。\n\
  \n构建自动化利用遵循一套规则的实用程序来自动执行软件构建过程。当配置正确时，构建自动化可以加快构建过程，并减少手动执行该过程时产生的错误。\n\n以下是一些常见的构建自动化工具：\n\
  * `Make`\n* `Ant`\n* `Gradle`\n* `Rake`\n* `Cake`\n\n## 附录.创建你自己的日志\n______________________________________________________________________________________________________________________________________\n\
