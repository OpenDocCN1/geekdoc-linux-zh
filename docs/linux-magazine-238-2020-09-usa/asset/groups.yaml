  - '[PAGE 440]


    In many companies, collaborative work in heterogeneous IT infrastructures has
    been the norm for years. However, different user needs and varying workplace requirements
    have created a very confusing market. In principle, three forms of IT infrastructure
    are suitable for modern workplaces: cloud-based, on-premises client-server infrastructure,
    or web-based applications that also access on-premises servers.


    While the web-based services run in the browser and do not require specific client-side,
    on-premises solutions, with their own clients and servers, are usually more complex
    to implement because they often


    include applications on the client computers. In contrast, cloud services are
    offered by various external service providers, who also manage the corporate-specific
    data infrastructure as a Software-as-a-Service (SaaS) on a subscription basis.


    On-premises solutions, on the other hand, benefit from the fact that they do not
    outsource the data and can therefore implement user data protection guidelines
    more easily. In addition, depending on the scope of the collaborative applications,
    they prove to be more cost-effective than a cloud-based service in the longer
    term. Cloud services, on the other hand, require hardly any administrative support.'
