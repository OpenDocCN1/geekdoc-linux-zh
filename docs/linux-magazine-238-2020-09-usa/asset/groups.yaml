  mdcn: '


    ## 站点配置


    ### 要求


    必须安装 Collab 服务器并配合公共 Collab 服务器 (https://collab.com) 一使用。


    安装 Collab 服务器是为了与公有 Collab 服务器协同工作。


    Collab 需要一个 ''admin'' 账户来访问和共享文件。


    可以使用 `collabware` 安装本地 Collab 服务器。


    Collab 服务器还需要根据允许的用户数量进行使用——即多于默认安装的试用版或开发者版本。


    - 管理员用户组 (Admin User group)

    - 设置 (Settings)

    - 数据库 (Database)

    - 文件 (Files)

    - 用户配置 (User Provisioning)

    - 导入 / 导出 (Import / Export)

    - 日志 (Logs)

    - 节点 (Nodes)

    - 性能 (Performance)

    - 邮件服务器项目管理器 (Mail Server Project Manager)


    | 管理控制台（需要下方用户名和密码） |

    |---|


    ## 有集群了吗？


    关注 HPC Update 新事通讯，获取有关高性能计算的新闻、观点和真实世界的的技术文章。


    https://bit.ly/HPC-ADMIN-Update


    我们很荣幸赞助此处展示的精选活动


    '
