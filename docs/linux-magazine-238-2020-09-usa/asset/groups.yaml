- md: "\n## What?!\nI can get my issues SOONER?\n\nAvailable anywhere, anytime!\n\n\
    Sign up for a digital subscription and enjoy the latest articles on trending topics,\
    \ reviews, cool projects and more...\n\nSubscribe to the PDF edition: shop.linuxnewmedia.com/digisub\n\
    \nNow available on ZINIO: bit.ly/Linux-Pro-ZINIO\n\n```c\n/*\n * kernel/sched/loadavg.c\n\
    \ *\n * This file contains the magic bits required to compute the global loadavg\n\
    \ * It is a silly number but people think it is important. We go through\n * great\
    \ pains to make it work on big machines and tickless kernels.\n */\n#include \"\
    sched.h\"\n```\n\n## Too Swamped to Surf? Network & Security offers additional\
    \ news and technical articles you won't see in our print magazine. Subscribe today\
    \ to our free newsletter and receive:\n\n- Helpful updates on our best features\n\
    - Timely discounts and special bonuses only to newsletter readers\n- Deep knowledge\
    \ of the new IT bit.ly/HPC-Update\n\n## Shop the Shop\nshop.linuxnewmedia.com\n\
    \n## Missed an issue? You're in luck. Most back issues are still available. Order\
    \ now before they're gone!\nshop.linuxnewmedia.com\n\n## If you work with high-performance\
    \ clusters, or if you're ready to expand your skill set with how-to articles,\
    \ news, and technical reports on HPC technology.\nadmin-magazine.com/HPC\n"
