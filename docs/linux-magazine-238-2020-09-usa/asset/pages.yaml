  md: '# Site configuration


    Requirements / please notes


    The Collab Online server must be installed and used with a public Collab Online
    server (https://collabonline.com)


    The Collab Online server is installed to work with a public Collab Online server.


    An ''admin'' account is required for Collab Online to access files and sharing
    files.


    A local Collab Online server can be installed with the groupware-collab key.


    The Collab Online server also needs to use it with the allowed number of users
    - more than the trial or developer version, installed by default.


    +   * Admin

    * User group

    * Settings

    * Database

    * Web configuration

    * Files

    * Tasks

    * User Provisioning

    * Manager

    * Import / Export

    * Logs

    * Nodes

    * Performance

    * Mail Server

    * Project Manager


    Support keys


    | Admin console | (requires username and password below) |

    |---|---|'
