  md: '# # Bodhi Linux


    Welcome and thank you for choosing Bodhi Linux: the most beautiful Established
    Linux distribution


    Bodhi is a lightweight Linux distribution that uses the Moksha desktop manager.
    Our philosophy is to provide a minimal base system, where users can install the
    software they want.


    You will need an internet connection to update or install software in Bodhi. Please
    follow this link if you need assistance: Connecting to the Internet.


    System updates are important for your security perspective. The recommended way
    to perform system updates is to open a terminal and run:


    ```

    sudo apt update && sudo apt upgrade

    ```


    # Manuals specific to Debian


    +   - Debian FAQ

