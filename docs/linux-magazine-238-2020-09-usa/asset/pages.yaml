  md: '# Apache2 Ubuntu Default Page


    It works!

    This is the default welcome page for the Apache web server after installation
    on an Ubuntu-based system. It is based on the example page on Debian, from which
    the Ubuntu Apache packaging is derived. If you want to change this page, first
    replace this file (located at /var/www/html/index.html) before continuing to restart
    your server.


    If you are seeing this page instead of the web page content you expected to see,
    it probably means that the site is currently unavailable due to maintenance. If
    the problem persists, please contact the site''s administrator.


    Apache2 default configuration is different from the upstream default configuration,
    and split into several files optimized for Ubuntu. The sites are located in /etc/apache2/sites-available.
    The configuration for the web server can be found by accessing the manual if the
    apache2-doc package was installed on Ubuntu systems or as follows:


    ```

    /etc/apache2/

    - apache2.conf

    - a2handler.conf

    - conf/*.conf

    - sites-available/*.conf

    - sites-enabled/*.conf

    ```'
