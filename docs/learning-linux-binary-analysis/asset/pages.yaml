  md: '# ELF Virus Technology – Linux/Unix Viruses


    The art of virus writing has been around for several decades now. In fact, it
    goes all the way back to the Elk Clone Apple virus that was successfully launched
    in the wild in 1981 through a floppy disk video game. Since the mid ''80s and
    through the ''90s, there have been various secret groups and hackers who have
    used their arcane knowledge to design, release, and publish viruses in virus and
    hacker e-zines (see http://vxheaven.org/lib/static/vdat/zines.htm).


    The art of virus writing is usually of great inspiration to hackers and underground
    technical enthusiasts, not because of the destruction that they are capable of,
    but rather the challenge in designing them and the unconventional coding techniques
    that are required to succeed in programming a parasite that keeps its residency
    by hiding in other executables and processes. Also, the techniques and solutions
    that come with keeping a parity stealth, such as polymorphic and metamorphic code,
    present a unique challenge to programmers.


    UNIX viruses have been around the early ''90s, but I think many would agree to
    say that the true father of the UNIX virus is Silvio Cesare (http://vxheaven.org/lib/vsc02.html),
    who published many papers in the late ''90s on ELF virus infection methods. These
    methods are still being used in different variations.


    Silvio was the first to publish some awesome techniques, such as PLT/GOT redirection,
    text segment padding infections, data segment infections, relocatable code injection,
    /dev/kmem patching, and kernel function hijacking. Not only that, but he personally
    played a big role in my introduction to ELF binary hacking, and I will always
    remain grateful for his influence.'
