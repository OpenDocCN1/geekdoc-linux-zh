  md: 'Another anti-exploitation feature that Maya enforces relro (read-only relocations).

    Most modern Linux systems have this feature enabled, but if it is not enabled,
    Maya will enforce it on its own by creating a read-only page with mprotect() that
    encompasses the.jcr, .dynamic, .got, .ctors (.init_array), and .dtors (.finiarray)
    sections. Other anti-exploitation features (such as function pointer integrity)
    are being planned for future and have not yet it into the code base.


    # Downloading Maya-protected binaries


    For those who are interested in reverse-engineering some simple programs that
    were protected with Maya''s Veil, feel free to download a couple of samples that
    are available at: http://www.bitlackey.org/crackmes.tgz. This link contains three
    files: crackme_elf_hardest, crackme_elf_medium, and test.maya.


    # Anti-debugging for binary protection


    Since binaries generally encrypt or obfuscate the physical body of a program,
    static analysis can be extremely difficult and, left to its devices, will prove
    to futile in many cases. Most reverse engineers who are attempting to unpack or
    break a protected binary will agree that a combination of dynamic and static analysis
    must be used to gain access to the decrypted body of a binary.


    A protected binary has decrypt itself, or at least portions of itself that are
    executing at runtime. Without any anti-debugging techniques, a reverse engineer
    can simply attach to the process of the protected program and set a breakpoint
    on the last instruction of the stub (assuming that the stub decrypts the entire
    executable).


    Once the breakpoint is hit, the attacker can look at the code segment for the
    protected binary and finds its decrypted body. This would be extremely simple,
    and therefore it is very important for good binary protection to use as many techniques
    as possible to make debugging and dynamic analysis difficult for the reverse engineer.
    A protector like Maya go to lengths to protect the binary from both static and
    dynamic analysis.


    Dynamic analysis is not limited to the ptrace syscall, although most debuggers
    are limited to it for the purpose of accessing and manipulating a process. a binary
    protector should not be limited to protecting only against ptrace; ideally it
    will also be resistant to other forms of dynamic analysis, such as emulation and
    dynamic instrumentation (for example, Pin and DynamoRIO). We covered many anti-debugging
    techniques against ptrace analysis in previous chapters, but about resistance
    to emulation?'
