  md: 'This could indicate shared library injection (also known as the ET_DYN injection),
    which would mean that this is not the authentic libelinux.so library. The first
    thing that we might check for in this case is the LD_PRELOAD environment variable
    to see whether it was used to preload libelinux.so library.


    # Finding LD_PRELOAD on the stack


    The environment variables for a program are stored near the bottom of the stack
    at the beginning of a program''s runtime. The bottom of the stack is actually
    the highest address (beginning of the stack), since the stack grows into smaller
    addresses on the x86 architecture. Based on the output from /proc/<pid>/maps,
    we can get the location of the stack:


    ```

    STACK_TOP               STACK_BOTTOM

    7fff82fae000           7fff82fc0000

    ```


    So, we want to check from 0x7fff82fc000 onward. Using GDB, we can attach to the
    process and quickly locate the environment variables on the stack using the x/s
    <address> command, which tells GDB to view the memory in ASCII format. The x/4096s
    <address> command does the same thing but reads from 4,096 bytes of data.


    We can safely ensure that the environment variables will be in the first 4,096
    bytes of the stack, but since the stack grows into lower addresses, we must start
    reading at <stack_bottom> - 4096.


    > The argv and env pointers point to command-line arguments and environment variables
    respectively. We are not looking for the actual pointers but rather the strings
    that these pointers reference.


    Here''s an example of using GDB to read environment variables on a stack:


    ```

    $ gdb -attach "pidof host"

    $ x/4096s (0x7fff82fc000 - 4096)

    ```


    ... down a few pages ...


    ```

    0x7fff82ce359: "./host"

    0x7fff82ce360: "LD_PRELOAD=/libelinux.so"

    0x7fff82ce37b: "XDG_VTNR=7"

    --Type <return> to continue, or q <return> to quit----

    0x7fff82ce386: "XDG_SESSION_ID=c2"

    ```'
