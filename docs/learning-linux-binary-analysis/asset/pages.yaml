    ```

    7fa7e5d40000-7fae9d43000 rwx 00000000 00:00 0

    7fa7e9d43000-7fae1a46000 r-p 00000000 00:00 0

    7fa7e1a46000-7fae3001000 r-xp 00000000 08:01 11406096 /lib/x86_64-linux-gnu/libc-2.19.

    7fa7e3001000-7fae5000000 r--p 0001b000 08:01 11406096 /lib/x86_64-linux-gnu/libc-2.19.so

    7fa7e5000000-7fae5040000 r-xp 0001a000 08:01 11406096 /lib/x86_64-linux-gnu/libc-2.19.so

    7fa7e5040000-7fae5060000 r-xp 0001e000 08:01 /lib/x86_64-linux-gnu/libc-2.19.so

    7fa7e5060000-7fae50b0000 r--p 00000000 00:00 0

    7fa7e50b0000-7fae5340000 r--p 00000000 00:00 0

    7fa7e5340000-7fae6340000 r-wx 00000000 00:00 0 [stack:8176]

    7fa7e6340000-7fae6570000 r--p 00000000 00:00 0

    7fa7e6570000-7fae6a01000 r-xp 00000000 08:01 11406093 /lib/x86_64-linux-gnu/ld-2.19.so

    7fa7e6a01000-7fae6a50000 r--p 00000000 00:00 0

    7fa7e6a50000-7fa7e8570000 r--p 00000000 00:00 0

    ```


    We can clearly see that the dynamic linker is mapped into the process address
    space, and so is lib. As discussed in Chapter 5, Linux Binary Forensics, this
    is because the protection becomes responsible for loading the dynamic linker and
    setting up the auxiliary vector.


    From the program header output, we can also see that the text segment address
    is 0xa00000, which is unusual. The default linker for compiling executables in
    x86_64 defines the text address as 0x400000, and on 32-bit systems it is 0x8048000.Having
    a address other than the default does not, on its own, suggesting anything malicious,
    but should immediately raise suspicion. In the case of a binary protector, the
    stub must have a virtual address that does not conflict with the virtual address
    of the self-embedded executable it protecting.


    # Analyzing a protected binary


    True binary protection schemes that really do a good job will not be very easy
    to circumvent, but in cases that you can use some reverse engineering efforts
    to get past the encryption layer. The stub is responsible for decrypting the stub-embedded
    executable within it, which can therefore be extracted from memory. The trick
    is to allow the stub long enough to map the encrypted executable into memory and
    decrypt it.'
