  md: '# Chapter 2


    The auxiliary vector gets up by a kernel function called create_elf_tables() that
    resides in the Linux source code /usr/src/linux/fs/binfmt_elf.c.


    In fact, the execution process from the kernel looks something like the following:


    +   - sys_execve() ->

    - do_execve_common() ->

    - search_binary_handler() ->

    - load_elf_binary() ->

    - create_elf_tables() ->


    The following is some of code from create_elf_tables() in /usr/src/linux/fs/binfmt_elf.c
    adds aux entry:


    ```

    NEW_AUX_ENT(AT_PAGESIZE, ELF_EXEC_SIZE);

    NEW_AUX_ENT(AT_PHDR, load_addr + exec->ephoff);

    NEW_AUX_ENT(AT_PHENT, sizeof(struct_phdr));

    NEW_AUX_ENT(AT_PHNUM, exec->ephnum);

    NEW_AUX_ENT(AT_INTERP, interp_load_addr);

    NEW_AUX_ENT(AT_ENTRY, exec->e_entry);

    ```


    As you can see, the entry point and the address of the program headers, among
    other values, are placed onto the stack with the NEW_AUX() macro in the kernel.


    Once a program is loaded into memory and the auxiliary vector has been filled
    in, control is passed to the dynamic linker. The dynamic linker resolves symbols
    and relocations for shared libraries that are linked into the process address
    space. By default, an executable is dynamically linked with the GNU C library
    libc.so. The add command will use the shared library dependencies of a given executable.


    # Learning about the PLT/GOT


    The PLT (procedure linkage table) and GOT (Global offset table) can be found in
    executable files and shared libraries. We will be focusing on the PLT/GOT of an
    executable program. When a program calls a shared library function as strcpy()
    or printf(), which are not resolved until runtime, there must exist a mechanism
    to dynamically link the shared libraries and resolve the addresses to the shared
    functions. When a dynamically linked program is compiled, it handles shared library
    function calls in a specific way, far differently from a simple call instruction
    to a local function.


    [ 41 ]'
