  md: '# Text segment code injections


    This is a simple technique and not very useful for anything other than injecting
    shellcode, which should then quickly be replaced with the original code once the
    shellcode has finished executing. Another reason you would want to directly modify
    the text segment is to create trampolines, which we discussed earlier in this
    chapter, or to directly modify the .plt code. As far as code injection goes, though,
    it is preferable to load code into the process or create a new mapping where code
    can be stored; otherwise, the text segment could easily be detected as modified.


    # Executable injections


    As mentioned previously, dlopen() is capable of loading PIE executables into a
    process, and I even included a link to Saruman, which the crafty software allows
    you to run programs injecting within existing processes for-forensics measures.
    But what about injecting ET_EXEC type executables? This executable does not provide
    any relocation information except for dynamic-linking R_X86_64_JUMP_SLOT/R_386_JUMP_SLOT
    relocation types. This means that injecting a regular executable into an existing
    process is ultimately going to be unreliable, especially when injecting more complex
    programs. Nevertheless, I PoC of this technique called elfemon, which makes the
    executable to some new mappings that do not conflict with the host process executable
    mappings. It hijacks control (unlike Saruman, which allows concurrent execution)
    and passes control back to the host process once it is done running. An example
    of this can be found at http://www.btatiacks.org/projects/elfemon.tgz


    # Relocatable code injection – the ET_REL injection


    This method is very similar to shared library injection but is not compatible
    with dlopen(). ET_REL (.files) are relocatable code, much like ET_DY (.so files),
    they are not meant to be executed as single files; they are meant to link into
    either executable or a shared library, as discussed in Chapter 2, The ELF Binary
    Format. This, however, doesn''t mean you can''t inject them, relocate them, and
    execute their code. This can be done using any of the techniques described earlier
    except dlopen(). So, open/mmap is sufficient but requires that you manually handle
    the relocations, which can be done using ptrace. In Chapter 2, The ELF Binary
    Format, we gave an example of the relocation code in the software that I designed,
    called Quenya. This demonstrates how to handle relocations in an object file when
    injecting it into an executable. The same principles can be used when injecting
    one into a process.'
