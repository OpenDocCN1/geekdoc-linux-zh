  md: '# .so injection with open()/mmap() shellcode


    This is a way to load any file (including shared libraries) into the process address
    space by injecting shellcode (using ptrace) into an existing process'' text segment
    and executing it to perform open/mmap on a shared library into the process. We
    demonstrated this in Chapter 3, Linux Tracing, using our code_inject.c example,
    which loaded a very executable. That same code could be used to load a shared
    library in as well. With this technique that most shared libraries that you will
    want to load will require relocations. open()/mmap() only load the file into memory
    but won''t handle code relocations, so mostly any shared library that you will
    want to load will not properly execute unless it''s completely position-independent
    code. At this point, you could choose to manually handle the relocations by parsing
    the shared libraries'' relocations and applying them in memory using ptrace().
    Fortunately, an easier solution exists, which we will discuss next.


    # .so injection with dlopen()/shellcode


    The dlopen() function is used to dynamically load shared libraries that an executable
    was not linked with in first place. Developers often use this as a way to create
    plugins for their applications in the form of shared libraries. A program can
    call dlopen() to load a shared library on the fly, and actually invokes the dynamic
    linker to perform all of the relocations for you. There is a problem, however:
    most processes do not have dlopen() available to them, because it exists in libdl.so.2.
    Fortunately, there is also a solution to this: almost every single program has
    mapped into the process space by default (unless it was explicitly compiled otherwise)
    and libc.so has an equivalent to dlopen() called __libc_dlopen_mode(). This is
    used in the exact same way as that, but it requires a special flag be set:


    ```

    #define DLOPEN_MEM_FLAG 0x08000000

    ```


    This isn''t much of a hurdle. Prior to using you must first resolve it by getting
    the base address of libc.so in the process you want to inject, resolve the symbol
    for __libc_dlopen_mode(), and then add the symbol value st_value (refer to Chapter
    2, The ELF Binary Format) to the base address of libc to get the final address
    of __libc_dlopen_mode(). You can then design shellcode in C or assembly that calls
    __libc_dlopen_mode() to load your shared library into the process, with full relocations
    and ready to execute.


    __libc dlsym() function can then be used to resolve symbols within your shared
    library. See the dlopen manpages for more details on dlopen() and dlsym().'
