  md: '# GOT – global offset table poisoning or PLT/GOT redirection


    Also PLT/GOT infection, GOT poisoning is probably the best way to hijack shared
    library functions. It is relatively easy and allows attackers to make good use
    of the GOT, which is a table of pointers. Since we discussed the GOT in depth
    in the dynamic linking section in Chapter 2, The ELF Binary Format, I won’t elaborate
    more on its purpose. This technique can be applied by infecting a binary’s GOT
    directly or simply doing it in memory. There is a paper about doing this in memory
    that I wrote in 2009 called Modern Day ELF runtime via GOT poisoning at http://vxachem.org/lib/vrn0.html,
    which explains how to do this in this runtime process and also provides a technique
    that can be used by bypassing security restrictions imposed by


    # Infecting data structures


    The data segment of an executable contains global variables, function pointers,
    function structures. This opens up an attacker vector that is likely to specify
    executables, as each program has a different layout in the data segment: different
    variables, structures, function pointers, and so. Nonetheless, if an attacker
    is aware of the layout, they can manipulate them by overwriting function pointers
    and other data to change the behavior of the executable. One good example of this
    is with data/ .bss buffer overflows. As we learned in Chapter 2, The ELF Binary
    Format, .bss is allocated at runtime (at the end of the data segment) and contains
    uninitialized global variables. If someone were able to overflow a buffer that
    contained a path to an executable that is executed, then one could control which
    executable would run.


    # Function pointer overwrites


    This technique really falls into the last one (infecting data structures) and
    also into the one pertaining to .dtors/.dtors function pointer overwrites. For
    the sake of completeness, I have listed it as its own technique, but essentially,
    these pointers are going to be in the data segment and in .bss (initialized/uninitialized
    static data). As we’ve already talked about, one can overwrite a function pointer
    to change the control flow so that it points to the parasite.'
