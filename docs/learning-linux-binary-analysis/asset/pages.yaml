  md: "# Chapter 2\n\nThe dynamic linker utilizes the Elf_Dyn d_tags to locate the\
    \ different parts of the dynamic segment that contains a reference to a part of\
    \ the executable through the d_tag such as DT_SYMTAB, which has a d_ptr to give\
    \ the virtual address to the symbol table.\n\nWhen the dynamic linker is mapped\
    \ into memory, it handles any of its relocations if necessary; remember that the\
    \ linker is a shared library itself. It then looks at the executable program's\
    \ dynamic segment and searches for the DT_NEEDED tags that contain pointers to\
    \ the strings or pathnames of the necessary libraries. When it maps a needed shared\
    \ library into memory, it accesses the library's dynamic segment (yes, they too\
    \ have dynamic segments) and adds the library's symbol table to a chain of symbol\
    \ tables that exists to hold the symbol tables for each mapped library.\n\nThe\
    \ linker creates a struct link_map entry for each shared library and stores it\
    \ in a linked list:\n\n```\nstruct link_map\n{\n    ElfW(Addr) *1_addr; /* Base\
    \ shared object is loaded at. */\n    char *1_name;      /* Absolute file name\
    \ object was found. */\n    ElfW(Dyn) *1_ld;   /* Dynamic section of the shared\
    \ object. */\n    struct link_map *1_next; /* Chain of loaded objects. */\n};\n\
    ```\n\nOnce the linker has building its list of dependencies, it handles the relocations\
    \ on each library, similar to the relocations discussed earlier in this chapter,\
    \ as well as fixing up the PLT/GOT of shared libraries as well, Lazy linking still\
    \ applies to the PLT/GOT (of type R_386_JMP_SLOT) won't happen until a function\
    \ is called.\n\nFor more detailed information on ELF and dynamic linking, read\
    \ the ELF specification online or take a look at some of the interesting glibc\
    \ source code available. Hopefully, dynamic linking has become less of a mystery\
    \ and more of an intrigue at this point. In Chapter 7, Process Memory Forensics\
    \ will be covering PLT/GOT poisoning techniques to redirect shared library function\
    \ calls. A very fun technique is to subvert dynamic linking.\n\n[ 47 ]"
