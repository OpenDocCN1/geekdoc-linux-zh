- img_proc: true
  md: 'Maya is extremely complicated, documenting all of its inner workings would
    be a complete exegesis on the subject of binary protection, but I will summarize
    some of its most important qualities. Maya can be used to create a layer 1, layer
    2, or layer 3 protected binary. At the first layer, it uses an intelligent runtime
    engine; this engine is compiled as an object file runtime.o.


    This file is injected using a reverse-tect extension (Refer to Chapter 4, ELF
    Virus Technology – Linux/Unix Viruses), combined with relocatable code injection
    relinking techniques. Essentially, the object file for the runtime engine is linked
    to the executable that it protects. This file is very important as it contains
    the code for anti-debugging, anti-exploitation, custom malloc with an encrypted
    heap, metadata about the binary that it is protecting, and so on. This file was
    written in 90% C and 10% x86 assembly.


    # Maya’s protection layers


    Maya has multiple layers of protection and encryption. Each additional layer enhances
    the level of security by adding more for an attacker to peel off. The outermost
    layers are the most useful for preventing static analysis, whereas the innermost
    layer (layer 1) only decrypts the functions within the present call stack and
    re-encrypts them when done. This runtime.o contains an intelligent and autonomous
    engine. The following is a more detailed explanation of each layer.


    # Layer 1


    Layer 1 protected binary consists of every single function of the binary individually
    encrypted. Every function decrypts and re-encrypts on the fly, as they are called
    and returned. This runtime.o contains an intelligent and autonomous self-debugging
    capability that allows it to closely monitor the execution of a process and determine
    when it is being attacked or analyzed.


    The runtime engine itself has been obfuscated using code obfuscation techniques,
    as such found on Scott''s object obfuscator tool. The key storage and metadata
    for the decrypting and re-encrypting functions are stored in a custom malloc()
    implementation that uses an encrypted heap spawned by the runtime engine. This
    makes locating the keys difficult. Layer 1 protection is the first and most complex
    level of protection due to the fact that it instruments the binary with an intelligent
    and autonomous self-tracing capability for dynamic decryption, anti-debugging,
    and anti-exploitation abilities.'
