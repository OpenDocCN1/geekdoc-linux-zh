  md: '# Process image reconstruction – from the memory to the executable


    One needs exercise to test our abilities with both the ELF format and ptrace to
    design software that can reconstruct a process image back into a working executable.
    This is especially useful for forensic work where we find a suspicious program
    running on the system. Extended core snapshot (ECFS) technology is capable of
    this and extends functionality into an innovative forensics and debugging format
    while replacing the traditional Linux core files''! This is available at https://github.com/elfmaster/ecfs
    and is further documented in Chapter 8, ECFS – Extended Core File Snapshot Technology,
    in this book. Quenya also has this feature and is available for download at http://www.bitlacks.org/projects/quenya_32bit.tgz.


    # Challenges for process-executable reconstruction


    In order to reconstruct a process back into an executable we must first consider
    the challenges involved, as there are a myriad things to consider. There is one
    particular type of variables over which we have no control, and there are the
    global variables in the initialized data. They will have possibly changed at runtime
    to variables dictated by the code, and we will have no way of knowing what they
    are supposed to be initialized before runtime. We may not be able to find this
    out by static code analysis.


    The following are the goals for executable reconstruction:


    +   - Take a process ID as an argument and reconstruct that process image back
    into its executable file state

    - We should construct a minimal set of section headers so that the program can
    be analyzed by tools such as objdump and gdb with better accuracy


    # Challenges for executable reconstruction


    Full executable reconstruction is possible, but it comes with some challenges,
    especially when reconstructing a dynamically linked executable. Here, we will
    go over what the primary challenges are and what the general solution is for each
    one.'
  merge: -1
