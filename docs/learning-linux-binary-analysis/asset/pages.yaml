    7fed3dc9b000-7fed3dc9b100 rw-p 00000000 00:00 00:00

    ```


    # The stack, vdso, and vsyscall


    At the end of the maps, you will see the segment, shared by VDSO (short for Virtual
    Dynamic Object) and vsyscall:


    ```

    7fff0975f000-7fff097f8000 rw-p 00000000 00:00 00:00 [stack]

    7fff097b2000-7fff097b4000 r-xp 00000000 00:00 00:00 [vdso]

    ffffffffffffffffffffffff601000 r-xp 00000000 00:00 00 [vsyscall]

    ```


    VDSO is used by glibc to invoke system calls that are frequently called and would
    otherwise create a performance issue. VDSO speed up this by executing certain
    syscalls in userland. The vsyscall page is deprecated on x86_64, but on 32-bit,
    it completes the same thing as VDSO.


