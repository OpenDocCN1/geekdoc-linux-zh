  md: 'ELF Virus Technology – Linux/Unix Viruses


    In this chapter, we will discuss why it is important to understand an ELF virus
    technology and how to design them. The technology behind an ELF virus can be utilized
    for many things other than writing viruses, such as security, software engineering,
    and patching and hot patching, and reversing. In order to reverse-engineer a virus,
    it would beho you to understand how of them work. It is worth noting that I recently
    reverse-engineered and wrote a profile for a unique and exceptional virus called
    Retaliation. This work can be found at http://www.bitlackeys.org/#retaliation.


    # ELF virus technology


    The world of ELF virus technology shall open up many doors to you as a hacker
    and engineer. To begin, let''s discuss what an ELF virus is. Every executable
    program has a control flow, also the path of execution. The first aim of an ELF
    virus is to hijack the control flow so that the path of execution is temporarily
    altered in order to execute the parasite code. The parasite code is usually responsible
    for setting up hooks to hijack functions and for copying itself (the body of the
    parasite code) into another program that hasn''t yet been infected by the virus.
    Once the parasite code is done running, it jumps to the original entry point or
    the regular path of execution. This way, the virus goes unnoticed, since the host
    program appears to be executing normally.


    ![](img/10a855ebad6fe689ed3447763aed6bf4_116_0.png)'
