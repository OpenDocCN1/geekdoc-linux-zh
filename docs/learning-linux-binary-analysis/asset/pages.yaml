    # IDA Pro


    Since this book tries to focus on the anatomy of the ELF format, and the concepts
    behind analysis and patching techniques, we are less focused on which of the fancy
    tools to use. The very famous IDA Pro software has a well-deserved reputation.
    It is hands down the best disassembler and decompiler available to the public.
    It is expensive though, and unless you can afford a license, you may have settled
    for something a little less effective, such as Hopper. IDA IDA Pro is quite complicated
    and requires an entire book unto itself, but in order to properly understand and
    use IDA for ELF binaries, it is good to first understand the concepts taught in
    this book, which can be applied when using IDA Pro to reverse-engineer software.


    # Summary


    In this chapter, you learned the fundamentals of ELF binary analysis. You examined
    the procedures in identifying various types of virus infection, function hijacking,
    and binary protection. This chapter will serve you well in the beginner to intermediate
    phases of ELF binary analysis: what to look for and how to identify it. In the
    following chapters, you will cover similar concepts, such as analyzing process
    memory for identifying anomalies such as backdoors and memory-resident viruses.


    For those interested in knowing how methods described in this chapter could be
    used in the development of an anti-virus or detection software, there do exist
    tools I have designed that use similarities to those described in this chapter
    for detecting ELF infections. One of these tools is called AVU and was mentioned
    with a download link in Chapter 4, ELF Virus Technology – Linux/Unix Viruses.
    Another one is named Arcana and is still private. I have not personally seen any
    public products on the market that use these types of heuristics on ELF binaries,
    although such tools are sorely needed to aid Linux binary forensics. In Chapter
    8, ECFS – Extended Core File Snapshot Technology, we will explore ECFS, which
    is a technology I have been working on to help improve some of the areas where
    forensics capabilities are lacking, especially as it pertains to process forensics.


