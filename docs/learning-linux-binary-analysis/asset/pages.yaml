  md: "# The .bss section\n\nThe bss section contains uninitialized global data as\
    \ part of the data segment and therefore takes up no space on disk other than\
    \ 4 bytes, which represents the section itself. The data is initialized to zero\
    \ at program load and the data can be assigned values during program execution.\
    \ The bss section is marked SHT_NOBITS since it contains no actual data.\n\n#\
    \ The .got.plt section\n\nThe Global offset table contains the GOT table. This\
    \ works with the PLT to provide access to imported shared library functions and\
    \ is modified by the dynamic linker at runtime. This section in particular is\
    \ often abused by attackers who gain a pointer-sized primitive in heap or .bss\
    \ exploits. We will discuss this in the ELF Dynamic Linking section of this chapter\
    \ which has to do with program execution and therefore is marked as type SHT_PROGBITS.\n\
    \n# The .dynym section\n\nThe dynym section contains dynamic symbol information\
    \ imported from shared libraries. It is contained within the text segment and\
    \ is marked SHT_DYNSYM.\n\n# The .dynstr section\n\nThe dynstr section contains\
    \ the string table for dynamic symbols that has the name of each symbol in a series\
    \ of null terminated strings.\n\n# The .rel.* section\n\nRelocation sections contain\
    \ information about how parts of an ELF object or process image need to be fixed\
    \ up or modified at linking or runtime. We will discuss more about relocations\
    \ in the ELF Relocations section of this chapter relocation sections are marked\
    \ as type SHT_REL since they contain relocation data.\n\n# The .hash section\n\
    \nThe hash section, sometimes called .gnu.hash, contains a hash table for symbol\
    \ lookup. The following hash algorithm is used for symbol name lookups in Linux\
    \ ELF:\n\n```\nuint32_t\ndl_new_hash (const char *s)\n{\n    uint32_t h = 5381;\n\
    ```"
