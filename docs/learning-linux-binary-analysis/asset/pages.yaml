    # # Shared object loading – legitimate or not?


    The dynamic linker is the only legitimate way to bring a shared library into a
    process. however, however, that an attacker can use the libc_dlopen_mode function,
    which invokes the dynamic linker to load an object. So how do we tell when the
    dynamic linker is doing legitimate? There are three legitimate ways in which shared
    object is mapped to a process by the dynamic linker.


    # # legitimate shared object loading


    Let''s look at what we consider shared object loading:


    +   * There is a valid DT_NEEDED entry in the executable program that corresponds
    to the shared library file.

    * The shared libraries that are valid loaded by the dynamic linker may in turn
    their own DT_NEEDED entries in order to load other shared libraries. This can
    be called as transitive shared library loading.

    * If a program is linked with libdl.so, then it may use the dynamic linker functions
    to load libraries on the fly. The function for loading shared objects is named
    dlopen, and the function for resolving symbols is named dlsym.


    > As we have previously discussed, the LD_PRELOAD environment variable also invokes
    the dynamic linker, but this method is in a gray area as it is commonly used for
    both legitimate and illegitimate purposes. Therefore, it was not included in the
    list of shared object loading.


    ![](img/10a855ebad6fe689ed3447763aed6bf4_209_0.png)


    # # Illegitimate shared object loading


    Now, let''s take a look at the illegitimate ways in which a shared object can
    be loaded into a process, that is to say, by an attacker or a malware instance:


    +   * libc_dlopen_mode exists within libc.so (not libdl.so) and is not intended
    to be called by a program. It is actually marked as a GLIBC PRIVATE function.
    Most processes have libc.so, and this is therefore a function commonly used by
    attackers or malware to load arbitrary shared objects.'
  merge: -1
