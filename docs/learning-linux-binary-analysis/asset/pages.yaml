  md: "# The Linux Environment and Its Tools\n\n# GDB\n\nGNU Debugger (GDB) is not\
    \ only good to debug buggy applications. It can also be used to learn about a\
    \ program's control flow, change a program's control flow, and modify the code,\
    \ registers, and data structures. These tasks are common for a hacker who is working\
    \ to exploit a software vulnerability or unraveling the inner workings of a sophisticated\
    \ virus. GDB works on ELF binaries and Linux processes. It is an essential tool\
    \ for Linux hackers and will be used in various examples throughout this book.\n\
    \n# Objdump from GNU binutils\n\nObject dump (objdump) is a simple and clean solution\
    \ for a quick disassembly of code. It is great for disassembling simple and untainted\
    \ binaries, but will show its limitations when attempting to use it for any real\
    \ challenging engineering tasks, especially against hostile software. Its primary\
    \ weakness is that it relies on the ELF section headers and doesnt perform control\
    \ flow analysis, which are both limitations that greatly reduce its robustness.\
    \ This results in not being able to correctly disassemble the code within a binary,\
    \ or open the binary at all if there are no section headers. For many conventional\
    \ tasks, however, it should suffice, such as disassembling common binaries that\
    \ are not fortified, stripped, or obfuscated in any way. It can read all common\
    \ ELF types. Here are some examples of how to use objdump:\n\n+   View all data/code\
    \ in every section of an ELF file:\n  objdump -D <elf_object>\n\n+   View all\
    \ program code in every ELF file:\n  objdump -d <elf_object>\n\n+   View all symbols:\n\
    \  objdump -t <elf_object>\n\nWe will be exploring objdump and other tools in\
    \ depth during our introduction to the ELF format in Chapter 2, The ELF Binary\
    \ Format.\n\n# Objcopy from GNU binutils\n\nObject copy (Objcopy) is an incredibly\
    \ powerful little tool that we cannot summarize with a simple synopsis. I recommend\
    \ that you read the manual pages for a complete description. Objcopy can be used\
    \ to analyze and modify ELF objects of any kind, although some of its features\
    \ are specific to certain types of ELF objects. Objcopy is often used to modify\
    \ or copy an ELF section to or from an ELF binary.\n\n[2]"
  merge: -1
  pgno: 26
- img_proc: true
  md: 'To copy the .data section from an ELF object to a file, use this line:

    objcopy --only-section=.data <infile> <outfile>


    The objcopy tool will be demonstrated as needed throughout the rest of this book.
    Just remember that it exists and can be a very useful tool for the Linux binary
    hacker.


    # # strace


    System trace (strace) is a tool that is based on the ptrace(2) system call, and
    it utilizes the PTRACE_SYSCALL request in a loop to show information about the
    system call (also known as syscalls) in a running program as well as signals that
    are caught during execution. This program can be highly useful for debugging,
    or to collect information about what syscalls are being called during runtime.


    This is the strace command used to trace a basic program:

    strace /bin/ls -o out


    The strace command used to attach to an existing process is as follows:

    strace -p <pid> -o daemon.out


    The initial output will show you the file descriptor number of each system call
    that takes a file descriptor as an argument, such as this:

    SYS_read(3, buf, sizeof(buf));


    If you want to see all of the data that was being read into file descriptor 3,
    you can run the command:

    strace -e read=3 /bin/ls


    You may also use -e write=fd to see written data. The strace tool is a great tool,
    and you will undoubtedly find many ways to use it.


    # # ltrace


    library trace (ltrace) is another neat little tool, and it is very similar to
    strace. It works similarly, but it actually parses the shared library-linking
    information of a program and prints the library functions being used.'
  merge: -1
  pgno: 27
- img_proc: true
  md: "# Basic ltrace command\n\nYou may see system calls in addition to library function\
    \ calls with the -s flag. The ltrace command is designed to give more granular\
    \ information, since it parses the dynamic segment of the executable and prints\
    \ actual symbols/functions from shared and static libraries.\n\n```\nltrace <program>\
    \ -o program.out\n```\n\n# ftrace\n\nFunction trace (ftrace) is a tool designed\
    \ by me. It is similar to ltrace, but it also shows calls to functions within\
    \ the binary itself. There was no other tool I could find publicly available that\
    \ could do this in Linux, so I decided to code it. This tool can be found at https://github.com/elfmaster/ftrace.\
    \ A demonstration of this tool is given in the next chapter.\n\n# readelf\n\n\
    The readelf command is one of the most useful tools around dissecting ELF binaries.\
    \ It provides every bit of the data specific to ELF necessary for gathering information\
    \ about an object before reverse engineering. This tool will be used throughout\
    \ the book to gather information about symbols, segments, sections, relocation\
    \ entries, dynamic linking of data, and more. The readelf command is the Swiss\
    \ Army Binary Format, but here are a few of its most commonly used flags:\n\n\
    +   * To retrieve a section header table:\n  readelf -S <object>\n* To retrieve\
    \ a program header table:\n  readelf -l <object>\n* To retrieve a symbol table:\n\
    \  readelf -s <object>\n* To retrieve the ELF file header data:\n  readelf -e\
    \ <object>\n* To retrieve relocation entries:\n  readelf -r <object>\n* To retrieve\
    \ a dynamic segment:\n  readelf -d <object>"
  merge: -1
