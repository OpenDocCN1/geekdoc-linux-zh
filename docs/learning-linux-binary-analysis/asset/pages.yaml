    # ELF symbols


    Symbols are a symbolic reference to some type of data or code such as a global
    variable or function. For instance, the `printf()` function is going to have a
    symbol entry that points to it in the dynamic symbol table, `.dynsym`. In shared
    libraries and dynamically linked executables, there exist two symbol tables. In
    the `readelf -s` output shown previously, you can see two sections: `.dynsym`
    and `.symtab`.


    .dynsym` contains global symbols that reference functions from an external source,
    such as `printf`, whereas the symbols contained in `.symtab` will contain all
    of the symbols in `.dynsym`, as well as the local symbols of the executable, such
    as global variables, or local functions that you have defined in your code. So
    `.symtab` contains all of the symbols, whereas `.dynsym` contains just the dynamic/global
    symbols.'
