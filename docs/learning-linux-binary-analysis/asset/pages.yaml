  md: '# Function trampolines


    This type of infection certainly falls into the last category of direct PLT infection,

    but to be specific with our terminology, let me describe what a traditional function

    trampoline usually refers to, which is overwriting the first five bytes of a

    function''s code with some type of branch instruction that changes the control
    flow:


    ```

    movl $<addr>, %eax      encoded as \x8\x00\x00\xffxe0

    jmp *%eax

    push $<addr>      --- encoded as \x68\x00\x00\x00\xc3

    ret

    ```


    The parasite function is then called instead of the intended function. If the
    parasite

    function needs to call the original function, which is often the case, then it
    is the function

    of the parasite to replace first five bytes in the original function\with the
    original instructions, call it, and then copy the trampoline code back into

    place. This method can be used both by applying it in the actual binary itself
    or

    in memory. This technique is commonly used when hijacking kernel functions,

    though it is not very safe in multithreaded environments.


    # Overwriting the .dtors/.dtors function pointers


    This method was actually mentioned earlier in this chapter when discussing the

    challenges of directing the control flow of execution to the parasite code. For
    the sake

    of completeness, I will give a recap of it: Most executables are compiled by linking

    to libc, and gcc includes libc initialization code in compiled executables and

    shared libraries. The .dtors and .dtors sections (sometimes called .init_array

    and .init_array) contain function pointers to initialization or finalization code.
    The

    .dtors/.fini_init_array function pointers are triggered before main() is ever
    called. This

    means that one can transfer control to their virus or parasite code by overwriting
    one

    of the function pointers with the proper address. The .dtors/.fini_array function

    pointers are not triggered after main(), which can be desirable in some cases.
    For

    instance, can heap overflow vulnerabilities (for example, Once upon a free: http://

    phacker.org/issues/57/9.html) result in allowing the attacker to write four bytes
    to

    any location, and often will overwrite a .dtors function pointer with an address
    that

    points to shellcode. In the case of most virus or malware authors, the .dtors/.init_

    array function pointers are more commonly the target, since it is usually desirable
    to

    get the parasite code to run before the rest of the program.'
