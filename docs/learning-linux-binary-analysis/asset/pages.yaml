  md: 'ELF Virus Technology – Linux/Unix Viruses


    # # Finding legitimate space to store parasite code


    This is one of the big questions to answer when writing a virus: where will the
    payload (the body of the virus) be injected? In other words, where in the host
    binary will the parasite live? The possibilities vary from binary format to binary
    format. In the ELF format, there are quite a number places to inject code, but
    they all require correct adjustment of the different ELF header values.


    The challenge is not necessarily finding space but rather adjusting the ELF binary
    to allow you to use that space while keeping the executable file looking reasonably
    normal and staying within the ELF specifications closely enough that it still
    executes properly. There are many things that must be considered when patching
    a binary and modifying its layout, such as page alignment, offset adjustments,
    and address adjustments.


    # ## Solution


    Read the ELF specs carefully when creating new methods of binary patching, and
    make sure that you stay within the boundaries necessary for program execution.
    In the next section, we will discuss some techniques of virus infection.


    # ## Passing the execution control flow to the parasite


    Here is another common challenge, which is how to pass the control flow of the
    host executable to the parasite. In many cases, it will suffice to adjust the
    entry point in the ELF header to point the parasite code. This is reliable, but
    also very obvious. If the entry point has been modified to point at the parasite,
    then we can use `readelf -h` to see the entry point and immediately know the location
    of the parasite code.


    # ## Solution


    If you don''t want to modify the entry point address, then consider finding a
    place where you can insert/modify a branch to your parasite code, such as inserting
    a `jmp` or overwriting a function pointer. One great place for this is in the
    `.ctors` or `.init_array` sections, which contain function pointers. The `.dtors`
    or `.fini_array` sections can work as well if you don''t mind the parasite executing
    after the regular program code (instead of before).


    [ 96 ]'
