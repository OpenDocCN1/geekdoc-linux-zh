  md: '# ELF Binary Forensics in Linux


    Other signs of modified entry points are when the address points to any section
    outside of the text section, especially if it''s a section that is the last-most
    section within the same section (sometimes the .eh_frame section). Another sure
    sign is if the address points to a location within the data segment which will
    generally be marked as executable (visible with readelf -l) so that it can execute
    the parasite code.


    > > Typically, the data segment is marked as RW, because no code is supposed to
    be executing in that segment. If you see the data marked RWX then it will serve
    as a red flag, because it is extremely suspicious.


    Modifying the entry point is not the only way to create an entry point to insert
    code. It is a common way and able to detect this is an important heuristic, especially
    in malware it can reveal the start point of the parasite code. In the next section,
    we will discuss other methods used to hijack control flow, which is not always
    at the beginning of execution, but by the middle or at the end.


    # Detecting other forms of control flow hijacking


    There are many reasons to modify a binary, and depending on the desired functionality,
    the binary control flow will be patched in different ways. In the previous example
    of the Retaliation Virus, the entry point in the ELF file header was modified.
    There are many other ways to transfer execution to the inserted code, and we will
    discuss a few of the more common approaches.


    # Patching the .ctors/.init_array section


    In ELF executables and shared libraries, you will notice that there is a section
    commonly named .ctors (commonly named .init_array). This section contains an array
    of addresses that are function pointers called by the initialization code from
    the .init section. The function pointers to functions created with the constructor
    attribute, which are executed before main(). Means that the .ctors function pointer
    table can be patched with an address that points to the code that has been injected
    into the binary, which we refer to as the parasite code.'
  merge: -1
