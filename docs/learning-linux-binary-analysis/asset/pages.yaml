- img_proc: true
  md: '# Chapter 5


    ![](img/10a855ebad6fe689ed3447763aed6bf4_155_0.png)


    An over-simplified diagram showing how a layer 1 protected binary is laid out
    next to the original binary


    # # Layer 2


    A layer 2 protected binary is the same as a level 1 protected binary, except that
    not only the functions but every other section in the binary is encrypted to prevent
    static analysis. These sections are decrypted at runtime, leaving certain data
    exposed if someone is able to dump the process, which would have to be done through
    a memory driver because `prctl()` is used to protect the process from normal userland
    dumps through `/proc/$pid/mem` (and also stops the process from dumping any core
    files).


    # # Layer 3


    A layer 3 protected binary is the same as level 2, except that it adds one more
    complete layer of protection by embedding the layer 2 binary into the data segment
    of the layer 3 stub. The layer 3 stub works like a traditional userland exec.


    # # Maya''s nanomites


    Maya''s Veil has many other features that make it difficult to reverse-engineer.
    One such feature is called nanomites. This is where certain instructions in the
    original binary are completely removed and replaced with junk instructions or
    breakpoints.'
