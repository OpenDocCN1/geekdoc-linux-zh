    # # Identifying protected binaries


    Identifying a protected binary is the first step in reverse-engineering. We discussed
    the common anatomy of protected ELF executables in Chapter 5, Linux Binary Protection.
    Remember from what we learned that a protected binary is actually been merged
    together: you have the stub executable (the decryptor program) and then the target
    executable.


    One program is responsible for decrypting the other, and it is this that is going
    to be the wrapper that wraps or contains an encrypted binary within it, as a payload
    of sorts. Identifying this other program we call a stub is typically pretty easy
    because the blatant oddities you will see in the program header table.


    Let''s take a look at a 64-bit ELF binary that is protected using a protector
    I in 2009 called elfcrypt:


    ```

    $ readelf -1 test.elfcrypt

    ```


    Elf file type is EXEC (Executable file)

    Entry point 0xa01136

    There are 2 program headers, starting at offset 64


    Program Headers:


    | Type | Offset | VirtAddr | PhysAddr | Flags | Align |

    | --- | --- | --- | --- | --- | --- |

    | | | FileSize | MemSize | | |

    | LOAD | 0x0000000000000000 | 0x0000000000000000 | 0x0000000000000000 | | |

    | | | 0x0000000000002470 | 0x0000000000002470 | R E | 100 |

    | LOAD | 0x0000000000000300 | 0x0000000000000300 | 0x0000000000000300 | | |

    | | | 0x0000000000002a3f | 0x0000000000003b4df | RW | 1000 |


    So what are we seeing here? Or what are we not seeing?


    This looks like a statically compiled executable because there is no PT_DYNAMIC
    segment and there is no PT_INTERP segment. However, if we run the binary and check
    /proc/$pid/maps, we see that this is not a statically compiled binary, but is
    in fact dynamically linked.


    [ 163 ]'
