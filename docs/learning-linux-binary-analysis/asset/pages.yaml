  md: "# ELF Virus Technology - Linux/Unix Viruses\n\nThe premise behind this method\
    \ is to extend the text segment in reverse. In doing this, the virtual address\
    \ of the text will be reduced by PAGE_ALIGN(parasite_size). And since the smallest\
    \ virtual mapping allowed (as per /proc/sys/vm/map_addr) on modern Linux systems\
    \ is 0x1000, the virtual address can be extended only that far. Fortunately, the\
    \ default text virtual address on a 64-bit system is usually 0x400000, which leaves\
    \ a room for a parasite of 0x3ff000 bytes (minus another sizeof(ElFn_Ehdr)), to\
    \ be extracted.\n\nThe complete formula to calculate the maximum parasite size\
    \ for a fault host executable would be:\n\n```\nmax_parasite_length = orig_text_vaddr\
    \ - (0x1000 + \nsizeof(ElFn_Ehdr))\n```\n\nOn 32-bit systems, the default text\
    \ virtual address is 0x08048000, which leaves room for an even larger parasite\
    \ than on a 64-bit system:\n\n```\n(0x08048000 - (0x1000 + sizeof(ElFn_Ehdr))\
    \ = (parasite\nlen)134508492\n```\n\n![](img/10a855ebad6fe689ed3447763aed6bf4_126_0.png)\n\
    \nThere are several attractive features to this .text infection: not only does\
    \ it allow extremely large injections, but it also allows for the entry point\
    \ to remain pointing to the .text section. We must also modify the entry point,\
    \ it will still be pointing to the .text section rather than another section such\
    \ as .jcr or .eh_frame, which would immediately look suspicious. The insertion\
    \ spot is in the text, so it is executable (like the Silvio padding infection).\
    \ This beats data segment infections, which allow unlimited insertion space but\
    \ require altering the segment permissions on NX-bit enabled systems."
