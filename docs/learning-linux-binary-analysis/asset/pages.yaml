    | 5 | 00000000000406b0 | 2 | FUNC | GLOBAL | DEFAULT | 10 sub_4006b0 |


    The readelf command allows us to view the symbol table. Notice that a symbol table
    exists for both the dynamic symbols in .dynym and the symbols for local functions,
    which are stored in the .symtab file. ECFS is able to reconstruct the dynamic
    symbol table by accessing the dynamic segment and finding DT_SYTAB.


    > .symtab symbol table is a bit trickier but extremely valuable. ECFS uses a special
    method of parsing the PT_GNU_EH_FRAME segment that contains frame description
    entries in a dwarf format; these are used for exception handling. This information
    is useful for gathering the location and size of each single function defined
    within the binary.


