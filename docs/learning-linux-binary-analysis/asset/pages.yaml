  md: '# Linux Process Tracing


    It gives a programmer the ability to attach to a process and modify the memory,
    which can include injecting code and modifying important data structures such
    as the Global Offset Table (GOT) for shared library redirection. In this section,
    we will cover the most commonly used features of *ptrace*, demonstrate memory
    infection from the attacker''s side, and process analysis by writing a program
    to reconstruct a process image back into an executable. If you have never used
    *ptrace*, then you will see that you have been missing out on a lot of fun!


    # ptrace requests


    The *ptrace* system call has a libc wrapper like any other system call, so you
    may include *ptrace.h* and simply call *ptrace* while passing a request and a
    process ID. The following details are not a replacement for the main pages of
    ptrace(2), although some descriptions were borrowed from the main pages.


    Here''s the synopsis:


    ```

    #include <sys/ptrace.h>

    long ptrace(enum ptrace_request request, pid_t pid,

    void *addr, void *data);

    ```


    # ptrace request types


    Here is a list of requests that are most commonly used when using *trace* to interact
    with a process image:


    | Request | Description |

    | --- | --- |

    | PTRACE_ATTACH | Attach to the process specified in pid, making it a trace of
    the calling process. The trace is sent a SIGSTOP signal, but will not necessarily
    have stopped by the completion of this task. Use waitpid(2) to wait for the trace
    to stop. |

    | PTRACE_TRACEME | Indicates that this process is traced by its parent. A process
    probably shouldn''t make this request if its parent isn''t expecting to trace
    it. |

    | PTRACE_PEEKTEXT PTRACE_PEEKDATA | These requests allow the tracing process to
    read from a virtual memory address within the traced process image; for instance,
    we can read the entire text or data segment into a buffer for analysis.

    | PTRACE_PEEKUSER | Note that there is no difference in implementation between
    the PEEKTEXT, PEEKDATA, and PEEKUSER requests. |'
