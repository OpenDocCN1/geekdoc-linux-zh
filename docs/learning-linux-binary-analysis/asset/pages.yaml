  md: '# ELF parasite infection methods


    There are so many places to fit code in binary, and for any sophisticated virus,
    the parasite is going to be at least a few thousand bytes and will require enlarging
    the size of the host executable. In ELF executables, there aren''t a whole lot
    of code caves (such as in the PE format), so you are not likely to be able to
    show more than just a meager amount of shellcode into existing code slots (such
    as areas that have Os or NOP for function padding).


    # The Silvio padding infection method


    This infection method was conceived by Silvio Cesare in the ''90s and has since
    shown up in various Linux viruses, such as Bundle File and the POCs produced by
    Silvio himself. This method is inventive, but it limits the infection payload
    to one page size. On 32-bit Linux systems, this is 4096 bytes, but on 64-bit systems,
    the executables use large pages that measure 0x200000 bytes, which allows for
    about a 2MB payload. The way that this infection works is taking advantage of
    the fact that in memory, there will be one of padding between the text segment
    and data segment, whereas data segments are back to back, but someone can take
    advantage of the expected space between segments and utilize that as an area for
    the payload.


    ![](img/10a855ebad6fe689ed3447763aed6bf4_121_0.png)


    Figure 4.2: The Silvio padding infection layout


    The padding infection created by Silvio is heavily detailed and documented in
    his VX Heaven paper Unix ELF parasites and viruses (http://vxheaven.org/lib/vsc01.html),
    so for extended reading, by all means check it out.'
