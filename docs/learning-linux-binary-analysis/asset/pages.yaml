  md: '# Analysis of the core file – the Azazel rootkit


    Here, we will infect a process with the azazel rootkit using the LD_PRELOAD environment
    variable, and then deliver an abort signal to the process so that we can capture
    a core dump for analysis.


    # Starting up an Azazel infected process and getting a core dump


    ```

    $ LD_PRELOAD=./libselinux.so ./host &

    [1] 9325

    $ kill -ABRT "pidof host"

    [1]+ Segmentation fault (core dumped) LD_PRELOAD=./libselinux.so /host

    ```


    # Core file program headers


    In a core file, there are many program headers. All of them except one of the
    PT_LOAD type. There is a PT LOAD program header for every memory segment in the
    process, with the exception of special devices (that are /dev/mem). Everything
    from shared libraries and anonymous mappings to the stack, the heap, text, and
    data segments is represented by a program header.


    Then, there is one program header of the PT_NOTE type; it contains the most useful
    and descriptive information in the entire core file.


    # The PT_NOTE segment


    The eu-readelf -n output that is shows the parsing of the core file notes segment.
    The reason we use eu-readelf instead of the regular readelf is that eu-readelf
    (the ELF Utils version) takes time to parse each entry in the notes segment, whereas
    the more commonly used readelf (the binutils version) shows


    ```

    $ eu-readelf -n core

    ```


    ```

    Note segment of 4200 bytes at offset 0x900:

    Owner Data size Type

    CORE 336 PRSTATUS

    info.si_signo: 11, info.si_code: 0, info.si_errno: 0, cusig: 11

    sigpend: <>

    sighold: <>

    ```'
