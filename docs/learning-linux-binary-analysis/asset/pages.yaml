  md: "# Data segment infections\n\nSystems that do not have the NX bit, such as 32-bit\
    \ Linux systems, one can execute code in the data segment (even though its permissions\
    \ are R+W) without having to change the segment permissions. This can be a really\
    \ nice way to infect a file, because it leaves infinite room for the parasite.\
    \ One can simply append to the data segment with the parasite code. The .bss section\
    \ takes up no room on disk but is allocated space at the end of the data segment\
    \ at runtime for uninitialized variables. You may get the size of the .bss section\
    \ in memory by subtracting the data segment's phdr->_p_filesz from its phdr->_p_mems.\n\
    \n![](img/10a855ebad6fe689ed3447763aed6bf4_128_0.png)\n\n# Algorithm for data\
    \ segment infection\n\n+   1. Increase ehdr->_e_shoff by the parasite size.\n\
    2. Locate the data segment phdr:\n\n+   1. Modify ehdr->_e_entry to point where\
    \ parasite code will be:\n   phdr->_p_vaddr + phdr->_p_filesz\n2. Increase phdr->_p_filesz\
    \ by the parasite size.\n3. Increase phdr->_p_memsz\n\n+   3. Adjust the .bss\
    \ section header so that its offset and address reflect where the parasite ends.\n\
    \n+   4. Set executable permissions on data segment:\nphdr[DATA].p_flags |= PF_X;\n\
    \n> Step 4 only applies to systems with the NX (non-executable pages) bit set.\
    \ On 32-bit Linux, the data segment doesn't require to be marked executable in\
    \ order to execute code unless something like PaX (https://pax.grsecurity.net/)\
    \ is installed in the kernel."
