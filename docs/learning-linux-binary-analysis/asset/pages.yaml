  md: '# Process memory infection


    There are many rootkits, viruses, backdoors, and other tools that can be used
    to infect a system''s userland memory. We will now name and describe few of these.


    # Process infection tools


    +   - **Azasel**: This is a simple but effective LD_PRELOAD injection userland
    rootkit for Linux that is based on its predecessor rootkit named Lynx. LD_PRELOAD
    rootkits will preload a shared object into the program that you want to infect.
    Typically, such hijacked functions will show up as open, read, write, and so on.
    For more information, visit https://github.com/chokepoint/azasel.

    - **Saruman**: This is a relatively new anti-forensics infection technique that
    allows a user to inject a complete dynamically linked executable into an existing
    process. Both the injected and the injection run concurrently within the same
    address space. These also stealthy and advanced remote process infection. For
    more information, visit https://github.com/elfmaster/saruman.

    - **sshd_fucker** (phrack,so injection paper): *sshd_fucker* is the software that
    comes with the Phrack 59 paper process infection. The software infects the sshd
    process and hijacks PAM functions that usernames and passwords are passed through.
    For more information, visit http://phrack.org/issues/59/8.html


    # Process infection techniques


    What does process infection mean? For our purposes, it means describing ways of
    injecting code into process, hijacking functions, hijacking control flow, and
    anti-forensics tricks to make analysis more difficult. Many of these techniques
    were covered in *Chapter 4, ELF Virus Technology – Linux/Unix Viruses*, by which
    we will recapitulate some of these.


    # Infection methods


    +   - **ET_DYN (shared object) injection**: This is accomplished using the `ptrace()`
    system call and shellcode that either the `mmap()` or `__libc_dlopen_mode()` function
    to load the shared library file. A shared object might not be a shared object
    at all; it may be a PIE executable, as with the Saruman infection technique, which
    is a form of anti-forensics for allowing a program to run inside of an existing
    process address space. This technique is what I call process cloaking.'
  merge: -1
  pgno: 197
- img_proc: true
  md: '# Process Memory Forensics


    > LD_PRELOAD is another common trick for loading a malicious library into a process
    address space to hijack shared library functions. This can be detected by validating
    PLT/GOT. The environment variables on the stack can also be analyzed to find out
    LD_PRELOAD has been set.


    +   * ET_REL (relocatable object) injection: The idea here is to inject a relocatable
    object file into a process for advanced hot patching techniques. the ptrace system
    call (or programs that use ptrace(), such as GDB) can be used to inject shellcode
    into the process, which in turn memory-maps the object file to the memory.

    * PIC code (shellcode) injection: Injecting shellcode into process is typically
    done with ptrace. Often, shellcode is the first stage in injecting more sophisticated
    code (such as ET_DYNAMIC and ET_REL files) into the process.


    # Techniques for hijacking execution


    +   * PLT/GOT redirection: Hijacking shared library functions is most commonly
    accomplished by modifying the GOT entry for the given shared library that the
    address reflects the code injected by the attacker. This is essentially the same
    thing as overwriting a function pointer. We will discuss methods of detecting
    this later in this chapter.

    * Inline function hooking: This method, also called function trampoline, is common
    on both disk and memory. An attacker can replace the first 5 to 7 bytes of code
    in a function with a jump instruction that transfers control to a malicious function.
    This can be detected by scanning the initial code in every function.

    * Patching .ctors and .dtors: The .ctors and .dtors sections in a binary (which
    can be located in the memory) contain an array of function pointers for initialization
    and finalization functions. These can be patched by an attacker on disk and in
    memory so they point to parasite code.

    * Hijacking VDSO for syscall interception: The VDSO page that is mapped to the
    process address space contains code for invoking system calls. An attacker can
    use ptrace (PTRACE_SCALL, ...) to locate this code and replace the register with
    the system call number that they want to invoke. This allows a clever attacker
    to invoke any system call that they want to in a process without having to inject
    shellcode. Check out this paper 1 wrote in 2009; it describes the technique in
    detail at http://vxheaven.org/lib/vrn00.html.


    — 174 —'
