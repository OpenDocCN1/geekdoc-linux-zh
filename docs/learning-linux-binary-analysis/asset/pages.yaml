  md: '# Chapter 6


    A very general algorithm can be used to work on simple protectors, especially
    if they do not incorporate any anti-debugging techniques.


    +   1. Determine the approximate number of instructions in the stub''s test represented
    by N.

    2. Trace the program for N instructions.

    3. Dump the memory from the expected location of the test segment (for example,
    0x400000) and locate its data segment using the program headers from the newly
    found test segment.


    A good example of this simple technique can be demonstrated with Quenya, the 32-bit
    ELF manipulation software that I coded in 2008.


    ![](img/10a855ebad6fe689ed3447763aed6bf4_189_0.png)


    The following are the program headers of a packed executable:


