  md: '# Linux Process Tracing


    In Linux, the default ptrace() behavior is such that it allows you to write Using
    PTRACE_POKETEXT to segments that are not writable, such as the text segment. This
    is because that debuggers will need to insert breakpoints into the code. This
    works out great for hackers who want to insert code into memory and execute. To
    demonstrate this, we have written code_inject.c. This attaches to a process and
    injects a shellcode into an anonymous memory mapping enough to hold our payload
    executable, payload.c, which is injected into the new memory and executed.


    > As mentioned earlier in this chapter, Linux kernels that are patched with Pax
    will not allow ptrace() to write to segments that are not writable. This is for
    further enforcement of memory protection restrictions. In the ELF runtime injection
    by GOT poisoning, I have discussed methods of bypassing these restrictions by
    manipulating the vscall table with ptrace.


    Now, let''s look at a example where we inject a shellcode into a running process
    that loads a foreign executable:


