  md: '# # 3 Linux Process Tracing


    In the last chapter, we covered the internals of the ELF format and explained
    its internal workings. In Linux and other Unix-flavored OSes that use ELF, the
    ptrace system call goes hand in glove with analyzing, debugging, reverse engineering,
    and modifying programs that use the ELF format. The ptrace call is used to attach
    to a process and access the entire range of code, data, stack, heap, and registers.


    Since an ELF is completely mapped in a process address space, you can attach to
    the process and parse or modify the ELF image very similarly to how you would
    do with the actual ELF file instead of using the open/mmap/read/write calls that
    would be used for the ELF file.


    With ptrace, we can have full control over a program''s execution flow, which
    means we can do some very interesting things, ranging from memory virus infection
    and virus analysis/detection to user memory rootkits, advanced debugging tasks,
    hotpatching, and reverse engineering. Since we have each chapters in this book
    dedicated to some of these tasks, we will not cover each of these in depth just
    yet. Instead, I will provide a primer for you to learn about the basic functionality
    of ptrace and how it is used by hackers.


    # ## The importance of ptrace


    In Linux, the ptrace(2) system call is the userland means of accessing a process
    address space. This means that someone can attach to a process that they own and
    modify, analyze, reverse, and debug it. Well-known debugging and analysis applications
    such as gdb, trace, and ltrace use ptrace assisted applications. The ptrace command
    is very useful for both reverse engineers and malware authors.'
  merge: -1
