- img_proc: true
  md: '# Chapter 6


    It is relatively easy to check or not one of the addresses in the .ctors section
    is valid. The constructor routines should always be stored specifically within
    the .text section of the text segment. Remember from Chapter 2, The ELF Binary
    Format, that the .text section is not the text segment, but a section that exists
    within the range of the text segment. If the .ctors section contains any function
    pointers that refer to locations outside of the .text section, then it is probably
    time to get suspicious.


    # A note on .ctors for anti-anti-debugging


    Some binaries incorporate anti-debugging techniques will actually create a legal
    constructor function that calls ptrace(PTRACE_TRACEME, 0);

    As discussed in Chapter 4, ELF Virus Technology - Linux/Unix Viruses, this technique
    prevents a debugger from attaching to the process unless one tracer can be attached
    at any given time. If you discover that a binary has a function that performs
    this anti-debugging trick and has a function pointer in it, then it is to simply
    patch that function pointer with 0x00000000 or 0xffffffff that will direct the
    .libc_start_main() function to effectively disable the debugging technique. This
    task could be easily accomplished in GDB with the set command, set {long}address
    = 0xffffffff, assuming that address is the location of the .ctors entry you want
    to modify.


    # Detecting PLT/GOT hogs


    This technique has been used as far back as 1998 when it was published by Silvio
    Cesare in http://phrack.org/issues/56/7.html, which discusses the techniques of
    shared library redirection.


    In Chapter 2, The ELF Binary Format, we carefully examined dynamic linking and
    explained the inner workings of the PLT (procedure linkage table) and GOT (global
    offset table). Specifically, we looked at lazy linking and how the PLT contains
    structs that transfer control to addresses that are stored in the GOT. If a shared
    library function calls printf that has never been called, then the address stored
    in the GOT will point to the PLT, which invokes the dynamic linker, subsequently
    filling in the GOT with the address that points to the printf function from the
    shared library that is mapped to the process space.


    It is common for both static (at rest) and hot-patching (in memory) to modify
    one or more GOT entries so that a patched function is instead of the original.
    We will examine a binary that has been injected with an object file that contains
    a function that simply writes to stdout. The GOT entry for puts(char *) has been
    patched with an address that points to the injected function.


    [ 147 ]'
