    Section 23 is of particular interest to us; it has been marked as a suspicious
    ELF object with the injected notation:


    ```

    [23] .elf.dyn.0 INJECTED 0007fba37f1b0000 00380000

    00000000000001000 0000000000000000 AX 0 8

    ```


    When the ECFS heuristics detects an ELF object as suspicious and it can''t find
    its particular object in its list of mapped shared libraries, it names the section
    in the following format:


    .elf.<type>.count


    The type can be one of four:


    +   * ET_NONE

    * ET_EXEC

    * ET_DYN

    * ET_REL


    In our example, it is obviously ET_DYN, represented as dyn. The count is simply
    the index of injected objects that have been found. In this case, the index is
    0 as it is the first and only injected ELF object that was found in this particular
    process.


    The type INJECTED obviously denotes that the section contains an ELF object that
    was determined suspicious or injected through unnatural means. In this particular
    case, the process was infected with Saruman (described earlier), which injects
    a Position-Independent Executable (PIE). A PIE executable is of type ET_DYN, similar
    to shared libraries, which is why ECFS has marked it as such.'
