  md: '# Linux /proc/kcore Analysis


    # FreeBSD – /dev/kmmem


    On some OSes as FreeBSD, the /dev/kmmem device is still available and is writable
    by default. There is even an API specifically designed for accessing it, and there''s
    a book Writing BSD rootkits that demonstrates its abilities.


    # K-ecfs – kernel ECFS


    In the previous chapter, we discussed the ECFS (for Extended Core File Snapshot)
    technology. It is worth mentioning near the end of this chapter that I have worked
    out some code for kernel-ecfs, which merges vmlinux and /proc/kcore into a kernel-ecfs
    file. The result is essentially a file similar to /proc/kcore, but one that also
    has section headers and symbols. In this way, an analyst can easily access any
    part of the kernel and memory (such as the "vmallocd" memory). This code will
    eventually become publicly available.


