    # # The .text section


    . .text section is a code section that contains program code instructions. In
    an executable program where there are also Phdr, this section would be within
    the range of the text segment. Because it contains program code, it is of section
    type SHT_PROGBITS.


    # # The .rodata section


    The rodata section contains read-only data such as strings from a line of C code,
    as with the following command are stored in this section:


    ```

    printf("Hello World!\");"

    ```


    This section is read-only and therefore must exist in a read-only segment of an
    executable. You will find .rodata within the range of the text segment (not the
    data segment). Because this section is read-only, it is of type SHT_PROGBITS.


    # # The .plt section


    The procedure linkage table (PLT) will be discussed in depth later in this chapter,
    but it contains code necessary for the dynamic linker to call functions that are
    imported from shared libraries. It resides in the text segment and contains code,
    so it is marked as type SHT_PROGBITS.


    # # The .data section


    The data section, not to be confused with the data segment, will exist within
    the data segment and contain data such as initialized global variables. It contains
    program variable data, so it is marked SHT_PROGBITS.'
