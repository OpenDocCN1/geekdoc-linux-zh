  md: '# Process memory viruses and rootkits – remote code injection techniques


    Up until now, we''ve covered the fundamentals of infecting ELF binaries with parasite
    code, which is enough to keep you busy for least several months of coding and
    experimentation. This chapter would not be complete, though, without a thorough
    discussion of infecting process memory. As we''ve learned, a program in memory
    is not much different than on disk, and we can access and manipulate a running
    program with the ptrace system call, as shown in Chapter 3, Linux Process Tracing.
    Process infections are a lot more stealthy than binary infections, since they
    don''t modify anything on disk. All of the ELF infection points that we discussed
    are relevant to process infection, although injecting actual parasite code is
    done differently than it is with an ELF binary. Since it is in memory, we must
    get the parasite code into memory, which can be done by injecting it directly
    with PTRACE_POKETEXT (overwriting existing code) or, more preferably, by injecting
    shellcode that creates a new memory mapping to store the code. This is where things
    such as shared library injection comes into play. Throughout the rest of this
    chapter, we will discuss some methods for remote injection (injecting code into
    another process).


    # Shared library injection – .so injection/ET_DYN injection


    This technique can be used to inject a shared library (whether malicious or not)
    into an existing process'' address space. Once the library is injected, you may
    use one of the infection points described earlier to redirect control flow to
    the shared library through PLT/GOT redirection, function tunnels, and so on. The
    challenge is getting the shared library into the process, and this can be done
    in a number of ways.


    # .so injection with LD_PRELOAD


    It is debatable whether we can call this method for injecting a shared library
    into a process, since it does not work on existing processes but rather the shared
    library is loaded upon execution of the program. This works by setting the LD_PRELOAD
    environment variable so that the desired shared library is loaded with precedence
    before any others. This can be a good way to test subsequent techniques such as
    PLT/GOT redirection, which is not stealthy and does not work on existing processes.'
