  md: '# PT_NOTE


    A segment of type PT_NOTE may contain auxiliary information that is pertinent
    to a specific vendor or system. Following is a definition of PT_NOTE from the
    formal ELF specification:


    Sometimes a vendor or system builder needs to mark an object file with special
    information that other programs will check for conformance, compatibility, and
    so on. Sections of type NOTE and program header elements of type PT_NOTE can be
    used for this purpose. The information in sections and program header elements
    holds any number of entries, each of which is an array of 4-byte words in the
    format of the target processor. Labels appear below to help explain note organization,
    but they are not part of the specification.


    A point of interest: because of the fact that this segment is only used for OS
    specification, and is not actually necessary for an executable to run (since the
    system will just assume the executable is native either way), this segment becomes
    an interesting place for virus infection, although not necessarily the most practical
    way to go due to size constraints. Some information on NOTE segments can be found
    at http://vxheavens.com/lib/vhe06.html.


    # PT_INTERP


    This small segment contains only the location and size to a null terminated string
    describing where the program interpreter is; for instance, /lib/linux-ld.so.2
    is generally the location of the dynamic linker, which is also the program interpreter.


    # PT_PHDR


    This segment contains the location and size of the program header table itself.
    The Phdr table contains all of the Phdrs describing the segments of the file (and
    in the memory image).


    Consult the ELF(5) man pages or the ELF specification to see all possible Phdr
    types. We have covered the most commonly seen ones that are vital to program execution
    or that we will be seeing most commonly in our reverse engineering endeavors.


    We can use the readelf -1 <filename> command to view a file''s Phdr table:


    ```

    Elf file type is Exec (Executable file)

    Entry point 0x8049a30

    There are 9 program headers, starting at offset 52

    ```'
