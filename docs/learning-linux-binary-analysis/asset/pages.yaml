  md: '# Preface


    Software engineering is the act of creating an invention that exists, lives, and
    breathes on a microprocessor. We call it a program. Reverse engineering is the
    act of discovering exactly how that program lives and breathes, and furthermore
    it is how we can understand, dissect, or modify the behavior of that program using
    a combination of disassemblers and reversing tools and relying on our hacker instincts
    to master the target program which we are reverse-engineering. We must understand
    the intricacies of binary format, memory layout, and the instruction set of the
    processor. We therefore become masters of the very life given to a program. This
    book is going to give you the proper lessons, insight, and tasks required to become
    a Linux binary hacker. When someone can call themselves a reverse engineer, they
    elevate themselves beyond the level of just engineering. A true hacker can not
    only write code but also dissect, disassembling the binaries and memory segments
    in pursuit of modifying the inner workings of a software program; now that power...


    On both professional and a hobbyist level, I use my reverse engineering skills
    in the computer security field, whether it is vulnerability analysis, malware
    analysis, antivirus software, rootkit detection, or virus design. This book will
    be focused towards security. We will analyze memory dumps, process images, and
    explore some of the more esoteric regions of binary analysis, including Linux
    infection and binary forensics. We will dissect malware-infected executables and
    infect running processes. This book is aimed at explaining the necessary components
    for reverse engineering in Linux, so we will be going deep into learning ELF (executable
    and linking format), which is the binary format used for executables, shared libraries,
    core dumps, and object files. One of the most significant aspects of this book
    is the deep insight it gives into the structural complexities of the ELF binary
    format. The ELF sections, segments, and dynamic linking concepts are vital and
    exciting chunks of knowledge. We will explore the depths of hacking ELF binaries
    and see how these skills can be applied to a broad spectrum of work.


    [ ix ]'
  merge: -1
  pgno: 19
- img_proc: true
  md: '# Preface


    The goal of this book is to teach you to be one of the few people with a strong
    foundation in Linux binary hacking, which will be revealed as a vast topic that
    opens the door to innovative research and puts you on the cutting edge of low-level
    hacking in the Linux operating system. You will walk away with valuable knowledge
    of Linux binary (and memory) patching, virus engineering/analysis, kernel forensics,
    and the ELF binary format as a whole. You will also gain insights into process
    execution and dynamic linking and achieve a higher understanding of binary protection
    and debugging internals.


    I am a security researcher, software engineer, and hacker. This book is merely
    an observation and documentation of the research I have done and the foundational
    knowledge that has manifested as a result.


    This knowledge covers a wide span of information that can''t be found in any one
    place on the Internet. This book tries to bring many interrelated topics together
    into one piece so that it may serve as an introductory manual and reference to
    the subject of Linux binary and memory hacking. It is by no means a complete reference
    but does contain a lot of information to get started.


    # What this book covers


    Chapter 1, The Linux Environment and Its Tools, gives a brief description of the
    Linux environment and its tools, which we will be using throughout the book.


    Chapter 2, The ELF Binary Format, helps you learn about every major component
    of the ELF binary format that is used across Linux and most Unix-flavored operating
    systems.


    Chapter 3, Linux Process Tracing, teaches you to use the ptrace system call to
    read and write to memory and inject code.


    Chapter 4, ELF Virus Technology – Linux/Unix Viruses, is where you discover the
    past, present, and future of Linux viruses, how they are engineered, and all of
    the amazing research that surrounds them.


    Chapter 5, Linux Binary Protection, explains the basics of ELF binary protection.


    Chapter 6, ELF Binary Forensics in Linux, is where you learn to dissect ELF objects
    in search of viruses, backdoors, and suspicious code injection.


    Chapter 7, Process Memory Forensics, shows you how to dissect a process address
    in search of malware, backdoors, and suspicious code injection that live in the
    memory.'
  merge: -1
  pgno: 20
- img_proc: true
  md: "Chapter 8, ECFS – Extended Core Snapshot Technology, is an introduction to\
    \ ECFS,\na new open source product for deep process memory forensics.\n\nChapter\
    \ 9, Linux, /proc/kcore Analysis, shows how to detect Linux kernel malware\nthrough\
    \ memory analysis with /proc/kcore.\n\n# What you need for this book\n\nThe prerequisites\
    \ for this book are as follows: we will assume that you have a\nworking knowledge\
    \ of the Linux command line, comprehensive C programming\nskills, and a very basic\
    \ grasp on the x86 assembly language (this is helpful but not\nnecessary). This\
    \ is a saying, \"If you can read assembly language then everything\nis open source.\"\
    \n\n# Who this book is for\n\nIf you are a software engineer or reverse engineer\
    \ and want to learn more about\nLinux binary analysis, this book will provide\
