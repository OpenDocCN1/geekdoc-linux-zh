- img_proc: true
  md: '# Direct sys_call_table modifications


    Traditional kernel rootkits, such as adore and phalanx, worked by overwriting
    pointers in sys_call_table so that they would point to a replacement function,
    which would call the original syscall as needed. This was accomplished by either
    an LKM or a program that modified the kernel through /dev/kmem or /dev/mem. Today''s
    Linux systems, for security reasons, these windows into memory are disabled or
    are no longer capable of read operations depending on how the kernel is configured.
    There are other ways of trying to prevent this type of infection, such as marking
    sys_call_table as const so that it is stored in the .rodata section of the next
    segment. This can be bypassed by marking the corresponding PTE (Page Table Entry)
    as writable, or by disabling the write-protect bit in the cro register. Therefore,
    this type of infection is a very reliable way to make a rootkit even today, but
    it is also very detected.


    # Detecting sys_call_table modifications


    To detect sys_call_table modifications, you may look at the System.map file or
    /proc/kallsyms to see what the address of each syscall should be. For instance,
    if we want to detect whether or not the sys_write system call has been infected,
    we need to learn the legitimate address of sys_write and its index within the
    sys_call_table, and validate that the correct address is actually stored in memory
    using GDB and /proc/kcore.


    # An example of validating the integrity of a syscall


    ```

    $ sudo grep sys_write /proc/kallsyms

    ffffffff811d5310 sys_write

    $ grep /usr/include/x86_64-linux-gnu/asm/unistdd64.h

    #define NR_write nr_write 1

    $ sudo gdb -q vmlinux /proc/kcore

    (gdb) x/8 &sys_call_table+4

    0xffffffff81801464 <sys_call_table+4>: 0x811d5310ffffffff

    ```


    Remember that numbers are stored in little endian on x86 architecture. The value
    sys_call_table[1] is equivalent to the correct sys_write address as looked up
    in /proc/kallsyms. We have therefore successfully verified that the sys_call_table
    entry for sys_write has not been tampered with.'
