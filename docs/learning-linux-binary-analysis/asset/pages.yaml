    | 0 | 0000000000040470 | 96 | FUNC | GLOBAL | DEFAULT | 10 sub_400470 |

    | 1 | 00000000000404d0 | 42 | FUNC | GLOBAL | DEFAULT | 10 sub_4004d0 |

    | 2 | 000000000004005bd | 50 | FUNC | GLOBAL | DEFAULT | 10 sub_4005bd |

