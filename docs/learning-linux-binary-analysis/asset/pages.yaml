  md: "# Linux Binary Protection\n\nWhen Maya's runtime engine sees one of these junk\
    \ instructions or breakpoints, it checks its nanomite records to see what the\
    \ original instruction was that existed there. The records are stored in the encrypted\
    \ heap segment of the runtime engine, so accessing this information is non-trivial\
    \ for a reverse engineer. Once Maya knows what the original instruction did, it\
    \ emulates the instruction using the `ptrace` system call.\n\n# Maya's anti-exploitation\n\
    \nThe anti-exploitation features of Maya are what make it unique compared to other\
    \ protectors. Whereas most protectors aim to make reverse engineering difficult,\
    \ Maya is able to strengthen a binary so that many of its inherent vulnerabilities\
    \ (such as a buffer overflow) cannot be exploited. Specifically, Maya prevents\
    \ **ROP (Return-Oriented Programming)** by instrumenting the binary with special\
    \ control flow integrity that is embedded in the runtime engine.\n\nEvery function\
    \ in a protected binary is instrumented with a breakpoint at the entry point and\
    \ every return instruction. The `int3` breakpoint delivers a SIGTRAP that triggers\
    \ the runtime engine; the runtime engine then does one of several:\n\n+   - Decrypting\
    \ the function (only if it hits the `int3` breakpoint)\n- Encrypting the function\
    \ (only if it hits the return `int3` breakpoint)\n- Checking whether the return\
    \ address has been overwritten\n- Checking whether the `int3` breakpoint is a\
    \ nanomite; if so, it will emulate\n\nThe third bullet is the anti-ROP feature.\
    \ The runtime engine checks a hash map that contains valid return addresses for\
    \ various points within the program. If the return address is invalid, Maya will\
    \ bail out and the exploitation attempt will fail.\n\nThe following is an example\
