  md: '# # 9 Linux /proc/kcore Analysis


    So far, we have covered Linux binaries and memory as it pertains to userland.
    This book won''t be complete, however, if we don''t spend a chapter on the Linux
    kernel. This is because it is actually an ELF binary as well. Similar to how a
    program is loaded into memory, the Linux kernel image, also known as vmlinux,
    is loaded into memory at boot time. It has a text segment and a data segment,
    overlaid with many section headers that are very specific to the kernel, and which
    you won''t see in userland executables. We will also briefly cover LKMs in this
    chapter, as they are ELF files too.


    # ## Linux kernel forensics and rootkits


    It is important to learn the layout of the Linux kernel image if you want to be
    a true master of kernel forensics in Linux. Attackers can modify the kernel memory
    to create very sophisticated kernel rootkits. There are quite a number of techniques
    for infecting a kernel at runtime. To list a few, we have the following:


    +   - sys_call_table infection

    - Interrupt handler patching

    - Function trampolines

    - Debug register rootkits

    - Exception table infection

    - Kprobe instrumentation'
