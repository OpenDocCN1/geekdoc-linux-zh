  md: '# ECFS – Extended Core File Snapshot Technology


    Parsing section headers is very easy, and therefore they are very useful for creating
    a map of the process memory image. Navigating the entire process through section
    headers is lot easier than having only program headers (such as with regular code
    files), which don''t even have string names. The program headers are what describe
    the segments of memory, and the section headers give what context of a given segment.
    Section headers help give a much higher resolution to the reverse engineer.


    | Section header | Description |

    | --- | --- |

    | .TEXT | This points to the text segment (not the .text section). This makes
    locating the text segment possible without having to parse the program headers
    |

    | .DATA | This points to the data segment (not the .data section). This makes
    locating the data segment possible without having to parse the program headers
    |

    | .stack | This points to one of several possible stack segments depending on
    the number of threads. Without a section named .stack, it would be far more difficult
    to know where the actual stack of the process is. You would have to look at the
    value of the rsp register and then see which program header segments contain address
    ranges that match the stack pointer value |

    | .heap | Similar to the .stack section, this points to the heap segment, also
    making identification of the heap easier, especially on systems where ASLR moves
    the heap to random locations. On older systems, it was always extended from the
    data segment. |

    | .bss | This section is not new with ECFS. The only reason it is mentioned here
    is that with an executable or shared library, the .bss section contains nothing,
    using uninitialized data that has no space on disk. ECFS represents the memory,
    however, and the .bss section is not actually created until runtime. The ECFS
    files have a .bss section that accurately reflects the uninitialized variables
    used by the process |

    | .vdso | This points to the .vdso segment that is mapped into every Linux process
    containing code that is necessary for certain glibc system calls invokes into
    the real system call |

    | .vsyscall | Similar to the .vdso code, the .vsyscall page contains code for
    invoking only a handful of virtual system calls. It has been kept around for backwards
    compatibility. It may prove useful to know this location during reverse engineering
    |


    [ 218 ]'
