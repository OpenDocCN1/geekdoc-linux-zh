  md: '# Chapter 9


    Actually, it is named after an old tool by Michael Zalewski, called dress. That
    tool would dress a static executable with a symbol table. This name originates
    from the fact that people run a program called strip to remove symbols from an
    executable, and therefore ''dress'' is an appropriate name for a tool that rebuilds
    the symbol table. Our tool, dress, simply takes information about symbols from
    either the System.map file or /proc/kallsyms on whichever is readily available.
    Then, it reconstructs that information into the kernel executable by creating
    a section header for the symbol table. This tool can be found on my GitHub profile
    at https://github.com/elfmaster/kdress


