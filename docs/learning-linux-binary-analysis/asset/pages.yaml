  md: '# The ELF Binary Format


    So, jump *0x804a000 jumps to the contained address there within 0x8048366, which
    is the push $0x0. That instruction has a purpose, which is to push the GOT entry
    for fgets() onto the stack. The GOT offset for fgets() is 0x0, which corresponds
    to the first GOT entry that is reserved for a shared library symbol value, which
    is actually the fourth GOT entry, GOT[3]. In other words, the shared library addresses
    do not get plugged starting at GOT[0] and they begin at GOT[3] (the fourth entry)
    because the first three are reserved for other purposes.


    +   Note of the following GOT offsets:

    * GOT[0] contains an address that points to the dynamic segment of the executable,
    which is used by the dynamic linker for extracting dynamic linking-related information

    * GOT[1] contains the address of the *link_map* structure that is used by the
    dynamic linker to resolve symbols

    * GOT[2] contains the address to the dynamic linkers *dl_runtime_resolve()* *dl_runtime_resolve()*
    function that resolves the actual address for the shared library function


    ![](img/10a855ebad6fe689ed3447763aed6bf4_68_0.png)


    The last instruction in the fgets() PLT stub is a jump *048350. This address points
    to the very first PLT entry in every executable, known as PLT-0.


    PLT-0 from our executables contains the following code:


    ```

    8048350:               ff 35 f8 9f 04 08      pushl 0x8049ff8

    8048356:               ff 25 c6 9f 04 08      jmp *0x8049ffc

    804835c:               00 00                  add %al, (%eax)

    ```


    The first push instruction pushes the address of the second GOT entry, GOT[1],
    onto the stack, as noted earlier, contains the address of the *link_map* structure.


    The jump *0x8049ffc performs an indirect jump to the third GOT entry, GOT[2],
    which contains the address to the dynamic linkers *dl_runtime_resolve()* function,
    therefore transferring control to the dynamic linker and resolving the address
    for fgets(). Once fgets() has been resolved, all future calls to the PLT entry
    forfgets() will result in a jump to the fgets() code itself, rather than pointing
    back into the PLT and going through the lazy linking process.'
