    # ELF dynamic linking


    In the old days, everything was statically linked. If a program used external
    library functions, the entire library was compiled directly into the executable.
    ELF supports dynamic linking, which is a much more efficient way to go about handling
    libraries.


    When a program is loaded into memory, the dynamic linker also loads and binds
    the shared libraries that are needed to process address space. The topic of dynamic
    linking is rarely understood by people in this section, it is a relatively complex
    procedure and seem to work magic under the hood. We will demystify its complexities
    and reveal how it works and also how it can be abused by attackers.


    Shared libraries are compiled as position-independent and can therefore be easily
    relocated into a process address space. A shared library is a dynamic ELF object.
    If you look at `readelf -h lib.so`, you will see that the `e_type` (ELF file type)
    is called ET_DYN. Dynamic objects are very similar to executables. They do not
    typically have a PT_INTERP segment since they are loaded by the program interpreter,
    and therefore will not be invoking a program interpreter.


    When a shared library is loaded into a process address space, it must have any
    relocations satisfied that reference other libraries. The dynamic linker must
    modify the GOT (Global offset table) of the executable (located in the section
    .got.plt), which is a table of addresses located initially in the data segment.
    It is in the data segment because it be writable (at least read-only relocations
    as a security feature). The dynamic linker patches the GOT with resolved shared
    library addresses. We will explain the process of lazy linking shortly.'
