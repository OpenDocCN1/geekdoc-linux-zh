  md: "# Linux Process Tracing\n\nThe term tracer refers to the process that is doing\
    \ the tracing (the one that is invoking ptrace), and the term trace or the traced\
    \ means the program that is being traced by the tracer (with ptrace).\n\n> The\
    \ default behavior overrides mmap or mprotect protections. This means a user can\
    \ write to the text segment with ptrace (even though it is read-only). This is\
    \ not true if the kernel is par or grsec and patched with mprotect restrictions,\
    \ which enforce segment permissions so that they may ptrace as well; this is a\
    \ security feature.\nMy paper on ELF runtime infection at http://vxheavens.com/lib/vrn00.html\
    \ discusses some methods to bypass these restrictions for code injection.\n\n\
