- img_proc: true
  md: '# Linux Binary Protection


    Since the code is compressed, it must have a way to decompress itself before executing
    in memory — this is where things get interesting, and we will discuss how this
    works in the Stub mechanics and the userland exec section. At any rate, malware
    authors have realized that compressing their malware-infected files would evade
    AV detection due to obfuscation. This led malware/antivirus researchers to develop
    automated packers, which are now used in most, if not all, modern AV products.


    Nowadays, the term "packed binary" refers not only to compressed binaries but
    also to encrypted binaries or binaries that are shielded with an obfuscation layer
    of any kind. Since the early 2000s, there have been several remarkable ELF binary
    protectors that have shaped the future of binary protection in Linux. We will
    explore each one of these and use them to model the different techniques used
    to protect ELF binaries. Beforehand, however, let''s look at how stubs work to
    load and execute a compressed binary.


    # Stub mechanics and the userland exec


    First, it is necessary to understand that a software protector is actually made
    up of two programs:


    +   - Protection phase code: The program that applies the protection to the target
    binary

    - Runtime engine or stub: The program that is merged with the target binary that
    is responsible for deobfuscation and anti-debugging at runtime


    The protector can vary greatly depending on the types of protection that are being
    applied to the target binary. Whatever type of protection is being applied to
    the target binary must be understood by the runtime code. The runtime code (or
    stub) must know how to decrypt or deobfuscate the binary that it is merged with.
    In most cases of software protection, there is a relatively simple runtime engine
    merged with the protected binary; its sole purpose is to decrypt the binary and
    pass control to the decrypted binary in memory.


    This type of runtime engine is not so much an engine — really — and we call it
    a stub. The stub is generally compiled without any linkages (for example, `gcc
    -nostd.lib`), or is statically compiled. This type of stub, although simpler than
    a true runtime engine, is actually still complicated because it must be able to
    `exec()` a program from memory — this is where userland exec comes into place.
    We can thank the guggq for his contributions here.'
