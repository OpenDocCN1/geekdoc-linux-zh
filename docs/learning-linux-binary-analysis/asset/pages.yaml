  md: '# Process Memory Forensics


    In some cases, as binaries have PaX mprotect restrictions enabled (https://pax.grsecurity.net/docs/mprotect.txt),
    the ptrace system call cannot be used to inject shellcode into the text segment.
    This is because it is readonly, and the restrictions will also prevent the text
    segment writable, so you cannot get around this. However, this can be circumvented
    in several ways, such as setting the instruction pointer to __libc_dlopen_mode
    and storing the arguments in the registers (such as %rdi, %rsi, and so on). Alternatively,
    in the case of 32-bit architecture, the arguments can be stored on the stack.


    Another way is by manipulating the VDSO code that is present in all processes.


    # Manipulating VDSO to perform dirty work


    This technique is one that is demonstrated at http://vxheaven.org/lib/vrn00.html,
    the general idea is simple. The VDSO code is mapped to the process address space,
    as seen in the /proc/pid/maps output earlier in this chapter, contains code that
    invokes system calls via the syscall (for 64-bit) and sysenter (for 32-bit instructions).
    The calling convention for system calls in Linux always places the system call
    in the %eax/%rax register.


    If an attacker uses ptrace(TRACE_SYSCALL, ...), they can quickly locate the syscall
    instruction in the VDSO code and replace the register values to invoke whichever
    system call is desired. If this is done carefully and while restoring the original
    system call that was executing, then it will not cause the application to crash.
    The open and mmap system calls can be used to load an executable object such as
    ET_DYN or ET_REL into the process address space. Alternatively, they can be used
    to simply create an anonymous memory mapping that can storecode.


    This is a code example in which the attacker takes advantage of this code on a
    32-bit system:


    ```

    ffff420 <__kernel_syscall>

    ffff420:      51              push %ecx

    ffff421:      52              push %edx

    ffff422:      55              push %ebp

    ffff423:      89 e5            mov %esp,%ebp

    ffff425:      0f 34            sysenter

    ```


    > On a 64-bit system, the VDSO contains at least two locations where the syscall
    instruction is used. The attacker can manipulate these of these.'
