- img_proc: true
  md: '# Attacks based on ptrace


    The first variety, ptrace based attacks, also falls under the category of debugging
    a process. As already discussed, a binary protector wants to make ptrace based
    debugging very difficult for a reverse engineer. Aside from debugging, however,
    there are many other attacks that could potentially break a protected binary,
    and it is important to know and understand what of these are in order to give
    further clarification as to why a binary protector wants to protect a running
    process from ptrace.


    If a protector has gone so far that it is able to detect breakpoint instructions
    (and therefore make debugging more difficult) but is not able to protect itself
    from being traced by ptrace, then it is possible that it is still vulnerable to
    ptrace based attacks, such as function hijacking and shared library injection.
    An attacker may not want to simply unpack a protected binary, but may only change
    the binary''s behavior. A good binary protector should try to protect the integrity
    of its control flow.


    Imagine that an attacker is aware that a protected binary is calling the dlopen()
    function to load a shared library, and the attacker wants to load a trojaned shared
    library instead. The following steps could lead to an attacker compromising a
    protected binary by changing its control flow:


    +   1. Attaching to the process with ptrace.

    2. Modifying the Global Offset Table entry for dlopen() to point to __libc_dlopen_mode
    (in libc.so).

    3. Adjusting the rdi register so that it points to this path: /tmp/evil_lib.so.

    4. Continuing execution.


    At this point, the attacker has just forced a protected binary to load a malicious
    shared library and therefore completely compromised the security of the protected
    binary.


    The Maya protector, as discussed earlier, is armed against such vulnerabilities
    thanks to a runtime engine that works as an active debugger, preventing any other
    process from attaching. If a protector can disable ptrace from attaching to the
    protected process, then that process is at much less risk of this type of runtime
    attack.'
  merge: -1
  pgno: 162
- img_proc: true
  md: '# Security vulnerability-based attacks


    A vulnerability-based attack is a type of attack in which an attacker may be able
    to exploit an inherent weakness in the protected program, such as a stack-based
    buffer overflow, and subsequently change the execution flow to something of their
    choice.


    This type of attack is often more difficult to carry out on a protected program,
    since it yields much less information about itself, and using a debugger to narrow
    down the locations used in the memory by the protector is potentially more difficult
    to gain insight into. Nevertheless, this type of attack is very possible, and
    this is why the Maya protector enforces control flow integrity and read-only relocations
    to protect specifically against vulnerability exploitation attacks.


    I am not aware whether other protectors out there right now are using similar
    anti-exploitation techniques, but I can only surmise that they are out there.


    # Other resources


    Writing only one chapter on binary protection is not nearly comprehensive enough
    on its own to teach you all about this subject. The other chapters in this book
    complement each other, however; when combined together, they will help you to
    deeper levels of understanding. There are many good resources on this subject,
    some of which have already been mentioned.


    One resource in particular, written by Andrew Griffith, is highly recommended
    for reading. This paper describes many of the techniques and practices that are
    still very pertinent to the binary protectors of today:


    ```

    http://www.bitlkeys.org/resources/binary_protection_schemes.pdf

    ```


    This paper was followed by a talk given at a later date, and the slides can be
    found here:


    ```

    http://2005.recon.cx/recon2005/papers/Andrew_Griffiths/protecting_binaries.pdf

    ```


    # Summary


    In this chapter, we revealed the inner workings of basic binary protection schemes
    for Linux binaries, and discussed the various features of existing binary protectors
    that have been released for Linux over the last decade.


    In the next chapter, we will be exploring things from the opposite angle and begin
    looking at ELF binary forensics in Linux.'
