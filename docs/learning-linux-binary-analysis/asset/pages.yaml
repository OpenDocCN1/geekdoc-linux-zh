  md: '# Chapter 2


    Let''s take a look at the relocation entry for fgets():


    ```

    $ readelf -r test

    ```


    | Offset | Info | SymValue | SymName |

    | --- | --- | --- | --- |

    | 0804a000 | 00000107 | R_386_JUMP_SLOT | 00000000 | fgets |


    > R_386_JUMP_SLOT is a relocation type for PLT/GOT entries.

    On x86_64, it is called R_X86_64_JUMP_SLOT.


    Notice that the relocation offset is 0x804a000, the same address that the fgets()
    PLT jumps into. Assuming that fgets() is being called for the first time, the
    dynamic linker has resolve the address of fgets() and place its value into the
    GOT entry for fgets


    Let''s take a look at the GOT in our test program:


    ```

    8049ff4 <GLOBAL_OFFSET_TABLE_>:

    8049ff4:    28 9f 04 08 00 00    sub    %bl,0x804(%edi)

    8049ff0:    00 00              add    %al,(eax)

    8049ffc:    00 00              add    %al,(eax)

    8049ffe:    00 00              add    %al,(eax)

    804a000:   66 83 04 08 86    addw    %0x76,%eax,%ecx,1

    804a005:   83 04 08 86    addl    %xffffff86,%eax,%ecx,1)

    804a009:   83 04 08 96    addl    %xffffff96,%eax,%ecx,1)

    804a00d:   83               byte 0x83

    804a00e:   04 08              add    %0x08,%al

    ```


    The address 0x8048366 is highlighted in the code and is found at 0x804a000 in
    the GOT. Remember that little endian reverses the byte order, so it appears as
    66 83 04 08. This address is not the address to the fgets() function since it
    has not yet resolved by the linker, but instead points back into the PLT entry
    for fgets(). Let''s look at the PLT entry for fgets() again:


    ```

    8048360 <fgets@plt>:

    8048360:   ff 25 00 a0 04 08    jmp    *0x804a000

    8048366:   68 00 00 00 00    push   $0x0

    804836b:   e9 00 ff ff    jmp    8048350 <init+0x34>

    ```


    [ 43 ]'
