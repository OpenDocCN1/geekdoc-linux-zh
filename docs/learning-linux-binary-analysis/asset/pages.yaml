  md: '# Linux Binary Protection


    Illustration 5.1 shows visually how the encrypted executable is embedded within
    the data segment of the stub executable, wrapped within it, which is why stubs
    are also referred to as wrappers.


    > We will show in Identifying protected binaries in Chapter 6, ELF Binary Forensics
    in Linux how peeling a wrapper can actually be a trivial task in many cases, and
    how it may also be an automated task with the use of software or scripts.


    A typical stub performs the following tasks:


    +   - Decrypting its payload (which is the original executable)

    - Mapping the executable''s loadable segments into the memory

    - Mapping the dynamic linker into the memory

    - Creating a stack (that is with mmap)

    - Setting the stack up (argv, envp, and the auxiliary vector)

    - Passing control to the entry point of the program


    > If the protected program was dynamically linked, then the control will be passed
    to the entry point of the dynamic linker, which will subsequently pass it to the
    executable.


    A stub of this nature is essentially just a user implementation that loads and
    executes the program embedded within its own program body, instead of an executable
    that is a separate file.


    > The original user exec research and algorithm can be found in gruggq''s paper
    titled The Design and Implementation of Userland Exec at https://github.com/gruggq/docs/ul_exec.txt.


