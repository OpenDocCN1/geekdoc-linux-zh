  md: '# Detecting infected LKMs


    The solution to this problem should seem obvious based on the two simple detection
    methods just described. For the symbol hijacking method, you can simply look for
    two symbols that have the same value. In the example shown by Phrack, the init_module()
    was hijacked, but the technique should apply to any function that the attacker
    wants to hijack. This is because the kernel handles relocations for each one (although
    I have not tested this theory):


    ```

    $ objdump -t infected.lkm

    00000040 g      F.text      0000001b evil

    ...

    0000040 g      F.text      0000001b init_module

    ```


    Notice in the preceding symbol output that init_module and evil have the same
    relative address. This—right here—is an infected LKM as demonstrated in Phrack
    68 #11. Detecting functions with trampolines is quite simple and was already described
    in section 9.63, where we discussed detecting trampolines in the kernel. Simply
    apply the same analysis to the functions in a LKM file, which can be disassembled
    with tools such as objdump.


    # Notes on /dev/kmem and /dev/mem


    In the good old days, hackers were able to modify the kernel using the /dev/kmem
    file. This, which gave programmers a raw portal to the kernel memory, was eventually
    subject to various security patches and removed from many distributions. However,
    some distros still have it available to read from, which can be a powerful tool
    for detecting kernel malware, but it is not necessary as long as /proc/kcore is
    available. Some of the best work was ever written on patching the Linux kernel
    conceived by Silvio Cesare, which can be found on


    +   - Runtime kernel kmem patching: http://althing.cs.dartmouth.edu/local/vsc07.html


    # /dev/mem


    There have been a number of kernel rootkits that used /dev/mem, namely phalanx
    and phalanx2, written by Rebel. This has undergone a number of security patches.
    Currently, it is present on all systems for backwards compatibility, but only
    the first 1 MB of memory is accessible, primarily for legacy tools used by X Windows.'
