  md: '# DT_NEEDED


    This holds the string table offset to the name of a needed shared library.


    # DT_SYMTAB


    # DT_HASH


    This holds the address of the symbol hash table, also known by its section name
    `.hash (or sometimes named .gnu.hash).


    # DT_STRTAB


    This holds the address of the symbol string table, also known by its section name
    `.dynstr.


    # DT_PLGTOT


    This holds the address of the global offset table.


    > The Preceding dynamic tags demonstrate how the location of certain sections
    can be found through the dynamic segment that can aid in the forensics reconstruction
    task of rebuilding a section header table. If the section header table has been
    stripped, a clever individual can rebuild parts of it by getting information from
    the dynamic segment (that is, `.dynstr`, `.dynym`, and hash, among others).

    Other segments such as test data can yield information that is needed as well
    as for the `.text` and `.data` sections.


    The `d_val` member of ELF Dyn holds an integer value that has various interpretations
    as being the size of a relocation entry to give one instance.


    The `d_ptr` member holds a virtual memory address that can point to various locations
    needed by the linker, a good example would be the address to the symbol table
    for the `d_tag` DT_SYMTAB.'
