  md: "# Linux /proc/kcore Analysis\n\n# Detecting VFS layer rootkits\n\nThere are\
    \ probably several techniques out there for detecting this type of infection.\
    \ The general idea, however, is to validate the function pointer addresses and\
    \ confirm that they are pointing to the expected functions. In most cases, these\
    \ should be pointing to functions within the kernel and not to functions that\
    \ exist in LKMs. One quick approach to detecting is to validate that the pointers\
    \ are within the range of the kernel's text segment.\n\n# An example of validating\
    \ a VFS function pointer\n\n```\nif ((long)vfs_ops->readdr >= KERNEL_MIN_ADDR\
    \ &&\n    (long)vfs_ops->readdr < KERNEL_MAX_ADDR)\n    pointer_is_valid = 1;\n\
    else\n    pointer_is_valid = 0;\n```\n\n# Other kernel infection techniques\n\n\
    There are other techniques available for hackers for the purpose of infecting\
    \ the kernel (we have not discussed in this chapter), such as hijacking the Linux\
    \ page fault handler (http://phrack.org/issues/61/7.html). Many of these techniques\
    \ can be detected by looking for modifications to the text segment, which is a\
    \ detection approach that we will examine in the next sections.\n\n# vmlinux and\
    \ .altinstructions patching\n\nIn my opinion, the single most effective method\
    \ of rootkit detection can be summed up by verifying the code integrity of the\
    \ kernel against the memory - in other words, comparing the kernel memory against\
    \ the expected code. But wait, why not vmlinux? This is an approach that I originally\
    \ proposed in 2008. Knowing that an ELF executable's text segment does not change\
    \ from disk to memory, unless it's self-modifying binary, which the kernel is...\
    \ or is it? I quickly ran into trouble and found sorts of code discrepancies between\
    \ the kernel memory and the vmlinux text segment. This was baffling at first I\
    \ had no kernel rootkits installed during these tests. After examining some of\
    \ the ELF functions in vmlinux, I quickly saw some areas that caught my attention:\n\
    \n```\n$ readelf -S vmlinux | grep alt\n[23] .altinstructions PROGITS ffffffff81e64528\
