  md: 'There are several sections within the Linux kernel binary that contain alternative
    instructions. As it turns out, the Linux kernel developers had a bright idea:
    what if the Linux kernel could intelligently patch its own code segment at runtime,
    changing instructions for ''memory barriers'' based on the specific CPU that detected?
    This would be a nice idea because fewer stock kernels would need to be created
    for all the different types of CPUs it uses. Unfortunately for the security researcher
    who wants to detect any malicious changes in the kernel''s code segment, these
    alternative instructions would have to be understood and applied first.


    # .altinstructions and .altinstr_replace


    There are two sections that contain the majority of information needed to know
    which instructions in the kernel are getting patched at runtime. There is a great
    article that explains these sections now, which was not available at the time
    of my early research into this area of the kernel:


    https://lwn.net/Articles/531148


    The general idea, however, is that the .altinstr section contains an array of
    struct alt_instr structs. Each represents an alternative instruction record, giving
    the location of the original instruction and the location of the new instruction
    that should be used to patch the original. The .altinstr_replace section contains
    the actual alternative instructions that are referenced by the alt_instr->repl_offset
    member.


    # From arch/x86/include/asm/alternative.h


    ```

    struct alt_instr {

    s32 instr_offset;     /* original instruction *//

    s32 repl_offset;      /* offset to replacement instruction *//

    u6 cpuid;               /* cpuid bit set for replacement *//

    u8 instrlen;          /* length of original instruction *//

    u8 replacementlen;   /* length of new instruction, <= instrlen *//

    };

    ```


    On older kernels, the first two members gave the absolute addresses of the old
    and new instructions, but on newer kernels, a relative offset is used.'
  merge: -1
  pgno: 261
