  md: "ELF Virus Technology – Linux/Unix Viruses\n\n# Direct PLT infection\n\nDo not\
    \ confuse this with PLT/GOT (sometimes called PLT hooks). The PLT (procedure linkage\
    \ table) and GOT (global offset table) work closely in conjunction during dynamic\
    \ linking and through shared library function calls. They are two separate sections,\
    \ though learned about them in the Dynamic linking section of Chapter 2, The ELF\
    \ Binary Format. As a refresher, the PLT contains an entry for every shared library\
    \ function. Each entry contains code that performs a jump to a destination address\
    \ that is stored in the GOT. These addresses essentially point to their associated\
    \ shared function once the dynamic linking process has been completed. It is quite\
    \ practical for an attacker to overwrite the PLT entry containing the address\
    \ that points to his or her code. This is practical because it is easiest; the\
    \ GOT is writable, and one must modify only its addresses to change the control\
    \ flow. When discussing direct PLT infection, we are not referring to modifying\
    \ the GOT, though. We are talking about actually modifying the PLT code so that\
    \ it contains a different instruction to alter the control flow.\n\nThe following\
    \ is code for a PLT entry for the libc fopen():\n\n```\n000000000402350 <fopen$plt>\n\
    402350:\tff 25 9a 7d 21 00\tjmp *0x217d9a(%rip)\n# 61a0f0\n402356:\t68 01 00 00\t\
    push $0x1b\n40235b:\te9 30 fe ff ff\tjmp 402190 <init+0x28>\n```\n\nNotice that\
    \ the first instruction is an indirect jump. The instruction is six bytes long:\
    \ this could easily be replaced with another five/six-byte instruction that changes\
    \ the control flow to the parasite code. Consider the following instructions:\n\
    \n```\npush $0x000000\tpush the address of parasite code onto stack\nret\treturn\
    \ to parasite code\n```\n\nThese instructions are encoded as \\0xb8\\x00\\x00\\\
    x00\\xc3, which could be injected into the PLT entry to hijack all calls with\
    \ a parasite function (whatever that might be). Since the .plt section is in the\
    \ text segment, it is read-only, so this method won't work as a technique for\
    \ exploiting vulnerabilities (such as .got overwriting), but it is absolutely\
    \ possible to implement with a virus or a memory infection.\n\n[ 108 ]"
