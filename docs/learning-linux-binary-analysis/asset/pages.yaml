    readefs -ER <ecscore> .heap

    readefs -0 <ecscore> .vdso_elf.so

    readefs -X <ecscore> procfs_dir


    # Examining an infected process using ECFS


    Before we show the effectiveness of ECFS with a real-world example, it would be
    helpful to have a little background of the method of infection that we will use
    from a hacker''s perspective. It is often very useful for a hacker to incorporate
    anti-forensic techniques into their workflow on compromised systems so that their
    programs, especially the ones that serve as backdoors and such, can remain hidden
    to the untrained eye.


    One such technique is to perform process cloaking. This is the act of running
    a program inside of an existing process, ideally inside of a process that is known
    to be benign but persistent, such as ftpd or sshd. The Saruman anti-forensics
    exec (http://www.bitlackkeys.org/#saruman) allows an attacker to inject a complete,
    dynamically linked PE into an existing process address space and run it.'
  merge: -1
  pgno: 223
- img_proc: true
  md: '# ECFS – Extended Core File Snapshot Technology


    It uses a thread injection technique so that the injected program can run simultaneously
    with the host program. This particular hacker technique was something that I came
    up with and designed in 2013, but I have no doubt that other tools have existed
    for much longer than this in the underground scene. Typically, this type of anti-forensic
    technique would go unnoticed and would be very difficult to detect.


    Let''s see what type of efficiency and accuracy we can achieve by analyzing such
    a process with ECFS technology.


    # Infecting the host process


    The host process is a benign process, and typically it would be something like
    sshd or ftpd, as already mentioned. For the sake of our example, we will use a
    simple and persistent program called host; it runs in an infinite loop, printing
    a message on the screen. We then inject a remote server backdoor into the process
    using the Saruman anti-forensics exec launcher program.


    In terminal 1, run the host program:


    ```

    $ /host

    I am the host

    I am the host

    I am the host

    ```


    In terminal 2, inject the backdoor into the process:


    ```

    $ ./launcher `pidof` ./server

    [+] Thread injection succeeded, tid: 16187

    [+] Saruman successfully injected program: ./server

    [+] PT_DETACHED -> 16186

    $

    ```


    # Capturing and analyzing an ECFS snapshot


    Now, if we capture a snapshot of the process either by using the ecfs_snapshot
    utility or by signaling the process to the core dump, we can begin our examination.'
