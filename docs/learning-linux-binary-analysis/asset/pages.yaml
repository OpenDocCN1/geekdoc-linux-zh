  md: '# # 2

    The ELF Binary Format


    In order to reverse-engineer Linux binaries, you must understand the binary format
    itself. ELF has become the standard binary format for Unix and Unix-flavor Oses.
    In Linux, BSD variants, and other Oses, the ELF format is used for executables,
    shared libraries, object files, dump files, and the kernel boot image. This makes
    ELF very important for those who want to better understand reverse engineering,
    binary hacking and reverse engineering. Binary formats such as ELF are not generally,
    and to learn ELF requires some degree of application of the different components
    that you learn as you go. Real, hands-on experience is necessary to achieve proficiency.
    The ELF format is complicated and dry, but can be learned with some enjoyment
    when applying your developing knowledge of composition of computer science at
    work, with program loading, dynamic linking, symbol table lookups, and many other
    tightly orchestrated components.


    I believe that this chapter is the most important in this entire book because
    it will give the reader much greater insight into topics pertaining to how a program
    is actually mapped on disk and loaded into memory. The inner workings of program
    execution are complicated, and understanding it is valuable knowledge to the aspiring
    binary hacker, reverse engineer, or low-level programmer. In Linux, program execution
    implies the ELF binary format.


    My approach to learning ELF is through investigation of the ELF specifications
    as any Linux reverse engineer should, and then applying each aspect of what we
    learn in a creative way. Throughout this book, you will visit many facets of ELF
    and see how knowledge of it is pertinent to viruses, process-memory forensics,
    binary protection, rootkits, and more.'
  merge: -1
