  md: '# PLT/GOT integrity


    The global offset table will be filled with the resolved values of the corresponding
    shared library functions. This was, of course, done by the dynamic linker, and
    so we must replace these addresses with the original PLT stub addresses. We do
    this so that the shared library functions are called for the first time, they
    trigger the dynamic linker through the PLT instruction that pushes the GOT offset
    onto the stack. Refer to the ELF and dynamic linking section of Chapter 2, The
    ELF Binary Format.


    The following diagram demonstrates how GOT entries must be restored:


    ![](img/10a855ebad6fe689ed3447763aed6bf4_99_0.png)


    # Adding a section header table


    Remember that a program''s section header table is not loaded into the memory
    at runtime. This is because it is not needed. When reconstructing a process image
    into an executable, it would be desirable (although not necessary) to add a section
    header table. It is perfectly possible to add every section header that was on
    the original executable, but a good ELF hacker can generate at least the basics.


    So try to create a section header for the following sections: .interp, .note,
    .text, .dynamic, .got.plt, .data, .bss, .shstrtab, .dynym, and .dynstr.


    > If the executable that you are reconstructing is statically linked, then you
    won''t have the .dynamic, .got.plt, .dynym, or .dynstr sections.'
