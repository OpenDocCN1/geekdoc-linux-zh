- img_proc: true
  md: '# ECFS – Extended Core File Snapshot Technology


    The ecfs_snapshot utility ultimately uses the ptrace system call, which means

    two things:


    +   - It may take noticeably longer to snapshot the process

    - It may be ineffective against processes that use anti-debugging techniques to

    prevent ptrace from attaching


    In cases where either of these issues becomes a problem, you may have to consider

    using the ECFS core handler for the job, in which case you will have to kill the

    process. In most situations, the ecfs_snapshot utility will work.


    Here''s an example of capturing an ECFS host with the snapshot:


    ```

    $ ecfs_snapshot -p `pidof host`-o host_snapshot

    ```


    This snapshots the process for the program and creates an ECFS snapshot

    host_snapshot. In the following sections, we will demonstrate some actual use

    cases of ECFS and take a look at the ECFS files with a variety of utilities.


    # libefcs – a library for parsing ECFS files


    The ECFS file format is very easy to parse with traditional ELF utilities, such
    as

    readelf, but build parsing tools that are custom, I recommend that you use

    tlibefcs library. This library is specifically designed for easy parsing of ECFS
    core

    files. It will be demonstrated with slightly more details later in this chapter
    when we

    look at designing advanced malware analysis tools to detect infected processes.


    libefcs is also used in the ongoing development of the readelf utility, which
    is

    t tool for parsing ECFS files, and is very similar to the commonly known readelf

    utility. Note that libefcs is included with the ECFS package on the GitHub repository.


    # readelf


    The readelf utility will be used throughout the rest of this chapter will

    demonstrating the different ECFS features. Here is a synopsis of the tool from

    readelf -h:


    ```

    Usage: readelf [-RAPsslphelga] <ecscore>

    -a print all (equiv to -Sslphega)

    -s print symbol table info

    -l print shared library names

    -p print ELF program headers

    -S print ELF section headers

    -h print ELF header

    ```'
