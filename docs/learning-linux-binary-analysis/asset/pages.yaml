  md: '# Chapter 5


    The SYS\_execve system call, which is generally used by the glibc wrappers (for
    example, execve, execv, exele, and execcl) will load and run an executable file.
    In the case of a software protector, the executable is encrypted and must be decrypted
    prior to being executed. One unseasonal hacker would program their stub to decrypt
    the executable and then write it to a decrypted form before they execute it with
    SYS\_exec, although the original UPX packer did work this way.


    The skilled way of accomplishing this is by decrypting the executable in place
    (in memory), and then loading and executing it from the memory – not a file. This
    can be done from the userland code, and therefore we call this technique user
    exec. Many software protectors implement a stub that does that. One of the challenges
    in implementing a userland executable is that it must load the segments into their
    designated address range, which would typically be the same addresses that are
    designated for the stub executable.


    This is only a problem for ET\_EXEC-type executables (since they are not position
    independent), and it is generally overcome by using a custom linker script that
    tells the stub executable segments load at an address other than the default.
    An example of such a linker script is shown in the section on linker scripts in
    Chapter 1, The Linux Environment and Its Tools.


    > On x86, 32, the default base is 0x8048000; and on x86_64, it is 0x400000. The
    stub should have load addresses that do not conflict with the default address
    range. For example, a recent one that I wrote is linked such that the text segment
    is loaded at 0xa00000.


    ![](img/10a855ebad6fe689ed3447763aed6bf4_147_0.png)'
