  md: "So the question is: Why have two symbol tables if .symtab already contains\
    \ everything that's in .dynym? If you check the readelf -S of an executable, you\
    \ will see that some sections are marked A (ALLOC) or WA (WRITE/ALLOC) or AX (ALLOC/EXEC).\
    \ If you look at .dynym, you will see that it is marked ALL, whereas .symtab has\
    \ no flags.\n\nALLOC means that the section will be allocated at runtime and loaded\
    \ into memory, and .symtab is not loaded into memory because it is not necessary\
    \ for runtime. The .dynym contains symbols that can only be resolved by the dynamic\
    \ linker, and therefore they are the only symbols needed at runtime, while the\
    \ .dynym symbol table is necessary for the execution of dynamically linked executables,\
    \ the .symtab table exists only for debugging and linking purposes and is often\
    \ stripped (removed) from production binaries to save space.\n\nLet's look at\
    \ an ELF symbol entry looks like 64-bit ELF files:\n\n```\ntypedef struct {\n\
    \    uint32_t st_name;\n    unsigned char st_info;\n    unsigned char st_other;\n\
    \    uint16_t    st_shndx;\n    Elf64_Addr st_value;\n    uint64_t   st_size;\n\
    } Elf64_Sym;\n```\n\nSymbol entries are contained within the .symtab and .dynym\
    \ sections, which is why the sh_entsize (section header entry size) for those\
    \ sections are equivalent to sizeof(Elfn_Sym).\n\n# st_name\n\nThe st_name contains\
    \ an offset into the symbol table's string table (located in either .dynstr or\
    \ .strtab), where the name of the symbol is located, such as printf.\n\n# st_value\n\
    \nThe st_value holds the value of the symbol (either an address or offset of its\
    \ location).\n\n# st_size\n\nThe st_size contains the size of the symbol, such\
    \ as the size of a global function ptr, which would be 4 bytes on a 32-bit system."
