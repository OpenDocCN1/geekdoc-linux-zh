  md: '# Linux Binary Protection


    There are many differences that you will note. The entry is 0xa01136, and there
    are only two loadable segments, which are the text and data segments. Both of
    these are at completely different load addresses before.


    This is of course because the load addresses of the stub cannot conflict with
    the load address of the encrypted executable contained within it, which must be
    loaded and memory-mapped to. The original executable has a segment address of
    0x400000. The stub is responsible for decrypting the executable embedded within
    and then mapping it to the load addresses specified in the FT_LOAD program headers.


    If the addresses conflict with the stub''s load addresses, it will not work. This
    means that the stub has to be compiled using a custom linker script. This way
    is commonly done by modifying the existing linker script that is used by Id. For
    the protector used in this example, I modified a line in the linker script:


    +   This is the original:

    ```

    PROVIDE (executable_start = SEGMENT_START("text-segment", 0x400000)); = SEGMENT_START("text-segment",
    0x400000) + SIZEOF_HEADERS);

    ```


    +   The following is modified:

    ```

    PROVIDE (executable_start = SEGMENT_START("text-segment", 0xa000000)); = SEGMENT_START("text-segment",
    0xa000000) + SIZEOF_HEADERS);

    ```


    Another thing that you can notice from the program headers in the protected executable
    is that there is no FT_INTERP segment or FT_DYNAMIC segment. This would appear
    to the untrained exe as a statically linked executable, since it does not appear
    to be using dynamic linking. This is because you are not viewing the program headers
    of the original executable.


    > Remember that the original executable is encrypted and embedded within the stub,
    so you are really viewing the program headers from the stub and not from the executable
    that it is protecting. In many cases, the stub is compiled and linked with very
    minimal options and does not require dynamic linking itself. One of the primary
    characteristics of a good userland exe implementation is the ability to load the
    dynamic linker into memory.


    As I mentioned, the stub is a userland exe, and it will map the dynamic linker
    to the memory after it decrypts and maps the embedded executable to the memory.
    The dynamic linker will then handle symbol resolution and runtime locations before
    it passes control to the now-decrypted program.'
