  md: 'Linux /proc/kcore Analysis


    # # Using rectify to verify kernel code integrity


    Over the years, I have designed several tools that detect the integrity of the
    Linux kernel''s code segment. This detection technique will obviously work on
    kernel rootkits that modify the text segment, and most of them do in some way
    or the other. However, there are exceptions such as rootkits that rely only on
    altering the VFS layer, which resides in the data segment and will not be detected
    by verifying the integrity of the text segment. Most recently, the tool that I
    wrote (a part of the kernel Voodoo software suite) is named rectify, taken from
    /proc/kcore, against the text segment in vmlinux. It parses .instructions and
    various other sections, such as .parinstructions, to learn the locations of code
    instructions that are patched. In this way, there are no false positives showing
    up. Although rectify is currently not available to the public, the general idea
    has been explained. Therefore, it may be implemented by anyone who wishes to attempt
    the somewhat arduous coding procedures to make it work.


    # # An example of using rectify to check sys_call_table


    ```

    # /vmlinux /proc/kcore -s sys_call_table

    kernel Detective 2014 - Bitlacks.org


    +] Analyzing kernel code/data for symbol sys_call_table in range

    [0xffffff81801460 0xffffff8802570]

    +] No code modifications found for object named ''sys_call_table''

    ```


    ```

    # /vmlinux /proc/kcore -a

    kernel Detective 2014 - Bitlacks.org


    +] Analyzing kernel code of entire text segment. [0xffffffff81000000 0xffffffff81773da4]

    +] No code modifications have been detected within kernel memory

    ```


    In the preceding example, we first check to make sure that sys_call_table has
    not modified. On modern Linux systems, sys_call_table is marked as read-only and
    is forever stored in the text segment, which is why we use rectify to validate
    its integrity. In the next command, we run rectify with the -a switch, which scans
    every single byte in the entire text segment for illegal modifications. We could
    simply run -a to begin with since sys_call_table is included in -a, but sometimes,
    it''s nice to scan things by symbol name too.'
