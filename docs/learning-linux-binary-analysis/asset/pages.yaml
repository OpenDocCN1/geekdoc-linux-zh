    The first 5 bytes are inserted as NOP instructions for alignment (or possibly
    for trace probes). The kernel uses sequences of bytes (0x66,0x66,0x66, and 0x90).
    The procedure prologue code follows the initial 5 NOP bytes, which is perfectly
    intact. Therefore, validates that system syscall has not been hooked by system_call(),
    which in-turn calls the selected within sys_call_table:


    # Interrupt handler patching – int 0x80, syscall


    One classic way of activating is inserting a phony system call into the kernel
    memory and modifying the top-half interrupt handler that is responsible for invoking
    syscalls. In an x86 architecture, the interrupt 0x80 is deprecated and has been
    replaced with a special syscall/sysenter instruction 0x80 end up invoking the
    same function, named system_call(), which in-turn calls the selected within sys_call_table:


    ```

    (gdb) x/i system_call_fastpath+19

    0xffffffff8176ea86 <system_call_fastpath+19>:

    callq  *0x7e7feba0(%rax),8

    ```


    On x86_64, the preceding instruction takes place after a swapgs in system_call.
    Here is what the code looks like in entry:S:


    ```

    call *sys_call_table(%rax),8

    ```


    The (r)ax register contains the syscall number that is multiplied by sizeof(long)
    it is conceivable that an attacker can use kmalloc() a phony system call into
    the memory (which contains some modifications with pointers to malicious functions),
    and then patch the instruction so the phony system call table is used. This technique
    is actually quite sneaky because it yields no modifications to the original sys_call_table.
    Unfortunately for intruders, this technique is very easy to detect for the trained
    eye.'
