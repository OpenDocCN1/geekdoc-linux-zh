- img_proc: true
  md: '# # 8 ECFS – Extended Core File Snapshot Technology


    **Extended Core File Snapshot (ECFS)** technology is a piece of software that
    plugs into the Linux core handler and creates specialized process memory snapshots
    specifically designed with process forensics in mind. Most people have no idea
    how to parse a process image, let alone to examine one for anomalies. Even for
    experts, it can be an arduous task to look at a process image and detect infections
    or malware.


    Before ECFS, there existed no real standard for snapshotting of a process image
    other than using core files, which can be created on demand using the **gcore**
    script that comes with most Linux distributions. As briefly discussed in the previous
    chapter, regular core files are not particularly useful for process forensics
    analysis. This is why ECFS core files came into existence—to provide a file format
    that describe every process image so that it can be effectively analyzed, easily
    navigated, and easily integrated with malware analysis and forensics tools.


    In this chapter, we will discuss the basics of ECFS and how to use ECFS core files
    and the **libecfs** API to rapidly design malware analysis and forensics tools.


    # # History


    In 2011, I created a software prototype titled Linux VMA Monitor (http://www.bitlackskeys.org/#mvavudu)
    for a DARPA contract. This software was designed to look at live process memory
    or raw snapshots of process memory. It was able to detect all sorts of runtime
    infections, including shared library injection, PLT/GOT hijacking, and other anomalies
    that indicate runtime malware.'
  merge: -1
  pgno: 219
- img_proc: true
  md: '# ECFS – Extended Core File Snapshot Technology


    In more recent times, I considered rewriting this software into a more finished
    state, and I feel that a native snapshot format for process memory would be a
    really nice feature. This was the initial inspiration for developing ECFS, and
    although I have canceled my plans of reviving the Linux VMA Monitor software for
    now, I am continuing to develop the ECFS software as it is of great value to many
    other people''s projects. It is being incorporated into the Lotan product, which
    is a piece of software used to detect exploitation attempts by analyzing crash
    dumps (http://www.leviathansecurity.com/lotan).


    # The ECFS philosophy


    ECFS is all about making runtime analysis of a program easier than ever before.
    The entire process is encased within a single file, and it is organized in such
    a way that locating and accessing data is critical for detecting anomalies and
    infections is achievable through orderly and efficient means. This is primarily
    done through parsing section headers to access useful data, such as symbol tables,
    dynamic linking data, and forensics-relevant structures.


    # Getting started with ECFS


    At the time of writing this chapter, the complete ECFS project and source code
    is available at http://github.com/elfmaster/ecfs. Once you have cloned the repository
    with git, you should compile and install the software as described in the README
    file.


    Currently, ECFS has two modes of use:


    > In this chapter, the terms ECFS files, ECFS snapshots, and ECFS core files are
    used interchangeably.


    # Plugging ECFS into the core handler


    The first thing is to plug the ECFS core handler into the Linux kernel. The make
    install will accomplish this for you, but it must be done after every reboot or
    stored in an init script. The manual way of setting up the ECFS core handler is
    by modifying the /proc/sys/kernel/core_pattern file.'
  merge: -1
  pgno: 220
- img_proc: true
  md: "This is the command used to activate the ECFS core handler:\necho '|/opt/ecfs/bin/ecfs_handler\
    \ -t -e -np -p -o \\ \n/opt/ecfs/cores/${%e.%$p}' > /proc/sys/kernel/core_pattern\n\
    \n> Notice that the -t option is set. This is very important for forensics and\
    \ it should rarely be turned off. This option tells ECFS to capture the text segment\
    \ for any executable or shared library mappings. In traditional core files, the\
    \ text images are truncated to 4k. Later in this chapter, we will also examine\
    \ the -h option (heuristics), which can be set to enable extended heuristics in\
    \ order to detect shared library injection.\n\nThe ecfs_handler binary will invoke\
    \ ecfs32 or ecfs64 depending on whether the process is 64 or 32 bit. The pipe\
    \ symbol (| at the front of the line that we write into the cores pattern enters\
    \ the kernel to pipe the core file it produces into the standard input of our\
    \ ECFS core handler. The ECFS core handler transforms the traditional core file\
    \ into a highly customized and spectacular core file. Anytime if a process crashes\
    \ or is delivered a signal such as SIGSEGV or SIGABRT, then the ECFS core handler\
    \ will step in and instrument the core file creation with its own special set\
    \ of procedures for creating ECFS-style core dump.\n\nHere's an example of capturing\
    \ an ECFS snapshot of sshd:\n\n```\n$ kill -ABRT \"pidof sshd\"\n$ ls -lh /opt/ecfs/cores\n\
    -rwxr-xr-x 1 root root 8244638 Jul 24 13:36 sshd.1211\n$\n```\n\nHaving ECFS as\
    \ the core file handler is very nice and perfectly suitable for everyday use.\
    \ This is because ECFS cores are backwards compatible with traditional core files\
    \ and can be used with debuggers as GDB. However, there are times when a user\
    \ may want to capture an ECFS snapshot without having to kill the process. This\
    \ is where the ECFS snapshot tool comes useful.\n\n# ECFS snapshots without killing\
    \ the process\n\nLet's consider a scenario where there is a suspicious process\
    \ running. It is suspicious because it is consuming a lot of CPU and its network\
    \ sockets open even though it is known to be a network program of any kind. In\
    \ such a scenario, it may be desirable to leave the process running so that a\
    \ potential attacker is not alerted, but still have the capability to produce\
    \ an ECFS core file. The ecfs_snapshot utility should be used in these cases."
