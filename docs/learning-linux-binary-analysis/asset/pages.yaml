  md: "# Chapter 3\n\n| Request | Description |\n| --- | --- |\n| PTRACE_POKETEXT\
    \ | These requests allow the tracing process to modify any location within the\
    \ traced process image. |\n| PTRACE_POKEDATA |  \n| PTRACE_POKEUSER | This request\
    \ allows the tracing process to get a copy of the traced process's registers.\
    \ Each thread context has its own register set, of course. |\n| PTRACE_SETREGS\
    \ | This request allows the tracing process to set new register values for the\
    \ traced process, for example, modifying the value of the instruction pointer\
    \ to the shellcode. |\n| PTRACE_CONT | This request tells the stopped process\
    \ to resume execution. |\n| PTRACE_DETACH | This request resumes the traced process\
    \ as well as detaches. |\n| PTRACE_SYSCALL | This request resumes the traced process\
    \ but arranges for it to stop at the entrance/exit of the next syscall. This allows\
    \ us to inspect the arguments for the syscall and even modify them. This `ptrace`\
    \ request is heavily used in the code for a program called `strace`, which is\
    \ shipped with most Linux distributions. |\n| PTRACE_SINGLESTEP | This resumes\
    \ the process but stops after the next instruction. Single stepping allows a debugger\
    \ to stop after every instruction that is executed. This allows a user to inspect\
    \ the values of the registers and the state of the process after each instruction.\
    \ \nThis retrieves information about the signal that caused the stop. It retrieves\
    \ a copy of the `siginfo_t` structure, which we can analyze or modify (`PTRACE_GETSIGINFO`)\
    \ to send back to the tracer. |\n| PTRACE_SETSSIGINFO | Sets the signal information.\
    \ Copies a `siginfo` structure from the data address in the tracer to the trace.\
    \ This will only affect signals that would normally be delivered to the trace\
    \ and would be caught by the tracer. It may be difficult to tell these normal\
    \ signals from synthetic signals generated by `ptrace()` itself (`addr` is ignored).\
    \ |\n| PTRACE_SETOPTIONS | Sets the `ptrace` options from data (`addr` ignored).\
    \ Data is interpreted as a bitmask of options. These are specified by flags in\
    \ the following section (check out the main pages of `ptrace` (2) for a listing).\
