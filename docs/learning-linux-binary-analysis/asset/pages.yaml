  md: '# Other jobs performed by protector stubs


    In addition to decrypting and loading the embedded executable into memory, which

    is for the userland exec component, the stub may also perform other tasks. It
    is common

    for the stub to start anti-debugging and anti-emulation routines that are meant
    to

    further protect the binary from being debugged or emulated in order to raise the
    bar

    even so that reverse engineering is even more difficult.


    In Chapter 4, ELF Virus Technology – Linux/Unix Viruses, we discussed some antebugging
    techniques used to prevent debugging based on ptrace. This prevents

    most debuggers, including GDB, from trivially tracing the binary. Later in this

    chapter, we will summarize the most common anti-debugging techniques used

    in binary protection for Linux.


    # Existing ELF binary protectors


    Over the years, there have been a few noteworthy binary protectors that were

    released both publicly and from the underground scene. I will discuss some

    t protectors for Linux and give a synopsis of the various features.


    # DacryFile by the Grugg – 2001


    DacryFile is the earliest binary protector that I am aware of for Linux (https://github.com/packs/binary-encryption/tree/master/binary-encryption/dacryfile).
    This protector is simple but nonetheless clever and works very similar

    to ELF parasite infection from a virus. In many protectors, the stub wraps around
    the

    encrypted binary, but in the case of DacryFile, the stub is just a simple decryption

    route that is injected into the binary to be protected.


    DacryFile encrypts a binary from the beginning of the .text section to the end
    of

    the segment using RC4 encryption. The decryption stub is a simple program

    written in assembly and C, and it does not have the userland exec function; it
    simply

    decrypts the encrypted body of code. This stub is inserted at the end of the data

    segment, which is very reminiscent of how virus inserts a parasite. The entry
    point

    of the executable is modified to point to the stub, and upon execution of the
    binary,

    stub decrypts the text segment of the program. Then it passes the control to the

    original entry point.


    ```

    On systems that protect NX, the data segment cannot be used to hold

    code unless it is explicitly marked with executable permission bits, that is,

    ''p_flags |= PF_X''.

    ```'
