  md: "# The ELF Binary Format\n\n# The auxiliary vector\n\nWhen a program gets loaded\
    \ into memory by the sys_execve() syscall, the executable is mapped in and given\
    \ a stack (among other things). The stack for that process address space is set\
    \ up in a very specific way to pass information to the dynamic linker. This particular\
    \ setup and arrangement of information is known as the auxiliary vector or auxv.\
    \ The bottom of the stack (which is its highest memory address since the stack\
    \ grows down on x86 architecture) is loaded with the following information:\n\n\
    | Auxiliary vector |\n|---|\n| environ |\n| argv |\n| Stack |↓\n\n[argc][envp][auxiliary][.ascii\
    \ data for argv/envp]\n\nThe auxiliary vector (or auxv) is a series of Elf_auxiliary_t\
    \ structs.\n\n```\ntypedef struct {\n    uint64_t a_type;      /* Entry type */\n\
    \    union {\n        uint64_t a_val;      /* Integer value */\n        char a_un[];n\
    \    }\n} Elf64_aux_t;\n```\n\nThe a_type describes the auxv entry type, and the\
    \ a_val provides its value. The following are the most important entry types that\
    \ are needed by the dynamic linker:\n\n```\n#define AT_EXECFD 2      /* File descriptor\
    \ of program */\n#define AT_PHDR   3      /* Program headers for program */\n\
    #define AT_PHENT  4      /* Size of program header entry */\n#define AT_PHNUM\
    \  5      /* Number of program headers */\n#define AT_PAGESZ 6      /* System\
    \ page size */\n#define AT_ENTRY  9      /* Entry point of program */\n#define\
    \ AT_UID    11     /* Real uid */\n```\n\nThe dynamic linker retrieves information\
    \ from the stack about the executing program. The linker must know where the program\
    \ headers are, the entry point of the program, and so on. I listed only few of\
    \ the auxv entry types previously, taken from /usr/include/elf.h."
