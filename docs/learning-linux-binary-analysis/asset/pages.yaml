    technique, and when using thread injection, you can run them all concurrently
    so they execute at the same time. Saruman is a PoC software that I designed to
    do this. It uses two methods of injection: the open()/mmap() method with manual
    relocations or the __libc_dlopen_mode() method. This is available on my site at
    http://bitlackacks.org/#saruman.


    # so injection with VDSO manipulation


    This is a technique that I discussed in my paper at http://vxhaven.org/lib/vrn00.html
    The idea is to manipulate the virtual dynamic shared object (VDSO), which is mapped
    into every process address space in Linux kernel version 2.6.x. The VDSO contains
    code to speed up system calls, and they can be invoked directly from the VDSO.
    The trick is to locate the code that invokes syscalls by using TRACE_SCALL, which
    will break once it lands on this code. The attacker can then load the desired
    syscall number and store the arguments in the other registers, following the proper
    calling convention for Linux x86 system calls. This is surprisingly easy and can
    be used to call the open()/mmap() method without having to inject any shellcode.
    This can be useful for PaX, which prevents a user from injecting code into the
    text segment. I recommend reading my paper for a complete dissertation on the
    technique.


