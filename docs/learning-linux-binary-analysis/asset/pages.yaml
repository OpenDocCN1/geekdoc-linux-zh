  md: '# ELF Binary Forensics in Linux


    The first three GOT entries are reserved and will typically not be patched because
    it likely prevent the executable from running correctly (See Chapter 2, The ELF
    Binary Format, section on dynamic linking). Therefore, as analysts, we are interested
    in observing the entries starting at GOT[3]. Each GOT value should be an address.
    The address can have one of two values that would be considered:


    +   - Address pointer points back into the PLT

    - Address pointer points to a valid shared library function


    When a binary is infected on disk (versus runtime infection), then a GOT entry
    will be patched with an address somewhere within the binary where code has been
    injected. Recall from Chapter 4, ELF Virus Technology – Linux/Unix Viruses, there
    are numerous ways to inject code into an executable file. In the binary sample
    that we will look here, a relocatable object file (ST_REL) was inserted at the
    end of the text segment using the Silvio padding technique.



    When analyzing the .plt section of a binary that has been infected, we must carefully
    validate each address from GOT[4] through GOT[N]. This is still easier looking
    at the binary in memory before the binary is executed, the GOT entries should
    always point only to the PLT, as no shared library functions have resolved yet.


    Using the readelf -S utility and looking for the .plt section, we can deduce the
    PLT address range. In the case of the 32-bit binary I am looking at now, it is
    0x8048300 - 0x80483500. Remember this range before we look at the following

    .plt section.


    # Truncated output from readelf -S command


    ```

    [12] .plt      PROGITS        08048300 000300 000050 04 AX 0 0 16

    ```


    Now let''s take a look at the .plt section of a 32-bit binary and see if any of
    the relevant addresses are outside of 0x8048300-0x80483500:


    Contents of section .plt:


    ```

    0x804a00c: 28860408 26830408 36830408 ...

    ```'
