  md: '# ERESI – The ELF reverse engineering system interface


    ERESI project (http://www.eresi-project.org) contains a suite of many tools that
    are a Linux binary hacker''s dream. Unfortunately, many of them are not kept to
    date and not fully compatible with 64-bit Linux. They exist for a variety of architectures,
    however, and are undoubtedly the most innovative single collection of tools for
    the purpose of hacking ELF binaries that exist today. I personally am not familiar
    with using the ERESI project''s tools, and because they are no longer kept to
    date, I will not be exploring their capabilities within this book. However, be
    there are two Phrack articles that demonstrate the innovation and powerful features
    of the ERESI tools:


    +   - Cerberus ELF interface (http://www.phrack.org/archives/issues/61/8.txt)

    - Embedded ELF debugging (http://www.phrack.org/archives/63/9.txt)


    # Useful devices and files


    Linux has many files, devices, and /proc entries that are very helpful for the
    avid hacker and reverse engineer. Throughout this book, we will be demonstrating
    the usefulness of many of these files. Here is a description of some of the commonly
    used ones throughout the book.


    # /proc/<pid>/maps


    /proc/<pid>/maps file contains the layout of a process image by showing each memory
    mapping. This includes the executable, shared libraries, stack, heap, VDSO, and
    more. This is critical for being able to quickly parse the layout of a process
    address space and is used more than once throughout this book.


    # /proc/kcore


    The /proc/kcore is an entry in the proc system that acts as a dynamic core file
    of the Linux kernel. That is, it is a raw dump of memory that is presented in
    the form of an ELF core file that can be used by GDB to debug and analyze the
    kernel. We will explore /proc/kcore in depth in Chapter 9, Linux /proc/kcore Analysis.'
  merge: -1
  pgno: 29
- img_proc: true
  md: '# /boot/System.map


    This file is available on almost all Linux distributions and is very useful for
    kernel hackers. It contains every symbol for the entire kernel.


    # /proc/kallsyms


    The kallsyms is very similar to System.map, except that it is a /proc entry that
    means that it is maintained by the kernel and is dynamically updated. Therefore,
    if any new LKMs are installed, the symbols will be added to /proc/kallsyms on
    the fly. The /proc/kallsyms contains at least most of the symbols in the kernel
    and will contain all of them if specified in the CONFIG_KALLSYMS_ALL kernel config.


    # /proc/iomem


    The iomem is a proc entry as similar to /proc/<pid>/maps, but for all of the system
    memory. If, for instance, you want to know where the kernel''s text segment is
    mapped in the physical memory, you can search for the Kernel string and you will
    see the code/text segment, the data segment, and the bss segment:


    ```

    $ grep Kernel /proc/iomem

    01000000-016d9b27 : Kernel code

    016d9b28-01ceceebf : Kernel data

    01df0000-01f2f6ff : Kernel bss

    ```


    # ECFS


    Extended core file snapshot (ECFS) is a special core dump technology that was
    specifically designed for forensic analysis of a process image. The code for this
    software can be found at https://github.com/elfmaster/ecfs. Also, Chapter 8, EFS
    – Extended Core File Snapshot Technology, is solely devoted to explaining what
    ECFS is and how to use it. For those of you who are into advanced memory forensics,
    you will want to pay attention to.


    # Linker-related environment points


    The dynamic loader/linker linking concepts are inescapable components involved
    in the process of linking and execution. Throughout this book, you will learn
    a lot about these topics. In Linux, there are a few ways to alter the dynamic
    linker''s behavior that can serve the binary hacker in many ways. As we move through
    the book, you will begin to understand the process of linking, relocations, and
    dynamic loading (program interpreter). Here are a few linker-related attributes
    that are useful and will be used throughout the book.'
  merge: -1
  pgno: 30
- img_proc: true
  md: '# The LD_PRELOAD environment variable


    The LD_PRELOAD environment variable can be set to specify a library path that
    should be dynamically linked before any other libraries. This has the effect of
    allowing functions and symbols from the preloaded library to override the ones
    from the other libraries linked afterwards. This essentially allows you to perform
    runtime patching by redirecting shared library functions. As we will see in later
    chapters, this technique can be used to bypass anti-debugging code and forland
    rootkits.


    # The LD_SHOW_AUX environment variable


    This environment variable tells the program loader to display the program''s auxiliary
    vector during runtime. The auxiliary vector information that is placed on the
    program''s stack (by the kernel''s ELF loading routine), with information that
    the maps file, with certain information about the program. We will examine this
    much more closely in Chapter 3, Linux Tracing, but the information might be useful
    for reversing and debugging. If, for instance, you want to get the memory address
    of the VDSO page in the process image (which can also be obtained from the maps
    file, as shown earlier) you have to look for AT_SYSINFO.


    Here is an example of the auxiliary vector with LD_SHOW_AUX:


    ```

    $ LD_SHOW_AUX=1 whoami

    AT_SYSINFO: 0xb77739414

    AT_SYSINFO_EHDR: 0xb77739000

    AT_HWCAP: fpu vm de pse mar p par cx8 mce apic sep pge mtrr mca cmov pat pse36
    clflush mmx ssr sse2

    AT_PAGESZ: 100

    AT_CLOCK:

    AT_PHDR: 0x80480334

    AT_PHENT: 32

    AT_PHNUM: 9

    AT_BASE: 0xb777a000

    AT_FLAGS: 0x0

    AT_ENTRY: 0x8048ebb8

    AT_UID: 1000

    AT_EUID: 1000

    AT_GID: 1000

    AT_EGID: 1000

    AT_SECURE: 0

    ```'
  merge: -1
