  md: '# The ELF Binary Format


    Let''s take a look at a call to the libc.so function gets in a 32-bit compiled
    ELF

    executable. We will use a 32-bit executable in our examples because the relationship

    with the GOT is easier to visualize since IP relative addressing is not used,
    as it is in

    64-bit executables.


    ```

    objdump -d test

    ...

    8048481:    e8 da fe ff ff      call   8048360<fgets@plt>

    ...

    ```


    The address 0x8048360 corresponds to the PLT entry for gets().). Let''s take a
    look

    at at our address: -d test


    ```

    8048360<fgets@plt>:               /* A jump into the GOT */

    8048360:             ff ff 00 0a 04 08      jump     0x804a000

    8048366:             68 00 00 00 00      push     $0x

    804836b:             e9 00 ff ff ff      jmp     8048350<_init+0x34>

    ```


    So the call to 8048360 leads to the PLT jump entry for

    gets().). As we can see, there is an indirect jump to the address stored at 0x804a000

    in the preceding dissembled code output. This is a GOT (Global offset

    table) entry that holds the address of the actual gets() function in the libc

    shared library.


    However, the first time a function is called, its address has not been resolved

    by the dynamic linker, when the default behavior lazy linking is being used. Lazy

    linking implies that the dynamic linker should not resolve every function at program

    loading time. Instead, it will resolve the functions as they are called, which
    is

    made possible through the .plt and .got sections (which correspond to the

    Procedure linkage table, and the Global offset table, respectively). This behavior

    c be changed to what strict linking with the LD_BIND NOW environment

    variable that all dynamic linking happens right at program loading time. Lazy

    linking increases performance at load time, which is why it is the default behavior,

    but it can also be unpredictable if a linking error not occur until after the

    program has been running for some time. I have actually experienced this\myself
    time over the course of years. It is also worth noting that some security

    features, namely, read-only locations cannot be applied unless strict linking
    is

    enabled because the .plt.got section (among others) is read-only; this can

    only occur after the dynamic linker has finished patching it, and thus strict
    linking

    must be used.


    [ 42 ]'
