  md: "# Linux /proc/kcore Analysis\n\n# Kernel function trampolines\n\nThis technique\
    \ was originally introduced by Silvio Cesare in 1998. The idea was to modify syscalls\
    \ without to touching sys_call_table, but the truth is that this technique allows\
    \ any function in the kernel to be hooked. Therefore, it is very powerful. Since\
    \ 1998, a lot has changed; the kernel text segments can no longer be modified\
    \ by disabling the write-protect bit in cr0 or modifying a PTE. The main issue,\
    \ however, is that most kernels use SMP, and kernel function trampolines are unsafe\
    \ because they use non-atomic operations like memory() every time the patched\
    \ function is called. As it turns out, there are methods for circumventing this\
    \ problem well, using a technique that I will not discuss here. The real point\
    \ is that kernel function trampolines are actually still being used, and therefore\
    \ understanding them is still quite important.\n\nIt is considered a safer technique\
    \ to patch the individual call instructions that invoke the original function\
    \ so that they invoke the replacement function instead. This method can be used\
    \ as an alternative to trampolines, but it may be arduous to find every single\
    \ call, and this often changes from kernel to kernel. This method is not portable.\n\
    \n![](img/10a855ebad6fe689ed3447763aed6bf4_254_0.png)\n\n# Example of function\
    \ trampolines\n\nImagine you want to hijack syscall_write and do not want to worry\
    \ modifying sys_call_table directly since it is easily detectable. This can be\
    \ accomplished by overwriting the first 7 bytes of the sys_write code with a stub\
    \ that contains code for jumping to another function.\n\n# An example code for\
    \ hijacking sys_write on a 32-bit kernel\n\n```\n#define SYSCALL_NR  NR_write\n\
    \nstatic char syscall_code[7];\nstatic char new_syscall_code[7] = \n    \"\\x68\\\
    x00\\x00\\x00\\x33\"; // push $addr; ret\n\n// our new version of sys_write\n\
    int new_syscall(long fd, void *buf, size_t len)\n{\n    printk(KERN_INFO \"I am\
    \ the evil sys_write!\\n\");\n```"
