- img_proc: true
  md: '# The ELF Binary Format


    In this chapter, you will cover the following ELF topics:


    +   - ELF file types

    - Program headers

    - Section headers

    - Symbols

    - Relocations

    - Dynamic linking

    - Coding an ELF parser


    # ELF file types


    An ELF file may be marked as one of the following types:


    +   - ET_NONE: This is an unknown type. It indicates that the file type is unknown,
    or has not yet defined.

    - ET_REL: This is a relocatable file. ELF type relocatable means that the file
    is marked as a relocatable piece of code or sometimes called an object file. Relocatable
    object files are generally pieces of Position independent code (PIC) files that
    have not been linked into an executable. You will often see .o files in a compiled
    code base. These are the files that hold code and data suitable for creating an
    executable file.

    - ET_EXEC: This is an executable file. ELF type executable means that the file
    is marked as an executable file. These types of files are also called programs
    and are the entry point of how a process begins.

    - ET_DYN: This is a shared object. ELF dynamic means that the file is marked as
    a dynamically linkable object file, also known as shared libraries. These shared
    libraries are loaded and linked into a program''s image at runtime.

    - ET_CORE: This is an ELF type core that marks a core file. A core file is a dump
    of a full process image during the time of the program crash or when the process
    has delivered an SIGSEGV signal (segmentation violation). GDB can read these files
    and aid in debugging to determine what caused the program to crash.


    [ 10 ]'
  merge: -1
  pgno: 34
- img_proc: true
  md: "If we look at an ELF file with the command reread -h, we can view the initial\
    \ ELF file header. The ELF header starts at the 0 offset of an ELF file and serves\
    \ as a map to the rest of the file. Primarily, this header marks the ELF type,\
    \ the architecture, and the entry point where execution is to begin, and provides\
    \ offsets to the other types of ELF headers (section headers and program headers),\
    \ which will be explained in detail later. More of the file header will be understood\
    \ once we explain the meaning of section headers and program headers. Looking\
    \ at the ELF(5) man page in Linux shows us the ELF header structure:\n\n```\n\
    #define EI_NIDENT\nntypedef struct {\n    unsigned char e_ident[EI_NIDENT];\n\
    \    uint16_t e_type;\n    uint16_t e_machine;\n    uint32_t e_version;\n    ElFn_Addr\
    \ e_entry;\n    ElFn_Off e_phoff;\n    ElFn_Off e_shoff;\n    uint32_t e_flags;\n\
    \    uint16_t e_hsize;\n    uint16_t e_phentize;\n    uint16_t e_phnum;\n    uint16_t\
    \ e_shent;\n    uint16_t e_shnum;\n    uint16_t e_shstrndx;\n} Elf_Ehdr;\n```\n\
    \nLater in this chapter, we will see how to utilize the fields in this structure\
    \ to map out an ELF file with a simple C program. First, we will continue looking\
    \ at the other types of ELF headers that exist.\n\n# ELF program headers\n\nELF\
    \ program headers describe what segments within a binary and are necessary for\
    \ program loading. Segments are understood by the kernel during load time and\
    \ describe the memory layout of an executable on disk and how it should translate\
    \ to memory. The program header table can be accessed by referencing the offset\
    \ in the initial ELF header member called e_phoff (program header table offset),\
    \ as shown in the ElFn_Ehdr structure in display 1.7."
  merge: -1
  pgno: 35
- img_proc: true
  md: "# The ELF Binary Format\n\nThere are five common program header types that\
    \ we will discuss here. Program headers describe the segments of an executable\
    \ file (shared libraries included) and what type of segment it is (that is, what\
    \ type of data or code it is reserved for). First, let's take a look at the ELF32_Phdr\
    \ structure that makes up a program header entry in the program header table of\
    \ a 32-bit executable.\n\n![](img/10a855ebad6fe689ed3447763aed6bf4_36_0.png)\n\
    \nHere's the ELF32_Phdr structure:\n\n```\ntypedef struct {\n    uint32_t   p_type;\
    \      (segment type)\\n    Elf32_Off  p_offset;    (segment offset)\\n    Elf32_Addr\
    \ p_vaddr;     (segment virtual address)\\n    Elf32_Addr p_paddr;     (segment\
    \ physical address)\\n    uint32_t   p_filesize;   (size of segment in the file)\\\
    n    uint32_t   p_memz;     (size of segment in memory)\\n    uint32_t   p_flags;\
    \     (flags, I.E execute|read|write)\n    uint32_t   p_align;     (segment alignment\
    \ in memory)\n} ELF32_Phdr;\n```\n\n# PT_LOAD\n\nAn executable will always have\
    \ at least one PT_LOAD type segment. This type of program header is describing\
    \ a loadable segment, which means the segment is going to be loaded or mapped\
    \ into memory.\n\nFor instance, an executable with dynamic linking will generally\
    \ contain the following two loadable segments (of type PT_LOAD):\n\n+   - The\
    \ text segment for program code\n- And the data segment for global variables and\
    \ dynamic linking information\n\nThe preceding two segments are going to be mapped\
    \ into memory and aligned by the value stored in p_align. I recommend reading\
    \ the ELF man pages in Linux to understand all of the members in a Phdr structure\
    \ as they describe the layout of both the segments in the file as well as memory.\n\
    \n[ 12 ]"
  merge: -1
  pgno: 36
- img_proc: true
  md: 'Program headers are primarily there to describe the layout of a program for
    when it is executing and in memory. We will be utilizing Phdrs later in this chapter
    to demonstrate what they are and how to use them in reverse engineering software.


    > The text segment (also known as the code segment) will generally have segment
    permissions set to PF_X | PF_R (READ+EXECUTE).

    The data segment will generally have segment permissions set to PF_W | PF_R (READ).

    A file infected with a polymorphic virus might have changed these permissions
    in some way modifying the text segment to be writable by adding the PF_W flag
    into the program header''s segment (p_flags).


    # PT_DYNAMIC - Phdrs for the dynamic segment


    The dynamic segment is specific to executables that are dynamically linked and
    contains information necessary for the dynamic linker. This segment contains tagged
    values and pointers, including not limited to the following:


    +   - List of shared libraries that are to be linked at runtime

