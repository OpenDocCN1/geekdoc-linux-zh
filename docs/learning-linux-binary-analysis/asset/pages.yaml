    # ELF relocations


    From the ELF(5) man pages:


    > Relocation is the process of connecting symbolic references with symbolic definitions.
    Relocatable files must have information that describes how to modify their section
    contents, allowing executable and shared object files to hold the right information
    for a process''s image. Relocation entries are these data.


    The process of relocation relies on symbols and sections, which is why we covered
    symbols and sections first. In relocation, there are relocation records, which
    essentially contain information on how to patch the code related to a given symbol.
    Relocations are literally a mechanism for binary patching and hot-patching in
    memory when the dynamic linker is involved. The linker program: /bin/ld is used
    to create executable files, and shared libraries must have some type of metadata
    that describes how to patch instructions. This metadata is stored as we call relocation
    records. I will further explain relocations by using an example.'
