  md: '# Linux Process Tracing


    In 2011, I was awarded a contract by the DARPA CFT (Cyber Fast Track) program
    to design something called Linux VMA Monitor. The purpose of this software is
    to detect a wide range of known and unknown process memory infections, such as
    rootkits and memory-resident viruses.


    It essentially performs automated intelligent memory forensic analysis on every
    single process using special heuristics that understands ELF execution. It can
    spot anomalies or parasites, such as hijacked functions and generic code infections.
    The software can either analyze memory and work as a host intrusion detection
    system, or take snapshots of the process memory and perform an analysis on them.
    This software can also detect and disinfect ELF binaries that are infected with
    viruses on disk.


    ptrace system is used heavily in the software and demonstrates interesting code
    around the ELF binary and ELF runtime infections. I have not released the source
    code as I intend to provide a more production-ready version prior to the release.
    Throughout this text, we will cover almost all the infection types that Linux
    VMA Monitor can detect/disinfect, and we will discuss and demonstrate the heuristics
    used to identify these infections.


    For over a decade, hackers have been hiding complex malware within process memory
    to remain stealth. This may be a combination of shared library injection and GOT
    poisoning, or any other set of techniques. The chances of a system administrator
    finding these are very slim, especially since there is not a lot of software publicly
    available for detecting many of these attacks.


    I have released several tools, including but not limited to AVU and ECFS, of which
    can be found on GitHub and my website at http://bitkeys.org/. Whatever other software
    is in existence for such things is highly specialized and privately used, or it
    simply not exist at all. Meanwhile, a good forensic analyst can use a debugger
    or write custom software to detect such malware, and it is important to know what
    you are looking for and why. Since this chapter is all about ptrace, I wanted
    to emphasize how it is interrelated with forensic analysis. And it it is, and
    especially for those who are interested in designing specialized software for
    the purpose of identifying threats in memory.


    Towards the end of the chapter, we will see how to write a program to detect function
    trampolines in running software.'
