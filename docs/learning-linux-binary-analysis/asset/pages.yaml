  md: "# Code example – the __libc_dlopen_mode shellcode\n\nThe following code is\
    \ in C, but when compiled into machine code, it can be used as shellcode that\
    \ we inject into the process using ptrace:\n\n```\n#define RTLD_DLOPEN 0x08000000\
    \ //glibc internal dlopen flag\nemulates opener behaviour\n__PAYLOAD_KEYWORDS\
    \ void *dlopen_load_exec(const char *path,\n{\n    void (*libc_dlopen_mode)(const\
    \ char *, int) =\n        dlopen_addr;\n    void *handle = (void *)0xff; //initialized\
    \ for debugging\n    handle = libc_dlopen_mode(path,\n        RTLD_DLOPEN|RTLD_GLOBAL,\n\
    \        __RETURN_VALUE(handle);\n    BREAKPOINT;\n}\n```\n\nNotice that one of\
    \ the arguments is *dlopen_addr. Saruman locates the address to the __libc_dlopen_mode()\
    \ function, which resides in libc.so. This is accomplished using a function for\
    \ resolving symbols within the libc library.\n\n# Code example – libc symbol resolution\n\
    \nThere are many details to the following code, and I would highly encourage you\
    \ to check Saruman. It is specifically for injecting executable programs that\
    \ are compiled as ET_DYN objects, but as mentioned previously, the injection method\
    \ will also work for shared libraries unless they are also compiled as ET_DYN\
