  md: '# 6 ELF Binary Forensics in Linux


    The field of computer forensics is widespread and includes many facets of investigation.
    One such facet is the analysis of executable code. One of the most insidious places
    for a hacker to install some type of malicious functionality is within an executable
    file of some kind. In Linux, this is, of course, the ELF file type. We have already
    explored some of the infection techniques that are being used in Chapter 4, ELF
    Virus Technology – Linux/Unix Viruses, but have spent very little time discussing
    the analysis phase. How exactly should an investigator go about exploring a binary
    analysis for anomalies or code infections? What is this chapter is all about.


    The motives for an attacker infecting an executable vary greatly, and it may be
    for a virus, a botnet, or a backdoor. There are, of course, many cases where an
    individual wants to patch or modify a binary to achieve totally different ends
    such as binary protection, code patching, or other experimentation. Whether malicious
    or not, the binary modification methods are all the same. The inserted code is
    what determines whether or not the binary is possessed with malicious intent.


    In either case, this chapter will arm the reader with the insight necessary for
    determining whether or not a binary has been modified, and how exactly it has
    been modified. In the following pages, we will examine several different types
    of infections and discuss some of our findings when performing a real-world analysis
    of the Retaliation Virus for Linux that was engineered by one of the world''s
    most skilled Virus authors named jPanic. This chapter is all about training your
    eye to be able to spot anomalies within an ELF binary file, and with some practice
    it becomes quite possible to do so with.'
  merge: -1
  pgno: 165
- img_proc: true
  md: '# The science of detecting entry point modification


    When a binary is modified in some way, it is generally for the purpose of adding
    code to the binary and then redirecting execution flow to that code. The redirection
    of execution flow can happen in many places within the binary. In this particular
    case, we are going to examine a common technique used when patching binaries,
    especially for viruses. This technique is to simply modify the entry point, which
    is the e_entry member of the ELF file header.


    The goal is to determine whether or not e_entry is holding an address that points
    to a location that signifies an abnormal modification to the binary.


    > Abnormal means any modification that wasn''t created by the linker itself /usr/bin/ld
    whose job it is to link ELF objects together. The linker will create a binary
    that represents normality, whereas an unnatural modification often appears suspicious
    to the trained eye.


    The quickest route to being able to detect anomalies is to know what is normal.
    Let''s take a look at two normal binaries: one dynamically linked and the other
    statically linked. Both have been compiled with gcc and neither has been tampered
    with in any way:


    ```

    $ readelf -h bin | grep Entry Point

    Entry point address: 0x400520

    ```


    So we can see that the entry point is 0x400520. If we look at the section headers,
    we can see what this section appears into:


    ```

    readelf -S bin | grep 4005

    [13] .text PROGBITS 000000000400520 00000500

    ```


    > In our example, the entry point starts at the beginning of the .text section.
    This is not always so, and therefore grepping for the first significant hex-digits,
    as we did previously isnt a consistent approach. It is recommended that you check
    both the address and size of each section header until you find the section with
    an address range that contains the entry point.'
  merge: -1
  pgno: 166
- img_proc: true
  md: 'As we see, it points right to the beginning of the .text section, which is
    common, depending on how the binary was compiled and linked, this may change with
    each binary you look at. This binary was compiled so that it was linked to libc
    just like 99 percent of the binaries you encounter. This means that the entry
    point contains some special initialization code and it looks almost identical
    in every libc-linked binary, so let''s take a look at it so we know what to expect
    when analyzing the entry point code of binaries:


    ```

    $ objdump -d --section=.text bini

    ```


    ```

    00000000040520 <start>:

    040520:    31 ed               xor     %ebp,%ebp

    040522:    49 89 d1             mov     %rdx,%r9

    040525:    5e                   pop     %rsi

    040526:    48 89 e2             mov     %rsp,%rdx

    040529:    48 83 e4 00          and     $0xffffffff,%rsp

    04052d:    50                   push     %rax

    04052e:    54                   push     %rsp

    04052f:    49 c7 c0 20 07 04 00  mov     $0x0400720,$r8 // __libc_csu_finit

    040536:    48 c7 c0 c1 b0 06 04 00  mov     $0x04006d0,$rcx // __libc_csu_init

    04053d:    48 c7 c7 0d 06 04 00  mov     $0x040060d,$rdi // /(main())

    040544:    e8 87 ff ff ff          callq   4004d0 // call libc_start_main()

    ```


    The preceding assembly is the standard glibc initialization code pointed to e_entry
    of the ELF header. This code is always executed before main() and its purpose
    is to call the initialization routine libc_start_main():


    ```

    libc_start_main(void *)&main, &_libc_csu_finit);

    ```


    This function sets up the process heap segment, registers constructors and destructors,
    and initializes threading-related data. It calls main().


    Now that you know what the entry point looks like in libc-linked binary, you should
    be able to easily determine when the entry point address is suspicious, when it
    points to code that does not look like this, or when it is not even in the .text
    section at all!'
