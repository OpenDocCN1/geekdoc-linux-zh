    So, we have achieved the coding of simple debugging software that can both execute
    a program and trace it, or attach to an existing process and trace it. This demonstrates
    the most common type of cases for ptrace, and most other programs you use that
    ptrace will be variations of the techniques in the `tracer.c` code.


    # Advanced function-tracing software


    In 2013, I designed a tool that traces function calls. It is quite similar to
    `strace` and `ltrace`, instead of tracing `syscalls` or library calls, it traces
    every function call made from the executable. This tool was covered in Chapter
    2, The ELF Binary Format, but it is relevant to the topic of `ptrace`. This is
    because it is completely dependent on `ptrace` and performs some pretty wicked
    dynamic analysis using control flow monitoring. The source code can be found on
    GitHub:


    https://github.com/leviathansecurity/ftrace


    # ptrace () and forensic analysis


    The `ptrace()` command is the system call that is commonly used for memory analysis
    of a userland. In fact, if you are designing forensics software that runs in userland,
    the only way it can access other processes is through the `ptrace` system call,
    or by reading the `proc` filesystem (unless, of course, the program has some type
    of explicit shared memory IPC setup).


    > One may attach to a process and then open/lseek/read/write /proc/<pid>/mem as
    an alternative to ptrace read/write semantics.'
