  md: '# ELF virus engineering challenges


    The design phase of an ELF virus may be considered an artistic endeavor, requiring
    creative thinking and clever constructs; many passionate coders will agree with
    this. Meanwhile, it is a great engineering challenge that exceeds the regular
    conventions of programming, requiring the developer to think outside conventional
    paradigms and to manipulate the code, data, and environment into behaving a certain
    way. At one point in time, I did a security assessment at a large antivirus (AV)
    company for one of their products. While talking with the developers of the AV
    software, I was amazed that none of them had any real ideas of how to engineer
    a virus, let alone design any behaviour (for identifying other than signatures).
    The truth is that virus writing is difficult, and requires serious skill. There
    are a number of challenges that come into play when engineering them, and before
    we discuss the engineering components, let''s look at what some of these challenges
    are.


    # Parasite code must be self-contained


    A parasite must be able to physically exist inside another program. This means
    that it does not have the luxury of linking to libraries through the dynamic linker.
    The parasite must be self-contained, which means that it relies on no external
    linking, is position independent, and is able to dynamically calculate memory
    addresses within itself; this is because the addresses change between each infection,
    since the parasite will be injected into an existing binary where its position
    will change each time. This means that if the parasite code references a function
    or a string by its address, the hardcoded address will change and the code will
    fail; instead, use IP-relative code with a function that calculates the address
    of the code/data by its offset to the instruction pointer.


    > In some complex memory viruses such as Saruman virus, I allow the parasite to
    be compiled as an executable program with dynamic linking, but the code to launch
    it into a process address space is very complicated, because it must handle relocations
    and dynamic linking manually. There are also relocatable code injectors such as
    Quenya, which allow a parasite to be compiled as relocatable objects, but the
    infector must be able to support handling relocations during the infection phase.'
