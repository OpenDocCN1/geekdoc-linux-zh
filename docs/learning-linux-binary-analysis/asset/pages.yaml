    # The code obfuscation technique


    Code obfuscation (also known as code transformation) is a technique where

    assembly-level code is modified to include opaque branch instructions or misaligned

    structions that throw off the disassembler''s ability to read the bytecode correctly.

    Consider the following example:


    ```

    jmp antidebug + 1

    antidebug:

    .short 0xe9;first byte of a jump instruction

    mov $0x31337,%eax

    ```


    When the preceding code is compiled and viewed with the objdump disassembler,

    it looks like this:


    ```

    4: jmp 7 <antidebug+0x1>

    <antidebug:

    6: e9 00 b8 37 13 jmp 1337b80b

    b: 03 00 add (%rax),%eax

    ```


    The code is actually moving a $0x31337,%e operation, and functionally,

    it performs that correctly, but because there was a single 0xe9 before that, the

    disassembler perceived it as a jump instruction (since 0xe9 is the prefix for
    a jump).


    So, code transformation doesn''t change the way functions work, only how it

    looks. A smart disassembler as IDA would be fooled by the preceding code

    sppet, because it uses control flow analysis when generating the disassembly.


