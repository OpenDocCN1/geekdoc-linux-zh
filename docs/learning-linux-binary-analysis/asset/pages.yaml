    # ELF section headers


    Now that we''ve looked at what program headers are, it is time to look at section
    headers. I really want to point out here the distinction between the two; I often
    hear people calling sections, segments, and vice versa. A section is not a segment.
    Segments are necessary for program execution, and within each segment, there is
    either code or data divided into sections. A section table exists to reference
    the location and size of these sections and is primarily for linking and debugging
    purposes. Section headers are not necessary for program execution, and a program
    will execute fine without having a section table. That is because the section
    table doesn''t describe the program memory layout. That is the responsibility
    of the program header. The section headers are really just complimentary to the
    program headers. The readelf -l command will show which sections are mapped to
    segments, which helps to visualize the relationship between sections and segments.'
