    # # Using an ECFS file as a regular core file


    The ECFS core file format is essentially backward compatible with regular Linux
    core files, and can be used as core files for debugging with GDB in the traditional
    way.


    The ELF header for ECFS files has its e_type (ELF type) set to ET_NONE instead
    of ET_CORE, however. This is because core files are not expected to have section
    headers but ECFS files do have section headers, and to make sure they are acknowledged
    by certain utilities as objdump, objcopy, and so on, we have to mark them as files
    other than CORE files. The quickest way to toggle the ELF type in an ECFS file
    comes with the ECFS software suite.


    Here''s an example of using GDB with an ECFS core file:


    ```

    $ gdb -q /usr/sbin/sshd.1195

    Reading symbols from /usr/sbin/sshd....(no debugging symbols found)

    done.

    "/opt/ecfs/cores/sshd.1195" is not a core dump: File format not recognized

    (gdb) quit

    ```


    [ 221 ]'
