  md: '# Detecting the ET_DYN injection


    I think that the most prevalent type of process infection is DLL injection, also
    known as \`{.so` injection. It is a clean and effective solution that suits the
    needs of most attackers and runtime malware. Let''s take a look at an infected
    process, and I will highlight the ways in which we can identify parasite code.


    > The terms shared object, shared library, DLL, and ET_DYN are all used synonymously
    throughout this book, especially in this particular section.


    # Azazel userland rootkit detection


    Our infected process is a simple test program named `/.host` that is infected
    with the Azazel userland rootkit. Azazel is the newer version of the popular Jynx
    rootkit. Both of these rootkits rely on \`LD_PRELOAD` to load a malicious shared
    library that hijacks various `glibc` shared library functions. We will inspect
    the infected process using various GNU tools and the Linux environment, such as
    the \`/proc` filesystem.


    # Mapping the process address space


    The first step while analyzing a process is to map the address space. The most
    straightforward way to do this is by looking at `/proc/<pid>/maps file. We want
    to take note of any strange file mappings and segments with odd permissions. In
    our case, we may need to check the stack for environment variables, so we will
    want to take note of its location in memory.


    > The pmap <pid> command can also be used instead of `cat /proc/<pid>/maps`. I
    prefer looking directly at the maps file because it shows the entire address of
    each memory segment and the complete path of any file mappings, such as shared
    libraries.


    Here is an example of memory mappings of an infected process `/.host/maps`


    ```

    $ cat /proc/.host/maps

    04000000-00401000 r-xp 00000000 00:24 5553671      /home/user/git/azazel/host

    06000000-00601000 r--p 00000000 00:24 5553671      /home/user/git/azazel/host

    06011000-00602000 rw-p 00001000 00:24 5553671      /home/user/git/azazel/host

    066c0000-0068d000 rw-p 00000000 00: 0       [heap]

    ```'
