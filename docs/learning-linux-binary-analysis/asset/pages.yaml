  md: "Technically, we don't even have to know what this code does in order to know\
    \ that the GOT was hijacked because the GOT should only contain addresses that\
    \ point to the PLT, and this is clearly not a PLT address:\n\n```\n$ ./host\n\
    HAHA puts() has been hijacked!\n```\n\nA further exercise would be to disinfect\
    \ this binary manually, which is something we do in the ELF workshop trainings\
    \ I periodically. Disinfecting this binary would primarily entail patching the\
    \ .got.plt entry that contains the pointer to the parasite and replacing it with\
    \ a pointer to the appropriate PLT stub.\n\n# Detecting function trampolines\n\
    \nThe trampoline is used loosely but is originally referred to inline code patching,\
    \ where the insertion of a branch instruction as a jump is placed over the first\
    \ 5 to 7 bytes of the procedure prologue of a function. Often times, this trampoline\
    \ is temporarily replaced by the original code bytes if the function that was\
    \ patched needs to be called in such a way that it behaves as it originally, and\
    \ then the trampoline instruction is quickly placed back again. Detecting inline\
    \ code hooks such as these is quite easy and can be automated with some degree\
    \ of ease provided you have a program or script that can disassemble a binary.\n\
    \nFollowing are two examples of trampoline code (32-bit x86 ASM):\n\n+   * Type\
    \ 1:\n  movl $target, %eax\n  jmp %eax\n\n+   * Type 2:\n  push $target\n  ret\n\
    \nA good classic paper on using function trampolines for function hijacking in\
    \ kernel space was written by Silvio in 1999. The same concepts can be applied\
    \ today in userland and in the kernel; for the kernel you would have to disable\
    \ the cr0 to make the text segment writable, or directly modify a PTE to mark\
    \ a given page as writeable. I personally have had more success with the former\
    \ method. The original paper on kernel function trampolines can be found at http://vxheaven.org/lib/vsc08.html."
  merge: -1
