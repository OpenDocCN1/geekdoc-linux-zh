  md: '# PT_LOAD segments and the downsfalls of core files for forensics purposes


    Each memory segment contains a program header that describes the offset, address,
    and size of the segment it represents. This would almost suggest that you can
    access every part of a process image through the program segments, but this is
    only partially true. The text image of the executable and every shared library
    that is mapped to the process gets only the first 4,096 bytes of themselves dumped
    into a segment.


    This is for saving space and because the Linux kernel developers figured that
    the text segment will not be modified in memory. So, it suffices to reference
    the original executable file and shared libraries when accessing the text areas
    from the debugger. If a core file were to dump the complete text segment for every
    shared library, then for a large program such as Wireshark or Firefox, the output
    dump files would be enormous.


    So for debugging reasons, it is usually okay to assume that the text segments
    have not changed in memory, and just to reference the executable and shared library
    files themselves. But what about runtime malware analysis and process forensics?
    In many cases, the text segments have been marked as writeable and contain polymorphic
    engines for code mutation, and in these instances, core files may be useless for
    viewing the code segments.


    Also, if the core file is the only artifact available for analysis and the original
    executable and shared libraries are no longer accessible? This further demonstrates
    why core files are not particularly good for process forensics; nor were they
    meant to be.


    > In the next chapter, we will see how ECFS addresses many of the weaknesses that
    render core files a useless artifact for forensic purposes.


    # Using a core file with GDB for forensics


    Combined with the original executable file, and assuming that no code modifications
    were made (to the text segment), we can still use core files to show away for
    malware analysis. In this particular case, we are looking at a core file for the
    Azaz rootkit, which—as demonstrated earlier today—has PLT/GOT hooks:


    ```

    $ readelf -S host | grep got.plt

    [23] .got.plt PROGBITS 000000000601000 00001000

    $ readelf -r host

    ```'
