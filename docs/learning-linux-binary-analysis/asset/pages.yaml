  md: '# st_other


    This member defines the symbol visibility.


    # st_shndx


    Every symbol table entry is defined in relation to some section. This member holds
    the relevant section header table index.


    # st_info


    The st_info specifies the symbol type and binding attributes. For a complete list
    of these types and attributes, consider the ELF(5) man page. The symbol types
    start with STT whereas the symbol bindings start with STB. As an example, a few
    ones are explained in the next sections.


    # Symbol types


    We''ve got the following symbol types:


    +   * ST_NOTYPE: The symbol types are undefined

    * ST_FUNC: The symbol is associated with a function or other executable code

    * ST_OBJECT: The symbol is associated with a data object


    # Symbol bindings


    We''ve got the following symbol bindings:


    +   * ST_LOCAL: Local symbols are not visible outside the object file containing
    their definition, such as a function declared static.

    * ST_GLOBAL: Global symbols are visible to all object files being combined. One
    file''s definition of a global symbol will satisfy another file''s undefined reference
    to the same symbol.

    * ST_WEAK: Similar to global binding, but with less precedence, meaning that the
    binding is weak and can be overridden by another symbol (with the same name) that
