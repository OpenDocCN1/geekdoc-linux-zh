  md: '# Linux /proc/kcore Analysis


    The techniques listed here are the primary methods that are commonly used by a
    kernel rootkit, which usually infects the kernel in the form of an LKM (short
    for Loadable Kernel Module). Getting an understanding of each technique and knowing
    where each resides within the Linux kernel and where to look in the memory is
    paramount to being able to detect this insidious class of Linux malware. Firstly,
    let''s take a step back and see what we have to work with. Currently, there are
    a number of tools in the market and in searches for memory infections in the open
    source world that are capable of detecting kernel rootkits and helps for searches.
    We will not be discussing these. We, however, be discussing methods that are taken
    from kernel Voodoo. Kernel Voodoo is a project of mine that is still private,
    with the exception of releasing few components of it to the public, such as taskverse.
    This will be discussed later in this chapter, with a link to download it. It uses
    some very practical techniques for detecting almost any type of kernel infection.
    From my original work, named Kernel Detective, which was designed in 2009, and
    for the curious, it can still be found on my website at http://www.bitkeys.org/#kerneldetective.


    This software works on older 32-bit Linux kernels (2.6.0 to 2.6.32); only 64-bit
    support was only partially completed. Some of the ideas from this project were
    timeless, and I extracted them recently and coupled them with some new ideas.
    The result is Kernel Voodoo, a host intrusion detection system, and kernel forensics
    software that relied on /proc/kcore for advanced memory acquisition and analysis.
    In this chapter, we are going to discuss some of the fundamental techniques that
    it uses, and in some cases, we will employ them manually with GDB and /proc/kcore.


    # stock vmlinux has no symbols


    Unless you have compiled your own kernel, you will not have a readily accessible
    vmlinux, instead you will have a compressed kernel in /boot, usually named vmlinux-kernel-version.
    This compressed kernel image can be decompressed, but the result is a kernel that
    has no symbol table. This poses a problem for forensics analysts or kernel debugging
    with GDB. The solution for most people in this case is to hope that their Linux
    distribution has a special package with their kernel version having debug symbols.
    If so, then they can download a copy of their kernel that has symbols from the
    distribution repository. In many cases, however, this is not possible, or not
    convenient for one reason or another. Nonetheless, this problem can be remedied
    with a custom utility that I designed and released in 2014. This tool is called
    kdress, because it dresses the kernel symbol table.'
