- img_proc: true
  md: '# Checking timing delays between certain instructions


    Another technique that can sometimes cause instability in the emulator itself
    checking the timestamps between certain instructions and seeing how long the execution
    took. A real CPU should execute a sequence of instructions several magnitudes
    faster than an emulator.


    # Obfuscation methods


    A binary can be obfuscated or encrypted in many creative ways. Most binary protectors
    simply protect the entire binary with one or more layers of protection. At runtime,
    the binary is decrypted and can be dumped from the memory to acquire a copy of
    the unencrypted binary. In more advanced protectors, such as Maya, every single
    function is encrypted individually, and allows only a single function to be decrypted
    at any time.


    Once a binary is encrypted, it must, of course, store the encryption keys somewhere.
    In the case of Maya (discussed earlier), a custom heap implementation that uses
    encryption to store encryption keys was designed. At some point, it would seem
    that a key has to be exposed (such as the key to decrypt another key), but special
    techniques such as white-box cryptography can be used to make these final keys
    extremely obfuscated. If assistance from the kernel is used in a protector, then
    it is possible to store the key outside of the binary and process memory completely.


    Code obfuscation techniques (such as false disassembly, which was described in
    Chapter 4, ELF Virus Technology – Linux/Unix/Viruses) are also commonly used in
    binary protection to make static analysis more difficult for code that has been
    decrypted or is never encrypted. Binary protectors also usually strip the section
    header table from a binary and remove any unneeded strings and string tables from
    it, such that give symbol names.


    # Protecting control flow integrity


    A protected binary should aim to protect the program during runtime (the binary
    itself) just much as as – if not – the binary at rest on the disk. Runtime attacks
    can be generally classified into two types:


    +   * Attacks based on ptrace

    * Vulnerability-based attacks'
