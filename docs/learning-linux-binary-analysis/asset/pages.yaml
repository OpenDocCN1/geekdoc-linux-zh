    There are many important tags that are necessary for the dynamic linker to navigate
    the binary at runtime to resolve relocations and load libraries. Notice the tag
    called `NEEDED` is highlighted in the preceding code. This is the dynamic entry
    that tells the dynamic linker which shared libraries it needs to load into memory.
    The dynamic linker will search for the named shared library in the paths specified
    by the `LD_LIBRARY_PATH` environment variable.


    It is conceivably feasible for an attacker to add a `NEEDED` entry into the binary
    by specifying a shared library to load. This is not a very common technique in
    my experience, but it is a technique that can be used tell the dynamic linker
    to whichever library you want. The problem for analysts is that this technique
    is difficult to detect if it is done correctly, which is to say that the inserted
    `NEEDED` entry is inserted directly after the last legitimate `NEEDED` entry.
    This can be difficult because you have to move all of the other dynamic entries
    forward to make room for your insertion.'
