  md: '# Debug register rootkits – DRR


    This type of rootkit uses the Intel Debug registers as a means to hijack the control
    flow. A great Phrack paper was written by halfdead on this technique. It is available
    here:


    ```

    http://phrack.org/issues/65/8.html.

    ```


    This technique is often hailed as ultra-stealth because it requires no modification
    of sys_call_table. Once again, however, there are ways of detecting this type
    of infection as well.


    # Detecting DRR


    In many rootkit implementations, sys_call_table and other common infection points
    go unmodified, the int1 handler does not. The instruction to the do_debug function
    gets patched to call an alternative do_debug function, as shown in the phrack
    paper linked earlier. Therefore, detecting this type of rootkit is often simple
    as disassembling the int1 handler and looking at the offset of the call do_debug
    instruction, as follows:


    ```

    target_address = address_of_call + offset + 5

    ```


    If target_address has the same value as the do_debug address found in Systemmap
    /proc/kallsyms, it means that the int1 handler has not been patched and is considered
    clean.


    # VFS layer rootkits


    Another classic and powerful method of infecting the kernel is by infecting the
    kernel''s VFS layer. This technique is wonderful and quite stealthy because it
    technically modifies the data segment in the memory and not the text segment,
    where discrepancies are easier to detect. The VFS layer is very object-oriented
    and contains a variety of structs with function pointers. These function pointers
    are filesystem operations such as open, read, write, readdir, and so on. If an
    attacker can patch these function pointers, then they can take control of these
    operations in any way they see fit.'
