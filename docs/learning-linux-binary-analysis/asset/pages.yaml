    As we see from the preceding output, we have verified that LD_PRELOAD was used
    to preload liblinux.so into the process. This means that any glibc functions within
    the program that have the same name as functions in the preloaded shared library
    will be overridden and effectively hijacked by the ones in liblinux.so.


    In other words, if the /host program calls the fopen function from glibc and liblinux.so
    contains its version of fopen, then the fopen function that will be stored in
    the PLT/GOT (the .got section) is used instead of the glibc version. This leads
    us to the next item—detecting function hijacking in the PLT/GOT (the PLT''s global
    offset table).


    # Detecting PLT/GOT hooks


    Before checking the PLT/GOT in the ELF section called .got.plt (which is in the
    data segment of the executable), let''s see which functions in the /host program
    have relocations from the chapter on the /host internals that the ELF entries
    have the relocation entries for the global offset table are of the <ARCH>-JUMP_SLOT
    type. Refer to the ELF(5) manual for details.


    > The relocation type for the PLT/GOT is called <ARCH>-JUMP_SLOT because they
    are just—jump function pointers that the PLT uses with imp instructions to transfer
    control to the destination function. Actual relocation types are named X86_64_JUMP_SLOT,
    1386_JUMP_SLOT, and so on depending on the architecture.


    ![](img/10a855ebad6fe689ed3447763aed6bf4_202_0.png)


    Here''s an example of identifying shared library functions:


    ```

    $ readelf -r host

    Relocation section ''.rela.plt'' at offset 0x418 contains 7 entries:

    00000601018 00100000007 R_X86_64_JUMP_SLO 0000000000000000 unlink + 0

    00000601020 000200000007 R_X86_64_JUMP_SLO 0000000000000000 puts + 0

    ```


