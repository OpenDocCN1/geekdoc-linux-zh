  md: '# Executable memory mappings


    The first lines are the memory mappings for the executable itself. This is quite
    obvious because it shows the executable path at the end of the file mapping:


    ```

    00400000-04010000 r-xp 00000000 001b 8126525 /home/ryan/hello_world

    00600000-06010000 r--p 00000000 001b 8126525 /home/ryan/hello_world

    00601000-00602000 rw-p 00001000 001b 8126525 /home/ryan/hello_world

    ```


    We can see that:


    +   - The first line is the text segment, which is easy to tell because the permissions
    are read past execute

    - The second line is the first part of the data segment, which has been marked
    read-only due to RELRO (read-only relocation) security protection

    - The third mapping is the remaining part of the data segment that is still writable


    # The program heap


    The heap is typically grown right after the data segment. Before ASLR existed,
    it was extended from the end of the data segment address. Nowadays, the heap segment
    is randomly-mapped, but it can be found in the maps file after the end of the
    data segment:


    ```

    017e4f00-0176f000 rw-p 00000000 00:00 0 [heap]

    ```


    There are also anonymous memory mappings that may be created when a call to malloc()
    requests a chunk of memory that exceeds MMAP_THRESHOLD in size. These types of
    anonymous memory segments will not be marked with the [heap] label.


    # Shared library mappings


    The next four are the memory mappings for the shared library, libc-2.19.so. Notice
    that there is a memory mapping marked with no permissions between the text and
    data segments. This is simply for occupying space in the area that so no other
    binary memory mappings may be used to create the space and data segments:


    ```

    fed9c5a7000-fed9c762000 r-xp 00000000 08:01 11406096 /lib/x86_64-linux-gnu/libc-2.19.so

    fed9c762000-fed9c961000 r--p 001be000 08:01 11406096 /lib/x86_64-linux-gnu/libc-2.19.so

    fed9c961000-fed9c965000 r--p 001ba000 08:01 11406096 /lib/x86_64-linux-gnu/libc-2.19.so

    fed9c965000-fed9c967000 rw-p 001be000 08:01 11406096 /lib/x86_64-linux-gnu/libc-2.19.so

    ```'
