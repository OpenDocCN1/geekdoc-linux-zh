  md: 'As we will see in the following chapter, ECFS technology for process memory
    forensics has some features that make identifying injected DLLs and other types
    of ELF objects almost simple.


    # ET_DYN injection internals


    As we just demonstrated, detecting shared libraries that have been preloaded with
    LD_PRELOAD is rather simple. What about shared libraries that were injected into
    a remote process? Or in other words, shared objects that were inserted into a
    pre-existing process? It is important to know whether or not a shared library
    was maliciously injected if we will be able to take the next step and detect PLT/GOT
    hooks. First, we must identify all the ways in which a shared library can be injected
    into a remote process, or as we briefly discussed in section 7.2.2.


    Let''s look at a concrete example of how this might be accomplished. Here is some
    example from Saruman that inject PIE executables into a process.


    +   PIE executables are in the same format as shared libraries, so the same code
    will work for the injection of any type into a process.


    Using the readelf utility, we can see that in the standard C library (libc.so.6),
    there exists a function named libc_dlopen_mode. This function actually accomplishes
    the same thing as the dlopen function, which is not resident in libc. This means
    that with any process that uses libc, we can get the dynamic linker to load whatever
    ET_DYN object we want to, while also automatically handling all the relocation
    patches.


    # Example – finding the symbol for __libc_dlopen_mode


    It is rather common for attackers to use this function to load ET_DYN objects
    into a process:


    ```

    $ readelf -s /lib/x86_64-linux-gnu/libc.so.6 | grep dlopen

    2128: 0000000000136160 146 FUNC GLOBAL DEFAULT 12 __libc_dlopen_mode@GLIBC_PRIVATE

    ```'
