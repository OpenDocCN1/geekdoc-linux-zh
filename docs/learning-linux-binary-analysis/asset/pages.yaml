  md: '# Linux /proc/kcore Analysis


    # Detecting interrupt handler patching


    To detect the system_call() routine has been patched with a call to a phony sys_call_table
    or not, simply disassemble the code with GDB and /proc/kcore, and then find out
    or not the call offset points to the address of sys_call_table. The correct sys_call_table
    address can be found in System.map or /proc/kallsyms.


    # Kprobe rootkits


    This particular type of kernel rootkit was originally conceived and described
    in great detail in a 2010 Phrack paper I wrote. The paper can be found at http://phrack.org/issues/67/6.html.


    This type of kernel rootkit is one of the more exotic beasts in that it uses the
    Linux kernels Kprobe hooking to set breakpoints on the kernel function that the
    rootkit is attempting to modify. This particular technique has its limitations,
    but it can be quite powerful and stealthy. However, just like any of the other
    techniques, if the analyst knows what to look for, then the kernel rootkits that
    use kprobes can be easy to detect.


    # Detecting kprobe rootkits


    Detecting the presence of kprobes by analyzing memory is quite easy. When a regular
    kprobe is set, a breakpoint is placed on either the entry point of a function
    (see kprobes) or on an arbitrary instruction. This is extremely easy to detect
    by scanning the entire code segment looking for breakpoints, as there is no reason
    a breakpoint should be placed in the kernel code other than for the sake of kprobes.
    For the case of detecting optimized kprobes, a jump instruction is used instead
    of a breakpoint (int3) instruction. This would be easiest to detect when jump
    is placed on the first byte of a function, since that is clearly out of place.
    Lastly, there is simple list of active kprobes in /sys/kernel/debug/kprobes/list
    that actually contains a list of kprobes that are being used. However, any rootkit,
    including the one I demonstrated in phrack, will hide its kprobes from the file,
    so do not rely on it. A good rootkit will also prevent kprobes from being disabled
    in /sys/kernel/debug/kprobes/enabled.


    [ 234 ]'
