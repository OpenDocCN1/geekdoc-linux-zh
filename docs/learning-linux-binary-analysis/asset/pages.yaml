  md: '# Process Memory Forensics


    +   - VDSO manipulation. As we have already demonstrated, this technique can be
    used to execute arbitrary syscalls, and therefore it can be simple to memory-map
    a shared object with this method.


    +   - Shellcode that directly invokes the open and mmap calls.


    +   - The DT_NEEDED entries can be added by an attacker by overwriting the DT_NULL
    tag in the dynamic segment of an executable or shared library, thus being able
    to tell the dynamic linker to load whatever shared object they wish. This particular
    method was discussed in Chapter 6, ELF Binary Forensics in Linux, and it falls
    more into the topic of that chapter, but it may also be necessary when inspecting
    a suspicious process.


    > Be sure to inspect the binary of a suspicious process, and verify that the dynamic
    segment doesn''t appear suspicious. Refer to the Checking for DLL injection traces
    section of Chapter 6, ELF Binary Forensics in Linux.


    Now that we have a clear definition of legitimate versus illegitimate loading
    of shared objects, we can get into the discussion of heuristics for detecting
    when a shared library is legitimate or not.


    Beforehand, it is worth noting again that LD_PRELOAD is commonly used for good
    as well as bad purposes, and the only sure-fire way of knowing this is by inspecting
    what the actual code resides in the preloaded shared object does. Therefore, we
    will leave LD_PRELOAD out of the discussion on heuristics here.


    # Heuristics for .so injection detection


    In this section, I will describe the general principles behind detecting whether
    a shared library is legitimate or not. In Chapter 8, ECFS – Extended Core File
    Snapshot Technology, we will be discussing the ECFS technology, which actually
    incorporates these heuristics into its feature set.'
