    # # ELF virus detection and disinfection


    Detecting viruses can be very complicated, let disinfecting them. Our modern AV
    software is quite a joke and is very ineffective. Standard AV software uses scan
    strings, which are signatures, to detect a virus. In other words, if a known virus
    has the string `h4h.infect+1` at a given offset within the binary, then the AV
    software would see that it is present in its database and flag it infected. This
    is very ineffective in the long run, especially since viruses are constantly mutating
    into new strains.


    Some AV products are known to use emulation for dynamic analysis that can feed
    the heuristics with information about an executable''s conduct during runtime.
    Dynamic analysis can be powerful, but it is known to slow. Some breakthroughs
    in dynamic malware unpacking and classification have been made by Silvio Cesare,
    but I am not certain whether this technology is being used in the mainstream.


    Currently, there exists a very limited amount of software for detecting and disinfecting
    ELF binary entries. This is probably because a more mainstream market does not
    exist and a lot of these attacks are somehow still underground. There is no doubt,
    though, that hackers are using these techniques to hide backdoors and maintain
    a stealthy residence on compromised systems. Currently, I am working on a project
    Arcana, which can detect and disinfect many types of ELF binary entries, including
    executables, shared libraries, and kernel drivers, and it is also capable of using
