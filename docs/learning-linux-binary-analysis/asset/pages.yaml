    # ECFS reference guide


    The ECFS file format is simple and complicated! The ELF file format is complex
    in general, and ECFS inherits its complexities from a structural point of view.
    On the other side of the token, ECFS helps make navigating a process image easy
    if you know specific features it has and what to look for.


    In previous sections, we gave some real-life examples of utilizing ECFS that demonstrated
    many of its primary features. However, it is also important to have a simple and
    direct reference to those characteristics we are, such as which custom sections
    and exactly what they mean. In this section, we will provide a reference for the
    ECFS snapshot files.


    # ECFS symbol table reconstruction


    The ECFS handler uses advanced understanding of the ELF binary format and the
    dwarf debugging format–specifically with the dynamic segment and the GNU_EH_FRAME
    segment– to fully reconstruct symbol tables of the program. Even if the original
    binary has been stripped and has no section headers, the ECFS handler is intelligent
    enough to rebuild the symbol tables.


    I have never encountered a situation where symbol table reconstruction failed
    completely. It usually reconstructs all or most symbol table entries. The symbol
    tables can be accessed using a utility such as `readelf` or `readsecs`. The libelfcs
    API has several functions:


    ```

    int get_dynamic_symbols(ecfs_elf_t *desc, ecfs_sym_t **syms)

    int get_local_symbols(ecfs_elf_t *desc, ecfs_sym_t **syms)

    ```


    One function gets the dynamic symbol table and the others gets the local symbol
    table–dynysym and .symtab, respectively.'
