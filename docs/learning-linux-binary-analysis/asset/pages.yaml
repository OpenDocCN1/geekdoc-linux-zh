  md: '# Burneye by Scut – 2002


    Burneye is by many to have been the first example of decent binary encryption
    in Linux. By today''s standards, it would be considered weak, but it nevertheless
    brought some innovative features to the table. This includes three layers of encryption,
    the third of which is a password-protected layer.


    The password is converted into a type of hash-sum and then used to decrypt the
    outermost layer. This means that unless the binary is given the correct password,
    it will never decrypt. Another layer, called a fingerprint layer, can be used
    instead of the password layer. This feature creates a key out of an algorithm
    that fingerprints the system that the binary was protected on, and prevents the
    binary from being decrypted on any other system but the one it was protected.


    There was also a self-destruct feature; it deletes the binary after it is once.
    One of the primary things that separated Burneye from other protectors was that
    it was the first to use the underlie technique to wrap binaries. Technically,
    this was first done by John Resier for the UPX packer, but UPX is more of a binary
    compressor than a protector. John allegedly passed on the knowledge of userland
    to Scut, another mentioned in the Phrack S8 article written by Scut and Grugg
    on ELF binary protection at http://phrack.org/issues/58/5.html. This article describes
    the inner workings of Burneye and is highly recommended for reading.


    > A tool named objobf, which stands for object obfuscator, was also designed by
    Scut. This tool obfuscates the ELF32 ET_REL (object file) so that the code is
    very difficult to disassemble but is functionally equivalent. With the use of
    techniques such as opaque branches and misaligned execute, this can be effective
    in detecting static analysis.


    # Shiva by Neil Mehta and Shawn Clowes – 2003


    Shiva was probably the best publicly available of Linux binary protection. The
    source code was never released–only the protector was–but several presentations
    were delivered at various conferences, such as Blackhat USA, by the authors. These
    revealed many of its techniques.


    Shiva works for 32-bit ELF executables and provides a complete runtime engine
    (not just a decryption stub) that assists decryption and anti-debugging features
    throughout the duration of the process that it is protecting. Shiva provides three
    layers of encryption, where the innermost layer never fully decrypts the executable.
    It decrypts 1,024-byte blocks at a time and then re-encrypts.'
