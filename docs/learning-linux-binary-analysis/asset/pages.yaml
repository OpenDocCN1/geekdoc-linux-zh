    original instruction pointer and registers and then resume execution at that point
    the shellcode has run. In our case, we just let the shellcode print a string and
    then exit the entire program.


    Most hackers inject shared libraries or relocatable code into a process address
    space. The idea of injecting complex executables into a process address space
    is a technique that I''ve never seen before, other than with my experimentation
    and implementations.


    > A good example of injecting complex programs into a process space can be found
