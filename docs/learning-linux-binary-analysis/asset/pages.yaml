  md: "# The ELF Binary Format\n\nImagine having two object files linked together\
    \ to create an executable. We have obj1.o that contains the code to call a function\
    \ named foo() that is located in obj2.o. Both obj1.o and obj2.o are analyzed by\
    \ the linker program and contain relocation records that may be linked to create\
    \ a fully working executable program. Symbolic references will be resolved into\
    \ symbolic definitions, but what does that even mean? Object files are relocatable,\
    \ which means that it is code that is meant to be relocated to a location given\
    \ an address within an executable segment. Before the relocation process happens,\
    \ the code has symbols and code that will not properly function or cannot be referenced\
    \ without knowing their location in memory. These must be patched after the position\
    \ of the instruction or symbol within the executable segment is known by the linker.\n\
    \nLet's take a look at a 64-bit relocation entry:\n\n```\ntypedef struct {\n \
    \   Elf64_Addr r_offset;\n    uint64_t r_info;\n} Elf64_Rel;\n```\n\nAnd some\
    \ entries require an addend:\n\n```\ntypedef struct {\n    Elf64_Addr r_offset;\n\
    \    uint64_t r_info;\n    int64_t r_addend;\n} Elf64_Rela\n```\n\nThe r_offset\
    \ points to the location that requires the relocation action. A relocation action\
    \ describes the details of how to patch the code or data contained at r_offset.\n\
    \nThe r_info gives both symbol table index with respect to the relocation must\
    \ be made and the type of relocation to apply.\n\nThe relocation records for 32-bit\
    \ ELF files are the same as 64-bit, but use 32-bit integers. The following example\
    \ for object file code will be compiled as 32-bit so that we demonstrate implicit\
    \ addends, which are not commonly used in 64-bit. An implicit addend occurs when\
    \ the relocation records are stored in ELFN_Rel type structures that don't contain\
    \ an r_addend and therefore the addend is stored in the relocation target itself.\
    \ The 64-bit executables tend to use the ELFN_Rela structs that contain an explicit\
    \ addend. I think it is worth understanding why implicit addends are a little\
    \ more confusing, but it makes sense to bring light to this area."
