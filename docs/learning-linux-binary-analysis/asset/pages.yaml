- img_proc: true
  md: 'The quickest way to detect trampolines is to locate the entry point of every
    single function and verify that the first 5 to 7 bytes of code do not translate
    to some type of branch instruction. It would be easy to write a Python script
    for GDB that can do this. I have written C code to do this in the past fairly
    easily.


    # Identifying parasite code characteristics


    We reviewed some common methods for hijacking execution flow. If you can identify
    the execution flow points, you can typically identify some or all of the parasite
    code. In the section Detecting PLT/GOT hooks, we determined the location of the
    parasite code for the hijacked `put()` function by simply locating the PLT/GOT
    entry that had been modified and seeing what address pointed to, which, in that
    case, was to an appended page containing parasite code.


    Parasite code can be qualified as code that is unnaturally inserted into the binary;
    in other words, it wasn''t linked in the actual ELF object linker. With that said,
    there are several characteristics that can be attributed to injected code, depending
    on the techniques used.


    **Position independent code (PIC)** is often used for parasites so that it can
    be injected into any point of a binary or memory and still execute properly regardless
    of its position. PIC parasites are easier to inject into an executable because
    the code can be inserted into the binary without having to consider handling relocations.
    In some cases, such as with my Linux padding Virus http://www.bitlackskeys.org/projects/lpv.c,
    the parasite is compiled as an executable. It is not compiled as position independent
    itself, but it has no lib linking, and special care is taken within the parasite
    code to dynamically resolve memory addresses with instruction-pointer relativistic
    computations.


    In many cases, the parasite code is written purely in assembly language and is
    therefore in a more sensible ideal as a potential parasite since it will look
    different from what the compiler produces. One of the giveaways with parasite
    code written in assembly is the way in which syscalls are handled. In C code,
    typically syscalls are called through lib functions that will invoke the actual
    syscall. Therefore, syscalls look just like regular dynamically linked functions.
    In handwritten assembly code, syscalls are usually invoked using either the Intel
    sysenter or syscall instructions, and sometimes even `int 0x80` (which is considered
    legacy). If syscall instructions are present, we may consider it a red flag.'
