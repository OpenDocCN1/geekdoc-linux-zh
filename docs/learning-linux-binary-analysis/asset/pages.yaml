- img_proc: true
  md: '# Process Memory Forensics


    In the previous chapter, we examined the key methods and ways to approach the

    analysis of an ELF binary in Linux, especially when concerning malware, and ways

    detect the presence of a parasite within executable code.


    Just as an attacker may patch a binary on disk, they may also patch a running

    program in memory to achieve similar goals, while avoiding being detected by

    programs that look for file modification, such as a tripwire. This sort of hot
    patching

    of a process image can be used to hijack functions, inject shared libraries, execute

    parasite needed for memory-resident backdoors, viruses, key loggers, and hidden
    processes.


    > An attacker can run sophisticated programs that will run cloaked

    within an existing process address space. This has been demonstrated

    with Saruman v0.1, which is available at http://www.bitlackacks.

    org#saruman.


    The examination of a process image when performing forensics or runtime analysis

    is rather similar to looking at a regular ELF binary. There are more segments
    and

    overall moving pieces in a process address space, and the ELF executable will

    undergo some changes, such as runtime relocations, segment alignment, and

    bss expansion.


    However, in reality, the investigation steps are very similar for an ELF executable

    an an actual running program. The running program was initially created by the

    ELF images that are loaded into the address space. Therefore, understanding the

    ELF format will help understand how a process looks in memory.'
  merge: -1
  pgno: 193
- img_proc: true
  md: '# What does a process look like?


    One important on any Linux system is the /proc/$pid/maps file. This file shows
    the entire process address space of a running program, and it is something that
    I often parse in order to determine the location of certain files or memory mappings
    within a process.


    On kernels that have the Grsecurity patches, that if enabled, will zero out the
    /proc/$pid/maps file so you cannot see the address space. This makes parsing a
    process from the outside a bit more difficult, and you must rely on other techniques
    such as parsing the ELF headers and going from here.


    > In the next chapter, we will be discussing the ECFS Extended Core File Snapshot,
    which is a new ELF file format that expands on regular core files and contains
    an abundance of forensics-relevant data.


    Here''s an example of the process memory layout of the hello_world program:


    ```

    $ cat /proc/$pid/maps

    00000000-00410000 r-xp 00000000 00:1b /home/ryan/hello_world

    00600000-00610000 r--s-- 00000000 01:0b /home/ryan/hello_world

    00610000-00620000 rw-p 00000000 01:0b /home/ryan/hello_world

    0174e000-0176f000 r-s-- 00000000 00:00 [heap]

    7fd3dc9c5a700-7fd3dc9c76200 r-xp 00000000 08:01 1406096 /lib/x86_64-linux-gnu/libc-2.19.so

