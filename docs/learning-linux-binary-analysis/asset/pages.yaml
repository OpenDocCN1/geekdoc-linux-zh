  md: '# Chapter 6


    This output is extremely suspicious for several reasons. Typically, we only see
    two LOAD segments with one ELF executable—one for the text and one for the data—although
    this is not a strict rule. Nevertheless, it is the norm, and this binary showing
    three segments.


    Moreover, this segment is suspiciously marked RWE (read + write + execute), which
    indicates self-modifying code, commonly used with viruses that have polymorphic
    engines as this one. The entry point, points inside this segment, when it should
    be pointing to the first segment (the text segment), which, as we can see, starts
    at the virtual address 0x400000, which is the typical segment address for executables
    on Linux x86_64. We don''t even have to look at the code to be fairly confident
    that this binary has been patched.


    But for verification, if you are designing code that performs automated analysis
    of binaries, you can check the code at the entry point and see if it matches what
