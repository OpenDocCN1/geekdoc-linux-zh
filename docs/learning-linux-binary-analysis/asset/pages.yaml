  md: "The following is a summary of what we have just covered:\n\n+   1. Call fgets@PLT\
    \ (to call the fgets function).\n\n+   2. PLT code does an indirect jmp to the\
    \ address in the GOT.\n\n+   3. The GOT entry contains the address that points\
    \ back into PLT at the push instruction.\n\n+   4. The push $0x instruction pushes\
    \ the offset of the fgets() GOT entry onto the stack.\n\n+   5. The final fgets()\
    \ PLT instruction is a jump to the PLT-0 code.\n\n+   6. The first instruction\
    \ of PLT-0 pushes the address of GOT[1] onto the stack that contains an offset\
    \ into the link_map struct for fgets().\n\n+   7. The second instruction of PLT-0\
    \ is a jump to the address in GOT[2] that handles the dynamic linker's d1_runtime_resolve(),\
    \ which handles the relocation by adding the symbol value (memory address) R_386_JUMP_SLOT\
    \ of fgets() to its corresponding GOT entry in the .plt section.\n\nThe next time\
    \ fgets() is called, the PLT entry will jump directly to the function rather than\
    \ having to perform the relocation procedure again.\n\n# # The dynamic segment\
    \ revisited\n\nI earlier referenced the dynamic segment as a section named .dynamic.\
    \ The dynamic segment has a section header referencing it, but it also must be\
    \ found during runtime by the dynamic linker; since section headers dont get loaded\
    \ into memory, there has to be an associated program header for it.\n\nThe dynamic\
    \ segment contains an array of structs like ElfN_Dyn:\n\n```\ntypedef struct {\n\
    \    Elf32_Sword      d_tag;\n    union {\n        Elf32_Word d_val;\n       \
    \ Elf32_Addr d_ptr;\n    } d_un;\n} Elf32_Dyn;\n```\n\nThe d_tag field contains\
    \ a tag that matches one of the numerous definitions that can be found in the\
    \ ELF(5) man pages. I have listed some of the most important ones used by the\
    \ dynamic linker."
