    I

    be surprised if it hasn''t been used somewhere. The idea behind this uses the

    knowledge we have gained about the ELF strings for symbol names and section

    headers. Tools such as objdump and gdb (often used in reverse engineering) rely
    on

    the string table scrambles the order of the name of each symbol and section within
    an ELF file. This

    technique that section headers will be all mixed up (or appear to be) and so will
    the names of

    functions and symbols.'
