  md: '# Linux /proc/kcore Analysis


    This code replaces the first 6 bytes of sys_write with a push; ret stub,

    which pushes the address of the new sys_write function onto the stack and returns

    to it. The new sys_write function can then do any sneaky stuff if it wants to,
    although

    in this example we only print a message to the kernel log buffer. After that the\sneaky
    stuff, it must remove the trampoline code so that it can call untainted

    sys_write, and finally puts the trampoline code back in place.


    # Detecting function trampolines


    Typically, function trampolines will overwrite part of the procedure prologue

    (the first 5 to 7 bytes) of the function that they are hooking, so, to detect

    trampolines within any kernel function or syscall, you should inspect the first
    5 to

    bytes and look for code that jumps or returns to another address. Code like this

    come in a variety of forms. Here are a few examples.


    # An example with the ret instruction


    Push the target address onto the stack and return to it. This takes up 6 bytes
    of

    code when a 32-bit target address is used:


    ```

    push $address

    ret

    ```


    # An example with indirect jmp


    Move the target address into a register for an indirect jump. This takes 7 bytes
    of

    code when a 32-bit target address is used:


    ```

    movl $addr, %eax

    jmp *%eax

    ```


    # An example with relative jmp


    Calculate the offset and perform a relative jump. This takes 5 bytes of code when

    32-bit offset is used:


    ```

    jmp offset

    ```


    If, for instance, we want to validate whether or not the sys_write syscall has
    been

    hooked with a function trampoline, we can simply examine its code to see whether

    t procedure prologue is still in place:


    ```

    $ sudo grep sys_write /proc/kallsyms

    0xffffff811d5310

    $ sudo gdb -q vmlinux /proc/kcore

    ```'
