    # The PTRACE_TRACEME technique\n\nThis technique takes advantage of the fact that\
    \ a program can only be traced by one process at a time. Almost all debuggers\
    \ use ptrace, including GDB. The idea is that a program can trace itself so that\
    \ no debugger can attach.\n\n# Illustration 4.9 – an anti-debug with PTRACE_TRACEME\
    \ example\n\n```\nvoid anti_debug_check(void)\n{\n    if (ptrace(PTRACE_TRACEME,\
    \ 0, 0, 0) < 0) {\n        printf(\"A debugger is attached, but not for long!\\\
    n\");\n        kill(getpid());\n        exit(0);\n    }\n}\n```\n\nThe function\
    \ in Illustration 4.9 will kill the program (itself) if one is attached with a\
    \ debugger; it will know it will fail to trace itself. Otherwise, it will succeed\
    \ in tracing itself, and no other tracers will be allowed, preventing debuggers.\n\
    \n# The SIGTRAP handler technique\n\nWhile debugging, we often set breakpoints,\
    \ and when a breakpoint is hit, it generates a SIGTRAP signal, which is caught\
    \ by our debugger's signal handler; the program halts and we can inspect it. With\
    \ this technique, the program sets up a signal handler to catch SIGTRAP signals\
    \ and then deliberately issues a breakpoint instruction. When the program’s SIGTRAP\
    \ catches it, it will increment a global variable from 0 to 1."
