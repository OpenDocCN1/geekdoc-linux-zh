    # Linker scripts


    Linker scripts are a point of interest to us because they are interpreted by the
    linker and help shape a program''s layout with regard to sections, memory, and
    symbols. The default linker script can be viewed with `ld -verbose`.


    The ld program has a complete language that it interprets when taking input files
    (as relocable object files, shared libraries, and header files), and it uses this
    language to determine how the output file, as an executable program, will be organized.
    For instance, if the output is an ELF executable, the linker script will determine
    how the layout will be and what sections will exist in which segments. Here is
    another instance: the .bss section is at the end of the data segment; this is
    determined by the linker script. You might be wondering how this is interesting
    to us. Well! For one, it is important to have some insights into the linking process
    during compile time. The gcc relies on the linker and other programs to perform
    this task, and in some instances, it is important to be able to control over the
    layout of the executable file. The command is quite an in-depth language and is
    beyond the scope here but worth checking out. And while reverse engineering executables,
    remember that common segment addresses may sometimes be modified, and so other
    portions of the layout. This indicates that a custom linker script is involved.
    A linker script can be specified with gcc with the -T flag. We will look it at
    a specific example of using a linker script in Chapter 5, Linux Binary Protection.


    # Summary


    We just touched upon some fundamental aspects of the Linux environment and the
    tools that will be used most commonly in the demonstrations from each chapter.
    Binary analysis is largely about knowing the tools and resources that are available
    for you and how they all fit together. We briefly covered the tools, but we will
    get an opportunity to emphasize the capabilities of each one as we explore the
    vast world of Linux binary hacking in the following chapters. In the next chapter,
    we will delve into the internals of the ELF binary format and cover many interesting
    topics, such as dynamic linking, relocations, symbols, sections, and more.'
  merge: -1
