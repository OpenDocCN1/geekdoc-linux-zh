  md: '# # 1

    The Linux Environment and Its Tools


    In this chapter, we will be focusing on the Linux environment as it pertains to
    our focus throughout this book. Since this book is focused about Linux binary
    analysis, it makes sense to utilize the native environment tools that come with
    Linux and to which everyone has access. Linux comes with the ubiquitous binaries
    already installed, but they can be found at binutils/. They contain a huge selection
    of tools that are handy for binary analysis and hacking. This is not another book
    on using IDA Pro. IDA is hands-down the best universal software for reverse engineering
    of binaries, and I would encourage you to use it as needed, but we will not be
    using it in this book. Instead, you will acquire the skills to hop onto virtually
    any Linux system and have an easily accessible. You can therefore learn to appreciate
    the beauty of Linux as a true hackers'' environment for which there are many free
    tools available. Throughout the book, we will demonstrate the use of various tools
    and give a recap on how to use them as we progress through each chapter. Meanwhile,
    however, this chapter serve as a primer or reference to these tools and tips within
    the Linux environment. If you are already very familiar with the Linux environment
    and its tools for disassembling, debugging, and parsing of ELF files, then you
    may simply skip this chapter.


    # ## Linux tools


    Throughout this book, we will be using a variety of free tools that are accessible
    by anyone. This section will give a brief synopsis of some of these tools for
    you.'
  merge: -1
  pgno: 25
