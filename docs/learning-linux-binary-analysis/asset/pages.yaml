  md: 'Linux /proc/kcore Analysis


    # Method 1 for infecting LKM files – symbol hijacking


    LKMs are ELF objects. To be more specific, they are ET_REL files (object files).
    Since they are effectively relocatable code, the ways to infect them, such as
    hijacking functions, are more limited. Fortunately, there are some kernel-specific
    mechanisms that take place during the load time of the ELF kernel object, the
    process of relocating functions within the LKM, makes infecting them quite easy.
    The entire method and reasons for it are described in this wonderful whack paper
    at http://phrack.org/issues/68/11.html, but the general idea is simple:


    +   1. Inject or link the parasite code to the kernel module.

    2. Change the symbol value of init_module() to have the same offset/value as the
    evil replacement function.


    This is the method used ubiquitously by attackers on modern Linux systems (2.6
    to 3.x kernels). There is another method that has not been specifically described
    anywhere else, and I will share it briefly.


    # Method 2 for infecting LKM files (function hijacking)


    LKM files are relocatable code, as previously mentioned, and are therefore quite
    easy to add code since the parasite can be written in C and compiled as relocatable
    before linking. After linking the parasite code, which presumably contains a new
    function (or several functions), the attacker can simply hijack any function within
    the LKM using function trampolines, as described early in this chapter. So, the
    attacker replaces the first several bytes of the target function with a jump to
    the new function. The new function then memcpy''s the original bytes to the old
    function before invoking it, and memcpy''s trampoline back in place for the next
    time the hook is called.


    ![](img/10a855ebad6fe689ed3447763aed6bf4_264_0.png)


    > On newer systems, the write protect bit must be disabled prior to patching the
    text segment, such as with the memcpy() calls that are necessary to implement
    function trampolines.


    [ 240 ]'
