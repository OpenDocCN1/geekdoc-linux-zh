  md: 'We can see that the call instruction (the relocation target) at 0x80408de has
    been modified with the 32-bit offset value of 5, which points foo().). The value
    5 is the result of the R386_PC_32 relocation action:


    ```

    S + A - P: 0x80408e8 + 0xffffff - 0x80480df = 5

    ```


    The 0xfffffffc is the same as -4 if a signed integer, the calculation can also
    be seen as:


    ```

    0x80408e8 + (0x80408df) + sizeof(uint32_t))

    ```


    To calculate an offset into a virtual address, use the following computation:


    ```

    address_of_call + offset + 5 (Where 5 is the length of the call instruction)

    ```


    Which in this case is 0x80408de + 5 + 5 = 0x80408e8.


    > Pay attention to this computation as it is important to remember and can be
    used when offsetting addresses to addresses frequently.


    An address may also be computed into an offset with the following computation:


    ```

    address - address_of_call - 4 (Where 4 is the length of the immediate operand
    to the call instruction, which is 32bits).

    ```


    As mentioned previously, the ELF specs cover ELF relocations in depth, and we
    will be visiting some of the types used in dynamic linking in the next section,
    such as R386_JMP_SLOT entries.


    # Relocatable code injection-based binary patching


    Relocatable code injection is a technique that hackers, virus writers, or anyone
    who wants to modify the code in a binary may utilize a way to relink a binary
    after it is already compiled and linked into an executable. That is, you can inject
    an object file into an executable, update the executable''s symbol table to reflect
    newly inserted functionality, and perform the necessary relocations on the injected
    code so that it becomes part of the executable.


    A complicated virus might use this technique rather than just appending position-independent
    code. This technique requires making room in the target executable to inject the
    code, followed by applying the relocations. We will cover binary infection and
    code injection more thoroughly in Chapter 4, ELF Virus Technology - Linux/Unix
    Viruses.'
