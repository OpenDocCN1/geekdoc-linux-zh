  md: '# Tools for detecting PLT/GOT hooks


    Currently, there are not many great tools that are specifically for process memory
    analysis in Linux. This is the reason I designed ECFS (discussed in Chapter 8,
    ECFS - Extended Core File Snapshot Technology). There are only a few tools I know
    of can detect PLT/GOT overwrites, and each of them essentially uses the same heuristics
    that we discussed:


    +   - Linux VMA Voodoo: This tool is a prototype that I designed through the DARPA
    CFT program in 2021. It is capable of detecting many types of process memory infections,
    but currently only works on 32-bit systems and is not available to the public.
    However, the new ECFS is open source, which was inspired by VMA Voodoo. You may
    read about VMA Voodoo at http://www.bitlacksys.org/#vmadudu


    +   - ECFS (Extended core file snapshot): This technology was originally designed
    to work as a native snapshot format for process forensics tools in Linux. It has
    evolved into even more than that and has an entire chapter dedicated to it (Chapter
    8, ECFS - Extended Core File Snapshot Technology). It can be found at https://github.com/elfmasterecfs/


    +   - Volatility ptk: The Volatility software is primarily geared towards full
    system memory analysis, but Georg Wicherski designed a plugin in 2013 that is
    specifically for detecting PLT/GOT infections within a process. This plugin uses
    heuristics similar to those that we previously discussed. This feature has now
    merged with the Volatility source code at https://github.com/volatilityfoundation/volatility.


    # Linux ELF core files


    In most UNIX Oses, a process is caused to deliver a signal that it dumps a core
    file. A core file is a snapshot of the process and its state right before it crashes
    (crashed or dumped). A core file is a type of ELF file that is primarily made
    up of program headers and memory segments. They also contain a fair amount of
    notes in the PT_NOTE segment that describe file mappings, shared library paths,
    and other information.


    A core file by itself is not especially useful for process memory forensics, but
    it may yield some results to the most astute analyst.


    > This is actually where ECFS comes into the picture; it is an extension of the
    regular Linux ELF core format and provides features that are specifically for
    forensic analysis.'
