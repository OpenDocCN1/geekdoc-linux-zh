    In addition to regular shared libraries, there is the dynamic linker, which is
    also technically a shared library. We see that it is mapped to the address space
    by looking at the file mappings after the libs mappings:


    ```

    7fed3dc9c6900-7fed3dc8c900 r-xp 00000000 08:01 11406093 /lib/x86_64-linux-gnu/ld-2.19.so

