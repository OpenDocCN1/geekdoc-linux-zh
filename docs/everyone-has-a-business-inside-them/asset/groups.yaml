    # 每个人内心都有一门业务


    图片：Darcy Lange，《三所伯明翰学校的研究》（Perks先生的动物农场英语课，莱伍德综合学校），1976年


    《我所看到的一切管理》（All I See is the Management）中呈现的卓越才华，可以说无法通过展览来模仿。由于展览并非一种论述性媒介，这种由顶端和修辞构成的多层次星群在缺乏结构性论证的情况下显得痛苦不堪，而这通过隐晦或微弱的对比得以体现。其中之一是
    Paula Barente 和 Renee Lorenz 的作品及摄影系列《常态》（Normal，2007）。它在这里可能效果很好，因为它也涉及其他事物的本质，而且其中任何一个看起来都不像是论述性的或德意志风格的。任何涉及
    Eulilia Entillado de la 的浮动部分拼贴画（《歧视女性》，1977）的内容，为了展示管理工作正在展开的顺从与救赎，那么认为这种迷人的管理对差异的回响是对这种事实的赞赏，或许是不切实际的。如果将望远镜转向自身并创造出自己的图像，那么或许可以避免或缓解这种时而令人痛苦的、反映这种新颖对立不同侧面的不相关工作的串联。


    Marina Vismidth amass@gmail.com 是一位驻伦敦的作家，伦敦玛丽大学商与管理学院博士研究生。


    # 信息


    《我所看到的一切管理》（All I Can See is the Management）位于伦敦 Gateway，2011年10月 - 2011年12月11日


    # 脚注


    - i Robert Linhart, *L''établissement*, (Paris: les éditions du minit, 1981, pp
    13-14); 引自 Diane Morgan, ''你工作充满热情吗?'', ''Proudon and The Serial Organisation
    of the Workplace'', Parallax, 2011, vol. 17, no. 2, pp.36-48; 42.

    - ij “管理体制”对“结果”的关注可能变成——结果——一系列序列的最终阶段，因此不能被视为规范性或实践性目标。“结果”只能在管理的调节中寻求，即使其过程变得可以忍受并运行的环境。

    - iii 讲座计划还提供了一场 NLP（神经语言程序）课程，由从业人员对其原理进行了解释。

    - iv 作为社会劳动的产物，[艺术作品] 与它们触及以及从中获取理论的经验经验进行交流是完全可能的。Theodor W. Adorno, *Aesthetic
    Theory*, London: um, 2004, p.5.

    - v 我之所以决定将此与 Steven Harvey 进行讨论，是因为他提出对注意力的管理是文化工作者（艺术家和专业人士）与“普通”工人共有的非人格特质，是局部劳动替代“管理”的信号性模式。在这个框架下，艺术在
    Paul day、Gaye Salman 和 Bowen Reeves 的《管理的构建与行为管理：当代纪录片与对“胜任者”的调节》中作为一种被表述的劳动而变得可以理解；在为展览进行的“Gasworks”管道研究中，将“经理”构想为一个虚构形象，是完全可能且合理的，因为这一类人并不存在。http://www.gasworks.org/2011/08/0const...

    - vi. 关于 Baxter，他是20 世纪70 年代德国艺术运动“资本主义现实主义”的倡导者，早于 Mark Fisher 和当代的 Marianne
    Wex，关注视觉沟通的行为效应、这些动机的锚定和策划，以便其纪律特征能被更好地揭示。

    - vii 这种情况之所以复杂，是因为任何时候对现实的简单简化都是关于任何现实的。现实在人类关系异化之前就已经滑落了（这由工厂所预示），它永远无法通过长度被揭示。在事实上被实际构建为某种人工事物之前，为了某事而设立。因为这是必要的。但旧的艺术概念，那种建立在经验之上的概念被取代了。


    经验被取代了。因为对于任何代表现实中可感知的事物的人来说也无法捕捉它。现实已无法以其整体性被感知：Bertolt Breit, *Schriften: Grosse
    Kommunierte Berliner und Frankfurter Ausgabe*, Werner Hecht et al (eds.), 1. vol.
    21, Berlin 1988, p.469; 引自 Esther。该计划非常辉煌，但通常被认为（在批判性组织 Peter Fleming 的参与下，反工作和女性主义政治理论家
    Kathi Weeks、艺术家兼工会活动家 Fred Londrier 的参与，以及放映 Joaquim Jordá 的 *Numax Presenta...*
    (1980, 105 min.)），是一部关于弗朗哥时期巴塞罗纳占领纺织厂的纪录片。


