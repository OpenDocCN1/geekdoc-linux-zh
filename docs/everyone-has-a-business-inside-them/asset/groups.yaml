- md: "\n![](img/606122f7f41b4e79dc209f3d6548a080_3_0.png)\n\nA demonstration of *reflexivity*\
    \ could take the form of seeing if Gasworks' or any comparable organisation's\
    \ (and the whole guest would be in determining what is *comparable\\*) own administrative\
    \ structure and relationships constitute an object for a show management? If,\
    \ as is likely, this would fall fairly within the exhibition's conceptual limits,\
    \ what would be the practical implications of situating its operations within\
    \ the field of management? \n\nIts funding functions as a vitrine, its own overeducated\
    \ invigators and administrators encouraging their subjectivities (from mid-century\
    \ modernism to the price of modernity), a critique of management but also being\
    \ reflective about the role of public-funded arts organisations in reproducing\
    \ the modern paradigms they query? This critique could instantaneously be generalised\
    \ to represent the formation of the neoliberal subject through the tangled ideals\
    \ of self-expression and submission. \n\nSuch a configuration of courage from\
    \ one animated-specialized practices such as Berlin's kpD (kleines postfordrichtungen\
    \ of the Bourgeoisie) prominently featured in the last exhibition at Gasworks\
    \ as All I Can See: 2007's Lapdogs of the Bourgeoisie The latter was a much more\
    \ psychoanalytic affair, tracing an *internal* object, and thereby the symposia\
    \ deconstruct the image into the dimmed background of artistic careers. Here,\
    \ the demand for reflexivity was anticipated, and, if memories, diverted and diffused.\
    \ The press makes note [that] participating artists have not necessarily been\
    \ chosen for a specific engagement with issues of class within their work but\
    \ hoped to ask whether the traditional analytical tools at our disposal are helpful\
    \ in such an examination of the art world today.\n\nNow be the time to find and\
