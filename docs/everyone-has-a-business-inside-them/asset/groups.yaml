    # Mute


    ## ARTICLES


    # EVERYONE HAS A BUSINESS INSIDE THEM


    By Marina Vishmidt, 14 March 2012


    Politics / Biopolitics / Labour Struggles / Neoliberal / Art / Cultural Industries
    / Business / Management Theory


    Featured in Mute Vol. No. 3 - Becoming Impersonal


    ![](img/606122f7f41b4e79dc209f3d6548a080_0_0.png)


    An exhibition at Gasworks singled out the thematic of ''management'' as a lens
    through which to examine multiple artistic approaches to labour, organisation,
    communication and measurement. Marina Vishmidt gives the show an evaluative performance
    review


    > Robert Linhart, L''enfant


    ## Elusive Object of Management


    What is the object of management? Who is asking? Management is first of all exerted
    upon resources, these temporal or human, rather than upon autonomous entities
    that either be reasoned with or present their own reasons; perhaps the autonomy
    of the entity is expressed through its striving to fulfill its potential as a
    resource, as enculcated by the logics of human material. As it goes in the Schubert
    march piece which from the exhibition name, ''all I can see is the management''
    the statement that the protagonist cannot change the ''workers'' or anything else,
    management gets in our eyes. Management has set itself to manage all things, and
    finds it unmanageable. Like its co-liberative ''governance'', it is weakly totalising;
    it is the perpetual calibration of accommodation and control over contention fundamentals
    has been eliminated from the scene. The double nature of being totalising and
    infinitely ajustable makes it perfect emblem of the capital relation, which is
    carried out by bosses, trade unions or individuals upon themselves. At the same
    time, its role as the mediator of processing various ideologies into an identical
    optic reality with richness and therapy, as they are all with human benefit. It
    must also be asserted that the extension and elasticity of management occur in
    a specific historical moment, one which analytically possible despite being perpetual.
    And as is the expression of management in its historical moment, the same needs
    to be done for the various heuristics which we use to estrange it from ourselves
    or in, such as an exhibition about management.


    If the unfought of management is perhaps merely irredund of the thorough, and
    the uplifting of politics as logistics, then the survey just set out above the
    risk of containing itself with truis when more careful optics are solicited. And
    working with the premise that the exhibition is the occasion if not the source
    of this demand, the optic could initially be put in this way: what is the relationship
    between the art object (and not the source of timeless flavour, the artistic subject)
    and the object of management? Which amounts to saying, is it possible to build
    a theory and the themes of management particularly in an artistic experiment?
    “communicative facilities” – without situating art as at a potential adderee of
    management’s claims, not to mention their enthusiastic referee since the era of
    Art & Language, the Artist Placement Group or Myer Ladermann Uekely? The poles
    of the aestheticisation of a study object located in the middle distance and a
    beneath topics of diversity are equally important in the context of the global
    economy. The Management intends to showcase ‘artworks that how kind of latest
    approaches to work play out at work, in education and at home’. But the exhibition
    does so with a sense of excluding the immanence of the management role performed
    by culture from its purport (admittedly ‘immanent’ since management theory for
    the decadence of art is so far in common with management). The history of labour
    disparity only occurs later, if at all, to re-introduce it in the guise of a ‘resource’.
    Could that be a ‘pervasiveness of management’ itself? Does the show take into
    account or see itself reflected in the culture of management within the sphere
    of culture or is this ‘management’ just an eccentric reality practised by ‘workers,
    entrepreneurs’ and ‘managers’ the exotic others to artistry? Management and art
    of course are so in common, perhaps nobody thinks the history of labour disparity
    occurs later, if at all, when summoned into a gallery space where it is expected
    to behave as a native informant.


    ![](img/606122f7f41b4e79dc209f3d6548a080_1_0.png)


    Image: Pauline Boudry & Renata Lorenz, Normal Work, 2007


    But if the contention here is a certain neglect of the importance of object to
    concept, then the contention must be specified a bit better. Rather than identifying
    a ‘blind spot’ in the show’s thinking, it should be more interesting to see how
    the exhibition can or ‘perform’ the logic of management, and not just see it everywhere,
    that is. Nowhere it might be proposed that the characteristic problem management
    has with locating its object – management is not autotelic, that is, formalist
    and concerned with the control of processes, thoroughly immersed in its own logic
    – paralleled with exhibition’s trouble deciding on a curated object? It holds
    up and puts down management, the mediating figure of the entrepreneur, but declines
    to put them into relation or posit a thesis that guide the view in such assembling.
    Perhaps sits this common misapprehension an argument, when by an exhibition, is
    to be didactic or illustrative and semantic. itself requires fostering a productive
    ambiguity (rather the dosa entailed by many iterations of artistic ambiguity)
    itself a strong conceptual which an exhibition might possess with this degree
    of difference fulfilling works. What is fostered in the position of an arbitrariness
    into aestheticisation on the one hand, and of management the continual management
    of austerity, along with the management of the business ‘in us’, as the Department
    of Trade and industry would have painting, dazzling feature of mass unemployment.
    But it should be said that the reality of an exhibition that creates management
    and entrepreneurship is to be suggestive and not typical, there which would be
    the questions of and the deliberate mystification of the object in the realm of
    inquiry. By supposing that exhibition be successfully performed, it would still
    fall under the rubric of reflexivity.


    One deconstruction of this question was filmed by Filip’s video, Rapport (2007,
    15 min.), in an installation that dominated the Gasworks space visually (it was
    a large projection on screens which diagonally bis the space and society). The
    video showed a group of German managers taking place in a neuro linguistic programming
    (NLP) sense. This work evoked Haron Faroci’s videograms of ‘modern life’ in the
    invasive scrutiny and incidental emotiveness, though César’s editing preferences
    are more aleatory and nervous. Reflexivity here, as in most totalitarian regimes,
    was clearly acting as homeopathy and training for heteronymous goals (‘success’)
    which had internalised to the point where any change to behaviour would be not
    strictly personal but totally Homeostatic.


    ## Desist, Reflexivity as Total Quality Management


    Reflexivity is a highly valued term in critical art production and mediation,
    signalling an awareness of tradition, contradiction, restitution and responsibility.
    It may be an agonised awareness or an ironic one, an emblem of simplicity or complic,
    and it has numerous affective and political sources. However, against a wider
    bandwagon of massified consumption of critical practice, it is also a highly normative
    term and technology. One needs only to look at the promise of ‘critically’ in
    art school curricula to recognise it as the bureaucratic form of critique, and
    that such training in criticality nearly always marks the spot from whence critique
    has been purged.


    As such, its constitutive is critical, while its performative is virtuous. In
    this respect, it functions in analogy with in instruments of feedback and measure
    which has signal management in other spheres, like consultation, evaluation, or
    assessment – is the internal standard operating procedure of the field. And it
    is in this that we would have to quality the demand for reflexivity from an art
    exhibition about management, before we can hope to distinguish from this demand
    another desire, that for maintenance of object of inquiry. Which is so; the demand
    for reflexivity is a product of the necessity of situating the exhibition in the
    ‘pervasiveness’ of management seen and unseen, but this demand may issue from
    the field it surveys to.


