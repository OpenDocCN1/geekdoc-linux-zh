  md: '# # Installation Complete (Almost)!


    Congratulations! Your installation is now complete — almost!


    The installation program prompts you to prepare your system for reboot.


    Remove any installation media (diskette in diskette drive or CD in the CD-ROM
    drive) if they are not ejected automatically upon reboot.


    If you do not have a boot loader installed and configured, you will need to use
    the boot disk created during the installation now.


    After your computer''s normal power-up sequence has completed, you should see
    the graphical boot loader prompt, at which you can do any of the following things:


    +   * **Press Enter** — Causes the default boot entry to booted.


    +   * **Select a boot label and press Enter** — Causes the boot loader to boot
    the operating system corresponding to the boot label. (? or Tab in LILO''s text
    mode boot loader prompt for a list of valid boot labels.)


    +   * **Do nothing** — After the boot loader''s timeout period (by default, 5
    seconds), the boot loader will automatically boot the default OS entry.


    Do whatever is appropriate to boot Fedora. You should see one or more screens
    of messages scroll by: login: prompt or a GUI login screen (if you installed the
    X Window System and chose to start X automatically).


    The first time your system boots, the Setup Agent appears and walks you through
    the initial configuration of your system.


    # # Firstboot Configuration


    Once your system has finished rebooting, you should see the final setup welcome
    screen, as shown in Figure B-26. Click the Next button to proceed.


    # # Setting the Date and Time


    Now you need to set the date and time for your system (see Figure B-27). If the
    screen does not show the correct month or year, click on the left or right arrows
    surrounding the month and year until you reach the current month and year. Click
    on the current day of the month. You can adjust the time by clicking on the up
    and down arrows for each value, or you can simply click in the field and edit
    the numbers for the hour, minute, and second values.'
