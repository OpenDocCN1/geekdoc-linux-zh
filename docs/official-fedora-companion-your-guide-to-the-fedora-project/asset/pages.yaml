    desktop, you don''t have to close all your applications and log out. You can lock
    the screen, instead. Click the Main Menu button 回 Lock Screen. The screensaver
    should start automatically. The next time you press a key or move the mouse, the
    desktop requires that you enter your password to use the desktop again.


