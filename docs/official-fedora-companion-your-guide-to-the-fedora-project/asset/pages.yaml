  md: '# Chapter 2 ♦ Ahead of the Bluecurve 33


    To return to your home directory, click the Home button.


    When you navigate through your file system, you can always see where you are by
    looking at the Location field. You can also type a directory location in the Location
    field and press Enter if you want to go directly to that location.


    You can open another Nautilus window by selecting ⟜ New Window. After you have
    another Nautilus window, you can drag and drop files between the windows.


    > Note By dragging a file from one directory to another will move the file. If
    you wish to copy the file to another, press the Ctrl key while dragging and dropping
    the file. You can also press and hold the Alt key while dragging and drop, after
    which you will be asked what operation you want — copy, move, and in images.


    By default, text-based files and images in your home directory will be seen as
    thumbnails. For text files, you will see a portion of the actual text in the icon.
    For images, you will see a scaled down (or thumbnail) version of the image. To
    turn off this feature, select Edit ⟜ Preferences. Select Performance from the
    menu on the left and select Never for the visual enhancements that you want to
    disable. Disabling these features will increase the speed of Nautilus.


    # # Start Here


    The Start Here window (see Figure 2-7) was designed to hold all of the tools and
    applications you need to access when using your system. From your favorite applications
    to system and configuration tools, the Start Here window provides a central location
    for using and customizing your system.


    You may access Start Here at any time by double-clicking on the desktop icon labeled
    Start Here.


    The Start Here screen includes icons that allow you to access your favorite applications,
    desktop preferences, Main Menu items, server configuration tools, and system settings.


    ![](img/67d9607982940021da1fe4247b9b224c_54_0.png)


    **Figure 2-7:** The Start Here Window'
