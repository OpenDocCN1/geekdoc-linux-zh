  md: '# Chapter 2 ♦ Ahead of the Bluecurve 43


    ![](img/67d9607982940021da1fe4247b9b224c_64_0.png)


    Figure 2-16: The Grand Canyon Theme


    # Changing Details


    Each theme is composed of three types of details: the look of the graphical Controls
    (listboxes, buttons, etc.), the look of the Window Border (the title bar and buttons)
    and the icons. You can set these details by clicking the Details button from the
    Theme selector (see Figure 2-17). Click on some of the selections, as Grand Canyon,
    to see how they change the look of your desktop controls. You will the changes
    shortly after you click on a selection.


    You can change your interface more drastically by clicking the Window tab and
    trying out some of the various window borders (see Figure 2-18). Click on one
    of the selections, such as Crux, to see how they change the look of your window
    borders. You will see the changes shortly after you click on a selection.


    You can change the style of the desktop icons, too. Click on the Icons tab in
    the Details window (see Figure 2-19), and then click on some of the selections
    in the list. Your desktop icons should change to the style of the selection you
    make.


    # Saving a Custom Theme


    When you are done changing theme details, click Close in the Details window. The
    Theme preferences automatically created a new entry in your themes, labeled Custom
    Theme. If you like your theme and want to save it, click Save Theme. You can fill
    in the name of the theme and a short description, and then click Save.'
