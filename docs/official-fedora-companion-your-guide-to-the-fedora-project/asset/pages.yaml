    |

    | Middle Mouse Button | Pastes highlighted text. Use the left mouse button to
    highlight the text. Point the cursor to the spot you want it pasted. Click the
    middle mouse button to paste it. If you do not have a middle mouse button, but
    selected the Emulate 3 buttons option during the installation, you can emulate
