    partitioning.


    # Installing Fedora in a Dual-Boot Environment


    After Windows is installed and you have free disk space for Linux, you can start
    the Fedora installation program. See Appendix B for instructions on installing.


    At this point, the only difference between a Fedora installation and configuring
    a dual-boot system during the Fedora installation is partitioning the hard drive
    and configuring the boot loader. When you are at the Disk Partitioning Setup screen,
    return to this section.


    # Disk Partitioning


    At the Disk Partitioning Setup screen of the installation program, you have a
    few options, as described in the following list. Depending on which option you
    choose, the steps for configuring a dual-boot system vary. If you do not know
    how many Linux partitions to configure, refer to Appendix B for a recommended
    partitioning scheme.'
