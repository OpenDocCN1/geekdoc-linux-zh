    backup itself in that temporary CD image? The answer is simple—the mkisos command
    has a switch (-x) which you can use to tell it to exclude a directory from the
    image it is about to create. That''s why you add -x /home/joeser/emptydirectory
    to the following command:


    ```

    mkisos -backup.iso -x /home/joeser/emptydirectory/ -J -R -A -V -v /

    home/joeser/

    ```


    Now pop in your recordable CD and type this command to make the copy:

    cdrecord -v dev=1,0,0 backup.iso


    That''s all there is it. You should now have an accurate backup of your home directory
    without the unwanted image included.


    Did you encounter a problem? There are many reasons why you might find a glitch
    in the procedure, but here are the most common problems to check:


    +   * Did you check to make sure the dev=parameter for the cdrecord command has
    the correct numbers filling it? They should match the numbers for the CD drive
    you detected with the cdrecord -scanbus command

    * Do you have enough disk space to store the copy of the data CD on your local
    drive when you used the cp command?

    * Is the blank recordable CD truly a blank, never-used recordable CD with scratches,
    dirt, or other problems?

    * Is the recordable CD able to record as much information as stored in the backup.iso
    file you created with mkisos? You can find out the size in megabytes of the file
    backup.iso with the following command:


    ```

    ls -l --block-size=MB backup.iso

    ```


    See the section "cdrecord" later in the chapter for other possible issues.


    # Using mkisos


    In the instructions on how to back up data to a CD-R(RW), you used the mkisos
    utility to turn the backup files into a CD image suitable for recording to the
    CD-R(RW). Take another look at the command:'
