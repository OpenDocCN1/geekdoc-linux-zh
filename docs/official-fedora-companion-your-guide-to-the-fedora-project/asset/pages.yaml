    Figure 3-18: Floral Panel


    #  Customizing the Taskbar


    Click on the Task Icon in the Panel Settings window to customize the Taskbar,
    as shown in Figure 3-19. There are several custom options here. For example, if
    you check the box Show Windows from All Desktops, the Taskbar always includes
    every application that you are running. If you uncheck this, the Taskbar shows
    only those applications that are running in your current workspace.


    #  Customizing Workspaces


    Workspaces are the equivalent of extra desktops on your system. By default, Fedora
    comes with four workspaces that you can work with, but you are by no means limited
    to four. The following sections show how to add and remove workspaces, drag applications
    across workspaces, and make a single application appear on all of your workspaces.


    #  Adding or Removing Workspaces


    Depending on your needs, you may want more or fewer than the four default workspaces.
    To add or remove workspaces from your Panel, right-click the Workspace Switcher
    Panel applet (refer to Figure 3-3) and choose Configure Virtual Desktops. The
    Multiple Desktops settings window appears (Figure 3-20). From this window you
    can change the number of workspaces and rename them.'
