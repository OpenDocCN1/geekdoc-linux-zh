  md: '# Chapter 3  The KDE Bluecurve 59


    Caution Keep in mind that you cannot recover a file from the Trash after you have
    emptied the Trash or deleted the file from the Trash (as discussed in the next
    section).


    # Emptying the Trash


    The Trash can is just like a real trash—it does not empty itself; you have to
    empty it.


    Caution After you empty the Trash, all files in it are gone forever.


    To empty the Trash, do the following: Right-click the Trash icon on your desktop
    and choose Empty Trash Bin.


    Note If you only want to delete one file from the Trash, not every file, you can
    open the Trash, right-click on the file, and choose Delete.


