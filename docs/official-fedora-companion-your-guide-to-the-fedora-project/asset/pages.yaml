  md: '# Boot Disk Creation


    When the installation finishes copying all the files from the CD-ROM, it will
    ask if you want to create a boot disk. To create a boot disk, insert a blank,
    formatted diskette into your diskette drive and click Next (see Figure B-25).
    It is highly recommended that you create a boot disk. If some reason, your system
    were not able to boot properly using GRUB, LILO, or a third-party boot loader,
    a boot disk would enable you to properly boot your Fedora system.


    After a short delay, your boot disk will be created; remove it from your diskette
    drive and label it clearly.


    +   * If you want to create a boot disk after the installation, you will be able
    to do so. For more information, please see the mkbootdisk page by typing man mkbootdisk
    at the shell prompt.


    +   * If you do not want to create a boot disk, make sure to select the appropriate
    option before you click Next.


    +   * If you boot your system with the boot disk (instead of GRUB or LILO), make
    sure you create a new boot disk whenever you make any changes to your kernel (including
    the installation of a new kernel). Recovering with a boot disk that includes an
    archaic kernel on it can be a scary experience.


    ![](img/67d9607982940021da1fe4247b9b224c_229_0.png)'
