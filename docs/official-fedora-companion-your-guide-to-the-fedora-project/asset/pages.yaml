    # Printing a Test Page


    After you have configured your printer, you should print a test page to make sure
    the printer is functioning properly. If you change also the print driver or modify
    the driver options, you should print a test page to test the different configuration.


    To print a test page, select the printer that you want to test from the printer
    list and choose Test -> US List Postscript Test Page, Print A4 Postscript Test
    Page, or Print ASCII Test Page from the pull-down menu. If your printer does not
    support PostScript printing, choose to print the ASCII test page.


    If the test page does not print properly, check to make sure your printer is connected
    correctly, has enough printer paper, and is turned on and ready for printing.
    If the printer itself is not the problem, you may need to change your printer
    settings.


    # Getting Online


    If you set up a network connection during the installation process, you are probably
    already "online" and don''t need to read this section. It is worth browsing, regardless
    you may pick up a few bits of useful information, especially if you connect to
    the Internet via a cable or DSL modem or router.


    Many types of internet connections exist, the most common of which include the
    following:


    +   * Modems

    * Digital Subscriber Line (DSL) modems

    * Cable modems

    * Wireless devices


    While this is by no means an exhaustive list of connection types, these are by
    far the most common methods of connecting to the Internet today. Other connection
    types, such as Integrated Services Digital Network (ISDN) and token ring, are
    pretty much exclusively the domain of business-class networks and as are beyond
    the scope of this book.


    # Network Configuration


    To communicate with other computers, your computer needs a network connection.
    Computers connect to networks by having the operating system recognize a network
    interface adapter (such as Ethernet) or other hardware (such as a dial-up modem).


    The Network Administration tool can be used with Fedora to configure your network
    interface. To use the Network Administration tool, you must be running the X Window
    System and have root privileges. To start the application, click the Main menu
    System Settings -> Network. You should see a window like the one shown in Figure
    1-19.


    # How Does My Computer Talk to the Network?


    These are the four most common types of network connections:'
