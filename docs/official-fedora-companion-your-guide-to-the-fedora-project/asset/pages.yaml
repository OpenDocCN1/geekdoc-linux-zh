  md: '# Introduction


    Welcome to Fedora, a Red Hat-sponsored, community-supported distribution of software
    based on the open source Linux operating system. Fedora is a leading-edge Linux
    distribution designed with the goal of providing a collection of the latest and
    greatest features available from free software.


    The Fedora Project is also designed with ease-of-use as a priority, taking a “just
    works” approach toward usability. For example, Fedora includes a custom version
    of the most popular desktop environments, GNOME and KDE. Bluecurve is tailored
    to make it as easy as possible to plumb the depths of the powerful software available
    in Fedora. Bluecurve also smoothes out the differences between GNOME and KDE,
    which means you can experience both and pick the environment you like without
    having to learn the basics.


    Fedora is also designed with upgradability. One of the goals of the Fedora Project
    is to make it easy to upgrade Fedora on a regular basis while minimizing the need
    to reconfigure the desktop or any software you are accustomed to using. Those
    with an “if it works, don’t fix it” philosophy can enjoy sticking with their current
    version of Fedora, while others can upgrade with minimal effort.


    Fedora includes a broad range of those popular software applications that meet
    the free-free software standards set by Red Hat and the Fedora Project maintainers.
    This means Fedora meets high technical standards and is free of restrictive and
    oppressive software license agreements. You can install Fedora on as many computers
    as you wish. Indeed, you could even spin off a new Linux distribution from Fedora
    if that your ambitions take you.


    Best of all, the Fedora Project is committed to the free software, community-driven
    philosophy of development. The open source, community-driven software development
    process produces high quality software because collaborative development allows
    software maintainers to “cream-skim” the best contributions. the most secure software
    available because it is held under the scrutiny of countless developers.


    If this is your first time using Linux, you are about to experience a level of
    quality, freedom, and independence you may have never known. Free software is
    not only high quality and secure, it is a virtual guarantee that you will remain
    in control of your own software because the source code—the blueprints for all
    the software that comes with Fedora—is freely available. None of the software
    in Fedora is subject to the restrictive, expensive, and intrusive licensing agreements
    commonly found in competing operating systems.


    Indeed, if until now you have been dependent on Microsoft software and bound by
    the restrictions associated with said software, adopting Fedora is like signing
    a declaration of independence from inferior proprietary software.'
