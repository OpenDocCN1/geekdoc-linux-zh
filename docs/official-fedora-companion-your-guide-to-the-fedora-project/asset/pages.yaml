  md: '# Disk Partitioning Setup


    Partitioning allows you to divide your hard drive into isolated sections where
    each section behaves as if it were its own hard drive (see Figure B-7). Partitioning
    is particularly useful if you run more than one operating system.


    Automatic partitioning allows you to perform an installation without having to
    partition your drive(s) yourself. If you do not feel comfortable partitioning
    your system, it is recommended that you do not choose to partition manually and
    instead let the installation partition for you.


    To partition manually, choose the Disk Druid (recommended for experts only) partitioning
    tool.


    ![](img/67d9607982940021da1fe4247b9b224c_211_0.png)


    Figure B-7: Disk Partitioning Setup


    > The Red Hat Update Agent downloads updated packages to /var/pool/up2date by
    default. If you partition the system manually and create a separate /var partition,
    be sure to create the partition large enough to download package updates.


    # Automatic Partitioning


    Automatic partitioning allows you to have some control concerning what data is
    removed (if any) from your system (see Figure B-8). Your options are:


    +   * Remove all partitions on this system — Select this option to remove only
    Linux partitions (partitions created from a previous Linux installation). This
    will not remove other partitions you may have on your hard drive(s) (such as VFAT
    or FAT32 partitions).


    +   * Remove all partitions on this system — Select this option to remove all
    partitions on your hard drive(s) (this includes partitions created by other operating
    systems, such as Windows FAT and NTFS partitions).'
  merge: -1
