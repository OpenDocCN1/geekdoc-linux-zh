  md: '# Getting Started


    You''ll find Fedora is remarkably friendly and easy to use for work, play, or
    for just surfing the Internet. This chapter helps you to get logged in and use
    the Fedora Bluecurve desktop and demonstrates how to log out and shut down the
    computer. You also learn how to configure the date, and your time zone, how to
    set up any printer you may have connected to your computer, and how to get your
    computer connected to the Internet.


    Even if you are eager and able to start using the many powerful applications with
    little or no help, please take the time to familiarize yourself with the terms
    and important concepts contained in this chapter, especially the information about
    users and security in the section "Before You Log In."


    # Introductory Terms


    When you learn about a new operating system, you also need to learn new terminology.
    Here are a few basic terms you should learn to use Fedora. You will see these
    terms often throughout this book:


    +   - Graphical User Interface (GUI) — A screen with icons, menus, and panels
    for the user to click on initiate actions such as starting applications and opening
    files.


    +   - Point and click — You move the mouse to point to something on the screen,
    and click one of the mouse buttons to perform a task. By default, you click the
    left mouse button to do most tasks, but very often you can get a custom menu of
    options when you click the right mouse button.


    +   - Double-click — Click the left mouse button twice in succession, rapidly,
    usually you do to an icon (see the following entry) to launch an application or
    perform another important action. You can customize your Fedora to make this action
    easier if it is difficult for you.


    +   - Icons — Small images representing an application, folder, shortcut, or system
    resource (such as a floppy drive) to which you point with the mouse and click
    double-click to activate. Launcher icons usually refer to application shortcuts.


    +   - Graphical desktop environment — The most visible area of a GUI. The desktop
    is where your user Home and Start Here'
  merge: -1
  pgno: 22
- img_proc: true
  md: 'launcher icons are located. You can configure the desktop to have special background
    colors and pictures to add a personal touch to your desktop.


    +   - GNOME (GNU Network Object Model Environment) — The default graphical desktop
    environment for Fedora.


    +   - KDE (The K Desktop Environment) — A graphical desktop environment that is
    similar to GNOME, also available in Fedora.


    +   - Bluecurve— A Fedora custom version of GNOME and KDE that gives the two desktops
    a more consistent look and feel. Bluecurve makes both GNOME and KDE easier to
    use and makes it easy to switch from one to the other.


    +   - Panel— A toolbar, usually located across the bottom of the screen. The Panel
    for GNOME contains the GNOME Menu button and shortcut icons to start commonly
    programs (see Figure 1-1). It can be customized by the user.


    ![](img/67d9607982940021da1fe4247b9b224c_23_0.png)


    # Figure 1-1: The Desktop Panel


    +   - Privileges or rights — Linux allows you to do a task or prohibits you from
    doing a task depending on the privileges or rights you have as a user. If you
    log in as the root user (the definition for root that follows), you are called
    a superuser, and have full privileges. You can do anything you want with Fedora,
    including system administration or accidental permanent damage. Normal users have
    privileges to do everything the average user wishes to do, but not enough privileges
    to damage the system unintentionally or accidentally.


    +   - Root — The root user account is a superuser account, with special privileges
    to access virtually all resources on your Fedora system. You created this account
    during installation. This account is special because you must be logged in as
    root to accomplish certain system administration tasks. Root is the most powerful
    user on the system, but also the most dangerous, since the root has unrestricted
    abilities.


    +   - User — User accounts are created so that typical tasks can be done without
    using the root account. When you log in with a user account, you cannot perform
    certain tasks such as delete files. This is a good thing! When you log in with
    a normal user account, you can do all the work you need minimizing the chance
    of permanently damaging your Fedora installation or its applications.


    +   - X or Window System — These terms refer to the GUI environments. If you are
    “in X” or “running X”, you are working in a GUI rather than a console environment.


    +   - RPM — stands for RPM Package Manager and how Red Hat builds and delivers
