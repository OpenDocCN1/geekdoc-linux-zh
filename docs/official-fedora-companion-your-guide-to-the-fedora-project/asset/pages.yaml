  md: '# 194 Appendices


    +   - LVM—Allows you to create an LVM logical volume. The role of LVM (Logical
    Volume Manager) is to present a simple logical view of underlying physical storage
    space, such as a hard drive(s). LVM manages individual physical disks — or to
    be more precise, the individual partitions present on them. It should be used
    only if you have experience using LVM. To create an LVM logical volume, you must
    first create partitions of physical volume (LVM). Once you have created one or
    more physical volume (LVM) partitions, select LVM to create an LVM logical volume.


    # Partition Fields


    Above the partition hierarchy are labels that display information about the partitions
    you are creating. The labels are defined as follows:


    +   - Device—This field displays the partition''s device name.

    - Mount Point/RAID/Volume—A mount point is the location within the directory hierarchy
    where a volume exists; the volume is "mounted" at this location. This field indicates
    where the partition will be mounted. but is not set, then you need to define its
    mount point. To do so, double-click on the partition or click the Edit button.

    - Type—This field shows the partition''s type (for example, ext2, ext3, or vfat).

    - Format—This field shows if the partition being created will be formatted.

    - Size (MB)—This field shows the partition''s size in megabytes.

    - Start—This field shows the sector on your hard drive where the partition begins.

    - End—This field shows the sector on your hard drive where the partition ends.

    - Hide RAID Device/LVM Volume Group Members—Select this option if you do not want
    to view any RAID device or LVM Volume Group members that have been created.


