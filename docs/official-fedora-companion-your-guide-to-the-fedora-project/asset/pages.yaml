    # Putting Linux Files on an MS-DOS Diskette


    To copy files from a Linux machine to an MS-DOS formatted diskette so that a Windows
    machine can read it, you format your disk with an MS-DOS (FAT) file system, which
    can be done with a Windows OS or with `floppy` (see the "Using floppy" section
    later in this chapter). Then mount it in Linux as described in the preceding section.
    Copy files using the following command (substituting *filename* with the name
    of the file you wish to copy):


    ```

    cp filename /mnt/floppy

    ```


    You can then unmount the floppy and eject it from the drive. The new file on the
    diskette should now be accessible from your Windows machine.


    > The file will not be fully copied until *after* the umount command has been
    successfully executed.'
