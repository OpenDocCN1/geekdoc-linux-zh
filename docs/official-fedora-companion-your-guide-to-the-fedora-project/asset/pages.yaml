  md: '# 220 Appendixices


    Tip

    To change from the graphical login to a text login or vice versa after installation,
    as root you can edit the /etc/inittab file and change the line id:5:initdefault::
    5 stands for the graphical login, and 3 stands for the text login.


    # Problems with Server Installations and X?


    If you performed a server installation and you are having trouble getting X to
    start, you may not have installed the X Window System during your installation.


    If you want the X Window System, you can perform an upgrade to install X. During
    the upgrade, select the X Window System packages, GNOME, KDE, or both.


    # Problems When You Try to Log In?


    If you did not create a user account during the installation, you need to log
    in as root and use the password assigned to root. If you cannot remember your
    root password, you need to boot your system as linux single.


    If you are using GRUB, follow these steps:


    +   1. After you have loaded the GRUB boot screen, type e for edit.


    +   2. You will be presented with a list of items in the configuration file for
    the boot label you have selected. Choose the line that starts with kernel and
    type e to edit this boot entry as follows:


    +   3. At the end of the kernel line, add the following:


    ```

    linux single

    ```


    +   4. Press Enter to exit edit mode.


    +   5. After the GRUB screen has returned, type b to boot into single user mode.


    If you are using LILO:


    +   1. Press Ctrl+x to exit the graphical LILO screen and gain access to the LILO
    boot: prompt.


    +   2. Next, enter linux single at the LILO boot: prompt.


    After you have booted into single user mode using either GRUB or LILO and have
    access to the # prompt, you need to type passwd root, which allows you to enter
    a new password for root.


    At this point you can type shutdown -r now, and the system will reboot with your
    new password.


    If you cannot remember your user account password, you must log in as root. Then,
    type passwd username. This allows you to enter a new password for the specified
    user account.


    If you selected either the custom or workstation installation and do not see the
    graphical login screen, check your hardware for compatibility issues. The Hardware
    Compatibility List can be found at the following URL:


    ```

    http://hardware.redhat.com/hcl/

    ```'
