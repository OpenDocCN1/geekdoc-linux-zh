- img_proc: true
  md: '# Moving and Resizing the Panel


    Click on the first icon, the Layout icon, to change the location and size of the
    Panel. You will see a square with several panel-shaped buttons you can click to
    relocate the Panel. The Panel moves to the new location when you click Apply.
    You can also resize the Panel here by changing the Size slider. In our example,
    the Panel is resized to 73 percent of the width of the screen and placed at the
    center bottom edge (see Figure 3-14). You can also resize the height of the Panel
    to Tiny, Small, Normal, Large, or Custom.


    ![](img/67d9607982940021da1fe4247b9b224c_83_0.png)


    Figure 3-13: Moving and Resizing the Panel


    # Hiding the Panel


    You can configure the Panel to hide itself automatically when you start an application,
    or you can add Hide buttons to hide the Panel and then make it appear whenever
    you like. Click on the Hiding tab, and then set the options to your personal preference.
    For example, you can make Hide buttons appear on the right or left of the Panel
    by checking one of the Panel-Hiding Button boxes. When you click on one of these
    buttons, the Panel slides out of the way, leaving only the button behind, which
    you can click to make the Panel appear again. Figure 3-15 shows the Hiding options.


    # Customizing the Panel Menus


    Click on the Menus tab to configure the Panel menus (see Figure 3-16). If you
    want the Recent Documents option to appear on the Main Menu instead of as on the
    Panel (or in addition to that), you can check that option here and then click
    Apply. Now you have a Recent Documents selection on your Main Menu.


    If you''re really ambitious and fearless (since this gives you an easy way to
    mangle your Main Menu if you don''t know what you''re doing), you can even edit
    all of the selections in your Main Menu. Click on the Edit K Menu button to bring
    up the K Menu Editor, as shown in Figure 3-17.'
