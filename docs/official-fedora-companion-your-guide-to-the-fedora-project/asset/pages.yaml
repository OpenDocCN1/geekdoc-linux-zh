    # # Annoying Popups


    The first time you use Mozilla to visit a site that automatically pops up a window,
    Mozilla will ask you if you want to prevent Web sites from doing this (see Figure
    4-6).


    ![](img/67d9607982940021da1fe4247b9b224c_100_1.png)


    > To set preferences for controlling popups, open the Edit menu and choose Preferences.
    Under the Privacy & Security category, click Pop Popups. Would you like to block
    popups and set preferences now?


    ![](img/67d9607982940021da1fe4247b9b224c_100_2.png)


    Figure 4-6: First Popup Dialog


    If you don''t like to have Web sites pop up without your permission, click Yes.
    This will take you to the popup preferences window (see Figure 4-7). You can configure
    how Mozilla behaves regarding popup windows.


    # # More on Mozilla


