  md: '# Configuring System Time Zone


    To configure the system time zone, use the mouse to click the tab at the top of
    the dialog window Time Zone. You can change the time zone by clicking on the interactive
    map or by choosing the desired time zone from the list below the map (see Figure
    1-12). To use the map, click on the city that represents the desired time zone.
    A red X appears, and the time zone selection changes in the list below the map.
    Click Apply to save the changes.


    ![](img/67d9607982940021da1fe4247b9b224c_33_0.png)


    Figure 1-12: The Time Zone Tab


    If your system clock is set to use UTC (also known as Greenwich Mean Time or GMT),
    select the System Clock Uses UTC option. Other time zones are determined by adding
    or subtracting from the time zone.


    > If you are using a dual-boot system (for example, so that you can choose to
    boot Microsoft Windows or Fedora), then it is not wise to choose the system clock
    to UTC, because Windows does not have the same option and is likely to reset your
    clock to your local time, leaving one or both operating systems with the wrong
    time setting.


    Click OK to apply any changes that you have made to the date and time, the NTP
    daemon settings, and the time zone settings and exit the program.


