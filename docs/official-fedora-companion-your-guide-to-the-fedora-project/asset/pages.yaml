  md: '# Chapter 1 ✨ Getting Started 3


    +   **Command** — An instruction given to the computer, most often something you
    type at the keyboard.


    +   **Man page and info page** — Man (short for manual) and info pages give detailed
    information about a command or file (man pages tend to be brief and provide less
    explanation than info pages). To read the man page for the `su` command, for example,
    type `man su` at a shell prompt (or type `info su` for the info page, or `pinfo
    su` (pinfo is a friendlier version of info)). To close one of these, press q.


    +   **su and su --user** — The `su <user>` (switch to the user specified by `<user>`)
    command gives you instant access to other accounts on your system without having
    to log out and then in as the other user. One generally uses the command `su -otheruser`
    (substitute the name of the user for `otheruser`), because the dash `-` tells
    the system to the default settings for that user.


    +   **su and su** — When you switch by itself (or by itself), it asks you for
    the root password and switches you to your root account. This gives an experienced
    administrator access to important system files without having to log out and then
    log in as root. It can also be dangerous because root has the power to perform
    damage to the system, so use caution when you are logged in as root.


    # Before You Log In


    You can eliminate all the risk of serious accidental or malicious damage to your
    system by taking the time to understand the concepts in this section and apply
    its tips. It is especially important to consider our advice if you intend to connect
    your Fedora system to the Internet, or if you use your computer in any environment
    where others can get physical access to your workspace or computer. Read before
    you log in to your Fedora system the first time.


    # Why Create a User Account?


    You should create at least one user account during installation and log in as
    that user whenever you want to use Fedora. If you did not create a user account
    during installation, we urge you to read through this section and follow the instructions
    in "Creating a User Account" in the chapter.


    Here is why. As stated in the definition for privileges or rights earlier in the
    chapter, Linux allows you to do a task or prohibit you from doing a task depending
    on the privileges or rights you have as a user. A regular user can do everything
    you normally want to do with Fedora. The `root` user has all privileges and is
    not restricted from any tasks, even damaging ones. This should be reason enough
    to create a user account and avoid routinely logging in and using the system as
    the `root` user.


    The only time you really need to have `root` privileges is to make an important
    system-wide change, such as setting the time, adding a printer, or configuring
    your system to use certain hardware you might replace or install. Even then, you
    can log in as a normal user, and when you attempt to perform one of these special
    tasks (such as setting the time, date and time zone, as described later in this
    chapter), the system will prompt you for the `root` password for that one special
    task. You remain logged as a normal user by default, even though you'
  merge: -1
  pgno: 24
- img_proc: true
  md: 'have root privileges to finish the specific task at hand, such as adjusting
    the system date and time.


    # Your Programs Have Rights, Too


    Accidental damage is not the only risk. Every application you launch when you
    are logged in as root user has the same privileges as the root user. So when you
    use Fedora logged in as root, not only do you have the rights to wipe every file
    on your system, so does your email program, browser, instant messenger, word processor,
    and all the other programs you use. Granted, the applications you get with Fedora
    are specifically designed to protect you from maliciously designed web pages or
    dangerous emails that wreak havoc on other operating systems, but if you follow
    our advice to create and use a normal user account, your system will be safe even
    if a malicious program fails and exploits a weakness in one of the applications
    you use.


    # More Tips for the Justifiably Paranoid


    Whenever you create an account, you need to choose a password for that account.
    If you want your account to be secure (and most users will specially want their
    root account to be secure), be sure to choose a password nobody is likely to guess.


    Then don''t give password away — and there are many ways to get away of which
    you may be unsure.


    The movie Terminator 2: Judgment Day includes a scene where the Terminator robot
    (played by Arnold Schwarzenegger) seizes a station wagon by ripping out of the
    steering column with a powerful servo-controlled hand. John Connor, the young
    kid in the film (played by Edward Furlong) seizes the opportunity to teach the
    Terminator a lesson in security. He flips down the visor, catches the station
    wagon''s keys in midair as they drop from the owner natively stored them, and
    asks, "Are we learning yet? What you want to learn from this story is: It doesn''t
    matter how hard it is to guess your password if you write it down and tape it
    under your desk or to the bottom of your keyboard. If you want someone to know
    your password, don''t place a copy of it near your work area, no matter how ingenious
    you think your hiding place might be. If you really want your password to be secure,
    don''t use the password number of your monitor, or anything else you can read
    off a poster, sign, or item attached to or close to your desk. There may not be
    Terminator robots with the brute force to crack a password as cryptic as the serial
    number of your mouse, but there are plenty of John Connors out there who can flip
    over your mouse and read the serial number just as easily as one can flip down
    a visor and grab your keys.


    # Creating a User Account


    When you first booted Fedora after the installation, you were given the opportunity
    to create a user account. If you bypassed that step, shame on you. If you created
    a user account during this part of the installation process, congratulations,
    you did the right thing! You can skip this section and go to the section titled
    "Logging in."


    If you did not create at least one user account (including the root account),
    you should do so now. This is one time you will have to log in as the root user,
    because that is the only way to create a normal user account if you have no normal
    user accounts on your system.'
