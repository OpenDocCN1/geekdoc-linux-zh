  md: '# Mailing Lists


    The best way to get started is to join the fedora-list@redhat.com mailing list.
    Ask questions and provide answers if you know them. remember to be polite. And
    when you are asking questions, remember to include as much detailed information
    about your problem as may be necessary to understand what you need. Once you receive
    help, be on the alert for others who may experience the same problems, and offer
    help whenever you can. One good deserves another.


    The primary lists of interest are:


    +   - fedora-list—For users of Fedora Core releases

    - fedora-test-list—For testers of Fedora Core test releases

    - fedora-devel—For developers

    - fedora-docs-list—For those interested in the documentation projects


    Visit www.redhat.com/mailman/listinfo/fedora-list to join a list or to view archives
    of threads and conversations.


    # Chat


    You can join live discussions or start live discussions yourself via Internet
    Relay Chat (IRC). IRC is similar to Instant Messaging in that you chat with others
    in real-time. The primary difference is that people generally use IRC to chat
    in a group, although you can use IRC to chat privately, too.


    If you want to join a Fedora chat on IRC, use an IRC client to log on to the freenode
    IRC network. Then join one of the Fedora channels, such as the main #fedora channel,
    or the #fedora-devel channel if you''re a developer. There are also IRC channels
    for individual projects within Fedora.


    To learn how to use IRC, refer to the IRC Tutorial at http://irchelp.org.


    You can get more information and links about IRC and the mailing lists at the
    URL http://fedora.redhat.com/participate/communicate/


    # Bug Reporting


    Another way to become a contributor is to file bug reports whenever you run across
    a problem. Even if you''re not a developer, you can help the community even if
    someone has already filed a report about the bug you are experiencing. Simply
    search the database of bug reports and add any additional information about the
    problem that others may have omitted.


    If you want to help out with bug reports, visit http://bugzilla.redhat.com/bugzilla/
    to get started with bugzilla.'
  merge: -1
