  md: '# Chapter 1 Getting Started 17


    +   - Modem connection — A modem connection uses a modem to establish a connection
    to the Internet. Digital data is modulated into analog signals and sent over phone
    lines. To configure this type of connection, see the following section, "Establishing
    a Modem Connection," for more information.


    +   - Ethernet connection to a cable/XDSL/wireless router — Multiple-computer
    homes often connect all the computers to the Internet via an inexpensive cable/DSL
    router, which may also include wireless capability. These routers not only make
    it easy to extend Internet access to all PCs from a single source such as a cable
    modem or DSL model, they provide some firewall capabilities, too (protection from
    malicious attacks on your computers).


    You will probably have to configure your system differently when you use a DSL
    router than you connect directly to a DSL modem. See the section, "Establishing
    an Ethernet Connection to a Cable/XDSL Modem, or to a Cable/XDSL Router, or to
    a Local Network"


    +   - Cable connection — A cable modem uses the same coaxial cable that your TV
    travels on to transmit data. Most Internet providers require you to install an
    Ethernet card (or some other Ethernet adapter, such as a USB adapter) in your
    computer that connects to the cable modem. Then, the cable modem connects to the
    coaxial cable where you get your cable television signal.


    +   - xDSL connection — An xDSL (Digital Subscriber Line) connection uses high-speed
    transmissions through phone lines. There are different types of DSL such as ADSL,
    IDSL, and DSL. The term xDSL means any type of DSL connection. Like cable, DSL
    providers also require you to install an Ethernet adapter, such as a USB adapter)
    in your computer that connects to the DSL modem. Then, the DSL modem connects
    to the phone line, usually through a filter or splitter device provided by the
    DSL provider or phone company.


    +   - Wireless connection — If you are connecting your Fedora computer to a wireless
    access point (WAP) or peer-to-peer (also called ad-hoc) network with a wireless
    (802.11x) network card, then you need to configure your wireless device.


    ![](img/67d9607982940021da1fe4247b9b224c_38_0.png)


    Figure 1-19: The Network Configuration Tool'
