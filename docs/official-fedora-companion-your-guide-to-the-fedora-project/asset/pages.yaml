  md: '# CD-Rs and CD-RWs


    CD-writable (CD-R) drives have grown in popularity as an inexpensive way to back
    up and archive data, including applications, personal files, and even multimedia
    (audio/video and still image) presentations. Fedora includes several tools for
    using CD-Rs and CD-rewritable (CD-RW) drives.


    # Using Nautilus


    One of the easiest ways to write data to a CD-R or CD-RW is to use the Nautilus
    file manager and a special location burn://:/. Nautilus should automatically pop
    up a window set to the location burn://:/ when you insert a CD. If it doesn''t
    work that way with your particular CD recorder or installation, you can always
    open up a Nautilus window and type in the location yourself.


    Open a new Nautilus window any way you prefer. Two easy ways to open a new window
    are to double-click your home icon or right-click on the desktop and backspace
    New Window from the pop-up menu.


    Now click on the Location field, and possibly over whatever is listed there (probably
    the path to your home directory). Enter in its place the location burn://:/ and
    press Enter. Notice that a new icon appears on your toolbar, entitled Write to
    CD (see Figure 8-9).


    ![](img/67d9607982940021da1fe4247b9b224c_163_0.png)


    Figure 8-9: Using Nautilus to Write to a CD-R or CD-RW


    Now drag and drop into this burn whatever files or directories you have that you
    want to save to your CD-R or CD-RW (see Figure 8-10).


    Click on the Write to CD button, after which you would see a window pop up that
    looks like the one in Figure 8-11. Most people use CD-media, which means you can
    write information to the CD only once. (Although you can add more data later if
    you have room left, you can''t erase what''s on the CD you''ve written it.) If
    you have a rewritable CD in your drive, and your drive is capable of rewriting
    CDs, then you will want to check the box that says Erase CD.'
