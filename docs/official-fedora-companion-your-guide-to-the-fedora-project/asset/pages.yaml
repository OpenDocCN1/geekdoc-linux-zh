    # # Logging In


    When you log in, you are introducing yourself to the system (also called *authentication*).
    If you type the wrong username or password, you will not be allowed access to
    your system until you provide the proper username or password.


    During installation, if you selected graphical as the login type, you will see
    a graphical login screen like the one in Figure 1-6. Our sample machine name is
    *Toluca*, but unless you have chosen to give your machine its own hostname, which
    is primarily used in a network setting, your machine name will probably be *localhost*.


    > Caution

    Because your Fedora system created the root account during installation, some
    new users are tempted to use only account for all their activities and now and
    in the future. This is a dangerous idea, because the root account is allowed to
    do anything on the system. The section earlier in the chapter "Before Log In"
    explains why this is so important. It is better to follow the instructions in
    the "Creating a User Account" section and use that account on a regular basis.


    Type the name of the user account you created either during installation, or when
    you followed the steps in the "Creating a User Account section and press Enter.
    When you are asked for the password, type the password you created for this account
    and press Enter (see Figure 1-7).


    > Note

    Like Unix, Linux is case-sensitive. This means that typing *carlotta* refers to
    a different account than if you typed *Carlotta*. This also applies to your password—you
    must type it exactly as you created it, with the same upper and lowercase letters,
    or the system will not recognize it as the correct password.


    Logging in from the graphical login screen automatically starts the graphical
    desktop for you.'
