    After the diskette has been formatted, a final window appears to inform you of
    a successful format. Click OK, remove the diskette, and click Quit to close the
    application.


    # Using mke2fs


    The mke2fs command is used to create a Linux ext2 file system on a device such
    as a hard drive partition or (in this case) a floppy diskette. mke2fs essentially
    formats the device and creates an empty, Linux-compatible device that can then
    be used for storing files and data.


    Insert your diskette into the drive and issue the following command at a shell
    prompt:


    ```

    /sbin/mke2fs /dev/fd0

    ```'
