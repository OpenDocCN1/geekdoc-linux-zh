    # More Commands for Reading Files


    You have already been introduced to several basic shell commands for reading files
    in text editors. The following sections describe a few.


    # The head Command


    You can use the head command to look at a beginning of a file. The command syntax
    is head filename.


    head can be a useful command, but because it is limited to the first several lines,
    you will not see how the file actually is. By default, head will read only the
    first ten lines of a file. You can change the number of lines displayed by specifying
    a number option with the -n switch, as shown in the following command.


    ```

    [carlotta@toluca carlotta]$ head -n 20 filename

    ```


    # The tail Command


    The reverse of head is tail. Using tail, you can view the last ten lines of a
    file. As with head, you can specify how many lines to view:


    ```

    [carlotta@toluca carlotta]$ tail -n 20 filename

    ```


    # The grep Command


    The grep command is useful for finding specific character strings in a file. For
    example, if you want to find every reference made to coffee in the file sneakers.txt,
    you would type the following:


    ```

    [carlotta@toluca carlotta]$ grep coffee sneakers.txt

    ```'
