- img_proc: true
  md: '# Red Hat and the Linux community have done the work — you just install Fedora


    Red Hat has collected everything you need to install and configure Fedora and
    start participating in this brand-new, community-driven project. There''s no downloading,
    no looking for documentation, no wondering. Instead, you get official information
    from the experts at Red Hat, installation and troubleshooting advice, dozens of
    applications, security tips, and along with the exclusive Fedora distribution
    on two CD-ROMs.


    ![](img/67d9607982940021da1fe4247b9b224c_291_0.png)


    # Fedora makes it easy for you


    +   * Customize the friendly graphical Bluecurve desktop

    * Install a browser, get online, and use email and instant messaging

    * Create personal audio and data CD-ROMs

    * Start using the OpenOffice.org desktop tools

    * Configure networks, firewalls, and printers

    * Set up appropriate security

    * Access and use shell prompts and manage users

    * Contribute to the Fedora open source project


    | TWO CD-ROMS INCLUDE |

    | Linux* kernel, GNU C compiler, and Bluecurve* desktop |

    | Samba Windows file/print sharing and CUPS print service |

    | Apache Web server, Sendmail server, and BIND DNS server |

    | OpenOffice.org desktop productivity suite |


    Economical!

    The Fedora distribution on CD-ROM, plus detailed installation and configuration
    instructions, troubleshooting help, and—at one extremely low price!


    # Loaded!


    Feature-packed two-CD distribution includes Bluecurve desktop, instant messaging,
    email and browser applications, OpenOffice.org desktop productivity suite, and
    dozens more.


    # More online!


    Complete installation advice, including all options: Linux for laptops; using
    the file system, GIMP, and the Windows System: updating; the boot process; and
    much more at www.wiley.com/combooks/petoley


    Nick Petley, the founding editor of LinuxWorld and VarLinux.org, is now the Linux
    analyst for Evans Data Corporation. He helped establish the LinuxWorld Expo and
    created his popular Golden Penguin Bird keynote show.


    | Reader Level |

    Beginning to Intermediate |

    Shelving Category |

    Operating Systems/ Unix & Linux |

    $19.99 USA |

    $28.99 Canada |

    £13.99 UK |


    ![](img/67d9607982940021da1fe4247b9b224c_291_1.png)'
  merge: -1
  pgno: 291
