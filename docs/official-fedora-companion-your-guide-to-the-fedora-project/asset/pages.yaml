  md: '# Preparing to Install


    You should now see a screen preparing you for the installation of Fedora (See
    Figure B-22). For your reference, a complete log of your installation can be found
    in /root/install.log after you reboot your system.


    If, for some reason, you rather not continue with the installation process, this
    is your last opportunity to safely cancel the process and reboot your machine
    without any changes being made to your system. After you click Next, partitions
    will be written and packages will be installed—and your hard drive(s) will be
    rewritten. If you wish to install the installation, you should reboot now before
    any existing information on any hard drive is rewritten.


    To cancel this installation process, press your computer''s Reset button or use
    Ctrl+Alt+Delete key combination to restart your machine.


    ![](img/67d9607982940021da1fe4247b9b224c_227_0.png)


    **Figure B-22**: About to Install


