- img_proc: true
  md: 'artwork. It includes templates, forms, and wizards for creating basic professional
    documents and presentations quickly. The OpenOffice.org suite is able to read,
    edit, and create files in several formats, including files that are commonly associated
    with Microsoft Office, such as .doc (for Microsoft Word files), .xls (for Microsoft
    Excel files), and .ppt (for Microsoft PowerPoint files).


    Be warned, however, that OpenOffice does not always import Microsoft Word documents
    perfectly. If someone sends you a Word document, the document may appear differently
    to you than it would if you were using Microsoft Word. The differences tend to
    become more acute as the document formatting becomes increasingly complex. Keep
    this in mind if you decide to save the document and return it to someone using
    Word—what you get back may not be what they hoped. If you intend to share documents
    with people using Microsoft Word, you might find it more useful to save documents
    in Rich Text Format. Rich Text Format is more portable, so you are less likely
    to lose formatting information as you pass documents back and between OpenOffice
    and Microsoft Word.


    Table 7-1 shows the different types of files you can use and tasks you can accomplish
    with the OpenOffice.org suite.


