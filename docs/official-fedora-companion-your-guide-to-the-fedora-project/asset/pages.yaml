    # Synchronizing with the Palm Pilot or Compatible Device


    If you own a handheld device like a Palm Pilot, Handspring, or other Palm-compatible
    device, you can synchronize the information in Evolution with your handheld.


    The first thing you need to do is tell Evolution about your handheld device. You
    need to know the correct device definition for your handheld, which depends on
    how you connect your handheld to your computer. In most cases, you will connect
    your handheld to your computer via a serial port connector or a USB port connector.
    You can also use an infrared connection or a network connection to a handheld,
    but those are beyond the scope of this chapter. Take a look at Table 7-2 and make
    a mental note of which device definition you will use.


    Table 7-2: Possible Handheld Connections


    | Port | Device Definition |

    | You connect your handheld to the first serial port | /dev/ttyS0 |

    | You connect your handheld to the second serial port | /dev/tty1 |

    | You use a USB connector | /dev/usb/ttyUSB0 |

    | You use a USB connector but the preceding definition doesn''t work | Try /dev/usb/ttyUSB1
    or /dev/usb/ttyUSB2, etc. |'
