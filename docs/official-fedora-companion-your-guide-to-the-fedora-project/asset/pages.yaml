    up your Ethernet connection in compliance with how the router works. Here are
    the issues to keep in mind:


    +   * If you are connecting to a cable/xDSL router, find out how the cable/xDSL
    router provides your IP address automatically using DHCP. The documentation for
    the router should tell you.


    +   * If you are using xDSL and connecting to a cable/xDSL router, you must configure
    your router, not the local machine, to make the PPPoE connection to your Internet
    Service Provider. Therefore, do not follow the instructions for establishing a
    PPPoE connection in the section "Establishing an xDSL Connection" later in the
    chapter, but instead configure PPPoE at your router. You can consult the documentation
    for your router details, but most routers have a Web-based interface for configuring
    PPPoE.


    To add an Ethernet connection, start the Network Administration tool by clicking
    the Main Menu button ↩ System Settings: Network, and then follow these steps:


    +   1. Click the New button in the toolbar at the upper left. Select Ethernet
    Connection from the Device Type list. See Figure 1-26.


    +   2. If you have already added the network interface card to the hardware list,
    select it from the Ethernet card list (see Figure 1-27). Otherwise, select Other
    Ethernet Card to add the hardware device.


    The installation program usually detects supported Ethernet devices and prompts
    you to configure them, if you configured any Ethernet devices during the installation,
    they will already appear in the hardware list on the Hardware tab.'
