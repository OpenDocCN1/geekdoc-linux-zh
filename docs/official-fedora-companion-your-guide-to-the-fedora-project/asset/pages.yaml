  md: '# The Home Icon


    The Home Icon opens Nautilus and takes you to your home directory, which is either
    under the /home directory or /root if you are logged in as root. If your user
    name is John, for example, your home directory would be /home/john. Additionally,
    this icon is named after the user; so, in our example, the Home icon would be
    called John''s Home (refer to Figure 2-1).


    Your home directory is the default location for all of a user''s files. Whenever
    you create a new file of any type in an application (such as OpenOffice.org Writer)
    and click Save, the Save dialog that appears will show your home directory as
    the default directory to save in (see Figure 2-8).


    ![](img/67d9607982940021da1fe4247b9b224c_55_0.png)


    Figure 2-8: Your Default Save Directory– Home


    You can save a lot of time browsing through directories by saving your files in
    your home directory (or subdirectories).


    Of course, saving all of your files within your home directory itself is a bad
    idea — that is what subdirectories are. To create a subdirectory within your home
    folder, you can do one of the following:


    +   * From the Nautilus file manager, choose File New Folder.


    +   * Right-click on the desktop or in a folder window (such as Nautilus) and
    choose New Folder.


    Regardless of which method you prefer to use, the new folder appears with its
    default name (untitled folder) selected; type in a name for your new folder and
    then press Enter or click another part of the interface to accept the new name.'
  merge: -1
