  md: '# Logging Out


    When you have finished working and want to quit the graphical desktop, you are
    presented with the choice of logging out of the graphical desktop (leaving the
    system running), restarting the machine, or halting the system completely.


    To quit the graphical desktop, select the Log Out menu item from the Main Menu.
    This will bring up a dialog that presents you with the options just mentioned.'
