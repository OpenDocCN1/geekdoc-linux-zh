- img_proc: true
  md: '# Changing Directories with cd


    Changing directories is easy as long as you know your current directory and how
    location relates to where you want to go.


    To change directories, use the `cd` command. Typing this by itself always returns
    to your home directory; moving to any other directory requires a pathname.


    You can use *absolute* or *relative* pathnames. Absolute paths start at the top
    with `/` (referred to the root directory) and then look down through the file
    system from there the requested directory; relative paths look in your current
    directory and then down from there. The following directory tree illustrates how
    `cd` operates:


    ```

    /n/directory1

    /directory1/directory2

    /directory1/directory2/directory3

    ```


    If you are currently in `directory3` and you need to switch to `directory1`, you
    need to move up in the directory tree.


    Executing the command `cd directory1`, while you are in `directory3` presents
    you with an error message explaining that there is no such directory. This is
    because there is no `directory1` within `directory3`


    To move up to directory1 you have to type the absolute pathname, as follows:


    ```

    [carlotta@toluca carlotta$] cd /directory1

    ```


    This is an example of an absolute path; it tells Linux to start at the top (/)
    and look down until it finds directory. A path is absolute if the first character
    is a `/`. Otherwise, it is a relative path. Absolute paths take you to any directory
    from any directory. Relative paths take you only to directories below your current
    one.


    Use the following exercise to test what you have learned so far regarding absolute
    and relative-type paths.


    +   1. From your home directory, use the relative path:

    [carlotta@toluca carlotta$] cd ../../etc/X11

    2. After using the full command in the example, you should be in the directory
    X11, which is where you will find configuration files and directories related
    to the X Window System.

    3. Go up one level to get your login directory''s parent directory (probably /home).

    4. Then go down to that directory''s parent (which is the root, or /, directory).

    5. Then go down to the `etc` directory.

    6. Finally, go to the X11 directory.


    Take a look at your last `cd` command. You told your system to:


    Conversely, using an absolute path would get you to the `/etc/X11` directory more
    quickly. For example:


    ```

    [carlotta@toluca carlotta$] cd /etc/X11

    ```


    Absolute paths start from the root directory (/) and move down to the directory
    you specify.'
  merge: -1
  pgno: 177
- img_proc: true
  md: '# Chapter 9 ♦ Command-Line Power: Shell Prompt Basics 157


    Always make sure you know which working directory you are before you state the
    relative path to the directory or file you want to get. You do not have to worry
    about your position in the file system, though when you state the absolute path
    to another directory or file. If you are not sure where you are, type pwd and
    your current working directory will be displayed.


    Table 9-1 shows some of the cd command options available.


    # Table 9-1: cd Options


    | Command | Function |

    | --- | --- |

    | cd | Returns to your home directory. |

    | cd ~ | Also returns to your home directory. |

    | cd / | Takes you to the system''s root directory. |

    | cd /root | Takes you to the home directory of the root, or superuser, account
    created at; you must be the root user to access this directory. |

    | cd /home | Takes you to the home directory, where login directories are usually
    stored. |

    | cd .. | Moves you up one directory. |

    | cd ~otheruser | Takes you to otheruser''s login directory, if otheruser has
    granted permission to do so. |

    | cd /dir1/subdirfoo | Regardless of which directory you are in, this absolute
    path takes you straight to subdirfoo, a subdirectory of dir1. |

    | cd ../dir3/X11 | This relative path takes you two directories to the root directory,
    then to dir3, then to the X11 directory. |


    Now you are starting to understand how to change directories, what happens when
    you change to root login directory (the superuser account). Type cd /root.


    If you are not logged in as root, you are denied permission to access that directory.
    Denying access to the root and other users'' accounts (or login directories) is
    one way your Linux system prevents accidental or malicious tampering. See the
    "Ownership and Permissions" section later in this chapter for more information.


    To change the root login and root directory, use the su command. For example:


    ```

    [carlotta@toluca~]$ su

    Password: your_root_password

    [root@toluca ~]# cd /root

    [root@toluca /root]#

    ```


    The su command switch allows you to temporarily log in as another user. When you
    type su by itself, you become root (also called the superuser) while still inside
    your login shell (user''s home directory). Typing su makes you become root with
    root''s login shell as if you had logged in as root originally.'
