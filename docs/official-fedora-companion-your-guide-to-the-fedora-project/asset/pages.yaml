  md: '# Linux Commands for the MS-DOS User


    Do you find it natural to open up an MS-DOS prompt window and type commands? Don''t
    worry: This condition is perfectly normal and does not usually need any special
    medical treatment. Some even consider it a talent.


    Here''s how to put your natural ability to even better use. Try doing the same
    things at the Linux shell prompt you used to do at the MS-DOS prompt. It''s easy.
    Many of the Linux shell prompt commands are similar to the commands you are used
    to typing in MS-DOS. In fact, some commands are identical.


    This appendix provides common commands used at the MS-DOS prompt in Windows and
    their counterparts in Linux. Basic examples of how the commands are used at the
    Linux shell prompt are also provided. Note that these commands usually have a
    number of options. To learn more about each command, read its associated man page.
    For example, type man ls at the shell prompt to read about the ls command. We
    added one of those options in our example below to make the ls command perform
    a bit more like the DOS dir command.'
  merge: -1
  pgno: 254
