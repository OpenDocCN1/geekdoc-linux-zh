    \ background task (paused or not) back into the foreground. If the task you paused\
    \ had control of the terminal (such as a full-screen text-mode editor), it will\
    \ reappear and take control of the terminal once again. This works only if you\
    \ put a task in the background with the bg command. |\n\nContinued"
  merge: -1
  pgno: 262
- img_proc: true
  md: '# Table G-3 (continued)


    | Shortcut | What It Does |

    | --- | --- |

    | Ctrl-s | Stops the display of information on the terminal. If you are listing
    a great deal of information to the screen (you cat a large file, example), this
    will stop the scrolling of that information and freeze the display at that point.
    |

    | Ctrl-q | Resumes the display of information after you have stopped it with Ctrl-s.
    |

    | Ctrl-c | Kills the current application (works with some but not all text-mode
    applications). |

    | Ctrl-d | Logs out of the end of a terminal or instead of having to type exit
    or logout. |

    | Ctrl-a or Home | Moves the cursor to the beginning of the line. This works in
    the URL field in Mozilla, too. |

    | Ctrl-e or End | Moves the cursor to the end of a line. This works in most text
    editors and in the URL field in Mozilla, too. |

    | Ctrl-l | Clears the terminal. This shortcut does the same as typing clear at
    a command line. |

    | Ctrl-u | Clears the current line. If you are working in a terminal, use this
    shortcut to clear the current line from the cursor all to the end of the line.
    |

    | Ctrl-f or Right Arrow | Moves forward one character. This works in some text
    editors and the URL field in Mozilla, too. |

    | Ctrl-b or Left Arrow | Moves backward one character. This works in some text
    editors and the URL field in Mozilla, too. |

    | Shift-PgUp | Scrolls the terminal output. Note that you can also use this shortcut
    to scroll up through your boot messages if there is not currently any output at
    the terminal. |

    | Shift-PgDwn | Scrolls the terminal output down (see Shift-PgUp). |


    # Table G-4: System Prompt Shortcut Characters


    | Character | What It Represents |

    | --- | --- |

    | ~ (tilde character) | Stands for the home directory for the currently logged
    in user. For example, if root is logged in, typing cd ~ will take you to the /root
    directory (which is root''s home directory). If you are logged in joeuser, typing
    cd ~ will take you to /home/joeuser. |

    | . (dot) | Stands for the current working directory. For example, typing ./program
    attempts to execute the program file in the current working directory. |

    | .. (two dots) | Stands for the parent of the current working directory. For
    example, if you''re in the /home/user directory, typing cd .. will take you up
    to the /home directory. You can go up multiple directories by alternating / and
    the two dots. For example, you can type cd ../ to go up two levels of directories.
    |'
  merge: -1
  pgno: 263
- img_proc: true
  md: '| Character | What It Represents |

    | --- | --- |

    | * (asterisk) | Also called a wildcard character, the asterisk allows you to
    shorten file names in commands. To use the wildcard, you can simply type as much
    of the file or directory''s name needed in the current working directory and then
    type * to represent the rest of the file. For example, if you have two files in
    a directory, named `file1111` and `file2222`, you can simply type `file1*` and
    Fedora will know that you mean `file1111`. |'
