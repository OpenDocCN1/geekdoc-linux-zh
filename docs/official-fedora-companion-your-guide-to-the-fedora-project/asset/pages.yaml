  md: '# Getting Productive

    With Fedora


    Fedora includes powerful applications for viewing, creating, editing, and managing
    documents, spreadsheets, presentations, and much more. Whether you are preparing
    for a business or school presentation, writing a formal letter, or opening a document
    from an email attachment, Fedora has a tool that suits your needs.


    This chapter shows you how to get up and running with the OpenOffice.org suite
    of applications, how to do a couple of neat tricks with OpenOffice, and how to
    view PDF documents.


    # The OpenOffice.org Suite


    OpenOffice productivity suites are collections of applications designed to save
    time and assist users at the office, at school, and at home. Usually, productivity
    suites are graphical and include such applications as word processors, spreadsheets,
    and presentation utilities. The applications that compose a productivity suite
    are integrated—meaning that you can, for example, write a document with an embedded
    created by the spreadsheet application as well as a slide from a graphical presentation
    application. Integration of the software that makes a productivity suite helps
    you give impact to your presentations, lectures, or printed material.


    Fedora includes a powerful business productivity suite called OpenOffice.org,
    which incorporates several complementary applications into one integrated package.
    Using OpenOffice.org is much faster and easier learning complex tags and code
    to format your documents and presentations.


    The OpenOffice.org suite allows you complete control over the layout and content
    of your documents and lets you see the results as you edit. This real-time, visual
    form of document formatting is called what you see is what you get (or WYSIWYG—pronounced
    “wizzywig”) editing.


    # OpenOffice.org Features


    The OpenOffice.org suite contains several applications for creating and editing
    documents, spreadsheets, business presentations, and'
  merge: -1
