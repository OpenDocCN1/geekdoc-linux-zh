  md: '# Formatting a Diskette


    To use a diskette specifically with Fedora, you need to format the disk using
    the ext2 file system, ext2 is one of the file systems supported by Fedora and
    is the default method used for formatting diskettes.


    Formatting a diskette erases all of its contents. Be sure to back up any files
    that you need before performing any of the following operations on your diskettes.


    After you have created an ext2 file system on the diskette, you can manipulate
    its contents in the same ways that you manipulate directories and files on your
    hard drive.


    If you''re wondering why a floppy should be formatted with ext2 rather than ext3,
    it''s because the only real difference between ext2 and ext3 is journaling, which
    increases the size of the file system. Because diskettes are so small, they don''t
    require journaling features (or the increased size of the file system), so ext2
    should be used instead of ext3 for diskettes.


    # Using gfloppy


    To start gfloppy, click the Main Menu button System Tools -> Floppy Formatter
    (or, from a shell, you use /usr/bin/gfloppy). As shown in Figure 8-4, the gfloppy
    interface has a few options.


    The default settings are sufficient for most users and needs; however, you can
    format a diskette with an MS-DOS file system if you desire. You can also choose
    the density of your floppy disk (if you are not using the usual high-density 3.5"
    1.44MB diskette). You can also elect to quick format the disk if it was previously
    formatted as ext2.


    ![](img/67d9607982940021da1fe4247b9b224c_159_0.png)


    Insert a diskette and change the settings to suit your needs; then click Format.
    The status box appears on TOP of the main window, showing the status of formatting
    and verifying (see Figure 8-5). When it is complete, you can eject the disk and
    close gfloppy.'
