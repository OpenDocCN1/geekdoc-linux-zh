    # Firewall Configuration


    Fedora offers firewall protection for enhanced system security. A firewall exists
    between your computer and the network and determines which resources on your computer
    remote users on the network access. A properly configured firewall can greatly
    increase the security of your system.


    Choose the appropriate setting for your system: No firewall or Enable firewall
    (see Figure B-15). If you''re not sure which to pick, you are probably better
    off if you enable the firewall, especially if you expect to connect your computer
    directly to the Internet (via modem, for example). These choices are discussed
    in more detail in Chapter 10.'
