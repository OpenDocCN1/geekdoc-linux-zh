    # Viewing PDFs


    A PDF (Portable Document Format) file is an electronic image of a document. PDF
    captures formatting information from a variety of desktop publishing applications,
    making it possible to send formatted documents and have them appear on the recipient''s
    monitor or printer as they were intended.


    The easiest way to view a PDF file is to locate using Nautilus and then double-click
    on the icon for the PDF file. Open a Nautilus window, which you can do by double-clicking
    on the Home icon on your desktop. Then click the Location field, delete the path
    that appears there (it should be pointing to your home directory by default),
    and type the following (see Figure 7-11):


    ```

    /usr/share/doc/pam-0.77/pdf

    ```


    ![](img/67d9607982940021da1fe4247b9b224c_146_0.png)


