  md: '# Chapter 3 + The KDE Bluecurve 55


    You can do all this and more from one integrated interface. In essence, Konqueror
    becomes a navigation tool for your desktop experience. Konqueror is a lot like
    Nautilus (see Chapter 2). Konqueror has a side panel that provides you with things
    like a tree view of your directories and bookmarks, a history of the places you''ve
    visited with Konqueror, and more.


    To start Konqueror as a file manager, double-click on your home directory icon.
    Once Konqueror appears, you can navigate through your home directory or the rest
    of the file system. Click on the Up Arrow icon to move up one directory (to the
    folder that contains your current folder, if exists). You can also double-click
    on a folder icon to view the contents of that folder. You can click the Back button
    to go back to where you were last.


    To return to your home directory, click Home.


    When you navigate through your file system, you can see where you are looking
    at the Location field. You can also pick a directory in the Location field and
    press Enter if you want to go to that location. You can also see where you are
    going by watching the tree view in the left panel, which tracks your movements
    through folders.


    You can open another Konqueror window by selecting Location -> New Window. After
    you have another Konqueror window, you can drag and drop files between windows.


    If you prefer not to have multiple windows open, you can open a tabbed view by
    selecting Window -> New Tab, or you can press Ctrl+Shift-N. You can also split
    the Konqueror window into two panes by selecting Split View Left/Right or Split
    View Top/Bottom, depending on how want you want to split the view. See Figure
    3-5, which has two tabbed views, one of which has a split view.


    ![](img/67d9607982940021da1fe4247b9b224c_76_0.png)


    Figure 3-5: Konqueror Tabs and Split Views


    You can drag and drop files between two windows, or two views. When you drag a
    file from one directory to another, you will be asked what operation you want
    to perform—copy, move, create a link, or cancel. If you want to bypass the question,
    the following points show how to move, copy, and link files directly.'
  merge: -1
  pgno: 76
