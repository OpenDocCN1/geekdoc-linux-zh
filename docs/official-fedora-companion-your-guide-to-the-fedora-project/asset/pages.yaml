    # Browser Plugins


    Once you know your way around the browser, you may notice that you visit some
    Web sites that tell you that you need this or plugin to view all of the content
    on that site. The most popular plugins you need are Macromedia Flash, Java, and
    a media player like player to view movie-clips.


    With the exception of a general purpose plugin called mozplugger, you have to
    download browser plugins from the Internet. These plugins are updated frequently,
    keep in mind that the versions you find on the Internet may not match those of
    ours. Also note that the Web sites where you download plugins may change, so you
    may not be able to follow the exact instructions we have outlined in order to
    get the latest plugin. The solution is easy. Whenever the Web site doesn''t seem
    to match the instructions in this book, use common sense and follow the instructions
    on the Web site, instead.


