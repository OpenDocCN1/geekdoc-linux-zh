  md: '# 232  Appendices


    +   * Automatic Partitioning—Choose Keep All Partitions and use existing free
    space. This option leaves your Windows partitions on the hard drive and partitions
    the free space or additional hard drive for Fedora.


    +   * Manual Partitioning with Disk Druid—Do not delete the existing Windows partitions
    (they are the partitions of type vat). Create your Linux partitions on the additional
    hard drive or in the free space you have reserved for Fedora.


    +   * Manual Partitioning with fdisk—This is similar to using Disk Druid except
    you will not have the graphical interface. The basic procedure is the same. Do
    not delete the existing partitions of type FAT16, FAT32, or NTFS. Create your
    Linux partitions on the additional hard drive or in the free space you have reserved
    for Fedora.


    # The Boot Loader


    When you are at the Boot Loader installation screen during the Fedora installation,
    choose to install the boot loader. You can use a different boot loader to boot
    both Fedora and Windows.


    Fedora does not support boot loaders other than GRUB or LILO. The Fedora installation
    program usually detects Windows and automatically configures the boot loader (GRUB
    or LILO) to boot either Fedora or Windows. This can be seen on the boot loader
    screen of the installation program. An entry named DOS appears in the list of
    operating systems to boot.


    # Post-Installation


    After the installation, whenever you start the computer, you can indicate whether
    you want to start Fedora or the other operating system from the boot loader screen.
    Choose Fedora to boot into Fedora or choose DOS to boot into Windows.


    If you did not partition all the free space on your hard drive for Fedora, you
    can partition it for Windows after installing Fedora. You can use parted or fdisk
    to create these partitions.


    parted is easier to use than fdisk because of the interface and the commands used.
    For example, to view the partition table, you type print parted instead of typing
    p in fdisk.


    > It is highly recommended that you use parted or fdisk to create partitions after
    installing Fedora. Other partitioning software has been known to change the partitioning
    table of the hard drive and move the Linux partitions. If this happens, the boot
    loader will not be able to find the Linux partitions and will not boot into Fedora.


    If you formatted the Windows partitions in NTFS format, this method will not work'
