  md: '# 192 Appendixes


    If you chose to partition manually with Disk Druid, see the “Partitioning with
    Disk Druid” sec- a bit later in this chapter.


    # Recommended Partitioning Scheme


    We recommend that you create the following partitions:


    +   * **A swap partition (at least 32MB)** — Swap partitions are used to support
    virtual mem- ory. In other words, data is written to a swap partition when there
    is not enough RAM to store the data your system is processing. The size of your
    swap partition should be twice your computer’s RAM, or 32MB, whichever is larger.


    For example, if you have 1GB of RAM or less, your swap partition should be at
    least equal to the amount of RAM on your system, up to two times the RAM. For
    more than 1GB of RAM, a maximum of 2GB of swap is recommended.


    +   * **A /boot partition (100MB)** — The partition mounted on /boot contains
    the system kernel (which allows your system to boot Fedora), along with files
    used during the bootstrap process. Due to the limitations of many PC BIOSes, creating
    a small parti-tion to hold these files is a good idea. For most users, a 100MB
    boot partition is sufficient.


    Do not create /boot partition as an LVM partition type. The boot loaders included
    with Fedora cannot read LVM partitions and you will not be able to boot your Fedora
    system.


    If your drive has more than 1024 cylinders (and your system was manufactured more
    two years ago), you may need to create /boot partition if you want the root (/)
    parti-tion to use all of the remaining space on your hard drive.


    +   * **A root (/) partition (1.5–4.5GB)** — This is where the root / directory
    will be located. In this setup, all files (except stored in /boot) are on the
    root partition. A 1.5GB root partition will permit the equivalent of a personal
    desktop or workstation install-ation (with very little free space), while a 4.5GB
    root partition will let you install every package.


    # Partitioning with Disk Druid


    The partitioning tool used is Disk Druid. With the exception of esoteric selections,
    Disk Druid can handle the partitioning requirements for a typical installation.
    If you choose automatic partitioning and select Review, you can either accept
    the current settings (click Next) or modify the setup using Disk Druid.


    At this point you must tell the installation where to install Fedora. You do this
    by defining mount points for one or more disk partitions in Fedora will be installed.
    You may also need to create and/delete partitions at this time (see Figure B-9).


    > As you plan to set up your partitions, keep in mind that at a bare minimum you
    will need an appropriately sized root partition, and a swap partition equal to
    twice the amount of RAM you have on the system. See the “Recommended Partitioning
    Scheme” section earlier in this chapter if you want some suggestions on how to
    set up your partitions.'
