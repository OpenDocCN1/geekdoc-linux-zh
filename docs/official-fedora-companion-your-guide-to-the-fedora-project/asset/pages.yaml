  md: '# Gathering System Information for Technical Support


    If you have a problem that requires a call or email to technical support, it''s
    worth taking a few minutes to gather some relevant information about your system
    before you get started.

    Here''s how to find some of that information.


    # CPU


    You can find out what kind of CPU is installed in your system by opening a terminal
    window and issuing the command cat /proc/cpuinfo.


    # Memory


    Find out how much memory you have installed by opening a terminal window and typing
    cat /proc/meminfo at the command prompt.


    # Hardware Devices


    Most installed hardware devices can be found in the Hardware Browser tool. To
    open the Hardware Browser, select System Tools from the Main Menu. Enter the root
    password when prompted, and the Hardware Browser opens (Figure C-1).


    ![](img/67d9607982940021da1fe4247b9b224c_244_0.png)


    The Hardware Browser contains information about the various peripheral devices
    installed on your computer. The device categories are listed in the left pane;
    click a category to see all the specific device names of peripherals installed
    on your machine in the right pane, along with other relevant information specific
    to that device.'
  merge: -1
