  md: '# CHAPTER 5


    # Audio, Video, and General Amusement


    This chapter presents you with the lighter side of Fedora. From games and toys
    to audio and video applications, Fedora provides many packages to let you have
    some fun with your computer.


    # Playing CDs


    To play an audio CD, place the CD in your CD-ROM drive and click the Main Menu
    button ✧ Sound & Video ✧ CD Player to open the CD Player application.


    The CD Player interface (see Figure 5-1) acts like a standard CD player, with
    play, pause, and stop functions. There is also a sliding bar that allows you to
    adjust the volume. You can press the Next Track and Previous Track buttons to
    skip forward or backward one track; you may also use the Track List drop-down
    menu to choose a track from the available menu.


    ![](img/67d9607982940021da1fe4247b9b224c_120_0.png)


    Figure 5-1: CD Player Interface


    You can edit the track listings for your CDs by clicking the Open Track editor
    button. You can also change the way the utility functions by clicking on the Open
    Preferences button. As shown in Figure 5-2, here you can set themes for the player
    as well as set the behavior of the CD-ROM drive when you open or quit the CD Player
    application.'
  merge: -1
  pgno: 120
- img_proc: true
  md: '# Official Fedora Companion


    ![](img/67d9607982940021da1fe4247b9b224c_121_0.png)


    Figure 5-2: CD Player Preferences


    # Playing Digital Music Files


    Digital audio has become very popular in recent years. Users enjoy the technology
    because the sound quality is excellent compared to analog tape or records, and
    the files are compact, so an audio file can easily be transferred over the Internet.


    To allow you to take advantage of this technology, Fedora includes the powerful
    X Multimedia System (XMMS), a cross-platform multimedia player that allows you
    to play several digital file formats (see Figure 5-3).


    ![](img/67d9607982940021da1fe4247b9b224c_121_1.png)


    Figure 5-3: XMMS Interface


    XMMS can be used for more than just playing digital, audio files. By default XMMS
    can play Ogg Vorbis, RIFF wave, and most module formats. XMMS can be extended
    through plugins to play a number of other digital multimedia formats.


    To launch XMMS, click the Main Menu button > Sound & Video > Audio Player (or
    type the command `xmms` to launch XMMS from a shell prompt).


    To learn more about XMMS, refer to the XMMS man page by typing `man xmms` at a
    shell prompt.'
  merge: -1
  pgno: 121
- img_proc: true
  md: '# Why No MP3s?


    Fedora no longer includes MP3 support with its products due to licensing conflicts
    between patent licenses and the licenses of application source code. Because of
    these conflicts, Fedora has removed MP3 support from all its multimedia applications.
    If you want to play MP3 music on your Fedora machine, there are two ways to accomplish
    this:


    +   - Convert your MP3 files into a supported format. Do this with the command-line
    utility mp3ogg, which converts MP3 files into Ogg files, which can be played through
    XMMS. Read the manual page for mp3ogg for more details.


    +   - Add MP3 support back into your system. Do this either by installing the
    stand-alone MP3 player mpg123, available at http://www.mpg123.org, or by installing
    the MP3 plugin for XMMS. The plugin and installation instructions are available
    at http://www.xmms.


    # Troubleshooting Your Sound or Video Card


    Although Fedora is good about configuring sound and video hardware, there are
    times when the configuration either doesn''t happen properly or becomes corrupted.
    The following sections show you how to troubleshoot your sound and video cards.


    # Troubleshooting Your Sound Card


    For some reason, you do not hear sound and know that you have a sound card installed,
    you can run the Sound Card Configuration Tool utility.


    To use the Sound Configuration Tool, click the Main button System Settings  Soundcard
    Detection. A small box will pop up, prompting you for your root password.


    Most sound cards are supported by Fedora, but some sound cards are not completely
    compatible or may not work at all. If you are having trouble configuring your
    sound card, check the Hardware Compatibility List at http://hardware.redhat.com/
    to see if your card is supported.


    The Sound Configuration Tool utility probes your system for sound cards. If the
    utility detects no sound cards, you will see a text box like the one shown in
    Figure 5-4. If the utility detects a Plug and Play sound, it will automatically
    try to configure the correct settings for your card. If you need help, then click
    the Play Test Sound button to play a sound sample. If you can hear the sample,
    select OK and your sound card configuration is complete.


    ![](img/67d9607982940021da1fe4247b9b224c_122_0.png)'
  merge: -1
  pgno: 122
- img_proc: true
  md: '# 102 Official Fedora Companion


    If the Sound Card Configuration Tool does not work (if the sample does not play
    and you still do not have audio sounds), there are alternatives, although they
    are not quite as simple as running the Sound Card Configuration Tool. You can
    edit your modules.conf file as discussed next (this strategy is not recommended
    for users unfamiliar with configuration files and the kernel module system), or
    refer to the documentation that came with your sound card for more information.


    If your card is not a Plug and Play card, you can manually edit your /etc/modules.conf
    file to include the sound card module that it should use, for example:


    ```

    alias sound sb

    alias midi op3

    options sb io=0x388

    options sb io=0x220 irq=7 mpu_io=0x300

    ```


    # Troubleshooting Your Video Card


    Video card configuration is handled during the Video Card installation process
    (see Appendix B). However, if you did not choose to configure a video card at
    that time, or if you need to reconstruct your settings, you can use the X Configuration
    Tool utility. You will want to do this, for example, if you install a new video
    card.


    > The X Configuration Tool will back your system''s original video configuration
    file to /etc/X11/XF86Config.backup in case you need to switch back.


    To run the X Configuration Tool, click the Main Menu button System Settings Display.
    A pop-up window prompts you for your root password. You can also start from a
    shell prompt by typing the command redhat-config-xfre86, which then prompts you
    to input your root password. If you are working from a shell prompt and X is not
    working, the redhat-config-xfre86 command attempts to start a minimal X session
    to allow you to continue your configuration. Follow the instructions that appear
    on the screen. The X Configuration Tool attempts to automatically configure your
    video card and monitor settings for you. Figure 5-5 shows the Display for configuring
    your video devices manually.


    ![](img/67d9607982940021da1fe4247b9b224c_123_0.png)


    Figure 5-5: X Configuration Tool'
  merge: -1
  pgno: 123
- img_proc: true
  md: '# Chapter 5 Audio, Video, and General Amusement 103


    Users with NVIDIA video cards may face problems getting their cards to function
    properly, especially with such games as Tux Racer and Chromium. This is because
    Linux NVIDIA drivers do not control 3-D support. NVIDIA has chosen not to release
    the specifications for their 3-D acceleration, but they do offer their own Linux
    drivers that may help with these cards. Details and downloads can be found at
    http://www.nvidia.com/content/drivers/drivers.aspx.


    To configure your monitor manually, click the Advanced tab, then click the Configure
    ... next to the Monitor Type entry. A pop-up window displays a list of monitor
    models. Choose your model and click OK. You can also let the X Configuration Tool
    probe your monitor for the correct model and vertical/horizontal frequency settings.


    To configure your video card manually, click the Advanced tab and then click the
    Configure ... next to the Video Card entry. A pop-up window displays a list of
    video card models, as shown in Figure 5-6. Choose your model and click OK. You
    can also let the X Configuration Tool probe your video card for the correct model
    and settings by clicking the Probe Videoocard button.


    ![](img/67d9607982940021da1fe4247b9b224c_124_0.png)


    Figure 5-6: Video Card Configuration Tool


    When you have finished reconfiguring your video card and monitor, you should be
    able to start an X session and enjoy your graphical desktop environment.


    # Playing Games


    The games included in Fedora appeal to quite a large number of video game enthusiasts.
    Whether you enjoy card games like Aisle Riot (a solitaire card game), arcade games
    like Tux Racer, board games like Chess, or space shooting games like Chromium
    and Maelstrom, you can find them in Fedora.'
  merge: -1
  pgno: 124
- img_proc: true
  md: '# 104 Official Fedora Companion


    To start a game, click the Main Menu button and choose a game from the Games menu.
    Figure 5-7 shows a fun game for kids of all ages Same Gnome. In this game you
    point your mouse at matching marbles until they start to spin; then, you can click
    them to make them disappear. Try to make all the marbles disappear.


    ![](img/67d9607982940021da1fe4247b9b224c_125_0.png)


    Figure 5-7: Same Gnome – Match the Marbles Game


    Many more games are available within Fedora and online. For more information,
    here are a few suggestions:


    +   - http://www.evil3d.net/ — A 3-D gaming site that covers 3-D Linux games in
    depth.

    - http://www.tuxgames.com — A store where you can buy games just for Linux.

    - http://www.linuxgames.com/ — A Linux gaming news site.

    - http://www.happypenguin.org/ — A Linux gaming repository.


    You can also browse the Internet for Linux games using a search engine, such as
    http://www.google.com.'
  merge: -1
  pgno: 125
- img_proc: true
  md: '# Images and Graphics


    Several types of image files exist. Some images are created using sophisticated
    software packages, while others are made from digital cameras and scanners. You
    may have downloaded some of these image files from the Internet or received them
    in an email. You may also want to create your own images to send to others. You
    can view and manipulate the most common types of image files using the many applications
    included in Fedora.


    This chapter shows how to work with images using the major image-capable software
    in Fedora.


    # Viewing Images


    This section discusses some of the common tools for viewing image files. Certain
    tools available are specialized applications with several functions that enhance
    your image viewing experience, while others are general-purpose browsers that
    have some image viewing functionality.


    # Viewing Images with Nautilus


    Nautilus is a general-purpose file manager and browser for your desktop environment.
    Nautilus has many functions beyond simple image viewing; however, for this section,
    we will focus on showing how to use it for basic image browsing.


    For more information about Nautilus, see Chapter 8.


    Nautilus is known for its ease of use, and it handles images with the same ease
    as it does for other file types. To begin browsing your image collection with
    Nautilus, double-click on your desktop icon.'
  merge: -1
  pgno: 126
- img_proc: true
  md: '# 106 Official Fedora Companion


    You will be presented with a view of all the files and folders within your home
    directory. Double-click an image (or folder containing the image), and Nautilus
    opens the new file or folder within your browser window. Figure 6-1 shows that
    Nautilus automatically creates thumbnails of any images in your folders.


    ![](img/67d9607982940021da1fe4247b9b224c_127_0.png)


    Figure 6-1: Contents of a Folder in Nautilus


    Double-click on any thumbnail icon to view the image in its native size. The image
    will load within the browser window, along with a thumbnail view and detailed
    file information along the left panel. If you have a mouse with a scroll wheel,
    you can use the wheel to zoom in and out of the image.


    Below the file information are advanced options for working with the file. By
    default, Nautilus offers you the option of opening the file with Eye of Gnome,
    a robust image viewer with more advanced imaging features than Nautilus. Eye of
    Gnome is invoked separately by typing eog at the command prompt.


    To increase and decrease the size of the viewed image in Nautilus, click on the
    plus (+) icon or minus (-) icon, respectively, on the location bar (Figure 6-2).


    # Using gThumb


    If you find Nautilus too cumbersome for simple image viewing, you might consider
    gThumb. gThumb is a program that loads images in thumbnail form so you can browse
    and open any full-size images you select. Image organization is easy with gThumb.
    You can even use it to do some basic image manipulation.


    Open gThumb by selecting Graphics -> gThumb Image Viewer from the Main Menu. The
    gThumb window opens to your home directory (Figure 6-3). Any image files in the
    directory are displayed as thumbnails in the right pane. Use the tree view of
    your directory system to navigate to other files that contain images.'
  merge: -1
  pgno: 127
- img_proc: true
  md: '# Chapter 6 - Images and Graphics 107


    ![](img/67d9607982940021da1fe4247b9b224c_128_0.png)


    **Figure 6-2:** The Zoom Function in Nautilus


    To view an image, click its thumbnail. Use the In and Out buttons to expand or
    contract the view. If the image becomes larger than the gThumb window, scrollbars
    appear.


    Click image to open a menu with several manipulation functions, such as rotate,
    flip, mirror, and resize. Complex manipulation is better done with the GIMP, but
    gThumb offers several handy tools for quick image work.


    ![](img/67d9607982940021da1fe4247b9b224c_128_1.png)


    **Figure 6-3:** The gThumb Image Viewer


    # # Using a Digital Camera


    The popularity of digital cameras is no surprise. They''re easy to use, lightweight,
    and-produce images that can be shared instantly. Until recently, however, digital
    cameras and Linux'
  merge: -1
  pgno: 128
- img_proc: true
  md: '# 108 Official Fedora Companion


    were uneasy allies. Fedora now offers a useful program that makes working with
    your digital camera an easy and stress-free experience.


    > Note You must have a digital camera that connects to the computer with a USB
    cable to use your camera with Fedora. Configure gtkam to recognize your camera
    with the Add Camera tool, found in the Camera drop-down menu.


    The Fedora digital camera utility is called gtkam. To start, select Graphics Digital
    Camera Tool from the Main Menu. The gtkam window appears, as in Figure 6-4. Connect
    your camera to the computer''s USB port, turn the camera on, and set it to whatever
    mode it uses to communicate with the computer (see your camera manual for details).


    ![](img/67d9607982940021da1fe4247b9b224c_129_0.png)


    The name of your camera should appear in the left pane of the gtkam window. Click
    the camera name and navigate through its subdirectories to the directory that
    contains your image files. The images contained in the selected directory appear
    as thumbnails in the right pane. You can click a photo to preview. Select File
    Save Selected Photos to save images from the camera to your hard drive.


    # Manipulating Images with the GIMP


    The GNU Image Manipulation Program (GIMP) is a powerful tool that can be used
    to create, alter, manipulate, and enhance digital image files—photographs, scanned
    images, computer-generated images, and more. This section offers a quick overview
    of The GIMP and refers you to comprehensive references for learning more about
    it.'
  merge: -1
  pgno: 129
- img_proc: true
  md: '# Chapter 6 ♦ Images and Graphics 109


    # GIMP Basics


    To use The GIMP, you will need to know some of the basics. Start The GIMP from
    the desktop by clicking the Main Menu button ✎ Graphics ☏ GIMP (from the shell
    prompt, you can start GIMP by typing `gimp`).


    Figure 6-5 shows a typical GIMP session.


    ![](img/67d9607982940021da1fe4247b9b224c_130_0.png)


    **Figure 6-5:** The GIMP in Action


    # Loading a File


    To load an existing file, choose File ✎ Open. You will see the Load Image dialog,
    as shown in Figure 6-6.


    The Load Image dialog displays your working directory—the directory you were in
    when The GIMP was launched. You can navigate up and down the file system tree
    by double-clicking on Directories in the list and selecting a file to open from
    the Files on the right.


    File name completion is supported by The GIMP. If you type the first letter (or
    more) of a file name into the Selection field and press the Tab key, the view
    will change to only those subdirectories and/or files beginning with that letter
    or letters.'
  merge: -1
  pgno: 130
- img_proc: true
  md: '# 110 Official Fedora Companion


    ![](img/67d9607982940021da1fe4247b9b224c_131_0.png)


    Figure 6-6: The Load Image Dialog


    The file you select will appear in the Selection field near the bottom of the
    dialog. A thumbnail preview will be displayed on the dialog; alternatively, you
    will see a Generate Preview button. If you want to see a thumbnail of the image,
    click the Generate Preview button.


    After you have selected a file, click OK to open it. You can also double-click
    a file name to open it.


    # Saving a File


    To save an image file, right-click on the image and choose File ⮤ Save (or Save
    As).


    > Note You will see the Save image dialog if you choose Save As or if you choose
    Save and the file has not been saved before.


    The Save image dialog looks almost exactly like the Load Image dialog and navigation
    of the system tree cutting choosing files works in the same way.


    When you are saving an image, you need to choose an image format. GIMP supports
    a wide variety of image formats, including .gif, .png, .jpg, and .bmp.


    # Cropping an Image


    One of the most frequent manipulation tasks is cropping. Cropping is the process
    of selecting an image file and cutting everything else. The GIMP makes this job
    easy.


    To crop an image, first open the file in The GIMP. Right-click the image and select
    Tools ⮤ Transform Tools ⮤ Crop & Resize from the pop-up menu. The cursor changes
    to a cropping tool. Position the cursor at the upper left corner of the area you
    want to crop, click the mouse button, and draw a square around the material you
    want to keep. When you release the mouse, borders with resizing handles appear.
    You can click and drag these handles to handle'
  merge: -1
  pgno: 131
- img_proc: true
  md: 'the area that will be saved. The Crop and Resize Information dialog box appears
    when you release the mouse (Figure 6-7).


    ![](img/67d9607982940021da1fe4247b9b224c_132_0.png)


    **Figure 6-7:** The GIMP''s Crop and Resize Information Window


    When you have positioned the border in the correct place, click the Crop button
    in the Crop and Resize Information dialog box. The image is cropped to the border
    you specified. Don''t forget to save the new image file.


    # # GIMP Options


    Like many applications, the GIMP provides more than one method to accomplish tasks.
    The easiest way to work with images is to right-click on the image, which will
    display a set of menus containing most of The GIMP''s many capabilities, including
    image sizing, rotation, and filter application.


    For example, imagine you have a picture that you would like to modify to make
    it look as if it were clipped from a newspaper. To do this, right-click on the
    image and select Filters Distorts Newsprint... Select the quantity of lines per
    inch using the sliders. When you reach a desired quantity and are ready to render
    the image, click OK. The GIMP then renders the image with the new effect applied.
    Figure 6-8 shows an example of an image after the Newsprint filter has been applied.


    ![](img/67d9607982940021da1fe4247b9b224c_132_1.png)


    **Figure 6-8:** An Image Modified with a GIMP Filter'
  merge: -1
  pgno: 132
- img_proc: true
  md: '# 112 Official Fedora Companion


    The Toolbox (see Figure 6-9) also has several easily accessible functions. Using
    the Toolbox you can add text to images, erase regions of an image, or even fill
    selected regions with the color of your choice.


    Figure 6-9: The GIMP Toolbox


    ![](img/67d9607982940021da1fe4247b9b224c_133_0.png)


    For example, if you wish to add text to a file, select the Text button and click
    on your image. This loads the Text Tool dialog box, where you can choose a font
    and type some text in the provided text box. Click OK and your text is displayed
    as a floating section on the image. You can then move the text to the position
    you wish using the Move Layers tool. Figure 6-10 shows a photo with exciting new
    text.


    ![](img/67d9607982940021da1fe4247b9b224c_133_1.png)


    Figure 6-10: Using the Text Tool on an Image


    As you can see, the GIMP is a powerful imaging tool, and it takes some time to
    master all of the functions. Try exploring some of the options yourself. If you
    make a mistake, don''t worry. You can always undo your mistakes by right-clicking
    on the image and choosing Edit–Undo.'
  merge: -1
  pgno: 133
- img_proc: true
  md: '# Chapter 6 + Images and Graphics 113


    # Additional Resources


    While this chapter covers the GIMP just briefly, you can do much more with it.
    Refer to the following resources if you are interested in learning more about
    The GIMP.


    # Useful Web Sites


    The Web has several sites of interest if you are looking for more detailed information
