    | [carlotta@carlotta]$ | |


    ![](img/67d9607982940021da1fe4247b9b224c_179_0.png)


    +   Note Hidden files are mostly configuration files that set preferences in programs,
    window managers, shells, and more. The reason they are hidden is to help prevent
    any accidental tampering by the user.'
