    Figure 3-20: The Multiple Desktops Settings Window


    # Desktop Pager


    Workspaces can be useful if you have a lot of applications open at the same time
    and do not want all of them cluttering a single workspace. Using workspaces, you
    could group applications of a certain type on different workspaces. For example,
    if you are working with several Internet applications, several-OpenOffice.org
    applications, and several graphics applications, you could have all of the Internet
    applications on one workspace, all of the OpenOffice.org applications on a second
    workspace, and all of the graphics applications on another workspace.'
