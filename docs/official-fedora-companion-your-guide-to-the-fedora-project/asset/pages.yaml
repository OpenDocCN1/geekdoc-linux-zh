  md: '# 32 Official Fedora Companion


    You can also right-click the mouse pointer on an icon and choose Open (or With
    . . . if you want to choose the application with which to open the file) instead
    of double-clicking.


    In Figure 2-1, you can see three icons on the desktop, as well as several icons
    on the Panel (also called *applets*).


    # Using the Notification Area


    As part of the Panel Notification Area, the Red Hat Network Notification Tool
    (see Figure 2-5) provides you with an easy way to make sure your system is up
    to date with current errata and bug fixes from Red Hat. The applet shows different
    images that indicate whether your system is up to date or upgrades. If you click
    the applet, a list of available updates will be displayed. To update your system,
    click the button to launch the Red Hat Update Agent. If you are not registered
    with Red Hat Network, it will launch the registration application. Right-Click
    the applet icon and select Help for details.


    > Figure 2-5: The Red Hat Network Notification Tool


    One icon that is sometimes displayed in the Notification Area is a security notification
    that alerts you whenever you have gained root authentication for your system (see
    Figure 2-6). It disappears when the authentication times out.


    > Figure 2-6: The Authentication Icon


    # Using Nautilus


    The graphical desktop includes a file manager called Nautilus that gives you a
    graphical display of your system and personal files. Nautilus is designed to be
    much more than a visual listing of files, however; it allows you to


    +   * Configure your desktop

    * Configure your Fedora system

    * Play digital music and video files

    * Browse photos

    * Access your network resources


    You can do all this and more from one integrated interface. In essence, Nautilus
    becomes a navigation tool for your entire desktop experience.


    Working in Nautilus is efficient and provides an alternative to searching through
    the various submenu connected to the Main Menu or using a shell prompt to navigate
    the file system. To start Nautilus as a file manager, double-click on your home
    directory once. Once Nautilus appears, you can navigate through your home directory
    or the rest of the file system. Click on the Up icon to move one directory to
    the folder that contains your current folder, if one exists. You can also double-click
    on a folder icon to view the contents of that folder. You can click the Back button
    to go back to where you were.'
