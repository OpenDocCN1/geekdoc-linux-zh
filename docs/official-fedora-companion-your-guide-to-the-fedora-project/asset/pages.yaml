    # Viewing Directory Contents with ls


    Now that you know how to change directories, it is time to learn how to view the
    contents of these directories. With the ls command, you can display the contents
    of your current directory.


    Many options are available with the ls command. The ls command by itself does
    not show all the files in your directory. Some files are hidden files (also called
    dot files because their file names start with a dot) and can be seen only by using
    the -a option with the ls command (see Figure 9-3).


    +   Tip To see all options of the ls command, you can read the man page for the
    ls command by typing man 1 ls at a shell prompt. If you want to print the man
    page, at the prompt type ls | col -b | 1pr.


    | File View Terminal Go Help |

    | [carlotta@carlotta]$ ls -a | |

    | .bash_history bash_profile emacs .kde |

