  md: '# Configuring System Date and Time


    The first tabbed window that appears after starting the Time and Date Properties
    tool is for configuring the system date and time (see Figure 1-11).


    To change the date, use the arrows to the left and right of the month to change
    the month. Use the arrows to the left and right of the year to change the year,
    and click on the day of the week to change the day of the week. Changes will not
    take place until you click OK.


    To change the time, use the up and down arrows beside the Hour, Minute, and Second
    in the Time section. Changes will not take place until you click OK.


    This program also allows you to specify a Network Time Protocol (NTP) server,
    so that your system can set its clock via the Internet, automatically. To enable
    this feature, click the Enable Network Time Protocol check box so that it is checked.
    This will enable the Server pull-down menu. You can then choose one of the predefined
    servers or type a server name in the pull-down menu. Your system will not start
    synchronizing with the NTP server until you click Apply.


    Caution


    If you configured a medium or high security level during installation or with
    the Security Level Configuration Tool, the firewall rules will block the connection
    to the NTP port. To allow NTP to work, run the Security Level Configuration Tool,
    select Customize, and add udp:ntp to the other ports. See Chapter 10 for more
    details.


    ![](img/67d9607982940021da1fe4247b9b224c_31_0.png)


    Figure 1-9: The Main Menu'
