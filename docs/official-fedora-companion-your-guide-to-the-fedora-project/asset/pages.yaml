    # Logging Out


    To log out of your graphical desktop session, click the Main Menu button Log Out.
    When the confirmation dialog box appears, select the Log Out option and click
    Yes.


    +   * Tip If you want to save the configuration of your desktop, as well as any
    programs that are running, check the Save Current Setup option.


    # Shutting Down Your Computer


    If you are done and want to turn off your computer, it is important to shut down
    Fedora first.


    +   * Caution Never turn off your computer without shutting down first, as you
    may lose unsaved data or damage your system if you do.


    Select Shut Down from the logout screen and then click OK to confirm your choice.


    +   * Note You can also shut down from the graphical login screen by clicking
    Session, selecting the Shut down the computer option, and clicking OK.


    Some computers automatically turn the power off after shutting down Fedora. If
    your computer does not, you can turn off the power to your computer after you
    see the following message:


    Power down.'
