  md: '# # Preface


    Welcome to the Official Fedora Companion, your gateway to a new community-developed
    version of the powerful and robust Linux operating system.


    # ## Who This Book Is For


    While novices and experienced Linux users alike will find useful information contained
    within these pages, this book is specially tailored to those who want their experience
    with Fedora to be fast, easy, and enjoyable. Armed with this companion guide and
    the included software, newcomers will be able to plumb the depths of this powerful
    operating system and the included word processors, spreadsheets, web browsers,
    email, instant messengers, and more.


    # ## How This Book Is Organized


    To cover Fedora thoroughly, this book contains 10 chapters and multiple appendices.


    +   - **Chapter 1, “Getting Started”** — This chapter eases you into the Fedora
    experience, walking through the finest touches that will get you ready for daily
    use. It includes instructions for setting up your printer, as well as for performing
    certain tasks you may have skipped during installation, such as creating a user
    account and connecting to the Internet.


    +   - **Chapter 2, “Ahead of the Bluecurve”** — In this chapter, you learn how
    to navigate the Fedora graphical desktop, Blueberrycurve, and how to customize
    it to suit your fancy. Blueberry is a custom version of the GNOME and KDE graphical
    desktop environments. This chapter explores the version installed by default,
    which is based on GNOME.


    +   - **Chapter 3, “The KDE Bluecurve”** — Whether you are a fan of the KDE desktop
    or simply want to explore an alternative desktop environment, this chapter tells
    you how to install the KDE version of GNOME, how to explore its features, and
    how to customize it to your liking.


    +   - **Chapter 4, “Using and Cruising the Internet”** — Visit this chapter tells
    you if to want to explore various ways to browse the World Wide Web, exchange
    email, and chat with friends using instant messaging. It even provides tips on
    how to install appropriate browser plugins not included with Fedora.


    +   - **Chapter 5, “Audio, Video, and General Amouncement”** — This chapter tells
    you how to listen to your audio CDs, play games, and even troubleshoot any problems
    you may be experiencing with your video card.


    +   - **Chapter 6, “Images and Graphics”** — This chapter gets you started viewing
    images and transferring images from your digital camera. It also introduces you
    to GIMP, a program you can use to edit images'
  merge: -1
  pgno: 8
- img_proc: true
  md: 'Chapter 7, “Getting Productive with Fedora” — This chapter introduces you to
    productivity applications such as the OpenOfficeorg word processor, spreadsheet,
    presentation, and drawing applications. In addition, it explores how to view special
    documents and how to use the personal information manager features of an application
    called Evolution. You can even synchronize your Evolution with your Palm Pilot.


    Chapter 8, “Diskettes and CD-ROMs” — It’s easy to burn information to CD-ROMs
    and format use floppy disks. This chapter explores a number of ways to do so.


    Chapter 9, “Command-Line Power: Shell Prompt Basics” — You can do anything you
    want in Fedora through the graphical desktop by point-and-click, and some users
    will want to do there. But it’s easier and even more efficient to do by typing
    commands at a command prompt. This chapter is for those who want to explore the
    world beyond the mouse.


    Chapter 10, “Security Levels” — If you connect your computer directly to the Internet,
    you’ll want to read this chapter to learn how to keep malicious Internet adversaries
    at bay.


    Appendices — The appendices provides information about the included CD-ROMs, as
    well as essential reference materials, such as how to troubleshoot your installation,
    how to install Fedora on your computer, how to configure your computer to boot
    multiple operating systems, and the Linux equivalents for common DOS commands.


    # Icons Used in This Book


    The following icons are used in this book to call your attention to points that
    are particularly important.


    ![](img/67d9607982940021da1fe4247b9b224c_9_0.png)


    A Note icon provides extra information to which you should pay special attention.


    ![](img/67d9607982940021da1fe4247b9b224c_9_1.png)


    A Tip icon shows a special way of performing a particular task.


    ![](img/67d9607982940021da1fe4247b9b224c_9_2.png)


    A Caution icon alerts you to take special care when executing a procedure, or
    damage to your computer hardware or software could result.


    ![](img/67d9607982940021da1fe4247b9b224c_9_3.png)


    A Cross-Reference icon refers to further information on a subject that you can
    find outside the current chapter.'
