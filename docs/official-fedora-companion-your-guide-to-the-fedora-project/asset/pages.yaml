  md: '# About the Author


    **Nick Petreley** is a former programmer and consultant and an award-winning columnist
    who currently writes monthly for the IT computing journal *Computerworld*. He
    was among the first, if not the first, mainstream technology writer to recognize
    Linux as a credible and eventually superior alternative operating system for the
    corporate enterprise. Indeed, Red Hat''s own Bob Young recently credits Petreley
    with being instrumental to the success Linux now enjoys.


    Petreley''s humble beginnings in computing started with an addiction for writing
    games for Hewlett-Packard programmable calculators and a home-brew Z80 computer,
    after which he marketed his self-taught assembler and high-level language programming
    skills to various research and development firms. He eventually started his own
    consulting and training firm in Trenton, New Jersey, and began his writing career
    with a weekly column in the *Times* and as lead database reviewer for the IT journal
    *InfoWorld*. He later joined *InfoWorld* full time, enjoying various roles within
    the organization, from benchmark designer to executive editor of reviews and testing.
    Since leaving *InfoWorld*, Petreley has served as editorial director of the webzine
    *LinuxWorld*, advisor for the highly successful LinuxWorld Expo, and created and
    originally hosted the popular Golden Penguin Bowl quiz show featured at the LinuxWorld
    Expo. He is also founding editor of weblog *VarLinux.org*.'
