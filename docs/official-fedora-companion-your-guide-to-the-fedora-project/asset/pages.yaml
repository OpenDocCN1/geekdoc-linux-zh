    # Customizing Your System


    You can customize nearly every aspect of the brand-new Fedora interface. From
    adding new Panels and changing the look of your interface, resizing icons and
    adding emblems to icons, Fedora makes it easier than ever to customize the desktop
    interface.


    Figure 2-11 shows how different you can make your desktop look. Compare this figure
    with Figure 2-1; the two do not resemble one another.


    The following sections show you how to customize your system to suit your needs
    and preferences.


    ![](img/67d9607982940021da1fe4247b9b224c_57_0.png)


    Figure 2-11: Customizing Your Desktop'
