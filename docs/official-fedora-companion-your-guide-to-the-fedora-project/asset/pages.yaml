    client features, including powerful mailbox management, user-defined filters,
    and quick searches. It additionally features a flexible calendar/scheduler that
    allows users to create and confirm group meetings and special events online. Evolution
    is a full-featured personal and workgroup management tool for Linux and Unix-based
    systems and is the default client for Fedora.


