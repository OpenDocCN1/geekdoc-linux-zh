  md: '# Appendix B ♦ Installing Fedora 185


    If you already have another operating system installed and want to create a dual-boot
    system so that you can use both Fedora and the other operating system, read Appendix
    D for details.


    The installation program will then probe your system and attempt to identify your
    CD-ROM drive. It will start by looking for an Integrated Drive Electronics (IDE)
    (also known as an Advanced Technology Attachment Packet Interface (ATAPI)) CD-ROM
    drive. If this is found, you will continue to the next stage of the installation
    (see the following section, "Welcome to Fedora").


    To abort the installation process at time, reboot your machine and eject the boot
    disk or CD-ROM. You can cancel the installation at any point before the About
    to Install screen. See the "Preparing to Install" in this chapter for more information.


    If your CD-ROM drive is not detected, and it is a Small Computer System Interface
    (SCSI) CD-ROM, you can manually select the SCSI CD-ROM type when prompted. Select
    SCSI if your CD-ROM drive is attached to a supported SCSI adapter; the installation
    program will then ask you to choose a SCSI driver. Choose the driver that most
    closely resembles your adapter.


    You can specify options for the driver if necessary; however, most drivers will
    detect your SCSI adapter automatically.


    # Welcome to Fedora


    The Welcome screen does not prompt you for any input. Feel free to read over the
    help text in the left panel for additional instructions.


    Notice the Hide Help button at the bottom left corner of the screen. The help
    screen is open by default. If you do not want to view the help information, click
    on Hide Help to minimize the help portion of the screen.


    Click Next to continue.


    # Language Selection


    Using your mouse, select the language you would prefer to use for the installation
    (see Figure B-1). Selecting the appropriate language will also help target your
    time zone configuration later in the installation. The installation program will
    try to define the appropriate time zone based on what you specify on this screen.


    After selecting the appropriate language, click Next to continue.


    # Keyboard Configuration


    Using your mouse, select the correct layout type (for example, U.S. English) for
    the keyboard you would prefer to use for the installation and as the system default
    (see Figure B-2).


    After making your selection, click Next to continue.'
