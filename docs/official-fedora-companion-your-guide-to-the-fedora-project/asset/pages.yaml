  md: '# Using and Cruising the Internet


    Are you hooked on eBay or search portals like Netscape Search, Yahoo, or Google?
    Do you go through withdrawal symptoms if you miss a day chatting with your Yahoo
    Instant Messenger or AOL Instant buddies? Do you live to send and read email?
    Don''t worry; Fedora offers a wealth of Internet software perfect for both the
    casual Web surfer and the hard-core Internet addict.


    This chapter describes how to use two powerful browsers, Mozilla and Konqueror,
    the feature-rich email applications Evolution, Mozilla Mail, and KMail, and the
    GAIM Instant Messenger, which supports Yahoo, AOL, and other instant messaging.


    # Web Browsing


    After you have configured your Internet connection (see Chapter 1), you are ready
    to get online and start browsing the Web. Fedora comes with several open-source
    browsers for you to choose from. This briefly explains how to surf the Web using
    the following browsers:


    +   - Mozilla

    - Konqueror


    # Web Browsing with Mozilla


    Click the Web browser launcher on the panel (it looks like the Earth with a mouse
    wrapped around it), or click the Main Menu button Internet Web Browser to start
    Mozilla.


    The Mozilla screen has all of the standard Web browser functions that other browsers
    have and much more (see Figure 4-1). There is a main menu at the top of the screen
    and a navigation bar below it. There is an optional sidebar that you can appear
    on the left for easy access to things like your bookmarks, history (which sites
    you''ve visited recently), and more. And in the bottom left corner, there are
    four small icons: Navigator, Mail, Composer, and Address Book. You can start another
    browser window by clicking on the Navigator icon, and you can launch other Mozilla
    applications by clicking on the mail, composer, and address book icons.'
  merge: -1
  pgno: 96
- img_proc: true
  md: '# 76 Official Fedora Companions


    ![](img/67d9607982940021da1fe4247b9b224c_97_0.png)


    Figure 4-1: Mozilla Browser Window


    If you''re not already an Internet surfing pro, here''s a quick way to get the
    hang of it. Click the Search button on the toolbar at the top of the window. It''s
    almost all the way to the right, next to the Print button. This would bring up
    a Netscape Search screen, after which you can find in a topic you find interesting,
    *Faith Hill*, for example.


    # Sidebar


    Would you like to know some tricks to get more information once you find a Web
    site that interests you? First, you need to know how to open and use the Mozilla
    browser. The easiest way to do it is to press the F9 function key to turn it on,
    and then press F9 when you want to turn it off.


    You can also set the sidebar to appear all the time, or to appear only when Mozilla
    might be useful to you. Click on the View menu, and select Show/Hide ⇋ Navigation
    Bar ⇋ Always to show the sidebar all the time. Click on the View menu, and select
    Show/Hide ⇋ Show Site Bar ⇋ Show Only As Needed to let Mozilla pop the sidebar
    for you.


    # What''s Related


    Now navigate to a Web site that you find interesting. For example, you could finish
    the search for Faith Hill and then click on one of the Web sites about Faith Hill
    that you find.


    Press the F9 key to pop up the sidebar if it is not already showing.


    Click on the What''s Related sidebar to see pages related to the one you are viewing
    currently. In the example, the What''s Related section would detect that you are
    viewing information about Faith Hill and show a list of related sites.'
  merge: -1
  pgno: 97
- img_proc: true
  md: '# Mozilla Picks Up the Tab


    Mozilla features tabbed browsing, which means you don''t have to open up a completely
    new browser window for each Web site if you want to view multiple Web sites at
    once. Just create a new tabbed view and load another Web site in that view.


    To open a new tab, press Ctrl-T, or click on File in the Mozilla menu and select
    New Navigator Tab.


    For example, if you want to keep browsing the page on Faith Hill but also to view
    one of the What''s Related Links, you could press Ctrl-T to open a new tab and
    then click on a What''s Related link to load the new page in the new tab view.


    # Remember That Site!


    You can bookmark any of your favorite sites by pressing Ctrl-D or clicking Bookmark
    on the Mozilla menu and then selecting Bookmark This Page. Afterward, you can
    access book-mark by clicking on Bookmark in the Mozilla menu. The bookmarked page
    should appear over the menu.


    As you add bookmarks, you''ll want to organize them into folders to avoid clutter.
    It is easy to create bookmark folders, change the name of bookmarks, move, copy,
    delete, and otherwise manage your bookmarks. To get started, press Ctrl-B to bring
    up the Bookmark Manager, or click Bookmark on the Mozilla menu and choose Manage
    Bookmarks (see Figure 4-2).


    ![](img/67d9607982940021da1fe4247b9b224c_98_0.png)


    Figure 4-2: The Bookmark Manager Bookmark Toolbar


    # Your Own Personal Mozilla toolbar


    Mozilla starts with a personal bookmark toolbar already loaded with links such
    as Home, Bookmarks, Red Hat Network, Support, and more. Add your own folders and
    most frequently visited sites to this toolbar to make it easier than ever to browse
    the Web with Mozilla. For example, the following shows how to add Search Engines
    folder to the personal toolbar, and then add Google to that folder.'
