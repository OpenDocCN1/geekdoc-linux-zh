  md: '# Customizing Workspaces


    Workspaces are the equivalent of extra desktops on your system. By default, Fedora
    comes with four workspaces that you can work with, but you are no limited to four.
    The following sections show you how to add and remove workspaces, drag applications
    across workspaces, and make a single application on all of your workspaces.


    # Adding or Removing Workspaces


    Depending on your need, you may want more or fewer than the four default workspaces.
    To add or remove workspaces from your panel, right-click the Workspace Switcher
    panel app (refer to Figure 2-3) and choose Preferences. The Workspace Switcher
    Preferences window appears (see Figure 2-14). From this window you can change
    the number of workspaces, choose to show only the first workspace (if you do not
    want any additional workspaces), or change the number of rows that your workspaces
    are displayed in.


    ![](img/67d9607982940021da1fe4247b9b224c_62_0.png)


    # Dragging Applications Across Workspaces


    Workspaces can be useful if you find you have a lot of applications open at the
    same time and do not want all of them clutter up a single workspace. Using workspaces,
    you could group applications of a certain type on different workspaces. For example,
    if you are working with Internet applications, OpenOffice.org applications, and
    several graphics applications, you could have all of the Internet applications
    on one workspace, all of the OpenOffice.org applications on a second workspace,
    and all of the graphics applications on another workspace.


    Moving an application across workspaces is easy; click the icon for an open window
    in one on the Workspace Switcher panel applet (refer to Figure 2-3) and then drag
    it to a different workspace on the applet.


    > Tip The current workspace is easily identified because it is the dark box among
    the rest of the workspaces, which are of a lighter color.


    After dragging the application to a different workspace, you can access the application
    by clicking on that workspace on the Workspace Switcher panel applet and then
    clicking on the application.'
  merge: -1
  pgno: 62
- img_proc: true
  md: '# Making One Window Appear on All Workspaces


    You may find that when working with workspaces you have applications that you
    want to be accessible on all workspaces. For example, if you are waiting on an
    important email but do not want to keep switching workspaces to check your email,
    making one window appear on all workspaces would allow you to keep your eye on
    your email client no matter what workspace you are using. To make one window appear
    on all desktops, click the down arrow in the upper left corner of the window.
    In the menu displayed, select Put on All Workspaces.


    # Changing Your System''s Appearance


    Some customization features do not really change the way you work with your system,
    but just change the look of your system. For example, your desktop background
    does not affect the way you work with your system, but it does change the appearance
    of your desktop.


    The following sections show you how to change your system''s appearance.


    # Changing Themes


    Themes are becoming more and more popular in modern software: a theme is basically
    a different interface for your windows and graphical user interface.


    +   - Even Mozilla 1.4 supports its own themes (choose View -> Apply Theme from
    the Mozilla browser window).


    To change your theme, click the Main Menu button -> Preferences -> Theme, choose
    a new theme from the installed themes list (see Figure 2-15), and click Close.
    Figure 2-16 shows an example of a theme applied.


    ![](img/67d9607982940021da1fe4247b9b224c_63_0.png)


    Figure 2-15: The Theme Preferences Window'
  merge: -1
