  md: '# Is Your RAM Not Being Recognized?


    Sometimes, the kernel does not recognize all of your memory (RAM). You can check
    this with the following command:


    ```

    cat /proc/meminfo

    ```


    Find out if the displayed quantity is the same as the known amount of RAM in your
    system. If they are not equal, add the following line to the /boot/grub/grub.conf:


    ```

    mem=XXM

    ```


    Or, if you used LILO, add the following line to the /etc/lilo.conf file:


    ```

    append=mem=XXM

    ```


    Replace xx with the amount of RAM you have in megabytes. Remember that per-image
    append lines completely overwrite the global append line. It might be worth adding
    this to the per-image descriptions, as shown in the following example:


    ```

    mem=128

    append=mem=128M

    ```


    In /boot/grub.conf, the preceding example would look like this to following:


    ```

    #NOTICE: You have a boot partition. This means that

    # all kernel paths are relative to /boot/

    default=0

    timeout=30

    plashimage=(nd0,0)/grub/splash.xpm

    title Fedora Linux (2.4.6-2)

    root (nd0,0)

    kernel /vmlinuz-2.2.6-2 root=/dev/sda3 mem=128M

    ```


    After you reboot, the changes made to grub.conf will be reflected on your system.


    In /etc/lilo.conf, the preceding example would look like this to following:


    ```

    boot=/dev/sda

    map=/boot/map

    inst=/boot/boot.b

    prompt

    timeout=50

    image=/boot/vmlinuz-2.2.12-20

    label=linux

    root=/dev/sda

    initrd=/boot/initrd-2.2.12-20.img

    read-only

    append=run mem=128M

    ```


    Remember to run /sbin/lilo -v after changing /etc/lilo.conf.


    Note that you can also produce the same effect by passing this option when you
    are specifying the label/image to use in GRUB or LILO.


    After you have loaded the GRUB boot screen, follow these steps:


    +   1. Type e for edit. You will be presented with a list of items in the configuration
    file for the boot label you have selected.'
  merge: -1
