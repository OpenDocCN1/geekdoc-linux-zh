    [carlotta@toluca carlotta]$ cat sneakers.txt

    bring the coffee home

    take off shoes

    put on sneakers

    make some coffee

    relax

    bring the coffee home

    take off shoes

    put on sneakers

    make some coffee

    relax

    [carlotta@toluca carlotta]$ ]

    ```


    **Figure 9-9:** More on Changing the Permissions for sneakers.txt


    Here are some common examples of settings that can be used with chmod:


    +   - g+w—Adds access for the group

    - o-rwx—Removes all permissions for others

    - u+x—Allows the file owner to execute the file

    - a+rw—Allows everyone to read and write to the file

    - ug+r—Allows the owner and group to read the file

    - g-rx—Lets the group only read and execute (not write)


    By adding the -R option, you can change permissions for entire directory trees.

    Because you cannot really "execute" a directory as you would an application, or
    remove execute permission for a directory, you are really allowing (or denying)
    permission to search through that directory.

    To allow everyone read and write access to every file in the example directory
    tigger, type the following:


    ```

    [carlotta@toluca carlotta]$ chmod -R a+rw tigger

    ```


    If you do not allow others to have execute permission to tigger, it will not matter
    who has read or write access— no one will be able to get into the directory unless
    they know the exact name they want.'
  merge: -1
