  md: '# Creating a User Account


    This may be one of the most essential tasks you will complete during setup. It
    is extremely important to create and use a normal user account when you log in
    to Fedora. Otherwise, you will be forced to use the root account, which is meant
    only for system administration.


    When you see the screen shown in Figure B-28, fill in a username. It is best to
    stick with something-simple, such as your first name, or the first letter of your
    first name followed by your last name (no spaces between them). In this sample,
    we chose the name carlotta.


    Then enter your full name, in our sample Carlotta Tendant. Enter your password
    twice. For tips on choosing a good password, see "Setting the Root Password" section
    earlier in the chapter.


    This user account is the account you should use whenever you log in to Fedora.


    Click the Next button to continue.


    ![](img/67d9607982940021da1fe4247b9b224c_232_0.png)


    **Figure B-28:** User Account


    # Checking Your Sound Card


    At this point, Fedora should have detected any sound card you may have in your
    system. See Figure B-29 for an example. If Fedora detected a sound card, it will
    present you with a button that says Play test sound. Click on this button to hear
    a test sound (you may have to adjust any external volume controls, depending on
    how you have your sound system set up).'
  merge: -1
