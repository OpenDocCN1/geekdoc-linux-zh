    If you told GAIM to remember your password when you created your account, the
    password will be entered for you. If not, type in the password and click Sign
    On. This will take you to your buddy list (see Figure 4-25). If you already have
    a buddy list, it appears; otherwise, you can add buddies by clicking on the Buddies
