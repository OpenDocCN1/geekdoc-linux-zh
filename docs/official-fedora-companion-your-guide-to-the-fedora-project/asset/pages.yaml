  md: 'On Linux systems, /dev/fd0 refers to the first diskette drive. If your computer
    has more than one floppy drive, your primary floppy drive will be /dev/fd0, your
    second floppy drive will be designated /dev/fd1, and so on.


    The mk2fs utility has a number of options. The -c option makes the mk2fs command
    check the device for bad blocks before creating the file system. The other options
    are covered in the mk2fs man page.


    Once you have created an ext2 file system on the diskette, it is ready to be used
    with your Fedora system.


    # Using CD-ROMs


