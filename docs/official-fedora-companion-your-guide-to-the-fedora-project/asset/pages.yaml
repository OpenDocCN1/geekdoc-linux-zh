    # Using Redirection


    Linux makes use of a technique called redirection, which enhances the power of
    the command line by leaps and bounds. In order to grasp redirection, however,
    one should become familiar with the concept of standard input and output.


    # Standard Input and Standard Output


    Shell commands have input and output. The default input for any command to the
    shell is whatever you type at the keyboard, or whatever you see on the screen.
    These are traditionally called standard input and standard output. For example,
    when you type the following command, the ls commands the argument this because
    you typed it at the keyboard, which is the standard input to the ls command. The
    ls prints the information it finds to the display, which is the standard output.


    ```

    ```carlotta@toluca carlotta$ ls this

    thisfile```

    ```


    Redirection means using the shell to change where the standard input or standard
    output goes.


    # Redirecting Output


    To redirect a command to something other than standard output (the display), use
    the > symbol after the command. When you > after the cat command or after any
    other utility or application that writes to standard output, the command directs
    its output to the file name following the symbol.


    Here''s an example. First, look at what happens when you use cat by itself to
    echo whatever you type to the screen. By itself, cat simply repeats every line
    you type:


    ```

    ```carlotta@toluca carlotta$ cat

    buy some sneakers

    buy some sneakers

    then go to the coffee shop

    then go to the coffee shop

    then buy some coffee

    then buy some coffee```

    ```


    To redirect what cat normally sends to the standard output (the screen) to a file
    instead, type the following at a shell prompt (pressing the Enter key takes you
    to the next blank line).'
