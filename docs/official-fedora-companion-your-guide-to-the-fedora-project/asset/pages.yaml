    # Email


    Email is a very popular way of communicating with others over the Internet. You
    can use email with an email client, an application that understands the various
    email transmission standards and allows you to send, receive, and read email.
    Fedora includes several email applications, Evolution, Mozilla Mail, and KMail.
    Evolution is also a personal information manager that helps you manage your schedule
    and To lists. All of the client applications are designed to suit certain types
    of users; so, you can choose one with the features that best suit your needs.


    The purpose of this section is to demonstrate how to use some of the popular email
    applications included in Fedora. Because all email clients perform the same basic
    tasks (and receive email), choose the one that is most convenient and easy to
    use.


    The following sections discuss these email clients:


    +   - Evolution


    +   - KMail


    +   - Mozilla Mail


    Before you launch an email client, you should have some information from your
    Internet service provider (ISP) handy so you can configure the client properly.
    The following lists a few important things you may need to know:


    +   - Your email address — The email address you use to send and receive mail.
    This is usually in the form of yourname@yourisp.net.


    +   - Server type for receiving mail (POP or IMAP) — To receive mail, you must
    know what type of network administrator or ISP is used. This POP or IMAP address
    is usually in the form of mail.someisp.net.


    +   - POP, short for Post Office Protocol, is used to send email from a mail server
    to your client''s inbox, the place where incoming email is stored. Most ISP email
    servers use the POP protocol, although some can use the newer IMAP.'
  merge: -1
  pgno: 108
- img_proc: true
  md: '**IMAP**, short for Internet Message Access Protocol, is a protocol for retrieving
    messages from your ISP''s email server. IMAP differs from POP in that email IMAP
    server is stored on the server and stays there as you download and read your mail,
    whereas POP mail is downloaded to your computer directly and does not stay on
    the server.


    +   **Server type for sending email (SMTP)** — The Simple Mail Transfer Protocol
    (SMTP) is a protocol for sending email messages to servers. Most email systems
    that send mail over the Internet use SMTP to send messages from one server to
    another; the messages can be retrieved with an email client using either POP or
    IMAP. SMTP is also used to send messages from a mail client to a mail server.
    This is why you need to specify both the POP or IMAP server and the SMTP server
    when you configure your email application.


    If you have any questions regarding what you need, contact your ISP or network
    administrator.


    Unless properly configured, you will not be able to make full use of the email
    clients discussed in this chapter.


    # Evolution


