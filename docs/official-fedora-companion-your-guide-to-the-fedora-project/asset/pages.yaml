  md: '# Installing Fedora


    His appendix explains how to install Fedora from the CD-ROM.

    nThe following topics are discussed:


    +   * Becoming familiar with the installation program''s user interface

    * Starting the installation program

    * Selecting an installation method

    * Performing configuration steps during the installation (language, keyboard,
    mouse, etc.).

    * Finishing the installation


    > Note If you already have another operating system installed and want to create
    a dual-boot system so that you can use both Fedora and the other operating system,
    please read Appendix D for information.


    # The Graphical Installation Program

    User Interface


    If you have used a graphical user interface (GUI) before, you will be familiar
    with this process; simply use your mouse to navigate the screens, "click" buttons,
    or enter text fields. You can also navigate through the installation using the
    Tab and Enter keys.


    > Note If you do not wish to use the GUI installation program, the text mode installation
    program is also available. Use the boot command boot: text to start the text mode
    installation program.


    # Having the Right Components


    You will need to check your hardware before you begin to install. You should have
    at least 2.1GB of free space on your hard drive for the most minimal installation
    of Fedora. However, 5GB is more realistic, and the more space you can provide
    the better Linux will run.

    Obviously, you will need a monitor and keyboard, and a mouse helpful if you plan
    to run Linux in a graphical environment.'
  merge: -1
  pgno: 204
- img_proc: true
  md: 'Check the Red Hat Compatible Hardware page at http://hardware.redhat.com/hcl
    to see whether you have any cards or components in your system that are known
    to malfunction under Fedora. Video cards are particularly troublesome, so be sure
    you have a compatible card before you install. Because this information changes
    frequently, it is best to consult the Web page rather than rely on a printed list
    that may be out of date.


    # # Starting the Installation Program


    To start the installation, you must first boot the installation program. Please
    make sure you have all the resources you will need for the installation.


    Occasionally, some hardware components require a driver diskette during the installation.
    A driver diskette adds support for hardware that is not otherwise supported by
    the installation program.


    # # Booting the Installation Program


    You can boot the Fedora installation program using any one of the following media
    (dependent upon what your system can support):


    +   * Bootable CD-ROM — Your machine supports a bootable CD-ROM drive and you
    want to perform a local CD-ROM installation.


    +   * Boot CD—A boot image can be burned to a CD for use in machines that do not
    have floppy disks. You will have to create this CD after installation is complete.


    +   * Local diskette — Your machine will not support a bootable CD-ROM and you
    want to install from a diskette or a hard drive.


    +   * Network boot diskette — Use a network boot diskette to install via Network
    File System (NFS), File Transfer Protocol (FTP), and Hypertext Transfer Protocol
    (HTTP).


    +   * PCMCIA boot diskette—Use Personal Computer Memory Card International Association
    (PCMCIA) diskettes when you need PCMCIA support but your machine does not support
    booting from the CD-ROM drive or if you need PCMCIA support in order to make use
    of the CD-ROM drive on your system. The PCMCIA boot diskettes can be used for
    all installation methods (CD-ROM, hard drive, NFS, FTP, and HTTP).


    To create a boot diskette, see "Boot Disk Creation" later in the chapter.


    Insert the boot diskette into your computer''s first drive and reboot (or reboot
    the CD-ROM, if your computer supports booting from it). Your BIOS settings may
    need to be changed to allow you to boot from the diskette or CD-ROM.


    # # Installing from CD-ROM


    To install Fedora from a CD-ROM, choose the CD-ROM option from the boot loader
    screen and select OK. When prompted, insert the Fedora CD into your CD-ROM drive
    (if you did not boot from the CD-ROM). When the CD-ROM drive selects, select OK
    and press Enter.'
