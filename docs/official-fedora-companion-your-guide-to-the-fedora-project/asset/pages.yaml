  md: '# Creating a New Partition


    The third way to make room for Linux is to create a new partition for Fedora on
    the hard drive used by the other operating system. If Windows Explorer shows only
    one hard drive (C:) and you do not want to add a new hard drive, you must partition
    the drive. After partitioning, Windows Explorer will show a smaller C: drive;
    and when you run the Fedora installation program, you can partition the remainder
    of the drive for Linux.


    Make sure to leave enough room on your Windows partition to function properly.


    You can use a destructive partitioning program, such as fdisk, to divide the hard
    drive, but doing so requires you to reinstall Windows. (This is probably not your
    best option.)


    A number of non-destructive third-party partitioning programs are available for
    the Windows operating system. If you choose to use one of these, consult their
    documentation.


    # Partitioning with FIPS


    As a convenience, FIPS provides the FIPS utility. It is a freely available program
    that can resize FAT (File Allocation Table) partitions. It is included on the
    Fedora CD-ROM in the dos directory. If you use NTFS partitions, FIPS will not
    work.


    Many people have successfully used FIPS to repartition their hard drives. However,
    because of the nature of the operations carried out by FIPS and the wide variety
    of hardware and software configurations under it must run, there is no guarantee
    that FIPS will work properly on your system. There, no installation support whatsoever
    is available for FIPS. Use it at your own risk.


    With the preceding warning in mind, if you decide to repartition your hard drive
    with FIPS, it is vital that you do the following:


    +   **Perform a Backup** — Make two copies of all the important data on your computer.
    These copies should be copied to removable media (such as tape, CD-ROM, or disettes),
    and you should make sure they are readable before proceeding.


    +   **Read the Documentation** — Read the FIPS documentation, which is located
    in the dosutils directory of the Fedora CD-ROM#1.


    Should you decide to use FIPS, FIPS runs will leave you with two partitions: the
    one you resized and the one created out of the free space. If your goal is to
    install Fedora, you should delete the newly created partition, either by using
    fdisk under your current operating system or while setting partitions during a
    custom-class installation.


    The following instructions are a simplified version of the FIPS documentation
    file. These instructions should apply in most instances. If you encounter any
    problems, see the documentation file.


    +   1. From within Windows, perform the following steps:


    +   a. Do a full backup.


    +   b. Run scandisk to verify that the hard drive contains no bad clusters.


    +   c. Decide how to distribute the available space on the hard drive between
    the operating systems.'
