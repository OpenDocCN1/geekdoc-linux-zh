  md: '# Appendix C + Troubleshooting Your Installation of Fedora 219


    This error occurs in some systems where links to /tmp are symbolic to other locations
    or have been changed since creation. These symbolic or changed links are invalid
    during the installation process, so the installation program cannot write information
    and fails.


    If you experience this error, first try to download any available errata for Anaconda.
    You can find errata at the Fedora Project Web site at http://fedora.redhat.com/.


    You can also search for bug reports to this problem. To search Red Hat''s bug
    tracking system, go to http://bugzilla.redhat.com/bugzilla.


    # Problems After Installation


    If you have problems after installing Fedora, the following sections help you
    troubleshoot the problem.


    # Trouble with the Graphical GRUB Screen


    For some reason you need to disable the graphical boot screen, you can do so,
    as root, by editing the /boot/grub/grub.conf file and rebooting your system.


    To do this, comment out the line that begins with splashimage in the grub.conf
    file. (To comment out a line, insert the ; character at the beginning of the line)


    Once you reboot, the grub.conf file will be reada and your changes will take place.


    Once you''ve fixed the problem, you may re-enable the graphical boot screen by
    uncommenting (or adding) the splashimage line back into the grub.conf file and
    rebooting.


    # Trouble with the Graphical LILO Screen


    For some reason you need to disable the graphical boot screen, you can do so,
    as root, by editing the /etc/lilo.conf file and rebooting LILO.


    First, as root, comment out (or delete) the line which reads message=/boot/message
    in the /etc/lilo.conf file. To comment out a line, insert the ; character at the
    beginning of the line.


    Next, rerun LILO by /sbin/lilo -v. The next time you boot, you will see the LILO:
    text prompt that was used in previous Fedora releases.


    You may re-enable the graphical boot screen by adding (or uncommenting) the message=/boot/message
    line back into the lilo.conf file and rerunning LILO.


    > If you edit the lilo.conf configuration file, you must reload it by typing lilo
    -v at the prompt before you reboot the machine.


    # Problems Booting into a Graphical Environment?


    If you have installed the X Window System, but are not seeing a graphical desktop
    environment once you log in to your Fedora system, you can easily start the X
    Window System interface using the command startx after you log in.


    Once you enter this command and press Enter, you will be able to log in to the
    Fedora graphical desktop.'
  merge: -1
