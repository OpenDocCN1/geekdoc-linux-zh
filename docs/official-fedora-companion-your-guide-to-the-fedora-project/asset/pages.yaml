    The KMail Client window contains seven sections: Identity, Network, Appearance,
    Composer, MIME Headers, Security, and Miscellaneous. To begin sending and receiving
    messages, you have to change the settings in the Identity and Network tabs. The
    Network tab includes two tabs you need to configure. One helps you configure KMail
