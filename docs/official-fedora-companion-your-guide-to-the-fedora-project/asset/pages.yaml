    # Disk Druid''s Buttons


    Disk Druid''s buttons control the utility''s actions. These buttons are used to
    change the attributes of a partition (for example, the file system and mount point)
    and also to create RAID devices. Buttons on this screen are used to accept the
    changes you have made, or to exit Disk Druid. For further explanation, take a
    look at each button in order:


    +   **New**—Used to request a new partition. When selected, a dialog box appears
    containing fields (such as mount point and size) that must be filled in.


    +   **Edit**—Used to modify attributes of the partition currently selected in
    the Partitions section. Selecting Edit opens a dialog box. Some or all of the
    fields can be edited, depending on whether the partition information has been
    written to Druid. You can also edit free space as represented in the graphical
    display to create a new partition within that space. To do this, highlight the
    free space and then select the Edit button or double-click on the free space to
    edit.


    +   **Delete**—Used to remove the partition currently highlighted in the Current
    Disk Partitions section. You will be asked to confirm the deletion of any partition.


    +   **Reset**—Used to restore Disk Druid to its original state. All changes made
    will be lost if you reset the partitions.


    +   **RAID**—Used to provide redundancy to any or all disk partitions. This should
    be used only if you have experience using RAID. To read more about RAID, refer
    to the *Official Red Hat Linux Administrator''s Guide* from Red Hat Press. To
    create a RAID device, you must first create software RAID two or more software
    partitions, select RAID to join the software RAID partitions into a RAID device.'
