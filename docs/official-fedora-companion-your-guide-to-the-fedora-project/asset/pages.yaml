    # Boot Loader Configuration


    To boot the system without a boot diskette, you usually need to install a boot
    loader. A boot loader is the first program that runs when a computer starts. It
    is responsible for loading and transferring control to the operating system kernel
    software. The kernel, in turn, initializes the rest of the operating system.


    The installation program (see Figure B-11) provides two boot loaders for you to
    choose from:


    +   *GRUB (GRand Initial Bootloader), which is installed by default, is a very
    powerful boot loader. GRUB can load a variety of operating systems, as well as
    proprietary operating systems with chain-loading (the mechanism for loading unsupported
    operating systems by loading another boot loader, as MS-DOS or Windows.'
