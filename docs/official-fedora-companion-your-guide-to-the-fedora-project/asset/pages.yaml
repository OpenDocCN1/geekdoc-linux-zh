    for when you are using a graphical desktop (Table G-1), common keyboard shortcuts
    for most applications (Table G-2), some keyboard shortcuts you can use at a shell
    prompt or virtual terminal (Table G-3), and some shortcut characters you can use
    at the shell prompt or virtual window (Table G-4).


    Many more are available in addition to those listed in this appendix. For command
    line and keyboard shortcuts, visit:

    http://sunsite.dk/linux-newbie/linux_commands.html#shortcuts


