  md: '# Chapter 2 ✨ Ahead of the Bluecurve


    # Setting Your Preferences


    The central location for customizing your system is from the Preferences menu
    of the Main Menu. (You can also access Preferences by double-clicking the Start
    Here Icon on your desktop and double-clicking the Preferences Icon.) The Preferences
    menu offers a wide selection of configuration options. The following list discusses
    these options briefly.


    +   * About Myself — From here you can change your login shell, as well as add
    information about yourself such as your home and office numbers.


    +   * Accessibility — Here you can make changes to the way Fedora responds to
    presses, mouse clicks, and so on.


    +   * Background — From here you can configure your background with new colors,
    patterns, or a new image.


    +   * CD Properties — From here you can change whether or not CDs are automatically
    mounted by default, which command is executed when a CD is inserted in the drive,
    and more.


    +   * File types and programs — From here you can add new file types and change
    the programs that are associated with file types.


    +   * Font — Here you can configure which fonts are used for various system elements,
    such as title bars, terminal windows, the desktop, and applications.


    +   * Keyboard — You can make decisions about your keyboard, such as the keyboard
    repeats, the blink rate, and whether you want your keyboard to beep at you.


    +   * Keyboard Shortcuts — You can configure shortcuts (pressing a combination
    of keystrokes) to perform actions in an application or on your desktop. For example,
    you can configure a shortcut to move from your current workspace to another workspace
    by pressing Ctrl+F2.


    +   * Login Photo — If you require Fedora to choose from a list of login names,
    you can use this to select the face that appears by your login name.


    +   * Menus and Toolbars — Customize the way your toolbars and menus behave. For
    example, you can choose not to have icons displayed in menus.


    +   * Mouse — Here you can configure your mouse, with options such as allowing
    for a left-handed mouse, setting your double-click delay, and changing your cursor
    and the sensitivity of mouse motions.


    +   * Network Proxy — Here you can set your HTTP proxy (if you have one), as well
    as your username and password the proxy may require.


    +   * Password — This tool allows you to change your user password; you have to
    enter your existing password first.


    +   * Preferred Applications — You can have Fedora start up a default browser
    like Mozilla, which is the default, or select another default editor or command
    terminal.


    +   * Screen Resolution — You can change the size and resolution of your screen.


    +   * Screensaver — This tool lets you change your default screensaver, configure
    the settings of a given screensaver, and set the number of minutes your system
    will wait to bring the screensaver up.'
  merge: -1
  pgno: 58
- img_proc: true
  md: '+   Sound — In this section you can configure the system sounds associated
    with various functions. For example, if you would like to have a sound play when
    you log in to your desktop, you can configure it here.


    +   Theme — This utility allows you to change your desktop theme or even individual
    details of your theme, such as the look of icons, windows, and graphical controls
    (buttons, and so on).


    +   Windows — This tool enables you to change the way you give a window focus
    (which means bringing it to the front). The default setting is that you have to
    click somewhere on the window to give it focus, but you can also configure your
    settings so that you can merely point to a window to bring it to the front. It
    also controls whether or not you roll up windows into the title bar.


    # # Customizing the Desktop


    The Start Here in Nautilus contains additional configuration tools that help you
    with your new Fedora system and the server applications included. The System Settings
    includes tools that help you set up your system for everyday use. Below you will
    find a list of tools included in System Settings and what you can do with them.


    +   Date & Time — This tool allows you to set the date and time of your machine.
    You will be able to set your time zone information as well.


    +   Soundcard Detection — The Soundcard Detection tool probes your machine for
    available devices.


    +   Users & Groups — The Users & Groups allow you to add and remove users from
    your system.


    +   Printing — The Printer Configuration Tool allows you to add a new printer
    to your system. The printer may be connected to your machine or available on a
    network.


    You will also find server configuration tools in the Start Here area. These tools
    help you configure services and applications you are using on the local machine
    to serve other machines. The server configuration tools are found by clicking
    on the Server Settings icon. A couple of examples of the tools found in this area
    are the tools for the Apache Web Server and a DNS/Bind tool. You must have server
    applications installed before these tools appear in this section.


    # # Customizing the Panel


    You can hide the Panel automatically or manually, place it on any edge of your
    desktop, change its size and color, and how it behaves. To alter the default Panel
    settings, right-click in an unused area of the Panel (a good place to try is the
    space to the left of the date and time) and select Properties. You can set the
    size of the Panel, its position on the desktop, and whether you want the Panel
    to be automatically hidden (Authide) when not in use. If you choose to Autohide
    the Panel, it will not appear on the desktop until you move your pointer toward
    it.


    # # Adding Icons and Applets to the Panel


    To make the Panel fit your needs, you may want to add more applets and launcher
    icons. To add an applet to the Panel, right-click in an unused area of the Panel,
    select Add to Panel, and choose from the menu of applets. When you select an applet,
    it will appear on your Panel, because that is the only place it will run.'
  merge: -1
  pgno: 59
- img_proc: true
  md: '# Chapter 2 Ahead of the Bluecurve


    To add a launcher icon to the Panel, right-click in an unused area on the Panel
    and select Add to Panel Launcher. This will launch a dialog box that allows you
    to enter the name of the application, the location and command of the command
    that starts the application (such as `/usr/bin/foo`), and even choose an icon
    for the application. Click OK, and the new launcher icon will appear on the Panel.


    Another quick and easy way to add a launcher to the Panel is to right-click on
    an unused area and choose Add to Panel from the menu. Then select an application
    that appears in the menu. This will automatically add a launcher icon based on
    the properties of the item in the Main Menu.


    Tip


    # Autiding the Panel


    Autiding the Panel makes the Panel disappear altogether until you drag your mouse
    to the bottom of the screen (whichever edge of the screen is located). To autohide
    it, right-click an empty spot on the Panel and select Properties, check the Autohide
    box, and click Close.


    # Moving the Panel


    To move the Panel, right-click an empty spot on the Panel and choose Properties.
    Then click the desired Position for your Panel. The Position options will be different
    depending on the type of Panel you are dealing with.


    # Resizing the Panel


    To resize the Panel, right-click an empty spot on the Panel and choose Properties.
    Then pull the Size: drop-down list and choose a new size for your Panel. The size
    for the default Panel is Medium (48 pixels).


    # Addingers to the Panel


    A drawer is really like a Panel within a Panel (see Figure 2-12). A drawer can
    be collapsed to just an icon (a drawer) or extended into entirely new drawers.
    Drawers are quite useful for organizing applications on a Panel. For example,
    you might want to have a drawer on your Panel that includes all of your Internet
    software and another drawer that contains all of your Office Productivity software
    to avoid a cluttered Panel.


    To add a drawer to the Panel, right-click an empty spot on the Panel and choose
    Add to Panel Drawer from the menu that appears.


    # Adding Panels


    To add a panel, right-click any empty spot on the Panel and choose New Panel.

    Figure 2-13 shows the desktop with an additional panel on the top of the screen.
    We added a menu bar by right-clicking on the panel, and then choosing Add to Panel
    Menu Bar from the menu that appears.


    # Deleting a Panel


    To delete a Panel, right-click the panel you want to delete and choose Delete
    this from the menu that appears. All of the configuration settings will be lost
    this.


    Caution You can delete the original Panel, but all of the settings will be lost.'
