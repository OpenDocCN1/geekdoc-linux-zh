    # # Tab Completion


    Another timesaving tool is known as command completion. If you type part of a
    file, command, or path and then press the Tab key, bash presents you with either
    the remaining portion of the file/path, or a beep (if the beep sound is enabled
    on your system). If you get a beep, press Tab again to obtain a list of the files/paths
    that match what has been so far.


    For example, if you forget the command updatedb, but remember a part of the command,
    you can su to root and then type up at the shell prompt; press the Tab key twice,
    and you will see a list of possible commands including updatedb. By typing the
    partial command upd and pressing Tab again, your command is completed for you.


    # # Ownership and Permissions


    Earlier in this chapter, when you tried to cd to root''s login directory, you
    received the following-message:


    ```

    [carlotta@toluca carlotta]$ cd /root

    bash:/root: Permission denied

    [carlotta@toluca carlotta]$

    ```


    That was one demonstration of Linux''s security features. Linux, unlike Unix,
    is a multiuser system, and file permissions are one way the system protects against
    accidental or malicious tampering.


    One way to get entry when you are denied permission is to su to root, as you learned
    earlier in this chapter. This is because whoever knows the root password has complete
    access to the system.


    ```

    [carlotta@toluca carlotta]$ su

    Password:your_root_password

    [root@localhost carlotta]$# cd /root

    [root@localhost /root]$

    ```


    But switching to the root user is not always convenient or recommended, because
    it is easy to make mistakes and alter important configuration files as root.


    All files and directories are "owned" by the person who created them. If, for
    example, you create the file sneakers.txt in your login directory, sneakers.txt
    belongs to you. That means you can specify who is allowed to read the file, write
    to the file, or (if it is an application instead of a text file) who can execute
    the file.


    Reading, writing, and executing are the three main settings in permissions. Because
    users are placed into a group whose accounts are created, you can also specify
    whether certain groups can read, write to, or execute a file.'
