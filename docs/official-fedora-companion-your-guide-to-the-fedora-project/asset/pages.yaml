  md: 'The following sections show you how to customize your system to suit your needs
    and preferences, starting with the most basic means of customizing your system
    to a brief overview of how to customize your system to the finest detail.


    # Setting Your Preferences


    The easiest central location for customizing your system is from the Preferences
    menu of the Main Menu. (You can also access Preferences by double-clicking the
    Start Here on your desktop and double-clicking the Preferences icon.) The Preferences
    menu offers a wide selection of configuration options. The following list discusses
    these options:


    +   * About Myself — From here you can change your login shell, as well as add
    information about yourself such as your home and office phone numbers.


    +   * Configure Panel — You can configure the Panel location and behavior.


    +   * Desktop Settings Wizard — Run this wizard for the easiest way to set up
    your desktop with a custom look and feel.


    +   * Login Photo — If you reconfigure Fedora to let you choose from a list of
    login names, you can use this to set the face that appears by your login name.


    +   * Password — This tool allows you to change your user password; you will have
    to enter your existing password first.


    +   * Printing Manager — You can set up your printers here.


    # Customizing the Desktop


    The Start Here screen in Konquer contains additional configuration tools that
    help you with your new Fedora system and the server applications. The System Settings
    include tools that help you set up your system for personal everyday use. The
    following lists include some of the tools in System Settings and what you can
    do with:


    +   * Date & Time — This tool allows you to set the date and time of your machine.
    You can set your time zone information as.


    +   * Soundcard Detection — The Soundcard Detection tool probes your machine for
    available devices.


    +   * Users & Groups — The Users Groups tool allows you to add and remove users
    from your system.


    +   * Printing — The Printer Configuration tool allows you to add a new printer
    to your system. The printer may be connected to your machine or available on a
    network.


    You will also find server configuration tools in the Start Here area. These tools
    help you configure services and applications you are using on the local machine
    to serve other machines. You can find the server configuration tools by clicking
    on the Server Settings. A couple of examples of the tools found in this area are
    the tools for the Apache Web Server and a DNS/Bind tool. You must have those server
    applications installed before these tools appear in this section.'
  merge: -1
  pgno: 81
- img_proc: true
  md: '# Adding Icons and Applets to the Panel


    To make the Panel fit your needs, you may want to add more applets and launcher
    icons. To add an applet to the Panel, right-click in an unused area on the Panel,
    select Add ⊕ Applet, and then choose from the menu of applets. When you select
    an applet, it will appear on your Panel because that is the only place it will
    run. If you want to move the applet somewhere else on the Panel, right-click on
    the applet and select Move.


    You can also add applications, special buttons, and extensions to the Panel. For
    example, add a Recent Documents selector by right-clicking in an unused area on
    the Panel, then select Add ⊕ Special Button ⊕ Recent Documents. This adds a document
    icon that, when clicked, brings up a menu of the documents or folders you recently
    had open (see Figure 3-12).


    # Customizing the Panel Look


    You can customize the Panel to an amazing level of detail. Click the Main Menu
    ⊕ Preferences ⊕ Configure Panel to open the panel settings window (see Figure
    3-13). There are three icons on the left entitled Layout, Appearance, and Taskbar.


    ![](img/67d9607982940021da1fe4247b9b224c_82_0.png)


    Figure 3-12: Recent Documents Special Button'
  merge: -1
