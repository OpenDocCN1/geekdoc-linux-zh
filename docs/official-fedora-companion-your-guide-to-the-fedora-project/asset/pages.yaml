  md: '# CHAPTER 8


    # Diskettes and CD-ROMs


    Using diskettes and CD-ROMs with Fedora requires understanding about removable
    media. No, removable media is not a portable television set, although there is
    a similarity in the concept. Think of removable media as something you can, well,
    remove. You open your computer''s CD-ROM drive, remove the CD, and take it with
    you; a CD-ROM is removable media. Other examples of removable media are diskettes
    and digital film devices such as compact flash.


    This chapter discusses how to read and write files to and from diskettes, how
    to format diskettes, and how to read and copy data from a CD-ROM. This chapter
    also covers CD-writable and CD-rewritable drives.


    > The term disk typically refers to disks such as hard drives; the term diskette
    usually refers specifically to floppy disks, and the term disc refers to optical
    media such as CD-ROMs and DVDs.


    # Using Diskettes


    Diskettes are one of the oldest removable media solutions available for the PC.
    Diskettes are ideal as a portable storage solution for files that need to be physically
    moved around. For example, if two PCs are not on the same network, diskettes are
    a great solution to transfer files from one computer to the other.


    # Mounting and Unmounting a Diskette


    You must insert a diskette into your disk drive and mount it before you can begin
    using it. After you insert the floppy, mount the diskette by right-clicking on
    the GN desktop and choosing Disks Floppy. You can also click on the Start menu
    and select System Tools Disk Management, which starts the User Mount Tool as shown
    in Figure 8-1. Once you mount a floppy, a desktop icon appears for the floppy.
    You can double-click this icon to explore the diskette contents (see Figure 8-2).'
