  md: '# Tips and Traps


    You may be in the habit of typing the `cd` (change directory) command by itself
    in MS-DOS to print your current directory (use `pwd` in Linux to print the current
    working directory). If by force of habit you type the `cd` command by itself in
    Linux, it may not seem to do anything at all, but looks can be deceiving. `cd`
    by itself in Linux and it automatically changes your current working directory
    to your home directory. If you happen to slip up and type `cd` by itself and accidentally
    go to your home directory, type `cd -` to get back to where you were before you
    made the mistake.


    Looking for a file? In MS-DOS, you type `dir /s <filename>`, and it looks for
    any file that matches whatever name or pattern you substitute for `<filename>`,
    starting with the current directory and searching any directory below. In Linux,
    type `find -name <filename>-print` to accomplish the same task. Even better, type
    `locate <filename>`, and you''ll find the file almost anywhere on your system.
    Watch out, though—the `locate` command finds any file or directory if whatever
    you specified for `<filename>` appears anywhere in the full path, so it can return
    a lot of matches.'
  merge: -1
