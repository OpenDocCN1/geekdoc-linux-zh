  md: 'To view the jobs waiting in the print queue, type lpq at the command line and
    you will see

    information similar to the following:


    ```

    active root 389 foo.txt

    ```


    In this example, 389 is the job number.


    You can cancel jobs in the queue by typing lpr followed by the print job number
    displayed

    when you use the lpr command. To cancel the foo.txt print job, for example, you
    would

    type lpr 389 and press Enter.


    # Clearing and Resetting the Terminal


    After even one is command in a shell prompt, the terminal window you are working
    in can

    begin to look crowded. You can always exit from the terminal window and open a
    new one,

    but there is a quicker and easier way to clear the displayed in the terminal:
    clearing


    To clear the terminal, type command clear at the shell prompt. The command then

    clears the terminal.


    Sometimes, you may accidentally open a program file or some non-text file in a
    terminal

    window. After closing the file, you could find that the text you are typing does
    not match the

    output on the monitor.


    In such cases, type reset to return the terminal window to its default values.


    # Using Multiple Commands


    Linux allows you to enter multiple commands at one time. The only requirement
