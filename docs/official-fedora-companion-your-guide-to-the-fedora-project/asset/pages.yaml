  md: '# # The Command Line Power Approach


    Sometimes it''s just easier or more rewarding to do tasks at the command line.
    If you''re familiar with how to open a shell prompt and type commands, you may
    find these summaries and tips useful for copying and creating audio and data CDs.


    # ## Using CD-Rs and CD-RWs with Command-Line Tools


    One of the first things you need to do before you can start recording with your
    CD-R or CD-RW drive at the command line is to log in as the root user or switch
    to the root user using the sudo command.


    Next, you need to discover where Fedora has the CD-R or CD-RW drive on the SCSI
    bus. This rule applies to your system even if your CD recorder is an Integrated
    Drive Electronics (IDE) drive. Linux talks to your CD-R and CD-RW drives via the
    Small Computer System Interface (SCSI) protocol even if you don''t. The magic
    Linux uses to accomplish this is irrelevant at this point—just be aware that you
    need to discover the SCSI interface Linux has assigned your drive.


    Here''s how. Type the command


    ```

    cdrecord -scanbus

    ```


    Here''s a sample of what you might see when you run this command. In this case,
    Linux has created two SCSI buses. One (scsi0) has a digital media reader for digital
    film, and the other (scsi1) has the CD-RW drive recognized. Note that the SCSI
    device for the CD-RW drive is 1.0. This means that whenever you use commands such
    as `cdrecord or mkisofs`, you have to tell these commands to find the CD-RW drive
    with the command-line parameter dev=1,0,0.


    scsi0:


    | 0,0,0 | 0) ''SanDisk'' ''ImageMate III'' ''2.31'' Removable Disk |

    | 0,1,0 | 1) * |

    | 0,2,0 | 2) * |

    | 0,3,0 | 3) * |

    | 0,4,0 | 4) * |

    | 0,5,0 | 5) * |

    | 0,6,0 | 6) * |

    | 0,7,0 | 7) * |


    scsi1:


    | 1,0,0 | 100) ''ATAPI'' ''CD-RW 52X24'' ''K.DC'' Removable CD-ROM |

    | 1,1,0 | 101) * |

    | 1,2,0 | 102) * |

    | 1,3,0 | 103) * |

    | 1,4,0 | 104) * |

    | 1,5,0 | 105) * |

    | 1,6,0 | 106) * |

    | 1,7,0 | 107) * |


    Now that you know which device you need to use, use a command like the following
    if you want to make a CD-ROM from a pre-created CD-ROM image:


    ```

    cdrecord -v dev=1,0,0 cdimage.raw

    ```'
  merge: -1
  pgno: 168
- img_proc: true
  md: 'The additional parameter -v simply tells cdrecord to provide you with more
    verbose information as it works. See the section "Usingcdrecord" later in the
    chapter for more options.


    # Copying an Audio CD at the Command Line


    If you want to copy an audio CD the best way possible at the command line, find
    or create an empty directory and change to that directory. Using emptydirectory
    does not exist in your home directory, you can do this with three simple commands.
    The first takes you to your home directory. The second one creates the new, empty
    directory emptydirectory (or you can substitute any name you like). The third
    command makes the new directory your current working directory.


    ```

    cd

    mkdir emptydirectory

    cd emptydirectory

    ```


    Now you need to read all the information from the audio CD with the following
    command. (This command assumes you use the same CD drive for both reading and
    writing the audio CD.)


    ```

    cdda2wav -all cddb=0 -1,0,0 B -Owav

    ```


    Now pop in your recordable CD and use this type to make the copy:


    ```

    cdrecord -v dev=1,0,0 -dao -useinfo -text *.wav

    ```


    Voila, you should now have an accurate copy of the original audio CD.


    Did you encounter a problem? There are many reasons why you might find a glitch
    in the preceding procedure, but here are the most common problems to check:


    +   - Did you make sure the -0 parameter for the cdda2wav command has the numbers
    following it? They should match the numbers for the CD drive you detected with
    the cdrecord-scanbus command.


    +   - Did you have enough free space to store the audio CD on your local drive
    when you use the cdda2wav command?


    +   - Is the original audio CD scratched or damaged in some way?


    +   - Is the recordable CD truly a blank, never-used recordable CD with no scratches,
    dirt, or other problems?


    +   - Is the blank recordable CD able to record as much information as was recorded
    on the original audio CD? For example, recordable CDs store only 74 minutes or
    650MB of data, and some original CDs use extended formats that require more space.
    Larger recordable CDs are available.


    See the section "Using cdrecord" later in the chapter for other possible issues.


    # Copying a Data CD at the Command Line


    Here''s a simple way to copy a data CD. Find or create an empty directory with
    sufficient space available and change to that directory. Assuming you have enough
    space in the partition where your home directory resides, and also assuming the
    emptydirectory doesn''t exist in your home, you can do this with three simple
    commands. The first one'
  merge: -1
  pgno: 169
- img_proc: true
  md: '# Chapter 8 ♦ Diskettes and CD-ROMs 149


    takes you to your home directory. The second one creates the new, empty directory
    empty-directory (or you can substitute any name you like). The third command makes
    the new-directory your current working directory.


    ```

    cd -

    mdir emptydirectory

    cd emptydirectory

    ```


    Now you need to read all the information from the CD data with the following command.
    This command simply copies everything from the device to a file called cimage.raw.
    (This-command assumes you have only one CD drive installed, and so it is the first
    SCSI drive on the system.)


    ```

    cp /dev/scd0 cimage.raw

    ```


    Depending on how your system is configured, the command may also work, and you
    may find it more intuitive:


    ```

    cp /dev/cdrom cimage.raw

    ```


    Now pop in your blank recordable CD and type this command to make the copy:

    cdrecord -v dev=1,0,0 cimage.raw


    That''s all there is to it. You should now have an accurate copy of the original
    CD data.

    Did you encounter a problem? There are many reasons why you might find a glitch
    in the pre-ceding procedure, but here are the most common problems to check:


    +   ♦ Did you check to make sure the drive for your CD is /dev/scd0 or /dev/cdrom?

    ♦ Did you have enough free disk space to store the CD data on your local drive
    when you used the cp command?

    ♦ Is the original CD scratched or damaged in some way?

    ♦ Is the original data CD copy protected?

    ♦ Is the blank recordable CD truly a blank, never-used recordable CD with no scratches,
    dirt, or other problems?

    ♦ Is the recordable CD able to record as much information as recorded on the original
    audio CD? For example, some recordable CDs store only 74 minutes or 650MB of data,
    and some original CDs use extended formats that require more space. Larger recordable
    CDs are available.


    See the section "Using discrecord" later in the chapter for other possible issues.


    # Backing up Data from Your Disk to a CD-R(W)


    When you want to store data from your disk to a CD-R or CD-RW, you should first
    create a suitable CD image using the mkisofs utility. Then you can write that
    file directly to the CD-R or CD-RW.


    Use mkisofs with caution when you use it for the purpose of backing up your files,
    since it does not always store file attributes (permissions, file owners) the
    way you would expect them.'
