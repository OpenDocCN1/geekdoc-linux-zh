  md: '# # Command-Line Power: Shell Prompt Basics


    Once upon a time, long before the days of the graphical desktop and mouse, computer
    users worked by typing commands and writing scripts to automate those commands.
    The program that "understands" these commands and executes them is called a shell.
    Many command shells are available for Linux, but the default shell is a royalty-free
    variant of the Bourne Shell (named after its creator, S.R. Bourne). The Linux
    variant is called the Bourne Again Shell, more commonly known as bash.


    This shell prompt (also known as the command-line interface, or CLI), the text-only
    interface to your Fedora system, is more powerful than ever. Just about any administration
    task (such as managing files, users, and groups) can be performed from the shell
    prompt. When you enter commands at a shell prompt, the shell interprets these
    commands and tells the Linux operating system (OS) what to do. Experienced users
    can write shells to expand their capabilities further.


    By default, Fedora uses the bash shell, although you can change to another shell
    if you prefer by typing the name of the shell at the command prompt, type csh
    at the bash prompt to switch to the C shell.


    This chapter shows the basics of how to interact with Fedora from a shell prompt.


    # ## Why Use a Shell Prompt?


    Graphical environments for Linux have come a long way in the past few years. You
    can be perfectly productive in the X Window System and rarely, if ever, have to
    open a shell prompt to perform all your work. Many Fedora functions can be completed
    faster from the shell prompt than from a graphical desktop such as GNOME or KDE.
    For example, it is easier and faster to locate a directory, create, delete, and
    modify files from a shell prompt than it is to open a file manager and point-and-click
    to perform the same operations'
  merge: -1
  pgno: 174
- img_proc: true
  md: 'using a graphical desktop. As you can see in Figure 9-1, a shell prompt looks
    similar to other

    command-line interfaces you might be familiar with, such as MS-DOS.


    ![](img/67d9607982940021da1fe4247b9b224c_175_0.png)


    **Figure 9-1:** A Shell Prompt


    The following sections explain how to navigate, manipulate files, perform simple
    administra-

    tasks, and other shell prompt basics.


    # # Opening a Shell Prompt


    Before you can type commands at a shell prompt, you need to start one up, or put
    another

    way, open a terminal window. You can choose from a number of terminals available
    through

    the system menus, which vary slightly depending on whether you are using the GNOME
    ver-

    s of Blue般 or the KDE version of Bluecolor. Regardless of whether you are using

    GNOME or KDE, you can right-click on a vacant area of the desktop and select Open
    Terminal

    from the pop-up menu. Or you can open up a basic command prompt terminal by pressing

    Alt-F2 to bring up a run custom command dialog, after which you can type xterm
    and then

    press the Enter key.


    # # What Are Directories?


    When you double-click on your Home icon on the desktop, you open what is called
    a folder.

    Graphical desktops often use the word folder to reflect an office environment,
    where

    you store documents in folders, and perhaps store those folders in other folders.

    In geeko, however, a folder is a directory. When you create a new folder within

    older, you are actually creating a new directory below (or within) a directory.
    It might be

    useful to think of the new directory as a branch of the existing directory, since
    the entire

    directory system is a directory tree. The root in the Linux file system consists
    of

    directories starting with the root directory. The root root in the term root directory
    has not-

    ing to do with the root user. In this case, the word root simply means this directory
    is at the

    root, or base, of the entire directory tree.'
  merge: -1
