  md: '# Official Fedora Companion


    +   * To move a file, hold down the Shift key and drag the file with the mouse.

    * To copy a file, hold down the Ctrl key and drag the file with the mouse.

    * To create a link to a file in another location, hold down the Ctrl and Shift
    keys and then drag the file with the mouse.


    By default, text-based files and images in your home directory will be seen as
    thumbnails. For text files, this means you will see a portion of the actual text
    in the icon. For images, you will see a downed (or thumbnail) version of the image.
    To turn off this feature for the current window or view, select View ⇌ Preview:
    Show Previews from the menu to toggle the feature off. Do the same to toggle it
    back.


    You can turn off previews of selected types of files, or turn them off completely
    by configuring Konquer. Open the Konquer settings window by selecting Settings
    ⇌ Configure Konquer (see Figure 3-6). Click on the icon on the left for whatever
    settings you''d like to change. In this case, you would click on the Previews
    icon.


    ![](img/67d9607982940021da1fe4247b9b224c_77_0.png)


    Figure 3-6: Konquer Previews Settings


    # Start Here


    The Start Here window (see Figure 3-7) was designed to hold all of the tools and
    applications you need to access when using your system. From your favorite applications
    to system and configuration tools, the Start Here window provides a central location
    for using and customizing your system.


    You can access Start Here at any time by double-clicking on the desktop icon labeled
    Start Here.


    The Start Here screen includes icons that allow you to access your favorite applications,
    desktop preferences, Main Menu items, server configuration tools, and system settings.'
  merge: -1
