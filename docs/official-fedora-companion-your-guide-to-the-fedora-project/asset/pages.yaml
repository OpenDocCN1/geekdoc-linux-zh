  md: '# Appendix B - Installing Fedora 197


    At the graphical LILO screen, press Ctrl-X to exit the boot: prompt. If you forget
    the boot labels defined on your system, you can always press Tab at the prompt
    to display a list of defined boot labels.


    Boot loader passwords provide a security mechanism in an environment where physical
    access to your server is available.


    Caution


    If you are installing a boot loader, you should create a password to protect your
    system. Without a boot loader password, users with access to your system can pass
    options to the kernel, which can compromise your system security. With a boot
    loader password in place, the password must first be entered to select any non-standard
    boot options.


    If you choose to use a boot loader password to enhance your system security, be
    sure to select the check box labeled Use Boot Loader Password.


    Once selected, enter a password and confirm it.


    # Advanced Boot Loader Configuration


    To configure more boot loader options, such as changing the drive order or passing
    options to the kernel, ensure Configure Advanced Boot Loader Options is selected
    before clicking Next.


    Now that you have chosen which boot loader to install, you can also determine
    where you want the boot loader to be installed (see Figure B-12). You can install
    the boot loader in one of two places:


    +   The master boot record (MBR) — This is the recommended place to install a
    boot loader unless the MBR already starts another operating system loader, as
    System Commander. The MBR is a special area on your hard drive that is automatically
    loaded by your computer''s BIOS and is the earliest point at which the boot loader
    can take control of the boot process. If you install it in the MBR, when your
    machine boots, GRUB (or LILO) presents a boot prompt. You can then boot Fedora
    or any other operating system that you have configured the boot loader to.


    +   The first sector of your boot partition — This is recommended if you are already
    using another boot loader on your system. In this case, your other boot loader
    takes control first. You can then configure that boot loader to start GRUB (or
    LILO), which boots Fedora.


    If your system will use only Fedora, you should choose the MBR. For systems with
    Windows 95/98, you should also install the boot loader to the MBR so that it can
    boot both operating systems.


    Caution


    For systems with NT/2000/XP, you should install the boot loader on the first sector
    of the partition, or the Linux boot loader will overwrite the boot loader and
    you will no longer be able to boot Windows.


    Click the Change Drive Order button if you would like to rearrange the drive order.
    Changing the drive order may be useful if you have multiple SCSI adapters or both
    SCSI and IDE adapters and want to boot from the SCSI device.'
