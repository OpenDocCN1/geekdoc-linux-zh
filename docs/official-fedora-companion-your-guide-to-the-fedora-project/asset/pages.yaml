  md: "For example, chmod a-x tigger to remove everyone's execute permissions.\n\n\
    Here is what happens now when you type cd into tigger:\n\n```\n [carlotta@toluca\
    \ carlotta]$cd tigger\nbash: tigger: Permission denied\n[carlotta@toluca carlotta]$\n\
    ```\n\nNext, restore your own and group's access:\n\n```\n[carlotta@toluca carlotta]$\
    \ chmod ug+ tigger\n```\n\nNow, if you check your ls -dl, you see that only others\
    \ will be denied access to the tigger directory.\n\n# Changing Permissions with\
    \ Numbers\n\nRemember the reference to the shorthand of chmod? Here is another\
    \ way to change permissions, although it may seem a little complex at.\n\nGo back\
    \ to the original permissions for sneakers.txt (type ls -1 sneakers.txt):\n\n\
    ```\n-rw-rw-r--      1 sam sam      150 Mar 19 08:08 sneakers.txt\n```\n\nEach\
    \ permission setting can be represented by a numerical value:\n\n```\nr = 4\n\
    w = 2\nx = 1\no = 0\n```\n\nWhen these values are added together, the total is\
    \ used to set specific permissions. For example, if you read and write permissions,\
    \ you would have a value of 6, that is 4 (read) + 2 (write) - 6.\n\nFor sneakers.txt,\
    \ here are the numerical permissions settings:\n\n```\n(rw-) (rw-) (r--)\n | \
    \   |    |\n 4+2+0 4+2+0 4+0+0\n```\n\nThe total for the user is 6, the total\
    \ for the group is 6, and the total for others is 4. The permissions setting is\
    \ read as 664.\n\nIf you want change sneakers.txt so those in your group do not\
    \ have write access but can still read the file, remove the access by subtracting\
    \ 2 from that set of numbers.\n\nThe numerical values, then, would become 6, 4,\
    \ and 4 (644).\n\nTo implement these new settings, type the following:\n\n```\n\
    [carlotta@toluca carlotta]$ chmod 644 sneakers.txt\n```\n\nNow verify your changes\
    \ by listing the file. Type the following:\n\n```\n[carlotta@toluca carlotta]$\
    \ ls -1 sneakers.txt\n```"
