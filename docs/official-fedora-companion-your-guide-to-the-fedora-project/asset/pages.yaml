    If you are the owner of the file or are logged into the root account, you can
    change any permissions for the owner, group, and others.


    Now, the owner and group can read and write to the file (`rw-`). Anyone outside
    of the group can only read the file (`r--`).


    > Caution Remember that file permissions are a security feature. Whenever you
    allow anyone else to read, write, and execute files, you are increasing the risk
    of files being tampered with, altered, or deleted. As a rule, you should grant
    and write permissions only to those who truly need them.


