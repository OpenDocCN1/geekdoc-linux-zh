  md: '# Setting the Root Password


    The Set Root Password screen allows you to set your root password (see Figure
    B-18).


    ![](img/67d9607982940021da1fe4247b9b224c_224_0.png)


    Figure B-18: Set Root Password


    Setting up a root account and password is one of the most important steps during
    your installation. The root account (sometimes called the *superuser*) is similar
    to the administrator account used on Windows NT machines. The root account is
    used to install packages, upgrade RPMs, and perform some system maintenance. Logging
    in as root gives you complete control over your system.


    > Caution Because the root user has complete access to the entire system, logging
    in as the root user is best done only to perform system maintenance or administration.
    The root account does not not operate within the restrictions placed on normal
    user accounts, so changes made as root can have implications for your entire system.
    Following this rule will minimize the chances of a typo or an incorrect command
    damaging your system.


    To become root when logged into another account, for instance if you need to fix
    something quickly, you can type `su` — at the shell prompt in a terminal window
    and then press Enter, enter the root password and press Enter.


    The installation program prompts you to set a root password for your system. A
    *root password* is the administrative password for your Fedora system. You must
    enter a root password; the installation program will not let you proceed to the
    next section without entering one.


    The root password must be at least six characters long; the password you type
    is not echoed to the screen. If you enter the password twice; if the two passwords
    do not match, the installation program asks you to enter them again.'
  merge: -1
  pgno: 224
- img_proc: true
  md: 'You should make the root password something you can remember, but not something
    that is easy for someone else to guess. Your name, your phone number, qwerty,
    password, root, 123456, and anteater are all examples of bad passwords. Good passwords
    mix numerals with upper and lowercase letters and do not contain dictionaries:
    Aard387vark or 420BMINT, for example. Remember that the password is case-sensitive.
    It is recommended that you do not write this down or any password you create;
    if you write down your password, keep it in a secure place.


    Do not use one example of the passwords offered in this book. Using one of these
    passwords could be a security risk.


