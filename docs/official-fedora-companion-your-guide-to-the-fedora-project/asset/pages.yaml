  md: '# # Acknowledgments


    ''d like to give special thanks to Debra Williams Cauley, who provided a reference
    point of sanity through two moves, a wedding, and the task of nurturing my young
    children while working on this book''s insanely short deadlines. Deb is the perfect
    person for authors like myself tend to forget the little details—like breathing.
    Thanks to Kevin Kent, who received far too many with missing or incorrect file
    attachments, and bore these brain-errors with grace. Thanks to Joe Merino and
    Kate Wrightson for sheltering some of the burden of producing this book in so
    little time. For the rest of those who worked on this particular book, we both
    know you are —


    If there were no Linux, there would be no Fedora, and you wouldn''t be reading
    these acknowledgments. There are far too many heroes, sung and unsung, of the
    open source and Linux world to name here, but one is compelled to thank at least
    a few by name. Thanks to Lin Torvalds, not only for the Linux kernel, but also
    for his hold on reality and refreshing indifference to countless controversies
    surrounding Linux. Thanks to Richard GNU/Stallman and the Free Software Foundation,
    without whom there would be nothing GNU under the sun. Thanks also to Alan Cox,
    Eric Raymond, Larry Wall, Hans Reiser, Stephen Tweedie, whose names I have selected
    for no other reason than my personal admiration for them and/or their work.


    I would like to offer a special thanks to Red Hat for creating the Fedora project,
    which revitalizes the community and open source aspect of Red Hat Linux. One should
    be grateful that Red Hat''s financial success and financial support help to reward
    at least some of the sung and unsung heroes of Linux and open source. Thanks also
    to Michael K. Johnson, technical lead for Fedora, as well as all who are involved
    in and contribute to the project.


    Finally, I would like to thank Bill Gates and Steve Ballmer for their bold initiatives
    such as Trustworthy Computing, Zero Administration Windows, and Licensing 6.0,
    just to mention a few of the many innovations that have greatly enhanced and accelerated
    the adoption of Linux.'
