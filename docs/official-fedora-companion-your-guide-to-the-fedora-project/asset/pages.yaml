    # cdrecord


    Once you have a CD image, use the utility cdrecord to write it to the CD-R(RW)
    disk. Here''s another look at the command you used:


    ```

    cdrecord -v dev=1,0,0 backup.iso

    ```


    The same command can be used for burning ISO image files downloaded from the Internet,
    with Fedora ISO images.


    The cdrecord command is usually pretty clever choosing the recording speed that
    works best with your drive and the particular brand and type of recordable disk
    you are using. It can make mistakes accidentally, however, so you may sometimes
    want to specify the record speed manually. You may also want to have the CD recorder
    eject the disk when the program is finished creating the CD-ROM. The following
    command sets the write speed at 4, the device address as 1,0 and writes output
    to verbose (- v), which is useful for tracking the status of the write process.
    The -eject argument tells cdrecord to eject the CD-ROM after the write process
    is complete:


    ```

    cdrecord -v speed=4 dev=1,0,0 backup.iso

    ```


    You can also use cdrecord to erase CD discs for reuse by typing the following:


    ```

    cdrecord --dev=1,0,0 --blank-fast

