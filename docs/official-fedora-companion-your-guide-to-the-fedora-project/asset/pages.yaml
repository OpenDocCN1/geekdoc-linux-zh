  md: '# # Ahead of the Bluecurve


    Fedora includes Bluecurve, a unique version of the two most popular graphical
    desktop environments, GNOME and KDE. Bluecurve makes it easier than ever to access
    your applications, files, and system resources. Both new and experienced users
    will be able to take full advantage of the Fedora system using the Bluecurve graphical
    desktop.


    This chapter covers the fundamentals of the GNOME version of the Fedora Bluecurve
    desktop and tells you how you can customize the desktop for your needs. We cover
    the Bluecurve version of KDE in the next chapter.


    # Introducing the Fedora Desktop


    Your first view of the graphical desktop will look something like Figure 2-1.


    The long bar across the bottom of the desktop is called the Panel. The Panel contains
    application launchers, status indicators, and small applications called enables
    that enable you to control sound volume, switch workspaces, and monitor the status
    of your system.


    The icons elsewhere on the desktop can be folders, application launchers, and
    removable devices such as CD-ROMs and diskettes when they have been mounted. To
    open a folder or launch an application, double-click on its icon.


    You can navigate the menu system by clicking the Main button, which is the big
    Red Hat at the extreme left of the panel. You can also click on the Start Here
    located on the desktop and double-click the Applications icon, after which you
    will see several categories of applications. Double-click on any of the categories,
    such as Office, to browse through the applications of that type.


    The desktop works in the manner you might expect it when working with other operating
    systems, such as Windows or Mac OS. You can drag and drop files and applications
    to areas that are easily accessible. You can add new icons for files and applications
    to the desktop, panel and file manager. You can change the appearance of most
    of the tools and applications, as well as change system settings by using the
    provided configuration tools.'
  merge: -1
  pgno: 50
- img_proc: true
  md: '# 30 Official Fedora Companion


    ![](img/67d9607982940021da1fe4247b9b224c_51_0.png)


    **Figure 2-1:** The Bluecurve Graphical Desktop


    # Introducing the Panel


    The Panel is the bar that stretches across the bottom of the screen and holds
    icons and small applications that make using your system easier (see Figure 2-2).
    The Panel also holds the Main Menu (the big Red Hat), which contains menu items
    for all of your applications. The Panel displays a number of applets that allow
    you to run specific tasks or monitor your system or services, like the Red Hat
    Network, while remaining out of your way.


    ![](img/67d9607982940021da1fe4247b9b224c_51_1.png)


    **Figure 2-2:** The Panel at the Bottom of the Desktop


    # Using the Main Menu


    You can click on the Panel''s Main Menu button (the big Red Hat icon on the left
    of the Panel) to expand it into a large set of menus that enable you to access
    the applications on your system. From here, you can start most applications included
    in Fedora. Notice that in addition to the recommended applications, you can also
    access additional applications under the Extras this submenu gives you access
    to a full range of applications on your system. From the Main Menu, you can also
    do the following:


    +   * Run applications from a command line

    * Open files you''ve recently worked on'
