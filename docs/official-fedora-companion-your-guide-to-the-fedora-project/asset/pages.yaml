  md: '# # Security Levels


    Just as a firewall in a building or automobile attempts to prevent a fire from
    spreading, a computer firewall attempts to prevent unauthorized users from accessing
    your computer. A firewall exists between your computer and the network. It determines
    which devices on your computer remote users on the network can access. A properly
    configured firewall can greatly increase the security of your system. It is recommended
    that you configure a firewall for any Fedora system with an Internet connection.


    # ## Security Level Configuration Tool


    The Firewall Configuration screen of the Fedora installation, you were given the
    option to enable or disable the firewall, as well as the choice to allow specific
    devices, incoming services, and ports if you have firewall enabled.


    After installation, you can change the security level of your system by using
    the Security Level Configuration Tool (see Figure 10-1).


    ![](img/67d9607982940021da1fe4247b9b224c_198_0.png)


    **Figure 10-1:** Security Level Configuration Tool, click the Main Menu


    To start the Security Level Configuration Tool, click the Main button -> System
    Settings -> Security Level (or type the command redhat config-securitylevel from
    a shell prompt).'
  merge: -1
  pgno: 198
- img_proc: true
  md: '# Enable Firewall


    If you currently have the firewall disabled and want to enable it, select Enable
    Firewall from the pull-down menu.


    # Disable Firewall


    You can also elect to disable the firewall. This provides complete access to your
    system and does no security checking. *Security checking* involves the disabling
    of access to certain services. This setting should be selected only if you are
    running on a trusted network (not the Internet) or to do more firewall configuration
    later.


    # Selecting Trusted Devices


    In the Security Level Configuration Tool, you can also choose Customize to add
    trusted devices or to allow additional incoming services.


    Selecting any of the Trusted Devices allows access to your system for all traffic
    that device; it is excluded from the firewall rules. For example, if you are running
    a local network, but are connected to the Internet via a PPP dialup, you can check
    *eth0*, and any traffic from your local network will be allowed. Selecting *eth0*
    as trusted means that all traffic over the Ethernet is enabled, the *ppp0* interface
    is still protected by a firewall. If you want to restrict traffic on an interface,
    leave it unchecked.


    > > Caution It is not recommended that you make any device that is connected to
    public networks, as the Internet, a Trusted Device.


    # Enabling Trusted Services


    Enabling these options allows the specified services to pass through the firewall.


    +   **WWW (HTTP)** — The HTTP protocol is used by Apache (and by other Web servers)
    to serve Web pages. If you plan on making your Web server publicly available,
    enable this option. This option is not required for viewing pages locally or for
    developing Web pages. You will need to install the *apache* package to serve Web
    pages.


    +   **FTP** — The File Transfer Protocol (FTP) is used to transfer files between
    machines on a network. If you plan on making your FTP server publicly available,
    enable this option. You need to install *wuftpd* (and possibly the *anonftpd*)
    package for this option to be useful.


    +   **SSH** — Secure Shell (SSH) is a suite of tools for logging into and executing
    commands on a remote machine. If you plan to use SSH tools to access your machine
    through a firewall, enable this option. You need to have the *openssh-server*
    package installed to access your machine remotely using SSH tools.


    +   **Telnet** — Telnet is a protocol for logging into remote machines. Telnet
    communications are unencrypted and provide no security from network snooping.
    Allowing incoming Telnet access is not recommended. If you do not want to allow
    inbound Telnet access, you will need to install the *telnet-server* package.'
  merge: -1
  pgno: 199
