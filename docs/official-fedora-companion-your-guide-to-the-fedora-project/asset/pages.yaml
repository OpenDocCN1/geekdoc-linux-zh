  md: '# Troubleshooting Your Installation of Fedora


    This appendix discusses some common installation problems and their solutions.


    # You Are Unable to Boot Fedora


    If you''re unable to boot Fedora, the following sections help you troubleshoot
    the problem.


    # Are You Unable to Boot from the CD-ROM?


    If you cannot boot from your Fedora CD-ROM, you have two options:


    +   - Change your BIOS order so that booting from the CD-ROM is recognized in
    the first boot order

    - Boot using a boot disk you have created


    There are a few cases where the system BIOS will not allow the Fedora CD-ROM to
    boot because of the size of the boot image on the CD-ROM itself. In cases such
    as these, a boot disk should be made to boot Fedora. Once booted, the CD-ROMs
    will work properly for the installation.


    To change your BIOS, refer to your system manual for the correct keyboard combination
    that you access to the BIOS, or you can read the key sequence needed while the
    system begins to boot.


    To boot Fedora using a boot disk, insert the diskette you have created into your
    floppy drive and then boot/reboot your computer. Make sure that your BIOS is set
    to use the floppy or removable disk (A:) to boot.


    # Are You Unable to Boot from the Local Boot Disk?


    If you are experiencing difficulties in getting a local boot disk to boot your
    system correctly, you may need an updated boot disk.'
  merge: -1
  pgno: 236
- img_proc: true
  md: '# 216 Appendices


    Check the Fedora Project Web site at http://fedora.redhat.com/ for updated diskette
    images (if available) and follow the instructions in Appendix B to create an updated
    boot disk for your system.


    # Are You Unable to Boot from PCMCIA Boot Disks?


    If you are experiencing difficulties in getting the PCMCIA boot disks made to
    boot your system correctly, you may need an updated boot disk.


    Check the Fedora Project Web site at http://fedora.redhat.com/ for updated diskette
    images (if available) and follow the instructions provided to make an updated
    boot disk for your system.


    # Is Your System Displaying Signal 11 Errors?


    If you receive a fatal signal 11 error during your installation, it is probably
    due to a hardware error in memory on your system''s bus. A hardware error in memory
    may cause problems in executables or with the system''s hardware. Like other operating
    systems, Fedora places its demands on your system''s hardware. Some of this hardware
    may not be able to meet those demands, even if they work properly under another
    OS.


    Check to see if you have the latest installation and supplemental boot disks from
    Red Hat. If the latest images still fail, it may be due to a problem with your
    hardware. Commonly, these errors are in your memory or CPU-cache. A possible solution
    for this error is turning off the CPU-cache in the BIOS. You could also try to
    swap your memory around the motherboard slots to see if the problem is either
    slot or memory-related.


    For more information concerning signal 11 errors, refer to the following URL:


    ```

    http://www.bitwizzard.nl/sig11/

    ```


    # Are You Unable to Boot from a Network Boot Disk?


    If you are experiencing difficulties in getting the network boot disk made to
    boot your system correctly, you may need an updated boot disk.


    Check the Fedora Project Web site at http://fedora.redhat.com/ for updated diskette
    images (if available) and follow the instructions provided to make an updated
    boot disk for your system.


    # Trouble Beginning the Installation


    If you''re unable to properly begin installing Fedora, the following sections
    help you troubleshoot the problem.


    # Trouble Using PCMCIA Boot Disks?


    If you booted using PCMCIA boot disks and want to install via File Transfer Protocol
    (FTP) (or Network File System (NFS) or Hypertext Transfer Protocol (HTTP)), but
    do not see these installation options, you may have a problem with your network
    card.'
  merge: -1
  pgno: 237
- img_proc: true
  md: '# Appendix C + Troubleshooting Your Installation of Fedora


    If the network card is not initialized during the boot process, the Fedora installation
    program will not enable you to configure your system for networking, either during
    or after the installation itself.


    Check the hardware compatibility list at http://hardware.redhat.com/hcl/ to see
    if your network card is compatible and/or supported. If your card is not listed,
    it may not be compatible with Fedora.


    # Is Your Mouse Not Detected?


    If the Mouse Not Detected screen appears, then the installation program was not
    able to identify your mouse correctly.


    You can choose to continue with the GUI installation or use the text mode installation,
    which does not require using a mouse. If you choose to continue with the GUI installation,
    you will need to provide the installation program with your mouse configuration
    information.


    # Problems Booting into the Graphical Installation?


    Some video cards will not work properly with the Fedora installation program.
    The end result will be a problem booting into the graphical installation. If the
    installation program will not run using its default settings, it will try to run
    in a lower resolution mode. If that fails, the installation program will run in
    text mode.


    If you have a video card that will not run at 800 x 600 resolution, type lowres
    at the boot: prompt to run the installation program in 640 x 480 resolution.


    # Trouble During the Installation


    If you have trouble during the Fedora installation, the following sections will
    help you troubleshoot the problem.


    # Partition Creation Problems?


    If you are having trouble a partition, for example, a / (root) partition, make
    sure you are setting its partition type to Linux native.


    Unless your BIOS supports otherwise, make sure /boot does not exceed the 123 cylinder
    head. If you do not install, the installation program will not allow you to create
    a /boot or / (root) partition. Some new systems allow you to exceed the 1023 limit
    (with GRUB (Grand Unified Boot Loader) and newer LILO (Linux Loader) versions
    that are available), but most machines with older BIOS will.


    # Problems Using Remaining Space?


    You have a swap and a / (root) partition created, and you have selected the root
    partition to use the remaining space, but it does not fill the hard drive.


    If your hard drive is more than 1024 cylinders, you must create a /boot partition
    if you want the / (root) partition to use all of the remaining space on your hard
    drive.'
  merge: -1
