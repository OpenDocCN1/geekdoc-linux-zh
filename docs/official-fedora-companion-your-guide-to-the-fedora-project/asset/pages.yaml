    # # Deleting Files with the Trash Icon


    The Trash icon on your Fedora desktop is one of the most obvious methods of deleting
    files. If you want to delete a file on your desktop or from a window onscreen,
    click on the file and drag it onto the Trash icon and release the mouse button.
    You can also right-click on any icon and select Move to Trash from the menu that
    pops up. When the Trash has something in it; you will see its icon change from
    being empty (see Figure 3-10) to being full of paper.


    ![](img/67d9607982940021da1fe4247b9b224c_79_2.png)


    # # Recovering Files from the Trash


    The nice thing about the Trash is that you have a chance to salvage the file —
    just like you could take a piece of paper out of a trash after throwing it away.
    To recover a file that you have thrown in the Trash, double-click the Trash icon
    on your desktop, find the file you want to recover, and drag it out of the Trash
    onto your desktop or wherever else you want to put it.'
  merge: -1
