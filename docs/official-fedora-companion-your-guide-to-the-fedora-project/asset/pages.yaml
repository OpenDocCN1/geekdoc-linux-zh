  md: '# Locating Files and Directories


    At times, you know a file or directory exists, but you do not know where to find
    it. Searching for a file or directory can be easier with the locate command.


    With locate, you can see every file or directory whose name contains the search
    criterion. For example, if you want to search for all files with the word finger
    in the name, type locate finger.


    The locate command uses a database to locate files and directories that have the
    word finger in the file or directory name. The search results could include a
    file called finger.txt, a file called pointerfinger.txt, a directory named fingertertumbs,
    and so on. To learn about locate, read the locate man page (type man Locate at
    a shell prompt).


    The locate command works very quickly, as long as the database is up to date.
    That database is automatically updated on a nightly basis through a cron job.
    cron is a small program that runs in the background, performing various tasks
    (such as updating the locate database) at regularly scheduled intervals.


    +   * Tip cron is a daemon that executes tasks at regularly scheduled intervals.
    To read the cron man page, type man cron at the prompt.


    cron periodically updates the locate database, which is used to catalog file locations
    by the locate command. Switching between operating systems and shutting down your
    machine at the end of the day can interfere with the automatic database update
    by cron.


    To update the database manually, log in as root (type su at a shell prompt) and
    then type the command updatedb.


    After a few minutes, the locate database that is used by the locate command will
    be current.


    +   * Note You can run anacron to have your system commands periodically, with
    a frequency specified in days. Unlike cron, anacron does not assume that the machine
    is running continuously. Hence, it can be used on machines that are not running
    24 hours a day to control daily, weekly, and monthly jobs that are usually controlled
    by cron.


    Refer to the man page for anacron (type man anacron at the command line) for information.


    # Wildcards and Regular Expressions


    If you forget the name of the file you are looking for? Using wildcards or regular
    expressions, you can perform actions on file or files without knowing the complete
    file name. Just fill out what you know, then substitute the remainder with a wildcard.
    Wildcards are special symbols that you can substitute for letters, numbers, and
    symbols that make finding particular directories and files easier than examining
    directory listings to find what you are searching for.


    +   * Tip To read more about wildcards and regular expressions, take a look at
    the bash man page (man bash).'
  merge: -1
  pgno: 181
- img_proc: true
  md: '# Chapter 9 + Command-Line Power: Shell Prompt Basics 161


    * You know the file starts with sneak, in sneaksomething.txt, so type ls sneak*.txt
    and find the name of the file sneakers.txt.


    You will probably use the asterisk (*) most frequently when you are searching.
    The asterisk searches out everything that matches the pattern you are looking
    for. So, by typing ls *.txt or ls*, you will find sneakers.txt and any other files
    whose names begin with sn or end with .txt. It helps to narrow your search as
    much as possible.


    One way to narrow a search is to use the question symbol (?). Like the asterisk,
    using ? can help locate a file matching pattern.


    In this case, though, ? is useful for matching a single character, so if you were
    searching for sneaker?.txt, you would get sneakers.txt as a result, and/or sneakerz.txt,
    if there were a file with that name.


    Regular expressions are more complex than the straightforward asterisk or question
    mark.


    When an asterisk, for example, just happens to be part of a file name, as might
    be the case if the file sneakers.txt was called sneak*.txt, that is when regular
    expressions can be useful.


    Using the backslash (\), you can specify that you do not want to search out using
    the asterisk, but you are instead looking for a file with an asterisk in the name.
    This is called escaping the wildcard.


    For example, if the file is called sneak*.txt, type sneak1*.txt.


    # Table 9-3: Wildcards and Regular Expressions


    | Character | What It Matches |

    | --- | --- |

    | * | All characters |

    | ? | One character in a string (such as sneaker?.txt) |

    | \* | The * character |

    | ? | The ? character |

    | \) | The ) character |


    # Printing from the Command Line


    Printing is not an involved process, when you click on a button in a GUI or type
    commands from the command line. This section explains how to print, cancel, and
    view print jobs from the command line, assuming you have a properly configured
    printer connected to your system.


    The lpr command, followed by a file name, sends that specified file to the print
    queue. For example, lpr foo.txt prints the foo.txt file.'
  merge: -1
