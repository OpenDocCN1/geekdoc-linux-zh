  md: 'The output should be as follows:


    ```

    -rw-r--r--    1 sam sam   150 Mar 19 08:08 sneakers.txt

    ```


    Now, neither the group nor others have write permission to sneakers.txt. To return
    the group''s write access for the file, add the value of w(2) to the second set
    of permissions:

    [carlotta@toluca carlotta]$ chmod 664 sneakers.txt


    Setting permissions to 666 allows everyone to read and write to a file or directory.
    Setting permissions to 777 allows everyone read, write, and execute permission.
    These permissions can allow tampering with sensitive files, so in general, it
    is not a good idea to use these settings.


    Table 9-4 shows a list of some common settings, numerical values, and their meanings.


    | Table 9-4: Example Permission Settings |

    | Permissions | What It Means |

    | -rw------- (600) | Only the owner has read and write permissions |

    | -rw-r--r-- (644) | Only the owner has read and write permissions; the group
    and others have read-only permissions |

    | -rwx------ (700) | Only the owner has read, write, and execute permissions |

    | -rwx-xr-x (755) | The owner has read, write, and execute permissions; the group
    and others have only read and execute permissions |

    | -rw-r--x (711) | The owner has read, write, and execute permissions; the group
    and others have only execute permissions |

    | -rw-rw-rw- (666) | Everyone can read and write to the file. (Be careful with
    these permissions) |

    | -rwx r rwx (777) | Everyone can read, write, and execute. (Again, this permissions
    setting can be hazardous.) |

    | drwx------ (700) | Only the user can read or write in this directory |

    | drwxr-xr-x (755) | Everyone can read the directory, but its contents can be
    changed only by the user. |'
