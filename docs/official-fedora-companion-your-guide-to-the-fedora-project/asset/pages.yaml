- img_proc: true
  md: '# Chapter 2 Ahead of the Bluecurve 31


    +   * Find files

    * Lock your screen (which runs a password-protected screensaver)

    * Log out


    # Introducing Applets


    Applets are small applications that run on the Panel. Applets usually let you
    monitor things on your system or the Internet. Some have more specific tasks,
    whereas others are designed to be entertaining.


    There are a few applets that run on your Panel by default. These applets are fairly
    important and are covered in the following sections.


    # Workspace Switcher


    The Workspace Switcher (see Figure 2-3) is a simple applet that allows you to
    see what applications you have open on your workspace (a workspace is also called
    a virtual desktop). You can work in several separate workspaces, and each one
    appears as a stand-alone desktop. This makes it easy to work without having to
    run all your applications crowded into one viewable area.


    The Workspace Switcher represents each workspace in small squares and shows the
    applications running on you. You may click on one of the squares with your mouse
    to move to that workspace.


    You can also use the keyboard shortcut Ctrl+Alt+Right Arrow or Ctrl+Alt+Left Arrow
    to switch between workspaces.


    ![](img/67d9607982940021da1fe4247b9b224c_52_0.png)


    # The Taskbar


    Next to the Workspace Switcher is the Taskbar (see Figure 2-4). The Taskbar is
    an applet that shows the titles of running applications on any desktop. This is
    very helpful if you decide to minimize an application, because it will seem to
    disappear from the desktop. After disappear, you can bring it back by clicking
    on its title in the Taskbar. Normally, the Taskbar shows only applications that
    you''re running in the current workspace, although later you will see how to make
    the Taskbar show all the running applications on all workspaces if that''s how
    you prefer it to.


    | GNOME Mines | Calculator |

    | redhat.com | Global Learning Serv |


    Figure 2-4: The Taskbar


    # Working with Icons


    An icon is a picture (usually small, although you can resize icons as discussed
    later in this chapter) that represents a file or directory, or even devices and
    application launchers. Double-click an icon to access the we icon. If it is a
    file as word processing document, a double-click should launch the word processor
    and open the document. If it is an application, a double-click on the icon launches
    the application.'
