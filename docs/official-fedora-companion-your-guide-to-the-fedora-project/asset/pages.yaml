  md: '# Using X-Roast to Create a CD


    You should back up personal data and information, in case of hardware failure
    or file system corruption. X-Roast allows you to back up files on your hard drive
    partition using Create CD. This facility allows you to add files and directories
    into a CD session using Master Tracks.


    Other options within the Master Tracks dialog allow you to configure advanced
    settings; however, the defaults are set correctly to create data CD-ROMs, so no
    further configuration is necessary. Figure 8-15 shows a session that is preparing
    the entry /home directory for backup.


    ![](img/67d9607982940021da1fe4247b9b224c_167_0.png)


    Figure 8-15: Using X-Roast to Back Up Hard Drives


    Highlight the files and directories that you wish to add to the session and click
    Add. After you have added all files and directories you wish to write to the CD-R(W),
    click the Create session/image tab to create the .img file. You must first click
    Calculate Size and Master to Image File to create the image.


    To write your tracks to the CD-R(W), click Write Tracks from the panel on the
    left. In the Layout Tracks tab, highlight the image file you created in the box
    on the right and click Add. The image is displayed in the Write box on the left
    side. Accept Track Layout, and click the Write Tracks tab to return to the main
    writing dialog. Click Write Tracks to write the image to the CD-R(W).


    # Writing ISOs with X-Roast


    Large files that end in .iso are known as ISO9660 (or ISO) image files. For example,
    Fedora is freely available as ISO images that you can download and write to the
    CD-R(W). Other ISO image files are available on FTP and Web sites and other file
    types that can be burned as images, .img and .raw, but ISO images are the most
    common CD image format.


    To write an ISO image to a CD-R(W) with X-Roast, move the ISO file to the path
    specified during setup and then click Create CD. In the Layout tabs, highlight
    the image file you wish to burn and then Accept Track Layout. This automatically
    loads the Write Tracks tab where you can click Write Tracks to burn the image
    to the CD-R(W).'
