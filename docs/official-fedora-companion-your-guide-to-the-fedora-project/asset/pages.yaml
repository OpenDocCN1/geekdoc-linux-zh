- img_proc: true
  md: 'The root directory is /. There is a directory off the root directory called
    /home, and that''s where all the user home directories are stored. For example,
    carlotta''s home directory is /home/carlotta.


    Almost everything on your system is considered a directory or a file. Even your
    CD-ROM and floppy are considered directories. Your CD-ROM drive is normally mounted
    and accessed as the directory /mnt/cdrom, and your floppy is normally mounted
    and accessed as /mnt/floppy. So if you mount a CD-ROM and want to see what files
    and directories exist on that CD-ROM, you would look in the directory /mnt/cdrom
    to find out.


    # Determining Your Current Directory with pwd


    Once you start looking through directories, it is easy to get or forget the name
    of your current directory. By default, the bash shell shows only your current
    directory, not the entire path.


    To determine the exact location of your current directory within the file system,
    go to a shell prompt, type the command pwd, and press Enter, as shown in Figure
    9-2.


    You should see something like this:


    ```

    /home/carlotta

    ```


    This tells you that you are in the user carlotta''s directory, which is located
    in the /home directory.


    ![](img/67d9607982940021da1fe4247b9b224c_176_0.png)


    Figure 9-2: The pwd Command Shows Where You Are


    The pwd command stands for print working directory. When you enter the pwd command,
    you''re basically asking Linux to display your current location within the file
    system. Linux responds by printing the name of the current directory at the shell
    prompt display, also known as the standard output.


    You will find that using pwd is very helpful as you learn to navigate Fedora.'
  merge: -1
