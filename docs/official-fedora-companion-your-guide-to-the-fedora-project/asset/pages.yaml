  md: '# Instant Messenger


    Fedora includes an Instant Messenger application called GAIM that works simultaneously
    with YIM (Yahoo Instant Messenger), AIM (AIM Instant Messenger), and several other
    popular means of chatting with others, all in one neat package.


    To open GAIM, click the Main Menu button Internet Instant Messenger. You should
    see the main window, as shown in Figure 4-21.


    ![](img/67d9607982940021da1fe4247b9b224c_116_0.png)


    **Figure 4-21:** The GAIM Instant Messenger


    At this point, you have no accounts defined. You''ll need to have an existing
    account to use GAIM. You can create a new Yahoo YIM account profile by visiting
    the Yahoo Web site (http://www.yahoo.com) with your Web browser. You can create
    a new account profile for AIM Instant Messenger by visiting the AOL site (http://my.screenname.aol.com)
    with your Web browser.


    Once you have a screen name and a password, you are ready to create a new GAIM
    account. Click on the Accounts button in the main window to open up the account
    editor (see Figure 4-22).


    ![](img/67d9607982940021da1fe4247b9b224c_116_1.png)


    **Figure 4-22:** The GAIM Account Editor


    Click Add to add a new account. You should see an account information screen such
    as the one in Figure 4-23.'
  merge: -1
  pgno: 116
- img_proc: true
  md: '# 96 Official Fedora Companion


    ![](img/67d9607982940021da1fe4247b9b224c_117_0.png)


    **Figure 4-23:** GAIM Account Information


    Type in your screen name, password, and an alias that''s easy to remember. You
    can create Yahoo, AOL, and other accounts, so it''s easier to sort them out if
    you identify the service in your aliases. For example, if your screen name for
    AIM is My_Screen_Name_AIM, then a good alias might be My_Screen_Name so that you
    know it is the AIM account you''re using when you start up GAIM and log in.


    Click OK when you''re finished, and your new account should appear in the Account
    Editor window. Click Close to close the account editor.


    GAIM will not recognize your new accounts until you close the GAIM application
    and restart it. Close GAIM by clicking on the close button of the main window,
    and then restart the program by clicking on the Main Menu button Internet Internet
    Instant Messenger. You should now see the main window appear with one of the accounts
    selected (see Figure 4-24).


    ![](img/67d9607982940021da1fe4247b9b224c_117_1.png)


    **Figure 4-24:** The GAIM Instant Messenger with an Account'
  merge: -1
