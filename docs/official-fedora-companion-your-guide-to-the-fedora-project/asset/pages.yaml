  md: '# # Configuring a Dual-Boot System


    Sharing a computer between two operating systems requires dual booting. You can
    use either operating system on the computer, but not at once (unless you''re using
    a virtual machine such as Vmware; see http://www.vmware.com for more information).
    Each operating system boots from and uses its own hard drives or disk partitions.


    This appendix explains how to configure your system so that you are given a choice
    at boot time when you want to start up Fedora or another operating system such
    as Microsoft Windows. For clarity, we will assume that the other operating system
    is Microsoft Windows, but the procedures are similar for other operating systems.


    If Fedora will coexist on your system OS/2, you must create your disk partitions
    with the OS/2 partitioning software - otherwise, OS/2 may not recognize the disk
    partitions. During the installation, do not create any new partitions, but set
    the proper partition type for your Linux partitions using fdisk.


    If you do not have any operating systems installed on your computer, install Windows
    first and then install Fedora.


    +   * If you are installing Windows 9xr or Windows Me, you cannot define partitions
    during the Windows installation. Install Windows, and then see the "Partitioning
    with FIPS" section later in this chapter for instructions on using FIPS to partition
    your hard drive and create free space for Linux.

    * If you are installing Windows NT, Windows 2000, or Windows XP, you can create
    partitions of a specific size for Windows. Leave enough free space (that is not
    partitioned or formatted) on the hard drive to install Linux.


    While partitioning your hard drive, keep in mind that the BIOS in some systems
    cannot access more than the first 1024 cylinders on a hard drive. If this is the
    case, leave enough room for the /boot Linux partition on the first 1024 cylinders
    of your hard drive to boot Linux. The other Linux partitions can be after cylinder
    1024.'
  merge: -1
  pgno: 246
- img_proc: true
  md: 'See Appendix B to determine how much disk space to leave.


    After installing Windows, see the "Installing Fedora in a Dual-Boot Environment"
    section later in this chapter.


    If the computer you want to install Fedora is currently running Windows (or some
    other operating system you have installed), you have an important decision to
    make. Your choices are as follows:


    +   * Choice 1: Do you want Fedora to be the only operating system on your computer,
    despite the fact that you already have Windows on your computer? If your answer
    is yes, no not have to configure a dual-boot system. First, back up any information
    that you want to save and then start the installation. You will not end up with
    a dual-boot system in this case, because Fedora will overwrite your copy of Windows.
    Therefore, this chapter is not for you.


    If you answered this question, you can choose to have the Fedora installation
    automatically partition your system on the Disk Partitioning Setup screen, and
    choose Remove All Partitions this when you do. This deletes the copy of Windows
    on your system. If you choose manual partitioning with Disk Druid or fdisk, you
    have to delete all the MS-DOS (Windows) partitions manually and create your Linux
    partitions.


    +   * Choice 2: Do you want to install Fedora and then have the option of booting
    either Fedora or your other operating system? A Fedora installation can be performed
    that Fedora is installed on your system, the other operating system is not affected.
    Because you already have Windows installed, you need to allocate disk space for
    Linux. Refer to the next section and refer to the "Installing Fedora in a Dual-Boot
    Environment" section later in this chapter.


    # # Allocating Disk Space for Linux


    If you already have Windows installed on your system, you must have free hard-disk
    space available on which to install Fedora. Your choices are as follows:


    +   * Add a new hard drive.

    * Use an existing hard drive or partition.

    * Create a new partition.


    For all three options, be aware that the BIOS in some older systems cannot access
    more than the first 1024 cylinders on a hard drive. If this is the case, the /boot
    Linux partition must be located on the first 1024 cylinders of your hard drive
    to boot Linux.


    > > Caution

    Remember to back up all important information before reconfiguring your hard drive.
    Reconfiguring your hard drive can result in the loss of data if you are not extremely
    careful. Additionally, be sure to create a boot disk for both operating systems
    in case the boot loader fails to recognize either of them.'
  merge: -1
  pgno: 247
- img_proc: true
  md: '# Adding a New Hard Drive


    The simplest way to make room for Fedora is to add a new hard drive to the computer
    and install Fedora on that drive. For example, if you add a second IDE drive sdb
    to the computer, the Fedora installation program recognizes it as hdb and the
    existing drive (the one used by Windows) as hda. For SCSI drives, the newly installed
    Fedora drive would be recognized as sdb and the other hard drive as sda.


    If you choose to install a new hard drive for Linux, all you need to do is start
    the Fedora installation program. After starting the Fedora installation program,
    just make sure to install Linux on the newly installed hard drive (such as hdb
    or sdb) rather than the hard drive used by Windows.


    # Using an Existing Hard Drive or Partition


    Another way to make room for Linux is to use a hard drive or disk partition that
    is currently being used by Windows. For example, suppose Windows Explorer shows
    two hard drives, C: and D:. This could indicate either that the computer has two
    hard drives or a single hard drive with two partitions.


    In either case (assuming the hard drive has enough disk space), you can install
    Fedora on the hard drive or disk partition that Windows recognizes as D:. This
    choice is available to you only if the computer has two or more hard drives or
    disk partitions.


    If a Windows partition is available in which you want to install Linux, follow
    these steps:


    +   1. Copy all data you want to save from the selected hard drive or partition
    D: in this example) to another location.

    2. Start the Fedora installation program and tell it to install Linux in the designated
    drive or partition; or, in this example, the hard drive or partition that Windows
    designates as D:


    Note Linux distinguishes between hard drives and disk partitions. Thus:


    +   * C: and D: on this computer refer to two separate hard drives, the installation
    program recognizes them as hda and hdb (IDE) or sda and sdb (SCSI). Tell the installation
    program to install on hdb or sdb.

    * C: and D: refer to partitions on a single drive, the installation program recognizes
    them as hdal and hda2 (or sda and sda2 for SCSI). During the partitioning phase
    of the Fedora installation, delete the second partition (hda2 or sda2) and then
    partition the unallocated free space for Linux. You do not have to delete the
    second partition prior to starting the Fedora installation.


    > Windows uses letters to refer to removable drives (for example, a Zip drive)
    and network storage (virtual drives) as well as for local hard drive space; you
    cannot install Linux on a removable or network drive.'
