  md: '# Chapter 9 ♦ Command-Line Power: Shell Prompt Basics 171


    Take a closer look at sneakers.txt with the ls command the -l (long) option (see
    Figure 9-8):


    ```

    [carlotta@toluca carlotta]$ls -l sneakers.txt

    -rw-rw-r-- 1 carlotta carlotta 150 Mar 19 08:08 sneakers.txt

    ```


    A detail of list is provided. You can see who can read (r) and write to (w) the
    file, as who created the file (carlotta), and to which group the belongs (carlotta).
    Remember that, by default, the name of your group is the same as your login name.


    Other information to the right of the group includes file size, date and time
    of file creation, and file name. The first column shows current permissions; it
    has ten slots. The first slot represents the type of file. The remaining nine
    slots are actually three sets of permissions for three different categories of
    users.


    ```

    -rw-rw-r--

    ```


    Those three sets are as follows: the owner of the file, the group in which the
    file belongs, and "others," meaning users and groups not specified.


    ```

    (rw--) (rw--) (r--) 1 carlotta carlotta

    |       |       |

    type owner group others

    ```


    The first item, which specifies the file type, can show one of the following:


    +   - d A directory

    - (dash)—A regular file (rather than directory or link)

    - l A symbolic link to another program or file elsewhere on the system


    Beyond the first item, in the three sets, you will see one of the following:


    +   - r—File can be read.

    - w—File can be written to.

    - x—File can be executed (if it is a program).


    When you see a dash, group, or others, it means that particular permission has
    not been granted. Look again at the first column of sneakers.txt and identify
    its permissions:


    ```

    [carlotta@toluca carlotta]$ls -l sneakers.txt

    -rw-rw-r-- 1 sam sam 150 Mar 19 08:08 sneakers.txt

    [carlotta@toluca]carlotta]$

    ```


    The file''s owner (in this case, sam) has permission to read and write to the
    file. The group, also called sam, has permission to read and write to sneakers.txt
    as well. It is not a program, so neither the owner nor the group has permission
    to execute it because it simply cannot be executed. People not in the sam group
    can only read the file it or execute it.


