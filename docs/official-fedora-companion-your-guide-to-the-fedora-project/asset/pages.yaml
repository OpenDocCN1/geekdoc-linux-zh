  md: '# Contributing to the Fedora Project


    The Fedora Project is a community-driven effort to build, maintain, and grow a
    general-purpose operating system comprised entirely of free software. Red Hat
    will provide a lot of development resources for Fedora Core and will provide editorial
    control and management over Red Hat''s Fedora Core releases in order to meet Red
    Hat''s goals for Fedora users. In the spirit of community-supported free software,
    Red Hat strongly encourages everyone who is willing to participate the process.
    In addition, since Fedora is exclusively made up of free software, anyone is free
    to build their own distribution based on Fedora.


    There are variety of ways to contribute to Fedora Core. Red Hat retains editorial
    control over the Fedora Project in order to bring in line with the project objectives,
    but Red Hat explicitly invites others to contribute more than just code and patches.
    Red Hat invites the developer community into the process of making core technical
    decisions, as well.


    More specifically, those who want to be a part of the Fedora community are welcome
    to:


    +   * Participate in development of open source software

    * Report bugs

    * Test software

    * Advocate open source, Linux

    * Participate in mailing lists

    * Experiment with the technology

    * Help others in the community

    * Educate students

    * Educate corporate users and decision makers

    * Contribute and maintain code

    * Contribute and maintain documentation

    * Translate programs and documentation

    * Contribute interaction design and usability testing'
  merge: -1
