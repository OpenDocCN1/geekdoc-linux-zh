  md: '# The KDE Bluecurve


    This chapter covers the fundamentals of the KDE version of the Fedora Bluecurve
    desktop and tells you how you can customize the desktop for your needs. See Chapter
    2 if you are using the GNOME version of Bluecurve.


    # Installing KDE Bluecurve


    Fedora installs the GNOME version of Bluecurve by default, so if you want to use
    the KDE version, you''ll have to install it first. Here''s an easy way to install
    KDE. First, log in as you normally would. Then right-click on the desktop and
    choose Open Terminal from the pop-up menu. At the command prompt in the terminal
    window, type the following command to switch to the root user:


    ```

    su -

    ```


    Enter the root password when you are prompted for it. Then type the following
    commands to retrieve and install the most used KDE packages:


    +   # yum install kdegraphics kdemultimedia kdenetwork kdepim deutils koffice
    kgames


    Other packages are available, such as kdetoys (fun applets) and kdeedu (educational
    programs).


    # Switching to KDE Bluecurve


    You can choose to start the KDE version of Bluecurve manually each time log in.
    At the login screen, click on Session on the bottom of the screen. A dialog box
    will pop up. Click on the KDE radio button and then click OK. When you log in,
    it will start the KDE Bluecurve desktop instead of GNOME, but it will do so only
    for this session.


    If you want to switch using the KDE desktop by default, first log in your GNOME
    or KDE desktop. Then click on the Main Menu and choose System Settings ﬙ More
    System Settings ﬙ Desktop Switching Tool. Select KDE from the list and click OK.
    This should make KDE the default desktop for your future sessions.


    ![](img/67d9607982940021da1fe4247b9b224c_72_0.png)'
  merge: -1
  pgno: 72
- img_proc: true
  md: '# Introducing the Fedora Bluecurve Desktop,

    KDE Style


    Your first view of the graphical desktop will look something like Figure 3-1.


    ![](img/67d9607982940021da1fe4247b9b224c_73_0.png)


    **Figure 3-1:** The Bluecurve Graphical Desktop gives you access to the applications
    and system settings on your computer.


    You will notice that it offers three main tools to make use of the applications
    on your system: Panel icons, desktop icons, and menus.


    +   * The long bar across the bottom of the desktop is called the *Panel*. The
    Panel contains application launchers, status indicators, and small applications
    called *applets* that enable you to control sound volume, switch workspaces, and
    monitor the status of your system.


    +   * The icons elsewhere on the desktop can be folders, application launchers,
    and removable devices such as CD-ROMs and diskettes when they have been mounted.
    To open a folder or launch an application, double-click on it.


    +   * You can navigate the menu system by clicking the Main Menu button, which
    is the big K on a gear at the extreme left of the Panel. You can also click on
    the Start Here located on the desktop and then double-click the Applications icon,
    after which you will see several categories of applications. Double-click any
    of the categories, such as Office, to browse through the applications of that
    type.'
  merge: -1
  pgno: 73
- img_proc: true
  md: '# Chapter 3 + The KDE Bluecurve 53


    The desktop works in the manner you might expect it when working with other operating
    systems, such as Windows or Mac OS. You can drag and drop files and application
    icons to areas that are easily accessible. You can add new icons for files and
    applications to the desktop, Panel, and file manager. You can change the appearance
    of most of the tools and applications, as well as change system settings using
    the provided configuration tools.


    # Introducing the Panel


    The Panel is the bar that stretches across the bottom of the screen and holds
    icons and small applications that make your system easier (see Figure 3-2). The
    Panel also holds the Main Menu (the big K with the gear) which contains menu items
    for all of your applications. The Panel also displays a number of applets that
    allow you to run specific tasks or monitor your system or services, like the Red
    Hat Network, while remaining out of your way.


    ![](img/67d9607982940021da1fe4247b9b224c_74_0.png)


    Figure 3-2: The Panel at the Bottom of the Desktop


    # Using the Main Menu


    You can click the Panel''s Main Menu button (the big K with a gear icon on the
    left of the Panel) to expand it into a large set of menus that enable you to access
    the applications on your system. From here, you can start most applications included
    in Fedora. Notice that in addition to the recommended applications, you can also
    access additional applications under the Extras entry. From the Main Menu, you
    can also do the following:


    +   * Run applications from a command line

    * Run the applications you tend to run most often

    * Find files

    * Lock your screen (which runs a password-protected screensaver)

    * Get help

    * Log out


    # Introducing Applets


    Applets are small applications that run on the Panel. Applets usually let you
    monitor things on your system or the Internet. Some have more specific tasks while
    others are designed to be entertaining.


    As with the GNOME version of Bluecurve, there are a few applets that run on your
    Panel by default. These applets are fairly important and are covered in the following
    sections.


    # Workspace Switcher


    The Workspace Switcher (see Figure 3-3) is a simple applet that allows you to
    see what applications you have open on your workspace (a workspace is also called
    a virtual desktop). You'
