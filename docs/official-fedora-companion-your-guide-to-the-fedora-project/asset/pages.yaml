  md: '# Chapter 3 + The KDE Bluecurve


    ![](img/67d9607982940021da1fe4247b9b224c_78_0.png)


    Figure 3-7: The Start Here Window


    You can add your own favorite applications to the Bookmarks section of the Start
    Here window. To add an application to the Bookmarks section, navigate to the location
    you want to bookmark and choose Bookmarks -> Add Bookmark. You will see an icon
    for the application in the Bookmarks menu immediately.


    Tip


    # The Home Icon


    The Home icon opens Konqueror and takes you to your home directory, which is either
    under the /home or /root if you are logged in as root. If your user name is John,
    for example, your home directory would be /home/John. Additionally, this icon
    is named after the user; so, in our example, the Home icon would be called John''s
    Home (refer to Figure 3-1).


    Note


    The root user''s home directory is under /root.


    Your home directory is the default location for all of a user''s files. When you
    create a new file of any type in an application (such as OpenOffice Writer) and
    click Save, the Save dialog that appears will show your home directory as the
    default directory to save in.


    Tip


    You can save yourself a lot of time bouncing through directories by saving your
    files in your home directory (or its subdirectories).


    Of course, saving all of your files in your home directory itself is a bad idea—that
    is what subdirectories are for. To create a subdirectory within your home folder,
    you can do the following:


    +   1. Right-click on the desktop or in a folder window (such as Konqueror) and
    choose Create New Directory.'
