  md: '# Chapter 2 Ahead of the Bluecurve 35


    ![](img/67d9607982940021da1fe4247b9b224c_56_0.png)


    Figure 2-9: Creating a New Folder


    # Deleting Files with the Trash


    The Trash icon on your Fedora desktop is one of the most obvious methods of deleting
    files. If you want to delete a file on your desktop or from a window onscreen,
    click on the file and drag it onto the Trash icon and release the mouse button.
    You can also right-click on an icon and select Move to Trash from the menu that
    pops up. When the Trash has something in it, you will see its icon change from
    being empty (see Figure 2-1) to being full of paper (see Figure 2-10).


    ![](img/67d9607982940021da1fe4247b9b224c_56_1.png)


    Figure 2-10: A Full Trash Can


    Every time you right-click a file in the Fedora interface (such as the Nautilus
    file manager), there will be a Move to Trash item on the menu that appears. You
    can choose this menu item to instantly move the file to the Trash.


    Tip


    # Recovering Files from the Trash


    The nice thing about the Trash is that you have a chance to salvage the file—just
    like you could take a piece of paper out of a trash after throwing it away. To
    recover a file that you have thrown in the Trash, double-click the Trash icon
    on your desktop, find the file you want to recover, and drag it out of the trash
    to your desktop or wherever else you want to put it.


    Caution


    Keep in mind that you cannot recover a file from the Trash after you have emptied
    the trash or deleted the file from the Trash (as discussed in the next section).


    # Emptying the Trash


    The Trash is just like a real trash—it does not empty itself; you have to empty
    it.'
