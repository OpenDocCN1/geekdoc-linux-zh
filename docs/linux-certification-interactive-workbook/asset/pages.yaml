  md: '# HOSTS FILE


    By default, your UNIX computer will first access the file /etc/hosts to determine
    the IP address for hosts that you have a name for. The syntax of the file is as
    follows:


    ```

    127.0.0.1 localhost

    172.16.13.96 myhost host.mydomain.net mybox

    tux

    ```


    The first field gives the IP address for names in the second column.


    The second field contains the primary name and any aliases that may be for the
    host. The first name in the second field is the main name of the host. The remaining
    names are aliases that can also be used to access the host. The aliases will usually
    also be found in the /etc/hosts file on the corresponding remote host.


    # NSLOOKUP


    Once you have your system up and running, there are several options for doing
    nameserervices as we have discussed earlier. After the initial IP address is set
    up in /etc/hosts, your UNIX box can then use nameservices to get the IP addresses
    for names that need to be resolved. If your nameserver doesn''t have the name,
    it will usually point to another nameserver that can be queried. This nameserver
    will then pass the query to another nameserver, and so on, until either the name
    is resolved or a message is returned saying that the name cannot be resolved.


    In order to establish access to DNS nameserervices, it is necessary to modify
    the file /etc/resolv.conf. This file has the format:


    | domain | domainname |

    | nameserver | name_server_address |

    | nameserver | name_server_address |


    where the domain is the name of your domain.


    # FOR EXAMPLE:


    Some examples of domain names are: aol.com, ibm.com, sun.com, cod.edu, mediaone.net,
    and so forth. So a good example would be:


    ```

    domain mymydomain.net

    ```'
