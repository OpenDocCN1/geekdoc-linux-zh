  merge: -1
  pgno: 322
- img_proc: true
  md: '# FILE FORMAT


    The file consists of sections and parameters. A section begins with the name of
    the section in square brackets and continues until the next section begins. Sections
    contain parameters of the form


    ```

    ''name = value''

    ```


    The file is line-based—that is, each newline-terminated line represents either
    a comment, a section name or a parameter.


    Section and parameter names are not case sensitive.


    Only the first equals sign in a parameter is significant. Whitespace before or
    after the first equals sign is discarded. Leading, trailing and internal whitespace
    in section and parameter names is irrelevant. Leading and trailing whitespace
    in a parameter value is discarded. Internal whitespace within a parameter value
    is retained verbatim.


    Any line beginning with a semicolon ('';'') or a hash (''#'') character is ignored,
    as lines containing only whitespace.


    Any line ending in a ''\'' is "continued" on the next line in the custom UNIX
    fashion.


    The values following the equals sign in parameters are either a string (no quotes
    needed) or a boolean, which may be given as yes/no, 0/1 or true/false. Case is
    not significant in boolean values, but is preserved in string values. Some items
    such as create modes are numeric.


    # SECTION DESCRIPTIONS


    Each section in the configuration file (except for the [global] section) describes
    a shared resource (known as a “share”). The section name is the name of the shared
    resource and the parameters within the section define the shares attributes.


    There are three special sections, [global], [homes] and [printers], which are
    described under ''special sections''. The following notes apply to ordinary section
    descriptions.


    A share consists of a directory to which access is being given plus a description
    of the access rights which are granted to the user of the service. Some housekeeping
    options are also speciable.'
  merge: -1
  pgno: 323
- img_proc: true
  md: '# Appendix E: Samba Man Pages 299


    Sections are either filespace services (used by the client as an extension of
    their native file systems) or printable services (used by the client to access
    print services on the host running the server).


    Sections may be designated guest services, in which case no password is required
    to access them. A specified UNIX guest account is used to define access privileges
    in this case.


    Sections other than guest services will require a password to access them. The
    client provides the username. As older clients only provide passwords and usernames,
    you may specify a list of usernames to check against the password using the "user="
    option in the share definition. For modern clients such as Windows 95/98 and Windows
    NT, this should not be necessary.


    Note that the access rights granted by the server are masked by the access rights
    granted to the specified or guest UNIX user by the host system. The server does
    not grant more access than the host system grants.


    The following sample section defines a file space share. The user has write access
    to the path /home/bar. The share is accessed via the share name "foo":


    ```

    [foo]

    path = /home/bar

    writeable = true

    ```


    The following sample section defines a printable share. The share is read-only,
    but printable. That is, the only write access permitted is via calls to open,
    write and close a spool file. The ''guest user'' parameter means access will be
    permitted as the default guest user (specified elsewhere).


    ```

    [aprinter]

    path = /usr/spool/public

    read only = true

    printable = true

    guest ok = true

    ```


    # SPECIAL SECTIONS


    +   - The [global] section

    - Parameters in this section apply to the server as a whole, or are defaults for
    sections which do not specifically define certain items. See the notes under ''PARAMETERS''
    for more information.'
