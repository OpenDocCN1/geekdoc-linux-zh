  md: '# 542 Appendix H: NFS Documentation


    3. Why can''t I execute a file after copying it to the NFS server?


    The reason is that nfsd caches open file handles for performance reasons (remember,
    it runs in user space). While nfsd has a file open (as is the case after writing
    to it), the kernel won''t allow you to execute it. Nfsds newer than spring 95
    release open file files after a few seconds, older ones would cling to them for
    days.


    4. My NFS files are all read only


    The Linux NFS server defaults to read only. RTFM the "exports" and nfsd manual
    pages. You will need to alter /etc/exports.


    5. I mount from a linux nfs server and while is is works I can''t read or write
    files.


    On older versions of Linux you must mount a NFS servers with rsize=1024,wsize=1024.


    6. I mount from a Linux NFS server with a block size of between 3500-4000 and
    it crashes the Linux box regularly


    Basically don''t do it then.


    7. Can Linux do NFS over TCP


    No, at present.


    8. I get loads of strange errors trying to mount a machine from a Linux box.


    Make sure your users are in 8 groups or less. Older servers require this.


    9. When I reboot my machine it sometimes hangs when trying to mount a hung NFS
    server.


    Do not unmount NFS servers when rebooting or halting, just ignore them, it will
    not hurt anything if you don''t unmount them. The command is -avt nonfs.


    10. Linux NFS clients are very slow when writing to Sun and BSD systems


    NFS writes are normally synchronous (you can disable this if you don''t mind losing
    data). Worse still BSD derived kernels tend to be able to work in small blocks.
    Thus when you work'
