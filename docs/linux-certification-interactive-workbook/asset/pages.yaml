    +   4. Setting up a NFS client


    First you will need a kernel with the NFS file system either compiled before you
    compile the kernel or available as a module. If you have never compiled a kernel
    before you might need to check the kernel HOWTO and figure out. If you''re using
    a very cool distribution (like Red Hat) and you''ve never fiddled with the kernel
    or modules on it (and thus ruined it ;-), nfs is likely automagically available
    to you.


    You can now, at a root prompt, enter an appropriate mount command and the file
    system will appear. Continuing the example in the previous section we want to
    mount /mn/eris/local from eris. This is done with this command:


    ```

    mount -o rsize=1024,wsize=1024 eris:/mn/eris/local /mnt

    ```


    (We''ll get back to the the rsize and wsize options.) The file system is now available
    under /mnt and you can cd there, and Is in it, and look at the individual files.
    You will notice that it''s not as fast as a local file system, but a lot more
    convenient than ftp. If, instead of mounting the file system, mount produces an
    error message like mount: eris:/mn/eris/local failed, reason given by server:
    Permission denied then the exports is wrong, or you forgot to run exportfs editing
    the exports file. If it says mount clintdup_create: RPC: Program not registered
    it means that nfsd or mountd is not running on the server.


    To get rid of the file system you can say'
