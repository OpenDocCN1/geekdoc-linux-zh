  md: '# # About the CD-ROM


    # ## Contents


    The CD-ROM included with Linux Network Administrator’s Interactive Workbook Stampede
    Linux and a number of TinyLinux versions. The TinyLinux versions, you should note,
    provide you with the ability to:


    +   - Run Linux without installing it on a hard disk. They can be run off diskette,
    Zip disk, or loaded into ROM and EEPROMS. This gives you the potential to reduce
    the cost, size, or complexity of your system.

    - Easily make changes to Linux and test it without affecting a permanent install
    on your hard disk.

    - Develop routers, firewalls, gateways, and web servers that can be run totally
    out of memory. Since memory access is much faster than disk access, you can increase
    considerably the performance of these systems.

    - By running software out of memory, any security breaches or damage to the runtime
    image can be overwritten with a safe image.


    The CD includes the following TinyLinux distributions: DLX Distribution; DOSLINUX;
    ELKS; FloppyX; LOAF; LODS; LRP; Monkey Linux; Small Linux; Trinu; hal91; and tomsrtbt.


    The CD-ROM can be used on Linux and Microsoft Windows® 95/98/NT.


    # ## Technical Support


    For issues regarding bad media or replacement software, please contact Prentice
    Hall at disc_exchange@prenhall.com.'
