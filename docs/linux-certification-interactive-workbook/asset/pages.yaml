  md: '# FROM THE EDITOR


    Prentice Hall''s Interactive Workbooks are designed to get you up and running
    fast, with just the information you need, when you need it.


    We are certain that you will find our unique approach to learning simple and straightforward.
    Every chapter of every Interactive Workbook begins with a list of clearly defined
    Learning Objectives. A series of labs make up the heart of each chapter. Each
    lab is designed to teach you specific skills in the form of exercises. You perform
    these exercises at your computer and answer pointed questions about what you observe.
    Your answers will lead to further discussion and exploration. Each lab then ends
    with multiple-choice Self-Review Questions, to reinforce what you''ve learned.
    Finally, we have included Your Thinking projects at the end of each chapter. These
    projects challenge you to synthesize all of the skills you''ve acquired in the
    chapter.


    Our goal is to make learning engaging, and to make you a more productive learner.


    And you are not alone. Each book is integrated with its own "Companion Website."
    The website is a place where you can find more detailed information about the
    concepts discussed in the Workbook, additional Self-Review Questions to further
    refine your understanding of the material, and perhaps most importantly, where
    you can find a community of other Interactive Workbook users working to acquire
    the same set of skills that you are.


    All of the Companion Websites for our Interactive Workbooks can be found at http://www.phptr.com/phpptrinteractive.


    Mark L. Taub

    Editor-in-Chief

    Pearson PTR Interactive'
