  md: '# LAB 4.3


    # # GETTING SAMBA RUNNING


    # ## LAB OBJECTIVES


    After this Lab, you will be able to:


    +   - Determine Your Current Version of Samba

    - Remove Samba

    - Install Samba

    - Upgrade Samba

    - Set up and Test Samba

    - Connect from MS Windows to Samba

    - Connect from Samba to MS Windows


    # ## THE RPM METHOD


    There are several installation methods that have been developed to install software
    for operating systems. Some of the concerns in doing an install, upgrade, or uninstall
    are:


    +   - Making sure that the proper files are installed. Oftentimes an installation
    package requires a number of files to be installed. These files may be versions
    of files that are already there, or they may be new versions of files of currently
    existing files.

    - Removing any older versions of new files that are installed.

    - Being sure that if the install fails, the system can be restored to its previous
    stage.


    The Red Hat manufacturer of Linux has developed an installation method called
    the Red Hat Package Manager, which is RPM for short. The'
  merge: -1
  pgno: 185
- img_proc: true
  md: '# Lab 4.3: Getting Samba Running 161


    RPM method is used by a number of manufacturers of Linux and is also being considered
    for at least one non-Linux vendor for software installs. The RPM method does undergo
    improvements over time to make it simpler, more powerful, and even more stable.
    We will be discussing using the RPM method in this chapter. We will discuss determining
    your current version of Samba, removing it, and installing an upgraded version.
    You may want to examine other installation methods in order to deepen your understanding
    of Linux.


    # Lab 4.3 Exercises


    # 4.3.1 DETER YOUR CURRENT VERSION OF SAMBA


    Before you install the latest version of Samba, you need to determine what version
    is currently installed. Most releases of Linux now automatically include Samba,
    but by the time consumers get the software, there is usually a new version available.
    While it is not always smart to get the latest release until it is known to be
    bug-free, oftentimes the new release includes features that you will want to add
    to your system. It may also include bug fixes and speed reliability enhancements.


    In order to determine your current version of Samba, you need to execute the rpm
    command with the appropriate option. Like many UNIX commands, rpm can take many
    options for doing various things related to installation. It is a command that
    you should research well if you are going to be doing many Linux installations
    and configurations.


    The query option to rpm will give you information about the current version of
    a package that is installed. You should note that when you do an rpm query, you
    do not need to specify the version number, but when you do an installation, upgrade,
    or removal, you do need this information. The command you would use to do the
    query is the following:


    ```

    rpm -q -i samba

    ```


    The meaning of the options is


    +   -q—Do a query

    -i—Return all the information

    samba —Return the information about the Samba that is installed.'
  merge: -1
