  md: '# Chapter 5: Sharing Data in an NFS World

    CHAPTER 5


    # TEST YOUR THINKING


    I) There are a number of options that you can use when you allow an NFS mount.
    The best way to learn about these options is to set up your test environment and
    see what the effects are. Some of the options you can add to the /etc/exports
    file on your exporting system that can be tested are as follows:


    ```

    insecure

    unix-rpc-(default behavior)

    root_squash

    no_root_squash-(default behavior)

    ro-(default behavior)

    rw

    ```


    There are a number of other options, but these are ones that you will want to
    test. You should set up two networked systems so that you can test these characteristics.
    You should attempt to recreate the NFS mounts in this chapter.


    +   a) Test the insecure option. What happens when you try to do the NFS mount?
    What are the results of using the touch command to create a file?


    +   b) Test the unix-rpc option. What happens when you try to do the NFS mount?
    What are the results of using the touch command to create a file?


    +   c) Test the root_squash option. What happens when you try to do the NFS mount?
    What are the results of using the touch command to create a file?


    +   d) Test the no-root_squash option. What happens when you try to do the NFS
    mount? What are the results of using the touch command to create a file?


    +   e) Test the ro option. What happens when you try to do the NFS mount? What
    are the results of using the touch command to create a file?


