  md: '# APPENDIX B


    # USING MINIMAL

    LINUX


    > The tools we use do not need to be complicated or expensive if all we want to
    do is hammer a nail.

    —Joe


    # LINUX


    There are a number of versions of Linux that can run on minimal resources. These
    are called Minimal Linux or Tiny Linux. These versions can run on systems from
    a simple 8086 PC and a Palm Pilot to a system containing hundreds of processors.
    This makes it ideal to do prototyping of software and for a student to be root
    without having to work from a permanent installation.


    The accompanying CD-ROM includes Stampede Linux as well as several Minimal Linux
    versions. These versions of Linux can give you many of the features of a full-blow
    version of Linux. In addition, there are features such as:


    +   - The operating system and the programs you need are loaded into RAM disks,
    which act like real disks, but are actually memory. You can make any changes to
    the files in memory without making any permanent changes to your system. You can
    use this environment to test features before implementing them permanently.

    - You can run programs much faster than they would run off disk. Since the access
    time of information in memory is much faster than the access time of a disk, you
    can use it for critical-'
  merge: -1
  pgno: 244
- img_proc: true
  md: '# Appendix B: Using Minimal Linux


    situations where speed is of the essence and the applications are not very memory-intensive.


    +   They are usually tariffed and gzipped files that are expanded when the system
    boots up. Typically, you will get 10 megs of filesystem space from two diskettes.
    It is easy to expand the filesystem space available if you have more memory.


    +   Some versions of Linux, such as Trinux, allow you to load in diskettes of
    software continually up to the limits of the space you have set aside.


    +   Once your networking is in place, some versions will allow you to do NFS mounts,
    giving you even more power.


    +   You can embed Linux on a ROM, EEPROM, and have it load into memory every time
    it boots. This is very useful for devices as TV controllers, cell phones, routers,
    bridges, game machines, etc. Since they typically run in 10 megs of ramdisk, the
    cost of producing such equipment can be greatly reduced. Since it is a full-blown
    operating system, any features can be prototyped on larger systems and minimized
    to run in the space available.


    +   They often include a full range of security and system diagnostic tools so
    that you can take a couple of diskettes to a workstation, boot from the diskettes,
    and look for networking or system problems from those workstations. Once you are,
    you can just reboot the PC without the diskettes, and the original PC software
    is unaffected. This can be done by MS-DOS, but then you are more limited in running
    your programs from one diskette.


    +   PC diskette formats are either standard or recognized in several versions,
    that you can either edit from Windows PCs or save them on a Novell or NT network
    disk for general consumption.


    Some of the drawbacks of Minimal Linux are:


    +   You need to feed the system diskettes continually if you are using more than
    one diskette.


    +   The software and kernels that you use are typically stripped-down versions
    of the generally available versions. This is done by removing features from the
    kernel. So you may not find the features you want, or you may need to compile
    them in. Fortunately, you have access to the source code.


    +   Some of the commands and tools that you will use are not on the diskettes.
    What is missing depends on which assembled the distribution. You will then need
    to add the commands you need.'
  merge: -1
  pgno: 245
- img_proc: true
  md: '# Appendix B: Using Minimal Linux 221


    +   - Support for these versions is more limited than the standard packages, since
    they can have much of the functionality removed.


    +   - In some cases, the diskette format is a non-standard format, so you have
    to go through several additional steps to add files to the diskette. At least
    one version uses a diskette of 1.7 megs, which is non-standard and sometimes causes
    some system fusion when you are doing mounts and file manipulation.


    # TRINUX


    I am going to discuss a version of Minimal Linux called Trinux. This is available
    at http://www.trinux.org. When you are installing a Minimal Linux, you should
    investigate the versions that are available on the Internet. Remember that just
    a version is the latest doesn''t mean it is workable for you. Trinux 0.49 supports
    a number of ethernet cards that are not currently supported by versions 0.51 and
    0.61. This is because the later versions changed libraries and it takes time to
    recompile the drivers.


    I am providing an analysis of Trinux that you might use to analyze any version
    of minimal Linux that you are interested in using. The features of Trinux that
    I found useful are:


    +   - The disk is DOS formatted, which allows me to move back-and-between Linux
    and DOS. In an academic environment, this is very useful because the Internet
    access is typically via Windows-based PCs. When the software is downloaded off
    the Internet, the process becomes a lot easier. On UNIX or Linux boxes in academic
    environments, the diskette drive is either not available or limited to root only—not
    a good situation for the beginning Linux.


    +   - The number of diskettes that can be loaded in the boot process is limited
    only by the amount of RAM that is available, unused by the system, and configured
    in the boot files.


    +   - You can load the software that you want in modular format. You can boot
    from a diskette. You can then use a diskette that will run:


    +   - Apache Web server


    +   - a name server


    +   - X-Windows'
