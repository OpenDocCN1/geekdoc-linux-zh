  md: '# Appendix D: Samba Documentation 267


    # FILE CACHING


    Some people report problems with "caching" of data. Generally the bug report goes
    like this:


    +   - create a file on a Unix box

    - view the file on a PC via Samba

    - change the file on the Unix box

    - look at the file again on the PC via Samba and the changes are not visible


    The first thing to realize is that this is the expected behavior! The SMB protocol
    uses "opportunistic locking". This allows the client to "safely" client side caching
    of file data. The problem is that this caching is only safe if all programs access
    the files via SMB. As soon as you access the data via a non-SMB client then you
    will get data inconsistencies.


    The solution is simple! Disable oplocks in smb.conf for those shares that need
    to be accessed simultaneously from Unix and windows. See the "oplocks" and "veto
    oplock files" options in smb.conf(5)


    Samba-1.9.18 and the samba-2.x series support oplocks.


    Samba-1.9.17 does NOT.


    In addition, you may care to explore the effect of making the following registry
    entries under MS Windows NT4:


    ```

    HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\LanmanWorkstation\Parameter

    "BufFilesDenyWrite"=dword:00000000

    "BufNamedPipes"=dword:00000000

    "UseOpportunisticLocking"=dword:00000000

    ```'
