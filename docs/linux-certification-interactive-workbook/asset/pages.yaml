  md: "# Appendix G: Nameserver Documentation 487\n\n3. A caching only name server.\n\
    \nA first stab at DNS config, very useful for dialup users.\n\nA caching only\
    \ name server will find the answer to name queries and remember the answer next\
    \ time you need it. This will shorten the waiting time the next time significantly,\
    \ especially if you're on a slow connection.\n\nFirst you need a file called /etc/named.conf.\
    \ This is read when named starts. For now it should simply contain:\n\n```\n//\
    \ Config file for caching only name server\n\noptions\n  directory \"/var/named\"\
    ;\n  // Uncommenting this might help if you have to go through a\n  // firewall\
    \ and things are not working out:\n\n  // query-source port 53;\n);\nzone \".\"\
    \ (\n  type hint;\n  file \"root.hints\";\n);\nzone \"0.0.127.in-addr.arpa\" {\n\
    \  type master;\n  file \"pz/127.0.0\";\n}\n```\n\nThe 'directory' line tells\
    \ named where to look for files. All files named subsequently will be relative\
    \ to this. Thus pz is a directory under /var/named, /var/named/pz. /var/named\
    \ is the right directory according to the Linux file system Standard.\n\nThe file\
    \ /var/named/root.hints is named in this.\n/var/named/root.hints should contain\
    \ this:"
