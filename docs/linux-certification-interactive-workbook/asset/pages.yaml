  md: '# Appendix E: Samba Man Pages


    +   - load printers (G)


    A boolean variable that controls whether all printers in the printcap will be
    loaded for browsing by default. See the “printers” section for more details.


    Default: load printers = yes


    Example: load printers = no


    +   - local group map (G)


    This option allows you to specify a file containing unique mappings of individual
    NT Local group names (in any domain) to UNIX group names. This allows NT Local
    groups (aliases) to be presented correctly to NT users, despite the lack of native
    support for the NT Security model (based on VAX/VMS) in UNIX. The reader is advised
    to become familiar with the NT Domain system and its administration.


    This option is used in conjunction with ‘domain group map’ and ‘do-main name map’.
    The use of these three options is trivial and unnecessary in the case where Samba
    is not expected to interact with any other SAM databases (whether local workstations
    or Domain Controllers).


    The map file is parsed by line. If any line begins with a ''#'' or a ‘;'', it
    is ignored. Each line should contain a single UNIX group name on the left then
    a single NT Local group name on the right, separated by a tabstop or ‘=’ . If
    either name contains spaces then it should be enclosed in quotes. The line can
    be either of the form:


    ```

    UNIXusername \DOMAIN_NAME\LocalGroupName

    ```


    or:


    ```

    UNIXusername LocalGroupName

    ```


    In the case where Samba is either EXPERIMENTAL Domain Controller or it is a member
    of a domain using “security = domain”, the latter format can be used: Default
    Domain name is the Samba Server’s Domain name, specified by “workgroup = MYGROUP”.


    Any UNIX groups that are NOT specified in this map file are treated as either
    Local or Domain Groups depending on the role of the Samba Server.'
  merge: -1
  pgno: 365
- img_proc: true
  md: '# Appendix E: Samba Man Pages 341


    In the case when Samba is an EXPERIMENTAL Domain Controller, Samba will present
    ALL unspecified UNIX groups as its own NT Domain Groups, with the same name, and
    NOT as Local Groups.


    In the case where Samba is member of a domain using "security = domain", Samba
    will check the UNIX name with its Domain Controller (see "password server") as
    if it were an NT Domain Group. If the Domain Controller says that it is not, unspecified
    (unmapped) UNIX groups which are also not NT Domain Groups are treated as Local
    Groups in the Samba Server''s local SAM database. NT Administrators will recognise
    these as Workstation Local Groups, which are managed by running USMRGR.EXE and
    selecting a remote domain named "\\WORKSTATION_NAME\", or by running USMRGR.EXE
    on a local Workstation.


    This may sound complicated, but it means that a Samba Server as either a member
    of a domain or as an EXPERIMENTAL Domain Controller will act like an NT Workstation
    (with a local SAM database) or an NT PDC (with a Domain SAM database) respectively,
    the need for any of the map files at all. If you want to get fancy, however, you
    can.


    Note that adding an entry to map an arbitrary NT group in an arbitrary Domain
    to an arbitrary UNIX group REQUIRES the following:


    +   - that the UNIX group exists on the UNIX server.

    - that the NT Domain Group exists in the specified NT Domain

    - that the UNIX Server knows about the specified Domain;

    - that all the UNIX users (who are expecting to access the Samba Server as the
    correct NT user and with the correct NT group permissions) in the UNIX group be
    mapped to the correct NT users in the specified NT Domain using ''domain map''.


    Failure to meet any of these requirements may result in either (or both) errors
    reported in the log files or (and) incorrect or missing access rights granted
    to users.


    +   - local master (G)


    This option allows nmmbd to try and become a local master browser on a subnet.
    If set to False then nmmbd will not attempt to become a local master browser on
    a subnet and will also lose in all browsing elections. By default this value is
    set to true. Setting this value to true doesn''t mean that Samba will become the
    local master browser on a subnet, just that nmmbd will participate in elections
    for local master browser.'
