    +   - logon script (G)


    This parameter specifies the batch file (.bat) or NT command file (.cmd) to be
    downloaded and run on a machine when a user successfully logs in. The file must
    contain the DOS style/lf line endings. Using a DOS-style editor to create the
    file is recommended.


    The script must be a relative path to the [netlogon] service. If the [netlogon]
    service provides a path of /usr/local/samba/netlogon, and logon script = STARTUP.BAT,
    then the file that will be downloaded:


