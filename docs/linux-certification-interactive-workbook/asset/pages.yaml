    # 4.3.5 SET UP AND TEST SAMBA


    There are many configuration options available for Samba. In fact, by the time
    you read this chapter, the power and breadth of Samba will have grown even more
    because it is constantly evolving.


    # The Whole Truth


    In order to get you started as quickly as possible, the simplest configuration
    choices have been made. This Exercise assumes that you have set up Windows 95
    as described in Lab 4.1. In this case, there should be no changes necessary to
    Samba to get your Linux box working. If you are running Windows 98 or NT, you
    may have to make changes to your Windows network characteristics in order to match
    the Samba settings. I have chosen this route for simplicity because Windows networking
    is installed by default. I could have just as easily directed you to configure
    Samba, but then you will probably need to make more changes to Windows to match
    Samba. Once you are confident about your Samba skills, you can branch out and
    experiment with the many options. There are also several good books on Samba,
    and certainly there will be in the near future as Samba becomes essential to the
    enterprise.'
