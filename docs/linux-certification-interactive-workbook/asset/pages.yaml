  md: '# Appendix E: Samba Man Pages 349


    +   * magic script (S)


    This parameter specifies the name of a file which, if opened, will be executed
    by the server when the file is closed. This allows a UNIX script to be sent to
    the Samba host and executed on behalf of the connected user.


    Scripts executed in this way will be deleted upon completion, permissions permitting.


    If the script generates output, output will be sent to the file specified by the
    “magic output” parameter (see above).


    Note that some shells are unable to interpret scripts containing carriagereturn-linefeed
    instead of linefeed as the end-of-line marker. Magic scripts must be executable
    “as is” on the host, which for some hosts and some shells will require filtering
    at the DOS end.


    Magic scripts are EXPERIMENTAL and should NOT be relied upon


    Default: None. Magic scripts disabled.


    Example: magic script = user.csh


    +   * mangle case (S)


    See the section on “NAME MANGLING”.


    +   * mangled map (S)


    This is for those who want to directly map UNIX file names which can not be represented
    on Windows/DOS. The mangling of names is not always what is needed. In particular
    you may have documents with file extensions that differ between DOS and UNIX.
    For example, under UNIX it is common to use “.html” for HTML files, whereas under
    Windows/DOS “.htm” is commonly used.


    To map “html” to “htm” you would use:


    ```

    mangled map = (*.html *.htm)

    ```


    One very useful case is to remove the annoying “;1” off the ends of filenames
    on some CDROMs (only visible under some UNIXs). To do this a map of (*;1).


