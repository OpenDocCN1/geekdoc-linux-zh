    Tom Kessler (SGI), Dave (Brandenburg Consulting), Tom Kessler (SGI), Dave Piscitello
    (Core Competence), Matt Crawford (FNAL), Michael Patton (BBN), and Paul Pixie
    (Internet Software Consortium) for their review and constructive comments.


    # 9. References


    [RFC1466] Gerich, E., "Guidelines for Management of IP Address Space", RFC 1466,
    Merit Network, Inc., May 1993.'
