  md: '# Appendix E: Samba Man Pages 407


    # Examples:


    +   - read only = no

    - writeable = yes

    - write ok = yes


    # WARNINGS


    Although the configuration file permits service names to contain spaces, Spaces
    will be ignored in comparisons anyway, your client may not. so it shouldn''t be
    a problem—be aware of the possibility.


    On a similar note, many clients—especially DOS clients—limit service names to
    eight characters. **Smbd** has no such limitation, but attempts to connect from
    such clients will fail if they truncate the service names. For this reason you
    should probably keep your service names down to eight characters.


    Use of the **[homes]** and **[printers]** special sections make life for an administrator
    ease, but the various combinations of default attributes can be tricky. Take extreme
    care when designing these sections. In particular, ensure the permissions on spool
    directories are correct.


