    Two things must be noted about the SOA record. ns.linux.bogus must be an actual
    machine with a A record. It is not legal to have a CNAME record for the machine
    mentioned in the SOA record. It''s name need not be ''ns'', it could be any legal
    host name. Next, hostmaster.linux.bogus or should be read as hostmaster@linux.bogus,
    this should be a mail alias, or a mailbox, where the person(s) maintaining DNS
    should read mail frequently. Any mail regarding the domain will be sent to the
    address listed here. The name need not be ''hostmaster'', it can be your normal
    e-mail address, but the e-mail address ''hostmaster'' is often expected to work
    as well.


    There is one new RR type in this file, the MX, or Mailchanger. It tells mail systems
    to send mail that is addressed to someone@linux.bogus, namely two mail.linux.bogus
    or mail.friend.bogus. The number before each mail name is MX priority. The RR
    with the lowest number (10) is the one mail should be sent to if possible. If
    that fails the mail can be sent to one with a higher number, a secondary mail
    handler, i.e., mail.friend.bogus which has priority 20 here. Restart by running
    nslookup


