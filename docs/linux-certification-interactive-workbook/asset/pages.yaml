  md: '# Appendix D: Samba Documentation 259


    # THIS IS NOT A HELPDESK


    The address samba-bugs@samba.org is meant for reporting bugs or for obtaining
    help when you suspect that a Samba bug is involved. It is not meant as a general
    helpservice. It''s not that we don''t want to help (we do!) but we get thousands
    of emails and have only a few people to deal with them. Trying to help with each
    Samba install personally is way beyond our abilities.


    Instead I suggest that you try one of the following resources:


    +   1) The Samba web site at http://samba.org/samba/


    +   2) The mailing list samba@samba.org.


    Read http://lists.samba.org/ for more info on that.


    +   3) The newsgroup comp protocols.smb


    +   4) a newsgroup specific to your OS, such as comp.os.linux.*


    If you can afford it you could also contact one of the many companies that provide
    commercial Samba support. See http://samba.org/samba/ and follow the links.


    # TIME OFF BY 1 HOUR


    It sounds like every your PCs or your server don''t have their timezones set up
    correctly for daylight savings time or just disagree on the time zone you are
    in.


    Without knowing what sort of system you are running Samba on is difficult to know
    what to change. If you want to use a “quick fix” then maybe the “time offset”
    command in smb.conf will be useful.


    # TRAPDOOR UID


    > > Log message "you appear to have a trapdoor uid system"


    This can have several causes. It might be because you are using a uid or gid of
    65535 or -1. This is a VERY bad idea, and is a big security hole. Check carefully
    in your etc/passwd file and make sure that no user has uid 65535 or -1. Especially
    check the “nobody” user, as many broken systems are equipped with nobody setup
    with a uid of 65535.'
  merge: -1
  pgno: 284
- img_proc: true
  md: '# Appendix D: Samba Documentation


    It might also mean that your OS has a trapdoor uid/gid system


    This means that once a process changes effective uid from root to another user
    it can''t go back to root. Unfortunately Samba relies on being able to change
    effective uid from root to non-root and back again to implement its security policy.
    If your OS has a trapdoor uid system this won''t work, and several things in Samba
    may break. Less things break if you use user or server level security instead
    of the default level security, but you may still strike problems.


    The problems don''t give rise to any security holes, so don''t panic, but it does
    mean some of Samba''s capabilities will be unavailable. In particular you will
    not be able to connect to the Samba server as two different users at once. This
    may happen if you try to run as a guest while accessing a share as a normal user.
    It may also affect your ability to list the available shares as this is normally
    done as the guest user.


    Complain to your OS vendor and ask them to fix their system.


    Note: the reason why 65535 is a VERY bad choice of uid and gid is that it casts
    to -1 as a uid, and the setuid(0) system call ignores (with no error) uid changes
    to -1. This means any daemon attempting to run as uid 65535 will actually run
    as root. This is not good!


    # UNIX PERMISSIONS CONTROL ACCESS


    Typical question:


    +   > So here''s a configuration (and I apologise if this is just a issue).

    > On any of our NT Workstation clients (with the reg edit to allow plain passwords),
    once a drive is mapped using userid and password with \host\anyuser,

    > that user can subsequently issue \host\root and mount the unix box at the root

    > directory directory without any authentication required .. they have access
    to the whole

    > machine.


    Samba does NOT second guess the security policy you wish to impose upon your site.
    You, as a system administrator for your Unix system, have the responsibility to
    determine by means of setting correct user, group and other permissions who can
    access what on your Unix system.'
  merge: -1
