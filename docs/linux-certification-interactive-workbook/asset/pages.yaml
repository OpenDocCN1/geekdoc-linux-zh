    version. The search is the domain name that will be searched when given a host
    name. You can actually search multiple domains, one at a time, starting from left
    to right. The nameserver line tells what nameserver you are using. In this case,
    you are doing name resolution on your own box, so it is its own nameserver.


    In these Exercises, you can use the sample domain name, create your own name,
    or use a currently existing one. For the purposes of this exercise, it doesn''t
