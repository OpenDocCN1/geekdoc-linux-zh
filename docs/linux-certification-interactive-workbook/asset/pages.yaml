    precursor code to the samba-2.1.0 branch.


    # NETWKSTAUSERLOGON


    The password server behavior changed because we discovered that bugs in some NT
    servers allowed anyone to login with no password if they chose an account name
    that did not exist on the password server. The NT password server was saying "yes,
    it''s OK to login" even when the account didn''t exist at all! Adding the NetWkstaUserLogon
    call fixed the problem, and follows the "recommended" method that MS have recently
    documented for pass through authentication.


    The problem now is that some NT servers (in particular NT servers) don’t support
    the NetWkstaUserLogon call. The also doesn''t work for accounts in trust relationships.


    The eventual solution for this will be to replace the password server code in
    Samba with NT domain code as developed. For now you have the choice of compiling
    Samba either with or without the NetWkstaUser-Logon call in the password server
    code.


    In 1.9.18p3 and later you can disable the NetWkstaUserLogon call with an option
    in your smb.conf using the "networkstation user login" option.


