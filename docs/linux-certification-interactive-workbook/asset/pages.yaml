  md: '# 434 Appendix E: Samba Man Pages


    code will read and write these older password files but will not be to modify
    the old entries to add the new fields. New entries added with smpassword (8) will
    contain the new fields in the added accounts however. Thus an older smpassword
    file used with Samba 2.0 may end up with some accounts containing the new fields
    and not some.


    In order to convert an old-style smpassword file to a new style, run the script
    convert_smpassword, installed in the Samba bin/ directory the same place as the
    smbd and nmbd binaries are installed as:


    ```

    cat old_smpassword_file | convert_smpassword > new_smpassword_file

    ```


    The convert_smpassword script reads from stdin and writes to stdout as not to
    overwrite any files by accident.


    Once this script has been run, check the contents of the new smpassword file to
    ensure that it has not been damaged by the conversion script (which uses awk),
    and then replace the <old smpassword file> with the <new smpassword file>.


