  md: '# 224 Appendix C: Building Your Linux Home Network


    In many work environments, it is impossible to test out your ideas or spend time
    delving into some of the more obscure aspects of your operating system. There
    are concerns about network security, integrity, and impact on production environments.
    In this Appendix, the basic concept and the necessary components that it takes
    to build a network will be discussed. This sections will discuss some of the things
    you need to consider when you create a network. The ideal environment will be
    presented. Your setup will be different and your mileage may vary.


    # THE BUDGET


    The number-one constraint we all have is the amount of money we can put toward
    building the network. It is possible to spend thousands of dollars before you
    realize how much you have spent. It can even become obsession. But that is a topic
    for another book. You need to find a way to balance the money you spend with benefits
    you will derive from it.


    If your goal is to develop new skills for your career, you can be certain that
    any new Linux and UNIX skills you develop can have a financial return, either
    in your current or future positions. If you are doing software development on
    some public-domain project, you will be furthering your skills and gaining some
    admiration in the programming community. If you are writing a book, as I am, you
    find that you need to have the proper resources to test out your ideas before
    you put them into print. But here is a direct financial return also.


    Whatever your goals are, you should also consider what kind of investment you
    can make. You should expect that, over time, you will spend several times whatever
    your original goal was. This is because it is difficult to anticipate the needs
    that you would have. That 486 might be perfect for doing command-line work in
    Linux and for use as a file and print server. It will do okay for the basic X-windows
    stuff. But once you start loading up the software on your screen, you''ll be happier
    with a faster box.


    Once someone buys a new computer, its value immediately plummets. This is like
    the proverbial $1,000 that you lose by driving the car out of the dealer''s lot.
    You can take advantage of this, since a Linux box will run a lot better on older
    computers than MS Windows products. Many companies now totally write-off the value
    of a new computer in three years. This means that it has no value after this time.
    But if you look back at the kinds of computers we were buying three years ago,
    they were generally Pentiums with speeds of approximately 150 MHz. These boxes
    work well as Linux boxes and can often be purchased for $100 at computer swaps,'
  merge: -1
