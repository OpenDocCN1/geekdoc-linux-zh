  md: '# Appendix E: Samba Man Pages


    +   - debug timestamp (G)


    Samba2.0 debug log messages are timestamped by default. If you are running at
    an error **debug level** these timestamps can be distracting. This boolean parameter
    allows them to be turned off.


    **Default:** debug timestamp = Yes


    **Example:** debug timestamp = No


    +   - debug level (G)


    The value of the parameter (an integer) allows the debug level (logging level)
    to be specified in the **smb.conf** file. This is to give greater flexibility
    in the configuration of the system.


    The default will be the debug level specified on the command line or level zero
    if none was specified.


    **Example:** debug level = 3


    +   - default (G)


