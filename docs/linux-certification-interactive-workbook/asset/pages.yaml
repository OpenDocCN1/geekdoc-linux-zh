  md: '# Appendix E: Samba Man Pages


    # DESCRIPTION


    The Samba software suite is a collection of programs that implements the Server
    Message Block(commonly abbreviated as SMB) protocol for UNIX systems. This protocol
    is sometimes referred to as the Common Internet File System (CIFS), LanManager
    or NetBIOS protocol.


    # COMPONENTS


    The Samba suite is made up of several components. Each component is described
    in a separate manual page. It is strongly recommended that you read the documentation
    that comes with Samba and the manual pages of those components that you use. If
    the manual pages aren''t clear enough then send a patch or bug report to samba-bugs@samba.org.


    +   * smbd

    * The smbd (8) daemon provides the file and print services to SMB clients, such
    as Windows 95/98, Windows NT, Windows forgroups or LanManager. The configuration
    file for this daemon is described in smb.conf (5).

    * nmbd

    * The nmbd (8) daemon provides NetBIOS nameserving and browsing support. The configuration
    file for this daemon is described in smb.conf (5).

    * smbclient

    * The smbclient (1) program implements a simple ftp-like client. This is useful
    for accessing SMB shares on other compatible servers (such as Windows NT), and
    can also be used to allow a UNIX box to print to a printer attached to any SMB
    server (such as a PC running Windows NT).

    * testparam

    * The testparam (1) utility allows you to test your smb.conf (5) configuration
    file.

    * testprns

    * The testprns (1) utility allows you to test the printers defined in your printcap
    file.

    * smbdystatus

    * The smbdystatus (1) utility allows you to list current connections to the smbd
    (8) server.

    * nmlookup

    * The nmlookup (1) utility allows NetBIOS name queries to be made from the UNIX
    machine.'
