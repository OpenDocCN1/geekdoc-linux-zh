    ```

    1D)    ; Minimum TTL

    NS ns.linux.bogus.

    1 PTR localhost.

    ```


    Next, you need a /etc/resolv.conf looking something like this:


    ```

    search subdomain.your-domain.edu your-domain.edu

    nameserver 127.0.0.1

    ```


    The ''search'' line specifies what domains should be searched for any host names
    you want to connect to. The ''nameserver'' line specifies the address of your
    nameserver, in this case your own machine since that is where your names runs
    (127.0.0.1 is right, no matter if your machine has an other address too). If you
    want to list several name servers put in one ''nameserver'' line for each. (Note:
    Named never reads this file, the resolver that uses names does.)


    To illustrate what this file does: If a client tries to look up foo, then subdomain.your-domain.edu
    is tried first, then foo.yourfomain.edu, finally foo. If a client tries to look
    up sunite.unc.edu, sunite.unc.subdomain.your-domain.edu is tried first (yes, it''s
    silly, but that is how it works), sunite.unc.edu.your-domain.edu, and finally
    sunite.unc.edu. You may not want to put in too many domains in the search line,
    it takes time to search them all.


    The example assumes you belong in the domain subdomain.your-domain.edu, your machine
    then, is probably called your-machine.subdomain.your-domain.edu. The search line
    should not contain your TLD (Top Level Domain), ''edu in this case). If you frequently
    need to connect to hosts in another domain you can add that domain to the search
    line like this:


    ```

    search subdomain.your-domain.edu your-domain.edu other-domain.edu

    ```


    and so on. Obviously you need to put real domain names in instead. Please note
    the lack of periods at the end of the domain names. This is important, please
    note the lack of periods at the end of the domain names.'
