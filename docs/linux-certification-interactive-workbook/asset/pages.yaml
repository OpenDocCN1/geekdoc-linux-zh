  md: 'This is exactly how Windows NT works. You MUST have a valid account on the
    Windows NT box you are trying to see the resource list. If your currently logged
    in account details do NOT match the account on the NT machine you are trying to
    access then you will be presented with a logon box for that machine. When you
    enter the name of an account on that machine / domain, together with a valid password
    then the resource list is made available. If the account details are not correct
    then no resource list is shown.


    Samba follows the behaviour of Windows NT exactly.


    Samba can be compiled with the GUEST_SESSION_SETUP option at 0,1 or 2. The default
    is 0. If this is set to 1 or 2 then Windows NT machines do NOT have an account
    on the Samba server will see the resource list. Unfortunately Windows client bugs
    mean that this option will probably cause more problems than it will solve. We
    do not suggest that you use it.


    # WIN95 OR 98 AND ENCRYPTION


    FAQ answer about Win95 (with TCP/IP update or OSR2 version) and Win98 and Samba:


    Microsoft changed Win95 upon release of their OSR2 version to refuse to connect
    to servers that do not support SMB encryption. This change was also released in
    a TCP/IP update for Win95 and is included in all versions of Win98 that we''ve
    seen so far.


    There are two main solutions:


    +   1) enable SMB password encryption in Samba. See ENCRYPTION.txt in the Samba
    docs


    +   2) disable this new behavior in Win95/98. See Win95.txt in the Samba docs


    The Samba docs directory is included with any recent Samba distribution or available
    at ftp://samba.anu.edu.au/pub/samba/docs/


    NOTE: You must reboot your machine for these registry changes to take effect.'
