  md: '# NAME MANGLING


    Samba supports “name mangling” so that DOS and Windows clients can use files that
    don’t conform to the 8.3 format. It can also be set to adjust the case of 8.3
    format filenames.


    There are several options that control the way mangling is performed, and they
    are grouped here rather than listed separately. For the defaults look at the output
    of the testpar program.


    All of these options can be set separately for each service (or globally, of course).


    The options are:


    +   “mangle case = yes/no” controls names that have characters that aren’t of
    the “default” case are mangled. For example, if this is yes then a name like “Mail”
    would be mangled. Default no.


    +   “case sensitive = yes/no” controls whether filenames are case sensitive. If
    they aren’t Samba must do a filename search and match on passed names. Default
    no.


    +   “default case = upper/lower” controls what the default case is for new filenames.
    Default lower.


    +   “preserve case = yes/no” controls if new files are created with the case that
    the client passes, or if they are forced to be the “default” case. De-fault Yes.


    +   “short preserve case = yes/no” controls if new files which conform to 8.3
    syntax, are created in upper case and of sufficient length, are upper case, or
    if they are forced to be the “default” case. This option can be use with “preserve
    case = yes” to permit long filenames to retain case, while short names are lowered.
    Default Yes.


    By default, Samba 2.0 has the same semantics as a Windows NT server, in that it
    is case insensitive but case preserving.


    # NOTE ABOUT USERNAME/PASSWORD VALIDATION


    There are a number of ways in which a user can connect to a service. The server
    follows the following steps in determining if it will allow a connection to a
    specified service. If all the steps fail then the connection request'
  merge: -1
  pgno: 329
- img_proc: true
  md: '# Appendix E: Samba Man Pages 305


    is rejected. If one of the steps pass then the following steps are not checked.


    If the service is marked “guest only = yes” then steps 1 to 5 are skipped and
    that


    +   Step 1: If the client has passed a username/password pair and is validated
    by the UNIX system’s password programs then the connection is made as username.
    Note that this includes the \server\service@username method of passing a username.


    +   Step 2: If the client has previously registered a username with the system
    and now supplies a correct password for that username then the connection is allowed


    +   Step 3: The client’s netbios name and any previously used user names are checked
    against the supplied password, if they match then the connection is allowed as
    the corresponding user.


    +   Step 4: If the client has previously validated a username/password pair with
    the server and the client has passed the validation token then that username is
    used. This step is skipped if “revalidate = yes” for this service.


    +   Step 5: If a “user = ” field is given in the smb.conf file for the service
    and the client has supplied a password, and that password matches (according to
    the UNIX system’s password checking) with one of the usernames from the user=
    field then the connection is made as the username in the “user=” line. If one
    of the username in the user= list begins with a “@ then that name expands to a
    list of names in the group of the same name.


    +   Step 6: If the service is a guest service then a connection is made as the
    username given in the “guest account ==” for the service, irrespective of the
    supplied password.


    # COMPLETE LIST OF GLOBAL PARAMETERS


    Here is a list of all global parameters. See the section of each each for details.
    Note that some are synonyms.'
