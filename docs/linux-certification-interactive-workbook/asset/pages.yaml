  md: '# Appendix G: Nameserver Documentation 521


    When I go off line I copy the root.hints.fake file to root.hints and restart named.


    When I go online I copy root.hints.real to root.hints and restart named.


    This is done from ip-down & ip-up respectively.


    The first time I do a query off line on a domain name named doesn''t have details
    for it puts an entry like this in messages..


    Jan 28 20:10:11 hazchem named[10147]: No root nameserver for class IN


    which I can live with.

    It certainly seems to work for me. I can use the nameserver for local machines
    while off the ''net'' without the timeout delay for external domain names and
    I while on the ''net'' queries for external domains work normally


    +   - I have received information about how bind interacts with NFS and the portmapper
    on a mostly offline machine from Karl-Max Wanger


    I to run my own named on all my machines which are only occasionally connected
    to the Internet by modem. The nameserver only acts as a cache, it has no area
    of authority and asks back for everything at the name servers in the root.cache
    file. As is usual with Slackware, it is started before nfsd and mount.


    With one of my machines (a Libreto 30 notebook) I had the problem that sometimes
    I could mount it from another system connected to my local LAN, but most of the
    time it didn''t work. I had the same effect regardless of using PLIP, a PCMCIA
    ethernet card or PPP over a serial interface.


    After some time of guessing and experimenting I found out that apparently messed
    with the process of registration nfsd and mountd have to carry out with the portmapper
    upon startup (I start these daemons at boot time as usual). Starting named after
    nfsd and mountd eliminated this problem completely.


    As there are no disadvantages to expect from such a modified sequence I''d advise
    everybody to do it that way to prevent potential trouble..'
