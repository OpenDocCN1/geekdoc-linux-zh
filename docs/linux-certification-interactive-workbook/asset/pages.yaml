  md: '# Appendix E: Samba Man Pages 325


    Samba NT Domain Controller functionality please subscribe to the mail- list Samba-ntdom
    available by sending email to listproc@samba.org


    +   - domain logons (G)


    If set to true, the Samba server will serve Windows 95/98 Domain logons for the
    workgroup it is in. For more details on setting up this file DOMAINS.txt in the
    Samba documentation directory docs/ shipped with the source code.


    Note that Win95/98 Domain logons are NOT the same as Windows NT Domain logons.
    NT Domains require a Primary Domain Controller (PDC) for the Domain. It is intended
    that in a future release Samba will be able to provide this functionality for
    Windows NT clients.


    Default: domain logons = no


    +   - domain master (G)


    Tell nmbd to enable WAN-wide browse list collation. Setting this option causes
    nmbd to claim a special domain specific NetBIOS name that identifies it as domain
    master browser for its given workgroup. Local browsers on broadcast-isolated subsets
    will give this nmbd their local browse lists, and ask smbd for a complete copy
    of the browse list for the whole wide area network. Browser clients will contact
    their local master browser, and will receive the domain-wide browse list, instead
    of just the list for their broadcast-isolated subnet.


    Note that Windows NT Primary Domain Controllers expect to be able to claim this
    workgroup specific special NetBIOS name that identifies them as domain master
    browsers for that workgroup by default (i.e. there is no way to prevent a Windows
    NT PDC from attempting to do this). This means that if this parameter is set and
    nmbd claims the special for a workgroup before a Windows NT PDC is able to do
    so then subnet browsing will behave strangely and may fail.


    By default ("auto") Samba will attempt to become the domain master browser only
    if it is the Primary Domain Controller.


    Default: domain master = auto


    Example: domain master = no'
  merge: -1
  pgno: 350
- img_proc: true
  md: '# Appendix E: Samba Man Pages


    +   - **domain user map (G)**


    This option allows you to specify a file containing unique mappings of individual
    NT Domain User names (in any domain) to UNIX user names. This allows NT domain
    users to be presented correctly to NT systems, despite the lack of native support
    for the NT Security model (based on VAX/VMS) in UNIX. The reader is advised to
    become familiar with the NT Domain system and its administration.


    This option is used in conjunction with ‘local group map’ and ‘**domain group
    map**’. The use of these three options is trivial and often unnecessary in the
    case where Samba is not expected to interact with any other SAM databases (whether
    local workstations or Domain Controllers).


    This option, which provides (and maintains) a one-to-one link between UNIX and
    NT users, is DIFFERENT from ‘username map’, which does NOT maintain a distinction
    between the name(s) it can map to and the name it maps.


    The map file is parsed line by line. If any line begins with a ''#'' or a '';'',
    then the line is ignored. Each line on the left should contain a single UNIX user
    name on the right, separated by a tabstop or ''=''. If either name contains spaces
    then it should be enclosed in quotes. The line can be one of the following:


    ```

    UNIXusername \\DOMAIN_NAME\\DomainUserName

    ```


    or:


    UNIXusername DomainUserName


    In the case where Samba is either EXPERIMENTAL Domain Controller or is a member
    of a domain using “**security = domain**”, the latter format can be used: the
    default Domain name is the Samba Server’s Domain name, specified by “**workgroup
    = MYGROUP**”.


    Any UNIX users that are NOT specified in this map file are assumed to be either
    Domain or Workstation Users, depending on the role of the Samba Server.


    In the case when Samba is EXPERIMENTAL Domain Controller, Samba will present ALL
    such unspecified UNIX users as its own NT Domain Users, with the same name.'
  merge: -1
  pgno: 351
- img_proc: true
  md: '# Appendix E: Samba Man Pages 327


    In the case where Samba is a member of a domain using “security = domain”, Samba
    will check the UNIX name with its Domain Controller (see “password server”) as
    if it was an NT Domain User. If the Domain Controller says that it is not, unspecified
    (unmapped) UNIX users who are also not NT Domain Users are treated as Local Users
    in the Samba Server’s local SAM database. NT Administrators will recognise these
    as Workstation Users, which are managed by running USMGR.EXE and selecting a remote
    Domain named“\WORKSTATION_NAME", or by running USMGR.EXE on a local Workstation.


    This may sound complicated, but it means that a Samba Server as either a member
    of a domain or as an EXPERIMENTAL Domain Controller will act like an NT Workstation
    (with a local SAM database) or an NT PDC (with a Domain SAM database) respectively,
    without the need for any of the map files at all. If you want fancy, however,
    you can.


    Note that adding an entry to an arbitrary NT User in an arbitrary Domain to an
    arbitrary UNIX user REQUIRES the following:

    * that the UNIX user exists on the UNIX server.

    * that the NT Domain User exists in the specified NT Domain.

    * that the UNIX Server knows about the specified Domain.


    Failure to meet any of these requirements may result in either (or both) errors
    reported in the log files or (and) incorrect or missing access rights granted
    to users.


    +   * dont descend (S)


    There are certain directories on some systems (e.g., the /proc tree under Linux)
    that are neither of interest to clients or infinitely deep (recursive). This parameter
    allows you to specify a comma-delimited list of directories that the server should
    always show as empty.


    Note that Samba can be very fussy about the exact format of the “dont descend”
    entries. For example you may need “/.proc” instead of just “/proc”. Experimentation
    is the best policy:-


    **Default:** none (i.e., all directories are OK to descend


    **Example:** dont descend = /proc,/dev'
  merge: -1
