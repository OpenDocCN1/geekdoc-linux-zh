  md: '# xxii Introduction


    of the available systems. In many cases, the PCs are used for Windows applications,
    and classroom space is sometimes at a premium. However, if the school is upgrading
    their 486, or even 386, PCs to new Pentiums, they can find new life as Linux boxes
    since Linux can run quickly with a single user on a 386 box. A 486 in this case
    would be a luxury. There are also a number of vendors Linux versions that smoothly
    run on a 486 PC with 16 megs of memory.


    +   2. Network Integrity—There is a concern that if a student can root access
    on such a system, they can perhaps compromise the network. This is because the
    root user in Linux has access to many network tools that are not present on the
    Windows PC. A student may accidentally or intentionally do something that can
    bring down the network.


    There are a number of solutions to the network security problem. The classroom
    or user area where Linux is running can easily be isolated from the rest of the
    network. A router blocks TCP/IP traffic except that meets certain criteria. It
    can block indiscriminate packets from getting and damaging the network integrity.


    An even better way of isolating the network would be to use a firewall, which
    would protect the campus network''s integrity even further. A firewall does add
    additional processing over what a router would do, so performance needs should
    be looked at also. Fortunately, Linux provides router and firewall capabilities
    either with the OS or via the Internet. Another other option would be to totally
    isolate the network used to teach network administration from the rest of the
    campus network.


    Thus, putting together a system that can be administered in an academic environment
    may require many special steps. So your mileage may vary.


    # A SHORT-TERM, NON-CREDIT TRAINING ENVIRONMENT


    Putting together a Linux training environment for a commercial or short-term,
    non-credit academic program is a lot simpler. These are classes that usually run
    for several days to a week. The systems are dedicated to the training process
    currently being done. Students either have a system of their own or share it with
    one or two other students. The boxes are reloaded with software whenever a new
    class is started. Thus, system integrity is not a major concern. Also, network
    integrity is not much of an issue, since each classroom can totally be isolated
    from the others if needed.'
  merge: -1
  pgno: 23
- img_proc: true
  md: 'Since the focus is on Linux training, any Linux servers can be put on that
    network, or they can have a separate access point or network interface card to
    other, more central, servers that may be needed. This way, everyone else can be
    isolated from that network. The students need not see any other networks. If the
    classroom is needed for a different type of class afterward, cables can easily
    be moved in a wiring closet to put the classroom on a new network. This method
    of teaching Linux is a lot simpler to manage because of its dedicated function
    of doing one thing at a time.


