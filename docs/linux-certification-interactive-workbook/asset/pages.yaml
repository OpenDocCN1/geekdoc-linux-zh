    # THE NETSTAT COMMAND


    The netstat command will return basic information about your network. The following
    results will be seen from running the netstat -nr command:


    # Kernel IP routing table


    | Destination | Gateway | Genmask | Flags | Window | irtt | Iface |

    |---|---|---|---|---|---|---||

    | 172.16.1.0 | 0.0.0.0 | 255.255.255.0 | U | 1500 | 0 | 0 | eth0 |

    | 127.0.0.0 | 0.0.0.0 | 255.0.0.0 | U | 3584 | 0 | 0 | lo |

    | 0.0.0.0 | 10.131.173.1 | 0.0.0.0 | UG | 1500 | 0 | 0 | eth0 |


    This is broken down as follows:


    +   - Destination is the name of the network to which you are sending information.
    As you get more familiar with netstat, you will see that this can help you get
    to a remote network. You will notice the default route goes through a host with
    the address 10.131.173.1.

    - Gateway is the port or network interface card that is used to pass the information
    to the destination.

    - Flags, Ref and Use refer to characteristics of the network and can be ignored
    for now.


    If your network has no access to other networks, then the default route line may
    not exist in your results. You may also see several lines for the default entry.
    Your system will try the first default route, then the second default route, and
    so on, until it exhausts the list of default routes.


    ![](img/4e4139af9b1671e6d87bfdaa638563a9_35_1.png)


    You will notice that there are three lines that begin with:


    +   - 172.16.1.0—This is the network that is set up for your Interface Card, which
    in this case is 172.16.1.1.

    - 127.0.0.1—This is the loopback address for the localhost.

    - 0.0.0.0—In the first position on the line, it indicates the entry for the default
    route. In the second position on the line, it means that there is no defined gateway,
    and the card itself is'
