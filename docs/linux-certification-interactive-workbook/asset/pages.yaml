- img_proc: true
  md: '# Appendix E: Samba Man Pages 365


    Default: password level = 0


    Example: password level = 4


    +   - password server (G)


    By specifying the name of another SMB server (such as a WinNT box) with this option,
    and using "security = domain" or "security = server" you can get Samba to do all
    its username/password validation via a remote server.


    This option sets the name of the password server to use. It must be a NetBIOS
    name, so if the machine''s NetBIOS name is different from its internet name then
    you may have to add its NetBIOS name to the lmhosts file which is stored in the
    same directory as the smb.conf file.


    The name of the password server is looked up using the parameter "name resolve-orders"
    and so may resolved by any method and order described in that parameter.


    The password server must be a machine capable of using the "LM1.2X002" protocol,
    and it must be in user level security mode.


    > NOTE: Using a password server means your UNIX box (running Samba) is only as
    secure as your password server. DO NOT CHOOSE A PASSWORD SERVER THAT YOU DON''T
    COMPLETELY TRUST.


    Never point a Samba server at itself for password serving. This will cause a loop
    and lock up your Samba server!


    The name of the password server takes the standard substitutions, but probably
    the only useful is %m, which means the Samba server will use the incoming client
    as the password server. If you use this then you trust your clients, and you restrict
    them with hosts allow!


    If the "security" parameter is set to "domain", then the list of machines in this
    option must be a list of Primary or Backup Domain controllers for the Domain,
    as the Samba is cryptographically in that domain, and will use cryptographically
    authenticated RPC calls to authenticate the user logging on. The advantage of
    using "security=domain" is that if you list several hosts in the "password server"
    option then smbd will try each in turn to find one that responds. This is useful
    in case your primary server goes down.'
  merge: -1
  pgno: 390
- img_proc: true
  md: '# 366 Appendix E: Samba Man Pages


    If the “security” parameter is set to “server”, then there are different restrictions
    that “security=domain” doesn’t suffer from:


    +   - You may list several password servers in the “password server” parameter,
    however if an smbd makes a connection to a password server, and then the password
    server fails, no more users will be able to be authenticated from it smbd. This
    is a restriction of the SMB/CIFS protocol when in “security=server” mode and cannot
    be fixed in Samba.

    - If you are using a Windows NT server as your password server then you will have
    to ensure that your users are able to login from the Samba server, as when in
    “security=server” mode the network logon will appear to come from there rather
    than from the workstation.


    See also the “security” parameter.


    **Default:** password server = <empty string>


    **Example:** password server = NT-PDC, NT-BDC1, NT-BDC2


    +   - path (S)


    This parameter specifies a directory to which the user of the service is to be
    given access. In the case of printable services, this is where print data will
    spool prior to being submitted to the host for printing.


    For a printable service offering guest access, the service should be readonly
    and the path should be world-writeable and have the sticky bit set. This is not
    mandatory of course, but you probably won’t get the results you expect if you
    do otherwise.


    Any occurrences of %u in the path will be replaced with the UNIX username that
    the client is using on this connection. Any occurrences of %m will be replaced
    by the NetBIOS name of the machine they are connecting from. These replacements
    are very useful for setting up pseudo home directories for users.


    Note that this path will be based on “root dir” if one was specified.


    **Default:** none


    **Example:** path = /home/fred'
