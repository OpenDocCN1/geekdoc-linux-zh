    fiber optic cable connected to a hub in your neighborhood. This is split into
    a maximum of twenty 3 MBPS copper connections to cable modems in the homes. The
    cable modem then provides a 1.5 MBPS ethernet connection to the home network or
    individual PC. The upload speed from the home to the Internet is 300 KBPS. This
    is the speed that you can send information out to the Internet. The cable modem
    can be either connected directly to your PC or to an ethernet hub. Both connec'
