  md: '# Appendix E: Samba Man Pages


    and "programs" folders, and their contents, are loaded and displayed on your Windows
    95/98 client.


    The share and the path must be readable by the user for the preferences and directories
    to be loaded onto the Windows 95/98 client. The share must be writeable when the
