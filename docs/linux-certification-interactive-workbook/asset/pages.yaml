  md: 'This parameter tells smbd which of codepage.XXX files to dynam-cally load on
    startup. These files, described more fully in the manual page make_smbcodepage
    (1), tell smbd how to map lower to upper case characters to provide the case insensitivity
    of filenames that Windows users expect.


    Samba currently ships with the following code page files :


    +   - Code Page 437–MS-DOS Latin US

    - Code Page 737–Windows ''95 Greek

    - Code Page 850–MS-DOS Latin 1

    - Code Page 852–MS-DOS Latin 2

    - Code Page 861–MS-DOS Icelandic

    - Code Page 932–MS-DOS Japanese SJIS

    - Code Page 936–MS-DOS Simplified Chinese

    - Code Page 949–MS-DOS Korean Hangul

    - Code Page 950–MS-DOS Traditional Chinese


    Thus this parameter may have any of the values 437, 737, 852, 852, 861, 932, 936,
    949, or 950. If you don''t find the codepage you need, read the comments in one
    of the other codepage files and the make_smb-page (1) man page and write one.
    Please remember to donate it back to the Samba user community.


    This parameter co-operates with the “valid chars” parameter in deter-mining what
    characters are valid in filenames and how capitalization is done. If you set both
    this parameter and the “valid chars” parameter the “client code page” parameter
    MUST be set before the “valid chars” parameter in the smb.conf file. The “valid
    chars” string will then augment the character settings in the “client code page”
    parameter.


    If not set, “client code page” defaults to 850.


    See also: “valid chars”


    Default: client code page = 850


