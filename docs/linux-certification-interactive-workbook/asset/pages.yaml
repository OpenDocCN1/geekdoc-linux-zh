  md: '# # ABOUT THE AUTHOR


    Everyone has a story to tell. Some tell it in person, some in pictures and some
    in words. Every person is an individual. Every story is different and every situation
    is unique. So the number of stories is infinite.


    —Joe


    # ## EDUCATION


    Joe Kaplen graduated from the University of Utah with a B.S. in physics. He also
    studied mathematics, chemistry, biology, and journalism on an undergraduate and
    graduate level. His first writing experience was in college where he served as
    science editor and reporter for the *Daily Utah Chronicle*. He started his college
    education while still in High School with college mathematics courses at Orange
    County Community College in Middletown, NY. He continued there for a year where
    he majored in Physical Science at Rensselaer Polytechnic Institute (RPI) in Troy,
    NY. From there he went to University of Utah where he graduated and did his graduate
    studies.


    He has also studied computer science at the University of Illinois at Chicago,
    College of Dupage, Joliet Junior College and a number of non-credit seminars.
    His first experience with computers was in 1967 with an IBM mainframe in college
    at RPI that did not even have a disk or tape drive, and the Operating System was
    loaded from punch cards. He is actively involved in the computer world through
    postings on various news-groups and discussion areas.


    # ## WORK EXPERIENCE


    Joe''s experience includes working in physics and computer science for Argonne
    National Labs, Fermi National Accelerator Lab, the University of Illinois at Chicago
    Physics Department, Motorola, Loyola University'
  merge: -1
