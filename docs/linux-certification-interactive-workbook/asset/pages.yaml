    # SETUP.EXE AND 16 BIT PROGRAMS


    Running 16 bit programs from Windows NT on a Samba mapped drive


    The Windows NT redirector has a bug when running against a Samba or Windows 95
    mapped drive and attempting to run a 16 bit executable.


    The problem occurs when the pathname to a 16 bit executable contains an 8.3 filename
    compliant directory component, Windows NT will fail to load the program and complain
    it cannot find the path to the program.


    It can be verified that this is a bug in Windows NT and not Samba as the same
    problem can be reproduced exactly when attempting to run the same program with
    the same pathname from a Windows 95 server (ie. the problem still exists even
    with no Samba server involved).


    Microsoft have been made aware of this problem, it is unknown if they regard it
    as serious enough to provide a fix for this.


    One of the reasons this problem is reported frequently is that InstallShield setup.exe
    executables are frequently written as 16 bit programs, and so hit this problem.'
