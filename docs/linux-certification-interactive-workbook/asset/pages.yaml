    +   - deadtime (G)


    The value of the parameter (a decimal integer) represents the number of minutes
    of inactivity before a connection is considered dead, and it is disconnected.
    The deadtime takes effect if the number of open files is zero.


    This is useful to stop a server’s resources being exhausted by a large number
    of inactive connections.


    Most clients have an auto-reconnect feature when a connection is broken in most
    cases this parameter should be transparent to users.


    Using this parameter with a timeout of a few minutes is recommended for most systems.


    A deadtime of zero indicates that no auto-disconnection should be performed.


