  md: '# 320 Appendix E: Samba Man Pages


    +   - deny hosts (S)


    The opposite of ‘allow hosts’—hosts listed here are NOT permitted access unless
    the specific services have their own lists to override this one. Where the lists
    conflict, the ‘allow’ list takes precedence.


    **Default:** none (i.e., no hosts specifically excluded)


    **Example:** deny hosts = 150.203.4.badhost.mynet.edu.au


    +   - dfree command (G)


    The dfree command should only be used on systems where a problem occurs with the
    internal disk space calculations. This has been known to happen with Ultrix, but
    may occur with other operating systems. The symptom that was seen was an error
    of “Abort Retry Ignore” at the end of each directory listing.


    This setting allows the replacement of the internal routines to calculate the
    total disk space and amount available with an external routine. The example below
    gives a possible script that might fulfill this function.


    The external program will be passed a single parameter indicating the directory
    in the filesystem being queried. This will typically consist of the string ....
    The script should return two integers in ascii. The first should be the total
    disk space in blocks, and the second should be the number of available blocks.
    An optional third return value can give the block size in bytes. The default blocksize
    is 1024 bytes.


    Note: Your script should NOT be setuid or setgid and should be owned by (and writable
    only by) root!


    **Default:** By default internal routines for determining the disk capacity and
    remaining space will be used.


    **Example:** dfree command = /usr/local/samba/bin/dfree


    Where the script dfree (which must be made executable) could be:


    ```

    #!/bin/sh

    df $1 | tail -1 | awk ''{print $2" "$4}''

    ```


    or perhaps (on Sys V based systems):'
  merge: -1
