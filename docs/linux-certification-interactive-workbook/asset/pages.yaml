    # THE IFCONFIG COMMAND


    The ifconfig command returns the status of the network interfaces. By using the
    -a option, you can find the status all the network interfaces.


    FOR EXAMPLE:


    ```

    # ifconfig -a

    lo0: flags=849<UP,LOOPBACK,RUNNING,MULTICAST> mtu 8232 inet 127.0.0.1 netmask
    ff000000

    ```


    ```

    eth0 Link encap=Ethernet HWaddr 00:AA:00:27:33:38

    inet addr:172.16.1.1 Bcast:172.16.1.255

    Mask:255.255.255 UP BROADCAST RUNNING MULTICAST

    MTU:1500 Metric RX packets:133005 errors:0 dropped:0

    overruns:0 frame TX packets:3572 errors:0 dropped:0

    overruns:0 carrier collisions Interrupt:10 Base

    address:0x0300

    ```


    The ifconfig command returns the information about the ports. Some of the items
    above will be discussed later or can be looked up on your own. If you look at
    the above display, the most important things to look at are:


    +   - lo0, eth0—These are the network interfaces that have TCP/IP activated for
    them.

    - UP—This means that the interface is up. If it is down, then it is DOWN.

    - BROADCAST—The broadcast address is enabled.

    - inet addr—This is the Internet address; for eth0 is 172.16.1.1.

    - Mask—This was described earlier; for eth0 is 255.255.255.0.

    - HWaddr—This is the hardware address of the network interface. Every NIC has
    a unique hardware address assigned to it by the manufacturer. For this card hardware
    address is 00:AA:00:27:33:38.

    - Interrupt is the Interrupt Request value and is commonly called the IRQ. for
    eth0 the IRQ is 10.

    - Base address is the base address of the hardware device and is the address that
    the computer uses to talk to the hardware for basic communications. For eth0 it
    is 0x300.'
