    # NETWORK CABLING


    There are several kinds of cabling that you may be using in your home for connecting
    your computer to other computers. Based on the type of connectors they use, they
    are:


    +   **RJ11**—This is the common type of cable used to connect your modem to your
    phone connection. The type of cable that is usually used is called Category 3,
    or a Cat 3. This cabling is not very good for connecting a computer to a network,
    but works well enough for your modem. Intel and several manufacturers have announced
    networks that can run on Cat 3 cable. In any case, you can only run a max of 10
    Mbps on this type of wiring, if you are lucky.


    +   **RJ45**—This is used for cabling commonly referred to as UTP. This is for
    Unshielded Twisted Pair, which is also known as BaseT. The actual cabling type
    can be Cat 3 or Cat 5, though Cat 3 is typically used for phones and is very poor
    for networking. The connector looks very much like the connector and cable that
    you would use for your phone, but it is specially designed for networks. This
    requires that you purchase an ethernet hub. In the ethernet hub, every PC has
    a separate socket to plug its ethernet cable into. It is more reliable than thin
    ethernet.


    +   **Thin ethernet**—This looks like the same type of round cabling that you
    would use for your TV connection. Only the electrical characteristics and the
    connectors are different. This is also known as Base2. This type of cabling is
    losing popularity, but it is the cheapest and easiest way to set up a network.
    It does not require a hub to plug into. Each PC talks to every other PC on the
    network by using this one cable. However, if'
  merge: -1
  pgno: 252
- img_proc: true
  md: '# 228 Appendix C: Building Your Linux Home Network


    you have a bad cable or a bad connection on a thin ethernet network, you can bring
    down the whole network.


    +   Other types—Another type of ethernet connection is called thick ethernet or
    10Base5. This is not very common anymore and requires the cable actually has a
    hole punched into it, or tapped, to connect a transceiver. This uses an AUI cable
    to connect between the system and the network.


    Ethernet cabling does not require an electrician in most communities to run the
    cables because the power it carries is insignificant. There are many electricians
    and electrical companies that specialize in running data cables for networking.
    You might want to consider one of these electricians if you are going to be doing
    extensive wiring, building a new house, or if you just want to make sure everything
    is done right and neatly.


    # NETWORKING EQUIPMENT


    When you create your home network, you will need several pieces of networking
    hardware. The hardware will depend on the type of cabling you have chosen. Once
