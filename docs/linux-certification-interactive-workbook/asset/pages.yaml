    - username This specifies the username for all of the root options to operate
    on. Only root can specify this parameter as only root has the permission needed
    to modify attributes directly in the local smbpasswd file.


    # NOTES


    Since smbpasswd works in client-server mode communicating with a local smbd for
    a non-root user then the smbd daemon must be running for this to work. A common
    problem is to add a restriction to the hosts that may access the smbd running
    on the local machine by specifying "allow hosts" or "deny hosts" entry in the
    smb.conf file and neglecting to allow "localhost" to the smbd.


    In addition, the smbpasswd command is only useful if Samba has been set up to
    use encrypted passwords. See the file ENCRYPTION.txt in the docs directory for
    details on how to do this.


