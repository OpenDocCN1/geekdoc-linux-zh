  md: '# Lab 1.1: The Current System TCP/IP Values


    The number 0.0.0.0 becomes:


    00000000.00000000.00000000 to 255.255.255.255.


    The netmask will vary from 0.0.0.0 to 255.255.255.255.


    By default, each network class has a standard netmask. In Table 1.4, the 1s represent
    the space used for the network address. The 0s represent the space used for the
    host address. The values are summarized in Table 1.4.


    # SUBNET


    It is possible to take some of the digits that are used for the host address and
    create what is called a subnet. This allows you to do routing to create many smaller
    networks by splitting up the address range that is assigned to host addresses.
    In Table 1.4, every 0 that is changed to a 1 is used to create a new network and
    subnet.


    # FOR EXAMPLE:


    An example of setting up a subnet mask for a class A is:


    ```

    11111111.11111111.00000000.00000000

    ```


    ```

    11111111.11111111.10000000.00000000 or 255.255.128.0

    ```


    This is 2^9, or 512, subnetworks in a class A network. But the following netmask
    is not proper because there is a 1 between the 0s:


    ```

    11111111.11111111.00000001.00000000 or 255.255.1.0

    ```


    # Table 1.4 ■ Default Binary Representation of the Netmasks


    | Class | Netmask | Netmask in binary format |

    |---|---|--|

    | A | 255.0.0.0 | 11111111.00000000.00000000.00000000 |

    | B | 255.255.0.0 | 11111111.11111111.00000000.00000000 |

    | C | 255.255.255.0 | 11111111.11111111.11111111.00000000 |'
