  md: '# Appendix G: Nameserver Documentation 493


    # 4. A simple domain.


    How to set up your own domain.


    # 4.1. But first some dry theory


    Before we really start this section I''m going to serve you some theory on and
    an example of how DNS works. And you''re going to read it because it''s good for
    you. If you don''t want to you should at least skim it you very quickly. Stop
    skimming when you get to what should go in your named conf file.


    DNS is a hierarchical, tree structured, system. The top is written ''.'' and pronounced
    ''root''. Under there are a number of Top Level Domains (TLDS), the best known
    ones are ORG, COM, EDU and NET, but there are many more. Just like a tree it has
    a root and it branches out. If you have any science background you will recognize
    DNS as a search tree, and you will be able to find nodes, leaf nodes and edges.


    When looking for a machine the query proceeds recursively into the hierarchy starting
    at the top. If you want to find out the address of prep.ai.mit edu your name server
    that serves edu. It asks a . server (it already knows the . servers, that''s what
    the root.hints file is for), the . server gives a list of edu servers:


    ```

    $ nslookup

    Default Server: localhost

    Address: 127.0.0.1

    ```


    Start asking a root server:


    ```

    > server c.root-servers.net

    Default Server: c.root-servers.net

    Address: 192.33.4.12

    ```


    Set the Query type to NS (name server records):


    +   - set q=ns


    Ask about edu:


    +   - edu.


    The trailing . here is significant, it tells nslookup we''re asking that edu is
    right under . (and not under any of our search domains, it speeds the search).'
