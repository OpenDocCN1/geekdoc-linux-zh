    as a senior systems management integration professional. He has been working with
    UNIX since 1980 and as a UNIX administrator since 1984.


    # Teaching Experience


    Joe has been teaching part-time at the College of Dupage in Glen Ellyn, Illinois,
    for over 14 years. His experience includes teaching classes such as Introduction
    to Computers, Program Logic and Design, Pascal, FORTRAN, Basic, Introduction to
    UNIX, and Advanced UNIX. He has been teaching Advanced UNIX for seven years. He
    is always looking for new, easier, and better ways to teach computer science.


    Like his previous book, UNIX System Administrator''s Interactive Workbook, this
    book is based on his experience in teaching those classes and is the outcome of
    his constant search for a good textbook to teach UNIX administration and networking.
    His first book, published by Prentice Hall (1999), was written because he could
    not find a good text. This text is a continuation of the concepts covered in the
    first text. His other published works include primary authorship on the IBM Redbook
    series Netfinity and TurboLinux Integration Guide, and contributing authorship
    to portions of the other IBM Redbook Netenity Integration Guides on Red-Hat, Caldera,
    and Suse Linux.


    # RESEARCH INTERESTS


    Joe has been interested in a number of topics related to learning computers. Some
