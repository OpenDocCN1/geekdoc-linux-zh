    For UNIXs that support kernel based oplplocks (currently only IRIX but hopefully
    also Linux and FreeBSD soon) this parameter allows the use of them to be turned
    on or off.


    Kernel oplocks allows Samba oplplocks to be broken whenever a local UNIX process
    or NFS operation accesses a file that smbd has oplocked. This allows complete
    data consistency between SMB/CIFS, NFS and local file access (and is a very cool
    feature :-).


    This parameter defaults to “On” on systems that support the, and “off” on systems
    that do not. You should never need to touch this parameter.


