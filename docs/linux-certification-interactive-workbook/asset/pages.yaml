  md: '# 382 Appendix E: Samba Man Pages


    Note that it can be *very* confusing in share-level security as to which UNIX
    username will eventually be used in granting access.


    See also the section "NOTE ABOUT USERNAME/PASS-WORD VALIDATION".


    +   * "security=user"


    This is the default security setting in Samba2.0. With user-level security a client
    must first "log-on" with a valid username and password (which may be mapped using
    the "username map" parameter). Encrypted passwords (see the "encrypted passwords"
    parameter) can also be used in this security mode. Parameters such as "user" and
    "guest only", are set then applied and may change the UNIX user to use on this
    connection, but only after the user has been successfully authenticated.


    Note that the name of the resource being requested is *not* sent to the server
    until the server has successfully authenticated the client. This is why guest
    shares do not work in level security security without allowing the server to map
    unknown users into the "guest account". See the "map to guest" parameter for details
    on doing this.


    See also the section "NOTE ABOUT USERNAME/PASS-WORD VALIDATION".


    +   * "security=server"


    In this mode Samba will try to validate the username/password by passing it to
    another SMB server, such as an NT box. If it fails it will revert to "security
    = user", but note that if encrypted passwords have been negotiated then Samba
    cannot revert back to checking the UNIX password file, it must have a valid smbpasswd
    file to check users against. See the details in the docs/ directory ENCRYPTION.txt
    for how to set this up.


    Note that from the clients point of view "security=server" is the same as "security=user".
    It only affects how the server deals with the authentication, it does not in any
    way affect what the client sees.'
