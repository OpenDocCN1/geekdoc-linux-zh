    the broadband signal to an ethernet signal. The modem also controls access to
    the user''s home network and provides a number of features needed by the cable
    company, such as filtering of packets, access control, and information gathering.


    Figure C.3 shows a typical network configuration for a home connection to a broadband
    network.


