    same time you should try measuring ping times while using FTP to transfer files.


    # 6. Security and NFS


    I am by no means a computer expert. But I do have a little advice for the security
    conscious. But warned: This is by no means a complete list of NFS related problems
    and if you think you''re safe once you''re read and implemented all this I have
    a bridge I want to sell.


    This section is probably of no concern if you are on a closed network where you
    trust all the users, and no-one you don''t trust get access to machines on the
    network. I.e., there should be no way to dial into the network, and it in no way
    to be connected to other networks where you don''t everyone using it as well as
    the security. Do you think I sound paranoid? I''m not at all paranoid. This is
    just security advice. And remember, the things I say here is just the start of
    it. A secure site needs a diligent and'
