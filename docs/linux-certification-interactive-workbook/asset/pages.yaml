  md: '# LAB 1.2


    # ACCESSING OTHER TCP/IP HOSTS


    LAB OBJECTIVES

    After this Lab, you will be able to use:

    * ping

    * traceroute

    * nslookup


    This Lab discusses ping, traceroute, nslookup, and other commands to determine
    your access to other TCP/IP hosts. You will need access to a network that is already
    in existence. You will learn how to determine the values that were discussed in
    the introductory network discussion in Lab 1.1.


    # THE PING COMMAND can be used to test whether you have a route to, and can access,
    a host. It does not show the actual network route, which is for the purpose of
    traceroute. You can use the command with various options, so you just send one
    packet and see if it is returned. You can also send packets in fixed intervals
    of time, such as every five seconds, and test the average length of time for a
    packet to travel to the destination. Different versions of UNIX will have different
    options set as the default. Some will ping once and some will ping continuously.


    The ping command has the format:


    ```

    ping -options destination_host

    ```'
  merge: -1
  pgno: 43
- img_proc: true
  md: '# Lab 1.2: Accessing Other TCP/IP Hosts


    EXAMPLE: The -I option followed by a number, for example 5, says to ping on a
    continual basis with each ping separated by 5 seconds. You can vary the rate by
    changing the number. In Linux, by default, ping will continu-ously ping approximately
    every second.


    The destination_host in this example is either the IP address or host-name of
    a destination host.


    # THE TRACEROUT COMMAND


    The traceroute command can be used to show the actual network route. When you
    send information from a source location to a destination, the packets of computer
    data will move from one system or router to another, until it reaches its destination.
    You can think of it as hopping like a rabbit. In fact, the term hop tells you
    how many locations the data will go through.


    The traceroute command will give you the time that it takes to get to each location.
    The time to reach the destination will be a lot longer than it takes for the ping
    command to reach the destination. This is because it expects a response from each
    location along the way, and it will also try to do a name resolution on each location
    instead of just an IP address. You can think of it as doing a ping from each location
    along the way.


    You can see a representation of the process in Figure 1.1.


    # Figure 1.1 A sample TCP/IP network


    ![](img/4e4139af9b1671e6d87bfdaa638563a9_44_0.png)'
  merge: -1
