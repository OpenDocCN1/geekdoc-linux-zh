  md: '# Introduction


    # The Whole Truth


    Sometimes due to the Interactive Workbook format, some information is simplified
    for learning''s sake. When that''s the case, we have used this sidebar element
    to alert you that “it’s not exactly as simple as that,” and to offer a more detailed
    explanation.


    teaches actual hands-on practices and procedures—it''s a practical guide to getting
    your hands dirty. Another book will get into the nitty-gritty of all the technical
    details that cannot possibly be covered here. That said, you will find that the
    discovery method employed by the Linux Network Administrator’s Interactive Workbook
    will surely enlighten and educate you unlike any other resource. However or comprehensive
    another resource might be, the discovery method is a proven technique that is
    employed in classrooms and training centers around the world. This hands-on approach
    is the cornerstone of the International Workbook series, and we are sure that
    you will find it an engaging and productive way to learn. There is no better way!


    # NOTES TO THE INSTRUCTOR


    > The challenge for the instructor is to teach in the quickest and most effective
    way. Different teachers have different approaches, but each must work within constraints
    that are often outside of their control.


    The teacher of computer science topics is often faced with constraints caused
    by budget, security, time, or politics. Teaching network administration is not
    one of those traditional topics that come immediately to mind when we think of
    an academic environment. Yet there are many colleges, community colleges, technical
    institutes, corporate and commercial training environments where network administration
    is a very important part of the curriculum.


    There are a number of different training environments that you can be involved
    in. They fall into two basic categories, with variations in each:


    +   - An academic credit course—This usually runs for a full term, assigned a
    number of credits, and the student is given a grade.


    +   - A commercial, corporate, or non-credit training program—This is short-term,
    usually several days to a week, and'
  merge: -1
  pgno: 21
- img_proc: true
  md: '# Introduction


    does not involve college credit or grades, and the students

    whole attention is focused on the class.


    Each one of these approaches has its own particular concerns.


    # AN ACADEMIC CREDIT ENVIRONMENT


    This is a college, university or community college where the class is set up

    so that college credit is granted to students taking the class. These classes

    typically run for a full term or more. Their environment usually has PCs set

    to access a network. Only the fortunate students will actually have ac-\cess to
    dedicated Linux boxes. The PCs are typically Microsoft Windows-

    based PCs. Sometimes they don''t have a hard drive at all, but boot entirely

    off the network! since However, since Windows software becomes more de-

    manding, the PCs often do have disk drives.


    The concerns in such an environment focus around two issues:


    +   1. Computer Integrity—In such an environment there are many

    concerns about security. Students oftentimes download soft-ware with viruses.
    Such PCs oftimes get other software acci-dentally or intentionally loaded onto
    them. Therefore

    anything, such as a live, full-blown Linux operating system

    a PC that the students can fully administer, gives nightmares to

    the administrators of the network and PCs. Even doing a dual

    boot system still leaves the PC open to abuse.

    Some solutions include:

    * Running Linux from a CD-ROM, as is possible with

    Yggdrasil Linux, which will boot off a diskette first. SuSE

    Linux and several others have bootable CD-ROMs

    * Running Linux from diskettes. There are a number of mini-mal versions of Linux
    that can be run from diskette. the enclosed CD-ROM includes a number of versions
    that

    can install to and boot.

    * Putting two hard drives on a system and making one write-protected via hardware
    configuration or jumpers, or the

    other writable and easy to rebuild via the network and a

    boot disk. The write-protected disk can contain important

    information and programs that do not require write access.

    You could also use a second drive to contain an image of the first drive that
