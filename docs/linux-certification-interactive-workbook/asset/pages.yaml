    # 4.2. Our own domain


    Now to define our own domain. We''re going to make the domain linux.bogus and
    define machines in it. I use a totally bogus domain name to make sure we disturb
    no-one Out There.


    One more thing before we start: Not all characters are allowed in host names.
    We are restricted to the characters of the English alphabet: a-z, and numbers:
    0-9 and the character ''-'' (dash). Keep to those characters. Upper and lower-case
    characters are the same for DNS, pat.uo.no is identical to Pat.Uio.No.


    We''ve already started this part with this line in named.conf:


    ```

    zone "0.0.127.in-addr.arpa" (

    type master;

    file "pz/127.0.0";

    ;

    ```


    Please note the lack of ''.'' at the end of in this file. This says that now we
    will define the zone 0.0.127.in-addr.arpa, that we''re the master server for it
    and that it is stored in a file called pz/127.0.0. We''ve already started this
    file, it reads:'
