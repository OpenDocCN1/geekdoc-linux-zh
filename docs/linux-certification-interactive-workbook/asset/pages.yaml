  md: '# Appendix G: Nameserver Documentation


    4. I want to set up DNS on a (closed) intranet. What do I do?


    You drop the root.hints file and just do zone files.  That also means you don''t
    have to get new hint files all the time.


    5. How do I set up a secondary (slave) name server?


    If the primary/master server has address 127.0.0.1 you put a line like this in
    the named.conf file of your secondary:


    ```

    zone "linux.bogus" (

    type slave;

    file "sz/linux.bogus";nmasters ( 127.0.0.1; );

    );

    ```


    You may list several alternate master servers the zone can be copied from inside
    the masters list, separated by '';'' (semicolon).


