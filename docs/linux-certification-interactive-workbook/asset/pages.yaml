  md: '# SMBPASSWD (8)


    SAMBA


    23 OCT 1998


    NAME


    smbpasswd—change a users SMB password


    # SYNOPSIS


    smbpasswd [-a] [-d] [-e] [-D debug level] [-n] [-r remote_machine] [-R name resolve
    order] [-m] [-j DOMAIN] [-U username] [-h] [-s] user-name


    # DESCRIPTION


    This program is part of the Samba suite.


    The smbpasswd program has several different functions, depending on whether it
    is run by the root user or not. When run as a normal user it allows the user to
    change the password used for their SMB sessions on any machines that store SMB
    passwords.


    By default (when run with no arguments) it will attempt to change the current
    users SMB password on the local machine. This is similar to the way the password
    (1) program works. smbpasswd differs from how the password program works in that
    it is not setuid root work but in a client-server mode and communicates with a
    locally running smbd. As a consequence in order for this to succeed the smbd daemon
    must be running on the local machine. On a UNIX machine encrypted SMB passwords
    are usually stored in the smbpasswd (5) file.


    When run by an ordinary user with no options. smbpasswd will prompt them for their
    old smb password and ask them for their new password twice, to ensure that the
    new password was typed correctly. No passwords will be echoed on the screen whilst
    being typed. If you have a blank smb password (specified by the string "NO PASSWORD"
    in the'
  merge: -1
  pgno: 460
- img_proc: true
  md: '# Appendix E: Samba Man Pages


    smbpasswd file) then press the <Enter> key when asked for your old password.


    smbpasswd can also be used by a normal user to change their SMB password on remote
    machines, such as Windows NT Primary Domain Controllers. Use the (-r) and -U options
    below.


    When run by root, smbpasswd allows new users to be added and deleted in the smbpasswd
    file, as well as allows changes to the attributes of the user in this file to
    be made. When run by root, smbpasswd accesses the local smbpasswd file directly,
    thus enabling changes to be made if smbd is not running.


    # OPTIONS


    +   -a This option specifies that the username following should be added to the
    local smbpasswd file, with the new password typed (type <Enter> for the old password).
    This option is ignored if the username following already exists in the smbpasswd
    file and it is treated like a regular change password command. Note that the user
    to be added must already exist in the system password file (usually /etc/passwd)
    else the request to add the user will fail.


    This option is only available when running smbpasswd as root.


    If the smbpasswd file is in the ''old'' format (pre-Samba 2.0 format) there is
    no space in the users password entry to write this information and so the user
    is disabled by writing ''X'' characters into the password space in the smbpasswd
    file. See smbpasswd (5) for details on the ''old'' and new password file formats.


    This option is only available when running smbpasswd as root.


    +   -e This option specifies that the username following should be enabled in
    the local smbpasswd file, if the account was previously disabled. If the account
    was not disabled this option has no effect. Once the account is enabled then the
    user will be able to authenticate via SMB once again.'
  merge: -1
  pgno: 461
- img_proc: true
  md: '# Appendix E: Samba Man Pages 437


    The smbpasswd file is in the ''old'' format then smbpasswd will prompt for a new
    password for this user, otherwise the account will be enabled by removing the
    ''D'' flag from account control space in the smbpasswd file. See smbpasswd (5)
    for details on the ''old'' and new password file formats.


    This option is only available when running smbpasswd as root.


    +   - **D debuglevel** debuglevel is an integer from 0 to 10. The default value
    if this parameter is not specified is zero.


    The higher this value, the more detail will be logged to the log files about the
    activities of smbpasswd. At level 0, only critical errors and serious warnings
    will be logged.


    Levels above 1 will generate considerable amounts of log data, and should only
    be used when investigating a problem. Levels above 3 are designed for use only
    by developers and generate HUGE amounts of log data, most of which is extremely
    cryptic.


    +   - **n** This option specifies that the username following have their password
    set to null (i.e. a blank password) in the local smbpasswd file. This is done
    by writing the string "NO PASSWORD" as the first part of the first password stored
    in the smbpasswd file.


    Note to allow users to logon to a Samba server once the password has been set
    to "NO PASSWORD" in the smbpasswd file the administrator must set the following
    parameter in the [global] section of the smb.conf file:


    null passwords = yes


    This option is only available when running smbpasswd as root.


    +   - **r remote machine name** This option allows a user to specify what machine
    they wish to change their password on. Without this parameter smbpasswd defaults
    to the local host. The "remote machine name" is the NetBIOS name of the SMB/CIFS
    server to connect to attempt the password change. This name is resolved into an
    IP address using the standard name resolution mechanism in all programs of the
    Samba suite. See the **R name resolve order** parameter for details on changing
    this resolving mechanism.'
