  md: '# 226 Appendix C: Building Your Linux Home Network


    PCs. This can save a lot of space and money and can allow you to use a bigger
    monitor than you might otherwise use.


    If you have a spare room, you can put together a more extensive network or spread
    things out and have individual monitors for each PC.


    # ELECTRICAL NEEDS


    You need to be sure that you have adequate electric power to cover your new systems.
    It is possible to overload your circuits and cause the electric breaker to trip
    and disconnect the power to your PCs. This might cause damage to the hardware
    because of the sudden shutdown of the power. There are electrical devices such
    as transformers and capacitors that can feed back to the circuit once the breaker
    flips off. An even worse scenario would be where the breaker does not trip and
    the main breaker will get tripped, turnung off power to your whole house.


    If you are going to add more than a few PCs, you will want to have an electrician
    examine your electrical needs. You may want to increase the number of circuits
    to handle the increase in your power needs. To keep your costs down, you might
    want to put your PCs in several rooms that are on separate electrical circuits.
    This will keep the electrical lower and will help protect your PCs in case one
    circuit gets overloaded and trip the breaker. You will also want to put your systems
    close to the main breaker, so that the electrician can easily and cheaply run
    new circuits.


    You should also examine whether the power coming into the home needs to be increased.
    This is measured by the amount of Amps in your electrical service. Many homes
    have a 100 Amp service. Newer homes will typically run a 200 Amp service. By examining
    your breaker box and looking at the main breaker, you can determine if it has
    100 or 200 Amp service. Increasing your electric service may also require running
    new lines from the electric companies'' power transformer or digging and running
    new lines underground, however, many are already able to handle an increase to
    a 200 Amp service from 100 Amp service because the cabling that was installed
    is a lot heavier than needed. You will need to consult your electrician or call
    your electric company to determine whether your cables will handle the new power
    load.


    Speaking from personal experience, fixing the power problems closer to the power
    source. This then becomes a fire hazard. Also, when you use numerous power strips
    that are'
