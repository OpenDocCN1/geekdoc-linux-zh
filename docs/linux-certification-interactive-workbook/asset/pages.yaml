- img_proc: true
  md: '# 350 Appendix E: Samba Man Pages


    Example: mangled map = (*;1 *)


    +   - mangled names controls non-DOS names under UNIX should be mapped to DOS-compatible
    names ("mangled") and made visible, or whether non-DOS names should simply be
    ignored.


    See the section on "NAME MANGLING" for details on how to control the mangling
    process.


    If mangling is used then the mangling algorithm is as follows:


    +   - The first (up to) five alphanumeric characters before the rightmost of the
    filename are preserved, forced to upper case, and appear as the first (up to)
    five characters of the mangled name.

    - A tilde "" is appended to the first part of the mangled name, followed by a
    two-character unique sequence, based on the original root name (i.e., the original
    filename minus its final extension). The final extension is included in the hash
    calculation only if it contains any upper case characters or is longer than three
    characters.

    - Note that the character to use may be specified using the "mangling char" option,
    if you don''t like ''-\''.

    - The first three alphanumeric characters of the final extension are preserved,
    forced to upper case and appear as the extension of the mangled name. The final
    extension is defined as part of the original filename after the rightmost dot.
    If there are no dots in the filename, the mangled name will have extension (except
    in the case of "hidden files"—see below).

    - Files whose UNIX name begins with a DOS hidden files. The mangled name will
    be created for other filenames, but with the leading dot removed and "___" as
    its extension regardless of actual original extension (that''s three underscores).


    The two-digit hash value consists of upper case alphanumeric characters.


    This algorithm can cause name collisions only if files in a directory share the
    same first five alphanumeric characters. The probability of such a clash is 1/1300.'
  merge: -1
