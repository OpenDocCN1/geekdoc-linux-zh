  md: '# Appendix D: Samba Documentation 245


    # CRLF-LF CONVERSIONS


    We get many requests for CRLF/LF format conversion handling by samba. The problem
    is that there is no clean way to determine which files should be converted and
    which MUST not be.


    Since Unix and DOS/Windows uses all like .txt to represent a file containing ASCII
    text we can not reliably use the file extension. The same applies to the .doc
    extension.


    Samba operates around the premise that we should leave all files unchanged. By
    not implementing CRLF/LF conversions we can not be guilty of damaging anyone''s
    files.


    When someone comes along with a sound implementation that guarantees file integrity
    we will jump at the opportunity to implement this feature Until such time there
    is no prospect for action on this topic.


    # CLOSED OFF 1.9.18


    Thank you for reporting your difficulties with samba-1.9.18 series code. We regret
    to advise that all work on the 1.9.18 code tree has been closed with the release
    of samba-1.9.18p10.


    All development efforts are now being focussed on stabilizing samba-2.0.0 so it
    can go into release to stable code as soon as possible.


    If you could download the most recent beta release and report back any difficulties
    you may have we will do our best to close them out before the stable release.


    We will still fix major bugs and security holes in 1.9.18p10, but minor bugs will
    be fixed if the problem still exists in the 2.0 tree.


    For information about accessing the latest CVS source code please refer to http://samba.org/cvs.html


    # COULD''T OPEN STATUS FILE STATUS..LCK


    If you run smbstatus before anyone has connected to your new Samba installation
    then you may get the error:


    ```

    Couldn''t open status file

    /var/lock/samba/STATUS..LCK

    ```'
