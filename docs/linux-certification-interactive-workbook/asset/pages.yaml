  md: '# 358 Appendix E: Samba Man Pages


    +   - lmhosts: Lookup an IP address in the Samba lmhosts file.

    - host: Do a standard host name to IP address resolution, using the system /etc/hosts,
    NIS, or DNS lookups. This method of name resolution is operating system depended
    for instance on IRIX or Solaris this may be controlled by the /etc/nswitch.conf
    file.

    - wins: Query a name with the IP address listed in the wins server parameter.
    If no W server has been specified this method will be ignored.

    - bcast: Do a broadcast on each of the known local interfaces listed in the interfaces
    parameter. This is the least reliable of the name resolution methods as it depends
    on the target host being on a locally connected subnet.


    Default: name resolve order = lmhosts hosts wins bcast


    Example: name resolve order = lmhosts bcast host


    This will cause the local lmhosts file to be examined first, followed by a broadcast
    attempt, followed by a normal system hostname lookup.


