- img_proc: true
  md: '# What is SMB?


    SMB, which stands for Server Message Block, is a protocol for sharing files, printers,
    serial ports, and communications abstractions such as named pipes and mail slots
    between computers.


    The earliest document I have on the SMB protocol is IBM document from 1985. It
    is a copy of an IBM Personal Computer Seminar Proceedings from May 1985. It contains
    the IBM PC Network SMB Protocol. The next document I have access to is Microsoft/Intel
    NetBIOS-FILE SHARING PROTOCOL from 1987. The protocol was subsequently developed
    further by Microsoft and others. Many of the documents that define the SMB protocol(s)
    are available at ftp.microsoft.com in the SMB documentation area.


    SMB is a client server, request-response protocol. The diagram to the left illustrates
    the way in which SMB works. The only exception to the request-response nature
    of SMB (that is, when the client requests and the server sends back responses)
    is when the client has requested opportunistic locks (oplocks) and the server
    subsequently has to break an already granted opock because another client has
    requested a file open with a mode that is incompatible with the granted opock.
    In this case, the server sends an unsolicited message to the client signalling
    the opock break.


    Servers make file systems and other resources (printers, mailslots, named pipes,
    APIs) available to clients on the network. Client computers may have their own
    hard disks, but they also want access to the shared file systems and printers
    on the servers.


    Clients connect to servers using TCP/IP (actually NetBIOS over TCP/IP as specified
    in RFC1001 and RFC1002), NetBEUI or IPX/SPX. Once they have established a connection,
    clients can then send commands (SMBs) to the server that allow them to access
    shares, open files, read and write files, and generally do all the sort of things
    that you want to do with a file system. However, in the case of SMB, these things
    are done over the network.


    As mentioned, SMB can run over multiple protocols. The following diagram shows:


    SMB can be used over TCP/IP, NetBEUI and IPX/SPX. If TCP/IP or NetBEUI are in
    use, the NetBIOS API is being used.'
  merge: -1
  pgno: 301
- img_proc: true
  md: '# Appendix D: Samba Documentation 277


    NetBIOS over TCP/IP seems to be referred by many names. Microsoft refers to it
    as NBT in some places and NetBT in others (specifically in their Windows NT documentation
    and in the Windows NT registry). Others refer to it as RFCCNB. NetBEUI is sometimes
    referred to as NBF (NetBIOS Frame Format?) by Microsoft.


    # NetBIOS Names


    If SMB is used over TCP/IP or NetBEUI, then NetBIOS names must be used in a number
    of cases. NetBIOS names are up to 15 characters long, and are usually the name
    of the computer that is running NetBIOS. Microsoft, and some other implementors,
    insist that NetBIOS names be in upper case, especially when presented to servers
    as the CALLED NAME.


    # SMB Protocol Variants


    Since the inception of SMB, many protocol variants have been developed to handle
    the increasing complexity of the environments that it has been employed in.


    The actual protocol variant client and server will use is negotiated using the
    negprot SMB which must be the first SMB sent on a connection.


    The first protocol variant was the Core Protocol, known to SMB implementations
    as PC NETWORK PROGRAM 1.0. It could handle a fairly basic set of operations that
    included:


    +   connecting to and disconnecting from file and print shares


    opening and closing files


    opening and closing print files


    reading and writing files


    creating and deleting files and directories


    searching directories


    getting and setting file attributes


    locking and unlocking byte ranges in files


    Subsequent variants were introduced as more functionality was needed. Some of
    these variants and the related version of LAN Manager are:'
