  md: '# Appendix G: Nameserver Documentation


    Finally, there is HOWTO information about this at Ask Mr. DNS at http://www.acmebw.com/askmrdns/#linux-ns.
    It is about bind 4 though, so you have to adapt what he says to bind 8.


    7. Where does the caching name server store its cache? Is there any way I can
    control the size of the cache?


    The cache is completely stored in memory, it is not written to disk at any time.
    Every time you kill named the cache is lost. The cache is not controllable in
    any way. named manages according to some simple rules and that it is. You cannot
    control the cache or the cache size in any way for any reason. If you want to
    can "fix" this by hacking named. This is however recommended.


    8. Does named save the cache between restarts? Can I make it save? No, named does
    not save the cache when it dies. That means the cache must be built anew each
    time you kill and restart named. There is no way to make named save the cache
    in a file. If you want to can "fix" this by hacking named. This is however recommended.


    9. How can I get a domian? I want to set up my own domain called (for example)
    linux-rules.net. How can I get the domain I assigned to me?


    Please contact your network service provider. They will be able to help you with
    this. Please note that in most parts of the world you need to pay money to get
    a domain.


    9. How to become a bigger time DNS admin.


    Documentation and tools.


    Documentation exists. Online and in print. The reading of these is required to
    make the step from small time DNS admin to a big time one. In print the standard
    is DNS and BIND by C. Liu and P. Alberts from O''Reilly & Associates, Sebastopol,
    CA, ISBN 0-937175-82-X. I read this, it''s excellent, based on bind 4, this is
    not a real problem though. There is also a section on DNS in TCP/IP Network Administration,
    by Craig Hunt from O''Reilly..., ISBN 0-937175-82-X. Another must for Good DNS
    administration (or anything for that matter) is Zen and the Art of Motorcycle
    Maintenance by Robert M. Pirsig:- Available as ISBN 0688052304 and others.'
