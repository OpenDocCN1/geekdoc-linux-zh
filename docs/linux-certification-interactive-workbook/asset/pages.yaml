    # FAMILY IMPACT


    What is the impact of having extra equipment around the house? What will the time
    or money you spend on the family relationships? If you are single, how will it
    affect your dating life? Of course, you might be able to make this family project.
    Remember the phrase "The family that plays together, stays together." Is this
    a family project?


    # THE WORK SPACE


    The work space can determine a lot about what kind of network you can have. If
    you just have a corner or a wall in a room, you cannot do a very extensive network,
    and you may be limited to two PCs. You should consider multiple operating systems
    on the same box and use a boot manager to control which PC you will be working
    with. You can also purchase a switch box that can allow you to switch your monitor
    to several'
  merge: -1
  pgno: 250
