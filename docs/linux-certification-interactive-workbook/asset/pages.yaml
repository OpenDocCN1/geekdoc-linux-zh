- img_proc: true
  md: '# Appendix E: Samba Man Pages 367


    +   - postexec (S)


    This option specifies a command to be run whenever the service is disconnected.
    It takes the usual substitutions. The command may be run as the root on some systems.


    An interesting example may be de unmount server resources:


    ```

    postexec = /etc/umount /cdrom

    ```


    See also preexec.


    Default: none (no command executed)


    Example: postexec = echo "%u disconnected from %S from %m (%I)\ >> /tmp/log


    +   - postscript (S)


    This parameter forces a printer to interpret the print files as postscript. This
    is done by adding a % to the start of print output.


    This is most useful when you have lots of jobs that persist in putting a control-D
    at the start of print jobs, which then confuses your printer.


    Default: postscript = False


    Example: postexec = True


    +   - preexec (S)


    This option specifies a command to be run whenever the service is connected. It
    takes the usual substitutions.


    An interesting example is to send the users welcome message every time they log
    in. Maybe a message of the day? Here is an example:


    ```

    preexec = csh -c echo "Welcome to %S!" /usr/local/samba/bin/smbclient -M %m -I
    %I'' &

    ```


    Of course, this could get annoying after a while :-)


    See also postexec.'
