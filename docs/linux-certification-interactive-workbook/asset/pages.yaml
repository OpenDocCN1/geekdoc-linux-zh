  md: '# Appendix H: NFS Documentation 531


    umount /mnt


    To make the system mount a nfs file system upon boot you edit /etc/fstab in the
    normal manner. For our example a line such as this is required:


    ```

    # device mountpoint fs-type options dump fsckorder

    eris:/mn/eris/local /mnt nfs rsize=1024,wsize=1024 0 0

    ```


    That''s all there is too it, almost. Read on please.


    # 4.1. Mount options


    There are some options you should consider adding at once. They govern the way
    the NFS client handles a crash or network outage. One of the cool things about
    NFS is that it can handle this gracefully. If you set up the clients right. There
    are two distinct failure modes:


    soft

    The NFS client will report and error to the process accessing a file on a NFS
    mounted file system. Some programs can handle this with composure, most won''t.
    I cannot recommend using this this setting.


    hard

    The program accessing a file on a NFS mounted file system will hang when the server
    crashes. The process cannot be interrupted or killed unless you also specify intr.
    When the NFS server is back online the program will continue undisturbed from
    where it were. This is probably what you want. I recommend using hard,intr on
    all NFS mounted file systems.


    Picking up the previous example, this is now your fstab entry:


    ```

    # device mountpoint fs-type options dump fsckorder

    eris:/mn/eris/local /mnt nfs rsize=1024,wsize=1024,hard,intr 0 0

    ```'
  merge: -1
  pgno: 556
- img_proc: true
  md: '# 532 Appendix H: NFS Documentation


    # 4.2. Optimizing NFS


    Normally, if no rsize and wsize options are specified NFS will read and write
    in chunks of 4096 or 8192 bytes. Some combinations of Linux kernels and network
    cards cannot handle large blocks, and might not be optimal, anyway. So we will
    want to experiment and find a rsize and wsize that works and is as fast as possible.
    You can test the speed of your options with some simple commands. Given the mount
    command above and that you have write access to the disk you can do this to test
    the sequential write performance:


    ```

    time dd if=/dev/zero of=/mnt/testfile bs=16k count=4096

    ```


    This creates a 64Mb of zeroed bytes (which should be large enough caching is no
    significant part of any performance perceived, a larger file if you have a lot
    of memory). Do it a couple (5-10?) of times and average the times. It is the `elapsed`
    or `wall clock` time that''s most interesting in this connection. Then you can
    test the read performance by reading the file:


    ```

    time dd if=/mnt/testfile of=/dev/null bs=16k

    ```


    do that a couple of times and average. They unmount, and mount again with a larger
    rsize and wsize. They should probably be multiples of 1024, and not larger than
    16384 bytes since that''s the maximum size in NFS version 2. Directly after mounting
    with a larger size cd into the mounted file system and do things like ls, explore
    the fs bit to make sure everything is as it should. If the rsize/wsize is too
    large the symptoms are very odd and not 100% obvious. A typical symptom is incomplete
    file lists when ''ls'', and no error messages. or reading files failing mysteriously
    with no error messages. After establishing the given rsize/wsize works you can
    do the speed tests again. Different server platforms are likely to have different
    optimal sizes. SunOS is reportedly a lot faster with 4096 byte blocks than anything
    else.


    Newer Linux kernels (since 1.3 sometime) perform read-ahead for rsize larger or
    equal to the machine page size. On Intel CPUs the page size is 4096 bytes will
    significantly increase the NFS read performance. So on an Intel machine you will
    want 4096 byte rsize if at all possible.'
  merge: -1
  pgno: 557
- img_proc: true
  md: '# Appendix H: NFS Documentation 533


    Remember to edit /etc/fstab to reflect the rsize/wsize you found.


    A trick to increase NFS performance is to disable synchronous writes on the server.
    The NFS specification states that NFS write requests should not be considered
    finished before the data is written on a non-volatile medium (normally the disk).
    This restricts the write performance somewhat, asynchronous writes will speed
    NFS writes up. The Linux nfsd has never done synchronous writes since the Linux
    file system implementation does not lend itself to this, but on non-Linux servers
    you can increase the performance with this way in your exports:


    ```

    /dir -async,access=linuxbox

    ```


    or something similar. Please refer to the exports man page on the machine in question.
    Please note that this increases the risk of data loss.


    +   5. NFS over slow lines


    Slow lines include Modems, ISDN and quite possibly other long distance connections.


    This section is based on knowledge about the used protocols but no actual experiments.
    My home computer has been down for 6 months (bad HD, low on cash) and so have
    had no modem connection to test this with. Please let me hear from you if you
    try this :-


    The first thing to remember is that NFS is a slow protocol. It has high overhead.
    Using NFS is almost like using kermit to transfer files. It''s slow. Almost anything
    is faster than NFS, FTP is faster. HTTP is faster. rcp is faster. ssh is faster.


    Still determined to try it out? OK.


    NFS'' default parameters are for quite fast, low latency, lines. If you use these
    default parameters over high latency lines it can cause NFS to report errors,
    abort operations, pretend that files are shorter than they really are, and act
    mysteriously in other ways.


    The first thing to do is not to use the soft mount option. This will cause timeouts
    to return errors to the software, which will, most'
  merge: -1
  pgno: 558
- img_proc: true
  md: '# 534 Appendix H: NFS Documentation


    likely not handle the situation at all well. This is a good way to get for mysterious
    failures. Instead use the hard mount option. When hard is active timeouts causes
    infinite retries instead of aborting whatever it was the software wanted to do.
    This is what you want. Really.


    The next thing to do is to tweak the timeo and retrans mount options. They are
    described in the nfs(5) man page, but here is a copy:


    +   - timeout=n The value in tenths of a second before sending the first retransmission
    after an RPC timeout. The default value is 7 tenths of a second. After the first
    timeout, the timeout is doubled after each successive timeout until a maximum
    timeout of 60 seconds is reached or the enough retransmissions have occurred to
    cause a major timeout. Then, if the filesystem is mounted, each new timeout cascade
    restarts at twice the initial value of the previous cascade, again doubling at
    each retransmission. The maximum timeout is always 60 seconds. Better overall
    performance may be achieved by increasing the timeout when mounting on a busy
    network, to a slow server, or through several routers or gateways.


    +   - retrans=n The number of minor timeouts and retransmissions that must occur
    before a major timeout occurs. The default is 3 timeouts. When a major timeout
    occurs, the file operation is either aborted or a "server not responding" message
    is printed on the console.


    In other words: If a reply is not received within the 0.7 second (700ms) timeout
    the NFS client will repeat the request and double the timeout to 1.4 seconds.
    If the reply does not appear within the 1.4 seconds the request is repeated again
    and the timeout doubled again, to 2.8 seconds.'
  merge: -1
