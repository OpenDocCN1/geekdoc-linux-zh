    # FOR EXAMPLE:


    Table 1.2 is an example of how you might set up networks in the various classes.


    # PUBLIC ADDRESS RANGES


    There is a range of IP addresses for each class that is available for use by anyone,
    without registration. This information is shown in Table 1.3. These IP addresses
    are not routed to the Internet and can be used locally. You can use them on the
    internal indent of a router or firewall without a problem. Your router or firewall
    can be set up to route traffic easily to the Internet from your LAN or WAN. However,
    your hosts that use these addresses cannot be accessed directly from the Internet;
    they need a more sophisticated gateway to access your internal WAN or LAN.


    # NETMASK


    The netmask signifies the part of the address used for the network and the part
    used for the host address. Here you need to convert the information to a binary
    format. If you think about the TCP/IP addresses in a binary format, the number
    will become a series of 4 groups of 8 numbers of 0 or 1. The number 255.255.255.255
    would look like the following:


    ```

    11111111.11111111.11111111.11111111

    ```


    Table 1.3 Public Unregistered Network Ranges

    | Class Start IP Address | Last IP Address | Default Subnet Mask |

    |---|---|---|---||

    | A | 10.0.0.0 | 10.255.255.255 | 255.0.0.0 |

    | B | 172.16.0.0 | 172.31.255.255 | 255.255.0.0 |

    | C | 192.168.1.0 | 192.168.255.255 | 255.255.255.0 |'
