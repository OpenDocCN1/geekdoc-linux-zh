    # 9. Exporting filesystems


    The way to export filesystems with NFS is not completely consistent across platforms
    of course. In this case Linux and Solaris 2 are the deviants. This section lists,
    superficially the way to do it on most systems. If the kind of system you have
    is not covered you must check your OS man-pages. Keywords are: nfsd, system administration
    tool, rc scripts, boot scripts, boot sequence, /etc/exports, exportfs. I’ll use
    one example throughout this section: How to export /mn/eris/local to apollon read/write.


    # 9.1. IRIX, HP-UX, Digital-UNIX, Ultrix, SunOS 4 (Solaris 1), AIX


    These OSes use the traditional Sun export format. In /etc/exports

    write:


    ```

    /mn/eris/local -rw=apollon

    ```


    The complete documentation is in the exports man page. After editing

    t file run exportfs -av to export the filesystems.


    How strict the exportfs command is about the syntax varies. On some

    OSes you will find that previously entered lines reads:


    ```

    /mn/eris/local apollon

    ```


    or even something degenerate like:


    ```

    /mn/eris/local rw=apollon

    ```'
  merge: -1
  pgno: 568
- img_proc: true
  md: '# 544 Appendix H: NFS Documentation


    I recommend being formal. You risk that the next version of exportfs if much stricter
    and then suddenly everything will stop working.


    # 9.2. Solaris


    Sun completely re-invented the wheel when they did Solaris 2. So this is completely
    different from all other OSes. What you do is edit the file /etc/dfs/dfstab. In
    it you place share commands as documented in the share(1M) man page. Like this:


    ```

    share -o rw=apolloon -d "Eris Local" /mn/eris/local

    ```


    After editing run the program shareall to export the filesystems.


    +   10. PC-NFS


    You should not run PC-NFS. You should run samba.


    Sorry: I don''t know anything about PC-NFS. If someone feels like writing something
    about it please do and I''ll include it here.'
