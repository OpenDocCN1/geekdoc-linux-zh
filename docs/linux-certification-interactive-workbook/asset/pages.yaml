    # SMBPASSWD (5)


    SAMBA


    23 OCT 1998


    NAME


    smbpasswd—The Samba encrypted password file


    SYNOPSIS


    smbpasswd is the Samba encrypted password file.


    DESCRIPTION


    This file is part of the Samba encrypted password file.


    smbpasswd is the Samba encrypted password file. It contains the username, Unix
    user id and the SMB hashed passwords of the user, as well as account flag information
    and the time the password was last changed. This format has been evolving with
    Samba and has had several different formats in the past.


    FILE FORMAT


    The format of the smbpasswd file used by Samba 2.0 is very similar to the familiar
    Unix password (5) file. It is an ASCII file containing one line for each user.
    Each field within each line is separated from the next by a colon. Any entry beginning
    with # is ignored. The smbpasswd file contains the following information for each
    user:'
  merge: -1
  pgno: 456
- img_proc: true
  md: '# Appendix E: Samba Man Pages


    +   - name

    This is the user name. It must be a name that already exists in the standard UNIX
    passwdd file.


    +   - uid

    This is the UNIX uid. It must match the uid field for the same user entry in the
    standard UNIX passwd file. If this does not match then Samba will refuse to recognize
    this smbpassword file entry as valid for a user.


    +   - Lanman Password Hash

    This is the LANMAN hash of the users password, encoded as 32 digits. The LANMAN
    hash is created by DES encrypting a well known string with the users password
    as the DES key. This is the same password used by Windows 95/98 machines. Note
    that this password hash is regarded as weak as it is vulnerable to dictionary
    attacks and if two users choose the same password this entry will be identical
    (i.e. the password is not "salted" as the UNIX password is). If a user has no
    null password field will contain the characters "NO PASSWORD" as''start of the
    hex string. If the hex string is equal to 32 ''x'' characters then the accounts
    is marked as disabled and the user will not be able to log onto the Samba server.


    WARNING !! Note that, due to the challenge-response nature of this SMB/CIFS authentication
    protocol, anyone with a knowledge of this password hash will be able to impersonate
    the user on the network. For this reason hashes are known as "plain text equivalent"
    and must NOT be made available to the root. To protect the passwords the smbpasswd
    file is placed in a directory with root and traverse access only to the root user
    and the smbpasswd file itself must be set to be read/write only by root, with
    no other access.


    +   - NT Password Hash

    This is the Windows hash of the users password, encoded as 32 hex digits. The
    Windows NT hash is created by taking the users password as represented in 16-bit,
    little-endian UNICODE and then applying the MD4 (internet rfc1321) hashing algorithm
    to it.


    This password hash is considered more secure than the Lanman Password Hash as
    it preserves the case of the password and uses a much higher quality hashing algorithm.
    However, it is still the case that if two users choose the same password this
    entry will be identical (i.e. the password is not "salted" as the UNIX password
    is).'
