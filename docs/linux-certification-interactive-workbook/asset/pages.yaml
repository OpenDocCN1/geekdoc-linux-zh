    # LAB 2.1


    # THE IFCONFIG COMMAND


    We discussed the ifconfig command earlier in chapter one when we used it to determine
    the current characteristics of your network card. We will now see how to use the
    command to configure the network characteristics of the box. There are a number
    of options to the ifconfig command. For our purposes, the ifconfig command can
    take on the following format for configuring a NIC:


    ```

    ifconfig <interface> [<address>] [ up ] [ down ] [ netmask <mask>> ] [ broadcast
    <broad_addr> ]

    ```


    where:


    +   1. interface is the interface, in which the above discussion is eth0 or eth1.

    2. address is the IP address of the NIC.

    3. up or down will bring the networking up or down on the card.

    4. netmask <mask> will set the netmask according to the value of <<mask>>.

    5. broadcast <broad_addr> will set the broadcast address according to the value
    <broad_addr>.


    There are other options that will not be discussed, but you might find them useful
    in certain circumstances.


    # FOR EXAMPLE:


    You might establish the TCP/IP parameters for the eth1 card with the following:


    ```

    ifconfig eth1 172.16.1.3 up netmask 255.255.255.255

    broadcast 172.16.1.255

    ```


    # ROUTING


    The default route is discussed in Lab 1.1 and is the IP address that is accessed
    for all IP addresses not on the local network. The local network is'
