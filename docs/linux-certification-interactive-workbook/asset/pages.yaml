- img_proc: true
  md: '# Appendix E: Samba Man Pages 311


    For file service it causes **smbd** to bind only to the interface list given in
    the ‘interfaces’ parameter. This restricts the networks that **smbd** will serve
    to packets coming in those interfaces. Note that you should not use this parameter
    for machines that are serving PPP or other or non-broadcast network interfaces
    as it will not cope with non-permanent interfaces.


    In addition, to change a users SMB password, the **smbpasswd** by default connects
    to the *localhost*—127.0.0.1 address as an SMB client to issue the password change
    request. If “**bind interfaces only**” is set then unless the network address
    127.0.0.1 is added to the ‘interfaces’ parameter list then **smbpasswd** will
    fail to connect in its default mode. **smbpasswd** can be forced to use the primary
    IP interface of the local host by using its “*remote machine*” parameter, with
    “remote machine” set to the IP name of the primary interface of the local host.


    **Default:** *bind interfaces only = False*


    **Example:** *bind interfaces only = True*


    +   - **blocking locks (S)**


    This parameter controls the behavior of **smbd** when given a request by a client
    to obtain a byte range lock on a region of an open file, and the request has a
    time limit associated with it.


    If this parameter is set and the lock range requested cannot be immediately satisfied,
    Samba 2.0 will internally queue the lock request, and periodically attempt to
    obtain the lock until the timeout period expires.


    If this parameter is set to “False”, then Samba 2.0 will behave as previous versions
    of Samba would and fail the lock request immediately if the lock range cannot
    be obtained.


    This parameter can be set per share.


    **Default:** *blocking locks = False*


    **Example:** *blocking locks = False*


    +   - **browsable (S)**


    Synonym for **browseable**.'
