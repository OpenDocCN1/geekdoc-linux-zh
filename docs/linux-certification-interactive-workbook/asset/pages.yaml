  md: '# Appendix H: NFS Documentation 537


    client too. We could also allow forbid execution of files on the mounted file
    system altogether with the noexec option. But this is more likely to be impractical
    since nosiduid since a file system is likely to at least contain some scripts
    or programs that needs to be executed. You enter these options in the options
    column, with the rsize and wsize, separated by commas,


    # 6.2. Server security: nfsd


    On the server we can decide that we don''t want to trust the client''s root account.
    We can do that by using the root_squash option in exports:


    ```

    /mn/eris/local apollon(rw,root_squash)

    ```


    Now, if a user with UID 0 on the client attempts to access (read, write, delete)
    the file system the substitutes the UID of the servers `nobody` account. This
    means the root user on the client can''t access or change files that only root
    on the server can access or change. That''s good, and you should probably use
    root_squash on all the file systems you export. "But the root user on the client
    can still use `su` to manage any other user and access and change that users!
    say you. To which the answer is: Yes, and that''s the way it is, and has to be
    with Unix and NFS. This has one important implication: All important binaries
    and files should be owned by root, and not bin or other non-root account, since
    the only clients root user access cannot are the servers root account. ... you
    can decide to mistrust whomever (don''t) like on the clients. You also have options
    to squash any UID and GID range you want to. This is described in the Linux NFS
    man page.


    root_squash is in fact the default with the Linux NFSd, to grant root access to
    a filesystem using no_root_squash.


    Another important thing is to ensure that nfsd checks that all it''s requests
    from a privileged port. If it accepts requests from any old port on a client with
    no special privileges can run a program that is easy to obtain over the Internet.
    It talks nfs protocol and will claim that it is anyone the user wants to be. Spooky.
    The Linux nfsd does this check by default, on other OSes you have to enable this
    check yourself. This should be described in the nfsd man page for the OS.'
