  md: '# 418 Appendix E: Samba Man Pages


    +   - exit Terminate the connection with the server and exit from the program.

    - get <remote file name> [local file name] Copy the file "remote file name" from
    the server to the machine running the client. If specified, name the local copy
    "local file name". Note that all transfers in smclient are binary. See also the
    [lowercase](https://en.wikipedia.org/wiki/Samba_(software_suite) command.

    - help [command] See the ? command above.

    - lcd [directory name] If "directory name" is specified, the current working directory
    on the local machine will be changed to the directory specified. This operation
    will fail if for any reason the specified directory is inaccessible.


    If no directory name is specified, the name of the current working directory on
    the local machine will be reported.


    +   - lowercase Toggle lowercasing of filenames for the get and mget commands.


    When lowercasing is toggled ON, local filenames are converted to lowercase when
    using the get and mget commands. This is often useful when copying (say) MSDOS
    files from a server, because lowercase filenames are the norm on UNIX systems.

    This command allows the user to set up a mask which will be used during recursive
    operation of the mget and mput commands.


    +   - Is <mask> See the dir command above.


    The masks specified to the mget and mput act as filters for directories rather
    than files when recursion is toggled ON.

    The mask specified with the .B mask command is necessary to filter files within
    those directories. For example, if the mask specified in an mget command is "source"
    and the mask specified with the mask command is "*.c" and recursion is toggled
    ON, the mget command will retrieve all files matching "*.c" in all directories
    below and including all directories matching "source" in the current working directory.

    Note that the value for mask defaults to blank (equivalent to "*") and remains
    until the mask command is used to change it. It retains the most recently specified
    value indefinitely. To avoid unexpected results it would be wise to change the
    value of .B mask back to "*" after using the mget or mput commands.'
  merge: -1
