  md: '# # LAB 5.1 EXERCISES


    # 5.1.1 SET UP YOUR /etc/exports FILE TO ALLOW MOUNTING


    Look in the man pages for the following:

    fs /etc/exports mount rpc.mountd rpd.nfsd fstab


    ![](img/4e4139af9b1671e6d87bfdaa638563a9_218_0.png)


    Before someone can access the data on your system, you need to give them access
    and control how they access the information. Some of the things you need to be
    concerned about when you give others access to your data include:


    +   - read access

    - write access

    - root versus regular user-access rights

    - verifying the user and server that will be accessing your data

    - whether encryption is necessary

    - whether there are any issues with large files since some versions of UNIX have
    a maximum file size of 2 gigs

    - the version of NFS that is being used

    - whether there are any issues with timeouts and how the system deals with lost
    connections or slow connections


    Many of these issues can be addressed once you learn how to use NFS. For now,
    we will just be concerned about getting your system to share files. Then you can
    fine-tune the access rights and other features.


    Your /etc/exports file controls what kind of access rights other systems have
    to mount your filesystems.


    > FOR EXAMPLE:


    Figure 5.1 shows a sample /etc/exports file:'
  merge: -1
  pgno: 218
- img_proc: true
  md: '# 194 Lab 5.1: Setting Up NFS


    LAB

    5.1


    ![](img/4e4139af9b1671e6d87bfdaa638563a9_219_0.png)


    # Figure 5.1 A Sample /etc/exports File


    The first column in Figure 5.1 is the name of the directory that you are exporting.
    In the first line, /usr is being exported. The second column is the grouping of
    servers and their appropriate access rights. On the second line, the * means that
    /home can be mounted by any system. The (rw) says that this is mounted with read/write
    access. You can grant access to multiple systems by grouping them with a pattern
    that matches the host and domain. So, as you see on the third line, any server
    that matches the pattern *. mydomain.com has read/write access because of the
    (rw). This is followed by the system that has the name titanic.sunk.com, which
    is read-only because of the (ro).


    > The Whole Truth

    nYou cannot mount a directory if a directory below it in the directory tree is
    currently mounted. So you cannot mount /usr/local/exportdir if you already exported
    /usr/local This prevents you from having multiple mount points and probably prevents
    some circular routes. This is true of the reverse situation where you cannot mount
    a directory that is above a currently mounted directory. Therefore you cannot
    mount /usr/local if /usr/local/exportdir is exported.


    With some versions of UNIX you can, mount a directory in this situation if the
    new mount point is on a separate filesystem or partition. So if you have separate
    partitions or filesystems for /usr/local and /usr, then you can export each separately.


    Login with the root id or become super user.


    You first need to check to if you have a /usr/local/exportdir. To do this, you
    can enter the command:


    ```

    ls -ld /usr/local/exportdir

    ```'
