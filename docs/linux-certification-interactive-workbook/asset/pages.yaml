  md: '# Appendix E: Samba Man Pages 313


    +   - character set smbd (G)


    This allows you to map filenames from a DOS Code page (see the client code page
    parameter) to several built in UNIX character sets. The built in code page translations:


    +   - ISO8859-1 Western European UNIX character set. The parameter client code
    page MUST be set to code page 850 if the character set parameter is set to ISO8859-1
    in order for the conversion to the UNIX character set to be done correctly.

    - ISO8859-2 Eastern European UNIX character set. The parameter client code page
    MUST be set to code page 852 if the character set parameter is set to ISO8859-2
    in order for the conversion to the UNIX character set to be done correctly.

    - ISO8859-5 Russian Cyrillic UNIX character set. The parameter client code page
    MUST be set to code page 866 if the character set parameter is set to ISO8859-2
    in order for the conversion to the UNIX character set to be done correctly.

    - KOI8-R Alternate mapping for Russian Cyrillic character set. The parameter client
    code page MUST be set to code page 866 if the character set parameter is set to
    KOI8-R in order for the conversion to the UNIX character set to be done correctly.


    > BUG: These MSDOS code page to UNIX character set mappings should be dynamic,
    like the loading of MS DOS code pages, not static.


    See also client code page. Normally this parameter is not set, meaning no filename
    translation is done.


    **Default:** character set = <empty string>


    **Example:** character set = ISO8859-1


    +   - client code page (G)


    This parameter specifies the DOS code page that the clients accessing Samba are
    using. To determine what code page a Windows or DOS client is using, open a DOS
    command prompt and type the command "chcp". This will output the code page. The
    default for USA-DOS, Windows 95, and Windows NT releases is code page 437. The
    default for western european releases of the above operating systems is code page
    850.'
