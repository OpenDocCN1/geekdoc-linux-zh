  md: '# 440 Appendix E: Samba Man Pages


    +   - -h This option prints the help string for smbpasswd, selecting the correct
    one for running as root or as an ordinary user.

    - -s This option causes smbpasswd to be silent (i.e. not issue prompts) and to
    read it''s old and new passwords from standard input, rather than from /dev/tty
    (like the password (1) program does). This option is to aid people writing scripts
