  md: "# Appendix G: Nameserver Documentation\n\n```\n@ IN SOA ns.linux.bogus. hostmaster.linux.bogus.\
    \ (\n      1 ; Serial\n      8H ; Refresh\n      2H ; Retry\n      1W ; Expire\n\
    \      1D) ns.linux.bogus.\n1 PTR localhost.\n```\n\nPlease note the '.' at the\
    \ end of all the full domain names in this file, in contrast to the named.conf\
    \ file. Some people like to start each zone file with a $ORIGIN directive, but\
    \ this is superfluous. The origin (where in the DNS hierarchy it belongs) of a\
    \ zone file is specified in the zone section of the named.conf file, in this case\
    \ it's 0.0.127.in-addr.arpa.\n\nThis 'zone file' contains 3 'resource records'\
    \ (RRs): A SOA RR. A NS RR a PTR RR. SOA is short for Start Of Authority. The\
    \ '@' is a special notation meaning the origin, and since the 'domain' column\
    \ of this file says 0.0.127.in-addr.arpa the first line really means\n\n```\n\
    0.0.127.in-addr.arpa IN SOA ...\n```\n\nNS is the Name Server. There is no '@'\
    \ at the start of this line, it is implicit since the last line started with a\
    \ '@'. Saves some typing that. So the NS line could also be written\n\n```\n0.0.127.in-addr.arpa\
    \ IN NS ns.linux.bogus\n```\n\nIt tells DNS what machine is the name server of\
    \ the domain 0.0.127.in-addr.arpa, it is ns.linux.bogus. 'ns' is a customary name\
    \ for name-servers, as with web servers who are customarily named whatever the\
    \ name may be.\n\nAnd finally the PTR record shows that the host at address 1\
    \ in the subnet 0.0.127.in-addr.arpa, i.e., 127.0.0.1 is named localhost.\n\n\
    The SOA record is the preamble to all zone files, and there should be exactly\
    \ one in each zone file. It describes the zone, where it comes from (a machine\
    \ called ns.linux.bogus), who is responsible for its contents (hostmaster@linux.bogus,\
    \ you should insert your e-mail address here), what version of the zone file this\
    \ is (serial: 1), and other things having to do with caching and secondary DNS\
    \ servers. For the rest of the fields (refresh, retry, expire and minimum) use\
    \ the rest of the numbers used in this HOWTO and you need to be safe."
