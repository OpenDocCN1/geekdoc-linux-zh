- img_proc: true
  md: '# 408 Appendix E: Samba Man Pages


    See samba (7) to find out how to get a full list of contributors and details on
    how to submit bug reports, comments etc.


    # APPENDIX E.5 SMBCLIENT (1)


    # SMBCLIENT (1)


    SAMBA


    23 OCT 1998


    # NAME


    SMBCLIENT—FTP-LIKE CLIENT TO ACCESS SMB/CIFS RESOURCES ON SERVERS


    # SYNOPSIS


    smbclient servicename [password] [-s smb.conf] [-B IP addr] [-O scope options][
    -R name resolve order] [-M NetBIOS name] [-i scope] [-N -n NetBIOS name] [-d debuglevel]
    [-P] [-p port] [-l log basename] [-h] -i dest] [-E] [-U username] [-L NetBIOS
    name] [-t terminal code] [-m max protocol] [-W workgroup] [-T<c|x>IXFqbNan] [-D
    directory] [-c command string


    # DESCRIPTION


    This program is part of the Samba suite.


    smbclient is a client that can ‘talk’ to an SMB/CIFS server. It offers an interface
    similar to that of the ftp program (see ftp (1)). Operations include things like
    getting files from the server to the local machine, putting files from the local
    machine to the server, retrieving directory information from the server and so
    on.


    # OPTIONS


    +   * servicename servicename is the name of the service you want to use on the
    server. A service name takes the form //server/service where server is the NetBIOS
    name of the SMB/CIFS server offering the desired service and service is the'
  merge: -1
  pgno: 433
- img_proc: true
  md: '# Appendix E: Samba Man Pages 409


    name on the service offered. Thus to connect to the service

    printer on the SMB/CIFS server smbserver, you would use the ser-

    vicename


    ```

    //smbserver/printer

    ```


    Note that the server name required is NOT necessarily the IP (DNS) host

    name of the server! The name required is a NetBIOS server name, which

    may or may not be the same as the IP hostname of the machine running

    the server.


    The server name is looked up according to either the -R parameter to sm-

    client or using the name resolve order parameter in the smb.conf

    file, allowing an administrator to change the order and methods by

    which server names are looked up.


    +   - password password is the password required to access the

    sspecified service on the specified server. If this parameter is

    supplied, the -N option (suppress password prompt) is as-

    umed.


    There is no default password. If no password is supplied on the command

    line (either by using this parameter or adding a password to the -U option

    (see below) and the -N option is not specified, the client will prompt for

    pass, even if the desired service does not require one (If no pass-

    word is required, simply press ENTER to provide a null password).


    Note: Some servers (including OS/2 and Windows for Workgroups) insist

    an uppercase case. Lowercase or mixed case passwords may be re-

    jected by these servers.


    Be cautious about including passwords in scripts.


    +   - -s smb.conf This parameter specifies the pathname to the

    samba configuration file, smb.conf. This file controls all aspects

    of the Samba setup on the machine and smclient also needs

    to read this file.


    +   - -B IP addr The IP address to when sending a broadcast

    packet.


    +   - -O socket options TCP socket options to set on the client

    socket. See the socket options in the smb.conf (5)

    epage for the list of valid options.


    +   - -R name resolve order This option allows the user of sm-

    client to determine what name resolution services to use when

    looking up the NetBIOS name of the host being connected to.'
  merge: -1
