- img_proc: true
  md: '# Appendix D: Samba Documentation 247


    1) Follow all instructions in DIAGNOSIS.txt from the samba docs directory.


    2) Locate you browse.dat and wins.dat files. They may be found in the following


    typical locations:


    +   /usr/local/samba/var/locks


    +   /var/locks/samba


    +   /opt/samba/var/locks


    If you can locate where samba stores these files you can always run:


    ```

    testparm | grep lock

    ```


    +   3) Shut down samba.


    +   4) Delete the browse.dat and wins.dat files


    +   5) Restart samba.


    +   6) Check that any files you deleted have been recreated.


    +   7) Now follow DIAGNOSIS.txt again.


    Cause:


    > Samba will place into these files entries for itself with your old IP address.
    When you restart Samba it preloads''s name cache with this information and expects
    to be able to resolve its own address to the same address as it has just read
    from these files


    Deleting the files means samba takes a little longer to stabilize on startup but
    otherwise will now operate correctly.


    In Samba 2.0 this problem has been fixed properly by storing signature information
    in the relevant files.'
  merge: -1
  pgno: 272
- img_proc: true
  md: "# LINUX & MMAP()\n\nEarly versions of Linux did not support shared writeable\
    \ mmap(). I-believe it was introduced in kernel version 2.0.\n\nThere are 3 possible\
    \ fixes:\n\n+   1) upgrade to a newer version of the Linux kernel\n\n+   2) don't\
    \ compile Samba with FAST_SHARE_MODES\n\n+   3) use Samba 1.9.18 which provides\
    \ FAST_SHARE_MODES via SysV IPC shared memory. I believe Linux 1.2 supported.\n\
    \nIn Samba 2.0 configure script will auto-detect the OS capabilities and will\
    \ enable shared memory only if available. \n\n# LOGON ERRORS IN NT EVENT VIEWER\n\
    \nThe logon errors in the NT event viewer are caused by Samba trying to detect\
    \ NT password servers.\n\nSome NT servers will accept any username/password for\
    \ session setup requests and always validate it, returning a positive session\
    \ setup response without the guest bit. Samba checks for this by deliberately\
    \ sending an incorrect password when calling the password server in server level\
    \ security. If the incorrect password succeeds Samba logs an error and refuses\
    \ to use the password server.\n\nYou can remove this check from the code if you\
    \ want, but as we have not worked out what causes a NT server to show this behavior\
    \ there is a risk that your NT server will start behaving incorrectly and thus\
    \ make your Samba server insecure.\n\nFuture versions Samba will have a new security\
    \ option \"security = domain\" which will use the same protocols that NT uses\
    \ for domain authentication (currently Samba uses the method that MS documents,\
    \ rather than that which Microsoft actually use). Once that in place this problem\
    \ should be solved.\n\n# MACINTOSH CLIENTS\n\n+   > Are there any Macintosh clients\
    \ for Samba"
  merge: -1
  pgno: 273
- img_proc: true
  md: '# Appendix D: Samba Documentation 249


    Yes. Mosby now have a CIFS Client/Server called DAVE—see http://www.thursby.com/


    They test it against Windows 95, Windows NT and samba for compatibility. At the
    time of writing, DAVE was at version 1.0.1. The 1.0.0 to 1.0.1 update is available
    as a free download from the Bisby web site (the speed of finder copies has been
    greatly enhanced, and there are bugs included).


    Alternatives—There are two free implementations of AppleTalk for kinds of UNIX
    machines, and several more commercial ones. These products allow you to run file
    services and print services natively to Macintosh users, with no additional support
    required on the Macintosh. The two free implementations are Netatalk, http://www.umich.edu/~rsug/netatalk/,
    and CAP, http://cs.mu.oz.au/appletalk/talk.html. What Samba offers MS Windows
    users, these packages offer Macs. For more info on these packages, Samba, and
    Linux (and other UNIX-based systems) see http://www.eats.com/linux_mac_win.html


    # NT GUEST ACCESS


    What you are seeing is normal and deliberate.


    MS Windows NT can be configured with the guest account enabled. When this is the
    case no logon attempt will ever fail. Instead NT will allow user access as the
    guest account IF the username and/or password are incorrect. In a situation where
    Samba is using and NT system to validate user passwords, if the NT server guest
    account is enabled then a user logging in as “root” will always be validated even
    if the password was incorrect. There is NO way that samba can tell from the reply
    packet from whether the password was correct and normal user privilege has been
    granted, or whether the password was incorrect and the user has been given only
    “guest” privileges.


    In short, if we WERE NOT to do what we do, then there would be no way of telling
    whether or not the password server guests only logons. We were to just accept
    the acceptance response from such a server the user could easily gain “root” level
    access to a Samba server.


    Now you would not really want us to change the current behavior, you?


    +   - Hi folks ... I don''t know if you have seen this, have corrected this yet

    - or it is my configuration.'
  merge: -1
  pgno: 274
- img_proc: true
