  md: '# Lab 1.1: The Current System TCP/IP Values


    # The Whole Truth


    Note that a netmask of 255.255.255.0 for a class A subnet is not exactly the same
    as a class C subnet, although the netmask is the same, and the number of hosts
    on this subnet are the same as a class C network. Some of the network addresses
    may not be valid combinations or routable because of the way that the netmask
    works. You will need to apply your netmask to your addresses and examine the resulting
    network address. Further-discussion of this is beyond the scope of this text.


    # ROUTING


    The last important concept to consider is routing, which is sending a packet of
    information from one network or subnet to another. A router has at least two networks
    or subnets attached to it. Each network is identified by:


    +   1. A unique IP address on the Network Interface Card (NIC)

    2. A netmask


    By applying the netmask to the IP address, both the network address and the range
    of addresses available for the network can be determined.


    # FOR EXAMPLE:


    Consider the following:


    IP address 172.16.1.1

    Netmask 255.255.255.0


    If you take the 0''s in the netmask and replace the corresponding number in the
    IP address with 0''s, you will have the network address. If you-place all the
    same numbers with 255, or all 1''s you will have the broad-cast address. So a
    netmask of 255.255.255.0, applied to a network of 172.16.1.3, creates a network
    of 172.16.1.0, with 254 hosts and a broad-cast address of 172.16.1.255. The possible
    addresses of a host on the-work with this netmask will vary from 172.16.1.1 to
    172.16.1.254.


    ![](img/4e4139af9b1671e6d87bfdaa638563a9_33_0.png)


    > Both the address of the network interface card and the netmask must be chosen
    so that there is no possibility that a particular address can be on two different
    networks or subnets. Otherwise, the router will not'
