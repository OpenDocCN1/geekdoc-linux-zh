  md: '# Appendix G: Nameserver Documentation 503


    There are a number of new RRs here: HINFO (Host INFORMATION) has two parts, it''s
    a good habit to quote each. The first part is the hardware or CPU on the machine,
    and the second part the software or OS on the machine. The machine called ''ns''
    has a Pentium CPU and runs Linux 2.0. CNAME (Canonical NAME) is a way to give
    each machine several names. So www is an alias for ns.


    CNAME record usage is a bit controversial. But it''s safe to follow the rule that
    a MX, CNAME or SOA record should never refer to a CNAME record, they should only
    refer to something with a A record, so it is inadvisable to have


    ```

    foobar CNAME www ; NO!

    ```


    correct to have


    ```

    foobar CNAME ns ; Yes!

    ```


    It''s also safe to assume that a CNAME is not a legal host name for a e-mail address:
    webmaster@www.linux.bogus is an illegal e-mail address given the setup above.
    You can expect quite a few admins Out There to enforce this rule even if it works
    for you. The way to avoid this is to use A records (and perhaps some others too,
    like a MX record) instead:


    ```

    WWW A 192.168.196.2

    ```


    A number of the arch-bind-wizards, recommend not using CNAME at all. But the discussion
    of why or why not is beyond this HOWTO.


    But as you see, this HOWTO and many sites do not follow this rule.


    Load the new database by running ndc reload, this causes named to read its files
    again.


    ```

    $ nslookup

    ```'
