  md: '# 252 Appendix D: Samba Documentation


    If you get this when talking to a Samba box then it means that your global "hosts
    allow" or "hosts deny" settings are causing the Samba server to refuse the connection.


    Look carefully at your "hosts allow" and "hosts deny" lines in the global section
    of smb.conf.


    It can also be a problem with reverse DNS lookups not functioning correctly, leading
    the remote host identity not being able to confirmed, but that is less likely.


    # OPLOCK BREAK ERRORS


    +   > I''m receiving the same error from the following versions of samba:

    > smbd version 1.9.18p10 started

    > smbd version 2.0.0beta2 started.

    > The following error message appears multiple times in the log files with

    > either version, and eventually locks up the entire samba server:

    > [1998/12/11 22:29:07, 0] smbd/opock.c:request_oplock(909)

    > request_oplock_break: ns response received to oplock break request to pid

    > 19883 on port 2328 for dev = 810000a, inode = 332533

    > I''m running this on Digital UNIX V4.0B on as AlphaStation 255. We''ve also

    > seen this error message on DU V3.2C running various flavors of samba.


    The advisory message means that you have either a defective network card on one
    of your clients, or an MS Windows application is refusing to respond to an oplock
    break request from another MS Windows client that wishes to access an already
    locked file.'
