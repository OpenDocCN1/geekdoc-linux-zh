- img_proc: true
  md: '# Appendix E: Samba Man Pages


    The username whose password is changed is that of the current UNIX logged on user.
    See the -U username parameter for details on changing the password for a different
    username.


    Note that Windows 95/98 do not have a real password database so it is not possible
    to change passwords specifying a Win95/98 machine as remote target.


    +   -R name resolve order This option allows the user of smb-client to determine
    what name resolution services to use when looking up the NetBIOS name of the host
    being connected.


    The options are :"hosts", "host", "wins" and "bcast", They cause names to be resolved
    as follows:


    +   - lmhosts: Lookup an IP address in the Samba lmhosts.

    - host: Do a standard host name to IP address resolution, using the system /etc/hosts,
    NIS, or DNS lookups. This method of name resolution is operating system dependent.
    For instance of IRIX or Solaris, this may be controlled by the /etc/nswitch.conf
    file.

    - wins: Query a name with the IP address listed in the wins server parameter in
    the smb.conf file. If no WINS server has been specified this method will be ignored.

    - bcast: Do a broadcast on each of the known local interfaces listed in the interfaces
    parameter in the smb.conf file. This is the least reliable of the name resolution
    methods as it depends on the target host being on a locally connected subnet.


    If this parameter is not set then the name resolve order defined in the smb.conf
    file parameter name resolve order will be used.


    The default order is lmhosts, host, wins, bcast and without this parameter or
    any entry in the smb.conf file the name resolution methods will be attempted.


    +   -m This option smbpasswd that the account being changed is a MACHINE account.
    Currently this is used when Samba is being used as an NT Primary Domain Controller.'
