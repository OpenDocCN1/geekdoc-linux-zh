  md: '# Lab 4.2: Getting Samba


    # LAB 4.2


    # GETTING SAMBA


    # LAB OBJECTIVES


    +   After this Lab, you will be able to:

    - Get the Latest Samba


    # GETTING SAMBA


    Samba is included by default with most packaged versions of Linux today. It is
    a public domain software package that is free of any royalties and follows the
    standard GNU licensing policies for making it publicly available. GNU stands for
    “GNU’s Not Unix.” It is a set of tools and licensing policies for public domain
    software. It is also available for other versions of UNIX such as AIX, HP-UX,
    Solaris, and others. It has been ported to other hardware architectures and operating
    systems.


    # The Whole Truth


    The version of Samba that is included with Red Hat 5.2 and some other versions
    of Linux requires some configuration and knowledge of Windows Networking. The
    version number will be less than 2.0. However, Version 2.3 of Samba comes with
    a default set of values that are sufficient to get Samba running without any configuration.
    If you do not have version 2.0 or later, you can get it at http://www.Samba.org.
    Just download the version of Samba for your system or version of Linux. You should
    use the recommended installation procedures for your version of Linux, which is
    using the RPM for Red Hat. This Lab will help you get getting Samba and installing
    software using the RPM method.


    Because this book is aimed at getting you up and running, we will only talk about
    getting Samba with the defaults. In addition, any network configuration will be
    done on the Windows PC side to match the Samba defaults. When you feel ready to
    tackle more detailed configuration issues, there are several excellent books on
    Samba, as well as online documentation that you can use.'
  merge: -1
  pgno: 168
- img_proc: true
  md: '# Lab 4.2: Getting Samba


    # LAB 4.2 EXERCISES


    # 4.2.1 GET THE LATEST SAMBA


    It is important that we all start this discussion at the same level. Because the
    industry moves very quickly, the discussion is based on a particular version of
    Samba. When you read this discussion, you will probably have a much later version.
    The version we are using is probably just as compatible with this discussion version
    2.03. Fortunately, you can often find older versions on the Internet for compatibility
    and historical reasons. If you have problems with your version of Samba, you may
    want to go back to the version we are working with.


    This discussion will show you how to download Samba. For some of you, this may
    be your first experience at updating your software, which should turn out to be
    a great experience. We will discuss using Netscape to do your download. You may
    use other means of downloading the files to your PC, such as FTP or Internet Explorer,
    or you can install them from a CD.


    In order to connect to the Samba site for purposes of this Exercise, you need
    to have Netscape installed. Fortunately, this is typically included with packaged
    versions of Linux. If you do not have Netscape with your Linux, you will need
    to install it from the Netscape site, your Linux CD-ROM, or you need to purchase
    it from Netscape. A discussion of installing Netscape is beyond the scope of this
    book.


    When you first log in to your Linux box, you will see a window similar to Figure
    4.12. You should note that this is an actual X-windows login from a remote MS
    Windows 95 PC. This screen shows the standard command-line prompt for Linux.


    To connect to the Samba site, you will now need to execute the netscape command.


    +   a) What happens when you type the netscape command? If you get errors, how
    should you handle them?'
