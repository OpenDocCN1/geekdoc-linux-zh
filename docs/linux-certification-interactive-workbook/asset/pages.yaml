- img_proc: true
  md: '# Lab 1.2: Accessing Other TCP/IP Hosts


    In order to analyze what traceroute does, and to understand routing concepts,
    take a look at Figure 1.1. Notice that each line has arrows pointing both directions.
    This means that each link is bi-directional and that the data can flow in both
    directions. In addition, assume for now that host1, minicomputer, and host2 can
    all act as routers, means they can send packets of information to other ports
    to which they are connected. We will now discuss several possible routes for packet.


    A packet of data going from point A to router1 it must go through host1. There
    is one possible route. For a packet to go from point A to router2, it will go
    through host1 and router1. However, if the link from router1 to router2 is down,
    it can also follow this path:


    ```

    point A -> router1 -> router3 -> router2

    ```


    Another possible route would be:


    ```

    point A -> router1 -> router3 -> router4 -> minicomputer -> router2

    ```


    (Remember minicomputer can route in this example.)


    This is one of the useful features of a router: If a route is either down or saturated,
    the data can be routed through a different route. In this example, the hosts are
    acting as routers (this is one of the features of the host software—Linux and
    most versions of UNIX have this feature built in).


    Using traceroute, we can get the time that it takes to get each point in the route
    and return from that point. We can also get the name of the host along the way.
    This allows us to trace the packets and can be a useful diagnostic tool if one
    of the connections in the route goes down.


    # FOR EXAMPLE:


    Let''s do a traceroute from host1 to host2. One route is:


    ```

    host1 -> router1 -> router3 -> router4 -> host2

    ```


    For the purposes of determining the time to each point, you can break this down
    into the following steps:


    ```

    host1 -> router1 -> host1

    ```


    ```

    host1 -> router3 -> host1

    ```'
