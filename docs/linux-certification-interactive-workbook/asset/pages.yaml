  md: '# Lab 4.3: Getting Samba Running


    # 4.3.4 UPGRADE SAMBA


    Instead of just installing Samba, you might want to just do an upgrade. Doing
    the upgrade assumes that you already have a version of Samba installed. If you
    want to try out the upgrade, then just install a version that is not the recent
    version and then do the upgrade. The upgrade process is very straightforward.
    The complete upgrade process will:


    +   - Upgrade any files for the package on your system

    - Backup any configuration files that are not consistent with the new release

    - Delete any files that are no longer necessary for the new version

    - Use the same rpm file that you used for installation.


    You can give various options to the rpm command to keep files, delete old configuration
    files, and so forth.


    The option -U will do a complete upgrade on your system of the rpm package. So
    to upgrade, just enter the command:


    ```

    rpm -U location_of_file

    ```


    where location_of_file is the location of the Samba file from which you will be
    installing.


    # FOR EXAMPLE:


    To upgrade Samba from the /home/myid directory, you would use the following command:


    ```

    rpm -U /home/myid/samba-2.0.3-19990228.i386.rpm

    ```


    Now you should upgrade your version of Samba.


    > a) What happens when you enter the command rpm -U /home/myid/samba-2.0.3-19990228.i386.rpm?
