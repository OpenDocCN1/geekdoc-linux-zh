  md: '# Kernel


    # Device Drivers


    # Hardware


    Figure 2.1 ■ The UNIX Device Driver


    When your Linux system boots up, it will attempt to determine the hardware devices
    that are attached to it. This is part of the autoconfiguration process. However,
    this takes time, and once your system is properly set up, you will want to eliminate
    much of the probing. This book does not attempt to teach you how to modify the
    autoconfiguration process and assumes whatever version of UNIX or Linux you are
    using will dmesg automatically determine the necessary drivers.


