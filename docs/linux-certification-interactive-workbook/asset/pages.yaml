- img_proc: true
  md: '# Appendix E: Samba Man Pages


    ```

    # Sample Samba Imhosts file.



    192.9.200.1 TESTPC


    192.9.200.20 NTSERVER#


    192.9.200.21 SAMBASERVER

    ```


    Contains three IP to NetBIOS name mappings. The first and third will be returned
    for any queries for the names "TESTPC" and "SAMBASERVER" respectively, whatever
    the type component of the NetBIOS name requested.


    The second mapping will be returned only when the "0x20" name type for a name
    "NTSSERVER" is queried. Any other name type will not be resolved.


    The default location of the Imhosts file is in the same directory as the smb.conf
    file.


