  md: '# Appendix D: Samba Documentation


    PTXT_ON.INF - SENDS PLAIN-TEXT PASSWORDS TO YOUR NETWORK

    SERVER


    ```

    ===================================================

    ====

    ```


    For security reasons, Windows 98 will not allow you to send plain-text

    passwords. The password is encrypted by default. However, Samba servers

    be configured to require plain-text passwords, so you will not be able

    t connect to Samba servers configured in this mode unless you change a

    Registry entry to enable plain-text passwords.


    Caution: Enabling plain-text passwords could compromise security.


    To enable plain-text passwords, add the Registry entry for EnablePlain-

    TextPassword (as a Dword) and set the value to 1 in the Reg-

    istry location:


    ```

    HKEY_LOCAL_MACHINE\ControlSet\Services\VxD\Vnetsup

