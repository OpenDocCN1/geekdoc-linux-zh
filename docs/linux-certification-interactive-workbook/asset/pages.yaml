  md: '# Appendix E: Samba Man Pages 439


    support is not a supported feature in Samba2.0 but will become supported in a
    later release. If you wish to know more about using Samba as an NT PDC please
    subscribe to the mailing list samba-ntdomam@samba.org.


    This option is only available when running smbpasswd as root.


    +   - **j DOMAIN** This option is used to add a Samba server into a Windows Domain,
    as a Domain member capable of authenticating user accounts to any Domain Controller
    in the same way as a Windows NT Server. Use the **security=domain** option in
    the **smb.conf** (5) page.


    In order to be used in this way, the Administrator for the Windows NT Domain must
    have used the program “Server Manager for Domains” to add the primary NetBIOS
    name of the Samba server as a member of the Domain.


    After this has been done, to join the Domain invoke **smbpasswd** with this parameter.
    **smbpasswd** will then look up the Primary Domain Controller for the Domain (found
    in the **smb.conf** file in the parameter **password server**) and change the
    machine account password used to create the secure Domain communication. This
    password is stored by **smbpasswd** in a file, read only by root, called `<Domain>.Machine`
    where `<Domain>` is the name of the Domain we are joining and `<Machine>` is the
    primary NetBIOS name of the machine we are running on.


    Once this operation has been performed the **smb.conf** file may be updated and
    all future logins to the Samba server will be authenticated to the Windows NT
    PDC.


    Note that even though the authentication is being done to the PDC all users accessing
    the Samba server must still have a valid UNIX account on that machine.


    This option is only available when running **smbpasswd** as root.


    +   - **U username** This option may only be used in conjunction with the **-r**
    option. When changing a password on a remote machine it allows you to specify
    the user name on that machine whose password will be changed. It is present to
    allow users who have different user names on different systems to change these
    passwords.'
