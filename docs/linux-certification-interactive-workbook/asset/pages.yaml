    # 5.1.2 Do A Remote NFS Mount


    You will now use NFS to mount the directory you created in Exercise 4.1.1. You
    will mount this on a second system on the same network. Figure 5.2 shows a picture
    of what is happening when you export a directory on the first box you worked with
    in Exercise 4.1.1 and then mount it remotely on the second box.


    Figure 5.2 shows the view of the shared directory area that is created by an NFS
    mount. As you can see from the picture, the mount is totally transparent to the
    user. The directories that are mounted remotely look just like directories that
    are on the local box.


    In order to mount a remote directory, you need to create a mount point. Then you
    need to use the mount command. To mount a drive remotely in NFS, you use the following
    format:


    ```

    system_name:directory_name

    ```


    FOR EXAMPLE:


    The directory /usr/local/exportdir on the host tux would be designated as:


    ```

    tux:/usr/local/exportdir

    ```'
