- img_proc: true
  md: '# Appendix E: Samba Man Pages


    +   - The [homes] section


    +   - If a section called `homes` is included in the configuration, services connecting
    clients to their home directories can be created on the fly by the server.


    When the connection request is made, the existing sections are scanned. If no
    match is found, it is used. If no match is found, the requested section is treated
    as a user name and looked up in the local password file. If the name exists and
    the correct password has been given, a share is created by cloning the [homes]
    section.


    Some modifications are made to the newly created share:


    +   - The share name is changed from `homes` to the located user-name


    +   - If no path was given, the path is set to the user''s home directory.


    If you decide to use a `path=` line in your [homes] section then you may find
    it useful to use the %S macro. For example :


    ```

    path=/data/pchome/%S

    ```


    would be useful if you have different home directories for your PCs for UNIX access.


    This is a fast and simple way to give a large number of clients access to their
    home directories with a minimum of fuss.


    A similar process occurs if the requested section name is "homes", except the
    share name is not changed to that of the requesting user. This method of using
    the [homes] section works well if different users share a client PC.


    The [homes] section can specify all the parameters a normal service section can
    specify, though some may make more sense than others. The following is a typical
    and suitable [homes] section:


    ```

    [homes]

    writeable = yes

    ```


    An important point is that if guest access is specified in the [homes] section,
    all home directories will be visible to all clients without a password. In the
    very unlikely event that this is actually desirable, it would be wise to also
    specify read only access.'
  merge: -1
  pgno: 325
- img_proc: true
  md: '# Appendix E: Samba Man Pages 301


    Note that the browseable flag for auto home directories will be inherited from
    the global browseable flag, not [homes] browseable flag. This is useful as it
    setting browseable=no in the [homes] section will hide the [homes] share make
    any auto home directories visible.


    +   - The [printers] section


    This section works like [homes], but for printers.


    If a [printers] section occurs in the configuration file, users are able to connect
    any printer specified in the local host''s printcap file.


    When a connection request is made, the existing sections are scanned. If a match
    is found, it is used. If no match is found, but a [homes] section exists, it is
    used as described above. Otherwise, the requested section name is treated as a
    printer name and the appropriate printcap file is scanned to see if the requested
    section is a valid printer share name. If a match is found, a new printer share
    is created by cloning the [printers] section.


    A few modifications are made to the newly created printer share:


    +   - The share name is set to the located printer name

    - If no printer name was given, the printer name is set to the located printer
    name

    - If the share does not permit guest access and no username given, the username
    is set to the located printer name.


    Note that the [printers] service MUST be printable—if you specify otherwise, the
    server will refuse to load the configuration file.


    Typically the path specified would be that of a world-writeable spool directory
    with the sticky bit set on it. A typical [printers] entry would look like this:


    ```

    [printers]

    path = /usr/spool/public

    writeable = no

    guest ok = yes

    printable = yes

    ```


    All aliases for a printer in the printcap file are legitimate printer names as
    far as the server is concerned. If your printing subsystem'
  merge: -1
  pgno: 326
- img_proc: true
  md: '# 302 Appendix E: Samba Man Pages


    doesn''t work like that, you will have to set up a pseudo-printcap. This is a
    file consisting of one or more lines like this:


    ```

    alias|alias|alias|alias...

    ```


    Each alias should be an acceptable printer name for your printing subsystem. In
    the [global] section, specify the new file as your printcap. The server will then
    only recognize names found in your pseudo-printcap, which of course can contain
    whatever you like. The same technique could be used simply to limit access to
    a subset of your local printers.


    An alias


    NOTE: On SYSV systems which use Ipstat to determine what printers are defined
    on the system may be able to use "printcap name = Ip-stat" to automatically obtain
    a list of printers. See the "printcap name" option for more details.


    # PARAMETERS


    Parameters define the specific attributes of sections.


    Some parameters are specific to the [global] section (e.g., security). Some parameters
    are usable in all sections (e.g., create mode). All others are permissible only
    in normal sections. For the purposes of the following descriptions the [homes]
    and [printers] sections will be considered normal. The letter ''G'' in parentheses
    indicates that a parameter is specific to the [global] section. The letter ''S''
    indicates that a parameter can be specified in a service specific section. Note
    that all ''S'' parameters can also be specified in the [global] section—in which
    case they will define the default behavior for all services.


    Parameters are arranged here in alphabetical order—this may not create best fellows,
    but at least you can find them! Where there are synonyms, the preferred synonym
    is described, others refer to the preferred synonym.


    # VARIABLE SUBSTITUTIONS


    Many of the strings that are settable in the config file can take substitutions.
    For example the option "path = /tmp/%u" would be interpreted as "path = /tmp/john"
    if the user connected with the username john.'
  merge: -1
  pgno: 327
- img_proc: true
  md: '# Appendix E: Samba Man Pages 303


    These substitutions are mostly noted in the descriptions below, but there are
    some general substitutions which apply whenever they might be relevant. These
    are:


    +   * %S = the name of the current service, if any.

    * %P = the root directory of the current service, if any.

    * %U = user name of the current service, if any.

    * %g = primary group name of %U.

    * %U = session user name (the user name that the client wanted, not necessarily
    the same as the one they got).

    * %G = primary group name of %U.

    * %H = the home directory of the user given by %U.

    * %v = the Samba version.

    * %h = the internet hostname that Samba is running on.

    * %m = the NetBIOS name of the client machine (very useful).

    * %L = the NetBIOS name of the server. This allows you to configure your config
    based on what the client calls. Your server can have a "dual personality"

    * %M = the internet name of the client machine.

    * %N = the name of your NIS home directory server. This is obtained from your
    NIS auto.map entry. If you have not compiled Samba with the --with-automount option
    then this value will be the same as %L.

    * %p = the path of the service''s home directory, obtained from your NIS auto.map
    entry. The NIS auto.map entry is split as "%N:%p"

    * %R = the selected protocol level after protocol negotiation. It can be one of
    CORE, COREPLUS, LANMAN1, LANMAN2 or NT1.

    * %d = the process id of the current server process.

    * %a = the architecture of the remote machine. Only some are recognized, and those
    may not be 100% reliable. It currently recognizes Samba, WinFG, WinNT and Win95.
    Anything else will be known as "UNKNOWN". If it gets wrong sending a level 3 log
    to samba-bugs@samba.org should allow it to be fixed.

    * %I = the IP address of the client machine.

    * %T = the current date and time.


    There are some creative things that can be done with these substitutions and other
    smb.conf options.'
  merge: -1
