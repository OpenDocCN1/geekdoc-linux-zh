    8. Questions and Answers


    Please read this section before mailing me.


    +   1. My named wants a named.boot file


    You are reading the wrong HOWTO. Please see the old version of this HOWTO, which
    covers bind 4, at http://www.math.uio.no/~janl/DNS/


    +   2. How do use DNS from inside a firewall?


    A hint: forward only;, You will probably also need


    query-source port 53;


    inside the "options" part of the named.conf file as suggested in the example "caching"
    section.


    +   3. How do I make DNS rotate through the available addresses for a service,
    say www.busy.site to obtain a load balancing effect, or similar?


    Make several A records for www.busy.site and use bind 4.9.3 or later. Then bind
    will round-robin the answers. It will not work with earlier versions of bind.'
