  md: '# Appendix G: Nameserver Documentation 485


    # 1.2. Credits and request for help.


    I want to thank Arnt Gulbrandsen whom I cause to suffer through the drafts to
    this work and whom provided many useful suggestions. I also want to thank the
    numerous people that have e-mailed suggestions and notes.


    This will never be a finished document, please send me about your problems and
    successes, it can make this a better HOWTO. So please send comments and/or questions
    or money to janl@math.uio.no. If you send e-mail and want an answer please show
    the simple courtesy of making sure that the return address is correct and working.
    Also, please read the "QnA" section before mailing me. Another thing, I can only
    understand Norwegian and English.


    If you want to translate this HOWTO please notify me so I can keep track of what
    languages it has been published in, and also I can notify you when the HOWTO has
    been updated.


    # 1.3. Dedication


    This HOWTO is dedicated to Anne Line Norheim Langfeldt. Though she will probably
    never read it since she''s not that kind of girl.


    # 2. Introduction.


    What this is and isn''t.


    DNS is the Domain Name System. DNS converts machine names to the IP addresses
    that all machines on the net have. It maps from name to address and from address
    to name, and some other things. This HOWTO documents how to define such mappings
    using a Linux system. A mapping is simply an association between two things, in
    this case a machine name, like ftp.linux.org, and the machines IP number (or address)
    199.249.150.4.


    DNS is, to the initiated (you ;-), one of the more opaque areas of network administration.
    This HOWTO will tell a few things. It describes how to set up a simple DNS server.
    Starting with a caching server and going on to setting up a primary DNS server
    for a domain. For more complex setups you can check the "QnA" section of this
    document. If it''s not described there you will need to read the Real Documentation.
    I will get back to what this Real Documentation consists of in "the last chapter".'
  merge: -1
  pgno: 510
- img_proc: true
  md: '# 486 Appendix G: Nameserver Documentation


    Before you start on this you should configure your machine so that telnet in and
    out of it, and successfully make all kinds of connections to the net, and you
    should especially be able to do telnet 127.0.0.1 and get your own machine (test
    it now!). You also need a good /etc/nwitch.conf (or /etc/host.conf), /etc/resolv.conf
    and /etc/hosts files as a starting point, since I will not explain them here.
    If you don''t already have all set up and working the NET-3-HOWTO and/or the PPP-HOWTO
    explains how to set it up. Read them.


    When I say ''your machine'' I mean the machine you are trying to set up DNS on.
    Not any other machine you might have that''involved in your networking effort.


    I assume you are not behind any kind of firewall that blocks name queries. If
    you are you will need a special configuration, see the section on ''QnA''.


    Name serving on Unix is done by a program named bind. The ''bind'' package which
    is coordinated by Paul Pixie for The Internet Software Consortium. Named is included
    in most Linux distributions and is usually installed as /usr/sbin/bind. If you
    have a name you can probably use it; if you don''t have one you can get a binary
    off a Linux ftp site, or get the latest and greatest source from ftp.isc.org:/src/bind/bind-.
    This HOWTO is about bind version 8. The old version of the HOWTO, and bind 4 is
    still available at http://www.math.uio.no/~jnal/ in case you use bind 4. If the
    man name page talks about (at the very end, the FILES section) named.conf you
    have bind 8, if it talks about named.boot you have bind 4. If you have 4 and security
    conscious you really ought to upgrade to a recent version.


    DNS is not a web-database. Take care about what you put into it. If you put junk
    into it, and others will get junk out of it. Keep your DNS tidy and consistent
    and you will get good service from it. Learn to use it, admin, debug it and you
    will be another admin keeping the net from falling to it''s knees by mismanagement.


    In this document I state fairly a couple of things that are not completely true
    (they are at least half truths though). All in the interest of simplification.
    Things will (probably :) work if you believe what I say.


    Tip: Make backup copies of all the files I instruct you to change you already
    have them, so if after going through this nothing works you can get it back to
    your old, working state.'
