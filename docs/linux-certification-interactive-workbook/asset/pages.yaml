  md: '# LAB 3.2


    # SETTING UP A PRIMARY NAMESERVER


    # LAB OBJECTIVES


    After this Lab, you will be able to:


    Set up and understand a primary nameserver and configure the following files:


    +   * resolv.conf

    * named.ca

    * named.local

    * named.hosts

    * named.rev

    * named.conf

    * Test Your Configuration


    # TYPES OF NAMESERVERS


    There are several types of nameservers in use. You will always need at least two
    nameservers on your site. This is required when you register your domain. This
    allows people to get to your domain when one nameserver is down. They can just
    query the other nameserver. There are three standard types plus additional servers
    that combine various features. They are:


    Primary nameservers—These are the nameservers you will generally be setting up.
    They are the most common because most domains are small enough that other types
    of nameservers are not needed.'
  merge: -1
  pgno: 129
- img_proc: true
  md: '# Lab 3.2: Setting Up a Primary Nameserver


    Secondary nameservers—These are nameservers that are essentially the same as the
    primary nameserver. They can function on their own if the primary nameserver goes
    down. However, their data is constantly being updated from the primary nameserver.
    This means you only have to update the primary nameserver on your network. Any
    changes will filter down.


    Caching nameservers—These servers do not have the standard address files used
    by DNS. Any information is stored in a cache. As time goes on, this is built up
    so that any queries can be resolved a lot more quickly than if you went through
    the process in Figure 3.1. This information is not permanently stored, however.
    Caching nameservers cannot function without the primary or secondary nameservers.


    In this book, we will only build a primary nameserver, because it does not depend
    on having access to other nameservers on your network. Once you understand the
    primary nameserver, it will be easier to configure the other types.


    # The Whole Truth


    While you may have multiple nameservers listed for your system to access, DNS
    will only query the first one on the list. If your first nameserver, after going
    through the process shown in Figure 3.2, gives an "address not found" message,
    it will not query the additional nameservers on your network. You may have 10
    nameservers listed on your network but only the first one that responds is used.
    Therefore, it is important that all nameservers are kept up-to-date. You need
    to keep this in mind as you read further.


    # RECORD TYPES


    Because the nameservers are really database servers, we can think of the information
    as being stored in records. Unlike many databases, all the files are in a character
    text format and are readable and editable. The record types fall into the following
    categories:


    +   - SOA—Lists the main authority for the domain.

    - NS—Gives the nameservers for the domain.

    - A—Gives name to address mapping. This is the main record you will need to be
    concerned with once you have set up your domain.'
  merge: -1
  pgno: 130
- img_proc: true
  md: '# 106 Lab 3.2: Setting Up a Primary Nameserver


    +   - PTR—Gives the address to name mapping, also known as reverse mapping or
    reverse naming. This will take an IP address and return the name associated with
    it. This is often used by destination hosts to verify that you are who you say
    you are. Sometimes you will be refused if the destination cannot verify your name
    from the IP address.


    +   - Others—There are other record types, but we don''t need to be concerned
    about them now, since we want to get up to speed as quickly as possible.


    # LAB 3.2 EXERCISES


    In these Exercises, we will build a nameserver file by file. If you are on an
    existing network with currently existing nameservers, you can still create your
    own domain and not have an impact on the rest of the network. A nameserver must
    be accessed directly by your program; otherwise, the rest of the network ignores
    it.


    > Note that there are several versions of DNS in use, with subtle differences.
    Sometimes you may need to tweak a few items to get your DNS files to resolve names
    properly. Also, filenames will differ in various versions. You need to think of
    the file''s function, not the name. We will be working with relatively standard
    filenames. We will also assume that all DNS host files are located in /var/named,
    but they can be located anywhere that /etc/named.boot point to.


    ![](img/4e4139af9b1671e6d87bfdaa638563a9_131_0.png)


    # 3.2.1 resolv.conf


    This file is /etc/resolv.conf and was discussed in Chapter 2. This is a standard
    file that is in use on all systems that need to do name resolution. This time,
    the file must be set up in a manner similar to the following layout:


    ```

    domain mydomain.com

    search mydomain.com

    ameserver 127.0.0.1

    ```


    domain is the name of the domain where you are going to resolve addresses. You
    should be aware that the domain may be unnecessary in your'
  merge: -1
  pgno: 131
- img_proc: true
