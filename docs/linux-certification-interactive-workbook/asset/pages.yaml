    users have different WfWg usernames to UNIX usernames. In both these cases you
    may also be better using the \\server\share&user syntax in-stead.


    The username=line is not a great solution in many cases as it means Samba will
    try to validate the supplied password against each of the usernames in the username=line
    in turn. This is slow and a bad idea for lots of users in case of duplicate passwords.
    You may get timeouts or security breaches using this parameter unwisely.


    Samba relies on the underlying UNIX security. This parameter does not restrict
    who can login, it just offers hints to the Samba server as to what usernames might
    correspond to the supplied password. Users can login as whoever they please and
    will be able to do no more damage than they started a telnet session. The daemon
    runs as the user that they log in as, so they cannot do anything that user cannot
    do.


    To restrict a service to a particular set of users you can use the "valid users"
    parameter.


    If any of the usernames begin with a ''@'' then the name will be looked up first
    in the yp netgroups list (if Samba is compiled with netgroup support), followed
    by a lookup in the UNIX groups database and will expand to a list of all users
    in the group of that name.


    If any of the usernames begin with a ''+'' then the name will be looked up only
    in the UNIX groups database and will expand to a list of all users in the group
    of that name.


    If any of the usernames begin with a ''&'' then the name will be looked up only
    in the yp netgroups database (if Samba is compiled with netgroup support) and
    will expand to a list of all users in the netgroup group of that name.


    Note that searching through groups database can take quite some time, and some
    clients may time out during the search.


    See the section "NOTE ABOUT USERNAME/PASSWORD VALIDATION" for more information
    on how this parameter determines access to the services.


    Default: The guest account if a guest service, else the name of the service.'
  merge: -1
  pgno: 423
- img_proc: true
  md: 'This option is DIFFERENT from the "domain user map" which maintains a one-to-one
    mapping between UNIX usernames and NT Domain Usernames: more specifically, the
    Samba server maintains a link between BOTH usernames, presenting the NT username
    to the external world, and using the UNIX username internally.'
