    related ones later. They are all enumerated in the exports man page you should
    have read at least once in your life. There are also better ways than listing
    all the hosts in the exports file. You can for example use net groups if you are
    running NIS (or Y) (NIS was known as YP), and always define domain cards and IP-subnets
    as hosts that are allowed to mount something. But you should consider who can
    get access to the server in unauthorized ways if you use such blanket authorizations.


    Note: This exports file is not the same syntax that other Unixes use. There is
    a separate section in this HOWTO about other Unix files.


    Now we''re set to start mountd (or maybe it''s called rpc.mountd and nfsd (which
