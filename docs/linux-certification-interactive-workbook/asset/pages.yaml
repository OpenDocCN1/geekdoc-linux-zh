  md: On the client we can decide that we don't want to trust the server too much
    a couple of ways with options to mount. For example we can forbid programs to
    work off the NFS file system with the nosuid option. This is a good idea and you
    should consider this with all NFS mounted disks. It means that the server's root
    user cannot make a suid-root program on the file system, log in to the client
    as a normal user and then use the suid-root program to become root on the
  merge: -1
