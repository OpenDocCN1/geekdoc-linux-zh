  md: '# Lab 5.1: Setting Up NFS 207


    i) What kind of results do you get from the mount command?

    Answer: The mount command will give you results in Figure 5.10.


    The last line that results from the mount command shows the remote mount. This
    line is:


    ```

    tux:/usr/local/exportdir on /usr/local/importdir type nfs

    (rw,addr=172.16.1.1)

    ```


    This line can be broken down as:


    +   * tux:/usr/local/exportdir—Shows the name of the host, which is tux in this
    case. That is followed by the colon, which is an indicator that the previous word
    or string is the name of the host. The colon is followed by the name of the remote
    directory.

    * /usr/local/importdir—Is the name of the local directory where the mount occurs.

    * type nfs—Shows that the mount is an NFS mount.

    * (rw, addr=172.16.1.1)—Says that the mount type is read/write and the remote
    address is 172.16.1.1.


    j) What kind of results do you get from the touch command?

    Answer: You should get an error message like the one you see in Figure 5.11.


    Permission is denied because the remote directory has the following attributes
    on the remote server:


    ```

    root@tux local]# ls -ld exportdir

    drwxr-xr-x 2 root                1024 Jun 26 06:10 exportdir

    [root@tux local]#

    ```


    This prevents a remote user, or any other user than root on the remote system,
    from writing to the directory.


    ![](img/4e4139af9b1671e6d87bfdaa638563a9_232_0.png)


    Figure 5.10 The Results of the mount Command'
  merge: -1
