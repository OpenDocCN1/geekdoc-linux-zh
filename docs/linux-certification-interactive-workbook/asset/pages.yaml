    # Introduction


    This document explains what the SMB protocol is and discusses the many client
    and server implementations of SMB that are available. The document grew out of
    my interest in implementing SMBlib, a portable library of SMB client routines.


    SMB is an important protocol because of the large number of PCs out there that
    already have client and server implementations running on them. All Windows for
    Workgroups, Windows 95 and Windows NT systems are (or are capable of) running
    SMB as either a client, a server, or both.


    # What''s New


    While there are many things out there that are new, perhaps the thing of greatest
    interest as far as the SMB protocol is concerned is CIFS, the Common Internet
    File System.'
