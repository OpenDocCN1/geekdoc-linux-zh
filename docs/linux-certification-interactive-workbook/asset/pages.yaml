  md: '# Appendix E: Samba Man Pages 417


    The prompt indicates that the client is ready and waiting to carry out a user
    command. Each command is a single word, optionally followed by parameters specific
    to that command. Command and parameters are space-delimited unless these notes
    specifically state otherwise. All commands are case-insensitive. Parameters to
    commands may or may not be case sensitive, depending on the command.


    You can specify file names that have spaces in them by quoting the name with double
    quotes, for example "a long file name".


    Parameters shown in square brackets (e.g., "[parameter]") are optional. If not
    given, the command will use suitable defaults. Parameters shown in angle brackets
    (e.g., "<parameter>") are required.


    Note that all commands operating on the server are actually performed by issuing
    a request to the server. Thus the behavior may vary from server to server, depending
    on how the server was implemented.


    # THE COMMANDS AVAILABLE GIVEN HERE IN ALPHABETICAL ORDER.


    +   * [command] If "command" is specified, the ? command will display a brief
    informative message about the command. If no command is specified, a list of available
    commands will be displayed.

    * ![shell command] If "shell command" is specified, the ! command will execute
    a shell locally and run the specified shell command. If no command is specified,
    a local shell will be run.

    * cd [directory name] If "directory name" is specified, the current working directory
    on the server will be changed to the directory specified. This operation will
    fail if for any reason the specified directory is inaccessible.


    If no directory name is specified, the current working directory on the server
    will be reported.


    +   * del <mask> The client will request that the server attempt to delete all
    files matching "mask" from the current working directory on the server.

    * dir <mask> A list of the files matching "mask" in the current working directory
    on the server will be retrieved and displayed.'
  merge: -1
