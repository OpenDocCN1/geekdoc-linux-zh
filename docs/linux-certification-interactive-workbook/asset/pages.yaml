  md: '# 368 Appendix E: Samba Man Pages


    **Default:** none (no command executed)


    **Example:** preexec = echo "%u connected to %S from %m (%I)" >> /tmp/log


    +   - preferred master (G)


    This boolean parameter controls if **nmbd** is a preferred master browser for
    its workgroup.


    If this is set to true, startup, **nmbd** will force an election, and it will
    have a slight advantage in winning the election. It is recommended that this parameter
    be used in conjunction with “domain master = yes”, so that **nmbd** can guarantee
    becoming a domain master. Indeed the default (“auto”) enables “preferred master”
    if Samba is configured as the domain master browser.


    Use this option with caution, because if there are several hosts (whether Samba
    servers, Windows 95 or NT) that are preferred master browsers on the same subnet,
    they will each periodically and continuously attempt to become the local master
    browser. This will result in unnecessary broadcastcast traffic and reduced browsing
    capabilities.


    See also **os level**.


    **Default:** preferred master = auto


    **Example:** preferred master = yes


    +   - preferred master (G)


    Synonym for “**preferred master**” for people who cannot spell (-).


    +   - **preload** Synonym for “**auto services**"

    - **preserve case (S)**


    This controls if new filenames are created with the case that the client passes,
    or if they are forced to be the “default” case.


    **Default:** preserve case = yes


    See the section on “**NAME MANGLING**” for a fuller discussion.'
