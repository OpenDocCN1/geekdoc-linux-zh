  md: '# root dir (G)


    Synonym for "root directory".


    +   - root directory (G)


    The server will "chroot()" (i.e. Change it''s root directory) to directory on
    startup. This is not strictly necessary for secure operation. Even without it
    the server will deny access to files not in one of the service entries. It may
    also check, for deny access to, soft links to other parts of the filesystem, or
    attempts to use ".." in file names to access other directories (depending on the
    setting of the "wide links" parameter).


    Adding a "root directory" entry other than "/" adds an extra level of security,
    but at a price. It absolutely ensures that no access is given to files not in
    the sub-tree specified in the "root directory" option, including files needed
    for complete operation of the server. To maintain full operability of the server
    you will need to mirror some system files into the "root directory" tree. In particular
    you will need to mirror /etc/passwd (or a subset of it), and any binaries or configuration
    files needed for printing (if required). The set of files that must be mirrored
    is system dependent.


    Default: root directory = /


    Example: root directory = /homes/smb


    +   - root postexec (S)


    This is the same as the "postexec" parameter except that the command is run as
    root. This is useful for unmounting filesystems (such as cdroms) after a connection
    is closed.


    See also "postexec".


    +   - root preexec (S)


    This is the same as the "preexec" parameter except that the command is run as
    root. This is useful for mounting filesystems (such as cdroms) before a connection
    is finalized.


    See also "preexec".'
  merge: -1
  pgno: 404
- img_proc: true
  md: '# 180 Appendix E: Samba Man Pages


    +   - security (G)


    This option affects how clients respond to Samba and is one of the most

    important settings in the smb.conf file.


    The option sets the "security mode bit" in replies to protocol negotiatiaions
    with smbd to turn share level security or off. Clients decide

    based on this bit whether (and how) to transfer user and password informaion to
    the server.


    The default is "security=user", as this is the most common setting needed

    when talking to Windows 98 and Windows NT.


    The alternatives are "security = share", "security = server" or "security=domain".


    ****NOTE THAT THIS DEFAULT IS DIFFERENT IN SAMBA2.0 THAN FOR

    PREVIOUS VERSIONS OF SAMBA ********


    In previous versions of Samba the default was "security=share" mainly

    because that was the only option at one stage.


    There is a bug in WfWg that has relevance to this setting. In user

    or server level security a WFWg client will totally ignore the password you

    type in the "connect drive" dialog box. This makes it very difficult (if

    impossible) to connect to a Samba service as anyone except the user that

    you are logged into WfWg as.


    If your PCs use usernames that are the same as theirs on the

    UNIX machine then you will want to use "security = user". If you

    most use usernames that do not exist on the UNIX then use "security = share".


    You should also use security=share if you want to mainly setup shares

    without a password (guest servers). This is more difficult to setup guest shares
    with security=user, use the "map to guest" parameter for details.


    It is possible to use smbd in a "hybrid mode" where it offers both user

    and share level security under different NetBIOS aliases. See the Net-BIOS aliases
    and the include parameters for more information.


    The different settings will now be explained.'
  merge: -1
  pgno: 405
- img_proc: true
  md: "# Appendix E: Samba Man Pages 381\n\n+   * “security=share” When clients connect\
    \ to a share level server then not log onto the server with a valid username and\
    \ password before attempting to connect to a shared resource (although modern\
    \ clients such as Windows 95/98 and Windows NT will send a login request with\
    \ a username but no password when talking to a security=share server). Instead,\
    \ the clients send authentication information (passwords) on a per-share basis,\
    \ at the time they attempt to connect to that\n\nNote that smbd *ALWAYS* uses\
    \ a valid UNIX user to act on behalf of the client, even in “security=share” level\
    \ security.\n\nAs clients are not required to send a username to the server in\
    \ share level security, smbd uses several techniques to determine the correct\
    \ UNIX user to use on behalf of the client.\n\n+   * If the “guest only” parameter\
    \ is set, then all the other stages are missed and only the “guest account” username\
    \ is checked.\n\t\t\t* Is a username is sent with the connection request, then\
    \ this username (after mapping—see “username map”), is added as a potential username.\n\
    \t\t\t* If the client did a previous “logon” request (the SessionSetup SMB call)\
    \ then the username sent in this SMB will be added as a potential username.\n\t\
    \t\t* The name of the service the client requested is added as a potential username.\n\
    \t\t\t* The NetBIOS name of the client is added to the list as a potential username.\n\
    \t\t\t* Any users on the “user” list are added as potential usernames.\n\nIf the\
    \ “guest only” parameter is not set, then this list is then tried with the supplied\
    \ password. The first user for whom the password matches will be used as the UNIX\
    \ user.\n\nIf the “guest only” parameter is set, or no username can be determined\
    \ then if the share is marked as available to the “guest account”, then this guest\
    \ user will be used, otherwise access is denied."
