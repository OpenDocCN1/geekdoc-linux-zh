- img_proc: true
  md: '# Appendix E: Samba Man Pages 405


    +   - wins server (G)


    This specifies the IP address (or DNS name: IP address for preference) of the
    WINS server that nmbd should register with. If you have a WINS server on your
    network then you should set this to the WINS server''s IP.


    You should point this at your WINS server if you have a multi-subnetted network.


    NOTE. You need to set up Samba to point to a WINS server if you have multiple
    subnets and wins cross-subnet browsing to work correctly.


    See the documentation file BROWSING.txt in the docs/ directory of your Samba source
    distribution.


    Default: wins server ="


    Example: wins server = 192.9.200.1


    +   - wins support (G)


    This boolean controls if the nmbd process in Samba will act as a WINS server.
    You should not set this to true unless you have a multi-subnetted network and
    you have a particular nmbd to be your WINS server. Note that you should "*NEVER*
    set this to true on more than one machine in your network.


    Default: wins support = no


    +   - workgroup (G)


    This controls workgroup your server will appear to be in when queried by clients.
    Note that this parameter also controls the Domain name used with the "security-domain"
    setting.


    Default: set at compile time to WORKGROUP


    Example: workgroup = MYGROUP


    +   - writable (S)


    Synonym for "writeable" for people who can''t spell :-). Pronounced "ritter-bull".'
  merge: -1
