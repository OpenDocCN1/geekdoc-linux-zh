  md: '# Appendix E: Samba Man Pages 323


    names. This allows NT domain groups to be presented correctly to NT users, despite
    the lack of native support for the NT Security model (based on VAX/VMS) in UNIX.
    The reader is advised to become familiar with the NT Domain system and its administration.


    This option is used in conjunction with ‘local group map’ and ‘domain user map’.
    The use of these three options is trivial and often unnecessary in the case where
    Samba is not expected to interact with any other SAM databases (whether local
    workstations or Domain Controllers).


    The map file is parsed line by line. If any line begins with a ‘#’ or a ‘’; it
    is ignored. Each line should contain a single UNIX group name on the left then
    a single NT Domain Group name on the right, separated by a tabstop or ‘=''. If
    either name contains spaces then it should be enclosed in quotes. The line can
    be either of the form:


    ```

    UNIXgroup \\DOMAIN_NAME\DomainGroupName

    ```


    or:


    ```

    UNIXgroupname DomainGroupName

    ```


    In the case where Samba is an EXPERIMENTAL Domain Controller or it is a member
    of a domain using “security = domain”, the latter format can be used: the default
    Domain name is the Samba Server’s Domain name, specified by “workgroup = MYGROUP”.


    Any UNIX groups that are NOT specified in this map file are assumed to be either
    Local or Domain Groups, depending on the role of the Samba Server.


    In the case when Samba is an EXPERIMENTAL Domain Controller, Samba will present
    ALL unspecified UNIX groups as its own NT Domain Groups, with the same name.


    In the case where Samba is member of a domain using “security = domain-main”,
    Samba will check the UNIX name with its Domain Controller (see “password server”)
    as if it were an NT Domain Group. If the Domain Controller says it is not, such
    unspecified (unmapped) UNIX groups which are also not NT Domain Groups are treated
    as Local Groups in the Samba Server’s local SAM database. NT Administrators will
    recognise these as Workstation Local Groups, which are managed by running USRMGR.EXE
    and selecting a Domain named “\WORKSTATION_NAME”, or by running USRMGR.EXE on
    a local Workstation.'
