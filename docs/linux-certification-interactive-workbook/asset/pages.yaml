  md: '# Appendix E: Samba Man Pages 419


    +   * **md <directory name>** See the **mkdir** command.

    * **mget <mask>** Copy all files matching mask from the server to the machine
    running the client.


    Note that mask is interpreted differently during recursive operation and non-recursive
    operation—refer to the **recurse** and **mask** commands for more information.
    Note that all transfers in .B smclient are binary. See also the **lowercase**
    command.


    +   * **mkdir <directory name>** Create a new directory on the server (user access
    privileges permitting) with the specified name.

    * **mput <mask>** Copy all files matching mask in the current working directory
    on the local machine to the current working directory on the server.


    Note that mask is interpreted differently during recursive operation and non-recursive
    operation—refer to the **recurse** and **mask** commands for more information.
    Note that all transfers in .B smclient are binary.


    +   * **print <file name>** Print the specified file from the local machine through
    a printable service on the server.


    See also the **printmode** command.


    +   * **printmode <graphics or text>** Set the print mode to suit either binary
    data (such as graphical information) or text. Subsequent print commands will use
    the currently set print mode.

    * **prompt** Toggle prompting for filenames during operation of the **mget** and
    **mput** commands.


    When togg ON, the user will be prompted to confirm the transfer of each file during
    these commands. When toggled OFF, all specified files will be transferred without
    prompting.


    +   * **put <local file name> [remote file name>** Copy the file called “local
    file name” from the machine running the client to the server. If specified, name
    the remote “remote file name”. Note that all transfers in smclient are binary.
    See also the **lowercase** command.

    * **queue** Displays the print queue, showing the job id, name, size and current
    status.

    * **quit** See the **exit** command.'
