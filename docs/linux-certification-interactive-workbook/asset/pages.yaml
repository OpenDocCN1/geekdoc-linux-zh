    But still, after all that: When an intruder has access to your network, s/he can
    make strange commands appear in your /var/spool/ mail are mounted over NFS. For
    the same reason, you should never access your PGP private key over nfs. Or at
    least you should know the risk involved. And now you know a bit of it.


    NFS and the portmapper makes up a complex subsystem and therefore it''s not totally
    likely that new bugs will be discovered, either in the basic design or the implementation
    we use. There might even be holes known now, when someone is abusing. But that''s
    life. To keep abreast of things like you should least read the newsgroups comp.os.linux.announce
    and comp.security.announce at a absolute minimum.


    # 7. Mount Checklist


    This section is based on IBM Corp. NFS mount problem checklist. My thanks to them
    for making it available for this HOWTO. If you experience a problem mounting an
    NFS filesystem please refer to this list before posting your problem. Each item
    describes a failure mode and the fix.


    +   1. File system not exported, or not exported to the client in question.


    Fix: Export it


    +   2. Name resolution doesn''t jibe with the exports list.


    e.g.: export list says export to johnmad but johnmad''s name is resolved as johnmad.austin.ibm.com.
    mount permission is denied.


    Fix: Export to both forms of the name.


    It can also happen if the client has 2 interfaces with different names for each
    of the two adapters and the export only specifies one.


    Fix: export both interfaces.


    This can also happen if the server can''t do a lookuphostbyname or lookuphostaddr
    (these are library functions) on the client. Make sure the client can do host
    <name>; host <ip_addr>; and that both shows the same machine.'
