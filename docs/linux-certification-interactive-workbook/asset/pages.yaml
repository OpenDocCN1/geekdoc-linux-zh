  md: '# 420 Appendix E: Samba Man Pages


    +   * rd <directory name> See the rmdir command.

    * recurse Toggle recursion for the commands mget and mput.


    When toggled ON, these commands will process all directories in the source directory
    (i.e., the directory they are copying .R from) and will recurse into any that
    match the mask specified to the command. Only files that match the mask specified
    by the mask command will be retrieved. See also the mask command.


    When recursion is toggled OFF, only files from the current working directory on
    the source machine that match the mask specified to the mget or mput commands
    will be copied, and any mask specified using the mask command will be ignored.


    +   * rm <mask> Remove all files matching mask from the current working directory
    on the server.

    * rmdir <directory name> Remove the specified directory (user access privileges
    permitting) from the server.

    * tar c|x>[IXbgNa> Performs a tar operation—see the -T line option. Behavior may
    be affected by the tarmode command (see below). Using g (incremental) and N (newer)
    will affect archive settings. Note that using the “ option with tar x may not
    work—use the command line option instead.

    * blocksize <blocksize> Blocksize. Must be followed by a valid (greater than zero)
    blocksize. Causes tar file to be written out in blocksize*TBLOCK (usually 512
    byte) blocks.

    * tarmode <full|inc|reset> Changes tar''s behavior with regard to archive bits.
    In full mode, tar will back up everything regardless of the archive bit setting
    (this is the default mode). In incremental mode, tar will only back up files with
    the archive bit set. In reset mode, tar will reset the archive bit on all files
    it backs up (implies read/write share).

    * setmode <filename> <perm=[+|-]-rsha> A version of the DOS attr command to set
    file permissions. For example:


    ```

    setmode myfile +r

    ```


    would make myfile read only.'
