  md: '# Appendix E: Samba Man Pages 315


    +   - codingsystem (G)


    This parameter is used to determine how incoming Shift-JIS Japanese characters
    are mapped from the incoming “client code page” used by the client, into files
    in the UNIX filesystem. Only useful if “client code page” is set to 932 (Japanese
    Shift-JIS).


    The options are :


    +   - SJIS Shift-JIS. Does no conversion of the incoming filename.

    - JIS8, J8BB, J8BH, J8@B, J8@J, J8@H Convert from incoming Shift-JIS to eight
    JIS code with different shift-in, shift out codes.

    - JIS7, J7BB, J7BH, J7@B, J7@H Convert from incoming Shift-JIS to seven JIS code
    with different shift-in, shift out codes.

    - JUNET, JABB, JUBH, JU@B, JU@J, JU@H Convert from incoming Shift-JIS to JUNET
    code with different shift-in, shift out codes.

    - EUC Convert an incoming Shift-JIS character to EUC code.

    - HEX Convert an incoming Shift-JIS character to a 3 byte hex representation,
    i.e. :AB.

    - CAP Convert an incoming Shift-JIS character to the 3 byte hex representation
    used by the Columbia AppleTalk Program (CAP), i.e. :AB. This is used for compatibility
    between Samba and CAP.

    - comment (S)


    This is a text field that is seen next to a share when a client queries the server,
    either via the network neighborhood or “net view” to list what shares are available.


    If you want to set the string that is displayed next to the machine name then
