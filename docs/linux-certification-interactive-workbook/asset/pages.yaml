    # 4.4. Words of caution


    There are some things I should add here. The IP numbers used in the examples above
    are taken from one of the blocks of ''private nets'', i.e., they are not allowed
    to be used publicly on the internet. So they are safe to use in an example in
    a HOWTO. The second thing is the notify no; It tells named not to notify its secondary
    (slave) servers when it has gotten a update to its zone files. In bind-8 the named
    can notify the other servers listed in NS records in the zone file when a zone
    is updated. This is handy for ordinary use, but for private experiments with zones
    this feature should be off, we don''t want the experiment to pollute the Internet
    do we?


    And, of course, this domain is highly bogus, and so are all the addresses in it.
    For a real example of a real-life domain see the next main-section.


    # 4.5. Why reverse lookups don''t work


    There are a couple of "gotchas" that normally are avoided with name lookups that
    are often seen when setting up reverse zones. Before you go on you need reverse
    lookups of your machines working on your own nameserver. If it isn''t go back
    and fix it before continuing.


    I will discuss two failures of reverse lookups as seen from outside your network:


    # 4.5.1. The reverse zone isn''t delegated


    When you ask a service provider for a network-address range and a domain name
    the domain name is normally delegated as a matter of course. A delegation is the
    glue NS record that helps you get from one nameserver to another as explained
    in the dry theory section above. You read that, right? If your reverse zone doesn''t
    work go back and read it. Now.


    The reverse zone also needs to be delegated. If you got the 192.168.196 net with
    the linux.bogus domain from your provider they'
  merge: -1
  pgno: 532
- img_proc: true
  md: '# Appendix G: Nameserver Documentation


    need to put NS records in your reverse zone as well as for your forward zone.
    If you follow the chain from in-addr.arpa and up to your net you will probably
    find a break in the chain. Most probably at your service provider. Having found
    the break in the chain contact your service-provider and ask them to correct the
    error.


    # 4.5.2. You''ve got a classless subnet


    A classless subnet is what keeps the Internet going these days. Some years ago
    there was much ado about the shortage of ip numbers. The smart people in IETF
    (the Internet Engineering Task Force, they keep working their heads together and
    solved the problem. At a price. The price is that you get less than a "C" subnet
    and some things may break. Please see Ask Mr. DNS at http://www.acmebw.com/askdns/00007.htm
    for an good explanation of this and how to handle it.


    Did you read it? I''m not going to explain it so please read it.


    The first part of the problem is that your ISP must understand the technique described
    by Mr. DNS. Not all small ISPs have a working understanding of this. If so you
    might have to explain to them and be persistent. But be sure you understand it
    first ;- They will then set up a nice reverse zone at their server which you can
    examine for correctness with nslookup.


    The second and last part of the problem is that you must understand the technique.
    If you''re unsure go back and read about it again. Then you can set up your own
    classless reverse zone as described by Mr. DNS.


    There is another CNAME trick lurking here. Old resolvers will not be able to follow
    the trick in the resolving chain and will fail to reverse-resolve your machine.
    This can result in the service assigning it an incorrect access, deny access or
    something along those lines. If you stumble into such a service the only solution
    (that I know of) is for your ISP to insert your PTR record directly into their
    classless zone file instead of the trick CNAME record.'
