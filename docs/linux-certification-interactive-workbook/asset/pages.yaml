    +   - b Blocksize. Must be followed by a valid (greater than zero) blocksize.
    Causes tar file to be written out in blocksize*TBLOCK (usually 512 byte) blocks.


    +   - g Incremental. Only back up files that have the archive bit set. Useful
    only with the c flag.


    +   - q Keep. Keeps tar from printing diagnostics as it works. This is the same
    as tarmode quit


    +   - r Regular expression include or exclude. Uses regular expression for matching
    or excluding files if compiled with HAVE_REGEX_H. However this mode can be very
    slow. Not compiled with HAVE_REGEX_H, does a limited wildcard match on * and ?


    +   - N newer. Must be followed by the name of a file whose date is compared against
    files found on the share during creation. Only newer files than the file specified
    are backed up to the tar file. Useful only with the c flag.


