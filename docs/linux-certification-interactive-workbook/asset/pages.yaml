  md: '# INTRODUCTION


    To really connect you need a network.


    —Joe


    It is difficult to learn Linux or UNIX networking in today''s security-conscious,
    technical, business, and academic environments. You need to be able to try new
    ideas without having to worry at what or who you are going to impact. Fortunately,
    Linux is available at a low or minimal cost. In addition, the cost of hardware
    for Linux systems is considerably less than equivalent MS Windows or commercial
    UNIX systems.


    In this book, I will try to guide you on the road to building an environment that
    you can use to learn Linux networking and expand your horizons. This book is a
    continuation of my first book—the System Administrator Interactive Workbook, also
    by Prentice Hall (1999). In both books, I have tried to make it simple enough
    that you won''t realize how difficult and frustrating it can be for someone to
    learn the same information without books similar to this one.


    This is not without sacrifice. This book is not a comprehensive discussion of
    networking principles. In the first book, some people were looking for more detailed
    discussions. Because of time, space, and learning considerations, what material
    must be left out. There are many excellent books that cover Linux networking in
    detail. There is no need to cover the same material as these other books.


    The approach I have taken is to present a methodology and way of thinking that
    you can use to continue the learning process. Once your network is up and running,
    you should have more confidence as you continue on the learning process. If you
    successfully finish this book, you will have a working network that you can use
    to continue the process.


    This book is very usable in a commercial or academic training environment. As
    an educator, I have tried to present material that I can use in class and that
    can be used to help the student learn as much as possible on their own. You will
    want to examine the Notes to the Student and the Notes to the Instructor sections
    to see how you can use this in your train-'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# Introduction


    ing environment. You may also want to look at the other books in this series to
    see how they can be used for classes.


    Much emphasis is placed on using the man pages and other online help. The man
    pages are a very important tool for students and administrators. This book tries
    to include information you can''t find online or in the required textbooks. It
    also tries to avoid duplicating information that would be in your texts.


    Good luck, and I hope you have an excellent learning experience.


    —Joe


    # NOTES TO THE STUDENT


    ![](img/4e4139af9b1671e6d87bfdaa638563a9_17_0.png)


    The main focus of education is the student. However, there are many kinds of students
    and perhaps just as many ways of learning.


    —Joe


    Welcome to the Linux Network Administrator''s Interactive Workbook. You''re about
    to embark on a unique learning experience, one that we hope will be a good starting
    point for learning Linux networking. Much like learning to repair an automobile,
    it''s one thing to read about procedures in a book and answer questions about
    what you read. But it''s another thing entirely to lift the hood and dig right
    in.


    Let me make one thing perfectly clear. This is not a comprehensive training manual
    on Linux networking. Before you run, you have to learn to walk. You should consider
    this book your walking manual for networking. You will need a good Linux networking
    reference manual that you can refer to as you learn. Hopefully, you will feel
    much more confident about learning and experimenting with networking once you
    are finished with this text.


    # WHO THIS BOOK IS FOR


    Frankly, this book is for anybody who wishes to learn Linux networking, no experience
    necessary. If you are learning Linux networking on your own, it is essential that
    you have a system that you can totally control. in the traditional corporate or
    academic training environment, it is difficult to find a box that you can experiment
    with. When you do networking, you will need two boxes to test your configuration.
    Only one of these will need to be modified to any extent.'
  merge: -1
  pgno: 17
- img_proc: true
  md: 'Linux makes learning networking a lot easier than traditional approaches. Linux
    runs on your PC and can be added to your existing Windows environment. You will
    see in several of the chapters how you can use Linux to share your PC and disks
    with other operating systems. You can even run Linux totally from a diskette or
    CD-ROM if necessary.


    If you are in an academic environment with a teacher in a class, you may not have
    system administrative access to a Linux system. There are some concerns about
    security in such an environment. In these cases, you have access to a Linux box
    as a regular user only.


    Fortunately, Linux is a very open environment. Things are not hidden unless it
    is absolutely essential. So you can look at most of the system files and even
    copy them and edit them as a regular user. You just can''t modify the critical
    system files in their original location, or copy your modified files, as a regular
    user. Therefore, there is also an emphasis on this text on you are looking at,
    modifying them, and seeing if the changes would yield the desired effect, if they
    were implemented.


    A commercial training environment gives us perhaps the best-training environment
    for learning administration. You generally have a system that is totally under
    your control. At worst, you will be sharing the box with one or two others. When
    you start the class, the system will usually have been rebuilt from scratch. This
    is like having a blank canvas ready to be painted on. So now you can change the
    system, install software, remove software, make mistakes, and so forth, all without
    having to worry about the long-term effects.


    Learning network administration is very much a self-directed activity. It requires
    persistence, courage, and sometimes a bit of abandon to try new ideas and see
    the effects.


    # HOW THIS BOOK IS ORGANIZED


    The Interactive Workbook series offers an extraordinary opportunity to learn Linux
    networking through a journey of discovery. In this book, you are presented with
    a series of interactive Labs that are intended to highlight-certain aspects of
    administration. Each Lab, which is designed to stand alone as much as possible,
    begins with Learning Objectives that show you what Exercises (or tasks) are covered
    in that Lab. This is followed by an overview of the concepts that will be further
    explored through the heart of each Lab.'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# Introduction


    There is no way that all the networking topics can be covered in detail. So emphasis
    is placed on developing a way of thinking and developing of your skills. There
    is some duplication from one Lab to another in order to emphasize the concepts
    learned up to that point. This is an attempt to repeat something from a different
    angle that might be harder to learn or may have given a number of people problems.


    Each Exercise consists of a series of steps that you will follow to perform a
    specific task, with questions that are designed to help you discover the important
    things on your own. The answers to these questions are given at the end of the
    Exercises, with more in-depth discussion of the concepts explored.


    At the end of each Lab is a series of multiple-choice Self-Review Questions. If
    you feel certain that you already understand a certain Objective, you are free
    to skip that Exercise, but are still encouraged to take the Self-Review quiz at
    the end of the Lab, just to make sure. The answers to these questions appear in
    Appendix A. There are also additional Self-Review Questions at this book''s companion
    Web site, found at http://www.phpinteractive/. But more on a moment...


    Finally, at the end of each chapter you will find Your Thinking section, which
    consists of a series of projects designed to solidify all of the skills you have
    learned in the chapter. If you have successfully completed all of the Labs in
    the chapter, you should be able to tackle these projects with few problems. There
    are not always “answers” to these projects, but where appropriate, you will find
