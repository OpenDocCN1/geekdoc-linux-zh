  md: '# Appendix G: Nameserver Documentation 515


    Some people will tell you that reverse lookup mappings are only important for
    servers, or not important at all. So not: May, news, IRC and even some http (WWW)
    servers will not accept connections from machines of which they are not able to
    find the name. So reverse mappings for machines are in fact mandatory.


    # 6. Maintenance


    Keeping it working.


    There is one maintenance task you have to do on nameds, other than keeping them
    running. That''s keeping the root.hints file updated. The easiest way is using
    dig, first run dig no arguments, you will get the root.hints according to your
    own server. Ask one of the listed root servers with dig @rootserver. You will
    note that the output looks terribly like a root.hints file. Save it to a file
    (@e.root-servers.net ns >root.hints.new) and replace the old root.hints with it.


    Remember to reload named after replacing the cache file.


    Al Longyear sent me this script, that can be run automatically to update root.hints,
    install a crontab entry to run it once a month and forget it. The script assumes
    you have mail working and that the mailalias ''hostmaster'' is defined. You must
    hack it to suit your setup.


    ```

    #!/bin/sh

    # Update the nameserver cache information file once per month.

    # This is run automatically by a cron entry.

    #

    # Original by Al Longyear

    # Updated for bind 8 by Nicolai Langfeldt

    # Miscellaneous error-conditions reported by David A. Ranch

    # Ping test suggested by Martin Foster

    (

    echo "To: hostmaster <hostmaster>"

    echo "From: system <root>"

    echo "Subject: Automatic update of the root.hints file"

    echo


    PATH=/sbin:/usr/sbin:/bin:/usr/bin:

    export PATH

    cd /var/named

    ```'
