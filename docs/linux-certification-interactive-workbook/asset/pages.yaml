    # 2.1.4 Set Up Your Host Table


    The next step is to set up your /etc/hosts file. This Exercise assumes that your
    host does not have DNS, NIS, or NIS+ enabled. If you are not sure, you should
    see your instructor or network administrator. DNS will be discussed in Chapter
    3. The /etc/hosts file will allow you to access other hosts by name instead of
    IP address. Use the example in Figure 2.2 for discussion purposes.


    Let''s assume for discussion''s sake that you are on the private IP address network
    172.20.75.0, which is subnetted with the netmask of 255.255.255.0. Your host is
    called host3 and has an IP address of 172.20.75.135. Now modify or create the
    /etc/hosts file with the following entries (you should customize this file with
    entries from your own network, and you should include the name of at least one
    other host that you can access):


    ```

    127.0.0.1 localhost

    172.20.75.135 host3 loghost

    172.20.75.71 router1

    172.20.75.235 router3

