- img_proc: true
  md: '# Appendix E: Samba Man Pages 403


    Default: No valid users list. (anyone can login)


    Example: valid users = greg, @pcusers


    +   - veto files(S)


    This is a list of files and directories that are neither visible nor accessible.
    Each entry in the list must be separated by a '' '', which allows spaces to be
    included in the list. ''*'' and ''?'' can be used to specify multiple files or
    directories as DOS wildcards.


    Each entry must be a unix path, not a DOS path and must *not* include the unix
    directory separator ''/''.


    Note that the "case sensitive" option is applicable in vetoing files.


    One feature of the veto files parameter that it is important to be aware of, is
    that if a directory contains nothing but files that match the veto files parameter
    (which means Windows/DOS clients cannot ever see them) is deleted, the veto files
    within that directory *are automatically deleted along with it, if the user uses
    UNIX permissions to do.


    Setting this parameter will affect the performance of Samba, as it will be forced
    to check all files and directories for a match as they are scanned.


    See also "hide files" and "case sensitive".


    Default: No files or directories are vetoed.


    Examples:


    Example 1.


    ```

    Veto any files containing the word Security,

    any ending in .tmp, and any directory containing the

    word root.

    veto files = /*Security*/.tmp/*root*/

    ```


    Example 2.


    ```

    Veto the Apple specific files that a NetTalk server

    creates.

    veto files = /.AppleDouble/.bin/.AppleDesktop/Network

    Trash Folder/

    ```'
  merge: -1
  pgno: 428
- img_proc: true
  md: '# 404 Appendix E: Samba Man Pages


    +   - veto oplock files (S)


    This parameter is only valid when the “oplocks” parameter is turned on for a share.
    It allows the Samba administrator to selectively turn off the granting of oplocks
    on selected files that match a wildcarded list, similar to the wildcarded list
    used in the “veto files” parameter.


    **Default:** No files are vetoed for oplock grants.


    # Examples:


    You might want to do this on files that you know will be heavily contended for
    clients. A good example of this is in the NetBench SMB benchmark program, which
    causes heavy client contention for files ending in “.SEM. To cause Samba not to
    grant oplocks on these files you would use the line (either in the [global] section
    or in the section for the particular NetBench share:


    ```

    veto oplock files = /*.SEM/

    ```


    +   - volume (S)


    This allows you to override the volume label returned for a share. Useful for
    CDROMs with installation programs that insist on a particular volume label.


    The default is the name of the share.


    +   - wide links (S)


    This parameter controls whether or not links in the UNIX file system may be followed
    by the server. Links that point to areas within the directory tree exported by
    the server are always allowed; this parameter controls access only to areas that
    are outside the directory tree being exported.


    **Default:** wide links = no


    **Example:** wide links = no


    +   - wins proxy (G)


    This is a boolean that controls if nmbd will respond to broadcast name queries
    on behalf of other hosts. You may need to set this to "yes" for some other clients.


    **Default:** wins proxy = no'
  merge: -1
