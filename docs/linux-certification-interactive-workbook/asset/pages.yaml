    +   - change notify timeout (G)


    One of the new NT SMB requests that Samba 2.0 supports is the “ChangeNotify” requests.
    This SMB allows a client to tell a server to “watch” a particular directory for
    any changes and only reply to the SMB request when a change has occurred. Such
    constant scanning of a directory is expensive under UNIX, hence a smbd daemon
    only performs such a scan on each requested directory once every change notify
    timeout seconds.


    change notify timeout is specified in units of seconds.


    Default: change notify timeout = 60


    Example: change notify timeout = 300


