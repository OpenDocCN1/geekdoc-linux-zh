  md: '# SMBTAR BLOCKSIZE


    There was a slight error in early versions of smbtar which prevents the blocksize
    parameter from working correctly. This was fixed in Samba version 1.9.18.


    # UNSUBSCRIBE


    For information on unsubscribing or changing your subscribed address please see
    the instructions at http://lists.samba.org/


    # WIN98 SLOWDOWN


    +   - Further to my previous post, I have made an interesting discovery. This

    - particular slowdown only occurs from clients that are running

    - Windows 98.


    The Windows98 explorer (and possibly other programs) incorrectly set the “sync”
    bit in write requests to network shares. This causes an enormous slowdown as Samba
    (quite correctly) does a fsync() on the file after each write. Combine this with
    the fact that Windows98 explorer uses very small write sizes (around 1.5k) and
    you get really terrible results.


    In Samba 1.9.18p10 and later we modified Samba to by default ignore incorrect
    sync requests. This results in an enormous performance increase when using Windows98
    explorer.


    You can get the old (slow) behavior back using the “strict sync” option.


    # YOUR SERVER SOFTWARE IS BEING UNFRIENDLY


    If you get “your server software is being unfriendly” when you try to connect
    to a server using smclient it means that smclient established a TCP connection
    to the server but got garbage (or nothing) back when it tried to do a NBT “session
    request” on the open socket. The “unfriendly” bit comes from the fact that the
    client is expecting one of a number of possible error codes as defined in the
    spec (RFC1001/1002) but it gets something totally different.


    This usually means you aren''t successfully talking to a SMB server at all, and
    that the socket is connected to something else. A common cause if Samba is that
    the smbd failed to startup correctly and exited before it got to the point of
    answering the session request. Faulty/missing config files can do this or if you
    are launching inetd then maybe be your inetd.conf or /etc/services is setup incorrectly.'
