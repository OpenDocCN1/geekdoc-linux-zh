- img_proc: true
  md: 'The options are :"lmhosts", "host", "wins" and "bcast". They cause names to
    be resolved as follows:


    +   - **lmhosts**: Lookup an IP address in the Samba lmhosts file. The lmhosts
    file is stored in the same directory as the **smb.conf** file.

    - **host**: Do a standard host name to IP address resolution, using the system
    /etc/hosts, NIS, or DNS lookups. This method of name resolution is operating system
    depended for instance on IRIX or Solaris this may be controlled by the /etc/nwitch.conf
    file.

    - **wins**: Query a name with the IP address listed in the **wins server** parameter
    in the smb.conf file. If no wins server has been specified by this method it will
    be ignored.

    - **bcast**: Do a broadcast on each of the known local interfaces listed in the
    **interfaces** parameter in the smb.conf file. This is the least reliable of the
    name resolution methods as it depends on the target host being on a locally connected
    subnet. To specify a particular broadcast address the **-B** option may be used.


    If this parameter is not set the name resolve order defined in the **smb.conf**
    file parameter (**name resolve order**) will be used.


    The default order is lmhosts, host, wins, bcast and without this parameter or
    any entry in the **"name resolve order"** parameter of the **smb.conf** file the
    name resolution methods will be attempted in this order.


    +   - **M NetBIOS name** This options allows you to send messages, using the "WinPopup"
    protocol, to another computer. Once a connection is established you then type
    your message, pressing ^D (control-D) to end.


    If the receiving computer is running WinPopup the user will receive the message
    and probably a beep. If they are not running WinPopup the message will be lost,
    and no error message will occur.


    The message is also automatically truncated if the message is over 1600 bytes,
    as this is the limit of the protocol.


    One useful trick is to cat the message through **smbclient**. For example:'
  merge: -1
  pgno: 435
- img_proc: true
  md: '# Appendix E: Samba Man Pages 411


    cat mymessage.txt | smbclient -M FRED


    will send the message in the file mymessage.txt to the machine FRED.


    You may also find the -U and -I options useful, as they allow you to control the
    FROM and TO parts of the message.


    See the message command parameter in the smb.conf (5) for a description of how
    to handle incoming WinPopup messages in Samba.


    Note: Copy WinPopup into the startup group on your WfWg PCs if you want them to
    be able to receive messages.


    +   - i scope This specifies a NetBIOS scope that smclient will use to communicate
    when generating NetBIOS names. For details on the use of NetBIOS scopes, see rfc1001.txt
    and rfc1002.txt. NetBIOS scopes are very rarely used, only set this parameter
    if you are the system administrator in charge of all the NetBIOS systems you communicate
    with.

    - N If specified, this parameter suppresses the normal password prompt from the
    client to the user. This is useful when accessing a service that does not require
    a password.


    +   - n name By default, the client will use the local machine''s hostname (in
    uppercase) as its NetBIOS name. This parameter allows you to override the host
    name and whatever NetBIOS name you wish.

    - d debuglevel debuglevel is an integer from 0 to 10, or the letter ''A''.


    Unless a password is specified on the command line or this parameter is specified,
    the client will request a password.


    The default value if this parameter is not specified is zero.


    The higher this value, the more detail will be logged to the log files about the
    activities of the client. At level 0, only critical errors and severe warnings
    will be logged. Level 1 is a reasonable level for day running—it generates a small
    amount of information about operations carried out.


    Levels above 1 will generate considerable amounts of log data, and should only
    be used when investigating a problem. Levels above 3 are designed for use by developers
    and generate HUGE amounts of log data, most of which is extremely cryptic. If
    debuglevel is set to the letter'
  merge: -1
  pgno: 436
- img_proc: true
  md: '# Appendix E: Samba Man Pages


    ‘A’, then, *all* debug messages will be printed. This setting is for developers
    only (and people who *really* want to know how the code works internally).


    Note that specifying this parameter here will override the **log level** parameter
    in-the default


    +   - **P** This option is no longer used. The code in Samba2.0 now lets the server
    decide the device type, so no printer specific flag is needed.

    - **p port** This number is the TCP port number that will be used when making
    connections to the server. The standard (well-known) TCP port number for an SMB/CIFFS
    server is 139, which is the default.

    - **l logfilename** If specified, logfilename specifies a base file-name into
    which operational data from the running client will be logged.


    The default base name is specified at compile time.


    The base name is used to generate actual log file names. For example, if the name
    specified as “log”, the debug file would be `log.client`.


    The log file generated is never removed by the client.


    +   - **h** Print the usage message for the client.

    - **IP address** IP is the address of the server to connect to. It should be specified
    in standard “a.b.c.d” notation.


    Normally the client would attempt to locate a named SMB/CIFS server by looking
    it up via the NetBIOS name resolution mechanism described above in the **name
    resolve order** parameter above. This will force the client to assume that the
    server is on the machine with the specified IP address and the NetBIOS name component
    of the resource being connected to will be ignored.


    There is no default for this parameter. If not supplied, it will be determined
    automatically by the client as described above.


    +   - **E** This parameter causes the client to write messages to the standard
    error stream (stderr) rather than to the standard output stream.'
