    You could produce an equivalent result using:


    ```

    interfaces = 192.168.2.10/255.255.255.0 192.168.3.10/255.255.255.0

    ```


    if you prefer that format.


    If this option is not set then Samba will attempt to find a primary interface,
    but won''t attempt to configure more than one interface.


    See also **bind interfaces only**.


    +   * invalid users (S)


    This is a list of users that should not be allowed to login to this service. This
    is really a "paranoid" check to absolutely ensure an improper setting does not
    breach your security.


    A name starting with a ''@'' is interpreted as a NIS group first (if your system
    supports NIS), and then as a UNIX group if the name was not found in the NIS group
    database.


    A name starting with ''+'' is interpreted by only looking in the UNIX group database.
    A name starting with ''&'' is interpreted by only looking in the NIS group database
    if working on your system. The characters ''+'' and ''&'' may be used at the start
    of the name in either order so the value "+&group" means check the UNIX group
    database, followed by the NIS group database, and the value "&+group" means check
    the NIS group database, followed by the UNIX group database (the same as the ''@''
    prefix).


    The current servicename is substituted for %S. This is useful in the **[homes]**
    section.'
