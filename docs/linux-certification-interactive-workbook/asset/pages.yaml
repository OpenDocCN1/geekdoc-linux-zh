- img_proc: true
  md: '# Appendix E: Samba Man Pages 369


    +   - print command (S)


    After a print job has finished spooling to a service, this command will be used
    via a system() to process the spool file. Typically the command specified will
    submit the spool job to the host''s printing subsystem, but there is no requirement
    that this be the case. The server will not remove the spool file, so whatever
    command you specify should remove the spool file when it has been processed, otherwise
    you will need to manually remove old spool files.


    The print command is simply a text string. It will be used verbatim, with two
    exceptions: all occurrences of "%s" will be replaced by the appropriate spool
    file name, and all occurrences of "%p" will be replaced by the appropriate printer
    name. The spool file name is generated automatically by the server, the printer
    name is discussed below.


    The full path name will be used for the filename if "%s" is not preceded by a
    ''/''. If you don''t like this (it stuff up some lpq output) then use "%F" instead.
    Any occurrences of "%f" get replaced by the spool filename without the full path
    at the front.


    The print command MUST contain at least one occurrence of "%s" or "%F"—the "%p"
    is optional. When the job is submitted, if no printer name is supplied the "%p"
    will be silently removed from the print command.


    If specified in the "[global]" section, the print command given will be used for
    any printable service that does not have its own print command specified.


    If there is neither a specified print command for a printable service nor a global
    print command, spool files will be created but not processed and (most importantly)
    not removed.


    Note that printing may fail on UNIXs from the "nobody" account. If this happens
    then create an alternative guest account that can print and set the "guest account"
    in the "[global]" section.


    You can form complex print commands by realizing that they are just passed to
    a shell. For example the following will log a print job, print the file, then
    remove it. Note that '';'' is the separator for command in shell scripts.


    ```

    print command = echo Printing %s >> /tmp/print.log; 1pr -P %p %s; rm %s

    ```'
