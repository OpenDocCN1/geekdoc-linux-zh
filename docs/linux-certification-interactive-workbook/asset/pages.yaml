    The "Non-authoritative answer:" line we got this time around. That means that
    named did not go out on the network to ask this time, the information is in the
    cache. But the cached information might be out of date (stale). So you are informed
    of this (very slight) possibility by saying ''Non-authoritative answer:''. When
    nslookup says this the second time you ask for a host it''s'' a sure sign that
    named caches the information and that it''s working. You exit nslookup by giving
    the command ''exit''.


    # 3.2. Making it even better


    In large, well organized, academic or ISP (Internet Service Provider) networks
    you sometimes find that the network people have set up a forwarder hierarchy of
    DNS servers helps lighten the internal network load and on the outside servers
    as well. It''s not easy to know if you''re inside a network or not. It is however
    important and by using the DNS server of your network provider as a "forwarder"
    you can make the responses to queries faster and less of a load on your network.
    If you use a modem this can be less of a win. For the sake of this example we
    assume that your network provider has two names they want you to use, with IP
    numbers 10.0.0.1 and 10.1.0.1. Then, in your named.conf file, inside the opening
    section called "options" insert these lines:


    ```

    forward first;

    forwarders {

    10.0.0.1;

    10.1.0.1;

    }

    ```


    Restart your nameserver and test it with nslookup. Should work fine.


    # 3.3. Congratulations


    Now know how to set up a caching named. Take a beer, milk, or whatever you prefer
    to celebrate it.'
