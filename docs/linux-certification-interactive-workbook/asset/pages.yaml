    +   - read raw (G)


    This parameter controls whether or not the server will support the raw

    read SMB requests when transferring data to clients.


    If enabled, read raw allows reads of 65535 bytes in one packet. This typ-

    cically provides a major performance benefit.


    However, some clients either negotiate the allowable block size incor-

    rect or are incapable of supporting larger block sizes, and for these

    clients you may need to disable read raw.


    In general this parameter should be viewed as a system tuning tool and

    left severely alone. See also "write raw".


    **Default: read raw = yes**


    +   - read size (G)


    The option "read size" affects the overlap of disk reads/writes with net-

    work reads/writes. If the amount of data being transferred in several of

    the SMB commands (currently SMBwrite, SMBwriteX and SMBreadbread)

    is larger than this value the server begins writing the data before it

    has received the whole packet from the network, or in the case of SM-

    Breadbread, it begins writing to the network before all the data has been

    read disk.


    This overlapping works best when the speeds of disk and network access

    are similar, having very little effect when the speed of one is much

    greater than the other.


    The default value is 2048, but very little experimentation has been done

    yet to determine the optimal value, and it is likely that the best value will'
