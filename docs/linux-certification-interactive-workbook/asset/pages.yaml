  md: '# Appendix H: NFS Documentation 541


    Fix: straighten name resolution.


    +   3. The file system was mounted after NFS was started (on that server). In
    that case the server was exporting underlying mount point, not the mounted filesystem.


    Fix: Shut down NFSd and restart it.


    Note: The clients that had the underlying mount point mounted will get problems
    accessing it after the restart.


    +   4. The date is wildly off on one or both machines (this can mess up make)


    Fix: Get the date set right.


    The HOWTO author recommends using NTP to synchronize clocks. Since there are export
    restrictions on NTP in the US you have to get NTP for debian, redhat or slackware
    from ftp://ftp.hacktic.nl/pub/replay/pub/linux or a mirror.


    +   5. The server can not accept a mount from a user that is in or mount via more
    than 8 groups.


    Fix: decrease the number of groups the user is in or mount via a different user.


    +   8. FAQs


    This is the FAQ section. Most of it was written by Alan Cox.


    +   1. I get a lot of ''stale nfs handle'' errors when using Linux as a nfs server.


