    up. Useful with the g and c flags.


    # Tar Long File Names


    smclient''s tar option now supports long file names both on backup and restore.
    However, the full path name of the file must be less than 1024 bytes. Also, when
    a tar archive is created, smclient''s tar option places all files in the archive
    with relative names, not absolute names.


    # Tar Filenames


    All file names can be given as DOS path names (with \ as the component separator)
    or as UNIX path names (with / as the component separator).'
