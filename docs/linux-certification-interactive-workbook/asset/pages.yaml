  md: '# Lab 1.1: The Current System TCP/IP Values


    Look in the man pages for the following: /etc/hosts hostname telnet ifconfig tcp/ip
    ethernet netstat traceroute ping ifconfig


    # TCP/IP


    By far the most common way to connect your UNIX box to a network is with ethernet
    and TCP/IP. While other networking schemes will work and are often used, your
    system will practically always start off with these two. TCP/IP stands for Transmission
    Control Protocol/Internet Protocol. The name refers to two layers of the networking
    protocol that are discussed very well in many books about the Internet and networking.
    The Internet is a TCP/IP-based network, so an understanding of networking will
    help you to better understand how your system will work on the Internet. The standard
    version of TCP/IP is called IPv4. There is a newer version of TCP/IP that allows
    for more hosts and is called IPv6. This text will only talk about IPv4 networks.


    # TCP/IP ADDRESS


    The TCP/IP network address can be broken down into the following grouping:


    WWW.XXX.YYY.ZZZ


    This is made up of 4 groups of 3 numbers. Each group of numbers can vary from
    0 to 255—not 0 to 999—because this number is actually based on a series of binary
    numbers. These numbers can be either 0 or 1, and each group can have only 8 binary
    numbers. In mathematical terms, this is 2^8, which equals 256. Because there are
    256 numbers from 0 to 255, this gives us our addresses.


    +   FOR EXAMPLE:


    The following are TCP/IP addresses:


    ```

    9.7.254.117

    172.16.1.3

    210.1.19.99

    ```'
  merge: -1
  pgno: 28
- img_proc: true
  md: '# Lab 1.1: The Current System TCP/IP Values


    However, in practice, the numbers 0 and 255 are not used for the address of a
    host. The number 0 is typically reserved for the network address. This is the
    address used by routers and other hosts to access the network.


    # FOR EXAMPLE:


    The following are network addresses:


    +   - 9.0.0.0

    - 172.16.0.0

    - 210.1.19.0


    # BROADCAST ADDRESS


    The number 255 is used as part of the broadcast address. This is the address that
    is used to send general information from a server to other servers on the network.
    All servers will, in turn, listen on this address for information that is being
    sent out. Basically, wherever you have a 0 in the network address, you can replace
    it with a 255.


    # FOR EXAMPLE:


    +   - 925.255.255.255

    - 172.16.255.255

    - 210.1.19.255


    # NETWORK CLASSES


    TCP/IP networks are broken up into three classes in order to set the maximum number
    of hosts per network and the maximum number of networks. The value used for WWW
    (the first group of three numbers) will determine its network class. The classes
    differ in the number of possible networks and the number of hosts per network.
    In Table 1.1, the values for XXX, YYY, and ZZZ will vary from 1 to 254. The table
    summarizes the features of the various classes of networks.


    The remaining values for XXX, ranging from 224 to 254, are for special types of
    networks. You will note that the XXX value of 127 is not listed in Table 1.1.
    This is a special address called the loopback or local address; it is used by
    the host to connect to itself and can be used even if you have not set up a Network
    Interface Card (NIC). The only address that is used in this range is 127.0.0.1.'
  merge: -1
