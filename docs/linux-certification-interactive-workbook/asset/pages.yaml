    A packet destined for an IP address 10.23.15.69 will go out the port with the
    address 10.23.34.198. Let''s say, in Figure 2.2, you want to send a packet from
    host1 to host3 which is 172.20.75.135. The packet first enters router1. The router
    then looks in its tables and sees that the address 172.20.75.135 is accessible
    from its NIC card with the address 172.20.75.71. It then sends the packet to host3.


    However, if the router receives a packet destined for an address of 192.16.17.15,,
    it does not initially know what to do with it. It can either return the packet
    with a message saying that the destination is unknown, or it can pass the packet
    to the default router. The default router is where you send a packet of data when
    you don''t know where to send it. Host1 must first establish router1 as a default
    router, and then router1 will search its tables. If the network is not a local
    network, the packets are passed on.


