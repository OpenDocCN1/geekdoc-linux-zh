- img_proc: true
  md: '# Y2K


    Samba is year 2000 compliant so long as the underlying operating system that Samba
    is running upon are year 2000 compliant (Linux is, as are most modern UNIX systems,
    along with VMS, MVS and many others that Samba runs on.).


    For a much more detailed discussion and the latest information see http://samba.anu.edu.au/samba/y2k.html


    # CASE SENSITIVE


    Many Microsoft clients and applications cannot handle case sensitive servers.
    They often change the case of a filename before sending it over the wire.


    In Samba, Just use "short preserve case = yes" and "preserve case = yes". Never
    use "case sensitive = yes"


    # COMP.PROTOCOLS.SMB


    FAQ about comp.protocols.smb:


    The newsgroup comp.protocols.smb is quite separate from the samba mailing list.
    Someone from outside the Samba team was gatewaying messages from the Samba mailing
    list to comp.protocols.smb for a while hopefully this has stopped now.


    comp.protocols.smb does contain a lot of discussion about Samba so it is often
    a useful resource for Samba users.


    For info on accessing usenet newsgroups like comp.protocols.smb please ask a local
    internet guru. The Samba Team has no way of knowing how your local news system
    is set up we can''t help you.


    # DONT DESCEND & SECURITY


    Dont descend is not meant to be a security feature, it''s an administrative convenience.
    It can be easily bypassed.


    It is meant for things like /proc to prevent utilities like file manager from
    recursing themselves to death in a filesystem that has links back into it-self.


    Please use the underlying unix security of file permissions to give you real security.'
