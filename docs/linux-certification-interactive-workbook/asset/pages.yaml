  md: '# Appendix E: Samba Man Pages 427


    by all desired, but this is not necessary for correct operation of the server
    and is not recommended. A sample configuration file "smb.conf.sample" is supplied
    with the source to the server—this may be renamed to "smb.conf" and modified to
    suit your needs.


    The remaining notes will assume the following:


    +   - smbd (the server program) installed in /usr/local/samba/bin

    - smb.conf (the configuration file) installed in /usr/local/samba/lib

    - log files stored in /var/adm/smblogs


    The server may be run either as a daemon by users at startup, or it may be run
    from a meta-daemon as inetd upon request. If run as a daemon, the server will
    always be ready, so starting sessions will be faster. If run from a meta-daemon
    some memory will be saved and utilities such as the tcpd TCP-wrapper may be used
    for extra security. For serious use file it is recommended that smbd be run as
    a daemon.


    When you''ve decided, continue with either RUNNING THE SERVER AS A DAEMON OR RUNNING
    THE SERVER ON REQUEST.


    # RUNNING THE SERVER AS A DAEMON


    To run the server as a daemon from the command line, simply put the -D option
    on the command line. There is no need to place an ampersand at the end of the
    command line—the -D option causes the server to detach itself from the tty anyway.


    Any user can run the server as a daemon (execute permissions permitting, of course).
    This is useful for testing purposes, and may even be a temporary substitute for
    something like ftp. When run this way, however, the server will only have the
    privileges of the user who ran it.


    To ensure that the server is run as a daemon whenever the machine is started,
    and to ensure that it runs as root so that it can serve multiple clients, you
    will need to modify the system startup files. Wherever appropriate (for example,
    in /etc/rc), insert the following line, substituting port number, log file location,
    configuration file location and debug level as desired:'
