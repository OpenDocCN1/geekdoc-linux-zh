  md: '# LAB 4.1


    # DETERMINE YOUR CURRENT WINDOWS NETWORK CONFIGURATION


    LAB OBJECTIVES

    After this Lab, you will be able to:

    * Determine Your Current Windows Network Configuration

    * Set up and Log into Your PC as a Windows Network User

    * Verify your Windows Network Environment


    Look in the man pages for the following: Samba, smbd, smb.conf, smb


    # THE WINDOWS REALM


    The Windows SMB-based network is based on the basic premise that all systems on
    the network are relative equals. This allows you to set up a network at home with
    two PCs with ethernet cards and perhaps an ethernet hub. This lowers the cost
    of network computing considerably. However, SMB network packets are not routable
    in the traditional sense.'
  merge: -1
  pgno: 150
- img_proc: true
  md: '# Lab 4.1: Determine Your Current Windows Network Configuration


    They cannot be sent over the Internet without being enclosed in TCP/IP packets.
    This also gives a certain amount of security to your network if it is SMB-based,
    since the SMB packets stay on your network and don''t go out to the Internet.


    There are three ways to categorize an SMB-based network:


    +   * Peer to peer—This is where all PCs can be either a client, server, or both
    at the same time.

    * Workgroups—This extends the concept of peer-to-peer networks, whereby the network
    is broken up into groups that have the same group name and can share resources.
    Every PC on the network needs to keep track of the login ids locally and passwords
    for each account.

    * Domains—A domain has a central authority that the domain controller keeps track
    of login rights, passwords, and various user account information. There can be
    primary and secondary domain controllers.


    > There are many excellent discussions of SMB-based networking and many authors
    far more knowledgeable of the topic than one. You should pick up one of these
    books if you are interested in delving into the depths of MS networking. This
    book will help you modify your computer to talk the language of SMB and share
    files.


    # LAB 4.1 EXERCISES


    # 4.1.1 DETERMINE YOUR CURRENT WINDOWS NETWORK CONFIGURATION


    Your MS Windows-based computer should already be set up to do Windows networking
    and TCP/IP. You will be determining your current features and modifying them to
    match the Samba defaults. You should follow the standard Windows directions and
    setup procedures to establish your MS Windows network initially.


    In this Exercise, we will determine the current SMB characteristics of your PC.
    This will be done in Windows 95. If you are running Windows 98, Windows 2000,
    or NT, you may have to make some adjustments to the steps that follow.'
