  md: '# Appendix E: Samba Man Pages 425


    This parameter is not normally specified except in the above situation.


    +   - **s configuration file** The file specified contains the configuration details
    required by the server. The information in this file includes server-specific
    information such as what printcap file use, as well as descriptions of all the
    services the server is to provide. See also `smb.conf (5)` for more information.

    The default configuration file name is determined at compile time.

    - **i scope** This specifies a NetBIOS scope that the server will use to communicate
    with scopes, when generating NetBIOS names. Details on the use of NetBIOS scopes,
    see `rfc1001.txt`. NetBIOS scopes are very rarely used, only set this parameter
    if you are the system administrator in charge of all the NetBIOS systems you communicate
    with.

    - **-h** Prints the help information (usage) for smbd.

    - **-P** Passive option. Causes smbd not to send any network traffic out. Used
    for debugging by the developers only.


    # FILES


    # /ETC/INETD.CONF


    If the server is to be run by the inet meta-daemon, this file must contain suitable
    startup information for the meta-daemon. See the section INSTALLATION below.


    # /ETC/RC


    (or whatever initialization script your system uses.


    If running the server as a daemon at startup, this file will need to contain an
    appropriate startup sequence for the server. See the section INSTALLATION below.


    # /ETC/SERVICES


    If running the server via the meta-daemon, this file must contain a mapping of
    service name (e.g., netbios-ssn) to service port (e.g., 139) and protocol type
    (e.g., tcp). See the section INSTALLATION below.


    # /USR/LOCAL/SAMBA/LIB/SMBB.CONF


    This is the default location of the smb.conf server configuration file. Other
    common places that systems install this file are `/usr/samba/lib/smb.conf` and
    `/etc/smb.conf`.'
