    +   - **Im announce (G)**


    This parameter determines if **nmbd** will produce Lanman broadcasts needed by
    **OS/2** clients in order to see the Samba server in their browse list. This parameter
    can have three values, "true", "false", or "auto". The default is "auto". If set
    to "false" Samba will never produce these broadcasts. If set to "true" Samba will
    produce Lanman announce broadcasts at a frequency set by the parameter "Im interval".
    If set to "auto" Samba will not send Lanman announce by default but will listen
    for them. If it hears a broadcast on the wire it will then start sending them
    at a frequency set by the parameter "Im interval".


    See also **"Im interval"**.


    **Default:** 1m announce = auto


    **Example:** 1m announce = true


    +   - **Im interval (G)**


