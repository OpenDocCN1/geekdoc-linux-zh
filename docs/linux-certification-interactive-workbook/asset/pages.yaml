  md: '# Lab 3.1: Your Current Nameserver Configuration


    ![](img/4e4139af9b1671e6d87bfdaa638563a9_122_0.png)


    # Figure 3.2 The Detailed Process of Resolving a Name to an IP Address


    The name-to-address-resolution process goes as follows:


    +   1. A query is first sent to your local box to see if the address is stored
    in /etc/hosts, a DNS file, or cache. If it is found, then it is returned to the
    process, and the process uses this IP address to connect to the destination.

    2. If the address is not found, then a query is sent to the local nameserver,
    which is usually a department nameserver. If the IP address is found, then it
    is returned to your local box, which passes it to the process.

    3. If it is not on the local nameserver, the request goes to the domain nameserver,
    which then attempts to resolve either the domain nameserver or the actual IP address.

    4. If the domain nameserver cannot find either the domain nameserver or the IP
    address, the request is sent out to the Internet and eventually will get to the
    root nameserver if the addresses are not found somewhere along the way.

    5. The root nameserver will return the address of the nameserver for the domain
    where the destination is located.'
  merge: -1
  pgno: 122
- img_proc: true
  md: '# Lab 3.1: Your Current Nameserver Configuration


    +   6. The address is returned to the domain nameserver, which then queries the
    nameserver of the destination domain.

    7. The destination domain nameserver will then return the IP address of the destination
    to your domain nameserver. The destination domain nameserver may have to query
    other nameservers in its domain.

    8. Your domain nameserver will return the IP address of the destination to your
    local nameserver.

    9. This address will then be passed on to your local box.

    10. The process then uses that IP address to connect to the destination.


