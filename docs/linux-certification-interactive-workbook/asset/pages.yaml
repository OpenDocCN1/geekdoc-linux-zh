- img_proc: true
  md: '# 400 Appendix E: Samba Man Pages


    The map file is parsed line by line. Each line should contain a single UNIX username
    on the left then a ''='' followed by a list of usernames on the right. The list
    of usernames on the right may contain names of the form @group in which they will
    match any UNIX username in the group. The special client name ''*'' is a wildcard
    and matches any name. Each line of the map file may be up to 1023 characters.


    The file is processed on each line by taking the supplied username and comparing
    it with each username on the right hand side of the ''='' signs. If the supplied
    name matches any of the names on the right hand side then it is replaced with
    the name on the left. Processing continues with the next line.


    If any line begins with a ''#'' or a '';'' then it is ignored


    If any line begins with an ''!'' then the processing will stop after that line
    if a mapping was done by the line. Otherwise mapping continues with every line
    being processed. Using ''!'' is most useful when you have a wildcard mapping line
    later in the file.


    For example to map the name "admin" or "administrator" to the UNIX name "root"
    you would use:


    ```

    root = admin administrator

    ```


    Or to map anyone in the UNIX group "system" to the UNIX name "sys" you would use:


    ```

    sys = @system

    ```


    You can have as many mappings as you like in a username map file.


    If your system supports the NIS NETGROUP option then the netgroup database is
    checked before the /etc/group database for matching groups.


    You can map Windows usernames that have spaces in them by using double quotes
    around the name. For example:


    ```

    tridge = "Andrew Triggedell"

    ```


    would map the windows username "Andrew Triggedell" to the unix username-tridge.'
  merge: -1
  pgno: 425
- img_proc: true
  md: '# Appendix E: Samba Man Pages 401


    The following example would map mary and fred to the unix user sys,

    map the rest to guest. Use the note of the ''!'' to tell Samba to stop

    processing if it gets a match on that line.


    ```

    sys = mary fred

    guest = *

    ```


    Note that the remapping is applied to all occurrences of usernames. This

    if you connect to "server\fred" and "fred" is remapped to "mary"

    then you will actually be connecting to "\server\mary" and will need

    to supply a password suitable for "mary" and not "fred". The only exception

    to this is the username passed to the "password server" (if you have

    one). The password server will receive whatever username the client supplies without
    modification.


    Also note that no reverse mapping is done. The main effect this has is

    with printing. Users who have been mapped may have trouble deleting

    print jobs as PrintManager under WfWg will think they don''t own the

    print job.


    # Default: no username map


    Example: username map = /usr/local/samba/lib/users.map


    +   - valid chars (S)


    The option allows you to specify additional characters that should be

    considered valid by the server in filenames. This is particularly useful for

    national character sets, such as adding u-umlaut or a-ring.


    The option takes a list of characters in either integer or character form

    with spaces between them. If you give two characters with a colon be-

    tween then it will be taken as an lowercase:uppercase pair.


    If you have an editor capable of entering the characters into the config

    file it is probably easiest to use this method. Otherwise you can

    specify the characters in octal, decimal or hexadecimal form using the

    usual notation.


    For example to add the single character ''z'' to the charset (which is a

    pointless thing to do as it''s already there) you could do one of the fol-lowing.'
  merge: -1
  pgno: 426
- img_proc: true
  md: '# 402 Appendix E: Samba Man Pages


    valid chars = %

    valid chars = z:Z

    valid chars = 0132:0172


    The last two examples above actually add two characters, and alter the uppercase
    and lowercase mappings appropriately.


    Note that you MUST specify this parameter after the "client code page" parameter
    if you have both set. If "client code page" is set after the "valid chars" parameter
    the "valid chars" settings will be overwritten.


    See also the "client code page" parameter.


    # Default:


    Samba defaults to using a reasonable set of valid characters for English systems


    Example valid chars = 0345:0305 0366:0326 0344:0304


    The above example allows filenames to have the Swedish characters in them.


    NOTE: It is actually quite difficult to correctly produce a "valid chars" line
    for a particular system. The process tino@ausburg.net has written a package called
    "validchars" which will automatically produce a complete "valid chars" line for
    a given client system. Look in the examples/validchars/ subdirectory of your Samba
    source distribution for this package.


    +   - valid users (S)


    This is a list of users that should be allowed to login to this service. Names
    starting with ''@'', ''+'' and ''&'' are interpreted using the same rules as described
    in the "invalid users" parameter.


    If this is empty (the default) then any user can login. If a username is in both
    this list and the "invalid users" list then access is denied for that user.


    The current servicename is substituted for "%S". This is useful in the [homes]
    section.


    See also "invalid users".'
