- img_proc: true
  md: '# Appendix E: Samba Man Pages 413


    By default, the client writes messages to standard output—typically the user''s
    tty.


    +   - U username This specifies the user name that will be used by the client
    to make a connection, assuming your server is not a downlevel server that is running
    a protocol level that uses passwords on shares, not on usernames.


    Some servers are fussy about the case of this name, and some insist that it must
    be a valid NetBIOS name.


    If no username is supplied, it will default to an uppercase version of the environment
    variable USER or LOGNAME in that order. If no username is supplied and neither
    environment variable exists the username “GUEST” will be used.


    If the USER environment variable contains a ''%'' character, everything after
    that will be treated as a password. This allows you to set the environment variable
    to USER=username&password so that a password is not passed on the command line
    (where it may be seen by the ps command).


    If the service you are connecting to requires a password, it can be supplied using
    the -U option, appending a percent symbol (“%”) then the password to username.
    For example, to attach to a service as user “fred” with password “secret”, you
    would specify:


    ```

    -U fred%secret

    ```


    on the command line. Note that there are no spaces around the percent symbol.


    If you specify the password as part of username then the -N option (suppress prompt)
    is assumed.


    If you specify the password as part of username AND as part of username the password
    will take precedence. Putting nothing before or nothing after the percent symbol
    will cause an empty username or an empty password to be used, respectively.


    The password may also be specified by setting up an environment variable called
    PASSWORD that contains the users password. Note that this may be very insecure
    on some systems but on others allows users to script smclient commands without
    having a password appear in the command line of a process listing.'
  merge: -1
  pgno: 438
- img_proc: true
  md: '# 414 Appendix E: Samba Man Pages


    Note: Some servers (including OS/2 and Windows for Workgroups) insist on an uppercase
    password. Lowercase or mixed case passwords may be rejected by these servers.


    Be cautious about including passwords in scripts or in environment variable. Also,
