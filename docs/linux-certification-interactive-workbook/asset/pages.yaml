    # SAMBA


    # 23 OCT 1998


    # NAME


    smb.conf—The configuration file for the Samba suite


    # SYNOPSIS


    smb.conf The smb.conf file is a configuration file for the Samba suite. smb.conf
    contains runtime configuration information for the Samba programs. The smb.conf
    file is designed to be configured and administered by the swat (8) program. The
    complete description of the file format and possible parameters are held here
