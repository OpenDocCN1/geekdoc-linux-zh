  md: '# Lab 2.1: Setting Up TCP/IP


    This shows that the default nameserver is ns1.mynet1.mynet.net and the address
    of the server is 172.16.1.10


    b) If you received any errors from the nslookup command, what do you think caused
    them?


    Answer: There are several possible errors. Some of them are:


    ```

    [root@wheels /root]# nslookup

    *** Can''t find server name for address 172.16.1.3: No response from server

    *** Default servers are not available

    [root@wheels /root]#

    ```


    These errors are caused by the fact that the nameserver that is listed in the
    /etc/resolv.conf file, whose address is 173.16.1.3, is not responding to a request
    for nameservices. Another error you get is:


    ```

    [root@wheels /root]# nslookup

    Default Server: wheels

    Address: 0.0.0.0

    ```


    This can be caused by the fact that you do not have a /etc/resolv.conf file or
    it is improperly set up.


    c) Now you should use the nslookup command to find the information about the host
    rs.internic.net. Explain what you see.


    Answer: You will see results similar to the following:


    ```

    [root@tux /root]# nslookup rs.internic.net

    Default Server: ns1.mynet1.mynet.net

    Address: 172.16.1.10

    Non-authoritative answer:

    Name: rs.internic.net

    Address: 198.41.0.6

    [root@tux /root]#

    ```


    Here, you see the name of the local nameserver, its address, the name of the host
    you are trying to get information about, and its address. The fact that it says
    the answer is non-authoritative just means that the name cannot be verified to
    be absolutely true. This is important if you are concerned about security, but
    is beyond this current discussion. This server is chosen because it is one of
    the most important servers on the internet. It keeps track of or has access to
    a lot of information about various servers'
