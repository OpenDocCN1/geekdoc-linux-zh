  md: '# Appendix E: Samba Man Pages


    Default: announce version = 4.2


    Example: announce version = 2.0


    +   - auto services (G)


    This is a list of services that you want to be automatically added to the browse
    lists. This is most useful for homes and printers services that would otherwise
    not be visible.


    Note if you just want all printers in your printcap file loaded then the “load
    printers” option is easier.


    Default: no auto services


    Example: auto services = fred lp colorlp


    +   - available (S)


    This parameter lets ‘turn off’ a service. If ‘available = no’, then ALL attempts
    to connect to the service will fail. Such failures are logged.


    Default: available = yes


    Example: available = no


    +   - bind interfaces only (G)


    This global parameter allows the Samba admin to limit what interfaces on a machine
    will serve smb requests. If affects file service smbd and name service nmbd in
    slightly different ways.


    For name service it causes nmbd to bind to ports 133 and 138 on the-interfaces
    listed in the ‘interfaces’ parameter. nmbd also binds to the ‘all addresses’ interface
    (0.0.0.0) on ports 137 and 138 for the purposes of reading broadcast messages.
    If this option is not set then nmbd will service name requests on all of these
    sockets. If ‘bind interfaces only’ is set nmbd will check the source address of
    any packets coming in the broadcast sockets and discard any that do not match
    the cache addresses of the interfaces in the ‘interfaces’ parameter list. As unicast
    packets are received on the other sockets it allows nmbd to refuse to serve names
    to machines that send packets that arrive through interfaces not listed in the
    “interfaces” list. IP address spoofing does defeat this simple check, however
    so it must not be used seriously as a security feature for nmbd.'
