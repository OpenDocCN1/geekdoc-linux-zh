  md: '# Appendix D: Samba Documentation 279


    Samba NT LAN Manager 1.0? Samba''s version of NT LM 0.12?


    CIFS 1.0 NT LAN Manager 1.0 Really NT LM 0.12 plus a bit?


    Some variants introduced new SMBs, some simply changed the format of existing
    SMBs or responses, and some variants did both.


    **Security** The SMB model defines two levels of security:


    **Share level.** Protection is applied at the share level on a server. Each share
    can have a password, and a client only needs password to access all files under
    this share. This was the first security model that SMB had and is the only security
    model available in the Core and CorePlus protocols. Windows for Workgroups vserver.exe
    implements share level security by default, as does Windows 95.


    **User Level.**Protection is applied to individual files in each share and is
    based on user access rights. Each user (client) must log in to the server and
    be authenticated by the server. When it is authenticated, the client is given
    a UID which it must present on all subsequent accesses to the server. This model
    has been available since LAN Manager 1.0.


    **Browsing the network** Having lots of servers out in the network is not much
    good if users cannot find them. Of course, clients can simply be configured to
    know about the servers in their environment, but this does not help when new servers
    are to be introduced or old ones removed.


    To solve this problem, browsing has been introduced. Each server broadcasts information
    about its presence. Clients listen for these broadcasts and build up browse lists.
    In a NetBEUI environment, this is satisfactory, but in a TCP/IP environment, problems
    arise. TCP/IP broadcasts are not usually sent outside the subnet in which they
    originate (although some routers can selectively transport broadcasts to other
    subnets).


    Microsoft have introduced browse servers and the Windows Internet Name Service
    (WINS) to help overcome these problems.


    **CIFS: The latest incarnation?** Microsoft and a group of other vendors (Digital
    Equipment, Data General, SCO, Network Appliance Corp, etc) are engaged in developing
    a public version of the SMB protocol. It is'
  merge: -1
  pgno: 304
- img_proc: true
  md: '# 280 Appendix D: Samba Documentation


    expected that CIFS 1.0 will be essentially NT LM 0.12 with some modifications
    for easier use over the Internet.


    An Example SMB Exchange The protocol elements (requests and responses) that clients
    and servers are exchanged called SMBs. They have a specific format that is very
    similar for both requests and responses. Each consists of a fixed size header
    portion, followed by a variable sized parameter and data portion.


    After connecting to the NetBIOS level, either via NBF, NetBT, etc, the client
    is ready to request services from the server. However, the client and server must
    first identify which protocol variant they understand.


    The client sends a negprot SMB to the server, listing the protocol dialects that
    it understands. The server responds with the index of the dialect that it wants
    to use, or 0FFFF if one of the dialects was acceptable.


    Dialects more than the Core and CorePlus protocols supply information in the negprot
    response to indicate their capabilities (max buffer size, canonical file names,
    etc).


    Once a protocol has been established. The client can proceed to login to the server,
    if required. They do this with a sesset SMB. The response indicates whether or
    not they have supplied a valid username password pair and if so, can provide additional
    information. One of the most important aspects of the response is the UID of the
    logged on on user. This UID must be submitted with all subsequent SMBs on that
    connection to the server.


    Once the client has logged on (and in older protocols-Core and CorePlus-you cannot
    logon), the client can proceed to connect to a tree.


    The client sends a tcon or tconX SMB specifying the network name of the share
    they wish to connect to, and if all is kosher, the server responds with a TID
    that the client will use in all future SMBs relating to that share.


    Having connected to a tree, the client can now open a file with an SMB, followed
    by reading it with read SMBs, writing it with write SMBs, and closing it with
    close SMBs.


    # SMB Clients and Servers Currently Available


    There are a few SMB clients available today and a relatively large number of servers
    available from a range of vendors.'
  merge: -1
  pgno: 305
- img_proc: true
  md: '# Appendix D: Samba Documentation


    The main clients are from Microsoft, and are included in Windows for WorkGroups
    3.x, Windows 95, and Windows NT. They are most evident when you use the File Manager
    or the Windows 95 Explorer, as these allow you to connect to servers across the
    network. However they are also used when you you open files using a UNC (universal
    naming convention).


    Some other clients that I am aware of:


    +   - smbclient from Samba


    +   - smbfs for Linux


    +   - SMBLib (an SMB client library that is in development)


    Server implementations are available from many sources. Some that I am aware of:


    +   - Samba


    +   - Microsoft Windows for Workgroups 3.x


    +   - Microsoft Windows 95


    +   - Microsoft Windows NT


    +   - The PATHWORKS family of servers from Digital


    +   - LAN Manager for OS/2, SCO, etc


    +   - VisionFS from SCO


    +   - TotalNET Advanced Server from Syntax


    +   - Advanced Server for UNIX from AT&T (NCR)?


    +   - LAN Server for OS/2 from IBM


    The next two sections will discuss each of the above in turn.


    # SMB Servers


    Before discussing SMB servers, it is useful to discuss the difference between
    Workgroups and Domains.'
  merge: -1
  pgno: 306
- img_proc: true
  md: '# Appendix D: Samba Documentation


    Workgroups A workgroup is a collection of computers that each maintain their security
    information. With Windows for Workgroups, each server is pretty off in share level
    security. Windows 95 can pass user authentication off to an NT or LAN Manager
    server.


    However, the point of a workgroup is that security is distributed, not centralized.


    Domain A domain is a collection of computers where security is handled centrally.
    Each domain has one or more domain controllers. There is usually a primary domain
    controller and several backup domain controllers. The domain controllers maintain
    account style information related to users (clients), like account names, encrypted
    passwords, authorized hours of use, groups the user belongs to, etc.


    Samba Samba is a freely available SMB server for UNIX, OpenVMS (centrally posted
    and maybe not very stable) developed by Andrew Trigdell and maintained by a loosely
    knit group of people all over the world. Samba runs on a many UNIX variants (Linux,
    Solaris, SunOS, HP-UX, ULTRIX, DEC OSF/1, Digital UNIX, Dynix (Sequent), IRIX
    (SGI), SCO Open Server, DG-UNIX, UNIXWARE, AIX, BSDI, NetBDS, NEXTSTEP, A/UX,
    etc).


    Samba implements the NT LM 0.12 protocol dialect. Samba can now participate in
    a domain (both as a PDC and a Member of a domain), and it can participate in browsing
    and be a browse master. Samba can also process logon requests for Windows 95 systems


    Samba implements user security, but shares can be public where access is mapped
    to the owner etc of the share.


    Microsoft Windows Servers Microsoft has a number of SMB server implementations
    for the Windows range of operating systems. These are not separate products, rather,
    they are integral to the appropriate version of the Windows operating system.
    However, they can be switched either though the Control Panel or at the command
    line (net stop server at DOS prompt.


    It is clear from the fact that the Windows 95 and Windows NT SMB servers react
    differently to certain sequences of SMBs, that Microsoft do not use the same code
    for each of these servers (although the Windows for Workgroups and Windows 95
    implementations may be derived from the same code).'
  merge: -1
  pgno: 307
- img_proc: true
  md: '# Appendix D: Samba Documentation 283


    Windows for Workgroups 3.11 implements the Windows for Workgroups 3.0a protocol
    variant, and implements share level security.


    Windows 95 implements the NT LM 0.12 protocol level and implements both share
    and user level security.


    Windows NT implements the NT LM 0.12 protocol level and implements both share
    and user security.


    LAN Manager and LAN Manager for UNIX (LM/X) Microsoft and AT&T GIS ported various
    LAN Manager versions to the UNIX operating system. This code formed the basis
    of many SMB servers available for UNIX operating systems from many vendors.


    Some examples are: LM/X for SCO, LM Server for HP-UX (Advanced Server/9000), etc.


