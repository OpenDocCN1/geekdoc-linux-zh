  md: '# Lab 2.1: Setting Up TCP/IP 43


    determined by the IP address on the NIC card of the router and by the netmask
    that is used. So if you have the following characteristics:


    Router IP address: 172.16.1.3

    Netmask: 255.255.255.0


    any addresses that are less than 172.16.1.0 or greater than 172.16.1.255 are sent
    to the router address 172.16.1.3. The router will accept those packets. If it
    is directly connected to the network that the destination is on, it will pass
    the packet out on the NIC on that network. If it is not directly connected to
    this address on the network, it will pass it onto its own default router until
    the packet is received by the destination or the packets dies out, in which case
    you would get a “no response” or “host unreachable” message.


