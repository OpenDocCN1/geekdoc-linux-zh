  md: '# 426 Appendix E: Samba Man Pages


    This file describes all the services the server is to make available to clients.
    See smb.conf(5) for more information.


    # LIMITATIONS


    On some systems smbd cannot change uid back to root after a setuid() call. Such
    systems are called “trapdoor” uid systems. If you have such a system, you will
    be unable to connect from a client (such as a PC) as two different users at once.
    Attempts to connect the second user will result in \“access denied” or similar.


    # ENVIRONMENT VARIABLES


    # PRINTER


    If no printer name is specified to printable services, most systems will use the
    value of this variable (or “lp” if this variable is not defined) as the name of
    the printer to use. This is not specific to the server, however.


    # INSTALLATION


    It is recommended that the server software be installed under /usr/local/samba
    hierarchy, in a directory readable by all, writable only by root. The server program
    itself should be executable by all, as users may wish to run the server themselves
    (in which case it will of course run with their privileges). The server should
    NOT be SETID. On some systems it may be worthwhile to make smbd setgid to an empty
    group. This is because systems may have a security hole where daemon processes
    become a user can be attached to a debugger. Making the smbd file setgid to an
    empty group may prevent this hole from being exploited. This security hole and
    the suggested fix has only been confirmed on some old versions (pre-kernel 2.0)
    of Linux at this time was written. It is possible that this hole only exists in
    Linux, testing on other systems has thus far shown them to be immune.


    The server log files should be put in a directory readable and writable only by
    root, as the log files may contain sensitive information.


    The configuration file should be placed in a directory readable and writable only
    by root, as the configuration file controls security for the services offered
    by the server. The configuration file can be made readable'
  merge: -1
  pgno: 451
