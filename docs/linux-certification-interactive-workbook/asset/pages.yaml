    +   LAB OBJECTIVES

    After this Lab, you will be able to:

    * Set up Your /etc/exports File to Allow Mounting

    * Do a Remote NFS Mount


    In this Lab, you will learn how to share files using NFS. You will need two PCs
    or systems running NFS. While they both should be running Linux, NFS is pretty
    much the same on all UNIX systems, so one of them can be a UNIX system or PC running
    NFS.


    In these Exercises, you will be:


    +   * creating a mount point

    * creating or modifying the /etc/exports file to include the mount point

    * testing the mount on your local system


    This will be followed by Exercises to mount the drive from a remote system.'
