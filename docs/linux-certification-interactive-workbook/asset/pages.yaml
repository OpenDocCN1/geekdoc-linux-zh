  md: '# LAB 2.1: Setting Up TCP/IP


    # LAB 2.1


    # SETTING UP TCP/IP


    LAB OBJECTIVES

    After this Lab, you will be able to:

    * Determine Your Current Network Characteristics

    * Bring Down the Network Interface

    * Bring Up The Network Interface

    * Set up Your Host Table

    * Enable Client Name Resolution


    This Lab discusses how to set up TCP/IP on your box. Because of the various kinds
    of UNIX, it is impossible to cover all versions of UNIX and the various ways of
    setting up your networking and your addresses. This Lab focuses on using the command
    line to set up your TCP/IP networking in Linux. However, your system may have
    a very acceptable way of setting up the addressing using a menu. It is important
    to understand the command-line way of doing things in UNIX and Linux, because
    it is much faster than a menu and sometimes you can resolve issues quicker with
    the command line. The Lab Exercises assume you have root access on your Linux
    box. If you don''t have root access, you still run some of the commands, but you
    will not be able to change system characteristics.


    # THE DEVICE DRIVER


    A device driver allows your Linux kernel to talk to the actual hardware. Device
    drivers are usually written at very low levels of coding are often good candidates
    for writing in assembler language. Because of this, they tend not to port well
    from one version of UNIX to another and from one processor to another. The device
    driver is loaded when your machine is booting up. You can see what it looks like
    in Figure 2.1.'
  merge: -1
