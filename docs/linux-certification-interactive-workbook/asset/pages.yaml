  md: '# Appendix E: Samba Man Pages 353


    This parameter can take three different values, which tell smbd what to do with
    user login requests that don''t match a valid UNIX user in some way.


    The three settings are :


    +   - "Never”—Means login requests with an invalid password are rejected. This
    is the default.

    - "Bad User”—Means user logins with an invalid password are rejected, unless the
    username does not exist, in which case it is treated as a guest login and mapped
    into the “guest account"

    - "Bad Password”—Means user logins with an invalid password are treated as a guest
    login and mapped into the “guest account”. Note that this can cause problems as
    it means that any user incorrectly typing their password will be silently logged
    on a “guest”—and will not kn—there will be no message given to them they got their
    password wrong. Helpdesk services *hate* if you set the “map to guest” parameter
    this way :-.


    Note that this parameter is needed to set up “Guest” share services when using
    security modes other than this. This is because in these modes the name of the
    resource being requested is *not* sent to the server until after the server has
    successfully authenticated the client so the server cannot make authentication
    decisions at the correct time (connection to share) “Guest” shares.


    For people familiar with the older Samba releases, this parameter maps to the
    old compile-setting of the GUEST_SSETUP value in local.h.


    Default: map to guest = Never Example: map to guest = Bad User


    +   - max connections (S)


    This option allows the number of simultaneous connections to a service to be limited.
    If “max connections” is greater than 0 then connections will be refused if this
    number of connections to the service are already open. A value of zero means an
    unlimited number of connections may be made.


    Record lock files are used to implement this feature. The lock files will be stored
    in the directory specified by the “lock directory” option.'
  merge: -1
