- img_proc: true
  md: '# 328 Appendix E: Samba Man Pages


    +   - dos filetime resolution (S)


    Under the DOS and Windows FAT filesystem, the finest granularity on time resolution
    is two seconds. Setting this parameter for a share causes Samba to round the reported
    time down to the nearest two second boundary when a query call that requires one
    second resolution is made to smbd.


    This option is mainly used as a compatibility option for Visual C++ when used
    against Samba shares. If oflocks are enabled on a share, Visual C++ uses two different
    time reading calls to check if a file has changed since it was last read. One
    of these calls uses a one-second granularity, the other uses a two second granularity.
    As the two second call rounds any odd second down, if the file has a timestamp
    of an odd number of seconds then the two timestamps will not match and Visual
    C++ will keep reporting the file changed. Setting this option causes the two timestamps
    to match, and Visual C++ is happy.


    Default: dos filetime resolution = False


    Example: dos filetime resolution = True


    +   - dos filetimes (S)


    Under DOS and Windows, if a user can write to a file they can change the timestamp
    on it. Under POSIX semantics, only the owner of the file or root may change the
    timestamp. By default, Samba runs with POSIX semantics and refuses to change the
    timestamp on a file if the user smbd is acting on behalf of not the file owner.
    Setting this option to True allows DOS semantics and smbd will change the file
    timestamp as DOS requires.


    Default: dos filetimes = False


    Example: dos filetimes = True


    +   - encrypt passwords (G)


    This boolean controls whether encrypted passwords will be negotiated with the
    client. Note that Windows NT 4.0 SP3 and above also Windows will expect encrypted
    passwords unless a registry entry is changed. To use encrypted passwords in Samba
    see the file ENCRYPTION.txt in the Samba documentation directory docs/ shipped
    with the source code.'
  merge: -1
  pgno: 353
- img_proc: true
  md: '# Appendix E: Samba Man Pages 329


    In order for encrypted passwords to work correctly smbd must either have access
    to a local smbpassword (5) file (see the smbpassword (8) program for information
    on how to set up and maintain this file), or set the security= parameter to either
    "server" or "domain" which causes smbd to authenticate against another server.


    +   - exec (S)


    This is a synonym for preexec.


    +   - fake directory create times (S)


    NTFS and Windows VFAT systems keep a create time for all files and directories.
    This is not the same as the ctime—status change time—that Unix by default reports
    the earliest of the various times Unix keeps. Setting this parameter for a share
    causes Samba to always report midnight 1-1-1980 as the create time for directories.


    This option is mainly used as a compatibility option for Visual C++ used against
    Samba shares. Visual C++ generated makefiles have the object directory as a dependency
    for each object file, and a rule to create the directory. Also, when NMAKE compares
    timestamps it uses the creation time when examining a directory. The object directory
    will be created if it does not exist, but once it does exist it will always have
    an earlier timestamp than the object file contains.


    However, Unix time semantics mean that the create time reported by Samba will
    be updated whenever a file is created or deleted in the directory. NMAKE therefore
    finds all object files in the object directory bar the last one built are out
    of date compared to the directory and rebuilds them. Enabling this option ensures
    directories always predate their contents and an NMAKE build will proceed as expected.


    Default: fake directory create times = False


    Example: fake directory create times = True


    +   - fake oplocks (S)


    Oplocks are the way that SMB clients get permission from a server to locally cache
    file operations. If a server grants an oplock (opportunistic lock) then the client
    is free to assume it is the only one accessing the file and it will aggressively
    cache file data. With some oplock types the client may cache file open/close operations.
    This can give enormous performance benefits.'
  merge: -1
  pgno: 354
- img_proc: true
  md: '# 330 Appendix E: Samba Man Pages


    When you set "fake oplocks = yes" **smbd** will always grant oplock requests no
    matter how many clients are using the file.


    It is generally much better to use the real **oplocks** support rather than this
    parameter.


    If you enable this option on all read-only shares or shares that you know will
    only be accessed from one client at a time such as physically read-only media
    like CDROMs, you will see a big performance improvement on many operations. If
    you enable this option on shares where multiple clients may be accessing the files
    read-write at the same time you can get data corruption. Use this option carefully!


    This option is disabled by default.


    +   - **follow symlinks (S)**


    This parameter allows the Samba administrator to stop **smbd** from following
    symbolic links in a particular share. Setting this parameter to “No” prevents
    any file or directory that is a symbolic link from being followed (the user will
    get an error). This option is very useful to stop users from adding a symbolic
    link to /etc/passwd in their home directory for instance. However it will slow
    filename lookups down slightly.


    This option is enabled (i.e. **smbd** will follow symbolic links) by default.


    +   - **force create mode (S)**


    This parameter specifies a set of UNIX mode permissions that will *always* be
    set on a file created by Samba. This is done by bitwise ‘OR’ing these bits onto
    the mode bits of a file that is being created. The default for this parameter
    is (in octal) 000. The modes in this parameter are bitwise ‘OR’ed onto the file
