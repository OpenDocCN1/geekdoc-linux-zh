  md: '# Appendix E: Samba Man Pages 293


    # FILES


    # /ETC/INETD.CONF


    If the server is to be run by the inetd meta-daemon, this file must contain suitable
    startup information for the meta-daemon.


    # /ETC/RC


    (or whatever initialization script your system uses).


    If running the server as a daemon at startup, this file will need to contain an
    appropriate startup sequence for the server.


    # /USR/LOCAL/SAMBA/LIB/SMB.CONF


    This is the default location of the smb.conf server configuration file. Other
    common places that install this file are /usr/samba/lib/smb.conf and /etc/smb.conf.


    When run as a WINS server (see the wins support parameter in the smb.conf (5)
    man page), nmbd will store the WINS database in the file wins.dat in the var/locks
    directory configured wherever Samba was configured to install it.


    If nmbd is acting as a browse master (see the local master parameter in the smb.conf
    (5) man page), nmbd will store the browsing database in the file browse.dat in
    the var/locks directory configured wherever Samba was configured to install it.


    # SIGNALS


    To shut down an nmbd process it is recommended SIGKILL (-9) NOT be used, except
    as a last resort, as this may leave the name database in an inconsistent state.
    The correct way to terminate nmbd is to send it a SIGTERM (-15) and wait for it
    to die on its own.


    nmbd will accept SIGHUP, WHICH will cause it to dump out its namelists into the
    file namelist.debug in the /usr/local/samba/var/locks directory configured wherever
    Samba was configured to install itself. This will also cause nmbd to dump out
    it''s server database in the log.nmbd file. In addition, the debug level of nmbd
    may be raised by sending it a SIGUSR1 (kill -USR1 <nmbd-pid>) and lowered by sending
    it a SIGUSR2 (kill -USR2 <nmbd-pid>). This is to allow problems to be diagnosed,
    while still running at a normally low log level.'
