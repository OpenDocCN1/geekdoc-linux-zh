    | 100005 1 udp 745 mountd |

    | 100005 1 tcp 747 mountd |

    | 100003 2 udp 2049 nfs |

    | 100003 2 tcp 2049 nfs |


    As you see the portmapper has announced it''s services, and so has mountd and
    nfsd.


    If you get rpcinfo: can''t contact portmapper: RPC: Remote system error - Connection
