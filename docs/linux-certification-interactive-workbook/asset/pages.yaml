  md: '# Appendix C: Building Your Linux Home Network 229


    # THE NETWORK INTERFACE CARD


    The Network Interface Card, commonly known as the NIC, goes into the PC and is
    how the PC connects to the network. The term NIC is a generic term for any card
    that connects a device to a network. You can see the NIC in Figure C.1. The NIC
    card for the PC is typically 100 Mbps (megabytes per second), 100 Mbps or 10/100
    Mbps cards have dropped drastically in price, and you can usually get 10/100 Mbps
    card for about more than an 10 Mbps card. In general, 100 Mbps cards use RJ45
    connectors. The 100 Mbps and 10/100 Mbps cards are all RJ45. Ethernet combo cards
    that have both RJ45 and thin ethernet connectors are still relatively easy to
    find.


    The 100 Mbps cards are more recent devices, so you need to ensure that any card
    that you buy is fully supported by Linux. You can access the hardware compatibility
    lists at the various websites for vendors such as Red Hat and Caldera to determine
    if your nic card is supported. The website for Red Hat is at http://www.redhat.com
    and the website for Caldera is at http://www.caldera.com.


    # THE NETWORK HUB


    The network hub allows you to connect several systems. You see a hub displayed
    in Figure C.1. This is generally used for UTP ethernet-RJ45 cabling, although
    they can also have a thin ethernet or a specialized connector called an AUI connector.
    The only other type of hub that you might find is a token ring hub, which is rarely
    used in the home and is twice the price for all the hardware. You then need to
    decide on a speed. In a home environment, you will rarely hit the maximum transfer
    rate or 100 Mbps, unless you are doing a lot of graphics or file transfers back
    and forth.


    It is possible to connect or cascade two or more hubs together as shown in Figure
    C.2. If you do this, it is better to connect two or more hubs that are identical.
    While it is possible to connect 10 Mbps and 10/100 Mbps hubs, this can sometimes
    cause instabilities due to the different network characteristics. If you do this,
    you should be sure to test connectivity from all devices on the network. You should
    also be sure to get quality network cards components—in this case, to ensure a
    stable network. The old adage about getting what you pay for is true here also.
    You should read the documentation that comes with your hubs to be sure that there
    are no special limitations, as the number of hubs that can be cascaded together.'
