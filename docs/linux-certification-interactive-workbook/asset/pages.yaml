    # XXX ISN''T USER LEVEL SECURITY MODE


    This error message means you are using server level security with password server
    that isn''t in user level security mode. The password server code relies on being
    able to send username/password pairs and getting back a yes/no response. This
    isnt not possible unless the server is in user level security mode.


    The most common reasons for this problem are:


    +   1. you are trying to use a Win95 box as the password server. That won''t work.


    +   2. you are using a Samba server as the password server and that server is
    configured in share level security.'
