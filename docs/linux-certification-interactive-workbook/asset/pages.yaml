  md: '# Appendix E: Samba Man Pages


    The number and nature of diagnostics available depends on the debug used by the
    server. If you have problems, set the debug level to 3 and peruse the log files.


    Most messages are reasonably self-explanatory. Unfortunately, at the time this
    man page was created, there are too many diagnostics available in the source code
    to warrant describing each and every diagnostic. At this stage your best is still
    to grep the source code and inspect the conditions that gave rise to the diagnostics
    you are seeing.


    # SIGNALS


    Sending the smbd SIGHUP will cause it to re-load its smbd.conf configuration within
    a short period of time.


    To shut down a smbd process it is recommended that SIGKILL (-9) NOT be used, except
    as a last resort, as this may leave the shared memory area in an inconsistent
    state. The safe way to terminate a smbd is to send it SIGTERM (-15) and wait for
    it to die on its own.


    The debug level of smbd may be raised by sending it a SIGUSR1 (kill \<smbd-pid>)
    and lowered by sending it a SIGUSR2 (kill -USR2 \<smbd-pid>). This allows transient
    problems to be diagnosed, while still running at a normal log level.


    Note that the signal handlers send a debug write, they are not reentrant in smbd.
    You should wait until smbd is in a state of waiting for an incoming smb before
    issuing them. It is possible to make the signal handlers safe by un-blocking the
    signals before the select call and relocking them after, however this would affect
    performance.


