    # Lab 2.1: Setting Up TCP/IP


    Your UNIX or Linux server will access the nameservers to determine the IP address
    of a hostname. Your software can first check /etc/hosts and then check DNS services,
    the order can be switched by modifying /etc/nsswitch.conf. This can usually be
    configured on your box. It is a good policy to have at least two nameservers on
    your network: If one goes down, you have a fallback. Linux is an ideal nameserver
    because it can run well on an Intel 486, or even on a 386-based PC. The overhead
    of nameservices is very low. Nameservers are often referred to as DNS servers
    because the service they run is Domain Name Services, or DNS for short.


