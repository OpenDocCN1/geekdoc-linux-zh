  md: '# Appendix E: Samba Man Pages 423


    # DESCRIPTION


    This program is part of the Samba suite.


    **smbd** is the server daemon that provides filesharing and printing services
    to Windows clients. The server provides filespace and printer services to clients
    using the SMB (or CIFS) protocol. This is compatible with the Lan-Manager protocol,
    and can service LanManager clients. These include MSCLIENT 3.0 for DOS, Windows
    for Workgroups, Windows 95, Windows NT, OS/2, DAVE for Macintosh, and smbd for
    Linux.


    An extensive description of the services that the server can provide is given
    in the man page for the configuration file controlling the attributes of those
    services (**smbd.conf (5)**). This man page will not describe the services, but
    will concentrate on the administrative aspects of running the server.


    Please note that there are significant security implications to running this server,
    and the **smbd.conf (5)** manpage should be regarded as mandatory reading before
    proceeding with installation.


    A session is created whenever a client requests one. Each client gets a copy of
    the server for each session. This copy then services all connections made by the
    client during that session. When all connections from its client are closed, the
    copy of the server for that client terminates.


    The configuration file, and any files that it includes, are automatically reloaded
    every minute, if they change. You can force a reload by sending a SIGHUP to the
    server. Reloading the configuration file will not affect connections to any service
    that is already established. Either the user will have to disconnect from the
    service, or smbd killed and restarted.


    # OPTIONS


    +   - **D** If specified, this parameter causes the server to operate as a daemon.
    That is, it detaches itself and runs in the background, fielding requests on the
    appropriate port. Operating the server as a daemon is the recommended way of running
    smbd for servers that provide more than casual use file and print services.


    By default, the server will NOT operate as a daemon.'
  merge: -1
  pgno: 448
- img_proc: true
  md: '# 424 Appendix E: Samba Man Pages


    +   - -a If this parameter is specified, each new connection will append log messages
    to the log file. This is the default.

    - -o If this parameter is specified, the log files will be overwritten when opened.
    By default, the log files will be appended to.

    - -d debuglevel debuglevel is an integer from 0 to 10.


    The default value if this parameter is not specified is zero.


    The higher this value, the more detail will be logged to the log files about the
    activities of the server. At level 0, only critical errors and serious warnings
    will be logged. Level 1 is a reasonable level for day to running—it generates
    a small amount of information about operations carried out.


    Levels above 1 will generate considerable amounts of log data, and should only
    be used when investigating a problem. Levels above 3 are designed for use only
    by developers and generate HUGE amounts of log data, most of which is extremely
    cryptic.


    Note that specifying this parameter here will override the log level parameter
    in the smb.conf (5) file.


    +   - -1 log file If specified, log file specifies a filename for which informational
    and debug messages from the running server will be logged. The log file generated
    is never removed by the server although its size may be controlled by the max
    log size option in the smb.conf (5) file. The default log file name is specified
    at compile.

    - -O socket options See the socket options parameter in the smb.conf (5) file
    for details.

    - -p port number port number is a positive integer value. The default value if
    this parameter is not specified is 139.


    This number is the port number that will be used when making connections to the
    server from client software. The standard (well-known) port number for the SMB
    over TCP is 139, hence the default. If you wish to run the server as an ordinary
    user rather than root, most systems will require you to use a port number greater
    than 1024—ask your system administrator for help if you are in this situation.


    In order for the server to be useful by most clients, you should configure it
    on a port other than 139, you will require port redirection services on port 139,
    details of which are outlined in rfc1002.txt section 4.3.5.'
  merge: -1
  pgno: 449
