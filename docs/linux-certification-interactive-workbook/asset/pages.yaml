  md: '# CHAPTER 5


    # SHARING DATA IN AN NFS WORLD


    > It doesn''t matter what side of the road you drive on as long as the driver
    coming toward you shares the same philosophy about which to drive on.

    —Joe


    CHAPTER OBJECTIVES

    In this chapter, you will learn about:

    Exercises for the Great and Super User

    Setting Up NFS Page 192


    One of the earliest methods of sharing files in a UNIX system was by using the
    Network File System (NFS). This was developed by Sun Microsystems in the 1980s
    to share files and use other systems on the network for data storage. NFS is found
    on all versions of UNIX today and is included by default. There are versions available
    for all major computer operating systems. You can use NFS to make your Linux PC
    into a file-server. NFS is available for your Windows PC, but this is something
    you would need to buy or possibly find in the public domain.'
  merge: -1
