    +   * delete veto files (S)


    This option is used when Samba is attempting to delete a directory that contains
    one or more vetoed directories (see the ''veto files'' option). If this option
    is set to False (the default) then if a vetoed directory contains any non-vetoed
    files or directories then the directory delete will fail. This is usually what
    you want.


    If this option is set to True, then Samba will attempt to recursively delete any
    files and directories within the vetoed directory. This can be useful for integration
    with file serving systems such as NetTalk, which create meta-files within directories
    that you normally prevent DOS/Windows users from seeing (e.g. .AppleDouble)


    Setting ''delete veto files = True'' allows these directories to be transparently
    deleted when the parent directory is deleted (so long as the user has permissions
    to do so).


