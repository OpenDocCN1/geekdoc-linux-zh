    The reverse zone is the bit of the setup that seems to cause the most grief. It
    is used to find the host name if you have the IP number of a machine. Example:
    you are an IRC server and accept connections from IRC clients. However you are
    a Norwegian IRC server and so only want to accept connections from Norway and
    other Scandinavian countries. When you get a connection from the client C library
    is to tell you the IP number of the connecting machine because the IP number of
    the client is contained in all the packets that are passed over the network. Now
    you can now call a function gethostbyaddr that looks up the name of a host given
    the IP number. Ghostbyaddr will ask a DNS server, which will traverse the DNS
    looking for the machine. Supporting connection-177200.land-5.com The IP number
    C library provides to the IRC server is 206.177.200. To find out the name of that
    machine we need to find 206.177.200.in-addr.arpa The DNS server will first find
    the arpa, then in-addr.arpa server, following the reverse trail through 206, and
    then at last is finding the server for 206.177.200.in-addr.arpa zone at LAND.IN.
    From which it will finally get the answer for 206.177.200.in-addr.arpa we have
    a PTR-177200.land-5.com record, meaning that the name that goes with 206.177.200
    is ws-177200.land-5.com. As with the explanation of how prep.ai.mit.edu looks
    up, this is slightly fictitious.


    Getting back to the IRC server example. The IRC server only accepts connections
    from the Scandinavian countries, i.e., *.no, *.se, *.dk, the name ws-177200.land-5.com
    clearly does not match of any, and the server will deny the connection. If there
    was no reverse mapping of 206.2.177.200 through the in-addr.arpa zone the server
    would have been unable to find the name at all and would have to settle comparing
    206.2.177.200 with *.no, *.se and *.dk, none of which will match.'
