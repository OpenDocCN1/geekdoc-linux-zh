  md: '# Lab 2.1: Setting Up TCP/IP 45


    # FOR EXAMPLE:


    Let''s say that you want to send a packet from host1 to point B in Figure 2.2.
    The path it must follow would be:


    ```

    host1 -> router1 (this is a default route

    router1 -> router3 (this is a default route for host1)

    router3 -> point B and beyond (this is a default route for router3)

    ```


    # ROUTE COMMAND


    Sometimes in Linux, if you manually establish TCP/IP on the NIC, you also need
    to manually start up the routing. You can do this as follows:


    ```

    route add -net network_address network_port

    ```


    so an example would be:


    ```

    route add -net 19.75.16.0 eth0

    ```


    You establish a default route with the route command. The actual syntax: is:


    ```

    route add default gw network_address netmask

    netmask_value network_port

    ```


    where network_address is the address of the default route or, specifically, the
    address of the NIC on your network that will pass the IP packets to the next network;
    netmask_value is the netmask; and work_port is the port name returned by the ifconfig
    command. In Figure 2.2, for host1 to access host3 it must pass through router1.
    In this case, you would enter the command:


    ```

    route add default gw 19.75.16.35 netmask

    255.255.255.0 eth0

    ```


    Packets from host1 that are not on the network 19.75.16.0 will be sent to the
    NIC card with the address 19.75.16.35—the NIC card on router1.'
