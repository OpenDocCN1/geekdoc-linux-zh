    For example, say the password given was “FRED”. If password level is set to 1,
    the following combinations would be tried if “FRED” failed:


    "Fred", "fEd", "fRed", "fReD", "fReD", "fRED", ..


    If password level was set to 2, the following combinations would be tried:


