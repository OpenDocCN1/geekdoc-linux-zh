    # APPENDIX E.2 NMBD


    # NMBD


    # SAMBA


    23 OCT 1998


    # NAME


    nmbd—NetBIOS name server to provide NetBIOS over IP naming services to clients


    # SYNOPSIS


    nmbd [-D] [-o] [-a] [-H Imhosts file] [-d debuglevel] [-l log filename] [-n primary
    NetBIOS name] [-p port number] [-s configuration file] [-i NetBIOS scope] [-h]


    # DESCRIPTION


    This program is part of the Samba suite.


    nmbd is a server that understands and can reply to NetBIOS over IP name service
    requests, like those produced by SMBD/CIFS clients such as Windows 95/98, Windows
    NT and LanManager clients. It also participates in the browsing protocols which
    make up the Windows “Network Neighborhood” view.


    SMB/CIFS clients, when they start up, may wish to locate an SMB/CIFS server. That
    is, they wish to know what IP number a specified host is using.


    Amongst other services, nmbd will listen for such requests, and if its own NetBIOS
    name is specified it will respond with the IP number of the host it is running
    on. Its “own NetBIOS name” is by default the primary DNS name of the host it is
    running on, but this can be overwritten with the -n option (see OPTIONS below).
    Thus nmbd will reply to broadcast'
  merge: -1
  pgno: 315
- img_proc: true
  md: '# Appendix E: Samba Man Pages 291


    queries for its own name(s). Additional names for nmbd to respond on can be set
    via parameters in the smb.conf(5) configuration file.


    nmbd can also be used as a WINS (Windows Internet Name Server) server. What this
    basically means is that it will act as a WINS database server, creating a database
    from name registration requests that it receives and replying to queries from
    clients for these names.


    In addition, nmbd can act as a WINS proxy, relaying broadcast queries from clients
    that do not understand how to talk the WINS protocol to a WIN server.


    # OPTIONS


    +   - D If specified, this parameter causes nmbd to operate as a daemon. it detaches
    itself and runs in the background, fielding requests on the appropriate port.
    By default, nmbd will NOT operate as a daemon. nmbd can also be operated by the
    inetd meta-daemon, although this is not recommended.

    - a if this parameter is specified, each new connection will append log messages
    to the log file. This is the default.

    - -o if this parameter is specified, the log files will be overwritten when opened.
    By default, the log files will be appended to.

    - -H filename NetBIOS hosts


    The hosts file is a list of NetBIOS names to IP addresses that is loaded by the
    nmbd server and used via the name resolution mechanism name resolve order described
    in smb.conf (5) to resolve any NetBIOS queries needed by the server. Note that
    the contents of this file are NOT used by nmbd to answer any name queries. Adding
    a line to this file affects name NetBIOS resolution from this host ONLY.


    The default path to this file is compiled into Samba as part of the build process.
    Common defaults are /usr/local/samba/lib/lmhosts, /usr/samba/lib/lmhosts or /etc/lmhosts.
    See the lmhosts (5) page for details on the contents of this file.


    +   -d debuglevel debuglevel is an integer from 0 to 10.


    The default value if this parameter is not specified is zero.


    The higher the value, the more detail will be logged to the log files about the
    activities of the server. At level 0, only critical errors and serious warnings
    will be logged. Level 1 is a reasonable level for day to day'
