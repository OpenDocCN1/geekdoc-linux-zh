  md: '# 428 Appendix E: Samba Man Pages


    ```

    /usr/local/samba/bin/smbd

    -D -L /VAR/ADM/SMBLOGS/LOG -S

    /USR/LOCAL/SAMBA/LIB/SMB.CONF

    ```


    (The above should appear in your initialization script as a single line. De-pending
    on your terminal characteristics, it may not appear that way in this man page.
    If the above appears as more than one line, please treat any newlines or indentation
    as a single space or TAB character.)


    If the options used at compile time are appropriate for your system, all parameters
    except -D may be omitted. See the section OPTIONS.


    # RUNNING THE SERVER ON REQUEST


    If your system uses a meta-daemon such as inetd, you can arrange to have the smbd
    server started whenever a process attempts to connect to it. This requires several
    changes to the startup files on the host machine. If you are experimenting as
    an ordinary user rather than as root, you will need the assistance of your system
    administrator to modly the system files.


    You will probably want to set up the NetBIOS name server nmbd at the same time
    as smbd. To do this refer to the man page for nmbd (8).


    First, ensure that a port is configured in /etc/services. The well-known port
    139 should be used if possible, though any port may be used.


    Ensure that a line similar to the following is in /etc/services:


    ```

    netbios-ssn 139/tcp

    ```


    Note for NIS/YP users—you may need to rebuild the NIS service maps rather than
    alter your /etc/services file.


    Next, put a suitable line in the /etc/inetd.conf (in the unlikely event that you
    are using a meta-daemon other than inetd, you are on your own). Note that the
    first item in this line matches the service name in /etc/services. Substitute
    appropriate values for your system in this line (see inetd (8)):


    ```

    netbios-ssn stream tcp waitit root

    /usr/local/samba/bin/smbd -d1 -l/var/adm/smblogs/log

    -s/usr/local/samba/lib/smb.conf

    ```'
