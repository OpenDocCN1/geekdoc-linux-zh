- img_proc: true
  md: '# 316 Appendix E: Samba Man Pages


    +   - config file (G)


    This allows you to override the config file to use, instead of the default (usually
    smb.conf). There is a chicken and egg problem here as this option is set in the
    config file!


    For this reason, if the name of the config file has changed when the parameters
    are loaded then it will reload them from the new config file.


    This option takes the usual substitutions, which can be very useful.


    If the config file doesn''t exist then it won''t be loaded (allowing you to special
    case the config files of just a few clients).


    Example: config file = /usr/local/samba/lib/smb.conf %m


    +   - copy (S)


    This parameter allows you to ''clone'' service entries. The specified service
    is simply duplicated under the current service''s name. Any parameters specified
    in the current section will override those in the section being copied.


    This feature lets you set up a ''template'' service and create similar services
    easily. Note that the service being copied must occur earlier in the configuration
    file than the service doing the copying.


    Default: none


    Example: copy = otherservice


    +   - create mask (S)


    A synonym for this parameter is ''create mode''.


    When a file is created, the necessary permissions are calculated according to
    the mapping from DOS modes to UNIX permissions, and the resulting UNIX mode is
    bit-wise ''AND''ed with this parameter. This parameter may be thought of as a
    bit-wise MASK for the UNIX modes of a file. Any bit *not* set here will be removed
    from the modes set on a file when it is created.


    The default value of this parameter removes the ''group'' and ''other'' write
    and execute bits from the UNIX modes.'
