  - PING 命令可以测试你是否有路由可以到达并访问一个主机。它不显示实际的网络路由，那是 traceroute 的用途。你可以配合各种选项使用命令，以便只发送一个数据包并查看它是否返回。你还可以按固定间隔发送数据包（例如每五秒一次），并测试数据包到达目的地的平均时间。不同版本的
    UNIX 有不同的默认选项。
