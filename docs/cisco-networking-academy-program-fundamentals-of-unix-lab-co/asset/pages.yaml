  md: '# Fundamentals of UNIX Lab Companion

    Lab 12.4.1 – Command Line Archive Tools

    (Estimated Time: 45 min.)


    # Objectives


    +   - Develop an understanding of backup and compression utilities

    - Review tar archiving options

    - Back up selected files with tar

    - Back up a directory with tar

    - Compress files

    - Uncompress files

    - Back up and compress your home directory

    - Restore your home directory

    - Use jar to archive and compress


    # Background


    In this lab, you will work with the built-in multipurpose UNIX utilities to back
    up, compress, and restore data for the purpose of having a backup of important
    files or transferring multiple files from one to another user.


    Backing up data for safekeeping is also known as archiving. This is one of the
    most important aspects of network security and support. Backups are a key component
    in a comprehensive security plan.


    Transferring files to and from other users is done frequently using either e-mail
    or file transfer commands (ftp and rcp) that will be covered in Chapter 16.


    In this lab, you will work with the Tape Archive (tar), compress and Java Archive
    (jar) utilities to create a file used as a backup or to transfer to other users.
    We will also cover how to restore files from a tar or jar file.


    # Tools / Preparation


    Before starting this lab, review Chapter 12 of the Cisco Networking Academy Program:
    Fundamentals of UNIX Companion Guide.


    You will need the following:


    +   - A login user ID (such as user2) and password assigned by your instructor.

    - A computer running the UNIX operating system.

    - Networked computers in a classroom with the class file system installed.


    # Notes'
  merge: -1
  pgno: 194
- img_proc: true
  md: '# Fundamentals of UNIX Lab Companion

    Lab 12.a.4.1 – Command Line Archive Tools

    Worksheet


    Use the diagram of the sample class file directory tree to assist with this lab.


    ![](img/bbe31e02758aa1c144da8c6f699725f6_195_0.png)


    # Step 1. Logging in to CDE


    Log in with your user name and password assigned to you by your instructor in
    the CDE entry box.


    # Step 2. Accessing the Command Line


    Right-click the Workspace backdrop and click Tiles. Select Terminal from the menu
    to open a Terminal window.


    # Step 3. Reviewing tar Archiving Options


    The UNIX operating system has several integrated utilities that allow multiple
    files to be backed up and compressed. The **tar** (tape archive) command enables
    you to back up single or multiple files in a directory hierarchy. The **tar**
    command is standard with all versions of the UNIX operating system. Although it
    was originally developed for use with tape drives, **tar** can copy files to other
    locations on the hard disk, floppy disk, or other removable media. The **tar**
    command can create an archive from a single file, but it is primarily used to
    combine multiple files, such the contents of a directory, into a single file.
    These files can then be extracted later if they are needed. By itself, **tar**
    does not compress the files. The **compress** command compresses the newly created
    tar file. The newer **jar** command, covered next, compresses automatically as
    it bundles files. The command syntax is shown here:


    ```

    tar function [modifier:] [output file] filename(s) / directory (s)

    tar c v f files.tar file12

    ```


    The most frequently used options available with the **tar** command are **c**,
    **t**, and **x** (all lowercase). It is not necessary (but accepted) to precede
    these with a dash (-), as with other UNIX command options.'
  merge: -1
  pgno: 195
