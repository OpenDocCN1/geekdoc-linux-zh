  md: '# Fundamentals of UNIX Lab Companion

    Lab 13.3.2 – Managing System Processes

    Worksheet


    Use the diagram of the sample class file system directory tree to assist with
    this lab.


    ![](img/bbe31e02758aa1c144da8c6f699725f6_211_0.png)


    # ### Step 1. Logging in CDE


    Log in with the user name and password assigned to you by your instructor in the
    CDE entry box.


    # ### Step 2. Accessing the Command Line


    Right-click the Workspace backdrop and click Tools. Select Terminal from the menu
    to open a Terminal window.


    # ### Step 3. Reviewing System Process Concepts


    Each program you run creates a process that is assigned a unique process identification
    number (PID). The PID is used by the system to identify and track the process
    until it has been completed. The operating system (OS) kernel manages the initiation
    and termination of all processes. Every process requires system resources such
    as CPU time and RAM to work when it starts and de-allocates when the process ends.
    The first two processes started when a UNIX system is booted are the sched (scheduler)
    and init (initialization), which manage other processes. Several different types
    of processes are on a UNIX system:


    +   - **Daemon**-Processes started by the UNIX kernel and exist for a specific
    purpose. For example, the lpsched daemon exists for the sole purpose of handling
    print jobs.

    - **Parent**-A process that spawns another is its parent. A process called init
    is the first one invoked. Every process except init is referred to as a parent
    process.

    - **Child**-A process that is spawned by another process is a child process.

    - **Orphan**-A process whose parent process terminates before it can return its
    output.

    - **Zombie**-A child process that does not return to the parent process with its
    output. This process becomes lost in the system.'
  merge: -1
  pgno: 211
