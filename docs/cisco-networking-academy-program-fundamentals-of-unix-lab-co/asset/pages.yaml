  md: '# Fundamentals of UNIX Lab Companion

    LAB 1.4.3 – UNIX Computing Environment

    (Estimated Time: 30 min.)


    # Objectives


    +   - Basic computer hardware components

    - Computer operating systems

    - UNIX varieties and history

    - Solaris operating environment

    - Investigate the use of UNIX at an organization or institution

    - Research UNIX-powered Web sites


    # Background


    This lab will review UNIX computing environment terminology and help to reinforce
    concepts introduced in Chapter 1 of the Cisco Networking Academy Program: Fundamentals
    of UNIX Companion Guide. You will also investigate the use of UNIX at your institution
    or another organization, and research Web sites to see which organizations are
    using Solaris UNIX.


    # Tools / Preparation


    Before starting this lab, review Chapter 1 of the Cisco Networking Academy Program:
    Fundamentals of UNIX Companion Guide and the “Check Your Understanding” questions
    that appear in that chapter.


    You or your instructor will need to contact a person, such as an Information Technology
    staff member, who is knowledgeable about the network. This person should tell
    you which servers and network operating systems are in use in your institution
    (or another organization) to find if and where UNIX is being used.


    You will need the following:


    +   - A computer with a browser and access to the Internet.


    # Web Site Resources


    Sun Microsystems Solaris—www.sun.com/solaris


