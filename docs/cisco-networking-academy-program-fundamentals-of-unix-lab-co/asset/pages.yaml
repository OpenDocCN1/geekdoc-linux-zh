  md: '# Fundamentals of UNIX Lab Companion

    Lab 8.2.4– File Processing Commands

    Worksheet


    Use the diagram of the sample class file system directory tree to assist with
    this lab.


    # Class File Tree Structure


    ![](img/bbe31e02758aa1c144da8c6f699725f6_133_0.png)


    # Step 1. Logging in to CDE


    Log in with your user name and password assigned to you by your instructor in
    the CDE entry box.


    # Step 2. Accessing the Command Line


    Right-click the workspace backdrop and click Tools. Select Terminal from the menu
    to open a Terminal window.


    # Finding Files–Overview


    The **find** command can be used to find files based on specific criteria. After
    a file or group of files that match a search criterion is found, another command
    can be executed on the matching files. The **find** command can be used for many
    purposes including deleting, backing up, or printing files. The **find** command
    can be used to locate files on your local hard drive or on remote servers.


    The **find** command starts at the point in the directory hierarchy specified
    and searches all directories and subdirectories below that point. A search of
    your hard drive starting at the root can take a long time. After a file is found,
    it is listed with the starting directory and any subdirectories below it. To learn
    more about the **find** command, refer to the man pages.


    There are a number of options and variations with the **find** command. You will
    work with some of the more common ones here. The format of the **find** command
    is shown here:


    ```

    find path expression action

    ```'
  merge: -1
  pgno: 133
- img_proc: true
  md: '# Fundamentals of UNIX Lab Companion

    Lab 8.2.4 – File Processing Commands

    Worksheet – Continued


    # Path Options


    The path names the directory where the search begins. The path can be a tilde
    (~) that represents your home directory, a dot (.) that represents the current
    directory, an absolute or relative path name, or the root directory.


    # Search Expression Options


    An expression is one or more search criteria options that indicate what to look
    for. It is specified by one or more values. Basic find options include filename,
    type, and size. Options must be preceded by a dash.


    Note: When searching by filename, you can use the asterisk (*) and question mark
    (?) wildcards, but you must put the string and the wildcard character in quotes
    (single or double).


    # Action Options


    The Action at the end of the command is optional and can be used to execute various
    commands after the desired file(s) have been found.


    # Step 3. Finding Files by Name


    In the following example, the search begins in the /usr/bin directory and finds
    all files whose name starts with the letter c.


    ```

    find /usr/bin -name ''c*'' or "c*"

    ```


