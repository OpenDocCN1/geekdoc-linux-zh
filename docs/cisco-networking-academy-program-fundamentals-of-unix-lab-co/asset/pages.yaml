  md: '# # Fundamentals of UNIX Lab Companion

    Lab 2.2.7 – Becoming Familiar with CDE

    Worksheet


    *Conventions:* When instructed to either single-click, click, or double-click,
    use the left mouse button. When instructed to right-click, use the right mouse
    button. A left-click or double-click typically selects or executes an icon, while
    a right-click typically opens a menu of options associated with the icon.


    Perform the following steps to complete this lab.


    **Step 1. Logging in to CDE**

    Log with your username and password assigned to you by your instructor in the
    CDE entry box.


    **Step 2. Examining the CDE Front Panel**

    The middle section has four workspace buttons and icons for Lock, Go, and Exit.
    There are five icons to the left and right of the middle section. Move your mouse
    cursor over each of these for one or two seconds to determine what each one does.
    Write your answers in the following step.


    | Left Side Front-Panel Icons (Left to Right) | Right Side Front-Panel Icons (Left
    to Right) |

    |---|---|

    | | |

    | | |

