    # Background


    In this lab, you will use various metacharacters with the \`ls` command to refine
    your directory listings. Metacharacters are keyboard characters that have special
    meaning to the shell. A general definition of a metacharacter is any keyboard
    character that is not alphanumeric. Metacharacters are used with UNIX commands
    to provide greater flexibility. Some of the metacharacters used with UNIX are
    similar in function to those used with DOS. The asterisk (*) and the question
    mark (?) are metacharacters that are also known as wildcards. You will work with
    the **ls** and the following common metacharacters in this lab.


    | Metacharacter | Name | Function |

    | --- | --- | --- |

    | ~ | Tilde | Shortcut to home directory |

    | * | Asterisk | Character substitution (also called splat) |

    | ? | Question Mark | Character substitution |

    | [] | Square Brackets | Range definition |


    # Tools / Preparation


    Before starting this lab, review Chapter 5 of the Cisco Networking Academy Program:

    Fundamentals of UNIX Companion Guide.


