  md: '# Fundamentals of UNIX Lab Companion

    Lab 2.2.7 – Becoming Familiar with CDE

    Worksheet – Continued


    ### Step 11. Closing Both Calendar and Text Editor Windows

    To close a window, double-click with the mouse button on the dash in the upper
    left corner of the window.


    ### Step 12. Locking Your Workstation

    If you need to leave your workstation for a while, and you want your desktop to
    stay as it is, you can lock your workstation. When you return, you will need to
    provide a password to unlock your workstation. A system administrator can also
    unlock any workstation with the root or superuser password.


    Lock your workstation and then unlock it. What icon did you use to lock the workstation?


    ### Step 13. Working with Workspace Buttons

    Workspace buttons allow you to have multiple desktops. You can have one of applications
    open in one workspace and another set of applications open in another. You can
    click each workspace button to move from one workspace to another. Each workspace
    has a different backdrop. The workspace buttons are numbered one through four
    They can be renamed by right-clicking one of the buttons. Workspace one is opened
    by default:


    +   a. While in workspace, open the Text Editor window.

    b. Click workspace button number two and open the Calendar Jobs window.

    c. Click workspace button number three and open the Printer Jobs window.

    d. Click workspace button number four and open the Mail window.

    e. Click each workspace button to move between the four windows.

    f. Close the application window running in each of the four workspaces.

    g. Right-click workspace button number one, rename it to your first name, and
    press Enter.


    ### Step 14. Working with the Workspace Menu

    You can access the Workspace menu by right-clicking anywhere on the backdrop of
    the workspace. The options shown are similar to those available with the subpanel
    menus, except that all applications are available.


    +   a. Right-click the backdrop and click Hosts from the menu displayed.

    b. Click Workstation Info. This is the same information that you saw earlier.


    ### Step 15. Logging out of CDE

    Exit from your CDE session and confirm that you want to log out.'
