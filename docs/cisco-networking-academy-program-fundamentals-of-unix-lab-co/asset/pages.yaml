    # Step 6. Displaying the Contents of a File with the **cat** Command


    The **cat** (short for concatenate) command displays the contents of a text file
    on the screen. It is often used to display short text files such as script files
    (similar to batch files). If the file fills more than one screen, the data scrolls
    off the screen--unless you are using a scrolling window, such as a Terminal window,
