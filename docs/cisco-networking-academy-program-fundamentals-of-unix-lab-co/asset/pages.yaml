    # Step 10. Editing the Command Line


    The inline edit mode enables you to edit a previous command on the current command
    line by using keystrokes from your preferred editor. This is helpful when you
    want to alter a previously executed (and sometimes length) command line instead
    of re-typing it. When enabled, this feature is only active for the current shell.


    ```

    set [-o] vi

    ```


    Using **set -o vi** turns command line editing on and specifies vi as your preferred
    editor, while **set +vi** turns it on. Once the editing has been turned on, pressing
    the Esc activates the inline editor. You then have access to vi commands to navigate
    through the history list and modify previously executed commands. The following
