    files and directories.


    Knowledge of how to manage files and directories using commands is very important
    in building a solid foundation for further study of UNIX. Power users and administrators
    frequently create executable script files, which are important tool for automating
    certain tasks as backing up files or creating new user accounts. Script files
    are a series of UNIX commands and are similar to batch files used with other network
    operating systems.


