  md: '# Fundamentals of UNIX Lab Companion

    Lab 14.2.5 – Korn Shell Features

    (Estimated Time: 45 min.)


    # Objectives


    +   * Develop an understanding of Korn shell features

    * Review the shell

    * Review aliases

    * Create aliases

    * Display aliases

    * Remove and bypass an alias

    * Display command history

    * Re-execute commands

    * Edit the command line

    * Customize your shell prompt


    # Background


    In this lab, you will work with the Korn shell to understand its features and
    capabilities. The shell is the primary user interface to a UNIX system. The concept
    of the shell was introduced in Chapter 1 along with other key UNIX operating system
    components: the kernel and the file system. The UNIX environment provides support
    for many built-in (for example, Bourne, C, and Korn) and third party shells. This
    lab provides a brief review of the function of the shell and focuses on the most
    popular shell used with UNIX systems today: The Korn shell. It goes into greater
    detail about the unique features of the Korn shell and provides opportunities
    to become more efficient user. You will work with aliases, history, and re-execution
    of commands and custom prompts in this lab.


    # Tools / Preparation


    Before starting this lab, review Chapter 14 of the Cisco Networking Academy Program:

    Fundamentals of UNIX Companion Guide.


    You will need the following:


    +   * A login user ID (such as user2) and password assigned by your instructor.

    * A computer running the UNIX operating system.

    * Networked computers in the classroom with the class file system installed.


