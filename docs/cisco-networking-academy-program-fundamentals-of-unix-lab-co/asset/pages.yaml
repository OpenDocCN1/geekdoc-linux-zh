  md: '# Introduction


    This lab companion provides a collection of lab exercises designed to supplement
    your study of the UNIX operating system in general and Sun Solaris in particular.
    They are designed to give you hands-on experience with the UNIX command-line environment
    and the Common Desktop Environment (CDE) graphical windowing system. The concepts
    covered in these labs help tools, file system navigation, file and directory management,
    file processing, user identification, the vi and C editors, permissions, printing,
    system processes, shell customization and networking. When working through these
    labs, it is presumed you have a computer with a current version of the Solaris
    operating system installed.


    The labs are specifically written to supplement the Fundamentals of UNIX course
    as part of the Cisco Networking Academy Program, sponsored by Sun Microsystems
    and Cisco Systems, and they can be used by anyone seeking hands-on experience
    and a good introduction to the UNIX operating system. Although the labs contain
    brief explanations of key concepts, this is not a textbook. You will get the most
    out of these activities if you do them while concurrently enrolled in formal study,
    such as the Fundamentals of UNIX Networking Academy class, in conjunction with
    Cisco Press book:


    +   * Cisco Networking Academy Program: Fundamentals of UNIX Companion Guide (ISBN:
    1-58713-044-0)


    This lab companion includes 16 groups of lab exercises for a total of 36. Each
    lab contains an introductory overview, preparation/tools required section, explanations
    of commands, and step-by-step instructions to help reinforce the concepts introduced
    in the online course and textbook. Most labs contain a challenge section.


    The labs introduce you to basic UNIX system commands and features in a structured
    activity. They are grouped by topic, corresponding to the chapters in Cisco Networking
    Academy Program: Fundamentals of UNIX Companion Guide. Each exercise group contains
    from one to four labs:


    +   * Chapter 1: The UNIX Computing Environment

    * Chapter 2: Accessing Your System and the Common Desktop Environment

    * Chapter 3: CDE User Applications

    * Chapter 4: Getting Help

    * Chapter 5: Accessing Files and Directories

    * Chapter 6: Basic Directory and File Management

    * Chapter 7: Advanced Directory and File Management

    * Chapter 8: File and User Information Utilities

    * Chapter 9: Using Text Editors

    * Chapter 10: File System Security

    * Chapter 11: UNIX Printing

    * Chapter 12: Backing Up Data

    * Chapter 13: System Processes and Memory Management

    * Chapter 14: Basic Features of the Korn and C Shells

    * Chapter 15: Customizing Your Login Environment

    * Chapter 16: Networking Basics'
  merge: -1
