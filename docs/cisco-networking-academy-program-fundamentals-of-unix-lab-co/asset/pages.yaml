    # Step 7. Uncompress Files


    The corresponding command used to reverse the effects of the compress command
    is uncompress. Files cannot be used in their compressed form, so it is necessary
    to use the uncompress command to restore them to their original size. The uncompress
    command is a UNIX utility and can only be used to uncompress files compressed
    with the UNIX compress


    ```

    uncompress option file2

    uncompress -v file

    ```


    Note: It is not necessary to specify the .Z extension with the uncompress command.
    This command can uncompress multiple files and supports the use of wildcard metacharacters,
    as ? and *.


