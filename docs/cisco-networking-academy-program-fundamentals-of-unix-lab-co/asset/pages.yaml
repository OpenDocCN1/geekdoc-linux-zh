  md: '# Fundamentals of UNIX Lab Companion

    Lab 3.3.5 – Other Built-in CDE Applications Worksheet


    Perform the following steps to complete this lab.


    # Step 1. Logging in to CDE


    Log in with the user name and password assigned to you by your instructor in the
    CDE entry box.


    # Step 2. Creating a Voice Note


    The Voice Note application allows you to personalize your mail messages. Select
    Voice Note from the Applications subpanel to record voice input. Selecting Voice
    Note starts audio in record mode. A microphone or voice input device is necessary
    for this application to work. If you have voice input capability, record a voice
    note.


    # Step 3. Creating a Text Note


    A Text Note allows you to create Post-It style notes on your workspace. Select
    Text Note from the Applications subpanel to record text input. The note can be
    minimized and left on your workspace as a reminder. You can drag notes into mail
    messages as mail attachments. Create a short note for yourself and minimize the
    note. It should remain on your desktop.


    # Step 4. Creating an Address Card


    Address Manager enables you to organize your contacts in electronic cards. You
    can schedule appointments, send e-mail, and dial telephone numbers from the electronic
    cards. You can access the Address Manager in one of two ways:


    +   * You can right-click the desktop to bring up the Workspace menu and then
    select Cards/Address Manager, or

    * You can access the Address manager from the Front Panel/Cards subpanel by selecting
    the Find Card option.


    Right-click the desktop, select Cards, and then select Address Manager. Click
    on Card from the main menu and select New. A sample form is displayed for you
    to fill in. Enter information on yourself, click on Save As, and give the card
    name.


    > Note: Be sure to enter your information at the tab positions in the body of
    the card or it might not be properly saved.


    Create a couple of additional cards, saving and naming each one. The cards you
    create are stored in your home directory under the .addresses subdirectory. Close
    Address Manager when you are finished creating cards.


    # Step 5. Searching for an Address Card


    Open Address Manager by clicking the Cards subpanel and then select Find Card.
    This will bring up Address Manager. Click Search and make sure that the Personal
