    permissions listed.


    **Step 6. Determining Group Permissions for a File**

    The system administrator assigns every user to a primary group. The group that
    the file owner is a of is assigned along the owner when a file is created. The
    second set of three permissions determines what the members of the primary group
    can do.


    +   a. The owner of the dante file is a member of what primary group?


    +   b. What is the first character of along the Group permissions?'
