    # Background


    In this lab, you will work with the Common Desktop Environment (CDE) File Manager.
    The CDE method of file and directory management allows you to do many of the same
    tasks that were performed earlier at the command line. The CDE provides a graphical
    interface to file management and executes most of the same commands you used from
    the command line behind the scene. The File Manager enables you to graphically
    organize files into a hierarchical structure of folders (directories) and subfolders
    (subdirectories). You will work to become familiar with the graphical views of
    files and directories. You will create new files and folders and practice deleting
    and recovering files.


    # Tools / Preparation


    Before starting this lab, review Chapter 6 of the Cisco Networking Academy Program:

    Fundamentals of UNIX Companion Guide.


    You will need the following:


    +   - A login user ID (such as user2) and password assigned by your instructor.

