  md: '# # Fundamentals of UNIX Lab Companion

    Lab 3.1.6 – Using CDE Mail Tool

    Worksheet


    Perform the following steps to complete this lab.


    ### Step 1. Logging in to CDE

    Log in with the user name and password assigned to you by your instructor in the
    CDE entry box.


    ### Step 2. Accessing the Mail Tool

    Click the Mail icon on the CDE front panel to activate the Mailer application.
    If a dialog box is displayed and shows, “Your e-mail setup does not indicate whether
    you have a local or IMAP mailbox,” Choose Local.


    ### Step 3. Accessing Mail Tool Help

    Click the Help icon in the upper right corner of the screen and then click Tasks.
    Examine the tasks listed. Which task would you select to sort your mail in various
    ways?


    What options are available?


    ### Step 4. Composing and Sending an E-Mail Message to Yourself

    To compose a new mail message, click New Message from the Compose menu. Make sure
    the address you are sending the message to is complete. You can include more than
    one name, separated by commas, in the To and CC fields: When finished creating
    the message, click the Send button in the bottom left corner of the pane to send
    the message.


    Compose a message and send it to yourself. Be sure to use the following format:
    userX@hostX where userX is your login ID and hostX is the name of your computer.


    *Note: A new message will eventually show up in your inbox. To force the Mail
    Tool to check for new messages immediately, click Check for New from the Mailbox
    menu.


    ### Step 5. Composing and Sending an E-Mail to Another User

    Compose a message and send it to another person in the class. Be sure to use the
    following format: userX@hostX where userX is the user name of the person you want
    to send to and hostX is the name of your computer. What user and hostname did
    you send it to?


    ### Step 6. Sending a Message with an Attachment

    To attach a file to a message you are composing, click Add File from the Attachments
    menu.

    A window will be displayed from which you can choose the file you want to attach.'
