    # Step 3. Reviewing Initialization Files, Variables, and Commands


    Initialization files—Initialization files contain a series of commands and variable
    settings that are executed when a shell is started. These files are not executable
    but are read by the shell when the user logs in to customize their environment.
    There are two levels of initialization files. The first is system-wide. System
    initialization files are maintained by a system administrator and reside in the
    /etc directory. The second is user-specific initialization files that reside in
    a user''s home directory. The Korn shell has two files: .profile and .kshrc (Korn
    shell control) Both of these have a dot (.) as the first character, which means
    that they are hidden.


    Variables—In the previous lab, you worked with variables like PS1 (prompt string
    1) to customize your Korn shell prompt. Because these were defined from the command
    line or in an initialization file, they were only active for the current shell.
    When that shell closed. With this lab, you will edit the initialization files
    and add variables and commands that will be available every time you log in. Variables
    are either predefined and set automatically when you log in, or set by the user
    (or system administrator for the user). They can apply to the current shell only
    (local) or to all shells and sub-shells (global) depending on which'
