  md: '# Fundamentals of UNIX Lab Companion

    Lab 2.2.7 – Becoming Familiar with CDE

    (Estimated Time: 30 min.)


    # Objectives


    +   - Review the CDE front-panel icons and menus

    - Manage CDE windows

    - Lock the display

    - Work with workspaces

    - Use the workspace menu


    # Background


    In this lab, you will work with the Common Desktop Environment (CDE), which is
    the standard UNIX graphical user interface (GUI). You will become familiar with
    the front panel and use the mouse and keyboard to manage windows. You will also
    practice locking the display, moving between workspaces, and using the workspace
    menu.


    # Tools / Preparation


    Before starting this lab, review Chapter 2 of the Cisco Networking Academy Program:
    Fundamentals of UNIX Companion Guide.


    You will need the following:


    +   - A login user ID (such as user2) and password assigned by your instructor

    - A computer running the UNIX operating system with CDE.


    # Web Site Resources


    Sun Microsystems–www.sun.com/solaris


