    Step 3. Reviewing the Three Modes vi

    There are three modes of operation in vi. Understanding the function of these
    three modes is

    key to work with vi. All commands available with vi can be classified in one of
    the three

    modes. The following table lists the modes and a brief description of each. Review
    the three

    modes and answer the following questions.


    | Mode | Function / Characteristics |

    | Command mode | Initial default mode for creating and editing files, cursor positioning,
    and modification of existing text. All commands are initiated from this mode.
    |

    | Entry mode | Used for new text. Entering an insert command as i

    (insert), a (append), and o (open new line) will take you from

    command mode to entry mode. Entry commands are stand-alone and\entered without
    pressing the Enter key. |

    | Last-line mode | Used for saving your work, searching and replacing text, moving
    and

    copying text, setting vi preferences and quitting vi. Type a colon (:) to

    get to this mode. Pressing the Enter key or Esc key returns to

    command mode. |'
