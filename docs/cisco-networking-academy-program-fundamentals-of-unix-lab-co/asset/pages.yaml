    # Background


    In this lab, you will work with the versatile mv (move) command to rename and
    move files and directories. Files and directories can be renamed and moved to
    other locations in the directory structure by using the same multipurpose command.
    There is no rename command in UNIX. The mv command changes the name of the original
    file, whereas the cp command copies a file and gives it a new name, which leaves
    the original file intact.


