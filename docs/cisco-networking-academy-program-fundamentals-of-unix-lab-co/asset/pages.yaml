  md: '# Fundamentals of UNIX Lab Companion

    Lab 11.3.2 – Command Line Continuity

    Worksheet – Continued


    The lpstat (line printer status) command is used to display the status of the
    printer queue. To see the print requests for a specific printer, use the basic
