    # Step 4. Preventing the Overwriting of Files with Redirection


    In the Korn shell, an option called noclobber can be set to prevent the overwriting
    of files during redirection. This can be done on the command line by using $ set
    -o noclobber. The o stands for options.


    To re-enable clobbering, use $ set +o noclobber.


    To enable/disable clobbering with the C Shell, use % set noclobber and % unset
    noclobber.


