  md: '# About the Authors


    Dan Myers is the curriculum and operations manager for the Sun Microsystems Academic
    Initiative program. Previously, he was a senior technical instructor teaching
    system administration, backup administration, and Lotus Domino administration
    courses at an Authorized Sun Center in Denver, CO. He earned his Bachelor of Science
    degree in technology education at Ohio State University and his master''s degree
    in technical education at Colorado State University. Dan was the Subject Matter
    Expert in the development of the Sun-sponsored Fundamentals of UNIX course and
    has 15 years experience working with UNIX.


    Jim Lorenz is a senior technical writer and curriculum developer for the Cisco
    Networking Academy Program. He has over 20 years experience in information systems
    and has held various IT positions in several Fortune 500 companies, including
    Allied-Signal, Honeywell, and Motorola. He was also a manager of information technology
    and a UNIX system administrator for a division of Harcourt Brace publishing company.
    Jim has developed and taught computer and networking courses for both public and
    private institutions for more than 15 years. He is also the author of the Cisco
    Networking Academy Lab Companions manuals.


    Jim is a Certified Novell Netware Engineer (CNE), a Microsoft Certified Trainer
    (MCT) and a Cisco Certified Network Academy Instructor (CCAI). Jim earned his
    bachelor''s degree in computer information systems from Prescott College.'
