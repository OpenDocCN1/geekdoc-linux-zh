  md: '# Fundamentals of UNIX Lab Companion

    Lab 9.2.6 – Using the CDE Text Editor

    (Estimated Time: 30 min.)


    # Objectives


    +   * Access the CDE Text Editor

    * Open a new file and enter some text

    * Save the file

    * Use Help with File menu options

