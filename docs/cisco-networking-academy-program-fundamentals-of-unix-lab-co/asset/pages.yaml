  md: '# Fundamentals of UNIX Lab Companion

    Lab 2.4.2 – Customizing Your Workspace

    (Estimated Time: 30 min.)


    # Objectives


    +   * Customize your workspace with the CDE Style Manager

    * Locate common applications with the Application Manager

    * Work with subpanels to add and remove icons

    * Work with the front panel to add and remove icons

    * Work with the workspace desktop to add and remove icons


    # Background


    In this lab, you will work with CDE Style Manager, Application Manager, subpanel
    menus, front panel, and the desktop to customize your workspace environment. Style
    Manager gives you control over many attributes, including Color, Font, Backdrop,
    Keyboard, Mouse, Beep, Screen, Window, and Startup. Application Manager provides
    a common location for application icons and subpanels are the pull-up menus on
    the front panel. The front panel is the primary graphical user interface and the
    desktop is the backdrop for icons and menus. Together, they provide ways to add
    and remove applications to customize your environment. You can add and delete
    new buttons and menu options for launching your most frequently applications.


    # Tools / Preparation


    Before starting this lab, review Chapter 2 of the Cisco Networking Academy Program:
    Fundamentals of UNIX Companion Guide.


    You will need the following:


    +   * A login user ID (such as user2) and password assigned by your instructor.

    * A computer running the UNIX operating system with CDE.


    # Web Site Resources


    Sun Microsystems–www.sun.com/solaris


    # Notes


    ![](img/bbe31e02758aa1c144da8c6f699725f6_27_0.png)'
