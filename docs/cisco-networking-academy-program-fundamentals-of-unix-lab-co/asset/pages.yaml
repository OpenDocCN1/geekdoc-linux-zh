  md: '# Fundamentals of UNIX Lab Companion

    Lab 3.1.6 – Using CDE Mail Tool

    (Estimated Time: 30 min.)


    # Objectives


    +   - Become familiar with the graphical CDE Mail Tool

    - Use Mail Tool Help

    - Compose and send e-mail messages and attachments

    - Respond to messages

    - Delete and undelete messages

    - Create aliases for distribution lists


    # Background


    In this lab, you will work with the Common Desktop Environment (CDE) Mail Tool,
    also known as Mailer. Mail Tool is a full-featured graphical e-mail management
    program. Mail Tool is an e-mail client that is a standard component of the Solaris
    CDE. With Mail Tool, you can perform all normal functions related to your e-mail.
    You can read mail and attachments, create new mail with attachments, delete, and
    manage your e-mail with mailboxes.


    # Tools / Preparation


    Before starting this lab, review Chapter 3 of the Cisco Networking Academy Program:
    Fundamentals of UNIX Companion Guide.


    You will need the following:


    +   - A login user ID (such as user2) and password assigned by your instructor.

    - A computer running the UNIX operating system with CDE.

    - The Mail Tool application set up properly.

    - Networked computers in a classroom.


    # Web Site Resources


    Sun Microsystems–www.sun.com/solaris


    # Notes'
