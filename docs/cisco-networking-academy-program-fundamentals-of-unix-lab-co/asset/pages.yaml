    # Step 3. Reviewing UNIX File and Directory Naming Conventions


    In this lab, you will be creating files and directories, so it is important to
    review the naming rules and guidelines for UNIX files and directories before we
    begin:


    +   **Maximum Length**-The maximum length of files and directories is 255 alphanumeric
    characters. It is desirable to keep filenames as short as possible but still meaningful.

    **Non-Alphanumeric Metacharacters**-Some non-alphanumeric or metacharacters are
    allowed: underscores (_), hyphens (-), and periods (.). These metacharacters can
    be used multiple times in a file or directory name (Feb.Reports.Sales is a valid
    file or directory name). Although the shell will allow asterisks (*), question
    marks (?), tildes (~), brackets ([), ampersands (&), pipes (|), quotes ("), and
    dollar signs ($) to be used in a filename, this is not recommended, as these characters
    have special meaning to the shell. semicolon (;), less than (<) and greater than
    (>) symbols are not allowed.'
