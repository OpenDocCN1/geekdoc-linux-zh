    \ Sum | Other Permissions | Octal Sum | Octal Mode Permissions |\n| r w X | |\
    \ r w - | | r w - | | | |\n| r w - | | r -- | | r w - | | | |\n| r -- | | r --\
    \ | | r -- | | | |\n| r - X | | r - X | | r - X | | | |\n\n**Step 7. Changing\
    \ File Permissions Using Octal Mode**\n octal it is not necessary to specify the\
