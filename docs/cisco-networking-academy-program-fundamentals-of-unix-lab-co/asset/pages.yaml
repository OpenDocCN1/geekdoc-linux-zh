  md: '# Fundamentals of UNIX Lab Companion

    Lab 14.2.5 – Korn Shell Features

    Worksheet


    Use the diagram of the sample file system directory tree to assist with this lab.


    ![](img/bbe31e02758aa1c144da8c6f699725f6_221_0.png)


    # Step 1. Logging in to CDE


    Log in with the user name and password assigned to you by your instructor in the
    CDE entry box.


    # Step 2. Accessing the Command Line


    Right-click the Workspace backdrop and click Tools. Select Terminal from the menu
    to open a terminal window.


    # Step 3. Reviewing the Shell


    A shell is an interface between the user and the kernel. It acts as an interpreter
    or translator. In other words, the shell accepts commands issued by you, interprets
    these commands, and executes the appropriate programs. Shells can be command line
    driven or graphical. The system administrator decides which shell will be the
    default for a user when they create the user account. This lab will focus on the
    Korn shell (ksh), which is the most widely used shell for end users. You can use
    the ps (process status) command to see which shell you are using.


    +   - **Bourne shell (S)** - The Bourne shell was the original shell program for
    the UNIX environment. It is the default shell for the Solaris computing environment.
    Stephen Bourne developed the Bourne shell for the AT&T System V.2 UNIX environment.
    This shell does not support the alias or history commands or line editing capabilities
    and is used primarily by system administrators. The Bourne shell prompt is a dollar
    sign ($).


    +   - **Kern shell (S)** - The Korn shell is a superset of the Bourne shell and
    was developed by Stephen Korn at Bell Labs. It has many of the Bourne shell features,
    plus added features such as aliasing, history, and command line editing. This
    is the most widely used shell and is the industry standard for system users. The
    Korn shell prompt is also a dollar sign ($). (Note: Examples given in this course
    are based primarily on the Korn shell.)'
