    * Use Find / Change

    * Select and replace text

    * Use the Format menu to change options

    * Use the Text Editor Options menu


    # Background


    In this lab, you will work with the Common Desktop Environment (CDE) Text Editor.
    The Text Editor is a full-screen graphical text editor that supports a mouse and
    can be used to edit files. It is similar to the Windows Notepad. As with vi, this
    editor does not put any special formatting characters into the file, and is suitable
    for creating system environment and script files.


    # Tools / Preparation


    Before starting this lab, review Chapter 9 of the Cisco Networking Academy Program:
    Fundamentals of UNIX Companion Guide.


    You will need the following:


    +   * A login user ID (such as user2) and password assigned by your instructor.

    * A computer running the UNIX operating system with CDE.

    * Networked computers in a classroom with the class file system installed.


