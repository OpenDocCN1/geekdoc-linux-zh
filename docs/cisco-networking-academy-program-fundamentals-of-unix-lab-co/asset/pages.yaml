    # Step 6. Modifying Your .profile FilenThe system administrator, as part of creating
    a user account, assigns the login shell. The login shell determines which initialization
    files are read during login. The Korn shell uses two user-specific environment
    files to set the user’s environment: ~/.profile and ~/.kshrc. The ~/.profile file
    typically contains one-time-only commands and variable definitions.


    When a new Korn shell user is defined, a basic version of the .profile file is
    created and placed in their home directory. To customize their environment, the
    user needs to modify the .profile file and they must define the ENV variable as
    shown here. The ENV variable defines the path to the .kshrc file. These commands
    are usually added to the end of the .profile file. They inform the system that
    to read each time a Korn shell is started. This command sets the environment variable
    to point to the .kshrc file in the $HOME directory. HOME is a variable that is
    defined by the system to be the absolute path to the user’s login directory.


    ```

    ENV=$HOME/.kshrc; export ENV

    ```'
