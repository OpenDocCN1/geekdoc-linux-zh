  md: '# Fundamentals of UNIX Lab Companion

    Lab 5.3.1 – Basic Command Line Syntax

    (Estimated Time: 30 min.)


    # Objectives


    +   - Become familiar with UNIX command line syntax

    - Use various UNIX commands with options and arguments

    - Use the man pages to learn about UNIX commands


    # Background


    In this lab, you will work with various UNIX commands to develop an understanding
    of UNIX commands and syntax. Commands, which are typed at the shell prompt, are
    instructions that tell the system to perform an action. Syntax refers to the structure
    of the command and specifies allowable options and arguments. The general format
    for UNIX commands is the:


    ```

    command [-option(s)] [argument(s)]

    ```


    Note: Items in square brackets are optional, which means they are not always required.


    | Command | Executable program (specifies what you want the system to do). |

    | Option(s) | Modifies the executable (specifies how you want the command run).
    |

    | Argument | File or directory, including the path name or text. If a path name
    is not specified for a file or directory, the operating system will use the current
    directory. |


    A space must be used as a delimiter between each part of the command entered.
    UNIX commands are always lowercase. Options are usually a single letter preceded
    by a hyphen (-), also called a dash or minus sign. Multiple options can be combined
    using only one hyphen. The option might be upper- or lowercase depending on the
    command. Many commands do not require all three parts. Multiple commands can be
    entered on one line by separating them with a semicolon (;).


    # Tools / Preparation


    Before starting this lab, review Chapter 5 of the Cisco Networking Academy Program:
    Fundamentals of UNIX Companion Guide.


    You will need the following:


    +   - A login user ID (such as user2) and password assigned by your instructor.

    - A computer running the UNIX operating system with Common Desktop Environment
    (CDE).

    - Networked computers in a classroom.


    # Notes'
