  md: '# Optional Exercises


    +   1. Use the **traceroute** command to Check Internet Path (Optional). The **traceroute**
    command can be used to trace the packet takes from your host to another Internet
    host. It checks the routers that the packet passes through along the way, which
    are called hops. The **traceroute** command operates at OSI Layer 3, the network
    layer, and will report what your router encountered on route to the destination.
    If the packet does not make it to the destination, you can determine which router
    stopped it. Depending on your firewall setup, you might not receive the results
    of the **traceroute** command. For more information on the **traceroute** command,
    use the man pages.


    ```

    traceroute IP address

    ```


    Or


    ```

    traceroute hostname (for example, www.sun.com; if name resolution is available:)

    www.sun.com. What was the result?

    ```


    +   2. In order to use the **ping** command, you must type the full path name
    of /usr/bin/ping on a Solaris system. What modification to the .profile file could
    you make so that you can type ping by itself without /usr/sbin?


    +   3. Practice ftping files to/from your system to a remote system using the
    **mput** (multiple put) and **mget** (multiple get) commands. See the man pages
    for further information.


    +   4. The commands **telnet** and **login** are functionally the same. Telnet
    into a partner’s system and perform a series of commands. Then login to your partner’s
    system and perform the same series of commands. What is the main difference between
    these two commands?'
