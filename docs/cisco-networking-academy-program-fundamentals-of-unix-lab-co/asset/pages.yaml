    Step 4. Using the ls Command with the Asterisk (*) Metacharacter

    The asterisk (*) is a substitution symbol that represents zero or more characters,
    except for the leading dot on a hidden file. The asterisk is often referred to
    as a wildcard character. If there were a large number of files in a directory,
    and you only wanted to see a listing of project files that started with pl, you
    could use the asterisk to limit the number of files listed. For example, the command
    ls* would list all files and directories starting with pl and number of characters
    after that. The asterisk can be placed anywhere (beginning, middle, or end) of
    the string being tested, and can appear multiple times. If you enter ls d* you
    will see only those files beginning with the letter d and contents of any subdirectories
    that start with the letter d.


