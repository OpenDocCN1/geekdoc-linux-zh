    # Step 3. Pinging Another TCP/IP Host


    Ping (Packet Internet Groper) is a very useful tool that is part of the basic
    TCP/IP protocols package and any UNIX system with every TCP/IP protocol stack
    can make use of the **ping** command.


    The **ping** command is a good low-level troubleshooting tool that tests Layers
    1 through 3 of the OSI model. The **ping command tests basic connectivity between
    TCP/IP hosts by sending an ICMP (Internet Control Message Protocol) echo request
    to another computer or host on a TCP/IP network. If there is reply from the destination
    host, you can **ping** it as a basic connectivity test. If you are unable to run
    an application on a remote host, you can **ping** the computer. If you do not
    get a response, the problem might not be with the application, but instead, the
    host might be down or the network link could be down. *Note:* In order to use
    the **ping command** in Solaris, you might need to specify the full pathname of
    /usr/sbin/ping.


    Any network operating system that is running the TCP/IP protocol can send and
    respond to ping. You can **ping** the name of a host computer, if you have a naming
    service such as Domain Name Service (DNS) or if you have entered the host name
    and IP address in your /etc/hosts file. If not, you can directly **ping** the
    IP address of the host, which is preferred because it'
