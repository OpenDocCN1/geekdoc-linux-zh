    # Step 6. Searching for Strings in Files


    The grep command is used to search for a file or the output of a command for a
    specified text string. A string is one or more characters; it can be a character,
    a word, or a sentence. A string can include white space or punctuation if enclosed
    in quotations. The grep command searches for a file for character string and prints
    all lines that contain the pattern to the screen. The grep command is frequently
    used in a pipeline with other commands. For example, you can use the ps (process
    status) command and look for all occurrences of a specific process. The grep command
    is sensitive, you must match the pattern with respect to uppercase and lowercase
    letters, unless you use the -i option, which ignores the case. The -v option searches
    for all lines that do not match the string specified.


    ```

    grep [option(s)] string path/filename

    ```'
