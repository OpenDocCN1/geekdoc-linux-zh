  md: '# Fundamentals of UNIX Lab Companion

    Lab 16.4.4 – Networking Commands

    Worksheet – Continued


    Telnet is also also used as a network-troubleshooting tool. It is a non-graphical
    communications utility that you can use to check the upper layers of the OSI model.
    It runs at Layer 7, the Application layer. If you are having trouble executing
    another, perhaps graphical, client-server application, you can try to telnet to
    the host or server to verify that the TCP/IP protocol stack is functioning correctly.
    Remember, not all network operating systems support the telnet server function.
    For example, you can telnet from a Windows 9x or NT/2000 workstation to a UNIX
    server, but you cannot telnet to the Windows workstation.


    You can telnet to the name of a host computer if you have a naming service running
    such as DNS or if you have entered the host name and IP address in your /etc/hosts
    file. If not, you can telnet the IP address of the host. When using telnet, you
    can do the following:


    +   - Open a session on a remote machine.

    - Alternate between the remote session and the local session.

    - Accesses do not run under the UNIX environment.


    ```

    telnet host_ip_address (hostname)

    ```


