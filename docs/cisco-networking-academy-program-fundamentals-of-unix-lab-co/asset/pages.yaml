  md: '# Fundamentals of UNIX Lab Companion

    Lab 5.3.3 – Navigating the File System

    (Estimated Time: 20 min.)


    # Objectives


    +   - Become familiar with the file system tree used in class

    - Determine the current working directory with the pwd command

    - Work with absolute and relative path names

    - Change directories from one location to another in the file system with the
    cd command


    # Background


    In this lab, you will work with the UNIX file system or directory tree, which
    has been set up for the class. You will learn how to determine your current location
    in the directory tree and how to change from one directory to another.


    Remembering which directory you are currently working in is often difficult. The
    pwd (print working directory) command will display the absolute path name of your
    current directory. The pwd command is used frequently to check the current location
    in the directory tree or hierarchy.


    You can move from one directory to another with the cd (change directory) command.
    The directory location you wish to change is specified using an absolute or relative
    path name. An absolute path name specifies a file or directory in relation to
    the entire hierarchy. The hierarchy begins at the (/) root directory. Absolute
    path names always start at the (/) root and list each directory along the path
    to the destination file (or directory).


    A relative path name describes the location of a file or directory as it relates
    to the current directory or the directory tree. If you are in a directory and
    want to move down the directory tree, you can type the path starting with the
    name of the next directory in the directory structure. Relative path names are
    useful because they are usually shorter than absolute path names. To use relative
    paths, you must know what directory you are currently in since that is your starting
    point. The pwd command will tell you which directory you are in the directory
    tree or hierarchy. Shortcuts such as the tilde (–), dot/dot (..) can also be used
    with relative path names.


    # Tools / Preparation


    Before starting this lab, review Chapter 5 of the Cisco Networking Academy Program:

    Fundamentals of UNIX Companion Guide.


    You will need the following:


    +   - A login ID (such as user2) and password assigned by your instructor.

    - A computer running the UNIX operating system with Common Desktop Environment
    (CDE).

    - Networked computers in a classroom.'
