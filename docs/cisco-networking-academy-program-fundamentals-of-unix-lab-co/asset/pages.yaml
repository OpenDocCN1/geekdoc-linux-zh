- img_proc: true
  md: '# Fundamentals of UNIX Lab Companion

    Lab 2.4.2 – Customizing Your Workspace

    Worksheet


    CDE Mouse Conventions: When instructed to either single-click, click, or double-click,
    use the left mouse button. When instructed to right-click, use the right mouse
    button. A left-click or double-click typically selects or executes an icon, while
    a right-click typically opens a menu of options associated with the icon.


    Perform the following steps to complete this lab.


    Step 1. Logging in to CDE

    Log in with the user name and password assigned to you by your instructor in the
    CDE entry box.


    Step 2. Accessing Style Manager

    to access Style Manager, click the Desktop Controls icon (on the right side of
    the front panel), or click the Tools subpanel and select Desktop Controls. Then
    double-click any of the icons with the words "Style Manager" in the description
    and the Style Manager window will be displayed (along with a second window that
    contains the option you clicked).


    Step 3. Changing Font Settings

    Changing the font size using the Style Manager will alter the display character
    size of the next and subsequent windows opened. Change the size of your current
    font display and open a Terminal window to verify the change.


    Step 4. Changing Backdrop Settings

    The Backdrop choice enables you to change the background for the current workspace.
    Each workspace can have a different backdrop applied to it. Change the backdrop
    of your current workspace and then change the backdrop of workspace three.


    Step 5. Changing Mouse Settings\Changing handedness of mouse will reverse mouse
    buttons 1 and 3. The maximum time between double-click can also be adjusted. Changes
    to this will become effective with a new login session. You can also alter the
    acceleration and threshold speeds of your mouse. Acceleration will change how
    fast the pointer moves across the display. Threshold specifies the minimum number
    of pixels you must move the mouse at one time before the pointer moves at the
    accelerated speed. Change the double-click speed and acceleration.


    Step 6. Changing Startup Settings

    If the Logout Confirmation Dialog is set to On, you will be asked to confirm that
    you want to log out when you choose to Exit. Change the startup controls so that
    you are not requested to confirm when you log out.


    Step 7. Testing Changes You Have Made

    Log out (Exit) and then log back in to see the effects of your changes.'
