  md: '# Fundamentals of UNIX Lab Companion

    Lab 12.4.1 – Command Line Archive Tools

    Worksheet – Continued


    # tar Command Function Options


    | Function | Meaning | Function Performed |

    | --- | --- | --- |

    | c | Create (combine) | Create a new tar file. |

    | t | Table of Contents | List the table of contents of the tar file. |

    | x | Extract files | Extract the specified files from the tar file. |


    # tar Command Function Modifiers


    | Modifier | Meaning | Function Modified |

    | --- | --- | --- |

    | f | Filename | Specify the tar file to be created as either a file on the hard
    disk (i.e., /tmp/file.tar), or a device file for outdevice like a floppy disk
    (/vol/dev/aliases/floppy0 in Solaris), optical drive, or tape drive (/dev/rmt0
    in Solaris). |

    | v | Verbose (view) | Execute in verbose mode. This allows the user to view what
    the tar command is doing as it is copying, displaying the table of contents, or
    extracting to from the backup file or device. This option is normally used with
    the c, t, and x tar options. |


