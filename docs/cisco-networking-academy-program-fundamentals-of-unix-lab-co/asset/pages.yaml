  md: '# Fundamentals of UNIX Lab Companion

    Lab 10.3.3 – Changing Permissions from the Command Line

    Worksheet – Continued


    # Step 4. Changing File Permissions Using Symbolic Mode


    When using symbolic mode to set permissions, you typically work with one category
    of users, although you can give all categories the same permissions simultaneously.
    This mode is referred to as relative because you are assigning or removing permissions
    relative to the permissions that are already there. You can add one or more permissions
    to a specific category of users, or take them away. The command format for symbolic
    mode uses letters and symbols.


    The mode portion of the command format consists of three parts:


    +   - Who–Category of users you are working with: u = user, g = group, o = other
    or a = all

    - Op–Operator or what you are going to do: set (=), remove (-), give (+)

    - Permissions–permission(s) to be assigned – r = read, w = write or x = execute


    The following example removes (-) the read permission (r) from the file dante
    for the other (o) category of users. Note: There should be no spaces between the
    o, dash (-) and r.


    ```

    chmod o-r dante

    ```


    The next example adds (+) the write permission (w) to the file dante for the group
    (g) and other (o) categories of users:


    ```

    chmod go+w dante

    ```


