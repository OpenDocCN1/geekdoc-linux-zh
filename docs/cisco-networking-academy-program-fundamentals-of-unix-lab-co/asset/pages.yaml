    # Step 6. Terminating a Local Process From a Remote Host


    Sometimes you might start a process (application or command line) that causes
    your system to lock up, when your keyboard and mouse don''t work and you can''t
    open a Terminal to kill the process. In situations like this, it is best to try
    to login or telnet to your computer from another system and attempt to kill the
    problem process before rebooting your system. After successfully killing the process
    that caused your system to respond, type exit to end your remote session and return
    to your system.


    If you can''t identify the problem process that is locking up your system, use
    the pkill -9 ksh (or csh if your login shell is the C shell program) command.
    This will terminate the login session on your system (including CDE) and return
    to the CDE Login Manager.


    For the next exercises, you will work with a partner. After the first person completes
    Steps through e, the second person completes the same steps.


