    (Estimated Time: 30 min.)


    # Objectives


    +   - Use Voice and Text Note applications

    - Use Address manager to store information on contacts

    - Use the Calculator application

    - Use the Clock application

    - Open a Terminal window to gain access to the command line.


    # Background


    In this lab, you will work with several additional user applications that are
    included with the Common Desktop Environment. These include Voice and Text Notes,
    Address Manager, Calculator, and Clock. You will learn how to open a Terminal
    window that will give you access to the UNIX command line. You will use Terminal
    windows throughout this course to practice UNIX commands.


    # Tools / Preparation


    Before starting this lab, review Chapter 3 of the Cisco Networking Academy Program:
