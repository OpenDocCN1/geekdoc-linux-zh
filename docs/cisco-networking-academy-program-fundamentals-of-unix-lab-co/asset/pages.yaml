    # Step 5. Minimizing the Front Panel


    At the top-left corner of the CDE front panel is a window menu button with a dash.
    Single-click this button and minimize the front panel (you can also double-click
    this button). Double-click the minimized front-panel icon to restore it to its
    original size.


    # Step 6. Opening and Minimizing a Window


    Single-click the Text Note icon on the front panel to open a Text Editor window.


    After the Text Editor window opens, convert the window to an icon by minimizing
    it. You can click the dash button in the upper left corner and choose Minimize
    or single-click the button with a dot in the upper right corner. Double-click
    the minimized icon to restore the window to its original size.


    # Step 7. Maximizing a Window


    Maximize the Text Editor window with the dash button in the upper left corner,
    or the box button in the upper right corner. Click the box button to restore the
    window to its original size or use the dash menu button.


    # Step 8. Sizing a Window


    Move your cursor over any edge (or corner) of the Text Editor window. You will
    see a small bar with an arrow. While the bar and arrow are displayed, click and
    hold the mouse button, and drag the side of the window to enlarge it.


    # Step 9. Moving a Window


    Single-click the heading (top) of the Text Editor window with the mouse button
    and hold the button down. Drag the window to a new location. The two numbers in
    parentheses indicate screen position X and Y coordinates. Developers use these
    coordinates to bring up a new window at a specific location on the desktop. You
    can also use the dash menu button and move.


    # Step 10. Working with Overlapping Windows


    With the Text Editor window open, click the Calendar icon from the front panel.
    The new window overlaps or covers the Text Editor window. Calendar is now the
    foreground, process. To bring the Text Editor window back to the foreground, click
    any portion of the window if you can see it. If not, click the Calendar dash menu
    and select Lower from the menu. This lowers the Calendar window to the background
    and raise the Text Editor window to the foreground.'
