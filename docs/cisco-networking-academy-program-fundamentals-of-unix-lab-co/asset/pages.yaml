    # Step 5. Appending Output to an Existing File


    The double right angle bracket (>>) can be used if you wish to append (add to
    the end) to an existing file instead of overwriting it. This option creates a
    new file if one does not exist or appends to an one.


    Here’s the command format:


    ```

    command >> file

