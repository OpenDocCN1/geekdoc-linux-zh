  md: '# Fundamentals of UNIX Lab Companion

    Lab 3.2.5 – Using CDE Calendar Manager

    Worksheet


    Perform the following steps to complete this lab.


    # Step 1. Logging in CDE


    Log in with the user name and password assigned to you by your instructor in the
    CDE entry box.


    # Step 2. Accessing Calendar Manager


    To start Calendar Manager click the Calendar icon on the CDE front panel. By default,
    the Calendar window displays a month view of your calendar.


    # Step 3. Accessing Calendar Manager Help


    Click the Help icon in the upper right corner of the window and then click Tasks.
    Examine the tasks listed. Which task would you like to select to learn how to
    change the default calendar view?


    # Step 4. Changing Calendar View


    The view can be changed by clicking one of the four view icons at the top right
    corner of the window. Change from the default Month view to the Day, Week, and
    Year views.


    # Step 5. Changing Calendar Options – Editor Default Settings


    Click the File, Options menu. The initial category displayed is Editor Defaults.
    In the Editor window, you can set the options to suit your personal preferences.


    +   a. Change the default appointment Duration of 60 minutes to 30 minutes.

    b. Change the Privacy option to See Time Only.


    # Step 6. Changing Calendar Options – Display Settings


    Click the Category button and select Display Settings.


    +   a. Change the time range for the day to End at 6:00 p.m.

    b. Change the Default View for the Calendar Manager to Week.


    # Step 7. Changing Calendar Options – Access List and Permissions


    Click the Category button and select Access List and Permissions.


    +   a. Remove the world from the access list so no one else can see your calendar.

    b. Enter the User Name (user@hostx) of one of your fellow students and give them
    permission to view your public calendar entries. Click Add to them to your access
    list.'
