    The ability to analyze and manage files and directories using commands is very
    important in building a solid foundation for further study of the UNIX operating
    system. UNIX power users and system administrators must have a working knowledge
    of command line capabilities and syntax. Many operating system management and
    device configuration tasks require an understanding of UNIX commands, and in some
