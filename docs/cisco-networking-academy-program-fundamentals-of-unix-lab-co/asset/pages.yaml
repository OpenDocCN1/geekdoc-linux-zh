- img_proc: true
  md: '# Fundamentals of UNIX Lab Companion

    Lab 7.1.2- Copying Files and Directories

    Worksheet


    Use the diagram of the sample class file directory tree to assist with this lab.


    ![](img/bbe31e02758aa1c144da8c6f699725f6_107_0.png)


    # Step 1. Logging in to CDE


    Log in with your user name and password assigned to you by your instructor in
    the CDE entry box.


    # Step 2. Accessing the Command Line


    Right-click the Workspace backdrop and click Command Tools. Select Terminal from
    the menu to open a Terminal window.


    # Copying Files–Overview


    Files can be copied in several ways:


    +   - A new file can be created with a different name in the same directory.

    - Files can be copied to a different location in the directory hierarchy with
    the same or different name.

    - Files can also be copied to a different disk such as a floppy or to a centralized
    server with the same or a different name.


    # Step 3. Copying Files Within a Directory


    If you want to copy a file and create a new file with a different name within
    the same directory, use the following command format. You can specify relative
    and absolute path names


    ```

    cp source_file destination_file

    ```


    This command will copy from an existing filename (old source_file) to a new filename
    (destination_file) in the same directory. Note: You cannot have two files of the
    same name in the same directory. However, if at least one character is different,
    such as an uppercase letter instead of a lowercase letter, then the filenames
    are different.'
  merge: -1
