    # Step 7. Displaying the Contents of a File with the **more** Command


    The **more** command is the preferred method of displaying a text file because
    it automatically displays the file contents one screen at a time. If the information
    in a file is longer than one screen, the following message appears at the bottom
    of the screen: --More--(n%). Pressing the Enter key continues the display one
    line at a time. The Space bar will continue one screen at a time.


    +   - Use the **more** command to display the contents of the dante file in your
    home directory. What happened to the display of the text?


    # Step 8. Displaying Portions of a File with the **head** Command


    The **head** command is used to display the first n lines of one or more text
    files. The first 10 lines are displayed by default if the **-n** option is omitted.
    The **head** command is useful when you only want to check the first few lines
    of a file regardless of its length.


