  md: '# Fundamentals of UNIX Lab Companion

    Lab 7.1.6 – Redirection and Piping

    (Estimated Time: 45 min.)


    # Objectives


    +   * Become familiar with input/output (I/O) redirection

    * Redirect standard output to create a file

    * Prevent the overwriting of files with redirection

    * Append output to an existing file

    * Pipe the output from one command to another


    # Background


    In this lab, you will use advanced UNIX commands to accomplish redirection and
    piping. The UNIX command has a source for standard input and a destination for
    standard output. The input to a command is normally from the keyboard, although
    it can come from a file. The output from a command normally goes to the monitor
    or screen. The UNIX computing environment enables command I/O to be controlled
    using redirection. This is useful when attempting to save the output of a command
    to a file for later viewing. By piping, you can take the output from one command
    and use it as input to another command for further processing.


    # Tools / Preparation


    Before starting this lab, review Chapter 7 of the Cisco Networking Academy Program:
    Fundamentals of UNIX Companion Guide.


    You will need the following:


    +   * A login user ID (such as user2) and password assigned by your instructor.

    * A computer running the UNIX operating system with Common Desktop Environment
    (CDE)

    * Networked computers in a classroom with the class file system installed.


    # Notes'
  merge: -1
  pgno: 119
- img_proc: true
