    **Step 9. Displaying Portions of a File with the tail Command**

    Use the `tail` command to display the n lines of a file. The last ten lines are
    displayed by default if the -n option is enabled. The `tail` command is useful
    for checking the most recent entries in log files. Backup utility programs frequently
    write their results to a log file that show which files were backed up and when.
    The final entries in a backup log file are usually the total number of files backed
    up and the messages indicating whether the backup finished successfully. The -n
    option displays the last n lines of the file.


    +   a. Use the `tail` command by itself to display the end of the dante file in
    your home directory.

    How many lines were displayed?


    **Step 10. Determining Line, Word, and Character Counts By using the wc command**nThe`wc`
    (word count) command can be used to display line, word, byte, or character counts
    for a text file. This command is useful when determining characteristics of a
    file or when comparing two files. Using `wc` without options will give a line,
    word, and byte count of the contents of the file. Using it with individual options
    allows you to determine which of these you would like to see.


    +   a. Use the `wc` command to determine the number of lines, words, and characters
    in the dante file in your home directory. How many lines, words, and characters
    are there?


    **Step 11. Counting the Number of Directory Entries Using wc**

    Use the `ls` command to determine the number of entries (files and directories)
    in your home directory. To do this you must pipe the `ls` command to the `wc`
    command. The pipe symbol is the vertical bar that is on the same key as the backslash
    (\). At the prompt, enter the command: `ls | wc -w`


    How many file directory names (words) are there?


    **Step 12. Determining the Differences Between Files with the diff Command**

    The`diff` (difference) command is used to compare two text files and find the
    differences between them. The `wc` command can compare files because it counts
    lines, words, and characters. It is possible for two files to have the same line,
    word, and character counts, but have different characters and words. The `diff`
    command can actually find the differences between the files.


    The output of this command will display line-by-line differences between two text
    files. There are two options with the `diff` command; -i and -c. The -i option
    ignores the case of the letters; for example A is equal to a. The -c option performs
    a detailed comparison and produces a listing of differences with three lines of
    context. With this option, the output begins with the files involved and their
    creation dates.'
