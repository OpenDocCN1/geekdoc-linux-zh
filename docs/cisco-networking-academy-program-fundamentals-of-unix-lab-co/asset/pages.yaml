    **Step 5. Creating New Directories with the `mkdir` Command**

    The `mkdir` (make directory) command is used to create directories or folders.
    Directories contain other directories, which are referred to as subdirectories,
    and they can contain files. Directories can be created using either an absolute
    or relative path name. You can specify more than one directory name on the same
    line to create more than one new directory. You must have the appropriate permissions
    to create a directory.(Permissions are covered later.)


    The `mkdir -p` (parent) option can be used to create parent directories while
    creating lower-level directories. You can create multiple levels of directories,
    including all the directories in a pathname simultaneously. If you use the `-p`
    option and specify a directory in the path name that does not exist, it will be
    created:


    ```

    mkdir [-p] directory_name(s)

    ```'
