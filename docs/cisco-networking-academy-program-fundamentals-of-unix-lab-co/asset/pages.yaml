    # Objectives


    +   - Determine who is logged on

    - Switch to a different user''s account

    - Determine your real user identity

    - Determine your effective user identity


    # Background


    In this lab, you will use advanced UNIX commands to determine your identity and
    the identity of other users logged on a system. When you log on to a UNIX system,
    you use your Real User ID (for example, user4). It is possible to switch temporarily
    to another user''s account for testing or access to files. When you have switched
    to the other user''s account, it becomes your Effective User ID. In this lab you
    will work with various commands that allow you to determine your Real User ID,
    your Effective User ID, and allow you to switch between the two. You will also
    be able to find out who is logged remotely to a UNIX system.


    # Tools / Preparation


    Before starting this lab, review Chapter 8 of the Cisco Networking Academy Program:
    Fundamentals of UNIX Companion Guide.


    You will need the following:


    +   - A login user ID (such as user2) and password assigned by your instructor.

    - A computer running the UNIX operating system with Common Desktop Environment
    (CDE)

    - Networked computers in the classroom with a class file system installed.


