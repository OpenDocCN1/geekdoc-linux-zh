    # Step 6. Determining Octal Permissions


    Octal provides a quick numeric means of changing permissions for all categories
    of users simultaneously, while still allowing each set of permissions to be different.
    There are three possible permissions for each set (r, w, and x) for each type
    of user category (User, Group, Other). Each set of permissions can be assigned
    a numeric value (from 0 to 7) depending on which permissions are allowed.'
