    **Step 4. Determining File Type with the File Command**

    Many types of files can be found on a UNIX system. The file type can be determined
    by using the file command. This information can be important when a user is attempting
    to open or read a file. Determining the file type can help a user decide which
    program or command to use the file. The output from this command will most often
    be one of the following: text, executable, or data.


    +   - **Text files**–Examples include ASCII or English text, commands text, and
    executable shell scripts. This type of file can be read using the **cat** or **more**
    commands and can be edited using vi or another text editor.


    Use the **file** command to determine the file type for the dante in your home
    directory. What kind of file is it?


    +   - **Executable (or binary) files**–Examples include 32-bit executable and
    extensible linking format (ELF) files and other dynamically linked executables.
    This file type indicates that the file is a command or program.


    Use the **file** command to determine the file type for the cal file in /usr/bin
    directory. What kind of file is it?


    +   - **Data files**–Data files are created by applications running on the system.
    In some cases the type of file is indicated; for example, FrameMaker (Desktop
    Publishing software) document.


    Use the **file** command to determine the file type for the beans file in the
    dir1/coffees subdirectory. What kind of file is it?


    **Step 5. Using the strings Command**

    The **strings** command can be used to print out readable characters in an executable
    or binary file. Someone with a programming background can interpret the output
    produced by strings. The command is introduced here solely as a method for demonstrating
    the printable characters of an executable file. The **strings** command must be
    used to read an executable file such as /usr/bin/cat. The **strings** command
    also shows the usage syntax of the command in most cases.'
