    # ### Step 2. Accessing the Command Line


    Right-click the workspace backdrop and click Tools. Select Terminal from the menu
    to open a Terminal window.


    # ### Input / Output Redirection–Overview


    Several metacharacters are used as redirection symbols. Output redirection uses
    the right angle bracket (>), which is also referred to as the greater-than symbol.
    Input redirection uses the left angle bracket (<) or the less-than symbol. Error
    output redirection uses the right angle bracket preceded by two (>>). The lab
    focuses on output redirection.


    Here''s the command format:


    ```

    Command Redirection-Symbol File (text file or device file)

    ```


    # ### Step 3. Redirecting Standard Output to Create a File


    Standard output redirected much more frequently than standard input or standard
    error. Many commands, such as ls, cat, head, and tail generate standard output
    to the screen, and it is frequently desirable to redirect this output to a file
    for future viewing, manipulation, or printing. By substituting a filename, you
    can capture the output of a command rather than letting it go to the default monitor.
    This is a good way to create a sizable test file for practice.'
