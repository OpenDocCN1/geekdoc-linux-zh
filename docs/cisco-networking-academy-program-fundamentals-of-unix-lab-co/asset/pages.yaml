    Worksheet


    Perform the following steps to complete this lab.


    # Step 1. Logging in to CDE


    Log in with the user name and password assigned to you by your instructor in the
    CDE entry box.


    # Step 2. Accessing the Command Line


    To access the man, you must first be at a command prompt. To access a command
    prompt, log in directly in character mode or open a Terminal window under CDE.
    If you bypass CDE or if you telnet or login to a remote computer, you will have
    direct access to a command prompt.


    Note: In this lab, we assume that you are running CDE but the commands will be
    the same regardless. Telnet and login will be covered in the course.


    Right-click the Workspace backdrop and click Tools. Select Terminal from the menu
    to open a Terminal window. If you are using the Bourne or Korn shells, you will
    have a dollar sign ($) prompt. If you are using the C shell you will have a percent
    sign (%) prompt.


    # Step 3. Navigating Man Pages


    The output from some man pages can be as many as 10 to 20 screens of output. Several
    keys are helpful in moving around the man utility until the pages for a specific
    command have been located. At the command line, enter **man intro** and use the
    following scrolling commands to move around.


    | Space Bar | Scrolls one screen at a time |

    |---|---|n| Return | Scrolls one line at a time |

    | b | Back – Moves back one screen |

    | f | Forward – Moves forward one screen |

    | q | Quit - Exits the **man** command |

    | /string | Searches for information |

    | n | Next – Finds the next occurrence of *string* |

    | h | Help - Gives a description of all scrolling capabilities |


    # Step 4. Using the basic man Command


    The **man** command is used to display online man pages for any of the hundreds
    of UNIX commands that are available. The basic form is **man name** where name
    is the name of the command for which you want information.'
