    # Step 7. Searching for a Specific Process by Command Name


    To stop a process, you must find the PID. On most systems, hundreds of processes
    are running and the ps -ef listing can be long. If you know the name of the executable
    program that started the process, you can find it faster. By piping the output
    of the ps command through grep, you can search for the specific process to terminate
    and find the correct PID. As you will recall, the grep command can search for
    any type of character string in the output of another command. Specific to Solaris
    is the grep (process grep) command, which is used to search for a specific process.
    The -l (long output) option will display the names of the processes associated
    with the PID found. The -e option displays the PID and the name of the initiating
    command, which allows grep to search on this information.'
