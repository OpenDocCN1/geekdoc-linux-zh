    Step 6. Using the ls Command to See File Types

    When using the ls command by itself, you can obtain a listing of directory contents,
    but you cannot tell which are files and which are directories. By using the ls
    command with the -F (File type) you can display a listing with a symbol to tell
    what type of file it is. The symbol (if present) is found at the end of the file
    or directory name. Note that the -F option is an uppercase F. There are four UNIX
    file types: Directory, Executable, ASCII text file, and Symbolic link:


    +   - Directory–A forward slash (/) after the name indicates that this is a directory
    (or subdirectory). Directory is considered a type of file with UNIX.

    - ASCII Text–If there is no symbol after the name, this indicates a plain ASCII
    text file with no formatting characters in it. (ASCII is the American Standard
    Code for Information Interchange). The ASCII text file is similar to a DOS text
    file.

    - Executable–An asterisk (*) after the name indicates that this is a command,
    application, or script file that can be executed.

    - Symbolic Link–An sign (@) after the name indicates that this is a symbolic link,
    which is a way of giving a file alternate name. Symbolic links are covered later
    in this course.


