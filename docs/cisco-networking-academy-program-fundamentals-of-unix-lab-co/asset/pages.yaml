  md: '# Fundamentals of UNIX Lab Companion

    Lab 14.2.5 – Korn Shell Features

    Worksheet – Continued


    The default prompt for the Korn is the dollar sign ($). The user can customize
    their own shell prompt to their liking using the PS1 (Prompt String 1) predefined
    shell prompt variable (PS1=$). PS1 can include a wide range of expressions, such
    as character strings, commands, or other variables. The variable PS1 is a shell
    variable. Any change in the variable setting will remain until the shell is exited
    or until a subshell is opened. To make the customized prompt available from one
    session to the next, place the PS1 variable in the .kshshrc file (covered in Chapter
    15).


    ```

    PS1=value

    ```


    The following are several different ways the standard PS1 prompt ($) can be customized.
    Try each of these and experiment with some of your own.


    ```

    $ PS1="Good morning $\$

    ```


    This assigns the prompt to a character string. Use one of your own.


    ```

    $ PS1="uname -n ! $"

    ```


    This uses a command (uname -n) with the history line number (!) for a unique prompt.
    This command allows the prompt to show the name of the host on which you are working
    (e.g., saturn41). The back quotes ('' '') are used to substitute the output of
    the uname command instead of interpreting it literally. Double quotes surround
    the entire string.


    ```

    $ PS1="$\$

    ```


    This sets the prompt back to the original Korn shell dollar sign ($) prompt with
    a space after it.


    ```

    $ PS1="$PWD $"

    ```


    The prompt will contain the current working directory. Double quotes surround
    the string and allow expansion of the $PWD variable, which keeps track of the
    current working directory.


