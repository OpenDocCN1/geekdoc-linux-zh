    # Step 3. Using Control Characters to Perform Specific Tasks


    Control characters are used to perform specific tasks such as stopping and starting
    screen output. There are two control keys on most PC keyboards. They are normally
    labeled Ctrl and are found in the lower left and right corners of the keyboard.
    On a Sun workstation, there is one control key in the lower left of the keyboard
    labeled Control. When displayed on the screen, the Control key is represented
    by the caret (^) symbol.


    To enter a control character sequence, hold down the Ctrl key and press the appropriate
    character on the keyboard. Control-c is a common control character sequence and
    is frequently used to interrupt or cancel a process. The actual character in the
    shell appears as ^C, even though you press the Control key and the c key at the
    same time. Perform the actions indicated to practice using some of the more common
    control characters.'
