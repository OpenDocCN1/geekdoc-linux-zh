    To back up a group of files using the tar command and create a single tar file,
    use the syntax below. The cvf option is used to create (c) in verbose (v) mode
    a file (f). In this case, the files are archived (tree tree2) are on the hard
    drive in the current directory. The tar file to be created (tree.tar) will also
    be placed on the hard drive in the current directorybecause no other directory
    or device (floppy or tape device) is specified. You can specify several files
    (wildcards allowed) or the name of a directory to archive all the files in the
    directory. Whenever specifying the name of the file to create, add .tar to the
    end of the file so that you and others know it was created using the tar command.
    The tar command does not automatically add it for you.


