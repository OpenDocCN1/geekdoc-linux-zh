    # Step 9. Selecting and Replacing Text


    Text can be selected using any of the following methods:


    +   - Dragging over the text while pressing the left mouse button.

    - Double-clicking with the left mouse button to highlight a word.

    - Triple-clicking with the left mouse button to highlight a paragraph.

    - Quadruple-clicking with the left mouse button to highlight all the text in the
    file.


    After text is highlighted using any of these four methods, it will be replaced
    by whatever characters are typed at the keyboard.


