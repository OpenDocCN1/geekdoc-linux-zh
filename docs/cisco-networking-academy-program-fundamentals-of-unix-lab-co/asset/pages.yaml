    # Step 11. Customizing Your Shell Prompt


    The Korn shell uses the Bourne shell as a basis for its features. These shared
    features include a login initialization file and variables (a place holder for
    information used for customizing the shell). In addition, the Korn shell provides
    aliasing, command tracking, and command-line editing, which you have used so far
    in this lab. These features allow the user to be more productive. The initialization
