    # Step 5. Reviewing User-Specific Initialization Files


    After the system-wide initialization file that sets system-wide defaults is read,
    the user initialization files for the shell are read. The user initialization
    files provide flexibility to the user for customizing their environment. Login
    initialization and customization can be accomplished using the system-wide file
    /etc/profile by itself or in combination with the user-specific initialization
    files.


    The user initialization files can be used as templates by the system administrator,
    and then modified by the user. The user-specific initialization file(s).profile
    and .shrc are stored in the home directory of the user. The .shrc file is the
    primary file that is used to customize the Korn shell user''s environment. Depending
    on network administration policy, user-specific initialization files can perform
    or part of the following:


