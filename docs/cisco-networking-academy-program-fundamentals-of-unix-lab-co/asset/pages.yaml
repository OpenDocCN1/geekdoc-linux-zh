  md: '# Fundamentals of UNIX Lab Companion

    Lab 16.4.4 – Networking Commands

    (Estimated Time: 45 min.)


    # Objectives


    +   - Develop an understanding of UNIX and TCP/IP networking commands

    - Ping another TCP/IP host

    - Telnet to another host

    - Remote log in another host

    - Terminate a local process from a remote host

    - Use login and pkill to recover from a hung CDE session

    - Retrieve a file from another host with ftp

    - Use traceroute,to check the internet path (optional)


    # Background


    In this lab, you will work with UNIX and Transmission Control Protocol/Internet
    Protocol (TCP/IP) networking commands. TCP/IP provides network connectivity support
    for the UNIX operating system and many other network operating systems. All hosts
    attached to the Internet run the TCP/IP protocols. Several network commands are
    available to test connectivity and to connect to remote host machines for administration
    and troubleshooting. In this lab you will work with the TCP/IP ping troubleshooting
    utility, the telnet remote access utility, the file transfer protocol (ftp), the
    UNIX login remote access command, and the traceroute command.


    # Tools / Preparation


    Before starting this lab, review Chapter 16 of the Cisco Networking Academy Program:

    Fundamentals of UNIX Companion Guide.


    You will need the following:


    +   - A login user ID (such as user2) and password assigned by your instructor.

    - A computer running the UNIX operating system.

    - Networked computers in a classroom with the class file system installed.


    # Notes


