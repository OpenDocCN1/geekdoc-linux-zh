  md: '# Fundamentals of UNIX Lab Companion

    Lab 11.3.2 – Command Line Printing

    Worksheet


    Use the diagram of the sample class file system directory tree to assist with
    this lab.


    ![](img/bbe31e02758aa1c144da8c6f699725f6_183_0.png)


    # Step 1. Logging in to CDE


    Log in with the user name and password assigned to you by your instructor in the
    CDE entry box.


    # Step 2. Accessing the Command Line


    Right-click the workspace backdrop and click Tools. Select Terminal from the menu
    to open a Terminal window.


    # Step 3. Reviewing UNIX Printing Environment Components


    With the UNIX printing environment, users can have local printers attached to
    workstations or print to network printers. The system administrator sets up the
    environment by installing printers and defining print queues and servers to support
    them. Three main components are in the UNIX printing environment:


    +   **Printer**–A physical printing device. The printer may be attached to a workstation
    or network server, or it can be attached directly to the network using a hub or
    switch.

    **Printer name (queue)**–The name of a print queue associated with the physical
    printer. It is a logical name for the printer, which is assigned by the system
    administrator. This is the name the users print to. A print queue is a directory
    on the hard disk of a computer where print requests from users are stored.\n**Print
    server**–The computer that manages incoming print requests and releases them when
    the printer is ready. Print servers run the printer daemon lpsched, which manages
    print requests. The print queue is located on the hard disks of the print server.'
  merge: -1
  pgno: 183
- img_proc: true
  md: '# # Fundamentals of UNIX Lab Companion

    # Lab 11.3.2 – Command Line Printing

    # Worksheet – Continued


    Print requests or print jobs are stored on the hard disk until they are printed
    and then they are deleted or purged. A print server can be a workstation or a
    network server. The local computer can act as the print server for a local printer.
    Network print servers are usually centralized and can handle multiple printers
    and queues.


    Use the terms printer, printer name, and print server to fill in the blanks for
    the following questions.


    +   a. A device that runs the Ipsched daemon and holds the print in print queues
    on its hard disk is a \_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_

    b. A \_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_ is a physical device
    that outputs the printed material.

    c. The logical name that the user prints to is a \_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_.


    # ## Step 4. Printing Files with the lp Command


    Printing of ASCII text or PostScript files can be done from the command line using
    the lp (line printer) command. Do not use this method to print data files (files
    created in applications such as FrameMaker or Sun''s Star Office) or binary files.
    The function of the lp command is to queue data for printing. The format of the
    lp command with options available is shown here:


    ```

    lp [-options] [filename(s)]

    ```


    The following examples use the lp command with various options to print files.
    If you do not specify a printer, lp prints to your default printer. An administrator
    must set up the default printer in advance. Although these examples print only
    one file, it is possible to send multiple files simultaneously to the printer.
    (Wildcard metacharacters such as * and ? can also be used.)


    Display the name of your default printer:


    ```

    $ lpstat -d

    ```


    Print file2 in your home directory on the default printer:


    ```

    $ lp ~/file2

    ```


    Use the -d option to specify another printer (if one is available):


    ```

    $ lp -d staffp ~/file2

    ```


    Use the -o nobanner option to suppress banner page:


    ```

    $ lp -o nobanner ~/file2

    ```'
