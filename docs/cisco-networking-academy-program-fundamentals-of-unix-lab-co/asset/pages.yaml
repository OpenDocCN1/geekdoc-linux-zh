    # Step 6. Compressing Files


    It is frequently useful to archive files that have not been used for a while and
    then compress them so they take up less disk space. It is also a good idea to
    compress files before transferring them to another UNIX user (that has the uncompress
    command) to save time. Any file, including archives created with tar, can be compressed.
    Compression is a valuable tool because it reduces the amount of disk space files
    occupy, while keeping them readily available. The compress command is used to
    compress files and is included with all versions of the UNIX operating system.


    When files are compressed with the compress command, the original file is replaced
    using the same name but with a Z suffix appended to the end of the file. Note
    that this is an uppercase Z. When the compress command is used with the verbose
    -v option, it will show the name of the input (file.lst) and output file (file.Z)
    and the amount of compression achieved. Use the -l (long listing) command before
    compressing a file to see its original size in bytes, and then afterwards to see
    the compressed size. Multiple files can be compressed simultaneously and wildcard
    metacharacters are supported. Compressed files are considered binary and can be
    viewed with the cat or more commands. The following example will compress all
    files that begin with file, and will display the result in verbose mode.


    ```

    compress option file2

    compress -v file*

    ```


