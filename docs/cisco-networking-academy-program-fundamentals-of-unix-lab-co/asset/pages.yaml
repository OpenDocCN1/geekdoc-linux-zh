  md: '# Fundamentals of UNIX Lab Companion

    Lab 10.2.4 – Determining File System Permissions

    (Estimated Time: 30 min.)


    # Objectives


    +   * Display file system permissions

    * Interpret permissions

    * Determine User permissions for files

    * Determine Group permissions for files

    * Determine Other (Public) permissions for files

    * Determine file permissions for an executable file

    * Create a new file with default permissions

    * Create a new directory with default permissions


    # Background


    In this lab, you will become familiar with file system permissions. A major component
    in any comprehensive security policy, file system security determines who can
    get to what data and what they can do with it. System administrators set up file
    security based on users, groups, and permissions. Directory and file permissions
    are determined using the `ls` (list) command with the `-l` (long) option. You
    can determine the file type, permissions, owner and group with the `ls -l` command.
    You will display permissions on files and directories, interpret the results,
    and evaluate the effect on various user categories.


    # Tools / Preparation


    Before starting this lab, review Chapter 10 of the Cisco Networking Academy Program:

    Fundamentals of UNIX Companion Guide.


    You will need the following:


    +   * A login user ID (such as user2) and password assigned by your instructor.

    * A computer running the UNIX operating system.

    * Networked computers in a classroom with the class file system installed.


