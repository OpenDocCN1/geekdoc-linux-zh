  md: '# Fundamentals of UNIX Lab system

    Lab 9.1.8 – Using the vi Editor

    (Estimated Time: 45 min.)


    # Objectives


    +   - Become familiar with the UNIX text editor

    - Review the three vi modes

    - Review keystrokes to move between vi modes

    - Create a new file with vi

    - Invoke vi with showmode

    - Review the save and quit commands

    - Open an existing file with vedit

    - Use editing commands

    - Customize your session

    - Use search commands


    # Background


    In this lab, you will use a UNIX text-editing tool: the vi (pronounced "vee eye")
    editor. This editor is primarily used for creating and modifying files that customize
    your work environment and for writing scripts to automate tasks. System administrators
    use text editors to create and modify files used for networking, security, application
    sharing, and so on. The vi editor became a part of the UNIX operating system shortly
    after UNIX''s inception and is universally available with UNIX systems. The vi
    editor is a flexible and powerful editor with many options These will be reviewed
    in this lab with examples of their use.


    For users learning to become system administrators, it is important to know how
    to use vi. It is sometimes the only full-screen editor available to edit crucial
    system files. Examples of these include scripts and environment control files.
    Skill in using vi is also needed if the windowing system is not available. The
    vi editor is a useful tool when working remotely on other UNIX workstations or
    servers. Administrators remotely log in or telnet to another UNIX computer to
    perform maintenance and troubleshooting tasks using vi. The availability and operation
    of vi is consistent across all UNIX platforms.


    # Tools / Preparation


    Before starting this lab, review Chapter 9 of the Cisco Networking Academy Program:

    Fundamentals of UNIX Companion Guide.


    You will need the following:


    +   - A login user ID (such as user2) and password assigned by your instructor.

    - A computer running the UNIX operating system.

    - Networked computers in a classroom with the class file system installed.


    # Notes'
