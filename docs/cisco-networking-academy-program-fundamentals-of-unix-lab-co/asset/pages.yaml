    Click the Category button and select Printer Settings.


    This window enables you to set your personal options for the printing of calendar
    appointments.


    What is the name of your default printer?


    # Step 9. Changing Calendar Options – Date Format Settings


    Click the Category button and select Date Format. The Date Format window enables
    you to set the format for date and display date. Change the Date Ordering from
    MM/DD/YY to YYYY/MM/DD. You can change the date ordering to whatever format you
    prefer.


    # Step 10. Adding an Appointment Using the Appointment Icon


    Change to the Day view on your calendar. Click the Appointment Icon in the top
    left corner of the window and add an appointment to your calendar. Specify tomorrow’s
    Date, the Start and End times, and what the appointment is. Click Insert to add
    the appointment to your calendar. Click tomorrow’s date to verify the appointment
    you made is there.


    # Step 11. Adding an Appointment by Clicking the Calendar


    While in the Day view, double-click any time slot to set an appointment. You should
    only have to enter what the appointment is and click Insert to add.


    # Step 12. Adding a Recurring Appointment


    While in the Day view, click next Tuesday’s date. Add an appointment for a regular
    staff meeting to occur every Tuesday at 9:00 a.m. (you may have to click on the
    more button to view the frequency and reminders options). Check a future week
    to verify that the weekly staff meeting is on your calendar.


    # Step 13. Creating a To Do List


    Click the To button in the upper left corner of the window and add a To for project
    status due next Tuesday at 9:00 a.m. Click Insert to add it to your Do list. Add
    another To for pick up laundry on Thursday at 6:00 p.m. To items do not show in
    the calendar. To see a list of Dos for the week, click the Week view for next
    week,click the View menu option, and select To List.


    # Step 14. Finding an Appointment


    The Find window enables you to search for text in the appointment entries. You
    can specify the time period to search, giving a start and end date. Once appointments
    have been found, you can double-click the details: Create an appointment month
    from now and enter the networkers conference in the What entry area. Click back
    to today’s date. To search for the appointment, click the View menu and then click
    Find. Enter the text to find as net. This will locate any appointments with the
