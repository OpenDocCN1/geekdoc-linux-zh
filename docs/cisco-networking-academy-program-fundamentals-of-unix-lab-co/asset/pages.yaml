    # Step 9. Using the kill Command to Terminate a Process


    Signals are used to terminate, suspend, and continue processes. Using Ctrl-c can
    sometimes terminate a process that is not responding. This sends an interrupt
    (INT) signal to the process, terminating it and any child processes it may have
    spawned.


    The kill command provides a direct way to terminate unwanted processes. It is
    useful when you want to stop a command that takes a long time to run, when you
    need to terminate a process that you cannot quit in the normal way. Specifying
    the PID normally kills a process.


    ```

    kill [-signal] process-id

    ```


    To terminate a process with the kill command, you would first type ps to find
    the PID(s) for the process(es) and then type kill followed by the PID(s). If you
    use the kill command without specifying a signal, signal 15 (SIGTERM) is sent
    to the process with the specified PID. This is referred to as a soft kill and
    usually causes the process to terminate. It is best to kill a process, if possible,
    since it closes properly and terminates the process(es) gracefully.


    If you need to forcibly terminate a process, you can use the -9 option with the
    kill command. This option is referred to as a sure kill and is necessary for killing
    shells that will not respond to any other terminal signal.


    ```

    kill -9 Process-id

    ```


    Note: For processes other than shells, use the kill -9 (SIGKILL) command as a
    last resort because it is an abrupt method and does not allow for proper process
    termination.


