  md: '# Fundamentals of UNIX Lab Companion

    Lab 7.1.1.2 – Copying Files and Directories

    (Estimated Time: 45 min.)


    # Objectives


    +   - Practice using the cp command to copy files and directories

    - Copy files within the same directory to create backups

    - Copy files to other directories

    - Copy directories within the same directory

    - Copy directories to other directories


    # Background


    In this lab, you will perform more advanced file and directory management tasks
    using the command line interface and the cp (copy) command. Copying files is a
    normal occurrence working with the file system. Files can be copied between local
    drives such as the floppy disk, hard disk, and CD-ROM. They can also be copied
    between local drives and network drives on servers. A common use of the copy command
    is to make a backup of an existing file for safe keeping so that the original
    can be modified. The cp command can also be used to create a local backup of a
    directory or group of directories in a tree structure.


    # Tools / Preparation


    Before starting this lab, review Chapter 7 of the Cisco Networking Academy Program:

    Fundamentals of UNIX Companion Guide.


    You will need the following:


    +   - A login user ID (such as user2) and password assigned by your instructor.

    - A computer running the UNIX operating system with Common Desktop Environment
    (CDE).

    - Networked computers in a classroom.


    # Notes'
  merge: -1
