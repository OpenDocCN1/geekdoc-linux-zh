  md: "# Fundamentals of UNIX Lab Companion\nLab 10.3.3 – Changing Permissions from\
    \ the Command Line\nWorksheet – Continued\n\nThe r (read) permission is assigned\
    \ a value of 4, the w (write) permission a value of 2, and the x (execute) permission\
    \ a value of 1. By adding up the numbers, we get a total of three permissions\
    \ for that category of user (User, Group, or Other). For instance, if the User\
    \ (owner) permission for a file is r w x, we add 4 (read) + 2 (write) + 1 (execute)\
    \ which equals 7. If the Group had r w - permissions, they would have 4 + 2 +\
    \ 0 (no execute) for a total of 6. If Other had only r they would have 4 + 0 +\
    \ 0 (no write or execute) for a total of 4. The octal_mode for this file or directory\
    \ is 764.\n\n+   Fill in the following table by converting the character permissions\
