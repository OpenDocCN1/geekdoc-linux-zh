  md: '# Fundamentals of UNIX Lab Companion

    Lab 11.3.2 – Command Line Printing

    (Estimated Time: 30 min.)


    # Objectives


    +   - Develop an understanding of UNIX command-line printing

    - Review UNIX printing environment components

    - Print files with the lp command

    - Monitor print jobs and queue status

    - Cancel print requests


    # Background


    In this lab, you will work with UNIX printing commands to send jobs to printers
    and manage print queues. Printing services are an essential component of any network
    operating system. UNIX provides local and remote printing capabilities. You will
    review the major components of the UNIX printing environment and work with the
    command line method of printing by using the lp command. The lpstat command is
    used to determine the status and availability of network printers, determine print
    request IDs, and remove print requests using the cancel command.


    # Tools / Preparation


    Before starting this lab, review Chapter 11 of the Cisco Networking Academy Program:
    Fundamentals of UNIX Companion Guide.


    You will need the following:


    +   - A login user ID (such as user2) and password assigned by your instructor.

    - A computer running the UNIX operating system.

    - Networked computers in a classroom with the class file system installed.

    - Network printer available and print server running.


