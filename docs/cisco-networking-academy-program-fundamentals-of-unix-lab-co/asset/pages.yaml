  md: '# Fundamentals of UNIX Lab Companion

    Lab 13.3.2 – Managing System Processes

    (Estimated Time: 50 min.)


    # Objectives


    +   - Develop an understanding of UNIX process management

    - Review system process concepts

    - Review the ps command and options

    - List processes in the current shell

    - List all processes running on the system

    - Search for a specific process by command name

    - Identify a process to terminate

    - Use the kill command to terminate a process

    - Find and terminate a process by user

    - Terminate a process by command name


    # Background


    In this lab, you will work with UNIX commands to identify and control system processes.
    The UNIX operating system manager handles tasks using processes. Processes can
    be initiated by either operating system or by users. The majority of tasks you
    perform in the UNIX environment starts a process. A process can start or spawn
    a child or subprocess, creating a process hierarchy or tree similar to the file
    system structure with parent / child relationships. You will work with the ps
    (process status) command to monitor system processes and the kill command to terminate
    unwanted process. You will also work with the Solaris commands pgrep (grep) and
    pkill (process kill).


    # Tools / Preparation


    Before starting this lab, review Chapter 13 of the Cisco Networking Academy Program:

    Fundamentals of UNIX Companion Guide.


    You will need the following:


    +   - A login user ID (such as user2) and password assigned by your instructor.

    - A computer running the UNIX operating system.

    - Networked computers in the classroom with the class file system installed.


    # Notes


    ________________________________________________________________________________________________

    ________________________________________________________________________________________________

    ________________________________________________________________________________________________

    ________________________________________________________________________________________________

    ________________________________________________________________________________________________'
