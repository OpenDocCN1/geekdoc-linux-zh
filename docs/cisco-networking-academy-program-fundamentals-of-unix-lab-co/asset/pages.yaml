  md: '# Fundamentals of UNIX Lab Companion

    Lab 4.3.3 – Using Command Line Helper

    (Estimated Time: 30 min.)


    # Objectives


    +   - Become familiar with the function of man pages

    - Access command line help using the man command

    - Use the man pages to determine the use of various UNIX commands

    - Work with man pages and navigate through them


    # Background


    In this lab, you will work with command line help in the form of UNIX man pages.
    The UNIX Programmer’s Manual (also called man pages) describes what you need to
    know about the system’s online commands, system calls, file formats, and system
    maintenance. The online man pages are part of the Solaris computing environment
    (and all other versions of UNIX) and are installed by default. Man pages are the
    form of simple character-based screen displays and are not graphical.


    To access the man pages, you will need to be at a command prompt. You can log
    in at the command line or open a Terminal window in Common Desktop Environment
    (CDE) and start with a command prompt, such as the Korn shell ($). Man pages are
    helpful when you want to use a command or utility and you have forgotten the syntax,
    or when you need information about how to use a command or a utility. The man
    pages will provide information on how to enter the command, a description of its
    purpose, and what options or arguments are available. Some commands will not work
    with all three shells. The man pages will tell which commands will work with which
    shells. They refer to the Bourne shell as (sh), the Korn Shell as (ksh) and the
    C Shell as (csh).


    # Tools / Preparation


    Before starting this lab, review Chapter 4 of the Cisco Networking Academy Program:
    Fundamentals of UNIX Companion Guide.


    You will need the following:


    +   - A login user ID (as user 2) and password assigned by your instructor.

    - A computer running the UNIX operating system with CDE or access to the command
    line of a remote computer.

    - The catman utility must be run by root on each host.

    - Networked computers in a classroom.


    # Web Site Resources


    Sun Microsystems-www.sun.com/solaris


    # Notes'
  merge: -1
  pgno: 51
- img_proc: true
  md: '# Fundamentals of UNIX Lab Companion

