  md: '# Fundamentals of UNIX Lab Companion

    Lab 6.1.10 – Basic Command Line File Management

    Worksheet – Continued


    +   - Filename Extensions–Filenames can contain one or more extensions. Extensions
    are usually appended to a file by an application. Extensions are usually one to
    three characters that are appended to the end of a filename and are preceded by
    a period (.). You might choose to use this convention when naming files, but it
    is not a necessary part of a filename.


    +   - Directory Name Extensions–Directory names generally do not contain extensions,
    but there are no rules against it.


    +   - Case Sensitivity–UNIX file and directory names are case sensitive. Project1
    is not the same file as project! the same name in the directory. Use lowercase
    letters as a general rule


