  md: '# Fundamentals of UNIX Lab Companion

    Lab 10.3.3 – Changing Permissions from the Command Line

    (Estimated Time: 45 min.)


    # Objectives


    +   * Work with the file system to control security access

    * Review chmod command modes

    * Change permissions using symbolic mode

    * Change directory permissions using symbolic mode

    * Determine octal mode permissions

    * Change file permissions using octal mode

    * Change directory permissions using octal mode

    * Create a script file using the vi editor and make it executable


    # Background


    In this lab, you will analyze and change UNIX file system permissions using command-line
    utilities. File and directory permissions can be changed using chmod (change mode)
    command. Normally the default permissions for a file or directory are adequate
    for most security needs. This means when you will want to change the permissions
    of a file or directory. By default, all files are created with permissions that
    allow the user category of Other to read the file. This means that anyone with
    a login id can see and copy the contents of the file. For classified files and
    private information, you can modify the permission of the file to prevent others
    from accessing it.


    Shell scripts are another example of where you would want to change permissions.
    When you create a shell script file (or any file), the default permissions do
    not include Execute, even for the owner/creator of the file. To run the shell
    script, you must change the permissions by adding the Execute permission for the
    user (owner) category.


    # Tools / Preparation


    Before starting this lab, review Chapter 10 of the Cisco Networking Academy Program:
    Fundamentals of UNIX Companion Guide.


    You will need the following:


    +   * A login user ID (such as user2) and password assigned by your instructor.

    * A computer running the UNIX operating system.

    * Networked computers in a classroom with the class file system installed.


    # Notes'
