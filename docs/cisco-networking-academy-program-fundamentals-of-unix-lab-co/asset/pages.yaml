  md: '# Fundamentals of UNIX Lab Companion

    Lab 13.3.2 – Managing System Processes

    Worksheet – Continued


    | ps Option Meaning Function |

    | --- ps | No Options | Displays information for current user processes in the
    current shell or Terminal window. |

    | ps -e | Every | Displays information about every process on the system. |

    | ps -f | Full | Generates a full listing with all available information on each
    process. |

    | ps -u userid | User | Displays all processes for a particular user. |


    The basic ps command only displays information about processes in your current
    shell. You will only see processes that have been initiated with this Terminal
    window.


    | PID TTY TIME CMD |

    | --- --- -- -- |

    | 785 pts/6 0:45 | dbprog |

    | 742 pts/6 0:00 | csh |

    | 689 pts/6 0:00 | /bin/ksh |


    +   a. From your current Terminal window, practice using the ps command with each
    of the options shown.


    The -ef command displays all information about every process running on the system:


    | UID PID C STIME TTY TIME CMD |

    | --- --- --- -- -- -- -- |

    | root 785 342 80 16:46:41 pts/6 0:01 dpbrug |


    The following table define the column headings for the ps -ef command.


    | Value Column Headings |

    | --- --- |

    | UID | The user ID of the user that initiated the process. |

    | PID | The process identification number of the process. The PID is used to kill
    a process. |

    | PPID | The parent process identification number of the process. |

    | C | The priority of the process. |

    | STIME | The start time for the process. |

    | TTY | Terminal type - the controlling terminal for the process. |

    | TIME | The amount of CPU time used by the process. |

    | CMD | The command name or daemon (name of the program executed). |'
