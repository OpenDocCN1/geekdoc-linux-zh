    # Background


    In this lab, you will use the ls (list files) command, which is used to display
    the contents of a directory. This command will display a listing of all files
    and directories within the current directory or specified directory(s). If no
    path name is given as an argument, ls will display the contents of the current
    directory. The ls command will list any subdirectories and files that are in the
    current working directory if a path name is specified. It will also default to
    a wide listing command, which displays only file and directory names. There are
    many options that can be used with the ls command, which makes it one of the more
    flexible and useful UNIX commands.


    Command format:


    ```

