    the local system. This command lists the users'' name, terminal, login time, elapsed
    time since the last activity on the terminal line, and the machine (host) name
    the user logged from. A UNIX workstation will typically have only one user logged
    in (the primary user) but a UNIX server can have many users logged in simultaneously.


