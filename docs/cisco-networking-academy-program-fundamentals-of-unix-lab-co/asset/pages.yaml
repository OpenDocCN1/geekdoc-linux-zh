    - Use the following table to record the results of using the lpstat command with
    various options listed, after you have sent some jobs to the queue.


    # Print Queue Options with lpstat


    | Option Name | Meaning | Results of Command |

    | --- | --- | --- | |

    | Printer Name | Name of printer (queue) | Displays requests for a specific printer’s
    queue | |

    | -p | Printers | Displays status of all printers | |

    | -o | Output (Outstanding) | Displays status of all output or outstanding print
    requests | |

    | -d | Default | Displays which printer is the system default | |

    | -t | Tell All | Displays complete status information for all printers | |

    | -s | Summary | Displays a status summary for all printers configured on your
    system | |

    | -a | Accepting | Displays which printers are accepting requests | |


    Step 6. Canceling Print Requests

    Times arise when you want to remove a print request from the print queue. If the
    print job has not already printed, and is still in the print queue, you can cancel
    it. You can only cancel those print requests that you have initiated. You cannot
    remove another user’s print requests. Only the system administrator can cancel
    print jobs for other users.


    The cancel command enables you to cancel print requests previously sent with the
    lp command. To do this, you first use the lpstat command to identify the request-ID.
    If you cancel a print job, it does not affect the request ID numbers of the other
    jobs still in the queue.'
