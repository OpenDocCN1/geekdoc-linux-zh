    **Step 6. Using the ls Command with Square Brackets**

    Square brackets ([]) can be used to match a set or range of characters for a single
    character position in the file or directory. The characters inside the brackets
    do not generally need to be in any order; for example, [abc] is the same as [cab].
    However, if you are looking for a range of characters, they must be in the proper
    order (for example, [a-z] or [3-9]). If you want to search for all alphabetical
    characters, whether lowercase or uppercase, use [A-z] for the pattern to match.
    You can use alph or numeric characters for the search pattern.'
