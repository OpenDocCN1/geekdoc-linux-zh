    machine from their machine. Verify that you are in your home directory by issuing
    the pwd command.


    +   c. Terminate the process for the Clock application. What was the result?


    +   d. Remain remotely logged on your system and terminate your login session
    as if your system was not responding. Did your system return to the CDE Login
    Manager?


    +   e. Return to your system and log back in.


    # Step 7. Retrieving a File from Another Host with ftp


    The File Transfer Protocol (ftp) application is part of the TCP/IP protocol suite
    and is standard with the UNIX operating system. It can be used to transfer files
    using ASCII (for text files) or binary (for all other file types) mode between
    systems using similar or dissimilar operating systems. This provides a basic means
    of transferring files from one file system to another. Remember, if you transfer
    a binary file using the default ASCII (text) mode, the copied file will be useless.'
