    # Step 6. Piping from One Command to Another


    One of the most powerful metacters is the pipe (|). It takes the standard output
    of one command and passes it as standard input into a following command (usually
    the more command, the lp (line printer) command, or a file processing command
    like grep or sort, which is covered in Chapter 8). The pipe symbol is sometimes
    referred to as a double vertical bar and is found below the Backspace key. You
    must always have a command on each side of a pipe. Spaces between the commands
    and the pipe are optional.


    Here’s the command format:


    ```

    command | command

    ```


