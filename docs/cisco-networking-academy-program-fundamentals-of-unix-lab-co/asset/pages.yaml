    # Step 8. Identifying a Process to Terminate


    The ps -ef command displays a full listing of every process, including the PID
    and PPID. When trying to terminate a program or release a hung terminal window,
    it might not be enough to kill the PID associated with the unresponsive application.
    It might be necessary to kill the parent of that process, and on rare occasion,
    the parent of the parent. You must be able to look at a PID and PPID in order
    to trace up the hierarchy from the child to the parent processes that spawned
    them.


    You must first identify the PID of the lowest unresponsive process. Normally,
    you would try to kill this process. If this does not stop the process, you might
    need to kill its parent. Killing a parent process will kill all child processes
    spawned by it. It is also much quicker to kill a parent process than kill several
    child processes.


