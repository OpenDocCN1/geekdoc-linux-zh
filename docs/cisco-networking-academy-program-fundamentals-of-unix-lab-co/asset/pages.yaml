  md: '# Fundamentals of UNIX Lab Companion

    Lab 15.2.1 – Customizing the Korn Shell

    Worksheet – Continued


    initialization file they are in. Users can customize many of these variables for
    their own

    environment by placing them in the initialization files in their home directory.
    To make the

    customizations available to all subsequent shells, the variable must be exported.


    Commands-Unlike variables, commands (such as aliases) cannot be exported (made
    available

    to all sub-shells). If commands are to be available in a subshell, they must be
    placed in a

    secondary initialization file that is read each time a subshell is opened, such
    as the .kshrc.


    Using the previous information, fill in the blanks in the following sentences:


    +   a. The two levels of initialization files are ________ and ________.


    +   b. For the Korn shell user, the ________ file and the ________

    file reside in the user’s home directory and can be used to customize their login
    environment.


    +   c. ________ are used to customize your shell and are either

    global or local.


    +   d. For a variable to be available to subshells, it must be ________.


    +   e. If commands are to be available in a subshell, they must be placed in a

    file that is read each time a subshell is opened, such as the .kshrc.


    # Step 4. Reviewing System-Wide Initialization Files


    The primary system-wide initialization file is the profile file, which is installed
    in the /etc directory.

    The /etc/profile file is created by default when the operating system is installed
    and can be edited

    and customized by a system administrator. /etc/profile applies to all users that
    run either the

    Bour or Korn shell. When a Korn user logs in, the system reads /etc/profile file
    first,

    and it reads the user’s .profile file, then the .kshrc file. This means that the
    user’s

    preferences for variables can override the default settings and can be maintained
    by a

    system administrator in the /etc/profile file. The /etc/profile performs several
    functions,

    ofof which are listed here:


    +   Exports Environment Variables–Makes environment variables available to sub-shells,

    such as LOGNAME for login name.


