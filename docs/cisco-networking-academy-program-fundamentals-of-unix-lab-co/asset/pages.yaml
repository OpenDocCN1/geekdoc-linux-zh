    with others. You can set appointments and create Do lists. You can also view appointments
    and set meetings on other people''s calendars.


    # Tools / Preparation


    Before starting this lab, review Chapter 3 of the Cisco Networking Academy Program:
    Fundamentals of UNIX Companion Guide.


