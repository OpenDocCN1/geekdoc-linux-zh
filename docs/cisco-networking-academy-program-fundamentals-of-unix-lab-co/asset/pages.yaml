  md: '# Fundamentals of UNIX Lab Companion

    Lab 3.1.6 – Using CDE Mail Tool

    Worksheet – Continued


    Compose another message and attach a file from your home directory. Send it to
    another person

    in the class. What file did you attach?


    What user and host name did you send it to?


    # Step 7. Responding to a Mail Message


    To reply to a message that you have received, select the message and choose one
    of the Reply

    options from the Compose menu. You are given the choice of replying to the sender
    or to all

    recipients of the message. You are also given the choice of including the original
    message. If you

    want to reply and include the message you received, you can bypass the Compose
    menu and

    click the Reply, Include icon on the toolbar of the Mail Tool. Reply to one of
    the mail

    messages you have received.


    # Step 8. Deleting a Mail Message


    Choosing to delete mail messages does not immediately remove them. Rather, the
    messages

    are stored until you close the mail window. This gives you the opportunity to
    decide not to delete

    tessages. You can force the mail program to delete any mail messages that were
    previously

    selected for deletion by clicking on Destroy Deleted Messages from the Mailbox
    menu. Delete

    one of the mail messages you have received.


    # Step 9. Undeleting a Mail Message


    While you continue to work with the mail program, you can view a list of the deleted
    mail

    messages and undelete one or more messages from the list. To restore a message
    that was just

    deleted, choose Undelete Last from the Message menu. When a message is deleted,
    it will reappear in the

    list of received mail messages. Restore the message you deleted in the previous
    step.


    # Step 10. Creating an Alias


    Mail Tool provides a tool that allows you to set up aliases for either a particular
    person or

    group of people that you frequently send mail to. A alias is similar to a group
    or distribution

    list with many mail systems. Click on Alias from the Options menu to create and
    manage mail

    aliases. Choose a name for the alias and enter the e-mail addresses of all users
    you want to be

    part of the alias. A comma must separate the e-mail addresses. After any alias
    is entered, click

    Add to place it in your list of aliases. When you are finished creating aliases,
    click OK.


    Create an alias, including three of your fellow students, and send a message to
    the aliases.'
