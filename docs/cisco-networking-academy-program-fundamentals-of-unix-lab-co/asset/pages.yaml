    # Step 4. Telnet to Another Host


    Telnet is a client-server emulation program that allows you to connect to another
    system. The telnet server serves a terminal in order to authorize a user or telnet
    client to connect to a remote system and work in that environment. When you telnet
    to another host, you are prompted for a name of account on the remote system and
    password. After a session is established from your telnet client, you enter commands
    as if you were entering them directly on the server console. You can telnet to
    different hosts and have multiple telnet sessions opened simultaneously.


    Telting to another host is helpful under the following circumstances:


    +   * To access information on another workstation.

    * To access your workstation remotely to read mail.

    * To kill a process that has caused your or another user’s workstation to hang.'
