    **Step 5. Determining User Permissions for a File**

    The nine permissions are divided into three sets of three permissions. Each set
    of three permissions is always in the sequence of r (read), w (write), and then
    x (execute). If a permission is not allowed, a dash (-) will be in its place.
    The first set of three permissions is the User set of permission. These permissions
    determine what the owner can do.


    +   a. Who is the owner of the dante file?


    +   b. What are the first two characters of the User permissions?


