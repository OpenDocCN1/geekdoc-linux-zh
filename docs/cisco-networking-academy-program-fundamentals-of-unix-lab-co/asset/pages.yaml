  md: '# Fundamentals of UNIX Lab Companion

    Lab 4.3.3 – Using Command Line Helper

    Worksheet – Continued


    # Step 10. Interpreting man Page Headings


    A number of different headings or informational areas are in a typical man page.
    The more common ones are the following:


    +   - NAME-Name of the command and commands that might accomplish the same thing

    - SYNOPSIS–Shows the syntax of the command with any allowable options and arguments

    - DESCRIPTION–Gives an overview of the command does

    - OPERANDS–Target of the command or what the command will take effect on, such
    as a directory or file

    - OPTIONS–Switches that change the function or effect of the command. They are
    normally preceded by a dash (-) or minus sign

    - SEE ALSO–Refers to you other related commands and subjects


    These headings are displayed in the man page output using all capital letters.
    Depending on the command and its purpose, the man page may not contain all headings.
    For instance the pwd (Print Working Directory) command does not have any options
    or operands information heading because there are no options or operands that
    can be used with the command. All commands will have at least a Name, Synopsis,
    and Description.


    +   a. Enter the man command for clear and note which headings are shown.


    +   b. Enter the man command for pwd and note which headings are shown.


    +   c. Enter the man command for date and note which headings are shown.


