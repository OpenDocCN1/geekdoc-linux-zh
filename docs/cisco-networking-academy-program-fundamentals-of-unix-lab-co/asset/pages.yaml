    **Step 4. Interpreting Permissions**

    Use the following table as a review of permissions and answer the following questions.

    *Note:* The interpretation of permissions is different for files and directories.


    | Permission | Symbol | Plain File | Directory |

    | Read | r | File can be displayed or copied (copied file takes on new owner).
    Can''t move or remove a file with only read permission. | Contents can be listed
    with the ls command. Must also execute permission to use ls command. |

    | Write | w | File can be modified, moved, and removed (only if the directory
    resides in has write permission). | Files can be added or deleted. Directory must
    also execute permission. |

    | Execute | x | File can be executed (shell script or executables). | Controls
    access to the directory. A user can cd to the directory and list the contents
    with read access. Files can be moved or copied to the directory with write access.
    |

    | No Permission | - | A dash (-) indicates that permission is denied. | A dash
    (-) indicates permission is denied. |'
