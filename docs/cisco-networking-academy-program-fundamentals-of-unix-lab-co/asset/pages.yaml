    **Step 4. Creating Files with the touch Command**nEvery time you create a new
    word processing document or spreadsheet, you are creating a new file and should
    adhere to the file naming conventions previously mentioned. You must also have
    adequate permissions for the directory in which you are working to create files.


    Using the **touch** command, you can create one or multiple files simultaneously.
    Some applications require files to exist before they can be written. The **touch**
    command is useful for quickly creating files to experiment with. You can also
    use the **touch** command to update the time and date that a file is accessed.
    This resets the archive bit and make the file available for back up again. Absolute
    and relative pathnames can be specified when creating files or directories.


    Command format:


    ```

    `touch filename(s)`

    ```


