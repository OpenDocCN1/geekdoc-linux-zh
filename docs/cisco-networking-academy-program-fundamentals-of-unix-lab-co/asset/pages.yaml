  md: '# Fundamentals of UNIX Lab Companion

    Lab 10.2.4 - Determining File System Permissions

    Worksheet


    Use the diagram of the sample class file system directory tree to assist with
    this lab.


    ![](img/bbe31e02758aa1c144da8c6f699725f6_163_0.png)


    # Step 1. Logging in to CDE


    Log in with the user name and password assigned to you by your instructor in the
    CDE entry box.


    # Step 2. Accessing the Command Line


    Right-click the workspace backdrop and click Tools. Select Terminal from the menu
    to open a Terminal window.


    # Step 3. Displaying Permissions


    Permissions control what can do to files and directories in the file system. Directory
    and file permissions can be determined using the **ls** (list) command with the
    **-l** (long) option. The **ls -l** command displays a long listing of the contents
    of a directory. If a **-a** (all) option is included, all files, including hidden
    files (those beginning with a dot), are displayed.


    The following table provides a review of the information displayed with the **ls
    -l** command.


    *Note:* When working with permissions, File Type, Permissions, Owner, Group and
    File/Directory name are the most important pieces of information in the listing.'
