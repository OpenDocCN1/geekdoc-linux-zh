    # Step 5. Remotely Logging in to Another Host


    Use the login command to establish a remote login session on another UNIX host,
    which can be a server or a workstation. Remotely logging in to another host is
    helpful under the following circumstances:


    +   * To access information on another workstation.

    * To access your workstation remotely to read mail.

    * To kill a process that has caused you or another user''s workstation to hang.


    You can login to any UNIX system provided that you know the username and password.
    It is possible that you have the same named account on multiple systems that would
    allow you to login to another system using the same account name.


    Use the -l option to specify a different login ID for the remote login session.
    The system administrator can set up a guest account so that users can remotely
    log on to a server. Before attempting to remotely log in another system as a different
    user, be sure you have an account on the desired remote machine.


    ```

    login hostname -l username

    ```


