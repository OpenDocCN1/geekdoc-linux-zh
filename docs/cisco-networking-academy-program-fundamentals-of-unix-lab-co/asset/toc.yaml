  - 背景 在在本实验中，你将使用 Sun Solaris AnswerBook2 并熟悉各种可用在线手册集。AnswerBook2 系统允许你使用浏览器查看许多印刷版
    Solaris 手册的在线版本（包括图形）。默认情况下，AnswerBook2 使用 HotJava 浏览器显示信息。通过 AnswerBook2，你可以通过个人研究和自学来学习
    Solaris。
