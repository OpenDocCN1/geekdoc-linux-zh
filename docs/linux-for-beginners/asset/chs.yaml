- "# Linux 初学者指南\n\n\n\n![](img/cover00091.jpeg)\n\n\n\n\n\n\n\n\n\n\n\n\n\n# 引言\n\
  \n普通用户并不清楚 Linux 操作系统（OS）是最广泛使用的平台。它适用于智能手机、智能手表、冰箱、洗衣机、视频游戏机和数字录像机（DVR）等设备。Linux\
  \ 可用于托管网站、构建保护的文件或电子邮件服务器、诊断你拥有的其他设备，并可能恢复崩溃的文件。NASA、戴尔、IBM 和惠尔公司也加入了 `Linux Shell`。它最初是作为\
  \ UNIX 不同迭代版本的家族扩展而创建的。它是一个免费的开源代码，由 Linus Torvalds 于 1991 年 10 月发布。得益于 Linux 的开源，下一代开发者愿意为此努力。这是一件积极的事情，但正如你所看到的，许多模型面临着挑战。`Linux\
  \ Kernel` 控制着一些最大的超级计算机，以及被称为此类的设备。\n\n## 必要的软件\n\n如果你手头有一个兼容 Linux 的文本编辑器或高级开发环境，将会非常有帮助。沙箱允许程序在机器中的少量环境中运行。在为新应用程序编写代码时，沙箱是必不可少的。有很多不同的\
  \ Linux 沙箱，大多数是免费的，但没有任何开源软件是完全免费的。你将首先使用 `Linux kernel`，它包含了只能通过内核执行的特定程序和命令。你可以对你的框架进行某些修改和调整。可以转换成英语的语言是开始编程的最简单方法。\n\
  \n## 编程语言\n\nLinux 最常用的编程语言是 C 语言，这种语言最早于 1972 年出现在贝尔实验室。C 语言是最早的语言之一。可以使用任何编程语言来编写\
  \ Linux 代码，但你使用最常用的语言是为 Linux 编写代码最简单的方法。Java、C++ 和 Python 等新语言允许更高的灵活性和更复杂的程序，例如区块链构建。在各种语言中进行编码以便在\
  \ Linux 上运行，需要的是与 `Linux kernel` 一致的编译。这就是你开始 Linux 编程所需的一切。如果你有一个文本编辑器、一个 `Linux\
  \ shell`、一个高级编程环境，以及一台性能良好且稳定的机器和一个 Linux 发行版，那将会有帮助。\n\n# 第 1 章：操作系统历史\n\n早期的计算机没有任何应用程序。运行在这些第一批计算机上的每个程序都要求输入运行计算机所需的所有代码、连接到连接的硬件并执行运行程序所要计算。这种情况使得即使是最简单的程序也变得复杂。\n\
  \n为了解决这个问题，计算机所有者开始开发系统软件，使能够编写并执行计算机程序，从而诞生了第一个应用程序。\n\n第一个操作系统是由通用汽车公司于 1956 年使用一台\
  \ IBM 单机开发的。20 世纪 60 年中期，IBM 是第一个承担开发应用程序任务的计算机制造商，并开始分发安装在计算机上的应用程序。\n\n现在，第一个操作系统开发于\
  \ 1950 年，当时计算机一次只能运行一个程序。几十年后，计算机开始安装额外的软件程序（有时被称为库），它们汇在一起创造了现代应用程序的开端。\n\n20 世纪\
  \ 60 年中期，第一版本的 UNIX 应用被开发出来。它用 C 语言编写，并在早期是免费提供的。UNIX 很容易适应新程序，并迅速被广泛采用。\n\n大多数现代操作系统，包括\
  \ Apple OS X 和所有不同的 Linux 版本，都追溯或依赖 Unix 操作系统。\n\n微软 Windows 的开发是为了响应 IBM 运行其计算机或\
  \ PC 运行系统的应用。\n\n微软的第一个操作系统不叫 Windows；它被称为 `MS-DOS`，构建于 1981 年，当时它从 Seattle Computer\
  \ Products 购买了 `86-DOS` 操作系统并对其修改以满足 IBM 的需求。\n\n\n\n\n“Windows”最早用于 20 世纪 90 年代，当时图形用户界面被创建并与\
  \ `MS-DOS` 配对或集成。\n\n正如我们看到的，今天 Apple、`OS X`、`Microsoft Windows` 以及各种 Linux 版本（包括\
  \ `Android`）占据了当今大多数操作系统市场。\n\n许多软件操作系统设计为与特定公司的操作系统配合，例如 `Windows`（微软）或仅限 `macOS`（苹果）。\n\
  \n软件会指示支持哪些操作系统，并在适用的情况下指定更多信息，包括它支持的相关操作系统版本。例如，视频制作软件可能兼容 `Windows 10`、`Windows\
  \ 8` 和 `Windows 7`，但不兼容 Windows 之前的版本，如 `Windows Vista` 和 `XP`。\n\n软件开发者经常发布不同版本的软件，以适用于其他应用程序或不同类型环境。回到视频制作程序的例子，该公司还可以发布另一个具有相似功能但适用于\
  \ `mac OS` 或 `Windows` 操作系统的程序版本。\n\n此外，了解你的应用程序是 32 位还是 64 位的也关重要。这是在你下载软件时他们经常问你的一个常见问题。\n\
  \n## 1.1 什么是操作系统？\n\n操作系统（`OS`）是一个程序，在初始安装到带有引导程序的计算机后，它负责管理计算机上的所有其他系统程序。应用程序使用应用程序通过定义的应用程序接口（`API`）发出服务请求。用户还可以通过用户界面与操作系统直接通信，例如命令行界面（`CLI`）或图形用户界面（`GUI`）。\n\
  \n### 为什么要使用操作系统？\n\n操作系统为计算机软件和软件开发带来了强大的优势。在应用程序之外，整个应用程序都需要进入其 UI，以及用于管理所有底层计算机操作（如磁盘存储、网络连接等）的大量代码。考虑到可用的硬件数量，这将减小所有应用程序的大小并使软件升级失效。\n\
  \n相反，大多数常见任务（如发送网络包或在某些标准输出设备（如显示器）上显示文本）可以发送给系统软件，它充当应用程序与硬件之间的链路。系统软件为应用程序提供一致且重复的方法与硬件交互，而无需应用程序了解任何硬件细节。\n\
  \n只要每个应用程序都以相同的方式访问资源和服务，该应用程序——即应用——就可以运行在几乎任何数量的设备上。这大大减少了开发和调试应用程序所需的时间和代码，同时确保用户可以使用标准且易于理解的界面控制、配置和管理系统硬件。\n\
  \n一旦安装了操作系统，它将依赖于大型设备驱动库，使操作系统服务到达特定的硬件位置。因此，整个应用程序可以在终端设备上进行正常调用，但操作系统接收该调用并使用相应的驱动程序将调用转换为该特定计算机基础硬件所需的的操作（命令）。今天，应用程序提供了一个全面的平台，用于识别、组织和管理一系列计算机硬件，包括内存设备；处理器和内存管理；芯片组；存储；通信；端口通信（如高定义多媒体接口\
  \ `HDMI`、视频图形阵列 `VGA` 和通用串行总线 `USB`）以及子系统区域，如外组件互连 Express（`PCIe`）。\n\n### 操作系统功能\n\
  \n操作系统提供三种关键能力：提供带有 `CLI` 或 `GUI` 的 UI；呈现并管理应用程序；以及为这些应用程序识别并显示硬件资源——通常通过默认的 `API`。\n\
  \n### 用户界面 (UI)\n\n每个操作系统都需要一个 UI，使用户和管理员能够与操作系统交互，以便他们能够设置、配置和排除下方操作系统及其硬件的故障。主要有两种类型的\
  \ UI 可：`CLI` 和 `GUI`。\n\n`CLI` 模式窗口（或终端模式）提供基于文本的显示，用户只需依靠传统键盘输入与特定功能相关的特定命令、参数和问题。图形用户界面（或桌面）提供了一个基于图标和符号的视觉界面，用户依靠通过人机交互设备（如触摸板、触摸屏和鼠标设备）获得的操作，例如双击文件图标在默认应用程序中打开文件。\n\
  \n`GUI` 被不熟悉或极渴望创建应用程序和文件的终端用户广泛使用，例如双击文件图标以打开文件。`CLI` 在高级用户和系统管理员中仍然流行，他们必须处理一系列语法和重复的命令，例如为员工设置新计算机（`PCs`）的创建和记录。\n\
  \n### 应用程序管理\n\n应用程序管理整个应用程序的启动和管理。这通常支持多种行为，包括处理多个进程或线程，以便在现有处理器上运行期间共享不同的任务；管理软件级干扰以获得处理器的立即关注，确保有足够的内存来处理系统及其相应数据而不中断其他进程；进行可以友好删除系统进程的错误管理；以及在不影响其他应用程序或操作系统的情况下进行内存管理。\n\
  \n操作系统可以支持 `APIs`，允许应用程序使用操作系统和硬件功能，而无需了解任何关于底层操作系统或硬件状态的信息。例如，`Windows API` 可能允许应用程序从键盘或鼠标接收输入；创建\
  \ GUI 对象（如窗口对话框和按钮）；在存储设备上读写文件等。应用程序始终设计为在程序意图运行的环境中使用应用程序。\n\n此外，操作系统还可以为应用程序执行以下服务：\n\
  \n- 在多任务应用程序中（多个程序可能同时运行），操作系统决定哪些程序应该按顺序运行，以及在给另一个程序机会之前，允许每个应用程序运行多久。\n- 处理与连接的硬件设备（如硬盘、打印机和拨号端口）的输入和输出（`I/O`）。\n\
  - 向每个应用程序或合作伙伴——或系统管理员发送有关操作系统和可能发生的任何错误的消息。\n- 它可以委托批量操作（例如打印）的管理责任，这样实现过程就可以不受功能限制。\n\
  - 在可以提供相同处理能力的计算机上，工作系统可以管理如何划分系统以便同时运行在多个一个处理器上。\n\n### 设备管理\n\n操作系统负责识别、配置并允许应用程序正常访问计算机硬件设备。当操作系统检测并识别硬件时，操作系统将安装该设备的兼容驱动程序，使操作系统和运行在操作系统上的应用程序能够在无需任何特定硬件或设备知识的情况下操作设备。\n\
  \n\n\n操作系统负责识别正确的打印机并安装相应的打印机驱动程序，以便系统只需向打印机调用，而无需使用特定于该打印机的代码或指令——这就是应用程序的功能。其他设备也是如此，例如\
  \ USB 端口；社交网络网站；图形设备（如图形处理器 `GPUs`）；）；主板上的芯片组；以及存储设备（如串行附加 SCSI 接口总线 `SAS` 磁盘适配器和已用适当的文件系统格式化过的磁盘）。\n\
  \n操作系统会识别并准备有效且易于理解的服务设备，并通常以标准格式将它们记录，例如 `Windows Registry`（Windows 注册表）。设备制造商偶尔会对驱动程序进行配对和更新，操作系统必须更新它们以确保最大的安全性和设备性能；当设备被更换时，操作系统会重新安装并准备新的驱动程序。\n\
  \n## 操作系统类型及示例\n\n虽然应用程序的基本作用无处不在，但有许多应用程序可以适用于各种硬件和用户需求。\n\n### 标准操作系统\n\n通用型操作系统代表了大量的应用程序，旨在用于各种硬件上运行广泛的程序，使用户能够同时使用一个或多个应用程序或功能。通用型操作系统可以安装在多个台式机和笔记本电脑型号上，并运行从会计系统到数据库、从网络浏览器到游戏的各种应用程序。操作系统通常关注进程（电缆）和硬件管理，以确保应用程序可以与系列现有计算机可靠地共享。\n\
  \n典型的桌面应用程序包括以下：\n\n- `Windows` 是微软的一种操作系统，是家庭和商务电脑的标准配置。这种基于 GUI 的操作系统于 1985 年发布，之后已发布了多个型号。易于使用的\
  \ `Windows 95` 为个人电脑的快速发展做出了贡献。\n\n- `Mac OS` 是适用于 Apple Macintosh 电脑和台式机的操作系统。\n\
  \n- `UNIX` 是一种为了灵活性而设计的通用应用程序。`UNIX` 开发于 20 世纪 70 年代初，是第一个用 `C` 语言编写的应用程序之一。\n\n\
  - `Linux` 是 `Unix` 操作系统的克隆，旨在为 PC 用户提供免费或低成本的替代方案。`Linux` 以高效、快速的操作系统闻名。\n\n###\
  \ 移动操作系统\n\n`Mobile OS` 旨在适应移动计算设备和通信设备（如智能手机和平板电脑）的不同需求。与传统 PC 相比，移动设备通常提供的计算资源有限，因此操作系统必须在尺寸和复杂度上进行压缩，以减少资源消耗，同时确保在该设备上运行至少一个或多个应用程序拥有足够的资源。移动操作系统往往强调效率、用户响应，并更关注数据管理功能，例如支持媒体流传输。现在，`Apple\
  \ iOS` 和 `Google Android` 是移动应用程序的示例。\n\n### 嵌入式操作系统\n\n并非所有的计算机设备都是标准的。数十种专用设备——包括家用数字助手、自动报告机（`ATMs`）、飞机系统、销售终端（`POS`）和物联网（`IoT`）设备——都需要应用程序的计算机。主要的区别在于，兼容的计算设备只执行一件大事，因此操作系统非常精简，并且专注于性能和耐用性。操作系统必须快速、整洁，并友善地处理所有错误，以便在所有条件下继续工作。在大多数情况下，操作系统被交付到安装在基础设备上的芯片。例如，如果医疗设备用于患者的生命支持系统，则将使用嵌入式操作系统，该系统必须可靠运行以维持患者生命。联系此示例，`Embedded\
  \ Linux` 是嵌入式操作系统的一个例子。\n\n### 网络操作系统\n\n网络操作系统（`NOS`）是另一种特殊的操作系统，旨在促进运行在局域网（`LAN`）上的设备之间的通信。`NOS`\
  \ 提供了理解网络协议所需的通信栈，以便形成、交换和分解网络数据包。今天，特殊的 `NOS` 概念已不再适用，因为某些类型的操作系统对网络连接性更加敏感。例如，`Windows\
  \ 10` 和 `Windows Server 2019` 包含了完整的通信能力。`NOS` 的概念仍用于其他通信设备，如路由器、交换机和灭火器，制造商可以使用相关的\
  \ NOS，包括 `Cisco Internetwork Operating System (IOS)`、`RouterOS` 和 `ZyNOS`。\n\n###\
  \ 实时操作系统\n\n当计算机设备必须在连续和循环的时间限制内与现实世界交互时，设备制造商可能会选择使用实时应用程序（`RTOS`）。例如，工业控制系统可以调节工厂或发电站的操作。此类中心会产生来自多个传感器的信号，并发送信号以控制阀门、执行器、电机和无数其他设备。在这种情况下，工业控制系统在现实情况发生变化时必须快速且预测性做出响应；否则可能会发生灾难。`RTOS`\
  \ 应在没有计费、没有处理延迟和其他延迟的情况下工作，这对于某些类型的应用程序来说是完全可以的。`RTOS` 的示例包括 `FreeRTOS` 和 `VxWorks`。\n\
  \n应用程序类型之间的区别并不完全，某些操作系统可能共享其他系统的功能。例如，出于共同目的的程序通常包含在传统 `NOS` 中找到的网络能力。同样，嵌入式应用程序通常包含\
  \ `RTOS` 特性，而移动应用程序仍然可以像其他标准操作系统一样同时运行多个应用程序。\n\n## 1.2 IBM 硬件上的系统\n\n`IBM PureApplication\
  \ System` 是一种基于云的计算机程序，集成了硬件和软件，用于在云中部署和执行任务——换句话说，企业数据中心添加到私有云环境中所需的一切。\n\n本书的这一章节专门涉及\
  \ `IBM PureApplication System v1.1` 软件，描述了第二代硬件系统的变化。它配有一之前发表的文章，这些文章共同解释了硬件和软件\
  \ `PureApplication System` 的基础。这些主题包括：\n\n### 硬件\n\n`IBM PureApplication System`\
  \ 硬件访问描述了安装在 `PureApplication System` 内部的硬件。本文扩展了第二代硬件的细节。它没有定义系统中的所有硬件，而是关注与第一代相比。\n\
  \n### 修改后的硬件\n\n`IBM PureApplication System` 基础设施即服务（IaaS）的良好实践解释了 `PureApplication\
  \ System` 如何利用其硬件。\n\n### 云系统的本质\n\n`IBM PureApplication System` 时间管理区域解释了你如何利用\
  \ `PureApplication System` 设计良好的硬件来设计具有大量工作负载的云环境。\n\n\n\n\n- 所有第二代计算机节点（企业级和微型）都包含比第一代更快的处理器和/或更快的内存。\n\
  - 第二代计算方法可以被添加到第一代程序中。\n\n## 1.3 主机操作系统\n\n### Microsoft Windows\n\n`Microsoft Windows`\
  \ 也称为 `Windows` 和 `Windows OS`，是由微软公司开发的计算机操作系统（OS），用于运行你的个人电脑（PC）。`Windows OS`\
  \ 结合了 IBM 兼容 PC 的第一个图形用户界面（GUI），迅速主导了 PC 市场。大约 90% 的 PC 使用着某种形式的 `Windows`。\n\n\
  `Windows` 的第一个版本发布于 20 世纪 80 年代中期，它仅仅是微软现有磁盘系统（即 `MS-DOS`）的一种扩展提供的 GUI。基于苹果公司在其\
  \ Macintosh 系统软件中使用的许可概念部分，`Windows` 最初允许 DOS 用户以视觉化方式导航可见的桌面，通过点击鼠标按钮打开带有电子文件夹和文件图形显示的“窗口”，而不是通过快速文本来输入指令和方向。\n\
  \n随后的版本引入了重大的性能提升，包括 `Windows` 文件管理器、`Program Manager`（程序管理器）和 `Printer Manager`（打印机管理器程序），以及强大的视觉界面。微软还开发了特殊的\
  \ `Windows` 软件包，包括联网的 `Windows` 工作组（Workgroups）和用于企业的强大的 `Windows NT`。1995 年发布的消费者版本\
  \ `Windows 95` 与 `Windows` 和 `DOS` 完全集成，并提供了内置 Internet 支持，包括万维网浏览器 `Internet Explorer`。\n\
  \n2001 年 `XP` 发布时，微软将其各种 `Windows` 软件包整合在一个旗帜下，为消费者、企业、多媒体开发者等人提供多种应用程序。`Windows\
  \ XP` 让 `Windows 95` 内核（主要软件代码）留供长期使用，而用于更强大的代码并提供更用户友好的界面，改进了内存控制和管理。最成功的 `XP`\
  \ 标准是在 2006 年底通过 `Windows Vista` 实现的，但它的发布存在问题并在市场上遭遇了强烈反对，迅速留下了庞大、缓慢、资源密集型系统的声誉。针对\
  \ `Vista` 令人失望的发现率，微软于 2009 年发布了 `Windows 7`，这是一个具有类似于 `Vista` 的虚拟界面的操作系统，但因其显著的速度提升和适中的编程要求而受到了热烈欢迎。\n\
  \n2012 年的 `Windows 8` 提供了第一个应用看起来像网格的屏幕，以及同步设置的能力，使用户登录另一台 `Windows 8` 设备并使用他们的喜好设置。2015\
  \ 年，微软发布了 `Windows 10`，它带有 `Cortana`（一种类似于苹果 `Siri` 的数字个人助理）以及取代了 `Internet Explorer`\
  \ 的 `Microsoft Edge` 网页浏览器。微软还宣布 `Windows 10` 将是 `Windows` 的最后一个版本，这意味着用户将收到操作系统的定期更新，但不会再进行进一步更新。\n\
  \n### Mac OS\n\n`Mac OS` 是由美国计算机公司苹果（Apple Inc.）开发的操作系统（OS）。该系统于 1984 年推出，用于该公司的\
  \ Macintosh 系列电脑（PC）。`Macintosh` 宣告了图形用户界面（GUI）程序的时代，并启发了微软公司构建自己的 GUI——即 `Windows\
  \ OS`。\n\n苹果对 `Macintosh` 发布的营销非常侧重于应用程序的精确性能。与当时的所有其他 PC 不同，`Mac OS`（以前称为 `Software\
  \ Development`，带有安装版本号）显然是基于的。用户不需要在文本命令中输入指令和方向，而是移动鼠标指针在 `Finder`（访达）中进行视觉化导航——一系列由缩略图表示的文件夹和视觉文件。大多数计算机应用程序最终都采用了\
  \ GUI 模型。20 世纪世纪 80 年代，苹果达成了一项协议，允许微软在早期的 `Windows` 版本中使用某些 Mac 界面特征。然而，除 20 世纪\
  \ 90 年代的一段时间外，`Mac OS` 从未授权给苹果以外的制造商制造的计算机使用。\n\n随后发布的 `Mac OS` 引入了互联网文件共享、网络浏览和多用户账户等功能。1996\
  \ 年，苹果收购了 `NEXT` 公司的竞争对手（该公司由史蒂夫·乔斯离开苹果后创立），2001 年公司发布了 `Mac OS X`，这是一个基于 `NextStep`\
  \ 程序和苹果最新操作系统发布的重大重新设计。`OS X` 运行在 `UNIX` 内核（软件核心代码）上，提供了技术进步，如内存保护和多任务处理，以及易于使用的\
  \ `Finder`、一个名为 `Aqua` 的迷人界面和一个用于启动常用应用程序的简单“Dock”启动栏。`OS X` 升级增加了诸如自动备份和用于小型可用应用程序（小部件）的“Dashboard”管理器。\n\
  \n自 2007 年以来，苹果引入了许多可以访问互联网的移动设备，包括 `iPhone` 智能手机和 `iPad` 平板电脑。苹果很快强调了 `OS X` 连接这些设备的能力。2011\
  \ 年，苹果引入了 `iCloud`，这是一种云计算服务，允许用户在所有苹果设备上共享信息，包括 `OS X` 和 `iOS` 移动应用）。苹果在后续版本的 `OS\
  \ X`、`iOS` 以及随后的 `watchOS`（Apple Watch 智能手表操作系统）中增加了其他允许设备间连接的功能。这些功能包括检测通话（在 `iPhone`\
  \ 上拨打）的能力以及在设备之间快速共享信息（如照片和文本）的方法。\n\n### UNIX OS\n\n20 世纪 60 年代后期，年轻的 AT&T 贝尔实验室工程师肯尼斯（Ken）汤普森参与了一个\
  \ `Multics` 程序项目。`Multics`（多路复用信息和计算机服务）是 1960 年由麻理工、贝尔实验室和通用电气开发的 `GE-645` 主机测试系统。它引入了许多新事物，但存在许多问题，在\
  \ 20 世纪 60 年代后期，贝尔实验室对进展和困难感到沮丧，退出了该项目。在丹尼斯·里奇、道格拉斯·麦克罗伊和乔·奥萨纳等朋友的帮助下，汤普森决定尝试 `Multics`\
  \ 的一些想法并在更小的规模上重新发明它们。因此，1969 年，产生了 `Unix` 现在无处不在的想法。\n\n当肯·汤普森仍然能够访问 `Multics`\
  \ 环境时，他在上面编写了一个新的文件模拟和一个配对程序。该小组后来在黑板上继续了他的工作并做了笔记。1969 年，汤普森产生了一个非常有趣的游戏 `Space\
  \ Travel`（太空旅行），它首先写在 `Multics` 上，然后翻译成 `Fortran` 的 `GECOS`，最后在贝尔实验室广泛使用的 `PDP-7`\
  \ 上运行。这台 `PDP-7` 随后将其用于首次 `UNIX` 的发布。在这一台 `PDP-7` 上并使用其会议语言，由汤普森和里奇组成的调查小组（最初没有贝尔实验室的资金援助）开发了序列文件系统、计算机和设备概念、命令行翻译器以及其他小型应用程序。\n\
  \n`Unics` 这个名字是 20 世纪 70 年代中期由团队成员布莱恩·柯尼汉命名的，模仿了 `Multics`。`Unics`（简单信息和计算系统）最终可以支持多个用户同时使用，并变成了\
  \ `Unix`。\n\n从结构上看，`PDP-7` 的 `Unix` 文件系统与现在的非常相似；例如，它拥有：\n\n1. `List of i`：描述每个节点的特定列表。节点包含的内容比现在少，但关键细节相同：文件保护模式、其类型和大小，以及包含内容的物理块列表。\n\
  2. `Brochures`：一种特殊文件类型，包含一组单词和一个相关的数字 `i`。\n3. 特殊文件：描述设备。设备规格没有直接包含在节点中，而是编码在代码中：某些\
  \ `I` 数字对应某些文件或文件夹。\n\n\n\n\n\n20 世纪 90 年代后期，Thompson 和 Ritchie 希望在一台比 `PDP-7` 大得多的机器上运行\
  \ `Unix`，他们通过向来自贝尔实验室的另一项资金援助中承诺增加 `Unix` 文本处理能力，并对 `PDP-11/20` 机器代码进行了编码。因此，在 1970\
  \ 年第一次，活跃的 `Unix` 系统正式发布并实现在 `PDP-11/20` 上。随后还增加了一个名为 `roff` 的文本开发程序和一个文本编辑器。这三者都是用\
  \ `PDP-11/20` 会编语言编写的。贝尔实验室将这个由 `Unix`、`Roff` 和编辑器开发的第一个“文本处理”程序用于专利申请的文本处理中。`Roff`\
  \ 很快演变成了 `troff`，这是第一个具有完整编辑能力的电子出版系统。\n\n1972 年，`Unix` 用 C 编程语言进行了重写，这与当时的普遍观念形成对比，当时人们认为“没有任何复杂的应用需要处理关键周期性事件，只能用汇编语言编写”（尽管\
  \ `Unix` 不是第一个用高级语言编写的操作系统，自 1961 年起 `Burroughs B5000` 就是此类系统）。`C` 语言是由 Ritchie\
  \ 作为 `B` 语言的改进版本开发的，而 `B` 语言是 Thompson 对 Martin Richards 的 `BCPL` 的翻译。汇编语言向高级 `C`\
  \ 语言的迁移实现了可移植软件，当 `Unix` 安装在其他计算机平台时，只需替换少量的基于机器的代码。\n\nAT&T 通过许可的方式将 `Unix` 提供给大学、商业公司以及美国政府。许可包含所有源代码，包括存储器中基于机器的部分，这些部分是用\
  \ `PDP-11` 汇编代码编写的。指定的 `Unix` 内核源码副本在 20 世纪 70 年代后期以纸质形式广泛传播，这导致了 `Unix` 作为教育模型被广泛使用。在曾一度，`ARPA`（高级研究计划署）采用\
  \ `Unix` 成为 `Arpanet`（互联网的前身）社区的官方语言。\n\n20 世纪 70 年代后期和 80 年代初，`Unix` 对学术界的影响导致了\
  \ `Unix` 被许多商业倡议计划广泛接受（特别是来自加州大学伯克利分校的 `BSD` 版本），例如 `Solaris`、`HP-UX` 和 `AIX`。今天，除了上述提到的\
  \ `Unix` 认证程序外，经常遇到如 `Linux` 和 `BSD` 系列（`FreeBSD`、`NetBSD` 和 `OpenBSD`）等由 `Unix`\
  \ 驱动的程序。\n\n### Linux OS\n\n由于庞大的发行基础，`Unix` 是世界上最活跃的程序之一。它最初是 20 世纪 70 年代中期为微型计算机和主机开发的多用途系统。从那以后，它已成为范围内最广泛的应用之一，尽管视觉界面有时令人困惑且缺乏中间暂停功能。\n\
  \n`Unix` 流行的真正原因是什么？许多黑客认为 `Unix` 是“三要素”——唯一的真操作系统。因此，`Linux` 的开发是由不断增长的 `Unix`\
  \ 黑客群体实现的，他们想要亲手操作自己的系统。\n\n`Unix` 版本存在于许多程序中，从个人电脑到像 `Cray Y-MP` 这样的大型计算机。你们的许多\
  \ `Unix` 版本非常昂贵且复杂。当时，`ATM T's System V 386` 单机版本的价格约为 1500 美元。\n\n`Linux` 是一个广泛发行的\
  \ `Unix` 版本，最初由 `Linus Torvalds` 开发，他在 1990 年初作为芬兰赫尔辛基大学的一的学生开始研究 `Linux`。Linus\
  \ 现在在加利福尼亚州圣克拉拉运营 `Transmeta Corporation`（Transmeta 公司），并维护 `Linux` 内核，这是该应用程序中最底层的组件。\n\
  \n`Linus` 在互联网上免费发布了第一个版本的 `Linux`，无意中引入了人类史上最大的软件升级之一。今天，`Linux` 由一个成千上万名在互联网上自由工作的开发者团队（如果不是所有人）编写和维护。公司开始提供\
  \ `Linux` 支持，将其封装成易于安装的发行版，并销售预装了的工作站和 `Linux` 软件。1999 年 3 月，首届 `Linux World Expo`\
  \ 世界展在加利福尼亚州圣何塞举行，据报道人数超过 12,000 人。大多数估计认为全球 `Linux` 用户约为 1000 万（预计当你读到这里时会觉得这个数字很小）。\n\
  \n受到 `Andrew Tanenbaum's Minix`（另一个用于 PC 的免费 `Unix`，尽管非常简单）的鼓励，`Linux` 起于一个课程项目，Linus\
  \ 想构建一个可以在基于 `386` 的 PC 上运行的简单 `Unix` 程序。关于 Linux 的首次对话发生在 Usenet 的 `comp.os.minix`\
  \ 新闻组。这些讨论对于想要更多功能的 `Minix` 用户的 `Unix` 微课程开发非常重要。\n\n`Linux` 的早期开发主要集中在 `80386`\
  \ 保护接口的切换特性，全部用汇编代码编写。Linus 写道：\n\n```\nAfter that, it was a clear ship: installing\
  \ fur codes still, but I had some devices, and fixing the error was easy. I started\
  \ using C, and C++ at this stage, and it really accelerates progress. That was the\
  \ time when I aimed to get started to get serious about my megalomaniac ideas for\
  \ making \"Minix better than Minix.\" I was hoping to be able to re-collect GCC\
  \ under Linux one day.\n```\n\n两个月的基础设置，但过了很久，我才有了磁盘驱动程序（它有 Bug，但恰好在我的机器上运行）和一个小型文件系统。那时，我在\
  \ [1991 年 8 月下旬] 发布了 `0.01` 版本：它很丑，没有软盘驱动程序，你做不了什么事情。我不认为有人编译过那个版本。但到那时，我失去了希望，在能够摆脱\
  \ `Minix` 之前我不想放弃。\n\n关于 `Linux Version 0.01` 尚未公告。`0.01` 源码甚至不可用：它们只包含空的内核元素，并假设你可以访问\
  \ `Minix` 机器来整合它们。\n\n1991 年 10 月 5 日，Linus 宣布了第一个“官方”版本的 `Linux`，即 `0.02` 版本。期间，Linus\
  \ 能够使用 `bash`（GNU Bourne Shell）和 `GCC`（GNU C 编译器），但其他大部分都无法工作。此外，这被设计为一个黑客程序。主要重点是内核开发；从未讨论过用户支持、文档等问题。今天，情况大不相同——`Linux`\
  \ 世界真正的兴奋点是处理用户镜像、易于分发的软件包以及图形和生产设施等高级应用。\n\n在 `0.03` 版本之后，Linus 将版本号提升到 `0.10`，因为更多人开始研究该系统。经过多次修订，Linus\
  \ 将版本号增加到 `0.95`，表明他预计系统很快就能准备好正式发布（通常软件在完全完成或没有 Bug 之前不会被赋予 1.0 版本）。这是 1992 年 3\
  \ 月的事。大约 1.5 年后，即 1993 年 12 月底，`Linux` 内核处于 `0.99.pl14` 版本——接近 `1.0`。`1.0` 版本出现在\
  \ 1994 年 3 月。在本文写作（1999 年）时，内核当前版本为 `2.2.6`，`2.3` 版本正在同步进行。\n\n如果没有自由软件基金开发的 `GNU`\
  \ 工具，`Linux` 将是不可能的。他们的 `GCC` 编译器将在接下来的章节中讨论它是如何赋予 Linus Torvalds 代码以生命的。`GNU` 工具从\
  \ `Linux` 构建开始就与其密不可分。由于这些工具的关键贡献，自由软件基金甚至要求将 `Linux` 及相关资源的发行命名为 `Linux / GNU`。\n\
  \n\n\n\n\n`BSD` 也证明了它对 `Linux` 的开发非常重要。许多随 `Linux` 发行版提供的应用程序都是从 `BSD` 安装的。网络守护进程和资源非常重要。`Linux`\
  \ 内核通信代码已经从底层开始进行了升级（实际上进行了两三次），但守护进程和资源仍然是 `BSD`。\n\n今天，`Linux` 无异于一个完整的 `Unix`\
  \ 克隆，能够使用 `X Window System`、`TCP / IP`、`Emacs`、`Web`、`email` 和新闻软件等等，不胜枚举。几乎所有的主要的软件包已推送到\
  \ `Linux`，商业软件现在也已可用。事实上，大多数开发者首先为 `Linux` 编写应用程序，之后将它们发送给其他 `Unix` 程序。它支持的硬件比原始内核版本更多。许多人对\
  \ `Linux` 系统进行了基准测试，发现它们比 `Sun Microsystems` 和 `Compa` 的操作系统运行更快，而在大多数基准测试中，`Linux`\
  \ 的表现优于 `Windows 98` 和 `Windows NT`。\n\n# 第 2 章：Linux\n\n人们说 `Linux` 是世界上使用最广泛的开源操作系统。`Linux`\
  \ 适用于所有主要的硬件平台，包括 `x86`、`ARM` 和 `IBM` 主机以及更小的平台。在 `Unix` 设计原则方面，`Linux` 在互联网服务器和每一个消费级电子控制的电子处理产品中运行得最好。`Linux\
  \ 操作系统` 以其稳定性而闻名，因为其类 `Unix` 结构使得系统与操作系统保持分离。参见 `Unix`。\n\n除了 `Apple` 和 `Microsoft`\
  \ 产品外，`Linux` 是所有智能手机和平板电脑的操作系统（Apple 的 `iPhone / iPad iOS` 基于 `Unix`）。与个人电脑操作系统相比，`Linux`\
  \ 的市场份额小于 `Windows` 和 `Mac`，但得益于 `Google Chrome OS` 的稳定，正在增长。\n\n## 数千个发行版\n\n`GNU\
  \ 通用公共许可证` (`GPL`) 为 `Linux` 提供了许可，`Linux` 是一个卓越的“开源”产品。许多团队为了各种目的转换 `Linux`，实际上有数百个版本，被称为“发行版”或“distros”。许多发行版是免费的，并且都使用\
  \ `Linux` 内核（`Linux` 的根）。现在，如 `Red Hat` 和 `Suse` 等商业组织通过溢价出售 `Linux` 以提供技术支持。`Linux`\
  \ 也兼容 `IEEE`（参见 `POSIX`）。参见 `Linux` 的发行版、开源和 `GNU 通用公共许可证`。\n\n## 桌面与服务器\n\n许多桌面\
  \ `Linux` 发行版带有各种免费且实用的程序，还有更多可供下载。`Linux` 的文字处理、电子表格、绘画和绘图应用程序、媒体播放器和视频编辑器都是全功能程序，通常与\
  \ `Windows` 和 `Mac` 合作伙伴竞争。相比之下，`Linux` 服务器类型通常以无头模式（无鼠标、无键盘）运行，包含用户生产力应用之外的管理和通信工具。参见包管理器。\n\
  \n## 非单用户链接\n\n`Linux` 使用 `X Window` 渲染系统来创建基础窗口，但 `Linux` 桌面模型依赖第三方用户界面来显示用户使用的边界、按钮、菜单、图标和桌面。`GNOME`\
  \ 和 `X Window` 是最著名的两个，都可以包含在发行版中。\n\n## 从 Unix 到 Minix 再到 Linux\n\n1990 年，芬兰计算机科学学生\
  \ `Linus Torvalds` 创建了 `Linux`。他们受到了类似于 `Unix` 的课堂教学工具 `Minix` 的启发。尽管 `Torvalds`\
  \ 创建了内核，但许多支持库、资源和来自于 `GNU Project`，这就是为什么 `Linux` 经常被称为 `GNU / Linux`。多年来，大量程序做出了贡献。`Torvalds`\
  \ 维护内核，而 `Linux` 是一个注册商标。\n\n## Linux 真的“Lee-Nooks”\n\n常见的读音是 \"Lynn-icks\"。然而，因为在芬兰语中\
  \ `Linus` 被读作 \"lee noose\"，`Torvalds` 将其读作 \"lee nooks\"。它也可以被称为 \"line-icks\"\
  ，因为许多人把 `Linus` 称为 \"line-iss\"。\n\n## 2.1 什么是 Linux？\n\n在我们开始下载 `Linux` 之前，对于那些不知道的人来说，了解它是什么很重要。如果你认为那些不认识我的人，他们可能是\
  \ `Windows` 或 `Mac` 用户，因为它们非常流行。这并不意味着你不使用 `Linux`，它实际上仍然存在并存在于你每天使用的技术之中。\n\n`Linux`\
  \ 是一个操作系统。就像 `Windows` 或 `OS` 一样，在你的软件和硬件之间建立连接。它是自由。`Linux` 是一个开放许可程序，这意味着它是完全智能的，你可以分发你自己的修改版本来帮助他人——尽用你最大的力量，我的朋友。\n\
