  \n# 第 3 章：Linux 与主流操作系统及 Linux 版本的比较\n\n## 3.1 Linux 操作系统 vs Windows 操作系统\n\n###\
  \ Linux vs Windows\n\n### 用户\nLinux 上有三种用户（普通用户、管理员 (root) 和服务用户），而 Windows 有四种类型的用户账户（管理员、标准用户、儿童和访客）。\n\
  \n### 使用\n根据市场研究数据，全球 92.63% 的 PC 运行着 Windows，而至少有 1% 的 PC 用户在使用 Linux。许多用户说，与 Windows\
  \ 相比，Linux 很难使用，因此 Linux 的抱怨限于家庭使用。它旨在作为服务器程序进行深度使用。因此，无论是否有 GUI，组织服务器都运行在 Linux\
  \ 上。\n\n此外，得益于微软的许可协议，各种 PC 厂商都有权将 Windows 操作系统集成到他们的 PC 中，使 Windows 在市场普及率上超过 Linux。尽管如今戴尔和惠普等许多\
  \ PC 厂商已开始提供 Linux 作为预装操作系统，但 Windows 仍然主导市场。\n\n### 内核\nLinux 使用单内核，空间利用更高效，而 Windows\
  \ 使用微内核，占用的空间较小，但系统效率低于 Linux。\n\n### 文件程序\n在微软 Windows 中，文件存储在不同数据驱动器（如 `C:`、`D:`、`E:`）的目录/文件夹中；但在\
  \ Linux 上，从根目录开始的树形结构中的单级文件没有其他的子记录。\n\n在 Linux 操作系统中，一切都被视为文件。引用是文件、目录以及外部连接设备（如打印机、鼠标、键盘），它们也是文件。\n\
  \n### 安全\n每个 Windows 用户不时都会遇到安全和稳定性问题。由于 Microsoft Windows 是最常用的操作系统，黑客和垃圾邮件经常针对\
  \ Windows。Windows（消费型）最初设计用于在没有网络连接的单用户 PC 上轻松使用，且没有内置的安全功能。微软经常通过 Windows 更新服务移除漏洞。该服务通常每月发布一次，或者在需要时发布。\n\
  \n大多数时候，Windows 用户会遇到蓝屏（BLUE SCREEN OF DEATH）。这是由于系统无响应导致的。最后，用户必须手动重启电脑。\n\n相比之下，Linux\
  \ 基于多用户构建，这使其比 Windows 这样的单用户操作系统更稳定。由于 Linux 由全球开发者进行标准监控，任何新提出的问题可以在几小时内解决，并提供所需的资源池。\n\
  \n\n\n\n相反，Windows 在过去几年中接受了大量的广告。用户无疑被赋予退出的机会，但同样，智能注册表黑客行为显然是雷德蒙计划的一部分。Windows\
  \ 可以监控用户活动，提供与 Microsoft OneDrive 服务的同步，或学习如何改进 Cortana（微软的个人助手）。老实说，我不喜欢这些工具，因为它们太具有破坏性。或者，某些用户喜欢这些功能。这是一种谦逊的。\n\
  \n# 源代码\n\nLinux 是一个活跃的操作系统，而 Windows OS 在商业上是可行的。Linux 可以访问源代码并根据用户的请求修改代码，而 Windows\
  \ 无法访问源代码。\n\n在 Linux 中，用户能够访问内核源代码并根据自己的需要更改代码。它有自己的优势。操作系统中的漏洞将尽快修复，但如果存在漏洞，开发者可能会对操作系统应用任何缺陷。\n\
  \n在 Windows 中，只有被选定的成员才允许访问源代码。\n\n# 许可证\n\n大多数情况下，Linux 内核（以及 GNU 资源和相关库）是免费且完全开源的。公司为他们的分发版提供付费支持，但生成的软件仍然可以下载和安装。\n\
  \n## 3.2 Linux 操作系统 vs Mac OS\n\n虽然 Linux 和 Mac 都是计算机硬件应用，但 Linux 是一个可以在任何设备上使用的开放操作系统，而\
  \ Mac 是一个只能在 Mac 设备上使用的操作系统。Linux 作为应用程序、运行其他应用程序的平台以及服务器单元发挥作用。同时，Mac 是一个允许其他操作系统在其上运行的操作系统。\n\
  \n### Mac OS X vs. Linux：硬件支持\n\nLinux 和 Mac OS 两个系统在这一领域都很出色。由于 Mac OS 仅在苹果制造的硬件上使用，因此它提供了强大且集成良好的软件组合，以为您提供最高性能。\n\
  \n至于 Linux，它有各种驱动支持软件。或者在此之前这是 Linux 无法提供的问题；不，相反，我应该说；硬件制造商没有为其硬件在 Linux 系统提供驱动支持。但现在情况变了。Linux\
  \ 是桌面或服务器设备上最广泛使用的操作系统。现在，所有主要的零售商在获得像 Mac OS 或 Windows OS 等其他应用程序后，都会为 Linux 发行版提供兼容的硬件驱动。\n\
  \n### Linux vs. Mac：目标用户群体\n\n如果你付得起钱并想要一个开箱即用的系统，那么我倾向于让你选择 Mac OS。这个应用将为你提供一个性能良好的漂亮酷炫的桌面环境。Mac\
  \ OS 是初学者以及想要进行高质量音频编辑、视频录制和图形设计的高级用户的极佳选择。\n\nLinux 拥有两个目标用户群体。如果你是 Linux 世界的新手，请选择\
  \ Ubuntu、Linux Mint 或 Elementary OS，但如果你在寻找高质量或定制化的工作环境，请选择 Arch Linux 或 Kali。此外，还有一个\
  \ `Terminal` 或命令行界面，它是进行任何技术专家水平工作的绝佳工具。\n\n## 3.3 Linux 操作系统 vs. FreeBSD 操作系统\n\
  \nFreeBSD 和 Linux 都是独立于其许可证的开源源码，并具有与 Unix 相同的环境。FreeBSD 在多年前在经过许多修改和更新后出现在 Unix\
  \ 操作系统中。否则，Linux 是从零开始开发的，作为 Unix 的替代品。Linux 和 FreeBSD 都拆分了文件管理类别。此外，它们都使用相同类型的\
  \ Shell 站点作为主要的通信手段。除此之外，它们共享相似的 API 程序。由于各种相似性，Linux 和 FreeBSD 可以相互共享多个工具和应用程序。\n\
  \n### 许可证的差异\n\n- Linux 和 FreeBSD 之间的许可证差异是它们之间的主要区别之一。\n- 所有 Linux 发行版、Linux 内核、Linux\
  \ 程序、基于 GNU 的应用都根据 `GNU General Public` 或 `GNU GPL` 许可证授权。\n- `GNU GPL` 也称为“左拷贝”（copy-left）。\n\
  \n事实上，`BSD` 许可证几乎与 `GNU GPL` 相同，但根据 `BSD` 许可证的作品不需要维护许可证的条款。\n\n- 任何人都可以轻松访问、共享或修改他们的源代码，而无需重写或修改修订后的源代码。\n\
  - 必须包含原始的 `BSD` 许可证和版权证书，更新后的源代码是唯一的要求。\n- 每个许可证的成本完全取决于用户的需求和他们的哲学。\n- `GNU GPL`\
  \ 许可证促进了开放自由的环境和共享。\n- 相关软件应小心依赖基于 GNU 的软件。\n\n另一方面，经 `BSD` 许可的软件可以轻松自由地安装在闭源软件上。\n\
  \n- 这使得 BSD 软件对企业和开发者更有吸引力，他们希望通过直接销售存储其资源的软件来盈利。\n\n### 基本区别\n\n- 程序的历史和谱系是 Linux\
  \ 和 FreeBSD 之间的另一个主要区别。\n- Linus Torvalds 开发了 Linux 内核以取代 MINIX，后者在赫尔辛基大学被禁止进一步研究。\n\
  - 随后，它将先进的 Linux 内核与来自 GNU 的多个组件集成，创建了一个类似于 Unix 的完整系统。\n- Linux 是完全从零升级的，没有使用来自现有\
  \ Unix 系统的任何东西。\n- Linux 在许多方面与 Unix 不同。\n\n另一方面，FreeBSD 与 Unix 应用有密切的关系。\n- Berkeley\
  \ Software Distributions 或 `BSD` 是在加州大学伯尔克利分校开发的。\n- BSD 后来用完整的 `BSD` 许可证重写了所有原始许可证，该操作系统后来完全集成到所有其他开源渠道中。\n\
  \n## 3.4 Linux 的版本\n\n### Gentoo\n\nGentoo 是一个高度灵活的元发行版，允许用户使用字符认证和软件编辑。Gentoo 可以被定制。该项目由\
  \ Daniel Robbins 在 2000 年启动。尽管它提供了灵活性，但使用它需要技术。换句话说，这对于没有经验的用户来说不好，因为需要很多时间来适应。编译可能耗时。\n\
  \n### Arch Linux\n\nArch Linux 由 Judd Vinet 于 2002 年发布。最初，它被认为是一个存在于中、高级用户之间的独立项目。后来，它通过一种被称为“滚动发布”（rolling-release）的设备得以提升。滚动发布意味着该应用具有保持更新的能力。Arch\
  \ Linux 拥有优秀的软件管理基础设施。安装后可以从源代码安装软件。另一个误解是由于偶尔的不稳定性会导致恶化风险。\n\n### Ubuntu\n\nUbuntu\
  \ 为桌面用户改变了 Linux 的个性。它长期以来非常闻名。它于 2000 年初发布，目前在 Linux 用户中仍然很流行。Ubuntu 基于 `DEB` 包。它有\
  \ Canonical 的长期支持，并现在通过其自己的服务器类型支持业务。Ubuntu 的一些特殊功能包括实时 DVD，支持新使得，让新手可以轻松地使用 Ubuntu\
  \ 和不同的桌面环境。Ubuntu 面临的最重要问题之一是不兼容性。\n\n### MX Linux\n\nMX Linux 作为 MEPIS Linux 站点引入的。这适用于个人和商业目的。MX\
  \ Linux 最受欢迎的特点是它的图形化控制工具，被称为 `MX-Tools`。它还具有不同的平台支持、不同的图形驱动兼容性以及易于管理。与 Mint 和 Ubuntu\
  \ 相比，MX Linux 可能对新手没有那么友好。适应它的安装程序需要时间，某些工具看起来可能不同。\n\n### Mint\n\n\n\n\nLinux Mint\
  \ 于 2006 年发布，基于 Ubuntu 开发。该发行版最适合初学者。Mint 拥有多种增强功能，使其易于使用，并与其他应用程序交互。因此，它不仅适用于个人使用，也适用于商业用途。开发者提供三种类型的发布版本，即正式版（12\
  \ 月）、点版本（根据需要，例如修复性错误）和每月总结版。这使得 Mint 更加稳定。\n\n## 回到 Kali\n\n还有其他专门为系统安全和访问设计的 Linux\
  \ 程序。Kali Linux 是目前最流行的登录测试平台。这一切始于从 WHAX 集成创建的 BackTrack（WHAX 是一种基于 Linux 的 Slax\
  \ 发行版，其后的公司是 Offensive Security。WHAX 的之前的版本基于 Knoppix，称为 `Whoppix`）。`BackTrack 5`\
  \ 基于 `Ubuntu Lucid LTS`，支持带有 ARM 的 32 位和 64 位格式。\n\n2013 年，该公司基于 Debian 重建了该平台，并以\
  \ `Kali` 的命名发布。\n\n`Kali Linux` 非常稳定，功能强大，并拥有一套先进的高级入门测试工具。\n\n# 第 4 章：开启 Linux\
  \ 之门学习 Linux 有许多理由。`Linux` 是一个基于 UNIX 的操作系统。\n\n作为一名专业人士，你一定会从 `Linux` 中受益。让我们下面列出学习\
  \ Linux 的理由。\n\n### 学习很有趣\n\n阅读 `Linux` 非常有趣。如果你学到了新知识，你不会感到惊讶。如果你充满好奇心且性格有趣，你将会喜欢它提供的一切！\n\
  \n### 节省钱包省钱\n\n`Linux` 是一个使用开源的高效系统。这意味着你不需要为它支付任何费用，不像 Windows 或任何其他付费应用。\n\n\
  ### 一切只需下载 Linux 并开始\n\n你只需要一台可以运行 `Linux` 的机器。它甚至可以在旧电脑上运行。由于不需要操作系统本身的费用，你无需为应用程序付费。`Linux`\
  \ 生态系统非常棒，你可以获取实现你想做的任何事情的程序！如果你正在使用 `Linux`，你可能不需要购买任何软件。\n\n开发者热爱 `Linux`。通过 `Linux`，他们找到了一个尝试新事物的游乐场。\n\
  \n### 支持所有主流编辑语言\n\n在软件开发和部署方面，许多公司将 `Linux` 作为主操作系统。这意味着作为学生，你需要通过专业工作来学习 `Linux`。\n\
  \n### 提高职场成功率\n\n由于 `Linux` 被认为是理想的开发操作系统，它增加了你提升工作效率的机会。在软件开发公司中，`Linux` 具备所需能力是常有的。如果你精通\
  \ `Linux`，你作为工程师一定会获得更多机会。\n\n### 教会他人\n\n即使在 2019 年，我们仍然非常需要能够为学生知识增值的项目。这就是你获得分享知识的机会。在教育生态系统中，你可以探索接触中级\
  \ `Linux` 学生的可性。我们的创作者计划允许你同时进行分享和学习。\n\n## 4.1 获取访问\n\n以下是进入 `Linux` 的前十种方法。\n\n\
  ### 加入免费 Shell\n\n有很多使用 `Linux` 的人拥有的 `Linux` 服务器多到他们不知道该怎么做（记住，“Linux 服务器”可以是从最新的电脑到使用了\
  \ 12 年的废弃笔记本电脑的任何设备）。为了充分利用大多数计算机，许多管理员开放他们的安全箱以获取免费的 Shell 账号。\n\n如果你愿意花时间在 `Linux`\
  \ 终端阅读指令、使用 Shell、`C++` 和 Web 开发基础进行编写，那么免费的 Shell 账号是一个简单、廉价的入门方式。这里有一个尝试的列表：\n\
  \n* `Freehell.de`\n\n`Freeshell.de` 是一个自 2002 年以来一直在线的 `Linux` 公共访问方法。你可以访问 `SSH`（尝试\
  \ Linux shell）、`IPv6` 和 `OpenSSL`，并请求 `MySQL` 数据库。\n\n* `Blinkenshell`\n\n`Blinkenshell`\
  \ 提供一个 `Linux` shell 用于阅读 Unix、使用 `IRC`、托管简单网站和共享文件。它自 2006 年以来一直在线。\n\n### SDF\
  \ 社区访问\n\n现在如你所知，Unix 系统建立于 1987 年底，提供免费的 `NetBSD` 账号。当然，`NetBSD` 不是 `Linux`，但它是开源\
  \ Unix，所以提供了相同的感受。它在家里也有很多应用，因此模糊了老派 BBS 和免费旧 Shell 之间的界限。\n\n免费 Shell 账号经常受到骚扰，所以你表现出的忠诚度和参与小组活动的意愿越高，了解得越多。你通常可以在数据库搜索引擎、编译器和高级编程语言中获得访问（通过特殊请求或小额捐赠表示兴趣）。你也可以请求安装额外的软件或库，须经管理员批准。\n\
  \n### 如何使用\n\n公共访问 Shell 账号是尝试真实 `Linux` 系统的完美方式。没有 `root` 权限意味着你已经学会了管理自己的软件，而不需要修剪草坪或修理漏水龙头。你只需要做足够现实的工作来让它们完成实际工作，尽管它们并不诚实到去批评这项工作。\n\
  \n### 通过 WSL 2 在 Windows 上尝试 Linux\n\n信不由信，微软从 2019 年 6 月开始开始在 Windows 上分发 `Linux`，这意味着你可以从\
  \ Windows 使用 `Linux` 程序，作为 Windows Linux 子系统 (`WSL 2`) 的第二个副本。虽然这主要针对开发者，但 Windows\
  \ 用户可以在标准桌面控制台中无意识地通过额外资源将 `WSL 2` 进入 Linux 。这是你 Windows 机器的 Linux 操作系统。同时，它仍然是一个新阶段且正在进行工作中，因此可能会发生变化。如果你尝试推得太远，可能会遇到一个\
  \ Bug，但如果你只是想开始学习 `Linux`、读一些指令并感觉想在文本环境中完成敏感工作，`WSL 2` 可能正是你需要的。\n\n### 如何使用\n\n\
  `WSL` 没有明确的路径或目的，但为你的 Windows 机器提供了 Linux 环境。你获得了 `root` 权限，并可以使用 `Linux` 发行版和应用程序，因此是一种简单无缝的学习方式。然而，尽管\
  \ `WSL` 是 `Linux`，但它并不是 Linux 的标准。`Linux` 是 Windows 提供的，你不可能在现实世界中体验它。`WSL` 是一个开发和教育工具，但如果可用，你应该使用它。\n\
  \n### 在可启动 U 盘上下载 Linux\n\n在 U U 盘上安装 `Linux`，无论你走到哪里，都可以从该 盘启动你遇到的任何电脑。你获得了一个自定义的\
  \ `Linux` 桌面，不需要担心下载它的主机电脑上的细节。电脑不会影响你的 `Linux` 操作系统，你的 `Linux` 操作系统也不会影响电脑。适用于酒店商务中心、图书馆、学校的公共计算机，或者只是为了给自己找个理由偶尔开始学习\
  \ `Linux`。\n\n与许多进入 Linux shell 的快速快捷方法不同，这种方法为你提供了一个完整且健壮的 `Linux` 系统，配备桌面、对任何所需软件的访问以及持久性数据存储。\n\
  \n系统不会改变。你想要存储的任何数据都会在压缩文件系统中加密，并在启动时作为系统的备份。这种灵活性允许你选择如何以持久模式启动（将所有数据保存回 U 盘），或以瞬态模式启动（这样一旦精疲力竭，你所做的一切都会消失）。\n\
  \n\n\n有很多不同的 Linux 发行版可以尝试，有些为低功耗电脑提供轻量级桌面，有些则拥有完整的桌面。我更倾向于 `Porteus Linux`。在过去的八年里，我每天都把它放在钥匙扣上，出差时作为我的主电脑平台，当工作或家里电脑出现问题时作为磁盘使用。它是一个可靠且稳定的应用程序，既有趣又易用。\n\
  \n在 Mac 或 Windows 上，下载 `Fedora Media Writer` 工具可以为任何可下载的移动发行版创建可启动优 盘。\n\n### 如何使用\n\
  从第六个 USB 驱动器重启“Linux live”模式即可完成 Linux 发行版的运行。现在，虽然数据存储方式与你安装在硬盘上的系统略有不同，但其他一切符合你对\
  \ Linux 桌面的预期。在你的便携式 Linux 系统上可以做的事情不多，所以请在你的钥匙扣里安装一个，以解锁你所遇到的每台电脑的全部威力。\n\n## 在线之旅\n\
  `Ubuntu` 的某人想出了一个棒的主意，可以在浏览器中托管 `Ubuntu GNOME` 桌面。要尝试一下，打开网络浏览器并导航到 `tour.ubuntu.com`。你可以自己选择想要展示的活动，也可以跳过单个课程并点击“个人”按钮。\n\
  \n即使你是 Linux 桌面的新手，你可能发现自己的自我表达比你预想的要常见。通过互联网，你可以四处看看，看看有哪些可用程序，看看典型的 Linux 桌面是什么样子的。你无法调整设置或启动另一次\
  \ `Firefox` 旅程，虽然你可以体验安装应用程序的步骤，但你无法引入它们。但如果你从未用过 Linux 桌面，并想看看这到底在忙什么，这将是一段奇妙的旅程。\n\
  \n### 如何使用\n在线之旅仅仅是一次旅程。如果你从未见过运行中的 Linux 桌面，这是一个直观感受体验的机会。它并非为敏感工作设计，而是一个吸引路路的精美展示。\n\
  \n## 使用 JavaScript 在浏览器中启动 Linux\n不久前，虚拟化被用于计算机调优，仅限于拥有高端硬件的用户。现在，由于人们做出的努力，已经达到了可以通过\
  \ JavaScript EMD 实现的程度，这要归功 `Fabrice Bellard`，他是优秀的开源 `QEMU` 模拟机的制作者。\n\n之后，Bellard\
  \ 启动了 `JSLinux` 项目，允许你在空闲时间在浏览器中使用 Linux 和其他应用程序。它仍然是一个试用版，但它是技术的奇迹。在 `JSLinux`\
  \ 页面打开网络浏览器，你就可以启动一个基于文本的 Linux shell 或一个小型的 Linux 环境。你可以向你的 `JSLinux` 主机上传和下载文件，或者（理论上）将你的文件发送到网络备份，因为\
  \ `JSLinux` 通过 `VPN` 套接字访问互联网（速度取决于 `VPN` 服务）。\n\n### 如何使用\n你短期内不会在 `JSLinux` 上进行任何严肃工作，而且该环境无疑是非寻常的，你可以学习更多关于\
  \ Linux 如何正常工作的知识。然而，如果你厌了在旧 PC 上使用 Linux，并想在一个真正不同的平台上尝试 Linux，`JSLinux` 是独一二二的。\n\
  \n## 了解它\n并不是所有的 Linux 体验都发生在电脑上。也许你是那种喜欢远离、观察并在尝试任何新事物之前先做研究的人，也许你可能还不确定“Linux”到底是什么，又或许你喜欢完全沉浸其中。关于\
  \ Linux 如何工作、使用 Linux 是什么体验以及 Linux 世界正在发生什么，有大量信息需要学习。\n\n当你熟悉了开源世界时，会更容易理解常识并区分城市传说与真实体验。我们会不定期发布书单，但我最喜欢的书籍之一是\
  \ `Hazel Russman` 的 `Charm of Linux`。这是一本由独立作者为了发现 Linux 的乐趣而编写的从许多不同角度出发的 Linux\
  \ 之旅。\n\n### 如何使用\n没有什么能比边读一本好书。这是一种获取 Linux 的小传统方法，但对于喜欢纸质书的人来说，它是既舒适又有效的。\n\n\
  ## 获取树莓派\n如果你尝试使用 `Raspberry Pi`，你就是在使用 Linux。从 Linux 和低功耗电脑开始非常简单。`Pi` 的优点（如果没有它，成本远低于\
  \ 100 美元）在于它的官方网站是面向教育的。你可以学习所有关于 `Pi` 的功能，当你在那里时，一切都是关于 Linux 能为你做什么。\n\n### 如何使用\n\
  `Pi` 在设计上是一台低功耗电脑。这意味着你不能像以前那样做大量工作，但这是一个让你免于担忧的简单方法。`Raspberry Pi` 是学习 Linux 及其所有可能的奇妙方式，也是体验环保、小型化、简化电脑威力的绝佳方式。务必密切关注\
  \ `Opensource.com` —— 特别是每年三月的 `Pi 周` —— 以获取技巧、技巧和有趣的活动。\n\n## 进入容器船\n如果你在神话般的云时代之后工作，那么你一定听过容器的狂热。虽然你可以在\
  \ Windows、Azure、Mac 和 Linux 上使用 `Docker` 和 `Kubernetes`，但你可能不知道容器本身就是 Linux。云计算和基础设施应用是部分运行、部分配备的最小\
  \ Linux 操作系统。当你启动容器时，你就引入了一个小型 Linux 发行版。\n\n容器与虚拟机或便携式服务器不同。它们旨在用作通用系统。然而，当你进入容器后，你可能想停下来观察一下。你会发现关于\
  \ Linux 系统是如何构建的、重要文件存储在哪里以及哪些是最常用命令的线索。你也可以在线尝试该工具，并在我关于 Linux 容器组的文章中了解关于它们是如何工作的。\n\
  \n### 如何使用\n容器在设计上专注于一项任务，但它们是 Linux，所以它们非常灵活。你可以按照预期使用它们，也可以创建一个容器变成一个完整的系统用于你的\
  \ Linux 测试。这不是 Linux 桌面体验，但它是一个功能完整的 Linux 体验。\n\n## 作为虚拟机安装 Linux\n虚拟化是尝试运行程序的简易方法，而\
  \ `VirtualBox` 是一种很好的开源虚拟化方式。`VirtualBox` 适用于 Windows 和 Mac，因此你可以将 Linux 安装为虚拟机\
  \ (VM) 并几乎像使用任何其他程序一样使用它。如果你不习惯安装应用程序，`VirtualBox` 也是一种非常安全的尝试 Linux 的方式，无需默认在你的标准操作系统上安装。\n\
  \n### 如何使用\n作为虚拟机启动 Linux 简单易快捷；它可以作为当你需要 Linux 环境时的试用或其他重启方法。它功能齐全，并且因为它使用虚拟硬件，宿主机驱动驱动高效。将\
  \ Linux 作为操作系统的唯一缺点基本上是心理上的。如果你尝试将 Linux 作为主操作系统，但最终除了 Linux 最指定的功能外都自动变成了宿主机操作系统，那么\
  \ VM 就让你失望了。除外，VM 是现代技术的胜利，在 `VirtualBox` 中使用 Linux 让你拥有 Linux 提供的所有最佳功能。\n\n安装\
  \ Linux\n\n\n\n如果你有疑问，总有传统的方法。如果你想尝试 Linux，应该给予它应有的关注：你可以下载 Linux，将安装程序刻录到 U 盘（如果你喜欢光介质，则是\
  \ DVD），并将其安装在你的计算机上。Linux 是开源的，因此任何愿意花时间整合 Linux——以及所有使用它的碎片和组件——的人都可以进行分发，这在通常情况下被称为“发行版”（简称\
  \ \"distro\"）中实现。问问任何 Linux 用户，关于哪种发行版最好，你会得到不同的答案（尤其是当“最好”一词通常没有具体定义时）。大多数人认同你应该使用一个适合自己的\
  \ Linux 发行版，这意味着你应该尝试一些流行的发行版，并留在让你的计算机运行符合你预期的版本上。这是一种简单有效的方法。例如，如果发行版无法检测到你的摄像头而你想让摄像头运行，那么就使用能检测你摄像头的发行版。\n\
  \n如果你从未尝试安装过任何应用程序，你会发现许多 Linux 发行版，许多友好且简单的安装程序。只需下载发行版（以 ISO 文件形式提供），并下载 Fedora\
  \ Media Writer 来创建一个可启动 U 盘。\n\n### 如何使用\n\n安装 Linux 并将其作为主操作系统是熟悉和上手这个家族的一步。你可能会发现一些你从未想过需要的东西，你可能学到的计算机知识比你想象的要，你可能会改变你的世界观。你可以使用\
  \ Linux 桌面是因为它下载和安装方便，或者因为你想在某个公司高管面前表现一下，又因为它帮助你完成工作。\n\n## 4.2 获取 Linux 连接性\n\n\
  远程桌面是一种软件或应用程序功能，允许你的计算机桌面环境在单个系统中远程运行（通常是 PC，但该概念在服务器上无缝运行），同时显示在独立的客户端设备上。如果你想从不同的角度来看，远程桌面用于访问另一台计算机上的工作环境。例如，ManageIQ\
  \ / Integration 测试库 (PR) 测试程序暴露了虚拟网络计算 (VNC) 连接端口，以便我可以实时检测我的 PR 测试。远程桌面用于帮助客户解决计算机问题：在客户许可的情况下，你可以设置\
  \ VNC 连接或远程桌面协议 (RDP) 来识别或访问共享计算机以解决或修复问题。\n\n这些连接是通过远程桌面连接软件完成的，有很多可用选择。我使用 Remmina\
  \ 是因为我喜欢它易用的界面（UI）。它是用 GTK + 编写的，并在 GNU GPL 许可证下开源。\n\n### 在 Linux 上安装 Remmina\n\
  \n如果你需要在用于远程访问其他计算机的电脑上安装 Remmina。如果你正在使用 Fedora，可以使用上述命令安装你所需的 Remmina：\n\n```\n\
  sudo dnf install -x remmina\n```\n\n现在，如果你正在考虑在不同的 Linux 平台上安装 Remmina，请遵循这些安装说明。之后，你应该就能获得\
  \ Remmina 和你的其他应用程序（在此图中选中了 Remmina）。\n\n点击其图标启动 Remmina。你会看到弹出一个屏幕。\n\nRemmina\
  \ 提供了许多类型的连接，包括用于 Windows 计算机的 RDP 和用于连接到 Linux 机器的 VNC。Remmina 的默认设置为 RDP。\n\n\
  ### 与 Windows 10 连接\n\n如果你想连接到 Windows 平台，需要记住这些点。在通过 RDP 连接到任何 Windows 10 计算机之前，你必须更改某些权限以允许桌面共享远程连接到你的防火墙。\n\
  \n- 要启动远程桌面共享，在资源管理器中，右键点击 `此电脑` >>> `属性` >>> `远程设置`，在弹出的窗口中勾选 `允许此计算机上的远程连接`，并选择应用。\n\
  - 接下来，使用防火墙启用远程桌面通信。现在在开始菜单中搜索防火墙设置，并选择 `允许应用通过 Windows 防火墙`。\n- 在打开的窗口中，在“已允许的应用和功能”下查看\
  \ `远程桌面`。根据你访问此桌面的网络类型，勾选私有和/或公共列中的框框。点击确定。\n- 回到用于远程访问 Windows PC 的 Linux 计算机并启动\
  \ Remmina。输入你 Windows 计算机的 IP 地址并按回车键。现在！输入你的用户名和密码并点击确定。\n- 系统将要求你接受并允许证书，选择确定。\n\
  - 你应该能看到自己的 Windows 10 桌面计算机。\n\n### 连接到红帽企业 Linux 7\n\n要设置权限以允许远程访问你的 RHEL7 计算机，请打开\
  \ Linux 桌面上的“所有设置”。\n\n点击共享图标，这将打开另一个窗口。\n\n当“屏幕共享”关闭时，点击它。会打开一个窗口，你可以在其中滑动到“开启区域”。如果你想允许远程连接控制桌面，请设置“启用远程控制”工作。你还可以在两种访问选项之间选择：一种允许主用户接受或拒绝连接请求，另一种允许通过密码连接。在窗口末尾，选择允许连接的网络接口，并关闭窗口。\n\
  \n接下来，从 `应用程序菜单 → 杂项 → 防火墙` 打开防火墙设置。\n\n勾选 `vnc-server` 旁框（如所示）并关闭窗口。之后，回到远程计算机上的\
  \ Remmina，输入要连接的 Linux 桌面的 IP 地址，选择 VNC 作为协议，并按回车。\n\n如果你之前选择过身份验证选项，“新联系”应该会请求访问。\n\
  \n选择“接受”以使远程连接成功。\n\n如果你选择了密码验证选项，Remmina 将用密码通知你。\n\n输入你的凭据并点击确定，你就必须连接到远程计算机了。\n\
  \n### 使用 Remmina\n\nRemmina 提供了一个带有标签页的 UI，如上图所示，类似于网络浏览器。在左上角，你可以看到两个标签页：一个之前建立的\
  \ Windows 10 连接和一个新的 RHEL 连接。\n\n左侧有一个工具栏，带有如调整窗口大小、全屏模式、偏好、截图、断开等选项。你自己尝试一下，看看哪些对你最有效。\n\
  \n你还可以通过点击左上角的 `+ + (合并)` 图标创建 Remmina 的保存连接。用连接详细信息填写该表单并点击保存。\n\n下次你打开 Remmina\
  \ 时，该链接可用。\n\n## 4.3 Linux 界面布局\n\n### Linux 索引系列：基于软件组件\n\n目前，所有与操作系统的会话都是私有的。在\
  \ Linux 中，“四部分软件”理论反映在它的引用结构中，该结构根据《文件系统层次结构标准》(FHS) 进行分类和编写。FHS 是一是一件好事，因为整个行业都在运行它，并且始终关注所有的发行版。FHS\
  \ 解释了 Apache、Samba、Mozilla、KDE 和基于软件的隐私指示应该放在哪里，在考虑你的软件时，你没有理由不使用它，但我还会给你更多：\n\n\
  - FHS 是一个标准，我们没有标准无法生存。\n- 这是最基本的操作系统组织方式，涉及访问和安全标准，用户直观地访问每种文件类型等。\n- 让用户的生活更轻松\n\
  \n这最后一个理由已经证明了发现 FHS 的意义，所以所有方法都使用 FHS !!!\n\n关于 FHS 重要性以及共享相同文本结构的更多信息，可以在红帽网站上找到。\n\
  \n### FHS 总结\n\n所以让我们总结一下 FHS 对 Linux 引用说明了什么：\n\nLinux 系统指示\n\n```\n/usr/drum\n\
  ```\n\n\n\n\n\n所有用户都可以访问的有用对象列表（每个人的 `$PATH` 中都包含此指南）。你的软件大文件可能位于此处。你不应在此文件夹下创建任何目录。\n\
  \n* `/bin`\n\n类似于 `/usr/bin`，但在这里你只会找到高效、简单且精简的进程。你的（高级）软件可能没有需要安装在此处的内容。\n\n* `/usr/sbin`\n\
  \n类似于 `/usr/bin`，但仅包含必须由管理员（root 用户）完成的程序。普通用户不应在他们的 `$PATH` 中包含此指南。\n\n* `/sbin`\n\
  \n类似于 `/usr/sbin`，但仅包含最重要的启动成功所需的进程，系统管理员会在另一个备份系统中找到这些进程。诸如 `fsck`（测试文件系统）、`init`（所有进程之父）、`fconfig`（网络配置）、`mount`\
  \ 等命令可以在这里找到。它是系统最重要的指标。\n\n* `/usr/lib`\n\n包含支持 `/usr/bin` 和 `/usr/sbin` 操作的强大库和静态文件。你可以创建一个如\
  \ `/usr/lib/myproduct` 的子目录来包含你的帮助文件，或仅通过你的软件可用且无需用户干预的强大库。下面的指南可以作为插件和扩展的工具。\n\n\
  * `/lib`\n\n类似于 `/usr/lib`，但它包含了启动过程所需的强大库和静态文件。你永远不会 `/bin` 或 `/sbin` 中发现需要此目录之外库的使用。内核模块（设备驱动程序）位于\
  \ `/lib`。\n\n* `/etc`\n\n包含配置文件。如果你的软件有很多文件，请将它们包含在如 `/etc/myproduct/` 等子目录下。\n\n\
  * `/var`\n\n名称源于 \"variable\"变量），因为此索引下的所有内容都会频繁变化，且软件包系统（`RPM`）不保留控制。`/var` 的频率设置在差异高性能分区之上。在\
  \ `/var/log` 中，日志文件不断增长。在网络内容中，我们使用 `/var/www` 等。\n\n* `/home`\n\n包含来自家目录（真实人类）的用户引用。你的软件包不应在此处包含文件（在安装期间）。如果你的业务逻辑需要创建一个特殊的\
  \ UNIX 用户（而非人类），你应该在 `/var` 下或 `/home` 之外的地方提供一个家目录。请永远不要忘记。\n\n* `/usr/share/doc`,\
  \ `/usr/share/man`\n\n使用 \"share\" 一词是因为子目录 `/usr/share` 是一个独立的平台，可以在网络文件系统的多个设备之间共享。因此，这是手册、文本、示例等的地方。\n\
  \n* `/usr/local`, `/opt`\n\n这些是无效的文件夹。当 UNIX 没有软件包程序（如 `RPM`）时，系统管理员需要将软件（或 `local`）选项解析到主操作系统。这些是曾为此使用的指标。\n\
  \n你可能认为将你的软件（总共）拆分成许多部分而不是将其全部保留在一个独立的目录中是一个坏主意。但软件包程序（`RPM`）拥有一个可以妥善管理一切的数据库，负责配置文件、引用等。如果你使用\
  \ FHS 流化你的软件，除了用户友好外，它还将带来配置系统管理员的最佳方式，并且在效率和安全性方面运行得更好。\n\n### FHS 使用示例\n\n现在我们已经知道了软件的每个部分应该安装在何处，让我们回顾一下\
  \ FHS 中使用的通用部分表。表格。相同的软件，使用：\n\n| | [软件自身的程序](https://tldp.org/HOWTO/HighQuality-Apps-HOWTO/software.html#software.body)\
  \ | [配置](https://tldp.org/HOWTO/HighQuality-Apps-HOWTO/software.html#software.soul)\
  \ | [内容](https://tldp.org/HOWTO/HighQuality-Apps-HOWTO/software.html#software.content)\
  \ | [日志、转储等](https://tldp.org/HOWTO/HighQuality-Apps-HOWTO/software.html#software.logs)\
  \ |\n| :--- | :--- | :--- | :--- | :--- |\n| 数据库服务器 | `/usr/bin/`, `/usr/lib/`,\
  \ `/usr/share/doc/mydb/`, `/usr/share/doc/mydb/examples/` | `/etc/mydb/` | `/var/db/instance1/`,\
  \ `/var/db/instance2/`, 等 | `/var/db/instance1/transactions/`, `/var/log/db-access-instance1.log`,\
  \ `/var/log/db-access-instance2.log` |\n| 编辑器 | `/usr/bin/`, `/usr/lib/`, `/usr/lib/myeditor/plugins/`,\
  \ `/usr/share/myeditor/templates/`, `/usr/share/doc/myeditor/` | `$HOME/.myeditor.conf`\
  \ | `$HOME/Docs/` | `$HOME/.myeditor-tmp/` |\n| MP3 生成器 | `/usr/bin/`, `/usr/lib/`,\
  \ `/usr/lib/mymp3/`, `/usr/share/doc/mymp3/` | `$HOME/.myeditor.conf` | `$HOME/Docs/`\
  \ | |\n| Web 服务器 | `/usr/sbin/`, `/usr/bin/`, `/usr/lib/`, `/usr/share/doc/httpd/`,\
  \ `/usr/share/doc/httpd/examples/` | `/etc/httpd/`, `/etc/httpd/instance1` | `/var/www/`,\
  \ `/var/www/instance1` | `/var/log/httpd/`, `/var/log/httpd/instance2` |\n| 邮件服务器\
  \ | `/usr/sbin/`, `/usr/bin/`, `/usr/lib/`, `/usr/share/doc/mail/` | `/etc/mail/`,\
  \ `/etc/mail/server.cf` | `/var/mail/`, `/var/spool/mail/` | `/var/log/mail/mail.log`\
  \ |\n\n\n\n\n\n## 4.4 基础 Linux 命令\n\n在我看来，你可能对 Windows 和 Mac OS X 等许多操作系统非常熟悉。Linux\
  \ 是当今使用的最强大的操作系统之一。根据超级计算机 TOP500 购买者的最新数据，“Linux 如今占了全球前 500 超级计算机的 100%”。这难道不让你感到吃惊吗？\n\
  \n操作系统是计算机以及所有现代计算设备的灵魂和大脑。它是一个处理与你的桌面电脑或笔记本电脑相关的所有硬件资源的软件。换句话说，操作系统控制着你的软件与硬件之间的连接。\n\
  \nLinux 是如此无处不在，以至于出现在手机、汽车、电冰箱和 Roku 设备上。它运行着大部分互联网和大多数计算机。事实上，多个国家的全球股票交易所运行在\
  \ Linux 上。由于 Linux 是可用最可靠、安全且强大的应用程序之一，它已成为全球部署桌面、服务器和嵌入式应用的平台。\n\n### 基础 Linux\
  \ 指令\n\n现在，让我们来看 Linux 上最重要的 20 个命令。Linux 命令对大小写非常敏感，因此你需要输入的内容需要小心。\n\n* `ls` –\n\
  \n如果你熟悉 Windows，你就会知道 `dir` 用于过滤索引内容。某些类型可能支持颜色编码。蓝色的字代表引用的名称。\n\n`ls -l | more`\
  \ - 这有助于分离结果，以便你逐页查看。否则，列表会滚动得非常快。你可以随时使用 `ctrl c` 返回命令行。\n\n```\n$ ls -l file name\n\
  ```\n\n* `cd /var/log` –\n\n更改当前目录。Linux 上使用高级斜杠（正斜杠）。例如一个带有各种 Linux 的 Linux 指南。\n\
  \n如果你使用 `ls -l`，你将看到索引中内容的许多细节。它将记录文件信息：\n- 文件关联权限\n- 文件所有者\n- 与文件相关的组\n- 文件大小\n\
  - 时间戳\n- 文件名\n\n```bash\n$ cd /var/log\n```\n\n* `grep` –\n\n在文件中查找文本。`grep` 命令同时搜索多个文件，以找到你需要的文本片段。\n\
  \n`grep PATTERN [FILE]`\n\n`grep failed.log`\n\n上面的命令将找到文件中所有与单词“failed”相似的单词。\n\
  \n```bash\n$ grep 'failed' transaction.log\n```\n\n* `Su / order of Sudo` –\n\n\
  Linux 系统中有些命令需要更高的操作权限。因此，你可以使用系统管理员身份来执行普通用户无法执行的操作。\n\n* `Sudo`\n\n如果你只需要以超级用户身份使用某些功能，可以使用\
  \ `sudo` 命令。这将允许你将命令应用到建议的权限，一旦命令执行，你将返回到正常的权限和许可。\n\n示例 - `shutdown` 命令可以安全地关闭计算机系统。\n\
  \n`sudo shutdown -2` - 2 分钟后关机并启动计算机\n`sudo shutdown -r 2` - 2 分钟后关机并重启\n\n使用 `ctrl\
  \ C` 或 `shutdown -c` 有助于停止关机过程。\n\n```bash\n$ sudo closure 2\n$ sudo -r 2 closure\n\
  ```\n\n* `pwd` - 打印工作目录\n\n另一种识别 `pwd` 命令工作方向的方法。它展示了一种在方向切换频繁的情况下，有效且实用的指南方法。\n\
  \n```bash\n$pwd\n```\n\n* `passwd` –\n\n尽管它看起来像 `pwd` 命令，但它扮演的角色是不同的。此命令用于更改用户账户密码。你可以更改自己的密码或其他用户的密码。注意，标准系统用户只能更改自己的密码，而\
  \ `root` 可以更改任何账户的密码。\n\n`passwd [username]` - 更改用户密码。\n\n```bash\n$ passwd admin\n\
  ```\n\n* `mv` - 移动文件\n\n移动文件或重命名文件将使用 `mv` 命令。在这里，文件名从 `first.txt` 变为 `second.txt`。输入\
  \ `ls` 查看更改。\n\n```\n$ mv first.txt second.txt\n```\n\n* `cp` - 复制文件\n\n`cp source\
  \ file`。如果你需要在同一目录下获得一个 `second.txt` 文件的副本，应该使用 `cp` 命令。\n\n```bash\n$ cp second.txt\
  \ third.txt\n```\n\n你可以使用 `ls -l` 看到新文件的创建。两个文件的大小将相同。\n\n* `rm` –\n\n此命令用于删除目录中的文件或目录本身。如果目录为空，则无法删除。\n\
  \n`rm [file name]`\n\n`rm -r` 移除索引中的所有内容以及索引本身。\n\n```bash\n$ rm file1\n$ rm -r\
  \ myproject\n```\n\n* `mkdir` - 创建目录\n\n`mkdir [identifier]` 如果你想创建一个名为 'myproject'\
  \ 类型的目录，可以使用此命令。\n\n```bash\n$ mkdir myproject\n```\n\n* `chmod` –\n\n更改文件系统的对象模式。文件可以具有\
  \ `r` 权限（读）、`w`（写）和 `x`（执行）。例如：\n\n`chmod mode FILE`\n`chmod 744 script.sh`\n\n\
  第一个数字代表与文件相关的用户。第二个数字属于文件相关的组。第三个数字与所有不属于该用户或组的人相关。\n\n```bash\n$ chmod 744 script.sh\n\
  ```\n\n* `chown` –\n\n此命令用于更改文件/文件夹或多个文件/文件夹的身份给特定用户/组。\n\n`chown owner_name file_name`\n\
  \n```bash\n$ chown user1 script.sh\n```\n\n假设你是名为 `user1` 的用户，你想在 root `sudo` 语法前更改所有权。\n\
  \n```bash\n$ sudo chown root script.sh\n```\n\n* `cat` –\n\n`cat` 命令（“concatenate”的缩写）是\
  \ Linux 中最广泛使用的命令之一。`cat` 命令允许你创建一个或多个文件、查看文件内容、合并文件并将输出重定向到终端或文件。\n\n```bash\n\
  $ cat file.txt\n$ cat file1.txt file2.txt\n```\n\n## 4.5 创建和删除目录\n\nLinux 文件系统是一个高层树结构，有一个带有\
  \ `/` 的高层目录，或根目录。所有其他指南都是居住在该根目录下的子目录。大多数 Linux 发行版的目录结构遵循文件系统层次结构标准（FHS），该标准由于\
  \ 1994 年开发，用以防止不同发行版之间不同目录结构之间的混淆。\n\n在 Microsoft Windows 中，我们有名为 `C:`、`D:` 等磁盘，并且它们上方没有目录。在\
  \ Linux 上，尽管我们有不同的驱动器，但仍然有一个根目录。额外的磁盘（或更常见的：设备）可以插入或挂接到某些子目录中。例如，我们可以添加一个磁盘，对其进行正确格式化并将其插入我们创建的任何目录，例如\
  \ `/newdisk`。它仍然根目录之下。\n\n我们不应将根目录与 `/root` 目录混淆，后者是用户的家目录。\n\n在今天的《阅读 Linux》文章中，我们将教你如何使用\
  \ Linux 终端的命令行创建、删除和管理引用。适用于所有 Linux 发行版。Linux 也有 GUI 方法，即使用来自桌面桌面的右键菜单。本指南旨在以线性方式完成操作。\n\
  \n### 创建目录\n\n导航当前目录的最简单方法是使用 `mkdir` 命令：\n\n```bash\n[roots @ fosslinux ~] #mkdir\
  \ remains\n```\n\n你刚刚在当前目录下创建了一个名为 `foss` 的文件夹。\n\n我们也可以使用完整路径指定目录，例如，在 `/tmp` 目录创建\
  \ `foss1` 目录，我们将使用：\n\n```bash\n[roots @ fosslinux ~] #mkdir /tmp/foss1\n```\n\n\
  如果我们需要使用同一个命令创建多个索引，可以这样做，下一个命令将在当前索引同时创建 `foss2` 和 `foss3` 索引。\n\n```bash\n[roots\
  \ @ fosslinux ~] #mkdir foss2 foss3\n```\n\n还有一个小技巧，叫做括号扩展，它可以帮助你按照模式构建更多引用。以下命令将创建\
  \ `foss4`、`foss5`、`fossa` 和 `fossb`。\n\n```bash\n[roots @ fosslinux ~] #mkdir residues\
  \ {4,5, a, b}\n```\n\n你甚至可以指定括号的内径，如下命令所示，创建 `foss6` 到 `foss10` 。\n\n```bash\n[root\
  \ @ fosslinux ~] #mkdir residues {6..10}\n```\n\n该范围也适用于字母，因此此同样适用于：\n\n```bash\n\
  [roots @ fosslinux ~] #mkdir residues {d..f}\n```\n\n\n\n\n\n我告诉过你，创建索引时可以使用完整方法，但如果链接不存在怎么办？例如，我们想在一个不存在的文件夹内创建一个名为\
  \ `missing` 的文件夹。\n\n```bash\n>>> [root @ fosslinux ~] # mkdir is missing / foss11\n\
  mkdir: cannot create directory `lost / foss11 ': None of those files or directory\n\
  ```\n\n它会正确地报告错误。幸幸的是，`mkdir` 有一个选项可以创建那个丢失的目录，并使用 `-p` 作为父目录。让我们重试：\n\n```bash\n\
  >>> [root @ fosslinux ~] # mkdir -p does not exist / foss11\n>>> [root @ fosslinux\
  \ ~] # ls missing / foss11\n```\n\n它创建的不仅仅是一个，而是许多在需要时会缺失的引用。这就是你在 Linux 上创建目录时所需要知道的全部内容。\n\
  \n### 删除目录\n\n我们创建了很多垃圾，需要移除一些我们创建的残留目录。\n\n使用我们用于删除字段的标准 `rm` 命令将带给我们以下结果：\n\n\
  ```bash\n>>> [roots @ fosslinux ~] #rm remains\nrm: can't remove `foss': Is a directory\n\
  ```\n\n要删除或移除它，我们需要尝试 `-r` 选项，`r` 代表递归（repeat）。如果我们尝试的话，就会成功。\n\n```bash\n>>> [roots\
  \ @ fosslinux ~] #rm -r foss /\nrm: delete directory `foss'? Y\n```\n\n成功删除了空目录。如果它内部包含某些内容、文件或引用，那就是另一回事了。让我们在\
  \ `foss1` 目录下创建一个文件和目录。\n\n```bash\n>>> [roots @ fosslinux ~] # mkdir foss1 / test_dir\n\
  >>> [roots @ fosslinux ~] # touch foss1 / test_file\n```\n\n这是一个示例，但你正在尝试删除的目录树可能包含成百上千个文件或文件夹。\n\
  \n如果我们需要删除所有它们，而不需要花费整天时间去验证，我们使用 `-f` 作为函数参数。\n\n```bash\n>>> [roots @ fosslinux\
  \ ~] # rm -rf foss1 /\n```\n\n当你删除一个目录时，光标名称末尾可能带有或不带有斜杠（`/`）。我建议你不要使用斜杠。\n\n如果你正确输入了命令并在\
  \ `foss1` 和 `/` 之间留了额外的空格，你将删除 `foss1` **以及** `/` 根目录，并破坏你的整个 Linux 文件系统，且无法恢复（大多数情况下）。\n\
  \n这是死亡法则。所以，务必小心！你已经收到警告了。正如俗所说，能力越大，责任越大。\n\n### 移动目录\n\n有时，我们需要将转移到另一个索引的完整目录。\n\
  \n将 `foss8` 目录移动到 `/ tmp /` 目录，我们可以这样做：\n\n```bash\n>>> [roots @ fosslinux ~] #\
  \ mv foss8 / tmp /\n```\n\n应该有足够的移动空间；我们不需要指定 `foss8` 和后面的 `/ tmp /`。\n\n- `-r`\
  \ 或相同的参数，它会自动移动整个目录树。\n\n但仍然有一个像 `rm` 一样的选项，即 `-f`。\n\n我们在 `/tmp /` 目录下有一个 `foss8`\
  \ 目录，让我们看看当我们重建并尝试再次将其移动到 `/ tmp /` 时会发生什么。\n\n```bash\n>>> [roots @ fosslinux ~]\
  \ # mkdir foss8\n>>> [roots @ fosslinux ~] # mv foss8 / tmp /\nmv: write over `/\
  \ tmp / foss8 '?\n```\n\n输入 'n' 或按下 `CTRL + C` 退出命令。\n\n你看到，它要求我们写入已存在的目录，即使两者都是空的。为了避免这种情况，请使用\
  \ `-f` 选项进行覆盖。\n\n```bash\n>>> [roots @ fosslinux ~] # mv -f foss8 / tmp /\n```\n\
  \n### 重命名目录\n\n你已经知道 Linux 上没有单独的重命名文件的命令。由于 Linux 上的目录只是一种特殊的文件类型，同样的原理也适用于目录。重命名通过\
  \ `mv` 命令完成，后跟源目录和目标名称。因此，如果我们需要将目录 `foss10` 重命名为 `foss101`，我们将发布以下命令：\n\n```bash\n\
  >>> [roots @ fosslinux ~] # mv foss10 foss101\n```\n\n### 清理现场\n\n现在，用一个命令清理我们创建的所有内容，使用\
  \ `*` 来指定以 `foss` 开头的多个引用，以及 `/ tmp /` 目录中的其他内容。\n\n```bash\n>>> [root @ fosslinux\
  \ ~] # rm -rf foss * / tmp / foss *\n```\n\n# 第 5 章：深入研究 Linux\n\n## 5.1 Linux Shell\n\
  \nShell 是 Unix 或 GNU / Linux 等操作系统中的命令解释器，是一个使用其他程序的程序。它为 Unix / GNU Linux 系统提供了一个计算机界面，使用户可以使用特定的安装细节使用不同的命令或资源/工具。\n\
  \n当 Shell 完成程序运行后，它会将输出发送到屏幕上的用户，屏幕是一个标准输出设备。由于这个原因，它被称为“命令解释器”。\n\nShell 不仅仅是解释命令，它的系统语言具有完整的语言结构，如条件执行、约束、灵活性、任务等。\n\
  \n这就是为什么 Unix / GNU Linux shell 比 Windows shell 更强大的原因。\n\n现在，我们可以查看一眼 Unix / GNU\
  \ Linux 中一些最广泛使用的开源 shell。\n\n### Bash Shell\n\nBash 代表 Bourne Again Shell（再次布恩\
  \ 壳），是目前大多数 Linux 发行版的默认 shell。它还具有与 sh 关联的 shell 并在系统上提供了比 sh 更高效的开发，包括：\n\n- 编辑命令行\n\
  - 性能管理\n- 无限制大小的命令历史\n- Shell 服务与别名\n- 无限制大小的近似布局\n- 任何地方的整数算术\n\n### Tcsh / Csh\
  \ shell\n\nTcsh 基于 C-shell 开发，可以作为登录 shell 使用。Tcsh 具有：\n\n- C 语言语法\n- 命令行编辑器\n-\
  \ 单词补全\n- 拼写纠错\n- 性能管理\n\n### Zsh 的 Shell\n\nZsh 设计用于并集成许多其他 Unix / Linux shell（如\
  \ bash、tcsh 和 ksh）的特性。尽管它有一些独特的特性：\n\n- 文件名生成\n- 启动文件\n- 登录\n- 结论性想法\n- 概念指南\n\n\
  ### Fish\n\nFish 是一个处于全盛期的“友好交互式 shell”，记录于 2005 年。它被设计为功能齐全且易于使用，与其他 shell 一样具有出色的特性：\n\
  \n- 个人页面补全\n- 基于 Web 的配置\n- 自动建议\n- 可以完全用纯脚本编写\n- 支持 Term256 技术\n\n## 5.2 进程与操作管理\n\
  \n像任何多任务应用一样，Linux 执行多个同时进行的进程。是的，它们看起来是同时出现的。然而，事实上，单个处理器核心一次只能执行一个进程，但 Linux 内核能够为每个进程提供自己的处理器的机会，每个进程看起来都同时在运行。\n\
  \n我们可以说，有很多命令用于控制进程。当然：\n\n- `kill`: 向一个或多个进程发送信号（通常是 `kill` 进程）\n- `ps`: 列出系统中运行的进程\n\
  - `fg`:将进程放在前台\n- `bg`:将进程放在后台\n- `tasks`:列出你的进程的另一种方法\n\n### 实际示例\n\n虽然这个标题看起来很模糊，但对于努力使用图形显示器的普通用户来说可能非常有用。尽管可能无法，但大多数（不是所有）图形程序都可以在命令行中设置。这是一个示例：X\
  \ Window 程序提供了一个名为 `xload` 的小程序，它可以显示表示系统负载的图表。我们可以通过输入以下内容体验这个程序：\n\n```bash\n\
  >>> [me @ linuxbox me] $ xload\n```\n\n注意，弹出一个 xload 窗口并开始显示系统负载图。对于没有 xload 的应用程序，可以尝试\
  \ `gedit`。此外，注意在程序启动后我们的信息并没有出现。Shell 正在等待系统完成后返回控制权。当我们关闭 xload 窗口时，xload 系统结束并快速恢复。\n\
  \n### 将系统放入某物的后台\n\n\n\n\n\n为了让流程和你的生活变得简单一点，我们将重新启动 `xload` 程序，但这次我们将将其放在后台运行，以便提示符返回。为了做到这一点，我们如下所示运行\
  \ `xload`：\n\n```\n>>> [me @ linuxbox me] $ xload &\n>>> [1] 1223\n>>> [me @ linuxbox\
  \ me] $\n```\n\n在这种情况下，信息返回了，因为该进程被留在了后台。\n\n现在想象一下我们忘记使用 `&` 符号将程序放在后台了。仍然有希望。我们可以输入\
  \ `Ctrl-z`，进程将会停止。我们可以通过观察程序窗口是否已冻结来确认这一进程。进程仍然存在，但它不再工作了。要在后台启动该进程，请输入 `bg` 命令（background\
  \ 的缩写）。这里是一个示例：\n\n```\n>>> [me @ linuxbox me] $ xload\n>>> [2] + Paused xload\n\
  >>> [me @ linuxbox me] $ bg\n>>> [2] + xload &\n```\n\n### 进程列表\n\n既然我们已经在后台运行了进程，那么显示我们已启动的进程列表可能会有所帮助。为了做到这一点，我们可以使用函数命令，或者更强大的\
  \ `ps` 命令。\n\n```\n>>> [me @ linuxbox me] $ jobs\n>>> [1] + Launch xload &\n>>>\
  \ [me @ linuxbox me] $ ps\n>>>PID TTY TIME CMD\n>>>1211 pts / 4 00:00:00 bash\n\
  >>>1246 pts / 4 00:00:00 xload\n>>>1247 pts / 4 00:00:00 ps\n>>> [me @ linuxbox\
  \ me] $\n```\n\n### 杀死进程\n\n假设我们有一个无响应的计划；我们如何移除它呢？当然，我们使用杀进程命令。让我们在 `xload` 上尝试一下。首先，我们需要识别想要杀掉的进程。我们可以使用函数或\
  \ `ps` 来做到。如果我们使用 `jobs`，我们将获得作业号。如果使用 `ps`，我们将获得一个进程 ID (`PID`)。我们将两种方法都尝试一遍：\n\
  \n```\n>>> [me @ linuxbox me] $ xload &\n>>> [1] 1292\n>>> [me @ linuxbox me] $\
  \ jobs\n>>> [1] + Launch xload &\n>>> [me @ linuxbox me] $ kill% 1\n>>> [me @ linuxbox\
  \ me] $ xload &\n>>> [2] 1293\n>>> [1] xload terminated\n>>> [me @ linuxbox me]\
  \ $ ps\n>>> PID TTY TIME CMD\n>>>> 1280 pts / 5 00:00:00 bash\n>>> 1293 pts / 5\
  \ 00:00:00 xload\n>>> 1294 pts / 5 00:00:00 ps\n>>> [me @ linuxbox me] $ kill 1293\n\
  >>> [2] + Xload disconnected\n>>> [me @ linuxbox me] $\n```\n\n## 5.3 用户切换及替代方案激活说明\n\
  \n`su`（substitute 或 switch user 的缩写）工具允许你使用另一个用户的权限运行命令，通常是 root 用户。\n\n使用 `su`\
  \ 是为当前登录会话切换到管理员账户的简单方法。当 root 用户被允许使用 `ssh` 或 GUI 显示器管理器进入系统时，这特别有用。\n\n### 如何使用\
  \ su 命令 `$su`\n\n该命令的标准语法如下所示：\n\n```\n$ su [OPTIONS] [USER [CONFLICT ...]]\n```\n\
  \n当在没有选项的情况下请求时，策略默认字符是使用交互式 shell 作为 root：\n\n```\n$ su\n```\n\n你将收到通知，要求输入 root\
  \ 密码，一旦确认，临时使用该命令的用户将变为 root。\n\n会话 shell (`SHELL`) 和本地主目录 (`HOME`) 被设置为用户登录时的 `/etc/passwd`，且当前目录没有更改。\n\
  \n要验证用户是否已更改，请使用 `whoami` 命令：\n\n```\nwhoami\n```\n\n该命令将打印执行当前 Shell 会话的用户：\n\n\
  ```\nroot\n```\n\n请求 `su` 时最常用的选项是 `-`、`-l`、`--login`。这使得 shell 成为登录 shell，其位置与实际登录非常相似，并改变当前目录：\n\
  \n```\nsu -\n```\n\n如果你想使用而不是 `passwd` 文件中指定的 shell，请使用 `-s`、`-shell` 选项。例如，切换到\
  \ root 并使用 `zsh` Shell，你可以写：\n\n```\nsu -s /usr/bin/zsh\n```\n\n为了保存整个环境（`HOME`、`SHELL`、`USER`\
  \ 和 `LOGNAME`）供用户使用，使用选项 `-p`、`--preserve-environment`。\n\n```\nsu -p\n```\n\n当应用选项\
  \ `-p` 时会被忽略。\n\n如果你想在不启动协作 shell 的情况下作为替代用户运行命令，使用选项 `-c`、`--command`。例如，以 root\
  \ 身份请求 `ps` 命令，你可以输入：\n\n```\nsu -c ps\n```\n\n要切换到另一个用户账户，将用户名作为参数传递给他。例如，切换到一个用户配置，你可以输入：\n\
  \n```\nsu dictatorship\n```\n\n### Sudo vs Su\n\n在某些 Linux 发行版（如 Ubuntu）中，出于安全考虑，root\
  \ 用户账户被自动禁用。这意味着 root 没有设置密码，你无法使用 root 切换。\n\n切换到 root 的方法之一是配置 `Sudo` 命令并输入用户的当前登录密码：\n\
  \n```\nsudo su -\n```\n\n`sudo` 命令允许你以另一个用户（通常是 root）的身份运行程序。\n\n如果用户被赋予了 `sudo`\
  \ 权限，执行 `su` 命令将以 root 身份提示。运行 `sudo su -` 并使用用户密码等同于使用 root 密码运行 `su -`。\n\n当与选项\
  \ `-i` 配合使用时，`sudo` 使用一个与 root 用户环境兼容的登录：\n\n```\nsudo -i\n```\n\n### Sudo -i 基本上与执行\
  \ su - 相同\n\n使用 `sudo` 替代 `su` 的优势是不需要在多个用户账户之间共享 root 密码。\n\n# 结论\n\n我希望这本书能教你信任如何使用\
  \ Linux，将其下载到你的电脑上并为它设计你的程序。\n\n我希望这本书也能作为选择合适的 Linux 发行版的工具，帮助你完成日常编程任务并满足你的需求。读完这本书后，你应该已经学会了如何在\
  \ Linux 中使用命令行，并学会了保持机器安全的几个步骤。\n\n尽管 Linux 没有 Windows 那么流行——至少对某些人来说如此——但 Linux\
  \ 可能是最稳定的操作系统之一——它非常棒的一点是它是免费的，所以你不需要付钱获取它，你不需要因为付不起正版费用而选择那些虚假的操作系统。\n\n"
