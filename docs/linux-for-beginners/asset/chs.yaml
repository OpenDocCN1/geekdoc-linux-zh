  \ 或 Mac 的电脑上阅读这段文字，而它能持续是有可能的。\n\n## 2.3 获取访问\n\n在 Linux 中，`access` 命令用于检查系统是否具有对指定文件的访问权限。它可以用于检查文件是否存在。检查是通过调用进程的实际\
  \ `UID` 和 `GID` 完成的。\n\n```c\nint access (const char * pathname, int mode);\n```\n\
  \n在这里，第一个参数接收索引/文件的路径，第二个参数接收标志 `R_OK`、`W_OK`、`X_OK` 或 `F_OK`。\n\n- `F_OK` 标志：用于检查文件是否存在。\n\
  - `R_OK` 标志：用于小的读取权限检查。\n- `W_OK` 标志：用于小的写入权限检查。\n- `X_OK` 标志：用于检查临时权限。\n\n注意：如果\
  \ `access()` 无法访问该文件，它将返回 `-1`，否则将返回 `0`。\n\n### 示例 1：F_OK 标志\n\nfilter_ 不存在\nlight_4\n\
  \n```c\n#include <stdio.h>\n#include <unistd.h>\n#include <errno.h>\n#include <sys\
  \ / types.h>\n#include <sys / stat.h>\n#include <fcntl.h>\nextern int errno;\n\n\
  int main (int argc, const char * argv []) {\n    int fd = access (\"sample.txt\"\
  , F_OK);\n    if (fd == -1) {\n            printf (\"Error Number:% d \\ n\", errno);\n\
  \        error (\"Error Description:\");\n    }\n    other\n                print\
  \ (\"No error \\ n\");\n    return 0;\n}\n```\n\n描述：在输出中，我们收到了这条消息“No error”，因为文件在当前目录中。如果文件不存在，返回值将为\
  \ `-1`。在上面的代码中，我们能发现错误的唯一方法是文件不在指定的格式。如果路径过长，它也会给出错误。\n\n注意：`perror()` 用于打印错误，`errno`\
  \ 用于打印错误代码。\n\n### 示例 2：查看所有权限（读、写、执行）\n\nfilter_ 不存在\nlight_4\n\n```c\n#include\
  \ <stdio.h>\n#include <unistd.h>\n#include <errno.h>\n#include <sys / types.h>\n\
  #include <sys / stat.h>\n#include <fcntl.h>\nextern int errno;\n\nint main (int\
  \ argc, const char * argv []) {\n    int fd = access (\"sample.txt\", (R_OK | W_OK)\
  \ & X_OK);\n    if (fd == -1) {\n        printf (\"Error Number:% d \\ n\", errno);\n\
  \        error (\"Error Description:\");\n    }\n    other {\n        print (\"\
  No error \\ n\");\n    }\n    return 0;\n}\n```\n\n定义：设置了用户许可权限的输出、写入和使用，由于我们在测试情况\
  \ `(R_OK | W_OK) & X_OK`，我们发现没有错误。文件描述值为 `0`。我们可以使用位运算函数来确定访问 `system()` 调用 `system`\
  \ 时的模式冲突。\n\n### 示例 3：查看所有权限（读、写、执行）以显示当发现错误时代码如何工作\n\nfilter_ 不存在\nlight_4\n\n\
