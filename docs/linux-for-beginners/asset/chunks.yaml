    ## 4.5 创建和删除目录


    Linux 文件系统是一个高层树结构，有一个带有 `/` 的高层目录，或根目录。所有其他指南都是居住在该根目录下的子目录。大多数 Linux 发行版的目录结构遵循文件系统层次结构标准（FHS），该标准由于
    1994 年开发，用以防止不同发行版之间不同目录结构之间的混淆。


    在 Microsoft Windows 中，我们有名为 `C:`、`D:` 等磁盘，并且它们上方没有目录。在 Linux 上，尽管我们有不同的驱动器，但仍然有一个根目录。额外的磁盘（或更常见的：设备）可以插入或挂接到某些子目录中。例如，我们可以添加一个磁盘，对其进行正确格式化并将其插入我们创建的任何目录，例如
    `/newdisk`。它仍然根目录之下。


    我们不应将根目录与 `/root` 目录混淆，后者是用户的家目录。


    在今天的《阅读 Linux》文章中，我们将教你如何使用 Linux 终端的命令行创建、删除和管理引用。适用于所有 Linux 发行版。Linux 也有 GUI
    方法，即使用来自桌面桌面的右键菜单。本指南旨在以线性方式完成操作。


    ### 创建目录


    导航当前目录的最简单方法是使用 `mkdir` 命令：


    ```bash

    [roots @ fosslinux ~] #mkdir remains

    ```


    你刚刚在当前目录下创建了一个名为 `foss` 的文件夹。


    我们也可以使用完整路径指定目录，例如，在 `/tmp` 目录创建 `foss1` 目录，我们将使用：


    ```bash

    [roots @ fosslinux ~] #mkdir /tmp/foss1

    ```


    如果我们需要使用同一个命令创建多个索引，可以这样做，下一个命令将在当前索引同时创建 `foss2` 和 `foss3` 索引。


    ```bash

    [roots @ fosslinux ~] #mkdir foss2 foss3

    ```


    还有一个小技巧，叫做括号扩展，它可以帮助你按照模式构建更多引用。以下命令将创建 `foss4`、`foss5`、`fossa` 和 `fossb`。


    ```bash

    [roots @ fosslinux ~] #mkdir residues {4,5, a, b}

    ```


    你甚至可以指定括号的内径，如下命令所示，创建 `foss6` 到 `foss10` 。


    ```bash

    [root @ fosslinux ~] #mkdir residues {6..10}

    ```


    该范围也适用于字母，因此此同样适用于：


    ```bash

    [roots @ fosslinux ~] #mkdir residues {d..f}

    ```


