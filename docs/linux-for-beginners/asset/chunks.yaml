    用户，因为它们非常流行。这并不意味着你不使用 `Linux`，它实际上仍然存在并存在于你每天使用的技术之中。


    `Linux` 是一个操作系统。就像 `Windows` 或 `OS` 一样，在你的软件和硬件之间建立连接。它是自由。`Linux` 是一个开放许可程序，这意味着它是完全智能的，你可以分发你自己的修改版本来帮助他人——尽用你最大的力量，我的朋友。


