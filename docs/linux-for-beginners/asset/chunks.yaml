    `BSD` has also prooved to be important in the development of `Linux`. Many applications
    that come with `Linux` distribution are installed from `BSD`. Network demons and
    resources are very important. The `Linux` kernel communication code was upgraded
    from the ground up (two or three times, actually), but the demons and resources
    are `BSD`.


    Today, `Linux` is nothing less than a complete `Unix Clone`, capable of using
    `X Window System`, `TCP / IP`, `Emacs`, `Web`, `email`, and news software, naming
    it. Almost all major software packages have been shipped to `Linux`, and commercial
    software is now available. In fact, most developers first write applications for
    `Linux` and then send them to other `Unix` programs later. More hardware is supported
    than the original kernel versions. Many people have made benchmarks on `Linux`
    systems and found them faster than operating systems from `Sun Microsystems` and
    `Compa`, while `Linux` works better than `Windows 98` and `Windows NT` on most
    benches.


    # Chapter 2: Linux


    It is said that the `Linux` is the world''s most widely used open-source operating
    system. `Linux` works on all major hardware platforms, including `x86`, `ARM`,
    and `IBM mainframes`, and smaller ones. In terms of `Unix` design principles,
    `Linux` works best on Internet servers and in every consumer electronically controlled
    electronically processed product. `Linux Operating-System` is commonly known for
    its stability because its `Unix`-like structure keeps the systems separate from
    the operating system. See `Unix`.


    With the exception of `Apple` and `Microsoft` products, `Linux` is the OS for
    all smartphones and tablets (Apple''s `iPhone / iPad iOS` is based on `Unix`).
    Like the personal computer OS, `Linux` has a smaller market share compared to
    `Windows` and `Mac` but is growing thanks to the `Google Chrome OS` steadily.


    ## Thousands of Distros


    `GNU General Public License` (`GPL`) has given `Linux` it''s lisence, `Linux`
    is a prominent "open source" product. Many teams convert `Linux` for a variety
    of purposes, and there are literally hundreds of versions, known as "distribution"
    or "distros." Many distros are free, and all use the `Linux` kernel (the root
    of the`Linux`). Now, the commercial organizations, such as `Red Hat` and `Suse`,
    sell `Linux` for technical assistance at a premium. `Linux` is also compatible
    with `IEEE` (see `POSIX`). See the distribution of `Linux`, open-source, and `GNU
    General Public License`.


    ## Desktop vs. Server


    Many desktop `Linux` desros come with a variety of free and very useful apps,
    and many more are available to download. `Linux` types of word processing, spreadsheets,
    painting and drawing applications, media players, and video editors are full-featured
    programs that often compete with `Windows` and `Mac` partners. In contrast, `Linux`
    server types are commonly used in headless mode (no mouse, no keyboard) and include
    management and communication tools outside user productivity applications. See
    the package manager.


    ## Not a Single User Link


    `Linux` uses the `X Window` rendering system to create a basic window, but `Linux`
    desktop models rely on a third-party user interface to display borders, buttons,
    menus, icons, and desktops used by users. `GNOME` and `X Window` are two of the
    most famous, and both can be included in the distro.


    ## From Unix to Minix to Linux


    In 1990, Finnish computer science student `Linus Torvalds` created `Linux`. They
    were inspired by `Minix`, a classroom teaching tool similar to `Unix`. Although
    `Torvalds` has created a kernel, many supporting libraries, resources, and applications
    come from the `GNU Project`, which is why `Linux` is often referred to as `GNU
    / Linux`. Over the years, a large number of programs have contributed. `Torvalds`
    maintains a kernel, and `Linux` is a registered trademark.


    ## Linux Really "by Lee-Nooks"


    The most common pronunciation is "Lynn-icks." However, because in Finnish, `Linus`
    is called "lee noose," `Torvalds` called it "lee nooks." It can also be called
    "line-icks" as many people call `Linus` "line-iss."


    ## 2.1 What is Linux?


    Before we start downloading `Linux`, it''s important that we know what it is -
    for those who don''t know. If you think those who don''t know me, they may be
    `Windows` or `Mac` users, as they are very popular. That doesn''t mean you don''t
    use `Linux` anyway, it''s actually still around and within the technology you
    use every day.


    `Linux` is an operating system. Like `Windows` or `OS`, create connections between
    your software and hardware. It is freedom. `Linux` is an openly licensed program,
    which means it is completely intelligent, and you can distribute your own modified
    version to help others - use your best power, my friend.


    ### Why Use Linux?


    It says you are a `Windows` user; it has always been, why would you want to learn
    a completely new operating system? Almost every computer these days is `Windows`
    - buying a new laptop, `Windows`, going to the library, `Windows`, using a computer
    at work, yes it could be `Windows`. Unlike `Windows` or `OS`, `Linux` offers some
    nice snazzy features that don''t compare freely with open source.


    For example;


    `Linux` is absolutely free (you can install it in as many programs as you like),
    and you can customize the `Linux` operating system to suit your needs. `Windows`
    is not free; you must purchase it and have only a few uses for that product key.
    `Microsoft` and `Apple` both know what their bread is stored for by getting the
    most out of the market here.


    The question is, are you using `Windows` just because you know everything - would
    you like `Linux` if you use it? Make your head spin and maybe, yes.


    ### What is Linux used for?


    Along with the app, `Linux` has a few ''out of the box'' features in use.


    • You can use it to solve other computers. It says, for example, your computer
    won''t boot, you can still open a live disk with `Linux` unlocked, in the drive
    and access the hard drive.


    • Build or host a website; in fact, most of the websites you accessed work on
    `Linux`.


    • Your computer''s operating system.


    • Build servers at a lower price.


    • `Linux` around you - On your TV, Smartphone, and even on your refrigerator or
    washing machine. If it requires a program, it requires the system to run. Think
    of your washing machine as a small washing machine.


    ## 2.2 Advantages and Dangers of Using Linux


    ### Advantages of the Linux


    • `Linux` is very easy to install, and you do not need to install it immediately.
    If you just want to test the water and see if you like it, you can start `Linux`
    from a `USB flash drive` or `CD` and use it from there. It will start well, and
    you do not need to make any changes to your hard drive - win/win.


    • If you have a young engineer and you know what you are doing, you change `Linux`
    to suit you. Unlike `Windows` (as is the illegal for the `Windows`)


    • As stated above, `Linux` is free! So you do not need to pay for using it.


    • So, you can distribute your changes to `Linux` to help many others.


    • `Linux` is known for being a more stable and secure system (The chances of getting
    infected on `Linux` are much lower than other OS).


    • It uses very small resources and space, unlike `Windows`. So you can start the
    program at 500MB drive and `XP` ram. It''s impressive.


    • It can be used with `Windows` or inside `Windows` if you do not want to jump
    ships completely.


    • It is a very smart and powerful program, it is actually more powerful than anything
    you want, and it prepares almost everything.


    • There are alternatives to almost any system or close relative e.g., `Photoshop`,
    `Microsoft Word` will have free versions.


    • There is community support for problem-solving


    ### Disadvantages of Linux


    • `Linux` is not easy as `Windows` or as ''straight out of the box.''


    • There is no dedicated tech support, so getting the ''fix'' of things is in your
    hands unless you want to sign up for `Enterprise Linux`. However, you get free
    software, so it is something to consider.


    • If you are found of video games, you will choose `Windows` as most games are
    not available, but this doesn''t mean you can not. Not much, and it''s easy.

