    操作系统负责识别正确的打印机并安装相应的打印机驱动程序，以便系统只需向打印机调用，而无需使用特定于该打印机的代码或指令——这就是应用程序的功能。其他设备也是如此，例如
    USB 端口；社交网络网站；图形设备（如图形处理器 `GPUs`）；）；主板上的芯片组；以及存储设备（如串行附加 SCSI 接口总线 `SAS` 磁盘适配器和已用适当的文件系统格式化过的磁盘）。


    操作系统会识别并准备有效且易于理解的服务设备，并通常以标准格式将它们记录，例如 `Windows Registry`（Windows 注册表）。设备制造商偶尔会对驱动程序进行配对和更新，操作系统必须更新它们以确保最大的安全性和设备性能；当设备被更换时，操作系统会重新安装并准备新的驱动程序。


    ## 操作系统类型及示例


    虽然应用程序的基本作用无处不在，但有许多应用程序可以适用于各种硬件和用户需求。


    ### 标准操作系统


    通用型操作系统代表了大量的应用程序，旨在用于各种硬件上运行广泛的程序，使用户能够同时使用一个或多个应用程序或功能。通用型操作系统可以安装在多个台式机和笔记本电脑型号上，并运行从会计系统到数据库、从网络浏览器到游戏的各种应用程序。操作系统通常关注进程（电缆）和硬件管理，以确保应用程序可以与系列现有计算机可靠地共享。


    典型的桌面应用程序包括以下：


    - `Windows` 是微软的一种操作系统，是家庭和商务电脑的标准配置。这种基于 GUI 的操作系统于 1985 年发布，之后已发布了多个型号。易于使用的
    `Windows 95` 为个人电脑的快速发展做出了贡献。


    - `Mac OS` 是适用于 Apple Macintosh 电脑和台式机的操作系统。


    - `UNIX` 是一种为了灵活性而设计的通用应用程序。`UNIX` 开发于 20 世纪 70 年代初，是第一个用 `C` 语言编写的应用程序之一。


    - `Linux` 是 `Unix` 操作系统的克隆，旨在为 PC 用户提供免费或低成本的替代方案。`Linux` 以高效、快速的操作系统闻名。


    ### 移动操作系统


    `Mobile OS` 旨在适应移动计算设备和通信设备（如智能手机和平板电脑）的不同需求。与传统 PC 相比，移动设备通常提供的计算资源有限，因此操作系统必须在尺寸和复杂度上进行压缩，以减少资源消耗，同时确保在该设备上运行至少一个或多个应用程序拥有足够的资源。移动操作系统往往强调效率、用户响应，并更关注数据管理功能，例如支持媒体流传输。现在，`Apple
    iOS` 和 `Google Android` 是移动应用程序的示例。


    ### 嵌入式操作系统


    并非所有的计算机设备都是标准的。数十种专用设备——包括家用数字助手、自动报告机（`ATMs`）、飞机系统、销售终端（`POS`）和物联网（`IoT`）设备——都需要应用程序的计算机。主要的区别在于，兼容的计算设备只执行一件大事，因此操作系统非常精简，并且专注于性能和耐用性。操作系统必须快速、整洁，并友善地处理所有错误，以便在所有条件下继续工作。在大多数情况下，操作系统被交付到安装在基础设备上的芯片。例如，如果医疗设备用于患者的生命支持系统，则将使用嵌入式操作系统，该系统必须可靠运行以维持患者生命。联系此示例，`Embedded
    Linux` 是嵌入式操作系统的一个例子。


    ### 网络操作系统


    网络操作系统（`NOS`）是另一种特殊的操作系统，旨在促进运行在局域网（`LAN`）上的设备之间的通信。`NOS` 提供了理解网络协议所需的通信栈，以便形成、交换和分解网络数据包。今天，特殊的
    `NOS` 概念已不再适用，因为某些类型的操作系统对网络连接性更加敏感。例如，`Windows 10` 和 `Windows Server 2019` 包含了完整的通信能力。`NOS`
    的概念仍用于其他通信设备，如路由器、交换机和灭火器，制造商可以使用相关的 NOS，包括 `Cisco Internetwork Operating System
    (IOS)`、`RouterOS` 和 `ZyNOS`。


    ### 实时操作系统


    当计算机设备必须在连续和循环的时间限制内与现实世界交互时，设备制造商可能会选择使用实时应用程序（`RTOS`）。例如，工业控制系统可以调节工厂或发电站的操作。此类中心会产生来自多个传感器的信号，并发送信号以控制阀门、执行器、电机和无数其他设备。在这种情况下，工业控制系统在现实情况发生变化时必须快速且预测性做出响应；否则可能会发生灾难。`RTOS`
    应在没有计费、没有处理延迟和其他延迟的情况下工作，这对于某些类型的应用程序来说是完全可以的。`RTOS` 的示例包括 `FreeRTOS` 和 `VxWorks`。


    应用程序类型之间的区别并不完全，某些操作系统可能共享其他系统的功能。例如，出于共同目的的程序通常包含在传统 `NOS` 中找到的网络能力。同样，嵌入式应用程序通常包含
    `RTOS` 特性，而移动应用程序仍然可以像其他标准操作系统一样同时运行多个应用程序。


    ## 1.2 IBM 硬件上的系统


    `IBM PureApplication System` 是一种基于云的计算机程序，集成了硬件和软件，用于在云中部署和执行任务——换句话说，企业数据中心添加到私有云环境中所需的一切。


    本书的这一章节专门涉及 `IBM PureApplication System v1.1` 软件，描述了第二代硬件系统的变化。它配有一之前发表的文章，这些文章共同解释了硬件和软件
    `PureApplication System` 的基础。这些主题包括：


    ### 硬件


    `IBM PureApplication System` 硬件访问描述了安装在 `PureApplication System` 内部的硬件。本文扩展了第二代硬件的细节。它没有定义系统中的所有硬件，而是关注与第一代相比。


    ### 修改后的硬件


    `IBM PureApplication System` 基础设施即服务（IaaS）的良好实践解释了 `PureApplication System` 如何利用其硬件。


    ### 云系统的本质


    `IBM PureApplication System` 时间管理区域解释了你如何利用 `PureApplication System` 设计良好的硬件来设计具有大量工作负载的云环境。

