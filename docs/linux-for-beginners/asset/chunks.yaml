    ## 4.4 Basic Linux Commands


    In my opinion, you will be familiar with many operating systems as Windows and
    Mac OS X. Linux is one of the most powerful operating systems in use today. According
    to the latest figures from buyers of supercomputer TOP500, ''Linux Now Power is
    100% of the World''s Top 500 Supercomputers''. Doesn''t this bother you?


    The operating system is the soul and mind of computers and all modern computer
    devices. It is Software that handles all hardware resources associated with your
    desktop or laptop. In other words, an operating system controls the connection
    between your Software and your hardware.


    Linux is so ubiquitous that it is available on mobile phones, cars, refrigerators
    and Roku devices. It uses most of the Internet and most computers. In fact, global
    stock exchanges in several countries on Linux. Linux became a platform for deploying
    desktops, servers, and embedded applications worldwide as it is one of the most
    reliable, secure and powerful applications available.


    ### Basic Linux instructions


    Now, let''s take a look at the 20 most important commands on Linux. Linux commands
    are very sensitive so you need to be careful what you say.


    * `ls` –


    If you know windows you will know that the `dir` is used to filter the content
    of the index. Some types may support color coding. The words in blue represent
    the names of the references.


    `ls -l | more` - this helps to separate the result so you can view page by page.
    Otherwise the list goes down very quickly. You can always use `ctrl c` to return
    to the command line.


    ```

    $ ls -l file name

    ```


    * `cd /var/log` –


    Change the current direction. Advanced slash will be used on Linux. For example
    a Linux guide that comes with all kinds of Linux.


    If you use `ls -l` you will be able to see many details of the content in the
    index It will record the file for:

    - File associated permissions

    - File owner

    - Group associated with the file

    - File size

    - Timestamp

    - File name


    ```bash

    $ cd /var/log

    ```


    * `grep` –


    Find text in a file. The `grep` command searches for multiple files at a time
    to find the piece of text you want.


    `grep PATTERN [FILE]`


    `grep failed.log`


    The command above will find all the words in files similar to the word ''failed''.


    ```bash

    $ grep ''failed'' transaction.log

    ```


    * `Su / order of Sudo` –


    There are some commands that require higher operating rights in the Linux system.
    So you use as a System Administrator unusual users can do it.


    * `Sudo`


    If you just need to use something as a great user, you can use the `sudo` command.
    This will allow you to apply the command to the proposed rights and once the order
    is in place you will return to your normal rights and permissions.


    Example - shutting down the `shutdown` command safely turns off the computer system.


    `sudo shutdown -2` - shutdown and turn on computer after 2 minutes

    `sudo shutdown -r 2` - shut down and restart in 2 minutes


    Using `ctrl C` or `shutdown -c` helps to stop the shutdown process.


    ```bash

    $ sudo closure 2

    $ sudo -r 2 closure

    ```


    * `pwd` - Print Active Worksheet


    Another way to identify the direction in which the `pwd` command works. Demonstrates
    an effective and useful guide approach where changes in direction are common.


    ```bash

    $ pwd

    ```


    * `passwd` –


    Although it looks like a `pwd` command the role it plays is different. This command
    is used to change the user account password. You can change your password or the
    password of other users. Note that standard system users can only change their
    password, while `root` can change the password for any account.


    `passwd [username]` - changes user password.


    ```bash

    $ passwd admin

    ```


    * `mv` - Move file


    For moving a file or rename a file you will use the `mv` command. Here the filename
    changes from `first.txt` to `second.txt`. Type `ls` to view the change.


    ```bash

    $ mv first.txt second.txt

    ```


    * `cp` - Copy the file


    `cp source file`. In case you need a copy of the `second.txt` file in the same
    directory you should use the `cp` command.


    ```bash

    $ cp second.txt third.txt

    ```


    You can use `ls -l` to see a new file being created. The two files will be the
    same size.


    * `rm` –


    This command is used to delete files in the directory or in the directory itself.
    Directory cannot be removed if it is empty.


    `rm [file name]`


    `rm -r` removes all content in the index and index again.


    ```bash

    $ rm file1

    $ rm -r myproject

    ```


    * `mkdir` - to create a guide


    `mkdir [identifier]` if you would like to create a directory with a ''myproject''
    type name.


    ```bash

    $ mkdir myproject

    ```


    * `chmod` –


    To change the object mode of the file system. Files can have `r` permissions -
    read, `w` - write and `x` - execute. For example:


    `chmod mode FILE`

    `chmod 744 script.sh`


    The first number represents the user associated with the file. The second number
    belongs to the group associated with the file. The third number is associated
    with everyone who is not part of the user or group.


    ```bash

    $ chmod 744 script.sh

    ```


    * `chown` –


    This command is used to change the identity of a file / folder or multiple files
    / folders for a particular user / group.


    `chown owner_name file_name`


    ```bash

    $ chown user1 script.sh

    ```


    Suppose you are a user named `user1` and you want to change ownership using the
    root `sudo` before syntax.


    ```bash

    $ sudo chown root script.sh

    ```


    * `cat` –


    The command of the `cat` (short for "concatenate") is one of the most widely used
    commands in Linux. The `cat` command allows you to create one or more files, view
    file content, merge files and redirect output to terminals or files.


    ```bash

    $ cat file.txt

    $ cat file1.txt file2.txt

    ```


    ## 4.5 Creating and deleting indicators


    The Linux file system is a high-level tree, with a high-level directory with the
    word `/`, or root directory. All other guidelines are sub-directory that resides
    under this executive directory. Most Linux distribution index structure follows
    guidelines set by the Filesystem Hierarchy Standard, or FHS, developed back in
    1994 to prevent confusion between different directory structures in different
    distributions.


    At Microsoft Windows, we have discs named `C:`, `D:`, etc., and there is no directory
    above them. On Linux, even though we have different drivers, we still have one
    root directory. Additional discs (or more common: devices) can be inserted or
    inserted into some of their subtitles. For example, we can add a disk, format
    it correctly and insert it into any directory we created, for example `/newdisk`.
    It is still below the root directory of the root.


    We should not confuse the root directory with the `/root` directory, which is
    the user''s home folder.


    In today''s Read Linux article, we will teach you how to create, delete and manage
    references using command lines from Linux Terminal. Works on all Linux distributions.
    There is always a GUI approach to Linux too, using the right click menu from the
    front desktop. This guide is designed to do things in a linear way.


    ### Creating Directory


    The easiest way to navigate the current directory is to use the `mkdir` command:


    ```bash

    [roots @ fosslinux ~] #mkdir remains

    ```


    You just created your folder called `foss` in our current directory.


    We can also specify a directory using the complete method, for example, to create
    a `foss1` directory in `/tmp` directory, which we will use:


    ```bash

    [roots @ fosslinux ~] #mkdir /tmp/foss1

    ```


    If we need to create multiple indexes with the same command, we can do the same,
    the next command will create `foss2` and `foss3` indexes simultaneously, in our
    current index.


    ```bash

    [roots @ fosslinux ~] #mkdir foss2 foss3

    ```


    There is also a little trick, called bracket extensions, which can help you build
    more leads by following a pattern. The following will create indexes `foss4`,
    `foss5`, `fossa`, and `fossb`.


    ```bash

    [roots @ fosslinux ~] #mkdir residues {4,5, a, b}

    ```


    You can even specify the inner diameter of the brackets, as the following command,
    to create `foss6` references - `foss10`.


    ```bash

    [root @ fosslinux ~] #mkdir residues {6..10}

    ```


    The scope also applies to books, so this will also apply:


    ```bash

    [roots @ fosslinux ~] #mkdir residues {d..f}

    ```

