    # 第 5 章：深入研究 Linux


    ## 5.1 Linux Shell


    Shell 是 Unix 或 GNU / Linux 等操作系统中的命令解释器，是一个使用其他程序的程序。它为 Unix / GNU Linux 系统提供了一个计算机界面，使用户可以使用特定的安装细节使用不同的命令或资源/工具。


    当 Shell 完成程序运行后，它会将输出发送到屏幕上的用户，屏幕是一个标准输出设备。由于这个原因，它被称为“命令解释器”。


    Shell 不仅仅是解释命令，它的系统语言具有完整的语言结构，如条件执行、约束、灵活性、任务等。


    这就是为什么 Unix / GNU Linux shell 比 Windows shell 更强大的原因。


    现在，我们可以查看一眼 Unix / GNU Linux 中一些最广泛使用的开源 shell。


    ### Bash Shell


    Bash 代表 Bourne Again Shell（再次布恩 壳），是目前大多数 Linux 发行版的默认 shell。它还具有与 sh 关联的 shell
    并在系统上提供了比 sh 更高效的开发，包括：


    - 编辑命令行

    - 性能管理

    - 无限制大小的命令历史

    - Shell 服务与别名

    - 无限制大小的近似布局

    - 任何地方的整数算术


    ### Tcsh / Csh shell


    Tcsh 基于 C-shell 开发，可以作为登录 shell 使用。Tcsh 具有：


    - C 语言语法

    - 命令行编辑器

    - 单词补全

    - 拼写纠错

    - 性能管理


    ### Zsh 的 Shell


    Zsh 设计用于并集成许多其他 Unix / Linux shell（如 bash、tcsh 和 ksh）的特性。尽管它有一些独特的特性：


    - 文件名生成

    - 启动文件

    - 登录

    - 结论性想法

    - 概念指南


    ### Fish


    Fish 是一个处于全盛期的“友好交互式 shell”，记录于 2005 年。它被设计为功能齐全且易于使用，与其他 shell 一样具有出色的特性：


    - 个人页面补全

    - 基于 Web 的配置

    - 自动建议

    - 可以完全用纯脚本编写

    - 支持 Term256 技术


    ## 5.2 进程与操作管理


    像任何多任务应用一样，Linux 执行多个同时进行的进程。是的，它们看起来是同时出现的。然而，事实上，单个处理器核心一次只能执行一个进程，但 Linux 内核能够为每个进程提供自己的处理器的机会，每个进程看起来都同时在运行。


    我们可以说，有很多命令用于控制进程。当然：


    - `kill`: 向一个或多个进程发送信号（通常是 `kill` 进程）

    - `ps`: 列出系统中运行的进程

    - `fg`:将进程放在前台

    - `bg`:将进程放在后台

    - `tasks`:列出你的进程的另一种方法


    ### 实际示例


    虽然这个标题看起来很模糊，但对于努力使用图形显示器的普通用户来说可能非常有用。尽管可能无法，但大多数（不是所有）图形程序都可以在命令行中设置。这是一个示例：X
    Window 程序提供了一个名为 `xload` 的小程序，它可以显示表示系统负载的图表。我们可以通过输入以下内容体验这个程序：


    ```bash

    >>> [me @ linuxbox me] $ xload

    ```


    注意，弹出一个 xload 窗口并开始显示系统负载图。对于没有 xload 的应用程序，可以尝试 `gedit`。此外，注意在程序启动后我们的信息并没有出现。Shell
    正在等待系统完成后返回控制权。当我们关闭 xload 窗口时，xload 系统结束并快速恢复。


