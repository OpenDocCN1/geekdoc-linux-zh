    The "Windows," was first used in middle 1900s when a graphical user interface
    was created and paired or integrated with `MS-DOS`.


    Today Apple, `OS X`, `Microsoft Windows`, and various Linux versions (including
    `Android`) dominate most of today''s operating system market, as we saw earlier.


    Many software operating systems are designed to work with one company''s operating
    system, for example, `Windows` (Microsoft) or `macOS` only (Apple).


    The software will indicate which operating systems are supported and will specify
    more if applicable, including the versions of that concerned OS it supports. For
    example, the video production software program may be compatible with `Windows
    10`, `Windows 8`, and `Windows 7`, but not compatible with previous versions of
    Windows such as `Windows Vista` and `XP`.


    Software developers often release different versions of their software that work
    with other applications or different types. Going back to the example of a video
    production program, that company could also launch another version of the program
    with similar features but work with `mac OS`, a `Windows` operating system.


    It is also essential to know whether your application is 32-bit or 64-bit. A common
    question they ask you when you download software.


    ## 1.1 What is an Operating System?


    An operating system (`OS`) is a program that manages all other system programs
    on the computer after initially installed on a computer with a boot program. App
    applications use the application to make service requests using a defined application
    interface (`API`). Users can also communicate directly with the operating system
    using a user interface, such as a land-line interface (`CLI`) or graphical UI
    (`GUI`).


    ### Why use an Operating System?


    The operating system brings powerful benefits to computer software and software
    development. Outside of the application, the entire application will need to enter
    its UI, as well as the extensive code needed to manage all low-level computer
    operations, such as disk storage, network connections, and more. Considering the
    amount of hardware available, this will reduce all applications'' size and make
    software upgrades ineffective.


    Instead, most common tasks, such as sending a network package or displaying the
    text on some standard output devices, such as a monitor, can be sent to system
    software that acts as a link between apps and hardware. System software provides
    a consistent and repetitive way for apps to work with hardware without apps needing
    to know any hardware details.


    As long as each application accesses resources and services in the same way, that
    application software - the app - can work on almost any number of applications.
    This greatly reduces the time and coding needed to develop and debug the application
    while ensuring that users can control, configure, and manage system hardware using
    a standard and understandable interface.


    Once you install an operating system, this relies on a large device driver library
    to make OS services go to a specific hardware location. Therefore, the whole application
    can make a normal call on the end device, but the Operating System receives that
    call and uses the corresponding driver to translate the call into actions (commands)
    required for the basic hardware on that particular computer. Today, the app provides
    a comprehensive platform that identifies, organizes, and manages a range of computer
    hardware, including memory devices; processors and memory management; chipsets;
    storage; communication; port communications, such as High-Definition Multimedia
    Interface (`HDMI`), Video Graphics Array (`VGA`), and Universal Serial Bus (`USB`);
    and sub-system areas, such as the Peripheral Component Interconnect Express (`PCIe`).


    ### Operating System Functions


    The operating system provides three key capabilities: Provides UI with `CLI` or
    `GUI`; presents and manages the application; and identifies and displays hardware
    resources for those applications - usually, with a default `API`.


    ### User Identifier (UI)


    Every operating system requires a UI, which enables users and administrators to
    interact with the OS so that they can set up, configure, and troubleshoot the
    operating system and its hardware below. There are two main types of UI available:
    `CLI` and `GUI`.


    The `CLI` mode window, or terminal mode, provides a text-based display where users
    simply rely on the traditional keyboards to enter specific commands, parameters,
    and issues related to specific functions. The Graphical User Interface, or desktop,
    provides a visual interface based on icons and symbols where users rely on actions
    acquired by human interface devices, such as touchpads, touch screens, and mouse
    devices.


    The `GUI` is widely used by unfamiliar or end-users who have a great desire to
    create applications and files, such as double-clicking a file icon to open a file
    in its default application. `CLI` remains popular among leading users and system
    administrators who have to handle a series of grammatical and repetitive commands,
    such as creating and documenting to set up new computers (`PCs`) for employees.


    ### Application Management


    The app manages the launch and management of the entire app. This often supports
    multiple behaviors, including processing multiple processes, or threads, so that
    different tasks can be shared during existing processors; manage software-based
    interference to get the processor''s immediate attention, ensuring that there
    is sufficient memory to process the system and its corresponding data without
    interrupting other processes; make error management that can kindly remove system
    processes; and performing memory management without interfering with other applications
    or OS.


    The operating system can support `APIs` that allow applications to use OS and
    hardware functions without the need to know anything about a low-level OS or hardware
    status. For example, the `Windows API` may allow an application to receive input
    from a keyboard or mouse; create GUI objects, such as windows dialog and buttons;
    read and write files to a storage device; and more. Applications are always designed
    to use the application where the program intends to run.


    In addition, the operating system can perform the following services for applications:


    - In a multitasking application, where multiple programs may run simultaneously,
    the OS determines which programs should run in sequence and how long they should
    be allowed in each application before giving another program a chance.


    - Handles the input and output (`I/O`) to and from attached hardware devices,
    such as hard disks, printers, and dial ports.

    - Sends messages to each app or to your partner - or to the system operator -
    about the operating system and any errors that may occur.

    - It can delegate responsibility for the management of bulk operations - for example,
    printing - so that the implementation process is free of this function.

    - On computers that can provide the same processing, a working system can manage
    how a system is divided to run on more than one processor at a time.


    All major computer systems (hardware and software) require, and sometimes include,
    operating systems, and applications must be designed with a variety of features
    to meet the specific needs of different form elements.


    ### The Device-Management


    The operating system is responsible for identifying, configuring, and giving applications
    normal access to computer hardware devices. As the OS detects and identifies the
    hardware, the OS will install compatible drivers of the device that enable the
    Operating System and applications running on the OS to operate devices without
    any specific hardware or device knowledge.

