    Use the standard `rm` we used for the delete fields will bring us the following:


    ```bash

    >>> [roots @ fosslinux ~] #rm remains

    rm: can''t remove `foss'': Is a directory

    ```


    To delete or remove it, we need to try `-r` switch, `r` as a repeat. If we try,
    we will succeed.


    ```bash

    >>> [roots @ fosslinux ~] #rm -r foss /

    rm: delete directory `foss''? Y

    ```


    Successfully removed the blank guide. If it possesses some content in it, files
    or references, this is a different story. Let''s create a file and directory within
    the `foss1` directory.


    ```bash

    >>> [roots @ fosslinux ~] # mkdir foss1 / test_dir

    >>> [roots @ fosslinux ~] # touch foss1 / test_file

    ```


    This is an example, but the directory tree you are trying to delete may contain
    hundreds or thousands of files or folders.


    If we need to delete them all, without having to spend all day verifying them,
    we use the `-f`, as a function, parameter.


    ```bash

    >>> [roots @ fosslinux ~] # rm -rf foss1 /

    ```


    When you delete a guide, you may or may not have a slash (`/`) at the end of the
    cursor name. I suggest you do not use slash.


    If you type the command correctly and place extra space between `foss1` and `/`,
