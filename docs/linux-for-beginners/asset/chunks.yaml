    也兼容 `IEEE`（参见 `POSIX`）。参见 `Linux` 的发行版、开源和 `GNU 通用公共许可证`。


    ## 桌面与服务器


    许多桌面 `Linux` 发行版带有各种免费且实用的程序，还有更多可供下载。`Linux` 的文字处理、电子表格、绘画和绘图应用程序、媒体播放器和视频编辑器都是全功能程序，通常与
    `Windows` 和 `Mac` 合作伙伴竞争。相比之下，`Linux` 服务器类型通常以无头模式（无鼠标、无键盘）运行，包含用户生产力应用之外的管理和通信工具。参见包管理器。


    ## 非单用户链接


    `Linux` 使用 `X Window` 渲染系统来创建基础窗口，但 `Linux` 桌面模型依赖第三方用户界面来显示用户使用的边界、按钮、菜单、图标和桌面。`GNOME`
    和 `X Window` 是最著名的两个，都可以包含在发行版中。


    ## 从 Unix 到 Minix 再到 Linux


    1990 年，芬兰计算机科学学生 `Linus Torvalds` 创建了 `Linux`。他们受到了类似于 `Unix` 的课堂教学工具 `Minix`
    的启发。尽管 `Torvalds` 创建了内核，但许多支持库、资源和来自于 `GNU Project`，这就是为什么 `Linux` 经常被称为 `GNU
    / Linux`。多年来，大量程序做出了贡献。`Torvalds` 维护内核，而 `Linux` 是一个注册商标。


    ## Linux 真的“Lee-Nooks”


    常见的读音是 "Lynn-icks"。然而，因为在芬兰语中 `Linus` 被读作 "lee noose"，`Torvalds` 将其读作 "lee nooks"。它也可以被称为
    "line-icks"，因为许多人把 `Linus` 称为 "line-iss"。


