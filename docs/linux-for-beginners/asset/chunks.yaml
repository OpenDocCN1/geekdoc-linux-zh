    If in doubt, there is always the traditional way. If you want to try Linux, you
    should give at the attention it deserves, you can download Linux, burn the installer
    to a sixth drive (or DVD, if you like optical media), and install it on your computer.
    Linux is open-source, so it can be distributed by anyone who wants to take the
    time to integrate Linux - with all the fragments and pieces that make use of it
    - in what is commonly called a distribution (or "distro") for short. Ask any Linux
    user, and you''ll get a different answer as to which distribution is best (especially
    since the word "best" is often left unspecified). Most people agree that you should
    use a Linux distribution that works for you, which means you should try some popular
    distros and stay on what makes your computer behave the way you expect it to behave.
    This is an easy-to-use and effective method. For example, if the distribution
    fails to detect your webcam and you want your webcam to run, then use a distribution
    that detects your webcam.


    If you have never tried to install any app before, you will find many Linux distributions,
    including a friendly and simple installer. Just download the distribution (delivered
    as ISO files), and download Fedora Media author to create a sixth bootable drive.


    ## How to use


