    ### 与 Windows 10 连接


    如果你想连接到 Windows 平台，需要记住这些点。在通过 RDP 连接到任何 Windows 10 计算机之前，你必须更改某些权限以允许桌面共享远程连接到你的防火墙。


    - 要启动远程桌面共享，在资源管理器中，右键点击 `此电脑` >>> `属性` >>> `远程设置`，在弹出的窗口中勾选 `允许此计算机上的远程连接`，并选择应用。

    - 接下来，使用防火墙启用远程桌面通信。现在在开始菜单中搜索防火墙设置，并选择 `允许应用通过 Windows 防火墙`。

    - 在打开的窗口中，在“已允许的应用和功能”下查看 `远程桌面`。根据你访问此桌面的网络类型，勾选私有和/或公共列中的框框。点击确定。

    - 回到用于远程访问 Windows PC 的 Linux 计算机并启动 Remmina。输入你 Windows 计算机的 IP 地址并按回车键。现在！输入你的用户名和密码并点击确定。

    - 系统将要求你接受并允许证书，选择确定。

    - 你应该能看到自己的 Windows 10 桌面计算机。


    ### 连接到红帽企业 Linux 7


    要设置权限以允许远程访问你的 RHEL7 计算机，请打开 Linux 桌面上的“所有设置”。


    点击共享图标，这将打开另一个窗口。


    当“屏幕共享”关闭时，点击它。会打开一个窗口，你可以在其中滑动到“开启区域”。如果你想允许远程连接控制桌面，请设置“启用远程控制”工作。你还可以在两种访问选项之间选择：一种允许主用户接受或拒绝连接请求，另一种允许通过密码连接。在窗口末尾，选择允许连接的网络接口，并关闭窗口。


    接下来，从 `应用程序菜单 → 杂项 → 防火墙` 打开防火墙设置。


    勾选 `vnc-server` 旁框（如所示）并关闭窗口。之后，回到远程计算机上的 Remmina，输入要连接的 Linux 桌面的 IP 地址，选择 VNC
    作为协议，并按回车。


