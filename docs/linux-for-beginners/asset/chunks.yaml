- fmt: '

    A list of useful objects accessible to all users (everyone has this guide in his
    `$PATH`). Large files of your Software may be here. You should never create a
    directory below this folder.


    * `/bin`


    Like `/usr/bin`, but here you will find only efficient, simple, and minimal process.
    Your (advanced) Software probably doesn''t have anything to install here.


    * `/usr/sbin`


    Like `/usr/bin`, but only contains the achievements that must be achieved by the
    administrator (root user). Ordinary users should not have this guide in their
    `$PATH`.


    * `/sbin`


    Like `/usr/sbin`, but only with the most important startup process successfully,
    and that will be found by sysadmin in another backup system. Commands such as
    `fsck` (test file system), `init` (father of all processes), `fconfig` (network
    configuration), `mount`, etc. can be found here. It is the most important indicator
    of the system.


    * `/usr/lib`


    Contains powerful libraries and static files that support `/usr/bin` and `/usr/sbin`
    operations. You can create a subdirectory such as `/usr/lib/myproduct` to contain
    your help files, or powerful libraries that will only be available through your
    Software, without user intervention. The guide below can be used as a tool for
    plugins and extensions.


    * `/lib`


    Like `/usr/lib` but it contains powerful libraries and supports static files needed
    for the startup process. You will never find usage in `/bin` or `/sbin` requiring
    a library outside this directory. Kernel modules (device drivers) are under `/lib`.


    * `/etc`


    Contains configuration files. If your Software uses a number of files, include
    them under the subfolder such as `/etc/myproduct/`.


    * `/var`


    The name comes from "variable", because everything under this index changes frequently,
    and the package system (`RPM`) does not retain control of. The frequency `/var`
    is set above the differential high performance division. In `/var/log` logfiles
    are growing. In web content we use `/var/www`, and so on.


    * `/home`


    Contains user references from home (real people). Your Software package should
    not include files here (during installation). If your business idea requires a
    special UNIX user (not a person) to be created, you should provide a home directory
    under `/var` or somewhere outside `/home`. Please, never forget that.


    * `/usr/share/doc`, `/usr/share/man`


    The term "share" is used because sub `/usr/share` is a standalone platform, and
    can be shared between several devices in a network file system. So this is a place
    for manuals, texts, examples etc.


    * `/usr/local`, `/opt`


    These are invalid folders. When UNIX does not have a package program (such as
    `RPM`), sysadmins are required to parse the Software (or `local`) option to the
    main OS. These were the indicators used for that.


    You may think it is a bad idea to break your Software (in total) into many pieces,
    instead of keeping it all under an independent directory. But the package program
    (`RPM`) has a database that manages everything properly, taking care of configuration
    files, references etc. And if you stream your Software using FHS, in addition
    to user friendliness, it will bring you the best way to configure sysadmin, and
    it will work better with efficiency and security.


    ### Examples of FHS Uses


    Now that we know where each piece of our Software should be installed, let''s
    review the Universal Parts Table used in FHS. Table. The same Software, using:


    | | [Software on its Own](https://tldp.org/HOWTO/HighQuality-Apps-HOWTO/software.html#software.body)
    | [Configurations](https://tldp.org/HOWTO/HighQuality-Apps-HOWTO/software.html#software.soul)
    | [Content](https://tldp.org/HOWTO/HighQuality-Apps-HOWTO/software.html#software.content)
    | [Logs, Dumps etc](https://tldp.org/HOWTO/HighQuality-Apps-HOWTO/software.html#software.logs)
    |

    | :--- | :--- | :--- | :--- | :--- |

    | Data Base Server | `/usr/bin/`, `/usr/lib/`, `/usr/share/doc/mydb/`, `/usr/share/doc/mydb/examples/`
    | `/etc/mydb/` | `/var/db/instance1/`, `/var/db/instance2/`, etc | `/var/db/instance1/transactions/`,
    `/var/log/db/access-instance1.log`, `/var/log/db/access-instance2.log` |

    | Text Editor | `/usr/bin/`, `/usr/lib/`, `/usr/lib/myeditor/plugins/`, `/usr/share/myeditor/templates/`,
    `/usr/share/doc/myeditor/` | `$HOME/.myeditor.conf` | `$HOME/Docs/` | `$HOME/.myeditor-tmp/`
    |

    | MP3 Generator | `/usr/bin/`, `/usr/lib/`, `/usr/lib/mymp3/`, `/usr/share/doc/mymp3/`
