    20 世纪 90 年代后期，Thompson 和 Ritchie 希望在一台比 `PDP-7` 大得多的机器上运行 `Unix`，他们通过向来自贝尔实验室的另一项资金援助中承诺增加
    `Unix` 文本处理能力，并对 `PDP-11/20` 机器代码进行了编码。因此，在 1970 年第一次，活跃的 `Unix` 系统正式发布并实现在 `PDP-11/20`
    上。随后还增加了一个名为 `roff` 的文本开发程序和一个文本编辑器。这三者都是用 `PDP-11/20` 会编语言编写的。贝尔实验室将这个由 `Unix`、`Roff`
    和编辑器开发的第一个“文本处理”程序用于专利申请的文本处理中。`Roff` 很快演变成了 `troff`，这是第一个具有完整编辑能力的电子出版系统。


    1972 年，`Unix` 用 C 编程语言进行了重写，这与当时的普遍观念形成对比，当时人们认为“没有任何复杂的应用需要处理关键周期性事件，只能用汇编语言编写”（尽管
    `Unix` 不是第一个用高级语言编写的操作系统，自 1961 年起 `Burroughs B5000` 就是此类系统）。`C` 语言是由 Ritchie
    作为 `B` 语言的改进版本开发的，而 `B` 语言是 Thompson 对 Martin Richards 的 `BCPL` 的翻译。汇编语言向高级 `C`
    语言的迁移实现了可移植软件，当 `Unix` 安装在其他计算机平台时，只需替换少量的基于机器的代码。


    AT&T 通过许可的方式将 `Unix` 提供给大学、商业公司以及美国政府。许可包含所有源代码，包括存储器中基于机器的部分，这些部分是用 `PDP-11`
    汇编代码编写的。指定的 `Unix` 内核源码副本在 20 世纪 70 年代后期以纸质形式广泛传播，这导致了 `Unix` 作为教育模型被广泛使用。在曾一度，`ARPA`（高级研究计划署）采用
    `Unix` 成为 `Arpanet`（互联网的前身）社区的官方语言。


    20 世纪 70 年代后期和 80 年代初，`Unix` 对学术界的影响导致了 `Unix` 被许多商业倡议计划广泛接受（特别是来自加州大学伯克利分校的 `BSD`
    版本），例如 `Solaris`、`HP-UX` 和 `AIX`。今天，除了上述提到的 `Unix` 认证程序外，经常遇到如 `Linux` 和 `BSD`
    系列（`FreeBSD`、`NetBSD` 和 `OpenBSD`）等由 `Unix` 驱动的程序。


    ### Linux OS


    由于庞大的发行基础，`Unix` 是世界上最活跃的程序之一。它最初是 20 世纪 70 年代中期为微型计算机和主机开发的多用途系统。从那以后，它已成为范围内最广泛的应用之一，尽管视觉界面有时令人困惑且缺乏中间暂停功能。


    `Unix` 流行的真正原因是什么？许多黑客认为 `Unix` 是“三要素”——唯一的真操作系统。因此，`Linux` 的开发是由不断增长的 `Unix`
    黑客群体实现的，他们想要亲手操作自己的系统。


    `Unix` 版本存在于许多程序中，从个人电脑到像 `Cray Y-MP` 这样的大型计算机。你们的许多 `Unix` 版本非常昂贵且复杂。当时，`ATM
    T''s System V 386` 单机版本的价格约为 1500 美元。


    `Linux` 是一个广泛发行的 `Unix` 版本，最初由 `Linus Torvalds` 开发，他在 1990 年初作为芬兰赫尔辛基大学的一的学生开始研究
    `Linux`。Linus 现在在加利福尼亚州圣克拉拉运营 `Transmeta Corporation`（Transmeta 公司），并维护 `Linux`
    内核，这是该应用程序中最底层的组件。


    `Linus` 在互联网上免费发布了第一个版本的 `Linux`，无意中引入了人类史上最大的软件升级之一。今天，`Linux` 由一个成千上万名在互联网上自由工作的开发者团队（如果不是所有人）编写和维护。公司开始提供
    `Linux` 支持，将其封装成易于安装的发行版，并销售预装了的工作站和 `Linux` 软件。1999 年 3 月，首届 `Linux World Expo`
    世界展在加利福尼亚州圣何塞举行，据报道人数超过 12,000 人。大多数估计认为全球 `Linux` 用户约为 1000 万（预计当你读到这里时会觉得这个数字很小）。


    受到 `Andrew Tanenbaum''s Minix`（另一个用于 PC 的免费 `Unix`，尽管非常简单）的鼓励，`Linux` 起于一个课程项目，Linus
    想构建一个可以在基于 `386` 的 PC 上运行的简单 `Unix` 程序。关于 Linux 的首次对话发生在 Usenet 的 `comp.os.minix`
    新闻组。这些讨论对于想要更多功能的 `Minix` 用户的 `Unix` 微课程开发非常重要。


    `Linux` 的早期开发主要集中在 `80386` 保护接口的切换特性，全部用汇编代码编写。Linus 写道：


    ```

    After that, it was a clear ship: installing fur codes still, but I had some devices,
    and fixing the error was easy. I started using C, and C++ at this stage, and it
    really accelerates progress. That was the time when I aimed to get started to
    get serious about my megalomaniac ideas for making "Minix better than Minix."
    I was hoping to be able to re-collect GCC under Linux one day.

    ```


    两个月的基础设置，但过了很久，我才有了磁盘驱动程序（它有 Bug，但恰好在我的机器上运行）和一个小型文件系统。那时，我在 [1991 年 8 月下旬] 发布了
    `0.01` 版本：它很丑，没有软盘驱动程序，你做不了什么事情。我不认为有人编译过那个版本。但到那时，我失去了希望，在能够摆脱 `Minix` 之前我不想放弃。


    关于 `Linux Version 0.01` 尚未公告。`0.01` 源码甚至不可用：它们只包含空的内核元素，并假设你可以访问 `Minix` 机器来整合它们。


    1991 年 10 月 5 日，Linus 宣布了第一个“官方”版本的 `Linux`，即 `0.02` 版本。期间，Linus 能够使用 `bash`（GNU
    Bourne Shell）和 `GCC`（GNU C 编译器），但其他大部分都无法工作。此外，这被设计为一个黑客程序。主要重点是内核开发；从未讨论过用户支持、文档等问题。今天，情况大不相同——`Linux`
    世界真正的兴奋点是处理用户镜像、易于分发的软件包以及图形和生产设施等高级应用。


    在 `0.03` 版本之后，Linus 将版本号提升到 `0.10`，因为更多人开始研究该系统。经过多次修订，Linus 将版本号增加到 `0.95`，表明他预计系统很快就能准备好正式发布（通常软件在完全完成或没有
    Bug 之前不会被赋予 1.0 版本）。这是 1992 年 3 月的事。大约 1.5 年后，即 1993 年 12 月底，`Linux` 内核处于 `0.99.pl14`
    版本——接近 `1.0`。`1.0` 版本出现在 1994 年 3 月。在本文写作（1999 年）时，内核当前版本为 `2.2.6`，`2.3` 版本正在同步进行。


    如果没有自由软件基金开发的 `GNU` 工具，`Linux` 将是不可能的。他们的 `GCC` 编译器将在接下来的章节中讨论它是如何赋予 Linus Torvalds
    代码以生命的。`GNU` 工具从 `Linux` 构建开始就与其密不可分。由于这些工具的关键贡献，自由软件基金甚至要求将 `Linux` 及相关资源的发行命名为
    `Linux / GNU`。


