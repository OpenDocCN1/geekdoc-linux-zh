    In order to make processess and your life a little easier, we will re-launch the
    `xload` program, but this time we will put it in the background for the prompt
    to return. To do this, we make an `xload` as follows:


    ```

    >>> [me @ linuxbox me] $ xload &

    >>> [1] 1223

    >>> [me @ linuxbox me] $

    ```


    In this case, the information is back because the process was left behind.


    Now imagine that we forgot to use the `&` icon to put the program in the background.
    There is still hope. We can type `Ctrl-z`, and the process will be stopped. We
    can confirm this process by seeing that the program window has been frozen. The
    process is still there, but it doesn''t work. To start the process in the background,
    type the `bg` command (short for domain). Here is an example:


    ```

    >>> [me @ linuxbox me] $ xload

    >>> [2] + Paused xload

    >>> [me @ linuxbox me] $ bg

    >>> [2] + xload &

    ```


    ## Process Lists


    Now that we have the process in the background, it may help to show a list of
    the processes we have started. To do this, we can use either a function command
    or a more powerful `ps` command.


    ```

    >>> [me @ linuxbox me] $ jobs

    >>> [1] + Launch xload &

    >>> [me @ linuxbox me] $ ps

    >>>PID TTY TIME CMD

    >>>1211 pts / 4 00:00:00 bash

    >>>1246 pts / 4 00:00:00 xload

    >>>1247 pts / 4 00:00:00 ps

    >>> [me @ linuxbox me] $

    ```


    ## Killing Process


    Suppose we have an unresponsive plan; how do we remove it? We use the murder order,
    of course. Let''s try this on `xload`. First, we need to identify the process
    we want to kill. We can use either functions or `ps` to do this. If we use `jobs`
    we will get the job number back. With `ps`, we are given a process id (`PID`).
    We will do it both ways:


    ```

    >>> [me @ linuxbox me] $ xload &

    >>> [1] 1292

    >>> [me @ linuxbox me] $ jobs

    >>> [1] + Launch xload &

    >>> [me @ linuxbox me] $ kill% 1

    >>> [me @ linuxbox me] $ xload &

    >>> [2] 1293

    >>> [1] xload terminated

    >>> [me @ linuxbox me] $ ps

    >>> PID TTY TIME CMD

    >>>> 1280 pts / 5 00:00:00 bash

    >>> 1293 pts / 5 00:00:00 xload

    >>> 1294 pts / 5 00:00:00 ps

    >>> [me @ linuxbox me] $ kill 1293

    >>> [2] + Xload disconnected

    >>> [me @ linuxbox me] $

    ```


    ## 5.3 User Change and Activation Instructions like Alternative


    The `su` (short for substitute or switch user) utility allows you to use commands
    with another user''s rights, automatically the root user.


    Using the `su` is an easy way to switch to an administrative account for the current
    login session. This is especially helpful when the root user is not allowed to
    enter the system using `ssh` or using the GUI display manager.


    ### How to use su Command `$su`


    The standard syntax for the following command is as follows:


    ```

    $ su [OPTIONS] [USER [CONFLICT ...]]

    ```


    When requested without option, the default character of the strategy is to use
    the interactive shell as root:


    ```

    $ su

    ```


    You will be notified that you entered the root password, and once confirmed the
    user who temporarily uses the command becomes root.


    Session shell (`SHELL`) and local flexibility (`HOME`) are set to user login `/etc/passwd`,
    and the current directory has not changed.


    To verify that the user has changed, use the `whoami` command:


    ```

    whoami

    ```


    The command will print the name of the user conducting the current Shell session:


    ```

    root

    ```


    The most commonly used option when requesting a `su` is `-`, `-l`, `--login`.
    This makes the shell an entry shell that has a very similar location to the real
    entry and changes the current direction:


    ```

    su -

    ```


    If you want to use another shell instead of what is specified in the `passwd`
    file, use the `-s`, `-shell` option. For example, switch to root and use `zsh`
    Shell you can write:


    ```

    su -s /usr/bin/zsh

    ```


    To save the entire environment (`HOME`, `SHELL`, `USER`, and `LOGNAME`) for an
    expensive user use the option `-p`, `--preserve-environment`.


    ```

    su -p

    ```


    When the option `- applied `-p` is ignored.


    If you want to use the command as a substitute user without starting a collaboration
    shell, use the option `-c`, `--command`. For example, requesting a `ps` command
    as root you can type:


    ```

    su -c ps

    ```


    To switch to another user account, transfer the username as an argument to him.
    For example, switching to a user profile that you can type:


    ```

    su dictatorship

    ```


    ### Sudo vs Su


    In some Linux distributions such as Ubuntu, the root user account is automatically
    disabled for security reasons. This means that no password is set to root and
    you cannot use the root switch.


    One option that you can change to root would be to configure the `Sudo` command
    and enter the user''s current login password:


    ```

    sudo su -

    ```


    `sudo` command allows you to use programs as another user, automatically the root
    user.


    If the user is given a `sudo` test, the `su` command will be prompted as root.
    Running `sudo su -` and using a user password is the same as running a `su -`
    using a root password.


    When used with the option `-i`, `sudo` uses a login that is compatible with the
    root user environment:


    ```

    sudo -i

    ```


    ### Sudo -i is basically the same as working su -


    The advantage of using `sudo` over `su` is that the root password does not need
    to be shared between multiple user accounts.


    # Conclusion


    I hope this book teaches you to trust how to use Linux to download it on your
    computer to design your programs for it.


    I hope that this book also serves as a tool to pick the right Linux distribution
    to help you accomplish day-to-day programming tasks and suit your needs. After
    this book, you should have learned how to use the command line in Linux and managed
    to learn a few steps in keeping your machine secure.


    Although not as popular as Windows — at least to some people — Linux is probably
    one of the most stable operating systems — and the great thing about it is that
    it is free, so you don''t have to pay money to get it, so you don''t have to go
    for bogus operating systems only because you can''t pay for the legal copy.

