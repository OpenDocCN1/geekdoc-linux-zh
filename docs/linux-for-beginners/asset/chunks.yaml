    # Chapter 1: History of the Operating System


    Early computers did not have any applications. Each program that operates on these
    first computers was required to enter all the code needed to operate the computer,
    connect to the connected hardware, and perform the calculations intended to run
    the program. This situation has made even the simplest of programs even more complicated.


    To address this issue, intermediate computer owners began developing system software
    that enabled them to write and execute computer programs, thus giving birth to
    the first applications.


    The first operating system was developed by General Motors in 1956 using a single
    IBM single computer. In the middle 1960s, IBM was the first computer manufacturer
    to take on the task of developing applications and began distributing applications
    installed on the computers.


    Now, the first operating systems were developed in the 1950s when computers could
    operate only single program at one time. After a few more decades, computers began
    to install additional software programs, sometimes called libraries, that came
    together to create the start of modern applications.


    In the middle 1960s, the first version of the UNIX app was developed. It is written
    in a C language and is available free of charge during its early years. UNIX is
    easily adapted to new programs and quickly embraced widely.


    Most modern operating systems, including Apple OS X and all different Linux versions,
    go back or rely on Unix OS.


    Microsoft Windows was developed in response to IBM''s application for the application
    to run its computer or PC operating system.


    Microsoft''s first operating system was not called Windows; it was called MS-DOS
    and was built in 1981 when it purchased the 86-DOS operating system from Seattle
    Computer Products and modified it to meet IBM''s needs.'
