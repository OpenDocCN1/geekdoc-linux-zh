    所有用户都可以访问的有用对象列表（每个人的 `$PATH` 中都包含此指南）。你的软件大文件可能位于此处。你不应在此文件夹下创建任何目录。


    * `/bin`


    类似于 `/usr/bin`，但在这里你只会找到高效、简单且精简的进程。你的（高级）软件可能没有需要安装在此处的内容。


    * `/usr/sbin`


    类似于 `/usr/bin`，但仅包含必须由管理员（root 用户）完成的程序。普通用户不应在他们的 `$PATH` 中包含此指南。


    * `/sbin`


    类似于 `/usr/sbin`，但仅包含最重要的启动成功所需的进程，系统管理员会在另一个备份系统中找到这些进程。诸如 `fsck`（测试文件系统）、`init`（所有进程之父）、`fconfig`（网络配置）、`mount`
    等命令可以在这里找到。它是系统最重要的指标。


    * `/usr/lib`


    包含支持 `/usr/bin` 和 `/usr/sbin` 操作的强大库和静态文件。你可以创建一个如 `/usr/lib/myproduct` 的子目录来包含你的帮助文件，或仅通过你的软件可用且无需用户干预的强大库。下面的指南可以作为插件和扩展的工具。


    * `/lib`


    类似于 `/usr/lib`，但它包含了启动过程所需的强大库和静态文件。你永远不会 `/bin` 或 `/sbin` 中发现需要此目录之外库的使用。内核模块（设备驱动程序）位于
    `/lib`。


    * `/etc`


    包含配置文件。如果你的软件有很多文件，请将它们包含在如 `/etc/myproduct/` 等子目录下。


    * `/var`


    名称源于 "variable"变量），因为此索引下的所有内容都会频繁变化，且软件包系统（`RPM`）不保留控制。`/var` 的频率设置在差异高性能分区之上。在
    `/var/log` 中，日志文件不断增长。在网络内容中，我们使用 `/var/www` 等。


    * `/home`


    包含来自家目录（真实人类）的用户引用。你的软件包不应在此处包含文件（在安装期间）。如果你的业务逻辑需要创建一个特殊的 UNIX 用户（而非人类），你应该在
    `/var` 下或 `/home` 之外的地方提供一个家目录。请永远不要忘记。


    * `/usr/share/doc`, `/usr/share/man`


    使用 "share" 一词是因为子目录 `/usr/share` 是一个独立的平台，可以在网络文件系统的多个设备之间共享。因此，这是手册、文本、示例等的地方。


    * `/usr/local`, `/opt`


    这些是无效的文件夹。当 UNIX 没有软件包程序（如 `RPM`）时，系统管理员需要将软件（或 `local`）选项解析到主操作系统。这些是曾为此使用的指标。


    你可能认为将你的软件（总共）拆分成许多部分而不是将其全部保留在一个独立的目录中是一个坏主意。但软件包程序（`RPM`）拥有一个可以妥善管理一切的数据库，负责配置文件、引用等。如果你使用
    FHS 流化你的软件，除了用户友好外，它还将带来配置系统管理员的最佳方式，并且在效率和安全性方面运行得更好。


    ### FHS 使用示例


    现在我们已经知道了软件的每个部分应该安装在何处，让我们回顾一下 FHS 中使用的通用部分表。表格。相同的软件，使用：


    | | [软件自身的程序](https://tldp.org/HOWTO/HighQuality-Apps-HOWTO/software.html#software.body)
    | [配置](https://tldp.org/HOWTO/HighQuality-Apps-HOWTO/software.html#software.soul)
    | [内容](https://tldp.org/HOWTO/HighQuality-Apps-HOWTO/software.html#software.content)
    | [日志、转储等](https://tldp.org/HOWTO/HighQuality-Apps-HOWTO/software.html#software.logs)
    |

    | :--- | :--- | :--- | :--- | :--- |

    | 数据库服务器 | `/usr/bin/`, `/usr/lib/`, `/usr/share/doc/mydb/`, `/usr/share/doc/mydb/examples/`
    | `/etc/mydb/` | `/var/db/instance1/`, `/var/db/instance2/`, 等 | `/var/db/instance1/transactions/`,
    `/var/log/db-access-instance1.log`, `/var/log/db-access-instance2.log` |

    | 编辑器 | `/usr/bin/`, `/usr/lib/`, `/usr/lib/myeditor/plugins/`, `/usr/share/myeditor/templates/`,
    `/usr/share/doc/myeditor/` | `$HOME/.myeditor.conf` | `$HOME/Docs/` | `$HOME/.myeditor-tmp/`
    |

    | MP3 生成器 | `/usr/bin/`, `/usr/lib/`, `/usr/lib/mymp3/`, `/usr/share/doc/mymp3/`
    | `$HOME/.myeditor.conf` | `$HOME/Docs/` | |

    | Web 服务器 | `/usr/sbin/`, `/usr/bin/`, `/usr/lib/`, `/usr/share/doc/httpd/`, `/usr/share/doc/httpd/examples/`
    | `/etc/httpd/`, `/etc/httpd/instance1` | `/var/www/`, `/var/www/instance1` |
    `/var/log/httpd/`, `/var/log/httpd/instance2` |

    | 邮件服务器 | `/usr/sbin/`, `/usr/bin/`, `/usr/lib/`, `/usr/share/doc/mail/` | `/etc/mail/`,
    `/etc/mail/server.cf` | `/var/mail/`, `/var/spool/mail/` | `/var/log/mail/mail.log`
