    # Introduction


    Your average user does not know much the Linux operating system (OS) is the most
    used platform. It is suitable for gadgets like Smartphones, smart watches, fridges,
    washing machines, video game consoles, and DVRs. Linux can be used to host a site,
    build a protected file or e-mail server, diagnose another device you own and probably
    restore files that have crashed. NASA, Dell, IBM, and Hewlett-Packard also joined
    the Linux Shell. It was first created as a family expansion of UNIX''s different
    iterations. It is a free, open-source code and published by Linus Torvalds in
    October 1991\. Thanks to the open-source of Linux, the next generation of developers
