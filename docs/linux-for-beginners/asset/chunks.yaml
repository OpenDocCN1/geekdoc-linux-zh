  trans: '

    相反，Windows 在过去几年中接受了大量的广告。用户无疑被赋予退出的机会，但同样，智能注册表黑客行为显然是雷德蒙计划的一部分。Windows 可以监控用户活动，提供与
    Microsoft OneDrive 服务的同步，或学习如何改进 Cortana（微软的个人助手）。老实说，我不喜欢这些工具，因为它们太具有破坏性。或者，某些用户喜欢这些功能。这是一种谦逊的。


    # 源代码


    Linux 是一个活跃的操作系统，而 Windows OS 在商业上是可行的。Linux 可以访问源代码并根据用户的请求修改代码，而 Windows 无法访问源代码。


    在 Linux 中，用户能够访问内核源代码并根据自己的需要更改代码。它有自己的优势。操作系统中的漏洞将尽快修复，但如果存在漏洞，开发者可能会对操作系统应用任何缺陷。


    在 Windows 中，只有被选定的成员才允许访问源代码。


    # 许可证


    大多数情况下，Linux 内核（以及 GNU 资源和相关库）是免费且完全开源的。公司为他们的分发版提供付费支持，但生成的软件仍然可以下载和安装。


    ## 3.2 Linux 操作系统 vs Mac OS


    虽然 Linux 和 Mac 都是计算机硬件应用，但 Linux 是一个可以在任何设备上使用的开放操作系统，而 Mac 是一个只能在 Mac 设备上使用的操作系统。Linux
    作为应用程序、运行其他应用程序的平台以及服务器单元发挥作用。同时，Mac 是一个允许其他操作系统在其上运行的操作系统。


    ### Mac OS X vs. Linux：硬件支持


    Linux 和 Mac OS 两个系统在这一领域都很出色。由于 Mac OS 仅在苹果制造的硬件上使用，因此它提供了强大且集成良好的软件组合，以为您提供最高性能。


    至于 Linux，它有各种驱动支持软件。或者在此之前这是 Linux 无法提供的问题；不，相反，我应该说；硬件制造商没有为其硬件在 Linux 系统提供驱动支持。但现在情况变了。Linux
    是桌面或服务器设备上最广泛使用的操作系统。现在，所有主要的零售商在获得像 Mac OS 或 Windows OS 等其他应用程序后，都会为 Linux 发行版提供兼容的硬件驱动。


    ### Linux vs. Mac：目标用户群体


    如果你付得起钱并想要一个开箱即用的系统，那么我倾向于让你选择 Mac OS。这个应用将为你提供一个性能良好的漂亮酷炫的桌面环境。Mac OS 是初学者以及想要进行高质量音频编辑、视频录制和图形设计的高级用户的极佳选择。


    Linux 拥有两个目标用户群体。如果你是 Linux 世界的新手，请选择 Ubuntu、Linux Mint 或 Elementary OS，但如果你在寻找高质量或定制化的工作环境，请选择
    Arch Linux 或 Kali。此外，还有一个 `Terminal` 或命令行界面，它是进行任何技术专家水平工作的绝佳工具。


    ## 3.3 Linux 操作系统 vs. FreeBSD 操作系统


    FreeBSD 和 Linux 都是独立于其许可证的开源源码，并具有与 Unix 相同的环境。FreeBSD 在多年前在经过许多修改和更新后出现在 Unix
    操作系统中。否则，Linux 是从零开始开发的，作为 Unix 的替代品。Linux 和 FreeBSD 都拆分了文件管理类别。此外，它们都使用相同类型的
    Shell 站点作为主要的通信手段。除此之外，它们共享相似的 API 程序。由于各种相似性，Linux 和 FreeBSD 可以相互共享多个工具和应用程序。


    ### 许可证的差异


    - Linux 和 FreeBSD 之间的许可证差异是它们之间的主要区别之一。

    - 所有 Linux 发行版、Linux 内核、Linux 程序、基于 GNU 的应用都根据 `GNU General Public` 或 `GNU GPL`
    许可证授权。

    - `GNU GPL` 也称为“左拷贝”（copy-left）。


    事实上，`BSD` 许可证几乎与 `GNU GPL` 相同，但根据 `BSD` 许可证的作品不需要维护许可证的条款。


    - 任何人都可以轻松访问、共享或修改他们的源代码，而无需重写或修改修订后的源代码。

    - 必须包含原始的 `BSD` 许可证和版权证书，更新后的源代码是唯一的要求。

    - 每个许可证的成本完全取决于用户的需求和他们的哲学。

    - `GNU GPL` 许可证促进了开放自由的环境和共享。

    - 相关软件应小心依赖基于 GNU 的软件。


    另一方面，经 `BSD` 许可的软件可以轻松自由地安装在闭源软件上。


    - 这使得 BSD 软件对企业和开发者更有吸引力，他们希望通过直接销售存储其资源的软件来盈利。


    ### 基本区别


    - 程序的历史和谱系是 Linux 和 FreeBSD 之间的另一个主要区别。

    - Linus Torvalds 开发了 Linux 内核以取代 MINIX，后者在赫尔辛基大学被禁止进一步研究。

    - 随后，它将先进的 Linux 内核与来自 GNU 的多个组件集成，创建了一个类似于 Unix 的完整系统。

    - Linux 是完全从零升级的，没有使用来自现有 Unix 系统的任何东西。

    - Linux 在许多方面与 Unix 不同。


    另一方面，FreeBSD 与 Unix 应用有密切的关系。

    - Berkeley Software Distributions 或 `BSD` 是在加州大学伯尔克利分校开发的。

    - BSD 后来用完整的 `BSD` 许可证重写了所有原始许可证，该操作系统后来完全集成到所有其他开源渠道中。


    ## 3.4 Linux 的版本


    ### Gentoo


    Gentoo 是一个高度灵活的元发行版，允许用户使用字符认证和软件编辑。Gentoo 可以被定制。该项目由 Daniel Robbins 在 2000 年启动。尽管它提供了灵活性，但使用它需要技术。换句话说，这对于没有经验的用户来说不好，因为需要很多时间来适应。编译可能耗时。


    ### Arch Linux


    Arch Linux 由 Judd Vinet 于 2002 年发布。最初，它被认为是一个存在于中、高级用户之间的独立项目。后来，它通过一种被称为“滚动发布”（rolling-release）的设备得以提升。滚动发布意味着该应用具有保持更新的能力。Arch
    Linux 拥有优秀的软件管理基础设施。安装后可以从源代码安装软件。另一个误解是由于偶尔的不稳定性会导致恶化风险。


    ### Ubuntu


    Ubuntu 为桌面用户改变了 Linux 的个性。它长期以来非常闻名。它于 2000 年初发布，目前在 Linux 用户中仍然很流行。Ubuntu 基于
    `DEB` 包。它有 Canonical 的长期支持，并现在通过其自己的服务器类型支持业务。Ubuntu 的一些特殊功能包括实时 DVD，支持新使得，让新手可以轻松地使用
    Ubuntu 和不同的桌面环境。Ubuntu 面临的最重要问题之一是不兼容性。


    ### MX Linux


    MX Linux 作为 MEPIS Linux 站点引入的。这适用于个人和商业目的。MX Linux 最受欢迎的特点是它的图形化控制工具，被称为 `MX-Tools`。它还具有不同的平台支持、不同的图形驱动兼容性以及易于管理。与
    Mint 和 Ubuntu 相比，MX Linux 可能对新手没有那么友好。适应它的安装程序需要时间，某些工具看起来可能不同。


    ### Mint


