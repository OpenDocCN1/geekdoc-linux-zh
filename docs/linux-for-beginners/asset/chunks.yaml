    有很多不同的 Linux 发行版可以尝试，有些为低功耗电脑提供轻量级桌面，有些则拥有完整的桌面。我更倾向于 `Porteus Linux`。在过去的八年里，我每天都把它放在钥匙扣上，出差时作为我的主电脑平台，当工作或家里电脑出现问题时作为磁盘使用。它是一个可靠且稳定的应用程序，既有趣又易用。


    在 Mac 或 Windows 上，下载 `Fedora Media Writer` 工具可以为任何可下载的移动发行版创建可启动优 盘。


    ## 如何使用

    从第六个 USB 驱动器重启“Linux live”模式即可完成 Linux 发行版的运行。现在，虽然数据存储方式与你安装在硬盘上的系统略有不同，但其他一切符合你对
    Linux 桌面的预期。在你的便携式 Linux 系统上可以做的事情不多，所以请在你的钥匙扣里安装一个，以解锁你所遇到的每台电脑的全部威力。


    ## 在线之旅

    `Ubuntu` 的某人想出了一个棒的主意，可以在浏览器中托管 `Ubuntu GNOME` 桌面。要尝试一下，打开网络浏览器并导航到 `tour.ubuntu.com`。你可以自己选择想要展示的活动，也可以跳过单个课程并点击“个人”按钮。


    即使你是 Linux 桌面的新手，你可能发现自己的自我表达比你预想的要常见。通过互联网，你可以四处看看，看看有哪些可用程序，看看典型的 Linux 桌面是什么样子的。你无法调整设置或启动另一次
    `Firefox` 旅程，虽然你可以体验安装应用程序的步骤，但你无法引入它们。但如果你从未用过 Linux 桌面，并想看看这到底在忙什么，这将是一段奇妙的旅程。


    ### 如何使用

    在线之旅仅仅是一次旅程。如果你从未见过运行中的 Linux 桌面，这是一个直观感受体验的机会。它并非为敏感工作设计，而是一个吸引路路的精美展示。


    ## 使用 JavaScript 在浏览器中启动 Linux

    不久前，虚拟化被用于计算机调优，仅限于拥有高端硬件的用户。现在，由于人们做出的努力，已经达到了可以通过 JavaScript EMD 实现的程度，这要归功
    `Fabrice Bellard`，他是优秀的开源 `QEMU` 模拟机的制作者。


    之后，Bellard 启动了 `JSLinux` 项目，允许你在空闲时间在浏览器中使用 Linux 和其他应用程序。它仍然是一个试用版，但它是技术的奇迹。在
    `JSLinux` 页面打开网络浏览器，你就可以启动一个基于文本的 Linux shell 或一个小型的 Linux 环境。你可以向你的 `JSLinux`
    主机上传和下载文件，或者（理论上）将你的文件发送到网络备份，因为 `JSLinux` 通过 `VPN` 套接字访问互联网（速度取决于 `VPN` 服务）。


    ### 如何使用

    你短期内不会在 `JSLinux` 上进行任何严肃工作，而且该环境无疑是非寻常的，你可以学习更多关于 Linux 如何正常工作的知识。然而，如果你厌了在旧
    PC 上使用 Linux，并想在一个真正不同的平台上尝试 Linux，`JSLinux` 是独一二二的。


    ## 了解它

    并不是所有的 Linux 体验都发生在电脑上。也许你是那种喜欢远离、观察并在尝试任何新事物之前先做研究的人，也许你可能还不确定“Linux”到底是什么，又或许你喜欢完全沉浸其中。关于
    Linux 如何工作、使用 Linux 是什么体验以及 Linux 世界正在发生什么，有大量信息需要学习。


    当你熟悉了开源世界时，会更容易理解常识并区分城市传说与真实体验。我们会不定期发布书单，但我最喜欢的书籍之一是 `Hazel Russman` 的 `Charm
    of Linux`。这是一本由独立作者为了发现 Linux 的乐趣而编写的从许多不同角度出发的 Linux 之旅。


    ### 如何使用

    没有什么能比边读一本好书。这是一种获取 Linux 的小传统方法，但对于喜欢纸质书的人来说，它是既舒适又有效的。


    ## 获取树莓派

    如果你尝试使用 `Raspberry Pi`，你就是在使用 Linux。从 Linux 和低功耗电脑开始非常简单。`Pi` 的优点（如果没有它，成本远低于
    100 美元）在于它的官方网站是面向教育的。你可以学习所有关于 `Pi` 的功能，当你在那里时，一切都是关于 Linux 能为你做什么。


    ### 如何使用

    `Pi` 在设计上是一台低功耗电脑。这意味着你不能像以前那样做大量工作，但这是一个让你免于担忧的简单方法。`Raspberry Pi` 是学习 Linux
    及其所有可能的奇妙方式，也是体验环保、小型化、简化电脑威力的绝佳方式。务必密切关注 `Opensource.com` —— 特别是每年三月的 `Pi 周`
    —— 以获取技巧、技巧和有趣的活动。


    ## 进入容器船

    如果你在神话般的云时代之后工作，那么你一定听过容器的狂热。虽然你可以在 Windows、Azure、Mac 和 Linux 上使用 `Docker` 和 `Kubernetes`，但你可能不知道容器本身就是
    Linux。云计算和基础设施应用是部分运行、部分配备的最小 Linux 操作系统。当你启动容器时，你就引入了一个小型 Linux 发行版。


    容器与虚拟机或便携式服务器不同。它们旨在用作通用系统。然而，当你进入容器后，你可能想停下来观察一下。你会发现关于 Linux 系统是如何构建的、重要文件存储在哪里以及哪些是最常用命令的线索。你也可以在线尝试该工具，并在我关于
    Linux 容器组的文章中了解关于它们是如何工作的。


    ### 如何使用

    容器在设计上专注于一项任务，但它们是 Linux，所以它们非常灵活。你可以按照预期使用它们，也可以创建一个容器变成一个完整的系统用于你的 Linux 测试。这不是
    Linux 桌面体验，但它是一个功能完整的 Linux 体验。


    ## 作为虚拟机安装 Linux

    虚拟化是尝试运行程序的简易方法，而 `VirtualBox` 是一种很好的开源虚拟化方式。`VirtualBox` 适用于 Windows 和 Mac，因此你可以将
    Linux 安装为虚拟机 (VM) 并几乎像使用任何其他程序一样使用它。如果你不习惯安装应用程序，`VirtualBox` 也是一种非常安全的尝试 Linux
    的方式，无需默认在你的标准操作系统上安装。


    ### 如何使用

    作为虚拟机启动 Linux 简单易快捷；它可以作为当你需要 Linux 环境时的试用或其他重启方法。它功能齐全，并且因为它使用虚拟硬件，宿主机驱动驱动高效。将
    Linux 作为操作系统的唯一缺点基本上是心理上的。如果你尝试将 Linux 作为主操作系统，但最终除了 Linux 最指定的功能外都自动变成了宿主机操作系统，那么
    VM 就让你失望了。除外，VM 是现代技术的胜利，在 `VirtualBox` 中使用 Linux 让你拥有 Linux 提供的所有最佳功能。


