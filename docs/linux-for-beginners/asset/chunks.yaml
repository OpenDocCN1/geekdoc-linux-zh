    \ shell`、一个高级编程环境，以及一台性能良好且稳定的机器和一个 Linux 发行版，那将会有帮助。\n\n# 第 1 章：操作系统历史\n\n早期的计算机没有任何应用程序。运行在这些第一批计算机上的每个程序都要求输入运行计算机所需的所有代码、连接到连接的硬件并执行运行程序所要计算。这种情况使得即使是最简单的程序也变得复杂。\n\
    \n为了解决这个问题，计算机所有者开始开发系统软件，使能够编写并执行计算机程序，从而诞生了第一个应用程序。\n\n第一个操作系统是由通用汽车公司于 1956\
    \ 年使用一台 IBM 单机开发的。20 世纪 60 年中期，IBM 是第一个承担开发应用程序任务的计算机制造商，并开始分发安装在计算机上的应用程序。\n\n\
    现在，第一个操作系统开发于 1950 年，当时计算机一次只能运行一个程序。几十年后，计算机开始安装额外的软件程序（有时被称为库），它们汇在一起创造了现代应用程序的开端。\n\
    \n20 世纪 60 年中期，第一版本的 UNIX 应用被开发出来。它用 C 语言编写，并在早期是免费提供的。UNIX 很容易适应新程序，并迅速被广泛采用。\n\
    \n大多数现代操作系统，包括 Apple OS X 和所有不同的 Linux 版本，都追溯或依赖 Unix 操作系统。\n\n微软 Windows 的开发是为了响应\
