    \ 的替代品更好，因为你无法在上面找到合适的程序，尽管它提供了替代品，但并不会完全相同。毕竟，Photoshop 毕竟是 Photoshop。\n- 终结了吗？Linux\
    \ 是一项高级程序，允许你在其中执行大多数你喜欢的任何操作，而且它是免费的。事实上，你正在运行 Windows 或 Mac 的电脑上阅读这段文字，而它能持续是有可能的。\n\
    \n## 2.3 获取访问\n\n在 Linux 中，`access` 命令用于检查系统是否具有对指定文件的访问权限。它可以用于检查文件是否存在。检查是通过调用进程的实际\
    \ `UID` 和 `GID` 完成的。\n\n```c\nint access (const char * pathname, int mode);\n\
    ```\n\n在这里，第一个参数接收索引/文件的路径，第二个参数接收标志 `R_OK`、`W_OK`、`X_OK` 或 `F_OK`。\n\n- `F_OK`\
    \ 标志：用于检查文件是否存在。\n- `R_OK` 标志：用于小的读取权限检查。\n- `W_OK` 标志：用于小的写入权限检查。\n- `X_OK` 标志：用于检查临时权限。\n\
    \n注意：如果 `access()` 无法访问该文件，它将返回 `-1`，否则将返回 `0`。\n\n### 示例 1：F_OK 标志\n\nfilter_\
    \ 不存在\nlight_4\n\n```c\n#include <stdio.h>\n#include <unistd.h>\n#include <errno.h>\n\
    #include <sys / types.h>\n#include <sys / stat.h>\n#include <fcntl.h>\nextern\
    \ int errno;\n\nint main (int argc, const char * argv []) {\n    int fd = access\
    \ (\"sample.txt\", F_OK);\n    if (fd == -1) {\n            printf (\"Error Number:%\
    \ d \\ n\", errno);\n        error (\"Error Description:\");\n    }\n    other\n\
    \                print (\"No error \\ n\");\n    return 0;\n}\n```\n\n描述：在输出中，我们收到了这条消息“No\
    \ error”，因为文件在当前目录中。如果文件不存在，返回值将为 `-1`。在上面的代码中，我们能发现错误的唯一方法是文件不在指定的格式。如果路径过长，它也会给出错误。\n\
    \n注意：`perror()` 用于打印错误，`errno` 用于打印错误代码。\n\n### 示例 2：查看所有权限（读、写、执行）\n\nfilter_\
    \ 不存在\nlight_4\n\n```c\n#include <stdio.h>\n#include <unistd.h>\n#include <errno.h>\n\
    #include <sys / types.h>\n#include <sys / stat.h>\n#include <fcntl.h>\nextern\
    \ int errno;\n\nint main (int argc, const char * argv []) {\n    int fd = access\
    \ (\"sample.txt\", (R_OK | W_OK) & X_OK);\n    if (fd == -1) {\n        printf\
    \ (\"Error Number:% d \\ n\", errno);\n        error (\"Error Description:\");\n\
    \    }\n    other {\n        print (\"No error \\ n\");\n    }\n    return 0;\n\
    }\n```\n\n定义：设置了用户许可权限的输出、写入和使用，由于我们在测试情况 `(R_OK | W_OK) & X_OK`，我们发现没有错误。文件描述值为\
    \ `0`。我们可以使用位运算函数来确定访问 `system()` 调用 `system` 时的模式冲突。\n\n### 示例 3：查看所有权限（读、写、执行）以显示当发现错误时代码如何工作\n\
    \nfilter_ 不存在\nlight_4\n\n```c\n#include <stdio.h>\n#include <unistd.h>\n#include\
    \ <errno.h>\n#include <sys / types.h>\n#include <sys / stat.h>\n#include <fcntl.h>\n\
    extern int errno;\n\nint main (int argc, const char * argv []) {\n    int fd =\
    \ access (\"sample.txt\", R_OK & W_OK & X_OK);\n    if (fd == -1) {\n        printf\
    \ (\"Error Number:% d \\ n\", errno);\n        error (\"Error Description:\");\n\
    \    }\n    other {\n        print (\"No error \\ n\");\n    }\n    return 0;\n\
    }\n```\n\n在这里，`fd = -1`，由于调用进程失败，我们收到了一条错误消息。\n\n# 第 3 章：Linux 与主流操作系统及 Linux\
    \ 版本的比较\n\n## 3.1 Linux 操作系统 vs Windows 操作系统\n\n### Linux vs Windows\n\n#### 用户\n\
    Linux 上有三种用户（普通用户、管理员 (root) 和服务用户），而 Windows 有四种类型的用户账户（管理员、标准用户、儿童和访客）。\n\n\
    #### 使用\n根据市场研究数据，全球 92.63% 的 PC 运行着 Windows，而至少有 1% 的 PC 用户在使用 Linux。许多用户说，与\
    \ Windows 相比，Linux 很难使用，因此 Linux 的抱怨限于家庭使用。它旨在作为服务器程序进行深度使用。因此，无论是否有 GUI，组织服务器都运行在\
    \ Linux 上。\n\n此外，得益于微软的许可协议，各种 PC 厂商都有权将 Windows 操作系统集成到他们的 PC 中，使 Windows 在市场普及率上超过\
    \ Linux。尽管如今戴尔和惠普等许多 PC 厂商已开始提供 Linux 作为预装操作系统，但 Windows 仍然主导市场。\n\n#### 内核\n\
    Linux 使用单内核，空间利用更高效，而 Windows 使用微内核，占用的空间较小，但系统效率低于 Linux。\n\n#### 文件程序\n在微软 Windows\
    \ 中，文件存储在不同数据驱动器（如 `C:`、`D:`、`E:`）的目录/文件夹中；但在 Linux 上，从根目录开始的树形结构中的单级文件没有其他的子记录。\n\
    \n在 Linux 操作系统中，一切都被视为文件。引用是文件、目录以及外部连接设备（如打印机、鼠标、键盘），它们也是文件。\n\n#### 安全\n每个 Windows\
    \ 用户不时都会遇到安全和稳定性问题。由于 Microsoft Windows 是最常用的操作系统，黑客和垃圾邮件经常针对 Windows。Windows（消费型）最初设计用于在没有网络连接的单用户\
    \ PC 上轻松使用，且没有内置的安全功能。微软经常通过 Windows 更新服务移除漏洞。该服务通常每月发布一次，或者在需要时发布。\n\n大多数时候，Windows\
    \ 用户会遇到蓝屏（BLUE SCREEN OF DEATH）。这是由于系统无响应导致的。最后，用户必须手动重启电脑。\n\n相比之下，Linux 基于多用户构建，这使其比\
    \ Windows 这样的单用户操作系统更稳定。由于 Linux 由全球开发者进行标准监控，任何新提出的问题可以在几小时内解决，并提供所需的资源池。\n\n"
