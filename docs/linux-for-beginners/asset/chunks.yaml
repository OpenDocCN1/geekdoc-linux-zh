    为了让流程和你的生活变得简单一点，我们将重新启动 `xload` 程序，但这次我们将将其放在后台运行，以便提示符返回。为了做到这一点，我们如下所示运行 `xload`：


    ```

    >>> [me @ linuxbox me] $ xload &

    >>> [1] 1223

    >>> [me @ linuxbox me] $

    ```


    在这种情况下，信息返回了，因为该进程被留在了后台。


    现在想象一下我们忘记使用 `&` 符号将程序放在后台了。仍然有希望。我们可以输入 `Ctrl-z`，进程将会停止。我们可以通过观察程序窗口是否已冻结来确认这一进程。进程仍然存在，但它不再工作了。要在后台启动该进程，请输入
    `bg` 命令（background 的缩写）。这里是一个示例：


    ```

    >>> [me @ linuxbox me] $ xload

    >>> [2] + Paused xload

    >>> [me @ linuxbox me] $ bg

    >>> [2] + xload &

    ```


    ## 进程列表


    既然我们已经在后台运行了进程，那么显示我们已启动的进程列表可能会有所帮助。为了做到这一点，我们可以使用函数命令，或者更强大的 `ps` 命令。


    ```

    >>> [me @ linuxbox me] $ jobs

    >>> [1] + Launch xload &

    >>> [me @ linuxbox me] $ ps

    >>>PID TTY TIME CMD

    >>>1211 pts / 4 00:00:00 bash

    >>>1246 pts / 4 00:00:00 xload

    >>>1247 pts / 4 00:00:00 ps

    >>> [me @ linuxbox me] $

    ```


    ## 杀死进程


    假设我们有一个无响应的计划；我们如何移除它呢？当然，我们使用杀进程命令。让我们在 `xload` 上尝试一下。首先，我们需要识别想要杀掉的进程。我们可以使用函数或
    `ps` 来做到。如果我们使用 `jobs`，我们将获得作业号。如果使用 `ps`，我们将获得一个进程 ID (`PID`)。我们将两种方法都尝试一遍：


    ```

    >>> [me @ linuxbox me] $ xload &

    >>> [1] 1292

    >>> [me @ linuxbox me] $ jobs

    >>> [1] + Launch xload &

    >>> [me @ linuxbox me] $ kill% 1

    >>> [me @ linuxbox me] $ xload &

    >>> [2] 1293

    >>> [1] xload terminated

    >>> [me @ linuxbox me] $ ps

    >>> PID TTY TIME CMD

    >>>> 1280 pts / 5 00:00:00 bash

    >>> 1293 pts / 5 00:00:00 xload

    >>> 1294 pts / 5 00:00:00 ps

    >>> [me @ linuxbox me] $ kill 1293

    >>> [2] + Xload disconnected

    >>> [me @ linuxbox me] $

    ```


    ## 5.3 用户切换及替代方案激活说明


    `su`（substitute 或 switch user 的缩写）工具允许你使用另一个用户的权限运行命令，通常是 root 用户。


    使用 `su` 是为当前登录会话切换到管理员账户的简单方法。当 root 用户被允许使用 `ssh` 或 GUI 显示器管理器进入系统时，这特别有用。


    ### 如何使用 su 命令 `$su`


    该命令的标准语法如下所示：


    ```

    $ su [OPTIONS] [USER [CONFLICT ...]]

    ```


    当在没有选项的情况下请求时，策略默认字符是使用交互式 shell 作为 root：


    ```

    $ su

    ```


    你将收到通知，要求输入 root 密码，一旦确认，临时使用该命令的用户将变为 root。


    会话 shell (`SHELL`) 和本地主目录 (`HOME`) 被设置为用户登录时的 `/etc/passwd`，且当前目录没有更改。


    要验证用户是否已更改，请使用 `whoami` 命令：


    ```

    whoami

    ```


    该命令将打印执行当前 Shell 会话的用户：


    ```

    root

    ```


    请求 `su` 时最常用的选项是 `-`、`-l`、`--login`。这使得 shell 成为登录 shell，其位置与实际登录非常相似，并改变当前目录：


    ```

    su -

    ```


    如果你想使用而不是 `passwd` 文件中指定的 shell，请使用 `-s`、`-shell` 选项。例如，切换到 root 并使用 `zsh` Shell，你可以写：


    ```

    su -s /usr/bin/zsh

    ```


    为了保存整个环境（`HOME`、`SHELL`、`USER` 和 `LOGNAME`）供用户使用，使用选项 `-p`、`--preserve-environment`。


    ```

    su -p

    ```


    当应用选项 `-p` 时会被忽略。


    如果你想在不启动协作 shell 的情况下作为替代用户运行命令，使用选项 `-c`、`--command`。例如，以 root 身份请求 `ps` 命令，你可以输入：


    ```

    su -c ps

    ```


    要切换到另一个用户账户，将用户名作为参数传递给他。例如，切换到一个用户配置，你可以输入：


    ```

    su dictatorship

    ```


    ### Sudo vs Su


    在某些 Linux 发行版（如 Ubuntu）中，出于安全考虑，root 用户账户被自动禁用。这意味着 root 没有设置密码，你无法使用 root 切换。


    切换到 root 的方法之一是配置 `Sudo` 命令并输入用户的当前登录密码：


    ```

    sudo su -

    ```


    `sudo` 命令允许你以另一个用户（通常是 root）的身份运行程序。


    如果用户被赋予了 `sudo` 权限，执行 `su` 命令将以 root 身份提示。运行 `sudo su -` 并使用用户密码等同于使用 root 密码运行
    `su -`。


    当与选项 `-i` 配合使用时，`sudo` 使用一个与 root 用户环境兼容的登录：


    ```

    sudo -i

    ```


    ### Sudo -i 基本上与执行 su - 相同


    使用 `sudo` 替代 `su` 的优势是不需要在多个用户账户之间共享 root 密码。


    # 结论


    我希望这本书能教你信任如何使用 Linux，将其下载到你的电脑上并为它设计你的程序。


    我希望这本书也能作为选择合适的 Linux 发行版的工具，帮助你完成日常编程任务并满足你的需求。读完这本书后，你应该已经学会了如何在 Linux 中使用命令行，并学会了保持机器安全的几个步骤。


    尽管 Linux 没有 Windows 那么流行——至少对某些人来说如此——但 Linux 可能是最稳定的操作系统之一——它非常棒的一点是它是免费的，所以你不需要付钱获取它，你不需要因为付不起正版费用而选择那些虚假的操作系统。


