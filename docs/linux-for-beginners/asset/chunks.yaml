    ## 4.2 Getting the Connectivity with Linux


    The Remote Desktop, "is a software or application feature that allows your computer
    desktop environment to work remotely on a single system (usually a PC, but the
    concept works seamlessly on a server) while being shown to separate client device."


    If you want to see it in a different manner, a remote desktop is used to access
    a working environment on another computer. For example, the ManageIQ / Integration
    test repo (PR) test program exposes the Virtual Network Computing (VNC) connecting
    hole so that I can remotely detect my PR tested in real-time. Remote desktops
    are used to help customers solve computer problems: with the client''s permission,
    you can set up a VNC connection or Remote Desktop Protocol (RDP) to identify or
    access a shared computer to solve a problem or fix a problem.


    These connections are made using remote desktop connectivity software, and there
