    Linux Mint 于 2006 年发布，基于 Ubuntu 开发。该发行版最适合初学者。Mint 拥有多种增强功能，使其易于使用，并与其他应用程序交互。因此，它不仅适用于个人使用，也适用于商业用途。开发者提供三种类型的发布版本，即正式版（12
    月）、点版本（根据需要，例如修复性错误）和每月总结版。这使得 Mint 更加稳定。


    ## 回到 Kali


    还有其他专门为系统安全和访问设计的 Linux 程序。Kali Linux 是目前最流行的登录测试平台。这一切始于从 WHAX 集成创建的 BackTrack（WHAX
    是一种基于 Linux 的 Slax 发行版，其后的公司是 Offensive Security。WHAX 的之前的版本基于 Knoppix，称为 `Whoppix`）。`BackTrack
    5` 基于 `Ubuntu Lucid LTS`，支持带有 ARM 的 32 位和 64 位格式。


    2013 年，该公司基于 Debian 重建了该平台，并以 `Kali` 的命名发布。


    `Kali Linux` 非常稳定，功能强大，并拥有一套先进的高级入门测试工具。


    # 第 4 章：开启 Linux 之门学习 Linux 有许多理由。`Linux` 是一个基于 UNIX 的操作系统。


    作为一名专业人士，你一定会从 `Linux` 中受益。让我们下面列出学习 Linux 的理由。


    ### 学习很有趣


    阅读 `Linux` 非常有趣。如果你学到了新知识，你不会感到惊讶。如果你充满好奇心且性格有趣，你将会喜欢它提供的一切！


    ### 节省钱包省钱


    `Linux` 是一个使用开源的高效系统。这意味着你不需要为它支付任何费用，不像 Windows 或任何其他付费应用。


    ### 一切只需下载 Linux 并开始


    你只需要一台可以运行 `Linux` 的机器。它甚至可以在旧电脑上运行。由于不需要操作系统本身的费用，你无需为应用程序付费。`Linux` 生态系统非常棒，你可以获取实现你想做的任何事情的程序！如果你正在使用
    `Linux`，你可能不需要购买任何软件。


    开发者热爱 `Linux`。通过 `Linux`，他们找到了一个尝试新事物的游乐场。


    ### 支持所有主流编辑语言


    在软件开发和部署方面，许多公司将 `Linux` 作为主操作系统。这意味着作为学生，你需要通过专业工作来学习 `Linux`。


    ### 提高职场成功率


    由于 `Linux` 被认为是理想的开发操作系统，它增加了你提升工作效率的机会。在软件开发公司中，`Linux` 具备所需能力是常有的。如果你精通 `Linux`，你作为工程师一定会获得更多机会。


    ### 教会他人


    即使在 2019 年，我们仍然非常需要能够为学生知识增值的项目。这就是你获得分享知识的机会。在教育生态系统中，你可以探索接触中级 `Linux` 学生的可性。我们的创作者计划允许你同时进行分享和学习。


    ## 4.1 获取访问


    以下是进入 `Linux` 的前十种方法。


    ### 加入免费 Shell


    有很多使用 `Linux` 的人拥有的 `Linux` 服务器多到他们不知道该怎么做（记住，“Linux 服务器”可以是从最新的电脑到使用了 12 年的废弃笔记本电脑的任何设备）。为了充分利用大多数计算机，许多管理员开放他们的安全箱以获取免费的
    Shell 账号。


    如果你愿意花时间在 `Linux` 终端阅读指令、使用 Shell、`C++` 和 Web 开发基础进行编写，那么免费的 Shell 账号是一个简单、廉价的入门方式。这里有一个尝试的列表：


    * `Freehell.de`


    `Freeshell.de` 是一个自 2002 年以来一直在线的 `Linux` 公共访问方法。你可以访问 `SSH`（尝试 Linux shell）、`IPv6`
    和 `OpenSSL`，并请求 `MySQL` 数据库。


    * `Blinkenshell`


    `Blinkenshell` 提供一个 `Linux` shell 用于阅读 Unix、使用 `IRC`、托管简单网站和共享文件。它自 2006 年以来一直在线。


    ### SDF 社区访问


    现在如你所知，Unix 系统建立于 1987 年底，提供免费的 `NetBSD` 账号。当然，`NetBSD` 不是 `Linux`，但它是开源 Unix，所以提供了相同的感受。它在家里也有很多应用，因此模糊了老派
    BBS 和免费旧 Shell 之间的界限。


    免费 Shell 账号经常受到骚扰，所以你表现出的忠诚度和参与小组活动的意愿越高，了解得越多。你通常可以在数据库搜索引擎、编译器和高级编程语言中获得访问（通过特殊请求或小额捐赠表示兴趣）。你也可以请求安装额外的软件或库，须经管理员批准。


    #### 如何使用


    公共访问 Shell 账号是尝试真实 `Linux` 系统的完美方式。没有 `root` 权限意味着你已经学会了管理自己的软件，而不需要修剪草坪或修理漏水龙头。你只需要做足够现实的工作来让它们完成实际工作，尽管它们并不诚实到去批评这项工作。


    ### 通过 WSL 2 在 Windows 上尝试 Linux


    信不由信，微软从 2019 年 6 月开始开始在 Windows 上分发 `Linux`，这意味着你可以从 Windows 使用 `Linux` 程序，作为
    Windows Linux 子系统 (`WSL 2`) 的第二个副本。虽然这主要针对开发者，但 Windows 用户可以在标准桌面控制台中无意识地通过额外资源将
    `WSL 2` 进入 Linux 。这是你 Windows 机器的 Linux 操作系统。同时，它仍然是一个新阶段且正在进行工作中，因此可能会发生变化。如果你尝试推得太远，可能会遇到一个
    Bug，但如果你只是想开始学习 `Linux`、读一些指令并感觉想在文本环境中完成敏感工作，`WSL 2` 可能正是你需要的。


    #### 如何使用


    `WSL` 没有明确的路径或目的，但为你的 Windows 机器提供了 Linux 环境。你获得了 `root` 权限，并可以使用 `Linux` 发行版和应用程序，因此是一种简单无缝的学习方式。然而，尽管
    `WSL` 是 `Linux`，但它并不是 Linux 的标准。`Linux` 是 Windows 提供的，你不可能在现实世界中体验它。`WSL` 是一个开发和教育工具，但如果可用，你应该使用它。


    ### 在可启动 U 盘上下载 Linux


    在 U U 盘上安装 `Linux`，无论你走到哪里，都可以从该 盘启动你遇到的任何电脑。你获得了一个自定义的 `Linux` 桌面，不需要担心下载它的主机电脑上的细节。电脑不会影响你的
    `Linux` 操作系统，你的 `Linux` 操作系统也不会影响电脑。适用于酒店商务中心、图书馆、学校的公共计算机，或者只是为了给自己找个理由偶尔开始学习
    `Linux`。


    与许多进入 Linux shell 的快速快捷方法不同，这种方法为你提供了一个完整且健壮的 `Linux` 系统，配备桌面、对任何所需软件的访问以及持久性数据存储。


    系统不会改变。你想要存储的任何数据都会在压缩文件系统中加密，并在启动时作为系统的备份。这种灵活性允许你选择如何以持久模式启动（将所有数据保存回 U 盘），或以瞬态模式启动（这样一旦精疲力竭，你所做的一切都会消失）。

