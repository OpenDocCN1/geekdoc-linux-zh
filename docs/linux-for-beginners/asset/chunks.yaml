    ## 删除目录


    我们创建了很多垃圾，需要移除一些我们创建的残留目录。


    使用我们用于删除字段的标准 `rm` 命令将带给我们以下结果：


    ```bash

    >>> [roots @ fosslinux ~] #rm remains

    rm: can''t remove `foss'': Is a directory

    ```


    要删除或移除它，我们需要尝试 `-r` 选项，`r` 代表递归（repeat）。如果我们尝试的话，就会成功。


    ```bash

    >>> [roots @ fosslinux ~] #rm -r foss /

    rm: delete directory `foss''? Y

    ```


    成功删除了空目录。如果它内部包含某些内容、文件或引用，那就是另一回事了。让我们在 `foss1` 目录下创建一个文件和目录。


    ```bash

    >>> [roots @ fosslinux ~] # mkdir foss1 / test_dir

    >>> [roots @ fosslinux ~] # touch foss1 / test_file

    ```


    这是一个示例，但你正在尝试删除的目录树可能包含成百上千个文件或文件夹。


    如果我们需要删除所有它们，而不需要花费整天时间去验证，我们使用 `-f` 作为函数参数。


