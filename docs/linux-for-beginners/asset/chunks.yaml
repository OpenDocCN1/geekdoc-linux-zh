    streaming. Now, Apple iOS and Google Android are examples of mobile apps.


    ### Embedded OS


    Not all computer devices are standard. Dozens of dedicated devices - including
    home-based digital assistants, automated reporting machines (ATMs), aircraft systems,
    sales terminals (POS), and Internet of Things (IoT) devices - including computers
    in need of an application. The big difference is that the compatible computing
    device does one big thing, so the OS is very fragile and dedicated to both performance
    and durability. The OS must be fast, uncluttered, and handle all bugs kindly in
    order to continue working in all conditions. In most cases, the OS is delivered
    to a chip installed on the basic device. If a medical device is to be used in
    a patient''s life support system, for example, will use an embedded OS that must
    operate reliably to keep the patient alive. Relating to this example, Embedded
    Linux is one example of an embedded Operating System.


    ### Network OS


    Network operating system (NOS) is another special OS that aims to facilitate communication
    between devices running on a local area network (LAN). The NOS provides the communication
    stack needed to understand network agreements in order to form, exchange, and
    decompose network packets. Today, the concept of a special NOS no longer works
    because some types of OS are more sensitive to network connectivity. Windows 10
    and Windows Server 2019, for example, incorporate complete communication capabilities.
    The NOS concept is still used by other communication devices, such as routers,
    switches, and fire extinguishers, and manufacturers can use related NOSes, including
    Cisco Internetwork Operating System (IOS), RouterOS, and ZyNOS.


    ### Real-Time OS


    When a computer device must interact with the real world within continuous and
    recurring time constraints, the device maker may choose to use a real-time application
    (RTOS). For example, an industrial control system can regulate the operation of
    a fertile factory or power station. Such a center would produce signals from multiple
    sensors and send signals to use valves, actuators, motors, and countless other
    devices. In these cases, the industrial control system must respond quickly and
    speculatively when it changes real-world conditions; otherwise, disaster could
    strike. RTOS should work without billing, processing latencies, and other delays,
    which are perfectly acceptable for some types of applications. Two examples of
    RTOS include FreeRTOS and VxWorks.


    The differences between the app types are incomplete, and some operating systems
    may share others'' features. For example, programs that run for a common purpose
    often incorporate the network capabilities found in a traditional NOS. Similarly,
    embedded applications often incorporate RTOS features, while the mobile application
    can still run multiple applications simultaneously like other standard operating
    systems.


    ## 1.2 Systems on IBM Hardware


    The IBM PureApplication System is a cloud-based computer program, with integrated
    hardware and software for deploying and performing tasks in the cloud - in other
    words, everything a business data center needs to add to a private cloud environment.


    This section of the book, which deals specifically with the IBM PureApplication
    System v1.1 software, describes the second generation hardware system''s changes.
    It is accompanied by a group of previously published articles that explain together
    the basics of hardware and software PureApplication System that provides application
    load management software. These topics include:


    ### Computer Hardware


    Hardware visit to IBM PureApplication System describes hardware installed inside
    the PureApplication System. This current article expands on the first detailed
    second-generation hardware. It does not define all hardware in the system but
    instead focuses on changes from the first generation.


    ### Modified Computer Hardware


    Good practices for using infrastructure as a service in IBM PureApplication System
    explain how the PureApplication System enables its hardware to use infrastructure
    (IaaS).


    ### The Nature of the Cloud System


    Managing the IBM PureApplication System''s time management areas explains how
    you can design a cloud environment with loads of work, built into the well-designed
    hardware of the PureApplication System.


    ### Headlines


    The second-generation hardware system was detected in June 2014\. Now, here is
    the major difference between this new generations:


    • Second-generation hardware introduces new families to two buildings:


    • W2500 (Intel®)


    • W2700 (Power ®)


    • The Enterprise system now has two chassis, not three, 384 cores.


    • In W2700, IBM PureFlex® System Manager is now visible and serving as a service
    to PureSystems® Manager


    • The Mini system is now mounted on a 42U long rack, not a 25U short rack, and
    currently has one chassis.


    • A second-generation computer node contains twice as much memory as its first
    generation.'
