- fmt: '

    In the late 1900s Thompson and Ritchie wanted to use `Unix` on a machine much
    larger than `PDP-7`, and they sold out the promise to add `Unix` text processing
    power to another financial aid from Bell, encoding the `PDP-11/20` machine code.
    So for the first time in 1970, the active `Unix` system was officially launched
    and implemented in `PDP-11/20`. Added a text developing program called `roff`
    and text editor. All three are written in the `PDP-11/20` conference language.
    Bell Labs used this first "text processing" program, developed by `Unix`, `Roff`,
    and the editor, in patent applications'' text processing. `Roff` soon turned into
    a `troff`, the first electronic publishing system with full editing capabilities.


    In 1972, `Unix` was rewritten in the C-programming language, in contrast to the
    common perception at the time that "nothing is complex as an app, which had to
    deal with critical periodic events, had to be written only in assembly language"
    (although `Unix` was not the first OS, written in the high-level language, has
    been the `Burroughs B5000` since 1961). Language `C` was developed by Ritchie
    as an improved version of `B` language, developed by Thompson as a `BCPL` translation
    from Martin Richards. The migration of assembly language to higher `C` language
    has resulted in portable software, requiring only a small amount of machine-based
    code to be replaced when `Unix` is installed on other computer platforms.


    AT&T has made `Unix` available to universities and commercial firms, as well as
    to the United States government, under license. Licenses include all source code,
    including machine-based parts of the canister, which were written with the `PDP-11`
    assembly code. Copies of the specified `Unix` kernel sources were widely distributed
    in the late 1970''s in the form of a hard copy, which led to the widespread use
    of `Unix` as an educational model. At one point, `ARPA` (Advanced Research Projects
    Agency) adopted `Unix` as the `Arpanet` (pre-Internet) community''s official language.


    In the late 1970s and early 1980s, `Unix`''s influence on academic circles led
    to `Unix`s widespread acceptance (especially the `BSD` version, from the University
    of California, Berkeley) with many commercial initiatives, for example, `Solaris`,
    `HP-UX`, and `AIX`. Today, in addition to `Unix`-certified programs like the ones
    already mentioned, `Unix`-powered programs such as `Linux` and `BSD` generations
    (`FreeBSD`, `NetBSD`, and `OpenBSD`) are often encountered.


    ### Linux OS


    `Unix` is one of the world''s most active programs due to its large distribution
    and distribution base. It was originally developed as a multi-use system for minicomputers
    and mainframes in the mid-1970s. It has since become one of the most widely used
    apps anywhere, with the exception of the sometimes confusing visual interface
    and a lack of intermediate suspension.


    The real reason for `Unix`''s popularity? Many hackers feel that `Unix` is the
    Three Thing — the One True Operating System. Therefore, `Linux`''s development
    is a growing group of `Unix` hackers who want to get their hands dirty with their
    system.


    `Unix` versions are available in many programs, from personal computers to larger
    computers like `Cray Y-MP`. Many `Unix` versions of your computers are very expensive
    and complicated. At the time of this, the `ATM T''s System V 386` single-engine
    version costs around `$ US1500`.


    `Linux` is a widely distributed version of `Unix`, first developed by `Linus Torvalds`,
    who began working on `Linux` in early 1990 as a student at the University of Helsinki
    in Finland. Linus now operates the `Transmeta Corporation`, starting in Santa
    Clara, California, and maintains the `Linux` kernel, the lowest-end component
    of the application.


    `Linus` has released the first version of `Linux` for free on the Internet, unintentionally
    introducing one of the biggest software upgrades of all time. Today, `Linux` has
    been written and maintained by a team of several thousand developers (if not all
    of them) working freely across the Internet. Companies have come to provide `Linux`
    support, packaging it into an easy-to-install distribution, and selling pre-installed
    workstations and `Linux` software. In March 1999, the `Linux World Expo`''s first
    commercial show was held in San Jose, California, where more than 12,000 people
    were reported. Most estimates put the number of `Linux` users worldwide at around
    10 million marks (and expect this number to look small while reading this).


    Encouraged by `Andrew Tanenbaum''''s Minix` app (another free `Unix` for PC -
    though very simple), `Linux` started out as a class project where Linus wanted
    to build a simple `Unix` program that could work on PC based on `386`. The first
    conversations about `Linux` were in the Usenet `comp.os.minix` newsgroup. The
    discussions were a major concern for the development of the `Unix` mini-curriculum
    for `Minix` users who want more.


    `Linux`''s early development focused mainly on the switching features of the `80386`
    protected interface, all written with assembly code. Linus writes:


    ```

    After that, it was a clear ship: installing fur codes still, but I had some devices,
    and fixing the error was easy. I started using C, and C++ at this stage, and it
    really accelerates progress. That was the time when I aimed to get started to
    get serious about my megalomaniac ideas for making "Minix better than Minix."
    I was hoping to be able to re-collect GCC under Linux one day.

    ```


    Two months of basic setup, but only for a long time until I had a driver for the
    disc (it was buggy, but it happened to work on my machine) and a small file system.
    That was when I made `0.01` available [late August of 1991]: you were ugly, you
    didn''t have a floppy driver, and you couldn''t do much. I don''t think anyone
    ever compiled that version. But by then, I lost hope, and I didn''t want to give
    up until I could pull out the `Minix`.


    No announcement has been made about `Linux Version 0.01`. `0.01` sources were
    not even usable: they only contained empty kernel source elements and assumed
    that you had access to the `Minix` machine to integrate them.


    It was October 5, 1991, Linus announced the first "official" version of `Linux`,
    a version of `0.02`. During this time, Linus was able to use `bash` (GNU Bourne
    Again Shell) and `GCC` (GNU C compiler), but not much else worked. Also, this
    was intended as a hacker program. The main focus was on kernel development; no
    user support issues, documents, distributions, etc. have ever been discussed.
    Today, the situation is very different — the real excitement in the `Linux` world
    is dealing with sites with user images, easy-to-distribute distribution packages,
    and advanced applications such as graphics and production facilities.


    After Version `0.03`, Linus hit the version number to `0.10`, as more people started
    working on the system. After several revisions, Linus increased the version number
    to `0.95`, indicating his expectation that the system was ready for a "official"
    release soon. (Normally, the software is not given a version number 1.0 until
    it is completely finished or has no bugs.) This was in March 1992. About 1.5 years
    later, at the end of December 1993, the `Linux` kernel was in Version `0.99.pl14`
    - almost unmarked at `1.0`. Type `1.0` appeared in March 1994. At the time of
    that writing (1999), the kernel''s current version is `2.2.6`, and `2.3` kernel
    versions are simultaneous.


    `Linux` would not have been possible without `GNU` tools developed by the Free
    Software Foundation. Their `GCC` compiler, which we will discuss in the next chapters
    how they gave life to Linus Torvalds code. `GNU` tools are linked to `Linux` construction
    from scratch. Due to these tools'' critical contributions, the Free Software Foundation
    even requested that the distribution of `Linux` and related resources be called
    `Linux / GNU`.

