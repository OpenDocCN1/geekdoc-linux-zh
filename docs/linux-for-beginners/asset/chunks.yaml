    ## 1.3 Mainframe Operating Systems


    ### Microsoft Windows


    `Microsoft Windows`, also known as `Windows` and `Windows OS`, is a computer operating
    system (OS) developed by Microsoft Corporation to run your computers (PCs). Incorporating
    the first graphical interface (GUI) for IBM compatible PCs, `Windows OS` soon
    dominated the PC market. About 90 percent of PCs use some form of `Windows`.


    The first version of the `Windows` was released in midd 1980s, was simply a GUI
    offered as an extension of Microsoft''s existing disk system, or `MS-DOS`. Based
    on the part of the licensed concept Apple Inc. used for its Macintosh System Software,
    `Windows` initially allowed DOS users to visually navigate the visible desktop,
    opening "windows" with graphic displays of electronic folders and files at the
    click of a mouse button, instead of typing instructions and directions with a
    quick text.


    Subsequent versions introduced the great performance, including `Windows` file
    manager, `Program Manager`, and `Printer Manager Programs`, as well as a powerful
    visual interface. Microsoft has also developed special `Windows` packages, including
    `Windows` networkable Workgroups and powerful `Windows NT` for businesses. Consumer
    release in 1995 `Windows 95` is fully integrated with `Windows` and `DOS` and
    offers built-in Internet support, including World Wide Web browser `Internet Explorer`.


    On the release of `XP` in 2001, Microsoft integrated its various `Windows` packages
    under a single banner, offering multiple applications to consumers, businesses,
    multimedia developers, and others. `Windows XP` has left the `Windows 95` kernel
    used for long-term use (the main software code) to be used for more powerful code
    and provide a more user-friendly interface and improve memory control and management.
    The most successful `XP` standard was achieved in late 2006 by `Windows Vista`,
    which received problematic releases and met with strong opposition in the market,
    quickly gaining a reputation for being a large, slow, resource-intensive system.
    Responding to the disappointing `Vista` discovery rate, Microsoft in 2009 released
    `Windows 7`, an OS with a virtual interface like that of `Vista` but was enthusiastically
    met with its significant speed improvements and its modest programming requirements.


    `Windows 8` in 2012 provided the first screen with applications that look like
    a grid on the grid and the ability to sync settings so users can log in to another
    `Windows 8` device and use their favorite settings. In 2015 Microsoft released
    `Windows 10`, which came with `Cortana`, a digital personal assistant like Apple''s
    `Siri`, and the `Microsoft Edge` Web browser, which replaced `Internet Explorer`.
    Microsoft has also announced that `Windows 10` will be the latest version of `Windows`,
    which means users will receive regular updates to the OS, but no further updates
    will be made.


    ### Mac OS


    `Mac OS`, an an operating system (OS) developed by the American computer company
    Apple Inc. The OS was introduced in 1984 to use the company''s Macintosh line
    of computers (PCs). `Macintosh` has announced the era of graphical user interface
    (GUI) programs and has inspired Microsoft Corporation to build its own GUI, `Windows
    OS`.


    Apple''s marketing of the `Macintosh` launch is very much focused on its precise
    performance of the app. Unlike all other PCs of the time, the `Mac OS` (formerly
    known as `Software Development`, with a version number installed) was clearly
    based. Instead of typing instructions and directions in text commands, users move
    the mouse pointer to navigate visually in the `Finder` - a series of folders and
    visual files, represented by thumbnails. Most computer applications eventually
    adopt the GUI model. In the 1980s, Apple made an agreement that allowed Microsoft
    to use certain Mac interface features on early `Windows` versions. However, with
    the exception of a long period in the 1990s, the `Mac OS` has never been licensed
    for use with computers manufactured by manufacturers other than Apple.


    Later the release of `Mac OS` introduced features such as Internet file sharing,
    network browsing, and multiple user accounts. In 1996 Apple acquired a rival to
    `NEXT` Computers, founded by Steven Jobs after he left Apple, and in 2001 the
    company released `Mac OS X`, a major redesign based on the `NextStep` program
    and Apple''s latest OS release. The `OS X` operated on the `UNIX` kernel (software
    core code) and provided technological advances such as memory protection and multitasking,
    as well as an easy-to-use `Finder`, an attractive interface called `Aqua`, and
    a simple "Dock" launch bar to launch, often applied applications. `OS X` upgrades
    add features such as automatic backups and "Dashboard" managers for small, usable
    apps called `widgets`.


    Since 2007 Apple has introduced a number of mobile devices that can provide access
    to the Internet, including the `iPhone` smartphone and the `iPad` tablet computer.
    Apple soon emphasized `OS X`''s ability to connect with these devices. In 2011
    Apple introduced `iCloud`, a cloud computing service that allows users to share
    information between all their Apple devices, both on `OS X` and the `iOS` mobile
    app. Apple has added other features that allow connectivity between devices to
    successive versions of `OS X`, `iOS`, and later `watchOS` (Apple Watch smartwatch
    operating system). These features include the ability to detect calls (made on
    the `iPhone`) and ways to quickly share information (such as photos and text)
    between devices.


    ### UNIX OS


    In the late 1960s, a young AT&T Bell Labs engineer Kenneth (Ken) Thompson, worked
    on a `Multics` program project. `Multics` (Multiplexing Information and Computer
    Services) was the `GE-645` mainframe testing system, developed in 1960 by the
    MIT, Bell Labs, and General Electric. It introduced many new things, but there
    were many problems, and in the late 1960''s, Bell Labs, frustrated with progress
    and difficulties, withdrew from the project. Taking the help from some of his
    friends named as Dennis Ritchie, Douglas McIlroy, and Joe Ossanna, so Thompson
    decided to try some of the `Multics''` ideas and re-invent them on a much smaller
    scale. So in 1969 came the idea that `Unix` was now everywhere.


    While Ken Thompson was still able to access the `Multics` environment, he wrote
    a new file simulation and a pairing program on it. The group later continued his
    work on blackboards and took notes. And in 1969, Thompson produced a very interesting
    game, `Space Travel`, which was first written on `Multics`, then translated into
    `Fortran`''s `GECOS`, and finally with the much-used `PDP-7` at Bell Labs. The
    same `PDP-7` then decided to use it for the first `UNIX` launch. In this `PDP-7`
    and using its conference language, a team of investigators (initially without
    financial assistance from the Bell Labs) owned by Thompson and Ritchie, developed
    a sequence file system, computer and device process concepts, command-line translator,
    and other small applications.


    The name `Unics` was coined in middle 1970s by team member Brian Kernighan, who
    played on behalf of `Multics`. `Unics` (uncomplicated information and computing
    system) can end up supporting multiple users simultaneously, and overtime is reduced
    to `Unix`.


    Structurally, the `PDP-7` `Unix` file system was very similar to the current one;
    for example, it had:


    1. `List of i`: a specific list of each node that describes the file. The node
    contained less than it currently does, but the key details were the same: file
    protection mode, its type and size, and a list of physical blocks containing the
    content.

    2. `Brochures`: a special file type is containing a sequence of words and a related
    number `i`.

    3. `Special files` are describing devices. Device specifications were not explicitly
    contained in the node but were instead encoded in a code: certain `I` numbers
    correspond to certain files or folders.

