    >>> [roots @ fosslinux ~] # mv foss8 / tmp /


    >>>mv: write over `/ tmp / foss8 ''?


    Turn ''n'' or press CTRL + C to escape the command.


    You see, it requires us to write down an existing directory, even if both are
    empty. To avoid this, use the -f option to write over.


    >>> [roots @ fosslinux ~] # mv -f foss8 / tmp /


    ### • Renaming Directories


    You already know that there is no separate command to rename files on Linux. Since
    the directions on Linux are only a special file type, the same principle applies
    to the directions. The renaming is done with the mv command, followed by the source
    direction and destination name. Therefore, if we need to rename the directory
    foss10 to foss101, we will issue the following command:


    >>> [roots @ fosslinux ~] # mv foss10 foss101


    ### • Cleansing the Mess


    Now, to clean up everything we have created in one command, use * to specify multiple
    references starting with foss, as well as others in the / tmp / directory.


    >>> [roots @ fosslinux ~] # rm -rf foss * / tmp / foss *


    # Chapter 5: Digging Deeper into the Linux


    ## 5.1 Linux Shell


    The shell is a command interpreter in an operating system like Unix or GNU / Linux,
    a program that uses other programs. It provides a computer user interface to the
    Unix / GNU Linux system so that the user can use different commands or resources/tools
    with specific installation details.


    When the shell has finished making the program, it sends the output to the user
    on the screen, which is a standard output device. For this reason, he is referred
    to as the "interpreter of the command."


    The shell is more than just interpreting a command, and that language of its system
    has a complete language structure such as conditional performance, constraints,
    flexibility, tasks, and much more.


    That is why the Unix / GNU Linux shell is more powerful than the Windows shell.


    Now, we may take a look at some of the most widely used open-source shells in
    Unix / GNU Linux.


    ### Bash Shell


    Bash represents Bourne Again Shell and is the default shell in most Linux distributions
    today. It also has a sh-associated shell and provides more efficient development
    over sh of the system and use that includes:


    • Editing the command line


    • Performance Management


    • Unlimited size command history


    • Shell Services & Nicknames


    • Unlimited size Approximate layout


    • Integer arithmetic on any basis from two to sixty-four


    ### Tcsh / Csh shell


    Tcsh developed with C-shell, can be used as a compatible login shell and Shell
    script command processor.


    Tcsh has the following features:


    • C as syntax


    • Command line editor


    • Word and word file completion


    • Spelling correction


    • Performance management


    ### The Shell of Zsh


    Zsh is designed to work with and integrates many features of other Unix / GNU
    Linux shells, such as bash, tcsh, and ksh.


    And a strong writing language like other shells available. Although it has some
    unique features that include:


    • File name generation


    • Getting started files


    • Login / login


    • Concluding ideas


    • Conceptual guide


    • Flexible index


    ### The Fish


    The fish is in full swing "friendly interactive shell" and was recorded in 2005\.
    It was designed to be fully functional and easy to use, like other shells, with
    excellent features including:


    • Completion of personal page


    • Web-based configuration


    • Automatic suggestions


    • Can be written entirely in clean scripts


    • Term256 technology terminal support


    ## 5.2 Procedures and Operations Management


    Like any multitasking application, Linux performs multiple, simultaneous processes.
    Yes, they appear at the same time, however. In fact, a single processor core can
    perform one process at a time, but the Linux kernel is able to give each process
    its own chance on the processor, and each one seems to run at the very similar
    time.


    We may say that there are many commands that are used to control processes. Of
    course:


    >>>kill - sends the signals to one or more processes (usually "kill" process)


    >>>ps - list the processes that run in the system


    >>>fg - place the process in a private place


    >>>bg - put the process behind


    >>>tasks - another way to list your processes


    ### A Practical Example


    While this may seem like this title is vague, it can be very useful for the average
    user who works hard with a graphical display. Although it may not be possible,
    most (if not all) graphics programs can be set up in the command line. Here is
    an example: there is a small program provided by the X Window program called xload
    that displays a graph representing system loading. We can appreciate this program
    by typing the following:


    >>> [me @ linuxbox me] $ xload


    Note that a small xload window appears and starts showing the system loading graph.
    For applications where xload is not available, try gedit instead. Also, note that
    our information did not appear after the program was launched. The shell is waiting
    for the system to complete before returning to control. When we close the xload
    window, the xload system ends and a quick recovery.


