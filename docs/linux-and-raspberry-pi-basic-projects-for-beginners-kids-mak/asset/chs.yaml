  \n`ls -l` 命令列出每个文件的详细信息。\n```bash\nmariomeraz@raspberrypi:~ $ ls -l\n```\n\n选项 `mkdir`\
  \ 用于创建新目录。\n```bash\nmariomeraz@raspberrypi:$ mkdir newdirectory\n```\n\n为了创建一个空文件，可以使用\
  \ `touch` 命令。\n```bash\nmariomeraz@raspberrypi:$ touch empty\n```\n\n要重命名文件，可以使用\
  \ `mv` 命令。\n```bash\nmariomeraz@raspberrypi:$ mv empty newname\n```\n\n要删除文件：\n\
  ```bash\nmariomeraz@raspberrypi:$ rm newname\n```\n\n要删除空目录，使用 `rmdir`。\n```bash\n\
  mariomeraz@raspberrypi:$ rmdir emptydirectory\n```\n\n要删除包含文件的目录，请使用 `-r` 选项（此 `r`\
  \ 代表递归，表示 `rm` 选项将递归地删除目录中的所有内容）。\n```bash\nmariomeraz@raspberrypi:$ directory >\
  \ rm -r\n```\n\n## 安装软件\n\n```bash\nmariomeraz@raspberrypi:$ tar zxvf fiel.tar.gz\n\
  mariomeraz@raspberrypi:$ tar xjf file.tar.bz\nmariomeraz@raspberrypi$:./configure\n\
  ```\n\n每当程序的源代码被解压后，在解压程序后，`cd` 进入该目录并运行 `./configure`。这将验证系统是否拥有编译软件所需的所有内容。如果需要，命令行命令\
  \ `make` 将编译软件。\n\n```bash\nmariomeraz@raspberrypi:$ (sudo) make install # 此命令行将把新编译的软件移动到系统中的相应位置，以便用户可以像普通命令行命令一样运行它。\n\
  ```\n\n## 配置\n\n### 将数据写入 RAM 的命令\n\n用于快速性能的 fstab 配置\n```bash\nmariomeraz@raspberrypi:$\
  \ sudo nano /etc/fstab\n```\n添加以下行以挂载虚拟文件系统：\n```text\ntmpfs /var/log tmpfs defaults,noatime,nosuid,mode=0755,size=100m\
  \ 0\n```\n在执行 `shutdown -r` 进程后，虚拟系统将挂载在内存磁盘的 `var/log` 上。其他目录也可以移动到 RAM，并需要如下所示通过\
  \ `/etc/fstab` 添加：\n```text\nTmpfs /tmp tmpfs defaults,noatime,nosuid,size=100m\
  \ 0\nTmpfs /var/tmp tmpfs defaults,noatime,nosuid,size=30m 0\nTmpfs /var/log tmpfs\
  \ defaults,noatime,nosuid,mode=0755,size=100m 0\nTmpfs /var/run tmpfs defaults,noatime,nosuid,mode=0755,size=2m\
  \ 0\nTmpfs /var/spool/queue tmpfs defaults,noatime,nosuid,mode=0700,size=100m gid=12,\
  \ size=30m 0\n```\n\n### 管理磁盘的命令\n\n```bash\nmariomeraz@raspberrypi:$ sudo apt-get\
  \ install gdisk\nmariomeraz@raspberrypi:$ sudo /dev/sdb\nmariomeraz@raspberrypi:~\
