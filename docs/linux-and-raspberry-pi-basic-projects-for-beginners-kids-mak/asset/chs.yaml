  \n# Twilio 项目：从树莓派发送短信\n![包含图形用户界面、文本、应用程序、电子邮件的自动生成图像](img/image00314.jpeg)\n\n\
  \n\n\n\n这是一个结合 Twilio 和 Python 的程序，用于从树莓派（Raspberry Pi）向手机发送短信（SMS）。\n\nTwilio 是一家云通信公司，允许使用\
  \ Python 代码从树莓派向手机免费发送短信。\n\n## 第 1 步：设置 Twilio 账户\n\n`Twilio.com/try-Twilio`\n\n\
  ### A) Twilio 注册\n### B) Twilio 账户\n### C) Twilio 数字\nTwilio 是免费的，允许用户向已注册并验证的电话号码发送短信。\n\
  \n## 第 2 步：号码注册\n\n- Twilio 账户有两种类型：付费账户和免费试用账户。\n- 号码需要经过验证。\n- 需要提供国家代码。\n\n##\
  \ 第 3 步：控制台\n\n- 在 Twilio 上注册并登录后。\n-可以使用 `AccountSid` 和 `Auth Token`。\n- 这些参数是调用\
  \ Twilio REST 所需要的。\n\n## 第 4 步：安装 Twilio 软件\n\n```\nmariomeraz@raspberrypi: ~$\
  \ sudo easy_install twilio\nmariomeraz@raspberrypi: ~$ sudo pip install twilio\n\
  ```\n\n如果需要安装 “pip”：\n\n```\nmariomeraz@raspberrypi: ~$ sudo apt-get install python-pip\
  \ python-dev\nmariomeraz@raspberrypi: ~$ sudo pip install -U pip\n```\n\n## 第 5\
  \ 步：Twilio 身份验证\n\n创建一个向手机号码发送文本消息的短信程序。\n\n在 Python 编辑器中，需要导入 Twilio REST 库：\n\n\
  - 添加账户和凭据\n- `AccountSid`\n- `Auth Token`\n\n```python\nfrom twilio.rest import\
  \ twilioRestClient\n\nAccount_sid = “ XX”\n\n#输入数字\nAuth_taken = “ XX “\n\nClient\
  \ = TwilioRestClient(account_sid, auth_token)\n```\n\n## 第 6 步：创建消息\n\n此消息将发送到该手机号码：\n\
  \n```python\nmessage = raw_input (“Please enter the message” )\n```\n\n## 第 7 步：添加号码\n\
  \n发送消息需要两个号码。\n第一个号码是手机号。\n第二个号码是 Twilio 账户号码，可以从控制台页面的“Call the sandbox number”下获取：\n\
  \n```python\nmessage = client.message.create (to= “+1-TheMobileNumber”,\nfrom_=“+1-TWILIONumber”,\
  \ body=message)\n```\n\n## 第 8 步：发送消息\n\n下面的消息仅仅是确认消息：\n\n```python\nprint message.Sid\n\
  print “ The message has been sent”\n```\n\n### 完整的 Python 代码：\n\n```python\nfrom\
  \ twilio.rest from TwilioRestClient Account_sid = “ XX”\n\n#输入电话号码#\nAuth_taken\
  \ = “ XX “\n\nClient = TwilioRestClient(account_sid, auth_token)\n\nmessage = raw_input\
  \ (“Please enter the message” )\n\nmessage = client.message.create (to= “+1-TheMobileNumber”,\n\
  from_=“+1-TWILIONumber”, body=message)\n\nprint message.Sid\nprint “ The message\
  \ has been sent”\n```\n\n## 发送短信的另一种 Python 代码\n\n仅使用 Python 发送电子邮件和短信的另一种方法如下：\n\
  \n```python\nimport smtplib\nfrom email.message import EmailMessage\n\ndef email_alert\
  \ (subject, body, to):\n    msg = EmailMessage ()\n    msg.set_content (body)\n\
  \    msg [‘subject’] = subject\n    msg [‘to’]  = to\n    User = “[email_alert@gmail.com“\n\
  \    msg [‘from’] = user\n\npassword = “pass”\nserver = smtplib.SMTP (“ smtp.gmail.com”\
  \ , 587)\nsever.starttls ()\nserver.login( user, password)\nserver.send_message(msg)\n\
  sever.quit ()\n\nif _name_ == ‘_main_’ :\n  Email_alert(“ Hey”, Hello World,  “\
  \ email alert@gmail.com“ )\n  Email_alert(“ Hey”, Hello World,  “ number @carrier.com“\
  \ ) # SMS Delivery#\n```\n\n设置 Gmail 账户：\n`Https:// myaccount.google.com`\n\n发送短信报警：\n\
