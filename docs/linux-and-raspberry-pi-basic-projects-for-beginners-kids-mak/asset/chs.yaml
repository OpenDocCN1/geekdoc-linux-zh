  \ 是一个非交互式网络下载器，即使用户未登录系统也可以从 Web 服务器下载文件，并且可以在后台运行而不影响当前进程。该 GNU 工具支持 HTTP、HTTPS\
  \ 和 FTP 协议，并支持通过 HTTP 代理检索。\n\n下面的示例以 google 域名作为例子。\n```bash\nmariomeraz@raspberrypi:~\
  \ $ wget www.google.com\n--2022-11-07 13:46:09-- http://www.google.com/\nResolving\
  \ www.google.com (www.google.com)... 2607:f8b0:4023:1006::93, 2607:f8b0:4023:1006::68,\
