  \n# 序言\n\n树莓派的核心在于教育。这些设备通过在计算机科学学习、Linux 系统、创客项目甚至游戏和娱乐方面的众多案例展示了其价值。树莓派是近年来在计算机、电子世界与教育领域结合时最令人兴奋的事情之一，它扩展了这些可能性。\n\
  \n我编写这本书的一个个人动力是，我认为树莓派是知识的民主化者，我自己也自称为技术知识的民主化者，我真的相信，技术职业的起点可以是通过树莓派项目学习的技术知识。\n\
  \n基本上这本书有三个目标：学习 Linux，开始学习树莓派，第三方面是作为参考工具。你可能看过这本书的封面，并自己思考这本书的意图，本书的另一个大方面是，我不假设每个人都应该如何从\
  \ A 到 Z。\n\n# 引言\n\n微控制器市场是一个每年产值 280 亿台的业务。由于这是一本关于树莓派的书，必须谈谈树莓派基金会的 CEO 创始人 Eben\
  \ Upton。\n\n九年前，树莓派诞生了，从那时起树莓派基金会售出了 4200 万台设备。从树莓派 1 到树莓派 2 的进化是巨大的，从单核到四核配置。尽管最大的跨越是从\
  \ 3+ 到 4。\n\n2021 年，树莓派基金会开始生产 `RP2040` 芯片，该芯片已引入微控制器开发板 `Pi Pico Raspberry` 中。\n\
  \n\n\n\n\n静音、低功耗、小型设备，用于边缘计算和物联网计算，面向社区设备。\n\n树莓派使用 ARM 处理器，周围有许多使用此类处理器的 ARM 小型型设备，如移动设备。树莓派有大型号，也有像\
  \ Raspberry Pi Zero 和 Raspberry Pi Pico 这样的小型型号。在本书中，我们将讨论并关注树莓派 4。\n\n## 前提条件\n\
  \n本书的某些前提条件如下所示，尽管它们并非强制性的，因为我尝试以一种“从零到英雄”的方法来编写这本书。\n\n* 少量的网络知识\n* 少量的 Linux 知识，不过不用担心，你将通过\
  \ Debian 的变体 Raspbian 操作系统学习 Linux 基础。\n* 最后，但同样重要的是，对学习和享受其中有浓厚的兴趣！\n\n## 本书使用的规范\n\
  \n* **粗体常量**：用于文件夹、文件名、文件扩展名以及 CLI（命令行接口）指令。\n* *斜体*：表示 URL、新术语以及用户应按字面输入的文本。\n\n\
