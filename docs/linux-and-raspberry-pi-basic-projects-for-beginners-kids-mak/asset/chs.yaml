  \n\n\n\n# 简介\n\nPython 是一门重要的语言，其重要性体现在科学、科技行业，甚至黑客都将其视为首选编程语言。Guido van Rossum\
  \ 是 Python 的创建者。1999 年，van Rossum 编写了一份被广泛阅读的提案，名为《面向大家的计算机编程》：[`www.python.org/doc/essays/cp4e/`](https://www.python.org/doc/essays/cp4e/)。\n\
  \nPython 是一种解释型语言，这意味着 Python 程序的源代码会被转换为字节码，然后由 Python 虚拟机执行。简单来说，解释型语言意味着逐行运行代码，但也意味着指令是在不预先将整个程序编译成机器语言的情况下执行的，尽管这里有一个小秘密：Python\
  \ 既是编译型语言也是解释型语言。\n\n这意味着当处理 Python 代码时，它首先被编译，然后逐行解释。编译部分对用户是隐藏的。在运行代码时，Python\
  \ 在内部生成字节码，该字节码随后使用 Python 虚拟机（`p.v.m`）转换以生成输出。代码在 Python 中执行后，编译部分就会被删除，这样程序员就不会遇到不必要的复杂性。由于上述所有因素，用\
  \ Python 编写程序体积较小，且在 Python 语言中调试代码更容易。虽然在解释型语言中执行的程序比直接编译的语言慢，因为代码行需要通过解释运行时，这增加了运行时间复杂度；例如，在\
  \ Python 程序中，不需要向计算机指定变量是数字、列表还是字符串；解释器会在程序或脚本执行时确定数据类型。\n\n![一张包含图标的描述的自动生成的图片](img/image00268.jpeg)\
  \ 这就是黑客偏好使用 Python 的能力之一，正是因为解释器所提供的这种变量灵活性。\n\n## 起手指南\n\n让我们从第一个 Python 脚本开始，为了实现这一点，我们需要打开用于构建\
  \ Python 脚本和程序的工具，即集成开发环境（IDE）。IDE 是一种帮助程序员高效开发软件代码的软件应用程序，因为它通过将软件编辑、构建、测试和打包等功能整合到一个易于使用的应用程序中，从而提高了开发者的生产力。\n\
  \nRaspberry OS 附带的用于 Python 的 IDE 称为“Thonny Python IDE”，因此，让我们按照以下说明操作：\n\n1. 点击树莓图标\
  \ -> ![](img/image00287.jpeg)\n2. 然后进入 Programming（这是第一个选项）\n3. 然后进入 Thonny Python\
  \ IDE，你将看到下面的屏幕\n\n![图形用户界面、文本、应用程序、电子邮件描述的自动生成的图片](img/image00295.jpeg)\n\n关于“Thonny\
  \ Python IDE”的更多信息请访问：[`thonny.org/`](https://thonny.org/)\n\n## Python 第一步\n\n\
  一旦打开 Thonny，三个大于号（`>>>`）就是交互提示符，这意味着解释器正在等待指令。\n\n按照以下步骤操作：\n\n输入以下内容：\n\n```python\n\
  >>> print (“ Hello World”)\n```\n\n按下 Enter 键，python 将执行该语句。\n\n结果：\n\n```python\n\
  >>> Hola World\n```\n\n![图标自动生成](img/image00269.jpeg)![一张包含图标的描述的自动生成的图片](img/image00268.jpeg)\n\
  \n## Python 中的导入是指什么？\n\n导入是指允许 Python 文件或 Python 模块访问另一个 Python 文件或模块中的脚本。Python\
  \ 中的导入对于有效组织你的代码至关重要。\n\n通常分为三组：\n- **标准库导入**：Python 的内置模块\n- **第三方导入**：已安装且不属于当前应用程序的模块\n\
  - **本地应用导入**：属于当前应用程序的模块\n\n### 导入示例\n\n```python\n>>> import math\n>>> radius =\
  \ 200\n>>> radius *2 *math.pi\n1256.6370614359173\n```\n\n![图标自动生成](img/image00296.jpeg)\n\
  ![图标自动生成](img/image00267.jpeg)\n\n## Thonny Python 中的编辑选项\n\n缩进对 Python 非常重要。缩进是指代码行开头的空格。在其他编程语言中，代码缩进仅为了可读性，但\
  \ Python 中的缩进非常重要。Python 使用缩进来表示代码块。\n\n缩进错误所示：\n\n```\n        ^\nIndentationError:\
  \ expected an indented block\n```\n\n要开始一个新程序，选择 `File -> New Window`，Thonny 将提供脚本编辑窗口。\n\
  \n文件、脚本和 Python 程序以扩展名（`.py`）保存。\n\n例如：`NewScript.py`\n\n要在终端中运行此脚本，需要输入以下内容：\n\n\
  ```bash\nmariomeraz@raspberrypi:~ $ python NewScript.py\n```\n\n在我看来，如果你到了这一步，你已经准备好开始组合项目了，因为你已经熟悉了基础机制，并更多地理解\
  \ Linux 环境、Python 基本原理以及创建项目的基本概念。记住，天空才是极限。\n\n## Python 对象与模块\n\n在 Python 中，字符串、列表、函数、模块甚至数字都是对象。Python\
  \ 对象可以被概念化为属性和方法的封装集合。对象是具有名称的数据和行为的结合。Python 是一门简洁的语言，拥有 34 个保留关键字。下表中的关键字是语言的核心部分，允许你组织并控制\
  \ Python 脚本中的活动流。任何不是关键字的内容都可以被视为对象。\n\n### Python 34 个保留关键字\n\n| 条件判断 | 类、函数、模块\
  \ | 错误处理 | 循环 | 编译 |\n| :--- | :--- | :--- | :--- | :--- |\n| And | Class | Try\
  \ | As | Del |\n| Else | Def | Except | Break | Pass |\n| Elif | Global | Finally\
  \ | Continue | Print |\n| Not | Lambda | Raise | In | |\n| Or | Nonlocal | Assert\
  \ | For | |\n| If | From | With | While | |\n| Is | Import | | | |\n| True | Return\
  \ | | | |\n| False | Yield | | | |\n| None | | | | | |\n\n`help()` 指令提供关于下面主题的信息：\n\
  \n```python\n>>> help (\"print\")\n>>> help (\"topics\")\n>>> help (\"keywords\"\
  )\n>>> help (\"modules\")\n```\n\n# 关于树莓派项目的一切\n\n这一章有很多内容要讨论，这些都是关于你将利用树莓派组合的项目：一块原型板、几根线缆、一些传感器以及外围设备（如显示器和树莓派摄像头），搞定！！\n\
