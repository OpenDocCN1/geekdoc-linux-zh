  \ 知识\n\n## 树莓派型号与历史\n\n### 树莓派年代与历史\n\n为了了解这个神奇设备的过去和演变，让我们回顾一下树莓派从过去现在的演变。\n\n\
  | 年份 | 2012 | 2013 | 2014 | 2015 |\n| :--- | :--- | :--- | :--- | :--- |\n| 型号 |\
  \ Model B | Model A | Model B+ | Model Zero |\n| 特性 | 创世纪设计 | 更简单更廉价 | 改进布局 | 更小更廉价\
  \ |\n\n| 年份 | 2015 | 2016 | 2017 | 2018 |\n| :--- | :--- | :--- | :--- | :--- |\n\
  | 型号 | Model 3B | Model 3B | Model Zero Wireless | Model 3A+/B+ |\n| 特性 | 更多内存（从到\
  \ 2GB） | 更快、Wifi、蓝牙 | Wifi、蓝牙 | 更快、USB 启动 |\n\n### Raspbian 操作系统版本历史\n\n| Raspbian\
  \ 操作系统版本历史 | | | | |\n| :--- | :--- | :--- | :--- | :--- |\n| 2012 | 2015 | 2017\
  \ | 2019 | |\n| Wheezy | Jessie | Stretch | Buster | |\n\n### 树莓派 4 Model B 型\n\n\
  一台超级增强的树莓派，它终于实现了你想要的所有功能，且价格与之前的型号完全相同。\n\n虽然树莓派已经取得了多年的成功，但一直有很多用户想要一些东西：稍微强大一点可以处理日常计算的\
  \ CPU，充足的 USB 端口，可能还有无线功能以使网络连接更简单。树莓派 4 Model B 配有两个 micro-HDMI 端口，这些 HDMI 端口能够输出\
  \ 4K 视频，两个 `USDB 3.0` 和两个 `USB 2.0` 端口，一个 `USB-C` 电源输入，一个用于有线网络的以太网端口，一个用于音频的 3.5mm\
  \ 耳机接口，和一个 40 脚 GPIO 端口。\n\n![包含自动生成的电子描述的图片](img/image00270.jpeg)\n\nPi 4 Model\
  \ B 文件与之前树莓派型号产生的文件兼容。在书中，我们将使用树莓派 4，尽管任何型号都可以使用。\n\n### 树莓派 4\n\n* 64 位 CPU\n*\
  \ 更快 (1.5 GHz)\n* 更多内存 (从 1、2 到 4 GB)\n* 千兆以太网端口\n* 2.4 GHz 和 5 GHz WiFi\n* 蓝牙 5.0\
  \ / BLE\n* USB 3.0 端口\n* 双 4K HDMI 输出\n* BCM2711 芯片\n\n树莓派 4 Model B 的 `BCM2711`\
  \ 芯片是一个四核 1.5 GHz 处理器。\n\n#### GPIO 端口\n\n![自动生成的图标描述](img/image00266.jpeg)\nGPIO\
  \ 端口中有 40 引脚。根据引脚图（Pinout）布局。\n\n![自动生成的表格描述](img/image00271.jpeg)\n![自动生成的图形用户界面、应用程序描述](img/image00272.jpeg)\n\
  图片取自 [`www.raspberrypi-spy.co.uk/2012/06/simple-guide-to-the-rpi-gpio-header-and-pins/`](https://www.raspberrypi-spy.co.uk/2012/06/simple-guide-to-the-rpi-gpio-header-and-pins/)\n\
  \n#### 以太网端口\nPi 4 和 Pi 3 Model B+ 有线网络的千兆以太网比旧的树莓派型号快三倍。\n\n#### USB 端口\n两个 `USDB\
  \ 3.0` 和两个 `USB 2.0` 端口，一个 `USB-C` 电源输入。\n\n#### 集成无线\nPi 4 Model B 具有 Wi-Fi 和蓝牙无线功能。\n\
  * 802.11n 无线局域网\n* 蓝牙 5.0\n\n#### Micro SD 端口\n用于操作系统卡\n\n#### Micro-HDMI 端口\n树莓派\
  \ 4 Model B 解码 4K 视频。由于树莓派 4 Model B 有两个 Micro-HDMI 端口，可以用于双显示。\n\n#### 耳机接口\n3.5\
  \ mm\n\n#### 启动套装\n![自动生成的图标描述](img/image00266.jpeg)\n... (剩余文本遵循相似逻辑)\n\n\n\n\n\
  \n## 漏洞与标志\n\n- **漏洞 L1tf**: 不受影响\n- **漏洞 Mds**: 不受影响\n- **漏洞 Meltdown**: 不受影响\n\
  - **漏洞 Spec store bypass**: 不受影响\n- **漏洞 Spectre v1**: 缓解；`__user pointer sanitization`\n\
  - **漏洞 Spectre v2**: 存在漏洞\n- **漏洞 Srbds**: 不受影响\n- **漏洞 Tsx async abort**: 不受影响\n\
  \n**标志**: `half thumb fastmult vfp edsp neon vfpv3 tls vfp v4 idiva idivt vfpd32\
  \ lpae evtstrm crc32`\n\n## Linux 系统概述\n\n```bash\nmariomeraz@raspberrypi:~ $ \n\
  ```\n\n这里所表达的某些命令在 LPI 认证（Linux 专业协会）中列出，该协会是一个提供 Linux 系统和架构相关考试和资质认证的非营利组织。\n\n\
  尽管书中的材料并不能让你完全准备好参加 `LPI 认证`，但所呈现知识的逻辑和方法遵循了 `LPI 认证` 关于通用系统管理、硬件配置、包管理、命令行和进程处理的级别。如果你已经使用和玩了\
  \ Linux 一段时间，也许你已经有些熟悉了，尽管如此仍然值得过一遍，以防可能遗漏了某些知识点。\n\n这些书中的某些命令行输出对于红帽企业 Linux (`RHEL`)、CentOS\
  \ 以及 Debian 等版本都是用的。基于 Linux 架构的开放系统提供了有关设备和外围的信息。\n\n## 虚拟文件系统\n\n由 `Kernel`（内核）创建的虚拟目录包含关于运行进程和硬件设备的信息，例如\
  \ `/proc` 侧重于提供关于进程的信息（如在系统上运行的 `read` 程序），而 `/sys` 则涵盖了硬件设备。\n\n**注意**: 在 Linux\
  \ 和 Unix 系统中都有一种说法：如果没有消息，就说明是好消息。\n\n## 探索 /proc\n\n```bash\nmariomeraz@raspberrypi:~\
  \ $ cd /proc\nmariomeraz@raspberrypi:/proc $ ls\n```\n\n```text\n1 1734 2038 234\
