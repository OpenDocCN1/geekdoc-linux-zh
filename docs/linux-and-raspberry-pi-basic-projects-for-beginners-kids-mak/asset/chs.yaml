  \ | :--- | :--- |\n| acpid | 高级配置和电源接口 | 用于传递 ACPI 事件的灵活守护进程。取代了 `apmd` 守护进程。 |\n\
  | apmd | 高级电源管理 | 报告并处理系统电源的特定变化，包括关机。对于笔记本电脑等使用电池的机器非常有用。 |\n| atd | at | 在指定的日期和时间执行命令。周期执行命令请参见\
  \ `crond`。 |\n| automount | 自动挂载 | 在访问文件系统时自动挂载。自动挂载是一种按需挂载远程目录的方法，无需在 `/etc/fstab`\
  \ 中进行硬配置。 |\n| crond | cron | 用于周期性执行任务。该守护进程在 `/var/spool/cron` 目录中查找与用户用户名相对应的文件。它还会查看\
  \ `/etc/crontab` 文件以及 `/etc/cron.d` 目录下的文件。当任务需要执行时，`crond` 将以描述该任务的文件的用户身份执行它。\
  \ |\n| dhcpcd | DHCP | DHCP 客户端守护进程 |\n| dhcpd | DHCP | 为主机分配 IP 地址、子网掩码、默认网关、DNS\
  \ 和其他信息。该协议响应 DHCP 请求，以及可选的 BOOTP 请求。 |\n| ftpd | FTP | 处理 FTP 请求 |\n| gpm | 通用鼠标或\
  \ GNU 粘贴管理器 | 允许你使用鼠标在控制台应用程序中剪切和粘贴文本 |\n| httpd | HTTP | Web 服务器守护进程 |\n| In.fingerd\
  \ | finger | 处理由 `xinetd` 启动的 `finger` 工具的用户信息请求 |\n| inetd | | 已弃用，由 `xinetd` 取代\
  \ |\n| lpd | 打印机池化守护进程 | 当打印请求到达机器时由 `xinetd` 启动。不与 CUPs 使用。 |\n| named | DNS |\
  \ 支持 DNS |\n| Nfsd, statd, lockd, mountd, rquotad | NFS | 这五个守护进程协同处理 NFS 操作。`nfsd`\
  \ 守护进程处理文件和目录请求。`statd` 和 `locd` 守护进程实现网络文件和记录锁定。`mountd` 守护进程将来自 `mount` 工具的文件系统请求转换为\
  \ NFS 句柄并检查访问权限。如果启用了磁盘配额，由 `rquotad` 处理。 |\n| ntpd | NTP | 同步网络计算机上的时间。`Ntpd` 需要一个\
  \ `/etc/ntp.conf` 文件。(www.ntp.org) |\n| portmap | RPC | 将输入的 RPC 服务号请求映射到本地系统的 TCP\
  \ 或 UDP 端口号。 |\n| pppd | PPP | 该协议控制由本地计算机与远程计算机之间的 IP 连接表示的伪接口。 |\n| rexecd | rexec\
  \ | 允许具有有效用户名和密码的远程用户在系统上运行程序。出于安全考虑，其通常已被弃用。 |\n| routed | 路由表 | 管理路由表，使系统知道如何发送指向远程网络的消息。如果系统没有\
  \ `etc/defaultrouter` 文件，`routed` 将自动启动以监听传入的路由消息，并向本地网络上的其他系统发布输出路由。 |\n| rsyslogd\
  \ | 系统日志 | 记录重要的系统事件并将其存储在文件中，将其转发给用户或运行 `rsyslogd` 守护进程的主机。该守护进程通过 `/etc/rsyslog.conf`\
  \ 配置并配合 `rsyslog` 工具使用。 |\n| sendmail | 邮件程序 | `sendmail` 守护进程源于 |\n| Smbd, nmbd\
  \ | Samba | 允许 Windows |\n| sshd | ssh | 启用安全登录 |\n| talkd | talk | 允许对话 |\n| tftpd\
  \ | TFTP | 用于启动 |\n| timed | 时间 | 同步时间 |\n| xinetd | xinetd | 超级服务器 |\n\n## 文件系统\n\
  \nLinux 中的文件系统是文件的结构化集合。文件系统层次结构标准（FHS）提供了一个组织和存储数据的结构。\n\n### 目录结构\n\n```bash\n\
  mariomeraz@raspberrypi: ls\n```\n```bash\nmariomeraz@raspberrypi:~$ ls\n```\n```bash\n\
  mariomeraz@raspberrypi:/ ls\n```\n\n## 目录描述\n\n| 目录 | 描述 |\n| :--- | :--- |\n| `/root`\
  \ | 根目录 |\n| `/bin` | 此目录下有所有用户都可以运行的程序、文件和命令 |\n| `/boot` | 包含启动所需的所有文件 |\n| `/dev`\
  \ | 此位置有代表设备的特殊文件 |\n| `/etc` | 此目录可以找到配置文件 |\n| `/etc/init.d` | 启动服务的脚本 |\n| `/etc/X11`\
  \ | X11 配置 |\n| `/home` | 用户家目录 |\n| `/home/pi` | “Pi”用户的家目录 |\n| `/lib` | 内核模块和驱动程序\
  \ |\n| `/media` | 可移动介质的挂载点 |\n| `/proc` | 这是一个包含运行进程和操作系统信息的虚拟目录 |\n| `/sbin` |\
  \ 系统维护程序 |\n| `/sys` | 这是是树莓派上的一个表示硬件的特殊目录 |\n| `/tmp` | 程序创建临时文件的空间 |\n| `/usr`\
  \ | 此目录下有所有用户可使用的程序和数据 |\n| `/usr/bin` | 操作系统中用户交互的大多数程序位于此处 |\n| `/usr/games` |\
  \ 游戏存储在此 |\n| `/usr/lib` | 此位置有支持常用程序的库 |\n| `/usr/local` | 所有特定于此机器的软件都放在这里 |\n\
  | `/usr/sbin` | 系统管理程序 |\n| `/usr/share` | 应用程序之间共享的对象，例如图标或字体 |\n| `/usr/src` |\
  \ Linux 发行版的源码位于此处，因为 Linux 是开源的 |\n| `/var` | 这是可以找到系统日志和池文件的位置 |\n| `/var/backups`\
  \ | 此目录中包含大多数系统文件的备份副本 |\n| `/var/cache` | 此位置存放任何缓存数据的程序，例如 apt-get 或网页浏览 |\n|\
  \ `/var/log` | 所有系统日志和单个服务日志的位置 |\n\n\n\n\n\n| `/var/mail` | 如果配置了邮件服务，所有用户电子邮件都存储在此位置\
  \ |\n| `/var/spool` | 此位置存有等待处理的数据 |\n\n# 启动并运行树莓派\n\n## 树莓派配置选项 (raspi-config)\n\
  \n在图形化配置界面 (GUI) 中，可以使用上下方向键在列表中移动并选择几个选项。\n\n以下步骤将引导你完成配置选项的操作流程。\n\n点击树莓派图标 ->\
  \ ![](img/image00287.jpeg) 然后进入首选项 (Preferences) -> 然后进入树莓派配置 (Raspberry Pi Configuration)，你看到下面的屏幕。\n\
  \n在设置选项工具上，使用上下方向键在选项列表中移动。使用空格键来选择特定的“选项”。\n\n![图形用户界面描述自动生成](img/image00288.jpeg)\n\
  ![图形用户界面、文本、应用程序描述自动生成](img/image00289.jpeg)\n![图形用户界面、表格描述自动生成](img/image00290.jpeg)\n\
  ![图形用户界面描述自动生成](img/image00291.jpeg)\n![图形用户界面描述自动生成](img/image00292.jpeg)\n\n###\
  \ 扩展根分区 (Expand rootfs)\n此选项将扩大文件系统以使用整个 SD 卡容量。\n\n### 超扫描 (Overscan)\n此选项用于使图像适应屏幕。初始情况下该选项已禁用。对于高清显示器，文本有时会超出屏幕边缘，为了解决这个问题，需要启用超扫描并更改值使图像适应屏幕。超扫描选项中的值表示图像的扫描量，因此，为了纠正任何图像问题，正值可能会超出屏幕，而负值可用于修正显示器边缘的黑边。\n\
  \n### 键盘 (Keyboard)\n有一个选择键盘类型的选项。\n\n### 密码 (Password)\n初始默认密码为 `raspberry`，尽管在最新版本中有一个首次设置时设置初始密码的选项。\n\
  \n### 更改区域设置 (Change Locale)\n默认设置为英国英语并采用标准的 UTF-8 字符编码。\n\n### 更改时区 (Change Time\
  \ Zone)\n此选项可以根据位置和时区更改时间。\n\n### SSH\n此选项开启安全外 (`SSH`) 服务器，以便通过网络远程登录树莓派。\n\n###\
  \ 内存分配 (Memory Split)\n默认值为 `split`。此选项允许更改 CPU 和 GPU 使用的内存量。\n\n## 超频 (Overclock)\n\
  这提供了以高于 700 MHz 的速度运行处理器的选项。其他选项包括 Medium（中）、Modest（适度）以及可以以 1000 MHz 运行的 Turbo\
  \ 模式。\n\n是通过 CLI 命令执行“提升性能和超频”操作的序列：\n\n```bash\nmariomeraz@raspberrypi:$ sudo raspi-config\n\
  Options:\nModest\nMedium\nHigh\nTurbo\nmariomeraz@raspberrypi:$ sudo shutdown -r\
  \ now\n```\n\n# 特殊设置\n\n## 超频 (Overclock)\n超频功能在不增加成本的情况下提供额外的 50%的性能。树莓派中的处理器设计运行速度为\
  \ 700 MHz，这意味着每秒执行 700,000,000 次操作。虽然超频会增加功耗，从而导致热增加。\n\n激活超频功能如下：\n\n```bash\n\
  mariomeraz@raspberrypi:~ $ sudo raspi-config\nSelect “overclocking”\n```\n\n注意：最大超频设置将额外增加\
  \ 50%的速度。\n一旦树莓派达到 85 摄氏度，它会自动关闭超频。\n由于超频会增加树莓派的抽电量，树莓派在同时运行多个 USB 设备时的稳定性会降低。\n\
  \n# 树莓派的 Linux 命令\n\n## 桌面行为 (Desktop Behavior)\n此选项用于直接启动到图形桌面环境，默认设置为“Yes”。如果选择“No”，启动完成后将显示命令行，并且需要登录才能启动图形界面。\n\
  \n以下信息为默认凭据：\n树莓派登录名：`pi`\n密码：`raspberry`\n\n启动 raspy-config GUI（图形用户界面）：\n```bash\n\
  mariomeraz@raspberrypi:~ $ startx\n```\n\n## 更新 (Update)\n此选项用于更新操作系统。相应的 CLI 替代方案如下：\n\
  \n```bash\nmariomeraz@raspberrypi:~ $ sudo reboot\n```\n\n`$` = 普通用户命令\n`#` = root\
  \ 用户命令\n{后者必须作为 root 身份使用或使用 Sudo 命令}\n\n### 如何添加用户\n```bash\n#adduser <username>\n\
  #passwd <username>\n```\n\n使用以下 CLI 命令更新和升级树莓派操作系统：\n\n```bash\nmariomeraz@raspberrypi:#\
  \ apt -get # 此 CLI 可用于安装和移除软件。\nmariomeraz@raspberrypi:# sudo apt-get install <program>\
  \ # 此 CLI 命令将安装 <program> 包。\nmariomeraz@raspberrypi:# sudo apt-get update  # 此\
  \ CLI 将从存储库获取最新的包列表。\nmariomeraz@raspberrypi:# sudo reboot {重启树莓派}\nmariomeraz@raspberrypi:#\
  \ sudo shutdown -h now {关闭树莓派 }\nmariomeraz@raspberrypi:# sudo apt-get upgrade \
  \   # 此 CLI 命令将升级仓库中所有新版本的包。\nmariomeraz@raspberrypi:# sudo apt-get purge <program>\
  \ # 此 CLI 命令将移除 <program> 包。\n```\n\n# 导航与文件 (Navigation and Files)\n以下命令是操作 Linux\
  \ 必不可少的工具，请记住在 Linux 中一切皆文件。\n\n![图标描述自动生成](img/image0266.jpeg)\n\n| CLI 命令 | 动作\
  \ |\n| :--- | :--- |\n| `man <cli command>` | 提供所有 CLI 命令及其功能的详细定义 |\n| `pwd` |\
  \ 显示工作目录 |\n| `mkdir` | 创建目录 |\n| `ls` | 列出当前目录的内容 |\n| `cd` | 切换目录 |\n| `mv` |\
  \ 移动或重命名文件或目录 |\n| `cp` | 拷贝文件或多个 |\n| `rm` | 删除文件或文件 |\n| `rmdir` | 删除目录 |\n\n\
  ```bash\nmariomeraz@raspberrypi:~ $ cd {切换目录}\nmariomeraz@raspberrypi:~ $ cd ~ {移动到主目录}\n\
  mariomeraz@raspberrypi:~ $ cd / {移动到根目录}\nmariomeraz@raspberrypi:~ $ cd .. {返回上一级目录}\n\
  ```\n\n示例：\n```bash\nmariomeraz@raspberrypi:~ $ cd /home/pi/Documents\nmariomeraz@raspberrypi:~\
  \ $ cd ./Music\nmariomeraz@raspberrypi:~ $ cd ..\nmariomeraz@raspberrypi:~ $ cd\
  \ ~\n```\n\n## 查找文件 (Finding Files)\n`find <location> <test>`\n\n常用的标志包括：\n- `-mtime\
  \ <number>`: 查找在过去 `<number>` 天内修改的文件。例如，`<number>` 可以是 2（恰好是两天前），-2（不到两天前），+2（两天前以前）。\n\
  - `-name <filename>` 查找名为 `<filename>` 的文件。\n- `-iname <filename>` 匹配名为 `<filename>`\
  \ 的文件，但不区分大小写。\n\n## 通配符 (Wildcards)\n- `(*)` 匹配任何字符字符串或空字符\n- `(?)` 匹配任何单个字符\n\
  - `[abc]` 匹配 a,b,c\n- `[!abc]` 匹配除 a, b, c 以外的任何字符\n- `[A-Z]` 匹配 A-Z 范围内的任何字符\n\
  - `[one, two]` 匹配单词 one 和 two\n\n## 特殊键 (Special Keys)\n- `Ctrl + C` 终止终端中运行的任何程序\n\
  \n\n\n\n\n- `Ctrl + D`: 向终端中运行的任何程序发送文件结束符。\n- `Ctrl + Shift + C`: 将选中的文本复制到剪贴板。\n\
  - `Ctrl + Shift + V`: 从剪贴板粘贴文本。\n\n## 用户管理\n\n创建新用户帐户：\n```bash\nmariomeraz@raspberrypi:$\
  \ sudo adduser name\nmariomeraz@raspberrypi:$ sudo adduser name sudo\n```\n\n##\
  \ 系统信息\n\n`uname` 显示系统内核信息。\n```bash\nmariomeraz@raspberrypi:~ $ uname\nLinux\n\
