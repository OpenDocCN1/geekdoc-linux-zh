  \ 41 645 786 13 ports sys\n132 1941 21 32 410 646 789 92 irq sysrq-trigger\n1378\
  \ 195 2114 33 411 647 791 93 kallsyms sysvipc\n1390 1952 2120 37 414 65 792 94 keys\
