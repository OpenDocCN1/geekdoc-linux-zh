  mariomeraz@raspberrypi: ~$ \n```\n\n### 2. 下面是第二种选项 `luma.oled` 提供了一个 Python 接口，用于连接带有\
  \ `SSD1306`、`SSD1309`、`SSD1325`、`SSD1331`、`SSD1351` 或 `SH1106` 显示器的树莓派电脑。\n\n```\n\
