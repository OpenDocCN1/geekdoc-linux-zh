  \ kill 6077\n```\n\n![自动生成的图标描述\n\n# Linux 命令\n\n获取 Linux 知识的更多方法：以下两个命令对于增加 Linux\
  \ 命令知识至关重要。\n\n`man` 命令提供了命令的完整描述和选项：\n\n```bash\nmariomeraz@raspberrypi:$ man ls\n\
  mariomeraz@raspberrypi:$ ls -help\nmariomeraz@raspberrypi:~ $ ls --help\n```\n\n\
  ## ls 使用\n\n`ls [OPTION]... [FILE]...`\n\n列出关于 `FILE` 的信息（默认认为当前目录）。如果没有指定 `-ftSUX`\
  \ 或 `--sort`，则按字母顺序对条目。\n\n- `-a`, `--all`: 不忽略以 `.` 开头的项\n- `-A`, `--almost-all`:\
  \ 不列出 `.` 和 `..`\n- `--author`: 配合 `-l`，打印每个文件的作者\n- `-b`, `--escape`: 为图形字符打印 C\
  \ 风格的转义字符\n- `--block-size=SIZE`: 配合 `-l`，打印时按 SIZE 缩放大小；例如，`--block-size=M`\n-\
  \ `-B`, `--ignore-back`: 不列出以 `~` 结尾的项\n- `-c`: 配合 `-lt`：排序并显示 `ctime`（文件状态的最后修改时间）；配合\
  \ `-l`：显示 `ctime` 并按名称排序；否则：按 `ctime` 排序，最新的在前\n- `-C`: 按列列出条目\n- `--color[=WHEN]`:\
  \ 输出上色；WHEN 可以是 'always'（省略时的默认值）、'auto' 或 'never'\n- `-d`, `--directory`: 列出目录本身而不是其内容\n\
  - `-D`, `--dired`: 生成为 Emacs dired 模式设计的输出\n- `-f`: 不排序，启用 `-aU`，禁用 `-ls --color`\n\
  - `-F`, `--classify`: 在条目后附加指示符（`*/=>|` 之一）\n- `--file-type`: 同样，但不附加 `*`\n- `--format=WORD`:\
  \ 跨越 `-x`、逗号 `-m`、水平 `-x`、长 `-l`、单列 `-1`、详细 `-l`、垂直 `-C`\n- `--full-time`: 类似于 `-l\
  \ --time-style=full-iso`\n- `-g`: 类似于 `-l` 但但不列所有者\n- `--group-directories-first`:\
  \ 在文件前分组目录；可以使用 `--sort` 选项增强，但使用 `--sort=none` 会取消分组\n- `-G`, `--no-group`: 在长列表中，不打印用户和组组名\n\
  - `-h`, `--human-readable`: 配合 `-l` 和 `-s`，打印如 `1K`、`234M`、`2G` 等大小\n- `-si`: 同样，使用\
  \ 1000 的幂\n- `-H`, `--dereference-command-line`: 跟踪命令行中的符号链接\n- `--dereference-command-line-symlink-to-dir`:\
  \ 跟踪指向目录的符号链接\n- `--hide=PATTERN`: 不列出匹配 `PATTERN`（被 `-a` 或 `-A` 覆盖）\n- `--hyperlink[=WHEN]`:\
  \ 超链接；WHEN 可以是 'always'（默认）、'auto' 或 'never'\n- `--indicator-style=WORD`: 为条目附加指示符：none（默认）、斜杠\
  \ (`-p`）、文件类型 (`--file-type`）、分类 (`-F`）\n- `-i`, `--inode`: 打印文件的索引号\n- `-I`, `--ignore=PATTERN`:\
  \ 不列出匹配 shell `PATTERN` 的项\n- `-k`, `--kibytes`: 默认使用 1024 字节块；仅用于 `-s` 和目录总计\n\
  - `-l`: 使用长列表格式\n- `-L`, `--dereference`: 显示符号链接信息时，显示所引文件而非链接本身\n- `-m`: 用逗号分隔列表列出条目\n\
  - `-n`, `--numeric-uid-gid`: 类似于 `-l` 但列出数字用户和组 ID\n- `-N`, `--literal`: 不带引号打印条目名\n\
  - `-o`: 列出信息\n- `-p, --indicator-style=slash`: 在目录后附加斜杠\n- `-q`, `--hide-chars`:\
  \ 显示非图形字符\n- `--show-control-chars`: 原样显示非图形字符（默认，除非 `ls` 输出到终端）\n- `-Q`, `--quote-name`:\
  \ 用双引号括条目名\n- `--quoting-style=WORD`: 使用引号方式：literal, shell, shell-always, shell-escape,\
  \ shell-escape-always, c, escape（覆盖 `QUOTING_STYLE` 环境变量）\n- `-r`, `--reverse`:\
  \ 排序时反转\n- `-R`, `--recursive`: 递归列出子目录\n- `-s`, `--size`: 每个文件的分配大小，以块计\n- `-S`:\
  \ 按文件大小排序，最大的在前\n- `--sort=WORD`: 按 WORD 而非名称排序：none (-U), size (-S), time (-t),\
  \ version (-v), extension (-X)\n- `--time=WORD`: 更改默认使用修改时间；访问时间 (-u): atime, access,\
  \ use；状态时间 (-c): ctime, status\n\n\n\n\n\n`birth time: birth, creation;`\n\n使用 `-l`，`WORD`\
  \ 决定显示哪种时间；\n\n使用 `--sort=time`，按 `WORD` 排序（最新优先）\n\n`--time-style=TIME_STYLE` 配合\
  \ `-l` 的时间/日期格式；见下文的 `TIME_STYLE`\n\n`-t` 按时间排序，最新优先；见 `--time`\n\n`-T, --tabsize=COLS`\
  \ 假设制表符在每个 `COLS` 处停止，而非 8\n\n`-u` 与 `-lt` 配合：按访问时间排序并显示；\n使用 `-l`：显示访问时间并按名称排序；\n\
  否则：按访问时间排序，最新优先\n\n`-U` 不排序；按目录顺序列出条目\n\n`-v` 对文本中的数字（`(version)`）进行自然排序\n\n`-w,\
  \ --width=COLS` 设置输出宽度为 `COLS`。`0` 表示无限制\n\n`-x` 按行而非按列列出条目\n\n`-X` 按扩展名字母顺序排序\n\
  \n`-Z, --context` 打印每个文件的任何安全上下文\n\n`-1` 每行列出一个文件。在配合 `-q` 或 `-b` 时避免 `'\\n'`\n\n\
  `--help` 显示此帮助并退出\n\n`--version` 输出版本信息并退出\n\n`SIZE` 参数是一个整数和一个可选单位（例如：`10K` 是 `10*1024`）。\n\
  \n单位为 `K`、`M`、`G`、`T`、`P`、`E`、`Z`、`Y`（1024 的幂）或 `KB`、`MB`...（1000 的幂）。\n\n可以使用二进制前缀：`KiB=K`、`MiB=M`\
  \ 等。\n\n`TIME_STYLE` 参数可以是 `full-iso`、`long-iso`、`iso`、`locale` 或 `+FORMAT`。\n\n\
  `FORMAT` 的解释方式类似于 `date(1)`。如果 `FORMAT` 为 `FORMAT1<newline>FORMAT2`，则 `FORMAT1`\
  \ 应用非最近文件，`FORMAT2` 应用最近文件。\n\n以 `'posix-'` 为前缀的 `TIME_STYLE` 仅在 `POSIX` 语言包之外生效。\n\
  \n此外，`TIME_STYLE` 环境变量设置默认使用的样式。\n\n使用颜色区分文件类型在默认情况下和使用 `--color=auto` 时均被禁用。使用\
  \ `--color=auto` 时，`ls` 仅在标准输出连接到终端时输出颜色代码。`LS_COLORS` 环境变量可以更改设置。使用 `dircolors`\
  \ 命令来设置它。\n\n退出状态：\n`0` 表示正常，\n`1` 表示有小问题（例如：无法访问子目录），\n`2` 表示严重故障（例如：无法访问命令行参数）。\n\
  \nGNU coreutils 在线帮助：`<https://www.gnu.org/software/coreutils/>`\n\n完整文档 `<https://www.gnu.org/software/coreutils/ls>`\n\
  \n或通过本地可用：`info '(coreutils) ls invocation'`\n\n```\nmariomeraz@raspberrypi:~ $\
  \ \n```\n\n# 通用输入/输出 (GPIO)\n\n通用输入/输出 (`GPIO`) 旨在与硬件交互，将树莓派连接到低层外设。这些引脚可以根据需求从任何开发环境或编程语言进行控制。`GPIO`\
  \ 是与真实世界的接口。`GPIO` 功能在树莓派版本之间有所变化，例如在树莓派版本 1 上有 26 个引脚，而在树莓派 4 上有 40 个引脚。最顶的一排引脚设计为外部设备提供电源。此外，`GPIO`\
  \ 端口中还有几个引脚。\n\n![包含文本、电路的图片](img/image0293.jpeg)\n\n所有的 GPIO 端口都是多用途，某些引脚预留给 `5V`、`3.3V`\
  \ 和地。还有其他具有特殊功能的 GPIO 端口。此 `GPIO` 能够进行硬件脉宽调制 (`PWM`)，通常此端口用于控制灯等。\n\n| `GPIO` |\
  \ 规格 | 说明 |\n| :--- | :--- | :--- |\n| `3V3` | 3.3 伏 | 连接到这些引脚的任何内容将始终获得 `3.3V`\
  \ |\n| `5V` | 5 伏 | 连接到这些引脚的任何内容将始终获得 `5V` |\n| `GND` | 地 | 用于完成电路 |\n| `GP2` |\
  \ `GPIO 2` | 这些引脚用于通用，可以配置为输入或输出 |\n| `ID_SC/ID_SD/DNC` | 特殊用途 | 某些预留给 `5V`、`3.3V`\
  \ 和地 |\n\nPython 脚本中常用的引脚命名规范可以手动设置。`BCM (Broadcom)` 或物理的 `BOARD`。处理 `GPIO` 命名问题的最佳实践是选择一种规范并坚持使用它。例如：`GPIO.setmode(GPIO.BCM)`。要使用下面这些内容之一，需要下载代码、配置并安装。\n\
