  ## 无硬件启动\n\n有一种在没有外设设备的情况下安装 Linux 的选项，即通过网络启动。这种方法被称为 `PXE`（预启动执行环境）。此功能是某些 CPU\
  \ 处理器上的某种固件，它会扫描网络以寻找 `NBP`（网络引导程序）。尽管为了让 `PXE` 工作，网络上需要启用 `DCHP` 和 `TFTP` 服务，以及相应的启动文件。\n\
  \n## Udev\n\n`Udev` 是一个后台进程，在 `/dev` 位置创建设备节点并与硬件交互。程序通过 `D-Bus` 与 `Udev` 交互，`D-Bus`\
  \ 是一种进程间通信系统（IPC），允许程序之间发送消息。其中一个例子是桌面环境，它可以向 `D-Bus` 请求状态，以知道是否有新设备插入，因此当用户插入任何硬件时，`D-Bus`\
  \ 会从“Udev”收集此状态信息，然后通知桌面进程显示对话框或启动应用程序。\n\n## 以太网连接\n\n带有以太网端口的树莓派。树莓派可以通过以太网线通信。有一个包包含了名为\
  \ `avahi-daemon` 的守护进程零配置软件。\n\n```bash\nmariomeraz@raspberrypi:$ sudo apt install\
  \ avahi-daemon\nReading package lists... Done\nBuilding dependency tree... Done\n\
  Reading state information... Done\navahi-daemon is already the newest version (0-5).\n\
  The following package was automatically installed and is no longer required:\n \
  \ lib2\nUse 'sudo apt autoremove' to remove it.\n0 upgraded, 0 newly installed,\
  \ 0 not remove.\n```\n\n```bash\nmariomeraz@raspberrypi:$\n```\n\n如果由于任何原因需要自定义键盘布局，以下命令序列将非常有用：\n\
  \n```bash\nmariomeraz@raspberrypi:$ sudo dpkg-configure keyboard-configuration\n\
  ```\n\n当一个服务通常开始持续运行运行时，`/etc/services` 文件列出了网络服务和常用的子网服务。`IANA`（互联网分配编号机构）维护着所有注册服务的数据库。在可执行文件方面，大多数守护进程存储在\
  \ `/usr/sbin` 中。命名规范规定，许多它们应该以字母 `d` 结尾，以区别于实用程序。为了在本地系统中查找守护进程，需要在 `/usr/sbin/`\
  \ 中进行搜索。守护进程（Daemon）是在后台运行的，，这些服务负责监控 Linux 系统并为进程提供功能。由于守护进程在后台运行，这些服务是更值得探索的，而且你知道\
  \ `MIT`（马诸塞理工学院）是创造“Daemon”这一名称的人。\n\n一些守护进程可以在 `/run` 文件夹中找到。\n\n```bash\nmariomeraz@raspberrypi:/run\
