  \ time\n\nDHT_SENSOR = Adafruit_DHT.DHT11\nDHT_PIN = 4   # 正在使用的 GPIO PIN #\n\n\
  #measurements #\n\nwhile True:\n    humidity, temperature = Adafruit_DHT.read(DHT_SENSOR,\
  \ DHT_PIN)\n    if humidity is not None and temperature is not None:\n        print(\"\
