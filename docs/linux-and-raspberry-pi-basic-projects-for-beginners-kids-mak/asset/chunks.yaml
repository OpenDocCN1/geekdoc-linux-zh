    \n## Python First Steps\n\nOnce that we open Thonny the triple chevron (`>>>`)\
    \ is the interactive prompt, which means the interpreter is waiting for the instructions.\n\
    \nLet’s follow these steps:\n\nType the following:\n\n```python\n>>> print (“\
    \ Hello World”)\n```\n\nHit Enter, then python will execute the statement.\n\n\
    Result:\n\n```python\n>>> Hola World\n```\n\n![Icon Description automatically\
    \ generated](Images/image00269.jpeg)![A picture containing icon Description automatically\
    \ generated](Images/image00268.jpeg)\n\n## What are Imports in Python?\n\nImporting\
    \ refers to allowing a Python file or a Python module to access the script from\
    \ another Python file or module. Imports in Python are important for structuring\
    \ your code effectively.\n\nThere are generally three groups:\n- **Standard library\
    \ imports**: Python's built-in modules\n- **Third party imports**: Modules that\
    \ are installed and do not belong to the current application.\n- **Local application\
    \ imports**: Modules that belong to the current application\n\n### Example with\
    \ imports\n\n```python\n>>> import math\n>>> radius = 200\n>>> radius *2 *math.pi\n\
    1256.6370614359173\n```\n\n![Icon Description automatically generated](Images/image00296.jpeg)\n\
    ![Icon Description automatically generated](Images/image00267.jpeg)\n\n## Edit\
    \ Options in Thonny Python\n\nIndentation is Important for Python. Indentation\
    \ refers to the spaces at the beginning of a code line. Where in other programming\
    \ languages the indentation in code is for readability only, although the indentation\
    \ in Python is very important. Python uses indentation to indicate a block of\
    \ code.\n\nThe indentations errors are pointed out as below:\n\n```\n        ^\n\
    IndentationError: expected an indented block\n```\n\nTo start a new program, select\
    \ `File -> New Window` and Thonny will provide the scrip editing window.\n\nThe\
    \ Files, Scripts, and python programs are saved with the extension (`.py`).\n\n\
    Example: `NewScript.py`\n\nTo run this script in the terminal it is needed to\
    \ type the following:\n\n```bash\nmariomeraz@raspberrypi:~ $ python NewScript.py\n\
    ```\n\nIn my opinion if you reached to this point, then you are ready to start\
    \ putting together projects, since you have already gone through the basic mechanics\
    \ and more to understand Linux environments, basic python principles and fundamental\
    \ concepts to create projects, remember the sky is the limit.\n\n## Python Object\
    \ and Modules\n\nIn python the strings, lists, functions, modules and even numbers\
    \ are objects. A python object can be conceptualized as an encapsulated collection\
    \ of attributes and methods. An object is a combination of data and behaviors\
    \ that has a name. Python is a clean language with 34 reserved keywords. These\
    \ keywords in the table below are the core part of the language that let you structure\
    \ and control the flow of activities in a python script. Everything that isn’t\
    \ a keyword can be considered an object.\n\n### Python 34 Reserved Keywords\n\n\
    | CONDITIONALS | CLASSES, FUNCTIONS, MODULES | ERROR HANDLING | LOOPS | BUILD\
    \ |\n| :--- | :--- | :--- | :--- | :--- |\n| And | Class | Try | As | Del |\n\
    | Else | Def | Except | Break | Pass |\n| Elif | Global | Finally | Continue |\
    \ Print |\n| Not | Lambda | Raise | In | |\n| Or | Nonlocal | Assert | For | |\n\
    | If | From | With | While | |\n| Is | Import | | | |\n| True | Return | | | |\n\
    | False | Yield | | | |\n| None | | | | |\n\n`help()` instruction provides information\
    \ about the topics below:\n\n```python\n>>> help (\"print\")\n>>> help (\"topics\"\
    )\n>>> help (\"keywords\")\n>>> help (\"modules\")\n```\n\n# All about Raspberry\
    \ pi Projects\n\nThere is a lot to discuss in this chapter, this is all about\
    \ the projects that you will be able to put together whit the Raspberry pi , a\
    \ prototype board, a couple of cables, some sensors, and peripherals such as displays\
    \ and the raspberry-pi camera and voila!!\n\nThis mini touch screen (features\
    \ a 2.8\" display with 320x240) which is being sold in Amazon or other places\
    \ and it is very simple to put it together, it is just a matter of ensembled it\
    \ and insert the SD card with image of the operating system.\n\n![A picture containing\
    \ text, electronics Description generated](Images/image00297.jpeg)\n\n## GitHub\n\
    \nGitHub is an Internet hosting service for software development and version control\
    \ using Git. It provides the distributed version control of Git plus access control,\
    \ bug tracking, software feature requests, task management, continuous integration,\
    \ and wikis for every project.\n\nWe will use github just as an additional tool\
    \ for the people who would like to copy the code of the projects the main link\
    \ is the one below:\n\n[https://github.com/mariomeraztechauthor/Linux_Raspberrypi_Book](https://github.com/mariomeraztechauthor/Linux_Raspberrypi_Book)\n\
    \n![Graphical user interface, text, application, website Description generated](Images/image00298.jpeg)\n\
