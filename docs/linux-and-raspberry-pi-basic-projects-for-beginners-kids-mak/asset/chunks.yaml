    | GND | 连接至 `PIN 34` [GND] |\n| VCC+ | 连接至 `PIN 17` [3.3 V] [POWER] |\n| SCL |\
    \ 连接至 `PIN 5` [GPIO3] [SCL1] [I2C] |\n| SDA | 连接至 `PIN 3` [GPIO2] [SDA1] |\n\n\
    ### 步骤 5. 带有 BMP085 兼容信息的 BMP180 Python 代码\n\n该代码可以在 GitHub 上：\n\n```python\n\
    #!/usr/bin/python\nimport Adafruit_BMP.BMP085 as BMP085 # BMP 库\nsensor = BMP085.BMP085()\n\
    print 'Temp = {0:02f} *C'.format(sensor.read_temperature()) # 温度\nprint 'Pressure\
    \ = {0:02f} Pa'.format(sensor.read_pressure()) # 压力\nprint 'Altitude = {0:02f}\
    \ m'.format(sensor.read_altitude()) # 海拔\n```\n\n运行 Python 脚本的输出：\n\n```\n>>>\
    \ %Run sensor180.py\nTemperature: 23.50 C\nPressure: 1009.03 hPa\nAltitude: 43.27\n\
    ```\n\n## 使用树莓派摄像头的项目\n\n`Raspberry Pi Camera V2` 配备固定焦距 800 万像素 `IM219` 传感器，它可以拍摄\
    \ 3280×2464 像素的静态图像，并支持 1080p30、720p60 和 640×480p90 视频。摄像头兼容所有树莓派板，但要在 Pi Zero\
    \ 上使用，需要一根适配线。\n\n```\nmariomeraz@raspberrypi: ~ $ sudo apt-get install python-picamera\n\
    读取软件包列表... 完成\n构建依赖树\n读取状态信息... 完成\npython-picamera 已经是最新版本 (1.13)。\n以下软件包已自动安装且不再需要：\n\
