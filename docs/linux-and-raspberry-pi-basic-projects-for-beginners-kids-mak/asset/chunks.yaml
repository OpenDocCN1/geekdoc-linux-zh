    Use ''sudo apt autoremove'' to remove it.


    0 upgraded, 0 newly installed, 0 to remove and 70 not upgraded.


    mariomeraz@raspberrypi:/ $


    Keyboard Hint


    ![A picture containing icon Description automatically generated](Images/image00268.jpeg) 
    If for any reason the keyboard layout needs to be customized, the following sequence
    of commands will be useful.


    Keyboard Configuration


    mariomeraz@raspberrypi:/ $ sudo dpkg-reconfigure keyboard-configuration


    The following screen will pop-up


    ![Graphical user interface, text, application Description automatically generated](Images/image00285.jpeg)


    Daemon


    When a service request comes in normally a daemon is tarted automatically running
    continuously the Linux internet services. The /etc/services file lists network
    services and the commonly used subnet of services. The IANA (Internet Assigned
    Numbers Authority) maintains a database of all registered services.


    [https://www.iana.org/](https://www.iana.org/)


    ![Graphical user interface Description automatically generated with medium confidence](Images/image00286.jpeg)


    In terms of the executable files, most of the daemons are stored in /usr/sbin.
    The naming convention specifies that the names for many of them should end with
    the letter (d) to distinguish them from utilities. In order to look for the daemon
    programs on the local system it is needed to search at /usr/sbin/ *d


    ![A picture containing icon Description automatically generated](Images/image00268.jpeg)
    A Daemon is a Service Process which runs in the background and these Daemon services
    supervises the Linux system which provides functionalities to the process in the
    system. Since the Daemons run in the background by hackers these services are
    preferred to be explored by Hackers, and you know what?  MIT (Massachusetts Institute
    of Technology) Hackers were the ones who coined the “Daemon” name.


    Some of the Daemons can be found inside the run folder.


