    # General Purpose Input Output (GPIO)


    The General-Purpose Input Output (GPIO) are intended to be used to interact with
    hardware connecting the Raspberry pi to low level peripherals. These pins can
    be controlled from any development environment or programming language based on
    functionalities and requirements. The GPIOs are the interface with the real world.
    The GPIO Pins function has changed among different Raspberry Pi versions, for
    instance on the raspberry pi version 1 we there are 26 Pins, whereas in the raspberry
    pi version 4 there’re 40 Pins. The GPIO pins are standard designed to control
    input and output behavior with all kinds of integrated circuits. The very top
    row of pins is designed to offer power to external devices. Also, there are several
    ground pins located in the GPIO port.


    ![A picture containing text, electronics, circuit Description automatically generated](Images/image00293.jpeg)


    | GPIO | Specification | Description |


    | 3V3 | 3.3 volts | Anything connected to these pins will always get 3.3V of power
    |


    | 5V | 5 volts | Anything connected to these pins will always get 5V of power
    |


    | GND | ground | Zero volts, used to complete a circuit |


    | GP2 | GPIO pin 2 | These pins are for general-purpose use and can be configured
    as input or output pins |


    | ID_SC/ID_SD/DNC | Special purpose pins |  |


    Naming Conventions


    All the GPIO ports are multipurpose, some pins are reserved for 5V, 3.3V and ground.
    There are other GPIO ports with special capabilities. There are some especial
    naming conventions like GPIO 18, also known as pin 12 and PCM_CLK. This pin is
    capable of hardware pulse-width modulation (PWM), and normally this port is used
    for controlling LED lights and motors among other things.


    The pin-naming conventions that is commonly used in the Python scripts can be
    set manually. BCM (Broadcom) Pin Name or the physical pin locations (BOARD) can
    be set. The best practice to deal with the GPIO pin-naming issues is to choose
    a convention and stick with it. For instance: GPIO.setmode (GPIO.BCM)


    To use one of these packages below it is needed to download the code, configure
    the package and install it.


    | Module | Description | URL | Package Name |


    | RPi.GPIO | GPIO Pins | https://sourceforge.net/projects/raspberry-gpio-python/
    | Python-rpi.gpio |


    | SimpleCV | Easy API for Computer Vision | http://simplecv.org/ |  |


    | Scipy | Scientific Computing | https://scipy.org/download/ | Python-scipy |


    | Flask | Microframework for web development | https://flask.palletsprojects.com/en/2.1.x/
    | Python-flask |


    | Pygame | Gaming Framework | https://www.pygame.org/wiki/GettingStarted | Python-pygame
    |


    | WxPython | GUI framework | https://wxpython.org/ | Python-wxgtk2.8 |


    | PySerial | Access to serial ports | https://pyserial.readthedocs.io/en/latest/
    | Python-serial |


    | PyUSB | FTDI-USB interface | https://pypi.org/project/pyusb/ |  |


