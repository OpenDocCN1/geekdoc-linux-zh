  trans: "\n\n## 漏洞与标志\n\n- **漏洞 L1tf**: 不受影响\n- **漏洞 Mds**: 不受影响\n- **漏洞 Meltdown**:\
    \ 不受影响\n- **漏洞 Spec store bypass**: 不受影响\n- **漏洞 Spectre v1**: 缓解；`__user pointer\
    \ sanitization`\n- **漏洞 Spectre v2**: 存在漏洞\n- **漏洞 Srbds**: 不受影响\n- **漏洞 Tsx async\
    \ abort**: 不受影响\n\n**标志**: `half thumb fastmult vfp edsp neon vfpv3 tls vfp v4\
    \ idiva idivt vfpd32 lpae evtstrm crc32`\n\n## Linux 系统概述\n\n```bash\nmariomeraz@raspberrypi:~\
    \ $ \n```\n\n这里所表达的某些命令在 LPI 认证（Linux 专业协会）中列出，该协会是一个提供 Linux 系统和架构相关考试和资质认证的非营利组织。\n\
    \n尽管书中的材料并不能让你完全准备好参加 `LPI 认证`，但所呈现知识的逻辑和方法遵循了 `LPI 认证` 关于通用系统管理、硬件配置、包管理、命令行和进程处理的级别。如果你已经使用和玩了\
    \ Linux 一段时间，也许你已经有些熟悉了，尽管如此仍然值得过一遍，以防可能遗漏了某些知识点。\n\n这些书中的某些命令行输出对于红帽企业 Linux\
    \ (`RHEL`)、CentOS 以及 Debian 等版本都是用的。基于 Linux 架构的开放系统提供了有关设备和外围的信息。\n\n## 虚拟文件系统\n\
    \n由 `Kernel`（内核）创建的虚拟目录包含关于运行进程和硬件设备的信息，例如 `/proc` 侧重于提供关于进程的信息（如在系统上运行的 `read`\
    \ 程序），而 `/sys` 则涵盖了硬件设备。\n\n**注意**: 在 Linux 和 Unix 系统中都有一种说法：如果没有消息，就说明是好消息。\n\
    \n## 探索 /proc\n\n```bash\nmariomeraz@raspberrypi:~ $ cd /proc\nmariomeraz@raspberrypi:/proc\
    \ $ ls\n```\n\n```text\n1 1734 2038 234 391 561 71 85 cpuinfo misc\n10 1736 205\
    \ 237 392 574 72 853 crypto modules\n100 1737 2055 238 393 582 732 87 devices\
    \ mounts\n1086 1739 2057 239 394 6 74 88 device-tree net\n1087 1762 2058 240 399\
    \ 605 75 883 diskstats pagetypeinfo\n1092 1763 2059 241 4 606 754 887 driver partitions\n\
    11 1765 206 25 40 61 757 892 execdomains schedstat\n1159 1783 2061 252 400 62\
    \ 76 896 fb self\n2 18 2065 26 404 62 77 896 files slabinfo\n20 1807 207 27 405\
    \ 63 773 90 fs softirqs\n222 1857 208 3 406 630 776 903 interrupts\n242 1906 209\
    \ 30 408 631 788 907 oem swaps\n13 193 2095 31 41 645 786 13 ports sys\n132 1941\
    \ 21 32 410 646 789 92 irq sysrq-trigger\n1378 195 2114 33 411 647 791 93 kallsyms\
    \ sysvipc\n1390 1952 2120 37 414 65 792 94 keys thread-self\n14 1964 2128 38 415\
    \ 658 8 95 key-users timer_list\n15 198 2135 380 434 659 80 99 kmsg tty\n16 2\
    \ 2140 382 466 66 801 asound kpagecgroup uptime\n163 20 2156 383 481 667 811 buddyinfo\
    \ kpagecount version\n1653 200 2157 384 484 67 811 bus kpageflags vmallocinfo\n\
    17 2027 2158 385 492 68 82 cgroups latency_stats vmstat\n1709 2028 22 386 493\
    \ 7 828 cmdline loadavg zoneinfo\n1710 2029 223 39 494 70 83 consoles consoles\
    \ locks\n1730 2034 28 390 57 705 84 cpu meminfo\n```\n\n## 探索 /sys\n\n任何计算机中的某些内部设备都位于一个称为\
    \ PCI 总线的数据传输通道上。在旧系统中，这些信息可以直观地所示：\n\n```bash\nmariomeraz@raspberrypi:/proc $\
    \ cd /sys\nmariomeraz@raspberrypi:/sys $ ls\n```\n\n```text\namba cpu i2c mmc\
    \ platform usb\ncec event_source iscs_node mmc_rpm scsi workqueue\nclock events\
    \ genpd mdio_bus nvmem sdio\nsource gpio media pci serial\ncontainer hid mipi-dsi\
    \ pci_express spi\n```\n\n在较新的发行版中，这些数据直接是不可读的，因此读取设备数据的合适命令是以下命令：\n\n```bash\n\
    mariomeraz@raspberrypi:/sys/bus cat /proc/pci\n```\n\n## 探索 /dev\n\n我将从这个核心概念开始：Unix\
    \ 和 Linux 系统的核心哲学是一切——我说的一切——都是文件。`/dev` 目录包含硬件设备节点，即代表设备的文件。\n\n```bash\nmariomeraz@raspberrypi:/sys\
    \ $ cd /dev\nmariomeraz@raspberrypi:/dev $ ls\n```\n\n```text\nautofs loop4 ram8\
    \ tty26 tty57 vcsa6\nblock loop5 ram9 tty27 tty58 vcsa7\nbtrfs-control loop6 random\
    \ tty28 tty59 vcsm-cma\nbus loop7 rfkill tty29 tty6 vcsu\ncachefiles loop-control\
    \ rpivid-h264mem tty3 tty60 vcsu1\ncec0 mapper rpivid-hevcmem tty30 tty61 vcsu2\n\
    cec1 media0 rpivid-intcmem tty31 tty62 vcsu3\nchar media1 rpivid-vpmem tty32 tty63\
    \ vcsu4\nconsole media2 serial1 tty33 tty7 vcsu5\nuse mem sh mmcblk0 tty4 tty8\
    \ vcsu6\ndisk mm mmcblk01 snd tty35 tty9 vcsu7\nma_heap mmcblk02 stderr tty36\
    \ tty0 vga_iter\ndri mmcblk02 stdin tty37 ttyprintk vhci\nfb0 mmcblk02 stdout\
    \ tty38 uhid video10\nfd net tty tty39 uinput video11\nfull null tty0 tty40 urandom\
    \ video12\nfuse port tty1 tty40 v4l video13\ngpio0 ppp tty10 tty41 vchiq video14\n\
    gpio1 ptmx tty11 tty42 vcio video15\ngpiomem pts tty12 tty43 vc-mem video16\n\
    hidraw0 ram0 tty13 tty44 vcs video18\nhidraw1 ram1 tty14 tty45 vcs1 video20\n\
    hidraw2 ram10 tty15 tty46 vcs2 video21\nwrng ram2 tty16 tty47 vcsa3\ni2c-20 ram3\
    \ tty17 tty48 vcsa4\ni2c-21 ram4 tty18 tty49 vcsa5\ninitctl ram5 tty19 tty50 vcsa6\n\
    input ram6 tty20 tty51 vcsa7\nkmsg ram7 tty21 tty52 vcsa8\nlog ram8 tty22 tty53\
    \ zero\n```\n\n某些设备被放置在子目录中，例如：\n\n```bash\nmariomeraz@raspberrypi:/dev $ ls snd\
    \ (声卡/芯片)\n```\n\n"
