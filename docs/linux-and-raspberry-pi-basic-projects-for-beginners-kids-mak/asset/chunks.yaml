    Hardware-less booting


    There is an option to install Linux without peripherals which is through network
    booting.  This method is called PXE (Pre-boot Execution Environment). This functionality
    is a sort of firmware on some CPU processes that scan the network for an NBP (Network
    Bootstrap Program). Although for the PXE to work, it will need the DCHP and TFTP
    servers enabled on the network along with the appropriate boot files.


    Udev


    Udev is a background process that creates device nodes and interfaces with hardware
    in the /dev location. The programs interact with the Udev via D-Bus, which is
    an inter-process communication system (IPC) which enable programs to send messages
    among themself. One example of this is in the desktop environment which can request
    status to the D-Bus to know if any new device has been plugged in, therefore the
    D-Bus collects this status information from the “Udev” when the user plugs in
    any hardware, therefore inform the process in the desktop to display a dialog
    box or launch an application.


    Ethernet Connection


    Raspberry Pi Models with Ethernet port. The Raspberry Pi can communicate via SSH
    with an Ethernet cable. There is a package that includes the zero-conf software
    with a daemon available called “avahi-daemon”


    mariomeraz@raspberrypi:/ $ sudo apt install avahi-daemon


