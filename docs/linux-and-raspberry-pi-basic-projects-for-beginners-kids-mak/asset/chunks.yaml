    ## 什么是物联网 (IoT)？


    根据维基百科：物联网是由物理设备、车辆、家用和其他许多物品组成的网络，这些物品嵌入了电子设备、软件、传感器、执行器和网络连接，使得这些物体能够连接并交换数据。


    - **传感器**：[数据采集与测量]

    - **有线或无线网络**：[通过网络传输数据]

    - **服务器**：[数据评估]

    - **用户交互**：基于评估的行动或响应


    物联网技术如今无处不在，生态系统丰富且延伸到几乎所有行业。如今，像路灯、垃圾桶、集装箱、摄像头、汽车、智能手表、医疗设备、智能电网、`Arduino` 和
    `raspberry` 等制作类型的小板也被认为是物联网设备，更不用说树木也连接到了物联网网络。


    据估计，到 2025 年，将有约 200 亿个物联网设备连接到任何类型的私有网络或公共网络（如互联网）。


    参考：IoT & 5G Architectures and Standards。

    Internet of Things, 5G Open RAN, 3GPP Standards & Industry 4.0, Mario Meraz 著。


    让我们从传感器的类型开始。我们将在下文中定义几种类型的传感器：


    ### 数字传感器与物联网


    在这里我们将讨论物联网（IoT）项目，因为通过传感器，我们可以将感测测量值引入互联网。


    `digital sensor`是一种电子或电化学传感器。传感器被用于许多物联网应用程序以收集外部值，数据以数字形式转换并传输。传感器经常用于分析性测量，例如温度、液体的化学和物理性质的测量。典型的测量参数是`pH
    值`、[电导率](https://en.wikipedia.org/wiki/Electrical_conductivity)、氧气甚至是“氧化还原电位”（它是衡量分子接受电子难易程度的指标）。


    ### 单线传感器 (One Wire Sensors)


    1-Wire 在概念上与 I²C 类似，但数据速率较低，范围更远。它通常用于与小型廉价设备通信，如数字温度计和气象仪器，以及其他对布线要求极的传感器。


    用于确认 1-wire 正常工作的 CLI 命令如下：


    ```bash

    mariomeraz@raspberrypi: ~ $ ls /sys/bus/w1/devices

    00-480000000000 00-880000000000 00-c80000000000 w1_bus_master1

    ```


    #### 1-Wire 数据传输的优缺点


    **优点**

    - 只需一个 `GPIO` 引脚

    - 一根数据线（加上地线和可能的电压）

    - 范围（200 米）

    - 价格低廉

    - 布线极少

    - 16.3 kbps


    **缺点**

    - 速度慢

    - 寄生电源

    - 部分 1-Wire 设备可以使用数据线上的电压进行充电

    - 需要板载电池或电容来存储电荷

    - 需要足够的“数据开启”时间来供电（数据关闭将不会充电）

    - 单线 `GPIO` - 7


    ### I2C 传感器


    I2C 总线是在两个电子设备之间传输数字数据的简单方法，这两个设备在物理上可以是分离的，也可以位于同一个打印电路板（PCB）上。


    每当共享的时钟信号变化时， I2C 设备就会交换数据位。当时钟从低电变为高电平时（称为时钟上升沿），控制器和外设备都会发送数据位。与 SPI 不同，它们不能同时发送数据。I2C
    或集成电路接口是一种简单的通信协议，通常用于嵌入式系统中主设备（或多个主设备）与单个从设备（或多个从设备）之间的数据传输。它是一种双向双线串行总线，在同步通信中使用串行时钟（`SCL`）和串行数据（`SDA`）线来逐位发送和管理连接到总线设备之间的数据。I2C
    协议的标准数据传输率为 100 kbps，尽管配置为“快速模式”或“超快速模式”的 I2C 设备数据速率可达 5 Mbps。


    ### SPI 传感器


    串行外设接口（Serial Peripheral Interface）是一种串行通信协议，通常用于嵌入式系统中总线上设备之间的高速数据交换。它采用主从模式运行，包括至少四个信号：时钟（`SCLK`）、主输出/从输入（`MOSI`）、主输入/从输出（`MISO`）和从选择（`SS`）信号。`SCLK`、`MOSI`
    和 `MISO` 信号由总线上所有的设备共享。`SCLK` 信号由主设备生成用于同步，而 `MOSI` 和 `MISO` 线用于数据交换。`SPI` 通信支持全双，意味着主从双方可以同时传输。


    ### 串口 (UART) 传感器


    UART 或通用异步收发器，是微控制器或单集成电路（`IC`）中的物理电路，用于实现嵌入式系统中设备之间的串行通信。本质上，UART 的主要目的是传输和接收串行数据。这些串行数据传输到接收设备上的
    UART。接收端 UART 将收到的串行数据转换回并行数据。为了让 UART 完成串转并行和并行转串的数据转换，使用了发送端和接收端 UART 上的移位寄存。在
    UART 通信中，只需要两根线即可通信：数据从发送端 UART 的 `Tx` 引脚（传输器 Tx）流向接收端 UART 的 `Rx` 引脚（接收器 Rx）。


    UART 数据以包的形式通过总线发送。一个包由起始位、数据帧、校验位和停止位组成。校验位作为错误检查机制，有助于确保数据完整性。UART 被认为是“通用的”，因为包括传输速度和数据速率在内的参数可以由开发者配置。


    UART 支持双向数据传输，包括半双工和平双工操作。它还是异步的，意味着它不需要时钟信号来同步从发送端 UART 到接收端 UART 的输出位。在没有时钟的情况下，接收和发送
    UART 需要相同的波特率（或比特率）。


