    ## Raspberry Pi Models & History


    ### Raspberry Chronology and History


    To know the past and the evolution of this amazing device lets go to a little
    review of the raspberry history and evolution to these days.


    | Year | 2012 | 2013 | 2014 | 2015 |

    | :--- | :--- | :--- | :--- | :--- |

    | Model | Model B | Model A | Model B+ | Model Zero |

    | Feature | Genesis Design | Simpler and Cheaper | Improved layout | Smaller and
    cheaper |


    | Year | 2015 | 2016 | 2017 | 2018 |

    | Model | Model 3B | Model 3B | Model Zero Wireless | Model 3A+/B+ |

    | Feature | More RAM (From to 2GB) | Faster, Wifi, BT | Wifi, Bluetooth | Faster,
    USB Boot |


    ### Raspbian OS Version History


    | Raspbian Operating System Version History | | | | |

    | :--- | :--- | :--- | :--- | :--- |

    | 2012 | 2015 | 2017 | 2019 | |

    | Wheezy | Jessie | Stretch | Buster | |


    ### Raspberry Pi 4 Model B


    A super charged Raspberry Pi that finally does everything you would want it to,
    for the exact same price as the previous models.


    While the raspberry Pi has enjoyed years of success, there’s always been a couple
    of things a lot of users wanted. A slightly more powerful CPU that could handle
    day-to-day computing, plenty of USB ports and maybe wireless to make connecting
    the network easier. The Pi 4 Model B comes with two micro-HDMI ports, this HDMI
    ports are capable of outputting 4K video, two `USDB 3.0` and two `USB 2.0` ports,
    one `USB-C` power input, one Ethernet port for wired internet, one headphone jack
    (3.5mm) for sound, and a 40-pin GPIO port.


    ![A picture containing electronics Description automatically generated](Images/image00270.jpeg)


    Pi 4 Model B files are compatible with files produced in previous Raspberry pi
    models. In this book we will work with a Raspberry Pi 4, although any model can
    be utilized.


    ### Raspberry 4


    * 64 Bit CPU

    * Faster (1.5 GHz)

    * More RAM (From 1,2, to 4 GB)

    * Gigabit Ethernet Ports

    * 2.4 GHz and 5 GHz WiFi

    * Bluetooth 5.0 / BLE

    * USB 3.0 Port

    * Dual, 4K HDMI Output

    * BCM2711 Chip


    The `BCM2711` chip of the Raspberry Pi 4 Model B is a quad-core 1.5 GHz processor.


    #### GPIO Port


    ![Icon Description automatically generated](Images/image00266.jpeg)

    40 pins in the GPIO Port. Lay out per Pinout.


    ![Table Description automatically generated](Images/image00271.jpeg)

    ![Graphical user interface, application Description automatically generated](Images/image00272.jpeg)

    Image taken from [https://www.raspberrypi-spy.co.uk/2012/06/simple-guide-to-the-rpi-gpio-header-and-pins/](https://www.raspberrypi-spy.co.uk/2012/06/simple-guide-to-the-rpi-gpio-header-and-pins/)


    #### Ethernet Port

    The Gigabit Ethernet for wired networks on the Pi 4 and Pi 3 Model B+ are three
    times faster than older Pi models.


    #### USB Ports

    Two `USDB 3.0` and two `USB 2.0` ports, one `USB-C` power input.


    #### Integrated Wireless

    The Pi 4 Model B has Wireless Capabilities for Wi-Fi and Bluetooth.

    * 802.11n wireless LAN

    * Bluetooth 5.0


    #### Micro SD Port

    For the Operating System Cards


    #### Micro-HDMI Ports

    The Raspberry Pi 4 Model B decode 4K video. Since the Raspberry Pi 4 Model B has
    two Micro-HDMI ports These can be used for dual-display.


    #### Headphone Jack

    3.5 mm


