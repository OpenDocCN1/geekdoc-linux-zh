    ## Installing Software


    ```bash

    mariomeraz@raspberrypi:$ tar zxvf fiel.tar.gz

    mariomeraz@raspberrypi:$ tar xjf file.tar.bz

    mariomeraz@raspberrypi$:./configure

    ```


    Whenever a program’s route code is unzipped, after zipped a Program, `cd` into
    that directory and `run ./configure`. This will verify that the system has everything
    it needs to compile the software. The cli command `make` will compile the software
    if is needed.


    ```bash

    mariomeraz@raspberrypi:$ (sudo) make install # This cli will move the newly compiled
    software into the appropriate place in the system so the user can run it like
    a normal cli command.

    ```


    ## Configuration


    ### Commands to write Data to RAM


    fstab for fast performance Configuration

    ```bash

    mariomeraz@raspberrypi:$ sudo nano /etc/fstab

    ```

    Addition of the following lines are to mount a virtual file system:

    ```text

    tmpfs /var/log tmpfs defaults,noatime,nosuid,mode=0755,size=100m 0

    ```

    After the `shutdown -r` process, the virtual system will be mounted on `var/log`
    on the RAM disk. There are other directories that can be moved to RAM as well
    and need to be added through `/etc/fstab` as follows:

    ```text

    Tmpfs /tmp tmpfs defaults,noatime,nosuid,size=100m 0

    Tmpfs /var/tmp tmpfs defaults,noatime,nosuid,size=30m 0

    Tmpfs /var/log tmpfs defaults,noatime,nosuid,mode=0755,size=100m 0

    Tmpfs /var/run tmpfs defaults,noatime,nosuid,mode=0755,size=2m 0

    Tmpfs /var/spool/queue tmpfs defaults,noatime,nosuid,mode=0700,size=100m gid=12,
    size=30m 0

    ```


