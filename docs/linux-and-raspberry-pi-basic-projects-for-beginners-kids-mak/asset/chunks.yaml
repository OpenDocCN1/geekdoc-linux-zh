    # Linux Systems and Architectures


    Linux systems have evolved tremendously over the last few years. Learning and
    mastering how the Linux operating systems could lead to anyone to job placements,
    promotions and merit pay increases. The Linux Architecture and logic is helpful
    not only to understand Linux systems, but also Cloud Architectures such as google
    cloud logic.


    This command “lscpu” is the utility to know the Architecture of the system. Along
    “lscpu”  fetches the CPU architecture information from the “sysfs” .


    mariomeraz@raspberrypi:~ $ lscpu


