    # Preface


    This book is all about educational purposes, this book is an attempt to democratize
    the tech knowledge. This book entails practical Linux Operating Systems knowledge,
    raspberry pi concepts ,tech-hacks and practical Internet of Things (IoT) projects
    with sensors, OLED displays and python scripts, even third-party solutions to
    send SMS like Twilio through Application Programming Interfaces (APIs).


    You maybe have seen the cover of this book and have thought for yourself , yet
    another book of raspberry pi , well yes, but not, and let me explain what is the
    intention of this book, basically this book has three objectives : learn Linux,
    start learning a raspberry-pi fundamentals and the third aspect is to be useful
    as a reference material around Linux Operating Systems , that’s the reason why
    I listed the whole output for some cli commands in order to provide a reference,
    another big aspect of this book is that I don’t make assumptions that everyone
    should know how to get from step A to step Z. I listed all the steps in order
    to level up the knowledge for the new linux, raspberry makers and enthusiasts
    or even professionals interested in brushing up your knowledge.


    Raspberry Pi is all about education. These devices have shown the value through
    numerous examples around education and learning of computing science concepts,
    Linux Systems, makers projects and even gaming and entertainment. The Raspberry
    Pi is one of the most exciting things to happen in combination and at the same
    time to the computer, electronics worlds and education field in recent years that
    have expanded the possibilities of creative maker projects but also real applications
    an industrial use cases.


    One personal motivation to put together this book is the fact that I consider
    a raspberry-pi a democratizer of the technical knowledge and I myself claim to
    be a democratizer of the technical knowledge, I really believe that the starting
    point for a technical career could be the technical knowledge learnt through a
    raspberry-pi projects.


    As an education tool, this tiny PC has reignited interest in bare-metal computing
    in schools, factories, homes and even some enterprises all over the world. As
    a platform for open-source software, it has also inspired millions of people to
    try Linux, many for the fists time. Most exciting of all is the potential to incorporate
    the device into practical projects, as demonstrated by this book.


