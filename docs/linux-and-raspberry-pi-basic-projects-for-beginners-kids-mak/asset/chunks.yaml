    \ ~ sudo usermod pi -aG docker\n```\n\n### GitHub clone repository\n```bash\n\
    mariomeraz@raspberrypi: ~ apt-get update && apt-get install git jq\nmariomeraz@raspberrypi:\
    \ ~ sudo apt update\n```\nGet:1 httpss://download.docker.com/linux/raspbian buster\
