    ## What is the internet of Things (IoT)?


    According to Wikipedia: The internet of things is the network of physical devices,
    vehicles, home appliances and many other items embedded with electronics, software,
    sensors, actuators, and network connectivity which enable these objects to connect
    and exchange data.


    - **Sensor**: [Data Collection & Measurement]

    - **Wired or Wireless Network**: [Transmission of Data through network]

    - **Server**: [Data Assessment]

    - **User Interaction**: [Action or response based on assessment]


    The IoT technologies are nowadays everywhere, and the ecosystem is rich and extended
    to almost all industries, these days currently things as streets lights, trash
    cans, containers, caws, cars, smartwatch’s, medical devices, smart grids, makers-types
    small boards such as `Arduino` and `raspberry` are considered IoT devices as well,
    needless to say trees are connected to the internet of things networks.


    There are estimations that by 2025 around 20 billion of IoT will be connected
    to any type of network either private or public network such as the internet.


    Reference: IoT & 5G Architectures and Standards.

    Internet of Things, 5G Open RAN, 3GPP Standards & Industry 4.0, by Mario Meraz.


    Let’s start off with the types of sensors. There are several types of sensors,
    which we will define below:


    ### Digital Sensors & IoT


    Here is where we will discuss the projects that are IoT (Internet of Things) Projects
    since through sensors we can bring sensed measurements to the internet.


    A `digital sensor` is an electronic or electrochemical sensor. Sensors are being
    used in many IoT applications to collect external values, where data is digitally
    converted and transmitted. Sensors are often used for analytical measurements,
    for example the measurement of temperatures, chemical and physical properties
    of liquids. Typical measured parameters are `pH value`, `[conductivity](https://en.wikipedia.org/wiki/Electrical_conductivity)`,
    oxygen, or even “redox potentials” which is a measure of the ease with which a
    molecule will accept electrons and others.


    ### One Wire Sensors


    1-Wire is similar in concept to I²C, but with lower data rates and longer range.
    It is typically used to communicate with small inexpensive devices such as digital
    thermometers and weather instruments among other sensors that require minimal
    wiring.


    The CLI command to confirm 1-wire is working properly is the one below:


    ```bash

    mariomeraz@raspberrypi: ~ $ ls /sys/bus/w1/devices

    00-480000000000 00-880000000000 00-c80000000000 w1_bus_master1

    ```


    #### 1-Wire Data Transmission Advantages and Disadvantages


    **Advantages**

    - Only requires one `GPIO` pin

    - One Data Wire (plus ground and possibly voltage)

    - Log Range (200 meters)

    - Inexpensive

    - Minimal wiring

    - 16.3 kbps


    **Disadvantages**

    - Low Speed

    - Parasitic Power

    - Some 1-Wire devices can use Voltage on Data line to charge

    - Requires an onboard battery or capacitor to store the charge

    - Requires enough “data-on” to supply voltage (data-off will not charge)

    - One -Wire `GPIO` - 7


    ### I2C Sensor


    The I2C bus is a simple and flexible way to transfer digital data between two
    electronic devices which may be physically separate or contained on the same printed
    circuit board (PCB).


    I2C devices exchange bits of data whenever the shared clock signal changes. Controllers
    and peripheral devices both send bits of data when the clock changes from low
    to high (called the rising edge of the clock). Unlike with SPI, they cannot send
    data at the same time. I2C or Inter-Integrated Circuit, is a simple communication
    protocol often used in embedded systems to transfer data between a master (or
    multiple masters) and a single slave (or multiple slaves) device. It is a bidirectional
    two-wire serial bus that uses serial clock (`SCL`) in synchronous communication
    and serial data (`SDA`) wires to send and manage data bit by bit between devices
    connected to the bus. The standard data transfer rate of the I2C protocol is 100
    kbps, although data speeds of up to 5 Mbps are possible with I2C devices configured
    in "fast mode" or "ultra-fast mode".


    ### SPI Sensor


    Serial Peripheral Interface is a serial communication protocol often used in embedded
    systems for high-speed data exchanges between devices on the bus. It operates
    using a master-slave paradigm that includes at least four signals: a clock (`SCLK`),
    a master output/slave input (`MOSI`), a master input/slave output (`MISO`), and
    a slave select (`SS`) signal. The `SCLK`, `MOSI`, and `MISO` signals are shared
    by all devices on the bus. The `SCLK` signal is generated by the master device
    for synchronization, while the `MOSI` and `MISO` lines are used for data exchange.
    The `SPI` communication supports full-duplex, meaning that both the master and
    slave can transmit simultaneously.


    ### Serial (UART) Sensor


    UART, or Universal Asynchronous Receiver/ Transmitter, is a physical circuit in
    a microcontroller or single integrated circuit (`IC`) that is used to implement
    serial communication between devices in an embedded system. Essentially, a UART’s
    main purpose is to transmit and receive serial data. This serial data is transmitted
    to the UART on the receiver device. The receiving UART converts the received serial
    data back to parallel data. For UART to convert serial-to-parallel and parallel-to-serial
    data, shift registers on the transmitting and receiving UART are used. In UART
    communication, only two wires are required for communication: data flows from
    the `Tx` pin of the transmitting UART (Transmitter Tx) to the `Rx` pin of the
    receiving UART (Receiver Rx).


    UART data is sent over the bus in the form of a packet. A packet consists of a
    start bit, data frame, a parity bit, and stop bits. The parity bit is used as
    an error check mechanism to help ensure data integrity. UART is considered to
    be “universal” because the parameters including transfer speed and data speed
    are configurable by the developer.


    UART supports bidirectional data transmission, including half-duplex and full-duplex
    operations. It is also asynchronous, meaning it doesn’t use a clock signal to
    synchronize the output bits from the transmitting UART to the receiving UART.
    Without a clock, the receiving and transmitting UART need to be on the same baud
    rate, or bit rate.

