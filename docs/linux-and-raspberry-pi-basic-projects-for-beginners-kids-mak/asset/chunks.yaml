    \ kill 6077\n```\n\n![自动生成的图标描述\n\n# Linux 命令\n\n获取 Linux 知识的更多方法：以下两个命令对于增加 Linux\
    \ 命令知识至关重要。\n\n`man` 命令提供了命令的完整描述和选项：\n\n```bash\nmariomeraz@raspberrypi:$ man\
    \ ls\nmariomeraz@raspberrypi:$ ls -help\nmariomeraz@raspberrypi:~ $ ls --help\n\
    ```\n\n## ls 使用\n\n`ls [OPTION]... [FILE]...`\n\n列出关于 `FILE` 的信息（默认认为当前目录）。如果没有指定\
    \ `-ftSUX` 或 `--sort`，则按字母顺序对条目。\n\n- `-a`, `--all`: 不忽略以 `.` 开头的项\n- `-A`, `--almost-all`:\
    \ 不列出 `.` 和 `..`\n- `--author`: 配合 `-l`，打印每个文件的作者\n- `-b`, `--escape`: 为图形字符打印\
    \ C 风格的转义字符\n- `--block-size=SIZE`: 配合 `-l`，打印时按 SIZE 缩放大小；例如，`--block-size=M`\n\
    - `-B`, `--ignore-back`: 不列出以 `~` 结尾的项\n- `-c`: 配合 `-lt`：排序并显示 `ctime`（文件状态的最后修改时间）；配合\
    \ `-l`：显示 `ctime` 并按名称排序；否则：按 `ctime` 排序，最新的在前\n- `-C`: 按列列出条目\n- `--color[=WHEN]`:\
    \ 输出上色；WHEN 可以是 'always'（省略时的默认值）、'auto' 或 'never'\n- `-d`, `--directory`: 列出目录本身而不是其内容\n\
    - `-D`, `--dired`: 生成为 Emacs dired 模式设计的输出\n- `-f`: 不排序，启用 `-aU`，禁用 `-ls --color`\n\
    - `-F`, `--classify`: 在条目后附加指示符（`*/=>|` 之一）\n- `--file-type`: 同样，但不附加 `*`\n- `--format=WORD`:\
    \ 跨越 `-x`、逗号 `-m`、水平 `-x`、长 `-l`、单列 `-1`、详细 `-l`、垂直 `-C`\n- `--full-time`: 类似于\
    \ `-l --time-style=full-iso`\n- `-g`: 类似于 `-l` 但但不列所有者\n- `--group-directories-first`:\
    \ 在文件前分组目录；可以使用 `--sort` 选项增强，但使用 `--sort=none` 会取消分组\n- `-G`, `--no-group`: 在长列表中，不打印用户和组组名\n\
    - `-h`, `--human-readable`: 配合 `-l` 和 `-s`，打印如 `1K`、`234M`、`2G` 等大小\n- `-si`:\
    \ 同样，使用 1000 的幂\n- `-H`, `--dereference-command-line`: 跟踪命令行中的符号链接\n- `--dereference-command-line-symlink-to-dir`:\
    \ 跟踪指向目录的符号链接\n- `--hide=PATTERN`: 不列出匹配 `PATTERN`（被 `-a` 或 `-A` 覆盖）\n- `--hyperlink[=WHEN]`:\
    \ 超链接；WHEN 可以是 'always'（默认）、'auto' 或 'never'\n- `--indicator-style=WORD`: 为条目附加指示符：none（默认）、斜杠\
    \ (`-p`）、文件类型 (`--file-type`）、分类 (`-F`）\n- `-i`, `--inode`: 打印文件的索引号\n- `-I`,\
    \ `--ignore=PATTERN`: 不列出匹配 shell `PATTERN` 的项\n- `-k`, `--kibytes`: 默认使用 1024\
    \ 字节块；仅用于 `-s` 和目录总计\n- `-l`: 使用长列表格式\n- `-L`, `--dereference`: 显示符号链接信息时，显示所引文件而非链接本身\n\
    - `-m`: 用逗号分隔列表列出条目\n- `-n`, `--numeric-uid-gid`: 类似于 `-l` 但列出数字用户和组 ID\n- `-N`,\
    \ `--literal`: 不带引号打印条目名\n- `-o`: 列出信息\n- `-p, --indicator-style=slash`: 在目录后附加斜杠\n\
    - `-q`, `--hide-chars`: 显示非图形字符\n- `--show-control-chars`: 原样显示非图形字符（默认，除非 `ls`\
    \ 输出到终端）\n- `-Q`, `--quote-name`: 用双引号括条目名\n- `--quoting-style=WORD`: 使用引号方式：literal,\
    \ shell, shell-always, shell-escape, shell-escape-always, c, escape（覆盖 `QUOTING_STYLE`\
    \ 环境变量）\n- `-r`, `--reverse`: 排序时反转\n- `-R`, `--recursive`: 递归列出子目录\n- `-s`, `--size`:\
    \ 每个文件的分配大小，以块计\n- `-S`: 按文件大小排序，最大的在前\n- `--sort=WORD`: 按 WORD 而非名称排序：none (-U),\
    \ size (-S), time (-t), version (-v), extension (-X)\n- `--time=WORD`: 更改默认使用修改时间；访问时间\
    \ (-u): atime, access, use；状态时间 (-c): ctime, status\n\n"
- fmt: "\n`birth time: birth, creation;`\n\nwith `-l`, `WORD` determines which time\
    \ to show;\n\nwith `--sort=time`, sort by `WORD` (newest first)\n\n`--time-style=TIME_STYLE`\
    \ time/date format with `-l`; see `TIME_STYLE` below\n\n`-t` sort by time, newest\
    \ first; see `--time`\n\n`-T, --tabsize=COLS` assume tab stops at each `COLS`\
    \ instead of 8\n\n`-u` with `-lt`: sort by, and show, access time;\nwith `-l`:\
    \ show access time and sort by name;\notherwise: sort by access time, newest first\n\
    \n`-U` do not sort; list entries in directory order\n\n`-v` natural sort of (`(version)`)\
    \ numbers within text\n\n`-w, --width=COLS` set output width to `COLS`. `0` means\
    \ no limit\n\n`-x` list entries by lines instead of by columns\n\n`-X` sort alphabetically\
    \ by entry extension\n\n`-Z, --context` print any security context of each file\n\
    \n`-1` list one file per line. Avoid `'\\n'` with `-q` or `-b`\n\n`--help` display\
    \ this help and exit\n\n`--version` output version information and exit\n\nThe\
    \ `SIZE` argument is an integer and optional unit (example: `10K` is `10*1024`).\n\
    \nUnits are `K`, `M`, `G`, `T`, `P`, `E`, `Z`, `Y` (powers of 1024) or `KB`, `MB`,...\
    \ (powers of 1000).\n\nBinary prefixes can be used, too: `KiB=K`, `MiB=M`, and\
    \ so on.\n\nThe `TIME_STYLE` argument can be `full-iso`, `long-iso`, `iso`, `locale`,\
    \ or `+FORMAT`.\n\n`FORMAT` is interpreted like in `date(1)`. If `FORMAT` is `FORMAT1<newline>FORMAT2`,\
    \ then `FORMAT1` applies to non-recent files and `FORMAT2` to recent files.\n\n\
    `TIME_STYLE` prefixed with `'posix-'` takes effect only outside the `POSIX` locale.\n\
    \nAlso the `TIME_STYLE` environment variable sets the default style to use.\n\n\
    Using color to distinguish file types is disabled both by default and with `--color=auto`.\
    \ With `--color=auto`, `ls` emits color codes only when standard output is connected\
    \ to a terminal. The `LS_COLORS` environment variable can change the settings.\
    \ Use the `dircolors` command to set it.\n\nExit status:\n`0` if OK,\n`1` if minor\
    \ problems (e.g., cannot access subdirectory),\n`2` if serious trouble (e.g.,\
    \ cannot access command-line argument).\n\nGNU coreutils online help: `<https://www.gnu.org/software/coreutils/>`\n\
