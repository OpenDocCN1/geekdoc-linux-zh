    cpu= round(cpu)\nmemory= psutil.virtual_memory()\nmemory= memory[1]\nmemory= round(memory\
    \ /1024/ 1024)\nif t> 50:\n    ALERT = \"CPU TEMP ALERT\"\nelse:\n    ALERT =\
    \ \"NOMINAL\"\n\n# 屏幕上的文字#\ndraw.text((x,top), \"CPU Temp is: \" +str(t)+\"C\"\
    ,font=ImageFont.load_default(),fill=255)\ndraw.text((x,top+8), \"CPU usage is:\
    \ \" +str(cpu)+\"%\",font=ImageFont.load_default(),fill=255)\ndraw.text((x, top+16),\
    \ ALERT,font=ImageFont.load_default(),fill=255)\ndraw.text((x,top+25), str(memory)+\
    \ \"MB Free\",font=ImageFont.load_default(),fill=255)\ndraw.text ((x,top+35),\
    \ \"Mario Meraz\", fill=\"white\")\n\n# 显示数值#\ndisp.image(image)\ndisp.display()\n\
    ```\n\n下方图片是 python 脚本的运行结果(Images/image0303.jpeg)\n\n硬件设备与树莓派之间的连接关系表：\n| OLED\
    \ | 树莓派 |\n| :--- | :--- |\n| GND | `PIN 39` |\n| VCC+ | `PIN 2` |\n| SCL | `PIN\
    \ 5` |\n| SDA | `PIN 3` |\n\n# 项目 温度传感器\n\n在此项目中，我们将使用 `DHT22` 或 `DHT11` 温度传感器。\n\
    \n![自动生成的图形用户界面](img/image0304.jpeg)\n\n`DHT22` 是更贵的版本，具有更好的规格。它的温度测量范围为 -40 到\
    \ +125 度，精度为 0.5 度，而 `DHT11` 的范围为 0 到 50 度，精度为 2 度。\n\n硬件设备与树莓派之间的连接关系表：\n| DHT11/22\
    \ 传感器 | 树莓派 |\n| :--- | :--- |\n| GND | `PIN 39` |\n| VCC+ | `PIN 4` |\n| SIGNAL\
    \ | `PIN 7` |\n\n如果你有 `DHT11` 或 `DHT22` 传感器并且需要添加单独的上拉电阻，请使用以下接线方法：\n- `DHT11/22`\
    \ 传感器的 `Vcc+` 连接到树莓派的 `5V`\n- `DHT11/22` 传感器的 `GND` 连接到树莓派的 `GND`\n- `DHT11/22`\
    \ 传感器的 `SIGNAL` 连接到树莓派的 `PIN 7`\n- 在 `SIGNAL` 和 `5V` 之间连接一个 10K 电阻\n\n"
- fmt: "\nFound existing installation: `setuptools 40.8.0`\n\nNot uninstalling `setuptools`\
    \ at `/usr/lib/python3/dist-packages`, outside environment `/usr`\n\nCan't uninstall\
    \ `setuptools`. No files were found to uninstall.\n\nFound existing installation:\
    \ `wheel 0.32.3`\n\nNot uninstalling `wheel` at `/usr/lib/python3/dist-packages`,\
    \ outside environment `/usr`\n\nCan't uninstall `wheel`. No files were found to\
    \ uninstall.\n\nSuccessfully installed `pip-22.3.1` `setuptools-65.5.1` `wheel-0.38.3`\n\
    \n`mariomeraz@raspberrypi: ~$`\n\nLet’s take a look at the code we are going to\
    \ use. The first section of code imports the `DHT` library from Adafruit and the\
    \ system time library.\n\n```python\nimport Adafruit_DHT\nimport time\n```\n\n\
    This line defines the sensor object we will use, and the next line is a variable\
    \ that defines the GPIO pin we are using.\n\n```python\nDHT_SENSOR = Adafruit_DHT.DHT11\n\
    DHT_PIN = 4\n```\n\nFinally, the code loop that goes next. The `while True:` line\
    \ will force everything indented after running in an infinite loop. First, we\
    \ capture the temperature and humidity to two aptly named variables, and then\
    \ use an `IF` statement to check to see if it worked. If it worked, we print the\
    \ temperature and humidity to the screen. If it failed, we let you know to check\
    \ your wiring.\n\n![A picture containing electronics, connector Description automatically\
    \ generated](Images/image00305.jpeg)\n\n### Python Code Sensor DHT\n\nThis code\
    \ is available in git hub:\n\nhttps://github.com/mariomeraztechauthor/Linux_Raspberrypi_Book/blob/main/raspberry_python_DHT11_22Sensor\
    \ (Note: The URL in original text contains `22Sensor`, likely meant `22Sensor`)\n\
    \n```python\nimport Adafruit_DHT\nimport time\n\nDHT_SENSOR = Adafruit_DHT.DHT11\n\
    DHT_PIN = 4   # GPIO PIN That is in used #\n\n#measurements #\n\nwhile True:\n\
    \    humidity, temperature = Adafruit_DHT.read(DHT_SENSOR, DHT_PIN)\n    if humidity\
