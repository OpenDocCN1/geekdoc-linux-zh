    \ 应用最近文件。\n\n以 `'posix-'` 为前缀的 `TIME_STYLE` 仅在 `POSIX` 语言包之外生效。\n\n此外，`TIME_STYLE`\
    \ 环境变量设置默认使用的样式。\n\n使用颜色区分文件类型在默认情况下和使用 `--color=auto` 时均被禁用。使用 `--color=auto`\
    \ 时，`ls` 仅在标准输出连接到终端时输出颜色代码。`LS_COLORS` 环境变量可以更改设置。使用 `dircolors` 命令来设置它。\n\n\
    退出状态：\n`0` 表示正常，\n`1` 表示有小问题（例如：无法访问子目录），\n`2` 表示严重故障（例如：无法访问命令行参数）。\n\nGNU coreutils\
    \ 在线帮助：`<https://www.gnu.org/software/coreutils/>`\n\n完整文档 `<https://www.gnu.org/software/coreutils/ls>`\n\
    \n或通过本地可用：`info '(coreutils) ls invocation'`\n\n```\nmariomeraz@raspberrypi:~\
    \ $ \n```\n\n# 通用输入/输出 (GPIO)\n\n通用输入/输出 (`GPIO`) 旨在与硬件交互，将树莓派连接到低层外设。这些引脚可以根据需求从任何开发环境或编程语言进行控制。`GPIO`\
