    Raspberry Pi 4 Model B


    A super charged Raspberry Pi that finally does everything you would want it to,
    for the exact same price as the previous models.


    While the raspberry Pi has enjoyed years of success, there’s always been a couple
    of things a lot of users wanted. A slightly more powerful CPU that could handle
    day-to-day computing, plenty of USB ports and maybe wireless to make connecting
    the network easier. The Pi 4 Model B  comes with two micro-HDMI ports, this HDMI
    ports are capable of outputting 4K video, two USDB 3.0 and two USB 2.0 ports,
    one USB-C power input, one Ethernet port for wired internet, one headphone jack
    (3.5mm) for sound, and a 40-pin GPIO port.


    ![A picture containing electronics Description automatically generated](Images/image00270.jpeg)


    Pi 4 Model B files are compatible with files produced in previous Raspberry pi
    models.


    In this book we will work with a Raspberry Pi 4, although any model can be utilized


    Raspberry 4


    64 Bit CPU 


    Faster (1.5 GHz)


    More RAM (From 1,2, to 4 GB)


    Gigabit Ethernet Ports


    2.4 GHz and 5 GHz WiFi


    Bluetooth 5.0 / BLE


    USB 3.0 Port


    Dual, 4K HDMI Output


    BCM2711 Chip


