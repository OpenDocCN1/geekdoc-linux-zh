    ## Device Files


    ### dev/null and dev/mem

    The following direction is used to redirect output of a command, so it doesn’t
    show on the screen, literally “`/dev/null` ” eats data and destroys it.


    ```bash

    mariomeraz@raspberrypi:/dev $ ls null

    null

    mariomeraz@raspberrypi:/dev $

    ```


    The `/dev/mem` holds the machine’s RAM.


    ```bash

    mariomeraz@raspberrypi:/dev $ ls mem

    mem

    mariomeraz@raspberrypi:/dev $

    ```


    With the string and pipeline and pipeline we can see what text the RAM chips are
    currently holding.


    ## Driver Modules


    In case there is a need to disable a device. The hardware driver enables the device
    at the same time the driver can be enabled at the time of Kernel compilation.


    The modules can be found as follows:

    `/lib/modules/<kernel version>/kernel/`.


    Indeed, the Kernel has the capability to load modules when it detects certain
    pieces of hardware. In order to list the modules that the Kernel has currently
    loaded, the following command can be used as root:


    ```bash

    mariomeraz@raspberrypi:~ $ lsmod

    ```


