    days ago), +2 (more than two days ago)

    - `-name <filename>` find files called `<filename>`

    - `-iname <filename>` matches file called `<filename>` but not case-sensitive.


    ## Wildcards

    - `(*)` matches any string of characters, or no characters

    - `(?)` matches any single character

    - `[abc]` matches a,b,c

    - `[!abc]` matches any character except a, b, c

    - `[A-Z]` matches any character in the range A-Z

    - `[one, two]` matches the words one and two


