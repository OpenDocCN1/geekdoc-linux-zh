    python-dev set to manually installed.\n\nThe following packages were automatically\
    \ installed and are no longer required:\n\n  libmicrodns0 rpi-eeprom-images\n\n\
    Use 'sudo apt autoremove' to remove them.\n\n0 upgraded, 0 newly installed, 0\
    \ to remove and 224 not upgraded.\n```\n\n## The OLED display (0.96 inch)\n\n\
    The organic light-emitting diode (`OLED`) display that we’ll use in this tutorial\
    \ is the `SSD1306` model: a mono-color, 0.96-inch display with 128×64 pixels as\
    \ shown in the following figure.\n\nThe OLED display doesn’t require a backlight,\
    \ which results in a very nice contrast in dark environments. Additionally, its\
    \ pixels consume energy only when they are on, so the OLED display consumes less\
    \ power when compared with other displays. The model we are using here has only\
