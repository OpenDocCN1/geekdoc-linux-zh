    # Getting the Pi Up and Running


    ## Raspberry Pi Configuration Options (raspi-config)


    In the Graphical Configuration Interface (GUI) there are a couple of options that
    can be selected with the up and down arrows to move around the list.


    The following steps will walk you through the steps on the configuration options.


    Click on the Raspberry Symbol -> ![](Images/image00287.jpeg) Then Go to Preferences
    -> Then Go to Raspberry Pi Configuration and you will see the screen below.


    On the setting option tools, use the Up and Down arrows to move around the list
    of options. To select the “options” the space bar needs to be used.


    ![Graphical user interface Description automatically generated](Images/image00288.jpeg)

    ![Graphical user interface, text, application Description automatically generated](Images/image00289.jpeg)

    ![Graphical user interface, table Description automatically generated](Images/image00290.jpeg)

    ![Graphical user interface Description automatically generated](Images/image00291.jpeg)

    ![Graphical user interface Description automatically generated](Images/image00292.jpeg)


    ### Expand rootfs

    This option will enlarge the file system to use the whole SD capacity.


    ### Overscan

    This option is useful to fit the image in the screen. Initially this option is
    disabled. For the high-definition monitors sometimes the texts run off the side
    of the screen, in order to fix this issue, it is needed to enable the overscan
    to change the values to fit the image to the screen. The values in the overscan
    option indicate the amount of overscan on the images, therefore, to correct any
    issue with the images, the positive values could go off the screen and the negative
    values can be used to to correct the black borders around the edge of the display.


    ### Keyboard

    There is an option to select the keyboard type.


    ### Password

    Initially the default password is `raspberry`, although in the latest version
    there is an option to set-up the initial password at the time of first set-up.


    ### Change Locale

    The default settings are for UK English with a standard UTF-8-character encoding.


    ### Change Time Zone

    This option can be used to change the time depending on the location and time
    zone.


    ### SSH

    This option turns on the Secure Shell (`SSH`) server, to log-in to the raspberry
    pi remotely over a network.


    ### Memory Split

    The default value is `split`. This option allows to change the amount of memory
    used by the CPU and the GPU.


    ### Overclock

    This provides the option of running the processor at speeds higher than 700 MHz.
    Other options are Medium or Modest and Turbo mode that can run at 1000 MHz.


    Below is the sequence to perform this action through cli commands “ Boost performance
    and Overclocking”:


    ```bash

    mariomeraz@raspberrypi:$ sudo raspi-config

    Options:

    Modest

    Medium

    High

    Turbo

    mariomeraz@raspberrypi:$ sudo shutdown -r now

    ```


    # Special Settings


    ## Overclock

    The overclock function provides a 50 percent extra of performance at not extra
    cost. The processor in the raspberry pi is designed to run at 700 MHz, which means
    that performs 700,000,000 operations per second. Although doing over clocking
    increases the power consumption which by consequence increases the amount of heat
    generated.


    To activate the overlocking function as follows:


    ```bash

    mariomeraz@raspberrypi:~ $ sudo raspi-config

    Select “overclocking”

    ```


    Notes: The maximum overlocking setting will increase an extra 50% speed.

    Raspberry pi will automatically turn off overcooking once it reaches 85 Celsius
    degrees

    Since overlocking will increase the amount of power that the raspberry pi draws,
    the raspberry pi will become less stable at the time of running several USB devices
    at the same time.


    # Linux Commands for Raspberry Pi


    ## Desktop Behavior

    This option is used to boot straight to the graphical desktop environment which
    is set to “Yes” by default. If the option “No” is selected the command line will
    be displayed when the process of boot up is completed, and it will be required
    to log-in to start the graphical interface.


    The below credentials are the default credentials:

    Raspberrypi login: `pi`

    Password: `raspberry`


    To start the raspy-config GUI (Graphic User Interface):

    ```bash

    mariomeraz@raspberrypi:~ $ startx

    ```


    ## Update

    This option is to update the Operating System. The CLI alternative to do this
    is the following:


    ```bash

    mariomeraz@raspberrypi:~ $ sudo reboot

    ```


    `$` = Regular User command

    `#` = root user command

    {The latter must be used as root or by using the Sudo command}


    ### How to add users

    ```bash

    #adduser <username>

    #passwd <username>

    ```


    Use the cli commands below update and Upgrade the Raspberry Pi Operating System:


    ```bash

    mariomeraz@raspberrypi:# apt -get # This cli can be used to install and remove
    software.

    mariomeraz@raspberrypi:# sudo apt-get install <program> # This cli command will
    install the <program> package.

    mariomeraz@raspberrypi:# sudo apt-get update  # This cli will grab an up-to-date
    list of packages from the repository.

    mariomeraz@raspberrypi:# sudo reboot {Reboot the Raspberry Pi}

    mariomeraz@raspberrypi:# sudo shutdown -h now {Shutdown the Raspberry Pi }

    mariomeraz@raspberrypi:# sudo apt-get upgrade    # This cli command will upgrade
    all packages that have a newer version in the repository.

    mariomeraz@raspberrypi:# sudo apt-get purge <program> # This cli command will
    remove the <program> package.

    ```


