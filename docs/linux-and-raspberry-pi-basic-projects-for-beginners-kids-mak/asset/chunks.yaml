    8.4.0-3ubuntu1) 8.4.0, GNU ld (GNU Binutils for Ubuntu) 2.34) #1538 SMP Thu Mar
    31 19:39:41 BST 2022


    mariomeraz@raspberrypi:~ $


    Processes


    ![Icon Description automatically generated](Images/image00266.jpeg)


                As in any Linux Operating System or Distro every program on the Raspberry
    Pi runs an individual and separated process. To monitor the process running a
    top command can be used, which will display the CPU and memory usage. To list
    the processes with their id numbers the “ps” command can be used.


    “Top” Cli command Displays the programs that are currently using the most CPU
    time and memory


    mariomeraz@raspberrypi:$ top


    Performance Information


    The “ps” stands for process status and is a powerful tool that provides information
    about processes running on the Linux system.'
