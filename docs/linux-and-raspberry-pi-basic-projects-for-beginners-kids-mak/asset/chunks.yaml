    \ of the build-essential python, but we need to define what it is a `build-essential`.\n\
    \n## What is build-essential Python?\n\n`build-essential` is what is called a\
    \ meta-package. It does not install anything. Instead, it is a link to several\
    \ other packages that will be installed as dependencies. In the case of the `build-essential`\
    \ meta-package, it will install everything required for compiling basic software\
    \ written in C and C++.\n\n```\nmariomeraz@raspberrypi:  ~ $sudo apt install build-essential\
    \ python-dev\n\nReading package lists... Done\n\nBuilding dependency tree    \
    \   \n\nReading state information... Done\n\nbuild-essential is already the newest\
