    | :--- | :--- |

    | `/root` | Root Directory |

    | `/bin` | In this directory there are programs, files and commands that all users
    can run |

    | `/boot` | Here there are all the files needed at boot |

    | `/dev` | At this location there are special files that represent the devices
    |

    | `/etc` | At this directory the configuration files can be found |

    | `/etc/init.d` | Scripts to start-up services |

    | `/etc/X11` | X11 Configuration files |

    | `/home` | User home directory |

    | `/home/pi` | Home Directory for the “Pi” user |

    | `/lib` | Kernel Modules and Drivers |

    | `/media` | Mount points for removable media |

    | `/proc` | This is a virtual directory with information about running processes
