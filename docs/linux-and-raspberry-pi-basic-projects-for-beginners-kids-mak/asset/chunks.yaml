    \n# Linux Commands\n\nMore ways to fetch Linux knowledge: These two commands below\
    \ are super important to increase the knowledge of the Linux commands.\n\nThe\
    \ `man` command provides the complete description and options of a command:\n\n\
    ```bash\nmariomeraz@raspberrypi:$ man ls\nmariomeraz@raspberrypi:$ ls -help\n\
    mariomeraz@raspberrypi:~ $ ls --help\n```\n\n## ls Usage\n\n`ls [OPTION]... [FILE]...`\n\
    \nList information about the `FILE` (the current directory by default). Sort entries\
    \ alphabetically if none of `-ftSUX` nor `--sort` is specified. Mandatory arguments\
    \ to long options are mandatory for short too.\n\n- `-a`, `--all`: do not ignore\
    \ entries starting with `.`\n- `-A`, `--almost-all`: do not list `.` and `..`\n\
    - `--author`: with `-l`, print the author of each file\n- `-b`, `--escape`: print\
    \ C-style escapes for graphic characters\n- `--block-size=SIZE`: with `-l`, scale\
    \ sizes by SIZE when printing them; e.g., `--block-size=M`\n- `-B`, `--ignore-back`:\
    \ do not list entries ending with `~`\n- `-c`: with `-lt`: sort by, and show `ctime`\
    \ (time of last modification of file status); with `-l`: show `ctime` and sort\
    \ by name; otherwise: sort by `ctime`, newest first\n- `-C`: list entries by columns\n\
    - `--color[=WHEN]`: colorize the output; WHEN can be 'always' (default if omitted),\
    \ 'auto', or 'never'\n- `-d`, `--directory`: list directories themselves, not\
    \ their contents\n- `-D`, `--dired`: generate output designed for Emacs' dired\
    \ mode\n- `-f`: do not sort, enable `-aU`, disable `-ls --color`\n- `-F`, `--classify`:\
