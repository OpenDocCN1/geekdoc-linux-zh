    20: -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- 


    30: -- -- -- -- -- -- -- -- -- -- -- -- 3c -- -- -- 


    40: -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- 


    50: -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- 


    60: -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- 


    70: -- -- -- -- -- -- -- --                         


    mariomeraz@raspberrypi: ~$   


    Let’s start installing the OLED Display (There are two options) Although to make
    sure the installation of the OLED is performed depending on the brand of the OLED
    Device, we can issue both cli commands.


    1.  Below is the first option to install the OLED from Adafruit


    The OLED SSD1306 driver is based on the Adafruit GFX library which provides all
    the underlying graphics functions such as drawing pixels, lines, circles, etc.
    For more details about what you can do with the OLED check out the GFX library
    tutorial.


    mariomeraz@raspberrypi: ~$  sudo pip3 install Adafruit-SSD1306 netifaces


    Looking in indexes: https://pypi.org/simple, https://www.piwheels.org/simple


