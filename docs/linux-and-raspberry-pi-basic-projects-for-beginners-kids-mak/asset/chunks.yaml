    The GPIO pins on the Raspberry Pi can be controlled and triggered in many ways.
    GPIO pins can be controlled through designed modules from programming languages.


    Since Python is the official language of the Raspberry Pi, there are GPIO modules
    for python which provide control for inputs and outputs available. The library
    is called RPi.GPIO and is installed by default on all Raspberry Pi. This python
    capabilities are a project hosted on SourceForge and can be found at sourceforge.net/project/raspberry-gpio-python


