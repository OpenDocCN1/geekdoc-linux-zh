    \ GitHub 上找到：\n[`github.com/mariomeraztechauthor/Linux_Raspberrypi_Book/blob/main/raspberry_python_picamera`](https://github.com/mariomeraztechauthor/Linux_Raspberrypi_Book/blob/main/raspberry_python_picamera)\n\
    \n```python\n#!/usr/bin/python\n\nfrom picamera import PiCamera\nfrom time import\
    \ sleep\n\ncamera = PiCamera()\ncamera.start_preview()\nsleep(5)\ncamera.stop_preview()\n\
    ```\n\n成功处理代码后的输出：\n```text\n>>> %Run camerapreview.py\n>>> %Run camerapreview.py\n\
    >>> %Run camerapreview.\n```\n\n# 用于拍照的 Python 代码\n\n```python\n#!/usr/bin/python\n\
    \nfrom picamera import PiCamera\nfrom time import sleep\n\ncamera = PiCamera()\n\
    camera.start_preview()\nfor i in range(5):\n    sleep(5)\n    camera.capture('/home/pi/Desktop/image%s.jpg'\
    \ % i)\ncamera.stop_preview()\n```\n\n成功处理代码后的输出：\n```text\n>>> %Run pi_camera.py\n\
    >>> \n```\n\n# 其他用于 Pi 摄像头拍照的 CLI 指令\n\nmariomeraz@raspberrypi: ~ $ cd Desktop\n\
    mariomeraz@raspberrypi: ~/Desktop $ mkdir photo\n\n以下指令用于拍摄照片：\nmariomeraz@raspberrypi:\
    \ ~/Desktop/photo $ raspistill -o image.jpg\n\n拍摄的图像所示：\n![一张包含墙壁、室内、人物的自动生成图像](img/image00312.jpeg)\n\
    \n# 视频。什么是 H.264？\n\nH.264 是一种广为人的高清数字视频压缩标准。也称为 MPEG-4 Part 10 或高级视频编码 (MPEG-4\
    \ AVC)，H.264 定义为一种基于块的、基于补偿的视频压缩标准，定义了多个配置（工具）和级别（最大比特率和分辨率）。MP4 是一种文件容器格式，而 H.264\
    \ 是一种视频编码器，需要视频容器来承载编码后的视频。\n\n以下指令以 H.264 压缩编码格式拍摄视频：\n```bash\nmariomeraz@raspberrypi:\
    \ ~ raspivid -o movie.h264 -t 5000\n```\n\n用树莓派摄像头拍摄的视频：\n![一个拿着手机的人的自动生成图像（置信度较低）](img/image00313.jpeg)\n\
    \n# 构建你知识体系的基础项目。\n\n以下项目对于扩展树莓派及其内置工具的功能具有基础意义。\n\n### 步骤 1. 安装 Node. Js\nNode.Js\
    \ 的软件包是 Node  { (`npm`)。\n```bash\nmariomeraz@raspberrypi: ~ sudo wget http://nodejs.org/dist/v0.10.21/node-v0.10.21-linux-arm-pi.tar.gz\n\
    ```\n\n### 步骤 2. 提取 Node 包\n```bash\nmariomeraz@raspberrypi: ~ sudo tar -xvzf\
    \ node-v0.10.21-linux-arm-pi.tar.gz\n```\n\n### 步骤 3. 为 Node 和 npm 二进制文件创建符号链接\n\
    ```bash\nmariomeraz@raspberrypi: ~ sudo ln -s /var/www/node-v0.10.21-linux-arm-pi\
    \ /bin/node\nmariomeraz@raspberrypi: ~ sudo ln -s /var/www/node-v0.10.21-linux-arm-pi\
    \ /bin/npm\n```\n\n### 其他模块\n```bash\nmariomeraz@raspberrypi: ~ npm install socket.io\
    \ node-static socket.io adafrui-i2c-pwm-driver\n```\n\n### Docker 安装\n```bash\n\
    mariomeraz@raspberrypi: ~ curl -ssl https://get.docker.com | sh\nmariomeraz@raspberrypi:\
    \ ~ sudo usermod pi -aG docker\n```\n\n### GitHub 克隆仓库\n```bash\nmariomeraz@raspberrypi:\
    \ ~ apt-get update && apt-get install git jq\nmariomeraz@raspberrypi: ~ sudo apt\
    \ update\n```\nGet:1 httpss://download.docker.com/linux/raspbian buster InRelease\
    \ [33.6 kB]\nGet:2 http://archive.raspberrypi.org/debian buster InRelease [32.6\
    \ kB]\nGet:3 http://raspbian.raspberrypi.org/raspbian buster InRelease [15.0 kB]\n\
    Get:4 https://download.docker.com/linux/raspbian buster/stable armhf [21.1 kB]\n\
    Get:5 http://raspbian.raspberrypi.org/raspbian buster/main armhf [13.0 MB]\n获取：1\
    \ httpss://download.docker.com/linux/raspbian buster InRelease [33.6 kB]\n获取：2\
    \ http://archive.raspberrypi.org/debian buster InRelease [32.6 kB]\n获取：3 http://raspbian.raspberrypi.org/raspbian\
    \ buster InRelease [15.0 kB]\n获取：4 https://download.docker.com/linux/raspbian\
    \ buster/stable armhf [21.1 kB]\n获取：5 http://raspbian.raspberrypi.org/raspbian\
    \ buster/main armhf [13.0 MB]\n获取：6 http://archive.raspberrypi.org/debian buster/main\
    \ armhf [392 kB\n获取：7 http://raspbian.raspberrypi.org/raspbian buster/contrib\
    \ armhf [58.8 kB]\n获取：8 http://raspbian.raspberrypi.org/raspbian buster/non-free\
    \ armhf [104 kB]\n读取软件包列表... 完成\n建立依赖树\n读取状态信息... 完成\n有 224 个软件包可以升级。运行 `apt list\
    \ --gradable` 查看它们。\nN: http://raspbian.raspberrypi.org/raspbian buster InRelease\
    \ 软件包源从 'stable' 变为 'oldstable'\nN: http://archive.raspberrypi.org/debian buster\
    \ InRelease 软件包源从 'testing' 变为 'oldstable'\nN: https://download.docker.com/linux/raspbian\
    \ buster InRelease 软件包源从 'oldstable'\nhttp://archive.raspberrypi.org/debian buster\
    \ InRelease 软件包源从 'stable' 变为 'oldstable'\n\n# 通过 Web 界面控制树莓派\n* 文件服务器\n* 媒体中心\n\
    * 通过 Web 远程\n\n依赖\n* 树莓派\n* RaspCTL\n\n### 步骤 1. 更新树莓派\n树莓派操作系统更新：\n```bash\n\
    mariomeraz@raspberrypi: ~ sudo apt-get update && apt-get upgrade\n```\n固件更新：\n\
    ```bash\nmariomeraz@raspberrypi: ~ sudo apt update\n```\n启动 LXDE：\n```bash\nmariomeraz@raspberrypi:\
    \ ~ raspi-config\n```\n\n### 步骤 2. 修改 IP\n树莓派需要静态 IP。网络配置：\n```bash\nmariomeraz@raspberrypi:\
    \ ~ sudo nano /etc/network/interfaces\n```\n将 `iface eth0 dhcp` 改为 `iface eth0\
    \ static`。\n\n### 步骤 3. 设置静态 IP\n需要在 `iface` 行下方添加以下内容：\nAddress 192.168.1.[IP]\n\
    Net mask 255.255.255.0\nNetwork 192.168.1.0\nBroadcast 192.168.1.255\nGateway\
    \ 192.168.1.[路由器 IP]\n\n### 步骤. 4 安装 RaspCTL\n需要 RaspCTL 的公钥：\n```bash\nmariomeraz@raspberrypi:\
    \ ~ wget debrepo.kernel.org/raspctl.asc\nmariomeraz@raspberrypi: ~ cat raspctl.asc\
    \ | sudo apt-key add -\n```\n\n### 步骤 5. 添加仓库并安装\n使用以下 CLI 命令将仓库添加到源文件中：\n```bash\n\
    mariomeraz@raspberrypi: ~ echo \"deb http://debrepo.kernel.org/ raspctl main\"\
    \ | sudo tee /etc/apt/sources.list.d/raspctl.list\n```\n软件安装：\n```bash\nmariomeraz@raspberrypi:\
    \ ~ sudo apt-get update\nmariomeraz@raspberrypi: ~ sudo apt-get install raspctl\n\
    ```\n\n### 步骤 6. 访问树莓派\n开始访问树莓派：\n[Http://[IP]:8086](Http://%5BIP%5D:8086)\n\n\
    # Twilio 项目：从树莓派发送短信\n![包含图形用户界面、文本、应用程序、电子邮件的自动生成图像](img/image00314.jpeg)\n\n"
- fmt: "\nThis is a program that combines Twilio and Python to send a SMS (Short Message\
    \ Service) from the Raspberry Pi to a Mobile phone.\n\nTwilio is a cloud communication\
    \ company, enables to send SMS messages for free from the Raspberry Pi to a Mobile\
    \ phone using python code.\n\n## Step 1: Set Up the Twilio Account\n\n`Twilio.com/try-Twilio`\n\
    \n### A) Twilio Registration\n### B) Twilio Account\n### C) Twilio Number\nTwilio\
    \ is free and enables the user to send an SMS to a registered and verified phone\
    \ number.\n\n## Step 2: Number Registration\n\n- There are two types of Twilio\
    \ accounts, paid accounts, and free trail accounts\n- The number needs to be a\
    \ verified number.\n- The country code will need to be provided.\n\n## Step 3:\
    \ The Dashboard\n\n- Once registered and logged in on Twilio.\n- `AccountSid`\
    \ and the `Auth Token` will be available.\n- These parameters are needed for the\
    \ Twilio REST.\n\n## Step 4: Twilio Software Installation\n\n```\nmariomeraz@raspberrypi:\
    \ ~$ sudo easy_install twilio\nmariomeraz@raspberrypi: ~$ sudo pip install twilio\n\
    ```\n\nIn case “pip” is needed to be installed:\n\n```\nmariomeraz@raspberrypi:\
    \ ~$ sudo apt-get install python-pip python-dev\nmariomeraz@raspberrypi: ~$ sudo\
    \ pip install -U pip\n```\n\n## Step 5: Twilio Authentication\n\nTo create an\
    \ SMS program that will send text messages to a mobile phone number.\n\nIn the\
    \ python editor it is needed to import the Twilio REST libraries:\n\n- Add the\
    \ Account and credentials\n- `AccountSid`\n- `Auth Token`\n\n```python\nfrom twilio.rest\
    \ import twilioRestClient\n\nAccount_sid = “ XX”\n\n#Enter the numbers\nAuth_taken\
    \ = “ XX “\n\nClient = TwilioRestClient(account_sid, auth_token)\n```\n\n## Step\
    \ 6: Create a message\n\nThis message will be sent to the mobile phone number:\n\
    \n```python\nmessage = raw_input (“Please enter the message” )\n```\n\n## Step\
    \ 7: Add a number\n\nTo send the message are needed two numbers.\nThe first number\
    \ is the mobile phone number.\nThe second number below is the Twilio Account number\
    \ that can be retrieved from the dashboard page under “Call the sandbox number”:\n\
    \n```python\nmessage = client.message.create (to= “+1-TheMobileNumber”,\nfrom_=“+1-TWILIONumber”,\
    \ body=message)\n```\n\n## Step 8: Send a message\n\nThis message below it is\
    \ just a confirmation message:\n\n```python\nprint message.Sid\nprint “ The message\
    \ has been sent”\n```\n\n### Complete Code in Python:\n\n```python\nfrom twilio.rest\
    \ from TwilioRestClient Account_sid = “ XX”\n\n#Enter the phone numbers#\nAuth_taken\
    \ = “ XX “\n\nClient = TwilioRestClient(account_sid, auth_token)\n\nmessage =\
    \ raw_input (“Please enter the message” )\n\nmessage = client.message.create (to=\
    \ “+1-TheMobileNumber”,\nfrom_=“+1-TWILIONumber”, body=message)\n\nprint message.Sid\n\
    print “ The message has been sent”\n```\n\n## Alternative Python Code to send\
    \ SMS\n\nAn additional way to send email messages and SMS with just python is\
    \ the following way:\n\n```python\nimport smtplib\nfrom email.message import EmailMessage\n\
    \ndef email_alert (subject, body, to):\n    msg = EmailMessage ()\n    msg.set_content\
    \ (body)\n    msg [‘subject’] = subject\n    msg [‘to’]  = to\n    User = “[email_alert@gmail.com“\n\
    \    msg [‘from’] = user\n\npassword = “pass”\nserver = smtplib.SMTP (“ smtp.gmail.com”\
    \ , 587)\nsever.starttls ()\nserver.login( user, password)\nserver.send_message(msg)\n\
    sever.quit ()\n\nif _name_ == ‘_main_’ :\n  Email_alert(“ Hey”, Hello World, \
    \ “ email alert@gmail.com“ )\n  Email_alert(“ Hey”, Hello World,  “ number @carrier.com“\
    \ ) # SMS Delivery#\n```\n\nTo set up a gmail account:\n`Https:// myaccount.google.com`\n\
    \nTo send sms alerts:\n`Digitaltrends.com/mobile`\n\n## Conclusion\n\nThat’s it,\
    \ I hope you have learned new skills, but the most important thing is that you\
    \ enjoyed the process of learning.\n\nTHANK YOU! Mario Meraz\n"
  raw: 'This is a program that combines Twilio and Python to send a SMS (Short Message
    Service) from the Raspberry Pi to a Mobile phone.


    Twilio is a cloud communication company, enables to send SMS messages for free
    from the Raspberry Pi to a Mobile phone using python code.


    Step 1 . Set Up the Twilio Account


    Twilio.com/try-Twilio


    A) Twilio Registration


    B) Twilio Account


    C) Twilio Number


    Twilio is free and enables the user to send an SMS to a registered and verified
    phone number.


    Step 2\. Number Registration


    *   There are two types of Twilio accounts, paid accounts, and free trail accounts


    *   The number needs to be a verified number


    *   The country code will need to be provided


    Step 3\. The Dashboard


    *   Once registered and logged in on Twilio.


    *   AccountSid and the Auth Token will be available


