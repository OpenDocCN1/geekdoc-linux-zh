    # USB Management


    When the USB device is plugged in any Linux system the kernel initially probes
    it to find out what class it belongs to. USB devices are organized into classes
    to facilitate driver development. There are classes for all sorts of devices such
    as audio, webcams, printers, keyboards, mouse, joysticks and even for vendor specific
    classes. USB devices attached on the Raspberry Pi and How to mount and USB device
    as a hard drive on the Raspberry Pi.


    ## List of all attached USB devices (`ls` + `usb`)


    ```bash

    mariomeraz@raspberrypi:~ $ lsusb

    ```


    To reduce the among of output data of the `lsusb` cli command it could be utilized
    the verbose option as follows:


    ```bash

    mariomeraz@raspberrypi:~ $ lsusb -v

    ```


    The following command shows the devices in a tree-like format to see the dices
    connected:


    ```bash

    mariomeraz@raspberrypi:~ $ lsusb -t

    ```


    To see further information about the USB controllers and the devices connected
    such as directories for each device with the files containing: manufacturer name,
    speed, maximum power usage and more information.


    ```bash

    mariomeraz@raspberrypi:~ $ /sys/bus/usb/devices

    ```


    ## Mount point creation


    ```bash

    mariomeraz@raspberrypi:~ $ sudo mkdir /media/usb

    ```


    ## Pi User as the folder owner


    ```bash

    mariomeraz@raspberrypi:~ $ sudo chown -R pi:pi /media/usb

    ```


    ## Mounting the USB drive


    ```bash

    mariomeraz@raspberrypi:~ $ sudo mount /dev/sda1 /media/usb -o uid=pi,gid=pi

    ```


    ## USB Controller Information


    The cli command to find out information about the USB controller are the following.


    ### To find the UUID (Universal Unique Identifier)


    ```bash

    mariomeraz@raspberrypi:~ $ /sbin/lspci | grep -i usb

    ```


    Is highly probably that the USB will be labeled as `sda1`.


    ```bash

    mariomeraz@raspberrypi:~ $ ls -l /dev/disk/by-uuid

    ```


    Hint to see real-time how the kernel is recognizing a USB device when the device
    is connected is the `dmesg` cli command. `dmesg` Displays the kernel messages,
    this cli command can be useful for finding problems with hardware.


    ```bash

    mariomeraz@raspberrypi:~ $ dmesg

    ```


