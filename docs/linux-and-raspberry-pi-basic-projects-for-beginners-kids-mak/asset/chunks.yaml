    ## 网络


    `wget` 这个工具是一个黑科技。`wget` 是一个非交互式网络下载器，即使用户未登录系统也可以从 Web 服务器下载文件，并且可以在后台运行而不影响当前进程。该
    GNU 工具支持 HTTP、HTTPS 和 FTP 协议，并支持通过 HTTP 代理检索。


