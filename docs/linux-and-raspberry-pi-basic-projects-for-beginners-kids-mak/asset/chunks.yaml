    # Preface


    Raspberry Pi is all about education. These devices have shown the value through
    numerous examples around education and learning of computing science, Linux Systems,
    makers projects and even gaming and entertainment. The Raspberry Pi is one of
    the most exciting things to happen in combination and at the same time to the
    computer, electronics worlds and education field in recent years that have expanded
    the possibilities.


    One personal motivation to put together this book is the fact that I consider
    a raspberry-pi a democratizer of the knowledge and I myself claim to be a democratizer
    of the technical knowledge, I really believe that the starting point for a technical
    career could be the technical knowledge learnt through a raspberry-pi projects.


    Basically this book has three objectives : learn Linux, start learning a-pi and
    the third aspect is to be useful as a reference. You maybe have seen the cover
    of this book and have thought for yourself what is the intention of this book,
    another big aspect of this book is that I dont make assumptions that everyone
    should know how to get from A to Z.


    # Introduction


    The microcontroller market is a 28 billion-unit per year business. Since this
    is a book about raspberry pi, it is mandatory to speak about Eben Upton the CEO
    and Founder of the Raspberry Pi Foundation.


    Nine years ago, the Raspberry was born, since then the Raspberry Pi Foundation
    has sold 42 million devices. The evolution has been big from Raspberry Pi 1 to
    the Raspberry Pi 2 from one single core to a quad core configuration. Although
    the biggest jump has been from 3+ to 4.


    In 2021 the Raspberry Foundation has started to produce the `RP2040` chip which
    has been introduced in the microcontroller dev board `Pi Pico Raspberry`.

