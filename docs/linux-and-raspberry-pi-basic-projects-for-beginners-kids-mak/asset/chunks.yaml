    Pipes are an alternative of chaining smaller programs together to accomplish bigger
    tasks and objectives.


    ![A picture containing icon Description automatically generated](Images/image00268.jpeg)
    The stdin, stdout and stderr are standard data streams created when a Linux command
    is launched, this is the reason why the output is transferred, piped or redirected.


    Note: pipe is a form or redirection and transfer of standard output to other destinations.


    In Linux each file associated with a process is assigned a unique identificatory.
    Like these values below:


    0: stdin


    1: stdout


    2: stderr


    Stdin —-> Program1 —-> Stdout —->stdin —->Program2—->stdout


    The “>” symbol is used to redirect the output of any command


    “ls” List contents of the current directory


    mariomeraz@raspberrypi:# ls > test.txt


    To read the content of a text extension file the less option can be used


    mariomeraz@raspberrypi:# less test.text


    The cat option (short for concatenate) can be used to dump the entire content
    of a file to a standard output. This can be useful when it is needed to feed a
    file into another program or redirect the output to other stdout or stdin.


    mariomeraz@raspberrypi:~ $ cat /proc/version


