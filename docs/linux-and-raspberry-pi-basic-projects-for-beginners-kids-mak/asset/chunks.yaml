    \ adafruit-pureio, Adafruit-GPIO, Adafruit-SSD1306, netifaces\nSuccessfully installed\
    \ Adafruit-GPIO-1.0.3 Adafruit-SSD1306-1.6.2 adafruit-pureio-1.1.9 netifaces-0.11.0\n\
    mariomeraz@raspberrypi: ~$\n```\n\n### 2. Below is the second option\n\n`luma.oled`\
    \ provides a Python3 interface to OLED displays with `SSD1306`, `SSD1309`, `SSD1322`,\
    \ `SSD1325`, `SSD1327`, `SSD1331`, `SSD1351`, `SSD1362`, `SH1106` or `WS0010`\
    \ controllers to connect with Raspberry Pi and other Linux-based computers.\n\n\
