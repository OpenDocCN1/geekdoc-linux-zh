    Silent, low power, small machines, used for Edge and IoT Computing, Community
    device oriented.


    Raspberry uses the ARM Processor and there are a lot of ARM small devices around
    like mobile devices with this type of processor. There are big models of Raspberry
    Pi, also there are small models like the Raspberry Pi Zero and the raspberry pi
    pico. In this book we will discuss and focus on the Raspberry Pi 4.


    ## Prerequisites


    Some of the prerequisites of this book are the ones below, although these are
    not mandatory since I tried to write this book from zero to hero approach.


    * Just a little of Networking

    * Just a little of Linux, although no worries here you will learn the foundation
    of Linux with the Raspbian OS which is a variant of Debian.

    * And last but not least a lot of interest in learning and having fun!


