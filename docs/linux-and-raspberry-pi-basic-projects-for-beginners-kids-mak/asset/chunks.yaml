- fmt: "\n# Introduction\n\nPython is an important language, is that important that\
    \ is used by Science, Tech Industry, and even Hackers consider python as the preferred\
    \ programing language. Guido van Rossum is the name of the creator of Python.\
    \ In 1999, van Rossum put together a widely read proposal called Computer Programming\
    \ for Everybody: [https://www.python.org/doc/essays/cp4e/](https://www.python.org/doc/essays/cp4e/)\n\
    \nPython is an interpreted language which means the source code of a Python program\
    \ is converted into bytecode that is then executed by the Python virtual machine.\
    \ Interpreted language in simple terms means running code line by line but also\
    \ means that the instruction is executed without earlier compiling the whole program\
    \ into machine language, although here is a little secret: Python is both compiled\
    \ as well as an interpreted language.\n\nThis means when the python code is processed,\
    \ it is first compiled and then interpreted line by line. The compilation part\
    \ is mostly hidden from the user. While running the code, Python generates a byte\
    \ code internally, this byte code is then converted using a python virtual machine\
    \ (`p.v.m`) to generate the output. The compile part gets deleted as soon as the\
    \ code gets executed in Python so that the programmer doesn’t get onto unnecessary\
    \ complexity. Due to al that mentioned the size of programs written in Python\
    \ is less, and it is easier to debug the code in the Python language. Although\
    \ the program that is executed in an interpreted language is slower as compared\
    \ to a language that is directly compiled because the line of codes passes through\
    \ an interpretation run-time which increases the run-time complexity, for instance\
    \ in a python program there isn’t a need to specify to the computer whether a\
    \ variable is a number a list or a string; the interpreter figures out the data\
    \ types when the program or script is executed.\n\n![A picture containing icon\
    \ Description automatically generated](Images/image00268.jpeg) And this is one\
    \ of the capacities why Hackers prefer the use of python precisely for this variable\
    \ flexibility performed by interpreter.\n\n## Getting Started\n\nLet’s start with\
    \ our first script in Python and in order to do that we need to open the tool\
    \ that we will use to build the python scripts and programs which is an integrated\
    \ development environment. The IDE is a software application that helps programmers\
    \ develop software code efficiently, because it increases developer productivity\
    \ by combining capabilities such as software editing, building, testing, and packaging\
    \ in an easy-to-use application.\n\nThe IDE that we will use for python that comes\
