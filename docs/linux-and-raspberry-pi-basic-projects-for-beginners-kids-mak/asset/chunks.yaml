    # File Systems


    A File System in Linux is a structured collection of files on a disk drive or
    a disk array and a partition, where a partition is a segment of memory. The Linux
    Filesystem holds directories of files. The Linux Filesystem’s structure store
    systems data and user data on a storage device.


    The Hierarchical approach 


    The Linux File System uses a hierarchical structure to organize and store data.
    The topmost directory in the Linux structure is de / directory also known as the
    root directory. This hierarchy structure is important because it provides the
    Filesystem Hierarchy Standard (FHS) which  ensures consistency among systems and
    also different Linux distributions. 


    The FH Standard provides the structure: 


    *   For ensuring the data is organized


    *   To make sure the integrity of the stored data


    *   The Data can be easily located and retrieved


