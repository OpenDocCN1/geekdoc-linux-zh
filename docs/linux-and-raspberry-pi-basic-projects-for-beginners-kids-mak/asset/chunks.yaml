    \ 不排序；按目录顺序列出条目\n\n`-v` 对文本中的数字（`(version)`）进行自然排序\n\n`-w, --width=COLS` 设置输出宽度为\
    \ `COLS`。`0` 表示无限制\n\n`-x` 按行而非按列列出条目\n\n`-X` 按扩展名字母顺序排序\n\n`-Z, --context` 打印每个文件的任何安全上下文\n\
    \n`-1` 每行列出一个文件。在配合 `-q` 或 `-b` 时避免 `'\\n'`\n\n`--help` 显示此帮助并退出\n\n`--version`\
