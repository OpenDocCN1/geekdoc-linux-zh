    | `/sys` | This a special directory on the Raspberry Pi that represents the hardware
    |

    | `/tmp` | Space for programs to create temporary files |

    | `/usr` | At this directory there are programs and data usable by all users |

    | `/usr/bin` | Most of the programs in the operating system that the user interacts
