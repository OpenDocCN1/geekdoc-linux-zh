    ## File Systems


    A File System in Linux is a structured collection of files. The Hierarchy Standard
    (FHS) provides a structure to organize and store data.


    ### Directory Structure


    ```bash

    mariomeraz@raspberrypi: ls

    ```

    ```bash

    mariomeraz@raspberrypi:~$ ls

    ```

    ```bash

    mariomeraz@raspberrypi:/ ls

    ```


    ## Directory Descriptions


