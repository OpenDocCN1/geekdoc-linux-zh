    After you have logged in, and a command window is available, the system will prompt
    you to type in a command.

    The prompt is $ (dollar), though many systems are able to change this, and you
    yourself are able to alter it.

    Beware, however, if you get a prompt that terminates in % (percent) this is usually
    an indication that the shell you will talk to is either the C or a derivative
    of, and not a POSIX shell. Although of the next couple of chapters will still
    be valid for such a shell, there are significant incompatibilities, and much of
    Chapters 7-9 will not be correct. In such a circumstance, it may be possible for
    your login shell to be changed to POSIX shell (such as bash). Again, consult your
    system administrator. Now try typing date (remembering to press the Return key
    at the end). You should see on the screen something like


    ```

    $ date

    Tue 14 20:10:39 GMT 2002

    $

    ```


    By typing date you have instructed the machine to obey the command called date;
    it has executed the command and has printed on your screen a message (as instructed
    by the command date). When that completes, you are then given another prompt.
    Try now typing nonsense'
