    The access privileges are presented as a string of 10 characters. The first character
    is usually either d or a -, indicating that the file is a directory or an ordinary
    file respectively. Characters 2-4, 5-7 and 8-10 describe the privileges for the
    owner, the group and for others respectively. Each of these 3-character strings
    denotes whether read, write and execute privileges have been allowed or denied.


