  md: 'Recall that a UNIX system contains at its core the kernel. The interface to
    this kernel is specified both in the C language (POSIX.1) and as shell commands
    (POSIX.2). The shell command names mimic — as is sensible — the names of the corresponding
    C procedures. for example, to create a new directory, the shell command mdir is
    used, and the corresponding C procedure is called mdir.


    The C language has been used to code the kernel, and much of the shell and Perl
    is written in C (or its most recent object-oriented derivative C++). The use of
    the names used by C to interface with the kernel gives the shell or Perl programmer
    a consistent window into the kernel. Anything (almost!) that can be coded in C
    on a UNIX system can be written in the shell or in Perl.


    # 12.9 Quality code


    There has been much debate since programming languages were invented as to what
    constitutes “good code”. At the time of writing, object-oriented programming languages
    are commonly seen as encapsulating a natural, intuitive, and solid programming
    style, in which it is easy to write readily understandable programs. Like the
    shell, Perl was invented by capable and confident system programmers, people who
    perhaps did not feel the need for their code to be easily read by others.


    Perl is not object-oriented. Perl does not come with interactive development environments
    which will help you write code. Perl is not forgiving of mistakes — it allows
    the programmer full licence to do what she wants.


    It is possible to write Perl in variety of obscure ways so that your code is extremely
    difficult to read. This can be taken to extremes, in the form of JAPH scripts.
    See http://www.perl.com/CPAN-local/misc/japh for examples. The onus is on you,
    the programmer, to write Perl so that your code is “good code”. What does this
    mean in practice?


    ACRONYM

    JAPH = ‘Just Another

    Perl Hacker''


    Use comments

    Your program should be well commented, and perhaps a quarter of the code should
    be comments. Help the reader to understand what you’re doing, since the Perl code
    itself might not.


    Use meaningful variable names

    It is tempting to use single letter names, since they are quicker to type, and
    make your programs smaller. This is false economy, and it’s easy to forget what
    you were using variables for.'
