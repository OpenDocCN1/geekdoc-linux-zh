  md: '# Introducing UNIX and Linux


    The sizes you choose to set for each of the partitions depends on your needs.
    One option is to allocate 10% for / (root) and /var partitions, 30% for the /home
    partition and 50% for the /usr partition. The size of your /swap partition will
    vary, but a good rule-of-thumb is the size of swap partition to be double the
    size of your RAM. The installer software will create, format and mount these partitions
    and then begin the installation process.


    The installer will allow you some control over the software that you decide to
    install. In the first instance, it is sensible to install all of the packages
    that are recommended. You will be able later to uninstall some of the packages
    if you later find they are of no use to you.


    # User accounts


    When you are using Linux you will be logged on as an account holder. Therefore,
    when Linux is being set up, you will need to add account names and passwords.
    You will be asked to set up one of these accounts, called root, by default. The
    root account is the Linux administrator account and with this you will be able
    to change the system configuration, install new system software and create new
    accounts. For your normal day-to-day working you should use an account other than
    root. ensure that you do not inadvertently change your system set-up.


    # 3.6.3 LILO


    The information stored on each disk begins with the partition delimiters — where
    the disk partitions start and stop — and also the location of the boot loaders,
    which start loading the operating system when your computer is turned on. The
    Windows boot loader is called IOS and DOS/SYS; the Linux boot loader is called
    LILO. Running LILO calls the kernel of the Linux operating system to be activated
    and the operating system to be loaded.


    During the installation you will be required to supply information about the other
    operating systems that you are running on your computer. Once you have done this
    the loader will be configured so that you can move between operating systems.
    You might also be asked to create a boot disk, which should store safely in case
    anything goes wrong with your computer. If you are installing a dual system, and
    the other operating system is a Windows NT/2000/XP system, then the configuration
    is more complex, and you should consult your documentation (or a site such as
    www.linux.com).


    # ACRONYM


    LILO = ‘Linux Loader''


    # ACRONYM


    KDE = ‘K Desktop Environment''


    The installer will then set up the X server configuration (see below). X desktop
    may also provide one of the new desktop environments such as KDE or GNOME (see
    below). It is possible to start up Linux in text mode (which requires you to type
    startx after you have logged in or'
