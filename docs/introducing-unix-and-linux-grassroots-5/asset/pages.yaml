  md: '# 3.5 Emulators


    Operating systém emulation allows you to run multiple operating systems concurrently
    without having to reboot. At best it allows you to run a full version of Windows
    inside Linux through the creation of something called a virtual computer — see
    subsection 3.5.1 below on VMware.


    Alternative solutions include those that allow Windows applications to run under
    Linux without modification. Although this is not regarded as true emulation, it
    provide a considerable level of Linux and Windows compatibility — see subsection
    3.5.2 below on WINE.


    # 3.5.1 VMware


    VMware is a commercial software package that allows you to run more than one operating
    system simultaneously. This is done by setting up a host operating system and
    (or more) guest operating systems, of which runs in an unmodified state.


    Each guest operating system runs in a secure virtual machine; the beauty of VMware
    is when using these virtual machines is as easy to swap between operating systems
    as it is to swap between windows. If, if you run the virtual window in full screen
    mode, it is as if the guest operating system (OS) is the only OS on your machine.


    Such sophistic must come at a price. Firstly, you will need a machine with a minimum
    of 256 MB of RAM and a 400 MHz processor. You will also need at least 500 MB of
    disk for the guest OS and the associated applications. Secondly, there will be
    a speed reduction when using the guest OS. This can be as much as 50%, which may
    be a problem if your machine is at the bottom end of the hardware requirements.


    VMware is very well supported and you can configure your system so the host operating
    system is chosen from any of Windows XP, 2000 and NT, Red Hat Linux, SuSE Linux
    and Mandrake Linux; the guest operating systems include all of the above and also
    the Windows 3.x/9x series.


    You can find out more about VMware at www.vmware.com.


    # NOTE


    +   runs Windows and Linux simultaneously

    (-) unrivalled capabilities

    (-) speed hit on guest OS

    (-) costs around $300 at the time of writing

    (-) "commercial software"


    # ACRONYM


    # 3.5.2 WINE


    WINE = ‘Wine Is Not an Emulator’


    WINE allows most Windows applications to run natively under Intel versions of
    UNIX. WINE does this by providing low-level compatibility for Windows programs
    running under Linux. As a result, the applications run faster than they will under
    an emulator.


    One of the main reasons for choosing WINE over an emulator is that it does not
    require extensive hardware resources. If you have a processor sufficiently powerful
    to run Linux then you will be able to run both'
