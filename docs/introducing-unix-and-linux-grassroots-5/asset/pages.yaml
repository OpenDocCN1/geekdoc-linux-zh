  md: '# Getting started


    # CHAPTER OVERVIEW


    This chapter discusses


    +   - conducting a simple dialogue with a UNIX machine;

    - simple use of the text editor Vi;

    - getting help via the command man;

    - using email with UNIX

    - input and output streams; and

    - input and output redirection and pipes.


    This chapter describes how you start (and finish) a session on a UNIX computer,
    together with some of the basic commands which you can use. We assume that you
    are now using a UNIX or Linux system which has a system administrator. If you
    are using a stand-alone Linux system, then you are on the system administrator.
    From now on, any reference to UNIX should be interpreted as ‘UNIX or Linux’, since
    the two operating systems appear virtually identical to the user.


    # 4.1 Using UNIX


    # 4.1.1 Usernames


    In order to use your UNIX system you will need a username and a password. The
    username is a code which will allow you to access the system, and to distinguish
    you from any others users. For the rest of this book, we shall assume you have
    been given the username chris. The password verifies that you are in fact the
    person allowed to use that username, and is similar to the PIN (4-digit code)
    of an ATM (cash machine), but longer and more secure. You should already have
    been told what arrangements have been made for allocating a username. If not,
    you must ask your system administrator.


    > ACRONYM

    PIN = ‘Personal Identification Number’

    ATM = ‘Automated Teller Machine’'
