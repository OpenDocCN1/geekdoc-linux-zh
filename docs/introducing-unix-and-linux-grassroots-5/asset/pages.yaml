    Suppose you have created a file called myfile. You can create another file with
    a copy of the contents of myfile using the command cp (''copy''). If you decide
    that the name of a file needs to be changed, the command mv (''move'') will do
    exactly that. For instance:


    ```

    $ ls

    myfile

    $ cp myfile foo

    $ ls

    foo myfile

    $ mv myfile bar

    $ ls

    foo

    ```


    When the command cp is called, a completely new file is created, with a new node.
    The directory in which the new file is to be located is amended with the information
    about the new filename and the new node. The data in the file being copied is
    not changed at all.


    Sometimes it is useful to give a few different names. This can often happen if
    you have data that needs to be accessed in several different directories, and
    any changes to it need to be made consistently. If you created several copies
    of the file, you would have to perform updates'
