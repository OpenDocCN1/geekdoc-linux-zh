  md: '# Introducing UNIX and Linux


    KDE (K Desktop Environment) is the default interface for many of the Linux downloads.
    It provides an excellent graphical front end to UNIX as well as a window manager,
    a help system and a number of developed utilities. We will consider KDE in more
    detail below.


    GNOME is also cutting-edge, currently less stable than KDE. GNOME not only provides
    a desktop environment, but also a development platform — providing tools, libraries,
    and components with which to develop UNIX applications — and GNOME Office, a set
    of office applications.


    # 3.8 KDE


    The K Desktop Environment (KDE) is an easy-to-use contemporary desktop environment
    for the UNIX operating system. The major advantage of KDE over something like
    Microsoft Windows is that it is completely free. KDE is also open source; this
    means that the development of the desktop has not been restricted to one individual
    or one company. The result is well supported and professional and benefits from
    a wide range of applications, upgrades of which can be downloaded directly from
    the Internet.


    When you run KDE on your computer you are presented with a default desktop configuration
    that contains the following:


    +   - A panel at the bottom of the screen that is used to start applications and
    switch between desktops. This default panel is customisable.


    +   - The taskbar at the bottom of the screen that is used to manage running applications.


    +   - The desktop of files and folders. This desktop represents a quarter of the
    total desktop work area. You can move between the desktop areas by selecting the
    numbered buttons found in the KDE panel.


    # 3.8.1 Desktop help


    You should familiarise yourself with the on-line KDE Help browser. This can be
    run by clicking on the KDE Help icon in the KDE panel, or alternatively by clicking
    on the K icon and selecting KDE Help from the selection menu (Figure 3.1). It
    is possible to navigate your way around the help system via a set of links and
    by using the options in the ‘Go› menu and the tool bar.


    KDE Help is a valuable source of information. Here you can find all the necessary
    details about the KDE system, including a short history of KDE you should be interested
    in, and documentation on all the KDE applications, details of which are regularly
    updated on the complete on-line KDE Help web pages.'
  merge: -1
  pgno: 37
- img_proc: true
  md: 'In KDE Help there is also a reference to a short tutorial to the KDE Desktop
    Environment. It is well worth spending some time working through this tutorial,
    as it is not overly detailed, yet covers most of the important features you will
    need.


    Finally, KDE help is connected to the underlying UNIX help system. You can find
