    # 6.2.2 Global and local variables


    Suppose a process assigns a value to a variable. The value cannot be passed to
    the parent process, but may be passed to child processes. To illustrate this,
    consider a variable $X$, which we set to the number 42. Then invoke a second copy
    of the shell using sh; you will get the usual prompt, but this prompt is from
    the new shell, not from your login shell. The new shell is a child of your login
    shell. Now check the value of $X$, and you will see that it is not assigned a
    value:


    ```

    $ X=42

    $ echo $X

    42

    $ sh

    $ echo $X

    (blank line)

    $

    ```


    The new value of $X$ is not passed down to the child process. We say that the
    value of $X$ is local to the process that assigned it the value, and no changes
    will be recognised by any child process. If you now cause the child shell to finish
    by typing ctrl-D, you will get the $ prompt again again, this time from your login
    shell. Now, if you examine the value of $X$ again, you will see that it is 42,
    as was the value assigned to it in the login shell.


    We can cause a variable instead to be global by the command export, which means
    that its value will be passed down to all the child processes, and their children,
    and so on. The same as in the example above, but immediately after setting $X$
    to 42, type a line exporting X:


    ```

    $ export $X

    ```'
