    # 3.2.1 Collecting information about your system


    If your computer is already running a version of the Microsoft Windows operating
    system, then you can find information about your system by clicking on the ‘Start''
    button and selecting ‘Settings'' and the ‘Control Panel’. From here you should
    click on the ‘System’ icon, this will bring up a window entitled ‘System Properties’.


    The easiest way to capture the information that the ‘System Properties’ window
    provides is to print a System Resource Report. You can do this by selecting the
    system properties ‘Device Manager’ window and then clicking ‘Print’. At the print
    menu you should select the ‘All devices and system’ option and then press ‘OK’.


    If your computer is still using one of the older versions of Windows (3.1, 3.2,
    etc.) then you can gather and print the same system information by running the
    MSD.EXE utility from a DOS command prompt.


    Among the information provided with each of the Linux distributions will be listed
    the minimum system requirements. Before you decide on which version of Linux to
    install, it is worth making sure that your System Resource Report meets these
    requirements.


    # 3.2.2 Installation options


    A second issue likely to affect the type of Linux distribution you choose is the
    way in which you intend to use Linux on a day-to-day basis. You might want to
    install the Linux operating system as the sole operating system on your computer.
    If this is the case then you should probably install Linux as a ‘single boot’.
    This means that when you turn your computer on it only recognises the one operating
    system.'
