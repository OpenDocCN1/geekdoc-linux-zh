    Solution: This is another use of the s, with a simple enclosing loop.\nThe substitution\
    \ is performed in two stages: first, remove the leading\nspace, then the trailing\
    \ space, then the excess whitespace. Note that\nat tab is whitespace, and is entered\
    \ as a t.\n\n```\nwhile (<STDIN>) {\n  $_ = s/^[ \\t]*//;      # remove leading\
    \ spaces\n  $_ = s/[ \\t]*$//;      # remove trailing spaces\n  $_ = s/[ \\t]+/g;\
    \       # squash internal whitespace\n  print \"$_\";\n}\n```\n\n# 12.8 Perl and\
    \ the Kernel\n\nWe have already mentioned some of the functions available in Perl,\
