    # 5.1 The UNIX directory hierarchy


    A typical UNIX system has many users and usernames. The machine stores large numbers
    of programs and datasets that are either ''system'' files (required for the running
    of UNIX) or files for the benefit of the system''s users (such as the UNIX commands
    we discuss in this book). In addition, each user has their own collection of files.
    On a large UNIX system it would not be unreasonable to find millions of files
    occupying thousands of gigabytes of space.


    If I choose to create a file named myfile (say), it is unlikely that I will be
    the only user on the machine to have that particular name for a file. It would
    be unreasonable to expect me to choose a filename instead of myfile that was different
    from all the files created by all the other users. Therefore, UNIX must impose
    a structure on the filesize that will make it easy to manage a large number of
    files. The solution adopted is simple yet very powerful.


    We can think of the available file storage for our machine as partitioned into
    separate directories. At any given time you can access files in one particular
    directory, which we can think of as the current directory. You can also ''move''
    between different directories and change which is current. A directory need not
    be a contiguous section of disk, and might be fragmented. That is, the various
    files contained within this'
