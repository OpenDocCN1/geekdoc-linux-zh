    # 13.4 Security


    Whatever anyone tells you about security, unfortunately the only way to be completely
    sure that your computer is safe from a security breach is to disconnect it from
    the Internet and never to load any program or document that supports macros. This
    is clearly not going to be practical, so the answer is to find a number of ways
    of making security breaches to your networked computer more difficult. A number
    of possibilities are listed below.


    +   - It is possible to set up your system so that logins to your machine can
    only be done from other computers on your own local network and not from machines
    on the Internet. To do this you need to look at the files /etc/hosts.allow and
    /etc/hosts.deny.


    +   - You should make sure that your root password is secure. It is no using short
    dictionary words, as these can easily be broken using simple password generator
    programs. Do not be tempted to use users with blank passwords; it might seem like
    a good idea at the time, but this is very insecure. Finally, if you have more
    than one server, then you should make sure that the passwords are different for
    each. This ensures that if one machine is breached you do not compromise the whole
    system.


    +   - Denying access will not completely secure your system as it is possible
    to intercept messages from your machine, strip out the important data, such as
    the identifiers of other machines on your network, and then by a mechanism known
    as ''spoofing'' pretend to be another machine. The best way of getting around
    this problem is to use the ssh tool when connecting to other machines in your
    network. This ensures that the data packets sent between machines are encrypted.
    If you use ssh-level security for all your network traffic, then you make spoofing
    much harder.


    +   - Another way of maintaining security is to monitor the system log files.
    In the directory /var/log you will find a number of files in which information
    regarding the system and network information on your machine is stored. While
    this information takes a bit of interpretation, you will find that you can use
    it to study the activity on your system and on your network.


    +   - Firewalls provide a means of protection between private devices such as
    computers or local networks and the wider Internet. The simplest form of firewall
    protection is to set up a Linux machine with a single Internet connection (through
    an Ethernet card or modem) which acts


    268'
