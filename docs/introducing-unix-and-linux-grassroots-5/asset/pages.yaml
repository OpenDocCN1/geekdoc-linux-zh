    \ completion of the copy function and generated an error message if it failed.\n\
    \n# 12.7 Regular expressions\n\nRegular expressions have been used extensively\
    \ in the previous chapters, and it will come as no surprise that Perl also uses\
    \ them. The difference between Perl's approach to regular expressions, and that\
    \ of other utilities, is that they are central to the use of Awk, Sed and Gre.\
    \ In Perl, the use of regular expressions is just one of many possibilities available\
    \ to the programmer. Typical use of regular expressions in Perl involves the *comparison*\
    \ or *editing* of strings.\nThe operator used to manipulate regular expressions\
    \ is `~`, known as the *pattern binding operator*. Perl does not use the phrase\
    \ *regular expression*, preferring *pattern*, but it is synonymous.\nThe simplest\
    \ use of patterns is to match strings. The expression\n`string =~ /pattern/`\n\
    evaluates to true if the string is matched by the pattern, and\n`string !~ /pattern/`\n\
    evaluates to true if the string is *not* matched by the pattern.\n\n# Worked example\
    \ 12.8\n\nWrite a Perl fragment to take the variable $word and enclose its contents\
    \ in single quotes *only if* it does not already contain single quotes as both\
    \ its first and last characters.\n**Solution:** Use a pattern `'.*'` which matches\
    \ a single quote at the left (anchored by the `^`) and at the right (anchored\
    \ by the `$`). The pattern `.*` matched zero or more occurrences of anything.\n\
    ```perl\nif ($word !~ /'.*'$/) {\n    $word = \"'\" . $word . \"'\";\n}\n```"
