    In order to compile this C program using the command cc, you would have to perform
    three commands to:


    ```

    $ cc -c prog1.c

    $ cc -c prog2.c

    $ cc -o myprogram prog1.o prog2.o

    ```


    The first two lines, which translate the two source files to object code, can
    be performed in either order. The final command, which links two object files
    together, must wait until the first two have been completed.


    If you were to type these commands each time, there would be a danger of making
    an error and accidentally forgetting to recompile one of the source files after
    editing it. Alternatively, you could place all commands into a file and then execute
    that as a shell script. This would have the disadvantage that if you edited (say)
    prog1.c you would also have to recompile prog2.c even though this was not necessary.


    In this small example, this might seem a minor problem, but when performing serious
    system development it is not unusual to have large volumes of code that take a
    long time to compile. In such a case, it is sensible to minimise the amount of
    work that has to be done when changes to the code are made.


    A tool that makes use of file dependencies is known as make. This works in the
    following way: a file, called amakefile, is created (usually in the same directory
    containing the software being developed), and a program called make reads that
    file. The makefile contains information indicating


    +   - which file depends on which other file(s),

    - what commands must be performed to bring a file ''up-to-date''.


    The above example could have the contents of its makefile:


    ```

    myprogram: prog1.o prog2.o

    \cc -o myprogram prog1.o prog2.o


    prog1.o: prog1.c

    \cc -c prog1.c


    prog2.o: prog2.c

    \cc -c prog2.c

    ```


    You will notice two types of line in this file. There are lines that are not indented
    — they take the form of a word (known as the target) followed by a colon, and
    then followed by some other words, where the words'
