  md: '# 13.3.4 Adding a Linux host to an existing network


    If you are planning on adding your Linux machine to an existing network then you
    will need to know how the IP addresses on the network are already arranged. You
    will need to know the following information:


    +   - The host IP address that can be allocated to your machine. Your network
    administrator will have a list of those IP addresses that are allocated and those
    that are free.

    - The IP network address.

    - The IP broadcast address (as it might not necessarily be your network address
    followed by 255).

    - The IP netmask.

    - The router address.

    - The Domain Name Server address (DNS address) which you have assigned to your
    machine.


    Once you have this information, networking the machine is in quite easy. The best
    way to do this is to configure the network entries of your machine through the
    ''network configuration'' menu of the YaST tool. This simply means copying the
    IP and DNS information into the appropriate fields of the network configuration
    menu. It is also possible to set this network information using linuxconf.


    # 13.3.5 Building a private network


    If you are building your private network then you can choose whatever IP addresses
    you like. You will still need to:


    +   - choose an IP address for each machine in your network;

    - choose an appropriate netmask; and

    - assign each machine a DNS address.


    If you are configuring your network through YaST or linuxconf it is recommended
    that you log in root before working through the administration procedure.


    # 13.3.6 Configuring the network interface


    When Linux was installed on your machine it is likely that the networking device
    (such as the Ethernet card) on your machine was detected by the Ethernet driver
    and assigned a unique interface identifier (for example, ''eth0''). The final
    stage of networking requires you to link this device to your chosen IP address.
    Again, the best way to do this is to use the YaST tool, and then to test that
    your modem still works using the program wvdial. There are more manual ways of
    doing this setup (for)'
