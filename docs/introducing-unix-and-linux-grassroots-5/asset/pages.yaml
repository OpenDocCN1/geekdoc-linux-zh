    is words. The next argument is /usr/dict/words, and this is to be split at lines
    10001 and 20001. |


    ```

    $ csplit -f words /usr/dict/words 10001 20001

    ```


    Now use wc to check that the files you have created are of the specified length:


    ```

    $ wc words??

    ```


