    string that describes that pattern. It is fine for matching filenames, for the
    use of a case statement. However, a more powerful mechanism, known as regular
    expressions or REs, is available for use in certain UNIX utilities.


    There are different types of regular expression, and regular expressions can be
    defined in a variety of ways. UNIX specifies two sorts — a basic regular expression
    (or BRE), and an extended regular expression (or ERE). We start by defining a
    basic regular expression.


    # 10.3.2 Basic regular expressions


    The general idea is just like pattern matching — a BRE consists of a sequence
    of characters, some of which have a special meaning. The BRE is said to match
    string if


    +   - each part of the BRE with special meaning corresponds to a part of the other
    string,

    - the other individual characters in the BRE and the string correspond.


    In order to check whether a BRE matches a string, the two strings are examined
    working from left to right. Each time a match is found, the corresponding parts
    of the BRE and the string are discarded and the process continues immediately
    after.


    First of all, we consider how to specify a match for a single character. For this
    we use a BRE called a bracket expression, which is an expression enclosed in square
    brackets []. The expression enclosed by the brackets is either a matching list
    or a nonmatching list. A matching list consists of a sequence of:


    +   - single characters (escaped, if necessary),

    - ranges (as described above for tr),

    - character classes (as for tr)


    and a character matches a matching list if it matches any of the patterns that
    make up that sequence. The following BRE matches the letters a, x, y, z and any
    digit.


    ```

    [ax-z:digit]

    ```


    If a matching list is preceded by a circumflex (^) it becomes a nonmatching list,
    and matches any character not specified in that list.


    ```

    [[:upper:]#]

    ```


    will match any character that is neither an upper-case letter nor the symbol #.
    If you wish to specify the hyphen character in a range, you must have it as either
    the first or the last character in the bracket expression, so that


    ```

    [-xyz]

    ```


    # NOTE


    ^ corresponds to ! in

    pattern matching'
