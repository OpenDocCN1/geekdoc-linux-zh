    You will need to create and update files containing text (for example, programs
    written in Java, Pascal or C, or word-processed reports). There are many simple
    to use editors available, and Windows users will probably be familiar with Microsoft
    Word and with Notepad. These are fine for modifying small amounts of text, but
    are cumbersome if large files are involved, or repeated changes have to be made.
    We look in this section at editors which are available under UNIX, and which are
    suitable for heavy use. In particular, we introduce the standard editor Vi, which
    may at first sight seem relatively tricky to fear. The skills you gain in later
    chapters will feel back into use of Vi and allow you to make complex changes to
    a file quickly and easily. We also discuss the other options available to you
    if you prefer at this stage to use an editor which is more straightforward for
    simpler use.


    # 4.5.1 The editor Vi


    Vi is the ''standard'' screen editor on UNIX. Whilst the editor of choice for
    many systems programmers, it has a reputation, arguably undeserved, for being
    difficult to use. There is a tradeoff here — if you use a simple, graphical editor,
    then you will be able to create files quickly, and easily make simple changes
    to them. However, complex editing cannot often be done quickly with simple editors.
    There is a learning curve for using Vi, but once mastered the benefits later are
    on substantial. Furthermore, the skills needed to use Vi overlap substantially
    with those needed for UNIX shell programming, and include topics covered later
    in this book, such as Regular Expressions and the stream Sed.

    The command `vi` invokes the Vi screen editor, which has facilities to enter text
    into a file and to change it thereafter. In this subsection we discuss only a
    small proportion of its facilities, enough to allow you to create and edit files
    for the rest of this book. To edit the file myfile (say), type vi followed by
    the name of the file:


    ```

    $ vi myfile

    ```'
