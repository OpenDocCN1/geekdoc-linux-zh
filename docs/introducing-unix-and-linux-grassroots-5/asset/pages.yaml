  md: '# Introducing UNIX and Linux


    The final three commands that are mentioned in this chapter are introduced for
    completeness; they are included in the POSIX standard, and you should know of
    their existence.


    There is a command logger (''log error message'') which can be used to save a
    message for reading later by the system administrator. It might be used (say)
    to inform the administrator if a batch job failed to read a system file correctly;
    the user would not be in a position to forward the message easily, and the action
    to be taken would definitely be for the administrator to perform.


    Although you are likely to be using UNIX where English is a normal medium of communication,
    the concept of locale is supported everywhere both messages from commands and
    the character set used can be customised to other languages. The command locale
    allows you to examine the current locale, and localedef to define a new locale.


    # NOTE


    Unless your administrator has given you specific instructions on how it should
    be used, you are properly advised not to use logger


    # CHAPTER SUMMARY


    Table 9.2 Summary-of utilities


    | alias | define or display aliases |

    |---|---|

    | ar | maintain a library archive |

    | cksum | file checksum utility |

    | comm | select/reject lines common to two files |

    | command | execute a simple command |

    | ctags | create a ''tags'' file |

    | dd | convert file format |

    | eval | construct command by concatenating arguments |

    | exec | execute command by replacing shell process |

