    If you invoke make without any arguments, it will assume that the target is the
    first target mentioned in the makefile. If you run make with option -n it will
    display the commands that it would execute, but not actually run them. If you
    are unsure of the correctness of your makefile, it is wise to run make with the
    -n option initially to ensure that the actions it performs are in fact the actions
    you expect. For instance, taking the above example would give:


    ```

    $ make -n

    cc -c prog1.c

    cc -c prog2.c

    cc -o myprogram prog1.o prog2.o

    ```


    While running make, one of the commands fails (for example, if you had not created
    prog1.c at all, or there was an error in C Program), then make would terminate
