    # NOTE


    The word crontab is obscure, but probably means ''commands run over table''


    # 6.3.4 Running programs periodically


    There is also a facility to specify, for instance, ''run program X every morning
    at 2 am''. This is enabled by the crontab command. The mechanism used by crontab
    is different from that for at or batch.

    For each user, a file is kept on system which commands are to be run periodically,
    and when. You can edit this file using vi by invoking crontab with option -e (''edit'').
    Each line of this file commences with five columns, representing minutes (0-59),
    hours (0-23), day of month (1-31), month (1-12), and day of week (1-7); each of
    the columns contains a number, a comma-separated list of numbers, or an asterisk.
    The rest of each line is a command to be executed repeatedly whenever the five
    columns match the current time and date. An asterisk ''every''. For instance,
    if the crontab file contains


    +   30 15 * * 1 ls -R

    0 0 * * 1 X

    0 0 * 6 * Y

    0 0 1,15,22 * * Z


    # NOTE


    Monday is 1 in the week, Sunday 7


    then the command -R will be executed every day at 3:30 pm, command X will be run
    first every Monday, and command Y first thing every day in June. Command Z is
    run on days 1, 8, 15 and 22 of each month. If you try to create an inconsistent,
    such as specifying a non-existent date, you will be warned and the crontab file
    will not be changed.

    To list the entries in your crontab file without using the editor crontab -1.'
