    All the components of KOffice are compatible and you can therefore embed one KOffice
    component in another. For more information consult the web site.


    There are many non-KDE applications which you might like to explore; two applications
    of note are StarOffice, a popular Linux alternative to Microsoft Office, and Gimp,
    an image manipulation tool similar to Adobe Photoshop.


    # 3.8.3 The KDE Control Center


    The KDE desktop can be customised using the KDE Control Center so that it suits
    your own working style. The Control Center allows you to modify your desktop including
    the background, the colours and the style of windows etc. It is also possible
    to make modifications to the behaviour of the windows environment and to the configuration
    of input devices and sound, etc.


    # 3.8.4 File access and the command prompt


    You can access the files in your home directory by clicking on ''K'', followed
    by ''Home Directory''. The file manager is very similar to that of Microsoft Windows,
    so it is possible to drag and drop files from one place in your file system to
    another; creating, deleting and moving files is also easily done through the file
    manager system.


    If you wish to gain access to your files (and your computer) through the UNIX
    command prompt, click on the ''K'' button in the KDE panel, then select ''utilities''
    and ''terminal''; alternatively click on the shell button in the KDE panel.'
