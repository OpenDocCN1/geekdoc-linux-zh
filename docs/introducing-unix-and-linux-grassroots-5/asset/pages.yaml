  md: '# Introduction to shells


    # CHAPTER OVERVIEW


    This chapter


    +   - explains why a shell is needed; and

    - introduces simple syntax for the shell, including conditional statements and
    loops.


    In previous chapters, we have considered UNIX commands together with related concepts
    such as process and environment. In this chapter we consider the shell — the command
    interpreter — in more detail, and introduce the constructs that are a part of
    the shell and make it a programming language in its own right.


    # 7.1 Why do we need a shell?


    This question may be on your mind. Most of the commands discussed far are to be
    found in directories mentioned in your PATH. You can edit files, print files,
    and run programs. You can have access to languages such as Pascal or C on your
    system, and they can be used for complex programming tasks. So what does the shell
    have to offer?


    The shell allows you to check on the success and failure of commands, on the state
    of the filesystem, and on the values of environment variables, and to process
    this knowledge. It is a programming language in the full sense — it has the power
    of other programming languages — but tailored for use in conjunction with an operating
    system. It contains built-in features that allow the user to get the maximum amount
    of information from the kernel in an easy manner. By writing shell scripts you
    can also create your own commands.


    Although the shell is a powerful programming language, it is designed as a user
    interface to a UNIX machine, and is not an ideal language for doing complex numerical
    calculations. If you have a particular application'
  merge: -1
  pgno: 128
- img_proc: true
  md: '# Introducing UNIX and Linux


    that does not clearly have a need to be written in the shell, then it is good
    practice to write it in another language better suited, and then call that program
    from the shell.


    It is not possible to give instructions as to the boundary lies — when you decide
    that the shell is unsuitable and use another language — but the examples in the
    following chapters will give you a feel as to what sorts of task are typically
    programmed in the shell. Some people use a UNIX system happily and hardly used
    any of the shell facilities, while others are quite home with the most complex
    scripts.


    # 7.2 Shell syntax


    Any computer language has a syntax — that is, a set of rules defining what you
    can write in the language, and what you are forbidden to write. The shell uses
    symbols and words in a very precise way. We will not attempt to give a formal
    definition of the shell''s syntax here, but we will describe most of its features.


    Recall that a script is a file containing commands that the shell is able to interpret.
    If a script is two or three lines, it is likely to be clear to anyone reading
    the file what the commands do, and therefore what the purpose of the script is.
    If a script is a hundred lines long, it will not be so easy to see what is happening.
    Not will only be difficult for someone else reading your scripts, but if you make
    an error while writing it, you may find yourself trouble discovering exactly where
    the error has occurred.


    It is good practice to include comments in your scripts. These are messages the
    shell ignores — they are merely for the benefit of anyone reading your scripts.


    If you write a script, and include a # (''hash'') symbol, then the rest of that
    line (including the #) is ignored by the shell (unless that # appears within quotes
    or is in a word). For, the following script


    # NOTE


    Comments only work in scripts, and will not interact actively when you are giving
    the shell instructions from a terminal


    ```

    MESSAGE="Hello $LOGNAME

    echo $MESSAGE

    ```


    causes a message to be displayed on the terminal screen. The next script does
    exactly the same thing, but has had comments included.


    ```

    # This script prints a friendly message on standard output

    # Written by Chris, 5 December 2001

    #n# This script requires variable LOGNAME to be set

    ```


    ```

    MESSAGE="Hello $LOGNAME" # Set MESSAGE to the message

    echo $MESSAGE # ... and echo it to stdout

    ```'
