  md: '# Introducing UNIX and Linux


    # 13.2 File managers


    The version of Linux you have installed will no doubt have a built in file manager.
    KDE2, for example, has a very respectable file manager known as Kcommander, which
    features the mounting and unmounting of CDROMs and floppy drives, the ability
    to compress files and to create its own archives, built-in (Samba) networking
    support and a configurable menu system.


    It is now possible to use file managers that provide web-based interfaces rather
    than the Windows style look and feel of files and folders. PHPFileExchange is
    a web-based file interchange system which features authenticated user login, user
    groups, read and write access control at the user and group level, user privileges
    and a MySQL backend. For more information see www.seattleserver.com.


    Nautilus is a file management system and a graphical shell found as an integral
    part of the GNOME desktop environment. Its features include ''advanced file management''
    and a look and feel that is unsurpassed. Linux installations have GNOME as an
    option. If your version does not support GNOME then you can download it for free
    from www.gnome.org.


    > NOTE

    For more information on the split command Section 9.6.2


    # 13.2 File splitters


    As well as the UNIX split command there are a number of graphical packages that
    allow the splitting and joining of large files. Giles comes with the GNOME desktop
    environment and allows a file of any size to be split into smaller fixed size
    pieces; for more information see www.gfilesplit.sourceforge.net. ProSplitter is
    a fast Windows and Linux compatible tool for splitting and joining files. It has
    a simple graphical user interface and a number of advanced features such as DES
    encryption and robustness and reliability data checks. ProSplitter can be downloaded
    for free from www.prosplitter.co.uk.


    # 13.3 Linux networking


    # 13.3.1 Getting started


    There is a lot to Linux networking and it is not the intention of this section
    (or indeed this book) to provide a comprehensive Linux networking tutorial. However,
    this section should serve as an introduction to the material that you will find
    in many of the good Linux networking tutorials and books. It will familiarise
    you with the terminology that you will need to understand and proceed with these
    more detailed manuals. This said, later subsections will provide some detail on
    ''how to add your own Linux machine to an existing network'' and ''how to build
    your own private network''.'
