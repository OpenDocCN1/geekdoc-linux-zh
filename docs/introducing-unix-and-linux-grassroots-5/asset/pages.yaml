  md: '# Perl


    # CHAPTER OVERVIEW


    This chapter discusses


    +   - simple use of Perl; and

    - how to use Perl effectively in combination with other UNIX tools.


    # 12.1 Introduction


    # 12.1.1 Why yet another utility?


    A theme we have been following through in this book is “keep it simple” — that
    is, if there is a simple utility to do what you need, then use it. However, there
    will *always* be situations where you need something more heavyweight than what
    we have already introduced.


    We have discussed Awk, and seen that it can process data streams and files in
    a relatively complex fashion. However, Awk was never designed for sophisticated
    calculations, and as soon as an application deviates from straightforward processing
    of character streams, Awk is messy to use. Since Awk was devised in the early
    days of UNIX, our understanding of how to write a programming language has moved
    a long way, and the *result* is *Perl*. This is not to say that Awk is a bad language
    — it’s not, it’s just dated. However, as an understanding of Awk is helpful when
    learning Perl, and as you will see there are tasks for Awk is still a very appropriate
    solution.


    Perl stands for *Practical Extraction and Report Language*. Don''t let that put
    you off! To the serious programmer it’s the best thing since sliced bread.


    So what actually is Perl? It’s a programming language, with a syntax similar to
    “C”, and it comes complete with a full set of *libraries* — predefined functions
    — that access the UNIX kernel. It also has libraries'
  merge: -1
  pgno: 250
- img_proc: true
  md: '# Introducing UNIX and Linux


    for performing almost any other function you care to name, including database
    access, cryptography, graphics and internet access. The syntax of Perl is well-designed,
    but is very terse — it is a language for the skilled programmer, and a beginner
    would be well-advised to learn another language before attempting a Perl exercise.
    Perl is also free, and open source, which means that it is evolving, and new libraries
    for it are continually written. It also means that there is no concept of a "standard"
    for Perl. The latest version of Perl is version 5, and it is normally contained
    in all UNIX and Linux distributions. In addition, Perl can be used on other operating
    systems including MacOS and Windows.


    # 12.1.2 Beginning Perl


    We will assume that the previous chapters have made sense to you. Our goal is
    to identify the types of tasks for which the other tools you are now familiar
    with are inappropriate, and to show how to begin to code them in Perl. Our starting
    point will be processing a stream of characters, just as we did with Awk. However,
    before we start, there is a fundamental difference between Perl and Awk. Whereas
    an Awk script assumes its data is naturally separated into records which themselves
    are subdivided into fields, a Perl program does not. Perl is a general purpose
    programming language, and although it can perform the same tasks as Awk (very
    easily, in fact) there are no constraints on its manner of use. Perl is not an
    interactive shell. While the shell can be used to "talk to" the operating system
    in real time, Perl is not designed to. If the data you wish to process is not
    very well structured you should consider using Perl.


    # 12.1.3 Invoking Perl


    Just as with Gre, Sed and Awk, simple use of the perl command involves a program
    containing the commands Perl uses. This program can either be a file which is
    an argument to perl, or can be contained in a string named by option -e. Note
    that this is slightly different from the convention used by Awk. Thus, to print
    Hello World! we can either invoke


    ```

    perl -e ''print "Hello World!\n''

    ```


    or alternatively create a file (perlprogram, say) containing the print statement
    "Hello World!" and then invoke perl on the file:

    perlprogram


    As we see, although Perl embraces all the concepts we have already encountered
    (such as standard input and output, pipes, processes, and so on), the syntax it
    uses for them is quite different.'
