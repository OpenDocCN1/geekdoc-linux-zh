    # 11.9 Field and record separators


    The fields in a record are normally separated by whitespace. This is not always
    convenient. Suppose a file (ages, say) contains a list of people''s names and
    their ages:


    John 13

    Sue 15

    James Smith 15

    James Jones 14


    The number of fields on each line varies. This is a potential problem. Let us
    suppose we wish to write a simple Awk script to display


    John is 13 years old

    Sue is 12 years old

    James Smith is 15 years old

    James Jones is 14 years old


    There are several possible solutions. One that you will already be able to find
    the number of fields and performs a separate action each time:


    ```

    NF = 2 { printf "%s is %d years old\n", $1, $2 }

    NF = 3 { printf "%s is %d years old\n", $1, $2, $3 }

    ```


    This solution is fine if you know how many names a person is likely to have —
    but it is not elegant since there is a lot of duplication in the Awk script. If
    you were to allow persons with many forenames to appear in the list the Awk script
    would become unmanageable. Loops, such as for and while, are provided in Awk,
    although we do not discuss them here, they could be used to ''count'' over the
    first few fields. However, the solution begins to get moderately complex if method
    is adopted.


    The reason that the Awk scripts to perform this seemingly task are less straightforward
    than you might expect is that the data has been coded unwisely. The fields are
    separated by characters which themselves appear in one of the fields, namely blanks.
