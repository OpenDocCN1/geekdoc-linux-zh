  md: '# Maintaining your Linux OS


    as a buffer between the Internet and any local network. This machine then blocks
    direct communication between the local network and the Internet (in either direction).
    The advantage of this approach is that anything inside the firewall is protected;
    the disadvantage is that it is a little complicated to set up — you need to configure
    the machine for two Ethernet cards and then connect the two cards through an IP-chain
    to filter the data between them.


    # 13.5 Uninstalling Linux


    There are a number of ways of removing a Linux installation and the method which
    you choose will depend on the type of installation that you carried out in the
    first place. Essentially, you need to delete the partitions on which Linux is
    installed and then remove the lilo from the master boot code.


    +   * Method 1 — Run fdisk from a Linux rescue disk and delete the Linux partitions.
    This will remove the partition table entries and effectively ''wipe'' the Linux
    partition. You can then reformat these areas of disk from the MS-DOS boot floppy
    by typing fdisk /mbr. as above.


    +   * Method 2 — Run fdisk and delete the Linux partitions, as above. Then instead
    of using fdisk /mbr, use the command lilo -U, which should restore your system
    boot file previously before Linux was installed. This will only work if a backup
    copy was stored at install time.


    +   * Method 3 — If you are not worried about retaining any of the existing partitions
    on your machine and want a clean way of reformatting the hard drive for a completely
    new operating system, then you can use the MaxBlast tool. This can be downloaded
    from www.maxtor.com and reports are it is both very easy to use and effective.


    There is plenty of advice on the Internet if you are unsure about this procedure.'
