    # 11.7 Arguments to ‘awk’ scripts


    Suppose we wished to write a shell script called price, which would take one argument,
    representing a vegetable name, and interrogate the file vegetables as before to
    display the total price paid for that vegetable. One solution would be to get
    Awk to evaluate the total cost for all vegetables, and use Gre to filter out the
    line of output from awk:


    ```

    awk '' printf "%s %.2f\n", $1, $2*3 } vegetables | grep $1

    ```


    This is a perfectly acceptable solution. Another would be to use a pattern for
    awk so that only single line would be processed by awk. But here the problem is
    a problem - we cannot use the following:


    ```

    awk ''$1/ { printf "%s %.2f\n", $1, $2*3 }''

    ```


    The pattern /1/ is ERE pattern. The character $ in E matches the end of a string,
    and since each record Awk processes a line, $ matches the end of an input line.
    The ERE $1, and thus the awk pattern /$1/, will match all lines containing the
    digit 1 as character after the end of that line. This impossible pattern, so it
    will not be matched by any line. Try it — you should expect not to get any output.
    The point to remember is that the $1 has the $1 that would represent the first
    argument to a shell script.


    There is, fortunately, a way around this problem. When invoking awk you can preset
    Awk variables by specifying their initial value on the


