    +   - the file''s ownerowner (normally the user who created the file)


    +   - a **group** of users


    +   - **other** users.


    +   - **read


    +   - **write


    +   - **execute**.


    If a file has *read* permission, it can be examined at a terminal, printed (if
    it is a text file), viewed by an editor, and so on. If it has *write* permission,
    the contents of the file can be changed (for example, by an editor), and the file
    can be overwritten or deleted. If it has *execute* permission, a binary program
    or shell script, that program can be run (but copied only if it has *read permission*).
    An example is given later.


    Access control is determined as follows. The system first of all checks is to
    see whether the user is the *owner* of a file, and if so the *owner* permissions
    are used. Otherwise, it checks if the user is a member of the group allocated
    to that file, and if so checks *group* file permissions. If the user is neither
    the owner nor in the file''s group, they come under the heading of *other* users.
    The group to which a file has been allocated must be a valid group that the system
    administrator has already set up, as discussed above. The owner of a file can
    change the group to which the file has been allocated.


    Privileges for directories have a different meaning than for ordinary files. If
    a directory has *write* permission, files in that directory may be created or
    deleted. If it has *read* permission, it is possible to see the files that are
    contained in that directory (using *ls*, say); if it has *execute* permission
    it is possible to cd to it. A directory with *execute* but not *read* permission
    is useful if you want to allow someone to run one of your commands located in
    that directory, but do not wish them to see what other files you have.


    To find out the privileges for a file, use ls. As an example, consider chris,
    who has six files in the ''home'' directory (including subdirectories). By typing
    ls -l (''long'') the following output might be:


