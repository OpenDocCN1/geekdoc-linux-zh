    The command line tools that provide the same functionality through a terminal
    window can be found in /bin directory in the Linux installation. For creating
    a new user adduser and can be run by typing the command /bin/adduser in a terminal
    window. This command should be disabled to all users root.


    Users can be disabled by editing the /etc/passwd file. This file contains a list
    of user names and their associated passwords (stored in an encrypted format for
    security reasons). To disable a user, replace their encrypted password with the
    * (asterisk) character; this change will make it impossible for the user to sign
    on. Again, you will only be able to do this as the root user.


    If you want to completely remove a user from the system then you should use the
    command userdel. This command can only be run by root users and come with a variety
    of command line options (type man userdel for details). If the -r flag is added
    to this command then will not only remove the user''s name from the password file,
