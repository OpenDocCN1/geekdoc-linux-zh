  md: "# 12.7.1 Single character translation\n\nWe start by considering character-by-character\
    \ translation. You will recall the use in Chapter 10 of the shell command `tr`,\
    \ and there is an almost identical facility available in Perl. The syntax is almost\
    \ identical, except that\n\n+   - arguments are separated and enclosed by three\
    \ slashes,\n- options (such as d) appear at the end.\n\nThe string which appears\
    \ between the first two slashes is called the *search string*, and the string\
    \ between the last two slashes is the *replace string*. For example, the following\
    \ command lowercases each letter in string:\n\n```\n`word = tr/A-Z/a-z/`\n```\n\
    \nThe following command replaces every vowel in `$word` by @ symbol:\n\n```\n\
    `word = tr/AEIOUaeiou/@`\n```\n\nThe option `d` to *delete* characters is supported,\
    \ and causes all characters in the search string *which do not have replacements\
    \ in the replacement string* to be deleted. For example, to delete all vowels\
    \ in `$word` we would code:\n\n```\n`word = tr/AEIOUaeiou//`\n```\n\n> This behaviour\
    \ is slightly more complex than the shell command `tr`\n\n# Worked example 12.9\n\
    \nA Perl script to copy standard input to standard output with all digits deleted\
    \ and the symbol replaced by #.\n**Solution:** Use a *while* loop to iterate through\
    \ the lines of input; for each line, the variable `$_` contains the line, and\
    \ we can use `tr` with option `d` search string `0-9` to delete the digits, and\
    \ replacement string `#` to replace the first character of the search string (@:)\\\
    ```perl\nwhile (<STDIN>) {\n    $_ =~ tr/0-9/#d;\n    print $_;\n}\n```\n\n# 12.7.2\
    \ String editing\n\nJust as the Perl command `tr` is similar to the shell command\
    \ `tr`, the Perl command `s` is similar to Sed. The syntax is the same as for\
    \ tr:\n\n```\nsearch-string/replacement-string/options`\n```"
