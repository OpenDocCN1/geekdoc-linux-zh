    enter a filename, reading that name from standard input, and storing it in the
    variable NEXTFILE. IF NEXTFILE has zero length (i.e. the user has typed in a blank
    line) the loop is exited using break, otherwise the named file is appended to
    the end of the temporary file. Finally, after the loop has been exited, the temporary
    file is sent to standard output and then removed.


