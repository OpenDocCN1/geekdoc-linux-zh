  md: '# The Computing Environment


    Faced with not having a state-of-the-art operating system with to work, a number
    of researchers at Bell, led by Ken Thompson and Dennis Ritchie, decided to create
    a new operating system from ''scratch''.


    Multics had become complex, and it was felt that a much simpler system was needed
    — the name ''UNIX'' arose to emphasise difference between it and Multics. The
    experience gained during the development of Multics contributed much to the design
    of UNIX.


    A number of fundamental design decisions that were taken pervade the whole of
    UNIX. Programs written for UNIX should be simple, and should do each a single
    task well. This was different from the style adopted in some other operating systems,
    where large programs would be developed with many different capabilities, and
    would be commensurably complex. Programs should be designed so that they could
    easily be linked together, the output from one becoming the input to another.
    It would be possible to build more complex programs by joining one tasks together.


    Part of the philosophy underlying the design of UNIX was that the core system
    software, or kernel, should be as small as possible, and only perform those functions
    that are absolutely necessary — all tasks should be the responsibility of the
    kernel. At the same time as UNIX was being written, the language C was being designed,
    and in 1973 UNIX was written using C. C is a high-level language, and as such
    the new (small) kernel and shell could be transferred to a different machine easily.
    This was found to work well, and Bell Labs have to allow the source code for the
    kernel to be distributed to universities.


    # NOTE


