  md: '# 9.8 Safe programming


    To write a script that always works as you want it, it is good practice to perform
    as many checks as you can. Whenever you try to use a file, make sure that a suitable
    action is taken if you cannot access that file. Whenever you write a script called
    with options or arguments, make sure that the first few lines check that it has
    been called with sensible options and arguments.


    So far we have met ways of checking access to individual files, and have remarked
    that names of files may be subject to certain limits. A utility called pathchk
    is available which will give more information than test. When followed by the
    name of a path, pathchk will check that it does not breach any of these limits,
    by (for example) being too long. It will also check that no component of the pathname
    can be searched because it does not have execution permission. With option -p
    (‘portable’) it will also indicate potential problems where the name may be acceptable
    for the current system, but breaches certain limits defined by POSIX, and thus
    presents problems if the name were to be used on a different system.


    Is it sensible to write a script to create a file called instrumentation and expect
    this script to work on all systems? This is a problem that concerns the portability
    of a filename; use pathchk with option -p:


    ```

    $ pathchk -p instrumentation

    pathchk: name ‘instrumentation’ has length 15; exceeds limit of 14

    ```


    This message indicates that any filename length above 14 may not be allowed on
    every system, so the answer is ‘no’.


    If, during the course of a session logged on to a UNIX system, you have reset
    a number of variables, it may be that you accidentally change the value of a system
    variable that was defined when you find what the values of the system-defined
    variables are with command getenv (‘get configuration’). This can also be useful
    in a shell script if you wish to check that such variables have the required values.
    Perhaps the clearest example of where this would be useful in the case of PATH,
    as we have already discussed, that it includes directories within your own file
    space. If you were to make an error while doing this and left out one of the system
    directories, you might be unable to proceed, as some commands you needed to use
    would be denied. By using


