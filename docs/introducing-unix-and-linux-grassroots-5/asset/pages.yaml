    # 6.1 Processes


    So far we have considered a dialogue with a UNIX system as being a sequence of
    *commands* entered by the user, and the system taking *action* at each command.
    We now explore the mechanisms with which UNIX implements commands.


    When describing an operating system, we need to remember that the computer system
    on which it is running contains electronics that run *only* machine code. Any
    command that a user types in is either translated into machine code directly by
    *compilation*, or *interpreted* by another program that is already in machine
    code. A machine code program is known as a *process*. Every command given to a
    UNIX system, and every program run on a UNIX machine, relates to a process — either
    it creates one or more processes, or it is interpreted by one that is already
    running. A UNIX shell has a mechanism for processes that appears to the user to
    be independent of the electronics inside the machine.


    # 6.1.1 Process status


    Within a UNIX system there are one or more processing elements (which we will
    refer to as *processors*) that can only run a single process at any one time.
    At any instant, that process can be described completely by a sequence of bytes
    — some representing the memory contained within the'
  merge: -1
  pgno: 99
- img_proc: true
  md: '# Processes and devices


    processor, some describing the precise current state of the computation. It is
    possible to copy these bytes to memory, and replace them by a sequence of bytes
    from elsewhere in memory. Thus a partially completed process can be temporarily
    suspended (or stopped), and completed at a later time, and in the meantime another
    process can run on that processor. The kernel manages a large ''pool'' of processes,
    most of which are not running at any instant, and moves them to and from the processor
    (or processors) required. Much of this movement is automatic and hidden from users
    — for instance, when there are several users on the machine each with a program
    that is running, the relevant processes are moved in and out of the processor
    so that each is allocated a fair percentage of the time. However, users have a
    certain degree of control over their processes.


    A process can be in a number of states, normally running (currently being worked
    on by a processor), or stopped (not being processed, but available to continue
    evaluation when instructed). When a process completes its execution; it is removed
    from the system entirely and killed. Not all processes will have been invoked
    by a user — some are so-called system processes, and are constantly running while
    the system is operational.


    When you initially log in, you invoke a program that is a copy of the shell, and
    known as your login shell. This program forms a process which must be present
    during the whole time you are logged in. Any subsequent process that is created
    by you is controlled by the terminal (or window) in which you were typing the
    command that it created.


    If you type in a command to a shell, it can be of two possible types. Either it
    is a ''built-in'' shell command, which is interpreted by the shell directly, or
    a new process is created for it. In the latter case the binary code for it is
    copied from storage, and forms the process to execute that command. The process
    that is the current is suspended and running, it is destroyed, and the shell is
    resumed.


    POSIX does not specify the default format of the output

    nYou can find out which processes you have, either running or stopped, by the
    command ps. This displays a list of your processes, by default in a format similar
    to the following:


    # ps


    | PID TTY COMMAND |

    | 10312 p7 00:02:23 sh |

    | 14277 p7 00:00:00 ps |


    Each process is given a unique identification number, which is process-id or PID,
    which is indicated in the first column of the output from ps. The second column
    displays the name of the terminal from which that process is being controlled
    (normally your own terminal or one of your windows).'
