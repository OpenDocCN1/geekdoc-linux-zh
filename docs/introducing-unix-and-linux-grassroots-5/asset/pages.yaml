  md: '# Regular expressions and filters


    Addresses constructed are the same as for Sed, with the addition of two extra
    symbols. These are ^, which means the first line of the file, and . (dot), denoting
    the current line as indicated by the cursor.


    There is a command (''substitute'') which can be used to exchange occurrences
    of a string (denoted by a BRE) for another string. Suppose that, in the file you
    are editing, the cursor is on a line containing


    Jack and Jill went up the hill


    you could swap up for down


    ```

    :s/up/down/

    ```


    The : gets you into colon-mode s is the command to perform a substitution, and
    following s are three slashes. Between the first two is the BRE you wish to be
    changed. Between the final two is the string (just a string, not a BRE) it is
    to be changed.


    Normally, a substitution will occur once on the current line. That is, the address
    . is assumed by default. If the BRE to be substituted does not exist, no change
    will happen. If you follow the command g (''global'') the substitution will be
    made for all occurrences of the BRE on that line. So, to change all words on the
    current line commencing J to the string someone, you would type


    ```

    :s/[a-zA-Z]*/someone/g

    ```


    Before a substitution command you can indicate lines it is to be performed on
    by indicating an address explicitly. Preceding the command with % (percent) will
    cause it to be performed on every line in the file, but preceding it by a single
    line number will do the substitution on that line only. A pair of line numbers,
    separated by a comma, will apply the substitution to that range of lines. The
    start of the file is denoted by ^ and the end by $.


    ```

    :10,20s/Hello/Bonjour/

    ```


    will substitute the first occurrence of Hello for Bonjour on lines 10 through
    20 inclusive.


