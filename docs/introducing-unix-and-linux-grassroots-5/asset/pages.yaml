    # ### 5.3.3 Links


    To create a second name for a file that already exists, we can create a link file
    — sometimes called a hard link — to use it the command ln (''link''). With two
    arguments, which must be filenames, provided the first file does exist and the
    second does not, we can create a link from the first to the second. For instance,
    if user sam whose home directory is /cs/ugrad/sam has a file datafile I wish to
    have in my own home directory under the name samsdata, then the command ln can
    be used to create a link between the two:


    ```

    $ ln /cs/ugrad/sam/datafile samsdata

    ```


    We say that samsdata has two links, and it has two names, one samsdata, the other
    /cs/ugrad/sam/datafile. The file has a single inode, however. When samsdata is
    amended, the contents of /cs/ugrad/sam/datafile are changed at exactly the same
    time (and vice versa). If we delete /cs/ugrad/sam/datafile, we actually delete
    filename, and the file continues to exist, but with only one name (samsdata) and
    one link. The kernel will keep track of how many names (links) an inode has, and
    when this drops to zero the file space allocated to that inode is released for
    elsewhere. There is one important point to note here that inodes are unique only
    within a single filesystem, and therefore you can link a file to another file
    within the same filesystem. We can check precisely which inodes are allocated
    to which files by using option -i (''inode'') to ls:


    ```

    $ ls -i

