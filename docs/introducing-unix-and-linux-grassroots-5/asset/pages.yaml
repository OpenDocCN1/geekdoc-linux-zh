    by the University of California at Berkeley. These organisations, developed their
    own versions of UNIX, known respectively as System V and BSD. Industrial users
    tended to use System V, whereas BSD UNIX was common in universities and colleges.


    By the late 1980s UNIX had been implemented by many manufacturers, each of whom
    had developed versions which, although based on System V or on BSD, had their
    own features. It appeared that the popularity of UNIX, coupled with the proliferation
