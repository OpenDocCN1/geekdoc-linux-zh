  md: '# CHAPTER 11


    # Awk


    # CHAPTER OVERVIEW


    This chapter


    +   introduces simple use of Awk.


    # ACRONYM


    Awk is named after its inventors'' names Aho, Weinberger and Kernighan


    The utility known as Awk, and described as a ‘pattern scanning and processing
    language’, is a complete programming language, with a syntax resembling that of
    C.


    It can be studied as a language in its own right, or it can be integrated into
    shell programming when other utilities are found to lack sufficient power or flexibility.


    # 11.1 What is ‘awk’?


    If you are familiar with high-level languages, you will recognise the need for
    such constructs as loops, variables, conditional statements, input and output
    facilities, and a library of predefined procedures; in other words, a rich syntax
    allowing many complex tasks to be performed easily and efficiently by an experienced
    programmer. The shell is a high-level language, although its features are tailored
    to a very special task, namely managing UNIX processes, and many high-level constructs
    are not present in the shell.


    If you need to write a program that is not clearly suited to writing in the shell,
    you would normally use a language such as C or Pascal in which to write it. There
    is a grey area, though the application does seem to fit in well with the ideas
    and methods underlying shell programming, yet the power of a full high-level language
    would be advantageous. A typical situation is where the contents of a file (or
    output from a pipe) contains complex (numerical or textual) data, organised into
    records (e.g. lines) and fields (e.g. columns), and calculations are required
    to be performed on the data.


    To illustrate this, consider data that has its columns a person’s name, followed
    by numbers representing that person’s marks in a number'
