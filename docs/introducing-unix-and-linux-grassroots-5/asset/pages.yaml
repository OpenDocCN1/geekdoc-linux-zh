    28410 p4 S 0:00 sleep 100

    28417 p R 0:00 ps

    ```


    There are four processes: your login shell 15826, the ps process, process

    28409 for the shell that interprets the script, and the process 28410 for

    the command in the script. Now, replace the first line of the file by exec

    sleep 100, and we get:


    ```

