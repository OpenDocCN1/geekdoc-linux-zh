    # 13.1.4 Managing users


    Managing users, as with most administrative tasks, can be done through interaction
    with a graphical user interface such as the Kuser supplied by KDE or, if you prefer,
    through a terminal window.


    Kuser will do most of the tasks described below. It is designed to allow you to
    act as an administrator to the users or groups of users that have access to your
    Linux system; this includes the tasks of creating, disabling and removing users
    from the system.


    # NOTE


