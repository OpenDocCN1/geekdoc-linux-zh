    # 1.3.4 System Administration


    Traditionally, UNIX systems have been multi-user systems with individuals simply
    access as users. In these situations, there is usually someone, who is in day-to-day
    charge of the system, and known as the system administrator. If you are using
    this kind of system and have problems that neither nor your colleagues are able
    to resolve, then the system administrator will be able to help, or at least point
    you in the direction of someone who can. You should find out who system administrator
    is, and make sure you are in possession of any documents that he or she wishes
    of the system to have.


    More, however, there has been a move towards the use of UNIX for individually-run
