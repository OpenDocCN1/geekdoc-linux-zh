  md: '# 4.5 Files


    In UNIX, you are able to create, delete and edit files, before attempting to perform
    such operations on your files, you may need to check which files you have at the
    moment. The command to do this is `ls` (list).


    If you have only started to use the UNIX system, you should not have created any
    files. If you type `ls` on its own, this should be confirmed when nothing is printed
    in response, so:


    ```

    $ ls

