  md: '# NOTE


    # Maintaining your Linux OS


    linuxconf is a sophisticated administration system for Linux


    # 13.1 Basic management


    Maintenance and administration can take place at various levels in your system.
    Most Linux installations have with them copy of the linuxconf tool. This is a
    versatile tool with which a number of administrative tasks can be performed, including
    setting the system time, changing the network settings, performing user administration
    and setting up files systems


    Maintenance can also be coordinated through tools supplied by the Linux desktop
    environment. These tools differ to the Linux distribution you are running. KDE,
    for example, comes with a built-in Control Center (which can be reached through
    the K menu). The KDE Control Center is similar to the Settings menu that is found
    in the Windows operating system. It therefore provides a convenient interface
    with which manage processor and memory configuration, device information, the
    windows environment, the configuration of the file manager, and so on.


    A number of maintenance tasks can also be performed using the YaST set-up tool
    which was introduced in Section 36.6.1.


    It is worth noting that some of these tools will look different (that is, they
    will provide you with different options and capabilities) under different user
    logins. You can expect to be provided with the full capabilities of the tools
    if, and only if, you are logged in as the root user.


    The following subsections provide a useful summary of basic management tasks,
    which should probably form part of your administrative routine. Beyond this, the
    following web sites are recommended sources of information for more detailed Linux
    management and administration issues:


    +   * www.linuxdoc.org

    This is the home of the Linux documentation project, including online guides,
    HOWTO pages, frequently asked questions and manuals for a number of Linux activities;


    +   * www.linuxnewbie.org

    Contains news and articles including help for new and more advanced users;


    +   * www.freshmeat.net

    Reportedly contains the largest index of UNIX software and applications on the
    Web. This is a good source of free Linux software and will probably contain all
    the applications that you, or the users of your system, will require.'
