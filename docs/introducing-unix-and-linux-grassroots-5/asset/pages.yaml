    # 1.3.2 Application Programs


    As mentioned earlier, the hardware alone is not enough. To do anything useful
    with a computer, you need to run software, or programs, on the hardware. Programs
    can be used to do pretty anything you want, but commonly include word-processing,
    scientific calculations and games, and even support the development of yet more
    programs. What is important to note here is that for each different application,
    you need a different application program to run on the computer. If you want to
    do some word-processing, you''ll need to get a word-processing program to execute;
    word-processing can''t be done directly by the computer otherwise.


    # Programming Languages


    The processing units inside a computer understand a language called machine code,
    and all the calculations that a computer performs use code. Machine code, which
    is a ''low-level'' language, is specific to the particular make and model of computer
    on which it runs, and is not designed to be read by humans. Any instruction to
    a computer must be translated (somehow) to machine code before the computer will
    understand it. It is unlikely you will ever need to come into direct contact with
    machine code.


    Typically, programs are written in high-level languages that are easily readable
    by humans, but not by computers. They require compilers and interpreters to perform
    a translation into the machine code that computers can understand.


    # 1.3.3 The Jigsaw System


    The final piece of the jigsaw of modern computing, to make the hardware and software
    work together, and to make the different bits of hardware the screen, keyboard
    and processor talk to each other, is what is known as the operating system, which
    is system software as opposed to application software. The operating system is
    a complex program (or collection of programs) that controls the internal operation
    of the computer to ensure that all the different things that are taking place
    at the same time are done effectively and sensibly. while the computer accepts
    input from the keyboard and displays output on the screen, it may also be processing
    some data and accessing the hard disk, all at the same time.


    Just as there can be different processors, different screens and keyboards, and
    different application programs, so there can be'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# Introducing UNIX and Linux


    operating systems. If you''ve got this far, then we should be able to assume that
    you know that your particular operating system is (or is likely to be) UNIX or
    Linux, but you may also be familiar with Microsoft''s Windows, with DOS, or with
    some other operating systems as CPM macOS, Multics, BeOS, PalmOS or VMS.


    DOS = ''Disk Operating

    System''

    CPM = ''Control

    Program for

    Microcomputers''

    VMS = ''Virtual Memory

