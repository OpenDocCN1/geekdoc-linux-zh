- img_proc: true
  md: 'of examinations. You need to process that data to determine each person''s
    overall mark, possibly converting it to a grade, and to calculate overall statistical
    data for the individual examinations. Perhaps you would like a graphical display
    of the mark distribution. These tasks can be performed with the shell (with some
    difficulty), but they can be programmed naturally using Awk.


    Mention has been made before of the language C — if you program in C then Awk
    will look familiar to you, and vice versa. There are features of Awk, as pattern
    matching and associative arrays, which are not available with C, and vice versa.
    If you write a program in C, it will probably execute faster than an equivalent
    program in Awk. You should therefore bear in mind that significant differences
    exist, and take care not to confuse the two. There is insufficient space in this
    book to examine Awk in great detail, so we shall concentrate on those features
    of Awk which complement the other shell utilities.


    # 11.2 Invoking ‘awk’


    Just as Grep and Sed, simple use of Awk involves a script containing the commands
    that Awk uses. This script can either be a string that is an argument to `awk`,
    or can be contained in a file named by -f.


    The data the Awk script will process is either piped from standard input, or is
    contained in one or more files given as arguments to the command. The data is
    divided into `records`, each of which is subdivided into `fields`. Unless otherwise
    stated, each record is a single line of the data, and fields will be separated
    by whitespace. To represent students with their marks, for instance, a dataset
    might look like:


    Cringle Chris 14 75 33

    Smith Sam 56 58 45

    Jones Jo 9 63 51


    This data contains three records (lines), each record containing five fields (columns
    of text). An Awk script consists of a sequence of pairs


    ```

    pattern { action }

    ```


    where either the `pattern` or the `action` can be omitted. The data is read, record
    by record, and each record *matches* a pattern in the script causes the corresponding
    action to be performed. If the pattern is omitted the action is performed on every
    single line of input data. For the rest of this chapter we shall concentrate on
    the format of the script, and assume that data is piped from standard input. The
    simplest Awk script is


    ```

    { }

    ```'
