    when you log into the system can be changed. If you are using a UNIX system at
    a University or College, it is likely that a document is produced by your institution
    to explain how to use the UNIX machines, and you should consult that document.
    It will clarify the differences (if any) between your UNIX system and the standard
    version described here.


    # 4.2 Logging out


    When you finish using UNIX — known as logging out — there are two things that
    you need to do. Firstly, in each command window you should type ctrl-D on a line
    by itself. Secondly, you must close the window manager by following the menus
    to Logout. The machine will respond by giving you a prompt so that the next user
    can log in.


    # 4.3 Commands


