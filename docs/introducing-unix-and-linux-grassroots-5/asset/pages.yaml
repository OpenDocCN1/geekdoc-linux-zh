    fixed) number of times. For instance, to page, in sequence, each readable file
    in the current directory:


    ```

    $ for i in $( ls )

    > do

    > [ -r $i ] && rm $i

    > done

    ```


    The syntax for the for loop is


    ```

    for name in values

    do

    commands

    done

    ```


    and this causes the variable name to be set in turn to each word in values, and
    commands executed with name set to that value. So, in the above example, $( ls
    ) becomes a list of the files in the current directory, and variable i is set
    to each one in turn. The filename, which is of i, is tested to see if it is readable,
    and if so it is paged using more.


