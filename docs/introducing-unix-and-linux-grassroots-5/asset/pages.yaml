    you only need approximately 250 MB of disk to be able to store and compile the
    source code plus an 18 MB of /tmp (space below) and 50 MB of disk in order to
    do the install. Another advantage of WINE is that it is free.


    # NOTE


    +   (+) WINE is free

    (+)\ applications run fast

    (-) applications don''t work


    Coral has been using WINE to port your WordPerfect to Linux, so there are some
    well-documented success stories. However, there are difficulties with some of
    the Windows applications, so it is worth looking at the Application Database on
    the WINE web page before whether this is going to be appropriate for your needs.


    Once you have set WINE on your computer, you can install Microsoft applications
    by invoking a terminal window and typing wine followed by the name of the set-up
    program. A similar procedure is used to run the application once it has been installed.


    More details on WINE can be found at www.winehq.com.


    # 3.6 Installing Linux


    Once you are satisfied that you have chosen an appropriate version of Linux that
    matches the capability of your computer and also meets your own needs, you are
    ready to begin the installation process.


    # 3.6.1 Installer software


    Most of the Linux distributions, including SuSE and Red Hat, have very good installer
    software. The SuSE distribution includes the text-mode YaST installer which is
    designed to make the process of installation painless as possible. You may also
    find references to the GUI-based YaST2, despite being more memory intensive, is
    to use. Each version of Linux has its own tool similar to YaST.


    The installer software will probably provide you with a number of installation
    modes as recommended, customized and expert. If this is your first Linux installation
    then you should choose a recommended installation. This will automatically install
    the core components and provide you with enough options to maintain control over
    the amount of memory needed for the installation.


    Many of the installation questions are straightforward. The choice is less clear,
    however, when you are asked whether you are installing as a workstation, as a
    server (installation) or for development. Again, if this is your first installation
    and you are planning on using your computer as a stand-alone machine, then you
    should opt for the ''workstation'' mode. You should also select a security setting
    if prompted to do so; something around ''medium risk'' should be adequate if you
    are planning on connecting your computer to the Internet.


    # ACRONYM


    YaST = ''Yet another Setup Tool'''
