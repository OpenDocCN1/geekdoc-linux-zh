  md: '# Introducing UNIX and Linux


    # NOTE


    To find the IP address of your machine try the command ifconfig


    purposes and the number 255 is used for broadcasting packets of data to the entire
    network.

    Each IP address in a local network will share a common ''network portion'' and
    contain a unique ''host portion''. One of the machines I use has the IP address
    137.205.227.85; my neighbour in the office next door has a computer with the IP
    address 137.205.227.84. The host portion of this address is represented by the
    last (the far right) numbers — 227.84 or 227.85; the network portion of the address
    is the 137.205 part of the university network (a subnet). As it is essential for
    the number of hosts to be contiguous, there are at least 85 hosts in subnet 227.


    To retrieve the network portion of an IP address subnet mask (or Netmask) is used.
    When this is ''bitwise ANDed'' with the IP address, the address of the network
    to which the address is revealed (see Table 13.1). This mask also allows the network
    to be further subdivided. Table 13.2 shows how an IP address can be decomposed
    into its associated masks, portions and addresses.


    # Table 13.2 Decomposing IP addresses


    | Host address | 137.205.227.85 |

    | Network mask | 255.255.255.0 |

    | Network portion | 137.205.227. |

    | Host portion | .85 |

    | Network address | 137.205.227.0 |

    | Broadcast address | 137.205.227.255 |


    # 13.3.3 Domain names


    # ACRONYM DNS = ''Domain Name Service''


    IP addresses are not easy to remember and therefore computers are usually referred
    using their domain name. You will be familiar with the use of domain names when
    accessing sites on the Internet. These domain names are mapped to IP addresses
    through a Domain Name Service (a DNS).

    The domain name for the IP address 137.205.227.85 is cment.warwick.ac.uk. The
    host machine cement maps to the host portion 85 in the IP address; the 227 part
    of the network portion of the IP address corresponds to the dcs (Department of
    Computer Science) network; the 137.205 part of the IP addresses maps to warwick.ac.uk.
    The University of Warwick may not own all the class B 137.205 network addresses;
    the slice of addresses they own is coordinated by UKERNA the organisation that
    administers all of the .ac and .gov domain names in the UK.'
