    # 4.6 Input and output


    We now leave discussion of editors and return to consideration of the shell.


    When you type in text at the terminal, the input is buffered; the characters you
    type are not immediately transmitted to the shell. They are initially stored in
    a temporary area of the computer''s memory called buffer; the contents of the
    buffer are usually transmitted to the shell at the end of each line, when you
    press Return. A consequence of buffering is that if you make an error when typing
    in data on your terminal, you can correct it. Systems vary in the amount of ‘line-editing’
    they allow, and you can expect at least the following:


    +   DEL deletes the most recent character typed

    ctrl-U deletes the whole of the line currently being typed


    Once you have typed in a command, and the command begins to be executed, you may
    be requested to type in data as input to the command, which will, in response,
    send messages as output. Output consists of the stream of characters usually sent
    to the screen. The commands we have looked at already—ls, date and who—give output
    but require no input. Commands—such as vi—will ‘interact’ with you, and need to
    type in data while they are running. For simple commands that require input, the
    input is formed by the characters you type in the keyboard. More complex commands
    (vi is in this category) may also have other input and output, but this description
    of how a command communicates with the system will serve us for the present.


    Each command has associated with it three input and output streams, as shown in
    Figure 4.2. They are called standard input, standard output and standard error
    (often abbreviated to stdin, stdout and stderr). Normally, standard input will
    be taken from the keyboard, and standard output and standard error will both be
    sent to the terminal screen. A command may, in addition, have other input and/or
    output streams. Each input/output stream is also given a number: 0 for standard
    input, 1 for standard output and 2 for standard error.'
