    Between symbols [ ] comes either a list of characters, one or more ranges of expressions,
    possibly preceded by the ! (exclamation mark) character. A range, which is denoted
    by two characters separated by a hyphen, means all characters that are lexically
    between (and including) those two characters. Thus [m-q] matches any lower-case
    letter between m and q inclusive. Note that the character to the left of the hyphen
    in a range must lexically precede the character to the right or the range matches
    nothing. The ! indicates that the word will match any single character not specified
    between the brackets. Table 8.2 gives some examples of patterns.


    | Table 8.2 Some patterns | [abc] | matches a or b c |

    |---|---||

    | | [1-z] | matches all lower-case letters 1 to z inclusive |

    | | [A-Cb-k] | matches upper-case letters A to C and lower-case b to k |

    | | [XY-z] | matches X and Y and any lower-case letter |

    | | [-a-z] | matches any lower-case letter or a hyphen |

    | | ![0-9] | matches any character that is not a digit |


