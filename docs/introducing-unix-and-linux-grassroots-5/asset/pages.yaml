  md: '# 9.11 Miscellaneous utilities


    Although the structure of files on a UNIX system is uncomplicated, other operating
    systems may impose a more complex structure on how their files are represented.
    If you need to convert a file, either to export it, or to import it from, a non-UNIX
    system, use dd (''disk-to-disk''). For example, some systems require that files
    be structured as a sequence of fixed-size blocks, or might use a different character
    set from ASCII. This command can also perform simple translation of characters
    — for instance, if you received a funny, which contains only upper-case letters,
    dd can create a file with lower-case letters


    in place of the upper-case ones:


    # NOTE


    ```

    $ dd conv=lcase < funny

    lcase=''lower''

    ```


    You can try this. More seriously, if you need to read from or write to a file
    to be used on a non-UNIX system, you should examine the manual page for dd carefully.

    Suppose you wished to run a utility with the arguments that you piped to it. This
    might be the case if the arguments were split over several lines. A simple example
    might be if you had a file list containing filenames, and you wished to ls -l
    each of them. Using the mechanisms so far discussed, the resultant script would
    be inelegant:


    ```

    $ X=$( cat list ); eval ls -l $X

    ```


    By use of the $( ) mechanism, we have concatenated all the lines of list into
    a single string, and have passed that string to ls -l. The utility xargs can help:
    it takes its arguments as a command, and then reading from its standard input
    appends options to that command, and then runs it. The above example would then
    become:


    ```

    $ xargs -1 <list

    ```


    # NOTE


    A more serious, and frequently quoted, example of the use of xargs in conjunction
    with -exec find might create a large number of processes. Suppose your home directory
    contains a large number of subdirectories, and you wished to perform ls -ld on
    each of them. One possibility would be:


    find was introduced in Chapter 7


    but this would create as many processes as directories — it is inefficient.

    More effective — and quicker would be:


    ```

    $ find ~ -type d -print | xargs ls -ld

    ```'
