  md: '# The Computing Environment


    # CHAPTER OVERVIEW


    This chapter


    +   - reviews basic notions of computer hardware and software;

    - outlines the different kinds of software program;

    - introduces the basic philosophy of UNIX and Linux; and

    - provides a brief description of the history of UNIX and Linux.


    If you pick up any book over ten years old on the subject of computing, you could
    get quite different ideas of how people use their computers. The basic ways of
    using computers haven''t changed, but modern places an unimaginable amount of
    control and power with the individual user. This means that the user now has the
    ability (and often the need) to deal with issues relating to the administration
    of the computer to get the best out of it. In this book, we''ll be explaining
    just to understand what this involves, and how to minimise the amount of effort
    required for effective use of your computer.

    We start in this chapter by reviewing some basic concepts of computing in a non-technical
    way, so that if you really are a beginner, reading through this chapter should
    bring you up to speed. If you are already familiar with the ideas of hardware
    and software, input and output, processors, systems software, and applications
    programs, you may choose instead to move swiftly on to Chapter 2.1, or simply
    to skim this chapter.


    # 1.1 What is a Computer?


    In basic terms, there are essentially two kinds of "thing" involved in computing.
    There are things you can kick, actual bits of machinery that you can pick up and
    take away, including the computer itself, printers,'
  merge: -1
  pgno: 12
- img_proc: true
  md: '# Introducing UNIX and Linux


    screens and other physical devices (digital cameras, scanners, disk drives, CD
    drives, etc.), which are collectively and individually known as hardware Thus,
    hardware includes the devices you use to communicate with a computer system (such
    as the mouse, keyboard), the actual components that make up that system, and any
    other devices.

    Unfortunately, the hardware won''t work by itself and needs detailed instructions,
    or programs, to make it do what should. In addition to the hardware, therefore,
    it is also necessary to have a set of programs that tell the hardware what to
    do. These programs, which refer to the actual instructions rather than the medium
    on which they are stored, collectively known as software. Software is needed for
    the basic operation of computers (if the software that is the subject of this
    book, UNIX and Linux) as well as for the more common applications that you may
    already be familiar with, such as word-processing, spreadsheets, games, MP3 playing,
    and limitless other possibilities. By themselves, hardware and software are not
    enough to do the things we want of computers — it is the combination of hardware
    and software that enables effective use of modern computers.

    Below, we describe the different kinds of hardware and software in a little more
    detail.


    # 1.2 Hardware


    # 1.2.1 Processors


    The most important part of the overall system is the processor (or central processing
    unit, CPU) on which the computer is based, and which does the main work of the
    system. In recent years, the advance of the PC has been fuelled by progress in
    such processors, which are becoming faster and more powerful. In PCs, these have
    included the series of Pentium processors developed by Intel, with alternatives
    from companies like AMD. Other computers have different processors, like Sun''s
    SPARC processor. Whatever processor machine uses is not important for now — there
    may be variations in speed and power, as well as in other more technical differences,
    but the key point to note is that this is the main component of the machine.


    AMD = ''Advanced

    Micro Devices, Inc.''

    SPARC = ''Scalable

    Processor ARchitecture''


    # 1.2.2 Input Devices


    Although the processor is most critical, it is of little use if you can''t display
    the results of the computation it performs, or if you can''t modify and the kinds
    of computation you want to perform. For this reason, we need input and output
    devices — hardware components that allow users to interact with the processor
    in easy and convenient ways.'
  merge: -1
  pgno: 13
- img_proc: true
  md: '# The Computing Environment


    In order to instruct a computer to perform a task, we require a way to provide
    instructions as input. Perhaps the most recognisable input device is the **keyboard**
    (typically of the ''QWERTY'' variety because the layout of the keys, similar to
    a typewriter) which nearly all computers use to receive textual and numeric input.
    The keyboard is the most usual way in which people write programs or enter data
    on those programs might operate. However, there are also other ways to provide
    input to a computer. For example, many people now have scanners to encode graphical
    images to be provided as input. Similarly, digital cameras, bar- readers in shops,
    and even sound recorders offer different ways of getting data to the processor.
    In this book, we will focus on the standard keyboard as our main input device,
    but we also note that the **mouse**, with the purpose of enabling the selection
    and movement of items displayed on the screen, is a vital part of modern computer
    systems.


    # 1.2.3 Output Devices


    Output devices are also varied, and we will focus primarily on the screen or monitor
    (or visual display unit — VDU — use a somewhat out-of-date expression) that typically
    comes as part of the package with the processor and the keyboard.


    In the past, people used so-called **dumb terminals**, which are largely redundant
    now. A dumb terminal consists of a keyboard and a screen, and can display the
    same sort of text and simple characters as a typewriter. On the screen is a **cursor**,
    which is either a block (a filled rectangle of a letter) or an underscore, marking
    the point on the screen at which typed characters appear, and also where any message
    the computer writes will. The equivalent of a dumb terminal is now commonly referred
    to as a **command window** in many systems.


    These days, modern computers typically use a screen (to display both the input
    that is provided through keyboards, for example, and all results of the processing
    performed), a keyboard and a mouse. The configuration is sometimes referred to
    as a graphics terminals, to distinguish it from a dumb terminal. These are capable
    of much more sophisticated output. In particular, the screen is a high-resolution
    display (nearly all colour), allowing complex figures to be drawn as well as simple
    characters. Usually, a system is employed by which the screen is divided into
    rectangular areas called **windows**, with which to communicate individually.
    The computer itself may be a PC, as shown in Figure 1.1, a **workstation** or
    a laptop, but that is not important. We will assume the use of a command window,
    which applies to all equally. If you are using any of these, you can create such
    a window, which behaves as if it were itself a dumb terminal, having its own cursor.
    Typically, there is also a global cursor that moves each time you move the mouse;
    you'
  merge: -1
  pgno: 14
- img_proc: true
  md: '# Introducing UNIX and Linux


    select which window the keyboard will communicate with by moving the global cursor
    so that it is within the chosen window.


    The look and feel of the various kinds of computers can vary enormously, as can
    the way in which windows on a screen are manipulated. Either a window manager
    or a desktop manager can be used to control the windows on a screen, and though
    the distinction between the two kinds of software is somewhat blurred, a desktop
    manager typically has more features and capabilities than a window manager. We
    will go into more details about these later on in Chapter 3.


    Figure 1.1 A typical computer, with screen, keyboard and mouse


    ![](img/c00e38ea653baa916537682ab959e377_15_0.png)


    These basic components of processor, screen and keyboard are the key pieces of
    the modern computing system, and their combination underlies all of the details
    that follow in this book.


    # 1.3 Software


    # 1.3.1 Input and Characters


    When communicating with UNIX, users send to the system a stream of characters.
    Each time a key on the keyboard is pressed, a character is sent to the machine.
    Usually, the computer echoes the character so that it is'
  merge: -1
  pgno: 15
- img_proc: true
  md: '# The Computing Environment


    displayed on the screen. Similarly, to communicate with the user system sends
    a stream of characters to the user''s computer, which is able to interpret the
    particular character coding and display the characters on the screen accordingly.


    While interacting with the system, a user types in lines of text from the keyboard,
    terminating each line by pressing the Return (or Enter) key. These lines are interpreted
    as instructions to UNIX, which responds accordingly, and displays messages on
    the screen. On a graphics terminal, this dialogue is between the keyboard and
    a specific window (typically the window over the cursor has been placed). Manipulation
    of other devices such as a mouse also results in the transmission of characters
    to the UNIX machine. However, these are interpreted as relating to the management
    and display of the windows only.


    Commands to UNIX are executed by a program called the shell. We shall see later
    that the shell is just one example of a program that can run on a UNIX system,
    but is the principal interface between a user and the very heart of the system
    software, known as the kernel


    Most characters that we use are the printing characters. These, which include
    letters, digits, punctuation marks and the other symbols marked on the keyboard,
    are displayed in the obvious way. However, other characters known as control characters
    (listed in Table 1.1), are sometimes required by a UNIX system. Each is stored
    as a number using a character as ASCII. For instance, the character whose code
    is 7 is sometimes referred to as ''bell'', if printed on your terminal, normally
    causes the terminal to make a noise (typically a ''beep'').


    # ACRONYM


    ASCII = ''American Standard Code for Information Interchange''


    # NOTE


    The bell character was originally used on ''teletype'' terminals to attract the
    attention of the user in the days of the telegraph


    Each control character has a name, an acronym of its description. For character
    number 7, this is BEL for ''bell''. Control characters can be typed by pressing
    a key while holding down the Ctrl-G or G. For BEL, the key is G, and for this
    reason BEL is often written as Some of the other control characters have anachronistic
    names that relate to the functioning of a teletype, but most of them will not
    concern us here.


    Control characters have purposes which, for the most part, are obscure. Many operating
    systems (not necessarily UNIX) to structure data, and have meanings with historical
    relevance. Some of the more useful control characters include the TAB, when sent
    to the screen, of moving the cursor to the next position (usually columns 8, 16,
    24, 32, etc.). The key marked TAB or → when pressed, transmits a TAB character
    to the computer. The character NL (Newline) causes the cursor to move down to
    the left-side of the next row on the screen. This character is provided as input
    to the machine when the key marked RETURN (or ENTER or ←) is pressed. The escape
    character, which would not normally be'
  merge: -1
