  md: '# Maintaining your Linux OS


    For further Linux networking information see the following sources:


    +   - **www.linux.org** — follow the links to ''Linux Networking HOWTO''. Incidentally,
    there are lots of other HOWTOs at this web site that contain useful information,
    from how to configure a CD-ROM under Linux to how you should go about installing
    Chinese.


    +   - **comp.linux.networking** — this is a useful newsgroup to networking and
    related matters. If you have any networking problems, they be large or small,
    you will probably find someone on this newsgroup who has experienced the problem
    before.


    There are a variety of ways of networking collections of UNIX-based computers.
    Probably the most common is the use of Ethernet.


    # 13.3.2 MAC and IP addresses


    If you are planning on adding your computer to an UNIX network, or if you are
    planning on building your own local network, then you will probably already have
    ensured that your computer has an Ethernet card. Each Ethernet card has a unique
    Media Access Control (MAC) Despite being unique, these addresses are not commonly
    used as network identifiers and instead the MAC address is mapped to a higher
    level IP (Internet Protocol) address.


    IP addresses are 32-bit numbers, usually represented in dotted decimal notation
    (i.e. xxx.xxx.xxx.xxx), which uniquely identify each interface of a host or network
    router. Using this notation, each decimal number can represent eight bits of binary
    data and therefore the numbers between 0 and 255. The first of these decimal numbers
    is important, as it determines the class of network to which this IP address belongs
    — see Table 13.1.


    ![](img/c00e38ea653baa916537682ab959e377_276_0.png)


    Table 13.1 Network classes and addresses and Netmasks


    | Class | Range | Netmask |

    | A | 0.0.0.0 to 127.255.255.255 | 255.0.0.0 |

    | B | 128.0.0.0 to 191.255.255.255 | 255.255.0.0 |

    | C | 192.0.0.0 to 223.255.255.255 | 255.255.255.0 |


    Network classes are used to break networks down according to their size. Class
    A networks can have up to 16,777,214 hosts, class B networks 16,384 hosts and
    class C networks 254 hosts. This might look restrictive (and there are proposals
    to update this 32-bit IP version 4 to a 128-bit version 6), but sharing IP addresses
    across many hosts makes this less of a problem than it might seem first.


    There are certain IP addresses that are reserved for special purposes. The number
    0, for example, is used to refer to the current network or host, the number 127
    (known as a loopback) is used for diagnostic


    265'
