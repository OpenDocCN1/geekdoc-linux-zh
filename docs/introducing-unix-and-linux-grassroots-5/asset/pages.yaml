    \ modes and change and modification times remain the same. The amount of compression\
    \ depends on the type and size of the input file; for a typical text file it is\
    \ of 50-60%.\n\n+   **gzip** — is a compression utility designed to replace the\
    \ compress command. The main advantages of gzip over compress are the better compression\
    \ ratio and the freedom from patented algorithms. gzip produces compressed output\
    \ files which can be identified by the .gz extension. To uncompress the .gz file,\
    \ the command gunzip is used. gzip may not have been included in your Linux installation\
    \ and if this is the case, then the utility can be downloaded free of charge from\
    \ www.gzip.org.\n\n+   **tar** — archives and extracts files to and from a single\
    \ file called a tarfile. Common operations include\n\n`tar -cvf resultsfile`\n\
    \nwhich archives all the files in the current and nested subdirectories, and\n\
    \n`tar -xvf resultsfile`\n\n retrieves these files while maintaining the original\
