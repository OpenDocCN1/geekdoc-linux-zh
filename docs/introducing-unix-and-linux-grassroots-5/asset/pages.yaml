    may exist in your home directory: .bash_profile, .profile. Write a Perl script
    either to display the contents of that file, or to inform you that neither exists.

    Solution: Try to open each of the files in turn, and if both fail. If one has
    opened, display its contents.

    # Try to open the one of the two files

    open(INPUT, ".bash_profile") ||

    open(INPUT, ".profile") ||

    die "Neither .bash_profile nor profile found";


    # If one is open, use filehandle INPUT to read from it

    while (<INPUT>) {

    print "$";

    }


    # Finally, close the file

    close(INPUT);


