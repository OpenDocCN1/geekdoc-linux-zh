  md: '# Introducing UNIX and Linux


    # 2.3 Technical Basics


    # 2.3.1 Bits, Bytes, Words and Characters


    Data inside a computer is stored as binary digits. Each such digit is called a
    bit. Exactly how bits are stored does not concern us here, but several different
    methods can be used depending on where the computer system the data is required.
    Bits are grouped together in groups (usually) 8 to form a byte. Bytes are then
    grouped in 2s, 4s or 8s to form words, the number of bytes in a word depending
    on the machine being used.


    Figure 2.2 A 4-byte word


    ![](img/c00e38ea653baa916537682ab959e377_25_0.png)


    It is rarely necessary to enquire what individual bits are stored on a computer.
    Normally, the byte is regarded as the most basic unit of storage on a machine.
    Since a byte contains 256 permutations of binary digits, a byte can represent
    any number between 0 and 255 inclusive (or between -128 and +127, or other ranges).
    Just with a typewriter, communication with UNIX is character-by-character. Unless
    you are dealing bit-by-bit with the data stored in the system''s memory; it is
    helpful to think of each bit representing a character, such as the letter ''A''
    or the symbol ''@'', since there is a correspondence between characters and the
    numeric codes (between 0 and 255) that can be stored in a byte. The most common
    coding scheme used is ASCII, in which codes for the upper-case letters ''A'' to
    ''Z'' are 65 to 90, for lower-case letters ''a'' to ''z'' they are 97 to 122,
    and for digits ''0'' to ''9'' they are 48 to 57. Other codes exist. The codes
    are summarised in Table 2.1.


    # ACRONYM


    ASCII = ''American Code for Information Interchange''


    In the early days of computing, the electronic components were often unreliable,
    and the final bit in a byte was used as a check digit whose value is determined
    by a simple calculation from the other seven bits. If one of the other seven bits
    is changed, the value of the eighth, which is referred to as a parity bit, is
    also changed. This parity check can then be used to identify bytes whose contents
    have been accidentally altered.'
