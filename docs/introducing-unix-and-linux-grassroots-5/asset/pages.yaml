    are listed together with how much of each is in use, and within the directory
    hierarchy it is placed. Notice that, in this example, for /dev/0000a is more than
    100% full — this is not a printer''s! For each filesystem, normally 90% of the
    physical space on that device is available. This UNIX leeway to warn if they attempt
    to use more of a filesystem than actually exists. Without this extra space, the
    kernel might find itself without enough workspace to continue, and the system
    might crash. However, the super-user is allowed to use the 10% of a filesystem,
    and the capacity is measured relative to the normally allowed 90% of the filesystem.
    Although most UNIX systems are set up this way, the 90% is not cut in stone, and
    the super-user may change it as local circumstances dictate.'
