    # 3.3 Single boot


    If you are installing Linux on an old computer (without a CD drive, with 32 Mb
    of memory or less, with a 75 MHz processor orabouts) then you will find that the
    way in which you install Linux is already limited. In this case you must install
    Linux as a ‘single boot’ system. This means that you must essentially forfeit
    your previous operating system for your new version of Linux. While this is not
    always what people want (as you may want to use Windows from time to time), this
    is the simplest way to install Linux on your machine.


    You need to partition your hard disk before Linux can be installed. It is worth
    checking whether the version of Linux you have chosen has its own partitioning
    software as part of the software bundle. If not, you will have to use the DOS/Windows
    FDISK program.


    The single boot option does have a number of benefits. For example, it provides
    a fast, reliable and easy to use system.


    # 3.4 Dual boot


    If you possess a more up-to-date computer, or you are keen not to lose the use
    of your previous operating system, then you should install Linux as a ‘dual boot’
    system. This has the overwhelming advantage of allowing you to switch between
    operating systems (Windows and Linux for example) and being able to use the applications
    provided by each. There are many of possible dual boot-set configurations, which
    we consider next.


