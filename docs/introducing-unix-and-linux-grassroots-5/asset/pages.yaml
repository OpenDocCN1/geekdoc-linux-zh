  md: '# 5.3 Manipulating files


    There are lots of things you can do with a file. You can create, destroy, rename
    and copy it, and you can protect it so that only certain users have access to
    its contents. These simple actions have corresponding commands, which are generally
    simple. Directories contain information about files other than themselves, unlike
    ordinary files, and operations on them are in consequence more complex. We shall
    start by looking at directories.


    # 5.3.1 Creating directories


    To create a new directory, the command mkdir (''make directory''), followed by
    the name you wish to it, will make a new directory with that name. For instance,
    we can create a file called dir1 in the current directory:


    ```

    $ mkdir dir1

    ```


    Conversely, to destroy a directory, use rmdir (''remove directory''). Note that
    rmdir will only work if the directory you are trying to remove contains no user
    files. You should get used to structuring your home directory so that it contains
    structured subdirectories. If you do not, and you have more than a very small
    number of files, then you are likely to find difficulty keeping track of what
    data you have stored where. A common way of organising your filespace is to use
    the same conventions that are used on the system files. This involves creating
    directories with ''standard'' names, as shown in Table 5.1, for instance.


    Table 5.1 Standard directories


    | | commands you have written |

    | src | source code for the commands you have written |

    | doc | documentation |

    | tmp | temporary files |


    Worked example 5.2


    ```

    Create a directory called tmp in your home directory.

    Solution: Firstly, change your current directory to your home directory by typing
    cd; check that no file called tmp already exists using ls; and then type mkdir
    tmp.

    ```'
