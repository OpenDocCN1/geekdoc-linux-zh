    # 11.6 Variables


    # 11.6.1 Accessing Values


    In the shell, we use variables, which we name, and access their values by placing
    a dollar before their names. In Awk we also have variables, to which we can assign
    values in the same way as the shell, but use a variable we do not need the dollar.
    The reason that the shell needs the dollar is a technical one, relating to ensuring
    that each shell statement is unambiguous. The ambiguities that might arise in
    the shell do not occur in Awk.


    Suppose we require a total grocery bill. We could use a variable (total, say)
    to keep a ''running total'' of the cost of each vegetable and print it out at
    the end:


    ```

    # Initialise total to 0

    BEGIN { total = 0 }

    ```


    ```

    # For each line of input, that is, each vegetable, add

    # the total cost to variable total

    { total = total + $2*$3 }

    ```


    ```

    # At the end, print out the total

    END { printf "Total cost is %.2f\n", total }

    ```


    Some explanation is required for the action total = total + $2*$: the current
    value stored in the variable total has the values of $2*$ added to it, and the
    resulting number is stored back in total. The value of the variable total has
    been updated. Another way of stating this action is to use total +=; so:


    ```

    total += $2*$

    ```


    Thus, total += ... is just shorthand for total = total + ...

    Analogous to += are -=, *=, /, %, <<= .'
