    would usually be names of files. These lines indicate that the word (file) on
    the left of the colon is dependent on the filenames on the right of the semicolon.
    Thus myprogram depends on both prog1.o and prog2.o, etc.

    The indented lines (which must be indented with a single TAB, with Spaces) indicate
    the action to be taken if the dependency (which would be shown on the previous
    line) is not up-to-date. So, if myprogram was older than prog1.o or prog2.o, the
    command cc -o myprogram prog1.o prog2.o would be executed.


    In order to use makefiles, data in the format discussed above should be stored
    in a file with name either Makefile or makefile. Then, to bring the software up-to-date,
