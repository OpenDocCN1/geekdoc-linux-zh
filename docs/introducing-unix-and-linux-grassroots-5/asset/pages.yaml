  md: '# Regular expressions and filters


    # CHAPTER OVERVIEW


    This chapter covers


    +   - regular expressions; and

    - simple use of the utilities Grep, Sed and tr.


    The purpose of this chapter is to consider in detail three powerful UNIX utilities
    which are usually used as filters (components of a pipeline).


    # 10.1 Using filters


    Any command that reads data from standard input and writes data to the standard
    output stream, is known as a filter. Most UNIX utilities are filters, or can be
    used as such. Most utilities are simple in their functionality.


    Much UNIX programming involves transforming input, of a known form, to output,
    also of a known form. This output depends on the input in a specified manner,
    and often involves creating a pipeline. In order to use UNIX effectively, you
    must develop the skill of being able to choose utilities to pipe together. It
    is not always obvious why the filters that are ''standard'' for UNIX have been
    developed, but they have been found to be very powerful ''building blocks''. We
    now examine three filters, significantly more complex than those we have met before,
    whose relevance will be striking.


    The editor Vi is an interactive tool, and is one of the few UNIX utilities that
    cannot be used as a filter. The commands we now look at perform tasks you might
    consider suitable for an editor as Vi, but are designed so that they can work
    as filters.


    You may be wondering why, having discussed detailed syntax for the shell, we now
    need to introduce further commands. After all, we did claimed'
  merge: -1
  pgno: 205
- img_proc: true
  md: '# Regular expressions and filters


    that the shell was a ‘full programming language’. In UNIX there are rarely unique
    solutions to problems, although some techniques are arguably ‘better’ than others.
    Most tasks have many possible ways in which a UNIX programmer can solve them,
    but an experienced programmer will be able to chose command that can be implemented
    fast and efficiently. The purpose of commands as grep, sed, tr and awk is to provide
    speedy solutions for tasks that are frequently encountered and difficult to program
    using the shell alone.


    Whenever you write a script that takes more than a few lines, stand back from
    the problem for a moment and ask yourself some utility will do the job for you.
    Maybe there isn’t, but often you will be able to save your time and trouble by
    recalling a utility you’d forgotten about. When you have finished reading this
    book, go back to the earlier chapters and remind yourself of the commands as comm
    and uniq — whose usefulness may not have been apparent.


    NOTE

    awk is discussed in the next chapter


    # 10.1.1 Collating sequence


    Before considering these filters we must digress with some remarks about characters.
    Specifically, we must ask the question: ‘how are they ordered?’ We have already
    remarked that each character is assigned a code (normally the ASCII representation),
    and the ordering of characters corresponds with the numerical order of the codes.
    For instance, the code for b is one greater than the code for a. There are possible
    problems with this: first, it is not necessarily the case that ASCII is different,
    and secondly, the code representation and ordering of characters is different
    depending on which native language you speak. Most UNIX systems use standard English/American,
    and a standard keyboard, POSIX allows for user interfaces consistent with other
    languages and equipment. Where, for instance, accented letters in the alphabet,
    or completely different letters such as Greek we have a concept called a collating
    sequence which is the logical ordering for the character set you use. In practice,
    this ordering applies just to letters and digits, although it is defined for the
    whole character set. The collating sequence can be changed in POSIX by amending
    the locale.


    NOTE

    Locale was mentioned in Chapter 7


    In the following discussion we will refer to ranges, which are collections of
    characters that are consecutive within the collating sequence. A range is specified
    by a first and by a last character, separated by a hyphen.


    b–z

    refers to the characters between b and z, inclusive, in the current collating
    sequence.


