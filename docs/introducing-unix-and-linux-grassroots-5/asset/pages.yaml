    reason for splitting a file is if you know the file contains separate identifiable
    portions. For instance, suppose you had a simple text file consisting of paragraphs
    of English separated by blank lines, and you wanted the paragraphs to be in separate
    files. The blank lines would identify where to break the file, and you can specify
    a blank line by means of the BRE. ^$


    The command split splits a file into sections where the sections either contain
    specified number of lines or are delimited by text that can be described by a
    basic regular expression. To start with a simple example:


    # $ csplit 10


    will take data, and create two new files called xx00 and xx01. File xx00 will
    contain lines 1 through 9 of data, and xx01 will contain line 10 up to the end
    of file data. File data remains unaltered. When each new file is created, csplit
    will print the size (in bytes) of that file, on the standard error stream (this
    can be suppressed with option -s). .silent''

    The first argument to csplit is the name of a file (or - hyphen) as standard input)
    and the following one or more arguments indicate where the file is to be split.
    An argument that is a line number instructs a break to be made at the beginning
    of that line (here in the previous example line 10 is at sending to the second
    file). The new, smaller, files are named xxnn, where nn starts at 00 and counts
    upwards. With option -f followed by a string that will be used as the prefix instead
    of xx. Any number of arguments can follow the filename.


    # ACRONYM


    ```

    csplit = ''context split''

    ```


