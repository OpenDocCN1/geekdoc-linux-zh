  md: '# Introducing UNIX and Linux


    Table 12.2 Some predefined Perl functions


    | | |

    | :--- | :--- |

    | chdir | changes the working directory to its file (string) argument |

    | do | executes as a Perl program the file that is its (string) argument |

    | eof | returns true if its (filehandle) argument is at end of file |

    | eval | evaluates its argument as if it were a Perl program |

    | exec | executes the shell command that is its (string) argument

    | exit | ends program immediately, exit status its argument |

    | lc | returns its (string) argument changed to lowercase |

    | length | returns the number of characters in its (string) argument |

    | scalar | returns the number of elements in its (array) argument |

    | uc | returns its (string) argument changed to uppercase |


    # 12.6.2 Modules


    A Perl module* is a collection of Perl programs written to be used in other programs.
    You can write your own, or you can use modules written by other people. Some modules
    are included with each distribution of Perl, and others are made freely available
    on the Web.

    The web site www.cpan.org ("Comprehensive Perl Archive Network") is the main place
    to go to find out what is available. The site is continually growing, and at the
    time of writing contained over 1600 modules, including modules in the following
    areas:


    +   * security, encryption and authentication;

    * database support for most commercial databases;

    * web support, including HTML parsers and HTTP servers;

    * email clients and servers;

    * mathematics;

    * image manipulation;

    * archiving and file conversion;

    * interfaces to operating systems, including MacOS, OS/2 and Windows;

    * hardware drivers; and;

    * specialised computational modules, such as Neural Networks and Artificial Intelligence.


    In order to use a module, include the line

    use name-of-module;

    at the start of your program.


    # ACRONYM


    HTML = ‘HyperText Markup Language’

    HTTP = ‘HyperText Transfer Protocol'
