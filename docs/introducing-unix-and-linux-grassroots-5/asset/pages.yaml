  md: '# 12.1.4 Documentation on perl


    Extensive documentation is provided using the command perdoc. By default, this
    documentation is *not* available via the standard UNIX man command (although the
    manual pages can be created if required). For an overview of how perdoc works,
    type


    perdoc perdoc


    # 12.1.5 Perl Scripts


    Superficially a Perl script looks similar to a shell or an Awk script, and consists
    of a sequence of *statements*. Blocks of code can be enclosed in braces, any of
    the basic commands, such as `printf`, are the same. There is one initial difference
    that often confuses, is that *every* statement must be *terminated* by a semicolon.
    The end of a line has no significance to Perl.


    # 12.2 Variables


    In the shell (and Awk also), there is only one type of variable, which is a string
    of characters. If those characters are digits, the variable is used in a context
    where a number is expected, the variable will be understood to be a number. In
    Awk, arrays are also provided for.


    In the shell, the value of a variable is accessed by placing a dollar symbol in
    front of the variable, but its value is set by using the name. In Awk, the dollar
    symbol is not needed at all.


    In Perl, the situation is more complex. First of all we consider *scalar variables*.
    These are similar to variables you have already met, and can contain strings of
    characters, which are interpreted appropriately. The difference between Perl and
    shell/Awk variables is that the name of a scalar variable is *always* prepended
    with a dollar. For example, to set the value of $1 to 0 and the value of $x to
    $1+1:


    ```

    $1=0;

    $x=$1+1;

    ```


    Arrays are indicated by the @ symbol before the name, and square brackets are
    used to access individual elements of an array, which *must* be indexed by integers
    beginning with 0. A predefined array you often use is `@ARGV`, which is the list
    of arguments to the Perl program. Its elements are prefixed with a $. Its first
    element is `$ARGV[0].


    In Awk, an array could be indexed by *any string*, and we referred to such an
    array as an *associative array*. It is called a *hash*. In Perl it is distinguished
    from an array in three ways. First, the @ symbol is replaced


    ![](img/c00e38ea653baa916537682ab959e377_252_0.png)'
  merge: -1
  pgno: 252
- img_proc: true
  md: '# Introducing UNIX and Linux


    by % to refer to the whole hash. Second square brackets are replaced by braces,
    and finally the indices are strings, not integers.


    Simple use of Perl sed requires the @ and % symbols, since most of the time we
    access the individual elements of the arrays. As an example, suppose @month is
    an array of 12 strings containing the names of the people, and $age is a hash
    containing the ages of some people. The following fragments of code set the first
    and last elements of @month and the ages for Chris and Sam.


    ```

    $month[0]=''January'';

    $month[11]=''December'';

    $age{''Chris''}=22;

    $age{''Sam''}=19;

    ```


    Either single or double quotes can be used to denote strings, but like the shell,
    dollars and escape characters will be interpreted within double quotes but not
    within single quotes.


    Strings be concatenated — that is, joined together — by use of the operator .
    ("dot"). For instance, the concatenation of strings


    ```

    "Hello " . "world!"

    ```


    is equivalent to the single string


    ```

    "Hello world!"

    ```


    # 12.3 Input and output


    A feature of the shell is that input and output, as simple data streams, are fundamental
    to its working. In other languages, such as Java or C, input and output can be
    much more complex, and programmers need to be aware of the type of data they are
    reading or sending to an output device or file.


    For example, if a program were to write data to many different files, then a shell
    program relied on redirection of the standard output would become unwieldy and
    difficult to write.


    Perl retains the simplicity of the shell whilst allowing the programmer a greater
    variety of methods for reading and writing data. It is equipped with five predefined
    variables for input and output (known as filehandles), shown in Table 12.1.


    Table 12.1 The five predefined input and output variables


    | STDIN | is the standard input stream |

    | STDOUT | is the standard output stream |

    | STDERR | is the standard output stream |

    | ARGV | is an array containing the arguments to the program |

    | DATA | is the Perl equivalent of a here-document |'
