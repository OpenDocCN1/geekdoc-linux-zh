    # 6.1.4 Signals


    The kernel controls many processes, created by possibly many users, including
    many that are ''system'' processes, necessary for the system to function. The
    kernel allows these processes to communicate by sending ''messages'' to each other.
    Any process in the system can send a message to any other process, and because
    there could be many processes and many messages sent are known as signals,


    These messages are known as signals, and each takes the form of a single byte.
    These are instructions to processes, such as kill (ceasing immediately) and stop
    (becoming a suspended process). Signals are concerned with the scheduling of processes,
    that is, when and in which order they are. The command kill is provided for a
    user to send a signal to a specific process. A detailed discussion of signals
    is beyond the scope of this chapter, but one particular signal is important at
    this stage.


    The SIGKILL, when received by a process, causes it to be destroyed immediately.
    For example, to kill the sleep process above, you could


    ```

    $ kill -s KILL 16403

    ```


    where kill with option -s (''signal'') causes the signal named after -s to be
    sent to the process whose PID is given as the final argument to kill. Note that,
    although this signal is referred to as SIGKILL, the only word KILL is passed to
    the command kill. This is because all signals are something, the PID is redundant
    in any context where a signal is expected. There are many other signals, such
    as SIGHUP and SIGTTIN, of which will be discussed later on.


    This raises the question of why you might ever wish to destroy a process. It sometimes
    happens that a process that is running in the background is left by mistake, for
    instance if the software that created was poorly written. It also happens that
    you send a program to run in the background when you think it will run for a long
    time, and later discover that because of an error in the program it is failing
    to finish.


    It is important to remember that UNIX uses processes as its most basic concept
    of a ''program''. Remembering PIDs can be tedious, however more ''user-friendly''
    method of handling processes, called job control, which we now introduce.


