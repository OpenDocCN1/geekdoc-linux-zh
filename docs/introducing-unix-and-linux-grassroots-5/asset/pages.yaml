    # 9.4 The ‘exec’ mechanism


    When you execute a script, a copy of the shell is created. Thus when that

    script itself executes a command, a process is created for that command

    as well as the process for the calling shell. This is potentially inefficient,

    es if the script is relatively simple, but essentially unavoidable.


    In a few instances, the calling shell is redundant, in particular

    it a utility is executed as the last command in the shell. The shell will

    terminate precisely when the utility has terminated. During the time that

    the utility is running, the shell''s process continues to run, but is simply

    waiting for the utility to finish — nothing more. This is inefficient because

    the kernel still needs to manage the shell process, and the shell is ‘big’

    program. The command exec is provided to reduce this redundancy.


    Using exec the final command can be executed by the same process as

    the calling shell. UNIX accomplishes this by replacing the machine code

    that the shell process contains with the machine code for the command,

    and the shell cannot therefore execute any later commands. Suppose file

    sleepfile contains one line, sleep 100:


