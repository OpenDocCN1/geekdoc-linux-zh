  md: '# More on shells


    # CHAPTER OVERVIEW


    This chapter covers


    +   - arithmetic expansion, pattern matching and ''case'' statements;

    - scripts that require options; and

    - file system conventions.


    In this chapter we examine shells in more depth. Much of this chapter is dependent
    on being comfortable with the previous chapter, and if you have not yet familiarised
    yourself with the material in that chapter you are not yet encouraged to return
    to it.


    # 8.1 Simple arithmetic


    # 8.1.1 Arithmetic expansion


    The utility bc was discussed in the previous chapter, and will perform any calculations
    required, to any accuracy, just as if you had a calculator available. Although
    bc does have all the facilities required, it is in many circumstances ''overkill''
    — the overheads of calling and executing a utility such as bc are high. It is
    therefore desirable to have another method of doing simple arithmetic as a part
    of the shell, thus obviating the need to call a utility bc. The mechanism is as
    arithmetic expansion and takes the form of


    ```

    $(( expression ))

    ```


