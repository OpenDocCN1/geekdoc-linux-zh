  md: '# 8.7 Conventions used in UNIX file systems


    In Chapter 5 we introduced the hierarchy of UNIX directories and files. In this
    section we look in more detail at which files are stored.

    Although your home directory will be located at least one level down the hierarchy,
    and whatever subdirectories you create are your own business, there are some conventions
    it would be unwise to ignore. Conventions are not always followed, even in parts
    of the file hierarchy that contain system files, and there is no requirement for
    them in the standards.


    Executable files, whether they are binary files or executable shell scripts, are
    usually held in directories called bin, or with bin as part of their name. For
    instance:


    ```

    /cs/ugrad/chris/bin

    /cs/ugrad/chris/import/bin

    /cs/ugrad/chris/bin/star4

    /cs/ugrad/chris/bin/scripts

    ```


    If bin is the last component of the pathname, the previous components would typically
    indicate some property of the commands held in the directory. The directory /cs/ugrad/chris/import/bin
    might hold commands chris has been mailed by colleagues. If bin is not the last
    component, subsequent names in pathname might indicate the type of machine the
    commands can run on. Commands in

    /cs/ugrad/chris/bin/star4 might be binary commands that will only run on a Star
    system, and /cs/ugrad/chris/bin/scripts might contain shell scripts.


    Devices are contained in directories called dev; most systems will simply have
    /dev as the only directory, since they cannot be created by users at all. Manual
    pages are always contained in a hierarchy with man as the last component. Source
    code (such as C or Pascal programs) is often held in directories called src. Files
    that must be stored temporarily while being sent to a printer or waiting to be
    sent by the electronic mail program, are held in directories called spool. Files
    and directories whose size is known to vary considerably are often held in a directory
    called var. It would not be uncommon for chris which incoming mail is stored before
    being read—to the file /var/spool/mail/chris—that is, sets of data required by
    specific utilities such as the C compiler—are held in directories called lib,
    and ''include'' files—also required by the C compiler—are held in directories
    called include. Have a look at the root directory, and you will see several of
    these directories.


    There is a wide variety of practice across manufacturers and institutions, but
    these conventions are broadly adhered to, even if minor'
