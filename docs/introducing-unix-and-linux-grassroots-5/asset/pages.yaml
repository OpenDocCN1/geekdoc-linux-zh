  md: '# 5.5 File contents


    Given that you know a file exists, an obvious question is: ‘What does it contain?’
    A simple answer to this question might be that it contains a sequence of bytes
    — but this would not be very helpful. We need to know what those bytes represent.
    We could start off by examining the filename; some UNIX files are required to
    have a particular suffix, and thus information could indicate their contents.
    However, we should note that, for instance, if a file contains a C program, its
    suffix must be .c, then the converse does not hold. If we encounter a file called
    myfile.c then this does not mean that the file must contain a C program (although
    it would be perverse if it did not).


    It is not possible to infer from a file''s suffix (if indeed it has one) what
    the contents of the file represent. Indeed, UNIX makes no stipulation of what
    may or may not be stored in a file — a file is merely a sequence of bytes.


    However, all is not lost. It is possible to make an intelligent guess as to what
    a file contains by examining the format of the data inside it. For instance, if
    the file contains words that occur in the C language, one might reasonably guess
    that the file contains C source code. Many sorts of data can have their type inferred
    from their format, and the command file is provided to do this. For example:


    ```

    $ file.c

    prog.c: c program text

    $ file libc.a

    libc.a: archive random library

    $ file story

    story: English text

    ```


    Don''t worry about file telling you that a particular file is of a weird type
    you''ve never heard of! It probably means it contains something you aren''t interested
    in anyway. Unfortunately, file is not infallible, and it is possible to confuse
    it, but nonetheless it''s a pretty reliable.'
