  md: '# palgrave macmillan


    This book offers a thorough, tutorial-style introduction to UNIX and Linux both
    for those starting computing the first time, and for those familiar with computing
    but wanting to learn more about UNIX.


    The text assumes no prior knowledge of programming, nor any experience of using
    computers. It covers the basic aspects of UNIX necessary to get started, including
    details of installing Linux on individual PCs and using simple commands, as well
    as advancing to a more rigorous description of the very powerful tools that UNIX
    provides. These aspects include shell programming and the UNIX tools Awk and Perl.


    Illustrated throughout with numerous examples of actual code, and with exercises
    at the ends of chapters, the book is equally suited to home PC users wanting to
    install and learn about Linux on their PCs, and to students studying UNIX as part
    of a broader degree course. The book also includes many references to other sources
    of information for wishing to take the subject further.


    The Grassroots series has been designed to meet the needs of students of computing
    and related disciplines - concise, self-contained and affordable books on core
    computing subjects which contain sufficient material for one-semester courses.
    Under the guidance of the series editor, Fintan Culwin, all authors are carefully
    chosen for their ability to present their material in a readable and concise manner
    that will educate, inspire and stimulate readers of all kinds.


    Mike Joy is a Senior Lecturer in Computer Science at the University of Warwick.
    In addition to teaching UNIX and software engineering, his research interests
    include programming languages and computer-assisted assessment.


    Stephen Jarvis is a Lecturer in Computer Science at the University of Warwick.
    He specialises in teaching Java programming, and conducts research in the areas
    of high-performance and distributed computing.


