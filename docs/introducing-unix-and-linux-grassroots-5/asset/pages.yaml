    # 7.8 Passing information to scripts


    A script can be passed data by many methods, such as input streams, and the values
    of environment variables. We look now at this in in more detail.


    # 7.8.1 Scripts with arguments


    Just as a UNIX command can take arguments, so can a script. After all, a script
    is a command written by a user. The first argument of a script is referred to
    within the script as $1, the second by $2, and so on. These are known as positional
    parameters. They can be manipulated like any other variables, except that they
    cannot be reset using = Create a file (argfile, say) containing one line:


    ```

    echo $1 $2

    ```


    Now run that script, but give it two arguments:


    ```

    $ argfile hello 99

    hello 99

    ```


    There are some other ‘variable names’ that have special meanings when used within
    a script. The name of the script (i.e. the name of the file containing the script)
    is denoted by $0, and the number of positional parameters by $#. Suppose the following
    script, called showargs, is invoked:


    ```

    This script is $0, and it has $$ arguments

    First argument is $1

    ```


    The output we would get be:


    ```

    $ ./showargs foo bar

    This script is ./showargs, and it has 2 arguments

    First argument is foo

    $ showargs "foo bar"

    This script is showargs, and it has 1 arguments

    First argument is foo bar

    ```


    In the second invocation, the first argument of showargs is the string "foo bar",
    not foo — the quotes around it cause it to be considered as one-by-one word.


    When a script is given many arguments, accessing them one-by-one using positional
    parameters is often awkward. We can use *$ to refer to them all at once. In other
    words, the value of $* is the single string "$1 $2 $3...". In experiment with
    these parameters, create a script containing'
