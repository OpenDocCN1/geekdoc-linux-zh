  md: '# Introducing UNIX and Linux


    You will either be asked to choose a password, or you will initially be allocated
    one, in which case you will have the opportunity to change your password at a
    later time. When choosing a password, which can normally be up to eight characters
    long, bear in mind that you don''t want anyone to guess what it is. Some simple
    rules will help you. Always use a mixture of upper-case and lower-case letters,
    together with digits or other symbols. Always choose passwords which are eight
    characters long. Never choose a password that occurs in a dictionary, or is the
    name of a person. If you ever think someone has discovered your password, change
    it immediately and tell your system administrator. It is also good practice to
    get into the habit of changing your password every few weeks as a matter of routine.


    # 4.1.2 Logging in


    Once you have found a terminal, or you have set up your own Linux machine, you
    are in position to use the system. Sit down and make yourself comfortable. Make
    sure you can see the screen clearly and that you can reach the keyboard easily.
    Not only can an awkward posture be uncomfortable, but it can be dangerous, contributing
    to RSI, if held for more than short periods of time.


    > ACRONYM

    RSI = ''Repetitive Strain Injury''


    Check that your computer is turned on — you may need to press the Return key since
    some computers darken their screens, or run a screensaver, after a period of inactivity.
    Adjust the screen''s brightness so that it is at a comfortable level. Somewhere
    on the screen you will see the line


    login:


    If your computer has a graphics terminal with windows, use the mouse to ensure
    that the cursor is within the window containing the login: message. Now type in
    your username followed by Return. The computer will print that on the screen the
    message


    Password:


    and you should then type in your password. What you type in as the password will
    not appear on the screen, for obvious security reasons. there are other people
    in the same room as you, be discrete when typing in the password, and make sure
    no one is standing looking over your shoulder. If you make a mistake typing in
    your username or password, don''t worry — you''ll be given another chance. If
    you forget your password, your system administrator can allocate you a new one.


    Be careful when you type that you distinguish between upper-case and lower-case
    letters — UNIX treats them as different. If your username is'
