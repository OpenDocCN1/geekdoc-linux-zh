    # 2.2 Files


    On any machine there will be a large amount of information (or data) that must
    be stored, including programs, text, and the UNIX operating system itself. Each
    unit of data — which may be small (for instance, a few words of text) or large
    (like parts of the UNIX operating system itself) — is stored in a file. Files
    are simply sequences of bytes, stored somewhere on the system, perhaps on magnetic
    disks, CD-ROMs, or other storage devices. We are not interested in exactly where
    the file is stored, merely in its contents.


    Each file has a name, which should consist of any letter, digit, or characters
    (period), -(minus sign), or (underscore). Other characters are also acceptable
    in a filename, but are discouraged in order to promote clarity. When we use files,
    we will normally refer to them by name. Some examples are:


    ```

    test l1a MyFile prog.c p-1

    ```


    # 2.2.1 Networks


    Computer systems contain at least one computer. However, it is becoming increasingly
    difficult to define what is meant by ‘a computer’ — until a few years ago, a computer
    would have had a single CPU, which would perform all the computational tasks.


    Nowadays, a computer may contain several units around the workload will be distributed.
    In addition, several computers may be connected in a network where each constituent
    computer can communicate with others in the network.


    In cases, the computers in a network are very intimately connected, and the network
    appears to the user as a single but very large computer. We use the word system
    to mean either a single computer or a campus-wide network of computers that appear
    to the user as a single entity. UNIX network would be an example of such a system;
    a more loosely-connected network such as the Internet would not be. By using a
    terminal on a network, users are still communicating with a specific machine.
    Each window allows a dialogue with a single UNIX machine, and it is target UNIX
    machine with which we shall be concerned in this book.


