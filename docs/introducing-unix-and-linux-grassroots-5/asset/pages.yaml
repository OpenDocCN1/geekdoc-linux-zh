    Often you will write scripts that you will use variables that you assume have
    certain values. They may be variables you have created for your own benefit, or
    they may be ''system'' variables, such as PATH, which have been set for you. However,
    there is always a possibility that such a variable has not been assigned a value.
    A case in point is the variable NAME, which is not mentioned in the POSIX standard,
    and many shells and utilities (especially mailers) use it, and it''s quite reasonable
    to assume that it has been set a value. Unfortunately, this is not guaranteed.


    Consider NAME, and suppose a particular script requires it; we could include the
    following code to check whether it indeed does have a value, and if not we could
    give it a default value:


    ```

    if [ -z "$NAME"

    then NAME="A.N. Other"

    fi

    ```


    This work is also verbose — a script that uses many variables would be tedious
    to write if you include checks for all the variables in the script. It should
    be emphasised that it is a very good idea to check that variables have in fact
    assigned values before you attempt to use those variables. Parameter expansion
    will not do anything that cannot already be done using test, but it provides a
    concise and easy to read notation that avoids saturating scripts with tests.


    At this point we need to discuss an apparently minor — but nonetheless important
    feature of variables. If a variable has not got a value, this can be for two reasons.
