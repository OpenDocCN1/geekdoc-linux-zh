    Basic regular expressions are sufficient for most purposes, but a more sophisticated
    form of regular expression is available known as an extended regular expression
    or ERE. There are a couple of principal extra features using EREs that are unavailable
    in BREs.


    The symbol +, following a bracket expression (or single character or dot) indicates
    one or more consecutive occurrences of the expression, in the same way that *
    indicates zero or more. The symbol ? indicates zero or one occurrences of that
    expression, so


    ```

    [:alpha:]]+[:digit:]]*

