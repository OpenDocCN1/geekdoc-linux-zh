    \n- **步骤 5** 按 F5 并保存代码以执行它。先在 Shell 中输入一个四字母单词开始；你应该会收到返回的消息，说它是该单词中的两个字母（注：原文此处可能有误，意指确认它是四字母单词）。现在再次按\
    \ F5 重新运行程序，但这次输入一个五字母单词。Shell 将显示它不是四字母单词。\n\n- **步骤 6** 现在扩展代码以包含另一个条件。最终，它可能会变得相当复杂。我们已添加了一个针对三字母单词的条件。\n\
    \  ```python\n  word=input(\"Please enter a four-letter word: \")\n  word_length=len(word)\n\
    \  if word_length == 4:\n      print (word, \"is a four-letter word. Well done.\"\
    )\n  elif word_length == 3:\n      print (word, \"is a three-letter word. Try\
