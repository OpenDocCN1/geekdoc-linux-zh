    ## Linux 技巧与窍门


    正如你所见，**Linux 终端**是一个非常出色的环境。只需安装一些额外的应用，并具备少量的命令知识，就能完成难以置信、甚至相当怪异的操作。


    ### 掌握命令


    世上有无数 Linux 技巧、秘密、黑客技巧和窍门。有些非常古老，源自 Linux 的 Unix 血统，而有些则是 Linux 传奇故事中的近期新增内容。以下是我们最喜欢的十个技巧和窍门。


    ### 彩蛋


    Emacs 是一款文本编辑器，是一款很棒的软件，但你知道它其实还包含一个隐藏的彩蛋吗？在安装了 Emacs 之后（**sudo apt-get install
    emacs25**），进入终端会话并输入：


    `emacs -batch -l dunnet`


    Dunnet 是由 Ron Schnell 在 1982 年编写的文本冒险游戏，自 1994 年起就隐藏在 Emacs 中。


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_63_0.png)


    ### 终端浏览


    你是否曾想过可以从终端中浏览互联网？虽然这没什么特别的实际用途，但这确实是一件非常迷人的事情。为此，请输入：


    `sudo apt-get install elinks`


    输入你想访问的网站。


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_63_1.png)


    ### 月球 buggy


    基于经典的 1982 年街机游戏《月球巡逻》（Moon Patrol），《月球 buggy》（Moon Buggy）于 1985 年出现在家用电脑上，并广受好评。这是一款精彩的
    Atari 游戏，你可以通过在 Linux 终端中输入以下命令来体验它：


    `sudo apt-get install moon-buggy`


    然后：


    `moon-buggy`


    祝你玩得愉快。


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_63_2.png)


    ### 让它下雪


    在终端控制台中看到下雪可不是每天都能遇到的事。不过，如果你感兴趣，请输入：


    ```

    wget -x //gist.githubusercontent.com/sontek/1505483/raw/7d024716a457e69fb52632fee09f42753361c402/snowjob.sh

    chmod +x snowjob.sh

    ./snowjob.sh

    ```


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_63_3.png)


    ### 内存占用大户


    如果你需要查看 Linux 上哪些应用程序消耗的内存最多，只需输入：


    ```

    ps aux | sort -rnk 4

    ```


    这会根据系统内存使用量对输出进行排序。


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_64_0.png)


    ### 电子公告板 (BBS)


    在拨号上网时代，在线世界是由电子公告板系统 (Bulletin Board Systems) 组成的。这些远程服务器为用户提供了聊天、交换代码、玩游戏等休闲场所。利用
    Linux 中的 telnet，我们仍然可以连接到一些活跃的 BBS：


    ```

    telnet battletestarbs.dynDNS.org

    ```


    有无数的可用 BBS，请查看 [https://www.telnetbbsguide.com/bbs/list/detail/](https://www.telnetbbsguide.com/bbs/list/detail/)
    以获取更多。


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_64_1.png)


    ### 碎纸机


    当你删除一个文件时，拥有正确软件的人有可能将其恢复。但是，若要安全且永久地删除文件，请使用 Shred：


    ```

    shred -zvu NAMEOFFILE.txt

    ```


    将 NAMEOFFILE 替换为要删除的文件名。


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_64_2.png)


    ### 目录树


    如果你想用一条命令创建整个目录（或文件夹）树，可以使用：


    ```

    mkdir -p New-Dir/{subfolder1,subfolder2,subfolder3,subfolder4}

    ```


    这会在 New-Dir 中创建四个子文件夹。


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_64_3.png)


    ### ASCII 艺术


    当应用于某些图像时，ASCII 艺术可以非常惊艳。然而，要想做得恰到好处往往很困难。你可以使用 img2txt 从你现有的图像创建出色的 ASCII 艺术：


    ```

    img2txt NAMEOFIMAGEFILE.png

    ```


    将 NAMEOFIMAGEFILE 替换为你系统上实际的图像文件名。如果未安装 img2txt，请使用：


    ```

    sudo apt-get install caca-utils

    ```


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_64_4.png)


    ### 被遗忘的命令


    记住所有可用的 Linux 命令并不容易。幸运的是，我们可以使用 apropos 来帮助我们。只需使用它并附带命令的描述即可：


    ```

    apropos "copy files"

    apropos "rename files"

    ```


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_64_5.png)


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_65_0.png)


    ## Linux 与大爆炸


    Linux 通过碰撞粒子，帮助我们理解宇宙的运行方式。


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_65_1.png)


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_65_2.png)


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_66_0.png)


    **你知道吗……**


    Linux 位于大型强子对撞机 (LHC) 背后科学技术的核心？科学家、开发人员和工程师以红帽 Linux 和 CentOS（一种基于红帽核心构建的超稳定发行版）作为首选基础发行版的组合，创造了
    SL – 科学 Linux (Scientific Linux)。


    以 SL 为基础，欧洲核子研究中心 (CERN) 的聪明才智开发了几个不同版本的定制 Linux 发行版，以协助 LHC 的各个方面。其中最著名的是 SLC，即科学
    Linux CERN，也被称为 CERN6。据报道，有超过 36,000 台系统运行 SL，还有超过 15,000 台运行 SLC。


    ## 创建 Bash 脚本 – 第一部分


    随着你在使用 Linux Mint 过程中的进阶，你终将希望开始创建自己的自动化任务和程序。这些本质上是脚本。确切地说是 Bash Shell 脚本，它们的工作原理与
    DOS 批处理文件或其他编程语言类似。


    ### 开始编写脚本


    Bash 脚本只是一系列命令，Mint 将按顺序执行这些命令以完成特定任务。它们可以是简单的，也可以异常复杂，这取决于具体情况。


    **步骤 1** 在接下来的页面中，你将主要在终端和文本编辑器中进行操作。文本编辑器有一些替代方案，我们稍后会讨论，但为了方便起见，我们将使用 Xed 进行示例。不过，在开始之前，请先运行常规的更新检查：`sudo
    apt-get update && sudo apt-get upgrade`。


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_67_0.png)


    **步骤 2** 我们有几种可用于创建 Bash 脚本的文本编辑器：Xed、VI、Nano、Vim、GNU Emacs 等。归根结底，这都取决于个人偏好。我们使用
    Xed 纯粹是为了让你在下方的截图中更容易阅读脚本。


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_67_1.png)


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_67_2.png)


    **步骤 3** 首先，在开始编写任何脚本之前，你需要创建一个文件夹来存放我们所有的脚本。从 `mkdir scripts` 开始，然后进入该文件夹 `cd
    scripts`。这将作为我们的工作文件夹，从此处你可以为创建的每个脚本创建子文件夹（如果需要的话）。


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_67_3.png)


    **步骤 4** Windows 用户应该知道，为了使批处理文件工作，即被执行并遵循其中的编程逻辑，它需要具有 .BAT 文件扩展名。Linux 是一个无扩展名的操作系统，但惯例是给脚本加上
    .sh 扩展名。


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_67_4.png)


    **步骤 5** 让我们从一个向终端输出内容的简单脚本开始。输入 `xed helloworld.sh`。这将启动 Xed 并创建一个名为 helloworld.sh
    的文件。在 Xed 中，输入以下内容：`#!/bin/bash`，然后在新的一行输入：`echo Hello World!`。


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_68_0.png)


    **步骤 6** `#!/bin/bash` 这一行告诉系统将使用哪个 Shell，在本例中是 Bash。井号 (#) 表示注释行，系统会忽略该注释。感叹号
    (!) 意味着该注释被绕过，并强制脚本将该行作为命令执行。这也称为 Hash-Bang。


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_68_1.png)


    **步骤 7** 你可以保存此文件，点击 `File > Save`，然后退出回到终端。输入 `ls`，你会看到该脚本出现在文件夹中。要使任何脚本可执行并能够运行，你需要修改其权限。使用
    `chmod +x helloworld.sh` 来执行此操作。你需要对创建的每个脚本执行此操作。


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_68_2.png)


    **步骤 8** 当你再次输入 `ls` 时，你可以看到 helloworld.sh 脚本的颜色已从白色变为绿色，这意味着它现在是一个可执行文件。要运行该脚本，换句话说，使其执行你输入的内容，请输入：`./helloworld.sh`。


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_68_3.png)


    **步骤 9** 虽然这并不那么令人兴奋，但终端现在应该会显示“Hello World!”这几个字。`echo` 命令负责在终端输出其后的单词，随着学习的深入，你可以让
    `echo` 命令输出到其他目标。


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_68_4.png)


    **步骤 10** 将 `echo` 想象成旧 BASIC 语言中的 Print 命令。它显示文本、数字或存储在系统中的任何变量，例如当前系统日期。尝试这个例子：`echo
    Hello World! Today is $(date +%A)`。`$(date +%A)` 调用了存储当前星期几的系统变量。


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_68_5.png)


    '
