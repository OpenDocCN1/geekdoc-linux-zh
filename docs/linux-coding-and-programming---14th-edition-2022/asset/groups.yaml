  - "[PAGE 23]\n\n# # Installing a Virtual Environment\n\nA Virtual Environment is\
    \ a simulated computer system. Using a Virtual Machine, you can mimic a standard\
    \ PC and install an entire operating system to it without affecting the one installed\
    \ on your computer. It’s a great way to test and use Linux, while still having\
    \ Windows 10 as your main OS.\n\n# ## GOING VIRTUAL\n\nUsing a Virtual Machine\
    \ (VM) takes resources from your computer: memory, hard drive space, processor\
    \ usage and so on. Make sure you have enough of each before commencing.\n\n**STEP\
