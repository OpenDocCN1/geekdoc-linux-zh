    \ Here's how it works.\n\n**STEP 1** Open up a new, blank C++ file and enter the\
    \ usual code headers:\n\n```cpp\n#include <iostream>\nusing namespace std;\n\n\
    int main()\n{\n}\n```\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_131_0.png)\n\
    \n**STEP 2** Start simple by creating two variables, a and b, with one having\
