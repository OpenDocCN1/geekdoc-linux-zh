  mdcn: "\n## 在 Linux 上运行 Python\n\n### 条件与循环\n\n条件和循环是使程序变得有趣的关键；它们可以很简单，也可以相当复杂。如何使用它们很大程度上取决于程序想要实现的目标；它们可以是游戏中剩余的命数，或者仅仅是一个倒计时的显示。\n\
    \n### 真实条件（TRUE CONDITIONS）\n\n一开始保持条件简单，会让学习编程成为更愉快的体验。那么，让我们从检查某事是否为 TRUE（真）开始，如果它不是\
    \ TRUE，则执行其他操作。\n\n- **步骤 1** 让我们创建一个新的 Python 程序，该程序将提示用户输入一个单词，然后检查它是否是一个四字母单词。从\
    \ 文件 > 新文件 开始，并以 input 变量开始：\n  ```python\n  word=input(\"Please enter a four-letter\
    \ word: \")\n  ```\n  ![](img/d501697c83491ed0bb4b382b0d28ef0a_111_0.png)\n\n\
    - **步骤 2** 现在我们可以创建一个新的变量，然后使用 len 函数并将 word 变量传入其中，以获取用户刚刚输入的总字母数：\n  ```python\n\
    \  word=input(\"Please enter a four-letter word: \")\n  word_length=len(word)\n\
    \  ```\n  ![](img/d501697c83491ed0bb4b382b0d28ef0a_111_1.png)\n\n- **步骤 3** 现在你可以使用\
    \ if 语句来检查 word_length 变量是否等于四，如果符合规则，则打印一个友好的确认信息：\n  ```python\n  word=input(\"\
    Please enter a four-letter word: \")\n  word_length=len(word)\n  if word_length\
    \ == 4:\n      print (word, \"is a four-letter word. Well done.\")\n  ```\n  双等号（==）意味着检查某事物是否等于另一事物。\n\
    \  ![](img/d501697c83491ed0bb4b382b0d28ef0a_111_2.png)\n\n- **步骤 4** IF 末尾的冒号告诉\
    \ Python，如果该语句为真，则执行冒号之后缩进的所有内容。接下来，将光标移回编辑器开头：\n  ```python\n  word=input(\"\
    Please enter a four-letter word: \")\n  word_length=len(word)\n  if word_length\
    \ == 4:\n      print (word, \"is a four-letter word. Well done.\")\n  else:\n\
