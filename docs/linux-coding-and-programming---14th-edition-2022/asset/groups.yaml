    # Python on Linux


    Python is a fantastic programming language, combining ease of use with a generous
    helping of power to allow the user to create both minor utilities or performance-heavy
    computational tasks.


    However, there’s more to Python than simply being another programming language.
    It has a vibrant and lively community behind it that shares knowledge, code and
    project ideas, as well as bug fixes for future releases.


    We’ve used a Raspberry Pi for this section of the book, as it’s Linux based and
