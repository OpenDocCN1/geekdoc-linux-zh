    # 每个发行版都为提供独特的用户体验，但它们的核心都是 Linux。


    # 最佳的 Linux 发行版


    有许多可用的 Linux 版本，称为发行版（Distribution）。每个发行版都有不同的理念和方法。以下是五个值得尝试的优秀发行版以及获取它们的途径。


    ### 转向 Linux


    大多数发行版的安装过程都相似。你需要从网站下载光盘镜像，并将其刻录到光盘或创建 USB 闪存驱动器安装盘。请务必仔细操作，确保选择适合你硬件的发行版，并仔细阅读说明。


    ### Linux Mint


    目前最受欢迎的 Linux 发行版无疑是 Linux Mint。Mint 始于 2006 年，当时它是当时最流行的发行版 Ubuntu 的替代品。尽管基于
    Ubuntu 的长期支持（LTS）构建，但 Linux Mint 采取了不同的方向，并为用户提供更好的整体体验。


    每发布一个核心操作系统的新版本，Linux Mint 都会提供三个主要的桌面版本。起初这可能听起来很令人困惑，但其实很简单。目前，Linux Mint 使用
    Cinnamon 桌面环境作为其旗舰模型；也有 MATE 和 Xfce 模型可供选择。


    Cinnamon 是一个图形丰富的桌面环境，MATE 使用的图形较简单，在更多种类的桌面系统上更稳定，而 Xfce 则是一个极其精简的桌面环境，专为速度和终极稳定性而构建。


    在本标题中我们将使用 Cinnamon 版本；然而，你可以随意尝试其他桌面环境。事实上，建议你花些时间尝试不同的环境，甚至不同的发行版，看看哪个最适合你和你的计算机。


    www.linuxmint.com


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_9_0.png)


    ### Ubuntu


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_9_1.png)


    第二受欢迎的发行版是 Ubuntu，这是一个古老的非洲词汇，意为“对他人的仁爱”。Ubuntu 在其十四年寿命中的人气有所起伏。曾经，它是世界上最广泛使用的基于
    Linux 的操作系统，但沿途一些关于其展示方式的错误选择，以及一些涉及隐私的令人不快的争议性元素，遗憾的是导致其跌落了第一的位置。


    话虽如此，Ubuntu 已经做出了弥补，正在缓慢地重新爬上 Linux 排行榜。该操作系统最新版本使用 GNOME 3 桌面环境，这是一个令人印象深刻的环境，尽管对于前
    Windows 用户来说可能有点令人困惑，并且对系统资源的占用稍重，尤其是如果你计划将其安装在旧计算机上时。


    尽管有种种缺点，Ubuntu 仍是一个适合开始实验的优质 Linux 发行版。它的界面干净，易于使用和安装，并为用户提供完整的 Linux 体验。


    www.ubuntu.com


    # Arch


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_10_0.png)


    Arch 是运行时间最长的 Linux 发行版之一，也是许多其他 Linux 版本的基础。当你安装了 Arch 时，为什么还要安装 Mint 或 Ubuntu
    呢？许多用户确实这样做，但这对于初学者来说并不是理想的。Ubuntu 和 Mint 都提供了更容易的安装路径，并附带软件包帮助你入门。


    Arch 是当你更有 Linux 经验时的发行版。你从只有命令行开始，然后必须手动分区硬盘，设置安装文件的位置，创建用户，设置操作系统区域，最后安装一个桌面环境以及你想要的软件。


    另一方面，Arch 是一个更加“极简”的方案。Arch 致力于自由软件，其软件仓库包含超过 50,000 个可安装的应用程序，包括多种不同的桌面环境，其使用方式与其他发行版类似。


    然而，尽管付出了这么多努力，其优势在于你拥有一个自己创建的发行版。这意味着你的 Arch 发行版不会附带他人预先安装的所有不必要的文件和应用程序；它是为你定制的，由你定制。


    www.archlinux.org


    # 树莓派桌面版


    毫无疑问，你听说过树莓派（Raspberry Pi）。自其推出以来，这台非凡的小型计算机在过去六年间席卷了科技界，你很难没听过。


    树莓派在计算世界中有几个方面的特点使其如此受欢迎。首先，它很便宜，成本约为 25 英镑，而这本质上是一台完全可用的计算机。它很小，尺寸略大于信用卡。你可以使用其完全可编程的接口构建电子产品；并且它附带
    Raspbian，这是一个专门定制的基于 Debian 的操作系统，包含办公套件、多种不同的编程语言和教育资源。


    Raspbian 专用于树莓派硬件，因为树莓派使用 ARM 处理器进行驱动。然而，树莓派基金会后来发布了 Raspbian 的 PC 版本：树莓派桌面版（Raspberry
    Pi Desktop）。


    与树莓派版本一样，树莓派桌面版附带所有你需要的编程、教育和其他应用程序。它快速、稳定，运行卓越。如果你对扩展自己的 Linux 经验感兴趣，那么这绝对是值得考虑的主要发行版之一。


    www.raspberrypi.org/downloads/raspberry-pi-desktop


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_10_1.png)


    # openSUSE


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_10_2.png)


    大多数 Linux 发行版分为两大阵营。一类是具有最新功能和技术，如 Ubuntu 和 Mint；另一类是新功能较少但具有极其可靠的稳定性，如 Debian。


    与此同时，openSUSE 试图兼顾两者。OpenSUSE Leap 是一个极其稳定的系统；它是由社区与 SUSE 员工共同开源开发的，后者开发了一款企业级操作系统
    SUSE；SUSE 驱动着伦敦证券交易所等关键设施。它专为关键任务环境设计，在这些环境中“没有不稳定空间”。如果你觉得这些都太保守了，那么 openSUSE
    Tumbleweed 是一个滚动发行版，拥有所有最新功能，当然也可能偶尔出现崩溃。


    openSUSE 是一个备受尊敬的 Linux 发行版，其许多核心贡献者都在 Linux 内核、LibreOffice、Gnome 及其他 Linux 关键领域工作。简而言之，openSUSE
    是专业人士聚集的地方。


    www.opensUSE.org


    '
