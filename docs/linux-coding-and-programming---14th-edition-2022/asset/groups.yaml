    \ along the lines of `#!/bin/bash`, then, `tar cvfz ~/backups/my-backup.tgz ~/Documents/`.\
    \ This will create a compressed file backup of the `~/Documents` folder, with\
    \ everything in it, and put it in a folder called `~/backups` with the name my-backup.tgz.\n\
    \n```bash\n#!/bin/bash\n\ntar cvfz ~/backups/my-backup.tgz ~/Documents/\n```\n\
    \n### STEP 2\n\nWhile perfectly fine, we can make the simple script a lot more\
    \ interactive. Let’s begin with defining some variables. Enter the text in the\
    \ screenshot into a new backup.sh script. Note that we’ve misspelt ‘source’ as\
    \ ‘sauce’, this is because there’s already a built-in command called ‘source’\
    \ hence the different spelling on our part.\n\n```bash\n#!/bin/bash\n\nclear\n\
    # Time stamp\nday=$(date +\\%A)\nmonth=$(date +\\%B)\nyear=$(date +\\%Y)\n\n#\
    \ Folders\ndest=~/Backups\nsauce=~/Documents/\n```\n\n### STEP 3\n\nThe previous\
    \ script entries allowed you to create a Time Stamp, so you know when the backup\
    \ was taken. You also created a ‘dest’ variable, which is the folder where the\
    \ backup file will be created (~/backups). You can now add a section of code to\
    \ first check if the ~/backups folder exists, if not, then it creates one.\n\n\
    ```bash\n#!/bin/bash\n\nclear\n# Time stamp\nday=$(date +\\%A)\nmonth=$(date +\\\
    %B)\nyear=$(date +\\%Y)\n\n# Folders\ndest=~/Backups\nsauce=~/Documents\n\nif\
    \ [ -d $dest ]; then\n  echo \"Backup folder exists\"\nelse\n  echo \"Backup folder\
    \ does not exist! I’m now creating it…\"; (mkdir -p $dest)\n  echo\nfi\n```\n\n\
    ### STEP 4\n\nOnce the ~/backups folder is created, we can now create a new subfolder\
    \ within it based on the TimeStamp variables we set up at the beginning. Add `mkdir\
    \ -p $dest/\"$day $month $year\"`. It’s in here that you put the backup file relevant\
    \ to that day/month/year.\n\n```bash\n#!/bin/bash\n\nclear\n# Time stamp\nday=$(date\
    \ +\\%A)\nmonth=$(date +\\%B)\nyear=$(date +\\%Y)\n\n# Folders\ndest=~/Backups\n\
    sauce=~/Documents\n\nif [ -d $dest ]; then\n  echo \"Backup folder exists\"\n\
    else\n  echo \"Backup folder does not exist! I’m now creating it…\"; (mkdir -p\
    \ $dest)\n  echo\nfi\n\nread -p \"Press any key to continue...\" -n 1\n  mkdir\
    \ -p $dest/\"$day $month $year\"\n```\n\n### STEP 5\n\nWith everything in place,\
    \ you can now enter the actual backup routine, based on the Tar command from Step\
    \ 1. Combined with the variables, you have: `tar cvfz $dest/\"$day $month $year\"\
    /Documents$backup.tgz $sauce.` In the screenshot, we added a handy “Now backing\
    \ up…” echo command.\n\n```bash\n#!/bin/bash\n\nclear\n# Time stamp\nday=$(date\
    \ +\\%A)\nmonth=$(date +\\%B)\nyear=$(date +\\%Y)\n\n# Folders\ndest=~/Backups\n\
    sauce=~/Documents\n\nif [ -d $dest ]; then\n  echo \"Backup folder exists\"\n\
    else\n  echo \"Backup folder does not exist! I’m now creating it…\"; (mkdir -p\
    \ $dest)\n  echo\nfi\n\nread -p \"Press any key to continue...\" -n 1\n  mkdir\
    \ -p $dest/\"$day $month $year\"\n\nclear\n  echo \"Now backing up... Please wait...\"\
    \n  tar cvfz $dest/\"$day $month $year\"/Documents$backup.tgz $sauce\n```\n\n\
    ### STEP 6\n\nFinally, you can add a friendly message: `echo \"Backup complete.\
    \ All done...\"`. The completed script isn’t too over-complex and it can be easily\
    \ customised to include any folder within your Home area, as well as the entire\
    \ Home area itself.\n\n```bash\n#!/bin/bash\n\nclear\n# Time stamp\nday=$(date\
    \ +\\%A)\nmonth=$(date +\\%B)\nyear=$(date +\\%Y)\n\n# Folders\ndest=~/Backups\n\
    sauce=~/Documents\n\nif [ -d $dest ]; then\n  echo \"Backup folder exists\"\n\
    else\n  echo \"Backup folder does not exist! I’m now creating it…\"; (mkdir -p\
    \ $dest)\n  echo\nfi\n\nread -p \"Press any key to continue...\" -n 1\n  mkdir\
    \ -p $dest/\"$day $month $year\"\n\nclear\n  echo \"Now backing up... Please wait...\"\
    \n  tar cvfz $dest/\"$day $month $year\"/Documents$backup.tgz $sauce\n\nclear\n\
    \  echo \"Backup complete. All done...\"\n\nclear\n```\n\n## Creating Bash Scripts\
    \ – Part 5\n\nThe backup script we looked at previously can be further amended\
    \ to incorporate choices, user-interaction with regards to where the backup file\
    \ will be copied to and so on. Automating tasks is one of the main benefits of\
    \ Bash scripting, a simple script can help you out in many ways.\n\n### EASY AUTOMATION\
    \ AND HANDY SCRIPTS\n\nEntering line after line of commands to retrieve system\
    \ information, find a file or rename a batch of files? A script is a better answer.\n\
    \n- **STEP 1**\n  Let’s start by creating a script to help display the Mini system\
    \ information; always a handy thing to have. Create a new script called `sysinfo.sh`\
    \ and enter the following into Xed, or the text editor of your choice.\n\n  ![](img/d501697c83491ed0bb4b382b0d28ef0a_75_0.png)\n\
    \n- **STEP 2**\n  We’ve included a couple of extra commands in this script. The\
    \ first is the -e extension for echo, this means it'll enable echo interpretation\
    \ of additional instances of a new line, as well as other special characters.\
    \ The preceding '31;43m' element enables colour for foreground and background.\n\
    \n  ![](img/d501697c83491ed0bb4b382b0d28ef0a_75_1.png)\n\n- **STEP 3**\n  Each\
    \ of the sections runs a different Terminal command, outputting the results under\
    \ the appropriate heading. You can include a lot more, such as the current aliases\
    \ being used in the system, the current time and date and so on. Plus, you could\
    \ also pipe all that information into a handy HTML file, ready to be viewed in\
    \ a browser.\n\n  ![](img/d501697c83491ed0bb4b382b0d28ef0a_75_2.png)\n\n- **STEP\
    \ 4**\n  Although there are simple Terminal commands to help you look for a particular\
    \ file or folder, it's often more fun to create a script to help you. Plus, you\
    \ can use that script for other non-technical users. Create a new script called\
    \ `look4.sh`, entering the content from the screenshot below.\n\n  ![](img/d501697c83491ed0bb4b382b0d28ef0a_75_3.png)\n\
    \n- **STEP 5**\n  When executed the script waits for input from the user, in this\
    \ case the file extension, such as jpg, mp4 and so on. It’s not very friendly\
    \ though. Let’s make it a little friendlier. Add an echo, like `echo -n \"Please\
    \ enter the extension of the file you’re looking for: \"`, just before the read\
    \ command.\n\n  ![](img/d501697c83491ed0bb4b382b0d28ef0a_76_0.png)\n\n- **STEP\
    \ 6**\n  Here’s an interesting, fun kind of script using the app espeak. Install\
    \ espeak with `sudo apt-get install espeak`, then enter the text below into a\
    \ new script called speak.sh. As you can see it’s a refresh of the first greeting\
    \ script we ran. Only this time, it uses the variables in the espeak output.\n\
    \n  ![](img/d501697c83491ed0bb4b382b0d28ef0a_76_1.png)\n\n- **STEP 7**\n  We briefly\
    \ looked at putting some colours in the output for our scripts. Whilst it’s too\
    \ long to dig a little deeper into the colour options, here’s a script that outputs\
    \ what’s available. Create a new script called colours.sh and enter the text (see\
    \ below) into it.\n\n  ![](img/d501697c83491ed0bb4b382b0d28ef0a_76_2.png)\n\n\
    - **STEP 8**\n  The output from colours.sh can, of course, be mixed together,\
    \ bringing different effects depending on what you want the output to say. For\
    \ example, white text in a red background flashing (or blinking). Sadly the blinking\
    \ effect doesn’t work on all Terminals, so you may need to change to a different\
    \ Terminal.\n\n  ![](img/d501697c83491ed0bb4b382b0d28ef0a_76_3.png)\n\n- **STEP\
    \ 9**\n  Whilst we’re on making fancy scripts, how about using Zenity to output\
    \ a graphical interface? Enter what you see below into a new script, menus.sh.\
    \ Make it executable and then run it. You should have a couple of dialogue boxes\
    \ appear, followed by a Final message.\n\n  ![](img/d501697c83491ed0bb4b382b0d28ef0a_76_4.png)\n\
    \n- **STEP 10**\n  While gaming in a Bash script isn’t something that’s often\
    \ touched upon, it is entirely possible, albeit, a little basic. If you fancy\
    \ playing a game, enter `wget https://github.com/bruxu/regret.cz/1/tmux/housenka/housenka.sh`,\
    \ make the script executable and run it. It’s in Polish, written by Martin Bruchanov\
    \ but we’re sure you can modify it. Hint: the title screen is in Base64.\n\n \
    \ ![](img/d501697c83491ed0bb4b382b0d28ef0a_76_5.png)\n"
  mdcn: "\n\n## 创建 Bash 脚本 – 第 4 部分\n\n你已经遇到过脚本与用户的交互，例如询问用户姓名等。你也查看了如何在脚本中创建循环，以进行计数或简单地重复执行某些操作。让我们结合并扩展其他一些方案。\n\
