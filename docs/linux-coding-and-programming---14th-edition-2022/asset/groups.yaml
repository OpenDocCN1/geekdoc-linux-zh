    \  ```\n  ![](img/d501697c83491ed0bb4b382b0d28ef0a_114_4.png)\n\n- **步骤 8** 可以在代码中导入多个模块。为了扩展我们的示例，使用：\n\
    \  ```python\n  import random\n  import math\n  for i in range(5):\n      print(random.randint(1,\
    \ 25))\n  print(math.pi)\n  ```\n  ![](img/d501697c83491ed0bb4b382b0d28ef0a_114_1.png)\n\
    \n- **步骤 9** 结果是一串随机数，随后是使用 print(math.pi) 函数从 Math 模块提取的 Pi 值。你也可以使用 from 和 import\
