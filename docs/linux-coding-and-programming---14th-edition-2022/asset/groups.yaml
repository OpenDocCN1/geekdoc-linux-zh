  md: "\n## STEP 5\n\nYou can now enter a password for the new user or click the curved\
    \ arrow at the end of the New Password text box to generate a password for you,\
    \ as well as displaying it. Naturally, it's a good idea to come up with as strong\
    \ a password as possible. When you're done, click the Change button.\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_38_0.png)\n\
    \n## STEP 6\n\nYou can close the Users and Groups console window now, as the new\
    \ user has been created. If you click the Mint Menu, followed by Logout, you are\
    \ presented with the Mint Login Manager. The new user is now present in the list\
    \ of currently available users. Click on him/her to log them in.\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_38_2.png)\n\
    \n## STEP 7\n\nOnce logged in the new user is required to set up their own desktop\
    \ wallpaper, icons, Panel, Menu and so on. Depending on what Account Type you\
    \ set up for them, Standard or Administrator, they won't be able to install any\
    \ new apps. This screenshot is from a Standard user account type.\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_38_1.png)\n\
    \n## STEP 8\n\nYou can create as many new accounts as you need and you're able\
    \ to switch between them when required. It's best to have just one account that's\
    \ capable of installing new software, that way you can keep track of what's on\
    \ your system.\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_38_3.png)\n\n# COMMAND\
    \ LINE ACCOUNTS\n\nJust as you'd expect, you can also create a new user within\
    \ the command line. Open up a Terminal session under the main (yours) Administrator\
    \ account.\n\n## STEP 1\n\nThe process for adding a new user from the command\
    \ line is relatively simple. To begin with, type: `sudo adduser <username>` where\
    \ `<username>` is the new user’s login name. You’re then asked to create a new\
    \ password for the user, along with their full name and other details. Click y\
    \ to confirm the details and create the user account.\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_38_4.png)\n\
    \n## STEP 2\n\nYou can check the details and account type for the new user from\
    \ within the Users and Groups console. If you want to delete a user from Mint,\
    \ you can either enter `sudo deluser <username>` in the Terminal or click the\
    \ Delete button in Users and Groups.\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_38_5.png)\n\
    \n# Customising the Desktop\n\nCustomising the operating system desktop is one\
    \ way to make it your own: a personalised workspace that is there to help you\
    \ work, inspire you or feature the company logo. Whatever your reasons for having\
    \ your own desktop, here's how it's done.\n\n## YOUR DESKTOP\n\nLinux is probably\
    \ one of the customisable operating systems there is. With just a few tweaks,\
    \ one or two extras installed and some imagination, you can create something incredible.\n\
    \n- **STEP 1**\n  The first aspect of desktop customisation is to change the wallpaper.\
    \ Right-click the desktop and choose Change Desktop Background. This opens the\
    \ Backgrounds app in Linux Mint; remember, other distros may present their background,\
    \ wallpaper selection tools differently.\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_39_0.png)\n\
    \n- **STEP 2**\n  More recent versions of Linux Mint display available backgrounds\
    \ depending on the version the user is running. You normally get three categories\
    \ followed by a fourth, Pictures, which is separated from the others. The Pictures\
    \ option is different because it reads the image content from the Pictures folder\
    \ in your Home area.\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_39_2.png)\n\n\
    - **STEP 3**\n  You just need to click the available images, from any of the locations\
    \ provided to have them install as the desktop wallpaper. Incidentally, if you\
    \ have images stored in another location on your system or network, you can add\
    \ them by clicking on the Plus symbol at the bottom of the Backgrounds console,\
    \ using the file manager to locate them.\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_39_1.png)\n\
    \n- **STEP 4**\n  By clicking on the Settings tab you can, instead, play numerous\
    \ images as a slideshow or change the aspect of the wallpapers to a variety of\
    \ choices.\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_39_3.png)\n\n## STEP 5\n\
    \nIf none of the available wallpapers take your fancy, open a browser and search\
    \ for the type of background image you prefer. When you've found the image you\
    \ want as the desktop wallpaper, right-click it and choose Set As Desktop Background\
    \ from the list of options. When the Set Desktop Background console open, click\
    \ the Set Desktop Background button.\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_40_0.png)\n\
    \n## STEP 6\n\nClick the Menu button and search for 'desktop' and click the Desktop\
    \ Settings result. The Desktop console allows you to pick the layout, desktop\
    \ icons and options for multi-monitor support, you want. You can experiment with\
    \ the options for the best setup, according to your personal tastes.\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_40_1.png)\n\
    \n## STEP 7\n\nIn addition to changing the desktop wallpaper, and how the icons\
    \ are displayed, you can also alter the overall theme for Linux Mint. From the\
    \ Mint Menu, search for 'themes' and click the Themes app as it appears in the\
    \ search results.\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_40_2.png)\n\n##\
    \ STEP 8\n\nThemes allows you to change the way certain aspects of the Mint desktop\
    \ look: Window Borders, Icons, Controls, Mouse Pointer and Desktop. In the Settings\
    \ tab you can extend the options with a few on/off slider buttons, too.\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_40_3.png)\n\
    \n## STEP 9\n\nIf you click on the Add/remove button in the centre of the three\
    \ available options, you can choose the default view from a number of preinstalled\
    \ themes. Click the theme you want, then click the Install (downward-pointing\
    \ arrow) button to enable it.\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_40_4.png)\n\
    \n## STEP 10\n\nClick back on Themes, then Desktop and you can locate the newly\
    \ installed theme and apply it to your desktop. Any installed Themes can also\
    \ be uninstalled via the Add/ Remove button. It's worth spending some time personalising\
    \ your desktop how you want it and there are some incredible themes available\
    \ too.\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_40_5.png)\n\n# Becoming Anonymous\
    \ Online\n\nThe digital age has led to many great advances in communications;\
    \ however, it has also brought on a new age of spying and snooping. Most of us\
    \ are no strangers to the frequent news stories of governments, secret organisations\
    \ and underground hackers breaking our privacy but how can you combat this?\n\n\
    ## ANONYMITY WITH MINT\n\nWhile it's virtually impossible to become totally anonymous\
    \ online, you can take measures to ensure our privacy is at its best.\n\n- **STEP\
    \ 1**\n  Starting with the basics, use HTTPS instead of the standard HTTP when\
    \ browsing. This means that anything that's transmitted over HTTPS is secure (hence\
    \ the S part at the end) and encrypted.\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_41_0.png)\n\
    \n- **STEP 2**\n  When you're browsing, consider using the Incognito or Private\
    \ browsing modes available in a browser. This disables your web history and web\
    \ cache, allowing you to browse without the details being stored for later scrutiny\
    \ by someone else. However, it doesn't stop any data or search tracking.\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_41_1.png)\n\
    \n- **STEP 3**\n  Although using Google may seem like the obvious choice for a\
    \ modern internet search, the company does track all searches made by an individual.\
    \ Instead, consider an alternative search engine, such as DuckDuckGo, a search\
    \ engine that doesn't store personal data or track you.\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_41_2.png)\n\
    \n- **STEP 4**\n  If you're regularly on the Internet then consider installing\
    \ some of the browser plug-ins that enhance your privacy. For example, for Firefox,\
    \ use Ghostery, NoScript and AdBlock Plus to block trackers, adverts and other\
    \ data mining techniques.\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_41_3.png)\n\
    \n# VPNS AND TOR\n\nThe previous steps can aid your online privacy but to really\
    \ become anonymous you need a Virtual Private Network and Tor.\n\n- **STEP 1**\n\
    \  A VPN is a remote server, or cluster of servers, that establishes a connection\
    \ with your computer. The end result is that your computer’s identity on the internet\
    \ is hidden behind the VPN remote server; so if you could live in the UK but have\
    \ an IP address (the computer online identity) belonging to Iceland.\n\n## How\
    \ VPN works?\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_42_0.png)\n\n```\nalex@iMacVirtual:~$\
    \ rm -f tor-browser-8.0.4_en-US\ndex@iMacVirtual:~/Downloads $ ls\ndex@iMacVirtual:~/Downloads\
    \ $ tar\ntor-browser-11inux64-8.0.4_en-US.tar.xz\ntor-browser_aarch64-8.5a2_arm64.tar.gz\n\
    ... [terminal output] ...\n```\n\n- **STEP 2**\n  Most good VPNs charge a monthly\
    \ or annual fee but it’s worth the expense. We use CyberGhost, `www.cyberghostvpn.com`,\
    \ which offers VPN connections for Windows, Mac, Mint (as well as other Linux\
    \ distros), Android and IOS devices. Details for each OS can be found at `www.support.cyberghostvpn.com/hc/en-us/articles/21319032-Read-me-first`.\n\
    \n![](img/d501697c83491ed0bb4b382b0d28ef0a_42_1.png)\n\n- **STEP 3**\n  Another\
    \ option is to use Tor. Tor is an open network behind countless nodes around the\
    \ world. It is available for Windows, Mac and Linux computers and is very easy\
    \ to install and use. Start by navigating to `www.torproject.org/download/download-easy.html`\
    \ and clicking on the Download Linux 64-bit button.\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_42_3.png)\n\
    \n- **STEP 4**\n  When the download has finished, drop into the Terminal and enter\
    \ the Downloads folder, `cd Downloads/`. Enter `ls` to check the tar.xz file is\
    \ present, then enter: `tar --xf tor-browser-11inux64-8.0.4_en-US.tar.xz` (For\
    \ us updated regularly, so if your version is different press Tab to autocomplete\
    \ the `tor-browser-[filename]`). When the files are unpacked, use `cd .tor-browser_en-US/`\
    \ to enter the new folder.\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_42_2.png)\n\
    \n- **STEP 5**\n  A quick `ls` reveals a couple of entries: a folder called Browser\
    \ and a file called `start-tor-browser.desktop`. To start the Tor setup, type\
    \ `./start-tor-browser.desktop`. This command launches the Tor setup, where you\
    \ are offered two options: Connect or Configure. For most users, the Connect option\
    \ will suffice. Click Connect when you are ready.\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_42_4.png)\n\
    \n- **STEP 6**\n  After the connection is established, the Tor Browser launches.\
    \ This is a customised version of Firefox and from here you can securely browse\
    \ the internet without fear of being viewed or tracked. Mixing both a VPN and\
    \ Tor makes for an extremely secure and private connection to the online world.\n\
    \n![](img/d501697c83491ed0bb4b382b0d28ef0a_42_3.png)\n"
  mdcn: "\n## 步骤 5\n\n现在可以为新用户输入密码，或者点击“新密码”文本框末尾的弧形箭头，让其为您生成一个密码并显示出来。显然，尽可能设置一个强密码是个好主意。完成后，点击**更改**按钮。\n\
    \n![](img/d501697c83491ed0bb4b382b0d28ef0a_38_0.png)\n\n## 步骤 6\n\n现在可以关闭“用户和组”控制台窗口了，因为新用户已创建完毕。如果您点击\
    \ Mint 菜单，然后选择注销，您将看到 Mint 登录管理器。新用户名现已出现在当前可用用户列表中。点击该用户以登录其账户。\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_38_2.png)\n\
    \n## 步骤 7\n\n登录新用户后，用户需要设置自己的桌面壁纸、图标、面板、菜单等。根据您为其设置的账户类型（标准用户或管理员），他们将无法安装任何新应用。此截图来自标准用户账户类型。\n\
    \n![](img/d501697c83491ed0bb4b382b0d28ef0a_38_1.png)\n\n## 步骤 8\n\n您可以创建任意数量的新账户，并且可以在需要时切换它们。最好只保留一个能够安装新软件的账户，这样您可以更好地掌握系统上的内容。\n\
    \n![](img/d501697c83491ed0bb4b382b0d28ef0a_38_3.png)\n\n# 命令行账户\n\n正如您所料，您还可以在命令行中创建新用户。请在主管理员账户下打开一个终端会话。\n\
    \n## 步骤 1\n\n通过命令行添加新用户的流程相对简单。首先输入：`sudo adduser <username>`，其中 `<username>`\
    \ 是新用户的登录名。随后系统会要求您为该用户创建新密码，并输入全名及其他详细信息。按 **y** 确认信息并创建用户账户。\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_38_4.png)\n\
    \n## 步骤 2\n\n您可以通过“用户和组”控制台查看新用户的详细信息和账户类型。如果您想从 Mint 中删除用户，可以在终端中输入 `sudo deluser\
    \ <username>`，或者在“用户和组”中点击**删除**按钮。\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_38_5.png)\n\
    \n# 定制桌面\n\n定制操作系统桌面是让它变得专属的一种方式：一个个性化的工作空间，旨在帮助您工作、激发您的灵感，或展示公司标志。无论您拥有自己桌面的理由是什么，以下是操作指南。\n\
    \n## 您的桌面\n\nLinux 可能是可定制性最强的操作系统之一。只需稍作调整，安装一两个额外组件并发挥想象力，您就能创造出令人惊叹的效果。\n\n\
    - **步骤 1**\n  桌面定制的首要任务是更改壁纸。右键点击桌面，选择**更改桌面背景**。这将打开 Linux Mint 中的“背景”应用；请注意，其他发行版可能以不同的方式提供背景或壁纸选择工具。\n\
    \n![](img/d501697c83491ed0bb4b382b0d28ef0a_39_0.png)\n\n- **步骤 2**\n  较新版本的 Linux\
    \ Mint 会根据用户运行的版本显示可用的背景。通常有三个类别，后面跟着一个第四个类别：图片（Pictures），与其他类别分开显示。“图片”选项有所不同，因为它从主目录中的\
    \ Pictures 文件夹读取图像内容。\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_39_2.png)\n\n\
    - **步骤 3**\n  您只需点击所提供位置中的任意可用图像，即可将其安装为桌面壁纸。顺带一提，如果您在系统或网络的其他位置存储了图像，可以点击“背景”控制台底部的加号图标，使用文件管理器定位并添加它们。\n\
    \n![](img/d501697c83491ed0bb4b382b0d28ef0a_39_1.png)\n\n- **步骤 4**\n  通过点击**设置**选项卡，您也可以选择将多张图像作为幻灯片播放，或将壁纸的纵横比更改为多种可选样式。\n\
    \n![](img/d501697c83491ed0bb4b382b0d28ef0a_39_3.png)\n\n## 步骤 5\n\n如果现有壁纸中没有一个让您满意，请打开浏览器并搜索您喜欢的背景图像类型。找到您想要作为桌面壁纸的图像后，右键点击它，并从选项列表中选择**设为桌面背景**。当“设置桌面背景”控制台打开时，点击**设置桌面背景**按钮。\n\
    \n![](img/d501697c83491ed0bb4b382b0d28ef0a_40_0.png)\n\n## 步骤 6\n\n点击菜单按钮，搜索“desktop”并点击“桌面设置”结果。桌面控制台允许您选择布局、桌面图标以及多显示器支持选项。您可以根据个人喜好试验各项选项，以获得最佳设置。\n\
    \n![](img/d501697c83491ed0bb4b382b0d28ef0a_40_1.png)\n\n## 步骤 7\n\n除了更改桌面壁纸和图标显示方式外，您还可以更改\
    \ Linux Mint 的整体主题。从 Mint 菜单中搜索“themes”，然后点击搜索结果中出现的“主题”应用。\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_40_2.png)\n\
    \n## 步骤 8\n\n主题功能允许您更改 Mint 桌面某些方面的外观，包括：窗口边框、图标、控件、鼠标指针和桌面。在设置选项卡中，您可以通过一些开关滑块按钮扩展选项。\n\
    \n![](img/d501697c83491ed0bb4b382b0d28ef0a_40_3.png)\n\n## 步骤 9\n\n如果您点击三个可用选项中间的“添加/删除”按钮，可以从多个预装主题中选择默认视图。点击您想要的主题，然后点击安装按钮（向下箭头）以启用它。\n\
    \n![](img/d501697c83491ed0bb4b382b0d28ef0a_40_4.png)\n\n## 步骤 10\n\n点击返回主题，然后选择桌面，您可以找到新安装的主题并将其应用到您的桌面。已安装的主题也可以通过“添加/删除”按钮卸载。值得花些时间按您的喜好个性化桌面，而且也有许多令人惊叹的主题可供选择。\n\
    \n![](img/d501697c83491ed0bb4b382b0d28ef0a_40_5.png)\n\n# 在线匿名化\n\n数字时代带来了通信技术的巨大进步；然而，它也带来了窃听和窥探的新时代。我们大多数人都不陌生，政府、秘密组织和地下黑客频繁侵犯隐私的新闻屡见不鲜，但您该如何应对？\n\
    \n## MINT 中的匿名性\n\n虽然要在网上完全匿名几乎是不可能的，但您可以采取措施确保我们的隐私达到最佳状态。\n\n- **步骤 1**\n  从基础开始，浏览时请使用\
    \ HTTPS 代替标准的 HTTP。这意味着通过 HTTPS 传输的任何内容都是安全的（因此末尾有个 S）并经过加密。\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_41_0.png)\n\
    \n- **步骤 2**\n  浏览时，请考虑使用浏览器提供的隐身模式或隐私浏览模式。这会禁用您的网络历史记录和网页缓存，让您在浏览时不会保留详细信息，以免日后被他人审查。但是，它并不能阻止任何数据或搜索跟踪。\n\
    \n![](img/d501697c83491ed0bb4b382b0d28ef0a_41_1.png)\n\n- **步骤 3**\n  虽然使用 Google\
    \ 似乎是现代互联网搜索的显而易见选择，但该公司确实会跟踪个人的所有搜索。相反，请考虑替代搜索引擎，例如 DuckDuckGo，这是一个不存储个人数据也不跟踪您的搜索引擎。\n\
    \n![](img/d501697c83491ed0bb4b382b0d28ef0a_41_2.png)\n\n- **步骤 4**\n  如果您经常上网，请考虑安装一些增强隐私保护的浏览器插件。例如，对于\
    \ Firefox，使用 Ghostery、NoScript 和 AdBlock Plus 来阻止跟踪器、广告和其他数据挖掘技术。\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_41_3.png)\n\
    \n# VPN 和 TOR\n\n上述步骤有助于您的在线隐私，但要真正匿名，您需要虚拟私人网络（VPN）和 Tor。\n\n- **步骤 1**\n  VPN\
    \ 是一个远程服务器或服务器集群，它与您的电脑建立连接。最终结果是，您的电脑在 Internet 上的身份隐藏在 VPN 远程服务器之后；因此，如果您居住在英国，但可以拥有属于冰岛的\
    \ IP 地址（计算机的在线身份）。\n\n## VPN 如何工作？\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_42_0.png)\n\
    \n```\nalex@iMacVirtual:~$ rm -f tor-browser-8.0.4_en-US\ndex@iMacVirtual:~/Downloads\
    \ $ ls\ndex@iMacVirtual:~/Downloads $ tar\ntor-browser-11inux64-8.0.4_en-US.tar.xz\n\
    tor-browser_aarch64-8.5a2_arm64.tar.gz\n... [terminal output] ...\n```\n\n- **步骤\
