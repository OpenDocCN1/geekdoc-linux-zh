    - **pwd**: The **pwd** command prints the full pathname of the current working
    directory (**pwd** stands for ‘print working directory’). Note that the GNOME
    terminal also displays this information in the title bar of its window.


    - **rm**: The **rm** command removes (deletes) files or directories. The removal
    process unlinks a filename in a filesystem from data on the storage device and
    marks that space as usable for future writes. In other words, removing files increases
    the amount of available space on your disk.


    - **clear**: The **clear** command clears your screen if this is possible. It
    looks in the environment for the terminal type and then in the terminfo database
