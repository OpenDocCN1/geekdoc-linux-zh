    \ command, without the usual prompt. This editing mode will allow you to enter\
    \ the text that the file will contain. Enter some text, then press `Ctrl+D` to\
    \ exit and write the contents to the file.\n  ![](img/d501697c83491ed0bb4b382b0d28ef0a_56_1.png)\n\
    \n- **STEP 7**\n  Of course you don’t always have to use the Terminal to enter\
    \ text into a file. Mint comes with a text editor called Xed, which is similar\
    \ to Windows’ Notepad. To view the previously created file in Xed, type into the\
    \ Terminal: `xed Test2.txt`, and press `Enter`.\n  ![](img/d501697c83491ed0bb4b382b0d28ef0a_56_2.png)\n\
    \n- **STEP 8**\n  Xed is a GUI app, and you can enter text and save the file,\
    \ or any file, accordingly by using the app’s main window, and the **File > Save**,\
    \ or **File > Save As** functions from its top menu bar options.\n  ![](img/d501697c83491ed0bb4b382b0d28ef0a_56_3.png)\n\
    \n- **STEP 9**\n  If, however, you prefer to remain working in the Terminal to\
    \ edit/save/create files, you can use Nano. Nano is a simple Terminal-based text\
    \ editor. To try it with the example, enter: `nano Test2.txt`. There’s a menu\
    \ along the bottom of the screen. To exit and save any content in Nano, press\
    \ `Ctrl+X` and follow the on-screen instructions.\n  ![](img/d501697c83491ed0bb4b382b0d28ef0a_56_4.png)\n\
    \n- **STEP 10**\n  We’ve used the Terminal to launch a Mint app, xed, but any\
    \ app can be launched from within the Terminal. For example, try: `firefox`, and\
    \ press `Enter`. Close Firefox to return to the Terminal. Providing you know the\
    \ name of the app, it can run from the Terminal. Additionally, entering `firefox\
    \ &` opens Firefox, AND lets you still use the Terminal.\n  ![](img/d501697c83491ed0bb4b382b0d28ef0a_56_5.png)\n\
    \n## Creating and Removing Directories\n\nAs with creating files in the Terminal,\
    \ you can also create and delete directories, or folders if you prefer. Directories\
    \ form the structure of your file system; without logical directories the filing\
    \ system would be in utter chaos.\n\n### MANAGING FOLDERS\n\nLearning how to create\
    \ and delete folders in the Terminal is an important Mint, and indeed Linux overall,\
    \ skill to master. Here’s the basics for you to try out.\n\n- **STEP 1**\n  With\
    \ the Terminal open, enter `cd ~` to make sure you’re in your own Home directory.\
    \ Now enter `ls` to view the current folders you have housed in the Home directory.\
    \ You’ll notice that folders are labelled in Mint in cyan (light blue). Let’s\
    \ start by creating a new directory. Enter `mkdir testdir`.\n  ![](img/d501697c83491ed0bb4b382b0d28ef0a_57_0.png)\n\
    \n- **STEP 2**\n  If you now enter `ls` again, you’ll see that the new directory,\
    \ testdir, has been created alongside the other directories in the Home area.\
    \ Obviously the command `mkdir` is what creates the directory, and no doubt you’ve\
    \ already guessed it stands for Make Directory.\n\n- **STEP 3**\n  If you were\
    \ to enter the command again, `mkdir testdir`, you’ll receive a message stating:\
    \ `mkdir: cannot create directory ‘testdir’: File exists`. It goes without saying\
    \ then, that you’re only able to have one uniquely named directory within the\
    \ current directory. However, as Linux is case-sensitive, you can have TestDir,\
    \ Testdir, testDir and so on.\n  ![](img/d501697c83491ed0bb4b382b0d28ef0a_57_1.png)\n\
    \n- **STEP 4**\n  You can create directories within directories you’ve already\
    \ created. For example, enter the testdir directory with `cd testdir/` followed\
    \ by `ls` to list the folder structure. Naturally there’s nothing present, as\
    \ you’ve just created the directory. Now drop back to Home via `cd ~`, and enter\
    \ `mkdir testdir/reports`. Go back to the testdir, `cd testdir/`, and `ls` again.\n\
    \  ![](img/d501697c83491ed0bb4b382b0d28ef0a_57_2.png)\n  ![](img/d501697c83491ed0bb4b382b0d28ef0a_57_3.png)\n\
    \n- **STEP 5**\n  The command to create directories is quite logical, therefore,\
    \ you can create the directory, and any subdirectories within. However, what if\
    \ you want to create a directory and a sub-directory in a single command? Make\
    \ sure you're at Home (`cd ~`) and enter: `mkdir -p Temp/finances`. Now, `cd Temp/`,\
    \ and `ls` to list the new directory.\n  ![](img/d501697c83491ed0bb4b382b0d28ef0a_58_0.png)\n\
    \n- **STEP 6**\n  The `-p` option is what enables the `mkdir` command to create\
    \ the sub-directory as well as the (parent) directory. In Linux, commands always\
    \ follow the same structure: Command (`mkdir`), Option (`-p`), and Argument (`Temp/finances`).\n\
    \  ![](img/d501697c83491ed0bb4b382b0d28ef0a_58_2.png)\n\n- **STEP 7**\n  If you\
    \ want to drill down into the various options available for the `mkdir` command,\
    \ you can enter `mkdir -h` (help) into the Terminal. This will provide a quick\
    \ help guide detailing the options and how the command structure works.\n  ![](img/d501697c83491ed0bb4b382b0d28ef0a_58_4.png)\n\
    \n- **STEP 8**\n  Now that we've created some directories, let's see about removing\
    \ them. Start by entering the `testdir` directory and listing its contents: `cd\
    \ testdir`, then `ls`. The previously created `reports` sub-directory is present.\
    \ One way to remove it is to enter: `rmdir reports`, then `ls` again to confirm\
    \ it's not there.\n  ![](img/d501697c83491ed0bb4b382b0d28ef0a_58_1.png)\n\n- **STEP\
    \ 9**\n  A quick warning: removing a directory in the Terminal doesn't place it\
    \ in the Mint Rubbish Bin, via Nemo file manager. The same goes for any files,\
    \ too; if you remove a directory from the Terminal command then it's gone for\
    \ good.\n  ![](img/d501697c83491ed0bb4b382b0d28ef0a_58_3.png)\n\n- **STEP 10**\n\
    \  `Rmdir` will only remove empty directories. To remove directories containing\
    \ sub-directories, or even files, you'll need to use the `rm` command with the\
    \ `-r` option. For example, on the `Temp/finances` directory, use `rm -r Temp`.\
    \ A quick `ls` reveals that the parent folder and all of its contents are removed.\
    \ Careful when using this command.\n  ![](img/d501697c83491ed0bb4b382b0d28ef0a_58_5.png)\n"
  mdcn: "\n\n# 使用终端\n\n## Linux 内核 0.01\n\n```\nconsole.c\n```\n\n* 该模块实现了控制台和写入功能\n\
    * 添加了 CVT102 支持\n* 添加了 CVT102 滚动和状态行功能\n* 希望这将是一个相当完整的 VT102 实现。\n\n注意：当我们向 inb\
    \ 放入一个字时，有时会在短时间内禁用并重新启用中断。它会在 in_port 或 in_port_word 或 inb_interrupt 中放入一个字。我们知道在获取按键中断时，中断并未启用。\n\
    \n您是否知道第一个 Linux 内核作为一个玩笑，只占用了 65KB 的内存？而且，自 0.01 版本以来，Linux 内核现在拥有超过 1800 万行代码。对于一个如今运行着纽约证券交易所并驱动美国国防部核潜艇船队的大学项目来说，这还不错。\n\
    \nwww.bdmpublications.com\n\n## 使用终端创建文件\n\n使用终端，您可以创建文件夹、文件，甚至可以执行 Linux Mint\
    \ 应用程序。事实上，即使您手边没有 GUI，您仍可以通过终端完成相同的工作。\n\n### 更多终端操作\n\n使用终端创建内容并不像第一眼看上去那样费力。是的，对于新手来说，终端可能看起来是一个令人望而生畏的地方，但一旦掌握，它其实非常直观。\n\
    \n- **步骤 1**\n  打开终端，确保您位于主目录（Home folder）。如果没有，请使用 `cd ~` 命令从您当前所在的位置返回主目录。\n\
    \  ![](img/d501697c83491ed0bb4b382b0d28ef0a_55_0.png)\n\n- **步骤 2**\n  让我们开始在主目录内创建一个新文件夹，并命名为\
    \ **Test**。您需要的命令是 `mkdir`。输入命令后，按下 `Enter` 键创建文件夹，然后输入 `cd Test` 并按下 `Enter`。这将更改目录（因此称为\
    \ **CD**）到 newly created Test 文件夹。\n  ![](img/d501697c83491ed0bb4b382b0d28ef0a_55_2.png)\n\
    \n- **步骤 3**\n  您的命令行应该会切换到 Test 文件夹，如果您输入 `ls`（列出文件夹内容），会发现文件夹内没有任何内容，因为您刚刚创建了它。`mkdir`\
    \ 命令相当自解释：Make Directory（创建目录）后接您选定的名称。\n  ![](img/d501697c83491ed0bb4b382b0d28ef0a_55_1.png)\n\
    \n- **步骤 4**\n  要创建一个名为 **Test.txt** 的空文本文件，请在终端中输入：`touch Test.txt`。然后可以使用 `ls`\
    \ 查看文件夹中的新文件。Touch 是一个标准的 Linux 命令，允许创建文件，而无需打开文本编辑器、保存文件，然后关闭编辑器。\n  ![](img/d501697c83491ed0bb4b382b0d28ef0a_55_3.png)\n\
    \n- **步骤 5**\n  假设您现在想要创建一个包含一些内容的文本文件，我们将它命名为 Test2.txt。为此，请输入：`cat > Test2.txt`。这将创建文件\
    \ Test2.txt 并将终端置于编辑模式。\n  ![](img/d501697c83491ed0bb4b382b0d28ef0a_56_0.png)\n\
    \n- **步骤 6**\n  您会注意到光标在 `cat > Test2.txt` 命令下方闪烁，没有通常的提示符。此编辑模式允许您输入文件将包含的文本。输入一些文本，然后按下\
    \ `Ctrl+D` 退出并将内容写入文件。\n  ![](img/d501697c83491ed0bb4b382b0d28ef0a_56_1.png)\n\
    \n- **步骤 7**\n  当然，您不必总是使用终端向文件输入文本。Mint 附带了一个名为 Xed 的文本编辑器，类似于 Windows 的记事本。要在\
    \ Xed 中查看之前创建的文件，请在终端中输入：`xed Test2.txt`，并按下 `Enter`。\n  ![](img/d501697c83491ed0bb4b382b0d28ef0a_56_2.png)\n\
    \n- **步骤 8**\n  Xed 是一个 GUI 应用程序，您可以使用应用程序的主窗口以及其顶部菜单栏中的 **文件 > 保存** 或 **文件 >\
    \ 另存为** 功能来输入文本并相应地保存文件或任何文件。\n  ![](img/d501697c83491ed0bb4b382b0d28ef0a_56_3.png)\n\
    \n- **步骤 9**\n  然而，如果您更喜欢继续留在终端中编辑/保存/创建文件，您可以使用 Nano。Nano 是一个简单的基于终端的文本编辑器。要在示例中尝试使用它，请输入：`nano\
    \ Test2.txt`。屏幕底部有一个菜单。要在 Nano 中退出并保存任何内容，请按下 `Ctrl+X` 并按照屏幕上的说明进行操作。\n  ![](img/d501697c83491ed0bb4b382b0d28ef0a_56_4.png)\n\
    \n- **步骤 10**\n  我们使用终端启动了 Mint 应用程序 xed，但任何应用程序都可以从终端内部启动。例如，尝试输入：`firefox`，并按下\
    \ `Enter`。关闭 Firefox 以返回终端。只要您知道应用程序的名称，就可以从终端运行它。此外，输入 `firefox &` 可以打开 Firefox，同时仍允许您使用终端。\n\
    \  ![](img/d501697c83491ed0bb4b382b0d28ef0a_56_5.png)\n\n## 创建和删除目录\n\n与在终端中创建文件一样，您也可以创建和删除目录，或者如果您喜欢的话，称为文件夹。目录构成了您文件系统的结构；如果没有逻辑目录，文件系统将陷入彻底的混乱。\n\
    \n### 管理文件夹\n\n学习如何在终端中创建和删除文件夹是 Mint 乃至整个 Linux 中需要掌握的重要技能。以下是供您尝试的基本操作。\n\n\
    - **步骤 1**\n  打开终端后，输入 `cd ~` 以确保您位于自己的主目录中。现在输入 `ls` 查看您在主目录中当前的文件夹。您会注意到，在 Mint\
    \ 中文件夹标记为青色（浅蓝色）。让我们开始创建一个新目录。输入 `mkdir testdir`。\n  ![](img/d501697c83491ed0bb4b382b0d28ef0a_57_0.png)\n\
    \n- **步骤 2**\n  如果您再次输入 `ls`，您会看到新目录 testdir 已与其他目录一起创建在主区域中。显然，`mkdir` 命令用于创建目录，毫无疑问您已经猜到它代表\
    \ Make Directory（创建目录）。\n\n- **步骤 3**\n  如果您再次输入该命令，`mkdir testdir`，您将收到一条消息，内容为：`mkdir:\
    \ cannot create directory ‘testdir’: File exists`（mkdir: 无法创建目录 'testdir'：文件已存在）。不言而喻，您只能在当前目录中拥有一个唯一命名的目录。然而，由于\
    \ Linux 区分大小写，您可以拥有 TestDir、Testdir、testDir 等。\n  ![](img/d501697c83491ed0bb4b382b0d28ef0a_57_1.png)\n\
    \n- **步骤 4**\n  您可以创建在已创建的目录内的目录。例如，使用 `cd testdir/` 进入 testdir 目录，然后使用 `ls` 列出文件夹结构。显然，目前没有任何内容，因为您刚刚创建了该目录。现在通过\
    \ `cd ~` 返回主目录，并输入 `mkdir testdir/reports`。回到 testdir，`cd testdir/`，并再次 `ls`。\n\
    \  ![](img/d501697c83491ed0bb4b382b0d28ef0a_57_2.png)\n  ![](img/d501697c83491ed0bb4b382b0d28ef0a_57_3.png)\n\
    \n- **步骤 5**\n  创建目录的命令相当合乎逻辑，因此，您可以创建该目录及其内部的任何子目录。但是，如果您想在一条命令中创建一个目录和一个子目录怎么办？确保您位于主目录（`cd\
    \ ~`）并输入：`mkdir -p Temp/finances`。现在，`cd Temp/`，并 `ls` 以列出新目录。\n  ![](img/d501697c83491ed0bb4b382b0d28ef0a_58_0.png)\n\
    \n- **步骤 6**\n  `-p` 选项使得 `mkdir` 命令能够创建子目录以及（父）目录。在 Linux 中，命令始终遵循相同的结构：命令（`mkdir`）、选项（`-p`）和参数（`Temp/finances`）。\n\
    \  ![](img/d501697c83491ed0bb4b382b0d28ef0a_58_2.png)\n\n- **步骤 7**\n  如果您想深入了解\
    \ `mkdir` 命令可用的各种选项，您可以向终端输入 `mkdir -h`（帮助）。这将提供一个快速帮助指南，详细说明选项以及命令结构的工作方式。\n\
    \  ![](img/d501697c83491ed0bb4b382b0d28ef0a_58_4.png)\n\n- **步骤 8**\n  既然我们已经创建了一些目录，让我们看看如何删除它们。首先进入\
    \ `testdir` 目录并列出其内容：`cd testdir`，然后 `ls`。之前创建的 `reports` 子目录存在。删除它的一种方法是输入：`rmdir\
    \ reports`，然后再次 `ls` 以确认它已不存在。\n  ![](img/d501697c83491ed0bb4b382b0d28ef0a_58_1.png)\n\
    \n- **步骤 9**\n  快速警告：在终端中删除目录不会将其放入 Mint 回收站（通过 Nemo 文件管理器）。对于任何文件也是如此；如果您从终端命令中删除一个目录，那么它就永久消失了。\n\
    \  ![](img/d501697c83491ed0bb4b382b0d28ef0a_58_3.png)\n\n- **步骤 10**\n  `Rmdir`\
    \ 只能删除空目录。要删除包含子目录或甚至文件的目录，您需要使用带有 `-r` 选项的 `rm` 命令。例如，在 `Temp/finances` 目录上，使用\
    \ `rm -r Temp`。简单的 `ls` 显示父文件夹及其所有内容已被删除。使用此命令时要小心。\n  ![](img/d501697c83491ed0bb4b382b0d28ef0a_58_5.png)\n\
    \n"
