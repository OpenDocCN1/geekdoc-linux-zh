    预装工具，用户可以在自己的网络上运行这些工具进行渗透测试。甚至曾经还有一个 Hannah Montana Linux 发行版，但我们最好对那件事少提为妙。重点在于，总有一款发行版适合你。


    不用说，一旦你相对熟练地掌握了 Linux（可能达到了高级用户水平），你就会想要拓展技能，并开始基于 Arch、Debian 或其他众多可用发行版之一构建你自己的
    Linux 发行版。这需要大量的命令行知识，以及对 Linux 系统如何工作及其如何与计算机硬件交互的了解。你需要自行分区硬盘，安装桌面环境，并最终安装你想要的软件和应用程序。这样做需要时间，而且你还要学习很多其他技能。


    最终，你可以认为自己是一名技术型 Linux 用户，但永远不要自认为专家，毕竟我们总是在学习新东西。你可以从零开始构建自己的发行版，帮助其他 Linux 用户解决问题，甚至可能在某个发行版的测试阶段或构建过程中为其改进做出贡献。接下来该往哪里走呢？


    奇怪的是，大多数高端技术用户最终发现自己又回到了起点，使用像 Linux Mint 这样的发行版。主要原因通常是它简单易用，且环境稳定。即使你系统了如指掌，也不代表你总是想要修复潜在的问题。我们大多数人更喜欢轻松的生活方式，尤其是在涉及技术时，因此合乎逻辑的选择是挑选一个简单但仍然强大到足以完成你想做的所有事情的发行版，因此
    Linux Mint 是一个不错的选择。


    然而，归根结底，这完全取决于你个人的选择。你可能发现在阅读完本书中的教程后，你不喜欢 Linux Mint 或 Cinnamon 桌面。没关系，你可能更喜欢
    Ubuntu、Debian 或 openSUSE；这就是 Linux 的魅力所在。自由地更改你想要的，从一种发行版跳向另一种，而不会因为成本或缺乏访问权限而受到惩罚。


    对于“哪个发行版好”这个问题，答案是：你喜欢的任何一个！它可以复杂或简单，取决于你的需求，只要它能完成你想让它做的事情，它就是完美的。


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_16_0.png)


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_16_1.png)


    ## 入门

    ## 使用 Linux


    > “在真正的开源中，你有权掌控自己的命运。”

    > — Linus Torvalds（Linux 内核开发者）


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_17_0.png)


    ### Linux 入门


    谈论 Linux 有多好虽然听起来不错，但你如何将其安装到计算机上？**安装 Linux** 非常简单，但你面前有多种选择。本节将介绍如何下载 Linux
    ISO 映像，将其作为主要操作系统安装到 PC 上，以及如何安装虚拟环境。


    使用虚拟环境，你可以在继续使用主要操作系统（无论是 Windows 还是 macOS）的同时运行 Linux。**好奇吗？继续阅读，了解更多详情。**


    - **20** 在 Windows 上创建 Linux 安装介质

    - **22** 在 PC 上安装 Linux

    - **24** 安装虚拟环境

    - **26** 在虚拟环境中安装 Linux


    ### 在 Windows 上创建 Linux 安装介质


    在安装 Linux 到计算机之前，你需要将下载的 Linux ISO 转移到 DVD 或 USB 闪存盘上。这将是一个实时环境，允许你在安装前测试操作系统，但首先你需要创建可启动媒体。


    ### DVD 可启动媒体


    我们在这里使用 Windows 10 计算机将 ISO 传输到 DVD。如果你使用的是 Windows 7 或更高版本，这个过程非常简单。


    - **步骤 1** 首先找到你已下载的 Linux ISO 映像。在 Windows 7、8、1 和 10 计算机中，你通常可以在“下载”文件夹中找到它，除非在保存时指定了其他位置。


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_19_0.png)


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_19_1.png)


    - **步骤 3** 右键单击 Linux ISO，从菜单中选择“烧录光盘映像”。根据计算机的速度，可能需要几秒钟才会有反应。不要担心，除非耗时超过一分钟，如果是这种情况，可能值得重启计算机并重试。幸运的是，Windows
    光盘映像刻录机应该会启动。


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_19_2.png)


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_19_3.png)


    - **步骤 2** 接下来，将一张可记录 DVD 光盘插入计算机的光驱。几秒钟后，在读取光盘期间，Windows 会显示一条弹出消息，询问你对新插入的光盘要做什么。忽略此消息，因为我们要使用内置的图像烧录功能。


    - **步骤 4** 当 Windows 光盘映像刻录机对话框打开后，勾选“烧录后验证光盘”复选框，然后单击“烧录”按钮。这个过程可能需要几分钟，具体取决于你
    PC 光驱的速度。完成后，它将执行验证阶段，完成后光驱应会自动弹出光盘。


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_19_2.png)


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_19_3.png)


    ### USB 可启动媒体


    USB 媒体比 DVD 更快，而且通常更方便，因为大多数现代 PC 没有安装光驱。传输映像的过程很简单，但你首先需要一个第三方应用程序和一个 4GB 或更大的
    USB 闪存盘。


    **步骤 1** 首先打开网络浏览器，访问 www.rufus.akeo.ie/。向下滚动页面一点，你会看到一个“下载”标题，下面就是最新版本的 Rufus。左键单击链接开始下载。


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_20_0.png)


    **步骤 2** 双击下载的 Rufus 可执行文件，对 Windows 安全提示单击“是”，对检查更新也单击“是”。Rufus 启动后，它应该已经识别出你插入的
    USB 闪存盘；如果没有，只需将其拔出并重新插入。


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_20_1.png)


    **步骤 3** 乍一看，Rufus 界面可能有点令人困惑，但别担心，它其实很简单。首先，单击“磁盘或 ISO 映像（请选择）”下拉菜单旁边的“选择”按钮。这将打开一个
    Windows 资源管理器窗口，你可以在其中定位并选择 Linux ISO。


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_20_2.png)


    **步骤 4** 当你准备好时，单击 Rufus 应用底部的“开始”按钮。这可能会打开另一个对话框，询问你是否要下载并使用新版本的 SysLinux。SysLinux
    是一组引导加载程序，用于允许现代 PC 从 USB 闪存盘访问和引导。这是必需的，因此如果被询问，请单击“是”以继续。


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_20_3.png)


    **步骤 5** 下一步询问你希望以哪种映像模式将 Linux ISO 写入 USB 闪存盘。两种方法适用于不同的情况，但通常，推荐的 ISO 映像模式更受欢迎。确保选择此模式，然后单击“确定”继续，再单击一次“确定”确认操作。


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_20_4.png)


    **步骤 6** 现在 Linux ISO 已传输到 USB 闪存盘。这个过程不会花太长时间，同样取决于 USB 设备和 PC 的速度。你可能会发现 Rufus
    在处理过程中自动在 Windows 资源管理器中打开 USB 驱动器；别担心，你可以将其最小化或关闭。过程完成后，单击“关闭”按钮。


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_20_5.png)


    ### 在 PC 上安装 Linux


    大多数 Linux 发行版都提供实时环境。这意味着你可以直接从刚才创建的 DVD 或 USB 启动到一个实际、完全可用的发行版。让我们看看它是如何工作的，以及如何从中安装
    Linux。


    ### UEFI BIOS


    统一可扩展固件接口（UEFI）用于在启动过程中识别硬件并保护 PC。它取代了传统的 BIOS，但在安装 Linux 时可能会引发问题。


    - **步骤 1** 将你的 DVD 或 USB 闪存盘插入 PC，如果尚未关闭 Windows，请先关闭。在此实例中，我们使用 USB 启动介质，但过程几乎相同。启动
    PC，当提示时，按下相应的键进入 BIOS 或 SETUP，例如可能是 F2、Del 或甚至 F11。


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_21_0.png)


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_21_1.png)


    - **步骤 3** 将 UEFI 切换到传统模式后，现在有两种方法可以引导到实时环境。第一种是通过你当前所在的 BIOS。定位到启动顺序，将第一个启动设备从其原始设置（通常是内部硬盘驱动器或类似项）更改为：对于
    USB 介质选项，选择“USB 存储设备”；对于 DVD 介质选项，选择“DVD 驱动器”。


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_21_2.png)


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_21_3.png)


    - **步骤 2** 有各种不同版本的 UEFI BIOS，因此无法涵盖所有情况。我们要找的是详细说明启动顺序或启动模式的章节。在这里，你可以选择关闭 UEFI
    并选择传统模式或禁用安全启动。大多数发行版都支持 UEFI，但启用 UEFI 启动可能是一个棘手的过程。


    - **步骤 4** 或者，使用启动选项菜单。使用此选项，你可以按 F12（或类似键）显示一组启动媒体选项；在那里，你可以选择适当的启动媒体。无论哪种方式，你都可以导航到“保存并退出”选项并选择“保存更改并退出”来保存并退出
    BIOS。


