    ## 使用终端


    > “Linux：拥有 CLUE……命令行用户环境（Command Line User Environment）的操作系统。”

    >

    > — 匿名（发布于 comp.software.testing）


    Linux 命令行，即终端，是一个功能极其强大的环境。通过它，你既可以令操作系统不堪重负，也可以将其更新到令人惊叹的状态。你可以入侵远程计算机，观看动画 ASCII
    篝火，安装新的应用程序和程序，观看从荷兰服务器上播放的《星球大战》，以及编写复杂的自动化脚本。


    在本节中，您将探索终端的复杂机制，以及它如何与 Linux 协作。您将学习如何通过终端操作 Linux 文件系统，并发现一些奇怪但有趣、可以在终端中执行的操作。


    终端在 Linux 世界中至高无上。了解它的运作方式，您就能获取所有这种强大的力量。


    - 46 终端基础

    - 48 通过终端更新 Mint

    - 50 通过终端安装应用程序 - 第一部分

    - 52 通过终端安装应用程序 - 第二部分

    - 54 你知道吗……Linux 内核 0.01

    - 56 使用终端创建文件

    - 58 创建和删除目录

    - 60 在终端中做些有趣的事情

    - 62 在终端中做更多有趣的事情

    - 64 Linux 技巧与窍门

    - 66 你知道吗……Linux 与大爆炸

    - 68 创建 Bash 脚本——第 1 - 5 部分

    - 78 Pi x Linux = 完美组合

