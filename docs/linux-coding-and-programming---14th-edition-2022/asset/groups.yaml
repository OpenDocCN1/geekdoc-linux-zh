    \ Enter 键。每个选择都是一个外部命令，它反馈各种信息。尝试这些命令和选择，看看你能想出什么。这稍微超出了我们查看的范围，但它很好地展示了可以实现什么。\n\
    \n  ![](img/d501697c83491ed0bb4b382b0d28ef0a_73_3.png)\n\n## 创建备份任务脚本\n\nBash\
