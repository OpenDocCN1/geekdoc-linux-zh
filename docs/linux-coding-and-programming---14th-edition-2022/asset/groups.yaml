    \n### STD\n\n虽然 std 代表完全不同的含义，但在 C++ 中它表示 Standard（标准）。它是 C++ 标准命名空间的一部分，涵盖了许多不同的语句和命令。你可以省略代码中的\
    \ `std::` 部分，但必须在开始处用 `using namespace std;` 声明，不能两者都用。例如：\n\n```cpp\n#include\
    \ <iostream>\nusing namespace std;\n```\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_124_2.png)\n\
    \n### 输出\n\n接着，\"Hello, world!\" 部分是你希望代码执行时在屏幕上显示的内容。你可以输入任何内容，只要它在引号内。有时根据编译器的不同，可能需要括号。`\\\
