    \n## C++ 程序的结构\n\nC++ 具有非常明确的结构和操作方式。如果遗漏了什么，哪怕是一个分号，你的整个程序都将无法编译和运行。许多专业程序员都曾因结构松散而吃过亏。\n\
    \n### #INCLUDE <C++ 结构>\n\n在学习编程基础时，你开始理解程序的结构。虽然命令可能因语言而异，但你可以开始看到代码是如何工作的。\n\
    \n### C++\n\nC++ 是由丹麦学生 Bjarne Stroustrup 于 1979 年发明的，作为他的博士论文的一部分。最初 C++ 被称为\
    \ C with Classes（带类的 C），它在已经很流行的 C 编程语言的基础上增加了特性，同时通过新的结构使其成为更用户友好的环境。\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_123_0.png)\n\
    \nBjarne Stroustrup，C++ 的发明者。\n\n### INT MAIN()\n\nint main() 启动了一个函数的声明，该函数是一组名为\
    \ 'main' 的代码语句。无论其在代码中的实际位置如何，所有 C++ 代码都从 main 函数开始。\n\n```cpp\n#include <iostream>\n\
    int main()\n```\n\n### #INCLUDE\n\nC++ 程序的结构相当精确。每个 C++ 代码都以指令 #include <> 开始。该指令指示预处理器包含一段标准\
    \ C++ 代码。例如：#include <iostream> 包含 iostream 头文件，以支持输入/输出操作。\n\n### 花括号\n\n左花括号（花括号）可能是你以前没有接触过的东西，特别是如果你习惯使用\
    \ Python。左花括号表示 main 函数的开始，并包含属于该函数的所有代码。\n\n```cpp\n#include <iostream>\nint\
    \ main()\n```\n\n```cpp\n#include <iostream>\nint main() {\n    \n}\n```\n\n###\
    \ 注释\n\n以双斜杠开头的行是注释。这意味着它们不会在代码中执行，并被编译器忽略。注释旨在帮助你，或帮助查看你代码的其他程序员，解释正在发生什么。注释有两种类型：`/*`\
    \ 覆盖多行注释，而 `//` 为单行注释。\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_124_0.png)\n\
    \n### <<\n\n这里使用的两个尖括号是插入运算符。这意味着尖括号后面的内容将被插入到 `std::cout` 语句中。在这种情况下，它们是单词 'Hello,\
