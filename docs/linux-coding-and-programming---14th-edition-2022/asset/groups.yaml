  - "[PAGE 135]\n\n# Strings\n\nStrings are objects that represent and hold sequences\
    \ of characters. For example, you could have a universal greeting in your code\
    \ 'Welcome' and assign that as a string to be called up whenever you like in the\
    \ program.\n\n# STRING THEORY\n\nThere are different ways in which you can create\
    \ a string of characters, which historically are all carried over from the original\
    \ C language and still supported by C++.\n\n**STEP 1** To create a string, you\
    \ use the char function. Open a new C++ file and begin with the usual header:\n\
    \n```\n```cpp\n#include <iostream>\nusing namespace std;\n\nint main ()\n{\n}\n\
    ```\n```\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_135_0.png)\n\n**STEP 3**\
    \ Build and run the code and 'Welcome' appears on the screen. While this is perfectly\
    \ fine, it's not a string. A string is a class, which defines objects that can\
    \ be represented as a stream of characters and doesn't need to be terminated like\
    \ an array. The code can therefore be represented as:\n\n```\n```cpp\n#include\
    \ <iostream>\nusing namespace std;\n\nint main ()\n{\n   char greet[] = \"Welcome\"\
    ;\n   cout << greet << \"\\n\";\n}\n```\n```\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_135_1.png)\n\
    \n**STEP 2** It's easy to confuse a string with an array. Here's an array, which\
    \ can be terminated with a null character:\n\n```\n```cpp\n#include <iostream>\n\
    using namespace std;\n\nint main ()\n{\n   char greet[8] = {'W', 'e', 'l', 'c',\
    \ 'o', 'm', 'e', '\\0'};\n   cout << greet << \"\\n\";\n}\n```\n```\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_135_2.png)\n\
    \n**STEP 4** In C++ there's also a string function, which works in much the same\
    \ way. Using the greeting code again, you can enter:\n\n```\n```cpp\n#include\
    \ <iostream>\nusing namespace std;\n\nint main ()\n{\n   string greet = \"Welcome\"\
    ;\n   cout << greet << \"\\n\";\n}\n```\n```\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_135_3.png)"
  md: "\n## STEP 5\n\nYou can assign a value to a variable as soon as you declare\
    \ it. The code you've typed in could look like this. Instead:\n\n```cpp\nint a\
    \ = 10;\nint b = 5;\nint result = a + b;\n\ncout << result;\n```\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_132_0.png)\n\
    \n## STEP 6\n\nSpecific to C++, you can also use the following to assign values\
    \ to a variable as soon as you declare them:\n\n```cpp\nint a (10);\nint b (5);\n\
    ```\n\nThen, from the C++11 standard, using curly brackets:\n\n```cpp\nint result\
    \ = {a+b};\n```\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_132_1.png)\n\n## STEP\
    \ 7\n\nYou can create global variables, which are variables that are declared\
    \ outside any function and used in any function within the entire code. What you've\
    \ used so far are local variables: variables used inside the function. For example:\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\nint StartLives = 3;\n\nint\
    \ main()\n{\n    StartLives = StartLives - 1;\n    cout << StartLives;\n}\n```\n\
    \n![](img/d501697c83491ed0bb4b382b0d28ef0a_132_2.png)\n\n## STEP 8\n\nThe previous\
    \ step creates the variable StartLives, which is a global variable. In a game,\
    \ for example, a player's lives go up or down depending on how well or how bad\
    \ they're doing. When the player restarts the game, the StartLives returns to\
    \ its default state. Here we've assigned 3 lives, then subtracted 1, leaving 2\
    \ lives left.\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_132_3.png)\n\n## STEP\
    \ 9\n\nThe modern C++ compiler is far more intelligent than most programmers give\
    \ it credit. While there are numerous data types we can declare for variables,\
    \ you can just use the auto feature:\n\n```cpp\n#include <iostream>\nusing namespace\
    \ std;\nauto pi = 3.141593;\n\nint main()\n{\n    double area, radius = 1.5;\n\
    \    area = pi * radius * radius;\n    cout << area;\n}\n```\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_132_4.png)\n\
    \n## STEP 10\n\nAlthough we said to ignore the warnings in Step 3, there's a difference\
    \ between a warning and an error. In this case, it's just a simple warning. The\
    \ new data type, double, means double-precision floating point value, which makes\
    \ the code more accurate. The result should be 7.06858. Essentially, you can often\
    \ work with a warning but not an error.\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_132_5.png)\n\
    \n## Data Types\n\nVariables, as you’ve seen, store information that the programmer\
    \ can then later call up, and manipulate if required. Variables are simply reserved\
    \ memory locations that store the values the programmer assigns, depending on\
    \ the data type used.\n\n### THE VALUE OF DATA\n\nThere are many different data\
    \ types available for the programmer in C++, such as an integer, floating point,\
    \ Boolean, character and so on. It’s widely accepted that there are seven basic\
    \ data types, often called Primitive Built-in Types; however, you can create your\
    \ own data types should the need ever arise within your code.\n\n| Type | Command\
    \ |\n| :--- | :--- |\n| Integer | int |\n| Floating Point | float |\n| Character\
    \ | char |\n| Boolean | bool |\n| Double Floating Point | double |\n| Wide Character\
    \ | wchar_t |\n| No Value | void |\n\nThese basic types can also be extended using\
    \ the following modifiers: Long, Short, Signed and Unsigned. Basically this means\
    \ the modifiers can expand the minimum and maximum range values for each data\
    \ type. For example, the int data type has a default value range of -2147483648\
    \ to 2147483647, a fair value, you would agree.\n\nNow, if you were to use one\
    \ of the modifiers, the range alters:\n\n- Unsigned int = 0 to 4294967295\n- Signed\
    \ int = -2147483648 to 2147483647\n- Short int = -32768 to 32767\n- Unsigned Short\
    \ int = 0 to 65,535\n- Signed Short int = -32768 to 32767\n- Long int = -2147483647\
    \ to 2147483647\n- Signed Long int = -2147483647 to 2147483647\n- Unsigned Long\
    \ int = 0 to 4294967295\n\nNaturally you can get away with using the basic type\
    \ without the modifier, as there’s plenty of range provided with each data type.\
    \ However, it’s considered good C++ programming practise to use the modifiers\
    \ when possible.\n\nThere are issues when using the modifiers though. Double represents\
    \ a double-floating point value, which you can use for incredibly accurate numbers\
    \ but those numbers are only accurate up to the fifteenth decimal place. There’s\
    \ also the problem when displaying such numbers in C++ using the cout function,\
    \ in that cout by default only outputs the first five decimal places. You can\
    \ combat that by adding a cout.precision() function and adding a value inside\
    \ the brackets but even then you’re still limited by the accuracy of the double\
    \ data type. For example, try this code:\n\n```cpp\n#include <iostream>\nusing\
    \ namespace std;\ndouble PI = 3.141592653589793238463;\n\nint main()\n{\n    cout\
    \ << PI;\n}\n```\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_133_0.png)\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_133_1.png)\n\
    \nBuild and run the code and as you can see the output is only 3.14159, representing\
    \ cout’s limitations in this example.\n\nYou can alter the code including the\
    \ aforementioned cout.precision function, for greater accuracy. Take precision\
    \ all the way up to 22 decimal places, with the following code:\n\n```cpp\n#include\
    \ <iostream>\nusing namespace std;\ndouble PI = 3.141592653589793238463;\n\nint\
    \ main()\n{\n    cout.precision(22);\n    cout << PI;\n}\n```\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_134_0.png)\n\
    \nThis is mainly due to the conversion from binary in the compiler and that the\
    \ IEEE 754 double precision standard occupies 64-bits of data, of which 52-bits\
    \ are dedicated to the significant (the significant digits in a floating-point\
    \ number) and roughly 3.5-bits are taken holding the values 0 to 9. If you divide\
    \ 53 by 3.5, then you arrive at 15.142857 recurring, which is 15-digits of precision.\n\
    \nTo be honest, if you’re creating code that needs to be accurate to more than\
    \ fifteen decimal places, then you wouldn’t be using C++, you would use some scientific\
    \ specific language with C++ as the connective tissue between the two languages.\n\
    \nAgain, build and run the code; as you can see from the command line window,\
    \ the number represented by the variable PI is different to the number you’ve\
    \ told C++ to use in the variable. The output reads the value of PI as 3.141592653589793115998,\
    \ with the numbers going awry from the fifteenth decimal place.\n\nYou can create\
    \ your own data types, using a alias-like system called typedef. For example:\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\ntypedef int metres;\n\nint\
    \ main()\n{\n    metres distance;\n    distance = 15;\n    cout << \"Distance\
    \ in metres is: \" << distance;\n}\n```\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_134_1.png)\n\
    \n![](img/d501697c83491ed0bb4b382b0d28ef0a_134_2.png)\n\nThis code when executed\
    \ creates a new int data type called metres. Then, in the main code block, there’s\
    \ a new variable called distance, which is an integer; so you’re telling the compiler\
    \ that there’s another name for int. We assigned the value 15 to distance and\
    \ displayed the output: distance in metres is 15.\n\nIt might sound a little confusing\
    \ to begin with but the more you use C++ and create your own code, the easier\
    \ it becomes.\n\n## Strings\n\nStrings are objects that represent and hold sequences\
    \ of characters. For example, you could have a universal greeting in your code\
    \ 'Welcome' and assign that as a string to be called up whenever you like in the\
    \ program.\n\n### STRING THEORY\n\nThere are different ways in which you can create\
    \ a string of characters, which historically are all carried over from the original\
    \ C language and still supported by C++.\n\n**STEP 1** To create a string, you\
    \ use the char function. Open a new C++ file and begin with the usual header:\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\n\nint main ()\n{\n}\n```\n\
    \n![](img/d501697c83491ed0bb4b382b0d28ef0a_135_0.png)\n\n**STEP 2** It's easy\
    \ to confuse a string with an array. Here's an array, which can be terminated\
    \ with a null character:\n\n```cpp\n#include <iostream>\nusing namespace std;\n\
    \nint main ()\n{\n   char greet[8] = {'W', 'e', 'l', 'c', 'o', 'm', 'e', '\\0'};\n\
    \   cout << greet << \"\\n\";\n}\n```\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_135_2.png)\n\
    \n**STEP 3** Build and run the code and 'Welcome' appears on the screen. While\
    \ this is perfectly fine, it's not a string. A string is a class, which defines\
    \ objects that can be represented as a stream of characters and doesn't need to\
    \ be terminated like an array. The code can therefore be represented as:\n\n```cpp\n\
    #include <iostream>\nusing namespace std;\n\nint main ()\n{\n   char greet[] =\
    \ \"Welcome\";\n   cout << greet << \"\\n\";\n}\n```\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_135_1.png)\n\
    \n**STEP 4** In C++ there's also a string function, which works in much the same\
    \ way. Using the greeting code again, you can enter:\n\n```cpp\n#include <iostream>\n\
    using namespace std;\n\nint main ()\n{\n   string greet = \"Welcome\";\n   cout\
    \ << greet << \"\\n\";\n}\n```\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_135_3.png)\n"
  mdcn: "\n\n## 步骤 5\n\n你可以在声明变量的同时为其赋值。你之前输入的代码看起来可能像这样。反之：\n\n```cpp\nint a = 10;\n\
    int b = 5;\nint result = a + b;\n\ncout << result;\n```\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_132_0.png)\n\
    \n## 步骤 6\n\n就 C++ 而言，你在使用声明变量的同时为其赋值时，也可以使用以下写法：\n\n```cpp\nint a (10);\nint\
    \ b (5);\n```\n\n然后，从 C++11 标准开始，可以使用花括号：\n\n```cpp\nint result = {a+b};\n```\n\
    \n![](img/d501697c83491ed0bb4b382b0d28ef0a_132_1.png)\n\n## 步骤 7\n\n你可以创建全局变量，这些变量是在任何函数外部声明的，并且可以在整个代码中的任何函数内使用。你目前所使用的都是局部变量：即在函数内部使用的变量。例如：\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\nint StartLives = 3;\n\nint\
    \ main()\n{\n    StartLives = StartLives - 1;\n    cout << StartLives;\n}\n```\n\
    \n![](img/d501697c83491ed0bb4b382b0d28ef0a_132_2.png)\n\n## 步骤 8\n\n上一步创建了变量 StartLives，它是一个全局变量。例如在游戏中，玩家的生命值会根据其表现好坏而增减。当玩家重新开始游戏时，StartLives\
    \ 会恢复到其默认状态。在这里，我们将生命值设为 3，然后减去 1，剩下 2 条命。\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_132_3.png)\n\
    \n## 步骤 9\n\n现代 C++ 编译器比大多数程序员给予其的赞誉要智能得多。虽然我们可以为变量声明许多不同的数据类型，但你可以直接使用 auto 特性：\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\nauto pi = 3.141593;\n\nint\
    \ main()\n{\n    double area, radius = 1.5;\n    area = pi * radius * radius;\n\
    \    cout << area;\n}\n```\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_132_4.png)\n\
    \n## 步骤 10\n\n尽管我们在步骤 3 中提到忽略警告，但警告和错误之间存在区别。在这种情况下，它只是一个简单的警告。新的数据类型 double 意味着双精度浮点值，这使得代码更加精确。结果应该是\
    \ 7.06858。基本上，你可以处理警告，但不能处理错误。\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_132_5.png)\n\
    \n## 数据类型\n\n如前所述，变量存储信息，程序员随后可以调用这些信息进行操作（如有需要）。变量仅仅是保留的内存位置，存储程序员根据所使用的数据类型分配的值。\n\
    \n### 数据的价值\n\nC++ 为程序员提供了许多不同的数据类型，例如整数、浮点数、布尔值、字符等。普遍认为有七种基本数据类型，通常称为“原始内置类型”；但是，如果代码中出现需求，你可以创建自己的数据类型。\n\
    \n| 类型 | 命令 |\n| :--- | :--- |\n| 整数 | int |\n| 浮点数 | float |\n| 字符 | char |\n\
    | 布尔值 | bool |\n| 双精度浮点数 | double |\n| 宽字符 | wchar_t |\n| 无值 | void |\n\n这些基本类型也可以使用以下修饰符进行扩展：长整型\
    \ (Long)、短整型 (Short)、有符号 (Signed) 和无符号 (Unsigned)。基本上，这意味着修饰符可以扩展每种数据类型的最小值和最大值范围。例如，int\
    \ 数据类型的默认值范围是 -2147483648 到 2147483647，这是一个相当不错的范围，你会同意的。\n\n现在，如果你使用其中一种修饰符，范围会改变：\n\
    \n- 无符号 int (Unsigned int) = 0 到 4294967295\n- 有符号 int (Signed int) = -2147483648\
    \ 到 2147483647\n- 短整型 (Short int) = -32768 到 32767\n- 无符号短整型 (Unsigned Short int)\
    \ = 0 到 65,535\n- 有符号短整型 (Signed Short int) = -32768 到 32767\n- 长整型 (Long int)\
    \ = -2147483647 到 2147483647\n- 有符号长整型 (Signed Long int) = -2147483647 到 2147483647\n\
    - 无符号长整型 (Unsigned Long int) = 0 到 4294967295\n\n当然，你可以直接而不必使用修饰符的基本类型，因为每种数据类型都提供了充足的范围。然而，在可能的情况下使用修饰符被认为是良好的\
    \ C++ 编程实践。\n\n然而，使用修饰符时也会存在问题。Double 代表双精度浮点值，你可以用它来表示极其精确的数字，但这些数字的精度仅限于小数点后第十五位。在\
    \ C++ 中，使用 cout 函数显示此类数字时还有一个问题，即 cout 默认只输出前五位小数。你可以通过添加 cout.precision() 函数并在括号内添加值来应对这种情况，但即便如此，你仍然受限于\
    \ double 数据类型的精度。例如，尝试这段代码：\n\n```cpp\n#include <iostream>\nusing namespace std;\n\
    double PI = 3.141592653589793238463;\n\nint main()\n{\n    cout << PI;\n}\n```\n\
    \n![](img/d501697c83491ed0bb4b382b0d28ef0a_133_0.png)\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_133_1.png)\n\
    \n编译并运行代码，你会发现输出仅为 3.14159，代表了本例中 cout 的限制。\n\n你可以修改代码，加入前述的 cout.precision 函数，以获得更高的精度。将精度提高到小数点后\
    \ 22 位，使用以下代码：\n\n```cpp\n#include <iostream>\nusing namespace std;\ndouble PI\
    \ = 3.141592653589793238463;\n\nint main()\n{\n    cout.precision(22);\n    cout\
    \ << PI;\n}\n```\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_134_0.png)\n\n这主要归因于编译器中的二进制转换，以及\
    \ IEEE 754 双精度标准占用 64 位数据，其中 52 位专门用于有效数字（浮点数中的有效数字），大约 3.5 位用于持有 0 到 9 的值。如果你用\
    \ 53 除以 3.5，你会得到 15.142857...（循环小数），即 15 位精度。\n\n老实说，如果你编写的代码需要精确到小数点后十五位以上，那么你不会使用\
    \ C++，而会使用某种特定的科学计算语言，并让 C++ 充当这两种语言之间的连接组织。\n\n再次编译并运行代码；正如你在命令行窗口中看到的那样，变量 PI\
    \ 表示的数值与你告诉 C++ 在变量中使用的数值不同。输出将 PI 的值读取为 3.141592653589793115998，从第十五位小数开始数字变得混乱。\n\
    \n你可以使用称为 typedef 的类似别名的系统创建自己的数据类型。例如：\n\n```cpp\n#include <iostream>\nusing\
    \ namespace std;\ntypedef int metres;\n\nint main()\n{\n    metres distance;\n\
    \    distance = 15;\n    cout << \"Distance in metres is: \" << distance;\n}\n\
    ```\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_134_1.png)\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_134_2.png)\n\
    \n这段代码执行时会创建一个新的 int 数据类型，称为 metres。然后，在 main 代码块中，有一个名为 distance 的新变量，它是一个整数；所以你正在告诉编译器\
    \ int 有另一个名称。我们将值 15 赋给 distance 并显示输出：distance 为 15 米。\n\n一开始听起来可能有点令人困惑，但只要你更多地使用\
    \ C++ 并创建自己的代码，它就会变得更容易理解。\n\n## 字符串\n\n字符串是表示和持有字符序列的对象。例如，你可以在代码中有一个通用的问候语 'Welcome'，并将其作为一个字符串赋值，以便在程序中随时调用。\n\
    \n### 字符串理论\n\n创建字符字符串的方式有多种，从历史上看，这些方法都是从最初的 C 语言继承下来，并且 C++ 仍然支持。\n\n**步骤 1**\
    \ 要创建字符串，你使用 char 函数。打开一个新的 C++ 文件，并以通常的标头开始：\n\n```cpp\n#include <iostream>\n\
    using namespace std;\n\nint main ()\n{\n}\n```\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_135_0.png)\n\
    \n**步骤 2** 很容易将字符串与数组混淆。这里是一个数组，它可以用空字符终止：\n\n```cpp\n#include <iostream>\nusing\
    \ namespace std;\n\nint main ()\n{\n   char greet[8] = {'W', 'e', 'l', 'c', 'o',\
    \ 'm', 'e', '\\0'};\n   cout << greet << \"\\n\";\n}\n```\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_135_2.png)\n\
    \n**步骤 3** 编译并运行代码，'Welcome' 会出现在屏幕上。虽然这完全没问题，但它不是一个字符串。字符串是一个类，定义可以表示为字符流的对象，并且不需要像数组那样终止。因此，代码可以表示为：\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\n\nint main ()\n{\n   char\
    \ greet[] = \"Welcome\";\n   cout << greet << \"\\n\";\n}\n```\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_135_1.png)\n\
    \n**步骤 4** 在 C++ 中还有一个 string 函数，其工作方式大致相同。再次使用问候语代码，你可以输入：\n\n```cpp\n#include\
    \ <iostream>\nusing namespace std;\n\nint main ()\n{\n   string greet = \"Welcome\"\
    ;\n   cout << greet << \"\\n\";\n}\n```\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_135_3.png)\n\
    \n"
