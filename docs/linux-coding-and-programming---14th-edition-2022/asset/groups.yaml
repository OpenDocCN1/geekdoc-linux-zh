    \ code: 0]\nPress return to continue\n```\n\n## 步骤 8\n\n可以使用以下方法计算数字的幂：\n\n```cpp\n\
    #include <iostream>\n#include <cmath>\nusing namespace std;\nint main ()\n{\n\
    \    float number = 12;\n    cout << number << \" to the power of 2 is \" << pow(number,\
    \ 2) << \"\\n\";\n    cout << number << \" to the power of 3 is \" << pow(number,\
    \ 3) << \"\\n\";\n    cout << number << \" to the power of 0.8 is \" << pow(number,\
    \ 0.8) << \"\\n\";\n}\n```\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_138_2.png)\n\
    \n## 步骤 9\n\n在这里，我们创建了一个值为 12 的名为 `number` 的浮点数，计算发生在 `pow(变量, 幂)` 中。当然，你可以不使用变量来计算幂和平方根。例如，`pow(12,\
