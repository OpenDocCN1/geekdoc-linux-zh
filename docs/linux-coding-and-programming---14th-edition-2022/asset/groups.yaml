    \ `M_PI` 函数调用。在代码中输入 `cout << M_PI`，你会得到 3.14159，或者你可以用它来计算：\n\n```cpp\n#include\
    \ <iostream>\n#include <cmath>\nusing namespace std;\nint main ()\n{\n    double\
