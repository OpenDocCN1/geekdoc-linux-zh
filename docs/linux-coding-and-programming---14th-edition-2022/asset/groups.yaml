    ## 创建 Bash 脚本 – 第二部分


    前面我们介绍了如何创建你的第一个 Bash 脚本“Hello World”（你好，世界），以及如何添加系统变量。现在你可以在此基础上进行扩展，通过创建自定义变量来探索其更多可能性。


    ### 变量


    与其他编程语言一样，Bash 脚本可以从系统中存储和调用特定变量，这些变量既可以是通用的，也可以是用户创建的。


    - **步骤 1** 让我们从创建一个名为 `hello.sh` 的新脚本开始；`xed hello.sh`。在其中输入：`#!/bin/bash`，然后输入
    `echo Hello $1`。保存文件并退出 Xed。返回终端后，使用以下命令使脚本可执行：`chmod +x hello.sh`。


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_69_0.png)


    - **步骤 2** 由于脚本现在已可执行，使用 `./hello.sh` 运行它。正如你可能预期的那样，终端会显示一个简单的“Hello”（你好）。然而，如果你使用带有变量的命令来运行它，事情就变得更有趣了。例如，尝试运行
    `./hello.sh David`。


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_69_2.png)


    - **步骤 3** 现在的输出将是 Hello David（你好，大卫）。这是因为 Bash 会自动为用户分配变量，然后这些变量会被保留并传递给脚本。因此，变量
    ''$1'' 现在存储着 ''David''。你可以通过输入不同的内容来更改变量：`./hello.sh Mint`。


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_69_1.png)


    - **步骤 4** 你甚至可以重命名变量。使用以下内容修改 hello.sh 脚本：`firstName=$1`，`surname=$2`，`echo Hello
    $firstname $surname`。将每个语句放在新的一行中。保存脚本并退出回到终端。


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_69_3.png)


    - **步骤 5** 现在运行脚本时，你可以使用两个自定义变量：`./hello.sh David Hayward`。当然，你可以将这两个变量更改为你自己的名字；除非你也叫
    David Hayward。目前我们只是在打印内容，所以让我们稍微扩展一下这两个变量的用法。


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_70_0.png)


    - **步骤 6** 创建一个名为 `addition.sh` 的新脚本，使用与 hello.sh 脚本相同的格式，但更改变量名称。在这里，我们添加了 `firstnumber`
    和 `secondnumber`，并将 echo 命令更改为通过放置一个整数表达式来输出简单的算术运算，`echo $((($firstnumber+$secondnumber)))`。保存脚本，并使其可执行（`chmod
    +x addition.sh`）。


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_70_1.png)


    - **步骤 7** 现在运行 addition.sh 脚本时，我们可以输入两个数字：`./addition.sh 1 2`。结果应该是 3，终端将显示“总和为
    3”（The sum is 3）。尝试几个不同的数字，看看会发生什么。看看你是否可以修改脚本并将其重命名为 multiplication（乘法）和 subtraction（减法）。


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_70_2.png)


    - **步骤 8** 让我们进一步扩展。创建一个名为 `greetings.sh` 的新脚本。按照下图截图输入脚本内容，保存它并使用 `chmod` 命令使其可执行。你可以看到脚本现在有一些新的添加内容。


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_70_3.png)


    - **步骤 9** 我们在这里给 echo 命令添加了 `-n`，这将使光标停留在与问题相同的行上，而不是新的一行。`read` 命令将用户的输入存储为变量
    `firstname` 和 `surname`，以便在最后一行 echo 中稍后读取。而 `clear` 命令用于清屏。


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_70_4.png)


    - **步骤 10** 作为最后的添加，让我们包含上一节中使用的日期变量。修改脚本的最后一行如下：`echo Hello $firstname $surname,
    how are you on this fine day $(date +%A)?`。输出应显示当前星期几，通过从系统变量调用实现。


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_70_5.png)


    ## 创建 Bash 脚本 – 第三部分


    在前面的页面中，我们介绍了一些非常基础的 Bash 脚本编写，包括向屏幕输出文本、获取用户输入、存储该输出并再次输出到屏幕；以及使用 Date 命令包含系统变量。现在让我们结合你目前已掌握的内容，并引入循环（Loops）。


    ### IF, THEN, ELSE（如果、那么、否则）


    在大多数编程结构中，迟早会需要你循环执行已输入的命令，以创建更好的功能，最终实现更好的程序。


    - **步骤 1** 让我们现在看看 If、Then 和 Else 语句，当正确执行时，它们会比对一组指令，并简单地判断：如果某事物存在，那么执行某操作，否则执行不同的操作。创建一个名为
    `greeting2.sh` 的新脚本，并将下方截图中的文本输入其中。


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_71_0.png)


    - **步骤 2** `greeting2.sh` 是 `greeting.sh` 的副本，但略有不同。在这里，我们添加了一个从 if 语句开始的循环。这意味着，如果输入的变量等于
    David，那么下一行，即 THEN（那么），是对所发生情况的响应，在这种情况下，它将在屏幕上输出“Awesome name”（很棒的名字），随后是变量（即
    David）。


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_71_1.png)


    - **步骤 3** 下一行 ELSE（否则），是当变量不等于 ''David'' 时发生的情况。在这种情况下，它只是向屏幕输出熟悉的“Hello...”（你好……）。最后一行，FI
    语句，是结束循环的命令。如果你有 if 命令但没有 FI 命令，就会得到错误。


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_71_2.png)


    - **步骤 4** 你显然可以对这个脚本进行一些调整，更改触发响应的名字变量，或者甚至发出一个响应，其中名字和姓氏变量匹配某个特定变量。


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_71_3.png)


    ### 更多循环


    你可以使用 FOR、WHILE 和 UNTIL 语句对数据进行循环。如果你正在批量命名、复制或运行需要计数器的脚本，这些语句会很有用。


    - **步骤 1** 创建一个名为 count.sh 的新脚本。输入下方截图中的文本，保存它并使其可执行。这会创建变量 ''count''，在脚本开始时它等于零。然后开始
    WHILE 循环，只要 count 小于（即 LT 部分）100，就会在 echo 命令中打印 count 的当前值。


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_72_0.png)


    - **步骤 2** 执行 count.sh 脚本将导致数字 0 到 99 列在终端屏幕上；当它达到 100 时，脚本将结束。使用 FOR 语句修改脚本，使其工作方式大致相同。要在我们的脚本中使用它，请将截图中的文本输入到
    count.sh 脚本中。


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_72_1.png)


    - **步骤 3** 我们在这里的添加是：`for count in {0..100}; do`，意思是对于变量 ''count''，在从 0 到 100
    的数字范围内，然后开始循环。脚本的其余部分相同。运行此脚本，终端中应出现相同的输出。


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_72_2.png)


    - **步骤 4** UNTIL 循环的工作方式与 WHILE 循环大致相同，只是通常方向相反。因此，使用 UNTIL 循环计数到 100，应该是：`until
    [ $count -gt 100 ]; do`。区别在于，直到 count 大于（即 gt 部分）一百，才停止循环。


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_72_3.png)


    - **步骤 5** 你并不局限于从 0 到 100 的数字。你可以在循环中拥有任何一组你想执行的命令，并让循环运行你想要的次数。例如，重命名一百万个文件，创建五十个文件夹等。例如，使用
    FOR 循环，此脚本将创建 10 个名为 folder1 到 folder10 的文件夹。


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_72_4.png)


    - **步骤 6** 再次使用 FOR 语句，我们可以通过操作 `(0..100)` 部分来执行计数序列。代码的这一部分实际上意味着 `[开始..结束..增量]`，如果没有增量，那么它只是单数字递增直到结束。例如，我们可以使用以下命令让循环以
    2 为增量计数到 1000：`for count in {0..1000..2}; do`。


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_72_5.png)


    '
