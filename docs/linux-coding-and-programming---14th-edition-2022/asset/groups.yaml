    # Install Apps via the

    Terminal – Part 1


    There are different ways to install apps and programs on Linux. You can opt for
    the graphical route, using a Software Manager, or you can use the Terminal. Often,
    the Terminal provides better control over the software being installed and sometimes,
    you have no choice in the matter.


    # COMMAND LINE INSTALLS


    Installing an app with the Terminal may require some nifty keyboard work but you
    get a better sense of what’s being installed and where.


    +   **STEP 1** Installing apps form the Terminal is often relatively simple. First
    though, you need to make sure that the system is up to date. To do this open up
    the Terminal and enter: `sudo apt-get update && sudo apt-get upgrade`. Enter your
    password and accept any necessary updates.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_49_0.png)


    +   **STEP 2** Just as you’ve seen, sudo apt-get update/upgrade and so on are
    designed to upgrade the software that’s already installed on the system. How do
    you install more apps though? It just so happens that it’s extraordinarily simple.
    First you need an app to install, so let’s use Stella again. Enter: `sudo apt-get
    install stella`.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_49_1.png)


    +   **STEP 3** You need to enter y to confirm the installation, which takes up
    around 5.5MB of storage in the system. Once Stella is installed, you can see again
    that Mint has automatically created the Games category in the Menu as well as
    the app shortcut.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_49_2.png)


    +   **STEP 4** Sometimes, when installing software, you need to add the app’s
    Repository. The repository, or repo, is simply the remote server location where
    the software is held, along with all its dependencies (the vital libraries and
    such it needs to function). Start by typing in this: `sudo add-apt-repository
    ppa:peterlevi/ppa`. Press Enter when asked to add and the PPA (Personal Package
    Archive).


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_49_3.png)'
  - '[PAGE 50]


    # Install Apps via the Terminal – Part 1


    # STEP 5


    This adds the repo for the app Variety Wallpaper Changer, an Ubuntu-based app
    that works in Mint and changes the wallpaper automatically. Now that the repo
    is added, enter: sudo apt-get update, to update the new information and add the
    contents of the repo to the package database.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_50_0.png)


    # STEP 6


    Now to install Variety, enter: sudo apt-get install variety. Press y to confirm
    and accept the installation, and to continue with the install. Once installed,
    you can type variety in the Terminal to run the app.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_50_1.png)


    # REMOVING APPS


    In addition to installing apps, the apt command can also be used to remove any
    apps and helps keep the system tidy and free up resources.


    # STEP 1


    To uninstall, or remove, the Variety app enter the following: sudo apt-get remove
    variety. Enter y to continue with the uninstall of the app; notice also that you''re
    informed of how much space you''re freeing up on the hard drive as a result of
    removing the app.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_50_2.png)


    # STEP 3


    When you remove apps from the system you''re informed that some packages that
    were automatically installed are no longer required. You already saw in the previous
    tutorial, you can tidy things up with the following command: sudo apt-get autoremove,
    followed by pressing y to accept the process.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_50_3.png)


    # STEP 2


    While the ''apt-get remove'' command uninstalls an app, it doesn''t get rid of
    the extra clutter that comes with an app, such as configuration and library files.
    To completely remove the clutter, enter: sudo apt-get purge variety.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_50_4.png)


    # STEP 4


    Finally, to tidy up all the non-used packages in the system, and to remove elements
    that the autoremove command didn''t, you can enter: sudo apt-get autoclean. These
    last few steps are vital for keeping your Linux Mint setup in good working order
    and to trim off the unnecessary excess caused by installations and upgrades.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_50_5.png)'
  - '[PAGE 51]


    # # Install Apps via the Terminal – Part 2


    Most of the time you''ll get to install apps from the Terminal using the standard
    apt-get command. However, sometimes an app demands a little more work. This means
    installing an app from its source code, which isn''t as scary as it first sounds.


    # ## FROM THE SOURCE


    The commands you''ll need to become familiar with here are Configure, Make and
    Install. You''ll find a lot of apps use installing from source, so it''s certainly
    a skill worth investing time in.


    +   **STEP 1** Source code files for Linux usually come in the form of .TAR.GZ
    or .TAR.BZ2. Both are compressed files holding all the core files needed to ''make''
    the app. Start off this tutorial by creating a new folder in Home: `mkdir Vim`.


    +   **STEP 3** The wget command retrieves content from the internet, in this case
    the .BZ2 file for Vim. To check the file was downloaded successfully, enter: ls.
    According to Mint''s file system colour key, the compressed file should be displayed
    in red.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_51_0.png)


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_51_1.png)


    +   **STEP 2** Vim, by the way, is an advanced text editor which we''ll use as
    an example to install. Enter the new folder, cd Vim, then from within the new
    Vim folder, enter the following command into the Terminal: `wget ftp://ftp.vim.org/pub/vim/_unix/vim-7.4.tar.bz2`.


    +   **STEP 4** We need to uncompress the contents of the file now, so enter: `tar
    -xf vim-7.4.tar.bz2` into the Terminal. Note: you can type in tar -xf v and press
    the Tab key to auto-fill the remaining file name.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_51_2.png)


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_51_3.png)'
  - '[PAGE 52]


    # STEP 5


    If you enter `ls` again, you’ll notice that a new folder has been created: `vim74`;
    in light blue text representing a folder in Mint. It’s always handy to create
    root folders for the main app, then as you upgrade apps through this method the
    individual versions will each have their own folder.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_52_0.png)


    # STEP 6


    Type in `cd vim74` to enter the folder, and `ls` again to view its contents. There
    will likely be a fair number of files present; most are app’s core files, while
    others will be labelled **README** or **INSTALL**. It’s wise to read these files
    first as they provide valuable information regarding the installation.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_52_1.png)


    # STEP 7


    The first part of the installation requires you to enter `./configure`. The `./configure`
    command will check your system for any missing dependencies associated with the
    app. If you received an error regarding a C Compiler, then enter: `sudo apt-get
    install build-essential`. The third-party app Ncurses was recorded as missing.
    We need to install that with: `sudo apt-get install libncurses5-dev libncursesw5-dev`.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_52_2.png)


    # STEP 8


    You may need to keep installing new dependencies, as installed, depending on the
    app. After each new dependency is installed, re-run `./configure` and when it
    doesn’t report back an error you can continue to the next stage of the installation.
    Note: you may need to search online for some error messages.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_52_3.png)


    # STEP 9


    With a successful `./configure`, the system will create a **Makefile**. This needs
    to be ‘made’ by entering: **make** into the Terminal. This may take a while, depending
    on the size of the app.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_52_4.png)


    # STEP 10


    Finally, you need to enter: `sudo make install` into the Terminal. This will install
    the app, and make it ready for use in the system. When complete you can execute
    the app, in this case by entering **vim** into the Terminal or searching for it
    via the Dash.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_52_5.png)'
