    \ 6** With block comments, it's good practice in C++ to add an asterisk to each\
    \ new line of the comment block. This also helps you to remember to close the\
    \ comment block off before continuing with the code:\n\n```cpp\n/* This comment\
    \ can\n * cover several lines\n * without the need to add more slashes */\n```\n\
    \nThankfully, Geany does this automatically but be aware of it when using other\
    \ IDEs.\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_130_5.png)\n\n# Variables\n\
    \nVariables differ slightly when using C++ as opposed to Python. In Python, you\
