    \ too quickly. So take coding in small pieces and take your time.\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_143_0.png)\n\
    \n### EASY VARIABLES\n\nMeaningful naming for variables is a must to eliminate\
    \ common coding mistakes. Having letters of the alphabet is fine but what happens\
    \ when the code states there's a problem with x variable. It's not too difficult\
    \ to name variables lives, money, player! and so on.\n\n```js\n1. var points =\
    \ 1023;  \n2. var lives = 3;  \n3. var totalTime = 45;  \n4. write(\"Points: \"\
    \ + points);  \n5. write(\"lives: \" + lives);  \n6. write(\"Total Time: \" +\
    \ totalTime + \" sec\");  \n7. write(\"----------...--\n```\n\n### //COMMENTS\n\
    \nUse comments. It's a simple concept but commenting on your code saves so many\
    \ problems when you next come to look over it. Inserting comment lines helps you\
    \ quickly sift through the sections of code that are causing problems, also useful\
    \ if you need to review an older piece of code.\n\n```c\n22. orig == 0;  \n23.\
    \ target = 2;  \n--  \n24.  \n25. @endif  \n26. if (n == 0)  \n27.     return;\
    \  \n28.  \n29. //  \n30. // Loop unrolling.  \n...  \n34. // (n & (-3)) is the\
    \ greatest multiple of 4 less than n.  \n35. // In the while loop ahead, orig\
    \ will move to  \n36. // increments (4 elements of 2 bytes).  \n37. // end marks\
    \ our barrier for not falling into  \n38. char const * const end = orig + 2 *\
    \ (n & (-3))  \n39. // See if we're aligned for writing in 64 or  \n40. #if SIZEOF_LONG\
    \ == 8  \n41. #define( end8 ) || defined ( x86_64\n```\n\n### PLAN AHEAD\n\nWhile\
    \ it's great to wake up one morning and decide to code a classic text adventure,\
    \ it's not always practical without a good plan. Small snippets of code can be\
    \ written without too much thought and planning but longer and more in-depth code\
    \ requires a good working plan to stick to and help iron out the bugs.\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_143_1.png)\n\
    \n### USER ERROR\n\nUser input is often a paralysing mistake in code. For example,\
    \ when the user is supposed to enter a number for their age and instead they enter\
    \ it in letters. Often a user can enter so much into an input that it overflows\
    \ some internal buffer, thus sending the code crashing. Watch those user inputs\
    \ and clearly state what's needed from them.\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_144_0.png)\n\
    \n### RE-INVENTING WHEELS\n\nYou can easily spend days trying to fathom out a\
    \ section of code to achieve a given result, and it's frustrating and often time-wasting.\
    \ While it's equally rewarding to solve the problem yourself, often the same code\
    \ is out there on the Internet somewhere. Don't try and re-invent the wheel, look\
    \ to see if someone else has done it first.\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_144_1.png)\n\
    \n### HELP!\n\nAsking for help is something most of us have struggled with in\
    \ the past. Will the people we're asking laugh at us? Am I wasting everyone's\
    \ time? It's a common mistake for someone to suffer in silence. However, as long\
    \ as you ask for help in the correct manner, obey any forum rules and be polite,\
    \ then your question isn't silly.\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_144_2.png)\n\
    \n### BACKUPS\n\nAlways make a backup of your work, with a secondary backup for\
    \ any changes you've made. Mistakes can be rectified if there's a good backup\
    \ in place to revert to for those times when something goes wrong. It's much easier\
    \ to start where you left off, rather than starting from the beginning again.\n\
    \n![](img/d501697c83491ed0bb4b382b0d28ef0a_144_3.png)\n\n### SECURE DATA\n\nIf\
    \ you're writing code to deal with usernames and passwords, or other such sensitive\
    \ data, then ensure that the data isn't in cleartext. Learn how to create a function\
    \ to encrypt sensitive data, prior to feeding into a routine that can transmit\
    \ or store it where someone may be able to view it.\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_144_4.png)\n\
    \n### MATHS\n\nIf your code makes multiple calculations then you need to ensure\
    \ that the maths behind it is sound. There are thousands of instances where programs\
    \ have offered incorrect data based on poor Mathematical coding, which can have\
    \ disastrous effects depending on what the code is set to do. In short, double\
    \ check your code equations.\n\n```cpp\nint x = y + z; // 10\n\nint main(int a,\
    \ int b, int c, int d, int e, int f, int g, int h, int i, int j) {\n\n    // 500\
    \ + 5\n    // 500 - 1225\n    // 12\n\n    int result = a + b - c * d / e + f\
    \ - g * h + i - j;\n\n    if (result > 500) {\n      result = 100;\n    }\n\n\
    \    cout << result;\n    return 0;\n}\n```\n"
  mdcn: "\n## 用户交互\n\n**第 5 步** 主要原理与之前的代码相同。用户的输入（他们的名字）被存储在一个字符串中，因为它包含多个字符，并在第二条\
    \ cout 语句中获取。只要变量名不变，你就可以在代码的任何地方召回它。\n\n```cpp\n// Output\nHello, David. I hope\
    \ you're well today.\n\nProgram ended with code: 0\nPress return to continue\n\
    ```\n\n**第 6 步** 你可以向用户链接多个输入请求，但首先要确保你有一个有效的变量来存储输入。让我们假设你希望用户输入两个整数：\n\n```cpp\n\
    #include <iostream>\nusing namespace std;\n\nint main()\n{\n    int num1, num2;\n\
    \n    cout << \"Enter two whole numbers: \";\n    cin >> num1 >> num2;\n\n   \
    \ cout << \"You entered \" << num1 << \" and \" << num2 << \"\\n\";\n\n}\n```\n\
    \n![](img/d501697c83491ed0bb4b382b0d28ef0a_140_0.png)\n\n**第 7 步** 同样，一旦你将数据存储在变量中，就可以对其进行操作。例如，要求用户输入两个数字并对它们进行数学运算：\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\n\nint main()\n{\n    float\
    \ num1, num2;\n\n    cout << \"Enter two numbers: \";\n    cin >> num1 >> num2;\n\
    \n    cout << num1 << \"+\" << num2 << \" is: \" << num1 + num2 << \"\\n\";\n\
    }\n```\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_140_1.png)\n\n**第 8 步** 虽然\
    \ cin 在大多数输入任务中表现良好，但它确实存在局限性。Cin 始终将空格视为终止符，因此它旨在处理单个单词，而不是多个单词。然而，getline 以\
    \ cin 作为第一个参数，变量作为第二个参数：\n\n```cpp\n#include <iostream>\nusing namespace std;\n\
    \nint main()\n{\n    string mystr;\n\n    cout << \"Enter a sentence: \\n\";\n\
    \    getline(cin, mystr);\n\n    cout << \"Your sentence is: \" << mystr.size()\
    \ << \" characters long\\n\";\n}\n```\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_140_2.png)\n\
    \n**第 9 步** 编译并执行代码，然后输入一个包含空格和字符的句子。完成后，代码会读取字符数。如果你删除 getline 行并将其替换为 cin >>\
    \ mystr 再试一次，结果将显示到第一个空格之前的字符数。\n\n**第 10 步** Getline 通常是初学 C++ 的程序员容易忘记包含的命令。当你无法弄清楚为什么代码不工作时，终止空白字符很让人烦恼。简而言之，最好在未来使用\
    \ getline(cin, variable)：\n\n```cpp\n#include <iostream>\nusing namespace std;\n\
    \nint main()\n{\n    string name;\n\n    cout << \"Enter your full name: \\n\"\
    ;\n    getline(cin, name);\n\n    cout << \"Hello, \" << name << \"\\n\";\n}\n\
    ```\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_140_3.png)\n\n## 霍比特人\n\n**你知道吗……**\
    \ 1982 年为各种平台发布的《霍比特人》是墨尔本之家（Melbourne House）的一件天才编程作品。由 Philip Mitchell 和 Dr.\
    \ Veronika Megler 开发，《霍比特人》使用了名为 \"Inglish\" 的解析器进行独特编码，允许玩家输入完整的句子，例如\"从甘道夫处取剑，并用它杀死哥布林。\"\
    \n\n角色会随之带走。此外，在游戏的早期版本中，非玩家角色经常在地图上移动，甚至在玩家到达该关卡之前就会捕获并杀死彼此。甚至还有一个随机化事件，涉及来自任何地点的随机对象。这意味着，潜在地，托尔金（Thorin）可能会在整个冒险过程中把你捡起来并携带你。对于占用少于\
    \ 39KB 内存的游戏来说，这非常出色。\n\n此外，游戏中的每个对象都有特定的尺寸、重量和坚固度；因此，如果你坐在凳子上，而有人捡起凳子或扔凳子，那么你的\n\
    \n![](img/d501697c83491ed0bb4b382b0d28ef0a_141_0.png)\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_142_0.png)\n\
    \n《霍比特人》：1982 年先进编程的奇迹。\n\n## 常见编码错误\n\n当你开始新事物时，不可避免地会犯错，这纯粹是由于缺乏经验，而这些错误本身就是极好的老师。然而，即使是专家偶尔也会出错。关键在于，尽可能从中学习。\n\
    \n### X=错误，打印 Y\n\n程序员需要注意的陷阱有很多，多得无法在此一一列出。能够识别错误并修复它，标志着你开始进入更高级的领域，成为一名更好的编码者。每个人都会犯错，即使是拥有三十多年经验的编码者也会如此。从这些基本的常见错误中学习有助于建立更好的编码基础。\n\
    \n### 小块\n\n如果能像《黑客帝国》电影中的 Neo 那样工作那就太好了。只需提问，你的操作员就会将其加载到你的内存中，你瞬间就会知道关于该主题的一切。遗憾的是，我们做不到这一点。第一个主要陷阱是某人试图学得太多、太快。所以要小块地学习编码，并慢慢来。\n\
    \n![](img/d501697c83491ed0bb4b382b0d28ef0a_143_0.png)\n\n### 简单变量\n\n为变量赋予有意义的名称是消除常见编码错误的必要条件。使用字母表中的字母没问题，但如果代码指出\
    \ x 变量有问题，会发生什么？给变量命名为 lives、money、player 等并不难。\n\n```js\n1. var points = 1023;\
    \  \n2. var lives = 3;  \n3. var totalTime = 45;  \n4. write(\"Points: \" + points);\
    \  \n5. write(\"lives: \" + lives);  \n6. write(\"Total Time: \" + totalTime +\
    \ \" sec\");  \n7. write(\"----------...--\n```\n\n### //注释\n\n使用注释。这是一个简单的概念，但给你的代码添加注释能在下次回顾代码时避免很多问题。插入注释行有助于你快速筛选出导致问题的代码部分，如果需要审阅较旧的代码，这也很有用。\n\
    \n```c\n22. orig == 0;  \n23. target = 2;  \n--  \n24.  \n25. @endif  \n26. if\
    \ (n == 0)  \n27.     return;  \n28.  \n29. //  \n30. // Loop unrolling.  \n...\
    \  \n34. // (n & (-3)) is the greatest multiple of 4 less than n.  \n35. // In\
    \ the while loop ahead, orig will move to  \n36. // increments (4 elements of\
    \ 2 bytes).  \n37. // end marks our barrier for not falling into  \n38. char const\
    \ * const end = orig + 2 * (n & (-3))  \n39. // See if we're aligned for writing\
    \ in 64 or  \n40. #if SIZEOF_LONG == 8  \n41. #define( end8 ) || defined ( x86_64\n\
    ```\n\n### 提前规划\n\n虽然某天早上醒来决定要编写一个经典文本冒险游戏很棒，但没有良好的计划并不总是可行的。小片段的代码可以不经过太多思考和规划就能编写，但更长、更深入的代码需要一个良好的工作计划来遵循并帮助消除\
    \ bug。\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_143_1.png)\n\n### 用户错误\n\n\
    用户输入通常是代码中一个瘫痪性的错误。例如，当用户应该输入年龄的数字时，却输入了字母。通常用户可以在输入中放入太多内容，导致内部缓冲区溢出，从而使代码崩溃。密切关注那些用户输入，并清楚地说明需要他们提供什么。\n\
    \n![](img/d501697c83491ed0bb4b382b0d28ef0a_144_0.png)\n\n### 重新发明轮子\n\n你可能会轻松花几天时间试图弄懂一段代码以达到特定结果，这既令人沮丧又常常浪费时间。虽然自己解决问题同样有回报，但通常互联网上某处已经有相同的代码。不要试图重新发明轮子，先看看是否有人已经做到了。\n\
    \n![](img/d501697c83491ed0bb4b382b0d28ef0a_144_1.png)\n\n### 求助！\n\n寻求帮助是我们大多数人过去都曾挣扎过的事情。我们询问的人会不会嘲笑我们？我是否在浪费所有人的时间？默默地忍受是常见的错误。然而，只要你以正确的方式寻求帮助，遵守任何论坛规则并保持礼貌，那么你的问题就不愚蠢。\n\
    \n![](img/d501697c83491ed0bb4b382b0d28ef0a_144_2.png)\n\n### 备份\n\n始终备份你的工作，并为所做的任何更改制作次要备份。如果有良好的备份可以回滚，错误就可以纠正，以防某些事情出错。从你上次留下的地方开始要容易得多，而不是重新开始。\n\
    \n![](img/d501697c83491ed0bb4b382b0d28ef0a_144_3.png)\n\n### 数据安全\n\n如果你编写的代码处理用户名和密码或其他此类敏感数据，请确保数据不是明文。学习如何创建函数来加密敏感数据，然后再将其输入到可能传输或存储到他人可以查看的地方的例程中。\n\
    \n![](img/d501697c83491ed0bb4b382b0d28ef0a_144_4.png)\n\n### 数学\n\n如果你的代码进行多次计算，你需要确保背后的数学是可靠的。有成千上万的实例表明，程序基于糟糕的数学编码提供了错误的数据，这可能会根据代码设置的功能产生灾难性的影响。简而言之，双重检查你的代码公式。\n\
    \n```cpp\nint x = y + z; // 10\n\nint main(int a, int b, int c, int d, int e,\
    \ int f, int g, int h, int i, int j) {\n\n    // 500 + 5\n    // 500 - 1225\n\
    \    // 12\n\n    int result = a + b - c * d / e + f - g * h + i - j;\n\n    if\
    \ (result > 500) {\n      result = 100;\n    }\n\n    cout << result;\n    return\
    \ 0;\n}\n```\n"
