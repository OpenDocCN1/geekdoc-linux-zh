    \  ![](img/d501697c83491ed0bb4b382b0d28ef0a_112_0.png)\n  ![](img/d501697c83491ed0bb4b382b0d28ef0a_112_1.png)\n\
    \n### 循环（LOOPS）\n\n循环看起来与条件非常相似，但它们的操作方式有所不同。循环会多次运行相同的代码块，通常由条件提供支持。\n\n- **步骤\
    \ 1** 让我们从一个简单的 While 语句开始。与 if 一样，这将检查某事是否为 TRUE，然后运行缩进的代码。\n  ```python\n  x\
    \ = 1\n  while x < 10:\n      print (x)\n      x = x + 1\n  ```\n  ![](img/d501697c83491ed0bb4b382b0d28ef0a_112_2.png)\n\
    \n- **步骤 2** if 和 while 的区别在于，当 while 到达缩进代码的末尾时，它会返回并检查语句是否仍然为真。在我们的例子中，x 小于\
    \ 10。在每次循环中，它打印 x 的当前值，然后为该值加一。当 x 最终等于 10 时，它会停止。\n  ![](img/d501697c83491ed0bb4b382b0d28ef0a_112_4.png)\n\
    \n- **步骤 3** For 循环是另一个例子。For 用于循环遍历数据范围，通常是一个存储在方括号内的变量列表。例如：\n  ```python\n\
    \  words=[\"Cat\", \"Dog\", \"Umbrella\"]\n  for word in words:\n      print (word)\n\
    \  ```\n  ![](img/d501697c83491ed0bb4b382b0d28ef0a_112_3.png)\n\n- **步骤 4** For\
