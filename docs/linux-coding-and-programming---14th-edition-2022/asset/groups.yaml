    enter: `sudo apt-get install build-essential`. The third-party app Ncurses was
    recorded as missing. We need to install that with: `sudo apt-get install libncurses5-dev
    libncursesw5-dev`.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_52_2.png)


    - **Step 8** You may need to keep installing new dependencies, as installed, depending
    on the app. After each new dependency is installed, re-run `./configure` and when
    it doesn’t report back an error you can continue to the next stage of the installation.
    Note: you may need to search online for some error messages.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_52_3.png)


    - **Step 9** With a successful `./configure`, the system will create a **Makefile**.
    This needs to be ‘made’ by entering: **make** into the Terminal. This may take
    a while, depending on the size of the app.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_52_4.png)


    - **Step 10** Finally, you need to enter: `sudo make install` into the Terminal.
    This will install the app, and make it ready for use in the system. When complete
    you can execute the app, in this case by entering **vim** into the Terminal or
    searching for it via the Dash.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_52_5.png)

