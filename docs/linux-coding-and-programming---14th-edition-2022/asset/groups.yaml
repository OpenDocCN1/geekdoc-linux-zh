    # # Creating Bash Scripts – Part 2


    Previously we looked at creating your first Bash script, Hello World, and adding
    a system variable. Now you can expand these and see what you can do when you start
    to play around with creating your own unique variables.


    # ## VARIABLES


    Just as in every other programming language a Bash script can store and call certain
    variables from the system, either generic or user created.


    +   **STEP 1**  Let''s start by creating a new script called hello.sh; `xed hello.sh.`
    In it enter: `#!/bin/bash,` then, `echo Hello $1.` Save the file and exit Xed.
    Back in the Terminal make the script executable with: `chmod +x hello.sh`.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_69_0.png)


    +   **STEP 3**  The output now will be Hello David. This is because Bash automatically
    assigns variables for the user, which are then held and passed to the script.
    So the variable ''$1'' now holds ''David''. You can change the variable by entering
    something different: `./hello.sh Mint.`


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_69_1.png)


    +   **STEP 2**  As the script is now executable, run it with `./hello.sh.` Now,
    as you probably expected a simple ''Hello'' is displayed in the Terminal. However,
    if you then issue the command with a variable, it begins to get interesting. For
    example, try `./hello.sh David`.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_69_2.png)


    +   **STEP 4**  You can even rename variables. Modify the hello.sh script with
    the following: `firstName=$1,` `surname=$2,` `echo Hello $firstname $surname.`
    Putting each statement on a new line. Save the script and exit back into the Terminal.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_69_3.png)'
