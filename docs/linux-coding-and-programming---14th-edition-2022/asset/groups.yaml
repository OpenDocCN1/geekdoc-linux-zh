    \      print(randint(1, 25))\n  ```\n  ![](img/d501697c83491ed0bb4b382b0d28ef0a_114_3.png)\n\
    \n- **步骤 10** 这有助于创建更简化的编程方法。你还可以使用 import module*，这将导入命名模块中定义的所有内容。然而，这通常被视为浪费资源，但尽管如此它仍然有效。最后，模块可以导入为别名：\n\
