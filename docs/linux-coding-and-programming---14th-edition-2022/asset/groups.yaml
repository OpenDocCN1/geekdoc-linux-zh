    \n- **STEP 5** Close the command prompt or Terminal and relaunch the IDLE Shell.\
    \ When you now enter: `import pygame`, the module will be imported into the code\
    \ without any problems. You’ll find that most code downloaded or copied from the\
    \ Internet will contain a module import; mainstream or unique, these are usually\
    \ the source of errors in execution due to them being missing.\n  ![](img/d501697c83491ed0bb4b382b0d28ef0a_114_0.png)\n\
    \n- **STEP 6** The modules contain the extra code needed to achieve a certain\
