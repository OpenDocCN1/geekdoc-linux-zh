    \ the installation process, ensure the 'Erase disk and install Linux...' option\
    \ is selected. NOTE: This completely wipes Windows 10 from your computer, so make\
    \ sure you have backups of all your personal files and data.\n\n- **STEP 4** \
    \ \n  Before the installation process begins, you're asked if the choice you made\
