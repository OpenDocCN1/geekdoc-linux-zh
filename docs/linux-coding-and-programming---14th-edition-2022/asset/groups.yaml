    ![](img/d501697c83491ed0bb4b382b0d28ef0a_86_0.png)


    ## Why Python?


    There are many different programming languages available for the modern computer,
    and some still available for older 8 and 16-bit computers too. Some of these languages
    are designed for scientific work, others for mobile platforms and such. So why
    choose Python out of all the rest?


    ### PYTHON POWER


    Ever since the earliest home computers were available, enthusiasts, users and
    professionals have toiled away until the wee hours, slaving over an overheating
    heap of circuitry to create something akin to magic.


    These pioneers of programming carved their way into a new frontier, forging small
    routines that enabled the letter "A" to scroll across the screen. It may not sound
    terribly exciting to a generation that''s used to ultra high-definition graphics
    and open world, multiplayer online gaming. However, forty-something years ago
    it was blindingly brilliant.


    Regardless of whether you use an Android device, iOS device, PC, Mac, Linux, Smart
    TV, games console, MP3 player, GPS device built-in to a car, set-top box or a
    thousand other connected and ''smart'' appliances, behind them all is programming.


    Naturally these bedroom coders helped form the foundations for every piece of
    digital technology we use today. Some went on to become chief developers for top
    software companies, whereas others pushed the available hardware to its limits
    and founded the billion pound gaming empire that continually amazes us.


    All those aforementioned digital devices need instructions to tell them what to
    do, and allow them to be interacted with. These instructions form the programming
    core of the device and that core can be built using a variety of programming languages.


    The languages in use today differ depending on the situation, the platform, the
    device''s use and how the device will interact with its environment or users.
    Operating systems, such as Windows, macOS and such are usually a combination of
    C++, C#, assembly and some form of visual-based language. Games generally use
    C++ whilst web pages can use a plethora of available languages such as HTML, Java,
    Python and so on.


    More general-purpose programming is used to create programs, apps, software or
    whatever else you want to call them. They’re widely used across all hardware platforms
    and suit virtually every conceivable application. Some operate faster than others
    and some are easier to learn and use than others, so one such general-purpose
    language.


    Python is what’s known as a High-Level Language, in that it ‘talks’ to the hardware
    and operating system using a variety of arrays, variables, objects, arithmetic,
    subroutines, loops and countless more interactions. Whilst it’s not as streamlined
    as a Low-Level Language, which can deal directly with memory addresses, call stacks
    and registers, its benefit is that it’s universally accessible and easy to learn.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_88_0.png)


    **Java is a powerful language that’s used in web pages, set-top boxes, TVs and
    even cars.**


    Python was created over twenty six years ago and has evolved to become an ideal
    beginner’s language for learning how to program a computer. It’s perfect for the
    hobbyist, enthusiast, student, teacher and those who simply need to create their
    own unique interaction between either themselves or a piece of external hardware
    and the computer itself.


    Python is free to download, install and use and is available for Linux, Windows,
    macOS, DOS/OS, OS/2, BeOS, IBM i-series machines, and even RISC OS. It has been
    voted one of the top five programming languages in the world and is continuously
    evolving ahead of the hardware and internet development curve.


    So to answer the question: why Python? Simply put, it’s free, easy to learn, exceptionally
    powerful, universally accepted, effective and a superb learning and educational
    tool.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_88_1.png)


    **Python is a more modern take on BASIC, it’s easy to learn and makes for an ideal
    beginner’s programming language.**


    ## How to Set Up Python in Linux


    While the Raspberry Pi’s operating system contains the latest, stable version
    of Python, other Linux distros don’t come with Python 3 preinstalled. If you’re
    not going down the Pi route, then here’s how to check and install Python for Linux.


    ### PYTHON PENGUIN


    Linux is such a versatile operating system that it’s often difficult to nail down
    just one way of doing something. Different distributions go about installing software
    in different ways, so we’re sticking with Linux Mint for this particular tutorial.


    **STEP 1**

    First you need to ascertain which version of Python is currently installed in
    your Linux system. To begin with, drop into a Terminal session from your distro’s
    menu or hit the Ctrl+Alt+T keys.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_89_0.png)


    **STEP 2**

    Next enter `python --version` into the Terminal screen. You should have the output
    relating to version 2.x of Python in the display. By default, most Linux distros
    come with both Python 2 and 3, as there’s plenty of code out there still available
    for Python 2. Now enter: `python3 --version`.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_89_1.png)


    **STEP 3**

    In our case we have both Python 2 and 3 installed, as long as Python 3.x is installed,
    then the code in our tutorials will work. It’s always worth checking to see if
    the distro has been updated with the latest versions, so enter: `sudo apt-get
    update && sudo apt-get upgrade` to update the system.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_89_2.png)


    **STEP 4**

    Once the update and upgrade completes, enter: `python3 --version` again to see
    if Python 3.x is updated or even installed; as long as you have Python 3.x, you’re
    running the most recent major version. The numbers after the 3, indicate patches
    and further updates. Often they’re unnecessary but can contain vital new elements.


