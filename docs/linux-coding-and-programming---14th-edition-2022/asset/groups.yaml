    \n我们之前提到过模块（Math 模块），但由于模块是从 Python 中获得最大收益的重要组成部分，值得多花一点时间了解它们。在此处，我们使用的是 Windows\
    \ 版本的 Python 3。\n\n### 掌握模块（MASTERING MODULES）\n\n将模块视为导入到你的 Python 代码中以增强和扩展其功能的扩展。有\
    \ countless 个可用的模块，正如我们所见，你甚至可以制作自己的。\n![](img/d501697c83491ed0bb4b382b0d28ef0a_113_0.png)\n\
    \n- **步骤 1** 虽然很好，但 Python 内置函数有限。然而，使用模块允许我们制作更复杂的程序。如你所知，模块是被导入的 Python 脚本，例如\
    \ import math。\n\n- **步骤 2** 一些模块，特别是在 Raspberry Pi 上，是默认包含的，Math 模块就是一个主要例子。不幸的是，其他模块并不总是可用的。在非\
    \ Pi 平台上，Pygame 模块就是一个很好的例子，它包含许多有助于创建游戏的函数。尝试：`import pygame`。\n\n- **步骤 3**\
    \ 结果是 IDLE Shell 中的错误，因为 Pygame 模块在 Python 中不被识别或未安装。要安装模块，我们可以使用 Pip（Pip Installs\
    \ Packages）。关闭 IDLE Shell 并进入命令提示符或终端会话。在提升的管理员命令提示符中，输入：`pip install pygame`\n\
    \  ![](img/d501697c83491ed0bb4b382b0d28ef0a_113_1.png)\n  ![](img/d501697c83491ed0bb4b382b0d28ef0a_113_2.png)\n\
    \n- **步骤 4** Pip 安装需要提升状态，因为 Pip 在不同位置安装组件。Windows 用户可以通过“开始”按钮搜索 CMD，右键单击结果，然后单击“以管理员身份运行”。Linux\
    \ 和 Mac 用户可以使用 sudo 命令，使用 `sudo pip install pygame`。\n  ![](img/d501697c83491ed0bb4b382b0d28ef0a_113_3.png)\n\
    \n- **步骤 5** 关闭命令提示符或终端，并重新启动 IDLE Shell。当你现在输入：`import pygame` 时，模块将毫无问题地被导入到代码中。你会发现，从互联网下载或复制的大多数代码都包含模块导入；无论是主流的还是独特的，这些通常是执行过程中错误的根源，因为它们缺失。\n\
    \  ![](img/d501697c83491ed0bb4b382b0d28ef0a_114_0.png)\n\n- **步骤 6** 模块包含在之前实验中实现的特定结果所需的额外代码。例如：`import\
    \ random` 引入了随机数生成器模块的代码。然后你可以使用此模块创建如下内容：\n  ```python\n  for i in range(10):\n\
    \      print(random.randint(1, 25))\n  ```\n  ![](img/d501697c83491ed0bb4b382b0d28ef0a_114_2.png)\n\
