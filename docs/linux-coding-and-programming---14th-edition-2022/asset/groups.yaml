    ## 用户交互\n\n没有什么比创建一个能与你互动的程序更令人满足的了。这种基本的用户交互是任何语言教学中最常讲授的方面之一，借助它，你可以做的远不止按名字问候用户那么简单。\n\
    \n### 你好，戴夫\n\n你已经在整个代码中使用了 `cout`，即标准输出流。现在你将使用 `cin`，即标准输入流，来提示用户响应。\n\n- **步骤\
    \ 1** 你希望用户输入到程序中的任何内容都需要存储在系统内存中的某个位置，以便检索和使用。因此，任何输入都必须首先声明为变量，以便用户可以使用。通过创建一个带有头文件的空白\
    \ C++ 文件开始。\n\n```cpp\n#include <iostream>\nusing namespace std;\n\nint main()\n\
    {\n}\n```\n\n- **步骤 2** 变量的数据类型也必须与你想从用户那里获取的输入类型相匹配。例如，要询问用户的年龄，你会使用如下这样的整数：\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\n\nint main()\n{\n    int\
    \ age;\n\n    cout << \"What is your age?: \";\n    cin >> age;\n\n    cout <<\
    \ \"\\nYou are \" << age << \" years old.\\n\";\n}\n```\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_139_0.png)\n\
    \n- **步骤 3** `cin` 命令的工作方式与 `cout` 命令相反。通过第一个 `cout` 行，你将“What is your age?”（你几岁？）输出到屏幕上，如箭头所示。`cin`\
    \ 使用方向相反的箭头，表示输入。输入被放入整数 `age` 中，并在第二个 `cout` 命令中被调用。构建并运行代码。\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_139_1.png)\n\
    \n- **步骤 4** 如果你正在问一个问题，你需要将输入存储为字符串；要询问用户的名字，你会使用：\n\n```cpp\n#include <iostream>\n\
    using namespace std;\n\nint main()\n{\n    string name;\n\n    cout << \"What\
    \ is your name?: \";\n    cin >> name;\n\n    cout << \"\\nHello, \" << name <<\
    \ \". I hope you're well today!\\n\";\n}\n```\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_139_2.png)\n"
