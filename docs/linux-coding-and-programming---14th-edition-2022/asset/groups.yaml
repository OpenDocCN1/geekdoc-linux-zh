    ## 终端基础


    大多数操作系统使用两种类型的界面：GUI（图形用户界面），即 Windows、macOS 和 Linux Mint 启动时进入的桌面，以及命令行。虽然现代操作系统逐渐远离命令行，但
    Mint 使用终端赋予用户更大的系统控制权。


    ### 掌控命令


    命令行，或终端，是一个极其强大的界面。你在桌面上能做的任何事，都可以在终端中完成。让我们从了解它是如何工作的开始。


    - 步骤 1 您可以通过点击面板上的终端图标来访问终端，该图标位于 Firefox 和文件图标之间；或者打开菜单并从左侧快速启动条中选择它来启动终端。


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_45_0.png)


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_45_1.png)


    - 步骤 2 终端为您提供访问 Linux Mint Shell（称为 Bash）的途径，进而访问底层操作系统。Mint 中的一切，包括桌面和 GUI，都是从命令行运行的模块。


    - 步骤 3 您目前在终端中看到的是您的登录名，后跟计算机的名称，该名称是您在首次安装 Mint 期间设置的。该行以当前文件夹名称结尾；最初这只是一个波浪号
    ~，表示您的主文件夹。


    - 步骤 4 行末的闪烁光标是输入基于文本的命令的位置。您可以开始使用一个简单的命令 Print Working Directory（pwd）进行实验，它会将您当前所在的文件夹输出到屏幕上。输入
    pwd 并按 Enter。


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_45_2.png)


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_45_3.png)


    ### 终端基础


    - 步骤 5


    您输入的所有命令都以相同的方式工作：输入命令，包含扩展命令使用的任何参数，并按 Enter 执行您输入的命令行。在终端中输入：uname -a 并按 Enter。这显示了有关
    Mint 的一些系统信息。


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_46_0.png)


    - 步骤 8


    查看和搜索选项允许您调整终端窗口的大小，当然也可以在终端中搜索任何特定的关键词。


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_46_1.png)


    - 步骤 6


    在我们开始输入命令之前，让我们花点时间看看终端提供哪些菜单。文件菜单选项允许您打开新终端，创建新配置文件（在其中您可以调整终端的大小、颜色和行为），添加新标签页，并关闭当前所有活动的终端会话。


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_46_2.png)


    - 步骤 9


    终端入口扩展了配置文件编辑和大小调整功能，允许您更改字符编码。有趣的是，您还可以将其设置为只读模式，这会阻止您向终端输入任何命令；当您只需要永久显示终端内容时，这很有用。


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_46_3.png)


    - 步骤 7


    编辑选项允许您从终端和其他来源复制和粘贴命令；当您想从网页复制非常长且复杂的命令时，这很有用。它还允许您编辑当前配置文件的设置。


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_46_4.png)


    - 步骤 10


    最后，帮助选项显示终端的帮助内容和版本号，更准确地说，是 GNOME 终端；我们以后会简单地称之为终端。内容值得快速浏览，以帮助熟悉终端的工作方式。


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_46_5.png)


    ## 通过终端更新 Mint


    到目前为止，您一直使用盾牌图标来启动 Mint 更新管理器，以更新系统并升级当前安装的应用程序、工具和其他元素。然而，您也可以从终端完成完整的系统更新和升级。


    ### 使用 APT-GET


    要通过终端更新和升级，您使用 APT（高级打包工具）命令。它是一个功能强大的命令，根据其使用场景组合不同的元素。


    - 步骤 1

    从打开新终端开始，或者如果您已经打开了终端，使用 clear 命令清除其内容。这为您提供了一个干净的工作起点。


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_47_0.png)


    - 步骤 2

    在终端中输入：apt-get。这会列出最常用的 apt-get 命令，以及对该命令作用的简要描述。即使此时它没有多大意义，也值得一看。


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_47_1.png)


    - 步骤 3

    Apt-get 用于更新和升级 Mint 中的软件，以及 Ubuntu 和其他基于 Debian 的发行版。使用 Update 元素获取新的软件包列表并更新源文件列表。Upgrade
    下载并执行这些文件的最新版本升级。要开始整个升级和更新过程，请输入：sudo apt-get update，然后输入您的密码。


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_47_2.png)


    - 步骤 4

    现在请注意 sudo 命令的添加。sudo 命令曾经意味着“超级用户执行”（Super User Do）；如今，作为“替代用户执行”（Substitute
    User Do）更可接受。它意味着管理员用户（超级用户）使用 APT（高级打包工具）获取任何更新。现在试试这个：sudo apt-get upgrade。


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_47_3.png)


    ### 通过终端更新 Mint


    - 步骤 5

    根据您的更新状态，如果您有任何等待安装的更新，您可能会被询问是否想要应用 sudo apt-get upgrade 命令的结果。您可以按 y 接受并继续。这里发生的事情是，apt-get
    有一些更新软件要应用于 Mint，您正在确认该操作。


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_48_0.png)


    - 步骤 7

    基本上，就是这样，您的系统现在已根据 apt-get update 命令提供的可用软件包列表更新到最新状态。您可以再运行一次该过程，只是检查一下是否一切正常。回顾一下，请输入：sudo
    apt-get update，按 Enter，然后输入：sudo apt-get upgrade 并按 Enter。


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_48_1.png)


    - 步骤 6

    您的终端窗口中很可能会填入看似一堆乱码的长列表，但别担心。升级所需的文件已下载、准备、解包、处理、安装并正确设置。当您执行升级时，即使是最小的软件包，也有很多事情在发生。


    - 步骤 8

    有趣的是，Linux Mint 和其他发行版一样，允许您将几个命令链接在一起。因此，在这个例子中，我们可以使用 sudo apt-get update &&
    sudo apt-get upgrade。双与符号（&&）组合命令，只要前一个命令未出错，它就能完美工作。建议在每次会话开始时都使用更新和升级组合。


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_48_2.png)


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_48_3.png)


    ### 终端与更新管理器？


    无论您使用哪种发行版，为什么选择用终端而不是更新管理器来更新和升级？一些用户强烈喜欢使用终端来更新他们的 Linux 系统和配套应用程序，认为这样更好。然而，情况往往并非如此。


    使用终端的 apt-get upgrade，无法处理软件包版本之间的依赖关系变更，因此如果软件包的依赖文件从一个版本到另一个版本发生了变化，升级就会被搁置。


    更新管理器，或软件管理器（取决于发行版），通常会分阶段更新，并标记那些依赖关系发生变化的软件包进行更新。然而，Linux 有时会让事情变得困惑，有时又不会。归根结底，这取决于正在更新的软件包的开发者，以及该发行版仓库中保存软件包的方式，还有更新是否被归类为稳定版。本质上，从用户的角度来看，如果您定期使用终端和更新管理器进行更新和升级，那么您将保持尽可能最新，并获得基本和必要的稳定版本软件包和核心软件。如果您追求最前沿的软件包更新，最好选择滚动发行版。


    '
