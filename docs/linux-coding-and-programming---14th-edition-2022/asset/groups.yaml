  mdcn: "\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_127_0.png)\n\n# 病毒！\n\n### 你知道吗……\n\
    \n第一个在受控系统之外传播的早期编程计算机病毒之一，即传播到“野外”的病毒，被称为 Elk Cloner。它由 1982 年一位名叫 Rich Skrenta\
    \ 的 15 岁学生编写。\n\nElk Cloner 被编程用于感染 Apple DOS 3.3 操作系统，并附加在一个游戏上。当该游戏被运行了五十次后，病毒就会被激活。此时，屏幕不会显示游戏，而是变黑并显示一首诗：\n\
    \n- Elk Cloner：\n- 拥有个性的人格化程序\n\n它将占据你所有的磁盘  \n它将渗透你的芯片  \n没错，是 Cloner！\n\n它将像胶水一样粘在你身上\
    \  \n它也会修改内存（RAM）  \n派出 Cloner！\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_128_0.png)\n\
    \n> 开发于 1982 年作为恶作剧的 Elk Cloner，是记录在案的早期“野外”病毒之一。\n\n# 使用注释\n\n尽管在由众多代码行组合而成的游戏、应用程序甚至整个操作系统中，注释可能看似微不足道的元素，但事实上，它们很可能是最重要的因素之一。\n\
    \n## 注释的重要性\n\n代码中的注释基本上是人类可读的描述，详细说明代码在该特定点正在执行什么操作。它们听起来似乎并不特别重要，但没有注释的代码是编程中令人沮丧的领域之一，无论你是专业人士还是初学者。\n\
    \n简而言之，所有代码都应该以能够有效描述某一行、某一段或单个元素目的的方式进行注释。你应该养成尽可能多地写注释的习惯，试着想象一下，一个对编程一无所知的人拿起你的代码，仅仅通过阅读你的注释就能理解代码将要做的事情。\n\
    \n在专业环境中，注释对代码的成功至关重要，归根结底，对公司或项目也是如此。在一个组织中，许多程序员与工程师、其他开发者、硬件分析师等人一起以团队形式工作。如果你是负责为公司编写定制软件的团队成员之一，那么当出现问题时，你的注释可以帮助节省大量时间，让另一名团队成员能够接手并顺藤摸瓜，精确定位问题所在。\n\
    \n![](img/d501697c83491ed0bb4b382b0d28ef0a_129_0.png)\n\n> 把自己想象成负责找出程序哪里出错的人。该程序拥有超过\
    \ 800,000 行代码，分布在多个不同的模块中。你很快就能理解，来自原始程序员的良好注释形式的一点帮助是多么必要。\n\n最好的注释总是简洁明了，并在逻辑上将代码串联起来，详细说明当程序运行到某一行或某一段时发生什么。你不需要对每一行都进行注释。比如\
    \ `if x==0` 这样的代码就不需要你注释说“如果 x 等于零则执行某事”；这对读者来说显而易见。然而，如果 `x` 等于零会导致程序对用户发生重大变化，例如他们耗尽生命次数，那么确实需要进行注释。\n\
    \n即使代码是我们自己编写的，你也应该像要与他人公开分享那样写注释。这样，当你返回该代码时，总能理解你之前做了什么，哪里做错了，或者哪部分运行得非常好。\n\
    \n注释是一种良好的实践，一旦你理解了如何在需要时添加注释，很快就会将其变成一种本能。\n\n```assembly\nDEFS  240,320,328,320,320,320,0,3,328,728,720,323,728,328,329\n\
    DEFS  600,600,528,4C,4DB,328,4C3,528,4C0,4C0,2C2D,4C9,6\nDEFS  32A,4C8,98C,32D,328,32C,32A,34C,37C,32A,3C9,3C2D,42B,8\n\
    DEFS  340,32B,340,32D,32B,3C2D,32B,42B,42D,32B,42B,47B,45H\nDEFS  64B,47B,52B,73B,73D,44B,440,448,37B,32A,3C9,3C2B\n\
    DEFS  1,0B,0B,0,5,1B0,69B,415,32B,43B,6C8B,8FB9\n\nTHISG:\nDEFS  60B,72B,4C0,64B,60B,56B,1B0,1,1,82,44B,51B,51B,5B0,54\n\
    DEFS  5B0,5B0,72B,72B,6B0,6B0,56B,5B0,56B,52B,60B,51B,51B\nDEFS  52B,54B,54B,54B,60B,73B,6B0,6B0,44B,44B,55B,51B,51B\n\
    DEFS  51B,51B,5B0,5B0,56B,56B,52C,72B,6B0,82B,60D,6B0,54B,52\nDEFS  54B,44B,82B,46B,46B,34B,54B,3B0\n\
    \n; Game restart point\nSTART:\nLD      A           ;Initial live count\nLD  \
    \    (SCREEN),A\nLD      (SCREEN+1),A\nLD      (SCREEN+2),A\nLD      A,2\nLD \
    \     (SCREEN+3),A\nLD      HL,TASC\nLD      SET,0,(HL)\nLD      HL,SCRE\nLD \
    \     DE,SCREEN+1\nLD      BC,1777H    ;Clear screen image\nLD      (DE),r\nLDIR\
    \    HL,00800H   ;Title screen bitmap\nLD      DE,SCREEN\nLDIR    BC,4096\n\n\
    LD      HL,SCRE+5000+8000+1752+29\nLD      DE,WINH+2C4\nCALL    NINCHY\nLD   \
    \   HL,0F0C0H           ;Attributes for last room\nLD      DE,ATTR\nLDIR    BC,256\n\
    LDIR\n\nLD      HL,0080H           ;Attributes for title screen\nLD      DE  \
    \  (Bottom two-attributes)\nLD      A,3\n\nDRAG1:\nLOOP    5,(C)\nAND     I,D2\n\
    AND     50B\nJOR     HZ,36672,3D401\nLD      A,1\n```\n\n## C++ 注释\n\n在 C++ 中编写注释涉及使用双正斜杠\
    \ `//` 或正斜杠和星号 `/*`。你之前已经看过一些简短的示例，但以下是它们的工作方式。\n\n**步骤 1** 以 Hello World 代码为例，你可以轻松使用双正斜杠对代码的不同部分进行注释：\n\
    \n```cpp\n//My first C++ program\ncout << \"Hello, world!\\n\";\n```\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_130_0.png)\n\
    \n**步骤 2** 但是，你也可以在代码行的末尾添加注释，以更好地描述正在发生的事情：\n\n```cpp\ncout << \"Hello, world!\\\
    n\"; //This line outputs the words \"Hello, world\". The \\n denotes a new line.\n\
    ```\n\n请注意，你不需要在注释末尾加分号。这是因为注释是被编译器忽略的代码行。\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_130_1.png)\n\
    \n**步骤 3** 使用正斜杠和星号可以注释多行代码：\n\n```cpp\n/* This comment can\n * cover several\
    \ lines\n * without the need to add more slashes */\n```\n\n切记要用相反的星号和正斜杠结束块注释。\n\
    \n![](img/d501697c83491ed0bb4b382b0d28ef0a_130_2.png)\n\n**步骤 4** 注释时要小心，特别是块注释。很容易忘记添加闭合的星号和正斜杠，从而导致位于注释块内的代码失效。\n\
    \n![](img/d501697c83491ed0bb4b382b0d28ef0a_130_3.png)\n\n**步骤 5** 显然，如果你尝试编译并执行代码，它会报错，抱怨缺少花括号\
    \ `}` 来结束代码块。如果你犯过几次这种错误，回去修正会很耗时。幸运的是，Geany 的颜色编码有助于区分注释和代码。\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_130_4.png)\n\
    \n**步骤 6** 对于块注释，在 C++ 中良好的实践是在注释块的每一新行添加一个星号。这也有助于你记得在继续编写代码之前关闭注释块：\n\n```cpp\n\
    /* This comment can\n * cover several lines\n * without the need to add more slashes\
    \ */\n```\n\n幸运的是，Geany 会自动完成这一点，但在使用其他 IDE 时要注意这一点。\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_130_5.png)\n\
    \n# 变量\n\n在 C++ 中使用变量与在 Python 中略有不同。在 Python 中，你只需声明 'a' 等于 10，变量就会被赋值。然而，在 C++\
    \ 中，变量必须先声明其类型才能被使用。\n\n## 变量的声明\n\n你可以通过代码中的语句来声明 C++ 变量。有几种不同类型的变量可以声明。以下是具体操作方法。\n\
    \n**步骤 1** 打开一个新的空白 C++ 文件，输入常规的代码头：\n\n```cpp\n#include <iostream>\nusing namespace\
    \ std;\n\nint main()\n{\n}\n```\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_131_0.png)\n\
    \n**步骤 2** 从简单开始，创建两个变量 a 和 b，一个赋值为 10，另一个为 5。你可以使用数据类型 int 来声明这些变量。在花括号内输入：\n\
    \n```cpp\nint a;\nint b;\n\na = 10;\nb = 5;\n```\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_131_1.png)\n\
    \n**步骤 3** 你可以编译并运行代码，但除了将值 10 和 5 存储到整数 a 和 b 中，它不会做太多事。忽略关于变量已设置但未使用的警告，代码仍然可以工作。为了输出变量的内容，添加：\n\
    \n```cpp\ncout << a;\ncout << \"\\n\";\ncout << b;\n```\n\n`cout << \"\\n\";`\
    \ 部分仅在 10 和 5 的输出之间插入一个新行。\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_131_2.png)\n\
    \n**步骤 4** 当然，你可以声明一个新变量，命名为 result，并输出简单的算术运算：\n\n```cpp\nint result;\nresult\
    \ = a + b;\ncout << result;\n```\n\n按照截图将上述代码插入到代码中。\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_131_3.png)\n\
    \n"
