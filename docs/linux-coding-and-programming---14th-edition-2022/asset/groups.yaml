    # How to Set Up Python in Linux


    While the Raspberry Pi’s operating system contains the latest, stable version
    of Python, other Linux distros don’t come with Python 3 preinstalled. If you’re
    not going down the Pi route, then here’s how to check and install Python for Linux.


    # PYTHON PENGUIN


    Linux is such a versatile operating system that it’s often difficult to nail down
    just one way of doing something. Different distributions go about installing software
    in different ways, so we’re sticking with Linux Mint for this particular tutorial.


    +   **STEP 1**

    +   First you need to ascertain which version of Python is currently installed
    in your Linux system. To begin with, drop into a Terminal session from your distro’s
    menu or hit the Ctrl+Alt+T keys.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_89_0.png)


    +   **STEP 2**

    +   Next enter `python --version` into the Terminal screen. You should have the
    output relating to version 2.x of Python in the display. By default, most Linux
    distros come with both Python 2 and 3, as there’s plenty of code out there still
    available for Python 2. Now enter: `python3 --version`.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_89_1.png)


    +   **STEP 3**

    +   In our case we have both Python 2 and 3 installed, as long as Python 3.x is
    installed, then the code in our tutorials will work. It’s always worth checking
    to see if the distro has been updated with the latest versions, so enter: `sudo
    apt-get update && sudo apt-get upgrade` to update the system.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_89_2.png)


    +   **STEP 4**

    +   Once the update and upgrade completes, enter: `python3 --version` again to
    see if Python 3.x is updated or even installed; as long as you have Python 3.x,
    you’re running the most recent major version. The numbers after the 3, indicate
    patches and further updates. Often they’re unnecessary but can contain vital new
    elements.


