  mdcn: "\n\n# 安装 Linux\n\n一旦启动到 Live 环境（试运行环境），您就会看到将发行版安装到计算机的选项。先四处看看，当您准备就绪时，在桌面上查找安装选项。\n\
    \n- **步骤 1**  \n  如果您已连接到互联网（如果没有，请现在连接）并且处于 Live 环境中，请双击桌面上的“Install Linux Mint（安装\
    \ Linux Mint）”图标开始安装过程。其他发行版当然会显示它们自己的名称，但过程是一样的。当您准备就绪时，点击“继续（Continue）”。\n\n\
    - **步骤 2**  \n  虽然大多数 Linux 发行版的安装过程非常相似，但有些在安装期间会提出不同的问题。通常，这些问题并不太难，没有什么非常技术性的内容，但像“安装第三方软件……”这类问题可能会让人困惑。在这种情况下，您可以点击“继续”，但如果您不确定，请确保有一台连接互联网的设备可用，以便查阅任何问题。\n\
    \n- **步骤 3**  \n  在安装新的操作系统时，建议您擦除旧操作系统，并用新系统进行替换。当安装过程达到此阶段时，请确保选中“擦除磁盘并安装 Linux……”选项。注意：这会完全清除您计算机上的\
    \ Windows 10，因此请确保您已备份所有个人文件和数据。\n\n- **步骤 4**  \n  在安装过程开始之前，系统会询问您关于擦除硬盘所做的选择是否正确。这是您退出的最后机会：如果您确定不介意清除所有内容并重新使用\
    \ Linux Mint 开始，请点击“继续”。如果您需要备份文件，请移除 Linux 光盘/USB 驱动器，重启计算机，备份文件后重新开始。\n\n- **步骤\
    \ 5**  \n  最终，您会被要求设置 Linux 用户名和密码。首先输入您的姓名，然后是计算机名称，即该计算机在网络上被识别的名称。接下来选择一个用户名，再选择一个良好的密码。您可以勾选“自动登录”选项，但暂时保留“加密主文件夹”选项。\n\
    \n- **步骤 6**  \n  安装过程可能很快，可能会提出更多需要回答的问题，或者它可能根据您之前的回答直接开始安装 Linux。无论哪种情况，您最终会被要求“继续测试\
    \ Live 环境”或“重启以使用新安装的操作系统”。如果您准备好使用 Linux，请点击“立即重启”。\n\n## 安装虚拟环境\n\n虚拟环境是一个模拟的计算机系统。使用虚拟机，您可以模拟一台标准\
    \ PC，并在其上安装完整的操作系统，而不会影响安装在您计算机上的现有系统。这是一种测试和使用 Linux 的好方法，同时仍保留 Windows 10 作为您的主要操作系统。\n\
    \n### 走向虚拟化\n\n使用虚拟机（VM）会占用您计算机的资源：内存、硬盘空间、处理器使用率等。在开始之前，请确保您拥有足够的各项资源。\n\n- **步骤\
    \ 1**  \n  在这里我们使用 VirtualBox，因为它是掌握起来最容易的虚拟环境之一。访问 www.virtualbox.org 并点击“下载\
    \ VirtualBox”。这将带您进入主下载页面。找到适合您系统的正确托管平台：Windows 或 Mac（“托管平台”指的是当前安装的操作系统），然后点击链接开始下载。\n\
    \n![](img/d501697c83491ed0bb4b382b0d28ef0a_23_0.png)\n\n- **步骤 2**  \n  接下来，在\
    \ VirtualBox 下载页面，找到 VirtualBox 扩展包（Extension Pack）链接。扩展包支持 USB 设备以及许多其他附加功能，可以帮助使\
    \ VM 环境成为对“真实”计算机更精确的模拟。\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_23_1.png)\n\
    \n- **步骤 3**  \n  在下载完正确的软件包后，在安装任何内容之前，您需要确保正在使用的计算机能够托管虚拟机。为此，请重启计算机并进入 BIOS。当计算机启动时，按\
    \ Del、F2 或任何必要的按键进入“设置（Enter Setup）”。\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_23_2.png)\n\
    \n- **步骤 4**  \n  每个 BIOS 的布局都不同，评估在每个具体案例中应查看哪里非常困难。然而，根据一般经验法则，您正在寻找的是 Intel\
    \ 虚拟化技术，或者简称为虚拟化，通常位于 BIOS 的“高级（Advanced）”部分内。找到它后，启用它，保存设置，退出 BIOS 并重启计算机。\n\n\
    ![](img/d501697c83491ed0bb4b382b0d28ef0a_23_3.png)\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_24_0.png)\n\
    \n- **步骤 5**  \n  计算机恢复运行后，找到已下载的主 VirtualBox 应用程序并双击以开始安装过程。当您准备就绪时，点击“下一步（Next）”继续。\n\
    \n![](img/d501697c83491ed0bb4b382b0d28ef0a_24_1.png)\n\n- **步骤 6**  \n  VirtualBox\
    \ 的默认安装位置应该能满足大多数用户，但如果您有特殊的安装位置要求，请点击“浏览（Browse）”按钮更改安装文件夹。然后，确保 VirtualBox 功能树中的所有图标都被选中，即它们旁边没有红色\
    \ X。点击“下一步”继续。\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_24_3.png)\n\n- **步骤\
    \ 7**  \n  如果您愿意，此部分可以保留默认设置。它只是在处理虚拟机时让生活稍微轻松一些，特别是处理下载的虚拟机时，您将来可能会遇到这种情况。同样，点击“下一步”进入下一阶段。\n\
    \n![](img/d501697c83491ed0bb4b382b0d28ef0a_24_5.png)\n\n- **步骤 8**  \n  在安装 VirtualBox\
    \ 时，您的网络连接会在非常短的时间内被禁用。这是由于 VirtualBox 正在创建一个联动的虚拟网络连接，以便任何已安装的虚拟机都能通过计算机已建立的网络连接访问互联网或您的家庭网络资源。点击“是（Yes）”，然后点击“安装（Install）”开始安装。\n\
    \n![](img/d501697c83491ed0bb4b382b0d28ef0a_24_2.png)\n\n- **步骤 9**  \n  Windows\
    \ 可能会要求您接受一个安全通知。对此点击“是”，您可能会遇到一个要求您信任来自 Oracle 的安装的对话框；同样，点击“是”并接受安装 VirtualBox\
    \ 应用程序。完成后，点击“完成（Finish）”以启动 VirtualBox。\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_24_4.png)\n\
    \n- **步骤 10**  \n  当 VirtualBox 运行起来后，您现在可以安装 VirtualBox 扩展包了。找到已下载的附加组件并双击。VirtualBox\
    \ 分析该包时可能会有短暂的停顿，但最终您会收到安装它的消息；显然点击“安装（Install）”开始过程，在下一个屏幕向下滚动以接受协议，并点击“我同意（I\
    \ Agree）”。\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_24_6.png)\n\nwww.bdmpublications.com\
    \ 2.5\n\n## 在虚拟环境中安装 Linux\n\n随着 Oracle 的 VirtualBox 现在运行起来，下一个任务是创建您将要安装 Linux\
    \ 的虚拟机（VM）环境。这个过程不会影响您当前安装的操作系统，这就是为什么虚拟机是一个很好的选择。\n\n### 创建虚拟机\n\n在创建虚拟机时，有许多选项可供选择。不过现在，让我们设置一个足以运行\
    \ Mint Cinnamon 并表现良好的虚拟机。\n\n- **步骤 1**  \n  打开 VirtualBox 后，点击应用右上角的“新建（New）”图标。这将打开新的虚拟机向导。\n\
    \n![](img/d501697c83491ed0bb4b382b0d28ef0a_25_0.png)\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_25_1.png)\n\
    \n- **步骤 2**  \n  在“名称（Name）”旁边的框中，输入 Linux Mint，VirtualBox 应该会自动选择 Linux 作为类型（Type），以及\
    \ Ubuntu（64 位）作为版本（Version）；如果没有，请使用下拉框选择正确的设置（记住 Mint 主流版是基于 Ubuntu 的）。当您准备继续时，点击“下一步（Next）”。\n\
    \n![](img/d501697c83491ed0bb4b382b0d28ef0a_25_2.png)\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_25_3.png)\n\
    \n- **步骤 3**  \n  下一部分定义了分配给虚拟机的系统内存或 RAM 数量。请记住，这部分内存是从计算机上安装的可用内存中扣除的，所以不要给虚拟机分配太多。例如，我们安装了\
    \ 8GB 内存，我们将给虚拟机 2GB。当您准备就绪时，点击“下一步（Next）”继续。\n\n- **步骤 4**  \n  在这部分，您开始创建虚拟机用于安装\
