    \ C++ 数学库，你还可以计算平方根、幂、三角函数等。\n\n- **步骤 1** C++ 的数学运算遵循与学校教学中相同的模式，即乘法和除法的优先级高于加法和减法。不过你可以改变这一点。目前，创建一个新文件并输入：\n\
    \n```c\n#include <iostream>\nusing namespace std;\n\nint main ()\n{\n    float\
    \ numbers = 100;\n    \n    numbers = numbers + 10; // This adds 10 to the initial\
    \ 100\n    cout << numbers << \"\\n\";\n    \n    numbers = numbers - 10; // This\
    \ subtracts 10 from the new 110\n    cout << numbers << \"\\n\";\n}\n```\n\n-\
    \ **步骤 3** 乘法和除法可以这样应用：\n\n```c\n#include <iostream>\nusing namespace std;\n\n\
    int main ()\n{\n    float numbers = 100;\n    \n    numbers = numbers * 10; //\
    \ This multiplies 100 by 10\n    cout << numbers << \"\\n\";\n    \n    numbers\
    \ = numbers / 10; // And this divides 1000 by 10\n    cout << numbers << \"\\\
    n\";\n}\n```\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_137_0.png)\n\n- **步骤\
    \ 2** 虽然简单，但它确实能让旧的数学肌肉热身起来。注意，我们为 `numbers` 变量使用了浮点数。虽然你可以放心地使用整数，但如果你突然开始使用小数，你就需要根据所需的精度将其更改为浮点数（float）或双精度数（double）。运行代码并查看结果。\n\
    - **步骤 4** 再次运行这段简单代码并查看结果。虽然特别无趣，但这是 C++ 数学的入门介绍。我们在这里使用了浮点数，因此你可以玩弄代码，乘以小数位，以及进行除法、加法和减法。\n\
    \n![](img/d501697c83491ed0bb4b382b0d28ef0a_137_1.png)\n\n138 www.bdnpublications.com\n\
    \n## C++ 数学\n\n## 步骤 5\n\n有趣的数学内容出现在你调用 C++ 数学库时。在这个头文件中，有几十个数学函数以及更多操作。从计算余弦到双参数反正切，再到\
    \ PI 的值。你可以这样调用该头文件：\n\n```cpp\n#include <iostream>\n#include <cmath>\nusing namespace\
    \ std;\nint main ()\n{\n}\n```\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_138_0.png)\n\
    \n## 步骤 6\n\n从获取一个数的平方根开始：\n\n```cpp\n#include <iostream>\n#include <cmath>\n\
    using namespace std;\n\nint main()\n{\n    float number = 134;\n    cout << \"\
    The square root of \" << number << \" is: \" << sqrt(number) << \"\\n\";\n}\n\
    ```\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_138_1.png)\n\n## 步骤 7\n\n在这里，我们创建了一个名为\
    \ `number` 的新浮点数，并使用 `sqrt(number)` 函数显示 134（即变量 `number` 的值）的平方根。构建并运行代码，你的答案将是\
