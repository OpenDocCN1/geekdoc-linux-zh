    \ backup.sh 脚本中。注意，我们将“source”拼错为“sauce”，这是因为已经有一个内置命令叫“source”，所以我们使用了不同的拼写。\n\
    \n```bash\n#!/bin/bash\n\nclear\n# Time stamp\nday=$(date +\\%A)\nmonth=$(date\
