    VirtualBox application. When it’s complete, click finish to start VirtualBox.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_24_4.png)


    **STEP 7** This section can be left alone to the defaults, should you wish. You
    simply makes life a little easier when dealing with VMs, especially when dealing
