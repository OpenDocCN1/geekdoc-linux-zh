    # 在 Linux 系统下有数千个免费软件包供程序员使用


    其中一些提供增强的安全性、外观精美的桌面环境、针对游戏玩家优化的版本，或是面向学生的特定方案。这种可扩展性使 Linux 成为一个更具吸引力的使用平台，因为你可以将系统快速塑造成开发基础，包括适用于
    Python、Web 开发、C++、Java 等众多语言的集成开发环境（IDE）；或者创建一个在线匿名化的基础，例如 Minecraft 服务器、媒体中心以及更多功能。


    对于想要学习编程的人来说，另一个显著优势在于，Linux 自带大多数流行的编程环境。在许多可用的 Linux 发行版中，Python 和 C++ 都预先安装在其中，这意味着你几乎可以在安装系统并首次启动后立即开始编程。


    通常来说，与 Windows 或 macOS 相比，Linux 占用的系统资源更少；这里的系统资源我们指的是内存、硬盘空间和 CPU 负载。Linux 代码经过精简，且没有占用这些系统资源的第三方“臃肿软件”。更高效的系统自然意味着有更多的可用资源用于编程和测试环境以及你最终创建的程序。更少的资源占用也意味着你可以在通常难以运行甚至拒绝运行最新版本的
    Windows 或 macOS 的旧硬件上使用 Linux；因此，你无需扔掉旧电脑，而是可以用一个 Linux 发行版让它重新发挥作用。


    不过，Linux 的优势不仅仅在于 C++、Python 或其他更流行的编程语言。使用 Linux 的命令行（也称为终端），你可以创建 Shell 脚本，这是设计用于从命令行运行的程序，由脚本语言组成。它们主要用于自动化任务，或为特定操作提供某种形式的输入和输出。


    最后，虽然我们可以列举出许多其他优势，但现有成千上万个免费程序和应用程序，涵盖了计算的几乎每个方面。这些被称为软件包，截至目前，仅 Linux Mint 就有超过
    8,700 个专门的编程应用程序，而总体的软件包数量更是令人惊叹，超过 62,000 个，满足从 Amateru Radio 到 LWWX 工具等各种需求。


    因此，Linux 是编程的一个绝佳资源和环境。它非常适合开发者，并不断改进和演进。如果你认真地想要进入编程领域，或者只是想尝试点新事物，请尝试使用 Linux，看看它是否适合你。


    Linux 编程环境可以简单到你需要的程度，也可以复杂到你需要的程度。


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_8_0.png)

    ![](img/d501697c83491ed0bb4b382b0d28ef0a_8_1.png)

