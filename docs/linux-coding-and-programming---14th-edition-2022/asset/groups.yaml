    ## 所需设备


    成功在 PC 上安装 Linux Mint 的系统要求出人意料地低，因此即使是几年前购买的电脑也能愉快地运行这个发行版。不过，在继续之前，值得检查一下你是否已具备所有条件。


    ### MINT 的必备要素


    在我们开始阅读本书之前，以下是安装和运行 Linux Mint 所需的条件。你有多种选择，所以请耐心等待，看看哪种最适合你。


    ### 系统要求


    Linux Mint 的最低系统要求如下：


    - **CPU** – 700MHz

    - **RAM/内存** – 512MB

    - **硬盘空间** – 9GB（建议 20GB）

    - **显示器** – 1024 x 768 分辨率


    显然，你的系统越好，体验就会越好，速度也会更快。


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_11_0.png)


    ### USB 安装


    你可以通过 USB 或 DVD 将 Linux Mint 安装到计算机上。我们稍后会详细介绍这两种方法，但如果你已经熟悉该过程，或者正准备使用 USB 并收集所需的硬件，那么你需要一个至少
    4GB 的 USB 闪存盘来存储 Linux Mint ISO。


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_11_1.png)


    ### DVD 安装


    通过 DVD 安装 Linux Mint 只需一张空白 DVD-R 光盘。当然，在你能够将 ISO 镜像传输或烧录到光盘之前，你还需要一个光驱（DVD 刻录机）。


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_11_2.png)


    ### 虚拟环境


    安装到虚拟环境是测试和使用 Linux 发行版的常见方法。Linux Mint 在虚拟环境中运行非常出色，稍后我们会详细介绍。市面上有许多不同的虚拟环境应用程序；然而，来自
    Oracle 的 VirtualBox 是其中最容易入门的。你可以在 **www.virtualbox.org** 找到最新版本。


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_12_0.png)


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_12_1.png)


    ### 互联网连接


    不用说，互联网连接对于确保 Linux Mint 保持最新更新和补丁，以及安装更多软件至关重要。虽然使用 Linux Mint 不需要互联网连接，但你会错过该发行版上可用的众多免费软件。


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_12_2.png)


    ### MAC 硬件


    虽然 Linux Mint 可以安装在 Mac 上，但有一种观点建议 Mac 用户虚拟环境，例如 VirtualBox 或 Parallels，为什么不呢，macOS
    已经是一个出色的操作系统。如果你想为较旧的 Mac 注入新活力，请确保它是 Intel CPU 型号，而不是 Power PC 型号。不过请注意，安装过程不像在
    PC 上那样轻松无忧。


    ## 桌面环境


    Linux Mint 提供几种不同的版本，或称风味：Cinnamon、MATE 和 Xfce；这些版本都有 32 位和 64 位版本。这一切到底意味着什么，你应该为安装选择哪个版本？


    ### 哪个 MINT？


    桌面环境是你用来与核心 Linux 系统交互的图形界面。正如 Windows 10 的图形桌面也称为 Fluent Design 一样。


    Linux Mint 为用户提供发行版的版本选择：Cinnamon、MATE 和 Xfce。虽然这对新手来说可能听起来有点令人困惑，但本质上，每个可用版本都包含相同的
    Linux 核心结构和内核，内核是操作系统的核心，负责处理软件和硬件之间的所有指令。


    每个版本只是不同的桌面环境，即你用来与操作系统交互的图形用户界面 (GUI)。每个桌面环境使用不同的应用程序来访问或使用系统，例如用于浏览操作系统文件结构的文件管理器，或启动其他应用程序的方式。不过，可用的核心生产力、视频和图形套件是相同的，并且以相同的方式运行。


    那么为什么要费心使用不同的桌面环境呢？简单来说，这取决于个人喜好。一些用户更喜欢 MATE，因为 MATE 是经典 GNOME 2 环境的分支，更以菜单为中心，并且在旧计算机上表现良好。另一些人更喜欢
    Cinnamon，这是一个更现代的环境，在较新的硬件上表现更好，并具有一些尖端的桌面代码。另一方面，Xfce 是一个轻量级的桌面环境，由于其对可用系统资源的极低占用，在较旧的硬件上运行良好。


    简而言之，Cinnamon 是 Linux Mint 的旗舰桌面环境。MATE 与更多种类的硬件兼容。例如，Windows 只提供一种是桌面环境来工作，而
    Linux 提供了许多。因此，Linux Mint 选择为用户提供丰富的选择。


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_13_0.png)


    ### 少许 CINNAMON 风味


    Cinnamon 除了外观和感受之外还有许多好处，尽管它们也是重要的因素。这里，我们概述了其中一些功能，帮助你决定它是否是你想要的桌面环境 (DE)。


    **FAB FEATURE 1**


    它在较现代的系统中表现出色，但比过去稳定得多，也不再是曾经的资源吞噬者。因此，如果你使用较旧的计算机来安装和测试 Linux Mint，请不要因此被 Cinnamon
    吓退。


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_14_0.png)


    **FAB FEATURE 2**


    Cinnamon 具有可配置的 Hot Corners（热角），桌面每个角都可以被单击以执行特定任务，例如显示工作区、显示所有窗口或运行命令。热角是切换不同视图的绝佳方式，有助于使桌面成为更高效的环境。


    **BEST MATE**


    MATE 是一个易于使用且直观的桌面环境，速度快且稳定。与 Cinnamon 相比，它看起来略显陈旧，但那只是表面现象。MATE 有很多值得喜欢的地方。


    **FAB FEATURE 1**


    MATE 是较旧计算机的绝佳桌面环境。与 Cinnamon 通常支持的硬件组件相比，它支持更多的硬件组件，但同样有能力提供外观精美的桌面以及高级自定义选项。


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_14_1.png)


    **FAB FEATURE 2**


    由于其高度可配置性，MATE 可以进行精细程度的自定义。对于希望桌面环境提供更多功能的用户，有许多可用的选项，包括 Compiz Settings，你可以配置各种桌面效果，甚至
    3D 桌面立方体。


    **无胆固醇桌面**


    Xfce 始于 1996 年的通用桌面环境 (CDE)。自那时起，它改了几次名字，现在简单称为 Xfce，昵称为“无胆固醇桌面环境”。


    **FAB FEATURE 1**


    Xfce 确实是一个快速的桌面，它充分发挥了 Linux 作为快速操作系统的最佳优势。事实上，从页面顶部到这里，我们只需要几页文字就将其安装到了新计算机上。写了几百个字，我们已经在品牌新的操作系统上了。不错。


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_14_2.png)


    **FAB FEATURE 2**


    仅仅因为它快速且轻量，并不意味着 Linux Mint Xfce 不是一个完整的桌面操作系统。就像其他提供的环境一样，你可以获得最新的 Firefox、LibreOffice、VLC、Gimp、聊天应用，甚至
    BitTorrent 客户端。


    ## 哪个发行版？


    到目前为止，我们主要查看的是 Linux Mint，但还有其他可供尝试的 Linux 发行版。事实上，有成千上万的 Linux 发行版可供下载和安装，那么你应该决定使用哪一个呢？


    ### 发行版跳跃


    “发行版跳跃”（Distro hopping）是社区用来形容那些从未坚持使用单个发行版的人的术语。相反，他们在不同发行版之间跳转，测试每一个，使用它们，然后转向另一个或新发布的发行版。


    例如，Linux Mint 是一个理想的起点。它是一个易于安装和使用的发行版，开箱即已安装你日常通常会使用的软件，并让你温和地融入 Linux 的独特世界，了解其工作原理和性能。


    发行版跳跃本身并没有错，这是一种了解市面上有哪些发行版的好方法，可以发现某个发行版的某些元素可能比另一个更吸引你的口味。当然，问题在于你总体上使用哪一个？


    Ubuntu 提供了非常相似的经验，但它以一种稍有不同的方式做到这一点。通常，Ubuntu 预装的内容比 Linux Mint 少，所以你需要手动安装。另一个值得考虑的点，是专为
    Ubuntu 用户准备的庞大内容量和支持页面，当你使用 Linux 时。如果你遇到困难，解决方案永远不会离你太远。


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_15_0.png)


    继续前进，当你开始对 Linux 更加自信时，你可以测试 openSUSE、Fedora 或 Debian 等。这些都是优秀的发行版，每一个都为系统运行方式提供了略有不同的视角。一些在
    Linux 技能方面比其他要求更高，但本质上，它们每个都有一些宝贵的教训供用户学习。


    虽然发行版跳跃是一件好事，但这并不是享受 Linux 并从中获得最大收益的稳定方式。我们并不是说你应该坚持一个发行版而从不看其他地方，那样你会错过很多很棒的内容，而是建议你找到几个，并根据你日益增长的
    Linux 技能缓慢地通过它们。


    你可能会发现自己转向某个特定发行版，因为它提供了与常规截然不同的东西。例如，Talis Linux 是一个专为在线匿名设计的发行版。它包含复杂的军用级加密工具，以及旨在帮助你在浏览网页时永不被检测、追踪或监控的工具和浏览器。Kali
    Linux 专为安全专业人员设计，包含许多不同类型的道德黑客工具。


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_15_1.png)


