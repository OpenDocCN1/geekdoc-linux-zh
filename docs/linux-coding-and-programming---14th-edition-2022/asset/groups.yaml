    \ in range(10):\n      print(random.randint(1, 25))\n  ```\n  ![](img/d501697c83491ed0bb4b382b0d28ef0a_114_2.png)\n\
    \n- **STEP 7** This code, when saved and executed, will display ten random numbers\
