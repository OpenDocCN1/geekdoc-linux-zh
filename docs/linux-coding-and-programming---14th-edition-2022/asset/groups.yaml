    ## 使用终端


    ### 树莓派 x Linux = 完美组合


    树莓派是一款非凡的硬件设备，为了充分释放其潜力，它需要一个同样出色的操作系统。幸运的是，Linux 是树莓派的默认且推荐的操作系统，二者结合堪称天作之合。


    在树莓派的研发阶段，设计者们需要确保他们正在创建的一款硬件不仅仅是一台便宜但体积小巧的计算机，而是能提供更多功能的设备。


    树莓派需要具备处理各种任务的灵活性，它需要有空间去承载更大胆的项目概念和想法，并且需要以尽可能易用的方式实现这些目标。目标是创建一个通用的学习平台，让任何年龄段的学生都能在此基础上进行扩展和探索，同时学习编程、电子学、计算机等新知识。自然而言，一旦硬件开发完成，操作系统唯一真正的选择当然是
    Linux。


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_77_0.png)


    Linux 的通用性堪称传奇。这个强大的核心操作系统具有极强的可塑性，可以引导其应用于几乎任何计算领域，从超级计算到机器人，从航天工业到更接地气的工程；教育科学、制造业乃至互联网。只要想到一个行业，你很可能就会发现后台有一个
    Linux 安装正在支撑其运转。


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_77_1.png)


    Raspbian 是树莓派推荐的操作系统，它是一个定制的基于 Debian 的发行版，内置了一组满足编码、电子学及一般桌面计算需求的实用工具。与应用一同预装了模块，帮助最大限度地发挥你所决定学习和使用的每种编程语言的功效，还有支持硬件的模块，使您能够使用并操作树莓派特有的、基于该硬件的专用设备。例如，有
    Python 模块可以与树莓派的 40 针 GPIO 进行交互，允许你为任意“硬件附着在顶部”（Hardware Attached on Top, HAT）设备创建内容。


    这种组合使得树莓派成为学习不仅是代码，还有 Linux 本身的一个卓越基础。Raspbian 既然是基于 Debian 的，就能运行本书中列出的任何终端命令，因为
    Linux Mint 甚至 Ubuntu 也是基于 Debian 的。由于树莓派体积小巧，初始成本极低，你不仅可以拥有普通的 Windows 或 macOS
    计算机，还可以拥有一台树莓派作为无头（无头是指一种无需连接键盘、鼠标或显示器，而是通过远程连接使用的通电设备）计算机，你可以连接到它并学习如何使用 Linux
    以及如何编写代码。


    ### 选择哪款树莓派？


    市面上有多种树莓派型号，每种与其他型号相比都略有不同。最近发布的型号是树莓派 3 Model B+，尽管这款型号比其它一些型号稍微昂贵，但它是有史以来功能最强大、特性最丰富的树莓派。总体而言，最好先使用
    Pi 3 Model B+ 开始进行树莓派实验，然后随着你技能的增长并专注于特定项目，再转向其他型号，例如需要较小体积和 Wi-Fi 连接时选择的 Pi Zero
    系列型号。


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_78_0.png)


    ### Raspbian 之外的选择


    树莓派 ARM 处理器的灵活性意味着它有能力运行 Raspbian 以外的其他操作系统。继续坚持使用 Linux 的前提下，你可以改为安装 Ubuntu MATE、Pidora（基于
    Fedora 的发行版）、Lakka、PiPlay（复古游戏模拟发行版）和 Arch Linux ARM。还有一些系统松散地基于 Linux 内核，例如 Android、Minibian
    和 Chromium OS。


    此外还有 Windows 10 IoT Core、FreeBSD、RISC OS、Pi 9，以及令人惊讶的是 ARQOS – 一款 Amiga 操作系统的克隆。不用说，一旦你玩腻了一个
    Linux 版本，就像在桌面 Linux 上一样，你可以切换到树莓派上的另一个版本，看看那个版本表现如何，是否适合你。


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_78_1.png)


    ### 树莓派、Linux 与编码


    如前所述，树莓派是一个优秀的代码平台，而 Linux 作为其核心，使你能够开始学习多种不同的编程语言。


    Bash 脚本运行完美无缺，因为 Raspbian 是 Linux，且基于 Debian，你可以轻松扩展你的脚本以涵盖树莓派的大部分功能。除了创建备份脚本外，你还可以创建能够访问树莓派
    GPIO 引脚的脚本，从而控制 LED 以及更复杂的 HAT 设备。


    Python 毫无疑问是初学者最受欢迎的选择，Raspbian 预装了你从 Python 体验中获取最大价值所需的一切。它有无数预装模块，以及该语言最新的稳定版本。


    C++ 是学习的最强大的编程语言之一。它用于游戏、应用程序，甚至整个操作系统。树莓派配备了出色的 C++ 编辑器，易于使用且能帮助你开发惊人的内容。无论你何时决定开启你的编码和
    Linux 冒险之旅，树莓派都是一个极佳的起步平台。


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_78_2.png)


    ## 命令行快速参考


    当你开始全天候使用 Linux 时，你会很快意识到 Ubuntu、Mint 等图形界面虽然在很多任务中很出色，但并非对所有任务都有效。理解如何使用命令行不仅能增强你对
    Linux 的理解，还能提升你总体上的编码和编程知识。我们的命令行快速参考指南旨在帮助你更快地掌握 Linux。


    ### 前十大命令


    这些可能并非每个人最常用的命令，但对于许多 Linux 和命令行用户来说，它们出现频率极高。


    -   **cd**: **cd** 命令是你在 Linux 命令行中最常用的命令之一。它允许你改变当前工作目录。你使用它在文件系统层级结构内进行移动。你也可以使用
    **cd** .


    -   **mv**: **mv** 命令用于将文件移动到其他位置或重命名文件。例如，**mv file sub** 会将原始文件重命名为 **sub**。
    **mv sub ~/Desktop** 将文件“sub”移动到你的桌面目录，但不重命名它。你必须指定一个新文件名来重命名文件。


    -   **ls**: **ls** 命令显示当前目录中的文件。结合某些选项使用，它可以让你看到文件大小、文件创建时间以及文件权限。例如，**ls ~**
    会显示你主目录中的文件。


    -   **chown**: **chown** 命令更改给定文件的用户和/或组所有权。如果仅提供所有者（用户名或数字用户 ID），则指定该用户为每个给定文件的拥有者，而文件的组保持不变。


    -   **cp**: **cp** 命令用于创建文件和目录的副本。例如，**cp file sub** 会创建你输入名称的文件的完全副本，并将副本命名为
    sub，但第一个文件仍然以其原始名称存在。


    -   **chmod**: **chmod** 命令更改所列文件的权限。权限基于一个相当简单的模型。你可以为用户、组和所有用户设置权限，并且可以设置每个组是否有权读取、写入或执行文件。


    -   **pwd**: **pwd** 命令打印当前工作目录的完整路径名（**pwd** 代表“print working directory”）。请注意，GNOME
    终端还会在其窗口标题栏中显示此信息。


    -   **rm**: **rm** 命令删除（移除）文件或目录。删除过程将文件系统中的一个文件名与存储设备上的数据分离，并将该空间标记为可用于未来的写入。换句话说，删除文件会增加磁盘上的可用空间。


    -   **clear**: **clear** 命令在可能的情况下清除你的屏幕。它会查找终端类型环境，然后在 terminfo 数据库中查找以决定如何清屏。这相当于在使用
    bash shell 时按 Ctrl-L。


    -   **mkdir**: 全称为“创建目录”，**mkdir** 用于在文件系统中创建目录，如果指定的目录尚不存在。例如，**mkdir work**
    创建一个 work 目录。调用 **mkdir** 时可以指定多个目录。


