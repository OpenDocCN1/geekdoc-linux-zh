    ## 在虚拟环境中安装 Linux


    **步骤 5** 点击“创建”后弹出的窗口询问您想要创建哪种类型的虚拟硬盘（映像）。在本例中，我们将使用默认的 VDI（VirtualBox 磁盘映像），因为其他选项通常用于将虚拟机从一个虚拟化应用程序迁移到另一个应用程序。请确保已选中
    VDI，然后点击“下一步”。


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_26_0.png)


    **步骤 6** 关于选择动态分配还是固定大小虚拟硬盘的问题，可能会让初学者感到有些困惑。动态分配的虚拟硬盘是一种更灵活的存储管理选项，最初不会占用物理硬盘的太多空间。请确保选中“动态分配”，然后点击“下一步”。


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_26_1.png)


    **步骤 7** 虚拟硬盘是一个单独的文件夹，其大小取决于您在此部分设置的数值。请确保虚拟硬盘在计算机上的位置有足够的可用空间。例如，我们在 D:\ 驱动器的更大存储空间选项中，将其命名为
    Linux Mint，并分配了 25.55GB 的空间给虚拟硬盘。


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_26_2.png)


    **步骤 8** 点击“创建”后，虚拟机的初始设置就完成了；现在您应该能在 VirtualBox 应用程序中看到新创建的虚拟机。不过，在开始之前，请单击“设置”按钮，并在“常规”部分点击“高级”选项卡。使用下拉菜单，将“共享剪贴板”和“拖放”都设置为“双向”。


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_26_3.png)


    **步骤 9** 接着点击“系统”部分，然后选择“处理器”选项卡。根据您的 CPU，分配尽可能多的核心，但请注意不要对宿主系统造成损害；我们选择了两个 CPU。现在点击“显示”部分，将“视频内存”滑块滑到最大值，并勾选“启用
    3D 加速”。点击“确定”以提交新设置。


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_26_4.png)


    **步骤 10** 点击“启动”按钮，并在“选择启动磁盘”窗口中使用资源管理器按钮（一个带有绿色箭头的文件夹）来定位下载好的 Mint ISO 文件；然后点击“下一步”以
    Linux Mint 现场环境启动虚拟机。现在，您可以按照标准 PC 安装要求安装 Linux 了。


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_26_5.png)


