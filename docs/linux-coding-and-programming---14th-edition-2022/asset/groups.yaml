    >

    > — 塞缪尔·克雷（电气工程师，克雷超级计算机的设计者/创始人）


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_27_0.png)


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_28_0.png)


    我们在此使用 Linux Mint 作为指导，因为它是一个易于使用的发行版，非常适合前 Windows 用户。它也是最开发完善、文档齐全的 Linux 发行版之一，并拥有一些出色的配置选项。


    在本节中，我们将介绍 Linux Mint Cinnamon 菜单和桌面环境，它是如何工作的，以及你可以如何对其进行自定义。想要创建另一个用户，甚至发现如何在网上匿名吗？请继续阅读。


