  - "[PAGE 111]\n\n# Python on Linux\n\n# Conditions and Loops\n\nConditions and loops\
    \ are what make a program interesting; they can be simple or rather complex. How\
    \ you use them depends greatly on what the program is trying to achieve; they\
    \ could be the number of lives left in a game or just displaying a countdown.\n\
    \n# TRUE CONDITIONS\n\nKeeping conditions simple to begin with makes learning\
    \ to program a more enjoyable experience. Let’s start then by checking if something\
    \ is TRUE, then doing something else if it isn’t.\n\nSTEP 1 Let’s create a new\
    \ Python program that will ask the user to input a word, then check it to see\
    \ if it’s a four-letter word or not. Start with File > New File, and begin with\
    \ the input variable:\n\n```\nword=input(\"Please enter a four-letter word: \"\
    )\n```\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_111_0.png)\n\nSTEP 2 Now we\
    \ can create a new variable, then use the len function and pass the word variable\
    \ through it to get the total number of letters the user has just entered:\n\n\
    ```\nword=input(\"Please enter a four-letter word: \")\nword_length=len(word)\n\
    ```\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_111_1.png)\n\nSTEP 3 Now you can\
    \ use an if statement to check if the word_length variable is equal to four and\
    \ print a friendly conformation if it applies to the rule:\n\n```\nword=input(\"\
    Please enter a four-letter word: \")\nword_length=len(word)\nif word_length ==\
    \ 4:\n    print (word, \"is a four-letter word. Well done.\")\n```\n\nThe double\
    \ equal sign (==) means check if something is equal to something else.\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_111_2.png)\n\
    \nSTEP 4 The colon at the end of IF tells Python that if this statement is true\
    \ do everything after the colon that’s indented. Next, move the cursor back to\
    \ the beginning of the Editor:\n\n```\nword=input(\"Please enter a four-letter\
    \ word: \")\nword_length=len(word)\nif word_length == 4:\n    print (word, \"\
    is a four-letter word. Well done.\")\nelse:\n    print (word, \"is not a four-letter\
    \ word.\")\n```\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_111_3.png)"
  - "[PAGE 112]\n\n# STEP 5\n\nPress F5 and save the code to execute it. Enter a four-letter\
    \ word in the Shell to begin with; you should have the returned message that it’s\
    \ the word it two letters. Now press F5 again and rerun the program but this time\
    \ enter a five-letter word. The Shell will display that it’s not a four-letter\
    \ word.\n\n# STEP 6\n\nNow expand the code to include another conditions. Eventually,\
    \ it could become quite complex. We’ve added a condition for three-letter words.\n\
    \n```\nword=input(\"Please enter a four-letter word: \")\nword_length=len(word)\n\
    if word_length == 4:\n    print (word, \"is a four-letter word. Well done.\")\n\
    elif word_length == 3:\n    print (word, \"is a three-letter word. Try again.\"\
    )\nelse:\n    print (word, \"is not a four-letter word.\")\n```\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_112_0.png)\n\
    \n![](img/d501697c83491ed0bb4b382b0d28ef0a_112_1.png)\n\n# LOOPS\n\nA loop looks\
    \ quite similar to a condition but they are somewhat different in their operation.\
    \ A loop will run through the same block of code a number of times, usually with\
    \ the support of a condition.\n\n# STEP 1\n\nLet’s start with a simple While statement.\
    \ Like if, this will check to see if something is TRUE, then run the indented\
    \ code.\n\n```\nx = 1\nwhile x < 10:\n    print (x)\n    x = x + 1\n```\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_112_2.png)\n\
    \n# STEP 3\n\nThe For loop is another example. For is used to loop over a range\
    \ of data, usually a list stored as variables inside square brackets. For example:\n\
    \n```\nwords=[\"Cat\", \"Dog\", \"Umbrella\"]\nfor word in words:\n    print (word)\n\
    ```\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_112_3.png)\n\n# STEP 2\n\nThe\
    \ difference between if and while is when while gets to the end of the indented\
    \ code, it goes back and checks the statement is still true. In our example x\
    \ is less than 10. With each loop it prints the current value of x, then adds\
    \ one to that value. When x does eventually equal 10 it stops.\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_112_4.png)\n\
    \n# STEP 4\n\nThe For loop can also be used in the countdown example by using\
    \ the range function:\n\n```\nfor x in range (1, 10):\n    print (x)\n```\n\n\
    The xxxx1 part isn’t needed here because the range function creates a list between\
    \ the first and last numbers used.\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_112_5.png)"
  - '[PAGE 113]


    # Python Modules


    We’ve mentioned modules previously, (the Math module) but as modules are such
    a large part of getting the most from Python, it’s worth dedicating a little more
    time to them. In this instance we’re using the Windows version of Python 3.


    # MASTERING MODULES


    Think of modules as an extension that’s imported into your Python code to enhance
    and extend its capabilities. There are countless modules available and as we’ve
    seen, you can even make your own.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_113_0.png)


    **STEP 1**

    Although good, the built-in functions within Python are limited. The use of modules,
    however, allows us to make more sophisticated programs. As you are aware, modules
    are Python scripts that are imported, such as import math.


    **STEP 3**

    The result is an error in the IDLE Shell, as the Pygame module isn’t recognised
    or installed in Python. To install a module we can use Pip (Pip Installs Packages).
    Close down the IDLE Shell and drop into a command prompt or Terminal session.
    At an elevated admin command prompt, enter:

    `pip install pygame`


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_113_1.png)


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_113_2.png)


    **STEP 2**

    Some modules, especially on the Raspberry Pi, are included by default, the Math
    module being a prime example. Sadly, other modules aren’t always available. A
    good example on non-Pi platforms is the Pygame module, which contains many functions
    to help create games. Try: `import pygame`.


    **STEP 4**

    The Pip installation requires an elevated status due the Pip installing components
    at different locations. Windows users can search for CMD via the Start button
    and right-click the result then click Run as Administrator. Linux and Mac users
    can use the sudo command, with `sudo pip install pygame`.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_113_3.png)'
  - "[PAGE 114]\n\n**STEP 5** Close the command prompt or Terminal and relaunch the\
    \ IDLE Shell. When you now enter: `import pyname`, the module will be imported\
    \ into the code without any problems. You’ll find that most code downloaded or\
    \ copied from the Internet will contain a module, mainstream of unique, these\
    \ are usually the source of errors in execution due to them being missing.\n\n\
    ![](img/d501697c83491ed0bb4b382b0d28ef0a_114_0.png)\n\n**STEP 8** Multiple modules\
    \ can be imported within your code. To extend our example, use:\n```python\nimport\
    \ random\nimport math\nfor i in range(5):\n  print(random.randint(1, 25))\nprint(math.pi)\n\
    ```\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_114_1.png)\n\n**STEP 6** The modules\
    \ contain the extra code needed to achieve a certain result within your own code,\
    \ as we’ve previously experimented with. For example:\n`import random`\nBrings\
    \ in the code from the Random Number Generator module. You can then use this module\
    \ to create something like:\n```python\nfor i in range(10):\n    print(random.randint(1,\
    \ 25))\n```\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_114_2.png)\n\n**STEP 9**\
    \ The result is a string of random numbers followed by the value of Pi as pulled\
    \ from the Math module using the print(math.pi) function. You can also pull in\
    \ certain functions from a module by using the from and import commands, such\
    \ as:\n```python\nfrom random import randint\nfor i in range(5):\n    print(randint(1,\
    \ 25))\n```\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_114_3.png)\n\n**STEP 7**\
    \ This code, when saved and executed, will display ten random numbers from 1 to\
    \ 25. You can play around with the code to display more or less, and from a great\
    \ or lesser range. For example:\n`import random`\n```python\nfor i in range(25):\n\
    \    print(random.randint(1, 100))\n```\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_114_4.png)\n\
    \n**STEP 10** This helps create a more streamlined approach to programming. You\
    \ can also use import module*, which will import everything defined within the\
    \ named module. However, it’s often regarded as a waste of resources but it works\
    \ nonetheless. Finally, modules can be imported as aliases:\n`import math as m`\n\
    `print(m.pi)`\nOf course, adding comments helps to tell others what’s going on.\n\
    \n![](img/d501697c83491ed0bb4b382b0d28ef0a_114_5.png)"
