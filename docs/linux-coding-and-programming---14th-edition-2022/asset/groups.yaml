    此时你可能需要重启 Linux Mint，所以现在执行此操作。重启后，再次点击菜单按钮，然后选择终端。终端图标位于左侧列中，文件图标上方。打开终端后，输入：`sudo
    apt-get install libdvd-pkg`，按回车并输入你的密码。这将启用加密 DVD 播放功能。


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_34_2.png)


    **步骤 8**

    当被要求接受更改时，输入 Y，当被要求配置 libdvd 时也输入 Y。确保“确定”被选中，按回车，然后对后续任何问题输入“是”。接下来，仍在终端中，输入：`cat
    /proc/sys/vm/swappiness`；结果应为 60。如果你的电脑内存（RAM）少于 4GB，则输入：`gksudo xed /etc/sysctl.conf`。


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_34_3.png)


    **步骤 9**

    此调整有助于加速内存少于 4GB 的系统。滚动到刚刚打开的文件的底部，并添加以下新行：


