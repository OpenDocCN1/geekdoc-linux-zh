    \ ELSE 将遍历选项，如果你选择了错误的选项，则会带你回到开始。\n\n  ![](img/d501697c83491ed0bb4b382b0d28ef0a_73_1.png)\n\
    \n- **步骤 3**\n  当然，你可以增加选择数量，但你必须确保选择数量与 IF 语句数量相匹配。脚本可能会迅速变成一个看起来非常繁忙的屏幕。这个冗长的脚本是显示菜单的另一种方式，这次还附带了一个精美的配色方案。\n\
