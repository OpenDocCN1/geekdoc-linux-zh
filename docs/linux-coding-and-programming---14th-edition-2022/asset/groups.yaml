    # Creating Bash Scripts – Part 5


    **STEP 5** When executed the script waits for input from the user, in this case
    the file extension, such as jpg, mp4 and so on. It’s not very friendly though.
    Let’s make it a little friendlier. Add an echo, like echo -n “Please enter the
    extension of the file you’re looking for: “, just before the read command.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_76_0.png)


    **STEP 6** Here’s an interesting, fun kind of script using the app espeak. Install
    espeak with sudo apt-get install espeak, then enter the text below into a new
    script called speak.sh. As you can see it’s a refresh of the first greeting script
    we ran. Only this time, it uses the variables in the espeak output.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_76_1.png)


    **STEP 7** We briefly looked at putting some colours in the output for our scripts.
    Whilst it’s too long to dig a little deeper into the colour options, here’s a
    script that outputs what’s available. Create a new script called colours.sh and
    enter the text (see below) into it.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_76_2.png)


    **STEP 8** The output from colours.sh can, of course, be mixed together, bringing
    different effects depending on what you want the output to say. For example, white
    text in a red background flashing (or blinking). Sadly the blinking effect doesn’t
    work on all Terminals, so you may need to change to a different Terminal.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_76_3.png)


    **STEP 9** Whilst we’re on making fancy scripts, how about using Zenity to output
    a graphical interface? Enter what you see below into a new script, menus.sh. Make
    it executable and then run it. You should have a couple of dialogue boxes appear,
    followed by a Final message.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_76_4.png)


    **STEP 10** While gaming in a Bash script isn’t something that’s often touched
    upon, it is entirely possible, albeit, a little basic. If you fancy playing a
    game, enter wget https://github.com/bruxu/regret.cz/1/tmux/housenka/housenka.sh,
    make the script executable and run it. It’s in Polish, written by Martin Bruchanov
    but we’re sure you can modify it. Hint: the title screen is in Base64.


