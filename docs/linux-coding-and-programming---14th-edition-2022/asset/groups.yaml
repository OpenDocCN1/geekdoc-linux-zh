  - '[PAGE 61]


    # # More Fun Things to do in the Terminal


    If the previous list of fun, and quite bizarre, things to do in the Terminal has
    you wanting more, you''re in luck. We''ve put together another batch of some useful,
    and some not so useful, commands for you to try out.


    # MORE FUN, YAY


    Since the Terminal session is already open, and your keyboard digits are nicely
    warmed up, here are another two pages of Terminal nonsense.


    +   STEP 1 Remember the old ZX Spectrum days of computing, when you could type
    in 10 print "Hello", 20 goto 10 and Hello would list down the screen? Well, in
    Linux Mint you can do the same. Simply enter yes followed by some text, i.e. yes
    Linux is ace. It''ll keep going until you press Ctrl+C.


    +   STEP 3 Having a little white cat chase your mouse pointer around the desktop
    may sound like a terrible waste of time. Oddly though, it isn''t. Enter: sudo
    apt-get install oneko, then type oneko to have the cat appear. Move your ''mouse''
    cursor around the screen and the cat will chase it. Use Ctrl+C to exit the action.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_61_0.png)


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_61_1.png)


    +   STEP 2 The Matrix was one of the most graphically copied films ever released;
    there''s even a version of the Matrix code available for Linux Mint. Install it
    with: sudo apt-get install cmatrix. When it''s done enter: cmatrix and follow
    the white rabbit. Neo. Unlike the real Matrix though, you can press Ctrl+C to
    exit.


    +   STEP 4 This entry is a little more serious than the previous. It''s called
    the Fork Bomb and what it does, basically, is continuously replicate itself until
    it has used up all the available system resources, thus causing your computer
    to crash. You don''t have to try it but it''s interesting nonetheless. Simply
    enter :(){ :|& }; and be prepared to reboot.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_61_2.png)


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_61_3.png)'
  - '[PAGE 62]


    # More Fun Things to do in the Terminal


    **STEP 5** Stringing several commands and piping them through other commands is
    what makes scripting such a powerful element to an OS. Using the `while` command,
    for example, together with ` toilet`, can yield some impressive results. Enter:

    `while true; do echo "$$(date +%4D %T)" | toilet -f term -F border --meta);";
    sleep 1; done.`


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_62_0.png)


    **STEP 6** Talking computers were the craze of the 80s, enter: `espeak: "Hello,
    this is Linux Mint"` to have the computer repeat the text inside the quotes to
    you. Make sure your volume is turned up, and try the following: `ls > folders.txt
    && espeak -f folders.txt`. This will have Mint read back the contents of the `ls`
    command.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_62_1.png)


    **STEP 7** A roaring ASCII fire isn’t the most useful command to have at your
    disposal, but it’s fun. Install it with:

    `sudo apt-get install libaa-bin`, then when installed use:

    `aafire`. It’s not exactly warming but you get the idea. To expand the above,
    enter: `sudo apt-get install bb caca-utils`, then,

    `cacafire`.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_62_2.png)


    **STEP 8** Used as a music demo from the old Amiga and DOS days, the `bb` command
    reminds us of getting hold of three and a half inch Floppies crammed with all
    manner of demoscene goodies. We’ve already installed `bb` from the previous step,
    so just enter `bb`. Follow the on-screen instructions, and turn up your volume.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_62_3.png)


    **STEP 9** This entry is in two parts. First you need to get hold of the necessary
    packages: `sudo apt-get install libcurves-perl`. When that’s done enter: `cd Downloads/
    && wget http://search.cpan.org/CPAN/authors/id/X/XB/XBAUCOM/Term-Animation-2.4.tar.gz
    && tar -xf Term-Animation-2.4.tar.gz && cd Term-Animation-2.4/. Then: `perl Makefile.PL
    && make && make test && sudo make install.`


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_62_4.png)


    **STEP 10** With that little lot done, onto the next: `Enter: cd ... && wget http://www.robo
    bunny.com/projects/asciiaquarium/asciiaquarium.tar.gz && tar -xf asciiaquarium.tar.gz
    && cd asciiaquarium-1.1/ && chmod +x asciiaquarium. Providing all went well, enter
    `./asciiaquarium` and enjoy your very own ASCII-based aquarium.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_62_5.png)'
  md: "\n# Fun Things to do in the Terminal\n\nDespite the seriousness of an operating\
    \ system, the Linux community are certainly no strangers to a bit of fun. The\
    \ developers over the years have created and inserted all manner of fun and odd\
    \ elements into the Terminal.\n\n## TERMINAL FUN\n\nYou’ll be working exclusively\
    \ in the Terminal for these next two sections, so start warming up your fingers.\
    \ After all, all work and no play... as the saying goes.\n\n- **STEP 1** The first\
    \ command we’re going to use is `sl`, it’s not installed by default so enter:\
    \ `sudo apt-get install sl`. The command can be run with `sl` and when executed\
    \ will display a Steam Locomotive travelling across the screen (hence ‘sl’). Entering\
    \ `LS`, note the upper case, also works.\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_59_0.png)\n\
    \n![](img/d501697c83491ed0bb4b382b0d28ef0a_59_1.png)\n\n- **STEP 2** Fans of Star\
    \ Wars even get a fix when it comes to the Terminal. By linking to a remote server\
    \ via the `telnet` command, you can watch *Episode IV: A New Hope* being played\
    \ out, albeit in ASCII. To view this spectacle, enter: `telnet towel.blinkenlights.nl`.\n\
    \n- **STEP 3** If you’ve ever fancied having the computer read a random fortune\
    \ out to you, then you’re in luck. Most distros require you to install the fortune\
    \ app, however Linux Mint differs somewhat by having it already pre-loaded. All\
    \ you need to do is enter the command `fortune` into the Terminal, and enjoy.\n\
    \n- **STEP 4** The `rev` command is certainly interesting, and at first what seems\
    \ a quite useless addition to the OS. However, it can be used to create some seemingly\
    \ unbreakable passwords. Enter `rev`, now type some text, when you press **Enter**\
    \ next, everything you typed in will be reversed. Press **Ctrl+C** to exit.\n\n\
    ![](img/d501697c83491ed0bb4b382b0d28ef0a_59_2.png)\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_59_3.png)\n\
    \n- **STEP 5** If you're stuck trying to work out all the possible factors for\
    \ any particular number, simply enter **factor** followed by the number. For example,\
    \ **factor** `7` doesn't offer much output, whereas **factor** `60` displays more.\n\
    \n![](img/f501697c83491ed0bb4b382b0d28ef0a_60_0.png)\n\n- **STEP 6** There's a\
    \ fine line between the rather cool and really-quite-weird. Having an ASCII cow\
    \ repeat text to you could potentially fall in the latter. Enter **cowsay** followed\
    \ by any text you want, such as **cowsay** `Linux Mint is ocel`.\n\nIn fact, you\
    \ can even output the `ls` command through the cow, by entering `ls` | **cowboy**.\n\
    \n![](img/f501697c83491ed0bb4b382b0d28ef0a_60_1.png)\n\n- **STEP 7** To further\
    \ the cow element, there's even a graphical, non-Terminal, cow available. Install\
    \ it with: `sudo apt-get install xcowsay`, then when it's installed enter something\
    \ similar to cowsay, such as `xcowsay BDM Publications`.\n\n![](img/f501697c83491ed0bb4b382b0d28ef0a_60_2.png)\n\
    \n- **STEP 8** If you really want to expand the whole cow thing, there, for whatever\
    \ reason, you can pipe the fortune command through it, with **fortune** | **cowsay**,\
    \ and for the graphical cow equivalent: **fortune** | **xcowsay**. Plus, there's\
    \ always cowthink. Try: **cowthink** `This book is awesome`.\n\n![](img/f501697c83491ed0bb4b382b0d28ef0a_60_3.png)\n\
    \n- **STEP 9** The command **toilet** doesn't inspire much confidence, we'll admit.\
    \ However, it's not as bad as it first sounds. Start by installing it with: `sudo\
    \ apt-get install toilet`. Then when installed, type either the a line of: **toilet**\
    \ `David`. Or perhaps list the contents of the current folder through it, with\
    \ `ls` | **toilet**.\n\n![](img/f501697c83491ed0bb4b382b0d28ef0a_60_4.png)\n\n\
    - **STEP 10** Expanding the toilet command, you can actually generate some decent\
    \ looking graphics through it. For example, try this: **toilet** `-f mono12 -F\
    \ metal David`. You can enter **toilet** `--help`, for a list of the command line\
    \ arguments to use a little further.\n\n![](img/f501697c83491ed0bb4b382b0d28ef0a_60_5.png)\n\
    \n# More Fun Things to do in the Terminal\n\nIf the previous list of fun, and\
    \ quite bizarre, things to do in the Terminal has you wanting more, you're in\
    \ luck. We've put together another batch of some useful, and some not so useful,\
    \ commands for you to try out.\n\n## MORE FUN, YAY\n\nSince the Terminal session\
    \ is already open, and your keyboard digits are nicely warmed up, here are another\
    \ two pages of Terminal nonsense.\n\n- **STEP 1** Remember the old ZX Spectrum\
    \ days of computing, when you could type in 10 print \"Hello\", 20 goto 10 and\
    \ Hello would list down the screen? Well, in Linux Mint you can do the same. Simply\
    \ enter yes followed by some text, i.e. `yes Linux is ace`. It'll keep going until\
    \ you press `Ctrl+C`.\n\n- **STEP 2** The Matrix was one of the most graphically\
    \ copied films ever released; there's even a version of the Matrix code available\
    \ for Linux Mint. Install it with: `sudo apt-get install cmatrix`. When it's done\
    \ enter: `cmatrix` and follow the white rabbit. Neo. Unlike the real Matrix though,\
    \ you can press `Ctrl+C` to exit.\n\n![](img/f501697c83491ed0bb4b382b0d28ef0a_61_0.png)\n\
    \n![](img/f501697c83491ed0bb4b382b0d28ef0a_61_1.png)\n\n- **STEP 3** Having a\
    \ little white cat chase your mouse pointer around the desktop may sound like\
    \ a terrible waste of time. Oddly though, it isn't. Enter: `sudo apt-get install\
    \ oneko`, then type `oneko` to have the cat appear. Move your 'mouse' cursor around\
    \ the screen and the cat will chase it. Use `Ctrl+C` to exit the action.\n\n-\
    \ **STEP 4** This entry is a little more serious than the previous. It's called\
    \ the Fork Bomb and what it does, basically, is continuously replicate itself\
    \ until it has used up all the available system resources, thus causing your computer\
    \ to crash. You don't have to try it but it's interesting nonetheless. Simply\
    \ enter `:(){ :|& };` and be prepared to reboot.\n\n![](img/f501697c83491ed0bb4b382b0d28ef0a_61_2.png)\n\
    \n![](img/f501697c83491ed0bb4b382b0d28ef0a_61_3.png)\n\n- **STEP 5** Stringing\
    \ several commands and piping them through other commands is what makes scripting\
    \ such a powerful element to an OS. Using the `while` command, for example, together\
    \ with `toilet`, can yield some impressive results. Enter:\n  `while true; do\
    \ echo \"$$(date +%4D %T)\" | toilet -f term -F border --meta);\"; sleep 1; done.`\n\
    \n![](img/f501697c83491ed0bb4b382b0d28ef0a_62_0.png)\n\n- **STEP 6** Talking computers\
    \ were the craze of the 80s, enter: `espeak: \"Hello, this is Linux Mint\"` to\
    \ have the computer repeat the text inside the quotes to you. Make sure your volume\
    \ is turned up, and try the following: `ls > folders.txt && espeak -f folders.txt`.\
    \ This will have Mint read back the contents of the `ls` command.\n\n![](img/f501697c83491ed0bb4b382b0d28ef0a_62_1.png)\n\
    \n- **STEP 7** A roaring ASCII fire isn’t the most useful command to have at your\
    \ disposal, but it’s fun. Install it with: `sudo apt-get install libaa-bin`, then\
    \ when installed use: `aafire`. It’s not exactly warming but you get the idea.\
    \ To expand the above, enter: `sudo apt-get install bb caca-utils`, then, `cacafire`.\n\
    \n![](img/f501697c83491ed0bb4b382b0d28ef0a_62_2.png)\n\n- **STEP 8** Used as a\
    \ music demo from the old Amiga and DOS days, the `bb` command reminds us of getting\
    \ hold of three and a half inch Floppies crammed with all manner of demoscene\
    \ goodies. We’ve already installed `bb` from the previous step, so just enter\
    \ `bb`. Follow the on-screen instructions, and turn up your volume.\n\n![](img/f501697c83491ed0bb4b382b0d28ef0a_62_3.png)\n\
    \n- **STEP 9** This entry is in two parts. First you need to get hold of the necessary\
    \ packages: `sudo apt-get install libcurves-perl`. When that’s done enter: `cd\
    \ Downloads/ && wget http://search.cpan.org/CPAN/authors/id/X/XB/XBAUCOM/Term-Animation-2.4.tar.gz\
    \ && tar -xf Term-Animation-2.4.tar.gz && cd Term-Animation-2.4/. Then: `perl\
    \ Makefile.PL && make && make test && sudo make install.`\n\n![](img/f501697c83491ed0bb4b382b0d28ef0a_62_4.png)\n\
    \n- **STEP 10** With that little lot done, onto the next: `Enter: cd ... && wget\
    \ http://www.robo bunny.com/projects/asciiaquarium/asciiaquarium.tar.gz && tar\
    \ -xf asciiaquarium.tar.gz && cd asciiaquarium-1.1/ && chmod +x asciiaquarium.`\
    \ Providing all went well, enter `./asciiaquarium` and enjoy your very own ASCII-based\
    \ aquarium.\n\n![](img/f501697c83491ed0bb4b382b0d28ef0a_62_5.png)\n"
  mdcn: "\n\n# 在终端里可以玩的有趣事物\n\n尽管操作系统听起来很严肃，但 Linux 社区的人显然对娱乐毫不陌生。多年来，开发者们已经在终端中创建并植入了各种有趣且怪异的元素。\n\
    \n## 终端趣味\n\n接下来的两个部分将完全在终端中操作，所以请准备好你的手指。毕竟，只工作不玩耍... 正如俗话说的那样。\n\n- **步骤 1**\
    \ 我们要使用的第一个命令是 `sl`，它默认未安装，因此请输入：`sudo apt-get install sl`。运行该命令时只需输入 `sl`，执行后屏幕会显示一列蒸汽机车行驶的画面（这就是“sl”的由来）。输入\
    \ `LS`，注意是大写，也能正常工作。\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_59_0.png)\n\n\
    ![](img/d501697c83491ed0bb4b382b0d28ef0a_59_1.png)\n\n- **步骤 2** 即使是《星球大战》的粉丝在终端里也能得到满足。通过\
    \ `telnet` 命令连接到远程服务器，你可以观看 *第四集：新希望* 的播放，尽管是以 ASCII 字符形式呈现。要观看这一奇观，请输入：`telnet\
    \ towel.blinkenlights.nl`。\n\n- **步骤 3** 如果你曾想过让电脑为你朗读一句随机名言，那你运气不错。大多数发行版要求你安装\
    \ fortune 应用，但 Linux Mint 有些不同，它已经预装了该应用。你只需在终端中输入命令 `fortune`，然后享受即可。\n\n- **步骤\
    \ 4** `rev` 命令确实很有趣，乍一看似乎是对操作系统一个完全无用的添加。然而，它可以用来创建一些看似无法破解的密码。输入 `rev`，然后输入一些文本，当你按\
    \ **Enter** 键时，你输入的所有内容都会被反转。按 **Ctrl+C** 退出。\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_59_2.png)\n\
    \n![](img/d501697c83491ed0bb4b382b0d28ef0a_59_3.png)\n\n- **步骤 5** 如果你卡在试图找出某个特定数字的所有可能因子上，只需输入\
    \ **factor** 后跟该数字。例如，**factor** `7` 提供的输出不多，而 **factor** `60` 会显示更多。\n\n![](img/f501697c83491ed0bb4b382b0d28ef0a_60_0.png)\n\
    \n- **步骤 6** 酷炫和真的很奇怪之间有一条微妙的界限。让一只 ASCII 牛向你重复文字，这可能属于后者。输入 **cowsay** 后跟任何你想说的文本，例如\
    \ **cowsay** `Linux Mint is ocel`。\n\n实际上，你甚至可以通过牛输出 `ls` 命令，只需输入 `ls` | **cowboy**。\n\
    \n![](img/f501697c83491ed0bb4b382b0d28ef0a_60_1.png)\n\n- **步骤 7** 为了进一步拓展“牛”的元素，甚至还有一个图形的、非终端的牛可用。用\
    \ `sudo apt-get install xcowsay` 安装它，安装后输入类似于 cowsay 的内容，例如 `xcowsay BDM Publications`。\n\
    \n![](img/f501697c83491ed0bb4b382b0d28ef0a_60_2.png)\n\n- **步骤 8** 如果你真的想扩展整个“牛”的主题，无论出于什么原因，你都可以通过管道将\
    \ fortune 命令传递给它，使用 **fortune** | **cowsay**，图形牛对应的则是：**fortune** | **xcowsay**。此外，还有\
    \ cowthink。尝试：**cowthink** `This book is awesome`。\n\n![](img/f501697c83491ed0bb4b382b0d28ef0a_60_3.png)\n\
    \n- **步骤 9** 命令 **toilet** 不会给人多少信心，我们承认。然而，它并不像听起来那么糟糕。首先使用 `sudo apt-get install\
    \ toilet` 进行安装。安装完成后，输入一行 **toilet** `David`。或者，也许可以通过管道列出当前文件夹的内容，使用 `ls` | **toilet**。\n\
    \n![](img/f501697c83491ed0bb4b382b0d28ef0a_60_4.png)\n\n- **步骤 10** 扩展 toilet\
    \ 命令，你实际上可以通过它生成一些外观不错的图形。例如，尝试这个：**toilet** `-f mono12 -F metal David`。你可以输入\
    \ **toilet** `--help`，以查看命令行参数列表，以便进一步使用。\n\n![](img/f501697c83491ed0bb4b382b0d28ef0a_60_5.png)\n\
    \n# 在终端里可以做的更多有趣事物\n\n如果之前列出的那些有趣且相当怪异的行为让你想要更多，那你很幸运。我们为你整理了另一批有用的（以及一些没什么用的）命令供你尝试。\n\
    \n## 更多乐趣，耶\n\n既然终端会话已经打开，且你的键盘手指已经热身完毕，这里还有两页终端的胡闹内容。\n\n- **步骤 1** 还记得 ZX Spectrum\
    \ 时代的计算吗，那时你可以输入 10 print \"Hello\", 20 goto 10，然后 Hello 会在屏幕上列表下来？在 Linux Mint\
    \ 中你可以做同样的事。只需输入 yes 后跟一些文本，例如 `yes Linux is ace`。它会一直运行，直到你按下 `Ctrl+C`。\n\n-\
    \ **步骤 2** 《黑客帝国》是曾经发行的视觉效果被模仿最多的电影之一；Linux Mint 上甚至有一个黑客帝国代码的版本。使用 `sudo apt-get\
    \ install cmatrix` 安装它。完成后输入：`cmatrix` 并追随白兔。尼奥。不过与真正的黑客帝国不同的是，你可以按 `Ctrl+C` 退出。\n\
    \n![](img/f501697c83491ed0bb4b382b0d28ef0a_61_0.png)\n\n![](img/f501697c83491ed0bb4b382b0d28ef0a_61_1.png)\n\
    \n- **步骤 3** 让一只小白猫在桌面上追逐你的鼠标指针听起来可能是一种巨大的时间浪费。奇怪的是，事实并非如此。输入：`sudo apt-get install\
    \ oneko`，然后键入 `oneko` 让猫出现。在屏幕上移动你的“鼠标”光标，猫就会追逐它。使用 `Ctrl+C` 退出操作。\n\n- **步骤 4**\
    \ 这一项比前面的稍微严肃一点。它被称为 Fork Bomb（叉子炸弹），其基本作用是持续复制自身，直到耗尽所有可用的系统资源，从而导致你的计算机崩溃。你不必尝试它，但它确实很有趣。只需输入\
    \ `:(){ :|& };` 并准备好重新启动。\n\n![](img/f501697c83491ed0bb4b382b0d28ef0a_61_2.png)\n\
    \n![](img/f501697c83491ed0bb4b382b0d28ef0a_61_3.png)\n\n- **步骤 5** 串联多个命令并通过管道传递给其他命令，这正是脚本成为操作系统强大元素的原因。例如，使用\
    \ `while` 命令配合 `toilet`，可以产生一些令人印象深刻的结果。输入：\n  `while true; do echo \"$$(date\
    \ +%4D %T)\" | toilet -f term -F border --meta);\"; sleep 1; done.`\n\n![](img/f501697c83491ed0bb4b382b0d28ef0a_62_0.png)\n\
    \n- **步骤 6** 会说话的计算机是 80 年代的潮流，输入：`espeak: \"Hello, this is Linux Mint\"` 让计算机向你重复引号内的文本。确保你的音量已调高，并尝试以下内容：`ls\
    \ > folders.txt && espeak -f folders.txt`。这将让 Mint 朗读 `ls` 命令的内容。\n\n![](img/f501697c83491ed0bb4b382b0d28ef0a_62_1.png)\n\
    \n- **步骤 7** 喧嚣的 ASCII 火焰并不是最实用的命令，但它很有趣。使用 `sudo apt-get install libaa-bin` 安装它，安装完成后使用：`aafire`。它并不真正保暖，但你能理解其中的意思。要扩展上述内容，输入：`sudo\
    \ apt-get install bb caca-utils`，然后，`cacafire`。\n\n![](img/f501697c83491ed0bb4b382b0d28ef0a_62_2.png)\n\
    \n- **步骤 8** 作为旧 Amiga 和 DOS 时代的音乐演示，`bb` 命令让我们回想起那些塞满了各种演示场景珍品的 3.5 英寸软盘。我们在前一步已经安装了\
    \ `bb`，所以只需输入 `bb`。遵循屏幕上的说明，并调高音量。\n\n![](img/f501697c83491ed0bb4b382b0d28ef0a_62_3.png)\n\
    \n- **步骤 9** 这一项分为两部分。首先你需要获取必要的软件包：`sudo apt-get install libcurves-perl`。完成后输入：`cd\
    \ Downloads/ && wget http://search.cpan.org/CPAN/authors/id/X/XB/XBAUCOM/Term-Animation-2.4.tar.gz\
    \ && tar -xf Term-Animation-2.4.tar.gz && cd Term-Animation-2.4/`。然后：`perl Makefile.PL\
    \ && make && make test && sudo make install.`\n\n![](img/f501697c83491ed0bb4b382b0d28ef0a_62_4.png)\n\
    \n- **步骤 10** 完成上面那一小部分后，进入下一步：`Enter: cd ... && wget http://www.robo bunny.com/projects/asciiaquarium/asciiaquarium.tar.gz\
    \ && tar -xf asciiaquarium.tar.gz && cd asciiaquarium-1.1/ && chmod +x asciiaquarium.`\
    \ 如果一切顺利，输入 `./asciiaquarium` 并享受你专属的基于 ASCII 的鱼缸。\n\n![](img/f501697c83491ed0bb4b382b0d28ef0a_62_5.png)\n\
    \n"
