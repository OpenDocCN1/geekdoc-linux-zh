  - "[PAGE 63]\n\n# Linux Tips and Tricks\n\nAs you’ve seen, the **Linux Terminal**\
    \ is quite an exceptional environment. With a few extra apps installed, and a\
    \ smidgen of command knowledge, incredible, and often quite strange, things can\
    \ be accomplished.\n\n# TAKING COMMAND\n\nThere are countless Linux tips, secrets,\
    \ hacks and tricks out there. Some are very old, originating from Linux’s Unix\
    \ heritage, while others are recent additions to Linux lore. Here’s our favourite\
    \ ten tips and tricks.\n\n# EASTER EGGS\n\nEmacs, the text editor, is a great\
    \ piece of software, however, did you know it also contains a hidden Easter Egg?\
    \ With Emacs installed (**sudo apt-get install emacs25**), drop to a Terminal\
    \ session and enter:\n\n`emacs -batch -l dunnet`\n\nDunnet is a text adventure\
    \ written by Ron Schnell in 1982, and hidden in Emacs since 1994.\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_63_0.png)\n\
    \n# TERMINAL BROWSING\n\nEver fancied being able to browse the Internet from the\
    \ Terminal? While not particularly useful, it is quite a fascinating thing to\
    \ behold. To do so, enter:\n\n`sudo apt-get install elinks elinks`\n\nEnter the\
    \ website you want to visit.\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_63_1.png)\n\
    \n# MOON BUGGY\n\nBased on the classic 1982 arcade game, Moon Patrol, Moon Buggy\
    \ appeared on the home computers of 1985 amid much praise. It’s a cracking Atari\
    \ game, and is available in the Linux Terminal by entering:\n\n`sudo apt-get install\
    \ moon-buggy`\n\nThen:\n\n`moon-buggy`\n\nEnjoy.\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_63_2.png)\n\
    \n# LET IT SNOW\n\nSnowing in the Terminal console isn’t something you come across\
    \ every day. If you’re interested, however, enter:\n\n`wget -x //gist.githubusercontent.com/sontek/1505483/raw/7d024716a457e69fb52632fee09f42753361c402/snowjob.sh`\
    \ \n`chmod +x snowjob.sh` \n`. /snowjob.sh`\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_63_3.png)"
  - '[PAGE 64]


    # MEMORY HOGS


    If you need to see what apps are consuming the most memory on Linux, simply enter:


    ```

    ps aux | sort -rnk 4

    ```


    This sorts the output by system memory use.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_64_0.png)


    # BBS


    Back in the days of dial-up connections, the online world was made up of Bulletin
    Board Systems. These remote servers provided hang-outs for users to chat, swap
    code, play games and more. Using telnet in Linux, we can still connect to some
    active BBSes:


    ```

    telnet battletestarbs.dynDNS.org

    ```


    There are countless operational BBSes available, check out [https://www.telnetbbsguide.com/bbs/list/detail/](https://www.telnetbbsguide.com/bbs/list/detail/),
    for more.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_64_1.png)


    # SHREDDER


    When you delete a file, there’s a chance of someone with the right software being
    able to retrieve it. However, to securely and permanently delete a file, use Shred:


    ```

    shred -zvu NAMEOFFILE.txt

    ```


    Replace NAMEOFFILE with the name of the file to delete.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_64_2.png)


    # DIRECTORY TREES


    If you want to create an entire directory (or folder) tree with a single command,
    you can use:


    ```

    mkdir -p New-Dir/ {subfolder1,subfolder2,subfolder3,subfolder4}

    ```


    This creates a New-Dir with four sub folders within.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_64_3.png)


    # ASCII ART


    ASCII art can be quite striking when applied to some images. However, it’s often
    difficult to get just right. You can create some great ASCII art from the images
    you have using img2txt:


    ```

    img2txt NAMEOFIMAGEFILE.png

    ```


    Replace NAMEOFIMAGEFILE with the actual name of the image file on your system.
    if img2txt install not installed, use:


    ```

    sudo apt-get install caca-utils.

    ```


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_64_4.png)


    # FORGOTTEN COMMANDS


    It’s not easy trying to remember all the available Linux commands. Thankfully,
    we can use apropos to help us. Simply use it, along with a description of the
    command:


    ```

    apropos "copy files"

    apropos "rename files"

    ```


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_64_5.png)'
