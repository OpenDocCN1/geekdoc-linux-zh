    [GCC 4.9.1] on linux\nType \"copyright\", \"credits\" or \"license\"() for more\
    \ information.\n>>> age=input(\"How old are you ?\")\n'44'\n>>> type(age)\n<class\
    \ \"str\">\n```\n```\n\n+   STEP 8  This presents a bit of a problem when you\
    \ want to work with a number that's been inputted by the user, as age + 10 won't\
    \ work due to being a string variable and an integer. Instead, you need to enter:\n\
