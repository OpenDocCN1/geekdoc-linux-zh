    >>> age=input (\"How old are you ?\")\n'44'\n>>> type(age)\n<class \"str\">\n\
    >>> age=10\nTraceback (most recent call last):\n  File \"<pyshell#12>\", line\
    \ 1, in <module>\n    age= 10\nTypeError: Can't convert 'int' object to str implicitly\n\
    >>> int(age) + 10\n54\n```\n```\n\n+   STEP 9  The use of TypeCasting is also\
    \ important when dealing with floating point arithmetic; remember: numbers that\
    \ have a decimal point in them. For example, enter:\n+   \n+   shirt=19.99\n+\
    \   \n+   Now enter type(shirt) and you'll see that Python has allocated the number\
