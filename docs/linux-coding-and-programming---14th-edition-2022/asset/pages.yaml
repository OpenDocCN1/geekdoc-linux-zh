    \ Hello\nHello(\"David\")\n```\n```\n\nPress F5 to save and execute the code.\n\
    \n![](img/d501697c83491ed0bb4b382b0d28ef0a_110_3.png)\n\n# STEP 2\n\nLet's now\
    \ expand the function to accept a variable, the user's name for example. Edit\
    \ your script to read:\n\n```\n```python\ndef Hello(name):\n  print(\"Hello\"\
    , name)\nHello(\"David\")\n```\n```\n\nThis will now accept the variable name,\
    \ otherwise it prints Hello David, in the Shell, enter name=\"Bob\" then: Hello(name).\
    \ Your function can now pass variables through it.\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_110_4.png)\n\
    \n# STEP 4\n\nWhat you've just done is import the Hello function from the saved\
