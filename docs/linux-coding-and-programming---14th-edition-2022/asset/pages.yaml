- pgno: 105
  md: "# # Working with Variables\n\nWe’ve seen some examples of variables in our\
    \ Python code already but it’s always worth going through the way they operate\
    \ and how Python creates and assigns certain values to a variable.\n\n# ## VARIOUS\
    \ VARIABLES\n\nYou’ll be working with the Python 3 IDLE Shell in this tutorial.\
    \ If you haven’t already, open Python 3 or close down the previous IDLE Shell\
    \ to clear up any old code.\n\n+   *   **STEP 1**\n+       In some programming\
    \ languages you’re required to use a dollar sign to denote a string, which is\
    \ a variable made up of multiple characters, such as a name of a person. In Python\
    \ this isn’t necessary. For example, in the Shell enter: **name**=\"David Hayward\"\
    \ (or use your own name, unless you’re also called David Hayward).\n\n+   *  \
    \ **STEP 3**\n+       You’ve seen previously that variables can be concatenated\
    \ using the plus symbol between the variable names. In our example we can use:\
    \ **print (name + “: “ + title)**. The middle part between the quotations allows\
    \ us to add a colon and a space, as variables are connected without spaces, so\
    \ we need to add them manually.\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_105_0.png)\n\
    \n![](img/d501697c83491ed0bb4b382b0d28ef0a_105_1.png)\n\n+   *   **STEP 2**\n\
    +       You can check the type of variable in use by issuing the **type ()** command,\
    \ placing the name of the variable inside the brackets. In our example, this would\
    \ be: **type (name)**. Add a new string variable: **title**=\"Descended from Vikings\"\
    .\n\n+   *   **STEP 4**\n+       You can also combine variables within another\
    \ variable. For example, to combine both name and title variables into a new variable\
    \ we use: **character**=**name** + “: “ + **title**\n+   \n+       Then output\
    \ the content of the new variable as: **print (character)**\n+   \n+       Numbers\
    \ are stored as different variables: **age**=44\n+   \n+       **Type (age)**\n\
    +   \n+       Which, as we know, are integers."
