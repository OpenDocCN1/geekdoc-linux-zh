- pgno: 130
  md: "# ## C++ COMMENTS\n\nCommenting in C++ involves using a double forward slash\
    \ `//` or a forward slash and an asterisk `/*`. You've already seen some brief\
    \ examples but this is how they work.\n\n**STEP 1** Using the Hello World code\
    \ as an example, you can easily comment on different sections of the code using\
    \ the double forward slash:\n\n```\n```cpp\n//My first C++ program\ncout << \"\
    Hello, world!\\n\";\n```\n```\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_130_0.png)\n\
    \n**STEP 2** However, you can also add comments to the end of a line of code,\
    \ to describe in a better way what's going on:\n\n```\n```cpp\ncout << \"Hello,\
    \ world!\\n\"; //This line outputs the words \"Hello, world\". The \\n denotes\
    \ a new line.\n```\n```\n\nNote, you don't have to put a semicolon at the end\
    \ of a comment. This is because it's a line in the code that's ignored by the\
    \ compiler.\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_130_1.png)\n\n**STEP 3**\
    \ You can comment out several lines by using the forward slash and asterisk:\n\
    \n```\n```cpp\n/* This comment can\n * cover several lines\n * without the need\
    \ to add more slashes */\n```\n```\n\nJust remember to finish the block comment\
    \ with the opposite asterisk and forward slash.\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_130_2.png)\n\
    \n**STEP 4** Be careful when commenting, especially with block comments. It's\
    \ very easy to forget to add the closing asterisk and forward slash and thus negate\
    \ any code that falls inside the comment block.\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_130_3.png)\n\
    \n**STEP 5** Obviously if you try and build and execute the code it errors out,\
    \ complaining of a missing curly bracket `}` to finish off the block of code.\
    \ If you've made the error a few times, then it can be time consuming to go back\
    \ and rectify. Thankfully, the colour coding in Geany helps identify comments\
    \ from code.\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_130_4.png)\n\n**STEP\
    \ 6** With block comments, it's good practice in C++ to add an asterisk to each\
    \ new line of the comment block. This also helps you to remember to close the\
    \ comment block off before continuing with the code:\n\n```\n```cpp\n/* This comment\
    \ can\n * cover several lines\n * without the need to add more slashes */\n```\n\
    ```\n\nThankfully, Geany does this automatically but be aware of it when using\
    \ other IDEs.\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_130_5.png)"
  merge: -1
  img_proc: true
- pgno: 131
  md: '# Variables


    Variables differ slightly when using C++ as opposed to Python. In Python, you
    can simply state that ''a'' equals 10 and a variable is assigned. However, in
    C++ a variable has to be declared with its type before it can be used.


    # THE DECLARATION OF VARIABLES


    You can declare a C++ variable by using statements within the code. There are
    several distinct types of variable you can declare. Here''s how it works.


    STEP 1 Open up a new, blank C++ file and enter the usual code headers:


    ```

    ```

    #include <iostream>

    using namespace std;


    int main()

    {

    }

    ```

    ```


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_131_0.png)


    STEP 2 Start simple by creating two variables, a and b, with one having a value
    of 10 and the other 5. You can use the data type int to declare these variables.
    Within the curly brackets enter:


    ```

    ```

    int a;

    int b;


    a = 10;

    b = 5;

    ```

    ```


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_131_1.png)


    STEP 3 You can build and run the code but it won''t do much, other than store
    the values 10 and 5 to the integers a and b. Ignore the warnings about variables
    set but not used, the code still works. To output the contents of the variables,
    add:


    ```

    ```

    cout << a;

    cout << "\n";

    cout << b;

    ```

    ```


    The cout << "\n"; part simply places a new line between the output of 10 and 5.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_131_2.png)


    STEP 4 Naturally you can declare a new variable, call it result and output some
    simple arithmetic:


    ```

    ```

    int result;

    result = a + b;

    cout << result;

    ```

    ```


    Insert the above into the code as per the screenshot.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_131_3.png)'
