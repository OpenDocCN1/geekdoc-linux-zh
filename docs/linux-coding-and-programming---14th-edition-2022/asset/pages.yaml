  md: "# Your First Code\n\nEssentially, you’ve already written your first piece of\
    \ code with the ‘print(“Hello everyone!”)’ function from the previous tutorial.\
    \ However, let’s expand that and look at extending your code and playing around\
    \ with some other Python examples.\n\n# PLAYING WITH PYTHON\n\nWith most languages,\
    \ computer or human, it’s all about remembering and applying the right words to\
    \ the right situation. You’re not born knowing these words, so you need to learn\
    \ them.\n\n+   **STEP 1** If you’ve closed Python 3 IDLE, reopen it in whichever\
    \ operating system version you prefer. In the Shell, enter the familiar following:\n\
    +   \n+   `print(“Hello”)`\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_93_0.png)\n\
    \n+   **STEP 3** You can see that instead of the number 4, the output is the 2+2\
    \ you asked to be printed to the screen. The quotation marks are defining what’s\
    \ being output to the IDLE Shell; to print the total of 2+2 you need to remove\
    \ the quotes:\n+   \n+   `print(2+2)`\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_93_1.png)\n\
    \n+   **STEP 2** Just as predicted, the word Hello appears in the Shell as blue\
    \ text, indicating output from a string. It’s fairly straightforward and doesn’t\
    \ require too much explanation. Now try:\n+   \n+   `print(“2+2”)`\n\n+   **STEP\
    \ 4** You can continue as such, printing 2+2, 464+2343 and so on to the Shell.\
    \ An easier way to use a variable, which is something we will cover in more depth\
    \ later. For now, enter:\n+   \n+   `a=2`\n+   `b=2`\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_93_2.png)\n\
    \n![](img/d501697c83491ed0bb4b382b0d28ef0a_93_3.png)"
