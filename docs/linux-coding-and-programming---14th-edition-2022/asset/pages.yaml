- pgno: 37
  md: '# # Creating Users


    When you first install Linux Mint it is configured for use with a single user.
    While sharing a user account with the entire family is fine, there may come a
    time when you need to create separate users with their own unique Home folders.


    # ## NEW USERS


    Having different users means each user has access to his or hers own areas on
    the system. Documents, pictures, videos and so on are separate, as with multiple
    users on other operating systems.


    +   **STEP 1** Click on the Linux Mint Menu and type ''users'' to begin searching
    for the relevant console. From the search results, choose Users and Groups and
    enter your password. The Users and Groups console is quite basic looking, and
    thankfully easy to use. At first, you can just see your own username from when
    you installed Linux Mint.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_37_0.png)


    +   **STEP 2** To add a new user, click the Add button at the bottom of the console.
    There are two types of user you can create, Standard and Administrator. Unless
    the new user has need to install new apps or access parts of the file system beyond
    their Home folder, then opt for the Standard account type. Otherwise, use the
    Administrator account type.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_37_1.png)


    +   **STEP 3** Enter the new user''s Full Name, followed by the Username they
    need when logging into Linux Mint. Make sure the username is all in lower case,
    a-z and 0-9 characters only. You can have full stops, underscores or hyphens if
    you wish. Click the Add button when you''re ready to continue.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_37_2.png)


    +   **STEP 4** The new user appears in the list of current Linux Mint users, in
    alphabetical order. At present, there''s no password set so click the user in
    the list of current users, then click the No Password Set option under the user''s
    username.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_37_3.png)'
  merge: -1
  img_proc: true
- pgno: 38
  md: '# STEP 5


    You can now enter a password for the new user or click the curved arrow at the
    end of the New Password text box to generate a password for you, as well as displaying
    it. Naturally, it''s a good idea to come up with as strong a password as possible.
    When you''re done, click the Change button.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_38_0.png)


    # STEP 7


    Once logged in the new user is required to set up their own desktop wallpaper,
    icons, Panel, Menu and so on. Depending on what Account Type you set up for them,
    Standard or Administrator, they won''t be able to install any new apps. This screenshot
    is from a Standard user account type.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_38_1.png)


    # STEP 6


    You can close the Users and Groups console window now, as the new user has been
    created. If you click the Mint Menu, followed by Logout, you are presented with
    the Mint Login Manager. The new user is now present in the list of currently available
    users. Click on him/her to log them in.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_38_2.png)


    # STEP 8


    You can create as many new accounts as you need and you''re able to switch between
    them when required. It''s best to have just one account that''s capable of installing
    new software, that way you can keep track of what''s on your system.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_38_3.png)


    # COMMAND LINE ACCOUNTS


    Just as you''d expect, you can also create a new user within the command line.
    Open up a Terminal session under the main (yours) Administrator account.


    # STEP 1


    The process for adding a new user from the command line is relatively simple.
    To begin with, type: `sudo adduser <username>` where `<username>` is the new user’s
    login name. You’re then asked to create a new password for the user, along with
    their full name and other details. Click y to confirm the details and create the
    user account.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_38_4.png)


    # STEP 2


    You can check the details and account type for the new user from within the Users
    and Groups console. If you want to delete a user from Mint, you can either enter
    `sudo deluser <username>` in the Terminal or click the Delete button in Users
    and Groups.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_38_5.png)'
  merge: -1
  img_proc: true
- pgno: 39
  md: '# Customising the Desktop


    Customising the operating system desktop is one way to make it your own: a personalised
    workspace that is there to help you work, inspire you or feature the company logo.
    Whatever your reasons for having your own desktop, here''s how it''s done.


    # YOUR DESKTOP


    Linux is probably one of the customisable operating systems there is. With just
    a few tweaks, one or two extras installed and some imagination, you can create
    something incredible.


    +   **STEP 1**

    +   The first aspect of desktop customisation is to change the wallpaper. Right-click
    the desktop and choose Change Desktop Background. This opens the Backgrounds app
    in Linux Mint; remember, other distros may present their background, wallpaper
    selection tools differently.


    +   **STEP 3**

    +   You just need to click the available images, from any of the locations provided
    to have them install as the desktop wallpaper. Incidentally, if you have images
    stored in another location on your system or network, you can add them by clicking
    on the Plus symbol at the bottom of the Backgrounds console, using the file manager
    to locate them.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_39_0.png)


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_39_1.png)


    +   **STEP 2**

    +   More recent versions of Linux Mint display available backgrounds depending
    on the version the user is running. You normally get three categories followed
    by a fourth, Pictures, which is separated from the others. The Pictures option
    is different because it reads the image content from the Pictures folder in your
    Home area.


    +   **STEP 4**

    +   By clicking on the Settings tab you can, instead, play numerous images as
    a slideshow or change the aspect of the wallpapers to a variety of choices.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_39_2.png)


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_39_3.png)'
  merge: -1
  img_proc: true
- pgno: 40
  md: '# STEP 5


    If none of the available wallpapers take your fancy, open a browser and search
    for the type of background image you prefer. When you''ve found the image you
    want as the desktop wallpaper, right-click it and choose Set As Desktop Background
    from the list of options. When the Set Desktop Background console open, click
    the Set Desktop Background button.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_40_0.png)


    # STEP 6


    Click the Menu button and search for ''desktop'' and click the Desktop Settings
    result. The Desktop console allows you to pick the layout, desktop icons and options
    for multi-monitor support, you want. You can experiment with the options for the
    best setup, according to your personal tastes.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_40_1.png)


    # STEP 7


    In addition to changing the desktop wallpaper, and how the icons are displayed,
    you can also alter the overall theme for Linux Mint. From the Mint Menu, search
    for ''themes'' and click the Themes app as it appears in the search results.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_40_2.png)


    # STEP 8


    Themes allows you to change the way certain aspects of the Mint desktop look:
    Window Borders, Icons, Controls, Mouse Pointer and Desktop. In the Settings tab
    you can extend the options with a few on/off slider buttons, too.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_40_3.png)


    # STEP 9


    If you click on the Add/remove button in the centre of the three available options,
    you can choose the default view from a number of preinstalled themes. Click the
    theme you want, then click the Install (downward-pointing arrow) button to enable
    it.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_40_4.png)


    # STEP 10


    Click back on Themes, then Desktop and you can locate the newly installed theme
    and apply it to your desktop. Any installed Themes can also be uninstalled via
    the Add/ Remove button. It''s worth spending some time personalising your desktop
    how you want it and there are some incredible themes available too.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_40_5.png)'
