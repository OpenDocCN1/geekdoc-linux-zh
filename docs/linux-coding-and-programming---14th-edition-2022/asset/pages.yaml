    David Hayward\n>> \"type(age)\n<class \"str\">\n>>> age= \"40\"\n>> \"type(age)\n\
    <class \"int\">\n>>> print (name+age)\n'>>> print (name+age)\nPython 3.4.2 (default,\
    \ Oct 19 2014, 13:31:11)\n[GCC 4.9.1] on linux\nType \"copyright\", \"credits\"\
    \ or \"license\"() for more information.\n>>> name=input(name)\n'>>> \"David Hayward\"\
    \nDavid Hayward\n>>> print (name)\nDavid Hayward\n>>> title=\"descended from vikings\"\
    \n>>> print (name + \" \" + title)\nDavid Hayward: Descended from Vikings\n>>>\
    \ char=\"-4\"  # title\n>>> char=\"\"\n>>> print(char+name)\nDavid Hayward\n>>\
    \ \"type(age)\n<class \"str\">\n>>> age= \"40\"\n>> \"type(age)\n<class \"int\"\
    >\n>>> print (name+age)\n'>>> print (name+age)\nTraceback (most recent call last):\n\
    \  File \"<pyshell#10>\", line 1, in <module>\n    print (name+age)\nTypeError:\
    \ Can't convert 'int' object to str implicitly\n```\n```\n\n+   STEP 6  This is\
    \ a process known as TypeCasting. The Python code is:\n+   \n+   print (character\
    \ + \" is \" + str(age) + \" years old.\")\n+   \n+   or you can use:\n+   \n\
    +   print (character, \"is\", age, \"years old.\")\n+   \n+   Notice again that\
