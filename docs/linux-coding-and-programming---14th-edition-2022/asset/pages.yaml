  md: "# Working with Variables\n\n+   STEP 5  However, you can't combine both strings\
    \ and integer type variables in the same command, as you would a set of similar\
    \ variables. You need to either turn one into the other or vice versa. When you\
    \ do try to combine both, you get an error message:\n+   \n+   print (name + age)\n\
    \n```\n```\nPython 3.4.2 (default, Oct 19 2014, 13:31:11)\n[GCC 4.9.1] on linux\n\
