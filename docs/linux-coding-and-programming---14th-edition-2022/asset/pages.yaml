- pgno: 74
  md: "# # CREATING A BACKUP TASK SCRIPT\n\nOne of the most well used examples of\
    \ Bash scripting is the creation of a backup routine, one that automates the task\
    \ as well as adding some customisations along the way.\n\n# ### STEP 1\n\nA very\
    \ basic backup script would look something along the lines of `#!/bin/bash`, then,\
    \ `tar cvfz ~/backups/my-backup.tgz ~/Documents/`. This will create a compressed\
    \ file backup of the `~/Documents` folder, with everything in it, and put it in\
    \ a folder called `~/backups` with the name my-backup.tgz.\n\n```\n```\n#!/bin/bash\n\
    \ntar cvfz ~/backups/my-backup.tgz ~/Documents/\n```\n```\n\n# ### STEP 2\n\n\
    While perfectly fine, we can make the simple script a lot more interactive. Let’s\
    \ begin with defining some variables. Enter the text in the screenshot into a\
    \ new backup.sh script. Note that we’ve misspelt ‘source’ as ‘sauce’, this is\
    \ because there’s already a built-in command called ‘source’ hence the different\
    \ spelling on our part.\n\n```\n```\n#!/bin/bash\n\nclear\n# Time stamp\nday=$(date\
    \ +\\%A)\nmonth=$(date +\\%B)\nyear=$(date +\\%Y)\n\n# Folders\ndest=~/Backups\n\
    sauce=~/Documents/\n```\n```\n\n# ### STEP 3\n\nThe previous script entries allowed\
    \ you to create a Time Stamp, so you know when the backup was taken. You also\
    \ created a ‘dest’ variable, which is the folder where the backup file will be\
    \ created (~/backups). You can now add a section of code to first check if the\
    \ ~/backups folder exits, if not, then it creates one.\n\n```\n```\n#!/bin/bash\n\
    \nclear\n# Time stamp\nday=$(date +\\%A)\nmonth=$(date +\\%B)\nyear=$(date +\\\
    %Y)\n\n# Folders\ndest=~/Backups\nsauce=~/Documents\n\nif [ -d $dest ]; then\n\
    \  echo \"Backup folder exists\"\nelse\n  echo \"Backup folder does not exist!\
    \ I’m now creating it…\"; (mkdir -p $dest)\n  echo\nfi\n```\n```\n\n# ### STEP\
    \ 4\n\nOnce the ~/backups folder is created, we can now create a new subfolder\
    \ within it based on the TimeStamp variables we set up at the beginning. Add `mkdir\
    \ -p $dest/\"$day $month $year\"`. It’s in here that you put the backup file relevant\
    \ to that day/month/year.\n\n```\n```\n#!/bin/bash\n\nclear\n# Time stamp\nday=$(date\
    \ +\\%A)\nmonth=$(date +\\%B)\nyear=$(date +\\%Y)\n\n# Folders\ndest=~/Backups\n\
    sauce=~/Documents\n\nif [ -d $dest ]; then\n  echo \"Backup folder exists\"\n\
    else\n  echo \"Backup folder does not exist! I’m now creating it…\"; (mkdir -p\
    \ $dest)\n  echo\nfi\n\nread -p \"Press any key to continue...\" -n 1\n  mkdir\
    \ -p $dest/\"$day $month $year\"\n```\n```\n\n# ### STEP 5\n\nWith everything\
    \ in place, you can now enter the actual backup routine, based on the Tar command\
    \ from Step 5. Combined with the variables, you have: `tar cvfz $dest/\"$day $month\
    \ $year\"/Documents$backup.tgz $sauce.` In the screenshot, we added a handy “Now\
    \ backing up…” echo command.\n\n```\n```\n#!/bin/bash\n\nclear\n# Time stamp\n\
    day=$(date +\\%A)\nmonth=$(date +\\%B)\nyear=$(date +\\%Y)\n\n# Folders\ndest=~/Backups\n\
    sauce=~/Documents\n\nif [ -d $dest ]; then\n  echo \"Backup folder exists\"\n\
    else\n  echo \"Backup folder does not exist! I’m now creating it…\"; (mkdir -p\
    \ $dest)\n  echo\nfi\n\nread -p \"Press any key to continue...\" -n 1\n  mkdir\
    \ -p $dest/\"$day $month $year\"\n\nclear\n  echo \"Now backing up... Please wait...\"\
    \n  tar cvfz $dest/\"$day $month $year\"/Documents$backup.tgz $sauce\n```\n```\n\
    \n# ### STEP 6\n\nFinally, you can add a friendly message: `echo \"Backup complete.\
    \ All done...\"`. The completed script isn’t too over-complex and it can be easily\
    \ customised to include any folder within your Home area, as well as the entire\
    \ Home area itself.\n\n```\n```\n#!/bin/bash\n\nclear\n# Time stamp\nday=$(date\
    \ +\\%A)\nmonth=$(date +\\%B)\nyear=$(date +\\%Y)\n\n# Folders\ndest=~/Backups\n\
    sauce=~/Documents\n\nif [ -d $dest ]; then\n  echo \"Backup folder exists\"\n\
    else\n  echo \"Backup folder does not exist! I’m now creating it…\"; (mkdir -p\
    \ $dest)\n  echo\nfi\n\nread -p \"Press any key to continue...\" -n 1\n  mkdir\
    \ -p $dest/\"$day $month $year\"\n\nclear\n  echo \"Now backing up... Please wait...\"\
    \n  tar cvfz $dest/\"$day $month $year\"/Documents$backup.tgz $sauce\n\nclear\n\
    \  echo \"Backup complete. All done...\"\n\nclear\n```\n```"
  merge: -1
