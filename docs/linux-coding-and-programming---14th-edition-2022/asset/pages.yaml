- pgno: 55
  md: '# # Creating a File Using the Terminal


    Using the Terminal, you’re able to create folders, files and even execute Linux
    Mint apps. In truth, if you didn’t have the GUI at hand, you could still accomplish
    the same from the Terminal.


    # ## MORE TERMINAL WORK


    Creating content using the Terminal isn’t quite as strenuous as it may first appear.
    Yes, the Terminal can look a daunting place for the newcomer, but once mastered
    it’s really quite intuitive.


    +   STEP 1

    +   Open up the Terminal, and make sure you’re in the Home folder. If not use
    the `cd -` command to return you to the Home folder from wherever you’re currently
    located.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_55_0.png)


    +   STEP 3

    +   Your command line should change to the Test folder and if you enter `ls` (List
    folder contents) there’ll be nothing within the folder, as you’ve just created
    it. The `mkdir` command is fairly self explanatory: Make Directory followed by
    the name of your choosing.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_55_1.png)


    +   STEP 2

    +   Let’s start by creating a new folder within Home, and call it **Test**. The
    command you’ll need is `mkdir`. Press `Enter` to create the folder when you’ve
    typed in the command, then `cd Test` and press `Enter`. This will Change Directory
    (hence **CD**) to the newly created Test folder.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_55_2.png)


    +   STEP 4

    +   To create an empty text file, called **Test.txt**, enter in the Terminal:
    `touch Test.txt`. You can then use `ls` to view the new file in the folder. Touch
    is a standard Linux command that allows the creation of files without the need
    to open a text editor, save the file, then close the editor.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_55_3.png)'
  merge: -1
  img_proc: true
- pgno: 56
  md: '+   STEP 5

    +   Let’s say you now wanted to create a text file, we’ll call it Test2.txt, complete
    with some content. To do so, enter: cat > Test2.txt. This will create the file
    Test2.txt and put the Terminal into an editing mode.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_56_0.png)


    +   STEP 6

    +   You’ll notice that the cursor is flashing below the cat > Test2,txt command,
    without the usual prompt. This editing mode will allow you enter the text that
    the file will contain. Enter some text, then press Ctrl+D to exit and write the
    contents to the file.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_56_1.png)


    +   STEP 7

    +   Of course you don’t always have to use the Terminal to enter text into a file.
    Mint comes with a text editor called Xed, which is similar to Windows’ Notepad.
    To view the previously created file in Xed, type into the Terminal: xed Test2,txt,
    and press Enter.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_56_2.png)


    +   STEP 8

    +   Xed is a GUI app, and you can enter text and save the file, or any file, accordingly
    by using the app’s main window, and the File > Save, or File > Save As functions
    from its top menu bar options.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_56_3.png)


    +   STEP 9

    +   If, however, you prefer to remain working in the Terminal to edit/save/create
    files, you can use Nano. Nano is a simple Terminal-based text editor. To try it
    with the example, enter: nano Test2,txt. There’s a menu along the bottom of the
    screen. To exit and save any content in Nano, press Ctrl+X and follow the on-screen
    instructions.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_56_4.png)


    +   STEP 10

    +   We’ve used the Terminal to launch a Mint app, xed, but any app can be launched
    from within the Terminal. For example, try: firefox, and press Enter. Close Firefox
    to return to the Terminal. Providing you know the name of the app, it can run
    from the Terminal. Additionally, entering firefox& opens Firefox, AND lets you
    still use the Terminal.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_56_5.png)'
  merge: -1
  img_proc: true
- pgno: 57
  md: '# # Creating and Removing Directories


    As with creating files in the Terminal, you can also create and delete directories,
    or folders if you prefer. Directories form the structure of your file system,
    without logical directories the filing system would be in utter chaos.


    # ## MANAGING FOLDERS


    Learning how to create and delete folders in the Terminal is an important Mint,
    and indeed Linux overall, skill to master. Here’s the basics for you to try out.


    **STEP 1** With the Terminal open enter `cd` - to make sure you’re in your own
    Home directory. Now enter `ls` to view the current folders you have housed in
    the Home directory. You’ll notice that folders are labelled in Mint in cyan (light
    blue). Let’s start by creating a new directory. Enter `mkdir testdir`.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_57_0.png)


    **STEP 3** If you were to enter the command again, `mkdir testdir`, you’ll receive
    a message stating: `mkdir: cannot create directory ‘testdir’: File exists`. It
    goes without saying then, that you’re only able to have one uniquely named directory
    within the current directory. However, as Linux is case-sensitive, you can have
    TestDir, Testdir, testDir and so on.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_57_1.png)


    **STEP 2** If you now enter ls again, you’ll see that the new directory, testdir,
    has been created alongside the other directories in the Home area. Obviously the
    command `mkdir` is what creates the directory, and no doubt you’ve already guessed
    it stands for Make Directory.


    **STEP 4** You can create directories within directories you’ve already created.
    For example, enter the testdir directory with `cd testdir/` followed by ls to
    list the folder structure. Naturally there’s nothing present, as you’ve just created
    the directory. Now drop back to Home via `cd`, and enter `mkdir testdir/reports`.
    Go back to the testdir, `cd testdir/`, and `ls` again.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_57_2.png)


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_57_3.png)'
  merge: -1
  img_proc: true
- pgno: 58
  md: '# **STEP 5**


    The command to create directories is quite logical, therefore, You''ll create
    the directory, and any subdirectories within. However, what if you want to create
    a directory and a sub-directory in a single command? Make sure you''re at Home
    (cd ~) and enter: **mkdir** -p **Temp/finances**. Now, **cd Temp/**, and **ls**
    to list the new directory.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_58_0.png)


    # **STEP 8**


    Now that we''ve created some directories, let''s see about removing them. Start
    by entering the **testdir** directory and listing its contents: **cd testdir**,
    then **ls**. The previously created reports sub-directory is present. One way
    to remove it is to enter: **rmdir** reports, then **ls** again to confirm it''s
    not there.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_58_1.png)


    # **STEP 6**


    The -p option is what enables the **mkdir** command to create the sub-directory
    as well as the (parent) directory. In Linux, commands always follow the same structure:
    Command (**mkdir**), Option (**-p**), and Argument (**Temp/finances**).


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_58_2.png)


    # **STEP 9**


    A quick warning: removing a directory in the Terminal doesn''t place it in the
    Mint Rubbish Bin, via Nemo file manager. The same goes for any files, too; if
    you remove a directory from the Terminal command then it''s gone for good.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_58_3.png)


    # **STEP 7**


    If you want to drill down into the various options available for the **mkdir**
    command, you can enter **mkdir** -h ---help into the Terminal. This will provide
    a quick help guide detailing the options and how the command structure works.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_58_4.png)


    # **STEP 10**


    **Rmdir** will only remove empty directories, to remove directories containing
    sub-directories, or even files, you''ll need to use the **rm** command with the
    -r option. For example, on the **Temp/finances** directory, use **rm** -R Temp.
    A quick ls reveals that the parent folder and all of its contents are removed.
    Careful when using this command.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_58_5.png)'
  merge: -1
  img_proc: true
- pgno: 59
  md: '# Fun Things to do

    in the Terminal


    Despite the seriousness of an operating system, the Linux community are certainly
    no strangers to a bit of fun. The developers over the years have created and inserted
    all manner of fun and odd elements into the Terminal.


    # TERMINAL FUN


    You’ll be working exclusively in the Terminal for these next two sections, so
    start warming up your fingers. After all, all work and no play... as the saying
    goes.


    +   1.  **STEP 1**  The first command we’re going to use is `sl`, it’s not installed
    by default so enter: `sudo apt-get install sl`. The command can be run with `sl`
    and when executed will display a Steam Locomotive travelling across the screen
    (hence ‘sl’). Entering `LS`, note the upper case, also works.


    +   2.  **STEP 3**  If you’ve ever fancied having the computer read a random fortune
    out to you, then you’re in luck. Most distros require you to install the fortune
    app, however Linux Mint differs somewhat by having it already pre-loaded. All
    you need to do is enter the command `fortune` into the Terminal, and enjoy.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_59_0.png)


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_59_1.png)


    +   3.  **STEP 2**  Fans of Star Wars even get a fix when it comes to the Terminal.
    By linking to a remote server via the `telnet` command, you can watch *Episode
    IV: A New Hope* being played out, albeit in ASCII. To view this spectacle, enter:
    `telnet towel.blinkenlights.nl`.


    +   4.  **STEP 4**  The `rev` command is certainly interesting, and at first what
    seems a quite useless addition to the OS. However, it can be used to create some
    seemingly unbreakable passwords. Enter `rev`, now type some text, when you press
    **Enter** next, everything you typed in will be reversed. Press **Ctrl+C** to
    exit.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_59_2.png)


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_59_3.png)'
  merge: -1
  img_proc: true
- pgno: 60
  md: '# # Fun Things to do in the Terminal


    **STEP 5**

    If you''re stuck trying to work out all the possible

    factors for any particular number, simply enter

    **factor** followed by the number. For example, **factor** `7` doesn''t

    offer much output, whereas **factor** `60` displays more.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_60_0.png)


    **STEP 6**

    There''s a fine line between the rather cool and

    really-quite-weird. Having an ASCII cow repeat text

    to you could potentially fall in the latter. Enter **cowsay** followed

    by any text you want, such as **cowsay** `Linux Mint is ocel`.


    In fact, you can even output the `ls` command through the cow, by

    entering `ls` | **cowboy**.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_60_1.png)


    **STEP 7**

    To further the cow element, there''s even a graphical,

    non-Terminal, cow available. Install it with:

    `sudo apt-get install xcowsay`, then when it''s installed enter

    something similar to cowsay, such as `xcowsay BDM Publications`.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_60_2.png)


    **STEP 8**

    If you really want to expand the whole cow thing,

    there, for whatever reason, you can pipe the fortune

    command through it, with **fortune** | **cowsay**, and for the

    graphical cow equivalent: **fortune** | **xcowsay**. Plus, there''s

    always cowthink. Try: **cowthink** `This book is awesome`.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_60_3.png)


    **STEP 9**

    The command **toilet** doesn''t inspire much

    confidence, we''ll admit. However, it''s not as bad as

    it first sounds. Start by installing it with: `sudo apt-get install

    `toilet`. Then when installed, type either the a line of:

    **toilet** `David`. Or perhaps list the contents of the current folder

    through it, with `ls` | **toilet**.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_60_4.png)


    **STEP 10**

    Expanding the toilet command, you can actually

    generate some decent looking graphics through

    it. For example, try this: **toilet** `-f mono12 -F metal David`.

    You can enter **toilet** `--help`, for a list of the command line

    arguments to use a little further.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_60_5.png)'
