  md: "# **STEP 5**\n\nYou can assign a value to a variable as soon as you declare\
    \ it. The code you've typed in could look like this. Instead:\n\n```\n```\nint\
    \ a = 10;\nint b = 5;\nint result = a + b;\n\n```\n\n`cout << result;`\n```\n\n\
    ![](img/d501697c83491ed0bb4b382b0d28ef0a_132_0.png)\n\n# **STEP 6**\n\nSpecific\
    \ to C++, you can also use the following to assign values to a variable as soon\
    \ as you declare them:\n\n```\n```\nint a (10);\nint b (5);\n```\n\nThen, from\
    \ the C++11 standard, using curly brackets:\n\n`int result: {a+b};`\n```\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_132_1.png)\n\
    \n# **STEP 7**\n\nYou can create global variables, which are variables that are\
    \ declared outside any function and used in any function within the entire code.\
    \ What you've used so far are local variables: variables used inside the function.\
    \ For example:\n\n```\n```\n#include <iostream>\nusing namespace std;\nint StartLives\
    \ = 3;\n\nint main()\n{\n    StartLives = StartLives - 1;\n    cout << StartLives;\n\
    }\n```\n```\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_132_2.png)\n\n# **STEP\
    \ 8**\n\nThe previous step creates the variable StartLives, which is a global\
    \ variable. In a game, for example, a player's lives go up or down depending on\
    \ how well or how bad they're doing. When the player restarts the game, the StartLives\
    \ returns to its default state. Here we've assigned 3 lives, then subtracted 1,\
    \ leaving 2 lives left.\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_132_3.png)\n\
    \n# **STEP 9**\n\nThe modern C++ compiler is far more intelligent than most programmers\
    \ give it credit. While there are numerous data types we can declare for variables,\
    \ you can just use the auto feature:\n\n```\n```\n#include <iostream>\nusing namespace\
    \ std;\nauto pi = 3.141593;\n\nint main()\n{\n    double area, radius = 1.5;\n\
    \    area = pi * radius * radius;\n    cout << area;\n}\n```\n```\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_132_4.png)\n\
    \n# **STEP 10**\n\nAlthough we said to ignore the warnings in Step 3, there's\
    \ a difference between a warning and an error. In this case, it's just a simple\
    \ warning. The new data type, double, means double-precision floating point value,\
    \ which makes the code more accurate. The result should be 7.06858. Essentially,\
    \ you can often work with a warning but not an error.\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_132_5.png)"
