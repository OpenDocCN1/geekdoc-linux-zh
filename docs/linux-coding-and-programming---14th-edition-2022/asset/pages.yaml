- pgno: 22
  md: "# INSTALLING LINUX\n\nOnce the Live Environment has booted, you see the option\
    \ to install the distro to your computer. Have a look around and when you're ready,\
    \ look for the install option on the desktop.\n\n+   **STEP 1**  \n+   Providing\
    \ you're connected to the internet (if not, then do so now) and you're in the\
    \ Live Environment, start the installation process by double-clicking on the Install\
    \ Linux Mint icon on the desktop. Other distros display their own name, of course,\
    \ but the process is the same. Click Continue when you're ready.\n\n+   **STEP\
    \ 4**  \n+   Before the installation process begins, you're asked if the choice\
    \ you made regarding the erasure of the hard drive is correct. This is your last\
    \ chance to back out: if you're certain you don't mind wiping everything and starting\
    \ again with Linux Mint, click Continue. If you need to backup your files remove\
    \ the Linux disc/USB, reboot, backup and start again.\n\n+   **STEP 2**  \n+ \
    \  While the installation process is very similar across most Linux distros, some\
    \ offer different questions during the installation. Generally, the questions\
    \ aren't too difficult, nothing very technical, but some such as 'Installing third-party\
    \ software...' can be confusing. In this case you can click Continue but if you're\
    \ unsure, have an Internet-connected device available to ask any questions.\n\n\
    +   **STEP 5**  \n+   Eventually you are asked to set up your Linux username and\
    \ password. Enter your Name to begin with, then the Computer Name, which is the\
    \ name it is identified on the network as. Next choose a Username, followed by\
    \ a good Password. You can tick the Login Autamate option but leave the Encrypt\
    \ Home Folder option for now.\n\n+   **STEP 3**  \n+   When installing a new operating\
    \ system it's recommended that you wipe the old OS, replacing it with the new.\
    \ When you reach this stage of the installation process, ensure the 'Erase disk\
    \ and install Linux...' option is selected. NOTE: This completely wipes Windows\
    \ 10 from your computer, so make sure you have backups of all your personal files\
    \ and data.\n\n+   **STEP 6**  \n+   The installation process can be quick, and\
    \ there may be more questions to answer, or it may simply start installing Linux\
    \ based on your previous answers. Either way, you end up being asked to Continue\
    \ Testing the Live Environment or Restarting to use the newly installed OS. If\
    \ you're ready to use Linux, then click Restart Now."
