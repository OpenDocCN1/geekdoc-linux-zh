- pgno: 41
  md: '# Becoming

    Anonymous Online


    The digital age has led to many great advances in communications; however, it
    has also brought on a new age of spying and snooping. Most of us are no strangers
    to the frequent news stories of governments, secret organisations and underground
    hackers breaking our privacy but how can you combat this?


    # ANONYMITY WITH MINT


    While it''s virtually impossible to become totally anonymous online, you can take
    measures to ensure our privacy is at its best.


    +   **STEP 1** Starting with the basics, use HTTPS instead of the standard HTTP
    when browsing. This means that anything that''s transmitted over HTTPS is secure
    (hence the S part at the end) and encrypted.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_41_0.png)


    +   **STEP 2** When you''re browsing, consider using the Incognito or Private
    browsing modes available in a browser.

    +   This disables your web history and web cache, allowing you to browse without
    the details being stored for later scrutiny by someone else. However, it doesn''t
    stop any data or search tracking.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_41_1.png)


    +   **STEP 3** Although using Google may seem like the obvious choice for a modern
    internet search, the company does track all searches made by an individual. Instead,
    consider an alternative search engine, such as DuckDuckGo, a search engine that
    doesn''t store personal data or track you.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_41_2.png)


    +   **STEP 4** If you''re regularly on the Internet then consider installing some
    of the browser plug-ins that enhance your privacy. For example, for Firefox, use
    Ghostery, NoScript and AdBlock Plus to block trackers, adverts and other data
    mining techniques.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_41_3.png)'
  merge: -1
  img_proc: true
- pgno: 42
  md: '# VPNS AND TOR


    The previous steps can aid your online privacy but to really become anonymous
    you need a Virtual Private Network and Tor.


    +   **STEP 1** A VPN is a remote server, or cluster of servers, that establishes
    a connection with your computer. The end result is that your computer’s identity
    on the internet is hidden behind the VPN remote server; so if you could live in
    the UK but have an IP address (the computer online identity) belonging to Iceland.


    +   **STEP 4** When the download has finished, drop into the Terminal and enter
    the Downloads folder, `cd Downloads/`. Enter `ls` to check the tar.xz file is
    present, then enter: `tar --xf tor-browser-11inux64-8.0.4_en-US.tar.xz` (For us
    updated regularly, so if your version is different press Tab to autocomplete the
    `tor-browser-[filename]`). When the files are unpacked, use `cd .tor-browser_en-US/`
    to enter the new folder.


    # How VPN works?


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_42_0.png)


    ```

    alex@iMacVirtual:~$ rm -f tor-browser-8.0.4_en-US

    dex@iMacVirtual:~/Downloads $ ls

    dex@iMacVirtual:~/Downloads $ tar

    tor-browser-11inux64-8.0.4_en-US.tar.xz

    tor-browser_aarch64-8.5a2_arm64.tar.gz

    ... [terminal output] ...

    ```


    +   **STEP 2** Most good VPNs charge a monthly or annual fee but it’s worth the
    expense. We use CyberGhost, `www.cyberghostvpn.com`, which offers VPN connections
    for Windows, Mac, Mint (as well as other Linux distros), Android and IOS devices.
    Details for each OS can be found at `www.support.cyberghostvpn.com/hc/en-us/articles/21319032-Read-me-first`.


    +   **STEP 5** A quick `ls` reveals a couple of entries: a folder called Browser
    and a file called `start-tor-browser.desktop`. To start the Tor setup, type `./start-tor-browser.desktop`.
    This command launches the Tor setup, where you are offered two options: Connect
    or Configure. For most users, the Connect option will suffice. Click Connect when
    you are ready.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_42_1.png)


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_42_2.png)


    +   **STEP 3** Another option is to use Tor. Tor is an open network behind countless
    nodes around the world. It is available for Windows, Mac and Linux computers and
    is very easy to install and use. Start by navigating to `www.torproject.org/download/download-easy.html`
    and clicking on the Download Linux 64-bit button.


    +   **STEP 6** After the connection is established, the Tor Browser launches.
    This is a customised version of Firefox and from here you can securely browse
