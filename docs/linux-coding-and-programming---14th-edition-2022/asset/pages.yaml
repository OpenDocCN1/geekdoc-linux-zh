    \ that can be worked with.\n\n```\n```\nPython 3.4.2 Shell\nFile Edit Shell Debug\
    \ Options Windows Help\nPython 3.4.2 (default, Oct 19 2014, 13:31:11)\n[GCC 4.9.1]\
