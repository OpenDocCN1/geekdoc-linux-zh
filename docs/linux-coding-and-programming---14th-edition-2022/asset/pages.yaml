    \ or \"license\"() for more information.\n>>> shirt=19.99\n>>> type(shirt)\n<class\
    \ \"float\">\n```\n```\n\n+   STEP 10  When combining integers and floats Python\
    \ usually converts the integer to a float, but should the reverse ever be applied\
    \ it's worth remembering that Python doesn't return the exact value. When converting\
