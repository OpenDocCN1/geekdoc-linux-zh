- pgno: 63
  md: "# Linux Tips and Tricks\n\nAs you’ve seen, the **Linux Terminal** is quite\
    \ an exceptional environment. With a few extra apps installed, and a smidgen of\
    \ command knowledge, incredible, and often quite strange, things can be accomplished.\n\
    \n# TAKING COMMAND\n\nThere are countless Linux tips, secrets, hacks and tricks\
    \ out there. Some are very old, originating from Linux’s Unix heritage, while\
    \ others are recent additions to Linux lore. Here’s our favourite ten tips and\
    \ tricks.\n\n# EASTER EGGS\n\nEmacs, the text editor, is a great piece of software,\
    \ however, did you know it also contains a hidden Easter Egg? With Emacs installed\
    \ (**sudo apt-get install emacs25**), drop to a Terminal session and enter:\n\n\
    `emacs -batch -l dunnet`\n\nDunnet is a text adventure written by Ron Schnell\
    \ in 1982, and hidden in Emacs since 1994.\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_63_0.png)\n\
    \n# TERMINAL BROWSING\n\nEver fancied being able to browse the Internet from the\
    \ Terminal? While not particularly useful, it is quite a fascinating thing to\
    \ behold. To do so, enter:\n\n`sudo apt-get install elinks elinks`\n\nEnter the\
    \ website you want to visit.\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_63_1.png)\n\
    \n# MOON BUGGY\n\nBased on the classic 1982 arcade game, Moon Patrol, Moon Buggy\
    \ appeared on the home computers of 1985 amid much praise. It’s a cracking Atari\
    \ game, and is available in the Linux Terminal by entering:\n\n`sudo apt-get install\
    \ moon-buggy`\n\nThen:\n\n`moon-buggy`\n\nEnjoy.\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_63_2.png)\n\
    \n# LET IT SNOW\n\nSnowing in the Terminal console isn’t something you come across\
    \ every day. If you’re interested, however, enter:\n\n`wget -x //gist.githubusercontent.com/sontek/1505483/raw/7d024716a457e69fb52632fee09f42753361c402/snowjob.sh`\
    \ \n`chmod +x snowjob.sh` \n`. /snowjob.sh`\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_63_3.png)"
