    \ the commas treat each argument to print separately.\n\n```\n```\n>>> print (name\
    \ + age)\nTraceback (most recent call last):\n  File \"<pyshell#10>\", line 1,\
    \ in <module>\n    print (name + age)\nTypeError: Can't convert 'int' object to\
    \ str implicitly\n>>> print (character + \" is \" + str(age) + \" years old.\"\
    )\nDavid Hayward: Descended from Vikings is 44 years old.\n>>> print (character,\
    \ \"is\", age, \"years old.\")\nDavid Hayward: Descended from Vikings is 44 years\
    \ old.\n```\n```\n\n+   STEP 7  Another example of TypeCasting is when you ask\
    \ for input from the user, such as a name. For example, enter:\n+   \n+   age=input\
    \ (\"How old are you ? \")\n+   \n+   All data stored from the input command is\
