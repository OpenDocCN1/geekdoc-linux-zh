- pgno: 23
  md: "# # Installing a Virtual Environment\n\nA Virtual Environment is a simulated\
    \ computer system. Using a Virtual Machine, you can mimic a standard PC and install\
    \ an entire operating system to it without affecting the one installed on your\
    \ computer. It’s a great way to test and use Linux, while still having Windows\
    \ 10 as your main OS.\n\n# ## GOING VIRTUAL\n\nUsing a Virtual Machine (VM) takes\
    \ resources from your computer: memory, hard drive space, processor usage and\
    \ so on. Make sure you have enough of each before commencing.\n\n**STEP 1**  \n\
    We’re using VirtualBox in this instance, as it’s one of the easiest virtual environments\
    \ to get to grips with. Enter www.virtualbox.org and click on ‘Download VirtualBox’.\
    \ This takes you to the main download page. Locate the correct host for your system:\
    \ Windows or Mac, the Host being the current installed operating system, and click\
    \ the link to begin the download.\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_23_0.png)\n\
    \n**STEP 2**  \nNext, while still at the VirtualBox download page, locate the\
    \ VirtualBox Extension Pack link. The Extension Pack supports USB devices as well\
    \ as numerous other extras that can help make the VM environment a more accurate\
    \ emulation of a ‘real’ computer.\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_23_1.png)\n\
    \n**STEP 3**  \nWith the correct packages downloaded, and before you install anything,\
    \ you need to make sure that the computer you’re using is able to host a VM. To\
    \ do this, reboot the computer and enter the BIOS. When the computer starts up,\
    \ press the Del, F2 or whichever key is necessary to Enter Setup.\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_23_2.png)\n\
    \n**STEP 4**  \nEach BIOS is laid out differently and it’s very difficult to assess\
    \ where to look in each personal example. However, as a general rule of thumb,\
    \ you’re looking for Intel Virtualisation Technology, or simply Virtualisation,\
    \ found usually within the Advanced section of the BIOS. When you’ve located it,\
    \ Enable it, save the settings, exit the BIOS and reboot the computer.\n\n![](img/d501697c83491ed0bb4b382b0d28ef0a_23_3.png)"
  merge: -1
  img_proc: true
