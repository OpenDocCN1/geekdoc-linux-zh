- pgno: 45
  md: '# Basics of the Terminal


    Most operating systems use two kinds of interface, the GUI, which is the desktop
    that Windows, macОS and Linux Mint boot into and the command line. While modern
    operating systems shy away from the command line, Mint uses the Terminal to give
    the user greater control of the system.


    # TAKING COMMAND


    The command line, or Terminal, is an extremely powerful interface. Everything
    you can do on the desktop can be done within the Terminal. Let''s start by seeing
    how it works.


    +   STEP 1 The Terminal can be accessed by either clicking on the Terminal icon
    on the Panel, located between the Firefox and files icons or launched by opening
    the Menu and selecting it from the left-hand quick launch strip.


    +   STEP 3 What you currently see in the Terminal is your login name followed
    by the name of the computer, as you named it during setup when you first installed
    Mint. The line then ends with the current folder name; at first this is just a
    tilde ~, which means your Home folder.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_45_0.png)


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_45_1.png)


    +   STEP 2 The Terminal gives you access to the Linux Mint Shell, called Bash,
    which gives you access to the underlying operating system. Everything in Mint,
    including the desktop and GUI, is a module running from the command line.


    +   STEP 4 The flashing cursor at the very end of the line is where your text-based
    commands are entered. You can begin to experiment with a simple command, Print
    Working Directory (pwd), which outputs the current folder you''re in to the screen.
    Type pwd and press Enter.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_45_2.png)


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_45_3.png)'
  merge: -1
  img_proc: true
- pgno: 46
  md: '# Basics of the Terminal


    # STEP 5


    All the commands you enter work in the same manner: you enter the command, include
    any parameters to extend the use of the command and press Enter to execute the
    command line you’ve entered. Type into the Terminal: uname -a and press Enter.
    This displays some system information regarding Mint.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_46_0.png)


    # STEP 8


    View and Search options let you alter the sizing of the Terminal window and of
    course search within the Terminal for any particular key words.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_46_1.png)


    # STEP 6


    Before we get into entering commands, let’s take a moment to see what menus the
    Terminal has to offer. The File menu option allows you to open a new Terminal,
    create a new profile, where you can alter the size, colours and behaviour of the
    Terminal, add a new tab, and close all current active Terminal sessions.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_46_2.png)


    # STEP 9


    The Terminal entry extends the profile editing and sizing and allows you to alter
    the character encoding. Interestingly, you can also set it to a Read Only mode,
    which stops you from entering any commands into the Terminal; this is good for
    when you need to permanently display the Terminal contents.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_46_3.png)


    # STEP 7


    The Edit option lets you copy and paste commands to and from the Terminal and
    other sources; handy for when you want to copy a very long and complex command
    from a web page. It also allows you to edit the current profile preferences.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_46_4.png)


    # STEP 10


    Finally, the Help option displays the help contents and version number of the
    Terminal, or to be more precise, GNOME Terminal; we’ll simply refer to it as Terminal
    in future. The Contents are worth having a quick read through, to help familiarise
    yourself with how the Terminal works.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_46_5.png)'
  merge: -1
  img_proc: true
- pgno: 47
  md: '# Update Mint via the Terminal


    Up to now you’ve been using the shield icon to launch Mint Update Manager in order
    to update the system and upgrade the currently installed apps, tools and other
    elements. However, you can also accomplish a complete system update and upgrade
    from the Terminal.


    # USING APT-GET


    To update and upgrade via the Terminal you use the APT (Advanced Packaging Tool)
    command. It’s a powerful command and combines different elements depending on
    its use.


    **STEP 1**

    Start by opening a new Terminal or if you already have one opened clear its contents
    with the clear command. This starts you off with a clean slate on which to work.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_47_0.png)


    **STEP 2**

    Enter: apt-get into the Terminal. This brings up a list of the most used apt-get
    commands, along with a brief description of what the command does. It’s worth
    having a look at, even if it doesn’t make a huge amount of sense at this time.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_47_1.png)


    **STEP 3**

    Apt-get is used to update and upgrade the software in Mint, as well as Ubuntu
    and other Debian-based distros. Using the Update element retrieves new package
    lists and updates the list of source files. Upgrade downloads and performs an
    upgrade to the latest versions of those files. To start the entire Upgrade and
    Update process, enter: sudo apt-get update, followed by your password.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_47_2.png)


    **STEP 4**

    Notice now the addition of the sudo command. The sudo command once meant Super
    User Do; these days it’s more acceptable as Substitute User Do. It means that
    the administrative user (Super User) uses APT (Advanced Packaging Tool) to Get
    any Updates. Now try this: sudo apt-get upgrade.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_47_3.png)'
  merge: -1
  img_proc: true
- pgno: 48
  md: '# Update Mint via the Terminal


    **STEP 5**  Depending on the state of your updates, if you have any waiting to
    be installed, you might be asked if you want to apply the results of the sudo
    apt-get upgrade command. You can press y to accept and continue. What''s happening
    here is that apt-get has some updated software to apply to Mint, and you''re okaying
    the action.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_48_0.png)


    **STEP 7**  Essentially, that''s it, your system is now up to date according to
    the available list of packages from the apt-get update command. You can run through
    the process one more time, just to check if everything went okay. To recap, enter:
    sudo apt-get update, press Enter, then type: sudo apt-get upgrade and press Enter.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_48_1.png)


    **STEP 6**  There''s likely to be a long list of what seems gibberish now filling
    your Terminal window but don''t worry. The files necessary for the upgrade have
    been downloaded, prepared, unpacked, processed, installed and set up correctly.
    There''s a lot going on when you perform an upgrade, even with the smallest package.


    **STEP 8**  Interestingly, Linux Mint, among other distros, offers you the ability
    to chain several commands together. In this example, therefore, we can use sudo
    apt-get update && sudo apt-get upgrade. The double ampersand is what combines
    the commands and works perfectly, providing the preceding command went without
    a hitch. It''s recommended to start any session with the update and upgrade combo.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_48_2.png)


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_48_3.png)


    # TERMINAL VS UPDATE MANAGER?


    Why use the Terminal to update and upgrade over the Update Manager, regardless
    of the distro you''re using? Some users greatly prefer using the Terminal to update
    their Linux systems and accompanying apps, in the belief that it''s better. However,
    that''s not often the case.


    Using the Terminal, apt-get upgrade, doesn''t handle changing dependencies between
    versions of packages, so if a package has its dependent files changed from one
    version to another, then the upgrade is held back.


    The Update Manager, or Software Manager (depending on the distro), often phases
    its updates and marks those packages with changed dependencies for updating. However,
    and this is where Linux can often get confusing, sometimes it doesn''t. It all
    boils down to the developer of the package being updated and the way the package
    is held in the distro''s repositories and whether the update is classified as
    stable or not. In essence, from the point of view of the user, if you update and
    upgrade using both the Terminal and the Update Manager regularly, then you will
    be as up to date as possible, and get the essential and necessary stable versions
    of the packages and core software. If you''re looking for cutting edge package
    updates, then it''s best to opt for a rolling release distro instead.'
  merge: -1
  img_proc: true
- pgno: 49
  md: '# Install Apps via the

    Terminal – Part 1


    There are different ways to install apps and programs on Linux. You can opt for
    the graphical route, using a Software Manager, or you can use the Terminal. Often,
    the Terminal provides better control over the software being installed and sometimes,
    you have no choice in the matter.


    # COMMAND LINE INSTALLS


    Installing an app with the Terminal may require some nifty keyboard work but you
    get a better sense of what’s being installed and where.


    +   **STEP 1** Installing apps form the Terminal is often relatively simple. First
    though, you need to make sure that the system is up to date. To do this open up
    the Terminal and enter: `sudo apt-get update && sudo apt-get upgrade`. Enter your
    password and accept any necessary updates.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_49_0.png)


    +   **STEP 2** Just as you’ve seen, sudo apt-get update/upgrade and so on are
    designed to upgrade the software that’s already installed on the system. How do
    you install more apps though? It just so happens that it’s extraordinarily simple.
    First you need an app to install, so let’s use Stella again. Enter: `sudo apt-get
    install stella`.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_49_1.png)


    +   **STEP 3** You need to enter y to confirm the installation, which takes up
    around 5.5MB of storage in the system. Once Stella is installed, you can see again
    that Mint has automatically created the Games category in the Menu as well as
    the app shortcut.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_49_2.png)


    +   **STEP 4** Sometimes, when installing software, you need to add the app’s
    Repository. The repository, or repo, is simply the remote server location where
    the software is held, along with all its dependencies (the vital libraries and
    such it needs to function). Start by typing in this: `sudo add-apt-repository
    ppa:peterlevi/ppa`. Press Enter when asked to add and the PPA (Personal Package
    Archive).


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_49_3.png)'
  merge: -1
  img_proc: true
- pgno: 50
  md: '# Install Apps via the Terminal – Part 1


    # STEP 5


    This adds the repo for the app Variety Wallpaper Changer, an Ubuntu-based app
    that works in Mint and changes the wallpaper automatically. Now that the repo
    is added, enter: sudo apt-get update, to update the new information and add the
    contents of the repo to the package database.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_50_0.png)


    # STEP 6


    Now to install Variety, enter: sudo apt-get install variety. Press y to confirm
    and accept the installation, and to continue with the install. Once installed,
    you can type variety in the Terminal to run the app.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_50_1.png)


    # REMOVING APPS


    In addition to installing apps, the apt command can also be used to remove any
    apps and helps keep the system tidy and free up resources.


    # STEP 1


    To uninstall, or remove, the Variety app enter the following: sudo apt-get remove
    variety. Enter y to continue with the uninstall of the app; notice also that you''re
    informed of how much space you''re freeing up on the hard drive as a result of
    removing the app.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_50_2.png)


    # STEP 3


    When you remove apps from the system you''re informed that some packages that
    were automatically installed are no longer required. You already saw in the previous
    tutorial, you can tidy things up with the following command: sudo apt-get autoremove,
    followed by pressing y to accept the process.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_50_3.png)


    # STEP 2


    While the ''apt-get remove'' command uninstalls an app, it doesn''t get rid of
    the extra clutter that comes with an app, such as configuration and library files.
    To completely remove the clutter, enter: sudo apt-get purge variety.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_50_4.png)


    # STEP 4


    Finally, to tidy up all the non-used packages in the system, and to remove elements
    that the autoremove command didn''t, you can enter: sudo apt-get autoclean. These
    last few steps are vital for keeping your Linux Mint setup in good working order
    and to trim off the unnecessary excess caused by installations and upgrades.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_50_5.png)'
  merge: -1
  img_proc: true
- pgno: 51
  md: '# # Install Apps via the Terminal – Part 2


    Most of the time you''ll get to install apps from the Terminal using the standard
    apt-get command. However, sometimes an app demands a little more work. This means
    installing an app from its source code, which isn''t as scary as it first sounds.


    # ## FROM THE SOURCE


    The commands you''ll need to become familiar with here are Configure, Make and
    Install. You''ll find a lot of apps use installing from source, so it''s certainly
    a skill worth investing time in.


    +   **STEP 1** Source code files for Linux usually come in the form of .TAR.GZ
    or .TAR.BZ2. Both are compressed files holding all the core files needed to ''make''
    the app. Start off this tutorial by creating a new folder in Home: `mkdir Vim`.


    +   **STEP 3** The wget command retrieves content from the internet, in this case
    the .BZ2 file for Vim. To check the file was downloaded successfully, enter: ls.
    According to Mint''s file system colour key, the compressed file should be displayed
    in red.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_51_0.png)


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_51_1.png)


    +   **STEP 2** Vim, by the way, is an advanced text editor which we''ll use as
    an example to install. Enter the new folder, cd Vim, then from within the new
    Vim folder, enter the following command into the Terminal: `wget ftp://ftp.vim.org/pub/vim/_unix/vim-7.4.tar.bz2`.


    +   **STEP 4** We need to uncompress the contents of the file now, so enter: `tar
    -xf vim-7.4.tar.bz2` into the Terminal. Note: you can type in tar -xf v and press
    the Tab key to auto-fill the remaining file name.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_51_2.png)


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_51_3.png)'
  merge: -1
  img_proc: true
- pgno: 52
  md: '# STEP 5


    If you enter `ls` again, you’ll notice that a new folder has been created: `vim74`;
    in light blue text representing a folder in Mint. It’s always handy to create
    root folders for the main app, then as you upgrade apps through this method the
    individual versions will each have their own folder.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_52_0.png)


    # STEP 6


    Type in `cd vim74` to enter the folder, and `ls` again to view its contents. There
    will likely be a fair number of files present; most are app’s core files, while
    others will be labelled **README** or **INSTALL**. It’s wise to read these files
    first as they provide valuable information regarding the installation.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_52_1.png)


    # STEP 7


    The first part of the installation requires you to enter `./configure`. The `./configure`
    command will check your system for any missing dependencies associated with the
    app. If you received an error regarding a C Compiler, then enter: `sudo apt-get
    install build-essential`. The third-party app Ncurses was recorded as missing.
    We need to install that with: `sudo apt-get install libncurses5-dev libncursesw5-dev`.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_52_2.png)


    # STEP 8


    You may need to keep installing new dependencies, as installed, depending on the
    app. After each new dependency is installed, re-run `./configure` and when it
    doesn’t report back an error you can continue to the next stage of the installation.
    Note: you may need to search online for some error messages.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_52_3.png)


    # STEP 9


    With a successful `./configure`, the system will create a **Makefile**. This needs
    to be ‘made’ by entering: **make** into the Terminal. This may take a while, depending
    on the size of the app.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_52_4.png)


    # STEP 10


    Finally, you need to enter: `sudo make install` into the Terminal. This will install
    the app, and make it ready for use in the system. When complete you can execute
    the app, in this case by entering **vim** into the Terminal or searching for it
    via the Dash.


    ![](img/d501697c83491ed0bb4b382b0d28ef0a_52_5.png)'
  merge: -1
  img_proc: true
