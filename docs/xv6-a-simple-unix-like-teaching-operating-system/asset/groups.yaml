    # Code: Buffer cache


    The buffer cache is a doubly-linked list of buffers. The function binit, called
    by main (1331), initializes the list with the NBUF buffers in the static array
    (4350-4359). All access to the buffer cache refer to the linked list via bcache.head,
    not the buffer array itself.


    A buffer has three states associated with it. B_VALID indicates that the buffer
    contains a copy of the block. B_DIRTY indicates that the buffer content has been
    modified and needs to be written to the disk. B_BUSY indicates that some kernel
    has a reference to this buffer and has not released it.


    Read (442) calls bget to get a buffer for the given sector (4406). If the buffer
    needs to be read from disk, break calls idew to do so before returning the buffer.
    Bget (4366) scans the list for a buffer with the given device and sector numbers
    (4373-4388). If there is such a buffer, and the buffer is not busy, bget sets
    the B_BUSY flag and returns. If the buffer is already in use, bget sleeps on the
    buffer to wait for its release. When sleep returns, bget cannot assume that the
    buffer is available. Since sleep releases and reacquires the lock, there is no
    guarantee that b is still right: it may have been used for a different disk sector.
    Bget must start covered by (4382), hoping that the outcome will be different this
    time.


    If there is no cache for the given sector, bget must make one, possibly reusing
    a buffer that has a different sector. It scans the list a second time, looking
    for a buffer that is not busy; any such buffer can be used. Bget edits the buffer
    metadata to record the new device and sector number (4393-4395). Note that assignment
    to flags not only sets the B_BUSY but also clears the B_VALID and B_DIRTY bits,
    thus ensuring that we read the block data from disk rather than incorrectly using
    the buffer''s previous contents.


    Because the buffer cache is used for synchronization, it is important that there
    is only one buffer for a particular disk. The assignments (4391-4393) are only
    safe because bget''s first loop detected for that sector, and bget has not given
    up bcache.lock since then.


