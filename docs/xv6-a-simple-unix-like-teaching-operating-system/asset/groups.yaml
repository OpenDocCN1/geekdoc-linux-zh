    # # Chapter 1


    # ## Operating system organization


    A key requirement for an operating system is to support several activities at
    once. For example, using the system call interface described in chapter 0 a process
    can start new processes with fork. The operating system must time-share the resources
    of the computer among these processes. For example, even if there are more processes
    than there are hardware processors, the operating system must ensure that all
    of the processes make progress. The operating system must also arrange for isolation
    between the processes. That is, if one process has a bug and fails, it shouldn''t
    affect processes that don''t depend on the failed process. Complete isolation,
    however, is too strong, since it should be possible for processes to interact;
    pipelines are an example. Thus an operating system must fulfil three requirements:
    multiplexing, isolation, and interaction.


    This chapter provides an overview of how operating systems are organized to achieve
    these results. There are many ways to do so, but this focuses on mainstream designs
    around a monolithic kernel, which is used by many Unix operating systems. This
    chapter introduces xv6 designs by tracing the creation of the first process when
    xv6 starts. In doing so, the text provides a glimpse of the implementation of
    all abstractions xv6 provides, how they interact, and how the three requirements
    of multiplexing, isolation, and interaction are met. Most of xv6 avoids-specialasing
    the first process, and instead reuses code that xv6 must provide for standard
    operation. Subsequent chapters will explore each abstraction in more detail.


    xv6 runs on Intel 8038 or later ("x86") processors on a PC platform, and much
    of its low-level functionality (for example, its process implementation) is x86-specific.
    This book assumes the reader has done a bit of machine-level programming on some
    architecture, and will introduce x86-specific ideas as they come up. Appendix
    A briefly outlines the PC platform.


    # ## Abstracting physical resources


    The first question one might ask when encountering an operating system is why
    it have all it? That is, one could implement the system calls in Figure 0-2 as
    a library, with which applications link. In this plan, each application could
    directly interact with hardware resources and use those resources in the best
    way for the application (e.g., to achieve high or predictable performance). Some
    operating systems for embedded devices or real-time systems are organized in this
    way.


    The downside of this library approach is that, if there is more than one applic'
