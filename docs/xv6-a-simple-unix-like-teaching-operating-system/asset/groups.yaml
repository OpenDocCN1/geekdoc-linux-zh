    ph.memsz < ph.vaddr). This is a check for whether the sum overflows a 32-bit integer.
    The danger is that a user could construct an ELF binary with a ph.vaddr that points
    into the kernel, and ph.memsz large enough that the sum overflows to 0x1000. Since
    the sum is small, it will check if(newsz >= KERNBASE) in allocuvum. The subsequent
    call to loadum dumps ph.vaddr by itself, without adding ph.memsz and without checking
    ph.vaddr against KERNBASE, and would thus copy data from the ELF binary into the
    kernel. This could be exploited by a user to run arbitrary code with kernel privileges.
    As this example illustrates, argument checking must be done with great care. Real-world
    kernels have a long history of missing checks whose absence can be exploited by
    user programs to obtain kernel privileges. It is likely that xv6 doesn''t do a
    complete job of validating user-level supply to the kernel, where a malicious
    user program might be able to circumvent xv6''s isolation.


    # Real world


    Like most operating systems, xv6 uses the paging hardware for memory protection
    and paging. Most operating systems make far more sophisticated than paging for
    xv6; xv6 lacks paging from disk, copy-on-write fork, shared lazy-allocated pages,
    and automatically extending stacks. The x86 address translation using segmentation
    (see Appendix B), but xv6 uses segments only for the common trick of implementing
    per-CPU variables that proc are at a fixed address but have different values on
    different CPUs (see seginit). Implementations of per-CPU (or per-thread) storage
    on non-segment architectures would require a register to holding a pointer to
    the per-CPU data area, and the x86 has so few registers that the extra effort
    required to use segmentation is worthwhile.


