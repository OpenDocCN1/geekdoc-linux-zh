    The IDE driver routed interrupts statically to a particular processor. Some drivers
    have a sophisticated algorithm for routing interrupts to processor so that the
    load of processing packets is well balanced but good locality is achieved. For
    example, a network driver might align to deliver interrupts for packets of one
    network connection to the processor that is managing, while interrupts for packets
    of another connection are delivered to another processor. This routing can get
    quite sophisticated; for example, if some network connections are short lived
    while others are long and the operating system wants catch all busy processors
    to achieve high throughput.


    If user process reads a file, for that data is copied twice. First, from the disk
    to kernel memory by the driver, and later it is copied from kernel space to user
    space by the read system call. If the user process, then sends the data out the
    network, the data is copied twice: once from user space to kernel and from kernel
    space to the network device. To support applications for which low latency is
    important, use special code paths to avoid these many copies. As one example,
    in real-world operating systems, buffers typically match the hardware page size,
    so that read-only copies are mapped into a process''s address space using the
    paging hardware, without any copying.


