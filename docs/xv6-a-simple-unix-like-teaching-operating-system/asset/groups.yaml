    ## Buffer cache Layer


    The buffer cache has two jobs: (1) synchronize access to disk blocks to ensure
    that only one copy of a block is in memory and that one kernel thread at a time
    uses copy; (2) popular buffers so that they do not need to be re-read from the
    slow disk. The code is in bio.c.


    The main interface exported by the buffer cache consists of read and write; the
    former forms a buffer containing a copy of a block which can be read or modified
    in memory, and the latter writes a modified buffer to the appropriate block on
    the disk. A kernel thread must release a buffer by calling release when it is
    done.


    The buffer cache synchronizes access to each block by allowing at most one kernel
    thread to have a reference to the block''s buffer. If one kernel thread has obtained
    a reference to a buffer that hasn''t released it, other threads'' calls to read
