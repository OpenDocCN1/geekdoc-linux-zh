    Scheduler(2708) runs a loop: to find a process, run until it stops, repeat. scheduler
    holds ptable.lock for most of its actions, but releases the lock (and explicitly
    interrupts) in each iteration of its outer loop. This is important for the special
    case in which this CPU is idle (can find RUNNABLE process). If an idling scheduler
    looped with the lock continuously, no other CPU was running process-related call,
    and in particular could never mark as RUNNABLE so as to break the idling CPU out
    of its scheduling loop. The reason to enable interrupts periodically on an idling
    CPU is that there might be RUNNABLE process because processes create (e.g., the
