    \ Morris\n\nxv6-book@pdos.csail.mit.edu\n\n截至2016年9月5日的草案\n\n# 目录\n\n- 0 操作系统接口\
    \ 7\n- 1 操作系统结构 17\n- 2 页表 29\n- 3 陷阱、中断与驱动程序 39\n- 4 锁机制 51\n- 5 调度 59\n- 6 文件系统\
    \ 73\n- 7 总结 89\n- A PC 硬件 91\n- B 启动加载器 95\n\n索引 101\n\n# 前言与致谢\n\n这是一份旨在用于操作系统课程的草稿文本。它通过研究一个名为\
    \ xv6 的示例内核来解释操作系统的主要概念。xv6 是 Dennis Ritchie 和 Ken Thompson 的 Unix 第6 版 (v6) 的重新实现。xv6\
    \ 宽松地遵循 v6 的结构和风格，但使用 ANSI C 语言基于 x86 的多处理器实现。\n\n本文应配合 xv6 的源代码一起阅读。这种方法的灵感来自\
    \ John Lions 的《UNIX 第6版注释》(Peer to Peer Communications; IS-BN: 1-57398-013-7;\
    \ 第1版（2000年6月14日））。请参见 https://pdos.csail.mit.edu/6828 以获取 v6 和 xv6 在线资源链接。\n\n\
    我们在 MIT 的 6.828 操作系统课程中使用过本书。我们感谢 6.828 的教职员工、助教和学生，他们直接或间接地为 xv6 做出了贡献。特别，我们要感谢\
    \ Austin Clements 和 Nikolai Zeldovich。最后，我们感谢向我们发送邮件指正书中错误的朋友们：Abuktil Aghayev,\
    \ Sebastian Boehm, Raphael Carvalho, Color Fuzzy, Giuseppe, Jacek Masiulaniec,\
    \ Askar Safin, Pawel Szczurko, Warren Tooney 和 Zou Chang Wei。\n\n如果您有意见，请发送至 6.828-staff@pdos.csail.mit.edu。\n\
    \n# 第0章\n\n## 操作系统接口\n\n操作系统的工作是在多个程序之间共享计算机，并提供比硬件本身支持的更有用的服务。操作系统管理并抽象了底层硬件，例如，文字处理器不需要关心正在使用哪种类型的磁盘硬件。它还在多个程序之间共享硬件，以便它们能够同时运行（或看起来是同时运行的）。最后，操作系统为程序之间的交互提供了受控的方法，以便它们可以共享数据或协同工作。\n\
    \n操作系统通过接口为用户程序提供服务。设计一个良好的接口证明是困难的。一方面，我们希望接口简单且狭窄，因为这样更容易实现正确的功能；另一方面，我们可能想为应用程序提供许多复杂的功能。解决这种紧张关系的挑战在于设计出依赖少数机制的接口，这些机制可以通过组合提供极大的通用性。\n\
    \n本书使用一个单一操作系统作为具体示例来解释操作系统概念。该操作系统 xv6 提供了 Thompson 和 Ritchie 的 Unix 操作系统引入的基本接口，并包含了\
    \ Unix 的内部设计。Unix 提供了一个狭窄的接口，其机制结合得很好，提供了令人惊讶的通用性。这种接口如此成功，以至于现代操作系统——BSD、Linux、Mac\
    \ OS、Solaris，以及很大程度上的 Microsoft Windows——都具有类 Unix 的接口。理解 xv6 是理解这些任何系统及更多内容的良好开始。\n\
    \n如图 0-1 所示，xv6 采取了传统的特殊程序形式，为运行中的程序提供服务。每个运行中的程序称为“进程”，它拥有包含指令、数据和栈的内存。指令实现了程序的计算。数据是计算所作用的变量。当进程需要调用内核时，它调用操作系统的接口。这种调用被称为系统调用。系统进入内核，执行并返回。因此，进程在用户空间和内核空间之间交替执行。内核使用\
    \ CPU 的硬件保护机制确保每个在用户空间执行的进程只能访问其内存。实现这些保护需要硬件权限；当用户程序调用系统调用时，硬件提升权限级别并执行内核中预定义的函数。xv6\
    \ 提供的系统调用子集是 Unix 提供的服务。图 0-2 列出了 xv6 的所有系统调用。\n\n![](img/47079f861662cfee081448c25_70.png)\n\
    \n本章的其余部分概述了 xv6 的服务——进程、内存、文件描述符、管道和文件系统——并通过代码片段和讨论展示了它们是如何设计的。系统调用接口的本质是 Unix\
    \ 提供的。结果是，现代 Unix 系统有很多 shell 可供选择，每个都有自己的功能。xv6 的简单实现是从用户程序读取命令并执行它们。它的实现可以见第85页。\n\
    \n## 进程与内存\n\nxv6 进程消耗用户空间内存（指令、数据和栈）以及进程私有的状态。xv6 可以进行时间复用：它在等待执行的进程之间切换 CPU。当进程未执行时，它会保存\
    \ CPU 寄存器，并在下次运行时恢复它们。内核将进程标识符或 pid 与每个进程关联。\n\n进程可以使用 `fork` 系统调用创建一个新进程。`fork`\
    \ 创建一个称为子进程的新进程，它与调用进程具有相同的内存内容。在父进程中，`fork` 返回子进程的 pid；在子进程中返回零。例如，考虑以下片段：\n\n\
    ```\nint pid = fork();\nif(pid > 0) {\n    printf(\"parent:%d\\n\", pid);\n  \
    \  pid = wait();\n    printf(\"child %d is done\\n\", pid);\n} else if(pid ==\
    \ 0) {\n    printf(\"child exiting\\n\");\n    exit();\n} else {\n    printf(\"\
    fork error\\n\");\n}\n```\n\n`exit` 系统调用导致进程停止执行并释放内存和打开的文件。\n\n## 系统调用\n\n###\
    \ 描述\n\n| 系统调用 | 描述 |\n| :--- | :--- |\n| `fork()` | 创建当前进程 |\n| `exit()` | 终止当前进程\
    \ |\n| `wait()` | 等待子进程退出 |\n| `kill(pid)` | 终止进程 pid |\n| `getpid()` | 返回当前进程的\
    \ pid |\n| `sleep(n)` | 睡眠 n 个周期 |\n| `exec(filename, *argv)` | 加载文件并执行 |\n| `brk(n)`\
    \ | 进程增长 n 字节 |\n| `open(filename, flags)` | 打开文件；读写 |\n| `read(fd, buf, n)` |\
    \ 从打开的文件读取 n 字节到 buf |\n| `write(fd, buf, n)` | 向打开的文件写入 n 字节 |\n| `close(fd)`\
    \ | 释放文件 fd |\n| `dup(fd)` | 复制 fd |\n| `pipe(p)` | 创建管道并返回 p 中的 fds |\n| `chdir()`\
    \ | 当前目录 |\n| `mkdir(name, mode)` | 创建新目录 |\n| `link(f1, f2)` | 为文件 f1 创建另一个名称\
    \ (f2) |\n| `unlink(filename)` | 删除文件 |\n\n图 0-2. xv6 系统调用\n\n"
