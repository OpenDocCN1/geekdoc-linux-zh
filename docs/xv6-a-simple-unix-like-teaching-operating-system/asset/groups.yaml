    ## Process address space


    The page table created by entry has enough mappings to allow the kernel''s C code
    to start running. However, main immediately changes to a new page table by calling
    kvminit (1857), because kernel has a more elaborate plan for describing address
    spaces.


    Each process has a separate page table, and xv6 tells the page hardware to switch
    tables when xv6 switches between processes. As shown in Figure 2-2, a process''s
    user memory starts at virtual address and can grow to KERNBASE, allowing a process
    to address up to 2 GB of memory. The file memlayout.h (0280) describes the constraints
    for xv6''s memory layout, and to convert virtual to physical addresses.


    ![](img/47079f861662c1cfee081448e44c8a25_30_0.png)


    **Figure 2-2.** Layout of the virtual address space and the layout of the physical
    address space. Note that if a machine has more than 2 Gbyte of physical memory,
    xv6 can use only the memory that fits between KERNBASE and 0xFE00000.


    When a process asks xv6 for more memory, xv6 finds free pages to provide the store,
    and adds PTEs to the process''s page table that point to the new physical pages.
    xv6 sets the PTE_U, PTE_W, and PTE_P flags in these PTEs. Most processes do not
    use the entire address space; xv6 leaves PTE_P clear unless PTEs are set. Different
    processes page tables translate addresses to different pages of physical memory,
    so that each process has user memory.


    xv6 includes all mappings needed for the kernel to run in every process''s page
    tables; these mappings appear above KERNBASE. It maps virtual addresses KERNBASE:PHYSSTOP
    to 0:PHYSSTOP. One reason for this mapping is so that the kernel can use its own
    instructions and data. Another reason is that the kernel sometimes needs to be
    able to write a given page of physical memory, for example when creating table
    pages; having every physical page appear at a predictable virtual address makes
    this convenient. A defect of this arrangement is that xv6 cannot use more than
    2 GB of physical memory. Some devices that use memory-mapped I/O appear at physical
    addresses at 0xFE00000, so xv6 page tables including direct mapping for them.
    xv6 does not set the PTE_U flag in the PTEs above KERNBASE, so only the kernel
    can use them.


    Having every process''s page table contains mappings for both user memory and
    the entire kernel is convenient when switching from user to kernel during system
    calls and interrupts; such switches do not require page switches. For the most
    part the kernel does not have its own page table; it is almost always borrowing
    some process''s page table.


    To review, xv6 ensures that each process can use only its memory, and that each
    process sees its memory as contiguous virtual addresses starting at zero. xv6
    implements this by setting the PTE bit on virtual addresses that refer to the
    process''s memory. It implements the second by using page tables to translate
    successive virtual addresses to whatever pages happen to be allocated to the process.


    ## Code: creating an address space


    ```

    kmalloc(1857) to create and switch to a page with the mappings above KERNBASE
    for the kernel. Most of the work happens in setupkvm(1857). It allocates a page
    of memory to hold the page directory. Then it calls mappings to install the translations
    that the kernel needs, which are described in the kmap(1828) array. The translations
    include the kernel''s instructions and, physical memory ranges which are actually
    I/O devices. setupkvm does not install any mappings for the user memory; this
    will happen later.

    ```


    mappings(1779) installs mappings into a page table for virtual addresses to a
    corresponding range of physical addresses. This does it separately for each virtual
    address in the range, at page levels. For each virtual address to be mapped, mappings
    walkpgdir to find the PTE for that address. It initializes the PTE to find the
    relevant physical page number, the desired permissions (valid PTE_W/or PTE_U),
    and PTE_P to mark the PTE as valid (1791).


    walkpgdir(1754) mimics the actions of the x86 paging as it looks up the PTE address
    for a virtual address (see Figure 2-1). walkpgdir uses the upper 10 bits of the
    virtual address to find the page directory entry (1759). If the page directory
    entry is not present, then the required page table hasn''t been allocated; the
    allocwalkpgdir allocates it puts its physical address in the page directory. Finally
    it uses the next 10 bits of the virtual address to find the address of the PTE
    in the page table page (1772).


    ## Physical memory allocation


    The kernel must allocate and free physical memory at run-time for page tables,
    process user memory, kernel stacks, and pipe buffers. xv6 uses physical memory
    between the end of the kernel and PHYSOP for run-time allocation. It allocates
    and frees whole 4096-byte pages at a time. It keeps track of which pages are free
    by threading a linked list through the pages themselves. Allocation consists of
    removing a page from the free list; freeing consists of adding the free page to
    the list.


    There is a bootstrap problem: all physical memory must be mapped in order for
    the allocator to initialize the free list, but creating a page with those mappings
    involves allocating page-pages. xv6 solves this problem by using a separate allocator
    during entry, which allocates memory until the end of the kernel''s segment. This
    allocator does not support freeing and is limited by the 4 MB mapping in the entrypgdir,
    but is sufficient to allocate the kernel page table.


    ```

    struct run

    main

    init

    code=PHYSTOP

    free=kfree

    PGROUNDUP

    type=kallococ

    ```


    ## Code: Physical memory allocator


    The allocator''s data structure is a free list of physical pages that are available
    for allocation. Each free page''s list element is a struct (3014). Where does
    the allocator get to hold that structure? It stores each free page structure in
    the page itself, since there''s nothing else stored. The free list is protected
    by a spin lock (3018-9022). The list and lock are wrapped in a struct to make
    clear that the lock protects the fields in the struct. For now, the lock and calls
    to acquire and *release*; Chapter 4 explains locking in detail.


    The main function calls kinit1 and kinit2 to initialize the allocator (3030).
    The reason for having two calls is for which one cannot use locks or memory above
    4 megabytes. Because kinit1 sets up for less-allocation in the first 4 megabytes,
    and kinit2 enables locking and arrangements for more memory to be allocable, main
    might determine how much physical memory is available, but this turns out to be
    difficult on the x86. It assumes that the machine has 240 megabytes (PHYSSTOP)
    of physical memory, and all the memory between the end of the kernel and PHYSSTOP
    as the initial pool of free memory. kinit1 and kinit2 call freerange to add memory
    to the free list via per-page calls to kfree. The allocator starts with memory;
    these calls to kfree give it to manage.


    The allocator refers to free pages by their virtual addresses as mapped in memory,
    not by their physical addresses, which is why kinit uses P2V(PHYSSTOP) to translate
    PTE (a physical address) to a virtual address. The allocator treats addresses
    as integers to perform arithmetic on them (e.g., traversing pages in kinit), and
    sometimes uses addresses as pointers to read and write memory (e., manipulating
    the run structure stored in each page); this dual use of addresses is the main
    reason that the allocator code is full of C type casts. The other reason is that
    freeing and allocation inherently change the type of memory


    The function kfree (3065) begins by setting every byte in the memory being freed
    to the value 1. This will cause code that uses memory after freeing it ("dangling
    references") to read garbage inside of the old valid contents; hopefully that
    will cause such code to break. kfree v a pointer to struct run, records the start
    of the free list in r->next, and sets the free list to r. kallococ removes the
    first element in the free list.

