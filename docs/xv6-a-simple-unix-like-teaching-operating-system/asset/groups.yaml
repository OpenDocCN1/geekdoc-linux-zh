    its own address space. The x86 page table translates (“or maps”) to a virtual
    address (the address that an x86 instruction manipulates) to a physical address
    (the address that the processor chip sends to memory).


    xv6 maintains a separate page table for each process that defines the process’s
    address space. As illustrated in Figure 1-2, an address space includes the process’s
    user memory starting at virtual address zero. Instructions come first, followed
