    ## 日志设计 (Log design)


    日志位于超级块（superblock）中指定的已知固定位置。它由一个头块和后面的一系列更新后的块（“日志块”）组成。头块包含一个扇区数组，每个日志块一个。头块还包含日志块的计数。xv6
    在事务提交时写入头块，在此之前写入，并在将日志块复制到文件系统后将计数置零。因此，事务中途的崩溃将导致日志头块中的计数为零；提交后的崩溃将导致计数不为零。


    每个系统调用必须是原子的。为了提高效率并允许文件系统具有某种程度的并发性，日志系统可以将多个系统调写入聚合到一个事务中。为了避免将一个系统调用跨越多个事务，日志系统仅在没有文件系统调用正在执行时才提交。这种将多个事务一起提交的想法被称为“组提交（group
    commit）”。组提交允许多个事务并发运行，并允许文件系统批处理多个磁盘操作，并使用日志按照磁盘带宽的速率调度块的写入。xv6 的 IDE 驱动程序不支持批处理，但
