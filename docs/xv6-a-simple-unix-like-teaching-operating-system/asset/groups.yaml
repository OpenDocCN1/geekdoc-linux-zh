    \ 的 shell）；如果调度器禁用了所有中断，那么 I/O 将永远不会到达。\n\n调度器遍历进程表以寻找 `p->state == RUNNABLE`\
    \ 的进程。一旦找到一个，它会设置 `cpu->current` 进程变量，通过 `switchvm` 切换到进程页表，将进程标记为 `RUNNING`，然后调用启动它的函数（`starting(2722-2728)`）。\n\
    \n理解调度器结构的一种方式是，它安排强制执行一组关于每个进程的不不变性（invariants），每当不变性不成立时持有 `ptable.lock`。不变性是指：如果一个进程正在运行，则定时器中断必须能够从该进程切换出去；这意味着\
    \ CPU 寄存器必须持有进程的寄存器值（即它们实际上并不在上下文中），`%cr` 必须指向进程页表，`%sp` 必须指向进程的内核栈以便 `switch`\
    \ 压入寄存器，并且必须指向进程的 `proc[]` 槽。另一个不变性是：如果一个进程是 `RUNNABLE`，则空闲 CPU 的调度器必须能够运行它；这意味着\
    \ `p->context` 必须持有进程线程变量，没有 CPU 在进程内核栈上执行，没有 CPU 的 `%cr3` 指向该进程页表，且没有 CPU 指向该进程。\n\
    \n维护不变性就是为什么我们在一个线程中（在 `yield` 中）加锁，而在另一个线程中（`scheduler` 或另一个内核线程）释放锁的原因。一旦调度器开始修改进程状态，它就必须持有锁直到完成对不变性的运行：最早的释放点是在调度器停止进程页表并清空\
