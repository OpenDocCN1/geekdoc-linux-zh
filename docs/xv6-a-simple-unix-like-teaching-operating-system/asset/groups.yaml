    xv6 在磁盘上预留了固定空间来存放日志。一个事务中系统调用写入的块总数必须适合该空间。这产生了两个结果：不允许任何单个系统调用写入的内容超过日志空间。这对于大多数系统调用来说不是问题，但有两个系统调用可能会写入很多块：`write`
    和 `unlink`。大文件可能会写入许多数据块和位图块；取消一个大文件可能会写入许多位图块和一个 inode 块。xv6 的系统调用将大写入拆分为多个适合日志的较小写入，这不会引起问题，因为在实践中
    xv6 文件系统只使用一个位图块。日志空间限制的另一个结果是，除非确定系统调用的写入能够放入日志剩余空间，否则日志系统不允许调用开始。


