    The kernel must implement the process abstraction with care because a buggy or
    malicious application may trick the mechanisms used to implement processes include
    the user/kernel mode flag, address spaces, and time-slicing of threads.


    To enforce isolation, the process abstraction provides the illusion to a program
    that it has its own private process. A process provides private memory, or address
    space, which other processes cannot read or write. A process also provides the
    program with what appears to be its CPU to execute the program instructions.


