    中检查 `(newsz >= KERNBASE)`。后续对 `loaduvm` 的调用直接释放 `ph.vaddr`，而没有加上 `ph.memsz` 也没有相对于
    KERNBASE 检查 `ph.vaddr`，从而会将从 ELF 二进制文件拷贝到内核中。用户可以利用这一点以内核权限运行任意代码。正如此示例所示，参数检查必须非常小心。真实世界的内核有缺失检查的悠久历史，这些缺失可以被用户程序利用以获取内核权限。xv6
    可能没有完全完成对内核用户级供给的验证工作。


    # 现实世界


    与大多数操作系统一样，xv6 使用分页硬件进行内存保护和分页。大多数操作系统的分页机制比 xv6 复杂得多；xv6 缺少从磁盘分页、写时复制 fork（copy-on-write
    fork）、共享懒懒分配页以及自动扩展栈。x86 使用分段进行地址翻译（见附录 B），但 xv6 仅将段用于实现每个 CPU 变量的常用技巧，即 `proc`
    位于固定地址，但在不同 CPU 上具有不同的值（见 `seginit`）。在非分段架构上实现每个 CPU（或每个线程）的存储需要一个寄存器来持有指向每个 CPU
    数据区域的指针，而 x86 寄存器非常少，使用分段所需的额外工作是值得的。


    在具有大量 RAM 的机器上，使用 x86 的小页以允许细粒度的分配和页交换交换可能是有意义的。例如，如果程序只使用 8 Kbyte 内存，每个页 4 Mbyte
    就是浪费的。在具有大量 RAM 的机器上，大页是有意义的，可以减少页表映射的开销。xv6 直接使用页：初始页表 (1412)。数组初始化了 1024 个 PTE
    中的两个，即索引 0 和 512 (`KERNBASE>>PSHIFT`)，留下其他 PDE 为零。xv6 在这两个 PTE 中设置了 `PTE_PS` 将它们标记为大页（super
    pages）。


    xv6 应该请求实际配置，而不是假设 240 MB。在 x86 上，至少有三种算法：第一种探测物理地址空间寻找行为像内存的区域并保留布局；第二是从 PC 的非易失性
    RAM 中已知的 16 位位置读取内存的 KB 数；第三是在 BIOS 中查找作为多处理器布局一部分的内存布局表。读取内存布局是复杂的。


    内存分配很久以前是一个热门话题，基本问题是使用内存的效率以及为未知的未来请求做准备；见 `Kern`。


    今天人们更关心速度而不是空间效率。此外，更复杂的内核可能会分配许多不同尺寸的小块，而不是（在 xv6 中）只有 4096 字节的块；内核分配器需要处理小分配以及大分配。


    # 练习


    - 1. 查看真实的操作系统看看它们如何确定内存大小。

    2. 如果 xv6 没有使用大页，`entrypgdir` 的正确声明应该是什么？

    3. 写一个用户程序，通过调用 `sbrk(1)` 以 1 字节的大小增长其地址空间。运行该程序并在调用 `sbrk` 之前之后调查程序的页表。内核分配了多少空间？新内存的
    pte 包含什么？

    4. 修改 xv6 使得内核页在进程之间共享，这减少了内存消耗。

    5. Unix 的 exec 实现传统上对 shell 脚本特殊处理。如果要执行的文件带有 `#!` 文本，则第一行被认为是解释文件的程序。例如，如果调用
    exec 运行 `myprog arg1` 且 `myprog` 的第一行是 `#!/interp`，则 exec 运行 `/interp myprog arg1`。在
    xv6 中实现对这种惯的支持。

    6. 删除 `exec.c` 中的检查 `if(ph.vaddr + ph.memsz < ph.vaddr)`，并构造一个利用该检查缺失的用户程序。


    '
