    获取目录的索引节点开始。它随后调用 `dirlookup` 检查名称是否已存在 (6067)。如果名称存在，`create` 的行为取决于它被用于哪个系统调用：如果代表
    `open`（`type == T_FILE`）且现有名称是普通文件，则作为打开成功，因此 `create` 不返回错误 (6071)。否则，它是一个错误
    (6072-6073)。如果名称不存在，`create` 分配一个新的索引节点（`ialloc`）。如果新索引节点是目录，`create` 用 `.` 和
    `..` 对进行初始化。最后，既然数据已正确初始化，`create` 就可以将其链接到父目录 (6089)。`create` 和 `sys_link` 一样同时持有两个锁：`ip`
    和 `i`。如果索引节点已被持有，就不可能发生死锁：系统中没有其他进程会持有 `ip` 的锁然后尝试尝试锁定它。


    使用 `create` 可以很容易实现 `sys_open`、`sys_mkdir` 和 `sys_mkn`。`sys_open` (6081) 最复杂，创建一个新文件只是它功能的一小部分。如果向
    `open` 传递了 `O_CREATE` 标志，它会创建一个文件 (6114)。否则，它调用 `namei` (6120)。`create` 返回一个锁定的索引节点，但并非如此，`sys_open`
    必须自己锁定索引节点。这提供了一个方便的地方来检查目录是否只读不写。假设获取了其中一者的索引节点，`sys_open` 分配文件和文件描述符 (6132)，然后填充文件
    (6142-6146)。注意，在部分初始化的文件进入当前进程的缓存之前，没有其他进程可以访问它。


    在我们还没有文件系统之前，第五章就已经解释了管道的实现。`sys_pipe` 函数通过提供创建管道对的方法连接到文件系统。它的参数是一个指向两个整数空间的指针，它将在其中记录新的文件描述符。它分配管道并处理文件描述符。


    ## 现实世界


    真实世界操作系统中的缓冲区缓存比 xv6 复杂得多，但它有两个目的：缓存和同步对磁盘的访问。Unix 缓冲区像 xv6 一样使用简单的最久未使用（LRU）驱逐策略；可以实现许多复杂的策略，每种策略适用于某些工作负载，但效果不如其他。更高效的
    LRU 缓存会消除链表，使用哈希表进行查找。现代缓冲区缓存通常与虚拟内存集成。


