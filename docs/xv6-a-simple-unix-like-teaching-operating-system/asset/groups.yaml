    tion running, the applications must be well-behaved. For example, each application
    kernel mode must periodically give up the processor so that other applications
    can run. Such a cooperative operative time-sharing scheme may be OK if all applications
    trust each other and have no bugs. It is more typical for applications to not
    trust each other, and to have bugs, so one often wants stronger isolation than
    a cooperative scheme provides.


    To achieve strong isolation it is helpful to forbid applications from directly
    accessing sensitive hardware resources, and to abstract the resources into services.
    For example, applications interact with a file system only through open, read,
    write, and close systems instead of reading and writing disk sectors. This provides
    the application with the convenience of pathnames, and it allows the operating
    system (the implementor of the interface) to manage the disk.


    Similarly, Unix transparently switches hardware across processes, saving and restoring
    state as necessary, so that applications do not have to be aware of time sharing.
    This transparency allows the operating system to share processes if some applications
    are in infinite loops.


    As another example, Unix uses exec to build its memory image, instead of directly
    interacting with physical memory. This allows the operating system to decide where
    to place a process in memory; if memory is tight, the operating system might even
    store some of a process''s data on disk. Exec also provides users with the convenience
    of a file system to execute programs.


    Many interactions between processes occur via file descriptors. Not do file descriptors
    abstract away many details (e.g., where data in a pipe or file is stored), they
    are also defined in a way that simplifies interaction. For example, if an application
    in a pipeline fails, the kernel generates end-of-file for the next process in
    the pipeline.


    As you can see, the system call interface in Figure 0-2 is carefully designed
    to provide both programmer convenience and the possibility of strong isolation.
    The Unix interface is not the only way to abstract resources, but it has proven
    to be a very good one.


    ## User mode, kernel mode, and system calls


    Strong isolation requires a hard boundary between applications and the operating
    system. If the application makes a mistake, we don''t want the operating system
    to fail. Instead, the operating system should be able to clean up the failed application
    and continue running other applications. Applications shouldn''t be able to modify
    (or even read) the operating system''s data structures or instructions, should
    be able to access other process''s memory, etc.


    Processors provide hardware support for strong isolation. For example, the x86
    processor, like many other processors, has two modes in which the processor can
    execute: kernel mode and user mode. In kernel mode the processor is allowed to
    execute privileged instructions. For example, reading and writing the disk (or
    any other I/O device) involves privileged instructions. If an application in user
    mode attempts to execute a privileged instruction, then the processor doesn''t
    execute instruction, but switches to kernel mode so that the software in kernel
    mode user space can use the application, because it did something it shouldn''t
    be doing. Figure 0-1 kernel space in Chapter 0 illustrates this organization.
    An application can also execute user-mode instructions (e.g., adding numbers,
    etc.) and is said to be running in user space, monolithic kernel while the software
    in kernel mode can also execute privileged instructions and is said to be running
    in kernel space. The software running in kernel space (or in kernel mode) is called
    the kernel.


    An application that wants to read or write a file on disk must trust the kernel
    to do so, because the application cannot execute I/O instructions. Processes provide
    a special instruction that switches the processor from user mode to kernel mode
    and enters the kernel at an entry point switched by the kernel.(the x86 processor
    provides the first instruction for this purpose.) Once the processor has switched
    to kernel mode, the kernel can then validate the arguments of the system call,
    and decide whether the application is allowed to perform the requested operation,
    and deny or execute it. It is important that the kernel sets the entry point for
    transitions to kernel mode; if the application could decide the kernel entry point,
    a malicious application could enter the kernel at a point where the validation
    of arguments etc. is skipped.


    ## Kernel organization


    A key design question is what part of the operating system should run in the kernel.
    One possibility is that the operating system resides in the kernel, so that the
    implementations of all system calls run in kernel mode. This organization is called
    a monolithic kernel.


    In this organization the entire operating system runs with full hardware privilege.
    This organization is convenient because the OS designer doesn''t have to decide
    which part of the operating system needs full privilege. Furthermore, everything
    needs to cooperate. For example, an operating system might have a buffer cache
    that can be shared by both the file system and the virtual memory system.


    A downside of the monolithic organization is that the interfaces between different
    parts of the operating system are often complex (as we will see in this text),
    and therefore it is easy for an operating system developer to make a mistake.
    In a monolithic kernel, a mistake is fatal, because an error in kernel mode will
    not cause the kernel to fail. If the kernel fails, the computer stops running,
    and thus all applications fail. The computer must reboot to start again.


    To reduce the risk of mistakes in the kernel, OS designers can minimize the amount
    of operating code that runs in kernel mode, and execute the bulk of the operating
    system in user mode. This kernel is called a microkernel.


    Figure 1-1 illustrates this microkernel design, the file system runs as a user-level
    process. OS services as processes are called servers. To allow applications to
    interact with the file server, the kernel provides an inter-process communication
    mechanism to send messages from one user-mode process to another. For example,
    if an application like wants to read or write a file, it sends a message to the
    file server and waits for a response.


    ![](img/47079f861662c1cfee081448e44c8a25_19_0.png](Figure 1-1. A microkernel with
    a file system server)


    In a microkernel, the kernel interface consists of a few low-level functions for
    starting applications, sending messages, accessing device hardware, etc. This
    organization allows the kernel to be relatively simple, as most of the operating
    system resides in user-level servers.


    In the real world, one can find both monolithic kernels and microkernels. For
    example, Linux has a monolithic kernel, although some OS run as user-level servers
    (e.g., the window system). xv6 is implemented as a monolithic kernel, following
    most Unix systems. Thus, in xv6, the kernel interface corresponds to the operating
    system interface, and the kernel implements the complete operating system. As
    xv6 doesn''t provide many services, its kernel is smaller than some microkernels.


