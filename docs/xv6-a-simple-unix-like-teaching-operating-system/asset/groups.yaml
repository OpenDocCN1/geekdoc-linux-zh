    ## Code: C trap handler


    We saw in the last section that each handler sets up a trap frame and then the
    C function trap. Trap (3351) looks at the hardware trap number tf->trapno decide
    why it was called and what it needs done. If the trap is T_SCALL, trap calls the
    system handler syscall. We will revisit the proc->killed checks in Chapter 5.


    After checking for a system trap, look for hardware interrupts (which we discussed
    below). In addition to the hardware devices, a trap can be caused by a spurious
    interrupt, an unwanted hardware trap.


    If the trap is not a system call and not a hardware device looking for attention,
    trap assumes it was caused by incorrect behavior (e.g, by zero) as part of the
    code that was executing before the trap. If the code was a user process, xv6 prints
    details and then proc->killed to clean up the user process. We will look at how
    xv6 does this in Chapter 5.


    If it was the kernel, there must be a kernel bug: trap prints details about the
    surprise and then calls trap.


    ## Code: System calls


    For system calls, trap invokes syscall (3625). Syscall loads the system number
    from the trap frame, which contains the saved %ax, and into the system call table.
    For the first system call, %ax contains the value SYS_exec (3457), and syscall
    invokes the_exec''s entry of the system call table, which corresponds to invoking
    sys_exec. When the trap returns to user space, it loads the value from proc->tf
    into the machine registers. Thus, we return the value that the system call returned
    (3631). System calls conventionally return negative numbers to indicate errors,
    positive numbers for success. If the system is invalid, syscall prints an error
    and returns -1.


    Later chapters will examine the implementation of practical system calls. This
    chapter is covered with the mechanisms for system calls. There is one of me: the
    helper functions argptr, argstr, and argfd retrieve the nth system call argument,
    as either an integer, pointer, or file descriptor. argptr uses the user-space
    %esp register to locate the return address for the system call stub right above,
    at %esp+4. Then the nth argument is at %esp+4. argptr calls fetch to read the
    value from user memory and can simply cast the address to a pointer, because the
    user share the same page table, but the kernel must verify that the user program
    tries to read or write outside its local memory will cause a segmentation trap,
    and will kill the process. However, the kernel, can dereference any address that
    the user might have passed to p->sz.


    Note that two checks occur during a call to argptr. First, the stack pointer is
    checked during the fetching of the argument. Then the argument, itself, is checked.
    argptr interprets the nth argument as a pointer. It ensures that the pointer points
    at a NULL-terminated string and that the complete string is located below the
    end of the address space. Finally, argfd(5819) uses argptr to retrieve file, checks
    if it is valid, and returns the corresponding structure. The system implementations
    (for example, sysproc and sysfile) are typically wrappers: they decode the arguments
    using argptr, argstr and then call the real implementations. In chapter 2, sys_exec
    uses these functions to get its arguments.


    ## Code: Interrupts


    Devices on the motherboard can generate interrupts, and xv6 must set up the handler
    to handle these interrupts. Devices usually interrupt in order to tell the kernel
    that some hardware event has occurred, as I/O operation. Interrupts are optional
    in the sense that the kernel could periodically check or "poll" device hardware
    to check for new events. Interrupts are preferable to polling if the events are
    relatively rare, so polling would waste CPU time. Interrupt handling shares some
    of the same code needed for similar system calls, except devices generate at any
    time.


    Interrupts are when there is hardware on the motherboard to signal the CPU when
    a device needs attention (e.g., the user has typed a character on the keyboard).
    We must program the device to generate an interrupt, and arrange that a CPU receives
    the interrupt.


    Let''s look at the timer device and interrupts. We would like the timer generate
    an interrupt, say, 100 times per second so that the kernel can track the passage
    of time and so the kernel can time-slice among multiple running processes. The
    choice of 100 times per second allows for decent performance while not swamping
    the processor with handling interrupts.


