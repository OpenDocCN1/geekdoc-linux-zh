    It is possible to implement locks without atomic instructions, but it is expensive,
    and most operating systems use atomic instructions.


    Locks can be expensive if many processors try to acquire the same lock at the
    same time. If one processor has a cached lock in its local cache, and another
    process must acquire the lock, then the atomic instruction to update the cache
    line that holds the lock must move the line from one processor''s cache to the
    other processor''s cache, and perhaps invalidate any other copies of the cache
    line. Fetching a cache line from another processor''s cache can be of magnitude
    more expensive than fetching a line from a local cache.


    To avoid the expenses associated with locks, many operating systems use lock-free
    data structures and algorithms. For example, it is possible to implement a linked
    list like the one in the beginning of the chapter that requires no locks during
    searches, and one atomic instruction to insert an item in a list. Lock-free programming
    is more complicated, however, than programming locks; for example, one must worry
    about instruction and memory ordering. Programming with locks is already hard,
    so xv6 avoids the additional complexity of lock-free programming.


