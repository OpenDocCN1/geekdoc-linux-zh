    ## Drivers


    A driver is the code in an operating system that manages a particular device:
    it tells the device hardware to perform operations, configures the device to generate
    interrupts when done, and handles the resulting interrupts. Driver code can be
    tricky because a driver executes concurrently with the device that it manages.
    In addition, the driver must understand the device''s interface (e.g. I/O ports
    do what), and that interface can be complex and poorly documented.


    The disk driver provides a good example. The disk driver copies data from and
    back to the disk. Disk hardware traditionally presents the data on the disk as
    a numbered sequence of 512-byte blocks (also called sectors); sector 0 is the
    first 512 bytes, sector 1 is the next, and so on. The block size that an operating
    system uses for its file system may differ from the sector size that a driver
    uses, typically the block size is a multiple of the sector size. xv6''s block
    size is identical to the disk''s sector size. To represent a block xv6 has a structure
    buf sync with the disk: it may not have been read from disk (the disk is working
    on it but hasn''t returned the sector''s content yet), or it might have been updated
    but not yet written out. The driver must ensure the rest of xv6 doesn''t get confused
    when the structure is out of sync with the disk.


    ## Disk: Code driver


    The IDE device provides access to devices connected to the PC standard IDE controller.
    IDE is now falling out of fashion in SCSI and SATA, but the interface is simple
    and lets us concentrate on the overall structure of a driver instead of the details
    of a particular piece of hardware.


    xv6 represent file systems using struct buf (375). BSIZE (390) is identical to
    the IDE''s size and thus buf represents the contents of one sector on a particular
    disk device. The dev and sector fields give the device and sector number and the
    data field is an in-memory copy of the disk sector. Although the xv6 file system
    chooses BSIZE to be identical to the IDE''s size, the driver can handle BSIZE
    that is a multiple of the sector size. Operating systems using larger blocks than
    512 bytes to obtain higher disk throughput.


    The flags track the relationship between memory and disk: the B_VALID flag means
    that data has been read in, and the B_DIRTY flag means that data needs to be written
    out. The B_BUSY flag is a lock bit; it indicates that some process is using the
    buffer and other processes must wait. When a buffer is full the B_BUSY flag is
    set, we


    The kernel initializes the driver at boot time by calling ideinit (415) from main
    (133). Ideinit calls picenable and ioapicenable to enable the IDE_IRQinterrupt
    (416-417). The call to picenable enables the interrupt on a uniprocessor, but
    only on the last CPU (cpu-1) on a two-processor system, CPU 1 handles disk interrupts.


    Next, ideinit polls the disk hardware. It begins by calling idewait (418) to wait
    for the disk to be able to accept commands. A PC motherboard uses bits of the
    disk via I/O port 0x1f7. Idewait (413) polls the status until the busy bit (IDE_BUSY)
    is clear and the ready bit (IDE_DRTY) is set.


    Now that the controller is ready, ideinit can check how many disks are present.
    It assumes that disk 0 is present, the boot loader and the kernel were loaded
    from disk 0, if it must check for disk 1. It writes to I/O port 0x1f6 to select
    disk 1 and waits for the status to show that the disk is ready (420-427). If not,
    ideinit assumes the disk is absent.


    After ideinit, the disk is not used until the buffer fills up, which updates a
    locked buffer as indicated by the flags. If B_DRTY is set, idewr writes the buffer
    to the disk; if B_VALID is not, idewr reads the buffer from the disk.


    Disk accesses typically take milliseconds, a long time for process. The boot loader
    issues read commands and reads the status bits until the data is ready (see Appendix
    B). This polling or waiting is fine in a boot loader, which has nothing better
    to do. In an operating system, it is more efficient to let another process run
    on the CPU and arrange to receive an interrupt when the operation has completed.
    Idewr takes this after loop, keeping the list of disk requests in a queue and
    using interrupts to find out which request has finished. Although idewr maintains
    a queue of requests, the simple IDE disk controller can only handle one operation
    at a time. The disk driver maintains the invariant that it has sent the buffer
    at the front of the queue to the disk hardware; the others are simply waiting
    their turn.


    Idewr (436) adds buffer b to the end of the queue (437-441). If the buffer is
    at the front of the queue, idewr must send it to the disk hardware by calling
    idestart (437-439); otherwise the buffer will be started once the buffers ahead
    of it are taken of.


    Idestart (427) issues either a read or a write for the buffer''s device and sector,
    according to the flags. If the operation is a write, idestart must supply the
    data now (429) and the interrupt will signal that the data has been written to
    disk. If the operation is read, an interrupt will signal that the data is ready,
    and the handler will return it. That idestart has detailed knowledge about the
    IDE device, and writes the right values at the right ports. If any of these out
    statements is true, the IDE will do something different than what we want. Getting
    these details is one reason why writing drivers is challenging.


    Having requested the queue and started it if necessary, idewr must wait for the
    CPU. Instead, idewr sleeps, waiting for the interrupt handler to record in the
    buffer''s flags that the operation is done (438-439). While this process is sleeping,
    xv6 will schedule other processes to keep the CPU busy.


    Eventually, the disk will finish its operation and trigger an interrupt. The trap
    will call deintr to handle it (344). Deintr (337) consults the buffer to find
    out which operation was happening. Now the disk is ready, deintr sets B_VALID,
    B_DIRTY, and wakes up any process sleeping on the disk (438-439). If the queue
    is empty, deintr passes the next request to the disk (421-425).


    ## DMA


    Other hardware is surprisingly similar to disks: device buffers hold packs, audio
    device buffers hold sound samples, graphics buffers hold video data and command
    sequences. High-bandwidth devices—disks, graphics cards, and network cards—often
    use direct memory access (DMA) instead of the explicit I/O (ins, out1) in driver.
    DMA allows the disk or other controllers direct access to physical memory. The
    driver gets the physical address of the buffer''s data field and the device copies
    directly to from memory, interrupting the copy complete. DMA means that the CPU
    is not involved at all in the transfer, which can be more efficient and is less
    taxing for the CPU''s memory caches.

