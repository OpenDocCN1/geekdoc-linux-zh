    # Chapter 7


    ## Summary


    This text introduced the main ideas in operating systems by studying one operating
    system, xv6, line by line. Some code lines embody the essence of the main ideas
    (e.g., context switching, user/kernel boundary, locks, etc.) and each line is
    important; other code lines provide an illustration of how to implement a particular
    operating system idea and could easily be done in different ways (e.g., a better
    algorithm for scheduling, better on-disk data structures to represent files, better
    logging to allow for concurrent transactions, etc.). All the ideas were illustrated
    in the context of one particular, very successful system call interface, the Unix
    interface, but those ideas carry over to the design of other operating systems.


    # Appendix A


    ## PC hardware


    This appendix describes personal computer (PC) hardware, the platform on which
    x86 runs.

    A PC is a computer that adheres to several industry standards, with the goal that
    a given piece of software can run on PCs sold by multiple vendors. These standards
    evolve over time and a PC from 1990s doesn''t look like a PC now. Many of the
    current standards are public and you can find documentation for them online.

    From the outside a PC is a box with a keyboard, a screen, and various devices
    (e.g., CD-ROM, etc.). Inside the box is a circuit board (the “motherboard”) with
    CPU memory chips, memory chips, graphic chips, I/O controller chips and busses
    through which the devices communicate. The busses adhere to standard protocols
    (e.g., PCI and USB) so that devices work with multiple vendors.

    From our point of view, we can abstract the PC into three components: CPU, memory,
    and input/output (I/O) devices. The CPU performs computation, the memory contains
    instructions and data for computation, and devices allow the CPU to interact with
    hardware for storage, communication, and other functions.

    You think of memory as connected to the CPU with a set of wires, or lines, some
    for data bits, and some for control flags. To read a value from memory, the CPU
    sends high or low voltages representing 1 or 0 bits on the address lines and a
    1 on the “read” line for a prescribed amount of time and then reads back value
    by interpreting the data lines. To write a value to memory, the CPU sends appropriate
    bits on the address and data lines and a 1 on the “write” line for a prescribed
    amount of time. Real memory interfaces are more complex than this, but the details
    are only important if you need to achieve high performance.


    ## Processor and memory


    A computer''s CPU (central processing unit, or processor) runs a conceptually
    simple loop: it consults an address in a register called the program counter,
    advances the program counter past the instruction, and executes the instruction.
    Repeat. If the execution does not modify the program counter, this loop will interpret
    the memory pointed at by the program counter as a sequence of machine instructions
    to run one after the other. Instructions that do change the program counter include
    branches and function calls.

    The execution is useless without the ability to store and modify data provided
    by the processor''s register set. A register is a storage cell inside the processor
    itself, capable of holding a machine word-sized value (typically 16, 32, or 64
    bits). Data stored in registers can typically be read or written quickly, in a
    single CPU cycle.


    PCs have a processor that implements the x86 instruction set, which was originally
    defined by Intel and became a standard. Several manufacturers produce processors
    that implement the instruction set. Like all other PC standards, this standard
    is also evolving but newer standards are backwards compatible with past standards.
    The boot loader has to deal with this evolution every PC starts simulating an
    Intel 8088, the CPU chip in the original IBM PC released in 1981. However, for
    most of xv6 you will be concerned with the modern x86 instruction set.


    The modern x86 provides general purpose 32-bit registers—%ax, %bx, %cx, %edx,
    %edi, %esi, %ebp, and %esp—and a program counter %eip (the instruction pointer).
    The common prefix stands for extended, as these are 32-bit extensions of the 16-bit
    registers %ax, %bx, %cx, %dx, %di, %si, %bp, and %ip. The two registers are also
    aliases, for example, %ax is the bottom half of eax changes the value stored in
    %ax and versa. The first four registers have names for the two-bit bytes: %a1
    and %ah the low and high 8 bits of %ax1, %b1, %bh, %c1, %d1, and %dh continue
    the pattern. In addition to these registers, the x86 have eight 80-bit floating-point
    registers as well as a handful of special purpose registers like the control registers
    %cr0, %cr2, %cr3, %cr4; the segment registers %cs, %ds, %fs, %gs, %ss; and the
    global and local descriptor table pseudo-registers %gdtr and %ldtr. The control
    and segment registers are important to any operating system. The floating-point
    and debug registers are less interesting and not used by xv6.


    Registers are fast but provide at most a few of general-purpose registers. The
    next level of storage is the main random access (RAM). Memory is 10-100 times
    slower than a register, but it is much cheaper, so there can be more of it. One
    reason memory is relatively slow is that it is physically separated from the processor
    chip. An x86 processor has a few registers, but a typical PC today has gigabytes
    of memory. Because of the enormous differences in access speed and size between
    registers and memory, most processors like the x86, store copies of recently-accessed
    sections in-chip cache. The cache serves as a middle ground between registers
    and memory. Today''s x86 processors typically have three levels of cache. Each
    core has a first-level cache with access times relatively close to the processor''s
    clock rate and a larger second-level cache. Several cores share an L3 cache. Figure
    A-1 shows the memory hierarchy and access times for an Intel processor.


    ## I/O


    Processors must communicate with devices as well as memory. The x86 provides local
    in and out instructions that read and write values from device I/O ports.


    | Memory | Access time | Size |

    | :--- | :--- | :--- |

    | register | 1 cycle | 64 bytes |

    | L1 cache | ~4 cycles | 64 kilobytes |

    | L2 cache | ~10 cycles | 4 megabytes |

    | L3 cache | ~40/75 cycles | 8 megabytes |

    | remote L3 | ~10,300 cycles | |

    | Local DRAM | ~60 nsec | |

    | Remote DRAM | ~100 nsec | |


    Figure A-1. Latency numbers for an Intel i7 Xeon system, based on http://software.intel.com/products/collateral/hpc/vtune/performance_analysis_guide.pdf.


    Many computer architectures have separate device access instructions. Instead
    the devices have fixed memory addresses and the processor communicates with the
    device (at the operating system''s behest) by reading and writing values at those
    addresses. In fact, modern x86 architectures use this technique, called memory-mapped
    I/O, for high-speed devices such as network, disk, and graphics controllers. For
    reasons of backwards compatibility, though the old in and out instructions linger,
    as do legacy hardware devices that use them, such as the IDE disk controller,
    which xv6 uses.

