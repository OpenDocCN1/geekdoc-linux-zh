    \n为了说明我们的意思，让我们考虑一个简单的生产者/消费者队列。该队列用于将命令从进程传递到 IDE 驱动程序（见第 3 章），抽象了所有 IDE 相关的代码。队列允许一个进程发送到另一个进程。如果只有一个发送者和一个接收者，且它们在不同的\
