    working on different entries in the process table can proceed in parallel. However,
    it complicates operations that have invariants over the process table, since they
    might have to take out several locks. Subsequent chapters will discuss how each
    part of xv6 deals with concurrency, illustrating how to use locks.


    ## Deadlock and lock ordering


    If a code path through the kernel must hold several locks at the same time, it
    is important that all code paths acquire locks in the same order. If they don''t,
    there is a risk of deadlock. Let''s say two paths in xv6 need locks A and B, but
    code path 1 acquires locks in the order A and the other acquires them in the order
    B then A. This situation can result in a deadlock, code path 1 might acquire lock
    A and before it code path 2 might acquire lock B. Neither code path can proceed,
    because code path 1 needs lock B, which code path 2 holds, and code path 2 needs
    A, which code path 1 holds. To avoid such deadlocks, all code paths must acquire
    locks in the same order. For a global lock ordering order means that locks are
    effectively part of each function''s specification: the kernel must invoke functions
    in a way that causes locks to be acquired in the agreed order.


    Because xv6 uses relatively coarse-grained locks, which have lock-order chains.
    The longest chains are only two. For example, delete holds the lock while calling
    wakeup. There are a number of other examples involving sleep and wakeup. These
    orderings come because sleep and wakeup have a complicated invariant, as discussed
    in Chapter 5. In the file system there are a number of examples of chains of two
    because the file system must, for example, acquire a lock on a directory and the
    lock on a file in that directory to unlink a file from its parent directory directly.
    xv6 always acquires the locks in the order first parent directory and then the
    file.


    ## Interrupt handlers


    xv6 uses locks to protect interrupts running on one CPU from accessing the same
    data on another CPU. For example, the timer interrupt handler (3364) increments
    ticks, but another CPU might be in sys_sleep (3723) reading ticks at the same
    time. The ticks lock synchronizes access by the CPUs to the single variable.


    Interrupts can cause concurrency on a single processor: if interrupts are enabled,
    kernel code can be stopped at any moment to an interrupt handler instead. Suppose
    usleep held the idelock and then got interrupted to run deintr. Deintr would try
    to lock idelock, see it, and wait for it to be released. In this situation, idelock
    will never be released—only usleep can release it, and usleep will not continue
    until deintr returns—the processor, and eventually the whole system will deadlock.


    To avoid this situation, if a lock is used by an interrupt handler, a processor
    must never hold that lock with interrupts enabled. xv6 is conservative: it never
    holds any lock with interrupts enabled. We use pushcli (1655) and popcli (1667)
    to manage a stack of "disable interrupts" operations (cli is the x86 instruction
    that disables interrupts). Acquire calls pushcli before trying to acquire a lock
    (1576), and release calls popcli after releasing the lock (1620). Pushcli (1655)
    and popcli (1667) are more than just wrappers around cli; they are counted so
    that it takes two calls to pushcli to undo one; if code holds two locks, interrupts
    will not be reunited until all locks have been released.


    It is important that acquire calls pushcli before the xchg that acquires the lock
    (1581). If the two were reversed, there would be a few instruction cycles when
    the lock was held with interrupts enabled, and that unfortunately timed interrupt
    would deadlock the system. Similarly, it is important that release call popcli
    after the xchg that releases the lock (1581).


    ## Instruction and memory ordering


    This chapter has assumed that code executes in the order that the code appears
    in the program. Many compilers and processors, however, execute code out of order
    to achieve higher performance. If an instruction takes many cycles to complete,
    a processor may issue the instruction so early that it can overlap with instructions
    and avoid processor stalls. For example, a processor may notice that in a sequence
    of instructions A and B are not dependent on each other and start B before A so
    that it will be completed when the processor completes A. A compiler may perform
    a re-ordering by emitting instruction B before instruction A in the executable
    file. Concurrency, however, may expose this reordering to software, which can
    lead to incorrect behavior.


    For example, consider release, which assigns 0 to lock->locked before an instruction
    enters the critical section that the lock is protecting, another processor could
    acquire the lock and observe a partial update. This re-ordering could break the
    invariant of the critical section.


    To tell the hardware and compiler not to perform such re-orderings, xv6 uses __synchronize(),
    in both acquire and release.__synchronize() is a memory barrier; it tells the
    compiler and CPU to not reload loads or stores across the barrier. xv6 worries
    about ordering during acquire and release, because current access to data structures
    like the lock structure is performed between an acquire and release.


    ## Limitations of spin-locks


    Spin-locks are often a clean solution to concurrency problems, but there are times
    when they are awkward. Subsequent chapters will point out such situations in xv6;
    this section outlines some of the problems that come up.


    Sometimes a lock must be held by a group of functions that call each other, perhaps
