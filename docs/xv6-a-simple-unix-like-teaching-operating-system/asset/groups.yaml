    # # Log design


    The log resides at a known fixed location, specified in the superblock. It consists
    of a header block followed by a sequence of updated blocks (“logged blocks”).
    The header block contains an array of sectors, one for each of the logged blocks.
    The header block also contains the count of logged blocks. X6 writes the header
    block when a transaction commits, but not before, and sets the count to zero after
    copying the logged blocks to the file system. Thus a crash midway through a transaction
    will result in a count of zero in the log''s header block; a crash after commit
    will result in a non-zero count.


    Each system call must be atomic. For efficiency, and to allow a degree of concurrency
    in the file system, the logging system can aggregate writes of multiple system
    calls into one transaction. To avoid splitting a system call across transactions,
    the logging system only commits when no file system calls are underway.


    The idea of committing several transaction together is known as group commit.
    Group commit allows several transactions to run concurrently and allows the file
    system to batch several disk operations and use the log to schedule the writing
    of the blocks cleverly and write at the rate of the disk''s bandwidth. X6''s IDE
    driver does not support batching, but xv6''s system design allows for it.


    X6 dedicates a fixed amount of space on the disk to hold the log. The total number
    of blocks written by the system calls in a transaction must fit in that space.
    This has two consequences. No single system call can be allowed to write more
    than than there space in the log. This is not a problem for most system calls,
    but two of them can potentially write many blocks: write and unlink. A large file
    may write many data blocks and bitmap blocks as an inode block; unlinking a large
    file might write many bitmap blocks and an inode block. X6''s system call breaks
    up large writes into multiple smaller writes that fit in the log, and link doesn''t
    cause problems because in practice the xv6 file system uses only one bitmap block.
    The other consequence of limited log space is the logging system cannot allow
    a call to start unless it is certain that the system calls'' writes will fit in
    the space remaining in the log.'
