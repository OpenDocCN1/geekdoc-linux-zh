    # Chapter 3


    # Traps, interrupts, and drivers


    When running a process, a CPU executes the normal processor loop: read an instruction,
    advance the program counter, execute the instruction, repeat. But there are events
    on which control a user program must transfer back to the kernel instead of executing
    the next instruction. These events include a device signaling that it needs attention,
    a user program doing something illegal (e.g., references a virtual address for
    which there is no PTE), a user program asking the kernel for a system call. There
    are three main challenges in handling these events: 1) the kernel must arrange
    that a processor switches from user mode to kernel mode (and back); 2) the kernel
    and devices must coordinate their parallel activities; and 3) the kernel must
    understand the interface of the devices. Addressing these 3 challenges requires
    detailed understanding of hardware and careful programming, and can result in
    opaque kernel code. This chapter explains how xv6 addresses these three challenges.


    # Systems calls, exceptions, and interrupts


    There are three cases when control must be transferred from a user program to
    the kernel. First, a system call: when a user program asks for an operating system,
    as we saw at the end of the last chapter. Second, an exception: when a program
    performs an illegal action. Examples of illegal actions include divide by zero,
    attempt to access memory for a PTE that is not present. Third, an interrupt: when
    a device generates a signal to indicate that it needs attention from the operating
    system. For example, a clock chip may generate an interrupt every 100 msec to
    allow the kernel to implement time sharing. As another example, when the disk
    reads a block from disk, it generates an interrupt to alert the operating system
    that the block is ready to be retrieved.


    The kernel handles all interrupts, rather than processes handling them, because
    in most cases the kernel has the required privilege and state. For example, in
    time-slice algorithms processes respond to clock interrupts, the kernel must be
    invoked, if only to force uncooperative processes to yield the processor.


    In all three cases, the operating system must design architecture for the following
    to happen. The system must be set up for execution in the kernel. The system must
    choose a place for the kernel to start execution. The kernel must be able to retrieve
    information about the event, eg., system call arguments. All must be done securely;
    the system must maintain isolation of user processes and the kernel.


    To achieve this the operating system must be aware of the details of how the hardware
    handles system calls, exceptions, and interrupts. In most processors these three
    events are handled by a single hardware mechanism. For example, on the x86, a'
