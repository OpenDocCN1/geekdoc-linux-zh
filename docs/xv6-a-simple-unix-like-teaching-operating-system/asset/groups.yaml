    ## 第3章

    ## 陷阱、中断与驱动程序


    在运行进程时，CPU 执行标准的处理器循环：读取指令、增加程序计数器、执行指令、重复。但当某些事件发生时，控制用户程序必须将控制权交回给内核，而不是执行下一条指令。这些事件包括设备信号指示其需要关注、用户程序执行了非法操作（例如，引用了没有页表项（PTE）的虚拟地址）、用户程序向内核请求系统调用。处理这些事件有三个主要挑战：


    1) 内核必须安排处理器从用户模式切换到内核模式（并反之）；2) 内核和设备必须协调它们的并行活动；3) 内核必须理解设备的接口。


    解决这 3 个挑战需要对硬件有深入理解和细致的编程，并可能导致内核代码变得晦涩。本章将解释 xv6 如何解决这三个挑战。


    ## 系统调用、异常与中断


    在三种情况下，控制权必须从用户程序转移到内核。首先是系统调用：当用户程序请求操作系统时，正如我们在上一章末尾看到的那样。其次是异常：当程序执行了非法操作时。非法操作的示例包括除以零、尝试访问不存在
    PTE 的内存。第三是中断：当设备产生一个信号指示其需要操作系统的关注时。例如，时钟芯片每隔 100 毫秒产生一次中断，允许内核实现分时。另一个例子是，当从磁盘读取一个块时，它会产生一个中断通知操作系统该块已准备好提取。


    内核处理所有中断，而不是由进程来处理，因为在大多数情况下，内核拥有所需的权限和状态。例如，在时间片算法中，进程响应时钟中断，必须调用内核，即使仅仅是为了强迫不配合的进程让出处理器。


    在所有三种情况下，操作系统都必须为以下情况的发生设计架构。系统必须设置好在内核中执行的准备。系统必须为内核选择一个开始执行的位置。内核必须能够获取有关事件的信息，例如系统调用参数。所有操作都必须安全地完成；系统必须保持用户进程和内核的隔离性。


    为了实现这一点，操作系统必须了解硬件处理系统调用、异常和中断的细节。在大多数处理器中，这三个事件由单一硬件机制处理。例如，在 x86 上，程序通过使用 `int`
    指令产生中断来调用系统调用。同样，异常也会产生中断。因此，如果操作系统有一套中断处理计划，那么操作系统也可以处理系统调用和异常。


    基本计划如下：中断停止正常的进程循环并启动一个名为中断处理程序（interrupt handler）的新序列。在启动中断处理程序之前，处理器会保存其寄存器，以便操作系统在从中断返回时存储它们。在进入和离开中断处理程序的转换过程中挑战是，处理器必须从用户模式切换到内核模式并返回。


    关于术语：虽然 x86 的官方术语是中断（interrupt），但 xv6 将所有这些统称为陷阱（trap），很大程度上是因为这是 PDP11/40 使用的术语以及传统
    Unix 的术语。本章交替使用 trap 和 interrupt 术语，但重要的是记住，陷阱是由运行在处理器上的当前进程引起的（例如，进程发出系统调用并产生陷阱），而中断是由设备引起的，可能与当前运行的进程无关。例如，磁盘在为一个进程检索一个块时可能会产生一个中断，但在此时可能另一个进程正在运行。中断的属性使得思考中断比思考陷阱更困难，因为中断是与其他活动并发发生的。然而，两者都依赖于相同的硬件机制来用户模式和内核模式之间安全切换，我们将在接下来讨论这一点。


    ## X86 保护


    x86 有 4 个保护级别，编号从 0（权限最高）到 3（权限最低）。在实践中，大多数操作系统只使用 2 个级别：0 和 3，分别称为内核模式和用户模式。x86
    执行时使用的当前权限级别存储在 `cs` 寄存器的 `RPL`字段中。


    在 x86 上，中断处理程序定义在中断描述符表（IDT）中。IDT 有 256 个条目，每个条目都提供了处理相应中断时使用的 `cs` 和 `%ip`。


