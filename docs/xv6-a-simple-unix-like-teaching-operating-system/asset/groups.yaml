    \n## Code: Wait, exit, and kill\n\nSleep and wakeup can be used for many kinds\
    \ of waiting. An interesting example, in Chapter 0, is the wait system call that\
    \ allows a process to wait for a child to exit. When a child exits, it does not\
    \ exit immediately. Instead, it switches to the ZOMBIE state until the parent\
    \ waits to learn of the exit. The parent is responsible for freeing the memory\
    \ associated with the process and preparing the struct proc for reuse. If the\
    \ parent exits the child, the init process adopts and waits for it, so every child\
    \ has a parent to clean up after it.\n\nAn implementation challenge is the possibility\
    \ of races between parent and child wait and exit, as well as exit and exit wait.\
    \ Wait begins by acquiring ptable.lock. it then scans the process table looking\
    \ for children. If wait finds none exited, it calls sleep to wait for one of (2689)\
    \ and scans again. Here, the lock released in sleep is ptable.lock, the special\
    \ case we saw above.\n\nExit acquires ptable.lock and then wakes up any process\
    \ sleeping on a wait channel to the current process’s proc (2628); if there is\
    \ such a process, it will be the parent in wait. This may look premature, since\
    \ exit has not marked the current process as a ZOMBIE yet, but it is safe: although\
    \ wakeup may park the parent\n"
