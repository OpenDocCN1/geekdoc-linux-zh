    ## Logging layer


    One of the most interesting problems in file system design is crash recovery.
    The problem arises because file system operations involve multiple writes to the
    disk, and a crash after a subset of the writes may leave the on-disk file system
    in an inconsistent state. For example, suppose a crash occurs during truncation
    the length of a file to zero and freeing its blocks. Depending on the order of
    the disk writes, the crash may leave an inode allocated a content block that is
    marked free, or it may leave an unconnected content block.


    The latter is relatively benign, but an inode that refers to a free block is likely
    to cause serious problems after a reboot. After reboot, the kernel may allocate
    that block to another file, and now we have two different files unintentionally
    pointing to the same block. If xv6 supported multiple users, this situation could
    be a security problem, since the old file owner''s owner would be able to read
    and write blocks in the new file, owned by a different user.


    xv6 solves the problem of crashes during file system operations with a simple
    form of logging. An xv6 system does not directly write the on-disk file structures.
    Instead, it places a description of all disk writes it wants to make in a log.
    Once the system has logged all of its writes, it writes commit committing the
    log contains a complete operation. At that point the system calls the writes to
    the on-disk file system data. After those writes have completed, the system erases
    the log.


    If the system should crash and reboot, the file system recovers from the crash
    as follows: before running any processes if the log is marked as containing a
    complete operation, the recovery code copies the writes to where they belong in
    the on-disk file system. If the log is not marked as containing a complete operation,
    the recovery code finishes by ignoring the log.


    Why does xv6 solve the problem of crashes during file system operations? The crash
    occurs before the operation commits, the log on disk will not be marked as complete,
    the recovery code will ignore it, and as if the operation had not started. If
    the crash occurs after the operation commits, then recovery will replay all of
    the operation''s writes if the operation had started to write to on-disk data.
    In either case, the log makes operations atomic with respect to crashes: after
    recovery, either all of the operation''s writes appear on the disk, or none of
    them.


    ## Log design


    The log resides at a known fixed location, specified in the superblock. It consists
    of a header block followed by a sequence of updated blocks (“logged blocks”).
    The header block contains an array of sectors, one for each logged block. The
    header block also contains the count of logged blocks. xv6 writes the header block
    when a transaction commits, but not before, and sets the count to zero after copying
    the logged blocks to the file system. Thus a crash midway through a transaction
    will result in a count of zero in the log''s header block; a crash after commit
    will result in a non-zero count.


    Each system call must be atomic. For efficiency, and to allow a degree of concurrency
    in the file system, the logging system can aggregate writes of multiple system
    calls into one transaction. To avoid splitting a system call across transactions,
    the logging system only commits when no file system calls are underway. The idea
    of committing several transaction together is known as group commit. Group commit
    allows several transactions to run concurrently and allows the file system to
    batch several disk operations and use the log to schedule the writing of the blocks
    at the rate of the disk''s bandwidth. xv6''s IDE driver does not support batching,
    but xv6''s system design allows for it.


    xv6 dedicates a fixed amount of space on the disk to hold the log. The total number
    of blocks written by the system calls in a transaction must fit in that space.
    This has two consequences. No single system call can be allowed to write more
    than space in the log. This is not a problem for most system calls, but two of
    them can potentially write many blocks: write and unlink. A large file may write
    many data blocks and bitmap blocks; unlinking a large file might write many bitmap
    blocks and an inode block. xv6''s system call breaks up large writes into multiple
    smaller writes that fit in the log, and doesn''t cause problems because in practice
    the xv6 file system uses only one bitmap block. The other consequence of limited
    log space is the logging system cannot allow a call to start unless it is certain
    that the system calls'' writes will fit in the space remaining in the log.


