    ## 日志层 (Logging layer)


    文件系统设计中最有趣的问题之一是崩溃恢复。该问题的产生是因为文件系统操作涉及对磁盘的多次写入，而在部分写入后发生崩溃可能会导致磁盘上的文件系统处于不一致状态。例如，假设在截断文件长度为零并释放其块时发生崩溃。根据磁盘写入的顺序，崩溃可能导致
    inode 分配了一个被标记为空的内容块，也可能留下一个未连接的内容块。


    后者是相对无害的，但一个指向空闲块的 inode 在重启后可能会导致严重问题。重启后，内核可能会将该块分配给另一个文件，现在我们有两个不同的文件无意地指向同一个块。如果
    xv6 支持多用户，这种情况可能会变成一个安全问题，因为旧文件的所有者将能够读取和写入由不同用户拥有的新文件中的块。


    xv6 通过一种简单的日志形式解决了文件系统操作期间的崩溃问题。xv6 系统不会直接写入磁盘上的文件结构。相反，它将想要执行的所有磁盘写入描述放在一个日志中。一旦系统记录了所有写入，它就会写入
    `commit`，表示日志包含一个完整的操作。此时，系统调用 `writes` 写入磁盘上的文件系统数据。在这些写入完成后，系统会擦除日志。


    如果系统崩溃并重启，文件系统将按如下方式恢复：在运行任何进程之前，如果日志被标记为包含完整操作，恢复代码会将写入内容复制到磁盘文件系统中应在的位置。如果日志未被标记为包含完整操作，恢复代码将通过忽略日志来结束。


