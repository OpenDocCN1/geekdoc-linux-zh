  mdcn: '

    引导器需要能够驱动各种磁盘和网络控制器，并理解各种文件系统和网络协议。换句话说，引导器本身必须是一个微型操作系统。由于这种复杂的引导器显然无法放入 512
    字节内，大多数 PC 系统使用两步引导过程。首先，一个像本附录中这样的简单引导器会从已知磁盘位置加载一个功能完备的引导器，它通常依赖于空间限制较小的 BIOS
    来访问磁盘，而不是尝试自己驱动磁盘。然后，摆脱了 512 字节限制的全功能加载器（full loader）就可以引入定位并执行所需内核所需的复杂性了。现代
    PC 避免了上述的许多复杂性，因为它们支持可扩展固件接口（UEFI），这允许 PC 从磁盘读取一个较大的引导器（并在保护模式和 32 位模式下启动它）。


    本附录的编写假设在从通电到执行引导器之间只发生了一件事就是 BIOS 加载了引导扇。事实上，BIOS 执行了大量的初始化工作，以便让现代计算机复杂的硬件看起来像一台传统的标准
    PC。


    ## 练习题


    - 1. 由于扇区粒度的限制，文中对 `readseg` 调用等同于 `readseg((uchar*)0x100000, 0xb500, 0x1000)`。在实践中，这种粗略的行为证明是一个问题。为什么粗略的
    `readsect` 会导致问题？

    - 2. 关于 BIOS 持续时间更长 + 安全问题

    - 3. 假设你想让 `bootmain()` 在 `0x200000` 而不是 `0x100000` 加载内核，你通过修改 `bootmain()` 为每个
    ELF 段的虚拟地址加上 `0x100000` 来实现。将会出问题。

    - 4. 引导器将 ELF 头拷贝到内存任意位置 `0x10000` 似乎是危险的。它为什么不调用 `malloc` 来获取所需的内存？


