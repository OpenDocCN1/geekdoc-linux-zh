    ## 驱动程序


    驱动程序是操作系统中管理特定设备的代码：它告诉设备硬件执行操作，配置设备在完成后产生中断，并处理产生的中断。驱动程序代码可能很复杂，因为驱动程序与其所管理的设备并发执行。此外，驱动程序必须理解设备的接口（例如
    I/O 端口的作用），而这些接口可能非常复杂且文档不详。


    磁盘驱动程序提供了一个很好的例子。磁盘驱动程序负责将数据复制或写入磁盘。磁盘硬件传统上将磁盘上的数据呈现为编号的 512 字节块（也称为扇区）；扇区 0 是前
    512 字节，扇区 1 是下一个，依此类推。操作系统用于文件系统的块大小可能与驱动程序使用的扇区大小不同，通常块大小是扇区大小的倍数。xv6 的块大小与磁盘的扇区大小相同。为了表示一个块，xv6
    有一个与磁盘同步的结构 `buf`：它可能尚未从磁盘读取（磁盘正在处理它但尚未返回扇区内容），或者它可能已经更新但尚未写出。驱动程序必须确保当该结构与磁盘不同步时，xv6
    的其他部分不会产生混淆。


    ## 磁盘：代码驱动程序


    IDE 设备提供了访问连接到 PC 标准 IDE 控制器的设备的接口。虽然 IDE 现在在 SCSI 和 SATA 中已变得过时，但其接口非常简单，让我们能够专注于驱动程序的整体结构，而不是特定硬件的细节。


    xv6 使用 `struct buf` (375) 表示文件系统。`BSIZE` (390) 与 IDE 的大小相同，因此 `buf` 代表特定磁盘设备上一个扇区的内容。`dev`
    和 `sector` 字段提供设备号和扇区号，`data` 字段是磁盘扇区在内存中的副本。尽管 xv6 文件系统选择 `BSIZE` 等于 IDE 的大小，但驱动程序可以处理扇区大小倍数的
    BSIZE。操作系统会使用比 512 字节更大的块来获得更高的磁盘吞吐量。


