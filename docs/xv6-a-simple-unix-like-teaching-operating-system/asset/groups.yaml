    - Check that DPL in cs <= DPL, where DPL is the privilege level in the descriptor.

    - Save %esp and %ss in internal registers, but only if the segment selector''s
    PL < CPL.

    - Load %ss and %esp from a task segment descriptor.

    - Push %ss.'
