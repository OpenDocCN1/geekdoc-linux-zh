    # System call


    # Description


    | System call | Description |

    |--- |--- |

    | fork() | Create a current process |

    | exit() | Terminate the current process |

    | wait() | Wait for a child process to exit |

    | kill(pid) | Terminate process pid |

    | getpid(dirname) | Return the current process''s pid |

    | sleep(n) | Sleep for n clock ticks |

    | exec(filename, *argv) | Load a file and execute it |

    | brk(n) | Grow process by n bytes |

    | open(filename, flags) | Open a file; read/write |

    | read(fd, buf, n) | Read n bytes from open file into buf |

    | write(fd, buf, n) | Write n bytes to an open file |

    | close(fd) | Release file fd |

    | dup(fd) | Duplicate fd |

    | pipe(p) | Create a pipe and return fds in p |

    | chdir() | Change the current directory |

    | mkdir(name, minor) | Create a new directory |

    | link(f1, f2) | Create another name (f2) for the file f1 |

    | unlink(filename) | Remove a file |


    Figure 0-2. X6 system calls


    sources as memory and open files. The wait system returns the pid of an exited
    child of the current process; if none of the caller''s children has exited, wait
    waits for one to do. In the example, the output lines


    ```

    parent: child=1234

    child: exiting

