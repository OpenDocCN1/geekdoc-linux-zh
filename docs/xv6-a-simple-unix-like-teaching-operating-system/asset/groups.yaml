    which causes the processor to generate a trap. The xv6 allows for 256 different
    interrupts. Interrupts 0-31 are defined for software exceptions, like divideor
    attempts to access invalid memory addresses. xv6 maps the 32 hardware interrupts
    to the range 32-63 and uses interrupt 64 as the system call handler.


