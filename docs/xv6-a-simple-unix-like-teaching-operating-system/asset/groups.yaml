    任何操作系统运行的进程数量可能超过计算机处理器的数量，因此需要一个计划在进程之间时间分分用处理器。理想情况下，这种共享对用户进程应该是透明的。一种常见的方法是通过将进程复用到硬件处理器上，为每个进程提供其拥有自己处理器的幻觉。本章解释了
    xv6 如何实现这一目标。


    ## 复用


    xv6 通过将每个处理器从一个切换到另一个来实现复用。首先，当进程等待设备 I/O 完成、等待子进程退出或在睡眠中等待时，通过 `sleep` 和 `wakeup`
