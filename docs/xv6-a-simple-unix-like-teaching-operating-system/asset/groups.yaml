    use more than one page will fault. This inaccessible page also allows exec to
    deal with arguments that are too large; in that situation, the copyout (2118)
    function that exec uses to copy arguments to the stack will notice the destination
    page is not accessible, and returns -1.


    During the preparation of the new image, if it detects an error like an invalid
    segment, it jumps to the label trap, frees the memory, and returns -1. Exec waits
    to free the old image until it is sure the system can succeed: if the old image
    is gone, the system cannot return to it. The only error cases in exec during the
    creation of the new image (6398) and free the old image (6399). Finally, exec
    returns 0.


    Exec loads bytes from the ELF file into memory at addresses specified by the ELF
    file. Users or processes can place wherever they want into an ELF file. This exec
    is risky, because the addresses in the ELF may refer to the kernel, accidentally
    causing a crash to a malicious subversion of the kernel''s isolation mechanisms
    (i.e., a security exploit). xv6 performs a number of checks to avoid this. To
    understand the importance of these checks, consider what would happen if xv6 checks
    if (ph.vaddr + ph.memsz < ph.vaddr). This is a check for whether the sum overflows
    a 32-bit integer. The danger is that a user could construct an ELF binary with
    a ph.vaddr that points into the kernel, and ph.memsz large enough that the sum
    overflows to 0x1000. Since the sum is small, it will check if(newsz >= KERNBASE)
