    - 4. Add simple driver for an Ethernet card.\n\n## Chapter 4\n\n### Locking\n\n\
    Xv6 runs on multiprocessors: computers with multiple CPUs executing independently.\
    \ These multiple CPUs share physical RAM, and xv6 exploits the sharing to maintain\
    \ data structures that all CPUs read and write. This sharing raises the possibility\
    \ of simultaneous writes to the same data structure from multiple CPUs, or even\
    \ simultaneous writes with a write; without careful design parallel access is\
    \ likely to yield incorrect results or a broken data structure. Even on a uniprocessor,\
    \ an interrupt routine that accesses the same data as some interruptible code\
    \ could damage the data if the interrupt occurs at the wrong time.\n\nAny code\
    \ that accesses shared data from multiple CPUs (or at interrupt time) must have\
    \ a strategy for maintaining correctness despite concurrency; xv6 uses a handful\
    \ of simple concurrency control strategies; much sophistication is possible. This\
    \ chapter focuses on one of the strategies used in xv6 and many other systems:\
    \ the `lock`.\n\nA lock provides mutual exclusion, ensuring that only one CPU\
    \ at a time can hold the lock. If a lock is associated with each shared data item,\
    \ and the code always holds the associated lock when using a given item, then\
    \ we can be sure that the item is used from only one CPU at a time. In this situation,\
    \ the lock protects the data item.\n\nThe rest of this chapter explains why xv6\
    \ needs locks, how xv6 implements them, and how to use them. A key observation\
    \ is that you ask yourself if another processor (or interrupt) could change the\
    \ intended behavior of the code by modifying data (or hardware resources) it depends\
    \ on. You must keep in mind that a single C statement can be several machine instructions\
    \ and thus another processor or an interrupt may muck around in the middle of\
    \ a C state. You cannot assume that lines of code are executed atomically. Concurrency\
    \ makes reasoning about correctness much more difficult.\n\n### Race conditions\n\
    \nAs an example on why we need locks, consider several processors sharing a shared\
    \ disk, the disk driver maintains a linked list of the standing requests (4125)\
    \ and processors may add new requests to the list concurrently (4254). If there\
    \ were no concurrent requests, we might implement the linked list as follows:\n\
    \n```c\nstruct list {\n    int data;\n    struct list *next;\n};\n```\n\nFigure\
    \ 4-1. Example race condition.\n\n```c\n6 struct list *list = 0;\n7 void\n8 insert(int\
    \ data)\n9 {\n10 struct list *l;\n11\n12\n13 l = malloc(sizeof *l);\n14 l->data\
    \ = data;\n15 l->next = list;\n16 list = l;\n17 }\n```\n\nProving this implementation\
    \ correct is a typical exercise in a data structures and algorithms class. However,\
    \ the code is not correct if more than one executes concurrently. If two CPUs\
    \ insert at the same time, it could happen that the line before 15 executes 16\
