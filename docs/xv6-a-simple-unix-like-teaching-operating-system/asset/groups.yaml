    adding ph.memsz and without checking ph.vaddr against KERNBASE, and would thus
    copy data from the ELF binary into the kernel. This could be exploited by a user
    to run arbitrary code with kernel privileges. As this example illustrates, argument
    checking must be done with great care. Real-world kernels have a long history
    of missing checks whose absence can be exploited by user programs to obtain kernel
    privileges. It is likely that xv6 doesn''t do a complete job of validating user-level
    supply to the kernel, where a malicious user program might be able to circumvent
    xv6''s isolation.


    # Real world


    Like most operating systems, xv6 uses the paging hardware for memory protection
    and paging. Most operating systems make far more sophisticated than paging for
    xv6; xv6 lacks paging from disk, copy-on-write fork, shared lazy-allocated pages,
    and automatically extending stacks. The x86 address translation using segmentation
    (see Appendix B), but xv6 uses segments only for the common trick of implementing
    per-CPU variables that proc are at a fixed address but have different values on
    different CPUs (see seginit). Implementations of per-CPU (or per-thread) storage
    on non-segment architectures would require a register to holding a pointer to
    the per-CPU data area, and the x86 has so few registers that the extra effort
    required to use segmentation is worthwhile.


    On machines with lots of RAM, it might make it sense to use the x86''s small pages,
    to allow allocation and page-to-disk with fine granularity. For example, if a
    program uses only 8 Kbyte of memory, making each 4 Mbyte page is wasteful. Large
    pages make sense on machines with lots of RAM may reduce overhead for page-table
    mapping. xv6 uses pages in place: the initial page table (1412). The array initialization
    two of 1024 PTEs, and indices zero and 512 (KERNBASE>>PSHIFT), leaving the other
    PDEs zero. xv6 sets the PTE_PS in these two PTEs to mark them as super pages.


    xv6 should demand the actual configuration, instead of assuming 240 MB. On the
    x86, there are at least three algorithms: the first is to probe the physical address
    space looking for regions that behave like memory, preserving the layout; the
    second is to read the number of kilobytes of memory out of a known 16-bit location
    in the PC''s non-volatile RAM; and the third is to look in BIOS for a memory layout
    table as part of the multiprocessor layout. Reading the memory layout is complicated.


    Memory allocation was a hot topic long ago, the basic problems are efficient of
    used memory and preparing for unknown future requests; see Kern.


    Today people care more about speed than space-efficiency. In addition, a more
    elaborate kernel would likely allocate many different sizes of small blocks, rather
    than (in xv6) just 4096-byte blocks; a kernel allocator would need to handle small
    allocations as well as large ones.


