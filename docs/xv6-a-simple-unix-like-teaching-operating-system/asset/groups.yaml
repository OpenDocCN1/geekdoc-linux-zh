    文件可以同时以读或写模式打开。可读可写字段会跟踪这一点。


    所有打开的文件都保存在全局文件表 `ftable` 中。该表具有分配文件（`filealloc`）、创建重复引用（`filedup`）、释放引用（`fileclose`）以及读写数据（`fread`
    和 `filewrite`）的功能。


    前三个是非致命的。`filealloc` (5625) 扫描表查找未被引用的文件（f~ref = 0）并返回一个新引用；`filedup` (5062) 增加引用计数；`fileclose`
    (5664) 减少引用计数。当文件的引用计数达到零时，`fileclose` 会根据规定释放底层文件或索引节点。


    `filestat`、`rread` 和 `filewrite` 函数实现了对文件的 `stat` 和 `write` 操作。`filestat` (5702)
    仅允许在节点和目录执行。`filestat` 和 `filewrite` 检查操作是否由 `open` 模式打开，然后将调用传递给管道（pipe）或索引节点（inode）。如果文件代表索引节点，`rread`
    和 `filewrite` 使用 i/o 偏移作为操作的偏移并对其递增（5725-5726, 5765-5766）。管道没有偏移。记住，索引节点要求调用者处理锁定（5705-5707,
    5724-5727, 5774-5778）。索引节点锁定有一个方便的副作用，即读写偏移是原子更新的，因此如果多个进程相互写入对方的数据，它们的写入可能会交织在一起。


    ## 系统调用


    有了底层提供的函数，实现系统调用是非常轻而易事的（见 `sysfile.c`）。有几个调用值得仔细观察。


    `sys_link` 和 `sys_unlink` 函数编辑目录，创建或删除对索引节点的引用。它们是使用事务的另一个良好示例。`sys_link` (5913)
    开始时会获取其参数，即两个字符串 `old` 和 `new` (5918)。假设 `old` 存在且不是目录 (5922-5925)，`sys_link`
    增加其 `ip->nlink` 计数。`sys_link` 调用 `namei` 来找到 `old` 索引节点的父目录和最终元素条目 (0941)。新的父目录必须存在，且与现有索引节点在同一设备上：索引节点仅在单个磁盘上具有唯一名称。如果发生此类错误，`sys_link`
    必须回溯并减少 `ip->nlink`。


    事务简化了实现，因为它们需要更新多个块，但我们不需要担心执行的顺序。它们要么全部成功，要么全不成功。例如，如果没有事务，在创建链接之前更新 `ip->nlink`
    会让文件系统处于不安全状态，期间的崩溃可能会导致灾难。有了事务，我们就不必担心这个问题。


    `sys_link` 为现有的索引节点创建一个新名称。`create` (6057) 函数为其创建一个新名称，它是三个文件创建系统调用的泛化：带有 `O_CREATE`
