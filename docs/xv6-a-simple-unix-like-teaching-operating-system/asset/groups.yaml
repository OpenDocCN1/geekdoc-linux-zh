    \ Thus, function instructions must mention addresses that look like 0x801xxxx;\
    \ you can see examples in kernel.asm. This address is configured in kernel.ld;\
    \ 0x80100000 is a relatively high address, towards of the 32-bit address space;\
    \ Chapter 2 explains the reasons for this choice. There may be no physical memory\
    \ at such a high address. Once the kernel starts executing, it will set up the\
    \ paging hardware to map virtual addresses starting at 0x80100000 to physical\
    \ addresses that there is physical memory at this lower address. At this point\
    \ in the process, however, paging is not enabled. Instead, kernel.ld specifies\
    \ that paddr start at 0x00100000, causes the boot loader to copy the kernel to\
    \ the low physical addresses to the paging hardware will eventually point.\n\n\
    The boot loader's final step is to call the kernel entry point, which is the instruction\
    \ at which the kernel expects to start executing. xv6 the entry address is 0x0010000c\n\
    \n```\n# objdump -f elf32-i386\n\nkernel:    file elf32-i386\n            architecture:\
    \ 1386, HAS_SYS, D_PAGED\n            EXEC_P, _START\n            start address\
    \ 0x0010000c\n```\n\nBy convention, the _start symbol specifies the ELF entry\
    \ point, which is defined in the file entry.S (1140). Since xv6 has not set up\
    \ virtual memory yet, xv6's entry point is the physical address of entry (1144).\n\
    \n# Real world\n\nThe boot loader described in this appendix compiles to around\
    \ 470 bytes of machine code, depending on the optimizations used when compiling\
    \ the C code. In order to fit in that small amount of space, the xv6 boot loader\
    \ makes a simplifying assumption, that the kernel has been written to the boot\
    \ disk contiguously starting at sector 1. More commonly, kernels are stored in\
    \ ordinary file systems, where they may not be contiguous, or loaded over a network.\
    \ These complications require"
- md: '

    [content]

    boot loader to be able to drive a variety of disk and network controllers and
    understand various file systems and network protocols. In other words, the boot
    loader itself must be a small operating system. Since such complicated boot loaders
    certainly won''t fit in 512 bytes, most PC systems use a two-step boot process.
    First, a simple boot loader like the one in this appendix loads a full-featured
    boot-loader from a known disk location, often relying on the less space-constrained
    BIOS for disk access rather than trying to drive the disk itself. Then the full
    loader, relieved of the 512-byte limit, can import the complexity needed to locate,
    and execute the desired kernel. Modern PCs avoid many of the above complexities,
    because they support the Extensible Firmware Interface (UEFI), which allows the
    PC to read a large boot loader from the disk (and start it in protected and 32-bit
    mode).


    This appendix is written as if the only thing that happens between power on and
    the execution of the boot loader is that the BIOS loads the boot sector. In fact
    the BIOS does a huge amount of initialization in order to make the complex hardware
    of a modern computer look like a traditional standard PC.


    ## Exercises


    - 1. Due to sector granularity, the call to readseg in the text is equivalent
    to readseg((uchar*)0x100000, 0xb500, 0x1000). In practice, this sloppy behavior
    turns out to be a problem Why does the sloppy readsect cause problems?

    - 2. something about BIOS lasting longer + security problems

    - 3. Suppose you wanted bootmain() to load the kernel at 0x200000 instead of 0x100000,
    and you did so by modifying bootmain() to add 0x100000 to the va of each ELF section.
    Something would go wrong.

    - 4. It seems dangerous for the boot loader to copy the ELF header to memory at
    the arbitrary location 0x10000. Why doesn''t it call malloc to obtain the memory
    it needs?


