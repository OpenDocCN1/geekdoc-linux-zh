- md: "\n# xv6\n\n# a simple, Unix-like teaching operating system\n\nRuss Cox\nFrans\
    \ Kaashoek\nRobert Morris\n\nxv6-book@pdos.csail.mit.edu\n\nDraft as of September\
    \ 5, 2016\n\n# Contents\n\n- 0 Operating system interfaces 7\n- 1 Operating system\
    \ organization 17\n- 2 Page tables 29\n- 3 Traps, interrupts, and drivers 39\n\
    - 4 Locking 51\n- 5 Scheduling 59\n- 6 File system 73\n- 7 Summary 89\n- A PC\
    \ hardware 91\n- B The boot loader 95\n\nIndex 101\n\n# Foreword and acknowledgments\n\
    \nThis is a draft text intended for a class on operating systems. It explains\
    \ the main concepts of operating systems by studying an example kernel, named\
    \ xv6. xv6 is a reimplementation of Dennis Ritchie's and Ken Thompson's Unix Version\
    \ 6 (v6). xv6 loosely-follows the structure and style of v6, but is implemented\
    \ in ANSI C for an x86-based multiprocessor.\n\nThe text should be read along\
    \ with the source code for xv6. This approach is inspired by John Lions's Commentary\
    \ on UNIX 6th Edition (Peer to Peer Communications; IS-BN: 1-57398-013-7; 1st\
    \ edition (June 14, 2000)). See https://pdos.csail.mit.edu/6828 for pointers to\
    \ on-line resources for v6 and xv6.\n\nWe have used this text in 6.828, the operating\
    \ systems class at MIT. We thank the faculty, teaching assistants, and students\
    \ of 6.828 who have all directly or indirectly contributed to xv6. In particular,\
    \ we would like to thank Austin Clements and Nikolai Zeldovich. Finally, we would\
    \ like to thank people who emailed us bugs in the text: Abubtil Aghayev, Sebastian\
    \ Boehm, Raphael Carvalho, Color Fuzzy, Giuseppe, Jacek Masiulaniec, Askar Safin,\
    \ Pawel Szczurko, Warren Tooney, and Zou Chang Wei.\n\nIf you have comments, please\
    \ send them to 6.828-staff@pdos.csail.mit.edu.\n\n# Chapter 0\n\n## Operating\
    \ system interfaces\n\nThe job of an operating system is to share a computer among\
    \ multiple programs and to provide a more useful set of services than the hardware\
    \ alone supports. The operating system manages and abstracts the low-level hardware,\
    \ so that, for example, a word processor need not concern itself with which type\
    \ of disk hardware is being. It also shares the hardware among multiple programs\
    \ so that they run (or appear to run) at the same time. Finally, operating systems\
    \ provide controlled ways for programs to interact, so that they can share data\
    \ or work together.\n\nAn operating system provides services to user programs\
    \ through an interface. Designing a good interface turns out to be difficult.\
    \ On the one hand, we would like the interface to be simple and narrow because\
    \ that makes it easier to implement the right. On the other hand, we may be tempted\
    \ to offer many sophisticated features to applications. The challenge in resolving\
    \ this tension is to design interfaces that rely on a few mechanisms that can\
    \ be combined to provide much generality.\n\nThis book uses a single operating\
    \ system as a concrete example to illustrate operating concepts. That operating\
    \ system, xv6, provides the basic interfaces introduced by Thompson and Ritchie's\
    \ Unix operating system, as well as including Unix's internal design. Unix provides\
    \ a narrow interface whose mechanisms combine well, offering a surprising degree\
    \ of generality. This interface has so successful that modern operating systems—BSD,\
    \ Linux, Mac OS, Solaris, and to a larger extent, Microsoft Windows—have Unix-like\
    \ interfaces. Understanding xv6 is a good start toward understanding any of these\
    \ systems and more.\n\nAs shown in Figure 0-1, xv6 takes the traditional form\
    \ of a special program that provides services to running programs. Each running\
    \ program, called a process, has memory containing instructions, data, and a stack.\
    \ The instructions implement the program's computation. The data are the variables\
    \ on which the computation acts. The system manages the program calls.\n\nWhen\
    \ a process needs to invoke the kernel, it invokes a procedure in the operating\
    \ system interface. Such procedure is called a system call. The system enters\
    \ the kernel, performs the procedure and returns. Thus a process alternates executing\
    \ in user space and kernel space.\n\nThe kernel uses the CPU's hardware protection\
    \ mechanisms to ensure that each process executing in user space can access only\
    \ its memory. The kernel executes with the hardware privileges required to implement\
    \ these protections; user programs execute without those privileges. When a user\
    \ program invokes a system call, the hardware raises the privilege level and starts\
    \ executing a prearranged function in the kernel.\n\nThe collection of system\
    \ calls that a kernel provides is the interface that user programs see. xv6 provides\
    \ a subset of the services and system calls that Unix traditionally offers. Figure\
    \ 0-2 lists all of xv6's system calls.\n\n![](img/47079f861662c1cfee081448e44c8a25_7_0.png)\n\
    \nThe rest of this chapter outlines xv6’s services—processes, memory, file descriptors,\
    \ pipes, and file system—and illustrates them with code snippets and discussions\
    \ of how the shell, is the primary user interface to traditional Unix-like systems,\
    \ uses them. The shell’s use of calls illustrates how carefully they have been\
    \ designed.\n\nThe shell is an ordinary program that reads commands from the user\
    \ and executes them. The fact that the shell is a user program, not part of the\
    \ kernel, illustrates the power of the system call interface: there is nothing\
    \ special about the shell. It also means that the shell is easy to replace; as\
    \ a result, modern Unix systems have a variety of shells to choose from, each\
    \ with its own interface and scripting features. The xv6 shell is a simple implementation\
    \ of the essence of the Unix Bourne. Its implementation can be found at line (8550).\n\
    \n## Processes and memory\n\nAn xv6 process consumes user-space memory (instructions,\
    \ data, and stack) and per-process state private to the kernel. Xv6 can time-share:\
    \ it transparently switches the CPUs among the set of processes waiting to execute.\
    \ When a process is not executing, it saves its CPU registers, restoring them\
    \ when it next runs. The kernel associates a process identifier, or pid, with\
    \ each process.\n\nA process may create a new process using the fork system call.\
    \ Fork creates a new process, called the child process, with exactly the same\
    \ memory contents as the calling process, called the parent process. Fork returns\
    \ in both the parent and the child. In the parent, fork returns the child's pid;\
    \ in the child, it returns zero. For example, consider the following fragment:\n\
    \n```\nint pid = fork();\nif(pid > 0) {\n    printf(\"parent:%d\\n\", pid);\n\
    \    pid = wait();\n    printf(\"child %d is done\\n\", pid);\n} else if(pid ==\
    \ 0) {\n    printf(\"child exiting\\n\");\n    exit();\n} else {\n    printf(\"\
    fork error\\n\");\n```\n\nThe exit system call causes the process to stop executing\
    \ and to release sources as memory and open files.\n\n## System call\n\n### Description\n\
    \n| System call | Description |\n| :--- | :--- |\n| fork() | Create a current\
    \ process |\n| exit() | Terminate the current process |\n| wait() | Wait for a\
    \ child process to exit |\n| kill(pid) | Terminate process pid |\n| getpid(dirname)\
    \ | Return the current process's pid |\n| sleep(n) | Sleep for n clock ticks |\n\
    | exec(filename, *argv) | Load a file and execute it |\n| brk(n) | Grow process\
    \ by n bytes |\n| open(filename, flags) | Open a file; read/write |\n| read(fd,\
    \ buf, n) | Read n bytes from open file into buf |\n| write(fd, buf, n) | Write\
    \ n bytes to an open file |\n| close(fd) | Release file fd |\n| dup(fd) | Duplicate\
    \ fd |\n| pipe(p) | Create a pipe and return fds in p |\n| chdir() | Change the\
    \ current directory |\n| mkdir(name, minor) | Create a new directory |\n| link(f1,\
    \ f2) | Create another name (f2) for the file f1 |\n| unlink(filename) | Remove\
    \ a file |\n\nFigure 0-2. X6 system calls\n\nwait system returns the pid of an\
    \ exited child of the current process; if none of the caller's children has exited,\
    \ wait waits for one to do. In the example, the output lines\n\n```\nparent: child=1234\n\
    child: exiting\n```\n\nmight come in either order, depending on whether the parent\
    \ or child gets to printf call first. After the child exits the parent's wait\
    \ returns, causing the parent to print\n\n```\nparent: child 1234 is done\n```\n\
    \nAlthough the child has the same memory contents initially, the parent and child\
    \ are executing with different memory and registers: changing a variable in one\
    \ does not affect the other. For example, when the return value of wait is stored\
    \ into pid in the parent process, it does not change the variable in the child.\
    \ The value of pid will still be zero.\n\nThe exec system replaces the calling\
    \ processs memory with a new memory image loaded from a file in the system file.\
    \ The file must have a particular format, which specifies which part of the file\
    \ holds instructions, which is data, at which instruction to start, etc xv ELF\
    \ format, which Chapter 2 discusses in more detail. When exec succeeds, it does\
    \ not return to the calling program; instead, the instructions loaded from the\
    \ file start executing at the entry point declared in the ELF header. exec takes\
    \ two arguments: the name of the file containing the executable and an array of\
    \ string arguments. For example:\n"
