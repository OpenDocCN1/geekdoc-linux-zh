    \ `yield` 中）不能释放锁。\n`ptable.lock` 也保护其他内容：进程 ID 和进程表槽的分配、`exit` 与 `wait` 之间的相互作用、为了避免唤醒的大多数（下一节），以及其他可能考虑\
    \ `ptable.lock` 的不同功能是否可以拆分的事情，这是为了序列清晰，也可能是为了性能。\n\n## Sleep and wakeup\n\n调度和锁有助于隐藏一个进程对另一个进程的存在，但到目前为止我们还没有帮助进程有意交互的抽象。`sleep`\
