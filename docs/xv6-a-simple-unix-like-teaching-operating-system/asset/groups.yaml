    # User part of an address space


    2-3 shows the layout of the user memory of an executing process in xv6. The heap
    is above the stack so that it can expand when the process calls sbrk. The stack
    is a single page, and is shown with the initial contents as created. Strings containing
    the command-line arguments, as well as an array of pointers to them, are at the
    top of the stack. Just under are values that allow a program to start as if the
    function main(argc, argv) had just started. To guard a growing off the stack page,
    xv6 places a guard page right below the stack. The guard page is not mapped and
    if the stack runs off the stack page, the hardware will generate an exception
    because it cannot translate the faulting address.


    ## Code: exec


    Exec is the system that calls the user part of an address space. Exec initializes
    the user part of an address space from a file stored in the file system. Exec
    (6310) opens the named binary path using namei(6321), which is explained in Chapter
    6. Then it reads the ELF header. Headers are described in the widely-used ELF
    format. An ELF binary consists of an ELF header, struct elfhdr (1005), followed
    by a sequence of section headers, struct proghdr (1024). Each describes a section
    of the application that must be loaded into memory; xv6 programs have only one
    section header, but other systems may have separate sections for instructions
    and data.


    The first step is a quick check that the file probably contains an ELF. An ELF
    binary starts with the four-byte “magic number” 0x7F, ''E'', ''L'', ''F'', or
    ELF_MAGIC.


    ![](img/47079f861662c1cfee081448e44c8a25_33_0.png)


    Figure 2-3. Memory layout of a user process with its initial stack.


    sbrk+code namei+code ELF format struct elfhdr+code ELF_MAGIC (1002). If the ELF
    header has the right magic number, exec assumes that the binary is well-formed.


    Exec allocates a new page table with no user mappings with setupkvm (6334), allocates
    memory for each ELF segment with allocuvm (6348), and loads each segment into
    memory with loaduvm (6352), allocuvm checks that the virtual addresses requested
    is below KERNBASE. loaduvm (1918) uses walkpgdir to find the physical address
    of the allocated memory at which to write each page of the ELF segment, and dealloc
    to read from the file.


    The program section header for /init, the first user program created with exec,
    looks like this:


    ```

    # objdump -p _init


    _init:

    format elf32-i386


    Program Header:

    LOAD off 0x00000004 0x00000000 paddr 0x00000000 align 2**2

    files 0x000008c0 memsz 0x000008cc flags rw

    ```


    The program section header is less than the memsz, indicating that the gap between
    them is filled with zeros (for C global variables) rather than read from the file.
    For /init, filesiz is 2240 bytes and memsz is 2252 bytes, but allocuvm allocates
    enough memory to hold 2252 bytes, but only reads 224 bytes from the file /init.


