    | Directory |

    | Inode |

    | Logging |

    | Buffer cache |

    | Disk |


    **Figure 6-1.** Layers of the xv6 system.


    superblock; it contains metadata about the file system (the file system size in
    blocks, the number of data blocks, the number of inodes, and the number of blocks
