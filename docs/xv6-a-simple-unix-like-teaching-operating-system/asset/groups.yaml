    ## Scheduling


    Any operating system is likely to run with more processes than the computer has
    processors, and so a plan is needed to time-share the processors among processes.
    Ideally the sharing would be transparent to user processes. A common approach
    is to provide each process with the illusion that it has its own processor by
    multiplexing processes onto the hardware processors. This chapter explains how
    xv6 achieves this.


    ## Multiplexing


    xv6 multiplexes by switching each processor from one to another. First, the `sleep`
    and `wakeup` mechanism switches when a process waits for device I/O to complete,
    or waits for a child to exit, or waits in sleep. Second, xv6 periodically forces
    a switch when a process is executing instructions. This multiplexing ensures the
    illusion that each process has its own CPU, as as6 uses the memory allocator and
    hardware page tables to create the illusion that each process has its own memory.


    Implementing multiplexing poses a few challenges. First, how to switch from one
    process to another? xv6 uses the standard mechanism of context switching; although
    the idea is simple, the implementation is some of most opaque code in the system.
    Second, how to do context switching transparently? xv6 uses the standard technique
    of using the timer interrupt handler to drive contexts. Third, many CPUs may be
    switching processes concurrently, and a locking plan is necessary to avoid races.
    Fourth, when a process has exited its memory and more resources must be freed,
    but it cannot free all of this itself (for example it can''t free its kernel stack
    until it sleeps). xv6 tries to solve these problems as simply as possible, but
    nevertheless the resulting code is tricky.


    xv6 must provide for processes to coordinate among themselves. For example, a
    parent process may need to wait for one of its children to exit, or a process
    reading a pipe may need to wait for other process to write to it. Rather than
    making the waiting waste CPU by repeatedly checking whether the desired event
    has happened, xv6 allows process to give up the CPU and sleep waiting for an event,
    and allows another process to wake the first process up. Care is needed to avoid
    races that result in loss of event notifications. As an example of these problems
    and their solution, this chapter examines the implementation of pipes.


