    ## 附录 B


    ## 引导程序


    当 x86 PC 启动时，它开始执行名为 BIOS（基本输入输出系统）的程序，该程序存储在主板的非易失性内存中。BIOS 的任务是准备硬件并将控制权交给操作系统。具体来说，它将控制权移交给从引导区加载的代码，引导区是启动磁盘的第一个
    512 字节扇区。引导区包含引导程序：将内核加载到内存的指令。BIOS 在地址 `0x7c00` 处加载引导程序，然后将处理器的 %ip 设置为该地址。当引导程序开始执行时，处理器正在模拟一个
    Intel 8088，加载器的任务是将处理器置于更现代的操作系统环境中，从磁盘内存加载 xv6 内核，然后将控制权交给内核。xv6 引导程序包含两个源文件，一个采用
    16 位和 32 位 x86 汇编组合（`bootasm.S`; (9100)），另一个用 C 语言编写（`bootmain.c`; (9200)）。


    ### 代码：汇编自举引导


    引导程序的第一条指令是 `cli` (9112)，它禁用中断。中断是硬件设备调用操作系统函数处理程序的一种。BIOS 是一个微型操作系统，它可能在初始化硬件时已经设置了它的中断处理程序。BIOS
    不再运行了——引导程序正在运行，因此处理来自硬件设备的设备已不再是合适或安全的。当 xv6 准备就时（见第 3 章），它将重新启用中断。


    处理器处于实模式模式，它模拟一个 Intel 8088。在实模式模式下，有 8 个通用寄存器，但处理器向内存发送 20 位地址。段寄存器 `%cs`、`%ds`、`%es`
    和 `%ss` 提供从 16 位寄存器生成 20 位地址所需的额外位。当程序引用内存地址时，处理器会自动加上其中一个段寄存器值的 16 倍；这些寄存器的宽度为
    16 位。在各种内存引用中，隐式使用的段寄存器是：指令取指使用 `%cs`，数据读取和使用 `%ds`，栈读写和使用 `%ss`。


    xv6 假装 x86 指令的内存操作数使用虚拟地址，但 x86 指令实际上使用的是逻辑地址（见图 B-1）。线性逻辑地址由一个段选择器和一个偏移量组成，有时写为
    `segment:offset`。更多情况下，段是隐式的，程序直接操作偏移量。分段硬件执行上述转换以生成线性地址。如果启用了分页硬件（见第 2 章），它将将线性地址翻译为物理地址；否则，处理器将线性地址视为物理地址。


    引导程序没有启用分页硬件；它所使用的逻辑地址由分段硬件翻译为线性地址，然后作为物理地址使用。xv6 配置分段硬件以在不改变的情况下翻译逻辑地址，使它们相等。由于历史原因，我们使用“虚拟地址”一词来指代程序操作的地址；xv6
    虚拟地址等同于 x86 逻辑地址，并等同于分段硬件映射它的线性地址。一旦启用了分页，


    BIOS 不保证 `%ds`、`%es`、`%ss` 内容的内容，因此禁用中断后的首要任务是将 `%ax` 设置为零，然后将该零拷贝到 `%ds`、`%es`
    和 `%ss` 中 (9115-9118)。


    虚拟段:偏移量可以产生 21 位物理地址，但 Intel 8088 只能寻址 20 位内存，因此它删除了最高位：`0xffff0+0ffff=0xffeff`，但
    8088 上的虚拟地址 `0xffff` 指地址 `0xffeff`。早期某些依赖硬件处理第 21 位，但当 Intel 引入物理地址超过 20 位的处理器时，IBM
    提供了一个兼容性黑科技，这是 PC 兼容硬件的要求。键盘控制器输出端口的第二位为低，第 21 位物理位始终被清零；如果为高，则第 21 位正常工作。引导程序必须通过对端口
    `0x64` 和 `0x60` 的键盘控制器进行 I/O 操作来启用第 21 位 (9120-9136)。


    实模式的通用寄存器和段寄存器使得程序使用超过 65 变得很困难


    在保护模式下，段寄存器是段描述符表中的索引（每个条目包含一个物理地址、一个称为限制的最大大小，以及该段的权限）。这些权限就是保护模式下的保护：内核可以使用它们来确保程序只使用自己的内存。


    xv6 几乎没有使用段；它转而使用分页硬件，如第 2 章描述的。引导程序设置了段描述符表 `gt` (9182-9185)，使得所有段的基地址均为零，且具有最大的限制（4GB字节）。该表有一个空条目，一个用于可执行代码，以及一个用于-


    尝试数据的条目。图 B-2. 保护模式下的段。段描述符设置了一个标志位，指示代码应在 32 位模式下运行 (06660)。在这种设置下，当引导程序进入保护模式时，逻辑地址一对一映射到物理地址。


    引导程序执行 `lgdt` 指令 (9141)，使用变量 `gdtcse` (9187-9189) 加载处理器的全局描述符表 (GDT)，该变量指向表 `gdt`。


    一旦加载了 GDT，引导程序通过设置寄存器 `%cr0` 中的第 1 位 (CR0) (9142-9144) 来启用保护模式。启用保护模式不会立即改变处理器翻译到物理地址的方式；只有当向段寄存器加载一个新值时，处理器才会读取
    GDT 并改变其内部分段。人们无法直接修改 `%cs`，因此代码执行 `jmp` (远跳转) 指令 (9153)，这允许指定代码段选择器。跳转在新行 (9156)
    处继续执行，但在此过程中将 `%cs` 指向 `gdt` 中的代码描述符。该描述符描述了一个 32 位代码，因此处理器切换到 32 位模式。引导程序通过从
    8088 到 80286 再到 80386 的演进对处理器进行了嵌套。


    引导程序在 32 位模式下的第一个动作是使用 `%SEG_KDATA` 初始化段寄存器。逻辑地址现在直接映射到物理地址。在执行 C 语言之前，唯一的步骤是在栈中设置栈。（注：由于原文在此处存在大量重复的句子，翻译时已根据逻辑去重）


