    ## Code: Block allocator


    File and directory content is stored in disk blocks, which must be allocated from
    a free pool. xv6'' block allocator maintains a free bitmap on disk, with one bit
    per block. A zero bit indicates that the corresponding block is free; one bit
    indicates that it is in use. The program mkfs sets the bits corresponding to the
    boot sector, superblock, inode, and bitmap blocks.


    The block allocator performs two functions: balloc allocates a new block, and
    bfree a free block. The loop in balloc at (4810) considers every block, starting
    at 0 up to sb_size, the number of blocks in the file system. It looks for a block
    whose bit is zero, indicating it is free. If balloc finds a block, it updates
    the bitmap and returns the block. For efficiency, the lock is split into two pieces.
    The outer loop reads each block of bitmap bits. The inner loop checks all bits
    in a block. The race that might occur if two processes try to allocate a block
    at the same time is prevented by the fact that the buffer cache only lets one
    process use one bitmap at a time.


    bfree (4829) finds the right block and clears the right bit. Again the exclusion
    implied by read and bfree avoids the need for explicit locking.


