  md: 'a | b | c), which itself forks two new child processes (one for b and one for
    c). Thus, the shell may create a tree of processes. The leaves of this tree are
    commands and the interior nodes are processes that wait until the left and right
    children complete. In principle, you could have the interior nodes run the end
    of a pipeline, but doing so would correctly complicate the implementation.


    Pipes may seem no more powerful than temporary files: the pipeline


    ```

    echo hello world | wc

    ```


    could be implemented without pipes as


    ```

    echo hello world >/tmp/xyz; wc </tmp/xyz

    ```


    Pipes have at four advantages over temporary files in this situation. First, pipes
    automatically clean them up: with file redirection, a shell would have to be careful
    to remove /tmp/xyz when done. Second, pipes can pass arbitrarily long streams
    of data, while file redirection requires enough space on disk to store all the
    data. Third, pipes allow for parallel execution of pipeline stages, while the
    file approach requires the first program to finish before the second starts. Fourth,
    if you are implementing inter-process communication, pipes'' blocking reads and
    writes are more efficient than the non-blocking semantics of files.


    # # File system


    The xv6 file system provides files, which are uninterpreted byte arrays, and which
    contain references to files and other directories. The directories form a tree,
    starting at a special directory called the root. A path /a/b/c refers to the file
    or directory name c inside the directory b named inside the root directory /.
    Paths that don''t begin with / are evaluated relative to the process''s current
    directory, which can be changed with the chdir system call. Both code fragments
    open the same file (assuming all the directories exist):


    ```

    chdir("/a");

    chdir("/b");

    open("/c", O_WRONLY);

    ```


    ```

    open("/a/b/c", O_WRONLY);

    ```


    The first fragment changes the process''s current directory to /a/b; the second
    neither refers to change the process''s current directory.


    There are multiple system calls to create a new file or directory: mkdir creates
    a new directory, opening with the O_CREATE flag creates a new data file, and knod
    creates a new device file. This example illustrates three:


    ```

    mkdir("/dir");

    fd = open("/dir/file", O_CREATE|O_WRONLY);

    close(fd);

    mod("/console", 1, 1);

    ```


    Mkn creates a file in the file system, but the file has no contents. Instead,
    the file''s metadata tracks it as a device file and records the major and minor
    device numbers'
