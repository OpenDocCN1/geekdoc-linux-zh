  md: '# Appendix B


    # The boot loader


    When x86 PC boot, it starts executing a program called the BIOS (Basic Input/Output
    System), which is stored in non-volatile memory on the motherboard. The BIOS''s
    job is to prepare the hardware and transfer control to the operating system. Specifically,
    it transfers control to code loaded from the boot sector, the first 512-byte sector
    of the boot disk. The boot sector contains the boot loader: instructions that
    load the kernel into memory. The BIOS loads the boot loader at address 0x7c00
    and then sets the processor''s %ip to that address. When the boot loader begins
    executing, the processor is simulating an Intel 8088, and the loader''s job is
    to put the processor in a more modern operating system, to load the xv6 kernel
    from disk memory, and then to transfer control to the kernel. The xv6 boot loader
    carries two source files, one in a combination of 16-bit and 32-bit x86 assembly
    (bootasm.S; (9100)) and one written in C (bootmain.c; (9200)).


    # Code: Assembly bootstrap


    The first instruction in the boot loader is cli (9112), which disables interrupts.
    Interrupts are a way for hardware devices to invoke operating system function
    handlers. The BIOS is a tiny operating system, and it might have set up its interrupt
    handlers as of initializing the hardware. The BIOS isn''t running anymore—the
    boot loader is so it is no longer appropriate or safe to handle interrupts from
    hardware devices. When xv6 is ready (in Chapter 3), it will re-enable interrupts.


    The processor is in real mode, which it simulates an Intel 8088. In real mode
    there are 8 general-purpose registers, but the processor sends 20 bits of address
    to memory. The segment registers %cs, %ds, %es, and %ss provide the additional
    bits necessary to generate 20-bit addresses from 16-bit registers. When a program
    refers to a memory address, the processor automatically adds 16 times the value
    of one of the segment registers; these registers are 16 bits wide. Which segment
    register is used implicitly in the kind of memory reference: instruction fetches
    %cs, data reads and uses %ds, and stack reads and uses %ss.


