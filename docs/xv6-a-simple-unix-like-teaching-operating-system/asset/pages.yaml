  md: 'xv6 pretends that an x86 instruction uses a virtual address for its memory
    operands, but an x86 instruction actually uses a logical address (see Figure B-1).
    A linear logical address consists of a segment selector and an offset, and is
    sometimes written as segment:offset. More often, the segment is implicit and the
    program directly manipulates the offset. The segmentation hardware performs the
    translation described above to generate a linear address. If the paging hardware
    is enabled (see Chapter 2), it translates linear addresses to physical addresses;
    otherwise the processor linear addresses as physical.


    The boot loader does not enable the paging hardware; the logical addresses that
    it uses are translated to linear addresses by the segmentation hardware, and then
    used as physical addresses. xv6 configures the segmentation hardware to translate
    logical addresses without change, so that they are equal. For historical reasons
    we use the term virtual address to refer to addresses manipulated by programs;
    an xv6 virtual address is the same as an x86 logical address, and is equal to
    the linear address to which the segmentation hardware maps it. Once the paging
    is enabled,


    The BIOS does not guarantee anything about the contents of %ds, %es, %ss, so first
    order of business after disabling interrupts is to set %ax to zero and then copy
    that zero into %ds, %es, and %ss (9115-9118).


    A virtual segment:offset can yield a 21-bit physical address, but the Intel 8088
    could only address 20 bits of memory, so it deleted the top bit: 0xffff0+0ffff=0xffeff,
    but virtual address 0xffff on the 8088 referred to address 0xffeff. Some early
    relied on the hardware handling the 21st bit, but when Intel introduced processors
    with more than 20 bits of physical address, IBM provided a compatibility hack
