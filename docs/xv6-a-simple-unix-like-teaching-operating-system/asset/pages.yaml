  md: '# # Limitations of spin-locks


    Spin-locks are often a clean solution to concurrency problems, but there are times
    when they are awkward. Subsequent chapters will point out such situations in xv6;
    this section outlines some of the problems that come up.


    Sometimes a lock must be held by a group of functions that call each other, perhaps
    because the lock protects a collection of invariants or data items. For example,
    both a1allocproc and its callers for userinit ptable.lock cannot acquire the lock,
    since that would lead to deadlock. Instead, the xv6 code has a contention that
    whoever calls a1proc must already acquire ptable.lock. In addition, fork requirements
    expects userinit must call a1alloc at a time when invariants that the lock won''t
    vary. This pattern appears in other places in xv6. Thus a kernel programmer often
    has to be aware of what callee expects to be held, and what invariants need.


    It might seem that one could simplify situations where both caller and callee
    by allowing recursive locks, so that if a function calls a lock, any function
    is allowed to re-acquire it. However, the programmer would need to reason about
    all combinations of caller and callee, because it will no longer be the case that
    the data structure''s invariants always hold after an acquire. Whether recursive
    locks are better than xv6''s use of conventions about functions that require a
    lock to be held is not clear. The larger lesson is that (with global lock ordering
    to avoid deadlock) lock requirements sometimes can be private, but intrude themselves
    on the interfaces of functions and modules.


    A situation where locks are insufficient when one thread needs to wait for another
    thread''s data, for example when a pipe reader waits for some other thread to
    write the pipe. The waiting thread cannot hold the lock on the data, so xv6 provides
    a mechanism that jointly manages the lock and event wait; see the description
    of sleep and wakeup in Chapter 5.


