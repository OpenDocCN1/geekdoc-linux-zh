    Similarly, exceptions generate an interrupt too. Thus, if the operating system
    has a plan for interrupt handling, then the operating system can handle system
    calls and exceptions too.


    The basic plan is as follows. An interrupt stops the normal process loop and starts
    a new sequence called an interrupt handler. Before starting the interrupt handler,
    the processor saves its registers, so that the operating system can store them
    when it returns from the interrupt. A challenge in the transition to and from
    the interrupt handler is that the processor must switch from user to kernel mode
    and back.


    A word on terminology: Although the official x86 term is interrupt, xv refers
    to all of these traps, largely because it was the term used by the PDP11/40 and
    conventional Unix term. This chapter uses the terms trap and interrupt interchangeably,
    but it is important to remember that traps are caused by the current process running
    on a processor (eg, the process makes a system call and generates a trap), and
    interrupts are caused by devices and may not be related to the currently running
    process. For example, a disk may generate an interrupt when it is retrieving a
    block for one process, but at the time some other process may be running. Property
    of interrupts makes thinking about interrupts more difficult than thinking about
    traps, because interrupts happen concurrently with other activities. Both rely,
    however, on the same hardware mechanism to transfer between user and kernel mode
    securely, which we will discuss next.


    # X86 protection


    The x86 has 4 protection levels, numbered 0 (most privilege) to 3 (least privilege).
    In practice, most operating systems use only 2 levels: 0 and 3, which are then
    called kernel mode and user mode, respectively. The current privilege level with
    which the x86 executes is stored in cs register, in the field RPL.


    On the x86, interrupt handlers are defined in the interrupt descriptor table (IDT).
    The IDT has 256 entries, each giving the cs and %ip to be used when handling the
    corresponding interrupt.


