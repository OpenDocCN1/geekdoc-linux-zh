    high, the 21st bit acts normal. The boot loader must enable the 21st bit using
    I/O to the keyboard controller on ports 0x64 and 0x60 (9120-9136).


    Real mode''s general-purpose and segment registers make it awkward for a program
    to use more than 65


    In protected mode, a segment register is an index in a segment descriptor table
    (each entry contains a physical address, a maximum size called the limit, and
    permissions for the segment). These permissions are the protection in protected
    mode: the kernel can use them to ensure that a program uses only its own memory.


    xv6 makes almost no use of segments; it uses paging hardware instead, as Chapter
    2 describes. The boot loader sets up the segment descriptor table gt (9182-9185)
