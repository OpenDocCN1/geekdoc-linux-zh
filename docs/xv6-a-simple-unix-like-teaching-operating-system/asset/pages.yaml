  md: '# # Chapter 0


    # # Operating system interfaces


    The job of an operating system is to share a computer among multiple programs
    and to provide a more useful set of services than the hardware alone supports.
    The operating system manages and abstracts the low-level hardware, so that, for
    example, a word processor need not concern itself with which type of disk hardware
    is being. It also shares the hardware among multiple programs so that they run
    (or appear to run) at the same time. Finally, operating systems provide controlled
    ways for programs to interact, so that they can share data or work together.


    An operating system provides services to user programs through an interface. Designing
    a good interface turns out to be difficult. On the one hand, we would like the
    interface to be simple and narrow because that makes it easier to implement the
    right. On the other hand, we may be tempted to offer many sophisticated features
    to applications. The challenge in resolving this tension is to design interfaces
    that rely on a few mechanisms that can be combined to provide much generality.


    This book uses a single operating system as a concrete example to illustrate operating
    concepts. That operating system, xv6, provides the basic interfaces introduced
    by Thompson and Ritchie''s Unix operating system, as well as including Unix''s
    internal design. Unix provides a narrow interface whose mechanisms combine well,
    offering a surprising degree of generality. This interface has so successful that
    modern operating systems—BSD, Linux, Mac OS, Solaris, and to a larger extent,
    Microsoft Windows—have Unix-like interfaces. Understanding xv6 is a good start
    toward understanding any of these systems and more.


    As shown in Figure 0-1, xv6 takes the traditional form of a special program that
    provides services to running programs. Each running program, called a process,
    has memory containing instructions, data, and a stack. The instructions implement
    the program''s computation. The data are the variables on which the computation
    acts. The system manages the program calls.


    When a process needs to invoke the kernel, it invokes a procedure in the operating
    system interface. Such procedure is called a system call. The system enters the
    kernel, performs the procedure and returns. Thus a process alternates executing
    in user space and kernel space.


    The kernel uses the CPU''s hardware protection mechanisms to ensure that each
    process executing in user space can access only its memory. The kernel executes
    with the hardware privileges required to implement these protections; user programs
    execute without those privileges. When a user program invokes a system call, the
    hardware raises the privilege level and starts executing a prearranged function
    in the kernel.


    The collection of system calls that a kernel provides is the interface that user
    programs see. xv6 provides a subset of the services and system calls that Unix
    traditionally offers. Figure 0-2 lists all of xv6''s system calls.'
