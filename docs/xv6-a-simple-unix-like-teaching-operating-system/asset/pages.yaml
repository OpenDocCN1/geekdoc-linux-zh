  md: "# Code: C bootstrap\n\nThe part of the boot loader, bootmain.c (9200), expects\
    \ to find a copy of the kernel executable on the disk starting at the second sector.\
    \ The kernel is an ELF binary, which we have seen in Chapter 2. To access the\
    \ ELF headers, bootmain loads the 4096 bytes of the ELF binary (9214). It places\
    \ the in-memory copy at address 0x100000.\n\nThe next step is a quick check that\
    \ this is probably an ELF binary, and not an uninitialized disk. Bootmain reads\
    \ the section's content from the disk location off bytes and writes to memory\
    \ at address paddr. Bootmain calls read to load data from disk (9238) and calls\
    \ stos to zero the remainder of the segment (9240). Stos (9492) uses the x86 instruction\
    \ rep stsb stos to initialize every byte of a block.\n\nThe kernel has been compiled\
    \ and linked so that it expects to find itself at virtual addresses at 0x80100000.\
    \ Thus, function instructions must mention addresses that look like 0x801xxxx;\
    \ you can see examples in kernel.asm. This address is configured in kernel.ld;\
    \ 0x80100000 is a relatively high address, towards of the 32-bit address space;\
    \ Chapter 2 explains the reasons for this choice. There may be no physical memory\
    \ at such a high address. Once the kernel starts executing, it will set up the\
    \ paging hardware to map virtual addresses starting at 0x80100000 to physical\
    \ addresses that there is physical memory at this lower address. At this point\
    \ in the process, however, paging is not enabled. Instead, kernel.ld specifies\
    \ that paddr start at 0x00100000, causes the boot loader to copy the kernel to\
    \ the low physical addresses to the paging hardware will eventually point.\n\n\
    The boot loader's final step is to call the kernel entry point, which is the instruction\
    \ at which the kernel expects to start executing. xv6 the entry address is 0x0010000c\n\
    \n```\n# objdump -f elf32-i386\n\nkernel:    file elf32-i386\n            architecture:\
    \ 1386, HAS_SYS, D_PAGED\n            EXEC_P, _START\n            start address\
    \ 0x0010000c\n```\n\nBy convention, the _start symbol specifies the ELF entry\
    \ point, which is defined in the file entry.S (1140). Since xv6 has not set up\
    \ virtual memory yet, xv6's entry point is the physical address of entry (1144).\n\
    \n# Real world\n\nThe boot loader described in this appendix compiles to around\
    \ 470 bytes of machine code, depending on the optimizations used when compiling\
    \ the C code. In order to fit in that small amount of space, the xv6 boot loader\
    \ makes a simplifying assumption, that the kernel has been written to the boot\
    \ disk contiguously starting at sector 1. More commonly, kernels are stored in\
    \ ordinary file systems, where they may not be contiguous, or loaded over a network.\
    \ These complications require"
