    scheme has been remarkably persistent over the years. BSD''s UFS/SFS and Linux''s
    ext2/ext3 use the same data structures. The most inefficient part of the file
    system is the directory, which requires a linear scan over all the disk blocks
    looking each loop. This is expensive for directories holding many files. Microsoft
    Windows'' NTFS, Mac OS X''s HFS, and Solaris''s ZFS, just to make a few, implement
    as an on-disk balanced of trees.


    Xv6 is naive about disk failures: if a disk operation fails, xv6 panics. Whether
    this is reasonable depends on the hardware: if an operating system atop special
