    There are three cases when control must be transferred from a user program to
    the kernel. First, a system call: when a user program asks for an operating system,
    as we saw at the end of the last chapter. Second, an exception: when a program
    performs an illegal action. Examples of illegal actions include divide by zero,
    attempt to access memory for a PTE that is not present. Third, an interrupt: when
    a device generates a signal to indicate that it needs attention from the operating
    system. For example, a clock chip may generate an interrupt every 100 msec to
    allow the kernel to implement time sharing. As another example, when the disk
