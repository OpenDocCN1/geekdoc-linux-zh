    The sequence of instructions between acquire and release is often called a critical
    section, and the lock protects list.


    When we say a lock protects data, we really mean that the lock protects collection
    of invariants that apply to the data. Invariants are properties of data structures
    maintained across operations. Typically, an operation''s behavior depends on the
    invariants being true when the operation begins. The operation may temporarily
    violate the invariants but must reestablish them before finishing. For example,
    in the list case, the invariant is that list points to the first node in the list
    and each node''s next points to the next node. The implementation of insert violates
    this invariant temporarily: list creates a new element with the intent to be the
    first node in the list, its next does not point to the next node in the list yet
    (established at line 15) and list does not point at 1 yet (established at line
    16). The race condition we examined above happened because a second CPU executed
    code that depended on the list invariants while they were (temporarily) volatile.
    Proper use of a lock ensures that only one CPU at a time can operate on the data
