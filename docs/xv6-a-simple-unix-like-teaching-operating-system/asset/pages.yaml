    # Real world


    Supporting all devices on a PC motherboard in its full glory is much work, because
    there are many devices, the devices have features, and the protocol between device
    and driver can be complex. In many operating systems, the drivers account for
    more code in the operating system than the core kernel.


    Actual device drivers are far more complex than the disk driver in this, but the
    basic ideas are the same: typically devices are slower than CPU, so hardware uses
    interrupts to notify the operating system of status changes. Modern disk controllers
    typically accept a batch of disk requests at a time and even reorder them to make
    more efficient use of the disk arm. When disks were simpler, operating systems
    often reordered the request queues.


    Many operating systems have drivers for solid-state disks because they provide
    much faster access to data. Although a solid-state disk works differently from
    a traditional mechanical disk, both provide block-based interfaces and reading/writing
    blocks on a solid-state disk is still more expensive than reading/writing RAM.


    Other hardware is surprisingly similar to disks: device buffers hold hold packs,
    audio device buffers hold sound samples, graphics buffers hold video data and
    command sequences. High-bandwidth devices—disks, graphics cards, and network cards—often
    use direct memory access (DMA) instead of the explicit I/O (ins, out1) in driver.
    DMA allows the disk or other controllers direct access to physical memory. The
    driver gets the physical address of the buffer''s data field and the device copies
    directly to or from memory, interrupting the copy complete. DMA means that the
    CPU is not involved at all in the transfer, which can be more efficient and is
    less taxing for the CPU''s memory caches.


    Most of the devices in this era used I/O instructions to program them, which reflect
    the older nature of these devices. All modern devices are programmed using memory-mapped
    I/O.


    Some drivers dynamically switch between polling and interrupts, because using
    interrupts is expensive, but polling can introduce delay until the driver events.
    For example, for a network driver that receives a buffer of packets, may switch
    from interrupts to polling since it knows that more packets must be processed
    and is less expensive to process them using polling. Once no more packets are
    to be processed, the driver may switch back to interrupts, so that it be alerted
    immediately when a new packet arrives.'
