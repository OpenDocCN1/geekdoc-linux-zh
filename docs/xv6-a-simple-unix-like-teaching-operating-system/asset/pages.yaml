    Although the child has the same memory contents as the parent initially, the parent
    and child are executing with different memory and registers: changing a variable
    in one does not affect the other. For example, when the return value of wait is
    stored into pid in the parent process, it does not change the variable in the
    child. The value of pid will still be zero.


