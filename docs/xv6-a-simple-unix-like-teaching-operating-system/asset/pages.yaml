  md: '# Chapter 2


    # Page tables


    Page tables are the mechanism through which the operating system controls what
    memory addresses mean. They allow xv6 to multiplex the address spaces of different
    processes into a single physical memory, and to protect the memory of different
    processes. The level of indication provided by page tables allows many neat tricks,
    xv6 uses a few simple page-table tricks: mapping the same memory (kernel) in several
    address spaces, mapping the same memory more than once in one address space (each
    user page is mapped into the kernel''s physical view of memory), and guarding
    a user stack with an unmapped page. The rest of this chapter explains the page
    tables that the x86 hardware provides them.


    # Paging hardware


    As a reminder, x86 instructions (both user and kernel) manipulate virtual addresses.
    The machine''s RAM, is indexed with physical addresses. The x86 page table hardware
    connects these two kinds of addresses, by mapping each virtual address to a physical
    address.


    An x86 page table is logically an array of 2^20 (1,048,576) page table entries
    (PTEs). Each PTE contains a 20-bit physical page number (PPN) and some flags.
    The paging hardware translates a virtual address by using its top 20 bits to index
    into the page table to find a PTE, and replacing the address 20 bits with the
    PPN in the PTE. The paging hardware copies the low 12 bits unchanged from the
    virtual to the translated address. Thus a page table guides the operating system
    over virtual-to-physical address translations at the granularity of aligned chunks
