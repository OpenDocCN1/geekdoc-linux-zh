    # # File system


    The purpose of a file system is to organize and store data. File systems typically
    support sharing of data among users and applications, as well as persistence so
    that data is still available after a reboot.


    The xv6 file system provides Unix-like files, directories, and pathnames (see
    Chapter 0), and stores its data on an IDE for persistence (see Chapter 3). The
    file system addresses several challenges:


    +   * The file system needs on-disk data structures to represent the tree of named
    directories and files, to record the identities of the blocks that hold each file''s
    content, and to record which areas of the disk are free.


    +   * The file system must support crash recovery. That is, if a crash (e.g.,
    power failure) occurs, the file system must still work correctly after a restart.
    The risk is that a crash might interrupt a sequence of updates and leave inconsistent
    on-disk data structures (e.g., a block that is used in both a file and marked
    free).


    +   * Different processes may operate on the file system at the same time, so
    the file system code must coordinate to maintain invariants.


    +   * Accessing a disk is orders of magnitude slower than accessing memory, so
    the file system must maintain an in-memory cache of popular blocks.

    The rest of this chapter explains how xv6 addresses these challenges.


    # # Overview


    The xv6 file system implementation is organized in seven layers, as shown in Figure
    6-1. The disk layer reads and writes on an IDE hard drive. The buffer cache layer
    caches disks and synchronizes access to them, making sure that only one process
    can modify the data stored in any particular block. The logging layer allows higher
    layers to write updates to several blocks in a transaction, and ensures that the
    blocks are updated atomically in cases of crashes (i.e., all of them are updated
    or none). The inode layer provides individual files, each represented as an inode
    with a unique number and some blocks holding the file data. The directory layer
    implements each directory as a special kind of inode whose content is a sequence
    of directory entries, each of which contains a file''s name and i-number. The
    pathname provides hierarchical path like `/usr/rtm/xv6.c`, and resolves them with
    recursive lookup. The file descriptor abstracts many Unix resources (e.g., pipes,
    devices, files, etc.) using the file system interface, simplifying the lives of
    application programmers.


