  md: 'File descriptors are a powerful abstraction, because they hide the details
    of pipe they are connected to: a process writing to file descriptor 1 may be writing
    to a file, to a device like the console, or to a pipe.


    # Pipes


    A pipe is a small kernel buffer exposed to processes as a pair of file descriptors,
    one for reading and one for writing. Writing data to one end of the pipe makes
    that data available for reading from the other end of the pipe. Pipes provide
    a way for processes to communicate.


    The following example code runs the program with standard input connected to the
    read end of a pipe.


    ```

    int p[2];

    char *argv[2];


    arv[0] = "wc";\argv[1] = 0;


    pipe(p);

    if(fork() == 0) {

    close(0);

    dup(p[0]);

    close(p[0]);

    close(p[1]);

    exec("/bin/wc", argv);

    } else {

    close(p[0]);

    write(p[1], "hello world\n", 12);

    close(p[1]);

    }

    ```


    The program calls pipe, which creates a new pipe and records the read and write
    descriptors in the array p. After fork, both parent and child have file descriptors
    referring to the pipe. The child dups the read end onto file descriptor 0, closes
    the file descriptors in p, and exec wc. When reads from its standard input, it
    reads from the pipe. The parent closes the read side of the pipe, and then, closes
    the write side.


    If no data is available, a read on a pipe waits for data to be written or all
    file descriptors referring to the end to be closed; in the latter case, read will
    return 0, just if the end of a file has been reached. The fact that read blocks
    until it is impossible for new data to arrive is one reason that it''s important
    for the child to close the write end of the pipe before executing wc: if we file
    descriptors referred to the write end of the pipe, wc would never see end-of-file.


    The xv6 shell implements pipelines as grep sh.c | wc -1 in a manner similar to
    the above code (8650). The process creates a pipe to connect the left end of the
    pipe with the right end. Then it calls fork and runcmd for the left end of the
    pipeline and runcmd for the right end, and waits for both finish. The right end
    of the pipeline can be a command that itself creates a pipe (e.g.,'
