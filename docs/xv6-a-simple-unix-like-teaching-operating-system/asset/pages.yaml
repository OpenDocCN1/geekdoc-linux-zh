    # Real world


    Unix''s combination of the "standard" file descriptors, pipes, and convenient
    shell syntax for operations on them was a major advance in writing general-purpose
    reusable programs. The idea sparked a culture of "software tools" that was responsible
    for much of Unix''s power and popularity, and that was the first-called "scripting
    language." The Unix system call interface persists today in systems like BSD,
    Linux, and Mac OS X.


    The Unix system call interface has been standardized through the Portable Operating
    Interface (POSIX) standard. X6 is not POSIX compliant. It misses many calls (including
    basic ones as seek), for simplicity and clarity while implements only partially.
    Several people have extended xv6 with a few more basic system calls and a simple
    C library so that they can run Unix programs. Modern kernels, provide many more
    kinds of kernel services, as xv6. For example, they support networking, Windows
    systems, user-level threads, drivers for many devices, and Modern kernels evolve
    rapidly, and offer many features beyond POSIX.


    For the most part, modern Unix-operating systems have not followed the early Unix
    model of exposing devices as special files, like the console device file above.
    The authors of Unix went to Build Plan 9, which applied the "resources are files"
    concept to modern facilities, representing networks, graphics, other resources
    as files or tree files.


    The file system abstraction has been a powerful idea, most recently applied to
    network resources in the form of the World Web. Even so there are other methods
    for operating system interfaces. Multics, a predecessor of Unix, abstracted storage
    in an age that made it like memory, providing a very different flavor of interface.
    The complexity of the Multics had a direct influence on the designers of Unix,
    who tried to build something simpler.


    This book explains how xv6 implements its Unix-like interface, but the ideas and
    concepts apply to more than just Unix. Any operating system that multiplex processes
    onto the underlying hardware, isolate processes from each other, and provide mechanisms
    for inter-process communication. After studying xv6, you should be able to look
    at other, more complex operating systems and see the concepts underlying xv6 in
    those systems as well.'
  merge: -1
