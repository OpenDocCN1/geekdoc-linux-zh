    # Traps, interrupts, and drivers


    When running a process, a CPU executes the normal processor loop: read an instruction,
    advance the program counter, execute the instruction, repeat. But there are events
    on which control a user program must transfer back to the kernel instead of executing
    the next instruction. These events include a device signaling that it needs attention,
    a user program doing something illegal (e.g., references a virtual address for
    which there is no PTE), a user program asking the kernel for a system call. There
    are three main challenges in handling these events: 1) the kernel must arrange
    that a processor switches from user mode to kernel mode (and back); 2) the kernel
    and devices must coordinate their parallel activities; and 3) the kernel must
    understand the interface of the devices. Addressing these 3 challenges requires
    detailed understanding of hardware and careful programming, and can result in
    opaque kernel code. This chapter explains how xv6 addresses these three challenges.


