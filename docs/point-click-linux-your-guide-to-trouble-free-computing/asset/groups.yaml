    # 第 17 章


    ## Kopete：即时通讯（IM）、IRC 和通用聊天


    Kopete 是一款“全能”工具，它让你能够访问 AIM、ICQ、MSN、Yahoo! 以及其他流行的“在线聊天”服务，外加互联网中继聊天（IRC）。它的设置和配置非常简单。除了使用简单的账户“向导”添加账户外，你无需进行任何配置即可使用它，但如果你愿意多花几分钟，你可以选择背景颜色、消息显示格式以及许多其他内容，让
    Kopete 真正属于你。


    ### 设置 Kopete 以访问 AIM


    我们将以 AOL 即时信使（AIM）为例，但 Kopete 设置向导在所有流行聊天服务中的工作方式都是相同的。第一次点击屏幕底部面板中的 Kopete 图标打开
    Kopete 时，“注册向导”会自动打开。


    这个向导正如你对设置向导的预期那样“神奇”：你只需按照指示操作，每完成一个屏幕就点击“下一步”，直到最后一个屏幕，然后点击“完成”来保存你输入的 username
    和 password。


    ![](img/01efe5dd076565746bf3678068ba155c_145_0.png)


    设置向导假定你已经在所选服务（在我们的例子中是 AIM）上拥有账户。如果没有，每个注册屏幕的左下角都有一个链接，指向你可以为该服务注册账户的网页，然后你可以回来设置
    Kopete 以配合其工作。


    ![](img/01efe5dd076565746bf3678068ba155c_145_1.png)


    当你设置好 AIM 或其他服务后，启动 Kopete 时不会自动弹出设置向导；要为另一个账户输入信息，你需点击启动程序时弹出小窗口顶部的“设置”，然后从该点击操作在屏幕上带出的小菜单底部选择“配置
    Kopete”。


    ![](img/01efe5dd076565746bf3678068ba155c_146_0.png)


    从该屏幕选择“账户”，你将看到已设置好的 AIM 账户。点击这个小屏幕右侧的“新建”以调出账户向导，然后点击“下一步”以显示 Kopete 可以为你连接的医疗服务列表——与设置
    AIM 账户时完全相同，除了互联网中继聊天（IRC）之外，所有服务均按此方式设置。


    ![](img/01efe5dd076565746bf3678068ba155c_146_1.png)


    在 Kopete 中设置即时通讯账户时，你可能想做出的另一个选择是点击“连接”选项卡，当你高亮显示已设置的账户并点击“修改”后，可以看到该选项卡在“编辑账户”屏幕顶部露出的样子。这里只有一个选项：你希望每次启动
    Kopete 时自动登录该服务吗？如果是这样，请点击“启动时自动连接”复选框。如果不是——或者如果你决定不再希望以最初设置的方式自动启动，请点击该小复选框以取消勾选。


    ![](img/01efe5dd076565746bf3678068ba155c_147_0.png)


    ### 介绍 IRC


    尽管全球拥有互联网连接的人中，使用 IRC 的人数不到一百万，但它却是组织团体或个体聊天最高效的方式之一。在许多方面，IRC 就像互联网上一个地下的“精英”板块。大多数
    IRC 网络由志愿者运营，虽然一些网络拥有针对世界上每个主题的聊天频道——从跨文化约会到关于电视“真人秀”的讨论——但我们中的许多人主要将其作为快速提供和获取技术支持的方式。本书作者倾向于在
    irc.oftc.net 和 irc.slash-net.org 上“闲逛”。另一个流行的 Linux 人群网络是 irc.freenode.net，官方的
    #mepis 帮助频道就在那里。


    如果你从未使用过 IRC，现在是尝试它的绝佳时机。


    ### 使用 Kopete 进行 IRC


    IRC 的设置稍微复杂一点，但也不多。你从相同的“账户向导”屏幕开始。从那里你点击“新建”，然后点击“下一步”，再从即时通讯服务列表中选择“IRC”。另一个“下一步”会带你进入
    IRC 设置屏幕。


    ![](img/01efe5dd076565746bf3678068ba155c_148_0.png)


    请注意，这里有三个选项卡。你需要至少使用其中两个才能开始连接。确实，除了输入昵称和用户名的“基本设置”屏幕外，你还需要使用的是“连接”屏幕，在那里你会输入想要连接的
    IRC 服务器。当你在该屏幕上时，决定是否希望每次启动 Kopete 时都连接到该网络。


    ![](img/01efe5dd076565746bf3678068ba155c_148_1.png)


    第三个 IRC 设置屏幕声称它是用于“高级配置”，但其实并不那么高级。你使用此屏幕通过标准的 IRC `/join #channel!` 命令设置想要自动加入的任何频道，此外你还用它来决定是否要通过
    IRC 设置 CCCP 文件传输。（如果你不是熟练的 IRC 用户且不完全理解 IRC，不要担心。你甚至不需要使用 IRC，即使你想开始使用，你只需要知道你想加入哪些服务器和频道。）


    ![](img/01efe5dd076565746bf3678068ba155c_149_0.png)


    ### “我应该加入哪些 IRC 频道？”


    对这个问题的唯一理智回答是另一个问题：“你的兴趣是什么？”有数以万计的 IRC 频道。有些以计算机和软件为中心；你的 *SimplyMepis* CD 中包含的几乎每个程序都有至少一个专门的
    IRC 频道供你寻求帮助，你可以找到几乎任何非计算机兴趣的 IRC 频道，从约会到帆船到你的最爱视频游戏或电视节目。


    你要加入的第一个明显频道是 **irc.freenode.net** 上的 **#mepis**。它是 MEPIS 帮助频道。另一个你可能想查看通用 Linux
    帮助的频道，也在 **irc.freenode.net** 上，是 **#linux**。


    要找到更多频道，一个绝佳的起点是网站 **SearchIRC.com**。它并不列出世界上所有的 IRC 聊天室——IRC 频道变化如此之快，没有人能跟上这些持续的变化——但它列出了数千个更受欢迎的频道，甚至在网站中内置了一个小
    IRC 工具，你可以在决定将其添加到你的 Kopete 列表之前用它来查看频道。


    ![](img/01efe5dd076565746bf3678068ba155c_149_1.png)


    ### 配置 Kopete 的“外观和感觉”


    这并不难，而且完全是可选的。从 Kopete 屏幕顶部选择“设置”选项，然后是“配置 Kopete”，从出现的屏幕中，选择“外观”或“行为”。任何一个都会给你几个选项卡供选择，如“常规”或“聊天窗口”。这些是实验安全的，甚至被鼓励的区域。在最坏的情况下，如果你让某些东西看起来奇怪，你可以回到你进行修改的屏幕，点击底部的“默认值”按钮，一切就会恢复到你开始实验前的样子。


    ![](img/01efe5dd076565746bf3678068ba155c_150_0.png)


    ### 在哪里获取 Kopete 帮助


    - LinuxQuestions.org

    - kopete.kde.org

    - irc.kde.org, #kopete


    # 第 18 章


    ## gFTP——一个简单而强大的 FTP 程序


    你可以直接通过 Mozilla 浏览器进行基本的数据下载，但说到繁重的上传和下载，特别是到你自己管理的 FTP（文件传输协议）服务器时，没有什么比拥有一个专用的
    FTP 程序更棒的了。我们非常喜欢 gFTP，以至于我们用它来传输所有 Point & Click Linux 的视频、文本和图像文件。它是我们用过的最好、最可靠、最通用的“点击式”
    FTP 程序。


    ![](img/01efe5dd076565746bf3678068ba155c_152_0.png)


    > **仅当你使用 FTP 时才阅读此章**

    >

    > 本章面向经验丰富的 FTP 用户。如果你不使用 FTP，请随意跳过它。如果你想了解 FTP，你的 ISP（互联网服务提供商）可能在线上有 FTP 教程。如果没有，`www.ftppplanet.com/Enterprises/basics.htm`
    上的那个相当不错，如果你在任何搜索引擎中输入“FTP tutorial”（FTP 教程），你会发现更多。


    ### 过去十年间 FTP 的使用变得更容易了


    多年来，基本的 FTP 程序都是 100% 基于命令行的。你输入长串文本，其中只有部分是人类可读的语言，以实现你的目标。使用命令行 FTP 程序的人往往会在睡梦中嘟囔诸如“chmod
    644 权限更改为只读用户”之类的话，因为他们如果不记得所有命令就无法完成工作。幸运的是，命令行 FTP 现在是 hardcore Unix 和 Linux
    用户的专属领域，我们其他人可以在不使用命令行或记住所有这些计算机术语的情况下获得完全相同的结果。


    gFTP 遵循与其他几乎每个 GUI FTP 程序相同的“本地计算机文件在左侧，远程计算机文件在右侧”的基本格式。以下是 MBRPIS `org` 私有“测试”下载服务器的文件结构示例：


    ![](img/01efe5dd076565746bf3678068ba155c_153_0.png)


    我们通过用鼠标抓住该行左侧的线条（就在“箭头”按钮的右侧）并将其向左拉，直到可以看到我们想要的信息，从而加宽了该窗口。所有 gFTP 窗口都可以如此轻松地调整大小。


    ![](img/01efe5dd076565746bf3678068ba155c_153_1.png)

