    # 1: What You Can Do with Linux


    you run a copy of Windows 95, 98 or ME (and virtually any Windows program) *inside*
    Linux. This is different from "dual-booting" Windows and Linux on the same computer
    for several reasons:


    "Dual-booting" means you have both Windows and Linux installed on your computer,
    which is easy to do with MEPls, but to change from one operating system to the
    other you must reboot your computer.


    Windows typically starts and runs faster through Win4Lin in Linux than it does
    all by itself. This sounds strange, but it''s true.


    If Windows crashes while you''re using it through Win4Lin, the whole computer
    doesn''t need to be restarted, just Windows itself, and this takes a lot less
    time than going through the whole boot-from-scratch rigmarole.


    While using Windows under Linux through Win4Lin, you can use the Konqueror file
    manager included with MElPS to drop a picture you''ve created with your Windows
    software directly into a Web page or other document you''re creating with a Linux
    program. This versatility lets you use the best Windows programs and the best
    Linux programs side by side, so you have the best of both worlds at your fingertips,
    instead of having to choose one or the other.


    In the end, even if you decide you still want to use some Windows programs for
    a while, you''ll probably find that many Linux programs aren''t "just as good"
    or "almost as good" as the Windows programs you''re used to using—they are better
    than their Windows equivalents in many ways and include useful features they lack.


    ![](img/01efe5dd076565746bf3678068ba155c_20_0.png)


    The (free) Mozilla Messenger email program we''ve included for you is totally
    immune to all viruses and worms that can infect Microsoft Outlook or Outlook Express,
    and it has (free) built-in spam filtering that is better than most of the filters
    you can buy as add-ons for Microsoft''s email programs.


    The Mozilla browser in *SimplyMEPIs* has many features Explorer lacks. It can
