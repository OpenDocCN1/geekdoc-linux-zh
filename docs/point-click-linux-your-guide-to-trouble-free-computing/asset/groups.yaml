    shut the computer off with the switch (you don’t need to use the operating system
    shutdown procedure because the operating system hasn’t started yet), and have
    your finger ready this time. But before you begin messing with your BIOS, please
    read this bold-face note:


    > **WARNING:**

    >

    > Be very, very careful when you change anything in your BIOS. Make exact notes
    of the original settings before you change anything at all, and read all the little
    “how to change/how to save” text at the bottom of the screen very carefully. If
    you mess up your BIOS your computer may not boot any OS, and if you set something
    you shouldn’t and it still boots, vital functions may not work correctly. Be very,
    very careful when you change anything in your BIOS.


    That said, when you get into your BIOS setup you’ll probably see a screen that
    has words like “BOOT PRIORITY” or “BOOT ORDER” somewhere on it. This is what you
    need to change. (Your mouse may not work at this point. If it doesn’t, you will
    need to use your Tab or up and down arrow keys to move between lines.)


    When you get your cursor on the “BOOT” line, you can usually change the boot priority
    by hitting the space bar. If this doesn’t work, try other keys. You can’t hurt
    anything at this point. It’s only when you save changes that you can damage your
    system, and every common BIOS has an option for “Exit without saving changes”
    you can use if you’re not absolutely, positively sure you did the right thing.


    Obviously, you want “CD-ROM” to be the first boot choice if you’re going to be
    booting from a CD-ROM. After you do your new installation (or need to return temporarily
    to the operating system you already have installed) you can change the boot priority
    back to the way it was before your experiment.


    ### Think of BIOS Access as a Puzzle To Be Figured Out


    One HP desktop we use for a test computer doesn’t just give you a single BIOS
    screen. First, you hit F10 to access the BIOS setup program, then you choose “Advanced
    CMOS Setup” from a menu to find your boot priority. The instructions are all there,
    right on the screen, but you need to read them instead of just clicking keys and
    hoping.

