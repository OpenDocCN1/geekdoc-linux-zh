  - '[PAGE 208]


    # Chapter 25


    # Cooperating with Windows


    There''s no denying it: We may use Linux and like it, but there may be programs
    we need to use that are only available (right now) for Windows, and we must often
    share computer networks with people who run Windows. Luckily, there are ways we
    can use Windows software in Linux—even run Windows inside Linux—and network with
    Windows computers.'
  - "[PAGE 209]\n\n# CrossOver Office\n\nCrossOver Office is software that runs many\
    \ Windows applications and plug-ins in Linux. It's a commercial pro-gram, but\
    \ costs much less than a standalone copy of Windows, and after you install it\
    \ on your computer it only takes a click or two to install a Windows program “inside”\
    \ it.\n\n![](img/01efe5dd076565746bf3678068ba155c_209_0.png)\n\nWhen installed,\
    \ your Windows application will integrate directly with your KDE desktop. Just\
    \ click and run your application exactly as you would in Windows.\n\nCrossOver\
    \ Office lets you use many Windows Web browser plug-ins directly with your Linux\
    \ browser. The most important one is probably the one needed to play Windows Media\
    \ Player movies and sound. You can play these formats through MPlayer (with the\
    \ addition of the **w32codecs** you can download and install through KPackage\
    \ with a few simple clicks) but may not necessarily be legal in the United States\
    \ due to software patent and copyright laws, whereas CrossOver Office is entirely\
    \ legal anywhere in the world.\n\nCrossOver Office officially supported these\
    \ Windows programs in July 2004, with more constantly being added to the list:\n\
    \n+   * Microsoft Office XP, 2000 and 97\n+   \t* Microsoft Word\n+   \t* Microsoft\
    \ Excel\n+   \t* Microsoft PowerPoint\n+   \t* Microsoft Outlook\n+   \t* Microsoft\
    \ Internet Explorer\n+   * Microsoft Access\n+   * Microsoft Project"
  - '[PAGE 210]


    +   - Adobe Photoshop

    +   - Microsoft Visio

    +   - Lotus Notes 5.0 and 6.5.1

    +   - Quicken

    +   - Various Web browser plug-ins

    +   - QuickTime

    +   - Shockwave Director

    +   - Windows Media Player 6.4


    There are two versions of CrossOver Office available: one for home use on a single
    computer, and one that’s designed for professional installations on multiple computers.
    You can purchase a copy of either one through MEPIS.org or directly from CodeWeavers.com.


