    ## find

    `Find` is one of the most sophisticated and complex commands available to you.
    What it actually does—find files that match its search parameters—is simple. The
    devil is in the parameters. We’ll limit our discussion here to quick and easy
    searches.


    The format is as follows:


    ```

    [username]$find searchpath search-parameters

    ```


    The `searchpath` argument defines the scope of the search. If you only want to
    look in your current directory and all the directories beneath it, you would use
    “.” as the `searchpath`, like this:


    ```

    [username]$find . search-parameters

    ```


    If you wanted to look everywhere, you would use this:


    ```

    [username]$find / search-parameters

    ```


    Let’s say you want to find a file called `personal.data`, and you are not sure
    where it is. To search the entire system, you would use:


    ```

    [username]$find / -name personal-data

    ```


    Note that the search-parameter option used is “-name”. Any files matching that
    name (personal-data.xml, personal-data.txt, etc) will be listed.


