    # **Point & Click Linux!**


    Beyond that, don''t forget, there are another 10,000+ Debian packages waiting
    for you—a list that would occupy nearly 1,000 pages in a book like this one. Some
    of your options include:


    +   * **Abivord**—Lightweight, flexible word processor that can read most Microsoft
