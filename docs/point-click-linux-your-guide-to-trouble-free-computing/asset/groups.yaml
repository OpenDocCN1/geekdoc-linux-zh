    MEPIS Linux 包含主流家庭和小型办公打印机的驱动程序。要设置您的打印机，请点击面板上的“K-Gear”图标，选择“Print System”，然后选择“Add
    Printer”。这将调出“Add Printer Wizard”（添加打印机向导）。


    ![](img/01efe5dd076565746bf3678068ba155c_32_1.png)


    ### 指点与点击 Linux！


    如果您现在已经解决了 Internet 连接问题，并且想要阅读有关 KDE 打印系统的开发和功能的信息，请点击带下划线的文字“The KDE printing
    team”（KDE 打印团队），http://printing.kde.org 网站将会打开。但这并不是必需的。我们现在真正需要做的是点击“Next”（下一步）。


    ![](img/01efe5dd076565746bf3678068ba155c_33_0.png)


    对于这个基础教程，我们假设您的打印机通过并行端口、串行端口或 USB 端口直接连接到您的计算机，因此我们将选择“Local printer”（本地打印机），然后点击“Next”（下一步）。


    （有关如何使用连接到网络上另一台计算机的打印机的更多信息，请点击“Help”（帮助）按钮调出 *The KDE Print Handbook*（KDE 打印手册）的副本，或访问
