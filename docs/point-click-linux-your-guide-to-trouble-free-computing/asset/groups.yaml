    # 第 21 章


    # Digikam——导入和组织数字照片


    Digikam 是一款简单的数字照片管理应用程序。从相机导入照片后，这些照片可以放置到相册中，并自动按时间顺序排序。易用的界面允许您将相机连接到您的电脑，只需几秒钟即可将图像传输到计算机，然后——根据您的指令——清除相机内存。


    ## Digikam 设置


    启动 Digikam 时看到的第一个界面会询问您希望在哪里存储照片。SimplyMEPIS 已经有一个“Pictures”文件夹，因此除非您想创建一个不同名称的文件夹，否则将照片放在那里是合乎逻辑的。（由于您以后可以轻松地使用
    KDE 文件管理器在文件夹之间移动照片，所以我们只将它们放在“Pictures”中以进行演示。）


    接下来——这纯粹是可选的——我们可以选择缩略图（即显示在图库页面上的照片微型“预览”版本）的大小，同时我们有机会通过从内置列表中选择一项或多项，或点击“Add”来创建一个您命名的文件夹，从而创建“相册集合类型”。


    ![](img/01efe5dd076565746bf3678068ba155c_169_0.png)


    ## 选择相机


    下一步是连接数码相机并设置 Digikam 以与其协同工作。要从我们刚刚设置相册的窗口进入相机设置工具，请点击顶部的“Cameras”标签。我们还需要打开相机并将其连接到计算机，通常是通过
    USB 端口。现在点击“Auto-Detect”。连接的相机会自动添加到我们的相机清单中，无需费力寻找驱动光盘或处理那些麻烦事。如果您有两台数码相机，连接第二台，再次点击“Auto-Detect”，它也会被添加到列表中。如果您有三台、四台或八台相机，请继续操作即可。


    ![](img/01efe5dd076565746bf3678068ba155c_170_0.png)


    ![](img/01efe5dd076565746bf3678068ba155c_170_1.png)


    ### 别忘了正确设置您的相机


    我们在此演示中使用的尼康 Coolpix 4300 拥有多种图像传输模式。Digikam（以及大多数其他 PC 相机程序）使用的是名为“PTP”（Picture
    Transfer Protocol，图像传输协议）的模式，如果您的相机未设置为使用正确的协议，您将无法传输图片。如果您在上传照片时遇到问题，首先应检查的是相机设置，而不是计算机设置。


    ## 下载图片


    我们通过在主 Digikam 程序窗口的顶部菜单栏中选择“Cameras”，然后使用下拉菜单选择当前连接到计算机的相机来下载图片。


    这让我们能够看到相机内存中所有图片的缩略图视图。


    ![](img/01efe5dd076565746bf3678068ba155c_171_0.png)


    我们可以点击任何一张缩略图以全尺寸查看。


    ![](img/01efe5dd076565746bf3678068ba155c_171_1.png)


    好的，这张照片看起来不错。事实上，所有照片看起来都足够好值得保留，因此我们将返回那个像小胶片条一样的缩略图查看窗口，并点击从左数第三个图标（当我们把光标悬停在它上面时，会弹出一个小框显示“download”），以将相机内存中的所有四张图片下载到我们的计算机。


    ![](img/01efe5dd076565746bf3678068ba155c_171_2.png)


    我们设置了一个名为“More Pictures”的图库，因此这些照片将存放在那里。如果我们拥有多个图库，我们会通过窗口底部的“Download To Album:”行做出选择，或使用“Add
    Gallery”按钮创建一个新的图库。


    ![](img/01efe5dd076565746bf3678068ba155c_172_0.png)


    现在，如果我们返回主 Digikam 程序窗口并点击相册名称，下载的图片就会显示在我们面前。


    ![](img/01efe5dd076565746bf3678068ba155c_172_1.png)


    我们可以使用常见的 KDE“拖放”操作将图片从一个相册移动到另一个，或在原始图库内重新排序。我们可以点击图片以全尺寸查看，使用图标进行“放大”和“缩小”，并且在这两个放大镜“缩放”图标右侧有一个图标，点击它可以将
    Digikam 窗口扩展以占据整个屏幕——在全屏模式下再次点击可将 Digikam 窗口缩小回正常大小。


    ![](img/01efe5dd076565746bf3678068ba155c_172_2.png)


    ![](img/01efe5dd076565746bf3678068ba155c_172_3.png)


    ## 使用 Digikam 修改照片


    双击 Digikam 图库中的图片，它将以全尺寸显示在新屏幕上。


    现在我们可以对其进行一些简单的修改，方法是右键点击图片上的任何位置，或使用“full screen”图标右侧顶部菜单中的图标。


    ![](img/01efe5dd076565746bf3678068ba155c_173_0.png)


    从左到右，这些图标允许您：


    - 更改照片的对比度、颜色和伽马值（亮度）

    - 将其旋转 90、180 或 270 度

    - 裁剪它以去除不需要的部分

    - 在您进行修改后保存

    - 如果您决定不喜欢修改结果，撤销更改


    照例，将光标悬停在这些图标上会弹出每个图标的文本框，告诉您它的功能。


    这里是我们之前在“全尺寸图片”示例（上方）中使用的照片，在裁剪以仅显示我们决定最重要的部分后的样子：


    ![](img/01efe5dd076565746bf3678068ba155c_173_1.png)


    ## 在哪里获取 Digikam 帮助


    当 Digikam 被选入 *SimplyMEPIS* 时，它是一款新的程序，仍处于测试阶段但功能完整。如果您使用本书最后一页提供的免费 MEPIS 订阅服务更新
    *SimplyMEPIS* 安装，您将获得一个更新的、更稳定的 Digikam 版本。您可以在 `digikam.sourceforge.net` 上跟踪
    Digikam 更新并查找最新的 Digikam 文档——您会发现每个 Digikam 界面顶部的“Help”按钮都会打开一本完整且易读的 Digikam
    手册。


    # 第 22 章


    # 游戏！——SimplyMEPIS CD 中包含的娱乐项目


    MEPIS Linux 并不全是工作。它内置了若干游戏和玩具，可以帮助您理清头脑，以便更认真地投入工作。您稍后可以下载更多 Linux 游戏，但 CD 上已有足够多的游戏让您开始——数量之多，我们不会在此详细介绍所有游戏，而是专注于其中最受欢迎的几个。


    ![](img/01efe5dd076565746bf3678068ba155c_176_0.png)


    ## 点击并游玩 Linux！


    运行这些游戏无需任何设置。只要从 *SimplyMEPIS* CD 启动计算机，您即可开始游玩。不过有一点警告：本书作者以及 MEPIS、Debian、KDE、各个游戏以及
    Linux 本身的创建者*不*对因过度使用令人上瘾的游戏和其他玩具而造成的生产力时间（或宝贵的 Linux 学习时间）损失负责……


    ### 纸牌游戏


    #### Patience (Solitaire)


    这是基本的纸牌游戏。通过点击“K-Gear”图标，选择“*Games*”，然后选择“*Card Games*”，再选择“*Patience*”，即可到达该游戏。


    现在您可以想玩多久就玩多久。或者您可以花几分钟时间通过点击“*Settings*”然后选择“*Switch Cards*”来自定义纸牌的外观。从“*Settings*”中，您还会看到一个“*Game
    Type*”选项，提供 18 种不同的单人耐心型纸牌游戏。如果您遇到不熟悉但仍想尝试的游戏，顶部菜单选项中的“*Game*”有一个“*Demo*”功能，点击即可查看游戏玩法。在学习新游戏时，您可以点击顶部的魔杖图标以获取一两个提示。


    ![](img/01efe5dd076565746bf3678068ba155c_177_0.png)


    如果这些帮助还不够，您可以点击“*Help*”查看每种“*Patience*”游戏的规则。


    ![](img/01efe5dd076565746bf3678068ba155c_177_1.png)


    #### K Poker


    这是五张抽换扑克。


    “Settings”提供几个选项，包括纸牌正面和背面设计以及其他选项。“Game”将您带到三个选项。如果您不想玩的时候被老板抓到，您可以选择“Quit”或“Save”（保存此游戏）。或者您可以选择“New
    Game”，甚至可以将其变成双人游戏，让计算机坐在虚拟扑克桌的另一侧。


    ![](img/01efe5dd076565746bf3678068ba155c_178_0.png)


    如果您觉得与“Computer 1”对战不如与“Cochise Charlie”或“Bisbee Bill”对战那样刺激，请随意更改。如果您愿意，还可以更改您的名字。如果您想以高于（或低于）默认
    100 美元的赌注进行游戏，可以调整大家带到桌上的金额。但这基本上就是 K Poker 中您可以做的所有更改。


    ![](img/01efe5dd076565746bf3678068ba155c_178_1.png)


    ### 街机游戏


    #### Frozen Bubble


    Frozen Bubble 是一款外观简单的娱乐游戏，配有滑稽的街机游戏背景音乐，但为其撰写一章书可能需要数小时的调研。这种调研可能看起来像是作者只是在胡闹和游戏，但这是一种错觉。撰写像《点击并游玩
