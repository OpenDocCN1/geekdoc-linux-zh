    # Point & Click Linux!


    (The icons currently visible here are for programs this book’s author and the
    MEPIS developers believe most people are most likely to use. Later, we’ll show
    you how to delete their selections and add your own if you like. It’s easy to
    do.)


    ![](img/01efe5dd076565746bf3678068ba155c_41_0.png)


    To the right of the program icons you have your “Taskbar.” This shows what programs
    you currently have open. As you gain experience with Linux you’ll start to realize
    that you can open many programs at the same time instead of sticking to one or
    two. With a crowded desktop, the only way to keep track of your opened programs
    is the taskbar, and clicking on programs’ entries in the taskbar is the easiest
    way to switch from one to another.


    To the taskbar’s right are several cool little utilities, including sound control.
    Go ahead and click on them. See what they do.


    # Kongqueror— the KDE File Manager


    The window you saw when we clicked on the CD icon in the window that opened wasn’t
    from a special CD-playing program, but part of the Kongqueror file manager, which
    we use to find, save, and move files of all kinds. In Linux (and KDE) everything
    is a file. You can have picture files, music files, text files, program files,
    even nail files—or at least files you name “nail” if you were writing a series
    of research


    ![](img/01efe5dd076565746bf3678068ba155c_41_1.png)


    papers about carpentry through the ages, or you’re a cosmetologist who takes pictures
