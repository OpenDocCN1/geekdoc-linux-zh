    ## Chapter 16


    ## CheckBook Tracker—Simple Bookkeeping with Linux


    CheckBook Tracker is a checkbook-based program suitable for home and small office
    use. Other, more advanced, accounting programs are available for Linux, including
    the excellent GnuCash system for classic double-entry bookkeeping, which you may
    decide to download and install once you get a little more comfortable with Linux.
    We''re covering CheckBook Tracker for the *SimplyMEPIS* CD because it is easy
    to understand, imports the .qif files most Windows accounting programs use, and
    it works nicely with the *Open Financial Exchange* (OFX) file format used by most
    major banks'' online banking systems.


    ### Getting Started


    When you open CheckBook Tracker (CBT), your first response might be, “Huh? Did
    it load correctly? There’s nothing here.”


    Don’t worry. It loaded correctly. Nothing appears because there’s nothing there
    yet. Step one is to click on “File” and create a file of some sort so there is
    something to work on.


    ![](img/01efe5dd076565746bf3678068ba155c_137_0.png)


    This gives us the same “file” window we’ve seen before, with the option of choosing
    in which folder we want to house our new file, and the space to type in the name
    of our new file. For this demo, we’re putting the new file in our “home” directory,
    although it might be smarter to create a “finances” directory for neatness. For
    this demo we’re calling our new (demo) file “home” because it’s going to track
    home, not business, finances.


    ![](img/01efe5dd076565746bf3678068ba155c_137_1.png)


    Now we have something to work with. Our first step is to enter a starting balance.
    For this demo, we entered $0.00. Now we’ll make a deposit by clicking on the “Deposit”
    tab and choosing “New.” We fill in the information requested, then click “OK”
    to enter it.


    ![](img/01efe5dd076565746bf3678068ba155c_138_0.png)


    We now show $812.00. Let’s spend some of it, because that’s what money is for.


    ![](img/01efe5dd076565746bf3678068ba155c_138_1.png)


    ### Point & Click Linux!


    Both the “Deposit” and “Withdrawal” screens have long drop-down lists of categories
    from which money can come and to which it can go. If you need a category that’s
    not already in the list, type the name you want it to have instead of using one
    of the existing ones and it will automatically be added to the list when you save
    your entry. In this example, we added the “West Wight Potter Book” category because
    we are going to write a book about our West Wight Potter, a small sailboat we
    own. Because we’re writing that book, all our boat expenses are tax-deductible,
    so we note that in the “Memo” space.


    ![](img/01efe5dd076565746bf3678068ba155c_139_0.png)


    ### Downloading Files from Your Bank


    This book’s author downloads checking account activity monthly using Bank of America’s
    “WEB Connect for Quicken 2001 and above” option, then opens CheckBook Tracker
    and imports those files. Your bank may offer different download options, and you
    may choose to download your bank information and reconcile your account more often
    than once a month. Once every few months might be sufficient if you don’t have
    a lot of banking activity. This is a case where you should experiment and decide
    what best suits your needs instead of being locked into someone else’s preferences.
    The not-so-old saying, “You are unique, just like everyone else,” applies here.
    There is no one-size-fits-all set of financial solutions. CheckBook Tracker is
    flexible enough and simple enough to set up and change that you can easily try
    different options until you have things the way you like them. This only takes
    a few minutes, and you only need to do it once.


    ### Visual Reports


    This is the fun part—unless your finances are in bad shape and you don''t really
    want to see how you''re doing in an easy-to-grasp visual format. Here are two
    popular CheckBook Tracker report styles:


    Expenses by category:


    ![](img/01efe5dd076565746bf3678068ba155c_140_0.png)


    Balance History:


    ![](img/01efe5dd076565746bf3678068ba155c_140_1.png)


    ### Point & Click Linux!


    ### Printing Checks and Other Settings


    ![](img/01efe5dd076565746bf3678068ba155c_141_0.png)


    For those who don''t yet do their bill-paying online, CheckBook Tracker will print
    checks based on standard "computer print" check forms available from your bank,
    office supply stores, or the "home office" sections of most discount stores.


    To set up a printable check, go to the top of the CheckBook Tracker window, select
    "Transaction," then "New Print Check." Fill in the appropriate information (you
    can have check numbers increase automatically from where you last left off—or
