    \ want to uninstall, is that we click “Uninstall” instead of “Install.”\n\nOn\
    \ the “Install” screen there is one additional step we want to take before we\
    \ do our uninstall, namely clicking the “Test (do not uninstall)” checkbox before\
    \ uninstalling. This will bring up a list of other programs that might be automatically\
    \ uninstalled too, and will warn us if they might affect other software we want\
    \ to keep. This kind of problem is very rare, and you can use your SimplyMEPIS\
    \ CD to repair anything you break accidentally, but better safe than sorry, right?\n\
    \nIf only the program you want to uninstall shows up, you are safe. Unselect “Test\
    \ (do not uninstall)” and go to it. The software package you no longer want will\
    \ quietly disappear without a bit of fuss.\n\n![](img/01efe5dd076565746bf3678068ba155c_206_0.png)\n\
    \nWhere to get software installation help:\n\nMepis.org/forum is “the” place to\
    \ go for answers to KPackage questions.\n\n## Other Software You Might Want to\
    \ Try\n\nYour SimplyMEPIS CD only contains a fraction of the software available\
    \ for Linux. The following is a partial list of additional software available\
    \ through the MEPIS servers or from MEPIS on CD. It’s only a tiny taste of what’s\
    \ there because the complete list would have taken 69 pages and constantly has\
    \ new software added to it, so you’d need to check the latest version at MEPIS.org\
    \ anyway.\n\n### Point & Click Linux!\n\nBeyond that, don't forget, there are\
    \ another 10,000+ Debian packages waiting for you—a list that would occupy nearly\
    \ 1,000 pages in a book like this one. Some of your options include:\n\n- *Abiword*—Lightweight,\
    \ flexible word processor that can read most Microsoft Word files\n- *Brahms*—Music\
    \ editor and MIDI sequencer\n- *Cinepaint*—Motion picture image retouching tool\n\
    - *Emacs20*—GNU Emacs editor\n- *Everybuddy*—All-in-one instant messaging client\n\
    - *Evolution*—Groupware suite that effectively replaces Microsoft Outlook (minus\
    \ the viruses and worms) and can, with the addition of a free connector utility,\
    \ work with Microsoft Exchange servers\n- *FestVall*—Multi-lingual speech synthesizer\
    \ system; makes your typed words talk\n- *Flightgear*—Flight simulator program\
    \ based on sophisticated technology originally developed for the U.S. military\n\
    - *Freeciv-client-gtk*—Program needed to join the worldwide Freeciv online multiplayer\
    \ strategy game (*www.freeCiv.org*)\n- *Gatos*—All-in-Wonder TV capture software,\
    \ assuming you have an ATI All-in-Wonder card; software for the more common WinTV\
    \ and related TV cards is already installed on your system\n- *Gnome-desktop-environment*—MEPIS\
    \ uses the KDE Desktop, but the Gnome Desktop has many devotees; you may want\
    \ to try it one day\n- *Mozilla-Firefox*—Web browser based on Mozilla that almost\
    \ made it onto the *SimplyMEPIS* CD; by the time you read this, may be better\
    \ than the original Mozilla\n- *Snort*—Network intrusion detection tool that can\
    \ help you see if bad hackers are trying to get into your computer or network\n\
    \n### Just a Few Out of Thousands\n\nThis is just a tiny taste of what's available\
    \ to you beyond the *SimplyMEPIS* CD. There are endless programs for Linux that\
    \ you can download and install with a few clicks. One of your best sources for\
    \ information on them is *www.freshmeat.net*, a Web site that is widely recognized\
    \ as one of the Web's most comprehensive and up-to-date Linux software lists.\n\
    \n## Chapter 25\n\n# Cooperating with Windows\n\nThere's no denying it: We may\
    \ use Linux and like it, but there may be programs we need to use that are only\
    \ available (right now) for Windows, and we must often share computer networks\
    \ with people who run Windows. Luckily, there are ways we can use Windows software\
    \ in Linux—even run Windows inside Linux—and network with Windows computers.\n\
    \n## CrossOver Office\n\nCrossOver Office is software that runs many Windows applications\
    \ and plug-ins in Linux. It's a commercial program, but costs much less than a\
    \ standalone copy of Windows, and after you install it on your computer it only\
    \ takes a click or two to install a Windows program “inside” it.\n\n![](img/01efe5dd076565746bf3678068ba155c_209_0.png)\n\
    \nWhen installed, your Windows application will integrate directly with your KDE\
    \ desktop. Just click and run your application exactly as you would in Windows.\n\
    \nCrossOver Office lets you use many Windows Web browser plug-ins directly with\
    \ your Linux browser. The most important one is probably the one needed to play\
    \ Windows Media Player movies and sound. You can play these formats through MPlayer\
    \ (with the addition of the **w32codecs** you can download and install through\
    \ KPackage with a few simple clicks) but may not necessarily be legal in the United\
    \ States due to software patent and copyright laws, whereas CrossOver Office is\
    \ entirely legal anywhere in the world.\n\nCrossOver Office officially supported\
    \ these Windows programs in July 2004, with more constantly being added to the\
    \ list:\n\n- Microsoft Office XP, 2000 and 97\n  - Microsoft Word\n  - Microsoft\
    \ Excel\n  - Microsoft PowerPoint\n  - Microsoft Outlook\n  - Microsoft Internet\
    \ Explorer\n  - Microsoft Access\n  - Microsoft Project\n- Adobe Photoshop\n-\
    \ Microsoft Visio\n- Lotus Notes 5.0 and 6.5.1\n- Quicken\n- Various Web browser\
    \ plug-ins\n- QuickTime\n- Shockwave Director\n- Windows Media Player 6.4\n\n\
    There are two versions of CrossOver Office available: one for home use on a single\
    \ computer, and one that’s designed for professional installations on multiple\
    \ computers. You can purchase a copy of either one through MEPIS.org or directly\
    \ from CodeWeavers.com.\n\n![](img/01efe5dd076565746bf3678068ba155c_210_0.png)\n\
    \n## NeTraverse Win4Lin\n\nWhile CrossOver Office runs some Windows applications\
    \ in Linux, Win4Lin actually runs Windows in Linux, which means virtually all\
    \ Windows applications work well. One big catch is that in order to use Win4Lin\
    \ you need to have a copy of Windows around that you can legally load on your\
    \ Linux computer. The other big Win4Lin catch is that as late as mid-2004 it would\
    \ still only work with Windows 95, 98, and ME, but you may want to check MEPIS.org\
    \ to see if this has changed since then. Last we heard while writing this book,\
    \ a new XP-enabled version of Win4Lin was scheduled for release by the end of\
    \ 2004.\n\n![](img/01efe5dd076565746bf3678068ba155c_211_0.png)\n\nThere are some\
    \ special Linux kernel modifications needed to run Win4Lin, but they're already\
    \ built into MEPIS so installation is painless, and installing Windows programs\
    \ on Windows running on Win4Lin under Linux is faster than installing them in\
    \ a regular Windows computer because rebooting Windows in Win4Lin is much faster\
    \ than booting Windows all by itself.\n\n## Networking with Windows Machines Using\
    \ Samba\n\nBy Jem Matzan\n\nEven if we don't use any Windows programs ourselves,\
    \ we may still need to work with Windows computers on a home or office network.\
    \ We do this with a program called Samba that lets us read Windows files directly\
    \ from our Linux computer.\n\n## Samba: The Server Message Block Client\n\nIn\
    \ order for Linux to access a Windows network, it must use the SMB (Server Message\
    \ Block) network file-sharing protocol. SimplyMEPIS uses a program called Samba\
    \ to access Windows shares using that protocol.\n"
  mdcn: "\n## 获取正确的软件包\n\n在搜索 *Abiword* 时，我们也发现了一些相关的软件包。这些软件包要么是 *Abiword* 的插件（会随主程序自动安装），要么是一些专门的“开发”例程，仅对希望以某种方式修改\
    \ *Abiword* 的程序员和系统管理员有用，但它们本身并不是 *Abiword* 程序。请务必确保你搜索到的是“原版”软件包名称，而不是与之相关的其他包。养成在下载前查看右侧面板描述的习惯是个好主意，这样能确保你获得的正是你想要的，而不是那种让你惊呼“什么？！”的东西。\n\
    \n## 安装成功\n\n当我们点击那个“安装”按钮时，会出现“安装”窗口，它不仅显示我们要下载的程序，还显示了将随其自动安装的其他程序。我们现在只需在此屏幕上点击“安装”以确认我们确实想要安装该程序及其所有相关组件，然后坐享其成即可。\n\
    \n![](img/01efe5dd076565746bf3678068ba155c_205_0.png)\n\n![](img/01efe5dd076565746bf3678068ba155c_205_1.png)\n\
    \n安装完成后，你将在安装窗口底部看到一条显示“RESULTS = 0”的消息。在此过程中，你可能会看到一些看似某些组件未正常工作的消息，但这通常是由众多\
    \ Debian 服务器中有一两个运行异常或正在维护所致，你可以安全地忽略这些消息。\n\n安装成功的真正证明是你的新程序被添加到了菜单中，我们可以看到 *Abiword*\
    \ 现在已经列在“编辑器”中，位置正确。\n\n## 卸载软件\n\n这甚至比安装更容易。你可以使用寻找要安装程序时所用的同一搜索工具来查找想要卸载的程序，并且可以通过仅搜索“已安装”的软件来缩短搜索时间。\n\
    \n在找到想要卸载的软件包后，主 KPackage 界面上的唯一区别是，我们要点击“卸载”而不是“安装”。\n\n在“安装”界面上，在进行卸载之前，我们想要执行一个额外的步骤，即点击“测试（不卸载）”复选框。这将列出其他可能也会被自动卸载的程序，并警告我们它们是否可能影响我们希望保留的其他软件。这类问题非常罕见，你可以使用\
    \ SimplyMEPIS CD 来修复任何因操作失误而损坏的内容，但小心总比疏忽好，对吧？\n\n如果只显示你希望卸载的那个程序，那么你是安全的。取消选中“测试（不卸载）”并继续操作。不再需要的软件包将悄无声息地消失，不会引起任何麻烦。\n\
    \n![](img/01efe5dd076565746bf3678068ba155c_206_0.png)\n\n哪里可以获取软件安装帮助：\n\nMepis.org/forum\
    \ 是解答 KPackage 相关问题的权威之地。\n\n## 其他你可能想尝试的软件\n\n你的 SimplyMEPIS CD 仅包含 Linux 可用软件的一小部分。以下是通过\
    \ MEPIS 服务器或 MEPIS CD 可用的部分附加软件列表。由于完整列表将长达 69 页且不断更新，你仍需在 MEPIS.org 上查看最新版本，因此这只是一点小小的尝鲜。\n\
    \n### 点点 Linux！\n\n除此之外，别忘了，还有 10,000 多个 Debian 软件包在等着你——这一列表在这类书籍中将占据近 1,000\
    \ 页。你的部分选项包括：\n\n- *Abiword*—轻量级、灵活的文字处理程序，可读取大多数 Microsoft Word 文件\n- *Brahms*—音乐编辑器和\
    \ MIDI 音序器\n- *Cinepaint*—电影图像修饰工具\n- *Emacs20*—GNU Emacs 编辑器\n- *Everybuddy*—全能即时通讯客户端\n\
    - *Evolution*—有效地替代 Microsoft Outlook 的组件事件套件（去除了病毒和蠕虫），并且通过添加免费的连接器工具，可与 Microsoft\
    \ Exchange 服务器协作\n- *FestVall*—多语言语音合成系统；让你的打字文字“说话”\n- *Flightgear*—基于最初为美国军方开发的先进技术的飞行模拟器程序\n\
    - *Freeciv-client-gtk*—加入全球 Freeciv 在线多人策略游戏所需的程序（*www.freeCiv.org*）\n- *Gatos*—All-in-Wonder\
    \ TV 捕捉软件（假设你有 ATI All-in-Wonder 卡）；针对更常见的 WinTV 及相关电视卡的软件已安装在你的系统中\n- *Gnome-desktop-environment*—MEPIS\
    \ 使用 KDE 桌面，但 Gnome 桌面也有许多拥趸；你也许想在某一天尝试一下\n- *Mozilla-Firefox*—基于 Mozilla 的 Web\
    \ 浏览器，差点就被纳入 *SimplyMEPIS* CD；等到你读到这本书时，它可能比原版 Mozilla 更好\n- *Snort*—网络入侵检测工具，可帮助你查看是否有黑客正试图进入你的计算机或网络\n\
    \n### 千中取几\n\n这只是 *SimplyMEPIS* CD 之外可获取内容的一点点尝鲜。对于 Linux，有无尽的程序可通过几次点击进行下载和安装。获取这些信息的最佳来源之一是\
    \ *www.freshmeat.net*，这是一个被广泛认可为 Web 上最全面且最新的 Linux 软件列表之一的网站。\n\n## 第 25 章\n\n\
    # 与 Windows 协作\n\n不可否认：我们可能使用并喜欢 Linux，但可能存在我们需要使用的、目前仅在 Windows 上可用的程序，而且我们经常不得不与运行\
    \ Windows 的人共享计算机网络。幸运的是，我们在 Linux 中使用 Windows 软件的方法有很多——甚至可以在 Linux 内部运行 Windows——并可与\
    \ Windows 计算机进行网络互联。\n\n## CrossOver Office\n\nCrossOver Office 是在 Linux 中运行许多\
    \ Windows 应用程序和插件的软件。它是一个商业程序，但成本比单独一份 Windows 副本低得多，在电脑上安装后，只需点击一两次即可在内部安装 Windows\
    \ 程序。\n\n![](img/01efe5dd076565746bf3678068ba155c_209_0.png)\n\n安装后，你的 Windows\
    \ 应用程序将直接融入你的 KDE 桌面。只需像在 Windows 中那样点击并运行你的应用程序即可。\n\nCrossOver Office 让你直接在\
    \ Linux 浏览器中使用许多 Windows Web 浏览器插件。最重要的可能是播放 Windows 媒体播放器电影和声音所需的插件。你可以通过 MPlayer\
    \ 播放这些格式（通过 KPackage 用几次简单的点击下载并安装 **w32codecs**），但由于美国的软件专利和版权法，这可能并不合法，而 CrossOver\
    \ Office 在全球任何地方都是完全合法的。\n\nCrossOver Office 在 2004 年 7 月官方支持了这些 Windows 程序，并且列表上不断增加：\n\
    \n- Microsoft Office XP、2000 和 97\n  - Microsoft Word\n  - Microsoft Excel\n \
    \ - Microsoft PowerPoint\n  - Microsoft Outlook\n  - Microsoft Internet Explorer\n\
    \  - Microsoft Access\n  - Microsoft Project\n- Adobe Photoshop\n- Microsoft Visio\n\
    - Lotus Notes 5.0 和 6.5.1\n- Quicken\n- 各种 Web 浏览器插件\n- QuickTime\n- Shockwave\
    \ Director\n- Windows Media Player 6.4\n\nCrossOver Office 有两个版本可供购买：一个是用于单台计算机的家庭版，另一个是为多台计算机的专业安装设计的。你可以通过\
    \ MEPIS.org 或直接从 CodeWeavers.com 购买任一版本。\n\n![](img/01efe5dd076565746bf3678068ba155c_210_0.png)\n\
    \n## NeTraverse Win4Lin\n\n虽然 CrossOver Office 在 Linux 中运行某些 Windows 应用程序，但 Win4Lin\
    \ 实际上是在 Linux 中运行 Windows，这意味着几乎所有 Windows 应用程序都能良好工作。一个大陷阱是，为了使用 Win4Lin，你需要手头有一份可以合法加载到\
    \ Linux 计算机上的 Windows 副本。Win4Lin 的另一个大陷阱是，直到 2004 年中，它仍然只适用于 Windows 95、98 和 ME，但你最好去\
    \ MEPIS.org 查看一下此后情况是否有变化。在我们写这本书时最后一次听到的是，Win4Lin 的 XP 兼容新版本计划在 2004 年底前发布。\n\
    \n![](img/01efe5dd076565746bf3678068ba155c 211_0.png)\n\n运行 Win4Lin 需要一些特殊的 Linux\
    \ 内核修改，但它们已内置于 MEPIS 中，因此安装过程无痛感，而且在 Linux 下 Win4Lin 中运行的 Windows 上安装 Windows\
    \ 程序比在普通 Windows 计算机上安装更快，因为在 Win4Lin 中重启 Windows 比单独启动 Windows 快得多。\n\n## 使用\
    \ Samba 与 Windows 机器进行网络互联\n\n作者：Jem Matzan\n\n即使我们自己不使用任何 Windows 程序，我们可能仍需要在家中或办公室网络中与\
    \ Windows 计算机协作。我们通过一个名为 Samba 的程序来完成此任务，它允许我们直接从 Linux 计算机读取 Windows 文件。\n\n\
    ## Samba：服务器消息块客户端\n\n为了让 Linux 访问 Windows 网络，它必须使用 SMB（Server Message Block，服务器消息块）网络文件共享协议。SimplyMEPIS\
    \ 使用一个名为 Samba 的程序通过该协议访问 Windows 共享。\n\n"
