  - '[PAGE 253]


    # Joining or Starting a Linux Users Group (LUG)


    There are LUGs all over the world, with memberships as small as three or four
    and as large as three or four thousand.


    ![](img/01efe5dd076565746bf3678068ba155c_253_0.png)


    This book''s author belongs to the Suncoast Linux Users Group (SLUG), which is
    based in Tampa, Florida, and holds meetings in a number of towns outside of Tampa
    as well.


    SLUG has an active email list where you can ask and answer technical questions.
    SLUG members range from "I just installed Linux on this computer" to professional
    systems administrators and programmers, including more than a few who have advanced
    degrees in engineering, computer science, and other technical disciplines. And
    SLUG is not an extraordinary LUG in any way, but rather a very typical one, much
    like its counterparts everywhere from San Francisco to New Delhi.


    LUG meeting formats vary—sometimes there are formal presentations and sometimes
    there aren''t—but no one has ever stopped a member from bringing a troublesome
    PC to a meeting and asking others to help get it working right or for help getting
    a troublesome piece of specialized or experimental software installed on it. Your
    LUG is a great source of Linux help whether you''re a new user or you''re a computer-savvy
    meteloorologist who has been running Linux since 1994, and you''re building a
    2000-node supercomputing cluster so you can make accurate hurricane predictions
    by running real-time climate simulation programs that take millions of variables
    into account. Even if you only get to LUG meetings rarely (or not at all), LUG
    email lists are almost always great places to get fast, direct, one-on-one answers
    to Linux questions, and you don''t need to be in the same city or town as the
    nearest LUG to join its email list. There are typically no dues or other formal
    requirements for LUG membership. You just show up, either in person or at the
    email list, and there you are. You can find a rather good online list of LUGs
    at lwgww.counster.ii.org. As of July 2004, it showed 647 groups in 91 countries,
    with the number increasing every month. That page also contains links to several
    others that will teach you how to start your own LUG, something that takes organizational
    rather than technical skill.


    Perhaps, if you are an organizer-type person rather than a technically inclined
    one, starting a LUG will be your contribution to the Linux community. If you do,
    remember that Linux is supposed to be fun, so there should be a social component
    to your group that goes beyond technical training and support. Most Linux users
    are just like you: intelligent, aware people who have many interests beyond computing,
    even if some of them are a little shy when they''re not sitting in front of their
    keyboards. Get them together in a social situation—perhaps including wives or
    husbands, children or parents, and a few coworkers or cousins who tag along—and
    you can usually put together a pretty good picnic or other event.'
  - '[PAGE 254]


    This book''s author is a regular at the monthly SLUG “social meetings” typically
    held at the Cock and Bull Pub in Sarasota, Florida. In fact, much though he hates
    to admit it, he goes to more “social” LUG meetings than “real” ones, because many
    of the technical subjects discussed in the real meetings are over his head.


    # There’s Always More to Learn About Linux


    Even if you find yourself scratching your head a little at first or need to get
    a little help to make your first Linux installation run properly, before long
    you’ll find Linux so familiar that if you go back to whatever operating system
    you were using before you discovered Linux, you’ll get frustrated with its limitations.


    Take it from one who knows.


    Linux can be both frustrating and wonderful. The frustrating part is that solving
    some Linux problems can seem unbearably tedious the first time you tackle them.
    The wonderful thing is that you can *solve* almost any Linux problem, including
    problems that can’t possibly be solved in other operating systems because you
    aren’t allowed to tinker with their inner workings. Not long after you start using
    Linux you may find yourself saying, “if only I could do...” and asking questions
    on your LUG email list and doing Web searches until you find a way to do it either
    by clicking *here* and then clicking *there* or by making a command-line entry
    or two. You get all full of pride. You fixed something on your own you thought
    would be too hard for you to figure out. You are a Linux Wizard!


    Then you think of something else you’d like to do with Linux, perhaps something
    you never tried to do with your computer before, if you know you’re a Linux Wizard
    so you know you can figure it out—except this time maybe it’s not so easy, so
    you do more research and learn how to write a command-line script to accomplish
    your objective, possibly even learn a little Perl (or another scripting language)
    along the way.


    You are now in serious trouble.


    Now that you have learned a little about how your computer works, and how to *change*
    the way it works, there will be no stopping you. If you go to a LUG meeting and
    somebody says, “You can increase system performance by adding RAM,” you’ll want
    to take your computer apart and add more RAM (Random Access Memory) to it, even
    if you’re never looked inside it before and have no idea what RAM looks like or
    how to add it.'
  - "[PAGE 255]\n\nBecause you have now gotten the idea, through learning Linux, that\
    \ your computer is something you can figure out and work on yourself, instead\
    \ of saying “Oh, I don’t know much about computers,” you’ll ask questions and\
    \ prowl search engines, and learn what RAM is and how to add it to your computer.\
    \ And after you’ve conquered RAM, how about upgrading that video card? What about\
    \ optimizing your Linux kernel to gain just a tiny bit more performance?\n\nThis\
    \ can go on and on, until the day comes at work or school when someone else’s\
    \ computer isn’t working right, and you know exactly why—and you tell them. You\
    \ will be cast as the local computer expert forevermore, and if you’re not careful\
    \ you may drift into systems administration or programming instead of staying\
    \ a normal, happy person.\n\nNot that there’s anything wrong with that…\n\nRobin\
    \ “Roblimo” Miller  \nBradenton, Florida, 2004"
