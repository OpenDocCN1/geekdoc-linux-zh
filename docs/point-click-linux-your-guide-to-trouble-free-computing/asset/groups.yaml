    The built-in K3b “Help” file is surprisingly good. It contains most of the information
    you''ll ever need for daily K3b use. We suggest playing with a rewritable CD for
    your first experiments, because no matter how good your burning software may be
    (and K3b is very good indeed!) a single wrong move, especially when burning a
    bootable CD, can leave you with a useless plastic “coaster” instead of correctly
    stored data. Even though rewritable CDs cost more than “single write” recordable
    CDs, it is worth the few extra bucks to have some around for testing—and if you
    regularly back up your most important data on CD (as everyone should but few do),
    you can reuse a single rewritable CD over and over for your most current information
    instead of accumulating a stack of CDs with old data on them.


    ![](img/01efe5dd076565746bf3678068ba155c_160_0.png)


    ## K3b Information and Help


    - www.k3b.org

    - www.MEPIS.org/forum


    # The GIMP—A Full-featured Graphics Application


    If you''re coming from Windows you''re probably used to a decent low-end image
    manipulation program like Paint Shop Pro, CorelDRAW Essentials, or, if you''re
    lucky, a high-end graphics program like Adobe Photoshop. At their most basic level,
    these applications can digitize and modify photographs or create and edit drawings.
    At their most powerful, a trained, highly skilled, and experienced user can create
    amazing works of art with them. But as of this writing none of these programs
    is available for Linux.


    Enter the GNU Image Manipulation Program, or the GIMP for short. It’s a lightweight
    but powerful graphics program with an unfortunately awkward interface.


    ![](img/01efe5dd076565746bf3678068ba155c_163_0.png)


    ### Getting Started


    You’ll find the GIMP in the Graphics section of your KDE menu. Click on the K-Gear
    icon in the lower left corner of the screen, then Graphics, then the GIMP.


    The first thing you’ll see is an orange setup screen.


    ![](img/01efe5dd076565746bf3678068ba155c_163_1.png)


    This screen is simply a welcome message introducing you to the GIMP. You can read
    it if you like, but there isn’t any really valuable information there. Click the
    “Continue” button. The next screen asks you where you’d like to put the folder
    that will store your program settings and preferences; it’s best just to leave
    it at the default location, so click on “Continue.” Next, you’ll be shown an installation
    log—you can read it if you like, but it’s not necessary. Click “Continue” again
    and you’ll be brought to a screen labeled “Performance Tuning.”


    If you have a newer computer with a lot of memory (512MB or more) and you’ll be
    working with larger pictures, you may want to increase the tile cache from 64
    to 128. This will allow more memory for working with graphics files, but it will
    not affect your system when you’re not using the GIMP. Click “Continue” and you’ll
    find yourself at the Monitor Resolution screen. Leave this setting at the default;
    it will use the resolution for which your system is already set. Click “Continue”
    one last time and you’re finished—the program will now start normally.


    ![](img/01efe5dd076565746bf3678068ba155c_164_0.png)


    ## Using the GIMP


    When the program is completely loaded and started, a series of small windows appears
    on your screen, each containing different tools and functions related to the program.
    The topmost window will be the GIMP “Tip of the Day,” and it’ll tell you a different
    fact about the program every time you start. You can also scroll through the different
    tips by clicking on the “Next Tip” and “Previous Tip” buttons.


    ![](img/01efe5dd076565746bf3678068ba155c_164_1.png)


    ![](img/01efe5dd076565746bf3678068ba155c_165_0.png)


    The main GIMP window is labeled the GIMP and it contains the drawing and painting
    tools that you’re used to using in most graphics programs. If the meaning of an
    icon is not obvious, move your mouse over the tool icon and a text box will pop
    up to tell you what it does. The lower portion of the GIMP window is for specific
    tool options; click on a tool and the lower section changes to show you the ways
    you can change and modify that tool.


    The other window on the screen is titled “Layers, Channels, Paths,” and it is
    primarily for advanced users who deal with layered images. The bottom portion
    of this window has your brush sizes and shapes, which you’ll also have access
    to in the main GIMP window through a drop-down dialog box. You can safely close
    the “Layers, Channels, Paths” window if you aren’t going to use any of its functions,
    and if you need any of them later you can bring this window back by choosing “Dialogs”
    from the File menu, then clicking on “Create New Dock,” then selecting “Layers,
    Channels, Paths.” If you do this, you’ll notice that your brush selection is gone
    and the window is smaller than before. If you’d like to get the panel to look
    exactly the way it was before, it’ll require a little customization work. That’s
    no big deal; you can customize almost everything about the GIMP by choosing “File”
    and selecting “Preferences” from the drop-down menu.


    If you move the mouse around the GIMP window you’ll notice that it turns into
    a hand cursor when you move over the center of the menu where the arrow and X
    icons are. By clicking and dragging this area of the window, you can drag it into
    its own window or to another part of the main GIMP window. You can also create
    your own custom window by exploring the Dialogs portion of the File menu.


    If you get to a point where you’ve messed up your GIMP windows and can’t get them
    back, exit the program and delete the .gimp2 entry in your user’s home directory
    by using the Konqueror file manager. It’s hidden, so you’ll have to select the
    Show Hidden Files option in your view menu.


    ![](img/01efe5dd076565746bf3678068ba155c_165_1.png)


    After the file is deleted, start up the GIMP again and you''ll be back to default
    settings.


    ![](img/01efe5dd076565746bf3678068ba155c_166_0.png)


    ### Working with Pictures


    To retrieve a pre-existing image file, click on File, then Open, then navigate
    to the file and click on OK. Another window will open up with the picture in the
    middle, rulers at the sides, and a menu at the top.


    To change the whole picture''s properties, such as size, resolution, color depth,
    or to add special effects or filters, use the menu in the picture window. The
    main GIMP window''s menu is only useful for program functions not related to the
    picture you''re currently working on. You can, of course, use all the available
    tools in the main GIMP window to alter or manipulate the picture or pictures you''re
    working on.


    ![](img/01efe5dd076565746bf3678068ba155c_166_1.png)


    ## Scanning and Editing Photos


    The GIMP can''t scan pictures directly, but it does have the ability to use an
    external extension to communicate with your scanner. *Simple/MEPIS* comes with
    both Kooka and xscanimage. Kooka is generally used as a standalone application,
    but you can call xscanimage from within the GIMP by opening its File menu, clicking
    on Acquire, then on xscanimage. The scanning program will open, and you can select
    your quality and size settings and scan from there.


    If you''re interested in screen shots, there is another option in the Acquire
    submenu specifically for that purpose.


    Editing photos is fairly simple; you can draw on a photo by selecting the drawing
    and painting tools in the main GIMP window. You can also add text, crop, or skew
    and rotate the image, all through the same set of tools. If you want to add special
    effects, explore the Filters and Script-Fu menus in the image window.


    ![](img/01efe5dd076565746bf3678068ba155c_167_0.png)


    All functions relating directly to the image (including saving and exporting the
    image) are done through the image window''s menus. You can either select them
    at the top of the window as usual, or you can right-click the image and access
    all the same menus in a popup dialog box.


    ## Where to Get GIMP Help


    The best form of help you can get for the GIMP is online. You can find tutorials
    to help you learn how to perform specific tasks or to simply learn how to use
    the GIMP more effectively at this address: `http://www.gimp.org/tutorials/`


    The GIMP mailing lists can provide help for more specific problems with the program
    or its use, but please first read the section on list etiquette: `http://www.gimp.org/mail_lists.html`


    Lastly, documentation for the GIMP can be found at this address:

    `http://wiki.gimp.org/gimp/GimpDocs`

