    # ## Shutting Down


    This is the last function we need to master, Hard? Not exactly. Here''s how you
    do it:


    +   1.  Click on the K-Gear logo at the lower left corner of your screen.

    +   2.  Click on \"Logout\"—the bottom menu choice.


    You have three choices. Their purposes are obvious. Pick the one you prefer, and
    click it. That''s the end of this Linux session, hopefully the first of many you''ll
    run in coming years.


    ![](img/01efe5dd076565746bf3678068ba155c_36_0.png)


    # ## Getting Help


    If you have any trouble getting MEPIS to boot correctly or with the rest of your
    initial setup, get online either with MEPIS or your existing operating system
    and go to www.mepis.org. You''ll find solutions to most common setup problems,
    including any that have been detected and solved in the months between the day
    this book was written and the day you first picked it up.


    And if you don''t see an answer on the MEPIS site itself, go to www.mepis.org/Forum,
    where MEPIS developers and experienced users can give you one-on-one help. (There
    is no charge to use the MEPIS forums.)'
