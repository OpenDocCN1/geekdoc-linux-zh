  - '[PAGE 23]


    # Point & Click Linux!


    While this menu gives you a number of choices, in most cases you can just wait
    a few seconds and let the default selection run automatically. If the default
    selection does not start correctly—that is, if you see nothing but a blank screen—you
    will need to experiment with the available choices until you find the one that
    best suits your computer. (Pay particular attention to the “Monitor Resolution”
    choice. Each make of monitor has a maximum resolution and will not display beyond
    it.)


    ![](img/01efe5dd076565746bf3678068ba155c_23_0.png)


    We also advise trying several different kernel choices. The Linux kernel is the
    “heart” of your operating system, and some versions work noticeably faster than
    others on some computers. It only takes a few seconds to try each kernel selection.
    You don’t need to go through a long shutdown procedure for each test; just shut
    your computer off with the power button, turn it back on, and when the menu comes
    up, make a different menu choice each time.


    Another pitfall you may encounter is a total refusal by your computer to read
    the CD, in which case you will not see the menu screen shown above until you change
    your computer’s BIOS settings.


    # Making Your Computer Boot from a CD


    If your computer starts from the CD and runs *SimplyMEPIS* the first time you
    try, you don’t need to read this section.


    But some users have computers that refuse to boot from their CD drives instead
    of their hard drives. This is not a Linux thing. Many PCs come from the factory
    with their BIOS (the Basic Input/Output System that comes with the motherboard)
    set to boot only from the hard drive. Changing the boot order is not hard—when
    you know how to do it—and if you don’t already know how to do this, it’s a great
    trick to master not only for Linux use but also if you ever need to install a
    new version of Windows or reinstall your old one as part of normal maintenance.'
  - "[PAGE 24]\n\n# **2: Running the SimplyMEPIS CD**\n\nNot all computers use the\
    \ same commands to get you into the BIOS setup (or just “Setup” as some call it\
    \ on their boot screens). If you’re lucky, when your computer first starts it\
    \ will tell you what to do as it boots up, with a little note like “Setup: F1”\
    \ that probably scrolls by before you can hit the F1 key. No problem; shut the\
    \ computer off with the switch (you don’t need to use the operating system shutdown\
    \ procedure because the operating system hasn’t started yet), and have your finger\
    \ ready this time. But before you begin messing with your BIOS, please read this\
    \ bold-face note:\n\n> **WARNING:**\n> \n> Be very, very careful when you change\
    \ anything in your BIOS. Make exact notes of the original settings before you\
    \ change anything at all, and read all the little “how to change/how to save”\
    \ text at the bottom of the screen very carefully. If you mess up your BIOS your\
    \ computer may not boot any OS, and if you set something you shouldn’t and it\
    \ still boots, vital functions may not work correctly. Be very, very careful when\
    \ you change anything in your BIOS.\n\nThat said, when you get into your BIOS\
    \ setup you’ll probably see a screen that has words like “BOOT PRIORITY” or “BOOT\
    \ ORDER” somewhere on it. This is what you need to change. (Your mouse may not\
    \ work at this point. If it doesn’t, you will need to use your Tab or up and down\
    \ arrow keys to move between lines.)\n\nWhen you get your cursor on the “BOOT”\
    \ line, you can usually change the boot priority by hitting the space bar. If\
    \ this doesn’t work, try other keys. You can’t hurt anything at this point. It’s\
    \ only when you save changes that you can damage your system, and every common\
    \ BIOS has an option for “Exit without saving changes” you can use if you’re not\
    \ absolutely, positively sure you did the right thing.\n\nObviously, you want\
    \ “CD-ROM” to be the first boot choice if you’re going to be booting from a CD-ROM.\
    \ After you do your new installation (or need to return temporarily to the operating\
    \ system you already have installed) you can change the boot priority back to\
    \ the way it was before your experiment.\n\n# **Think of BIOS Access as a Puzzle\
    \ To Be Figured Out**\n\nOne HP desktop we use for a test computer doesn’t just\
    \ give you a single BIOS screen. First, you hit F10 to access the BIOS setup program,\
    \ then you choose “Advanced CMOS Setup” from a menu to find your boot priority.\
    \ The instructions are all there, right on the screen, but you need to read them\
    \ instead of just clicking keys and hoping."
