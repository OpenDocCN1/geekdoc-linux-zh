  - '[PAGE 212]


    Unfortunately, the process for using Samba to get Windows to access Linux network
    shares is much more complicated to set up and configure in both Linux and Windows,
    so in this chapter we''re only going to deal with accessing Windows shares. For
    this example we''re going to assume you have a Windows machine that has already
    been set up for a work-group-based network.


    # The smb4k Utility


    In the lower right-hand corner of your screen you''ll notice a green and blue
    icon. That''s your Samba client already running, scanning for Windows networks
    to connect to. Left-click on the icon to bring up the Share Browser.


    ![](img/01efe5dd076565746bf3678068ba155c_212_0.png)


    As you can see, all your Windows workgroups are listed in the left-hand portion
    of the window. In this example the name of our workgroup is, appropriately, **workgroup**.
    This is the default name for most versions of Windows; Windows XP''s default workgroup
    name is **mshome**. Aside from defaults, you may have chosen your own workgroup
    name when you set up your network, or you might have multiple workgroups for different
    purposes throughout your home or office.


    ![](img/01efe5dd076565746bf3678068ba155c_212_1.png)'
  - '[PAGE 213]


    Left-click on your workgroup entry to list all the computers currently connected
    to it. In our example, we only have one computer on the workgroup, and its name
    is amd64. Click on the computer that you would like to access; this brings up
    the login window.


    ![](img/01efe5dd076565746bf3678068ba155c_213_0.png)


    The login window wants a username and password from you. Enter the name and password
    of a Windows user on the computer you''re logging into. So if your Windows user''s
    name is *dirkengty* and your password is *iluvdadams*, enter that information
    in the fields provided. You can always log in as Administrator, but that isn''t
    advised for normal work because the Administrator user has ultimate power on the
    Windows system, and this poses a security risk. Remember not to use your Linux
    username and password here; you''re logging into a Windows machine remotely, and
    it doesn''t know or care about Linux users.


    ![](img/01efe5dd076565746bf3678068ba155c_213_1.png)


    When you''re logged into the amd64 machine, you''ll be able to see all of its
    shared directories. In our example you have two shared directories: the root directory
    and the My Documents folder. When you click on one of these listings, Samba will
    mount that share in a directory called Smb4k in your user''s home directory. It''ll
    also show up in the upper right portion of the Smb4k window. You can mount as
    many shares as you like.


    ![](img/01efe5dd076565746bf3678068ba155c_213_2.png)'
  - '[PAGE 214]


    Alternatively, you can access your mounted shares by right clicking on the Smb4k
    System Tray icon in the lower right corner of your KDE menu bar. This will bring
    up a small popup menu. Click on the Mounted Shares option and the menu expands
    to the right, revealing your currently mounted shares. Click on one of them and
    a new window with the contents of that share will open.


    ![](img/01efe5dd076565746bf3678068ba155c_214_0.png)


    Everything works in this window as it does in a normal Konqueror window. You can
    drag and drop, rename, copy, move, delete, and create files just as if they were
    on your local machine.


    # Configuring the Samba Client


    If you right-click on the Smb4k tray icon and bring up the popup dialog again,
    you''ll notice there''s an option for Configuring Smb4k. This option can also
    be found in the SMB Share Browser window in the Settings menu. Click on Configuring
    Smb4k to see some of the settings and preferences for Smb4k.


    The most useful options are probably going to be in the Shares portion of the
    configuration window. Here you can choose to automatically mount some or all of
    your network shares when Smb4k starts. Most of the other options are for more
    advanced users with special network considerations.


    ![](img/01efe5dd076565746bf3678068ba155c_214_1.png)'
  - '[PAGE 215]


    # **Getting Help with Samba and Smb4k**


    Samba itself is a fairly broad topic; it might be more useful to look for help
    related directly to Smb4k instead. Unfortunately, as of this writing, the Smb4k
    handbook is only an empty placeholder and contains no information. There is a
    mailing list, however at `http://developer.berlios.de/mail/?group_id=769`.


    Please remember to search the archives before posting a new message; it is likely
    that list members have already answered your question in the past.'
  - '[PAGE 216]


    # Chapter 26

    # Customizing Linux


    You can change *anything* on your Linux computer. One of the most common changes
    is the screen background, or “wallpaper,” as some people call it. If you’re an
    avid sailor, like this book’s author, you might prefer a sunset over Longboat
    Key, as seen from the deck of your West Wight Potter sailboat, to the default
    *SimplyMEPS* background.'
  - '[PAGE 217]


    # Point & Click Linux!


    When you use Linux for hassle-free computing, you have time to go sailing. Never
    forget: That''s what all this is about! So let''s start with a hassle-free screen
    background change.


    ![](img/01efe5dd076565746bf3678068ba155c_217_0.png)


    # Welcome to the KDE Control Center


    This is where we do most of our customization. As you can see, it has a large
    number of categories, and their names are self-explanatory. To call up the Control
    Center, we go to the "System" section of our main menu, select "Settings, " and
    choose "Control Center."


    ![](img/01efe5dd076565746bf3678068ba155c_217_1.png)'
  - '[PAGE 218]


    # 26: Customizing Linux


    To change our desktop background we choose “Appearance and Themes” from the left-side
    “Control Center” menu, then click on “Background.” You can choose “No Picture”
    if you like, and choose either solid colors or various patterns in the lower half
    of the right side of the “Control Center” window. You can choose between a number
    of cleverly titled backgrounds in the gallery supplied by KDE that appears when
    you check “Picture.” You can also choose a picture you have stored somewhere on
    your hard drive, as we did with that nice sunset photo. Just click on the folder
    icon between the “Pictures” menu and the box on the right side of the window where
    your chosen background shows as a preview so you can see how it will look on your
    screen. You can preview a dozen or a hundred pictures, decide which one you like
    best, then click “Apply” at the bottom of the screen to make that one your background.
    If you ’re not set on just one, there’s a “Slide Show” option you can choose.
    Click the “Setup” button next to the “Slide Show” check box and pick dozens of
    pictures that will show in either random or set order, changing from one to another
    as often as you choose.


    ![](img/01efe5dd076565746bf3678068ba155c_218_0.png)


    Now here’s the big trick, and it applies to almost every change you make through
    the KDE Control Center: You can revert to your previous setting or to the default
    setting with a single click, so experimentation is 100% risk-free.


    ![](img/01efe5dd076565746bf3678068ba155c_218_1.png)'
  - '[PAGE 219]


    # Point & Click Linux!


    Other KDE appearance and behavior options work the same way as your “Background”
    selection. Clicking buttons to see what they do is faster (and teaches you more)
    than reading about someone else doing it. We’ll scan through a few of the more
    interesting options so you can get an idea of the amount of flexibility KDE gives
    you, but won’t go deeply into each screen. You can click the “Help” tab on any
    Control Center screen and get a short explanation of what’s going on, plus a link
    to a manual page that will give you full, often very geeky, explanations of what
    you’re seeing and doing on the page where you clicked “Help.”


    ![](img/01efe5dd076565746bf3678068ba155c_219_0.png)


    # Multiple Desktops


    This is a cool Linux trick you’ll appreciate if you’re in the habit of keeping
    many programs open at once. Down on your control panel at the bottom of the screen,
    near the middle, there’s a little icon with the numbers “1” and “2” on it, one
    above the other. You’re on desktop number one by default. If number one gets too
    crowded for you, instead of closing programs, you can click number two, and you
    have a fresh, uncluttered desktop.


    ![](img/01efe5dd076565746bf3678068ba155c_219_1.png)


    You can display some program windows on one desktop and some on another. And if
    two desktops aren’t enough for you, right-click on that icon and you’ll see a
    window that will you to create up to 16 desktops—or space enough to hold 100 or
    more open program windows.


    ![](img/01efe5dd076565746bf3678068ba155c_219_2.png)'
