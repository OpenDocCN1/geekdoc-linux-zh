    developers. Sometimes a bit of appreciation is as valuable as money—not that money
    or equipment donations are a bad thing to offer, although you may be surprised
    to learn that many (but far from all) free software authors will turn down donation
    offers because they are either writing free software as part of their jobs or
    are doing it because they enjoy creating quality programs as an art form and simply
    aren’t interested in earning money from it.


    # ## Linux Beyond the Desktop


    Even though the first Linux kernel was written on (and for) a student’s desktop
    computer, it has found more acceptance (so far) as a commercial operating system
    than on desktop PCs. Linux runs in the background everywhere from stock exchanges
    to giant Internet search engines like Google. Over half of the world’s 500 most
    powerful supercomputers run Linux. At least 25% of all Web sites (including some
    of the world’s most popular ones) are hosted on Linux servers.


    Most major motion picture studios use Linux for animation and special effects
    production. Indeed, you can download and install CinePaint, a program used to
    create special effects for Harry Potter movies (and many others) and run it on
    your Linux computer at home. It will probably run too slowly for professional
    use on your computer, and no piece of software can give you talent, but at least
    the tool is available to you—for free, no less.


    ![](img/01efe5dd076565746bf3678068ba155c_252_0.png)


    Linux has been loaded successfully on devices ranging from computerized wristwatches
    up to top-of-the-line mainframe computers. A Tivo personal video recorder is essentially
    a Linux computer that’s limited to only a few functions and is controlled by a
    few buttons instead of a keyboard.


    An increasing number of industrial controllers and other devices you don’t think
    of as “computers” run stripped-down embedded versions of Linux, too. In fact,
    the desktop computer is almost the last computing frontier Linux hasn’t either
    conquered outright or at least started moving rapidly toward dominating, although
    even that table looks like it is starting to turn. Companies are starting to test
    Linux on desktop (and laptop) computers used by employees ranging from sales clerks
    to oil refinery engineers, and every year the rate of desktop Linux adoption seems
    to increase slowly but surely.


    > “Familiar with desktop Linux and common Linux programs including Mozilla and
    OpenOffice.org” is already a good statement to put on your resume, because it
    shows you have enough initiative to rise above the common computing herd, and
    as Linux keeps spreading through the corporate world, Linux knowledge is going
    to become more and more valuable when you’re trying to get a new job (or a promotion).'
