    DSL 服务提供商都已切换到路由器式调制解调器，这些调制解调器可由 MEPIS Linux 自动检测和配置。（无论如何，这些 DSL 调制解调器都比旧的 PPoE
    调制解调器高效得多，因此无论您使用哪种操作系统，都应进行此切换。）


    ![](img/01efe5dd076565746bf3678068ba155c_32_0.png)


