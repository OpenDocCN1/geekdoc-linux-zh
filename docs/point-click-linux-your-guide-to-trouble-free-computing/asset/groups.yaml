    ### 第 5 章


    ### KPPP：简易调制解调器拨号应用程序


    ![](img/01efe5dd076565746bf3678068ba155c_62_0.png)


    大多数主要互联网服务提供商 (ISP) 都能与 Linux 良好协作。少数并未正式“支持”Linux——他们不希望你打电话询问关于使 Linux 计算机正确工作的建议——但你可以通过
    Linux 计算机拨号接入他们的电话线并通过它们连接互联网，而不会遇到任何问题。


    ### 点点点点 Linux！


    判断 ISP 是否兼容 Linux 的最简单方法是看它是否要求你在计算机上安装特殊软件才能连接其线路。如果需要特殊软件，该服务通常无法在 Linux 上使用。最典型的例子是
    AOL，如果你计算机上没有 AOL 软件，你就无法使用它，而且 AOL 的软件没有 Linux 版本。这里有些讽刺，因为 AOL 自己在内部大量使用 Linux，但那是他们的问题，不是我们的。我们接受
    AOL 不欢迎 Linux 用户这一事实，因此我们使用数千个其他欢迎 Linux 用户的 ISP 中的一个——而且由于它们中的大多数收费低于 AOL，我们很高兴使用它们作为替代。


    但是，仅仅因为 ISP 提供拨号软件，并不意味着该软件是*必需的*。本书的作者多年来一直使用知名的 ISP，Mindspring。虽然 Mindspring
    很乐意为你提供 Windows 或 Mac PC 的拨号软件，但他们也同样乐意让你通过 *SimplyMEPIS* CD 上的 KPPP 实用程序连接到他们的服务，其设置与其他任何
    ISP 拨号程序一样简单。


    > （如果你不确定当前的 ISP 或你打算使用的 ISP 是否适用于 Linux，请打电话或发送电子邮件给他们。他们会很乐意告诉你。）


    设置 KPPP 时，你需要从你的 ISP 获取以下信息：


    1. 你的用户名

    2. 你的密码

    3. 电话号码


    每个 ISP 在你注册时都会提供这些信息，如果你手头没有，你可以发邮件或打电话，他们会再次提供给你。


    ### 设置 KPPP


    显然，我们要选择“配置”。我们想要配置的主要是“账户”，所以我们从点击“新建”开始。


    ![](img/01efe5dd076565746bf3678068ba155c_64_0.png)


    这将给你提供“向导”和“手动设置”的选择。你可以查看“向导”屏幕，但除非你所在的国家列在其中，否则对你没有用——美国不在列表中。如果你在列出的国家之一， “向导”将立即给你该国家流行
    ISP 的列表，并帮助你获取一个账户（如果你还没有的话）。


    然而，我们在未列出的国家可以轻松使用“手动设置”。我们真正所做的只是输入我们的 ISP 名称和当地拨号电话号码。不难！


    注意有一个“添加”按钮。使用此按钮输入 ISP 的电话号码。你可以输入多个号码——这是一个好主意，以防某个号码有时忙或不起作用——通过多次使用“添加”按钮（假设你的
    ISP 在你居住地有多个当地电话号码）。


    ![](img/01efe5dd076565746bf3678068ba155c_64_1.png)


    你几乎肯定不需要担心“身份验证”。如果你设置一切后尝试连接你的 ISP 但失败，可能需要重置，但这很少见，如果你遇到登录问题，你可以打电话给你的 ISP 咨询。但我们现在不担心这个。我们只需确保为这个连接输入了名称和电话号码，然后点击“确定”。


    ### 准备连接


    剩下的唯一任务是输入你的 ISP 用户名和密码。完成之后，确保你的调制解调器正确连接到电话线，然后点击“连接”。


    ![](img/01efe5dd076565746bf3678068ba155c_65_0.png)


    接下来会发生三种情况之一。最可能的是，你将平稳地拨号到 ISP，自动登录，并在网上做任何你想做的事。使用 KPPP 在 Linux 中的连接性能与使用其他操作系统中的任何其他程序相比，不会更好也不会更差。


    第二种最可能发生的事件是，你的调制解调器正确拨号，但登录失败，给你留下一个“断开连接”通知，其中包含一些程序员可能觉得有用的数字，但对其他人来说毫无意义或几乎无用。如果发生这种情况，最常见的原因是你的用户名或密码有拼写错误。重新输入它们再试一次，现在应该一切都好了。


    第三个问题，大约百分之五的调制解调器会遇到，是你拥有一个“Winmodem”，它与 Linux、Mac 或除 Windows 以外的任何其他操作系统都不兼容。MEPIS
    Linux 会检测并自动配置大多数 Winmodem，但不是所有。有方法可以使几乎任何 Winmodem 在 Linux 上工作，但如果你的时间有价值，购买并插入一个
    Linux 兼容的外部“硬件”调制解调器（如果你有台式机）或 PCMCIA（卡片）调制解调器（如果你有笔记本电脑）会容易得多——也便宜得多。（当然，你可以在笔记本电脑上使用普通的外部调制解调器，但它没有专门设计的笔记本电脑调制解调器便携和方便。）


    ### 故障排除调制解调器连接问题


    尝试找出为什么在 KPPP 和 Linux 下调制解调器无法连接时，首先要做的是听它的声音。如果你在拨号 ISP 时听不到任何声音，请在拨号屏幕上点击“配置”并选择“调制解调器”选项卡。


