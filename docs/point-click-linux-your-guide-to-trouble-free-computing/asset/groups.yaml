    one problem: The test page wouldn’t print because the printer wasn’t plugged into
    the computer. MEPIS Linux is forgiving and user-friendly, but there are limits
    to what it can do, and an unplugged printer is beyond its control. After we plugged
    the printer in, everything worked fine.


    **An important note about printer operation**: Your printer may not work correctly
    with most programs while running from the LiveCD instead of Linux installed on
    your hard drive. When you are running Linux through your CD drive, the print program
    is not stored on your hard drive where the programs you use (like word processors)
    look for it when you tell them you want to print. As long as the test page prints,
    you’re fine even if other pages don’t. After you actually install MEPIS Linux,
    you’ll have no trouble printing.'
