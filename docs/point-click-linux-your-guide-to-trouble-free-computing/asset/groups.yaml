    # **About hard drive partitions**


    Hard drives store data in the usual digital “on or off” style, but there are a
    number of different patterns in which they can be stored. Windows 95, 98, and
    ME use a method called FAT 32. Windows NT, 2000 and XP use a method called NTFS.
    DOS and really old versions of Windows use FAT 16. Linux uses a different method
    of data storage, and even uses different names for different drives. Windows usually
    calls floppy drives A and B, hard drive C, and CD drives D, unless there are two
    or more hard drives, in which case hard drives can be E and F and G and so on,
    with the CD drive becoming the letter after the last hard drive.


    This illustration shows how Linux names drives:


    /dev/floppy is a floppy, /dev/cd is a CD drive, and /dev/hda is this computer''s
    single hard drive. There''s also a tmpfs that''s a temporary file system designed
    to speed up certain kinds of data access, originally developed for huge mainframe
    computers but also useful on your PC. There''s also /dev/sda1, which is a flash
    memory card for a digital camera.


    ![](img/01efe5dd076565746bf3678068ba155c_52_1.png)'
  - '[PAGE 53]


    Now comes the cool partitioning stuff.


    While Windows typically uses the whole hard drive as one big glob, you can make
    Windows run slightly faster by partitioning the hard drive so it acts like a number
    of small hard drives instead of one big one. This can also make system maintenance
    easier. If you keep all your pictures and text files in a separate partition from
    your programs, you can back up all your important data by simply backing up that
    partition.


    MEPIS Linux uses three partitions—what you see in the previous illustration as
    hda2 and hda4, and another, very small hda3 “swap” partition (that acts like an
    expansion of your computer’s RAM) kept hidden. Note, too, that there is an hda1
    partition. This is a Windows partition—the vfat next to the partition number tells
    us it uses the Windows FAT system.


    The ext3 file system used by MEPIS Linux differs from FAT in many ways, but the
    most obvious one is that if power to your computer is removed or you turn it off
    without going through the “correct” shutdown procedure, you can start it right
    up again without any problems. This is a feature even the latest versions of Windows
    don’t have.


    One last trick with the MEPIS Linux file system: It stores all your personal data
    in a /home partition by default—and not just your photos, text and music, but
    things like your favorite Web site bookmarks, your email, and even your desktop
    settings and other customizations, so you can easily upgrade or even reinstall
    MEPIS Linux without having to do a lot of setup or data restoration afterwards.


    Now we get to the hairy part: actually partitioning our hard drive.


    Right now we’re at the Install screen, getting asked how we want to do our install.


