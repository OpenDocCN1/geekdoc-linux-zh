    你可以缩小这些图片，使它们看起来更合适。事实上，你可以缩小、放大或更改要放入 OOO 文档的任何图片的尺寸，但首先，让我们找一张更好的图片放入我们的文本文件中之一。这是来自
    home/you/pictures 文件夹的一张不错的图片：


    ![](img/01efe5dd076565746bf3678068ba155c_105_0.png)


    如果你不记得如何导航文件系统，请回到第 3 章，“使用 Linux：KDE 和 KWrite”。


    以下是将上述图片添加到文本中的样子：


    ![](img/01efe5dd076565746bf3678068ba155c_105_1.png)


    我们是通过这个屏幕将大图片调整为适合页面的大小的：


    ![](img/01efe5dd076565746bf3678068ba155c_106_0.png)


    我们通过首先点击图片来进入“图形控制”屏幕，这让我们“聚焦”在照片上。我们知道我们聚焦在照片上，因为它边缘突然出现了小绿点。然后，在我们“定位”在照片上后，我们再次点击以查看我们可以对其进行的许多操作。这不是一门关于图形处理的课程，因此我们不会在这里提供大量说明。此外，抓取一张图片并点击这里或那里以查看会发生什么，比阅读关于它的说明更容易、更快捷。如果你在这里四处点击，不会损坏任何东西；最终，在你完成对文档及其中任何图片的编辑后，你可以不保存所做更改即退出
    OOO，你的测试内容将永远消失。


    当然，照片并不是你可以添加到 OOO 文本中的唯一图形。图表和图标同样容易插入和调整大小。如果你想将任何图形在页面上移动直到它看起来恰到好处，你所要做的就是抓住点击它时弹出的一个小“绿色手柄”，将其移动到你想要的位置。如果你决定新位置看起来不对，你可以转到屏幕顶部，点击“编辑”，然后点击顶部菜单项
    ---（“撤销”），或者点击“Ctrl+Z”来执行相同操作，例如，如果你使用了小手柄将这张乌龟图片移动到了页面上的错误位置：


    ![](img/01efe5dd076565746bf3678068ba155c_106_1.png)


    点击式 Linux！


    ### 欢迎使用 OpenOffice.org Writer 帮助


    ![](img/01efe5dd076565746bf3678068ba155c_107_0.png)


    OOO 的每个部分都有其独特的“帮助”手册，其篇幅相当于一本书，它会教你比你需要知道的更多。如果你有耐心，可以读完所有内容，但使用它作为索引并在需要时查找如何执行特定操作可能更高效。没有一个用户会使用像
    OOO 这样大型程序的所有功能，也没有两个用户会使用相同的功能。有些人可能希望使用 OOO 来制作双栏新闻简报（并将其作为 PDF 文件发送给打印机，这是打印机所偏好的格式），而另一些人可能永远不会制作纸质新闻简报，但希望使用
    OOO 来制作名片。


    ## 使用 Oo Writer 打印


    我们在第 2 章“运行 SimplyMEPIS CD”中已为你设置好打印机。要打印文档，请点击打印机图标。它会打印。如果你想让打印机做比按相反顺序输出页面更多的事情，请选择“文件”菜单（屏幕左上角），然后点击“打印机设置”并更改你喜欢的任何设置。最好先用一份两页的文件尝试这样做，而不是用一份百页文件，这样你在实验时不会浪费大量纸张和墨水。


    然而，你确实需要用至少两页内容来探索打印机设置，而不仅仅是单页，因为其中一些设置涉及页面的顺序。


    另一种你有时希望使用的技巧，特别是在处理复杂的多页打印项目时，是使用同一个“文件”菜单中的“页面预览”选项，它会在你将内容提交到纸张之前，向你准确展示打印页面的样子。当你在制作充满插图的双栏新闻简报等内容时，这特别有价值。


    是的，经过一些练习，你可以自学如何使用 Oo 制作相当复杂的桌面出版项目。这是一个令人惊叹的程序——尤其是考虑到其价格——如果你愿意超越基本用法，它可以处理远超出基本办公功能的内容。


    ## 点击式 Linux！


    ## 你并不总是需要文字处理器


    本书早期的一些章节是使用名为 Bluefish 的文本/HTML 编辑器编写的。直到编辑过程开始时才用到 OpenOffice.org。那时需要 OOO 中的协作编辑功能，以便与使用
    Microsoft Word 的出版商制作人员合作，但将早期草稿作为未格式化的文本输入更容易。


    对于大多数 Linux 初学者来说，KWrite 可能是比 Bluefish 更易于使用的基本文本编辑器；Bluefish 是一个为在线写作者设计的工具，没有“打印”功能，这就是为什么
    KWrite 是 *SimplyMepis* CD 的一部分而 Bluefish 不是的原因。不过，CD 确实包含了备受好评的 HTML 编辑器 Quanta+。你可能会发现，对于日常笔记、简单写作以及制作将发布在
    WWW 上而不是纸上的材料，KWrite 或 Quanta+ 比 OOO 或其他“重型”文字处理器更好。


    ![](img/01efe5dd076565746bf3678068ba155c_109_0.png)


    creating main gui...


    文字处理器通常不适合制作网页。无论是 OOO 还是 Microsoft Word，生成的 HTML 质量都不好。即使是 Microsoft FrontPage
    做得也很糟糕。如果你正在创建网页，最好使用专为该任务设计的程序——如 Mozilla Composer——而不是使用文字处理器。


    当你编写基本的、无修饰的文本时，以后再添加花哨的格式和颜色很容易，但如果你在开始时编写了它们，无论使用什么操作系统或软件，移除它们通常都不容易。


    我会在第 24 章“下载和安装软件”中展示如何获取 Bluefish 并通过几次鼠标点击将其添加到你的计算机中——以及成千上万其他免费程序。Linux 上有数十种文本和
    HTML 编辑器。仅因为我更喜欢 Bluefish 并不意味着你不会更喜欢另一个。请记住，Linux 的乐趣之一在于选择：使用 Linux，你可以完全按照你想要的方式设置你的计算机。你永远不会被迫接受别人的选择。


    ## 其他酷的 OpenOffice.org Writer 工具


    查看 Ooo 屏幕顶部的菜单。其中一个选项是“工具”。点击它，你会看到顶部的“拼写检查”。你可以一直开启拼写检查，在你输入时标记单词——自动拼写检查——或者在你写完后对整个文件运行拼写检查。还有一个同义词库，如果你发现想象力有点枯竭，并且认为你使用“however”（或任何词）太频繁，它会建议替代词。在“工具”下，你还会找到单词计数——对于按字数计酬的写作者来说这是一个基本功能——以及其他实用工具。


    这些工具中的一些在你的主工作屏幕左侧有图标。将光标悬停在图标上，你会看到一段告诉你其功能的文本。用左键点击该图标，你将打开其代表的任何功能。用右键点击它，如果你认为不太可能经常使用该功能，你将有机会删除该图标，你也可以添加那些你经常使用但未显示在右侧工具栏上的功能的图标。


    你可能想要尝试添加“同义词库”图标；它默认不存在，但手边有它非常有用。


    ## 第 12 章


    ## OpenOffice.org 演示者


    “但你不能在 Linux 上制作 PowerPoint！”常被作为放弃 Windows 及其问题的理由。这在技术上是一句真话，因为“PowerPoint”是微软的商标，但你
    certainly 可以使用 OpenOffice.org 演示者在 Linux 上制作幻灯片演示。你也可以使用 OOO 查看和编辑 PowerPoint
    幻灯片——甚至将以 OOO 创建的演示文稿保存为 PowerPoint 格式，以便使用 Windows 的同事可以在他们的机器上播放它们。


    ![](img/01efe5dd076565746bf3678068ba155c_112_0.png)


