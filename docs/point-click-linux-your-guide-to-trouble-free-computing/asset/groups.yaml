    ## 即点即用的 Linux！


    其他制造商也有其他的 BIOS 小技巧。当你习惯了更改 BIOS 设置后，弄清楚它们就不会有麻烦了。只有最初几次比较困难。如果你在保存前仔细思考，并确保在开始更改之前阅读
    BIOS 设置屏幕上的所有文本（并在开始按键之前做笔记，以便你可以轻松返回默认设置），你就会毫不费事地弄清楚所有事情。


    ### 常见 BIOS 访问命令列表


    我们从各种在线来源编制了这个列表。它并不完整，但涵盖了一些最常见的计算机制造商的最受欢迎的产品。如果你的电脑不在列表中，尝试一些最常见的访问命令；尝试它们不会伤害任何东西。如果那样也失败了，你的电脑或主板制造商的文档或网站是关于你
    BIOS 的可靠信息来源，也是最终的求助之地。你需要知道你的电脑的精确型号（可能还需要序列号）来获取正确的命令，因为它们因主板而异，并且计算机制造商可以（而且经常确实）在一项生产运行中途更换主板供应商而不通知任何人。


    - 1. 宏碁（Acer）—F1, F2, CTRL+ALT+ESC

    - 2. AST—CTRL+ALT+ESC, CTRL+ALT+DEL

    - 3. 康柏（Compaq）—F1 或 F10

    - 4. 戴尔（Dell）—400 F1 或 F3

    - 5. 戴尔（Dell）—Dimension F2 或 DEL

    - 6. 戴尔（Dell）—Inspiron F2

    - 7. 戴尔（Dell）—Latitude F2

    - 8. 戴尔（Dell）—Optiplex DEL 或 F2

    - 9. 戴尔（Dell）—Precision F2

    - 10. eMachine—DEL

    - 11. 捷威（Gateway）—F1 或 F2

    - 12. 惠普（HP）—F1, F2 或 F10

    - 13. IBM (PC) — F1

    - 14. IBM E-pro 笔记本电脑 — F2

    - 15. IBM PS/2 — CTRL+ALT+INS after CTRL+ALT+DEL

    - 16. 美光（Micron） — F1, F2 或 DEL

    - 17. 索尼® — VIAO F2 或 F3

    - 18. Tiger — DEL

    - 19. 东芝（Toshiba） — ESC 或 F1


    **如果你无法弄清楚如何更改你的 BIOS 设置…**


    …制作一个启动软盘。以下是如何在 Windows 中操作：


    1. 启动 Windows。

    2. 在 Windows 运行时将 *SimplyMEPIS* CD 放入 CD 驱动器中。

    3. 打开一个 DOS 窗口（在 Windows 中）。

    4. 转到 CD 上的 linux 目录。

    5. 在软盘驱动器中插入一张空白、已格式化的软盘。

    6. 执行 *mkbootfloppy.bat*。

    7. 在软盘驱动器中放入软盘，在 CD 驱动器中放入 *SimplyMEPIS* CD 并重新启动。你的电脑现在应该能运行 *SimplyMEPIS* 了。


    ## 引导 MEPIS


    Linux 在启动方式上非常有条理。你电脑的每个功能都会进行测试。这意味着你的 Linux 启动可能比其他操作系统慢，但有时“慢但稳”是最好的。另一件拖慢速度的事情是你正在从
    CD 驱动器而不是从硬盘驱动器运行软件。CD 驱动器比硬盘驱动器慢得多，以至于你从 LiveCD 做的任何事都会看起来像是以慢动作发生，而不是全速。你会发现，一旦你将
    MEPIS 安装到硬盘驱动器上，一切都会比从 CD 运行时快两到十倍。


    ## 为什么 MEPIS Linux 要求输入密码


    启动例程完成后，屏幕可能会看起来有点奇怪，像静电一样，或者空白一秒。然后你会看到一个登录屏幕，给你两个选择：“Demo” 和 “root”。


    ![](img/01efe5dd076565746bf3678068ba155c_27_0.png)


    最好以用户名 *demo* 开始，而不是使用 *root*，特别是如果你打算连接到互联网。这是一种安全措施，也是 Linux 不会像某些其他操作系统的用户那样成为病毒和蠕虫目标的重大原因之一。


    当你以 *user*（用户）身份登录时——一旦你永久安装了 MEPIS Linux，这很可能是你自己的名字——你将能够更改系统唯一的部分是你自己的数据和像屏幕颜色和其他一些外观选项之类的事情。要安装软件或对系统进行任何重大更改，Linux
    要求你以 *root* 身份登录。如果你以 *user* 身份登录，恶意的黑客就不容易安装你不知道的软件或进行其他恶作剧。


    只要你是以 *user* 而不是 *root* 身份登录，猫、孩子和善意的朋友就不能通过输入错误的命令弄乱你的电脑。事实上，当你进行实际的 Linux 安装时，你将能够为其他用户提供他们自己的用户账户，使他们能够登录并使用你的电脑，而不会打扰（或永远看不到）你的私人信息、电子邮件或你存储在电脑中的其他任何东西。而且每个用户还可以选择他或她的屏幕颜色和其他自定义功能，包括网站书签和喜欢的音乐。在
    Linux 中，整个家庭可以共享一台电脑，但它可以是每个家庭成员的“个人电脑”，因为每个人都可以有自己的用户登录。


    只有 root 能看到一切。（那将是你们，对吧？）


    ## 登录


    在“演示模式”下，演示用户的密码是 **demo**，全部小写。root 密码是 **root**，也是小写。我们将稍后展示如何更改密码（并添加用户），当我们把你的硬盘安装
    MEPIS 时。但就现在而言，让我们使用这些默认值。输入它们，点击“login”按钮——或者在你输入密码后只需按“Enter”键——一两秒后你就会看到你的完整、就绪的
    KDE 桌面。如果你的 PC 有扬声器，你应该在桌面出现时听到几声音乐。


    ![](img/01efe5dd076565746bf3678068ba155c_28_0.png)


    如果一切正常，你现在准备好使用（或玩弄）Linux 了。如果你的电脑通过连接到 DSL 线路、电缆调制解调器或其他高速“始终在线”设置的网络电缆连接到互联网，你现在应该已经连接到互联网了。你可以通过点击屏幕底部面板中的“M”来测试这一点，这将启动包含在
    **SimplyMEPIS** 中的 Mozilla 网络浏览器。


    ![](img/01efe5dd076565746bf3678068ba155c_28_1.png)


    如果你的网络此时没有正确运行——也就是说，如果你无法查看网站——你需要打开 MEPIS 系统中心并更改你的系统设置。如果你是自动在线的，则不需要这样做，但仍然花一分钟看看系统中心可能会不错。


    ## 使用 MEPIS 系统中心


    ![](img/01efe5dd076565746bf3678068ba155c_29_0.png)


    要打开 MEPIS 系统中心，点击主桌面上的“S”图标。


    当你打开 MEPIS 系统中心时，你首先看到的是登录屏幕。这个要求输入 root 密码，而不是你的用户密码。当你从 CD 运行时，密码是 root。（当然，在你把
    MEPIS 安装到硬盘驱动器后，你会把它改成更安全的内容。）


    ![](img/01efe5dd076565746bf3678068ba155c_29_1.png)


    ## 神奇的桌面清除图标


    我们刚告诉你要点击桌面上的一个图标。如果你的屏幕被应用程序窗口覆盖怎么办？或者两个或三个或 40 个应用程序窗口？（Linux 对你可以保持打开的应用程序或窗口数量没有实际限制，所以你确实可以同时打开
    40——甚至 100——个应用程序。）


    答案是屏幕左下角的 View Desktop 图标，紧挨着那个带有顶部标有“K”的小齿轮图片。点击 View Desktop 图标，你将有一个清晰的视图看到你的空白桌面。


    ![](img/01efe5dd076565746bf3678068ba155c_29_2.png)

    # 2: 运行 SimplyMEPIS CD


    输入该密码，你将看到 MEPIS 系统中心主屏幕。


    在这个屏幕的左侧，你看到一个功能索引，在该索引上方有一个帮助选项。如果你点击帮助，你将看到这些字：


    ### 使用 MEPIS 系统中心


    要使用 MEPIS 系统中心，只需在索引选项卡中选择一个功能，并按照此帮助选项卡中的说明进行操作。


    使用 MEPIS 系统中心就是这么简单。我们将从查看网络接口开始。


    ![](img/01efe5dd076565746bf3678068ba155c_30_0.png)


    这个屏幕告诉我们网络在做什么。在这个例子中，我们有一个活动的无线网络连接。我们看到哪些网络服务正在运行，因为我们有可用的按钮来停止它们。如果这些服务没有运行，这些按钮会说“Start”而不是“Stop”。标有“Start
    eth0”和“Start ath0”的按钮是阴影化且几乎不可见的，因为这台电脑没有连接到有线（eth0）连接，只有无线，所以没有检测到有线连接。


    Ath0 仅用于 Atheros 网卡，它们并不太常见。如果你有一个，MEPIS 会自动检测到它，自动安装正确的驱动程序，并自动为你启动它。


