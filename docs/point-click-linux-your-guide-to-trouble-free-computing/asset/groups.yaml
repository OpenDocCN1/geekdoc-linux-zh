    ## 使用 Samba 访问 Windows 网络共享


    不幸的是，使用 Samba 让 Windows 访问 Linux 网络共享的过程在 Linux 和 Windows 两端的设置和配置都要复杂得多，因此在本章中，我们只讨论访问
    Windows 共享。对于本示例，我们假设您已拥有一台为工作组网络配置好的 Windows 计算机。


    ### 工具 smb4k


    在屏幕的右下角，您会注意到一个绿色和蓝色的图标。这是您的 Samba 客户端已经在运行，正在扫描可连接的 Windows 网络。左键单击该图标以调出共享浏览器。


    ![](img/01efe5dd076565746bf3678068ba155c_212_0.png)


    如您所见，所有 Windows 工作组都列在窗口的左侧。在本示例中，工作组名称恰当地称为 **workgroup**。这是大多数 Windows 版本的默认名称；Windows
    XP 的默认工作组名称是 **mshome**。除了默认值外，在设置网络时，您可能选择了自己的工作组名称，或者您可能在家庭或办公室中为不同目的设置了多个工作组。


    ![](img/01efe5dd076565746bf3678068ba155c_212_1.png)


    左键单击工作组条目以列出当前连接到该工作组的所有计算机。在我们的示例中，工作组中只有一台计算机，其名称为 amd64。单击您想要访问的计算机；这将调出登录窗口。


    ![](img/01efe5dd076565746bf3678068ba155c_213_0.png)


    登录窗口要求您提供用户名和密码。请输入您正在登录的计算机上某个 Windows 用户的名称和密码。例如，如果您的 Windows 用户名为 *dirkengty*，密码为
    *iluvdadams*，请在提供的字段中输入这些信息。您始终可以以 Administrator 身份登录，但不建议在日常工作中这样做，因为 Administrator
    用户在 Windows 系统上拥有最高权限，这存在安全风险。请记住不要在这里使用您的 Linux 用户名和密码；您正在远程登录到一台 Windows 机器，它不知道也不关心
    Linux 用户。


    ![](img/01efe5dd076565746bf3678068ba155c_213_1.png)


    当您登录到 amd64 机器时，您将能够看到其所有共享目录。在我们的示例中，您有两个共享目录：根目录和“我的文档”文件夹。当您单击这些列表中的一个时，Samba
    会在您的用户主目录中一个名为 Smb4k 的目录中挂载该共享。它还将显示在 Smb4k 窗口的右上角。您可以挂载任意数量的共享。


    ![](img/01efe5dd076565746bf3678068ba155c_213_2.png)


    或者，您可以通过右键单击 KDE 菜单栏右下角的 Smb4k 系统托盘图标来访问已挂载的共享。这将调出一个小弹出菜单。单击“已挂载共享”选项，菜单将向右展开，显示您当前已挂载的共享。单击其中之一，将打开一个新窗口，显示该共享的内容。


    ![](img/01efe5dd076565746bf3678068ba155c_214_0.png)


    在这个窗口中，一切操作都如同在普通的 Konqueror 窗口中一样。您可以像在本地机器上一样拖动、放置、重命名、复制、移动、删除和创建文件。


    ### 配置 Samba 客户端


    如果您右键单击 Smb4k 托盘图标并再次调出弹出对话框，您将注意到有一个“配置 Smb4k”选项。此选项也可以在 SMB 共享浏览器窗口的“设置”菜单中找到。单击“配置
    Smb4k”可查看 Smb4k 的一些设置和首选项。


    最有用的选项可能位于配置窗口的“共享”部分。在这里，您可以选择在 Smb4k 启动时自动挂载某些或所有网络共享。其他大多数选项是针对有特殊网络需求的高级用户的。


    ![](img/01efe5dd076565746bf3678068ba155c_214_1.png)


    ### 获取关于 Samba 和 Smb4k 的帮助


    Samba 本身是一个相当广泛的主题；查找直接与 Smb4k 相关的帮助可能更有用。不幸的是，在撰写本文时，Smb4k 手册只是一个空的占位符，不包含任何信息。不过，有一个邮件列表，地址在
    `http://developer.berlios.de/mail/?group_id=769`。


    请记得在发布新消息之前搜索存档；很有可能列表成员过去已经回答过您的问题。


    ## 第 26 章 定制 Linux


    您可以更改 Linux 计算机上的*任何*内容。其中最常见的更改之一是屏幕背景，有些人称之为“墙纸”。如果您像本书的作者一样是热衷航海的人，您可能会更喜欢从西特·怀特·波特帆船甲板上看到的朗博特岛日落，而不是默认的
    *SimplyMEPS* 背景。


    ### 点击即用的 Linux！


    当使用 Linux 进行无忧计算时，您有时间去航海。永远不要忘记：这就是这一切的意义所在！所以，让我们从一个无忧的屏幕背景更改开始。


    ![](img/01efe5dd076565746bf3678068ba155c_217_0.png)


    ### 欢迎使用 KDE 控制中心


    这是我们要进行大部分定制的地方。如您所见，它有许多类别，它们的名称不言自明。要调出控制中心，我们进入主菜单的“系统”部分，选择“设置”，然后选择“控制中心”。


    ![](img/01efe5dd076565746bf3678068ba155c_217_1.png)


    ### 26: 定制 Linux


    要更改桌面背景，我们从左侧“控制中心”菜单中选择“外观和主题”，然后单击“背景”。如果您喜欢，可以选择“无图片”，并在“控制中心”窗口右侧下半部分选择纯色或各种图案。您可以从
    KDE 提供的图库中选择许多巧妙命名的背景，当您勾选“图片”时会出现该图库。您还可以选择存储在硬盘某处的图片，就像我们做的那样使用了那张漂亮的日落照片。只需单击“图片”菜单和右侧显示所选背景预览的框之间的文件夹图标，以便您可以看到它在屏幕上的样子。您可以预览十几个或上百张图片，决定最喜欢哪一张，然后单击屏幕底部的“应用”按钮将其设为背景。如果您不满足于只有一张，还有一个“幻灯片”选项可供选择。单击“幻灯片”复选框旁边的“设置”按钮，选择几十张图片，它们将按随机或设定顺序显示，按您选择频率在一张到另一张之间切换。


    ![](img/01efe5dd076565746bf3678068ba155c_218_0.png)


    现在这是个大技巧，适用于您通过 KDE 控制中心所做的几乎每一处更改：您可以单击一次即可返回到之前的设置或默认设置，因此实验是 100% 无风险的。


    ![](img/01efe5dd076565746bf3678068ba155c_218_1.png)


    ### 点击即用的 Linux！


    其他 KDE 外观和行为选项的工作方式与“背景”选择相同。单击按钮查看其功能比阅读他人操作说明更快（并且能教您更多）。我们将浏览一些更有趣的选项，以便您对
    KDE 提供的灵活性有所了解，但不会深入介绍每个屏幕。您可以单击任何控制中心屏幕上的“帮助”选项卡，获取简短的说明，以及一个指向手册页的链接，该手册页将为您提供完整且通常非常极客的关于您在点击“帮助”的页面上所见和所做的事情的解释。


    ![](img/01efe5dd076565746bf3678068ba155c_219_0.png)


    ### 多个桌面


    这是一个很酷的 Linux 技巧，如果您习惯同时打开许多程序，您会欣赏这一点。在屏幕底部的控制面板上，靠近中间，有一个小图标，上面有数字“1”和“2”，一个在另一个上面。默认情况下，您位于
    1 号桌面。如果 1 号桌面变得太拥挤，您可以不关闭程序，而是单击 2，您就拥有一个全新的、不杂乱的桌面。


    ![](img/01efe5dd076565746bf3678068ba155c_219_1.png)


    您可以在一个桌面上显示一些程序窗口，在另一个桌面上显示另一些窗口。如果两个桌面还不够，右键单击该图标，您将看到一个窗口，该窗口允许您创建多达 16 个桌面——或者足够容纳
    100 个或多个打开的程序窗口的空间。


    ![](img/01efe5dd076565746bf3678068ba155c_219_2.png)

