    \ 在任何方面都不是一个非凡的 LUG，它其实是一个非常典型的 LUG，与从旧金山到新德里的同类组织非常相似。\n\nLUG 会议的形式各不相同——有时会有正式演讲，有时则没有——但从来没人阻止过成员带着一台故障的电脑参加会议，并要求其他人帮忙让它正常运作，或者帮忙安装某些令人头疼的专业或实验性软件。无论你是新用户，还是一位自\
    \ 1994 年起就在运行 Linux、正在构建 2000 节点超级计算机集群以便通过运行计入数百万变量的实时气候模拟程序来准确预测飓风的精通计算机的气象学家，你的\
    \ LUG 都是获取 Linux 帮助的好途径。即使你很少参加 LUG 会议（或者根本不参加），LUG 的邮件列表通常也是获取 Linux 问题的快速、直接、一对一答案的好地方，而且你不需要与最近的\
    \ LUG 位于同一个城市或城镇才能加入其邮件列表。加入 LUG 通常没有会费或其他正式要求。你只需出现，无论是在现场还是在邮件列表上，你就在那里了。你可以在\
    \ www.linux.org 找到一个相当不错的 LUG 在线列表。截至 2004 年 7 月，该网站显示了 91 个国家的 647 个团体，而且这个数字每个月都在增加。该页面还包含指向其他几个网站的链接，这些网站将教你如何组建自己的\
    \ LUG，这需要的是组织能力而非技术技能。\n\n也许，如果你是一个组织者类型的人，而非技术倾向的人，组建一个 LUG 将是你对 Linux 社区的贡献。如果你这样做了，请记住\
    \ Linux 本应是充满乐趣的，所以你的小组应该有一个超越技术培训和支持的社会性组成部分。大多数 Linux 用户和你一样：聪明、有见识，有着许多超越计算本身的兴趣，即使其中一些人在不坐在键盘前时可能有点害羞。将这些人聚集在一个社交场合——也许包括妻子或丈夫、孩子或父母，以及顺道而来的几位同事或表亲——你通常就能举办相当不错的野餐或其他活动。\n\
    \n本书作者是每月在佛罗里达州萨拉索塔的 Cock and Bull 酒吧举行的 SLUG“社交会议”的常客。事实上，尽管他非常不愿承认，他参加“社交”LUG\
    \ 会议比参加“正式”会议还要多，因为许多正式会议上讨论的技术主题都超出了他的理解范围。\n\n## 关于 Linux 总有更多东西可以学习\n\n即使你一开始发现自己抓着头皮有点困惑，或者需要一点帮助才能让第一次\
    \ Linux 安装正常运行，很快你就会发现 Linux 如此熟悉，以至于当你回到发现 Linux 之前使用的那个操作系统时，你会因其局限性而感到沮丧。\n\
    \n以过来人的经验告诉你。\n\nLinux 既令人沮丧又美妙。令人沮丧的部分在于，第一次尝试解决某些 Linux 问题时，过程可能显得极其繁琐。美妙之处在于，你可以*解决*几乎任何\
    \ Linux 问题，包括由于不被允许插手内部机制而绝不可能在其他操作系统中解决的问题。在你开始使用 Linux 不久后，你可能会发现自己说：“要是我能做……就好了”，并在你的\
    \ LUG 邮件列表上提问，进行网络搜索，直到你找到方法——无论是通过点击*这里*然后点击*那里*，还是通过输入一两个命令行指令。你会感到无比自豪。你独自修复了你认为太难而无法搞定的东西。你是一位\
    \ Linux 巫师！\n\n然后你会想到想用 Linux 做的另一件事，也许是你以前从未尝试过的事情，既然你知道你是 Linux 巫师，你就知道你能搞定它——只不过这一次可能没那么容易，所以你会做更多的研究，学习如何编写命令行脚本来实现你的目标，甚至可能在过程中学习一点\
    \ Perl（或另一种脚本语言）。\n\n你现在大难临头了。\n\n既然你已了解了一些关于计算机如何运作，以及如何*改变*其运作方式的知识，就没有什么能阻止你了。如果你去参加\
    \ LUG 会议，有人说：“你可以通过增加 RAM 来提高系统性能”，即使你从未打开过机箱，也不知道 RAM（随机存取存储器）长什么样或如何添加，你也想要拆开电脑并添加更多的\
    \ RAM。\n\n因为通过了解 Linux，你现在已经明白你的计算机是你自己可以弄清楚并动手操作的东西，所以，你不会再说“哦，我对计算机懂得不多”，而是会提出问题，搜索搜索引擎，学习\
    \ RAM 是什么以及如何将其添加到你的计算机中。在你攻克难题 RAM 之后，何不升级一下显卡呢？优化 Linux 内核以获取一点点额外的性能如何呢？\n\n\
    这一切可以没完没了，直到有一天在工作或学校时，别人的电脑出了故障，而你能确切知道原因——并告诉他们。你将被视为当地的计算机专家，而且如果你不多加小心，你可能会转向系统管理或编程，而不再做一个普通的、快乐的人。\n\
    \n这不是什么坏事……\n\nRobin “Roblimo” Miller  \n佛罗里达州 Bradenton，2004 年\n\n# 第四部分\n\n\
    ## 附录\n\n- 附录 A    其他流行 Linux 发行版指南\n- 附录 B    可以帮助你更精通 Linux 的书籍\n- 附录 C    关于\
    \ Mepis 和 SimplyMEPIS 光盘\n\n# 附录 A\n\n## 其他流行 Linux 发行版指南\n\nMEPIS 只是众多 Linux\
    \ 发行版中的一种。这里列出的十个 Linux 桌面发行版，是 www.distrowatch.com 在 2004 年 7 月记录到的除 MEPIS 之外最流行的英语版本。\n\
    \n## Mandrake Linux\n\n这是第一个致力于让普通桌面用户轻松使用 Linux 的发行版。其生产商 MandrakeSoft 自 1998\
    \ 年成立以来经历了许多起伏，他们的一些版本存在质量控制问题，但 Mandrake Linux 现在很稳定，适用于各个层级的用户，而不仅仅是初学者。\n\n\
    www.mandrakelinux.com\n\n## Fedora 项目\n\n这是一个由社区开发、可免费下载的发行版，它取代了旧的免费 Red Hat\
    \ Linux 版本，但仍由 Red Hat 赞助和支持。它通常更面向爱好者和实验者，而非桌面计算机用户。\n\nfedora.redhat.com\n\n\
    ## Knoppix\n\n这是一张可启动 CD，包含一组 GNU/Linux 软件，具有自动硬件检测功能，并支持许多显卡、声卡、SCSI 和 USB 设备以及其他外围设备。它在很多方面与\
    \ MEPIS 相似，有时能正常运行令 MEPIS 头疼的“怪异性”硬件，但安装到硬盘上稍微困难一些。\n\nwww.knoppix.com\n\n## Debian\
    \ 项目\n\nDebian 是一个真正的自由（这两个词意义上的）软件项目，也是 MEPIS 的基础。Debian 通常面向命令行，但也有一些可用的 GUI\
    \ 系统工具。\n\nwww.debian.org\n\n"
