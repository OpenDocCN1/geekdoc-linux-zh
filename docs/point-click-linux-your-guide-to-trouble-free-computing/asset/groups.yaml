    # 致谢


    许多人完成了使本书成为可能的“实际工作”，尤其是成千上万的 Linux、GNU、KDE、Debian 和其他免费及开源软件开发者。在这里不可能逐一感谢每个人；名单和成就列表将需要数百页篇幅。


    Warren Woodford 和 MEPIS 开发团队创建了本书后附的 SimplyMEPIS 光盘；他们还维护 MEPIS.org/forums 网站，该网站是
    MEPIS Linux 的主要技术支持来源。请考虑通过在 MEPIS.org 注册您的副本——或更好——购买 MEPIS 订阅来支持他们的工作。价格不高，但益处很大。


    Jem Matzan 和 Joe Barr 贡献了章节，并帮助我确保手稿的技术错误尽可能少。Howard Lee Harkness 和 Jay Lyman
    也提供了宝贵的建议，许多 PointAndClickLinux.com 的访问者在我发布早期章节并还在成形时对此发表了评论。


    PointAndClickLinux.com 网站由 Brice Burgess 创建；EvolvMedia 的 Damen Shaquiri 制作了视频
    DVD。Logan Tygart 和 Suncoast Linux 用户小组的其他成员帮助我们开发了用于视频制作的基于 VNC 的方法，该项目现在已经独立于本书之外继续发展。（你可以在
    PointAndClickLinux.com 上以附加视频的形式看到部分成果。）


    Elise Walter 承担了这项不讨人喜欢的任务，将最终手稿整理成可出版的形式。我是一个固执且经常古怪的作家，但她对我保持耐心并完成了工作——而且做得很好。


    说到耐心，我的妻子 Debbie 是当今的世界冠军。作为一组开源新闻和信息网站（OSTG.com）的主编，我通常的工作周已经足够耗人了；当我还要在截止日期前完成书籍的工作时，Debbie
    有好几个月几乎没有丈夫了。她字面上把饭菜带到我的家庭办公室，在我深夜打字时为我按摩肩膀。我从未理解过如此美丽、才华横溢且支持我的女性为何选择嫁给我，但我并不抱怨。相反，我回报她以礼物、拥抱以及我能想到的一切，以感谢她为这本书成为可能所做的帮助。


    - Robin ''Roblimo'' Miller

    - 佛罗里达州 Bradenton


