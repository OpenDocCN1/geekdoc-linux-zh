    Linux 无关。（检查连接调制解调器到电话线的线缆是个好主意；计算机与电话系统之间的不良连接是调制解调器故障的常见原因。）


    如果你在“查询调制解调器”时，没有看到一系列小条形图和其他“正在执行某项任务”的指示，而是看到诸如“无法检测调制解调器”或“调制解调器忙”之类的信息，你需要重启计算机以确保一切正常运行。如果重启无效，你可能拥有一个仅支持
    Windows 的“Winmodem（软件调制解调器）”，是时候考虑购买一个不依赖特定操作系统即可正常运行的“硬件调制解调器”了。


    ## 调制解调器购买建议


    Winmodem 的包装或在线销售广告会列出运行它所需的 Windows 版本，并且*只列出* Windows 的各种变体。根据定义，如果调制解调器也能配合
    Mac OS 或 DOS 工作，它就不是 Winmodem，并且几乎总是能配合 Linux 工作，即使制造商没有明确说明。更好的做法是，在 Google 或其他搜索引擎中搜索“Linux
    调制解调器”，你会发现许多低成本且绝对、肯定能配合 Linux 工作的调制解调器。选择一个 USB 或串口外置调制解调器，你甚至不需要安装它。只需插上，即可准备连接。


    ## 点点 Linux！


    能够拨号，并且你实际能听到拨号声的调制解调器，就是一个正常工作的调制解调器。如果你原本期待看到“已连接且用户名和密码已被接受”的通知，却收到了烦人的“KPPP
    守护进程意外终止”或类似通知，那么问题很可能不在你的调制解调器或软件上。正如之前提到的，这个问题最可能的原因是用户名或密码不正确。第二个可能性是“身份验证”协议。少数
    ISP 不使用通用的“PAP/CHAP”方法，而是要求使用严格的 PAP 或严格的 CHAP。你不需要了解这些术语的含义（如果你好奇，可以通过搜索引擎查阅），只需要知道你可能需要使用其中一种。


    ![](img/01efe5dd076565746bf3678068ba155c_67_0.png)


    在 KPPP 中进行此更改很简单。进入你的“配置”界面，选择“账户”，选择“编辑”你的账户，然后点击“PAP/CHAP”右侧的箭头。


    ![](img/01efe5dd076565746bf3678068ba155c_67_1.png)


    这将提供给你几种选择，包括单独的“PAP”和“CHAP”。如果这是一个问题，你的 ISP 可以告诉你应该选择哪一个，或者你也可以逐个尝试；进行此更改所花的时间比拨打
    ISP 的客服专线并应付语音邮件菜单要少得多。


    最后一个问题可能会阻碍你轻松连接到 ISP，它只发生在美国极小比例的 ISP 中，而在世界其他地区这种情况正在减少：要求你输入“静态 IP”、“网关”和“DNS
    IP 地址”才能使用服务。只有拥有非常老旧设备的 ISP 才仍需要这些设置，无论使用什么操作系统，它们都要求这些设置，因此，如果你询问，使用这些设置的 ISP
    应该能 readily 提供这些信息。你很可能已经拥有这些信息，因为它们是你首次开始使用其服务时提供的注册信息的一部分。


    要更改这些设置，你再次需要“编辑”你的账户，并选择 IP、网关和 DNS 选项卡作为要编辑的部分。你需要点击“静态”或“手动”以输入这些数字。如果 ISP
    说在你连接它们时必须使用它们的 DNS（域名服务器），你不仅要输入它们的 DNS，还必须点击“DNS”窗口中的“连接期间禁用现有 DNS 服务器”复选框。


