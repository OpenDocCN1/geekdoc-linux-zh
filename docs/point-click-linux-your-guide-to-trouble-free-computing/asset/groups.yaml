    PDF”（Export to PDF）行获得相同的结果。预计未来会有其他“导出”选项，这就是为什么有一个单独的“导出”选项，为将来包含的格式留有余地，但就目前而言，PDF
    已经足够棒了。PDF，即 Adobe 的“可移植文档格式”，是许多在线文档的首选格式，这些文档可能被用户打印出来，或者在其他文档必须看起来在电脑屏幕和纸张上完全相同的情况下使用。


    由于 PDF 文档不容易被读者修改或复制部分章节，许多版权持有者喜欢以这种方式分发他们最有价值的作品。希望人们看到他们确切写下的内容（行号和脚注每次都在相同位置，这在
    HTML 或其他文档格式中可能不会发生）的许多政府机构和学术机构也更倾向于使用 PDF。


    Microsoft Word 和 Office 没有特殊的“插件”程序就无法保存为 PDF。仅凭这一点，就开始使用 OoO 作为您的主要文字处理器并鼓励朋友和同事使用它的理由就足够了。


    ### 在 OoO 文档中添加图片


    在您的 OoO 屏幕顶部，您有一个典型的选项列表，点击这些选项可以下拉菜单：“文件—编辑—视图—插入—格式—工具—窗口—帮助”。


