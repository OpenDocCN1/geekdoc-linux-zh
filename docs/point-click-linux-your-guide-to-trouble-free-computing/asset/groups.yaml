    \ go do something else. gFTP will work fine without you watching. Your gFTP screen\
    \ will look something like this while the file transfer is in progress:\n\n![](img/01efe5dd076565746bf3678068ba155c_154_0.png)\n\
    \n### Working with a Remote Server\n\n  Log in exactly the same way as in any\
    \ other FTP client. You can see the form spaces for server name, user name, and\
    \ password in the screenshots. Use them appropriately. You can also add the FTP\
    \ site you're on as a bookmark so you don't need to enter that information again.\
    \ Check the \"Remember Password\" box and even your password will be remembered.\
    \ Quite a time-saver!\n\n![](img/01efe5dd076565746bf3678068ba155c_154_1.png)\n\
    \n  You can either type in remote server directories as filenames in the space\
    \ above the \"file listing\" window on the right half of your gFTP screen or navigate\
    \ the remote server's file system by clicking on directories, folders, and files.\
    \ After you found the file or directory you want to transfer or modify, highlight\
    \ it by clicking on it. To modify that file's permissions and characteristics\
    \ (assuming you have permission to do this on that remote server, right-click\
    \ on it and choose from the list of commands that will pop up. All your old favorites\
    \ are there.\n\n### Point & Click Linux!\n\n  Because Linux is similar to Unix,\
    \ and all FTP file commands are Unix-based, you can make all the same changes\
    \ on your local files with gFTP, too. This is usually pointless because you have\
    \ an efficient, built-in file browser that makes file management on your computer\
    \ easier than doing it through an FTP program. However, it’s a cute little trick\
    \ you can use if, for instance, you spot a typo in a file name while working with\
    \ FTP and want to change it before you forget.\n\n![](img/01efe5dd076565746bf3678068ba155c_155_0.png)\n\
    \n### The gFTP Toolbar\n\n  The icon button on the left is what you click to make\
    \ a connection after you have the correct information (server name, user name,\
    \ and so on) typed in. Over to the right, the little button that says “FTP” allows\
    \ you to switch protocols; you can use gFTP for HTTP transfers and—more useful—for\
    \ secure transfers with SSH (Secure Shell protocol).\n\n  The rest of the toolbar\
    \ functions are self-explanatory. Click on the text menu items at the top of the\
    \ gFTP window and you’ll instantly see what functions are available though each\
    \ one. Only the “Help” button is disappointing; there is no built-in manual for\
    \ gFTP. On the other hand, you could argue that there is no need for one since\
    \ gFTP is so simple, obvious, and stable.\n\n  gFTP help and information is available\
    \ at www.gftp.org.\n\n## Chapter 19\n## K3b—Easy CD Burning Program\n\n  We chose\
    \ K3b as the CD and DVD burning program to include in the SimplyMEPIS CD and this\
    \ book because it is one of the finest and most versatile programs of this type\
    \ we have ever used, in any operating system. K3b handles music, video, and data\
    \ equally well, and has no trouble burning the “ISO” (complete file system image)\
    \ CDs needed to boot your computer directly from its CD drive. This is the program\
    \ that was used to create the original master version of the SimplyMEPIS bootable\
    \ CD and the video instruction DVD included with this book.\n\n  You can also\
    \ use K3b to copy almost any kind of CD or DVD that doesn’t have some sort of\
    \ built-in copy protection, although you will want to make sure you don’t make\
    \ illegal copies of movies or songs that are protected by copyright laws where\
    \ you live.\n\n  Remember, too, that if your drive won't burn DVDs, no software—not\
    \ even K3b—can make it into a DVD-burner. Most RW (Read/Write) drives that can\
    \ *read* DVDs can't *make* them, even if they do a fine job of writing CDs.\n\n\
    ### Running K3b\n\n  So far we haven't encountered a CD or DVD drive that K3b\
    \ failed to detect or that needed any setup action beyond clicking “Okay” on the\
    \ defaults. When you start K3b for the first time it will detect your CD RW (or\
    \ DVD RW) drive and that will be that. You will soon be taken to an opening screen\
    \ that has a big “Tooltip” window splashed across it.\n\n  As with all other Linux\
    \ programs, you can keep the “Tips” windows from showing up when you start the\
    \ program by unchecking the “Show tips on startup” box. It's probably a good idea\
    \ to let them come up at least the first few times you open the program—and to\
    \ actually read them, because they contain useful information. Or you may want\
    \ to click “Next” on the K3b tooltip window four or five times and read all the\
    \ tips at one time, then shut them off for the future. (K3b is so easy to use\
    \ that there aren't a lot of tips, so this might be best.)\n\n![](img/01efe5dd076565746bf3678068ba155c_157_0.png)\n\
    \n  Now we have K3b set up (automatically) and ready to run. So let's do something\
    \ with it. The main startup screen gives us several choices. We're going to choose\
    \ \"New Data CD Project\" because we often create Data CDs. In this case, the\
    \ data will be a bunch of pictures we took of a sailboat race. We're going to\
    \ make a CD with all the pictures on it that we can give to the editor of the\
    \ Sarasota Sailing Squadron's monthly newsletter, \"The Burgee,\" for publication\
    \ in the next edition.\n\n![](img/01efe5dd076565746bf3678068ba155c_158_0.png)\n\
    \n  We have four types of projects from which to choose:\n\n1. New Audio CD Project\n\
    2. New Data CD Project\n3. New Data DVD Project\n4. Copy CD\n\n![](img/01efe5dd076565746bf3678068ba155c_158_1.png)\n\
    \n  K3b considers everything other than music \"Data,\" and we're writing to a\
    \ CD, so we'll choose \"New Data CD Project.\"\n\n  After we make that choice,\
    \ we need to choose the data we want to put on the CD. The top half of our K3b\
    \ screen is divided into two sections: files on the right, folders on the left.\
    \ We're going to put an entire \"Pictures\" folder on CD, so we put our cursor\
    \ on the \"Pictures\" directory listing and, while holding our left mouse button,\
    \ drag it down into the \"Current Projects\" area, then release the mouse button.\n\
    \n![](img/01efe5dd076565746bf3678068ba155c_158_2.png)\n\n  We look down in the\
    \ lower left corner of the window and see that we have 69.4 megabytes of data\
    \ in our \"Pictures\" folder, which will easily fit on a single CD. There's only\
    \ one thing left to do, assuming we've put either a blank recordable CD or a rewritable\
    \ CD in our drive: Click the \"Burn\" button in the lower right corner of the\
    \ K3b window and sit back.\n\n![](img/01efe5dd076565746bf3678068ba155c_159_0.png)\n\
    \n  Making a music CD is exactly the same, except you choose \"Audio CD Project,\"\
    \ and instead of selecting a whole folder at once to put on the CD, you might\
    \ want to place each file (that is, each piece of music) individually on it so\
    \ you can set the order in which they'll play on the finished CD. To move files\
    \ around within the \"Project\" listing, you just \"drag\" them to where you want\
    \ them with the mouse while holding the left mouse button and release the button\
    \ where you decide they best fit in your custom-made playlist.\n\n### More About\
    \ Using K3b\n\n  When using Reusable (Rewritable) CDs, K3b will automatically\
    \ \"blank\" them—that is, remove what you had on them before—but will ask you\
    \ to confirm this action first so you don't delete important material by mistake.\n\
    \n  Copying CDs is self-explanatory; just step through the processes as they come\
    \ up, following the onscreen instructions.\n\n  Making or copying DVDs is the\
    \ same as working with CDs, except you must have a DVD burner and not just a CD\
    \ burner to use this feature.\n\n  Burning ISO images from which your computer\
    \ can boot directly (like the SimplyMEPIS CD in this book) requires a slightly\
    \ different procedure. Select \"Tools,\" then \"CD,\" then \"Burn CD Image.\"\
    \ (Or if you have a DVD-write drive, you can burn a bootable DVD instead by clicking\
    \ \"DVD\" instead of \"CD.\" After that, select the ISO image you want to put\
    \ on CD or DVD, and you will get a special screen for ISO burning.)\n"
  mdcn: "\n## 18：gFTP——一款简单而强大的 FTP 程序\n\n  若要下载（或上传）文件，请按住鼠标左键选中该文件，确保你位于目标计算机的正确目录中，然后按下相应的箭头按钮。之后，如果这是一个需要较长时间传输的大文件，你可以去做其他事情。即使你不盯着看，gFTP\
    \ 也能正常运行。文件传输期间，你的 gFTP 界面将呈现如下所示的状态：\n\n![](img/01efe5dd076565746bf3678068ba155c_154_0.png)\n\
    \n### 连接远程服务器\n\n  登录方式与其他任何 FTP 客户端完全相同。你可以在截图中看到用于输入服务器名称、用户名和密码的表单区域。请根据实际情况使用它们。你还可以将当前所在的\
    \ FTP 站点添加为书签，这样下次就不需要重新输入这些信息了。勾选“记住密码”框，甚至可以记住你的密码。这可真是省时的好办法！\n\n![](img/01efe5dd076565746bf3678068ba155c_154_1.png)\n\
    \n  你可以在 gFTP 屏幕右半部分“文件列表”窗口上方的输入框中，将远程服务器目录作为文件名输入；或者通过点击目录、文件夹和文件来浏览远程服务器的文件系统。找到想要传输或修改的文件或目录后，通过单击它来选中。若要修改该文件的权限和特性（假设你有权限在远程服务器上执行此操作），请右键单击该文件，然后从弹出的命令列表中进行选择。所有你熟悉的老命令都在那里。\n\
    \n### 点点鼠标就能操作 Linux！\n\n  由于 Linux 与 Unix 类似，且所有 FTP 文件命令都基于 Unix，因此你也可以使用 gFTP\
    \ 对本地文件进行同样的更改。这通常没有实际意义，因为你有内置的高效文件浏览器，它使在计算机上管理文件比通过 FTP 程序更方便。不过，这是一个小巧可爱的技巧，例如，当你在进行\
    \ FTP 操作时发现文件名有拼写错误，想在忘记之前修改它时，就可以使用。\n\n![](img/01efe5dd076565746bf3678068ba155c_155_0.png)\n\
    \n### gFTP 工具栏\n\n  左侧的图标按钮是在你输入了正确信息（服务器名称、用户名等）后，用于建立连接的。在右侧，标有“FTP”的小按钮允许你切换协议；你可以使用\
    \ gFTP 进行 HTTP 传输，更有用的是进行基于 SSH（Secure Shell 协议）的安全传输。\n\n  工具栏的其他功能不言自明。点击 gFTP\
    \ 窗口顶部的文本菜单项，你会立即看到每个选项可用的功能。只有“帮助”按钮令人失望，因为 gFTP 没有内置手册。另一方面，你也可以认为不需要它，因为 gFTP\
    \ 非常简单、直观且稳定。\n\n  你可以在 www.gftp.org 获取 gFTP 的帮助和信息。\n\n## 第 19 章\n## K3b——简易\
    \ CD 刻录程序\n\n  我们选择 K3b 作为 CD 和 DVD 刻录程序收录在 SimplyMEPIS CD 和本书中，因为它是我们在任何操作系统中使用过的最好且功能最多样的此类程序之一。K3b\
    \ 对音乐、视频和数据的处理都同样出色，并且可以毫无问题地刻录用于直接从光驱启动计算机所需的“ISO”（完整文件系统映像）CD。本节目的原始母版可启动 CD\
    \ 以及随书附带的视频教学 DVD 就是用该程序制作的。\n\n  你也可以使用 K3b 复制几乎任何没有内置复制保护的 CD 或 DVD，尽管你需要注意不要复制受你所在国家版权法保护的电影或歌曲的非法副本。\n\
    \n  请记住，如果你的光驱无法刻录 DVD，那么任何软件——甚至包括 K3b——都无法将其变成 DVD 刻录机。大多数 RW（读写）光驱虽然能*读取* DVD，但不能*制作*\
    \ DVD，即使它们写 CD 时表现出色。\n\n### 运行 K3b\n\n  到目前为止，我们还没有遇到 K3b 无法检测或需要除了点击默认设置中的“确定”之外的任何设置操作的光驱或\
    \ DVD 光驱。当你第一次启动 K3b 时，它将检测到你的 CD RW（或 DVD RW）光驱，仅此而已。很快你会被带到一个开场屏幕，上面显示一个大“工具提示”窗口。\n\
    \n  与其他 Linux 程序一样，你可以通过取消勾选“启动时显示提示”复选框来阻止在启动程序时显示“提示”窗口。在前几次打开程序时让它们显示出来——并且真正阅读它们——可能是个好主意，因为它们包含有用的信息。或者，你可能想点击\
    \ K3b 工具提示窗口四次或五次的“下一步”按钮，一次性阅读所有提示，然后关闭它们以后不再显示。（K3b 非常容易使用，提示不多，所以这可能最好。）\n\n\
    ![](img/01efe5dd076565746bf3678068ba155c_157_0.png)\n\n  现在 K3b 已经设置好（自动完成）并准备运行。让我们来用它做点事情。主启动屏幕提供几个选项。由于我们经常创建数据\
    \ CD，所以我们将选择“新建数据 CD 项目”。在这种情况下，数据将是我们拍摄的一组帆船比赛照片。我们将制作一张包含所有照片的 CD，送给萨拉斯塔帆船协会月度通讯《旗帜》的主编，以便在下一期中出版。\n\
    \n![](img/01efe5dd076565746bf3678068ba155c_158_0.png)\n\n  我们有四种类型的项目可供选择：\n\n\
    1. 新建音频 CD 项目\n2. 新建数据 CD 项目\n3. 新建数据 DVD 项目\n4. 复制 CD\n\n![](img/01efe5dd076565746bf3678068ba155c_158_1.png)\n\
    \n  K3b 将除音乐以外的一切视为“数据”，由于我们要写入 CD，因此我们将选择“新建数据 CD 项目”。\n\n  做出该选择后，我们需要选择要放入\
    \ CD 的数据。K3b 屏幕的上半部分分为两个区域：右侧是文件，左侧是文件夹。我们要将整个“图片”文件夹放入 CD，因此我们将光标放在“图片”目录列表上，同时按住鼠标左键，将其拖到“当前项目”区域，然后释放鼠标按钮。\n\
    \n![](img/01efe5dd076565746bf3678068ba155c_158_2.png)\n\n  我们查看窗口左下角，看到“图片”文件夹中有\
    \ 69.4 兆字节的数据，可以轻松地放入一张 CD。假设我们在光驱中放入了一张空白可记录 CD 或可重写 CD，只剩下一件事要做：点击 K3b 窗口右下角的“刻录”按钮，然后坐下休息。\n\
    \n![](img/01efe5dd076565746bf3678068ba155c_159_0.png)\n\n  制作音乐 CD 的过程完全相同，只是你选择“音频\
    \ CD 项目”，并且可能不想一次选择整个文件夹放入 CD，而是希望逐个文件（即每首音乐）单独放置，以便设置它们在完成的 CD 中的播放顺序。要在“项目”列表中移动文件，只需按住鼠标左键将文件*拖*到你希望的位置，然后在你决定最适合你自定义播放列表的位置释放鼠标按钮即可。\n\
    \n### 更多关于使用 K3b 的信息\n\n  当使用可重复（可重写）CD 时，K3b 会自动“清空”它们——即移除之前存放在上面的内容——但会首先要求你确认此操作，以免你意外删除重要材料。\n\
    \n  复制 CD 的过程不言自明；只需按照屏幕上出现的步骤，遵循屏幕说明即可。\n\n  制作或复制 DVD 的操作与处理 CD 相同，只是你需要拥有 DVD\
    \ 刻录机，而不仅仅是 CD 刻录机，才能使用此功能。\n\n  刻录计算机可直接启动的 ISO 映像（如本书中的 SimplyMEPIS CD）需要稍微不同的步骤。选择“工具”，然后选择“CD”，再选择“刻录\
    \ CD 映像”。（或者，如果你拥有 DVD 写入驱动器，你可以通过点击“DVD”而不是“CD”来刻录可启动 DVD。之后，选择要放入 CD 或 DVD 的\
    \ ISO 映像，你将看到一个专用于 ISO 刻录的特殊屏幕。）\n"
