    ## OpenOffice.org 简介：文字处理、电子表格、幻灯片演示、图形及其他


    OpenOffice.org (OOo) 是一个巨大的、“一站式”办公程序集，它具有许多人习惯在 Microsoft Office 中使用的几乎所有功能，还包括一些
    Microsoft Office 所不具备的功能。它可以完全打开和编辑大多数 Microsoft Office 文档、电子表格和 PowerPoint 演示文稿；在复杂的作品中可能会丢失一些格式，但您会发现实际内容是完整的。


    您还可以将用 Ooo 创建的工作保存为 Microsoft 的格式，尽管在您意识到 Microsoft 格式所占用的硬盘空间是 Ooo“原生”保存格式的两倍之后，您可能只会在需要与仅拥有
    Microsoft Office 的朋友或同事分享您创建的作品时才这样做。为了节省您双方的硬盘空间并减少麻烦，鼓励受 Windows 限制的朋友从 `www.openoffice.org`
    下载并安装适用于 Windows 的 Ooo 免费版本可能是一个不错的选择。


