    ## 8: Mozilla Web Browser


    The easiest way to make a new bookmark is to click "Bookmarks" in either of the
    two places it appears in the menus at the top of your browser window, and click
    "Bookmark This Page." This automatically adds the page you''re on to the bookmark
    list you see whenever you click "Bookmarks." A slightly more sophisticated—and
    much more elegant—way to save bookmarks is to click "Bookmarks" and select "File
    Bookmark." Suddenly you have a lot more options, including a chance to put this
    bookmark on your "Personal Toolbar" next to the "Home" and "Bookmarks" buttons.


    ![](img/01efe5dd076565746bf3678068ba155c_90_0.png)


    The "File Bookmark" dialog box is easy to understand. You already have the address
    and title for the page you want to bookmark—Mozilla picked them up automatically—and
    all you need to do is select a file where you want to keep that page. You can
    give it a shorter name if you like, especially if you''re going to put a lot of
    page links on your Personal Toolbar. Just blank out the long name Mozilla automatically
    inserted in the "Name" space and type in one you like. In the case of "Linux.com:
    The Enterprise Linux Resource," you might decide to call it simply Lc. Or "Linux."
    Then click on the "Personal Toolbar" choice and you''re done.


    ![](img/01efe5dd076565746bf3678068ba155c_90_1.png)


    You can add folders if you want to categorize your bookmarks. In the sample we
    show here, you see "Personal Toolbar," "Shopping," and "Stories." You click on
    whichever folder you want to use to store the page you''re viewing, and its address
    goes there. Click "New Folder" and you create a new folder. Call it anything you
    like. And after you''ve created it, you can put all the bookmarks you want in
    it.


    Going back to the “Bookmarks” button and the drop-down menu, there’s also a “Manage
    Bookmarks” choice.


    You can move bookmarks from file to file, delete them, even put folders within
    folders or add folders to your Personal Toolbar. You can rename folders and bookmarks,
    give them little descriptions, and give them special keywords to help you remember
    them—anything you want.


    Alternately, you don’t have to do any of this. It’s all optional. But keeping
    well-organized bookmark folders can make your Web use a lot easier—and save a
    lot of time when you need to find a site in a hurry that you haven’t used for
    months and which address you may have forgotten.


    ![](img/01efe5dd076565746bf3678068ba155c_91_0.png)


    ### Miscellaneous Mozilla Browser Tips and Tricks


    A great (and very simple) way to customize your Mozilla browser’s look and feel
    is through the options in the “View” menu selection at the top of your browser
    window.


    The “View Source” option is only of interest to Web developers who want to see
    a site’s code, but some of the other options on that menu are important to the
    rest of us. The “Page Info” selection below it is a compendium of information
    about the page that you’re viewing. It’s worth checking out, but isn’t generally
    useful for everyday Web browsing.


    An essential item in the “View” menu is “Text Zoom,” which can immediately increase
    the font size on a site whose designer decided we should all squint to read tiny
    type. You can either use the click-on-menu option or type “Ctrl +” to make type
    bigger. This is a great Mozilla feature. If your eyes are less than perfect you
    may end up using this one a lot.


    Conversely, if you run into a site (usually an amateur one) that uses a giant
    font, you can “Unzoom” through the menu or type “Ctrl -” to make the type smaller.


    “Show/Hide” is another great customization option. For instance, this book’s author
    doesn’t like the “Sidebar” that’s standard in Mozilla because it takes up too
    much of his laptop’s screen for his taste, so he’s unchecked “Sidebar” to get
    rid of it.


    You can also show (or not show) the various menus across the top of your browser
    window, depending on personal taste. This is a time for experimentation, not instruction;
    you can check or uncheck these all you like without hurting a thing, so go ahead
    and do whatever you like.


    The one potential “gotcha” here is if you click “Full Screen.” The method for
    undoing this is not obvious, so here it is: Next to the “X” in the upper right
    hand corner of the screen you’ll see a little icon that seems to be a picture
    of computer monitors nested in each other. Click this, and your browser window
    will return to its normal size.


    The last trick we’ll discuss here is “Apply Themes.” A number of volunteers have
    worked on ways to change Mozilla’s appearance to match a wide variety of tastes.
    It is amazingly easy to download and install new themes. You have several to choose
    from in the Mozilla version included on this book’s SimplyMEPIS CD, but there
    are many more available through the links you’ll see if you click “Apply Themes,”
    then select “Get New Themes.”


    ![](img/01efe5dd076565746bf3678068ba155c_92_0.png)


    ![](img/01efe5dd076565746bf3678068ba155c_92_1.png)


    Changing your browser''s theme will not make it work any better, but sometimes
    it''s worth a little extra effort to have software that not only *behaves* exactly
    as you want it to, but also looks the way you like best.


    ## Chapter 9


    ### 9: Making Web Pages with Mozilla


    This is a very brief introduction to Mozilla Composer; most of us don’t make web
    pages (or at least only make very simple ones), and those of you who are good
    at this kind of work will rapidly find your way around Composer without any hand-holding.


    ![](img/01efe5dd076565746bf3678068ba155c_94_0.png)


    Composer is a simple WYSIWYG (What You See Is What You Get) Web page design tool
    that takes no knowledge of HTML to use, although at least a little knowledge will
    help you turn out a better page. You use it much like a word processor by either
    typing in text or pasting in text you wrote in another word processor or text
    editor, adding pictures, then moving things around in the browser window until
    you like the way everything looks, and saving the end result. There’s a built-in
    “publish” utility that’s supposed to help you send a page you made directly to
    a Web server, but it is of only limited use; you are better off using FTP if you
    are serious about Web publishing. Your SimplyMEPIS CD includes GFTP, a great (and
