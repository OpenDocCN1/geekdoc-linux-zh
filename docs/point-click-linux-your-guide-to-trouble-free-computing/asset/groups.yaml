    你需要在这里输入 root 密码。请记住，只要我们还在从光盘运行，用户就是 root，但我们将在安装过程中选择一个更安全的密码。


    ![](img/01efe5dd076565746bf3678068ba155c_52_0.png)


    ## 关于硬盘分区


    硬盘以通常的数字“开或关”风格存储数据，但它们可以以多种不同的模式存储。Windows 95、98 和 ME 使用一种称为 FAT 32 的方法。Windows
    NT、2000 和 XP 使用一种称为 NTFS 的方法。DOS 和非常旧版本的 Windows 使用 FAT 16。Linux 使用不同的数据存储方法，甚至对不同的驱动器使用不同的名称。Windows
    通常将软盘驱动器称为 A 和 B，硬盘驱动器称为 C，CD 驱动器称为 D，除非有两个或更多硬盘，在这种情况下，硬盘驱动器可以是 E 和 F 和 G 等，而
    CD 驱动器变成最后一个硬盘之后的字母。


    此插图展示了 Linux 如何命名驱动器：


    /dev/floppy 是软盘，/dev/cd 是 CD 驱动器，/dev/hda 是这台电脑的单块硬盘。还有一个 tmpfs，这是一种旨在加快某些类型数据访问速度的临时文件系统，最初是为大型计算机开发的，但在你的
    PC 上也有用。还有一个 /dev/sda1，这是数字相机的闪存卡。


    ![](img/01efe5dd076565746bf3678068ba155c_52_1.png)


    现在到了很酷的分区分部分了。


    虽然 Windows 通常将整块硬盘作为一个大块使用，但你可以通过对硬盘进行分区，使其像多个小硬盘而不是一个大硬盘一样工作，从而让 Windows 运行得稍快一些。这还可以使系统维护更容易。如果你将所有图片和文本文件与程序放在不同的分区中，你只需备份该分区即可备份所有重要数据。


    MEPIS Linux 使用三个分区——你在上一幅插图中看到的 hda2 和 hda4，以及另一个非常小的隐藏 hda3 “交换”（swap）分区（其作用类似于计算机
    RAM 的扩展）。请注意，还有一个 hda1 分区。这是一个 Windows 分区——分区号旁边的 vfat 告诉我们它使用 Windows FAT 系统。


    MEPIS Linux 使用的 ext3 文件系统与 FAT 在许多方面不同，但最明显的一点是，如果你的计算机断电或在未经过“正确”关机程序的情况下关闭，你可以重新启动它而没有任何问题。这是即使是最新版本的
    Windows 也不具备的功能。


    MEPIS Linux 文件系统的最后一个技巧是：默认情况下，它将你的所有个人数据存储在一个 /home 分区中——不仅包括你的照片、文本和音乐，还包括你喜欢的网站书签、电子邮件，甚至你的桌面设置和其他自定义设置，这样你就可以轻松升级甚至重新安装
    MEPIS Linux，而无需在之后进行大量的设置或数据恢复。


    现在我们要处理最棘手的部分：实际对我们的硬盘进行分区。


    目前我们处于安装界面，系统询问我们希望如何进行安装。


    ![](img/01efe5dd076565746bf3678068ba155c_53_0.png)


    ## 4：将 MEPIS Linux 安装到硬盘上


    我们选择自定义分区。这会调出 QParted 实用程序。


    我们点击 hda 来操作我们的单块硬盘。（QParted 允许使用多块硬盘。这就是我们必须点击我们要更改的那个硬盘的原因——即使我们在此例中使用的 PC 只有一块。）


    ![](img/01efe5dd076565746bf3678068ba155c_54_0.png)


    我们现在可以看到那个大的 Windows（FAT）分区。为了缩小它，我们“抓住”右端并向左移动，使其变小。屏幕给出了我们必须允许的最小空间量。最好允许比这多至少
    20%，多 50% 更好，以防我们将来需要添加一些 Windows 文件。


    要实际进行更改——此时我们还可以改变主意——点击软盘的小图标，这是“保存”的近乎通用的符号，但在 QParted 中被称为“提交”（commit），在这里更准确，因为当我们承诺更改分区时，我们无法撤销我们的决定。所以让我们执行并尽快完成。


    现在我们在 Windows 分区右侧有一个大的未分配空间。这就是我们要安装 Linux 的地方。


    我们要创建三个 Linux 分区。第一个称为 mount，所有程序都将放在这里。选择 ext3 作为分区类型。我们希望这个分区至少为 3GB，最大可以是 5GB。然后我们提交。接下来，我们添加一个


    ![](img/01efe5dd076565746bf3678068ba155c_54_1.png)


    小的分区类型称为 swap，它充当额外的 RAM 内存，以防我们用光了所有“真实”的 RAM。这个分区的大小应与我们的 RAM 内存量相当，虽然这不是关键的。将其设置为
    512MB（MB，不是 GB），你就没问题了。我们的第三个分区也是 ext3，是我们的 *home* 分区。


    我们的硬盘现在被一分为二，一半给 Windows，一半给 Linux。我们完成了分区。


    ### 单独安装 Linux


    让我们回到几步之前，当时系统询问我们想要哪种安装类型。如果我们希望在硬盘上单独安装 Linux，我们只需选择“*使用整个磁盘自动安装*”即可。简单多了！


    ![](img/01efe5dd076565746bf3678068ba155c_55_0.png)


    做出此选择并点击“下一步”后，我们只需坐下来观看 MEPIS 自动格式化硬盘并安装自己。


    ![](img/01efe5dd076565746bf3678068ba155c_55_1.png)


    当 MEPIS 安装时，一个小条会爬过屏幕。这需要 5 到 30 分钟，取决于你 PC 的速度。现在是起身、伸展、拿杯咖啡或玻璃杯苏打水、果汁或水的好时机。


    ## 名称和密码


    你的 MEPIS 安装所需的下一次人工干预是，当被问及是否可以将 GRUB（GRAnd Unified Bootloader）实用程序安装在 MBR（主引导记录）中时回答“是”。请继续；如果你是高级
    Linux 用户，你稍后可以自定义你的 MBR。我们其他人对普通的 GRUB 就满意了。它允许我们以最多种类的方式引导 Linux（比大多数人需要的多），并赋予我们引导多个操作系统的能力，如
    Windows 和 Linux 并排——或者甚至两个或三个不同的 Linux 安装，如果我们喜欢的话。


    我们的下一个任务是决定用户名、root 密码，以及——如果你的计算机是局域网的一部分——输入网络的名称，并给你的计算机起一个名称，以便其他计算机在网络上识别它。


    ![](img/01efe5dd076565746bf3678068ba155c_56_0.png)


    用户名可以是任何东西。你可以稍后添加更多用户。用户和 root 密码理想情况下应该是至少六个字符的数字和字母混合，而不是亲戚的名字或其他可以通过侥幸猜测得出的东西。


    ## root 密码很重要！


    root 密码是你安装新的 MEPIS Linux 系统时需要输入的最关键信息之一。如果你知道系统的 root 密码，你可以稍后更改用户名和密码，但如果你不记得
    root 密码，你就无法在不费心重新安装所有内容而不更改任何重要事项。


    root 密码是你抵御恶意黑客的主要防线。你希望它非常难，理想情况下是不可能的猜测，最好通过使用方法随机混合的数字和字母串，例如 32x49xrtgw05567。这种难以破解的密码的问题是，除非你记忆力很好，否则你会忘记它，所以你需要把它写在某处。然后你需要确保你写下它的纸张不被好奇的眼睛看到。


    所以也许你选择一个不那么奇怪的密码。至少确保它不是一个真实的单词。在中间加上一两个数字也无妨。对于非政府工作，这应该足够安全了。只需确保你不要在网站上或可能意外地向全世界暴露该密码的其他地方使用此密码。


    你只需在安装或删除软件、添加或删除用户或以其他方式更改计算机时使用 root 密码。你不会每天都使用它。如果你选择“写下来”的途径，总比忘记好——假设你没有忘记你藏起写有它的纸张的地方，就像本书作者几年前对某个
    root 密码所做的那样……


    还有几个 MEPIS 安装界面。第一个是针对网络上的 Windows 计算机的 Samba 网络。这可以稍后设置，本书的“超越基础”部分将详细介绍更多细节。现在，只需点击“下一步”。最后一个界面是关于安全和拨号的。使用拨号互联网连接的人将在第
    5 章“KPPP—简易调制解调器拨号应用程序”中找到完整的设置说明。在安全方面，MEPIS 会自动设置 Guarddog 防火墙实用程序，任何连接到互联网的计算机（无论运行什么操作系统）都应该有防火墙，所以只需在这里点击“下一步”，不要更改任何内容。


    ![](img/01efe5dd076565746bf3678068ba155c_57_0.png)


    '
