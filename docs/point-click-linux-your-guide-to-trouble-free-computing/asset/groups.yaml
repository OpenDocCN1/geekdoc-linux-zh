    +   * **Mozilla-Firefox**—Web browser based on Mozilla that almost made it onto
    the *SimplyMEPIS* CD; by the time you read this, may be better than the original
    Mozilla

    +   * **Snort**—Network intrusion detection tool that can help you see if bad
    hackers are trying to get into your computer or network


    # ### Just a Few Out of Thousands


    These is just a tiny taste of what''s available to you beyond the *SimplyMEPis*
    CD. There are endless programs for Linux that you can download and install with
    a few clicks. One of your best sources for information on them is *www.freshe
    meat.net*, a Web site that is widely recognized as one of the Web''s most comprehensive
    and up-to-date Linux software lists.


