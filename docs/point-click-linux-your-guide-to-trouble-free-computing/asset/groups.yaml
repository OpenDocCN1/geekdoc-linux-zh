    # Point & Click Linux!


    We''ll start with the “Editors” category.


    ![](img/01efe5dd076565746bf3678068ba155c_187_0.png)


    # Editors


    **Bluefish** and **Quanta+** are both editors designed to help you build professional-level
    Web sites. They are not for HTML beginners; both assume you have a working knowledge
    of HTML and possibly CSS (Cascading Style Sheets), Javascript, and other components
    of a modern, full-featured Web presence. They are also useful for people who write
    text that is going to appear on the WWW rather than in print.


    ![](img/01efe5dd076565746bf3678068ba155c_187_1.png)'
  - '[PAGE 188]


    **Kommander** is included because it’s really part of **Quanta+** but can also
    be used as a standalone program if you need to create advanced features on an
    interactive Web page.


    ![](img/01efe5dd076565746bf3678068ba155c_188_0.png)


    ![](img/01efe5dd076565746bf3678068ba155c_188_1.png)


    **Kate** and **KEdit** are text editors similar to **KWrite**, which we have already
    discussed at length. They’re in your menu because some people like one or the
    other of them more than **KWrite**, the simple KDE text editor preferred by this
    book’s author. This is a matter of personal taste, so we’ve included these alternatives
    for you to try. Use whichever one you like; as we keep saying, it’s your computer,
    not ours.


    ![](img/01efe5dd076565746bf3678068ba155c_188_2.png)


    # ## Games


    We covered the main ones earlier; we’re going to leave you to explore the rest
    of the included ones on your own. On our next section we’ll turn you on to some
    excellent (and popular) ones you may want to download. We would have liked to
    include them for you, but you can only put so much on one CD...


    ![](img/01efe5dd076565746bf3678068ba155c_188_3.png)


    # ## Graphics


    This looks like an incredible number of programs, but most of them in the “More
    Programs” group sticking out to the right are utilities that are called on by
    other programs, not programs you’re likely to use all by themselves. But many
    of the programs in the main graphics menu are directly useful on their own. Some
    highlights:


    ![](img/01efe5dd076565746bf3678068ba155c_188_4.png)'
  - '[PAGE 189]


    **KDePrintFAX** is a fax program that works with several well-known commercial
    Internet fax services, notably HylaFAX (www.hylafax.org/) and eFax (www.efax.com).
    It will also work with your modem, assuming it''s already set up with the KPPP
    utility, and can even be used to fax OpenOffice.org documents directly from OO
    with a little advanced setup work that''s beyond the scope of this book. **KFax**
    is simply a fax viewer that allows you to read faxes sent to you as email attachments
    or by other means. (Remember, faxes are graphics, not text; you need a graphics
    application to read them.)


    **KGhostView** is a program that reads documents formatted in Adobe''s PDF and
    PostScript formats. You''ll probably use it more through your Web browser than
    by itself; it''s the program your browser automatically calls whenever you click
    on a PDF document. There''s also an Adobe Reader program available from Adobe,
    the company that created the PDF format, but licensing restrictions make it hard
    to include in a free Linux CD that you are allowed (even encouraged) to copy and
    share with friends and coworkers.


    ![](img/01efe5dd076565746bf3678068ba155c_189_0.png)


    **Kooka** is a scanner program that works with most common home and small office
    scanners and can even use OCR (Optical Character Recognition) to turn many scanned
    documents into computer-editable text files. It has a well-written illustrated
    manual built into it; click the "Help" button on the main Kooka screen to read
    it.'
