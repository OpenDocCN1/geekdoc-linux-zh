    # Appendix A


    # Guide to Other Popular Linux Distributions


    M EPIS is but one of many Linux distributions. The ten Linux desktop distributions
    listed here were the most popular English-language ones—besides MEPIS—recorded
    by www.distrowatch.com in July 2004.'
  - '[PAGE 259]


    # Mandrake Linux


    This was the first Linux distribution that worked hard to make Linux easy for
    ordinary desktop users. The company that produces it, MandrakeSoft, has had many
    ups and downs since it was founded in 1998, and some of their releases have had
    quality control problems, but Mandrake Linux is now stable and workable for users
    at all levels, not just beginners.


    www.mandrakelinux.com


    # The Fedora Project


    This is a community-developed, freely downloadable distribution that replaces
    the old no-charge version of Red Hat Linux but is still sponsored and supported
    by Red Hat. It is generally targeted more toward hobbyists and experimenters than
    desktop computer users.


    (fedora.redhat.com)


    # Knoppix


    A bootable CD with a collection of GNU/Linux software, automatic hardware detection,
    and support for many graphics cards, sound cards, SCSI and USB devices and other
    peripherals. It is similar to MEPIS in many ways, and will sometimes work with
    "oddball" hardware that give MEPIS trouble, but is somewhat harder to install
    on your hard drive.


    (www.knoppix.com)


    # The Debian Project


    Debian is a true free (in both sense of the word) software project and it''s the
    one on which MEPIS is based. Debian is generally command-line-oriented, but has
    some GUI system tools available.


    (www.debian.org)'
