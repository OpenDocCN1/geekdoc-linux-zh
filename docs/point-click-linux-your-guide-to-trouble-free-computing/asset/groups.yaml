    ## Point & Click Linux!


    To become root, simply type:


    ```

    [username]$su

    ```


    at the command line and then enter the root password when asked.


    You’ll know you’re root when the `$` becomes a `#`, like this:


    ```

    [username]#

    ```


    To end the “super user” session, type:


    ```

    [username]#exit

    ```


    To become another user, use this:


    ```

    [username]$su  username

    ```


    Then provide that user’s password when asked. Escaping from your alternate-identity
    session is the same as from root, just “exit.”


    ## tar


    Tar (an abbreviation of tape archive) provides the means to make, compress and
    decompress archives. Archive in this sense means that many different, separate
    files can be combined into a single file. We call that file the tarball. Keep
    in mind that the compression is an optional, separate task. You can create and
    “melt” tarballs without compressing the data at all.


    The basic format of the tar command is:


    ```

    tar (options) filename-1 …

    ```


    To create a tarball containing everything in a directory named “text” in my home
    directory, I would enter from the command line in my home directory the following
    command:


    ```

    [username]$tar -cf textarchive.tar  text

    ```


    The “-c” option tells tar to create an archive, the “-f” tells it to use the following
    name as the name for the archive it creates.


    The first name given in the previous example becomes the name of the archive.
    Note that you can name it anything you like, but the more meaningful you make
    the name, the easier it will be to handle the tarball later. The ".tar" extension
    indicates it is an uncompressed tarball.


    Here are a few other standard tarball extensions:


    - .tar.gz—a "gunzip" compressed tarball

    - .tar.bz2—a "bunzip2" compressed tarball


    Why is it important to indicate the type of compression used? Good question. The
    answer is that when you "melt" the tarball, you need to know which decompression
    program to use. There are two ways to handle compressed tarballs, the long way
    and the short way.


    The long way is to decompress it first, then use tar to "melt" the tarball back
    into its original component files. Let''s say we have a tar archive named "bigarchive.tgz."
    We could do it in two steps, like this:


    ```

    [username]$gunzip -d bigarchive.tgz

    ```


    The archive would now appear with the name of bigarchive.tar instead of bigarchive.tgz,
    since we told gunzip to decompress it with the "-d" option. Next step is this:


    ```

    [username]$tar -xf bigarchive.tar

    ```


    That would "melt" the tarball and all the original files would be present again.


    Or we could do it all in one step, by adding the "z" option to our tar command,
    telling it that the archive to be melted is in gunzip compression format.


    ```

    [username]$tar -xzf bigarchive.tgz

    ```


    If our original file had been compressed with bunzip2 instead of gunzip—we would
    know this if it was correctly named with the .bz2 extension—we would use the "j"
    option for tar instead of the "z," like this:


    ```

    [username]$tar -xjf bigarchive.bz2

    ```


    Note that the first option in all three cases is "x," meaning to extract the files
    from the archive. When we create the tarballs, the first option is "c."


    Sometimes it is handy to know exactly what is in an archive before you melt it.
    You can list the contents of a tarball by changing that first option to “t.” If
    the archive is compressed, however, you still have to tell tar that it is, using
    the “z” or “j” option as noted previously.


    ## test


    The test command allows you to conditionally perform some task based on the existence,
    type, or status of a file. It also lets you do the same thing by comparing integer
    and string values. For my sake, we’ll keep it as simple as possible and stick
    to file tests while still showing off some of its potential.


    The command here tests for the existence of /var/mail/username (that’s what the
    -e argument does) and sounds a beep if it is found.


    ```

    [username]$test -e /var/spool/mail/username && cat /usr/share/sounds/KDE_Beep_Beep.wav
    >/dev/dsp

    ```


    Note the “&&” operator in the command above, separating the test command from
    the cat command. That’s a logical AND operator, which requires both sides of the
    command to be true or else it won’t execute. If the /var/spool/mail/username file
    does not exist, the test won’t be true and the beep won’t sound.


    What if you want to hear the beep only when you don’t have mail? Cool. Not a problem.
    Just add a NOT operator in front of the -e argument. The ! mark is the NOT operator,
    so our revised test command would look like this:


    ```

    [username]$test ! -e /var/spool/mail/username && cat /usr/share/sounds/KDE_Beep_Beep.wav
    >/dev/dsp

    ```


    In addition to testing for the existence of a file, you can test to see if a file
    is a directory by using the -d argument, or to see if it exists and contains data
    by using the -s argument, or many other optional tests.


    In our case, the username file remains in existence even after your mail client
    has removed the mail. That means our test with the "-e" option is meaningless,
    because it will always be true whether you actually have mail or not. What we
    really want to use is the "-s" option, which ensures the file size is greater
    than zero, like this: `[username]$test -s /var/spool/mail/username && echo "You
    have mail"`


    ## Command-line Help


    `www.mepis.org/forum` is full of command-line gurus.


    `www.linux.com` has many valuable command line tips.


    `www.tldp.org` (The Linux Documentation Project) is a huge compendium of command
    line instructions.


    Appendix C, “Books that Can Help You Become More Proficient with Linux,” lists
    several references that will help you become totally competent with the Linux
    command line.


