    # Chapter 17


    ## Kopete: IM, IRC, and General Chat


    Kopete is an “all-in-one” tool that gives you access to AIM, ICQ, MSN, Yahoo!
    and other popular “online chat” services, plus Internet Relay Chat (IRC). It is
    simple to set up and configure. You can use it without any configuration beyond
    adding accounts with the simple account “wizard,” but if you want to spend a few
    extra minutes, you can choose background colors, formats in which messages appear,
    and many other things that will make Kopete truly yours.


    ### Set Up Kopete to Access AIM


    We’ll use AOL Instant Messenger (AIM) as an example, but the Kopete Setup Wizard
    works the same way with all popular chat services. The first time you open Kopete
    by clicking on the Kopete icon in the panel at the bottom of your screen, the
    “Signup Wizard” will open automatically.


    The Wizard is just as “wizard-like” as you’d expect a setup wizard to be: You
    follow instructions, click “Next” when you finish with each screen until you come
    to the last one, and click “Finish” to save the username and password you’ve typed.


    ![](img/01efe5dd076565746bf3678068ba155c_145_0.png)


    The Setup Wizard assumes that you already have an account on your chosen service
    (AIM in our example). If you don’t, there’s a link in the lower left corner of
    each signup screen that goes to the Web page where you can sign up for an account
    on that service, then come back and set Kopete to work with it.


    ![](img/01efe5dd076565746bf3678068ba155c_145_1.png)


    After you have AIM—or another service—set up, when you start Kopete you won''t
    get a Setup Wizard automatically; to enter information for another account you
    click "Settings" at the top of the little Kopete window that pops up when you
    start the program, then select "Configure Kopete" at the bottom of the little
    menu the click on "Settings" brought to your screen.


    ![](img/01efe5dd076565746bf3678068ba155c_146_0.png)


    From this screen, pick "Accounts" and you''ll see the AIM account you already
    set up. Click "New" on the right side of this little screen to bring up the Account
    Wizard, then "Next" to show a list of services to which Kopete can connect you—exactly
    the same as when you set up the AIM account, and all of them except Internet Relay
    Chat (IRC) are set up the same way.


    ![](img/01efe5dd076565746bf3678068ba155c_146_1.png)


    The one other choice you might want to make when you''re setting up instant messaging
    accounts in Kopete is to click the "Connection" tab you see peeking over the top
    of "Edit Account" screen when you click "Modify" after highlighting an account
    you''ve already set up. There''s only one choice here: Do you want to log onto
    this service automatically every time you start Kopete? If that''s what you want,
    click the "Connect automatically at startup" box. If not—or if you decide you
    no longer want automatic startup that you originally set that way, click on that
    little box to uncheck it.


    ![](img/01efe5dd076565746bf3678068ba155c_147_0.png)


    ### Introducing IRC


    Fewer than one million of all the people in the world with Internet connections
    use IRC, yet it is one of the most efficient ways there is to organize group or
    individual chats. IRC is in many ways like an underground "elite" section of the
    Internet. Most IRC networks are run by volunteers, and while some networks have
    chat channels for every topic in the world—literally everything from cross-cultural
    dating to discussions about TV "reality" shows—many of us use it primarily as
    a rapid way to give and get technical help. This book''s author tends to "hang
    out" on irc.oftc.net and irc.slash-net.org. Another popular network for Linux
    people is irc.freenode.net, which is where the official #mepis help channel is
    located.


    If you''ve never used IRC, this is as good a time as any to try it out.


    ### IRC with Kopete


    IRC setup is a little more complicated, but not much. You start with the same
    “Account Wizard” screen. From there you click “New,” then “Next,” then “IRC” from
    the list of messaging services. Another “Next” takes you to the IRC setup screen.


    ![](img/01efe5dd076565746bf3678068ba155c_148_0.png)


    Note that there are three tabs here. You’ll need to use at least two of them to
    get your connection going. Indeed, the one you’ll need to use beyond the “Basic
    Setup” screen where you type in your nickname and username is the “Connection”
    screen, where you’ll type in the IRC server to which you want to connect. While
    you’re on that screen, decide whether or not you want to connect to that network
    every time you start Kopete.


    ![](img/01efe5dd076565746bf3678068ba155c_148_1.png)


    The third IRC setup screen says it’s for “Advanced Configuration,” but it’s not
    really advanced. You use this screen to set up any channels you want to join automatically,
    using the standard IRC `/join #channel!` command, plus you use it to decide if
    you want to set up for CCCP file-passing via IRC. (If you’re not a skilled IRC
    user and don’t understand all of IRC, don’t worry. You don’t need to use IRC at
    all, and even if you want to start using it, all you need to know is which servers
    and channels you want to join.)


    ![](img/01efe5dd076565746bf3678068ba155c_149_0.png)


    ### “Which IRC Channels Should I Join?”


    The only sane answer to this question is another question: “What are your interests?”
    There are tens of thousands of IRC channels. Some are centered on computers and
    software; almost every program included on your *SimplyMepis* CD has at least
    one dedicated IRC channel where you can go for help, and you can find IRC channels
    for almost any non-computer interest, from dating to sailing to your favorite
    video game or TV show.


    An obvious first channel for you to join is **#mepis** on **irc.freenode.net**.
    It’s the MEPIS help channel. Another one you may want to check for general Linux
    help, also on **irc.freenode.net**, is **#linux**.


    To find more channels, a great place to start is the web site **SearchIRC.com**.
    It doesn’t list every IRC chat room in the world—IRC channels come and go so fast
    that no one can keep up with the constant changes—but it lists thousands of the
    more popular ones and even has a little IRC utility built into the Web site you
    can use to check out a channel before you decide to add it to your Kopete list.


    ![](img/01efe5dd076565746bf3678068ba155c_149_1.png)


    ### Configuring Kopete''s "Look and Feel"


    This is not hard, and it''s strictly optional. Select the "Settings" option from
    the top of your Kopete screen, then "Configure Kopete," and from the screen that
    gives you, either select "Appearance" or "Behavior." Either one will give you
    several tabs to choose, like "General" or "Chat Window." These are areas where
    experimenting is safe, and even encouraged. At the worst, if you make something
    look strange, you can go back to the screen where you made the change and hit
    the "Defaults" button at the bottom, and everything will go back to the way it
    was before you started experimenting.


    ![](img/01efe5dd076565746bf3678068ba155c_150_0.png)


    ### Where to Get Kopete Help


    - LinuxQuestions.org

    - kopete.kde.org

    - irc.kde.org, #kopete


    # Chapter 18


    ## gFTP—An Easy, Powerful FTP Program


    You can do basic data downloads directly through your Mozilla browser, but when
    it comes to heavy-duty uploading and downloading, especially to an FTP (File Transfer
    Protocol) server you manage yourself, nothing beats having a dedicated FTP program.
    We like gFTP so much that we used it to transfer all Point & Click Linux video,
    text, and image files. It is the best, most reliable, and most versatile “point
    and click” FTP program we have ever used.


    ![](img/01efe5dd076565746bf3678068ba155c_152_0.png)


    > **Read this chapter only if you use FTP**

    >

    > This chapter is intended for experienced FTP users. If you don’t use FTP, feel
    free to skip it. If you want to learn about FTP, your ISP probably has an FTP
    tutorial online. If not, the one at `www.ftppplanet.com/Enterprises/basics.htm`
    is fairly good, and if you key the words “FTP tutorial” into any search engine
    you will find many more.


    ### FTP Has Gotten Easier to Use Over the Last Decade


    For many years, basic FTP programs were 100% command line-based. You typed in
    long strings of text that were only partially in human-readable language to accomplish
    your goals. People who used command line FTP programs tended to mutter things
    like “chmod 644 permissions changed user read-only” in their sleep, because if
    they didn’t remember all the commands they couldn’t do their jobs. Luckily, command-line
    FTP is now strictly the province of hard-core Unix and Linux users, and the rest
    of us can get exactly the same results without using a command line or memorizing
    all those lines of computerese.


    gFTP follows the same basic “Local computer files on the left, remote computer
    files on the right” format as almost every other GUI FTP program. Here’s an example
    of the file structure for the MBRPIS. `org` private “beta test” download server:


    ![](img/01efe5dd076565746bf3678068ba155c_153_0.png)


    We’ve made that window wider by grabbing the line to its left (just to the right
    of the “Arrow” buttons) with our mouse and pulling it left until we could see
    all the information we wanted. All gFTP windows can be resized this easily.


    ![](img/01efe5dd076565746bf3678068ba155c_153_1.png)

