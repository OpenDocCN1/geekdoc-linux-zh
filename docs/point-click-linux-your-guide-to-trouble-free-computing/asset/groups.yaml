    ## Point & Click Linux!


    The first step in creating a presentation with OOO is to click on the "seagull"
    icon in the control panel at the bottom of your computer screen. From the menu
    this brings up, choose "Impress." That gives you a utility that guides you through
    the process of creating a (hopefully) impressive presentation.


    ![](img/01efe5dd076565746bf3678068ba155c_113_0.png)


    There are "Autopilots" for all OOO functions; these are essentially templates
    that take most of the work out of formatting a document, spreadsheet or presentation.
    Most people we''ve watched creating documents don''t use the Autopilot function
    unless they''ve created their own custom document templates, a topic covered quite
    well in the "Help" index mentioned earlier, but Autopilot is helpful for graphically
    challenged folks (like this author) who need to create slides from time to time.


    This is another moment when clicking on things to see what happens is easier than
    reading about what to click. If you don''t like a choice you''ve made, click "Back"
    and make a different one. You can always change your slides later, anyway, so
    a mistake here is not crucial. In any case, after a few clicks you''ll come to
    a screen that gives you a number of slide layout choices:


    ![](img/01efe5dd076565746bf3678068ba155c_113_1.png)


    Talented artists can start with a blank screen and create their own; the rest
    of us are probably better off—especially at first—using some of the built-in layout
    options. As you can see, there are plenty of them.


    So we chose one, and you can see that it has simple instructions on it. To put
    in our own words, we click where it says “Click” and those words disappear so
    we can type in our own:


    ![](img/01efe5dd076565746bf3678068ba155c_114_0.png)


    We can add more bullet points without thinking; a new one comes up every time
    we hit our “Enter” key, until our slide looks like this:


    ![](img/01efe5dd076565746bf3678068ba155c_114_1.png)


    It''s time to save this file and start making our next slide. We save our presentation
    the same way we save any other work we''ve done: Either with “Ctrl+S” or by clicking
    the “File” selection in the top left-hand corner of our screen and selecting “Save”
    from the menu. We can choose a file format, but for the moment it''s best to use
    the default ".sxi" format; this is only our first slide, and we''re going to make
    more.


    We start our next slide by looking down at the bottom left of the slide we''ve
    just made. We see a little tab that says “Slide 1” and click to its right.


    ![](img/01efe5dd076565746bf3678068ba155c_115_0.png)


    That gives us Slide 2, but we don''t have to use the same layout.


    ![](img/01efe5dd076565746bf3678068ba155c_115_1.png)


    By clicking on the “Slide 2” Tab with our *right* mouse button, we bring up the
    same template selections we had earlier, and we can choose a new one. Maybe, because
    we''ve decided we''d rather go sailing, we''ll choose a blank slide and fill it
    with a nice picture of a sailboat. We insert, place, and size the image exactly
    the same way we did in a “Writer” document, and we get a slide that looks like
    this:


    ![](img/01efe5dd076565746bf3678068ba155c_115_2.png)


    We can add text over the image by clicking on the “T” to the left of our slide.


    ![](img/01efe5dd076565746bf3678068ba155c_116_0.png)


    That will put a blinking black cursor right in the middle of our picture, but
    if we type a word or two, right-click on one of the words, and click “Text” on
    the menu that gives us, we''ll get a new dialog box that lets us put the text
    where we want it—and do other things, like animate it if we''re so inclined.


    ![](img/01efe5dd076565746bf3678068ba155c_116_1.png)


    With text added, our number two slide now looks like this:


    ![](img/01efe5dd076565746bf3678068ba155c_116_2.png)


    We can change text color, size, and general appearance by clicking on our friend
    the "Text" icon, highlighting the text by holding the left mouse button down while
    we pass our cursor over it, and selecting text changes from the row of buttons
    at the top edge of our working window:


    ![](img/01efe5dd076565746bf3678068ba155c_117_0.png)


    We have many text options to choose from. Again, click around and try things.
    You can always do "Ctrl+Z" or select "Undo" from the "Edit" menu if you don''t
    like your last round of changes. Nothing is permanent until you do "Ctrl+S" or
    use the "File" menu to do a "Save" or "Save As"—and even then, you can open the
    file later and change everything if you have a sudden inspiration while you''re
    out sailing.


    You can now make all the slides you want by repeating the previous steps. After
    you get a few simple presentations under your belt, experiment with fancier ones.
    OOO will do all kinds of special effects, including animated transitions between
    slides. The sky and your imagination are the only limits.


    ## Chapter 13

    ## OpenOffice Draw


    This is a simple program that won''t do much for graphics professionals—or even
    skilled amateurs—but is useful for fast preparation of pictures you plan to use
    in OOO text documents or slide presentations. For "real" graphics work in Linux,
    we''ve included the GIMP (GNU Image Manipulation Program), an award-winning graphics
    program with so many features and plug-ins that we''ll barely scratch their surface
    in Chapter 20, "The GIMP—full-featured Graphics Application." But right now we''re
    talking about OpenOffice.org, so let''s use OOO Draw to get an image ready for
    publication in an OOO text document.


    ![](img/01efe5dd076565746bf3678068ba155c_118_0.png)


