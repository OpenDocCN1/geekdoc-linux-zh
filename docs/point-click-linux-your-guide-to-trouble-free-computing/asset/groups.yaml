    # Chapter 24


    ## Downloading and Installing Software


    Linux software installation was difficult back in the bad old days. It got easier
    with the development of the Red Hat Package Management (RPM) system, and even
    easier with the Debian apt (a package tool) system, because in addition to installing
    the software you need, apt makes sure any other software your selected program
    needs to operate is automatically installed along with it. Still, apt is a command-line
    application that intimidates many computer users, so MEPIS uses a customized version
    of KPackage, a software management program that is part of KDE, to make working
    with Debian''s apt and apt-get utility click-click simple.


    # Point & Click Linux!


    The list of programs in the **KPackage** screen shown here is of software programs
    already installed on your computer. Many of them are background utilities that
    control basic computer functions you don''t need to think about as you sit at
    your keyboard, the sort of thing all operating systems have buried somewhere


    ![](img/01efe5dd076565746bf3678068ba155c_201_0.png)


    deep inside them but don''t let you look at or change. This is one of the great
    things about open source software like Linux. Nothing is hidden from you. This
    is also part of its security. There is no way spyware or other software you don''t
    want can be hidden on your computer. Even if you don''t spot the evil software
    yourself, someone else is likely to notice it, and if you check Linux information
    sites like Linux.com regularly, you can keep up with the latest changes—and easily
    download and install any security patches with KPackage.


    ## Choosing Your Package Sources


    This is the first step in setting up to install new software: You need to decide
    where you''re going to get it. This isn''t done with KPackage, but through the
    **MEPIS System Center** you reach either by clicking the appropriate desktop icon
    or selecting it from the “System” section of your main software menu.


    ![](img/01efe5dd076565746bf3678068ba155c_201_1.png)


    When you click the *System Center* icon, the first thing you''ll see is a request
    for your root password.


    ![](img/01efe5dd076565746bf3678068ba155c_201_2.png)


    ## Why You Need to Type Your Root Password Here


    You need to type in your root password almost every time you do anything that
    can affect your whole computer. This is an inconvenience, but it’s a tiny one
    compared to the damage a single virus could do, not to mention the computer havoc
    a small child or pet can cause by clicking random keys. It’s a worthwhile inconvenience,
    rather like making sure you lock your door when you leave your house.


    So we’ve spent the second it takes to type in our password and we’re at the same
    **MEPIS System Center** screen we saw when we were setting up our networking—except
    this time we click on the “Package Management” choice and the right side looks
    entirely different.


    In this illustration, you see you have several software sources you can choose:


    ![](img/01efe5dd076565746bf3678068ba155c_202_0.png)


    - “Use MEPIS CDs” is for people who have purchased additional software CDs through
    the MEPIS.Org Web site either because they don’t have an Internet connection fast
    or reliable enough for software downloading or because they’re willing to pay
    a nominal fee in return for the convenience of getting their software on CDs.

    - “Use Internet” connects you to the Debian server pool that’s chock-full of excellent
    free software. (Learn more about Debian in Chapter 28, “Joining the Linux Community.”)

    - “Include non-US packages” connects you to servers that carry software that is
    usually useful and well written, but may not be legal for U.S. residents to use
    because of patent or copyright restrictions.

    - “User defined sources” have several trusted, private servers listed for special
    software; you can add more if you like—and if you subscribe to the MEPIS private
    servers, this is where you paste in your subscription information.


    # Point & Click Linux!


    The most conservative choice is a MEPIS subscription or purchasing MEPIS CDs.
    This way, every single program will have been tested and proven to work correctly
    with other MEPIS software. Slightly riskier, but still quite safe, is the “use
    Internet” option. It connects you to the volunteer-run Debian servers. Programs
    on these servers have all been tested, but not necessarily with all other programs
    available. Note that we are not talking about virus worries or other *major* risks,
    just that you may download a program and find it doesn’t work correctly with MEPIS—and
    need to click a few times to uninstall it. Next come the “non-US” packages. Remember,
    these may be programs that are not legal under U.S. law, so if you are in the
    U.S. you use them strictly at your own risk.


    “Include source code packages” is a special case. This is for those of you who
    are either programmers or learning how to program, and want to examine (and perhaps
    change) the code behind some of the software on our computer.


    But enough of that. For this demonstration we’ll “Use Internet,” so it’s time
    to click “Apply” and call up **KPackage** by clicking the K-Gear in your control
    panel and going to the “System” submenu. (At this point you can close the MEPIS
    System Center. Or you can leave it open. It doesn’t matter one way or the other.)


    ## Using KPackage


    The first thing we want to do is have **KPackage** check the Debian servers for
    the latest software updates. We do this by using the “Special” link in the upper
    left hand corner of the screen to take us to “APT: Debian ->” and from there to
    “Update,” which we click, and then type in our root password when asked.


    ![](img/01efe5dd076565746bf3678068ba155c_203_0.png)


    When we started **KPackage**, it checked our computer to see exactly what programs
    were installed. Now we’re going to wait another few seconds (or longer on a slow
    Internet connection) while **KPackage** downloads the latest software information
    for us. (If you see a note that a server or two isn’t available, don’t worry.
    There are many Debian “mirror” servers, and if several of them aren’t working
    properly at the moment it doesn’t stop us; our apt program automatically finds
    working download servers for us.)


    ## 24: Downloading and Installing Software


    Next, we select the tab “all” so that we have a full list not only of the software
    we already have installed, but also of the 10,000+ packages available for download.


    ![](img/01efe5dd076565746bf3678068ba155c_204_0.png)


    When that’s done, we can select a specific package to download and install. The
    easiest way to do this if you know the name of the program you want is to use
    the search tool, which you call up by clicking on the top (of two) magnifying
    glass icons on the left edge of the KPackage window. We’re going to search for
    Abiword, a word processing program that doesn’t have all of OpenOffice.org’s features,
    but loads much faster and is somewhat easier to use.


    ![](img/01efe5dd076565746bf3678068ba155c_204_1.png)


    We can read a little about Abiword in the right-side KPackage window. And if we
    want to learn more, there’s a Web site listed where we can go and learn all about
    Abiword before we install it. But that’s almost a “Why bother?” thing. Installing
    (and uninstalling) software with the mighty team of Debian, MEPS, and KPackage
    on our side makes it easier to simply download and try it, which we do by clicking
    the install button below the right-side window.


    ![](img/01efe5dd076565746bf3678068ba155c_204_2.png)

