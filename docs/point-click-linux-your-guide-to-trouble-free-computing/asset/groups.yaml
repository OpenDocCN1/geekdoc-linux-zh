    # 点选式 Linux！


    **KNetLoad** 是另一个图标，点击它会显示文本统计信息。


    **XKill** 是一种最后手段。点击 **XKill**，然后点击一个已冻结或行为异常的 program 窗口，**砰！** 该程序就会关闭并消失。唯一可能在以这种方式被强制终止后给你带来麻烦的程序是
    Mozilla（万幸的是，这种情况几乎不会发生）。如果你用 **XKill** 终止了 Mozilla，你可能需要重新启动电脑才能让 Mozilla 恢复正常工作。


    ![](img/01efe5dd076565746bf3678068ba155c_197_0.png)


    ## 实用工具


    这些是一些用于处理各种杂务的小程序。我们将在下一章介绍**Ark**，这是一款归档工具。其他实用工具的功能不言自明。只需点击它们，看看会发生什么。并非所有人都觉得这些小程序有用，但足够多的人觉得其中的一些很有帮助，因此将它们保留在这里供你使用。


    ![](img/01efe5dd076565746bf3678068ba155c_197_1.png)


    至此，我们稍作休息。休息之后，就该开始探索一些通过添加（或移除）软件以及一般性地调整设置来定制 Linux 的方法，以符合个人喜好。


    # 第三部分


    ## 超越基础


    - 第 24 章 下载和安装软件 ... . . . . . . . . . . . 187

    - 第 25 章 与 Windows 协作 ... . . . . . . . . . . . . 195

    - 第 26 章 定制 MEPIS Linux ... . . . . . . . . . . . . 203

    - 第 27 章 尝试命令行操作 ... . . . . . . . 215

    - 第 28 章 加入 Linux 社区 ... . . . . . . . . . . . . . 231


    ![](img/01efe5dd076565746bf3678068ba155c_198_0.png)


    # 第 24 章


    ## 下载和安装软件


    在以前的旧时光里，Linux 软件安装非常困难。随着 Red Hat 包管理系统（RPM）的出现，安装变得更容易了；而使用 Debian 的 apt（一种包管理工具）系统后，安装变得更容易了，因为除了安装你需要的软件外，apt
    还会自动安装你选定的程序运行所需的其他软件。尽管如此，apt 仍然是一个命令行应用程序，这让许多计算机用户感到畏惧，因此 MEPIS 使用 KPackage
    的定制版本来简化与 Debian 的 apt 和 apt-get 实用工具的操作。KPackage 是一个属于 KDE 的一部分的软件管理程序，使得操作变得点选简单。


    # 点选式 Linux！


    此处显示的 **KPackage** 屏幕中的程序列表是你计算机上已安装的软件程序。其中许多是后台实用工具，用于控制基本计算机功能，这些功能在你坐在键盘前时无需关心。这是所有操作系统都隐藏在内部某处的东西


    ![](img/01efe5dd076565746bf3678068ba155c_201_0.png)


    深埋其中，但不让你查看或更改。这是像 Linux 这样的开源软件的一大优点。没有任何东西对你隐藏。这也是其安全性的一部分。恶意软件或其他你不希望存在的软件无法隐藏在您的计算机上。即使你自己没有发现恶意软件，其他人也可能会注意到。如果你经常查看
    Linux.com 等 Linux 信息网站，你可以随时掌握最新变更——并通过 KPackage 轻松下载和安装任何安全补丁。


    ## 选择软件包源


    这是设置安装新软件的第一步：你需要决定从哪里获取软件。这不是通过 KPackage 完成的，而是通过 **MEPIS 系统中心** 来完成，你可以通过点击相应的桌面图标，或从主软件菜单的“System”部分进行选择来访问它。


    ![](img/01efe5dd076565746bf3678068ba155c_201_1.png)


    当你点击 *系统中心* 图标时，你看到的第一个提示是要求输入你的 root 密码。


    ![](img/01efe5dd076565746bf3678068ba155c_201_2.png)


    ## 为什么你需要在这里输入 Root 密码


    几乎每次执行可能影响整个计算机的操作时，你都需要输入 root 密码。这确实有点麻烦，但与单个病毒可能造成的损害相比，这微不足道，更不用说小孩或宠物随机点击键盘可能造成的电脑混乱了。这是值得的麻烦，就像离家出门时确保锁门一样。


    因此，我们花了输入密码的几秒钟，来到了与设置网络时相同的 **MEPIS 系统中心** 屏幕——不过这次我们点击“Package Management”选项，右侧看起来完全不一样了。


    在此说明中，你可以看到有几个可供选择的软件源：


    ![](img/01efe5dd076565746bf3678068ba155c_202_0.png)


    - “使用 MEPIS 光盘”适用于那些通过 MEPIS.Org 网站购买了额外软件光盘的人，要么是因为他们的互联网连接不够快或不够可靠以进行软件下载，要么是因为他们愿意支付象征性的费用以换取通过光盘获取软件的便利。

    - “使用互联网”将你连接到装满优秀免费软件的 Debian 服务器池。（在第 28 章“加入 Linux 社区”中了解更多关于 Debian 的信息。）

    - “包含非美国软件包”将你连接到提供通常有用且编写良好的软件的服务器，但由于专利或版权限制，这些软件可能不适用于美国居民。

    - “用户定义源”列出了几个用于特殊软件的受信任的私有服务器；如果你愿意，可以添加更多——如果你订阅了 MEPIS 私有服务器，这是你粘贴订阅信息的地方。


    # 点选式 Linux！


    最保守的选择是 MEPIS 订阅或购买 MEPIS 光盘。这样，每个程序都经过测试并证明能与其他 MEPIS 软件正确协作。稍有风险但仍然相当安全的是“使用互联网”选项。它将你连接到由志愿者运行的
    Debian 服务器。这些服务器上的程序都经过测试，但不一定与其他所有可用程序兼容。注意，我们讨论的不是病毒担忧或其他*重大*风险，只是你可能下载一个程序，发现它无法与
    MEPIS 正确协作——并需要点击几次来卸载它。接下来是“非美国”软件包。请记住，这些可能是根据美国法律不适用的程序，因此如果你在美国，使用它们需自行承担风险。


    “包含源代码软件包”是一种特殊情况。这是为那些是程序员或正在学习编程，并希望检查（并可能修改）计算机上某些软件背后代码的人准备的。


    不过，先说这些吧。对于这个演示，我们将“使用互联网”，所以现在点击“应用”，通过点击控制面板中的 K-Gear 并转到“System”子菜单来调用 **KPackage**。（此时你可以关闭
    MEPIS 系统中心。或者你可以保持打开。无论哪种方式都无关紧要。）


    ## 使用 KPackage


    我们要做的第一件事是让 **KPackage** 检查 Debian 服务器以获取最新的软件更新。我们通过使用屏幕左上角的“Special”链接将其带到“APT:
    Debian ->”，然后从那里进入“Update”并点击，然后在要求时输入我们的 root 密码来完成此操作。


    ![](img/01efe5dd076565746bf3678068ba155c_203_0.png)


    当我们启动 **KPackage** 时，它检查了我们的计算机以查看具体安装了哪些程序。现在我们要再等几秒钟（在互联网连接较慢的情况下可能需要更长时间），让
    **KPackage** 为我们下载最新的软件信息。（如果你看到某台或几台服务器不可用的提示，别担心。有许多 Debian“镜像”服务器，即使其中几台目前工作不正常，也不会阻止我们；我们的
    apt 程序会自动为我们找到可用的下载服务器。）


    ## 24：下载和安装软件


    接下来，我们选择“all”标签页，这样我们不仅拥有已安装软件的完整列表，还拥有超过 10,000 个可供下载的软件包。


    ![](img/01efe5dd076565746bf3678068ba155c_204_0.png)


    完成后，我们可以选择特定的软件包进行下载和安装。如果你知道想要程序的名称，最简单的方法是使用搜索工具，通过点击 KPackage 窗口左边缘的两个放大镜图标中的上面那个来调用它。我们要搜索
    Abiword，这是一款文字处理程序，它不具备 OpenOffice.org 的所有功能，但加载速度快得多，使用也相对简单一些。


    ![](img/01efe5dd076565746bf3678068ba155c_204_1.png)


    我们可以在右侧的 KPackage 窗口中阅读关于 Abiword 的一些信息。如果我们想了解更多，那里列出了一个网站，我们可以去那里在安装前了解 Abiword
    的所有细节。但这几乎是个“何必麻烦”的事情。在强大的 Debian、MEPS 和 KPackage 团队的支持下安装（和卸载）软件，使得简单下载并试用变得更容易，我们通过点击右侧窗口下方的安装按钮来完成这一操作。


    ![](img/01efe5dd076565746bf3678068ba155c_204_2.png)


