    While OpenOffice.org Calc is not a true database, we can use it as one, either
    as its only function or in addition to its true function as a spreadsheet, which
    involves calculations of one kind or another—and is why it''s called “Calc” instead
    of “Database” or “File.”


    # # Calculating with Calc


    Let''s be lazy. Instead of using an entire year''s worth of sales information
    for our hypothetical customers, let''s just use one quarter, or three months.
    This will save typing (and reading) in our example, and will teach us just as
    much.


    # **Big spreadsheets are just like small ones, only bigger**


    Working with data covering large numbers of customers and many years of sales
    takes no more computer knowledge than working with a few sample customers and
    a few months’ worth of sample data. So, whatever skills you learn here will be
    useful when you become CEO of a worldwide corporation with millions of customers.
    You can sit on the deck of your yacht, using a spreadsheet running on your gold-plated
    laptop to decide how many thousands of employees you will lay off before your
    afternoon swim.


    Here''s our sample data. We''re going to display the total sales to each client
    company in column “E” and average monthly sales in column “F.”


    | | A | B | C | D | E |

    | :--- | :--- | :--- | :--- | :--- | :--- |

    | 1 | | January | February | March | |

    | 2 | BangaGoods | $31,243.00 | $38,210.00 | $26,450.00 | |

    | 3 | BeehIndostan | $11,250.00 | $10,500.00 | $12,200.00 | |

    | 4 | BombayClo/Heire | $61,535.00 | $74,982.00 | $66,658.00 | |

    | 5 | Bengal Works | $24,980.00 | $21,650.00 | $34,967.00 | |

    | 6 | OnshoreResource, Inc. | $4,200.00 | $25.00 | $26,450.00 | |


    The command we use to create a total sales figure for one of these companies is
    =SUM (B2:D2), and that’s extremely arcane the first time we want to do it, so
    we let OoO guide us through the process by clicking on the $f(x)$ symbol in our
    Calc toolbar.


