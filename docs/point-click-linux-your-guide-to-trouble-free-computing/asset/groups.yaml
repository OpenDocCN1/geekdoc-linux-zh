  - '[PAGE 220]


    # Right-Click for Fast Desktop Customization


    We wanted to show you the KDE Control Center because it does more than configure
    the desktop, but for fast changes to your desktop appearance, right-click on any
    exposed desk- top space (not covered by a program window—and if your desktop is
    completely covered, you can use the “Show Desktop” button next to the menu-opening
    K-Gear to clear it) to bring up a little menu box full of things you can do to
    your desktop. Click on them, play with them, and see what happens when you “Apply”
    your changes—just “Revert” or go back to “Defaults” if you don’t like what you
    see.


    ![](img/01efe5dd076565746bf3678068ba155c_220_0.png)


    The panel behaves the same way; right-click anywhere on it and a menu pops up
    that gives you several choices, including the ability to add buttons that open
    programs to the panel so you don’t need to go rooting around in the menu for ones
    you use all the time.


    To add a new application button, click “Panel Menu.” From there, choose “Add”
    and then choose “Application Button,” which takes you to the same categorized
    list of programs you get by clicking the K-Gear icon. Click on the program you
    want to create an icon for, and it appears. If you want to move it, right- click
    on it, click on “Move (whatever) Button” (—(what- ever) being the name of the
    button you right-clicked on—and…move it. Want to remove it? Click “Remove Panel
    Button” and it’s gone.


    ![](img/01efe5dd076565746bf3678068ba155c_220_1.png)


