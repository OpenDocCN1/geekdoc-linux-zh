    # # IRC with Kopete


    IRC setup is a little more complicated, but not much. You start with the same
    “Account Wizard” screen. Form there you click “New,” then “Next,” then “IRC” from
    the list of messaging services. Another “Next” takes you to the IRC setup screen.


    ![](img/01efe5dd076565746bf3678068ba155c_148_0.png)


    Note that there are three tabs here. You’ll need to use at least two of them to
    get your connection going. Indeed, the one you’ll need to use beyond the “Basic
    Setup” screen where you type in your nickname and username is the “Connection”
    screen, where you’ll type in the IRC server to which you want to connect. While
    you’re on that screen, decide whether or not you want to connect to that network
    every time you start Kopete.


    ![](img/01efe5dd076565746bf3678068ba155c_148_1.png)'
  - '[PAGE 149]


    The third IRC setup screen says it’s for “Advanced Configuration,” but it’s not
    really advanced. You use this screen to set up any channels you want to join automatically,
    using the standard IRC `/join #channel!` command, plus you use it to decide if
    you want to set up for CCCP file-passing via IRC. (If you’re not a skilled IRC
    user and don’t understand all of IRC, don’t worry. You don’t need to use IRC at
    all, and even if you want to start using it, all you need to know is which servers
    and channels you want to join.)


    ![](img/01efe5dd076565746bf3678068ba155c_149_0.png)


    # “Which IRC Channels Should I Join?”


    The only sane answer to this question is another question: “What are your interests?”
    There are tens of thousands of IRC channels. Some are centered on computers and
    software; almost every program included on your *SimplyMepis* CD has at least
    one dedicated IRC channel where you can go for help, and you can find IRC channels
    for almost any non-computer interest, from dating to sailing to your favorite
    video game or TV show.


    An obvious first channel for you to join is **#mepis** on **irc.freenode.net**.
    It’s the MEPIS help channel. Another one you may want to check for general Linux
    help, also on **irc.freenode.net**, is **#linux**.


    To find more channels, a great place to start is the web site **SearchIRC.com**.
    It doesn’t list every IRC chat room in the world—IRC channels come and go so fast
    that no one can keep up with the constant changes—but it lists thousands of the
    more popular ones and even has a little IRC utility built into the Web site you
    can use to check out a channel before you decide to add it to your Kopete list.


    ![](img/01efe5dd076565746bf3678068ba155c_149_1.png)'
  - '[PAGE 150]


    # Configuring Kopete''s "Look and Feel"


    This is not hard, and it''s strictly optional. Select the "Settings" option from
    the top of your Kopete screen, then "Configure Kopete," and from the screen that
    gives you, either select "Appearance" or Behavior." Either one will give you sev-
    eral tabs to choose, like "General" or "Chat Window." These are areas where experimenting
    is safe, and even encouraged. At the worst, if you make something look strange,
    you can go back to the screen where you made the change and hit the "Defaults"
    button at the bottom, and everything will go back to the way it was before you
    started experimenting.


    ![](img/01efe5dd076565746bf3678068ba155c_150_0.png)


    # Where to Get Kopete Help


    +   LinuxQuestions.org

    +   kopete.kde.org

    +   irc.kde.org, #kopete'
