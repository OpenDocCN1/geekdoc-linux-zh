  - '[PAGE 39]


    # **Point & Click Linux!**


    The KDE desktop is the “public face” of MEPIS Linux. Remember, no matter what
    operating system we use, the microprocessor at the heart of our computer deals
    with information strictly in the form of binary “either it''s on or it''s off”
    digits. All operating systems have several layers of software designed to hide
    those binary operations from you and put a prettier face on them. In Linux, the
    most common interface between the computer’s guts and what you see on the screen
    is called the X Window system. The KDE Desktop, which works with the X Window
    system, is the GUI (Graphical User Interface) that makes Linux look nice to human
    eyes and gives us the ability to “Point and Click” commands instead of typing
    them in. There are other Linux GUIs, notably the well-regarded Gnome desktop,
    that you can try later, but we decided to start with KDE because it''s the most
    popular and generally considered the easiest one to learn for new Linux users.


    ![](img/01efe5dd076565746bf3678068ba155c_39_0.png)


    KDE is almost infinitely customizable—you can choose any desktop background you
    like, and move almost everything on that desktop to wherever you want it, as we''ll
    show in a later chapter—but right now we are going to talk about how to use the
    KDE desktop in the default configuration it loaded from your SimplyMEPIS CD.


    The first thing that strikes your eye is that there are several small, captioned
    pictures or “icons” along the left side of your screen, and a bunch more along
    the bottom in the “panel” we use to control most functions in MEPIS Linux. To
    do almost anything with your computer, you start by clicking on one of these icons.
    If you want to play a tune from a CD, you click on the CD picture. A window will
    pop up that shows what''s on the music CD you (hopefully) put in your CD drive
    before trying this. (If there’s no CD, you’ll get a notice that there’s no media
    in the CD drive.)


    ![](img/01efe5dd076565746bf3678068ba155c_39_1.png)'
