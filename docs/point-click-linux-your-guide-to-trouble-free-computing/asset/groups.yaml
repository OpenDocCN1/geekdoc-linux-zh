    内置的 K3b “帮助”文件出奇地好用。它包含了日常使用 K3b 时你可能需要的绝大多数信息。我们建议你在初次实验时使用可擦写光盘，因为无论你的刻录软件多么优秀（K3b
    确实非常出色！），只要一个错误的操作，尤其是在刻录可启动光盘时，都可能让你得到一个无用的塑料“杯垫”，而不是正确存储的数据。虽然可擦写光盘的成本高于“一次性写入”记录光盘，但多花几块钱备一些用于测试是值得的——如果你定期将最重要的数据备份到光盘上（每个人都应该这样做，但很少有人真正去做），你可以反复使用同一张可擦写光盘来存储你最新的信息，而无需堆积一堆存有旧数据的光盘。


    ![](img/01efe5dd076565746bf3678068ba155c_160_0.png)


    ## K3b 信息与帮助


    - [www.k3b.org](http://www.k3b.org)

    - [www.MEPIS.org/forum](http://www.MEPIS.org/forum)


    # GIMP——一款功能齐全的图形应用程序


    如果你是从 Windows 转过来的，你可能已经习惯了像 Paint Shop Pro、CorelDRAW Essentials 这样不错的低端图像编辑程序，或者，如果你运气好的话，会用到像
    Adobe Photoshop 这样的高端图形程序。在最基本的层面，这些应用程序可以数字化和修改照片，或创建和编辑绘图。在最高级的用法下，经过培训、技能高超且经验丰富的用户可以用它们创作出令人惊叹的艺术品。但截至本文撰写之时，这些程序中没有一款可用于
    Linux 系统。


    这就引出了 GNU 图像编辑程序，简称 GIMP。它是一个轻量级但功能强大的图形程序，可惜其界面设计较为复杂难用。


    ![](img/01efe5dd076565746bf3678068ba155c_163_0.png)


    ### 入门指南


    你可以在 KDE 菜单的“图形”部分找到 GIMP。点击屏幕左下角的 K-Gear 图标，然后选择“图形”，最后点击“GIMP”。


    你首先看到的将是一个橙色的设置界面。


    ![](img/01efe5dd076565746bf3678068ba155c_163_1.png)


    这个界面只是一个欢迎消息，向你介绍 GIMP。你可以阅读它（如果你愿意的话），但其中并没有真正有价值的信息。点击“继续”按钮。下一个界面询问你希望将存储程序设置和偏好的文件夹放在哪里；最好保持默认位置不变，因此点击“继续”。接下来，你会看到安装日志——你可以阅读它（如果你愿意的话），但这并不是必须的。再次点击“继续”，你会来到一个标有“性能调优”的界面。


    如果你拥有一台内存较大（512MB 或更多）的新型电脑，并且你将处理较大的图片，你可能希望将瓦片缓存从 64 增加到 128。这将允许在处理图形文件时分配更多内存，但它不会影响你不使用
    GIMP 时的系统性能。点击“继续”，你会发现自己来到了“显示器分辨率”界面。保持此设置为默认值；它将使用系统已设置的分辨率。最后再点击一次“继续”，你就完成了——程序将正常启动。


    ![](img/01efe5dd076565746bf3678068ba155c_164_0.png)


    ## 使用 GIMP


    当程序完全加载并启动后，屏幕上会出现一系列小窗口，每个窗口都包含与程序相关的主要工具和功能。最顶部的窗口将是 GIMP 的“今日提示”，每次启动时它都会告诉你关于该程序的一个不同事实。你还可以通过点击“下一个提示”和“上一个提示”按钮来浏览不同的提示。


    ![](img/01efe5dd076565746bf3678068ba155c_164_1.png)


    ![](img/01efe5dd076565746bf3678068ba155c_165_0.png)


    主 GIMP 窗口标记为 GIMP，它包含你在大多数图形程序中习惯使用的绘图和绘画工具。如果某个图标的含义不明确，将鼠标悬停在工具图标上，就会弹出一个文本框告诉你它的功能。GIMP
    窗口的下半部分是用于特定工具选项；点击某个工具，下半部分会改变以展示你可以修改该工具的方式。


    屏幕上的另一个窗口标题为“图层、通道、路径”，它主要面向处理分层图像的进阶用户。此窗口的底部包含你的画笔尺寸和形状，你也可以在主 GIMP 窗口中通过下拉对话框访问这些功能。如果你不使用其中任何功能，可以安全地关闭“图层、通道、路径”窗口；如果你稍后需要它们，可以通过从“文件”菜单中选择“对话框”，然后点击“创建新停靠窗口”，再选择“图层、通道、路径”来重新打开此窗口。如果你这样做，你会注意到画笔选择消失了，而且窗口比之前小了。如果你希望面板看起来和之前完全一样，需要进行一点自定义工作。这没什么大不了的；你可以通过选择“文件”并从下拉菜单中选择“首选项”来几乎自定义
    GIMP 的所有内容。


    如果在 GIMP 窗口中移动鼠标，你会注意到当光标移动到菜单中心（箭头和 X 图标所在区域）时，它会变成手形光标。通过点击并拖动窗口的此区域，你可以将其拖动到独立的窗口或主
    GIMP 窗口的其他部分。你还可以通过探索“文件”菜单中的“对话框”部分来创建自己的自定义窗口。


    如果你把 GIMP 窗口弄得一团糟且无法恢复，请退出程序，并使用 Konqueror 文件管理器删除用户主目录中的 .gimp2 条目。它是隐藏的，因此你需要在查看菜单中选中“显示隐藏文件”选项。


    ![](img/01efe5dd076565746bf3678068ba155c_165_1.png)


    文件删除后，重新启动 GIMP，你将恢复到默认设置。


    ![](img/01efe5dd076565746bf3678068ba155c_166_0.png)


    ### 处理图片


    要获取现有的图像文件，点击“文件”，然后选择“打开”，导航到该文件并点击“确定”。另一个窗口将打开，图片位于中间，两侧有标尺，顶部有菜单。


    要更改整张图片的属性，如大小、分辨率、颜色深度，或添加特效和滤镜，请使用图片窗口中的菜单。主 GIMP 窗口的菜单仅对与你当前正在处理的图片无关的程序功能有用。当然，你可以使用主
    GIMP 窗口中所有可用的工具来改变或处理你正在操作的图片。


    ![](img/01efe5dd076565746bf3678068ba155c_166_1.png)


    ## 扫描和编辑照片


    GIMP 无法直接扫描图片，但它具有使用外部扩展与扫描仪通信的能力。*Simple/MEPIS* 附带了 Kooka 和 xscanimage。Kooka
    通常作为独立应用程序使用，但你可以通过打开 GIMP 的文件菜单，点击“获取”，然后点击“xscanimage”来在 GIMP 内部调用 xscanimage。扫描程序将打开，你可以从中选择质量和大小设置并进行扫描。


    如果你对屏幕截图感兴趣，“获取”子菜单中还有专门用于此目的的选项。


    编辑照片相当简单；你可以通过在主 GIMP 窗口中选择绘图和绘画工具在照片上进行绘制。你还可以添加文本、裁剪或倾斜和旋转图像，所有这些操作都通过同一组工具完成。如果你想添加特效，请探索图像窗口中的“滤镜”和“Script-Fu”菜单。


    ![](img/01efe5dd076565746bf3678068ba155c_167_0.png)


    所有直接针对图像的功能（包括保存和导出图像）都是通过图像窗口的菜单完成的。你可以像往常一样选择窗口顶部的菜单项，也可以右键点击图像，在弹出的对话框中访问所有相同的菜单。


    ## 在哪里获取 GIMP 帮助


    你可以为 GIMP 获取的最佳帮助形式是在线帮助。你可以在此地址找到教程，这些教程可以帮助你学习如何执行特定任务，或者学习如何更有效地使用 GIMP：`http://www.gimp.org/tutorials/`


    GIMP 的邮件列表可以为程序或其使用中的更具体问题提供帮助，但请先阅读关于列表礼仪的部分：`http://www.gimp.org/mail_lists.html`


    最后，GIMP 的文档可以在以下地址找到：

    `http://wiki.gimp.org/gimp/GimpDocs`

