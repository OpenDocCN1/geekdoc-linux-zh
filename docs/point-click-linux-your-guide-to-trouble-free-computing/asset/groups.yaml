    ## Dipping a Toe Into the Command-line Waters


    By *Joe Barr*


    ![](img/01efe5dd076565746bf3678068ba155c_228_0.png)


    **D**on’t be alarmed when you see the MEPIS command-line interface, AKA the CLI.
    You don’t have to go there if you don’t want to.


    With modern versions of Linux—like MEPIS—you very seldom if ever need to leave
    the ease and comfort of the GUI for your day-in, day-out computing chores. But
    if you ever need to, or if you just want to explore "under the hood" a bit, this
    chapter is for you. It provides a guide to twenty of the most useful commands
    available at the CLI. You can learn more about each of these commands simply by
    typing "man command-name" or "info command-name" in a console window.


    ### alias


    The alias command is very handy. It allows you to rename (sometimes long and intricate)
    commands to something a little easier to remember and type. How cool is that?
    You get to name commands whatever you like.


    If it''s hard for you to remember all the parameters to use to get a directory
    listing in a directory that shows all files and their permissions, ownership,
    and size, just use alias to call it, um, something familiar. How about "dir"?


    In MEPIS, aliases are kept in a file called .bashrc, which lives in your home
    directory. Use KEdit to open .bashrc, and then enter the following line at the
    bottom:


    ```bash

    alias fulldir=''ls -al'';

    ```


    Then save the file.


    Before you can use your new command, you have to log out and log back in. When
    you do, open a Konsole session and type your new command in it. You should see
    something like this:


    ![](img/01efe5dd076565746bf3678068ba155c_230_0.png)


    ### apropos


    In those moments when my memory is not all it should be—when I can''t recall the
    exact name of the command I need to do a task—it''s good to know apropos.


    The basic format for apropos is:


    `[username]$apropos search-term`


    Let''s say you are searching for a command to edit sound files. To find all sound
    related commands, you would enter “apropos sound” at the command line. Here''s
    what apropos had to say:


    Anytime apropos found “sound” in its database, it told me the name of the program
    and gave brief description of it. At the bottom of that list I found sox, which
    allows you to trans-late sound files from one audio format to another, as well
    as add reverb or echo or other sound effects. Just what I was looking for.


    ![](img/01efe5dd076565746bf3678068ba155c_230_1.png)


    ### cal


    The cal command, entered without any arguments, shows you a calendar for the current
    month that looks like this:


    ![](img/01efe5dd076565746bf3678068ba155c_231_0.png)


    But there are several arguments you can add to the cal command to tell you even
    more. The Julian date, for example. Try this:


    ```

    [username]$cal -j 1 2004

    ```


    The previous example produces a rather normal looking calendar, but the -j argument
    changes it from showing the day of the month (1-31 for January) to the Julian
    date, or day of the year, instead. Of course for January, it’s hard to tell the
    difference. Try this:


    ```

    [username]$cal -j 2 2004

    ```


    That lists month 2, with the days a little more obviously being day of the year
    rather than day of the month, as you can see here:


    ![](img/01efe5dd076565746bf3678068ba155c_231_1.png)


    If you liked that, add a -y and cal will print the entire year for you. If you
    specify only a "-y" as an argument, cal will print a normal calendar for the entire
    year.


    ### cat


    The **cat** command (short for *concatenate*) is so handy that it’s become famous
    for being used when it’s not really needed. That must make the other shell commands
    green with envy. Some of them hardly ever get used.


    Here’s one way to abuse it. Say you want to look at the contents of a small text
    file. Just type “cat *filename*” at the command line and the text file will be
    printed in the console window.


    When you want to combine two separate files into one, *cat* is the tool to use.
    The format is:


    ```

    [username]$cat file1.name file2.name > combinedfile.name

    ```


    Nothing to it, but note that the redirection symbol (the *greater than* symbol)
    overwrites any previous file of the same name you’ve specified for the output
    file. To add to an existing file instead of overwriting it, use two greater than
    signs, like this:


    ```

    [username]$cat file1.name file2.name >> combinedfile.name

    ```


    There are more examples of using (and abusing) the *cat* command in the section
    on *grep*.


    ### chmod


    The *chmod* command allows you to change permissions for a file, or files, or
    a directory. Permissions determine whether you can read, write, or execute the
    file in question. Permissions are a big reason that Linux users are not as susceptible
    to email-borne viruses and trojans as Windows users, because most system files
    require *root* permission to use or change, and we never give our root password
    to virus-writers.


    The basic format is: *chmod NNN* *filename*, where the first *N* represents the
    file owner’s permissions, the second the file *group’s* permissions, and the third
    everyone else’s permissions. N can vary between 0 and 7. Here is a chart of the
    meaning of each:


    | N | READ | WRITE | EXECUTE |

    |---|------|-------|---------|

    | 7 | Y    | Y     | Y       |

    | 6 | Y    | Y     | N       |

    | 5 | Y    | N     | Y       |

    | 4 | Y    | N     | N       |

    | 3 | N    | Y     | Y       |

    | 2 | N    | Y     | N       |

    | 1 | N    | N     | Y       |

    | 0 | N    | N     | N       |


    ### chown


    The chown command is similar to chmod, but instead of altering file permissions,
    you can change the file’s owner and group.


    The basic format of the command is


    ```

    [username]$chown owner.group filename

    ```


    The group name is optional, so if you only want to change the owner, use “chown
    owner filename.” If you only want to change the group, use the chgrp command instead.


    ### cp


    The basic format of the cp (short for copy) command is:


    ```

    [username]$cp from-filename to-filename

    ```


    Easy as pie. You can also copy directories as well as files, but if you do, be
    sure to use the “-R” (recursive) option so that you copy everything inside the
    directory. The command to fully copy a directory would be


    ```

    [username]$cp -R from-dir to-dir

    ```


    Let’s copy a GIF file so that it has a file extension indicating that it’s a JPEG
    image, and then see what the file command (which we’ll look at it next) has to
    say about it. The format for the command to do that is


    ```

    [username]$cp picture.gif trick-picture.jpg

    ```


    It’s been copied with the false name. To learn the consequences of doing so, see
    the section on the file command.


    ### file


    The file command gives you its best guess as to what kind of file the file you’re
    asking about is. The format is simple, just enter:


    ```

    [username]$file filename

    ```

