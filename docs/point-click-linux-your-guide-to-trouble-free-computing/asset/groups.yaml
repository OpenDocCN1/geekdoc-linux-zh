    # Point & Click Linux!


    > In addition to these advantages, open source and free software programmers don''t
    need to pay license fees to use Linux as their underlying operating system or
    pay royalties to a program''s original developers in order to use their work—as
    long as they share any published modifications or improvements with those original
    developers and other users of the software, which gives them a huge competitive
    cost advantage over proprietary software developers—plus the fact that be take
    advantage of others'' modifications in return for contributing their own back
    into the “pool,” so they can often produce software not only for less money but
    significantly faster than proprietary competitors.


    We mentioned bug reports and feature suggestions as ways ordinary users (non-programmers)
    can contribute to free and open source software development, but there are many
    other ways to help. Art is an excellent example. Someone needs to make the logos
    and design the screen layouts and generally work to make the software they use
    look nice. Help files and manuals don''t write themselves. Someone needs to write
    them—and edit them and update them as the software itself evolves.


    Then there''s translation. If Farsi is your native language and there is no Farsi
    version of your favorite text editor, why not do the translation yourself? With
    free and open source software you aren''t going to violate anyone''s copyrights.
    If you tell the program''s developers what you''re doing they aren''t going to
    get angry, but are likely to offer you help and encouragement. After all, more
    users—Farsi-speakers—means more bug reports and more potential developers to pitch
    in and improve the project for everyone, no matter what language they speak, not
    to mention expanded commercial possibilities if the program''s original developers
    also write custom software based on their open source development work, as so
    many do.


    You can also help your favorite Linux distribution or free software project by
    publicizing it. Proprietary software companies spend millions promoting their
    wares, but many worthwhile open source programs get little or no attention, even
    if they work beautifully, because no one bothers to send out press announcements
    when new versions are released or take any one of a dozen other simple steps that
    might let people know that software is available. Most programmers are more interested
    in programming than in sending email to computer publication editors or performing
    other marketing-type tasks, so many worthwhile pieces of free software don''t
