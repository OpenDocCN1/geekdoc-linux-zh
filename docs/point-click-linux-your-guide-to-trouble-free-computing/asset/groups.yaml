    proprietary software for them, but he decided, instead, that it would be better
    to develop an operating system and software that could be used, modified, and
    shared by anyone, anywhere, without the licensing frustrations that typically
    accompanied proprietary software.


    ![](img/01efe5dd076565746bf3678068ba155c_245_0.png)


    Early on, Stallman identified and started promoting four basic principles of software
    freedom:


    - 1. You have the freedom to run the program, for any purpose.

    - 2. You have the freedom to modify the program to suit your needs. (To make this
    freedom effective in practice, you must have access to the source code, because
    making changes in a program without having the source code is exceedingly difficult.)

    - 3. You have the freedom to redistribute copies, either gratis or for a fee.

    - 4. You have the freedom to distribute modified versions of the program, so that
