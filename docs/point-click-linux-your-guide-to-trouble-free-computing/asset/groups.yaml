    ## 右键点击实现快速桌面自定义


    我们希望向您展示 KDE 控制中心，因为它不仅仅是配置桌面，但对于快速更改桌面外观而言，您可以右键点击任何裸露的桌面空间（即未被程序窗口覆盖的空间——如果您的桌面完全被覆盖，可以使用打开菜单的
    K-Gear 旁边的“显示桌面”按钮来清除遮挡），从而弹出一个充满您可以对桌面进行的各种操作的小菜单框。点击它们，玩弄它们，看看当你“应用”更改时会发生什么——如果你不喜欢看到的效果，只需“还原”或返回到“默认值”。


    ![](img/01efe5dd076565746bf3678068ba155c_220_0.png)


    面板的行为方式相同；在面板的任何位置右键点击，都会弹出一个菜单，提供几种选择，包括向面板添加打开程序的按钮，这样您就不必在菜单中翻找那些您经常使用的程序了。


    要添加新的应用程序按钮，请点击“面板菜单”。从那里，选择“添加”，然后选择“应用程序按钮”，这将带您到达与点击 K-Gear 图标时相同的分类程序列表。点击您想创建图标的程序，它就会显示出来。如果您想移动它，右键点击它，点击“移动（某名称）按钮”（——（某名称）即为您右键点击的按钮名称——然后…移动它。想删除它吗？点击“删除面板按钮”，它就消失了。


    ![](img/01efe5dd076565746bf3678068ba155c_220_1.png)


    如果您不小心删除了它，您可以随时通过“添加”例程重新创建一个。


    您还可以使用面板配置菜单做很多其他事情。点击“配置面板”，您可以使其变大或变小，将其移动到屏幕顶部，或让其在屏幕左侧或右侧垂直显示。您还可以使其背景“透明”，以便桌面背景显示出来并取代默认的工业灰色外观，添加子面板和小型“小部件（Applets）”，这些小部件可以执行诸如在您连接到互联网时为您提供不断更新的气象报告等功能，并添加一个可以输入或粘贴文字并在字典中查找的小型空白区域。甚至可以创建“小部件”形式的微型应用程序按钮组，以便您可以直接从面板点击到每个您经常使用的程序——几乎不再需要使用
    K-Gear 菜单。


    如果您想要许多微小的应用程序按钮，添加的小部件叫做“快速启动器”。在面板上放置一个快速启动器，并填入您喜欢的程序，更改时钟样式（当然，通过右键点击它实现），不知不觉中，您的面板看起来将与您刚用
    Linux 启动计算机时完全不同。


    ![](img/01efe5dd076565746bf3678068ba155c_221_0.png)


    ## 使用主题和皮肤定制程序


    由于许多 Linux 爱好者乐于定制其计算机的外观，许多流行的 Linux 程序都可以“主题化”以满足个人品味也就不足为奇了。Mozilla 是一个典型的例子。在
    Mozilla 窗口的顶部，点击“编辑”，选择“首选项”，点击在新窗口中出现的“外观”，您会有很多选择。“主题”为您提供了一个机会，让您的浏览器拥有与其原始工厂简陋外观完全不同的外观；事实上，本书中的大多数
    Mozilla 截图都是使用“Orbit”主题的，这是周围最受欢迎的话题之一。


    您还可以更改 Mozilla 的颜色、字体（字型）以及几乎其他所有内容。还有主题？您可以像疯了一样更改它们。“主题”页面上有一个小小的“获取新主题”链接，带您前往一个完整的互联网源列表（假设您当时已连接），那里有各种各样的主题，颜色从低调到鲜艳不等。有数百个可用的
    Mozilla 主题。OpenOffice.org、XMMS 媒体播放器以及大多数其他流行的 Linux 程序都有主题——或者有时称为“皮肤”。在 Google
    或其他搜索引擎中输入您喜欢的程序的名称加上“皮肤”或“主题”，您通常会不仅找到其主题，还会找到下载和激活这些主题的说明，通常您还会找到如何从头创建自己主题的说明。


    有些人花费无数个小时将他们的 Linux 桌面变成艺术作品。另一些人则对默认外观感到满意。我们大多数人都处于这两个极端之间：我们希望事物看起来不错，所以不时花几分钟调整一些东西，但不会对此过于着迷。总体而言，我们更倾向于功能导向而非艺术导向。因此，我们至少会花一些时间讨论比寻找完美桌面字体更实际的事项。


    ## 网络安全与网络


    网络中每一台连接计算机上的开放端口都为不良黑客提供了潜在的入侵点。允许 VPN 的端口虽然不被认为具有高安全风险，但在 SimplyMEPIS 中默认并未开放。事实上，在基本安装中开放的唯一端口是您需要用于发送和接收电子邮件、查看网站、通过
    ftp 下载和上传文件以及几种流行的多媒体协议，以及使用即时消息服务所需的端口。您甚至需要开放端口才能使用一些流行的文件共享服务。您可以通过在“系统”菜单下的“安全”标题下找到的
    Guarddog 控制工具来实现这一点。


    *SimplyMEPIS* 包含一个防火墙，在您第一次启动时自动激活。通常作为 Linux 安装一部分的服务器软件已被有意从 *SimplyMEPIS* 中省略，作为安全措施，除非您选择开放它们，否则您的
    Guarddog 防火墙会紧紧关闭用于访问这些服务器的“端口”。


    ![](img/01efe5dd076565746bf3678068ba155c_222_0.png)


    如果您不熟悉防火墙——或者不知道为什么要使用防火墙——现在是按下“帮助？”按钮的好时机。Guarddog 手册册是我们见过的作为开源程序一部分的最完整的文档之一。它不仅是关于
    Guarddog 如何工作的指南，也是关于网络和网络安全的一般良好介绍。而且，与许多安全巨著不同，它并不假设您已经知道几乎所有事情，而是从最初开始引导您通过网络和安全程序，并随着进程逐渐向您展示更复杂的概念。


    但除非您想阅读所有内容（这不会造成伤害），否则您实际上不需要阅读所有这些，因为 Guarddog 在完全不需要您对其进行任何操作的情况下，就能很好地保护您的计算机安全。事实上，在典型的桌面情况下，您使用
    Guarddog 最可能做的是开放端口，这略微降低了您的安全级别，虽然不足以让您彻夜难眠。


    ![](img/01efe5dd076565746bf3678068ba155c_223_0.png)


    “协议”窗口是您开放端口的地方。通过点击主 Guarddog 窗口中的“协议”标签来访问它。请注意，这些用于流行在线游戏的协议目前均未启用。这意味着，如果您尝试玩这些游戏，在您点击“开放”并在其旁边显示对勾（而不是“x”，因为那意味着您的计算机特别拒绝该协议）并点击窗口底部的“应用”之前，它们对您不起作用。其他协议也是如此。如果您无法从您的
    MEPIS 计算机使网络打印机正常工作，无法连接到您喜欢的文件共享服务，或者在建立 VNC 连接时遇到困难，首先要检查的是在 Guarddog 中是否开放了相应的端口。


    ### 什么是协议和端口？


    协议是在局域网或互联网上计算机之间传输信息的方法。


    它们拥有只有工程师才会喜欢的名称，如 HTTP（超文本传输协议）、FTP（文件传输协议）、CRTP（战斗无线电传输协议）、SSH（安全外壳）等。每一个都关联有一个“端口号”，例如
    HTTP 是 80，这是您获取网页的方式，而 MSN 信使是 1963 等等。有数千个可能的端口。如果它们都在您的 PC 上开放，这意味着它将接受几乎任何发送到它的信号，包括来自想要窃取您的数据或使用您的计算机发送垃圾邮件的坏人发来的信号。如果所有端口都关闭，您的计算机将不接受任何数据，就这样。


    因此，您通过设置防火墙允许某些信号通过，从而保持一些端口开放，在其他情况下（如 HTTP），允许仅作为对其发出信号的响应而通过该端口进入的信号。


    服务器计算机——那些向您的桌面等“客户端”计算机“提供”网页、电子邮件和其他文件的计算机——*必须*开放一些端口，以便它们可以接收发送网页、电子邮件或任何其他内容的请求，因此它们不能像桌面计算机那样“紧锁”得那么安全。但一些桌面计算机意外地变成了服务器，因为它们的操作系统的软件包附带了主人不知道的内置服务器软件。这是
    Linux 计算机最常见的问题之一，这也是为什么 *SimplyMEPIS* 不包含服务器软件，尽管如果需要，您当然可以自己添加服务器软件。


    内置防火墙的现代 Linux 发行版的魔力在于，您无需了解这些知识即可设置您的计算机网络并保持其安全。而且，使用 Linux，您也不必担心所有这些 Windows
    病毒。只需不时更新您的系统，以防某些程序中发现并修复了某种漏洞，您就可以基本上不用担心网络安全，而是去海滩度假。


    '
