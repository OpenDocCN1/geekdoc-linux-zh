    ## Look Ma, No Drivers!


    With Windows and other operating systems, you often need to install a specific
    software “driver” for network cards from CDs supplied by the cards’ manufacturers.
    MEPIS Linux has drivers for almost all the popular network cards, including wireless
    cards, built in. It also has built-in drivers for most popular digital cameras,
    scanners, printers, and other devices you’re likely to attach to your computer.
    (If you want to add hardware that was made after this book was written, you may
    need to get an updated version of MEPIS that includes drivers for it, but that’s
    not hard. We’ll show you how to do that in Chapter 24, “Downloading and Installing
    Software.”)


    As a rule, MEPIS will run any common wire-connected network card without you doing
    anything. Wireless may or may not start on its own, but it’s easy to make sure
    “wlan0” is running and start it if it’s not. Click on the “Wireless” tab, click
    the “Use auto-config” choice and click “Apply” if starting “wlan0” didn’t make
    your wireless connection come to life.


    ![](img/01efe5dd076565746bf3678068ba155c_31_0.png)


    If you’re using a wireless network with encryption and other non-default settings,
    you’ll want to click “Use Manual Configuration” and set MEPIS to conform to your
    network’s setup, which you can determine by accessing your wireless hub’s setup
    utility and instructions.


    ![](img/01efe5dd076565746bf3678068ba155c_31_1.png)


    Even if all the setup instructions that came with your wireless hub were written
    for Windows, the numbers and settings are identical for all operating systems.
    Type them in the appropriate blanks, click “Apply” and they should work without
    any problem.


    ## Dialup and PPoE Connections


    Dialup modem users should turn to Chapter 5, “KPPP—Easy Modem Dialer Application.”
    We put it there because KPPP is only one of several dialup connection programs
    available for Linux. While KPPP is our favorite, you may later decide to download
    and use one of the others.


    DSL users whose providers still use PPoE (Point-to-Point Protocol over Ethernet)
    directly may need to use the KDSL utility to connect, but should first make sure
    their providers don’t have newer router-style modems available that will eliminate
    the need for a login and password. Virtually all major U.S. DSL providers have
    switched to router-style modems, which are detected and set up automatically by
    MEPIS Linux. (These DSL modems are far more efficient than the old PPoE ones were,
    anyway, so you should make this switch no matter what operating system you use.)


    ![](img/01efe5dd076565746bf3678068ba155c_32_0.png)


    ## Printer Setup


    MEPIS Linux includes drivers for popular home and small office printers. To set
    up your printer, click the “K-Gear” icon on your panel, select “Print System”
    and choose “Add Printer.” This brings up the “Add Printer Wizard.”


    ![](img/01efe5dd076565746bf3678068ba155c_32_1.png)


    ### Point & Click Linux!


    If you have your Internet connection figured out now and you want to read about
    the development and capabilities of the KDE printing system, click on the underlined
    words “The KDE printing team” and the http://printing.kde.org Web site will open.
    But this is not really necessary. What we really need to do now is click “Next.”


    ![](img/01efe5dd076565746bf3678068ba155c_33_0.png)


    For this basic tutorial, we’re assuming you have a printer directly connected
    to your computer through parallel, serial or USB port, so we’ll select “Local
    printer,” then click “Next.”


    (For more information on how to use a printer connected to another computer on
    your network, click the “Help” button to bring up a copy of *The KDE Print Handbook*
    or go to the printing.kde.org Web site, which may have a newer version.)


    ![](img/01efe5dd076565746bf3678068ba155c_33_1.png)


    ## 2: Running the SimplyMEPIS CD


    Now it’s time to select how your printer is connected to your computer and click
    on that choice. (Scroll down for USB and some other choices.) Again, click “Next”
    when you’re done.


    ![](img/01efe5dd076565746bf3678068ba155c_34_0.png)


    Pick your printer make and model from the lists. If your exact printer model isn’t
    listed (which is unlikely), choose one from the same manufacturer with a similar
    model number.


    ![](img/01efe5dd076565746bf3678068ba155c_34_1.png)


    For this demonstration, we’re using a common HP Deskjet 940C. Naturally, you’re
    using your printer, not the one we happen to have handy. And, of course, click
    “Next.”


    Some printers have more than one driver available. To learn more about one of
    the drivers, click on it, then click “Driver Information” and a page about that
    driver will pop up. So far we’ve never gone wrong choosing the recommended driver,
    so we’re going to stick with that one. And click “Next.”


    ![](img/01efe5dd076565746bf3678068ba155c_35_0.png)


    Now we print a test page to make sure that everything’s working right. (If you’re
    asked to enter your root password, remember that while you’re running MEPIS from
    CD, it’s root.) While writing this chapter and taking screenshots for it, we had
    one problem: The test page wouldn’t print because the printer wasn’t plugged into
    the computer. MEPIS Linux is forgiving and user-friendly, but there are limits
    to what it can do, and an unplugged printer is beyond its control. After we plugged
    the printer in, everything worked fine.


    **An important note about printer operation**: Your printer may not work correctly
    with most programs while running from the LiveCD instead of Linux installed on
    your hard drive. When you are running Linux through your CD drive, the print program
    is not stored on your hard drive where the programs you use (like word processors)
    look for it when you tell them you want to print. As long as the test page prints,
    you’re fine even if other pages don’t. After you actually install MEPIS Linux,
    you’ll have no trouble printing.


    ### Shutting Down


    This is the last function we need to master. Hard? Not exactly. Here''s how you
    do it:


    - 1. Click on the K-Gear logo at the lower left corner of your screen.

    - 2. Click on "Logout"—the bottom menu choice.


    You have three choices. Their purposes are obvious. Pick the one you prefer, and
    click it. That''s the end of this Linux session, hopefully the first of many you''ll
    run in coming years.


    ![](img/01efe5dd076565746bf3678068ba155c_36_0.png)


    ### Getting Help


    If you have any trouble getting MEPIS to boot correctly or with the rest of your
    initial setup, get online either with MEPIS or your existing operating system
    and go to www.mepis.org. You''ll find solutions to most common setup problems,
    including any that have been detected and solved in the months between the day
    this book was written and the day you first picked it up.


    And if you don''t see an answer on the MEPIS site itself, go to www.mepis.org/Forum,
    where MEPIS developers and experienced users can give you one-on-one help. (There
    is no charge to use the MEPIS forums.)


    ## Chapter 3


    # Working with Linux: KDE and KWrite


    ![](img/01efe5dd076565746bf3678068ba155c_38_0.png)


    Now that we have MEPIS running, let''s play with it a little. We''ll explore some
    basic Linux functions here, including how to make, save, find, and move files,
    using a simple bit of text as an example. This is also the point where video instructions
    start coming into their own. Sometimes it''s easier to see how to do things when
    someone demonstrates how they work and talks you through the process instead of
    just giving you descriptions on a printed page.


    ### Point & Click Linux!


    The KDE desktop is the “public face” of MEPIS Linux. Remember, no matter what
    operating system we use, the microprocessor at the heart of our computer deals
    with information strictly in the form of binary “either it''s on or it''s off”
    digits. All operating systems have several layers of software designed to hide
    those binary operations from you and put a prettier face on them. In Linux, the
    most common interface between the computer’s guts and what you see on the screen
    is called the X Window system. The KDE Desktop, which works with the X Window
    system, is the GUI (Graphical User Interface) that makes Linux look nice to human
    eyes and gives us the ability to “Point and Click” commands instead of typing
    them in. There are other Linux GUIs, notably the well-regarded Gnome desktop,
    that you can try later, but we decided to start with KDE because it''s the most
    popular and generally considered the easiest one to learn for new Linux users.


    ![](img/01efe5dd076565746bf3678068ba155c_39_0.png)


    KDE is almost infinitely customizable—you can choose any desktop background you
    like, and move almost everything on that desktop to wherever you want it, as we''ll
    show in a later chapter—but right now we are going to talk about how to use the
    KDE desktop in the default configuration it loaded from your SimplyMEPIS CD.


    The first thing that strikes your eye is that there are several small, captioned
    pictures or “icons” along the left side of your screen, and a bunch more along
    the bottom in the “panel” we use to control most functions in MEPIS Linux. To
    do almost anything with your computer, you start by clicking on one of these icons.
    If you want to play a tune from a CD, you click on the CD picture. A window will
    pop up that shows what''s on the music CD you (hopefully) put in your CD drive
    before trying this. (If there’s no CD, you’ll get a notice that there’s no media
    in the CD drive.)


    ![](img/01efe5dd076565746bf3678068ba155c_39_1.png)

