  - '[PAGE 21]


    # Point & Click Linux!


    OpenOffice.org (OOo), the strangely named office package we’ve included, can save
    documents in many formats Microsoft Office can’t, including Adobe’s PDF, so you
    can publish the same creation on the Internet, on paper, and on a CD without having
    to rewrite it for each medium. It’s also more versatile than Microsoft Office
    in another way: It can read, edit, and save documents in PDF and Microsoft Office
    formats, but Microsoft Office can’t read or edit documents created in the native
    OOo format or create PDF files. Another advantage you’ll have with OOo is that
    it automatically “compresses” each document you save so it takes up much less
    of your hard drive than documents saved by Microsoft Office. OOo will seem strange
    at first, if you’re used to Microsoft Office, but with a little practice you’ll
    find that, beyond its file format versatility, it has many features Microsoft
    Office doesn’t that can make your work faster and easier.


    The K3B CD/DVD creation software we’ve chosen for MEPIS is the best full-featured
    “burner” program we’ve ever used, in any operating system. You drag the files
    you want on your CD or DVD into the K3B window, press “burn,” and you’re done.
    It automatically detects and sets up almost all common CD and DVD “write” drives,
    too, and doesn’t require special “drivers” for any of them.


    These are just a few examples. You’ll find many other programs worth your love
    as you explore Linux, including specialized software for scientific research,
    video and audio editing, web hosting, and software development. We all have different
    software needs, and no one book—or one CD—can cover them all.


    In this book and the accompanying video DVD and software CD, we concentrate on
    software for everyday home and office desktop computing so you can start using
    Linux right away for everyday tasks. After you get comfortable with Linux on your
    desktop, you can start exploring its power in other areas, all the way up to building
    your own world-class supercomputer by linking hundreds or even thousands of Linux
    PCs together.


    But we’ll worry about building a Linux supercomputer next week (or maybe next
    year). Right now, let’s put the *SimplyMEPIS* CD in your computer’s CD drive and
    spend an hour or two mastering Linux basics.'
