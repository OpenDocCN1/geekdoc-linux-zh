    # Point & Click Linux!


    What sets Mozilla apart from the most common proprietary browser, though, is that
    it can make your Web experience faster, easier, and more pleasant if you use its
    advanced features, which are advanced technically and in what they can do for
    you, but require no advanced knowledge to activate.


    Let’s start with tabbed browsing. This is something you don’t know you need until
    you have it, but will never want to do without after it becomes a habit. To use
    it in its most basic form, when you click on a link, use your right mouse button
    and choose “Open New Tab” from the menu choices. This will open the new page in
    the same browser window but in a new tab.


    ![](img/01efe5dd076565746bf3678068ba155c_85_0.png)


    “Okay,” you say. “So what?”


    Imagine you’re looking for information at the Linux.com Web site.


    You see an article you want to read, so you open it in a new tab:


    If we’d just done our usual left mouse button click to open that new page and
    wanted to go back to the main page to check out articles, we’d have to reload
    it. But by opening the fresh page in a tab, we didn’t move off the main page,
    so we can go back to it without waiting for it to load again. Now we can scroll
    down, spot another article we want to read, and open that new article in another
    tab, like this:


    ![](img/01efe5dd076565746bf3678068ba155c_85_1.png)


    We can go on and on like this until we have so many tabs open that we can’t read
    the writing on them because they’re so crammed together.'
