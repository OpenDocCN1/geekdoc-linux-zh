    请注意，“自由软件”中的“自由”一词指的是自由（freedom），而非价格。斯多曼曾以 150 美元的价格销售 GNU Emacs（一种程序员使用的文本和代码编辑器）的副本，GNU
    Emacs 是首批在 GNU 许可证下分发的程序之一。当然，由于买家可以自由地将他们的副本分享给朋友和同事，与斯多曼要求每个用户都购买一份副本的情况相比，销售收入并没有那么高。但作为以每份副本收入减少为代价的回报，斯多曼的程序不仅在实体介质（如磁带、软盘和其他介质）上被大量分享，而且在那时还比较稀薄的互联网上也得到了广泛传播。数以万计的程序员可能没有钱购买自己的副本，却养成了使用它的习惯，其中许多程序员利用修改程序的自由，使得
    GNU Emacs 的改进速度和功能增加速度远远超过了斯多曼自己所能达到的水平。


    请注意，由于所有 Emacs 用户都共享修改和重新分发其底层代码的自由，因此所有 Emacs 用户都能享受到任何一位用户所做的改进。最终，斯多曼为自用而获得的文本和代码编辑器，远比如果他作为专有软件销售
    Emacs 所获得的要好得多。


    1985 年，斯多曼和其他人将自由软件基金会（FSF）注册为一家免税慈善机构。FSF 很快发布了一系列重要的软件工具，包括广泛使用的 GCC 计算机代码编译器和
    BASH“shell”（用于命令行工具），这些工具都采用了 GNU“copyleft”（保留全部权利）许可证。该许可证纳入了前述的四种自由，并包含防止任何人将“copyleft”代码用于专有软件的条款，从而确保他人对原始软件的修改无法被自由共享。


    许多专有软件公司谴责了这一条款，而该条款后来成为软件“通用公共许可证”（GPL）的一部分，因为他们认为自己有权利用他人的工作，添加自己的内容，并从中获利，而不是将他们的改进（或利润）与软件的原始创造者共享。


    专有软件供应商通过保持其软件内部工作原理的秘密来获利，而不是通过共享，因此当他人不愿遵循这种模式时，他们会感到极其不满。事实上，斯多曼拒绝专有 Unix 软件分发模式，这与
    GNU 这个名称有很大关系，GNU 是“Gnu’s Not Unix”（Gnu 不是 Unix）的首字母缩写。这不仅仅是一种编程哲学的陈述，还是程序员的一个玩笑：会导致无休止循环讨论的递归语句可能会让编程不当的计算机停止工作。


    ## 点击式 Linux！


    想象一台计算机正在进行以下对话：


    “什么是 GNU？”


    “GNU’s Not Unix。”


    “什么是 GNU？”


    “GNU’s Not Unix。”


    “什么是 GNU？”


    “GNU’s Not Unix。”


    “什么是 GNU？”


    “GNU’s Not Unix。”


    这可能会永远持续下去——或者至少持续到有人过来拔掉插头。


    正如喜剧演员杰夫·福克斯沃斯（Jeff Foxworthy）可能会说：“如果你觉得这个笑话有趣……那你很可能就是一名程序员。”（如果你觉得它有趣而你并非程序员，或许你应该考虑成为一名程序员。）


    ## 林纳斯·托瓦兹登场


    1991 年，芬兰的一位计算机科学学生编写了一个简单的程序，以便他能像使用名为 Minix 的类 Unix 操作系统那样使用他的家用计算机。这是一个简陋的“内核”程序，仅执行几项基本功能；它远非一个完整的操作系统。但这个小程序能做的几件事，它都做得很好，托瓦兹将他的计算机代码发布到互联网上，以便其他人可以使用并或许改进它，同时他在
    comp.os.minix 网络新闻组中发布了以下介绍性信息：


    > 各位使用 minix 的朋友大家好 -

    >

    > 我正在做一个（免费的）操作系统（只是一个爱好，不会像 gnu 那样庞大和专业），用于 386(486) AT 兼容机。这个想法自四月份以来一直在酝酿，现在开始准备就绪。我希望大家能反馈喜欢/不喜欢
    minix 的哪些方面，因为我的 OS 与之有些相似（由于实际原因，文件系统采用相同的物理布局等）。

    >

    > 我目前移植了 `bash`(1.08) 和 `gcc`(1.40)，看起来运行正常。这意味着我将在几个月内得到*某种实用的*成果，我想知道大多数人想要哪些功能。欢迎提出建议，但我不保证我会实现它们
    :-)

    >

    > Linus (torvalds@kruuna.helsinki.fi)

    >

    > P.S. 是的 - 它不包含任何 minix 代码，并且具有多线程 fs。它不是可移植的（使用 386 任务切换等），而且它可能永远不支持除 AT 硬盘以外的任何设备，因为那也只是我拥有的设备
    :-.


    这条信息通常被视为“Linux”的开端，这个名字是托瓦兹的朋友阿里·莱姆克（Ari Lemmke）建议的，作为托瓦兹自己的“Freax”名称的替代方案。即便改名后，Linux
    只有在其他人——许多 GNU 工具——响应林纳斯发出的提交建议的邀请，并融入许多贡献的修改和建议后，才成为一个可用的操作系统，其中最好的部分被托瓦兹纳入了
    Linux 内核。随着 Linux 的普及度和实用性的增长，来自数十个国家的数千名程序员开始编写专门用于在 GNU/Linux 操作系统上运行的软件。


    ## Linux 社区与你


    当你开始使用 Linux 时，你就成为了 Linux 社区的一部分。你可以在计算机上粘贴印有 Tux（Linux 企鹅吉祥物）贴纸，并在书架上摆放小小的 Tux
    玩偶。这——以及参加 Linux 大会——是 Linux 社区有趣的部分。是的，尽管 Linux 是一个极其严肃的计算机操作系统，但保持轻松的心态并没有错。林纳斯·托瓦兹称他的自传为*Just
    for the Fun of It*（仅仅为了乐趣），这种态度贯穿了大部分 Linux 和自由软件开发过程。


    ![](img/01efe5dd076565746bf3678068ba155c_248_0.png)


    “为什么不享受你的计算机工作呢？”是 Linux 背后永恒的反问。Linux 似乎在说：“当然，”你可能会说，“你在这周结束前还有 28 份报告要交，但你应该能够停下来看看漂亮的桌面图片，偶尔玩一局《Frozen
    Bubble》吧？你应该仅仅为了避免无聊而将 KDE 控制面板从显示器屏幕底部移到顶部吧？你的操作系统不应该有一只滑稽的企鹅吉祥物吗？”


    是的，你应该。你的计算机应该是你的朋友，而不是你的敌人，编写运行软件的程序员应该关心他们的程序如何为你工作，并且应该乐于倾听你对他们如何改进工作的建议。大多数程序员都是如此。只要你礼貌地对待他们，并在寻求帮助之前花点时间阅读他们的手册、文档和常见问题解答（FAQ），你会发现大多数自由软件开发者都很乐意听取你的意见，并且往往比商业软件公司更快地付诸行动。商业软件公司需要让每个客户建议经过二十层客户服务、法律和营销官僚机构的审查，才能决定他们是否愿意倾听你，更不用说实际采取行动了。


    几乎每个免费的 Linux 程序都有公开的邮件列表和 IRC 频道，而 Linux 本身就有数百个。欢迎加入其中任何一个并提出建议，或者——如果你是程序员——贡献修改。如果你的修改有用，无论你是
    IBM Linux 实验室的专业程序员，还是在巴西贫民窟使用公共计算机终端的青少年，它们都可能被采纳；如果你的修改没有用，即使你是写过十几本编程书籍的计算机科学教授，它们也会被拒绝。


    这种精英主义以及自由软件开发者倾听用户意见的意愿可能会吓到老式的专有软件供应商，但从我们作为用户的角度来看，这是很棒的，因为它让我们更快获得更好的软件，通常只需要很少或无需现金支出。我们为什么要关心我们最喜爱的程序的一位作者住在肯尼亚并穿着长袍，而另一位住在伦敦并穿着定制西装呢？以互联网作为自由软件开发者的主要协作媒介，可以将居住在不同大洲的程序员结成临时联盟，共同创建造福各地所有人的软件。


    '
