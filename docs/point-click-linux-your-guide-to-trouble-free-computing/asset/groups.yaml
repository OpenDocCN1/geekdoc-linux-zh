    ![](img/01efe5dd076565746bf3678068ba155c_36_0.png)


    ### 获取帮助


    如果您在使 MEPIS 正确启动或初始设置的其余部分方面遇到任何困难，请使用 MEPIS 或现有操作系统联网，并前往 www.mepis.org。您会发现大多数常见设置问题的解决方案，包括在本书编写之日与您首次拿起本书之日之间的几个月内被发现和解决的任何问题。


    如果您没有在 MEPIS 网站本身上看到答案，请前往 www.mepis.org/Forum，在那里 MEPIS 开发人员和经验丰富的用户可以为您提供一对一的帮助。（使用
    MEPIS 论坛没有费用。）


    ## 第 3 章


    # 使用 Linux：KDE 和 KWrite


    ![](img/01efe5dd076565746bf3678068ba155c_38_0.png)


    现在我们有了运行的 MEPIS，让我们稍微玩玩它。我们将在这里探索一些基本的 Linux 功能，包括如何创建、保存、查找和移动文件，使用一小段简单的文本作为例子。这也是视频教程开始发挥其优势的时刻。有时，看到有人演示操作方式并引导您完成过程，比仅仅阅读印刷页面上的描述更容易理解如何执行操作。


    ### 指点与点击 Linux！


    KDE 桌面是 MEPIS Linux 的“公众面孔”。请记住，无论我们使用什么操作系统，我们计算机核心的微处理器都以二进制“开或关”数字的形式严格处理信息。所有操作系统都有多层软件设计，旨在向您隐藏这些二进制操作，并为其美化外观。在
    Linux 中，计算机内部与您屏幕上所见内容之间最常见的接口被称为 X Window 系统。与 X Window 系统配合工作的 KDE 桌面是 GUI（图形用户界面），它使
    Linux 对人眼看起来美观，并赋予我们“指点与点击”命令的能力，而无需输入命令。还有其他 Linux GUI，特别是备受好评的 Gnome 桌面，您可以稍后尝试，但我们决定从
    KDE 开始，因为它是最流行且通常被认为对新的 Linux 用户来说最容易学习的一种。


    ![](img/01efe5dd076565746bf3678068ba155c_39_0.png)


    KDE 几乎是无限可定制的——您可以选择任何喜欢的桌面背景，并将该桌面上的几乎所有东西移动到您想要的任何位置，我们将在后续章节中展示——但在此时，我们将讨论如何使用从您的
    SimplyMEPIS CD 加载的默认配置中的 KDE 桌面。


    首先映入眼帘的是屏幕左侧有几幅带标题的小图片或“图标”，以及底部“面板”中还有许多图标，我们使用该面板来控制 MEPIS Linux 中的大多数功能。要对计算机执行几乎所有操作，您都从点击这些图标之一开始。如果您想播放
    CD 上的一首曲子，请点击 CD 图片。将会弹出一个窗口，显示您（希望）在尝试此操作前放入 CD 光驱的音乐 CD 上的内容。（如果没有 CD，您将获得光驱中没有媒体的提示。）


    ![](img/01efe5dd076565746bf3678068ba155c_39_1.png)


