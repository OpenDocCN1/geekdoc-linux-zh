    在 http://www.mepis.org/forum 获取更多关于调制解调器连接的帮助。


    ## 第 6 章


    ## Mozilla：你通往互联网的钥匙


    尽管 KDE 拥有一个内置的 Web 浏览器和电子邮件客户端，许多 Linux 用户都喜爱它们，但 SimplyMEPIS 的创建者 Warren Woodford
    和本书的作者认为，对于初次尝试 Linux 的人来说，Mozilla 更具知名度且更容易使用。因此，这是我们将在《点点 Linux！》书籍和视频中讨论的互联网工具。你可能在某个时候想要尝试
    KDE 的 KMail 和 Konqueror 浏览器。你也可能想要尝试新的、由 Mozilla 设计的 Firefox Web 浏览器和 Thunderbird
    电子邮件客户端，或者，对于电子邮件、日历和通用“组织”功能，尝试备受赞誉的 Evolution 系统。


    ### 点点 Linux！


    KMail 和 Konqueror 包含在你的 SimplyMEPIS CD 中。没有空间包含 Firefox、Thunderbird 和 Evolution，但它们可以从
    MEPIS 服务器和其他互联网位置单独（免费）下载。


    但现在，让我们专注于 Mozilla。


    显然，Mozilla 的核心是一个 Web 浏览器。它最初是 Netscape 的一个分支，但现在比 Netscape 或 Microsoft Internet
    Explorer 都要先进得多。事实上，许多在 Linux 上使用 Mozilla 然后在工作中（或任何地方）被迫使用 Windows 的人发现，Mozilla
    比 MSIE（Explorer 在许多互联网业内人士中的称呼）好得多，以至于他们下载并使用 Windows 版本的 Mozilla，而不是回到 MSIE。


    与主要竞争对手相比，Mozilla 的电子邮件客户端是另一颗“明星”。首先，它对当前在互联网上流传的流行电子邮件病毒和蠕虫具有免疫力。如果你一直在使用 Microsoft
    的 Outlook 或 Outlook Express 阅读电子邮件并担心病毒（你应该这样做），那么在你切换到 Mozilla（或 KMail 或 Evolution）的那一刻，这份负担就从你身上解除了。


    ![](img/01efe5dd076565746bf3678068ba155c_71_0.png)


    ![](img/01efe5dd076565746bf3678068ba155c_71_1.png)


    也许有一天，会有人编写一种可以通过 Mozilla 传播到 Linux 计算机的电子邮件蠕虫或病毒，但迄今无人成功。你还将享受 Mozilla 内置的垃圾邮件过滤器，它至少和那些售价高达
    50 美元的 Outlook 和 Outlook Express 过滤器一样好。


    Mozilla 还有一个地址簿，你可以将其用作联系人管理器，以及一个*Composer（编辑器）*实用程序，即使你不懂 HTML，也可以使用它来制作 Web
    页面。


    在接下来的几页中，我们将展示如何使用所有这些功能，以及一些小提示，说明如何使用自定义主题和配色方案让 Mozilla 以你喜欢的外观显示。


    这应该足以让你开始了。


    更多 Mozilla 信息：


    - www.mozillazine.org

    - forums.mozillanews.org

    - www.mozilla.org


    ## 第 7 章


    ## 设置和使用 Mozilla 电子邮件


    要使用任何电子邮件程序，你需要知道以下信息：


    - 你的“入站”邮件服务器名称

    - 你的邮件服务器是“pop”还是“imap”

    - 你的“出站”邮件服务器名称

    - 你的邮件服务器用户名

    - 你的密码


    ## 选择 ISP


    AOL 以及少数其他要求在你的计算机上安装专有软件才能使用其电子邮件服务的 ISP（互联网服务提供商），将无法与 Mozilla——或 Linux——配合使用。


    如果你目前使用这些 ISP 之一，这可能是一个考虑更换服务提供商的好时机。你可以找到可靠的、兼容 Linux 且每月收费低至 10 美元的 ISP。


    我们强烈建议你基于朋友和同事的推荐来选购 ISP，并将 Linux 友好性仅作为事后考量，因为绝大多数 ISP（以及几乎所有最可靠的 ISP）本身就运行 Linux，并且乐于接受运行
    Linux 的客户。


    ## 设置电子邮件账户


    首次启动 Mozilla 电子邮件时，它会自动弹出一个*账户向导*，引导你完成设置电子邮件账户的过程。如果你有多个账户，请为每个账户运行向导。设置完第一个账户后，你可以通过选择
    Mozilla 电子邮件窗口顶部的“编辑”选项，从弹出的菜单中选择“邮件和新闻组账户设置”，然后选择“新账户”来访问向导。


