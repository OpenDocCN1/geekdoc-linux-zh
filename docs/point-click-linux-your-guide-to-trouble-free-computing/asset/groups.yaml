    ## 点点就用的 Linux！


    要获取 root 权限，只需在命令行中输入：


    ```

    [username]$su

    ```


    然后在提示时输入 root 密码。


    当 `$` 变成 `#` 时，你就知道自己是 root 了，例如：


    ```

    [username]#

    ```


    要结束“超级用户”会话，请输入：


    ```

    [username]#exit

    ```


    要切换到其他用户，请使用以下命令：


    ```

    [username]$su  username

    ```


    然后在提示时提供该用户的密码。从你的替代身份会话中退出与从 root 会话中退出相同，只需输入“exit”即可。


    ## tar


    Tar（tape archive 的缩写）提供了创建、压缩和解压归档文件的手段。这里的归档意味着许多不同的独立文件可以合并成一个文件。我们将该文件称为 tarball。请记住，压缩是一个可选的独立任务。你可以创建和“解开”tarball
    而不压缩任何数据。


    tar 命令的基本格式是：


    ```

    tar (选项) 文件名-1 …

    ```


    要创建一个包含主目录中名为“text”的目录内所有内容的 tarball，我需要在主目录的命令行中输入以下命令：


    ```

    [username]$tar -cf textarchive.tar  text

    ```


    “-c”选项告诉 tar 创建一个归档，“-f”告诉它将下一个名称用作其创建的归档的名称。


    上一个例子中给出的第一个名称成为归档的名称。请注意，你可以随意命名，但名称越有意义，以后处理 tarball 就越容易。".tar" 扩展名表示它是一个未压缩的
    tarball。


    以下是一些其他标准的 tarball 扩展名：


    - .tar.gz——"gunzip" 压缩的 tarball

    - .tar.bz2——"bunzip2" 压缩的 tarball


    为什么要指明使用的压缩类型？好问题。答案是，当你“解开”tarball 时，你需要知道使用哪个解压缩程序。处理压缩 tarball 有两种方法：长方法和短方法。


    长方法是先解压，然后使用 tar 将 tarball “解开”回其原始组件文件。假设我们有一个名为 "bigarchive.tgz" 的 tar 归档。我们可以分两步完成，如下所示：


    ```

    [username]$gunzip -d bigarchive.tgz

    ```


    由于我们告诉 gunzip 使用 "-d" 选项进行解压缩，归档现在将以 bigarchive.tar 而不是 bigarchive.tgz 的名称出现。下一步是：


    ```

    [username]$tar -xf bigarchive.tar

    ```


    这将“解开”tarball，所有原始文件将再次存在。


    或者，我们可以通过在 tar 命令中添加 "z" 选项，一次性完成所有操作，告知它要解开的归档采用 gunzip 压缩格式。


    ```

    [username]$tar -xzf bigarchive.tgz

    ```


    如果我们的原始文件是用 bunzip2 而不是 gunzip 压缩的——如果它以 .bz2 扩展名正确命名，我们会知道这一点——我们将使用 "j" 选项代替
    "z"，如下所示：


    ```

    [username]$tar -xjf bigarchive.bz2

    ```


    请注意，在这三种情况下，第一个选项都是 "x"，意思是从归档中提取文件。当我们创建 tarball 时，第一个选项是 "c"。


    有时，在解开归档之前确切知道其中包含什么内容是很有用的。你可以通过将第一个选项更改为 “t” 来列出 tarball 的内容。然而，如果归档是压缩的，你仍然必须使用如上所述的
    “z” 或 “j” 选项告诉 tar 它是压缩的。


    ## test


    test 命令允许你根据文件的存在、类型或状态有条件地执行某些任务。它还可以通过比较整型和字符串值来执行相同的功能。为了简化，我们将尽可能保持简单，只关注文件测试，同时展示其部分潜力。


    这里的命令测试 /var/mail/username 是否存在（这就是 -e 参数的作用），如果找到则发出蜂鸣声。


    ```

    [username]$test -e /var/spool/mail/username && cat /usr/share/sounds/KDE_Beep_Beep.wav
    >/dev/dsp

    ```


    注意上面命令中的 “&&” 运算符，它将 test 命令与 cat 命令分开。这是一个逻辑 AND 运算符，它要求命令的两侧都为真，否则不会执行。如果 /var/spool/mail/username
    文件不存在，测试将为假，蜂鸣声不会发出。


    如果你想在没有邮件时听到蜂鸣声怎么办？很好。没问题。只需在 -e 参数前添加 NOT 运算符。! 标记就是 NOT 运算符，因此我们修改后的 test 命令看起来像这样：


    ```

    [username]$test ! -e /var/spool/mail/username && cat /usr/share/sounds/KDE_Beep_Beep.wav
    >/dev/dsp

    ```


    除了测试文件是否存在外，你还可以使用 -d 参数测试文件是否为目录，或使用 -s 参数测试文件是否存在且包含数据，或者许多其他可选测试。


    在我们的情况下，即使邮件客户端删除了邮件，username 文件仍然存在。这意味着我们的 "-e" 选项测试毫无意义，因为无论你实际上是否有邮件，它始终为真。我们真正想使用的是
    "-s" 选项，它确保文件大小大于零，例如：`[username]$test -s /var/spool/mail/username && echo "You
    have mail"`


    ## 命令行帮助


    `www.mepis.org/forum` 充满了命令行高手。


    `www.linux.com` 有许多宝贵的命令行技巧。


    `www.tldp.org`（Linux 文档项目）是一个庞大的命令行说明汇编。


    附录 C，“帮助你成为更熟练的 Linux 用户的书籍”，列出了几个参考书，它们将帮助你完全精通 Linux 命令行。


    ## 第 28 章


    ## 加入 Linux 社区


    与 Windows、Mac OS 和大多数其他商业操作系统不同，Linux 不属于任何单一公司。它是由一个全球程序员群体开发——并不断得到改进——他们更关注技术优雅而非市场营销。这些程序员通常不是业余爱好者，而是学术界人士、专业软件开发人员以及其他在自己的计算机以及越来越多地在雇主的信息技术（IT）部门中使用
    Linux 的人。Linux 是世界有史以来最杰出的国际和跨公司合作实例之一，围绕它成长起来的自由软件和开源社区也是如此。


    ### GNU/Linux 是如何开始的


    你的新操作系统的真名是 GNU/Linux。


    “Linux” 是它的昵称，在日常对话中使用的程度就像美国前总统德怀特·戴维·艾森豪威尔在报纸标题和几乎其他地方被称为“Ike”一样。GNU（发音为“guh-noo”）是
    GNU/Linux 的基础，是其余部分赖以构建的软件系统和开发理念，由麻省理工学院（M.I.T.）人工智能实验室的雇员理查德·M·斯托曼（Richard M.
    Stallman）在 1980 年代初构思出来。当时，Unix 是实验室大型计算机上占主导地位操作系统，但每台计算机运行其制造商提供的专有 Unix 版本，因此几乎不可能使用由一家制造商提供的打印机或其他设备与由另一家制造商提供的计算机。并且，由于这些
    Unix 变体中的每一个都由销售它或将其包含在其硬件中的公司拥有，斯托曼无法编写“桥接”程序，使不同设备能够协同工作，除非他与所有涉及的不同计算机和设备制造商签订保密协议。这将阻止他与其他可能需要这些秘密的程序员和计算机管理员自由分享——或者他利用其专有计算机代码的软件。斯托曼本可以签署部分保密协议并与计算机供应商签约，为他们编写专有软件，但他决定，开发一个任何人都可以在任何地方使用、修改和共享的操作系统和软件会更好，而不必忍受通常伴随专有软件的许可烦恼。


    ![](img/01efe5dd076565746bf3678068ba155c_245_0.png)


    早期，斯托曼确定并开始宣传软件自由的四个基本原则：


    - 1. 你拥有运行程序的自由，用于任何目的。

    - 2. 你拥有修改程序以满足你需求的自由。（为了使这种自由在实践中有效，你必须能够访问源代码，因为在没有源代码的情况下修改程序极其困难。）

    - 3. 你拥有重新分发副本的自由，无论是免费的还是有偿的。

    - 4. 你拥有分发程序修改版本的自由，以便社区能从你的改进中受益。


    '
