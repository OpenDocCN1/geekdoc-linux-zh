    ## SUSE Linux


    SUSE 是大型企业网络领导者 Novell 公司的一个部门。虽然 SUSE 提供了可供下载的免费版本，但若要获取 SUSE 的专有系统工具，您必须购买一个副本。此外，许可限制禁止共享这些工具。SUSE
    非常重视企业销售，但它对于个人桌面用户也非常出色。这是一个集成度很高的软件包，适合新用户和经验丰富的用户。


    (www.suse.com)


    ## Slackware Linux


    Slackware 是最古老且持续发布的 Linux 发行版之一，面向爱好者和 Linux 专家，而非普通桌面用户。如果您运行 Slackware，您将大量使用命令行。


    (www.slackware.com)


    ## Gentoo Linux


    Gentoo 是一个完全免费的 Linux 发行版，面向开发人员和网络专业人员。它使用一种独特的包管理系统，称为 Portage，而不是更常见的 RPM 和
    DEB 系统。


    (www.gentoo.org)


    ## Xandros


    Xandros 是一个出色的桌面发行版，基于早期的 Corel Linux 操作系统。它基于 Debian，运行良好，安装和升级都很容易。有一个“Open
    Circulation”版本可免费下载，但如果您想要所有的高级功能（以及手册），您需要花费接近 100 美元购买全功能版的“Deluxe”版本。限制性许可限制了共享行为。


    (www.xandros.com)


    ## PCLinuxOS


    PCLinuxOS 是一个较新的 Live CD 发行版，最初基于 Mandrake Linux，但正在迅速形成自己的特色。它具有吸引人的默认设置和实用程序界面。


    (www.pclinuxonline.com/pcloe)


    ## LinSpire


    LinSpire 的特点是基础安装简单，以及额外软件安装方便。大多数 LinSpire 软件与您其他 Linux 发行版中发现的软件相同，只是名称有所更改。如果您不想继续为更新而向
    LinSpire 付费，并不打算使用其 Click-N-Run 订阅软件服务，而转用免费的 Debian 服务器或其他免费软件源，那么切换的方法并不明显。LinSpire
    拥有出色的打包和外观。通常没有免费下载；限制性许可禁止在直系亲属范围之外共享。


    (www.linSpire.com)


    ## 有助于您更精通 Linux 的书籍


    《*Point & Click Linux!*》是一个很好的起点。如果您想更多地了解 Linux，无论是为了个人使用，还是作为程序员或系统管理员的专业用途，以下五本书可以帮助您：


    ![](img/01efe5dd076565746bf3678068ba155c_262_0.png)


    ## Point & Click Linux!


    **《Moving to Linux: Kiss the Blue Screen of Death Goodbye》**

    作者：Marcel Gagne，ISBN 0321159985

    如果《Point & Click Linux!》是您的第一本 Linux 书，那么《Moving to Linux》可能是一个很好的第二本选择。它提供了除
    MEPIS 以外的其他发行版的安装说明，并引导您使用稍大范围的软件应用程序，同时提供大量的命令行指令指导。


    **《Running Linux, 4th Edition》**

    作者：Matt Welsh 等，ISBN 0596002726

    这本书是 Linux 命令行的经典指南；您可以在许多专业系统管理员的书架上找到它。如果您只运行一台家用或家庭办公电脑，可能不需要这本书，但如果您有专业的 Linux
    抱负，或者希望开始为自家或办公室构建 Linux 网络，您就会希望手边有一本。


    **《A Practical Guide to Red Hat Linux: Fedora Core and Red Hat Enterprise Linux》**

    作者：Mark G. Sobell，ISBN 0131470248

    这是一本面向 Linux 高级新手以及系统和网络管理员的全面书籍。包含完整的 Fedora Core 2 版本，提供在 4 张 CD 上。如果您计划专业使用
    Linux，特别是考虑到 Red Hat 是企业服务器机房中最受欢迎的 Linux 发行版，这是一份很好的学习材料。


    **《The Linux Cookbook》**

    作者：Michael Stutz，ISBN 1886411484

    本书通过命令行向您展示了如何完成许多任务，但不仅仅是对单个命令进行索引，而是以类似食谱的方式引导您走完整个流程。这是一个很好的方式，不仅能让您熟悉命令行，还能让您养成实际使用命令行来完成任务的习惯。


    **《Beginning Linux Programming, 3rd Edition》**

    作者：Neil Matthewes 和 Richard Stones，ISBN 0764544977

    本书假设您至少有一些 C 或 C++ 经验，并且已经安装过 Linux 一两次。如果您已准备好开始为 Linux 编程或在 Linux 上编程，请购买此书。这是为希望开始使用
    Linux 的程序员提供的基本指南中最好的一本。


