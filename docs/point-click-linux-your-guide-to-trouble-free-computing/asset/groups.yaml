    "Demo" and "root."


    ![](img/01efe5dd076565746bf3678068ba155c_27_0.png)


    It''s best to start with the user name *demo* rather than use *root*, especially
    if you intend to connect to the Internet. This is a security measure, and is one
    of the big reasons Linux doesn''t fall prey to the viruses and worms that plague
    the users of some other operating systems.


    When you are logged in as a *user*—probably your own name once you get MEPIS Linux
    installed permanently—the only part of the system you will be able to change is
    your own data and things like screen color and some other appearance options.
    To install software or make any heavy changes to the system, Linux requires you
    to log in as *root*. If you are logged in as a *user*, malicious hackers can''t
    easily install software you don''t know about or perform other mischief.


    Cats, children and well-meaning friends can''t mess up your computer by typing
    in the wrong commands, either, as long as you are logged in as a *user* and not
    as *root*. In fact, when you do the actual Linux installation you''ll be able
    to give other users their own user accounts so they can log in and use your computer
    without disturbing (or ever seeing) your private information, email or anything
    else you store in your computer. And each user can choose his or her screen colors
    and other custom features, too, including Web site bookmarks and favorite music.
    With Linux, a whole family can share a computer, but it can be a "personal computer"
    for each family member since each can have his or her own user login.


    Only root gets to see everything. (That''s going to be you, right?)


    ## Logging In


    In "demo mode," the password for the demo user is **demo**, all lowercase. The
    root password is **root**, also lowercase. We''ll show you how to change passwords
    (and add users) later, when we install MEPIS on your hard drive. But right now,
    let''s go with these defaults. Enter them, click on the "login" button—or just
    hit your "Enter" key after you type in the password—and in a second or two you''ll
    see your full, ready-to-use KDE desktop. If your PC has speakers, you should hear
    a few notes of music as the desktop appears.


    ![](img/01efe5dd076565746bf3678068ba155c_28_0.png)


    If everything has gone right, you are now ready to work (or play) with Linux.
    If your computer is connected to the Internet through a network cable attached
    to a DSL line, cable modem or other high-speed "always on" setup, you should be
    connected to the Internet now. You can test this by clicking the "M" in the panel
    at the bottom of the screen, which starts the Mozilla Web browser that''s included
    in **SimplyMEPIS**.


    ![](img/01efe5dd076565746bf3678068ba155c_28_1.png)


    If your network is not operating correctly at this point—that is, if you''re not
    able to view Web sites—you need to open the MEPIS system center and change your
    system settings. If you''re online automatically, there is no need to do this,
    but it still might be nice to spend a minute looking at the System Center.


    ## Using the MEPIS System Center


    ![](img/01efe5dd076565746bf3678068ba155c_29_0.png)


    To open the MEPIS System Center, click on the “S” icon on the main desktop.


    The first thing you get when you open the MEPIS System Center is a login screen.
    This one asks for the root password, not your user password. While you’re running
    from the CD, the password is root. (You’ll change it to something more secure
    after you install MEPIS on your hard drive, of course.)


    ![](img/01efe5dd076565746bf3678068ba155c_29_1.png)


    ## The Magic Desktop-Clearing Icon


    We just told you to click on an icon on the desktop. What if your screen is covered
    by an application window? Or two or three or 40 application windows? (Linux has
    no practical limit on the number of applications or windows you can keep open,
    so you really can have 40—or even 100—applications open at the same time.)


    The answer is the View Desktop icon in the lower left hand corner of your screen,
    next to the small picture of the gear with a “K” on top of it. Click the View
    Desktop icon, and you’ll have a clear view of your blank desktop.


    ![](img/01efe5dd076565746bf3678068ba155c_29_2.png)


    # 2: Running the SimplyMEPIS CD


    Type in that password, and you’ll see the MEPIS System Center main screen.


    On the left side of this screen, you see an index of functions, and above that
    index there’s a Help choice. If you click Help, you’ll see these words:


    ### Using the MEPIS System Center


    To use the MEPIS System Center, just select a function in the Index tab and follow
    the instructions in this Help tab.


    That’s how simple it is to use the MEPIS System Center. We’ll start by looking
    at Network Interface.


    ![](img/01efe5dd076565746bf3678068ba155c_30_0.png)


    This screen tells us what our network is doing. In this example, we have an active
    wireless network connection. We see which network services are running because
    we have buttons available that allow us to stop them. If those services aren’t
    running, those buttons say “Start” instead of “Stop.” The buttons marked “Start
    eth0” and “Start ath0” are shadowed and barely visible because this computer was
    not attached to a wired (eth0) connection, just wireless, so no wired connection
    was detected.


    Ath0 is used only for Atheros network cards, which aren’t terribly common. If
    you have one, MEPIS automatically detects it, automatically installs the right
    drivers, and automatically starts it for you.

