    in the habit of actually using the command line to do things.


    **Beginning Linux Programming, 3rd Edition**

    By Neil Matthewes and Richard Stones, ISBN 0764544977

    This book assumes you have at least some C or C++ experience and have installed
    Linux at least a time or two. Buy it if you''re ready to start programming in
    or for Linux. It''s one of the best basic guides for programmers who want to start
    working with Linux.


