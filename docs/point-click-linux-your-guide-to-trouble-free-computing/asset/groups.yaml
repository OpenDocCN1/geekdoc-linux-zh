    ## 互联网


    同样，这里有大量的程序。我们之前已经介绍了 **Mozilla Web 浏览器**和电子邮件客户端，并在“连接”（其中一个子菜单）部分讨论了拨号工具 **KPPP**
    以及用于传统 DSL 连接的 **ADSL/PPP**。我们尚未介绍的“连接”工具包括 **KWiFiManager**，它仅在拥有无线局域网（WLAN）连接时有用（并且在设置好无线网络后其功能不言自明），以及
    **Smb4K**，这是一个 Samba 工具，允许我们在局域网（LAN）上与 Windows 计算机共享文件，我们将在稍后的“进阶篇”部分详细介绍它。


    ![](img/01efe5dd076565746bf3678068ba155c_191_0.png)


    在“互联网”菜单的“更多程序”子菜单中，只有四个应用程序。


    ![](img/01efe5dd076565746bf3678068ba155c_191_1.png)


    **Camstream** 是一个用于通过网络摄像头视频输入端口进行流媒体传输的工具程序。**KPPP Log Viewer** 用于监控调制解调器的使用情况。它主要对那些按分钟计费使用拨号互联网连接，或每月有免费使用小时数限制的用户非常有用。**KStreamRipper**
    将流式音频记录到你的硬盘上。**Remote Desktop Connection** 是一个 VNC（虚拟网络计算）工具，允许你使用 Linux 计算机远程控制其他计算机。（如果你以前从未这样做过，建议在尝试建立两台计算机之间的
    VNC 连接之前，先阅读该程序的“帮助”文件，并了解一些关于 VNC 的一般知识。）


    ![](img/01efe5dd076565746bf3678068ba155c_191_2.png)


    其余重要的互联网应用程序位于主“应用程序”菜单中。**KMail** 是许多 Linux 用户相较于 Mozilla 更偏爱的电子邮件程序，而许多人不仅使用
    **Konqueror** 进行文件管理，还将其作为网络浏览器。**Pani** 是一款备受好评的新闻组阅读器，适合那些仍然享受 Usenet 的用户。**Skype**
    是一种新的互联网电话服务；使用它在计算机之间通话是免费的，但从计算机拨打普通电话则需支付少量费用。而 **Straw** 是一款新的程序，无需编程知识即可将你所有喜欢的新闻网站和博客的
    RSS 标题源汇聚到你的桌面上。（设置起来非常简单。）


    ![](img/01efe5dd076565746bf3678068ba155c_192_0.png)


    ## 多媒体


    同样，这里的选择看起来相当丰富——而且再次强调，其中一些程序通常会自动调用，在这种情况下是由你的网络浏览器触发的。这些程序包括 **RealPlayer 8、KMPlayer、XMMS**
    和 **Xine**，它们在下载时会打开特定类型的多媒体文件。但 **XMMS** 也可以单独用于播放 CD 上的音频，**KsCD** 也可以做到这一点。你不妨都试一试，看看哪款更适合你。（提示：**XMMS**
    界面看起来比较简陋，但它拥有许多出色的内置功能。）


    ![](img/01efe5dd076565746bf3678068ba155c_192_1.png)


    ### 点即用的 Linux！


    **KAudioCreator** 可以捕获 CD 中的音乐并将其保存到硬盘驱动器。**KMix** 是当你点击控制面板上的小扬声器图标时调出的声音混合器。**KRec**
    是一个令人惊讶地程序（尤其是考虑到其价格），它与 **KMix** 和 **aRts** 控制工具协同工作，帮助你利用计算机麦克风输入及其他你选择的音频源创建和编辑自己的语音和音乐文件。


    ![](img/01efe5dd076565746bf3678068ba155c_193_0.png)


    我们已经介绍过 **K3B**；**KWave** 是一个更倾向于处理现有音频文件的音频编辑程序，不同于 KRec。你可以用它来制作简短的音乐片段或你自己的
    DJ 风格“混音”。


    ![](img/01efe5dd076565746bf3678068ba155c_193_1.png)


    在“更多程序”菜单的底部，我们还发现了一颗隐藏的瑰宝：**XawTV**。如果你拥有 WinTV 或其他流行的电视调谐卡，**XawTV** 不仅让你可以在
    PC 监视器上观看电视，还可以为你录制节目以便稍后观看。非常好！


    ![](img/01efe5dd076565746bf3678068ba155c_193_2.png)


    ![](img/01efe5dd076565746bf3678068ba155c_193_3.png)


    ## 办公


    这里只有两个程序是我们尚未介绍的。第一个是 *Planner*，这是一个非常新的、仍处于轻微实验阶段的程序，我们认为它非常值得一试；到你读到这里时，几乎可以肯定会出现比本插图中所示版本（0.11
    版）更新、更好的版本——通常 1.0 版本是程序开发中“准备好接受严格考验”的关键节点。但我们已经对 *Planner* 印象深刻了，所以这里就介绍它。


    ![](img/01efe5dd076565746bf3678068ba155c_194_0.png)


    另一颗瑰宝是 *Scribus*，这是一款适用于 Linux 的完整、专业级桌面出版程序。如果你最近看过桌面出版软件的价格，在你试用 *Scribus* 之后，你会意识到仅它一项的价值就超过整个
    *Point & Click Linux!* 软件包成本的好几倍。如果你从事的业务（或爱好）需要桌面出版，拥有 *Scribus* 将让你在学习如何使用 Linux
    上花费的所有时间都物超所值。是的，它真的很好——而且新版本层出不穷，每一版都比上一版更出色。


    ![](img/01efe5dd076565746bf3678068ba155c_194_1.png)


    ![](img/01efe5dd076565746bf3678068ba155c_194_2.png)


    ## 系统


    我们要开始进入系统管理员的领域了。如果你是一名刚刚转向 Linux 的系统管理员，这些工具会让你的生活比没有它们时轻松得多。如果你不是系统管理员，那么你的
    KDE 菜单中的这部分就是你开始以在大多数流行专有 PC 操作系统中无法实现的方式全面掌控计算机的地方。


    ![](img/01efe5dd076565746bf3678068ba155c_195_0.png)


    我们稍后会在本书的“进阶篇”中介绍大部分 **System**（系统）工具，那部分就在几页之后。现在，我们只先看看其中一些较简单的工具。


    ![](img/01efe5dd076565746bf3678068ba155c_195_1.png)


    一个好的起点是 **KDE Info Center**。这个工具将告诉你关于你 PC 的几乎所有信息。


    ![](img/01efe5dd076565746bf3678068ba155c_195_2.png)


    我们正在查看计算机的内存使用情况。如果你不完全理解这里发生的一切，别担心。你可以点击浏览其他特性。有些列表会很有趣，有些则令人费解。你对计算机内部工作原理了解得越多，令人费解的条目就越少。但即使一开始不能完全理解，了解这一切也是一件有趣的事。（而且，你不需要知道所有这些细节才能使用
    Linux。系统本身就能完美运行——但如果你选择去学习，通过定制化这里的几个设置，你或许能让你的计算机变得更加强劲。）


    **System**（系统）菜单中另一个值得查看的部分是 *Monitor*（监视器）子菜单。


    ![](img/01efe5dd076565746bf3678068ba155c_196_0.png)


    这里只有四个列表项。第一个，**KCPULoad**，告诉你计算机 CPU（中央处理单元）在任何特定时刻的工作负荷。点击此条目，你会在控制面板的右端获得一个小图标，有点像新车常有的那个不断移动的“燃油里程”指示器。点击该图标，你会看到一个显示这些数值的小文本框。有趣！而且有用；如果你的计算机工作负荷很大，CPU
    使用率达到 80% 或更高，你可能需要考虑同时运行较少的程序，以防止计算机变慢。


    这里的第二个列表项是 ***KDE System Guard***（KDE 系统卫士）。这是系统管理员的一个强大工具，即使你认为自己只是一个普通的桌面计算机用户，毫无成为
    Linux 高手的欲望，了解它也大有裨益。花几分钟浏览一下 ***KDE System Guard Handbook***（点击不可避免的“帮助”按钮即可调出），你可以学到很多关于计算机和网络如何运作的知识。你可以查看各种
    ***KDE System Guard*** 功能。同样，你可能无法完全理解这里看到的一切。但即使不能，稍微窥视一下“引擎盖”下的运行情况也不错。


    ![](img/01efe5dd076565746bf3678068ba155c_196_1.png)


    **KNetLoad** 告诉你关于网络及其工作状态的信息，例如速度多快，你正在传输多少数据。如果数字降为零，说明你的连接断开了。即使它只是比平时慢，你可能也想做些应对措施，即使那“措施”只是打电话给
    ISP 询问发生了什么。（至少你*知道*有问题，而不是在猜测。）


    ![](img/01efe5dd076565746bf3678068ba155c_196_2.png)

