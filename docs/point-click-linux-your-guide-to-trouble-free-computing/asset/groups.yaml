    - forums.mozillanews.org

    - www.mozilla.org


    ## Chapter 7


    ## Setting Up and Using Mozilla Email


    To use any email program, you need to know the following:


    - Your "inbound" mail server''s name

    - Whether your mail server is "pop" or "imap"

    - Your "outbound" mail server''s name

    - Your mail server username

    - Your password


    ## Choosing an ISP


    AOL, and a few other ISPs (Internet Service Providers) that require proprietary
    software installed on your computer to use their email service, won''t work with
    Mozilla—or Linux.


    If you currently use one of these ISPs, this might be a good time to think about
    changing providers. You can find reliable, Linux-compatible ISPs that charge as
    little as $10 per month.


    We strongly advise you to shop for an ISP based on friends’ and coworkers’ recommendations,
    with Linux-friendliness evaluated only as an afterthought because the vast majority
    of ISPs (and almost all the most reliable ones) run Linux themselves, and are
    happy to have customers who run Linux.


    ## Setting Up Email Accounts


    When you start Mozilla email for the first time, it will automatically pop up
    an *Account Wizard* that will walk you through the process of setting up an email
    account. If you have more than one account, run the Wizard for each account. After
    you’ve got the first account set up, you get to the Wizard by selecting "Edit"
    from the choices along the top of a Mozilla email window, choosing "Mail & Newsgroup
    Account Settings" from the menu that choice pops up, then choosing "New Account"
    and going from there.


