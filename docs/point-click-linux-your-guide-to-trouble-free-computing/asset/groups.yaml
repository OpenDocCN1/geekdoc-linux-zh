    ## Making Web Pages with Mozilla


    To change all the text on the page, you can either highlight it all with your
    cursor or go up to the top of your window, click “Edit,” then choose “Select All”—or
    simply key in “Alt A” and get the same results.


    > **Note:** The “Alt A” key combination used in Mozilla to “Select All” is not
    the same as the “Ctrl A” key combination used in almost every other word processor
    or text editor in the world to do the same thing. This is an annoying Mozilla
    quirk we hope will be eliminated in future versions, but for now we live with
    it—and because Mozilla is wonderful in so many ways, we will allow its developers
    this bit of silliness without getting angry at them.


    Another important area you’ll want to explore is the set of choices the “Format”
    menu button at the top of the page gives you. At the top of the menu, this button
    reveals you’ll find several text choices that can liven up your page, and second
    from the bottom you’ll see “Page Colors and Background,” which allows you to change
    some colors and—if you wish—add a background image to your page.


    The final “basic” Composer tool we’ll look at is the link generator, which comes
    up when you click the “link” icon in the tool menu we looked at earlier. To use
    this one, first highlight the text or picture you want to become a link, then
    click the icon. You’ll get a little window with space to type or paste in the
    URL of the page to which you want to link.


    ![](img/01efe5dd076565746bf3678068ba155c_98_0.png)


    Make sure you include the complete link address, including the “http://” part.
    It’s usually best to paste in a link from an open browser window instead of typing
    it by hand. This eliminates the possibility of a bad link cause by a typing mistake.


    Composer can work with javascript, *Cascading Style Sheets* (CSS) and other “beyond
    HTML” Web-making tricks, but at heart it’s a simple beast designed to help simple
    people (like us) turn out simple Web pages.


    This book is obviously not a Web design manual. You should now have a basic understanding
    of how Mozilla Composer works. If you need to do more advanced Web design, no
    matter what operating system you use, you should delve into that as a separate
    subject with appropriate books and other material close at hand to help you learn
    this arcane art.


    ## Introduction to OpenOffice.org: Word Processing, Spreadsheets, Slide Presentations,
    Graphics, and More


    OpenOffice.org (OOo) is a huge, "all-in-one" set of office programs that has almost
    all the functions many people have gotten accustomed to using in Microsoft Office,
    plus some functions Microsoft Office lacks. It will open and edit most Microsoft
    Office documents, spreadsheets, and PowerPoint presentations completely; some
    formatting may get lost in complicated works, but you''ll find that the actual
    content is intact.


    You can also save work you create with Ooo in Microsoft''s formats, although after
    you realize that Microsoft formats take over *twice* as much hard drive space
    as Ooo''s "native" saving format, you''ll probably only want to do this if you''re
    sharing a piece you''ve created with a friend or coworker who only has Microsoft
    Office. In order to save hard drive space and hassles for both of you, it might
    be good to encourage Windows-locked friends to download and install a free copy
    of Ooo for Windows from `www.openoffice.org`.


    This introduction to Ooo is just that: an introduction. Ooo has so many features
    that it would take a book more than twice as large as this one to give detailed
    instructions on how to use them all. Today, we''re interested in learning basic
    functions so that you can start doing basic work right away. This will still take
    a number of pages—enough that we have separate sub-chapters that cover each of
    several popular Ooo functions—but not so many that you''ll get lost. Besides,
    if you don''t need to make or edit spreadsheets or create slide shows, you can
    skip those sub-chapters without worry and experiment with those areas later if
    you think knowing about them might be useful to you one day.


    Get more OpenOffice help at:

    - `www.openoffice.org`

    - `www.oooforum.org`

    - `documentation.openoffice.org`


    ## OpenOffice.org Writer


    OpenOffice.org Writer is your full-featured word processor, probably the most
    popular OOO function. To create a text document, type in some words. Basic formatting
    works about the same as in any other word processor. To save your work, click
    on the "File" option at the top of the screen and select "Save." You''ll need
    to name your document. Unless you change where you want it saved from the default
    setting, it will go into a folder called "Documents" in your "home/you" directory.


    ![](img/01efe5dd076565746bf3678068ba155c_102_0.png)


    You have a wide choice of formats you can use to save your work. The OOO native
    ".sxw" is usually best unless you''re going to send this document to someone who
    only has Microsoft Office, in which case you''ll probably want to use the extra
    hard drive space it takes to save it in Microsoft Word format. Or, if you''re
    going to publish it on the Web, you may want to choose HTML. But you don''t need
    to make this decision while you''re still typing. It''s good to save as you work
    "just in case," and you might as well use the standard OOO file format. You can
    always save your final version in a different file format later.


    ### Save early, save often


    Even though Linux and OOO are highly reliable, it''s always a good idea to save
    your work as you go along. What if you wander away from the computer and a cat
    jumps on the keyboard or someone else starts pushing keys? You might get distracted
    and shut your computer off by mistake, or you might be using a laptop that runs
    out of battery power; or the power to your desktop might go off for a second.
    You never know.


    Saving your work takes next to no time; hit "Ctrl+S" and everything you''ve written
    up until that moment will be saved to your hard drive.


    The .sxw format OOO uses is just a fancy name for "Zipped XML," which means your
    work is first saved in the industry-standard "XML" format, then compressed using
    the industry-standard ".tar" protocol so that it takes up less hard drive space
    and makes for speedier email if you send your documents as email attachments.


    If you need to open an OOO file without a copy of OpenOffice.org (or its commercial
    cousin, StarOffice) handy, you can "unzip" the file with almost any zip/unzip
    utility, in any operating system, and then read your text with almost any word
    processor, including Microsoft Word.


    Another "Save" option in the OOO "File" menu isn''t called "Save," but "Export."
    At this writing, the only format to which you can "Export" is PDF, and you can
    get the same result by clicking the "Export to PDF" line just below the "Export"
    choice. Presumably, there will be other "Export" choices in the future, which
    is why there''s a separate "Export" choice with room of other to-be-included formats,
    but for the moment PDF is fantastic enough. PDF, the "Portable Document Format"
    from Adobe, is the preferred format for many online documents that may be printed
    out by users, as well as in other situations where documents must look the same
    whether they are on a computer screen or paper.


    Because PDF documents cannot be easily altered or have sections copied by readers,
    many copyright holders like to distribute their most valuable work this way. Many
    government agencies and academic institutions that want people to see exactly
    what they wrote, with line numbers and footnotes in the same place every time
