    ## 8：Mozilla 网络浏览器


    创建新书签最简便的方法是：点击浏览器窗口顶部菜单中出现的两处“Bookmarks”（书签）中的任意一处，然后点击“Bookmark This Page”（将本页加入书签）。这会自动将你当前所在的页面添加到每次点击“Bookmarks”时显示的书签列表中。一种稍微复杂——但也更优雅——的保存书签方式是：点击“Bookmarks”并选择“File
    Bookmark”（文件书签）。突然你会发现更多的选项，包括有机会将此书签放在你的“Personal Toolbar”（个人工具栏）上，位于“Home”（主页）和“Bookmarks”（书签）按钮旁边。


    ![](img/01efe5dd076565746bf3678068ba155c_90_0.png)


    “File Bookmark”对话框很容易理解。你已经有想要加入书签的页面的地址和标题——Mozilla 自动获取了它们——你只需选择一个存放该页面的文件位置即可。如果你愿意，可以给它起一个更短的名字，特别是如果你打算在个人工具栏上放置很多页面链接的话。只需清空
    Mozilla 自动插入“Name”（名称）框中的长名称，输入你喜欢的那个名字即可。对于“Linux.com: The Enterprise Linux Resource”（Linux.com：企业
    Linux 资源），你可能会决定简单地将其称为 Lc。或者“Linux.”。然后点击“Personal Toolbar”选项，完成设置。


    ![](img/01efe5dd076565746bf3678068ba155c_90_1.png)


    如果你想要对书签进行分类，可以添加文件夹。在我们这里展示的示例中，你会看到“Personal Toolbar”、“Shopping”（购物）和“Stories”（故事）。点击你想用来存储当前正在查看页面的文件夹，其地址就会存入该处。点击“New
    Folder”（新建文件夹）即可创建一个新文件夹。你可以随意命名。创建之后，你可以将任意想要的书签放入其中。


    回到“Bookmarks”按钮及其下拉菜单，还有一个“Manage Bookmarks”（管理书签）选项。


    你可以将书签从一个文件移动到另一个文件，删除它们，甚至可以在文件夹中嵌套文件夹，或将文件夹添加到你的个人工具栏中。你可以重命名文件夹和书签，为它们添加简短的描述，甚至设置特殊关键字以帮助记忆——你想怎么做都可以。


    或者，你不必做上述任何事。这些都是可选的。但维护组织良好的书签文件夹可以使你的网络浏览轻松许多——当你急需查找一个几个月未用且可能已忘记地址的网站时，还能节省大量时间。


    ![](img/01efe5dd076565746bf3678068ba155c_91_0.png)


    ### Mozilla 浏览器杂项技巧


    通过浏览器窗口顶部的“View”（视图）菜单选项，可以轻松（且非常简单）地自定义 Mozilla 浏览器的外观和风格。


    “View Source”（查看源代码）选项仅对希望查看网站代码的网页开发者感兴趣，但该菜单上的一些其他选项对我们其余的人来说也很重要。下方的“Page Info”（页面信息）选项包含了关于当前正在查看页面的信息汇编。值得一看，但对于日常网络浏览来说通常用处不大。


    “View”菜单中的一项基本功能是“Text Zoom”（文本缩放），它可以立即增大那些设计师决定让我们眯着眼才能看清微小字体的网站的字体大小。你可以使用菜单点击选项，或者输入“Ctrl
    +”来放大字体。这是 Mozilla 的一个很棒的功能。如果你的视力不太好，你可能会经常使用这个功能。


    相反，如果遇到使用超大字体的网站（通常是业余站点），你可以通过菜单选择“Unzoom”（取消缩放），或者输入“Ctrl -”来缩小字体。


    “Show/Hide”（显示/隐藏）是另一个很棒的自定义选项。例如，本书作者不喜欢 Mozilla 中默认的“Sidebar”（侧边栏），因为它占据了他笔记本电脑屏幕太多的空间，所以他取消了“Sidebar”的勾选以将其移除。


    根据个人喜好，你还可以选择显示（或不显示）浏览器窗口顶部的各种菜单。这是实验而非指导的时候；你可以随意勾选或取消这些选项而不会造成任何损坏，所以尽管做你喜欢的事吧。


    这里有一个潜在的“陷阱”，如果你点击了“Full Screen”（全屏）。取消此操作的方法并不明显，所以在这里说明一下：在屏幕右上角“X”旁边，你会看到一个看起来像电脑显示器嵌套的小图标。点击此图标，你的浏览器窗口将恢复正常大小。


    我们将讨论的最后一个技巧是“Apply Themes”（应用主题）。许多志愿者致力于改变 Mozilla 的外观，以匹配各种各样的喜好。下载和安装新主题非常容易。在本书随附的
    SimplyMEPIS CD 中包含的 Mozilla 版本中，你有几个主题可供选择，但如果你点击“Apply Themes”，然后选择“Get New Themes”（获取新主题），你还会看到更多可用的链接。


    ![](img/01efe5dd076565746bf3678068ba155c_92_0.png)


    ![](img/01efe5dd076565746bf3678068ba155c_92_1.png)


    更改浏览器的主题并不会让它运行得更好，但有时候花点额外精力让软件不仅*行为*完全符合你的预期，而且外观也是你最喜欢的，是值得的。


    ## 第 9 章


    ### 9：使用 Mozilla 制作网页


    这是对 Mozilla Composer 的简要介绍；我们大多数人并不制作网页（或者至少只制作非常简单的网页），而擅长这类工作的人会迅速熟悉 Composer
    的使用方法，无需手把手指导。


    ![](img/01efe5dd076565746bf3678068ba155c_94_0.png)


    Composer 是一个简单的 WYSIWYG（所见即所得）网页设计工具，使用时不需要了解 HTML，但至少掌握一点相关知识有助于制作出更好的页面。你使用它的方式很像文字处理器：要么输入文本，要么粘贴在另一文字处理器或文本编辑器中写好的文本，添加图片，然后在浏览器窗口中移动元素，直到你对整体外观满意为止，最后保存最终结果。内置有一个“publish”（发布）实用工具，据称可以帮助你将制作的页面直接发送到
    Web 服务器，但其用途有限；如果你认真对待网页发布，最好使用 FTP。你的 SimplyMEPIS CD 包含 GFTP，一个很棒的（且非常简单）FTP
    客户端。


    ![](img/01efe5dd076565746bf3678068ba155c_95_0.png)


    #### 从一张空白像素页开始


    好吧，我们面前是一个未创建的网页。我们将称之为“创建关于 Mozilla Composer 的网页”。我们将首先粘贴一些最初在其他程序中编写的内容：


    ![](img/01efe5dd076565746bf3678068ba155c_95_1.png)


    只有不间断的文本，这很无聊。让我们添加一张图片。


    其中一个工具栏图标写着“Image”（图像），所以我们点击它。


    这可能是 Mozilla Composer 最棒的部分。使用此工具，你可以轻松调整图像的大小和位置。我们这里不会详细说明，因为 Mozilla 这一部分的说明相当好，比大多数软件说明都要好，你可以通过点击“Image
    Properties”（图像属性）窗口右下角的“Help”（帮助）按钮来访问它们。


    ![](img/01efe5dd076565746bf3678068ba155c_96_0.png)


    #### “Help”习惯


    养成点击“Help”（帮助）按钮并浏览它们显示说明的习惯是很好的。SimplifyMEPIS 附带的大多数软件在几乎每个屏幕上都有这些按钮，虽然其中少数指向的信息很少（或极少数情况下没有），但绝大多数都会直接带你到真正有帮助的页面。而且
    Mozilla 的文档在自由软件世界中是最棒的之一。


