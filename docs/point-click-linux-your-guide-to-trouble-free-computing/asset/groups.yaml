    # Setting Up KPPP


    Obviously, we want to choose “Configure.” And the main thing we want to configure
    is “Accounts,” so that’s where we’ll start by clicking “New.”


    ![](img/01efe5dd076565746bf3678068ba155c_64_0.png)


    That will give you a choice of “Wizard” and “Manual Setup.” You can look at the
    “Wizard” screen, but it won’t do you any good unless you’re in a country listed
    there—and the U.S. isn’t listed. If you’re in one of the listed countries, the
    “Wizard” will give you an instant list of popular ISPs there and help you get
    an account if you don’t have one already.


    Those of us in unlisted countries can use “Manual Setup” with no sweat, though.
    All we’re really doing is entering our ISP name and local dialup phone number.
    Not hard!


    Note that there’s an “Add” button. Use this to put in the ISP’s phone number.
    You can put in more than one number—a good idea in case one is sometimes busy
    or doesn’t work—by using the “Add” button more than once (assuming your ISP has
    multiple local phone numbers where you live).


    ![](img/01efe5dd076565746bf3678068ba155c_64_1.png)


    You almost certainly won’t need to worry about “Authentication.” If you try to
    connect to your ISP and fail after you get everything set up, it may need to be
    reset, but this is rare, and it’s something you can call your ISP to check on
    if you have trouble getting logged in. But we won’t worry about this now. We’ll
    just make sure we’ve put in a name and phone number for this connection and click
    “OK.”'
  - '[PAGE 65]


    # Ready to Connect


    The only thing left is to type in your ISP username and password. After you''ve
    done that, make sure your modem is correctly connected to the telephone line and
    click “Connect.”


    ![](img/01efe5dd076565746bf3678068ba155c_65_0.png)


    One of three things will now happen. The most likely is that you’ll uneventfully
    dial your ISP, get logged on automatically, and do whatever you want to do online.
    Your connection performance will be neither better nor worse using KPPP in Linux
    than with any other program in any other operating system.


    The second most-likely event is that your modem will dial correctly but that the
    login will fail, leaving you with a “Disconnect” notice that includes some numbers
    programmer may find useful but mean little or nothing to the rest of us. If this
    happens, the most common cause is a typo in your username or password. Retype
    them and try again, and everything should now be fine.


    The third problem, which happens with about five percent of all modems, is that
    you have a “Winmodem” that is simply not compatible with Linux or Mac or any other
    operating system other than Windows. MEPIS Linux will detect and automatically
    configure most Winmodems, but not all. There are ways to make almost any Winmodem
    work with Linux, but it’s a lot easier—and a lot cheaper, if your time has any
    value at all—tosimply buy and plug in a Linux-compatible external “hardware” modem
    if you have a desktop or a PCMCIA (card) modem if you have a laptop. (You can,
    of course, use a regular external modem with a laptop, but it’s less portable
    and convenient than a modem specifically designed for laptop use.)


    # Troubleshooting Modem Connection Problems


    The first thing to do when trying to figure out why a modem won’t connect under
    KPPP and Linux is to listen to it. If you hear nothing when you’re dialing your
    ISP, click “Configure” on the dialup screen and select the “Modem” tab.'
