    are thousands of possible ports. If they are all open on your PC, it means it
    will accept almost any kind of signal sent to it, including ones from bad people
    who want to steal your data or use your computer to send spam. If all the ports
    are closed, your computer won’t accept any data, period.


    So you keep some ports open by setting your firewall to allow certain signals
    through it, and in other cases (like HTTP), to allow signals in on that port only
    in response to signals it sends out.


