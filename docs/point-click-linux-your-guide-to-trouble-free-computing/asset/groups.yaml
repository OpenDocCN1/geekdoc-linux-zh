    Chapter 21


    # Digikam—Importing and Organizing Digital Photos


    igikam is a simple digital photo management application. When imported from your
    camera, your photos can be placed in albums that are automatically sorted chronologically.
    An easy-to-use interface allows you to connect your camera to your PC so you can
    transfer your images to your computer in only a few seconds, then—at your command—clear
    your camera''s memory.'
  - '[PAGE 169]


    # **Digikam Setup**


    The first screen you see when you start Digikam asks you where you want to store
    your photos. SimplyMEPIS already has a “Pictures” folder, so that’s a logical
    place to put them unless you want to make your own folder under a different name.
    (Because you can easily move your photos from folder to folder later with the
    KDE file manager, we’ll just put them in “Pictures” for this demonstration.)


    Next—and this is purely optional—we can choose how large we want our thumbnails
    (the miniature “preview” versions of our photos that show on our gallery pages)
    to be, and at the same time we have a chance to create “Album Collection Types”
    either by choosing one or more from a built-in list or by clicking “Add” to create
    a folder with a name you select.


    ![](img/01efe5dd076565746bf3678068ba155c_169_0.png)'
  - '[PAGE 170]


    # # Selecting a Camera


    The next step is to hook up a digital camera and set Digikam to work with it.
    To get to the camera setup utility from the window where we just set up our albums,
    we click the “Cameras” tab at the top. We also need to have our camera turned
    on and connected to our computer, usually through our USB port. Now we click “Auto-Detect.”
    The camera we have connected adds itself automatically to our camera inventory
    without fussing with driver CDs or any of that mess. If you have two digital cameras,
    hook up the second one, click “Auto-Detect” again, and it, too, will be added
    to the list. If you have three cameras, or four, or eight, just keep going.


    ![](img/01efe5dd076565746bf3678068ba155c_170_0.png)


    ![](img/01efe5dd076565746bf3678068ba155c_170_1.png)


    # ## Don’t forget to set your camera correctly


    The Nikon Coolpix 4300 we used for this demonstration has more than one picture
    transfer mode. The one Digikam (and most other PC camera programs) uses is called
    “PTP” (Picture Transfer Protocol), and if your camera isn’t set up using the right
    protocol, you won’t be able to transfer pictures. If you have problems uploading
    photos, the first thing you should check is your camera’s settings, not your computer’s.'
  - '[PAGE 171]


    # Downloading Pictures


    We download pictures by selecting “Cameras” from the top menu line in the main
    Digikam program window, then using the drop-down menu that gives us to select
    the camera we currently have connected to our computer.


    This gives us thumbnail views of all pictures in our camera’s memory.


    ![](img/01efe5dd076565746bf3678068ba155c_171_0.png)


    We can click on any one of the thumbnails to view it full-size.


    ![](img/01efe5dd076565746bf3678068ba155c_171_1.png)


    Okay, that picture looks decent. In fact, all of them look good enough to keep,
    so we’ll go back to the little filmstrip-like thumbnail view window, and click
    on the third icon from the left (which pops up a little box that says “download”
    when we run our cursor over it) to download all four pictures in our camera’s
    memory to our computer.


    ![](img/01efe5dd076565746bf3678068ba155c_171_2.png)'
  - '[PAGE 172]


    # **21: Digikam—Importing and Organizing Digital Photos**


    We have one gallery set up, called “More Pictures,” so that’s where these photos
    will go. If we had more than one gallery, we’d make a choice in the “Download
    To Album:” line at the bottom of the window or use the “Add Gallery” button to
    create a new gallery.


    ![](img/01efe5dd076565746bf3678068ba155c_172_0.png)


    Now, if we return to the main Digikam program window and click on our album’s
    name, we have the downloaded pictures in front of us.


    ![](img/01efe5dd076565746bf3678068ba155c_172_1.png)


    We can move pictures from one album to another or reorder them within their original
    gallery with the usual KDE “drag and drop” actions. We can click on pictures and
    see them full-sized, use icons to “zoom in” and “zoom out” and there’s an icon
    to the right of the two magnifying glass “zoom” icons we can click to expand the
    Digikam window to fill our entire screen—and click again while in full-screen
    mode to shrink the Digikam window back to normal size.


    ![](img/01efe5dd076565746bf3678068ba155c_172_2.png)


    ![](img/01efe5dd076565746bf3678068ba155c_172_3.png)


    159'
  - '[PAGE 173]


    # Altering Photos with Digikam


    Double-click on a picture in a Digikam gallery and it shows up full-sized in a
    new screen.


    We can now perform a few simple alterations on it either by right-clicking anywhere
    on the picture or by using the icons in the top menu to the right of the “ full
    screen ” one.


    ![](img/01efe5dd076565746bf3678068ba155c_173_0.png)


    From left to right, these icons let you


    +   - Change the photo''s contrast, color and gamma (brightness)

    +   - Rotate it 90, 180 or 270 degrees

    +   - Crop it to eliminate unwanted portions

    +   - Save it after you''ve made changes

    +   - Undo your changes if you decide you don''t like them


    As usual, running your cursor over these icons brings up a text box for each one
    that tells you what it does.


