    # ## Chapter 3


    # # Working with Linux: KDE and KWrite


    ![](img/01efe5dd076565746bf3678068ba155c_38_0.png)


    Now that we have MFPIS running, let''s play with it a little. We''ll explore some
    basic Linux functions here, including how to make, save, find, and move files,
    using a simple bit of text as an example. This is also the point where video instructions
    start coming into their own. Sometimes it''s easier to see how to do things when
    someone demonstrates how they work and talks you through the process instead of
    just giving you descriptions on a printed page.


