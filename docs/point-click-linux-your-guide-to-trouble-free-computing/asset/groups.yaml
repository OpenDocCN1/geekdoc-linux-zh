    # Point & Click Linux!


    A modem that dials, and that you can actually hear dialing, is a working modem.
    If you got an annoying “KPPD Daemon died unexpectedly” notice or something similar
    when you were expecting to see a notice that you were connected and your username
    and password were accepted, the problem is probably not with your modem or software.
    The most likely reason for this problem is, as mentioned previously, an incorrect
    username or password. A second possibility is the “Authentication” protocol. A
    few ISPs don’t use the generic “PAP/CHAP” method, but require either strict PAP
    or strict CHAP. You don’t need to know what these terms mean (although you can
    look them up through a search engine if you’re curious), just that you may need
    to use one or the other.


    ![](img/01efe5dd076565746bf3678068ba155c_67_0.png)


    This change is simple to make in KPPP. Go to your “Configure” screen, pick “Accounts,”
    choose “Edit” your account, and click the arrow to the right of “PAP/CHAP.”


    ![](img/01efe5dd076565746bf3678068ba155c_67_1.png)


    This will give you several choices, including both “PAP” and “CHAP” individually.
    Your ISP can tell you which one you should pick if this is an issue, or you might
    just try them both, one at a time; it takes less time to make this change than
    to dial an ISP’s customer service line and deal with voice mail menus.


    One last problem can keep you from connecting easily to an ISP, and it only happens
    with a tiny percentage of ISPs in the U.S., and a shrinking number in the rest
    of the world: a requirement that you enter a “Static IP,” a “Gateway,” and a “DNS
    IP Address” to use the service. Only ISPs with very old equipment still require
    these settings, and they require them no matter what operating system you use,
    so an ISP that uses them should readily give them to you if you ask. You probably
    already have them around as part of the signup information they gave you when
    you first started using their service.


    To change these settings, you are again going to “Edit” your account, and choose
    the IP, Gateway, and DNS tabs as the parts to edit. You’ll need to click “Static”
    or “Manual” to put in the numbers. And if an ISP says you must use their DNS (Domain
    Name Servers) while connected to them, you must not only type in their DNS but
    also click the “Disable existing DNS servers during connection” box in the “DNS”
    window.'
