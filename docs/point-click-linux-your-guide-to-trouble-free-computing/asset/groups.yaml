    Ooo 的几个流行功能——但不会多到让您迷失方向。此外，如果您不需要制作或编辑电子表格或创建幻灯片，您可以放心地跳过这些子章节，日后如果您认为了解这些领域可能对您有用，再在这些领域进行实验。


