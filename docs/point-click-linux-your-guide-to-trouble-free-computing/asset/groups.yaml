    that made use of their proprietary computer code—with other programmers and computer
    administrators who might also need it. Perhaps Stallman could have signed some
    of those non-disclosure agreements and contracted with computer vendors to write
    proprietary software for them, but he decided, instead, that it would be better
    to develop an operating system and software that could be used, modified, and
    shared by anyone, anywhere, without the licensing frustrations that typically
    accompanied proprietary software.


