    If you keep tagging email with a particular string of words in it as junk, before
    long any email containing that string of words will go straight to the junk folder.
    If you go through the junk folder now and then—perhaps every few days at first—and
    reclassify some of the emails that got shunted there as "Not Junk," the filter
    won''t classify future emails the considered similar as junk any longer. In other
    words, you train the filter according to your tastes instead of accepting someone
    else''s definition of spam.


    If you consign all your virus emails to junk world for a day or two, after that
    almost every one you get will go there automatically. With a little “tuning” by
    going through your junk folder a few times and marking anything that’s there and
    shouldn’t be “Not Junk,” you’ll soon have your junk filter doing a great job of
    screening your email for you.


    ## Setting Up Email Folders and Filters


    You can do many tricks with Mozilla mail beyond eliminating junk. One of the best
    is to automatically sort your email into many folders. There are several good
    reasons to do this. An obvious one is to keep professional and personal email
    separate. Another is to keep emails from each email list to which you’ve subscribed
    in its own file so you don’t confuse one with another. And filtering your list
    email messages will also keep your junk mail controls from inadvertently classifying
    email list messages as junk, which is a common problem with all spam and junk
    mail filters, not just Mozilla’s.


    ![](img/01efe5dd076565746bf3678068ba155c_80_0.png)


    We get to the “Message Filters” control box by clicking “Tools” at the top of
    our Mozilla email screen and selecting “Message Filters” from the “Tools” menu.
    We create a new message filter by clicking “New.”


    ![](img/01efe5dd076565746bf3678068ba155c_81_0.png)


    Now we need to make decisions. Do we want to sort our messages based on subject
    lines, sender, the "To" field or what? And to what folders should we send filtered
    messages?


    ![](img/01efe5dd076565746bf3678068ba155c_81_1.png)


    Here''s a real life example: As a member of the Suncoast Linux User Group, this
    book''s author participates in the SLUG (yes, we know it''s a silly name) email
    list. The letters SLUG appear in the subject line of every SLUG list email, so
    we choose "Subject Contains" as our filter method. When we are asked what folder
    we want to send these filtered messages to, we click "New" and create a folder
    called "Lists" for all our email list email.


    This is another action that''s easier and faster to figure out by doing than by
    reading a description. Click on things and see what they do. If you make a mistake
    you can always "Edit" or "Delete" a filter you created, so there''s no need to
    be afraid of making a wrong move.


    Now here''s a fun trick: What if you subscribe to a number of lists? Or have six
    relatives who email you regularly, and you want to put all of their emails into
    a single "Family" folder? This is where the ability to "Edit" a filter comes in.


