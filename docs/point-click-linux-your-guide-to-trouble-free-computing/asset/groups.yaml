    在使用 Windows 和其他操作系统时，您通常需要根据网卡制造商提供的 CD，为网卡安装特定的软件“驱动程序”。MEPIS Linux 内置了几乎所有主流网卡的驱动程序，包括无线网卡。它还内置了大多数主流数码相机、扫描仪、打印机以及您可能连接到计算机的其他设备的驱动程序。（如果您想添加在本书编写时之后才制造的硬件，您可能需要获取一个包含该设备驱动程序的更新版
