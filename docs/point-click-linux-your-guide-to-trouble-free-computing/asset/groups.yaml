    # Getting the Right Software Package


    In our search for *Abiword* we also found several related packages. These packages
    are either *Abiword* add-ons that will be installed automatically with the main
    package or may be specially “development” routines useful only for those of you
    who are programmers and systems administrators who want to modify *Abiword* in
    some way, but they are not the *Abiword* program itself. Always make sure you’re
    getting the “plain” package name you are searching for, not something related
    to it. It’s a good idea to get into the habit of checking the right-panel description
    before downloading to make sure you’re getting exactly what you want instead of
    something that’ll make you say, “Huh?!”


    # Successful installation


    When we click that “Install” button we get the “Install” window, which shows us
    not only the program we want to download but also any other programs that will
    automatically be installed along with it. All we need to do now is click “Install”
    on this screen to confirm that yes, we really do want to install this program
    and everything that goes with it, then sit back while things happen.


    ![](img/01efe5dd076565746bf3678068ba155c_205_0.png)


    ![](img/01efe5dd076565746bf3678068ba155c_205_1.png)


    When the install is finished, you’ll see a message at the bottom of the install
    window that says “RESULTS = 0.” You may see some messages on the way to this that
    look like something or other isn’t working right, but they are usually the result
    of one or two Debian servers out of many not working right or being down for maintenance,
    and you can safely ignore those messages.


    The real proof that your installation is successful is that your new program is
    added to your menus, and we see that *Abiword* is now listed in “Editors,” right
    where it should be.'
  - '[PAGE 206]


    # Uninstalling Software


    This is even easier than installing. You can find a program you want to uninstall
    with the same search tool you used to find one to install, and can cut the search
    time down by only searching “Installed” software.


    The only difference on the main KPackage screen, after we find the package we
    want to uninstall, is that we click “Uninstall” instead of “Install.”


    On the “Install” screen there is one additional step we want to take before we
    do our uninstall, namely clicking the “Test (do not uninstall)” checkbox before
    uninstalling. This will bring up a list of other programs that might be automatically
    uninstalled too, and will warn us if they might affect other software we want
    to keep. This kind of problem is very rare, and you can use your SimplyMEPIS CD
    to repair anything you break accidentally, but better safe than sorry, right?


    If only the program you want to uninstall shows up, you are safe. Unselect “Test
    (do not uninstall)” and go to it. The software package you no longer want will
    quietly disappear without a bit of fuss.


    ![](img/01efe5dd076565746bf3678068ba155c_206_0.png)


    Where to get software installation help:


    Mepis.org/forum is “the” place to go for answers to KPackage questions.


    # Other Software You Might Want to Try


    Your SimplyMEPIS CD only contains a fraction of the software available for Linux.
    The following is a partial list of additional software available through the MEPIS
    servers or from MEPIS on CD. It’s only a tiny taste of what’s there because the
    complete list would have taken 69 pages and constantly has new software added
    to it, so you’d need to check the latest version at MEPIS.org anyway.'
