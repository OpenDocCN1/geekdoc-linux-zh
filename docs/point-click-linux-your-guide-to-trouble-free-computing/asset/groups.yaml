    ## 1: 你可以用 Linux 做什么


    你可以在 Linux 内部运行 Windows 95、98 或 ME 的副本（以及几乎所有 Windows 程序）。由于以下几个原因，这与在同一台计算机上对
    Windows 和 Linux 进行“双启动”是不同的：


    - “双启动”意味着你的计算机上同时安装了 Windows 和 Linux，使用 MElps 可以很容易地做到这一点，但要从一个操作系统切换到另一个，你必须重新启动计算机。

    - 通常，通过 Linux 中的 Win4Lin 启动和运行 Windows 比单独运行要快得多。这听起来很奇怪，但这是事实。

    - 如果你在使用 Win4Lin 运行 Windows 时发生崩溃，不需要重启整个计算机，只需要重启 Windows 本身，这比从头开始引导的繁琐过程节省大量时间。

    - 在使用 Win4Lin 于 Linux 下运行 Windows 时，你可以使用 MElPS 附带的 Konqueror 文件管理器，将你使用 Windows
    软件创建的图像直接拖放到你正在用 Linux 程序创建的 Web 页面或其他文档中。这种灵活性让你可以同时使用最好的 Windows 程序和最好的 Linux
    程序，让你触手可及地拥有两者的优点，而无需在两者之间做出选择。


    最终，即使你决定仍想继续使用一些 Windows 程序一段时间，你很可能发现许多 Linux 程序并非仅仅“一样好”或“几乎一样好”比你习惯使用的 Windows
    程序——在许多方面，它们比其 Windows 对应物更好，并包含它们所缺乏的有用功能。


    ![](img/01efe5dd076565746bf3678068ba155c_20_0.png)


    我们为你们包含的（免费）Mozilla 邮件程序完全免疫于所有可以感染 Microsoft Outlook 或 Outlook Express 的病毒和蠕虫，并且它具有（免费的）内置垃圾邮件过滤功能，比你可以为
    Microsoft 邮件程序购买的许多插件过滤器更好。


    *SimplyMEPIs* 中的 Mozilla 浏览器具有 Explorer 缺乏的许多功能。它可以轻松屏蔽烦人的“弹出式”网络广告，并且它具有“标签式浏览”功能，使你可以轻松地从你最喜欢的新闻站点——或者在线购物时从目录站点——一次打开许多页面，然后通过单击关闭所有这些页面。


    ### 点击即用的 Linux！


    OpenOffice.org (OOo) 是我们包含的命名奇怪的办公套件，可以保存 Microsoft Office 无法保存的多种格式文档，包括 Adobe
    的 PDF，因此你可以在互联网上、纸上和 CD 上发布同一作品，而无需针对每种介质重写。在另一个方面，它比 Microsoft Office 更灵活：它可以读取、编辑和保存
    PDF 和 Microsoft Office 格式的文档，但 Microsoft Office 无法读取或编辑以原生 OOo 格式创建的文档，也无法创建 PDF
    文件。使用 OOo 的另一个优势是，它会自动“压缩”你保存的每个文档，因此占用的硬盘空间比 Microsoft Office 保存的文档少得多。如果你习惯使用
    Microsoft Office，OOo 起初可能会显得奇怪，但稍加练习你会发现，除了文件格式的灵活性外，它还有许多 Microsoft Office 没有的功能，可以使你的工作更快更容易。


    我们为 MEPIS 选择的 K3B CD/DVD 制作软件是我们使用过的任何操作系统中功能最强大的“刻录”程序。你将想要放在 CD 或 DVD 上的文件拖入
    K3B 窗口，按下“刻录”，就完成了。它还能自动检测并设置几乎所有常见的 CD 和 DVD “写入”驱动器，并且不需要为其中任何设备安装特殊的“驱动程序”。


    这些只是几个例子。当你探索 Linux 时，你会发现许多其他值得你喜爱的程序，包括用于科学研究、视频和音频编辑、网页托管和软件开发的专用软件。我们每个人都有不同的软件需求，没有一本书——或一张
    CD——能涵盖所有需求。


    在这本书以及配套的视频 DVD 和软件 CD 中，我们专注于用于日常家庭和办公桌面计算的文件，这样你可以立即开始使用 Linux 处理日常任务。当你对桌面
    Linux 感到自如后，你可以开始探索其力量在其他领域，直至通过连接数百甚至数千台 Linux PC 来构建自己的世界一流的超级计算机。


    但我们下周（或者明年）再担心构建 Linux 超级计算机的问题。现在，让我们将 *SimplyMEPIS* CD 放入你的计算机 CD 驱动器，花上一两个时间掌握
    Linux 基础知识。


    ## 第 2 章

    ### 运行 *SimplyMEPIS* CD


    MEPIS 作为“Live CD”运行，无需安装。在大多数 PC 上，运行 MEPIS Linux 就像将 *SimplyMEPIS* CD 放入 CD 驱动器并重启计算机一样简单。经过片刻的嗡嗡声后，你会看到一系列菜单选项。


    ![](img/01efe5dd076565746bf3678068ba155c_22_0.png)


    ![](img/01efe5dd076565746bf3678068ba155c_23_0.png)


    虽然这个菜单给你提供了许多选择，但在大多数情况下，你只需要等待几秒钟，让默认选择自动运行。如果默认选择未能正确启动——也就是说，你只看到空白屏幕——你需要尝试可用的选择，直到找到最适合你计算机的那一个。（特别注意“监视器分辨率”选择。每种品牌的监视器都有一个最大分辨率，超过该分辨率将无法显示。）


    我们还建议尝试几种不同的内核选择。Linux 内核是你操作系统的“心脏”，在某些计算机上，某些版本明显比其他版本运行更快。尝试每个内核选择只需几秒钟。你不需要为每次测试执行漫长的关闭程序；只需按电源按钮关闭计算机，重新打开，当菜单出现时，每次选择不同的菜单选项即可。


    你可能遇到的另一个陷阱是你的计算机完全拒绝读取 CD，在这种情况下，在你改变计算机的 BIOS 设置之前，你不会看到上面显示的菜单屏幕。


    ### 让计算机从 CD 启动


    如果当你第一次尝试时，你的计算机可以从 CD 启动并运行 *SimplyMEPIS*，你就不需要阅读这一节。


    但有些用户的计算机拒绝从 CD 驱动器而不是硬盘启动。这不是 Linux 的问题。许多 PC 出厂时其 BIOS（随主板附带的基本输入/输出系统）被设置为仅从硬盘启动。更改启动顺序并不难——当你知道怎么做时——如果你还不知道怎么做，这是一个很棒的小技巧，不仅适用于
    Linux，而且如果你需要安装新版本 Windows 或作为常规维护的一部分重新安装旧版本时也有用。


    并非所有计算机使用相同的命令进入 BIOS 设置（或者有些人在启动屏幕上称为“Setup”）。如果运气好，当你的计算机首次启动时，它会告诉你该怎么做，比如“Setup:
    F1”这样的小提示，可能会在你按下 F1 键之前闪过。没问题；用开关关闭计算机（因为操作系统尚未启动，所以不需要使用操作系统关闭程序），这次准备好手指。但在开始折腾你的
    BIOS 之前，请阅读以下加粗提示：


    > **警告：**

    >

    > 更改 BIOS 中的任何设置时要非常、非常小心。在更改任何设置之前，准确记录原始设置，并仔细阅读屏幕底部所有关于“如何更改/如何保存”的小字说明。如果你搞乱了
    BIOS，你的计算机可能无法启动任何操作系统；如果你设置了一些不应该设置的项并且它仍能启动，关键功能可能无法正常工作。更改 BIOS 中的任何设置时要非常、非常小心。


    话虽如此，当你进入 BIOS 设置时，你可能会看到一个屏幕，上面某处有“BOOT PRIORITY”（启动优先级）或“BOOT ORDER”（启动顺序）等字样。这就是你需要更改的地方。（此时你的鼠标可能无法工作。如果不能，你需要使用
    Tab 键或上下箭头键在行之间移动。）


    当你将光标放在“BOOT”行时，通常可以通过按空格键更改启动优先级。如果不起作用，尝试其他键。此时你什么都不会损坏。只有当你保存更改时，你才可能损坏系统，而且每个常见的
    BIOS 都有一个“退出不保存更改”的选项，如果你并不绝对确定你做对了，就可以使用它。


    显然，如果你打算从 CD-ROM 启动，你希望“CD-ROM”成为第一个启动选项。在你完成新安装（或者需要暂时返回已安装的操作环境）之后，你可以将启动优先级改回实验前的状态。


    ### 将 BIOS 访问视为一个需要解决的谜题


    我们用来做测试计算机的一台 HP 台式机不仅仅给你一个单一的 BIOS 屏幕。首先，你按 F10 访问 BIOS 设置程序，然后从菜单中选择“Advanced
    CMOS Setup”（高级 CMOS 设置）来查找你的启动优先级。说明都在屏幕上，但你需要阅读它们，而不是盲目地按键和希望成功。


