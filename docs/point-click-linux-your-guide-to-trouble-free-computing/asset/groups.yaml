    “Okay,” you say. “So what?”


    Imagine you’re looking for information at the Linux.com Web site.


    You see an article you want to read, so you open it in a new tab:


    If we’d just done our usual left mouse button click to open that new page and
    wanted to go back to the main page to check out articles, we’d have to reload
    it. But by opening the fresh page in a tab, we didn’t move off the main page,
    so we can go back to it without waiting for it to load again. Now we can scroll
    down, spot another article we want to read, and open that new article in another
    tab, like this:


    ![](img/01efe5dd076565746bf3678068ba155c_85_1.png)


    We can go on and on like this until we have so many tabs open that we can’t read
    the writing on them because they’re so crammed together.


    ![](img/01efe5dd076565746bf3678068ba155c_86_0.png)


    Now we have 20 tabs open, and we could have more if we wanted. Try this with a
    search engine: instead of clicking on one search result, going back to the search
    engine page, clicking on another listing, click-click-click open a whole bunch
    of them in new tabs. This is especially nice if your Internet connection is slow
    or you run into pages that don''t load quickly or don''t load at all. Instead
    of coming to a stop, you can read one page while the others load in the background.
    This is a huge advantage when you''re doing any kind of research—and a huge convenience
    when you''re reading news online.


    ### Don''t worry about opening too many Web pages


    You can open a dozen windows, each for a favorite news Web site, and open ten
    or twenty tabs in each window. With Mozilla you can have a hundred or more Web
    pages open at the same time without any problem, and Linux won''t crash under
    the load. It''s an industrial-strength operating system, built like a truck to
    handle heavy-duty computing, and Mozilla is a heavy-duty browser that can handle
    nearly as much load as Linux. One of the things people who are used to other operating
    systems often have trouble understanding about Linux is just how rugged it is.
    Some people have gotten into the habit of only opening a few programs or browser
    windows so that their system is less likely to crash. With Linux this habit can
    safely be broken and you can use your computer like a draft horse, not like a
    prancing pony. Of course, after you''re accustomed to using a strong operating
    system like Linux, it''s going to be hard to go back to other, more delicate ones...


    Mozilla can block popup Web ads for you. In fact, the first time one shows up
    after you start using Mozilla, you will be asked if you want to block popups,
    and will be led by the hand through the procedure for stopping them.


    However, there are some Web pages that use popups to display illustrations (this
    is common on many shopping sites). If you run into one of these sites, click “Tools”
    at the top of the window, and select “Popup Manager.” You’ll see two choices.
    The easiest one, if you’re currently on the site from which you want to accept
    popups, is “Allow Popups From This Site.”


    Click “Add” next to the site address in the form space at the top of the window,
    then “Okay” at the bottom of the window, and popups on this site will be allowed
    in the future.


    If you select “Manage Popups” instead of “Allow Popups From This Site” you’ll
    get the same little screen but without a Web site address in the top form. You
    can type or paste one in if you like, or if you have a site from which you have
    been allowing popups but no longer wish to accept them, you can delete it from
    the list so that it can no longer give you popups.


    ![](img/01efe5dd076565746bf3678068ba155c_87_0.png)


    Almost all Mozilla preferences are set through the “Edit” choice at the top of
    the browser window, specifically the “Preferences” screen you get if you click
    on the bottom selection in the “Edit” menu.


    You’ll notice that it’s no big deal to change the page Mozilla displays when you
    first start the program. It can be anything you like—or if you choose “Blank Page”—nothing
    at all.


    ![](img/01efe5dd076565746bf3678068ba155c_88_0.png)


    You can access other groups of settings by clicking on the little arrows in the
    left column of the “Preferences” window. When you click on those arrows they’ll
    turn downwards and open up a new list of options, like this:


    ![](img/01efe5dd076565746bf3678068ba155c_88_1.png)


    You don’t need to worry about “Helper Applications” because the most popular ones
    are already included with the *SimplyMEPIS* CD that’s part of this book, but the
    other areas this screen shows are worth exploring. For instance, the most convenient
    way to use “Tabbed Browsing” is usually to have the new pages load in the background
    while you read the one you’re already on, but that is not the Mozilla default.
    You may want to change this. It only takes a single click.


    Other “Navigator Preferences” are obvious if you look at the screens. For instance,
    you can change your search engine preference—the one you get when you click on
    “Search” just to the right of the form where you type URLs in a browser window—through
    the “Internet Search” screen, and again a simple click-click makes your change.


    After exploring “Navigator Preferences,” you ought to spend a few minutes checking
    out “Privacy and Security” and “Advanced” options, especially “Scripts and Plugins”
    under “Advanced.”


    ![](img/01efe5dd076565746bf3678068ba155c_89_0.png)


    The most important button here is probably the “Move or Resize Windows” one. If
    you make sure this is *unchecked*, it will keep Web sites from taking control
    of your browser window and making it full-screen or otherwise changing it without
    your say-so. The other choices are less important; you will probably want to keep
    “Change Images” checked because many online slide shows rely on this javascript
    feature to work. The other choices won’t affect most of your Web use. You can
    leave them alone and no harm will be done.


    Other “Advanced” configuration options are nice to explore if you have time, but
    unless you’re an advanced user they really aren’t necessary.


    ## Creating Bookmarks


    *Microsoft Internet Explorer (MSIE) calls them “Favorites,” but “Bookmarks” is
    the original browser term for Web addresses you save so you can return to them
    later. Your SimplyMEPIS version of Mozilla comes with a number of preset bookmarks,
    but you can easily delete any you don’t want and just as easily add your own.
    Many of the Mozilla screenshots in this book show the author’s bookmarks, which
    are decidedly not the same ones chosen by SimplyMEPIS creator Warren Woodford.
    And in the Linux “it’s all about choice” spirit, you are encouraged to create
    your own set that matches your taste.*

