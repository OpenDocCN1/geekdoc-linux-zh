  - '[PAGE 6]


    # ## Acknowledgments


    A large number of people did most of the "real work" that made this book possible,
    notably thousands of Linux, GNU, KDE, Debian, and other free and open source software
    developers. It''s impossible to thank each one individually here; the list of
    names and accomplishments would take many hundreds of pages.


    Warren Woodford and the MEPIS development team created the SimplyMEPIS CD in the
    back of this book; they also maintain the MEPIS.org/forums Web site that is the
    primary source of technical support for MEPIS Linux. Please consider supporting
    their work by registering your copy at MEPIS.org or—better yet—purchasing a MEPIS
    subscription. The price is small and the benefits are large.


    Jem Matzan and Joe Barr contributed chapters and helped me make sure the manuscript
    had as few technical errors as possible. Howard Lee Harkness and Jay Lyman also
    contributed valuable suggestions, as did many visitors to PointAndClickLinux.com
    who commented on early chapters I posted there while the book was still taking
    shape.


    ThePointAndClickLinux.com Web site was created by Brice Burgess; Damen Shaquiri
    of EvolvMedia made the video DVD. Logan Tygart and other members of the Suncoast
    Linux Users Group helped develop the VNC-based production method we used for the
    videos, a project that has now taken on a life of its own beyond this book. (You
    can see some of this work in the form of additional videos available at PointAndClickLinux.com.)


    Elise Walter had the unenviable task of whipping the final manuscript into publishable
    form. I am a cantankerous and often quirky writer, but she remained patient with
    me and got the job done—and done well.


    And when it comes to patience, my wife Debbie is the reigning world champion.
    My normal workweek as editor in chief for a group of open source news and information
    Web sites (OSTG.com) is draining enough; when I piled the work of turning out
    a book on deadline on top of that, Debbie hardly had a husband for many months.
    She literally brought me meals in my home office and rubbed my shoulders as I
    typed late into the night. I have never understood why such a beautiful, talented,
    and supportive woman chose to marry me, but I am not complaining. Instead, I am
    showering her with gifts, hugs, and everything else I can think of in return for
    her help in making this book possible.


    -Robin ''Roblimo'' Miller


    Bradenston, Florida'
