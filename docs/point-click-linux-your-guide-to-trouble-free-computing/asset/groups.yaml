    +   * **Freeciv-client-gtk**—Program needed to join the worldwide Freeciv online
    multiplayer strategy game (*www.freeCiv.org*)

    +   * **Gatos**—All-in-Wonder TV capture software, assuming you have an ATI All-in-Wonder
    card; software for the more common WinTV and related TV cards is already installed
    on your system

    +   * **Gnome-desktop-environment**—MEPIS uses the KDE Desktop, but the Gnome
