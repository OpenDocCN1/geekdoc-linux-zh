  md: '# Point & Click Linux!


    # System


    We''re starting to move into systems administrator territory here. If you''re
    a sysadmin just moving to Linux, these tools will make your life a lot easier
    than it would be without them. If you''re not a sysadmin, this part of your KDE
    menu is where you start taking full control of your computer in a way you can''t
    with the most popular proprietary PC operating systems.


    ![](img/01efe5dd076565746bf3678068ba155c_195_0.png)


    We''ll cover most of the **System** tools in this book''s "Beyond the Basics"
    section, which is coming up in just a few pages. Right now, we''ll just take a
    look at a few of the simpler ones.


    ![](img/01efe5dd076565746bf3678068ba155c_195_1.png)


    A good place to start is the **KDE Info Center**. This utility will tell you nearly
    everything about your PC.


    We''re looking at our computer''s memory use. If you don''t understand everything
    going on here, don''t worry. You can click through other characteristics. Some
    listings will be interesting and some will be puzzling. The more you know about
    your computer''s inner workings, the fewer entries that will be puzzling. But
    it''s all fun to know, even if you don''t understand it all at first. (And no,
    you don''t need to know all this stuff to use Linux. The system will


    ![](img/01efe5dd076565746bf3678068ba155c_195_2.png)'
  merge: -1
  img_proc: true
- pgno: 196
  md: 'function perfectly well on its own— but if you choose to learn, you may be
    able to hot-rod your computer a bit by customizing a few settings here and there.)


    Another good part of the **System** menu to check out is the *Monitor* submenu.


    There are only four listings here. The first one, **KCPULoad**, tells you how
    much work your computer CPU (Central Processing Unit) is doing at any given moment.
    Click on this entry and you''ll get a little icon toward the right end of your
    control panel, kind of like the constantly moving "gas mileage" figure new cars
    often give you. Click on the icon and you get a little box that gives you those
    figures as text. Fun! And useful; if your computer is working so hard that you''re
    seeing 80% CPU usage or higher, you may want to consider running fewer programs
    at once to keep your computer from slowing down.)


    ![](img/01efe5dd076565746bf3678068ba155c_196_0.png)


    The second listing here is the ***KDE System Guard***. This is a powerful tool
    for systems administrators, and is good to know about even if you consider yourself
    an ordinary desktop computer user with no real desire to become a Linux wizard.
    A few minutes poking around the ***KDE System Guard Handbook*** (click the inevitable
    "Help" button to bring it up) can teach you a lot about how computers and networks
    operate. You can look- ing at the various ***KDE System Guard*** functions. Again,
    you may not understand everything you see here. But even if you don''t, it''s
    nice to take a little peek at what''s going on under the hood, as it were.


    ![](img/01efe5dd076565746bf3678068ba155c_196_1.png)


    KNetLoad tells you about your network and how it''s working, such as how fast,
    and how much data you''re transferring. If the numbers drop to zero, your connection
    is broken. And even if it''s just slower than usual, you may want to do something
    about it, even if that "something" is calling your ISP to ask what''s going on.
    (At least you *know* there''s a problem instead of guessing.)


    ![](img/01efe5dd076565746bf3678068ba155c_196_2.png)'
  merge: -1
  img_proc: true
- pgno: 197
  md: '# Point & Click Linux!


    **KNetLoad** is another icon that gives you text statistics when you click on
    it.


    **XKill** is a last-ditch thing. Click on **XKill**, then click on a program window
    that''s frozen up or otherwise not behaving right, and **POOF!** that program
    shuts down and disappears. The only program that may give you trouble after being
    killed this way (which, thankfully, it almost never needs) is Mozilla. If you
    **XKill** Mozilla, you may need to reboot your PC to get Mozilla working correctly
    again.


    ![](img/01efe5dd076565746bf3678068ba155c_197_0.png)


    # Utilities


    These are small programs that do this and that. We''ll cover **Ark**, the archiving
    tool, in the next chapter. The other utilities are self-explanatory. Just click
    on them and see what happens. Not everybody finds all these little programs useful,
    but enough people find enough of them helpful that they''re here for you.


    ![](img/01efe5dd076565746bf3678068ba155c_197_1.png)


    And with that, we''ll take a break. After the break, it will be time to start
    exploring some of the ways you can customize Linux by adding (or removing) software
    and generally changing things around to suit your personal taste.'
