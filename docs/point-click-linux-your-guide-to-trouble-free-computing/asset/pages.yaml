- pgno: 106
  md: 'The way we got from the large image to one the right size for our page was
    through this screen:


    ![](img/01efe5dd076565746bf3678068ba155c_106_0.png)


    We got the “Graphics Control” screen by first clicking on the picture, which “focused”
    us on the photo. We knew we were focused on the photo because it suddenly grew
    little green squares at its edges. Then, after we''re “on” the photo, we clicked
    again to see the many things we could do to it. This isn''t a course in graphics
    handling, so we won''t give you a lot of instructions here. Besides, it''s easier
    and faster to grab a picture and click on this and that to see what happens than
    it is to read about it. You can''t hurt anything if you click around here; in
    the end, after you''re done playing with your document and any pictures you put
