- pgno: 119
  md: '# Point & Click Linux!


    This is a picture of my assistant, Brice Burgess, taken while sailing at sunset
    on Sarasota Bay. It''s a great sunset, but for publication we need to make this
    picture smaller and cut out most of the background. We open the photo the same
    way we open any other file, by selecting "File" from the menu at the top left
    corner of the Ooo window, selecting "Open" from the choices available, and highlighting
    the file we want from the list we''re given. (Remember, we discussed the file
    system in Chapter 2, "Running the SimplyMEMPIS CD." If you don''t remember how
    to use it, this is a good time to spend a minute reviewing those pages.)


    ![](img/01efe5dd076565746bf3678068ba155c_119_0.png)


    You''ll see that the photo opened as part of a slide or text page, not as its
    own window. This is how Ooo handles pictures—as part of something else, not all
    by themselves. To isolate the image so we can work with it, we click on it so
    that it grows little “handless” at its edges, like this:


    ![](img/01efe5dd076565746bf3678068ba155c_119_1.png)'
