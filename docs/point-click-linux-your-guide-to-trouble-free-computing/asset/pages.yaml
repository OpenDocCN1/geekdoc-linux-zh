  md: '# Point & Click Linux!


    As our introduction to OOO Calc, and to spreadsheets in general, we''re going
    to create a simple chart showing a year''s worth of sales for a hypothetical company
    that has five accounts, broken down month-by-month.


    We start with a blank spreadsheet by selecting "File" from our top left menu in
    any OOO screen, then "New," then "Spreadsheet." That gives us a blank spreadsheet.


    ![](img/01efe5dd076565746bf3678068ba155c_125_0.png)


    Note that our blank spaces are shown as "1,2,3..." going down, and "A, B,C..."
    across the top. Each blank space has a location like "A1" or "B10." We''re going
    to start by putting the months of the year across the top of the spreadsheet in
    A2, A3, and so on, up to A13. We''re going to leave the "A" column blank because
    that''s where our client names will go. And come to think of it, since some of
    our client names may be too wide to fit in that little blank, let''s make the
    "A" column a lot wider before we do anything else.'
