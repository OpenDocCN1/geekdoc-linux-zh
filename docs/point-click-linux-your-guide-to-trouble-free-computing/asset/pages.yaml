  md: '# ## Sharing Your Linux Computer


    Your settings, including language, are yours. But you can give someone else access
    to your computer without sharing your settings by creating a separate login for
    them by clicking the K-Gear, then “System,” then scrolling down to “KUser” and
    typing in your password when requested. This brings you to the User Manager screen,
