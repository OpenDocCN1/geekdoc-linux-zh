- pgno: 95
  md: 'Composer is a simple WYSIWYG (What You See Is What You Get) Web page design
    tool that takes no knowledge of HTML to use, although at least a little knowledge
    will help you turn out a better page. You use it much like a word processor by
    either typing in text or pasting in text you wrote in another word processor or
    text editor, adding pictures, then moving things around in the browser window
    until you like the way everything looks, and saving the end result. There’s a
    built-in “publish” utility that’s supposed to help you send a page you made directly
    to a Web server, but it is of only limited use; you are better off using FTP if
    you are serious about Web publishing. Your SimplyMEPIS CD includes GFTP, a great
    (and very simple) FTP client.


