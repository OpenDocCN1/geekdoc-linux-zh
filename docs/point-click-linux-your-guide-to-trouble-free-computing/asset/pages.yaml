- pgno: 102
  md: '# Chapter 11


    # OpenOffice.org Writer


    ![](img/01efe5dd076565746bf3678068ba155c_102_0.png)


    penOffice.org Writer is your full-featured word processor, probably the most popular
    OOO function. To create a text document, type in some words. Basic formatting
    works about the same as in any other word processor. To save your work, click
    on the "File" option at the top of the screen and select "Save." You''ll need
    to name your document. Unless you change where you want it saved from the default
    setting, it will go into a folder called "Documents" in your "home/you" directory.'
  merge: -1
  img_proc: true
- pgno: 103
  md: 'You have a wide choice of formats you can use to save your work. The OOO native
    ".sxw" is usually best unless you''re going to send this document to someone who
    only has Microsoft Office, in which case you''ll probably want to use the extra
    hard drive space it takes to save it in Microsoft Word format. Or, if you''re
    going to publish it on the Web, you may want to choose HTML. But you don''t need
    to make this decision while you''re still typing. It''s good to save as you work
    "just in case," and you might as well use the standard OOO file format. You can
    always save your final version in a different file format later.


    # **Save early, save often**


    Even though Linux and OOO are highly reliable, it''s always a good idea to save
    your work as you go along. What if you wander away from the computer and a cat
    jumps on the keyboard or someone else starts pushing keys? You might get distracted
    and shut your computer off by mistake, or you might be using a laptop that runs
    out of battery power; or the power to your desktop might go off for a second.
    You never know.


    Saving your work takes next to no time; hit "Ctrl+S" and everything you''ve written
    up until that moment will be saved to your hard drive.


    The .sxw format OOO uses is just a fancy name for "Zipped XML," which means your
    work is first saved in the industry-standard "XML" format, then compressed using
    the industry-standard ".tar" protocol so that it takes up less hard drive space
    and makes for speedier email if you send your documents as email attachments.


    If you need to open an OOO file without a copy of OpenOffice.org (or its commercial
    cousin, StarOffice) handy, you can "unzip" the file with almost any zip/unzip
    utility, in any operating system, and then read your text with almost any word
    processor, including Microsoft Word.


    Another "Save" option in the OOO "File" menu isn''t called "Save," but "Export."
    At this writing, the only format to which you can "Export" is PDF, and you can
    get the same result by clicking the "Export to PDF" line just below the "Export"
    choice. Presumably, there will be other "Export" choices in the future, which
    is why there''s a separate "Export" choice with room of other to-be-included formats,
    but for the moment PDF is fantastic enough. PDF, the "Portable Document Format"
    from Adobe, is the preferred format for many online documents that may be printed
    out by users, as well as in other situations where documents must look the same
    whether they are on a computer screen or paper.'
  merge: -1
  img_proc: true
- pgno: 104
  md: 'Because PDF documents cannot be easily altered or have sections copied by readers,
    many copyright holders like to distribute their most valuable work this way. Many
    government agencies and academic institutions that want people to see exactly
    what they wrote, with line numbers and footnotes in the same place every time
    (which may not happen with HTML or other document formats), also prefer PDF.


    Microsoft Word and Office don’t save to PDF without special “add-on” programs.
    This, alone, is a good reason to start using OoO as your primary word processor
    and to encourage friends and coworkers to use it as well.


    # ## Adding Pictures to OoO Documents


    At the top of your OoO screen, you have a typical list of choices you can click
    to bring down menus: “File—Edit—View—Insert—Format—Tools—Windows—Help.”


    “Insert” is your key here, specifically “Graphics” from the menu you see when
    you click “Insert.” There’s a “Scan” option that will take a graphic directly
    from a scanner, but “From File” is a more common choice. This brings up a list
    of hinky-looking arrows and other symbols and displays them so much larger than
    they should be printed that they look awful.


    ![](img/01efe5dd076565746bf3678068ba155c_104_0.png)'
  merge: -1
