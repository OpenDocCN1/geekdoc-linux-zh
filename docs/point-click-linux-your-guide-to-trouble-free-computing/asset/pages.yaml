- pgno: 23
  md: '# Point & Click Linux!


    While this menu gives you a number of choices, in most cases you can just wait
    a few seconds and let the default selection run automatically. If the default
    selection does not start correctly—that is, if you see nothing but a blank screen—you
    will need to experiment with the available choices until you find the one that
    best suits your computer. (Pay particular attention to the “Monitor Resolution”
    choice. Each make of monitor has a maximum resolution and will not display beyond
    it.)


    ![](img/01efe5dd076565746bf3678068ba155c_23_0.png)


    We also advise trying several different kernel choices. The Linux kernel is the
    “heart” of your operating system, and some versions work noticeably faster than
    others on some computers. It only takes a few seconds to try each kernel selection.
    You don’t need to go through a long shutdown procedure for each test; just shut
    your computer off with the power button, turn it back on, and when the menu comes
    up, make a different menu choice each time.


    Another pitfall you may encounter is a total refusal by your computer to read
    the CD, in which case you will not see the menu screen shown above until you change
    your computer’s BIOS settings.


    # Making Your Computer Boot from a CD


    If your computer starts from the CD and runs *SimplyMEPIS* the first time you
    try, you don’t need to read this section.


    But some users have computers that refuse to boot from their CD drives instead
    of their hard drives. This is not a Linux thing. Many PCs come from the factory
    with their BIOS (the Basic Input/Output System that comes with the motherboard)
    set to boot only from the hard drive. Changing the boot order is not hard—when
    you know how to do it—and if you don’t already know how to do this, it’s a great
    trick to master not only for Linux use but also if you ever need to install a
    new version of Windows or reinstall your old one as part of normal maintenance.'
  merge: -1
  img_proc: true
- pgno: 24
  md: "# **2: Running the SimplyMEPIS CD**\n\nNot all computers use the same commands\
    \ to get you into the BIOS setup (or just “Setup” as some call it on their boot\
    \ screens). If you’re lucky, when your computer first starts it will tell you\
    \ what to do as it boots up, with a little note like “Setup: F1” that probably\
    \ scrolls by before you can hit the F1 key. No problem; shut the computer off\
    \ with the switch (you don’t need to use the operating system shutdown procedure\
    \ because the operating system hasn’t started yet), and have your finger ready\
    \ this time. But before you begin messing with your BIOS, please read this bold-face\
    \ note:\n\n> **WARNING:**\n> \n> Be very, very careful when you change anything\
    \ in your BIOS. Make exact notes of the original settings before you change anything\
    \ at all, and read all the little “how to change/how to save” text at the bottom\
    \ of the screen very carefully. If you mess up your BIOS your computer may not\
    \ boot any OS, and if you set something you shouldn’t and it still boots, vital\
    \ functions may not work correctly. Be very, very careful when you change anything\
    \ in your BIOS.\n\nThat said, when you get into your BIOS setup you’ll probably\
    \ see a screen that has words like “BOOT PRIORITY” or “BOOT ORDER” somewhere on\
    \ it. This is what you need to change. (Your mouse may not work at this point.\
    \ If it doesn’t, you will need to use your Tab or up and down arrow keys to move\
    \ between lines.)\n\nWhen you get your cursor on the “BOOT” line, you can usually\
    \ change the boot priority by hitting the space bar. If this doesn’t work, try\
    \ other keys. You can’t hurt anything at this point. It’s only when you save changes\
    \ that you can damage your system, and every common BIOS has an option for “Exit\
    \ without saving changes” you can use if you’re not absolutely, positively sure\
    \ you did the right thing.\n\nObviously, you want “CD-ROM” to be the first boot\
    \ choice if you’re going to be booting from a CD-ROM. After you do your new installation\
    \ (or need to return temporarily to the operating system you already have installed)\
    \ you can change the boot priority back to the way it was before your experiment.\n\
    \n# **Think of BIOS Access as a Puzzle To Be Figured Out**\n\nOne HP desktop we\
    \ use for a test computer doesn’t just give you a single BIOS screen. First, you\
    \ hit F10 to access the BIOS setup program, then you choose “Advanced CMOS Setup”\
    \ from a menu to find your boot priority. The instructions are all there, right\
    \ on the screen, but you need to read them instead of just clicking keys and hoping."
  merge: -1
  img_proc: true
- pgno: 25
  md: '# # Point & Click Linux!


    Other manufacturers have other little BIOS tricks. After you''ve become accustomed
    to changing BIOS settings you won''t have trouble figuring them out. Only the
    first few times are hard. If you think carefully before you save, and make sure
    you read all the text on the BIOS setup screens before you start making changes
    (and take notes before you start hitting keys, so that you can return to the default
    settings easily), you''ll figure it all out without fuss.


    # ## A List of Common BIOS Access Commands


    We compiled this list from various online sources. It is not complete, but covers
    some of the most common computer manufacturers'' most popular products. If your
    computer isn''t listed, try some of the most common access commands; you can''t
    hurt anything by trying them. And if that fails, your computer or motherboard
    manufacturer''s documentation or Web site is a sure source of information about
    your BIOS, and is the ultimate place to turn. You''ll need to know your computer''s
    exact model number (and possibly serial number) to get the right commands, because
    they vary from motherboard to motherboard, and computer manufacturers can (and
    often do) change motherboard suppliers in the middle of a production run without
    telling anyone.


    +   1. Acer—F1, F2, CTRL+ALT+ESC

    +   2. AST—CTRL+ALT+ESC, CTRL+ALT+DEL

    +   3. Compaq—F1 or F10

    +   4. Dell—400 F1 or F3

    +   5. Dell—Dimension F2 or DEL

    +   6. Dell—Inspiron F2

    +   7. Dell—Latitude F2

    +   8. Dell—Optiplex DEL or F2

    +   9. Dell—Precision F2

    +   10. eMachine—DEL

    +   11. Gateway—F1 or F2

    +   12. HP—F1, F2 or F10'
  merge: -1
  img_proc: true
- pgno: 26
  md: '+   13. IBM (PC) — F1

    +   14. IBM E-pro Laptop — F2

    +   15. IBM PS/2 — CTRL+ALT+INS after CTRL+ALT+DEL

    +   16. Micron — F1, F2 or DEL

    +   17. Sony® — VIAO F2 or F3

    +   18. Tiger — DEL

    +   19. Toshiba — ESC or F1


    # **If You Can’t Figure Out How to Change Your BIOS Settings…**


    …make a boot floppy. Here’s how you do it in Windows:


    +   1. Start Windows.

    +   2. Place the *SimplyMEPIS* CD in your CD drive with Windows running.

    +   3. Open a DOS Window (in Windows).

    +   4. Go to the linux directory on the CD.

    +   5. Insert a blank, formatted floppy disk in your floppy drive.

    +   6. Execute *mkbootfloppy.bat*.

    +   7. Reboot with the floppy in your floppy drive and the *SimplyMEPIS* CD in
    your CD drive. Your computer should now run *SimplyMEPIS*.


    # # Booting MEPIS


    Linux is very methodical in the way it starts. Each function of your computer
    is tested. This means your Linux startup may be slower than in other operating
    systems, but sometimes “slow but sure” is best. Another thing that’s slowing things
    down is that you’re running your software from the CD drive instead of from the
    hard drive. CD drives are much slower than hard drives, to the point where anything
    you do from the LiveCD is going to seem like it’s happening in slow motion instead
    of at full speed. You’ll find that after you get MEPIS installed on your hard
    drive, everything will take place between two and ten times as fast as it does
    when you’re running from the CD.'
  merge: -1
  img_proc: true
- pgno: 27
  md: '# # Why MEPIS Linux Asks for a Password


    After the startup routine, the screen may either look funny, like static, or go
    blank for a second. Then you''ll see a login screen that gives you two choices:
    "Demo" and "root."


    ![](img/01efe5dd076565746bf3678068ba155c_27_0.png)


    It''s best to start with the user name *demo* rather than use *root*, especially
    if you intend to connect to the Internet. This is a security measure, and is one
    of the big reasons Linux doesn''t fall prey to the viruses and worms that plague
    the users of some other operating systems.


    When you are logged in as a *user*—probably your own name once you get MEPIS Linux
    installed permanently—the only part of the system you will be able to change is
    your own data and things like screen color and some other appearance options.
    To install software or make any heavy changes to the system, Linux requires you
    to log in as *root*. If you are logged in as a *user*, malicious hackers can''t
    easily install software you don''t know about or perform other mischief.


    Cats, children and well-meaning friends can''t mess up your computer by typing
    in the wrong commands, either, as long as you are logged in as a *user* and not
    as *root*. In fact, when you do the actual Linux installation you''ll be able
    to give other users their own user accounts so they can log in and use your computer
    without disturbing (or ever seeing) your private information, email or anything
    else you store in your computer. And each user can choose his or her screen colors
    and other custom features, too, including Web site bookmarks and favorite music.
    With Linux, a whole family can share a computer, but it can be a "personal computer"
    for each family member since each can have his or her own user login.


    Only root gets to see everything. (That''s going to be you, right?)'
  merge: -1
  img_proc: true
