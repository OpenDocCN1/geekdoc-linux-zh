    command. Of course, ls is much more powerful and sophisticated than its cousin
    from Redmond, but that goes without saying.


    The basic format of the command is


    ```

    `ls [options]... file-or-directory-names`

    ```


    Without any options, the command produces a list of file names in alphabetical
    order for either the current directory or the directories.


    Of course, there may be "hidden" files in that directory. To find out, we need
    to add an'
