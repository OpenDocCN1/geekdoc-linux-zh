- pgno: 259
  md: '# Mandrake Linux


    This was the first Linux distribution that worked hard to make Linux easy for
    ordinary desktop users. The company that produces it, MandrakeSoft, has had many
    ups and downs since it was founded in 1998, and some of their releases have had
    quality control problems, but Mandrake Linux is now stable and workable for users
    at all levels, not just beginners.


    www.mandrakelinux.com


    # The Fedora Project


    This is a community-developed, freely downloadable distribution that replaces
    the old no-charge version of Red Hat Linux but is still sponsored and supported
    by Red Hat. It is generally targeted more toward hobbyists and experimenters than
    desktop computer users.


    (fedora.redhat.com)


    # Knoppix


    A bootable CD with a collection of GNU/Linux software, automatic hardware detection,
    and support for many graphics cards, sound cards, SCSI and USB devices and other
    peripherals. It is similar to MEPIS in many ways, and will sometimes work with
    "oddball" hardware that give MEPIS trouble, but is somewhat harder to install
    on your hard drive.


    (www.knoppix.com)


    # The Debian Project


    Debian is a true free (in both sense of the word) software project and it''s the
    one on which MEPIS is based. Debian is generally command-line-oriented, but has
    some GUI system tools available.


    (www.debian.org)'
  merge: -1
  img_proc: true
- pgno: 260
  md: '# SUSE Linux


    SUSE is a division of enterprise networking leader Novell, Inc., and while there
    is a down-loadable version of SUSE available, you must purchase a copy to get
    some of SUSE’s prop-rietary system tools, and license restrictions prohibit sharing
    these tools. SUSE places a heavy emphasis on corporate sales, but is excellent
    for individual desktop users, too. It’s a well-integrated package, suitable for
    new and experienced users.


    (www.suse.com)


    # Slackware Linux


    One of the oldest continuously-published Linux distributions, aimed at hobbyists
    and Linux sophisticates, not desktop users. You will use the command line quite
    a bit if you run Slackware.


    (www.slackware.com)


    # Gentoo Linux


    A completely free Linux distribution geared towards developers and network professionals
    that uses a unique package management system called Portage instead of the more
    com-mon RPM and DEB systems.


    (www.gentoo.org)


    # Xandros


    An excellent desktop distribution based on the old Corel Linux OS. Debian-based,
    works well, easy to install and upgrade. There’s an “Open Circulation” edition
    available for free download, but if you want all the bells and whistles (and a
    manual) you’ll need to spend close to $100 for the full-featured “Deluxe” edition.
    Restrictive license limits sharing.


    (www.xandros.com)'
  merge: -1
  img_proc: true
- pgno: 261
  md: '# PCLinuxOS


    A rather new Live CD distribution initially based on Mandrake Linux but rapidly
    coming into its own. Has attractive default and utility screens.


    (www.pclinuxonline.com/pcloe)


    # LinSpire


    Features simple basic installation and easy installation of additional software.
    Most LinSpire software is the same software you find in other Linux distributions
    with changed names, and it is not obvious how to switch from LinSpire’s Click-N-Run
    subscription software service to the free Debian servers or other free software
    sources if you don’t want to keep paying LinSpire for updates. LinSpire has great
    packaging and looks. No free downloads regularly available; restrictive license
    prohibits sharing outside of immediate family.


    (www.linSpire.com)'
  merge: -1
  img_proc: true
- pgno: 262
  md: '# Books that Can Help

    You Become More

    Proficient with Linux


    **P** *oint & Click Linux!* is a starting place. If you want to learn more about

    Linux, either for your own use or in a professional capacity as a program-

    mer or systems administrator, these five titles can help:


    ![](img/01efe5dd076565746bf3678068ba155c_262_0.png)'
  merge: -1
  img_proc: true
- pgno: 263
  md: '# Point & Click Linux!


    Moving to Linux: Kiss the Blue Screen of Death Goodbye

    by Marcel Gagne, ISBN 0321159985

    If Point & Click Linux! is your first Linux book, *Moving to Linux* might be a
    good second one. It gives you installation instructions for distributions besides
    MEPIs, plus it''ll walk you through a slightly group of applications and give
    you a larger dose of command line instructions.


    Running Linux, 4th Edition

    by Matt Welsh, et al, ISBN 0596002726

    This book is “the” classic guide to the Linux command line; you''ll find it on
    many professional sysadmins'' bookshelves. You may not need this book if you''re
    only running a single home or home office computer, but if you have professional
    Linux aspirations or want to start building a Linux network for your own home
    or office, you''ll want to have a copy around.


    A Practical Guide to Red Hat Linux: Fedora Core and Red Hat Enterprise Linux

    By Mark G. Sobell, 0131470248

    A comprehensive book aimed at new Linux power users and system and network administrators.
    Includes the full Fedora Core 2 release on 4 CDs. Good study material if you plan
    to use Linux professionally, especially because Red Hat is the most popular Linux
    distribution in corporate server rooms.


    The Linux Cookbook

    By Michael Stutz, ISBN 1886411484

    Shows you how to do many things with Linux through the command line, but instead
    of just indexing single commands it walks you through entire processes in a recipe-like
    fashion. This is a fine way to not only become command line-literate but to get
    in the habit of actually using the command line to do things.


    Beginning Linux Programming, 3rd Edition

    By Neil Matthewes and Richard Stones, ISBN 0764544977

    This book assumes you have at least some C or C++ experience and have installed
    Linux at least a time or two. Buy it if you''re ready to start programming in
    or for Linux. It''s one of the best basic guides for programmers who want to start
    working with Linux.'
  merge: -1
  img_proc: true
