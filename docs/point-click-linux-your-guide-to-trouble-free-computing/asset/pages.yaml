    night, instead.


    So the bad news you need to be aware of when using the locate command is that
    files created since the last time updatedb was run will not appear in its search
    results. The good news is that it runs very quickly, much faster than find does.


    The basic format for the locate command is


    ```

    `locate pattern`

    ```


    Like the grep command, locate will let you specify to case-insensitivity when
    matching the pattern. That can be very helpful at times.


