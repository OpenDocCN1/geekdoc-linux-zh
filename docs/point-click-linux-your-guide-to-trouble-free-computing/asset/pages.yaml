    # Customizing Programs with Themes and Skins


    Because many Linux aficionados delight in customizing their computers’ appearances,
    it’s natural that many popular programs for Linux can be “themed” to meet individual
    tastes. Mozilla is a prime example. From the top of a Mozilla window, click “Edit,”
    choose “Preferences,” click “Appearance” in the new window that brings up, and
    you have a number of choices. “Themes” gives you a chance to give your browser
    an entirely different look from its original factory-drab appearance; in fact,
    most of the Mozilla screenshots in this book are of the “Orbit” theme, which is
    one of the most popular ones around.


    You can also change Mozilla colors, fonts (typefaces) and nearly everything else.
    And themes? You can change them like mad. There’s a little “Get New Themes” link
    on the “Themes” page that takes you to a whole list of Internet sources (assuming
    you’re connected at the time) for themes of all kinds, in colors ranging


