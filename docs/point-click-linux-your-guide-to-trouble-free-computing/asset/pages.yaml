- pgno: 120
  md: 'As long as we see those handles, we are working only on the material inside
    them. In this case, we are going to make the photo smaller so it will take up
    less space on a printed page.


    There are several ways we can do this. The most obvious is to lay our cursor on
    one of the corner handles and move it toward the opposite corner while holding
    our left mouse button. The only problem with this method is that it can distort
    the photo if we aren''t careful, so we might end up with something like this:


    ![](img/01efe5dd076565746bf3678068ba155c_120_0.png)


    This can be a fun "effect" if we do it on purpose, but this time we''re going
    to either use the "Ctrl+Z" command or click "Edit" from the top Menu and pick
    "Undo" to take us back to where we were. Now we''ll resize the photo correctly,
    by right-clicking on it, choosing "Position and Size" (the second menu choice
    from the top), and working with the dialog window that gives us:


    ![](img/01efe5dd076565746bf3678068ba155c_120_1.png)


    We can do a number of things with this dialog window, but right now we''re just
    going to make our photo smaller. We can guess what size we want, in inches, and
    if we check the "Keep Ratio" button the program will automatically keep the photo
    the right shape if we change either its horizontal or vertical dimension.'
