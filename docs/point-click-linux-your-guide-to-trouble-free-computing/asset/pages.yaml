- pgno: 31
  md: '# Look Ma, No Drivers!


    With Windows and other operating systems, you often need to install a specific
    software “driver” for network cards from CDs supplied by the cards’ manufacturers.
    MEPIS Linux has drivers for almost all the popular network cards, including wireless
    cards, built in. It also has built-in drivers for most popular digital cameras,
    scanners, printers, and other devices you’re likely to attach to your computer.
    (If you want to add hardware that was made after this book was written, you may
    need to get an updated version of MEPIS that includes drivers for it, but that’s
    not hard. We’ll show you how to do that in Chapter 24, “Downloading and Installing
    Software.”)


    As a rule, MEPIS will run any common wire-connected network card without you doing
    anything. Wireless may or may not start on its own, but it’s easy to make sure
    “wlan0” is running and start it if it’s not. Click on the “Wireless” tab, click
    the “Use auto-config” choice and click “Apply” if starting “wlan0” didn’t make
    your wireless connection come to life.


    ![](img/01efe5dd076565746bf3678068ba155c_31_0.png)


    If you’re using a wireless network with encryption and other non-default settings,
    you’ll want to click “Use Manual Configuration” and set MEPIS to conform to your
    network’s setup, which you can determine by accessing your wireless hub’s setup
    utility and instructions.


    ![](img/01efe5dd076565746bf3678068ba155c_31_1.png)'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'Even if all the setup instructions that came with your wireless hub were written
    for Windows, the numbers and settings are identical for all operating systems.
    Type them in the appropriate blanks, click “Apply.” and they should work without
    any problem.


    # Dialup and PPoE Connections


    Dialup modem users should turn to Chapter 5, “KPPP—Easy Modem Dialer Application.”
    We put it there because KPPP is only one of several dialup connection programs
    available for Linux. While KPPP is our favorite, you may later decide to download
    and use one of the others.


    DSL users whose providers still use PPoE (Point-to-Point Protocol over Ethernet)
    directly may need to use the KDSL utility to connect, but should first make sure
    their providers don’t have newer router-style modems available that will eliminate
    the need for a login and pass-word. Virtually all major U.S. DSL providers have
    switched to router-style modems, which are detected and set up automatically by
    MEPIS Linux. (These DSL modems are far more efficient than the old PPoE ones were,
    anyway, so you should make this switch no matter what operating system you use.)


    ![](img/01efe5dd076565746bf3678068ba155c_32_0.png)


