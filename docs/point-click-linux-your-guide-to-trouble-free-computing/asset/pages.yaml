- pgno: 222
  md: 'from subdued to garish. There are hundreds of Mozilla themes available. There
    are themes—or as they are sometimes called, “skins”—for OpenOffice.org, the XMMS
    media player, and most other popular Linux programs. Type the name of a favorite
    program and “skins” or “themes” into Google or another search engine, and you
    will usually find not only themes for it but also instructions on how to download
    and activate those themes, and often you’ll find instructions on how to create
    your own themes from scratch.


    There are people who spend endless hours turning their Linux desktops into works
    of art. Others are satisfied with the default appearance. Most of us are in between
    these two extremes: We want things to look nice, so we spend a few minutes now
    and then changing things around, but don’t make a fetish of it. We’re generally
    more function-oriented than art-oriented. So we spend at least some of our time
    discussing more practical matters than the search for the perfect desktop font.


    # ## Network Security and Networking


    Every open port on a network connected computer gives bad hackers a potential
    point of entry. The port that allows VPN, while not con-sidered a high security
    risk, is not open in SimplyMEPIS by default. In fact, the only ports that are
    open in your basic installation are the ones you need to send and receive email,
    view Web sites, download and upload files via ftp and several pop-ular multimedia
    protocols, and those needed to use instant messaging services. You even need to
    open ports to use some popular file-sharing services. You can do this through
    the Guarddog control utility found in your “System” menu under the “Security”
    heading.


    *SimplyMEPIS* includes a firewall that is activated automatically when you start
    it for the first time. The server software that is usually part of a Linux installation
    has intentionally been left out of *SimplyMEPIS* as a security measure, and your
    Guarddog firewall keeps the “ports” used to access those servers closed up tightly
    unless you choose to open them.


    ![](img/01efe5dd076565746bf3678068ba155c_222_0.png)'
  merge: -1
  img_proc: true
- pgno: 223
  md: '# Point & Click Linux!


    If you are not familiar with firewalls—or don’t know why you need one—this is
    a good time to press that “Help?” button. The Guarddog Handbook is one of the
    most complete pieces of documentation we’ve ever seen as part of an open source
    program. It’s not only a guide to how Guarddog works, but a fine introduction
    to networking and network security in general. And, unlike many security tomes,
    it doesn’t start out assuming you already know nearly everything, but leads you
    through networking and security procedures from the very beginning and gradually
    shows you more complex concepts as it goes along.


    But you don’t really need to read all this unless you want to (not that it would
    hurt) because Guarddog does a fine job of keeping your computer safe without doing
    anything at all to it. In fact, what you are most likely to do with Guarddog in
    a typical desktop situation is open ports, which decreases your security level
    slightly, although not enough that you should lose sleep over it.


    ![](img/01efe5dd076565746bf3678068ba155c_223_0.png)


    The “Protocols” window is where you do your port opening. You reach it by clicking
    the “Protocols” tab in the main Guarddog window. Note that none of these protocols
    for popular online games are currently enabled. This means that if you try to
    play these games, they will not work for you until you click that “open” and have
    a checkmark showing next to them (and not an “x”) because that means your computer
    specifically rejects that protocol) and click “Apply” at the bottom of the window.
    The same goes for other protocols. If you can’t make a network printer work from
    your MEPIS computer, you can’t connect to a favorite file-sharing service or you
    have trouble making a VNC connection, the first thing to check is that you have
    the appropriate port open in Guarddog.'
