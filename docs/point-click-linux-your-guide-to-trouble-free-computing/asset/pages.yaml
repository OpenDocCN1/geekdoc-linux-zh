  md: '# **Point & Click Linux!**


    The one other choice you might want to make when you''re setting up instant messaging
    accounts in Kopete is to click the "Connection" tab you see peeking over the top
    of "Edit Account" screen when you click "Modify" after highlighting an account
    you''ve already set up. There''s only one choice here: Do you want to log onto
    this service automatically every time you start Kopete? If that''s what you want,
    click the "Connect automatically at startup" box. If not—or if you decide you
    no longer want automatic startup that you originally set that way, click on that
    little box to uncheck it.


    ![](img/01efe5dd076565746bf3678068ba155c_147_0.png)


    # **Introducing IRC**


    Fewer than one million of all the people in the world with Internet connections
    use IRC, yet it is one of the most efficient ways there is to organize group or
    individual chats. IRC is in many ways like an underground "elite" section of the
    Internet. Most IRC networks are run by volunteers, and while some networks have
    chat channels for every topic in the world—literally everything from cross-cultural
    dating to discussions about TV "reality" shows—many of us use it primarily as
    a rapid way to give and get technical help. This book''s author tends to "hang
    out" on irc.oftc.net and irc.slash-net.org. Another popular network for Linux
    people is irc.freenode.net, which is where the official #mepis help channel is
    located.


    If you''ve never used IRC, this is as good a time as any to try it out.'
  merge: -1
