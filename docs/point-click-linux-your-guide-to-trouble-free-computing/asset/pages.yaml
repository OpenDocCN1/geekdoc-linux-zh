  md: '# Point & Click Linux!


    # How Your System''s "File Tree" Works


    Files are stored in an "inverted tree" structure, with the roots at the top and
    the branches growing downward. In fact, the master directory for your Linux system
    is called "root" and is represented by / (that''s the "forward slash" under the
    question mark on your keyboard.) Moving down, you see a list of main folders,
    called "directories." You can see what''s in any of them any time you like by
    clicking the little "+" and opening up that branch of the "tree," but the only
    directory we need to think about 99% of the time is /home, because that''s where
    our personal files live.


    ![](img/01efe5dd076565746bf3678068ba155c_43_0.png)


    To go directly to your Home directory from your desktop, click the "Home" icon—the
    one that looks like a little house—at the bottom of your screen.


    ![](img/01efe5dd076565746bf3678068ba155c_43_1.png)


    You see folders there. Click on one of the folders and you move out onto one of
    the branches of the directory tree. We already created one folder of our own,
    and we can create all we want, folders within folders within folders until our
    minds spin. However, it''s usually easier to keep everything simple so we can
    remember where we filed things and access them with the fewest possible number
    of clicks through folders and sub-folders.'
