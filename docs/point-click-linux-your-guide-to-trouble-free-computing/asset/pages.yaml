- pgno: 56
  md: '# ## Names and Passwords


    The next human intervention required for your MEPIS installation is saying “Yes”
    when you’re asked if it’s okay to install the GRUB (GRAnd Unified Bootloader)
    utility in the MBR (Master Boot Record). Go ahead; if you’re an advanced Linux
    user you can customize your MBR later. The rest of us will be satisfied with plain-jane
    GRUB. It allows us to boot Linux in more ways than most of us ever need and gives
    us the ability to boot multiple operating systems, like Windows and Linux next
    to each other—or even two or three different Linux installations, if we like.


    Our next task is deciding on a user name, a root password, and—if your computer
    is part of local network—typing in the network’s name and giving your computer
    a name that will identify it to other computers on the network.


    ![](img/01efe5dd076565746bf3678068ba155c_56_0.png)


    The user name can be anything you like. You can add more users later. Both the
    user and root passwords ideally should be a mix of numbers and letters at least
    six characters long, rather a relatives name or something else that can be figured
    out by a lucky guess.'
  merge: -1
  img_proc: true
- pgno: 57
  md: '# The root password is important!


    The root password is one of the most critical pieces of information you need to
    put in while installing your new MEPIS Linux system. If you know your system''s
    root password you can change user names and passwords later, but if you don''t
    remember your root password you can''t change anything important without going
    to the trouble of installing everything all over again.


    The root password is your main line of defense against malicious hackers. You
    want to make it very hard, ideally impossible, to guess, hopefully by using a
    long string of randomly mixed letters and numbers along the lines of 32x49xrtgw05567.
    The problem with this kind of hard-to-crack password is that unless you have an
    excellent memory, you are going to forget it, so you''ll need to write it down
    somewhere. Then you need to make sure the paper you wrote it on is hidden from
    prying eyes.


    So maybe you choose a less exotic password. At least make sure it''s not a real
    word. And throwing a number or two in the middle can''t hurt. That ought to be
    secure enough for non-government work. Just make sure you don''t use this password
    on a Web site or someplace else it might be revealed to the rest of the world
    by mistake.


    You only need to use your root password when you install or delete software, add
    or delete users, or otherwise alter your computer in some way. You won''t use
    it every day. If you go the "write it down" route, it''s better than forgetting
    it—assuming that you don''t forget where you hid the paper you wrote it on, as
    this book''s author did with a root password several years ago...


    There are only a few more MEPIS installation screens. The first one is for Samba
    networking with Windows computers on a network. This can be set up later, and
    more details will be covered in this book''s "Beyond the Basics" section. For
    now, just click "Next." The final screen is for security and dialup. Those who
    use dialup Internet connections will find full instructions on how to set them
    up in Chapter 5, "KPPP—Easy Modem Dialer Application." And on the security front,
    MEPIS automatically sets up a Guarddog firewall utility, and you should have a
    firewall on any computer you attach to the Internet, no matter what operating
    system it runs, so just click "Next" here instead of changing anything.


    ![](img/01efe5dd076565746bf3678068ba155c_57_0.png)'
  merge: -1
  img_proc: true
- pgno: 58
  md: 'Your installation is finished. Time to reboot.


    That''s it. You''re done. Your next move is to boot your new MEPIS Linux installation
    for the first time. Depending on your hardware, the LiveCD may or may not eject
    automatically. If not, you''ll need to eject it manually while your computer is
    doing its startup routine. You may or may not need to change your BIOS settings
    if you changed them to get your computer to boot from the CD drive. (This depends
    on your computer''s make and model.) In any case, you''re ready to run Linux from
    your hard drive for the first time.


    Your first startup is going to take a little extra time because your computer
    will now automatically run a utility program that checks your hard drive for flaws
    or bad spots and automatically moves critical program elements away from bad spots
    to good ones. This takes a minute or two, depending on your computer and hard
    drive''s running speed, but as soon as this is done you''ll see a login screen
    that gives you a choice between logging in as root or as the user you created.
    Choose to log in as the user, not as root, for security reasons.


    ![](img/01efe5dd076565746bf3678068ba155c_58_0.png)


    You may want to briefly test your root login to make sure the password works correctly,
    but it''s wise to disconnect your computer from the Internet while you do this—and
    go back to your user login before you reconnect.


    But that''s it. You have MEPIS Linux running. It''s time to start using the applications
    software that was automatically installed along with it.'
  merge: -1
