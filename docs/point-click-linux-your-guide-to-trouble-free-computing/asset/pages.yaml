  md: '# ## Tux Racer


    Tux the Penguin slides down a slalom-type course as fast as he can, gobbling herring
    as he goes. Sometimes he screws up and goes off course. He uses his flippers to
    speed up and digs his feet into the snow to slow down.


    The faster Tux goes, and the more herring he grabs, the higher his score. One
    or two can play.


    ![](img/01efe5dd076565746bf3678068ba155c_180_0.png)


    > **Note:** This game will work properly *only* if you have a 3-D Video card and
    MEPIS Linux has detected it correctly. If you start Tux Racer and it looks awful,
    you do not have the correct video setup. For advice, check www.mepis .org/Forum.


    # ## TuxKart


    It’s a go-kart racing game, once again starring the Linux mascot, Tux the Penguin.
    The graphics aren’t as smooth as Tuxracer’s, but there are six racetracks, only
    one of which resembles a traditional racetrack. It’s a simple “go fast” game,
    but it has enough wrinkles and tricks that you might want to glance at its home
    site, tuxkart . source- forge .net, at some point.


    ![](img/01efe5dd076565746bf3678068ba155c_180_1.png)'
