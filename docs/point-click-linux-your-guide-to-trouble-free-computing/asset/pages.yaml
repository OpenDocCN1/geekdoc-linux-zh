  md: '# Chapter 28


    # Joining the Linux Community


    Unlike Windows, Mac OS, and most other commercial operating systems, Linux is
    not owned by a single company. It was developed—and is constantly being improved—by
    a worldwide group of programmers who are more interested in technical elegance
    than marketing. These programmers are usually not hobbyists, but academics, professional
    software developers, and others who use Linux on their own computers and, increasingly,
    in their employers'' information technology (IT) departments. Linux is one of
