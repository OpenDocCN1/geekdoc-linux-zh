  md: '# Chapter 6


    # Mozilla: Your Key to the Internet


    Even though KDE has a built-in Web browser and email client that many Linux users
    love, SimplyMEPIS creator Warren Woodford and this book''s author decided that
    Mozilla is both better-known and easier to use for people trying Linux for the
    first time. Therefore, it''s the Internet tool we''ll talk about in the Point
    & Click Linux! book and video. You''ll probably want to experiment with KDE''s
    KMail and Konqueror browser at some point. You may also want to try the new, Mozilla-
    designed Firefox Web browser and Thunderbird email client or, for email, calendar
    and general “organizing” functions, the highly regarded Evolution system.'
  merge: -1
  img_proc: true
- pgno: 71
  md: '# Point & Click Linux!


    KMail and Konqueror are included on your SimplyMEPIS CD. There wasn''t room to
    include Firefox, Thunderbird, and Evolution, but they''re available for separate
    (free) download from the MEPIS servers and other Internet locations.


    But right now, let''s concentrate on Mozilla.


    Obviously, at its heart, Mozilla is a Web browser. It was originally an offshoot
    of Netscape, but is now far more advanced than either Netscape or Microsoft Internet
    Explorer. Indeed, many people who use Mozilla on Linux and are then forced to
    use Windows at work (or wherever) find that Mozilla is so much better than MSIE
    (as Explorer is called by many people in the internet business) that they download
    and use the Windows version of Mozilla instead of going back to MSIE.


    Mozilla''s email client is another "star" compared to the primary competition.
    To begin with, it is immune to the popular email viruses and worms currently floating
    around the Internet. If you''ve been using Microsoft''s Outlook or Outlook Express
    to read your email and worrying about viruses (as you should), the second you
    switch to Mozilla (or KMail or Evolution) that weight is lifted from you.


    ![](img/01efe5dd076565746bf3678068ba155c_71_0.png)


    ![](img/01efe5dd076565746bf3678068ba155c_71_1.png)'
  merge: -1
  img_proc: true
- pgno: 72
  md: 'Someday, perhaps someone will write an email worm or virus that can spread
    to Linux computers through Mozilla, but no one has succeeded at it yet. You''ll
    also enjoy Mozilla''s built-in spam filter, which works at least as well as most
    of the ones for Outlook and Outlook Express that sell for as much as $50.


    Mozilla also has an address book you can use as a contact manager and a *Composer*
    utility that you can use to make Web pages even if you don''t know HTML.


    In the following pages we''ll show you how to use all of these functions, along
    with a few hints on how to make Mozilla look just the way you like it with custom
    themes and color schemes.


    That should be more than enough to get you started.


    More Mozilla Information:


    www.mozillazine.org


    forums.mozillanews.org


    www.mozilla.org'
