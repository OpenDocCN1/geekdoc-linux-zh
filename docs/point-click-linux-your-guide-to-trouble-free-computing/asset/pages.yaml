- pgno: 153
  md: "# Point & Click Linux!\n\n> **Read this chapter only if you use FTP**\n> \n\
    > This chapter is intended for experienced FTP users. If you don’t use FTP, feel\
    \ free to skip it. If you want to learn about FTP, your ISP probably has an FTP\
    \ tutorial online. If not, the one at `www.ftppplanet.com/Enterprises/basics.htm`\
    \ is fairly good, and if you key the words “FTP tutorial” into any search engine\
    \ you will find many more.\n\n# FTP Has Gotten Easier to Use Over the Last Decade\n\
    \nFor many years, basic FTP programs were 100% command line-based. You typed in\
    \ long strings of text that were only partially in human-readable language to\
    \ accomplish your goals. People who used command line FTP programs tended to mutter\
    \ things like “chmod 644 permissions changed user read-only” in their sleep, because\
    \ if they didn’t remember all the commands they couldn’t do their jobs. Luckily,\
    \ command-line FTP is now strictly the province of hard-core Unix and Linux users,\
    \ and the rest of us can get exactly the same results without using a command\
    \ line or memorizing all those lines of computerese.\n\ngFTP follows the same\
    \ basic “Local computer files on the left, remote computer files on the right”\
    \ format as almost every other GUI FTP program. Here’s an example of the file\
    \ structure for the MBRPIS. `org` private “beta test” download server:\n\n![](img/01efe5dd076565746bf3678068ba155c_153_0.png)\n\
    \nWe’ve made that window wider by grabbing the line to its left (just to the right\
    \ of the “Arrow” buttons) with our mouse and pulling it left until we could see\
    \ all the information we wanted. All gFTP windows can be resized this easily.\n\
    \n![](img/01efe5dd076565746bf3678068ba155c_153_1.png)"
  merge: -1
  img_proc: true
- pgno: 154
  md: '# 18: gFTP—An Easy, Powerful FTP Program


    To download (or upload) a file, highlight it with your left mouse button, make
    sure you''re in the correct directory on the computer to which you want to transfer
    it, and press the appropriate arrow button. Then, if it''s a big file that''s
    going to take a long time to transfer, go do something else. gFTP will work fine
    without you watching. Your gFTP screen will look something like this while the
    file transfer is in progress:


    ![](img/01efe5dd076565746bf3678068ba155c_154_0.png)


    # Working with a Remote Server


    Log in exactly the same way as in any other FTP client. You can see the form spaces
    for server name, user- name, and password in the screenshots. Use them appropriately.
    You can also add the FTP site you''re on as a bookmark so you don''t need to enter
    that information again. Check the "Remember Password" box and even your pass-
    word will be remembered. Quite a time-saver!


    ![](img/01efe5dd076565746bf3678068ba155c_154_1.png)


    You can either type in remote server directories as filenames in the space above
    the "file listing" window on the right half of your gFTP screen or navigate the
    remote server''s file system by clicking on directories, folders, and files. After
    you found the file or directory you want to transfer or modify, highlight it by
    clicking on it. To modify that file''s permis- sions and characteristics (assuming
    you have permission to do this on that remote server, right-click on it and choose
    from the list of commands that will pop up. All your old favorites are there.'
  merge: -1
  img_proc: true
- pgno: 155
  md: '# Point & Click Linux!


    Because Linux is similar to Unix, and all FTP file commands are Unix-based, you
    can make all the same changes on your local files with gFTP, too. This is usually
    pointless because you have an efficient, built-in file browser that makes file
    management on your computer easier than doing it through an FTP program. However,
    it’s a cute little trick you can use if, for instance, you spot a typo in a file
    name while working with FTP and want to change it before you forget.


    ![](img/01efe5dd076565746bf3678068ba155c_155_0.png)


    # The gFTP Toolbar


    The icon button on the left is what you click to make a connection after you have
    the correct information (server name, user name, and so on) typed in. Over to
    the right, the little button that says “FTP” allows you to switch protocols; you
    can use gFTP for HTTP transfers and—more useful—for secure transfers with SSH
    (Secure Shell protocol).


    The rest of the toolbar functions are self-explanatory. Click on the text menu
    items at the top of the gFTP window and you’ll instantly see what functions are
    available though each one. Only the “Help” button is disappointing; there is no
    built-in manual for gFTP. On the other hand, you could argue that there is no
    need for one since gFTP is so simple, obvious, and stable.


    gFTP help and information is available at www.gftp.org.'
  merge: -1
