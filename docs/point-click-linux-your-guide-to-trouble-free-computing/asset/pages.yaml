- pgno: 229
  md: 'With modern versions of Linux—like MEPIs—you very seldom if ever need to leave
    the ease and comfort of the GUI for your day-in, day-out computing chores. But
    if you ever need to, or if you just want to explore "under the hood" a bit, this
    chapter is for you. It provides a guide to twenty of the most useful commands
    available at the CLI. You can learn more about each of these commands simply by
    typing "man command-name" or "info command-name" in a console window.


    # # alias


    The alias command is very handy. It allows you to rename (sometimes long and intricate)
    commands to something a little easier to remember and type. How cool is that?
    You get to name commands whatever you like.


    If it''s hard for you to remember all the parameters to use to get a directory
    listing in a directory that shows all files and their permissions, ownership,
    and size, just use alias to call it, um, something familiar. How about "dir"?


    In MEPIs, aliases are kept in a file called .bashrc, which lives in your home
    directory. Use KEdit to open .bashrc, and then enter the following line at the
    bottom:


    ```

    ```bash

    alias fulldir=''ls -al'';

    ```

    ```


    Then save the file.'
