- pgno: 78
  md: '# 7: Setting Up and Using Mozilla Email


    Note: Anything you type in now is easy to change later. Don''t worry about making
    a mistake. The world won''t come to an end if you do.


    Hah! We''re done, at least with this incoming mail account. Notice that this is
    our first opportunity to correct any mistakes we made by using the “Back” button
    to go back to our mistakes and redo them. If we have no mistakes (or after we
    correct any we spotted), we have only one last choice to make: Do we want to download
    messages now? This is up to you. Make that choice by checking or unchecking the
    little box, then click “Finish” and move on.


    ![](img/01efe5dd076565746bf3678068ba155c_78_0.png)


    We''re ready to download, read, and reply to our email, assuming that we set everything
    up properly. We''ll need to type in our password the first time we access our
    email, but we only need to do it once on this computer; Mozilla can keep it for
    us and send it automatically.


    ![](img/01efe5dd076565746bf3678068ba155c_78_1.png)


    This is a good time to send a “test” email to yourself to make sure that everything
    works. On a typical POP email server, it almost certainly will. If it doesn''t
    work right on an IMAP server, your security settings probably need to be changed.
    Your ISP or company systems administrator can help you get them right.'
