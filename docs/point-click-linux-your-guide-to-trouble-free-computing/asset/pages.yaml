- pgno: 127
  md: '# Point & Click Linux*


    The other way to correct that bad spelling, and an easy way to change information
    in a spreadsheet "cell" (which is the formal name for each of the little rectangles
    in your spreadsheet window), is to use the bar and form above the main window
    that appears only when you''re running Calc.


    ![](img/01efe5dd076565746bf3678068ba155c_127_0.png)


    Notice that above this bar you see your usual text options, the same as in OoO
    Writer. They work the same way in Calc. But the new bar is the one we''re looking
    at right now. Or you can use the little format at the left to choose a cell by
    typing its location there, such as "L6," or you can choose a cell by just clicking
    on it in the main window. Whatever is in that cell will now appear in the large
    form space on the right side of this new toolbar, and you can edit it like any
    other piece of text—or enter brand-new material for that cell if there isn''t
    already something in it. When you click "Enter," whatever you have typed is entered
    in your chosen cell.


    # Hey! We Just Made a Database!


    So far, all we''ve done is enter data, essentially creating a "flat database."
    We can keep on with this, entering data about 5,000 or 50,000 customers and their
    purchasing histories, and if desired we can add additional cells with all kinds
    of other information about them, such as their addresses and phone numbers, plus
    names of our primary contacts within each company. If we have purchase order numbers
    we can add cells for those. We can enter any information we want or even create
    cells for information we don''t need to enter now but might need to in the future.


    We can then call up records in many ways by clicking on the appropriate cells.
    Do we remember that there''s a guy named "Raji" we need to call, but don''t remember
    his full name or what company he works for? We can go to "Contacts" by calling
    up just the column that has contact information for our customers and scanning
    it manually or sorting through the entries in that column by "sorting" the names
    in it by alphabetical order (or any other way we like) until we find our friend
    Raji. After we''ve found him it''s simple to note his company and his phone number
    and call him. With a little practice (and some digging through the OoO "Help"
    pages) we can even look for things like partial phone numbers in badly scrawled
    telephone messages and find out who wants us to call them back.


    At home, we could use this same tactic to sort through a huge recipe file looking
    for "brown rice" in an ingredient list if we have a sudden taste for a meal made
    with brown rice and want to see which recipes we have that use brown rice.'
