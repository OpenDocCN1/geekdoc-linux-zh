- pgno: 252
  md: 'developers. Sometimes a bit of appreciation is as valuable as money—not that
    money or equipment donations are a bad thing to offer, although you may be surprised
    to learn that many (but far from all) free software authors will turn down donation
    offers because they are either writing free software as part of their jobs or
