    ![](img/01efe5dd076565746bf3678068ba155c_55_1.png)


    The little bar will crawl across the screen as MEPIS installs. This is going to
    take between five and 30 minutes, depending on your PC’s speed. Now is a great
    time to get up, stretch, grab a cup of coffee or a glass of soda, juice or water.'
