    menu. **KMail** is an email program many Linux users prefer to Mozilla, and many
    use **Konqueror** not only for file management but also as their Web browser.
    **Pani** is a well-regarded newsgroup reader for those who still enjoy Usenet.
    **Skype** is a new Internet telephony service; it''s free'
