- pgno: 245
  md: '# # How GNU/Linux Got Started


    Your new operating system''s real name is GNU/Linux.


    “Linux” is its nickname, used in everyday conversation the same way the late U.S.
    president Dwight David Eisenhower was called “Ike” in newspaper headlines and
    almost everywhere else. The GNU (pronounced “guh-noo”) part of GNU/Linux is the
    foundation on which the rest is built, a software system and development philosophy
    that was conceived in the early 1980s by Richard M. Stallman, an employee of the
    M.I.T. Artificial Intelligence Lab. At the time, Unix was the dominant operating
    system on the lab''s larger computers, but each computer ran its own proprietary
    version of Unix, supplied by its manufacturer, so it was nearly impossible to
    use a printer or other device supplied by one manufacturer with a computer supplied
    by another. And because each of these Unix variants was owned by the company that
    sold it or included it with its hardware, Stallman couldn’t write “bridge” programs
    to allow different devices to work with each other unless he signed non-disclosure
    agreements with all the different computer and device manufacturers involved.
    That would have kept him from freely sharing any of their secrets—or his own software
    that made use of their proprietary computer code—with other programmers and computer
    administrators who might also need it. Perhaps Stallman could have signed some
    of those non-disclosure agreements and contracted with computer vendors to write
    proprietary software for them, but he decided, instead, that it would be better
    to develop an operating system and software that could be used, modified, and
    shared by anyone, anywhere, without the licensing frustrations that typically
    accompanied proprietary software.


    ![](img/01efe5dd076565746bf3678068ba155c_245_0.png)


    Early on, Stallman identified and started promoting four basic principles of software
    freedom:


    +   1. You have the freedom to run the program, for any purpose.


    +   2. You have the freedom to modify the program to suit your needs. (To make
    this freedom effective in practice, you must have access to the source code, because
    making changes in a program without having the source code is exceedingly difficult.)


    +   3. You have the freedom to redistribute copies, either gratis or for a fee.


    +   4. You have the freedom to distribute modified versions of the program, so
    that the community can benefit from your improvements.'
  merge: -1
  img_proc: true
- pgno: 246
  md: 'Note that the word “free” in “Free Software” is about freedom, not price. Stallman
    sold copies of GNU Emacs (a programmers’ text and code editor), one of the first
    programs distributed under a GNU license, for $150. Of course, because buyers
    were free to share their copies with friends and coworkers, sales revenue was
    not as high as it might have been if Stallman had required each user to purchase
    a copy. But in return for less income per copy, Stallman’s program not only was
    shared so heavily both physically (on tapes, floppy disks, and other media) but
    over the then-thin Internet that tens of thousands of programmers who might not
    have had money to buy their own copies got in the habit of using it, and many
    of those programmers took advantage of their freedom to modify the program, so
    GNU Emacs was improved and had features added at a much greater rate than Stallman
    could have managed on his own.


    Note that because all Emacss users shared the freedom to modify and redistribute
    its underlying code, all Emacss users got all the improvements made by any one
    user. Stallman ended up with a far better text and code editor for his own use
    than he would have if he’d sold Emacs as proprietary software.


    In 1985, Stallman and others incorporated the Free Software Foundation (FSF) as
    a tax-exempt charity. The FSF soon released a number of essential software tools,
    including the widely-used GCC computer code compiler and the BASH “shell” (for
    command line utilities) under their GNU “copyleft” license that incorporated the
    four freedoms mentioned previously, plus clauses that prevented anyone from using
    “copyleft” code in proprietary software so that their modifications to the original
    software could not be freely shared.


    Many proprietary software companies denounced this clause in what soon became
    known as the “General Public License” (GPL) for software, because they felt they
    should have the right to appropriate others’ work, add their own to it, and profit
    from the result instead of sharing their improvements (or profits) with the software’s
    original creators.


    Proprietary software vendors make their money by keeping their software’s inner
    workings secret, not by sharing it, and get bent out of shape when others don’t
    want to follow the same pattern. In fact, Stallman’s rejection of the proprietary
    Unix software distribution pattern has a lot to do with the name GNU, which is
    an acronym for “Gnu’s Not Unix.” This is not just a statement of programming philosophy,
    but a programmer’s joke: recursive statements that lead to endless circular discussions
    can bring improperly programmed computers to a halt.'
  merge: -1
  img_proc: true
- pgno: 247
  md: '# Point & Click Linux!


    Imagine a computer engaged in this dialogue:


    “What is GNU?”


    “GNU’s Not Unix.”


    “What is GNU?”


    “GNU’s Not Unix.”


    “What is GNU?”


    “GNU’s Not Unix.”


    “What is GNU?”


    “GNU’s Not Unix.”


    This could go on forever—or at least until a human comes along and pulls the plug.


    As comedian Jeff Foxworthy might say, “If you think this joke is funny… you just
    might be a programmer.” (And if you think it’s funny and you’re not a programmer,
    perhaps you should consider becoming one.)


    # Enter Linus Torvalds


    In 1991, a computer science student in Finland wrote a simple program so he could
    run his home computer the way a Unix-like operating system called Minix would.
    It was a rough little “kernel” program that only performed a few basic functions;
    by no means a complete operating system. But what few things this little program
    did, it did well, and Torvalds put his computer code on the Internet so others
    could use and perhaps improve it, along with this introductory message posted
    in the comp.os.minix Usenet Newsgroup:


    > > Hello everybody out there using minix -

    > >

    > > I’m doing a (free) operating system (just a hobby, won’t be big and professional
    like gnu) for 386(486) AT clones. This has been brewing since april, and is starting
    to get ready. I’d like any feedback on things people like/dislike in minix, as
    my OS resembles it somewhat (same physical layout of the file-system (due to practical
    reasons) among other things).


    234'
  merge: -1
  img_proc: true
- pgno: 248
  md: 'I''ve currently ported `bash`(1.08) and `gcc`(1.40), and things seem to work.
    This implies that I''ll get *something practical* within a few months, and I''d
    like to know what features most people would want. Any suggestions are welcome,
    but I won''t promise I''ll implement them :-)


    Linus (torvalds@kruuna.helsinki.fi)


    PS. Yes - it''s free of any minix code, and it has a multi-threaded fs. It is
    NOT portable (uses 386 task switching etc), and it probably never will support
    anything other than AT-hard-disks, as that''s all I have :-.


    This message is commonly held up as the beginning of "Linux," a name suggested
    by Torvalds'' friend Ari Lemmke as an alternative to Torvalds'' own "Freax" name
    for his little program. Even renamed, Linux only became a usable operating system
    after others—many GNU tools—took Linus up on his invitation to submit suggestions,
    plus incorporation of many contributing modifications and suggestions, the best
    of which Torvalds incorporated into the Linux kernel. And as Linux''s popularity
    and usefulness grew, thousands of other programmers in dozens of countries started
    writing software designed specifically to run on the GNU/Linux operating system.


    # The Linux Community and You


    When you start using Linux you become part of the Linux community. You get to
    paste stickers showing Tux, the Linux penguin mascot, on your computer, and put
    little Tux dolls on top of your bookshelf. This—along with going to Linux conferences—is
    the fun part of the Linux community. And yes, even though Linux is a dead-serious
    computer operating system, there is nothing wrong with being lighthearted about
    it. Linus Torvalds called his autobiography Just for the Fun of It, and this attitude
    pervades much Linux and free software development.


    ![](img/01efe5dd076565746bf3678068ba155c_248_0.png)


    "Why not enjoy your computer work?" is the perennial rhetorical question behind
    Linux. "Sure," Linux seems to say, "You have 28 reports to turn out by the end
    of the week, but shouldn''t you be able to stop and look at a pretty desktop picture
    and play a round of Frozen Bubble now and then? Shouldn''t you move your KDE Control
    Panel from the bottom of your monitor screen to the top for no reason other than
    to keep from getting bored? Shouldn''t you have a silly penguin mascot for your
    operating system?"'
  merge: -1
  img_proc: true
- pgno: 249
  md: '# **Point & Click Linux!**


    Well, yes. You should. Your computer should be your friend, not your enemy, and
    the programmers who write the software that runs it should be interested in how
    their programs work for you, and should be happy to listen to your suggestions
    about how they can improve their work. And most of them are. As long as you approach
    them politely, and take the trouble to read their manuals and documentation and
    FAQs (Frequently Asked Questions) before you ask for help, you''ll find that most
    free software developers are happy to have your input and will often act on your
    suggestions much faster than commercial software companies that need to run every
    customer suggestion through twenty layers of customer service, legal, and marketing
    bureaucracies before they can decide if they even want to listen to you, let alone
    actually do anything.


    There are public email lists and IRC channels for almost every free Linux program,
    and hundreds of them for Linux itself. You are welcome to join any of them and
    make suggestions or—if you are a programmer—contribute modifications. If your
    modifications are useful, they will probably be adopted whether you are a professional
    programmer working at one of IBM''s Linux labs or a teenager using a public computer
    terminal in a Brazilian slum, and if they aren''t useful they will be rejected
    even if you are a computer science professor who has written a dozen books on
    programming.


    This meritocracy and willingness to listen to users among free software developers
    may scare old-fashioned proprietary software vendors, but from our perspective
    as users, it is wonderful because it give us better software faster, often for
    little or no cash outlay. Why should we care if one of the authors of our favorite
    program lives in Kenya and wears robes, while another lives in London and wears
    tailored suits? With the Internet as the primary collaboration medium for free
    software developers, it is possible to build ad-hoc coalitions of programmers
    who live on different continents and come together to create software that benefits
    everyone, everywhere.'
  merge: -1
  img_proc: true
- pgno: 250
  md: '# Profiting from free software


    The first thing to remember when someone asks, "How does anyone make a living
    writing free software?" is that there is nothing wrong with charging for free
    software; the "free" here is about freedom, not price. The second thing to remember
    is that most software is not written for mass-market distribution but is custom
    software pro- duced for corporate and government clients who have very specific
    needs and hire programmers to fill them. More and more, companies and government
    agencies that need software written to their specifications look for programmers
    who have actively contributed to free software projects because hiring managers
    can look at the actual code those programmers have written and evaluate its quality.


    Imagine yourself as a hiring manager choosing between two applicants. One has
    a resume that says, "I worked for XCorp on the YSoft project for two years." The
    other''s resume says, "I have worked on three KDE projects. Please download and
    eval- uate the code I wrote. You can find it at dot.kde.dot." You can not only
    look at your KDE developer''s actual work, but also use a search engine to find
    archived posts he or she has made to the email lists for the projects on which
    he or she has worked to get an idea of that programmer''s ability to interact
    with other team members and end users. Given a choice, hiring manager, you are
    going to choose the person who is a known quantity; someone whose work and work
    interactions are open for you to view instead of hidden behind a proprietary veil.


    If you are contracting a development task to an outside firm, the same rules apply:
    You have a choice between companies that do proprietary work and can''t show you
    what they''ve done for other clients and companies that do open source or free
    soft- ware work you can evaluate for yourself. ("Open Source" is a somewhat broader
    term than "Free Software," and can apply to software licensed under terms not
    sanctioned by the Free Software Foundation but that preserve Stallman''s original
    "four freedoms.")


    Another hiring and contracting pattern we''re seeing with growing frequency is
    com- panies and government agencies that make direct use of free or open source
    pro- grams, but need them customized to meet their specific requirements. Who
    better to hire for the customization than the people who developed those programs
    in the first place?'
  merge: -1
  img_proc: true
- pgno: 251
  md: '# Point & Click Linux!


