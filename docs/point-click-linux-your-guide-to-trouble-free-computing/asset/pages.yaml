- pgno: 89
  md: 'After exploring “Navigator Preferences,” you ought to spend a few minutes checking
    out “Privacy and Security” and “Advanced” options, especially “Scripts and Plugins”
    under “Advanced.”


    ![](img/01efe5dd076565746bf3678068ba155c_89_0.png)


    The most important button here is probably the “Move or Resize Windows” one. If
    you make sure this is *unchecked*, it will keep Web sites from taking control
    of your browser window and making it full-screen or otherwise changing it without
    your say-so. The other choices are less important; you will probably want to keep
    “Change Images” checked because many online slide shows rely on this javascript
    feature to work. The other choices won’t affect most of your Web use. You can
    leave them alone and no harm will be done.


    Other “Advanced” configuration options are nice to explore if you have time, but
    unless you’re an advanced user they really aren’t necessary.


    # Creating Bookmarks


    *Microsoft Internet Explorer (MSIE) calls them “Favorites,” but “Bookmarks” is
    the original browser term for Web addresses you save so you can return to them
    later. Your SimplyMEPIS version of Mozilla comes with a number of preset bookmarks,
    but you can easily delete any you don’t want and just as easily add your own.
    Many of the Mozilla screenshots in this book show the author’s bookmarks, which
    are decidedly not the same ones chosen by SimplyMEPIS creator Warren Woodford.
    And in the Linux “it’s all about choice” spirit, you are encouraged to create
    your own set that matches your taste.*'
