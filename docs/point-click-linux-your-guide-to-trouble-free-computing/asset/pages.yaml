- pgno: 98
  md: '# **9: Making Web Pages with Mozilla**


    To change all the text on the page, you can either highlight it all with your
    cursor or go up to the top of your window, click “Edit,” then choose “Select All”—or
    simply key in “Alt A” and get the same results.


    > **Note:** The “Alt A” key combination used in Mozilla to “Select All” is not
    the same as the “Ctrl A” key combination used in almost every other word processor
    or text editor in the world to do the same thing. This is an annoying Mozilla
    quirk we hope will be eliminated in future versions, but for now we live with
    it—and because Mozilla is wonderful in so many ways, we will allow its developers
    this bit of silliness without getting angry at them.


    Another important area you’ll want to explore is the set of choices the “Format”
    menu button at the top of the page gives you. At the top of the menu, this button
    reveals you’ll find several text choices that can liven up your page, and second
    from the bottom you’ll see “Page Colors and Background,” which allows you to change
    some colors and—if you wish—add a background image to your page.


    The final “basic” Composer tool we’ll look at is the link generator, which comes
    up when you click the “link” icon in the tool menu we looked at earlier. To use
    this one, first highlight the text or picture you want to become a link, then
    click the icon. You’ll get a little window with space to type or paste in the
    URL of the page to which you want to link.


    ![](img/01efe5dd076565746bf3678068ba155c_98_0.png)


    Make sure you include the complete link address, including the “http://” part.
    It’s usually best to paste in a link from an open browser window instead of typing
    it by hand. This eliminates the possibility of a bad link cause by a typing mistake.


    Composer can work with javascript, *Cascading Style Sheets* (CSS) and other “beyond
    HTML” Web-making tricks, but at heart it’s a simple beast designed to help simple
    people (like us) turn out simple Web pages.'
