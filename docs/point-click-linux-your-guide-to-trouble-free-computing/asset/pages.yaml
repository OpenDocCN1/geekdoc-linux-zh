  md: 'Note that we’re not just installing an operating system, but all the software
    we need to perform basic computing tasks, plus enough games to divert us when
    we get bored with work—and we’re also installing utilities like a junk email filter,
    popup blocker, and a firewall so that our computer is safe and secure when we
    connect to the Internet.


    Now comes the big decision: If we already have Windows on our computer, do we
    want to keep it there, next to our new Linux installation? It is far easier to
    do a pure Linux install than to set up our computer as a “dual boot” machine,
    but let’s grip our teeth and start by learning how to install MEPIS Linux while
    leaving Windows on our system.


    > > Note: This only works if you have at least a 10GB hard drive. If you have
    a lot of pictures, music, and other files that take up large amounts of hard drive
    space, you probably shouldn’t try to have both Windows and Linux on your hard
    drive unless it can hold 20GB or more. At this point, if you have doubts about
    your hard drive’s capacity, you may want to consider a total conversion to Linux
    instead of going the dual-boot route. (Failing that, you may consider adding a
    second hard drive to your computer or replacing your current hard drive with a
    bigger one.)


    # ## Setting Up a Dual-boot Linux/Windows System


    You can skip these next few pages if you’re ready to work with Linux full-time.
    But if you are going to keep Windows on your computer along with Linux, you must
    follow the following instructions very *carefully* or you may end up unable to
    run either operating system without reinstalling one or the other.


    The first two things you must do have to do with Windows, not Linux:


    +   1.  Back up any critical data.

    +   2.  Defragment your hard drive. (This is a Windows utility; Windows manuals
    will tell you how to do this.)


    Now it’s time to embark on the adventure of hard drive repartitioning. To do this,
    open the MEPIS Installation Center by clicking on the appropriate desktop icon.


    ![](img/01efe5dd076565746bf3678068ba155c_51_0.png)'
