    ![](img/01efe5dd076565746bf3678068ba155c_191_0.png)


    There are only four applications in the Internet menu''s “More Programs” submenu.


    ![](img/01efe5dd076565746bf3678068ba155c_191_1.png)


    **Camstream** is a utility program for streaming Webcams through a video input
    port. **KPPP Log Viewer** monitors modem use. It''s useful primarily for people
    who pay for dialup Internet connections by the minute or have limits on the number
    of hours they can use their connections each month without paying extra. **KStreamRipper**
    records streaming audio to your hard disk. **Remote Desktop Connection** is a
    VNC (Virtual Network Computer) utility that lets you use your Linux computer to
    remotely control other computers. (If you have never done this before, you''ll
    want to read this program''s “Help” file and perhaps learn a little bit about
    VNC in general before trying to set up a VNC connection between two computers.)


    ![](img/01efe5dd076565746bf3678068ba155c_191_2.png)


