- pgno: 132
  md: 'This is not a fancy chart. We could choose "Page Format" and jazz it up with
    colors and lines and even a picture as a background. (Go ahead. Poke around and
    play with these tricks. Knowing them might come in handy one day.) Or maybe we''d
    rather show it as a graphic bar chart or pie chart instead of as rows and columns
    of figures. We can do this, too.


    ![](img/01efe5dd076565746bf3678068ba155c_132_0.png)


    First we get rid of the "Page Preview" view by clicking "Close Preview" on the
    preview page. Next, we go to the top-of-window menu and select "Insert," then
    select "Chart" from our list of choices. From there, it’s basically a matter of
    following instructions and making choices. The first few times you try this, you
    will probably want to hit that magic "Help" button more than once, but after a
    while, like most people who use spreadsheets often, you’ll find a few favorite
    chart styles and stick to them almost all of the time.


    # ## You Are Not a Spreadsheet Expert Yet


    This has been nothing but a toe in the spreadsheet waters. If you are not accustomed
    to creating and modifying spreadsheets but need to become fully competent with
    them, you will need to study and practice for weeks or months, no matter what
    spreadsheet program you end up using most of the time. www.OpenOffice.org''s "Support"
    section has a number of OOO "Calc" tutorials, and a quick trip to any major research
    engine will point you to many more.


    Another way to learn is to simply try things out and see what happens, using that
    "Help" button whenever you run into a feature you don’t understand. Learning on
    your own, at your own pace, is easier for many people. Although it won’t look
    as good on a resume as formal classes, when you’re on the job the knowledge gained
    through self-study is just as useful as knowledge you acquire through more formal
    channels.'
