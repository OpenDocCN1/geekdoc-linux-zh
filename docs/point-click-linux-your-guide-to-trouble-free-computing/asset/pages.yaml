- pgno: 107
  md: 'Point & Click Linux!


    # # Welcome to OpenOffice.org Writer Help


    ![](img/01efe5dd076565746bf3678068ba155c_107_0.png)


    Each section of OOO has its own book-length "Help" manual that will teach you
    more than you need to know. You can read it all if you have time, but it is probably
    more efficient to use it as an index and look up how to do specific things as
    you need to do them. No one user is going to use all the features in a program
    the size of OOO, and no two users are going to use the same features. Some people
    will want to use OOO to put together two-column newsletters (and send them to
    the printer as PDF files, which printers like), while another may never turn out
    a paper newsletter but will want to use OOO to produce business cards.'
