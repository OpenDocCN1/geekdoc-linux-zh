- pgno: 126
  md: 'We do this by putting our cursor on the line between two of the letters, in
    this case "A" and "B," which makes it suddenly grow two little arrow tips, one
    pointed left and one pointed right. While holding our left mouse button, we move
    that line the direction we want it to go. In this case, since we want to make
    the "A" column wider, we drag that line to the right, probably to about where
    the line between "B" and "C" were when we started.


    ![](img/01efe5dd076565746bf3678068ba155c_126_0.png)


    Now we have room for long company names and we can start typing them in, along
    with the months of the year.


    There! We have the months typed in, along with some client names. We started our
    list of client names in row 2 instead of at the top in row 1, just as we started
    our list of months in column B instead of A, so that everything lines up neatly.


    ![](img/01efe5dd076565746bf3678068ba155c_126_1.png)


    Uh-oh. It looks like we spelled "September" wrong. There are two ways we can fix
    this. One is to use the built-in OoO spellchecker, which we bring up (in any OoO
    screen) by clicking "Tools" in our top-of-window menu, then selecting "Spellcheck,"
    the top item on the list. (We can also get a spell check by clicking the "ABC
    plus Checkmark" item on the menu along the left side of our window, or by just
    hitting our keyboard''s "F7" key.)


    ![](img/01efe5dd076565746bf3678068ba155c_126_2.png)'
