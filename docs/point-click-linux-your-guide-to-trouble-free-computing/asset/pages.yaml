- pgno: 159
  md: '# Point & Click Linux!


    We look down in the lower left corner of the window and see that we have 69.4
    megabytes of data in our "Pictures" folder, which will easily fit on a single
    CD. There''s only one thing left to do, assuming we''ve put either a blank recordable
    CD or a rewritable CD in our drive: Click the "Burn" button in the lower right
    corner of the K3b window and sit back.


    ![](img/01efe5dd076565746bf3678068ba155c_159_0.png)


    Making a music CD is exactly the same, except you choose "Audio CD Project," and
    instead of selecting a whole folder at once to put on the CD, you might want to
    place each file (that is, each piece of music) individually on it so you can set
    the order in which they''ll play on the finished CD. To move files around within
    the "Project" listing, you just "drag" them to where you want them with the mouse
    while holding the left mouse button and release the button where you decide they
    best fit in your custom-made playlist.


    # More About Using K3b


    When using Reusable (Rewritable) CDs, K3b will automatically "blank" them—that
    is, remove what you had on them before—but will ask you to confirm this action
    first so you don''t delete important material by mistake.


    Copying CDs is self-explanatory; just step through the processes as they come
    up, following the onscreen instructions.


    Making or copying DVDs is the same as working with CDs, except you must have a
    DVD burner and not just a CD burner to use this feature.


    Burning ISO images from which your computer can boot directly (like the SimplyMEPIS
    CD in this book) requires a slightly different procedure. Select "Tools," then
    "CD," then "Burn CD Image." (Or if you have a DVD-write drive, you can burn a
    bootable DVD instead by clicking "DVD" instead of "CD." After that, select the
    ISO image you want to put on CD or DVD, and you will get a special screen for
    ISO burning.)'
  merge: -1
  img_proc: true
- pgno: 160
  md: 'The built-in K3b “Help” file is surprisingly good. It contains most of the
    information you''ll ever need for daily K3b use. We suggest playing with a rewritable
    CD for your first experiments, because no matter how good your burning software
    may be (and K3b is very good indeed!) a single wrong move, especially when burning
    a bootable CD, can leave you with a useless plastic “coaster” instead of correctly
    stored data. Even though rewritable CDs cost more than “single write” recordable
    CDs, it is worth the few extra bucks to have some around for testing—and if you
    regularly back up your most important data on CD (as everyone should but few do),
    you can reuse a single rewritable CD over and over for your most current information
    instead of accumulating a stack of CDs with old data on them.


