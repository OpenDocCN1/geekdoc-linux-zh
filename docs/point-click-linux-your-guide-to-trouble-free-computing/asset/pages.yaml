  md: '# 19: K3b—Easy CD Burning Program


    Now we have K3b set up (automatically) and ready to run. So let''s do something
    with it. The main startup screen gives us several choices. We''re going to choose
    "New Data CD Project" because we often create Data CDs. In this case, the data
    will be a bunch of pictures we took of a sailboat race. We''re going to make a
    CD with all the pictures on it that we can give to the editor of the Sarasota
    Sailing Squadron''s monthly newsletter, "The Burgee," for publication in the next
    edition.


    ![](img/01efe5dd076565746bf3678068ba155c_158_0.png)


    We have four types of projects from which to choose:


    +   1. New Audio CD Project

    +   2. New Data CD Project

    +   3. New Data DVD Project

    +   4. Copy CD


    ![](img/01efe5dd076565746bf3678068ba155c_158_1.png)


    K3b considers everything other than music "Data," and we''re writing to a CD,
    so we''ll choose "New Data CD Project."


    After we make that choice, we need to choose the data we want to put on the CD.
    The top half of our K3b screen is divided into two sections: files on the right,
    folders on the left. We''re going to put an entire "Pictures" folder on CD, so
    we put our cursor on the "Pictures" directory listing and, while holding our left
    mouse button, drag it down into the "Current Projects" area, then release the
    mouse button.


    ![](img/01efe5dd076565746bf3678068ba155c_158_2.png)


    145'
