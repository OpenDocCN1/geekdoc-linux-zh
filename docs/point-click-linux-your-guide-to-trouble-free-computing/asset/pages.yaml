- pgno: 142
  md: '“Settings,” and click on the “Check Printing” tab. Here you can adjust exactly
    where every piece of information on your checks will print, in accordance with
    the instructions included with your preprinted check blanks.


    While we’re on the “Settings” screen, we might as well look around and check the
    rest of it. The defaults are fine, but you can always change things to suit your
    personal taste, including fonts, the way graphs display, and even sounds. Perhaps
    you have a little sound clip around of someone crying, and you’d like to have
    it play every time you make a withdrawal—and have the sound of applause play every
    time you make a deposit. (I’m not advising you to do this, but you can if you
    want.)


    ![](img/01efe5dd076565746bf3678068ba155c_142_0.png)


    One last note: Of all the data on your computer, your financial information is
    probably the most important. You should back it up regularly. CheckBook Tracker
    will ask if you want to back up to a disk every time you close the program. Your
    answer should always be “yes.” You can reuse the same disk over and over, so the
    cost of taking this precaution is so small you can barely measure it; however,
    the value of keeping a second set of your records is huge if your hard drive ever
    decides to stop working.


    # More CheckBook Tracker Information and Help:


    The “Help” button on every CheckBook Tracker screen leads to “Contents,” which
