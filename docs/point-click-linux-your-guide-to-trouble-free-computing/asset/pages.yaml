- pgno: 130
  md: '# **14: OpenOffice.org Calc: Spreadsheets**


    This opens the built-in OpenOffice.org manual to the page we need:


    ![](img/01efe5dd076565746bf3678068ba155c_130_0.png)


    The language is arcane (because spreadsheets are arcane) but if we look for a
    moment we see this useful section:


    +   *Example:*

    +   If you enter the numbers 2; 3 and 4 in the Number 1; 2 and 3 text boxes, 9
    will be returned as the result.


    SUM(A1;A3;B5) calculates the sum of the three cells. SUM (A1:E10) calculates the
    sum of all cells in the A1 to E10 cell range.


    Aha! We can either enter each of the cells we want to add manually, separated
    by semicolons, or we can just enter the *first cell* and the *last cell* we want
    to add, with a colon between them, and automatically grab all cells between the
    two. This second choice is a lot easier than typing in a whole string of cell
    locations, especially when you''re dealing with spreadsheets that have thousands
    of entries.


    # **The Ooo help files: always there for you**


    There''s a rather complete manual built into OpenOffice.org. We mentioned earlier
    that you can access it from the “Help” listing in the menu at the top of every
    single Ooo window. But Ooo “Help” can be even more helpful than that. When you''re
    doing almost anything in Ooo, there''s a “Help” button nearby that will take you
    directly to a manual section that relates to what you''re doing (or trying to
    do).


    Ooo manual sections vary in quality, and most of them are written in a style only
    a computer programmer could love, but all the information you need is there if
    you read the relevant sections carefully.


    An online tool that can help you understand the Ooo manual (and computer manuals
    in general) is the *Wikipedia* at www.pcowebopedia.com. One of the big problems
    with computer hardware and software manuals is that they assume you already know
    things most people don''t know. *Wikipedia* will help you translate programmer-speak
    into English.'
  merge: -1
  img_proc: true
