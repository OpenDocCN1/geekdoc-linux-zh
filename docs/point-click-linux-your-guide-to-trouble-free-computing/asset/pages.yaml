- pgno: 108
  md: '# Printing with Oo Writer


    We got your printer set up in Chapter 2, “Running the SimplyMEPIS CD.” To print
    your document, click on the Printer icon. It prints. If you want to set your printer
    to do more than just turn out pages in reverse order, choose the “File” menu (top
    left corner of your screen), then “Printer Settings” and change whatever you like.
    It''s best to try doing this with a two-page piece first, not with a 100-pager,
    so you don''t waste a lot of paper and ink experimenting.


    You do, however, want to explore your printer settings with at least two pages,
    not just a single page, because some of those settings involve how pages are ordered.


    Another trick you''ll want to use some of the time, especially with complicated,
    multi-page printing projects, is the “Page Preview” selection from that same File
    menu, which will show you exactly how your printed page will look before you commit
    it to paper. This is especially valuable when you''re making something like a
    two-column newsletter full of illustrations.


    Yes, with some practice you can teach yourself to turn out reasonably complicated
    desktop publishing projects with Oo. It''s an amazing program—especially considering
    the price—that can handle far more than basic office functions if you''re willing
    to go beyond the raw basics of how to use it.'
  merge: -1
  img_proc: true
- pgno: 109
  md: '# Point & Click Linux!


    # You don''t always need a word processor


    Some of this book''s early chapters were written with a text/HTML editor called
    Bluefish. OpenOffice.org only came into play when the editing process started.
    That was when the collaborative editing features in OOO were needed in order to
    work with the publisher''s production people, who use Microsoft Word, but it was
    easier to type early drafts as unformatted text.


    KWrite is probably easier than Bluefish for most Linux beginners to use as a basic
    text editor; Bluefish is a tool that was designed for online writers and doesn''t
    have a "print" function, which is why KWrite is part of the *SimplyMepis* CD and
    Bluefish isn''t. The CD does, however, include the highly regarded HTML editor,
    Quanta+. You may find KWrite or Quanta+ better than OOO or other "heavy" word
    processors for everyday note-taking, simple writing, and producing material that''s
    going to be published on the WWW instead of on paper.


    ![](img/01efe5dd076565746bf3678068ba155c_109_0.png)


    creating main gui...


    Word processors are generally lousy for making Web pages. Neither OOO nor Microsoft
    Word turns out good HTML. Even Microsoft FrontPage does a poor job of it. If you
    are creating Web pages, you are always better off using a program designed for
    that task—like Mozilla Composer—instead of using a word processor.


    When you write basic, unadorned text it''s easy to add fancy formatting and colors
    later, but if you write them in at the beginning it''s not always easy to remove
    them, no matter what operating system or software you use.


    I''ll show you how to get Bluefish and add it to your computer with a couple of
    mouse clicks—along with thousands of other free programs—in Chapter 24, "Downloading
    and Installing Software." There are dozens of text and HTML editors for Linux.
    Just because I prefer Bluefish doesn''t mean you won''t like another one better.
    Always remember, part of the joy of Linux is choice: with Linux, you can set up
    your computer exactly the way you want it. You are never stuck with someone else''s
    choices.'
  merge: -1
  img_proc: true
- pgno: 110
  md: '# Other Cool OpenOffice.org Writer Tools


    Look at the menu at the top of your Ooo screen. One of the choices is “Tools.”
    Click on it and you’ll see “Spellcheck” on top. You can have Spellcheck on all
    the time, underlining words as you go—AutoSpellcheck—or you can run Spellcheck
    on the whole file after you’ve written it. There’s also a Thesaurus that will
    suggest alternate words if you find your imagination running a little dry and
    you think you’ve been using “however” (or whatever) too often. Also under “Tools”
    you’ll find Word Count—an essential feature for writers who get paid by the word—and
    other useful utilities.


    Some of these tools have icons to the left of your main working screen. Put your
    cursor over an icon and you’ll get a bit of text that tells what it does. Click
    your left mouse button on that icon and you’ll open whatever function it represents.
    Click it with your right mouse button and you’ll have a chance to delete that
    icon if you think you’re unlikely to use that function often, and you can also
    add icons for functions you use often but aren’t shown in that right-side toolbar.


    You might want to try adding the “Thesaurus” icon; it’s not there by default,
    but it’s awfully useful to have handy.'
