  md: '# Point & Click Linux!


    These games take no setup to run. You can start playing them as soon as you boot
    your computer from the *SimplyMEPIS* CD. One warning, though: This book’s author
    and the creators of MEPIS, Debian, KDE, the individual games, and Linux itself
    are *not* responsible for loss of productive time (or valuable Linux learning
    time) due to excessive use of addictive games and other toys....


    # Card Games


    # Patience (Solitaire)


    This is your basic solitaire game. Reach it by clicking on your “K-Gear” icon,
    choosing “*Games*”, then “*Card Games*”, then “*Patience.*”


    You can now play as long as you like. Or you can spend a few moments customizing
    the cards’ appearance by clicking “*Settings,*” then “*Switch Cards.*” From “*Settings*“
    you’ll also see a “*Game Type*” choice that gives you 18 different one-player
    patience-type card games. If you run into one that’s unfamiliar to you, but still
    want to give it a try, the “*Game*” top menu choice has a “*Demo*” feature you
    can click to see how the game is played. While you’re learning a new game, you
    can click on the wand icon at the top to get a hint or two.


    ![](img/01efe5dd076565746bf3678068ba155c_177_0.png)


    If that isn’t enough help, you can click “*Help*” and see the rules for each “*Patience*”
    game.


    ![](img/01efe5dd076565746bf3678068ba155c_177_1.png)'
