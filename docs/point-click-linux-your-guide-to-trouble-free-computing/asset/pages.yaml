- pgno: 101
  md: 'You can also save work you create with Ooo in Microsoft''s formats, although
    after you realize that Microsoft formats take over *twice* as much hard drive
    space as Ooo''s "native" saving format, you''ll probably only want to do this
    if you''re sharing a piece you''ve created with a friend or coworker who only
    has Microsoft Office. In order to save hard drive space and hassles for both of
