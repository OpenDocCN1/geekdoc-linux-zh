- pgno: 63
  md: '# Point & Click Linux!


    The easiest way to tell if an ISP is Linux-compatible is by whether or not it
    requires you to install special software on your computer to connect to its lines.
    If it requires special software, the service usually cannot be used with Linux.
    The most notable offender is AOL, which you cannot use without AOL software on
    your computer, and there is no Linux version of AOL’s software. There is some
    irony here because AOL itself uses Linux heavily for internal purposes, but that’s
    their problem, not ours. We simply accept the fact that AOL does not welcome Linux
    users, so we use any one of the thousands of other ISPs that do—and because most
    of them charge less than AOL, we are happy to use them instead.


    But just because an ISP offers dialup software doesn’t necessarily mean that software
    is *required*. This book’s author has used the well-known ISP, Mindspring, for
    many years. While Mindspring is happy to supply you with dialup software for Windows
    or Mac PCs, they are just as happy to have you connect to their service with the
    KPPP utility on your *SimplyMEPS* CD, which is just as easy to set up as any other
    ISP dialup program.


    > (If you’re not sure whether your current ISP or one you’re thinking about using
    will work with Linux, call or email them. They’ll have no problem telling you.)


    You will need the following information from your ISP to set up KPPP:


    +   1. Your username

    +   2. Your password

    +   3. Phone number


    Every ISP gives you this information when you sign up, and if you don’t have it
    handy you can email or call and they’ll give it to you again.'
  merge: -1
  img_proc: true
- pgno: 64
  md: '# Setting Up KPPP


    Obviously, we want to choose “Configure.” And the main thing we want to configure
    is “Accounts,” so that’s where we’ll start by clicking “New.”


    ![](img/01efe5dd076565746bf3678068ba155c_64_0.png)


    That will give you a choice of “Wizard” and “Manual Setup.” You can look at the
    “Wizard” screen, but it won’t do you any good unless you’re in a country listed
    there—and the U.S. isn’t listed. If you’re in one of the listed countries, the
    “Wizard” will give you an instant list of popular ISPs there and help you get
    an account if you don’t have one already.


    Those of us in unlisted countries can use “Manual Setup” with no sweat, though.
    All we’re really doing is entering our ISP name and local dialup phone number.
    Not hard!


    Note that there’s an “Add” button. Use this to put in the ISP’s phone number.
    You can put in more than one number—a good idea in case one is sometimes busy
    or doesn’t work—by using the “Add” button more than once (assuming your ISP has
    multiple local phone numbers where you live).


    ![](img/01efe5dd076565746bf3678068ba155c_64_1.png)


    You almost certainly won’t need to worry about “Authentication.” If you try to
    connect to your ISP and fail after you get everything set up, it may need to be
    reset, but this is rare, and it’s something you can call your ISP to check on
    if you have trouble getting logged in. But we won’t worry about this now. We’ll
    just make sure we’ve put in a name and phone number for this connection and click
    “OK.”'
  merge: -1
  img_proc: true
- pgno: 65
  md: '# Ready to Connect


    The only thing left is to type in your ISP username and password. After you''ve
    done that, make sure your modem is correctly connected to the telephone line and
    click “Connect.”


    ![](img/01efe5dd076565746bf3678068ba155c_65_0.png)


    One of three things will now happen. The most likely is that you’ll uneventfully
    dial your ISP, get logged on automatically, and do whatever you want to do online.
    Your connection performance will be neither better nor worse using KPPP in Linux
    than with any other program in any other operating system.


    The second most-likely event is that your modem will dial correctly but that the
    login will fail, leaving you with a “Disconnect” notice that includes some numbers
    programmer may find useful but mean little or nothing to the rest of us. If this
    happens, the most common cause is a typo in your username or password. Retype
    them and try again, and everything should now be fine.


    The third problem, which happens with about five percent of all modems, is that
    you have a “Winmodem” that is simply not compatible with Linux or Mac or any other
    operating system other than Windows. MEPIS Linux will detect and automatically
    configure most Winmodems, but not all. There are ways to make almost any Winmodem
    work with Linux, but it’s a lot easier—and a lot cheaper, if your time has any
    value at all—tosimply buy and plug in a Linux-compatible external “hardware” modem
    if you have a desktop or a PCMCIA (card) modem if you have a laptop. (You can,
    of course, use a regular external modem with a laptop, but it’s less portable
    and convenient than a modem specifically designed for laptop use.)


    # Troubleshooting Modem Connection Problems


    The first thing to do when trying to figure out why a modem won’t connect under
    KPPP and Linux is to listen to it. If you hear nothing when you’re dialing your
    ISP, click “Configure” on the dialup screen and select the “Modem” tab.'
  merge: -1
  img_proc: true
- pgno: 66
  md: 'Adjust the volume control in the middle of the screen. Modem speakers on PCs
    vary; one might be too loud when set to the default volume while another might
    be so soft at that setting that you can''t hear it at all. If yours is too soft
    to hear, crank it up.


    ![](img/01efe5dd076565746bf3678068ba155c_66_0.png)


    As long as we''re on this screen, let''s click the "Query Modem" button. If we
    get a list of results—that is, it looks like something''s happening—chances are
    the modem is fine and any connection problems are unrelated to your modem and
    Linux. (Checking the cord connecting your modem to the phone line is a good idea;
    bad connections between the computer and phone system are a common cause of modem
    difficulties.)


    If, instead of getting a series of little bars and other "I''m doing something"
    indications when you "Query Modem," you get something like "Cannot Detect Modem"
    or "The Modem is Busy," you will want to reboot your computer to make sure everything
    is working right. If that doesn''t work, you probably have a Windows-only "Winmodem"
    and it''s time to think about buying a "hardware modem" that doesn''t depend on
    a specific operating system to run properly.


    # Modem buying hints


    A Winmodem''s packaging or online sales blurbs will list the Windows versions
    required to run it and will list *nothing but* Windows variants. A modem that
    also works with Mac OS or DOS is not a Winmodem, by definition, and will virtually
    always work with Linux even if a manufacturer doesn''t explicitly say it will.
    Better yet, a search on Google or another search engine for the words "Linux modem"
    will bring up plenty of low-cost modems that will absolutely, positively work
    with Linux. Get a USB or serial port external modem, and you won''t even need
    to install it. Just plug it in, and you''re ready to connect.'
  merge: -1
  img_proc: true
- pgno: 67
  md: '# Point & Click Linux!


    A modem that dials, and that you can actually hear dialing, is a working modem.
    If you got an annoying “KPPD Daemon died unexpectedly” notice or something similar
    when you were expecting to see a notice that you were connected and your username
    and password were accepted, the problem is probably not with your modem or software.
    The most likely reason for this problem is, as mentioned previously, an incorrect
    username or password. A second possibility is the “Authentication” protocol. A
    few ISPs don’t use the generic “PAP/CHAP” method, but require either strict PAP
    or strict CHAP. You don’t need to know what these terms mean (although you can
    look them up through a search engine if you’re curious), just that you may need
    to use one or the other.


    ![](img/01efe5dd076565746bf3678068ba155c_67_0.png)


    This change is simple to make in KPPP. Go to your “Configure” screen, pick “Accounts,”
    choose “Edit” your account, and click the arrow to the right of “PAP/CHAP.”


    ![](img/01efe5dd076565746bf3678068ba155c_67_1.png)


    This will give you several choices, including both “PAP” and “CHAP” individually.
    Your ISP can tell you which one you should pick if this is an issue, or you might
    just try them both, one at a time; it takes less time to make this change than
    to dial an ISP’s customer service line and deal with voice mail menus.


    One last problem can keep you from connecting easily to an ISP, and it only happens
    with a tiny percentage of ISPs in the U.S., and a shrinking number in the rest
    of the world: a requirement that you enter a “Static IP,” a “Gateway,” and a “DNS
    IP Address” to use the service. Only ISPs with very old equipment still require
    these settings, and they require them no matter what operating system you use,
    so an ISP that uses them should readily give them to you if you ask. You probably
    already have them around as part of the signup information they gave you when
    you first started using their service.


    To change these settings, you are again going to “Edit” your account, and choose
    the IP, Gateway, and DNS tabs as the parts to edit. You’ll need to click “Static”
    or “Manual” to put in the numbers. And if an ISP says you must use their DNS (Domain
    Name Servers) while connected to them, you must not only type in their DNS but
    also click the “Disable existing DNS servers during connection” box in the “DNS”
    window.'
  merge: -1
  img_proc: true
- pgno: 68
  md: 'You can have multiple connections in KPPP, each with its own setting. This
    is essential on a laptop if you travel a lot, but can also be useful if you have
    more than one home ISP dialup connection.


    Get more help with modem connections at http://www.mepis.org/forum.'
