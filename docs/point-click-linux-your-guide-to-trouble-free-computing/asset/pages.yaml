- pgno: 79
  md: 'Mozilla settings work exactly the same as Netscape settings, and they''re the
    same in Linux as they are in Windows or Mac OS, so any competent ISP or corporate
    help desk person will know what to do.


    # Setting Up Mozilla Virus and Spam Filters


    While Linux isn''t affected by any Windows email viruses, we don''t want them
    to fill our email inbox any more than we want spam to fill it, so we''ll filter
    them out at the same time we filter spam and use the same tool for both: Mozilla''s
    "Junk Mail Controls."


    ![](img/01efe5dd076565746bf3678068ba155c_79_0.png)


    The "Junk Mail Controls" illustration shows the settings this book''s author uses.
    They seem to give a good balance between eliminating "junk" and letting worthwhile
    messages through. You may want to simply duplicate them. But as we keep saying,
    your computer is your computer, and with Linux it''s your choice how you want
    to handle things, not someone else''s. Experiment. Try different settings. We''ll
    give you a few hints in a moment, but first let''s talk about how a Bayesian filter
    works.


    # One Person''s Junk Is Another''s Treasure


    This is the secret of the Bayesian filter: It detects patterns in accord with
    your classification of emails as "junk" or "not junk."


    If you keep tagging email with a particular string of words in it as junk, before
    long any email containing that string of words will go straight to the junk folder.
    If you go through the junk folder now and then—perhaps every few days at first—and
    reclassify some of the emails that got shunted there as "Not Junk," the filter
    won''t classify future emails the considered similar as junk any longer. In other
    words, you train the filter according to your tastes instead of accepting someone
    else''s definition of spam.'
