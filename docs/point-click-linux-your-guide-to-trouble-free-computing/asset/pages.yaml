- pgno: 77
  md: '# Point & Click Linux!


    This is where we need some of the information we got from our ISP or network administrator.
    When given the "pop" or "imap" choice, if you don''t know which one you have it''s
    almost certainly "pop." The server name depends on how your provider has things
    set up. Just type in whatever they told you and you''ll be fine. The same goes
    for the "Outgoing Server" space: Type in whatever your ISP or network admin told
    you should be there, and that''s that. Next screen, please.


    The name you type here is the one your ISP gave you, not your real name (unless
    they''re the same). It could be something blah like "Miller123" or something colorful
    like "glowingsunflower" that you chose yourself. Either way, it goes here. Next:


    ![](img/01efe5dd076565746bf3678068ba155c_77_0.png)


    This is a "whatever you want it to be" choice, and is important only if you have
    more than one email account. You can type in "mail" or "booty call" or "mostly
    spam" or whatever else turns you on—even the bland "Home" or "Work" choices suggested
    by Mozilla itself.


