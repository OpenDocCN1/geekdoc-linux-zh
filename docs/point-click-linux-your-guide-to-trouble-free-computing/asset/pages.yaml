  md: '# OpenOffice.org Calc: Spreadsheets


    If you''re accustomed to working with spreadsheets, this chapter will teach you
    how to work with them in OOO. If you don''t use spreadsheets you may want to skip
    this chapter, and if you only use spreadsheets prepared by others and change them
    only by filling in blanks or making other minor alterations, a fast skim through
    these pages may be all you need.'
