- pgno: 8
  md: '# About the Author


    ![](img/01efe5dd076565746bf3678068ba155c_8_0.png)


    Robin "Roblimo" Miller started writing professionally in 1983 as a freelance reporter
    and feature writer in Baltimore, Maryland. He first wrote about Linux in 1997,
    and by 1998 he was a full-time Linux user, working as a reporter, columnist, and
    editor for Andover News Network, which later became the OSTG (Open Source Technology
    Group) division of VA Software.


    Roblimo, as he has been known online since the mid-1990s, was one of the first
    reporters to cover the Linux phenomenon. He has spoken at computing and Internet
    conferences in Saudi Arabia, Mexico, India, Trinidad, Jordan, and at least a dozen
    U.S. states. He''s been "the computer expert" for the award-winning Rise and Shine
    morning show on Baltimore''s WIJZ TV, and has been a guest on many radio and several
    cable TV talk shows.


    Point & Click Linux! is Roblimo''s second book. His first, The Online Rules of
    Successful Companies, was published by FT Prentice Hall in 2002. He has written
    over 2000 articles for various newspapers, magazines, and Web sites on topics
    including Linux (of course!), child support, college campus drug use, metallurgy,
    magnetic resonance imaging (MRI), software development, telemarketing, crime prevention,
    tax policy, online business, TV news reporting, taxi driving, and political shenanigans.


    Before becoming a full-time writer and editor, Roblimo worked as a limo owner/driver
    (hence "Roblimo"), taxi driver, electronics technician, soldier, and auto mechanic.
    He is currently editor in chief of OSTG, and lives with his wife, the artist Deborah
    Miller, in Bradenton, Florida.'
