  md: 'If you consign all your virus emails to junk world for a day or two, after
    that almost every one you get will go there automatically. With a little “tuning”
    by going through your junk folder a few times and marking anything that’s there
    and shouldn’t be “Not Junk,” you’ll soon have your junk filter doing a great job
    of screening your email for you.


    # # Setting Up Email Folders and Filters


    You can do many tricks with Mozilla mail beyond eliminating junk. One of the best
    is to automatically sort your email into many folders. There are several good
    reasons to do this. An obvious one is to keep professional and personal email
    separate. Another is to keep emails from each email list to which you’ve subscribed
    in its own file so you don’t confuse one with another. And filtering your list
    email messages will also keep your junk mail controls from inadvertently classifying
    email list messages as junk, which is a common problem with all spam and junk
    mail filters, not just Mozilla’s.


    ![](img/01efe5dd076565746bf3678068ba155c_80_0.png)


    We get to the “Message Filters” control box by clicking “Tools” at the top of
    our Mozilla email screen and selecting “Message Filters” from the “Tools” menu.
    We create a new message filter by clicking “New.”'
