- pgno: 121
  md: '# Point & Click Linux!


    We can also flip or rotate photos with OOO Draw. There are several ways to do
    it. One is to use the “Rotation” tab in that same “Position and Size” dialog window
    and either click one of the preset sideways, upside-down or 45 degree angle choices
    or use a little window to the left of the “big” choices to select your rotation
    angle in 15 degree increments. If those aren’t enough choices, you can go to the
    menu at the top of the OOO window, choose “Rotate,” and use the corner “handles”
    on the picture to turn it, and try various angles until you find one you like.
    We happen to like Brice at this jaunty angle:


    ![](img/01efe5dd076565746bf3678068ba155c_121_0.png)


    You may think this looks silly. No problem; remember that you can undo the change
    with Ctrl+Z or the Edit Menu “Undo” option, so you can have your Brice at any
    angle you want.


    # Making (or Altering) Pictures with OOO Draw


    To create your own art, start with a blank drawing slate by clicking “File” in
    the top menu, then “New,” then picking “Drawing” from the “What kind of new work?”
    choices that show up to the right of the main menu when your cursor is over (or
    to the right of) the word “New.”


    This gives you visible tools along the top and left side of your work area that
    are different from the ones you get when you open a “New Text Document” window.


    On the left side of your work area you see a number of icons, starting with a
    pointer at the top. Each one will draw a shape or perform another function that
    will help you make a complete work of art. It would take thousands of words to
    describe in detail what each one does and how it works, whereas it only takes
    a few seconds to run your mouse over each icon and read the little text box that
    pops up. It only takes a few more seconds to try each one in the blank work space
    and see what it can do for you. Mistakes are fine. If you don’t save your work
    after your practice, no one will know you made mistakes, and you will use no hard
    drive storage space preserving them for posterity. So, please, experiment freely.
    All pixels (the little dots'
  merge: -1
  img_proc: true
- pgno: 122
  md: 'that make pictures on your screen) created with Linux are fully recyclable;
    no precious resources or landfill space are needed during your self-training sessions.


    As part of your exploration, check out the special toolbar that appears at the
    top of your work space when in “Draw” mode, too. The toolbar on the left holds
    your “drawing tools,” you might say, while the one on top changes those folks’
    characteristics. They’re not well-marked, so you’ll want to click on them a few
    times each until you understand what they do, which will only take a few seconds
    of hands-on trial and error. Bear in mind that an “error” here can be zapped out
    of existence with “Ctrl+Z” or simply by not saving it, so it’s fine to try anything
    you like, including using OOO Draw with your monitor or laptop upside down.


    ![](img/01efe5dd076565746bf3678068ba155c_122_0.png)


    # Saving Image Files


    This is a spot where things get just a hair tricky, but it’s just a hair so there’s
    no need to worry. Remember how we said OOO treats images as part of a page or
    presentation? That’s how it likes to save them, too. If you select the “File”
    Menu choice, then click “Save As” while you’re working with an image file, your
    choices will all be file types that only work with OpenOffice.org or its commercial
    cousin, StarOffice. They will not be image files that can be opened by all kinds
    of picture software and Web browsers and whatever. So, being a hair tricky ourselves,
    we if plan to use an image file in anything other than an OpenOffice.org or StarOffice
    document or presentation, we “Export” it to the file format we want.


    ![](img/01efe5dd076565746bf3678068ba155c_122_1.png)


    Instead of choosing “Save As” when we want to save our graphics file all by itself
    instead of as part of something else, we roll our mouse to four listings down
    the “File” menu and select “Export.” That gives us a long list of file formats
    from which to choose. If you’re an experienced artist or Web designer, you’ll
    see most of your favorites there, even Macromedia Flash. If you don’t know one
    graphics file format from another, the safest'
  merge: -1
  img_proc: true
- pgno: 123
  md: '# **Point & Click Linux!**


    choice is JPEG. This is the format used by most digital cameras. Virtually all
    known graphics programs and Web browsers, for all operating systems, can read
    JPEG pictures.


    There are only two more options we need to select if we decide to save the image
    in JPEG format: “Quality” and “Color resolution.” Default quality is 75%, which
    is plenty good enough for Web publishing. But unless you’re sure that this is
    all you are going to do with this graphic it’s probably better to choose 100%
    because you can always lower the quality later, but once lowered you cannot raise
    it.


    On the “Grayscale” versus “True Colors” choice, it’s better to choose “True Colors”
    for much the same reason: You can always turn a color image into a black and white
    one later, but you can’t add color back into one you save in black and white today.


    ![](img/01efe5dd076565746bf3678068ba155c_123_0.png)


    All we need to do now is pick a name for our file, decide which directory and
    folder are the best place to put it, and click “Save.”'
