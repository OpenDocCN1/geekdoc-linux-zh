    This introduction to Ooo is just that: an introduction. Ooo has so many features
    that it would take a book more than twice as large as this one to give detailed
    instructions on how to use them all. Today, we''re interested in learning basic
    functions so that you can start doing basic work right away. This will still take
    a number of pages—enough that we have separate sub-chapters that cover each of
    several popular Ooo functions—but not so many that you''ll get lost. Besides,
