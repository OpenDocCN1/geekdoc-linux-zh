- pgno: 134
  md: '# Chapter 15


    # OpenOffice.org, Microsoft Office, and StarOffice


    D**espitespite the amazing growth of OpenOffice.org (OOo)—millions of new users
    every year—Microsoft Office is still the world''s most popular general office
    software package. Indeed, one of the great “features” of OOo is that you can use
    it to open and work with Microsoft Office files. But don''t expect 100% compatibility
    with MS Office. You won''t get it. Instead, expect to get enough compatibility
    for everyday work, with some of the “frills” left out.**


    ![](img/01efe5dd076565746bf3678068ba155c_134_0.png)'
  merge: -1
  img_proc: true
- pgno: 135
  md: 'The biggest problems with translating MS Office files to OoO are formatting
    and scripts. The information (as in text or pictures) jumps the bridge without
    complaining, but a few “extras,” like fancy animated slide transitions in PowerPoint,
    may get lost.


    MS Office uses Microsoft’s proprietary Visual Basic programming language to create
    most of the “macros” that produce fancy effects like slide transitions and automatic
    page formatting. There is a more-or-less equivalent language for OoO called StarBasic
    that is included with OoO, but it does not use the same commands as Visual Basic.
    Only Microsoft and Microsoft licensees are allowed to use Visual Basic. This is
    a problem for anyone who is not using Microsoft products, but not a large one—except
    for Microsoft, as a growing percentage of the world’s computer users discover
    that Java and other computing languages can be used on many operating systems
    (including Linux) with software produced by companies not affiliated with Microsoft,
    and even with free software (like OoO), and will also work nicely with Microsoft
    operating systems and software.


    But we live in the here and now, not in someday-land, and part of the price we
    pay in a Microsoft world for not using Microsoft products is slight losses in
    translation from Microsoft’s file formats to others. In return we get other advantages,
    like the ability to use OoO to turn out PDF documents with a single click, not
    to mention cutting our software licensing costs down to nothing.


    # Consider StarOffice for Professional Use


    StarOffice is OpenOffice.org’s commercial cousin. It has more templates for documents
    and charts, more built-in clip art, and better tools for importing MS Office files.
    Its cost is still low compared to the competition (less than $80), and it’s fully
    compatible with Linux—along with Windows and Solaris.


    ![](img/01efe5dd076565746bf3678068ba155c_135_0.png)


    StarOffice includes a complete manual, 60 days of free phone support and a free
    Internet training course called “Transitioning to the StarOffice 7 Application
    Suite.” These alone are worth its low price.


    Free OpenOffice.org is probably all you’ll ever need for home or school use, but
    in a professional environment, you may decide that StarOffice is worth the small
    additional investment.'
  merge: -1
  img_proc: true
