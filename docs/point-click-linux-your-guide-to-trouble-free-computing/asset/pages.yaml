- pgno: 85
  md: '# Point & Click Linux!


    What sets Mozilla apart from the most common proprietary browser, though, is that
    it can make your Web experience faster, easier, and more pleasant if you use its
    advanced features, which are advanced technically and in what they can do for
    you, but require no advanced knowledge to activate.


    Let’s start with tabbed browsing. This is something you don’t know you need until
    you have it, but will never want to do without after it becomes a habit. To use
    it in its most basic form, when you click on a link, use your right mouse button
    and choose “Open New Tab” from the menu choices. This will open the new page in
    the same browser window but in a new tab.


    ![](img/01efe5dd076565746bf3678068ba155c_85_0.png)


    “Okay,” you say. “So what?”


    Imagine you’re looking for information at the Linux.com Web site.


    You see an article you want to read, so you open it in a new tab:


    If we’d just done our usual left mouse button click to open that new page and
    wanted to go back to the main page to check out articles, we’d have to reload
    it. But by opening the fresh page in a tab, we didn’t move off the main page,
    so we can go back to it without waiting for it to load again. Now we can scroll
    down, spot another article we want to read, and open that new article in another
    tab, like this:


    ![](img/01efe5dd076565746bf3678068ba155c_85_1.png)


    We can go on and on like this until we have so many tabs open that we can’t read
    the writing on them because they’re so crammed together.'
  merge: -1
  img_proc: true
- pgno: 86
  md: '![](img/01efe5dd076565746bf3678068ba155c_86_0.png)


    Now we have 20 tabs open, and we could have more if we wanted. Try this with a
    search engine: instead of clicking on one search result, going back to the search
    engine page, clicking on another listing, click-click-click open a whole bunch
    of them in new tabs. This is especially nice if your Internet connection is slow
    or you run into pages that don''t load quickly or don''t load at all. Instead
    of coming to a stop, you can read one page while the others load in the background.
    This is a huge advantage when you''re doing any kind of research—and a huge convenience
    when you''re reading news online.


    # Don''t worry about opening too many Web pages


    You can open a dozen windows, each for a favorite news Web site, and open ten
    or twenty tabs in each window. With Mozilla you can have a hundred or more Web
    pages open at the same time without any problem, and Linux won''t crash under
    the load. It''s an industrial-strength operating system, built like a truck to
    handle heavy-duty computing, and Mozilla is a heavy-duty browser that can handle
    nearly as much load as Linux. One of the things people who are used to other operating
    systems often have trouble understanding about Linux is just how rugged it is.
    Some people have gotten into the habit of only opening a few programs or browser
    windows so that their system is less likely to crash. With Linux this habit can
    safely be broken and you can use your computer like a draft horse, not like a
    prancing pony. Of course, after you''re accustomed to using a strong operating
    system like Linux, it''s going to be hard to go back to other, more delicate ones...'
