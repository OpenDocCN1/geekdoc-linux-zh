  md: '# Point & Click Linux!


    # Printing Checks

    and Other

    Settings


    ![](img/01efe5dd076565746bf3678068ba155c_141_0.png)


    For those who don''t yet do their bill-paying online, CheckBook Tracker will print
    checks based on standard "computer print" check forms available from your bank,
    office supply stores, or the "home office" sections of most discount stores.


    To set up a printable check, go to the top of the CheckBook Tracker window, select
    "Transaction," then "New Print Check." Fill in the appropriate information (you
    can have check numbers increase automatically from where you last left off—or
    start with #1 if you like).


    The ideal way to print checks is in batches, so you''ll want to "write" all the
    checks you want to send today, load your printer with check blanks, click on "File"
    at the top of the CheckBook Tracker window, and hit "Print Checks."


    ![](img/01efe5dd076565746bf3678068ba155c_141_1.png)


    The first time you print checks with CheckBook Tracker (or any other check-printing
    program), it''s a good idea to print a couple of "dummy" checks on blank paper
    first and hold them up to the light on top of a sheet of check blanks to make
    sure everything prints in the right place. Chances are, everything will work fine,
    but if you need to adjust anything, go to the top menu, select "Tools," then


    128'
