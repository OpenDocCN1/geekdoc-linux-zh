  img_proc: true
- pgno: 232
  md: '# cat


    The **cat** command (short for *concatenate*) is so handy that it’s become famous
    for being used when it’s not really needed. That must make the other shell commands
    green with envy. Some of them hardly ever get used.


    Here’s one way to abuse it. Say you want to look at the contents of a small text
    file. Just type “cat *filename*” at the command line and the text file will be
    printed in the console window.


    When you want to combine two separate files into one, *cat* is the tool to use.
    The format is:


    ```

    [username]$cat file1.name file2.name > combinedfile.name

    ```


    Nothing to it, but note that the redirection symbol (the *greater than* symbol)
    overwrites any previous file of the same name you’ve specified for the output
    file. To add to an existing file instead of overwriting it, use two greater than
    signs, like this:


    ```

    [username]$cat file1.name file2.name >> combinedfile.name

    ```


    There are more examples of using (and abusing) the *cat* command in the section
    on *grep*.


    # chmod


    The *chmod* command allows you to change permissions for a file, or files, or
    a directory. Permissions determine whether you can read, write, or execute the
    file in question. Permissions are a big reason that Linux users are not as susceptible
    to email-borne viruses and trojans as Windows users, because most system files
    require *root* permission to use or change, and we never give our root password
    to virus-writers.


    The basic format is: *chmod NNN* *filename*, where the first *N* represents the
    file owner’s permissions, the second the file *group’s* permissions, and the third
    everyone else’s permissions. N can vary between 0 and 7. Here is a chart of the
    meaning of each:


    | N | READ | WRITE | EXECUTE |

    |---|------|-------|---------|

    | 7 | Y    | Y     | Y       |

    | 6 | Y    | Y     | N       |

    | 5 | Y    | N     | Y       |

    | 4 | Y    | N     | N       |

    | 3 | N    | Y     | Y       |

    | 2 | N    | Y     | N       |

    | 1 | N    | N     | Y       |

    | 0 | N    | N     | N       |'
  merge: -1
  img_proc: true
- pgno: 233
  md: '# chown


    The chown command is similar to chmod, but instead of altering file permissions,
    you can change the file’s owner and group.


    The basic format of the command is


    ```

    [username]$chown owner.group filename

    ```


    The group name is optional, so if you only want to change the owner, use “chown
    owner filename.” If you only want to change the group, use the chgrp command instead.


    # cp


    The basic format of the cp (short for copy) command is:


    ```

    [username]$cp from-filename to-filename

    ```


    Easy as pie. You can also copy directories as well as files, but if you do, be
    sure to use the “-R” (recursive) option so that you copy everything inside the
    directory. The command to fully copy a directory would be


    ```

    [username]$cp -R from-dir to-dir

    ```


    Let’s copy a GIF file so that it has a file extension indicating that it’s a JPEG
    image, and then see what the file command (which we’ll look at it next) has to
    say about it. The format for the command to do that is


    ```

    [username]$cp picture.gif trick-picture.jpg

    ```


    It’s been copied with the false name. To learn the consequences of doing so, see
    the section on the file command.


    # file


    The file command gives you its best guess as to what kind of file the file you’re
    asking about is. The format is simple, just enter:


    ```

    [username]$file filename

    ```'
  merge: -1
  img_proc: true
- pgno: 234
  md: 'In response, file tells you everything it can about what type of file “filename”
    is. This response, by the way, is not based on anything as simplistic as a file
    type or extension. If you name a graphics image “image.txt,” for example, file
    won’t mistakenly tell you that it’s a text file. Or if you rename an executable
    trojan “image.jpg,” file won’t tell you it’s a graphic image. This is a good thing.
    Lots of bad things happen in the land of DOS/Windows because people are fooled
    by a file extension.


    Now about that phony tick-picture.jpg we created with copy. Will file be fooled
    by the file extension? Not a chance. If you enter


    ```

    [username]$file  trick-picture.jpg

    ```


    File will respond with this:


    ```

    trickpicture.jpg: GIF image data, version 89a, 640 x 480

    ```


    Pretty cool. It even gives you the size of the image.


    # find


    Find is one of the most sophisticated and complex commands available to you. What
    it actually does—find files that match its search parameters—is simple. The devil
    is in the parameters. We’ll limit our discussion here to quick and easy searches.


    The format is as follows:


    ```

    [username]$find  searchpath search-parameters

    ```


    The searchpath argument defines the scope of the search. If you only want to look
    in your current directory and all the directories beneath it, you would use “.”
    as the searchpath, like this:


    ```

    [username]$find  .  search-parameters

    ```


    If you wanted to look everywhere, you would use this:


    ```

    [username]$find /  search-parameters

    ```


    Let’s say you want to find a file called personal.data, and you are not sure where
    it is. To search the entire system, you would use:


    ```

    [username]$find /  -name personal-data

    ```


    Note that the search-parameter option used is “-name,” Any files matching that
    name'
  merge: -1
  img_proc: true
- pgno: 235
  md: '(personal-data.xml, personal-data.txt, etc) will be listed.


    # # grep


    The grep command searches the files you specify for the pattern you specify. It’s
    very handy for finding things inside regular text files. The basic format of the
    command is this:


    ```

    grep (options) pattern file1 file2 ...

    ```


    Each match found is displayed, unless otherwise specified. The options make the
    command a lot handier. You can make it case insensitive by specifying “-i”, or
    simply count the number of times the pattern is found instead of printing them
    by specifying “-c”. If you simply wish to know which files contain the search
    pattern, use the “-l” option.


    I have a large text file containing names and phone numbers, and I never remember
    if I have entered the names upper and lowercase, or just lower. When I want to
    find my friend Steve’s work number, I use grep this way:


    ```

    [username]$grep -i steve phones.txt

    ```


    # # more (or less)


    There is a very handy program included in most Linux distributions called more.
    It’s used to display the contents of a text file one page at a time, rather than
    simply dumping the entire file to the terminal. If you recall, that’s what the
    cat command does, and if you need information at the top of a file that’s more
    than a page long, you have to read real fast to get it.


    The command format is simple, just enter


    ```

    [username]$more filename

    ```


    Scrolling a page at a time is a step in the right direction, but it’s not all
    that. What happens when you go a page or two further, then find you need to go
    back? Scroll bars on your terminal window may get you back to where you want to
    be, but more won’t. That’s one case where less is more.


    There is a similar, but more advanced, program called less. It does everything
    more can do, and more. Most importantly, it allows you to go backward and forward
    as you browse. If you are used to using more and can’t remember to type less instead,
    you might want to'
  merge: -1
  img_proc: true
- pgno: 236
  md: 'create an alias to remember for you. Like this:


    ```

    `[username]$alias more=''less''`

    ```


