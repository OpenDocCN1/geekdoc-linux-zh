- pgno: 16
  md: '# # What You Can Do with Linux


    ![](img/01efe5dd076565746bf3678068ba155c_16_0.png)


    Linux used to be hard to install and use. Now it''s easy. The first version was
    written in 1991 as a hobby project by a computer science student, Linus Torvalds,
    who wanted a version of the industrial-strength Unix operating system that would
    run on his home computer. But Torvalds decided he''d learn more if, instead of
    trying to adapt commercial Unix to his computer, he wrote his own simple Unix-like
    operating system. So he did. Then he posted his creation on the Internet so others
    could not only use it freely, but also contribute improvements and additions to
    it. Several hundred programmers soon joined Torvalds'' effort to create a new
    operating system, and within a few years their efforts resulted in a powerful
    operating system "kernel" that offered Unix-like stability and performance on
    inexpensive desktop hardware.'
  merge: -1
  img_proc: true
- pgno: 17
  md: '# Point & Click Linux!


    Early Linux was not intended for home or office computer users. It was a "raw
    guts" thing with screens that looked like this:


    ```

    (terminal output image, too small to transcribe)

    ```


    We’re obviously not talking “user friendly” here. During its first years of development,
    Linux was strictly intended for computer professionals, computer science students,
    and skilled hobbyists. But since then, thousands of programmers worldwide have
    worked to make Linux more useful for ordinary people like you and me. While it
    still has the computing power and stability of Unix, the face of Linux we now
    see is one we can use with simple point and click commands instead of typing long
    strings of text like


    ```

    .configure --with-tls --enable-slurpd --enable-crypt --enable-syslog --sysconfdir=/etc

    ```


    That sort of thing is fine for professional systems administrators running groups
    of server computers, but those of us who use Linux on our PCs would rather see
    graphical buttons like these:


    ![](img/01efe5dd076565746bf3678068ba155c_17_0.png)


    Obviously, if we click on a picture of a CD that has musical notes on it, we expect
    to play a music CD, and if we click on a picture of a printer, we expect to print
    something. This is how we control MEIPS Linux through its KDE desktop and KDE’s
    underlying X Window graphics system, which translate our clicks into code our
    microprocessors understand. This happens in all operating systems, not just in
    Linux. Computers don’t understand pictures and clicks, just binary code, and they
    don’t “draw pictures” in the sense that we humans do, either. They turn colored
    dots on your computer screen on and off the same way your TV screen does. Beneath
    the pictures on all computer screens there is a whirlwind of binary digits flying
    back and forth. Linux admits this is happening more than other operating systems
    do, and is also happy to tell you what it’s doing in text format, which is what
    you see when you start your computer with the SimplyMEIPS CD and see text scrolling
    on the screen. Linux is methodically starting and'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# 1: What You Can Do with Linux


    testing each of your computer''s many functions and is reporting its actions to
    you instead of hiding them. Most of the time you can ignore this text and treat
    it as something cool that looks like it came from a "Matrix" movie, but if your
    modem or hard drive ever stops working correctly, watching that, "bootup" sequence
    can tell you what''s wrong without a lot of tedious diagnostic work.


    But most of the time we don''t need to worry about how our computers work internally.
    The programmers who developed the GNU, X Window, and KDE components of our Linux
    system have already done all the worrying for us. We''re here to use Linux for
    everyday computing tasks, not to become computer scientists.


    When you boot your computer with the SimplyMEPIS CD in the back of this book,
    you will immediately be able to


    +   1. View your favorite Web sites

    +   2. Read and write email

    +   3. Download music from the Internet

    +   4. Read online documents published in Adobe Acrobat format

    +   5. Write and print letters, memos, and other documents

    +   6. Create and print spreadsheets in either numerical or graphical formats

    +   7. Read and edit most documents created by Microsoft Office

    +   8. Create eye-grabbing slide presentations

    +   9. Do professional-level desktop publishing

    +   10. Upload and edit images from digital cameras and most scanners

    +   11. Draw pictures and save them in many graphics formats

    +   12. Create Web pages and upload them to a server

    +   13. Perform basic home and office bookkeeping tasks

    +   14. Chat online with AIM, Yahoo Messenger, Microsoft Messenger or IRC

    +   15. Play dozens of card, board, arcade, and educational games


    You can do all this while running SimplyMEPIS from your CD drive, without installation.
    After you install SimplyMEPIS on your hard drive—which only takes a few clicks—you
    will be able to do much more. And when you learn the basics of running Linux—which
    won''t take more than a few hours—you''ll learn to customize the behavior and
    appearance of your Linux desktop and every program you use so they''re the way
    you want them, not the'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# Point & Click Linux!


    way some programmer decided they should be. This flexibility is one of the greatest
    features of Linux, one you''ll learn to appreciate after a while even if you stick
    to default settings at first.


    Another advantage you have with Linux is that you can easily install new programs
    without worrying about spyware, adware or viruses. You can get over 1,000 MEPIS-certified
    programs directly from the MEPIS servers in return for a small annual subscription
    fee (or have them shipped to you on CD for a small additional charge). You''ll
    also get free support for all of them through the MEPIS online forums, even if
    you are not a paid subscriber. If you need specialized software that isn''t on
    the MEPIS servers, or you choose not to subscribe, you can download any of over
    10,000 free programs from the worldwide network of volunteer-maintained Debian
    Project servers. These programs aren''t guaranteed to work with MEPIS, but 90%
    of them will work just fine. It''s just as simple to uninstall a program in Linux
    as it is to install it, so if you try one and it doesn''t work out, it''s no big
    deal.


    ![](img/01efe5dd076565746bf3678068ba155c_19_0.png)


    # Running Windows Programs in Linux


    There are commercial programs you can buy that allow you to run Windows programs
    you already own. Although you are probably better off in the long run if you make
    use of “native” Linux programs for as many tasks as possible, you may have a few
    Windows programs you aren’t quite ready to give up. Toward the end of this book
