- pgno: 293
  md: '# Point & Click Linux!


    Your Guide to Trouble-Free Computing


    # Linux made easy... incredibly easy!


    Tired of Windows viruses, spyware, licensing hassles, and high costs? *Try Linux!*
    Not sure Linux is up to the job? *It is.* Not sure you can learn Linux? *You can.*
    Linux expert and Open Source Developers'' Network (OSDN) editor-in-chief, Robin
    “Roblimo” Miller, will teach you Linux the easy way: using the point-and-click
    skills you already have!


    With the bootable *SimplyMEPIS Linux* software included on CD, you’ll be running
    Linux in 5 minutes—no formatting, no partitioning, no technical hassles... *just
    insert the CD, reboot your computer, and you’re ready to go!!!*


    *You don’t need to be a computer expert!* With Roblimo’s step-by-step instructions
    and how-to videos, you’ll master everything from word processing to the Web and
    email, instant messaging to CD burning... *you name it.* Linux has never been
    this *easy*, this *productive*, or this much *fun!*


    +   - Navigate Linux visually, the easy way, with KDE

    +   - Get on the Web, send email, even build your own Web sites

    +   - Create Microsoft Office-compatible documents with OpenOffice.org

    +   - Instant-message and chat with all your friends—no matter what network they’re
    on

    +   - Import, edit, and manage your digital photos

    +   - Burn CDs and DVDs

    +   - Play the world’s best open source games

    +   - Download all the free software you’ll ever need

    +   - Coexist easily with Windows users


    # CD-ROM AND DVD-ROM INCLUDED


    +   - CD features *SimplyMEPIS Linux*: start running Linux in 5 minutes, and get
    all the software you need to be productive!

    +   - DVD features Roblimo explaining all you need to know in bite-sized video
    tutorials. All the Linux skills you really need are covered here... just watch,
    and *do!*


    **About the Author**

    ROBIN “ROBLIMO” MILLER is Editor in Chief for OSGC, which includes Linux.com,
    Slashdot.org, SourceForge.net, and other top technology Web sites. He’s written
    extensively about computers and the Internet for OSGC’s sites, as well as for
    *Time New Media, The Washington Post, The Baltimore Sun*, and many other sites
    and publications. One of the creators of modern interactive journalism, Miller
    has consulted on Internet business for many companies and entrepreneurs, and he
    is the author of *The Online Rules of Successful Companies* (FT Prentice Hall).'
  merge: -1
  img_proc: true
