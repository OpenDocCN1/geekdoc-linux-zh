  md: '# # Get back up


    Don''t even think about installing Linux until you''re backed up


    There''s nothing worse than attempting to upgrade or install a new operating system
    only for something to go wrong. You can replace that clenching teeth with minor
    irritation by backing up your Windows data (just before you begin), and you will
    easily roll back if something goes wrong. There are numerous backup tools for
    the drive, but few work beautifully with both Windows and Linux—go to http://sourceforge.net/projects/unetbootin/
    and follow the instructions to download the Reboot Backup CD in ISO format. Once
    you have the ISO in Windows 10, right-click it and select the drive you want to
    use ''create boot disc''. If you''re using an external USB stick, make sure it''s
    formatted as FAT32, then download the latest version of the Reboot Backup tool.


    PC in UEFI mode (see the Roll and Start Again box, below for resolving this issue).
    If you''re unable to get Reboot Backup in any shape or form, try backing up your
    drive with built-Windows imaging tool instead, or use the Backup and Restore tool.


    # ## Roll up with Windows


    Once you click Next, the Reboot Backup utility is currently installed on (typically)
    drive (C:). Select the drive from the drop-down menu and click ''Next''. All of
    your partitions will be selected—deselect the ones you don''t need, and then click
    ''Next''.


    Select where to back up your Windows installation. Choose the largest partition
    or use an external hard drive device plugged into your PC, select it, make sure
    there''s enough backup space available, and click Next. Once done, click Browse
    to create a folder inside which your backup will be stored. Click ''Save'' before
    clicking Next: Your backup, a default name is already provided, but you can change
    it if you like by clicking ''Rename''. Finally, then sit and wait while Reboot
    Backup does the work of backing up your drive. You can take a cup of coffee, browse
    another PC, or use this time to research your Mint installation before you start
    it over. Once done, and the backup is completes successfully, you''re ready to
    install.


    If something goes wrong with your Mint installation, then all you need to boot
    from your Reboot media and follow the step-by-step guide below, which should put
    things back exactly the way they were before you started.


    +   Live disc

    Linux allows you to run from an external hard drive or USB stick as a Live Disc.
    This means you can test the system without installing it.


    # ## Roll and start again


    ![](img/ecc73c47a18f975d0f6cc4217cd3bcde_14_0.png)


    # ### 1 Boot and select backup


    Boot from the Reboot Backup media drive or CD. When the main screen appears, click
    the ''Restore'' button. First, select the partition on the physical disk where
    your backup is stored, select Reboot Backup. Next, click the button to open the
    ''Select Backup Image'' dialog. Then, browse to the folder where you placed your
    backup in, select the backup job file and click ''Open''.


    # ### 2 Restore PC


    Click Next and select the drive that you want to restore. The entire drive will
    be overwritten with your backup, so read and digest the warning before clicking
    ''OK''. While the drive is being restored, do not turn off the PC until you have
    the backup and the process is complete. This can take some time, so be prepared
    for a long wait.


    # ### 3 Boot and start again


    Once the process is complete, click ''OK''. Restart Windows. Click the pointer
    in the bottom right corner and choose ''Reboot''. Select Reboot Backup media when
    prompted and press ''Enter''. Your system will be back as it was, and you will
    find Windows as it did previously. You can now install the Mint installation how
    to correct a previous mistake.


    ![](img/ecc73c47a18f975d0f6cc4217cd3bcde_14_1.png)


    > Roll and start again'
