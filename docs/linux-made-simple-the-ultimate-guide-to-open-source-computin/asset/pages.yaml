    multi-user systems like MUD contained their own instant messaging system. The
    first multi-user online chat was invented in 1980, Quantity (and very reflecting
    its place in time) they called CB Simulator - and if you''ve ever used a chat
    bot, we''re sure it grew the window of its own.


    More recently, ICQ (released in 1996) brought the concept of one-to-one or multi-user
    instant messaging to the attention of the public. It exploded in popularity, and
    was then followed by a host of other clients: AIM, Yahoo Messenger, MSN/Windows
    Messenger and on.


    Today instant messaging is ubiquitous and everywhere. There is an IM client in
    your email, your Facebook account, and your phone in the form of Google Hangouts,
    Skype or Apple Messenger. There are more services around now, but they''re all
    mostly incompatible with each other. If you want to connect with everyone, you''re
    going to have to be connecting to everyone or you''re going to support a whole
    host of different platforms. Good luck if you get a solution!


    # Talk is sweet


    First things: a bit of bad news. Apple''s Messenger is said, out of reach on Linux
    unless you interface with a jailbreak or use some rather roundabout methods. This
    is one of the cases where being convinced about IM systems is very hard.


    The good news is that you can connect to just any other platform online, without
    needing to install a special client. Messenger for Google+ has the chance of those
    messages you see on that or Google Hangouts has its own web, and so the fact that
    you''re using Linux doesn''t make this any different.


    It''s all a bit of a pain. When you have to keep a whole of browser windows open
    the that service serves you for a long time and you need to stay on instant messaging
    for no reason? You should not.


    You can also get instant messaging clients for Linux. A number of them are official.
    Skype, for example, is well-known and owned by Microsoft (the client existed before
    MS and purchase has been updated since Google). Google offers an extension for
    Chrome that makes Hangouts much more popular by showing pop-up notifications without
    having to keep a particular browser window open.


    There are also unofficial clients, and a stack of them are generally reasonably
    able to support many instant messaging protocols. There are a few of them! For
    Google Hangouts, itajak pulls from your phone. For WhatsApp, it''s a bit of a
    hack to use a client at https://github.com/WhatsApp-Desktop which may or may not
    do the trick: download the appropriate file for your system (32-bit or 64-bit)
    and install it your package. For Pidgin, use the desktop-unaffiliated Messenger
    for Desktop.org from the same developer as the WhatsApp client.


    # Good words


    As you''ve probably realised, we''re not faced at all of these ideal platforms
    clustering our methods of communication. But what about your mobile - where you
    might be at all different mobile operators need communication between each other?
