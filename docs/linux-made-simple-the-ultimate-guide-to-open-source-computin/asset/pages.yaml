    There are lots of things to consider when choosing your desktop. Each one has
    an obvious look; desktops, eg., are as configurable as Cinnamon, so it''s important
    to explore all the options when selecting a desktop that has the functionality
    and flexibility you


    # The anatomy of a desktop


    Your desktop is the virtual environment in which you work, and provides a user
    interface with which you operate your PC. It consists of a number of elements
    to produce the work environment you know and love - or hate to reach.


    The desktop contains icons, windows, folders, wallpapers, wallpapers and widgets.
    What you see is provided by the window manager. Its name implies it determines
    how the desktop''s windowing system works by taking responsibility for the appearance
    and behavior of its component parts, such as menu, bars and controls. The desktop''s
    graphical elements - themes, scrollbars, icons


    etc - are special in themselves. The widget toolkit, which is also provided by
    the desktop, can be customized with the desktop. Two most popular exist: GTK and
    VTE, where you can run plugins in one or on a desktop built using another; they
    don''t look the same.


    Many of these elements are stored in themes which makes it easy for users to change
    a desktop''s look and appearance by defining how key elements look in shape, colour
    and other elements.


    Desktop also has a ship with a number of tools and utilities, designed specifically
    to work well with that. Typical elements include a file manager, image viewer,
    text editor


    It doesn''t matter how sophisticated your DE is, as they share the same building
    blocks: toolbars, desktop, widget and windows etc.


