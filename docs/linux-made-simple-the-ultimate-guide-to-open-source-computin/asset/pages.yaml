    ![](img/ecc73c47a18f975d0f6cc4217cd3bcde_29_0.png)


    SUSE has always been on open source to enterprise users. It introduced the SUSE
    Linux Enterprise in 2001, and changed the name to SUSE Linux. After software and
    services company Novell acquired them in 2004, the promotional product was released
