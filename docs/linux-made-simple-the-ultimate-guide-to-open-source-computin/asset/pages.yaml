  md: '# # Ubuntu: Fix start-up issues


    It''s all gone wrong. Of course it has. Here''s how to resolve issues with non-booting
    PCs without having to reach the panic button (or a hammer).


    +   - If you''re struggling to get the Boot-Repair tool to boot, experiment with
    the various fail-safe options.


    # Boot-Repair-Disk


    ![](img/ecc73c47a18f975d0f6cc4217cd3bcde_113_0.png)


    ```

    ```

    acpioff

    noaptic

    nollapic

    edaddon

    noderaid

    nomodeset

    Free software only

    n```

    ```


    Boot Options seed=/ubuntu boot=casper inirroot=/casper/


    Start-up problems. That moment when - having expected to be getting with your
    work or effort - you find yourself staring at a critical error message, or even
    worse, a blank screen. No matter how many times you press reset, or restart, the
    same barrier blocks your path to what you can. What can you do?


    Start-up problems can come in all shapes and sizes and they can be difficult to
    track down. There are, however, sound principles that will resolve many errors,
    and in this tutorial we are going to look at the tools and techniques to troubleshoot
    most common issues. We will start by examining how the boot process works (see
    the boot process box), which reveals that the boot process can be split into three
    stages: MBR loader, pre-grub, and post-grub. This will allow you to focus your
    troubleshooting efforts based on where in the process the error or occurs.


    Let''s start at the beginning. You switch on PC.


    If power comes, but nothing else happens, chances are you have a hardware issue
    - so if you noticed around the inns of your PC, then check everything is connected.
    If not, unplug everything except your keyboard and mouse and try again. If this
    doesn''t work, the case carefully and disconnect your internal drives too. If
    the computer now boots to the splash screen, you can try recorrecting the internal
    drives and trying again: if you''re


    now able to boot to the login screen, shut your PC and reconnect all peripherals
    to see if the problem has cleared itself or if try a different drive, cable, or
    go online and Google for known boot problems involving that.


    If you''re, your motherboard will emit a series of flashing lights or beeps -
    without needing the help of the internet - to identify the problem. Try replacing
    a component or something more drastic.


