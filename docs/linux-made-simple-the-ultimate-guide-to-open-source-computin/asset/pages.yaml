  md: '# Install apps in Mint


    # How to find and add new repositories to your distro.


    Now that you''re up and running in Mint, you''ll be wanting to start making productive
    use of it. That naturally involves running applications you use in Windows and
    checking for each to see if a Linux version is available. If there isn''t, don''t
    panic — you''ll find the vast majority of Windows applications are free and open
    source, so you don''t need to splash them out of them, but do consider donating
    to them.


    The most obvious place to search is your office. When it comes to replacing your
    word processor, spreadsheet, and presentation tools, what you need is already
    built into Mint via the LibreOffice software, which can be found under Menu >
    Office.


    If you''re looking for a specific open source alternative to yours, check out
    Alternatives where you''ll find it at http://www.allsoft.com. If you can''t find
    anything suitable, try http://alternative.net/


    The simplest way to add software in Mint is through the Software Manager. It''s
    a user-friendly frontend for installing and updating programs. Programs are organised
    into repositories (or ppa) if they''re supported by the Software Manager. In the
    supported section you''ll find alternative ways of getting them. First, visit
    the program you need — here you may be offered a convenient downloadable installer
    in the form of a


    ![](img/ecc73c47a18f975d0f6cc4217cd3bcde_21_0.png)


    +   * Manage your repositories through the Software & Updates, which you''ll find


    Debb package — choose the 32-bit or 64-bit download (if needed) to match the architecture
    of Ubuntu. Once installed, navigate to your Downloads folder, double-click the
    package name to install it.


    Other programs may require you to install them via Terminal. This usually involves
    adding the program''s repo using the following:


    > The ppa: stands for Personal Package Archive, which is a special repository
    — supported by Ubuntu — that allows anyone, team or team, to enable others for
    installing and updating software without needing to be official.


    ```

    sudo add-apt-repository ppa:username/ppa-name

    sudo apt update

    sudo apt install package-name

    ```


    Replace <package> with the name of the program and it will be downloaded and installed.
    Once added, you can then install it from the Software Manager as if you''re already
    there.


    # You''ll find the vast majority of Windows applications have an equivalent version
    for Linux


    # Popular alternative applications


    | Windows app | Alternative | Where to get it |

    |---|---|---|

    | Word, PowerPoint, Access | LibreOffice | Pre-installed |

    | Publisher | Scribus | Software Manager (SM) |

    | Photoshop | GIMP | Pre-installed |

    | Windows Movie Maker | OpenShot | Software Manager |

    | Adobe Reader | Document Viewer | Pre-installed |

    | iTunes | AmAmarok | Software Manager |

    | Windows Media Player | VLC Media Player | Software Manager |

    | Internet Explorer | Firefox, Chromium | Pre-installed or SM |

    | Outlook/Windows Live Mail | Thunderbird, evolution | Pre-installed |

    | Skype | Pidgin | Software Manager |


    # Stay up to date


    Programs you install through repos — either via Terminal or Software Manager —
    are checked for updates on a regular basis, within 10 minutes of booting up and
    when you use them. That means you are usually up to date for the vast majority
    of apps, but you can check manually using one of two methods. The first is to
    use:


    Cinnamon Menu > Software Administration > Software Manager and click check updates
    manually. Preferences > Refresh tab to change the time between update checks (days,
    hours and minutes are supported).


    To check for updates via the Terminal, use **sudo apt update**. If you find that
    the Software Center isn''t as up to date as promised on the program''s website
    — by adding the repos, you can ensure the latest version of the program is installed,
    and gain access to beta and pre release releases.'
