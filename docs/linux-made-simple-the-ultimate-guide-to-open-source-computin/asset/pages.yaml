  md: '# # Hardward difficulties


    Solving problems with recalcitrant bits of kit.


    # ### Finding drivers


    Where do I get drivers for Hardware? The accompanying disc includes Windows drivers
    only.


    Most hardware does not separate drivers with Linux; the kernel recognizes drivers
    for a massive range of hardware. Nine times out it loads the appropriate driver
    without any input from you. Some devices use separate drivers, which cannot be
    used with the kernel. In such cases, like Knop or Resource CD, or extra drivers
    for an internal device, it will usually show up in the output of lsmod, and adding
    the -k option shows which is being used.


    Once you know, you can search for package that provide driver, either using your
    package manager or a web search. If it''s a standard package that''s not installed
    by default, as is the case with many wireless drivers, the package should be all
    you need to get the hardware


    working the process is similar with USB devices except you use the lsusb command,
    and there is no -k equivalent. On some systems, these can only be run as root.
    Without driver support in your kernel manager, you have to enter the waters of
    downloading and installing drivers directly from a manufacturer''s website.


    If they provide a deb or RPM package for installation, use that. Otherwise get
    the right driver for your architecture and follow the instructions carefully.
    Drivers must be linked to the kernel, so you will probably need to compile the
    kernel source and essentials packages.


    # ### Random characters


    My computer is suffering from random characters and locking - it doesn''t seem
    to be caused by any particular piece of software.


    This may be a hardware issue and there are plenty of common causes. Faulty memory
    can cause this because Linux uses all available memory. Testing from the terminal
    with sudo apt-get install might not help, as it does not run as root.


