  md: '# # Your questions about switching to Linux?


    Still worried about switching to Linux? Let us put your mind at rest.


    You''re now ready to take your first steps into the Linux universe with the Linux
    Mint distro, but before you get stuck, let us explode of the common myths and
    help you understand why switching is a great move.


    +   - Isn''t Linux just for geeks - isn''t it for anyone?

    Utter rubbish. These days, Linux and Mint are perfect for normal humans. It''s
    easy to get and started, as you''ve already found out the installation process
    is smooth, and it is used for a variety of professional and personal purposes.


    +   - Isn''t Linux all the command line?

    Most Linux distros ship with live builds so you can test the way that works for
    you. The underlying OS is still accessible via the command-line Terminal, which
    works in a similar way to the Windows Command Prompt.

    Take some time to learn some of these commands and you will find that the terminal
    is a fast and convenient way of getting stuff done. But Mint provides plenty of
    point-click tools, and in most cases you can avoid having to use the Terminal
    completely.


    +   - Aren''t there any decent programs on Linux?

    Many people native builds of favourite applications on their websites before doing
    anything. You''ll also find plenty of free-source applications to use in Linux.
    Mint is renowned for its free-source roots, but don''t worry, commercial software
    is also available. We will show you how to do this feature (see page 23).


    +   - Can I play games on Linux?

    Sure you can. With over 1,900 games available through the Software Manager. Select
    from the main screen. Look out for the free DOSBox


    ![](img/ecc73c47a18f975d0f6cc4217cd3bcde_18_0.png)


    +   - Setting up printers in Linux isn''t tricky - and you have access to all
    the tools you need in Mint.


    Emulator, which you can use to play your Windows games from the last millennium.
    Also check out Old Games (www.oldogames.com), which offers new titles and over
    1,300 DRM compatible with Linux. The Steam gaming (http://store.steamowered.com)
    is also great. In Linux you can find over 1,600 many-coloured titles to buy and
    download. In fact, Linux is a better platform for games than hundreds of titles.


    +   - Linux won''t support my hardware?

    In the majority of cases, you''ll find your PC components work fine with Mint,
    while most hardware manufacturers provide drivers for external hardware, from
    WiFi adapters to printers and scanners. Since, with CUPS, installing and managing
    drivers is relatively easy task.

    One area where Linux has really improved is graphics. Mint uses generic drivers
    during the installation process, but you can replace these with drivers from your
    card''s hardware manufacturer. Click Menu > Administration > Driver Manager to
    search for the open source driver if it''s supported, or if the manufacturer''s
    website to manually download it.


    +   - It''s free, so there''s no support?

    You take a trip to mint.com/links, and you''ll find documentation and a vibrant,
    active community support answers through forums and a chat room. Take the time
    to search on the internet, and you''ll find the majority of questions have already
    been answered.


    +   - Linux reliable or secure?

    Wrong - on both counts. Linux is less reliable than Windows or OS, and in fact
    is much more robust. It is far more secure than its rivals, and not just a matter
    of how it handles privileges. Linux open open nature makes it better scrutinized,
    while the diverse number of distro makes it less of a target for hackers.


    ![](img/ecc73c47a18f975d0f6cc4217cd3bcde_18_1.png)'
