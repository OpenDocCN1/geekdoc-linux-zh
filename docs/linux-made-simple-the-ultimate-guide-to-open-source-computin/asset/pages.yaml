  md: '# # Tar: Archiving your files


    Archiving contains many mysteries, such as zip and tarbars, but we are on hand
    to expand your knowledge of their uses.


    Most people reading this are probably familiar with creating, sending or receiving
    ZIP files. Zip takes a collection of files and stores them in a ZIP archive file,
    as well as the contents of the files. It stores metadata which is extra information
    associated with each object. In the case of files, it includes times, owners and
    permissions, and the name of each file. When you unzip an archive, all of this
    information is extracted, recreating the original files exactly as they were.


    Archiving has several uses, but the most popular use is binding a set of files
    down to a single file easier to handle and compression and creating backups. Since
    Zip has been around for years, Zip has a number of drawbacks. The main issue is
    that its compression is poor by modern standards. In 25 years, compression technology
    has moved on and there have been many alternatives. Another disadvantage of Zip
    is that it is intended for archiving a file, whereas many times we need to send
    the data to another device or service.


    The standard archive format for Unix-like systems is Tar, because Tar was originally
    used to store backups on tape drives (Tar Archive). It works in


    different way to Zip it sends all the archived data to its standard output and
    doesn''t compress the data by default. This is because tape drives already had
    hardware compression built in. A lack of compression may seem like an advantage,
    but it''s actually the converse. Tar is able to get its data into an archive that
    is much more complex. This allows us to use any compressor - even one that isn''t


    Tar programs work on a stream of data and produce one compressed file or stream,
    so that is archiving and compression. This also seems itself. Let''s say we have
    a directory called foo. We can use one of the following options:


    The c option tells the Tar program that we are creating an archive and the f tells
    it we are storing the archive using the given name. The first command creates
    an uncompressed archive called foo. The subsequent commands add an extra option
    to tell the Tar which particular type of compression to use: z uses gzip


    # ## Pipes and streams


    A core part of the philosophy of Unix-like systems is tofindall - each tool does
    one thing and does it well. This means that we need to pipes together to make
    more complex tasks, and the output of one program becomes the input of another.
    Standard error (referred to as stdin and stderr). Standard input is the input
    to the program from the keyboard when running a command from a terminal. Standard
    output is the output from the program to the terminal window.


    The pipe connects the standard output of one to the standard input of another.
    So Tar connects the contents of foo and sends it to stdout, which is the input
    of the next. Tar defaults to working on a file:


    This compresses a file to a file named foo.gz. If it isn''t a file, it compresses
    standard input and sends the result to the standard output.


    Standard error is not redirected by >. If something goes wrong, error messages
    printed to the terminal - if they were sent to the file, you wouldn''t know something
    was wrong.


    Running Tar with the t (test) option only checks that the archive is correct,
    but also shows you the full contents - all you might need to pipe it through a
    program such as less.


