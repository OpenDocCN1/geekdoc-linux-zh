    # Universally Unreadable IDs


    I find the use of UUID in /etc/fstab annoying.


    What''s wrong with the old method of using device nodes, /dev/sda, and how can
    I change them?


    The problem with device nodes is that they can change if you add or remove a device,
    including flash drives or change the BIOS order, sda could become sdb. UUIDs ensure
    that each drive is unique, it doesn''t matter if you move it to a different port
    or drive. And the problem is: UUIDs are good for users who need a simple, reliable
    identification, but they are not human-friendly. A compromise is to use labels.
    If your partition is on /dev/sda1, you could use


