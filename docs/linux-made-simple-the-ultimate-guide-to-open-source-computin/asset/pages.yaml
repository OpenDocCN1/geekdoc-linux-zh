  md: '# # Admin tools


    Take charge of your distro with these power apps.


    # ### Redo Backup


    We''ve mentioned Clonezilla earlier in the feature, but if all you need is a tool
    to swap an disk for a new one, then try Redo Backup. It is designed for inexperienced
    users and has the simplicity of interfaces. www.redobackup.org


    # ### Qemu


    It''s a feature-rich processor emulator and virtualiser. You can use it to create
    virtual machines and emulate various architectures right on your PC (with hardware
    virtualization extensions, you can also use QEMU with KVM to run at near-native
    speed. qemu.org


    # ### XAMPP


    The XAMPP stack gives you a sandbox to develop and test web applications with
    all the necessary components such as Apache, MySQL, PHP, and Perl as well as other
    libraries, modules and tools, such phpMyAdmin for managing the stack components.
    Once installed, you can manage the various services via a graphical control panel.
    www.apachefriends.org


    # ### Conky


    Conky is a nifty resource monitor for your PC that lets you keep an eye on your
    system. It can monitor and report on the status of various components. It is very
    versatile and can also display information from apps, such as weather updates.
    http://conky.conforge.org


    # ### Turnkey Linux


    The Turnkey project provides applications which you can use to deploy a new server
    in seconds. Turnkey is a self-contained system that comes in all ready. It runs
    on top of any Open Source Linux System (OS) components you need for particular
    apps. All the applications are pre-configured but are available in several formats
    depending on the hardware that you want to deploy it. Once it''s up and running
    you can manage everything using a browser-based interface. www.turnkeylinux.org


    # ### Déjà Dup


    The app GUI stands apart from the other backup apps you''ll find, and it lets
    you backup your files automatically. Dejà Dup is based on Duplicity and provides
    the right just of features for beginners who aren''t used to the ways of backup.
    http://live.home.org/DejaDup


    # ### Mondo Rescue


    Mondo is a unique backup tool that creates backups customized for your system.
    It is drive independent and works with a wide range of file systems and can use
    a variety of media as backups. www.mondorescu.org


    ![](img/ecc73c47a18f975d0f6cc4217cd3bcde_40_0.png)


    # ### Open Media Vault


    When you need to protect your data and deploy a NAS server, the Open Media Vault
    project is a Debian-based server that offers the power of commercial solutions
    in a web-based setup and management. www.openmediavault.org


    # ### Zentyal


    The Zentyal distro has the components you need to run a network gateway. The service
    provides tools for controlling the components of the system with a host of control
    management tools and helps you configure the server without messing around config
    files. www.zentyal.org


    ![](img/ecc73c47a18f975d0f6cc4217cd3bcde_40_1.png)


    ![](img/ecc73c47a18f975d0f6cc4217cd3bcde_40_2.png)


    # ### Mutt


    Mutt is to email what Links2 is to the web browser. It''s a text-based mail client
    that is highly configurable, supports POP and IMAP protocols and has all the usual
    features you''d want from an email client. www.mutt.org


    # ### Profanity


    Profanity is a console-based client for the XMPP protocol that supports multiple
    user chats and OTR message encryption. www.profanity.im


    # ### Canto


    Want to do more from the command-line? The Canto RSS client supports RSS, imports
    and exports feeds in OPML format. It has lots of customization and can work with
    various feeds. http://bit.ly/CantoRSS


    # ### mppeg23


    This is an MP3 audio player for the command-line that supports good decoding quality
    and handles virtually any type of media file such as changing bitrate, extract
    audio, stream streams, and much more.


    # ### FFmpeg


    One of the most versatile media conversion utilities, FFmpeg can manipulate virtually
    any type of media file such as changing bitrate, extract audio, stream streams,
    and much more.


