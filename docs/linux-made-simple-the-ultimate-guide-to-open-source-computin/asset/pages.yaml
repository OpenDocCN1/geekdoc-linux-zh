  md: '# # Kodi: Media made easy


    **Kodi – formerly known as XBMC – is an awesome way to bring light into your living
    room.**


    There are plenty of media players for Linux, capable of organising and accessing
    your digital media library whether on your hard drive or around the house. Kodi
    is an application that puts digital media into a window making Kodi (and formerly
    known as Xbox Media Center) a ''100 foot interface'' for viewing with a remote
    on large TV. It is cross-platform, originally developed for the Xbox (and formerly
    known as XBMC). Kodi is also brilliant. It can be used to play DVDs, Blu-ray discs
    and more. It also works with digital TV recordings from any one of the many TV
    channels available around the world – including high profile sports events – online
    archives of football.


    > > **Quick tip** If you use OSMC, it can also be used as a hotspot for other
    devices or network. Unless you can turn a wired connection into it or hotspot
    of Kodi, you can extend the connection through an ethernet port to a device that
    has wireless built-in.


    To get back to the desktop, simply click the power button and select Exit. To
    run Kodi in window, go to System > Settings and click the Video Output tab. From
    here, you can change the Display Mode to Wounded or full screen.


    You can also see from above that Kodi''s weakness is that some of the menus are
    a little complicated. It is highly custom: you can change many of the settings
    and the kind of hardware acceleration you prefer in the menus, so be careful not
    to change anything you don''t fully understand.


    It also works with DVB-T cards so you can link your TV or PC to a DVR system for
    recording and watching shows for playback.


    Because Kodi is intended for use on a dedicated media center machine, it works
    best on lightweight operating systems (usually on Ubuntu) which come with Kodi
    and might have most desktop apps removed for stability.


    There are images of Kodi operating systems for non-PC platforms, like the Raspberry
    Pi (which is OSMC) and Android. The Android app is the easiest way for dedicated
    devices like Amazon Fire TV, which you can plug into an HDMI port on.


    # ## Getting Kodi


    Kodi isn''t in the standard Ubuntu repositories. To install it on your current
    machine, you''ll need to open up and add a repository. Press `Ctrl+Alt+T` to open
    a terminal and:


    ```

    sudo apt-add-repository ppa:kodi/ppa

    sudo apt-get-update install kodi

    ```


