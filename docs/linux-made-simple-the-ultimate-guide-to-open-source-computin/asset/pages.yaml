    select what you like, then hit Apply to your cursor or use the preset formatted
    lists to create consistent lists, drag boxes and much more. For a more visual
    view of doing this, manually move text on the page just like you drag it; however,
    hover over your inverted style box and select ‘Update to selection’.


    # ## Finishing touches


    Our newsletter needs a header, so go to Insert > Header and select Default Style.
    This style spans your pages and automatically scales our separator line to fit.
    Click your mouse in the header area to move the cursor there and type whatever
    text you want to put. If you''d like to add an auto-incrementing number, put your
    text cursor where you''d like it to be and go to Insert > Field > Page Number.


    # ## Getting around Writer


