    In 1992, Roland Dyer, Burch Steinhard, Hubert Mantel and Thomas Fehr founded YaST
    (Software and Systems Development). The company started out as a service providing
    the founders to have a distributor of their own that would cater to the enterprise
    user. The distributor was named MUSE after the acronym of their company, and it
    was a Slackware release that was translated into German and developed in collaboration
    with Slack Patrick Volking.


    For building your own distribution of Linux, SUSE used the first Jun distribution,
    created by Foran Fuchs, who subsequently joined the team and began to develop
    YaST, the configuration tool. The first YaST was released in May 1996 (first revised
    in 1997) and was included for kernel 6.3 as an installer.


    Over time, SUSE incorporated many aspects of Red Hat Linux, as well as respected
    RPM package management. In 1996, the first distribution under the name SUSE was
    published as SUSE Linux. The confusing jam in version numbers was an initial reference
    and homage to the future and eternity, as featured in Douglas Adams'' Hitchiker''s
    Guide to the Galaxy: YaST''s first version number, 0.42, was quite by the same
