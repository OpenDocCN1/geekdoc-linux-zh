    hard disk and click Next. You''ll need to set its size, click the lower button
    to choose a different location from the default, and the type of virtual file
    you will need for be. For letters, select the one that fits your needs click ''Create''
    and your virtual machine is ready and waiting for action.


    # # Virtual hardware configuring


    It''s time to configure your VM by using the settings in place, and while the
    basic settings are arranged, you should take some time to ensure it has all the
    power and resources it needs to function as you want it to. You can always change
    these settings later, but the best time is to set them up right away.


    Select your new VM and click the ''Settings'' button. Switch to the Memory tab,
    where you''ll find three tabs: Motherboard, Processor and Acceleration. You can
    also allocate more memory from the Processor tab, as well as enable the passthrough
    switch, unless you need PCI support to support the PIX sets which must be set
    in place.


    The default value is set to 512MB by default, but you might need more depending
    on what you plan to do with it.


    The Extended Features should already be set up to the OS you choose, but if you''d
    like to use more features you need to install the latest Guest Additions. Here,
    note that this only works for Linux and Windows OS; guests are (yet) supported.


    If you have a multi-CPU CPU installed, you can allocate more cores to your VM,
    making sure you don''t over-allocate more than your processor physically possesses
    (Hypertithreading might be discounted). You might also need to click ''Enable
    PAV/NX'' if your virtual machine needs more than 4GB of RAM on a host PC with
    an older 32-bit processor.


    The Acceleration allows you to tap into the processor''s virtualisation features
    if they exist—see tip for details.


    # # Other key settings


    Switch to the Display tab to configure your virtual graphics card. By start, check
    ''Enable 3D Acceleration'' to improve performance across all of your VMs. If you''re
    running a Windows virtual machine, then the 2D option should. Switch to the Remote
    Desktop tab if you need to access your VM remotely. If it needs to record your
    VM screen as a video you might want to do so – the record feature requires the
    VirtualBox Extension Pack, which we''ll talk about later.


    In the Storage tab where you can configure the storage of your virtual hard drive
    by adding it to the SATA controller, from where you can add more drives. If you
    see a single DVD drive is added to the IDE controller, you can click the little
    icon next to the Optical drive to select a physical drive or mount an ISO disk
    image as a virtual hard drive. Click the ''Passthrough'' if you''d like to write
    to disks, but is only for encrypted virtual disks.


    The options in the Serial and Ports tabs are largely self-explanatory, but you
    can join to your guest VM


    ![](img/ecc73c47a18f975d0f6cc4217cd3bcde_106_0.png)


    > Make use of the VirtualBox Manager Group feature to organize your VMs into categories;
    right-click the first one in the ''Group'' to create them, then move them directly
    from the group or add them to the group


