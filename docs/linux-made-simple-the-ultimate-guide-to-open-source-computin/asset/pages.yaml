  md: '# # Terminal: Apt-get in action


    New to Linux? Then allow us guide you through your first steps with apt-get, the
    powerful command line tool.


    One of the biggest changes that catches Windows users moving to Linux is the way
    that software is installed. Instead of downloading an executable file, running
    it and it doesn''t clobber your existing library files (DLLs) or install multiple
    duplicate repositories of software, which are all set up for that distro and for
    compatibility with the rest of the distro.


    In this tutorial, we will look at how this is done by distros that use the Advanced
    Package Tool (apt) software management system as developed by Debian and used
    by distros from Ubuntu to Raspberry Pi.


    # Repositories


    A repository is a collection of packages for a distribution. Each major distro
    has its own repositories, and the packages will be built for and tested with that
    release, but there is more than one copy (as they are usually called), making
    it easy to find what you want. It can also be checked for updates by your package
    manager without needing to visit websites to check for updates, or the need to
    go online to check.


    More importantly, each package in a repo is signed with the repository''s GPG
    (encryption) key, which is checked when installing packages. You can trust the


    installed from there to be what it says, and not infected from that''s been uploaded
    maliciously.


    A repository makes dependency handling simple. A dependency is a program that
    you want to install in the package and package everything everything with multiple
    copies of the same library (where necessary), a package lists its dependencies
    so that your package manager can check and then install them from the repo.


    In the default repositories provided by the distro, there are several third-party
    that can be added to your package manager. They are not guaranteed to be the best,
    but there are many that are very good, and if you stick repos for your distro,
    you won''t go too far.


    Ubuntu also has the collection of the PPA Archive, which contains many repositories
    for individual projects. These may also be added to your package manager, but
    be careful about adding any unwanted sources.


    # Package management


    We used the term apt-get a few times now but what is it? Basically it is a program
    that enables you


    ![](img/ecc73c47a18f975d0f6cc4217cd3bcde_139_0.png)


    ```

    sudo apt-get update

    sudo apt-get install package-name

    # Replace the package name here

    $ sudo apt-get install vlc

    ```


    +   - **Install** Using apt-get install will fetch the dependencies of the packages
    you want and any that are needed. --dry-run apt-get install will enable you to
    see what would be installed without actually installing anything to what you have.
    Run the command again without --dry-run.


    +   - **Search** Use apt-get search to find what''s available. The -names only
    option can give you a more manageable set of results if you know the program name.
    Use apt-get search to see the results in list. You don''t need to use sudo as
    search doesn''t write to your.


    +   - **Update** Run apt-get update to update all the package lists, by apt-get
    upgrade to update all the latest software to the latest versions. If it''s over
    cells, then apt will tell you what will be upgraded, and how much need to be downloaded,
    before asking whether you wanted to proceed.'
