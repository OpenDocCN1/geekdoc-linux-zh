    of Linux''s great strength is its versatility, and unlike other systems that allow
    customise extend your desktop environment (DE). Each distribution of Linux ships
    with its own DE: point-and-click WIMP (Windows, Menus, Pointer) and they share
    superficial similarities - specifically the interface - but may have radical differences
    in functionality as well as look and feel.


    The good news is that you''re not locked into your desktop of choice. Whether
    you''re planning to switch to a different DE or you''re looking for a way to interact
    with your desktop, Linux can accommodate you. In fact, you can run multiple desktops
    side-by-side, allowing you to compare and contrast them.


    Desktops are described as software packages, containing all the disparate elements
    required to make desktop function (see the Anatomy of a Desktop, below). Once
