    in the fields, started using software like Mailbox and Snowfox to leave messages
    for each other. The symbol was introduced to computing during the development
    of Arpanet in the early 70s. By 1975 the US was a military was, and by 1978 all
    traffic was email. We today even reasonably give credit to email for inspiring
    the earliest development of the internet: it was so useful that people couldn''t
