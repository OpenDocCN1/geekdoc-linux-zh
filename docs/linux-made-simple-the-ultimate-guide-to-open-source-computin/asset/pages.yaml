  md: '# # GParted: Set your partitions


    Divide up your hard drive using partitioning to protect your data and make Linux
    easier to work with.


    ![](img/ecc73c47a18f975d0f6cc4217cd3bcde_91_0.png)


    network, or setting independent partitions for temporary files, your swap file
    or to run specific services as a web server. Whatever your needs, partitioning
    can be a crucial step in improving performance as well as protecting parts of
    your drive from each other.


    # ## Partition types


    Hard drives are partitioned according to scheme. There are two types of schemes:
    the Master Boot Record (MBR), which is limited to the first 2TB of a hard disk,
    and the newer GUID Partition Table (GPT). In both cases, partition information
    is stored at one end of the drive in a partition table — GPT also stores this
    information at the other end of the drive in the sector for redundancy purpose.


    One of the limitations of the MBR scheme is that it only supports a maximum of
    four partitions, although one of these can contain multiple logical volumes. This
    doesn''t differentiate between primary and (logical) partitions and supports up
    to 128 partitions per drive.


    GPT is designed in conjunction with modern UEFI, but in some cases it is compatible
    with legacy BIOS systems. You should use GPT when your drive is over 2TB in size,
    but ultimately it''s best to stick with whatever your system requires, and if
    you''re planning to wipe the drive clean and install Linux from scratch, let yours
    decide which scheme is based on your current setup and maybe what you have set
    with this setup post install.


    Partitioning allows you to carve up a single physical hard drive into multiple
    virtual drives known as partitions. Each volume acts independently of the others,
    providing a measure of redundancy for data across the drive. If one drive failure
    develops then you can restore it without affecting what was stored elsewhere.


    This redundancy provides many reasons to partition your drive: also to protect
    your personal data (your home volume), so it''s protected from any other system.
    You can use Linux installations as a sandbox, rolling back unwanted changes without
    touching your data.


    Another popular use for partitions is to run multiple operating systems on a single
    PC. You could run two Linux distros, or Linux and Windows machine for compatibility,
    purposes. This is possible because each partition can be formatted using a different
    file system, or ext4 for Linux, or NTFS for Windows. You can also use a data partition
    to store the latest versions of your OS and other files, whichever OS you happen
    to be running.


    It''s also possible to use partitions for other purposes, such as creating a dedicated
    partition for sharing over your


    +   Quick tip

    If you plan to share a partition with Windows it will need to be set up as NTFS
    or Windows FAT. If you want to verify the Linux-ext3 file system is installed


    ![](img/ecc73c47a18f975d0f6cc4217cd3bcde_91_1.png)


    > > The disks utility provides a summary of how your partitions are set up.'
