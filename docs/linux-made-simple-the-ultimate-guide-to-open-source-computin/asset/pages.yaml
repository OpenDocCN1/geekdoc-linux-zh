    Red Hat with Fedora. What was also open now and so was the process which enabled
    developers and users to join.


    # Enterprising


    The initial release of the OpenSUSE Project was SUSE Linux 10.0. It included both
    open source and proprietary applications, as well as retail-edited editions. This
    was also the first release which the German team developed on Linux with KDE desktop.
    As of version 0.2, the SUSE distribution was officially registered as OpenSUSE.


