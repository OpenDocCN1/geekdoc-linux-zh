  md: '# # Genus Red Hat


    Millinary on a massive scale.


    A distribution that has played a crucial role in shaping Linux''s DNA is Red Hat
    Linux, created in 1994 by Marc Ebob. Bob Young and ACC Corporation bought the
    business and created Red Hat. The company went public in 1999 and achieved the
    best-first-day in the history of Wall Street. It rode on the success to become
    the first open source billion-dollar company.


    After years, some of the biggest and brightest Linux developers worked with Red
    Hat. Soon after it, it acquired Michael Tiemann''s Cygn Solutions which brought
    the GNU-C++ Compiler and the GNU Debugger along.


    One of Red Hat''s most influential pieces of technology is its RPM packaging format.
    The file format is now the baseline format of the Linux Standard Base (LSB), which
    defines the hierarchy used in the Linux operating system for architecture. The
    LSB is a project started by Red Hat and also one of the first to support Executable
    and Linkable Format (ELF). The ELF format is the standard for executables, shared
    libraries and other files. Red Hat was the first to attempt support ELF in GNOME
    and kde with the Bluecurve theme - which caused tension with the kde developers.
    The distro has won for its easily navigable graphical Anaconda installer.


    ![](img/ecc73c47a18f975d0f6cc4217cd3bcde_26_0.png)


    When Red Hat was discontinued, the company handed over the redistribution of the
    distro to the community. The new project became Fedora (see p30), which took over
    the direction of the project and does so in order to use Fedora for all technologies
    that RH uses.


    Since the GPL permits, Red Hat retained trademark rules to govern the redistribution.
    This has led to third-party distros that are built and redistributed after stripping
    away non-free components like Red Hat''s distros. Distros as CentOS, Scientific
    Linux and Oracle Linux 100% mimic RHEL.


    +   - Red Hat has served as the starting for several other distros, such as Linux.


    # ## After death


    Initially, Red Hat was offered as a free distro and the company sustained itself
    by selling packages. However, Red Hat focused on the Red Hat Enterprise (RHEL)
    and now focuses on RHEL for enterprise environments. RHEL supports server architectures
    like x86, x86_64, PowerPC and IBM System z. The frequency of new RHEL releases
    is 13 years, during the time the users get technical support, software updates
    and drivers for new hardware. Red Hat has also been a very popular naming and
    certification program called RHCP that covers annual Red Hat.


    # ## Some of the biggest and brightest distros have worked with Red Hat.


    Red Hat has pioneered one free business model, successfully mixing open source
    code and community development with quality assurance, and a subscription-based
    support system. The company also has employees working for free and on open projects,
    such as Raion, Nautilus and CentOS.


    # CentOS


    The CentOS distro is the primary-community enterprise distro based on Red Hat
    Enterprise (RHEL). The distro is built using the open source RPMs from the RHEL
    distro. CentOS is one of the most popular server distros, suitable for all kind
    of uses, from web servers to enterprise desktops,


    ideal for those who own their own server but can''t put together the RHEL subscription
    fees. CentOS ships with RHEL - Anaconda installer and can run without any issues
    multiple times thanks to Kickstarter. The installer provides various installation
    targets such as a web server, database server etc.


    In 2024, Red Hat announced that it would start to sponsor a bunch of core CentOS
    developers to work on the distro-free. However, the developers and Red Hat have
    both remain independent of RHEL. The sponsorship ensures that all updates are
    provided within 24 to 48 hours of upstream releases in RHEL.


