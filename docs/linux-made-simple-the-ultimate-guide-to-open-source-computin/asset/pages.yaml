    Text styles, accessible through this menu, are vital if you want to create documents
    without a lot of fiddling.


    # ### Look sharp


    Bold text, underlining and strikethrough probably don''t want a text style of
    their own, so just highlight the text to change and hit these buttons below.


    # ### Frame up


    Text frames can allow you to place items (including images) that would otherwise
    get pushed around by page margins or columns.


    # ### How are you doing?


    This quick counter keeps track of the words and characters you''ve written - if
    you''re writing to a limit, it''s essential.


    # ### Quick correct


    Spelling and grammar errors are highlighted by a jagged underline, just as they
    are in Microsoft Word. Hit [F7] for a word spellcheck, or [Shift][F7] to turn
