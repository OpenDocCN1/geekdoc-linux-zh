  md: '# Drives: Access flash and optical media


    Your install is not an island. Here is how to access flash storage and optical
    media using Ubuntu''s built-in tools.


    Linux handles drives differently than Windows, so if you''ve migrated from Windows
    to PC, you might find yourself unfamiliar with how to access drives. But once
    you get used to it—the transition isn''t hard at all—learn more about removable
    media, including USB flash storage as well as CD and DVD.


    # Working with USB drives


    Ubuntu is more than happy to work with USB storage of any nature—drives are treated
    equally and accessible, so long as it is formatted correctly Just plug it in,
    and the drive will be automatically formatted file system. Ubuntu ships with support
    for FAT32 and NTFS file systems. To use an already formatted file system, you
    can read and write to the drive like any other.


    Large drives—typically 64GB or greater—are often formatted in the exFAT format.
    For exFAT isn''t included in Ubuntu, but you can easily add read/write support
    by opening the Software Centre and searching for ''exfat-utils'' then install
    by=''exfat-utils''.


    If you''re running Ubuntu 64-bit, or choose the i386 labeled versions if you''re
    running the 32-bit version. If you don''t know which version is running go to
    System Settings and examine the OS type entry to find out. Once installed, full
    read/write support to any exFAT drive will be enabled.


    USB drives are registered in the same way as hard drives—open Disks to confirm
    the individual label for your drive. To see where it is mounted, look for /dev/sdb1
    or /dev/sdc1, depending on how many other drives are connected. They aren''t constant;
    a first-served, first-based system means that unlike the drive you''ve first attached
    other, its drive label will change.


    Always verify in Disks before performing any task that you need to identify its
    address or its identifier. Once opened in the Nautilus file manager—your mount
    point can be found at /media/<username>/<volum> where <volum> is the name you
    gave it when created. The drive will stay there.


    When you''re finished with the drive and want to remove it, click the button next
    to it to unmount it safely. If you need to remove a drive from the Terminal, use
    the command `umount`. The command is usually followed by the device name. When
    removing removable media, including the -l flag ensures all volumes for a partition
    are unmounted before the drive is safely removed. Point it towards a specific
    volume or its mounting using the following command: umount -a /dev/sdb1


    # Read-only media


    Sometimes you might need to access a USB drive in read-only mode, so data cannot
    be accidentally written to the drive. By default, Ubuntu will mount any supported
    file system in read/write mode. This is the trick to use the mount command with
    a special flag (-r) to mount the selected volume, then


