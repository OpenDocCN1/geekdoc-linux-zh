  md: '# # The marsupials


    Evolutionary masterpieces and mavericks.


    # ## Gentoo Linux


    The goal of the Gentoo project was to create a distribution without pre-compiled
    binaries that was tuned to the hardware it was installed. Unlike a binary distribution,
    the source code is compiled locally according to the user''s preferences and is
    often optimized. It was initially called Enoch but Gentoo 1.0 was released in
    2002.


    Gentoo has the distinction of being one of the most customizable distributions
    and appeals to users who want full control of the software that is installed and
    running on their computer. Gentoo users get to create their system from the ground
    up; the distro encourages users to build a Linux kernel tailored to their particular
    hardware. Fine control of switches is what Gentoo offers. Memory can be reduced,
    compared to others, by omitting unnecessary kernel features and services.


    One of its most notable features is its package management system called Portage.
    If you''ve never used it before, there''s a learning curve to use Gentoo. Derivatives
    like Funoo can be a good starting point if you''re not ready to dive into it.


    ![](img/ecc73c47a18f975d0f6cc4217cd3bcde_31_0.png)


    # ## Arch Linux


    Arch Linux wanted to create a distribution that was inspired by the simplicity
    of Slack, Slackware and BSD and thus created Arch Linux in 2002. Arch aims to
    provide a lightweight foundation on which the user can build to their needs.


    In Linux''s words: ''Arch is what you make it. Bit like reality''


    ![](img/ecc73c47a18f975d0f6cc4217cd3bcde_31_1.png)


    The most impressive feature of Arch is the latest packages.


    Arch Linux is ridiculously customised, offering all the Pacman package management
    tool. Arch is a rolling release that can be brought up to date with a single command.
    Installing Arch is an involved process and although it is well-documented, it''s
    better suited for experienced Linux users. ManageLinux is a derivative and is
    more user-friendly and has a graphical interface.


    # ## Tiny Core Linux


    If you can''t spend time in creating an Arch or Gentoo installation, check out
    Tiny Core. It installs the bare minimum software you need to boot into a minimal
    environment. From this point on, you complete control and can install apps from
    online or compile manually.


    The distro is also 12MB and bundles only a terminal, a text editor and an app
    launcher on top of the lightweight FLWM window manager. It has a control panel
    to manage services and configure, but everything else needs to be pulled in from
    its manager, including if you want Tiny Core on your desktop. The distro also
    has drivers for wireless cards, a remastering tool and internationalisation support.


    > > Tiny Core is an iskle distro at 12MB. Ah, we sweat!


    # ## Puppy Linux


    One of all finest releases, Puppy Linux had its initial release in 2003 and the
    first one in 2005. The distro is built from the ground up and its initial goal
    was to support


    ![](img/ecc73c47a18f975d0f6cc4217cd3bcde_31_2.png)


    # ## Linux From Scratch


    Rather than using a distribution, LFS - Linux From Scratch - a a available set
    of instructions to create your own custom distro from scratch entirely from source.
    The project was started in 1999 by William who wanted to learn how a Linux distro
    works behind the scenes. While building his system from scratch, Beemans followed
    the steps and released it as a HOWTO (pictured: right)


    that there would be probably other people who were interested. LFS goes quite
    a bit out its humble start, transforming from a simple HOWTO to a multi-volume
    book. It also has spanned various subprojects like Beyond Linux which flashes
    the basic system, and ALFS or Automated LFS is designed to help automate the process
    of creating an LFS system.


