  md: '# # LibreOffice Writer: Create awesome docs


    LibreOffice is a full-featured office suite that''s free of charge. Let''s see
    how Writer, its word processor, handles something complex.


    Linux can do... just as anything. Not as catchy as the classic song, we''ll admit,
    but it''s as beautiful as the Windows system, with some software which can perform
    every desktop task with absolute ability.


    Although Microsoft has changed Word''s interface – for worse, some say – in recent
    years, Writer''s layout should be instantly familiar to anyone who used Word before
    the early ''90s. There''s a big white empty page. A few bars at the top of the
    screen offer quick access to text and document settings. There''s a bar at the
    bottom of the window with a word count, character count, page count – and a zoom
    slider. And there''s plenty menu to work with.


    Our recommendation is to use LibreOffice: a cross-platform collection of productivity
    applications which have appeared in many forms and many names since 1999. Despite
    being free of charge, it''s still the most actively-developed office package out
    there.


    The act of typing is a little beyond the scope of this tutorial – we''ll assume
    you can manage that – so let''s create a little something to test Writer''s features.


    # ## The Write Stuff


    LibreOffice 5 should contain everything you need to run Writer and going to learn
    about LibreOffice. If it''s not installed, open up your package manager and install
    it from there. You may have the option between LibreOffice Fresh (the fresh-edge
    release) or LibreOffice Still (the stable, enterprise-ready version). When you
    choose either it is up to nothing that we cover here need for release. When it''s
    all installed, run LibreOffice Writer.


    +   **Quick tip**nWriter can pull content from your spreadsheets. Just copy the
    cells you want to import, then use the Paste function in Writer to bring them
    in.


    ![](img/ecc73c47a18f975d0f6cc4217cd3bcde_47_0.png)


    # ## Layout: the facts


    Let''s split our page into columns, into which we can type. Use the menu bar at
    the top of the screen, click Format -> Columns to bring up the columns dialog,
    change the number of columns to two or three by typing in the number box, clicking
    the width of each column, or clicking the box on the right of each column to add
    column spacing. This will likely likely to be greater than 0.5cm. If you prefer
    the text in columns to merge into one column.


    Now let''s add a line to break the columns. Set the style, the height to 90%,
    the color to light grey and the width as you like. You can adjust your units of
    measurement in this box, although it''s limited to a maximum width of 10pt. Because
    we changed the line, we can also change the line''s positioned boxes. Click OK
    to return to your document, and your changes have been made.


    So it''s time to type a little something, but that would be too much hard work
    for now. We''re going to go filling our document with dummy text using Writer''s
    Auto Text feature, which we can also use quick templates for CVs, covering letters
    and the like. Go to Edit -> Autotext, expand the Standard category, then click
    to add your name of filler text into your columns.


    > The columns dialog box has a huge number of options in it, if you wish, columns
    of different sizes on a single page.'
