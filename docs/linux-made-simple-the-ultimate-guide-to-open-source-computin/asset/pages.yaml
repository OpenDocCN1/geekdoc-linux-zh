    # Go slow


    My computer seems to be running with one of its CPUs tied behind its back. What
    is going on?

    The It is likely that a process is hogging a lot of your resources, and the program
    to investigate this is called top. Run it in a terminal and it will show you a
    summary of overall system usage and list of processes per CPU. The third line
    will show you the overall usage, which will be something like this (on a lightly
    loaded system):


    %Cpu:0.7, 0.2, 0.5; avg:0.0, 0.1, 0.0; bi:0.0, 0.0


    The first three rows show how much CPU capacity is being used, for user and system
    tasks. A task is running when one processor is not idle; so the CPUs total load
    is the load average. The load average is the average amount of time that a process
    spent waiting to run. If this is close to zero, you know why your computer is
    running slowly - look at the list of tasks to see what is eating the most CPU.
    If it is high, it means you are over-subscribed. top shows an overall usage and
    separate figures for each core. That (wait) value also shows it: how much the
    CPU is waiting for I/O or cache miss on disk index. A high ''wait'' value may
    indicate a disk problem - either read errors or a fully filled partition that
    has become fragmented.


    If memory is low, swap is full and you will have to use less performance. The
    list is ordered by CPU, but you can press P to move up or down. Move the cursor
    over the field you want to sort and press S to sort by that field but the window
    expands. Press F for a list of more than ten items. If memory is low, this will
    help you find the process causing it.


