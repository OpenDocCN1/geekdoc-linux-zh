    shared between drives, which is one reason why switching from one desktop environment
    to another can be faster than running a system, especially with limited memory.


    # Moving home


    I have heard that it''s better to have home directory on a separate partition.
    Why and how to do it?


    It''s not normally ideal to have a directory that has its own filesystem but home
    in which it resides. There are many reasons for doing this, such as simplifying
    backup procedures. The main reason is to keep your personal data and that of other
    users, separating from the system. You can upgrade or replace your OS and still
    keep all your personal settings and data.


    If you want to do it with a resize and a hard drive, make sure the drive is formatted
    with a Linux filesystem with all the information saved with your files, then use
    rsync to copy everything.


    ```

    sudo rsync -a /home /media/external

    ```


    This assumes your drive is mounted at /media/external. There are other tools you
    can use for the copy, but rsync has the advantage that it can copy interrupted
    files. If the copy is interrupted, you can resume it from where it left off by
    just running the process again from a CD and repeating the process.


    A CD is needed for the next stage, where you need to change the contents of /home
    and resize /root the partition. The current size is about 2GB, but it could make
    around 50% larger than the size currently used.


    Create a new partition for the root and format it, using ext4 if you have a reason
    to do so. Load /etc/fstab from the root partition into an editor and add an extra
    line:


    # Free memory is memory that''s going nothing when it could be helping performance.


    Change the specification in /etc/fstab to ''UUID=youruuidhere-LABEL-root''.


    Unlike many options on the root filesystem, this is safe to keep running the system.
    It will work even when you reboot, or if you have more devices than generic label
    generic:


