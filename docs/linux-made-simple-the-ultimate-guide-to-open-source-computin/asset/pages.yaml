  md: '# # Take a snapshot


    Your VM is now set up and ready for action. It should work exactly the same as
    any physical machine, but it has one crucial advantage: snapshots. You can take
    backups of your guest at a specific point in time. You can then proceed to go
    back to the knowledge you can undo if you''ve made mistakes.


    You can create snapshots while your machine is powered on or off—just select Machine
    -> Take Snapshot. Give it an identifiable name, and a description if you want,
    then click OK.

    When you take a snapshot, VirtualBox starts recording changes to the drive file.
    If you delete it, changes are merged back into the main file, or if you roll back
    to an earlier snapshot (the base image), any changes made since are lost. VMSnap
    supports multiple snapshots, allowing you to move between them, or create multiple
    snapshots within a single session.


    # ## Terminal


    VirtualBox interface is a convenient way to manage your VMs, but once you''re
    comfortable, you''ll find that there are a number of command line tools that work
    better for you. You can use the graphical VirtualBox Manager to manage your VM
    if you''d rather the easy way, or use `createvm` and `startvm` if you''re prefer
    the power-and-point approach, there are a number of tools you should take a look
    at:


    The first is VBoxManage—if you''d like to launch your VM in a ''pure'', distraction-free
    environment (with no controls of the default VirtualBox window), this is the tool
    for you. Its usage is pretty straightforward.

    `VBoxManage --start <vmname>`


    ![](img/ecc73c47a18f975d0f6cc4217cd3bcde_108_0.png)


    Replace <vmname> with the name of your VM (or UUID if you need). Once it''s running,
    you''ll not have access to the menu commands besides the main VirtualBox window,
    but some shortcuts can help. For example, press [Ctrl+F] key to toggle full-screen
    view or with [Ctrl+I] key to hide the snapshot. Press [Ctrl+B] to pause the CPU,
    press [P] to pause and resume; or [Ctrl+R] to reset. Finally, press [Ctrl+E] key
    to shut down the guest machine. Then shut your VM using the VirtualBox manager—just
    type to initiate the ACPI power-off.


    ```

    `VBoxManage start <vmname> --headless` which enables you to run your virtual machine
    head-less. To do this—you''ll need to access it remotely without a computer (check
    Headless setup guide)

    ```


    Whether you use VirtualBox from the command line or GUI, you''ll find it packed
    with powerful and useful features that will carry you to the possibilités and
    power of virtualization. How would you ever cope before?


    +   * Remove all desktop partitions and run your guest in a distraction-free environment
    using VBox.


    # # Extend the size of your VM drive


    ![](img/ecc73c47a18f975d0f6cc4217cd3bcde_108_1.png)


    +   1 Consolidate snapshots


    If you take snapshots, the resizing process will only include the original base
    image. To resolve this, right-click the VM and choose settings, then add ''old''
    to the end of the name. Click ''OK'', then click the VM again, and choose this
    time Clone. Choose ''Expert Mode'', then rename it and until ''Full'' and ''current
    machine state'' are selected before ''Cloning'':


    +   2 Resize virtual drive


    Close VirtualBox, open Terminal and go to the folder containing your VDI file.
    Use the following command, `VBoxManage modifyhdym <vdi file> --resize 10000`nThe
    resize figure is in MB, so 10000MB is 10GB.


    +   3 Extend partition


    The drive has been resized, but you now need to partition it. Boot your VM having
    attached the ISO of the Gparted CD and then move partitions to the end of the
    disk. You may have to extend the partition first, then move the free space to
    the left before resizing the partition from the left to make the space available.


