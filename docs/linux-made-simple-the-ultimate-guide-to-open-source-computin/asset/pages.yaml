  md: '# POP3 vs IMAP


    There are two ways to receive email: POP3 (Post Office Protocol) and IMAP (Internet
    Access Protocol). POP downloads messages to your computer and deletes the originals
    from the server. It''s the classic method, but for using a single machine or with
    a security-conscious bent; if the mails are sent from the server it''s going to
    be stored there for better speed. There are big disadvantages when it comes POP3
    on multiple machines - it''s a one-way transaction, with no synchronisation between
    devices, you''ve read or deleted one of the messages and your filing systems won''t
    match up.


    IMAP is a two-way protocol, and provide the better choice by syncing status and
    deletions between the server and your mail client, you can use the same account
    on multiple machines - and indeed use web and Thunderbird at the same time while
    keeping things synchronized.


    ![](img/ecc73c47a18f975d0f6cc4217cd3bcde_56_0.png)


    database; however you have to fill in the blanks. Your ISP or mail provider will
    provide the appropriate information, but they can''t tell you what to put here
    because every ISP is different. You can choose whether to use POP or IMAP with
    your account - see the box below for more details on it and done. You will have
    to use your email account in a window, but you only have to do it once.


    A quick note for users: if you have Google''s two-factor authentication (and you
    should), you will need to generate a specific password and use that, rather than
    your usual password, to log into your email through Thunderbird.


    # Split personality


    Thunderbird''s default list shows your account and its subfolders on the left,
    and has a main window on the right split into two: the top pane contains the contents
    of your selected email. By clicking on the inbox in the left, you will select
    that email. Thunderbird will download all of your emails from the server (this
    could take a while) and, if you''re using IMAP you should only download the status
    of messages. The inbox view displays messages in date order of the latest at the
    top, you can quickly re-sort messages by clicking the column header at the top.


    If you click a message and it will appear in the bottom pane of the main window.
    This is a bit small, just move the mouse over the panes and drag them up to resize
    the message space. Or just click the message again and it will open up in a tab
    of its own, giving you the full height and width of your Thunderbird window to
    view. Click on the Inbox tab (or close the tab) to get back to where you were.
    Here further options can be found in the menu at the top of the screen.


    # In the book


    When you have a message open, you''ll see all the email functions (reply, reply
    all, forward, etc.) until you click the Write button at the top of the window,
    and create a new mail. If an email includes embedded images from the internet,
    you will, at least, see a bar with


    Preferences. Thunderbird is restricting these images, unlike plain old email,
    senders can use images to gain information about your computer, and when you''ve
    read the head. Thunderbird Preferences allows you to view images in your head,
    for all messages from that address or domain, or to the main Content Preferences
    section where you can choose what to show off.


    When you''re creating a new message, discover that Thunderbird doesn''t actually
    have an address to start with. You can begin by using your own account. Manually
    importing your account is the only way to get this done. The process is going
    to be different than Outlook, but it''s not.


    Different versions of Outlook may export the options in slightly different menus,
    but you should find them somewhere in the Files menu. Make sure you export your
    contacts to a CSV (Comma Separated Values) file, as Thunderbird can accept this
    format. In Gmail, select the contacts from the top section of the main list, then
    Export to message file. option


    > tip You can set up a signature to add to the bottom of your messages in Edit
    > Account Settings menu.


    ![](img/ecc73c47a18f975d0f6cc4217cd3bcde_56_1.png)


    +   > Use the preference button to determine which images you can see in emails
    you-sent - you can get quite specific.


