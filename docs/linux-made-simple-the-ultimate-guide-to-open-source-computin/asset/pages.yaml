  md: '# # Genus Fedora


    You''ve been hit by a smooth distro...


    Fedora has been around, in one form or another, since the early 1990s. The distro
    had its first release in 1995 and its early releases were named Red Hat Commercial.
    During these early years, the distro was developed by Red Hat and was limited
    to contributing bug reports and packages included in the distro. This changed
    in 2003 when the community sponsored Red Hat Linux in the Fedora Project and opened
    it up to the community.


    The aim of Fedora is to provide the latest packages while maintaining a free software
    system. The distro was initially split into two parts, the two main software repositories—Core
    and Extras. The Fedora core contained all the basic packages except the extras,
    which were maintained by Red Hat Developers. Fedora Extras were later introduced
    with Fedora 3, which contained packages maintained by the community and were not
    distributed with the installation. Changed in 2007 when the two releases were
    renamed as Fedora.


    It is made up of Red Hat appointed members and community members. The chairman
    of the board is appointed by Red Hat. Fedora strives to maintain a six-month release
    cycle, with two releases each year supported until the launch of the next two.
    The cycles are kept short so that developers can focus on innovation and introducing
    the latest technologies into the distro.


    # # Fedora in the cap


    One way the community contributes is hosting third-party repositories. In its
    official software, there are also third-party software repositories that contain
    software not included in the official repos—such multimedia codecs or because
    the software isn''t free software. The Fedora project also produces Extra Packages
    for Enterprise Linux (EPEL), which contains packages for RHEL that are maintained
    by the community instead of Red Hat.


    In addition to Fedora release, the project also ships various spins which are
    special-purpose distros for specific interests, such as gaming, design, security,
    content creation, all similar to Fedora. These are maintained and supported by
    various Fedora-based groups (SIGs). The OLPC also runs Fedora systems. Fedora
    supports both x86 and ARM architectures, and has added support for PowerPC and
    IBM 6390, optimized for the Raspberry Pi. Fedora is distributed with Fedora 20.


    Fedora''s big contributor to the Linux ecosystem is its package manager, YUM (Updater),
    based on RPM (Red Hat Package Manager). Yum enables automatic updates and resolution,
    and works with the software repositories for installation, upgrading and removing.
    Since the release of Fedora 18, users have the option to use the tool which has
    become the default package manager since Fedora 22, because it has better dependency
    resolution and is less memory intensive than others.


    Fedora was one of the first distros to embrace the Enhanced Linux (SELinux) kernel
    module.


