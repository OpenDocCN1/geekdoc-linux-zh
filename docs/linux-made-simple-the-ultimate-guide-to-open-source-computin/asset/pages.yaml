  md: '# # Tweak dual-boot settings


    # ## How to switch between Linux and Windows using grub


    When Mint installs itself, it changes the bootloader at the beginning of your
    hard drive to a program called GRNUand Boot Loader (Grub).

    Put simply, Grub scans your hard drive for installed operating systems and then
    shows you a boot menu, allowing you to choose between them. In most cases—specifically
    where Windows is installed alongside Linux—this will be set up perfectly from
    the off. To start your desired OS, just select it from the boot menu, and if you
    don''t make a choice within five seconds, it will start to load Mint.


    In the event that you''ll want to know how to make changes to the boot menu—you
    might prefer to make Windows the default OS, or if you''ll want to have a longer
    pause before Mint is selected—you can edit the Grub menu in the Terminal, but
    you''ll need a friendlier tool to do it, like Edit your Grub menu (box).


    # ## Troubleshooting Grub


    Unfortunately, do not exactly as you expect to. If the installer didn''t detect
    your Windows installation and you were forced to partition your hard drive, you
    may find your computer no boots to Mint with no Windows. Don''t worry, you''ll
    need to perform some steps to make it accessible.


    First, you''ll need to boot from your Windows 10 recovery media: to repair your
    PC then select Troubleshooting > Startup Repair to restore Windows startup. This
    leaves you with no way to access Mint—to resolve this, boot from your Mint installation
    media, and type the following commands:


    # ## Edit your Grub menu


    ![](img/ecc73c47a18f975d0f6cc4217cd3bcde_17_0.png)


    # ### 1 Install Grub Customizer


    Open a Terminal window and type the following commands:

    ```bash

    sudo add-apt-repository ppa:danielrichard/20044ngrub-customizer

    sudo apt-get update && sudo apt-get install grub-customizer

    ```


    Once done, launch Grub Customizer by clicking ''Menu'' and searching for ''Grub''.


    # ### 2 Change defaults


    Switch to the General settings tab. From here you can change the default OS via
    the dropdown-menu, or select ''previously booted entry''. You can also change
    the delay before the default entry is selected from this tab—until ''Block default
    entry to pause Grub menu'' until OS is selected.


    # ### 3 Change Grub''s look


    To make the changes to Grub look, switch to the Appearance settings tab where
    you can prettify the Grub by changing its colour scheme, font resolution and even
    a nice background image (Note: the image needs to be a PNG). When you''ve made
    your changes, click the ''Save'' button to update Grub.'
