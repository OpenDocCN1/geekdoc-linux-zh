  md: '# # PDFs: Edit and annotate


    Portable we be to edit PDFs, but accessible? Not without a little hard work and
    dedication.


    We''ve seen some PDFs, haven''t we? They''re neat document packages which contain
    all the fonts and layout information required to display exactly what was intended,
    without requiring any of the software to be there. They''re always displayed correctly,
    and at least these incredibly small. Now the Portable Format is universally supported
    by any system, almost as outboxed as any other format.


    But there''s a problem: PDFs can be one-way streets, documents designed to exist
    in a read-only state. Editing a PDF is not easy. But well, there are ways around
    these restrictions: ways to get information out of PDFs, ways to edit them, and
    ways to create new PDFs from source.


    and character recognition to extract text from images. There are free trials available
    of both versions at qoppa.com.


    Slightly easier on the wallet £36 is PDF Editor which is masterful at the task
    of editing PDF files, and exporting them to various image formats with a lot of
    functionality. There''s a free evaluation without much. The reduced price, as
    we can tell you, isn''t much to download at once not so you you can see if you
    like it from the start.


    There are other ways to perform the main functions of proper editors without shelling
    out a penny, but they''re limited in one or another. So let''s look at a few of
    the tasks Gscan2pdf can perform perfectly.


    # Money matters


    First, let''s talk about the commercial options available in the market. There
    are two primary PDF editors out: PDF Studio and PDF Editor. The former comes in
    flavors: Standard (which can convert most PDFs, add annotations and comments to
    PDFs, merge or password protect PDFs). For proper editing you''ll have to pay
    for the Pro ($129) which also adds batch processing


    # Optical Character


    OCR, or less truth-known, is the process of getting words out of pictures. If
    you''re sent a PDF of a scanned document, that''s exactly what you''re dealing
    with: a picture, one in a package. In order to turn these into editable text,
    you''ll need to use OCR. This is not an easy task, and it''ll take a bit of work
    to figure out what the letters mean, then output that as text.


    We''d recommend a tool called Gscan2pdf for this task. It''s great for many things,
    but then you asked how to do it -but it also has an OCR engine built-in. It''s
    free to use! But you''ll need to hit [Ctrl+S] to save your PDF. If it''s quite
    fuzzy, you can adjust the text on the string, otherwise the OCR engine might get
    a bit confused and have made a mistake. But then you can select the object, delete
    or move it.


    Now let us review the OCR process. Go to Tools > OCR. This is the engine. If you
    use Tesseract as a command-line tool, it''s powerful but hard to run without some
    help - which is exactly why Gscan2pdf offers it free. Check Checkbox before OCR
    and start. Click the OCR output table, and you''ll see which fonts might not be
    right. You can then click problems words to correct them if you spot any issues.
    Hit [Ctrl+S] to save, and open your PDF in the view of choice - you can now select
    the text with mouse and copy to your heart''s desire.


