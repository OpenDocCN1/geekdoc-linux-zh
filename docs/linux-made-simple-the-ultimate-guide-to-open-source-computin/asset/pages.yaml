  md: '# Drives: Identify and locate


    Where are those files? We look into how you can identify, access and locate the
    hard drives attached to your PC.


    If you''re migrating from Windows, you may find that Linux handles drives and
    partitions is of a culture shock. For starters, you''ll see plenty of entries
    – /dev/sda, /dev/sdb and so on. It may look bewildering, but it doesn''t take
    long to realize that Linux treats drives is just as logical as Windows does. In
    this article we will discover how to demystify the jargon and how drives work
    within the Linux system.


    If regularly USB drives insert don''t always be assigned the same identity – make
    sure to use the Disks utility to assign them to each drive.


    # Identify your drives


    Open the Disks utility – use the shortcut to navigate it, make a note of how drives
    appear in /dev/ – and that''s what they do. At the top (or) of the file system
    you''ll find the dev folder, which identifies the different devices of hardware
    in your system. Select the device that''s unique to that drive – for example,


    Select drive in Disks and you''ll see all partitions: then refer to files as ''sdx''
    with ''x'' a letter representing the order of the disk. The sd1 partition fact
    that this is is supported by the storage device, and the final entry identifies
    which drive it is. Linux is consistent in how each device ''sda'' is always the
    drive on which Ubuntu is installed


    # Partitioning


    installed, for example. Then any other internal hard drives are registered before
    moving on to external drives, which include both hard and flash storage (on the
    latter – as well as optical drives – over the page)


    So far, it is easy enough to identify. Many drives contain partitions – select
    sda sdb and you should see a minimum of two partitions are displayed in the bar
    chart that provides a graphical representation of the disk(s)


    Partitioning is the act of splitting a single disk into multiple partitions, referred
    to as ''volumes''. If you come from Windows, you''ve probably seen everything
    – programs, data and itself – on a single volume, but in modern versions of Windows
    contain at least three partitions, with hidden and boot partitions at the end
    of the drive


    Windows identifies volumes by assigning them name. Linux adopts a different approach,
    identifying using a combination of the drive (sda), plus a partition number; so
    ''sdb3'' refers to the partition on the second drive, and so on.


    On this surface partitioning makes perfect sense, but it doesn''t always look
    quite straight. partitions are accorded to ''schemes'', and there are two primary
    schemes: GPT (GUID Partition Table) which is a popular choice in newer drives,
    or MBR (Master Boot Record) which remains a popular choice


    The difference between them is that the GPT scheme has no limit to the number
    of partitions you can create


    GPT drives number according to the order they were created or identified. This
    follows a pattern from left to right, but it''s not always the case (for example,
    if you manually create a partition file to sit at the end of the drive before
    setting up the main system). It has no effect on Linux systems, but can be confusing.


    The MBR throws up its oddly interesting anomaly when naming drives. Linux reserves
    ''sda1'' for physical partitions, with logical


    ![](img/ecc73c47a18f975d0f6cc4217cd3bcde_85_0.png)


    | Size | Type | Free | Used |

    |---|---|---|---|n| 4.1 GB (4,419,668,200 bytes) | ext4 | | |


    > Drives aren''t registered in the physical order in which they appear on your
    drive.


    86 | Linux Made Simple'
