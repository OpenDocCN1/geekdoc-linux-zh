    # # Folder versus file


    Things are complicated because further setting permissions on files is only half
    the story. The file owner''s permissions play a crucial role, but if you access
    the folder without granting the execution (x) permission, it doesn''t allow you
    to see the files themselves which are kept out of, so you can''t run, edit or
    delete them.


    On the flip side of the coin, if you have a file that you would think would protect
    it from being accidentally deleted. In fact, the permission for deleting a file
    doesn''t rest with the file, but rather the directory it''s stored in. So if you
    have write (w) access to the file, you can delete it, regardless of what permissions
    you set.


    # # Users, owners and everyone else


    Ubuntu is about more than just a simple set of permissions to access every file
    on your system. By using different levels of permissions for each user, you give
    more granular control over who has control of that content. The first is the ''owner''
    of the file, by default is the user who created the file.


    The next allows you to specify a user group to which specific permissions have
    been defined, and others are about groups. Groups allow you to apply to a specific
    user (the same user as the file or folder) or a different group to a user.


    When you create a new user, a group of the same name is created and your user
    is added to group and it''s what Linux refers to. This is also possible to add
    to multiple groups, allowing users to set up groups which multiple users are added,
    and the same level of permissions to the selected file or folder on the group
    they''re part of.


    The third and final category is ''everyone'' (or ''others''), which applies to
    all users on your PC who aren''t the owner or part of the group mentioned above.


    How are permissions set? It''s like this: it''s automatically done by the user
    that created it, whether that''s your user profile or if you created it through
    the command line, it''s automatically set as the default for the user. The owner
    typically has full access to the file or folder, while ''everyone'' has limited
    rights to it, and ''others'' are blocked from it.


    This approach forms the cornerstone of security in our Linux system. By default,
    everyone has full access to their personal folders, except certain files and others
    are blocked. Access to these is possible, but most are read-only or off-limits;
    requiring you to access them via the ''root'' user account.


    # # View and change permissions


    We''ve seen how using the ls -l command in the Terminal to view the permissions
    of a file or folder does not only reveals the permissions for each category, but
    also the name of the file and the group that has special rights.


    If you''d prefer a more user-friendly view, plus want access to changing permissions
    for any reason, because to the


    ![](img/ecc73c47a18f975d0f6cc4217cd3bcde_96_0.png)


    ```

    $ nick@ubuntu:~$ ls -l

    total 4

    drwxr-xr-x 2 nick nick 4096 Mar 10 15:16 Brasero projects

    drwxr-xr-x 2 nick nick 4096 Mar 10 16:04 Documents

    -rw-r--r-- 1 root root 0 Mar 10 15:53 config

    drwxr-xr-x 4 root root 4096 Mar 10 19:37 secret

    ```


    > > Check the permissions for any file or folder using the ls -l command in a
    terminal.


    file or folder right-click it and choose Properties. Switch to the Security tab
    and use the annotation to guide you through what you''re doing.


