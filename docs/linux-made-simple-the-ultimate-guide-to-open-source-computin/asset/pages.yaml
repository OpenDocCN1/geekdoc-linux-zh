  md: '# # Essential apps


    A Linux desktop isn''t complete without them!


    # ## LibreOffice


    Forked from OpenOffice.org, LibreOffice has become one of the best free productivity
    suites. It includes programs for word processing, and can create spreadsheets,
    slideshows, drawings and diagrams, with powerful mathematical formulas. It also
    offers good compatibility with documents in proprietary formats and has recently
    made a face lift: www.libreoffice.org


    # ## Thunderbird


    A gem from the Mozilla Foundation, Thunderbird is a great mail client, easy to
    set up and brimming with features. It supports wizards for popular webmail, large
    attachments and is extensible with many add-ons: www.mozilla.org/thunderbird


    # ## Wine


    Enjoy the increasing power of cross-platform apps that work on Linux. There are
    many Windows apps that includes big third-party applications, such as Adobe Photoshop
    or just some niche home tools that you can''t do without: Wine, which can run
    these Windows apps and games with ease. The project supports over 20,000 apps,
    while others require minor configuration tweaks: www.wine.org


    # ## KeepPassX


    Trying to remember passwords for the services you use? Don''t worry (that''s a
    challenge for humans (that don''t have perfect memory)). KeepPassX allows you
    to keep your passwords in an encrypted database. It can also include a random
    password generator: www.keepass.org


    # ## Gufw


    You may not be using a firewall currently, and if that''s difficult to set up
    then you need it. Gufw is a tool for managing the inbound and outbound traffic
    for various apps and your own individual ports. It''s simple, and designed especially
    for inexperienced users: www.gufw.org


    ![](img/ecc73c47a18f975d0f6cc4217cd3bcde_34_0.png)


    > Gufw has preconfigured rules to aid inexperienced users.


    # ## VirtualBox


    When you don''t want to run an entire Windows installation you can use VirtualBox
    to create a virtual machine. It is useful for implementing experimental apps that
    you don''t want to deploy on your main computer, and without exposing it to real
    hardware: www.virtualbox.org


    # ## BleachBit


    BleachBit accumulates a bit of digital junk over time. BleachBit helps you protect
    your privacy, also removes unnecessary files, and has tools to securely delete
    files or shred: bleachbitsource.org


    # ## Clonezilla


    This is a cloning-tool that''s a live CD and for backing up metal and hard disks.
    It can also image to multiple computers on a laptop. Clonezilla can work with
    a large number of disk, partitions and file types: www.clonezilla.org


    # ## Remmina


    With Remmina you can access the comforts of your remote desktop. It supports the
    widest range of protocols and will connect to all kind of remote desktops. The
    app is easy to use, and has features that make it a viable option for occasional
    use: remmina.org


    # ## OpenSSH


    When you need to interface with a remote server, you can use OpenSSH. It''s a
    powerful tool for tunnelling connections through encrypted tunnels with various
    methods of server authentication, and supports many SSH clients: openssh.com/org/


    # ## VLC


    VLC distros with a functional video player. But if you need more codecs, VLC virtually
    supports every video and audio format out there and includes tools for advanced
    users: videolan.org/vlc


    # ## PeaZip


    PeaZip is a graphical archiving tool that can work with over 200 different archive
    formats, can extract files and can create encrypted ones. It integrates with your
    desktop environment and has a CLI for advanced users: bit.net/PeaZip


    # ## Gparted


    Use Gparted to restructure a partition on your computer. It''s a live tool that
    can be installed inside your drive. Gparted can create, resize, move, delete,
    and check partitions. It supports many filesystems: gparted.org/download


    # ## HomeBank


    This is a feature-rich finance app. It can import data from other sources and
    display it in popular formats. It can also detect duplicate transactions and expenses
    and is easy to use for budgeting: homebank.org/free


