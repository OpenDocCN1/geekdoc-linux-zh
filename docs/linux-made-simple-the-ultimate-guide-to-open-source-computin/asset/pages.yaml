  md: '# Compression types: lossless


    There are two types: lossless and lossy. Compression reduces data size by removing
    redundant information. JPEG and MP3 files, for example, are lossy. Compression
    can reconstruct the result exactly where you started. There are a number of lossless
    compression methods available.


    +   * Gzip This Compression replacement is completely open and still in use. Gzip
    deflate generally produces smaller files than Zip with its default settings. It
    does not decompress as quickly, making it a good choice when size is not the most
    vital consideration.


    +   * Deflate This method is fast, but at the expense of speed. Compression in
    particular can be better, but produces more files.


    +   * Zip By it is old and not particularly effective, but it is fast and well
    known.


    +   * Compress A Linux compression program. Its file has a .z extension, but you
    are unlikely to see many in the wild. There are many issues with it.


    +   * Xz This recent program uses the LZMA compression algorithm used by zip.
    It has a .xz extension and works beautifully. It is the compressor of choice for
    many Linux projects, including Coreouils and the kernel itself.


    Here is the same archive using different compression programs. The Gzip version
    is significantly larger, but it is much faster to compress and decompress.


    compression, jb2 compression and J xz compression. (With the caption)


    There are also versions of these arguments that make the commands more readable,
    but most of us are used to the short form. We, however, we have also used this
    command in our life:


    ```

    tar -create -gzip -f file.tar.gz

    ```


    The file extension is not required, but it''s a matter for people to know what
    type of archive it is. The system needs not help you work around it or how to
    unpack. Unpacking an archive is a simple matter of extracting with x -or -extract.
    To create an archive, use c -or -create. To specify the compression type, as shown
    in figure 7,


    ```

    tar xvf file.tar.gz

    ```


    Another option you might want to use is v -or -verbose to show what tar is doing.
    If you have an archive and want to list its contents without unpacking, use t.
    If you have created an archive, a backup, you might want to check it before relying
    on the test. This command checks the integrity and lists the contents of the archive.


    ```

    tar tvf file.tar.gz

    ```


    Those are the main options, but the program has many more, such as A -or -concatenate
    to add files to an existing archive instead creating a new one.


    # Future proving


    We can tar any archive because it allows compression to another program. Another
    program can use zip and, but what if it comes up with a new archive? Perhaps saying
    something like zip-super-compress? You could create an compressed archive and
    then use zip to compress it, but that is wasteful and slow.


    ```

    tar i -f file.tar.gz

    ```


    Here, we have used only the -create option with Tar to send the archive data to
    standard output, which is piped to the zip compressor program. The command reverses
    the whole process, compressing the archive before sending it


    ![](img/ecc73c47a18f975d0f6cc4217cd3bcde_142_0.png)


    # TAR - KDE Main Page Viewer


    TAR


    NAME


    User Commands (1)


    The GNU version of the tar utility


    SYNOPSIS


    ```

    tar [-c|d|x] [-f file] [-compare] [-r] [-a] [-t] [-extract] [-x|z|j] [options]]
    [file...]

    ```


    Description: create an archive from a disk or delete it.


    The first argument should be a function: either one of the list above, or the
    name of the archive. The options must be preceded with a dash. With some options,
    a parameter may follow them. The files are listed separately below.


    COMPLETTERS


    TAR and the options have many pages, but you''ll only need the ones covered here.


    Most environments you have shown. Shown is the result of double-clicking an archive
    in LXDE (the preferred desktop for Plasma).


