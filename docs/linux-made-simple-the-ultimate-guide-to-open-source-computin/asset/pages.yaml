  md: '# System issues


    Fix difficulties with general system admin.


    # ### Drive filling up


    I ran out of space on my hard drive - the space just seems to be disappearing.
    Where did it go and how can I fix it?


    If you have more than one partition, the first step is to see which one is, with
    the command:

    `df -h`


    This shows the total, used and available space on each partition. If it''s your
    home or the system root that is misbehaving, the steps taken are the same in fact,
    although you might need to clean up `/tmp` or `/var`.


    For the systems, the culprits are usually `/tmp` and `/var`. The first is used
    for temporary files, but sometimes old files get in here, especially when processes
    fail without a reboot. `/var/log` contains system log files and can fill up, if
    a process is logging lots of errors. Look at the contents of any log files in
    before you delete them. It''s worth installing logrotate, which keeps your log
    files under control. Its default setup starts a new log file each week and compresses
    the last four weeks of logs. This can save a lot of space.


    In your home directory, check your downloads, browser and mail and the cache directory.
    You can also check the sizes of directories using `du -sh`


    lists everything in size order. You can use:

    `du -sh * | sort -h`


    There are also graphical tools to visualize disk usage:

    Filelight for KDE and Disk Usage Analyzer for Gnome - Bleachbit is good for identifying
    and cleaning unnecessary files, like browser caches and other unnecessary files.


    ![](img/ecc73c47a18f975d0f6cc4217cd3bcde_129_0.png)


    > > Filelight, Gnome Disk Usage Analyser, gives you a good representation of how
    you managed to fill that hard drive.


    # ### Where has my memory gone?


    I noticed that after running some applications for a while, I have hardly any
    memory left. What is going on? How can I free it and what can I do about?


    This is perfectly normal and the Linux is doing nothing when it could be helping
    the performance of your computer. The Linux kernel caches memory that isn''t in
    active use by processes, such as file caches in order to improve performance.
    You can see this by running `free -m`.


    | Mem | used free shared buffers cache available |

    |---|---|---|---|---|---||

    | 15G | 150 | 128M | 982M | 396K | 130 |


    On a computer with 16GB of memory, 128MB is reported as free. Of the memory it
    is not in use. These greatly speed up disk access by writing data in memory and
    reading it more often in anticipation of your next read. If you need anything
    more important, it will be released immediately.


    # ### Looking for trouble


    Linux logs about everything. When things go wrong, there are places to look. The
    system log is in `/var/log` or usually called messages, depending on your distribution
    of Linux.


    which will display new entries to the log as they appear (-f) runs. This is useful
    and then to do over when it is causing problems to your system. The kernel log
    can be found in `/var/log/kern.log`. If you are having difficulties with hardware,
    it might have a "follow" option


    You can also look at the log messages in real-time with

    `tail -f /var/log/messages`


    detected and handled at boot time, runless


    after booting, then the system scroll will show the messages, or there is a lot
    pretty. Search for something related. If your distro uses system logs, they can
    be displayed with journalctl: You can see the full stuff with journalctl or look
    for errors since the last boot:


    dmesg

    which is useful when dealing with hot-plugged hardware. To see what built-in hardware
    is


    journalctl -b -p'
