    \ log in as the oracle user:\n   $ su - oracle\n2. Set the ORACLE_HOME environment\
    \ variable to specify the path of the Oracle home directory that you want to remove:\n\
    \    * Bourne, Bash, or Korn shell:\n     $ ORACLE_HOME=/u01/app/oracle/product/10.1.0/client_1\n\
    \     $ export ORACLE_HOME\n    * C shell:\n     $ setenv ORACLE_HOME /u01/app/oracle/product/10.1.0/client_1\n\
    3. Start the Installer as follows:\n   $ORACLE_HOME/oui/bin/runInstaller\n4. In\
    \ the Welcome window, click Uninstall Products.\n5. In the Inventory window, select\
    \ the Oracle home and the products that you want to remove, then click Remove.\n\
    6. When the Installer displays a confirmation window asking you to confirm that\
    \ you want to deinstall the products and their dependant components, click **Yes**.\n\
    \nThe Installer displays a progress indicator as it removes the software.\n\n\
    7. When the products have been deleted, click **Cancel** to exit from the Installer,\
    \ then click **Yes**.\n\n# Mounting Discs\n\nThis Oracle product is delivered\
    \ on both CD-ROM and DVD-ROM. These discs are in ISO 9660 format with Rockridge\
    \ extensions. This appendix describes how to mount and unmount a disc on each\
    \ supported platform. It includes information about the following topics:\n\n\
    - Mounting Discs on Linux x86-64 on page A-1\n\n## Mounting Discs on Linux x86-64\n\
    \nOn Linux systems, the discs mount automatically when you insert it into the\
    \ disc drive. If the disc does not mount automatically, follow these steps to\
    \ mount it:\n\n1. Switch user to root:\n\n```\n$ su - root\n```\n\n2. If necessary,\
    \ enter a command similar to one of the following to eject the currently mounted\
    \ disc, remove it from the drive:\n\n    - Red Hat:\n      - # eject /mnt/cdrom\n\
    \n    - SuSE:\n      - # eject /media/cdrom\n\nIn these examples, /mnt/cdrom and\
    \ /media/cdrom are the point directories for the disc drive.\n\n3. Insert the\
    \ appropriate disc into the disc drive.\n\n4. To verify that the disc mounts automatically,\
    \ enter one of the following commands depending on your platform:\n\n    - Red\
    \ Hat:\n      - # ls /mnt/cdrom\n    - SuSE:\n      - # ls /media/cdrom\n\n5.\
    \ If this command fails to display the contents of the disc, enter a command similar\
    \ to mount it, depending on your platform:\n\n    - Red Hat:\n      - # mount\
    \ -t iso9660 /dev/cdrom /mnt/cdrom\n    - SuSE:\n      - # mount -t iso9660 /dev/cdrom\
    \ /media/cdrom\n\nIn these examples, /mnt/cdrom and /media/cdrom are the mount\
    \ point directories for the disc drive.\n\n6. If the Installer is displaying the\
    \ Disk Location dialog box, enter the disc mount point directory path, for example:\
    \ /mnt/cdrom\n\nTo continue, go to one of the following sections:\n\n- If you\
    \ want to copy software to a hard disk, see the following section:\nCopy the Oracle\
    \ Client Software to a Hard Disk on page 3-3\n- If you want to install the software\
    \ from the discs, see the \"Install the Oracle Client Software\" section on page\
    \ 3-3.\n\n# Installing and Configuring Oracle Products Using Response Files\n\n\
    This chapter describes how to install and configure Oracle products using response\
    \ files. It includes information about the following topics:\n\n- Introduction\n\
    - Create the oraInst.loc File\n- Prepare a Response File\n- Run the Installer\
    \ in Silent or Suppressed Mode\n\n## Introduction\n\nYou can automate the installation\
    \ and configuration of Oracle software, either fully or partially, by specifying\
    \ a response file when you start the Oracle Universal Installer. The Installer\
    \ uses values contained in the response file to provide answers to some or all\
    \ of the prompts:\n\n- If you include responses for all of the prompts in the\
    \ response file and specify the -silent option when starting the Installer, then\
    \ the Installer runs in silent mode. During silent-mode installation, the Installer\
    \ does not display any screens. Instead, it displays progress in the terminal\
    \ that you used to start.\n- If you include responses for some or all of the prompts\
    \ in the response file and omit the -silent option, then the Installer runs in\
    \ suppressed mode. During suppressed-mode installation, the Installer displays\
    \ only the screens for which you did not specify information. You can also use\
    \ variables in the response file or command-line options to suppress other screens,\
    \ such as the Welcome screen or Summary screen, that do not prompt for information.\n\
    \nThe following table describes several reasons why you might want to run the\
    \ Installer in silent mode or suppressed mode:\n\n| Mode | Uses |\n|---|---|\n\
    | Silent | Use silent mode if you want to: - Complete an unattended installation,\
    \ which you might schedule using system utilities such as: - Complete similar\
    \ installations on multiple systems without user interaction - Install the software\
    \ on a system that does not have Window System installed on it |\n| Suppressed\
    \ | Use suppressed mode if you want to complete simple Oracle installations on\
    \ more than one system, providing default answers to some, but not all, the prompts.\
    \ |\n\n# Installation Overview\n\nTo install and configure Oracle products using\
    \ the Installer in silent or suppressed mode, follow these steps:\n\n> Note: You\
    \ must complete all required pre-installation tasks on a system before running\
    \ the Installer in silent or suppressed mode.\n\n1. Create the oraInst.loc file.\n\
    2. Prepare a response file.\n3. Run the Installer in silent or suppressed mode.\n\
    These steps are described in the following sections.\n\n# Create the oraInst.loc\
    \ File\n\nIf you plan to install Oracle products using the Installer in silent\
    \ or suppressed mode, you must manually create the oraInst.loc file if it does\
    \ not already exist. This file specifies the location of the Oracle Inventory\
    \ directory where the Installer creates the inventory of Oracle products installed\
    \ on the system.\n\n> Note: If Oracle software has been installed previously on\
    \ the system, the oraInst.loc file might already exist. If the file exists, you\
    \ do not need to create a new file.\n\nTo create the oraInst.loc file, follow\
    \ these steps:\n\n1. Switch user to root:\n\n```\n$ su root\n```\n\n2. Change\
    \ directory as follows:\n\n```\n# cd /etc\n```\n"
