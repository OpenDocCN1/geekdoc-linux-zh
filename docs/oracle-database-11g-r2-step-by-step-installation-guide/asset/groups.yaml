    \ Oracle 清单目录的位置，安装程序会在其中创建系统中安装的 Oracle 产品清单。\n\n> 注意：如果系统之前安装过 Oracle 软件，oraInst.loc\
    \ 文件可能已经存在。如果文件存在，则您不需要创建新文件。\n\n要创建 oraInst.loc 文件，请遵循以下步骤：\n\n1. 切换用户到 root：\n\
    \n```\n$ su root\n```\n\n2. 按照如下切换目录：\n\n```\n# cd /etc\n```"
