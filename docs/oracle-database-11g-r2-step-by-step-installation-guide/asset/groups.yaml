    - Follow the instructions displayed in the Installer windows. If you need additional
    information, click Help.

    - When the Installer prompts you to run a script with root privileges, enter a
    command similar to the following in a terminal where you are logged in as the
    root user, then click Continue or OK:

    ```bash

    # /script_path/script_name

    ```


    Caution: The Oracle Universal Installer automatically installs the Oracle-supplied
    version of the Java Runtime Environment (JRE). This version is required to run
    Oracle Universal Installer and several Oracle assistants. Do not modify the JRE
    except by a patch provided by Oracle Support Services.


    - 5. If you chose an installation type that runs Oracle Net Configuration Assistant
    (NetCA) in interactive mode, you must provide detailed information about configuring
    your network.


    If you need assistance when using NetCA in interactive mode, click **Help** on
    any screen.


    > **Note:** If you chose a default installation, NetCA runs non-interactively.


    - 6. When all of the configuration tools have finished, click **Exit**, then click
    **Yes** to exit from the Installer.


    - 7. See [Chapter 4, "Post-installation Tasks"] for information about tasks that
    you must complete after you have installed the software.


    # Post-installation Tasks


    This chapter describes how to complete post-installation tasks after you have
    installed the software. It includes information about the following topics:


    - Required Post-installation Tasks

    - Recommended Post-installation Tasks

    - Required Product-Specific Post-installation Tasks


    You must perform the tasks listed in the "Required Post-installation Tasks" section.
    Oracle recommends that you perform the tasks listed in the "Recommended Post-installation
    Tasks" section after all installations.


    If you installed and intend to use any of the products listed in the "Required
    Product-Specific Post-installation Tasks" section, you must perform the tasks
    listed in the product-specific subsections.


    > Note: This chapter describes basic configuration only. See the Oracle Database
    Administrator''s Reference for UNIX Systems and product-specific administration
    and tuning guides for more sophisticated configuration and tuning information.


    # Required Post-installation Tasks


    You must perform the tasks described in the following sections after completing
    an installation:


    - Downloading and Installing Patches

    - Running Oracle Enterprise Manager Java Console

    - Connecting with Instant Client

    - Configuring Oracle Products


    # Downloading and Installing Patches


    Check the OracleMetalink Web site for required patches for your installation.
    To download required patches:


    - Use a browser to view the OracleMetalink Web site:


    ```

    http://metalink.oracle.com

    ```


    - Log in to OracleMetalink.


    > **Note:** If you are not an OracleMetalink registered user, click **Register
    for MetaLink!** and follow the registration instructions.


    - 3. On the main OracleMetalink page, click *Patches*.


    - 4. Select *Simple Search*.


    - 5. Specify the following information, then click **Go:**


    - In the *Search By* field, specify Product or Family, then specify RDBMS Server.

    - In the *Release* field, specify the current release number.

    - In the *Type* field, specify Patchset/Minipack.

    - In the *Platform* or *Language* field, select your platform.


    # Using Oracle Enterprise Manager Java Console


    In addition to use Oracle Enterprise Manager Database Control or Grid Control
    to manage an Oracle Database 10g database, you can also use the Oracle Enterprise
    Manager Java Console to manage databases from this release or previous releases.
    The Java Console is installed by the *Administrator* installation type.


    > **Note:** Oracle recommends that you use Grid Control or Database Control in
    preference to the Java Console when possible.


    To start the Java Console, follow these steps:


    - 1. Set the `ORACLE_HOME` environment variable to specify the Oracle home directory
    where you installed Oracle Client.


    - 2. Set the shared library path environment variable of the system to include
    the following directories:


    | Platform | Environment Variable | Required Setting |

    | --- | --- | --- |

    | Linux x86-64 | LD_LIBRARY_PATH | `$ORACLE_HOME/lib/lib32:$ORACLE_HOME/lib:$LD_LIBRARY_PATH`
    |


    - 3. Enter the following command to start the Java Console:


    ```

    $ $ORACLE_HOME/bin/orcmap

    ```


    # Connecting with Instant Client


    If you use the Instant Client installation type, you can configure users’ environment
    to enable dynamically linked clients to connect to a database as follows:


    - 1. Set the appropriate shared library path environment variable for your platform
    to specify the directory that contains the Instant Client libraries. For the Instant
    Client installation type, this directory is the Oracle home directory that you
    specified during the installation, for example:

    `/u1/app/oracle/product/10.1.0/client_1`


    The following table shows the appropriate environment variable for the platform:


    | Platform | Environment Variable |

    |---|---|

    | Linux x86-64 | LD_LIBRARY_PATH |


    - 2. Use one of the following methods to specify database connection information
    for the client application:


    - Specify a SQL URL string using the following format:

    //host:port/service_name

    - Set the TNSADMIN environment variable to specify the location of tnsnames.ora
    file and specify a service name from that file.

    - Set the TNSADMIN environment variable and set the TWO_TASK environment variable
    to specify a service name from the tnsnames.ora file.


    > **Note:** You do not have to specify the ORACLE_HOME environment variable.


    # Configuring Oracle Products


    Many Oracle products and options must be configured before you use them for the
    first time. Before using individual Oracle products or options, specify the appropriate
    manual in the product documentation library, available on the Oracle Documentation
    Library CD-ROM, the DVD-ROM, or on the OTN Web site.


    # Recommended Post-installation Tasks


    Oracle recommends that you perform the tasks described in the following section
    after completing an installation:


    - Backing Up root.sh Script

    - Setting Up User Accounts

    - Generating the Client Static Library


    # Backing Up root.sh Script


    Oracle recommends that you back up the root.sh script after you complete an installation.
    If you install other products in the same Oracle home directory, then the Oracle
    Universal Installer updates the contents of the existing root.sh script during
    the installation. If you require information contained in the original root.sh
    script, then you can recover it from the backed root.sh file.


    # Setting Up User Accounts


    For information about setting up additional user accounts, see the Oracle Database
    Administrator''s Reference for UNIX Systems.


    # Generating the Client Static Library


    The client static library (libclnt10.a) is not generated during installation.
    If you want to link your applications to the client static library, you must first
    generate it as follows:

