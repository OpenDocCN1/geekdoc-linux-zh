    $ export DISPLAY

    ```

    - C or tsh shell:

    ```bash

    $ setenv DISPLAY workstation_name:0.0

    ```


    4. To determine whether X Window applications display correctly on the local system,
    enter the following command:

    ```bash

    $ xclock

    ```


    The X clock should appear on your monitor.

    If the clock appears, close X clock and start the Installer again.


    ## What to Do if an Installation Error Occurs


    - If you encountered an error during installation:

    - Do not exit the exit.

    - If you clicked Next after entered incorrect information on one of the installation
    screens, click Back to the screen and correct the information.

    - If you encounter an error while the Installer is copying or linking files, see
    the "Reviewing the Log of an Installation Session" section on page C-2.

    - If you encounter an error while a configuration assignment is running, see the
    "Troubleshooting Configuration Assistants" section on page C-3.

    - If you cannot resolve the problem, remove the failed installation by following
    the steps listed in the "Cleaning Up After a Failed Installation" section on page
    C-4.


    ## Reviewing the Log of an Installation Session


    During an installation, the Installer records all of the actions that it performs
    in a log. If you encounter problems during the installation, review the log file
    for information about possible causes of the problem.

    To view the log file, follow these steps:


    1. If necessary, enter one of the following commands to determine the location
    of the oraInventory directory:


    ```

    $ cat /etc/oraInst.loc

    ```


    The inventory_loc parameter in this file specifies the location of the oraInventory
    directory.


    2. Enter the following command to change directory to the Installer log directory,
    where orainventory_location is the location of the oraInventory directory:


    ```

    $ cd /inventory_location/logs

    ```


    3. Enter the following command to determine the file name of the log file:


    ```

    $ ls -ltr

    ```


    This command lists the files in order of creation, with the most recent file shown.
    Installer log files have names similar to the following, where date_time indicates
    the date and time that the installation started:


    installActionsdate_time.log


    4. To view the most recent in the log file, where information about a problem
    is most likely to appear, enter a command similar to the following:


    ```bash

    $ tail -50 installActionsdate_time.log | more

    ```


    This command displays the last 50 lines in the log file.


    5. If the error displayed by the Installer or listed in the log file indicates
    a relinking problem, see the following file for more information:


    ```

    $ORACLE_HOME/install/make.log

    ```


    ## Troubleshooting Configuration Assistants


    To troubleshoot an installation error that occurs when a configuration assistant
    is running:


    - Review the installation log files listed in the "Reviewing the Log of an Installation
    Session" section on page C-2.

    - Review the specific assistant log file located in the $ORACLE_HOME/cfgtoologs.
    Try to fix the issue that caused the error.

    - If you see the "Fatal Error. Restart" message, look for the cause of the problem
    by reviewing the log files. Refer to the "Fatal Errors" section for further instructions.


    ## Configuration Assistant Failure


    Oracle configuration assistant failures are noted at the bottom of the installation
    screen. The configuration assistant interface displays additional information,
    if available. The configuration assistant execution status is stored in the following
    file: oraInventory_location/logs/installActionsdate_time.log


    The execution status codes are listed in the following table:


    | Status | Result Code |

    | --- | --- |

    | Configuration assistant succeeded | 0 |


    ## Silent-Mode Response File Error Handling


    | Status | Result Code |

    | --- | --- |

    | Configuration assistant failed | 1 |

    | Configuration assistant cancelled | -1 |


    ## Fatal Errors


    If you receive a fatal error while a configuration assistant is running, look
    for the cause of the problem by reviewing the log files. Refer to the "Fatal Errors"
    section for further instructions.


    ## Silent-Mode Response File Handling


    To determine whether silent-mode installation succeeds or fails, see the following
    file:

    `oraInventory_location/logs/installActionsdate_time.log`


    Silent-mode installation fails if:

    - You do not specify a response file

    - You specify an incomplete response file

    - The Installer encounters such as insufficient disk space


    ## Cleaning Up After a Failed Installation


    If an installation fails, remove the failed installation by following the steps:


    1. Start the installation as described in the "Cleaning Up After a Failed Installation"
    section on page C-4.

    2. Correct the cause of the problem.

    3. Remove the Oracle home you want to remove.

    4. Remove the files created during the installation.

    5. Reinstall the software.


