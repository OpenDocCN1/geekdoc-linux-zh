- md: "\n# Oracle Client Installation Types\n\nmethods are useful if you need to perform\
    \ multiple installations on similarly configured systems or if the system where\
    \ you want to install the software does not have X Window system installed.\n\n\
    When you use a response file, run the Installer in the following modes, depending\
    \ on whether you specify all of the required information or not:\n\n- **Silent\
    \ Mode:** The Installer runs in silent mode if you use a response file that specifies\
    \ all required information. None of the Installer screens are displayed.\n- **Suppressed\
    \ Mode:** The Installer runs in suppressed mode if you do not specify all required\
    \ information in the response file. The Installer displays only the screens that\
    \ prompt for the information that you did not specify.\n\nFor more detailed information\
    \ about these modes and how to complete an installation using response files,\
    \ see Appendix B.\n\n# Oracle Client Installation Types\n\nYou can choose one\
    \ of the following installation types when installing Oracle Client:\n\n- **Administrator:**\
    \ Applications to connect to an Oracle database locally or on a remote system.\
    \ It also provides tools that allow you to administer an Oracle database.\n- **Runtime:**\
    \ Applications to connect to an Oracle database on the local system or on a remote\
    \ system.\n- **Custom:** Allows you to select individual components from the list\
    \ of Administrator and Runtime components.\n- **Instant Client:** Enables you\
    \ to install only the shared libraries required by Oracle Call Interface (OCI),\
    \ Oracle C++ Call Interface (OCI), or Java connectivity (JDBC) OCI applications.\
