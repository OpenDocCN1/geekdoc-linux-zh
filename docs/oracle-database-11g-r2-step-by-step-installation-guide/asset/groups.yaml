    \ 目录。\n\n# 配置 Pro*C/C++\n\n验证 PATH 环境变量是否包含包含 C 编译器可执行文件的目录。表 4–1 显示了根据您的平台和编译器，验证路径设置的默认目录和相应命令。\n\
