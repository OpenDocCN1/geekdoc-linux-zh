    \     $ export ORACLE_HOME\n    * C shell：\n     $ setenv ORACLE_HOME /u01/app/oracle/product/10.1.0/client_1\n\
    3. 按照如下启动安装程序：\n   $ORACLE_HOME/oui/bin/runInstaller\n4. 在欢迎窗口中，点击“卸载产品”（Uninstall\
