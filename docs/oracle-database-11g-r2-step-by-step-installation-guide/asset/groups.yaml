    ## Configure the oracle User''s Environment


    $ su oracle


    + 5. To determine the default shell for the oracle user, enter the following command:

    $ echo $SHELL


    + 6. Open the oracle user''s shell startup file in any text editor:


    > Note: On Red Hat Linux, .bash_profile is the user startup file for the Bash
    shell.


    - Bourne shell (sh), Bash shell (bash), or Korn shell (ksh):

    $ vi .bash_profile

    - C shell (csh or tcsh):

    % vi .login


    + 7. Enter or edit the following line, specifying a value of 022 for the default
    file mode creation mask:

    umask 022


    + 8. If the ORACLE, SID, ORACLE_HOME, or ORACLE_BASE environment variables are
    set in the file, remove the appropriate lines from the file.


    + 9. Save the file and exit from the editor.


    + 10. To run the shell startup script, enter one of the following commands:

    - Bash shell on Red Hat Enterprise Linux:

    $ ./bash_profile

    - Bourne, Bash, or Korn shell:

    $ ./.profile

    - C shell:

    % source ./login


    + 11. If you are not installing the software on the local system, enter a command
    similar to the following to direct X applications to display on the local system:

    - Bourne, Bash, or Korn shell:

    $ DISPLAY=local_host:0.0 ; export DISPLAY

    - C shell:

    % setenv DISPLAY local_host:0.0


    In this example, local_host is the host name or IP address of the system that
    you want to use to display the Installer (your workstation or PC).


    + 12. If you determined that /tmp directory has more than 400 MB of free disk
    space, identify a file system with at least 400 MB of free space and set the TEMP
    TMPDIR environment variables to specify a temporary directory on this file system:


    2-12 Oracle Database Installation Guide


    ## Configure the oracle User''s Environment


    + a. Use the df -k command to identify a suitable file system with sufficient
    space.

    b. If necessary, enter commands similar to the following to create a temporary
    directory on the file system that you identified, and set the appropriate permissions
    on the directory:


    ```

    $ su - root

    # mkdir /mount_point/tmp

    # chmod awr /mount_point/tmp

    # exit

    ```


    + c. Enter commands similar to the following to set the TEMP and TMPDIR environment
    variables:


    - Bourne, Bash, or Korn shell:


    ```

    $ TEMP=/mount_point/tmp

    $ TMPDIR=/mount_point/tmp

    $ export TEMP TMPDIR

    ```

    - C shell:


    ```

    % setenv TEMP /mount_point/tmp

    % setenv TMPDIR /mount_point/tmp

    ```


    + 13. Enter commands similar to the following to set the ORACLE_BASE environment
    variable:


    - Bourne, Bash, or Korn shell:


    ```

    $ ORACLE_BASE=/u01/app/oracle

    $ export ORACLE_BASE

    ```

    - C shell:


    ```

    % setenv ORACLE_BASE /u01/app/oracle

    ```


    In these examples, /u01/app/oracle is the Oracle base directory that you created
    earlier.


    + 14. Enter the following command to ensure that the ORACLE_HOME and TNS_ADMIN
    environment variables are not set:


    - Bourne, Bash, or Korn shell:


    ```

    $ unset ORACLE_HOME

    % unset TNS_ADMIN

    ```

    - C shell:


    ```

    % unsetenv ORACLE_HOME

    % unsetenv TNS_ADMIN

    ```


    Note: If the ORACLE_HOME environment variable is set, the Installer uses the value
    that it specifies as the default path for the Oracle home directory. However,
    if you set the ORACLE_BASE environment variable, Oracle recommends that you unset
