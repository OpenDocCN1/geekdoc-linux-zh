    5. To determine whether the required packages are installed, enter commands similar
    to the following:


    ```

    # rpm -q package_name

    ```


    If a package is not installed, install it from your Linux distribution media or
    download the required package from your Linux vendor''s Web site.


    6. To continue completing pre-installation tasks, go to the "Create Required UNIX
    Group and User".


    # Create Required UNIX Group and User


    Depending on whether this is the first time Oracle is installed on the system
    and on the products that you are installing, you may need to create the following
    UNIX group and user:


    +   - The Oracle inventory group (oin)


    You must create this group the first time you install Oracle software on the system.
    The usual name for this group is oinstall. This group owns the Oracle inventory,
    which is a catalog of all Oracle software installed on the system.


    > Note: If Oracle software is already installed on the system, the existing Oracle
    Inventory group must be the primary group of the UNIX user you use to install
    new Oracle software. The following sections describe how to identify an existing
    Oracle group.


    +   - The Oracle software owner user (oracle)


    You must create this user the first time you install Oracle software on the system.
    This user owns all of the software installed during the installation. The usual
    name chosen for this user is oracle. This user must have the Oracle Inventory
    group as its primary group.


    A single Oracle Inventory group is required for all installations of Oracle software
    on the system. After the first installation of Oracle software, you must use the
    same Oracle Inventory group for all subsequent Oracle software installations on
    that system. However, you can choose to create different Oracle software owner
    users for separate installations.


    The following sections describe how to create the required UNIX user and group.


    > Note: The following sections describe how to create local users and groups.
    As an alternative to creating local users and groups, you could create the appropriate
    users and groups in a directory service, for example, Network Information Services
    (NIS). For information about using directory services, contact your system administrator
    or see your operating system documentation.


    # Creating the Oracle Inventory Group


    You must create the Oracle Inventory group if it does not already exist. The following
    subsections describe how to determine the Oracle Inventory group name, if it exists,
    and how to create it if necessary.'
