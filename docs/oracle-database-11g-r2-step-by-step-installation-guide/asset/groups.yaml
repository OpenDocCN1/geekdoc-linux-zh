    \ title and part number of the documentation and the chapter, section, and page\
    \ number (if available). You can send comments to us in the following ways:\n\n\
    - Electronic mail: infodef_us@oracle.com\n- FAX: (650) 506-7227. Attn: Server\
    \ Technologies Documentation Manager\n- Postal service:\n  Oracle Corporation\n\
    \  Server Technologies Documentation Manager\n  500 Oracle Parkway, Mailstop 4op11\n\
    \  Redwood Shores, CA 94065\n  USA\n\nIf you would like a reply, please give your\
    \ name, address, telephone number, and electronic mail address (optional).\n\n\
    If you have problems with the software, please contact your local Oracle Support\
    \ Services.\n\n# Preface\n\nThis guide describes how to install and configure\
    \ Oracle Client 10g release 1 (10.1.0.3) on Linux x86-64.\n\n# Audience\n\nThe\
    \ Oracle Database Installation Guide is intended for anyone responsible for installing\
    \ Oracle Client 10g release 1 (10.1.0.3) on a single Linux x86-64 system.\n\n\
    # Documentation Accessibility\n\nOur goal is to make Oracle products, services,\
    \ and supporting documentation accessible, with good usability, to the disabled\
    \ community. To that end, our documentation includes features that make information\
    \ available to users of assistive technology. This documentation is available\
    \ in HTML format, and contains markup to facilitate access by the disabled community.\
    \ Standards will continue to evolve over time, and Oracle is actively engaged\
    \ with other market-leading technology vendors to address technical obstacles\
    \ that our documentation can be accessible to all of our customers. For additional\
    \ information, visit the Oracle Accessibility Program Web site at\n\nhttp://www.oracle.com/accessibility/\n\
    \nAccessibility of Code Examples in Documentation JAWS, a Windows screen reader,\
    \ may not always correctly read the code examples in this document. The conventions\
    \ for writing code that require braces appear on an otherwise empty line; however,\
    \ JAWS may not always read a line of text that consists solely of a bracket or\
    \ brace.\n\nAccessibility of Links to External Web Sites in Documentation This\
    \ documentation may contain links to Web sites of other companies or organizations\
    \ that Oracle does not own or control. Oracle evaluates nor makes any representations\
    \ regarding the accessibility of these Web sites.\n\nSupport for Hearing and Speech\
