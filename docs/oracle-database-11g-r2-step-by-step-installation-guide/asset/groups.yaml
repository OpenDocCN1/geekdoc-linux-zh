    -   要创建一个新用户，请查看下节。


    ## 创建新的 Oracle 软件所有者


    如果不存在 Oracle 软件所有者，或者您需要一个新的 Oracle 软件所有者用户，请根据您的操作系统按照以下方式创建。在后续步骤中，除非已存在该用户，否则请使用名称
    oracle。


    1.  要创建 oracle 用户，请输入类似下所示的命令：

    ```bash

    # /usr/sbin/useradd -g install|-g dba oracle

    ```


    在此命令中：


    - `-g` 选项指定主组，该组必须是 Oracle 目录组，例如 `oinstall`

    - `-G` 选项指定可选的次要组


    2.  为 oracle 用户设置密码：

    ```bash

    # password oracle

    ```


    请查看以下章节以继续：


    -   在第 2-8 页识别所需的软件目录


    ## 修改现有的软件所有者


    如果 oracle 用户存在，但其主组不是 `install`，您可以按照以下方式对其进行修改：


    -   输入类似所示的命令，使用 `-g` 选项指定主组，并使用 `-G` 选项指定任何所需的次要组：

    ```bash

    # /usr/sbin/usermod -g install -G dba oracle

    ```


    ## 识别所需的软件目录


    您必须为 Oracle 软件识别或创建以下三个目录：


    -   Oracle 基目录 (Base directory)

    -   Oracle 目录目录 (Inventory directory)

    -   Oracle 实例目录 (Home directory)


    以下小节描述了这些目录的要求：


    ## Oracle 基目录


    Oracle 基目录充当 Oracle 软件安装的顶层目录。它类似于 Windows 系统上用于 Oracle 的时使用的 `C:\Oracle` 目录。在
    Linux 系统上，最优灵活架构 (OFA) 指南建议您使用类似下方的路径作为 Oracle 基目录：


    ```

    /mount_point/app/oracle_sw_owner

    ```


    在此示例中：


    - `mount_point` 是包含 Oracle 软件的文件系统的挂载点。


    本指南中的示例使用 `/u01` 作为挂载点目录。但是，您可以选择另一个挂载点目录，例如 `/oracle` 或 `/opt/oracle`。


    - `oracle_sw_owner` 是 Oracle 软件所有者的 UNIX 用户名，例如 `oracle`。


    您可以为多个安装程序使用同一个 Oracle 基目录，也可以为不同的安装创建不同的 Oracle 基目录。如果 UNIX 用户在同一系统上安装 Oracle
    软件，则每个用户必须创建一个独立的 Oracle 基目录。以下示例基目录可以同时存在于同一系统上：


    ```

    /u01/app/oracle

    /u01/app/orauser

    /oracle/app/oracle

    ```


    后续章节描述了如何识别可能适用于您的安装的现有 Oracle 基目录，以及在必要如何创建一个新的 Oracle 基目录。


    无论您是创建新的 Oracle 基目录还是决定使用现有的目录，都必须设置 `ORACLE_BASE` 环境变量来指定该目录的完整路径。


    ## Oracle 目录目录


    Oracle 目录 (`oraInventory`) 存储系统上安装的软件清单。它是所有 Oracle 软件安装所需的且是共享的。当您首次在系统上安装 Oracle
    软件时，安装程序会提示您指定此目录的路径。Oracle 建议选择以下路径：


    ```

    oracle_base/oraInventory

    ```


    安装程序会创建您指定的目录，并为其设置正确的所有者、组和权限。您不需要手动创建它。


    > 注意：所有 Oracle 软件安装都依赖此目录。请确保定期对其备份。除非您已从系统中完全删除了所有 Oracle 软件，否则请删除此目录。


    ## Oracle 目录


    Oracle 目录是您选择为特定 Oracle 产品安装软件的目录。您必须将不同的 Oracle 产品或同一 Oracle 产品的不同版本安装在不同的 Oracle
    目录中。当您运行安装程序时，它会提示您指定此目录的路径以及一个标识它的名称。您指定的目录必须是 Oracle 基目录的子目录。安装程序建议使用类似下面的路径作为
    Oracle 目录：


    ```

    oracle_base/product/1...1

    ```


    安装程序会创建您指定的目录，并为其设置正确的所有者、组和权限。您不需要手动创建它。


    后续章节描述了如何识别可能适用于您的安装的现有 Oracle 基目录，以及在必要时创建一个新的 Oracle 基目录。


    无论您是创建新的 Oracle 基目录还是决定使用现有的目录，都必须设置 `ORACLE_BASE` 环境变量来指定该目录的完整路径。


    '
