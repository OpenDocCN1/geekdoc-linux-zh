    //host:port/service_name

    - 设置 TNSADMIN 环境变量以指定 tnsnames.ora 文件的位置，并从该文件中指定服务名。

    - 设置 TNSADMIN 环境变量并设置 TWO_TASK 环境变量以从 tnsnames.ora 文件指定服务名。


    > 注意：不需要指定 ORACLE_HOME 环境变量。


