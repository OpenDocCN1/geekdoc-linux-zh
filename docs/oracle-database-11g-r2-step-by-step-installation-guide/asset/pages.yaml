    # Check the Hardware Requirements


    The system must meet the following minimum hardware requirements:


    +   - 256 MB of physical RAM

    - 512 MB of swap space

    - 400 MB of disk space in the /tmp directory

    - Between 180 MB and 1.9 GB of disk space for the Oracle software, depending on
    the installation type and platform


    To ensure the system meets these requirements, follow these steps:

    1. To determine the physical RAM size, enter the following command:


    | Platform | Command |

    | --- | --- |

    | Linux x86-64 | # grep MemTotal /proc/meminfo |


    If the size of the physical RAM installed in the system is less than the required
    size, you must install more memory before continuing.


    2. To determine the size of the configured swap space, enter the following command:


    | Platform | Command |

    | --- | --- |

    | Linux x86-64 | # grep SwapTotal /proc/meminfo |'
  merge: -1
  pgno: 17
- img_proc: true
  md: 'If necessary, see your operating system documentation for information about
    how to configure additional swap space.


    +   3. To determine the amount of disk space available in the /tmp directory,
    enter the following command:


    ```

    # df -k /tmp

    ```


    If there is less than 400 MB of disk space available in the /tmp directory, complete
    one of the following steps:


    +   - Delete unnecessary files from the /tmp directory to achieve the required
    disk space.

    - Set the TEMP and TMPDIR environment variables when setting the oracle user''s
    environment (described later).

    - Extend the file system that contains the /tmp directory. If necessary, contact
    your system administrator for information about extending file systems.


    +   4. To determine the amount of free disk space on the system, enter the following
    command:


    ```

    # df -k

    ```


    The following table shows the approximate disk space requirements for files for
    each installation type:


    | Platform | Installation Type | Requirement for Software Files (MB) |

    | Linux x86-64 | Instant Client | 110 |

    | Linux x86-64 | Administrator | 650 |

    | Linux x86-64 | Runtime | 350 |

    | Linux x86-64 | Custom (maximum) | 650 |


