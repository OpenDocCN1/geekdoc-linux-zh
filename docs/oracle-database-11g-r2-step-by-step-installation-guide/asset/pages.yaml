  md: '# Preface


    This guide describes how to install and configure Oracle Client 10grelease 1 (10.1.0.3)
    on Linux x86-64.


    # Audience


    The Oracle Database Installation Guide is intended for anyone responsible for
    installing Oracle Client 10g release 1 (10.1.0.3) on a single Linux x86-64 system.


    # Documentation Accessibility


    Our goal is to make Oracle products, services, and supporting documentation accessible,
    with good usability, to the disabled community. To that end, our documentation
    includes features that make information available to users of assistive technology.
    This documentation is available in HTML format, and contains markup to facilitate
    access by the disabled community. Standards will continue to evolve over time,
    and Oracle is actively engaged with other market-leading technology vendors to
    address technical obstacles that our documentation can be accessible to all of
    our customers. For additional information, visit the Oracle Accessibility Program
    Web site at


    http://www.oracle.com/accessibility/


    Accessibility of Code Examples in Documentation JAWS, a Windows screen reader,
    may not always correctly read the code examples in this document. The conventions
    for writing code that require braces appear on an otherwise empty line; however,
    JAWS may not always read a line of text that consists solely of a bracket or brace.


    Accessibility of Links to External Web Sites in Documentation This documentation
    may contain links to Web sites of other companies or organizations that Oracle
    does not own or control. Oracle evaluates nor makes any representations regarding
    the accessibility of these Web sites.


    Support for Hearing and Speech Impaired Customers Oracle provides dedicated Telephone
    (TTY) access to Oracle Support Services within the United States of America 24
    hours a day, seven days a week.


    +   * For technical questions, call 1.800.446.2398

    * For non-technical questions, call 1.800.464.2330'
