  md: '# # Installation Overview


    This chapter describes the different types of Oracle Client installations that
    you can perform, and issues that you should consider before installing the software.
    It includes information about the following topics:


    +   - Installation Overview

    - Oracle Client Installation Methods

    - Oracle Client Installation Types

    - Installation Considerations


    # ## Installation Overview


    The Oracle Client installation process consists of four parts:


    +   1. **Planning your installation**: This chapter [Chapter 2](https://example.com/chapter2)
    describes the Oracle products that you can install and issues that you must consider
    before starting the installation.

    2. **Completing pre-installation tasks**: Chapter 2 describes pre-installation
    tasks that you must complete before installing the product.

    3. **Installing software**: Chapter 3 describes how to use the Oracle Universal
    Installer to install this product.

    4. **Completing post-installation tasks**: Chapter 4 describes recommended and
    required post-installation tasks.


    # ## Oracle Client Installation Methods


    You can choose different installation methods to install Oracle Client, as follows:


    +   - Interactive Installation Methods

    - Automated Installation Methods Using Response Files


    # ## Interactive Installation Methods


    When you use the interactive method to install Oracle Client, the Installer displays
    a series of screens that you enable to specify all of the required information
    to install the Oracle Client software.


    # ## Automated Installation Methods Using Response Files


    By creating a response file and specifying this file when you start the Installer,
    you can automate some or all of the Oracle Client installation. These automated
    installation'
  merge: -1
  pgno: 12
- img_proc: true
  md: '# Oracle Client Installation Types


    methods are useful if you need to perform multiple installations on similarly
    configured systems or if the system where you want to install the software does
    not have X Window system installed.


    When you use a response file, run the Installer in the following modes, depending
    on whether you specify all of the required information or not:


    +   - **Silent Mode:** The Installer runs in silent mode if you use a response
    file that specifies all required information. None of the Installer screens are
    displayed.

    - **Suppressed Mode:** The Installer runs in suppressed mode if you do not specify
    all required information in the response file. The Installer displays only the
    screens that prompt for the information that you did not specify.


    For more detailed information about these modes and how to complete an installation
    using response files, see Appendix B.


    # Oracle Client Installation Types


    You can choose one of the following installation types when installing Oracle
    Client:


    +   - **Administrator:** Applications to connect to an Oracle database locally
    or on a remote system. It also provides tools that allow you to administer an
    Oracle database.

    - **Runtime:** Applications to connect to an Oracle database on the local system
    or on a remote system.

    - **Custom:** Allows you to select individual components from the list of Administrator
    and Runtime components.

    - **Instant Client:** Enables you to install only the shared libraries required
    by Oracle Call Interface (OCI), Oracle C++ Call Interface (OCI), or Java connectivity
    (JDBC) OCI applications. This installation type requires much less disk space
    than the other Oracle Client types.


    > See Also: For more information about Instant Client, see the Oracle Call Interface
    Programmer''s Guide or the Oracle JDBC Developer''s Guide and Reference.


    # Installation Considerations


    This section contains information that you should consider before deciding to
    install this product. It contains the following sections:


    +   - Hardware and Software Certification

    - Multiple Oracle Homes


    # Hardware and Software Certification


    The platform-specific hardware and software requirements included in this installation
    guide were current at the time this guide was published. However, new platforms
    and operating system software versions may be certified after this guide is published,
    review the certification matrix on the OracleMetaLink Web site for the most-to-date
    list of certified hardware platforms and operating system versions. The OracleMetaLink
    Web site is available at the following URL:


    ```

    http://metalink.oracle.com

    ```'
  merge: -1
  pgno: 13
- img_proc: true
  md: 'If you do not have a current Oracle Support Services contract, you can access
    the same information from the following Web site:


    http://www.oracle.com/technology/support/metalink/content.html


    # Multiple Oracle Homes


    This product supports multiple Oracle homes. This means that you can install this
    release or previous releases of the software more than once on the same system,
    in different Oracle home directories.


    # Installing the Software on a System with an Existing Oracle Installation


    You must install this product into a new Oracle home directory. You cannot install
    products from one release of Oracle Client into an Oracle home directory of a
    different release. For example, you cannot install release 10.1 software into
    an existing Oracle 9i Oracle home directory. If you attempt to install this release
    into an Oracle home directory that contains software from an earlier Oracle release,
    the installation fails.


    You can install this release more than once on the same system provided that each
    installation is installed in a separate Oracle home directory.'
  merge: -1
