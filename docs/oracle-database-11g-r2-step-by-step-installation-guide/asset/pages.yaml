  md: '# # B Installing and Configuring Oracle Products Using Response Files


    This chapter describes how to install and configure Oracle products using response
    files. It includes information about the following topics:


    +   - Introduction

    - Create the oraInst.loc File

    - Prepare a Response File

    - Run the Installer in Silent or Suppressed Mode


    # ## Introduction


    You can automate the installation and configuration of Oracle software, either
    fully or partially, by specifying a response file when you start the Oracle Universal
    Installer. The Installer uses values contained in the response file to provide
    answers to some or all of the prompts:


    +   - If you include responses for all of the prompts in the response file and
    specify the -silent option when starting the Installer, then the Installer runs
    in silent mode. During a silent-mode installation, the Installer does not display
    any screens. Instead, it displays progress in the terminal that you used to start.

    - If you include responses for some or all of the prompts in the response file
    and omit the -silent option, then the Installer runs in suppressed mode. During
    a suppressed-mode installation, the Installer displays only the screens for which
    you did not specify all required information. You can also use variables in the
    response file or command-line options to suppress other installer screens, such
    as the Welcome screen or Summary screen, that do not prompt for information.


    The following table describes several reasons why you might want to run the Installer
    in silent mode or suppressed mode:'
  merge: -1
  pgno: 46
- img_proc: true
  md: "# Create the oraInst.loc File\n\n| Mode | Uses |\n|---||\n| Silent | Use silent\
    \ mode if you want to:\n - Complete an unattended installation, which you might\
    \ schedule using system utilities such as:\n - Complete several similar installations\
    \ on multiple systems without user interaction\n - Install the software on a system\
    \ that does not have X Window System installed on it |\n| Suppressed | Use suppressed\
    \ mode if you want to complete simple Oracle installations on more than one system,\
    \ providing default answers to some, but not all of the Installer prompts. |\n\
    \nThe Installer displays progress information in the terminal that you used to\
    \ start it, but it does not display any of the Installers.\n\n# Installation Overview\n\
    \nTo install and configure Oracle products using the Installer in silent or suppressed\
    \ mode, follow these steps:\n\n> Note: You must complete all required pre-installation\
    \ tasks on a system before running the Installer in silent or suppressed mode.\n\
    \n+   1. Create the oraInst.loc file.\n2. Prepare a response file.\n3. Run the\
    \ Installer in silent or suppressed mode.\nThese steps are described in the following\
    \ sections.\n\n# Create the oraInst.loc File\n\nIf you plan to install Oracle\
    \ products using the Installer in silent or suppressed mode, you must manually\
    \ create the oraInst.loc file if it does not already exist. This file specifies\
    \ the location of the Oracle Inventory directory where the Installer creates the\
    \ inventory of Oracle products installed on the system.\n\n> Note: If Oracle software\
    \ has been installed previously on the system, the oraInst.loc file might already\
    \ exist. If the file exists, you do not need to create a new file.\n\nTo create\
    \ the oraInst.loc file, follow these steps:\n\n+   1. Switch user to root:\n\n\
    ```\n$ su root\n```\n\n+   2. Change directory as follows:\n\n```\n# cd /etc\n\
    ```"
  merge: -1
  pgno: 47
- img_proc: true
  md: '+   Use a text editor to create the oraInst.loc file, containing the following
    lines:


    ```

    inventory_loc=ORACLE_BASE/orInventory

    st_group=

    ```


    In this example, ORACLE_BASE is the path of the Oracle base directory, for example,
    /01/app/oracle.


    +   Enter the commands to set the appropriate owner, and permissions on the oraInst.loc
    file:


    ```

    # chown oracle:install oraInst.loc

    # chmod 664 oraInst.loc

    ```


    # Prepare a Response File


    There are two methods that you can use to prepare a response file for use during
    silent-mode or suppressed-mode installations:


    +   Edit a response file template


    This method is most useful for the Instant Client, Administrator, or Runtime installation
    types.


    +   Record a response file using the Installer


    This method is most useful for Custom or software-only installations.

    The following subsections describe each method.


    # Editing a Response File Template


    Oracle provides response file templates for each product and instance type, and
    for each configuration tool. These files are located in the response directory
    on the CD-ROM or the client/response directory on the DVD-ROM.


    > Note: If you copied the software to a hard disk, the response files are located
    in the Disk1/response directory.


    Table B-1 lists the response files provided with Oracle Client.


    | Response File | Description |

    |---|---|

    | instantClient.rsp | Instant Client installation of Oracle Client |

    | clientAdmin.rsp | Administrator installation of Oracle Client |

    | clientRuntime.rsp | Runtime installation of Oracle Client |

    | clientCustom.rsp | Custom installation of Oracle Client |


    To prepare a response file:


    +   Copy the response file from the response file directory to a directory on
    your system:


    ```

    $ cp /directory_path/response/response_file.rsp local_directory

    ```'
  merge: -1
  pgno: 48
- img_proc: true
  md: 'In this example, `directory_path` is the CD-ROM mount point directory or the
    client directory on the DVD-ROM. If you have copied the software to a hard drive,
    you can edit the file in the `response` directory if you prefer.


    +   2. Open the response file in a text editor:

    $ vi /local_dir/response_file.rsp


    +   3. Edit the file, following the instructions in the file.


    > Note: The Installer or configuration assistant fails if you do not correctly
    configure the response file. See Silent-Mode Response File Error Handling on page
    C-4 for more information about troubleshooting a failed silent-mode installation.


    # Recording a Response File


    You can use the Installer in interactive mode to record a response file that you
    can edit and then use silent-mode or suppressed-mode installations. When you are
    recording the response file, you can either complete the installation, or you
    can exit from the Installer on the Summary page, before it starts to copy the
    software to the system.


    > Note: You cannot use record mode to create a response file during installation
    that uses the Basic Installation method.


    To record a new response file:


    +   1. Complete the pre-installation tasks in Chapter 2.

    When you run the Installer to record a response file, it checks the system to
    verify that it meets the requirements to install the software. For this reason,
    Oracle recommends that you complete all of the required pre-installation tasks
    and record the response file while completing an installation.


    +   2. If you have not installed Oracle software on this system, create the `oraInst.loc`
    file, as described in the previous section.


    +   3. Make sure that the Oracle owner user (typically `oracle`) has permissions
    to create or write to the Oracle home path that you specify when you run the Installer.


    +   4. To record a response file, enter a command similar to the following to
    start the Installer.


    > Note: Do not specify a relative path to the response file. If you specify a
    relative path, the Oracle Universal Installer fails.


    ```

    $ /directory_path/runInstaller -record -destinationFile filename

    ```


    In the following example:


    +   * `directory_path` is either the CD-ROM mount point directory, the path of
    the client directory on the DVD-ROM, or the path of the `Disk1` directory on the
    hard drive


    ![](img/98c6a50499da11b582445838bf7b8c72_49_0.png)'
  merge: -1
