  md: '# 3

    Installation Tasks


    This chapter describes how to start the Oracle Universal Installer and install
    Oracle products on your system. It includes information about the following topics:


    > Note: Review the information in Chapter 1, "Installation Overview" and complete
    the tasks listed in Chapter 2, "Pre-installation Tasks" before beginning the installation.


    +   - Installation Overview

    - Download Oracle Software from the OTN Web Site

    - Copy the Oracle Client Software to a Hard Disk

    - Install the Oracle Client Software


    # Installation Overview


    The Oracle Client software is available on disc (CD-ROM or DVD-ROM) or you can
    download it from the Oracle Technology Network (OTN) Web site. In most cases,
    you can use the graphical user interface (GUI) provided by the Oracle Universal
    Installer to install the software. However, you can also use the Installer to
    complete silent-mode installations, without using the GUI. Appendix B for information
    about silent-mode installations.


    This chapter describes how to install Oracle Client from the product media or
    from the hard disk, you may either download it from OTN and unpack it, or copy
    it from the discs, if you have them. See one of the following sections, depending
    on the method that you want to use:


    +   - To copy the Oracle Client Software to a Hard Disk page 3-3

    - To install the software from disc or from an existing hard disk location, see
    the "Install the Oracle Client Software" section on page 3-3.

    - To download the software from OTN, see the following section.


    # Download Oracle Software from the OTN Web Site


    This section describes how to download the installation archive files and extract
    them on your hard disk.'
  merge: -1
  pgno: 30
- img_proc: true
  md: '# Downloading the Installation Archive Files


    To download the installation archive files from OTN:


    +   1. Use any browser to access the software download page on OTN:


    http://www.oracle.com/technology/software/

    2. Navigate to the download page for the product that you want to install.

    3. On the download page, identify the required disk space by adding the file sizes
    for each required file.

    The file sizes are listed next to the filenames.

    4. Select a file system with enough free space to store and expand the archive
    files.

    in most cases, the available disk space must be at least twice the size of all
    of the archive files.

    5. On the file system you selected in step 4, create a parent directory for each
    product, for example OracleCli10g to hold the installation directories.

    6. Download all of the installation archive files to the directory that you created
    in step 5.

    7. Verify that the files you downloaded are the same size as the corresponding
    files on OTN.


    # Extracting the Installation Files


    To extract the installation files, perform the following steps:


    +   1. If necessary, change directory to the directory that contains the downloaded
    installation archive files.

    2. Uncompress each file, enter a command similar to the following:

    $$ gunzip filename.pio.gz


    This command creates files with names similar to the following:

    filename.pio

    3. To extract the installation files, enter commands similar to the following:

    $$ cpio -idmv filename.pio


    > Note: See the download page for information about the correct options to use
    with the cpio command on your platform.


    Some browsers uncompress files while downloading them, but leave the .gz file
    extension. If these steps do not work, remove the .gz extension from the files
    and repeat step 3.


    For each file, this command creates a subdirectory named Diskn, where n is the
    disk number identified in the filename.


    When you have extracted all of the installation files, see the "Install the Oracle
    Client Software" section on page 3-3.'
  merge: -1
  pgno: 31
