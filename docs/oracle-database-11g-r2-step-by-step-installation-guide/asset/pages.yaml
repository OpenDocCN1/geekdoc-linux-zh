    \ example, an X terminal (xterm).\n  2. If you are not installing the software\
    \ on the local system, enter the following command to enable remote hosts to display\
    \ applications on the local X server:\n  3. If you are not installing the software\
    \ on the local system, use the ssh, or telnet command to connect to the system\
    \ where you want to install the software:\n\n```\n$ xhost +\n```\n\n```\n$ telnet\
    \ remote_host\n```"
