    If you are running the Installer on a remote system and you want to display the
    Installer''s interface on your local system, you may see error messages similar
    to the following:


    ```

    "Failed to connect to server"

    *"Connection refused by server"

    *"Can''t open display"

    ```


    If you see one of these error messages, follow these steps:'
