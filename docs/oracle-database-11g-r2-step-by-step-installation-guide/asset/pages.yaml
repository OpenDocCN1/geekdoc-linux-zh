- img_proc: true
  md: 'The examples in this guide use /u01 for the mount point directory. However,
    you could choose another mount point directory, /oracle or /opt/oracle for example.


    +   - oracle_sw_owner is the UNIX user name of the Oracle software owner, for
    example oracle.


    You can use the same Oracle base directory for more than one installation or you
    can create Oracle base directories for different installations. If UNIX users
    install Oracle software on the same system, each user must create a separate Oracle
    base directory. The following example base directories could all exist on the
    same system


    ```

    /u01/app/oracle

    /u01/app/orauser

    /oracle/app/oracle

    ```


    The following sections describe how to identify existing Oracle base directories
    that might be suitable for your installation and how to create a new Oracle base
    directory if necessary.


    Regardless of whether you create a new Oracle base directory or decide to use
    an existing one, you must set the ORACLE_BASE environment variable to specify
    the full path to this directory.


    # Oracle Inventory Directory


    The Oracle Inventory (oraInventory) stores an inventory of software installed
    on the system. It is required, and shared, by all Oracle software installations
    on a single system. The first time you install Oracle software on a system, the
    Installer prompts you to specify the path to this directory. Oracle recommends
    that you choose the following path:


    ```

    oracle_base/oraInventory

    ```


    The Installer creates the directory that you specify and sets the correct owner,
    group, and permissions on it. You do not need to create it.


    > Note: All Oracle software installations rely on this directory. Make sure that
    you back it up regularly.

    \Do not delete this directory unless you have completely removed all Oracle software
    from the system.


    # Oracle Home Directory


    The Oracle home directory is the directory where you choose to install the software
    for a particular Oracle product. You must install different Oracle products, or
    different releases of the same Oracle product, in separate Oracle home directories.
    When you run the Installer, it prompts you to specify the path to this directory,
    as well as a name that identifies it. The directory that you specify must be a
    subdirectory of the Oracle base directory. Oracle recommends that you specify
    a path similar to the following for the Oracle home directory.


    ```

    oracle_base/product/10.1.0/client_1

    ```


    The Installer creates the path that you specify under the Oracle base directory.
    It also sets the correct owner, group, and permissions on it. You do not need
    to create this directory.'
