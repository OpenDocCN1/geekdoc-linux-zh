  md: '# Identify or Create an Oracle Base Directory


    Before starting the installation, you must identify either an existing Oracle
    base directory or if required, create a new one. This section contains information
    about the following:


    +   - Identifying an Existing Oracle Base Directory

    - Creating a New Oracle Base Directory


    > Note: You can choose to create a new Oracle base directory, even if other Oracle
    base directories exist on the system.


    # Identifying an Existing Oracle Base Directory


    Existing Oracle base directories might not have paths that comply with OFA guidelines.
    However, if you identify an Oracle inventory directory or Oracle home directories,
    you can usually identify the Oracle base directories, as follows:


    +   - Identifying an Oracle Inventory Directory

    ter the following command to view the contents of the oraInst.loc file:


    ```bash

    # more /var/opt/oracle/app/oraInst.loc

    ```

    If the oraInst.loc file exists, the output from this command is similar to the
    following:


    ```text

    inventory_loc=/u01/app/oracle/Inventory

    inst_group=install

    ```


    The inventory_loc parameter identifies the Oracle inventory directory (oraInventory).
    The parent directory of the oraInventory is typically an Oracle base directory.
    In the previous example, /u01/app/oracle is an Oracle base directory.


    +   - Identifying existing Oracle home directories

    ter the following command to view the contents of the oratab file:


    ```bash

    # more /etc/oratab

    ```

    If the oratab file exists, it contains lines similar to the following:


    ```text

    :/u03/app/oracle/product/10.1.0/db_1:N

    :/opt/oracle/infra_904:N

    :/oracle/9.2.0:N

    ```


    The paths specified on each line identify Oracle home directories. Directory paths
    that end with the user name of the Oracle software that you want to use are valid
    choices for an Oracle base directory. If you intend to use the oracle user to
    install the software, you could choose one of the following directories from the
    previous example:


    ```text

    /u03/app/oracle

    /oracle

    ```


    > Note: If possible, choose a directory path similar to the first (/u03/app/oracle).
    This path complies with the OFA guidelines.'
