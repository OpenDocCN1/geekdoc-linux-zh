    \ the oracle User's Environment\n\n# Log In to the System as root\n\nBefore you\
    \ install the Oracle software, you must complete several tasks as the root user.\
    \ To log in as the root user, complete one of the following procedures:\n\n> Note:\
    \ Unless you intend to complete a silent-mode installation, you must install the\
    \ software from an X Windows System workstation, an X terminal, or a PC or other\
    \ system with X server installed.\n\nFor more information about silent-mode installations,\
    \ seenAppendix B.\n\n+   - If you are installing the software from an X Window\
