    Use the comments in the file as a guide when editing it.


    # # Run the Installer in Silent or Suppressed Mode


    To run the Oracle Universal Installer in silent or suppressed mode, follow these
    steps:


    +   1. Complete the pre-installation tasks listed in Chapter 2.

    2. Log in as the Oracle software owner user (typically *oracle*).

    3. If you are completing a suppressed-mode installation, set the DISPLAY environment
    variable.


    > Note: You do not have to set the DISPLAY environment variable if you are completing
    a silent-mode installation.


    4. To start the Installer in silent or suppressed mode, enter a command similar
    to the following:


    > Note: Do not specify a relative path to the response file. If you specify a
    relative path, the Oracle Universal Installer fails.


    ```

    $ /directory_path/runinstaller [-silent] -responseFile filename

    ```


    In these examples:


    +   - `directory_path` is the CD-ROM mount point, the path of the client directory
    on the DVD-ROM, or the path of the Disk1 directory on the hard drive

    - The `-silent` option indicates that you want to run the Installer in silent
    mode

    - `filename` is the full path and filename of the installation response file that
    you configured


    Installing and Configuring Oracle Products Using Response Files B-5'
  merge: -1
