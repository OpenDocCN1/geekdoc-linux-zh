  md: '# Troubleshooting


    This appendix contains information about troubleshooting. It includes information
    about the following topics:


    +   * Verify Requirements

    * X Windows Display Errors

    * What to Do If an Installation Error Occurs

    * Reviewing the Log of an Installation Session

    * Troubleshooting Configuration Assistants

    * Silent-Mode Response File Error Handling

    * Cleaning Up After a Failed Installation


    # Verify Requirements


    Before performing any of the troubleshooting steps in this appendix, ensure that
    the system meets the requirements and that you have completed all of the pre-installation
    tasks specified in Chapter 2, "Pre-installation Tasks".


    Read the Release Notes


    Read the release notes for the product on your platform before installing it.
    The release notes are available on the Oracle Database 10g disc. The latest version
    of the release notes is also available on the ONT web site:


    http://www.oracle.com/technology/documentation/


