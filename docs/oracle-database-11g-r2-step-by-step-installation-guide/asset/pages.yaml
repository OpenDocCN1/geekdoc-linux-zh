  md: '# Terminology


    The names for UNIX operating systems have been shortened in this guide, as follows:


    | Operating System | Abbreviated Name |

    | Linux x86-64 | Linux |


    # Typographic Conventions


    The following typographic conventions are used in this guide:


    | Convention | Description |

    | monospace | Monospace type identifies UNIX commands, directory names, usernames,
    pathnames, and filenames. |

    | italics | Italic type identifies variables, including variable portions of filenames.
    It is also used for emphasis and for book titles. |

    | UPPERCASE | Uppercase letters indicate Structured Query Language (SQL) reserved
    words, initialization parameters, and environment variables. |


    # Command Syntax


    UNIX command syntax appears in `monospace` font. The dollar sign ($), number sign
    (#), or percent character (%) are UNIX commands. Do not enter them as part of
    the command. The following command syntax conventions are used in this guide:


    | Convention | Description |

    | slash \ | A backslash is the UNIX continuation character. It is used in command
    examples that are too long to fit on a single line. Enter the command as displayed
    (with a backslash) or enter it on a single line without a backslash. |

    | braces [] | Braces indicate required items: .DEFINE (macrol) |

    | brackets [] | Brackets indicate optional items: cvvctert termname [output] |

    | ellipses ... | Ellipses indicate an arbitrary number of similar items: CHKEVAL
    fieldname value value2 ... valueN |

    | italics | Italic type indicates a variable. Substitute a value for the variable:
    library_name |

    | vertical line | A vertical line indicates a choice within braces or brackets:
    FILE filesize [K|M] |


    # Accessing Documentation


    The documentation for Oracle Client release 1 (10.1) for UNIX Systems includes
    platform-specific documentation and generic product documentation.'
  merge: -1
