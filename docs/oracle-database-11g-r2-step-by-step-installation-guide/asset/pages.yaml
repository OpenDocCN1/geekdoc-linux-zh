  md: '# Copy the Oracle Client Software to a Hard Disk


    If your system does not have a CD-ROM or DVD-ROM drive, you can copy the software
    from the disc to a file system on another system, either mount that file using
    NFS, or use FTP to copy the files to the system where you want to install the
    software.


    To copy the contents of the disc to a hard disk:


    +   1. Create a single directory on the hard disk to hold the Oracle software:


    ```

    $ mkdir OracleCli1og

    ```


    +   2. Change the directory to the directory you created in step 1:


    ```

    $ cd OracleCli1og

    ```


    +   3. Create subdirectories for each installation disc with names similar to
    the following, where n is the disk number:


    ```

    $ mkdir Diskn

    ```


    +   4. Mount the disc, if it is not already mounted.


    Some platforms automatically mount the disc when you insert it into the drive.
    If the disc does not mount automatically, see Appendix A for platform-specific
    information about mounting it.


    +   5. Copy the contents of the mounted disc to the corresponding new subdirectory
    as:


    ```

    $ cp -R /directory_path Diskl

    ```


    In this example, /directory_path is the CD-ROM mount point directory or the path
    of the client directory on the DVD-ROM. The following table lists typical mount
    point directories for each platform:


    | Platform | Mount Point |

    | --- | --- |

    | Linux (Red Hat) | /mnt/cdrom |

    | Linux (SuSE) | /media/cdrom |


