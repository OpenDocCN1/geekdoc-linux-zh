- img_proc: true
  md: '# Silent-Mode Response File Error Handling


    | Status | Result Code |

    | --- | --- |

    | Configuration assistant failed | 1 |

    | Configuration assistant cancelled | -1 |


    # Fatal Errors


    If you receive a fatal error while a configuration assistant is running, you must
    remove the current installation and reinstall the Oracle software, as follows:


    +   1. Remove the failed installation as described in the "Cleaning Up After a
    Failed Installation" section on page C-4.

    2. Correct the cause of the fatal error.

    3. Reinstall the Oracle software.


    # Silent-Mode Response File Error Handling


    To determine whether a silent-mode installation succeeds or fails, see the following
    log file:

    `/oraInventory_location/logs/silentInstallate_time.log`


    If necessary, see the previous section for information about determining the location
    of the `oraInventory` directory.


    A silent installation fails if:


    +   * You do not specify a response file

    * You specify an incorrect or incomplete response file

    * The Installer encounters an error, such as insufficient disk space


    The Installer or configuration assistant validates the response file at runtime.
    If the validation fails, the silent-mode installation or configuration process
    ends. The Installer treats values for parameters that are of the wrong context,
    format, or type as if no value was specified in the file.


    # Cleaning Up After a Failed Installation


    If an installation fails, you must remove the files created during the attempted
    installation and remove the Oracle home directory. Perform the following steps
    to remove the files:


    +   1. Start the Installer as described in the "Install the Oracle Client Software"
    section on page 3-3.

    2. Click **Install Products** on the Welcome window or click **Installed Products**
    on any- window.

    3. Select the Oracle home that contains the products you want to remove, then
    click **Remove**.

    4. Manually remove the Oracle home directory created during the failed installation.

    5. Reinstall the Oracle software.


    The Inventory window appears, listing installed products.'
