    +   1. To create the oracle user, enter a command similar to the following:

    # /usr/sbin/useradd -g install|-g dba] oracle


    In this command:


    +   - The -g option specifies the primary group, which must be the Oracle Inventory
    group, for example oinstall

    - The -G option specifies optional secondary groups


    +   2. Set the password of the oracle user:

    # password oracle


    See the following sections to continue:


    +   - Identify Required Software Directories on page 2-8


    # Modify an Existing Software Owner Owner


    If the oracle user exists, but its primary group is not installall, you can modify
    it as follows:


    +   - Enter a command similar to the following, specifying the primary group using
    the -g option and any required secondary groups using the -G option:

    # /usr/sbin/usermod -g install -G dba oracle


    # Identify Required Software Directories


    You must identify or create three directories for the Oracle software, as follows:


    +   - Oracle base directory

    - Oracle Inventory directory

    - Oracle home directory


    The following subsections describe the requirements for these directories:


    # Oracle Base Directory


    The Oracle base directory acts as a top-level directory for Oracle software installations.
    It is analogous to the C:\Oracle directory used for Oracle installations on Windows
    systems. On Linux systems, the Optimal Flexible Architecture (OFA) guidelines
    recommend that you use a path similar to the following for the Oracle base directory:


    ```

    /mount_point/app/oracle_sw_owner

    ```


    In this example:


    +   - mount_point is the mount point for the file system that will contain the
    Oracle software.'
