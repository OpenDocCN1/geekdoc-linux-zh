    the Hypertext Transport Protocol (HTTP) to clients that are standardized to receive
    it (web browsers). As mentioned earlier, by far the most successful and widely
    used web server software is Apache, an open source implementation available for
    multiple platforms, including Linux and NetWare. Apache is part of the standard
