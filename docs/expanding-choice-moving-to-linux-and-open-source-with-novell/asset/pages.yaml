  md: '# DNS


    At a high level, DNS maps host or domain names to IP addresses. Because humans
    tend to use word-based names and computers require number-based addresses, DNS
    is given the job of matching them. Every time you type in a domain name (such
    as well.novell.com), a DNS server is employed to get you to the right host machine.
    DNS servers for individual users or small businesses are usually hosted by Internet
    service providers. In large organizations where subdomains are required (for example,
    support.novell.com, forge.novell.com, and so on), a DNS server that provides navigation
    addresses to domain specific machines is hosted by the company.


    DNS is more than just simple mapping. It includes the methodology for navigating
    hierarchical trees and domains to determine actual IP addresses. DNS also accommodates
    multiple addresses being assigned to the same domain name (that is, load balancing)
    or when many domain names map to a single IP address (that is, virtual hosting).


    DNS caching is particularly useful for increasing performance for website access.
    A local DNS cache stores the hostname/address mappings for the most requested
    websites. Rather than search the full chain of external DNS servers to determine
    an IP address, the previously resolved name exists in the local cache for fast
    access.


    Several source DNS Linux solutions are available with the most popular being Berkeley
    Internet Domain Name (BIND). BIND is included with SUSE Linux and is usually configured
    at startup. It includes a domain name server, a domain name resolver library,
    and tools for verifying the proper operation of a DNS server. DNS resolution is
    also key to routing of email, listing the email exchange servers that accept mail
    for each domain.


    # DHCP


    DHCP is even more commonly used in organizations than DNS. In simple terms, every
    machine connecting to an IP network (internal or the Internet) must have an IP
    address. Static addresses (IP numbers or addresses permanently assigned to a single
    device) may be in short supply or difficult to manage in dynamic organizations.
    DHCP simplifies the management and distribution of IP addresses.


    DHCP provides several methods of IP address distribution, the most common is dynamic
    allocation or leasing. A DHCP server acts as a leasing agent, providing IP addresses
    to any client on the network that requests one from a predetermined pool of addresses
    specified by the administrator. As a client (a Windows workstation, for example)
    boots up, the network adapter card'
