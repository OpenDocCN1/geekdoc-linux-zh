    no cross-training for backup support.

    - Multiple vendor relationships contributed to complex licensing, maintenance
    and support agreements, and fees.

    - Incompatibilities existed between systems with little integration and no common
    standards.

    - Disagreement and confusion existed regarding the strategic direction for new
    technology acquisitions.


    At the time of the initial evaluation, the university''s major choice was between
    Unix or Windows-supported solutions. GGU selected Unix based on the following
    criteria:


    +   - Web services—Strategically, Java and open standards-based solutions would
    allow GGU to create the types of applications and services that would best serve
    the needs of faculty, staff, and students during the five-year planning window.
    A Unix-like operating system such as Solaris or Linux provided this capability
    with full support of Java.

    - Oracle—GGU was already using Oracle enterprise resource planning (ERP) applications
    and had chosen Oracle as a strategic partner for database solutions. GGU wanted
    an operating system platform that would continue to support Oracle with performance
    and scalability, as well as'
