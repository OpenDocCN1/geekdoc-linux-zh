  md: '# # About the Authors


    **Jason Williams** is the product manager for Novell Open Enterprise Server (OES)
    and the creator of the requirements document for OES. He joined Novell in 1999
    and had been product manager for GroupWise®, WebAccess, and Wireless. He created
    Novell''s Instant Messaging system, GroupWise Messenger. Previously, he has held
    positions in London for numerous financial institutions including the Bank of
    England and the BBC World service.


    **Peter Clegg** is a freelance author and former technology editor for McGraw-Hill.
    He has been published in major trade and business magazines and specializes in
    evolving IT services. He has been writing about networking technology for over
    15 years. He was Director of Marketing over NetWare and Internet services at Novell.


    **Emmett Dulaney** is the certification columnist for UnixReview and author of
    Novell Certified Linux Professional Study Guide from Novell Press. He has earned
    18 vendor certifications, written several books on Linux, Unix, and certification
    study, spoken at a number of conferences, and is a former partner at Mercury Technical
    Solutions.'
