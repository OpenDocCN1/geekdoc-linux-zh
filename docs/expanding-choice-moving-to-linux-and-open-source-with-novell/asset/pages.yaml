    +   Filtering—The area of filtering is extremely important and encompasses both
    address filtering and content analysis. Address filtering can be accomplished
    using routing in which access to content from a particular website can be blocked
    at the router, or at a point where filtering occurs, such as NAT. Specific IP
    addresses can be blocked, a range of addresses can be blocked, or filtered based
    on a dynamic block and allow list. For example, a blacklist service provider tracks
    IP addresses that are known to generate spam and provides this list to your router,
    where you can automatically block traffic from ever entering your network.


    Content filtering encompasses the analysis and filtering of data for virus detection
    and eradication for both Web and email. Because solutions in this particular area
    often require continuous updating to keep abreast of evolving security threats,
    they are usually best available from independent software vendors.


    In addition to the services mentioned previously, the category of edge services
    is sometimes defined to include load balancing—the performance smoothing of content
    delivery using virtual servers and mirroring.


    Two common load balancing problems exist that Linux and open source can easily
    remedy. The first is simple web server overload, where there are far too many
    requests for content or objects that can be handled by a single web server. In
    this case, multiple web servers (for example, Linux running Apache) can be mirrored
    with identical information (in the same or different locations).

    An incoming request for information is intercepted by the load balancing or virtual
    server running NAT software, which rewrites the request header, directing the
    request to the mirrored server that is least busy, closest, or meets a'
