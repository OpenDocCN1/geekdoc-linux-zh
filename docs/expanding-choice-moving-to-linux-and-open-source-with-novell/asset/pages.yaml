    # Deny Vendor Lock-in


    In economics, vendor lock-in, also known as proprietary lock-in or more simply
    lock-in, is a situation where a customer is dependent on a vendor for products
    and services and cannot move to another vendor without substantial'
  merge: -1
  pgno: 79
- img_proc: true
  md: 'costs, real and/or perceived. By the creation of these costs to the customer,
    lock-in favors the company (vendor) at the expense of the consumer. Lock-in costs
    create a barrier to entry in a market that, if great enough to result in an effective
    monopoly, might result in antitrust actions from the relevant authorities (the
    FTC in the United States).


    Lock-in is often used in the computer industry to describe the effects of a lack
    of compatibility between different systems. Different companies or a single company
    might create different versions of the same system architecture that cannot notate.
    Manufacturers might design their products so that parts or add-on enhancements
    must be purchased from the same manufacturer rather than a third party (connector
    conspiracy). The purpose is to make it difficult for users to switch to competing
    systems. (Source: Wikipedia, free encyclopedia).


    "Enraged" is probably the most appropriate description of CIO sentiments toward
    a certain ISV market leader''s attempts to limit choice through the vendor lock-in.
    After a quick review of recent history, it''s not hard to conclude that a good
    deal of the intensity and momentum of the entire source movement is a reactive
    backlash to the monopolistic and coercive methods of commercial software vendors.


    Many ISVs, including Novell, work to ensure that customers return again and for
    services and establish income flows through subscriptions and maintenance. But
    historically, others have consistently endeavored to limit choice to a single
    vendor with closed and proprietary solutions. As described in a recent eWeek article,
    "The economic value of ''open'' lies in the ability for users to walk away from
    onerous vendor pricing or licensing, the negotiating leverage they have, and the
    ability to avoid vendor-unique extensions."


    The following list includes several of John Terpstra''s definitions of vendor
    lockin. John has been part of the open source Samba project since its early days,
    and has methodically identified several restrictions that illustrate vendor-lock
    in scenarios:


    +   - Proprietary data storage formats that lack interoperability with other vendors''
    software applications and/or that prevent the data from being exported from the
    vendor''s product to another vendor''s product

    - A vendor that has a restrictive partnership agreement to implement (that is,
    support) the product only on said partners'' platforms or systems'
