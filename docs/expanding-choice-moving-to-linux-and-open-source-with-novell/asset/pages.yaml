  md: '# Introduction


    "Open source" is a catch phrase that passes from lip to lip and from magazine
    article to magazine cover more times a day than can be counted. So many speak
    of it, yet you have to wonder if they really understand the depth of the topic
    they''re discussing and the world of possibilities that it holds.


    # Looking for a Common Thread


    Let''s start with a pop quiz. Read the following three short case studies and
    try to ascertain what each organization has in common.


    # Golden Gate University


    In the heart of San Francisco''s financial district is the central hub of California''s
    fifth-largest private university. Golden Gate University offers a variety of exceptional
    undergraduate and graduate programs in business management, information technology,
    and law, utilizing the most advanced technologies and learning tools available.
    Golden Gate''sCyberCampus permits students to work and study on their own schedules
    using the Internet.


    Golden Gate is 75% of the way through a major data center consolidation project,
    which replaces a cacophony of hardware platforms, operating systems, database
    applications, and web services with Linux, open source applications and networking
    services, Oracle databases, and Dell hardware. This five-year migration plan allows
    Golden Gate to simplify administration and consolidate hardware, software, and
    database content without sacrificing any functionality while providing students
    and faculty with easier access to more resources. In addition to quantified hardware,
    software, and management savings, Golden Gate has implemented data center technology
    that provides it scalability and choice, and positions it to take advantage of
    new and emerging open standards solutions.'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# Expanding Choice: Moving to Linux and Open Source with Novell Enterprise
    Server


    # CCOC


    CCOC is a mutually-owned service bureau providing information technology services
    to community banks and credit unions in the northeastern United States. The company
    has more than 130 customers and nearly 300 employees. The company services  7,000
    workstations and 500 ATMs, and processes more than seven million check images
    each month.


    CCOC''s solutions included a mix of Unix and Microsoft Windows applications and
    services. CCOC''s dedication to customer support, security, and value led it to
    evaluate and select Linux as the platform of choice for its major applications,
    including email, Oracle databases, bank teller applications, back office processing
    software, reporting tools, and financial applications. With Linux, CCOC gets the
    same performance as Unix on less expensive hardware without sacrificing performance
    or reliability.


    CCOC transitioned its business to Linux and established 99.999% uptime at a fraction
    of the cost of its previous Unix system. As a result, the company has reduced
    its overall hardware costs by 40%. Moving several of its Windows applications
    to Linux has also reduced administration time by 40%.


    # Hewitt Associates


