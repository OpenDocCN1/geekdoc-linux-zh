  md: '# CHAPTER 2: The Open Source Solution


    # CLUSTERING


    As mentioned previously, the Beowulf Project allows multiple individual Linux
    machines to be harnessed together in a single, high-performance cluster. Several
    commercial-grade cluster implementations are available, including Shell Exploration''s
    seismic calculations, the National Oceanographic and Atmospheric Administration''s
    (NOAA) weather predictions, and Google. Google is reported to have 15,000 Intel
    processors running Linux that are used to index more than three billion documents
    and handle 150 million searches per day. Linux clustering capabilities are outstanding
    with practical applications from finite element analysis to financial simulations.


    Clustering is enabled using special packages, Beowulf and Heartbeat. Beowulf includes
    a message-passing interface and bonding network software between parallel virtual
    machines. This provides for distributed interprocess communications and a distributed
    file system for applications that have been enabled for parallel processing. Simply
    said, it puts lots of processors on a single large task sharing data and processing
    power.


    Clustering can also be used to ensure high availability for tasks that are not
    necessarily computation-intensive but must be up the time. With a high-availability
    cluster, multiple (at least two) identical systems are in place with a form of
    keep-alive monitor or "heartbeat," which monitors the health of nodes in the cluster.
    If the heartbeat fails on the primary system, a second system takes over providing
    uninterrupted service. Cluster management is not tied to any particular machine
    but management services are shared among the cluster nodes so that if any single
    point fails, the system continues uninterrupted.


    What is clustering available for? Any service that demands continuous access is
    a candidate. Take authentication, for example. An enterprise network might have
    thousands of users who authenticate each time they access network resources. If
    the authentication goes down, everyone is prevented from getting to what they
    need. High availability ensures that authentication is always possible. E-commerce
    applications, DHCP, FTP, and high-traffic download sites are also candidates for
    clustering. Linux clustering capabilities provide both powerful parallel processing
    and enterprise-class high availability at a relatively low cost.


