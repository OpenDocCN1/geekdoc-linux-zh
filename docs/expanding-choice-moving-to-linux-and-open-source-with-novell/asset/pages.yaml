    # Background


    Before describing what solutions are available, it''s worth taking a little time
    to outline email architecture. Email solutions generally are not a single application
    package on a single machine, but are a distributed collection of interconnected
    services that require multiple elements to get mail from one point to another.
    This distributed nature provides some flexibility when considering how to deploy
    or implement email. The common elements of a mail solution include the following:


    +   * SMTP message transfer agents—Include Simple Mail Transfer Protocol (SMTP)
    agents that act as mail carriers, transferring mail from one location to another.
    These processes are responsible for directing outgoing mail to other SMTP agents
    in other locations. They are also responsible for directing incoming mail from
    other locations to a local POP or IMAP server.


    +   * POP/IMAP message transfer agents—Post Office Protocol (POP) and Internet
    Message Access Protocol (IMAP) agents transfer mail in user-specific message stores
    (sometimes called post offices) to individual user clients. POP and IMAP function
    slightly differently in that with POP, all messages are moved from the message
    store to the message client. With IMAP, messages can be retained at the message
    store for access and manipulation.


    +   * DNS—Domain name servers act as local or Internet-wide lookup tables for
    SMTP agents. Using DNS, SMTP agents can determine the correct IP address of the
    receiving SMTP agent based on the domain name of the email address.


    +   * LDAP—Lightweight Directory Access Protocol (LDAP) directories are often
    used as a control list, authorizing access to message transfer agents (MTAs).
    LDAP directories are also used as white pages to look up email addresses for individuals.


    +   * Email clients—Client applications interact with POP/IMAP message transfer
    agents (or servers as they are often called) to send, retrieve, and organize email
    and email attachments.


    +   * Web access—A common mail requirement is the capability to access email from
    any location without a mail client. This is made possible using a combination
    of web server and web-based mail access services.'
