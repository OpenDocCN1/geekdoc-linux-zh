    Artificial Intelligence Lab through the 70s and early 80s when software (especially
    in academia) was generously shared with anyone who was interested. Source code
    was also included, recognition was in the form of credits in the header files,
    and solutions were freely available. In this spirit, the University of California
    at Berkeley became the focal point for Unix development and the major source of
    free software with the Berkeley Software Distribution (BSD).


    Around 1984, AT&T sued UC Berkeley for copyright infringement and set the price
    of Unix (which had been close to free) at $100,000. In the general time frame,
    Stallman resigned his position at MIT to head the GNU Project and issued the GNU
    Manifesto in an effort to continue the free distribution of Unix. GNU (a recursive
    acronym for GNU is Not Unix) is a complete Unix-style operating system that is
    “free software.” Stallman obtained legal counsel and formulated what has come
    to be the commonly used template for open licensing, the GNU General Public License,
    or GPL.


    The GPL basically protects the rights of anyone to use, modify, and distribute
    software. Stallman''s objectives are freedom to run software for any purpose,
    freedom to study source code and modify it for any need, freedom to pass it on,
    and freedom to build the community by making any modifications available to all
    parties. If you benefit from the community, they should benefit from your work.


    The “freedom to build the community” objective is the restrictive portion of the
    GPL. In practice, any code that is modified, enhanced, or altered in any way must
    also be subject to the same license. In other words, you can have the software,
    modify it, and give it away, but you must make your modifications available to
    the public, where the same freedoms are attached. This has been some-times referred
    to as the “viral” effect, as GPL software and anything it touches becomes subject
    to the same license.


    Debates have swirled around the word “free,” mostly because of common perceptions
    and the unique nature of the GPL. The adage is it’s free as in free speech, not
    free beer; free as in libre, not free as gratis. Stallman has been characterized
    as religiously zealous about perpetating software freedom and there is excellent
    information online about the history and sometimes rocky evolution of free software.


    Here’s just a note of clarification on the term open source. Software originally
    released under the GPL was termed “free software as a heritage of Stallman’s “Free
    Software Foundation.” But several factors, including confusion over meanings of
