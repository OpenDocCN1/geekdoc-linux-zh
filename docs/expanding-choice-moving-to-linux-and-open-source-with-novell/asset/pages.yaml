  md: 'FIGURE 3.9

    Proxy cache stores content closer to clients for faster access.


    ![](img/2cadc77b7c451a163bd1d5d4eb002c79_114_0.png)


    The Internet Protocol (ICP) is a standard that was developed to allow communication
    between caching servers for the purpose of creating multiple-level caches that
    can accommodate complex caching requirements. A caching solution can include firewalls
    for protection of clients and data. Caching hierarchies can be architected to
    pull content from multiple sources (external and internal), providing high-speed
    access to popular objects or pages with a minimum of latency. Cache mechanisms
    exist that check make sure that content is current or fresh and that new requests
    are initiated if content is dated or stale.


    The most popular open source caching solution is Squid. Squid is an open source,
    proxy-cache server that runs on Linux and supports proxying and caching of HTTP,
    FTP, and other URLs, allowing for Secure Sockets Layer (SSL) for encrypted sessions,
    ICP, and cache hierarchies, and a cache management interface with logging. You
    can find more information on Squid at http://www.squid-cache.org/


    +   - The most common form of content protection from outside access is a firewall.
    A basic firewall can be constructed using Network Address Translation (NAT), which
    comes with every standard Linux distribution. A firewall is simply a server with
    two network adapter cards—one connected to the internal network and the other
    connected to the external network or the Internet; all traffic from inside to
    outside passes through this server. Using a technique known as masquerading, IP
    headers from internal packets going out are rewritten making them appear to all
    come from one address—the firewall. Reply packets from the outside are translated
    back and forwarded to the internal machine that sent the request. This makes it
    difficult for probing outside machines to ever find, let alone access, internal
    machines for destructive purposes. NAT also provides port forwarding, making it
    possible for IP packets written to a'
