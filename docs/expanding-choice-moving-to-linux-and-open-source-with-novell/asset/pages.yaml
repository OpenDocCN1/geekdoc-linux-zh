    # Mono


    .NET was designed as a rapid application development platform that was to simplify
    programming by allowing developers to write applications without concern for network
    services or operating systems. The idea was, you write modular application components
    in any language and they run on any operating system, accessing Internet and networking
    services. This was accomplished by creating a common language infrastructure,
    which is really a type of virtual machine. Different programming languages are
    converted into a common intermediate language (CIL) that is run by the virtual
    machine. It''s a great idea with only one flow—the only family of operating systems
    that it supports Windows.


    Mono was developed as a more inclusive, open source solution with the capability
    to accommodate Unix and Linux as well as Windows. The objective is to enable Unix/Linux
    developers to build and deploy applications that work on all platforms, including
    Windows, Unix/Linux, NetWare, and Mac OS. Prob the biggest benefit to Mono is
    that it allows applications written to .NET to run on Unix and Linux. Developers
    don''t have to make exclusive decisions about which operating systems to support
    and can focus on multisystem solutions that meet market needs regardless of platform.


    Mono includes (.NET) a common language infrastructure (CLI) virtual machine. The
    CLI virtual machine includes a class loader, just-in-time compiler, and a garbage
    collection runtime. It also includes class libraries (both .NET and Mono) that
    can work with any supported language and a compiler for the'
