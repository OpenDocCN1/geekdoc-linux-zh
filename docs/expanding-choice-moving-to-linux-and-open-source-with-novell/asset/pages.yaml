  md: '# CHAPTER 3: Open Source in the Real World


    In essence, a hyperthreading-equipped processor appears as two logical processors
    to an application. Depending on the application logic, execution on two logical
    processors can provide better overall performance.


    Multithreaded or SMP-enabled applications can automatically take advantage of
