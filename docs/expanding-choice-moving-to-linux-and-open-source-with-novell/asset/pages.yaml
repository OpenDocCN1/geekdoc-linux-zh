  md: 'Apache Group, with membership extended to any interested individual.

    An email voting system was instituted and issues are voted on by Apache Group
    members. Those who have contributed code can vote on any issue and votes are binding;
    other members can vote to voice an opinion. The BSD (Berkeley Software Distribution)
    structure consists of an inner core of committers who control what goes into code.
    Developers submit code to the committers, who then present it to the inner core
    for approval. The organization structure around the scripting language Perl was
    described as the “pumpkin holder system,” where lead responsibility for what is
    added to the code is passed around the inner core of developers as a rotating
    responsibility. In each of these open source processes, there is a method for
    submitting code and an informally established system of responsibility.


    +   - Development infrastructure—Thanks in part to open source collaboration,
    several development infrastructures exist in which open source projects can be
    created, stored, updated, and managed online. Open source communities like those
    hosted at sourceforge.net have access to Concurrent Versioning System (CVS) for
    managing versions of code, tracking systems for bugs, support requests, feature
    requests, and patches, plus online forums and more. Even open source development
    tools such as editors and compilers are available, as are scripting and programming
    languages.


    +   - Code forking—In his paper, Raymond contrasts two methods of software development,
    labeling them the cathedral and the bazaar. Cathedralstyle development, the end
    product is visualized from the beginning with without much input from the intended
    audience. In the bazaar or open style, form and features evolve amid input from
    both developing and using the software in what sometimes appears to be a chaotic
    process. A principle that facilitates potential conflicts in this bazaar environment
    is forking. If there is disagreement by one or more parties as to the direction
    of the code, any party is free to take the existing code at that point and create
    a new code path. Whether the new code lives or depends on the value that the new
    direction brings to the community. The new path might gain enough momentum so
