    # Server Services


    Linux, as an operating system, has appeal across a broad spectrum from embedded
    devices to mainframes. There is, however, superset of enhanced services that are
    available for mission-critical applications. Two open source projects that have
    evolved to become significant elements of an enterprise-class IT infrastructure
    are Beowulf and Samba.


    # BEOWULF


    Beowulf is a commodity-based cluster system designed as a low-cost alternative
    to large mainframes or supercomputers. A cluster is a collection of independent
    computers that are combined and connected to form a single unified system for
    high-performance computing or to provide high availability.


    Donald Becker at NASA started the Beowulf Project in 1994 for solving highly computational
    problems for Earth and Space Sciences projects. Using off-shelf hardware connected
    via Ethernet, Becker was able to build a 16-node cluster that immediately was
    of interest to universities and research institutions. Succeeding implementations
    of Beowulf have provided cluster-computing solutions that rival those of the fastest
    supercomputers.


    Today, Linux is the operating system choice for Beowulf clusters (called Beowulfs).
    Beowulf is managed and enhanced through an open source community (http://www.beowulf.org)
    and consists of a number of pieces of software that are added to Linux. The Beowulf
    architecture is flexible and accommodates a broad range of applications ranging
    from science to engineering to finance, including financial market modeling, weather
    analysis, simulations, biotechnology, data mining, and more. For an application
    to take advantage of cluster processing, it must be enabled for parallel processing,
    which allows computing tasks to be divided among multiple computers with messages
    between them.'
