    to make Linux and open source a viable and preferred alternative at the data center.


    # A Transition Strategy for the Desktop


    Moving completely to Linux and open source at the desktop is something that is
    viable, feasible, and practical. Novell Consulting has defined an established
    approach and refined methods for migration and the process has been fully tested
    with Novell and other customers. This section summarizes a general plan for moving
    from a proprietary desktop to an open source desktop and details some of the tools
    that are available for doing so.


    "Proprietary desktop," and by large, refers to Windows—everything from Windows
    95 (which still exists in some organizations) to Windows 98, Windows Me, Windows
    XP, Windows NT, Windows 2000, and even Windows 2003. The differences between these
    desktops can be significant, and if organizations are working with multiple Windows
    versions in-house, the opportunity to consolidate to a single platform that can
    be centrally and uniformly managed is valuable. Some organizations might also
    be running the Sun desktop, which has some of the same management benefits of
    an open source desktop, but not the flexibility.


    A transition plan should, in most cases, consist of a phased approach. A complete
    and abrupt change of platform, applications, and services can introduce so many
    variables that user productivity grads to a halt. In addition, IT management and
    support staff can be overwhelmed with help desk calls, requests for training,
    and resource emergencies. In general, at least two phases should be considered,
    and these should be differentiated by applications and operating system services.
    The order in which these two phases should be implemented depends on the needs
    and requirements of your organization, and in most cases, the open source applications
    will be implemented first.


