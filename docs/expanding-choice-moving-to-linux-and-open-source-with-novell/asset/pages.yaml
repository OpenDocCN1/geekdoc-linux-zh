    server model. Xfree86 is an open source implementation of X that consists of a
    set of client libraries to write X applications in which client and server communicate
    via the X protocol (http://www.xfree86.org).


    # MOZILLA


    Mozilla, as has been mentioned, originated with the release of Netscape Communicator
    source code to the public. Eric Raymond''s philosophy gained traction at Netscape
    during the time that Microsoft was foisting Internet Explorer on the market. The
    Mozilla platform enables more than just a browser and includes an email client,
