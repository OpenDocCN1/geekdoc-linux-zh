    # File Services


    File sharing was the original inspiration for networking. Novell originated with
    the need to share files between Unix, CPM, and DOS operating systems. The simplest
    solution was an independent file "server" that allowed file access from each of
    the three different "clients." The Novell NetWare file server was born, and the
    wave of connectivity that ensued was phenomenal. Early file services consisted
    of both client/server and peer-to-peer connections in a local area network (LAN)
    using the IPX protocol.


    Today, the area of file services covers a vast collection of protocols, across
    multiple types of platforms, on different devices, distributed both locally and
    globally through VPNs and the Internet. In many enterprise environments, there
    is a need to share files based on different file formats, on different platforms,
    accessible from different clients with the need for seamless connectivity. Several
    open source solutions, including Samba, iFolder, and Linux, allow you to do just
    that.


