    When it comes to high-performance computing on Linux, each high-performance cluster
    consists of one master and as many slave nodes as needed. Some of today''s largest
    clusters have over 10,000 nodes. All nodes should be the same architecture (Intel,
    Apple, and so on) and for optimal performance, the hardware configurations should
    be identical (a slow node can slow down the entire cluster). Because the master
    node performs management functions, more RAM and faster network, processor, and
    disk speeds are highly recommended for better performance.'
