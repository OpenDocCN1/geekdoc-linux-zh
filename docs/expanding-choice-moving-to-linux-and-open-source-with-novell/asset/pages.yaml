  md: '# CHAPTER 3: Open Source in the Real World


    running on various platforms can use web services to exchange data over computer
    networks like the Internet. This interoperability is due to the use of open standards.


    Perhaps an illustration will make it more clear. If the core of an application
    can be compared to a TV studio—the place where real images are created—then web
    services can be likened to the network of transmission services that send image
    signals anywhere in the world to be viewed on individual TV sets. TV sets vary
    in size and type, but image reception is based on a fairly common standard or
    two. The image traverse from studio to TV set can vary dramatically. Images can
    be converted, compressed, and encoded; with extra information and ratings; transmitted
    through wire, satellite, microwave; held for delay or retransmission at a local
    broadcast facility; then transmitted to an endpoint where it might again be converted,
    unencrypted, or decompressed. Web services can be likened to all the processes,
    services, and standards that take the image from the studio to the TV set. It
    is a collection of protocols and standards that govern the exchange of data to,
    and across applications to provide a universe of possible services using the Internet
    as the infrastructure. The basic idea is that an application component, function,
    or process developed to run on a client or server can communicate with (take input,
    send output) another “service” (application/function/process) across the Internet.
    These “services” can be aggregated into collections to create hybrid services;
    they can broadcast their availability for use or search for other services; they
    can tap into legacy applications or enterprise software. Web services by design
    are flexible and accommodating, yet provide a framework and components for establishing
    business processes based on rules and policies.


    Here''s an example of a simple solution built using web services. A Fortune 500
    company purchases goods and services at a cost of about $1 billion per year, and
    in the course of paying bills, processes over 220,000 purchase orders. Historically,
    purchase orders were manually processed through the company’s ERP system upon
    receiving paper invoices. With the existing ERP system in place, a web services
    solution was created that provides paperless invoice submittal by vendors, self-service
    invoice and payment tracking, and automated processes for problem invoices based
    on definable business rules and policies. XML connectors were created to query
    and populate the ERP system. These connectors and the processing of input/output
    are managed on a web application server. Invoice data in XML format is transmitted
    to web servers, where it is displayed in formats specific to viewing devices.
    The entire system is secured by directory-based authentication that is again with
    in legacy applications. This particular web services-based solution resulted in
    reduced headcount, a decrease in problem invoice turnaround from 30 days to 10,
    plus a net increase in income for discounts received on early payments.'
