  md: '# CHAPTER 2: The Open Source Solution


    # Web Applications and Services


    Moving from the operating system toward applications, there are several open source
    solutions that are available for the creation of applications, such as web application
    development components and tools. Two major web services are Apache and JBoss.


    # APACHE HTTP SERVER


    The Apache Web Server (its roots were detailed earlier) is the leading HTTP server
    on the Internet today, hosting over 67% of the websites according to http://www.netcafi.com.
    Apache is open source with versions running on Linux, BSD, Unix, NetWare, and
    Windows, as well as other platforms. Apache includes a powerful feature set with
    scripting, authentication, proxy, and logging capabilities. Popular features include
    multihoming, the capability to host multiple sites on the same machine, and the
    capability to password protect pages. Apache is also highly configurable and extensible
    for third-party customization and modules. Apache has been termed the killer application
    for the Internet. The Apache community is located at http://httpd.apache.org.


    # JBOSS


    JBoss is a Java-based application server. In the Web sense, an application server
    is a collection of protocols and services that exchange data between applications.
    Applications are often written in different languages and run on different platforms,
    but as long as they are based on open standards, an application server will support
    them with querying, formatting, repackaging, and customizing content for consumption.


    JBoss was designed to be an open source application server that supports the entire
    Java 2 Enterprise Edition (J2EE) suite of services, including Java Database Connectivity
    (JDBC), Enterprise Java Beans, Java Servlets, and Java Server Pages (JSP), as
    well as other content standards such as Extensible Markup Language (XML). With
    JBoss, distributed applications can be developed that are portable across platforms,
    scalable, and secure. JBoss can be used on any platform that supports Java.


    JBoss Application Server is owned and supported by JBoss, Inc. (http://www.jboss.org),
    an employee-owned company backed by venture capital and Intel. JBoss provides
    a line of middleware products and consulting services that support the development
    of JBoss Application Server.


