- img_proc: true
  md: 'Toward the end of the 1970s, an important moment occurred when the Department
    of Defense (DOD) announced that its Advanced Research Projects Agency would use
    Unix and would base its version on the Berkeley software. This achievement gave
    Unix a national name and put a feather in the cap of the Berkeley system. One
    of the demands placed by the DOD on the operating system was for networking, and
    Unix thus moved further along the line of technological advancements.


    Bill Joy, in the meantime, left the campus setting and became one of the founding
    members of Sun Microsystems. The workstations were a derivative of BSD known as
    the Sun Operating System, or SunOS.


    In 1988, Sun Microsystems and AT&T joined forces to rewrite Unix into System V,
    release 4.0. Other companies, including IBM and Digital Equipment, fearing of
    losing their positions in the Unix marketplace, countered by forming their own
    standards to come up with a guideline for Unix. Both groups incorporated BSD in
    their guidelines, but still managed to come up with different versions of System
    V.


    In April 1991, AT&T created a spin-off company called Unix Laboratories (USL)
    to market and continue development of Unix. Immediately, Novell bought into the
    company. Later that year, a joint product, UnixWare, was announced that would
    combine Unix with some of the features of NetWare. It finally came to market in
    November 1992, and in December of that year, Novell purchased all of USL from
    AT&T.


    In the early 1990s, Berkeley announced that it was in the business of providing
    education and was not a commercial software house—no more editions of BSD would
    be forthcoming. Sun Microsystems, one of the largest providers of Unix in the
    world, quickly moved to the System V standards that had grown from enhancements
    to the original AT&T Unix.


    # The Roots of Open Source


    Although there are multiple forces that have contributed to the evolution of open
    source, there are two significant factors that cannot be overlooked: the General
    Public License (GPL) and the Internet.


    # GPL


    The GPL is a fundamental twist on property law that ensures that the primary right
    of an owner is to distribute—not restrict access to—software. The GNU GPL originated
    with Richard Stallman, who was a developer at the MIT'
