  md: '# CHAPTER 3: Open Source in the Real World


    continues to play a key role in the growth of security gateways and is the leading
    operating system platform for many of the existing hardware-based security gateways
    on the market today. In addition, Linux is well suited as a platform for software-based
    security gateways, and is integral to the family of security gateway services
    that are emerging fromhfill.


    As a note of interest, the common path for adoption of Linux in many organizations
    begins with edge services. At the edge of a data center or as a periphery service
    for branch or remote offices, the only noticeable effect of Linux implementation
    is to make things better. There is no inconvenience, slowdown, or new training
    required at the user end; there no disruption of service or alteration at the
    data center. Linux at the edge typically speeds up data delivery or more secure.
    There is no need to rip and replace, and existing services can often be significantly
    enhanced. If your organization is in the early stages of testing and adopting
    Linux, edge service solutions provide an ideal place to start.


    So what''s available for establishing edge services with Linux and open source?
    You have several options. First, multiple Linux/open source technologies can be
    configured to provide elements of a security gateway, including proxy/cache content
    filtering, firewall, and VPN. Or, you can select one of the commercially available
    solutions from Novell or any of the other vendors that provide security gateways.
    Again, it''s about complements and substitutes—what makes the best sense for you
    to build or buy.


    # Build Your Own


    This section examines the individual technologies from the open source community
    and the functionality that each provides:


    +   Caching/proxy—Caching is a fundamental element of fast web access. Information
    pulled from a source is temporarily stored at a location closer to the user end.
    If you request an HTML page with a few graphics, the first time the request is
    made, the content is transmitted the entire route from source to user end. If
    a cache is involved, this information is stored closer to the client (maybe in
    the browser cache or on a proxy cache within the local area network) so that with
    the next request for content, the data is much closer and the request time shrinks.
    Caches provide better perceived performance and reduce the demand for bandwidth.
    A "proxy" cache performs caching services for a number of different clients (see
    Figure 3.9).'
