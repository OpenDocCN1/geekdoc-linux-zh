  md: '# A History of Linux and the Open Source Movement


    This chapter focuses on Linux for the audience that knows very little about it.
    It looks at the history of the operating system, and the open source movement
    of which it is a part. If you have worked with Linux for some time, you might
    want to jump to the next chapter. On the other hand, if you are coming to Linux
    from a NetWare background, this chapter should help fill in some gaps in your
    knowledge.


    # Ancient History


    Long before there was Linux, there was Unix. The Unix operating system came to
    life more or less by accident. In the late 1960s, an operating system called MULTICS
    was designed by the Massachusetts Institute of Technology to run on GE mainframe
    computers. Built on banks of processors, MULTICS enabled information-sharing among
    users, although it required huge amounts of memory and ran slowly.


    Ken Thompson, working for Bell Labs, wrote a crude computer game to run on the
    mainframe. He did not like the performance the mainframe gave or the cost of running
    it. With the help of Dennis Ritchie, he rewrote the game to run on a DEC computer,
    and in the process wrote an entire operating system, as well. Several hundred
    variations have circulated about how the system came to be named what it is, but
    the most common is that it is a mnemonic derivative of MULTICS.'
  merge: -1
  pgno: 22
- img_proc: true
  md: '# CHAPTER 1 : A History of Linux and the Open Source Movement


    In 1970, Thompson and Ritchie''s operating system came to be called Unix, and
    Bell Laboratories kicked in financial support to refine the product in return
    for Thompson Ritchie adding text-processing capabilities. A side benefit of this
    arrangement was that it enabled Thompson and Ritchie to find a faster DEC machine
    on which to run their new system.


    By 1972, 10 computers were running Unix, and in 1973, Thompson and Ritchie rewrote
    the kernel from assembly language to C language—the brainchild- of Ritchie. Since
    then, Unix and C have been intertwined, and Unix''s growth is partly due to the
    transporting of the C language to other platforms. Although C is not as quick
    as assembly language, it is much more flexible and portable from one system to
    another.


    AT&T, the parent company of Bell Laboratories, was not in the computer business
    (partially because it was a utility monopoly at the time and under scrutiny from
    the government), AT&T did not actively attempt to market the product. Instead,
    AT&T offered Unix in source-code to government institutions and universities for
    a fraction of its cost. This practice led to Unix eventually working its way into
    more than 80% of the universities that had computer departments. In 1979, it was
    ported to the popular VAX minicomputers from Digital, further cementing its position
    in universities.


    The subsequent breakup of the AT&T monopoly in 1984 enabled the former giant to
    begin selling Unix openly. Although AT&T continued to work on the product and
    update it by adding refinements, some unaffiliated individuals who received early
    copies of the operating system—and could interpret the source code—took it upon
    themselves to make their own enhancements.


    Much of this independent crafting took place at the University of California,
    Berkeley. In 1975, Ken Thompson took a leave from Bell Labs and went to practice
    at Berkeley in the Department of Computer Science. It was there that he recruited
    a graduate student Bill Joy to help enhance the system. In 1977, Joy mailed out
    several free copies of his system modifications.


    While Unix was in-house at Bell, enhancements to it were noted as version numbers—Versions
    1 through 6. When AT&T began releasing it as a commercial product, system numbers
    were used instead (System III, System V and so on). The refinements done at the
    university were released as Berkeley Software Distribution, BSD (2BSD, 3BSD, and
    so on). Some of the most significant enhancements to come from Berkeley include
    the vi editor and the C shell. Others included increased filename lengths; AT&T
    accepted 14 characters for filenames, and Berkeley expanded the limit to 25.'
