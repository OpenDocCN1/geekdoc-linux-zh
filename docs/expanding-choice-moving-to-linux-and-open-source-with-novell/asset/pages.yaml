  md: '# Expanding Choice

    Moving to Linux and Open Source with Novell. Open Enterprise Server


    Linux and the open source software movement are fundamentally altering the IT
    landscape. Businesses and organizations of all sizes are finding that they can
    reduce costs, improve performance and reliability, and offer better service and
    more options to customers by implementing a carefully planned move to Linux and
    open source software.


    Expanding Choice: Moving to Linux and Open Source with Novell Open Enterprise
    Server provides information, tools, and a framework for analysis that enables
    computer professionals and decision makers to assess the benefits of implementing
    open source. It also introduces Novell Open Enterprise Server—the newest operating
    system from Novell that customers have come to know and depend upon NetWare along
    with the best features of Linux and open source software.


    +   - Gain greater cost and flexibility by deploying Linux

    - Minimize training costs by leveraging your current infrastructure

    - Use Linux and Novell Open Enterprise Server to run your line-of-business applications

    - Achieve enterprise-class scalability for applications, collaboration, file,
    print, security and storage

    - Build the foundation for a complete Linux-based server-to-desktop alternative
    to current proprietary offerings

    -Partner with the leading network vendors and gain access to the Novell global
    ecosystem

    - Mitigate business risks through proven high-availability, service-failover and
    disaster-recovery solutions

    - Manage your mixed environment of NetWare and Linux through a single web-based
    management interface and simplify IT staff workload


    # ABOUT THE AUTHORS


    manager for groupwise, WebAccess, and Wireless. He created Novell''s instant messaging
    system, GroupWise Messenger.


    Peter Clegg is a technology consultant and writer based in Orem, Utah. He has
    been writing about networking technology for more than 15 years.


    Emmet Dunlay is the certification columnist for UnixReview and author of Novell
    Certified Linux Professional Study Guide from Novell Press. He has earned 18 vendor
    certifications, written several books on Linux, Unix, and certification study,
    and has spoken at a number of conferences.


    Published with the authorization and collaboration of Novell, Inc.


