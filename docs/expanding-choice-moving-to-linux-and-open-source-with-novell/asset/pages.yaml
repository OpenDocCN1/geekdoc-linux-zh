    GGU used Novell GroupWise for email, collaboration, and personal planning. GroupWise
    also runs on Linux with the added bonus of being able to take advantage of Linux
    clustering and failover capabilities. GroupWise supports POP/IMAP clients, web
    clients, or full-featured (fat) clients for Windows, Linux, and Macintosh—a great
    mix of options for a university audience. GGU will also implement Novell NetMail
    on Linux, a pure standards-based POP/IMAP mail server that is tightly integrated
    with Novell Edirectory for identity management. GGU has also implemented Novell
    iChain for identity-based web security services, enabling authorized users—including
    employees, customers, and partners—to securely authenticate from anywhere at any
    time.'
  merge: -1
  pgno: 223
- img_proc: true
  md: '# Data Center Transition Case Study—Golden Gate University


    Because of the prevalence of Windows education and productivity desktop applications,
    and the fact that Microsoft higher education pricing is favorable, GGU is not
    migrating desktops to Linux at this time. Many GGU students can be classified
    as power users who heavily use Microsoft spreadsheet, word processing, and presentation
    programs. However, the campus does host Linux-based kiosks that are used for registration
    and web access, and some classrooms have workstations with dual-boot capabilities
    for both Windows and Linux.


    GGU will continue to support its vertical market Windows applications, such as
    advancement and alumni systems, until Linux or open source systems become available.
    Using Novell ZENworks, GGU can combine server and desktop management for both
    Linux and Windows platforms for simplified administration with a single interface
    and a common database for hardware and soft-inventory.


    # How Novell Helped


    When asked value Novell delivers as a strategic partner, Hill had quick and positive
    answers: "Novell’s product strategy matches our commitment to consolidation."
    These are some of the key benefits mentioned:


    +   - Novell helps GGU consolidate not only to a single operating system platform,
    but also to strategic relationships with fewer vendors. Novell provides Linux,
    as well as a number of required network services and applications that run on
    Linux. GGU now has one OS platform in the data center and can work with one vendor
    for platform and network services.

    - Migrating from its old networking services platform (NetWare) to Linux was easy
    with migration tools, utilities, and management similarities for both platforms.

    - Qualified, commercially available technical support for Linux by Novell was
    a major benefit. With Novell’s support of Linux and other source technologies,
    GGU had high service levels that eliminated any concerns about the quality of
    support available for an enterprise data center.

    - The end-to-end value chain from Novell was also a significant factor. With Novell’s
    open solution, Linux and open source are applied from desktop to data center.
    Identity management, network services, web services, application and desktop platforms,
    edge services—the entire chain is integrated, supported, and managed through Novell
    products.'
  merge: -1
  pgno: 224
- img_proc: true
  md: '# Smooth Transition


    Golden Gate did experience some positive surprises. Originally, the plan was to
    use only Linux and open source for web servers and exporting database applications.
    However, after researching the solutions available, GGU was able to implement
    a broad range of Linux-based, open source services, including IT firewall, intrusion
    detection, and more.


    GGU has simplified IT management with the staff sharing the same skill set and
    able to perform a broad range of services. This has eased workloads and provides
    human backup and failover options not previously available.


    # Novell Open Source Transition Case Study


    Novell believes in using its products. It has internally rolled out every new
    version of NetWare, moved to WordPerfect when it acquired that company, transferred
    all its websites when it adopted Apache; even before the SUSE acquisition, it
    was well into the process of moving network and edge services to Linux; and when
    embracing open source, it moved all of its desktops to OpenOffice.org. This move
    has saved Novell almost a million dollars per year in licensing fees to Microsoft.


    The Novell environment includes users that vary widely in technical expertise,
    organizational roles, and application needs. The 5,000+ users have approximately
    12,000 workstations—more than half of which are laptops. The complexity of such
    an environment has given Novell ideal opportunities for testing a wide range of
    possibilities with Linux desktop adoption.


    This section takes a look at Novell''s migration to OpenOffice.org, the Novell
    Linux Desktop, and Linux at the data center, and outlines the steps taken, showing
    what worked and what didn''t. The experience was similar to Golden Gate University
    in the surprising smoothness with such an extensive change was made. Novell Desktop
    and data center migration strategies were separate and involved planning and direction
    setting, as depicted in Figure A.1.'
  merge: -1
  pgno: 225
- img_proc: true
  md: '# Novell Open Source Transition Case Study


    FIGURE A.1

    Novell Desktop and data center migration strategies.


    ![](img/2cadc77b7c451a163bd1d5d4eb002c79_226_0.png)


    The savings and advantages have been substantial, and if they benefit a global
    enterprise company such as Novell, other companies can enjoy the same gains.


    # The Desktop


    The first phase of migration to Linux on the desktop was to move from Microsoft
    Office products to open source tools. Moving to OpenOffice.org allowed users to
    make a gradual transition to open source without major disruptions. The Windows
    operating system remained in place and Microsoft Office was retained temporarily
    after OpenOffice.org was installed in the event users needed to revert back for
    any reason.


    The similarities of OpenOffice.org and Microsoft Office allowed users to start
    using OpenOffice.org immediately without difficulty or much of a learning curve.
    Microsoft Office documents could be opened in OpenOffice.org, modified, and then
    saved in Microsoft Office format if needed.


    OpenOffice.org migration became a testing ground for the larger Linux desktop
    migration. It had many of the change management activities and requirements—enterprise-wide
    communications, user training and support, and license management—but with much
    less risk and complexity. IS&F (Novell''s IT group) was able to develop its migration
    processes and use this "safe" project to understand how the business would react.
    It also eased users into the full migration.


    As the next phase began and users migrated to the Novell Linux Desktop, they were
    already comfortable with OpenOffice.org as their main productivity application
    suite. Novell found that OpenOffice.org users needed to be trained in policies
    for sharing files. The Document Conversion team defined the'
  merge: -1
  pgno: 226
- img_proc: true
  md: '# APPENDIX A: Open Source Case Studies


    standards for sharing documents inside and outside Novell and then submitted them
    to the executive steering committee for approval and enforcement.


    These standards were as follows:


    +   - Use native OpenOffice.org file formats for internal collaboration.

    - Use PDF files for distributing read-only information to customers and the press.

    - Use Microsoft formats when collaborating with external vendors and partners
    who don''t use OpenOffice.org.


    The question of whether to convert documents and templates to OpenOffice.org formats
    was also a concern. Team members on the Document Conversion team decided that
    mass conversion would not be necessary because OpenOffice.org can read Microsoft
    Office formats. Instead, the team created a decision tree to help users prioritize
    conversions. These priorities were based primarily on whether the document was
    in active use and whether it was a template.


    Novell began its Linux desktop migration in mid-2003. IS&T recruited 160 users
    from all parts of the business to participate in an early adopter program. Their
    goal was to work through any issues and challenges that initially occurred in
    the process of doing their job on a Linux desktop. Early challenges related to
    hardware drivers (for example, wireless), tools (for example, CD burner), and
    applications. Using combined technology from Novell, Ximian, and SUSE Linux, these
    challenges were quickly overcome. The drivers, tools, and applications are now
    widely available and IS&T created a library of standard for current and legacy
    desktop/notebook platforms.


    An applications team was created and tasked with determining the best route for
    migrating each business function to new, Linux-based, and open source applications.
    Having canvassed user needs, the team evaluated and prioritized applications by
    asking three questions:


    +   1. Is there a native Linux version of the existing application? The simplest
    solution is a native Linux version of an existing application. For example, Novell
    iFolder, iPrint, GroupWise, and other Novell desktop clients run on Linux. Novell
    Enterprise Linux Services provides the backend functionality, running natively
    on Linux servers. These native Linux applications offered planners the quickest
    and easiest migration path with little or no adjustment required as users moved
    from Windows

    2. If a native version is not available, is there a native Linux application that
    offers equivalent functionality? Linux versions of some applications'
  merge: -1
  pgno: 227
- img_proc: true
  md: 'are still in development. Certain applications—Microsoft applications, for

    example—may never run on Linux. In these cases, a growing number of

    well-designed, third-party or open source applications often provide a

    solid alternative. Migration planners assessed the functionality and

    usability of these alternative applications, chose applications that promised

    t easiest transition and greatest productivity, and initiated training

    and support programs to help employees make the transition.


    3. If neither a native version nor an equivalent open source application is available,
    is there a viable interim solution? In the few cases

    which no reasonable alternative existed, interim solutions were chosen to

    fill the gap until a permanent Linux solution could be implemented—a

    solution that matched up with all the required business processes.

    Depending on the need, these interim solutions included terminal service-

    nas emulate Windows in a Linux environment or dual-boot systems

    that allow Linux and Windows to coexist.


    Here''s a snapshot of what happened:


    +   - Within 12 months, 90% of users were using OpenOffice.org as their main productivity
    suite, and all new internal corporate documents,

    spreadsheets, and presentations were created in OpenOffice.org formats.

    - Within 15 months, 50% of users were on the Novell Linux Desktop.

    - By the end of 18 months, the rest of the 5,000+ Novell users had moved

    to the Novell Linux Desktop.


    At this point, Novell was able to eliminate all license fees to Microsoft for
    des-ktop Windows operating systems and applications.


    As soon as Novell announced its internal initiative to migrate to Linux, top

    executives organized themselves into a cross-functional steering committee.

    This executive steering committee defined a series of business "tracks" for

    each of the key functional areas deemed critical for a successful migration.

    Company leaders organized teams to manage each track and to ensure the

    atainment of critical milestones along the migration path. Business tracks and

    team responsibilities were as follows:


    +   - External Communications—To communicate the Novell migration strategy to
    customers and explain how it will benefit them

    - Internal Communications—To promote an esprit de corps around the Linux migration,
    provide ongoing progress updates, and create feedback

    loops and user collaboration opportunities'
  merge: -1
  pgno: 228
- img_proc: true
  md: '+   Applications—To categorize user roles and application needs, develop a
    rollout strategy, and provide application support on the Novell Linux Desktop


    +   Training—To create training programs for new Linux and open source applications
    and provide how-to-guides, FAQs, and web-based reference materials


    +   Solutions—To create and document Linux and open source migration methodologies
    for OpenOffice.org, the desktop, and the data center


    +   Desktop—To install OpenOffice.org on Windows and define the Novell Linux Desktop,
    including standard applications and services, conversion tools and images, deliver
    deployment guides, and track migration progress


    +   Support—To assign and train support personnel, develop support practices,
    and maintain a knowledge base of problems and resolutions, and filter bugs and
    fixes back into the open source community


    +   Document Conversion—To create a strategy and provide resources for corporate-wide
    document and template conversion and make migrated documents available through
    knowledge repositories for OpenOffice.org applications


    +   Program Management—To coordinate project tracks, maintain project plans, verify
    progress, and report to migration and steering teams


    This strategy made possible for multiple tracks to be executed in parallel for
    maximum speed and efficiency, while giving each team the autonomy needed to pursue
    the best solutions. Lines of authority extended down from the executive committee,
    which set the overall direction for the project. The Program Management team made
    sure each team stayed on target and provided the support needed by other teams.
    Regular status reports ensured that milestones were met and that problems were
    identified and escalated to the teams best equipped to solve them.


    This coordinated planning across business tracks produced a road map for deploying
    open source software in phases, both in the data center and on the desktop, region-by-region
    and group-by-group rollouts. As a result, the IS&T support team reported an average
    of only 10 support calls per day for Linux and 2 per day for OpenOffice.org, a
    number much lower than expected.


    # The Data Center


    In the data center, the first migrated servers were FTP running on HP-UX. Other
    early candidates were Oracle databases, followed by Novell eDirectory'
  merge: -1
  pgno: 229
- img_proc: true
  md: 'and web production servers. The entire Novell web presence—external and internal—is
    now hosted on three Intel servers running Apache/Tomcat on SUSE Linux. Novell
    then developed Nterprise Linux Services, which IS&T now uses for identity management,
    resource management, and some file and print services. All these well-planned
    migrations happened without any disruptions to user productivity.


    Applications that had native Linux versions were migrated first. Novell iFolder,
    for example, is used heavily at Novell and most versions were running on NetWare
    even though iFolder was available on Linux as well as Windows. The time required
    to move all i installations from NetWare to Linux for the entire company from
    start to finish was just four hours. The process was transparent to users and
    completed without a hitch.


    Like Golden Gate University, Novell has migrated database applications that run
    on Oracle to Linux. At the time of this writing, ERP applications from Siebel
    and PeopleSoft are still in the Novell evaluation stage and pending development
    by these vendors. Novell IS&T is also developing a road map for migrating other
    data center applications to Linux, including enterprise applications as ERP, payroll,
    resource planning, and expense reporting. These migrations are more complex and
    require additional planning and coordination across business units and groups.
    Novell has proven the benefits of Linux in its own data center adoption is possible
    and worthwhile if it is well planned and focused on business benefits and priorities.


    As a development company, Novell relies heavily on bug tracking and problem reporting,
    and is is in the process of adopting Bugzilla for software development. Additionally,
    Novell will be able to eliminate an existing proprietary solution. It''s of interest
    to note that the standard version of Bugzilla is lacking certain functions that
    Novell requires. Novell is adding this functionality internally and contributing
    it to the open source community.


    Novell''s entire management interface for IS&T is web-based. Server monitoring
    and reporting applications generate real-time statistics that are aggregated to
    a central point so that staff can tell instantly whether problems exist anywhere
    in the world. As a web-enabled service, IS&T has access to all this information
    from any standard web browser from any place on the Internet with the proper authentication
    credentials.


    The benefits of Linux and open source in the data center have been substantial
    when considering any major system or application upgrade, Novell IS&T has adopted
    a strategy of "Linux unless it can''t be." When other departments in Novell acquire
    new software, IS&T requires that they investigate the Linux and open source options.
    If there is a Linux version, it is the only version IS&T will support.'
