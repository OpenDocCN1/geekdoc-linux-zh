    +   Sendmail—Sendmail is a popular open source message transfer agent for Unix
    and Linux systems. Sendmail originated at UC Berkeley in the 1980s as a rewrite
    of the ARPANET delivermail program, the first mail service for the Internet. Sendmail
    is estimated to run over 40% of the mail servers on the Internet, so it has functionality
    that is useful to a large population. Sendmail critics claim it is difficult to
    manage, and slow. Sendmail includes both SMTP and POP/IMAP agents.


    +   Postfix—Postfix was developed as a fast, easy-to-admin-alternative to Sendmail.
    It was originally developed at the IBM T.J. Watson Research facility as Vmailer
    and IBM Secure Mailer. It does not send mail from the root user, can reload settings
    without being downed, and can use a standard database to store configuration information.
