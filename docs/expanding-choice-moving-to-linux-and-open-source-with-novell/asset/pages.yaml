    # Buy Commercial


    If building your own security gateway isn’t what you had in mind, plenty of options
    are available from Novell or other providers. It’s worth noting that the leading
    commercial security gateway vendors have standardized on Linux as the operating
    system platform. Check Point Software Technologies, Symantec, Soft,,Secure, and
    CyberGuard provide hardware, software, or combination security gateway solutions
    based on Linux. IBM’s WebSphere Edge Server platform enables companies to develop
    their own solutions for the edge of the data center and the enterprise, as well
    as geographically distributed content points of presence—all with gateways and
    proxies where end-user traffic is generated.


    Emerging security gateway technologies available from commercial vendors accommodate
    endpoint solutions for wireless, thin clients, and digital assistants, as well
    as inflow monitoring and management services for Extensible Markup Language (XML)
    security with schema validation and encryption and XML routing and processing.


    The Novell Security Manager, powered by Aastoro, combines open source technologies
    with advanced proprietary engineering to provide a comprehensive Linux-based security
    gateway. The Novell Security Manager edge services include firewall, VPN, forward-reverse
    proxy-cache, virus filtering, instant messaging, web filtering, intrusion detection,
    antispam, DNS, DHCP, and more. Integrating these services with web- and directory-based
    management provides powerful security, as well as granular control for providing
    quality of service solutions and secure networks.


    # DNS/DHCP Servers and Routing


    Other common edge services that are easily handled by Linux are Domain Name System/Service
    (DNS), Dynamic Host Configuration Protocol (DHCP), and routing. Again, both of
    these services, which are usually required in almost every large network, are
    great places to begin Linux implementation, as they do not directly affect end
    users or business applications and can be seamlessly integrated.'
