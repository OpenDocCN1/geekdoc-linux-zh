    # Edge Services


    The definition of edge services has expanded to include multiple technologies
    that monitor, protect, and enhance "inflow" information—data that is in transit
    between a client and a server and includes all layers of communication. Edge services
    have evolved from predominantly firewalls to include proxy cache, VPNs, intrusion
    detection, antivirus, web filtering, and other quality-of-service (QOS) solutions.
    Moving forward, these services are increasingly being combined to create a class
    of solutions referred to as security gateways.


    Open source played a large role in the early evolution of inflow solutions with
    several technologies that provide specific security and edge services. Linux'
