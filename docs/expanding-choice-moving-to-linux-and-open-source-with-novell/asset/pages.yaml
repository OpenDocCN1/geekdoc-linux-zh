    # Migrating from a NetWare Server


    The NetWare Migration Wizard is used to migrate old NetWare 3.x servers to new
    OES NetWare servers. The Migration Wizard copies the file system and bindery objects
    from the NetWare 3.x binding to a destination Novell eDirectory tree and converts
    them to eDirectory objects.


    More information on the NetWare Migration Wizard is available in OES NetWare online
    documentation.


    # Migrating from a Windows Server


    Server consolidation is possible for Windows-based servers using the NetWare Server
    Consolidation Utility to transfer all configuration settings from the source server
    to the OES NetWare destination server.


    During the migration from NT 3.5 and 4.0, domain users—as well as local and global
    groups—are converted to eDirectory objects and placed in the eDirectory tree.
    Shared folders are moved to the NetWare file system and rights/permissions are
    converted from Windows NT settings to NetWare trustee rights.


    # NOTE


    As of this writing, a direct upgrade or migration path for Windows 2000 or XP
    is not available.'
