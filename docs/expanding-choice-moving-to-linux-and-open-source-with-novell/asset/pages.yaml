  md: '# CHAPTER 6: Installing and Upgrading to Open Enterprise Server


    # IN-PLACE UPGRADE


    The in-place upgrade updates the operating system, eDirectory, and any other NetWare
    components installed on the server.


    Before beginning the upgrade, you should install the latest support pack installed
    on the server, and perform a full backup. All deleted files are purged as part
    of the upgrade, so be certain you do not need to salvage any deleted files prior
    to the upgrade.


    For NetWare 6.5, you should have Support Pack 2 installed. For NetWare 6.0, Support
    Pack 5 (or later) should be installed. For NetWare 5.1, Support Pack 6 (or later)
    should be installed. For NetWare 4.2, Support Pack 9 (or later) should be installed.


    # NOTE


    NetWare support packs can be found at http://support.novell.com/filefinder.


    # NOTE


    Although NetWare 4.2 can be upgraded, it is known as a Down Server upgrade and
    requires a few deviations from the steps given for the other servers. A section
    on Down Server upgrade follows the coverage of other in-place upgrades.


    The upgrade to OES can be run from one of three locations:


    +   - The server console

    - Remotely from Deployment Manager

    - Remotely from iManager


    # UPGRADING FROM THE SERVER CONSOLE


    To perform an upgrade from the server console, follow these steps:


    +   1. Insert the NetWare 6.5 SP3 CD 1 (Operating System) into the server CD-ROM
    drive.

    2. From the system console (the server command line), mount the NetWare 6.5 SP3
    CD 1 (Operating System) as a NetWare volume by typing CDROM at the server console.
    Next type VOLUMES to confirm the CD-ROM is mounted.

    3. Switch to the GUI console and choose Novell, Install.

    4. Click Add at the Installed Products screen.'
