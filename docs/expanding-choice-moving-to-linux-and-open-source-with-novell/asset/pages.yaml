  md: 'How Open Source Makes Money


    # How Open Source Makes Money


    Given the market acceptance of Linux, Apache, and MySQL, it is clear that open
    source has carved a niche, and to a degree has carved away at the profits of proprietary
    software vendors. In any dynamic market, participants need to adjust to market
    forces if they want to remain viable—that''s a given, and usually isn''t any sympathy
    for vendors that fail compete effectively. But with open source, the market dynamics
    are different.


    IT organizations concerned about ongoing innovation, support, and advance- ask
    an obvious question. If the product is to a certain extent free, how do open source
    organizations make any money? CIOs and IT managers aren''t necessarily concerned
    with vendor profitability, but more importantly ensuring that open source solutions
    will be maintained, updated, supported, and enhanced to meet the demands of dynamic
    organizations.


    Without getting too ethereal, we can look at open source as a natural resource.
    Natural resources such as timber and water dont necessarily cost anything as they
    exist naturally, but there been large and profitable industries built around the
    refining, repackaging, customizing, distribution and maintenance of natural resource
    by-products.


    In a sense, open source can be viewed in the same line. The collective of open
    source producers provide a resource that, in its native form, provides a value
    to a community. This resource, if augmented or refined, is of value to a larger
    community, a community that is willing to compensate for the added value.


    There are several models for open source profitability that have been proven,
    including distribution, support, augmentation, training, and custom development.
    The following sections provide a little more detail on each with some examples.


    # Distribution


    In an open source context, the term distribution refers to the organizing and
    packaging of a particular version of software. For example, you might hear a version
    of Linux referred to the SUSE distribution, the Red Hat distribution, or the Debian
    distribution. In reality, each of these distributions contains the common Linux
    kernel released from the Linux developer community at Linux. In addition, each
    distribution vendor bundles enhancements that simplify the process of installing,
    administering, and learning Linux, such as an installation interface, install
    media, documentation, and even limited support—all in a convenient package for
    which customers are willing to compensate. Customers pay for the peace of mind
    that comes with a distribution


