  md: '# Who Are Open Source Developers?


    Linux, Apache, and several other mainstream solutions have shown that collaborative
    open source software projects can be successful. "Why open source works" is the
    big question—one that reportedly puzzled even Bill Gates. "Who can afford to do
    professional work for nothing? What hobbyist can put three man-years into programming,
    finding all the bugs, documenting his product, and distributing it for free? Gates
    once wrote.


    Steven Weber, a political science professor at UC Berkeley, has researched the
    motivations of Linux developers and summarized the reasons why they do what they
    do in the following categories (Source: The Success of Open Source, Harvard University
    Press, 2004):


    +   - As a vocation—In the process of "scratching a personal itch," developers
    solve a problem that empowers them. With virtually no distribution costs, they
    can empower others as well.


    +   - Ego boosting—The challenge of programming, solving a problem with visual
    evidence of the accomplishment, is a source of satisfaction.


    +   - Reputation—Open source developers strongly identify with the community.
    As a result, good work leads to recognition and reputation within the community—and
    potentially to better work and more reward.


    +   - Identity and belief systems—Much of the open source community culture is
    rooted in the "freedom" movement opposed by Richard Stallman, which includes principles
    of free software, free access to data, warness of authority, appreciation for
    art and fun, and judgment of value based on creation over credentials. Developers
    strongly identify with this.


    +   - The joint enemy—Uniting in benevolent purpose against a common enemy is
    at least an element of motivation for open source developers.


    +   - Art and beauty—Code either works or it doesn''t, but the elegance of a simple
    solution is art—the difference between "clean" and "ugly" code. With open source,
    a creation can be shared with others.


    From this research, you can see that open source developers are not merely geeks,
    united in a hobby-life for computers by a by-product of their cyber fun. The motivations
    for development are deep, real, and closely parallel the motivations for almost
    any other productive endeavor, whether it be motivated by profit, altruism, self-interest,
    or religious belief. Bottom line, the open source movement is real, with traction
    provided by a competent, skilled development force.'
