- img_proc: true
  md: '# CHAPTER 3: Open Source in the Real World


    Two things have changed that, for many organizations, makes network printing slightly
    more complex. These changes include the Internet with its ability to connect to
    any resource, anywhere in the world, and the emergence of Linux and its integration
    within the enterprise network arena. Technology from Novell and the open source
    community that leverages the Internet and integrates Linux printing includes Novell
    iPrint and CUPS.


    # How Internet Printing Works


    Both iPrint and CUPS are based on the Internet Printing Protocol (IPP). IPP is
    a printing protocol that is designed to work over Internet protocol (IP) and support-printer
    access control, authentication, and encryption. It is much more secure, especially
    for public networks, than earlier printing protocols. Common Unix Printing System
    (CUPS) was developed for the Unix and Linux communities as a standard printing
    system that simplifies the accessing of printers and writing of printer drivers,
    which has historically been a problem as all variants of Unix had their own printing
    system. A single printer driver written to CUPS can support a wide range of file
    formats. CUPS is an open source solution, and as of writing, the CUPS database
    includes 244 drivers for 1,233 different printers.


    Using CUPS, a printer can be identified using a uniform resource identifier (URI)
    and, if configured to so, can be accessed from any device on the Internet. Printers
    can be standalone units with built-in print servers (software/hardware combinations
    that deliver print data to a particular printer), or can be attached to workstations
    (Windows, Linux, and so forth) that include the print serving software. CUPS can
    deliver print jobs to an attached printer, to a printer on the local area network,
    or to a printer connected via IP across the Internet.


    Novell iPrint provides similar Internet printing capability, but also adds some
    useful functionality. One of the primary difficulties in printing to remote locations
    across the Internet is in locating and correctly identifying a specific printer.
    ER URI and uniform resource locator (URL) names are hard to keep track of. iPrint
    solves the problem by using Hypertext Markup Language (HTML) web-accessible map
    images that provide users with the capability to graphically search or drill down
    to find the desired printer in a specific location. Locating a printer for remote
    printing is simple and intuitive. Novell iPrinter utilities allow administrators
    to easily create custom printer map to give end users simple ways to find and
    install printers (see Figure 3.7).'
  merge: -1
  pgno: 109
- img_proc: true
  md: '# FIGURE 3.7


    Novell iPrint helps locate remote printers and automatically configures the workstation
    for printing.


    ![](img/2cadc77b7c451a163bd1d5d4eb002c79_110_0.png)


    Users printing from a workstation to a network printer can only do so if the print
    drivers for that particular printer model have been installed and configured on
    that particular workstation. Remote or unfamiliar printers tend to present driver
    location and configuration problems, which iPrint alleviates. When a user locates
    any printer hosted by iPrint, the appropriate drivers for that printer are automatically
    downloaded, installed, and configured and appear as part of standard Windows printer
    selection list. Desired driver settings can be determined by the administrator
    prior to the printer being installed on the workstation. Printing across the Internet
    becomes as easy as printing to the printer on your desk.


    # How Internet Printing Is Implemented


    You have multiple options for installing IPP-based printing using either iPrint
    or CUPS. Novell iPrint includes three components: the iPrint server software,
    the iPrint client, and the iPrint Map Designer. The iPrint server software installs
    on NetWare or Linux and handles all the IPP requests. The iPrint client is a plug-in
    for a standard browser that acts as a gateway, translating Windows print requests
    to IPP and sending those requests to the Novell iPrint server. The iPrint Map
    Designer is a browser-based design tool that administrators can use to create
    a graphical representation of the location of iPrint printers.


    Installing an iPrint server is accomplished via the standard install methods for
    each operating system. iPrint installs as part of a new server installation or
    at a later point using the iPrint install CD. When installed, iPrint is managed
    and accessible to users via a web page. To install the iPrint client, click the
    iPrint client option, and the client plug-in is installed automatically.'
