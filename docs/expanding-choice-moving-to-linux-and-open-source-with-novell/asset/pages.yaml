    +   A vendor that does not supply code for its applications


    +   A vendor that provides source code but fails to provide any essential component
    or software needed to rebuild a working binary application from that code


    Open source provides fundamental freedom of choice. Sure, there are differences
    in distributions and features, but the fact that code is open and available means
    that in the majority of cases, good features and enhancements will eventually
    merged with the mainstream code. Several elements of open source reduce the probability
    of vendor lock-in. These include open standards, application portability, and
    alternative selection:


    +   Open standards—Support for open standards and being open standards-based can
    be completely different things. Hundreds of examples exist in which a solution
    that accommodates a standard by conversion, tunneling, or mapping breaks down
    when a new version arrives, the "patch" must be flexed to conform to proposed
    standard requirements. Although standards themselves are sometimes fluid, there
    is more longevity, momentum, support, and compatibility when a solution is based
    on open standards. If an implemented solution is only open standards-compliant,
    any changes such as adding new components, upgrading applications, making new
    connections, and so on require reimplementing the original solution at additional
    cost. If the source-solution doesn''t flex, you''re locked in.


    Internet mail is a good example. Microsoft Outlook and Exchange, although compliant
    with mail standards such as POP and IMAP, are not based on them. Therefore, integrating
    other standards-based mail systems in the event of a merger or acquisition takes
    a lot of work. They don''t seamlessly interoperate, and the net result is usually
    a complete conversion of one system to another. If you convert to Exchange, you''ve
    solved the immediate problem, but it will resurface again at the next reorganization.'
