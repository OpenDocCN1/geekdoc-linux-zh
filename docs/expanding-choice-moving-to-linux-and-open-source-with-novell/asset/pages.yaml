  md: 'In the simplest web services case, there is a provider, a consumer, and a registry.
    A web service provider is an organization that creates and hosts a web service.
    Typically, a provider publishes information about its organization and the services
    it offers in a web service registry that can be queried by consumers. A web service
    consumer finds a web service (typically by querying a registry), then runs the
    service by establishing a connection to the provider (called binding to a web
    service). A web service registry is a collection of business and service information
    that is readily accessible to providers and consumers, through programmatic publishing
    and querying interfaces.


    Requests for web services and responses from them are made using Simple Object
    Access Protocol (SOAP), a standardized XML-based messaging protocol. These requests
    and responses are embedded in HTTP so the interaction between service/application/provider/consumer
    can take place across the Internet. A web service performs the application logic
    for a particular request and then returns any application output in the form of
    another SOAP message embedded in an HTTP response. To specify information about
    a web service in a standard format, the provider creates a Web Description Language
    (WSDL) document describing its characteristics. WSDL is also an XML-based format.


    The success of web services is rooted in the fact that they are based on common
    industry standards—standards that have evolved over time and have been established
    through a process of testing and implementation that is not controlled by a single
    group or vendor. Standards enable portability across platforms, integration with
    a vast selection of other applications, and consistency for development and reuse.
    Web services typically include J2EE, XML, SOAP, WSDL, and UDDI:


    +   - J2EE—Java 2 Platform, Enterprise Edition (J2EE) is the platform for building
    distributed enterprise applications using Java technology. The platform consists
    of an application server or servlet container that manages and coordinates the
    execution of Java servlets, Java Server Pages (JSPs), Enterprise Java Beans (EJB),
    and other interfaces and services. J2EE is not operating system- or hardware-dependent
    and provides for distributed processing across locations and service platforms.


    +   - XML—Extensible Markup Language (XML) is a standard for the definition and
    description of data in context. XML tags describe what particular selection of
    text represents and how it relates to other text in the same group or hierarchy.
    XML makes data and its meaning portable for consumption by other processes and
    displayable across a wide range of devices in a variety of formats. XML is an
    important web services standard, as it is used both for SOAP and WSDL.'
  merge: -1
  pgno: 128
- img_proc: true
  md: '# CHAPTER 3: Open Source in the Real World


    +   - SOAP—Simple Object Access Protocol (SOAP) is an XML-based message protocol
    for invoking web services in a decentralized, distributed environment. SOAP''s
    text-based format and XML-like syntax provide a simple mechanism for process-to-process
    information exchange and invoking services across the Web. SOAP protocol provides
    a framework that describes what is in a message (envelope), how to process it
    (rules for expressing datatypes), and a standard for expressing remote procedure
    calls.


    +   - WSDL—Web Services Description Language (WSDL) is a protocol for describing
    the capabilities of a web service, including the protocols and formats used by
    the service. WSDL is XML-like in format and describes network services with either
    document- or procedure-oriented information about what a web service is, how to
    establish communication, and where it is located.


    +   - UDDI—Universal Discovery and Directory Integration (UDDI) is a standard
    for registering and discovering web services. It defines a directory of contact
    information and a catalog of available web services. UDDI defines a framework
    that enables services to discover each other, define how they interact over the
    Internet, and share information in a global registry. The registry includes business
    entity information (name, category, location, and so on), service information
    (category, communication specifications, and so on), and technical information
    (request/response, security, other metadata).


