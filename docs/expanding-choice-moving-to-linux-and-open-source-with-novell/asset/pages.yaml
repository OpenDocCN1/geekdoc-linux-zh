    source desktop solutions include desktop interfaces (GNOME, KDE), an office productivity
    suite (OpenOffice), client libraries (Xfree86), and a client application platform
    (Mozilla).


    # GNOME


    The GNU Network Object Model Environment, or GNOME, is a graphical desktop environment
    for end users running Linux or Unix. The GNOME desktop project was started in
    1997 by Miguel de Icaza, and in addition to providing a desktop, provides a framework
    for creating desktop applications. Most commercial Linux distributions include
    the GNOME desktop as well as KDE. More information on GNOME is found at http://www.gnome.org.


    # KDE


    K Desktop Environment (KDE) originated with Mattias Ettrich in 1996 at the University
    of Tuebingen as an effort to provide a desktop for Linux in which all'
