    operating system provides the following features:


    +   - User interface—Methods for interacting with an operating system, including
    BASH


    +   - Job management—Coordination of all operations and computer processes


    +   - Data management—Tracking and management of all data on a computer and attached
    devices


    +   - Device management—Control of all peripheral devices, including disk drives,
    printers, network adapters, monitors, keyboards, and so on


    +   - Security—Mechanisms for restricting access to data and devices by authorized
    users


    The following are just a few of the general, high-level Linux services available:


    +   - File system support—ext, JFS, Reiser, and more than 15 other different file
    systems


    +   - Printing—Configuration, print-job interpretation, and printer sharing


    +   - Network services—Basic protocols and services that connect computers:


    +   - TCP/IP—Transmission Control/Internet Protocol/Protocol (manages, assemblies,
    and transmits messages between computers)


    +   - DNS—Domain Name System/Service(matches IP addresses to computer names)


    +   - DHCP—Dynamic Host Configuration Protocol (shares and assigns IP addresses)


    +   - FTP—File Transfer Protocol (transfers files between computers over TCP/IP
    network)


    +   - SLP—Service Location Protocol (announces services across a network)


    +   - Security—Mechanisms include encryption and digital certificate handling:


    +   - SSL/OpenSSL—Secure Sockets Layer (encrypts data transmission)


    +   - Certification authority—Trusted source for identity verification'
