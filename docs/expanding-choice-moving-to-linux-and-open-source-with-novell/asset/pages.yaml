    # RPM Package Manager


    Red Hat Package Manager (RPM) is a streamlined process for installing, updating,
    uninstalling, verifying, and querying software packages that are installed'
  merge: -1
  pgno: 213
- img_proc: true
  md: '# Novell eDirectory


    on different machines. Linux is installed as a collection of separate files or
    packages, and RPM helps track and manage the installation of these files. Using
    RPM, administrators can build new installation images on the fly, rebuild corrupted
    or crashed systems based on their original/unique configurations, update systems
    with new features or functionality, and uninstall all or portions of a system.


    The following is a simple example of how RPM works. RPM uses a configuration database
    that includes all the information about a particular system, including the packages
    that are used to create it and each of the files that are part of a package. Package
    information includes the package name, checksums, and a list of all the dependencies
    on any other packages. A complete Linux operating system, for example, could be
    a single encapsulated file that includes many other packages, each providing a
    function or service, and each possibly requiring other packages. The RPM database
    tracks all of these dependencies and associations and makes them available for
    manual and automated management.


    To install a Linux distribution that has been configured as only a Network File
    System (NFS) server, for example, you would use RPM, select an option for preconfigured
    NFS, and install that particular configuration. If the installation should become
    corrupted, you can use RPM to rebuild it to the original state. In the course
    of time, new packages might need to be added to an existing configuration. RPM
    tracks these new additions and their dependencies, as well as any subtractions
    or deletions.


    The power of RPM is in the fact that it can be configured to automatically track
    and manage hundreds of machines with various configurations. Because Linux allows
    you to add and subtract start and stop processes without taking the system down,
    RPM can be a powerful tool for mass-updating workstations or servers across a
    network with little, if any, impact on end users. RPM includes technology that
    allows you to query systems for integrity and ensure that packages are from signed
    or authorized sources.


    Enhancements that Novell has made with RPM include the capability to install patches
    in addition to packages. This is an important feature for organizations that need
    to quickly update a process to protect against a security threat. Novell has also
    ported RPM to NetWare, where the same functionality can be used to load and unload
    NetWare loadable modules (NLMs) and update NetWare services. RPM for both Linux
    and NetWare provides advanced and powerful management tools for managing servers
    and workstations in a mixed network.'
