    # FIGURE 3.10


    A load balancing or virtual server redirects requests to the least busy web server.


    ![](img/2cadc77b7c451a163bd1d5d4eb002c79_116_0.png)


    Another method of load balancing is possible using DNS load sharing. In this case,
    multiple IP addresses are associated with the same server name (www.mycompany.com).
    Each different IP address is associated with a different physical server that
    houses the same content. With each new request to the web server, the DNS server
    sequentially cycles to the next IP address (that is, the next server) on the list
    in a round-robin fashion. If there were four web servers with different IP addresses,
    each server would service every fourth request. Load balancing using these or
    other methods makes it possible to significantly scale web-based solutions on
    Linux and open source with very little extra effort.


    Several open source technologies advanced load balancing issues. Check out the
    Eddie Project (http://eddie.sourceforge.net/), which disperses URL requests to
    different web servers based on a number of different load balancing algorithms.


    A second type of load balancing problem is relevant when using databases in which
    the number of queries is large enough to overwhelm the database server. To solve
    this, multiple database servers are configured as read-only mirrors or replicas
    or one database is configured as a writable master. As a request for queries comes
    in, the query is redirected to the least busy database server for processing.
