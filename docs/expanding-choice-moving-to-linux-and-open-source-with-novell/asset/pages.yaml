  md: '# CHAPTER 1: A History of Linux and the Open Source Movement


    Again, stack is a general term with multiple connotations, but the application
    stack is descriptive when looking at open source and especially when gauging open
    source is relevant and where it probably isn''t appropriate. For purposes of open
    source, let''s look at the concept of stack with the same pattern—lower-level,
    universally useful, standards-based elements at the bottom that support type-specific
    and sometimes unique combinations of services, proceeding up the stack to expose
    or present data for view or consumption through an application.


    As an example, consider the application stack for a web-based application or service.
    At the base of all applications and services is an operating system (OS) or kernel.
    The OS is the traffic engine that interfaces with a specific processor and chipsets
    as a start mechanism and supervisor for all processes. The OS manages processor-level
    systems, tasks, data management, device management, and security. The OS is central
    to all functions, services, and security, and exists at the base of the stack.


    # NOTE


    Marketecture (as these figures are often referred to) often have little or no
    relation to actual system architecture, so limits that prevent the feasibility
    of pushing this model too far.


    Above the OS is a collection of network services that facilitate secure data transfer,
    storage, and exchange. This list of services includes (but is not limited to)
    file transfer, file sharing, authentication, high speed and remote storage, backup,
    and more—the things that store data, move it around, and make sure that only authorized
    people can get to it.


    Data is really only valuable if it is organized—if it has context, order, or relation
    to other data. The realm of “information organization” is supported by elements
    further up the application stack in the form of databases, transaction processing,
    querying, searching, and reporting.


    Information value can only be captured if it is exposed for presentation or consumption.
    The application stack elements that enable presentation and consumption in a web-based
    paradigm are web servers, browsers, application servers, and a host of client
    and presentation services that are available.


    Spiraled through the application stack can be an assortment of utilities, applications,
    and services that provide unique or intra-/inter-stack functionality. In a distributed
    application, for example, there might be software that enhances the client/server
    interaction with added security, graphics, or task processing.'
