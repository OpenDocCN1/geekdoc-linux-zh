  md: '# Computation Clusters


    copies of each of the services installed (mail, NFS, web). These servers are connected
    together with two to three connections. The first connection is a dedicated serial
    cable that supports the Heartbeat service, which constantly monitors the status
    of each service (mail, NFS, web). If Heartbeat detects that one or more of the
    services has failed, it immediately starts the same service(s) on the second server.


    The second connection between the two clustered servers is a dedicated data connection
    for keeping drives on both systems mirrored and in sync. 100MB or gigabyte connections
    are recommended here, especially if your services are data intensive and often
    changing. If a service suddenly switches to the second machine, the data that
    it may require will be there and ready. This high-speed data connection could
    also serve the Heartbeat. Assuming these services (mail, NFS, web) are for web
    clients, there will be a third connection that links the servers to the network
    or the Internet. To play it, you should have an uninterruptible power supply (UPS)
    for each server that must be attached via UPS cables.


    Heartbeat and the application that keeps storage in sync, DRDB, are both available
    with SUSE Linux and can be installed and managed through YaST. They are also available
    with other Linux distributions or from popular Linux sites. You have the options
    of configuring failover to occur immediately upon fault detection, initiating
    a manual failover, or specifying that failover operations occur in a specific
    order according to rules based on resource priority or system availability (see
