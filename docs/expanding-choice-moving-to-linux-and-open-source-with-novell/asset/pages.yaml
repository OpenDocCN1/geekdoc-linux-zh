  md: '# Open Source Solutions


    Linux distributions are available from multiple sources. Again, a distribution
    usually consists of the core Linux operating system packaged with administration
    utilities, documentation, installation media, custom libraries, desktop interfaces,
    and common drivers. Distributions can be use-specific (for example, workstations,
    servers, or applications) or hardware platform-specific. The following sections
    discuss the most common Linux distributions and a little background for each.


    # SUSE LINUX


    SUSE’s (pronounced *soo sah*) development history includes extensive experiences
    with enterprise organizations. SUSE has both workstation and server versions of
    Linux and was used to leverage integrated and bundled software through Novell
    to provide quality solutions. These aspects all mesh with Novell’s history and
    strategic direction. This is discussed in more detail later.


    SUSE originated in Germany as a Unix consulting company. With the advent of Linux,
    SUSE evolved to provide personal and professional versions of Linux plus distributions
    that included services geared to corporate networks and enterprise use. SUSE includes
    an extensive and unique (to SUSE) program called YaST (Yet another Setup Tool)
    that has become the most powerful installation and system management tool in the
    Linux world. Driver support is excellent, and desktops are KDE and GNOME.


    All of these factors plus the company culture, market share, and market potential
    contributed to the decision for Novell to acquire SUSE (http://www.novell.com).


    # RED HAT


    Red Hat is probably the most widely known of the Linux distributors because it
    was one of the first to provide Linux in an easy-to-install package—and was the
    first Linux-centric company to go public. Formed in 1994, Red Hat specialized
    in providing Linux packaging, service, and support while keeping everything included
    in their offerings open source. Red Hat employs between 600–700 employees and
    retains developers who have contributed to the Linux community, most notably Red
    Hat Package Manager (RPM), a system for updating Linux services and utilities,
    which is open (http://www.redhat.com).


    Red Hat’s product line has evolved to provide the Red Hat Enterprise Linux (RHEL),
    several versions of Linux targeted at enterprise companies, including workstation
    (WS), advanced server (AS), and enterprise server (ES). Each of these versions
    requires license fees and an ongoing subscription fee for maintenance and support—a
    requirement that has drawn ire from customers and has been the basis for disparaging
    comparisons to Microsoft'
