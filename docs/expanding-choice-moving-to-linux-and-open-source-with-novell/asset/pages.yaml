  md: '# CHAPTER 3: Open Source in the Real World


    Now that you understand cluster basics, you can mix and match, adding servers
    and services to create any configuration that meets your needs. High-availability
    clusters can range from simple to very complex. You don''t have to mirror the
    exact services on each machine. You can specify that one service on machine A
    fails over machine B, and another service on machine A fails over machine C. If
    you don''t want the expense of duplicate hardware for every set of servers, you
    could configure one machine to be the failover recipient for several other machines.
    The chances are slim that two or three machines fail at once, overloading the
    target server. You could also have active services running on several servers
    (no idleover machines) with failover to other servers in the cluster running other
    services.


    Clustering provides a lot of flexibility for storage configuration. Instead of
    failing from one machine to another, with combinations of RAID, mirroring or striping.
    You could create a storage array with drives. These storage systems could also
    be configured to fail over to other systems, if that level of redundancy is needed.
    The possibilities are endless, and with the Internet and technologies such as
    iSCSI, a cluster can be geographically distributed.


    If you''ve ever wondered what an extra “9” of availability gives you, here''s
    a summary of how often you would be down in one year given a specific level of
    reliability. With high availability clusters on Linux, it''s easy to reach five
    9s.


    +   | 1 90.0000% 37 days

    | 2 99.0000% 3.7 days

    | 3 99.9000% 8.8 hours

    | 4 99.9900% 53 minutes

    | 5 99.9990% 5.3 minutes

    | 6 99.99999% 32 seconds


