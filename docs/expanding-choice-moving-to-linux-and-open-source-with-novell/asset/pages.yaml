    # Grid Computing


    The goal of grid computing is to create virtual systems, independent of specific
    resources (processors, memory, storage, networking), that provide computing power
    on demand. In theory, a grid system can provide as much or as little system resource
    on "needed" as required. It''s analogous to the electricity grid in which you
    only pay for what your meter says you use. Grid computing can serve one group
    or many groups, one company or many companies—the grid is not necessarily tied
    to an organizational unit, enterprise infrastructure, or geographical location.
    Linux is emerging as a key element of grid computing for many enterprise companies
    as well as industry-specific service providers.


    Here''s how it works. Linux/open source technologies contribute to the ability
    to create computing grids or solutions that can scale significantly to accommodate
    increased loads. These include load balancing, failover, multiprocessing, and
    clustering, as well as web services technologies, authentication, and management.
    Linux-centric technologies provide a high degree of flexibility for creating scalable
    combinations or grid services and are based on open standards. This flexibility
    combined with the openness makes it possible to create comprehensive or complex
    solutions that can be scaled up simply by adding more open components. These Linux
    and open source applications are like building blocks that can be interconnected,
    combined, and replicated to create global gridlike solutions that service needs
    from small to gargantuan.


    Grid computing allows you to add or subtract services or underlying hardware as
    needed. If you are running the quarterly financials report and need lots of extra
    computing power for a weekend? Pull it from the grid, a pool of resources normally
    maxed-out during the week but idle on weekends. By Monday morning, all CPU cycles
    are available again for regular use. The concept is extended to data as well,
    with applications like Real Application Cluster'
