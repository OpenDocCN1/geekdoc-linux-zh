    The important point, however, is that the concept of free or open software was
    articulated in words, framed in legalese, and has now become established as mainstream.
    At least two versions of the GPL and several other license types have evolved
    to legally define the free realm of open source.


    # Internet


    The second significant source factor is the Internet—without the Internet, open
    source wouldn’t be feasible. The World Wide Web services and the globally connected
    Internet have affected open source in two key ways. The first is a communications
    infrastructure that easily links geographically- dispersed developers in a loose
    association for a common purpose. Much has been written about the Internet as
    a catalyst for evolution because the fact that people anywhere on earth, with
    the common language of code, can organize themselves around a common need. The
    Internet provides the link, facilitates coordination, transmits communication,
    and often is key to demonstrating the value of a particular solution.


    The second key fact is that the Internet reduces software distribution costs to
    zero. With one click, productive functionality can be distributed anywhere in
    the world in real time. Eben Moglen, general counsel for the Free Software Foundation,
    postulates that current copyright is an outgrowth of industrial production and
    physical distribution. Given zero distribution costs, contributed code, and an
    established common need, is the concept of copyright for open source software
    even relevant? That’s one reason why the GPL and its variations have been termed
    the “copleft.”


    There is plenty to discuss about “free” law, the future of software as we know
    it, and the political, sociological, ethnological, and even religious ramifications
    of open source. For our purposes, let us narrow to what’s happened so far and
    the evidence that open source is indeed a viable alternative to some proprietary
    software.


