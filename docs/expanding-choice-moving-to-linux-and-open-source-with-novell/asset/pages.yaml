    # Open Source Versus Proprietary


    Between the press and blogs, you can find open source prognostications across
    the spectrum from "just the latest high-tech marketing fad" to "the end of proprietary
    software and all the companies that produce it." The reality, of course, is somewhere
    in the middle and is more a matter of evolution—a function of time and maturation.
    To be as simple as possible, open source will generally supply software moving
    along two market axes—starting at mass-market and the operating system level and
    moving to specialized niche and the application level. Open source solutions will
    move up the application stack and toward specialized applications (see Figure
    1.1).


