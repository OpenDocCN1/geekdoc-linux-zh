    # Documentation


    Early open source projects were known to light on descriptive documentation. As
    the movement has matured, reference information for open source projects has become
    more plentiful and more informative. The open source model itself is being used
    to generate documentation, training resources, and teaching aids. The most notable
    body of content is the Linux Documentation Project located at http://www.ldp.org/


    The Linux Documentation Project (LDP for short) originated in 1992 as a place
    on the World Wide Web where Linux developers could share documentation with each
    other and with those who were using their software. The LDP is maintained by a
    group of volunteers who provide a fairly extensive library of help, including
    feature man pages (feature or command documentation), guides, and frequently asked
    questions (FAQs).


    A guide usually contains lengthy treatment of a general topic, such as network
    administration, security, understanding the Linux kernel, and so on. The LDP includes
