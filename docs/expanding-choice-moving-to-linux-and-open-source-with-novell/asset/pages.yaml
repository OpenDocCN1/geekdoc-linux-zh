  md: '# CHAPTER 7


    # Administering Open Source


    At last, you arrive at the topic that is probably most critical to the entire
    success of open source integration—system administration. It is critical in two
    aspects. First, there must be management advantages to open source, both in terms
    of cost and simplicity, which make deploying or migrating worth the effort. Novell
    customer organizations have proven this is possible by implementing Linux systems
