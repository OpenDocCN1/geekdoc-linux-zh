  md: '# CHAPTER 7: Administering Open Source


    # Novell eDirectory


    Directory services are one of the most powerful yet least understood network management
    technologies. The evolution of the Internet and e-business has intensified the
    need for a viable identity management service that allows individuals and systems
    to securely interact across all types of networks—the Internet, intranets, and
    extranets; wired to wireless; corporate and public networks across leading operating
    systems. Identities of associates, customers, partners, and suppliers are validated,
    and access to specific applications and resources are easily managed through a
    secure, full-service directory service. This allows companies to build highly
    customized inter-/business directory relation-ships.


    Novell eDirectory is the industry''s most and prevalent directory technology.
    Several characteristics differentiate a true directory service from a common database
    or user identification. These characteristics are hierarchical, standards support,
    and distributed systems.


    # Hierarchy


    In 1988, the X.500 standard was established for managing online directories of
    users and resources. The X.500 standard is hierarchical, meaning that it appears
    like an inverted tree with a single trunk and branches that extend below. This
    hierarchical structure fits the world''s classification system: countries, states,
    cities, streets, houses, families, and so on. The objective is to have a directory
    organization structure that can classify any resource globally. Every resource
    or user can be classified by the company it belongs to (tree), the division it
    is in (organizational unit), the department that it belongs to (group), and its
    unique characteristics. Using a hierarchical organization structure, it is possible
    to classify and map relationships between any two users or resources—no matter
    where they physically reside.


    # Inheritance


    Hierarchy is crucially important to the second distinguishing characteristic of
    a directory service, inheritance. Objects in a tree (organizational units, groups,
    users, services, and so on) are defined by attributes—characteristics such as
    access rights or descriptive properties. Inheritance makes it possible for many
    objects lower in the tree to be assigned or “inherit” properties from other objects
    higher in the tree. For example, a group object might have a uniform resource
    locator (URL) attribute that provides 15 people in the group with access to a
    specific Internet data feed. By changing the URL attribute once at the group level,
    all 15 users automatically inherit access to the new address.'
  merge: -1
  pgno: 211
- img_proc: true
  md: '# Novell eDirectory


    Inheritance is a powerful characteristic that makes it possible to manage large
    quantities of users and resources with a few simple steps.


    # Standards Support


    The number of disparate and single-purpose user management solutions for verifying
    identity and granting access is staggering. Many applications have their own proprietary
    user database; each of the leading operating systems have their own domain methods;
    and thousands of others have been kludged together to accommodate existing IT
    environments. Integrating, synchronizing, and managing these disparate systems
    is a daunting, if not impossible, task. The evolution of an open standard provides
    true directory characteristics that are extensible or modifiable is extremely
    important. Lightweight Directory Access Protocol (LDAP) is that standard. It provides
    the capability to import or export directory objects and attributes as well as
    extend a directory schema (add new object types or properties). The capability
    to pull directories together for central management based on open standards support
    is a primary requirement for a true directory service. Open standards become increasingly
    important as disparate resources are connected across the Internet.


    # Distributed Systems


    Conceptually, a directory service appears as a central repository of resource
    information. In reality, an enterprise-level directory service must have the capability
    to be distributed both physically and virtually. To avoid a single point of failure
    (such as if all directory information were in one physical place at the time of
    a disaster), copies of a directory must be placed in different locations and linked
    in such a way that if one location goes down, all information is still accessible
    from other locations. A directory must also have the capability to be distributed
    or divided virtually so that pieces of it are available for different applications.
    For example, some object attributes such as phone number and address might be
    valuable throughout a directory network; other attributes as directory rights
    only need to be available from where the user regularly logs in. Novell eDirectory
    is distributed using replicas, partitions, and indexes.


    A true directory service then becomes the nerve center for a distributed system
    of resources. It holds attribute or characteristic information about the resources;
    it monitors status; it prevents or grants access; and it includes mechanisms to
    protect or heal itself in the event of outages. A directory can vastly simplify
    administration by consolidating all management functions to a single service.
    All applications, users, peripherals, devices, groups, and so on can be managed
    through a single interface using a directory service such as Novell eDirectory.'
  merge: -1
