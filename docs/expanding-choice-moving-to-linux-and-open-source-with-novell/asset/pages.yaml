    +   VPN—Internet Protocol Security (IPsec), a standard for encrypting and authenticating
    IP packets for portal-to-portal or end-to-end packet transmission, can also ensure
    a secure communication. The Openswan (successor to FreeS/WAN) project is an open
    source solution that uses strong encryption to ensure that packets are secure
