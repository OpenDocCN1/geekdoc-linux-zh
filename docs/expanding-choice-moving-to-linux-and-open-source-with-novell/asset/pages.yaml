    A key concept in Linux is the **package**. In Linux, a package is a single file
    that contains a list of other files that are to be installed or included as part
    of a software solution. In addition to the list of files, a software package includes
    rules indicating interdependencies or other software packages that need to be
    installed for the solution to function properly. In Linux, these packages are
    usually in the form of text files and are open for viewing and access. The ability
    to create complex solutions by assembling collections of packages is a key element
    for Linux flexibility.


    A particular Linux distribution is defined by the unique collection of packages
    that are configured by the distributor. Often, a single installation package determines
    what other packages are to be installed and automatically proceeds through the
    installation process. For example, the difference between a Red Hat distribution
    and a SUSE distribution is the collection of packages that have been configured
    to run on the Linux kernel by each distributor.


