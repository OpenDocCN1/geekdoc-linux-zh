    # # Power Workstations


    Every organization has at least one or more power users, individuals who are obsessed
    with every possible ounce of capability out of technology. It might be the finance
    guy who is modeling complex pricing models to determine optimal rate of return.
    It might be the marketing person who is mixing and messaging model after model
    to determine the target customer is and what his buying habits. It might be the
    engineer who links together spider webs of structure for finite element analysis.
    Whatever these people want flexibility, power, and control, and usually have the
    technical skills to implement whatever they find.


    Your job as IT manager should be to liberate these individuals. Support them with
    the services that they need but don''t want to worry about. You make sure they
    have connection, storage, backups, are secure from unauthorized intruders, protected
    from virus and outages, and more. At the same time, you have to ensure that all
    other IT assets are protected.


    So''s the advantage of Linux and open source to these “power users?” These advantages
    can be broken down into four categories: power, flexibility, programmability,
    and cost.


    # # Power


    Linux provides power workstations with some hefty performance capabilities. For
    starters, applications written to run on Linux or using any of the open source
    solutions, such as databases, have some great scaling options. These advantages
    were mentioned previously on the server side, but power users can take advantage
    of all the Linux scaling options, including symmetric multipcessing, NUMA, clustering,
    SANS, and more. In addition, a wide range of workstation scalability options are
    moving from the x86 hardware platform to 64-bit, and even mainframe Getting more
    power can be accomplished incrementally as needed without the cost of a complete
