  md: '# Open Source Solutions


    Mono is an open source version of .NET that was originally developed by Miguel
    de Icaza of Xiam (now Novell). Mono includes both the developer tools and infrastructure
    needed to run .NET client and server applications on platforms other than Windows.
    Mono overcomes the single biggest drawback for developers using .NET from Microsoft—the
    requirement to run on the Windows platform. By bringing the shared source release
    of the .NET framework to multiple platforms and building an open source project
    around extending it, Mono has made the strengths of .NET available to a much wider
    range of developers. The capability to develop using a variety of languages, using
    a common interface and deployable on a number of platforms, is a very compelling
    development strategy. The Mono community is based at http://www.mono-project.com.


    # Databases


    The bulk of all data has no relevance unless it is presented in context—in relation
    to other data. The majority of what we see on the Internet, whether it be news
    clips, product catalogs, directories, customer information, manufacturing statistics,
    or stock quotes, is content that is extracted from a database. Without underlying
    database services to provide relation and context as well as querying and reporting,
    what we see would be far less valuable.


    # POSTGRESQL


    PostgreSQL (pronounced post-gress-Q-L) originated with the Ingress project at
    UC Berkeley in the early 1970s. Ingress was commercialized and became the roots
    for databases Sybase, Informix, and SQL Server. After commercialization, a new
    effort was started at Berkeley called Postgres. The Postgres project evolved through
