  md: '# A Transition Strategy for the Data Center


    This committee should conduct or commission an assessment study on Linux and open
    source readiness that takes into consideration the following factors:


    +   - How well a Linux migration fits into your organization strategy and how
    ready your environment is for a Linux migration

    - What the stakeholder and business unit requirements are (business, tech-nical,
    and political)

    - Where to start—which servers, services, and applications it makes sense to migrate,
    short- and long-term

    - Whether Linux and open source services and applications are available that meet
    your needs and provide comparable (or better) features—and if not, what alternatives
    might need to be evaluated (terminal services or OS emulation, for example)

    - How servers, services, and applications, along with associated data and business
    processes, can best be migrated

    - How any interdependencies among services and applications, desktop clients,
    or other software might affect your migration plan

    - Where hardware and service consolidation opportunities exist

    - Whether your staff has the requisite skills to support a Linux environ-ment,
    and what support capabilities for maintaining and supporting Linux, over time,
    need to be considered


    Through this assessment, an implementation road map can be created that out-lines
