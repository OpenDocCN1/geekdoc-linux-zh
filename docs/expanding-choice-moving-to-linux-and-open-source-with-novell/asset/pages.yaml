  md: '# APPENDIX A: Open Source Case Studies


    As a global enterprise company, Novell has successfully implemented Linux—desktop
    to data center—and gained advantages in licensing fees, lower hardware costs,
    simplified management, and better reliability and scalability—all the standard
    Linux and open source benefits. Novell has seen firsthand why this technology
    and the services available with it to organize-organizations of all sizes. For
    Novell, eating your own dog food in the move to Linux and open source has been
    surprisingly palatable!


    # Other Businesses


    GGU is just one of the many Novell customers implementing Linux and open source
    technologies in a major way. The following are highlights of how other Novell
    customers are using Linux and open source.


    NOTE


    For more customer stories, see http://www.novell.com/success.


    # Burlington Coat Factory


    Burlington Coat Factory has been running its enterprise on Linux for several years,
    replacing the “green screens” with web-based applications. The company needed
    to replace its large-scale servers, which were obsolete, complex, and difficult
    to manage. Implementing clustered Intel servers throughout its enterprise provided
    better performance while reducing administration time.


    By running its enterprise on SUSE Linux Enterprise Server, Burlington reduced
    its hardware costs tenfold from its previous Unix environment, while creating
    a more reliable infrastructure. SUSE Linux provides greatly improved uptime, particularly
    during peak transaction times around holidays, as well as the scalability to support
    multiple Oracle databases and a variety of storage devices.


    Without SUSE Linux, we wouldn’t be as far along in deploying a heavy-duty data
    center,” said CIO Michael Prince. “We would also have been more constrained by
    costs and would have ended up spending money on a system not nearly as robust.
    SUSE Linux gives us a level of reliability that retailers could never have afforded
    before.


    # Overstock.com


    Overstock.com Inc. is an online “closeout” retailer offering discount, name-brand
    merchandise for sale over the Internet. The company offers its customers'
  merge: -1
  pgno: 231
- img_proc: true
  md: 'an opportunity to shop for bargains conveniently while offering its suppliers
    a global distribution channel. Overstock has recently expanded its technology
    to accommodate online auctions, providing an online alternative to eBay.


    "Strategically, we have three goals in selecting IT components: stability, performance,
    and, to a lesser degree, expense," said Sam Peterson, Overstock''s Director of
    Network Engineering. "Novell SUSE Linux made all three happen." Overstock.com
    has more than 70 SUSE Linux servers in production, processing millions of web
    requests a day. All internal users and external customers hit a SUSE Linux server
    when they interact with the company. Overstock.com is also developing new in-house
    applications on Linux. With the amount of software that comes with SUSE Linux,
    IT staff don''t need to seek for or compile new tools.


    Novell SUSE Linux has been simple to learn and administer. "We don''t have ''official''
    training programs for SUSE," said Jon Fullmer, Overstock''s Lead Network Engineer.
    "We simply haven''t needed one. The evolution of SUSE Linux and YaST almost eliminated
    the need for training of our IT staff. If we bring in Unix administrators, they
    can find what they need in YaST and don''t need to retrain them.'
