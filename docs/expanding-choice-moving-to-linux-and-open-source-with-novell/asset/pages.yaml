    This chapter focuses on NetWare for those who have not worked with it. It looks
    at the history of the network operating system and the history of Novell itself.
    You''ll learn about the different versions, the people who made what it is, and
    some of the tools used to administer it.


    # The History of NetWare


    In 1979, a company bearing the moniker of Novell Data System came into being in
    Utah. In 1981, this company hired three Brigham Young University graduates for
    a short-term project to come up with a way to network CPM computers so the company
    could sell more hardware. Those three were Drew Major, Dale Neibaur, and Kyle
    Powell. Together, the three—known as the SuperSet—came with a solution that served
    its purpose and set the company on a completely different path than it was expecting.


    The short-term contract employees stayed on the company and helped it grow. In
    1981, the IBM PC began to show up in the marketplace, and the small company in
    Utah first focused on marketing it with CPM machines so it could continue to sell
    them. This led to the concept of ideally creating a method to network all types
    of computers together and not just PCs and CPM machines.'
  merge: -1
  pgno: 160
- img_proc: true
  md: '# CHAPTER 4: A Brief History of NetWare


    In 1983, Novell Data System changed its name to Novell and began the move away
    from the not-so-profitable hardware business. Ray Noorda joined the company as
    president and the push to become a networking company was in full force. The first
    version of NetWare focused on a file server arrangement, wherein one central computer
    is responsible for controlling user access to files and resources.


    PCs rapidly grew in acceptance in the 1980s and spread throughout corporations,
    the need to connect them together into local area networks (LANs) grew as well.
    Novell NetWare became the facto network operating system (NOS) of choice in many
    implementations.


    Throughout the 1980s and early 1990s, the NetWare versions incremented through
    the 2.x and 3.x as more features and modularity were added. The modularity was
    made possible by including a plethora of software components that could be loaded
    and unloaded as needed. Called NetWare loadable modules (NLMs), these provided
    features to the server an as-needed.


    All versions of NetWare up and including the 3.x series used a flat-file database
    structure, known as the bindery, to hold all user and resource information. Although
    this worked well in corporate LANs, it limited the size to which the network could
    grow. Determined to break down the barriers to the enterprise, Novell released
    NetWare 4 in 1993. NetWare 4 did away with the bindery and offered the NetWare
    Directory Services (NDS) in its place.


    NDS (which came to stand for Novell Directory Services in subsequent versions)
    distributed the database of users and resources to servers across the enterprise,
    and essentially made the world its network. It was now possible for a user in
    one office to access resources on a server in another office without needing to
    log in to each server separately.


    NDS was the forefather to eDirectory, which now serves the same purpose, only
    on a much greater scale. eDirectory first appeared in 1999 and serves as a cross-platform
    directory service.


    Realizing that the Internet was a tool for networks worldwide, Novell decided
    in the mid-1990s, under the direction of John Young, to start moving away from
    the proprietary IPX/SPX protocol it was known for, and embrace TCP/IP for networking.
    NetWare 4.11, called IntraNet, offered TCP/IP as an option.


    NetWare 5 standardized upon TCP/IP by including native support for it. NetWare
    6 expanded upon this acceptance by including more utilities aimed at using the
    Internet as a tool for maintaining the network through a browser from any web-enabled
    device.'
  merge: -1
  pgno: 161
- img_proc: true
  md: 'Lastly, NetWare 6.5 expanded upon version 6 and offered the capability to deploy
