- img_proc: true
  md: '# Installing and Upgrading to Open Enterprise Server


    Open Enterprise Server (OES) is the revolutionary operating system from Novell
    that embraces open source and includes the best of everything that came before
    it. This chapter walks through the installation of it on a new operating system,
    as well as the upgrade/migration from existing operating systems.


    # Installation Considerations


    Before beginning an installation, it is important to verify that the prerequisites
    are met. This will save you not only a great deal of time, but much frustration
    as well.


    NOTE


    Before moving to any new network operating system, you should thoroughly test
    all configuration and implementation operations in a lab environment. Only after
    you are satisfied with the performance obtainable in the lab should you consider
    implementing in your production network.


    This section examines what must be present before an installation can begin and
    then walks through an installation.'
  merge: -1
  pgno: 190
- img_proc: true
  md: '# Minimum System Requirements


    To meet the minimum hardware requirements, the server needs an Intel Pentium II
    or AMD K7 processor or higher. However, Novell recommends Pentium III 700MHz or
    higher processors for multiprocessor servers.


    A minimum of 512MB of RAM must be present, and the server needs an ISO9660-compatible
    CD-ROM drive. (A bootable CD-ROM drive compatible with the El Torito specification
    is recommended for booting directly from the CD.)


    A super video graphics adapter (SVGA) or better video adapter and monitor is needed,
    as well as a keyboard and mouse.


    Although this book does not address such, it is possible in some instances—and
    always for security reasons—to run a server without direct input/output devices.
    This is known as a "headless" server.


    If installing with NetWare, Novell recommends a minimum DOS partition of 1GB on
    the hard drive, and at least 4GB for the NetWare partition—specifically the SYS:
    volume. Be certain to factor into any calculations the space needed for additional
    volumes.


    Being a server, the system will also need a network interface card (NIC). The
    server has more than one processor, HotPlug PCI, or any other similar attribute,
    you will need to have the current drivers for those items readily accessible during
    the installation.


    Lastly, if there are specific services you want the server to support, you will
    need to make certain you have the hardware needed to support those services.


    # Choosing a Path: Linux or NetWare


    Open Enterprise Server can be installed on either SUSE Linux or NetWare. Each
    platform has its own advantages and disadvantages, and in many cases, you might
    find that the best solution is to mix and match servers in your network environment.


    The biggest advantage of installing on SLES 9 is that you are able to work with
    an open source operating system. You are no longer tied to the offerings of a
    single vendor and have the ability to maximize the features of a nonproprietary
    operating system.'
  merge: -1
  pgno: 191
- img_proc: true
  md: '# Installation Considerations


    Conversely, the biggest advantage to installing on NetWare is the rich set of
    features and utilities cultivated by Novell. The NetWare network operating system
    has been tweaked with each new version to be the best on the market.


    Because this is a book on moving to open source, it is assumed that you are coming
    from NetWare, and thus the discussions that follow focus on the issues you will
    face in doing so.


    # Choosing a File System


    Open Enterprise Server is truly a product that offers you as many choices as possible.
    Not only can you choose the operating system platform on which you want to install
    OES, but you can also choose from a number of file systems.


    File systems fall into three broad categories—traditional, journaling, and virtual.
    Traditional file systems include ext2, vfat, and so on. Journaling file systems
    include ReiserFS (the SUSE default) and ext3. Virtual file systems, also known
    as Virtual Filesystem Switch (VFS), are actually hybrids that exist between the
    processes and the other file systems (traditional or journaling)


    Based upon the operating system that you select and other choices you make, a
    total of six possible file systems are available:


    +   * EXT—A traditional file system that does not support journaling

    * JFS—The journaling file system

    * NSS—A robust, journaling file system (NSS stands for Novell Storage Services)

    * POSIX—A file system mostly known for its compatibility across operating systems

    * REISER—The SUSE default, which is a journaling file system

    * XFS—A high-performance journaling file system


    NOTE


    One of the best places to get additional information about each of the file system
    types is at WikiLearn. An excellent discussion on each of the types begins at
    http://twiki.org/cgi-bin/view/Wikilearn/LinuxFilesystems.


    # eDirectory Design Considerations


    When it comes to eDirectory, the most important thing is to make certain that
    you have the latest version. OES includes Novell eDirectory v8.7.3, and you'
  merge: -1
  pgno: 192
- img_proc: true
  md: '# CHAPTER 6: Installing and Upgrading to Open Enterprise Server


    want to be certain that the rest of your network (assuming there is one already
    in existence) can support this version before deploying OES. You can download
    the latest eDirectory support packs for the other servers on your network at support.novell.com.


    When installing the eDirectory component, you will need to know the following-information:


    +   - Tree name

    - Server location within the eDirectory server

    - Administrator name and password

    - Server''s time zone

    - Time synchronization


    # Walking Through a New Installation


    Before beginning ANY installation, do a full system backup. Following that, verify
    that the data from the backup can be restored. This is your insurance policy for
    the unlikely event that you should need to revert to this configuration.


    To begin the installation of Open Enterprise Server, simply insert the first OES
    CD in the system and reboot. This starts the Deployment Manager.


    In addition to starting on boot from the CD, Deployment Manager can also be run
    within Windows 2000 or XP by summoning NWDEPLOY.EXE or NWDEPLOYBROWSER.EXE in
    the root directory of the CD. The difference between the two executables is that
    NWDEPLOY, Internet Explorer 5 or greater is needed, whereas NWDEPLOYBROWSER runs
    without the ActiveX Controls.


    Deployment Manager has three main categories:


    +   - Network preparation

    - Install/upgrade options

    - Postinstall tasks


    The three main steps to OES NetWare installation are as follows:


    +   - Configure a DOS partition if desired

    - Install the startup files and create a SYS volume.

    - Run the NetWare Installation Wizard.'
