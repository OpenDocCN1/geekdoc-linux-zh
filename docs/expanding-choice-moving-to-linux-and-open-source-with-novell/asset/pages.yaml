  md: '# CHAPTER 2: The Open Source Solution


    +   **Lower hardware costs**—In general, Linux and open source solutions are elegantly
    compact and portable, and as a result require less hardware power to accomplish
    the same tasks as conventional servers (Windows, Solaris) or workstations. The
    result is you can get by less expensive or older hardware.


    +   **Scaling/consolidation potential**—Again, Linux and open source applications
    and services can offer scale considerably. Multiple options for load balancing,
    clustering, and open source applications, such as database and email, give organizations
    the ability to scale up for new growth or consolidate to do more with less.


    +   **Ample support**—Support is available for open source—often superior to proprietary
    solutions. First, open source support is freely available and accessible through
    the online community via the Internet. And second, many companies (not the least
    of which is Novell) are now supporting open source with free online and multiple
    levels of paid support. All open source solutions distributed by Novell are included
    in support and maintenance contracts.


    +   **Escape vendor lock-in**—Frustration with vendor lock-in is a reality for
    all IT managers. In addition to owing license fees, there is lack of portability
