  md: '# The Open Source Solution


    This chapter focuses on the advantages of going with an open source solution.
    It looks at application availability, software costs, license management, and
    other issues that must factor into a deision of whether to adopt open source in
    your environment.


    # Open Source Advantages


    Before you commit to the adoption of open source, Critical Thinking 101 mandates
    that you ask the question, “Why?” This section attempts to answer that question
    from a variety of perspectives. Open source has impact not just for developers
    and in-house IT managers, but also potentially for every person throughout the
    value chain of an organization from management to knowledge workers to suppliers,
    customers, and partners.


    By and large, the effects of open source are advantageous with benefits ranging
    from lower costs to simplified management to superior software. These advantages
    include the following:


    +   - Lower software costs—Open source solutions generally require no licensing
    fees. The logical extension is no maintenance fees. The only expenditures are
    for media, documentation, and support, if required.

    - Simplified license management—Obtain the software once and install it as many
    times and in as many locations as you need. There’s no need to count, track, or
    monitor for license compliance.'
