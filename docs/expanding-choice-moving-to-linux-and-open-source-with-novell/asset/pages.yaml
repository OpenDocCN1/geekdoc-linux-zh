    # SERVER CONSOLIDATION UPGRADE


    Open Enterprise Server isn''t just another operating system that can be used to
    replace one you are already using. It is far more than that! OES is robust, scalable,
    and powerful that it has the power to enable one server to do the job that it
    took many servers to do in the past.


    Given that, OES offers the Server Consolidation Utility (SCU) to allow you to
    consolidate data from redundant servers into a smaller number of servers that
    are more easily administered and managed.


    With SCU, you can copy anything from whole volumes to specific directories from
    source servers (NetWare 4, 5, 6, or Windows NT) to destination servers (NetWare
    5.1 or later).


    SCU must be installed on a Windows-based workstation running Windows NT 4, Windows
    2000 (Service Pack 2 or later), or Windows XP Professional. There needs to be
    at least 50MB available disk space, a Novell client for Windows NT/2000 version
    4.83 or later, and Microsoft Data Access Components (MDAC) 2.7 or later installed
    on the workstation.


    # NOTE


    Information on MDAC can be found at http://msdn.microsoft.com/library/default.asp?url=/downloads/list/dataaccess.asp.


    SCU files are on the NetWare 6.5 SP CD 1, in the \PRODUCTS\SERVCONS directory.
    To install the utility:


    +   1. Launch the SCU installation by executing NWSC.EXE.


    +   2. Specify the language for the utility installation, and click OK.


    +   3. At the Introduction screen, click Next.


    +   4. At the License Agreement screen, select the I Accept the Terms of the License
    Agreement option, and then click Next.


    +   5. At the Choose Destination Location screen, specify the path into which
    you want to install SCU.


    +   6. At the Installation Summary, click Install.'
