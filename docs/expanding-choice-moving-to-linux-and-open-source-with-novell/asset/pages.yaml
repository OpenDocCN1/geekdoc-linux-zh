    # Symmetric Multiprocessing


    The Linux 2.6 kernel includes enhancements that let applications that have been
    written for parallel processing take advantage of even more processors. In simple
    terms, SMP employs several processors on the same machine using the same memory
    pool to execute application tasks. This can significantly speed up the processing
    for data center-type applications, such as large databases and enterprise resource
    planning (ERP) applications (see Figure 3.14).


    FIGURE 3.14

    Symmetric multiprocessing architecture supported on Linux.


