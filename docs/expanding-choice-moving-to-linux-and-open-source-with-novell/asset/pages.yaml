  md: '# CHAPTER 5: The Rise and Reason for Open Enterprise Server (OES)


    FIGURE 5.1

    A transition strategy.


    ![](img/2cadc77b7c451a163bd1d5d4eb002c79_169_0.png)


    The data center consists of a heterogeneous mix of operating systems, network
    services, and applications—often with little if any integration between systems.
    By and large, the data center is a result of an evolution and merging of technologies
    over time and, as such, includes solutions that have evolved from the desktop
    and workgroups as well as from mainframe and centralized computing services. In
    this environment, the primary objective for most CIOs is to consolidate, simplify,
    and reduce in such a way that service is maintained or enhanced while costs are
    maintained or reduced.


    The powerful potential of Novell solutions in the data center is that Linux and
    open source technologies enable simplification and consolidation without diminishing
    flexibility, manageability, scalability, or security within budgets that are equal
    to less than current costs. IT can provide more without sacrificing functionality,
    serviceability, or potential. The next step then becomes implementation—how to
    do it.


    Novell Consulting has done it—many times—for enterprise companies around the world.
    Feel free to use the steps outlined here as a framework for your own transition
    plan, or Novell Consulting is always available if you want to work with an experienced
    hand.


    # Initiate the Project


    A good transition will start with the formation of a project steering committee.
    This consists of executives, IT managers, and line-of-business managers who have
    vested interests in the benefits of a successful transition strategy. Up front,
    committee members should be able to understand and articulate business objectives,
    project charter and administrative procedures, corporate communication plans,
    change control and risk management procedures, acceptance criteria, and critical
    success factors.'
  merge: -1
