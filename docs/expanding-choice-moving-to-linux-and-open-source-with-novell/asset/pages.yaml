  md: '# CHAPTER 5: The Rise and Reason for Open Enterprise Server (OES)


    Novell Nterprise Branch Office is server software for distributed enterprises
    that are seeking to reduce the cost and complexity of maintaining network services
    in branch offices. It takes the "remote" out of office by delivering employees
    the same level of service regardless of location. Contrary to other approaches,
