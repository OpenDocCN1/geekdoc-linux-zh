    Internet connections.


    Branch offices are typically expensive to support because they are physically
    dispersed and lack central control. Problems include expensive private WAN links,
    fractured directory services, the need for onsite support staff, local backup-up,
    and disaster recovery; and lack of policy enforcement. Remote and branch offices
    also suffer because of low levels of service, lengthy response times, and intermittent
    or varying bandwidth availability.


    # How It Works


    Novell Nterprise Branch Office is a multifunction "software" appliance. Installing
    Branch Office on standard hardware creates a lights-out appliance that provides
    multiple services, including authentication, file and print serving, data backup,
    and a more basic Nterprise Branch Office configuration consists of two components—a
    central server and a branch office appliance. Although Branch Office can be used
    as a standalone appliance for file, print, directory, and networking services,
    its primary purpose is to provide corporate-level connectivity and services to
    branch office users.


    At the corporate office, one or more "central office" servers are configured to
    provide branch office services, including directory and file synchronization.
    These central office servers can be running Linux or NetWare, or even Windows.
    The software that keeps files between the branch office and the central office
    synchronization is the open source solution RSync. RSync provides fast and incremental
    synchronization with only delta or incremental changes in data being synchronized
    a file does not require the entire file to be transferred—only the data blocks
    that have been altered. Incremental synchronization reduces bandwidth requirements
    and allows a wide range of resources to be kept at multiple locations.


    Branch office user authentication is also controlled from the central office through
    the use of directory synchronization. The directory at the central office can
    be any LDAP-compliant directory including OpenLDAP and, again, can be running
    on Linux, NetWare, or Windows. Optimal management capabilities are achieved using
    Novell eDirectory, but Microsoft Active Directory is also supported.'
