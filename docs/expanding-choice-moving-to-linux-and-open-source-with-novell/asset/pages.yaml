  md: '# CHAPTER 2: The Open Source Solution


    # SAMBA


    Samba provides seamless file and print services to SMB/CIFS clients. In simple
    terms, Samba makes a Unix or Linux computer look like a Windows computer to anyone
    who is accessing it through a network. Samba was originally developed by Andrew
    Tridgill at Australian National University, who was trying to link a Windows PC
    to his Linux system for file access. The Microsoft networking-system is based
    on the Server Message Block (SMB) protocol—Samba is SMB with a couple of ''a''s
    added. From a Windows workstation, a Unix or Linux server appears just like a
    Windows server with the capability to map drives and access printers.


    Samba has evolved to include the next generation of SMB, the Common Internet File
    System (CIFS) and currently includes file and print services as well as the capability
    to provide domain services, Microsoft''s NT version of access management. Samba
    is also available on IBM System 390, OpenVMS, and other operating systems.


    Samba is available under the GNU General Public License (GPL) with an online community
    at http://www.samba.org. Samba has been very popular for two reasons. First, it
    simplifies the process of network management and administration by providing more
    access without additional client requirements. Second, and probably more important,
    it provides a stealth entry point for Linux, eliminating barriers to interoperability
    and adoption.


