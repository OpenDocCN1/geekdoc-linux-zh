  md: '# Non-Uniform Memory Access


    A drawback to SMP technology has been that even though it can theoretically scale
    for a large number of processors, realistically the number of possible processors
    has been limited to around eight to twelve. This is because the shared memory
    becomes a bottleneck as each processor accesses the common bus directly. The next
    generation of SMP technology is NUMA, which provides for flexible nodes (memory
    blocks) that act as separate buses and can include memory available on each processor.
    NUMA allows you to accommodate many more processors than standard SMP technology—Novell
    successfully tested 512 CPUs in a multiprocessor configuration and found the technology
    capable of scaling further. There is no theoretical limit on the number of processors
    that will work (see Figure 3.15).


    FIGURE 3.15

    NUMA architecture supported on Linux.


    ![](img/2cadc77b7c451a163bd1d5d4eb002c79_140_0.png)


    NUMA scalability is also enhanced for multiprocessing with hardware optimization
    as is available with AMD''s 64-bit Opteron processor or IBM NUMA servers built
    with Intel Xeon chips. SU Linux includes tools that allow developers to fine-tune
    applications for NUMA support.


    Applications that are parallelized or multithreaded for SMP can be run on NUMA
    servers generally with little modification, and include databases such as Oracle
    and DB2 and extended ERP systems for supply chain, customer, financial, and human
    resources management.


    # Hyperthreading


    Hyperthreading is Intel technology that enables multithreaded server software
    applications to execute two threads in parallel within each individual server
    processor, thereby dramatically improving transaction rates and response times.'
