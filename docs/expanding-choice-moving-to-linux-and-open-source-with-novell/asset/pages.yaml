    # # Upgrading and Migrating


    In the previous section, you walked through the installation of Open Enterprise
    Server on a new system. This section examines how to upgrade and migrate existing
    servers to OES. If are only installing OES on new servers, you can skip this chapter
    and move to the topic of administration in the next chapter.


    A number of types of upgrades and migrations are possible, depending upon the
    platform with which you are working. The five major possibilities are


    +   * Upgrade an existing NetWare server

    * Migrate from an existing NetWare server

    * Upgrade from an existing Linux server

    * Migrate from an existing Linux server

    * Migrate from an existing Windows server


    Because this book is targeted for an audience moving to open source, it focuses
    on, and explores, the methods for moving from NetWare and Windows.


    # ## Upgrading a NetWare Server


    Two types of upgrade options are available for moving to NetWare 6.5:


    +   * In-Place

    * Server Consolidation


    In-place upgrades are the most traditional of methods. With this method, the server
    is directly upgraded from its previous version to the new version using the server
    console. In-place upgrades are available from NetWare versions 6.5, 6.0, 5.1,
    and 4.2.


    With a server consolidation upgrade, volumes, directories, users, printers, and
    printer agents are transferred from a source server to an OES destination server
    using the NetWare Server Consolidation Utility. Server consolidation is available
    with NetWare 6, 5, and 4.'
