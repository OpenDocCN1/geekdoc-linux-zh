  \ Blum** 在 IT 行业工作了 20 多年，一直担任网络和系统管理员。在此期间，他有机会接触了许多不同的计算机产品，包括 Windows、Netware、Cisco、Avaya、不同版本的\
  \ UNIX，当然还有 Linux。多年来，他还担任了几家非营利组织的志愿者，帮助支持那些资金有限的小型网络。Rich 是几本针对 Linux 痴迷爱好的 Linux\
  \ 书籍作者，也写了几本针对程序员的 Windows 书。\n\n当他不是一个电脑宅时，Rich 在教会崇拜乐队中弹奏电贝斯，并喜欢与妻子 Barbara 以及他们的两个女儿\
  \ Katie Jane 和 Jessica 度过时光。\n\n## 献辞\n\n致我的女儿 Katie Jane 和 Jessica。记住：学习新事物永远是好时候（即使你不在学校）。\n\
