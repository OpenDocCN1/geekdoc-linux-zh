  \n#### 使用 Calc 文件\n\n与 Writer 软件包一样，Calc 软件包允许你以许多不同的格式读写文档：\n\n✓ **OpenDocument\
  \ 电子表格 (ODS) 格式：** 一种建议的电子表格标准文档格式。\n✓ **OpenOffice.org 1.0 电子表格 (OTS) 格式：** 旧的\
  \ OpenOffice 1.0 电子表格格式。 \n✓ **数据交换格式 (DIF)：** 文本文件格式，用于在不同的电子表格程序之间导入和导出电子表格。 \n\
  ✓ **dBase (DBF)：** 此选项将电子表格数据导出为 `dBase`数据库文件。 \n✓ **Microsoft Excel 97/2000/XP\
  \ (XLS) 格式：** 最流行的 Excel 版本使用的标准 Microsoft Excel 电子表格格式。\n\n当前版本的 OpenOffice.org\
  \ 不支持 Excel 2007 (`.xlsx`) 格式。然而，如果你有 Excel 2007 副本，可以将该格式的电子表格转换为标准的 `.xls` 格式，并在\
  \ OpenOffice.org 中读取。\n\n✓ **Microsoft Excel 95 (XLS) 格式：** 以及旧的 Excel 电子表格格式。 \n\
  ✓ **Microsoft Excel 5.0 (XLS) 格式：** 更旧的 Excel 电子表格格式。 \n✓ **StarCalc 3.0 – 5.0 (SDC)\
  \ 格式：** Sun 的 StarOffice 电子表格格式（OpenOffice.org 套件的近亲）。 \n✓ **SYLK (SLK) 格式：** 符号链接格式，用于电子表格与其他应用程序（如数据库）之间交换数据。\
  \ \n✓ **文本 CSV (CSV) 格式：** 逗号分隔文本值，通常用于将数据导出到数据库。\n✓ **HTML (HTML) 格式：** 将电子表格数据格式化为\
  \ HTML 网页。 \n✓ **Microsoft Excel 2003 (XML) 格式：** Microsoft 提的一种使用 Internet XML\
  \ 标准标记语言定义电子表格数据的标准。\n\n与 Writer 类似，Calc 标准工具栏也提供了一个按钮，让你直接将电子表格导出为 PDF 文档。\n\n\
  #### 使用 OpenOffice.Org 进行演示\n\n##### Imp\n\n大多数人宁愿吃玻璃也不愿在小组面前演讲。尽管如此，如果你必须这样做，最好有一些酷炫的演示软件作为你的支持。给\
  \ OpenOffice.org Impress 一个机会让你大惊艳。\n\nImpress 在 Fedora 和 Ubuntu 菜单中列为 OpenOffice.org\
  \ Presentation。你也可以通过从菜单栏选择`文件 ➔ 新建 ➔ 演示`从任何 OpenOffice.org 程序打开新的 Impress 演示。\n\
  \n###### 使用演示向导\n\n当你打开 OpenOffice.org Impress 时，首先启动的是演示向导（见图 12-3），你随时可以通过选择`文件\
  \ ➔ 向导 ➔ 演示`来打开它。如果你希望下次打开 OpenOffice.org Impress 时不再显示此向导，请勾选`不再显示此向导`复选框。\n\n\
  ![Image 110](img/index-238_1.jpg)\n\n**图 12-3：OpenOffice.org 演示向导。**\n\n要使用此向导，请按照以下步骤操作：\n\
  \n1. 保持勾选“空演示”选项（除非你有需要运行的模板），并点击“下一步”。\n\n向导的下一个屏幕将会出现。\n\n\n\n\n\n## 2. 如果你想选择\
  \ OpenOffice.org Impress 自带的默认幻灯片背景，请从“幻灯片设计”下拉列表中选择“演示文背景”（Presentation Backgrounds），然后点击各种选项查看其效果。\n\
  \n默认情况下，背景模板并不多。这是 Sun 的 StarOffice 提供额外价值的一个领域。\n\n## 3. 如果你想选择一个专门为该模板设计的演示文（内容）布局模板，请从“选择幻灯片设计”下拉列表中选择“演示文”（Presentations），然后选择你想要使用的演示文类型。\n\
  \n同样，默认情况下在这里找到的选项有限。\n\n## 4. 如果你希望演示文最终显示在电脑屏幕以外的地方，请调整“选择输出媒介”以匹配其预期设置。\n\n你的选项有\
  \ `Screen`（屏幕）、`Overhead Sheet`（投影片）、`Slide`（幻灯片）和 `Paper`（纸）。\n\n## 5. 点击“下一步”继续。\n\
  \n会出现向导的下一个屏幕。\n\n## 6. 在“选择幻灯片切换”下，尝试“效果”和“速度”下拉列表中的各种选项，以决定你如何从一张幻灯片移动到另一张。\n\n\
  只要勾选“预览”复框，OpenOffice.org Impress 就会为你制作这些切换。\n\n![Image 111](img/index-239_1.jpg)\n\
  \n# 第三部分：完成工作\n\n## 7. 选择如何导航你的演示文：\n\n* 如果你想在演示时手动导航幻灯片（使用 `Default` 选项），请跳到第 10\
  \ 步。\n* 如果你想让演示文自动播放，请点击 `Automatic` 选项。\n\n## 8. 在“页面持续”中，设置你希望每张幻灯片停留多长时间。\n\n\
  ## 9. 在“暂停持续”中，设置你希望幻灯片之间留出多长的空白。\n\n如果你选中了“显示标志”（Show Logo）复框，OpenOffice.org 的标志将在空白暂停期间出现。\n\
  \n## 10. 选择好设置后，点击“创建”继续。\n\nOpenOffice.org Impress 打开了，如图 12-4 所示。你可能会发现点击“幻灯片”面板右上角的\
  \ `X` 来清理窗口是很有用的。\n\n**图 12-4：** OpenOffice.org Impress 的默认外观。\n\n# 第 12 章：使用 OpenOffice.org\
  \ 进行文字及更多\n\n## 浏览 OpenOffice.org Impress\n\n在继续之前，查看图 12-4 所示的 GUI 布局。\n\n左侧的“Slides”（幻灯片）视图和右侧的“Tasks”（任务）视图对某些人来说可能看起来混乱；如果你不需要它们，只需点击每个面板右上角的\
  \ `X`。你可以随时通过选择 `View➪Slide Pane` 和/或 `View➪Task Pane` 来找回它们。\n\n窗口顶部是菜单栏。OpenOffice.org\
  \ Impress 拥有你对现代演示软件包所期望许多功能。它的菜单选项太多，无法深入介绍，因此这里是每个菜单中内容的（非详尽式）总结：\n\n* **文件（File）：**\
  \ 常用的`打开`、`保存`、`另存为`和`打印`命令，一组向导，以及电子邮件发送文档和创建模板的功能。\n* **编辑（Edit）：** 常用的`全选`和`查找`命令，以及快速复制幻灯片的功能。\n\
  * **视图（View）：** 常用的`缩放`功能和工具栏，以及选择只查看幻灯片、备注或另一个部分的功能。\n* **插入（Insert）：** 常用的新建幻灯片，以及图表、框架、图形和表格。\n\
  * **格式（Format）：** 常用的文本格式化功能，以及布局、图形和样式格式。\n* **工具（Tools）：** 常用的拼写检查功能，外加连字符、自动纠正和图像库。\n\
  * **幻灯片放（Slide Show）：** 常用的幻灯片控制菜单。这些菜单的功能比这里列出的更多。不要忘记自己进行一些探索。\n\n窗口顶部是 `Standard`（标准）工具栏，你可以随时通过选择\
  \ `View➪Toolbars➪Standard` 来移除它。每个图标代表一个不同的功能；所有功能都在表 12-4 中进行了描述。\n\n### 表 12-4：OpenOffice.org\
  \ Impress 标准工具栏\n\n| 按钮或项目 | 你可以做什么 |\n| :--- | :--- |\n| 新建 (New) | 打开各种类型的新文档。点击向下的箭头从任何\
  \ OOo 类型中选择要创建的特定类型文档。 |\n| 打开 (Open) | 打开一个现有文件进行读取或编辑。 |\n| 保存 (Save) | 保存当前文档。如果你还没有保存过此文档，将打开“另存为”对话框。\
  \ |\n| 文档作为 (Document as) | 在你偏好的电子邮件程序中打开 Compose 电子邮件窗口并自动附加此文档。 |\n| 编辑文件 (Edit\
  \ File) | 编辑显示的文件。 |\n| 直接导出 (Export Directly) | 打开一个以 `PDF` 为文件类型的“另存为”对话框。 |\n\
  | 直接打印文件 (Print File Directly) | 将文件发送到默认打印机。 |\n| 拼写检查 (Spellcheck) | 对整个文档或选中文本运行拼写检查。\
  \ |\n| 自动拼写检查 (AutoSpellcheck) | 激活或关闭自动拼写检查功能。 |\n| 剪切 (Cut) | 从文档中删除选中文本并将其保存到内存。\
  \ |\n| 复制 (Copy) | 复制选中文本并将其保存到内存。 |\n| 粘贴 (Paste) | 将内存中的文本放置到文档中光标所在的位置。 |\n|\
  \ 格式 (Format) | 提取后续文本的格式并应用它。 |\n| 撤销 (Undo) | 撤销你所做的最后更改。 |\n| 恢复 (Restore) |\
  \ 在 `Undo` 后恢复文档的最后一次更改。 |\n| 图表 (Chart) | 在演示文中插入图表。 |\n| 电子表格 (Spreadsheet) |\
  \ 在演示文中插入电子表格。 |\n| 超链接 (Hyperlink) | 打开或关闭用于构建复杂超链接的对话框。 |\n| 显示网格 (Display Grid)\
  \ | 显示或移除幻灯片上的对齐网格。 |\n| 导航器 (Navigator) | 打开或关闭导航器窗口，允许你跳转到文档内的特定功能。 |\n| 缩放 (Zoom)\
  \ | 更改文档的大小。 |\n| 帮助 (Help) | 打开 OpenOffice.org 帮助对话框。 |\n| 幻灯片 (Slide) | 在当前幻灯片之后插入新幻灯片。\
  \ |\n| 幻灯片设计 (Slide Design) | 打开“幻灯片设计”对话框。 |\n| 幻灯片放映 (Slide Show) | 开始幻灯片放映。 |\n\
  \n在默认的 OpenOffice.org 设置中，`Line and Filling`（线条和填充）工具栏位于 `Standard` 工具栏正下方。通常，你可以随时通过选择\
  \ `View➪Toolbars➪Line and Filling` 来移除该工具栏。\n\n此工具栏允许你点击按钮并展开代表标准演示软件功能的下拉列表——例如，箭头样式、颜色、线条样式和其他格式指令。此栏上的大多数功能与你在大多数现代演示程序中看到的相同。\n\
  \n在你的文档上方，你会看到一系列标签页，每个标签都会带你进入查看幻灯片的特定方式。表 12-5 概述了可用视图及其包含的内容。\n\n### 表 12-5：可用的\
  \ OpenOffice.org Impress 视图\n\n| 视图 | 你能发现 |\n| :--- | :--- |\n| 普通 (Normal) | 单个幻灯片视图，你可以在幻灯片上添加艺术内容。\
  \ |\n| 讲 (Handout) | 每页六张幻灯片，正如你打印分发稿一样。 |\n| 母版 (Master) | 单个幻灯片视图，你可以在此应用将应用到所有幻灯片的母版格式。通过选择\
  \ `View➪Master` 进入此视图。在 `Master` 子菜单下，你可以选择 `Slide Master` 查看母版幻灯片、`Notes Master`\
  \ 查看母版备注页或 `Master Elements` 分配母版视图显示的信息。 |\n| 备注 (Notes) | 单个幻灯片视图，你可以看到幻灯片的小版本以及关于该幻灯片的备注。\
  \ |\n| 大纲 (Outline) | (源文件未提供) |\n\n\n\n\n全幻灯片视图按顺序列出幻灯片，方便切换。在侧边，导航时幻灯片会在独立窗口中以缩图模式显示。\n\
  \n### 幻灯片排序器\n全幻灯片视图尽可能在列和行中排列幻灯片。重新排列幻灯片非常简单，只需将其拖动到想要的位置然后松开即可。\n\n### 第三部分：完成工作\n\
  选项卡窗口包含你的演示文。在普通视图下，该演示文就是你的幻灯片。你需要点击绘图工具栏上的工具之一（将在下一节中讨论）来输入任何内容。要在此幻灯片之前或之后添加幻灯片，请右键点击该区域并选择\
  \ `Slide➪ New Slide`。对于每张幻灯片，你可以可以使用右侧任务面板中的布局来更改设置。\n\n演示文下方是绘图工具栏，允许你根据创建演示文的需求选择线条、箭头、形状等。这些按钮大部分都有向下指向的箭头，你可以通过它们查看所提供的完整功能范围。\n\
  \n### 使用 Impress 文件\nOpenOffice.org Impress 支持的文件类型不像其同类的 Writer 和 Calc 那么多。这主要是由于演示图形行业缺乏通用的标准导致的。\n\
  \nImpress 支持的格式有：\n\n- **OpenDocument Presentation (ODP) 格式：** 由 OpenOffice.org\
  \ 提出的标准演示图形格式。\n- **OpenOffice.org 1.0 Presentation (OTP) 格式：**原始的 OpenOffice.org\
  \ 演示图形文件格式。\n- **Microsoft PowerPoint 97/2000/XP (PPT) 格式：** 领域可能最流行的演示图形工具。你可以使用\
  \ Impress 读取和写入大多数 PowerPoint 幻灯片演示文。\n\n当前版本的 Impress 不支持较新的 PowerPoint 2007 `.pptx`\
  \ 格式。不过，你可以使用 PowerPoint 2007 将演示文转换为 `.ppt` 文件，OpenOffice.org 可以读取并修改它。\n\n- **OpenOffice.org\
  \ 1.0 Drawing (SXD) 格式：** 一种旧的原始图形绘制格式。\n- **StarDraw 3.0 – 5.0 (SDA) 格式：** 在 Sun\
  \ 公司的商业版 Draw 中创建的文件。\n- **StarImpress 4.0 and 5.0 (SDD) 格式：** 在 Sun 公司的商业版 Impress\
  \ 中创建的文件。\n- **OpenOffice.org Drawing (ODG) 格式：** 原始图形绘制格式。\n\n尽管 Impress 可以处理 OpenOffice.org\
  \ Draw 文件，但 Impress 文件的默认格式是 ODP 格式。与 OpenOffice.org 套件中的其他软件包一样，Impress 还提供了一个工具栏图标，你可以用来将幻灯片保存为\
  \ PDF 文件。\n\n![Image 112](img/index-244_1.jpg)\n\n### 第 12 章：使用 OpenOffice.org 进行文字处理及更多\n\
  #### 使用 OpenOffice.Org Draw 进行艺术创作\n无论你是有志的图形艺术家，还是只需要一个可以让你生成简单图形以便用于自身、演示文或其他地方的工具，OpenOffice.org\
  \ Draw 都提供了大量的绘图功能。至少起码，玩玩它非常有趣！生活中的某些事情并不都要是实用的。\n\n#### 浏览 OpenOffice.org Draw\n\
  在继续之前，请查看图 12-5 所示的 GUI 布局。如果你发现左侧的页面（Pages）面板太混乱，请点击其右上角的 X 将其移除。你可以随时通过选择 `View➪\
  \ Page Pane` 来找回。\n\n**图 12-5：** OpenOffice.org Draw 布局。（菜单栏、工具栏、标尺、图片、页面面板、绘图栏）\n\
  \n窗口顶部是常用的菜单栏。OpenOffice.org Draw 是一个典型的矢量图形程序；它依赖于计算出的屏幕线条，而不是像素化的近似或其他技术。（有关编辑照片和其他精细细节工作的软件，请参阅第\
  \ 14 章。）\n\nDraw 的菜单选项过多，无法详尽介绍；以下是每个菜单中可以找到内容的（非详尽的）总结：\n\n- **文件 (File)：** 常用的打开、保存、另存为、打印和导出命令，以及一组向导（在\
  \ AutoPilot 术语下），以及通过电子邮件发送文档和创建模板的能力。\n- **编辑 (Edit)：** 常用的查找、替换等命令，以及不那么常用的图像映射（Image\
  \ Map），它允许为图像中的可点击区域分配 URL。\n- **视图 (View)：** 常用的缩放功能和工具栏，以及选择显示质量的能力。\n- **插入 (Insert)：**\
  \ 常用的图表、框架、图形和电子表格，以及扫描功能。\n- **格式 (Format)：** 常用的线条和图形格式，以及图层和样式格式。\n- **工具 (Tools)：**\
  \ 常用的拼写检查，以及连字符、自动纠正、图像库和一个用于获取颜色的“吸管器”。\n- **修改 (Modify)：** 更改对象外观的各种选项。\n\n菜单栏下方是标准工具栏，你可以通过选择\
  \ `View➪ Toolbars➪ Standard` 随时移除它。此工具栏上的每个图标代表一个不同的功能，如表 12-6 所示。如你所见，这个主工具栏与 OpenOffice.org\
  \ Impress 中的相似，而不是与 OpenOffice.org Writer 中的相似。\n\n**表 12-6：OpenOffice.org Draw\
  \ 主工具栏**\n\n| 按钮或项目 | 你可以做什么 |\n| :--- | :--- |\n| 新建 (New) | 打开各种类型的新文档。点击向下指向的箭头从任何\
  \ OOo 类型中选择创建特定类型的文档。 |\n| 打开 (Open) | 打开现有文件进行读取或编辑。 |\n| 保存 (Save) | 保存当前文档。如果你以前保存过此文档，将打开另存为对话框。\
  \ |\n| 电子邮件 (Email) | 在你偏好的电子邮件程序中打开一个写邮件窗口，并自动附加此文档。 |\n| 编辑文件 (Edit File) | 编辑文档。\
  \ |\n| 直接导出 (Export Directly) | 打开一个以 PDF 为文件类型的另存为对话框。 |\n| 直接打印文件 (Print File\
  \ Directly) | 将文件发送到默认打印机。 |\n| 拼写检查 (Spellcheck) | 对你的整个文档或选定的文本运行拼写检查。 |\n| 自动拼写检查\
  \ (AutoSpellcheck) | 激活或关闭自动拼写检查功能。 |\n| 剪切 (Cut) | 从文档中删除选定的文本并保存到内存中。 |\n| 复制\
  \ (Copy) | 复制选定的文档文本并保存到内存中。 |\n| 粘贴 (Paste) | 将内存中的文本放置在文档光标当前位置。点击向下箭头查看粘贴文本的选项。\
