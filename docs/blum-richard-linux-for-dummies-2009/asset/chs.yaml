  \ | 撤销你对文档所做的最后更改。点击向下箭头选择你想回溯更改的何种程度。 |\n| 恢复 (Restore) | 在使用撤销取消更改后，恢复文档的最后一次更改。点击向下箭头选择你想重做之前所更改的何种程度。\
  \ |\n| 图表 (Chart) | 使用选定的数据插入图表。 |\n| 超链接 (Hyperlink) | 打开或关闭你可以用于构建复杂超链接的对话框。 |\n\
  | 导航 (Navigator) | 打开或关闭导航器窗口，允许你跳转到文档内的特定功能。 |\n| 缩放 (Zoom) | 更改文档在屏幕上的显示。 |\n\
  | 帮助 (Help) | 打开 OpenOffice.org 帮助对话框。 |\n\n在默认的 OpenOffice.org 设置中，线条和填充工具栏位于标准栏的正下方。按照习惯，你可以随时通过选择\
  \ `View➪ Toolbars➪ Line and Filling` 移除线条和填充工具栏。此工具栏允许你点击按钮并展开代表标准演示软件功能的下拉列表，例如箭头样式、颜色、线条样式和其他格式指令。\n\
  \n\n\n\n\n在默认的 OpenOffice.org 设置中，“线条和填充”工具栏正下方是标尺。这些项目可以根据你选择的测量系统，标记出图片的页边距和制表符（例如）。要更改想要使用的系统，请右键点击标尺，并将测量单位更改为你的偏好设置。\n\
  \n点击那个大空白区域并开始涂鸦。你也可以通过右键点击访问格式化弹出菜单。\n\n如果你喜欢修改其他图片，可以选择`文件➪打开`来选择任何标准的图形文件格式（如\
  \ `BMP` 或 `JPG`）进行处理。当文件在 Draw 中打开时，你可以使用所有的标准 Draw 工具来修改图片。\n\n文档窗口下方是绘图栏，它允许你根据绘图创建的需求选择线条、箭头、形状等。这些按钮中的大多数都有一个指向向下的箭头，点击它们可以查看它们所提供的完整功能范围。\n\
  \n## 使用 Draw 文件\n\n从表面上看，OpenOffice.org Draw 提供的文件类型支持似乎是最有限的。当你使用`另存为` 对话框时，唯一可以保存文档的格式格式有：\n\
  \n- `OpenDocument Drawing (ODG) 格式:` OpenOffice.org 提出的图形文件标准\n- `OpenOffice.org\
  \ 1.0 Drawing (SXD) 格式:` 较的 OpenOffice.org 图形格式\n- `StarDraw 3.0 (SDD) 格式:` 旧的 Sun\
  \ StarDraw 格式\n- `StarDraw 5.0 (SDA) 格式:` 新的 Sun StarDraw 格式\n\n可操作的选择不多，尤其是当你处理图片文件时。幸运的是，Draw\
  \ 有一些小技巧。你可以通过`文件➪导出`将图像保存为标准格式之外的格式。\n\n这将产生大量的支持图形格式：`BMP`、`EMF`、`EPS`、`GIF`、`JPEG`、`MET`、`PBM`、`PCT`、`PGM`、`PNG`、`PPM`、`RAS`、`SVG`、`SWF`\
  \ (Flash)、`TIFF`、`WMF` 和 `XPM`。这应该满足任何计算机艺术家。\n\n![Image 113](img/index-248_1.jpg)\n\
  \n**第 12 章：使用 OpenOffice.org 进行文字及更多操作** 235\n\n## 使用 OpenOffice.org Base 管理数据\n\
  \n如果你习惯使用 Microsoft Access（或必须与各种数据库产品交互），并且经常感到困惑，疑惑在 Linux 下如何处理这些需求，那么不要再困惑了！\n\
  \nOpenOffice.org Base 提供了一个连接 Microsoft Access 文件以及其他数据库的接口。\n\n### 从向导中获取帮助\n\n\
  你可以通过许多不同的方式使用此程序。核心内容包括从系统中的文件从头创建数据库、处理 Microsoft Access 文件，以及处理为用于主要数据库服务器程序创建的数据库——即使是跨网络操作。由于方法层出胜穷且本书的空间有限，我们重点关注两种更常见的选择：创建新的数据库文件和打开现有文件（包括\
  \ Microsoft Access 文件）。\n\n当你打开一个新的数据库文件时，你遇到的第一个界面是数据库向导（见图 12-6）。\n\n**图 12-6：**\
  \ OpenOffice.org 数据库向导，用于打开现有数据库和创建新数据库。\n\n### 在数据库向导中创建新数据库文件\n\n在数据库向导对话框中，执行以下操作以创建一个全新的数据库文件：\n\
  \n![Image 114](img/index-249_1.jpg)\n\n236 **第三部分：完成工作**\n\n1. **选择`创建新数据库`单选按钮。**\n\
  2. **点击下一步。**\n\n出现“保存数据库后决定如何继续”屏幕，如图 12-7 所示。\n\n3. **如果你想将此数据库注册为 OpenOffice.org\
  \ 中的数据源，请勾选`是，为我注册此数据库`；否则，选择`否，不注册数据库`单选按钮。**\n\n已注册的数据库可以被你所有的 OpenOffice.org\
  \ 应用程序访问，而不仅仅是 OpenOffice.org Base。\n\n4. **如果你想立即打开此文件进行编辑，请勾选`打开数据库进行编辑`复选框；否则点击此选项取消勾选该复选框。**\n\
  \n5. **如果你想使用表向导立即在数据库中创建一个表（推荐方法），请勾选`使用表向导创建表`复选框。**\n\n目前，最好关闭向导，这样你就可以一次探索一步。\n\
  \n6. **点击完成。**\n\n打开“保存”对话框。\n\n7. **在`名称` 文本框中输入你的文档名称。**\n8. **在`保存到文件夹` 下拉列表中选择你想要保存文档的目录，或者点击`浏览其他文件夹`旁边的向右箭头以导航到你想保存文档的位置。**\n\
  \n![Image 115](img/index-250_1.jpg)\n\n**第 12 章：使用 OpenOffice.org 进行文字及更多操作** 237\n\
  \n9. **点击保存按钮。**\n\n无论你指定了什么，操作都会发生。如果你选择了立即打开数据库，你将看到类似于图 12-8 的内容。\n\n**图 12-8：**\
  \ 在 OpenOffice.org Base 中打开的数据库。数据库面板，表/查询/表单/报告窗格。\n\n### 在数据库向导中打开现有文件\n\n如果你有一个已经存在的\
  \ Microsoft Access 文件想在 OpenOffice.org Base 中打开它，请从初始数据库向导开始执行以下操作：\n\n1. **选择`打开现有数据库文件`。**\n\
  2. **选择一个文件。**\n\n你有这些选项：\n- `最近使用`：如果文件在`最近使用` 下拉列表中，请在那里选择该文件。点击`完成`，你就完成了打开文件的操作。\n\
  - `打开按钮`：如果你需要的文件不在`最近使用` 下拉列表中，点击`打开`按钮并继续到第 3 步。\n3. **导航到你想打开的文件，并选择该文件。**\n\
  4. **点击打开。**\n\n文件将在窗口中打开（参考图 12-8）。\n\n### 游览 OpenOffice.org base\n\n在继续之前，请参考图\
  \ 12-8 所示的布局。这是你在打开数据库进行工作后，主 OpenOffice.org Base 窗口。这里是你将在那里发现的内容。\n\n窗口顶部是菜单栏。OpenOffice.org\
  \ Base 为你提供了许多你可能在数据库界面中预期的功能：\n\n- `文件:`：你常用的`打开`、`保存`和`另存为`命令，以及一组向导和通过电子邮件发送的功能\n\
  - `编辑:`：常用的`复制`和`粘贴`命令，以及访问数据库属性、高级设置以及表单和报告向导\n- `视图:`：访问工具栏和数据库对象，以及预览和排序功能\n\
  - `插入:`：使用此功能创建表单、查询等\n- `工具:`：使用这些功能建立表之间的关系、筛选表、运行 SQL 查询、创建宏等\n\n菜单栏下方是标准工具栏，你可以随时通过`视图➪工具栏➪标准`将其移除。此工具栏上的每个图标代表一个不同的功能，如表\
  \ 12-7 所示。你可以看到，这个工具栏与 OpenOffice.org Impress 的工具栏更相似，而不是 OpenOffice.org Writer\
  \ 的工具栏。\n\n**表 12-7：OpenOffice.org Base 标准工具栏**\n\n| 按钮或项目 | 你可以的操作 |\n| :--- |\
  \ :--- |\n| `新建` | 创建各种类型的文档。点击指向向下的箭头从任何 OOo 类型创建特定类型的文档。 |\n| `打开` | 打开现有文件进行读取或编辑。\
  \ |\n| `保存` | 保存当前文档。如果你以前保存过此文档，将打开`另存为`对话框。 |\n| `复制` | 复制选中的文档文本并保存到内存中。 |\n\
  | `粘贴` | 将内存中的文本放置到文档的光标当前位置。点击向下箭头查看粘贴文本的方式。 |\n| `升序` | 按字母顺序对右下窗格中的项目进行排序。 |\n\
  \n\n\n\n## 降序排序\n将右下面板中的条目按字母倒序排序。\n\n## 表单\n创建一个表单。\n\n## 帮助\n打开 `OpenOffice.org`\
  \ 帮助对话框。\n\n## 打开数据库\n打开右下面板中选中的项目。\n\n## 对象\n### 编辑\n打开右下面板中选中项目的设计视图。\n\n### 删除\n\
  删除右下面板中的选中项目。\n\n### 重命名\n重命名右下面板中的选中项目。\n\n主窗口左侧是`Database` 数据库面板。该面板有四个图标：`Tables`\
  \ 表、`Queries`查询、`Forms` 表单和 `Reports` 报告。选择这些图标可以决定最右侧两个面板中显示的内容——例如，要处理表，请选择`Tables`\
  \ 图标。\n\n`query`（查询）允许你对数据库提出复杂的问题。\n\n右上面板是`Tasks` 任务面板。在这里，你可以看到对`Database`面板中的特定选择可以的操作。使用右侧的描述来理解任何让你看眼花眼的术语。\n\
  \n右下面板显示已存在的表、查询、表单或报告。你可以打开任何想要操作的项目：在这些面板中双击它们即可打开。\n\n## 坐在桌旁\n表是数据库系统的核心。它们存储你的数据并让你快速访问信息。了解`Base`\
  \ 中如何组织表，以及你如何使用它们来存储和显示你的数据是一个好主意。\n\n![Image 116](img/index-253_1.jpg)\n\n240\
  \ **第三部分：完成工作**\n\n要创建一个新表，如果你认为你有一个标准表，可以使用`Base Table Wizard` 表向导，或者可以直接在`Design\
  \ View` 设计视图中创建自己的表；从`Tables` 页的列表中选择相应的选项。图 12-9 显示了在`Table Design View` 对话框中创建表。\n\
  \n**图 12-9：**\n`Base` 中的表设计视图对话框。\n\n`Table Design` 中的每一行都代表表中的一个数据字段。每个字段必须有一个唯一的`Field\
  \ Name`（字段名称）并分配一个`Field Type`（字段类型）。`Field Type` 定义了字段中存在的数据类型（字符、数字、日期等）。使用`Description`\
  \ 描述区域编写该数据字段含义的简要描述。\n\n创建一个新表非常简单：\n\n1. **为描述数据的`Field Name`输入一个文本名称。**\n2. **从下拉菜单中选择一个`Field\
  \ Type`。**\n3. **在`Description` 文本区域中输入简要描述。**\n4. **如果该字段是主键，右键点击行左侧并选择`Primary\
  \ Key`（主键）。**\n\n表的`primary key`（主键）是一个可以唯一标识表中每个记录的数据字段。在图 12-9 的示例中，每个员工都通过唯一的`employee\
  \ ID`（员工 ID）进行标识，因为多个员工可能有相同的姓氏。\n\n![Image 117](img/index-254_1.jpg)\n\n**第 12\
  \ 章：使用 OpenOffice.org 文字处理及更多** 241\n\n5. **输入剩余行以完成表中的数据元素。**\n6. **选择`File` ➪`Save\
  \ As` 存为以使用唯一名称保存表。**\n\n新表现在出现在主`Base` 窗口的`Tables` 区域下。\n\n双击新表将弹出`Data Viewing\
  \ and Entry` 数据查看和输入窗口，如图 12-10 所示。\n\n**图 12-10：**\n`Base` 应用中的数据查看和输入窗口。\n\n如果你熟悉`Microsoft\
  \ Access`，你应该会在这里感到很自在。此窗口允许你查看表中的现有数据记录并轻松地添加新数据记录。\n\n## 使用 OpenOffice.Org Math\
  \ 布局\n没有什么比尝试写一份数学或科学报告却发现必须使用多行来显示公式（这看起来总是不对！）或者手写更糟糕了。`OpenOffice.org Math`是这个问题的绝佳方案。\n\
  \n你可以在此程序中布局公式，然后将其插入到任何`OpenOffice.org` 文档中。无论你是中学生还是专业工程师，`OpenOffice.org Math`\
  \ 都可能让你惊喜。\n\n![Image 118](img/index-255_1.jpg)\n\n242 **第三部分：完成工作**\n\n如果你看过了所有其他`OpenOffice.org`\
  \ 程序，许多`OpenOffice.org Math` 函数与你习惯的有所不同。尽管在许多方面，归于其特殊用途，这个程序比某些程序简单得多。\n\n`Math`\
  \ 不是一个计算程序。它是用于在纸上或屏幕上布局复杂公式的。它非常适合为研究论文添加复杂公式，但对于平衡你的支票来说毫无用处。\n\n启动`OpenOffice.org\
  \ Math`有一点技巧；通常你会在面板菜单（如`Ubuntu` 中的菜单）中找不到它。如果你的 Linux 发行版在菜单中没有`Math`，你仍然可以通过打开`Writer`然后选择`File`➪`New`➪`Formula`来启动一个新的`Math`\
  \ 文档。\n\n在继续之前，看看图 12-11 所示的 GUI 布局。\n\n标准 选择文档命令\n菜单栏 工具栏 对话框 窗口 窗口\n\n**图 12-11：**\n\
  Open Office.org Math 布局。\n\n现在通过点击窗口右上角的微 `X` 关闭`Selection` 选择对话框，以保持界面尽可能整洁。你可以随时通过选择`View`➪`Selection`\
  \ 重新找回它。\n\n**第 12 章：使用 OpenOffice.org 文字处理及更多** 243\n\n菜单栏\n窗口顶部是菜单栏，这是 GUI 世界的标准。以下是每个菜单中内容的（非详尽的）总结：\n\
  \n**File:** 在大多数程序中都能找到常用的`Open` 打开、`Save` 保存、`Save As` 存为和`Print` 打印命令。\n**Edit:**\
  \ 常用的`Select All` 全选、`Copy` 复制和`Paste` 粘贴命令，以及用于公式内移动的专用命令。\n**View:** 常用的`Zoom`\
  \ 功能和工具栏，以及屏幕刷新功能。\n**Format:** 常用的字体类型、大小、对齐和其他功能。\n**Tools:** 除了导入和访问符号外，还有用于自定义程序设置和行为的常用`Customize`\
  \ 自定义和`Options` 选项。\n\n标准工具栏\n窗口顶部是`Standard` 标准工具栏，你可以随时通过`View`➪`Toolbars`➪`Standard`\
  \ 移除它。工具栏上的每个图标都代表不同的功能。你可能会发现这个主工具栏与其他`OpenOffice.org` 程序大不相同。大部分较小。每个图标描述见表 12-8。\n\
  \n**表 12-8：OpenOffice.org 标准工具栏**\n\n| 按钮或项目 | 你可以做什么 |\n| :--- | :--- |\n| Zoom\
  \ In | 放大图像。 |\n| Zoom Out | 缩小图像。 |\n| 1 | 按实际大小显示图像。 |\n| Show All | 以适应屏幕的最大尺寸显示整个公式。\
  \ |\n| New | 打开各种类型的新文档。点击向下箭头以选择从任何 OOo 类型创建的特定文档类型。 |\n| Open | 打开现有文件进行读取或编辑。\
  \ |\n| Save | 保存当前文档。如果你以前保存过此文档，将打开`Save As` 对话框。 |\n| Document as | 在你优选的电子邮件中打开`Compose`-mail\
  \ 窗口，并自动附加此文档。 |\n| as PDF | 直接打印到默认打印机。 |\n| Cut | 从文档中删除选中的文本并保存到内存中。 |\n| Copy\
  \ | 复制选中的文本并保存到内存中。 |\n| Paste | 将内存中的文本放在文档的光标当前位置。 |\n| Undo | 撤销对文档的最后更改。点击向下箭头选择你想返回到哪里。\
  \ |\n| Restore | 在使用`Undo` 取消更改后恢复文档的最后更改。点击向下箭头选择你想重做多少。 |\n| Help | 打开`OpenOffice.org`\
  \ 帮助对话框。 |\n| Update | 更新窗口中显示的公式。 |\n| Formula Cursor | 开启或关闭公式光标。 |\n| Catalog\
  \ | 访问符号目录 |\n\n\n\n\n打开符号对话框。\n\n### 命令窗口\n\n如果你从未用过公式编辑软件，在 OpenOffice.org Math\
  \ 中操作会变得复杂。例如，你无法在主（上方）文档窗口中直接输入任何内容；相反，你需要在 `Commands`（下方）窗口中输入。右键点击 `Commands`\
  \ 窗口会打开快捷菜单。要开始编写公式，请遵循以下步骤：\n\n**1. 右键点击 `Commands` 窗口。**\n主快捷菜单将打开。\n\n**2. 选择一个子菜单打开。**\n\
  例如，`Formats`。\n\n![Image 119](img/index-258_1.jpg)\n\n**3. 选择此子菜单中的一个公式组件。**\n我们选择了\
  \ `matrix {. . . .}` 作为示例。立即，向公式中添加矩阵所需的代码就会出现在 `Commands` 窗口中。片刻之后，矩阵出现在文档窗口中。\n\
  组合效果如图 12-12 所示。\n\n**图 12-12：**\n在 OpenOffice.org Math 中开始添加矩阵。\n\n**4. 用适用于公式的适当字母和数字替换每个\
  \ `<?>` 条目。**\n当我们输入字母并将 `matrix{<?> # <?> ## <?> # <?>}` 更改为 `matrix{A # B ## C\
  \ # D}` 时，我们得到图 12-13 所示的结果。\n\n**5. 继续向公式中添加组件直到完成。**\n假设你想将矩阵乘以 3。要找到方法，按 `Enter`\
  \ 到 `Commands` 窗口的下一行，右键点击显示菜单，并选择 `Unary/Binary Operators➪a Times b`。此选择会在矩阵代码下方添加\
  \ `<?> times <?>` 短语。现在你已经知道如何格式化乘法操作，从屏幕上删除此短语，并将其作为指南将你的公式改为：\n\n```\n3 times\
  \ matrix{A # B ## C # D}\n```\n此行将给出图 12-14 所示的结果。\n\n![Image 120](img/index-259_1.jpg)\n\
  ![Image 121](img/index-259_2.jpg)\n\n**图 12-13：**\nOpenOffice.org Math 中的 4x4 矩阵。\n\
  \n**图 12-14：**\nOpenOffice.org Math 中的完整公式。\n\nOpenOffice.org Math 支持（等）它自己的 OpenDocument\
  \ 格式 (`ODF`)、等效的 StarOffice 格式 (`SXM`) 以及并非程序的 `MathML` 1.01 (`MML`)。`MathML` 是一个标准——类似于用于\
  \ Web 开发的 `HTML`——具体来说，它是该标准的 1.01 版本。对于此版本的 `MathML`，请参见 `www.w3.org/TR/REC-MathML`。主标准页面可以在\
  \ `www.w3.org/Math/` 获取。如果你需要在网页上添加公式，这个网站会非常有意思！\n\n## 第 13 章：音频处理\n\n 本章内容\n-\
  \ 解决声音问题\n- 听音乐\n- 将音乐录制到 CD 和 DVD 中\n- 将音频文件从 CD 复制到工作站\n\n“自由的代价是责任，但这是一个划算的买卖，因为自由是无价的。”\
  \ —— Hugh Downs\n\n如果你和我们一样，有了音乐一切都会变得更好。如果计算机无论我们在何处都无法取代音响系统，那么我们就不感兴趣了。所以我们可以向你保证，Linux\
  \ 提供了许多在计算机上听音乐的方法。继续阅读以了解 Linux 能做什么！\n\n在 Linux 上听 MP3 曾经是个问题；`MP3` 是一种专利格式，Linux\
  \ 用户此前无法使用。但现在 `RealPlayer` 已适用于 Linux，并拥有播放 `MP3s` 的许可，所以你完全准备好了。请查看第 16 章了解如何安装\
  \ `RealPlayer`。\n\n### 什么声音？我什么也听不见！\n\n如今，大多数 Linux 发行版在安装过程中会自动检测声卡——而且它们做得非常好。然而，如果你的声卡测试失败——或者你尝试使用本章中的某个软件选项播放声音但无效——请使用本节来诊断并修复你的问题。\n\
  \n假设你的声卡通过了测试，但由于某些原因你什么也听不到。以下是处理方法：\n\n**1. 检查扬声器或耳机是否连接正确。**\n![Image 122](img/index-263_1.jpg)\n\
  你不会是第一个发现猫把插头从插座拔出来的人。\n\n**2. 点击面板上的喇器图标，确保你的音频设置没有被调到零或静音。**\n`GNOME` 和 `KDE`\
  \ 桌面都在系统托中提供一个图标，让你可以直接访问声音系统的音量控制。使用鼠标向上或向下滑动条来增加或减少音量级别。\n\n**3. 右键点击同一个喇器图标以进行更详细的音量调整。对于\
  \ `GNOME` 和 `KDE` 桌面，你都可以从同一个喇器图标访问 `Volume Control` 应用程序。**\n\n**4. 选择菜单选项启动桌面的\
  \ `Volume Control` 应用程序。**\n图 13-1 显示了 GNOME 音量控制。\n\n**图 13-1：**\nGNOME Volume\
  \ Control。\n\n当此控制打开时，你可以检查音量设置来帮助解决声音难题。\n- `Master`：主音量控制对应桌面上的音量滑块。\n- `Headphone`：调整工作站耳机插口的音量。\n\
  - `PCM (for Pulse Code Modulation)`：控制存储在计算机上的音频文件的音量。\n- `Front`：调整工作站前扬声器的音量。\n\
  - `Line-in`：控制通过声卡线路输入接口进入声音的音量。\n![Image 123](img/index-264_1.jpg)\n- `CD`：控制通过\
  \ CD 和/或 DVD 播放器进入声音的音量。\n- `Microphone`：控制通过声卡麦克风接口进入声音的音量。\n\n如果你在使用 `KDE` 桌面，右键点击喇器图标时会看到\
  \ `KMix` 音量控制（图 13-2）。\n\n**图 13-2：**\nKDE KMix 控制。\n\n在 `KMix` 中，你还会看到针对不同元素的独立滑块：\n\
  - `Front`：控制计算机内置扬声器的音量。如果有立体声输出，你会看到两个 `Front` 滑块，一个用于左声道，一个用于右声道。\n- `PCM`：控制存储在计算机上的音频文件的音量。\n\
  - `CD`：控制通过 CD 和/或 DVD 播放器进入声音的音量。\n- `Headphones`：控制工作站外部扬声器插口的音量。\n\n`Capture`\
  \ 复选框允许你更改滑块的含义。它不再控制 CD 音量，而是控制你从该设备进行任何录制的音量。\n\n当你熟悉了 `GNOME` 或 `KMix` 控制中的内容后，请寻找以下两个主要线索之一来判断可能出了什么问题：\n\
  - **你看到的项目是否被静音？** 你可以通过查看 GNOME 音量控制中每个部分下方音量图标旁边的红色 X，或者查看 `KMix` 中是否勾选了 `Mute`\
  \ 复选框来判断。例如，在图 13-1 中`Line-in` 和 `Microphone` 都是静音的。你看到的静音项目是你问题所在吗？例如，如果你将耳机连接到\
  \ `Line-in` 接口且 `Line-in` 被静音，那么当你戴上耳机时什么也听不到。要取消静音，点击 X 让它消失。\n![Image 124](img/index-265_1.jpg)\n\
  - **是否有任何音量滑块完全调到底？** 再次，图 13-1 中的 `Line-in` 和 `Microphone` 都滑到了底部。使用相同的耳机例子，即使\
  \ `Line-in` 没有静音，由于滑块在底部，你什么也听不到。向上滑动滑块看看是否能听到声音。\n\n如果这两种情况都不符合你的问题，它可能是更底层的问题。为了进行调查，请在你的\
  \ Linux 发行版中找到 `Sound Preferences` 对话框。对于 `GNOME` 桌面，请尝试以下操作：\n\n\n\n\n\n# 第 13\
  \ 章：音频调试\n\n## 1. 在 Ubuntu 中，选择系统➪设置➪声音；在 Fedora 中，选择系统➪设置➪硬件➪声音，以查看声卡是否被正确检测并播放测试音。\n\
  \n在打开声音偏好对话框之前，你可能被要求输入 root（管理员）密码，如图 13-3 所示。在“设备”选项卡中，你应该看到你的 Linux 发行版用于与不同类型的音频声卡交互的驱动程序。通常此值被设置为\
  \ `Aut`，以便 GNOME 可以使用任何激活的驱动程序。\n\n## 2. 点击每个声音类型部分的“测试”按钮。\n\n你应该能从左侧、右侧和中间听到声音。如果没有听见，请从下拉列表中为声卡选择其他驱动程序（如果可用），然后再次测试。\n\
  \n**图 13-3：**\nGNOME 声音偏好对话框。\n![Image 125](img/index-266_1.jpg)\n\n## 3. 如果这些操作都没有帮助，请访问你喜欢的搜索引擎，输入你的声卡品牌、型号以及单词\
  \ linux。\n\n你可能会通过这种找到一些有用的信息。对于 KDE 桌面，可以在“系统设置”窗口的“声音”部分找到声音设置。\n\n## 听听 CD\n\n\
  如果你的电脑上有 CD/DVD 播放器，你可以在工作（或玩耍！）时播放音频 CD！你使用的应用程序再次取决于你的桌面。接下来的章节将带你了解每个桌面最常用的应用程序——GNOME\
  \ 的 Rhythmbox 和 KDE 的 KsCD。\n\n#### Rhythmbox\n\n在 GNOME 桌面上，第一次插入音频 CD 时，会出现一个对话框，询问你想要使用什么程序来播放\
  \ CD（如图 13-4 所示）。\n\n**图 13-4：**\n音频光盘对话框。\n\nFedora 和 Ubuntu 都包含了用于播放音频 CD 的 Rhythmbox\
  \ 应用程序。只需选择该选项（它应该是默认选项），并点击确定。如果你希望以后的音频 CD 自动播放，只需勾选告诉 Rhythmbox 在你点击确定之前始终执行此操作的复选框。每当你插入音频\
  \ CD 时，Rhythmbox 就会启动。\n\nRhythmbox 会扫描 CD 并在音乐播放器窗口中显示 CD 的曲目和曲目长度。如果你的工作站连接了互联网，Rhythmbox\
  \ 还会连接远程 CD 数据库以提取有关 CD 的信息——包括 CD 标题、单曲歌曲标题以及可能的 CD 专辑封面艺术。图 13-5 显示了打开音频 CD 后\
  \ Rhythmbox 的窗口。\n\n**图 13-5：**\n使用 Rhythmbox 启动音频 CD。\n![Image 126](img/index-267_1.jpg)\n\
  \nRhythmbox 的主界面非常简单。它在主窗口区域列出了各个 CD 曲目，以及它获取的基本曲目信息。工具栏提供了你与 CD 播放器交互所需的各种基本功能按钮，外加：\n\
  \n*   **播放 (Play):** 开始当前曲目。\n*   **上一个 (Previous):** 跳到歌曲列表中的上一个曲目。\n*   **下一首\
  \ (Next):** 跳到歌曲列表中的下一个曲目。\n*   **重复 (Repeat):** 重复当前曲目。\n*   **随机 (Shuffle):**\
  \ 随机播放列表中的曲目。\n*   **浏览 (Browse):** 浏览音乐曲目。\n*   **刻录 CD (Copy CD):** 将 CD 复制副本到空白\
  \ CD 上。\n*   **视觉化 (Visualization):** 在播放曲目时显示屏保图像。\n*   **弹出 (Eject):** 将 CD 从光驱中取出。\n\
  *   **提取 (Extract):** 将 CD 上的曲目转换为音频文件并存储在主文件夹的音乐库中。\n\n“提取”功能允许你将 CD 上的曲目复制到工作站的音频文件（称为“刻录”），我们将在本章节后面的“从\
  \ CD 刻录音乐曲目”部分详细介绍这一过程。\n\n![Image 127](img/index-268_1.jpg)\n\n#### KsCD\n\n在 KDE\
  \ 桌面上插入音频 CD 时，你不会看到任何变化。相反，KDE 会静静地将其放在面板中的新设备小部件中（参见第 5 章）。要播放 CD，你需要手动启动 CD 播放器。KDE\
  \ 中播放音频 CD 的工具称为 `KsCD`。你可以通过选择 KDE➪应用程序➪多媒体找到它。图 13-6 显示了 KsCD 主窗口。\n\n**图 13-6：**\n\
  KsCD 主窗口。\n\n惊讶的是，它看起来像一个真实的 CD 播放器！如果你用过 CD 播放器，可能可以猜出点击哪些按钮来播放 CD。你可能还会注意到，和 Rhythmbox\
  \ 一样，`KsCD` 会访问互联网获取专辑和曲目名称（如果你有互联网连接）。这让观察 KsCD 界面比盯着收音机要有意思得多！\n\n### 听听下载的音乐\n\
  \n从互联网下载音乐是一项有趣的活动。很多人喜欢假装这既合法又符合伦理，但实际上，取决于你从哪里获取音乐，这通常是盗窃。我们将这一伦理问题留给你和你的信仰体系，但由于我们自己的伦理认为这是盗窃，我们将专注于向你展示那些你从法律和伦理上都是受欢迎下载的音乐！\n\
  \n合法歌曲的一个来源是艺术家的网站。许多流行艺术家提供其歌曲的免费样本，许多新艺人免费提供整个歌曲供下载。在这些情况下，非常欢迎你下载并收听！\n\n你现在可能已经知道的，用于收听下载音乐的程序取决于你的桌面。`Amarok`\
  \ 可以在 KDE 桌面上提供帮助，而 `Rhythmbox` 可以在 GNOME 桌面上提供帮助。\n\n![Image 128](img/index-269_1.jpg)\n\
  \n#### Amarok\n\n在 KDE 桌面世界，音频文件播放之王是 `Amarok` 音乐播放器。我们遇到的几乎每个 KDE 桌面安装都使用 `Amarok`\
  \ 来播放音频文件。操作步骤如下：\n\n1. **安装 Amarok 后，通过选择应用程序➪多媒体➪音频播放器启动它。**\n\n第一次启动 `Amarok`\
  \ 时，会启动首次运行向导，显示欢迎界面，然后带你进入配置屏幕的“配置收藏”（Configure Collection）部分。\n\n2. **展开（点击 +\
  \ 号）和收起（点击 – 号）文件系统的各个部分，直到你找到包含你音乐的区域。**\n\n当你显示这些文件夹（例如，`/home/rich/Music`）时，点击它们的框以添加勾选（参见图\
  \ 13-7）。在“递归扫描文件夹”（会查找子文件夹）和“监控文件夹更改”（会自动获取新文件）旁边留（（或放置）勾选。这样 `Amarok` 就能完成大部分工作。\n\
  \n**图 13-7：**\nAmarok 配置收藏屏幕。\n![Image 129](img/index-270_1.jpg)\n\n3. **点击“导入收藏”按钮将你现有的音频文件导入\
  \ Amarok 库中。**\n\n导入收藏向导启动。\n\n4. **选择一个站点来获取音频文件的曲目信息（如艺术家名称），然后点击“下一步”。**\n\n\
  你可以从 `Amarok` 1.4 网站或流行的 Apple iTunes 网站获取信息。\n\n5. **选择一个用于 Amarok 库的数据库系统，然后点击“下一步”。**\n\
  \n如果你不是数据库专家，只需只需选择默认的 `SQLite` 数据库系统。这会为你的库创建一个单一数据库文件。从此屏幕，你还可以选择在可用时导入专辑封面。\n\
  \n6. **点击“完成”完成收藏的导入，然后点击“确定”退出配置屏幕。**\n\n显示默认的 `Amarok` 界面，如图 13-8 所示。\n\n\n\n\n\
  \n# 图 13-8：Amarok 主界面。\n\n在此处，你必须将音乐添加到右侧才能播放。你可以（例如）逐个拖放文件。\n\nAmarok 窗口左侧是一系列标签页。根据你版本的不同，你看到的和我们看到的可能有所不同。每个标签提供某些功能区域，并可能会更改播放列表左侧的界面。Amarok\
  \ 从上到下显示的标签为：\n\n* **Files（文件）：** 浏览你的文件系统，以找到你想要点击并拖入播放列表的单个歌曲。\n* **Playlists（播放列表）：**\
  \ 在这里你可以创建新的播放列表并访问已有的列表。智能播放列表（Smart Playlists）部分为你提供了多种预设列表，例如，如果你想听所有内容，可以使用\
  \ `All Collection`（所有集合）；让播放器为你随机选择的 `50 Random Tracks`（50 首随机）；`Genres`（流派，如果你在刻\
  \ CD 时花时间分配流派信息）等。动态播放列表（Dynamic Playlists）与智能播放列表不同，它们是不断变化的；例如，`Random Mix`（随机混合）动态播放列表会从你的集合中随机选择音乐，并在你继续播放时持续选择。对于\
  \ `Suggested Songs`（推荐歌曲），你可以在播放列表中放入几首关键歌曲，然后 `Last.fm` (www.last.fm) 会根据它认为相似的音乐为你创建一个个性化的在线电台。如果你是在线电台的忠实粉丝或对此好奇，可以查看\
  \ `Radio Streams`（广播流）部分的 `Cool-Streams` 文件夹。在这里你会找到很多可以选择的电台。\n* **Internet（互联网）：**\
  \ 如果你连接了互联网，Amarok 可以让你连接到提供音频流的流行互联网电台，搜索可以在线购买的书籍和音频记录，或听播客。\n* **Collection（收藏）：**\
  \ 显示你的音乐收藏。在列表上方，点击 `Search Preferences`（搜索偏好）按钮选择功能（例如收藏是否按分组、专辑等组织）。你可以通过在搜索文本框中输入歌曲来快速搜索。点击\
  \ `Advanced`（高级）按钮，会出现 `Filter`（过滤器）对话框；你可以在那里输入关键词来确定显示哪些歌曲。\n\n无论你如何将音乐放入右侧的播放列表，一旦进入，你就可以点击窗格左上角的\
  \ `Play`（播放）按钮播放选定的曲目。你也可以双击曲目播放。音量滑块位于窗格的右上方。\n\nAmarok 的功能远于此。花时间探索这个程序并根据你的喜意进行真正的自定义。当你关闭此程序时，会出现\
  \ `Docking In System Tray`（停留在系统托盘）对话框。它警告你 Amarok 将继续运行并在面板上显示系统托盘图标。你可以通过选择 `Actions\
  \ ➪ Quit`（操作 ➔ 退出）而不是点击应用程序角的 `X` 来关闭程序来避免这种情况。如果你让程序留在面板上，可以随时点击小狼图标来打开它。\n\n如果你使用移动数字音频播放器（例如流行的\
  \ `iPod`）收听数字音频文件，你可能可以使用 Amarok 与你的数字播放器交互。Amarok 可以检测插入 `USB` 端口的数字播放器。如果检测到数字播放器，Amarok\
  \ 会在主界面界面中创建一个 `Device`（设备）标签（见图 13-8）。选择该标签查看 Amarok 是否可以与你的移动数字音频播放器交互！\n\n![Image\
  \ 130](img/index-272_1.jpg)\n\n### 第 13 章：玩转音频\n\n## 重新回顾 Rhythmbox\n\nGNOME 桌面上播放音频文件最流行的工具是\
  \ `Rhythmbox`。没错——我们刚刚看过的播放音频 CD 的同一个工具也可以播放音频文件。\n\n默认情况下，主 `Rhythmbox` 库区域是你用户主目录下的\
  \ `Music`（音乐）文件夹。当你选择主页面 `Library`（库）部分的 `Music` 链接时，`Rhythmbox` 会显示它在你的库中找到的文件。\n\
  \n如果你尝试播放你的 Linux 发行版没有提供解码器的音频文件（例如 `MP3` 文件），它会显示一条警告消息，如图 13-9 所示。\n\n某些 Linux\
  \ 发行版（如 `Fedora` 和 `Ubuntu`）在它们的软件仓库中提供了针对各种音频文件类型的额外解码器。如果你的工作站连接了互联网，点击警告消息中的搜索按钮，尝试在相应的软件包仓库中为该音频文件类型查找合适的解码器。\n\
  \nLinux 使用在许多不同的国家，因此仅仅因为你找到了感兴趣的音频文件类型的解码器，并不意味着在你的国家使用该解码器是合法的！例如，你可以很容易在 `Fedora`\
  \ 和 `Ubuntu` 仓库中找到 `MP3` 文件解码器，但在美国没有适当许可的情况下解码 `MP3` 音频文件是违法的。（现在，这真扫霉。）\n\n**图\
  \ 13-9：** Fedora 发行版中显示的音频文件解码器警告消息。\n\n## 从 CD 提取音乐曲目\n\n将音乐从 CD 复制到自己的工作站是另一个话题，如果不至少承认伦理和法律问题，就无法涵盖。我们不会在这里讨论法律细节，但我们的个人伦理是：为了自己使用而从自己的\
  \ CD 上刻录（复制）音乐是可以的。如果我们想从购买的 CD 中提取喜欢的歌曲，并设置它们以便在电脑硬盘的随机播放列表中统一收听，我们认为这没有问题。\n\n\
  尽管如此，要在 Linux 中从你的 CD 提取曲目，你需要流行的刻录软件软件包之一。你已经看到 `Rhythmbox` 如何从音频 CD 刻录歌曲了，所以我们来看一个流行的软件包——\
  \ `Sound Juicer` ——它专门用于从 CD 刻录歌曲。因为它只专注于一件事，所以它为我们提供了几个额外的选项。\n\n`Sound Juicer`\
  \ 软件包在大多数 Linux 发行版中可用，包括 `Fedora`。如果你在菜单系统的 `Multimedia` 区域没有看到它，请查看第 16 章进行安装。\n\
  \n一旦你有了 `Sound Juicer`，从音频 CD 刻录歌曲就很简单了：\n\n1. **在 Fedora GNOME 面上选择 `Applications\
  \ ➞ Sound & Video ➞ Audio CD Extractor`（见图 13-10），或在 Fedora KDE 面上选择 `Applications\
  \ ➞ Multimedia ➞ Audio CD Extractor`。**\n\n`Sound Juicer` 启动并显示 CD 曲目。如果你的工作站连接了互联网，`Sound\
  \ Juicer` 还会显示专辑和曲目标题。\n\n2. **对于你不想刻录的每首歌，取消选中歌曲旁边的复选框。**\n\n对于不想数字化的每首歌，复选标记都会消失。\n\
  \n3. **选择 `Edit ➞ Preferences.`（编辑 ➞ 偏好）。**\n\n出现 `Preferences`（偏好）对话框，如图 13-11\
  \ 。\n\n4. **在 `Output Format`（输出格式）下拉列表中选择你喜欢的音频格式。**\n\n如果你的可用空间有限，我们强烈建议使用 `Ogg\
  \ Vorbis (.oga)`，因为这种格式在 Linux  easily 容易处理，且没有固有的法律问题，而且同等音质下比 `MP3` 压缩率更高。\n\n\
  然而，如果你为家庭音响获得更高的音质，可以使用 `FLAC (.flac)` —— 另一种开放格式，但音质没有任何损失。\n\n![Image 131](img/index-274_1.jpg)\n\
  \n![Image 132](img/index-274_2.jpg)\n\n**图 13-10：** Sound Juicer CD 提取器。\n\n5. **点击\
  \ `Folder`（文件夹）下拉列表选择你想保存音乐文件的地方。**\n\n如果想使用的位置不在列表中，选择 `Other`（其他），然后浏览到你想使用的文件夹。\n\
  \n**图 13-11：** Sound Juicer 偏好对话框。\n\n6. **在 Track Names（曲目名称）部分，选择你希望 `Sound Juicer`\
  \ 如何命名和安排子目录中的文件。**\n\n7. **进行你想做的任何其他配置更改。**\n\n8. **完成更改后点击 `Close`（关闭）。**\n\n\
  \n\n\n\n### 9. 点击提取。\n\n`Sound Juicer` 窗口在底部显示一个进度条，并高亮显示当前正在处理的轨道。提取完成后，会弹出一个对话框。\n\
  \n### 10. 选择光盘 ➪ 菜单栏中的“弹出”。\n\nCD 托盘打开。\n\n### 11. 移除 CD 并关闭托盘。\n\n### 12. 关闭 Sound\
  \ Juicer。\n\n现在，你已经将 CD 轨道存储为数字音频文件。你可以将这些文件导入到你的库中（无论是使用 `Rhythmbox` 还是 `Amarok`），在那里你可以直接听它们，而不需要一直取出\
  \ CD。\n\n### 刻录音频 CD 和 DVD\n\nCD 和 DVD 刻录机——`CD` 和 `DVD` 刻录机是数据备份（特别是使用可重写光片时）、保存和分享数字照片以及制作多媒体纪念品和剪集的极佳方法。但它对于创建可以在任何类型的\
  \ CD 播放器上播放的音频 CD 也非常好，而不限于计算机。Linux 下有很多工具可以让你录制 CD。\n\n例如，如果你正在使用 `GNOME` 桌面，可以使用第\
  \ 7 章讨论的文件系统导航工具，右键点击想要录制的文件，并从上下文菜单中选择适当选项，从工作站的音频文件录制 CD 和 DVD。\n\n然而，这种方法通常只是将数字音频文件刻录到\
  \ CD 或 DVD 上。如果你尝试创建一个可以在不支持数字音频文件格式的老旧 CD 播放器上播放的音频 CD，这种方法将不起作用。\n\n这里我们关注 `K3b`，这是一种在\
  \ `KDE` 桌面上流行的 CD 刻录软件，它也可以在 `GNOME` 桌面上运行。`K3b`软件可以从系统上的数字音频文件创建音频 CD。\n\n在 `KDE`\
  \ 桌面选择 `应用程序` ➪ `多媒体` ➪ `CD & DVD 刻录` 打开 `K3b`，主窗口将打开，如图 13-12 所示。\n\n![Image 133](img/index-276_1.jpg)\n\
  \n![Image 134](img/index-276_2.jpg)\n\n**图 13-12：** `K3b` CD 和 DVD `Kreator` 刻录机。\n\
  \n如果你只是想用下载的音乐或音频文件创建一个音频 CD，请执行以下操作：\n\n### 1. 在 K3b 主窗口中点击“新建音频 CD 项目”选项。\n\n\
  打开“音频 CD 当前项目”对话框（图 13-13）。\n\n### 2. 在顶部区域，点击文件夹按钮并导航到你想要刻录到 CD 的文件。\n\n**图 13-13：**\
  \ `K3b` 音频 CD 当前项目对话框。\n\n![Image 135](img/index-277_1.jpg)\n\n### 3. 将想要刻录的文件拖放到页面的下半部分。\n\
  \n当你将文件拖入下半部分时，底部的状态栏会增长，向你显示 CD 上的剩余空间。\n\n### 4. 完成后，点击下部分的“刻录”按钮开始刻录。\n\n出现“K3b\
  \ 音频项目”对话框，如图 13-14 所示。\n\n### 5. 插入一张空白 CD，选择刻录速度（如有必要），并点击“刻录”按钮。\n\n刻录过程开始将你的数字音频文件复制到\
  \ CD 上作为模拟音频文件。\n\n### 6. 从驱动器中取出你的新 CD，然后点击“关闭”关闭刻录信息对话框。\n\n### 7. 再次点击“关闭”关闭主刻录对话框。\n\
  \n### 8. 选择文件 ➪ 退出以关闭 K3b。\n\n现在，你可以把你的音频 CD 带到几乎任何 CD 播放器上听你下载的文件了！\n\n**图 13-14：**\
  \ `K3b` 音频项目对话框。\n\n## 第 14 章：视频与图形\n\n### 本章内容\n- 观看在线和下载视频\n- 观看 DVD\n- 使用 `GIMP`\
  \ 创建和修改强大的图形\n- 玩 3D 游戏\n\n*视频杀死了电台之星。* — Buggles 乐队\n\n毫无疑问，视频是 Linux 一直在追赶领域之一。原始的\
  \ Linux 系统甚至不支持 Windows 风格的桌面！在 Linux 早期，几乎不可能显示任何类型的视频，更不用说播放电影或高端计算机图形游戏了。\n\n\
  幸运的是，现在情况大不相同了。在视频世界，你的 Linux 计算机没有多少做不到的事情（除非那是非法的，但稍后会详述）。本章将带你了解 Linux 计算机的视频和图形能力。\n\
  \n### 观看那些搞笑的网络视频\n\n互联网已经成为你可以想象的几乎任何类型视频内容的集散地（甚至有些是你尝试时也无法想象的）。\n\n从 `Google\
  \ Videos` 到 `YouTube`，有很多网站可以让你尽享乐趣。\n\n通过 `Firefox`  浏览器（见第 9 章），你的 Linux 系统可以显示许多不同类型的网络视频（尽管遗憾的是，默认情况下并不是所有的）。\n\
  \n![Image 136](img/index-279_1.jpg)\n\n### 检查你的插件\n\n插件是在 `Firefox` 中显示网络视频内容的关键。正如第\
  \ 9 章讨论的，插件为 `Firefox` 浏览器提供了额外功能。\n\n你可以按照以下步骤检查你的 `Firefox` 配置中已经安装了哪些插件：\n\n\
  ### 1. 选择 `应用程序` ➪ `互联网` ➪ `Firefox 浏览器` 来打开 Firefox。\n\n你也可以通过点击 `GNOME` 桌面顶面板地球图标来启动\
  \ `Firefox`。\n\n### 2. 选择 `工具` ➪ `扩展组件`；然后在扩展组件对话框中点击“插件”图标。\n\n`插件` 标签页显示当前已安装插件的信息，如图\
  \ 14-1 所示。\n\n**图 14-1：** `Firefox` 扩展组件插件对话框。\n\n你看到的插件取决于你特定的 Linux 发行版和版本。\n\n\
  默认情况下，`Fedora 10` 的 `Firefox` 安装包含以下插件：\n\n- **IcedTea Java Web Browser：** 提供从 Web\
  \ 运行 Java applet 支持，通常用于动画\n- **MozPlugger：** 播放 QuickTime 和 Windows 媒体文件格式\n- **QuickTime：**\
  \ 用于播放 `MOV` 和 `QT` 格式的 Apple QuickTime 视频\n- **Totem Web Browser：** 全功能视频音频播放器，可以显示\
  \ `AVI`、`ASF`、`WMV`、`OGG` 和 `MPG` 视频格式，并播放 `WAV` 和 `MP3` 音频格式\n- **VLC Multimedia：**\
  \ 播放大多数标准视频格式，包括 `GoogleVideo` 使用的 `VLC` 格式\n- **Windows Media Player：** `Totem`\
  \ 播放器的插件，用于播放微软格式的流媒体视频，如 `ASF`、`WMV` 和 `WVX`\n- **DivX Web Player：** 用于播放 `DivX`\
  \ 编码的 `AVI` 视频\n\n尽管表面上看你似乎已经涵盖了大部分网络视频需求，但你可能会对实际的视频效果感到失望。\n\n尽管 `Totem` 支持流行的\
  \ `WMV` 和 `MOV` 视频格式，但高质量视频不仅仅是支持正确的文件格式。\n\n微软和 `QuickTime` 视频格式使用称为 `codecs`（解码器）的专利编码方案，这些受许可协议的严格控制。微软公司控制着\
  \ `WMV` 视频格式（你猜对了），并没有为大多数 Linux 系统提供使用该解码器的许可。因此，`Fedora` 默认不支持 `WMV` 视频格式。\n\n\
  `QuickTime MOV` 和 `QuickTime` 视频文件情况也是如此。\n\n尽管如此，一些资源丰富的开源程序员复制了微软视频格式的解码器，并创建名为\
  \ `W32codec` 的软件包。安装此包允许你查看网络上提供的几乎所有类型的视频。\n\n由于 `W32codec` 在美国不被认为是合法的软件包，它没有包含在标准的\
  \ `Fedora` 发行版中。你很可以在互联网上找到它，但别说我们没有警告过你。\n\n如果你想在美国的 Linux 下查看微软视频格式 —\n\n\n\n\n\
  法律上讲——你可以购买适用于 Linux 的 CrossOver Office 商业软件。它提供了查看 Macromedia Shockwave、Windows\
  \ Media Player 和 Apple QuickTime 电影格式所需的适当解码器，以及在你的 Fedora 计算机上运行许多 Microsoft 应用程序所需的库。你可以在\
  \ `www.codeweavers.com` 找到 CrossOver Office。\n\n# 第三部分：完成工作\n\n### 添加插件\n\n如果你在你感兴趣并使用的特定视频格式列表中没有看到列出的插件，可以去查看是否存在该插件。Firefox\
  \ 插件的汇集地位于 `http://plugindoc.mozdev.org`（Firefox Web 浏览器基于 Mozilla 开源浏览器）。该网站包含许多不同类型视频相关插件的链接。\n\
  \nMacromedia Flash 视频播放器是一个流行的插件，支持流行的 YouTube 网站（以及许多其他网站）上使用的视频格式。\n\nUbuntu 默认安装了\
  \ Shockwave Flash 播放器插件，但 Fedora 没有。以下是可以在你的 Fedora 系统上轻松安装它的方法：\n\n1. **打开 Firefox，并到\
  \ `plugindoc.mozdev.org`。**\n2. **点击页面顶部的 Linux (x86) 链接。**\n如果你恰好运行在 64 位 Linux\
  \ 发行版上，请选择 `Linux (x86 64)` 链接。\n3. **点击 Flash Player 链接。**\n4. **点击 Download Macromedia\
  \ Flash Player for x86 Linux 链接。**\n此链接将你重定向到 Adobe Flash 安装网页。\n5. **选择要下载的版本。**\n\
  对于 Fedora，你可以为 Linux 选择 `YUM`。它使用 Fedora 软件管理器（见第 16 章）。\n6. **点击 Agree and Install\
  \ Now（同意并立即安装）按钮。**\n7. **当 Firefox 下载管理器对话框打开时，点击 OK。**\n默认操作是使用 Fedora 软件管理器自动打开文件。\n\
  8. **点击 Install（安装）按钮安装包。**\n9. **在 Missing Security Signature（缺少安全签名）对话框中点击 Force\
  \ Install（强制安装）按钮。**\nAdobe Flash 安装包没有签名，但直接从 Adobe 网站下载的，所以它是安全的。\n10. **输入你的\
  \ root 用户密码以继续安装。**\n11. **点击 Close（关闭）按钮退出软件管理器。**\n12. **安装完成后，打开 Firefox 并查看\
  \ Add-ons（扩展）对话框。**\n\n### 第 14 章：玩转视频与图形\n\n你现在应该可以看到你可以可以使用 Shockwave Flash 插件。现在你可以整天看\
  \ YouTube 视频了！\n\n## 获取更多视频支持\n\n如果你还记得第 9 章，Firefox 还支持一种名为 `extensions`（扩展）的功能。扩展是为\
  \ Firefox 浏览器提供额外功能的小型应用程序。如果你正在寻找更多的视频支持，或者一些酷炫的视频功能，有许多扩展可以提供帮助。Mozilla 扩展官方网站为\
  \ `https://addons.update.mozilla.org`。\n\n该网站使用安全版本的 HTTP，因此你必须使用 `https:` 而不是 `http:`。\n\
  \n你也可以直接从 Firefox 中的 Add-ons 对话框浏览扩展。\n\n我们最喜欢的扩展之一是 Fast Video Download。Fast Video\
  \ Download 允许你将网页（如 YouTube 和 MySpace）上的嵌入式流视频内容保存为计算机上的视频文件。以下是加载并安装它的方法：\n\n1.\
  \ **通过选择 Applications ➪ Internet ➪ Firefox Web Browser 打开 Firefox。**\n你也可以通过点击顶部面板上的地球图标启动\
  \ Firefox。\n2. **通过选择 Tools ➪ Add-on 打开 Add-ons 对话框；然后点击顶部的 Get Add-ons 图标。**\n\
  3. **在搜索框中输入 Fast Video Download。**\n4. **点击 Fast Video Download 扩展的 Add to Firefox（添加到\
  \ Firefox）按钮。**\n由于 Fast Video Download 扩展没有签名，会出现一个对话框询问你是否真的想安装它，如图 14-2 所示。\n\
  5. **点击 Install Now（立即安装）按钮安装扩展。**\n当此完成后，会出现 Add-ons 对话框，显示安装成功。\n6. **点击 Restart\
  \ Firefox（重启 Firefox）按钮使新扩展生效。**\n当 Firefox 启动时，你应该会在底部状态栏右侧看到新图标，并且会出现 Add-Ons\
  \ 对话框，显示 Fast Video Download 扩展已正确安装，如图 14-3 所示。\n\n![Image 137](img/index-283_1.jpg)\n\
  ![Image 138](img/index-283_2.jpg)\n\n**图 14-2:** 在 Firefox 中安装 Fast Video Download\
  \ 扩展。\n**图 14-3:** 已安装 Fast Video Download 扩展。\n\n要使用 Fast Video Download，导航到包含嵌入流视频的网页，然后点击状态栏中的\
  \ New 图标。Fast Video Download 会扫描网页寻找视频链接；然后它会显示一个对话框，询问你想将文件保存在哪里。\n\n你可以下载并保存嵌入式流视频并不意味着你有权分享它。在下载和分发任何在线内容之前，请确保你没有违反任何版权法。\n\
  \n### 使用 Totem 查看电影文件\n\n随着 DVR（数字视频录制机）的普及，在电子邮件中收到你侄女芭蕾舞的视频片段，或其他来自文件共享网站的其他“宝藏”并不罕见。这些文件通常以各种视频格式存储：\n\
  \n- **AVI:** Audio Visual Interleave 格式，一种大多数视频软件软件包支持的标准视频格式。\n- **DivX:** 一种专有的\
  \ AVI 视频压缩格式，在 Linux 下需要许可。\n- **MPG:** Moving Pictures Group（运动图像专家组）标准格式。\n- **WMV:**\
  \ Windows Media Video 格式，微软专用格式。\n- **RM:** RealNetworks 专用视频格式，需要 RealOne 播放器。\n\
  - **MOV（及 QT）:** Apple QuickTime 视频格式。\n\nFedora 和 Ubuntu 的默认视频文件查看器是 `Totem`。你可以通过双击保存视频文件启动\
  \ `Totem`，或从面板菜单启动（GNOME 选择 Applications ➪ Sound & Video ➪ Movie Player；KDE 选择 Applications\
  \ ➪ Multimedia ➪ Movie Player）。\n\n就像 Firefox 视频插件一样，许可限制了默认 Totem 安装可以播放的文件。你可以通过卸载\
  \ `Totem` 然后从 Totem 网页（`http://projects.gnome.org/totem`）安装原始软件包来获取支持更多类型的 Totem\
  \ 版本。只需按照第 16 章的步骤在 Fedora 或 Ubuntu 中安装新软件。\n\n当你启动 `Totem` 时，会出现主视图窗口，如图 14-4 所示。\n\
  \n![Image 139](img/index-285_1.jpg)\n\n**图 14-4:** Totem 主视图窗口。\n\n`Totem` 菜单提供了多种查看视频的选项。Movie\
  \ 提供了加载电影到 Totem 查看器的选项：\n\n- **Open:** 允许你浏览计算机上存储的视频文件并将其加载到播放列表中。\n- **Open location:**\
  \ 允许你从远程 Web 位置将视频文件添加到播放列表中。\n- **Properties:** 显示视频文件的属性，如格式以及任何嵌入信息（如标题、艺术家和时长）。\n\
  - **Eject:** 从计算机光驱中移除 DVD。\n- **Play/Pause:** 允许你启动播放列表中的选中文件。\n- **Quit:** 退出\
  \ Totem 应用程序。\n\nEdit 菜单控制电影播放方式：\n\n- **Take screenshot:** 允许对视频文件中的场景拍摄静态快照。\n\
  - **Repeat Mode:** 重复播放视频文件直到你停止。\n- **Shuffle Mode:** 随机顺序播放列表中的视频文件。\n\n\n\n\n\
  - **清空列表：** 移除列表中的所有文件。\n\n# 第 14 章：处理视频与图形\n\n- **插件：** 控制 Totem 使用的插件。\n- **选项：**\
  \ 允许你设置基本的视频和音频设置，例如设置色彩平衡和音频输出格式。\n\n`View` 菜单控制视频在屏幕上的显示方式：\n\n- **全屏：** 使用整个计算机屏幕显示视频文件。\n\
  - **窗口适应电影：** 自动调整 Totem 视图窗口以适应视频文件的默认大小；允许你以默认大小的 50%（比例为 1:2）比例查看电影。\n- **宽高比例：**\
  \ 允许你将查看模式设置为标准的 4:3 或宽屏视频的 16:9。\n- **切换角度：** 更改提供该功能的 DVD 的摄像头视角。\n- **显示控制控件：**\
  \ 在查看窗口底部显示播放、跳过和位置控制控件。\n- **字幕：** 如果视频中包含字幕则显示字幕。\n- **侧边栏：** 在查看窗口中包含播放列表侧边栏窗口。\n\
  \n`Go` 菜单控制播放视频文件的哪个部分。对于视频文件，它提供了指向视频内部特定菜单的链接，例如标题菜单、章节菜单、音频菜单和摄像角度菜单。它还使用这些通用选项：\n\
  \n- **跳转到：** 定位视频文件中的特定点。\n- **向前跳过：** 在视频文件中快速向前进。\n- **向后跳过：** 在视频文件中快速向后退。\n\n\
  `Sound` 菜单控制音频的处理方式：\n\n- **语言：** 如果视频文件中可用备语言音频轨道，则播放。\n- **增大音量：** 增加音频轨的音量级别。\n\
  - **减音量：** 降低音频轨的音量级别。\n\n`Help` 菜单显示 Totem 手册以及你运行的软件版本信息。\n\n## 第三部分：完成任务——观看\
  \ DVD\n\n如果你在美国，在 Linux 中观看 DVD 有些是一个法律困境。《数字千年版权法案》（`DMCA`）和其他问题使得任何开源程序在面对以各种方式编码或保护的电影时，在导航许可迷宫时变得棘手。然而，并非所有的\
  \ DVD 都开启了此类反制措施：有些美国人可以在 Linux 下*可以*顺利地观看 DVD。（注意，我们说的是*观看*，而不是*复制*或*盗版*。）\n\n\
  更多关于 `DMCA` 以及由此产生的问题，请访问 `anti-dmca.org`。\n\n在 Fedora 中观看 DVD，你可以使用 `Totem`。然而，正如你在尝试查看视频文件时看到的，Fedora\
  \ 自带的 `Totem` 版本在支持格式方面经过了精简——再次，这更多是一个法律问题。通常，可以通过卸载 `Totem`、添加包含多媒体工具的软件存储库，然后从这些存储库安装完整版本的\
  \ `Totem` 来替换此版本（这些技能将在第 16 章中讨论）。这是我们推荐的观看 DVD 的解决方案。\n\n非官方 Fedora FAQ 网站（`www.fedorafaq.org`）提供了关于在\
  \ Fedora 计算机上查看 DVD 的更多技巧。\n\n### 创建与修改图形\n\n*GIMP* 是一款图形程序，在许多方面被认为等于 Adobe Photoshop。许多人并不认为\
  \ GIMP 是地球上最友好的程序，但至少，它有足够的功能让你忙碌地实验几周！要打开 GIMP，请选择 `Applications ➪ Graphics ➪ GIMP\
  \ Image Editor`（在 Fedora 中，它列出的全名是 GNU Image Manipulation Program）。\n\n当你启动 GIMP\
  \ 时，必须通过其用户设置程序。坦率地说，每次在提示时，你只需点击 `Continue` 即可，除非你是一个有特殊理由以不同方式进行操作的图形大师。在你点击过所有这些对话框后，会弹出一个或多个对话框，包含\
  \ GIMP 主对话框（见图 14-5）以及两个额外的工具对话框。你可以关闭包含 `Layers`（图）、`Channels`（通道）、`Paths`（路径）和\
  \ `Undo`（撤销）功能的右侧对话框。\n\n![Image 140](img/index-288_1.jpg)\n\n**图 14-5：** Fedora\
  \ 中的 GIMP 主对话框。\n\n工具箱对话框和主对话框整合在一起。你无法关闭工具箱，但可以通过右键点击标题栏并选择 `Move to Workspace\
  \ Right` 将其移动到屏幕另一个工作区域。\n\nGIMP 是一个极其复杂的程序，为那些真正深度使用它的人编写了整整的书。这里有几点可以帮助你入门。\n\n\
  ### GIMP 基础工具\n\nGIMP 的美之处在于所有工具都出现在独立的对话框中，允许你在绘图时布局多个工具。主对话框允许你在编辑图像时在不同的工具对话框之间协调。\n\
  \n`File` 菜单允许你打开或获取一个用于处理的图像。在 GIMP 中，你可以从五个不同的源编辑图像：\n\n![Image 141](img/index-289_1.jpg)\n\
  \n- 在空白画布上从头开始创建一个图像。\n- 从你的计算机加载现有图像。GIMP 支持所有标准图像类型，如 `GIF`、`JPEG`、`TIFF` 等。\n\
  - 从远程 Web 位置获取图像。\n- 从连接到计算机的扫描仪获取图像。\n- 生成桌面或桌面上单个应用程序窗口的截图图像。\n\n当你打开一个图像时，它会出现在主对话框的编辑窗口区域内。如果你一次打开多个图像，每个图像都将在自己的编辑窗口中打开。此功能允许你同时处理几幅图像；无需在单个窗口中在图像之间切换。\n\
  \n工具箱对话框包含了你从图像编辑器预期的所有图像编辑工具。你拥有用于选择图像区域的工具；重新定向图像（通过翻转等）；使用虚拟铅笔、`paintbrush`、`pen`\
  \ 或 `airbrush` 绘图；用颜色填充空间；添加基础特殊特效。\n\n对于你选择的每个工具，工具箱对话框的底部部分都会显示该工具的详细设置。在图 14-5\
  \ 中，选择了 `Paintbrush`（画笔）工具；与 `Paintbrush` 相关的设置（如画笔大小和颜色的透明度）出现在中间部分。\n\n你还可以将多个选项的详细设置作为单独的对话框。主对话框中的菜单栏允许你选择要打开的编辑功能。选择\
  \ `Tools` 会生成一个可以在桌面上打开的各种工具对话框列表（如图 14-6 所示）。\n\n![Image 142](img/index-290_1.jpg)\n\
  \n**图 14-6：** GIMP 工具对话框列表。\n\n工具箱对话框中工具下方是一个选择前景和背景颜色的区域（黑色和白色方块）。双击黑色方块设置前景颜色；双击白色方块设置图像的背景颜色。在该区域旁边，有一个图标，你可以轻松更改绘画工具的形状和大小。为了演示\
  \ GIMP 的功能，下一节将获取并调整一个示例图像。\n\n### 截屏\n\n为了获得一个可以使用的图像，你不妨测试截图功能。\n\n按照以下步骤创建截图图像：\n\
  \n1. 通过选择 `Applications ➪ Graphics ➪ The GIMP`（或你的 Linux 发行版为其分配的任何名称）打开 GIMP。\n\
  2. 从 GIMP 菜单中选择 `File ➪ Create ➪ Screen Shot`。\n\n截图对话框出现，如图 14-7 所示。\n\n\n\n\n\
  你可以选择捕获单个应用程序窗口或整个桌面。你还可以为 GIMP 截图设置延迟，这样你就可以在拍照之前有时间按照你想要的方式设置窗口。\n\n**图 14-7：**\
  \ GIMP 截图对话框。\n![Image 143](img/index-291_1.jpg)\n\n### 3. 截图完成后，The GIMP 会在图像编辑窗口中打开图像。选择`File（文件）➪`Save\
  \ As（另存为）来保存图像文件。\n\nGIMP 允许用大多数常用的图像格式保存图像。你只需要在保存时为文件名加上正确的扩展名来指定图像格式（例如 `.jpg`、`.tiff`、`.gif`\
  \ 或 `.bmp`）。点击确定 之后，GIMP 可能会弹出另一个对话框，要求你为指定的图像格式选择特定的选项。\n\n现在你已经有了一个保存好的图像文件，可以在\
  \ GIMP 中对其进行处理了。\n\n### 编辑图像文件\n\n现在打开你保存的图像文件，并尝试 GIMP 的图像编辑功能。\n\n**1. 选择`File（文件）➪`Open（打开）并选择你从截图中保存的图像文件。**\n\
  \nGIMP 会在图像编辑窗口中打开图像，如图 14-8 所示。\n\n**图 14-8：** GIMP 图像编辑窗口。\n![Image 144](img/index-292_1.jpg)\n\
  \n**2. 在 GIMP 工具箱中，选择一种选择工具（如矩形选择），并在图像上选择一个区域。**\n\n**3. 再次在 GIMP 工具箱中，选择`Rotate（旋转）`工具（带有两个框和箭头的图标），然后点击图像上的选定区域。**\n\
  \n会出现`Rotate（旋转）`对话框，允许你设置旋转细节。随着你增加或减少旋转角度，你会看到选定的图像区域在编辑器中实际旋转。当你将图像旋转到合适的角度时，点击\
  \ `Rotate` 按钮设置旋转。\n\n**4. 在 GIMP 工具箱中，选择你喜欢的绘画工具（画笔、铅笔等），并在图像上进行涂鸦。**\n\n默认情况下，绘制颜色设置为黑色。要更改颜色，你可以双击\
  \ GIMP 工具箱中的前景区域。会出现`Change Foreground Color（更改前景颜色）`对话框，如图 14-9 所示。\n\n**图 14-9：**\
  \ GIMP 更改前景颜色对话框。\n\n此工具为你提供了一种选择绘画颜色的简单方法。你可以指向并点击你寻找的任何色调。\n\n**5. 保存你的新作品，可以使用相同的文件，也可以使用另一个文件名（这将创建一个单独图像文件）。**\n\
  \n![Image 145](img/index-293_1.jpg)\n\n这些都是非常基础的操作。你可能认为你可以使用一些并不复杂的工具（如微软画图）完成同样的事情。嗯，你是对的——在某种程度上如此。GIMP\
  \ 可以进行简单的图像处理——还能做更多。这里有一个简短的演示：\n\n**1. 如果你已经关闭了图像文件，通过选择`File（文件）➪`Open（打开）`来打开它，使其处于一个新的图像编辑窗口中。**\n\
  \n图像编辑窗口也有一些你可以使用的小技巧。\n\n**2. 点击`Filters（过滤器）`菜单并选择一种特效。**\n\n`Filters（过滤器）`部分包含许多用于增强图像视觉效果的特殊特效。图\
  \ 14-10 显示了涡流和挤压效果（`Filters`➪`Distorts`➪`Whirl and Pinch`）的结果。\n\n**图 14-10：** 应用涡流和挤压效果后的图像。\n\
  \n现在你开始看到 GIMP 的强大了。\n\n### 使用 GIMP 脚本\n\n对于我们这些缺乏艺术天赋的人来说，GIMP 会尽可能提供帮助。许多富有艺术气息的人为\
  \ GIMP 贡献了脚本，提供了比你在好莱坞动作电影中看到的更多的特效。\n\n![Image 146](img/index-294_1.jpg)\n\n特效的关键在于将一系列特效组合在一起以创建一个整体效果。GIMP\
  \ 允许你通过脚本语言将特效组合在一起，这是一系列顺序执行的 GIMP 命令。Fedora 包含了 `Python-Fu` 和 `Script-Fu` 两种 GIMP\
  \ 脚本语言。\n\n`Python-Fu` 和 `Script-Fu` 脚本可以通过编辑器的`Filters（过滤器）`菜单访问。每个脚本都有自己的一参数；你可以设置这些参数来更改其效果。由于脚本会对图像应用多层特效，因此应用通常需要一些时间。\n\
  \nGIMP 自带的预制脚本可以产生非常惊叹的效果。图 14-11 展示了在保存的桌面图像上应用 Weave `Script-Fu`的效果。\n\n**图 14-11：**\
  \ 应用 Weave Script-Fu 效果后的示例图像。\n\n对于一个简单的开源程序来说，这看起来非常专业！花时间尝试 GIMP 中提供的不同脚本效果吧。你会对特效的质量感到惊讶的。\n\
  \n大多数效果可以通过选择`Edit（编辑）➪`Undo（撤销）`来恢复，所以尽管尝试。\n\n### 玩 3D 游戏\n\nWindows PC 的优势之一是支持高级视频游戏。这些游戏利用通常需要专用\
  \ 3D 显卡才能运行的高端图形。\n\n再次，这是 Linux 直到还没有跟上 Windows 的另一个领域。两个主要的 3D 显卡厂商 ATI 和 NVIDIA\
  \ 已经为它们的产品发布了 Linux 驱动程序，允许游戏开发者进入 Linux 市场。\n\n这里有一个问题：ATI 和 NVIDIA 都为它们的 3D 显卡发布了\
  \ Linux 二进制驱动程序，但没有提供源代码。真正的开源系统必须包含系统中包含的所有组件的源代码。这给 Linux 发行版造成了相当的困境。\n\nLinux\
  \ 发行版包含 ATI 或 NVIDIA 二进制驱动程序违反了开源软件的真正精神。但如果 Linux 发行版不起这些驱动程序，就会面临在 Linux 发行版大战中落后并失去市场份额的风险。\n\
  \nUbuntu 通过安装 3D 显卡驱动程序并通知你安装了专有卡的驱动程序来解决这个问题。你可以选择`System（系统）➪`Administration（管理）➪`Hardware\
  \ Drivers（硬件驱动程序）`来查看 Ubuntu 安装的驱动程序。\n\nFedora 决定通过折中方案来解决这个问题：Fedora 不包含 ATI 或\
  \ NVIDIA 3D 显卡驱动程序，使发行版完全开源。然而，如果你仍然希望支持你的 ATI 或 NVIDIA 3D 显卡，还是是有希望的。\n\n`http://rpm.livna.org`\
  \ 网站是一个由社区运营的非批准 Fedora 软件软件包库。它不仅包含了我们在本章中讨论的许多视频解码器的软件软件包，还包含了商业级 ATI 和 NVIDIA\
  \ 3D 显卡的软件软件包。\n\n为 ATI 和 NVIDIA 显卡安装商业驱动程序并不是违法的，它只是违背了开源运动的初衷。然而，正如我们之前提到的，可用的解码器确实受到许可限制，所以要小心！\n\
  \n默认情况下，Fedora Yum 软件安装程序不识别 `http://rpm.livna.org` 存储。该网站包含了如何将其添加到你的存储列表的说明。完成后，你就可以准备安装\
  \ ATI 或 NVIDIA 3D 显卡驱动程序了，但你必须使用第 17 章详细介绍的命令行界面技能：\n\n**1. 在 GNOME 桌面中选择 Applications（应用程序）➪System\
  \ Tools（系统工具）➪Terminal（终端）来启动命令行会话，或者在 KDE 桌面中启动 Konsole 应用程序。**\n\n**2. 输入 `su`\
  \ 并输入 root 密码成为 root 用户。**\n\n**3. 使用 `yum` 命令行程序在你的系统上安装相应的 3D 显卡驱动程序。**\n\n\n\n\
  \n\nATI 视频驱动被称为 `kmod-fglrx`，而 NVIDIA 视频驱动奇怪的是被称为 `kmod-nvidia`。安装驱动的命令是：\n\n```bash\n\
  yum install kmod-nvidia\n```\n\n### 4. 使用 `init` 命令关闭 X 服务器。\n对应的命令是：\n\n```bash\n\
  init 3\n```\n\n### 5. 启用 3-D 视频驱动。\n要启用 NVIDIA 驱动，输入：\n\n```bash\nnvidia-config-display\
  \ enable\n```\n\n要启用 ATI 视频驱动，输入：\n\n```bash\nati-fglrx-config-display enable\n\
  ```\n\n### 6. 使用 `init` 命令重启 X 服务器。\n执行此操作的命令是：\n\n```bash\ninit 5\n```\n\n现在你的\
  \ 3-D 显卡应该已经在 Fedora 上正常工作了！Fedora 标准软件仓库中有许多 3-D 游戏可用：\n\n- ✓ **freedom:** 热门游戏\
  \ DOOM2 的新章节\n- ✓ **bzflag:** 一款坦克对战游戏\n- ✓ **openarena:** 基于《雷神竞技 III》竞技场游戏的游戏\n\
  - ✓ **scorched3d:** 基于《焦地地球》（Scorched Earth）的游戏\n- ✓ **neverball:** 一款倾斜桌面游戏\n-\
  \ ✓ **neverputt:** 一款迷你高尔夫游戏\n- ✓ **ppracer:** 操控企鹅 Tux 在山坡上赛车\n\n如果你喜欢更多更刺激的游戏，许多流行的游戏网站（如\
  \ icculus.org）提供了许多图形化开源游戏的 Linux 版本。其中许多游戏利用了先进的 3-D 图形来提供真实的游戏环境。\n\n## 第三部分：完成任务\n\
  如果你更偏好在线 3-D 游戏（或者这叫“成瘾？”），Fedora 不会让你感到孤单。一些流行的在线 3-D 游戏网站开始接受 Linux 的流行，并提供 Linux\
  \ 客户端。\n\n遗憾的是，即使在今天，你仍然需要多花一点才能在 Fedora 计算机上安装这些客户端。本节以游戏 Second Life 为例。\n\nSecond\
  \ Life 在线游戏是一个由玩家完全构建的虚拟 3D 世界。它利用 3-D 显卡的力量带你穿一系列地点，并让你与代表其他玩家的图形化“人物”互动。进入 Second\
  \ Life 世界后，你可以与他人互动以购买或交易产品、购买土地，甚至访问娱乐场所！\n\n要进入 Second Life 世界，你需要客户端软件。该软件可以在\
  \ Second Life 网站以可安装的二进制包形式获取。你必须做一些额外工作来安装客户端，但这是值得的：\n\n1. **通过选择应用程序 ➪Internet\
  \ ➪ Firefox 浏览器来打开 Firefox。**\n你也可以通过选择顶部面板上的地球图标来启动 Firefox。\n2. **访问 `http://www.secondlife.com`\
  \ 网站。**\n3. **在首页底部，点击 Downloads（下载）链接。**\n4. **在 Downloads 网页上，选择 Download Now（立即下载）链接。**\n\
  网页会检测到你处于 Linux 平台，会自动下载 Linux 版本的安装程序。\n5. **点击使用桌面文件归档管理器自动打开 Second Life 安装包。**\n\
  你的桌面文件归档管理器将启动（GNOME 使用 `File Roller`，或 KDE 使用 `Ark`），并显示安装包的内容。\n6. **将安装文件提取到文件夹中。**\n\
  出现提取窗口。你可以选择将 Second Life 客户端文件夹提取到何处（你可能想把它放在 Home 文件夹下）。\n\n安装好软件后，就可以玩了。找到你从安装包中提取的\
  \ Second Life 文件夹。里面有一个名为 `secondlife` 的文件。双击此文件启动客户端。客户端连接到 Second Life 网站，游戏开始。享受吧！\n\
  \n# 第 15 章：玩转 Google Gadgets\n\n## 本章内容\n- ▶ 安装 Gadgets\n- ▶ 使用 Gadgets\n- ▶ 使用\
  \ Google Apps\n\n没有任何专政比琐碎专政更烦人：警察、政府办事员和机电小工具的各种。\n—— 爱德华·艾比 (1927 – 1986)\n\n\
  几乎每张桌子都需要小工具。无论这些小工具是否包括订书机、胶带切割器或便利签，你必须在桌子上放一些小工具——哪怕只是为了让你看起来很忙！你的 Linux 桌面也不例外。你可以积累许多方便的小工具来让你的\
  \ Linux 体验变得更容易。\n\nGoogle Desktop 项目将桌面搜索世界引入了 Windows 计算机——以及 Google Gadgets，这些直接在桌面上提供信息的简单图形实用程序。它们变得如此流行，以至于\
  \ Windows Vista 操作系统也吸纳了同样的理念。\n\nGoogle Desktop 组成：\n- ✓ **Google 搜索栏：** 允许你不仅搜索\
  \ Google 搜索存档，还可以从一个地方搜索工作站上的所有文件。\n- ✓ **Google Gadgets:** 一组运行在桌面上的小型实用程序，在你的指尖上提供触手可及的信息。\n\
  - ✓ **Google Apps:** 一组全功能办公应用集合，包括文字处理、电子表格和演示文稿，全部在 Google 服务器上运行并通过互联网访问。\n\n\
  ![Image 147](img/index-299_1.jpg)\n\n尽管 Google Desktop Gadgets 在 Windows 世界很流行，但它们在\
  \ Linux 世界的普及并没有那么快。随着 gOS Linux 发行版的日益流行，这种情况可能会发生变化——它不仅包含了 Google Desktop Gadgets，还包含了各种在线\
  \ Google 应用的链接。\n\n### 使用 gOS 寻找 Google Gadgets\ngOS Linux 发行版包含了安装在 GNOME 桌面上的\
  \ Linux 版 Google Gadgets，如图 15-1 所示。\n\n**图 15-1:**带有 Google Gadgets 的 gOS 桌面。\n\
  \nGadgets 直接出现在桌面上，因此你不需要在菜单中寻找来启动它们。gOS 桌面的底部是一个独立的工具栏，包含启动 gOS 中使用的各种应用程序的图标。这包括已安装的应用程序，如\
  \ OpenOffice 套件（见第 12 章），以及你可以在任何有互联网连接的地方访问的 Google 应用（我们稍后会更多地讨论这些）。\n\n### 在其他发行版中安装\
  \ Gadgets\n如果你没有 gOS Linux 发行版，你仍然可以玩玩 Google Gadgets。取决于你使用的 Linux 发行版，你可能可能无法方便地访问\
  \ Google Gadgets。本节将引导你如何在 Fedora 和 Ubuntu 发行版上安装 Google Gadgets。\n\n#### 在 Fedora\
  \ 中安装 Gadget 包\nFedora Linux 发行版在主仓库中包含了 Google Gadgets（见第 16 章），因此安装它轻而易举！\n\n\
  打开 `PackageKit` 包管理器程序，寻找 Linux 版 Google Gadgets，如图 15-2 所示。\n\n**图 15-2:** 在 Fedora\
  \ 中安装 Google Gadgets。\n\n勾选 Google Gadgets for Linux 包的框框，然后点击 Apply（应用）按钮。`PackageKit`\
  \ 会检索该包并为你安装。\n\n你现在应该能看到工作站 Internet 菜单中增加了 Google Gadgets 条目。\n\n#### 大家的 Gadgets\n\
  如果你的 Linux 发行版没有包含 Google Gadgets 软件包（如 Ubuntu 的情况），你不需要切换到 gOS Linux 发行版就可以在 Linux\
  \ 桌面上享受 Google Gadgets。有一个 Google Gadgets 安装文件，适用于几乎所有的 Linux 发行版。\n\nGoogle Gadgets\
  \ 项目主页 (`http://code.google.com/p/google-Gadgets-for-linux/`) 包含了 Gadget 源代码，你可以在几乎任何\
  \ Linux 系统上编译它，并包含了其他人已经编译该源代码并提供运行所需的二进制可执行包的链接。\n\n![Image 149](img/index-301_1.jpg)\n\
  \n对于 Ubuntu 的情况，你可以按照以下步骤获取 Gadgets：**1. 访问**\n\n\n\n\n\nhttp://www.getdeb.net/app/Google+Gadgets\n\
  \n### 2. 选择适用于您的 Ubuntu 版本的链接。\n你可以通过从顶部边缘面板选择“系统(System)➪ 关于 Ubuntu”来确定你使用的是哪个版本的\
  \ Ubuntu。\n\n### 3. 下载 `.deb` 包。\n如果你不确定如何下载 `.deb` 包，请参阅第 16 章。\n\n### 4. 双击 `.deb`\
  \ 包以启动软件包安装程序。\n软件包安装程序（如图 15-3 所示）会自动提取软件包中的文件并将它们安装到正确的位置。\n\n**图 15-3：** 使用 Ubuntu\
  \ 软件包安装程序安装 Google Gadgets。\n\n### 5. 点击“安装软件包”按钮开始安装。\n软件包安装程序会判断安装是否需要任何额外的软件包。如果你的\
  \ Ubuntu 工作站已连接到互联网，它将自动从软件存储库检索并安装这些包。\n\n### 6. 安装完成后，关闭软件包安装程序。\n\n### 7. 按下\
  \ `Alt+F2`。\n打开“运行应用程序”对话框，如图 15-4 所示。\n\n![Image 150](img/index-302_1.jpg)\n![Image\
  \ 151](img/index-302_2.jpg)\n\n**第 15 章：玩转 Google Gadgets**\n289\n**图 15-4：** 运行应用程序对话框。\n\
  \n### 8. 在“运行应用程序”对话框中输入 `ggl-gtk`，然后点击“运行”。\n`ggl-gtk` 命令启动 Google Gadgets 应用程序。你也可以选择“应用程序(Applications)➪\
  \ 互联网➪ Google Gadgets”来启动 Gadgets。\n\nGoogle Gadget 图标出现在顶部面板（那个带有四种色的正方形），Gadget\
  \ 侧边栏出现在桌面侧边，如图 15-5 所示。\n\n**图 15-5：** 在 Ubuntu 中运行的 Google Gadget 侧边栏。\n\n###\
  \ 使用 Gadgets\n如果你不知道如何使用，手头 Gadgets 也毫无乐趣。本节将介绍如何使用 gOS 桌面默认安装的 Google Gadgets，如何针对自己的环境对其进行自定义，以及如何轻松添加新的\
  \ Gadgets。如果你在其他 Linux 发行版中安装了 Google Gadgets，这些指令同样适用，尽管默认的 Gadgets 可能有所不同。\n\n\
  290 **第三部分：完成任务** 默认的 gOS Gadgets\n默认的 gOS 桌面包含几个出现在桌面上的 Gadgets（参考图 15-1）：\n\n\
  *   **电池计 (Battery meter)：** 显示笔记本电脑电池的电量状态。\n*   **无线信号计 (Wireless signal meter)：**\
  \ 显示你连接的无线访问点的信号强度。\n*   **小花盆 (Flower pot)：** 美化你的桌面；点击花朵可以浇水！\n*   **Google 新闻\
  \ (Google News)：** 为需要关注资讯的人提供当日新闻简要摘要。\n*   **Google 日历 (Google Calendar)：** 快速查看每月日历，包括假期和特殊活动。\n\
  *   **天气地球仪 (Weather Globe)：** 帮助你关注所在地室外天气。\n*   **计算器 (Calculator)：** 快速进行数字计算。\n\
  \n默认的 Gadgets 提供了可用功能的一个小样本。其中某些可能并不适用于你的特定情况。电池计和无线信号计可能不适用于你的工作站。同样，除非你恰好住在德克萨斯州的哈皮市（Happy），否则你可能想更改天气地球仪设置的默认位置。下一节将介绍如何自定义你的\
  \ Gadgets。\n\n如果你不喜欢桌面杂乱，可以将 Gadgets 移动到侧边栏区域。然后你可以隐藏侧边栏，仅在需要使用 Gadget 时才显示它。只需点击顶部边缘面板中的\
  \ Google Gadget 图标即可。\n\n### 自定义 Gadgets\n桌面上的每个 Gadget 都包含一个自己的控制图标，你可以用它来管理 get。当你将鼠标指针悬停在\
  \ Gadget 上时，它的顶部会出现一个小工具栏，如图 15-6 中的天气地球仪 Gadget 所示。\n\n该工具栏使用三个符号：\n\n*   **双小于号\
  \ (<<)：** 展开或折叠 Gadget 窗口。\n*   **向下箭头：** 显示 Gadget 菜单。\n*   **X：** 关闭 Gadget 窗口。\n\
  \n要从桌面上永久删除一个 Gadget，只需点击 `X` 关闭 Gadget 窗口。该 Gadget 不仅会从你的桌面上消失，而且当你下次启动桌面时，它不会再次启动。如果你想让那个\
  \ Gadget 回到桌面，不用担心；你可以按照“添加更多 Gadgets”部分中的步骤将其加回来。\n\n![Image 152](img/index-304_1.jpg)\n\
  ![Image 153](img/index-304_2.jpg)\n\n**第 15 章：玩转 Google Gadgets**\n291\n**图 15-6：**\
  \ 天气地球仪的 Gadget 控制图标。\n\n每个 Gadget 的菜单都不同，但基本上允许你控制 Gadget 的位置、显示有关它的信息，并生成一个“选项(Options)”对话框来设置\
  \ Gadget 可能具有任何额外功能。例如，点击天气地球仪 Gadget 的“选项”菜单将打开图 15-7 所示的选项对话框。\n\n**图 15-7：**\
  \ 天气地球仪选项对话框。\n![Image 154](img/index-305_1.jpg)\n292 **第三部分：完成任务**\n输入你的国家、邮政编码（如果你在美国）或城市名称，以及你想要显示摄氏度还是华氏度。天气地球仪\
  \ Gadget 会保存这些信息；现在你就能看到你所在地的天气了。\n\n### 添加更多 Gadgets\n要添加更多 Gadgets，请遵循以下步骤：\n\n\
  1. 右键点击顶部边缘面板中的 Gadgets 插件图标。如果你左键点击 Gadget 插件图标，所有的 Gadgets 都会从桌面消失。这是一个清理内容的快捷方法！只需左键点击\
  \ Gadget 插件图标即可让它们回来！\n2. 从菜单中选择“添加 Gadget (Add Gadget)”。如图 15-8 所示，Gadget 浏览器出现在桌面上。\n\
  3. 在 Gadget 浏览器中搜索新的 Gadgets。Gadgets 按类别分组，浏览器顶部有一个搜索工具，可搜索特定的 Gadget 或与特定主题相关的\
  \ Gadgets。\n4. 将鼠标指针悬停在你想添加到桌面的 Gadget 图标上。在它下方会出现一个“添加(Add)”按钮。\n\n**图 15-8：**\
  \ Gadget 浏览器对话框。\n**第 15 章：玩转 Google Gadgets** 293\n5. 点击 Gadget 对应的“添加”按钮。新的 Gadget\
  \ 将出现在你的桌面上，准备好可以使用！\n\n## 使用 Google 应用\n除了你在桌面上看到的 Gadgets 外，你可能还注意到 gOS 底部出现了一系列图标。这些图标提供了对多个\
  \ Google 应用的快速访问，详细见表 15-1。\n\n**表 15-1：Google 应用**\n\n| 应用程序 | 用途 |\n| :--- | :---\
  \ |\n| Firefox | 流行的 Web 浏览器程序。 |\n| Google Mail | 功能全的电子邮件客户端。 |\n| Google Calendar\
  \ | 功能全个人日历，你也可以与他人共享。 |\n| Google Documents | 一套全功能办公软件，包括文字处理、电子表格和演示文稿。 |\n|\
  \ Google Maps | 流行的全球街道地图，提供街道的地图和卫星视图。 |\n| Google Reader | 从所选的 Web 新闻源收集新闻，并允许订阅你选择的新闻源。\
  \ |\n| Google News | 连接到 Google 新闻网页，提供最新的新闻。 |\n| Google Product Search | 允许你对产品进行比较购物。\
  \ |\n| Google Finance | 连接到 Google 财经新闻页面，提供股市新闻和信息。 |\n| Blogger | 连接到流行的 Google\
  \ 博客网站，你可以在那里创建和维护自己的博客。 |\n| YouTube | 直接访问流行的视频分享网站。 |\n| Pidgin | 连接到流行的即时消息网站（见第\
  \ 9 章）。 |\n| Skype | |\n\n\n\n\n连接网络电话服务（参见第 9 章）。\n\n### OpenOffice Writer\n一款流行的文字处理程序（参见第\
  \ 12 章）。\n\n### OpenOffice Calc\n一款流行的电子表格程序（参见第 12 章）。\n\n### OpenOffice Impress\n\
  一款流行的演示文稿程序（参见第 12 章）。\n\n## 第三部分：完成工作\nGoogle 应用程序有一个独特之处，即它们都运行在互联网上的 Google 服务器上。你必须连接互联网才能使用\
  \ Google 应用程序。\n\n你在 Google 服务器上创建的文档存储在 Google 网络中你的私有区域。你可以选择将其保持私密，或与他人共享——无论是与全世界共享，还是仅与少数几个亲密的朋友共享！\n\
  \n要使用 Google 应用程序，你需要在 `google.com` 上创建一个免费账号。你可以注册一个适用于所有应用的免费 Google Mail 账号，也可以使用你现有的电子邮件地址单独注册某个\
  \ Google 应用。\n\n![Image 155](img/index-308_1.png)\n\n## 第四部分：初级管理员训练营\n\n## 在这一部分……\n\
  在这一部分，你将接管你的 Linux 电脑控制权。你将发现所有那些奇怪的文件扩展名是什么（`.gz`? `.tgz`? `.rpm`? 哈？）。你将学会如何安装新软件、更新系统以及追踪更多新软件。然后，你将发现管理\
  \ Linux 系统时涉及的一些奥秘的“手势操作”。例如，你可能想为你的妹妹创建一个账号，这样她就不会通过你的账号访问男团论坛了。你将进入 Linux 安全的世界。（仅仅因为你正在使用\
  \ Linux，并不意味着你可以忽视安全问题。）最后，你将看到如何从 Linux 工作站内部运行其他操作系统（甚至是其他 Linux 系统）。\n\n# 第 16\
  \ 章：向 Linux 中添加软件\n\n### 本章内容\n* 识别下载的软件文件格式\n* 创建 tar 包和归档\n* 压缩文件\n* 打开 tar 包、归档和压缩文件\n\
  * 安装和卸载软件包\n\n*“我会砍掉你的脑袋。”* ——  {丽莎白一世\n\n当你开始使用一个新的操作系统时，最令人沮丧的事情之一就是试图弄清楚所有搞怪的文件扩展名。Windows\
  \ 世界有 `.exe` 和 `.zip`。Macintosh 世界有 `.bin` 和 `.hqx`。Linux 世界呢？它确实有许多奇特的扩展名，但实际上，在你了解了生成它们的程序后，它们就非常有意义。在本章中，你将了解到关于\
  \ `.tar`、`.gz``.tar.gz``.tgz``.bz2``.deb` 和 `.rpm` 文件的所有信息。（有人想玩一场字母汤拼字游戏吗？）\n\n\
  当你搞定了这些看似杂乱的字母后，你会惊喜地发现 Linux 提供了许多酷炫的工具来处理这些疯狂的文件、更新系统、添加新软件等。\n\n### 打开下载的文件\n\
  Linux 世界充满了奇怪的术语和缩写。例如，如果有人突然找你并开始谈论 tarballs（tar 包），你脑海中可能会浮出一个粘糊糊、臭臭的焦油球，可能还裹着羽毛。然而，tar\
  \ 包是你在 Linux 世界中经常遇到的东西，尤其是当你寻找软件或需要节省空间时。一个 `tarball` 是一组打包在 `.tar` 文件中的文件（以及可能包括目录），并使用\
  \ `gzip` 实用进行压缩；随后该 tar 包就会包含 `.tar.gz` 扩展名。\n\n幸运的是，你只需要知道如何双击 `.tar.gz` 文件（它由一个\
  \ tar 包组成），即可访问表 16-1 中列出的任何格式的许多文件。当你双击 `.tar.gz` 文件时，你的桌面文件管理器会显示其内容。\n\n虽然表 16-1\
  \ 提到了用于处理这些文件类型的特定程序，但像 Linux 中的其他一切一样，通常有多种方法来处理这些文件。人们倾向于使用他们熟悉的程序，无论他们运行在什么种操作系统上。\n\
  \n### 表 16-1：下载文件的潜在格式\n\n| 扩展名 | 含义 | 涉及的程序 |\n| :--- | :--- | :--- |\n| `.bz`\
  \ | `.bz2` 的旧形式。 | `bzip`, `bunzip` |\n| `.bz2` | 针对某些类型文件（如文本文件）较慢但更高效的压缩。 | `bzip2`,\
  \ `bunzip2` |\n| `.deb` | 使用 Debian 特有格式封装在一起的所有应用程序相关文件，用于 Ubuntu 和 gOS。 | `dpkg`,\
  \ `apt-get` |\n| `.gz` | Linux 和 UNIX 典型的压缩文件。 | `gzip`, `gunzip` |\n| `.iso` |\
  \ CD-ROM 或 DVD-ROM “镜像”，是一个包含整个 CD 或 DVD 内容的单个文件。你必须告诉你的 CD 或 DVD 刻录软件该文件是一个镜像，这样它知道是从该文件创建光盘，而不是仅仅将文件的副本放在存储介质上。\
  \ | 参见第 3 章 |\n| `.rpm` | 使用 Red Hat 设计并用于 Fedora 的格式封装的所有单个应用程序相关文件。 | `rpm`, `yum`\
  \ |\n| `.tar` | 一组打包在一起的文件。 | `tar` |\n| `.tar.bz2` | 一个 tar 包，在这种情况下是 `.bz2` 文件内部的\
  \ `.tar` 文件。 | `tar`, `bzip2`, `bz2` |\n| `.tar.gz` | 一个 tar 包，在这种情况下是 `.gz` 文件内部的\
  \ `.tar` 文件。 | `tar`, `gunzip`, `gzip` |\n| `.tgz` | 一个 tar 包，在这种情况下是 `.gz` 文件内部的\
  \ `.tar` 文件。 | `tar`, `gunzip`, `gzip` |\n| `.Z` | 一种旧式的压缩文件。 | `compress` |\n|\
  \ `.zip` | Windows .zip 文件。 | `zip`, `unzip`, `WinZip` |\n\n### 压缩并打包文件以共享\n为了打包并压缩文件发送给他人，请导航到它们存储的位置：\n\
  \n1. 确定你想压缩或打包单个文件、一组文件还是整个文件夹。\n2. 选择项目。\n3. 右键点击项目（或选择“编辑”菜单）。\n4. 在右键菜单或“编辑”菜单中，选择“压缩”（在\
  \ Dolphin 中）或“创建归档”（在 Nautilus 中）。\n5. 如果你需要一个 tar 包，请保持不变，或更改文件扩展名（如表 16-1 所示）以匹配你的需求。\n\
  6. 点击“创建”。\n7. 如果你想重命名文件或更改它在文件系统中的位置，请现在进行。\n8. 点击“确定”。\n\n\n\n\n任何操作系统的一个重要特性都是能够以最少麻烦的方式进行快速更新。系统中总会有新功能、安全修复和软件漏洞修复需要安装，以保持运行顺畅。\n\
  \n大多数 Linux 发行版都包含一个程序，可以通过 Internet 连接自动更新系统中已安装的软件。如果你的计算机连接了互联网，你就可以接收每日更新和实时的补丁。\n\
  \nUbuntu 及其所有衍生版本（包括 gOS）以及 Fedora 都包含了更新程序，让保持系统更新变得轻而易。Fedora 使用 `yum` 程序来管理基于\
  \ Red Hat 的 `.rpm` 包，用于安装软件和更新。Ubuntu 则使用 `rpm` 和 `apt-get` 程序来管理基于 Debian 的 `.deb`\
  \ 包，用于其软件和更新安装。\n\n# 第 16 章：为 Linux 添加软件\n\n如果你习惯在命令行环境中工作，那么这些命令行程序（参见第 17 章）是非常极棒的实用工具。如果你不习惯，Fedora\
  \ 和 Ubuntu 也包含了图形化程序：\n\n- 对于 Fedora，是 `PackageKit` 程序。`PackageKit` 与 `yum` 程序接口以管理软件包数据库，以便你可以轻松地安装或删除软件包。\n\
  - Ubuntu 使用 `Synaptic` 程序，它与 `apt-get` 程序接口以管理软件包数据库并使软件包易于安装或删除。\n\n接下来的章节将带你了解这些程序在你的桌面系统上是如何工作的。\n\
  \n保持 Linux 系统更新是保护其免受病毒和攻击的第一步。有关保持你的 Linux 系统安全的更多信息，请参阅第 19 章。\n\n### 使用 PackageKit\
  \ 更新 Fedora\n\nFedora 默认运行 `PackageKit` 程序，自动连接互联网并检查可用的操作系统和软件更新。`PackageKit` 程序在\
  \ Fedora 的 KDE 和 GNOME 桌面环境中均有使用（尽管 KDE 桌面版本被称为 `KPackageKit`）。\n\n你可以等待此工具通知你何时有新内容可用，也可以手动更新系统。大多数人结合两者使用：在方便时接受自动更新，如果稍后再回来手动获取更方便，则拒绝自动更新。\n\
  \n### 自动更新\n\n如果你连接了互联网并且出现了可用更新，你的桌面上会出现一个通知框，自豪地宣告“有可用更新（Updates Available）”并告诉你有多少个，如图\
  \ 16-1 所示。\n\n如果有可用的安全更新，通知窗口会有某种警告的感觉（从黑白的图 16-1 中看不出来，但窗口框是亮红色的）。\n\n你可以选择只安装安全相关的更新并在稍后回来安装其他更新，或者你可以选择在此时安装所有可用的更新。\n\
  \n![Image 156](img/index-315_1.jpg)\n\n**图 16-1:** Fedora 中的 `KPackageKit` 通知窗口。\n\
  \n你可能还会注意到，当通知窗口打开时，桌面的面板上会出现一个图标。`KPackageKit` 使用面板应用 get（applet）来显示更新过程的状态。不同的图标告诉你\
  \ `PackageKit` 正在做什么：\n\n- **红色星芒形：** 有一个或多个安全更新可用。\n- **橙色星芒：** 有一个或多个非安全软件包更新可用。\n\
  - **带列表的框：** 正在检索更新文件列表。\n- **带绿色箭头的框：** 正在下载新更新。\n- **带齿轮的框：** 正在安装更新。\n\n如果你点击面板图标，会弹出一个对话框，显示进程的状态。当所有更新完成后，面板图标就会消失。\n\
  \n### 手动更新\n\n如果你关闭了“有可用更新”框，或者只是很久没有尝试更新你的机器了，你可以手动启动更新器。请按照以下步骤操作：\n\n1. **选择应用程序（Applications）**\
  \ ➔ **系统（System）** ➔ **在 GNOME 桌面更新系统，或选择 KDE（Update System in the GNOME desktop,\
  \ or choose KDE）** ➔ **应用程序（Applications）** ➔ **系统（System）** ➔ **KDE 桌面软件管理（Software\
  \ Management in the KDE desktop）。**\n\n`PackageKit`（在 GNOME 中）或 `KPackageKit`（在\
  \ KDE 中）对话框打开，如图 16-2 所示。\n\n2. **点击左侧的软件更新（Software Updates）图标。**\n\n你可能需要等待该工具连接互联网并加载更新信息。当此过程完成后，进度对话框会关闭，你可以看到所有可用的更新。\n\
  \n![Image 157](img/index-316_1.jpg)\n![Image 158](img/index-316_2.jpg)\n\n**图 16-2:**\
  \ KDE 桌面上的 Fedora `KPackageKit` 对话框。\n\n如果此时你被告知“另一个应用程序正在运行并访问软件信息”，请等几分钟。告知你何时有更新的工具可能正在扫描中间。\n\
  \n3. **如果你想获取任何某个单独更新的信息，点击审查（Review）按钮，然后在列表中选择所需项目。**\n\n关于更新的信息将出现在可用更新列表的下方，如图\
  \ 16-3 所示。\n\n**图 16-3:** 在 Fedora GNOME 桌面中使用 `PackageKit` 审查更新。\n\n4. **点击应用更新（Apply\
  \ Updates）继续。**\n\n会出现“正在处理的任务（Processing Tasks）”对话框，并带有进度条；当你第一次更新机器时，这个过程可能需要一段时间——可能有一百个或更多更新。\n\
  \n当工具确定每个程序需要的所有内容都已处理后，此对话框将关闭。可能会出现另一个对话框，告诉你添加了依赖项（*Dependencies*，依赖是指另一个软件包为了正确安装和运行而必须具备的软件包）。从这里，你会看到一个下载（Downloading）对话框。进度条显示了所有更新下载到你的计算机还需要多长时间。下载完成后，会出现一个正在安装（Installing）进度条。当更新器完成软件包的安装后，会出现一个信息（Information）对话框，说明更新已完成。\n\
  \n5. **如有，点击确定（OK）关闭更新器。**\n\n### 使用 Synaptic 更新 Ubuntu\n\nUbuntu 发行版始终在后台运行 `Synaptic`\
  \ 程序以检查更新。它使用类似于 Fedora `PackageKit` 程序的技术——它会显示一个对话框告诉你你有可用更新。\n\n当你看到 `Synaptic`\
  \ 对话框出现时，你就知道该开始下载更新或补丁了。如果你正在忙重要的事情，可以选择关闭 `Synaptic` 对话框并稍后回来。当你准备好检查更新时，按照以下步骤操作：\n\
  \n1. **选择系统（System）** ➔ **管理（Administration）** ➔ **从顶部边缘面板菜单打开更新管理器（Update Manager\
  \ from the top edge panel menu）。**\n\n主更新管理器窗口出现，如图 16-4 所示。\n\n2. **点击检查（Check）按钮检查新更新。**\n\
  \n更新管理器检查互联网是否有系统中已安装软件包的任何更新。如果面板应用 get 通知你已经可用更新，你可以跳过此步骤。\n\n3. **如果你想获取单个更新的信息，选择列表中的更新，并点击列表下的更新描述（Description\
  \ of Update）链接。**\n\n关于更新的信息出现在更新列表下方。\n\n4. **点击安装更新（Install Updates）按钮开始安装更新。**\n\
  \n系统要求你输入密码以确保你拥有添加更新所需的相应权限。\n\n![Image 159](img/index-318_1.jpg)\n\n**图 16-4:**\
  \ Ubuntu 更新管理器窗口。\n\n5. **点击关闭（Close）按钮退出更新管理器对话框。**\n\n现在你的 Ubuntu 系统应该已经是所有可用补丁最新的。\n\
  \n### 安装新软件\n\nFedora 和 Ubuntu 都包含了允许你向 Linux 系统添加新软件的程序。软件在 Linux 发行版中以两种格式封装：\n\
  \n✓\n\n\n\n\n\n# 第 16 章：为 Linux 添加软件\n\n**应用程序（Applications）：** 包含多个组件的软件，例如 OpenOffice.org\
  \ 包或软件开发平台，可以作为完整的应用程序安装。\n\n**包（Packages）：** 不属于大型应用程序的单个软件程序，例如 GIMP（参见第 14 章），可以封装在一个包中，该包仅安装该程序本身。\n\
  \n由于 Linux 提供了两种安装软件的方法，大多数 Linux 发行版都提供了两种独立的软件安装方式：\n\n- **添加/删除程序（Add/remove\
  \ programs）：** 用于添加或删除应用程序的程序允许你将新软件作为完整应用程序添加，顺序由每个完整应用程序的名称决定。你不需要一个一个安装单个包，而是可以选择安装整个应用程序。\n\
  - **包管理器程序（Package-manager programs）：** 这些程序安装应用程序的选定单个组件（`packages`）。如果你只想安装单个包（因为你只需要完整应用程序的一部分，或者因为某个程序不够大，无法在添加/删除程序中拥有独立条目），那么这就是你的选择。这种方法通常用于安装大型应用程序的单个组件，例如你想从\
  \ OpenOffice.org 应用程序中安装 `Writer`。\n\n本节将介绍你如何在 Fedora 和 Ubuntu 中使用这些工具来在你的系统上获取新软件。\n\
  \n## 添加完整应用程序\n\n“添加/删除程序”添加完整应用程序并不比更新现有软件更困难：如果你的工作站连接到互联网，你只需浏览到想要安装的应用程序，然后选择它。添加/删除程序会自动从网络存储库下载并安装必要的组件。\n\
  \n### 在 Fedora 中添加应用程序\n\n按照以下步骤在 Fedora 中安装新应用程序：\n\n1. **对于 KDE 桌面，选择** `KDE`\
  \ ➪`Applications` ➪`Administration` ➪`Add/Remove Software`；或者对于 GNOME 桌面，选择 `System`\
  \ ➪`Administration` ➪`Add/Remove Software`。\n   出现图 16-5 所示的添加/删除软件窗口。\n2. **从左侧列表选择应用程序类别。**\n\
  \   你也可以使用列表上方的搜索文本框搜索特定的应用程序，或搜索应用程序内的关键词。\n3. **从右上侧窗格的列表中选择要安装的应用程序。**\n   下方窗格将显示该应用程序的描述。\n\
  ![Image 160](img/index-320_1.jpg)\n![Image 161](img/index-320_2.jpg)\n**图 16-5：**\
  \ KDE 桌面上的 Fedora 添加/删除软件窗口。\n4. **对任何想要安装的其他应用程序重复此过程。**\n5. **点击 Apply（应用）按钮。**\n\
  \n### 在 Ubuntu 中添加应用程序\n\n按照以下步骤在 Ubuntu 中安装新应用程序：\n\n1. **从顶部面板菜单选择** `Applications`\
  \ ➪`Add/Remove Applications`。\n   打开添加/删除应用程序程序，如图 16-6 所示。\n   **图 16-6：** Ubuntu\
  \ 中的添加/删除应用程序程序。\n2. **从左侧列表选择应用程序类别。**\n   你也可以使用窗口右上角的搜索文本框搜索特定的应用程序，或搜索应用程序内的关键词。\n\
  3. **从右上侧窗格的列表中选择要安装的应用程序。**\n   下方窗格将显示该应用程序的描述。\n4. **对任何想要安装的其他应用程序重复此过程。**\n\
  5. **点击 Apply Changes（应用更改）按钮。**\n\n很快，新应用程序就会出现在你的系统上。通常，应用程序会自动添加到“应用程序”菜单中。\n\
  \n### 添加单个包\n\nUbuntu 和 Fedora 都使用独立的包管理程序在你的系统上安装单个包。本节将介绍如何在 Ubuntu 和 Fedora 上安装包。\n\
  \n### 使用 PackageKit 安装\n\n用于安装应用程序的的相同 PackageKit 程序也用于在 Fedora 中安装单个包。本节将介绍 Fedora\
  \ KDE 桌面中 `KPackageKit` 应用程序的用法：\n\n1. **在 KDE 桌面中选择 KDE Menu** ➪`Applications`\
  \ ➪`System` ➪`Software Management`。\n   Fedora 使用相同的 PackageKit 程序安装应用程序和包。KDE 桌面的\
  \ `KPackageKit` 程序为不同功能提供了图标。GNOME 桌面的 PackageKit 程序共同处理应用程序和包。\n2. **在左侧选择 Software\
  \ Management（软件管理）图标。**\n   打开 `KPackageKit` 包处理器，显示添加和删除软件的对话框（如图 16-7 所示）。\n3.\
  \ **从右上侧的下拉列表中选择包类别，从 Filters（过滤器）下拉列表中选择过滤器，或在 Search（搜索）文本框中输入包名称。**\n   选择筛选标准后，所有匹配过滤器的包将出现在右侧窗格中。PackageKit\
  \ 从互联网检索包可能需要一些时间。\n![Image 162](img/index-322_1.jpg)\n**图 16-7：** Fedora 中的 KPackageKit\
  \ 添加和删除软件对话框。\n4. **点击包以显示有关该包的信息。**\n5. **点击你想安装的包上的加号。**\n   当你点击包行末尾的绿色加号时，它会变成减号。如果你改变主意不再安装该包，点击减号将包从安装列表中移除。\n\
  6. **点击 Apply（应用）按钮开始安装。**\n   PackageKit 会下载并安装你选择的所有包。\n\n### 使用 Synaptic 包管理器安装\n\
  \nUbuntu 使用 Synaptic 包管理器来管理包。该工具允许你从同一个界面手动添加、删除和更新包。\n\n要在 Ubuntu 中添加新包，请按照以下步骤操作：\n\
  \n1. **从顶部面板菜单选择** `System` ➪`Administration` ➪`Synaptic Package Manager`。\n   包管理器显示主窗口，如图\
  \ 16-8 所示。\n2. **在左侧过滤器列表中选择包类别，或在顶部的搜索文本框中输入包名称。**\n   匹配过滤器类别或搜索关键词的包将出现在右侧列表中。\n\
  ![Image 163](img/index-323_1.jpg)\n**图 16-8：** Ubuntu 中的 Synaptic 包管理器。\n3. **从列表中选择一个包以查看详情。**\n\
  \   包的详情将出现在下方窗格中。\n4. **勾选框并在弹出菜单中选择 Mark for Installation（标记为安装）。**\n5. **点击 Apply（应用）按钮安装所选包。**\n\
  \n### 寻找更多软件\n\n如果你在上一节讨论的官方（以及非官方的）来源中找不到你想要的内容怎么办？那些并不是唯一的选择。虽然我们无法预见你可能会遇到的每种情况，但至少可以提供一些关于寻找额外软件的提示——以及如何安装大部分软件。\n\
  \n以下是寻找新软件的通用步骤：\n\n1. **检查 Fedora FAQ** (`www.fedorafaq.org`)、Fedora News (`www.fedoranews.org`)、Fedora\
  \ Forum (`www.fedoraforum.org`) 以及人们可能推荐的其他在线网站。\n2. **如果你不知道自己想要什么，可以通过打开你喜欢的 Web\
  \ 搜索引擎并搜索所需的功能（包括单词 `linux`）来。**\n   例如，如果你想要一个与 Windows 世界中的 `irfan view` 程序相当的程序，你可以搜索“irfanview\
  \ linux”。\n\n\n\n\n\n### 3. 筛选搜索结果并查看是否推荐了特定的程序。如果没有，在你的搜索词中添加“equivalent”（等效）一词，然后再次搜索。\n\
  \n所以（继续上例）你将再次使用“irfanview linux equivalent”进行搜索。现在你开始看到提到一个名为 `xnview` 的程序。\n\n\
  在费力自己安装之前，先去查看 Fedora 的包管理器 `PackageKit` 是否提供了你正在考虑的程序，这也没有坏。\n\n### 4. 当你找到一个符合你要求的程序后，对其进行网络搜索。\n\
  \n通常情况下，你会找到该程序的主页。\n\n### 5. 点击进入该程序的主页。\n\n### 6. 点击页面上的下载链接。\n\n### 7. 定位并下载与你的发行版匹配的最特定版本。\n\
  \n系统可能会提供 Windows、UNIX 和 Linux 选项；在这种情况下，你会选择 Linux。如果提供了 Linux `x86` 与 Linux `ppc`，除非你在\
  \ Apple Macintosh 电脑上运行 Linux（本书未涵盖此内容），否则请选择 `x86`。如果提供了特定的发行版包或 tarball（有关这些的更多信息请参阅本章开头），选择特定的发行版包（例如\
  \ Fedora 的 `.rpm` 或 Ubuntu 的 `.deb`）。\n\n### 8. 下载程序后，按照以下步骤进行安装：\n\n* 如果包的文件名扩展名为\
  \ `.rpm` 或 `.deb`，打开你的文件管理器并双击下载的文件进行安装。你也可以从命令行安装（请参阅第 17 章了解如何打开命令行终端）。当终端窗口打开时，输入\
  \ `su` 并按回车。系统会提示你输入 root 密码。输入密码并按回车，使用文件系统导航命令（参阅第 7 章）进入你保存文件的位置，然后输入以下命令来根据需要安装或更新程序：\n\
  \n```\nrpm -Uvh *filename\n\n```\n\n* 如果是 tarball，打开你的文件管理器。双击文件打开它并查看其内容。应该有一个命名为\
  \ `README` 或 `INSTALL` 的文件。该文件包含了你需要做的操作说明，网站本身可能还会提供更多说明。（处理 tarball 只需要练习；随着时间的推移会变得越来越容易，所以提取文件并开始操作吧！）\n\
  \n### 升级你的操作系统\n\n通常，Fedora 用户通过下载发行版的新版本、启动安装，然后在安装菜单中选择“升级”（Upgrade）而非全新安装来升级。Ubuntu\
  \ 用户有一种很方便升级现有系统的方法：当新版本可用时，`Synaptic Update System` 窗口会显示一个待选的新按钮。如果你点击该按钮，`Synaptic`\
  \ 将下载完全升级到新版本所需的所有升级文件（尽管在高速互联网连接下，这可能需要很长时间）。\n\n通常，升级现有系统会保留存储在你主文件夹中的所有数据（参阅第\
  \ 6 章）。然而，没有什么是是完美的。在尝试升级系统之前，将重要数据备份到移动式存储设备（如 USB 闪盘或可写 CD）始终是一个好主意。\n\n# 第 17\
  \ 章：在没有 GUI 的情况下工作\n\n#### 本章内容\n* 理解用户 shell 环境\n* 自定义 `bash` 环境\n* 使用命令工作\n* 利用通配符扩展\n\
  * 使用长命令\n* 摆弄变量\n* 使用重定向和管道\n\n*电脑在摧毁他们之前，必须先让他们疯掉。*\n—— 匿名\n\n许多计算机资深老兵会怀念地提到命令行。其他通过点击鼠标来提高技能的人则将命令行视为老古董使用的过时工具。事实是，大多数熟练的计算专业人员都认可点击式图形用户界面（GUI）和“大量输入型”命令行界面（CLI）的优点。你必须理解，命令行为你操作计算机提供了强大的力量。如果你观察过精练的\
  \ Linux 极客的肩膀，你会发现，登录后，这位极客并没有耗费长时间就开始手动敲击看似晦涩的指令。\n\n在本章中，我们将探索提供 CLI 的 Linux 程序，它被称为\
  \ `bash` shell。虽然 Linux 有许多 shell 可用，但 `bash` 是最常用的，这非常有道理的。基本上，`bash` 的创建者将其他 shell\
  \ 的许多优秀功能整合到了一个出色的包中。\n\n每个 shell 都有其处理命令的方法和自己的一套额外工具。我们首先开始解释 shell 到底是什么，当你理解了这一点，就准备好深入学习\
  \ `bash` 了。我们将专门介绍可以使用 `bash` shell 的一些最佳特性来做些什么。然后，我们继续学习在命令提示符中工作，并进入 `bash` shell\
  \ 的内部装饰。\n\nShell 配备了执行某些功能的能力。这些功能中的大部分都随着时间的推移而演变，以协助命令行操作手处理无数任务。\n\n尽管我们在这里只是浅了皮毛，但我们鼓励你阅读\
  \ `bash` shell 的 man page（帮助手册），因为它可能是现存最完整、最易读的 man page 之一。你可以在本章稍后的“使用帮助”部分详细阅读如何使用\
  \ `man` 页（Linux 中的在线帮助系统）。\n\n### 玩 shell 游戏（The Shell Game）\n\n你需要一种方法告诉计算机你想让它做什么。在\
  \ Linux 中，与计算机通信的方法之一是通过所谓的 shell 的。`shell` 不是图形化的东西；它是你可以使用的所有命令和语法的总和，用于告诉操作系统要做什么。按图形标准来看，shell\
  \ 环境相当单调乏味。当你启动 shell 时，你看到的只有一个带有简短提示符（例如 `$`）的空白窗口，后面跟着闪烁的光标等待你的键盘输入。\n\nLinux\
  \ 使用的默认 shell 是 `bash` shell。这个工作环境基于原始的 UNIX shell，它被称为 Bourne shell，也称为 `sh`。`bash`\
  \ 一词代表 Bourne Again shell。`bash` shell 随大多数 Linux 发行版一起提供。\n\n#### 获取 shell\n\n\
  你可以通过 GUI 中的终端应用程序启动 bash 会话。你使用的终端应用程序（当然）取决于你的桌面：\n\n* **Terminal**: 这是 GNOME\
  \ 桌面使用的默认终端。要从 GNOME 菜单启动 Terminal，如果你在 Fedora 中，请选择 Applications ➔ System Tools\
  \ ➔ Terminal；如果你在 Ubuntu 中，请选择 Applications ➔ Accessories ➔ Terminal。图 17-1 显示了\
  \ Terminal。注意提示符——那是 shell 命令行提示符。你在那里输入你的命令。\n\n* **Konsole**: 这是 KDE 桌面使用的默认终端。在\
  \ KDE 世界中，选择 K Menu ➔ Applications ➔ System ➔ Konsole。图 17-2 显示了 Konsole。命令行提示符出现在窗口中。\n\
  \nTerminal 和 Konsole 都配备了一些实用的额外功能，例如剪切和粘贴文本以及更改字体颜色和背景颜色。你甚至可以复古一下，在黑色背景上使用绿色文字——就像你在老旧\
  \ 70 年代电影中看到的计算机终端一样。\n\n如果你像我们一样频繁使用 shell 提示符，那么参考第 4 和第 5 章关于将终端窗口添加到桌面菜单面板图标中的内容将会非常有帮助。\n\
  \n\n\n\n\n通常，你的 shell 提示符包含有用信息。例如，如果你在 Ubuntu 的 `testbox` 机器上以 `rich` 用户登录，你的提示符看起来如下：\n\
  \n```\nrich@testbox:~$\n```\n\n波浪号字符 (`~`) 表示你正处于主目录中（参见第 6 章）。美元符号表示 `bash` shell\
  \ 已经准备好让你输入命令了。\n\n### 打开虚拟终端窗口\n\n我们需要告诉你另一种启动 shell 会话的方法。虽然你可能不会经常使用它，但在某些时候你会发现它很有帮助。\n\
  \n首先，请注意，你的 shell 提示符只是 GUI 桌面某个窗口内部。假设你想让整个屏幕只显示文本。要切换到文本环境，按下 `Ctrl+Alt+F2`。当你熟悉的图形桌面消失时，不要惊慌。它仍在后台运行，你稍后就可以回到之前离开的地方。在此之前，先对你现在看到的这个枯燥的文本屏幕说几句。\n\
  \n你看到的是一个`虚拟终端`（virtual terminal），这是一个模仿 GUI 出现之前的时代计算机终端外观的屏幕。它是你默认安装时提供的几个屏幕之一。你可能会看到类似的内容的内容：`testbox\
  \ login:`\n\n继续按照提示输入你的用户名和密码。你会看到一条显示你上次登录日期的消息，随后是 `bash` 提示符：\n\n```\nrich@testbox:~$\n\
  ```\n\n注意这个提示符与你留在 GUI 桌面打开窗口中的那一个提示符之间的相似之处。这两个提示符都表示你开启了一个 `bash` 会话。注意，虽然说这两个提示符都源于使用\
  \ `bash` shell 是准确的，但它们是同一个程序的不同且独立的 `instances`（实例）。换句话说，你在这里的工作环境是排除（且独立于）你仍在\
  \ GUI 终端窗口中开启的 `bash` 环境的。\n\n### 在没有 GUI 的情况下工作\n\n你是否好奇你的 GUI 桌面去哪儿了？为了让你稍微冷静一下，试着跳动一下。GUI\
  \ 桌面默认位于 7 号虚拟终端 (`VT`)。你现在打开的是 `VT-2`。摆好你弹钢琴的手指，击击组合键 `Ctrl+Alt+F7`（如果不作用，请尝试 `Ctrl+Alt+F8`）。在两秒钟内，你的屏幕应该会闪烁并返回到图形桌面。很酷吧？你猜怎么着？你在\
  \ `VT-2` 上开启的 `bash` 会话仍在那里；你从未注销。再次按下 `Ctrl+Alt+F2` 回去。漂亮！——就在你离开的地方。你可以反复来回跳转几次，并尝试其他的\
  \ `VTs`（`F1` 到 `F6`）。哇！这种虚拟终端的东西太酷了。\n\n如果你在桌面使用了 `锁定屏幕` 工具（第 4 和第 5 章讨论过），只有你的\
  \ GUI 会话会被锁定。任何人都可以 `Ctrl+Alt` 移动到虚拟终端。因此，在离开电脑之前，请确保注销你的虚拟终端。\n\n好了，当你对这个小技巧感到厌倦时，退出（即输入\
  \ `exit`）以注销你可能打开的每个 `VT`，返回图形桌面和你的 `bash` 提示符。\n\n## 理解 bash 命令\n\n### 语法与结构\n\n\
  许多人在不理解 `bash` shell 命令基础知识的情况下，愉快地跳过了他们的 Linux 使用。注意，这种方法会让你错过 `bash` 中可用的一些酷功能。你对这个\
  \ shell “语言”的工作原理了解得越多，就能做越有意思的事。使用 `bash` 的基础涉及三个组件：\n\n1. 命令名\n2. 选项或标志（Options\
  \ or flags）\n3. 参数（Arguments）\n\n例如，`du -sh ~` 显示你主目录的磁盘占用。在这个例子中，`du` 是命令名，`-sh`\
  \ 表示标志，而 `~` 是参数。注意，许多命令可以带有更多标志。\n\n如果你想知道这个目录占用了多少空间怎么办？`-h` 选项告诉 `du` 以人类更容易读的形式显示信息，例如\
  \ `K` 表示千字节，`M` 表示兆字节，`G` 表示吉字节。\n\n```\ndu -h ~\n```\n\n如果你想知道另一个目录的总和呢？或者只是你的其中一个子目录？以下命令以人类可读的方式显示了\
  \ `Music` 目录占用了多少磁盘空间：\n\n```\ndu -sh ~/Music\n```\n\n你是否好奇在哪里可以找到特定命令的所有选项和参数？大多数命令都提供\
  \ `man` 页面，这将在稍后的“使用帮助”部分中讨论。另一个很好的查询途径是 `--help` 选项，许多命令都可用。注意 `--help` 会列出一份选项的简短列表：\n\
  \n```\ndu --help\n```\n\n### 从 Shell 启动程序\n\nshell 最明显但可能并不显而易见的用法是启动其他程序。你在 Linux\
  \ 中使用的大多数工具都是独立的、可执行程序。用户需要一种方法来启动这些程序。在 GUI 中，你可以将图标与特定程序关联，图形环境具有足够的智能来启动该程序。注意，程序通常需要从环境变量中提取信息，而环境变量是\
  \ shell 环境的一部分（将在本章后面的“与变量交互”部分中进行更详细的处理）。因为变量在 shell 中，所以 GUI 经常通过 `bash shell`\
  \ 调用目标程序。所以你可以看到，即使 GUI 也认为 shell 是必要的——尽管 GUI 尽力向用户隐藏这一细节。\n\n例如，在提示符处输入以下命令：\n\
  \n```\nmahjongg\n```\n\n几秒后，GUI 中将麻将游戏。如果你在虚拟终端（通过按下 `Alt+F1` 进入）而不是 GUI，可能会看到错误消息。原因如下：某些程序需要在图形环境中才能运行；而基于字符的终端（显然）没有这种环境。\n\
  \n\n\n\n\n# 第四部分：初级管理员训练营：通配符扩展的妙用\n\n如果你必须对多个文件重复执行相同的命令，计算机生活将变得非常枯燥。毕竟，计算机的设计初衷不就是为了处理重复性任务吗？`通配符扩展`指的是对许多文件执行同一个命令而无需重新输入该命令的能力。星号（`*`）和问号（`?`）是两个通配符字符，用于匹配任何文件名或文件名的一部分。例如，你可以使用以下命令查看详细目录列表，其中仅包含以\
  \ .doc 扩展结尾的文件：\n\n```bash\nls -l *.doc\n```\n\n列出的文件可能包括 `resume.doc`、`cover_letter.doc`\
  \ 和 `editor.doc` 等。星号通配符可以匹配零个或多个字符。要仅匹配单个字符，请使用问号。\n\n## 使用长命令\n\n当你习惯了命令行后，应该寻找一些快捷方法来减轻打字带来的负担。在本节中，我们将向你展示\
  \ `bash` 壳的某些功能，旨在让你的命令行生活尽可能愉快。这些功能包括自动命令行补全、编辑以及使用之前输入命令的历史记录。\n\n### 让 Linux\
  \ 帮你补全命令或文件名\n\n考虑到你在 Linux 命令行中输入的字符远比通常在 GUI 环境中输入的要多，因此一个在尽可能的地方提供打字快捷键的功能是极其实用的。`命令补全`是壳的一种功能，它可以填充你开始输入的文件名和系统命令的剩余部分。由于\
  \ Linux 文件系统能够处理几乎不受限制的大小的文件名，许多文件名可能会变得巨大。输入这些长文件名可能既繁琐又容易出错。幸运的是，有了命令补全，输入命令或长文件名就变得简单了。\n\
  \n### 第 17 章：在没有 GUI 的工作\n\n你可能在两种情况下想要使用命令补全：输入命令或补全文件名。\n\n#### 补全命令\n\n假设你想输入一个命令，但只记得它以字母\
  \ `up` 开头，并且应该返回自系统重启以来经过的时间。在命令提示符处输入 `up` 然后按 `Tab` 键：\n\n```bash\nrich@testbox:~$\
  \ up[TAB]\n```\n\n会发生以下两种情况之一：\n\n- 如果 `搜索路径`（搜索程序的目录位置；输入 `echo $PATH` 可以查看你的路径）中只有一个匹配的命令，你的命令行将补全该命令，系统将等待你按\
  \ `Enter` 执行该命令。\n- 如果你听到了蜂鸣声，意味着有多个命令以 `up` 开头。只需再次按一次 `Tab` 键即可显示所有可能性。在列表中找到该命令并继续输入，直到前几个字母是唯一的——此时你就可以按\
  \ `Tab` 键补全命令了。如果你按两次 `Tab` 键后没有显示任何内容，说明没有任何匹配项。\n\n#### 补全文件名\n\n命令行补全不仅用于命令；如果你在命令行输入文件名，只需要输入前几个字符然后按\
  \ `Tab` 键。壳通常会在当前工作目录中搜索与你输入内容匹配的文件名，随后补全命令行上的文件名。该功能的行为方式与命令补全相同，即如果多个文件包含你输入的字母，你会听到蜂鸣声，并需要再次按\
  \ `Tab` 键来查看选项列表。\n\n这需要一点时间来适应，但当你掌握了 `Tab` 键和壳的命令行补全功能后，你可能会好奇在没有它的情况下你是怎么过来的。\n\
  \n### 访问你的命令历史\n\n壳能记住你做过的什么（无论好坏），这感觉很不错。\n\n让壳跟踪你输入的命令，可以让你轻松地回到你前段时间敲过的那些该死的长命令——即使是几天前的！假设昨天你成功执行了一个命令，来查找系统中所有的\
  \ `core dump` 文件（包含调试数据的、只有专家程序员或你的计算机才能理解的大文件）并删除了它们。命令看起来像这样：\n\n```bash\nfind\
  \ / -name core -exec rm {} \\;\n```\n\n要重新执行该命令，你只需要从壳的历史记录中将其找出来并重新运行。最简单的方法（如果你要重复使用上次使用的完全相同的命令版本，在这种情况下是\
  \ `find` 命令）是在命令前加一个感叹号。只需输入 `!find` 并按 `Enter`。这样做告诉你的系统查找历史记录并重新运行列表中最后一次 `find`。\n\
  \n另一方面，如果你运行了多次 `find` 命令，并想确保重新执行的是正确的版本，你需要阅读命令历史。在命令提示符处输入 `history`，最后 20 行就会出现。反复按向上方向键，直到找到你想要重新执行的命令。然后只需按\
  \ `Enter` 键再次运行该命令。\n\n如果你想查看更长的过去命令列表，可以使用 `cat` 命令查看文件 `~/.bash_history` 的内容。\n\
  \n## 使用变量\n\n`bash` 壳中的`变量`是计算机用于表示数据段单词或文本字符串。使用变量的一个示例是将变量 `fruit` 设置为包含文本 `apple`。许多标准变量包含了关于你的账户和环境设置的信息。\n\
  \n### 变量与环境变量\n\n你首先需要知道的是 `bash` 壳有两种变量：\n\n- **变量**：变量可以在程序或壳会话中引用，但它只对该会话或程序可见并可用。\n\
  - **环境变量**：环境变量也可以被壳或程序引用。然而，它还有一个额外的行为：它的值会被复制到从其环境创建的任何其他程序或壳中。\n\n通常你可以一眼看出 `bash`\
  \ 中变量和环境变量之间的区别。通常惯例是将局部变量命名为全小写字母，如下，或者使用混合大小写字母 `Like This`。然而，环境变量通常始终全大写字母，`LIKE\
  \ THIS`。\n\n### 检查常用的环境变量\n\n`bash` 壳有许多环境变量。你可能会对这些变量存储的项目范围感到惊讶。方便的一点是，你可以根据需要更改存储在变量中的任何内容。表\
  \ 17-1 列出了你最可能需要使用的的环境变量。\n\n**表 17-1：常用的 bash 环境变量**\n\n| 环境 | 目的 | 值 | 变量 |\n\
  | :--- | :--- | :--- | :--- |\n| `HISTSIZE` | 决定存储的之前输入的命令的数量。 | 输入命令的数量 | `HISTSIZE`\
  \ |\n| `HOME` | 设置你的主目录的位置。 | 主目录的路径 | `HOME` |\n| `MAILCHECK` | 设置 `bash` 壳检查邮箱中新邮件的频率。\
  \ | 两次检查之间等待的秒数 | `MAILCHECK` |\n| `PATH` | 设置 `bash` 查找的目录，并设置查找顺序以找到你在命令提示符处输入的程序名。\
  \ | 冒号分隔的目录 | `PATH` |\n| `PS1` | 设置你的命令提示符。 | 用于形成提示符的命令和格式字符 | `PS1` |\n\n大多数环境变量由系统管理员或壳本身为你建立。这些变量主要由程序读取以收集信息。你不需要更改它们的值——\n\
  \n\n\n\n\n## 第四部分：初级管理员训练营\n\n但你可能想要更改某些环境变量的值。例如，在表 17-1 中，第一条目 `HISTSIZE` 决定了保留在文件中的命令行历史行数。通过为\
  \ `HISTSIZE` 设置一个较大的数值，你可以保存更长的之前执行过的命令列表。\n\n### 存储和检索变量值\n\n要给变量赋值，你只需输入你选择的变量名，后面跟着等号（`=`），然后是你想要存储的值：`MyVariable=MyValue`\n\
  \n要检索该变量代表的值，你需要在变量名前加上一个美元符号（`$`）。查看（例如）由 shell 创建的变量，它决定了你的提示符的样子：`PS1`。首先，查看\
  \ `PS1` 中持有的值：\n\n```\necho $PS1\n```\n\n你可能会看到下面的行：\n\n```\n[\\u@\\h \\W]\\$\n\
  ```\n\n每个由反斜杠（`\\`）之前的字符都代表一个 shell 的特殊指令，在引用 shell 提示符时返回特定信息。表 17-2 显示你可以用于自定义提示符的特殊斜杠字符示例。\n\
  \n### 表 17-2：PS1 谜题碎片\n\n| 组件 | 结果 |\n| :--- | :--- |\n| `!` | 打印命令在历史列表中的位置。 |\n\
  | `\\#` | 打印你在当前 shell 会话期间使用的命令数。 |\n| `\\$` | 用户账户打印 `$`，超级用户打印 `#`。 |\n| `\\\
  d` | 按照以下格式打印日期：*日 月 份*。 |\n| `\\h` | 打印你登录的机器名称。 |\n| `\\n` | 移动到下一行。 |\n| `\\\
  s` | 为 bash shell 打印 `bash`。 |\n| `\\t` | 打印 24 小时制的时间。 |\n| `\\u` | 打印你的用户名。 |\n\
  | `\\w` | 打印当前目录的最低层级。 |\n| `\\W` | 打印整个当前目录。 |\n\n好了，继续示例：要将你的 shell 提示符更改为更有趣的内容，请输入以下行：\n\
  \n```\nPS1=‘Hello \\u, what can I do for you? => ‘\n```\n\n注意单引号（`‘`）。在按下回车键后，你会发现提示符已经变成了更具吸引力的内容。如果你更喜欢原始提示符，不必担心；你可以重新分配原始提示符的值（存储在\
  \ `PS1` 中），或者关闭终端窗口并打开一个新的。无论哪种方式，你都回到了熟悉的领域。\n\n你是否好奇系统还为你准备了哪些变量？\n\n你可以通过输入 `env`\
  \ 一次查看所有环境变量。请注意，在日常使用 Linux 时，你可能没有理由在命令行中访问变量。然而，当你变得更熟练后，你可能想要探索 `bash` 的 shell\
  \ 编程能力——在其中变量存储将大派用场，就像它在任何计算机编程语言中一样。\n\n那些单引号是怎么回事？更改环境变量时，你需要注意一些细节。如果你只是给一个数字赋值，你可以直接使用，例如\
  \ `HISTSIZE=250`。但是，如果你想使用包含空格的内容，就必须使用引号。使用哪种引号——单引号还是双引号——取决于你还想做什么。\n\n如果你想显示*完全符合*你指定的内容，请使用单引号创建一个*字面量字符串*。例如，在命令行提示符处输入以下行：\n\
  \n```\necho ‘Hello, my name is $USER’\n```\n\n输出结果如下：\n\n```\nHello, my name is\
  \ $USER\n```\n\n有点傻萌，对吧？\n\n看看另一种 shell 解释方式不同的字符串：*插值字符串*。*插值*值是指 shell 在处理值之前会解释特殊字符的值。这次你没有使用单引号，而是使用双引号的相同的示例：`echo\
  \ “Hello, my name is $USER”`\n\n注意这次的输出是什么：\n\n```\nHello, my name is rich\n```\n\
  \nshell 并没有显示你提供的精确文本，而是将由美元符号指定的变量名替换为该变量中存储的实际值。\n\n为什么你在第一个示例中使用单引号，而在第二个示例中使用双引号呢？带有反斜杠（`\\\
  `）的项会以这种或那种方式被*解释*。然而，如果你使用双引号，它们会被解释一次，因此列出你所在目录的项只会在第一次发生变化。如果你使用单引号，变量会在你每次执行操作时都被解释。\n\
  \n如果你打算玩玩环境变量，请从在本节中讨论的方法开始。当你对所做的任何更改都熟悉后，可以通过打开 `~/.bashrc` 文件并在其中添加相同的文本来使更改永久。下次登录时，更改将生效。你也可以在\
  \ `/etc/profile` 中为所有用户的配置更改。\n\n如果你对这些文件进行大量实验，请创建一个单独的用户账户，这样你就可以随心所欲弄乱自己的登录。这个建议特别适用于\
  \ `/etc/profile`。这一个可能会破坏所有人的登录！要创建一个单独 `/etc/profile`，你可以通过输入 `cp /etc/profile\
  \ /etc/profile.original` 创建备份。然后随心所欲编辑 `/etc/profile`，知道你随时可以使用 `rm` 命令删除它，并使用 `mv`\
  \ 命令将 `/etc/profile.original` 重命名为 `/etc/profile`。\n\n要从头创建一个环境变量，你通常用全大字母命名，然后你必须导出它——例如这样：`CUSTOMVAR=\"\
  new variable\"`\n\n```\nexport CUSTOMVAR\n```\n\n如果你现在还不理解这些变量内容，不要太灰馁。随着你对 Linux\
  \ 越来越熟练，你应该探索*shell 脚本*。shell 脚本是仅用 shell 创建计算机程序的艺术。大多数 Linux 和 UNIX 管理员说 shell\
  \ 脚本语言就像我们说母语一样简单。\n\n### 使用重定向和管道\n\n重定向和管道促进了信息的流动。*管道*（pipe）正如其名：它将一个程序的输出重定向到另一个程序的输入。流水线可能由通过管道连接的多个工具组成。在流水线的任一端，可选的重定向。\n\
  \n几乎所有需要输入输出的 Linux 工具都连接了以下常用接口：`stdin`（标准输入）、`stdout`（标准输出）和 `stderr`（标准错误）。通过向程序提供输入或从程序输出读取常用方法，你可以将工具组合成复杂的解决方案。\n\
  \n### 重定向命令输出\n\n在这里讨论重定向命令输出是因为它是最常见的引导形式。*输出重定向*的一个示例是让命令将其发送到文件而不是屏幕，正如你可能习惯的那样。从熟悉的领域开始，输入\
  \ `ls -l` 然后按回车，产生如下内容：\n\n```\nrich@testbox:~$ ls -l\ntotal 36\ndrwxr-xr-x 2 rich\
  \ rich 4096 2009-05-20 18:56 Desktop drwxr-xr-x 2 rich rich 4096 2009-05-17 14:09\
  \ Documents drwxr-xr-x 4 rich rich 4096 2009-05-17 17:42 GNUstep drwxr-xr-x 2 rich\
  \ rich 4096 2009-05-17 14:09 Music\ndrwxr-xr-x 2 rich rich 4096 2009-05-17 14:09\
  \ Pictures drwxr-xr-x 2 rich rich 4096 2009-05-17 14:09 Public\ndrwxr-xr-x 2 rich\
  \ rich 4096 2009-05-17 14:09 Templates drwxr-xr-x 2 rich rich 4096 2009-05-17 14:09\
  \ Videos\nrich@testbox:~$\n```\n\n想把这些信息发送到文件吗？你可以使用 `>` 重定向操作符告诉 bash 将数据发送到文件而不是屏幕上。\n\
  \n输入以下命令将信息发送到名为 listing 的文件：`ls -l > listing`\n\n\n\n\n\n注意屏幕上没有显示任何内容，而通常你本期望看到\
  \ `ls` 命令的输出。这是因为 shell 已将输出重定向到一个名为 `listing` 的文件。要验证该目录列表是否存在，请输入以下命令：\n\n```\n\
  cat listing\n```\n\n328 **第四部分：初级管理员训练营** `cat` 命令（以及更多命令）将在附录 A 中介绍。\n\n请注意，如果你再次输入\
  \ `ls -l > listing`，数据将被覆盖，这意味着文件内容将被清空并被新输出替换。你可以通过使用 `>>` 作为重定向操作符来避免这种情况，它告诉\
  \ `bash` 将命令的输出添加到到指定文件的末尾。如果你在未进行任何更改的情况下在同一目录下输入 `ls -l >> listing`，则 `listing`\
  \ 的内容如下：\n\n```\nrich@testbox:~$ ls -l\n\ntotal 36\ndrwxr-xr-x 2 rich rich 4096\
  \ 2009-05-20 18:56 Desktop drwxr-xr-x 2 rich rich 4096 2009-05-17 14:09 Documents\
  \ drwxr-xr-x 4 rich rich 4096 2009-05-17 17:42 GNUstep drwxr-xr-x 2 rich rich 4096\
  \ 2009-05-17 14:09 Music\ndrwxr-xr-x 2 rich rich 4096 2009-05-17 14:09 Pictures\
  \ drwxr-xr-x 2 rich rich 4096 2009-05-17 14:09 Public\ndrwxr-xr-x 2 rich rich 4096\
  \ 2009-05-17 14:09 Templates drwxr-xr-x 2 rich rich 4096 2009-05-17 14:09 Videos\n\
  \nrich@testbox:~$\n\nrich@testbox:~$ ls -l\ntotal 36\ndrwxr-xr-x 2 rich rich 4096\
  \ 2009-05-20 18:56 Desktop drwxr-xr-x 2 rich rich 4096 2009-05-17 14:09 Documents\
  \ drwxr-xr-x 4 rich rich 4096 2009-05-17 17:42 GNUstep drwxr-xr-x 2 rich rich 4096\
  \ 2009-05-17 14:09 Music\ndrwxr-xr-x 2 rich rich 4096 2009-05-17 14:09 Pictures\
  \ drwxr-xr-x 2 rich rich 4096 2009-05-17 14:09 Public\ndrwxr-xr-x 2 rich rich 4096\
  \ 2009-05-17 14:09 Templates drwxr-xr-x 2 rich rich 4096 2009-05-17 14:09 Videos\n\
  rich@testbox:~$\n```\n\n## 使用管道\n\n另一个 `bash` shell 功能允许你连接命令，使得上一个命令的输出变成下一个命令的输入。这种功能被称为\
  \ `pipe`（管道）。假设你想以长列表列表格式查看 `/etc` 目录下所有文件的详情。如果你输入 `ls -la /etc` 来执行操作，会出现一个巨大的列表，很多信息会从你面前掠过。\n\
  \n虽然你可以通过按下 `Shift+PageUp` 来向上回溯，但你可能无法看到你想看到的所有内容。\n\n要查看所有信息，你可以采取两种方法之一：\n\n\
  - 通过重定向将数据发送到文件，输入类似 `ls -l /etc > ~/etclisting` 的命令——然后用你喜欢的编辑器查看 `~/etclisting`\
  \ 的内容。\n- 将输出管道到 `more` 命令（见附录 A），这样你就可以逐页在屏幕上查看了。\n\n要将输出管道到 `more`，请输入 `ls -la\
  \ directory_path | more`，其中 `directory_path` 是你想要列出内容的目录。`|` 符号（在键盘上看起来更像两个堆叠的竖线，而不是单根实线）告诉\
  \ `bash` 你想使用管道。\n\n## 使用帮助\n\n`man page` 系统是 Linux 的电子手册（`man` 是 `manual` 的缩写），旨在为用户提供所有详细命令信息的便利参考。这些信息包括命令行提示符选项、文件格式和程序功能用法。\n\
  \n打开帮助页的语法是 `man <command name>`。\n\n不知道你正在寻找的命令，或者需要关于使用 `man page` 系统的基础信息？只需输入\
  \ `man man` 即可开始。读完帮助页后，按 `Q` 退出。\n\n### 清除屏幕\n\n在 shell 中工作时，`clear` 和 `reset`\
  \ 命令非常有用。`clear` 命令只是简单的清空 `bash` 屏幕。别担心——它不会删除任何文件或更改任何设置——它只是为了整理一下，以便你可以重新向屏幕上输出新内容。\n\
  \n`reset` 命令稍微有趣一点。假设你尝试用 `cat` 命令将二进制文件列到屏幕上。在计算机完成对二进制文件执行 `cat` 命令的结果后，你可能运气还能看到你的提示符。更有可能，你的提示符被渲染成了没有特殊意义的框字符，在键盘上输入会得到更多类似的内容。要恢复正常，只需输入\
  \ `reset` 并按 `Enter`。注意，看起来你并没有在输入 `reset` 这个单词，但放心计算机理解这一系列字符；几秒钟后，它会将你的 shell\
  \ 环境恢复到你的原生语言。\n\n330 **第四部分：初级管理员训练营**\n\n## 第 18 章\n### 基础系统管理\n\n### 本章内容\n-\
  \ 管理用户\n- 玩转打印机\n- 监控程序\n\n*看一眼这个星球，任何来自外太空的访问者都会说：“我想见经理。”* —— William S. Burroughs\n\
  \n好了，现在你的 Linux 系统运行得完全符合你的要求，安装了恰合适的软件包组合。你正在编写文档、创建精美的图形、听音乐 CD 唱片，甚至在玩游戏。但不要坐下休息：还有更多工作要做。\n\
  \n你总是需要对你的系统进行调整——无论是允许他人使用它、安装新打印机，还是试图弄清楚为什么软件运行得如此缓慢（是的，即使是 Linux 程序有时也会出错）。保持一切井然有序正常运行可能是一项全职工作。即使对于家庭\
  \ Linux 系统，你可能需要管理多个用户账户和打印机，并跟踪系统上运行的十多个程序。\n\nLinux 提供了一些工具来帮助管理过程。你无疑已经在桌面菜单区域看到过“管理”部分（参见第\
  \ 4 和第 5 章）。有些项目是非常言自易明的，例如日期和时间设置、显示设置、键盘设置和语言设置。然而，其他项目并没有那么容易理解。本章将介绍 Ubuntu\
  \ 和 Fedora 提供的几个管理工具，以帮助你的系统运行变得更容易。\n\n![Image 166](img/index-345_1.jpg)\n\n332\
  \ **第四部分：初级管理员训练营**\n\n### 管理用户和组\n\n无论你是支持一个拥有数百个用户的 Linux 系统，还是只为你和你的猫准备了一个账户，你都需要知道如何管理用户账户。大多数\
  \ Linux 发行版都包含一些图形工具来帮助你管理用户账户。\n\nLinux 世界中有很多不同的用户管理工具，但它们的工作方式大体相同。我们不试图混淆问题去描述不同的工具，而是带你直观\
  \ Fedora 用户管理器（User Manager）工具的操作过程。这应该让你对如何使用你的 Linux 发行版提供的任何工具来处理用户账户有一个概念。\n\
  \n如果你在 Ubuntu 中使用用户管理器，有一个你应该注意的异常情况：默认情况下，它只允许你编辑自己的用户账户。要修改其他用户账户或创建新用户账户，你必须点击“解锁”按钮来打开整个界面。\n\
  \n从 GNOME 桌面选择“系统➪管理➪用户和组”来启动 Fedora 中的用户管理器。如果你尚未以 root 用户登录，请输入 root 用户的密码。主用户管理器窗口出现，如图\
  \ 18-1 所示。\n\n主包含两个标签页——一个用于管理用户，另一个用于管理用户组——在工具栏中还有几个有用的按钮。\n\n**图 18-1:**\n\n\
  Fedora\n\n用户\n\n管理器\n\n工具。\n\n![Image 167](img/index-346_1.jpg)\n\n菜单栏提供了与工具栏相同的功能，外还有一个额外的功能：偏好。选择“编辑➪偏好”打开偏好对话框，如图\
  \ 18-2 所示。\n\n**图 18-2:**\n\n用户\n\n管理器\n\n偏好\n\n对话框。\n\n\n\n\n\n此对话框包含控制用户管理器工具本身行为的设置：\n\
  \n- **隐藏系统用户和组：** Fedora 系统需要许多额外的用户名来控制后台系统程序。不建议变动这些用户和组账户，因此隐藏它们有助于清理用户的视图区域，并防止意外事故的发生（例如删除了重要的系统用户账户）。\n\
  \n- **自动分配的 UID 必须为最大：** Fedora 为每个用户账户分配一个唯一的 `User ID number`（`UID`）。用户管理器非常乐意为新用户自动分配\
  \ `UIDs`，你也可以选择手动分配自己的 `UIDs`。此设置确保了如果用户管理器分配了 `UIDs`，那么这些数字将排在你已创建的任何账户的 `UIDs`\
  \ 之后。除非你正在自行分配 `UID`，否则保持此值设置是安全的。\n\n- **自动分配的 GID 必须为最大：** Fedora 还为每个组分配一个唯一的\
  \ `Group ID number`（`GID`）。此设置确保任何自动分配的组编号都位于列表末尾。同样，启用此设置是可以的。\n\n- **优先让私有组 GID\
  \ 与 UID 相同：** 此功能确保每个用户账户的 `UID` 与分配的 `Group ID` 为相同的数字。这通过确保每个用户账户都属于一个具有相同编号的组，有助于简化用户管理。\n\
  \n![Image 168](img/index-347_1.jpg)\n\n## 第四部分：初级管理员训练营\n\n在你设置好用户管理器工具的偏好设置后，就可以正式开始管理用户和组了。\n\
  \n### 添加新用户\n\n当你首次安装 Fedora 时，它会为你创建一个用户账户。该账户有自己的用于存储文件的主主目录。如果你处于其他人也会使用同一系统的环境中，为每个用户创建独立的用户账户是一个好主意。这样你就不必担心猫意外删除你的重要文档。\n\
  \n如果你需要添加额外的用户账户，需要执行以下操作：\n\n1. **点击添加用户（Add User）按钮。**\n   打开“创建新用户”对话框，如图 18-3\
  \ 所示。\n   **图 18-3：** 用户管理器中的“创建新用户”对话框。\n\n2. **在用户名（User Name）文本框中为用户输入用户名。在全名（Full\
  \ Name）文本框中输入用户的全名以备记录。**\n\n3. **在密码（Password）文本框中为用户输入密码，然后在确认密码（Confirm Password）文本框中重新输入。**\n\
  \   出于安全起见，你应该始终使用不是常用单词、包含数字和大小写字母混合且长度至少为八个字符的密码。\n\n4. **为用户选择登录 shell（login\
  \ shell）。**\n   Fedora Linux 支持多种不同的登录 shell；每个 shell 都允许你使用文本命令和脚本（有关使用登录 shell\
  \ 的帮助请参见第 17 章）。Linux 的默认登录 shell 是 Bourne again shell，称为 `bash`。使用此默认值即可。\n\n5.\
  \ **为用户创建主目录。**\n   默认情况下，用户管理器工具会创建一个新用户可以在其中存储个人文件的目录——位于 `/home` 文件夹下，并以用户账户命名。你可以选择不创建\
  \ `/home` 目录，或者在替代位置创建一个。除非你正在运行将 `/home` 文件夹迁移到另一个磁盘驱动器的大型数据中心，否则建议的默认位置很好。\n\n\
  6. **为用户创建私有组。**\n   每个用户必须属于一个默认组。某些 Linux 发行版会创建一个包含所有用户的单一组。默认情况下，Fedora 为每个用户创建一个唯一的组，确保用户不会意外共享文件。允许\
  \ Fedora 这样做是可以的。\n\n7. **手动指定用户 ID（User ID）。**\n   默认情况下，用户管理器会自动为新用户账户分配 `UID`。如果你倾向于使用自己的\
  \ `UIDs` 编号系统，可以在此处分配你自己的 `UID`。\n\n8. **点击确定（OK）创建新用户。**\n   创建新用户账户后，它将出现在“用户”（Users）选项卡下的用户列表中。\n\
  \n### 修改现有用户\n\n某些用户账户设置在创建新账户时不会分配。你可以按照以下方式从“用户属性”（User Properties）对话框访问这些设置：\n\
  \n1. **双击“用户”选项卡中列出的用户账户，或选择该用户账户并点击工具栏上的属性（Properties）按钮。**\n   出现“用户属性”对话框，如图\
  \ 18-4 所示。\n   **图 18-4：** 用户管理器中的“用户属性”对话框。\n   ![Image 169](img/index-349_1.jpg)\n\
  \n2. **在“用户数据”（User Data）选项卡上修改数据。**\n   “用户数据”选项卡包含与“创建用户”对话框中相同的字段。你可以在此处更改用户名、全名、主目录或登录\
  \ shell，还可以更改用户账户的密码。\n\n3. **点击“账户信息”（Account Info）选项卡以设置账户过期日期或锁定账户。**\n   过期日期并不意味着用户已过期；仅指登录账户过期。当到达日期时，账户的过期日期会锁定（但不会删除）账户，用户将无法登录。如果你怀疑此用户账户存在未经授权的活动，你也可以手动锁定账户，防止用户登录，但保留账户在系统中的配置。\n\
  \n4. **点击“密码信息”（Password Info）选项卡以强制密码过期规则。**\n   此部分允许你设置用户是否必须更改密码。有字段可以设置：用户在更改密码前可以经过多少天、在密码过期前多少天会用户用户，以及在密码更改日期后多少天如果未更改密码，账户将被锁定。\n\
  \n5. **点击“组”（Groups）选项卡将用户账户分配到其他组。**\n   在创建用户账户时，Fedora 默认会自动为用户创建一个唯一的组。在这里你也可以将用户账户分配到其他组。系统上定义的所有组都会出现在该选项卡中。选择用户账户应该属于每个组。你也可以更改用户账户所属的主组（默认情况下与用户账户相同）。\n\
  \n6. **点击确定（OK）接受对用户账户的任何更改。**\n   对用户账户的任何更改都会立即生效。然而，如果你将用户添加到一个新组，在用户注销并重新登录之前，权限通常无法正常工作。\n\
  \n### 删除用户账户\n\n虽然添加新用户账户相当费力，但删除用户账户却轻而易举。只需从“用户”选项卡列表中选择要删除的用户账户，然后点击工具栏上的删除（Delete）按钮。会弹出一个简单的消息，询问你是否确定选择选择。在双检查确保你删除的是正确的账户后，点击是（Yes）。\n\
  \n### 添加新组\n\n组帮助你管理对系统文件和文件夹的访问。每个文件和文件夹包含三组权限——一组给所有者，一组给分配给该文件或文件夹的组，最后一组给系统上的所有其他用户。通过将文件或文件夹分配给特殊组，你可以允许该组的所有用户对该文件或文件夹具有完全访问权限。\n\
  \n在用户管理器中创建组需要执行以下操作：\n\n1. **点击工具栏上的添加组（Add Group）图标。**\n   打开“创建新组”对话框，如图 18-5\
  \ 所示。\n\n2. **在“组名”（Group Name）文本框中输入新组名称。**\n\n3. **如果你想手动指定组 ID（Group ID），请勾选框框。**\n\
  \   默认情况下，用户管理器会自动分配一个唯一的 `Group ID`。\n\n\n\n\n将 `number` (`GID`) 分配给新组。如果你想使用自己的\
  \ `GIDs`，请勾选复框，然后从下拉列表中选择一个可用的 `GID`。\n\n4. 点击 `OK` 接受设置并创建组。\n\n新组已创建，它将出现在 `User\
  \ Manager` 窗口中 `Groups` 选项卡上的组列表中。\n\n![Image 170](img/index-351_1.jpg)\n\n# 第四部分：初级管理员强化训练营\n\
  \n**图 18-5：** `User Manager` 工具中的“创建新组”对话框。\n\n### 修改组\n\n当你创建了一个新组后，你很可能想向该组添加一些用户。（没有成员的组有什么用呢？）请通过使用\
  \ `Properties` 对话框执行此操作：\n\n1. 在 `Group` 选项卡上双击组名称，或者从列表中选择组名称并点击 `Properties` 按钮。\n\
  \n出现 `Group Properties` 对话框，如图 18-6 所示。\n\n2. 点击 `Group Data` 选项卡来重命名组。\n\n如果你想在保持相同\
  \ `GID` 的情况下重命名现有组，请在 `Group Name` 文本框中输入新名称。\n\n3. 点击 `Group Users` 选项卡向组添加用户。\n\
  \n`Group Users` 选项卡包含系统上所有配置用户的下拉列表（甚至包括系统使用的隐藏用户账户）。\n\n为你你想要添加到组的每个用户勾选复框。\n\n\
  4. 点击 `OK` 将更改应用到组。\n\n你会看到新添加的用户账户出现在 `Groups` 选项卡中该组名称下方。\n\n![Image 171](img/index-352_1.jpg)\n\
  \n### 第 18 章：基础系统管理\n\n**图 18-6：** `User Manager` 工具中的“组属性”对话框。\n\n### 设置打印机\n\n\
  尽管技术专家们不断预测无纸化社会的到来，但目前目前，我们仍然不得不打印某些东西。在过去，打印一直是 Linux 的暗区之一。试图让现代打印机在 Linux 上工作是一项挑战。然而，在过去的几年里，一些惊人的进步让\
  \ Linux 更加支持打印。\n\n打印领域最大的进展可能是通用 UNIX 打印系统 (`CUPS`)。`CUPS` 为 UNIX（以及 Linux）系统与打印机之间提供了一个通用接口。它作为服务后台运行，连接到任何定义的打印机，并等待应用程序发送打印作业。由于它在后台运行，它可以与远程打印机通信并接受来自远程系统的打印作业。\n\
  \n`Printer Configuration` 工具提供了一种简单的方法来配置运行在系统上的 `CUPS` 服务器以及你定义的任何打印机。Ubuntu 和\
  \ Fedora 均包含了 `Printer Configuration` 工具，帮助你掌控打印状况。\n\n从桌面菜单中选择 `System➪Administration➪Printing`，以在\
  \ Ubuntu 和 Fedora 的 GNOME 桌面上启动 `Printer Configuration` 工具。在 KDE 桌面上，选择 `Administration➪Printing`。出现主\
  \ `Printer Configuration` 窗口，如图 18-7 所示。\n\n![Image 172](img/index-353_1.jpg)\n\n\
  # 第四部分：初级管理员强化训练营\n\n**图 18-7：** 打印机配置窗口。\n\n你可以从 `Printer Configuration` 窗口控制两个设置：\n\
  \n- **Server Settings（服务器设置）：** 使用这些设置来控制 `CUPS` 服务器如何管理系统打印功能。\n- **Local Printers（本地打印机）：**\
  \ 在此处你可以更改系统上所有本地定义打印机的单独属性。\n\n主窗口区域显示你已配置的本地打印机（或 Linux 自动检测到的打印机）的图标。工具栏上的 `New`\
  \ 按钮为你提供了两个选项：\n\n- **New Printer（新打印机）：** 启动一个简单的向导，引导你向系统添加新打印机。\n- **New Class（新类）：**\
  \ 启动另一个简单的向导，引导你将配置好的打印机分组形成一个打印机池（在 `CUPS` 中称为 *print class*）。将打印作业发送到打印类可以由该类中的任何可用打印机打印作业。\n\
  \n如果你已经在系统中定义了打印机，右键点击打印机图标以访问这些功能：\n\n- **Properties（属性）：** 允许你为打印机设置功能。\n- **Rename（重命名）：**\
  \ 更改打印机的系统名称。\n- **Copy（复制）：** 复制现有本地打印机定义以创建另一个相同品牌和型号的打印机。\n- **Delete（删除）：**\
  \ 删除现有打印机。\n- **Enabled（启用）：** 勾选时，允许打印作业由打印机提供服务。\n- **Shared（共享）：** 勾选时，此功能会在网络上发布打印机，供其他使用\
  \ `CUPS` 的 Linux 工作站连接。\n- **View Print Queue（查看打印队列）：** 列出等待打印机打印的打印作业。\n\n![Image\
  \ 173](img/index-354_1.jpg)\n\n### 第 18 章：基础系统管理\n\n以下章节描述了如何使用 `Printer Configuration`\
  \ 窗口为你的系统设置 `CUPS` 和打印机属性。\n\n### 打印机服务器设置\n\n选择 `Server➪Settings` 进入 `Basic Settings`\
  \ 窗口，如图 18-8 所示。\n\n**图 18-8：** 打印机配置基础设置窗口。\n\n这里有一些可以使用的不同设置来帮助你的打印机：\n\n- **Show\
  \ Shared by Other Systems（显示其他系统共享打印机）：** 通过网络发现打印机。\n- **Publish Printers Connected\
  \ to This System（发布连接到本系统的打印机）：** 以后介绍。\n- **Allow Remote Administration（允许远程管理）：**\
  \ 允许远程客户端连接到运行在该系统上的 `CUPS` 服务器。\n- **Allow Users to Cancel Any Job (Not Their Own）（允许用户取消任何作业（而非自己的）：**\
  \ 默认情况下，用户只能取消自己的打印作业。启用此功能允许任何用户取消其他用户的打印作业。虽然此功能很方便，但在多用户环境中可能危险。\n- **Save Debugging\
  \ Information for Troubleshooting（保存调试信息用于故障）：** 默认情况下，`CUPS` 服务器产生大量的日志信息。如果你在特定打印机配置遇到问题，可以启用此功能在日志文件中产生更多信息。\n\
  \n![Image 174](img/index-355.jpg)\n\n# 第四部分：初级管理员强化训练营\n\n确定了适用于 `CUPS` 服务器环境的设置后，你可以继续创建本地打印机。\n\
  \n### 添加新打印机\n\nUbuntu 和 Fedora 的一个功能是可以自动检测通过 USB 和并行口连接的打印机。如果你有这些打印机之一，可能不需要手动添加。它会自动出现在\
  \ `Local Printers` 列表中。你可以直接进入下一节进行配置。\n\n如果你没有通过 USB 连接的打印机，你需要手动添加打印机。以下是执行此操作的步骤：\n\
  \n1. 点击工具栏上的 `New Printer` 按钮。\n\n出现 `New Printer Wizard`，如图 18-9 所示。\n\n**图 18-9：**\
  \ `Printer Configuration` 工具中的“新打印机向导”。\n\n2. 选择新打印机的连接类型。\n\n虽然打印机被定义为本地打印机，但此工具还允许你配置表\
  \ 18-1 中列出的打印机连接类型，使其对系统可用。\n\n### 第 18 章：基础系统管理\n\n**表 18-1：Fedora 打印机连接类型**\n\n\
  | 连接类型 | 描述 |\n| :--- | :--- |\n| LPT#1 | 通过本地电脑 25 针 LPT 端口连接的打印机 |\n| Serial Port\
  \ #1 | 通过本地电脑 9 针或 25 针串口连接的打印机 |\n| AppSocket/HP JetDirect | 直接连接到网络、使用网卡和互联网软件的打印机\
  \ |\n| HP Printer (HPLIP) | 使用 HP 专用网络协议的网络打印机 |\n| Internet Printing Protocol |\
  \ 远程 CUPS 系统，发布供远程使用的本地打印机 (IPP) |\n| LPD/LPR Host or Printer | |\n\n\n\n\n一种用于远程共享本地打印机的旧版\
  \ UNIX 标准。\n\n### 通过 Samba 的 Windows 打印机\n一台发布（advertise）共享本地打印机的 Microsoft Windows\
  \ 工作站或服务器。\n\n### 其他\n用于映射到网络打印机的特定通用资源标识符 (`URI`)。\n\n当你在窗口左侧选择每种连接类型时，右侧会出现不同的属性区域。例如，如果你选择“通过\
  \ Samba 的 Windows 打印机”连接，将会出现文本框，你可以在其中输入打印机名称以及访问网络打印机所需的 `User ID` 和密码。\n\n3.\
  \  更改任何属性设置，然后点击“下一步”继续使用向导。\n4.  选择打印机制造商或 `PPD` 文件的位置。完成后点击“下一步”。\n\n`CUPS` 使用标准的\
  \ Postscript 打印机描述 (`PPD`) 文件来处理打印机的格式化打印。这些文件与你可能熟悉的 Microsoft Windows 标准打印机程序具有相同的概念。每台打印机都必须安装\
  \ `PPD` 文件，`CUPS` 才能如何如何格式发送到打印机的文本和图形。\n\n此向导窗口允许你为新打印机选择使用的 `PPD` 文件。你有三个选择：\n\
  - 从已安装的驱动程序列表中选择打印机制造商。\n- 选择安装你自己提供的打印机 `PPD` 文件。\n- 在互联网上搜索并下载 `PPD` 文件。\n\n如果你足够幸运拥有打印机的\
  \ `PPD` 文件，请将其复制到 Linux 系统的某个位置，然后选择“提供 `PPD` 文件”选项。浏览到文件位置并选择它。\n\n如果你没有打印机的 `PPD`\
  \ 文件，可以尝试在标准仓库中搜索。如果你找到了列出的打印机制造商，请选择它。\n\n5.  如果你选择了打印机制造商，下一个向导窗口将提供特定打印机型号和 `PPD`\
  \ 文件的列表。选择型号和（可选的）适当的 `PPD` 文件。完成后点击“下一步”。\n\n此向导窗口要求你为打印机选择特定型号。希望你的打印机型号在列表中。如果没有，你必须返回上一步并找到自己的\
  \ `PPD` 文件进行安装。\n\n如果你的特定型号在列表中，请选择它，将显示可用的 `PPD` 文件列表。某些型号可能只有一个 `PPD` 文件，但另一些型号可能有两个或更多文件可供。在这种情况下，通常会标记一个为“推荐”。先尝试那个：如果不起作用，请选择另一个\
  \ `PPD` 文件。\n\n6.  为打印机创建一个唯一名称，并（可选地）输入描述和位置。点击摘要窗口上的“应用”以创建新的打印机账户。\n\n新打印机被添加到本地打印机列表（即使你映射的是远程打印机）。现在，当你从系统上的应用程序打印时，就能看到这个新打印机。\n\
  \n### 修改打印机属性\n你可以修改系统上任何打印机的属性（无论它是 Linux 自动创建的还是你手动创建的）。在窗口中右键点击你想配置的打印机，然后从菜单中选择“属性”。打印机属性窗口将会出现，如图\
  \ 18-10 所示。\n\n五个可以修改的包含打印信息的区域。这些区域分别是 `Settings`（设置）、`Policies`（策略）、`Access Control`访问控制）、`Printer\
  \ Options`打印机选项）和 `Job Options`作业选项）。在接下来的几个章节中，我们将详细查看每一个。\n\n如果你在打印机属性对话框中进行了任何更改，别忘记点击“应用”或“确定”以使更改生效。\n\
  \n![Image 175](img/index-358_1.jpg)\n\n图 18-10：在打印机配置工具中修改打印机属性。\n\n#### Settings\n\
  设置区域提供了一些你可以为打印机更改的基本设置。在这里，你可以更改打印机的描述和位置标签、打印机的 `URI` 以及用于打印机的 `PPD` 文件。\n\n设置下方有三个按钮可以帮助你测试和维护打印机：`Print\
  \ Test Page`（打印测试页）、`Print Self-Test Page`（打印自检页）和 `Clean Print Heads`（清洗打印）。\n\n\
  #### Policies\n策略区域包含三个复选框以及四个控制打印机行为的策略（或规则）。这三个复选框允许你控制打印机的状态：\n- **Enabled**（启用）：如果出现问题，允许你将打印机离线。\n\
  - **Accepting Jobs**（接受作业）：允许你临时暂停打印作业的处理。\n- **Shared**（共享）：允许你设置此打印机是否为共享资源。\n\
  \n两个策略控制幅页：\n- **Banner pages**（幅页）：允许你控制幅页打印。\n- **Starting Banner**（起始页）：在打印开始前打印特殊页。\n\
  - **Ending Banner**（结束页）：打印作业结束时打印特殊页。\n\n有两个策略供你设置：\n- **Error Policy**（错误策略）：决定打印机遇到错误时的反应。选项包括\
  \ `Abort the Job`（放弃作业）、`Retry the Job`（手动干预后重试）和 `Stop the Printer`（停止打印机）。\n-\
  \ **Operation Policy**（运行策略）：决定打印机的运行模式。目前该选项只有一个默认设置。\n\n#### Access Control\n\
  访问控制区域提供了一种限制访问打印机的方法。有两种方法：\n- 你列出服务器将阻止使用打印机的用户账户。这假设不在列表中的用户账户可以打印，而列表中的账户不能打印。\n\
  - 你列出允许使用打印机的用户账户。这假设不在列表中的用户账户不能打印。\n\n显然，你选择哪一个取决于你想允许还是限制更多人打印。\n\n#### Printer\
  \ Options\n打印机选项区域允许你为物理打印机设置某些属性。你可以修改的属性基于单个打印机 `PPD` 文件提供的信息，并取决于打印机的物理特性。\n\n\
  这些属性根据打印机的功能分为不同的类别。打印机的可用选项如图 18-11 所示。\n\n常规设置处理打印机可以处理的纸张类型、可以产生的打印质量以及输入槽的数量和类型。你可以强制打印服务器为所有打印作业请求特定的纸张尺寸，甚至请求从哪个纸盒取纸。\n\
  \n![Image 176](img/index-360_1.jpg)\n![Image 177](img/index-360_2.jpg)\n\n图 18-11：打印机配置工具中的打印机选项区域。\n\
  \n#### Job Options\n打印模式设置指定了打印机使用的默认打印质量。再次，此设置取决于打印机的能力，但通常有一组供你选择的每点数 (`DPI`)\
  \ 设置和颜色设置。较低的 `DPI` 数节省墨水；较高的 `DPI` 数产生更高的打印质量。\n\n\n\n\n`Job Options` 区域允许你为发送到打印机的打印作业设置默认属性。当你请求应用程序向打印机发送内容时，会弹出一个标准的\
  \ GNOME 打印对话框，如图 `Figure 18-12` 所示。\n\n**图 18-12：**\n\n标准的 GNOME 打印对话框。\n\n![Image\
  \ 178](img/index-361_1.jpg)\n\n348 **第四部分：初级管理员训练营**\n\n你可以为特定的打印作业选择多个打印属性，例如是否以横向模式打印、打印文档的份数、使用的纸张大小等。如果你希望默认使用这些任何设置，可以在打印机配置工具的\
  \ `Job Options` 中指定你的偏好。\n\n设置 `Job Options` 的过程有点奇怪：\n\n1. 在 `Job Options` 区域，在窗口底部的\
  \ `Other Options` 文本框中输入作业选项。\n2. 点击 `Add` 按钮将其添加到可修改的可用选项列表中。\n3. 修改该选项的默认值。\n\n\
  完成后的选项列表显示在打印机属性窗口中，如图 `Figure 18-13` 所示。\n\n**图 18-13：**\n\n打印机配置工具中的 Job Options。\n\
  \n如果你决定将某个选项恢复为默认设置，请点击 `Reset` 按钮。该选项将从列表中移除。\n\n第 18 章：基础系统管理 349\n\n### 查看系统监器\n\
  \n尽管 Linux 系统通常运行良好，但有时应用程序会出现问题。发生这种情况时，能够观察操作系统底层发生的情况会非常方便。\n\n`System Monitor`\
  \ 工具提供了有关系统硬件和软件运行情况的信息。Linux 发行版通常包含此工具，以提供对系统的图形化预览。Ubuntu 和 Fedora 默认包含此功能。\n\
  \n要启动 `System Monitor` 工具，在 Ubuntu 中选择 `System➪Administration➪System Monitor`，或在\
  \ Fedora 中选择 `Applications➪System Tools➪System Monitor`。`System Monitor` 包含四个标签页：\n\
  \n*   **System：** 显示主机、硬件信息和系统状态（硬盘上的可用空间）。\n*   **Processes：** 显示当前系统上运行的程序信息。\n\
  *   **Resources：** 显示 CPU 和内存使用情况。\n*   **File Systems：** 显示挂载在系统上的硬盘信息。\n\n当然，仅仅面对一大堆信息并没有帮助。你需要知道这些信息的含义。`System\
  \ Monitor` 提供了有关系统硬件和软件运行情况的信息。Linux 发行版通常包含此工具，以提供对系统的图形化预览。Ubuntu 和 Fedora 默认包含此功能。（注：为了流利，已合并了原文中的重复文本）。\n\
  \n`System Monitor` 包含四个标签页：\n\n*   **System：** 显示主机、硬件信息和系统状态（硬盘上的可用空间）。\n*   **Processes：**\
  \ 显示当前系统上运行的程序信息。\n*   **Resources：** 显示 CPU 和内存使用情况。\n*   **File Systems：** 显示挂载在系统上的硬盘信息。\n\
  \n\n\n\n每个用户的操作都会影响你的整个系统安全。如果你的家庭成员或同事需要访问你的 Linux 机器，请花时间坐下来，向他们解释安全生活的常识。\n\n\
  ### 更新你的软件\n\n所有用户都可以下载并安装新软件。当然，他们可以安装哪些程序受到用户权限的限制。在这里——与任何其他操作系统一样——务必确保你没有获取被篡改过的程序版本，并记住，有些程序是完全的伪品，试图诱骗人们安装它们。\n\
  \n大多数 Linux 应用程序和其他 Linux 软件程序都是通过互联网分发的。事实上，新 Linux 软件的开发周期及其更新都依赖互联网进行文件交换、电子邮件以及论坛或新闻组讨论。确保你以及你\
  \ Linux 系统的其他用户对他们使用和访问的网站是放心的。你需要建立一个信任网站列表 `list`——即那些能为你提供所需信息且在陈述上不具有误导性的网站。\n\
  \n作为一个开始，你可以信任（`trust`）书中提到的所有网站，因为我们都访问过它们。如果你或你的 Linux 系统的用户不确定是否信任某个特定的网站，请进行一些研究，也许可以询问他人的意见。\n\
  \n第 16 章详细介绍了如何让你的发行版及其软件保持更新状态。\n\n请，请，**务必**（`please`）这样做！毕竟，作为负责人，你的工作是确保这台计算机不受入侵者干扰。除了要确保对你的用户账户和超级用户（`root`）账户都做了用户会做的所有事情——例如确保密码不被泄露——你还有一项进一步的任务：无论你运行的是哪种\
  \ Linux 发行版，你必须跟进新的安全问题。\n\n# 保持你的网络安全\n\n在 Linux 服务器或工作站上——或者在任何计算机上，无论使用何种操作系统——你不应该运行任何你并不打算使用的网络服务。将每个运行的网络程序想象成你房子里的每一扇窗户或滑动玻璃门。每个网络服务都是一个弱点，互联网上有许多坏人，他们喜欢走访每栋房子，并记录那里有多少窗户和玻璃门、是什么种类型，以及有多容易攻破。\n\
  \n### 控制你的服务\n\n你系统中安装的软件越多，它后台运行的服务就可能越多。`Ubuntu` 和 `Fedora` 都提供了一个工具让我们控制系统自动启动哪些应用程序。\n\
  \n在 `Ubuntu` 中，你可以通过选择 系统➪管理➪服务 来查看哪些服务已激活。会弹出 `服务设置` 窗口（如图 19-1 所示）。默认情况下，你只能查看服务；无法对它们进行任何更改。点击`解锁`按钮，然后输入密码以访问此工具。\n\
  \n![Image 181](img/index-368_1.jpg)\n\n**图 19-1:** Ubuntu 服务设置窗口。\n\n列出了已安装的服务，每个服务都有一个复选框，指示该服务当前是否已激活。你可以从此界面控制多个服务：\n\
  \n- **动作调度器 (anacron):** 调度定期自动运行的程序，例如日志清理脚本。\n- **动作调度器 (atd):** 调度仅运行一次的程序。\n\
  - **音频设置管理：** 使用声卡驱动驱动程序控制音频设置。\n- **自动崩溃报告支持：** 如果任何应用程序崩溃，则生成报告。\n- **蓝牙设备管理：**\
  \ 检测并配置你系统上的蓝牙设备。\n- **盲文显示器管理：** 控制盲文终端输出。\n- **计算机活动记录器：** 生成日志文件以跟踪用户和程序。\n-\
  \ **CPU 频率管理器：** 控制笔记本设备上的 CPU 访问以便在空闲时节省电源。\n- **图形化登录管理器：** 在 Ubuntu 中提供图形化登录页面（除非你只使用命令行提示，否则禁用它不是个好主意）。\n\
  - **热键管理：** 检测组合键以执行常用操作。\n\n![Image 182](img/index-369_1.jpg)\n\n- **多播 DNS 服务发现：**\
  \ 自动检测网络硬件，如打印机和共享驱动器。\n- **电源管理：** 控制笔记本电脑的电池使用。\n- **系统总线：** 用于内部通信。\n\n正如你可能看出的，某些服务（如蓝牙支持或笔记本电源管理）仅用于特定情况。如果你的工作站不需要这些功能，禁用它们是安全的。\n\
  \n在 `Fedora` 中，要查看服务，选择 系统➪管理➪服务器设置➪服务。（服务选项可能直接在管理菜单中；取决于你当前安装的软件集合。）输入 `root`\
  \ 用户密码，以确保你有权限改动服务设置。\n\n已安装的服务列在左侧，如图 19-2 所示。\n\n`Fedora` 在启动时会启动旁边带有绿点的服务。带有图标的服务仅在特定的运行级别（run\
  \ levels）启动。`Linux` 使用运行级别来控制软件何时启动。大多数面向图形桌面的软件在运行级别 5 启动。在后台运行且不需要桌面的软件在运行级别 3\
  \ 启动。\n\n你只需点击该服务并点击工具栏上的 `禁用` 图标即可开启或关闭服务。\n\n**图 19-2:** Fedora 服务配置对话框。\n\n你可能感兴趣想要开启或关闭的服务包括：\n\
  \n- **bluetooth:** 如果你的工作站上没有蓝牙接口，则不需要此服务。\n- **iptables:** 该服务是你的防火墙（更多信息请参阅本章节后半部分的“控制和调整你的防火墙”）。如果你需要临时关闭防火墙，可以使用服务控制对话框来实现。\n\
  - **ip6tables:** 该服务用于新的改进的 IP 6 协议，该协议目前在世界上大部分地区尚未被使用。你可以关闭它而不会破坏任何功能。\n- **mdmonitor:**\
  \ 除非你在安装时实现了软件 RAID，否则关闭此服务。（这需要你特意为之，如果你不知道，说明你可能没做！）如果你更改此服务的开启或关闭状态，请确保 `mdmpd`\
  \ 也相应地开启或关闭。\n- **pcscd:** 这是 PC/SC 智能卡阅读器程序。如果你不使用智能卡登录你的 `Fedora` 计算机，可以关闭它。\n\
  - **sendmail:** 虽然你可能不需要一个完整的邮件服务器，但关闭此服务可能会产生意外后果，因为它被用于处理系统内部邮件。请保持开启。\n- **smartd:**\
  \ 如果你在启动时收到关于它的错误信息，请将其关闭。它只与某些 IDE 硬盘配合，如果你没有使用那种类型的硬盘，它就会抛出一个（无害的）错误信息。\n- **spamassassin:**\
  \ 如果你想配合你的邮件程序使用此程序，尽管去吧！此程序在 `Fedora` 中默认与 `Evolution` 配合（见第 10 章），如果你正在使用这种工具组合，请保持此服务开启。\n\
  - **yum:** 在 `Fedora` 中，此程序允许在机器夜间连接互联网时运行夜间自动更新。\n\n\n\n\n\n在 Fedora 中，当你选择或取消选择某个服务时，请确保它的行为符合你的预期——即在重启时启动或不启动。使用工具栏上的\
  \ `Start` 和 `Stop` 图标可以立即启动或停止服务；可以使用对话框的右下部分查看服务现在是否正在运行。\n\n## 控制和调整防火墙\n\n比关闭不需要的服务更好（但也同样重要）的方法是确保你有一道防火墙。使用防火墙就像给你的房子围上一个巨大的堡垒，只为想要执行某些任务的访客开启。朋友可以通过一扇门，家人可以通过另一扇门，而快递可以通过另一扇门。\n\
  \n在计算机网络中，之前讨论的每项服务总是通过同一个门进入（计算机术语中称为 `port`）。你使用防火墙是为了防止任何人触碰大门（`port`），除非你显式设置了允许他们这样做。\n\
  \nUbuntu 和 Fedora 默认都安装了防火墙，但在 Ubuntu 中它并未激活。Ubuntu 安装的防火墙包是 `ufw`。要在 Ubuntu 中激活\
  \ `ufw` 防火墙，你需要通过命令行进行一些操作（见第 17 章）。只需按照以下步骤操作：\n\n### 1. 选择应用程序\n选择 `Applications`\
  \ ➪ `Accessories` ➪ `从顶部边缘面板启动 Terminal 启动应用程序。`\n\n### 2. 输入以下命令：\n```\nrich@testbox:~$\
  \ sudo ufw allow ssh/tcp\n```\n输出看起来如下：\n\n```\n[sudo] password for rich:\nRules\
  \ updated\nrich@testbox:~$ sudo ufw logging on\nLogging enabled\nrich@testbox:~$\
  \ sudo ufw enable\nFirewall is active and enabled on system startup\n\nrich@testbox:~$\
  \ sudo ufw status\nStatus: active\nTo Action From\n-- ------ ----\n22/tcp ALLOW\
  \ Anywhere\nrich@testbox:\n```\n\n第一条命令开启了 `SSH` `TCP` 端口的安全连接。\n\n第二条命令告诉 `ufw`\
  \ 将其限制的任何活动记录在日志文件中。这让你看到是否有人试图黑入你的系统。下一个命令启动 `ufw` 防火墙，最后一个命令显示状态。\n\n### 3. 输入\
  \ exit\n输入 `exit 以退出终端会话。`\n\n一旦你启用了防火墙，它会在每次重启工作站时启动。\n\n遗憾的是，因为 `ufw` 是一个命令行程序，你必须使用命令行向防火墙添加或删除任何后续设置。\n\
  \n另一方面，Fedora 提供了一个方便的图形界面来配置防火墙。如果你想进行更改，选择 `System` ➪ `Administration` ➪ `Firewall`（过程中可能会被要求输入\
  \ root 密码）。打开防火墙配置窗口，如图 19-3 所示。\n\n![Image 183](img/index-372_1.jpg)\n\n**图 19-3:**\
  \ Fedora 防火墙配置对话框。\n\n防火墙配置窗口提供了你可以用于轻松指定防火墙选项的设置。顶部是一个包含你可以执行的一些快速操作的工具栏。你甚至（例如）可以通过点击工具栏上的\
  \ `Enable` 或 `Disable` 图标来启用或禁用整个防火墙功能。如果你的计算机直接连接到互联网——如今大多数计算机都是这样——请确保使用 `Enable\
  \ Firewall`。\n\n唯一不让 Fedora 防火墙处于激活状态的情况是你已经在另一个强力防火墙后面设置了机器，或者你正在使用某个在 Fedora 防火墙开启时无法运行的关键应用程序。然而，仅仅为了一个应用程序就这样做是一个巨大的风险！你反而可以找到如何在防火墙中为该程序打开正确的门。\n\
  \n工具栏上的 `Wizard` 图标提供了一种引导式的系统配置方法。它会询问关于你的系统和网络技能水平的几个简单问题，然后提供设置防火墙功能的选项。\n\n\
  工具栏下方是一个你可以手动配置特定防火墙功能的区域。左侧窗格提供了以下类型设置的选项：\n\n- **信任的服务 (Trusted Services):** 允许或拒绝常用网络应用程序在端口上的访问，例如\
  \ `FTP`（文件传输）、`HTTP`（Web 服务器）和 `SSH`（安全交互式服务器）。\n- **其他端口 (Other Ports):** 允许或拒绝特定已安装应用程序在自定义网络端口上的访问。\n\
  - **信任接口 (Trusted Interfaces):** 基于受信网络上的接口允许访问。\n- **地址伪装 (Masquerading):** 配置防火墙允许从你的本地网络到互联网的连接。\n\
  - **端口转发 (Port Forwarding):** 将目标为一个端口的数据包重定向到另一个端口。\n- **ICMP 过滤 (ICMP Filter):**\
  \ 阻止来自工作站的错误消息包和网络测试数据包（如 `ping`）。\n- **自定义规则 (Custom Rules):** 在防火墙中创建你自己的限制。\n\
  \n这里是最常见的网络服务列表。请极度谨慎地选择这些项目。在大多数情况下，你应该只坚持信任的服务：\n\n- **WWW:** Web 相关内容；只有在你运行\
  \ Web 服务器时才需要。\n- **FTP:** FTP 服务器相关内容；如果你没有运行 FTP 服务器，则不需要它。\n- **Mail (SMTP):**\
  \ 允许远程邮件服务器直接向你的电脑发送邮件。如果你使用 ISP 提供的邮箱（如大多数用户都是如此），你就不需要启用此项。\n- **NFS4:** 网络文件共享。如果你想直接与其他\
  \ Linux 或 UNIX 计算机共享文件夹，请启用此项。\n- **SSH:** 选择此项以保持开启。我们将在下一节中解释它。\n- **Samba:**\
  \ 允许远程微软计算机在你的 Fedora 计算机上共享文件和打印机。如果你连接到本地微软网络，你可能需要启用此项来共享文件。如果你直接连接到互联网，开启此项并不是好主意。\n\
  \n## 使用系统日志查看器监控你的日志文件\n\n你可能想要配置的另一个安全问题涉及日志文件。你的网络程序、内核和其他程序都会运行日志文件，这些文件包含了系统上发生情况的记录。你可能会对其中包含的信息之多感到惊讶！\n\
  \n你的大多数日志文件都在 `/var/log` 中；找时间看一眼。\n\n幸运的是，有很多工具可以帮助凡人筛选麦子以寻找 Bug 和入侵者的残留。Ubuntu\
  \ 和 Fedora 都提供了系统日志查看器（System Log Viewer），它可以让你轻松扫描计算机上的主要日志文件。通过选择 `System` ➪ `Administration`\
  \ ➪ `System Log`（见图 19-4）启动系统日志查看器。输入 root 密码，因为所有日志文件仅限 root 访问。\n\n![Image 184](img/index-374_1.jpg)\n\
  \n**图 19-4:** Ubuntu 系统日志查看器。\n\n可以看出，有很多日志文件需要挖掘。如提到的，不同的 Linux 发行版使用不同的日志文件；列表取决于你特定的\
  \ Linux 发行版。如果你想查看任何其他日志文件，可以通过菜单栏选择 `File` ➪ `Open`，选择你想查看内容的日志文件，然后点击 `Open`。\n\
  \n### 常见日志文件总结\n以下是你可能会遇到的一些日志简要总结：\n\n- **messages:** 这是主系统日志文件。它包含了操作系统以及许多应用程序和服务的错误和状态消息。messages\
  \ 日志文件中输入的所有消息都采用这种格式：`timestamp system application: message`\n\n你可以使用过滤功能只查看来自特定应用程序的消息，以帮助识别系统上的问题。示例条目如下：\n\
  \n```\nApr 9 19:34:55 testbox dhclient: DHCPREQUEST on eth0\n```\n\n\n\n\n发送至 192.168.73.254\
  \ 端口 67\n\n此条目显示 `eth0` 网络接口正在使用 `dhclient` 应用程序通过 DHCP 请求 IP 地址。\n\n✓\n\n- `auth.log`:\
  \ `auth.log` 文件记录了系统上进行的身份验证尝试。\n\n✓\n\n- `boot.log`: 此日志文件包含从启动过程中产生的消息（大部分信息在系统启动时由于滚动速度太快，来得及阅读）。随着应用程序和服务的启动，它们会在\
  \ `boot.log` 文件中报告状态。`boot.log` 文件使用的格式与消息日志文件相同。如果 Fedora 无法识别你系统上的任何硬件，这里是寻找答案的好去处。\n\
  \n✓\n\n- `daemon.log`: `daemon.log` 文件记录了在系统后台运行的程序活动。\n\n✓\n\n- `secure`: `secure`\
  \ 日志文件报告系统上的每一次安全请求实例，例如用户尝试登录或请求特殊权限时。如果你无法使用用户账户登录系统，请检查此日志。\n\n✓\n\n- `maillog`:\
  \ `maillog` 报告来自邮件系统的错误和状态消息。每当发送或接收消息时，就会生成一条日志消息并存储在此日志文件中。如果你无法发送或接收邮件消息，请检查此处。\n\
  \n✓\n\n- `X.org.0.log`: 此日志文件跟踪计算机上图形化 `X.org` 服务器的状态。`X.org` 服务器为桌面提供了窗口环境。如果你在显示器的桌面显示上遇到问题，请检查此处。\n\
  \n在 Fedora 中，`secure` 日志文件包含有关连接尝试和失败访问尝试的信息。定期浏览此日志文件以监控入侵者是一个好主意。如果你看到大量的被拒绝访问请求，可能有人正试图破解你的系统。\n\
  \n它还会记录用户每次请求 root 权限的记录。例如，当我们启动系统日志查看器应用程序时，它要求我们输入 root 密码。这样做会在 secure 日文件中生成一个条目：\n\
  ```\nMar 20 13:38:22 testbox userhelper: running /usr/sbin/gnome-system-log with\
  \ root privileges on behalf of ‘rich’\n```\n该日志条目识别了以 root 权限运行的应用程序以及请求该权限的用户 ID。\n\
  \n定期浏览消息日志文件也是一个好主意。如果任何系统服务启动失败，你将从此日志文件的条目中发现。\n\n### 第 20 章：虚拟世界\n\n## 本章内容\n\
  - ▶ 什么是虚拟服务器？\n- ▶ 安装 VirtualBox\n- ▶ 准备使用虚拟机执行实际任务 *真正的问题不在于机器是否思考，而在于人类是否思考。*\n\
  — B. F. Skinner (1904–1990)\n\n虽然*虚拟服务器（virtual server）*这个术语听起来非常像*空吉他（air guitar）*，但虚拟服务器实际上是一件好事。虚拟服务器允许你在单台物理机上支持多个服务器，既节省空间又节省资金。它们在企业界正迅速流行，但在家庭环境中也有一席之地。虚拟服务器允许你在单台计算机上安装多个\
  \ Linux 发行版，或者在同一台计算机上同时运行 Linux 和 Windows！\n\n在本章中，我们将详细介绍什么是虚拟服务器——这比弹空吉他要复杂一点——并向你展示如何安装和使用一个虚拟服务器，`VirtualBox`。\n\
  \n## 理解什么是虚拟服务器\n\n在技术变化飞快的世界里，没有任何是理所当然的。\n\n在过去，如果你需要在网络上运行十台独立的服务器，你必须出去购买十套独立的系统，然后将它们存放在一个巨大的数据中心里，那里会占用大量空间。\n\
  \n现在，你有了另一个工具可用：虚拟服务器，这种软件为你提供了与所有硬件相同的能力。通过虚拟服务器，你可以在一个硬件系统上运行所有十台独立的服务器。你不仅节省了硬件成本，还节省了数据中心的空间，节省了电力和冷却费用，（可能）还节省了雇佣大量人员来维护服务器的费用。\n\
  \n运行虚拟服务器需要一个软件包，通过它在单个主机操作系统中创建服务器。主机操作系统负责与硬件建立接口；虚拟服务器软件在主机系统和虚拟服务器之间充当中间人。\n\
  \n每个虚拟服务器都有自己的运行区域——*沙盒（sandbox）*。主机服务器为虚拟服务器提供内存和 CPU 时间，就像它直接运行在底层硬件上一样。\n\n实现虚拟服务器的关键完全在于软件。目前有若干种不同的虚拟服务器软件包；Linux\
  \ 世界中最流行的是：\n\n- `KVM`: 一个开源项目，`KVM` (www.linux-kvm.org) 直接插入 Linux 内核。它只运行在支持虚拟化的\
  \ CPU 的系统上——即在多个程序之间共享 CPU。\n\n✓\n\n- `VirtualBox`: 由 Sun 赞助的项目，`VirtualBox` (www.virtualbox.org)\
  \ 可适用于任何 Linux 发行版，无论内核或底层 CPU 类型如何。因为它与每个 Linux 发行版兼容，我们在本章中教你如何使用 `VirtualBox`。\n\
  \n✓\n\n- `VMWare Server`: 由 `VMWare` (www.vmware.com) 提供的免费软件包，`VMWare Server` 提供适用于不同\
  \ Linux 发行版的多个版本。它作为 Java Web 应用程序在浏览器窗口中安装和运行。\n\n你可以在 Linux 主机上安装任何一个虚拟服务器软件包——然后就可以运行包括\
  \ Linux 和 Windows 在内的各种操作系统的虚拟服务器！\n\n### 安装 VirtualBox\n\n第一步是安装 `VirtualBox` 软件包。根据你的\
  \ Linux 发行版，可能在发行版的软件仓库中找到该包。对于 Ubuntu，包名为 `virtual-ose`。\n\n在 `Synaptic 软件包管理器`（第\
  \ 16 节讨论过）中找到它并安装到你的系统中。安装软件包后，选择应用程序（Applications）➪辅助工具（Accessories）。\n\n如果你的 Linux\
  \ 发行版不包含 `VirtualBox` 软件，或者你只想确保拥有最新版本，请直接从 `VirtualBox` 网站下载。`VirtualBox` 网站为许多常见的\
  \ Linux 发行版（包括 Ubuntu 和 Fedora）提供了安装包。\n\n在下载 `VirtualBox` 软件时，为你的 Linux 发行版选择正确的版本非常。\n\
  \n以下是从网站下载并安装 `VirtualBox` 软件包的步骤：\n\n1. **打开 浏览器并访问网站 www.virtualbox.org。**\n尽管\
  \ `VirtualBox` 项目由 Sun 赞助，但它有自己的网站——包含下载文件、文档和社区论坛区域。\n\n2. **点击主网页左侧的 Downloads（下载）链接。**\n\
  将打开下载 `VirtualBox` 的页面。\n\n3. **选择适用于 Linux 平台的当前版本 `VirtualBox`。**\n这是你正在选择的主机平台。你仍然可以在\
  \ `VirtualBox` 软件中运行其他操作系统，例如 Microsoft Windows。\n\n我们点击了 `VirtualBox 2.2.2` for\
  \ Linux 链接，因为这是本文编写时 `VirtualBox` 的最新版本。\n\n`VirtualBox` 提供适用于 Microsoft Windows\
  \ 和 Mac 操作系统的版本。如果你对在现有的 Windows 或 Mac 安装中添加 Linux 感到犹豫，可以在系统上安装 `VirtualBox` 并在同一系统的沙盒中运行\
  \ Linux。\n\n打开适用于 Linux 主机的 VirtualBox 下载页面。\n\n4. **点击对应你的 Linux 发行版和 CPU 类型的链接。**\n\
  `VirtualBox` 同时有 32 位和 64 位版本，以支持 Intel `x86` (32 位) 和较新的 `AMD64` 64 位 CPU 平台。如果你使用的是\
  \ 64 位的 Ubuntu 或 Fedora，请选择 64 位版本的 `VirtualBox`。\n\n\n\n为你的 CPU 选择正确的 `VirtualBox`\
  \ 版本至关重要。\n\n“文件下载”对话框打开。\n\n5. 点击 `Save` 按钮将软件包保存到你的硬盘上。\n\n安装过程有点冗长，并且可能会崩溃。最好的做法是将整个软件包下载到你的硬盘上，然后从那里进行安装。\n\
  \n![Image 185](img/index-379_1.jpg)\n\n366 第四部分：初级管理员训练营\n\n6. 使用你的文件管理器（参见第 7 章）找到安装包文件的位置，并双击该包文件。\n\
  \nNautilus、Dolphin 和 Konqueror 都会启动相应的包管理器软件来安装该程序包。然后，包管理器会提示你输入管理员密码。\n\n7. 输入密码继续安装。\n\
  \n包管理器安装 `VirtualBox` 软件后退出。\n\n以下是找到你新系统的 `VirtualBox` 系统的方法：\n\n*   **在桌面菜单中：**\
  \ 在 Fedora GNOME 桌面中，选择应用程序➪系统工具➪`VirtualBox`，或者在 KDE 桌面中选择应用程序➪系统。在 Ubuntu 中，选择应用程序➪附件➪`VirtualBox\
  \ OSE`。\n*   **在终端会话中：** 打开终端会话（或 KDE 桌面中的 Konsole 会话）并输入以下命令：\n\n```\nVirtualBox\n\
  ```\n\n注意大小写正确，否则 Linux 将找不到 `VirtualBox` 程序。\n\n图 20-1 显示了启动后 `VirtualBox` 主窗口的样式。\n\
  \n**图 20-1：** `VirtualBox` 主窗口。\n\n![Image 186](img/index-380_1.jpg)\n\n### 第 20\
  \ 章：虚拟世界\n\n367 创建虚拟服务器\n\n当你安装好 `VirtualBox` 后，你就可以创建任意数量的虚拟服务器了。\n\n流程的下一步是为你的虚拟服务器构建一个运行所需的沙箱。你需要为沙箱的大小定义两个内容：为虚拟服务器分配的磁盘空间量以及使用的内存量。\n\
  \n这些项目与宿主机系统共享，因此请小心分配给虚拟服务器的资源！你需要留出足够的空间供主机操作系统运行。你可能需要进行一些实验，以找出对于你的环境来说，多少是太多或太少。\n\
  \n按照以下步骤创建你的第一个虚拟服务器沙箱：\n\n1. 点击 `VirtualBox` 栏上的 `New` 图标，然后在向导的欢迎页中点击 `Next`。\n\
  \n会弹出一个向导（如图 20-2 所示），引导你完成创建虚拟服务器沙箱的过程。\n\n**图 20-2：** `VirtualBox` 新服务器向导的第一个屏幕。\n\
  \n2. 在 `Name` 文本框中为沙箱输入一个名称，从 `Operating System` 下拉列表中选择你计划在虚拟服务器区域安装的操作系统，从 `Version`\
  \ 下拉列表中选择一个`Version`，然后点击 `Next` 按钮。\n\n368 第四部分：初级管理员训练营 `VirtualBox` 软件包提供了一种从宿主机系统内部运行多个操作系统的方法，但它并不提供这些操作系统的任何许可证。为你安装在\
  \ `VirtualBox` 中安装的任何操作系统软件获取适当的许可证是你的责任。\n\n3. 通过使用 `Size` 滑块或输入值，选择你想要分配给虚拟服务器的内存量；然后点击\
  \ `Next` 按钮。\n\n`VirtualBox` 会根据你选择的操作系统以及宿主机上安装的内存量推荐一个要选择的内存值。你可以通过滑块或在文本框中输入数量来增加或减少该值。如果你不确定虚拟内存需求，请使用默认值；你以后可以随时更改。\n\
  \n你为虚拟服务器分配的内存是从虚拟服务器运行时宿主机服务器可用的内存中扣除的。\n\n4. 为虚拟服务器选择一个硬盘器仿真文件。\n\n`VirtualBox`\
  \ 通过在宿主机系统上创建一个大文件来模拟硬盘。你为此虚拟硬盘选择的磁盘空间是在该文件内部创建的，因此它不能大于宿主机上可用的磁盘空间。我们假设你手里没有现成的虚拟磁盘文件，并且你需要创建一个。\n\
  \n5. 为了为虚拟服务器创建一个可启动的硬盘，请确保勾选了 `Boot Hard Drive` 复选框，然后点击 `New` 按钮来创建一个新的硬盘文件。\n\
  \n“创建新虚拟磁盘”向导开始运行。\n\n6. 点击 `Next` 按钮继续。\n\n`VirtualBox` 可以一次性创建整个硬盘文件（称为 `fixed-size\
  \ storage`），也可以创建一个基础文件，并在虚拟服务器操作系统使用更多磁盘空间时将其扩展（称为 `dynamically expanding storage`）。通过一次性创建所有磁盘空间，你可以提高虚拟服务器中的磁盘访问速度——但也会消耗更多宿主机上可能未被虚拟服务器使用的磁盘空间。\n\
  \n7. 选择 `Fixed-Size Storage` 单选按钮，然后点击 `Next` 按钮。\n\n![Image 187](img/index-382_1.jpg)\n\
  \n369 第 20 章：虚拟世界\n\n8. 为新的硬盘文件选择位置（作为文件名），指定文件大小，然后点击 `Next` 按钮。\n\n你可以将硬盘文件放置在宿主机任何你有权限的地方。使用滑块或文本框设置硬盘文件的大小，如图\
  \ 20-3 所示。`VirtualBox` 会根据你之前在向导中选择的操作系统选择推荐的大小。如果你正在安装 Linux 虚拟工作站，请尝试创建一个至少 5GB\
  \ 的磁盘文件。\n\n**图 20-3：** 设置虚拟服务器硬盘文件的位置和大小。\n\n9. 检查新虚拟磁盘文件的设置，然后点击 `Finish` 按钮创建文件。\n\
  \n向导创建文件，然后将你带回到原始的虚拟服务器向导界面。\n\n10. 确保新的虚拟磁盘文件显示为已选的虚拟磁盘，然后点击 `Next` 按钮。\n\n11.\
  \ 检查你为虚拟服务器选择的设置，然后点击 `Finish` 按钮创建虚拟服务器。\n\n当你完成向导后，你的新虚拟服务器项目将出现在主 `VirtualBox`\
  \ 窗口，如图 20-4 所示。\n\n![Image 188](img/index-383_1.jpg)\n\n370 第四部分：初级管理员训练营\n\n**图\
  \ 20-4：** `VirtualBox` 窗口中的虚拟服务器项目。\n\n## 设置你的虚拟服务器\n\n在进入虚拟世界之前，你需要进一步设置一下沙箱。向导设置了一个通用的沙箱环境，因此在使用之前你可能会对其进行修饰。本节将引导你自定义虚拟服务器的沙箱并为你的虚拟服务器添加操作系统。\n\
  \n### 修改设置\n\n你在 `VirtualBox` 中创建的虚拟服务器都有一组配置设置，决定了 `VirtualBox` 在沙箱中模拟的内容。\n\n\
  要进入配置设置，在 `VirtualBox` 窗口左侧选择虚拟服务器项目（参见图 20-4），然后点击 `Settings` 图标。弹出如图 20-5 所示的设置对话框。\n\
  \n![Image 189](img/index-384_1.jpg)\n\n**图 20-5：** `VirtualBox` 设置对话框。\n\n设置对话框有八个设置类别，显示为左侧的图标和文本：\n\
  \n*   **General（通用）：** 设置内存和 BIOS 仿真功能。从这里你可以调整虚拟服务器使用的内存量，同时设置分配给显存的内存量。（此处原文未完）。**Advanced（高级）**选项卡允许你配置\
  \ BIOS 仿真设置，包括启动设备顺序、硬盘控制器仿真以及与宿主机的剪贴板共享。\n\n\n\n如果你必须从 CD 或 DVD-ROM 安装虚拟服务器的操作系统，请确保\
  \ CD/DVD-ROM 驱动器已启用，并在“高级”设置中的启动列表中将其置于硬盘之上。\n\n✓ **硬盘 (Hard Disks)：** 管理用于虚拟服务器的硬盘文件。你可以挂载多个硬盘文件，以在系统上模拟多个一个硬盘。\n\
  \n✓ **CD/DVD-ROM：** 管理 CD 驱动器硬件或对 CD/DVD-ROM 仿真文件的访问。在这里，你可以允许虚拟服务器访问主机系统上的 CD/DVD-ROM\
  \ 驱动器。VirtualBox 的另一个酷功能是你可以直接挂载主机系统中已存在的 ISO 镜像文件。这样，你就可以直接从 ISO 镜像安装 Linux 发行版，而无需将其刻录到\
  \ CD 中。\n\n图 20-6 显示了该视图。\n\n![Image 190](img/index-385_1.jpg)\n\n如果你是从 CD 或 DVD-ROM\
  \ 安装虚拟服务器的操作系统，请确保在尝试启动虚拟服务器之前在这些设置中挂载 CD 或 DVD-ROM 驱动器。它默认是未选中的。\n\n✓ **软盘 (Floppy)：**\
  \ 管理软盘驱动器硬件或对软盘仿真的访问。与 CD/DVD-ROM 功能一样，你可以允许虚拟服务器访问主机系统上的软盘驱动器（可用），或者你可以挂载一个仿真软盘的文件。\n\
  \n✓ **音频 (Audio)：** 管理对主机系统声卡的访问。对于 Linux 主机，你可以选择 ALSA 驱动程序，允许虚拟服务器将声音发送到主机 Linux\
  \ 音系统。\n\n✓ **网络 (Network)：** 虚拟服务器可以接入主机系统的网络连接，在这里你可以配置该功能。默认的 NAT 功能允许主机充当 DHCP\
  \ 服务器，并在虚拟服务器和主机之间创建内部网络。然后，你可以通过虚拟服务器上的网络接口访问主机服务器的网络。图 20-7 显示了该部分的标准设置。\n\n✓\
  \ **串口 (Serial Ports)：** 管理对主机服务器上串口通信端口的访问（可用）。\n\n✓ **共享文件夹 (Shared Folders)：**\
  \ 允许你创建一个主机系统和虚拟服务器都可以访问的文件夹。这为在两个环境之间移动文件提供了方便的通道。\n\n**图 20-6：** 设置对话框中的 CD-DVD-ROM\
  \ 部分。\n\n![Image 191](img/index-386_1.jpg)\n\n**图 20-7：** 设置对话框中的网络部分。\n\n当你完成自定义设置后，点击对话框底部的\
  \ OK 以保存设置并返回 VirtualBox 主窗口。\n\n## 加载操作系统 (Loading an OS)\n\n当虚拟服务器的沙箱已为你的新操作系统完成自定义后，你就可以准备安装操作系统了。\n\
  \n在开始之前，请确保你已有了安装操作系统所需的 CD 或 DVD-ROM。\n\n当你拿到安装光盘后，请按照以下步骤安装操作系统：\n\n1. **将操作系统安装\
  \ CD 或 DVD-ROM 插入主机系统上的 CD/DVD-ROM 播放器中。**\n如果你的桌面自动打开了文件管理器应用程序，请在继续之前关闭该程序。然后你可能就会看到磁盘已挂载到系统，并显示为桌面上的一个图标——这没关系。\n\
  \n2. **从 VirtualBox 窗口左侧的列表中，选择想要安装操作系统的虚拟服务器。**\n\n3. **点击“启动”工具栏图标。**\n\n![Image\
  \ 192](img/index-387_1.jpg)\n\n虚拟服务器启动，就像你开启了某个硬件电源开关一样。VirtualBox 控制台仿真窗口打开。任何通常出现在显示器上的内容都会出现在此窗口内，如图\
  \ 20-8 所示。\n\n**图 20-8：** VirtualBox 控制台仿真窗口。\n\n4. **继续你正在安装的操作系统的安装过程。**\n虚拟服务器应该已经从你插入的操作系统\
  \ CD 或 DVD-ROM 启动（如果没有，请参阅设置对话框的“常规”部分）。只需按照操作系统的正常安装流程操作。操作系统应该检测到你在虚拟服务器中配置的所有仿真硬件。\n\
  \n5. **安装完成后重启虚拟服务器。**\n大多数操作系统的安装会自动重启系统。如果发生这种情况，VirtualBox 控制台仿真窗口会检测到重启并保持打开，允许你观察重启过程。\n\
  \n最终结果是在你的沙箱内运行着一个运行完美的操作系统，如图 20-9 所示。当你关闭虚拟服务器的操作系统时，VirtualBox 会自动关闭控制台仿真窗口。\n\
  \n![Image 193](img/index-388_1.jpg)\n\n**图 20-9：** 在 VirtualBox 中运行熟悉的 Microsoft\
  \ Windows XP。\n\n## 与沙箱交互 (Working with the Sandbox)\n\n当你的虚拟服务器运行时，你需要熟悉几个 VirtualBox\
  \ 命令。\n\n当你首次启动虚拟服务器时，窗口底部会出现一组图标（参考图 20-8）。这些图标指示虚拟服务器何时正在访问系统上的硬件。这些图标代表：\n- 硬盘\n\
  - CD/DVD-ROM 驱动器\n- 软盘驱动器\n- 网络接口\n- 共享文件夹\n\n窗口右下角还包含一个鼠标图标、一个键盘图标以及 `Right Ctrl.`\
  \ 字样。当你启动虚拟服务器时，VirtualBox 会接管主机系统键盘和鼠标的控制权，然后将它们交给虚拟服务器。\n\n✓ 如果在任何时候想将控制权交还给主机系统（例如，你想同时运行另一个应用程序），请按下键盘右侧的\
  \ `Ctrl` 键。\n\n✓ 要将控制权返回虚拟服务器，只需将鼠标放在控制台仿真窗口内的任何地方并按下右 Ctrl 键。\n\n还有两个菜单栏项目——`虚拟机\
  \ (Machine)` 和 `设备 (Devices)`——它们可以在你的虚拟服务器环境中提供帮助。\n\n### 虚拟机菜单 (The Machine menu)\n\
  \n`虚拟机` 菜单提供了方便访问你可能想要对虚拟服务器执行的若干常用功能：\n\n✓ **全屏模式 (Fullscreen Mode)：** 将虚拟服务器的控制台仿真窗口放大到占据整个主机屏幕。要返回窗口模式，按住右侧的\
  \ `Ctrl` 键并按下 `F` 键。\n\n✓ **无缝模式 (Seamless Mode)：** 这是某些客户操作系统提供的特殊功能。VirtualBox\
  \ 允许你在客户操作系统上安装视频驱动程序，以便 VirtualBox 可以像普通窗口一样在主机上显示并控制客户操作系统。\n\n✓ **调整窗口大小 (Adjust\
  \ Window Size)：** 更改主机上 VirtualBox 控制台仿真窗口的大小。\n\n✓ **自动调整显示大小 (Auto-resize Guest\
  \ Display)：** 允许 VirtualBox 根据客户操作系统使用的视频设置来调整窗口大小。如果客户操作系统中设置的显示分辨率大到无法放入主机的桌面窗口，VirtualBox\
  \ 将自动创建滚动条，以便你在客户显示上进行移动。\n\n✓ **禁用鼠标集成 (Disable Mouse Integration)：** 这是另一个某些客户操作系统提供的特殊功能。VirtualBox\
  \ 允许你在客户操作系统上安装鼠标驱动程序，以便更好地控制控制台仿真窗口中的鼠标指针。如果此功能（称为 `mouse integration`）已启用，此菜单项将禁用它。\n\
  \n✓ **插入 Ctrl-Alt-Delete (Insert Ctrl-Alt-Delete)：** 如果你安装了需要旧式“三指礼”来重启的客户操作系统，但你的主机系统也识别\
  \ `Ctrl-Alt-Delete` 键组合，则此选项允许你模拟该键组合。\n\n\n\n\n# 插入 Ctrl-Alt-Backspace\n\n如果你安装了使用\
  \ X-Windows 图形管理器的客户操作系统（大多数 Linux 安装都是如此），并且正在使用 Linux 宿主机，你无法通过按下 `Ctrl-Alt-Backspace`\
  \ 组合键来重置客户机的 X-Windows 会话；如果你这样做，宿主机系统将重置。此选项允许你模拟该组合键而无需实际按下它。\n\n![Image 194](img/index-390_1.jpg)\n\
  \n### 第 20 章：虚拟世界\n\n### 快照 (Snapshot)\n这与获取窗口截图无关。VirtualBox 中的快照允许你保存一份虚拟磁盘文件当前状态的副本。然后你可以使用此虚拟磁盘副本而不是普通版本来启动虚拟机。这是在任何时候对虚拟机进行备份的极佳方法。\n\
  \n### 会话信息对话框 (Session Information dialog box)\n提供当前运行的虚拟机服务器会话的基本信息，如图 20-10 所示。`RunTime`\
  \ 标签显示硬盘、CD-ROM 和网络适配器活动的统计数据。\n\n### 重置 (Reset)\n模拟按下工作站上的重置按钮。这通常会向客户操作系统发送关机信号并重启虚拟机。\n\
  \n### 暂停 (Pause)\n将虚拟机置于挂起模式，但不会向客户操作系统发送任何关闭信号。\n\n### ACPI 关机 (ACPI Shutdown)\n\
  模拟按下工作站上的电源按钮。这通常会向客户操作系统发送关机信号，并在客户操作系统完成关机后停止虚拟机。\n\n### 关闭 (Close)\n关闭 VirtualBox\
  \ 控制台仿真窗口。如果你在客户操作系统运行时选择此选项，VirtualBox 会显示一个“关闭”对话框。你可以尝试向客户操作系统发送关机信号、将系统状态保存为快照，或直接执行强制关电。\n\
  \n**图 20-10：**\nVirtualBox 会话信息对话框。\n\n## 第四部分：初级管理员训练营\n\n### 设备菜单 (Devices menu)\n\
  “设备”菜单允许你控制虚拟机服务器中所用硬件设备的状态。该部分提供的可用选项取决于你在创建虚拟机沙盒箱时选择了哪些硬件设备。可用选项包括：\n\n### 挂载\
  \ CD/DVD-ROM (Mount CD/DVD-ROM)\n允许将虚拟机连接到宿主机系统的 CD 或 DVD-ROM 驱动器，或连接存储在宿主机系统上的\
  \ CD 或 DVD-ROM 的 ISO 镜像。第二个功能非常适合从 ISO 镜像轻松安装 Linux 发行版，而无需将其刻录到 CD。\n\n### 卸载 CD/DVD-ROM\
  \ (Unmount CD/DVD-ROM)\n从虚拟机中释放 CD/DVD-ROM 设备或 ISO 镜像文件。\n\n### 挂载软盘 (Mount Floppy)\n\
  允许访问工作站的软盘驱动器（如果已安装）或软磁盘镜像。类似于 CD/DVD-ROM 版本，你可以使用宿主机系统上的文件来模拟软盘。\n\n### 卸载软盘 (Unmount\
  \ Floppy)\n从虚拟机中释放软盘设备或软盘镜像文件。\n\n### 网络适配器 (Network Adapters)\n提供访问虚拟机上仿真网络适配器的接口。你可以通过此界面启用或禁用网络适配器。适配器旁边的勾表示它已启用。\n\
  \n### USB 设备 (USB Devices)\n如果你在设置虚拟机时允许虚拟机访问 USB 设备，就会出现此选项。当你将 USB 设备插入宿主机系统时，VirtualBox\
  \ 会检测新设备并将其传递给客户操作系统。要移除你的 USB 设备，请禁用菜单中的该项。\n\n### 共享文件夹 (Shared Folders)\n如果你在设置期间选择为虚拟机创建共享文件夹，请使用此区域启用或禁用对共享文件夹的访问。\n\
  \n### 安装增强功能 (Install Guest Additions)\n你可以从此菜单条目下载 VirtualBox 增强功能 CD。增强功能 CD 包含了特殊的驱动程序，你可以将其安装在客户操作系统上，以允许自定义的视频和鼠标交互（参见本章较之前的“机器菜单”章节）。\n\
  \n“设备”菜单允许你完全控制客户操作系统可以访问哪些硬件。\n\n![Image 195](img/index-392_1.png)\n\n# 第五部分：十（The\
  \ Part of Tens）\n\n在书的这部分，我们将回答关于 Linux 的最常见问题。我们将解释一些关于 Linux 安装和设置的关键点，并分享更多常规的故障排除提示和技巧。如果你遇到了一些困难需要帮助，或者你的设置中有某些问题让你感到困扰，这里就是你的选择。\n\
  \n## 第 21 章：设置 Samba 服务器的十步\n\n### 本章内容\n* 介绍 Samba\n* 创建文件服务器\n* 故障排除\n\n*有些事情你如果不分享它们，就永远不会喜欢上对方。*\n\
  — J. K. Rowling，《哈利·波特与魔法石》，1997\n\n本地网络中最重要的东西可能就是文件共享了。文件共享在商业世界是必须的，但在家庭网络中也同样有用。为家中的每个人提供一个放置照片、音乐或文档的公共场所，会让软盘和优\
  \ 盘变得几乎过时。\n\n毫无疑问，微软网络环境是最流行的文件共享系统。任何微软 Windows 计算机都可以相互连接并共享文件夹。但仅仅因为你决定使用 Linux，并不意味着你被冷落了。在本章中，我们将引导你完成在家庭网络上创建自己的文件服务器所需的步骤，它可以从网络上的任何微软或\
  \ Linux 设备访问。\n\n### 玩转 Samba (Dancing the Samba)\n让你的 Linux 与微软 Windows 工作站和服务器通信需要一个特殊的软件包。微软使用专有的（秘密的）网络协议在网络上的\
  \ Windows 设备之间进行通信。\n\n幸运的是，一些有进心的开源爱好者对微软网络协议进行逆向工程，并制作了复制这些协议的软件。这种努力产生了名为 `Samba`\
  \ 的开源包。\n\nUbuntu 和 Fedora 都包含了 `Samba` 软件，允许你将工作站连接到现有的微软网络以共享文件。然而，它们都没有提供创建 Samba\
  \ 服务器的软件——而这是允许微软 Windows 工作站读取你 Linux 系统上的文件和文件夹的方法。\n\n不过，Fedora 发行版包含一个独立的 `Samba`\
  \ 包，它提供了一个极佳的图形界面，用于在 Fedora 系统中创建和配置 Samba 服务器。这允许你的 Fedora 工作站或服务器与网络上的其他微软 Windows\
  \ 工作站共享文件夹。\n\nUbuntu Server Linux 发行版提供了 Samba 服务器软件，但它没有提供用于配置服务器的图形界面。你必须从命令行进行配置。\n\
  \nSamba 服务器软件允许你在 Linux 系统上定义文件夹，然后它会在微软网络上发布这些文件夹。远程 Windows 客户端可以浏览并映射这些文件夹，就像这些文件夹在\
  \ Windows 系统上一样。\n\n你可以通过标准的 Linux 用户和组权限来控制对文件夹的访问。Samba 能够允许网络上的 Windows 用户访问单个\
  \ Linux 用户帐户。此功能允许你在 Windows 网络上使用一组用户账户，并在 Linux 系统上使用另一组用户账户。\n\n### 第一步：制定共享策略\
  \ (Plan a Sharing Policy)\n在开始共享之前，你必须先决定你想共享什么，以及谁有权共享。制定文件夹共享策略是创建文件服务器的关键要素。\n\
  \n\n\n\n\n即使在小型组织中，你也经常需要限制子组访问某些信息。无论是将教师数据与学生数据分开，还是让孩子远离父母的数据，你经常会发现自己为共享文件夹创建了多个组。\n\
  \n你可以根据需要并在文件服务器上创建任意数量 `shares`（网络可用的文件夹）来管理数据组。对于每个共享数据的组，你必须创建一个独立的文件夹，并定义一个独立的组将用户归入其中。\n\
  \n# 第 21 章：设置 Samba 服务器的十个步骤\n\n为了理清这些信息，通常最好的方法是创建一个简单的表格，规划出哪些用户应该访问哪些数据。当你能够在面前看到完整的布局时，创建正确的配置就会变得更容易。表\
  \ 21-1 展示了一个简单的共享文件夹策略表。\n\n### 表 21-1：共享文件夹策略映射\n\n| 组 | 文件夹 | 共享名称 | 成员 |\n| :---\
  \ | :--- | :--- | :--- |\n| bowling | `/bowling` | bowling | fred, barney |\n| shopping\
  \ | `/shopping` | shopping | wilma, betty |\n\n表 21-1 显示，每个组在 Linux 系统上都被分配了一个唯一的文件夹。为了简单起见，此示例使用了相同的组、、文件夹和共享名称，但在实际系统中，这可能是不可行的。创建一个映射各项对应关系的表格，可以让你在项目后期避免很多头疼的问题。\n\
  \n## 第 2 步：创建 Linux 组\n\n创建文件服务器的下一步是在 Linux 中创建必要的组。文件服务器使用 Linux 组来控制你创建的各个共享文件夹的访问。对于此步骤，你需要使用\
  \ Fedora 用户和组管理器：\n\n1. **选择** `System` ➪ `Administration` ➪ `Users and Groups from\
  \ the panel menu.`。\n\nFedora 要求你输入 root 密码；随后会出现用户管理器。该工具为在系统中创建和管理用户及组账户提供了图形化界面。\n\
  \n2. **点击“添加组”图标添加新的 Linux 组。**\n\n出现图 21-1 所示的“新建组”窗口。\n\n3. **在文本框中，输入你想用于控制共享文件夹的组名称。留空“手动指定组\
  \ ID”复选框。**\n\nFedora 会自动为该组分配一个唯一的组 ID。例如，创建两个组——`bowling` 和 `shopping`。新组会出现在\
  \ Groups 选项卡下的组列表中。\n\n![Image 196](img/index-397_1.jpg)\n\n图 21-1：Fedora 新建组窗口。\n\
  \n## 第 3 步：创建用于共享的文件夹\n\n创建组之后，你就可以创建想要共享的文件夹。\n\n出于安全考虑，在现有用户的家目录下创建文件夹并不是好主意，因为这允许他人访问你的文件夹结构。\n\
  \n你应该在系统的普通目录结构之外单独创建共享文件夹。按照以下步骤操作：\n\n1. **选择** `Applications` ➪ `System Tools`\
  \ ➪ `Terminal` 来启动命令行会话。**\n\n如果你需要命令行方面的帮助，请参阅第 17 章。\n\n2. **如果你没有以 root 用户登录，请在命令行输入\
  \ `su` 命令并按回车变为 root 用户。在提示时输入 root 用户密码。**\n\n3. **使用 `cd` 命令切换到根目录。**\n\n```bash\n\
  cd /\n```\n\n4. **使用 `mkdir` 命令创建文件夹。**\n\n文件夹名称与你设置的组对应。例如，如果你创建了 `bowling` 和 `shopping`\
  \ 组，设置文件夹的命令为：\n\n```bash\nmkdir bowling\nmkdir shopping\n```\n\n5. **更改文件夹的所属组。**\n\
  \n`chgrp` 命令用于更改文件夹所属的组。如果你的文件夹是 `bowling` 和 `shopping`，命令为：\n\n```bash\nchgrp bowling\
  \ bowling\nchgrp shopping shopping\n```\n\n此步骤允许组员访问适当的文件夹。\n\n6. **在命令行提示符输入 `exit`\
  \ 退出 root 模式，然后再次输入 exit 退出终端会话。**\n\n## 第 4 步：设置高级文件夹权限\n\n你还需要使用额外的技巧来完成共享文件夹的权限设置。当\
  \ Fedora Linux 创建用户账户时，它会将每个用户账户分配到一个唯一的组（这恰好与用户名相同）。的是的是，在共享文件夹环境中会导致问题。\n\n尽管你的用户都是同一组的成员，他们的主\
  \ Linux 组仍然是唯一的组名。当用户在共享文件夹中创建新文件时，该文件属于用户的主组，而不是你新创建的组。\n\n要解决这个问题，你必须告诉共享文件夹在用户创建新文件运行时文件夹的组，而不是用户的组。这需要一种文件管理器中无法提供的特殊\
  \ Linux 权限。\n\n你必须在命令行提示符下使用 Linux 的 `chmod` 命令手动分配此权限。步骤如下：\n\n1. **选择** `Applications`\
  \ ➪ `System Tools` ➪ `Terminal` 来启动命令行会话。**\n\n如果你不熟悉命令行，请参阅第 17 章。\n\n2. **如果你没有以\
  \ root 用户登录，请在命令行输入 `su` 命令并按回车变为 root 用户。在提示时输入 root 用户密码。**\n\n3. **输入命令 `chmod\
  \ g+rws /foldername`。**\n\n将 `foldername` 替换为你特定组文件夹的名称。\n\n如果你创建了 `bowling` 和 `shopping`\
  \ 文件夹，命令为：\n\n```bash\nchmod g+rws /bowling\nchmod g+rws /shopping\n```\n\nLinux\
  \ 命令 `chmod` 用于更改指定文件夹的权限。命令中的各个选项含义如下：\n\n- `g+` 指定将权限添加到组权限设置中。\n- `r` 指定该组对文件夹拥有读取权限。\n\
  - `w` 指定该组对文件夹拥有写入权限。\n- `s` 指定文件夹组设置将用于文件夹内创建的所有文件。\n\n4. **对创建的每个文件夹重复第 3 步。**\n\
  \n现在，每当用户在某个共享文件夹中创建文件时，文件的组将被设置为你指定的特殊组名，而不是用户的主组。此过程确保了组内的其他成员可以访问组内某员创建的文件。\n\
  \n5. **在命令行提示符输入 `exit` 退出 root 模式，然后再次输入 exit 退出终端会话。**\n\n## 第 5 步：安装并启动 Samba\n\
  \n现在你需要安装 Samba 服务器软件。你可以按照如下方法使用 Fedora 软件包管理工具：\n\n1. **选择** `System` ➪ `Administration`\
  \ ➪ `Add/Remove Software.`。\n\nFedora PackageKit 软件启动。你可以从这里轻松添加或删除软件包。如果你没有以 root\
  \ 用户登录，它会在继续之前要求你输入 root 用户密码。\n\n![Image 197](img/index-400_1.jpg)\n\n2. **在 PackageKit\
  \ 中，选择左侧的 Servers 选项。当右侧软件包列表加载后，选择与 Windows 机器互操作的 Server and Client software 项。**\n\
  \nSamba Suite 软件包包含了 Samba 服务器所需的所有软件包（见图 21-2）。勾选该项旁的复选框进行安装。\n\n图 21-2：选择 Samba\
  \ Suite 软件包进行安装。\n\n3. **选择 Samba 服务器配置工具包。**\n\nSamba 服务器配置程序包包含了用于轻松配置 Samba 的图形化界面。如果你找不到它，在搜索框中输入\
  \ `system-config-samba` 并点击 Find 按钮。\n\n4. **点击右下角的 Apply 按钮开始软件安装。**\n\n\n\n\n\
  安装完 Samba 软件后，你必须决定如何让它在服务器上运行。你有两个选项：\n\n- ✓ **手动：** 如果你不希望 Samba 服务器一直运行，请选择此项。\n\
  - ✓ **自动：** 如果你希望 Linux 服务器启动时 Samba 服务器也启动，请选择此项。\n\n无论选择哪种选项，都必须使用 Fedora 服务配置（Service\
  \ Configuration）窗口；请按照以下步骤操作：\n\n![Image 198](img/index-401_1.jpg)\n\n## 第五部分：十部分\n\
  \n### 1. 从菜单中选择 `System` ➪ `Administration` ➪ `Services`。\n\n服务配置窗口打开。再次强调，你必须是\
  \ root 用户才能使用此工具，因此如果你尚未以 root 登录，在开始之前会被提示输入 root 密码。当服务配置窗口启动时，你会看到 Fedora 系统上所有可用的服务，如图\
  \ 21-3 所示。\n\n**图 21-3：** 服务配置窗口。\n\n系统启动时，服务器会自动启动所有带有绿点图标的服务。你也可以通过相应的按钮启动、停止或重启单个服务。\n\
  \n服务配置窗口将 Samba 服务标记为 `smb`。\n\n此服务实际上控制着两个独立的 Samba 服务：\n\n- `smbd`: 控制客户端到 Samba\
  \ 服务器的连接。\n- `nmbd`: 控制网络上共享设备的广告广播。\n\n### 2. 选择 `smb` 服务，并点击 Start（启动）。\n\n当你启动\
  \ `smb` 服务时，两个 Samba 服务器都会启动。你将在右侧窗口看到服务的状态。\n\n### 3. 如果你想让 Samba 在启动时自动运行，选择 `smb`\
  \ 服务，点击 Enable（启用）图标，然后退出服务配置窗口。\n\n![Image 199](img/index-402_1.jpg)\n\n## 第 21\
  \ 章：设置 Samba 服务器的十步\n\n### 步骤 6：配置 Samba\n\n为了让你的 Samba 服务器在网络上工作，你必须配置两个主要功能：\n\
  \n- ✓ 你必须指定微软网络域或工作组名称。\n- ✓ 你必须为网络客户端开放 Samba 服务器的防火墙端口。\n\n以下是配置 Samba 的步骤：\n\n\
  ### 1. 从菜单中选择 `System` ➪ `Administration` ➪ `Samba`。\n\nSamba 服务器配置窗口打开。\n\n###\
  \ 2. 从菜单栏中选择 `Preferences` ➪ `Server Settings`。\n\n出现如图 21-4 所示的服务器设置窗口。\n\n**图\
  \ 21-4：** Samba 服务器设置窗口。\n\n### 3. 在服务器设置窗口中，输入你的 Windows 网络工作组名称。\n\n请记住，所有使用共享文件夹的网络设备都必须使用相同的名称。默认情况下，Fedora\
  \ 使用系统的 Linux 主机名作为网络上的 Windows 网络设备名称。\n\n你也可以在提供的 Description（描述）文本框中为你的主机提供简要描述。网络设备在浏览网络时，会看到描述以及你的主机名。\n\
  \n![Image 200](img/index-403_1.jpg)\n\n### 4. 完成后点击 OK，然后关闭服务器设置窗口。\n\n### 5. 从菜单中选择\
  \ `System` ➪ `Administration` ➪ `Firewall`。\n\n防火墙配置窗口打开，如图 21-5 所示。\n\n**图 21-5：**\
  \ Fedora 防火墙配置窗口。\n\n你必须是 root 用户才能访问此工具，因此如果你尚未登录，必须输入 root 密码。\n\n### 6. 在 Trusted\
  \ Services（信任服务）区域，勾选 Samba 复选框。\n\nTrusted Services 区域显示系统上配置的常用服务列表。勾选 Samba 项将将其标记为信任服务，并允许网络客户端连接它。\n\
  \nFedora 使用 SELinux 安全机制防止工作站上的未经授权活动。如果你的系统启用了 SELinux 安全软件，你必须告诉它允许 Samba 操作。要此操作，选择\
  \ `System` ➪ `Administration` ➪ `SELinux Management` 来启动 SELinux 管理工具。\n\n从那里，选择\
  \ `Boolean`，然后滚动到 Samba 模块。在 Samba 模块中，勾选 `Allow Samba to Share Any File/Directory\
  \ Read/Write` 复选框。\n\n### 步骤 7：创建 Linux 用户账户\n\n当你的 Samba 服务器在网络上线后，你就可以将转向设置共享文件夹环境了。你已经创建了访问共享文件夹所需的组，现在现在是时候处理用户账户了。\n\
  \n![Image 201](img/index-404_1.jpg)\n\n每个需要访问共享文件夹的用户都必须有一个单独的 Linux 用户账户。按照以下步骤完成：\n\
  \n### 1. 从面板菜单中选择 `System` ➪ `Administration` ➪ `Users and Groups`。\n\n输入 root 用户密码后，用户管理器（User\
  \ Manager）窗口打开。\n\n### 2. 点击 Add User（添加用户）按钮创建新用户。\n\n出现如图 21-6 所示的创建新用户窗口。\n\n\
  **图 21-6：** Fedora 创建新用户窗口。\n\n### 3. 为每个需要访问共享文件夹的用户添加新用户账户。\n\n为新用户输入用户名，以及用于记录的全名（例如\
  \ fred, barney, wilma 和 betty）。分配密码。你必须为用户账户分配密码，但不用担心：Samba 不会此密码来验证远程客户端。\n\n\
  ### 4. 点击 Groups（组）选项卡查看已配置的组。\n\nGroups 选项卡显示服务器上配置的组。你应该能看到“步骤 2：创建 Linux 组”部分创建的组。\n\
  \n### 5. 将新用户添加到相应的组中。\n\n双击组名。出现 Group Properties（组属性）窗口，允许你在 Group Users（组用户）选项卡下选择属于该组的用户。选择你想要加入该组的用户，然后点击\
  \ OK。\n\n![Image 202](img/index-405_1.jpg)\n\n例如，如果 barney 和 fred 是保龄球组的成员，双击保龄球组，然后选择\
  \ barney 和 fred。\n\n### 6. 对所有用户重复步骤 5。\n\n### 步骤 8：创建 Samba 用户账户\n\n我们在上一节中提到，Samba\
  \ 在验证远程客户端时并不使用 Linux 用户账户密码。这是因为 Samba 使用自己的用户账户。Samba 充当远程客户端和 Linux 文件系统之间的中间人。\n\
  \n在访问系统上的文件和文件夹时，Samba 使用定义的 Linux 用户账户。与远程客户端通信时，Samba 使用它自己的用户账户。正如此，Samba 必须使用你作为\
  \ root 指定另一组设置：将 Windows 用户账户映射到相应的 Linux 用户账户。你在 Samba 服务器配置窗口中按照以下步骤操作：\n\n###\
  \ 1. 选择 `System` ➪ `Administration` ➪ `Samba` 以启动 Samba 服务器配置窗口。\n\n与之前一样，你需要 root\
  \ 权限才能使用此程序，因此如果你尚未以 root 用户登录，Fedora 将要求你输入 root 密码。\n\n### 2. 从菜单栏中选择 `Preferences`\
  \ ➪ `Samba Users`。\n\n打开 Samba Users 窗口，如图 21-7 所示。\n\n**图 21-7：** 添加新 Samba 用户的\
  \ Samba Users 窗口。\n\n![Image 203](img/index-406_1.jpg)\n\n### 3. 点击 Add User 按钮添加新\
  \ Samba 用户。\n\n创建创建 Samba 用户窗口。此窗口包含四个需要在其中输入特定信息的区域：\n\n- `UNIX Username`: 下拉列表，你可以在此选择要映射的\
  \ Linux 用户账户。\n- `Windows Username`: 文本框，用于输入远程客户端使用的关联 Windows 网络用户名。\n- `Samba\
  \ Password`: 在此处输入分配给 Windows 网络用户名的密码（记住，这可以且通常与 Linux 密码不同）。\n\n\n\n确认 Samba 密码：在此处重新输入\
  \ Samba 密码，以确保你输入的内容无误。\n\n你必须将 Windows 网络用户名与 Linux 用户名匹配。在图 21-8 所示的示例中，Samba\
  \ 将 Windows 网络用户名 `fflinsto` 映射到 Linux 用户账户 `fred`。\n\n**图 21-8：** 创建新的 Samba 用户账户。\n\
  \n4. （可选）如果你需要修改 Samba 账户，请从 Samba 用户列表中选择该账户的用户名并点击 `Edit`（编辑）按钮。\n\n映射账户后，保持 Samba\
  \ 服务器配置窗口打开，因为在下一步中你需要用到它。\n\n![Image 204](img/index-407_1.jpg)\n\n394 **第五部分：十部曲**\n\
  \n### 第 9 步：在 Samba 中创建共享文件夹\n\n拼图的最后一块碎片是使用 Samba 配置窗口告诉 Samba 你想在网络上发布哪些共享文件夹，并允许网络客户端连接。具体操作步骤如下：\n\
  \n1. **点击 Add Share（添加共享）按钮。**\n\n出现 Create Samba Share 窗口。在这里，你可以定义共享文件夹的详细信息：\n\
  \n- `Directory`（目录）：输入你想要共享的文件夹的完整路径。你也可以点击 `Browse`（浏览）按钮并选择文件夹。\n- `Share Name`（共享名称）：输入你希望\
  \ Windows 网络客户端在连接共享时使用的名称。\n- `Description`（描述）：输入一个简单的描述，该描述将与共享名称一起发布给远程客户端。\n\
  - `Writable`（可写）：如果允许远程客户端写入共享文件夹，请勾选此复选框。你必须设置允许它们写入的 Linux 权限。此选项是一个实用的方法，可以在紧急情况下停止允许远程客户端向共享写入内容。\n\
  - `Visible`（可见性）：如果你希望远程客户端在浏览网络时看到发布的共享，请勾选此复选框。\n\n2. **在 Directory 框中输入目录的文件夹名称。**\n\
  \n当你输入文件夹名称时，Samba 也会输入一个建议的共享名称（通常与文件夹名称相同）。图 21-9 显示了一个示例：配置保龄球共享文件夹。\n\n**图 21-9：**\
  \ 在 Samba 中共享文件夹。\n\n**第 21 章：设置 Samba 服务器的十步** 395\n\n3. **点击 Access（访问）选项卡并选择哪些用户有权访问共享文件夹。**\n\
  \nSamba 允许你为计算机上配置的单个 Linux 用户账户分配访问。你可以勾选复选框允许所有用户访问，也可以从列表中选择单个用户。\n\n允许所有用户并不是坏事，因为\
  \ Linux 权限仍然会阻止未经授权的用户访问共享。\n\n4. **点击 OK 接受新共享文件夹更改，然后选择 File ➪Quit 来关闭 Samba 配置窗口。**\n\
  \n### 第 10 步：映射到共享文件夹\n\n现在你的文件服务器已经完成，是时候测试它了。有几种不同的方法可以实现。最简单是从远程 Windows 客户端测试映射共享文件夹。对于此测试，我们使用\
  \ `Windows XP Home Edition` 客户端：\n\n1. **通过双击桌面上的“我的电脑”图标或选择开始 ➪我的电脑打开“我的电脑”窗口。**\n\
  \n2. **从“我的电脑”菜单栏中选择 Tools ➪Map Network Drive（映射网络驱动器）。**\n\n3. **点击 Browse 按钮浏览网络。**\n\
  \n在 Microsoft Windows 网络下，Fedora Linux 服务器作为网络资源列出。展开该资源以查看列出的共享名称。\n\n4. **选择你具有访问权限的共享。**\n\
  \n5. **选择一个可用的本地驱动器（通过驱动器器号）用于映射网络共享文件夹。**\n\n6. **点击 Finish 完成网络共享文件夹的映射。**\n\n\
  你也可以使用 `\\\\server name\\sharename` 格式直接映射到共享驱动器。默认情况下，你的 Windows 窗口尝试使用你的 Windows\
  \ 用户名和密码登录。如果你想使用不同的用户名和密码登录，请点击映射网络驱动器对话框中的 `Different User Name`（不同用户名）链接，然后输入你想使用的用户名和密码，如图\
  \ 21-10 所示。\n\n就是这些了。你现在应该可以在“我的电脑”区域看到共享文件夹了。点击共享驱动器的字母会在屏幕上显示共享文件夹的内容。由于你的 Linux\
  \ 权限设置，你有能力创建、修改和删除该文件夹中的任何文件。\n\n![Image 205](img/index-409_1.jpg)\n\n396 **第五部分：十部曲**\n\
  \n**图 21-10：** 从 Windows XP 映射到网络驱动器。\n\n### 故障排除\n\n与所有其他计算机相关事项一样，在创建文件服务器时，总会有出现问题的地方。以下是可能出现的故障排除问题简列表：\n\
  \n- **用户无法访问其共享文件夹：** 检查所有权限。首先，确保为文件夹设置了正确的 Linux 组。然后确保该组对文件夹具有适当的权限。最后，确保单个用户是\
  \ Linux 组的成员。\n- **在确认 Linux 权限没问题后，检查 Samba 权限：** 确保已给正确的 Samba 用户账户授予了对共享的适当访问权限。\n\
  - **用户在浏览网络时看不到共享：** 确保 Samba 配置窗口中该共享的 `Visible` 复选框已启用。勾选此复选框允许 Samba 在网络上发布该共享。如果勾选此复选框，共享将不会被发布——它也不会出现在屏幕上。\n\
  \n\n\n\n\n## 检查连接。\n确保所有硬件已正确连接并已电源。验证所有电缆和连接是否已连接妥当。总有人会在某个地方不小心把插在墙插座上的电缆踢掉。\n\
  \n✓\n\n## 移除新硬件。\n移除你最近更改或添加（在问题发生之前）的任何硬件，并检查问题是否消失。如果问题确实消失了，你可能可以断定新的或更改的硬件（或其驱动程序）是罪魁祸首——并开始研究解决方案。\n\
  \n✓\n\n## 减少活动程序数量。\n停止运行与当前问题无关的非必要和服务应用程序。如果没有其他服务和应用程序的干扰，你可能会更容易弄清楚发生了什么。\n\n\
  ✓\n\n## 检查问题是否可以重现。\n相同的事件序列是否会产生相同的问题？假设当你尝试向彩色打印机打印内容时，什么都没有发生。如果你每次尝试打印时都没有反应，那么问题就是可重现的。如果（相反）你的信息有时可以打印，有时又不行，那么问题的模式就不相同，因此它是不可重现的——或者它是由比仅仅点击一个按钮更复杂的原因引起的。\n\
  \n不幸的是，不可重现的问题更难解决；如果没有一组特定的事件模式能重新创建这些问题，你就不知道该修改哪里。\n\n在你得出解决方案后，花几分钟时间记录下这种情况。记录问题的症状、原因以及你实施的解决方案。下次当你遇到相同的问题时，你可以查阅笔记来获取解决方案，而不必重新发明轮子。\n\
  \n如果你（目前）还没有任何需要排除故障的问题，请在操作*之前*记录你的环境。为 `/etc` 目录和 `/boot` 目录创建备份是一个很好的开始。\n\n\
  ### 提示 #1：“Linux 安装程序冻结了”\n当你安装 Linux 时，安装过程可能会直接冻结。如果是这样，请等一下（也许几分钟），并确保安装程序真的冻结了。（有时软件只是需要一点时间处理信息。）如果软件看起来像冻结了，重启电脑并重新开始也没有害——就像你进行任何操作系统安装时做的那样。有时重启后就再也不会出现那个问题了。在其他情况下，问题可能会连续发生两次，然后在第三次时正常了。在放弃之前，务必尝试几次。\n\
  \n如果安装仍然在过程的相同位置（或相近位置）冻结，请访问发行版的支持页面（参见第 1 章）。这些页面可能会介绍一些可以帮助你的已知问题和解决方案，并应该告诉你如何加入讨论列表以获得更多帮助。否则，诊断问题可能是棘手的——而且看起来更像巫术而不是科学。这里是一些提示：\n\
  \n✓\n\n- 如果此问题在完全相同的位置反复发生，你可能有一张坏质的安装光盘。查看下一节“提示 #2：检查你的发行版刻录光”，如果该技术没有解决你的问题，请回到这里。如果可能，尝试在另一台机器上使用该光盘；查看安装是否同样在相同位置失败。如果你购买了这张光盘，请联系该公司的技术支持团队。如果你随书赠送光盘，请联系出版社的技术支持团队。如果你是自己刻的光，，尝试以较慢的速度重新刻一张新盘。✓\n\
  - 如果此问题在完全相同的位置反复发生，且你没有坏盘，那么问题可能出在你机器的某个硬件组件上。如果可以，尝试在机器之间交换硬件。如果不行，你可能需要选择不同的机器来安装\
  \ Linux —— 或尝试另一个发行版。✓\n- 如果问题似乎是随机发生的，你特定的 Linux 发行版可能与该特定机器不兼容。再次，你可以尝试更换一些硬件，在另一台机器上安装\
  \ Linux，或使用另一个发行版。\n\n如果你不确定安装程序是否冻结，尝试按下各种组合键 `Alt+F#*`，其中 `#` 对应功能键之一。取决于发行版，如果你在尝试这种技术时看到不同的屏幕，说明安装程序可能没有完全冻结。\n\
  \n### 提示 #2：检查你的发行版刻录光\n有时安装问题出在物理 CD-ROM 或 DVD-ROM 上。某些 Linux 发行版（如 Fedora）在安装过程中提供实用程序，允许你检查\
  \ CD-ROM 或 DVD-ROM 安装介质的完整性。\n\n如果在 `Anaconda`（安装程序）将包放在硬盘时安装持续崩溃，请按照以下步骤尝试修复：\n\
  \n1. 将 DVD-ROM（或你发行版的第一张 CD-ROM）放入驱动器。\n2. 重启机器。\n3. 等待进入媒体检查（Media Check）对话框。\n\
  \n如果你改变了主意只想开始安装，请按 Tab 或方向键选择 Skip（跳过），然后按 Enter。\n\n4. Tab 到 Test（测试）按钮并按 Enter。如果你使用的是\
  \ CD-ROM 且想测试不同的光盘，Tab 到 Eject CD（弹出光盘）按钮并按 Enter。\n\n如果你选择了第二个选项，从 CD-ROM 驱动器取出第一张\
  \ CD-ROM 并替换为你想测试的 CD-ROM。关闭 CD-ROM 驱动器并确保已选择 `Test`。\n\n5. 按 Enter 开始媒体检查。\n\n\
  媒体检查状态框打开，显示分配给 DVD-ROM 或 CD-ROM 的名称以及已进度。检查结束后，会打开媒体检查结果对话框。\n\n6. 查看“result is”之后的文本和结果。\n\
  \n如果结果为 `PASS`（通过），则 DVD-ROM 或 CD-ROM 本身没有问题。你的安装困难是由其他原因引起的。返回本章前面的“提示 #1：‘Linux\
  \ 安装程序冻结了’”。\n\n如果结果为 `FAIL`（失败），你刚刚测试的 DVD-ROM 或 CD-ROM 有缺陷。如果你购买了这张 CD-ROM 或 DVD-ROM，请联系购买公司看看是否可以更换。另一方面，如果你是自己刻的\
  \ DVD-ROM 或 CD-ROM，请尝试以下方法之一：\n- 重新刻录 DVD-ROM 或 CD-ROM，速度为 4x 或更低。\n- 在带有 `BurnProof`\
  \ 技术（`www.digital-sanyo.com/BURN-Proof`）或类似技术的更新驱动器上重新刻录 DVD-ROM 或 CD-ROM。\n\n如果随书的\
  \ DVD-ROM 有缺陷，请联系书中列出的技术支持地址。但记住，DVD-ROM 中包含的 ISO 安装文件必须先复制到硬盘，然后刻录到 DVD-ROM；你不能直接从书中附的\
  \ DVD-ROM 运行。\n\n### 提示 #3：“我让安装程序测试我的显卡，结果失败了”\n安装程序可能误判了你拥有的硬件。尽可能检查设置。如果设置看起来正确，可以尝试选择较低的分辨率并再次测试；如果失败，尝试较低的颜色数并再次测试。你可以在机器完全安装并更新后，再尝试将设置改回你想要的状态，届那时可能会有针对任何可能问题的修复程序。\n\
  \n### 提示 #4：“安装程序测试显卡正常，但我的 GUI 无法启动”\n如果你的 Linux 安装程序向你显示了 GUI 测试界面并说可以继续剩余安装，你可能预期\
  \ GUI 会无问题地启动。不幸的是，事实并不总是如此。\n\n\n\n\n\n如果你第一次启动机器，并在尝试自动进入 GUI（图形用户界面）时（或当你输入 `startx`\
  \ 手动启动 GUI 时）看到错误信息，请在命令行提示符输入 `system-config-display` 来启动帮助你解决问题的程序。\n\n### 提示\
  \ #5：“我觉得我进入 Linux 了，但我不知道该怎么办！”\n\n两个不同的屏幕往往会让初接触 Linux 的人感到恐慌。图 22-1 所示的第一个屏幕实际上是你已经成功安装了软件并启动了机器的信号。跳之跃舞吧！你只是进入了命令行环境，而不是\
  \ GUI 环境。如果你看到了一个与图 22-1 类似的屏幕，计算机正在要求你使用安装过程中创建的账户用户名和密码进行登录。\n\n**图 22-1：**\n\
  Linux 命令行登录提示。\n\n![Image 207](img/index-415_1.jpg)\n\n402 **第 V 部分：十项技巧**\n\n在\
  \ Fedora 中，你可以以 root 身份登录，然后对系统进行所需的各种。因为 Ubuntu 不使用 root 账户，你只能以普通用户账户登录，如果需要运行任何具有\
  \ root 权限的命令，请使用 `sudo` 命令。\n\n输入用户名和密码后，你会看到图 22-2 所示的屏幕，这恰好是人们感到担心的第二个地方。如果你看到了这个屏幕，说明你不仅正确地进入了\
  \ Linux，而且已经登录并正在使用机器了！放松，给自己点个掌吧。\n\n**图 22-2：**\n已登录到 Linux 命令行。\n\n从这里开始你可以做什么？随你所欲。翻阅这本书寻找你想要运行的命令。输入\
  \ `startx` 来启动 GUI。如果你没有安装任何 GUI（这意味着你选择了没有图形界面的最小化安装选项，或者你实际上取消了图形），你可能需要重新安装，或者必须手动添加所有工具（这可不是件快事！）。\n\
  \n### 提示 #6：“我不想启动到这里！”\n\n你是在只想使用 GUI 时却进入了命令行环境？或者你发现自己已经进入了 GUI，但你更想进入那个漂亮、整洁的黑白命令行屏幕？你并不受困于这两个选项之一。你可以随时更改它们。\n\
  \n**第 22 章：十项故障排除技巧** 403\n\n你可以随时按下 `Ctrl+Alt+F#`（F# 指功能键 F2 到 F6）从 GUI 切换到命令行终端——然后按下\
  \ `Alt+F7` 或 `Alt+F8` 切换回来。\n\n### 提示 #7：更改你的启动环境\n\n标题中的“永久”一词加了引号，是因为如果你愿意，你当然以后可以回来更改此设置。`永久地`\
  \ 只是在你做出此更改后，系统每次启动时都会自动进入首选环境——直到你更改它为止。\n\n在 Ubuntu 中你无法进行此更改，除非你想进入 `single-user\
  \ mode`（单用户模式），这基本上是“安全模式”，并太大用。好吧，你可以进行此更改，但如果你真的想使用该系统，你需要一个懂技术的朋友为你设置很多东西。\n\n\
  要在 Fedora 中进行此更改，你必须编辑所谓的 `run level`（运行级别），如下：\n\n1. **在 GUI 中，打开命令行终端。**\n如果你不确定如何操作，请参见第\
  \ 17 章。如果你不在 GUI 中且已经登录，输入 `su -` 成为 root 用户。\n\n2. **输入 `cp /etc/inittab /etc/inittab.old`\
  \ 进行备份。**\n现在，如果在编辑 `inittab` 文件时发生了什么意外，你始终可以使用旧版本重新启动。\n\n3. **用你偏好的文本编辑器打开 inittab\
  \ 文件。**\n某些 Linux 文本编辑器在第 11 章中有介绍。\n\n4. **向下滚动直到你找到类似下面的一行：** `id:5:initdefault:`\n\
  该行出现在文件顶部。你在这里感兴趣的是数字。在大多数主流 Linux 发行版中，数字 5 告诉 Linux 到 GUI，而数字 3 告诉 Linux 到命令行。因此，前面的示例是启动到\
  \ GUI。\n\n5. **更改此行中的数字。**\n如果是 5，就将其改为 3，反之亦然。确保所有的冒号和其他项目都正确地留在原位，否则你的机器以后启动将出现问题。\n\
  \n6. **保存并退出文件。**\n更改将在下次重启系统时生效。\n\n如果你最终启动系统时遇到了问题，可以使用 Ubuntu 或 Fedora LiveCD\
  \ 作为紧急启动盘。\n\n你随时可以让你的 Linux 机器在全命令行模式和全 GUI 模式之间切换。要切换模式，请执行以下操作：\n\n* 要从 GUI 登录切换到命令行登录，打开终端窗口并（作为\
  \ root）输入 `init 3`。\n* 要从命令行登录切换到 GUI 登录，输入（作为 root） `init 5`。\n\n当你输入 `init` 命令时，你的系统将重启到指定的模式。\n\
  \n### 提示 #8：“我想更改屏幕分辨率”\n\n你是否想或需要动态切换 GUI 中的部分率？假设你想使用 1,024 x 768，但你处理网页，并希望能够看到它们在浏览器中以\
  \ 800 x 600（甚至 640 x 480）显示的效果。你的机器很可能已经设置好了此；你只需要知道如何操作即可！\n\n如果你的机器已为此做好准备，可以通过按下\
  \ `Ctrl+Alt++`（加号）来更改分辨率。务必使用数字键盘上的加号（`+`）——对于此你不能使用主键盘上的加号。\n\n如果你使用的是没有数字小键盘的键盘——当你使用笔记本电脑时就是这样——或者你的机器没有设置好动态更改，那么你必须通过你的显示配置程序更改分辨率（选择\
  \ `System➪Preferences➪Display`）。\n\n**第 22 章：十项故障排除技巧** 405\n\n### 提示 #9：“我的 GUI\
  \ 卡住了，我卡不了！”\n\n如果你的 GUI 无法工作，尝试按下 `Ctrl+Alt+Backspace`。如果这不起作用，那么你的系统状态就非常糟糕！尝试使用\
  \ `Ctrl+Alt+F5` 切换到虚拟终端。如果这个组合键也没有反应，你需要重启机器。\n\n### 提示 #10：“救命，我的机器在启动过程中卡住了！”\n\
  \n在配置 Linux 机器时，你可能会遇到 GRUB 配置文件出现的问题。在 Fedora 中，该文件是 `/boot/grub/grub.conf`。Ubuntu\
  \ 使用 `/boot/grub/menu.lst` 文件。\n\n该文件指示你的系统可以启动的操作系统或多个系统，文件还包含 Linux 启动设置。为了修复你的计算机，你可以尝试重启并从菜单中选择不同的\
  \ Linux 启动选项，或者参考第 3 章关于使用救援磁盘引导到救援模式的说明。如果 GRUB 配置文件带来麻烦，请考虑此潜在解决方案列表：\n\n* 如果你更改或添加了硬盘，你可能需要更改\
  \ GRUB 配置文件中的启动行。\n* 如果你没有进行硬件更改，请检查 GRUB 配置文件是否指向 Linux 镜像的正确位置。（运行执行的程序代码位于 `/boot`\
  \ 目录。）\n* 如果 `/boot` 目录下的位置或根条目的设备错误，你的系统将无法启动 Linux。\n* 如果你在一个多系统启动（双系统或更多）操作系统环境中，请确保你的\
  \ `/etc/grub.conf` 文件包含每个操作系统的条目。每个操作系统或 Linux 安装都必须有一个单独条目。\n* 如果你的文件包含切换到更高分辨率显示的条目且出现启动问题，请尝试将视频设置改为简单的\
  \ VGA。\n\n406 **第 V 部分：十项技巧**\n\n\n\n\nLinux 允许你在文件名中使用空格和其他字符，而这些字符在其他操作系统文件名中可能可以使用也可能无法。\n\
  \n然而，某些 Linux 应用在遇到包含空格的文件或目录名称时可能会出现问题。通常情况下，稳妥的做法是坚持字母数字，并避免空格和特殊字符（如问号和感叹号）。\n\
  \n这里有一个针对非常常见情况的额外通用排故障小技巧…… . . .\n\n### “啊！我忘记 root 密码了！我该怎么办？”\n\n别担心——你有办法解决这个问题！你需要进入\
  \ `single-user mode`（单用户模式），操作步骤如下：\n\n1. **重启你的机器。**\n2. **当你看到带有“Press any key\
  \ to enter the menu”（按任意键进入菜单）的蓝色屏幕时，按任意键。**\n\n此时按哪个键都一样。\n3. **在 GRUB 启动界面，按 E。**\n\
  \n会打开一个配置文件。\n4. **使用方向键移动到以 `kernel` 开头的行。**\n5. **按 E 编辑内核行。在行末尾添加单词 `single`。**\n\
  6. **按回车使更改生效，然后按 B 启动机器。**\n7. **输入 `passwd` 然后按照提示输入两次新密码。**\n8. **输入 `exit` 然后正常启动机器。**\n\
  \n![Image 208](img/index-420_1.png)\n\n# 第 VI 部分：附录\n\n在本部分 . . .\n\n本部分提供了额外的材料来支持本书的其他内容。从广受欢迎且实用的附录\
  \ A 开始，你会发现相当详尽且友好的常用 Linux 命令汇编，可以作为桌面参考。附录 B 向你介绍了如何使用随书的 DVD。\n\n# 附录 A：常用 Linux\
  \ 命令\n\n## 本附录\n\n▶ 使用归档和压缩命令管理存储\n▶ 使用通信命令保持联系\n▶ 使用文件命令组织数据\n▶ 使用系统控制命令操控机器\n\n\
  计算机新手往往对 Linux 专家通常执行的“键盘舞蹈”感到惊叹。当然，这些专家了解鼠标和图形界面等现代进步技术，但这些键盘音乐家更倾向于使用主键，并发现这样工作速度更快。\n\
  \n达到这种熟练程度需要时间，但每位专家都曾是新手，任何新手通过大量练习都能成为专家。\n\n在本附录中，你将按主题列出命令，取决于它们实际上能为你做什么。所以请继续读下去——用你的命令行提示符技巧惊艳你的朋友们吧。当他们问你如何以及在哪里找到所有这些命令时，只需微笑并含糊几句关于脑海中的声音——当然，要把这一页折角，放在电脑旁触手可及的地方。\n\
  \n## 按功能分类的 Linux 命令\n\n由于每个命令都有特定的用途，根据其单独的功能将这些工具分组并不困难。如果你知道需要做什么，但不知道哪个命令可以完成任务，可以翻阅本节开始搜索。从这里开始，你可以通过参考\
  \ man 页（帮助页）进行进一步挖掘。要访问 man 页，在命令提示符处输入 `man command`。例如，`man ls` 会显示文件列出命令的帮助信息。\n\
  \n410 **第 VI 部分：附录**\n\n### 获取帮助\n\n当你挖掘某个命令的帮助时，可以调用一系列有趣的 Shell 命令来协助，如表 A-1 所示。\n\
  \n**表 A-1：Shell 帮助命令**\n\n| 命令 | 用途 |\n| :--- | :--- |\n| `apropos` | 在 man 页描述中查找包含关键词的命令。\
  \ |\n| `info` | 帮助信息的一种方法。你可以在 www.gnu.org/software/texinfo/manual/info/ 找到该工具的说明，也可以通过启动\
  \ `info` 工具并在其中按 `H` 键来使用内置教程。 |\n| `man` | 在 Linux 和 UNIX 中获取帮助的主要方法。 |\n| `whatis`\
  \ | 获取并显示命令的单行描述。 |\n\n查找命令提示符选项的详细信息是一项无休止的追求。man 页系统在你指尖提供了实用的指南，帮助你快速找到这些详细信息。\n\
  \n### 归档与压缩\n\n尽管磁盘空间不像以前那么紧缺，但带宽和备份介质仍然昂贵。因此，这组命令提供了一系列用于压缩和组织存储用数据的工具，如表 A-2 所示。\n\
  \n**表 A-2：归档与压缩工具**\n\n| 命令 | 用途 |\n| :--- | :--- |\n| `bzip2` | 将文件压缩为 `.bz2` 格式。主要用于巨大的文本文件集（源代码实际上如此）。\
  \ |\n| `bunzip2` | 解压缩 `.bz2` 文件。 |\n| `compress` | 将文件压缩为 `.Z` 格式。非常老旧，在 Linux\
  \ 世界已不再常用。 |\n| `gunzip` | 解压缩 `.gz` 和 `.tgz` 文件。 |\n| `gzip` | 将文件压缩为 `.gz` 格式。\
  \ |\n| `tar` | 将文件打包进名为 `tarball` 的组中。该命令最常用的方法是 `tar xvf filename`，例如 `tar xvf\
  \ download.tar`。 |\n| `uncompress` | 解压缩 `.Z` 格式的文件。 |\n| `unzip` | 解压缩 `.zip` 格式的文件。\
  \ |\n| `zip` | 将文件压缩为 `.zip` 格式。 |\n\n附录 A：常用 Linux 命令 411\n\n### 内置 bash 命令\n\n\
  如果你尝试在 man 页查找某些命令的帮助信息，你会发现它们不存在，命令本身也没有以文件的形式出现在你的系统中。记住，当你在提示符输入命令时，你正在与一种名为\
  \ `shell` 的程序进行通信（`bash` 是默认的 Linux shell）。shell 拥有一组你可以用来与之通信的命令，如表 A-3 所示。\n\n\
  **表 A-3：Shell 命令**\n\n| 命令 | 用途 |\n| :--- | :--- |\n| `alias` | 创建或列出命令快捷键。 |\n\
  | `env` | 列出当前的当前的环境变量及其设置。 |\n| `export` | 每当你被要求设置环境变量时，创建该变量并使用此命令，以便该变量被正确记住。\
  \ |\n| `history` | 列出你最后输入的 1,000 条命令。 |\n| `unalias` | 命令快捷键。 |\n\n如果你尝试查看其中某些命令的\
  \ man 页条目，你会发现出现的是 BASH BUILTINS（Bash 内置命令）的帮助信息。要搜索此手册，按正斜杠 (`/`) 键打开 man 搜索界面——然后输入你想搜索的命令名称。\n\
  \n按回车开始搜索。界面会在找到术语的地方停止。如果你想再次尝试，按 `N` 键进入单词的下一次出现。\n\n例如，你可能正在阅读巨大的 bash man 页（输入\
  \ `man bash` 访问此页），但你可能只对 `prompts`（提示符）相关的项目感兴趣，即文本窗口中光标左侧出现的文本。一个示例提示符是\n\n```\n\
  rich@textbox:~$\n```\n\n你可以输入 `/prompt` 并按回车跳转到该词的第一次出现。如果单词周围的文本没有反映你正在寻找的内容，按\
  \ `N` 键跳转到下一个，以此此类推。\n\n412 **第 VI 部分：附录**\n\n### 文件与文件系统\n\n无论你使用哪种操作系统，如果不能在文件系统中找到路并进行操作，很难做任何事情。以下小节中的工具帮助你找到路径。\n\
  \n#### 文件组织\n\n装箱、打包、排序、运输——你可能总是在系统中不断移动文件。文件组织命令提供了移动文件和文件系统单元的工具，如表 A-4 所示。\n\
  \n**表 A-4：文件组织工具**\n\n| 命令 | 用途 |\n| :--- | :--- |\n| `cd` | 切换目录。 |\n| `cp` | 复制文件。\
  \ |\n| `df` | 显示分区及其可用空间。 |\n| `du` | 显示当前目录及子目录占用的磁盘空间。 |\n| `ln` | 创建快捷方式。 |\n\
  | `ls` | 列出目录内容或文件信息。 |\n\n\n\n\n# 附录 A：常用 Linux 命令\n\n| 命令 | 用途 |\n| :--- | :---\
  \ |\n| `mkdir` | 创建目录。 |\n| `mv` | 移动或重命名文件。 |\n| `pwd` | 显示当前所在目录的路径。 |\n| `rm`\
  \ | 删除文件。 |\n| `rmdir` | 删除空目录。 |\n\n## 文件属性\n文件非常像糖果：包装纸提供了成分、尺寸和包装日期的信息——这些都是对内部美味糖块的描述。（也许包装纸还是防儿童的。）文件将所有这些包装信息存储在\
  \ `inode` 中。除了具有更改文件 `inode` 信息的能力外，文件属性命令还可以返回有关文件内容的数据，如表 A-5 所示。\n\n### 表 A-5：文件属性命令\n\
  | 命令 | 用途 |\n| :--- | :--- |\n| `chgrp` | 更改文件关联的组。 |\n| `chmod` | 更改文件的权限。 |\n\
  | `chown` | 更改文件的所有者。 |\n| `file` | 显示你正在处理的文件类型。 |\n| `stat` | 显示有关文件的某些统计信息。 |\n\
  | `touch` | 创建一个同名的空文件。 |\n| `wc` | 显示文件中的单词数、行数等。 |\n\n## 文件定位器\n你的文件在哪里，噢，在哪里呢？文件定位命令（如表\
  \ A-6 所示）可以帮助你在 Linux 庞大的树形结构文件系统中定位文件。\n\n### 表 A-6：文件定位命令\n| 命令 | 用途 |\n| :---\
  \ | :--- |\n| `find` | 强力文件系统搜索工具。 |\n| `locate` | 轻量级文件系统搜索工具。 |\n| `which` | 告诉你如果你输入此命令时将运行的程序路径。\
  \ |\n\n## 文件查看器\n浏览文本文件是许多系统用户的爱好。这些工具提供了多种实用程序，用于查看各种大小的可读文本文件的内容。与全屏编辑器中的命令不同，这些命令（如表\
  \ A-7 所示）都不会破坏文件的内容。这是因为它们只是查看器，而不是编辑器。\n\n### 表 A-7：文件查看器命令\n| 命令 | 用途 |\n| :---\
  \ | :--- |\n| `cat` | 将文件内容转储到屏幕。 |\n| `head` | 显示文件的前十行。 |\n| `less` | 每次显示屏文件。\
  \ |\n| `more` | 每次显示屏文件。 |\n| `tail` | 显示文件的最后十行。 |\n\n## 文件系统命令\n表 A-8 列出的文件系统命令对整个文件系统提供信息或执行操作，范围从创建、调优到修复和恢复。其中某些命令仅返回数据，而另一些命令还为你提供了进行深度文件系统黑客操作的手术刀。\n\
  \n### 表 A-8：文件系统命令\n| 命令 | 用途 |\n| :--- | :--- |\n| `badblocks` | 搜索分区中的坏块。 |\n\
  | `e2fsck` | 检查并修复 `ext2` 或 `ext3` 文件系统。 |\n| `e2label` | 为 `ext2` 或 `ext3` 分区应用文件系统标签。\
  \ |\n| `eject` | 弹出 CD 或 DVD。 |\n| `fsck` | 可以检查并修复许多类型的文件系统。 |\n| `mkfs` | 创建文件系统（格式化分区）。\
  \ |\n| `mount` | 将分区加载到你的文件系统中。 |\n| `sync` | 将缓冲区缓冲区信息保存到磁盘。 |\n| `tune2fs` | 调整\
  \ `ext2` 和 `ext3` 文件系统参数。 |\n| `umount` | 从文件系统中移除分区。 |\n\n### mtools\n`mtools`\
  \ 工具套件提供了一种向你的微软朋友传输信息的好方法。尽管 Linux 对 Microsoft Windows 和 DOS 文件具有原生支持，但你的微软同事们无法访问\
  \ Linux (`ext2` 和 `ext3`) 文件系统。为了让大家都开心，你可以购买预格式化的 MS-DOS 光盘并配合 `mtools` 命令（见表 A-9）使用，这样你就可以与使用\
  \ Windows 的朋友交换文件。\n\n### 表 A-9：mtools 命令\n| 命令 | 用途 |\n| :--- | :--- |\n| `mcd`\
  \ | 在 DOS 光盘上更改 DOS 格式的目录。 |\n| `mcopy` | 在 Linux 之间拷贝 DOS 文件。 |\n| `mdel` | 删除\
  \ DOS 文件。 |\n| `mdeltree` | 删除 DOS 目录及其内容。 |\n| `mdir` | 列出 DOS 目录的内容。 |\n| `mdu`\
  \ | 显示 DOS 分区的占用空间和可用空间。 |\n| `mformat` | 为 DOS 格式化分区。 |\n| `mlabel` | 应用 DOS 卷标签。\
  \ |\n| `mmd` | 创建 DOS 目录。 |\n| `mmount` | 挂载 DOS 光盘或分区。 |\n| `mmove` | 移动或重命名 DOS\
  \ 文件或目录。 |\n\n## 系统控制\n这些命令提供了系统范围的信息和控制。普通用户可以运行许多命令来获取系统信息；然而，积极更改系统配置的命令需要在以\
  \ root 身份登录时运行——或者利用 `su` 命令临时变为超级用户。\n\n## 管理\n某些管理命令（如表 A-10 所示）并不完全归属于某一类。\n\n\
  ### 表 A-10：管理命令\n| 命令 | 用途 |\n| :--- | :--- |\n| `passwd` | 更改特定用户的密码。任何用户都可以运行此命令来更改自己的密码。只有\
  \ root 可以使用它更改他人的密码。 |\n| `su` | 在不注销当前账户的情况下切换到另一个用户账户。使用此命令的最佳方法是 `su -`，这样会加载你的文件路径和其他信息。\
  \ |\n\n## 内核模块处理\n你有时需要为额外的设备（软件或硬件）添加内核支持。当你这样做时，你有有限的选择：你可以重新编译内核或安装可加载内核模块。虽然重新编译内核并不真的需要核科学博士学位，但请将其考虑为一种最好避免的耗时麻烦事。表\
  \ A-11 中的命令允许你在系统运行时包含所需的内核支持，而无需从头开始重新整个内核。\n\n### 表 A-11：内核支持命令\n| 命令 | 用途 |\n\
  | :--- | :--- |\n| `depmod` | 重新生成模块依赖关系。 |\n| `insmod` | 手动加载模块。 |\n| `lsmod` |\
  \ 列出内核已加载的模块。 |\n| `modprobe` | 手动加载模块以及其依赖项和设置。 |\n| `rmmod` | 手动卸载模块。 |\n\n###\
  \ 进程\n你的大部分系统活动都需要进程。即使当你的系统看起来空闲时，后台也有十几个左右的进程（程序）在运行。表 A-12 所示的进程命令允许你检查内部情况，确保一切*应该*运行的*都在*运行——确保你没有让你的计算机资源过热或过度负载。\n\
  \n### 表 A-12：进程命令\n| 命令 | 用途 |\n| :--- | :--- |\n| `crontab` | 设置按固定间隔运行的命令。 |\n\
  | `kill` | 通过编号停止进程。通常用 `kill -9` 用于在进程无法杀掉时强制停止。 |\n| `killall` | 通过名称而非编号停止进程。\
  \ |\n| `nice` | 为进程分配 CPU 使用优先级。 |\n| `pidof` | 获取程序的 ID 。 |\n| `ps` | 获取许多程序的 ID\
  \ ；通常你会看到它被用作 `ps aux`。 |\n| `pstree` | 显示程序之间的关系。 |\n| `renice` | 更改程序的 CPU 使用优先级。\
  \ |\n| `top` | 显示随时间变化的资源使用。 |\n\n### 附录 B：关于 DVD\n随书附的 DVD-ROM 包含了安装和运行 Ubuntu\
  \ 9.04 工作站或 Fedora 11 所需的一切。这等同于从 Ubuntu 网站下载的 LiveCD，或从 Fedora 项目网站下载的完整安装 DVD-ROM。该\
  \ DVD 包含以下内容：\n\n**Ubuntu Linux 工作站 LiveCD：** 一个包含常用工作站应用程序的 Linux 发行版。你可以使用 LiveCD\
  \ 直接从 PC 的 CD-ROM 驱动器启动以测试 Ubuntu 而无需加载到 PC 中，或者将 Ubuntu 直接加载到你的硬盘上。\n\n\n\n\n\n\
  # Fedora 完整版安装 DVD-ROM\n\n这是一个包含了几乎所有可用 Linux 程序的 Linux 发行版。由于它是安装 DVD-ROM，你无法直接从\
  \ DVD-ROM 设备上运行此发行版。当你从 Fedora 完整安装 DVD-ROM 启动时，它会自动启动 Fedora 安装程序，将 Fedora 安装到你的硬盘上。如果你不想替换现有的工作站操作系统，请勿使用此功能。\n\
  \n✓ **KDE (K 桌面环境)** 和 **GNOME (GNU 网络对象模型环境)：** Linux 两个领先的图形用户界面。Ubuntu 使用 GNOME\
  \ 桌面，但在 Fedora 安装中，你可以选择你最喜欢的一个！\n\n✓ **Mozilla Firefox：** 为你的 Linux 准备的顶级浏览器，正等待你尽情畅游。\n\
  \n✓ **Samba：** 将 Linux 服务器与 Windows 用户集的最佳方式。Samba 让你的 Linux 机器伪装成 Windows 服务器，以便\
  \ Windows 用户可以无压力地获取文件和打印文档。\n\n✓ **游戏！：** 海量的游戏；足够让你拖延几周时间了！\n\n✓ **OpenOffice.org：**\
  \ 一个功能全且流行的办公套件。\n\n## 第六部分：附录\n\n如果你没有 DVD-ROM 驱动器，你有几个选择：\n\n✓ 如果你想尝试 Ubuntu，可以去\
  \ Ubuntu 网站 (www.ubuntu.com) 下载 LiveCD 并自行进行刻录（如第 3 节所述）。\n\n✓ 如果你想安装完整的 Fedora\
  \ 系统，你必须前往 Fedora 项目网站 (http://fedoraproject.org) 下载 Fedora 11 的 CD 镜像并自行刻录。这需要下载大量数据，所以这可能不是你的首选。\n\
  \n✓ 去 Fedora 网站下载 Fedora LiveCD 镜像，它并不能给你提供一个可以永久安装在电脑上的完整版本，而是一张你可以直接启动 Linux 而无需安装的单\
  \ CD。\n\n✓ 去像 CheapBytes (www.cheapbytes.com) 这样的网站订购大约 10 美元的 Ubuntu 或 Fedora CD\
  \ —— 我们无法预测他们的收费情况，所以如果我们说错了，请不要怪我们。\n\n如果你下载了 CD 镜像进行刻录，请确保你告诉你的 CD 刻录机你正在处理 `ISO`\
  \ 镜像（通常该选项与“image”一词有关）。如果你刻录了 CD 发现它只包含一个大文件（`ISO` 文件），那么它是无法工作的。`ISO` 镜像实际上包含了\
  \ CD 上的所有文件，所以如果你把 CD 放入后发现它包含许多文件，则说明 CD 创建得正确。\n\n## 系统要求\n\n确保你的电脑符合以下最低系统要求。如果你的电脑不符合这些大部分要求，在你在使用\
  \ DVD-ROM 的内容时可能会遇到问题：\n\n✓ **配备 Intel 兼容奔腾腾级处理器的 PC：** 我们建议使用图形模式使用 400 MHz 的奔腾\
  \ IV 或更高处理器，尽管对于频繁使用的桌面系统，“越大越好”。\n\n✓ **至少 256MB RAM：** 图形模式至少需要 192MB RAM。（Linux\
  \ 可以处理任何你能够装进典型电脑的内存，而且内存几乎总是比少要好。）\n\n✓ **至少 1GB 硬盘空间：** 如果你想安装 DVD 上的所有软件，我们建议准备\
  \ 10GB。如果你不安装每个程序，需要的空间会更少，但你应该还是留出超过 10GB 的空间，给自己提供更多选择和文件存储空间。再次，越大越好。\n\n✓ **DVD-ROM\
  \ 驱动器 — 双倍速 (2x) 或更快：** DVD-ROM 驱动器越快，你的安装体验越快。\n\n### 附录 B：关于 DVD\n\n✓ **几乎任何 VGA\
  \ 显示器：** 几乎任何显示器都可以用，但你需要一个能够至少显示 256 色或灰色的显示器。\n\n✓ **某种网络连接：** 同样，你的互联网连接越快，更新安装到最新版本的时间就越短。请参第\
  \ 9 节关于连接互联网的不同方法。\n\n如果你需要更多关于 PC 基本的信息，请查看 Dan Gookin 写的 *PCs For Dummies》（由 Wiley\
  \ Publishing 出版）。\n\n## 使用 DVD-ROM\n\n书中附的 DVD-ROM 不能启动。为了在同一张 DVD-ROM 上包含 Ubuntu\
  \ 和 Fedora，我们创建了两个 ISO 镜像：\n\n✓ **ubuntu-9.04-desktop-i386.iso：** 32 位 Ubuntu 9.04\
  \ 工作站 LiveCD 镜像。\n\n✓ **Fedora-11-i386-DVD.iso：** 32 位完整 Fedora 11 安装 DVD-ROM 镜像。\n\
  \n你需要在电脑上安装 CD/DVD-ROM 刻录机来创建可启动的 Ubuntu CD-ROM 或可启动的 Fedora DVD-ROM。按照以下步骤创建用于使用的相应\
  \ CD-ROM 或 DVD-ROM：\n\n1. **将 DVD-ROM 插入电脑的 DVD-ROM 播放器。**\n2. **打开你操作系统的文件管理器（例如\
  \ Windows XP 或 Vista 的 Windows 资源管理器、GNOME 桌面的 `Nautilus` 或 KDE 桌面的 `Dolphin`）。**\n\
  3. **将相应的 `ISO` 镜像文件从 DVD-ROM 拷贝到硬盘。** 即使你的电脑有两个 DVD-ROM 驱动器，你也无法直接从 DVD-ROM 刻录镜像文件。\n\
  4. **打开支持刻录 `ISO` 镜像的 DVD-ROM 创建程序。** 某些免费的 CD 刻录软件不支持刻录 `ISO` 镜像。对于 Windows 环境，一个流行的免费包是\
  \ `iso recorder` 包 (http://isorecorder.alexfeinman.com/isorecorder.htm)。\n5. **选择刻录\
  \ DVD-ROM（或用于 Ubuntu LiveCD 的 CD-ROM）选项。** 注意不要仅仅将文件复制到 CD-ROM 或 DVD-ROM。确保你选择了刻录镜像的选项。\n\
  6. **将空白的 CD-ROM 或 DVD-ROM 插入刻录机，并开始刻录过程。**\n\n完成后，查看 CD/DVD-ROM 上的文件。它应该包含几个文件夹和文件，而不是一个\
  \ `.iso` 镜像文件。\n\n准备好安装 Linux 时，将 CD/DVD-ROM 光盘放入 CD/DVD-ROM 驱动器，然后重启电脑。你可能需要选择\
  \ BIOS 选项，或在系统期间按键启用从 CD/DVD-ROM 启动。\n\n## 如果遇到问题（关于 DVD-ROM 的）\n\n书中提供的 DVD-ROM\
  \ 两个 ISO 文件 —— 一个用于 Ubuntu LiveCD，另一个用于完整的 Fedora 安装 DVD-ROM。当你将 DVD-ROM 放入 DVD-ROM\
  \ 驱动器时，它应该出现在你的文件管理器中，你应该能在上面看到这两个文件。\n\n✓ **磁盘空间：** Fedora Fedora 安装 DVD-ROM 镜像很大（这是一个完整的\
  \ DVD-ROM 镜像）。在拷贝之前，确保你的硬盘上有足够的空间（接近 4GB）。\n\n✓ **DVD-ROM 速度：** 如果你使用的是旧的 DVD-ROM\
  \ 驱动器，将 `ISO` 镜像文件拷贝到硬盘可能需要一些时间。请耐心等待。\n\n如果 DVD-ROM 仍然出现问题，请拨打 Wiley 技术支持电话 1-877-762-2974。美国境外请拨打\
