  \n这真是一个可以用来玩的各种部件集合！你可以通过将它们添加到面板或桌面来尝试，如果发现它们没用，可以轻松地删除它们。\n\n若要添加小部件，只需选择你想要的，然后点击\
  \ `Add Widget` 按钮。大多数小部件提供了一个简单的控制菜单，通过在面板中右键点击小部件或将鼠标指针悬停在桌面上的小部件上来修改其布局和行为。从此菜单，你可以移动小部件、删除小部件，或（对于某些小部件）访问\
  \ `Properties` 对话框进行配置。\n\n### 获取更多小部件\n\n除了所有标准小部件外，你还可以下载更多。点击 `Add Widgets` 对话框中的\
  \ `Install New Widgets` 按钮可以找到这两个选项：\n\n- **Download New Plasma Widgets (下载新的 Plasma\
  \ 小部件):** 浏览在线仓库寻找新的部件包。\n- **Install Widget from Local File (从本地文件安装小部件):** 浏览工作站上的某个位置以安装新的部件包。\n\
  \n如果你的工作站连接了互联网（见第 8 章），请按照以下步骤从互联网安装新小部件：\n\n1. 从 `Install New Widgets` 按钮选择 `New\
  \ Plasma Widgets` 选项。\n2. 点击你想使用的的小部件的 `Install` 按钮。\n3. 点击 `Close` 按钮关闭 `Add-On\
  \ Installer`。\n4. 从 `Add Widgets` 对话框中选择新小部件。\n5. 点击 `Add Widget` 按钮将新小部件添加到桌面或面板。\n\
  \n![Image 35](img/index-95.jpg)\n**图 5-5:** Plasma 桌面插件安装程序 —— 小部件宝殿的大门。\n\n####\
  \ 调整桌面设置\n\n在 KDE 中，你可以根据喜好配置桌面的几乎每一个功能。`System Settings`（系统设置）工具提供了快速访问所有配置所需的界面。\n\
  \n你从 KDE 的 `KickOff` 菜单启动 `System Settings` 工具。\n\n在 Ubuntu 中，选择 `Computer`➪`System\
  \ Settings`。在 Fedora 中，选择 `Favorites`➪`System Settings`。出现主 `System Settings` 对话框（如图\
  \ 5-6 所示）。\n\n对话框包含两个标签页：\n\n- **General (通用):** 访问桌面大部分常用功能。\n- **Advanced (高级):**\
  \ 为更高级的用户提供一些额外功能，例如为文件扩展名设置程序、管理服务和管理会话。\n\n`General` 标签页包含你最想调整的功能。它由四个设置部分（或组）组成：\n\
  \n- Look & Feel（外观）\n- Personal（个人设置）\n- Network & Connectivity（网络与连接）\n- Computer\
  \ Administration（计算机管理）\n\n![Image 37](img/index-113.jpg)\n**图 5-6:** KDE 系统设置。\n\
  \n\n\n\n\n# 对话框\n\n## 外观与布局 (Look & Feel)\n\n外观与布局部分包含用于定义 KDE 桌面外观及其行为的工具。外观与布局工具包括：\n\
  \n- **外观 (Appearance)：** 此工具控制你的桌面及其包含元素的整体外观。它由七个可以自定义的不同功能组成：\n    - `Style`：窗口和窗口元素的整体样式。它包含了多种供选择的预定义样式。\n\
  \    - `Colors`：定义窗口中使用的颜色方案。\n    - `图标 (Icons)`：定义在桌面上使用的图标类型。\n    - `字体 (Fonts)`：选择用于窗口元素文本的字体。\n\
  \    - `窗口 (Windows)`：从一组预定义的窗口样式中选择。\n    - `启动屏幕 (Splash Screen)`：选择 KDE 启动时显示的屏幕。\n\
  \    - `表情符号 (Emoticons)`：KDE 允许你定义文本序列来生成有趣的图标（如笑脸和哭脸），你可以在文档中使用这些图标。\n\n- **桌面\
  \ (Desktop)：** 此工具控制你工作站的桌面环境。它由四个可以自定义的不同功能组成：\n    - `桌面特效 (Desktop Effects)`：如果你的工作站配备了高级显卡，你可以开启酷的桌面特效，如窗口融化、阴影、放大镜，甚至在桌面上下雪！\n\
  \    - `多桌面 (Multiple Desktops)`：定义多个桌面，或创建虚拟桌面以便更容易地管理应用程序。\n    - `屏幕保护程序 (Screen\
  \ Saver)`：当工作站空闲超过预设时间时选择使用的屏幕保护程序。\n    - `启动反馈 (Launch Feedback)`：设置特效告知你 KDE\
  \ 正在处理启动应用程序请求，例如跳动的光标。\n\n- **通知 (Notifications)：** 此工具允许你设置 KDE 如何通知你系统事件，例如错误、错误的按键输入或错误的鼠标点击。它包含两个可以自定义的功能：\n\
  \    - `系统通知 (System Notifications)`：为 KDE 应用程序特定操作设置不同的音效。\n    - `系统提示音 (System\
  \ Bell)`：选择自定义并播放蜂鸣声，而不是特定的通知音。\n\n- **窗口行为 (Window Behavior)：** 此工具定义了应用程序窗口在桌面上的交互作用方式。它有两个可配置的功能：\n\
  \    - `窗口行为 (Window Behavior)`：使用此项设置桌面上所有窗口的窗口操作。例如，你可以指定如何聚焦活动应用程序窗口、窗口中鼠标右键、中键和左键的功能，以及如何在桌面上移动窗口。\n\
  \    - `特定窗口 (Window-Specific)`：使用此项为特定应用程序定义窗口操作。\n\n外观与布局设置提供了大量功能供你自定义桌面环境。如果你不打算花好几个小时让你的桌面变得“恰到好处”，不用担心，大多数\
  \ Linux 发行版使用的默认设置也运行良好。\n\n## 个人设置 (Personal)\n\n个人设置允许你通过你喜喜功能来个性化桌面，或者为具有特殊需求的用户提供与桌面文件、文件夹和应用程序交互的实用方法：\n\
  \n- **关于我 (About Me)：**设置你的用户账户功能，如名称、电子邮件地址和主目录位置。这还提供了更改密码的快捷方式。\n- **辅助功能 (Accessibility)：**提供键盘和声音功能的设置，以适应特殊需求。\n\
  - **默认应用程序 (Default Applications)：**设置电子邮件、文本编辑器、即时消息、终端模拟器和网络浏览使用的默认应用程序。\n- **区域与语言\
  \ (Regional & Language)：**设置你在桌面会话中首选的默认语言和键盘布局。\n\n通过个人设置，你可以自定义桌面环境，让它感觉像家一样！\n\
  \n## 网络与连接 (Network & Connectivity)\n\n网络与连接部分仅包含两个工具：\n\n- **网络设置 (Network Settings)：**\
  \ 这有点误导性，因为该工具并不真正控制你的网络连接如何配置（请阅第 8 章）。相反，它提供了一个地方让你定义网络上的任何默认网络代理服务器（例如 Web 代理主机——更多信息请见第\
  \ 8 章），并允许你针对特定的网络环境调整连接超时值。\n- **共享 (Sharing)：** 设置 Microsoft Windows 用户名和密码用于连接网络上的远程\
  \ Windows 共享（更多信息请见第 7 章）。\n\n如果你的工作站位于公司网络，在使用其中任何工具之前，你可能需要咨询你的网络管理员。\n\n## 计算机管理\
  \ (Computer Administration)\n\n计算机管理部分提供了你可以用于配置系统设置的工具。表 5-6 列出了此处可用的工具。\n\n###\
  \ 表 5-6：计算机管理工具\n\n| 工具 | 用途 |\n| :--- | :--- |\n| 添加和删除 (Add and Remove) | 在 Fedora\
  \ 中，提供了一个界面用于添加新软件软件包、选择软件更新存储库以及配置在 `PackageKit` 包管理器中使用的设置（见第 16 章）。 |\n| 日期与时间\
  \ (Date & Time) | 设置工作站的日期和时间。 |\n| 显示 (Display) | 设置分辨率；在此还可以实施任何节能功能，例如超时后关闭显示器。\
  \ |\n| 字体安装器 (Font Installer) | 为你的 KDE 应用安装新字体。 |\n| 输入操作 (Input Actions) | 为特定功能定义组合键（称为\
  \ `hotkeys`）。 |\n| 键盘与鼠标 (Keyboard & Mouse) | 设置基础键盘鼠标功能。 |\n| 多媒体 (Multimedia)\
  \ | 设置各种桌面程序的音频视频程序。 |\n\n## 第二部分：快速上手 Linux (Getting Up to Speed with Linux)\n\n\
  在这一部分，你将了解到许多 Linux 基础知识。你将探索 Linux 文件系统的各个角落，找出内容存储在何处。然后你将学习如何使用桌面提供的图形化工具在其中穿行并管理文件。最后，如果你还没有连接上网，你将体验连接互联网的乐趣。\n\
  \n## 第 6 章：认识 Linux 文件系统 (Getting to Know the Linux Filesystem)\n\n### 本章内容\n- 熟悉文件系统环境\n\
  - 向文件系统添加可移动介质\n- 理解文件系统权限\n\n*我有一张生存地图。上面到处写着“你在这里”。* —— 史蒂芬·莱特\n\n掌握新操作系统最令人沮丧的事情之一就是找出它把文件存在哪里。Linux\
  \ 并没有将所有重要的系统文件放在单个目录下（例如 Microsoft Windows 中的 `C:\\Windows` 目录），而是遵循了它的 UNIX 兄弟们的做法，将内容分布得更分散。虽然\
  \ Linux 和 Windows 的设置涉及不同的方法，但它们都是符合逻辑的，尽管在你掌握去哪里查看之前，可能并没这种感觉。\n\n### 整合拼图碎片 (Putting\
  \ Together the Pieces of the Puzzle)\n\n在开始之前理解术语会有帮助。许多内容你可能在其他操作系统（如 Microsoft\
  \ Windows）中已经熟悉，但你需要习惯一些差异。首先，`filesystem`（文件系统）一词有多种用法。通用用法（以及我们在书中通常指代的）意思是“你现在可以访问的文件和目录（文件夹）”，而不是指硬盘上存储数据的方法（例如第\
  \ 3 章中讨论的 `ext3` 文件系统）。\n\n关于文件系统，你需要了解以下内容：\n\n- **Linux 在目录之间使用正斜杠 (`/`)，而不是 Windows\
  \ 使用的反斜杠 (`\\`)。** 因此，目录 `etc` 下的文件 `yum.conf` 应该是 `etc/yum.conf`。\n\n\n\n\n文件和目录的名称长度可达\
  \ 256 个字符，这些名称可以在任何位置包含下划线（`_`）、破折号（`-`）和点（`.`）。因此，`my.big.file`、`my.big_file` 或\
  \ `my-big-file`都是都是文件名。\n\n✓ 大写敏感。它们必须完全匹配。对于 Linux 来说，`yum.conf` 和 `Yum.conf` 文件是不相同的。\n\
  \nLinux 是区分大小写的——它会区分每个字符的大小写。\n\n相反，Windows 是不区分大小写的。\n\n✓ 同一个文件系统可以跨越多个分区、硬盘和介质（如\
  \ CD-ROM 驱动器）。你只需要一直进入子目录，而无需担心东西是在磁盘 A、B 还是其他地方。\n\n### 游览 Linux 文件系统\n\n这一节中，我们将查看典型\
  \ Linux 文件系统的内容。至少熟悉一点有助于你日后追踪问题，而且熟悉程度将帮助你了解哪些地方可以安全操作，而哪些地方需要非常小心。\n\n## 树的根节点\n\
  \nLinux 文件系统中的一切都相对于根目录——不要将其与系统管理员（root 用户）混淆。根目录被称为 `/`，它是文件系统的大营——通往你所有文件的入口。因此，它包含了一组相对可预测的子目录。每个发行版在根目录中存放的内容上略有不同，但所有\
  \ Linux 变体都遵循某些特定标准。\n\n这些标准让 Linux 世界保持某种理智。\n\n如果你对这些标准感兴趣，请访问 `www.pathname.com/fhs`\
  \ 查看规则的最新版本。\n\n表 6-1 列出了你可以在 Linux 基础目录（即 `/`）中可能发现的内容。此列表可能会根据你安装了什么而有所不同。描述末尾的星号（`*`）表示，除非你有充分的理由，否则你不应该动这个目录，因为它包含了对你系统运行非常重要的文件。实际上，大多数基础目录都应该保持原样。它们内部某些区域是可以安全更改的，但在那里翻找之前，你必须确切知道自己在找什么。\n\
  \n### 表 6-1：Linux 标准根目录内容\n\n| 目录 | 内容 |\n| :--- | :--- |\n| `/bin` | 每个人任何时候都需要使用的基本命令。*\
  \ |\n| `/boot` | 引导机器的信息，包括你的内核。* |\n| `/dev` | 系统需要交互的所有硬件的设备驱动程序。* |\n| `/etc`\
  \ | 你的系统的配置文件。* |\n| `/home` | 每个每个用户的家目录。 |\n| `/lib` | 许多程序（以及内核）使用的库或代码。* |\n\
  | `/media` | 你添加临时介质（如软盘和 CD-ROM）的地方；但并非所有发行版都有这个目录。 |\n| `/mnt` | 添加额外文件系统组件的地方，例如网络驱动器和那些你不会永久添加到文件系统、但又没像\
  \ CD-ROM 和软盘那样临时的项。 |\n| `/opt` | 一些人决定使用（某些程序也想使用）来安装新软件包的位置，例如文字处理器和办公套件。 |\n\
  | `/proc` | 你的内核（操作系统）的当前设置。* |\n| `/root` | 超级用户（root 用户）的家目录。 |\n| `/sbin` | 系统管理员需要访问的命令。*\
  \ |\n| `/srv` | 你的系统服务（后台运行的程序）的数据。* |\n| `/sys` | 关于你硬件的内核信息。* |\n| `/tmp` | 所有人和一切存储临时文件的地方。\
  \ |\n| `/usr` | 一个包含额外程序和文件的复杂层次结构。 |\n| `/var` | 经常变化的数据，如日志文件和你的邮件。 |\n\n这些目录中的某些具有同样重要的子目录，我们将在接下来的章节中介绍它们。\n\
  \n## /etc 的重要性\n\n`/etc` 基础目录主要包含配置文件。除非你清楚自己在做什么，否则最好不要动这些文件。一些重要的目录（取决于你安装了什么）包括以下这些目：\n\
  \n✓ 以 `/etc/cron` 开头的目录包含用于在自动时间运行的各种程序的指令。\n\n✓ `/etc/cups` 目录包含你打印机的配置信息。\n\n\
  ✓ 以 `/etc/rc` 开头的目录都包含关于启动和关机时哪些启动、哪些不启动的数据。这些目录存储了服务运行的脚本。\n\n✓ `/etc/sysconfig`\
  \ 目录具有网络配置信息。\n\n✓ `/etc/samba` 目录包含用于与 Microsoft Windows 服务器通信的 Samba 软件的配置文件（见第\
  \ 20 章）。\n\n✓ `/etc/X11` 目录包含 X Window 系统（X）的配置细节，它运行你的图形用户界面（GUI）。关于 GUI 的更多信息请参阅第\
  \ 4 和第 5 章。\n\n✓ `/etc/opt` 目录包含 `/opt` 目录中程序的配置文件（如果你决定它的话）。\n\n## 临时介质所在地\n\n\
  默认情况下，你在 `/media` 或 `/mnt` 中可能存在某些子目录。但通常，你可以寻找以下内容：\n\n✓ `/media/floppy` 目录用于向你的文件系统添加软盘——与其看到\
  \ \"floppy\" 这个词，你可能会看到 `fd0` 或 `floppy0`。\n\n✓ `/media/sdb`（或 `/media/sdc`、`/media/sdd`\
  \ 等）目录在你将 USB 闪盘插入工作站时使用。\n\n✓ `/media/cdrom`（或 `/media/dvd`、`/media/cdrecorder`\
  \ 等，取决于你的硬件类型）目录用于将 CD-ROM、DVD-ROM、CD 刻录机等添加到你的系统中。\n\n在第 7 章中，你将学会如何以方便的点点点击方式来实现。\n\
  \n## 计算机所在的 /usr\n\n`/usr` 目录通常被称为它自己的微型文件系统树。该目录有许多重要或有趣的子目录，如表 6-2 所示。描述末尾的星号（`*`）表示你需要保持该目录原样，除非你有理由去动它——即在你获得了大量\
  \ Linux 经验并确切知道需要进行哪些更改之后——这样你就不会意外更改系统正常运行所需的内容。关于文件系统的这部分一个有趣的记忆点是，许多高级 Linux\
  \ 用户经常使用 `/usr` 来存储可以与其他 Linux 机器共享的程序。\n\n### 表 6-2：标准 /usr 子目录\n\n| 子目录 | 内容 |\n\
  | :--- | :--- |\n| `/usr/X11R6` | 管理 X Window 系统（你 GUI 下方的线框图）的文件。* |\n| `/usr/bin`\
  \ | 对用户并非必不可但很有用的命令。* |\n| `/usr/games` | 你安装在系统上的游戏，你选择放置在 `/opt` 中的除外。 |\n| `/usr/include`\
  \ | C 语言对于系统及其程序所需的文件。* |\n| `/usr/lib` | `/usr` 子层次结构中许多程序使用的共享代码。* |\n| `/usr/local`\
  \ | 你想要本地保留的程序和其他项，即使你正在共享 `/usr` 中的其他所有内容。 |\n| `/usr/sbin` | 对管理员并非必不可但很有用的命令。*\
  \ |\n| `/usr/share` | 你可以在任何 Linux 机器上使用的信息，即使它运行着完全不同的硬件。 |\n\n### 在没有网络（或鼠标）的情况下管理你的文件系统\n\
  \n第 7 章涵盖了如何使用点点点击的文件管理器。这一节中，我们将查看如何使用命令行工具在文件系统中穿行。了解如何使用命令行对你来说至关重要，但它某天可能会证明非常有用！\n\
  \n\n\n\n在第 17 章中，我们将详细介绍如何使用 `Terminal` 程序（GNOME 桌面环境中）和 `Konsole` 程序（KDE 桌面环境中）从桌面访问命令行。你可以在桌面菜单中找到这些程序。\n\
  \n#### 在命令行中查看文件信息\n\n正如你将在第 17 章中看到的，`ls` 命令允许你查看文件和目录。单运行该命令，它就会显示你请求的非隐藏文件和目录名称。例如，如果你在\
  \ `/etc` 目录下并输入 `ls`，可能会看到图 6-1 所示的内容。\n\n**图 6-1：**\n在 `/etc` 下执行 `ls` 命令的输出。\n\
  \n当你使用此版本的命令时，显示的颜色会了关于你正在查看的项目类型的信息：\n\n| 文本颜色 | 通常含义 |\n| :--- | :--- |\n| 黑色\
  \ | 普通文件，不匹配任何需要颜色的特殊类型。 |\n| 红色 | *存档*或*包*（参见第 16 章）。 |\n| 粉色 | 图像文件（如果识别文件扩展名，如\
  \ `.jpg`、`.tif` 和 `.gif`）。有时粉色也用于另一种类型的特殊文件，但它是高度专门化的，你不需要担心。如果你在文件名上没有看到图像扩展名但看到了粉色文件，直接忽略即可。\
  \ |\n\n![Image 40](img/index-126_1.jpg)\n\n| 文本颜色 | 通常含义 |\n| :--- | :--- |\n| 深蓝色\
  \ | 目录。 |\n| 浅蓝色 | *软链接*。 |\n| 绿色 | Linux 中的程序（称为*可执行文件*）。 |\n| 红色背景的灰色文字 | *SetUID*\
  \ (*SUID*) 可执行文件，运行时它会使用不同的用户账户。 |\n| 橙色背景的深色文字 | SetGID (SGID) 可执行文件，运行时它会使用不同的组账户。\
  \ |\n| 红色背景的白色文字 | *损坏的链接*文件。 |\n| 黑色背景的黄色文字 | *设备*文件（基本上用于与硬件——如你的显示器——通信的文件）。\
  \ |\n| 绿色背景的黑色文字 | 目录，你只能删除或更改你拥有或*写入权限*的文件（更多信息请参阅本章后面的“理解文件列表信息”部分）。 |\n\n`ls`\
  \ 命令显示请求位置的所有内容，但*隐藏文件*除外，隐藏文件以点开头。要查看隐藏文件，输入 `ls -a`，即可如图 6-2 所示的结果。\n\n**图 6-2：**\
  \ 仅使用 `ls` 的全新主目录，然后再次使用 `ls -a` 以看到隐藏文件。\n\n在你的主目录下，有很多文件以点开头。允许你自定义功能的应用程序会将这些设置存储在主目录的隐藏文件中。\n\
  \n![Image 41](img/index-127_1.jpg)\n\n---\n\n#### 理解文件列表信息\n\n为了看到比名称和模糊类型更详细的信息，你将需要一个长格式的文件列表。\n\
  \n要仅查看非隐藏文件，输入 `ls -l`。要同时查看隐藏和非隐藏文件，输入 `ls -la`。图 6-3 显示了一个示例。\n\n**图 6-3：**\n\
  全新主目录的开头，以长格式显示了隐藏和非隐藏文件。\n\n你可能会发现这种格式的某些部分比其他部分更容易一眼看出：\n\n*   每个列表中的第一个项（带有字母和连字符的部分——例如第一行的\
  \ `drwx------`）是分配给该项目的*权限集*。权限定义了谁可以读取文件、更改它，或者如果它是一个程序时可以运行它。\n*   第一行的第二个项（在此情况下为\
  \ 30）是指向该项目的硬链接数。\n*   第三个项（`rich`）是文件的*所有者*。\n*   第四个（`rich`）是文件所属的*组*。\n*   第五个项是按字节计算的文件大小。所有目录都显示为\
  \ 4,096 字节。其他所有都有自己的大小。你可以通过其大小为 0 字节来判断这是一个空文件。\n*   第六和第七个条目与文件最后修改的日期和时间有关：YYYY-MM-DD\
  \ 格式的日期，以及 24 小时格式的时间（17:22）。\n*   第九个项是文件名（例如第三行中的 `bash history`）。\n\nLinux 在你的文件列表列表中使用了两个特殊文件。单点（`.`）文件代表当前目录，而双点（`..`）文件代表父目录。当你从命令行在系统中移动时，可以使用这些目录别名。\n\
  \n### 权限基础\n\n如果你在查看该长格式文件列表的部分时感到困惑，不要担心。第一个字母后的九个字符是该文件或目录的*权限*（也称为*权限集*）。Linux、UNIX\
  \ 甚至 Mac OS X 都使用权限作为提供文件和目录安全的一种手段，让你能够精确地指定谁可以查看你的文件，谁可以更改它们，甚至谁可以运行你的程序。当你同一台机器上有许多不同的用户，并连接到世界网络时，你需要这种能力。\n\
  \n### 检查三元组\n\n每个权限集由三个三元组组成。每个三元组具有相同的基本结构，但控制着关于谁可以使用什么的不同方面。\n\n请考虑以下代码中 `/home/dee`\
  \ 的长格式列表：\n\n```bash\nrich@testbox:~$ ls -al\ntotal 2480\ndrwxr-xr-x 30 rich rich\
  \ 4096 2009-05-16 13:58 .\ndrwxr-xr-x 3 root root 4096 2009-05-16 09:04 ..\n-rw-r--r--\
  \ 1 rich rich 220 2009-05-16 09:04 .bash_logout\n-rw-r--r-- 1 rich rich 3115 2009-05-16\
  \ 09:04 .bashrc\ndrwxr-xr-x 2 rich rich 4096 2009-05-16 09:20 .cache\ndrwxr-xr-x\
  \ 4 rich rich 4096 2009-05-16 09:23 .config\ndrwxr-xr-x 2 rich rich 4096 2009-05-16\
  \ 09:20 Desktop\n```\n\n权限集中的第一个字符指的是文件类型。对于目录，字符显示为 `d`，如上述列表前两个项所示；文件用连字符 `-`\
  \ 表示。每个文件或目录的权限集都是九个字符——即跟随第一个字符的九个字符（总共十个）。但这九个字符实际上是三个三个一组，如图 6-4 所示。\n\n**图 6-4：**\n\
  九个权限字符的分解。\n\n三个三元组的读取方式如下：\n\n*   第一个三元组由长格式文件列表中的第二、第三和第四字符组成。这个三元组为文件的*用户*或*所有者*设置权限。\n\
  *   第二个三元组由长格式文件列表中的第五、第六和第七字符组成。这个三元组为分配给文件的*组*设置权限。\n*   第三个三元组由长格式文件列表中的第八、第九和第十字符组成。这个三元组为*其他*或所有不是文件所有者或所属组成员的人设置权限。\n\
  \n虽然每个三元组通常与其他不同，但每个三元组的内部结构是以相同的方式组成的。在查看整个三元组集合之前，专门关注如何读取一个三元组。每个三元组包含三个字符：\n\
  \n\n\n\n第一个字符是 `r` 或连字符 `-`。`r` 代表 `read`（读取）权限。如果设置了 `r`，该三元组允许其代表的实体（用户、组或其他用户）查看目录或文件的内容。\n\
  \n第二个字符是 `w` 或连字符 `-`。`w` 代表 `write`（写入）权限。如果设置了 `w`，该三元组允许其代表的实体在此目录或文件中添加、删除或编辑项目。\n\
  \n# 第 6 章：认识 Linux 文件系统\n\n第三个字符是 `x` 或连字符 `-`。`x` 代表 `execute`（执行）权限。如果设置了 `x`，该三元组允许其代表的实体访问该目录包含的文件或运行文件中的特定程序。\n\
  \n在所有情况下，如果用连字符代替 `r`、`w` 或 `x`，则该三元组就不允许实体拥有读取、写入或执行权限。\n\n接下来的章节将详细介绍所有者和组。\n\n\
  ## 注意所有者\n\n你可能已经注意到，我们在 Linux 中大量讨论了所有者（用户）和组。每个文件和目录都包含这两个组件：一个来自 `/etc/passwd`\
  \ 文件并分配为所有者的用户，以及一个来自 `/etc/group`并分配为组的组。\n\n尽管普通用户可能不需要频繁更改文件所有权，但 root 用户经常这样做。例如，当你以\
  \ `superuser`（管理员的另一个术语，即 root 账户的所有者）登录时，将文件注释添加到 `/home/tom`，那么 root 用户就拥有该文件。用户\
  \ `tom` 对其进行任何操作，除非文件的所有者（`root`）将最后一个三元组的权限设置为允许 `other` 用户（即不是文件所有者也不在指定组中的）对文件进行读取和写入。但这种方法处理问题非常粗糙，因为权限的核心思想是减少访问，而不是给所有人访问权限。\n\
  \n相反，请记住将文件的所有者改为用户 `tom`。你可以通过 `chown`（更改所有者）命令来实现此。例如，通过输入 `chown mike comments`，rich\
  \ 将所有权更改给了 `mike`。然后 `mike` 就可以处理这个文件，甚至将其权限更改为他喜欢的设置：\n\n```bash\nrich@testbox:~$\
  \ ls -al comments\n-rw-r--r-- 1 rich rich 5 2009-05-16 14:25 comments\n\nrich@testbox:~$\
  \ sudo chown mike comments\n[sudo] password for rich:\n\nrich@testbox:~$ ls -al\
  \ comments\n-rw-r--r-- 1 mike rich 5 2009-05-16 14:25 comments\nrich@testbox:~$\n\
  ```\n\n## 在组中活跃\n\n组比所有者更有趣。你使用组是为了允许 root 用户赋予多个用户共享某些文件系统区域的能力。例如，在许多 Linux 版本中，所有用户都被添加到一个名为\
  \ `users` 的组（例如 openSuSE 就是这样做的）。这时，而不是本章之前显示的长格式文件列表，你可能会看到以下：\n\n```bash\nrich@testbox:~$\
  \ ls -al\ntotal 2480\ndrwxr-xr-x 30 rich users 4096 2009-05-16 13:58 .\ndrwxr-xr-x\
  \ 0 root root 4096 2009-05-16 09:04 ..\n-rw-r--r-- 1 rich users 220 2009-05-16 09:04\
  \ .bash_logout\n-rw-r--r-- 1 rich users 3115 2009-05-16 09:04 .bashrc\ndrwxr-xr-x\
  \ 2 rich users 4096 2009-05-16 09:20 .cache\ndrwxr-xr-x 4 rich users 4096 2009-05-16\
  \ 09:23 .config\ndrwx------ 3 rich users 4096 2009-05-16 09:20 .dbus\ndrwxr-xr-x\
  \ 2 rich users 4096 2009-05-16 09:20 Desktop\n```\n\n如果所有用户都是同一个组的成员，且每个文件属于该组，那么每个用户都拥有这些文件的组权限。\n\
  \n在其他发行版（如 Fedora 和 Ubuntu）中，为每个用户都创建一个唯一的组，这就是为什么早期的列表显示所有者和组项是相同的（`rich rich`）。\n\
  \n### 第 7 章：使用文件系统\n\n## 本章内容\n- 使用 Nautilus 航行文件系统\n- 使用 Dolphin 穿行\n- 看看 Konqueror\n\
  - 使用 CD 和其他可移动介质\n\n*完全不需要做任何家务。过了头年后，脏东西并不会变得更糟。*\n— Quentin Crisp\n\n在第 4 章和第\
  \ 5 章中，我们查看了 GNOME 和 KDE 桌面，并学习了如何使用它们，但刻意跳过了一项技能：处理文件。第 6 章介绍了如何在命令行中操作文件系统以及在何处查找。本章侧重于如何通过点击来浏览目录并轻松地操作文件。\n\
  \n## 选择文件管理器\n\n从图形化桌面管理文件和文件夹的关键是 `file manager`（文件管理器）程序——这是一个良好的图形界面，可以整齐地访问系统上杂乱的文件和文件夹。你不需要在命令行中在一堆混乱中翻找，只需指向点击即可进入受管理的文件系统！\n\
  \n然而，与 Linux 世界的几乎其他所有事物一样，你可以从几个不同的文件管理器程序中选择。你在桌面上使用的程序主要取决于你使用的是哪种桌面。主要成员有：\n\
  \n- **Nautilus:** GNOME 桌面使用的默认文件管理器。\n- **Dolphin:** KDE 桌面使用的新文件管理器。\n- **Konqueror:**\
  \ KDE 桌面使用的旧文件管理器，因其多功能在今天仍然很受欢迎。\n\n当然，仅仅因为文件管理器是桌面的默认值并不意味着你*必须*使用它！在一个 Linux\
  \ 桌面中可用的任何文件管理器在另一个 Linux 桌面中运行良好。事实上，如果你在 Ubuntu 中安装了 KDE 桌面，`Nautilus` 文件管理器仍然保持默认——但你可以使用你喜欢的任何一个。\n\
  \n## 使用 Nautilus 遍历文件夹\n\n在 GNOME 桌面环境中，默认文件管理器是 `Nautilus`。\n\n在 Nautilus 中移动文件系统涉及一些与使用命令行不同的技能。你可能确切知道想去文件系统的哪个位置，但不知道点击什么才能到达那里。首先，你需要知道想从哪里开始。这个决定听起来并没有那么困难。\n\
  \n使用 Nautilus 导航文件系统有两种选择方式：\n\n- **空间模式（Spatial mode）：** 在窗口中显示单个文件夹的内容。如果你双击文件夹，它会打开一个显示该文件夹内容的新窗口，同时保持窗口开启。\n\
  - **浏览器模式（Browser mode）：** 在窗口中显示文件夹内容，并在左侧带有一个导航栏。如果你双击窗口中的文件夹，该将在同一窗口中打开；这就像在\
  \ Web 浏览器中进入新页面一样。你可以在同一个窗口内前后导航文件系统。\n\nUbuntu 配置了 Nautilus 始终以浏览器模式打开。Fedora 对某些项目使用空间模式打开，对另一些项目使用浏览器模式。如果你倾向于其中一种模式而不是另一种，本章将通过展示如何控制打开哪种模式来提供帮助。\n\
  \n通常有几种方法从 GNOME 桌面启动 Nautilus：\n\n- **双击桌面上的主图标：** Fedora（以及许多其他基于 GNOME 的发行版）在默认面上包含主图标。Nautilus\
  \ 将以空间模式打开当前用户的主目录。\n\n\n\n\n# 选择应用程序\n\n**应用程序** ➔ **系统** ➔ **文件浏览器:** 某些 Linux\
  \ 发行版（如 Fedora）在应用程序菜单中包含 Nautilus 作为文件浏览器。选择此选项将以浏览器模式显示 Nautilus，显示为一个双窗窗口，左侧带有来自\
  \ `Places`（位置）的导航选项。（点击 `Places` 下拉列表框查看左窗格中其他可用选项，或点击左窗格顶部的 `X` 关闭它。）您可以随时通过再次使用下拉列表返回\
  \ `Places` 部分。\n\n**选择位置:** 此面板板菜单项为您提供了第 4 节中讨论的选项，让您能够立即打开 Nautilus 并定位到预定义的位置。Ubuntu\
  \ 默认使用浏览器模式，但 Fedora 使用空间模式（如图 7-1 所示）。\n\n无论您如何打开窗口，大部分导航操作都是相同的：\n\n- 要使用一个文件，请双击它。如果系统提示您需要操作说明，请继续阅读本章稍后部分的“打开文件和运行程序”章节。\n\
  - 要在空间模式下打开文件夹，请双击它。将打开一个独立的窗口并显示文件夹的内容，同时保持父文件夹窗口打开状态。\n\n如果您发现打开了太多文件夹，请选择以下命令之一：\n\
  \n- `File`（文件） ➔ `Close Parent Folders`（关闭父文件夹）：关闭所有到达此目录的文件夹。\n- `File`（文件） ➔ `Close\
  \ All Folders`（关闭所有文件夹）：关闭您打开的所有文件浏览器文件夹。\n- `File`（文件） ➔ `Close`（关闭）：仅关闭此文件夹。\n\
  \n要关闭窗口，请选择 `File ➔` 或点击窗口右上角的 `X`。\n\n如果您处于浏览器模式，可以通过此方式导航文件系统：\n\n- 点击左窗格中的 `Places`\
  \ 并从下拉列表框中选择 `Tree`（树状）。\n- 点击右箭头展开文件夹并查看内部的其它文件夹。（`Home Folder` 目录指的是您的账户文件，`File\
  \ System` 文件系统指的是第 6 节中讨论的根目录。）\n- 点击向下的箭头折叠树形部分并清理视图。\n- 点击左侧文件夹本身即可在右侧查看其内容。\n\
  - 双击右侧文件夹将用其内容替换当前视图的内容。注意，顶部没有 `Places` 菜单；相反，它是左窗格中的一个选项。\n\n## 设置在文件夹中看到的详细程度\n\
  \n您获取的每个文件信息是太多还是不够？请尝试 `View`（视图）菜单。`View` 菜单下的主要列表选项包括以下命令：\n\n**View As Icons（以图标显示）:**\
  \ 此默认选项将所有文件显示为图标，下方带有名称；参见图 7-1。\n\n![Image 45](img/index-136_1.jpg)\n\n**View\
  \ As List（以列表显示）:** 此命令为您提供有关文件的信息列表，以及其图标和名称（见图 7-3）。注意，列表左侧仍有小图标可用。\n\n如需 `View\
  \ As List` 模式的更高级设置，请选择 `View ➔ Visible Columns`（显示列）。\n\n**图 7-3:** 在 rich 的主目录中使用“View\
  \ As List”（以列表显示）选项的 Nautilus。\n\n除了这些 `View` 菜单命令外，您还可以使用：\n\n- **Reload（重新加载）:**\
  \ 如果您刚刚创建了一个文件但在文件夹中没有看到，请选择此选项。\n- **Show Hidden Files（显示隐藏文件）:** Linux 中所有以点开头的文件名（例如\
  \ `.profile`）都是隐藏文件——您必须明确告诉 Linux 您想看到它们。\n- **Zoom In, Zoom Out, and Normal Size（放大、缩小和正常尺寸）:**\
  \ 更改文件夹内容的视觉大小。\n- **Reset View to Defaults（重置视图为默认值）:** 从头开始。\n\n## 创建文件和文件夹\n\n\
  在 Nautilus 中创建新文件或文件夹，请遵循以下步骤：\n\n1. **浏览到您想要创建项的文件夹。** 在继续之前，您需要打开该文件夹并进入其窗口。\n\
  2. **右键点击该文件夹内部的空白处。** 确保在点击之前没有高亮文件夹中的任何内容。会出现一个上下文菜单。\n3. **根据您想要实现的目标，选择 Create\
  \ Folder（创建文件夹）或 Create Document（创建文档）。**\n   - `Create Folder` 命令会在该目录下创建一个新的、空文件夹。\n\
  \   - `Create Document` 命令将打开子菜单，让您可以选择从 `Template`（模板，顶部区域，如果您已创建了模板）或从 `Empty\
  \ File`（空文件）创建文档。\n   文件夹或文件将出现，并高亮显示且打开名称以编辑。\n4. **输入您想要分配给文件夹或文件的名称并按回车键。** 名称将分配给该文件夹或文件。\n\
  \n## 打开文件和运行程序\n\n在 Nautilus 中打开文件或运行程序，请双击它。就这样！噢，不完全。您也可以右键点击文件以打开上下文菜单；当它打开时，选择以下选项之一：\n\
  \n- **Open with program（用程序打开）:** 如果文件已关联到特定程序，选择此选项等同于双击文件。如果您的系统知道您安装了多个可以胜任此工作的程序，可能会列出多个选项；带有文件夹图标的顶部项目是默认项。选择您偏好的任何选项即可。\n\
  - **Open with Other Application（用其他应用程序打开）:** 选择此选项将打开一个子菜单，其中包含系统识别的已安装程序列表如果您在里面找到了需要的，可以通过点击\
  \ `Use a Custom Command`（使用自定义命令）选择这些程序之一。在此处您可以：\n   - 输入应用程序的完整路径（完整目录路径，例如 `/usr/bin/konqueror`）。\n\
  \   - 点击 `Browse`（浏览）按钮打开文件浏览器并找到您想要使用的程序。\n\n在选择用于打开文件的程序后，点击 `Open`（打开）继续。\n\n\
  ## 复制和移动文件\n\n可以使用不同的方法在 Nautilus 中复制和移动项。第一种是您可能在 Windows 或 Mac OS 中熟悉的用法——点击并按住文件或文件夹，然后将其拖到您想去的地方。您可以在文件夹窗口之间以及文件夹图标中进行拖放。这里有一些实用技巧：\n\
  \n- 拖动时按住 `Ctrl` 键，这样可以创建一个副本而不只是移动文件。\n- 如果您想将文件拖入文件夹图标中，请在释放鼠标按钮之前确保文件夹图标已高亮。\n\
  - 如果您想将文件拖入文件夹窗口而不是其中某个文件夹图标，请确保在释放鼠标按钮之前文件夹图标*没有*被高亮。\n\n复制和移动文件及目录的另一种方法涉及以下步骤：\n\
  \n1. **右键点击您想要复制或移动的文件或目录。**\n2. **从出现的上下文菜单中，如果您想移动文件，请选择 `Cut`（剪切）；如果您想复制它，请选择\
  \ `Copy`（复制）。在尝试移动文件后文件不会消失。\n3. **导航到您想要将文件移动的文件夹。** 当打开该文件夹窗口时您就就绪了。\n4. **执行以下操作之一：**\n\
  \   - 如果要将文件移动或复制到文件夹窗口，右键点击该窗口（确保没有高亮任何内容）然后选择 `Paste`（粘贴）。\n   - 如果要将文件移动到文件夹图标而不是打开的文件夹窗口，右键点击图标然后选择\
  \ `Paste Into Folder`（粘贴到文件夹）。如果您习惯标准的编辑器快捷键（`Ctrl+C` 复制，`Ctrl+X` 剪切以及 `Ctrl+V`\
  \ 粘贴），这些键在 Nautilus 中同样适用。\n\n## 删除文件和文件夹\n\n要使用 Nautilus 从文件系统删除文件或目录，请遵循以下步骤：\n\
  \n1. **浏览到文件或目录的位置。**\n2. **选择文件或文件夹。** 您可以通过以下方式选择文件或文件夹：\n   - 点击文件或文件夹以将其高亮。\n\
  \n\n\n\n\n-   点击第一个项目，按住 `Shift` 键，然后点击组中的最后一个项目以选择所有项目。（所有这些项目必须相邻排列。）\n-   点击第一个项目，按住\
  \ `Ctrl` 键，然后点击你想要选择的每个单独项目。\n-   点击并拖动鼠标指针，画出一个包含你所有想要选择的项目的框。\n-   3. 按下 `Delete`\
  \ 键，或右键点击并选择 `Move To Trash`（移动到垃圾桶）。\n\n文件或文件夹将从视图中消失。请记住，如果你正在删除一个文件夹，且该文件夹包含其他文件或文件夹，那么文件夹中的所有内容都会连同一起进入\
  \ `Trash`（垃圾桶）。\n\n被删除的项目实际上位于 `Trash` 文件夹中；它们并没有真正从你的硬盘上删除。如果你还没有清空垃圾桶，可以根据需要将这些文件从\
  \ `Trash` 文件夹移动回你的文件文件系统。\n\n## 清倒垃圾桶\n\n你可以通过以下步骤永久删除 `Trash` 文件夹中的内容：\n\n1.  **右键点击\
  \ `Trash` 图标。**\n    此操作将打开一个列有选项的快捷菜单。\n\n2.  **从快捷菜单中选择 `Empty Trash`。**\n   \
  \ 会弹出一个确认对话框。\n\n3.  **在确认对话框中点击 `Empty` 以删除 Trash 文件夹的内容。**\n\n### 第 7 章：使用文件系统\n\
  \nLinux 会永久删除 `Trash` 文件夹中的项目。你可以通过查看 `Trash` 垃圾桶来判断 `Trash` 文件夹是否为空。如果它是空的，里面就没有文件。如果你在里面看到纸张，说明里面有垃圾。\n\
  \n`Trash` 文件夹中的文件和文件夹不会被 Linux 自动清理。你需要自己清理 `Trash` 文件夹，以便从你的工作站中永久删除文件和文件夹。\n\n\
  ### 查看和更改权限\n\n在第 6 章中，你看到 Linux（以及其他形式 UNIX）中的每个文件都有一组 `permissions`（权限），用于规定谁被允许查看、运行、删除它们等。权限非常重要；分配权限是为了确保人们无法破坏系统或他人的文件。在本节中，我们重点关注如何在\
  \ GUI 中管理文件权限。\n\n要在 `Nautilus` 中查看和更改文件或目录的权限，请遵循以下步骤：\n\n1.  **浏览到文件或目录所在的位置。**\n\
  \    打开包含该项目的文件夹窗口即可。\n\n2.  **右键点击文件或目录。**\n    出现一个上下文菜单。\n3.  **从上下文菜单中选择 `Properties`（属性）。**\n\
  \    出现 `Properties` 对话框，并打开 `Basic`（基本）标签页。\n4.  **点击 `Permissions`（权限）标签页。**\n\
  \    显示 `Properties` 对话框的 `Permissions` 部分，如图 7-4 所示。\n5.  **设置新的权限和所有权。**\n   \
  \ 请参考第 6 章详细了解所有这些内容的含义。注意 GUI 将 `Owner`（所有者）、`Group`（组）和 `Others`（其他）分为单独的下拉列表。除非你熟悉\
  \ `SELinux`，否则请不要动 `SELinux Context` 选项。\n6.  **点击 `Close` 关闭对话框。**\n    文件的权限现在已经更改。\n\
  \n这基本上涵盖了你想要在 `Nautilus` 中对文件系统进行的所有操作。\n\n![Image 46](img/index-141_1.jpg)\n\n\
  **图 7-4：** 显示了权限 标签页的 Nautilus 文件管理器属性对话框。\n\n### 在 Dolphin 中游泳\n\n如果你正在使用带有 `KDE`\
  \ 桌面面的新 Linux 发行版，你可能正在使用较新的 `Dolphin` 文件管理器。`Dolphin` 的工作方式类似于 `Nautilus` 的浏览模式，允许你从单个窗口轻松浏览文件系统中的文件夹。\n\
  \n要打开 `Dolphin` 窗口，`KDE` 菜单系统（见第 5 章）在 `Computer` 标签下提供了指向工作站特定位置的链接。你可以查看 Home\
  \ 文件夹、网络上的远程共享文件夹、从根目录开始的整个文件系统（见第 6 章）或特殊的 `Trash` 文件夹。图 7-5 显示了 `Dolphin` 主窗口布局。\n\
  \n查看默认的 `Dolphin` 窗口，你会发现它有很多与 `Nautilus` 相同的功能：\n\n-   **菜单栏：** 允许你访问在 `Dolphin`\
  \ 窗口中显示文件和文件夹的设置，以及在当前窗口创建新文件和文件夹的选项。\n-   **工具栏：** 提供快速访问常用菜单功能的按钮：\n    -   *Back：*\
  \ 导航到之前查看过的文件夹。\n    -   *Forward：* 如果你向后导航过，则导航到下一个查看的文件夹。\n    -   *Icons：* 以图标显示文件和文件夹。\n\
  \    -   *Details：* 为每个文件和文件夹显示详细信息。\n    -   *Columns：* 显示两列信息，当前文件夹显示在左侧列，选定文件夹中的文件和文件夹出现在右侧。\n\
  \    -   *Preview：* 显示文本和图像文件内容的缩略图。\n    -   *Split：* 显示两个窗口，你可以用它们轻松地将文件和文件夹从一个位置拖放到另一个位置。\n\
  \n![Image 47](img/index-142_1.jpg)\n\n**图 7-5：** 在 Dolphin 文件管理器中看到的用户的 Home 文件夹。\n\
  \n-   **导航栏：** 窗口左侧显示位置图标的区域。\n-   **窗口：** 显示当前文件夹中包含的文件和文件夹的区域。\n-   **信息区域：**\
  \ 窗口右侧的此区域，在可能的情况下（如文本和图像文件）显示文件的缩略预览以及文件详细信息。\n-   **状态栏：** 显示当前查看文件夹中的文件和文件夹数量\
  \ —— 以及磁盘上当前的可用可用空间。\n\n当你单击单击视图窗口中的文件夹时，该文件夹将在同一窗口中打开，文件夹的路径（`breadcrumb` 面包屑）出现在视图窗口上方。就像在森林中留下面包屑以找到回路一样，你可以点击面包屑路径上的任何位置（也称为\
  \ `pathname` 路径）回到你开始所在的文件夹。\n\n![Image 48](img/index-143_1.jpg)\n\n在 `Dolphin`\
  \ 中创建、复制和重命名文件和文件夹的操作与 `Nautilus` 中完全相同。右键点击文件或文件夹会产生菜单，允许你剪切、复制或将文件移动到 `Trash`\
  \ 文件夹。\n\n在 `Dolphin` 中工作时要小心；默认情况下，它使用 `KDE` 的单单击方法来激活图标；如果你选择一个图标，`Dolphin` 会尝试使用该文件的默认应用程序来显示该文件。对于那些习惯于使用双击打开文件的\
  \ Microsoft Windows 环境的用户来说，这有点烦人。你可以通过使用 `System Settings`（系统设置）功能（见第 5 章）来改变这种情况。\n\
  \n`Dolphin` 还允许你在 `Split`（分屏）显示模式下产生文件系统的并列窗口，如图 7-6 所示。只需点击工具栏上的 `Split` 按钮。使用\
  \ `Split` 显示模式，你可以轻松地将文件从一个文件夹拖放到另一个文件夹 —— 在系统的任何地方！\n\n**图 7-6：** Dolphin 中的分屏显示模式。\n\
  \n### Konqueror 万岁\n\n在旧版本的 `KDE` 中（在某些 Linux 发行版中仍然流行），默认的文件管理器程序是 `Konqueror`。`Konqueror`\
  \ 应用是 `KDE` 项目的瑞士军刀；它在一个包中包含了文件管理器和浏览器。\n\n![Image 49](img/index-144_1.jpg)\n\n\
  由于其多功能性，许多新版本的 `KDE` 即使加载了 `Dolphin` 作为默认文件管理器也会保留 `Konqueror`。在 Fedora 中启动 `Konqueror`，选择\
  \ `Favorites➪Web Browser`。默认的 `Konqueror` 窗口会打开，但指向 Fedora 主页。你可以轻松在 URL 中输入文件路径来查看本地文件。图\
  \ 7-7 显示了 URL `/home/rich`，这是一个 `Home` 文件夹。\n\n\n\n\nKonqueror 的之处之处在于你可以在同一个窗口内网页和本地文件夹之间无缝切换！Konqueror\
  \ 使用`tabbed`（标签页式）浏览模式在主窗口内显示多个位置。按下 `Ctrl+T` 打开一个新的标签页区域。然后你可以通过点击标签轻松在网页和你的本地工作站文件系统之间切换。\n\
  \n**图 7-7：** 在 Fedora 的 KDE 桌面中使用 Konqueror 的主文件夹。\n\n等一下，还有更多！点击设置（Settings）菜单栏项，你会发现你还可以激活终端窗口或导航栏。导航栏出现在左侧；它显示了主目录、根目录、网络和菜单系统的链接，如图\
  \ 7-8 所示。点击其中一个本地文件夹即可访问你的文件系统。\n\n回到文件管理器的世界，Konqueror 在另一个重要方面与 Dolphin 相似：你可以使用标准的拖放或右键点击方法创建、移动和删除文件及文件夹。\n\
  \n![Image 50](img/index-145_1.jpg)\n\n**图 7-8：** 打开了终端窗口、标签页浏览和导航面板的 Konqueror 窗口。\n\
  \n## 使用 CD 和其他可移除介质\n\n正如第 6 章过的，涉及到可移除介质——CD-ROM、DVD-ROM、USB 闪盘、软磁盘（如果你使用的是复古系统）等——如果你通过命令行操作，你必须逐个寻找这些介质驱动器。有一个\
  \ GUI 文件管理器程序会让可移除介质变得更容易找到。\n\n### CD、DVD 和 USB 闪盘\n\n通常，当你在 GNOME 桌面插入新的可移除项（例如数据\
  \ CD-ROM）时，桌面的左侧会出现一个图标，显示分配给它的设备名称。你可以双击该图标来查看介质的内容。以下是弹出它的方法：\n\n- 如果有 `Eject`（弹出）选项（例如对于\
  \ CD-ROM），你可以右键点击图标并从上下文菜单中选择 `Eject`。\n- 在无法使用 `Eject` 的情况下，在从计算机移除该项（如 USB 闪盘）之前，请选择\
  \ `Unmount`（卸载）。此操作可确保你保存的所有数据都已实际写入可移除介质；Linux 并不总是立即将数据写入驱动器。\n\n在 GNOME 桌面中，当你插入音乐\
  \ CD 或 DVD 时，会打开一个音乐播放器（见第 13 章）播放音乐（对于 KDE，你必须从新设备通知器 New Device Notifier 小挂件中选择它）。有关如何添加更多类型音乐文件的支持，请参见第\
  \ 13 章。视频 CD 和 DVD，尤其是视频 DVD，你通常需要安装额外的软件（这是由于第 14 章讨论的许多问题导致的）。\n\nKDE 桌面不会自动为可移除介质生成桌面图标。然而，一旦你插入\
  \ CD-ROM、USB 闪盘或软磁盘，可移除介质就会出现在新设备通知器（New Device Notifier）面板部件中（见第 5 章）。访问可移除介质只需点击弹出窗口中的链接即可简单。\n\
  \nGNOME 目前在处理可写或可重写的空白 CD 或 DVD 方面比它的兄弟做得更好。将这些光盘插入驱动器会打开 `Nautilus` 窗口并进入其 CD/DVD\
  \ 创建器窗口（稍后将讨论）。KDE 桌面目前默认不包含 CD/DVD 刻录软件包，但我们将在本章稍些时候解决这个问题。\n\n### 软磁盘驱动器\n\n软磁盘驱动器有时会引起问题。例如，Linux\
  \ 计算机无法可靠地检测到软磁盘已插入驱动器；在你插入磁盘后，你必须告诉 Linux 去寻找它。因此，将软磁盘插入驱动器，在 GNOME 桌面中选择 `Places➪Computer`，然后双击\
  \ `Floppy Drive` 以访问磁盘内容并在你的桌面上添加软磁盘图标。对于 KDE 桌面，你必须打开 `Dolphin` 文件管理器并从导航区域选择 `PC\
  \ Floppy Disk` 条目。\n\n当你完成对软磁盘的操作后，可以通过右键点击桌面上的软磁盘图标，然后选择 `Unmount Volume`（针对 GNOME）或在\
  \ `Dolphin` 中点击 `Eject` 按钮（针对 KDE）来移除它。等待软磁盘驱动器的指示灯熄灭后再取出磁盘。只要灯还亮着，Linux 可能仍在写入磁盘。\n\
  \n## 访问此台计算机上的 Windows 驱动器\n\n如果你在 Windows 和 Linux 之间进行双启动，有时你想从 Linux 访问 Windows\
  \ 驱动器上的信息——你可以这样做；遗憾的是，Windows 无法访问 Linux 驱动器上的信息。\n\n![Image 51](img/index-147_1.jpg)\n\
  \n以下是如何从每个 Linux 文件管理器访问你的 Windows 文件：\n\n- **Nautilus：** 选择 Places（位置）菜单。Windows\
  \ 驱动器与其他所有你可以访问的位置一起列出（驱动器名称将与 Windows 中使用的长名称匹配，但不匹配驱动器号）。\n- **Dolphin：** Windows\
  \ 驱动器出现在导航栏区域的位置列表中——同样使用与 Windows 中相同的长驱动器名称。\n\n某些 Windows PC 使用硬盘上的隐藏分区来存放紧急恢复文件。这些分区在\
  \ Linux 中不会被隐藏，所以要小心不要破坏你的 Windows 系统重要的东西（除非，当然，你打算删除 Windows）！\n\n## 访问网络驱动器\n\
  \n有时你想访问的驱动器在另一台计算机上。如果另一台计算机上的驱动器设置为通过网络访问，你可以经通过 `Nautilus`、`Dolphin` 或 `Konqueror`\
  \ 文件管理器访问它：\n\n- 在 GNOME 桌面中，选择 `Places➪Network` 以浏览网络上的共享文件夹列表。如果你想访问 Windows 计算机，双击\
  \ `Windows Network`。网络上具有可浏览驱动器的 Windows 计算机将显示出来。从那里你可以浏览到你想去的地方！\n- 在 KDE 世界中，选择\
  \ `KDE➪Computer➪Network`（见第 5 章）。`Dolphin` 文件管理器将在网络模式下打开，如图 7-9 所示。\n\n**图 7-9：**\
  \ 网络模式下的 Dolphin。\n\n![Image 52](img/index-148_1.jpg)\n\n-  Windows 网络共享应该出现在 `Samba\
  \ Shares` 文件夹下（`Samba` 不仅仅是一种舞蹈；它是 Linux 用于与 Windows 网络通信的软件——见第 21 章）。\n\n如果你在网络上看不到\
  \ Windows 共享文件夹，请检查你的 Linux 发行版是否启用了防火墙。默认情况下，Fedora 启用防火墙阻止 `Samba` 连接；Ubuntu 则。\n\
  \n## 刻录数据 CD 和 DVD\n\nCD 和 DVD 刻录器是制作数据备份（特别是当光盘是可重写的）、保存和共享你的数字照片、制作多媒体纪念或或剪簿等的绝佳方法。有很多工具允许你在\
  \ Linux 下刻录 CD；这里快速查看其中几个。\n\n### K3b 软件包\n\n到目前，KDE 环境中最流行的 CD 和 DVD 刻录器是 `K3b`。遗憾的是，它在\
  \ Fedora 中没有默认安装。如果你还没有安装它，请参见第 16 章了解如何操作——你需要的特定包是 `k3b` 和 `k3b-extras`。要打开 `K3b`\
  \ 文件，选择 `Applications➪Multimedia➪CD and DVD Burning`。打开图 7-10 所示的窗口。\n\n**图 7-10：**\
  \ K3b CD 和 DVD 创建器。\n\n![Image 53](img/index-149_1.jpg)\n\n如果你只是想从下载的 ISO 文件创建一个\
  \ CD 或 DVD，请执行以下操作：\n\n1. **选择 `Tools`➪`Burn CD Image`（如果这是 CD-ROM 的 ISO 文件）或选择\
  \ `Tools`➪`Burn DVD ISO Image`（如果这是 DVD-ROM 的文件）。**\n\n这两个操作都会打开 `Burn CD Image`\
  \ 对话框（见图 7-11）。\n\n**图 7-11：** K3b Burn CD Image 对话框。\n\n\n\n\n2. 在“刻录映像”（Image\
  \ to Burn）部分，点击文件夹按钮，导航到你想要刻录到 CD 或 DVD 的文件，选择该文件，然后点击 `OK`。\n\n文件名和信息现在会出现在对话框中。\n\
  \n3. 如果出于某种原因你有多个刻录机，请确保“刻录介质”（Burn Medium）部分显示的是正确的设备，并在时更改选择。\n\n4. 在 `Speed`\
  \ 文本框中，如果你正在刻录 Linux 发行版的 CD 或 DVD，请将其降低至至少 `4x`。否则，通常保持原样是安全的。\n\n如果你发现当刻录 CD 或\
  \ DVD 时，它们经常看起来像变成了“垫片”（刻录失败的光盘），请降低你通常使用的速度。\n\n5. 如果你想在每次刻录时使用大部分这些设置，点击 `Save\
  \ User Defaults`（保存用户默认）。\n\n6. 点击 `Start` 开始刻录。\n\n![Image 54](img/index-150_1.jpg)\n\
  \n### 第 7 章：使用文件系统\n\n137\n\n出现一个对话框，显示两个进度条。第一个显示写入准备进度；第二个显示总进度，包括刻录时间。\n\n7.\
  \ 如果这是一个可写介质，系统将询问你是否想要擦除其内容以便重新写入。请根据情况回答。\n\n如果你告诉 `K3b` 擦除磁盘，在过程的这一阶段会出现“Erasing”（正在擦除）对话框。擦除完成后，托盘打开弹出光盘，然后自动关闭。这一刻就是实际刻录会话开始的时候。当磁盘再次弹出时，处理完成。\n\
  \n8. 从驱动器中取出新的 CD 或 DVD，点击 `Close` 关闭“Burn Information”（刻录信息）对话框，再次点击 `Close` 关闭主“Burn”（刻录）对话框。\n\
  \n9. **选择 `File` ➪ `Quit` 关闭 K3b。**\n\n注意该程序主窗口底部列出了其他一些有趣的功能。点击一个项目（Project）按钮可以从头创建一个音乐（音频）CD、数据\
  \ DVD 或数据 CD。（制作音频 CD 将在第 13 章介绍。）\n\n## 我们的朋友，Nautilus\n\nGNOME 桌面的 `Nautilus`\
  \ 文件管理器内置了 CD 和 DVD 刻录功能。要启动它，选择 `Places`（位置） ➪ `CD/DVD Creator`（CD/DVD 创建器）。如图\
  \ 7-12 所示，打开 `CD/DVD Creator` 窗口。\n\n**图 7-12：Nautilus CD/DVD 创建器窗口。\n\n![Image\
  \ 55](img/index-151_1.jpg)\n\n138 **第二部分：快速上手 Linux**\n\n要将文件刻录到 CD 或 DVD，只需遵循以下步骤：\n\
  \n1. 打开另一个 `Nautilus` 窗口来浏览你的文件。\n2. 将你想刻录的文件和文件夹拷贝到 `CD/DVD Creator` 窗口中。\n3. 点击\
  \ `Write to Disc`（写入光盘）按钮开始刻录 CD 或 DVD。\n\n就这些了！这是对系统文件进行快速备份的好方法。\n\n## Brasero\n\
  \nUbuntu GNOME 桌面还包含 `Brasero` CD 刻录工具来帮助你刻录 CD。`Brasero` 是一个功能全面的 CD 刻录工具，用于创建数据、音频和视频\
  \ CD 及 DVD。\n\n选择 `Applications`（应用程序） ➪ `Sound & Video`（音频与视频） ➪ `Brasero Disc\
  \ Burning`（Brasero 光盘刻录）打开 `Brasero`。\n\n在那里你可以选择启动的项目类型，如图 7-13 所示。\n\n**图 7-13：Brasero\
  \ 主窗口。**\n\n`Brasero` 的布局与 `K3b` 包非常相似。点击 `Data`（数据）项目按钮将文件和文件夹刻录到 CD 或 DVD。\n\n\
  ![Image 56](img/index-152_1.jpg)\n\n139 第 7 章：使用文件系统\n\n查找内容\n\nGNOME 和 KDE 桌面都提供了方便的方法在系统中查找项目。对于\
  \ KDE 桌面，`KFind` 工具是首选。GNOME 包含了 `File Searcher`（文件搜索）。\n\n### KFind\n\n通过选择 `KDE`\
  \ ➪ `Applications`（应用程序） ➪ `Find Files/Folders`（查找文件/文件夹）启动 `KFind`。如图 7-14 所示，出现\
  \ `KFind` 主窗口。\n\n**图 7-14：KFind 搜索窗口的属性选项卡。**\n\n以下是查找你所需内容的方法：\n\n* 在主 `KFind`\
  \ 选项卡中，根据名称或位置查找文件或文件夹。\n* `Contents`（内容）选项卡提供了一个表，如果你感兴趣查找文本文件中的特定内容可以填写（请注意，这种搜索方法可能需要一段时间才能完成）。\n\
  * `Properties`（属性）选项卡允许你根据文件的特定属性查找文件和文件夹——例如创建时间、大小或是否属于某个特定用户。\n\n![Image 57](img/index-153_1.jpg)\n\
  \n140 **第二部分：快速上手 Linux**\n\n### File Searcher\n\n正如你预期的，GNOME 桌面也有它自己的文件搜索工具，简单称为\
  \ `File Searcher`。\n\n你可以通过 `Places`（位置） ➪ `Search for Files`（搜索文件）启动 GNOME `File\
  \ Searcher`。\n\n如图 7-15 所示，打开 `Search for Files` 对话框。\n\n**图 7-15：GNOME 搜索文件对话框。**\n\
  \n`File Searcher` 有一个可以真正帮助缩小搜索范围的功能——它允许你组合多个搜索标准。只需点击 `Add` 按钮向下拉框添加新的搜索选项。你可以为\
  \ `File Searcher` 组合任意数量的搜索标准供搜索使用。那个文件不会隐藏太久！\n\n# 第 8 章\n# 连接互联网\n\n## 本章内容\n\n\
  * 收集连接信息\n* 连接到你的互联网提供商 (ISP)\n* 故障排除连接问题\n\n*通信的每一次改进都让无聊变得糟糕。*\n—— Frank Moore\
  \ Colby\n\n如果你在一台连接到局域网（LAN）的机器并在安装期间配置了网络，那么你可能已经连接了互联网。要测试你是否有连接，打开网络浏览器并尝试访问外部网站（如\
  \ `www.gnu.org`）。\n\n## 从你的 ISP 获取你需要的信息\n\n大多数信良好的 ISP 在你注册服务后会为你提供一份客户信息表。此表至少应包含以下信息：\n\
  \n* 调制解调器用户的本地拨号号码\n* 用户登录名\n* 用户登录密码\n* 电子邮件地址 142 **第二部分：快速上手 Linux**\n* 用于路由发送电子邮件的电子邮件出站主机或简单邮件传输协议\
  \ (`SMTP`) 服务器\n* 用于接收电子邮件的电子邮件入站主机或邮局协议 (`POP`) 服务器\n* 新闻主机\n\n你的计算机地址将是这两种类型之一：\n\
  \n* **静态：** 你始终拥有相同的 IP 地址。对于服务器来说，静态地址比桌面电脑更常见。如果你使用静态地址，你的 ISP 需要为你提供更多信息。你必须定义一个\
  \ `nameserver` 域名服务器 IP 地址（将域名解析为 IP 地址）、一个 `gateway` 网关地址（通过 ISP 将你的连接路由到互联网）以及\
  \ `network` 地址和 `netmask` 子网掩码组合（定义哪些地址是工作站的本地地址）。所有信息都应在客户表上。\n\n* **动态：** 你的 IP\
  \ 地址每次连接时都会更改，或者定期定期更改。在大多数桌面电脑上，你并不总是需要相同的地址，这让 ISP 的工作更轻松。它也让笔记本电脑等经常在网络间移动的电脑更加方便。如果你使用动态地址，会被告知使用\
  \ `DHCP` 连接。\n\n有了这些信息，你可以使用你的 Linux 系统建立互联网连接。\n\n## 配置你的连接\n\n好了，你有了网络硬件和 ISP\
  \ 信息——现在怎么办？答案是配置你的 Fedora 系统以接入互联网！\n\n配置过程根据你使用的硬件而略有不同。本节涵盖访问互联网的三种主要方法：\n\n\
  * 使用调制解调器拨打你的 ISP\n* 使用以太网卡连接 DSL 或电缆调制解调器\n* 使用无线卡连接到无线接入点 每种情况都需要配置略有不同的项目，但你可以通过\
  \ Fedora 网络配置工具执行所有操作。\n\n![Image 58](img/index-156_1.jpg)\n\n\n\n\n### 第 8 章：连接互联网\n\
  \n## 拨号上上网\n\n使用调制解调器拨号连接到你的 ISP 是两个步骤的过程。首先，你必须根据 ISP 提供的设置配置调制解调器。之后，你必须手动启动和停止\
  \ Internet 连接（你可能不希望调制解调器整天占用你的电话线）。\n\nGNOME 和 KDE 桌面分别有不同的软件包，用于配置调制解调器并连接到 ISP：\n\
  \n- `GNOME-PPP`：此包适用于 GNOME 桌面。\n- `KPPP`：此包适用于 KDE 桌面。\n\n如果你的 Linux 发行版没有这些程序（Fedora\
  \ 包含 `KPPP` 但不包含 `GNOME-PPP`），可以从大多数 Linux 发行版的标准安装光盘中安装这两个包（参见第 16 章）。安装完成后，你可以按照接下来的章节操作，它们将展示如何配置它们以与你的调制解调器配合。\n\
  \n### 设置 GNOME-PPP\n\n安装 `GNOME-PPP` 软件包后，你可以按照以下步骤配置 PPP 会话以连接到你的 ISP：\n\n1. **从顶部边缘面板菜单中选择\
  \ `Applications`➪`Internet`➪`GNOME PPP`。**\n出现图 8-1 所示的 GNOME PPP 主对话框。\n**图 8-1：**\
  \ GNOME PPP 对话框。\n\n2. **点击对话框底部的 Setup 按钮。**\n打开 Setup 对话框（如图 8-2 ），你可以在此处配置调制解调器设置。\n\
  \n![Image 59](img/index-157_1.jpg)\n\n**图 8-2：** GNOME PPP 设置对话框。\n\n3. **在 Modem\
  \ 标签页中配置调制解调器设置。**\n你必须选择调制解调器通信使用的端口。如果 Linux 自动检测到调制解调器，它会将其分配给特殊端口 `/dev/modem`。优先使用它；如果无效，Linux\
  \ 将使用 `/dev/ttyS0` 作为 COM1，使用 `/dev/ttyS1` 作为 COM2，依此类推。这些端口在工作站上通常使用 Windows 的\
  \ COM1 和 COM2 名称标记。\n\n4. **点击 Networking 标签页并设置你的 IP 地址信息。**\n- 如果你的 ISP 为你的工作站动态分配\
  \ IP 地址，请选择 Dynamic IP address 单选按钮。\n- 如果你必须指定静态 IP 地址，请选择 Static IP address 单选按钮并在文本框中输入地址信息。\n\
  - 如果你的 ISP 使用静态地址，你还需要配置用于网络名称服务器服务器（在配置窗口中称为 Domain Name Server [DNS]）。\n\n5. **点击\
  \ Options 标签页并为调制解调器连接设置附加功能。**\n你可以将调制解调器连接图标设置为在连接建立时最小化，或将其停靠在面板上。你也可以从此页面检查高级连接功能，例如在连接掉时让调制解调器重连。\n\
  \n6. **点击 OK 按钮保存设置。**\n![Image 60](img/index-158_1.jpg)\n\n7. **回到 GNOME-PPP 主对话框，输入联系你的\
  \ ISP 账户所需的信息。**\n你必须提供 ISP 的电话号码，以及任何所需的特殊前缀（例如，某些办公室需要拨打 9 来获取外线）。\n输入由你的 ISP\
  \ 提供的用户 ID 和密码，如果你希望 GNOME PPP 记住你的密码，请勾选复选框。\n\n8. **点击 Connect 按钮发起与 ISP 的连接。**\n\
  你现在应该可以出去漫游互联网了。当你完成后，断开会话通常是个好主意。右键点击面板中的图标并选择 Disconnect 选项即可关闭并挂断电话。\n\n### 设置\
  \ KPPP\n\n`KPPP` 软件包连接互联网所需的工作量与 `GNOME-PPP` 软件包大致相同。安装 `KPPP` 软件包后，选择 `Applications➪`Internet`（Fedora\
  \ 将其标记为 Internet Dial-Up Tool）来打开它。图 8-3 显示了 KPPP 主对话框。\n\n**图 8-3：** KPPP 主对话框。\n\
  \n以下是为你的 ISP ice 账户设置 `KPPP` 的方法：\n\n1. **点击 Configure 按钮更改默认设置。**\nKPPP Configuration\
  \ 对话框有四个标签用于配置你的拨号连接：\n- `Accounts`：定义 ISP 的登录信息。\n- `Modems`：定义调制解调器的属性。\n- `Graph`：定义如何显示连接统计数据。\n\
  - `Misc`：定义 KPPP 程序的各种行为。\n\n2. **点击 Modems 标签页设置你的调制解调器。**\n![Image 61](img/index-159_1.jpg)\n\
  \n3. **点击 Add 按钮添加新调制解调器。**\n出现 New Modem 对话框，如图 8-4 所示。\n**图 8-4：** 在 KPPP 中添加调制解调器。\n\
  调制解调器设备应该已经指向你的 `/dev/modem` 。这是大多数 Linux 发行版分配给解调器的设备名称。你可以点击 Query Modem 按钮测试调制解调器配置。\n\
  \n4. **选择 Accounts 标签页。**\nAccounts 标签允许你定义多个使用的 ISP 账户。\n\n5. **点击 New 按钮添加新账户。**\n\
  出现 New Account 对话框，询问你想使用向导过程还是手动输入 ISP 信息。目前，向导仅支持几个国家的少数 ISP（美国还没有）。你可能需要使用图 8-5\
  \ 所示的手动设置方法。\n\n6. **输入由 ISP 提供的 ISP 账户信息。**\n输入 ISP 提供的电话号码，然后点击 OK。该号码将出现在列表中。如果你的\
  \ ISP 提供了其他号码，你也可以将它们添加到列表中。咨询你的 ISP 以确定连接的认证设置以及其他所需的配置设置。\n![Image 62](img/index-160_1.jpg)\n\
  \n**图 8-5：** 在 KPPP 中添加 ISP 账户。\n\n7. **点击 OK 返回主配置窗口。**\n你现在准备好连接了。\n\n8. **输入\
  \ ISP 用户名和密码，并点击 Connect。**\n`KPPP` 将拨号、连接到 ISP 并使用用户名和密码登录。\n当 `KPPP` 与 ISP 建立连接时，它会在\
  \ KDE 面板上显示图标。要停止 Internet 连接，右键点击图标并选择 Disconnect。\n\n## Network Manager\n\n`Network\
  \ Manager` 程序为你所有的网络配置提供一站式解决方案。大多数流行的 Linux 发行版都使用 Network Manager 程序，包括 Fedora\
  \ 和 Ubuntu。\n\n你可以通过右键点击面板上的 Network Manager 小组件来启动它（取决于网络连接类型，它是两个显示器的图片或几条杠）。从右键菜单中选择\
  \ Edit configuration 查看你的网络配置。出现图 8-6 所示的 Network Connections 对话框。\n\n![Image 63](img/index-161_1.jpg)\n\
  \n**图 8-6：** Network Connections 对话框。\n\n通过此界面，你可以配置：\n- 有线以太网连接\n- 无线以太网连接\n- 移动宽带（无线调制解调器）连接\n\
  - 虚拟专用网络 (VPN) 连接\n- DSL 连接\n\n你可能正在家庭网络上工作，无论是有线还是无线。接下来的章节将介绍这两种网络的基本知识。\n\n###\
  \ 玩网卡\n\n随着宽带连接的增加，现在更多 Linux 用户直接连接互联网。对于大多数电缆和 DSL 调制解调器，你需要一个网络接口卡 (NIC)来连接调制解调器。\n\
  \n如果你使用有线网卡访问宽带连接，很可能是 Network Manager 软件在安装过程中自动检测并配置了它。你可以通过查看桌面面板上的 Network Manager\
  \ 小组件图标来判断。\n\n\n\n\n\n如果由于某种原因，Network Manager 没有正确检测到你的网络设置（或者你必须手动设置静态 IP 地址），可以使用\
  \ Network Manager 接口进行设置。\n\n打开“网络连接”（Network Connections）对话框并按照以下步骤配置有线网络连接：\n\n\
  ![Image 64](img/index-162_1.jpg)\n\n### 第 8 章：连接互联网\n\n## 1. 在列表中点击有线网卡，然后点击编辑（Edit）按钮。\n\
  \n如果工作站有多个有线网卡，Ubuntu 会按数字顺序为网卡命名，第一张卡为 `eth0`，第二张为 `eth1`，以此此类推。\n\n显示如图 8-7 所示的编辑对话框。\n\
  \n**图 8-7：**\n网络连接编辑对话框。\n\n## 2. 配置有线网卡设置。\n\n编辑对话框包含三个三个选项卡的信息：\n\n* `Wired`（有线）：设置卡的媒体访问控制（MAC）地址（Ubuntu\
  \ 会自动检测）以及媒体传输单元（MTU）大小（设置为自动）。\n* `802.1x Security`（安全性）：设置连接到受保护有线网络的登录详情。某些网络交换机使用此功能来限制对有线网络的访问。如果你的网络使用\
  \ `802.1x` 安全性，请咨询你的网络管理员以获取正确的设置。\n* `IPv4 Settings`（IPv4 设置）：决定网卡 IP 地址的设置方式。可以是从\
  \ DHCP 服务器动态获取，使用 zeroconf 协议与网络上的其他设备协商地址，也可以使用配置的 IP 地址静态设置。\n\n## 第二部分：快速上手 Linux\n\
  \n## 3. 点击 OK 保存新设置。\n\n当你为有线以太网配置好 Network Manager 后，它会尝试在你启动工作站的同时启动网卡。如果面板上出现了\
  \ Network Manager 图标，但显示未连接（图标上有红色 X），请检查线缆以确保插接正确。\n\n此外，请检查你连接的网络集线器。\n\n看妈，没线了！\n\
  \n无线现象席卷了家庭网络。如今，购买和安装无线路由器和有线交换机一样简单。如果你加入了无线阵营，你需要知道如何将你的 Fedora 系统连接到无线接入点。\n\
  \n你遇到的第一个障碍可能是无线网卡本身。遗憾的是，Linux 世界对无线网络的支持仍处于起步阶段。虽然每个新版本的 Fedora 都包含了对更多无线网卡的支持，但你的无线网卡仍然可能不受支持。\n\
  \n如果你的无线网卡不支持，你还可以采取最后的措施：`ndiswrapper` 项目。`ndiswrapper` 项目是一个开源项目，它使用为无线网卡提供的 Windows\
  \ 网络驱动程序创建一个伪 Linux 驱动程序。遗憾的是，Fedora 和 Ubuntu 的默认配置都不提供 `ndiswrapper` 软件，但你可以在其他地方找到它。你可以访问\
  \ http://sourceforge.net/projects/ndiswrapper/ 了解更多关于 `ndiswrapper` 的信息。\n\n如果你足够幸运拥有\
  \ Linux 安装支持的无线网卡，可以使用 Network Manager 工具为你的无线接入点进行配置：\n\n## 1. 左键点击 Network Manager\
  \ 图标显示检测到的无线接入点列表，如图 8-8 所示。\n\n每个网络的信号强度由橙色条表示。受安全密码保护的网络会显示额外的图标。\n\n## 2. 选择你想要连接的网络，然后输入网络安全密码（如果需要）。直接跳到第\
  \ 4 步。\n\n如果网络受安全保护，Network Manager 会提示你输入连接该网络所需的密码。\n\n## 3. 如果没有看到想要连接的网络名称（例如网络使用了隐藏\
  \ SSID），选择“连接到隐藏无线网络”（Connect to Hidden Wireless Network）。\n\n打开“隐藏无线网络”对话框，如图 8-9\
  \ 所示。\n\n![Image 65](img/index-164_1.jpg)\n![Image 66](img/index-164_2.jpg)\n\n\
  **图 8-8：**\n无线网络列表。\n\n**图 8-9：**\n指定隐藏的无线网络。\n\n输入无线网络的名称，然后输入它使用的安全方案（如果有）。如果你选择需要密码的安全方案，将出现一个新的文本框让你输入密码。\n\
  \n## 4. 点击连接（Connect）保存设置。\n\nNetwork Manager 图标在面板上显示动画图标，表示它正在尝试连接到无线网络。如果连接成功，你将看到信号强度计图标。\n\
  \n### 一切顺利，直到某个问题出现为止\n\n在一个完美的世界里，上一节的网络配置步骤应该是 100% 有效的——因为 Linux 供应商确实隐藏了传统网络领域的所有神秘色彩。\n\
  \n遗憾的是，在许多情况下（主要与调制解调器和硬件有关），简单的配置并不起作用。如果在按照这些步骤操作后无法连接互联网，LinuxQuestions.org (www.linuxquestions.org)\
  \ 是寻找帮助的优秀网站。是的，我们知道——你必须使用一台已经接入互联网的电脑来获取这些帮助。（这不就是“两难困境”吗？）预判人们可能遇到的各种问题是不可能的，Linux\
  \ 社区是你的最佳选择；该网站以乐于助人的成员而闻名。\n\n此外，去你喜欢的 Web 搜索网站搜索你收到的错误信息；如果只搜索错误信息无效，加上网络硬件的品牌、型号以及发行版名称也没有坏处。当你试图弄清楚连接出了什么问题——或者尝试收集可以帮助别人的信息时——你可以使用一个酷的工具：好手的\
  \ `ping` 命令行程序。\n\n某些防火墙会阻止发送 ping 包的流量，因此即使在连接良好的情况下，这些命令也不总是有效。\n\n`ping` 命令的工作原理类似于潜艇使用声纳探测海洋中的其他物体。声纳发送一个\
  \ `ping` 信号，该信号会在硬表面反射。通过测量从发送 ping 到 ping 返回之间的时间，潜艇工程师可以确定是否存在物体，以及该物体距离潜艇有多远。\n\
  \nLinux 中的 `ping` 命令提供了与声纳类似的信息——它是如此有用，以至于你在这里既把它看作一个 Linux 命令，也看作一个传统的词。如果你将互联网视为你的海洋，你可以通过回显（echoing）确定存在哪些网络计算机——以及你的\
  \ `ping` 命令返回需要多长时间。你使用的命令格式为 `ping hostname` 或 `ping ipaddress`，例如 `ping bob.example.com`\
  \ 或 `ping 192.168.1.5`。如果你无法 ping 家里或办公室的另一台电脑（假设它们都通过以太网连接且不是在分开的拨号连接上），那么你用来发送\
  \ ping 的机器出了问题。另一方面，如果你可以 ping 家里或办公室的另一台机器，但无法 ping 互联网其他地方机器，那么你与 ISP 的连接可能出了问题。\n\
  \n延迟（Latency），即信号在互联网上传输的时间，与物理距离关系不大。相反，网络流量、带宽和网络硬件等因素都会导致延迟增加。这些因素决定了对你邻居电脑执行\
  \ `ping` 命令是否比 ping（比如）南极的主机耗时长。\n\n\n\n\n例如，尝试通过打开命令提示符（见第 17 章）并输入以下命令来 ping Yahoo!：\n\
  \n```\nping www.yahoo.com\n```\n\n按下 `Ctrl+C` 停止 `ping` 命令；否则你的计算机将继续 ping 目标。\n\
  \n图 8-10 所示输出提供了关于 `ping` 正在执行的信息。如果你发送的 `ping` 命令无法到达主机，你将收到一条主机不可达的消息。如果 `ping`\
  \ 命令可以到达主机，你将收到反馈，告诉信号从你的计算机到达目标计算机并返回需要多长时间——以毫秒（ms）为单位。（数字越低越好。）对于通过以太网连接的计算机，1\
  \ 毫秒（ms）到 3 ms 的 `ping` 时间是可接受的响应时间。对于拨号连接，预计在 150 ms 左右。\n\n当你开始看到 `ping` 时间攀升到\
  \ 900 ms 或更高时，网络可能处于高负载状态（或你的电缆出了问题）。\n\n**图 8-10：**\n`ping` 命令的示例结果。\n\n## 第二部分：快速上手\
  \ Linux\n\n## 第三部分：实实工作\n\n### 在这一部分...\n在本书的这一部分，真正的乐趣开始了。在这里，你将发现如何使用 Linux 系统带的所有有趣软件！你将从生存所需的互联网工具开始，你知道的，如果现在无法访问这些工具，你恨不得咬掉自己的腿：网页、电子邮件、即时消息等。你还将发现如何编辑文件，无论是旧纯文本文件还是那些需要办公套件的文件——是的，你将看到如何在\
  \ Linux 环境中处理 Windows 文档！然后你将进入我们认为最好的部分：音频和视频！最后，这一部分以介绍 Google Gadgets 结束，这是一种如今最近变得非常流行的桌面工具。\n\
  \n### 第 9 章：使用互联网\n\n### 本章内容\n- 浏览网页\n- 发送即时消息\n- 获取文件\n- 互联网上交流\n\n*授人以鱼，不如授人以渔；授人以网，他他可以可以不打扰你几周。*\n\
  —— 匿名\n\n`Internet` 是一个跨全球的庞大计算机网络。许多不同类型的计算机和操作系统协同工作，让你能够访问该网络上的信息。Linux 以及其他相关的\
  \ UNIX 操作系统长期以来一直支持并与互联网协作。互联网上提供的几乎所有不同服务都可以从你的 Linux 桌面获取。\n\n当你安装 Linux（见第 3\
  \ 章）时，你的新系统上会有一个或多个 Web 浏览器、电子邮件程序和即时消息工具。在本章中，我们将向你介绍这些工具；在配置好互联网连接（见第 8 章）后，你可以使用它们访问互联网上的不同服务——如网站、电子邮件、新闻组和\
  \ FTP。\n\n### 使用 Firefox 浏览网页\n许多人将互联网的爆炸式增长归于图形 Web 浏览器。互联网的出现比浏览器的发明早得多。只是在互联网上进行的大部分工作都是纯文本的，对于那些喜欢漂亮图片的人来说没什么吸引力。在\
  \ Linux 世界中，最流行的浏览器无疑是 `Firefox` (`www.mozilla.org/products/firefox`)，它是 `Mozilla`（一个也可以处理电子邮件和新闻浏览的通信程序）的浏览器部分。另一个流行的选择是\
  \ `Konqueror` (`www.konqueror.org`)，它不仅是一个良好的 Web 浏览器，还包含了与 `Nautilus` 和 `Dolphin`\
  \ 程序类似的文件浏览功能（见第 7 章）。\n\n目前，一些主要 Linux 发行版的开发者与 Firefox 开发者之间存在一些问题。Firefox 开发者对\
  \ `Firefox` 的名称和标志拥有版权，这在开源软件世界中被认为是不可能的。因此，某些 Linux 发行版拒绝包含 `Firefox`。相反，它们包含了\
  \ `IceWeasel` 浏览器（你不得不喜欢开源幽默），它使用与 `Firefox` 相同的源代码（因为源代码仍然是开源的，即使标志和名称不是）。如果你的发行版使用\
  \ `IceWeasel`，你可以按照本章中的相同步骤操作。\n\n### 配置 Firefox\n如果你愿意，现在就可以开始上网。你不需要自定义你的浏览器。不过，你可能想花点时间告诉\
  \ `Firefox` 你的偏好，例如启动时显示的默认网站、默认使用的字体大小、使用的颜色以及许多其他选项。\n\n按照以下步骤在 `Preferences`\
  \ 窗口中配置你的 Firefox 设置：\n\n1. **启动 Firefox。**\n通常有多种方法启动 `Firefox`。使用 `GNOME` 桌面的\
  \ Linux 发行版通常会在顶部边缘面板放置一个应用程序启动器图标（见第 4 章）。使用 `KDE` 桌面面的发行版有时会将 `Firefox` 作为应用程序启动器，并将该图标放在面板中（见第\
  \ 5 章）。\n\n在两种桌面环境中，你始终可以选择 `Applications` ➪ `Internet` ➪ `Firefox`（在 GNOME 中），或\
  \ `KDE` ➪ `Applications` ➪ `Internet` ➪ `Firefox`（在 KDE 中）。\n\n2. **选择 Edit ➪ Preferences。**\n\
  出现 `Preferences` 窗口，如图 9-1 所示。此对话框包含了你进行网页浏览体验所需的所有设置。\n\n3. **点击 Preferences 窗口顶部的图标以访问各种偏好类别。**\n\
  `Advanced` 类别足够复杂，提供了各种子类的标签页。这些标签页也值得探索。我们将在接下来的章节中讨论更重要的类别。\n\n4. **如果你看腻了阅读菜单，只需点击\
  \ Close 关闭 Preferences 对话框并回到浏览。**\n\n#### 通用偏好\n点击 `Main` 图标来确定你希望 `Firefox` 在运行时的外观和行为。此对话框由两个独立的部分控制：\n\
  \n- **Startup：** 此部分允许你选择 `Firefox` 在启动时立即显示的内容。你可以直接在 `Home Page` 文本框中输入 URL，或者点击以下按钮之一：\n\
  \    - *Use Current Pages：* 导航到你想要作为默认网页的页面，然后点击此按钮。页面的 URL 将出现在 `Location(s)` 文本框中。\n\
  \    - *Use Bookmark：* 点击此按钮打开 `Set Home Page` 对话框，其中包含所有的书签。选择你想要使用的书签，然后点击 OK\
  \ 将页面的 URL 添加到 `Location(s)` 文本框中。\n    - *Restore to Default：* 点击此按钮让 `Firefox`\
  \ 打开一个空窗口。\n\n- **Downloads：** 此部分允许你设置 `Firefox` 如何执行文件下载。你可以设置让 `Firefox` 下载文件的位置，以及在下载文件时是否显示\
  \ `Downloads` 窗口。\n\n- **Add-ons：** `Manage Add-ons` 按钮将带你进入 `Add- Configuration`\
  \ 对话框。我们将在“通过插件扩展你的宇宙”部分中讨论它。\n\n#### 隐私偏好\n每当你发送电子邮件或点击网站时，你都在跨网络交换信息。虽然你不需要为此失睡，但你应该对在互联网上进行的每一次请求保持意识。点击\
  \ `Preferences` 窗口中的 `Privacy` 图标来查看 `Privacy` 设置（见图 9-2）。\n\n**图 9-2：** Firefox\
  \ 隐私偏好窗口。\n\n以下是你发现的内容：\n\n\n\n\n## 历史记录\n历史记录部分允许你指定浏览器希望记住你访问过哪些地方的天数。你也可以选择让\
  \ Firefox 记住你在表单和搜索栏中输入的文本。如果你使用此功能，Firefox 将尝试自动补全你以前在这些表单中输入过的单词。你还可以设置 Firefox\
  \ 记住你下载的文件，这样你就可以轻松地查看它们，而无需再次下载一个 500MB 的文件。\n\n## Cookies\n`Cookies` 是网站存储在你的机器上的位信息，以便能够再次访问这些数据。有些人并不在意意创建多少\
  \ Cookie；而有些人则不希望系统中有任何 Cookie，以防网站跟踪他们。要防止存储 Cookie，请取消勾选 `Accept Cookies from\
  \ Sites`（接受来自网站的 Cookie）复选框。\n\n仅允许特定网站设置 Cookie，请点击 `Exceptions` 按钮并将网站添加到你决定接受其\
  \ Cookie 的网站列表中。\n\n你可以通过点击 `Show Cookies` 按钮查看所有的 Cookie，并且你可以逐个删除它们（选择要删除的 Cookie\
  \ 然后点击 `Remove Cookie`）或全部全部删除（点击 `Remove All Cookies` 按钮立即丢弃所有 Cookie）。你可以通过从 `Keep\
  \ Until` 下拉列表中选择选项来指定 Firefox Firefox 如何保留或丢弃 Cookie：\n\n* `They Expire:`（过期：）大多数\
  \ Cookie 都有自动过期日期。如果你想让 Cookie 决定何时删除，请选择此选项。\n* `I Close Firefox:`（我关闭 Firefox：）如果你在使用图书馆计算机或其他共享机器，或者不想让电脑在你结束使用浏览器后存储\
  \ Cookie，请选择此选项。\n* `Ask Me Every Time:`（每次询问我：）如果你对 Cookie 极度偏执，或者想找到它们实际上被使用的频率，请选择此选项。\n\
  \n## 私有数据\n此部分允许你设置以及如何清除存储的项目（如 Cookie、临时文件、历史记录项目和存储的表单数据）。如果你希望每次退出 Firefox 时清除所有存储的文件，请勾选\
  \ `Always Clear My Private Data When I Close Firefox`（关闭 Firefox 时始终清除我的私有数据）复选框。你可以点击\
  \ `Settings` 按钮并选择单独的项目来精确选择清除哪些项目。作为一项安全功能，默认勾选了 `Ask Me Before Clearing Private\
  \ Data`（清除私有数据前询问我）复选框，以防止意外清除你的数据。\n\n![Image 71](img/index-175_1.jpg)\n\n## 第三部分：完成工作\n\
  \n### 内容偏好\n点击 `Content` 图标进入 Firefox 偏好对话框的内容部分（见图 9-3）。\n\n**图 9-3：**\nFirefox\
  \ 内容偏好窗口。\n\n此部分允许你控制 Firefox 如何对各种类型的内容做出。顶部部分指的是你可以阻止或允许的项目；每个项目右侧都有一个按钮，提供额外的控制：\n\
  \n* **Block pop-up windows**（阻止弹出窗口）：告诉 Firefox 阻塞你没有请求过的新窗口——弹出窗口是某些网站所有者在你尝试阅读他们的网站时向你推销广告的常用方式。然而，某些网站具有需要打开某些未请求窗口的功能（例如，为了登录）；点击\
  \ `Exceptions` 按钮将这些网站添加到 `Allowed Sites`（允许的网站）列表中。每当弹出窗口尝试打开时，浏览器窗口中会出现一个黄色条，允许你打开弹出窗口或删除它。\n\
  * **Load images automatically**（自动加载图像）：允许你阻止所有图像。这对于视力受损或试图通过忽略图片来加快浏览速度的人有用。如果你选择\
  \ `For the Originating Web Site Only`（仅针对源网站），你将阻止许多从其他网站加载并显示在你正在查看的网站上的广告。然而，选择此选项也会阻止合法的图形。点击\
  \ `Exceptions` 按钮来管理你想要和不想看到的内容。\n* **Enable JavaScript**（启用 JavaScript）：有些人出于安全考虑关闭了此功能。许多人没有。点击\
  \ `Advanced` 按钮打开 `Advanced JavaScript Settings`（高级 JavaScript 设置）对话框，你可以在其中选择允许\
  \ JavaScript 执行什么。如果你发现某个网站有调整你窗口大小等烦人操作，请进入此对话框禁用该功能。\n* **Enable Java**（启用 Java）：如果你安装了\
  \ Java 并启用了此选项，Firefox 将运行它找到的任何 Java 代码。\n\n中间部分是字体与颜色。这些功能包括：\n\n* **Default Font**（默认字体）：点击此下拉列表框来选择字体。\n\
  * **Size**（大小）：点击此下拉列表框来选择字体大小。\n* **Advanced**（高级）：点击此按钮打开 `Fonts`（字体）对话框，允许你为各种字体类选择使用的默认字体和大小，以及其他视觉设置。在这里，你还可以指定页面可以使用它们自己的字体而不是你的覆盖设置。\n\
  * **Colors**（颜色）：点击此按钮打开 `Colors`（颜色）对话框，并更改给文本、背景和链接的默认颜色。\n\n底部部分是语言。这允许你在有选择时设置你偏好的网站显示语言。点击\
  \ `Choose` 按钮来设置你偏好的语言以及你的偏好顺序。\n\n浏览时，如果你对字体大小不满意，按 `Ctrl++`（加号）让字体变大，按 `Ctrl+–`（减号）让字体变小。`+`\
  \ 和 `–` 是数字键盘上的版本，而不是主键盘上的。\n\n### 高级偏好\n此部分提供了四个标签页的设置，用于大多数用户可能不需要去碰的高级功能：\n\n\
  * **General**（常规）：`General` 标签允许你为行动不便的用户设置功能、设置额外的浏览器功能，并指定是否让 Firefox 检查为系统的默认浏览器。\n\
  * **Network**（网络）：如果你的网络管理员告诉你要使用代理服务器访问内容，请点击 `Connections` 部分中的 `Settings` 按钮。代理服务器提供了访问\
  \ Internet 的网关，网络管理员可以在那里控制你不应该访问的网站。`Offline Storage` 部分允许你设置 Firefox 允许保留多少磁盘空间作为存储访问过的网页缓存。如果你允许较大的缓存，那么下次访问时\
  \ Firefox 可以更快地显示页面。你可以点击 `Clear Now` 按钮清除缓存。缓存数据也是私有数据的一部分，你可以设置为退出 Firefox 时自动清除。\n\
  * **Update**（更新）：`Update` 标签告诉 Firefox 如何处理更新——包括自身以及你安装的任何插件。大多数 Linux 发行版作为其软件管理系统安装\
  \ Firefox 更新（见第 16 章）；如果你的系统这样做，你就不需要 Firefox 自己检查更新。\n* **Encryption**（加密）：`Encryption`\
  \ 标签具有 Firefox 使用的安全协议设置；它也是你为访问加密网站指定任何加密证书的地方。通常你可以保持这些设置不变。\n\n### 使用扩展程序扩展你的宇宙\n\
  Firefox 有一套在基础设置中支持的功能。然而，在广大的网络世界中，你早晚会遇到一些基础设置不支持的内容。\n\n但不要担心——帮助就在身边！Firefox\
  \ 允许你只需点击几次鼠标即可为基础设置添加新功能。Firefox 通过 `add-ons`（扩展程序）支持这些新功能——这些是在基础浏览器上额外添加更多功能的小型软件程序。Firefox\
  \ 支持三种类型的扩展程序：\n\n* **Extensions**（扩展程序）：为 Firefox 程序添加新功能，例如自定义工具栏和字典等工具。\n* **Themes**（主题）：允许你更改整个\
  \ Firefox 浏览器界面的外观和感觉。\n\n\n\n\n\n## 插件\n在浏览器窗口中直接提供额外的多媒体格式支持，例如视频和音频类型。\n\n你是否曾对那些坚持要求你下载特殊软件才能查看网站感到厌恼？插件和外部程序之间的区别在于：插件在浏览器中显示结果，而外部程序在浏览器*之外*运行。虽然当你只是在寻找一些基本信息时插件可能会很烦人，但它们可以提供一些非常酷的功能，例如通过\
  \ Web 浏览器流传输视频和音乐。\n\n第 14 章解释了如何向系统添加流行的视频插件（例如 Adobe Flash 插件）。\n\n![Image 72](img/index-178_1.jpg)\n\
  \n### 第 9 章：使用互联网\n\nFirefox 提供了一个独立的界面来管理加载程序。选择`工具 ➪ 扩展程序` 打开加载程序对话框（见图 9-4）。\n\
  \n**图 9-4：**\nFirefox 扩展程序对话框。\n\n扩展、主题和插件图标显示了你目前为每个类目安装了什么。以下是安装加载程序的方法：\n\n1.\
  \ 点击“获取扩展”图标（如果你已连接到互联网）查看一些推荐的加载程序。\n2. 点击“浏览所有扩展程序”链接打开一个网页，让你通过浏览查看有哪些可用的加载程序。\n\
  3. 当你找到想要尝试的加载程序时，点击描述下方的“安装”链接；如果你的 Firefox 版本是支持版本列表中的一个，点击“立即安装”。\n\n选择`帮助 ➪\
  \ 关于 Mozilla Firefox` 来查找你正在使用的是哪个版本的 Firefox。\n\n如果你运行的 Firefox 版本不支持该加载程序，你可能会收到错误信息，且该加载程序可能无法卸载。\n\
  \n### 浏览网页\nFirefox 是你通往精彩万维网的窗口。Firefox 的主要目的是根据你的命令获取 Web 页面，将所有的图形和相关文件下载到计算机的内存中，并（最后）渲染页面供你交互式查看。\n\
  \n![Image 73](img/index-179_1.jpg)\n\n### 第三部分：完成工作\n\n如果你习惯使用浏览器浏览器，使用 Firefox\
  \ 应该轻而易举。它拥有所有熟悉的导航工具，例如地址栏；后退、前进、重新加载和停止按钮，以及存储你喜爱的网站链接（书签）的功能。\n\nFirefox 像 Netscape\
  \ 一样有一个历史记录侧边栏——按下 `Ctrl+H` 显示或隐藏它（见图 9-5）——你可以用它访问最近访问过的 Web 页面。\n\n**图 9-5：**\n\
  打开历史记录侧边栏的 Firefox。\n\n*标签页浏览*——Firefox 的一个对你来说可能是新的功能——允许你在同一个窗口中打开多个网站。对于许多从 Internet\
  \ Explorer 6 或 Netscape 转过来的用户来说，Firefox 的标签页浏览功能最初可能看起来奇怪，但你可能会爱上它的。\n\n启动 Firefox\
  \ Web 浏览器后，定义为主页的网站会出现在一个标签页中。你可以保持该页面打开，并通过按下 `Ctrl+T` 在新标签页中打开新网站。新的 Web 页面出现在同一个\
  \ Firefox 窗口内，但作为一个标签页存在。你只需点击每个页面顶部的相应标签即可在两个标签页之间切换。\n\n你还可以通过右键点击链接并选择`在新标签页中打开链接`将\
  \ Web 链接作为新标签页打开。此功能对于在需要参考之前的页面时浏览复杂的网站非常有用。\n\n如果你在尝试关闭 Firefox 时打开了多个标签页，你会收到警告消息，询问你是否要保存打开的标签页。如果你点击“保存并退出”按钮，下次打开\
  \ Firefox 时，你的标签页将打开到你保存的站点。\n\n### 利用即时消息\n人与人之间的*即时消息**(IM)*就像使用电话——除非你是通过打字而不是说话交流。此外，你可以同时进行多个即时消息对话，而不需要额外的互联网连接。美国在线\
  \ (AOL) 提供了一种流行的即时消息服务——AOL 即时通讯器 (AIM)。ICQ、MSN、Yahoo! 和 Google 也提供其他 IM 服务。包括 Linux\
  \ 在内的各种计算机操作系统都支持这些不同的服务。\n\n在 Linux 世界中，你可能会遇到两个流行的 IM 软件包：\n\n* `Pidgin`：用于 GNOME\
  \ 桌面环境。\n* `Kopete`：用于 KDE 桌面环境。\n\n我们将查看如何为你的 IM 账户设置这些软件包中的每一个。\n\nPidgin 软件软件包曾被命名为\
  \ `GAIM`。遗憾的是，由于版权限制，该软件包的名称必须更改。如果你在之前的版本 Fedora 或 Ubuntu 中用过 `GAIM`，`Pidgin` 的工作方式完全相同。\n\
  \n### 使用 Pidgin 即时通讯器\n要从 Fedora GNOME 桌面启动 `Pidgin` IM 软件，选择`应用程序 ➪ 互联网 ➪ 即时通讯器`。从\
  \ Ubuntu，选择`互联网 ➪ Pidgin 即时通讯器`。\n\n当你第一次打开 `Pidgin` 时（见图 9-6），会出现一个空的账户对话框（用于管理你的账户）。\n\
  \n![Image 74](img/index-181_1.jpg)\n\n**图 9-6：**\nPidgin IM 账户对话框（空）和添加账户对话框。\n\n\
  要告诉 `Pidgin` 其中一个 IM 账户，请按照以下步骤操作：\n\n1. 点击账户对话框中的“添加”按钮。出现如图 9-6 所示的“添加账户”对话框。\n\
  2. 在协议下拉列表框，选择你想要使用的 IM 网络。有很多选项可以选择，包括流行的 AIM、Bonjour、Gadu-Gadu、Google Talk、GroupWise、ICQ、IRC、Jabber、MSN、MySpace\
  \ IM、QQ、SILC、SIMPLE、Yahoo! 和 Zephyr 站点。\n3. 在用户名和密码框中输入你 IM 账户的登录名和密码。不同的 IM 主机使用不同的登录名规范，例如你的电子邮箱地址或预分配的登录\
  \ ID。\n4. 在“用户选项”部分，输入一个要使用的本地别名；然后选择一个好友图标代表该账户。本地别名将代替你的登录名显示，如果你与多个站点交互，这让你更容易识别你正在与哪个\
  \ IM 站点交互。\n5. 如果你通过此服务接收电子邮件并想知道何时有新邮件到达，请勾选“新邮件通知”复选框。\n6. 如果你想访问此 IM 服务的更高级选项，点击“高级”标签页。\n\
  \n![Image 75](img/index-182_1.jpg)\n\n每个 IM 服务都有自己一套可以配置的高级选项。例如，AIM IM 服务允许你更改连接的默认\
  \ AOL 服务器以及默认的 TCP 端口号。\n\n7. 完成输入信息后，点击“添加”将此 IM 账户添加到你的账户列表中。\n\n为你想要在 `Pidgin`\
  \ 中使用的每个账户重复此过程。当你创建一个账户时，它会出现在账户对话框中。对于你想自动登录的账户，勾选“启用”列中的框。\n\n创建账户后，会出现 `Pidgin`\
  \ 好友列表对话框（如图 9-7 所示）。\n\n**图 9-7：**\nPidgin 好友列表。\n\n可以通过选择 `Pidgin` 好友列表对话框中的账户并点击“修改账户”按钮来修改账户设置。\n\
  \n当你启动会话时，好友列表窗口会显示你的活动连接。如果你关闭了好友列表窗口，`Pidgin` 图标会出现在你的面板上，程序在后台运行。你可以通过右键点击此图标打开好友列表窗口。\n\
  \n再次，`Pidgin` 的功能远不止于此，因此值得你花时间尝试这个工具。\n\n在关闭账户和好友列表对话框后，你可以通过右键点击系统托中的 IM 图标并从菜单中选择你想打开的对话框来重新打开它们。\n\
  \n\n\n\n\n![Image 76](img/index-183_1.jpg)\n\n## 第三部分：完成任务\n\n## 尝试 Kopete\n\n如果你正在使用\
  \ KDE 桌面，很可能已经安装了 `Kopete` 即时消息应用程序。要启动 `Kopete`，在 KDE 中选择 KDE➪Internet➪Kopete。\n\
  \n在 Fedora 中，选择 KDE➪Applications➪Internet➪Instant Messenger。启动 `Kopete` 后，它的主窗口（如图\
  \ 9-8 所示）就会出现。\n\n**图 9-8：**\nKopete 主窗口。\n\n要在 `Kopete` 中开始使用，你必须添加你的 IM 账户。按照以下步骤操作即可：\n\
  \n1. **点击主窗口中的“添加账户”按钮。**\n   `Kopete` 会启动一个向导，引导你完成创建新账户的步骤。第一页列出了 `Kopete` 可以通信的网络，如图\
  \ 9-9 所示。\n\n2. **选择你想要使用的 IM 网络，然后点击“下一步”按钮。**\n   向导的第二页包含一个或多个供你填写的信息标签页，具体取决于你选择的\
  \ IM 网络。\n   每个网络都有一个`Basic Setup”（基础设置）标签页，你可以在那里配置用户名和密码。对于某些 IM 网络，`Kopete` 提供了一个链接到该服务的按钮，你可以创建一个新账户。\n\
  \   某些网络拥有“Account Preferences”（账户偏好）标签页，允许你设置备用服务器、端口或代理服务器。某些可能提供“Privacy”（隐私）标签页，允许你决定哪些用户被屏蔽，哪些用户允许与你的\
  \ IM 账户通信。\n\n![Image 77](img/index-184_1.jpg)\n\n**图 9-9：**\n在 Kopete 中选择 IM 网络。\n\
  \n3. **填写你的账户信息，然后点击“下一步”按钮。**\n4. **点击首页上的“完成”按钮创建账户。**\n   如果你希望 `Kopete` 自动连接到\
  \ IM 服务器，请点击“完成”按钮之前勾选“Connect Now”（立即连接）复选框。\n\n   向导将你返回 `Kopete` 主窗口（参考图 9-8），但现在会将你的\
  \ IM 账户显示为默认身份。`Buddy List”（好友列表）窗口显示了你的活动连接。\n   要向你的 IM 账户添加联系人，请点击工具栏上的`Add`按钮。要更改你的状态，点击工具栏上的`Status`按钮并选择你当前的状态（如在线、离开或忙碌）。\n\
  \   要修改账户设置、添加新账户或更改 `Kopete` 的行为，通过选择 Settings➪Configure 来打开 `Configure`窗口。会出现如图\
  \ 9-10 所示的 `Configure`窗口。\n   从 `Configure`窗口中可以看出，你可以通过多种方式自定义 `Kopete` 以最大化你的\
  \ IM 体验。\n   启动 `Kopete` 后，它会在 KDE 面板的系统托区域创建一个图标。只需右键点击图标即可弹出好友列表并使用 `Kopete`。\n\
  \n![Image 78](img/index-185_1.jpg)\n\n**图 9-10：**\nKopete 配置窗口。\n\n## 解决你的 IM 连接问题\n\
  \n如果你一直在其他操作系统上使用过大部分这些 IM 客户端，那么在你的 Linux 系统成功连接到 IM 服务后，现有的好友列表将自动导入。如果你从未用过 `AIM`\
  \ 或 `MSN`，现在可以设置好友列表了。好友列表包含了你想通过即时消息服务与人通信的用户名。你的好友列表让你知道你的“朋友们”何时在线并可以接收即时消息。\n\
  \n有时，你的 Linux 系统无法正常连接到 IM 服务。当这个问题发生时，屏幕上会弹出一个错误消息并指示连接失败。你可能由于以下原因无法连接到 IM 服务：\n\
  \n* 你可能输入错误的 IM 账户密码，或者选择了错误的 IM 账户名。\n* 你的计算机可能没有连接到互联网。尝试打开网络浏览器查看是否可以访问网站，这将告诉你是否已连接到互联网。\n\
  * 如果你可以打开网站但 IM 无法工作，则 IM 系统可能不可用。此问题的有时是因为 IM 服务的维护，或者互联网或 IM 服务的流量过大导致的。\n* 如果你尝试从工作的计算机访问\
  \ IM 服务，你的公司或组织可能出于安全或生产力考虑阻止了 IM 服务。如果工作场所允许使用 IM，请咨询网络管理员看他们是否可以提供帮助。\n* 许多公司在公司网络和互联网之间使用防火墙，以防止不需要的流量进入公司网络。如果防火墙被配置为拦截\
  \ IM 流量，你就无法通过互联网使用 IM。\n\n## 使用 BitTorrent 下载\n\n无论对文件共享怎么看，它都很受欢迎。诸如 `BitTorrent`\
  \ (www.bittorrent.com) 等网络实际上已经在软件公司和其他内容分发商中找到了合法的用途。他们将其作为提供大文件下载的一种，而无需自己承担大部分带宽消耗，因此查看在\
  \ Linux 下如何使用该软件是值得的。\n\n你可能已经猜到 Linux 世界中有几个不同的图形化 BitTorrent 客户端包可用：\n\n* **BitTorrent:**\
  \ 由 BitTorrent 网络开发的软件包，在 Windows 和 Linux 用户中都很受欢迎。\n* **Transmission:** 由 GNOME\
  \ 桌面开发者为 GNOME 桌面创建的 BitTorrent 软件包，在 Fedora 和 Ubuntu 中默认安装。\n* **KTorrent:** 由\
  \ KDE 开发者为 KDE 桌面创建的 BitTorrent 软件包，在选择 KDE 桌面时，它会在 Fedora 中默认安装。\n\n所有 BitTorrent\
  \ 客户端包的工作方式都基本相同。以下是概述：\n\n1. 一个 BitTorrent 下载由你必须下载的控制文件组成。控制文件通过文件名中的 `.torrent`\
  \ 后缀识别。它告诉 BitTorrent 客户端软件去哪里联系控制下载信息的服务器。\n2. 当客户端连接到服务器时，服务器会将客户端引导到拥有下载文件部分的其他客户端。\n\
  3. 开始进行“互惠”交换，客户端从其他客户端下载文件的部分，同时与其他客户端共享他们已经下载的部分。\n\n![Image 79](img/index-187_1.jpg)\n\
  \n以下是在你的 Linux 桌面启动启动 BitTorrent 会话的方法：\n\n1. **启动你的 BitTorrent 客户端。**\n   可以通过桌面菜单系统中的“Internet”组访问\
  \ BitTorrent 客户端。图 9-11 显示了 Fedora Transmission 客户端。对于大多数 Linux 发行版，Firefox 浏览器已配置为每当你从网页上选择\
  \ `.torrent` 文件时启动 BitTorrent 客户端。\n\n**图 9-11：**\nTransmission BitTorrent 客户端窗口。\n\
  \n2. **选择打开 Torrent 选项。**\n   对于 `Transmission`，点击工具栏上的`Add` 按钮。对于 `KTorrent`，点击`Open`\
  \ 按钮。会出现一个文件浏览器窗口。\n\n3. **找到并选择想要下载的文档的 .torrent 文件，然后点击选中的 torrent 将添加到列表。**\n\
  \   该文件出现在看起来非常像音乐播放器的格式中，如图 9-12 中的 `KTorrent` 所示。你可以通过向其他 BitTorrent 用户提供更快的上传来控制下载。如果你有宽带（详见第\
  \ 8 章），`40 Kbps` 的上传速度效果良好。\n   工具可能需要一左右的时间完全同步，因此预计时间在一段时间内会剧烈变化，直到稳定在一个一致值上。\n\
  \n![Image 80](img/index-188_1.jpg)\n\n**图 9-12：**\n正在下载文件的 KTorrent 窗口。\n\n4. **准备好退出时，选择\
  \ File➪Quit 来关闭客户端。**\n\n\n\n\n\n即使下载完成，BitTorrent 客户端也会继续托管该文件供他人下载。如果你想做一个友好的网络邻居，请在下载完成后让\
  \ BitTorrent 客户端运行一会，以便其他人也能获取这些文件碎片。\n\n## 处理旧式文件传输\n\n虽然 BitTorrent 是未来的趋势，但仍有许多网站需要你使用老旧的文件传输协议（FTP）方法来下载文件。你经常可以在\
  \ FTP 站点上找到应用程序、实用程序和其他其他优秀工具的文件仓库。\n\n大多数 Linux 发行版都包含一个命令行 FTP 客户端程序（简单称为 `ftp`），但默认安装中不包含图形化\
  \ FTP 客户端。不过，使用软件包管理器添加一个（参见第 16 章）并没有问题。Linux 世界中最受欢迎的三个图形化 FTP 程序是：\n\n- `gFTP`：GNOME\
  \ 项目的图形化 FTP 客户端。\n- `Kget`：KDE 项目的图形化 FTP 客户端。\n- `FileZilla`：为了运行在任何桌面（包括 Windows\
  \ 和 Mac）而创建的图形化 FTP 客户端程序。\n\n![Image 81](img/index-189_1.jpg)\n\n大多数 Linux 发行版都提供了\
  \ `FileZilla` 包，它在 GNOME 和 KDE 桌面环境中运行得同样良好。它还支持安全的 FTP 会话，这在如今变得越来越流行。如果你正在寻找一个健壮的图形化\
  \ FTP 客户端程序，可以尝试安装 `FileZilla`（参见第 16 章）。\n\n当你安装好 `FileZilla` 后，按照以下步骤尝试一下：\n\n\
  1. **从桌面菜单系统中的“Internet”组启动 FileZilla。**\n从 GNOME 菜单中，选择 Applications ➪ Internet\
  \ ➪ FileZilla。\n出现 FileZilla 主窗口，如图 9-13 所示。`FileZilla` 提供了你的文件系统和远程 FTP 服务器文件系统的并视图。默认情况下，`FileZilla`\
  \ 将你的家目录指向本地目录（显示在左侧列表框中）。\n\n**图 9-13 FileZilla 主窗口。**\n\n2. **在 Host 框中输入远程 FTP\
  \ 服务器的主机名，在 Username 框中输入用户名，并在 Password 框中输入密码。**\n之前连接过该主机，它的主机名和用户登录名会出现在文本框中。\n\
  \n3. **当远程 FTP 会话开始时，右侧列表框中会出现可用文件和文件夹列表。**\n\n4. **找到并选择你想要下载的文件，在左侧列表框中选择要下载到的文件夹，然后通过拖放来传输文件。**\n\
  \n5. **完成后，点击工具栏上的断开连接图标（带有大红色 X 的图标）以断开连接并结束会话。**\n\n就是如此简单。使用图形化 FTP 客户端让传输大量文件变得几乎毫无痛苦。\n\
  \n## 拨打电话聊天\n\n如今的热潮是通过互联网进行电话聊天。无论你只是想尝试一下，还是一个完全的追随者，只要你想参与，Linux 都能提供你所需的软件。将网络电话网络想象成即时通讯网络（Instant\
  \ Messenger）。支持网络电话最流行的网络之一是 `Skype` (www.skype.com)，它使用 `SIP`（会话建立协议），这是一种流行的默认协议，你可以配合更广泛的程序使用。不过，首先你需要合适的硬件——无论是一个可以直接插入电脑的电话（例如\
  \ `SIP` 电话），还是仅仅是耳机和麦克风的组合——最好不要选择低端型号，以便获得最佳的音质。当你有了硬件，就是时候获取软件了。\n\n在 Fedora 和\
  \ Ubuntu 中，默认客户端软件是 `Ekiga` (www.ekiga.org)。\n\n存储库中包含另外两个 `SIP` 客户端，如第 16 章讨论的那样：`KPhone`\
  \ (http://sourceforge.net/projects/kphone) 和 `Linphone` (www.linphone.org)。并不包含流行的\
  \ `Skype` 包，但你可以从 www.skype.com 下载 Linux 版 `Skype` 客户端。\n\n在接下来的章节中，我们将向你如何配置默认的\
  \ `Ekiga` 包和流行的 `Skype` 包。\n\n### 使用默认的：Ekiga\n\n默认的 `Ekiga` 网络电话软件是对旧版 GNOME `GnomeMeeting`\
  \ 包针对网络语音和视频会议应用程序的重新设计。`Ekiga` 经过扩展，提供了与更流行的 `Skype` 软件相同的基本功能，并与微软的 `NetMeeting`\
  \ 兼容。这种兼容性允许你与微软朋友一起参加会议（只要别太吹嘘你的软件是免费的）。\n\n要启动 `Ekiga`，选择 Applications ➪ Internet，然后寻找名为\
  \ `Ekiga` 的软件（这是 Ubuntu 的列出方式），或者寻找 IP Telephony, VoIP and Video Conferencing（这是\
  \ Fedora 的列出方式）。第一次启动 `Ekiga` 时，你会看到一系列配置窗口。按照以下步骤配置你的 `Ekiga` 软件：\n\n1. **点击 Forward（向前）启动向导。**\n\
  出现个人信息对话框。\n\n2. **在提示处，输入你希望在网络上被识别的名称。**\n其他 `Ekiga` 用户将看到你在这里输入的名称列在列表中。\n\n\
  3. **点击 Forward（向前）。**\n向导进入 `Ekiga` 账户页面。\n\n4. **在提示处输入你的 `Ekiga` 账户用户名和密码。**\n\
  如果你还没有账户，可以跳转到 `Ekiga` 网站 (www.ekiga.net) 注册一个免费账户。\n\n5. **点击 Forward（向前）继续。**\n\
  配置向导现在被设置为通过一系列窗口来自动确定你系统的硬件和软件细节。该系列窗口包括：\n\n- `Connection Type`（连接类型）：设置你的互联网连接速度。对于拨号调制调器，将是\
  \ 56K 选项。对于宽带连接，将是 xDSL/Cable 选项。\n- `Audio Devices`（音频设备）：检测系统上的音频输入和输出设备。`Ekiga`\
  \ 软件极可能无需你干预即可成功检测这些设备。\n- `Video Devices`（视频设备）：确定是否有视频输入设备（摄像头）连接到你的系统。\n\n6.\
  \ **选择你的系统使用的互联网连接类型，然后点击 Forward（向前）。**\n\n7. **对于后续每个窗口，在 `Ekiga` 完成相关的确定或检测后点击\
  \ Forward（向前）。**\n当配置向导完成后，会显示最终的配置窗口，显示你所做的选择。\n\n![Image 82](img/index-192_1.jpg)\n\
  \n**图 9-14 Ekiga 主窗口。**\n\n8. **点击 Apply（应用）按钮完成配置。**\n完成配置后，出现 `Ekiga` 主窗口（如图 9-14\
  \ 所示），它将监听新电话并等待你拨号。\n\n### 使用 Skype 聊天\n\n`Skype` 是目前最流行的 IP 电话网络。许多 Linux 发行版将\
  \ `Skype` 作为默认 IP 电话软件安装。遗憾的是，Fedora 和 Ubuntu 都没有这样做。如果你偏在 Fedora 或 Ubuntu 系统上使用\
  \ `Skype`，你必须自行安装。\n\n要在你的 Linux 系统上安装 `Skype`，请执行以下操作：\n\n1. **将浏览器指向 www.skype.com。**\n\
  2. **在 Skype 主页上点击 Download（下载）链接。**\n你将被带到下载 Skype 页面。\n\n3. **点击页面左侧的 Skype for\
  \ Linux 链接。**\n你将被带到下载 Skype for Linux 页面。在这里你可以看到各种 Linux 发行版的链接。\n\n4. **点击你特定\
  \ Linux 发行版的链接。**\n如果没有列出你特定的发行版版本，你应该能够安装旧版本。出现打开 Skype 对话框，标题中显示文件的全名。\n\n\n\n\
  \n\n## 5. 选择“用软件安装程序打开”选项并点击确定，或者点击下载安装程序文件到工作站的选项。\n\n![Image 83](img/index-193_1.jpg)\n\
  \n### 第三部分：完成工作\n\n如果你的发行版提供了在下载完成后立即打开软件安装程序的选项，那么软件安装程序将会自动启动（见第 16 章）。如果你将安装程序文件下载到工作站，你需要在工作站上找到它，*然后*点击它来启动软件安装程序。\n\
  \n## 6. 从你的软件安装程序开始安装。\n\n根据你发行版的不同，软件安装程序可能需要下载额外的文件来支持 Skype 的安装。软件安装程序会自动处理此操作；你只需静静等待安装完成即可。\n\
  \n安装完成后，Skype 将出现在桌面的 Internet 组中。\n\n## 7. 选择 Internet➪ Skype 来启动 Skype。\n\n当 Skype\
  \ 启动时，会弹出一个向导。你可以通过两种方式之一使用它：\n\n• 输入你的 Skype 账户信息。\n• 连接到 Skype 服务器并创建一个新账户（如图\
  \ 9-15 所示）。\n\n设置好账户后，你就可以使用 Skype 界面连接到 Skype 服务器并开始拨打了！\n\n**图 9-15：** 创建新的 Skype\
  \ 账户。\n\n### 第 9 章：使用互联网\n\nSkype 网络是一个带宽共享应用程序。当你连接到 Skype 服务器后，其他人可以通过你的客户端程序使用你的带宽进行连接。如果你处于带宽限制的连接下，这可能会是一个问题。\n\
  \n### 与其他互联网工具配合\n\n根据你的需求，你可能想探索各种其他类型的工具。本节涵盖了一些入门提示，因此即使你去第 16 章添加适当的软件（或者发现自己在翻阅菜单并不知道该程序叫什么名字），你也不会完全迷失无措。以下是一些帮助你正确引导的资源：\n\
  \n✓ **IRC 程序：** 互联网中继聊天 (IRC) 是一种提供与服务器连接的协议，人们在服务器上使用消息讨论任何可以想象得到的话题。尽管现在的 IM 客户端支持\
  \ IRC，但你可能更倾向于使用*专门*用于 IRC 的程序。此用途的常用程序有 `X-Chat` 和 `KIRC`。\n\n✓ **文件共享：** 如果你想使用\
  \ `Gnutella` 网络，`LimeWire` 是一个流行的文件共享应用程序。\n\n✓ **RSS 阅读器：** 许多面向新闻的网站使用极其简单聚合 (RSS)\
  \ 协议将新闻直接流到 RSS 阅读器程序中。`Firefox` 有许多为它设计的 RSS 扩展。此外，`Straw` 是一个流行的 RSS 程序。\n\n如果你不确定使用哪些程序，可以对你想的操作类型（如\
  \ `RSS`）进行网络搜索，并包含 *Linux* 一词。\n\n### 第 10 章：向世界发送电子邮件\n\n### 本章内容\n▶ 检查演进 (Evolution)\n\
  ▶ 与 KMail 配合工作\n\n*你的信箱是你通往心灵的窗口！务必让那扇窗开着！*\n— Takayuki Ikkaku, Arisa Hosaka 和 Toshihiro\
  \ Kawabata*\n\n尽管大多数人在提到互联网时会想到 Web，但事实上，电子邮件可能是所有互联网应用程序中最常用且最受喜爱的。Linux 用户有大量的电子邮件程序可用。大多数\
  \ Linux 发行版默认至少安装一个电子邮件应用程序，具体是哪一个取决于你正在使用的默认桌面（见第 1 章）。\n\n当然，在 Linux 中，如果你发现了一个更喜欢的电子邮件程序，你可以自由安装不同的程序来使用！\n\
  \n本章概述了目前 Linux 中使用的最流行的三个电子邮件软件包。希望你能找到一个适合你需求的程序。\n\n### 亡事绸备\n\n在你开始忙着设置你的电子邮件软件包之前，你需要获取一些关于支持你电子邮件地址的互联网服务提供商\
  \ (ISP) 的信息。你应该能够从 ISP 给你提供电子邮件账户时收到的信息，或者通过拨打 ISP 的帮助热线并询问几个简单问题来获取大部分信息。\n\n在开始之前，你需要手头准备好的项目有：\n\
  \n✓ **你的电子邮件地址：** 这应该由你的 ISP 分配，格式类似于 `me@myhost.com`。你需要记住在电子邮件软件包中输入的地址必须与电子邮件中显示的地址完全一致，否则别人将无法回复你的消息！\n\
  \n✓ **你的 ISP 用于入站邮件的电子邮件服务器类型：** ISP 电子邮件服务器使用几种不同的方法与电子邮件客户端通信。最流行的两种是 `POP`（也称为\
  \ `POP3` 指版本）和 `IMAP`。\n• 这两个协议之间的主要区别是，`POP` 通常要求你将所有入站邮件从 ISP 服务器下载到本地工作站。在它们被下载到你的\
  \ PC 之后，ISP 就会从服务器上删除它们。\n• `IMAP` 允许你在 ISP 服务器上创建文件夹并将所有邮件存储在服务器上。`IMAP` 服务器通常允许你在服务器上使用特定的存储空间，因此请留意你积累了多少邮件。\n\
  \n✓ **你的 ISP 入站邮件服务器的主机或 IP 地址：** 你的 ISP 应该提供一个主机或 IP 地址（例如 `pop.isp.com`），供你连接接收邮件。\n\
  \n✓ **你的 ISP 用于出站邮件的电子邮件服务器类型：** 发送出站邮件所需的协议与获取入站邮件的协议不同。大多数 ISP 电子邮件服务器使用 `SMTP`\
  \ 发送邮件。\n\n✓ **你的 ISP 出站邮件服务器的主机或 IP 地址：** 你的 ISP 应提供一个主机或 IP 地址（例如 `smtp.isp.com`），供你连接。\n\
  \n✓ **加密会话所需的任何特殊端口或密码：** 现在许多 ISP 要求你登录以建立加密连接。如果你的 ISP 不支持此项，你仍然应该考虑使用它。\n\n当你准备好所有信息后，就可以配置你的电子邮件软件包了。\n\
  \n### 演进到电子邮件：Evolution\n\n如果你使用的是 GNOME 桌面，默认的电子邮件软件包被称为 `Evolution`。Evolution\
  \ 的界面会让你非常像 `Outlook`。如果你喜欢将日历、地址录、任务管理器和电子邮件整合，那么你会觉得 Evolution 非常熟悉。\n\n本节将引导你完成\
  \ Evolution 与 ISP 通信的步骤。\n\n![Image 84](img/index-198_1.jpg)\n\n### 设置 Evolution\n\
  \n你可以通过点击 Evolution 面板图标（打开的信）或选择应用程序➪Internet➪Evolution 来启动 Evolution。当你第一次启动 Evolution\
  \ 时，会启动向导。\n\n点击“下一步”通过欢迎屏幕，随后会出现恢复备份界面。如果你之前保存过 Evolution 设置的副本，可以从此屏幕快速恢复。如果是第一次使用\
  \ Evolution，请点击“下一步”。\n\n接下来打开身份界面（见图 10-1）。要完成 Evolution 设置向导，请遵循以下步骤：\n\n**1.\
  \ （可选）更改全名字段。**\n\n有些人不想在网上使用自己的真实姓名；许多人选择使用昵称。取决于你在机器上配置的其他程序，这里可能或没有分配默认值。\n\n\
  **2. 如果电子邮件地址字段与 ISP 给你的地址不匹配，请更改电子邮件地址字段（它可能不匹配）。**\n\n**3. 如果你想让这个特定的账户成为你的默认邮件账户，务必勾选“设为我的默认账户”复选框。**\n\
  \n**图 10-1：** Evolution 身份界面。\n\n\n\n\n\n![Image 85](img/index-199_1.jpg)\n\n# 第三部分：完成工作\
  \ (Getting Things Done)\n\n如果你希望人们回复到一个与你发送邮件时不同的电子邮箱账户，请在 `Reply-To`（回复至）字段中输入你希望他们使用的电子邮箱地址。否则，你可以保持此字段为空。你也可以选择在\
  \ `Organization`（组织）字段中输入你的组织名称。\n\n### 4. 点击“前进”（Forward）继续。\n\n打开“接收邮件”（Receiving\
  \ Email）屏幕，如图 10-2 所示。\n\n### 5. 在 `Server Type`（服务器类型）列表框中，选择你的 ISP 使用的入邮件服务器类型。\n\
  \n如果你不想在此计算机上接收电子邮件，请将其保持为 `None`（无）——如果你只想发送电子邮件，或者只想使用 `Evolution` 中的日历和任务管理功能，此设置将非常有用。根据你选择的项目，屏幕将发生变化并要求你提供相应的信息。我们假设你正在使用\
  \ `POP` 邮件服务器接收邮件；这些选项如图 10-2 所示。如果你没有使用 `POP`，请完成当前屏幕显示的操作，然后继续到第 17 步。\n\n**图\
  \ 10-2：** Evolution 接收邮件屏幕，已选择 `POP`。\n\n最新版本的 `Evolution` 已支持 Microsoft Exchange\
  \ 服务器。如果你需要此功能，你的发行版可能已经安装或可能未安装该功能。请参考第 16 章中的信息为你的系统添加 `Evolution-connector` 软件包，然后重启\
  \ `Evolution` 设置过程。\n\n### 第 10 章：向世界发送电子邮件\n\n### 6. 在 `Server`（服务器）文本框中输入你的 `POP`\
  \ 邮件服务器的完整名称。\n\n该名称可能是像 `pop.example.com` 这样的地址。\n\n### 7. 在 `Username`（用户名）文本框中输入你检查邮件的登录名称。\n\
  \n如果（例如）你的电子邮件地址是 `jane@example.com`，你的用户名就是 `jane`。\n\n### 8. 如果你被告知使用 `SSL` 进行安全，请在\
  \ `Use Secure Connection (SSL)`（使用安全连接 (SSL)）下拉列表框中根据你的 ISP 的规定选择 `Always`（始终）或\
  \ `Whenever Possible`（尽可能）。\n\n### 9. 在 `Authentication Type`（验证类型）下，选择合适的身份验证选项。\n\
  \n如果你不知道你的邮件服务器使用什么种的验证，请点击 `Check for Supported Types`（检查支持类型）按钮。如果你的 ISP 服务器支持加密验证方法，`Evolution`\
  \ 将自动检测并使用它。通常，验证方法只是明文密码，因此你可以选择 `Password`（密码）选项。\n\n### 10. 勾选 `Remember Password`（记住密码）复选框，这样每次检查邮件时无需输入电子邮件密码。\n\
  \n如果你打算离开电脑且其他人可能会访问，请前往 `Main Menu`（主菜单）并选择 `Lock Screen`（锁定屏幕），以保护自己免受恶意恶作邮件的影响。这样做可以在你输入登录密码之前，没有人可以使用你的\
  \ `GUI`。（注意，你必须开启屏幕保护程序此功能才能生效。屏幕保护程序默认开启的。）\n\n### 11. 点击“前进”（Forward）。\n\n下一个显示的屏幕取决于你正在使用的入邮件服务器的类型。如果你使用的是\
  \ `POP`，将打开“接收选项”（Receiving Options）屏幕，如图 10-3 所示。\n\n### 12. 如果你想自动检查新邮件，请勾选 `Check\
  \ for New Messages Every`（每隔检查新消息）复选框。\n\n如果你没有持续的连接，可能更喜欢手动检查邮件。如果是这样，请取消勾选该框并跳到第\
  \ 14 步。\n\n### 13. 在 `Minutes`（分钟）文本框中，设置你想自动检查新邮件的频率。\n\n### 14. 如果你从多台计算机检查邮件，请勾选\
  \ `Leave Messages on Server`（在服务器上保留邮件）复选框，以便你可以从所有机器访问相同的消息。\n\n如果你选择了此选项，多个机器上会有消息副本——但也意味着无论你在何处检查，都可以访问你的电子邮件。请记住，有时你需要取消勾选此框，检查邮件，并清理旧邮件在服务器上占用的所有空间。你不希望空间耗尽。\n\
  \n![Image 86](img/index-201_1.jpg)\n\n**图 10-3：** Evolution 接收选项屏幕，适用于 `POP` 邮件用户。\n\
  \n你还可以勾选 `Delete After`（之后删除）复选框，并选择在服务器上保留消息的天数。任何早于该时间的邮件将自动从服务器上删除。\n\n### 15.\
  \ 如果你的 ISP 告诉你不要使用 `POP3` 扩展，请勾选 `Disable Support for All POP3 Extensions`（禁用所有\
  \ POP3 扩展支持）复选框。\n\n### 16. 点击“前进”（Forward）继续。\n\n出现“发送邮件”（Sending E-Mail）屏幕，如图\
  \ 10-4 所示，这表示你已完成入邮件设置。\n\n### 17. 如果你的类型不是 `SMTP`，请更改 `Server Type` 输入。\n\n我们假设你正在使用\
  \ `SMTP` 发送电子邮件。\n\n### 18. 在 `Server` 文本框中输入 `SMTP` 邮件服务器的完整名称。\n\n该名称可能是像 `smtp.example.com`\
  \ 这样的地址。\n\n### 19. 如果你被告知发送邮件需要额外的验证，请勾选 `Server Requires Authentication`（服务器需要验证）复选框。\n\
  \n如今，许多 ISP 在允许你转发邮件之前都需要身份验证。如果你没有勾选此框，请跳到第 24 步。\n\n如果你被告知使用 `SSL` 进行安全，请在 `Use\
  \ Secure Connection (SSL)`（使用安全连接 (SSL)）下拉列表框中根据你的 ISP 的规定选择 `Always`（始终）或 `Whenever\
  \ Possible`（尽可能）。\n\n![Image 87](img/index-202_1.jpg)\n\n**图 10-4：** Evolution 发送邮件屏幕。\n\
  \n### 20. 在 `Authentication`（验证）下，根据 ISP 的指示选择合适的 `Type`（类型）。\n\n如果你不确定，点击 `Check\
  \ for Supported Types`。\n\n### 21. 在 `Username`（用户名）下输入验证发送邮件服务器所需的登录名称。\n\n此名称可能与你入邮件的名称不同。\n\
  \n### 22. 勾选 `Remember Password`（记住密码）复选框，这样每次发送邮件时无需输入密码。\n\n### 23. 点击“前进”（Forward）继续。\n\
  \n你现在到了简单的“账户管理”（Account Management）屏幕。\n\n### 24. 保持 `Name`（名称）输入不变（电子邮件地址），或将其更改为描述性内容，以便在有多个账户时识别你正在查看哪一个。\n\
  \n通常情况下，你的电子邮件地址在这个最终框中显示为类似 `jane@computer5.example.com` 的内容。如果你也遇到了这种情况，你需要编辑它以匹配你真实的电子邮件地址（对于\
  \ Jane 来说是 `jane@example.com`）。\n\n![Image 88](img/index-203_1.jpg)\n\n### 25. 点击“前进”（Forward）继续。\n\
  \n进入“时区”（Time Zone）屏幕。\n\n在时区地图上选择离你最近的城市，或使用 `Select` 下拉列表选择正确的时区。\n\n### 26. 点击“前进”（Forward）进入“完成”（Done）屏幕。\n\
  \n在这里看到显示已完成的快速消息。\n\n### 27. 点击“应用”（Apply）保存设置。\n\n打开 `Evolution` 程序，如图 10-5 所示。\n\
  \n**图 10-5：** Evolution 窗口。\n\n## 发送和检查电子邮件\n\n以下步骤概述了如何创建并发送新邮件：\n\n1. 点击 `New`。\n\
  \n打开“写邮件”（Compose Message）窗口，如图 10-6 所示。\n\n2. 在 `To` 文本框中输入接收者的电子邮件地址（如 `bob@example.net`）或用逗号分隔的地址列表（如\
  \ `bob@example.net, tom@example.org`）。\n\n3. 如果你需要在接收者列表中添加 `CC`（抄送）或 `BCC`（密抄），请从菜单中选择\
  \ `View`（查看），选择相应的字段使其出现，然后在这些字段中输入相应的地址。\n\n![Image 89](img/index-204_1.jpg)\n\n\
  **图 10-6：** Evolution 写邮件窗口。\n\n\n\n\n\n添加到 `CC` 字段的邮件地址将出现在邮件信息的头部中，所有人都能看到。添加到\
  \ `BCC` 字段的邮件地址不会出现在邮件信息的头部（但邮件仍然会投送给他们）。这是一种隐蔽（好吧，也许只是`谨慎`）在不让他人知道的情况下向某人发送邮件副本的方法。\n\
  \n### 4. 在 Subject（主题）文本框中输入你电子邮件的主题。\n\n### 5. 在下方窗口中，输入你的电子邮件正文。\n\n如果你想“美化”你的电子邮件，可以使用方便的格式化按钮和\
  \ `Format`（格式）菜单。如果你想使用格式化按钮，请先将你的 `Format` 类型设置为 `HTML`。\n\n### 6. 如果你想在电子邮件底部添加签名，请点击\
  \ `Signature`（签名）旁边的下拉列表并选择 `Autogenerated`（自动生成）。\n\n要创建自定义签名，请进入 Evolution 主窗口并选择\
  \ `Edit ➪Preferences` 以打开 `Evolution Preferences`（Evolution 首）对话框（见图 10-7）。选择你想创建签名的账户，然后点击\
  \ `Edit` 按钮打开 `Evolution Account Editor`（Evolution 账户编辑器）。\n\n![Image 90](img/index-205_1.jpg)\n\
  \n192 **第三部分：完成工作**\n\n在此对话框中，在 `Identity`（标识）选项卡中，点击 `Add New Signature`（添加新签名）。在这里，你可以创建并格式化新签名，点击\
  \ `Save and Close`（保存并关闭）按钮后，你可以在 `Identity` 选项卡的 `Signature` 下拉列表中选择哪个签名作为默认。点击每个对话框上的\
  \ `OK` 或 `Close` 来移除额外的对话框。\n\n**图 10-7:**\n\nEvolution Preferences 对话框。\n\n###\
  \ 7. 完成消息内容的输入后，点击 `Send`（发送）按钮。\n\n邮件现在已添加到你的 `Outbox`（发件箱），如果你需要，可以在那里进行编辑。\n\n\
  ### 8. 点击 `Send/Receive`（发送/接收）按钮。\n\n你的电子邮件将发出，Evolution 将检查是否有新的传入邮件。\n\n花些时间真正探索\
  \ Evolution。正如从本章的插图中所示，此程序有很多功能，包括过滤垃圾邮件的能力。\n\n![Image 91](img/index-206_1.jpg)\n\
  \n### 第 10 章：向世界发送电子邮件\n\n193\n\n## 使用 KMail\n\n使用 KDE 桌面的 Linux 发行版通常提供 `KMail`\
  \ 应用用于访问电子邮件。`KMail` 是另一个像 Evolution 的全功能包——它在一个窗口中提供了电子邮件客户端、日历和任务调度器。\n\n本节将介绍你让\
  \ KMail 软件与你的 ISP（互联网服务提供商）协同工作所需的步骤，然后向你展示如何发送和接收电子邮件。\n\n### 设置 KMail\n\n你通常可以通过选择\
  \ `Applications➪Internet ➪Kmail` 找到 `KMail` 应用（见第 5 章）。第一次启动 KMail 时你会遇到 `KMail\
  \ Welcome Wizard`（KMail 欢迎向导），如图 10-8 所示。\n\n**图 10-8:**\n\n设置邮件的 KMail 欢迎向导。\n\n\
  只需点击 `Next`（下一步）按钮开始配置过程。然而，在你开始发送接收电子邮件之前，你需要告诉 KMail 如何与你的 ISP 邮件服务器交互。与单体的 Evolution\
  \ 设置向导不同，KMail 的向导要紧凑一点：\n\n### 1. 选择你的 ISP 邮件服务器类型，并点击 `Next`。\n\n账户类型标识了你为获取电子邮件而连接的服务器类型。图\
  \ 10-9 显示了你可以使用的选项。最常见的是 `POP3` 和 `IMAP`。`KMail` 还允许你连接到工作站上的邮箱，除非你与其他人共享工作站（或者你只是喜欢给自己发消息），否则这有点愚蠢。\n\
  \n![Image 92](img/index-207_1.jpg)\n\n![Image 93](img/index-207_2.jpg)\n\n194 **第三部分：完成工作**\n\
  \n**图 10-9:**\n\nKMail 账户类型屏幕。\n\n### 2. 输入你的账户信息，并点击 `Next`。\n\n出现 `Account Information`（账户信息）屏幕，要求你输入真实姓名、电子邮件地址以及一个可选的组织名称，这些内容将以在你发出的邮件中显示的形式出现（见图\
  \ 10-10）。输入电子邮件地址时要小心，因为他人将回复到该地址。\n\n**图 10-10:**\n\nKMail 账户信息屏幕。\n\n### 3. 输入你的\
  \ ISP 登录信息，并点击 `Next`。\n\n有些 ISP 为连接邮件服务器分配单独的用户名 ID 和密码，而另一些则仅使用你的电子邮件地址。输入你的 ISP\
  \ 使用的任何一种。\n\n### 4. 输入你的 ISP 服务器信息，并点击 `Next`。\n\n`Server Information`（服务器信息）屏幕要求提供你\
  \ ISP 账户的入站和出站服务器名称（如图 10-11 所示）。入站服务器是 `POP3` 或 `IMAP` 服务器。出站服务器是你的 `SMTP` 服务器。（不幸的是，你无法在此处配置任何高级设置，例如\
  \ `SSL` 访问。如果你的 ISP 服务器需要这些设置，你需要按照后文的说明对其进行设置。）\n\n![Image 94](img/index-208_1.jpg)\n\
  \n![Image 95](img/index-208_2.jpg)\n\n### 第 10 章：向世界发送电子邮件\n\n195\n\nKMail 欢迎向导结束，下一个向导\
  \ `KWallet` 自动启动。\n\n**图 10-11:**\n\nKMail 服务器信息屏幕。\n\n### 5. 在 KWallet 中选择 Basic\
  \ setup（基础设置），然后输入你的密码。\n\n就像在钱包里放小纸条一样，`KWallet` 将你所有的密码存储在一个位置。这使得存储密码变得容易得多。\n\
  \n### 6. 勾选使用 KWallet 的复选框，输入并确认你的密码。\n\nKWallet 向导完成，你看到了主 KMail 窗口，如图 10-12 所示。\n\
  \n**图 10-12:**\n\nKMail 窗口。\n\n![Image 96](img/index-209_1.jpg)\n\n196 **第三部分：完成工作**\n\
  \n## 定制 KMail\n\n主 KMail 窗口分为四个部分：\n\n- **Favorite folders**（收藏夹文件夹）：如果你有多个电子邮件账户，它可以让你快速访问常用文件夹。\n\
  - **Folder**（文件夹）：显示 KMail 中使用的文件夹。\n- **Message list**（消息列表）：显示你的消息，可以点击任何列进行排序。\n\
  - **Preview pane**（预览窗格）：显示选中的电子邮件。\n\n在你开始使用任何功能之前，你可能需要自定义设置。要执行此操作，请选择 `Settings➪Configure\
  \ KMail`。出现的 `Configure` 对话框如图 10-13 所示\n\n**图 10-13:**\n\nKMail 配置对话框。\n\n要为你的电子邮件添加设置，请遵循以下步骤：\n\
  \n### 1. 点击左窗格中的 Accounts 图标。\n\n账户窗口有两个选项卡——一个用于接收，一个用于发送。确保先选中 `Receiving`（接收）。\n\
  \n![Image 97](img/index-210_1.jpg)\n\n### 2. 选择要配置的账户，并点击 `Modify` 按钮。\n\n出现 `Modify\
  \ Account` 对话框，如图 10-14 所示。\n\n**图 10-14:**\n\nKMail 修改账户对话框。\n\n### 3. 修改 Modify\
  \ Account 对话框中的设置并点击 `OK`。\n\n`Modify Account` 对话框包含三个选项卡：\n\n- *General*（通用）：包含通用信息，如\
  \ ISP 服务器主机、使用的 TCP 端口和登录信息。\n- *Advanced*（高级）：包含在 ISP 服务器上保留消息的时间设置。\n- *Security*（安全）：包含\
  \ ISP 服务器使用的加密和身份验证方法设置。\n\n### 4. 选择 Accounts 页面中的 Sending 选项卡查看 SMTP 服务器设置；然后选择用于发送邮件的电子邮件账户，点击\
  \ `Modify` 按钮。\n\n如果你的 Linux 发行版配置了本地电子邮件服务器程序，你可能会在这里看到另一个本地邮件投递选项。确保你选择了与你的 ISP\
  \ 账户对应的条目。你看到了 `Modify Transport` 对话框，如图 10-15 所示。\n\n![Image 98](img/index-211_1.jpg)\n\
  \n198 **第三部分：完成工作**\n\n**图 10-15:**\n\nKMail 修改传输对话框。\n\n### 5. 修改 Modify Transport\
  \ 对话框中的设置并点击 `OK`。\n\n\n\n\n修改传输（Modify Transport）对话框包含两个选项卡：\n\n- `General`（通用）：此选项卡包含\
  \ SMTP 服务器主机名和端口号的设置，并指定连接是否使用加密。\n- `Advanced`（高级）：此选项卡包含用于验证 SMTP 服务器以转发电子邮件的设置。\n\
  \n6. 点击 `OK` 退出配置（Configure）对话框。\n\n现在你的 KMail 软件已经配置完成，可以开始使用了。\n\n从 KMail 主窗口（参考图\
  \ 10-12），你只需选择文件夹（Folders）部分中的收件箱项即可查看收件箱。要检查邮箱，点击工具栏上的 `Check Mail`（检查邮件）图标手动连接到你的\
  \ ISP 服务器。\n\n发送电子邮件与点击工具栏上的 `New`（新建）按钮一样简单。\n\n图 10-16 显示的 `Composer`（撰写器）窗口具有标准的电子邮件布局，这正如我们在“演变为电子邮件：演进”章节中所讨论过的。\n\
  \n![Image 99](img/index-212_1.jpg)\n\n### 第 10 章：向世界发送电子邮件\n\n199\n\n**图 10-16：**\
  \ KMail 撰写窗口。\n\n## 处理垃圾邮件\n\nKMail 的一个非常棒的功能是它的自动垃圾邮件和病毒过滤能力。KMail 可以扫描你的传入邮件并自动过滤垃圾邮件和病毒。如今，`spam`（正式名称为`垃圾商业邮件`）可能会淹没你的收件箱，及早并重定向这些垃圾信息非常有用。\n\
  \nFedora 和 Ubuntu 的默认设置中都包含了垃圾过滤程序，但你必须在 KMail 配置中启用它们。要这样做，只需按照以下步骤操作：\n\n1. 选择\
  \ `Tools`（工具）➪`Anti-Spam Wizard`（反垃圾向导）启动向导，在检测到垃圾过滤器后点击 `Next`（下一步）。\n\n向导会扫描电脑上已安装的垃圾过滤器程序——你的\
  \ Linux 发行版可能自带（Fedora 安装 `SpamBayes`；Ubuntu 包含 `Bogofilter`）。向导检测到已安装的程序后，如图 10-17\
  \ 所示。\n\n2. 选择 KMail 如何处理垃圾邮件，然后点击 `Next`。\n\n你可以配置 KMail 仅将垃圾邮件标记为已读，这样它就不会计入你的未读消息总数；或者让它自动将任何它认为是垃圾邮件的消息移动到单独的文件夹中。\n\
  \n3. 你的选择，点击 `Finish`（完成）按钮。\n\n![Image 100](img/index-213_1.jpg)\n\n200 第三部分：搞定工作\n\
  \n**图 10-17：** KMail 反垃圾向导。\n\n垃圾邮件检测仍然是一个不断完善的过程。目前没有一种解决方案可以检测所有可能的垃圾邮件，因此你必须时刻保持警惕。大多数垃圾过滤器会在运行过程中不断学习，因此你的垃圾过滤器可能需要一段时间才能习惯识别你收到的垃圾邮件。请务必检查垃圾邮件文件夹，查看任何被错误标记为垃圾邮件的邮件。你可以取消标记，以帮助垃圾过滤器学习哪些可以和哪些不可以被丢弃。\n\
  \n# 第 11 章：让文本更有深度\n\n## 本章内容\n- 在 `gedit` 中处理文本文件\n- 在 `KWrite` 中进行编辑\n\n从文本编辑器到文字处理器，Linux\
  \ 为文字处理提供了多种选择方案。在本章中，我们将使用 GUI 环境中的一些简单文本编辑器来查看文本文件内容的不同方法。在第 12 章，我们将介绍适合倾向于进行文字处理的办公套件。\n\
  \n## 使用 gedit\n\n有很多图形化选项。在本节中，我们将介绍 `gedit`（见图 11-1），它是 GNOME 桌面面的默认 GUI 文本编辑器。在\
  \ Ubuntu 或 Fedora 的面板菜单中选择 `Applications`（应用程序）➪`Accessories`（附件）➪`Text Editor`（文本编辑器）即可启动\
  \ `gedit`。\n\n`gedit` 是纯粹的文本编辑器；你用它生成原始文本，而 `word processor`（文字处理器）创建的是只有能读取该格式的程序才能打开标记文本。如果你想在文档中添加粗体、斜体、下划线或其他特殊功能，请阅读第\
  \ 12 章。\n\n![Image 101](img/index-215_1.jpg)\n\n202 第三部分：搞定工作\n\n**图 11-1：** Ubuntu\
  \ 中的 gedit 窗口，显示空白文件。\n\n### 在 gedit 中输入和编辑文本\n\n要在 `gedit` 中输入文本，只需点击大空白区域并开始打字。你可以使用标准的编辑工具集，如剪切、粘贴和复制。要使用这些工具，选择你要处理的文本，然后点击\
  \ `gedit` 工具栏上的相应按钮（或右键点击并从上下文菜单中选择相应命令）。\n\n这个特定文本编辑器有趣之处在于它的插件。`gedit` 插件提供了高级功能，可以将简单的\
  \ `gedit` 文本编辑器变成一个近乎全功能的文字处理器。可用的一些流行的插件可以进行拼写检查、自动缩进行、添加当前日期和时间，甚至提供句子、单词和字符计数。（我们将在“设置偏好”部分中讨论其他插件。）\n\
  \n### 保存工作\n\n与大多数程序一样，你有两种保存工作选择。你可以保存工作并继续，也可以保存后关闭程序。只需保存文件并继续，请遵循以下步骤：\n\n1.\
  \ 点击 `Save`（保存）按钮。该按钮看起来像软磁盘。如果你从未保存过此文件，点击它将打开 `Save As`（另存为）对话框。\n2. 在 `Save In\
  \ Folder`（保存到文件夹）下拉列表中选择一个文件夹来保存文件，或者点击 `Browse for Other Folders`（浏览其他文件夹）旁边的右箭头打开文件浏览部分。\n\
  对话框会展开，允许你浏览到想要使用的位置。\n3. 如必要，浏览左面板或右面板中的目录，直到进入你想要保存文件的目录。双击目录名称进入该目录——或双击左面板中的项跳转到其位置。\n\
  4. 在 `Name`（文件名）文本框中输入文件名。\n5. 点击 `Save` 保存文件。\n对话框关闭。\n\n要关闭 `gedit`，请遵循以下步骤：\n\
  \n1. 选择 `File`（文件）➪`Quit`（退出）。\n如果你自上次更改文件以来没有保存，将出现 `Question`（询问）对话框。\n2. 如果你看到对话框，点击\
  \ `Save` 保存你的工作，或点击 `Close Without Saving`（不保存并关闭）放弃它。\n程序将关闭，除非你打开了多个文件——在这种情况下，你会为每个已修改未保存的文件看到\
  \ `Question` 对话框。\n\n### 设置偏好\n\n`gedit` 偏好是你用来设置 `gedit` 的外观和感觉。图 11-2 显示的 `gedit`\
  \ Preferences（偏好）对话框包含几个不同的功能。在这里，你可以自定义 `gedit` 编辑器的操作。`Preferences` 对话框包含四个选项卡区域，用于设置编辑器的功能和行为。\n\
  \n![Image 102](img/index-217_1.jpg)\n\n204 第三部分：搞定工作\n\n**图 11-2：** gedit 偏好对话框。\n\
  \n#### 查看\n\n`View`选项卡提供了 `gedit` 在编辑器窗口中显示文本的选项：\n\n- **Text Wrapping（文本换行）：**\
  \ 决定处理编辑器中的长行。选择 `Enable Text Wrapping`（启用文本换行）复选框会将长行折到编辑器的下一行。如果你选择 `Do Not Split\
  \ Words Over Two Lines`（不要将单词跨行分割）复选框，它可以防止在行尾的长单词音节之间自动插入连字符。\n- **Line Numbers（行号）：**\
  \ 在编辑器窗口的左边距显示行号。\n- **Current Line（当前行）：** 高亮显示光标所在的行，方便你轻松找到光标位置。\n- **Right Margin（右边距）：**\
  \ 启用右边距，并允许你设置编辑器窗口应包含多少列。默认值为 80 列。\n- **Bracket Matching（括号匹配）：** 启用后，将高亮编程代码中的括号对，以便你能够轻松匹配\
  \ if-then 语句、for 和 while 循环以及使用括号的其他代码元素中的括号。\n\n\n\n\n\n行号显示和括号匹配功能帮助程序员排查代码故障——这些便利功能在某些文本编辑器中是找不到的。\n\
  \n如果你正在使用 `gedit` 编辑代码，请选择 `View ➪Highlight Mode`。\n\n你可以从列表中选择你正在使用的编程语言来自定义 `gedit`。你的代码将以不同的颜色显示不同的元素（如变量名、常量和文本）。\n\
  \n# 第 11 章：文本编辑\n\n## 编辑 (Editor)\n\n`Editor` 选项卡提供了 `gedit` 编辑器处理制表符和缩进的选项，以及文件保存的方式：\n\
  \n- **制表停止 (Tab Stops):** 设置按下 `Tab` 键时跳过的空格数。默认值为八。此功能还包含一个复选框，选中后将插入空格而不是制表跳进。\n\
  - **自动缩进 (Automatic Indentation):** 启用后，`gedit` 会自动对段落和代码元素（如 `if-then` 语句和循环）进行行缩进。\n\
  - **文件保存 (File Saving):** 提供两种保存文件的选择：在编辑窗口中打开文件时是否创建备份副本，以及是否按预设间隔自动保存文件。\n\n##\
  \ 字体与颜色 (Font & Colors)\n\n`Font & Colors` 选项卡允许你配置（意不意外）两个项目：\n\n- **字体 (Font):**\
  \ 允许你选择默认字体 `Monospace 10`，或从对话框中选择自定义的字体和字号。\n- **配色方案 (Color Scheme):** 允许你选择用于文本、背景、选中文本和选择颜色的默认配色方案，或为每个类别选择自定义颜色。\n\
  \n`gedit` 的默认颜色与桌面选择的标准 `GNOME` 桌面主题匹配。这些颜色会改变以匹配你为桌面选择的方案。\n\n## 插件 (Plugins)\n\
  \n`Plugins` 选项卡提供了对 `gedit` 使用插件的控制。插件是独立的程序，可以与 `gedit` 接口以提供额外功能。\n\n要安装插件，请遵循以下步骤：\n\
  \n1. **点击 `PlugIns` 选项卡。**\n`PlugIns` 选项卡的内容将会，如图 11-3 所示。\n2. **点击 `PlugIns` 选项卡中你感兴趣的项目。**\n\
  如果你想了解关于某个插件的更多信息，点击 `About Plug-In` 按钮。点击 `Close` 关闭 `About` 窗口。\n\n![Image 103](img/index-219_1.jpg)\n\
  \n**图 11-3:** `gedit` 插件偏好选项卡。\n\n3. **当你找到想要的插件时，勾选其复选框以激活。**\n如果复选框中出现勾选，则插件已激活。\n\
  4. **如果所选插件的 `Configure PlugIn` 按钮变为激活状态，点击该按钮打开工具的 `PlugIn Configuration` 对话框。**\n\
  此对话框根据你使用的插件而不同。\n5. **配置你的插件并点击 `OK` 返回 `Preferences` 对话框。**\n6. **如果你需要额外的插件，请重复第\
  \ 3 和第 4 步。**\n7. **当你完成插件选择后，点击 `Close` 关闭 `Preferences` 对话框。**\n\n你现在可以从 `gedit`\
  \ 菜单访问插件了，如图 11-4 所示。每个插件都放置在其相应的位置；例如，`Change Case` 出现在 `Edit` 菜单中，而拼写检查器出现在 `Tools`\
  \ 菜单中。\n\n![Image 104](img/index-220_1.jpg)\n![Image 105](img/index-220_2.jpg)\n\
  \n**图 11-4:** 在 `gedit` 中使用拼写检查器。\n\n## 在 KDE 桌面编辑文本：KWrite\n\n`KDE` 环境也提供了一种图形化编辑文本文件的方法。`KDE`\
  \ 环境的基础编辑器是 `KWrite`。它提供了简单的文字处理式文本编辑，并支持代码语法高亮和编辑。\n\n要打开 `KWrite`，从桌面上的 `KDE`\
  \ 菜单系统中选择 `KWrite`。（在 Fedora 中，它位于 `Utilities` 部分。某些 Linux 发行版甚至为它创建一个 `Panel` 图标。）默认的\
  \ `KWrite` 编辑窗口如图 11-5 所示。\n\n**图 11-5:** 默认的 `KWrite` 窗口。\n\n`KWrite` 编辑窗口提供了完整的剪切和粘贴功能，可以使用鼠标和方向键。就像在文字处理器中一样，可以在缓冲区区域的任何地方剪切（或复制）文本并粘贴到任何其他地方。\n\
  \n菜单栏包含以下项目：\n\n- **文件 (File):** 从文件中加载、保存、打印和导出文本。\n- **编辑 (Edit):** 操作缓冲区区域的文本。\n\
  - **视图 (View):** 管理文本在编辑器窗口中的显示方式。\n- **工具 (Tools):** 使用专门的功能处理文本。\n- **设置 (Settings):**\
  \ 配置编辑器处理文本的方式。\n- **帮助 (Help):** 获取有关编辑器和命令的信息。\n\n`Edit` 菜单提供了你所有的文本编辑需求。你不需要记住晦涩的键命令（顺便说，`KWrite`\
  \ 也支持），你可以从 `Edit` 菜单中选择项目，如表 11-1 所示。\n\n### 表 11-1：KWrite 编辑菜单\n\n| 项目 | 功能 |\n\
  | :--- | :--- |\n| Undo (撤销) | 撤销上一次动作或操作。 |\n| Redo (重做) | 消上一次撤销操作。 |\n| Cut (剪切)\
  \ | 删除选中的文本并将其放入剪贴板。 |\n| Copy (复制) | 将选中的文本复制到剪贴板。 |\n| Paste (粘贴) | 将剪贴板当前内容插入到当前光标位置。\
  \ |\n| Select All (全选) | 选中编辑器中的所有文本。 |\n| Deselect (取消选择) | 取消任何当前选中的文本。 |\n| Overwrite\
  \ (覆盖) | 将插入模式切换到覆盖模式，用输入的新模式文本替换文本，而不仅仅是插入新文本。 |\n| Find (查找) | 产生 `Find Text`\
  \ 对话框，允许你自定义文本搜索。 |\n| Find Next (查找下一个) | 在缓冲区区域向后重复上一次查找操作。 |\n| Find Previous\
  \ (查找上一个) | 在缓冲区区域向后重复上一次查找操作。 |\n| Replace (替换) | 产生 `Replace With` 对话框，允许你自定义想要查找和替换的文本。\
  \ |\n| Find Selected (查找选中项) | 在文档中定位选中文本的下一次出现。 |\n| Find Selected (查找选中项) | 在后后文档中定位选中文本的上一次出现。\
  \ |\n| Go to Line (跳转到行) | 产生 `Goto` 对话框，允许你输入行号。光标移动到指定行。 |\n\n![Image 106](img/index-222_1.jpg)\n\
  \n**图 11-6:** `KWrite` 查找文本对话框。\n\n图 11-6 所示的 `Find Text` 对话框是搜索文件中文本的强大工具。`Find\
  \ Text` 对话框使用当前光标处的单词作为默认搜索文本值。点击 `Options` 按钮自定义搜索，例如是否执行区分大小写的搜索，或只查找整个单词而不是在单词内查找文本。\n\
  \n`Tools` 菜单提供了若干处理缓冲区区域文本的方便功能。表 11-2 描述了 KWrite 可用的工具。\n\n### 表 11-2：KWrite 工具\n\
  \n| 工具 | 功能 |\n| :--- | :--- |\n| Read Only Mode (只读模式) | 锁定文本，使其在编辑器中无法更改。 |\n\
  | Indentation (缩进) | 根据选择自动对行进行缩进。 |\n| Encoding (编码) | 指定文本使用的字符集编码。这定义了使用什么代码表示什么字符。`KWrite`\
  \ 支持许多不同的字符集代码来表示许多语言。 |\n| Spelling (拼写检查) | 从文本开始启动拼写检查。 |\n| Spelling (from cursor)\
  \ (从光标) | 从当前光标位置启动拼写检查。 |\n| Spellcheck Selection (检查选择) | 仅对选择文本部分启动拼写检查。 |\n\
  | Indent (缩进) | 增加一级缩进。 |\n| Unindent (取消缩进) | 减少一级缩进。 |\n| Clean Indentation (清理缩进)\
  \ | 将所有缩进返回原始设置。 |\n| Align (对齐) | 强制当前行或选中行返回默认缩进设置。 |\n| Uppercase (大) | 将选中的文本或当前光标处的字符设为大写。\
  \ |\n| Lowercase (小写) | 将选中的文本或当前光标处的字符设为小写。 |\n\n\n\n\n将所选文本或当前光标位置的字符转换为小写。\n\n\
  ### 大写化\n将所选文本或当前光标位置处单词的首字母转换为大写。\n\n### 合并行\n合并所选的行，或将当前光标位置的行与下一行合并。\n\n### 自动换行\n\
  启用文本的自动换行功能。如果一行文本 `Document` 超出了编辑器窗口的边缘，文本将继续在下一行显示。\n\n设置菜单包含 `Configure Editor`\
  \ 对话框（如图 11-7 所示），你可以在其中调整编辑器窗口以适应你的工作。选择 `Settings➪Configure Editor` 来查看你可以自定义的内容。\n\
  \n![Image 107](img/index-224_1.jpg)\n\n# 第 11 章：让文本更有灵魂\n\n211 **图 11-7：**\n\nKWrite\
  \ 配置编辑器对话框。\n\n点击对话框左侧的图标来配置功能。对话框的右侧显示每个功能的配置设置。\n\n`Appearance` 设置允许你设置文本在文本编辑器窗口中的显示方式。你可以启用自动换行、行号（这对程序员非常有帮助）和文件夹标记。通过\
  \ `Fonts & Colors` 功能，你可以自定义编辑器的配色方案，决定为程序代码中的每类文本分配哪些颜色。\n\nKWrite 编辑器识别多种编程语言，并使用颜色编码来区分常量、函数和注释。此外，注意代码中的\
  \ `for` 循环有一个图标，可以连接左括号和右括号。\n\n这被称为 `folding marker`。通过点击该图标，你可以将函数折叠为单行。\n\n212\
  \ **第三部分：搞定任务**\n\n# 第 12 章：使用 OpenOffice.org 进行文字处理及更多操作\n\n## 本章内容\n- 安装 OpenOffice.org\
  \ 套件\n- 使用 OpenOffice.org Writer 进行文字处理\n- 使用 OpenOffice.org Calc 进行“电子表格”\n- 使用\
  \ OpenOffice.org Impress 进行演示\n- 使用 OpenOffice.org Draw 进行绘图\n- 使用 OpenOffice.org\
  \ Base 管理数据\n- 使用 OpenOffice.org Math 编写公式\n\n*言辞飞，字字留。*\n—— 西班牙谚语，摘自 Delfín Carbonell\
  \ Basset 编写的《谚语字典》\n\n如今，几乎每个拥有电脑的人手头至少有一套办公套件。如果是 Microsoft Windows 用户，这套套件可能是\
  \ Microsoft Office，尽管也可能是另一个值得竞争的对手，例如 Corel WordPerfect Office。在 Linux 中，通常使用的套件是\
  \ OpenOffice.org。该套件包含 `Base`（数据库）、`Calc`（电子表格）、`Draw`（图表和图形）、`Impress`（用于演示）、`Math`（编写数学公式的文字处理器）以及\
  \ `Writer`（用于文字处理）。\n\n在你学会如何使用该套件中的某一个程序后，你可能会发现发现其他程序的设计外观和工作方式非常相似。如果你需要与使用该产品的人分享，你甚至可以打开并保存\
  \ Microsoft Office 格式的文件——你也可以编辑别人发送给你的 Office 文件。\n\n关于 OpenOffice.org 的介绍到此为止。在本章中，你将能够实际*使用*它！\n\
  \n214 **第三部分：搞定任务** Linux 用户可用的其他办公套件包括商业版的 OpenOffice.org 衍生软件 StarOffice（`www.sun.com/staroffice`）、Applixware\
  \ Office（`www.vistasource.com/products`）、KOffice（`www.koffice.org`）以及 GNOME Office（`www.gnome.org/gnome-office/`）。\n\
  \n## 安装 OpenOffice.org 套件\n在开始创作你的杰作之前，你必须确保 OpenOffice.org 可用。当你安装 Fedora 时，安装选项之一就是安装办公生产力软件。如果你选择了该选项，你就安装了大部分\
  \ OpenOffice.org 套件程序。\n\n默认情况下，Fedora 在办公生产力安装中包含了这些 OpenOffice.org 包：\n- `Writer`\
  \ 用于文字处理\n- `Calc` 用于电子表格\n- `Impress` 用于演示文稿\n- `Draw` 用于绘制图形\n- `Math` 用于创建复杂的数学公式\n\
  \n然而，并不是所有的 Linux 发行版都安装了所有组件。例如，Ubuntu 默认只安装了 `Writer`、`Calc` 和 `Impress` 包。\n\n\
  还有一个可用的 OpenOffice.org 包，但它通常不默认安装：`Base`，用于创建个人数据库。\n\n如果你在安装时没有选择安装办公生产力软件，或者你需要安装某个\
  \ Linux 发行版中未默认安装的包，不要担心；你现在可以这样做，而无需重新安装整个 Linux 发行版。请参阅第 16 章，了解如何从你发行版使用的软件包管理器添加\
  \ OpenOffice.org 包。\n\n安装 OpenOffice.org 包后，你可以通过在 GNOME 或 KDE 中选择 `Applications➪Office`\
  \ 来找到它们的大部分（即使是你安装了额外的 `Base` 包）。\n\n两个异类是 `Draw` 和 `Math` 包，它们（遗憾的是）通常没有自己独立的列表条目。要访问其中任何一个包，你必须先启动其他\
  \ OpenOffice.org 程序之一（如 `Writer`），然后选择 `File➪New`。你会看到创建新 `Drawing`（启动 `Draw`）或新\
  \ `Formula`（启动 `Math`）的选项。\n\n![Image 108](img/index-228_1.jpg)\n\n215 **第 12 章：使用\
  \ OpenOffice.org 进行文字处理及更多操作**\n\n## 使用 OpenOffice.org 进行文字处理\n文字处理器如今几乎是必不可少的。孩子们用它们写信，祖父母们用它们写给孙辈。无论你是在写美国小说还是报告，OpenOffice.org\
  \ Writer 都包含了你对现代文字处理器的所有期待。\n\n### 熟悉 OpenOffice.org 界面\n在继续之前，请查看图 12-1 所示的 GUI\
  \ 布局。\n\n```\n标准格式\n菜单栏\n工具栏\n工具栏\n标尺\n文档\n```\n\n**图 12-1：** 布局。\n\n216 **第三部分：搞定任务**\
  \ 窗口顶部是菜单栏，如果你用过其他文字处理软件，应该对此很熟悉。OpenOffice.org Writer 包含了你期待文字处理器的所有功能。它的菜单选项太多，无法详尽介绍，因此我们为你提供了每个主要菜单的（非详尽）摘要：\n\
  \n- `文件`：常见的打开、保存、另存为、打印和打印预览（术语为页面预览）命令，以及一组向导（术语为 AutoPilot），此外还有通过电子邮件发送文档、创建模板、创建网页以及访问你的数据库信息的功能。\n\
  - `编辑`：常见的全选和查找命令，以及修订跟踪、文档合并和文档比较功能。\n- `视图`：常见的缩放功能和工具栏，以及显示或隐藏格式字符的功能，以便查看文档作为网页的样子。\n\
  - `插入`：常见的分页符和特殊字符，以及索引、表格、书签、页眉、页脚和交叉引用。\n- `格式`：常见的字符、段落和页面设置，以及样式、自动格式设置和列设置。\n\
  - `表格`：常见的表格控制选项，包括插入、删除和选择单元格，以及在表格和文本之间转换。\n- `工具`：常见的拼写检查和词典条目，此外连字符、自动纠错、图像库和参考文献数据库。\n\
  \n这些菜单的功能比这里列出的多。去查看一下；你可能会在某处发现一个新的喜爱的功能。\n\n菜单栏下方是标准工具栏。工具栏上的每个图标都代表一个不同的功能，详见表\
  \ 12-1。\n\n**表 12-1**\n\n**OpenOffice.org Writer 标准工具栏**\n\n***按钮或条目***\n\n***你可以执行的操作***\n\
