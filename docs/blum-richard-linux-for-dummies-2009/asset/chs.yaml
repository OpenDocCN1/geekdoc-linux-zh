  \n在任何其他情况下传递均仅在下面规定的条件下被允许。\n\n不允许分分许可；第 10 节已使其变得没有必要。\n\n## 3. 保护用户的法律权利免受反规避法律限制。任何受保护作品均不被视为\
  \ 1996 年 12 月 22 日通过的《WIPO 版权条约》第 11 条规定的任何适用法律履行义务下，或禁止或限制规避此类措施的类似法律的有效技术措施的一部分。\n\
  \n当您传递受保护作品时，对于禁止规避技术措施的任何法律权力，只要该等规避是由于根据本许可对受保护作品行使权利而实现的，您就放弃了该范围内的权力，并且您放弃了任何限制作品的运行或修改的意图，以作为一种手段，针对作品的用户执行您或第三方的禁止规避技术措施的法律权利。\n\
  \n## 4. 传递逐字副本。您可以按照接收到的状态，以任何媒介传递程序源代码的逐字副本，前提是您在每份副本上显著且适当地发布适当的版权声明；保留所有说明本许可及根据第\
  \ 7 节添加的任何非许可条款适用于代码的声明；保留所有关于无任何保证的声明；并随程序一起给所有接收者本许可的副本。\n\n您可以对传递的每份副本收取任何费用或不收取费用，并可以付费提供支持或保证保护。\n\
  \n## 5. 传递\n\n### 修改后的源代码版本。您可以根据第 4 节的条款，以源代码的形式传递基于程序的作品，或从程序产生该作品的修改部分，前提是您还满足了以下所有条件：\n\
  \na) 作品必须带有显著的声明，说明您对其经过了修改，并给出相关日期。\n\nb) 作品必须带有显著的声明，说明它是根据本许可及第 7 节下添加的任何条件发布的。此要求修改了第\
  \ 4 节中“保留所有声明”的要求。\n\nc) 您必须根据本许可向任何获得副本的任何人对整个作品（作为一个整体）进行许可。因此，本许可将连同任何适用的 7 节附加条款共同适用于整个作品及其所有部分，无论它们如何封装。本许可未授予以任何其他方式许可作品的许可，但如果您已单独获得此类许可，则不会使该许可失效。\n\
  \nd) 如果作品具有交互式用户界面，每个界面必须显示适当的法律通知；然而，如果程序具有不显示适当法律通知的交互式界面，您的作品无需要求它们显示。\n\n将受保护作品与其他单独且独立的作品组合在一起（这些独立作品在性质上不是受保护作品的扩展，且未与其组合形成更大的程序），并位于存储或分发介质中，被称为“聚合体”，前提是该组合及其产生的版权未被用于超出单个作品所允许的范围来限制聚合体用户的访问权限或法律权利。在聚合体中包含受保护作品不会导致本许可适用于聚合体的其他部分。\n\
  \n## 6. 传递非源代码形式。您可以根据第 4 节和第 5 节的条款以目标代码形式传递受保护作品，前提是您还根据本许可通过以下方式之一传递机器可读的对应源代码：\n\
  \na) 将目标代码封装在物理产品（包括物理分发介质）中，并随带固定在通常用于软件交换的耐用物理介质上的对应源代码。\n\nb) 将目标代码封装在物理产品（包括物理分发介质）中，并随带一份书面报价，该要约有效期至少三年，并在您为该产品型号提供备件或客户支持期间一直有效，向任何拥有目标代码的人提供：(1)\
  \ 通常用于软件交换的耐用物理介质上受本许可保护的产品中所有软件的对应源代码副本，价格不超过您物理传递这些源代码的合理成本；或 (2) 免费从网络服务器复制对应源代码的访问权限。\n\
  \nc) 传递目标代码的单份副本，并附带一份提供对应源代码的书面报价。这种替代方案仅在偶尔和非商业的情况下允许，且仅在您根据第 6b 节获得带有此类报价的目标代码时才允许。\n\
  \n\n\n\n\nd) 通过从指定地点（免费或收费）提供访问来传输目标代码，并以相同的方式通过相同地点免费提供对相应源代码（Corresponding Source）的等效访问。你不需要要求接收者随目标代码一起复制源代码。如果复制目标代码的地点是网络服务器，则源代码可以在不同的服务器上（由你或第三方运营），该服务器应支持等效复制设施，前提是在目标代码旁边维护了清晰的说明，说明可以在何处找到源代码。无论由哪个服务器托管源代码，你都有义务确保其在满足这些要求所需的时间内保持可用状态。\n\
  \ne) 使用点对点传输传输目标代码，前提是你要告知其他节点，根据第 6d 小节向公众免费提供该作品的目标代码和相应源代码的地点。\n\n目标代码中可分离的部分，如果其源代码作为“系统库”（System\
  \ Library）被排除在源代码之外，则无需包含在目标代码作品中。\n\n`用户产品`（User Product）是指 (1) `消费者产品`（consumer\
  \ product），即任何通常用于个人、家庭或家用用途的有形个人财产，或 (2) 任何设计或销售用于整合到房屋中的物品。在确定某个产品是否为消费者产品时，疑点应按照有利于涵盖的原则解决。对于特定用户收到的特定产品，`通常使用`指的是该类产品的典型或常见用途，无论特定用户的身份或该特定用户实际使用、预期或被预期使用产品的方式。无论该产品是否具有实质性的商业、工业或非消费者用途，它都是消费者产品，除非此类用途代表了该产品唯一的显著用途模式。\n\
  \n`用户产品`的`安装信息`（Installation Information）意味着为了从其相应源代码的修改版本在该用户产品中安装并执行受保护作品的修改版本所需的任何方法、程序、授权密钥或其他信息。这些信息必须足以确保在任何情况下，都不会仅仅因为进行了修改而阻止或干扰修改后的目标代码的持续运行。\n\
  \n如果你在本节下为`用户产品`中、与之一起或专门用于`用户产品`的使用而传输目标代码作品，且该传输发生在交易中，其中`用户产品`的所有权和使用权永久或按固定期限转给接收者（无论该交易如何界定），则根据本节传输的源代码必须附带`安装信息`。但如果你或任何第三方都不保留在`用户产品`上安装修改目标代码的能力（例如，作品已安装在\
  \ ROM 中），则此要求不适用。\n\n提供`安装信息`的要求不包括继续对被接收者修改或安装的作品提供支持服务、保修或更新，或对已修改或安装的`用户产品`提供服务。当修改本身实质性且不利地影响网络运行，或违反跨网络通信的规则和协议时，可能会拒绝访问网络。\n\
  \n根据本节传输的源代码和提供的`安装信息`必须采用公开文档的格式（并有源代码形式的供公众使用的实现），并且在解包、读取或复制不需要特殊的密码或密钥。\n\n\
  ## 7. 附加条款\n\n`附加许可`（Additional permissions）是指通过对本许可的一个或多个条件进行例外，来补充本许可条款的条款。适用于整个程序的附加许可，在适用法律有效的范围内，应被视为已包含在本许可中。如果某些附加许可仅适用于程序的一部分，则该部分可以根据这些许可单独使用，但整个程序仍受本许可的约束，不受附加许可的影响。\n\
  \n当你传输受保护作品的副本时，你可以根据自己的选择从该副本或其任何部分移除任何附加许可。（在某些情况下，当你修改作品时，附加许可可能被写要求自行移除。）你可以对你添加到受保护作品的材料添加附加许可，前提是你拥有或可以提供该材料的适当版权许可。\n\
  \n尽管有本许可的任何其他规定，对于你添加到受保护作品的材料，你可以（如果获得该材料版权持有者的授权）通过以下条款补充本许可的条款：\n\na) 与本许可第 15\
  \ 条和第 16 条条款不同的免责声明或责任限制；或\n\nb) 要求在这些材料或在包含它的作品的“适当法律通知”（Appropriate Legal Notices）中保留指定的合理法律通知或作者归属；或\n\
  \nc) 禁止对该材料的来源进行虚假陈述，或要求将此类材料的修改版本以合理的方式标记为与原始版本不同；或\n\nd) 限制材料许可方或作者名称的宣传目的使用；或\n\
  \ne) 拒绝根据商标法授予使用某些贸易名称、商标或服务标记的权利；或\n\nf) 要求传输该材料（或其修改版本）的人向接收者承担合同责任，对该材料的许可方和作者进行补偿，以补偿这些合同假设直接施加给这些许可方和作者的任何责任。\n\
  \n所有其他非许可性的附加条款均被视为第 10 条意义上的`进一步限制`（further restrictions）。如果你收到的程序或其任何部分包含一份声明其受本许可约束并附带一项进一步限制条款的通知，你可以移除该条款。如果许可文件包含进一步限制，但允许根据本许可进行重新许可或传输，你可以在受保护作品中添加受该许可文件条款约束的材料，但前提是该进一步限制不会在此类重新许可或传输后继续存在。\n\
  \n如果你根据本节向受保护作品中添加条款，你必须在相关的源文件中放置适用于这些文件的附加条款声明，或者指示在何处找到适用条款的通知。\n\n附加条款（许可性的或非许可性的）都可以以单独编写的许可的形式规定或作为例外列出；上述要求均适用。\n\
  \n## 8. 终止\n\n除非本许可明确规定，否则你不得传播或修改受保护作品。任何其他传播或修改它的尝试都是无效的，并将自动终止你在本许可下的权利（包括根据第\
  \ 11 条第三段授予的任何专利许可）。\n\n然而，如果你停止了所有对本许可的违反，那么从特定版权持有者处的许可将恢复：(a) 临时恢复，直到版权持有者明确且最终地终止你的许可，并且\
  \ (b) 如果版权持有者在停止后 60 天内未能通过某种合理手段通知你违规，则永久恢复。\n\n\n\n\n\n此外，如果版权所有者通过合理手段通知你违反了许可协议，则你的许可将永久恢复，前提是：这是你首次收到该版权所有者就（任何作品）违反本许可协议的通知，且你在收到通知后的\
  \ 30 天内补救了该违规行为。\n\n你根据本节的权利的终止，并不会终止根据本许可协议从你处获得副本或权利的第三方的许可。如果你的权利被终止且未永久恢复，则你不符合根据第\
  \ 10 节获得相同材料之新许可的资格。\n\n### 9. 拥有副本并不要求接受许可。\n\n为了接收或运行程序的副本，你并不需要接受本许可协议。仅由于使用点对点传输接收副本而导致的受保护作品的附带传播，同样不需要接受许可。\n\
  \n然而，除本许可协议外，没有其他条款准许你传播或修改任何受保护的作品。如果你不接受本许可协议，这些行为将构成侵犯版权。因此，通过修改或传播受保护的作品，你表示你接受本许可协议并进行此类操作。\n\
  \n### 10. 下游接收者的自动许可。\n\n每当你传播受保护的作品时，接收者都会自动获得原始许可者的许可，允许其根据本许可协议运行、修改和传播该作品。你不负责强制第三方遵守本许可协议的遵守性。\n\
  \n“实体交易”是指转移组织控制权或其实质性所有资产的交易，或者拆分组织、合并组织的交易。如果受保护作品的传播是由于实体交易的结果，则该交易中接收作品副本的每一方也应获得其权利继让人根据上一段所拥有或可以授予的该作品的任何许可，加上从权利继让人处获得该作品相应源代码的权利，前提是该权利继让人拥有该代码或可以通过合理努力获得。\n\
  \n你不能对根据本许可协议授予或确认的权利的行施施任何进一步的限制。例如，你不能就行使本许可授予的权利收取许可费、特许费或其他费用，并且你不能发起诉讼（包括诉讼中的交叉主张或反诉），指控通过制造、使用、销售、要约出售或进口程序或其任何部分侵犯了任何专利权利。\n\
  \n### 11. 专利。\n\n“贡献者”是指授权根据本许可协议使用程序或基于该程序的作品的版权所有者。此类经许可的作品被称为贡献者的“贡献版本”。\n\n\
  贡献者的“实质性专利权利要求”是指贡献者拥有或控制的所有专利权利要求（无论已获得还是此后获得），这些权利要求若以本许可协议允许的任何方式制造、使用或销售其贡献版本，将被被侵犯，但不包括仅由于对贡献版本进行进一步修改而导致被侵犯的权利要求。就此定义而言，“控制”包括以符合本许可协议要求的方式授予专利再许可的权利。\n\
  \n每一�每位贡献者都根据其实质性专利权利要求授予你一项非排性的、全球性的、免特许费的专利许可，允许你制造、使用、销售、要约出售、进口以及其他运行、修改和传播其贡献版本的内容。\n\
  \n在接下来的三个段落中，“专利许可”是指任何无论如何定价的明示协议或承诺，规定不执行某项专利（例如明确允许实施某专利或承诺不就专利侵权提起诉讼）。向某方“授予”此类专利许可，意味着达成此类协议或承诺，不对该方执行某项专利。\n\
  \n如果你在传播受保护的作品时，明知依赖于专利许可，且该作品的相应源代码无法任何人通过公开的网络服务器或其他易于访问的手段免费且根据本许可条款进行复制，那么你必须：(1)\
  \ 使相应源代码变得可用，或 (2) 安排放弃获得该特定作品专利许可的利益，或 (3) 按照符合本许可协议要求的方式，将专利许可扩展到下游接收者。“明知依赖”意味着你实际知道，如果没有该专利许可，你在某国家传播受保护的作品，或你的接收者在某国家使用受保护的作品，将侵犯该国家一个或多个你有理由认为是有效的可识别专利。\n\
  \n如果根据或结合单次交易或安排，你传播或通过获取传输来传播受保护的作品，并向某些接收受保护作品的各方授予专利许可，授权他们使用、传播、修改或传输该受保护作品的特定副本，则你授予的专利许可自动扩展到该受保护作品及基于该作品的所有接收者。\n\
  \n如果一项专利许可未在其覆盖范围内包含、禁止行使、或以不行使本许可协议下明确授予的一项或多项权利为条件，则该专利许可是“歧视性的”。如果你是从事软件分发业务的第三方的安排的一方，在该安排下你根据你传输作品的程度向该第三方付费，且该第三方向任何从你处接收受保护作品的各方授予了歧视性专利许可，(a)\
  \ 与你传输的受保护作品副本（或根据这些副本制作的副本）有关，或 (b) 主要针对包含受保护作品的特定产品或合集有关，除非你在 2007 年 3 月 28 日之前进入了该安排，或授予了该专利许可。\n\
  \n本许可协议中的任何内容均不应解释为排除或限制你在适用专利法下可能可能获得的任何隐含许可或其他侵权辩护。\n\n### 12. 不放弃他人的自由。\n\n如果对你施加了（通过法院、协议或其他方式）与本许可协议条件冲突的条件，这些条件并不能免除履行本许可协议条件的义务。如果你无法传播受保护的作品以同时满足你在本许可协议下的义务和其他其他相关义务，那么作为结果，你可能无法传播它。例如，如果你同意了要求你向进一步传播程序的人收取特许费的条款，那么你只有在完全放弃传播该程序的情况下，才能同时满足这些条款和本许可。\n\
