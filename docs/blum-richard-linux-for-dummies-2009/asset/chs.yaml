  \ 类的问题） (422)\n### 索引 (423)\n\n# 引言\n\n欢迎来到 Linux 迷人的开源软件世界。\n\n在本书中，我们将向你介绍 Linux\
  \ 操作系统的奇之处，它最初是 Linus Torvalds 在 20 世纪 90 年代初作为他心爱的结晶创造的。\n\n我们的目标是让你加入到快速增长的 Linux\
  \ 用户和爱好者行列中，他们正忙碌地重写操作系统市场竞争规则。\n\n如果你考虑过切换到 Linux 但觉得这个前景令人望而生畏，你可以放轻松。如果你会烧开水或设定闹钟，你也能成为一名\
  \ Linux 用户。（没开玩笑！）\n\n当这本书的第一版出版时，Linux 还是一个新兴的现象，既不广为人知，也不被人们理解。在这一版中——\n\n\n\n\
  \n对于新一代 Linux 用户——现有的材料多到数不清，因此我们将本书的重点放在了 Linux 是什么以及你如何在桌面上对其进行最佳利用上。为此，这些页面包含了各种在线资源、提示和技巧，以及更通用的说明。如果你正在寻找关于服务器的材料，Naba\
  \ Barkakati 编写（Wiley Publishing, Inc.）的 `Linux All-In-One Desk Reference For Dummies`\
  \ 可以满足你的需求。\n\n在书中，我们将技术术语减少到最低，并尽可能使用通俗易懂的英语。除了对 Linux 安装、启动、配置和软件进行直白介绍外，我们还包含了许多示例，以及大量详细的指令，帮助你以最少的压力或困惑使用你自己的\
  \ Linux 机器。\n\n我们还为随书附带了一张实用的 DVD-ROM，其中包含了 `Ubuntu 9.04`（当时最流行的工作站 Linux 发行版）和\
  \ `Fedora 11`（由领先的 Linux 供应商红帽赞助的项目）的镜像文件。要了解 DVD-ROM 中具体包含哪些内容，请参附录 B。如果你不知道我们在说什么，别担心，你很快就会明白的！\n\
  \n# 傻瓜式 Linux，第 9 版\n\n## 关于本书\n\n将这本书看作一本友好、易于上手的指南，用于应对术语以及 Linux 工具、实用程序和组件集合。尽管\
  \ Linux 并不是非常难以理解，但它确实包含了大量的细节、参数和 `administrivia`（UNIX 术语，指管理琐事）。在安装、配置、管理和排排除基于\
  \ Linux 的计算机时，你需要将这些细节理得井井就绪。你可以在书中找到的一些示例主题包括：\n\n* 了解 Linux 的来源以及它能为你提供什么\n* 安装\
  \ Linux 操作系统\n* 使用 Linux 系统来管理文件和添加软件\n* 设置网络访问和浏览网页\n* 自定义你的 Linux 桌面\n* 管理 Linux\
  \ 系统安全和资源\n\n尽管乍一看，使用 Linux 似乎需要多年的实践经验、大量的尝试错误、高级计算机科学训练以及高度的投入，但请宽心！事实并非如此！如果你能告诉别人如何找到你的办公室，你完全可以构建出一个实现你所需的\
  \ Linux 系统。本书的目的不是让你变成一个彻彻底的 Linux 极客（当然，那是 Linux 启蒙的最高境界），而是向你展示为了构建一个运行流畅的 Linux\
  \ 系统而需要掌握的内部细节，并给你使用它所需的知识和信心。\n\n## 如何使用本书\n\n本书将告诉你如何安装、配置和自定义 Linux 桌面系统。虽然现在在\
  \ Linux 中你可以通过指向和点击来完成大多数工作，但你可能仍然想尝试在命令行提示符中使用 Linux ——在那里，你输入详细的指令来加载或配置软件、访问文件并执行其他任务。在书中，输入将以等宽字体所示：\n\
  \n```\nrmdir /etc/bin/devone\n```\n\n当你输入 Linux 命令或其他相关信息时，请务必按照你在书中看到的完全复制这些信息，包括大写和小写字母，因为这是让\
  \ Linux 正常运行的魔法之处。\n\n## 引言\n\n未能完全遵循指令可能会导致各种不幸、不体面或意外之外的副作用。\n\n书的页边框提供的空间不像电脑屏幕那么大；因此，在书中，某些\
  \ URL 和命令行提示符中的长命令可能会折行到下一行。记住，你的计算机将这些折行视为 `single set of instructions` 或一个单一 URL——所以，如果你正在输入一段文本，请让它保持在单行内。如果你看到这些折行中的某一行，请不要插入硬回车。我们会通过在斜杠处或自然分词处断行（暗示“等一下——还有！”）并对溢出的部分略微缩进来提示你这应该是一行，如下所示的愚蠢示例：\n\
  \n```\nwww.infocadabra.transylvania.com/nexus/plexus/lexus/\npraxis/okay/this/is/a/make-believe/URL/but/\n\
  some/real/ones/are/SERIOUSLY/long.html\n```\n\n请注意，当你深入阅读本书以及你可能会遇到的其他 Linux 幽默、智慧和灵感来源时，你可能会发现某些术语是互换使用的。例如，你可能会看到同一个软件被称为\
  \ `program`（程序）、`command`（命令）、`utility`（实用程序）、`script`（脚本）、`application`（应用程序）或\
  \ `tool`（工具），这取决于来源、上下文以及你参考的信息的作者。在很大程度上，你可以将这些术语视为互换的，当它们之间需要做出重要区分时，我们会指出。同样，当你处理各种命令或配置控制项时，你可能还会遇到\
  \ `flag`（标记）、`switch`（开关）、`option`（选项）或 `parameter`（参数）等互换使用的术语。在这种情况下，所有这些术语指的是你控制、精炼或修改基本命令或程序的方法，以实现你的需求。再次，在任何需要区分和澄清的地方，我们都会提供。\n\
  \n### 三个自以为是的假设\n\n人们说，做假设会让做出假设的人和被假设的人都变成傻瓜。尽管如此，出于实际，我们必须对你这位亲爱的读者做出几个假设：\n\n\
  * 你可以开启和关闭电脑。\n* 你知道如何使用鼠标和键盘。\n* 你想安装、配置和/或使用桌面 Linux 系统，因为你感到好奇、感兴趣，或者这是你的工作。\n\
  \n使用这本书不需要你成为逻辑大师或奥秘编程术的巫师，也不需要你有计算机科学博士学位。你甚至不需要完全或完美地理解你计算机内部正在发生的事情。\n\n如果你拥有丰富的想象力和解决基础问题的能力，那就更好了——你已经掌握了让\
  \ Linux 为你服务的关键要素。剩下的只是细节和一点耐心。我们可以帮你处理细节，但耐心取决于你自己！\n\n## 本书的组织结构\n\n本书包含六大部分，按顺序带你从\
  \ Linux 的安装和配置到保持 Linux 桌面系统的运行，甚至让它像在阳光下晒着的猫一样舒服！大部分部分包含三个或多个章节或附录，每个章节或附录包含模块化的节。每当你需要帮助或信息时，拿起本书从任何喜欢的地方开始，或者使用目录和索引来查找特定主题或关键词。\n\
  \n以下是书中六部分的拆解以及每个部分的内容。\n\n### 第一部分：入门\n\n这部分奠定了基础，并对术语、技术和软件组件进行了概述和介绍，这些元素让 Linux\
  \ 成为了一只准备就绪、动力十足且能够大显身手的“软件猛虎”。具体来说，我们从 Linux 概述开始，解释 Linux 是什么、来自哪里以及它是如何工作的。接下来，我们将处理涉及在计算机上准备和安装\
  \ Linux 的各种任务和活动。\n\n之后，我们将告诉你如何启动 Linux —— 绝不是为了删掉它，而是为了启动你全新的系统以达到计算的狂喜境界。最后，我们将帮助你熟悉桌面并根据你的喜好对其进行微调。\n\
  \n### 第二部分：上手 Linux\n\n\n\n\n在本部分中，你将了解在 Linux 中操作的基础知识。你将发现各种文件存储在 Linux 文件系统中的什么位置，以及如何在其中穿行。当你熟悉了操作环境后，你将看到如何*退出*系统并连接到互联网。\n\
  \n## 引言\n\n### 第 III 部分：实操指南\nLinux 包含了大量的功能和能力，因此在完成最初的安装和配置后，你可能已经想要使用你的系统来*做*些事情。这正是实操开始的地方！在本书的这一部分，你将了解到如何使用\
  \ Web 浏览器（Firefox！）、电子邮件、即时消息等互联网工具。然后，你将发现如何编辑文本文件，并得益于 OpenOffice.org，深度体验文字处理程序和其他办公套件程序。这一部分也有有趣的内容，比如如何在\
  \ Linux 世界中使用音频和视频，以及如何访问那些被告知仅供 Windows 用户可用的软件和格式。\n\n### 第 IV 部分：初级管理员入门训练营\n\
  在本书的这一部分，你将发现如何维护你的系统。你将看到如何处理各种文件格式、如何安装新软件，最重要的是，如何保持系统更新以防免受漏洞影响。你还将了解到基础系统管理任务，如创建和管理用户账户、照看文件系统、设置打印等。然后，你将了解一些保持\
  \ Linux 系统安全的知识。***提示：***和任何操作系统一样，最重要的一点就是保持它的更新状态！\n\n### 第 V 部分：十项总结\n在本书的高潮部分，我们总结并提炼了你现在对\
  \ Linux 及其内部运行机制所了解的精髓。在这里，你有机会回顾 Linux 系统的一些关键故障排除技巧和方法，并设置 Samba 服务器以便你与另一台计算机共享文件。\n\
  \n### 第 VI 部分：附录\n本书以一组附录结束，旨在总结并进一步扩展本书的内容。附录 A 提供了按功能分类的 Linux 命令组，并附有语法和解释。附录\
  \ B 列出了《Linux 傻瓜指南》第 9 版 DVD 中的详细内容。\n\n## Linux 傻瓜指南，第 9 版\n\n## 本书中使用的图标\n在每个章节中，我们使用图标来突出特别重要或有用的信息。你会在书中看到以下图标：\n\
  \n- Tip（提示）图标标记了有用信息，让你的 Linux 系统生活比你想象的要简单得多。\n- 我们有时使用此图标来指出你不应该错过的信息——不要忽视这些温和的提醒。（你省下的生命、理智或页面可能是你自己的。）\n\
  - 当看到此图标时请务必小心——它警告你不要做某些事情。\n- 此图标旨在强调，忽视这些智慧的后果可能是严重的。\n- 此图标表示技术细节，这些信息具有启发性且有趣，但对理解和使用\
  \ Linux 并非关重要。如果你愿意，可以跳过这些段落（但请以后回来阅读它们）。\n\n### 接下来该往何方？\n这里是你选择方向并出发的地方！《Linux\
  \ 傻瓜指南》第 9 版就像《一千一夜谭》，因为你从哪里开始几乎并不重要。当你准备好构建自己的 Linux 系统时，你会看到许多不同的场景和故事。尽管每个故事都有自己独特的角色和情节，但整体绝对是非常惊叹的。\n\
  \n别担心——你能够应对。谁在乎别人是否认为你只是在胡闹呢？我们知道你正准备好过人生中最精彩的时光。\n\n享受吧！\n\n![Image 2](img/index-20_1.png)\n\
  \n## 第 I 部分：初涉水水\n在本部分 . . .\n本部分包含了对 Linux 操作系统的开发和能力的介绍。我们还涵盖了让 Linux 成为现在的术语和工具，并详细说明了为你的电脑准备\
  \ Linux 以及在你自己的电脑上安装流行的 `Ubuntu` 或 `Fedora` 所需的步骤指令。\n\n从那里开始，你将发现如何处理特定的故障排除问题，然后我们将遍历桌面并发现如何自定义它。在本部分的结束时，你已经安装了\
  \ Linux 系统，并具备了在你的桌面上穿行的基本能力。\n\n## 第 1 节：熟悉 Linux\n\n### 本章内容\n- 深入探讨 Linux 的起源和特性\n\
  - 将 Linux 与其他操作系统区分开来\n- 依赖 `GNU` 和 `GPL`\n- 惊叹 Linux 公司（或其缺失性）\n- 查看流行的 Linux 发行版\n\
  \n*福特，你正在变成一只企鹅。住手吧！*\n—— 亚瑟·丹特\n\n欢迎来到 Linux 的世界，这是一个由全球一千多人开发的操作系统！在本章中，你将了解 Linux\
  \ 本身——它是什么，源于哪里，以及为什么它现在在新闻中受到如此关注。准备好挑战你对软件*必须*如何开发和销售的假设，并对新的可能性开放心胸。\n\n### 免费真的是免费吗？\n\
  理解 Linux 需要在关于获取和使用计算机软件的方式上发生根本性的转变。（***注意：***我们所说的*根本性*，是指触及问题的本质，而不是戴上珠子并在行政楼外露营。）你转变心态的第一步是改变你对*free*（免费）一词的通常认知，让它代表*自由*（freedom），而不是*免费午餐*（free\
  \ lunch）。没错；你可以收取费用出售“免费”软件 . . . 只要你向每个软件的接收者传递同样的自由，我们就鼓励你这样做。\n\n别太命挠头了；这些概念最初很难理解，尤其是当你考虑到你从商业软件行业营销部门接受到的条件训练时。也许你不知道，当你购买大多数专有的、缩水包装软件时，你并不真正*拥有*该软件。相反，你被授权在许可方规定的界限内使用软件。\n\
  \nLinux 也有许可证。然而，该许可证的动机和目的与大多数商业软件大不相同。Linux 使用的 `GNU 通用许可证`（`GPL`）并不是使用许可证来限制对软件的使用，而是确保软件始终对任何人开放。任何公司都无法拥有或规定你使用或修改\
  \ Linux 的方式——尽管他们可以在其各种品牌上（如 `Red Hat` 和 `Novell`）拥有自己的独立版权和商标。\n\n从本质上说，你已经拥有 Linux，你可以用它做你喜欢的任何事情，只要你向软件的任何进一步接收者传播\
  \ `GPL` 的自由即可。\n\n### Linux：革命还是仅仅另一个操作系统？\n在进一步研究 Linux 之前，我们需要先解决一些术语问题。\n\n*操作系统*是运行你计算机的软件，处理你与硬件之间所有的交互。无论你是在电脑上写信、计算预算，还是管理你的食谱，操作系统都为你计算机提供了赖以生存的必需空气。\n\
  \n此外，操作系统不仅仅是一个程序；它由成百个较小的程序和实用程序组成，允许我们人类使用计算机做一些有用的事情。然后，你在操作系统之上运行其他程序（例如你的文字处理程序）来完成所有工作。\n\
  \nLinux 被指责“仅仅是另一个操作系统”。从表面上看，它可能确实如此，但如果你看得更深层，你就会发现并非如此。\n\n\n\n\n\nLinux 项目是计算行业当前向开源和免费（这里的“free”是指“自由”，而不是“免费赠送”）软件趋势的领军者。由于其开发（以及持续开发）的模式，Linux\
  \ 是一个坚不可石的操作系统，它代表了软件开发中的许多优秀特性。\n\n# 第 1 章：认识 Linux\n\n有两个根本区别将 Linux 与其他操作系统区分离开来：\n\
  \n- Linux 采用独特且天才的 `GNU 通用许可证`（GNU General Public License）授权，你可以在下一节中阅读有关它的介绍。\n\
  - Linux 由全球范围内的志愿者和付费程序员组成的团队在互联网上共同开发和维护。\n\nLinux 之所以伟大，有许多原因，包括那些从零开始构建它的人们希望它具备以下所有特性：\n\
  \n- **多用户（Multiuser）：** 同时可以有多个用户登录到同一台计算机。\n- **多处理器（Multiprocesser）：** 真正的`抢占式多任务`允许操作系统内核高效地处理同时运行的几个程序。这对于在一台计算机上提供多种服务至关重要。\n\
  - **多平台（Multiplatform）：** Linux 目前运行在 24 种以上的`platforms`（硬件类型）上，包括 32 位和 64 位 Intel\
  \ PC、Digital/Compaq Alpha、Apple Macintosh 的所有变体、Sun SPARC、Apple iPod 甚至微软 Xbox。\n\
  - **可操作性（Interoperable）：** Linux 与大多数网络协议（语言）和操作系统都能良好协作，允许你与运行 Microsoft Windows、UNIX、Novell\
  \ NetWare、Macintosh 计算机以及占据较小利基市场的其他群体交互。\n- **可扩展性（Scalable）：** 随着你计算需求的增长，你可以依靠\
  \ Linux 随之增长。同一个 Linux 操作系统可以运行在微小的电子相框、台式计算机或非常大型工业级服务器系统上。\n- **可移植性（Portable）：**\
  \ Linux 大部分用 `C` 语言编写。`C` 是一种专门为编写操作系统级软件创建的语言，可以很容易地`移植`（翻译）到新的计算机硬件上运行。\n- **灵活（Flexible）：**\
  \ 你可以将 Linux 操作系统配置为网络主机、路由器、图形工作站、办公生产 PC、家庭娱乐电脑、文件服务器、Web 服务器、集群，或你想象到的任何其他计算设备。\n\
  - **稳定（Stable）：** Linux `kernel`（操作系统的核心）已经达到了让大多数软件开发者羡慕的成熟度。听到 Linux 服务器运行多年而不崩溃的报告并不稀见。\n\
  - **高有效率（Efficient）：** Linux 的模块化设计允许你仅包含运行所需服务的组件。即使是旧的奔腾处理器计算机也可以利用 Linux 并再次变得有用。\n\
  - **免费！（Free!）：** 对大多数人来说，Linux 最引人注目的方面是它通常是免费提供的。（资本主义者们低声议道）在没有直接金钱回报激励的情况下，谁能造出更完美的捕鼠陷阱呢？\n\
  \n在本章中，我们打算为你回答最后一个问题。我们还希望描绘出创建 Linux 的开源软件开发模型。\n\n## 那么 Linux 来自哪里呢？\n\n尽管 Linux\
  \ 核心的编程始于 1991 年，但其设计理念是基于经过时间考验的 `UNIX` 操作系统。`UNIX` 是 20 世纪 60 年代后期在贝尔电话实验室开发的。`UNIX`\
  \ 的原始架构师在操作系统还寥少的年代工作，他们希望创建一个既能高效又能安全地共享数据、程序和资源的操作系统——这种理想在当时是无法实现的（而且现在仍然被追求）。\n\
  \n从那里开始，`UNIX` 演变成了许多不同的版本；它目前的家族谱复杂得看起来就像葛藤蔓延一样。\n\n编写一个操作系统不是一项易事。即使在六个月的艰苦工作后，托瓦兹（Torvalds）在系统通用性方面的进展也非常小。他将自己的成果发布到了网上——并发现许多人有着同样的兴趣和好奇心。\n\
  \n1991 年，林斯·托瓦兹（Linus Torvalds）是芬兰赫尔辛基大学的一名计算机科学学生。他想要一个像他在大学喜欢的 `UNIX` 那样的操作系统，但\
  \ `UNIX` 及其运行的硬件都贵得惊人。一个名为 `Minix` 的 `UNIX` 版本可以免费获得，但它并不能完全满足他的需求。于是，托瓦兹研究了 `Minix`，然后自己编写一个新版本。用他自己的话（为了以后记录在网上，因为那是在线聊天室的早期版本），他的工作“只是一个爱好，不会像\
  \ GNU 那样规模大且专业”。\n\n## 开源软件项目的剖析\n\n对于普通观察者（以及一些企业 IT 决策者）来说，Linux 看起来像是一个奇特的变异。毕竟，像计算机操作系统这样复杂且依赖学科的系统，是如何由一群来自世界、松散结合的志愿者计算机极客开发的呢？\n\
  \n正如科学不断尝试分类和解释存在的所有万物一样，技术评论员仍在试图理解开源方法如何能创造优越的软件，特别是在没有人负责的情况下。通常，这些原因与人类用解决方案来满足需求的常规欲望很大关系。当\
  \ Linux 世界的程序员想要一个工具时，他们只需自己写一个——或者和其他想要类似软件包的人聚在一起，共同编写。\n\n### GNU 是谁？\n\n想象一下基于`需求`而非预期利润创建的软件。尽管\
  \ `UNIX` 最终变成了专有软件，但它创建的初衷是基于实际需求。人们通常所说的`Linux 操作系统`实际上是一系列为了解决特定计算问题而创建的软件工具。\n\
  \nLinux 流行的速度如果没有理查·斯塔尔曼（Richard Stallman）的愿景也是不可能的。麻诸理工学院（MIT）长期以来以培养技术领域的最顶尖人才而闻名。1984\
  \ 年，作为 MIT 一位天赋横溢的学生和天才程序员，斯塔尔曼面临着困境——是将他的才华卖给一家公司换取一笔巨款，还是将他的天赋赠给世界。\n\n斯塔尔曼开启了一段旅程，创建一个完全免费的操作系统并赠给世界。他理解并继续遵循最初的黑客伦理，这种伦理宣称信息是想要自由的。这个概念在他时代并不新鲜。在计算行业的早期，许多进步来自于自由共享想法和编程代码。制造商赞助的用户组将最优秀的人才聚集在一起解决复杂的问题。斯塔尔曼觉得，当公司开始以利润为唯一目的将软件视为自己的知识产权进行积累时，这种伦理就消失了。\n\
  \n到此为止，你可能已经了解到广泛且易于获取的源代码对于成功的软件开发至关重要。`source code`是指程序员向计算机传递指令时输入的类读文本（区别于“执行”文件中不可读的计算机象形文字）的术语。\n\
  \n\n\n\n用二进制码编写计算机程序是一项极其艰巨的任务。现代计算机软件通常用人类友好的语言编写，然后被`compiled`（编译）或翻译成计算机的原生指令集。要对这些软件进行更改，程序员需要访问程序的源代码。大多数专有软件仅以预编译产品的形式提供；软件开发者将这些程序的源代码严锁起来。\n\
  \n在确定他的操作系统将围绕 UNIX 的概念框架构建后，斯尔曼（Stallman）希望项目名称可以将他的系统与 UNIX 区分开来。因此，他选择了递归缩写 `GNU`（读作\
  \ `ga-new`），意思是“GNU 不是 UNIX”。\n\n为了给 `GNU` 项目筹资金，斯尔曼成立了自由软件基金会（FSF），该基金会销售免费（即开源）软件，以帮助那些致力于其持续开发的程序员。（记住，我们所说的\
  \ `free` 是“自由言论”的意思，而不是“免费啤酒”的意思。）尽管这个组织（以及创建一个完整操作系统的目标）是必要且重要的，但一个更重要的拼图必须到位。新软件需要一种许可证来保护它免受大企业海盗的侵害——这种担忧在今天仍然非常现实，因为一家前\
  \ Linux 公司正试图夺取全球成千上万志愿者几十年工作成果的所有权。\n\n`GNU 通用公共许可证`（`GPL`）是一种独特且创新的软件许可证，它利用版权法来保护软件用户的自由，而这通常与版权的作用方式是相反的。通常，版权是一项可执行的所有权声明和限制，限制版权所有者以外的任何人不得进行复制。当软件根据\
  \ `GPL` 许可时，接收者受版权法约束，尊重他人以他们选择任何方式使用软件的自由。使用 `GPL` 许可的软件也被称为“左权”（copy `left`）软件（`right`\
  \ 的反过来，懂吧？）。记住 `GPL` 的另一种方法是通过它的最终结果：终身保证公共（Guaranteed Public for Life）。\n\n虽然斯尔曼的工作为\
  \ Linux 的迅速普及奠定了基础，但他及其团队正在开发的操作系统花费的时间比预期的要长。如果你对完成版本感兴趣，请访问 `www.gnu.org/software/hurd/hurd.html`。\n\
  \n# 第 1 章：认识 Linux\n\n### 到底是谁在管理 Linux？\n\n随着开源项目的演进，各种人物会成为领导者。这种领导者被称为项目的`仁慈独裁者`（benevolent\
  \ dictator）。仁慈独裁者在某个问题上花费的时间可能比任何多，并且通常具有独特的见解。通常，`民主`和`独裁`这两个词永远不会出现在同一个句子中，但开源模型是一个非常民主的过程，它认可了仁慈独裁者的统治。\n\
  \n林斯·托瓦尔斯（Linus Torvalds）仍然被认为是 Linux 内核（操作系统的核心）的仁慈独裁者。他最终决定哪些功能被添加到内核，哪些功能不会。社区信任他的愿景和判断力。如果他失去了对项目的兴趣，或者社区认为他已经老糊涂了，一位新的领导将从与他工作的能干人才中脱颖而出。\n\
  \n### 爱因斯坦是一个志愿者\n\n作为志愿者或为项目捐献时间的人并不意味着他们提供的是二流努力（或只在周末和假期工作）。\n\n事实上，任何人力资源专家都会告诉你，自愿选择某项工作的人会产生最高质量的产品。\n\
  \n为开源项目贡献志愿者往往是各自领域的领导者，他们依赖社区协作来完成有用的工作。\n\n开源概念对科学界并不陌生。开源项目培养的公正同行的评审过程对于验证某些新功能或能力在技术上是正确的至关重要。\n\
  \n那些将开源社区描绘成版权侵权者和小偷的人往往误解——或完全忽视了——这些关键问题。\n\n开源程序员对他们的工作感到非常自豪，并且也非常关心自己的版权，不希望自己的工作被他人盗窃——因此有了诸如\
  \ `GPL` 的许可证。这种担心营造了一种对版权极度尊重的氛围。那些在偷取他人心血成果时声称自己“只是在开源”的强盗，严重地误用了这个术语来安抚自己的良心。\n\
  \n许多人还指出，如果在开源领域违反了版权，很容易发现的。看看新闻，注意大型软件公司有多频繁被定罪盗取他人代码并将其纳入自己的工作之中。如果最终产品是开源的，任何人都可以查看并确保其中没有被盗的内容。正如你所想象的，在闭源方案中，追踪此类版权侵权行为要困难得多。\n\
  \n# 第一部分：入门\n\n## Linux 软件包：分发版\n\n一个完整的 Linux 系统包被称为 `distribution`（发行版）。一个 Linux\
  \ 发行版包含 Linux 内核、`GNU` 项目的工具以及许多开源软件项目，为系统提供多样化的功能。通过将所有部分组合成一个包，你就不需要在互联网上搜寻各个组件了。\n\
  \n有许多不同的 Linux 发行版可以满足你可能遇到的任何计算需求。大多数发行版都是针对特定用户群定制的——例如，商业用户、多媒体爱好者、软件开发者或普通家庭用户。\n\
  \n每个定制的发行版都包含了支持专业功能所需的软件软件包，例如为多媒体爱好者提供的音频和视频编辑软件，或者为软件开发者提供的编译器和集成化开发环境（IDEs）。\n\
  \n不同的 Linux 发行版通常分为三类：\n\n- 核心 Linux 发行版（稍后会详细介绍核心）\n- LiveCD 测试发行版\n- 特种发行版\n\n\
  接下来的章节描述了这些不同类型的 Linux 发行版，并展示了每个类别中 Linux 发行版的示例。\n\n一个 Linux 发行版通常以几个不同的版本出现，以覆盖更广泛范围。例如，Fedora\
  \ 同时发布完整的核心发行版以及包含完整系统子集的 LiveCD 版本。许多特种 Linux 发行版（如 `Ubuntu`）是基于 `Debian` 核心 Linux\
  \ 发行版的。`Ubuntu` 与 `Debian` 使用相同的安装文件，但只包含了完整 `Debian` 系统的一小部分。\n\n#### 核心 Linux\
  \ 发行版\n\n一个 `core` Linux 发行版包含 Linux 和 `GNU` 操作系统、一个或多个图形桌面环境，以及几乎所有可安装和运行的 Linux\
  \ 应用。核心 Linux 发行版为完整的 Linux 安装了一站式服务，无论你的需求如何。表 1-1 显示了一些流行的核心 Linux 发行版。\n\n###\
  \ 表 1-1：核心 Linux 发行版\n\n| 发行版 | 获取地址 | 描述 |\n| :--- | :--- | :--- |\n| Slackware\
  \ | `www.slackware.com` | 原始 Linux 发行版之一，深受 Linux 极欢迎。 |\n| Red Hat | `www.redhat.com`\
  \ | 商业业务发行版，主要用于互联网服务器。 |\n| Fedora | `www.fedora.org` | Red Hat 的衍生产品，为家庭用户设计。\
  \ |\n| Gentoo | `www.gentoo.org` | 为高级 Linux 用户设计的发行版，仅包含 Linux 源码。 |\n| Mandriva\
  \ | `www.mandriva.com` | 主要为家庭用户设计（以前称为 Mandrake）。 |\n| openSuSe | `www.opensuse.org`\
  \ | 针对业务和家庭的不同发行版（现由 Novell 所有）。 |\n\n\n\n\n\n# Debian\n\n`www.debian.org`\n\n深受\
  \ Linux 专家和商业 Linux 产品开发者的喜爱。\n\n我们在本书中使用 `Fedora Linux` 发行版来演示如何与核心 Linux 发行版一起工作。\n\
  \n在 Linux 早期，发行版是以一组软磁盘的形式发布的。你必须下载多组文件，然后手动将它们拷贝到磁盘上。制作一个完整的发行版通常需要 20 张或更多的磁盘！\n\
  \n不言而喻，这是一段痛苦的经历。如今，随着家用电脑通常内置了 CD 和 DVD 播放器，Linux 发行版以 CD Set 或单张 DVD 的形式发布。这使得安装\
  \ Linux 变得简单得多。\n\n#### Linux LiveCD\n\n虽然对于 Linux 极客来说，发行版提供很多选项是件好事，但对于 Linux\
  \ 初学者来说这可能是一场噩梦。大多数发行版在安装过程中会询问一系列问题，以确定默认加载哪些应用程序、计算机连接了哪些硬件以及如何配置这些硬件。初学者往往会觉得这些问题很困惑。\n\
  \n结果，他们要么在计算机上加载了太多的程序，要么加载得太少，后来发现计算机无法按照他们的意愿运行。幸运的是，对于初学者来说，有一种简单得多的安装方法。\n\n\
  Linux 世界中一个较新的现象是可启动的 Linux CD 发行版，被称为 `LiveCD`。大多数现代计算机都可以通过从 CD 而硬盘读取操作系统来启动。这种安排让你在不实际安装的情况下看到\
  \ Linux 系统的样貌。\n\n为了利用这一特性，某些 Linux 发行版创建了包含示例 Linux 系统的可启动 CD。由于单张 CD 容量的限制，示例无法包含完整的\
  \ Linux 系统，但你可能会对他们能往里面塞进这么多软件而感到惊讶！结果非常酷：你可以从 CD 启动计算机并运行 Linux 发行版，而无需在你的硬硬盘上安装任何内容！\n\
  \n这是测试各种 Linux 发行版的极佳方法，而无需弄乱你的 PC。只需插入 CD 并启动即可！所有的 Linux 软件都将直接从 CD 运行。你可以从互联网上下载许多\
  \ Linux LiveCD 并将其刻录到 CD 上进行试用。表 1-2 显示了一些可用的 Linux LiveCD。\n\n### 表 1-2：Linux LiveCD\
  \ 发行版\n\n| 发行版 | 在何查找 | 描述 |\n| :--- | :--- | :--- |\n| Knoppix | `www.knoppix.net`\
  \ | 一种德国 Linux 发行版，第一个开发的 Linux LiveCD。 |\n| SimplyMEPIS | `www.mepis.org` | 为初级家庭\
  \ Linux 用户设计。 |\n| PCLinuxOS | `www.pclinuxos.com` | 单 CD 上的完整 Linux 桌面工作站。 |\n\
  | Ubuntu | `www.ubuntu.com` | 一个全球性的 Linux 项目，为多种语言设计。 |\n| Slax | `www.slax.org`\
  \ | 基于 Slackware Linux 发行版子集的实时 Linux CD。 |\n| Puppy Linux | `www.puppylinux.org`\
  \ | 为旧电脑设计的设计的全功能 Linux 发行版。 |\n\n某些 Linux LiveCD 发行版（如 `Ubuntu`）允许你直接从 LiveCD 安装\
  \ Linux 发行版。这让你能够通过 CD 启动、试用 Linux 发行版，如果你喜欢，就可以将其安装到硬盘上。这个功能非常方便且用户友好。\n\n我们在本书中使用\
  \ `Ubuntu LiveCD` 发行版来演示使用 LiveCD。\n\n与所有好事物一样，Linux LiveCD 也有一些缺点。因为你从 CD 访问一切，应用程序运行速度较慢，特别是当你使用较旧、较慢的计算机和\
  \ CD 驱动器时。此外，由于你无法向 CD 写入，对 Linux 系统的任何更改下次重启时都会消失。\n\n但 Linux LiveCD 世界正在取得进展，帮助解决这些问题：\n\
  \n- 将 Linux 系统文件从 CD 拷贝到内存中快速运行\n- 将系统文件拷贝到硬盘上的文件中进行保存\n- 将系统设置存储在 USB 闪盘上\n- 将用户设置存储在\
  \ USB 闪盘上\n\n某些 Linux LiveCD（如 `Puppy Linux`）设计时只有最少的 Linux 系统文件；当 CD 启动时，它们被直接复制到内存——一旦\
  \ Linux 完成启动，你就可以从计算机上取出 CD。这不仅让你的应用程序运行快得多（因为程序在计算机内存中运行更快），还释放了你的 CD 槽，你可以用来刻录音频\
  \ CD 或使用内置软件播放视频 DVD。\n\n## 特种 Linux 发行版\n\n在过去的几年里，一个新的 Linux 发行版子类开始出现。这些通常基于核心发行版之一，但仅包含对特定使用领域有意义的应用程序集。\n\
  \n除了提供专用软件（例如，为商业用户的办公软件套件），定制的 Linux 发行版还尝试通过自动检测和自动配置常见硬件设备来帮助 Linux 初学者。这使得安装\
  \ Linux 变成了一个更加愉快的过程。\n\n表 1-3 显示了一些可用的特种 Linux 发行版及其专长。\n\n### 表 1-3：特种 Linux 发行版\n\
  \n| 发行版 | 在何查找 | 描述 |\n| :--- | :--- | :--- |\n| Linspire | `www.linspire.com` |\
  \ 配置为看起来像 Windows 的商业 Linux 软件包。 |\n| Xandros | `www.xandros.com` | 为初学者预配置的商业 Linux\
  \ 软件包。 |\n| SimplyMEPIS | `www.mepis.org` | 面家庭用户的桌面发行版。 |\n| Ubuntu | `www.ubuntu.com`\
  \ | 用于学校和家庭的桌面和服务器发行版。 |\n| PCLinuxOS | `www.pclinuxos.com` | 专注于家庭和办公的发行版。 |\n\
  | gOS | `www.thinkgos.com` | 为初学者设计的发行版，并预装在某些笔记本和桌面级系统中。 |\n| Puppy Linux | `www.puppylinux.org`\
  \ | 在旧 PC 上运行良好的小型发行版。 |\n\n这只是特种 Linux 发行版的一个小样本。有数百种特种 Linux 发行版，互联网上不断涌现。无论你的专长是什么，你可能都会找到为你定制的\
  \ Linux 发行版。\n\n我们在本书中使用 `gOS` 发行版来查看特种 Linux 发行版的某些功能是如何工作的。`gOS` 发行版包含 `Google\
  \ Desktop applet`，我们在第 15 章中讨论它。\n\n# 第 2 章：为 Linux 准备计算机\n\n### 本章内容\n- 采取安装前的步骤\n\
  - 在同一台计算机上使用 Linux 和 Windows\n- 在安装前自定义磁盘分区\n- 了解（并查找）你的硬件信息\n- 为 DVD 或 CD 安装做准备\n\
  \n> *如果你不知道自己要去去哪里，就得小心，因为你可能无法到达那里。* — Yogi Berra\n\n在安装 Linux 时必须做出的最重要的决定之一是在你实际安装\
  \ Linux *之前* 做的决定——即你想要如何安装。没错，这并不像仅仅把 Linux 塞进计算机硬盘就大功告成了那么简单。你可以以许多不同的方式安装 Linux；你选择哪一种完全取决于你的情况。\n\
  \n但别担心；通过本章，你将轻松做出那个决定。\n\n然后，在你做出那个重要决定后，我们将涵盖为该特定安装需要做的任何准备工作。\n\n## 选择正确的安装方法\n\
  \n在本节中，我们为你提供了一个路线图，告诉你对你的特定情况来说什么是。要在现有计算机上永久安装 Linux，你需要预先为它留出硬盘区域。有三种常用方法：\n\n\
  - 替换硬盘上现有的操作系统。\n- 在第二个硬盘上安装 Linux。\n- 对现有硬盘进行分区以包含 Linux。\n\n\n\n\n\n# 22 第一部分：入门\n\
  \n安装 Linux 还有两种不寻常的解决方案：\n\n- 使用虚拟服务器软件包以虚拟化方式安装 Linux。\n- 在现有的 Windows 分区中添加一个分区作为一个普通文件，然后将\
  \ Linux 作为 Windows 应用程序进行安装。\n\n如果一想到要修改电脑上的任何东西就会让你起皮疹，那么请使用 LiveCD `distribution`（见第\
  \ 1 章）来启动电脑并进入 Linux 系统，而无需安装任何内容。从 CD 驱动器运行 Linux 的速度较慢（在旧旧电脑上可能甚至慢得令人痛苦），但它仍然行得通，并且能让你了解\
  \ Linux 到底是怎么回事。\n\n#### 替换现有的操作系统\n\n如果你有一台只运行 Linux 而不运行其他任何程序的备用电脑，那么你幸运了！用 Linux\
  \ 替换现有的操作系统是在计算机上安装 Linux 最简单的方法。大多数 Linux 安装程序甚至包含一个自动过程，引导你将计算机完全转换为 Linux。然而，这是一种“全有全无”的方法——你将用\
  \ Linux 完全替换掉你现有的操作系统！\n\n如果你*确实*替换了现有的操作系统，请注意，当你完成后，你将不再拥有原始数据文件了！如果你想保留任何文件，必须将它们备份到\
  \ Linux 可以读取的介质上。USB 闪盘是拷贝少量数据（多达 16GB 左右）并将其移动到 Linux 系统的极佳方法。对于大量数据，请考虑购买一个外部\
  \ USB 硬盘硬盘。\n\n如果你替换了现有的操作系统，可以跳过下一节“准备共同使用 Linux 和 Microsoft Windows”。事实上，如果你觉得很有冒险，可以直接跳到第\
  \ 3 章并开始安装。第 22 章中也有相关的故障排除信息。\n\n## 使用第二块硬盘或对硬盘进行分区\n\n在第二块硬盘上安装 Linux——或者说，对你的现有硬盘进行分区以运行\
  \ Linux——需要一个 `dual-boot`（双启动）场景：Linux 和 Microsoft Windows 都位于同一台电脑的硬盘（或分区）上。当你启动电脑时，会出现一个菜单，询问你想要使用哪种操作系统。你可以保留原始的\
  \ Windows 应用程序和文件，*并且*使用 Linux —— 这一切都在同一台电脑上完成！\n\n### 第 2 章：为 Linux 准备电脑\n\n许多人倾向的方案是添加第二块全新的硬盘来安装\
  \ Linux。这是目前到为止双启动系统最简单的解决方案，我们也建议在可能的情况下使用这种方法。\n\n如果你习惯操作硬盘，你可以随时对现有硬盘进行分区以为 Linux\
  \ 留出空间。`Partitioning`（分区）意味着在同一个物理硬盘上拥有两个或多个逻辑上独立的区域。电脑将每个分区视为一个独立的磁盘。我们将在本章稍后的部分处理这个过程。\n\
  \n只需记住在计算机看来所示的哪块硬盘是哪一个：你要确保对 Microsoft Windows 安装保持不封不动。你只需要知道，从计算机的角度来看，哪块硬盘（Windows\
  \ 或 Linux）是第一个，哪块是第二个。你可以在本章稍后的“为双启动对现有硬盘进行分区”章节中查找到如何读取顺序信息。当你确定了哪块硬盘是哪一个后，继续阅读本章稍后的“双检硬件兼容性”章节。\n\
  \n知道*哪块*硬盘上有你原始的 Windows 安装至关重要。当你加载 Linux 时，你不希望意外地将其安装在你原始的 Windows 硬盘上！这也是在开始此过程之前备份任何重要文件的另一个原因。\n\
  \n意外会发生（而且经常会发生）！\n\n如果你无法为 Linux 腾出整块硬盘，并且已经安装了 Windows，那么你必须调整当前 Windows 安装的大小。你需要读完整个章节。\n\
  \n在至少阅读下一节“准备共同使用 Linux 和 Microsoft Windows”之前，绝对*不要继续进入第 3 章*。抱歉我大大大叫了，但如果你不采取预防措施，你可能会抹掉整个\
  \ Windows 安装！\n\n#### 其他安装场景\n\n如果你绝对不想使用硬盘进行双启动，你还有其他三个选项——我们知道说过总共有三种方法，现在又增加了三个就变成六种了，但请等我们解释一下。\n\
  \n你可以使用 `virtual server` 软件包，例如 `VMWare` 或 Sun 的 `VirtualBox`（见第 20 章）来安装一个“虚拟”Linux\
  \ 机器，它运行在你现有 Windows 安装内部的窗口中。你保持 Windows 磁盘原样不作任何修改。你只需在 `VMWare` 或 `VirtualBox`\
  \ 软件创建的虚拟区域内安装 Linux。\n\n你也可以反相反——仅在电脑上安装 Linux，然后使用 `VMWare`（见第 20 章）安装一个虚拟 Windows\
  \ 机器，它运行在你 Linux 安装内部的窗口中。\n\n如果你采用这种方法，请在安装 Linux *之前*备份你的原始 Windows 文件，然后在新的 Windows\
  \ 虚拟机中恢复它们。\n\n另一个选项是 Ubuntu LiveCD 中包含的一个新功能。`Windows Ubuntu Installer` (`Wubi`)\
  \ 是一个你可以使用的应用程序，它可以将 Ubuntu Linux 分区创建为现有 Windows 分区内的普通文件，之后它会将 Linux *作为 Windows\
  \ 应用程序安装*。这种酷的新方法让你可以在无需对任何磁盘分区的情况下创建双启动场景，而且易于撤销（只需卸载 `Wubi`）。\n\n## 准备共同使用 Linux\
  \ 和 Microsoft Windows\n\n如果你计划在同一台机器上运行 Linux 和 Microsoft Windows，那么你可能已经安装了 Windows\
  \ 并使用了一段时间。因为我们不想听到新 Linux 用户发出痛苦的哀叫，请花点时间评估你拥有的和需要的。以下章节将介绍让你的电脑准备好双启动环境所需的过程。\n\
  \n万一你实际上还没有安装 Windows 但仍然想要双启动能力，你应该在安装 Linux *之前*先安装 Windows。\n\n否则，在安装期间，Windows\
  \ 会覆盖你硬盘上 Linux 用于存储其 `boot menu`（启动菜单）的部分（这个因素在你以后想切换回 Linux 时可能会导致混乱！）！在安装好 Windows\
  \ 后，回到此处。\n\n### 安装第二块硬盘\n\n除了替换现有操作系统外，将 Linuxget 电脑的第二种简单方法是安装第二块硬盘。许多电脑支持多个硬盘，无论是在同一条磁盘线上链联还是通过多根线缆连接。\n\
  \n通常，你可以通过查看电脑的 BIOS 设置界面来确定磁盘控制器的配置。BIOS 设置界面控制电脑上的基本硬件配置。图 2-1 显示了 BIOS 屏幕磁盘控制器区域的示例。\n\
  \n![Image 3](img/index-38_1.jpg)\n\n**图 2-1:** BIOS 硬盘配置区域。\n\n进入 BIOS 界面取决于你的电脑。只需在电脑首次启动时按下快捷键（通常是\
  \ `F12` 或 `ESC`）即可。\n\n有时电脑会在屏幕上提示你按哪个键进入 BIOS。其他时候，你必须查阅用户手册。\n\n\n\n\n\n如果你无法通过\
  \ BIOS 确定你的硬盘设置，就必须打开电脑机箱查看内部，看看你面对的是什么。大多数电脑的标准磁盘控制器卡允许每个控制器连接多达两个设备；通常主板上还安装了多个控制器。如果你看到两根带有长多引脚插头的电缆，那么你很幸运了。如果你只看到一根带有空闲插头的电缆，那么通常也没问题。\n\
  \n图 2-1 中的示例显示了两个硬盘控制器，称为主控制器（primary）和从控制器（secondary）。主硬盘控制器包含用于启动计算机的硬盘。每个硬盘控制器可以支持两个设备（称为主设备\
  \ master 和从设备 slave）。这种设置允许你向计算机连接共四个独立的设备。\n\n除了硬盘，控制器还支持连接 CD/DVD 驱动器。在评估你的磁盘控制器状况时，务必考虑这些驱动器。\n\
  \n在安装好第二个硬盘后，你就可以开始使用 Linux 了。只需跳到“双检硬件兼容性”部分来检查电脑的其他其他硬件即可。\n\n# 第一部分：入门\n\n##\
  \ 从零开始为双系统进行分区\n\n如果你计划在硬盘上同时安装 Windows 和 Linux，*请务必**先安装 Windows*。在安装 Windows 的过程中，系统会要求你对硬盘*分区*（使用软件将一个大硬盘划分为若干较小的虚拟驱动器）。当你准备好分区后，就有了存放\
  \ Linux 的地方。\n\n分区有三种类型可用：主分区（primary）、扩展分区（extended）和逻辑分区（logical）。一个硬盘可以有三个*主分区*和一个*扩展分区*。在扩展分区内部，你可以拥有多达\
  \ 12 个*逻辑分区*——将扩展分区想象成一个包含逻辑分区的纸箱。\n\n逻辑分区存储数据；扩展分区包含逻辑分区。\n\n由于我们无法预测你想安装哪些软件，我们建议为你的\
  \ Linux 安装至少留出 10GB 的可用空间。空间越大越好，因为这可以为你提供更多空间用于下载，甚至安装更多程序；至少，你可以将此本书附带 DVD-ROM\
  \ 中的所有内容都安装到这 10GB 空间中。\n\n记下你分配给 Windows 的分区和给 Linux 的分区。记下每个分区位于哪块硬盘上（第一块、第二块、第三块等），以及每个分区在磁盘上的编号（第一个、第二个等）。在安装\
  \ Linux 时，你需要这些信息。\n\n你并不局限于双系统。如果有空间，你可以在电脑上安装三个或多个操作系统。\n\n## 为双系统对现有硬盘进行分区\n\n\
  如果你不是从零开始安装双系统，你可能需要对当前的安装进行更改。在更改任何内容之前，务必收集有关你当前设置的一些重要信息——特别是这两个大点：(a) 你的硬盘上是否还留有未分区的空间；(b)\
  \ 如果有，有多少。\n\n如果你发现至少有 10GB 的未分区空间，之后可以直接跳到本章后部分的“双检硬件兼容性”部分。\n\n否则，请查看“创建空间”和“磁盘碎片”部分为\
  \ Linux 腾出空间。\n\n![Image 4](img/index-40_1.jpg)\n\n# 第二章：为 Linux 准备电脑\n\n你可能想要*多于*\
  \ 10GB 的空间。例如，如果你下载了大量多媒体内容，安装完软件后剩余的空间很快就会耗尽。从实际上来说，20GB 可能是个更好的目标——*至少如此*。\n\n\
  ## 在 Windows Vista 中查看你的分区\n\nWindows Vista 操作系统比之前的 Windows 版本更注重安全性。难怪你必须使用具有管理员权限的账户来执行这些步骤。登录此类账户后，执行以下操作：\n\
  \n**1. 选择“开始”➪“控制面板”打开控制面板。**\n\nVista 控制面板打开了。\n\n**2. 如必要，选择“经典视图”。**\n\n**3.\
  \ 双击“管理工具”。**\n\n窗口显示了 Vista 中可用的各种管理工具。\n\n**4. 双击“计算机管理”。**\n\n窗口显示了 Vista 中用于管理你电脑的各种工具。（你可能需要点击“继续”进入此对话框。）\n\
  \n**5. 在左侧窗格中选择“磁盘管理”。**\n\n磁盘管理工具打开（见图 2-2）。\n\n**图 2-2:**\n\nWindows Vista 磁盘管理工具。\n\
  \n如果你查看 `Disk 0`、`Disk 1` 和 `Disk 2` 列表，你会发现其中一个框显示为 `C:`（这对 Windows 老手来说可能非常熟悉）。那是\
  \ Vista 的分区。你可能还会看到一些显示为“未分配”（Unallocated）的框。它们是未被任何用途使用的空闲空间。\n\n如果你发现一个 10GB 或更大的未分配分区，记下该分区位于哪块磁盘，以及它在该磁盘上的分区编号。\n\
  \n你在第三章安装 Linux 时需要这些信息。\n\n如果某个工具显示分区无法调整大小，请不要将该空间计入你的 Linux 安装。不要尝试调整 Windows\
  \ Vista 分区，除非工具明确说明可以安全地这样做。你可能会损坏分区导致 Vista 无法读取。\n\n## 在 Windows 2000 和 Windows\
  \ XP 中查看你的分区\n\nWindows 2000 和 XP 操作系统仅允许某些账户控制和保护文件；要获取计算机磁盘使用信息，首先必须以管理员身份登录（或使用具有管理员权限的账户）。登录后，按照以下步骤操作：\n\
  \n**1. 选择“开始”➪“设置”➪“控制面板”打开控制面板。**\n\n**2. 打开“管理工具”文件夹并双击“计算机管理”图标。**\n\n**3. 在“计算机管理”的左侧窗格中，点击“磁盘管理”图标。**\n\
  \n几秒钟后，右侧窗格会电脑上存储设备的当前状态，例如硬盘、CD 驱动器、DVD 驱动器等。图 2-3 显示了 Windows XP 的磁盘管理；Windows\
  \ 用户看到的视图几乎完全相同。\n\n这里要寻找的重点词是“未分配”（Unallocated）。未分配分区未分配给任何操作系统，可供你的 Linux 安装使用。查看“容量”（Capacity）、空闲空间”（Free\
  \ Space）和“%”列。在这里你可以看到每个分区使用了多少空间以及还有多少可用空间。\n\n如果你确实发现了一个未分配分区，*且*它在 10GB 或以上，那么你就准备好了。\n\
  \n记下该分区位于哪块磁盘，以及它在相应磁盘上的分区编号。你在第三章安装 Linux 发行版时会用到这些信息。\n\n![Image 5](img/index-42_1.jpg)\n\
  \n**图 2-3:**\n\n在 Windows XP 计算机管理工具看到的磁盘管理信息。\n\n## 在 Windows 98 中查看你的分区\n\n尽管微软不再支持\
  \ Windows 9 x*，但一台运行 Windows 98 的旧电脑也可以作为一个很好的 Linux 设备。遗憾的是，Windows 98 没有提供图形化工具。相反，Windows\
  \ 98 使用 FDISK，这是一个显示硬盘分区的命令行工具。\n\n在操作 FDISK 操作时要*非常小心*。如果你对其进行任何更改，可能会抹掉所有数据。退出程序时，*务必不要保存任何更改*。\n\
  \n要查找 Windows 98 中计算机硬盘的详细信息，请遵循以下步骤：\n\n**1. 选择“开始”➪“程序”➪“MS-DOS 提示符”打开 MS-DOS\
  \ 提示符窗口。**\n\n**2. 输入**\n\n```\nFDISK\n```\n\n**并按回车键。**\n\n\n\n\n\n在 Windows 98\
  \ 中，你可以输入大写、小写或任何喜欢的混合大小的 `FDISK`，只要你拼写 `FDISK` 正确即可！\n\n你很可能会被提示显示大容量“磁盘”（驱动器）信息——“大”是相对于\
  \ Windows 98 时代的大型硬盘而言的，这意味着大于 `512MB` 的驱动器。如果你没有看到该提示，请跳到第 4 步，`FDISK` 菜单选项将与图\
  \ 2-4 类似。\n\n![Image 6](img/index-43_1.jpg)\n\n# 第一部分：入门指南\n\n### 3. 如果你看到大磁盘提示，在此提示处选择\
  \ Y，然后按回车。\n\n出现 `FDISK` 菜单选项，如图 2-4 所示。\n\n**图 2-4：** `FDISK` 菜单选项。\n\n### 4. 显示当前的驱动器分区信息。\n\
  \n如果你的计算机中有一个硬盘，`FDISK` 会显示第五个菜单选项，以便你可以在磁盘之间切换。以下是使用第五个菜单选项切换到另一个磁盘的方法：\n\na. 输入\
  \ `5` 并按 `Enter`。\n\n`FDISK` 屏幕显示系统中的所有硬盘。\n\nb. 输入你想要的磁盘编号，然后按 `Enter`。\n\n`FDISK`\
  \ 菜单屏幕顶部显示 `FDISK` 正在操作的驱动器编号。\n\n### 5. 要显示所显磁盘的分区信息，输入 4 并按回车。\n\n图 2-5 显示了 `FDISK`\
  \ 中“显示分区信息”屏幕的示例。图 2-5 表示该驱动器上没有可用的未分配磁盘空间。如果磁盘有未分区的空间，`FDISK` 将显示容量。如果你在磁盘上有扩展分区，则需要深入查找。\n\
  \n![Image 7](img/index-44_1.jpg)\n\n# 第 2 章：为 Linux 准备计算机\n\n**图 2-5：** `FDISK`\
  \ 中的分区信息。\n\n### 6. 要查看扩展分区内的逻辑分区，选择 EXT DOS 条目并按回车。\n\n你可以通过计算驱动器使用百分比的总和来判断是否有空空间。\n\
  \n* 如果总和为 100%，则没有可用空间。\n* 如果你有 `10GB` 或更多可用空间，则空间足够。\n\n#### 腾出空间\n\n最终，你可能需要调整分区大小——这是出于以下几个原因之一：\n\
  \n* 你可能有一些未分配空间，但少于 `10GB`。\n* 你可能有 `10GB` 的未分配空间，但它分散在各个驱动器中的许多碎片中，需要合并。\n* 你可能没有任何未分配空间（最常见的原因）。\n\
  \n在所有这些情况下，你都需要移动数据来腾出空间——不仅是为了安装 Linux，还为了存储你想在 Linux 文件系统中保留的任何文件。关键在于确定你现有的 `C:`\
  \ 驱动器是否有额外的可用空间可以转换为单独分区。所有的 Windows 操作系统都允许你轻松查看 `C:` 驱动器的可用空间。\n\n![Image 8](img/index-45_1.jpg)\n\
  \nWindows XP、2000 和 Vista 在“计算机管理”工具中提供该信息；请参见本章前面的“为双系统对现有硬盘进行分区”部分。如果你正在让一台老旧\
  \ Windows 98 或 95 机器重焕双系统活力，请按此方法使用计算机管理工具：\n\n1. 双击`我的电脑`打开计算机管理工具。\n2. 选择`视图`\
  \ ➪ `Web 页面`。\n3. 高亮你的第一个驱动器。\n\n你会看到类似于图 2-6 所示的内容。\n\n**图 2-6：** 这是该 Windows 98\
  \ 用户 `C:` 驱动器上的可用磁盘空间。\n\n确定多少空间对你的 Windows 设置足够足够——你不希望将其压缩得太厉害而导致 Windows 空间不足——还涉及考虑你如何使用机器。同样，如果你下载并保存大量多媒体内容，留出足够的空间来适应下载习惯是明智的。如果你发现\
  \ Windows 驱动器都满了且没有剩余空间（或者你下载并保存了太多音频、视频或图形文件），可能是时候将某些文件保存到 CD 或 DVD，这样你就可以从硬盘上删除它们了。另一个选项是为计算机添加第二个驱动器——如果你不方便自己操作，许多商店会收费为你安装驱动器。\n\
  \n![Image 9](img/index-46_1.jpg)\n\n#### 文件碎片整理\n\n在正常使用工作站的过程中，Windows 系统会将文件碎片写入硬盘的随机位置。这会导致数据分散在整个磁盘上。在将硬盘划分若干分区之前，你需要确保没有丢失\
  \ Windows 散落在硬盘上的任何数据——这包括系统文件和数据文件。\n\n为了获得一个分区整洁的硬盘，首先你需要确保你所有的 Windows 数据都移动到硬盘的开头。这通常使用`碎片整理工具`完成。\n\
  \n碎片整理是 Windows 世界中的常见过程。它是重新对齐文件在硬盘上存储方式的过程。当 Windows 创建和删除文件时，文件数据会被分成分散在硬盘各处的各个块。碎片整理重新组合这些块，使其形成连续的文件，并将这些文件放在硬盘区域开头附近同样连续的区域。\n\
  \n所有版本的 Windows 都包含一个磁盘碎片整理实用程序。你可以从计算机管理窗口进入碎片整理工具。只需选择`磁盘碎片整理`选项即可。\n\n在 Windows\
  \ Vista 中，磁盘碎片整理在后台进行，没有任何关于正在发生什么的指示。Windows XP 提供了一个实方便的碎片整理窗口，在文件移动时显示进度，如图 2-7\
  \ 所示。\n\n**图 2-7：** Windows XP 磁盘碎片整理工具。\n\n![Image 10](img/index-47_1.jpg)\n\n\
  图 2-8 显示了 Windows 98 中的`磁盘碎片整理`。通常需要多次运行才能将所有文件移到一个公共区域。碎片整理完成后，你的文件将位于磁盘空间开头的连续区域——你就可以准备好作为\
  \ Linux 安装的一部分对硬盘进行分区。\n\n**图 2-8：** Windows 98 磁盘碎片整理工具。\n\n### 双重检查硬件兼容性\n\n如果你在已拥有的硬件上安装\
  \ Linux，只需尝试并看看哪些可用，哪些不可。本节的部分内容可以为你提供帮助；它们解决了通用的硬件问题。其他章节涉及特定的硬件问题，如声卡（第 13 章）、无线网卡（第\
  \ 9 章）等。如果你遇到困难，请从专门针对特定任务的章节开始，然后来这里寻求更通用的帮助。\n\n最大的问题领域是无线网卡和最新的尖端硬件——例如新款版本的显卡、声卡和图像扫描仪。你可以在购买新硬件之前检查硬件兼容性列表，但这些列表的作用有限，因为硬件世界变化非常快。如果你感兴趣查看通用列表，请访问\
  \ `http://hardware.redhat.com/hcl/` 查看红帽企业 Linux 列表（有一个官方 Fedora 列表）。请记住，此列表侧重于商业设备，所以你没有看到列出某些内容并不意味着它不支持。\n\
  \n不要担心特定设备是否经过了“认证”（经过严格测试以确保其正常工作）。对于家庭用户来说，大多数情况下“支持”和“兼容”就足够了。最终，判断硬件是否受支持的最佳方法是进行\
  \ Web 搜索。访问 `www.google.com/linux` 并对硬件的品牌和型号进行 Web 搜索；在搜索词中包含 `Linux` 单词。例如，你可以搜索\n\
  \n\n\n\n\n搜索“Innovision DX700T Linux”以了解其他人对这一特定品牌和型号硬件的使用情况。（当然，这里并不意味着对示例中提到的任何硬件表示背书。）此类搜索可能会让你看到人们在使用该特定硬件时遇到了哪些问题以及取得了哪些成功。\n\
  \n即使是想到计算机硬件就让你感到头晕眼眩，也不担心；你可以在网上找到大量信息。一个极佳的起点是 `www.tomshardware.com`。其他查找各种设备在\
  \ Linux 下如何运行信息的场所还包括：\n\n-   **其他面向 Linux 的网站：** 特别是 `www.tldp.org/HOWTO/Hardware-HOWTO/`\
  \ 上的通用 Linux 硬件列表。\n-   **厂商网站：** 许多硬件供应商支持 Linux，但他们并没有让查找信息变得容易。通常情况下，前往该硬件的厂商论坛、硬件的\
  \ FAQ（常见问题解答），或者关注支持（Support）链接查找 Linux 的下载内容。如果有下载内容，也不急着下载。重点在于查看并确认它们是否存在。用于所需的\
  \ `driver`（告诉操作系统如何使用硬件的软件）可能已经包含在你的 Linux 安装程序中了。只有当这是获取驱动的唯一途径时，才从厂商处下载驱动。\n\n\
  如果情况最糟糕，你可能找不到任何关于该硬件的 Linux 相关信息。然而，这并不意味着该硬件无法工作。如果你已经有了该设备，尽管尝试一下吧。你可能会发现它运行良好。或者，你可能无法使用最新的功能，而其他部分运行完全正常（例如，对于最新一代的显卡，最华丽的功能可能无法工作，但你至少可以将其作为通用的\
  \ `SVGA` 使用）。\n\n-   **令人畏惧的说明书：** 如果可能，随手保留你的电脑说明书（特别是针对显卡和显示器的），以防万你需要它们来回答安装程序提出的问题（大多数\
  \ Linux 用户不需要处理这种情况，但确实有人会遇到）。\n\n# 第一部分：入门\n\n## 笔记本电脑注意事项\n\n目前的 Linux 发行版在较新的笔记本和台电脑上表现非常好。（参阅\
  \ `www.linux-laptop.net`，这是一个关于 Linux 兼容性的优秀研究网站，你可能可以通过它更换那些有问题的品牌和型号。）如果你的笔记本电脑带有\
  \ Win 标签（或者你在研究机器时发现它包含 Win 产品，即使没有正确标记），且它是一个常见品牌，你不应该在安装 Linux 时遇到任何问题。然而，笔记本电脑通常至少包含一个\
  \ `PCMCIA`（个人电脑内存国际协会）卡槽。这是笔记本电脑的标准，提供了一种插入额外功能卡的常用方法。大多数笔记本电脑包含 `WinModems`。（带有\
  \ `Win` 前缀的硬件仅*用于* `Windows`，所以它们目前还不知道如何处理 Linux。）\n\n如果你计划为 Linux 购买一台笔记本电脑，请检查它的调制调器和其他硬件（例如常见品牌的\
  \ `PCMCIA` 卡调制调器、网卡或调制网一体卡）。只要你坚持使用常见品牌的 `PCMCIA` 卡，它在 Linux 上就应该运行良好。不是 Win 品牌的。\n\
  \n如果你需要确切知道机器中有哪些硬件，你有以下选项：\n\n-   **使用现有的操作系统来记录你的硬件。** 如果你的电脑已经在运行 Windows，你可以从\
  \ Windows 环境中收集大量信息。根据你的系统，使用以下方法之一：\n    -   *在 Windows 98 中：* 选择开始➪设置➪控制面板➪系统➪设备管理器来访问图\
  \ 2-9 所示的对话框。\n    -   *在 Windows XP 中：* 右键点击我的电脑桌面图标，选择“管理”以打开计算机管理对话框。然后选择“设备管理器”菜单来访问安装在机器上的硬件列表（如图\
  \ 2-10 所示）。你可以双击`设备管理器`中的每项以显示相应的详细信息。\n    -   *在 Windows Vista 中：* 选择开始➪控制面板➪设备管理器来浏览你的硬件。会出现一个警告对话框；当它出现时，点击“继续”。\n\
  \n-   **下载硬件检测工具。** 如果你没有任何诊断工具，可以从网上下载各种硬件检测工具，例如 `Dr. Hardware`。`Dr. Hardware`\
  \ 工具包含许多关于你机器内部的信息。该工具是共享软件，你可以从 `www.dr-hardware.com` 的 Gebhard Software 网站获取使用和费用信息。\n\
  \n![Image 11](img/index-50_1.jpg)\n![Image 12](img/index-50_2.jpg)\n\n**图 2-9：**\
  \ 在 Windows 98 中，`设备管理器`为你提供了已安装硬件的信息。\n**图 2-10：** Windows XP `设备管理器`。\n\n-   **在电脑启动时通过阅读屏幕收集信息。**\
  \ 如果你的系统没有包含任何操作系统，且你没有任何系统的任何文档，你可以求助于在电脑启动时阅读屏幕。在某些系统上，视频信息会在电脑启动时从 `BIOS` 显示。如果信息闪得太快，你可能需要重启几次才能读取这些信息。此外，某些系统在系统启动时会显示\
  \ `PCI` 组件及其设置。你可能需要重启几次来收集所有信息。\n\n你可以尝试按下键盘上的 `Pause-Break` 键（它应该在 `Scroll Lock`\
  \ 键附近）来冻结启动期间的滚动。当你阅读完毕，按任意键即可取消冻结。\n\n-   **访问基本输入/输出系统 (BIOS) 信息。** 它存储在内存的一小块区域中并由电池保持电源，有时被称为\
  \ `CMOS`（互补金属氧化半导体），这表示可以存储和保留信息的计算机芯片类型。存储在 `BIOS` 中的信息量从极少到相当多不等。某些较新的系统可能会显示几屏关于电脑硬件的\
  \ `BIOS` 信息。\n\n如果你选择访问 `BIOS`，请确保在*任何*操作系统加载*之前*进行。大多数制造商会在系统启动时在屏幕上指示进入 `BIOS`（或\
  \ `Setup`）的键盘键（或按键序列），例如，按 `Del` 进入设置。\n\n如果你找不到按键序列，请检查制造商网站。进入 `BIOS` 后，你通常使用方向键、`Tab`\
  \ 键或 `Enter` 键进行导航。某些 `BIOS` 环境还会使用功能键；寻找屏幕顶部或底部的功能键选项列表。\n\n要特别警惕硬件盒和网站上带有 `Win`（如\
  \ `Windows`）术语的标签。这些组件（如 `WinModems`）依赖微软 `Windows` 才能运行——更糟糕的是，包装可能并没有显示这种局限性。只有极小的概率你能够找到\
  \ `Win` 硬件的 Linux 驱动程序。如果你找到了，请在安装 Linux *之前*将其复制到存储设备（如 CD 或优 盘）上。如果你找不到驱动程序且需要使用调制调器，请花点钱买一个支持良好的良好的调制调器。（特别是关于\
  \ `WinModems` 的更多信息，请参阅第 8 章。）\n\n## 在开始之前\n\n\n\n\n在继续安装 Linux 之前，你最后需要准备好的东西就是第一张可启动的\
  \ CD 或 DVD。本书附的 DVD 包含了 Ubuntu LiveCD 和 Fedora 完整发行版 DVD 的 ISO 镜像。你需要将这些光盘镜像拷贝到硬盘，然后再将它们刻录到独立的可启动\
  \ CD 或 DVD 上。如果你的电脑没有可以刻录光盘的 DVD-ROM 驱动器，请参阅附录 B 了解其他各种选项。\n\n现在，在继续之前，还有一件事需要你做：确保你能够获得\
  \ Linux 在线社区的帮助。访问以下网站并将其书签，以便在需要帮助时轻松查阅：\n\n## 第 2 章：为 Linux 准备你的电脑\n\n- **Ubuntu\
  \ 项目:** http://www.ubuntu.com\n- **Fedora 项目:** http://fedoraproject.org\n- **gOS\
  \ 项目:** http://www.thinkgos.com\n- **Fedora 项目 Wiki:** http://fedoraproject.org/wiki/\n\
  \n`wiki` 是一个共同维护的 Web 页面（或一组 Web 页面），任何人都可以修改（或者取决于 wiki 的设置，由一组特定人员修改）。Wiki 变得越来越流行，用于生成基于社区的支持性网站，因为任何想要贡献的人都可以以极低麻烦的方式参与其中。\n\
  \n- **Ubuntu 项目 Wiki:** https://wiki.ubuntu.com\n- **LinuxQuestions.org:** linuxquestions.org\n\
  \n# 第一部分：入门\n\n### 第 3 章：安装 Linux\n\n### 本章内容\n- 考虑安装前的最后阶段问题\n- 从 LiveCD 安装 Ubuntu\n\
  - 将 Fedora 安装为个人桌面\n- 首次启动 Fedora\n\n*要要，或者不要。没有所谓的“试一试”。*\n—— 尤达，《帝国终击战》\n\n安装\
  \ Linux 不再需要奥秘的符号和复杂的魔法师咒语了。图形化安装现在已经变得非常容易执行，如果你是从 Microsoft Windows 等其他图形化操作系统迁移过来的，那么你将对它感到非常熟悉。本章将提供相关细节。\n\
  \n安装程序其实非常智能。你可能会发现看到的屏幕与我们在章中显示的并不完全相同。如果你看到了不熟悉的内容或者没有看到我们这里涵盖的屏幕，不要惊慌。安装程序只是根据你系统中的硬件以及你选择安装的内容调整其提供的选项。\n\
  \n在本章中，我们将向你展示如何在个人电脑上安装 Linux 桌面。如果你想在网络上安装 Linux 服务器，有许多其他书籍专注于服务器。在如此长度的书中，无法对桌面和服务器功能都涵盖到令人满意的深度。\n\
  \n### 开始安装前需要考虑的事项\n\n你可以通过两种方式从书中附的 DVD-ROM 安装 Linux：\n\n- 从 DVD-ROM 拷贝 Ubuntu\
  \ LiveCD ISO 镜像，将其刻录到 CD，然后从 CD 启动安装 Ubuntu。\n- 从 DVD-ROM 拷贝 Fedora 完整安装 DVD 镜像，将其刻录到\
  \ CD，然后从 CD 启动安装 Fedora。\n\n要从你通过 ISO 镜像创建的 CD-ROM 开始安装，你可能需要先更改系统设置使其从 CD-ROM 启动（即\
  \ boot）。如今的许多系统已经配置了此，因此你可能不需要进行任何更改。对于某些系统，你需要在启动过程中按下某个键来调出菜单，允许你选择从哪个设备启动。如果你的启动屏幕没有列出要按的键，请查阅系统的用户手册以获取更多信息。\n\
  \n在本章中，我们重点关注三种不同的安装方法——从 LiveCD 镜像安装 Ubuntu、从安装 DVD-ROM 安装 Fedora，以及使用 Wubi 包安装\
  \ Ubuntu。我们选择这些方法出于两个原因：\n\n- Ubuntu LiveCD 安装和 Fedora 完整安装方法代表了安装大多数 Linux 系统的两种主要方式。\n\
  - 涵盖现有的每一个 Linux 发行版的安装将使这本书变成一套百科全书。\n\n一旦你学会了使用这些方法安装 Linux，你就可以应对几乎任何现有的 Linux\
  \ 安装。\n\n如果你正在安装另一个版本的 Ubuntu 或 Fedora，或者是完全不同的 Linux 发行版，你的屏幕将与书中所示的内容不同。每个 Linux\
  \ 发行版的安装程序都涵盖相同的相同任务，但具体操作可能会以不同的顺序呈现，或者它们可能经过自定义以在屏幕上呈现不同的外观。例如，某个发行版可能会在磁盘分区之前呈现账户创建；另一个发行版可能会反转这两个主题的顺序。大多数发行版都会经过相同的\
  \ Basic 选择，因此阅读本章对 Ubuntu 或 Fedora 之外的系统可能仍有帮助。\n\n### 处理损坏的 CD 或 DVD\n\n如果你的 CD\
  \ 或 DVD 似乎出现问题，接下来的操作取决于你从哪里获取的 DVD 或 CD。如果 DVD 是随书附的，你可能遇到了两个问题之一。首先，刻录可能损坏了；要解决这个问题，请尝试以较慢的速度重新刻录光盘。如果新刻录的光盘也通过介质检查，则文件可能在下载过程中损坏了。另一方面，如果你是自己刻的\
  \ CD 或 DVD，请联系 Wiley 客户服务热线 877-762-2974 获取更换盘。在这种情况下，不要联系 Red Hat 技术支持来更换 DVD。如果文件在下载过程中损坏，要解决这个问题，请重新下载光盘镜像。\n\
  \n#### 从 Ubuntu LiveCD 安装\n\nUbuntu 安装过程是 Linux 世界最简单的流程之一。Ubuntu 会引导你完成设置系统所需的所有步骤，然后安装整个\
  \ Ubuntu 系统，而不会向你询问过多信息。\n\n你可以从 LiveCD 中的两个位置启动安装过程：\n\n- 直接从启动菜单启动，不启动 Ubuntu\n\
  - 在启动 Ubuntu 系统后从桌面安装图标启动\n\n这两个位置都启动相同的安装过程，引导你完成七个步骤的选择。\n\n### 刻录你的镜像\n\n可以刻录书中附带\
  \ DVD-ROM 提供的 ISO 镜像的 Ubuntu LiveCD 和 Fedora 完整安装软件包是 `ISO 镜像文件`。ISO 镜像文件是保存为文件的\
  \ CD-ROM 副本。这是一种用于分发 Linux 发行版的常用格式。\n\n如果你特定的 CD 刻录软件不支持刻录镜像，Ubuntu 推荐使用 `InfraRecorder`\
  \ (`infrarecorder.sourceforge.net)，这是一个免费的 CD 镜像刻录软件。参考你的 CD 刻录软件说明，了解如何将 ISO 镜像刻录到\
  \ CD-ROM 磁盘。技巧是将 ISO 镜像刻录到你可以启动的 CD-ROM 上。你不能直接复制文件，必须使用 CD 刻录软件。\n\n当你拿到 LiveCD\
  \ 后，就可以开始安装过程。只需按照以下步骤操作：\n\n1. **将 Ubuntu LiveCD 放入电脑的 CD 槽并重启电脑。** 你的电脑从 Ubuntu\
  \ LiveCD 启动，在你选择了要使用的语言后，会出现 Ubuntu LiveCD 主菜单，如图 3-1 所示。\n\n2. **在菜单中选择直接安装 Ubuntu（Install\
  \ Ubuntu）或通过从 LiveCD 运行来尝试 Ubuntu（Try Ubuntu without Any Change to Your Computer）。**\
  \ LiveCD 的强大之处在于，你可以在不触动硬盘的情况下测试 Ubuntu——这让你了解哪些功能可用，哪些不可用。完成试用后，如果你决定安装 Ubuntu，只需点击桌面上的\
  \ Install 图标。\n\n**图 3-1：** Ubuntu LiveCD 启动菜单。\n\n当你启动 Ubuntu 安装时，你看到的第一个窗口是语言窗口。\n\
  \n\n\n\n### 第 3 章：安装 Linux\n\n## 3. 选择安装时使用的语言，然后点击“下一步”。\n\n此操作选择了 Ubuntu 在安装过程中显示文本消息的语言，并设置了操作系统运行时使用的默认语言。\n\
  \n选择默认语言并不意味着运行在系统上的所有应用程序都会使用该语言。每个单独的应用程序可能会检测到也可能无法检测到 Ubuntu 中配置的默认语言。\n\n安装过程中的第二个窗口允许你为你所在的地区选择时区。\n\
  \n## 4. 选择时区，然后点击“下一步”。\n\n此窗口允许你通过地图或下拉菜单选择你的地理位置。虽然从图形地图上选择时区听起来是个好主意，但取决于 Ubuntu\
  \ 在你所在的特定城市周围识别了多少个城市，这往往是一项挑战。\n\n安装过程的下一步是识别你将在 Ubuntu 系统使用的键盘。虽然这听起来是一个简单的选项，但如果你使用的键盘包含特殊按键，情况可能会变得复杂。\n\
  \nUbuntu 能够识别数百种不同的键盘类型，并在键盘选择窗口中列出所有类型。\n\n## 5. 选择一种键盘，然后点击“下一步”。\n\n键盘配置窗口列出了根据你所在国家常用的不同类型的键盘。Ubuntu\
  \ 会根据它检测到的键盘为你提供一个建议选项。\n\n这可能是正确的，也可能不对。如果你想进行微调，窗口的下半部分允许你进行尝试。左侧是国家列表；右侧是所选国家使用的不同已知键盘类型列表。先从左侧列表中选择你的国家；然后从右侧列表中选择你的键盘类型。\n\
  \n你可以点击右侧列表并开始输入键盘类型的名称，以便快速跳转到该选择。\n\n在两个列表下方，有一个可以让你测试键盘选择的区域。只需输入键盘上可用的任何特殊或唯一字符，即可查看你选择的设置是否产生了正确的字符。\n\
  \n安装的下一步可能是最重要且最复杂的步骤。你必须准确地告诉 Ubuntu 安装程序将 Ubuntu 操作系统放置在系统的哪个位置。在这里的任何小失误都可能真的毁掉你的一天。\n\
  \n在安装期间获得的精确分区窗口取决于你硬盘的配置。如果你已经执行了第 2 章中的步骤，那么你这一步应该应该就绪了。图 3-2 显示了分区窗口的示例。\n\n\
  ## 6. 选择磁盘设置方法，然后点击“下一步”。\n\n![Image 14](img/index-59_1.jpg)\n\n**图 3-2：** Ubuntu\
  \ 磁盘分区窗口。\n\nUbuntu 磁盘分区窗口初始至少有两个可能的选择：\n\n* *使用引导式分区在整个硬盘上安装 Ubuntu：* 默认情况下，Ubuntu\
  \ 提供引导式分区，它会自动对系统的整个硬盘进行重新格式化以安装 Ubuntu。如果你想运行仅限 Ubuntu 的工作站，这是最快最简单的方法。如果你选择此方法，请跳到第\
  \ 11 步。\n\n小心——这是默认安装选项！当你选择在整个硬盘上安装 Ubuntu 时，任何之前安装的操作系统（以及数据）都将被删除。在安装 Ubuntu\
  \ 之前，务必备份你的任何重要文件。\n\n* *使用手动分区创建自己的分区：* 如果你选择手动分区过程，Ubuntu 将分区过程的控制权交给你。它提供了一个分区工具（如图\
  \ 3-3 所示），供你创建、编辑或删除硬盘分区。手动分区工具显示当前的硬盘以及在其中配置的任何现有分区。每块硬盘都会在分区列表中作为一个单独的项目出现，并被分配一个设备名称（例如第一块硬盘为\
  \ `sda`，第二块硬盘为 `sdb`）。你可以手动删除、修改或创建安装在系统上的任何硬盘上的单独分区。\n\n![Image 15](img/index-60_1.jpg)\n\
  \n**图 3-3：** Ubuntu 手动分区工具。\n\n如果你选择对现有的操作系统进行分区，请记住坏事可能会（而且经常会）发生。尽管你计划保留现有操作系统，但在执行分区过程之前，对你的现有操作系统进行完整备份是一个好主意。\n\
  \n如果你正在执行手动分区，请继续第 7 步。\n\n务必记住你的磁盘空间需求（在第 2 章中确定）以便在此使用！我们建议最小 Ubuntu 安装至少需要 10GB\
  \ 空间，如果你计划保存大量图像或音频文件，20GB 会更好。\n\n## 7. 如果正在执行手动分区，点击“编辑分区”和“删除分区”按钮来操作硬盘上的现有分区。\n\
  \n若要调整现有的 Windows 分区大小，请从分区列表中选择该分区，然后点击`编辑分区`按钮。然后你可以调整分区大小以达到想要释放的空间量（确保已按照第 2\
  \ 章所示的方法释放了空间），以创建一个新分区。\n\n## 8. 当硬盘上有空闲空间，或如果你有第二块硬盘时，点击“新建分区”按钮来创建新分区。\n\n出现“创建分区”窗口，允许你选择新分区的尺寸。你可以将新分区添加到第一块硬盘的空空间上，或者添加到第二块硬盘上。\n\
  \n## 9. 在“创建分区”窗口中为你的 Ubuntu 分区选择文件系统。\n\n手动分区过程的一部分是为每个分区分配文件系统。*文件系统*是一种用于在分区上存储和访问文件的方法；有很多不同的文件系统格式。与其他某些操作系统不同，Ubuntu\
  \ 支持多种不同的文件系统。表 3-1 显示了在 Ubuntu 中创建磁盘分区时可用的文件系统类型。\n\n**表 3-1：Ubuntu 分区文件系统类型**\n\
  \n| 分区类型 | 说明 |\n| :--- | :--- |\n| ext3 | 一种流行的 Linux 日志文件系统（稍后详细介绍），它是原始 Linux\
  \ ext2 文件系统的扩展。 |\n| ext4 | 最新的 Linux 日志文件系统，它在 Linux ext3 文件系统的基础上进行了改进。 |\n| ext2\
  \ | 原始的非日志 Linux 文件系统。 |\n| ReiserFS | Linux 支持的第一种日志文件系统。 |\n| JFS | 由 IBM 创建并用于\
  \ AIX UNIX 系统的日志文件系统。 |\n| XFS | 由 Silicon Graphics 为 IRIX 操作系统创建的高性能日志文件系统。 |\n\
  | FAT16 | 较旧 Microsoft DOS 文件系统。 |\n| FAT32 | 与 Microsoft Windows 兼容的较新的 Microsoft\
  \ DOS 文件系统。 |\n| swap area | 虚拟内存区域。 |\n| 不使用 | 忽略该分区，例如稍后要在其上安装另一个操作系统。 |\n\n最常见的分区类型（以及\
  \ Ubuntu 引导方法使用的默认类型）是 `ext3` 格式。这种格式为 Ubuntu 提供了一种*日志文件系统*，该系统在尝试将更改提交到磁盘之前，先在日志文件中记录文件更改。如果系统在能够正确提交数据之前崩溃，文件系统将使用日志（即日志文件）来完成待处理文件的磁盘提交；然后将磁盘恢复到正常状态。日志文件系统极大地减少了\
  \ Linux 中的文件损坏。\n\n## 10. 如果正在执行手动分区，在“创建分区”窗口中为分区选择挂载点。\n\n\n\n\nUbuntu 通过将硬盘连接到虚拟文件系统的特定位置来处理硬盘（参见第\
  \ 6 章）。因此，在为分区选择文件系统格式后，Ubuntu 需要知道将新分区放置在虚拟文件系统的哪个位置（称为*挂载*）。表 3-2 列出了所有可能的位置。\n\
  \n### 表 3-2：文件系统的挂载点位置\n\n| 位置 | 描述 |\n| :--- | :--- |\n| `/` | Linux 虚拟系统的根。 |\n\
  | `/boot` | 用于启动系统的 Linux 内内核的位置。 |\n| `/home` | 用于存储个人文件和各个应用程序设置的用户目录。 |\n| `/tmp`\
  \ | 应用程序和 Linux 系统使用的临时文件。 |\n| `/usr` | 多用户应用程序文件的常用位置。 |\n| `/var` | 变量目录，通常用于日志文件。\
  \ |\n| `/opt` | 第三方应用程序的可选软件包安装目录。 |\n| `/usr/` | 安装可选多用户本地包的常用备用位置。 |\n\n如果你仅为\
  \ Ubuntu 创建了一个分区，则必须将其挂载在*根挂载点*（`/`）。如果你有额外的分区可用，可以通过分别指定它们将其挂载到虚拟文件系统的其他位置。请小心，你需要确保为每个挂载点留出足够的磁盘空间。例如，`/home`\
  \ 挂载点将包含系统上所有用户使用的文件。如果你存储了大量文件，数量将会很大。\n\n不要忘记为交换区域（swap area）分配一个分区，即使你的系统中已经安装了大量的物理内存。标准规则是创建一个与你物理内存一样大的交换区域。因此，如果你有\
  \ 2GB 的物理内存，请创建一个 2GB 的分区并将其分配为交换区域。\n\n安装过程的下一步是登录 ID 窗口，如图 3-4 所示。\n\n![Image\
  \ 16](img/index-63_1.jpg)\n\n**图 3-4：** 登录 ID 窗口。\n\n### 11. 创建登录 ID，然后点击下一步。\n\n\
  你在此过程中创建的登录用户 ID 非常重要。与其他某些 Linux 发行版不同，Ubuntu 发行版没有管理员登录账户（在 UNIX/Linux 世界中通常称为\
  \ *root*）。相反，Ubuntu 为普通用户账户提供了加入管理员组的选项。此类组的成员可以成为系统上的临时管理员（参见第 18 章）。\n\n拥有管理员权限的账户是非常重要的，因为管理员账户是唯一允许执行大多数系统功能的账户，例如更改系统特性、添加新设备和安装新软件。如果没有管理员账户，你将无法在系统上进行任何许多新操作。\n\
  \n此窗口也是分配计算机名称的地方。Ubuntu 在网络上发布自己的存在性，以及在日志文件中引用系统时会使用此名称。你应该选择一个在网络中是唯一的计算机名称。如果你的网络位于域中，请咨询你的网络管理员。\n\
  \n安装的后续步骤是 Ubuntu 安装程序中的一个相对较新的功能。它是“迁移文档和设置”窗口，取决于你在安装 Ubuntu 之前的原始系统，该窗口可能会出现在你的安装过程中，也可能不会出现。\n\
  \n如果你是从现有的 Windows 或 Linux 分区过渡到 Ubuntu 分区，就会出现“迁移文档和设置”窗口。Ubuntu 迁移文档和设置功能旨在实现从\
  \ Microsoft Windows 或其他 Linux 发行版工作站无缝迁移到 Ubuntu 工作站。这是 Ubuntu 的一项激进功能，允许当前的 Windows\
  \ 用户有一条轻松迁移到 Ubuntu 的便捷路径。\n\n### 12. 选择“迁移文档和设置”，然后点击下一步。\n\n安装程序的这一步会检查你正在替换的硬盘分区；它检查是否存在现有的\
  \ Windows 或 Linux 分区。如果找到，它将提帮助迁移任何用户账户到 Ubuntu 环境。\n\n该工具的基本原理是，它查找现有 Microsoft\
  \ Windows 安装中的“文档和设置”文件夹——或者现有 Linux 安装中的主目录（home folders），然后尝试在 Ubuntu 中复制该环境。如果配置了任何用户，“迁移文档和设置”窗口将显示各个用户，以及包含每个用户数据的文件夹。它允许你选择要迁移哪些用户以及哪些文件夹。目前\
  \ Ubuntu 尝试迁移的 Windows 用户功能包括：\n\n*   Internet Explorer 书签\n*   “我的文档”文件夹中的文件\n\
  *   “我的图片”文件夹中的文件\n*   “我的音乐”文件夹中的文件\n*   用户保存的壁纸\n\n尽管此功能很有用，但不要完全依赖它能正常工作。如果你正在将\
  \ Windows 工作站迁移到 Ubuntu 工作站，在开始迁移过程*之前*，对你的重要数据进行备份总是个好主意。\n\n### 13. 在最后的屏幕上检查你的选项。\n\
  \n安装过程的最后一步会生成一个窗口，列出你在之前的安装窗口中选择的所有功能。此时，你可以选择返回到之前的安装选项窗口并修改你的选择。密切关注磁盘分区设置；当你点击\
  \ `Install` 按钮时，这些设置将永久生效。\n\n### 14. 点击高级按钮以检查其他选项。\n\n打开“高级选项”窗口，如图 3-5 所示。\n\n\
  ![Image 17](img/index-65_1.jpg)\n\n**图 3-5：** 高级选项窗口。\n\n高级选项窗口允许你自定义 Ubuntu 中的三个额外功能：\n\
  \n*   **引导加载程序：** 当 Ubuntu 安装在工作站上时，它可以提供自己的*引导加载程序*。引导程序负责启动操作系统。当你安装了 Windows\
  \ 操作系统时，Windows 提供它自己的引导程序。Ubuntu 可以用统一引导加载程序 (GRUB) 程序替换 Windows 引导程序。GRUB 是 Linux\
  \ 系统使用的标准引导程序；它不仅可以启动 Linux 系统，还可以启动许多其他操作系统，包括 Windows。GRUB 引导程序可以加载到第一块硬盘的主引导记录（MBR）中（在\
  \ Ubuntu 中称为 `hd0`），或者在多硬盘系统中，它可以驻留于包含 Linux 分区的硬盘上。高级选项窗口允许你更改 GRUB 的默认设置。默认情况下，Ubuntu\
  \ 启用 GRUB 并将其安装在第一块硬盘的 MBR 中。这是启动 Ubuntu 的推荐做法；如果你有 Windows/Ubuntu 双系统设置，也建议这样做。如果你保留\
  \ Windows 引导程序，你将无法直接进入 Ubuntu。\n\n*   **软件包调查：** 软件包使用调查会检索有关你设置的一些非个人信息（例如 CPU\
  \ 类型、内存大小、硬盘空间大小以及你使用的安装方法），并将其发送到中央库用于统计目的。你可以通过 `http://popcon.ubuntu.com` 查看当前的软件包使用调查结果。几个不同的表格和图表显示了调查的总数。\n\
  \n*   **网络代理：** 高级选项窗口中的最后一个功能是设置网络代理服务器。某些本地网络（特别是企业内部网络）必须过滤任何出的网络流量，以限制员工可以访问的网站。这是通过网络代理实现的。防火墙阻止来自网络的所有正常\
  \ HTTP 访问，但网络代理可以接收 HTTP 请求，然后拦截不可接受的请求，并转发允许的请求。这让公司对其员工从公司网络访问互联网时可以和不能访问的内容拥有完全控制权。\n\
  \n\n\n\n如果您的 Ubuntu 工作站位于使用网络代理的网络中，您必须在此处配置该功能，以确保互联网访问正常工作。\n\n当您完成任何高级选项的设置后，就可以开始安装了。\n\
  \n### 15. 在“选项”屏幕上点击“安装”。\n\n开始安装后，您无需做其他任何事情，只需静坐着观察一切发生。Ubuntu 安装程序将接管工作，创建您指定的磁盘分区，并安装整个\
  \ Ubuntu 操作系统。\n\n在 Ubuntu 系统安装到硬盘后，安装程序会提示您重启。下次您的系统启动时，您将进入 Ubuntu 的世界！如果您选择了保留\
  \ Windows 分区，启动时会出现一个精美的菜单，允许您选择使用 Windows 分区启动还是使用 Ubuntu 分区启动。\n\nUbuntu 还提供了一种通过\
  \ Windows Ubuntu 安装程序（Wubi）运行 LiveCD 系统的独特方法。如果您在 Windows 会话期间插入 Ubuntu LiveCD，系统会提示您将\
  \ Ubuntu 作为 Windows 应用程序安装。这会在 Windows 系统中创建一个完整的 Ubuntu 安装，并允许您在 Windows 和 Ubuntu\
  \ 之间进行双启动。然而，这种方法并不用于作为完整的 Ubuntu 安装；它的可靠性和速度都不像普通的 Ubuntu 安装。\n\n# 第一部分：初探\n\n\
  #### 安装 Fedora\n\n当您从完整的内核 Linux 发行版进行安装时，您将会大惊喜。\n\n您有很多选择可以控制安装过程究竟安装哪些软件。\n\n\
  本节将引导您完成 Fedora 的图形化安装过程。如果由于原因您无法使用图形化安装程序（例如，Linux 不支持您的显卡），请改用文本安装。\n\n步骤是相同的，只是没有那么美观，而且您无法获得点击版版本中提供的所有选项。\n\
  \n图形界面设计为用于使用鼠标选择选项。如果您没有鼠标，可以使用键盘在屏幕间导航。在大多数地方，`Tab` 键或方向键可以将您带到下一个选项，`spacebar`\
  \ 空格键切换选项的开启，`Enter` 键接受选择并移动到下一个屏幕。在大多数屏幕上，如果您想更改之前的设置，可以使用 `Back`（返回）按钮导航到之前的选择屏幕。如果您想了解更多关于安装过程的信息，可以随时点击\
  \ `Release Notes`（发行说明）按钮。\n\n如果您使用的是随书附的 Fedora 11 完整安装 DVD 镜像，请使用刻录软件软件包创建安装 DVD。\n\
  \n免费的 `isorecoder` 包也可以刻录 DVD 镜像。在获得 Fedora 11 安装 DVD 后，按照以下步骤操作：\n\n### 1. 将 DVD\
  \ 放入 DVD-ROM 驱动器并重启系统。\n\n会出现若干启动选项，如图 3-6 所示。以下是每个选项的简述：\n\n* *安装或升级现有系统*：图形界面中的第一个（默认）选项用于首次安装\
  \ Fedora 或升级现有的 Fedora Linux 版本。\n* *使用带有基本视频驱动程序安装系统*：如果 Fedora 无法正确检测到系统中使用的显卡，此选项允许您使用通用视频驱动程序。\n\
  * *救援已安装的系统*：此选项实际上用于安装 Linux。相反，当出现问题时，您可以使用它进入*救援模式*。（有关救援模式的更多信息，请参见第 4 章。）\n\
  * *从本地驱动器启动*：这也不是安装选项。选择此菜单项允许您从硬盘启动，以防安装后启动菜单出现故障。\n\n![Image 18](img/index-68_1.jpg)\n\
  \n### 第 3 章：安装 Linux\n\n**图 3-6：** Fedora 初始安装屏幕。\n\n### 2. 选择“安装或升级现有系统”并按 Enter。\n\
  \nFedora 图形化安装过程开始，随着安装程序的启动，会有许多行信息滚动而。\n\n如果您自己下载了 Fedora 的完整版本并将其刻录到 CD 或 DVD\
  \ 上，会出现“找到 CD（介质检查）”屏幕。此屏幕允许您检查用于安装 Linux 的介质的完整性。如果是此类情况，我们建议花时间亲自对您下载的所有 CD 或\
  \ DVD 进行此测试。最好在现在就知道其中一个是否已损坏或不完整。\n\n无论您是否检查介质，初始的 Fedora 安装程序屏幕最终都会出现。\n\n###\
  \ 3. 当您准备好离开初始 Fedora 安装程序屏幕时，点击“下一步”。\n\n初始屏幕消失，取而代之的是语言选择屏幕。\n\n### 4. 选择您的语言并点击“下一步”。\n\
  \n接下来出现键盘配置屏幕。\n\n### 5. 选择您的键盘配置并点击“下一步”。\n\n不同的语言在键盘上的按键布局不同；您可能希望选择与您的键盘匹配的语言。（默认是美式英语。）\n\
  \n### 6. 选择安装 Fedora 的选项，并点击“下一步”。\n\n如果 Fedora 安装程序检测到您的硬盘上存在之前的 Fedora 版本，它会为您提供两个选项：您可以直接升级现有版本，或对新版本进行清洁安装。\n\
  \n### 7. 为您的工作站选择主机名和域名，并点击“下一步”。\n\n如果您共享驱动，这是其他网络设备在网络上将检测到的名称。\n\n### 8. 选择您的时区，然后点击“下一步”。\n\
  \n您可以从图形化地图上选择时区，也可以从城市下拉列表中选择。\n\n如果您的系统使用本地时间而不是 `UTC` 时间（美国大多数计算机都是如此），请取消勾选\
  \ `System Clock Uses UTC`（系统时钟使用 UTC）复选框。\n\n### 9. 在 root 密码屏幕上，在“Root Password”字段中输入\
  \ root（管理员）账户的密码，然后在“Confirm”字段中输入相同的密码。\n\n在您输入密码时看不到密码——每个字符只显示一个点。（点可以防止授权的人员看到密码。）如果您在其中一个框中输错了某些内容，当您尝试移动到下一步时会收到警告，并有机会重新输入值。如果您选择了一个安装程序认为较弱的——因此对您的系统安全构成威胁的密码，也会收到警告。\n\
  \n不要忘记您的 root 密码！您需要它在 Linux 设备上执行任何管理任务。如果您确实忘记了密码，我们将在第 18 章告诉您如何重置它。\n\n现在您到达了\
  \ Fedora 安装中最困难的部分。分区屏幕出现，如图 3-7 所示。\n\n### 10. 选择磁盘设置，并点击“下一步”。\n\n您有四个初始选项：\n\n\
  * *使用整个硬盘*：擦除此选项下方出现的复选框中勾选的硬盘上的所有内容。\n* *替换现有的 Linux 系统*：如果您已经在此选项下方显示的复选框标记的硬盘上安装了某个版本的\
  \ Linux，安装程序将找到之前的实例并覆盖它，擦除旧版本。\n\n![Image 19](img/index-70_1.jpg)\n\n**图 3-7：**\
  \ Fedora 分区屏幕。\n\n* *缩小当前系统*：更改现有的 Windows 或 Linux 分区以为您的 Fedora 安装创建空间。\n* *使用空闲空间*：找到可用的空闲空间并在那里安装\
  \ Fedora。\n* *创建自定义布局*：手动定义安装 Fedora 的分区。\n\n您还可以选择加密整个硬盘，使人们更难以进入您的数据，但这样做会减慢访问文件的速度。如果您想使用此选项，请勾选\
  \ `Encrypt System`（加密系统）复选框。\n\n\n\n\n\n如果你的系统支持高级磁盘选项（例如访问远程网络存储驱动器），点击“高级存储配置”按钮来添加高级驱动器。\n\
  \n如果你选择创建自定义布局，将显示图 3-8 所示的分区编辑器屏幕。\n\n你可以从编辑器中添加、删除和修改系统上的任何分区。它甚至允许你调整现有分区的大小，为你的\
  \ Fedora Linux 分区腾出空间。\n\n![Image 20](img/index-71_1.jpg)\n\n**图 3-8：** Fedora 分区编辑器屏幕。\n\
  \nFedora 的默认设置是创建一个逻辑卷管理器 (`LVM`)。`LVM` 将硬盘分区作为一个逻辑单元进行控制，允许你轻松地将分区添加到同一个 `LVM`\
  \ 单元中。通过这种方法，你可以轻松扩展系统的磁盘空间，而无需重新配置任何内容。\n\n### 11. 选择引导加载程序的位置，并点击“下一步”。\n\nFedora\
  \ 允许你通过选择引导加载程序的位置，以及选择在启动菜单中包含哪些操作系统，来定制通用统一引导加载程序 (`GRUB`)。这使得你能够从硬盘中启动 Fedora\
  \ 或 Windows。\n\n### 12. 选择要安装的软件。\n\n这是 Fedora 完整安装大显身之处。你可以根据需要选择在系统中安装哪些应用程序软件。图\
  \ 3-9 显示了主应用程序选择屏幕。\n\n要添加软件组，请勾选其复选框。要移除一个，请确保复选框保持未勾选状态。\n\n![Image 21](img/index-72_1.jpg)\n\
  \n**图 3-9：** 选择要安装的 Fedora 屏幕。\n\n可用的组有：\n*   **办公与效率 (Office and Productivity)：**\
  \ 我们假设你正在设置一个桌面级系统（而不是服务器），所以你要确保选中了此项。\n*   **软件开发 (Software Development)：** 如果你是一个程序员，你想添加此组。否则，你可以不需要它。\n\
  *   **Web 服务器 (Web Server)：** 如果你想在该系统上运行 Web 服务器，或只是想实验 Apache Web 服务器软件，请添加此项。否则你不需要它。\n\
  \n请记住，最后两个选项超出了本书的范围。\n\n“软件存储库”部分提供了可用网络资源列表，你可以从这些资源自动为你的 Fedora 系统加载新的更新和补丁（如果你的系统连接了互联网）。只有当你想要尝试尚未保证运行的开发包时，才应该选择\
  \ `Rawhide` 存储库！\n\n### 13. 在屏幕底部，选择“现在自定义”，然后点击“下一步”继续。\n\n出现软件包选择屏幕，如图 3-10 所示。\n\
  \n![Image 22](img/index-73_1.jpg)\n\n**图 3-10：** 软件包选择屏幕。\n\n### 14. 如果你想在系统上安装两个主要的\
  \ Fedora 图形界面，请点击 KDE (K 桌面环境)。)。\n\n你可能希望在系统上至少安装一个图形化桌面。我们在书中都涵盖了 `GNOME`（见第 4\
  \ 章）和 `KDE`（见第 5 章）桌面。默认选中的是 `GNOME` 桌面，如果你想跟随书中的所有内容操作，请也选择 `KDE` 选项。\n\n### 15.\
  \ 点击“应用程序”。\n\n右侧将显示该类别中可软件包类型。\n\n### 16. 滚动右侧列表。确保你需要的组复选框已勾选，并确保你不需要的组未勾选。\n\n\
  你可以点击组名称来查看其描述。\n\n许多软件包已默认选中。我们在书中会涵盖所有这些软件包，因此我们建议保持默认选中的软件包，以获得完整的 Linux 体验。\n\
  \n### 17. （可选）要查看此组的可选软件包（程序），点击“可选软件包”按钮。在“软件包”对话框中选择可选软件包。然后点击“关闭”返回软件包选择屏幕。\n\
  \n如果该组尚未标记为要安装，则此按钮不可用。对于每个软件包组，某些程序默认安装，而其他程序被视为可选。\n\n### 18. 对任何剩余类别重复步骤 15–17（例如，用于软件编程工具的“开发”）。\n\
  \n### 19. 当你完成所有选择——你以后可以更改安装的内容——点击“下一步”。\n\n出现一个对话框，告诉你安装程序正在检查你选择的软件列表。如果它发现你漏掉了所选软件所依赖的程序，它将为你提供添加这些程序的机会（点“是”！）。完成后，将出现安装屏幕。\n\
  \n如果你想停止 Linux 的安装和/或在安装程序对你的硬盘做出更改之前停止，安装屏幕是你可以在*不*更改硬盘上任何内容的情况下停止此过程的*最后*地方。要停止安装，按下\
  \ `Ctrl+Alt+Del`，系统将重启。然而，如果你这样做了且不打算重新安装，请务必在系统重启时取出 DVD 或第一张 CD。\n\n### 20. 当你准备好确认安装时，点击“下一步”。如果你从\
  \ CD 安装，可能会出现“所需的安装介质”对话框，确切告诉你安装所需的哪些 CD。如果你使用 CD，取决于你请求的软件，可能不需要所有的它们。\n\n之后，将出现软件包安装屏幕。系统首先准备安装，然后开始安装。当系统正在安装自身时，你会看到每个正在安装的软件包名称以及一个跟踪总安装完成的进度条。\n\
  \n软件包安装完成后，你将到达最终安装屏幕，屏幕会欢迎你：“恭喜，安装完成”。CD 或 DVD 会自动弹出（如果没有，请手动弹出）。\n\n### 21. 移除安装介质，点击“重启”重启机器，并继续本章的下一节，“你的首次\
  \ Fedora 启动”。\n\n如果你想直接关闭电脑，此时这样做是安全的。下次你启动机器时，将进行下一节“你的首次 Fedora 启动”中讨论的过程。\n\n\
  #### 你的首次 Fedora 启动\n\n当 Fedora 系统首次启动时，你仍然需要进行一些配置。\n\n当 Fedora 启动时，你有第一次看到启动菜单的机会——那个在进入默认选项之前给你三秒钟做选择的蓝屏——闪过：\n\
  \n*   如果你将 Windows 设置为默认值，按任意键（如空格键）进入菜单，选择 Linux 条目并按 `Enter`。\n*   如果 Linux 是默认（或唯一）安装的操作系统，只需坐好让机器自行启动即可。\n\
  \n如果由于任何原因，你的电脑在此处无法启动，请参第 22 章。\n\n当电脑首次启动时，你会看到首次启动欢迎屏幕。\n\n执行以下操作以完成机器的初始设置：\n\
  \n1.  **点击“向前”继续设置程序。**\n\n出现许可协议屏幕。\n2.  **阅读这段文字，选择“是，我同意许可协议”，然后点击“向前”。**\n\n\
  出现“创建用户”屏幕。\n3.  **输入用户名、你的全名和密码，然后点击“向前”。**\n\n当你安装 Fedora 时，你为 `root` 用户账户设置了密码，但你只想将其用于管理事务，例如添加新软件。大多数时候，使用你自己的用户账户登录以使用桌面应用程序。\n\
  \n接下来出现“日期和时间”屏幕。\n\n\n\n\n\n# 4. 如果你所在的计算机网络已连接到互联网并且通常连接互联网（或你的网络管理员要求你使用时间服务器），请点击“网络时间协议”选项卡。否则，请跳到第\
  \ 7 步。\n\n让 `time server` 控制你的日期和时间可以确保你的计算机定期获取关于真实日期和时间的输入。否则，随着时间的推移，计算机的时钟实际上会偏离正确时间。\n\
  \n### 第 3 章：安装 Linux\n\n## 5. 勾选“启用网络时间协议”框以启用此功能。\n\n## 6. 如果你的网络管理员要求你添加特定的时间服务器，点击“添加”，然后输入该服务器的地址。跳到第\
  \ 8 步。\n\n## 7. 如果你打算手动控制机器的日期和时间，请验证日期时间是否准确；如果不正确，请现在修复这些设置。\n\n## 8. 在完成调整日期和/或网络时间服务器后，点击“下一步”继续。\n\
  \n如果你告诉系统使用网络时间协议（`NTP`），系统可能需要一些时间来连接你选择的服务器。几秒钟后将出现硬件配置文件屏幕。\n\n## 9. 选择“发送配置文件”，以便\
  \ Fedora 项目知道 Fedora 运行在什么硬件上，然后点击“下一步”。\n\n数据是匿名发送的——这确保了项目开发人员知道你正在运行什么（但不知道你是谁）。他们在进一步开发\
  \ Fedora 时，会考虑到用户正在使用的硬件。\n\n## 10. 点击“完成”。\n\nFedora 完成启动过程并用登录界面欢迎你。\n\n就此了！你刚刚度过了第二个\
  \ Linux 考验！你的计算机现在将带你进入图形化登录提示。关于从这里开始该做什么，请参阅第 4 章。享受探索 Linux 的吧！\n\n# 第一部分：入门\n\
  \n### 第 4 章：检查 GNOME 桌面\n\n### 本章内容\n- 了解 GNOME 基础\n- 定制 GNOME\n\n*如果说杂乱的桌面是心绪混乱的标志，那么整洁的桌面又意义何呢？*\
  \ — Laurence J. Peter (1919–1988)\n\n许多人喜欢将 Linux 描述为一种类似 DOS 的环境，在这个古老的世界里，你所能做的就是通过命令行操作，必须输入大量晦涩的内容，而没有任何精美的图片。然而，正如你在本章中所发现的，Linux\
  \ 桌面提供了一个非常棒的工作环境。酷的地方在于，它的大部分内容都是可配置的。喜欢自定义系统的人可以在改变各种设置上获得极大的乐趣。\n\nLinux 世界有两个流行的图形化桌面环境：GNOME\
  \ 和 KDE。本章将带你了解 GNOME 桌面，Fedora、Ubuntu 和 gOS 默认都使用它。（第 5 章将介绍 KDE 图形桌面环境。）\n\n###\
  \ 拆解 GNOME 桌面\n\nGNOME 的全称是 GNU Network Object Model Environment——尽管这个缩写并没有告诉你太多信息。只需说\
  \ GNOME 是一个完整的点点点击环境——颜色、小图片，应有尽有。\n\nGNOME 桌面在 Fedora 的祖父 Red Hat Linux 中流行起来，因此它是\
  \ Fedora 的默认桌面并不意外。许多其他 Linux 发行版也使用 GNOME 桌面作为默认；Ubuntu 就是一个典型的例子。\n\n![Image 23](img/index-79_1.jpg)\n\
  \n图 4-1 显示了你登录 Ubuntu 系统后 GNOME 桌面的样子。\n\n**图 4-1：** Ubuntu 9.04 中的默认 GNOME 桌面。\n\
  \n### 菜单\n要了解更多关于 GNOME 的信息，请访问 GNOME 官方网站 `www.gnome.org`。\n\n请记住，你拥有的程序取决于你选择的安装类型以及自定义的系统功能；如果你拥有的与描述或图中看到的不同，不要惊慌！\n\
  \nGNOME 桌面环境分为四个部分：\n- 菜单\n- 屏幕顶部的菜单和图标面板\n- 屏幕底部的桌面面板\n- 桌面上的图标（图 4-1 没有显示桌面上的任何图标，因为默认的\
  \ Ubuntu 安装不包含图标。请在“配置你的桌面外观”部分查找如何向桌面添加图标。）\n\n### 菜单\nGNOME 有三个主菜单，所有它们在顶部面板上均可见。从左到右它们是：\n\
  \n- **应用程序（Applications）：** 通过图形用户界面（`GUI`）可用的程序。\n- **位置（Places）：** 硬盘上特殊位置的快捷方式。（注意，你不必在“位置”中使用为你创建的特殊目录，如\
  \ `Documents`、`Pictures` 等。）第 7 章将更详细地介绍如何查看目录和文件。\n- **系统（System）：** 个人和系统设置，以及更通用的整体系统命令。\n\
  \n带有向右箭头的菜单项提供了子菜单，你可以通过将鼠标指针悬停在该菜单选项上来打开它。通常子菜单内部还有它们自己的子菜单，提供更多程序。\n\n在接下来的章节中，我们将详细介绍在这些三个菜单中常见的更常见的子菜单。\n\
  \n#### 应用程序\n和其他所有内容一样，每个不同的 Linux 发行版都喜欢调整 GNOME 菜单以为系统提供自己的风格——尽管无论如何，某些菜单项在 GNOME\
  \ 菜单系统中保持一致。\n\n表 4-1：应用程序菜单内容\n\n| 菜单选项 | 你能找到的内容 |\n| :--- | :--- |\n| 附件 (Accessories)\
  \ | 小型、特定功能的程序。包含计算器、字符映射、字典、截屏程序、文本编辑器等。 |\n| 游戏 (Games) | 游戏集合。 |\n| 图形 (Graphics)\
  \ | 各种图形程序，包括 `The GIMP`（见第 14 章）。 |\n| 互联网 (Internet) | 你将在第 9 章和第 10 章中看到的几个互联网工具，如\
  \ `Evolution`（电子邮件和日历程序）、`Pidgin`（即时通讯）和 `Firefox`（网络浏览器）。 |\n| 办公 (Office) | `OpenOffice.org`\
  \ 应用程序套件（第 12 章讨论）和其他实用的生产力程序。 |\n| 音视频 (Sound & Video) | 程序，如 CD 播放器和声音录音机，用于处理你的计算机的多媒体硬件（见第\
  \ 13 和第 14 章）。 |\n| 系统工具 (System Tools) | 工具，如文件浏览器和软件更新程序（Ubuntu 中未使用），用于管理、监控和更新你的系统。\
  \ |\n| 添加/删除 (Add/Remove) | 打开应用程序安装和删除实用。 |\n| 软件 (Software) | |\n\n#### 位置\n`位置`\
  \ 菜单（表 4-2 说明）要标准一些。GNOME 桌面提供了几个用于存储特定类型数据的文件夹。“位置”菜单为访问你的所有文件夹提供了一站式服务。\n\n表 4-2：位置菜单内容\n\
  \n| 菜单选项 | 你能找到的内容 |\n| :--- | :--- |\n| 主目录 (Home Folder) | 用户账户主目录的内容，如第 7 章所述。\
  \ |\n| 桌面 (Desktop) | 用户账户 `Desktop` 目录的内容，包含应该出现在你桌面上的文件和文件夹。 |\n| 文档 (Documents)\
  \ | 用户账户 `Documents` 目录的内容，你可以在其中放置你正在处理的文件。 |\n| 音乐 (Music) | 用户账户 `Music` 目录的内容，你可以在其中保存音乐文件。\
  \ |\n| 图片 (Pictures) | 用户账户 `Pictures` 目录的内容，你可以在其中保存图片。 |\n| 视频 (Videos) | 用户账户\
  \ `Videos` 目录的内容，你可以在其中保存视频。 |\n| 下载 (Download) | 用户账户的 `Download` 目录（Ubuntu 中未使用），你的在线下载内容的存放地。\
  \ |\n| 计算机 (Computer) | 系统上用的硬盘和临时介质。 |\n| CD/DVD 创建器 (CD/DVD Creator) | |\n\n\n\
  \n\n\n这是一个用于收集你想要刻录到 CD 或 DVD 文件的特殊文件夹。\n\n## 网络\n你网络上可用的计算机和硬盘。\n\n## 连接服务器\n用于连接许多不同类型服务器的工具。\n\
  \n## 搜索\n一种文件系统搜索工具，不仅搜索文件内容，还可以搜索文件名。\n\n## 最近文档\n你最近打开的文档。\n\n## 系统\n`System`\
  \ 菜单提供了访问系统配置界面。通常情况下，GNOME 提供两种类型的配置设置：\n\n- **用户特定设置：** 仅影响你的用户账户在系统上的运行方式的项目，例如屏幕分辨率、背景颜色和键盘偏好。\n\
  - **系统特定设置：** 影响整个 Linux 系统的项目，例如网络设置、声音设置和用户账户。\n\n表 4-3 详细介绍了这些设置在 `System` 菜单中的显示方式。\n\
  \n### 表 4-3：系统菜单内容\n\n| 菜单选项 | 显示的内容 |\n| :--- | :--- |\n| 偏好 | 你的个人用户设置。 |\n| 管理\
  \ | 系统级设置。 |\n| 帮助 | GNOME 帮助工具。 |\n| 关于 GNOME | 关于 GNOME 的信息。 |\n| 锁屏 | 设置你的机器，使无人在输入密码的情况下无法使用你的\
  \ GNOME 登录的功能（在 Ubuntu 中未使用）。 |\n| 注销用户 | 允许你离开当前的登录会话（在 Ubuntu 中未使用）。 |\n| 关机 |\
  \ 休眠（进入睡眠/休眠模式）、重启（重新启动）或关机（关闭）机器（在 Ubuntu 中未使用）。 |\n\n![Image 24](img/index-83_1.jpg)\n\
  \nUbuntu 选择将最后三个菜单项（锁屏、注销和关机）从 `System` 菜单移出，放入一个特殊的面板插件中（在本章的“Applet 区域”部分讨论）。`Shut\
  \ Down` 插件图标为你提供了这些选项。\n\n如果你开启了屏幕保护并从 `System` 菜单中选择 `Lock Screen` 选项，你的屏幕保护将会出现或淡入黑色。然后，如果有人移动鼠标或使用你的键盘，就会弹出一个对话框，其中包含你的登录名称和一个密码字段。你可以输入密码返回工作。在此之前，你可以放心地知道，没有人可以溜到你的电脑前，假装成你给老板发送一封玩笑邮件。\n\
  \n如果你以 `root` 用户身份登录，`Lock Screen` 选项将不起。\n\n屏幕保护功能在 Fedora 和 Ubuntu 中默认都是开启的。要更改设置，请执行以下操作：\n\
  \n1. **选择 `System` ➔ `Preferences` ➔ `Screensaver`（Ubuntu 中）或 `Look and Feel` ➔\
  \ `Screensaver`（Fedora 中）。**\n\n会出现 `Screensaver Preferences` 对话框，如图 4-2 所示。\n\n\
  2. **点击 `Lock Screen When Screensaver Is Active` 复选框以选择或取消勾选。**\n\n3. **完成更改后，点击\
  \ Close。**\n\n对话框将关闭。（注意，在此对话框中，你还可以更改屏幕保护是否开启、开启需要多长时间以及使用哪种屏幕保护。）\n\n#### 面板\n\
  你的 GNOME 桌面上有一对面板——一个在顶部，一个在底部。由于这些栏被整齐地划分为若干区域，请从左到右查看（从顶部面板开始）每个区域的内容。\n\n顶部面板的最左侧是本章较早之前“菜单”部分讨论的三个菜单。\n\
  \n面板有三个不同的区域：快速启动图标、插件（applets）和底部面板。\n\n### 快速启动图标\n在顶部面板的菜单区域之后，你会遇到一组 `quick-launch\
  \ icons`（参考图 4-1），它们会自动启动特定的应用程序。\n\n你可以通过菜单访问所有这些项目，但它们位于面板上是为了方便查找。在 Fedora 和\
  \ Ubuntu 中，这些图标是：\n\n- **Firefox：** 带有狐狸的行星图标打开 `Firefox`  浏览器。（更多请见第 9 章。）\n- **Evolution：**\
  \ 位于浏览器按钮正右侧；启动电子邮件和日历程序。（更多请见第 10 章。）Ubuntu 还包含一个 `Help` 图标，以便快速访问 `Ubuntu Help`\
  \ 手册。\n\n### 插件区域\n快速启动图标旁边是一个空白区域，你可以在那里添加新图标。空白区域的右侧是顶部面板的 `applet area`。\n\n\
  GNOME 插件是你直接从面板访问的小程序。它们的强大之处在于插件会与面板交互，通常直接在面板上显示信息，从而避免了你必须启动一个巨大的窗口来查看信息。\n\n\
  大多数使用 GNOME 桌面的 Linux 发行版默认会在顶部面板上放置几个插件。在 Fedora 中，从左到右你会找到这些——尽管你的特定安装可能显示额外的选项：\n\
  \n- **Shut Down：** 该插件为你提供了一个快速方便的位置来终止桌面会话。有多个选项，包括重启计算机、注销用户并返回登录屏幕以及关闭系统。\n-\
  \ **NetworkManager：** 如果你的工作站中有有线或无线网卡，Ubuntu、Fedora 和 gOS 默认都会启动 `NetworkManager`\
  \ 插件。`NetworkManager` 方便你配置网卡设置并控制网络连接。它还会指示有线连接的网络流量和无线连接的信号强度。\n- **User Switcher：**\
  \ 如果你创建了多个用户账户（root 不算），点击顶部面板上的名称；会出现系统中其他用户的列表。你可以使用此插件临时切换到另一个用户账户。如果你没有创建其他账户，点击你的名称只会显示你的名字。\n\
  - **Date and Time：** 在这里你可以看到日期时间，取决于该插件的配置。\n- **Master Volume Control：** 点击此打开主音量控制。\n\
  \n### 底部面板\n现在是底部面板。从左到右，你在此面板上找到以下项目：\n\n- **Hide/Restore Desktop Applications：**\
  \ 此按钮让你立即最小化所有运行中的程序，然后只需点击即可重新打开它们。\n- **Taskbar：** 在这个大空间内，你可以找到桌面上运行每个程序的条目。你可以按照指示使用方框更改程序状态：\n\
  \    - 如果程序被最小化，可以通过点击其面板任务框来打开其窗口。\n    - 如果程序已最大化但被其他程序覆盖，点击面板上的上的任务框将其置于最前。\n\
  \    - 如果程序已最大化且在上方，你可以通过点击其面板任务框将其最小化。\n- **Workspace Switcher：** 允许你在同一个登录会话中使用四个不同的桌面环境中工作。每个桌面环境具有相同的菜单、面板和背景，但你可以在每个环境中运行不同的程序。这是在多个程序中工作时保持井然有序的简单方法。试一下。这就像在一个显示器里四个四个！\n\
  - **Trash Can：** 桌面垃圾桶的快捷方式。\n\n想将程序从一个工作空间窗口移动到另一个吗？点击程序左上角的图标并选择以下选项之一：\n\n- **Always\
  \ on Visible Workspace：** 让窗口在所有四个工作空间上显示。\n- **Only on this Workspace：** 保持窗口不在其他工作空间中出现（默认开启）。\n\
  - **Move to Workspace Right：** 将窗口水平向右滑动，进入“邻壁”工作空间。\n- **Move to Another Workspace：**\
  \ 提供你指定工作空间 1（最左侧）、2（左起第二个）、3（左起第三个）或 4（最右侧）的选择（仅在你配置了两个以上工作空间时可见）。\n\n\n\n\n\n\
  要查看打开的窗口位于哪个工作区，请查看工作区切换器（Workspace Switcher）；在那里你可以发现与你的桌面布局相匹配的小窗口。\n\n#### 玩转\
  \ GNOME 桌面图标\n\n屏幕上顶部和底部面板之间的区域被称为 `desktop`（桌面）。桌面实际上是你主目录中的一个独立文件夹，但其内容以图标的形式图形化显示在你的屏幕上。这为你提供了一个存储文件、额外文件夹和应用程序快速启动图标的地方，从桌面可以轻松访问它们。\n\
  \n你的初始桌面图标可能有所不同，取决于你安装了哪种 Linux 发行版。Ubuntu 发行版默认不使用任何桌面图标。Fedora 的默认桌面图标会在屏幕左上角形成一条垂直线。从上到下，你看到的内容如下：\n\
  \n- **计算机（Computer）：** 打开 `Nautilus` 文件管理器（参见第 7 章），并列出你的 CD-ROM 驱动器、硬盘等列表。\n- **主目录（Home）：**\
  \ 打开 `Nautilus` 浏览器（第 7 章），并显示你主目录的内容。\n- **垃圾箱（Trash）：** 一个 GNOME 快捷方式，用于打开指向 `Trash`\
  \ 文件夹的 `Nautilus` 文件管理器，该文件夹包含你拖入的文件。\n\n要使用垃圾箱，将任何你想删除的文件拖入其中。稍后，如果你确定要丢弃它们，可以通过三种方法之一清空垃圾箱：\n\
  \n- 右键点击垃圾箱图标并从上下文菜单中选择 `Empty Trash`（清空垃圾箱）来清空整个垃圾箱。当要求确认时，点击 `Empty`。\n- 双击图标打开垃圾箱。然后通过选择\
  \ `File➪Empty Trash`（文件 -> 清空垃圾箱）来删除垃圾箱的所有内容。\n- 双击图标打开垃圾箱。要删除垃圾箱中的单个项目，右键点击它并选择\
  \ `Delete from Trash`（从垃圾箱删除）。当询问是否确定时，点击 `Delete` 完成操作。\n\n你可以通过按住 `Ctrl` 键单独选择多个项目，即使它们不相邻；通过按住\
  \ `Shift` 键选择范围内的项目；或者通过左单击并拖动来收集同一个框内的所有项目。\n\n你也可以从主目录区域的 `Trash` 文件夹手动删除文件（参见第\
  \ 7 章中的操作方法）。\n\n#### 自定义你的面板\n\n你可以通过 `Panel` 菜单单独自定义上方和下方面板。要为此操作，在你想要处理的面板上找到空闲空间，右键点击，并从上下文菜单中选择相应的项目。（有关此菜单提供的列表，请参见表\
  \ 4-4。）\n\n如果你打开了太多程序，以至于占用了底部面板的整个宽度，你可能没有空闲空间进行右键点击。关闭一个程序以腾出空间。\n\n### 表 4-4：GNOME\
  \ 面板菜单内容\n\n| 菜单选项 | 你能找到 |\n| :--- | :--- |\n| 添加到面板 (Add to Panel) | 允许向主面板添加应用程序（applets）、菜单和其他对象的对话框。\
  \ |\n| 属性 (Properties) | 设置此面板行为的选项。 |\n| 删除此面板 (Delete This Panel) | 删除二级面板但不能删除主图标面板的能力。\
  \ |\n| 新面板 (New Panel) | 在屏幕不同部分创建新面板的选项。 |\n| 帮助 (Help) | 用于 GNOME 的帮助浏览器。 |\n\
  | 关于面板 (About Panels) | 包含一些基本面板信息的对话框。 |\n\n### 第 4 章：检查 GNOME 桌面\n\n## 向面板添加应用程序\n\
  \n`Add to Panel` 对话框（参见图 4-3）可以通过 `Panel` 菜单访问（参见上一节）。该对话框包含一个应用程序（applets）列表——这些是微小的、专门的程序，你可以用它们来为面板添加特定的功能。要将这些程序之一添加到你的面板中，请打开对话框，选择你想使用的程序，然后点击\
  \ `Add`（添加）。该程序现在出现在了你的面板上。如果你右键点击该程序并选择 `Move`（移动），就可以沿着面板滑动该程序，直到将其放置在你想要的位置，然后点击释放。\n\
  \n你可能已经注意到第一个应用程序项是 `Custom Application Launcher`（自定义应用程序启动器）。使用此功能，你可以创建一个可以启动你自己的程序或脚本的面板图标。\n\
  \n### 配置应用程序\n\n在你放置并运行应用程序后，你可能可以尝试各种配置选项。其中某些选项允许你更改显示的信息。另一些选项则具有多种外观设置。\n\n\
  要确定你的应用程序可以使用哪些配置和其他选项，请遵循以下步骤：\n\n1. **右键点击该程序，并检查出现的快捷菜单。**\n   此快捷菜单因应用程序而异。底部部分始终相同：`Remove\
  \ from Panel`（从面板移除）、`Move`（移动）和 `Lock to Panel`（锁定面板以防止图标移动）。顶部部分的常见条目有 `Help`（帮助）和\
  \ `About`（关于）。其余项目要么是配置选项（参见步骤 2），或者是特殊的应用程序功能，例如从 `Clock`（时钟）应用程序中复制日期的功能。\n2.\
  \ **从快捷菜单中选择 `Preferences`（偏好）。**\n   并不是每个应用程序都有 `Preferences` 对话框。如果你选择的有，那么当你选择此选项时，对话框就会打开，显示应用程序的配置功能。\n\
  3. **修改 `Preferences` 对话框中的选择以自定义此应用程序的行为。**\n   现在你可以尽情玩了。\n4. **点击 `Close`（关闭）保存你的更改并关闭对话框。**\n\
  \n### 移除应用程序\n\n你能够容纳的应用程序数量有限。如果你像我们一样，可能不希望每个角落都满了图标。要从面板上删除应用程序，只需右键点击你想删除的程序，当菜单出现时，选择\
  \ `Remove from Panel`（从面板移除）。程序就会无声无息地从面板上消失。当然，你可以回到 `Add to Panel` 菜单选项让它回来！\n\
  \n## 将程序添加到面板或\n\n如果你有一个经常使用的程序，可以通过以下步骤将其添加到面板：\n\n1. **选择 `Applications` 并浏览到你想添加到面板的程序。**\n\
  \   不要打开程序。只需用鼠标指针指向该菜单项。\n2. **右键点击程序并选择 `Add This Launcher to Panel`（将启动器添加到面板）将其添加到面板，或选择\
  \ `Add This Launcher to Desktop`（将启动器添加到桌面）将其添加到桌面。\n\n该程序的图标出现在你的面板或桌面上。当你将程序放在面板上后，只需点击图标即可运行程序。如果你将其添加到了桌面，则双击图标。\n\
  \n如果你对桌面图标的位置不满意，点击它并拖动到新位置。对于面板项，右键点击它，选择 `Move`（移动），将图标拖到你想要的地方，然后点击将其固定。\n\n\
  你还可以为整个菜单向面板添加*抽屉*（菜单按钮）。要为此操作，请遵循以下步骤：\n\n1. **点击 `Applications` 并浏览到你想添加的子菜单。**\n\
  2. **进入该子菜单。**\n   例如，如果你想为面板添加 `Graphics` 菜单的按钮，打开 `Applications` 菜单，将鼠标移动到 `Graphics`\
  \ 菜单，然后向右移动进入 `Graphics` 菜单的内容。\n3. **右键点击打开上下文菜单。**\n4. **选择 `Entire Menu`（整个菜单），然后选择\
  \ `Add This As Drawer to Panel`（作为抽屉添加到面板）或 `Add This As Menu to Panel`（作为菜单添加到面板）。**\n\
  \n很容易看出区别：抽屉仅以图标显示其内容；菜单看起来更像 `Applications` 菜单中的子菜单。\n\n\n\n\n\n#### 从桌面或面板移除程序\n\
  \n若要删除桌面上的图标，请右键点击该图标并在弹出的快捷菜单中选择`移动到垃圾箱`（Move to Trash）。\n\n如果您想移除面板上的某一个程序，只需右键点击想要移除的图标，当快捷菜单出现时，选择`从面板移除`（Remove\
  \ from Panel）。图标将从面板上消失。就此完成！\n\n![Image 26](img/index-91_1.jpg)\n\n# 第一部分：入门指南\n\
  \n## 配置桌面外观\n\n除了桌面上的对象外，GNOME 还允许您配置桌面的显示方式。\n\n控制桌面外观感觉的主要控件是`外观偏好`（Appearance\
  \ Preferences）对话框。选择`系统➪设置➪外观`，即可打开`外观偏好`对话框，如图 4-4 所示。\n\n**图 4-4：** GNOME 外观对话框。\n\
  \n`外观偏好`对话框提供了五个选项卡来控制桌面的外观和感觉：\n* 主题（Theme）\n* 背景（Background）\n* 字体（Fonts）\n* 界面（Interface）\n\
  * 视觉效果（在 Fedora 中这是一个单独菜单项）——本节将介绍如何使用此工具根据您的喜好自定义桌面。\n\n![Image 27](img/index-92_1.jpg)\n\
  \n### 第 4 章：检查 GNOME 桌面\n\n#### 桌面主题\n\n`主题`是一个命名的设置组，用于控制对象在桌面上的整体显示方式——例如复选框、单选按钮、文件夹图标以及窗口的配色方案。Ubuntu\
  \ 包含了九个主题——其中一些是为视觉障碍人士设计的高对比度主题。\n\nUbuntu 设置的默认主题名为 `Human`。它在桌面上呈现出轻松的橙色窗口主题。选择任何主题进行测试。\n\
  \n如果您不喜欢所选的主题，可以通过`外观偏好`对话框中选择不同的主题来轻松更改。\n\n在选择主题后，您可以对它的外观和感觉进行额外的更改。点击`自定义`（Customize）按钮打开`自定义主题`对话框，如图\
  \ 4-5 所示。\n\n**图 4-5：** 自定义桌面主题。\n\n`自定义主题`对话框允许您更改单个项目的外观，例如复选框和单选按钮、窗口、窗口边界、用于文件夹和文档的图标以及鼠标指针。\n\
  \n互联网上有许多适用于 GNOME 的主题；然而，您可能需要寻找一段时间并忍受一些挫折，直到找到一个既喜欢又与您的安装版本兼容的主题。要查找并获取供自己使用的主题，请遵循以下步骤：\n\
  \n1. **将网页浏览器指向 `http://themes.freshmeat.net`。** 您将进入主题 网站，那里提供了大量用于自定义 GUI 的项目。如果您热衷于自定义您的\
  \ GUI，也可以查看 `http://art.gnome.org`。特别，请查看 `http://live.gnome.org/GnomeArt/Tutorials`。\n\
  2. **在 Freshmeat 上，在搜索框中输入 GTK themes 并点击搜索按钮。** 您将进入网站的一个区域，在该区域您可以确保所选择的主题确实可以在您的系统上运行（`GTK`\
  \ 是极客对 GNOME 桌面环境一部分的术语）。\n3. **选择 GTK 2.X Themes 区域。** 现在您进入了最新版本 GNOME 的区域。\n\
  4. **浏览并选择您想要的主题。** 如果您创建账户并登录，可以使用`排序顺序`（Sort Order）下拉列表更改项目的显示顺序。在查看主题信息时，请注意与主题一起的运行（有时称为`依赖项`\
  \ dependencies）。某些主题需要额外的`引擎`（在后台运行的软件）；如果您不习惯在现阶段查找和添加软件，那么最好避免这些主题。如果您寻找的是 `GTK`\
  \ 主题，就可以避免这些额外的烦恼。\n5. **在选择好主题后，点击其名称进入主题特定页面。** 在那里，您可以找到有人对该主题发表的任何评论。\n6. **如有必要，向下滚动并点击\
  \ Tar/GZ 或 Tar/BZ2 下方的链接。** 当被询问对如何处理该文件时，点击`保存到磁盘`，最后点击`确定`下载文件。默认情况下，Firefox 浏览器会将文件存储在桌面上（见第\
  \ 9 章）。\n7. **打开外观偏好对话框，选择主题选项卡，然后点击安装按钮。** `选择主题`（Select Theme）对话框打开，如图 4-6 所示。\n\
  \n![Image 28](img/index-94_1.jpg)\n\n**图 4-6：** GNOME 选择主题对话框。\n\n8. **浏览到您存储主题的位置。**\
  \ 如果您没有更改 Firefox 的默认设置，它将在您的 `Desktop` 目录中。\n9. **确保主题文件是 `.tar.gz` 文件。** 如果不是，请查看第\
  \ 16 章查找如何将此文件转换为此格式。\n10. **选择主题文件并点击打开按钮。** 主题安装，您会看到一个确认对话框。如果被提示主题无效——但主题确实指定的格式——那么您获取的主题并不是为您的设置准备的。如果您查看主题页面，它在`环境`（Environment）或`依赖项`（Dependencies）部分可能有些内容试图告诉您这一点，但那是写给极客看的，所以如果解释看起来像乱码，请不要自责。只需返回尝试另一个主题即可。\n\
  11. **如果您想立即更改主题，请选择`应用新主题`。否则，选择`保持当前主题`。** 您可能看到或看不到这个选项。如果没有看到，请不要慌：有不同类型的主题——有些显示此选项。如果您确实看到它出现并选择了`应用新主题`，您的桌面将更改以匹配该主题。\n\
  \n根据主题的不同，您的新主题可能会被添加到主题列表中。如果没有在那里看到它，请点击`自定义`按钮。在`自定义主题`对话框中，您看到三种不同类型的主题：\n*\
  \ `Controls`控件：影响桌面上控件外观的主题。\n* `Window Borders`窗口边界：更改窗口边界外观的主题。\n* `Icons`图标：更改图标外观的主题。\n\
  \n您的新主题可能列在这些位置中的一个或多个位置。\n12. **如果还没有，请从列表中选择您的新主题。** 无论您是在主列表还是`主题详情`对话框中选择主题，您的桌面都会更改以匹配选择。如果主题不在主列表中，您将在选项顶部看到`自定义主题`（Custom\
  \ Theme）。点击`保存主题`并为桌面的新外观分配新名称。\n13. **当您对桌面外观满意时，点击关闭。** `外观偏好`对话框关闭。\n\n#### 背景\n\
  \n桌面背景是一个重要功能，因为它是您盯着最多的地方。Ubuntu 和 Fedora 都允许您使用图像作为背景（称为`壁纸`）或使用颜色背景。\n\n`背景`（Background）选项卡控制桌面背景的内容。您可以使用默认加载的图像，为背景选择颜色，或加载自己的壁纸图像。要设置背景，打开`外观偏好`对话框，点击`背景`选项卡，然后遵循以下步骤：\n\
  \n1. **点击添加（Add）按钮。**\n2. **使用浏览器找到您的图像文件。** GNOME 支持使用任何图像文件类型作为背景图像。\n3. **点击打开按钮。**\
  \ 图像被导入到背景列表中，并自动选择为背景壁纸。\n\n`无壁纸`（No Wallpaper）选项允许您为背景选择单一颜色，或从一种选定颜色到另一种颜色的渐变（水平或垂直）。GNOME\
  \ 使用了一个酷炫的色轮来选择颜色，如图 4-7 所示。\n\n![Image 29](img/index-96_1.jpg)\n\n**图 4-7：** 颜色-\n\
  \n\n\n\n\n## 选择\n\n轮盘。只需从外轮盘点击基础颜色，然后从内三角形中选择阴影。\n\n#### 字体\n\n`Fonts` 选项卡允许你自定义\
  \ Ubuntu 在桌面各种功能中使用的字体。如所预期，Ubuntu 提供了许多不同的字体供选择。另一个很棒的功能是，你可以自定义字体在屏幕上的渲染方式。\n\n\
  点击 `Fonts` 选项卡页面底部的 `Details` 按钮将打开 `Font Rendering Details` 对话框，如图 4-8 所示。在这里你可以真正深入研究在屏幕上渲染字体的基础知识。\n\
  \n字体设置得越详细，看起来就越漂亮——但显示文本所需的处理时间和性能也越多。\n\n![Image 30](img/index-97_1.jpg)\n\n**图\
  \ 4-8:** 字体渲染详情对话框界面。\n\n#### 界面\n\n`Interface` 选项卡提供了几个设置，用于自定义菜单和工具栏在窗口中的出现方式：\n\
  \n- **在菜单中显示图标：** 在菜单文本项旁边显示图标。\n- **可编辑的菜单快捷键：** 允许使用快捷键选择菜单选项。\n- **工具栏按钮标签：**\
  \ 设置工具栏项的显示方式：仅文本、仅图标、图标下方带文字或图标旁边带文字。\n\n这些窗口设置适用于任何使用 `GNOME` 界面的窗口。它们不适用于未使用\
  \ `GNOME` 库的应用程序，例如基于 `KDE` 桌面库的应用程序。\n\n#### 视觉效果\n\n`Visual Effects` 选项卡允许你选择桌面处理窗口的华丽程度。效果有三个级别：\n\
  \n![Image 31](img/index-98_1.jpg)\n\n- **无：** 窗口直接出现和消失，没有任何特殊特效。\n- **正常：** 窗口在启动时淡入，关闭或最小化时淡出。\n\
  - **额外：** 这一级提供了更华丽的效果，例如窗口最小化时的融化效果。额外级别的效果需要你的电脑配备先进的显卡。\n\n## 辅助功能\n\n`GNOME`\
  \ 桌面包含若干功能，使残障人士能够使用替代方法在桌上操作应用程序。这些功能包括屏幕放大镜（放大屏幕区域）、屏幕阅读器（读取屏幕上的文本）以及键盘和鼠标辅助功能（如粘滞键和慢单击）。你可以根据需要启用单个功能。\n\
  \n在使用单独的辅助功能之前，你需要在 `GNOME` 中启用辅助功能。按照以下步骤启用辅助技术包：\n\n1. **System（系统） ➔ Preferences（偏好）\
  \ ➔ Assistive Technologies（辅助技术）。**\n\n打开 `Assistive Technologies Preferences` 对话框，如图\
  \ 4-9。\n\n**图 4-9:** 辅助技术偏好对话框。\n\n2. **勾选 Enable Assistive Technologies 复选框。**\n\
  3. **点击 Close and Log Out 按钮。**\n\n当你重新登录系统时，`GNOME` 会启用辅助技术功能。在启用辅助技术功能后，你可以配置所需的功能。主要有三个大类：\n\
  \n- **首选应用程序（Preferred Applications）：** 允许你定义启动时自动运行的辅助程序，如屏幕阅读器。\n- **键盘辅助（Keyboard\
  \ Accessibility）：** 定义键盘功能，例如模拟多次按键的 `sticky keys`（粘滞键）和忽略随机按键的 `slow keys`慢键）。\n\
  - **鼠标辅助（Mouse Accessibility）：** 定义鼠标功能，例如模拟双击和鼠标 `dwells`（停留，即将鼠标悬停在某项上而不点击）。\n\
  \n### 第 5 章：检查 KDE 桌面\n\n### 本章简介\n\n在第 4 章中你了解了 `GNOME` 桌面是如何工作的；本章将讨论 Linux 世界中另一个流行的桌面——`KDE`。`KDE`\
  \ 桌面环境使用 Microsoft Windows 系统中常见的功能为你的 Linux 发行版提供图形界面。它作为软件包存在于 `Fedora` 和 `Ubuntu`\
  \ 中，并且 `Kubuntu` 的主要桌面（Kubuntu 是一个基于 `Ubuntu` 但专注于 `KDE` 桌面的 Linux 发行版）。本章将介绍 `KDE`\
  \ 桌面功能，向你展示如何操作 `KDE` 桌面并充分利用工作区。\n\n如果你在 `Fedora` 中同时安装了 `KDE` 和 `GNOME` 桌面（参见第\
  \ 3 章），你可以在登录时切换两者切换。点击底部面板中 `GNOME` 或 `KDE` 文字旁边的箭头按钮。显示的文字就是你登录的桌面。\n\n### KDE\
  \ 桌面基础\n\n`KDE` 桌面首次于 1996 年作为 `Kool Desktop Environment` 发布，但现在它试图变得更复杂一些，并更倾向于被称为\
  \ `K Desktop Environment`（但它仍然很酷）。它在 Linux 初学者中迅速流行起来，因为它为你的 Linux 桌面提供了类似 Windows\
  \ 的界面。图 5-1 显示了 `Fedora` 中使用的 `KDE` 桌面。\n\n![Image 32](img/index-101_1.jpg)\n\n\
  **图 5-1:** Fedora 11 KDE 桌面。\n\n要了解更多关于 `KDE` 的信息，请访问 `www.kde.org` 的 KDE 网站。与 Linux\
  \ 中的其他所有东西一样，`KDE` 桌面布局高度可定制，因此你系统上的显示可能与本章图中所示不同。不要慌，所有这些功能都在，我们将向你展示如何根据需要自定义你的桌面！\n\
  \n与 `GNOME` 桌面类似，`KDE` 桌面包含你应该熟悉的三个主要组件：\n\n- `KDE` 菜单\n- `panel`（面板）\n- `desktop`（桌面）\n\
  \n在接下来的章节中，我们将带你介绍这些组件中的每一个并展示它们的样子。\n\n![Image 33](img/index-102_1.jpg)\n\n## 菜单，请！\n\
  \n你通过 `panel` 最左侧的单个图标访问 `KDE` 菜单（称为 `KickOff`）。点击图标会产生整个 `KickOff` 布局，如图 5-2 所示。\n\
  \n**图 5-2:** KDE KickOff 菜单布局。\n\n菜单底部的五个选项卡包含一组菜单项：\n\n- **Favorites（收藏）：** 用于快速访问你频繁使用的应用程序的图标。\n\
  - **Applications（应用程序）：** 用于启动系统上程序的图标子菜单。\n- **Computer（计算机）：** 通往计算机特殊位置的快捷方式。\n\
  - **Recently Used（最近使用）：** 最近运行的应用程序和最近打开的文档列表。\n- **Leave（退出）：** 退出当前桌面会话的选项。\n\
  \n右侧带有箭头的菜单项提供子菜单，你可以通过点击该菜单选项来打开它。通常子菜单内部还有自己的子菜单，提供更多程序。\n\n有了所有这些不同的菜单选项，寻找你想要的内容可能会很麻烦。为了提供帮助，`KDE`\
  \ 菜单顶部提供了一个快速搜索工具（参考图 5-2）。输入文本，`KDE` 会返回搜索结果；然后你就可以选择你想要的。如果你的工作站连接到互联网，`KDE` 还提供了一个链接来快速启动\
  \ `Konqueror` 浏览器并在网上搜索该术语。\n\n### Favorites\n\n`Fedora KDE` 桌面在 `Favorites` 选项卡上为你提供了三个项目：\n\
  \n- **Web Browser（浏览器）：** `KDE Konqueror` 桌面浏览器和文件管理器（参见第 7 章）。\n- **System Settings（系统设置）：**\
  \ `KDE` 桌面的配置工具。\n- **File Manager（文件管理器）：** `Dolphin` 文件管理器程序（参见第 7 章）。\n\n`Favorites`\
  \ 选项卡还提供了一个区域，可以在可以在收集频繁使用的应用程序图标。在菜单中导航到一个程序，右键点击它，然后选择 Add to Favorites（添加到收藏）选项。\n\
  \n\n\n\n你可以通过右键点击条目并选择“从收藏中移除”来删除收藏夹中的条目。\n\n# 应用程序\n\n应用程序菜单页提供了访问系统上所有安装程序的快捷方式。显然，这里提供的选项取决于你安装了什么，但\
  \ KDE 使用了一些你可能会在系统中遇到的标准一级菜单项。这些项在表 5-1 中描述。\n\n### 表 5-1：应用程序菜单\n\n| 菜单选项 | 包含内容\
  \ |\n| :--- | :--- |\n| 管理 | 用于修改系统设置和功能的应用程序及工具。 |\n| 开发 | 用于开发程序的应用程序。 |\n| 教育\
  \ | 教育类应用程序。 |\n| 游戏 | 磨时间的程序。 |\n| 图形 | 图像处理程序。 |\n| 互联网 | 用于互联网交互的程序。 |\n| 多媒体\
  \ | 处理音频和视频文件的应用程序。 |\n| 办公 | 用于办公任务的程序，例如用于文字处理的 Word、用于数字计算的表格以及用于图形的演示。 |\n|\
  \ 设置 | 配置特定用户设置的工具。 |\n| 系统 | 用于监控和设置系统级功能的工具。 |\n| 工具 | 用于桌面和系统各种小功能的程序和工具。 |\n\
  | 帮助 | KDE 帮助中心文档。 |\n| 个人文件 | 访问你的主目录（见第 7 章）。 |\n\n你可能会注意到一级菜单项中存在某些重复工作。并不是所有的\
  \ KDE 系统都使用所有这些菜单选项。不同的发行版提供不同的菜单项组合，为它们的菜单提供自定义的视觉效果和体验。\n\n# 计算机\n\n计算机菜单页（描述见表\
  \ 5-2）提供了一种跳转到系统特定位置查看文件的快捷方式，并可以快速访问 KDE 设置。\n\n### 表 5-2：计算机菜单\n\n| 菜单选项 | 包含内容\
  \ |\n| :--- | :--- |\n| 系统设置 | 允许你访问 KDE 桌面设置实用程序。 |\n| 系统信息 | 提供快速访问有关工作站的信息——硬盘大小和使用情况、操作系统版本以及指向重要文件夹的链接。\
  \ |\n| 主目录 | 查看用户主目录的内容。 |\n| 网络 | 查看本地网络上可用的文件服务器。 |\n| 根目录 | 查看虚拟目录结构的内容。 |\n\
  | 回收桶 | 查看存储在特殊回收桶文件夹中的项目并清空回收桶。 |\n| PC 软驱器 | 查看插入工作站软驱器中的软盘内容。 |\n\n计算机菜单项还会扩展到包含你插入工作站的任何可移动介质，例如\
  \ CD、DVD 或 USB 内存。只需选择该菜单项即可访问可移动介质上的文件和文件夹。\n\n### 最近使用\n当你使用应用程序时，KDE 会将其添加到菜单的此部分。你越频繁使用某个程序，它在列表中的排名就越高。\n\
  \n### 退出\n\n离开爱可能有 50 种方法，但离开桌面只有六种方法（至少在不崩溃系统的情况下！）。退出页提供了六种选项，如 5-3 所示，用于退出桌面会话。\n\
  \n### 表 5-3：退出菜单\n\n| 菜单选项 | 功能 |\n| :--- | :--- |\n| 注销 | 结束当前桌面会话并返回登录界面。 |\n\
  | 锁定 | 锁定桌面并显示屏保。重新进入桌面，必须输入登录用户的密码。 |\n| 切换用户 | 挂起当前用户的会话，允许另一个用户登录。 |\n| 挂起到磁盘\
  \ | 将当前会话状态写入磁盘文件并将系统置于低功率模式。 |\n| 关 | 结束当前桌面会话，停止系统上的所有进程并关闭系统。 |\n| 重启 | 结束当前桌面会话并重启系统。\
  \ |\n\n当你从退出菜单中选择一个选项时，会出现一个对话框提示你确认。这有助于防止“失误”时刻。\n\n#### 面板\n\n在 KDE 桌面的底部，你会看到一行带有许多图标。这被称为\
  \ `panel`（面板）。面板包含 `widgets`，即在面板上运行的小程序，直接在面板上提供功能。\n\nKDE 面板的布局是 KDE 的另一个特性，在不同的\
  \ Linux 发行版中通常不同。大多数发行版将 KDE KickOff 菜单放在面板的最左侧——这恰好是微软 Windows 启动图标的地方（我们告诉过你 KDE\
  \ 对前 Windows 用户是非常友好的！）\n\n![Image 34](img/index-106_1.jpg)\n\n在 Fedora KDE 桌面上（参考图\
  \ 5-1），在 KDE KickOff 菜单图标旁边，你可以在面板上看到以下小部件：\n\n*   **新设备监控：** 当 USB 设备插入你的工作站时提醒你，并提供已安装设备列表。这是一个带有\
  \ USB 符号的框图标。 |\n*   **分页器：** 允许你在不同的虚拟桌面工作区之间切换。这是四个框聚集在一起的组合。 |\n*   **任务管理器：**\
  \ 显示运行中的应用程序的缩略图。如果没有应用程序在运行，它只会显示为面板上的一个空白区域。 |\n*   **系统托：** 包含工具和系统应用程序的图标，如声音系统、网络管理器和剪贴板，它们以后后台模式运行。系统托显示为面板上的一个黑色区域，里面有图标。\
  \ |\n*   **数字时：** 显示当前时间。 |\n*   **面板编辑器：** 允许你修改面板布局和小部件。这是面板最右侧的半圆形图标。 |\n\n你可以轻松修改面板布局以适应你的喜好。只需点击面板右侧的面板编辑器图标将面板进入编辑模式，如图\
  \ 5-3 所示。\n\n**图 5-3：** 编辑模式下的 KDE 面板。\n\n面板编辑器包含了用于操作面板的图标。表 5-4 显示了这些图标的作用。\n\n\
  ### 表 5-4：面板编辑器\n\n| 特性 | 功能 |\n| :--- | :--- |\n| 屏幕边缘按钮 | 选择面板出现在桌面的哪一侧。 |\n|\
  \ 高度按钮 | 选择面板的高度。 |\n| 添加小部件按钮 | 向面板添加新的小部件。 |\n| 锁定小部件按钮 | 防止小部件被意外移动或删除。 |\n|\
