  \ |\n| `缩放` | 更改文档在屏幕上的显示大小。 |\n| `帮助` | 打开 OpenOffice.org 帮助对话框。 |\n\n## 格式工具栏\n\
  在默认的 OpenOffice.org 设置中，格式工具栏位于标准工具栏下方——尽管并非所有发行版如此。你可以通过选择`视图➪工具栏➪格式`来随时移除格式栏。\n\
  \n此工具栏允许你点击按钮并展开下拉列表，这些列表代表标准的文字处理功能，如样式、字体、字体大小和格式指令。此栏上的大多数功能与你在大多数现代文字处理器中看到的相同。段落背景格式按钮是唯一一个特别反常的。它允许你更改段落的背景颜色，这可以产生一些有趣的结果。\n\
  \n此工具栏实际上会根据你正在的操作而变化。例如，如果光标在表格内，格式栏将包含处理表格的有用按钮。\n\n在默认的 OpenOffice.org 设置中，格式工具栏的正下方是标尺。所有现代文字处理器都提供此项目，它以（例如）在你选择的测量系统中标记文档的页边距和制表符。要更改你正在使用的测量单位，右键点击标尺以打开`测量`对话框。\n\
  \n噢，对了——那个占据窗口大部分区域的大块白色空白区域是文档区域。那才是你实际处理文档的地方！只需点击那里并开始打字即可。你也可以通过在文档区域点击右键来访问格式快捷菜单。\n\
  \n## 处理 Writer 文件\nOpenOffice.org Writer 可以处理许多不同的文件类型。这允许你创建可以使用许多不同类型文字处理系统的文档。\n\
  \n你不仅可以用各种格式保存新文档，还可以读取在其他文字处理程序上创建的文档。以下是你可以配合 OpenOffice.org 使用的不同文档类型列表：\n\n\
  - **OpenDocument (ODT) 格式：** 一个提议的开放标准，有一天可能会被所有文字处理程序支持。\n- **OpenOffice.org 1.0\
  \ (SXW) 格式：** 原始 OpenOffice 文档格式。\n- **Microsoft Word 97/2000/XP (DOC) 格式：** 是的，你可以用\
  \ Writer 读写 Word 文档。\n\n当前的 OpenOffice.org 版本无法打开 Word 2007 (`docx`) 文档。但是如果你有 Word\
  \ 2007 的副本，可以将这些文档转换为 `.doc` 格式，然后在 OpenOffice.org 中读取。与任何文档转换一样，请注意不要转换过程中丢失文档中的任何重要功能。\n\
  \n- **Microsoft Word 95 (DOC) 格式：** 甚至是较旧的 Word 格式。\n- **Microsoft Word 6.0 (DOC)\
  \ 格式：** 甚至是非常古老的 Word 格式。\n- **富文本 (RTF) 格式：** 保存基本字体和文档信息的标准格式。\n- **StarWriter\
  \ 3.0 – 5.0 (SDW) 格式：** Sun 的 StarOffice 文字处理器（OpenOffice.org 的近亲）。\n- **Microsoft\
  \ Word 2003 (XML) 格式：** 微软尝试使用 XML 标准标记语言创建一种标准的文字处理文档格式。\n\n尽管在`另存为`对话框中并不可用，但\
  \ OpenOffice.org Writer 工具栏允许将任何文档格式导出为 PDF 文档格式。单此项功能就能让你避免购买昂贵的商业产品（来自某家不具名的商业软件公司）。\n\
