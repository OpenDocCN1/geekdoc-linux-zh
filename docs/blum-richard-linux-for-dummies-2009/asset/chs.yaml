  \ 设置面板左侧的位置。 |\n| 右侧顶部指针 | 设置面板右侧的最大位置。 |\n| 右侧底部指针 | 设置面板右侧的最小位置。 |\n\n在编辑模式下，你还可以通过拖拽和放置来在面板上移动现有的小部件，或者通过右键点击小部件图标并选择删除选项来移除现有的小部件。**。通过使用所有这些功能，你可以自定义面板在桌面上的外观。\n\
  \n#### 桌面\n\n桌面可能是 KDE 最新版本（第 4 版）中最具争议的特性。它的行为与旧版本的 KDE——以及 GNOME 桌面相比有显著区别。KDE\
  \ 的桌面工作起来更像是面板的扩展，而不是桌面。\n\n你不能在 KDE 桌面上放置文件、文件夹或应用程序图标。\n\n相反，你只需要放置额外的的小部件。\n\n\
  尽管如此，你可以使用一种技巧让 KDE 桌面的行为类似于 GNOME 桌面。你可以使用的小部件之一是 `Folder View`（文件夹视图）小部件，它在你的\
  \ KDE 面上提供了一个类似 GNOME 桌面的区域。\n\n\n\n\n默认的 Fedora KDE 桌面使用 `Folder View`（文件夹视图）部件（参考图\
  \ 5-1），如果你在 Ubuntu 中安装 KDE 桌面，它将无法工作；默认情况下，Ubuntu 不包含 `Folder View` 小部件（但你可以按照第\
  \ 16 节所述，使用软件包管理器来添加它）。\n\n`Folder View` 区域允许你在定义的 `Folder View` 区域内向桌面上放置文件、文件夹和应用程序图标。实际上，你可以为系统上的任何文件夹创建一个文件夹视图区域，但最常见的做法是为你家目录下的\
  \ `Desktop` 文件夹创建一个（见第 7 章）。这是 Fedora KDE 桌面提供的默认 `Folder View`。因此，放置在 `Desktop`\
  \ 文件夹视图中的项目将显示在主目录区域的 `Desktop` 文件夹中，就像 GNOME 桌面一样。\n\n除了 `Folder View` 之外，默认的 Fedora\
  \ 桌面只包含另一个图标（位于桌面的右上角）：启动 `desktop editor`（桌面编辑器）的图标，这是你向桌面添加更多小部件的程序，就像你在面板上操作一样。\n\
  \nKDE 桌面和面板都使用相同的小部件，因此接下来我们将仔细查看这些小部件。\n\n## 使用小部件\n\nKDE 桌面环境的关键是 `widgets`（小部件）——这些是你可以直接从桌面使用的方便小工具或其他小型程序。本节将介绍如何在你的\
  \ KDE 环境中添加、删除和获取新的小部件。\n\n### 添加小部件\n\nKDE 软件包提供了许多不同的小部件，供你在面板和桌面中使用。从面板选择 `Add\
  \ Widgets`（添加小部件）选项或通过 `Desktop Editor`，会列出当前工作站上已安装的小部件列表。图 5-4 显示了其外观。\n\n已安装在桌面或面板上的小部件旁边有一个标记。添加新小部件只需选择所需的小部件并点击\
  \ `Add Widget` 按钮。表 5-5 列出了 Fedora 中默认可用的小部件。\n\n![Image 35](img/index-109_1.jpg)\n\
