- "# Kubernetes 之书：容器编排完整指南\n\n\n\n![](img/9781718502659.jpg)\n\n![](img/9781718502659.jpg)\n\
  \n\n\n\n![image](img/pub.jpg)\n\n\n\n\n\n26 25 24 23 22           1 2 3 4 5\n\n\n\
  \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n献给我的妻子 Sheryl\n\n## 关于作者\n\nAlan Hohn 是洛克希德·马丁（Lockheed\
  \ Martin）的软件策略总监。拥有洛克希德·马丁院士、软件开发人员、架构师、主管和经理的 25 年经验。他曾在 Ada、Java、Python 和 Go 等语言上交付过生产应用程序，并从\
  \ 20 世纪 90 年代初就开始使用 Linux。是一位敏捷和 DevSecOps 教练，也是 Java、Ansible、容器、软件架构和 Kubernetes\
  \ 的丰富培训师。Alan 拥有埃布里里德尔航空大学的计算机科学学位、明尼苏达大学的工商管理硕士学位以及佐治亚理工学院的工业工程硕士学位。\n\n## 关于技术审查员\n\
  \nXander Soldaat 于 1994 年开启了他的 Linux 之旅，当时他有一个装满软盘的运动包、一台 486DX2/66 和一个空闲的周末。他在\
  \ IT 基础设施架构、嵌入式系统、编译器和 STEM 课程开发方面拥有深厚背景。目前是 Red Hat 的 OpenShift 云成功架构师。在空闲时间，他喜欢摆弄机器人、电子设备、复古电脑和桌面游戏。\n\
  \n\n\n\n\n\n从许多小碎片构建应用程序是`very difficult`的。围绕微服务组织团队使他们能够独立工作可能是件好事，但当需要将这些碎片组合成一个可以运行的应用程序时，碎片的数量意味着要担心如何打包它们、如何将它们交付到运行时环境、如何配置它们、如何为它们提供（潜在冲突的）依赖项、如何更新它们以及如何监控它们以确保它们正常工作。\n\
  \n当我们考虑到需要运行每个微服务的多个实例时，这个问题只会变得更糟。现在，我们需要一个微服务能够找到另一个微服务的可用实例，并在所有可用实例之间平衡负载。我们需要在发生硬件或软件故障时，这种负载均衡能够立即进行自愈/重新配置。我们需要无缝的故障转移并重试失败的任务，以便将故障隐藏在终端用户面前。我们不仅需要监控每个单独的服务，还需要监控所有服务如何协同工作完成任务。毕竟，如果\
  \ 1% 的故障导致用户无法使用我们的应用程序，那么即使我们 99% 的微服务运行正常，他们也并不在乎此。\n\n如果我们想由许多个单独的微服务构建应用程序，我们会有很多问题要解决，而且我们不希望每个微服务团队都处理这些问题，否则他们永远没有时间写代码了！我们需要一种通用方法来管理微服务的打包、部署、配置和维护。让我们来看两类所需的属性：适用于单个微服务的，以及适用于多个微服务协同工作的。\n\
  \n### 容器的要求\n\n对于单个微服务，我们需要：\n\n- **打包 (Packaging)**：对应用程序进行打包交付，这需要包含依赖项，以便包具有可移植性并避免微服务之间的冲突。\n\
  - **版本控制 (Versioning)**：唯一标识一个版本。我们需要随着时间的推移更新微服务，并且知道运行的是哪个版本。\n- **隔离 (Isolation)**：防止微服务相互干扰。这允许我们在部署哪些微服务组合时保持灵活。\n\
  - **快速启动 (Fast startup)**：快速启动新实例。我们需要此来扩展和响应故障。\n- **低开销 (Low overhead)**：最小化运行微服务所需的资源，以避免对微服务大小的限制。\n\
  \n`Containers`的设计是为了解决这些需求。容器提供了隔离以及低开销和快速启动。而且，正如我们在第 5 章](#ch05.xhtml_ch05）所示，容器从容器镜像运行，镜像提供了一种将应用程序及其依赖项打包并唯一标识该包版本的方法。\n\
  \n### 编排的要求对于对于协同多个微服务，我们需要：\n\n- **集群 (Clustering)**：跨多个服务器为容器提供处理、内存和存储。\n- **发现\
  \ (Discovery)**：提供一种方法让一个微服务找到另一个。我们的微服务可能运行在集群的任何位置，可能会移动。\n- **配置 (Configuration)**：将配置与运行时分离，允许我们在不重新构建和部署微服务的情况下重新配置应用程序。\n\
  - **访问控制 (Access control)**：管理创建容器的授权。这确保运行正确的容器，而不是运行错误的容器。\n- **负载均衡 (Load balancing)**：在工作实例之间分散请求，以避免终端用户或其他微服务去跟踪所有微服务实例并自行平衡负载。\n\
  - **监控 (Monitoring)**：识别故障的微服务实例。如果流量流向故障实例，负载均衡的效果将不理想。\n\n\n\n\n\n# **韧性** 从故障中自动恢复。如果我们没有这种能力，链式故障可能会杀死我们的应用程序。\n\
  \n这些需求仅在我们在多个服务器上运行容器时才会起作用。这与仅仅打包并运行单个容器是不同的问题。为了满足这些需求，我们需要一个*容器编排*环境。如 `Kubernetes`\
  \ 这样的容器编排环境允许我们将多个服务器视为一组单一资源来运行容器，动态地将容器分配到可用服务器，并提供分布式通信和存储。\n\n### 运行容器\n\n到此时，希望你已经对使用容器化微服务和\
  \ `Kubernetes` 构建应用程序的可能性感到兴奋了。让我们过一下基础知识，以便你能够看到这些理念在实践中是什么样的，并为书中后续深入探讨容器技术奠定基础。\n\
  \n### 容器是什么样子的\n\n在第 2 章中，我们将查看容器平台与容器运行时之间的区别，并使用多个容器运行时来运行容器。现在，让我们从在最流行的容器平台\
  \ `Docker` 中运行的简单示例开始。我们的目标是学习基础 `Docker` 命令，这些命令与通用的容器概念对应。\n\n### 运行容器\n\n第一个命令是\
  \ `run`，它会创建一个容器并在其中运行命令。我们将告诉 `Docker` 要使用的容器镜像名称。我们将在第 5 章中详细讨论容器镜像；现在，只需知道它提供了一个唯一的名称和版本，以便\
  \ `Docker` 确切知道要运行什么即可。让我们从本章的示例开始。\n\n**注意**\n\n本书的示例仓库位于 [`github.com/book-of-kubernetes/examples`](https://github.com/book-of-kubernetes/examples)。请参阅第\
  \ xx 页上的“运行示例”获取设置的详情。\n\n本节的一个核心思想是，容器看起来像是一个完全独立的系统。为了说明这一点，在我们运行容器之前，让我们来看宿主机系统：\n\
  \n```\nroot@host01:~# cat /etc/os-release\n\nNAME=\"Ubuntu\"\n\n...\n\nroot@host01:~#\
  \ ps -ef\n\nUID          PID    PPID  C STIME TTY          TIME CMD\n\nroot    \
  \       1       0  0 12:59 ?        00:00:07 /sbin/init\n\n...\n\nroot@host01:~#\
  \ uname -v\n\n#...-Ubuntu SMP ...\n\nroot@host01:~# ip addr\n\n1: lo: <LOOPBACK,UP,LOWER_UP>\
  \ mtu 65536 ...\n\n    link/loopback 00:00:00:00:00:00 brd 00:00:00:00:00:00\n\n\
  \    inet 127.0.0.1/8 scope host lo\n       valid_lft forever preferred_lft forever\n\
  \    inet6 ::1/128 scope host \n       valid_lft forever preferred_lft forever\n\
  ...\n\n3: enp0s8: <BROADCAST,MULTICAST,UP,LOWER_UP> mtu 1500 qdisc fq_codel ...\n\
  \n    link/ether 08:00:27:bf:63:1f brd ff:ff:ff:ff:ff:ff\n    inet 192.168.61.11/24\
  \ brd 192.168.61.255 scope global enp0s8\n       valid_lft forever preferred_lft\
  \ forever\n    inet6 fe80::a00:27ff:febf:631f/64 scope link \n       valid_lft forever\
  \ preferred_lft forever\n...\n```\n\n第一个命令查看了一个名为 `/etc/os-release` 的文件，它包含关于已安装\
  \ Linux 发行版的信息。在这种情况下，我们的示例虚拟机运行的是 Ubuntu。这与下一个命令的输出相，我们在该中看到了基于 Ubuntu 的 Linux\
  \ 内核。最后，我们列出了网络接口并看到了 IP 地址 `192.168.61.11`。\n\n示例设置步骤自动安装了 `Docker`，所以我们已经准备就绪。首先，让我们用一条命令下载并启动\
  \ Rocky Linux 容器：\n\n```\nroot@host01:~# docker run -ti rockylinux:8\n\nUnable to\
  \ find image 'rockylinux:8' locally\n\n8: Pulling from library/rockylinux\n\n...\n\
  \nStatus: Downloaded newer image for rockylinux:8\n```\n\n我们在 `docker run` 命令中使用\
  \ `-ti` 是为了告诉 `Docker` 我们需要一个交互式终端来运行命令。`docker run` 的另一个参数是容器镜像 `rockylinux:8`，它指定了名称\
  \ `rockylinux` 和版本 `8`。由于我们没有提供要运行的命令，因此使用了该容器镜像的默认 `bash` 命令。\n\n现在我们在容器内部有了一个\
  \ shell 提示符，可以运行几个命令，然后使用 `exit` 退出 shell 并停止容器：\n\n```\n➊ [root@18f20e2d7e49 /]#\
  \ cat /etc/os-release\n\n➋ NAME=\"Rocky Linux\"\n\n  ...\n\n➌ [root@18f20e2d7e49\
  \ /]# yum install -y procps\n\n  ...\n\n  root@18f20e2d7e49 /]# exit\n```\n\n###\
  \ 镜像与卷\n\n乍一看，容器像是进程和虚拟机的混合。我们与 `Docker` 交互的方式加深了这种印象。让我们通过运行 Alpine Linux 容器来说明这一点。我们首先“拉取”容器镜像，这感觉就像下载虚拟机镜像：\n\
  \n```\nroot@host01:~# docker pull alpine:3\n\n3: Pulling from library/alpine\n\n\
  ...\n\ndocker.io/library/alpine:3\n```\n\n接下来，我们将从镜像运行容器。我们将使用*卷挂载*来查看宿主机的文件，这是虚拟机的一项常见任务。然而，我们还会告诉\
  \ `Docker` 指定一个环境变量，这是我们在运行普通进程时会做的事情：\n\n```\nroot@host01:~# docker run -ti -v\
  \ /:/host -e hello=world alpine:3\n\n/ # hostname\n\n75b51510ab61\n```\n\n我们在容器内打印\
  \ `/etc/os-release` 的内容，就像之前的 Rocky Linux 一样：\n\n```\n/ # cat /etc/os-release \n\
  \nNAME=\"Alpine Linux\"\n\nID=alpine\n\n...\n```\n\n但这次我们可以打印宿机的 `/etc/os-release`\
  \ 文件，因为宿主机文件系统被挂载到了 `/host`：\n\n```\n/ # cat /host/etc/os-release \n\nNAME=\"Ubuntu\"\
  \n\n...\n```\n\n最后，在容器内部我们还可以访问我们传入的环境变量：\n\n```\n/ # echo $hello\n\nworld\n\n/\
  \ # exit\n```\n\n这种混合了虚拟机和普通进程的想法有时会让新的容器用户提出诸如“为什么我不能 SSH 到我的容器中？”这样的问题。接下来几章节的主要目标就是弄清楚容器到底是什么。\n\
  \n\n\n\n尽管容器看起来拥有自己的主机名、文件系统、进程空间和网络功能，但容器并不是虚拟机。它没有独立的内核，因此不能拥有独立的内核模块或设备驱动程序。容器可以包含多个进程，但这些进程必须由第一个进程（`PID\
  \ 1`）显式启动。因此，容器默认不会包含 SSH 服务器，大多数容器也没有运行任何系统服务。\n\n在接下来的几章节中，我们将查看容器是如何作为一组进程的同时却看起来像一个独立的系统的。现在，让我们再尝试另一个\
  \ Docker 示例，看看从宿主机系统来看容器是什么样的。\n\n首先，我们将用单条命令下载并运行 NGINX：\n\n```\nroot@host01:~#\
  \ docker run -d -p 8080:80 nginx\n\nUnable to find image 'nginx:latest' locally\n\
  \nlatest: Pulling from library/nginx\n\n...\n\nStatus: Downloaded newer image for\
  \ nginx:latest\n\ne9c5e87020372a23ce31ad10bd87011ed29882f65f97f3af8d32438a8340f936\n\
  ```\n\n这个示例说明了几个额外的实用 Docker 命令。再次，我们正在混合虚拟机和普通进程的想法。通过使用 `-d` 标志，我们告诉 Docker 在\
  \ `daemon mode`（守护模式，即后台）运行此容器，这是我们在处理普通进程时会的操作。然而，使用 `-p 8080:80` 引入了虚拟机的另一个概念，因为它指示\
  \ Docker 将宿主机上的 `8080` 端口转发到容器内的 `80` 端口，这使得即使容器有自己的网络接口，我们也能从宿主机连接到 NGINX。\n\n\
  NGINX 现在正在 Docker 容器的后台运行。若要查看它，请运行以下命令：\n\n```\nroot@host01:~# docker ps\n\nCONTAINER\
  \ ID IMAGE ... PORTS                  NAMES\n\ne9c5e8702037 nginx ... 0.0.0.0:8080->80/tcp\
  \   funny_montalcini\n```\n\n由于由于端口转发，我们可以使用 `curl` 从宿主机系统连接到它：\n\n```\nroot@host01:~#\
  \ curl http://localhost:8080/\n\n<!DOCTYPE html>\n\n<html\n\n<head>\n\n<title>Welcome\
  \ to nginx!</title>\n\n...\n```\n\n通过这个示例，我们开始看到容器化是如何满足我们在本章早期确的一些需求的。由于 NGINX\
  \ 被封装在容器镜像中，我们可以用单条命令下载并运行它，而无需担心它与宿主机上可能安装的任何其他产生冲突。\n\n让我们运行另一条命令来探索我们的 NGINX\
  \ 服务器：\n\n```\nroot@host01:~# ps -ef | grep nginx | grep -v grep\n\nroot     35729\
  \ 35703 0 14:17 ? 00:00:00 nginx: master ...\n\nsystemd+ 35796 35729 0 14:17 ? 00:00:00\
  \ nginx: worker ...\n```\n\n如果 NGINX 运行在虚拟机中，我们将在宿主机系统的 `ps` 列表中看不到它。显然，容器中的 NGINX\
  \ 是作为普通进程运行的。同时，我们不需要在宿主机系统上安装 NGINX 即可让它工作。换句话说，我们正在获得虚拟机方法的处处，而没有虚拟机的额外开销。\n\n\
  ### 将容器部署到 Kubernetes\n\n为了让我们的容器化应用程序具有负载均衡和弹性能力，我们需要一个像 Kubernetes 这样的容器编排框架。我们的示例系统自动安装了\
  \ Kubernetes 集群，并为其部署了一个 Web 应用程序和数据库。作为在 第二部分 深入研究 Kubernetes 的准备，让我们来看看该应用程序。\n\
  \n安装和配置 Kubernetes 集群有许多不同的选项，许多公司都提供了相应的发行版。我们在 第 6 章 中讨论了 Kubernetes 发行版的多种选项。在本章中，我们将使用来自\
  \ Rancher 公司的名为“K3s”的轻量级发行版。\n\n使用像 Kubernetes 这样的容器编排环境，我们需要放弃对容器的部分控制。我们不再直接执行命令来运行容器，而是告诉\
  \ Kubernetes 我们想要它运行哪些容器，由它来决定在哪里运行每个容器。然后 Kubernetes 将为我们监控容器，并处理自动重启、故障转移、更新到新版本，甚至根据负载自动伸缩。这种配置风格被称为\
  \ `declarative`（声明式）。\n\n#### 与 Kubernetes 集群通信\n\nKubernetes 集群有一个 API 服务器，我们可以用它获取状态并更改集群配置。我们使用\
  \ `kubectl` 客户端应用程序与 API 服务器进行交互。K3s 自带了嵌入的 `kubectl` 命令，我们将使用它。首先获取有关 Kubernetes\
  \ 集群的一些基本信息：\n\n```\nroot@host01:~# k3s kubectl version\n\nClient Version: version.Info{Major:\"\
  1\", ...\n\nServer Version: version.Info{Major:\"1\", ...\n\nroot@host01:~# k3s\
  \ kubectl get nodes\n\nNAME     STATUS   ROLES             AGE   VERSION\n\nhost01\
  \   Ready    control-plane...  2d    v1...\n```\n\n你可以看到，我们正在工作于单节点 Kubernetes 集群。\n\
  \n\n\n\n```\nroot@host01:~# k3s kubectl delete pod todo-655ff549f8-qq8ff\n\npod\
  \ \"todo-655ff549f8-qq8ff\" deleted\n\nroot@host01:~# k3s kubectl get pods\n\nNAME\
  \                       READY   STATUS    RESTARTS   AGE\ntodo-db-7df8b44d65-744mt\
  \   1/1     Running   0          2d\ntodo-655ff549f8-l4dxt      1/1     Running\
  \   0          2d\ntodo-655ff549f8-gc7b6      1/1     Running   1          2d\n\
  todo-655ff549f8-rm8sh      1/1     Running   0          11s\n```\n\n要运行此命令，你需要复制并粘贴你那三个\
  \ ` Pods` 之一的完整名称。该名称会和我的略有不同。当你删除一个 `Pod` 时，你会发现 Kubernetes 立即创建了一个新的。（你可以通过 `AGE`\
  \ 字段识别哪一个是全新的。）\n\n接下来，让我们看看 Kubernetes 如何自动伸缩我们的应用程序。稍后，我们将学习如何让 Kubernetes 自动执行此，但现在我们将手动进行。假设我们决定需要五个\
  \ ` Pods` 而不是三个。我们可以通过一条命令来实现：\n\n```\nroot@host01:~# k3s kubectl scale --replicas=5\
  \ deployment todo\n\ndeployment.apps/todo scaled\n\nroot@host01:~# k3s kubectl get\
  \ pods\n\nNAME                       READY   STATUS    RESTARTS   AGE\ntodo-db-7df8b44d65-744mt\
  \   1/1     Running   0          2d\ntodo-655ff549ff8-l4dxt      1/1     Running\
  \   0          2d\ntodo-655ff549ff8-gc7b6      1/1     Running   1          2d\n\
  todo-655ff549ff8-rm8sh      1/1     Running   0          11s\n```\n\n我们告诉 Kubernetes\
  \ 扩展管理我们 `Pods` 的 `Deployment`。现在，你可以将 `Deployment` 视为 `Pods` 的“所有者”；它监控它们并控制它们的数量。在这里，额外的\
  \ `Pods` 被立即创建了。我们刚刚扩展了应用程序。\n\n在结束之前，让我们来看一个至关重要的 Kubernetes 特性。当你从浏览器中加载应用程序时，Kubernetes\
  \ 会将你的浏览器请求发送到可用的 `Pods` 之一。每当你刷新时，请求都可能路由到不同的 `Pod`，因为 Kubernetes 正在自动进行负载均衡。为了实现这一点，当我们把应用程序部署到\
  \ Kubernetes 时，配置包含一个 `Service`：\n\n```\nroot@host01:~# k3s kubectl describe service\
  \ todo\n\nName:       todo\nIPs:        unset\nPort:       80/TCP\nTargetPort: 5000/TCP\n\
  ```\n\n`Service` 有它自己的 IP 地址，并将流量路由到一个或多个端点。在这种情况下，由于我们已经扩展到了五个 `Pods`，`Service`\
  \ 正在所有端点之间平衡流量。\n\n### 总结结语\n\n现代应用程序通过基于微服务的架构实现了可扩展性和可靠性，这种架构可以独立且动态地部署到可用硬件（包括云资源）。通过使用容器和容器编排来运行我们的微服务，我们实现了一种打包、扩展和监控的通用方法，使我们的开发团队能够专注于构建应用程序的艰性工作。\n\
  \n在本章中，我们看到了容器化如何创建出独立系统的假象，而它实际上是以一种隔离方式运行的普通进程。我们还看到了如何使用 Kubernetes 将整个应用程序部署为一组容器，并具备可扩展性和自愈能力。当然，Kubernetes\
  \ 拥有的重要功能比我们在这里提到的多得多，多到我们需要用一整本书才能涵盖所有！通过这个简短的概述，我希望你能够更深入地研究容器和 Kubernetes，以理解如何构建高性能且可靠的应用程序。我们将在第二部分回到\
  \ Kubernetes。现在，让我们仔细观察容器如何创建独立系统的幻象。我们将从查看使用 Linux 命名空间（namespaces）来实现进程隔离开始。\n\
  \n## 2 进程隔离\n\n![image](img/common01.jpg)\n\n容器建立在丰富的技术历史之上，这些技术旨在将一个计算机程序与其他程序隔离开，同时允许许多程序共享相同的\
  \ CPU、内存、存储和网络资源。容器利用 Linux 内核的基本能力，特别是命名空间（namespaces），它们为进程标识符、用户、文件系统和网络接口创建了独立的视图。\n\
  \n在本章中，我们将考虑进程隔离的一些原因，并查看 Linux 在历史上是如何隔离进程的。然后，我们将检查容器如何使用命名空间来提供隔离。我们将使用几个不同的运行时（runtimes）对此进行测试。最后，我们将使用\
  \ Linux 命令直接创建命名空间。\n\n### 理解隔离\n\n在运行一些容器并检查它们的隔离情况之前，让我们看看进程隔离的动机。我们还将会考虑 Linux\
  \ 中传统的进程隔离，以及这种机制如何导致了容器所使用的隔离能力。\n\n#### 为什么进程需要隔离\n\n计算机的核心思想是它是一台通用型机器，可以运行许多不同类型的程序。从计算之初，就有在多个程序之间共享单台计算机的需求。这始于人们轮流在打孔卡上提交程序，但随着计算机多任务变得越来越复杂，人们可以启动多个程序，而计算机会让人觉得它们都同时运行在同一个\
  \ CPU 上。\n\n当然，每当有东西需要共享时，就有确保公平共享的需求，程序也不例外。因此，尽管我们将（`process`）视为一个拥有独立 CPU 时间和内存空间的独立程序，但一个进程有很多方法给另一个进程带来麻烦，包括：\n\
  \n*   消耗过多的 CPU、内存、存储或网络\n*   覆盖另一个进程的内存或文件\n*   从另一个进程中提取秘密信息\n*   向另一个进程发送错误数据导致其行为异常\n\
  *   向另一个进程发送大量请求使其停止响应\n\n缺陷（Bugs）可能会意外导致这些事情，但更大的担忧是安全漏洞，它允许攻击者利用一个进程给另一个进程造成问题。系统中只需要一个漏洞就会产生重大问题，因此我们需要能够隔离进程的方法，以限制意外或蓄意行为造成的损害。\n\
  \n物理隔离是最好的——`air-gapped`（物理隔离）系统经常被用于保护政府机密信息和安全关键系统——但这种方法对于许多用例来说也太昂贵且不方便。虚拟机可以在共享物理硬件的同时提供分离的象，但虚拟机具有运行自己的操作系统、服务和虚拟设备的开销，导致启动速度较慢且扩展性较差。解决方案是运行普通进程，但使用进程隔离来减少对其他进程的影响风险。\n\
  \n#### 文件权限与切换根\n\n进程隔离的大部分工作涉及防止进程看到它不应该看到的内容。毕竟，如果一个进程看不到另一个进程，那么无论是意外还是蓄意，制造麻烦都会困难得多。Linux\
  \ 控制程序能看到和执行什么的的传统方法，正是容器理念的基础。\n\n\n\n\n\n最基本的可见性控制之一是 `filesystem permissions`（文件系统权限）。Linux\
  \ 为每个文件和目录关联所有者和组，并管理读、写、执行权限。这种基础权限方案可以很好地确保用户文件保持私密，一个进程无法覆盖另一个进程的文件，并且只有像 `root`\
  \ 这样的特权用户才能安装新软件或修改关键系统配置文件。\n\n当然，这种权限方案依赖于我们确保每个进程都以真实用户的身份运行，并且用户处于适当的组中。通常，每个新服务的安装都会创建一个专门运行该服务的用户。更好的是，这个\
  \ `service user`（服务用户）可以配置为没有真实的登录 shell，这意味着该用户不会被用来利用来登录系统。为了清楚这一点，让我们来看一个例子。\n\
  \n### 注意事项\n\n本书的示例仓库位于 [`github.com/book-of-kubernetes/examples`](https://github.com/book-of-kubernetes/examples)。详细信息请参阅第\
  \ xx 页 的“运行示例”部分。\n\nLinux `rsyslogd` 服务提供日志服务，因此它需要向 `/var/log` 中的文件写入内容，但它不应该具有读写该目录下所有文件的权限。文件权限被用于控制这一点，如下例所示：\n\
  \n```\nroot@host01:~# ps -ef | grep rsyslogd | grep -v grep\n\n➊ syslog  698  1\
  \  0 Mar05 ?   00:00:04 /usr/sbin/rsyslogd -n -iNONE\n\n   root@host01:~# su syslog\n\
  \n➋ 该账户当前不可用。\n\n   root@host01:~# ls -l /var/log/auth.log\n\n➌ -rw-r----- 1 syslog\
  \ adm 18396 Mar  6 01:27 /var/log/auth.log\n\n   root@host01:~# ls -ld /var/log/private\n\
  \n➍ drwx------ 2 root root 4096 Mar  5 21:04 /var/log/private\n```\n\n`syslog` 用户\
  \ ➊ 专门为了运行 `rsyslogd` 而存在，出于安全考虑，该用户被配置为没有登录 shell ➋。因为 `rsyslogd` 需要能够写入 `auth.log`，所以它被赋予了写权限，如文件模式输出\
  \ ➌ 所示。admin (`adm`) 组的成员对该文件只有只读权限。\n\n文件模式 ➍ 中的初始 `d` 表示这是一个目录。接下来的 `rwx` 表示 `root`\
  \ 用户具有读、写、执行权限。剩余的横线表示 `root` 组的成员或其他系统用户没有权限，因此我们可以得出结论：`rsyslogd` 进程无法看到该目录的内容。\n\
  \n权限控制很重要，但它并不能完全满足我们进程隔离的目标。原因之一是，这不足以保护我们免受 `privilege escalation`（权限提升）的影响，即一个脆弱的进程和一个脆弱的系统允许恶意攻击者获得\
  \ root 权限。为了帮助解决这个问题，某些 Linux 服务更进了一步，在文件系统的孤立部分运行。这种方法被称为 `chroot`，意为“更改根目录”。在\
  \ `chroot` 环境中运行需要大量的配置，正如本示例所示：\n\n```\nroot@host01:~# mkdir /tmp/newroot\n\n \
  \  root@host01:~# ➊ cp --parents /bin/bash /bin/ls /tmp/newroot\n\n   root@host01:~#\
  \ cp --parents /lib64/ld-linux-x86-64.so.2 \\\n\n  ➋ $(ldd /bin/bash /bin/ls | grep\
  \ '=>' | awk '{print $3}') /tmp/newroot\n\n   ...\n\n   root@host01:~# ➌ chroot\
  \ /tmp/newroot /bin/bash\n\n   bash-5.0# ls -l /bin\n\n   total 1296\n\n➍ -rwxr-xr-x\
  \ 1 0 0 1183448 Mar  6 02:15 bash\n\n   -rwxr-xr-x 1 0 0  142144 Mar  6 02:15 ls\n\
  \n   bash-5.0# exit\n\n   exit\n```\n\n首先，我们需要拷贝所有我们打算运行的可执行文件 ➊。我们还需要拷贝这些可执行文件使用的所有共享库，我们通过\
  \ `ldd | grep | awk` 命令 ➋ 指定这些库。当二进制文件和库都拷贝完成后，我们可以使用 `chroot` 命令 ➌ 进入我们的孤立环境。只有我们拷贝进去的文件是可见的\
  \ ➍。\n\n#### 容器隔离\n\n对于经验丰富的 Linux 系统管理员来说，文件权限和更改根（change root）是基础知识。然而，这些概念也是容器工作的基础。尽管运行中的容器看起来像是一个完全独立的系统，拥有自己的主机名、网络、进程和文件系统（正如我们在第\
  \ 1 章 中所示），但它实际上是一个使用隔离技术而非虚拟机的普通 Linux 进程。\n\n容器有多种隔离，包括我们之前没过的几种基本隔离：\n\n*   挂载的文件系统\n\
  *   主机名和域名\n*   进程间通信\n*   进程标识\n*   网络设备\n\n这些不同的隔离类型共同工作，使得进程或一组进程看起来像是一个完全独立的系统。\n\
  \n### 容器平台与运行时\n\n在底层，现代版本的 Docker 使用 `containerd` 作为 `container runtime`，也称为“容器引擎”。容器运行时提供了运行进程的低级功能。为了进一步探索隔离，让我们使用预定义的镜像启动容器，然后检查容器如何与系统其他部分隔离。\n\
  \n#### 安装 containerd\n\n我们将在第二部分 使用 `containerd` 来支持我们的 Kubernetes 集群，因此让我们从交互运行时开始。直接与\
  \ `containerd` 交互也有助于我们探索隔离。\n\n你可以使用本书提供的配置脚本跳过安装命令。请参考本章的 README 文件。\n\n尽管 Ubuntu\
  \ 标准软件包库中有 containerd，但我们将从 Docker 官方软件包仓库安装，以获取最新的稳定版本。为了这样做，我们需要 Apt 支持 HTTP/S，让我们先执行这一步：\n\
  \n```\nroot@host01:~# apt update\n\n...\n\nroot@host01:~# apt -y apt-transport-https\n\
  \n...\n```\n\n现在让我们添加软件包仓库并安装：\n\n```\nroot@host01:~# curl -fsSL https://download.docker.com/linux/ubuntu/gpg\
  \ | \\\n  gpg --dearmor -o /usr/share/keyrings/docker-archive-keyring.gpg\n\nroot@host01:~#\
  \ echo \"deb [arch=amd64\" \\\n  \"signed-by=/usr/share/keyrings/docker-archive-keyring.gpg]\"\
  \ \\\n  \"https://download.docker.com/linux/ubuntu focal stable\" > \\\n  /etc/apt/sources.list.d/docker.list\n\
  \nroot@host01:~# apt update && apt install -y containerd.io\n\n...\n\nroot@host01:~#\
  \ ctr images ls\n\nREF TYPE DIGEST SIZE PLATFORMS LABELS\n```\n\n最后一条命令只是确保软件包安装正确、服务正在运行，并且\
  \ `ctr` 命令可以工作。我们没有看到任何镜像，因为我们还没有安装任何镜像。\n\n\n\n\n容器运行时是低级库。它们通常不被直接使用，而是由高级别的容器平台或编排环境（如\
  \ Docker 或 Kubernetes）使用。这意味着它们将大量精力放在了高质量的应用程序编程接口（API）上，而在我们可以从命令行使用的面向用户的工具上投入的较少。幸运的是，测试仍然需要命令行工具，而\
  \ `containerd` 提供了我们将用于实验的 `ctr` 工具。\n\n### 使用 containerd\n\n我们最初的 `containerd`\
  \ 命令显示还没有下载任何镜像。让我们下载一个较小的镜像，用它来运行容器。我们将使用 BusyBox，这是一个非常微小的容器镜像，包含了一个 shell 和基础的\
  \ Linux 实用程序。要下载该镜像，我们使用 `pull` 命令：\n\n```\nroot@host01:~# ctr image pull docker.io/library/busybox:latest\n\
  \n...\n\nroot@host01:~# ctr images ls\n\nREF                              ...\n\n\
  docker.io/library/busybox:latest ...\n```\n\n现在我们的镜像列表不再为空了。让我们从该镜像启动运行一个容器：\n\n\
  ```\nroot@host01:~# ctr run -t --rm docker.io/library/busybox:latest v1\n\n/ #\n\
  ```\n\n这看起来与使用 Docker 相似。我们使用 `-t` 为此容器创建一个 TTY，允许我们与其交互，并使用 `--rm` 告诉 `containerd`\
  \ 在主进程停止时删除容器。然而，有一些重要的区别需要注意。我们在第 1 章中使用 Docker 时，并没担心在运行它之前拉取镜像，并且可以使用像 `nginx`\
  \ 或 `rockylinux:8` 这样简单的名称。`ctr` 工具要求我们指定 `docker.io/library/busybox:latest` 这种完整路径，包含了注册表主机名和标签。此外，我们必须先拉取镜像，因为运行时不会自动为我们执行操作。\n\
  \n现在我们已进入容器内部，可以看到它具有隔离的网络堆栈和进程空间：\n\n```\n/ # ip a\n\n1: lo: <LOOPBACK,UP,LOWER_UP>\
  \ mtu 65536 qdisc noqueue qlen 1000\n\n    link/loopback 00:00:00:00:00:00 brd 00:00:00:00:00:00\n\
  \n    inet 127.0.0.1/8 scope host lo\n\n        valid_lft forever preferred_lft\
  \ forever\n\n    inet6 ::1/128 scope host \n\n        valid_lft forever preferred_lft\
  \ forever\n/ # ps -ef\n\nPID   USER     TIME  COMMAND\n\n    1 root      0:00 sh\n\
  \n    8 root      0:00 ps -ef\n\n/ #\n```\n\n在容器内部，我们看到了一个环回网络接口。我们还看到了 shell 进程以及我们运行的\
  \ `ps` 命令。对于容器中的进程而言，我们运行在一个独立的系统上，那里没有其他进程在运行或在网络上监听。\n\n#### 为什么没有网桥接口？\n\n如果你用过\
  \ Docker，你可能会惊讶地发现这个容器只有一个环回接口。容器平台上的默认网络还会提供一个附加到网桥的额外接口。这允许容器之间相互通信，并允许容器使用主机接口通过网络地址转换（NAT）访问外部网络。\n\
  \n在这种情况下，我们是直接与低级容器运行时交互。该容器运行时仅负责管理镜像和运行容器。如果我们需要网桥接口和互联网连接，我们需要自己提供（我们在第 4 章中正是这样做的）。\n\
  \n我们已经说明了可以与 `containerd` 运行时交互来运行容器，并且在容器内部我们与系统的其余部分隔离。这种隔离是如何工作的？为了找到答案，让我们保持容器运行并从主机系统对其进行调查。\n\
  \n### 介绍 Linux 命名空间\n\n与其他容器运行时一样，`containerd` 使用了名为命名空间（namespaces）的 Linux 内核特性来隔离容器中的进程。如前所述，进程隔离的大部分工作是为了确保进程看不到它不该看到的内容。在命名空间中的进程只能看到特定系统资源的限制视图。\n\
  \n尽管容器化似乎是一项新技术，但 Linux 命名空间已经存在多年。随着时间的推移，增加了更多类型的命名空间。我们可以使用 `lsns` 命令查找与我们的容器关联的命名空间，但首先我们需要知道主机上容器\
  \ shell 进程的进程 ID（PID）。在保持容器运行的同时，打开另一个终端标签页或窗口。（更多信息请参阅第 xx 页上的“运行示例”）。然后，使用 `ctr`\
  \ 列出运行中的容器：\n\n```\nroot@host01:~# ctr task ls\n\nTASK    PID      STATUS    \n\n\
  v1      18088    RUNNING\n```\n\n让我们使用 `ps` 来验证我们是否拥有正确的 PID。当你亲自运行这些命令时，请务必使用列表显示的\
  \ PID：\n\n```\nroot@host01:~# ps -ef | grep 18088 | grep -v grep\n\nroot       18088\
  \   18067  0 18:46 pts/0    00:00:00 sh\n\nroot@host01:~# ps -ef | grep 18067 |\
  \ grep -v grep\n```\n\n如预期的那样，此 PID 的父进程是 `containerd`。接下来让我们使用 `lsns` 列出 `containerd`\
  \ 创建的所有命名空间：\n\n```\nroot@host01:~# lsns | grep 18088\n```\n\n在这里，containerd 正在使用五种不同类型的命名空间来完全隔离运行\
  \ busybox 容器的进程：\n\nmnt 挂载点 (Mount points)\n\nuts 时间共享（主机名和网络域） (time sharing)\n\
  \nipc 进程间通信（例如共享内存） (Interprocess communication)\n\npid 进程标识（以及运行中的进程列表） (Process\
  \ identifiers)\n\nnet 网络（包括接口、路由表和防火墙） (Network)\n\n最后，我们通过在容器内部（第一个终端窗口）运行 `exit`\
  \ 来关闭 BusyBox 容器：\n\n```\n/ # exit\n```\n\n该命令将我们带到普通的 shell 提示符界面，以便我们准备好进行下一组示例。\n\
  \n### CRI-O 中的容器与命名空间\n\n除了 containerd，Kubernetes 还支持其他容器运行时。取决于你使用的 Kubernetes\
  \ 发行版，你可能会发现容器运行时是不同的。例如，Red Hat OpenShift 使用 CRI-O，另一种替代容器运行时。CRI-O 也被 Podman、Buildah\
  \ 和 Skopeo 工具套件使用，这些工具是 Red Hat 8 及相关系统中管理容器的标准方式。\n\n让我们使用 CRI-O 运行相同的容器镜像，以便更好地了解容器运行时之间的区别，同时也展示它们如何使用相同的\
  \ Linux 内核能力进行进程隔离。\n\n你可以通过使用本章示例提供的额外准备脚本来跳过这些安装命令。指令请参见本章的 README 文件。\n\nOpenSUSE\
  \ Kubic 项目为各种 Linux 发行版（包括 Ubuntu）托管了 CRI-O 仓库，因此我们将从那里下载。具体的 URL 取我们要安装的 CRI-O\
  \ 版本，由于 URL 很长且难以输入，自动化脚本安装了一个脚本来配置一些实用的环境变量。在继续之前，我们需要加载该脚本：\n\n```\nroot@host01:~#\
  \ source /opt/crio-ver\n```\n\n现在我们可以使用环境变量设置 CRI-O 仓库并安装 CRI-O：\n\n\n\n\n```\n\
  root@host01:~# echo \"deb $REPO/$OS/ /\" > /etc/apt/sources.list.d/kubic.list\n\n\
  root@host01:~# echo \"deb $REPO/$OS/ /\" > /etc/apt/sources.list.d/kubic.list\n\n\
  root@host01:~# echo \"deb $REPO/$OS/ /\" > /etc/apt/sources.list.d/kubic.list\n\n\
  root@host01:~# echo \"deb $REPO/$OS/ /\" > /etc/apt/sources.list.d/kubic.list\n\n\
  root@host01:~# echo \"deb $REPO/$OS/ /\" > /etc/apt/sources.list.d/kubic.list\n\n\
  root@host01:~# echo \"deb $REPO/$OS/ /\" > /etc/apt/sources.list.d/kubic.list\n\n\
  root@host01:~# echo \"deb $REPO/$OS/ /\" > /etc/apt/sources.list.d/kubic.list\n\n\
  root@host01:~# echo \"deb $REPO/$OS/ /\" > /etc/apt/sources.list.d/kubic.list\n\n\
  root@host01:~# echo \"deb $REPO/$OS/ /\" > /etc/apt/sources.list.d/kubic.list\n\n\
