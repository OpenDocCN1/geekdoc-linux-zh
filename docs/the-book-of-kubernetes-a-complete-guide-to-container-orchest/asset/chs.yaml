  [/content]\n\n译文：\n\n[content]\n最后一点说明：为了让此 `curl` 命令生效，我们需要对使用的主机名或 IP 地址进行选择性处理。API\
  \ 服务器正在监听所有网络接口，因此我们可以使用 `localhost` 或 `127.0.0.1` 连接到它。然而，这些地址并没有列在 `kube-apiserver`\
  \ 证书列表中，因此无法用于安全的 HTTP 连接，因为 `curl` 不信任该连接。\n\n### API 服务器身份验证\n\n在 API 服务器接受我们的请求之前，我们需要提供身份验证信息，因此让我们了解一下\
  \ API 服务器的身份验证流程。身份验证通过一组插件处理，每个插件都会检查请求以确定其是否可以识别客户端。第一个成功识别客户端的插件将向 API 服务器提供身份信息。然后，该身份信息将结合授权（authorization）使用，以确定客户端被允许执行的操作。\n\
  \n由于身份验证是基于插件的，可以根据需要提供任意不同的客户端身份验证方式。甚至可以在 API 服务器的前端添加一个代理，执行自定义的身份验证逻辑，并在 HTTP\
  \ 请求头中将用户身份传递给 API 服务器。\n\n出于我们的目的，我们将关注在集群内部或作为集群设置过程部分的三个主要身份验证插件：`client certificates`（客户端证书）、`bootstrap\
  \ tokens`（引导令牌）和 `service accounts`（服务账户）。\n\n#### 客户端证书\n\n如之前提到的，像 `curl` 这样的\
  \ HTTP 客户端通过将服务器主机名与其证书进行比较，并对照受信任 CA 列表检查证书签名来验证服务器的身份。除了检查服务器身份外，安全的 HTTP 还允许客户端向服务器提交证书。服务器根据其受信任权威机构列表检查签名，然后使用证书的主题（subject）作为客户端的身份。\n\
  \nKubernetes 广泛使用 HTTP 客户端证书身份验证，使集群服务能够与 API 服务器进行验证。这包括控制平面组件以及运行在每个节点上的 `kubelet`\
  \ 服务。我们可以使用 `kubeadm` 列出控制平面使用的证书：\n\n```\nroot@host01:~# kubeadm certs check-expiration\n\
  \n...\n\nCERTIFICATE                ...  RESIDUAL TIME   CERTIFICATE AUTHORITY ...\n\
  \nadmin.conf                 ...  363d                                  ...\n\n\
  apiserver                  ...  363d            ca                    ...\n\napiserver-etcd-client\
  \      ...  363d            etcd-ca               ...\n\napiserver-kubelet-client\
  \   ...  363d            ca                    ...\n\ncontroller-manager.conf  \
  \  ...  363d                                  ...\n\netcd-healthcheck-client   \
  \ ...  363d            etcd-ca               ...\n\netcd-peer                  ...\
  \  363d            etcd-ca               ...\n\netcd-server                ... \
  \ 363d            etcd-ca               ...\n\nfront-proxy-client         ...  363d\
  \            front-proxy-ca        ...\n\nscheduler.conf             ...  363d \
  \                                 ...\n\n...\n```\n\n`RESIDUAL TIME` 列显示了这些证书过期前剩余的次数；默认情况下，它们在一年后过期。使用\
  \ `kubeadm certs renew` 来刷新它们，并将证书名称作为参数传递。\n\n列表中的第一项 `admin.conf` 是我们在过去几个章节中向集群进行身份验证的方式。在初始化期间，`kubeadm`\
  \ 创建了此证书并将其信息存储在 `/etc/kubernetes/admin.conf` 文件中。我们运行的每个 `kubectl` 命令都使用了这个文件，因为我们的自动化脚本设置了\
  \ `KUBECONFIG` 环境变量：\n\n```\nroot@host01:~# echo $KUBECONFIG\n\n/etc/kubernetes/admin.conf\n\
  ```\n\n如果我们没有设置 `KUBECONFIG`，`kubectl` 将使用默认值，即用户家目录下的 `.kube/config` 文件。\n\n（注：由于原文存在大量重复段落，此处译文已剔除重复内容，仅保留逻辑连续的翻译。）\n\
  \n\n\n此令牌作为 Kubernetes `Secret` 添加到 `kube-system` 命名空间中。我们将在第 16 章中详细查看 secret。现在，让我们只需验证它是否存在即可：\n\
  \n```\nroot@host01:~# kubectl -n kube-system get secret\n\nNAME                \
  \    TYPE                           DATA   AGE\n\n...\n\nbootstrap-token-pqcnd6\
  \  bootstrap.kubernetes.io/token  6      64s\n\n...\n```\n\n我们可以使用此令牌通过 HTTP Bearer\
  \ 身份验证来向 API 服务器发送请求。这意味着我们在一个名为 `Authorization` 的 HTTP 请求头中提供令牌，并在其前面加上 `Bearer`\
  \ 单词。当引导启动令牌身份验证插件看到该请求头并将提供的令牌与相应的 `secret` 匹配时，它就会为我们对 API 服务器进行身份验证，并允许我们访问 API。\n\
  \n出于安全考虑，引导启动令牌只有访问 API 服务器证书签名请求（certificate signing request）的权限，因此这就是我们的令牌允许执行的所有操作。\n\
  \n让我们使用引导启动令牌来列出所有的证书签名请求：\n\n```\nroot@host01:~# curl --cacert ca.crt \\\n\n  -H\
  \ \"Authorization: Bearer $TOKEN\" \\\n\n  https://192.168.61.11:6443/apis/certificates.k8s.io/v1/certificatesigningrequests\n\
  \n{\n  \"kind\": \"CertificateSigningRequestList\",\n\n  \"apiVersion\": \"certificates.k8s.io/v1\"\
  ,\n  \"metadata\": {\n    \"resourceVersion\": \"21241\"\n  },\n  \"items\": [\n\
  \n...\n\n  ]\n}\n```\n\n了解引导启动令牌的工作原理非常重要，因为它们对于向集群中添加节点至关重要。然而，正如名称所示，这确实是引导启动令牌的唯一用途；将它们用于普通的\
  \ API 服务器访问是不常的。对于普通的 API 服务器访问，特别是从集群内部的访问，我们需要 `ServiceAccount`。\n\n### 服务账户 (Service\
  \ Accounts)\n\n运行在 Kubernetes 集群中的容器通常需要与 API 服务器通信。例如，我们在第 6 章中在集群 之上部署的所有各种组件，包括\
  \ Calico 网络插件、Longhorn 存储驱动程序和 metrics server，都会与 API 服务器通信，以观察和修改集群状态。为了支持这一点，Kubernetes\
  \ 会自动向每个运行的容器中注入凭据。\n\n当然，出于安全考虑，只给每个容器提供其所需的 API 服务器权限是非常重要的，因此我们应该为每个应用程序或集群组件创建一个单独的\
  \ `ServiceAccount` 来实现。这些 `ServiceAccounts` 的信息随后会被添加到 `Deployment` 或其他控制器中，以便 Kubernetes\
  \ 能够注入正确的凭据。在某些情况下，我们可能为同一个应用程序使用多个 `ServiceAccount`，限制每个应用程序组件仅访问其所需的权限。\n\n除了为每个应用程序或组件使用单独的\
  \ `ServiceAccount` 外，为每个应用程序使用单独的 `Namespace` 也是良好的做法。正如我们很快将看到的，权限可以限制在单个 `Namespace`\
  \ 中。让我们从创建命名空间开始：\n\n```\nroot@host01:~# kubectl create namespace sample\n\nnamespace/sample\
  \ created\n```\n\n`ServiceAccount` 使用持者令牌（bearer token），该令牌存储在 Kubernetes 创建 `ServiceAccount`\
  \ 创建时自动生成的 `secret` 中。让我们为在本章中创建的 `Deployment` 创建一个 `ServiceAccount`：\n\n`read-pods-sa.yaml`\n\
  \n```\n---\napiVersion: v1\nkind: ServiceAccount\nmetadata:\n  name: read-pods\n\
  \  namespace: sample\n```\n\n注意，我们使用 `metadata` 将此 `ServiceAccount` 置于我们刚刚创建的 `sample`\
  \ `Namespace` 中。我们也可以使用 `kubectl` 的 `-n` 标志来指定 `Namespace`。我们将使用常用的 `kubectl apply`\
  \ 来创建这个 `ServiceAccount`：\n\n```\nroot@host01:~# kubectl apply -f /opt/read-pods-sa.yaml\n\
  \nserviceaccount/read-pods created\n```\n\n当 `ServiceAccount` 创建时，控制器管理器会检测到并自动创建一个带有凭据的\
  \ `Secret`：\n\n```\nroot@host01:~# kubectl -n sample get serviceaccounts\n\nNAME\
  \        SECRETS   AGE\n\ndefault     1         27s\n\nread-pods   1         8s\n\
  \nroot@host01:~# kubectl -n sample get secrets\n\nNAME                    TYPE \
  \                                 DATA   AGE\n\ndefault-token-mzwpt     kubernetes.io/service-account-token\
  \   3      43s\n\nread-pods-token-m4scq   kubernetes.io/service-account-token  \
  \ 3      25s\n```\n\n注意，除了我们刚刚创建的 `read-pods` `ServiceAccount` 外，已经有一个默认的 `ServiceAccount`。该账户是在\
  \ `Namespace` 创建时自动创建的；如果我们没有指定 Kubernetes 为 `Pod` 使用哪个 `ServiceAccount`，就会使用它。\n\
  \n新创建的 `ServiceAccount` 还没有任何权限。要开始添加权限，我们需要查看基于角色的访问控制（RBAC）。\n\n### 基于角色的访问控制\
  \ (Role-Based Access Controls)\n\n在 API 服务器找到可以识别客户端的身份验证插件后，它将使用该身份来确定客户端是否有权限执行所需的操作，这是通过组合一个属于用户的角色列表来实现的。角色可以直接与用户关联，也可以与用户所属的组关联。组成员身份是身份的一部分。例如，客户端证书可以包含这些信息。\n\
  \n#### 角色与集群角色 (Roles and Cluster Roles)\n\n每个角色拥有一组权限。这种控制是通过组合一个属于用户的角色列表来实现的。角色可以直接与用户关联，也可以与用户所属的组关联。组成员身份是身份的一部分。例如，客户端证书可以包含这些信息。\n\
  \n每个角色拥有一组权限。这种控制是通过组合一个属于用户的角色列表来实现的。角色可以直接与用户关联，也可以与用户所属的组关联。组成员身份是身份的一部分。例如，客户端证书可以包含这些信息。\n\
  \n每个角色拥有一组权限。这种控制是通过组合一个属于用户的角色列表来实现的。角色可以直接与用户关联，也可以与用户所属的组关联。组成员身份是身份的一部分。例如，客户端证书可以包含这些信息。\n\
