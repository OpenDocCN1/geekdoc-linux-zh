  \n**重新审视：您提供的“需要翻译的文本”实际上是一段关于容器操作的脚本。以下是针对该文本逻辑部分的翻译：**\n\n[content]\n实际上，在 Kubernetes\
  \ 环境中，通过 `echo \"deb $REPO/$OS/ /\" > /etc/apt/sources.list.d/kubic.list` 这种命令通常用于配置软件源。\n\
  \n后续的逻辑涉及：\n1. **配置软件源**。\n2. **使用 crictl 工具管理容器**：\n   - 创建 Pod：`crictl runp`。\n\
  \   - 创建容器：`crictl create`。\n   - 启动容器：`crictl start`。\n   - 拉取镜像：`crictl pull`。\n\
  \   - 查看状态：`crictl pods`。\n3. **YAML 配置**：通过 `pod.yaml` 和 `container.yaml` 定义容器的元数据、镜像、启动参数以及安全上下文。\n\
  \n\n\n\n在容器中运行进程时，棘手的任务之一是处理作为 PID 1 的相应责任。为了更好地理解这一点，我们不会让容器运行时为我们创建命名空间。相反，我们将直接与\
  \ Linux 内核手动在命名空间中运行进程。我们将使用命令行，虽然运行时使用的是 Linux 内核 API，但结果是相同的。\n\n由于命名空间是 Linux\
  \ 内核的特性，不需要安装或配置其他内容。我们只需要在启动进程时使用 `unshare` 命令：\n\n```\nroot@host01:~# unshare\
  \ -f -p --mount-proc -- /bin/sh -c /bin/bash\n```\n\n`unshare` 命令以与父进程不同的命名空间运行程序。通过添加\
  \ `-p`，我们指定需要一个新的 PID 命名空间。`--mount-proc` 选项添加一个新的挂载命名空间并确保 `/proc` 被正确重新挂载，以便进程能够看到正确的进程信息。否则，进程仍然能够看到系统中其他进程的信息。最后，`--`\
  \ 之后的内容要运行的命令。\n\n由于这是一个隔离的进程命名空间，它看不到该命名空间之外的进程列表：\n\n```\nroot@host01:~# ps -ef\n\
  \nUID          PID    PPID  C STIME TTY          TIME CMD\n\nroot           1  \
  \     0  0 22:21 pts/0    00:00:00 /bin/sh -c /bin/bash\n\nroot           2    \
  \   1  0 22:21 pts/0    00:00:00 /bin/bash\n\nroot           9       2  0 22:22\
  \ pts/0    00:00:00 ps -ef\n```\n\n让我们获取这个命名空间的 ID，以便我们能在列表中识别它：\n\n```\nroot@host01:~#\
  \ ls -l /proc/self/ns/pid\n\nlrwxrwxrwx 1 root root 0 Mar  6 22:22 /proc/self/ns/pid\
  \ -> 'pid:[4026532190]'\n```\n\n现在，从另一个终端窗口列出所有命名空间并寻找与我们隔离的 shell 相关的空间：\n\n```\n\
  root@host01:~# lsns\n\n        NS TYPE NPROCS PID   USER COMMAND\n\n...\n\n4026532189\
  \ mnt  3      12110 root unshare -f -p ...\n\n4026532190 pid  2      12111 root\
  \ /bin/sh -c /bin/bash\n\n...\n\nroot@host01:~# exit\n```\n\n我们看到了与之前匹配的 pid 命名空间。此外，我们看到了一个\
  \ mnt 命名空间。这个命名空间确保我们的 shell 在 `/proc` 中看到正确的信息。\n\n由于 命名空间由 `sh` 命令拥有，当我们在命名空间内运行\
  \ `ps` 时，该命令就是 PID 1。这意味着 `sh` 有责任妥善管理其子进程（例如 `bash`）。例如，`sh` 负责向其子进程传递信号以确保它们正确终止。记住这一点非常重要，因为这是运行容器时的常见问题，可能会导致僵尸进程或其他清理停止容器的其他问题。\n\
  \n幸运的是，`sh` 很好地处理了管理职责，正如我们看到的，当我们向它传递 kill 信号时，它会将该信号传递给子进程。在第二个终端窗口（命名空间外）运行此命令：\n\
  \n```\nroot@host01:~# kill -9 12111\n```\n\n在第一个窗口中你将看到此输出：\n\n```\nroot@host01:~#\
  \ Killed\n```\n\n这表明 `bash` 接收到了 kill 信号并正确终止。\n\n### 总结\n\n尽管容器营造了一个完全独立的系统的假象，但其实现方式与虚拟机没有任何共同之处。相反，这种过程类似于传统的进程隔离手段，例如用户权限和独立的文件系统。容器运行时使用内置在\
  \ Linux 内核中的命名空间，它能够实现各种类型的进程隔离。在本章中，我们研究了 `containerd` 和 `CRI-O` 运行时如何使用多种类型的 Linux\
  \ 命名空间，为每个容器提供对其他进程、网络设备和文件系统的独立视图。命名空间的使用防止了运行在容器中的进程看到并干扰其他进程。\n\n与同时，容器中的进程仍然共享相同的\
  \ CPU、内存和网络。使用过多这些资源的一个进程将阻止其他进程的正常运行。然而，命名空间无法解决这个问题。为了防止这个问题，我们需要查看资源限制——这是我们下一章的主题。\n\
  \n## 3. 资源限制\n\n![image](img/common01.jpg)\n\n我们在第 2 章中做的进程隔离工作非常重要，因为进程通常无法影响它“看不到”的东西。然而，我们的进程可以看到宿主机的\
  \ CPU、内存和网络，因此进程可能会通过使用过多的资源来阻止其他进程正确运行，而不给其他进程留下足够的空间。在本章中，我们将看到如何确保进程仅使用其分配的 CPU、内存和网络资源，确保我们能够准确划分资源。这在我们转向容器编排时将非常有帮助，因为它将为\
  \ Kubernetes 在调度容器时提供关于每个主机上可用资源的确定性。\n\nCPU、内存和网络很重要，但还有一个非常重要的共享资源：存储。然而，在像 Kubernetes\
  \ 这样的容器编排环境中，存储是分布式的，限制需要在集群层面应用。由于这个原因，我们存储的讨论必须等到第 15 章。\n\n### CPU \n\n我们需要分别查看\
  \ CPU、内存和网络，因为限制的影响在每种情况下不同。让我们从查看 CPU 使用开始。为了理解 CPU 限制，首先需要查看 Linux 内核如何决定运行哪个进程以及多久。在\
  \ Linux 内核中，调度器维护着所有进程的列表。它还跟踪哪些进程已就绪以及每个进程最近运行了多久。这允许它创建一个优先级列表，以便选择下一个运行的进程。调度器的设计尽可能公平（它被称为完全公平调度器）；因此它尝试给所有进程机会。然而，它可以接受外部输入，确定哪些进程比其他进程更。这种优先级由两部分组成：调度策略以及策略内进程的优先级。\n\
  \n#### 实时与非实时策略\n\n调度器支持多种策略，但对于我们的目的，可以将它们分为实时策略和非实时策略。“实时”一词意味着某些真实世界的事件对进程来说是关键的。进程需要在截止日期过期之前完成处理，否则将发生糟糕的事情。例如，进程可能正在从嵌入式硬件收集数据。在这种情况下，进程必须在缓冲区溢出之前读取数据。实时进程通常不是\
  \ CPU 密集型的，但当它们需要 CPU 时无法等待，因此所有实时策略下的进程优先级都高于非实时策略下的进程。让我们在示例 Linux 系统上探索。\n\n\
  **注意**：本书的示例仓库位于 [`github.com/book-of-kubernetes/examples`](https://github.com/book-of-kubernetes/examples)。有关设置的细节，请参阅第\
  \ xx 页“运行示例”。Linux `ps` 命令告诉我们适用于每个进程的具体策略。在本章的示例的 `host01` 上运行此命令：\n\n```\nroot@host01:~#\
  \ ps -e -o pid,class,rtprio,ni,comm\n\n PID CLS RTPRIO  NI COMMAND\n\n   1 TS  \
  \     -   0 systemd\n\n...\n\n   6 TS       - -20 kworker/0:0H-kblockd\n\n...\n\n\
  \  11 FF      99   - migration/0\n\n  12 FF      50   - idle_inject/0\n\n...\n\n\
  \  85 FF      99   - watchdogd\n\n...\n\n 484 RR      99   - multipathd\n\n...\n\
  \n7967 TS       -   0 ps\n```\n\n\n\n\n`-o` 参数为 `ps` 提供了一个自定义的输出字段列表，包括调度策略 `class`\
  \ (CLS) 以及两个数值优先级字段：`RTPRIO` 和 `NI`。\n\n首先观察 `CLS` 字段，许多进程被列为 `TS`，它代表“时间分片”（time-sharing），是默认的非实时策略。这包括我们自己运行的命令（例如我们刚才运行的\
  \ `ps` 命令）以及重要的 Linux 系统进程，如 `systemd`。然而，我们我们也看到了策略为 `FF`（先入先出，FIFO）和策略为 `RR`（轮询调度，round-robin）的进程。这些是实时进程，因此它们的优先级高于系统中所有的非实时策略。列表中的实时进程包括\
  \ `watchdog`（它用于检测系统锁死，因此可能需要抢占其他进程运行）和 `multipathd`（它负责监控设备变化，并且必须在其他进程有机会与其通信之前配置好这些设备）。\n\
  \n除了类别之外，两个数值优先级字段还告诉我们进程在策略内部是如何进行优先级排序的。并不意外，`RTPRIO` 字段意味着“实时优先级”，并且仅适用于实时进程。`NI`\
  \ 字段是进程的“nice” 级，仅适用于非实时进程。由于历史原因，nice 值的范围从 –20（最不利，即最高优先级）到 19（最 nice，即最低优先级）。\n\
  \n### 设置进程优先级\n\nLinux 允许我们为启动的进程设置优先级。让我们尝试使用优先级来控制 CPU 使用率。我们将运行一个名为 `stress`\
  \ 的程序，它设计用于对系统进行压力测试。让我们使用基于 `CRI-O` 的容器版本的 `stress`。\n\n与之前一样，我们需要为 Pod 和容器定义 YAML\
  \ 文件，以告诉 `crictl` 运行什么。列表 3-1 所示的 Pod YAML 与 第 2 章 中的 BusyBox 示例几乎相同，唯一的区别是名称不同：\n\
  \n`po-nolim.yaml`\n\n```\n---\nmetadata:\n  name: stress\n  namespace: crio\nlinux:\n\
  \  security_context:\n    namespace_options:\n      network: 2\n```\n`列表 3-1: BusyBox`\n\
  \n容器 YAML 与 BusyBox 示例相比有更多变化。除了使用不同的容器镜像（一个已经安装了 `stress` 的镜像）之外，我们还需要为 `stress`\
  \ 提供参数，让它测试单个 CPU：`co-nolim.yaml`\n\n```\n---\nmetadata:\n  name: stress\n  image:\
  \ docker.io/kubernetes/stress\n  args:\n  - \"--cpu\"\n  - \"1\"\n  - \"-v\"\n```\n\
  \n`CRI-O` 已经安装在 `host01` 上，因此只需要几个命令即可启动该容器。首先，我们拉取镜像：\n\n```\nroot@host01:/opt#\
  \ crictl pull docker.io/kubernetes/stress\n```\n镜像 `docker.io/kubernetes/stress`\
  \ 是最新的。\n\n然后，我们可以从该镜像运行容器：\n\n```\nroot@host01:/opt# cd /opt\nroot@host01:/opt#\
  \ PUL_ID=$(crictl run po-nolim.yaml)\nroot@host01:/opt# CUL_ID=$(crictl create $PUL_ID\
  \ co-nolim.yaml)\nroot@host01:/opt# crictl start $CUL_ID\nroot@host01:/opt# crictl\
  \ ps\nCONTAINER IMAGE\n971e839273 docker.io/kubernetes/stress\n```\n\n`crictl ps`\
  \ 只是为了检查我们的容器正在运行。`stress` 程序现在运行在我们的系统上，我们可以看到当前的优先级和 CPU 使用率。我们需要查看当前的 CPU 使用率，因此将使用\
  \ `top`：\n\n```\nroot@host01:/opt# top -b -n 1 -p $(pgrep -d , stress)\ntop -18:01:58\
  \ up 1:39,  1 user,  load average: 1.01, 0.40, 0.16\nTasks:   2 total,   1 running,\
  \   1 sleeping,   0 stopped,   0 zombie\n%Cpu(s): 34.8 us, 0.0 sy, 0.0 ni, 65.2\
  \ id, 0.0 wa,  0.0 hi,  0.0 si\nMiB Mem :   1987.5 total,   1024.5 free,    195.8\
  \ used,    767.3 buff/cache\nMiB Swap:      0.0 total,      0.0 free,      0.0 used.\
  \   1643.7 avail Mem \n  PID   USER  PR  NI  ...  %CPU  %MEM    TIME+ COMMAND\n\
  \  13459 root  20   0  ... 100.0   0.2   0:29.78 stress-ng\n  13435 root  20   0\
  \  ...   0.0   0.2   0:00.01 stress-ng\n```\n\n`pgrep` 命令查找 `stress` 的进程 ID (`PIDs`)；之所以有两个，是因为\
  \ `stress` 为我们请求的 CPU 测试派生了一个单独进程。这个 CPU 工作线程正在使用一个 CPU 的 100%。幸运的是，我们的虚拟机有两个 CPU，所以它并没有过载。我们以默认优先级启动此进程，因此它的\
  \ nice 值为 0，如 `NI` 列所示。如果我们更改该优先级会怎样？让我们使用 `renice` 来查看：\n\n```\nroot@host01:/opt#\
  \ renice -n 19 -p $(pgrep -d ' ')\n13435 (process ID) old priority 0, new priority\
  \ 19\n13459 (process ID) old priority 0, new priority 19\n```\n\n`ps` 命令期望 PIDs\
  \ 用逗号分隔，而 `renice` 命令期望 PIDs 用空格分隔；幸运的是，`pgrep` 可以处理这两种。我们已经成功更改了进程的优先级：\n\n```\n\
  root@host01:/opt# top -b -n 1 -p $(pgrep -d , stress)\ntop -18:11:04 up  1:48, \
  \ 1 user,  load average: 1.07, 0.95, 0.57\nTasks:   2 total,   1 running,   1 sleeping,\
  \   0 stopped,   0 zombie\n%Cpu(s): 0.0 us, 0.0 sy, 28.6 ni, 71.4 id,  0.0 wa, \
  \ 0.0 hi,  0.0 si,  0.0 st\nMiB Mem :   1987.5 total,   1035.6 free,    182.2 used,\
  \    769.7 buff/cache\nMiB Swap:      0.0 total,      0.0 free,      0.0 used. \
  \  1657.2 avail Mem \n  PID   USER  PR  NI  ...  %CPU  %MEM     TIME+ COMMAND\n\
  \  13459 root  39  19  ... 100.0   0.2   9:35.50 stress-ng\n  13435 root  39  19\
  \  ...   0.0   0.2   0:00.01 stress-ng\n```\n\n### Linux 控制组 (cgroups)\n\n正如我们在上一节看到的，进程优先级排序无法帮助\
  \ Kubernetes 等容器编排环境在调度新容器时确定使用哪个主机，因为当 CPU 空闲时，即使是低优先级进程获得大量的 CPU 时间。而且由于我们的 Kubernetes\
  \ 集群可能是多租户的，集群不能仅仅信任容器承诺只使用一定数量的 CPU。首先，这允许一个进程负面地影响另一个进程，无论是恶意还是无意地。其次，进程并不真正控制自己的调度；它们只有在\
  \ Linux 内核决定给它们 CPU 时间时才能获得执行。我们需要一种不同的方案来控制 CPU 使用率。\n\n\n\n\n\n为了找到答案，我们可以采用实时处理中使用的方法。正如我们在上一节中提到的，实时进程通常不是计算密集型的，但当它们需要\
  \ CPU 时，它们需要立即获得使用。为了确保所有实时进程都能获得它们所需的 CPU，通常的做法是为每个进程保留一段 CPU 时间切片。尽管我们的容器进程不是实时的，但我们也可以使用相同的策略。如果我们可以配置容器，使其使用的\
  \ CPU 时间不超过其分配的切片，那么 Kubernetes 就能计算出每个主机上剩余的可用空间，并将容器调度到具有足够空间的主机上。\n\n为了管理容器对\
  \ CPU 核心的使用，我们将使用 `control groups`（控制组）。控制组 (`cgroups`) 是 Linux 内核的一项功能，用于管理进程的资源利用。每种资源类型（如\
  \ CPU、内存或块设备）都可以关联一个整个 cgroups 层次结构。进程一旦进入某个 cgroup，内核就会自动应用该组的控制策略。\n\ncgroups\
  \ 的创建和配置是通过一种特殊的文件系统处理的，类似于 Linux 通过 `/proc` 文件系统报告系统信息的方式。默认情况下，cgroups 的文件系统位于\
  \ `/sys/fs/cgroup`：\n\n```\nroot@host01:~# ls /sys/fs/cgroup\n\nblkio        cpuacct\
  \  freezer  net_cls           perf_event  systemd\n\ncpu          cpuset   hugetlb\
  \  net_cls,net_prio  pids        unified\n\ncpu,cpuacct  devices  memory   net_prio\
  \          rdma\n```\n\n`/sys/fs/cgroup` 中的每个条目都是一个可以限制的不同资源。如果我们查看其中一个目录，就可以开始看到可以应用哪些控制。例如，对于\
  \ `cpu`：\n\n```\nroot@host01:~# cd /sys/fs/cgroup/cpu\n\nroot@host01:/sys/fs/cgroup/cpu#\
  \ ls -F\n\ncgroup.clone_children  cpuacct.stat               cpuacct.usage_user\n\
  \ncgroup.procs           cpuacct.usage              init.scope/\n\ncgroup.sane_behavior\
  \   cpuacct.usage_all          notify_on_release\n\ncpu.cfs_period_us      cpuacct.usage_percpu\
  \       release_agent\n\ncpu.cfs_quota_us       cpuacct.usage_percpu_sys   system.slice/\n\
  \ncpu.shares             cpuacct.usage_percpu_user  tasks\n\ncpu.stat          \
  \     cpuacct.usage_sys          user.slice/\n```\n\n`ls` 命令的 `-F` 标志会在目录后添加斜杠字符，这使我们能够看到层次结构。这些子目录中的（`init.scope`、`system.slice`\
  \ 和 `user.slice`）都是独立的 CPU cgroup，每个 cgroup 都有自己的一组配置文件，适用于 cgroup 中的进程。\n\n###\
  \ 使用 cgroups 限制 CPU 配额\n\n为了理解该目录的内容，让我们看看如何使用 cgroups 来限制压力容器（stress container）的\
  \ CPU 使用率。我们将再次检查它的 CPU 使用情况：\n\n```\nroot@host01:/sys/fs/cgroup/cpu# top -b -n\
  \ 1 -p $(pgrep -d , stress)\n\ntop - 22:40:12 up 12 min,  1 user,  load average:\
  \ 0.81, 0.35, 0.21\n\nTasks:   2 total,   1 running,   1 sleeping,   0 stopped,\
  \   0 zombie\n\n%Cpu(s): 37.0 us, 0.0 sy, 0.0 ni, 63.0 id,  0.0 wa,  0.0 hi,  0.0\
  \ si,  0.0 st\n\nMiB Mem :   1987.5 total,   1075.1 free,    179.4 used,    733.0\
  \ buff/cache\n\nMiB Swap:      0.0 total,      0.0 free,      0.0 used.   1646.3\
  \ avail Mem \n\n  PID USER   PR  NI ...  %CPU  %MEM     TIME+ COMMAND\n\n  5964\
  \ root  20  19 ...  100.0  0.2   1:19.72 stress-ng\n\n  5932 root  20  19 ...  0.0\
  \    0.2   0:00.02 stress-ng\n```\n\n如果你仍然没有看到 stress 在运行，请使用本章之前的命令重新启动它。接下来，让我们探索我们的压力\
  \ CPU 进程在哪个 CPU cgroup 中。我们可以通过在 `/sys/fs/cgroup/cpu` 层次结构中的文件中找到它的 PID 来实现：\n\n\
  ```\nroot@host01:/sys/fs/cgroup/cpu# grep -R $(pgrep stress-ng-cpu)\n\nsystem.slice/runc-050c.../cgroup.procs:5964\n\
  \nsystem.slice/runc-050c.../tasks:5964\n```\n\nstress 进程是 `system.slice` 层次结构的一部分，位于由\
  \ `runc` 创建的子目录下，`runc` 是 CRI-O 的内部组件之一。这非常方便，意味着我们不需要创建自己的 cgroup 并此进程移动其中。这并非偶然；正如我们即将看到的，CRI-O\
  \ 提供了 cgroup。\n\n为了限制 CPU 使用率，我们将使用 `cpu.cfs_quota_us` 和 `cpu.cfs_period_us` 文件。`cpu.cfs_period_us`\
  \ 定义了周期（时间），`cpu.cfs_quota_us` 定义了 cgroup 在该周期内可以使用的时间。例如，如果 `cpu.cfs_quota_us`\
  \ 设置为 `50000` 而 `cpu.cfs_period_us` 为 `100000`，则 cgroup 被限制为单个 CPU 核心的 50%。我们可以通过读取这些文件找到当前的限制：\n\
  \n```\nroot@host01:/sys/fs/cgroup/cpu# cat cpu.cfs_quota_us\n100000\nroot@host01:/sys/fs/cgroup/cpu#\
  \ cat cpu.cfs_period_us\n100000\n```\n\n要设置限制，我们向 `cpu.cfs_quota_us` 写入新值：\n\n```bash\n\
  root@host01:/sys/fs/cgroup/cpu# echo 50000 > cpu.cfs_quota_us\n```\n\n现在，压力容器被限制在\
  \ CPU 的 50%。我们可以再次运行 `top` 来验证这一点：\n\n```\nroot@host01:/sys/fs/cgroup/cpu# top -b\
  \ -n 1 -p $(pgrep -d , stress)\n\ntop - 23:53:05 up 1:24,  1 user,  load average:\
  \ 0.71, 0.93, 0.98\n\nTasks:   2 total,   1 running,   1 sleeping,   0 stopped,\
  \   0 zombie\n\n%Cpu(s): 0.0 us, 3.6 sy, 7.1 ni, 89.3 id,  0.0 wa,  0.0 hi,  0.0\
  \ si,  0.0 st\n\nMiB Mem :   1987.5 total,   1064.9 free,    174.6 used,    748.0\
  \ buff/cache\n\nMiB Swap:      0.0 total,      0.0 free,      0.0 used.   1663.9\
  \ avail Mem \n\n  PID USER   PR  NI ...  %CPU  %MEM     TIME+ COMMAND\n\n  5964\
  \ root  39  19 ...  50.0   0.2   73:45.68 stress-ng-cpu\n\n  5932 root  39  19 ...\
  \  0.0   0.2   0:00.02 stress-ng\n```\n\n`stress-ng-cpu` 的 CPU 使用率现在约为 50% 左右，证明了限制正在生效。\n\
  \n\n\n\n为了控制 CPU 使用率，如果必须为每个容器都去文件系统中查找 cgroup 的位置并更新 CPU 配额，那将非常繁琐。幸运的是，我们可以在 `crictl`\
  \ YAML 文件中指定配额，`CRI-O` 会为我们强制执行。让我们来看一个在我们设置此示例虚拟机时安装在 `/opt` 下的示例。\n\nPod 的配置与列表\
  \ 3-1 略有不同。我们添加了 `cgroup_parent` 设置，以便控制 `CRI-O` 创建 cgroup 的位置，这将使得我们更容易找到 cgroup\
  \ 并查看配置：\n\n*po-clim.yaml*\n\n```\n---\nmetadata:\n  name: stress-clim\n  namespace:\
  \ crio\n\nlinux:\n  cgroup_parent: pod.slice\n  security_context:\n    namespace_options:\n\
  \      network: 2\n```\n\n容器配置是我们包含 CPU 限制的地方。我们的 `stress1` 容器将仅获得 CPU 的 10%：\n\n\
  *co-clim.yaml*\n\n```\n---\n---\nmetadata:\n  name: stress-clim\n\nimage:\n  image:\
  \ docker.io/bookofkubernetes/stress:stable\n\nargs:\n  - \"--cpu\"\n  - \"1\"\n\
  \  - \"-v\"\n\nlinux:\n  resources:\n    cpu_period: 100000\n    cpu_quota: 10000\n\
  ```\n\n`cpu_period` 的值对应文件 `cpu.cfs_period_us`，提供了应用配额的周期长度。`cpu_quota` 的值对应文件 `cpu.cfs_quota_us`。通过将配额除以周期，我们可以确定这将设置\
  \ 10% 的 CPU 限制。让我们继续启动这个带有 CPU 限制的压力容器：\n\n```\nroot@host01:~# cd /opt\nroot@host01:/opt#\
  \ PCL_ID=$(crictl runp po-clim.yaml)\nroot@host01:/opt# CCL_ID=$(crictl create $PCL_ID\
  \ co-clim.yaml po-clim.yaml)\nroot@host01:/opt# crictl start $CCL_ID\n...\nroot@host01:/opt#\
  \ crictl ps\nCONTAINER      IMAGE                                    ...\nea8bccd711b86\
  \  docker.io/bookofkubernetes/stress:stable ...\n```\n\n我们的容器立即被限制在 CPU 的 10%：\n\
  \n```\nroot@host01:/opt# top -b -n 1 -p $(pgrep -d , stress)\ntop - 17:26:55 up\
  \ 19 min,  1 user,  load average: 0.27, 0.16, 0.13\nTasks:   4 total,   2 running,\
  \   2 sleeping,   0 stopped,   0 zombie\n%Cpu(s): 10.3 us, 0.0 sy, 0.0 ni, 89.7\
  \ id,  0.0 wa,  0.0 hi,  0.0 si,  0.0 st\nMiB Mem :   1987.5 total,   1053.4 free,\
  \    189.3 used,    744.9 buff/cache\nMiB Swap:      0.0 total,      0.0 free, \
  \     0.0 used.   1640.4 avail Mem \n  PID USER   PR  NI ... %CPU  %MEM     TIME+\
  \ COMMAND\n  8349 root  20   0 ... 10.0   0.2   0:22.67 stress-ng\n  8202 root \
  \ 20   0 ...  0.0   0.2   0:00.02 stress-ng\n```\n\n与我们之前的示例一样，显示的 CPU 使用率是 `top`\
  \ 运行期间快照，因此它可能无法完全匹配限制，但从长期来看，该进程使用的 CPU 不会超过分配的额。\n\n我们可以检查 cgroup 以确认 `CRI-O`\
  \ 将其放在了我们指定的位置并自动配置了 CPU 配额：\n\n```\nroot@host01:/opt# cd /sys/fs/cgroup/cpu/pod.slice\n\
  root@host01:...pod.slice# cat crio-$CCL_ID.scope/cpu.cfs_quota_us\n10000\n```\n\n\
  `CRI-O` 为我们的容器创建了一个新的 cgroup 父级 `pod.slice`，在其中创建了专门针对该容器的 cgroup，并在我们无需动手的情况下就配置了它的\
  \ CPU 配额。\n\n我们不再需要这个容器了，让我们删除它：\n\n```\nroot@host01:/sys/fs/cgroupcpu/pod.slice#\
  \ cd\nroot@host01:~# crictl stop $CCL_ID\n...\nroot@host01:~# crictl rm $CCL_ID\n\
  ...\nroot@host01:~# crictl stopp $PCL_ID\nStopped sandbox ...\nroot@host01:~# crictl\
  \ rmp $PCL_ID\nRemoved sandbox ...\n```\n\n通过这些命令，我们先停止后删除容器，然后是 Pod。\n\n### 内存限制\n\
  \n内存是进程另一个重要资源。如果系统没有足够的内存来满足请求，内存分配将失败。这通常会导致失败。\n\n\n\n\n```yaml\n---\n---\nmetadata:\n\
  \  name: stress2\n  image:\n    image: docker.io/bookofkubernetes/stress:stable\n\
  \  args:\n    - \"--vm\"\n    - \"1\"\n    - \"--vm-bytes\"\n    - \"512M\"\n  \
  \  - \"-v\"\nlinux:\n  resources:\n    memory_limit_in_bytes: 268435456\n    cpu_period:\
  \ 100000 \n    cpu_quota: 10000\n```\n\n新的资源限制是 `memory_limit_in_bytes`，我们将其设置为\
  \ 256MiB。我们保留了 `cpu_quota`，因为持续尝试分配内存会消耗大量的 CPU。最后，在 `args` 部分，我们告诉 `stress` 尝试分配\
  \ 512MB 的内存。\n\n我们可以使用之前使用的类似的 `crictl` 命令来运行它：\n\n```\nroot@host01:~# cd /opt \n\
  \nroot@host01:/opt# PML_ID=$(crictl runp po-mlim.yaml)\n\nroot@host01:/opt# CML_ID=$(crictl\
  \ create $PML_ID co-mlim.yaml po-mlim.yaml)\n\nroot@host01:/opt# crictl start $CML_ID\n\
  \n...\n```\n\n如果我们告诉 `crictl` 列出容器，一切看起来都很正常：\n\n```\nroot@host01:/opt# crictl ps\n\
  \nCONTAINER     IMAGE                                    ... STATE   ...\n\n31025f098a6c9\
  \ docker.io/bookofkubernetes/stress:stable ... Running ...\n```\n\n这报告容器处于 `Running`\
  \ 状态。然而，在后台，`stress` 正在艰难分配内存。我们可以通过打印来自 `stress` 容器的日志消息看到这一点：\n\n```\nroot@host01:/opt#\
  \ crictl logs $CML_ID\n\n...\n\nstress-ng: info:  [6] dispatching hogs: 1 vm\n\n\
  ...\n\nstress-ng: debug: [11] stress-ng-vm: started [11] (instance 0)\n\nstress-ng:\
  \ debug: [11] stress-ng-vm using method 'all'\n\nstress-ng: debug: [11] stress-ng-vm:\
  \ child died: signal 9 'SIGKILL' (instance 0)\n\nstress-ng: debug: [11] stress-ng-vm:\
  \ assuming killed by OOM killer, restarting again...\n\nstress-ng: debug: [11] stress-ng-vm:\
  \ child died: signal 9 'SIGKILL' (instance 0)\n\nstress-ng: debug: [11] stress-ng-vm:\
  \ assuming killed by OOM killer, restarting again...\n```\n\n`stress` 正在报告其内存分配过程正被“内存不足”（out\
  \ of memory）连续杀死。\n\n我们可以看到内核报告 `oom_reaper` 确实是进程被杀死的原因：\n\n```\nroot@host01:/opt#\
  \ dmesg | grep -i oom_reaper | tail -n 1\n\n[  696.651056] oom_reaper: reaped process\
  \ 8756\n```\n\n`OOM killer` 是 Linux 在系统内存不足需要杀死一个或多个进程以保护系统时使用的相同功能。在这种情况下，它向进程发送\
  \ `SIGKILL` 以立即将其终止。\n\n### 为什么要使用 OOM KILLER？\n\n当我们使用普通限制来控制内存时，一次尝试导致内存分配失败，但内核并没有使用\
  \ OOM killer 来杀死我们的进程。答案是这是容器的本质。当我们考虑使用微服务构建可靠的系统时，我们会发现每个容器都应该是快速启动且快速扩展的。这意味着，其中一个容器可能被意外杀死的想法并不需要担心。\n\
  \n尽管如此，值得注意的是，关闭 `cgroup` 的 OOM killer 是可以的。然而，其效果不是让内存分配失败，而是挂起进程，直到组中的其他进程释放内存。在继续之前，让我们让\
  \ `stress` 持续失败：\n\n```\nroot@host01:/opt# crictl stop $CML_ID\n\n...\n\nroot@host01:/opt#\
  \ crictl rm $CML_ID\n\n...\n\nroot@host01:/opt# crictl stop $PML_ID\n\nStopped ...\n\
  \nroot@host01:/opt# crictl rm $PML_ID\n\nRemoved ...\n\nroot@host01:/opt# cd\n```\n\
  \n停止并删除容器可以防止 `stress` 浪费 CPU。\n\n### 网络带宽限制\n\n在本章中，我们从容易限制的资源转向了更难限制的资源。我们从 CPU\
  \ 开始，内核负责决定哪个进程获得时间以及它们在被抢占前获得多少时间。然后我们查看了内存，内核没有强制进程放弃内存的能力，但至少可以控制内存分配是否成功，或者杀死请求过多的进程。\n\
  \n现在我们转向了网络带宽，由于两个原因，施加这种控制更加困难。首先，网络设备并不真正喜欢 CPU 或内存，因此我们需要在每个单独的网络设备层级限制使用情况。其次，我们的系统无法真正控制跨越网络发送的内容；我们只能控制\
  \ `egress`（出站）。\n\n\n\n\n网络接口名称在不同系统上可能不同，因此我们使用 `ip addr` 来识别我们想要控制的接口。然后，我们使用\
  \ `tc` 来实际应用限制。命令中的令牌 `tbf` 代表 `token bucket filter`（令牌桶过滤器）。使用令牌桶过滤器，每个数据包都会消耗令牌。桶随着时间推移重新填充令牌，但如果在任何时刻桶为空，数据包将排队等待，直到令牌可用。通过控制桶的大小和填充速率，内核可以非常容易地设置带宽限制。\n\
  \n现在我们已经对该接口应用了限制，让我们再次运行相同的 `iperf3` 命令来查看运行效果：\n\n```\nroot@host01:~# iperf3 -c\
  \ 192.168.61.12\n\nConnecting to host 192.168.61.12, port 5201\n\n[  5] local 192.168.61.11\
  \ port 49048 connected to 192.168.61.12 port 5201\n\n...\n\n[ ID] Interval     \
  \      Transfer     Bitrate         Retr\n\n[  5]   0.00-10.00  sec   114 MBytes\
  \  95.7 Mbits/sec    0             sender\n\n[  5]   0.00-10.01  sec   113 MBytes\
  \  94.5 Mbits/sec                  receiver\n\n...\n```\n\n如所预期，现在该接口的带宽被限制在 100Mbps。\n\
  \n当然，在这种情况下，我们限制了系统上所有人在该网络接口上的可用带宽。要正确利用此功能来控制带宽使用，我们需要更精确地针对限制。然而，为了做到这一点，我们需要将进程隔离到自己的网络接口集中，这是下一章的主题。\n\
  \n### 结语\n\n确保进程不会给系统上的其他进程带来问题，包括确保它能够公平地共享系统资源，如 CPU、内存和网络带宽。在本章中，我们查看了 Linux\
  \ 如何提供控制组（`cgroups`）来管理 CPU 和内存限制，以及管理网络接口的流量控制能力。当我们创建 Kubernetes 集并向其部署容器时，我们将看到\
  \ Kubernetes 如何利用这些底层 Linux 内核特性来确保容器调度到具有足够资源的主机上，并确保容器在这些主机上良好运行。\n\n我们现在学习了容器运行时提供的进程隔离的一些重要元素，但还有两种我们尚未探索的隔离类型：网络隔离和存储隔离。在下一章中，我们将查看\
  \ Linux 网络命名空间（namespaces）如何被用于使每个容器看起来都有一套自己的网络接口，拥有独立的 IP 地址和端口。我们还将查看来自这些独立容器接口的流量如何流过系统，以便容器相互通信以及与网络的其余部分通信。\n\
  \n## 4 网络命名空间\n\n![image](img/common01.jpg)\n\n理解容器网络是构建基于容器化微服务的现代应用程序面临的最大挑战。首先，即使不引入容器，网络本身也是复杂的。仅仅从一个物理服务器向另一个物理服务器发送简单的\
  \ `ping`，就会涉及到多个层级的抽象。其次，容器引入了额外的复杂性，因为每个容器都有自己的虚拟网络设备，使其看起来像是一台独立的机器。不仅如此，像 Kubernetes\
  \ 这样的容器编排框架通过添加“叠加”（overlay）网络又增加了另一复杂性，容器即使运行在不同的主机上也可以通过该网络进行通信。\n\n在本章中，我们将详细查看容器网络的工作原理。我们将查看容器的虚拟网络设备，包括每个网络设备如何被分配一个可以到达主机的独立\
  \ IP 地址。我们将看到同一主机上的容器如何通过网桥设备连接在一起，以及容器设备如何配置以路由流量。最后，我们将检查如何使用地址转换来允许容器连接到其他主机，而不在主机网络上暴露容器网络的内部结构。\n\
  \n## 网络隔离\n\n在第 2 章中，我们讨论了隔离对系统可靠性的重要性，因为进程通常无法影响它们看不见的东西。这是容器网络隔离的一个重要原因。另一个原因是配置的便利性。要运行一个作为服务器的进程（例如\
  \ Web 服务器），我们需要选择一个或多个该服务器将监听的网络接口，并选择一个它将监听的端口号。我们不能让两个进程在同一个接口上监听同一个端口。\n\n因此，作为服务器的进程通常会提供一种配置其应该使用哪个端口来监听连接的方法。然而，这仍然我们需要知道还有哪些服务器以及它们正在使用哪些端口，以便我们确保没有冲突。在像\
  \ Kubernetes 这样的容器编排框架中，这是可能的，因为新进程可能会随时从不同的用户处出现，并需要监听任何端口号。\n\n解决办法是为每个容器提供独立的虚拟网络接口。这样，容器中的进程就可以选择它想要的任何端口——它监听的网络接口将与其他容器中的进程不同。让我们来看一个快速的示例。\n\
  \n**注意**\n\n本书的示例仓库位于 [`github.com/book-of-kubernetes/examples`](https://github.com/book-of-kubernetes/examples)。详情请参阅第\
  \ xx 页上的“运行示例”。\n\n我们将运行两个 NGINX 实例，每个实例都会监听 80 端口。正如之前，我们将使用 CRI-O 和 `crictl`，但我们将使用脚本来减少打字：\n\
  \n```\nroot@host01:~# cd /opt\n\nroot@host01:/opt# source nginx.sh\n\n...\n```\n\
  \n在 `nginx.sh` 之前执行 `source` 很，它确保脚本设置的环境变量在我们 shell 中可用。在 `nginx.sh` 内部包含了我们在之前的章节过的\
  \ `crictl run`、`crictl create` 和 `crictl start` 命令。YAML 文件与之前看到的非常相似，唯一的区别是我们使用的镜像安装了\
  \ NGINX。\n\n让我们验证是否运行了两个 NGINX 服务器：\n\n```\nroot@host01:/opt# crictl ps\n\nCONTAINER\
  \      IMAGE            ... NAME    ...\n\nae34101088ae  .../nginx:latest ... nginx2\
  \  ...\n\n6a95800b16f5  .../nginx:latest ... nginx1  ...\n```\n\n我们还可以验证两个 NGINX\
  \ 服务器都在监听 80 端口：\n\n```\nroot@host01:/opt# crictl exec $N1C_ID cat /proc/net/tcp\n\
  \n  sl  local_address ...\n\n   0: 00000000:0050 ...\n\nroot@host01:/opt# crictl\
  \ exec $N2C_ID cat /proc/net/tcp\n\n  sl  local_address ...\n\n   0: 00000000:0050\
  \ ...\n```\n\n我们通过打印 `/proc/net/tcp` 查看打开端口，因为我们需要在 NGINX 容器内部运行此命令，那里没有 `netstat`\
  \ 或 `ss` 等标准 Linux 命令。正如我们在第 2 章中看到的，在容器中我们有一个独立的 mnt 命名空间为每个容器提供独立的文件系统，因此只有在该独立文件系统中可执行的文件才能在该命名空间运行。\n\
  \n显示的端口都是十六进制的 0050，即十进制的 80。如果这两个进程在没有网络隔离的情况下在同一系统上运行，它们都无法监听 80 端口，但在这种情况下，两个\
  \ NGINX 实例具有独立的网络接口。为了进一步探索，让我们启动一个新的 BusyBox 容器：\n\n```\nroot@host01:/opt# source\
  \ busybox.sh\n\n...\n```\n\n现在 BusyBox 与我们的两个 NGINX 容器一起运行：\n\n\n\n\n```\nroot@host01:/opt#\
  \ crictl ps\n\nCONTAINER      IMAGE              ... NAME    ...\n\n189dd26766d26\
  \  .../busybox:latest ... busybox ...\n\nae341010886ae  .../nginx:latest   ... nginx2\
  \  ...\n\n6a95800b16f15  .../nginx:latest   ... nginx1  ...\n```\n\n让我们在容器内启动一个\
  \ shell：\n\n```\nroot@host01:/opt# crictl exec -ti $B1C_ID /bin/sh\n\n/ #\n```\n\
  \n列表 4-1 显示了容器的网络设备和地址。\n\n```\n/ # ip addr\n\n1: lo: <LOOPBACK,UP,LOWER_UP> mtu\
  \ 65536 qdisc noqueue ...\n\n    link/loopback 00:00:00:00:00:00 brd 00:00:00:00:00:00\n\
  \n    inet 127.0.0.1/8 scope host lo\n\n        valid_lft forever preferred_lft\
  \ forever\n\n    inet6 ::1/128 scope host \n\n        valid_lft forever preferred_lft\
  \ forever\n\n3: eth0@if7: <BROADCAST,MULTICAST,UP,LOWER_UP,M-DOWN> mtu 1500 qdisc\
  \ noqueue \n\n    link/ether 9a:7c:73:2f:f7:1a brd ff:ff:ff:ff:ff:ff\n\n    inet\
  \ 10.85.0.4/16 brd 10.85.255.255 scope global eth0\n\n        valid_lft forever\
  \ preferred_lft forever\n\n    inet6 fe80::987c:73ff:fe2f:f71a/64 scope link \n\n\
  \        valid_lft forever preferred_lft forever\n```\n\n*列表 4-1: BusyBox 网络*\n\n\
  忽略标准的环回设备，我们看到一个 IP 地址为 `10.85.0.4` 的网络设备。这与主机的 IP 地址 `192.168.61.11` 完全不对应；它处于完全不同的网络上。由于我们的容器在一个独立的网络上，我们可能预计无法从容器内部\
  \ ping 通宿主机系统，但它是可以的，如列表 4-2 所示。\n\n```\n/ # ping -c 1 192.168.61.11\n\nPING 192.168.61.11\
  \ (192.168.61.11): 56 data bytes\n\n64 bytes from 192.168.61.11: seq=0 ttl=64 time=7.471\
  \ ms\n\n--- 192.168.61.11 ping statistics ---\n\n1 packets transmitted, 1 packets\
  \ received, 0% packet loss\n\nround-trip min/avg/max = 7.471/7.471/7.471 ms\n```\n\
  \n*列表 4-2: BusyBox ping 测试*\n\n为了让流量从我们的容器传输到主机网络，路由表中必须有一条条目来实现这一点。如列表 4-3 所示，我们可以通过\
  \ `ip` 命令来验证这一点。\n\n```\n/ # ip route\n\ndefault via 10.85.0.1 dev eth0 \n\n10.85.0.0/16\
  \ dev eth0 scope link  src 10.85.0.4\n```\n\n*列表 4-3: BusyBox 路由*\n\n如预期的那样，有一个默认路由。当我们发送\
  \ ping 时，我们的 BusyBox 容器连接到 `10.85.0.1`，该节点有能力将 ping 继续发送，直到到达 `192.168.61.11`。\n\
  \n我们将让三个容器继续运行以便进一步探索，但让我们退出 BusyBox shell 回到主机：\n\n```\n/ # exit\n```\n\n从容器内部看到的网络视图解释了为什么我们的两个\
  \ NGINX 服务器都能监听 `80` 端口。正如之前提到的，特定接口的端口只能由一个进程监听，但显然，如果每个 NGINX 服务器都有独立的网络接口，就不会产生冲突。\n\
  \n### 网络命名空间 (Network Namespaces)\n\nCRI-O 使用 Linux 网络命名空间来创建这种隔离。我们在第 2 章中简要探讨了网络命名空间；在本章中，我们将更详细地查看它们。\n\
  \n首先，让我们使用 `lsns` 命令列出 CRI-O 为容器创建的网络命名空间：\n\n```\nroot@host01:/opt# lsns -t net\n\
  \n        NS TYPE NPROCS   PID USER    NETNSID NSFS                   COMMAND\n\n\
  4026531992 net     114     1 root unassigned                        /sbin/init\n\
  \n4026532196 net       4  5801 root          0 /run/netns/ab8be6e6... /pause\n\n\
  4026532272 net       4  5937 root          1 /run/netns/8ffe0394... /pause\n\n4026532334\
  \ net       2  6122 root          2 /run/netns/686d71d9... /pause\n```\n\n除了用于所有不在容器中的进程的根命名空间外，我们看到了三个网络命名空间，为每个\
  \ Pod 创建一个。当我们使用 crictl 使用 CRI-O 时，网络命名空间实际上属于 Pod。这里列出的 pause 进程是为了即使 Pod 内部的容器进出，命名空间也能继续存在。\n\
  \n#### 查看网络命名空间 (Inspecting Network Namespaces)\n\n为了了解网络命名空间的工作原理并对其进行操作，我们将使用\
  \ `ip netns` 命令列出网络命名空间：\n\n```\nroot@host01:/opt# ip netns list\n\n7c185da0-04e2-4321-b2eb-da18ceb5cf6\
  \ (id: 2)\n\nd26ca6c6-d524-4ae2-b9b7-5489c3db92ce (id: 1)\n\n38bbb724-3420-46f0-bb50-9a1509f0889\
  \ (id: 0)\n```\n\n此命令在不同的配置位置查找网络命名空间，因此只列出了三个容器命名空间。我们想要获取 BusyBox 容器的网络命名空间。它是列出的三个之一，我们可以猜是标记为\
  \ `(id: 2)` 的那个，因为它是我们最后创建的，但我们也可以使用 `crictl` 和 `jq` 来提取我们需要的信息：\n\n```bash\nroot@host01:/opt#\
  \ NETNS_PATH=$(crictl inspect $B1P_ID |\n  jq -r '.info.runtimeSpec.linux.namespaces[]|select(.type==\"\
  network\").path')\n```\n\n\n\n```\nroot@host01:/opt# ip netns exec $NETNS ip addr\n\
  \n1: lo: <LOOPBACK,UP,LOWER_UP> mtu 65536 qdisc noqueue ...\n\n    link/loopback\
  \ 00:00:00:00:00:00 brd 00:00:00:00:00:00\n\n    inet 127.0.0.1/8 scope host lo\n\
  \n        valid_lft forever preferred_lft forever\n\n    inet6 ::1/128 scope host\
  \ \n\n        valid_lft forever preferred_lft forever\n3: eth0@if7: <BROADCAST,MULTICAST,UP,LOWER_UP>\
  \ mtu 1500 qdisc noqueue ...\n\n    link/ether 9a:7c:73:2f:f7:1a brd ff:ff:ff:ff:ff:ff\
  \ link-netnsid 0\n\n    inet 10.85.0.4/16 brd 10.85.255.255 scope global eth0\n\n\
  \        valid_lft forever preferred_lft forever\n\n    inet6 fe80::987c:73ff:fe2f:f71a/64\
  \ scope link \n\n        valid_lft forever preferred_lft forever\n```\n\n我们在这里看到的网络设备和\
  \ IP 地址列表与我们在列表 4-1 中的 BusyBox 容器内运行命令时看到的一致。CRI-O 正在创建这些网络设备并将它们放入网络命名空间中（当我们查看第\
  \ 8 章 中的 Kubernetes 网络配置时，我们将看到 CRI-O 是如何配置以执行容器网络化的）。现在，让我们看看如何创建自己的设备和命名空间来实现网络隔离。这也将向我们展示当某些功能工作不正常时如何调试容器网络。\n\
  \n## 创建网络命名空间\n\n我们可以通过单个命令创建一个网络命名空间：\n\n```\nroot@host01:/opt# ip netns add myns\n\
  ```\n\n这个新命名空间会立即出现在列表中：\n\n```\nroot@host01:/opt# ip netns list\n\nmyns\n\n7c185da0-04e2-4321-b2eb-da18ceb5fcf6\
  \ (id: 2)\n\nd26ca6c6-d524-4ae2-b9b7-5489c3db92ce (id: 1)\n\n38bbb724-3420-46f0-bb50-9a150a9f0889\
  \ (id: 0)\n```\n\n这个命名空间目前还没有什么用；它有一个回环接口，但没有其他接口：\n\n```\nroot@host01:/opt# ip\
  \ netns exec myns ip addr\n\n1: lo: <LOOPBACK> mtu 65536 qdisc noop state DOWN group\
  \ default qlen 1000\n\n    link/loopback 00:00:00:00:00:00 brd 00:00:00:00:00:00\n\
  ```\n\n此外，即使是回环接口也是处于关闭（down）状态，因此无法使用。让我们快速修复一下它：\n\n```\nroot@host01:/opt# ip\
  \ netns exec myns ip link set dev lo up\n\nroot@host01:/opt# ip netns exec myns\
  \ ip addr\n\n1: lo: <LOOPBACK,UP,LOWER_UP> mtu 65536 qdisc noqueue ...\n\n    link/loopback\
  \ 00:00:00:00:00:00 brd 00:00:00:00:00:00\n\n    inet 127.0.0.1/8 scope host lo\n\
  \n       valid_lft forever preferred_lft forever\n\n    inet6 ::1/128 scope host\
  \ \n\n       valid_lft forever preferred_lft forever\n```\n\n回环接口现在已启动（up），并且拥有了典型的\
  \ 127.0.0.1 IP 地址。现在在这个网络命名空间中进行基础的回环 ping 将可以工作了：\n\n```\nroot@host01:/opt# ip\
  \ netns exec myns ping -c 1 127.0.0.1\n\nPING 127.0.0.1 (127.0.0.1) 56(84) bytes\
  \ of data.\n\n64 bytes from 127.0.0.1: icmp_seq=1 ttl=64 time=0.035 ms\n\n--- 127.0.0.1\
  \ ping statistics ---\n\n1 packets transmitted, 1 received, 0% packet loss, time\
  \ 0ms\n\nrtt min/avg/max/mdev = 0.035/0.035/0.035/0.000 ms\n```\n\n能够 ping 通回环网络接口是任何网络栈非常有用的第一个测试，因为它显示了发送和接收数据包的能力。因此，我们现在新的网络命名空间中拥有了一个基础工作的网络栈，但它仍然不是很有用，因为回环接口本身无法与系统上的任何其他设备通信。我们需要在这个网络命名空间中添加另一个网络设备，以建立与主机及其他网络的连接。\n\
  \n为了实现这一点，我们将创建一个虚拟以太网设备（`veth`）。你可以将 `veth` 想象成一根虚拟网线，像网线一样，它有两个端，一端进去，另一端出来。因此，使用了\
  \ `veth pair`（veth 对）这个术语。我们通过以下命令创建 veth 对：\n\n```\nroot@host01:/opt# ip link add\
  \ myveth-host type veth peer myveth-myns ns myns\n```\n\n该命令完成了三件事：\n1. 创建一个名为 `myveth-host`\
  \ 的 `veth` 设备。\n2. 创建一个名为 `myveth-myns` 的 `veth` 设备。\n3. 将设备 `myveth-myns` 放入 `myns`\
  \ 网络命名空间。\n\nveth 对的主机端出现在常规的网络设备列表中：\n\n```\nroot@host01:/opt# ip addr\n\n8: myveth-host@if2:\
  \ <BROADCAST,MULTICAST> mtu 1500 state DOWN\n\n    link/ether 7a:5d:86:00:d9\n```\n\
  \n此输出显示了 `myveth-host` 以及它连接到了 `myns` 网络命名空间中的一个设备。如果你运行该命令并查看主机网络设备列表，你会注意到连接到命名空间的额外\
  \ `veth` 设备是由 CRI-O 在部署 BusyBox 时创建的。同样，我们可以看到 `myns` 网络命名空间有一个接口：\n\n```\nroot@host01:/opt#\
  \ ip netns exec myns ip addr\n\n1: lo: <LOOPBACK,UP,LOWER_UP> mtu 65536 qdisc noqueue\
  \ ...\n\n    link/loopback 00:00:00:00:00:00 brd 00:00:00:00:00:00\n\n    inet 127.0.0.1/8\
  \ scope host lo\n\n       valid_lft forever preferred_lft forever\n\n    inet6 ::1/128\
  \ scope host \n\n       valid_lft forever preferred_lft forever\n2: myveth-myns@if8:\
  \ <BROADCAST,MULTICAST> mtu 1500 state DOWN\n\n    link/ether 26:0f:64:a8:37:1f\n\
  ```\n\n像之前一样，这个接口处于关闭状态。在开始通信之前，我们需要启动 veth 对的双端。我们还需要为 `myveth-myns` 端分配一个 IP 地址以便能够通信：\n\
  \n```\nroot@host01:/opt# ip netns exec myns ip addr add 10.85.0.254/16 dev myveth-myns\n\
  root@host01:/opt# ip netns exec myns ip link set dev myveth-myns up\nroot@host01:/opt#\
  \ ip link dev myveth-host up\n```\n\n快速检查确认我们成功配置了 IP 地址并启动了网络：\n\n```\nroot@host01:/opt#\
  \ ip netns exec myns ip addr\n\n1: lo: <LOOPBACK,UP,LOWER_UP> mtu 65536 qdisc noqueue\
  \ ...\n\n    link/loopback 00:00:00:00:00:00 brd 00:00:00:00:00:00\n\n    inet 127.0.0.1/8\
  \ scope host lo\n\n       valid_lft forever preferred_lft forever\n\n    inet6 ::1/128\
  \ scope host \n\n       valid_lft forever preferred_lft forever\n2: myveth-myns@if8:\
  \ <BROADCAST,MULTICAST,UP,LOWER_UP> ... state UP ...\n\n    link/ether 26:0f:64:a8:37:1f\
  \ brd ff:ff:ff:ff:ff:ff link-netnsid 0\n\n    inet 10.85.0.254/16 scope global myveth-myns\n\
  \n       valid_lft forever preferred_lft forever\n\n    inet6 fe80::240f:64ff:fea8:371f/64\
  \ scope link \n\n       valid_lft forever preferred_lft forever\n```\n\n除了回环接口外，我们现在看到了\
  \ IP 地址为 10.85.0.254 的额外接口。尝试 ping 这个新的 IP 地址会发生什么？结果显示我们可以 ping 通，但只能在网络命名空间内部：\n\
  \n```\n root@host01:/opt# ip netns exec myns ping -c 1 10.85.0.254\n\n   PING 10.85.0.254\
  \ (10.85.0.254) 56(84) bytes of data.\n\n   64 bytes from 10.85.0.254: icmp_seq=1\
  \ ttl=64 time=0.030 ms\n\n   --- 10.85.0.254 ping statistics ---\n\n➊ 1 packets\
  \ transmitted, 1 received, 0% packet loss, time 0ms\n\n   rtt min/avg/max/mdev =\
  \ 0.030/0.030/0.030/0.000 ms\n\n   root@host01:/opt# ping -c 1 10.85.0.254\n\n \
  \  PING 10.85.0.254 (10.85.0.254) 56(84) bytes of data.\n\n   64 bytes from 10.85.0.1\
  \ icmp_seq=1 Destination Host Unreachable\n\n   --- 10.85.0.254 ping statistics\
  \ ---\n\n➋ 1 packets transmitted, 0 received, +1 errors, 100% packet loss, time\
  \ 0ms\n```\n\n第一个 ping 命令使用 `ip netns exec` 以便在网络命名空间内运行，显示了成功的响应 ➊。然而，第二个 ping\
  \ 命令没有使用 `ip netns exec` 显示没有接收到数据包 ➋。问题在于，虽然我们成功在网络命名空间内部创建了网络接口，并在主机网络上有了 veth\
  \ 对的另一端，但我们还没有在主机上连接对应的网络设备，因此没有主机网络接口可以与命名空间内的接口进行通信。\n\n\n\n\n与此同时，当我们从列表 4-2\
  \ 中的 BusyBox 容器运行 ping 测试时，我们能够毫无顺利地 ping 通主机。显然，`CRI-O` 在创建我们的容器时一定为我们做了更多的配置。让我们在下一节中探索这些内容。\n\
  \n### 桥接接口\n\n`veth` 对的主机端目前没有连接到任何设备，因此我们的网络空间还无法与外部通信这并不意外。为了修复这个问题，让我们看看 `CRI-O`\
  \ 创建的 `veth` 对之一：\n\n```\nroot@host01:/opt# ip addr\n\n...\n\n7: veth062abfa6@if3:\
  \ <BROADCAST,MULTICAST,UP,LOWER_UP> ... master cni0 ...\n\n    link/ether fe:6b:21:9b:d0:d2\
  \ brd ff:ff:ff:ff:ff:ff link-netns ...\n\n    inet6 fe80::fc6b:21ff:fe9b:d0d2/64\
  \ scope link \n\n       valid_lft forever preferred_lft forever\n\n...\n```\n\n\
  与我们创建的接口不同，此接口指定了 `master cni0`，这表明它属于一个`network bridge`（网络桥接）。网桥的存在是为了连接多个接口。你可以将其\
  \ think 作一个以太网交换机，因为它根据接口的介质访问控制（MAC）地址将流量从一个网络接口路由到另一个接口。\n\n我们可以在主机的网络设备列表中看到桥\
  \ `cni0`：\n\n```\nroot@host01:/opt# ip addr\n\n...\n\n4: cni0: <BROADCAST,MULTICAST,UP,LOWER_UP>\
  \ mtu 1500 qdisc noqueue ...\n\n    link/ether 8e:0c:1c:7d:94:75 brd ff:ff:ff:ff:ff:ff\n\
  \n    inet 10.85.0.1/16 brd 10.85.255.255 scope global cni0\n\n       valid_lft\
  \ forever preferred_lft forever\n\n    inet6 fe80::8c0c:1cff:fe7d:9475/64 scope\
  \ link \n\n       valid_lft forever preferred_lft forever\n\n...\n```\n\n网桥比典型的以太网交换机更智能，因为它提供了一些防火墙和路由能力。它还有一个\
  \ IP 地址 `10.85.0.1`。这个 IP 地址与我们在列表 4-3 中看到的 BusyBox 容器的默认路由相同，因此我们开始解开 BusyBox 容器如何与自身网络之外的主机通信的谜团。\n\
  \n#### 向网桥添加接口\n\n为了检查网桥并向其添加设备，我们将使用 `brctl` 命令。让我们先检查网桥：\n\n```\nroot@host01:/opt#\
  \ brctl show\n\nbridge name     bridge id               STP enabled     interfaces\n\
  \ncni0            8000.8e0c1c7d9475       no              veth062abfa6\n\n     \
  \                                                   veth43ab68cd\n\n           \
  \                                             vetha251c619\n```\n\n网桥 `cni0` 上有三个接口，对应于我们运行的三个容器（两个\
  \ NGINX 和一个 BusyBox）的 `veth` 对的主机端。让我们利用这个现有的网桥为我们创建的网络空间设置网络连接性：\n\n```\nroot@host01:/opt#\
  \ brctl addif cni0 myveth-host\n\nroot@host01:/opt# brctl show\n\nbridge name  \
  \   bridge id               STP enabled     interfaces\n\ncni0            8000.8e0c1c7d9475\
  \       no              myveth-host\n\n                                        \
  \                veth062abfa6\n\n                                              \
  \          veth43ab68cd\n\n                                                    \
  \    vetha251c619\n```\n\n我们的 `veth` 对的主机端现在已连接到网桥，这意味着我们现在可以从主机 ping 到网络空间：\n\n\
  ```\n root@host01:/opt# ping -c 1 10.85.0.254\n\n   PING 10.85.0.254 (10.85.0.254)\
  \ 56(84) bytes of data.\n\n   64 bytes from 10.85.0.254: icmp_seq=1 ttl=64 time=0.194\
  \ ms\n\n   --- 10.85.0.254 ping statistics ---\n\n➊ 1 packets transmitted, 1 received,\
  \ 0% packet loss, time 0ms\n\n   rtt min/avg/max/mdev = 0.194/0.194/0.194/0.000\
  \ ms\n```\n\n接收到数据包的事实表明我们建立了一个工作的连接。我们应该对它的成功感到很高兴，但如果我们想真正理解这一点，就不能满足于说我们可以“从主机”\
  \ ping 这个接口。我们需要更具体地说明流量究竟是如何流动的。\n\n#### 追踪流量\n\n让我们实际追踪这些流量，看看在运行 `ping` 命令时发生了什么。我们将使用\
  \ `tcpdump` 来打印流量。首先，在后台启动一个 `ping` 命令：\n\n```\nroot@host01:/opt# ping 10.85.0.254\
  \ >/dev/null 2>&1 &\n```\n\n我们将输出发送到 `/dev/null` 以弄乱我们的会话。现在，让 `tcpdump` 查看流量：\n\
  \n```\nroot@host01:/opt# timeout 1s tcpdump -i any -n icmp\ntcpdump: verbose suppressed,\
  \ use -v or -vv for full decode\nlistening on any, link-type LINUX_SLL (cooked),\
  \ ...\n17:37:33.20483 IP 10.85.0.1 > 10.85.0.254: ICMP request, ...\n17:37:33.20494\
  \ IP 10.85.0.1 > 10.85.0.254: ICMP request, ...\n17:37:33.20496 IP 10.85.0.254 >\
  \ 10.85.0.1: ICMP reply, ...\n17:37:33.20496 IP 10.85.0.254 > 10.85.0.1: ICMP reply,\
  \ ...\n4 packets captured\n4 packets received\n0 packets dropped by kernel\nroot@host01:/opt#\
  \ killall ping\n```\n\n我们使用 `timeout` 防止 `tcpdump` 无限运行，随后我们使用 `killall` 停止后台运行的\
  \ `ping` 命令。输出显示 ping 源于 IP 地址为 `10.85.0.1` 的桥接口。这是由于主机的路由表：\n\n```\nroot@host01:/opt#\
  \ ip route\n\n...\n10.85.0.0/16 dev cni0 proto kernel scope src 10.85.0.1\n192.168.61.0/24\
  \ dev enp0s8 proto kernel scope src 192.168.11\n```\n\n当 `CRI-O` 创建桥并配置其 IP 地址时，它还设置了一条路由，使得所有指向\
  \ `10.85.0.0/16` 网络（即从 `10.85.0.0` 到 `10.85.255.255` 的所有流量）都将使用 `cni0`。这对于 `ping`\
  \ 命令知道将数据包发送到哪里已经足够，剩下的部分由网桥处理。\n\nping 源于 `10.85.0.1` 桥接口而非 `192.168.61.11` 主机接口这实际上产生了巨大差异，如果我们反过来运行\
  \ ping 就能看到。让我们尝试从空间内 ping 主机网络：\n\n```\nroot@host01:/opt# ip netns exec myns ping\
  \ -c 1 192.168.61.11\nping: connect: Network is unreachable\n```\n\n这里的问题是网络空间中的接口如何到达主机网络。网可用并且可以将流量路由到主机网络，但我们还没有配置使用它的必要路由。现在来这样做：\n\
  \n```\nroot@host01:/opt# ip netns exec myns ip route add default via 10.85.0.1\n\
  ```\n\n现在 ping 可以工作了：\n\n```\nroot@host01:/opt# ip netns exec myns ping -c 1 192.168.61.11\n\
  \nPING 192.168.61.11 (192.168.61.11) 56(84) bytes of data.\n\n64 bytes from 192.168.61.11:\
  \ icmp_seq=1 ttl=64 time=0.097 ms\n\n--- 192.168.61.11 ping statistics ---\n\n1\
  \ packets transmitted, 1 received, 0% packet loss, time 0ms\n\nrtt min/avg/max/mdev\
  \ = 0.097/0.097/0.097/0.000 ms\n```\n\n这说明了在调试网络问题时需要记住的一个重要规则：对于网络流量到底在发送还是接收，很容易得出结论。使用追踪来查看流量的真实状况通常没有替代方案。\n\
  \n### 主机上的 IP 地址\n\n这种方法不是实现从主机到网络空间连接的唯一方法。我们也可以直接为 `veth` 对的主机端分配 IP 地址。然而，尽管这会启用从主机到我们网络空间的通信，但它无法提供多个网络空间相互通信的方法。像\
  \ `CRI-O` 那样使用桥接接口，可以实现主机上所有容器的互连，使它们看起来都处于同一个网络中。\n\n这也解释了为什么我们没有为 `veth` 对的主机端分配\
  \ IP 地址。当处理网桥时，只有网桥接口会获得 IP 地址。添加到网桥的接口不会。\n\n\n\n\n通过上一次更改，似乎我们已经匹配了容器的网络配置，但我们仍然无法与\
  \ `host01` 之外的更广泛的网络通信。我们可以通过从我们的网络命名空间 ping `host02` 来演示这一点，`host02` 与 `host01`\
  \ 处于同一个内部网络，且 IP 地址为 `192.168.61.12`。如果我们尝试从 BusyBox 容器中进行 ping，它是通的：\n\n```\nroot@host01:/opt#\
  \ crictl exec $B1C_ID ping -c 1 192.168.61.12\n\nPING 192.168.61.12 (192.168.61.12):\
  \ 56 data bytes\n\n64 bytes from 192.168.61.12: seq=0 ttl=63 time=0.816 ms\n\n---\
  \ 192.168.61.12 ping statistics ---\n\n1 packets transmitted, 1 packets received,\
  \ 0% packet loss\n\nround-trip min/avg/max = 0.816/0.816/0.816 ms\n```\n\nping 输出报告收到了一个数据包。然而，如果我们尝试使用我们创建的网络命名空间执行相同的命令，它是不起的：\n\
  \n```\nroot@host01:/opt# ip netns exec myns ping -c 1 192.168.61.12\n\nPING 192.168.61.12\
  \ (192.168.61.12) 56(84) bytes of data.\n\n--- 192.168.61.12 ping statistics ---\n\
  \n1 packets transmitted, 0 received, 100% packet loss, time 0ms\n```\n\n该命令报告未收到任何数据包。\n\
  \n实际上，我们应该对 BusyBox 容器的 ping 成功感到惊讶。毕竟，`host02` 并不认识 BusyBox 容器、`cni0` 桥接接口，或者容器所在的\
  \ `10.85.0.0/16` 网络一无不知。`host02` 怎么可能与我们的 BusyBox 容器交换 ping 包呢？为了理解这一点，我们需要查看网络伪装（Masquerade）。\n\
  \n### 伪装 (Masquerade)\n\n`Masquerade` 也称为网络地址转换 (NAT)，在网络中每天都在使用。例如，大多数家庭互联网连接只提供一个可以从互联网访问的单一\
  \ IP 地址，但家庭网络内的许多设备都需要连接互联网。路由器的工作就是让该网络的所有流量看起来都源自单一 IP 地址。它是通过重写出站流量的 `source`\
  \ IP 地址，同时跟踪所有出站连接，以便它可以重写任何响应的 `destination` IP 地址来实现的。\n\n**注意**\n我们在这里讨论的 NAT\
  \ 类型技术上被称为源 NAT (SNAT)。不要纠结于名称，但为了使其正常工作，任何响应包必须重写目标。在这种情况下，`Source` 一词意味着在新连接建立时源地址被重写。伪装听起来就像是我们连接在\
  \ `10.85.0.0/16` 网络中运行的容器到主机网络 `192.168.61.0/24` 所需要的，而且事实上就是这样工作的。当我们从 BusyBox\
  \ 容器发送 ping 时，源 IP 地址被重写，使得 ping 看起来来自 `host01` IP `192.168.61.11`。当 `host02` 响应时，它将回复发送到\
  \ `192.168.61.11`，但目标被重写为发送到 BusyBox 容器。让我们跟踪整个 ping 流量：\n\n```\nroot@host01:/opt#\
  \ crictl exec $B1C_ID ping 192.168.61.12 >/dev/null 2>&1 &\nroot@host01:/opt# timeout\
  \ 1s tcpdump -i any -n icmp\ntcpdump: verbose output suppressed, use -vv for decode\n\
  listening on any, link-type LINUX_LL (cooked)...\n18:53:44.310789 IP 10.85.0.4 >\
  \ 192.168.61.12: ICMP request, id 12, seq 17...\n18:53:44.310789 IP 10.85.0.4 >\
  \ 192.168.61.12: ICMP request, id 12, seq 17...\n18:53:44.310876 IP 192.168.61.11\
  \ > 192.168.61.12: ICMP request, id 12, seq 17...\n18:53:44.311619 IP 192.168.61.12\
  \ > 192.168.61.11: ICMP reply, id 12, seq 17...\n18:53:44.311648 IP 192.168.61.12\
  \ > 10.85.0.4: ICMP reply, id 12, seq 17...\n18:53:44.311656 IP 192.168.61.12 >\
  \ 10.85.0.4: ICMP reply, id 12, seq 17...\n6 packets captured\n6 packets received\
  \ by filter\n0 packets dropped by kernel\nroot@host01:/opt# killall ping\n```\n\n\
  当 ping 来自 BusyBox 容器内部时，它的源 IP 地址为 `10.85.0.4`。这个地址被重写了，使得 ping 看起来来自主机 IP `192.168.61.11`。当然，`host02`\
  \ 如何响应来自该地址的 ping，因此 ping 得到了回答。此时，伪装的另一半起作用，目标被重写为 `10.85.0.4`。结果是 BusyBox 容器能够向单独主机发送包并获取回复。完成网络命名空间的设置，我们需要类似的规则来伪装来自\
  \ `10.85.0.254` 的流量。我们可以通过使用 `iptables` 查看 CRI-O 配置容器时创建的规则来开始：\n\n```\nroot@host01:/opt#\
  \ iptables -t nat -n -L\n...\n\nChain POSTROUTING (policy ACCEPT)\ntarget      \
  \                  prot opt source    destination \nCNI-f82910b3a7e28baf6edc0d3\
  \  all  --  10.85.0.2    ...\nCNI-7f8aa3d8a4f621b18614f43  all  --  10.85.0.3  \
  \  ...\nCNI-48ad69d30fe932fdaea71d2  all  --  10.85.0.4    ...\n\nChain CNI-48ad69d30fe932fdaea71d2\
  \ (1 references)\ntarget     prot opt source               destination         \n\
  ACCEPT     all  --  anywhere             10.85.0.0/16 ...\nMASQUERADE all  --  anywhere\
  \             !224.0.0/4 ...\n...\n```\n\n伪装在连接建立时开始；在这种情况下，当流量的源地址位于 `10.85.0.0/16`\
  \ 网络时。由于这个原因，使用了 `POSTROUTING` 链，因为它可以看到所有出站流量。`POSTROUTING` 链中每个容器都有一个规则；每个规则都会调用该容器的\
  \ CNI 链。\n\n为了简便，只显示了三个 CNI 链中的一个。另外两个是相同的。CNI 链首先对所有本地容器网络的流量执行 `ACCEPT`，因此这些流量不会被伪装。然后它为所有流量（`224.0.0.0/4`\
  \ 之外）设置伪装，这在该配置中缺失。该配置缺失的是对 `10.85.0.254` 的匹配设置，这是我们分配给命名空间接口的 IP 地址。让我们添加它。首先，在\
  \ `nat` 表中创建一个链：\n\n```\nroot@host01:/opt# iptables -t nat -N chain-myns\n```\n\n\
  接下来，添加规则以接受所有针对本地网络的流量：\n\n```\nroot@host01:/opt# iptables -t nat -A chain-myns\
  \ -d 10.85.0.0/16 -j ACCEPT\n```\n\n现在，所有剩余流量（多播除外）都应该被伪装：\n\n```\nroot@host01:/opt#\
  \ iptables -t nat -A chain-myns !d 224.0.0/4 -j MASQUERADE\n```\n\n最后，告诉 `iptables`\
  \ 为来自 `10.85.0.254` 的流量使用此链：\n\n```\nroot@host01:/opt# iptables -t nat -A POSTROUTING\
  \ -s 10.85.0.254 -j chain-myns\n```\n\n我们可以通过再次列出规则来验证我们的操作是否正确：\n\n```\nroot@host01:/opt#\
  \ iptables -t nat -n -L\n\nChain POSTROUTING (policy ACCEPT)\ntarget           \
  \           prot opt source    destination\nchain-myns  all  --  10.85.0.254   \
  \       anywhere\n\nChain chain-myns (1 references)\ntarget     prot opt source\
  \               destination         \nACCEPT     all  --  anywhere             10.85.0.0/16\
  \        \nMASQUERADE all  --  anywhere             !224.0.0.0/4\n```\n\n看起来我们有了所需的配置，因为这种配置与\
  \ BusyBox 容器虚拟网络设备的配置方式一致。为了确保无，让我们再次 ping `host02`：\n\n```\nroot@host01:/opt# ip\
  \ netns exec myns ping -c 1 192.168.61.12\n\nPING 192.168.61.12 (192.168.61.12)\
  \ 56(84) bytes of data.\n\n64 bytes from 192.168.61.12: icmp_seq=1 ttl=63 time=0.843\
  \ ms\n\n--- 192.168.61.12 ping statistics ---\n\n1 packets transmitted, 1 received,\
  \ 0% packet loss, time 0ms\n\nrtt min/avg/max/mdev = 0.843/0.843/0.843/0.000 ms\n\
  ```\n\n成功！我们完全复制了 CRI-O 为我们的容器提供的网络隔离和连接性。\n\n### 结语\n\n\n\n\n容器网络在运行容器时看起来似乎非常简单。每个容器都拥有自己的一套网络设备，避免了对端口冲突的担心，并减少了一个容器对另一个容器的影响。然而，正如我们在本章中所看到的，这种“简单”的网络隔离需要一些复杂的配置，才能不仅实现隔离，还能实现与其他容器以及其他网络的连通性。在第二部分中，在我们正式介绍\
  \ Kubernetes 之后，我们将回到容器网络，并展示当我们需要连接运行在不同主机上的容器以及在多个容器实例之间进行负载均衡时，复杂性将如何增加的。\n\n\
  目前，在转向 Kubernetes 之前，我们还有一个关于容器的关键主题需要处理。我们需要理解容器存储是如何工作原理，包括在启动新容器时作为基础文件系统的容器镜像，以及运行中容器使用的临时存储。在下一章中，我们将研究容器存储如何使应用程序部署变得更容易，以及如何使用分层文件系统来节省存储并提高效率。\n\
  \n# 5 容器镜像和运行时层\n\n![image](img/common01.jpg)\n\n要运行一个进程，我们需要存储。容器化软件的巨大优势之一是能够将应用程序及其依赖项打包在一起交付。因此，我们需要存储程序的可执行文件以及它使用的任何共享库。我们还需要存储配置文件、日志以及由程序管理的任何数据。所有这些存储都必须隔离的，以便容器不会干扰宿主机系统或其他容器。总之，这代表了对存储的巨大需求，这意味着容器引擎必须提供一些独特特性才能在磁盘空间和带宽的使用上做到高效。在本章中，我们将探索使用分层文件系统如何让容器镜像下载更高效，让容器启动更高效。\n\
  \n## 文件系统隔离\n\n在第 2 章中，我们看到了如何使用 `chroot` 环境创建一个独立的、隔离的文件系统部分，其中只包含我们运行进程所需的二进制文件和库。即使是运行一个简单的\
  \ `ls` 命令，我们也需要二进制文件和几个库。功能更全的容器（例如运行 NGINX Web 服务器的容器）需要得多——一套 Linux 发行版的完整文件集。\n\
  \n在 `chroot` 示例中，我们在准备使用它时从主机系统构建了隔离的文件系统。这种方法对于容器来说是不行的。相反，隔离的文件系统被封装在`container\
  \ image`（容器镜像）中，这是一个准备即用的包，包含了所有文件和元数据，例如环境变量和默认可执行文件。\n\n### 容器镜像内容\n\n让我们快速查看\
  \ NGINX 容器镜像的内部。在本章中，我们将使用 `Docker` 命令，因为它仍然是构建容器镜像最常用的工具。\n\n**注意**\n\n本书的示例仓库位于\
  \ [`github.com/book-of-kubernetes/examples`](https://github.com/book-of-kubernetes/examples)。设置详情请参阅第\
  \ xx 页](#ch00.xhtml_ch00lev1sec2)的“运行示例”。\n\n在本文章的示例中，在 *host01* 上运行以下命令来下载镜像：\n\
  \n```\nroot@host01:~# docker pull nginx\n\nUsing default tag: latest\n\nlatest:\
  \ Pulling from library/nginx\n\n...\n\nStatus: Downloaded newer image for nginx:latest\n\
  \ndocker.io/library/nginx:latest\n```\n\n`docker pull` 命令从`image registry`（镜像仓库）下载镜像。镜像仓库是一个实现用于下载和发布容器镜像的\
  \ API 的 Web 服务器。我们可以通过 `docker images` 列出镜像来查看我们下载的镜像：\n\n```\nroot@host01:~# docker\
  \ images\n\nREPOSITORY   TAG       IMAGE ID       CREATED       SIZE\n\nnginx  \
  \      latest    f0b8a9a54136   7 days ago    133MB\n```\n\n该镜像大小为 133MB，并有一个唯一的标识符\
  \ `f0b8a9a54136`。（你的标识符会不同，因为每天都会构建新的 NGINX 容器镜像。）镜像不仅包含 NGINX 可执行文件和所需的库，还包含基于\
  \ Debian 的 Linux 发行版。我们在第 1 章中简要见过，当时我们在 Ubuntu 主机和内核上演示了 Rocky Linux 容器，但让我们更详细地观察它。从运行\
  \ NGINX 容器开始：\n\n```\nroot@host01:~# docker run --name nginx -d nginx\n\n516d13e912a55cfc6f73f0dd473661d6b7d3b868d5a07a2bc7253971015b6799\n\
  ```\n\n`--name` 标志为容器提供了一个友好的名称，我们可以将其用于后续命令，而 `-d` 标志将其发送到后台。\n\n现在，让我们探索运行中容器的文件系统：\n\
  \n```\nroot@host01:~# docker exec -ti nginx /bin/bash\n\nroot@516d13e912a5:/#\n\
  ```\n\n从这里，我们可以看到 NGINX 工作所需的各种库：\n\n```\nroot@516d13e912a5:/# ldd $(which nginx)\n\
  \n        linux-vdso.so.1 (0x00007ffe2a1fa000)\n\n...\n\n        libc.so.6 => /lib/x86_64-linux-gnu/libc.so.6\
  \ (0x00007ffe2a1fa000)\n\n        /lib/x86_64-linux-gnu/ld-linux.so.2 (0x00007ffe2a1fa000)\n\
  ```\n\n`docker pull` 命令从`image registry` 下载镜像。镜像仓库是一个实现用于下载和发布容器镜像的 API 的 Web 服务器。我们可以通过\
  \ `docker images` 列出镜像来查看下载的镜像。\n\n### 镜像版本和层\n\n快速下载预包文件系统来运行进程只是容器镜像的优势之一。另一个优势是为镜像的不同版本标记标签以允许快速升级。让我们通过拉取并运行两个不同版本的\
  \ Redis（一种流行的内存键值数据库）来探索这一点：\n\n\n\n```\nroot@host01:~# docker pull redis:6.0.13-alpine\n\
  \n   6.0.13-alpine: Pulling from library/redis\n\n➊ 540db60ca938: Pull complete\
  \ \n\n   29712d301e8c: Pull complete \n\n   8173c12df40f: Pull complete \n\n   ...\n\
  \n   docker.io/library/redis:6.0.13-alpine\n\n   root@host01:~# docker pull redis:6.2.3-alpine\n\
  \n   6.2.3-alpine: Pulling from library/redis\n\n➋ 540db60ca938: Already exists\
  \ \n\n   29712d301e8c: Already exists \n\n   8173c12df40f: Already exists \n\n \
  \  ...\n\n   docker.io/library/redis:6.2.3-alpine\n```\n\n冒号后面的数据是 `image tag`（镜像标签），用作版本标识符。此前，当我们省略它时，Docker\
  \ 会默认使用 `latest`，这和其他任何标签一样，但根据惯例，它被指代最新发布的镜像。通过指定版本，我们可以确保即使发布了更新版本的 Redis，我们也将继续运行相同的版本，直到我们准备好升级为止。标签可以包含任何字符，在连字符后添加额外信息是常见的做法。在这种情况下，标签末尾的\
  \ `-alpine` 表示此镜像基于 Alpine Linux，Alpine Linux 是一种轻量级的 Linux 发行版，因其体积较小而在制作容器镜像时非常受欢迎。\n\
  \n另一个值得注意的有趣点是，当我们下载第二个版本的 Redis 时，部分内容 ➋ 被标记为 `Already exists`（已存在）。查看第一次下载 Redis\
  \ 的记录，我们可以发现那里也存在相同的唯一标识符 ➊。这是因为容器镜像是由多个层（layers）组成的，而这些标识符唯一地描述了某一个层。如果我们已经下载的某个层被另一个镜像使用，我们就不需要再次下载它，从而节省了下载时间。此外，每个层在磁盘上只需要存储一次，从而节省了磁盘空间。\n\
  \n现在我们下载了两个不同版本的 Redis：\n\n```\nroot@host01:~# docker images | grep redis\n\nredis\
  \        6.0.13-alpine   a556c77d3dce   2 weeks ago   31.3MB\n\nredis        6.2.3-alpine\
  \    efb4fa30f1cf   2 weeks ago   32.3MB\n```\n\n尽管 Docker 报告每个镜像的大小约为 30MB，但那是所有层的总和，并没有考虑到由于共享层带来的存储空间节省。磁盘上的实际存储空间更少，正如通过检查\
  \ Docker 对磁盘空间的使用情况所示：\n\n```\nroot@host01:~# docker system df -v\n\nImages space\
  \ usage:\n\nREPOSITORY TAG           ... SIZE      SHARED SIZE   UNIQUE SIZE ...\n\
  \nredis      6.0.13-alpine ... 31.33MB   6.905MB       24.42MB     ...\n\nredis\
  \      6.2.3-alpine  ... 32.31MB   6.905MB       25.4MB      ...\n```\n\n这两个 Redis\
  \ 镜像共享了几乎 7MB 的基础层。\n\n这两个版本的 Redis 可以分别运行：\n\n```\nroot@host01:~# docker run -d\
  \ --name redis1 redis:6.0.13-alpine\n\n66dbf56ec0e8db24ca78afc07c68b7d0699d68b4749e0c03310857cfce926366\n\
  \nroot@host01:~# docker run -d --name redis2 redis:6.2.3-alpine\n```\n\n\n\n\n此镜像的唯一标识符与列表\
  \ 5-1 末处的输出匹配。该镜像显示为 133MB，是因为它包含了 `NGINX` 镜像的所有层，外加上我们添加的新型较小 HTML 文件。与之前一样，共享层只存储一次，因此构建此镜像所需的额外存储空间非常小。\n\
  \n**注意**\n\n当你亲自尝试此示例时，为你的“hello”镜像显示的唯一标识符将会有不同，尽管 `Dockerfile` 中用于 HTML 文件的内容是相同的。每一层的标识符不仅取决于该层的文件内容，还取决于其上方层的标识符。因此，如果两个镜像具有相同的标识符，我们可以确信它们的内容完全相同，即使它们是分开构建的。\n\
  \n我们可以像运行任何其他镜像一样运行此新镜像的容器：\n\n```\nroot@host01:/opt/hello# docker run -d -p 8080:80\
  \ hello\n\n83a23cf2921bb37474bfcefb0da45f9953940febfefd01ebadf35405d88c4396\n\n\
  root@host01:/opt/hello# curl http://localhost:8080/\n\n<html><body><h1>Hello World!</h1></body></html>\n\
  ```\n\n如第 1 章所示，`-p` 标志将主机端口转发到容器中，即使它运行在独立的网络命名空间中，也能从主机访问 `NGINX` 服务器。然后我们可以使用\
  \ `curl` 查看容器是否包含了我们提供的内容。\n\n### 标记与发布镜像\n\n镜像已经准备好在本地运行，但我们还没有准备好将其发布到仓库。要发布到仓库，我们需要给它一个包含仓库位置完整主机和路径的名称，以确保我们在引用镜像时获取的是我们想要的内容。\n\
  \n为了演示，让我们从不同的仓库拉取多个 `BusyBox` 镜像。我们将从来自 `quay.io`（另一个容器镜像仓库）的 `BusyBox` 镜像开始：\n\
  \n```\nroot@host01:/opt/hello# docker pull quay.io/quay/busybox\n\n...\n\nquay.io/quay/busybox:latest\n\
  ```\n\n此镜像名称同时指定了主机 `quay.io` 和镜像在该主机内的位置 `quay/busybox`。与之前一样，因为我们没有指定版本，所以使用 `latest`\
  \ 作为默认。我们能够拉取名为 `latest` 的版本，是因为有人显式地向此仓库发布了镜像的 `latest` 版本。\n\n使用此命令得到的 `BusyBox`\
  \ 镜像与我们只拉取 `busybox` 得到的镜像不同：\n\n```\nroot@host01:/opt/hello# docker pull busybox\n\
  \n...\n\ndocker.io/library/busybox:latest\n\nroot@host01:/opt/hello# docker images\
  \ | grep busybox\n\nbusybox                latest          d3cd072556c2   3 days\
  \ ago       1.24MB\n\nquay.io/quay/busybox   latest          e3121c769e39   8 months\
  \ ago     1.22MB\n```\n\n当我们使用普通名称 `busybox` 时，Docker 默认从 `docker.io/library` 拉取镜像。该仓库被称为\
  \ `Docker Hub`，你可以在 `[`hub.docker.com`](https://hub.docker.com)` 浏览它。\n\n同样，当我们使用普通名称\
  \ `hello` 构建镜像时，Docker 认为它属于 `docker.io/library`。该路径用于官方 Docker 镜像，而且当然，我们没有权利在上面发布镜像。\n\
  \n本章的自动化设置包含了运行本地容器镜像仓库，这意味着如果我们正确命名了镜像，就可以将此镜像发布到该本地仓库：\n\n```\nroot@host01:/opt/hello#\
  \ docker tag hello registry.local/hello\n\nroot@host01:/opt/hello# docker images\
  \ | grep hello\n\nhello                  latest          e9ca31d590f9   52 minutes\
  \ ago   133MB\n\nregistry.local/hello   latest          e9ca31d590f9   52 minutes\
  \ ago   133MB\n```\n\n现在同一个镜像以两个不同的名称存在，这提供了按层存储镜像的方式的额外优势。为镜像添加一个额外的名称是非常廉价的。当然，我们在运行\
  \ `docker build` 时最初也可以使用完整名称，但在本地构建和使用镜像时，使用较短的名称更方便。\n\n现在我们已经正确命名了镜像，就可以使用 `docker\
  \ push` 来发布它：\n\n```\nroot@host01:/opt/hello# docker push registry.local/hello\n\
  \nUsing default tag: latest\n\nThe push refers to repository [registry.local/hello]\n\
  \n...\n```\n\n我们的本地仓库最初是空的，因此此命令上传了所有层，但如果我们以后推送任何包含某些相同层的镜像，它们将不会被重复上传。同样，如果我们从仓库中删除一个镜像标签，并不会删除层数据。\n\
  \n这种发布镜像的能力不仅限于我们自己构建的镜像。我们可以标记并推送刚刚从 Docker Hub 下载的 `BusyBox` 镜像：\n\n```\nroot@host01:/opt/hello#\
  \ docker tag busybox registry.local/busybox\n\nroot@host01:/opt/hello# docker push\
  \ registry.local/busybox\n\nUsing default tag: latest\n\nThe push refers to repository\
  \ [registry.local/busybox]\n\n...\n\nroot@host01:/opt/hello# cd\n```\n\n### 镜像与容器存储\n\
  \n如前所述，使用单独层构建运行容器所需的额外空间仅限于我们写入的内容。最后，所有的示例都展示了新容器启动有多快。所有这些特性都说明了为什么必须共享层。为了在构建镜像时充分利用这种分层方法，有助于其工作原理。\n\
  \n#### 叠加文件系统\n\n当我们运行容器时，我们看到的是一个合并了所有层的单一文件系统，并且可以进行更改。如果我们从同一个镜像运行多个容器，每个容器看到的都是独立的文件系统，因此一个容器的更改不会影响另一个。在每次启动容器时不需要复制整个文件系统是如何实现的？答案是叠加文件系统。\n\
  \n叠加文件系统有三个主要部分。`lower` 目录是基础层所在（可能有多个底层目录）。`upper` 目录是“叠加”层，而 `mount` 目录是统一文件系统可用的地方。挂载目录的列表反映了所有层的文件，按优先级排序。对\
  \ `mount` 目录进行的任何更改实际上都是通过将更改的文件从底层复制到上层并更新完成的——这一过程被称为写时复制。删除操作也会以元数据的形式写入上层，因此底层可以保持未被修改。这意味着多个用户可以共享底层而不产生冲突，因为它只被读取而不被写入。\n\
  \n叠加文件系统不仅对容器镜像和容器有用。它对于嵌入式系统（例如网络路由器）也有用，这类系统的只读文件系统写在固件中，使得设备每次重启时都能安全地恢复到已知状态。它对于虚拟机也有用，允许从同一个镜像启动多个虚拟机。\n\
  \n叠加文件系统由 Linux 内核模块提供，能够实现极高性能。我们可以轻松地创建一个叠加文件系统。第一步是创建必要的目录：\n\n```\nroot@host01:~#\
  \ mkdir /tmp/{lower,upper,work,mount}\n```\n\n\n\n\n`mkdir` 命令在 `/tmp` 中创建了四个独立的目录。我们已经讨论了\
  \ `lower` 目录、`upper` 目录和 `mount` 目录。`work` 目录是一个额外的空目录，overlay 文件系统使用它作为临时空间，以确保\
  \ `mount` 目录中的更改是原子的——也就是说，确保更改是一性出现的。\n\n让我们在 `lower` 和 `upper` 目录中放入一些内容：\n\n\
  ```\nroot@host01:~# echo \"hello1\" > /tmp/lower/hello1\nroot@host01:~# echo \"\
  hello2\" > /tmp/upper/hello2\n```\n\n接下来，我们只需要挂载 overlay 文件系统即可：\n\n```\nroot@host01:~#\
  \ mount -t overlay \\\n  -o rw,lowerdir=/tmp/lower,upperdir=/tmp/upper,workdir=/tmp/work\
  \ \\\n  overlay /tmp/mount\n```\n\n现在 `/tmp/mount` 目录包含了 `upper` 和 `lower` 目录合并后的内容：\n\
  \n```\nroot@host01:~# ls -l /tmp/mount\ntotal 8\n-rw-r--r-- 1 root root 7 May 24\
  \ 23:05 hello1\n-rw-r--r-- 1 root root 7 May 24 23:05 hello2\nroot@host01:/opt/hello#\
  \ cat /tmp/mount/hello1\nhello1\nroot@host01:/opt/hello# cat /tmp/mount/hello2\n\
  hello2\n```\n\n我们所做的任何更改都会显示在挂载位置，但实际上是在在 `upper` 目录中的：\n\n```\nroot@host01:~# echo\
  \ \"hello3\" > /tmp/mount/hello3\nroot@host01:~# ls -l /tmp/mount\ntotal 8\n-rw-r--r--\
  \ 1 root root 7 May 24 23:05 hello1\n-rw-r--r-- 1 root root 7 May 24 23:10 hello2\n\
  -rw-r--r-- 1 root root 7 May 24 23:09 hello3\nroot@host01:~# ls -l /tmp/lower\n\
  total 4\n-rw-r--r-- 1 root root 7 May 24 23:05 hello1\nroot@host01:~# ls -l /tmp/upper\n\
  total 8\n-rw-r--r-- 1 root root 7 May 24 23:10 hello2\n-rw-r--r-- 1 root root 7\
  \ May 24 23:09 hello3\n```\n\n此外，即使删除文件也不会影响 `lower` 目录：\n\n```\nroot@host01:~#\
  \ rm /tmp/mount/hello1\nroot@host01:~# ls -l /tmp/mount\ntotal 8\n-rw-r--r-- 1 root\
  \ root 7 May 24 23:10 hello2\n-rw-r--r-- 1 root root 7 May 24 23:09 hello3\nroot@host01:~#\
  \ ls -l /tmp/lower\ntotal 4\n-rw-r--r-- 1 root root 7 May 24 23:05 hello1\nroot@host01:~#\
  \ ls -l /tmp/upper\ntotal 8\n➊ c--------- 1 root root 0, 0 May 24 23:11 hello1\n\
  -rw-r--r-- 1 root root    7 May 24 23:10 hello2\n-rw-r--r-- 1 root root    7 May\
  \ 24 23:09 hello3\n```\n\n`upper` 目录列表中 `hello1` 列表旁边的 `c` ➊ 表示这是一个字符设备文件。它的目的是指示该文件在\
  \ `upper` 目录中已被删除。因此，尽管它仍然存在于 `lower` 目录中，但也不会出现在挂载的文件系统中。\n\n得益于这种方法，我们可以使用独立的\
  \ overlay 重用 `lower` 目录，就像我们可以从同一个镜像运行多个独立的容器一样：\n\n```\nroot@host01:~# mkdir /tmp/{upper2,work2,mount2}\n\
  root@host01:~# mount -t overlay \\\n  -o rw,lowerdir=/tmp/lower,upperdir=/tmp/upper2,workdir=/tmp/work2\
  \ \\\n  overlay /tmp/mount2\nroot@host01:~# ls -l /tmp/mount2\ntotal 4\n-rw-r--r--\
  \ 1 root root 7 May 24 23:05 hello1\n```\n\n不仅来自 `lower` 目录的“已删除”文件出现了，而且第一个 `upper`\
  \ 目录的内容都没有显示，因为它不是这个新 overlay 的一部分。\n\n#### 理解容器层\n\n有了关于 overlay 文件系统的这些信息，我们可以探索正在运行的\
  \ NGINX 容器的文件系统：\n\n```\nroot@host01:~# ROOT=$(docker inspect nginx \\\n  | jq -r\
  \ '.[0].GraphDriver.Data.MergedDir')\nroot@host01:~# echo $ROOT\n/var/lib/docker/overlay2/433751e2378f9b11.../merged\n\
  ```\n\n和之前一样，我们使用 `jq` 来选择我们需要的字段；在这种情况下，它是容器文件系统的 `merged` 目录路径。这个合并目录是 overlay\
  \ 文件系统的挂载点：\n\n```\nroot@host01:~# mount | grep $ROOT | tr [:,] '\\n'\noverlay on\
  \ /var/lib/docker/overlay2/433751e2378f9b11.../merged ...\nlowerdir=/var/lib/docker/overlay2/l/ERVEI5TCULK4PCNO2HSWB4MFDB\n\
  /var/lib/docker/overlay2/l/RQDO2PYQ3OKMKDY3DAYPAJTZHF\n/var/lib/docker/overlay2/l/LFSBVPYPODQJXDL5WQTI7ISYNC\n\
  /var/lib/docker/overlay2/l/TLZUYV2BFQNPFGU3AZFUHOH27V\n/var/lib/docker/overlay2/l/4M66FKSHDBNUWE7UAF2REQHSB2\n\
  /var/lib/docker/overlay2/l/LCTKPRHP6LG7KC7JQHETKIL6TZ\n/var/lib/docker/overlay2/l/JOCTKPRHP6LG7KC7JQHETKIL6TZ\n\
  ```\n\n\n\n为了演示 OCI 格式，让我们从 Docker 中提取一个 BusyBox 镜像，并使用 `Skopeo` 将其存储为 OCI 格式。`Skopeo`\
  \ 是一个旨在在仓库和格式之间迁移容器镜像的程序。第一步是提取镜像：\n\n```\nroot@host01:~# skopeo copy docker-daemon:busybox:latest\
  \ oci:busybox:latest\n\n...\n```\n\n该命令告诉 `Skopeo` 从 Docker 引擎的存储中获取镜像并以 OCI 格式写入。我们现在有了一个包含该镜像的\
  \ `busybox` 目录：\n\n```\nroot@host01:~# ls -l busybox\n\ntotal 12\n\ndrwxr-xr-x 3\
  \ root root 4096 May 24 23:59 blobs\n\n-rw-r--r-- 1 root root  247 May 24 23:59\
  \ index.json\n\n-rw-r--r-- 1 root root   31 May 24 23:59 oci-layout\n```\n\n`oci-layout`\
  \ 文件指定了该镜像使用的 OCI 版本：\n\n```\nroot@host01:~# jq . busybox/oci-layout\n\n{\n\n  \"\
  imageLayoutVersion\": \"1.0.0\"\n}\n```\n\n`index.json` 文件告诉我们关于镜像的信息：\n\n```\n\
  root@host01:~# jq . busybox/index.json\n\n{\n  \"schemaVersion\": 2,\n\n  \"manifests\"\
  : [\n    {\n      \"mediaType\": \"application/vnd.oci.image.manifest.v1+json\"\
  ,\n      \"digest\": \"sha256:9c3c5aeeaa7e1629871808339...\",\n      \"size\": 347,\n\
  \      \"annotations\": {\n        \"org.opencontainers.image.ref.name\": \"latest\"\
  \n      }\n    }\n  ]\n}\n```\n\n`manifests` 属性是一个数组，允许我们在单个 OCI 目录或包中存储多个镜像。实际的文件系统内容按层存储在\
  \ `blobs` 目录中，每个层都是一个独立的 `.tar` 文件，因此任何共享层都只存储一次。\n\n此 BusyBox 镜像只有一个层。要查看其内容，我们需要通过\
  \ `index.json` 和镜像清单（manifest）来找到其 `.tar` 文件的路径：\n\n```\nroot@host01:~# MANIFEST=$(jq\
  \ -r \\\n  .manifests[0].digest busybox/index.json | sed -e 's/sha256://')\nroot@host01:~#\
  \ LAYER=$(jq -r \\\n  .layers[0].digest busybox/blobs/sha256/$MANIFEST | sed -e\
  \ 's/sha256://')\nroot@host01:~# echo $LAYER\n197dfd3345530fd558a64f2a550e8af75a9cb812df5623daf0392aa39e0ce767\n\
  ```\n\n`blobs` 目录中的文件是根据文件内容计算出的 SHA-256 摘要值命名的。我们首先使用 `jq` 获取 BusyBox 镜像清单的摘要值，去掉开头的\
  \ `sha256:` 部分以获取清单文件的文件名。然后我们读取清单以找到第一个（也是唯一的）层。现在我们可以看到该层的内容了：\n\n```\nroot@host01:~#\
  \ tar tvf busybox/blobs/sha256/$LAYER\n\ndrwxr-xr-x 0/0               0 2021-05-17\
  \ 19:07 bin/\n-rwxr-xr-x 0/0         1149184 2021-05-17 19:07 bin/[\nhrwxr-xr-x\
  \ 0/0               0 2021-05-17 19:07 bin/[[ link to bin/[\n...\ndrwxr-xr-x 0/0\
  \               0 2021-05-17 19:07 dev/\ndrwxr-xr-x 0/0               0 2021-05-17\
  \ 19:07 etc/\n...\n```\n\n向 `tar` 命令传递 `tvf` 参数告诉它列出我们指定的文件的目录内容（在本例中是 BusyBox 镜像层）。该层包含一个完整的\
  \ Linux 文件系统，其中 BusyBox 作为大多数标准 Linux 命令的单一可执行文件。\n\n使用这个 `busybox` 目录，我们还可以打包容器镜像，将其移动到另一个系统，然后拉取到另一个容器引擎中。\n\
  \n### 总结\n\n当我们运行容器时，得到的是似乎是一个独立的、隔离的文件系统，我们可以按照需要对其修改。在底层，容器引擎正在使用叠加文件系统（overlay\
  \ filesystem）将多个容器镜像层和一个存储我们所做更改的可写目录合并在一起。使用叠加文件系统不仅让新容器的启动更快，而且意味着我们可以从同一个镜像运行多个容器，而无需等待文件复制完成，并且可以通过共享镜像层减少所需的磁盘空间。\n\
  \n现在我们已经查看了进程隔离、资源限制、网络隔离和容器存储，涵盖了容器的主要特性，这些特性使其在打包、分发、更新和运行应用程序组件方面极具价值。\n\n\n\n\
  \n# 硬件隔离\n集群必须运行在云环境和各种类型的常规服务器上，将容器与这些环境之间的差异隔离开来。\n\n用于描述这些设计参数的最佳术语是`cross-cutting\
  \ concern`交叉关注点，因为它们适用于我们可能需要部署的任何类型的容器化软件，甚至适用于 Kubernetes 基础设施本身。这些参数与我们在第 1 章中看到的容器编排需求共同工作，并最终驱动\
  \ Kubernetes 的架构和关键设计决策。\n\n## Kubernetes 概念\n为了解决这些交叉关注点，Kubernetes 架构允许任何内容在任何时间进入或离开。这不仅包括部署到\
  \ Kubernetes 的容器化应用程序，还包括 Kubernetes 自身的基础软件组件，甚至是底层的硬件（如服务器、网络连接和存储）。\n\n### 分离控制平面\n\
  显然，为了让 Kubernetes 成为容器编排环境，它需要运行容器的能力。这种能力由一组被称为 `nodes` 的工作节点提供。每个节点运行一个 `kubelet`\
  \ 服务，该服务与底层容器运行时接口，以启动和监控容器。\n\nKubernetes 还有一组用于管理工作节点及其容器的核心软件组件，但这些软件组件是与工作节点分开部署的。这些\
  \ Kubernetes 核心软件组件统称为 `control plane`（控制平面）。由于控制平面与工作节点分离，工作节点可以运行控制平面，从而为 Kubernetes\
  \ 核心软件组件获得容器化的优势。分离控制平面也意味着 Kubernetes 本身具有微服务架构，允许对每个 Kubernetes 集群进行自定义。例如，一个控制平面组件\
  \ `cloud controller manager`（云控制器）仅在将 Kubernetes 部署到云提供者时使用，并根据所使用的云提供者进行定制。这种设计为应用程序容器和其余\
  \ Kubernetes 控制平面提供了硬件隔离，同时仍然允许我们利用每个云提供者的特定功能。\n\n### 声明式 API\nKubernetes 控制平面的一个关键组件是\
  \ `API server`。API server 为集群的控制和监控提供接口，其他集群用户和控制平面组件使用该接口。在定义 API 时，Kubernetes\
  \ 本可以选择 `imperative`（命令式）样式，即每个 API 端点都是如“运行一个容器”或“分配存储”之类的命令。相反，API 是 `declarative`（声明式的），提供了如\
  \ `create`、`patch`、`get` 和 `delete` 等端点。这些命令的作用是从集群配置中创建、读取、更新和删除 `resources`（资源），每个资源的特定配置告诉\
  \ Kubernetes 我们希望集群做什么。\n\n这种声明式 API 对于满足动态调度和分布式状态的交叉关注点至关重要。因为声明式 API 仅报告或更新集群配置，因此应对可能导致命令丢失的服务器或网络故障非常容易。考虑这样一个例子：在发布更改集群配置的\
  \ `apply` 命令后，API server 连接丢失了。当连接恢复时，客户端可以简单地查询集群配置并判断命令是否成功接收。或者，更简单的是，客户端可以直接发布相同的\
  \ `apply` 命令，因为知道只要集群配置最终符合预期，Kubernetes 就会尝试对实际集群执行“正确的事”。这一核心原理被称为 `idempotence`（幂等性），意味着多次发布相同命令是安全的，因为它最多会被执行一次。\n\
  \n### 自愈\n基于声明式 API，Kubernetes 被设计为 `self-healing`（自愈）的。这意味着控制平面组件会持续监控集群配置和实际集群状态，并尝试将它们对齐。集群配置中的每个资源都有关联的状态和事件日志，反映了配置实际上如何导致集群状态的更改。\n\
  \n配置与状态的分离让 Kubernetes 具有非常强的韧性。例如，代表容器的资源在容器已调度并实际运行时，可能处于 `Running` 状态。如果 Kubernetes\
  \ 控制平面丢失了与运行容器的服务器的连接，它可以立即将状态设置为 `Unknown`，然后努力重新建立连接，或者将节点视为失败并重新调度容器。\n\n同时，使用声明式\
  \ API 和自愈方法具有重要意义。由于 Kubernetes API 是声明式的，对命令的“成功”响应仅意味着集群配置已更新。它并不意味着集群的实际状态已更新，因为达到请求的状态可能需要时间，或者可能存在阻止集群达到该状态的问题。因此，我们不能假设只要创建了适当的资源，集群就会运行我们预期的容器。相反，我们必须观察资源的状态并探索事件日志，以诊断\
  \ Kubernetes 控制平面在使实际集群状态匹配我们指定的配置时遇到的任何问题。\n\n## 集群部署\n在掌握了一些 Kubernetes 核心概念后，我们将使用\
  \ `kubeadm` Kubernetes 管理工具在多台虚拟机上部署一个高可用 Kubernetes 集群。\n\n### 选择 Kubernetes 发行版\n\
  我们不像在第 1 章那样使用特定的 Kubernetes 发行版，而是将使用通用的上游仓库部署一个“原生” Kubernetes 集群。这种方法让我们能够尽机会跟上集群部署，并将在接下来的几个章节中更容易深入探索集群。然而，当你准备好部署自己的\
  \ Kubernetes 集群时（特别是用于生产工作），请考虑使用预构建的 Kubernetes 发行版，以便于管理和内置安全性。云原生计算基金会（CNCF）发布了一套性测试，你可以使用这些测试来确保你选择的\
  \ Kubernetes 发行版符合 Kubernetes 规范。\n\n我们的 Kubernetes 集群将分布在四台虚拟机上，标记为 `host01` 到\
  \ `host04`。其中三台（`host01` 到 `host03`）将运行控制平面组件，而第四台将仅作为工作节点。我们需要三个控制平面节点，因为这是运行高可用集群所需的最小数量。Kubernetes\
  \ 使用投票机制来提供故障转移，至少需要三个控制平面节点；这允许集群在发生网络故障时检测哪一侧应该继续运行。此外，为了让示例中的集群尽可能小，我们将配置 Kubernetes\
  \ 在控制平面节点上运行常规容器，尽管在生产集群中我们会避免这样做。\n\n**注意**\n\n本书的示例仓库位于 [`github.com/book-of-kubernetes/examples`](https://github.com/book-of-kubernetes/examples)。有关设置的详情，请参见第\
  \ xx 页上的“运行示例”。*\n\n\n\n\n\n首先，按照本章的说明启动并运行所有四个虚拟机，你可以在 `Vagrant` 或 AWS 中运行。自动化配置脚本将为这四台机器安装好\
  \ `containerd` 和 `crictl`，因此我们不需要手动进行。自动化配置脚本还会设置 `kube-vip` 或 AWS 网络负载均衡器，以提供所需的高可用性功能，如下文讨论的那样。\n\
  \n注意\n\n你可以使用本章示例提供的提供的额外配置脚本自动安装 Kubernetes。请参阅本章的 README 文件获取操作说明。\n\n你需要在四台虚拟机中的每一台上运行命令，因此你可能想为每台机器打开终端标签页。然而，第一系列命令需要在所有主机上运行，因此自动化脚本设置了一个名为\
  \ `k8s-all` 的命令，以便从 `host01` 执行这些操作。你可以通过 `/usr/local/bin/k8s-all` 查看该脚本的内容，或者通过查看示例中\
  \ `setup` 目录下的 `k8s` Ansible 角色来探索它。\n\n### 前提包\n\n第一步是确保 `br_netfilter` 内核模块已启用并设置为在启动时加载。Kubernetes\
  \ 使用 Linux 防火墙的高级功能处理跨集群的网络流量，因此我们需要这个模块。运行以下两条命令：\n\n```\nroot@host01:~# k8s-all\
  \ modprobe br_netfilter\n\n...\n\nroot@host01:~# k8s-all \"echo 'br_netfilter' >\
  \ /etc/modules-load.d/k8s.conf\"\n```\n\n第一条命令确保为当前运行的内核安装该模块，第二条命令将其添加到启动时运行的模块列表中。第二个命令中略显奇怪的引号确保了\
  \ shell 重定向在远程主机上发生。\n\n接下来，在列表 6-1 中，我们将使用 `sysctl` 命令设置一些 Linux 内核参数，以启用跨集群网络所需的所需的高级网络功能：\n\
  \n```\nroot@host01:~# k8s-all sysctl -w net.ipv4.ip_forward=1 \\\n\n  net.bridge.bridge-nf-call-ip6tables=1\
  \ \\\n\n  net.bridge.bridge-nf-call-iptables=1\n```\n\n列表 6-1：内核设置\n\n此命令启用了以下 Linux\
  \ 内核网络功能：\n\n- `net.ipv4.ip_forward`：将数据从一个网络接口传输到另一个（例如，从容器网络命名空间内部接口到主机网络）。\n\
  - `net.bridge.bridge-nf-call-ip6tables`：让 IPv6 网桥流量通过 `iptables` 防火墙。\n- `net.bridge.bridge-nf-call-iptables`：让\
  \ IPv4 网桥流量通过 `iptables` 防火墙。\n\n最后两项的需求将在第 9 章变得清晰，那时我们将讨论 Kubernetes 如何为 Service\
  \ 提供网络。\n\n列表 6-1 中的这些 `sysctl` 更改在重启后不会持续。自动化脚本会处理这些更改持久化，因此如果你重启了虚拟机，请运行额外的配置脚本，或者重新运行这些命令。\n\
  \n我们现在已完成 Linux 内核配置以支持 Kubernetes 部署，并几乎准备好实际安装。首先，我们需要安装一些前提包：\n\n```\nroot@host01:~#\
  \ k8s-all apt install -y apt-transport-https \\\n\n  open-iscsi nfs-common\n```\n\
  \n`apt-transport-https` 包确保 `apt` 支持通过安全 HTTP 连接到存储库。另外两个包用于我们在集群运行后将安装的集群插件之一。\n\
  \n### Kubernetes 包\n\n我们现在可以添加 Kubernetes 存储库以安装将设置集群的 `kubeadm` 工具。首先，添加用于检查包签名的\
  \ GPG 密钥：\n\n```\nroot@host01:~# k8s-all \"curl -fsSL \\\n\n  https://packages.cloud.google.com/apt/doc/apt-key.gpg\
  \ | \\\n  gpg --dearmor -o /usr/share/keyrings/google-cloud-keyring.gpg\"\n```\n\
  \n此命令使用 `curl` 下载 GPG 密钥。然后使用 `gpg` 对其进行重新格式化，然后将结果写入 `/usr/share/keyrings`。命令行标志\
  \ `fsSL` 让 `curl` 进入一种更适合链式命令的模式，包括避免不必要的输出、跟随服务器重定向并在出现问题时带错误终止。\n\n接下来，我们添加存储库配置：\n\
  \n```\nroot@host01:~# k8s-all \"echo 'deb [arch=amd64' \\\n  'signed-by=/usr/share/keyrings/google-cloud-keyring.gpg]'\
  \ \\\n  'https://apt.kubernetes.io/ kubernetes-xenial main' > \\\n  /etc/apt/sources.list.d/kubernetes.list\"\
  \n```\n\n与之前一样，引号对于确保命令通过 SSH 正确传递到集群中的所有其他主机至关重要。命令将 `kubernetes-xenial` 配置为发行版；该发行版适用于任何版本的\
  \ Ubuntu，从旧的 Ubuntu Xenial 开始。\n\n在我们创建了此新存储库后，我们需要在所有主机上运行 `apt update` 以下载包列表：\n\
  \n```\nroot@host01:~# k8s-all apt update\n\n...\n```\n\n现在我们可以使用 `apt` 安装我们需要的包：\n\
  \n```\nroot@host01:~# k8s-all apt update\nroot@host01:~# source /opt/k8s\nversion=$(cat\
  \ /opt/k8s)\nroot@host01:~# k8s-all apt install -y kubelet=$version kubeadm=$version\
  \ kubectl=$version\n```\n\n`source` 命令加载包含版本变量的文件，该文件由自动化脚本创建，并确保我们使用特定的版本。\n\n\
  `apt` 命令安装了以下包及其依赖项：\n\n- `kubelet`：节点服务，与容器引擎接口以按照调度运行容器。\n- `kubeadm`：我们将用于安装和维护集群的管理工具。\n\
  - `kubectl`：我们将用于检查集群以及创建删除资源的命令行客户端。\n\n`kubelet` 包会立即启动服务，但由于我们还没有安装控制平面，该服务最初处于失败状态：\n\
  \n```\nroot@host01:~# systemctl status kubelet\n\n  kubelet.service - kubelet: The\
  \ Kubernetes Node Agent\n\n  ...\n\n   Main PID: 75368 (code=exited, status=1/FAILURE)\n\
  ```\n\n我们需要控制这些包的版本，因为我们希望一起升级集群组件。为了防止意外更新，将其锁定在当前版本：\n\n```\nroot@host01:~# k8s-all\
  \ apt-mark hold kubelet kubeadm kubectl\n```\n\n此命令防止标准的 `apt full-upgrade` 命令更新这些包。相反，如果我们升级集群，将需要通过\
  \ apt install 指定确切的版本。\n\n### 集群初始化\n\n下一个命令 `kubeadm init` 初始化控制平面并提供 kubelet 节点服务配置。将在集群中的一个节点上运行\
  \ `kubeadm init`，然后在其他每个节点上使用 `kubeadm join` 使它们加入现有集群。\n\n为了运行 `kubeadm init`，我们首先创建一个\
  \ YAML 配置文件。这种方法有几个优点：它大大减少了我们需要记忆的命令行标志数量，并允许我们将集群配置保留在存储库中，实现对配置的控制。然后我们可以更新 YAML\
  \ 文件并重新运行 `kubeadm` 来更改集群配置。\n\n本章的自动化脚本已经在 `/etc/kubernetes` 中填充了 YAML 配置，因此可以使用。以下是该文件的内容：\n\
  \n```yaml\nkubeadm-init.yaml\n```\n\n\n\n\n\n```\n---\napiVersion: kubeadm.k8s.io/v1beta3\n\
  kind: InitConfiguration\nbootstrapTokens:\n- groups:\n  - system:bootstrappers:kubeadm:default-node-token\n\
  \  token: 1d8fb1.2875d52d62a3282d\n  ttl: 2h0m0s\n  usages:\n  - signing\n  - authentication\n\
  nodeRegistration:\n  kubeletExtraArgs:\n    node-ip: 192.168.61.11\n  taints: []\n\
  localAPIEndpoint:\n  advertiseAddress: 192.168.61.11\ncertificateKey: \"5a7e07816958efb97635e9a66256adb1\"\
  \n---\napiVersion: kubeadm.k8s.io/v1beta3\nkind: ClusterConfiguration\nkubernetesVersion:\
  \ 1.21.4\napiServer:\n  extraArgs:\n    service-node-port-range: 80-32767\nnetworking:\n\
  \  podSubnet: \"172.31.0.0/16\"\ncontrolPlaneEndpoint: \"192.168.61.10:6443\"\n\
  ---\napiVersion: kubelet.config.k8s.io/v1beta1\nkind: KubeletConfiguration\nserverTLSBootstrap:\
  \ true\n```\n\n此 YAML 文件包含三个由破折号（---）分隔的文档。第一个文档用于初始化集群，第二个文档包含更通用的配置，第三个文档用于为所有节点提供\
  \ kubelet 的设置。让我们来看这些配置项的用途：\n\n- `apiVersion` / `kind`：告诉 Kubernetes 每个 YAML 文档的用途，以便其能够验证内容。\n\
  - `bootstrapTokens`：配置其他节点可用于加入集群的密钥。在生产集群中，该令牌应保持保密。它被设置为在两小时后自动过期，因此如果我们以后想加入更多节点，我们需要重新创建一个。\n\
  - `nodeRegistration`：传递给运行在 `host01` 上的 `kubelet` 服务的配置。`node-ip` 字段确保 `kubelet`\
  \ 向 API server 注册正确的 IP 地址，以便 API server 能够与其通信。`taints` 字段确保普通容器可以调度到控制平面节点上。\n\
  - `localAPIEndpoint`：API server 应该使用的本地 IP 地址。我们的虚拟机有多个 IP 地址，我们希望 API server 监听在正确的网络上。\n\
  - `certificateKey`：配置其他节点将用于访问 API server 证书的密钥。为了让我们高可用集群中所有的 API server 实例可以使用相同的证书，这是必要的。在生产集群中请保持保密。\n\
  - `networking`：集群中的所有容器无论运行在哪个主机上，都将从 `podSubnet` 获取 IP 地址。稍后，我们将安装一个网络驱动程序，确保集群中所有主机上的每个容器都能通信。\n\
  - `controlPlaneEndpoint`：API server 的外部地址。对于高可用集群，此 IP 地址需要能够到达任何 API server 实例，而不仅仅是第一个。\n\
  - `serverTLSBootstrap`：指示 `kubelet` 使用控制器管理器的证书机构（CA）来请求服务器证书。\n\n`apiVersion` 和\
  \ `kind` 字段出现在每个 Kubernetes YAML 文件中。`apiVersion` 字段定义了一组相关的 Kubernetes 资源，包括版本号。`kind`\
  \ 字段则选择该组中的特定资源类型。这不仅允许 Kubernetes 项目和其他供应商随着时间的推移添加新的资源组，还允许在保持向后兼容的同时更新现有的资源规范。\n\
  \n## 高可用集群\n\n`controlPlaneEndpoint` 字段用于配置高可用集群最重要的要求：一个可以到达所有 API server 的 IP\
  \ 地址。我们在初始化集群时需要立即建立此 IP 地址，因为它被用于生成证书，客户端将通过这些证书验证 API server 的身份。提供集群范围 IP 地址的最佳方法取决于集群运行的位置；例如，在云环境中，使用服务提供商的内置功能（如\
  \ Amazon Web Services 中的弹性负载均衡器 (ELB) 或 Azure 负载均衡器）是最佳的。\n\n由于两种不同环境的性质各异，本书的示例在配合\
  \ Vagrant 运行时使用 `kube-vip`，在在 Amazon Web Services 中运行时使用 `ELB`。示例文档顶部的 `README.md`\
  \ 文件有更多细节。安装和配置是自动完成的，因此没有更多需要配置的内容。我们只需要使用 `192.168.61.10:6443`，并期望流量能够到达运行在 `host01`\
  \ 到 `host03` 上的任何 API server 实例。\n\n由于我们已经在 YAML 文件中准备好了集群配置，初始化集群的 `kubeadm init`\
  \ 命令非常简单。我们仅在 `host01` 上运行此命令：\n\n```\nroot@host01:~# /usr/bin/kubeadm init \\\n\
  \  --config /etc/kubernetes/kubeadm-init.yaml --upload-certs\n```\n\n`--config`\
  \ 选项指向我们之前过的 YAML 配置文件 (`kubeadm-init.yaml`)，而 `--upload-certs` 选项告诉 `kubeadm` 将将\
  \ API server 的证书上传到集群的分布式存储中。其他控制平面节点在加入集群时可以下载这些证书，允许所有 API server 实例使用相同的证书，以便客户端能够信任它们。证书使用我们提供的\
  \ `certificateKey` 进行加密，这意味着其他节点需要此密钥来解密它们。\n\n`kubeadm init` 命令初始化 `host01` 上的控制平面组件。这些组件运行在容器中并由\
  \ `kubelet` 服务管理，这使得它们很容易升级。将下载几个容器镜像，因此该命令可能需要一段时间，取决于你的虚拟机速度和互联网连接。\n\n### 将节点加入集群\n\
  \n`kubeadm init` 命令输出一个 `kubeadm join` 命令，我们可以用它将其他节点加入集群。然而，自动化脚本已经为每个其他节点预留留了一个配置文件，以确保它们作为正确的节点类型加入。服务器\
  \ `host02` 和 `host03` 将作为额外的控制平面节点加入，而 `host04` 将仅作为工作节点加入。\n\n以下是 `host02` 带有特定设置的\
  \ YAML 配置文件：\n\n*kubeadm-join.yaml (host02)*\n\n```\n---\napiVersion: kubeadm.k8s.io/v1beta3\n\
  kind: JoinConfiguration\ndiscovery:\n  bootstrapToken:\n    apiServerEndpoint: 192.168.61.10:6443\n\
  \    token: 1d8fb1.2875d52d62a3282d\n    unsafeSkipVerification: true\n  timeout:\
  \ 5ms\nnodeRegistration:\n  kubeletExtraArgs:\n    cgroup-driver: containerd\n \
  \   node-ip: 192.168.61.12\n  taints: []\n  ignorePreflightErrors:\n    - DirAvailable--etc-kubernetes-manifests\n\
  controlPlane:\n  localAPIEndpoint:\n    advertiseAddress: 192.168.61.12\n  certificateKey:\
  \ \"5a7e07816958efb97635e9a66256adb1\"\n```\n\n此资源的类型为 `JoinConfiguration`，但大部分字段与\
  \ `kubeadm-init.yaml` 中的 `InitConfiguration` 相同。最重要的是 `token` 和 `certificateKey`\
  \ 与我们设置的匹配，因此该节点能够通过集群验证并解密 API server 证书。\n\n一个区别是增加了 `ignorePreflightErrors`。这部分仅在我们安装\
  \ `kube-vip` 时出现，因为在这种情况下我们需要将 `kube-vip` 的配置文件预到 `/etc/kubernetes/manifests` 目录，并且我们需要告诉\
  \ `kubeadm` 该目录已经存在是可以的。\n\n由于我们有了这个 YAML 配置文件，`kubeadm join` 命令非常简单。在 `host02`\
  \ 上运行它：\n\n```\nroot@host02:~# /usr/bin/kubeadm join --config /etc/kubernetes/kubeadm-join.yaml\n\
  ```\n\n与之前一样，此命令在该节点上通过 `kubelet` 服务以容器运行控制平面组件，因此下载镜像和启动容器可能需要一段时间。\n\n完成后，在 `host03`\
  \ 上运行完全相同的命令：\n\n```\nroot@host03:~# /usr/bin/kubeadm join --config /etc/kubernetes/kubeadm-join.yaml\n\
  ```\n\n自动化脚本为每个主机设置了带有正确 IP 地址的 YAML 文件，因此每个主机之间的配置差异已经考虑在内。\n\n\n\n\n当此命令完成时，我们已经创建了一个高可用\
  \ Kubernetes 集群，其控制面组件运行在三个独立的主机上。然而，我们目前还没有任何常规的工作节点（worker nodes）。让我们来解决这个问题。\n\
  \n我们将首先将 `host04` 作为一个普通工作节点加入，并在 `host04` 上运行完全相同的 `kubeadm join` 命令，但 YAML 配置文件会有所不同。以下是该文件：\n\
  \n`kubeadm-join.yaml (host04)`\n\n```\n---\napiVersion: kubeadm.k8s.io/v1beta3\n\
  kind: JoinConfiguration\ndiscovery:\n  bootstrapToken:\n    apiServerEndpoint: 192.168.61.10:6443\n\
  \    token: 1d8fb1.2875d52d62a3282d\n    unsafeSkipCAVerification: true\n  timeout:\
  \ 5m0s\nnodeRegistration:\n  kubeletExtraArgs:\n    cgroup-driver: containerd\n\
  \    node-ip: 192.168.61.14\n  taints: []\n```\n\n此 YAML 文件缺少了 `controlPlane` 字段，因此\
  \ `kubeadm` 将其配置为普通工作节点而非控制面节点。\n\n现在让我们将 `host04` 加入集群：\n\n```\nroot@host04:~#\
  \ /usr/bin/kubeadm join --config /etc/kubernetes/kubeadm-join.yaml\n```\n\n此命令执行速度会快一点，因为不需要下载并运行控制面容器镜像。我们现在集群中有了四个节点，可以通过通过在\
  \ `host01` 上重新运行 `kubectl` 来验证这一点：\n\n```\nroot@host01:~# export KUBECONFIG=/etc/kubernetes/admin.conf\n\
  root@host01:~# kubectl get nodes\n\nNAME     STATUS     ROLES        ...\nhost01\
  \   NotReady   control-plane...\nhost02   NotReady   control-plane...\nhost03  \
  \ NotReady   control-plane...\nhost04   NotReady   <none>       ...\n```\n\n第一条命令设置了一个环境变量，告诉\
  \ `kubectl` 使用哪个配置文件。`/etc/kubernetes/admin.conf` 文件是 `kubeadm` 在初始化 `host01` 为控制面节点时自动创建的。该文件告诉\
  \ `kubectl` 使用什么地址作为 API 服务器、使用什么证书验证安全连接，以及如何进行身份验证。\n\n这四个节点目前报告的状态应该为 `NotReady`。让我们运行\
  \ `kubectl describe` 命令来获取节点详情：\n\n```\nroot@host01:~# kubectl describe node host04\n\
  \nName:               host04\n...\nConditions:\n  Type   Status ... Message\n  ----\
  \   ------ ... -------\n  Ready  False  ... container runtime network not ready...\n\
  ...\n```\n\n我们还没有为集群安装网络驱动程序，导致所有节点都报告为 `NotReady` 状态，这意味着它们不会接受常规的工作负载。Kubernetes\
  \ 通过在节点配置中放置 `taint`（污点）来传达这一点。`taint` 限制了可以在节点上进行调度的内容。我们可以使用 `kubectl` 列出节点上的污点：\n\
  \n```\nroot@host01:~# kubectl get node -o json | jq '.items[]|.metadata.name,.spec.taints'\n\
  \"host01\" {\n  \"effect\": \"NoSchedule\",\n  \"key\": \"node.kubernetes.io/not-ready\"\
  \n}\n\"host02\" {\n  \"effect\": \"NoSchedule\",\n  \"key\": \"node.kubernetes.io/not-ready\"\
  \n}\n\"host03\" {\n  \"effect\": \"NoSchedule\",\n  \"key\": \"node.kubernetes.io/not-ready\"\
  \n}\n\"host04\" {\n  \"effect\": \"NoSchedule\",\n  \"key\": \"node.kubernetes.io/not-ready\"\
  \n}\n```\n\n我们选择 `json` 输出格式，以便能够使用 `jq` 仅打印特定信息。由于所有节点的状态均为 `NotReady`，它们带有一个被设置为\
  \ `NoSchedule` 的 `not-ready` 污点，这阻止了 Kubernetes 调度器将容器调度到这些节点上。\n\n通过在 `kubeadm`\
  \ 配置中将 `taints` 指定为空数组，我们防止了控制面节点获得额外的控制面污点。在生产环境集群中，出于安全考虑，该污点会将应用程序容器与控制面容器隔离开，因此我们会保留它。但对于我们的示例集群来说，这意味着我们需要额外的额外的虚拟机来充当工作节点，而我们并没有这些机器。`kubectl\
  \ taint` 命令允许我们手动移除 `not-ready` 污点，但正确的方法是将网络驱动作为集群插件安装，这样节点就能正确地报告 `Ready`，从而允许我们在它们上运行容器。\n\
  \n### 安装集群插件\n\n我们已经在四个独立的节点上安装了 `kubelet`，并在三个节点上安装了控制面并将它们加入了集群。对于剩余的节点，我们将使用控制面来安装插件。这些插件与我们部署的常规应用程序类似，它们由\
  \ Kubernetes 资源并在容器中运行，但它们为集群提供了我们应用程序所需的各种服务。\n\n为了让基础集群运行起来，我们需要安装三种类型的插件：`network\
  \ driver`（网络驱动）、`storage driver`（存储驱动）和 `ingress controller`（接入控制器）。我们还将安装第四个可选插件\
  \ `metrics server`（指标服务器）。\n\n#### 网络驱动\n\nKubernetes 网络基于容器网络接口 (CNI) 标准。任何人都可以通过实现该标准为\
  \ Kubernetes 构建新的网络驱动，结果就是许多选择可供。我们将在第 8 章演示不同的插件，但大多数 Kubernetes 集群使用 Calico 网络驱动。\n\
  \n首先，下载 Calico 的 YAML 配置文件：\n\n```\nroot@host01:~# cd /etc/kubernetes/components\n\
  root@host01:/etc/kubernetes/components# curl -L -O $calico_url\n```\n\n`-L` 选项告诉\
  \ `curl` 跟随重定向，而 `-O` 选项告诉 `curl` 使用文件名保存内容。`calico_url` 环境变量的值由 `k8s-ver` 脚本指定。这至关重要，因为\
  \ Calico 对我们运行的 Kubernetes 版本敏感。\n\n主 YAML 配置被写入本地文件 `tigera-operator.yaml`。这指的是初始安装是一个\
  \ Kubernetes Operator，随后会创建所有的 Calico 资源。我们将在第 17 章探讨运算符。\n\n除了此主 YAML 配置外，本章节的脚本添加了一个名为\
  \ `custom-resources.yaml` 的文件，为我们的集群提供了必要的配置。现在我们可以告诉 Kubernetes API 服务器将这些文件应用到集群：\n\
  \n```\nroot@host01:/etc/kubernetes/components# kubectl apply -f tigera-operator.yaml\n\
  ...\nroot@host01:/etc/kubernetes/components# kubectl apply -f custom-resources.yaml\n\
  ```\n\nKubernetes 需要几分钟来下载容器镜像并启动容器，然后 Calico 将在我们的集群中运行，我们的节点应该报告为 `Ready`：\n\n\
  ```\nroot@host01:/etc/kubernetes/components# kubectl get nodes\nNAME     STATUS\
  \   ROLES                ...\nhost01   Ready    control-plane,master ...\nhost02\
  \   Ready    control-plane,master ...\nhost03   Ready    control-plane,master ...\n\
  host04   Ready    <none>               ...\n```\n\n\n\n\n```\nroot@host01:/etc/kubernetes/components#\
  \ kubectl -n calico-system \\\n\n  get daemonsets -o json | \\\n  jq '.items[].spec.template.spec.tolerations[]'\n\
  \n{\n  \"key\": \"CriticalAddonsOnly\",\n  \"operator\": \"Exists\"\n}\n\n{\n  \"\
  effect\": \"NoSchedule\",\n  \"operator\": \"Exists\"\n}\n\n{\n  \"effect\": \"\
  NoExecute\",\n  \"operator\": \"Exists\"\n}\n```\n\n`-n` 选项选择了 `calico-system` `Namespace`（命名空间）。`Names`\
  \ 是在集群上将 Kubernetes 资源相互隔离的一种方式，既是为了安全考虑，也是为了避免命名冲突。此外，和之前一样，我们请求了 JSON 输出并使用 `jq`\
  \ 仅选择我们感兴趣的字段。如果你想查看资源的完整配置，可以使用不带带 `jq` 的 `-o=json` 或使用 `-o=yaml`。\n\n这个 `DaemonSet`\
  \ 有三个容忍度（tolerations），其中第二个提供了我们需要的行为。它告诉 Kubernetes 调度器，即使在节点具有 `NoSchedule` 污点（taint）的情况下也继续调度它。这样\
  \ Calico 就可以节点准备好之前启动，一旦运行，节点状态就会更改为 `Ready`，以便普通的应用程序容器可以被调度。控制平面组件也类似的容忍度，以便在节点显示为\
  \ `Ready` 之前运行。\n\n## 安装存储\n\n集群节点已准备就绪，所以如果我们部署一个普通的应用程序，它的容器将会运行。然而，需要持久化存储的应用程序将无法启动，因为集群还没有存储驱动程序。像网络驱动一样，Kubernetes\
  \ 有多种存储驱动可用。`Container Storage Interface`（`CSI`）提供了存储驱动程序与 Kubernetes 工作时需要遵循的标准。我们将使用\
  \ `Longhorn`，这是 Rancher 的一种存储驱动；它易于安装，不需要任何底层硬件（例如额外的块设备或对云存储的访问）。\n\nLonghorn 利用了我们之前安装的\
  \ `iSCSI` 和 `NFS` 软件。它期望我们所有的节点都启用并运行 `iscsid` 服务，所以让我们确保我们所有节点上的这一点都是真的：\n\n```\n\
  root@host01:/etc/kubernetes/components# k8s-all systemctl enable --now iscsid\n\
  ```\n\n我们现在可以在集群上安装 Longhorn。安装 Longhorn 的过程与 Calico 非常相似。首先下载 Longhorn 的 YAML 配置：\n\
  \n```\nroot@host01:/etc/kubernetes/components# curl -LO $longhorn_url\n```\n\n`longhorn_url`\
  \ 环境变量也由 `k8s-ver` 脚本设置，这允许我们确保兼容性。\n\n使用 `kubectl` 安装 Longhorn：\n\n```\nroot@host01:/etc/kubernetes/components#\
  \ kubectl apply -f longhorn.yaml\n```\n\n和之前一样，`kubectl apply` 确保 YAML 文件中的资源被应用到集群，并根据需要创建或更新它们。`kubectl\
  \ apply` 命令支持将 URL 作为应用到集群的资源源，但对于这三次安装，我们运行了单独的 `curl` 命令，因为拥有应用到集群的内容的本地副本是方便的。\n\
  \nLonghorn 现在已安装在集群上，我们将在本章剩余部分探索集群时对其进行验证。\n\n## Ingress 控制器\n\n我们现在有了网络和存储，但网络只允许从集群内部访问容器。我们需要另一个服务来将我们的容器化应用程序暴露到集群外部。最简单的方法是使用\
  \ Ingress 控制器（ingress controller）。正如我们在第 9 章中描述的，ingress 控制器监控 Kubernetes 集群中的 `Ingress`\
  \ 资源并路由网络流量。\n\n我们开始下载控制器的 YAML 配置：\n\n```\nroot@host01:/etc/kubernetes/components#\
  \ curl -Lo ingress-controller.yaml\n\n  $ingress_url\n```\n\n与之前的示例一样，`ingress_url`\
  \ 环境变量由 `k8s-ver` 脚本设置，以便我们可以确保兼容性。在这种情况下，URL 以 `deploy.yaml` 的通用路径结尾，因此我们使用 `-o`\
  \ 为 `curl` 提供文件名，以明确下载的 YAML 文件的用途。\n\n使用 `kubectl` 安装 ingress 控制器：\n\n```\nroot@host01:/etc/kubernetes/components#\
  \ kubectl apply -f ingress-controller.yaml\n```\n\n这创建了许多资源，但主要有两个部分：一个实际执行 HTTP\
  \ 流量路由的 NGINX Web 服务器，以及一个监控集群中 Ingress 资源变化并相应配置 NGINX 的组件。\n\n我们还需要最后一步。按照安装方式，ingress\
  \ 控制器尝试请求外部 IP 地址以允许流量从集群外部到达它。由于我们运行的是没有访问外部 IP 地址的示例集群，这将无法运行。相反，我们将通过从集群主机的端口转发（port\
  \ forwarding）来访问 ingress 控制器。目前，我们的 ingress 控制器已配置了此端口转发，但它使用的是随机端口。我们希望选择一个端口，以确保知道在哪里找到\
  \ ingress 控制器。同时，我们还将添加一个注解（annotation），使此 ingress 控制器成为该集群的默认值。\n\n为了应用端口更改，我们将为\
  \ Kubernetes 集群提供一个仅包含所需更改的额外 YAML 配置。这是该 YAML：\n\n`ingress-patch.yaml`\n\n```yaml\n\
  ---\napiVersion: v1\nkind: Service\nmetadata:\n  name: ingress-nginx-controller\n\
  \  namespace: ingress-nginx\nspec:\n  ports:\n    - port: 80\n      nodePort: 80\n\
  \    - port: 443\n      nodePort: 443\n```\n\n此文件指定了 `Service` 的名称和 `Namespace`，以确保\
  \ Kubernetes 知道在哪里应用这些更改。它还指定了我们要更新的端口配置，以及 `nodePort`（即我们节点上用于端口转发的端口）。我们将在第 9\
  \ 章中详细地查看 `NodePort` 服务类型和端口转发。\n\n要补补服务，我们使用 `kubectl patch` 命令：\n\n```\nroot@host01:/etc/kubernetes/components#\
  \ kubectl patch -n ingress-nginx \\\n  service/ingress-controller --patch-file ingress-patch.yaml\n\
  \nservice/ingress-controller patched\n```\n\n要应用注解，使用 `kubectl annotate` 命令：\n\n\
  ```\nroot@host01:/etc/kubernetes/components# kubectl annotate -n ingress-nginx \\\
  \n  ingressclass/nginx ingressclass.kubernetes.io/is-default-class=\"true\"\n\n\
  ingressclass.kubernetes.io/nginx annotated\n```\n\nKubernetes 在我们更改时向每个资源报告更改，因此我们知道更改已经应用。\n\
  \n## Metrics Server\n\n我们的最后一个插件是 `metrics server`，它从我们的节点收集利用率指标，启用自动伸缩功能。为了实现这一点，它需要连接到集群中的\
  \ `kubelet` 实例。出于安全考虑，在连接到 `kubelet` 时需要验证 HTTP/S 证书。这就是为什么我们配置 `kubelet` 请求由控制器管理器签名的证书，而不是允许\
  \ `kubelet` 生成自签名证书。\n\n在设置过程中，`kubelet` 在每个节点上创建了一个证书请求，但这些请求没有自动通过。让我们找到这些请求：\n\
  \n```\nroot@host01:/etc/kubernetes/components# kubectl get csr\nNAME      ... SIGNERNAME\
  \                               ... CONDITION\ncsr-sgrwz ... kubernetes.io/kubelet-serving\
  \               ... Pending\ncsr-agwb6 ... kubernetes.io/kube-apiserver-client-kubelet\
  \ ... Approved,Issued\ncsr-2kwwk ... kubernetes.io/kubelet-serving             \
  \  ... Pending\ncsr-5496d ... kubernetes.io/kube-apiserver-client-kubelet ... Approved,Issued\n\
  csr-hm6lj ... kubernetes.io/kube-apiserver-client-kubelet ... Approved,Issued\n\
  csr-jbfmx ... kubernetes.io/kubelet-serving               ... Pending\ncsr-njjr7\
  \ ... kubernetes.io/kube-apiserver-client-kubelet ... Approved,Issued\ncsr-v7tcs\
  \ ... kubernetes.io/kubelet-serving               ... Pending\ncsr-vr27n ... kubernetes.io/kubelet-serving\
  \               ... Pending\n```\n\n\n\n\n每个 `kubelet` 都有一个用于向 API  进行身份验证的客户端证书；这些证书在引导过程中已被自动批准。我们需要批准的请求是\
  \ `kubelet-serving` 证书，它们在像 metrics server 这样的客户端连接到 `kubelet` 时被使用。请求一旦批准，控制器管理器就会对该证书进行签名。然后\
  \ `kubelet` 会收集该证书并开始使用它。\n\n我们可以通过查询所有 `kubelet-serving` 请求的名称，并将这些名称传递给 `kubectl\
  \ certificate approve` 来一次性批准所有请求：\n\n```\nroot@host01:/etc/kubernetes/components#\
  \ kubectl certificate approve \\$(kubectl\n\nget csr --field-selector spec.signerName=kubernetes.io/kubelet-serving\
  \ -o name)\n\ncertificatesigningrequest.certificates.k8s.io/csr-sgrwz approved\n\
  \n...\n```\n\n我们现在可以通过下载并应用其 YAML 配置来安装我们的 metrics server：\n\n```\nroot@host01:/etc/kubernetes/components#\
  \ curl -Lo metrics-server.yaml \\$metrics_url\n\nroot@host01:/etc/kubernetes/components#\
  \ kubectl apply -f metrics-server.yaml\n\n...\n\nroot@host01:/etc/kubernetes/components#\
  \ cd\n\nroot@host01:~#\n```\n\n这是我们需要安装的最后一个组件，因此我们可以离开此目录。有了这些集群插件，我们现在拥有了一个完整的、高可用的\
  \ Kubernetes 集群。\n\n### 探索集群\n\n在向这个全新的 Kubernetes 集群部署我们的第一个应用程序之前，让我们探索一下它上面运行着什么。我们在这里使用的命令在以后调试自己的应用程序以及运行不正常的集群时将大有用场。\n\
  \n我们将使用 `crictl`（这与我们在 第一部分 中用于探索运行容器的命令相同）来查看 `host01` 上运行了哪些容器：\n\n```\nroot@host01:~#\
  \ crictl ps\n\nCONTAINER       ... STATE    NAME                       ...\n\n25c63f29c1442\
  \   ... Running  longhorn-csi-plugin        ...\n\n2ffdd044a81dd   ... Running \
  \ node-driver-registrar      ...\n\n94468050de89c   ... Running  csi-provisioner\
  \            ...\n\n119fbf417f1db   ... Running  csi-attacher               ...\n\
  \ne74c1a2a0c422   ... Running  kube-scheduler             ...\n\nd1ad93cdbc686 \
  \  ... Running  kube-controller-manager    ...\n\n76266a522cc3d   ... Running  engine-image-ei-611d1496\
  \   ...\n\nfc3cd1679e33e   ... Running  replica-manager            ...\n\n48e792a973105\
  \   ... Running  engine-manager             ...\n\ne658baebbc295   ... Running \
  \ longhorn-manager           ...\n\neb51d9ec0f2fc   ... Running  calico-kube-controllers\
  \    ...\n\n53e7e3e4a3148   ... Running  calico-node                ...\n\n772ac45ceb94e\
  \   ... Running  calico-typha               ...\n\n4005370021f5f   ... Running \
  \ kube-proxy                 ...\n\n26929cde3a264   ... Running  kube-apiserver\
  \             ...\n\n9ea4c2f5af794   ... Running  etcd                       ...\n\
  ```\n\n控制平面节点非常忙，因为此列表包含了 Kubernetes 控制平面组件、Calico 组件和 Longhorn 组件。在所有节点上运行此命令并整理哪些容器在何处以及为了什么运行会非常困惑。坦率地说，`kubectl`\
  \ 提供了一个更清晰的视图，尽管知道我们可以深入到这些低级细节并确切看到给定节点上运行了哪些容器是很不错的。\n\n要使用 `kubectl` 探索集群，我们需要知道集群资源是如何组织成\
  \ `Namespaces`（命名空间）的。正如之前提到的，Kubernetes `Namespaces`提供了安全性并避免了命名冲突。为了确保幂等性，Kubernetes\
  \ 需要每个资源都有唯一的名称。通过将资源划分为 `Namespaces`，我们允许多个资源具有相同的名称，同时让 API 节点能够确切知道我们指的是哪个资源，这同时也支持了多租户，这是我们关注的跨关注问题之一。\n\
  \n尽管我们刚刚设置了集群，但它已经填充了几个 `Namespaces`：\n\n```\nroot@host01:~# kubectl get namespaces\n\
  \nNAME              STATUS   AGE\n\ncalico-system     Active   50m\n\ndefault  \
  \         Active   150m\n\nkube-node-lease   Active   150m\n\nkube-public      \
  \ Active   150m\n\nkube-system       Active   150m\n\nlonghorn-system   Active \
  \  16m\n\ntigera-operator   Active   50m\n```\n\n当我们运行 `kubectl` 命令时，它们将应用于默认的 `Namespace`，除非我们使用\
  \ `-n` 选项指定不同的 `Namespace`。\n\n要查看运行哪些容器，我们请求 `kubectl` 获取 `Pods` 列表。我们将在 第 7 章\
  \ 中更详细地查看 Kubernetes `Pods`。现在，只需知道一个 `Pod` 是一个或多个容器的组，就像我们在 第一部分 中用 `crictl` 创建的\
  \ `Pods` 一样。\n\n如果我们尝试在 `default` 命名空间列出 `Pods`，我们会发现没有任何：\n\n```\nroot@host01:~#\
  \ kubectl get pods -n default\nNo pods found\n```\n\n到目前为止，由于我们安装了集群组件，它们创建了其他 `Namespaces`。我们在\
  \ `kube-system` 中看到了控制平面：\n\n```\nroot@host01:~# kubectl get pods -n kube-system\n\
  \nNAME                             READY   STATUS    RESTARTS   AGE\n\ncoredns-7f58bd4d-77kr\
  \         1/1     Running   0          31m\n\n...\n\napiserver-host01          \
  \  1/1     Running   0          32m\n```\n\n我们在 第 11 章 中涵盖了控制平面。现在，让我们探索运行在 `host01`\
  \ 的一个 `Pod`。我们可以使用 `kubectl` 获取所有详细信息：\n\n```\nroot@host01:~# kubectl -n kube-system\
  \ describe pod apiserver-host01\nName:apiserver-host01\n...\n```\n\n`Namespace`\
  \ 和名称共同标识了这个 `Pod`。我们看到了调度该 `Pod` 的节点、它的状态以及有关容器的详细信息，包括一个可以使用 `crictl` 使用的容器 ID。\n\
  \n让我们也验证 Calico 是否按预期部署到我们的集群：\n\n```\nroot@host01:~# kubectl get pods -n calico-system\n\
  \nNAME                                       READY   STATUS    RESTARTS   AGE\n\n\
  calico-kube-controllers-7f58bd4d-7zt   1/1     Running   0          31m\n\n...\n\
  \ncalico-node-cp88k                          1/1     Running   0          31m\n\n\
  calico-node-dn4rj                          1/1     Running   0          31m\n\n\
  calico-node-xnkmg                          1/1     Running   0          31m\n\n\
  calico-node-zfscp                          1/1     Running   0          31m\n\n\
  calico-typha-68b99cd4bf-7lwss              1/1     Running   0          31m\n\n\
  calico-typha-68b99cd4bf-jjdts              1/1     Running   0          31m\n\n\
  calico-typha-68b99cd4bf-pjr6q              1/1     Running   0          31m\n```\n\
  \n早些我们看到 Calico 安装了一个 `DaemonSet` 资源。Kubernetes 使用此 `DaemonSet` 中的配置为每个节点自动创建一个\
  \ `calico-node` `Pod`。就像 Kubernetes 本身，Calico 也使用一个独立的控制平面来处理网络的整体配置，其他 `Pods` 提供了该控制平面。\n\
  \n最后，我们将看到为 Longhorn 的容器：\n\n```\nroot@host01:~# kubectl -n longhorn-system get\
  \ pods\n\nNAME                                       READY   STATUS    RESTARTS\
  \   AGE\n\nengine-image-ei-611d1496-8q5f             1/1     Running   0       \
  \   31m\n\n...\n\nlonghorn-csi-plugin-8vkr6                  2/2     Running   0\
  \          31m\n\n...\n\nlonghorn-manager-dl9sb                     1/1     Running\
  \   1          32m\n\n...\n```\n\n\n\n\n与 Calico 类似，Longhorn 使用 `DaemonSets` 以便它可以在每个节点上运行容器。这些容器为节点上的其他容器提供存储服务。Longhorn\
  \ 还包含了许多其他作为控制平面的容器，包括提供了 Kubernetes 用时使用的 `CSI` 实现，该实现用于告诉 Longhorn 在需要时创建存储。\n\
  \n我们在设置此集群上花费了大量精力，因此如果在本章结束时，我们还没有在上面运行至少一个应用程序，那就太可惜了。在下一章中，我们将查看运行容器的许多不同方法，但让我们先在\
  \ Kubernetes 集群中快速运行一个简单的 NGINX Web 服务器：\n\n```\nroot@host01:~# kubectl run nginx\
  \ --image=nginx\n\npod/nginx created\n```\n\n这看起来像是一条命令式命令，但在底层，`kubectl` 正在使用我们指定的名称和容器镜像创建一个\
  \ `Pod` 资源，然后将该资源应用到集群。让我们再次检查默认的 `Namespace`（命名空间）：\n\n```\nroot@host01:~# kubectl\
  \ get pods -o wide\n\nNAME    READY   STATUS    ... IP               NODE  ...\n\
  \nnginx   1/1     Running   ... 172.31.89.203   host02 ...\n```\n\n我们使用 `-o wide`\
  \ 来查看关于 `Pod` 的额外信息，包括它的 IP 地址和它被调度的位置，这在每次创建 `Pod` 时都可能不同。在这种情况下，`Pod` 被调度到了 `host02`，这表明我们成功地允许普通应用程序容器部署到我们的控制平面节点上。IP\
  \ 地址来自我们配置的 `Pod CIDR`，并由 Calico 自动分配。\n\nCalico 还处理流量路由，使得我们可以从集群中的任何容器以及宿主机网络访问\
  \ `Pod`。让我们验证一下这一点，从一个普通的 `ping` 开始：\n\n```\nroot@host01:~# ping -c 1 172.31.89.203\n\
  \nPING 172.31.89.203 (172.31.89.203) 56(84) bytes of data.\n\n64 bytes from 172.31.89.203:\
  \ icmp_seq=1 ttl=63 time=0.848 ms\n\n--- 172.31.89.203 ping statistics ---\n\n1\
  \ packets transmitted, 1 received, 0% packet loss, time 0ms\n\nrtt min/avg/max/mdev\
  \ = 0.848/0.848/0.848/0.000 ms\n```\n\n请使用你 `Pod` 的 IP 地址替换此处此处显示的地址。\n\n我们还可以使用\
  \ `curl` 来验证 NGINX Web 服务器是否正常工作：\n\n```\nroot@host01:~# curl http://172.31.89.203\n\
  \n...\n\n<title>Welcome to nginx!</title>\n\n...\n```\n\nKubernetes 集群正在运行，并已准备好让我们部署应用程序。Kubernetes\
  \ 将利用集群中的所有节点来为我们的应用程序提供负载均衡，并在发生任何故障时提供恢复能力。\n\n### 结语\n\n在本章中，我们探索了 Kubernetes\
  \ 是如何构建的，其灵活性允许集群组件随时加入或离开。这不仅适用于容器化应用程序，还适用于集群组件，包括控制平面微服务以及集群所使用的底层服务器和网络。我们能够引导一个集群，然后动态地为其添加节点，配置这些节点接受特定类型的容器，然后使用\
  \ Kubernetes 集群本身动态添加网络和存储驱动程序并运行和监控它们。最后，我们将第一个容器部署到 Kubernetes 集群，允许它自动将容器调度到可用节点上，并使用我们的网络驱动程序从宿主机网络访问容器。\n\
  \n现在我们已经有一个高可用集群，可以查看后续内容了。\n\n\n\n\nPod 显示为 `Running` 状态可能需要一些时间，特别是如果你刚刚设置好 Kubernetes\
  \ 集群，它仍在忙于部署核心组件。请继续尝试运行此 `kubectl` 命令来检查状态。\n\n与其多次输入 `kubectl` 命令，你还可以使用 `watch`。`watch`\
  \ 命令是观察集群随时间变化的极佳方法。只需在你的命令前加上 `watch`，它就会每隔两秒为你运行一次。\n\n我们在命令中添加了 `-o wide` 以查看此\
  \ Pod 的 IP 地址和节点分配。Kubernetes 会替我们管理这些。在这种情况下，Pod 被调度在 `host03` 上，因此我们需要去那里查看正在运行的容器：\n\
  \n```\nroot@host03:~# crictl pods --name nginx\n\nPOD ID         CREATED       \
  \  STATE  NAME   NAMESPACE  ...\n\n9f1d6e0207d7e  19 minutes ago  Ready  nginx \
  \ default    ...\n```\n\n在你的 NGINX Pod 所在的任何主机上运行此命令。\n\n如果通过收集 Pod ID，也可以看到容器：\n\
  \n```\nroot@host03:~# POD_ID=$(crictl pods -q --name nginx)\n\nroot@host03:~# crictl\
  \ ps --pod $POD_ID\n\nCONTAINER      IMAGE          CREATED         STATE    NAME\
  \   ...\n\n9da09b3671418  4cdc5dd7eaadf  20 minutes ago  Running  nginx  ...\n```\n\
  \n此输出与 列表 7-1 中 `kubectl get` 的输出非常相似，这并不意外，因为我们的集群是从运行在该节点上的 `kubelet` 服务获取这些信息的，而该服务反过来使用\
  \ `crictl` 相同的容器运行时接口 (CRI) API 与容器引擎通信。\n\n### Pod 详情与日志\n\n使用 `crictl` 结合底层容器引擎来探索集群中运行的容器是非常有价值的，但这确实要求我们连接到运行容器的特定主机。很多时候，我们可以通过连接集群的\
  \ API 服务器，使用 `kubectl` 命令从任何地方检查 Pod，从而避免这一点。让我们回到 `host01` 并进一步探索 NGINX Pod。\n\n\
  在第 6 章中，我们看到了如何使用 `kubectl describe` 来查看集群节点的状态和事件日志。我们可以使用相同的命令查看其他 Kubernetes\
  \ 资源的状态和配置详情。这里是我们 NGINX Pod 的事件日志：\n\n```\n root@host01:~# kubectl describe pod\
  \ nginx\n\n Name:         nginx\n\n Namespace: ➊ default \n\n ...\n\n Containers:\n\
  \n   nginx:\n\n     Container ID:   containerd://9da09b3671418...\n\n ...\n\n➋ Type\
  \    Reason     Age   From               Message\n\n   ----    ------     ---- \
  \ ----               -------\n\n   Normal  Scheduled  22m   default-scheduler  Successfully\
  \ assigned ...\n\n   Normal  Pulling    22m   kubelet            Pulling image \"\
  nginx\"\n\n   Normal  Pulled     21m   kubelet            Successfully pulled image\
  \ ...\n\n   Normal  Created    21m   kubelet            Created container nginx\n\
  \n   Normal  Started    21m   kubelet            Started container nginx\n```\n\n\
  我们可以对许多不同的 Kubernetes 资源使用 `kubectl describe`，因此首先告诉 `kubectl` 我们对一个 Pod 感兴趣并提供名称。由于我们没有指定\
  \ Namespace，Kubernetes 将在默认 Namespace ➊ 中查找此 Pod。\n\n**注意**\n\n我们在书中的大多数示例中使用了默认\
  \ Namespace 以节省输入，但使用多个 Namespace 来保持应用程序分离是良好的做法，这既可以避免命名冲突，又能管理访问控制。我们将在第 11 章中更详细地查看\
  \ Namespace。\n\n`kubectl describe` 命令的输出提供了事件日志 ➋，当我们在启动容器时遇到问题时，这是查找问题的首选地方。\n\n\
  Kubernetes 在部署容器时需要几个步骤。首先，它需要将其调度到节点上，这要求该节点必须可用且具有足够的资源。然后，控制权移交给该节点上的 `kubelet`，它必须与容器引擎交互，以拉取镜像、创建容器并启动它。\n\
  \n容器启动后，`kubelet` 会收集标准输出和标准错误。我们可以通过 `kubectl logs` 命令查看此输出：\n\n```\nroot@host01:~#\
  \ kubectl logs nginx\n\n...\n\n2021/07/13 22:37:03 [notice] 1#1: start worker processes\n\
  \n2021/07/13 22:37:03 [notice] 1#1: start worker process 33\n\n2021/07/13 22:37:03\
  \ [notice] 1#1: start worker process 34\n```\n\n`kubectl logs` 命令始终指的是 Pod，因为 Pod\
  \ 是运行容器使用的的基础资源，而我们的 Pod 只有一个容器，因此我们只需要将 Pod 的名称作为单个参数传递给 `kubectl logs`。与之前一样，由于我们没有指定\
  \ Namespace，Kubernetes 将在默认 Namespace 中查找。\n\n即使容器已经退出，容器输出仍然可用，因此如果容器被成功拉取并启动后又崩溃，`kubectl\
  \ logs` 命令就是查找的地方。当然，我们必须希望容器打印了日志消息来解释它为什么崩溃。\n\nPod 显示为 `Running` 状态可能需要一些时间，特别是如果你刚刚设置好\
  \ Kubernetes 集群，它仍在忙于部署核心组件。请继续尝试运行此 `kubectl` 命令来检查状态。\n\n与其多次输入 `kubectl` 命令，你还可以使用\
  \ `watch`。`watch` 命令是观察集群随时间变化的极佳方法。只需在你的命令前加上 `watch`，它就会每隔两秒为你运行一次。\n\n我们在命令中添加了\
  \ `-o wide` 以查看此 Pod 的 IP 地址和节点分配。Kubernetes 会替我们管理这些。在这种情况下，Pod 被调度在 `host03` 上，因此我们需要去那里查看正在运行的容器：\n\
  \n```\nroot@host03:~# crictl pods --name nginx\n\nPOD ID         CREATED       \
  \  STATE  NAME   NAMESPACE  ...\n\n9f1d6e0207d7e  19 minutes ago  Ready  nginx \
  \ default    ...\n```\n\n在你的 NGINX Pod 所在的任何主机上运行此命令。\n\n如果通过收集 Pod ID，也可以看到容器：\n\
  \n```\nroot@host03:~# POD_ID=$(crictl pods -q --name nginx)\n\nroot@host03:~# crictl\
  \ ps --pod $POD_ID\n\nCONTAINER      IMAGE          CREATED         STATE    NAME\
  \   ...\n\n9da09b3671418  4cdc5dd7eaadf  20 minutes ago  Running  nginx  ...\n```\n\
  \n此输出与 列表 7-1 中 `kubectl get` 的输出非常相似，这并不意外，因为我们的集群是从运行在该节点上的 `kubelet` 服务获取这些信息的，而该服务反过来使用\
  \ `crictl` 相同的容器运行时接口 (CRI) API 与容器引擎通信。\n\n### Pod 详情与日志\n\n使用 `crictl` 结合底层容器引擎来探索集群中运行的容器是非常有价值的，但这确实要求我们连接到运行容器的特定主机。很多时候，我们可以通过连接集群的\
  \ API 服务器，使用 `kubectl` 命令从任何地方检查 Pod，从而避免这一点。让我们回到 `host01` 并进一步探索 NGINX Pod。\n\n\
  在第 6 章中，我们看到了如何使用 `kubectl describe` 来查看集群节点的状态和事件日志。我们可以使用相同的命令查看其他 Kubernetes\
  \ 资源的状态和配置详情。这里是我们 NGINX Pod 的事件日志：\n\n```\n root@host01:~# kubectl describe pod\
  \ nginx\n\n Name:         nginx\n\n Namespace: ➊ default \n\n ...\n\n Containers:\n\
  \n   nginx:\n\n     Container ID:   containerd://9da09b3671418...\n\n ...\n\n➋ Type\
  \    Reason     Age   From               Message\n\n   ----    ------     ---- \
  \ ----               -------\n\n   Normal  Scheduled  22m   default-scheduler  Successfully\
  \ assigned ...\n\n   Normal  Pulling    22m   kubelet            Pulling image \"\
  nginx\"\n\n   Normal  Pulled     21m   kubelet            Successfully pulled image\
  \ ...\n\n   Normal  Created    21m   kubelet            Created container nginx\n\
  \n   Normal  Started    21m   kubelet            Started container nginx\n```\n\n\
  我们可以对许多不同的 Kubernetes 资源使用 `kubectl describe`，因此首先告诉 `kubectl` 我们对一个 Pod 感兴趣并提供名称。由于我们没有指定\
  \ Namespace，Kubernetes 将在默认 Namespace ➊ 中查找此 Pod。\n\n**注意**\n\n我们在书中的大多数示例中使用了默认\
  \ Namespace 以节省输入，但使用多个 Namespace 来保持应用程序分离是良好的做法，这既可以避免命名冲突，又能管理访问控制。我们将在第 11 章中更详细地查看\
  \ Namespace。\n\n`kubectl describe` 命令的输出提供了事件日志 ➋，当我们在启动容器时遇到问题时，这是查找问题的首选地方。\n\n\
  Kubernetes 在部署容器时需要几个步骤。首先，它需要将其调度到节点上，这要求该节点必须可用且具有足够的资源。然后，控制权移交给该节点上的 `kubelet`，它必须与容器引擎交互，以拉取镜像、创建容器并启动它。\n\
  \n容器启动后，`kubelet` 会收集标准输出和标准错误。我们可以通过 `kubectl logs` 命令查看此输出：\n\n```\nroot@host01:~#\
  \ kubectl logs nginx\n\n...\n\n2021/07/13 22:37:03 [notice] 1#1: start worker processes\n\
  \n2021/07/13 22:37:03 [notice] 1#1: start worker process 33\n\n2021/07/13 22:37:03\
  \ [notice] 1#1: start worker process 34\n```\n\n`kubectl logs` 命令始终指的是 Pod，因为 Pod\
  \ 是运行容器使用的的基础资源，而我们的 Pod 只有一个容器，因此我们只需要将 Pod 的名称作为单个参数传递给 `kubectl logs`。与之前一样，由于我们没有指定\
  \ Namespace，Kubernetes 将在默认 Namespace 中查找。\n\n即使容器已经退出，容器输出仍然可用，因此如果容器被成功拉取并启动后又崩溃，`kubectl\
  \ logs` 命令就是查找的地方。当然，我们必须希望容器打印了日志消息来解释它为什么崩溃。\n\nPod 显示为 `Running` 状态可能需要一些时间，特别是如果你刚刚设置好\
  \ Kubernetes 集群，它仍在忙于部署核心组件。请继续尝试运行此 `kubectl` 命令来检查状态。\n\n与其多次输入 `kubectl` 命令，你还可以使用\
  \ `watch`。`watch` 命令是观察集群随时间变化的极佳方法。只需在你的命令前加上 `watch`，它就会每隔两秒为你运行一次。\n\n我们在命令中添加了\
  \ `-o wide` 以查看此 Pod 的 IP 地址和节点分配。Kubernetes 会替我们管理这些。在这种情况下，Pod 被调度在 `host03` 上，因此我们需要去那里查看正在运行的容器：\n\
  \n（抱歉，此处似乎重复了，直接回到后续翻译部分）\n\n## Deployments\n\n为了运行容器，我们需要一个 Pod，但这并不意味着我们通常想要直接创建\
  \ Pod。为了获得 Kubernetes 提供的伸缩性和故障转移，我们反而需要创建一个控制器来管理 Pod。我们将查看可以运行 Pod 的多个控制器，但让我们从常见的开始：Deployment。\n\
  \n#### 创建 Deployment\n\nDeployment 管理一个多个相同的 Pod。当我们创建 Deployment 时，我们提供一个 Pod 模板。Deployment\
  \ 然后通过 `ReplicaSet` 的帮助创建匹配模板的 Pod。\n\n#### Deployments 和 ReplicaSets\n\nKubernetes\
  \ 随着时间演进了它的控制器。第一种控制器类型 `ReplicationController` 只提供基本功能。它被 `ReplicaSet` 取代，后者在识别要管理的\
  \ Pod 方面有所改进。\n\n将 `ReplicationControllers` 替换为 `ReplicaSets` 的部分原因是它们变得越来越复杂，导致代码难以维护。新方法将控制职责分开：ReplicaSets\
  \ 负责基础 Pod 管理，包括监控 Pod 状态和执行故障转移。Deployments 负责跟踪由于配置更改或容器镜像更新引起的 Pod 模板变化。Deployments\
  \ 和 ReplicaSets 协同工作协同工作，但 Deployment 会创建自己的 `ReplicaSet`，因此我们通常只需要与 Deployments\
  \ 交互。由于这个原因，我泛泛地使用 *Deployment* 一词来指代由 `ReplicaSet` 提供的功能，例如监控 Pod 以提供请求的副本数量。\n\
  \n这里是我们将用于创建 NGINX Deployment 的 YAML 文件：\n\n*nginx-deploy.yaml*\n\n```yaml\n---\n\
  kind: Deployment\napiVersion: apps/v1\nmetadata:\n  ➊ name: nginx\nspec:\n  replicas:\
  \ 3\n  selector:\n    matchLabels:\n      app: nginx\n  template:\n    metadata:\n\
  \      ➋ labels:\n        app: nginx\n      ➌ spec:\n        containers:\n     \
  \   - name: nginx\n          image: nginx\n          ➍ resources:\n            requests:\n\
  \              cpu: \"100m\"\n```\n\n\n\nDeployments 属于 `apps` API 组，因此我们为 `apiVersion`\
  \ 中指定了 `apps/v1`。像每个 Kubernetes 资源一样，我们需要提供一个唯一的名称 ➊ 以将此 Deployment 与我们可能创建任何其他\
  \ Deployment 隔离开。\n\nDeployment 规范（specification）包含几个重要字段，让我们详细查看。`replicas` 字段告诉\
  \ Kubernetes 我们想要多少个相同的 `Pod` 实例。Kubernetes 将努力保持相应数量的 Pod 运行。下一个字段 `selector` 用于让\
  \ Deployment 能够找到它的 Pod。`matchLabels` 的内容必须与 `template.metadata.labels` 字段 ➋ 中的内容完全匹配，否则\
  \ Kubernetes 将拒绝该 Deployment。\n\n最后，`template.spec` ➌ 的内容将用作此 Deployment 创建的任何 Pod\
  \ 的规范。这里的字段可以包括我们能为 `Pod` 提供的任何配置。此配置与我们之前看过的 `nginx-pod.yaml` 匹配，但我们添加了 CPU 资源请求\
  \ ➍，以便稍后配置自动伸缩。\n\n让我们从这个 YAML 资源文件创建我们的 Deployment：\n\n```\nroot@host01:~# kubectl\
  \ apply -f /opt/nginx-deploy.yaml\n\ndeployment.apps/nginx created\n```\n\n我们可以通过\
  \ `kubectl get` 跟踪 Deployment 的状态：\n\n```\nroot@host01:~# kubectl get deployment\
  \ nginx\n\nNAME    READY   UP-TO-DATE   AVAILABLE   AGE\n\nnginx   3/3     3   \
  \         3           4s\n```\n\n当 Deployment 完全启动后，它将报告有三个副本已就绪并可用，这意味着我们现在有了三个由此\
  \ Deployment 管理的三个独立的 NGINX Pod：\n\n```\nroot@host01:~# kubectl get pods\n\nNAME\
  \                     READY   STATUS    RESTARTS   AGE\n\nnginx-6799fc88d8-6vn44\
  \   1/1     Running   0          18s\n\nnginx-6799fc88d8-dcwx5   1/1     Running\
  \   0          18s\n\nnginx-6799fc88d8-sh8qs   1/1     Running   0          18s\n\
  ```\n\n每个 Pod 的名称以 Deployment 的名称开头。Kubernetes 会添加一些随机字符来构建 ReplicaSet 的名称，随后是更多随机字符，以确保每个\
  \ Pod 都有唯一的名称。我们不需要直接创建或管理 ReplicaSet，但可以使用 `kubectl get` 来查看它：\n\n```\nroot@host01:~#\
  \ kubectl get replicasets\n\nNAME               DESIRED   CURRENT   READY   AGE\n\
  \nnginx-6799fc88d8   3         3         3       30s\n```\n\n尽管我们通常只与 Deployment\
  \ 交互，但了解 ReplicaSet 是重要的，因为在创建 Pod 时遇到的某些特定错误只会在 ReplicaSet 事件日志中报告。\n\nReplicaSet\
  \ 和 Pod 名称上的 `nginx` 前缀纯是为了方便。Deployment 并不使用名称来匹配它和 Pod。相反，它使用其选择器（selector）来匹配\
  \ Pod 上的标签。如果我们对三个 Pod 之一运行 `kubectl describe`，可以看到这些标签：\n\n```\nroot@host01:~#\
  \ kubectl describe pod nginx-6799fc88d8-6vn44\n\nName:         nginx-6799fc88d8-6vn44\n\
  \nNamespace:    default\n\n...\n\nLabels:       app=nginx\n\n...\n```\n\n这与 Deployment\
  \ 的选择器匹配：\n\n```\nroot@host01:~# kubectl describe deployment nginx\n\nName:    \
  \               nginx\n\nNamespace:              default\n\n...\n\nSelector:   \
  \            app=nginx\n\n...\n```\n\nDeployment 查询 API 服务器以识别匹配其选择器的 Pod。虽然 Deployment\
  \ 使用程序化 API，但后续示例中的 `kubectl get` 命令生成了类似的 API 服务器查询，这让我们有机会观察其工作原理：\n\n```\nroot@host01:~#\
  \ kubectl get all -l app=nginx\n\nNAME                     READY   STATUS    RESTARTS\
  \   AGE\n\nnginx-6799fc88d8-6vn44   1/1     Running   0          69s\n\nnginx-6799fc88d8-dcwx5\
  \   1/1     Running   0          69s\n\nnginx-6799fc88d8-sh8qs   1/1     Running\
  \   0          69s\n\nNAME                               DESIRED   CURRENT   READY\
  \   AGE\n\nreplicaset.apps/nginx-6799fc88d8   3         3         3       69s\n\
  ```\n\n在这种种情况下，使用 `kubectl get all` 允许我们列出多种不同类型的资源，只要它们匹配选择器即可。结果是，我们不仅看到了三个 Pod，还看到了由\
  \ Deployment 创建用于管理这些 Pod 的 ReplicaSet。\n\nDeployment 使用选择器而不是仅仅跟踪它创建的 Pod，这似乎很奇怪。但这种设计让\
  \ Kubernetes 更容易实现自愈。在任何时候，Kubernetes 节点可能会离线，或者我们可能会遇到网络分区，期间某些控制节点会失去与集群的连接。如果节点重新上线，或者集群在网络分区后需要重新组合，Kubernetes\
  \ 必须能够查看所有运行 Pod 的当前状态，并计算出实现所需状态需要哪些更改。这可能意味着，由于节点断开而启动了额外 Pod 的 Deployment，在节点重新连接时需要关闭一个\
  \ Pod，以便集群保持适当数量的副本。使用选择器避免了 Deployment 记住它创建过的所有 Pod（即使是故障节点上的 Pod）。\n\n### 监控与伸缩\n\
  \n由于 Deployment 监控它的 Pod 以确保我们拥有正确数量的副本，我们可以删除一个 Pod，它会被重新创建：\n\n```\nroot@host01:~#\
  \ kubectl delete nginx-6799fc88d8-6vn44\npod \"nginx-6799fc88d8-6vn44\" deleted\n\
  \nroot@host01:~# kubectl get pods\n\nNAME                     READY   STATUS   \
  \ RESTARTS   AGE\n\nnginx-6799fc88d8-dcwx5   1/1     Running   0          22s\n\n\
  nginx-6799fc88d8-sh8qs   1/1     Running   0          22s\n```\n\n一旦旧 Pod 被删除，Deployment\
  \ 会自动创建一个新 Pod ➊。同样，如果我们更改 Deployment 的副本数量，Pod 会自动更新。让我们增加另一个副本：\n\n```\nroot@host01:~#\
  \ kubectl scale --replicas=4 deployment nginx\n\ndeployment.apps/nginx scaled\n\n\
  root@host01:~# kubectl get pods\n\nNAME                     READY   STATUS    RESTARTS\
  \   AGE\n\nnginx-6799fc88d8-dcwx5   1/1     Running   0          45s\n\nnginx-6799fc88d8-sh8qs\
  \   1/1     Running   0          45s\n\nnginx-6799fc88d8-kk7r6   1/1     Running\
  \   0        5\n```\n\n第一个命令将副本数设置为 4。结果是，Kubernetes 需要启动 Pod 来满足我们的请求。我们可以通过更新\
  \ YAML 文件并重新运行 `kubectl apply` 来扩展 Deployment，也可以使用 `kubectl scale` 命令直接编辑 Deployment。无论何种方式，这都是声明式方法；我们正在更新\
  \ Deployment 的资源声明；然后 Kubernetes 更新实际状态以匹配声明。\n\n同样，缩小 Deployment 会导致 Pod 被自动删除：\n\
  \n```\nroot@host01:~# kubectl scale --replicas=2 deployment nginx\n\ndeployment.apps/nginx\
  \ scaled\n\nroot@host01:~# kubectl get pods\n\nNAME                     READY  \
  \ STATUS    RESTARTS   AGE\n\nnginx-6799fc88d8-dcwx5   1/1     Running   0     \
  \     55s\n\nnginx-6799fc88d8-sh8qs   1/1     Running   0          55s\n```\n\n\
  当我们缩减规模时，Kubernetes 会选择两个 Pod 终止。这些 Pod 需要一些时间来完成关闭，此时我们只剩下两个 NGINX Pod 在运行。\n\n\
  ### 自动伸缩\n\n对于接收用户真实请求的应用程序，我们会选择高质量应用所需的副本数量，同时尽可能缩小规模以减少应用程序所占用的资源。当然，应用程序的负载是不断变化的，持续监控应用程序的每个组件并对其进行独立伸缩是繁琐的。相反，我们可以使用\
  \ `HorizontalPodAutoscaler` 让集群为我们执行监控和伸缩。在这种情况下，“水平向”（horizontal）一词仅是指自动伸缩器可以更新由控制器管理的相同\
  \ Pod 的副本数量。\n\n\n\n要配置自动伸缩，我们创建一个引用我们的 `Deployment` 的新资源。随后，集群会监控 `Pods` 使用的资源，并根据需要重新配置\
  \ `Deployment`。我们可以使用 `kubectl autoscale` 命令为我们的 `Deployment` 添加一个 `HorizontalPodAutoscaler`，但使用\
  \ YAML 资源文件更好，这样我们可以将自动伸缩配置保留在版本控制之下。以下是该 YAML 文件：\n\n`nginx-scaler.yaml`\n\n```\n\
  \ ---\n\n➊ apiVersion: autoscaling/v2\n\n   kind: HorizontalPodAutoscaler\n\n  \
  \ metadata:\n\n     name: nginx\n     labels:\n       app: nginx\n   spec:\n\n \
  \ ➋ scaleTargetRef:\n       apiVersion: apps/v1\n       kind: Deployment\n     \
  \  name: nginx\n  ➌ minReplicas: 1\n     maxReplicas: 10\n     metrics:\n      \
  \ - type: Resource\n         resource:\n           name: cpu\n           target:\n\
  \             type: Utilization\n             averageUtilization: ➍ 50\n```\n\n\
  在 `metadata` 字段中，我们添加了标签 `app: nginx`。这不会改变资源的行为；它的唯一目的是确保当我们在 `kubectl get` 命令中使用\
  \ `app=nginx` 标签选择器时，该资源能够显示。这种用一致的元数据标记应用程序组件的方法是一种良好实践，有助于他人理解哪些资源是组合使用的，并使调试更容易。\n\
  \n此 YAML 配置使用了版本 2 的自动伸缩器配置 ➊。提供 API 资源组的新版本是 Kubernetes 在不丢失任何向后兼容性的情况下适应未来功能的方式。通常，在最终配置发布之前，会为新的资源组发布\
  \ alpha 和 beta 版本，并且 beta 版本与最终发布版本之间至少有一个版本的重叠，以实现无缝升级。\n\n自动伸缩器的第 2 版本支持多个资源。每个资源都用于计算对所需\
  \ `Pods` 数量的投票，数值最大的者胜出。对多个资源的支持需要更改 YAML 布局，这是 Kubernetes 维护者创建新资源版本的常见原因。\n\n\
  我们使用其 API 资源组、`kind` 和 `name` 将我们的 NGINX `Deployment` ➋ 指定为自动伸缩器的目标，这足以唯一标识 Kubernetes\
  \ 集群中的任何资源。然后，我们告诉自动伸缩器监控属于该 `Deployment` ➍ 的 `Pods` 的 CPU 利用率。自动伸缩器将努力使长期运行的 `Pods`\
  \ 的平均 CPU 利用率保持在 50% 左右，根据需要扩大或缩小。然而，副本数量永远不会超过我们指定的范围 ➌。\n\n让我们使用此配置创建我们的自动伸缩器：\n\
  \n```\nroot@host01:~# kubectl apply -f /opt/nginx-scaler.yaml\n\nhorizontalpodautoscaler.autoscaling/nginx\
  \ created\n```\n\n我们可以查询集群来查看它是否已创建：\n\n```\nroot@host01:~# kubectl get hpa\n\n\
  NAME    REFERENCE          TARGETS   MINPODS   MAXPODS   REPLICAS   AGE\n\nnginx\
  \   Deployment/nginx   0%/50%    1         10        3          96s\n```\n\n输出显示了自动伸缩器的目标引用、当前和所需的资源利用率，以及最大、最小和当前的副本数量。\n\
  \n我们使用 `hpa` 作为 `horizontalpodautoscaler` 的缩写。Kubernetes 允许我们使用单数或复数名称，并为其大多数资源提供了缩写以节省输入。例如，我们可以输入\
  \ `deploy` 来代表 `deployment`，甚至输入 `po` 来代表 `pods`。每一次额外的按键都很重要！\n\n自动伸缩器使用 `kubelet`\
  \ 已经从容器引擎收集的 CPU 利用率数据。这些数据由我们作为集群插件安装的 metrics 服务器集中管理。如果没有该集群插件，就不会有利用率数据，自动伸缩器也不会对\
  \ `Deployment` 进行任何更改。在这种情况下，由于我们没有真正使用我们的 NGINX 实例，它们没有消耗任何 CPU，因此 `Deployment`\
  \ 缩减到了单个 `Pod`，即我们指定的最小值：\n\n```\nroot@host01:~# kubectl get pods\n\nNAME      \
  \               READY   STATUS    RESTARTS   AGE\n\nnginx-6799fc88d8-dcwx5   1/1\
  \     Running   0          15m\n```\n\n自动伸缩器计算出只需要一个 `Pod`，并调整了 `Deployment` 以匹配。。随后，`Deployment`\
  \ 选择了一个 `Pod` 终止以达到所需的规模。\n\n为了准确性，如果 `Pod` 最近开始运行，自动伸缩器将不会使用其 CPU 数据，并且它有逻辑防止其过于频繁地放大或缩小，因此如果你非常快速地运行这些示例，可能需要等待几分钟才能看到它进行扩展。\n\
  \n我们在第 14 章 中详细探讨 Kubernetes 资源利用率指标。\n\n### 其他控制器\n\nDeployments 是最通用且常用的控制器，但\
  \ Kubernetes 还有其他实用的选项。在本节中，我们将探索 `Job` 和 `CronJobs`、`StatefulSets` 以及 `DaemonSets`。\n\
  \n#### Jobs 和 CronJobs\n\nDeploy 适用于应用程序组件，因为我们通常希望一个或多个实例无限运行。然而，对于我们需要运行命令（一次或按计划运行）的情况，可以使用\
  \ `Job`。主要区别在于 `Deployment` 确保任何停止运行的容器都会重启，而 `Job` 可以检查主进程的退出码，仅在退出码为非零（表示失败）时才重启。\n\
  \n`Job` 的定义看起来与 `Deployment` 非常相似：\n\n`sleep-job.yaml`\n\n```\n---\napiVersion:\
  \ batch/v1\n\nkind: Job\n\nmetadata:\n\n  name: sleep\n\nspec:\n\n  template:\n\
  \    spec:\n      containers:\n      - name: sleep\n        image: busybox\n   \
  \     command: \n          - \"/bin/sleep\"\n          - \"30\"\n      restartPolicy:\
  \ OnFailure\n```\n\n`restartPolicy` 可以设置为 `OnFailure`，在这种情况下，容器因非零退出码将重启；或者设置为 `Never`，在这种情况下无论退出码如何，`Job`\
  \ 将完成。\n\n我们可以创建并查看 `Job` 以及它创建的 `Pod`：\n\n```\nroot@host01:~# kubectl apply -f\
  \ /opt/sleep-job.yaml\n\njob.batch/sleep created\n\nroot@host01:~# kubectl get job\n\
  \nNAME    COMPLETIONS   DURATION   AGE\n\nsleep   0/1           3s         3s\n\n\
  root@host01:~# kubectl get pods\n\nNAME                     READY   STATUS    RESTARTS\
  \   AGE\n\n...\n\nsleep-fgcnz              1/1     Running   0          10s\n```\n\
  \n`Job` 根据 YAML 规范创建了一个 `Pod`。`Job` 反映 0/1，因为它正在等待 `Pod` 成功退出。\n\n当 `Pod` 运行 30\
  \ 秒后，它以 0 代码退出，表示成功，`Job` 和 `Pod` 的状态随之更新：\n\n```\nroot@host01:~# kubectl get jobs\n\
  \nNAME    COMPLETIONS   DURATION   AGE\n\nsleep   1/1           31s        40s\n\
  \nroot@host01:~# kubectl get pods\n\nNAME                     READY   STATUS   \
  \   RESTARTS   AGE\n\nnginx-65db7cf9c9-2wcng   1/1     Running     0          31m\n\
  \nsleep-fgcnz              0/1     Completed   0          43s\n```\n\n`Pod` 仍然可用，这意味着我们可以需要查看其日志，但它的状态为\
  \ `Completed`，因此 Kubernetes 不会尝试重启退出的容器。\n\n`CronJob` 是按计划创建 `Job` 的控制器。例如，我们可以设置\
  \ sleep `Job` 每天运行一次：\n\n`sleep-cronjob.yaml`\n\n```\n ---\n\n apiVersion: batch/v1\n\
  \n kind: CronJob\n\n metadata:\n\n   name: sleep\n\n spec:\n\n➊ schedule: \"0 3\
  \ * * *\"\n\n➋ jobTemplate: \n\n   spec:\n\n     template:\n       spec:\n     \
  \    containers:\n           - name: sleep\n            image: busybox\n       \
  \     command: \n              - \"/bin/sleep\"\n              - \"30\"\n      \
  \   restartPolicy: OnFailure\n```\n\n`Job` 规范的所有内容都嵌入在 `jobTemplate` 字段 ➋ 中。在此基础上，我们添加了遵循\
  \ Unix cron 命令格式的 `schedule` ➊。在这种情况下，0 3 * * * 表示每天凌晨 3:00 创建一个 `Job`。\n\n\n\n\
  Kubernetes 的设计原则之一是任何时候都可能发生故障。对于 `CronJob`，如果集群在 Job 计划调度期间出现问题，该 Job 可能无法被调度，或者可能会被调度两次，这意味着你应该以等等性（idempotent）的方式编写\
  \ Job，以便它们能够处理缺失或重复的调度。\n\n如果我们创建这个 `CronJob`：\n\n```\nroot@host01:~# kubectl apply\
  \ -f /opt/sleep-cronjob.yaml \n\ncronjob.batch/sleep created\n```\n\n它现在存在于集群中，但它并不会立即创建\
  \ Job 或 Pod：\n\n```\nroot@host01:~# kubectl get jobs\n\nNAME    COMPLETIONS   DURATION\
  \   AGE\n\nsleep   1/1           31s        2m32s\n\nroot@host01:~# kubectl get\
  \ pods\n\nNAME                     READY   STATUS      RESTARTS   AGE\n\nnginx-65db7cf9c9-2wcng\
  \   1/1     Running     0          33m\n\nsleep-fgcnz              0/1     Completed\
  \   0          2m23s\n```\n\n相反，`CronJob` 会在每次调度计划触发时创建一个新的 Job。\n\n### StatefulSets\n\
  \n到目前为止，我们一直在查看创建相同 Pod 的控制器。对于 `Deployments` 和 `Jobs`，我们并不真正关心哪个 Pod 是哪一个，或者它们部署在何处，只要我们在正确的时间运行足够的实例即可。然而，这并不总是符合我们想要的行为。例如，即使\
  \ `Deployment` 可以创建带有持久存储的 Pod，但该存储要么为每个新 Pod 是全新的，要么在所有 Pod 之间共享相同的存储。这与数据库之类的“主从”架构并不契合。对于这些情况，我们希望特定的存储绑定到特定的\
  \ Pod。\n\n同时，由于 Pod 可能会因为硬件故障或升级而变化，我们需要一种管理 Pod 替换的方法，以确保每个 Pod 都绑定到正确的存储上。这就是\
  \ `StatefulSet` 的目的。`StatefulSet` 用从零开始的数字标识每个 Pod，每个 Pod 都会接收匹配的持久存储。当 Pod 必须被替换时，新的\
  \ Pod 将分配相同的数字标识符并绑定到相同的存储。Pod 可以查看其主机名来确定标识，因此 `StatefulSet` 既适用于固定主实例的情况，也适用于动态选择主实例的情况。\n\
  \n我们将在接下来的章节中探索更多关于 Kubernetes StatefulSets 的细节，包括持久存储和 `Services`。在本章中，我们将查看一个\
  \ `StatefulSet` 的基本示例，并在引入其他重要概念时在此基础上进行扩展。\n\n对于这个简单的示例，让我们创建两个 Pod 并展示它们如何各自获得唯一的存储，即使在\
  \ Pod 被替换，这些存储也会保持不变。我们将使用这个 YAML 资源：\n\n`sleep-set.yaml`\n\n```yaml\n ---\n\n apiVersion:\
  \ apps/v1\n\n kind: StatefulSet\n\n metadata:\n\n    name: sleep\n\n spec:\n\n➊\
  \ serviceName: sleep \n   replicas: 2\n\n   selector:\n\n     matchLabels:\n   \
  \    app: sleep\n   template:\n     metadata:\n\n       labels:\n         app: sleep\n\
  \     spec:\n       containers:\n\n         - name: sleep\n           image: busybox\n\
  \           command: \n             - \"/bin/sleep\"\n             - \"3600\"\n\
  \        ➋ volumeMounts: \n             - name: sleep-volume\n               mountPath:\
  \ /storagedir\n➌ volumeClaimTemplates: \n     - metadata:\n         name: sleep-volume\n\
  \       spec:\n         storageClassName: longhorn\n         accessModes:\n    \
  \       - ReadWriteOnce\n         resources:\n           requests:\n           \
  \  storage: 10Mi\n```\n\n与 `Deployment` 或 `Job` 相比，这里有几个重要的区别。首先，我们必须声明 `serviceName`\
  \ 将此 `StatefulSet` 绑定到 Kubernetes `Service` ➊。该连接用于为每个 Pod 创建域名服务 (DNS) 条目。我们还必须提供供\
  \ `StatefulSet` 使用的模板来请求持久存储 ➌，然后告诉 Kubernetes 在我们的容器中挂载该存储 ➋。\n\n自动化脚本安装的实际 `sleep-set.yaml`\
  \ 文件包含了 sleep `Service` 定义。我们将在 第 9 章 中详细介绍 `Services`。\n\n让我们创建 sleep `StatefulSet`：\n\
  \n```\nroot@host01:~# kubectl apply -f /opt/sleep-set.yaml\n```\n\n`StatefulSet`\
  \ 创建了两个 Pod：\n\n```\nroot@host01:~# kubectl get statefulsets\n\nNAME    READY  \
  \ AGE\n\nsleep   2/2     1m0s\n\nroot@host01:~# kubectl get pods\n\nNAME      READY\
  \   STATUS    RESTARTS   AGE\n\nsleep-0   1/1     Running   0          30s\nsleep-1\
  \   1/1     Running   0          30s\n```\n\n`StatefulSet` 用数字标识每个 Pod。让我们查看它们的主机名来确定标识：\n\
  \n```\nroot@host01:~# kubectl exec sleep-0 -- hostname\nsleep-0\n\nroot@host01:~#\
  \ kubectl exec sleep-1 -- hostname\nsleep-1\n```\n\n现在，我们将主机名写入每个 Pod 的文件中以验证其工作正常：\n\
  \n```\nroot@host01:~# kubectl exec sleep-0 -- hostname > /storagedir/hostname\n\
  root@host01:~# kubectl exec sleep-1 -- hostname > /storagedir/hostname\n\nroot@host01:~#\
  \ kubectl exec sleep-0 -- cat /storagedir/hostname\nsleep-0\n\nroot@host01:~# kubectl\
  \ exec sleep-1 -- cat /storagedir/hostname\nsleep-1\n```\n\n现在让我们删除其中一个 Pod，并看看\
  \ `StatefulSet` 如何替换它：\n\n```\nroot@host01:~# kubectl delete pod sleep-0\npod \"\
  sleep-0\" deleted\n\nroot@host01:~# kubectl get pods\n\nNAME      READY   STATUS\
  \    RESTARTS   AGE\n\nsleep-0   0/1     Terminating 0\n\nsleep-1   1/1     Running\
  \   0          1m\n```\n\n一个新的 Pod 被创建了：\n\n```\nroot@host01:~# kubectl get pods\n\
  \nNAME      READY   STATUS    RESTARTS   AGE\n\nsleep-0   1/1     Running   0  \
  \        5s\nsleep-1   1/1     Running   0          1m\n```\n\n新的 Pod 被分配相同的相同的标识并绑定到相同的存储。我们可以通过检查文件来验证这一点：\n\
  \n```\nroot@host01:~# kubectl exec sleep-0 -- cat /storagedir/hostname\nsleep-0\n\
  ```\n\n### Daemon Sets\n\n`DaemonSet` 控制器与 `StatefulSet` 的相似之处在于它也会运行特定数量的 Pod，且每个\
  \ Pod 都有唯一的标识。然而，`DaemonSet` 在每个节点上恰运行一个 Pod，这主要用于集群的控制平面和插件组件，例如网络或存储插件。\n\n我们的集群已经安装了多个\
  \ `DaemonSets`，让我们看看已经在运行的 `calico-node` `DaemonSet`，它在每个节点上运行以为该节点上的所有容器提供网络配置。\n\
  \n`calico-node` `DaemonSet`  `calico-system` 空间，因此我们将指定该空间来请求有关 `DaemonSet` 的信息：\n\
  \n```\nroot@host01:~# kubectl -n calico-system get daemonsets\n\nNAME          DESIRED\
  \   CURRENT   READY   UP-TO-DATE   AVAILABLE   ...\n\ncalico-node   3         3\
  \         3       3            3           ...\n```\n\n我们的集群有三个节点，因此 `calico-node`\
  \ `DaemonSet` 创建了三个实例。这是该 `DaemonSet` 的 YAML 格式配置：\n\n```\nroot@host01:~# kubectl\
  \ -n calico-system get daemonset calico-node -o yaml\n\napiVersion: apps/v1\n\n\
  kind: DaemonSet\n\nmetadata:\n\n...\n\n  name: calico-node\n\n  namespace: calico-system\n\
  \n...\n\nspec:\n\n...\n\n  selector:\n\n    matchLabels:\n\n      k8s-app: calico-node\n\
  \n...\n```\n\n`kubectl get` 的 `-o yaml` 参数会以 YAML 格式打印一个或多个资源的配置和状态，允许我们详细检查 Kubernetes\
  \ 资源。\n\n此 `DaemonSet` 的选择器期望一个名为 `k8s-app` 的标签设置为 `calico-node`。我们可以利用这一点来只显示由该\
  \ `DaemonSet` 创建的 Pod：\n\n\n\n\n\n```\nroot@host01:~# kubectl -n calico-system get\
  \ pods \\\n\n  -l k8s-app=calico-node -o wide\n\nNAME                READY   STATUS\
  \   ... NODE   ...\n\ncalico-node-h9kjh   1/1     Running  ... host01 ...\n\ncalico-node-rcfk7\
  \   1/1     Running  ... host03 ...\n\ncalico-node-wj876   1/1     Running  ...\
  \ host02 ...\n```\n\n`DaemonSet` 创建了三个 `Pods`，每个 `Pod` 都被分配到集群中的一个节点。如果我们向集群中添加额外的节点，`DaemonSet`\
  \ 也会在这些节点上调度一个 `Pod`。\n\n### 结语\n\n本章从普通集群用户的角度探索了 Kubernetes，创建了控制器（controllers），由控制器反过来创建带有容器的\
  \ `Pods`。掌握控制器资源类型的核心知识对于构建我们的应用程序至关重要。同时，重要的是记住，Kubernetes 使用了我们在第一部分中探索过的容器技术。\n\
  \n容器技术的一个关键方面是能够将容器隔离在独立的网络命名空间中。在 Kubernetes 集群中运行容器为网络带来了额外要求，因为我们现在需要连接运行在不同集群节点上的容器。在下一章中，我们将通过查看叠加网络（overlay\
  \ networks）来考虑这一目标的多种方法。\n\n## 8 叠加网络 (OVERLAY NETWORKS)\n\n![image](img/common01.jpg)\n\
  \n当所有容器都在单个主机上时，容器网络已经足够复杂，正如我们在第 4 章中所看到的。当我们扩展到所有都运行容器的节点集群时，复杂性大大增加。我们不仅必须为每个容器提供自己的虚拟网络设备并管理\
  \ IP 地址（在创建容器时动态创建新的网络命名空间和设备），还需要确保位于一个节点上的容器可以与所有其他节点上的容器通信。\n\n在本章中，我们将描述如何使用`overlay\
  \ networks`在整个 Kubernetes 集群的所有节点上提供单一容器网络的外观效果。我们将考虑两种跨越宿主机网络路由容器流量的不同方法，并检查每种方法的网络配置和流量流。最后，我们将探索\
  \ Kubernetes 如何使用`容器网络接口 (CNI)` 标准作为独立的插件来配置网络，从而在新技术可用时易于切换，并在需要时允许自定义解决方案。\n\n\
  ### 集群网络\n\nKubernetes 集群的根本目标是将一组主机（物理或虚拟机器）视为单一计算资源，并根据需要分配以运行容器。从网络角度来看，这意味着\
  \ Kubernetes 应该能够将 `Pod` 调度到任何节点，而无必担心与其他节点上 `Pods` 的连通性。这意味着 Kubernetes 还应该有一种方式为\
  \ `Pods` 动态分配 IP 地址，以支持这种跨集群的网络连通。\n\n正如我们在本章中看到的，Kubernetes 使用插件设计，允许任何兼容的网络软件分配\
  \ IP 地址并提供跨节点网络连接。所有插件必须遵循两个重要规则。首先，`Pod` IP 地址应该来自单一 IP 地址池，尽管该池可以按节点进行划分。这意味着无论\
  \ `Pods` 运行在哪里，我们都可以将所有 `Pods` 视为单一网络的一部分。其次，流量应该是路由的，以便所有 `Pods` 都能看到所有其他 `Pods`\
  \ 和控制平面。\n\n### CNI 插件\n\n插件使用 `CNI` 标准与 Kubernetes 集群（特别是 `kubelet`）进行通信。`CNI`\
  \ 规定了 `kubelet` 如何查找和调用 `CNI` 插件。当创建新的 `Pod` 时，`kubelet` 首先分配网络命名空间。然后它调用 `CNI`\
  \ 插件，并向其提供网络命名空间的引用。`CNI` 插件向命名空间中添加网络设备，分配 IP 地址，并将该 IP 地址传回 `kubelet`。\n\n让我们来看看这个过程。为了实现这一点，本章的示例包含了两个带有不同\
  \ `CNI` 插件的不同环境：`Calico` 和 `WeaveNet`。这两个插件都为 `Pods` 提供网络，但跨节点网络方式不同。我们将从 `Calico`\
  \ 环境开始。\n\n**注意**\n\n*本书的示例仓库位于 [`github.com/book-of-kubernetes/examples`](https://github.com/book-of-kubernetes/examples)。请参阅第\
  \ xx 页上的“运行示例”获取设置详情。*\n\n默认情况下，`CNI` 插件信息保存在 `/etc/cni/net.d` 中。我们可以在该目录下看到 `Calico`\
  \ 配置：\n\n```\nroot@host01:~# ls /etc/cni/net.d\n\n10-calico.conflist  calico-kubeconfig\n\
  ```\n\n`10-calico.conflist` 文件包含实际的 `Calico` 配置。`calico-kubeconfig` 文件用于 `Calico`\
  \ 组件与控制平面进行验证；它是根据 `Calico` 安装期间创建的服务账户创建的。文件名带有 `10-` 前缀是因为 `kubelet` 会对找到的任何配置文件进行排序并使用第一个。\n\
  \n列表 8-1 显示了配置文件，它采用 JSON 格式并标识了要使用的网络插件。\n\n```\nroot@host01:~# cat /etc/cni/net.d/10-calico.conflist\n\
  \n{\n  \"name\": \"k8s-pod\",\n  \"cniVersion\": \"0.3.1\",\n  \"plugins\": [\n\
  \    {\n      \"type\": \"calico\"\n    },\n    {\n      \"type\": \"bandwidth\"\
  ,\n      \"capabilities\": [\"portMappings\"]\n    },\n\n    {\n      \"type\":\
  \ \"portmap\",\n      \"capabilities\": [\"snat\"]\n    }\n  ]\n}\n```\n*列表 8-1:\
  \ Calico 配置*\n\n最重要的字段是 `type`；它指定了要运行的插件。在这种情况下，我们运行三个插件：`calico` 处理 Pod 网络；`bandwidth`\
  \ 我们可以用它配置网络限制；以及 `portmap` 将端口暴露到宿主机网络。\n\n为了运行这些插件，`kubelet` 需要知道它们在哪里。插件执行文件的默认位置是\
  \ `/opt/cni/bin`，插件名称与 `type` 字段匹配：\n\n```\nroot@host01:~# ls /opt/cni/bin\n\nbandwidth\
  \  calico-ipam  flannel     install   macvlan  sbr     vlan\n\nbridge     dhcp \
  \        host-device  ipvlan    portmap  static\n```\n\n在这里，我们看到了由 `kubeadm` 与 Kubernetes\
  \ 集一起安装的常用插件。我们还看到了 `calico`，它是我们在集群初始化后通过 `Calico` `DaemonSet` 添加到此目录的。\n\n###\
  \ Pod 网络\n\n让我们来看一个 `Pod` 示例，以观察 `CNI` 插件是如何配置网络命名空间的。这与我们在第 4 章中所做的工作非常相似，在命名空间中添加虚拟网络设备以便容器之间以及与主机之间的通信。\n\
  \n让我们创建一个基础 `Pod`：\n\n*pod.yaml*\n\n```yaml\n---\napiVersion: v1\nkind: Pod\nmetadata:\n\
  \  name: pod\nspec:\n  containers:\n  - name: pod\n    image: busybox\n    command:\
  \ \n      - \"sleep\"\n      - \"infinity\"\n  nodeName: host01\n```\n\n我们添加了额外的字段\
  \ `nodeName` 来强制该 `Pod` 运行在 `host01`，这有助于我们查找和查看其网络配置。\n\n我们通过常规命令启动 `Pod`：\n\n\
  ```\nroot@host01:~# kubectl apply -f /opt/pod.yaml\n\npod/pod created\n```\n\n接下来检查其正在运行：\n\
  \n```\nroot@host01:~# kubectl get pods\n\nNAME   READY   STATUS    RESTARTS   AGE\n\
  \npod    1/1     Running   0          2m32s\n```\n\n\n\n\n\n```\nroot@host01:~#\
  \ POD_ID=$(crictl pods --name pod -q)\n\nroot@host01:~# echo $POD_ID\n\nb7d2391320e07f97add7ccad2ad1a664393348f1dcb6f803f701318999ed0295\n\
  ```\n\n此时，使用 `Pod ID`，我们可以找到它的网络命名空间。在列表 8-2 中，我们使用 `jq` 来提取我们想要的数据，就像我们在第 4 章中做的那样。我们将将其赋值给变量。\n\
  \n```\nroot@host01:~# NETNS_PATH=$(crictl inspectp $POD_ID |\n\n  jq -r '.info.runtimeSpec.linux.namespaces[]|select(.type==\"\
  network\").path')\n\nroot@host01:~# echo $NETNS_PATH\n\n/var/run/netns/cni-7cffed61-fb56-9be1-0548-4813d4a8f996\n\
  \nroot@host01:~# NETNS=$(basename $NETNS_PATH)\n\nroot@host01:~# echo $NETNS\n\n\
  cni-7cffed61-fb56-9be1-0548-4813d4a8f996\n```\n\n*列表 8-2：网络命名空间*\n\n我们现在可以探索网络命名空间，查看\
  \ Calico 如何为此 Pod 设置 IP 地址和网络路由。首先，正如预期的，这个网络命名空间正在被我们的 Pod 使用：\n\n```\nroot@host01:~#\
  \ ps $(ip netns pids $NETNS)\n\n    PID TTY      STAT   TIME COMMAND\n\n  35574\
  \ ?        Ss     0:00 /pause\n\n  35638 ?        Ss     0:00 sleep infinity\n```\n\
  \n我们看到了两个预期的进程。第一个是每次创建 Pod 时都会创建的暂停 容器（pause container），这是一个用于持有网络命名空间的永久容器。第二个是我们在\
  \ Pod YAML 文件中配置的运行 `sleep` 的 BusyBox 容器。\n\n现在，让我们来看看配置的网络接口：\n\n```\nroot@host03:~#\
  \ ip netns exec $NETNS ip addr\n\n1: lo: <LOOPBACK,UP,LOWER_UP> mtu 65536 qdisc\
  \ noqueue state UNKNOWN ...\n\n    link/loopback 00:00:00:00:00:00 brd 00:00:00:00:00:00\n\
  \n    inet 127.0.0.1/8 scope host lo\n\n       valid_lft forever preferred_lft forever\n\
  \n    inet6 ::1/128 scope host \n       valid_lft forever preferred_lft forever\n\
  \n3: ➊ eth0@if16: <BROADCAST,MULTICAST,UP,LOWER_UP> mtu 1450 ... state UP ...\n\n\
  \    link/ether 7a:9e:6c:e2:30:47 brd ff:ff:ff:ff:ff:ff link-netnsid 0\n\n    inet\
  \ ➋ 172.31.239.205/32 brd 172.31.25.202 scope global eth0\n\n       valid_lft forever\
  \ preferred_lft forever\n\n    inet6 fe80::789e:6cff:fee2:3047/64 scope link \n\
  \       valid_lft forever preferred_lft forever\n```\n\nCalico 在网络命名空间 ➊ 中创建了网络设备\
  \ `eth0@if16`，并赋予它 IP 地址 172.31.239.205 ➋。注意，该 IP 地址的网络长度为 `/32`，这意味着任何流量必须通过配置的路由器。这与我们在第\
  \ 4 章中桥接容器网络的工作方式不同。这是为了让 Calico 能够通过网络策略提供防火墙功能。\n\n此 Pod IP 地址的选择最终由 Calico 决定。Calico\
  \ 配置了 `172.31.0.0/16` 作为 Pod 的 IP 地址空间。Calico 决定如何在节点之间划分此地址空间，然后从分配给节点的范围内为每个 Pod\
  \ 分配 IP 地址。随后 Calico 将此 IP 地址传回给 `kubelet`，以便更新 Pod 的状态：\n\n```\nroot@host01:~#\
  \ kubectl get pods -o wide\n\nNAME   READY   STATUS    RESTARTS   AGE   IP     \
  \           NODE    ...\n\npod    1/1     Running   0          16m   172.31.239.205\
  \   host01   ...\n```\n\n当 Calico 在 Pod 中创建网络接口时，它是作为虚拟以太网 (`veth`) 对的一部分创建的。`veth`\
  \ 对充当虚拟网线，创建到根命名空间中网络接口的连接，允许 Pod 外部连接。列表 8-3 让我们查看 veth 对的两个部分。\n\n```\nroot@host01:~#\
  \ ip netns exec $NETNS ip link\n\n1: lo: <LOOPBACK,UP,LOWER_UP> mtu 65536 qdisc\
  \ noqueue state UNKNOWN ...\n\n    link/loopback 00:00:00:00:00:00 brd 00:00:00:00:00:00\n\
  \n    inet 127.0.0.1/8 scope host lo\n\n       valid_lft forever preferred_lft forever\n\
  \n    inet6 ::1/128 scope host \n       valid_lft forever preferred_lft forever\n\
  \n3: ➊ eth0@if16: <BROADCAST,MULTICAST,UP,LOWER_UP> mtu 1450 ... state UP ...\n\n\
  \    link/ether 7a:9e:6c:e2:30:47 brd ff:ff:ff:ff:ff:ff link-netnsid 0\n\n    inet\
  \ ➋ 172.31.239.205/32 brd 172.31.25.202 scope global eth0\n\n       valid_lft forever\
  \ preferred_lft forever\n\n    inet6 fe80::789e:6cff:fee2:3047/64 scope link \n\
  \       valid_lft forever preferred_lft forever\n\n4: ➋ vethXXXX: <BROADCAST,MULTICAST,UP,LOWER_UP>\
  \ mtu 1500 state UNKNOWN ...\n\n    link/ether 00:00:0e:67:00:01 brd ff:ff:ff:ff:ff\n\
  \n    inet 172.31.2.0.002332eth0\n       valid_lft. preferred_lft forever\n\n  \
  \  inet6 fe80::xxxx:xxxx/64 \n       valid_lft\n preferred_lft forever\n```\n*列表\
  \ 8-3：网络命名空间*\n\n我们现在可以探索网络命名空间，查看 Calico 如何为此 Pod 设置 IP 地址和网络路由。首先，正如预期的，这个网络命名空间正在被我们的\
  \ Pod 使用：\n\n```\nroot@host01:~# ps $(ip netns pids $NETNS)\n\n    PID TTY     \
  \ STAT   TIME COMMAND\n\n  35574 ?        Ss     0:00 /pause\n\n  35638 ?      \
  \  Ss     0:00 sleep infinity\n```\n\n我们看到了两个预期的进程。第一个是每次创建 Pod 时都会创建的暂停 容器（pause\
  \ container），这是一个用于持有网络命名空间的永久容器。第二个是我们在 Pod YAML 文件中配置的运行 `sleep` 的 BusyBox 容器。\n\
  \n现在，让我们来看看配置的网络接口：\n\n```\nroot@host03:~# ip netns exec $NETNS ip addr\n\n1: lo:\
  \ <LOOPBACK,UP,LOWER_UP> mtu 65536 qdisc noqueue state UNKNOWN ...\n\n    link/loopback\
  \ 00:00:00:00:00:00 brd 00:00:00:00:00:00\n\n    inet 127.0.0.1/8 scope host lo\n\
  \n       valid_lft forever preferred_lft forever\n\n    inet6 ::1/128 scope host\
  \ \n       valid_lft forever preferred_lft forever\n\n3: ➊ eth0@if16: <BROADCAST,MULTICAST,UP,LOWER_UP>\
  \ mtu 1450 ... state UP ...\n\n    link/ether 7a:9e:6c:e2:30:47 brd ff:ff:ff:ff:ff:ff\
  \ link-netnsid 0\n\n    inet ➋ 172.31.239.205/32 brd 172.31.25.202 scope global\
  \ eth0\n\n       valid_lft forever preferred_lft forever\n\n    inet6 fe80::789e:6cff:fee2:3047/64\
  \ scope link \n       valid_lft forever preferred_lft forever\n```\n\nCalico 在网络命名空间\
  \ ➊ 中创建了网络设备 `eth0@if16`，并赋予它 IP 地址 172.31.239.205 ➋。注意，该 IP 地址的网络长度为 `/32`，这意味着任何流量必须通过配置的路由器。这与我们在第\
  \ 4 章中桥接容器网络的工作方式不同。这是为了让 Calico 能够通过网络策略提供防火墙功能。\n\n此 Pod IP 地址的选择最终由 Calico 决定。Calico\
  \ 配置了 `172.31.0.0/16` 作为 Pod 的 IP 地址空间。Calico 决定如何在节点之间划分此地址空间，然后从分配给节点的范围内为每个 Pod\
  \ 分配 IP 地址。随后 Calico 将此 IP 地址传回给 `kubelet`，以便更新 Pod 的状态：\n\n```\nroot@host01:~#\
  \ kubectl get pods -o wide\n\nNAME   READY   STATUS    RESTARTS   AGE   IP     \
  \           NODE    ...\n\npod    1/1     Running   0          16m   172.31.239.205\
  \   host01   ...\n```\n\n当 Calico 在 Pod 中创建网络接口时，它是作为虚拟以太网 (`veth`) 对的一部分创建的。`veth`\
  \ 对充当虚拟网线，创建到根命名空间中网络接口的连接，允许 Pod 外部连接。列表 8-3 让我们查看 veth 对的两个部分。\n\n```\nroot@host01:~#\
  \ ip netns exec $NETNS ip link\n\n1: lo: <LOOPBACK,UP,LOWER_UP> mtu 65536 qdisc\
  \ noqueue state UNKNOWN ...\n\n    link/loopback 00:00:00:00:00:00 brd 00:00:00:00:00:00\n\
  \n    inet 127.0.0.1/8 scope host lo\n\n       valid_lft forever preferred_lft forever\n\
  \n    inet6 ::1/128 scope host \n       valid_lft forever preferred_lft forever\n\
  \n3: ➊ eth0@if16: <BROADCAST,MULTICAST,UP,LOWER_UP> mtu 1450 ... state UP ...\n\n\
  \    link/ether 7a:9e:6c:e2:30:47 brd ff:ff:ff:ff:ff:ff link-netnsid 0\n\n    inet\
  \ ➋ 172.31.239.205/32 brd 172.31.25.202 scope global eth0\n\n       valid_lft forever\
  \ preferred_lft forever\n\n    inet6 fe80::789e:6cff:fee2:3047/64 scope link \n\
  \       valid_lft forever preferred_lft forever\n\n4: ➋ vethXXXX: <BROADCAST,MULTICAST,UP,LOWER_UP>\
  \ mtu 1500 state UNKNOWN ...\n\n    link/ether 00:00:0e:67:00:01 brd ff:ff:ff:ff:ff\n\
  \n    inet 172.31.239.205/32 scope global vethXXXX\n       valid_lft forever preferred_lft\
  \ forever\n\n    inet6 fe80::xxxx:xxxx:xxxx/64 scope link \n       valid_lft forever\
  \ preferred_lft forever\n```\n\n\n\n\n在这些 Pods 运行之后，我们需要收集它们的 IP 地址：\n\n```\nroot@host01:~#\
  \ IP1=$(kubectl get po pod1 -o json | jq -r '.status.podIP')\n\nroot@host01:~# IP2=$(kubectl\
  \ get po pod2 -o json | jq -r '.status.podIP')\n\nroot@host01:~# echo $IP1\n\n172.31.239.216\n\
  \nroot@host01:~# echo $IP2\n\n172.31.89.197\n```\n\n我们能够使用简单的 `jq` 过滤器提取 Pod IP，是因为我们的\
  \ `kubectl get` 命令保证只返回一个项目。如果我们在不带过滤器的情况下运行 `kubectl get`，或者使用一个可能匹配多个 Pods 的过滤器，JSON\
  \ 输出将是一个列表，我们需要相应地更改 `jq` 过滤器。\n\n让我们快速验证一下这两个 Pods 之间是否存在连通性：\n\n```\nroot@host01:~#\
  \ kubectl exec -ti pod1 -- ping -c 3 $IP2\n\nPING 172.31.89.197 (172.31.89.197):\
  \ 56 data bytes\n\n64 bytes from 172.31.89.197: seq=0 ttl=62 time=2.867 ms\n\n64\
  \ bytes from 172.31.89.197: seq=1 ttl=62 time=0.916 ms\n\n64 bytes from 172.31.89.197:\
  \ seq=2 ttl=62 time=1.463 ms\n\n--- 172.31.89.197 ping statistics ---\n\n3 packets\
  \ transmitted, 3 packets received, 0% packet loss\n\nround-trip min/avg/max = 0.916/1.748/2.867\
  \ ms\n```\n\n`ping` 命令显示所有三个数据包都成功到达，因此我们知道 Pods 可以跨节点通信。\n\n与我们之前的示例一样，每个 Pods\
  \ 都有一个网络长度为 `/32` 的网络接口，这意味着所有流量必须通过路由器。例如，这里是 `pod1` 的 IP 配置和路由表：\n\n```\nroot@host01:~#\
  \ kubectl exec -ti pod1 -- ip addr\n\n...\n\n3: eth0@if17: <BROADCAST,MULTICAST,UP,LOWER_UP,M-DOWN>\
  \ mtu 1450 qdisc noqueue \n\n    link/ether f2:ed:e8:04:00:cc brd ff:ff:ff:ff:ff:ff\n\
  \n    inet 172.31.239.216/32 brd 172.31.239.216 scope global eth0\n\n...\n\nroot@host01:~#\
  \ kubectl exec -ti pod1 -- ip route\n\ndefault via 169.254.1.1 dev eth0 \n\n169.254.1.1\
  \ dev eth0 scope link\n```\n\n基于此配置，当我们运行 `ping` 命令时，网络堆栈识别出目标 IP 并不是任何接口的本地地址。因此，它会在地址解析协议（ARP）表中查找\
  \ `169.254.1.1` 以确定将“下一跳”发送到哪里。如果我们尝试在容器内或主机上寻找地址为 `169.254.1.1` 的接口，将无法成功。Calico\
  \ 并没有真正将该地址分配给接口，而是配置了“代理 ARP”，以便数据包能通过 `veth` 对的 `eth0` 端发送。结果是容器内部 ARP 表中存在 `169.254.1.1`\
  \ 的条目：\n\n```\nroot@host01:~# kubectl exec -ti pod1 -- arp -n\n(169.254.1.1) at\
  \ ee:ee:ee:ee:ee [ether] on eth0\n```\n\n如列表 8 所示，硬件地址 `ee:ee:ee:ee:ee` 属于 `veth`\
  \ 对的主机端，因此足够将数据包排出容器进入根网络。从那里开始，IP 路由接管。Calico 已经配置了路由表，根据目标 IP 范围将包发送到其他节点，并根据\
  \ IP 地址将包发送到本地容器。我们可以在主机的路由表中看到结果：\n\n```\nroot@host01:~# ip route\n\n172.31.25/26\
  \ via 192.168.61.13 dev p0s8 proto 80\n172.31.89/26 via 192.168.61.12 dev p0s8 proto\
  \ 80\n172.31.239.216/32 dev lo scope host\n192.168.61.0/24 dev eth0\n```\n\n因为 `ping`\
  \ 的目标地址在 `172.31.89/26` 范围内，包现在被路由到 `192.168.61.12`，即 `host02`。让我们查看 `host02` 上的路由表以便跟踪：\n\
  \n```\nroot@host02:~# ip route\n\n172.31.25/26 via 192.168.61.11 dev p0s8 proto\
  \ 80\n172.31.89/26 via 192.168.61.13 dev p0s8 proto 80\n172.31.239.197/32 dev lo\
  \ scope host\n192.168.61.0/24 dev eth0\n```\n\n如果你想亲自运行此命令，请从 `host02` 运行。当包到达 `host02`\
  \ 时，它有一个指向 `ping` 目的地的路由。路由将包发送到连接到 `pod2` 的 `veth` 对。现在 `ping` 到达了，`pod2` 内部的网络堆栈发送回复。回复通过相同的进程到达\
  \ `host02` 网络。根据 `host02` 的路由表，它被发送到 `host01`，那里 `172.31.239.216` 的路由条目将其发送到相应的容器。\n\
  \n由于 Calico 使用第三层路由，主机网络可以看到实际的容器 IP。我们可以通过 `tcpdump` 确认这一点。我们将回到 `host01`。首先，在后台启动\
  \ `tcpdump`：\n\n```\nroot@host01:~# tcpdump -n -w pings.cap -i icmp &\n[1] 70949\n\
  tcpdump: listening on any ...\n```\n\n`-n` 告诉 `tcpdump` 避免查找 IP 主机名；这节省了时间。`-w pings.cap`\
  \ 告诉 `tcpdump` 将数据写入文件 `pings.cap`；`-i any` 告诉它监听所有网络接口；`icmp` 过滤器告诉它只监听 ICMP 流量；最后的\
  \ `&` 将其放入后台。`.pcap` 文件名很重要，因为我们的 Ubuntu 主机仅允许 `tcpdump` 读取该扩展名的文件。现在，再次运行 `ping`：\n\
  \n```\nroot@host01:~# kubectl exec -ti pod1 -- ping -c 3 $IP2\n\n...\n\n3 packets\
  \ transmitted, 3 packets received, 0% packet loss\n\nround-trip min/avg/max = 928/991/115\
  \ ms\n```\n\nICMP 请求和回复已被收集，但它们被缓存在内存中。为了将它们转储到文件，我们将关闭 `tcpdump`：\n\n```\nroot@host01:~#\
  \ killall tcpdump\n\n12 packets captured\n12 packets received by filter\n0 packets\
  \ dropped by kernel\n```\n\n共有三个 `ping`，每个 `ping` 包含一个请求和一个回复。因此，我们可能预期六个包，但实际上捕获了\
  \ 12 个。为了查看原因，让我们打印 `tcpdump` 收集的包详情：\n\n```\nroot@host01:~# tcpdump -en pings.cap\n\
  \nreading from file pings.cap, link-type LINUX_SLL (Linux cooked v1)\n00:16:23...\
  \  In f2:ed:e8:04:00:cc ➊ ... 172.31.239.216 > 172.31.89.197: ICMP echo request\
  \ ...\n00:16:23... Out 08:00:27:b7:ef:ef ➋ ... 172.31.89.197 > 172.31.239.216: ICMP\
  \ echo reply ...\n00:16:23...  In 08:00:27:b7:ef:ef ➌ ... 172.31.89.197 > 172.31.239.216:\
  \ ICMP echo request ...\n00:16:23... Out ee:ee:ee:ee:ee:ee ➍ ... 172.31.239.216\
  \ > 172.31.89.197: ICMP echo reply ...\n...\n```\n\n`tcpdump` 的 `-e` 标志打印硬件地址；否则，我们将无法区分某些数据包。第一个硬件地址\
  \ ➊ 是 Pod 内部 `eth0` 的硬件地址。下一个是同一个包，但这次硬件地址是主机接口 ➋。我们随后看到了回复，它首先到达主机接口，并标记有 `host02`\
  \ 的硬件地址 ➌。最后，包被路由到与我们的 Pod ➍ 对应的 Calico 网络接口，我们的 `ping` 完成了往返。\n\n使用三层（网络层）是 Kubernetes\
  \ 集群跨节点网络的一种优雅解决方案，因为它利用了 Linux 原生的路由和流量转发能力。然而，这意味着主机网络可以看到 Pods 的 IP 地址，这可能需要更改安全规则。例如，为了本书的使用，在\
  \ Amazon Web Services (AWS) 中设置虚拟机的自动化脚本不仅配置了安全组以允许 Pod IP 地址空间内的所有流量，还关闭了虚拟机实例的“源/目的检查”。否则，底层的\
  \ AWS 网络基础设施将拒绝将意外 IP 地址的流量传递给我们的集群节点。\n\n#### WeaveNet\n\n\n\n\n第三层路由并不是跨节点网络化的唯一解决方案。另一种方案是将容器数据包“封装”到一个显式从一个\
  \ `host` 发送到另一个 `host` 的数据包中。这是流行的网络插件（如 `Flannel` 和 `WeaveNet`）采用的方法。我们将查看一个 `WeaveNet`\
  \ 的示例，但使用 `Flannel` 的流量看起来也非常相似。\n\n**注意**\n\n基于 `Calico` 的较大集群对于某些网络之间的流量也使用封装。例如，对于一个跨越\
  \ AWS 多个区域或可用区（Availability Zones）的集群，考虑到可能无法在跨区域或可用区之间的所有路由器上配置必要的集群 Pod IP 路由，或者这样做是不现实的，因此该集群可能需要配置\
  \ `Calico` 使用封装。\n\n由于你在网络配置中可能执行的任何操作都有某些定义标准，因此封装存在一个标准也并不意外，即：虚拟扩展局域网（`VXLAN`）。在\
  \ `VXLAN` 中，每个数据包都被封装在一个 `UDP` 数据数据报文中，并发送到目标地。\n\n我们将再次使用相同的 `two-pods.yaml` 配置文件在我们的\
  \ Kubernetes 集群中创建两个 `Pods`，这次使用的是从本章示例中的 `weavenet` 目录构建的集群。与之前一样，我们最终在 `host01`\
  \ 上获得一个 `Pod`，另一个在 `host02` 上：\n\n```\nroot@host01:~# kubectl apply -f /opt/two-pods.yaml\n\
  \npod/pod1 created\n\npod/pod2 created\n```\n\n让我们检查这些 `Pods` 是否正在运行并正确分配到它们不同的主机上：\n\
  \n```\nroot@host01:~# kubectl get po -o wide\n\nNAME   READY   STATUS    ... IP\
  \           NODE     ...\n\npod1   1/1     Running   ... 10.46.0.8    host01   ...\n\
  \npod2   1/1     Running   ... 10.40.0.21   host02   ...\n```\n\n在这些 `Pods` 运行后，我们可以使用之前显示的相同命令收集它们的\
  \ IP 地址：\n\n```\nroot@host01:~# IP1=$(kubectl get po pod1 -o json | jq -r '.status.podIP')\n\
  \nroot@host01:~# IP2=$(kubectl get po pod2 -o json | jq -r '.status.podIP')\n\n\
  root@host01:~# echo $IP1\n\n10.46.0.8\n\nroot@host01:~# echo $IP2\n\n10.40.0.21\n\
  ```\n\n注意，分配的 IP 地址与 `Calico` 的示例完全不同。进一步的探索显示地址和路由配置也是不同的，如 Listing 8-4 所示。\n\n\
  ```\nroot@host01:~# kubectl exec -ti pod1 -- ip addr\n\n...\n\n25: eth0@if26: <BROADCAST,MULTICAST,UP,LOWER_UP,M-DOWN>\
  \ mtu 1376 qdisc noqueue \n\n    link/ether e6:78:69:44:3d:a4 brd ff:ff:ff:ff:ff:ff\n\
  \n    inet 10.46.0.8/12 brd 10.47.255.255 scope global eth0\n\n       valid_lft\
  \ forever preferred_lft forever\n\n...\n\nroot@host01:~# kubectl exec -ti pod1 --\
  \ ip route\n\ndefault via 10.46.0.0 dev eth0 \n\n10.32.0.0/12 dev eth0 scope link\
  \  src 10.46.0.8\n```\n\n*Listing 8-4: WeaveNet 网络*\n\n这一次，我们的 `Pods` 在一个巨大的 `/12`\
  \ 网络中获取 IP 地址，这对应于单体网络上超过百万个可能的地址。在这种情况下，我们 `Pod` 的网络栈将期望能够使用 `ARP` 直接识别网络上任何其他\
  \ `Pod` 的硬件地址，而不是像我们在 `Calico` 中看到的那样将流量路由到网关。\n\n和之前一样，我们这两个 `Pods` 之间确实存在连通性：\n\
  \n```\nroot@host01:~# kubectl exec -ti pod1 -- ping -c 3 $IP2\n\nPING 10.40.0.21\
  \ (10.40.0.21): 56 data bytes\n\n64 bytes from 10.40.0.21: seq=0 ttl=64 time=0.981\
  \ ms\n\n64 bytes from 10.40.0.21: seq=1 ttl=64 time=0.963 ms\n\n64 bytes from 10.40.0.21:\
  \ seq=2 ttl=64 time=0.871 ms\n\n--- 10.40.0.21 ping statistics ---\n\n3 packets\
  \ transmitted, 3 packets received, 0% packet loss\n\nround-trip min/avg/max = 0.871/0.938/0.981\
  \ ms\n```\n\n现在既然已经运行了这条 `ping` 命令，我们应该预期 `pod1` 网络栈中的 `ARP` 表已经填充了 `pod2` 网络接口的硬件地址：\n\
  \n```\nroot@host01:~# kubectl exec -ti pod1 -- arp -n\n\n? (10.40.0.21) at ba:75:e6:db:7c:c6\
  \ [ether]  on eth0\n\n? (10.46.0.0) at 1a:72:78:64:36:c6 [ether]  on eth0\n```\n\
  \n如所料，`pod1` 有一个 `pod2` IP 地址的 `ARP` 表项，对应于 `pod2` 内部的虚拟网络接口：\n\n```\nroot@host01:~#\
  \ kubectl exec -ti pod2 -- ip addr\n\n...\n\n53: eth0@if54: <BROADCAST,MULTICAST,UP,LOWER_UP,M-DOWN>\
  \ mtu 1376 qdisc noqueue \n\n    link/ether ➊ ba:75:e6:db:7c:c6 brd ff:ff:ff:ff:ff:ff\n\
  \n    inet 10.40.0.21/12 brd 10.47.255.255 scope global eth0\n\n       valid_lft\
  \ forever preferred_lft forever\n\n...\n```\n\n`pod1` `ARP` 表中的硬件地址与 `pod2` 虚拟网络设备的硬件地址匹配➊。为了实现这一点，`WeaveNet`\
  \ 正在通过网络路由 `ARP` 请求，以便 `pod2` 的网络栈能够响应。\n\n\n\n\n\n```bash\nroot@host01:~# tcpdump\
  \ -w vxlan.pcap -i any udp &\n\n...\n\nroot@host01:~# kubectl exec -ti pod1 -- ping\
  \ -c 3 $IP2\n\n...\n\n3 packets transmitted, 3 packets received, 0% packet loss\n\
  \nround-trip min/avg/max = 1.139/1.364/1.545 ms\n\nroot@host01:~# killall tcpdump\n\
  \n22 packets captured\n\n24 packets received by filter\n\n0 packets dropped by kernel\n\
  ```\n\n这一次我们将数据包数据保存了 `vxlan.pcap` 中。在这个示例中，`tcpdump` 捕获了 22 个数据包。由于我们的集群中有很多跨 Pod\
  \ 流量，而不仅仅是 ICMP 流量，你可能会看到不同的数字。\n\n我们捕获的数据包了 host01 上所有的 UDP 流量，而不仅仅是我们的 ICMP 流量，因此在打印\
  \ 列表 8-5 所示的数据包时，我们需要进行选择性打印。\n\n```bash\nroot@host01:~# tcpdump -enr vxlan.pcap\
  \ -T vxlan | grep -B 1 ICMP\n\nreading from file vxlan.pcap, link-type LINUX_SLL\
  \ (Linux cooked v1)\n\n16:45:47.307949 Out 08:00:27:32:a0:28 ... \n\n  length 150:\
  \ 192.168.61.11.50200 > 192.168.61.12.6784: VXLAN ...\n\ne6:78:69:44:3d:a4 > ba:75:e6:db:7c:c6\
  \ ... \n\n  length 98: 10.46.0.8 > 10.40.0.21: ICMP echo request ...\n\n16:45:47.308699\
  \  In 08:00:27:67:b9:da ... \n\n  length 150: 192.168.61.12.43489 > 192.168.61.11.6784:\
  \ VXLAN ... \n\nba:75:e6:db:7c:c6 > e6:78:69:44:3d:a4 ... \n\n  length 98: 10.40.0.21\
  \ > 10.46.0.8: ICMP echo reply ...\n\n16:45:48.308240 Out 08:00:27:32:a0:28 ...\
  \ \n\n  length 150: 192.168.61.11.50200 > 192.168.61.12.6784: VXLAN ... \n\n...\n\
  ```\n\n*列表 8-5: VXLAN 捕获*\n\n`-T vxlan` 标志告诉 `tcpdump` 将其看到的数据包数据视为 VXLAN 数据。这使得\
  \ `tcpdump` 能够深入内部并从封装的数据包中提取数据，从而在这些 ICMP 数据包被隐藏时能够识别出它们。我们随后使用带有 `-B 1` 标志的 `grep`\
  \ 来寻找这些 ICMP 数据包，并打印紧接之前的一行，这样我们就能看到 VXLAN 封装。\n\n这次捕获显示了主机的硬件地址，这告诉我们已经成功捕获了在主机之间移动的流量。每个\
  \ ICMP 数据包都被封装在 UDP 数据报中并跨越主机网络发送。这些数据报的 IP 源和目的是主机网络 IP 地址 `192.168.61.11` 和 `192.168.61.12`，因此主机网络永远看不到\
  \ Pod 的 IP 地址。然而，这些信息仍然存在于封装的 ICMP 数据包中，因此当数据报到达其地时，WeaveNet 可以将 ICMP 数据包发送到正确的目的地。\n\
  \n封装的优势是，我们所有的跨节点流量看起来像主机之间普通的 UDP 数据报。通常，我们不需要进行任何额外的网络配置来允许这种流量。然而，我们也付出了代价。正如你在\
  \ 列表 8-5 中所示，每个 ICMP 数据包为 98 字节，但封装的数据包为 150 字节。封装所需的封装器产生了网络开销，我们在发送每个数据包时都必须支付。\n\
  \n回看 列表 8-4 中的另一个后果。Pod 内部的虚拟网络接口的最大传输单元 (MTU) 为 `1,376`。这代表了可以发送的最大数据包；任何更大的数据包都必须分分成多个数据包并在目的地重新组装。这个\
  \ `1,376` 的 MTU 远小于主机网络上标准的 `1,500` MTU。Pod 接口上较小的 MTU 确保了 Pod 的网络栈将执行任何必要的分片。这样一来，我们可以保证即使在添加封装器后，在主机层也不会超过\
  \ `1,500`。由于这个原因，如果你正在使用使用封装的网络插件，探索如何配置巨型帧（jumbo frames）可能是值得的。\n\n### 选择网络插件\n\
  \n封装的优势是，我们所有的跨节点流量看起来像主机之间普通的 UDP 数据报。通常，我们不需要进行任何额外的网络配置来允许这种流量。然而，我们确实付出了代价。正如你在\
  \ 列表 8-5 中所示，每个 ICMP 数据包为 98 字节，但封装的数据包为 150 字节。封装所需的封装器产生了网络开销，我们在发送每个数据包时都必须支付。\n\
  \n回看 列表 8-4 中的另一个后果。Pod 内部的虚拟网络接口的最大传输单元 (MTU) 为 `1,376`。这代表了可以发送的最大数据包；任何更大的数据包都必须分成多个数据包并在目的地重新组装。这个\
  \ `1,376` 的 MTU 远小于主机网络上标准的 `1,500` MTU。Pod 接口上较小的 MTU 确保了 Pod 的网络栈将执行任何必要的分片。这样一来，我们可以保证即使在添加封装器后，在主机层也不会超过\
  \ `1,500`。由于这个原因，如果你正在使用使用封装的网络插件，探索如何配置巨型帧（jumbo frames）可能是值得的。\n\n### 网络定制\n\n\
  某些场景可能需要特殊的网络。例如，某些系统可能需要虚拟局域网 (VLAN)。插件架构的优势之一是 Kubernetes 可以适应这些特殊场景。一个主机网络。只要\
  \ Pod 拥有接口（并且可以从集群的其他部分访问），Pod 就可以额外的接口。\n\n让我们来看一个示例。我们在同一个节点上配置两个 Pod，以便它们拥有主机网络。作为主机网络，它不提供到集群其他部分的连接，因此我们还将使用\
  \ Calico 来提供集群网络。\n\n由于需要同时配置 Calico 和我们的主机网络，我们将调用两个独立的 CNI 插件，它们将在 Pod 的命名空间中创建网络接口。正如我们在\
  \ 列表 8-1 中所示，可以在单个文件中配置多个 CNI 插件。然而，kubelet 期望这些 CNI 插件中的一个分配网络接口和 IP 地址。为了解决这个问题，我们将使用\
  \ Multus，它被设计用于调用多个插件但在报告 IP 地址时会将一个视为主要的。Multus 还允许我们选择性地将 CNI 插件应用到每个 Pod。\n\n\
  我们将首先向 Calico 示例集群安装 Multus：\n\n```bash\nroot@host01:~# kubectl apply -f /opt/multus-daemonset.yaml\n\
  \ncustomresourcedefinition.../network-attachment-definitions... created\n\nclusterrole.rbac.authorization.k8s.io/multus\
  \ created\n\nclusterrolebinding.rbac.authorization.k8s.io/multus created\n\nserviceaccount/multus\
  \ created\n\nconfigmap/multus-cni-config created\n\ndaemonset.apps/kube-multus-ds\
  \ created\n```\n\n\n\n```yaml\n---\napiVersion: k8s.cni.cncf.io/v1\nkind: NetworkAttachmentDefinition\n\
  metadata:\n  name: macvlan-conf\nspec:\n  config: '{\n      \"cniVersion\": \"0.3.0\"\
  ,\n      \"type\": \"macvlan\",\n      \"mode\": \"bridge\",\n      \"ipam\": {\n\
  \        \"type\": \"host-local\",\n        \"subnet\": \"10.244.0.0/24\",\n   \
  \     \"rangeStart\": \"10.244.0.1\",\n        \"rangeEnd\": \"10.244.0.254\"\n\
  \      }\n    }'\n```\n\n*列表 8-6: 网络附带定义*\n\n`spec` 中的 `config` 字段看起来非常像 CNI 配置文件，这并不意外，因为当我们在请求将网络添加到\
  \ Pod 时，Multus 需要使用这些信息来调用我们请求的 `macvlan` CNI 插件。\n\n我们需要将此 `NetworkAttachmentDefinition`\
  \ 添加到集群中：\n\n```bash\nroot@host01:~# kubectl apply -f /opt/netattach.yaml \n\nnetworkattachmentdefinition.k8s.cni.cncf.io/macvlan-conf\
  \ created\n```\n\n此定义不会立即影响任何 Pod；它只是为未来使用提供了一个 Multus 配置。\n\n当然，要使用此配置，必须调用 Multus。在我们已经向此集群安装了\
  \ Calico 的情况下，它是如何实现的呢？答案在 `/etc/cni/net.d` 目录，Multus `DaemonSet` 在初始化部分修改了集群中所有节点上的该目录：\n\
  \n```bash\nroot@host01:~# ls /etc/cni/net.d\n\n00-multus.conf  10-calico.conflist\
  \  calico-kubeconfig  multus.d\n```\n\nMultus 保留了现有的 Calico 配置文件，但添加了自己的 `00-multus.conf`\
  \ 配置和 `multus.d` 目录。由于 `00-multus.conf` 文件在字母排序中优于 `10-calico.conflist`，kubelet\
  \ 在下次创建新 Pod 时将开始使用它。\n\n这里是 `00-multus.conf`：\n\n`00-multus.conf`\n\n```json\n\
  {\n  \"cniVersion\": \"0.3.1\",\n  \"name\": \"multus-cni-network\",\n  \"type\"\
  : \"multus\",\n  \"capabilities\": {\n    \"portMappings\": true,\n    \"bandwidth\"\
  : true\n  },\n  \"kubeconfig\": \"/etc/cni/net.d/multus.d/multus.kubeconfig\",\n\
  \  \"delegates\": [\n    {\n      \"name\": \"k8s-pod-network\",\n      \"cniVersion\"\
  : \"0.3.1\",\n      \"plugins\": [\n        {\n          \"type\": \"calico\",\n\
  ...\n          }\n        },\n        {\n          \"type\": \"bandwidth\",\n...\n\
  \        },\n        {\n          \"type\": \"portmap\",\n...\n        }\n     \
  \ ]\n    }\n  ]\n}\n```\n\n`delegates` 字段提取自 Multus 找到的 Calico 配置。该字段用于确定 Multus\
  \ 在被调用时始终使用的默认 CNI 插件。顶层 `capabilities` 字段用于确保 Multus 能够从 kubelet 获取所有正确的配置数据，以便调用\
  \ `portmap` 和 `bandwidth` 插件。\n\n现在 Multus 已经完全设置好了，让我们用它为两个 Pod 添加一个主机主机网络。Pod\
  \ 的定义如下：\n\n`local-pods.yaml`\n\n```yaml\n---\napiVersion: v1\nkind: Pod\nmetadata:\n\
  \  name: pod1\n  annotations:\n    k8s.v1.cni.cncf.io/networks: macvlan-conf\nspec:\n\
  \  containers:\n  - name: pod1\n    image: busybox\n    command: \n      - \"sleep\"\
  \n      - \"infinity\"\n  nodeName: host01\n---\napiVersion: v1\nkind: Pod\nmetadata:\n\
  \  name: pod2\n  annotations:\n    k8s.v1.cni.cncf.io/networks: macvlan-conf\nspec:\n\
  \  containers:\n  - name: pod2\n    image: busybox\n    command: \n      - \"sleep\"\
  \n      - \"infinity\"\n  nodeName: host01\n```\n\n这次我们需要两个 Pod 都运行在 `host01` 上，这样主机网络功能才能正常工作。此外，我们为每个\
  \ Pod 添加了 `k8s.v1.cni.cncf.io/networks` 注解。Multus 使用此注解来识别它应该运行哪些额外的 CNI 插件。`macvlan-conf`\
  \ 名称与我们在[列表 8-6]的 `NetworkAttachmentDefinition` 中提供的名称匹配。\n\n让我们创建这两个 Pod：\n\n```bash\n\
  root@host01:~# kubectl apply -f /opt/local-pods.yaml\n\npod/pod1 created\npod/pod2\
  \ created\n```\n\n在这些 Pod 运行后，我们可以检查它们是否都拥有一个额外的网络接口：\n\n```bash\nroot@host01:~#\
  \ kubectl exec -ti pod1 -- ip addr\n\n...\n\n3: eth0 <BROADCAST,MULTICAST,UP,LOWER>\
  \ mtu 65536 qdisc noqueue\n    link/ether 00:15:5d:01:02:01 \n    inet 10.244.2.1/24\
  \ brd 10.244.2.255 scope global eth0\n       valid_lft forever preferred_\n\n\n\n\
  4: net1 <BROADCAST,MULTICAST,UP,LOWER> mtu 65536 qdisc noqueue\n    link/ether 00:15:5d:01:02:02\
  \ \n    inet 10.244.0.2/24 brd 10.244.0.255 scope global net1\n       valid_lft\
  \ forever preferred_\n\n\n```\n\nmacvlan CNI 插件添加了额外的 net1 接口。这种通信并不是通过 Calico 的。\n\
  \n这些 Pod 现在可以通过这些接口相互通信：\n\n```bash\nroot@host01:~# kubectl exec -ti pod1 -- ping\
  \ -c 3 10.244.0.2\n\nPING 10.244.0.2 (10.244.0.2): 56 data bytes\n64 bytes from\
  \ 10.244.0.2: icmp_seq=0 ttl=64 time=3.125 ms\n64 bytes from 10.244.0.2: icmp_seq=1\
  \ ttl=64 time=0.192 ms\n64 bytes from 10.244.0.2: icmp_seq=2 ttl=64 time=0.085 ms\n\
  \n--- 10.244.0.2 ping statistics ---\n3 packets transmitted, 3 packets received,\
  \ 0% packet loss\nround-trip min/avg/max = 0.085/1.134/3.125 ms\n```\n\nmacvlan\
  \ CNI 插件添加了额外的 net1 接口。请记住，这里的目的仅仅是为了演示如何在不需要集群主机外部特定 VLAN 或复杂设置的情况下自定义网络。对于真实的集群，这种主机网络的价值有限，因为它限制了\
  \ Pod 的部署位置。\n\n### 结语\n\n在本章中，我们查看了许多网络接口和流量流。大多数情况下，只需要知道集群中的每个 Pod 都会从 Pod 网络分配一个\
  \ IP 地址，并且集群中的任何 Pod 都能访问并被任何其他 Pod 访问。任何网络插件都能提供这种能力，无论它们是使用三层路由还是 VXLAN 封装，或者两者兼有。\n\
  \n同时，集群中确实会出现网络问题，对于集群管理员和集群用户来说，理解主机之间的流量流以及这些流量在主机网络看来是什么样的是非常关重要的，以便调试交换机和主机配置问题，或者仅仅是为了构建充分利用集群的应用程序。\n\
  \n还没有完成一个功能 Kubernetes 集群所需的所有网络层。在下一章中，我们将查看 Kubernetes 如何在 Pod 网络之上提供 Service\
  \ 层以实现负载均衡和自动故障转移，然后结合 Service 网络层和 Ingress 网络层，使容器服务在集群外部可访问。\n\n\n\n\n创建一个集群范围内的网络涉及到相当的复杂性，以便我们所有的\
  \ Pod 能够相互通信。与此同时，我们仍然缺乏构建可扩展、高可用性应用所需要的全部网络功能。我们需要一种支持在多个实例之间对应用程序组件进行负载均衡的网络，并提供在现有实例故障或需要升级时，将流量发送到新\
  \ Pod 实例的能力。此外，Pod 网络被设计为私有网络，这意味着它只能从集群内部直接访问。我们需要额外的流量路由，以便外部用户能够访问运行在容器中的我们的应用程序组件。\n\
  \n在本章中，我们将查看 `Service` 和 `Ingress` 网络。Kubernetes `Service` 网络在 Pod 网络之上提供了一个完整的额外网络层，包括动态发现和负载均衡。我们将看到这个网络层是如何运作的，以及我们如何使用它将我们的应用程序组件作为可扩展、高可用的服务暴露给集群的其他部分。然后，我们将查看\
  \ Ingress 配置如何为这些 Service 提供流量路由，以便将它们暴露给外部用户。\n\n### ### Services\n\n通过将 `Deployments`\
  \ 和叠加层网络（overlay networking）结合起来，我们能够创建多个相同的容器实例，并为每个实例分配一个唯一的 IP 地址。让我们创建一个 NGINX\
  \ Deployment 来进行说明：\n\n`nginx-deploy.yaml`\n\n```yaml\n---\nkind: Deployment\napiVersion:\
  \ apps/v1\nmetadata:\n  name: nginx\nspec:\n  replicas: 5\n  selector:\n    matchLabels:\n\
  \      app: nginx\n  template:\n    metadata:\n      labels:\n        app: nginx\n\
  \    spec:\n      containers:\n      - name: nginx\n        image: nginx\n```\n\n\
  这与我们之前看到的 `Deployments` 类似。在这种情况下，我们要求 Kubernetes 为我们维护五个 Pod，每个 Pod 运行着一个 NGINX\
  \ Web 服务器。\n\n**NOTE**\n\n本书的示例代码库位于 [`github.com/book-of-kubernetes/examples`](https://github.com/book-of-kubernetes/examples)。请参阅第\
  \ xx 页](#ch00.xhtml_ch00lev1sec2) 上的“运行示例”获取有关设置的详细信息。\n\n自动化脚本已将此文件放置在 `/opt` 中，因此我们可以将其应用到集群：\n\
  \n```bash\nroot@host01:~# kubectl apply -f /opt/nginx-deploy.yaml\n\ndeployment.apps/nginx\
  \ created\n```\n\n在这些 Pod 运行后，我们可以检查它们是否已分布在集群中，并且每个 Pod 一个 IP 地址：\n\n```bash\n\
  root@host01:~# kubectl get pods -o wide\n\nNAME                     READY   STATUS\
  \    ... IP                NODE    ...\nnginx-6799fc88d8-2wqc7   1/1     Running\
  \   ... 172.31.239.231   host01   ...\nnginx-6799fc88d8-78bwx   1/1     Running\
  \   ... 172.31.239.229   host01   ...\nnginx-6799fc88d8-dtx7s   1/1     Running\
  \   ... 172.31.89.240    host02   ...\nnginx-6799fc88d8-wh479   1/1     Running\
  \   ... 172.31.239.230   host01   ...\nnginx-6799fc88d8-zwx27   1/1     Running\
  \   ... 172.31.239.228   host01   ...\n```\n\n如果这些容器仅仅是某些服务器的客户端，那可能就是我们需要做的全部。例如，如果我们的应用程序架构是由发送和接收消息驱动的，只要这些容器能够连接到消息服务器，它们就能按照要求运行。然而，由于这些容器充当服务器，客户端需要能够找到并连接它们。\n\
  \n目前，我们这些分离的 NGINX 实例对客户端使用来说并不实用。当然，直接连接到这些 NGINX 服务器 Pod 中的任何一个是可能的。例如，我们可以使用\
  \ IP 地址与列表中的第一个进行通信：\n\n```bash\nroot@host01:~# curl -v http://172.31.239.231\n\n\
  *   Trying 172.31.239.231:80...\n*    Connected to 172.31.239.231 (172.31.239.231)\
  \ port 80 (#0)\n> GET / HTTP/1.1\n...\n< HTTP/1.1 200 OK\n< Server: nginx/1.21.3\n\
  ...\n```\n\n遗憾的是，仅仅选择一个实例并无法提供负载均衡或故障转移。此外，我们没有办法提前知道 Pod 的 IP 地址将会是什么，而且每当我们对 `Deployment`\
  \ 进行任何更改时，Pod 都会被重新创建并获得新的 IP 地址。\n\n这种情况的解决方案需要具备两个主要特性。首先，我们需要一个客户端可以使用来查找服务器的已知名称。其次，我们需要一个一致的\
  \ IP 地址，以便当客户端识别出服务器后，即使 Pod 实例来来去，它也可以继续使用相同的地址进行连接。这正是 Kubernetes 通过 `Service`\
  \ 提供的。\n\n#### ### Creating a Service\n\n让我们为我们的 NGINX Deployment 创建一个 `Service`\
  \ 并看看效果。\n\n```yaml\n---\nkind: Service\napiVersion: v1\nmetadata:\n  name: nginx\n\
  spec:\n  selector:\n    app: nginx\n  ports:\n  - port: 80\n    targetPort: 80\n\
  ```\n\n自动化脚本已经将此文件放置在 `/opt` 中，所以我们可以将其应用到集群：\n\n```bash\nroot@host01:~# kubectl\
  \ apply -f /opt/nginx-service.yaml\n\nservice/nginx created\n```\n\n我们现在可以看到 Service\
  \ 已存在：\n\n```bash\nroot@host01:~# kubectl get services\n\nNAME     TYPE        CLUSTER-IP\
  \     EXTERNAL-IP   PORT(S)        AGE\nnginx    ClusterIP   10.96.0        None\
  \          80/TCP         5s\n```\n\n这个 `Service` 的默认类型是 `ClusterIP`。Kubernetes\
  \ 已为该 `Service` 分配了一个 IP 地址。\n\n让我们通过 `Service` 访问 NGINX 服务器：\n\n```bash\nroot@host01:~#\
  \ curl -v http://10.105.201\n\n*   Trying 10.105.201:80...\n*    Connected to 10.105.201\
  \ (10.105.201) port 80 (#0)\n> GET / HTTP/1.1\n...\n< HTTP/1.1 200 OK\n< Server:\
  \ nginx/1.21.3\n...\n```\n\n我们可以看到 `Service` 正确识别了所有的 NGINX Pod：\n\n```bash\nroot@host01:~#\
  \ kubectl describe service nginx\n\nName:              nginx\nNamespace:       \
  \  default\n...\nSelector:          app=nginx\n...\nEndpoints:         17.31.239.228:80,172.31.239.229:80,172.31.239.230:80,172.31.239.231:80,172.31.239.232:80\n\
  + 0 more...\n...\n```\n\n`Endpoints` 字段显示 `Service` 目前将流量路由到所有五个 NGINX Pod。作为客户端，我们不需要知道哪个\
  \ Pod 处理了我们的请求。我们仅与 `Service` IP 地址交互，并让 `Service` 为我们选择实例。\n\n当然，在这个示例中，我们必须查找\
  \ Service 的 IP 地址。为了方便客户端使用，我们仍然应该提供一个已知名称。\n\n#### ### Service DNS\n\nKubernetes\
  \ 通过 `DNS`（域名系统）服务器为每个 `Service` 提供一个已知名称，该服务器会动态更新集群中每个 Service 的名称和 IP 地址。每个 Pod\
  \ 都配置了此 `DNS` 服务器，使得 `Pod` 可以使用 `Service` 的名称进行连接。\n\n创建一个用来测试此点的 `Pod`：\n\n`pod.yaml`\n\
  \n```yaml\n---\nkind: Pod\napiVersion: v1\nmetadata:\n  name: tester\nspec:\n  containers:\n\
  \  - name: tester\n    image: busybox\n    command: [\"sh\", \"-c\", \"while true;\
  \ do sleep 30; done\"]\n```\n\n\n\n\n```yaml\n---\napiVersion: v1\nkind: Pod\nmetadata:\n\
  \  name: pod\nspec:\n  containers:\n  - name: pod\n    image: alpine\n    command:\
  \ \n      - \"sleep\"\n      - \"infinity\"\n```\n\n我们在这个 Pod 的镜像中使用了 alpine 而不是\
  \ busybox，因为我们需要使用一些需要安装功能更全 DNS 客户端才能运行的 DNS 命令。\n\n**注意**\n\n*BusyBox 是 Kubernetes\
  \ 集群极佳的调试镜像，因为它体积极小且包含许多实用命令。然而，为了保持 BusyBox 的精简，其命令通常只包含最流行的选项。Alpine 是调试的绝佳替代方案。默认的\
  \ Alpine 镜像使用 BusyBox 提供许多初始命令，但通过安装适当的包，可以将它们替换为功能完备的替代方案。*\n\n接下来，创建 Pod：\n\n\
  ```\nroot@host01:~# kubectl apply -f /opt/pod.yaml \n\npod/pod created\n```\n\n\
  在它运行后，让我们使用它来连接我们的 NGINX 服务，如列表 9-2 所示。\n\n```\nroot@host01:~# kubectl exec -ti\
  \ pod -- wget -O - http://nginx\n\nConnecting to nginx (10.100.221.220:80)\n\n...\n\
  \n<title>Welcome to nginx!</title>\n\n...\n```\n\n*列表 9-2：连接到 NGINX 服务*\n\n我们能够使用服务的名称\
  \ `nginx`，并且该名称解析到了服务的 IP 地址。之所以能成功，是因为我们的 Pod 被配置为连接集群内置的 DNS 服务器：\n\n```\nroot@host01:~#\
  \ kubectl exec -ti pod -- cat /etc/resolv.conf \n\nsearch default.svc.cluster.local\
  \ svc.cluster.local cluster.local \n\nnameserver 10.96.0.10\n\noptions ndots:5\n\
  ```\n\n我们打印了容器内部的 `/etc/resolv.conf` 文件，因为该文件用于配置 DNS。\n\n引用的名称服务器 `10.96.0.10`\
  \ 本身是一个 Kubernetes 服务，但它位于 `kube-system` 命名空间中，因此我们需要去那里查找：\n\n``` evenroot@host01:~#\
  \ kubectl -n kube-system get services\n\nNAME            TYPE       CLUSTER-IP \
  \     ... PORT(S)                  AGE\n\nkube-dns        ClusterIP  10.96.0.10\
  \      ... 53/UDP,53/TCP,9153/TCP   14d\n\nmetrics-server  ClusterIP  10.105.140.176\
  \  ... 443/TCP                  14d\n```\n\n`kube-dns` 服务连接到一个名为 `CoreDNS` 的 DNS\
  \ 服务器部署，该部署监听 Kubernetes 集群中服务的变化。CoreDNS 会根据需要更新 DNS 服务器配置，以与当前的集群配置保持同步。\n\n###\
  \ 域名解析与命名空间\n\nKubernetes 集群中的 DNS 名称基于命名空间（Namespace）以及集群域名。由于我们的 Pod 位于默认（default）命名空间中，它被配置了一个搜索路径，其中\
  \ `default.svc.cluster.local` 是列表的第一项，因此在查找服务时，它会首先搜索默认命名空间。这就是为什么我们能够使用原始的服务名称\
  \ `nginx` 来找到 `nginx` 服务——该服务也在默认命名空间中。\n\n我们也可以使用完全限定域名来找到同一个服务：\n\n```\nroot@host01:~#\
  \ kubectl exec -ti pod -- wget -O - http://nginx.default.svc\n\nConnecting to nginx.default.svc\
  \ (10.100.221.220:80)\n\n...\n\n<title>Welcome to nginx!</title>\n\n...\n```\n\n\
  理解命名空间与服务查找之间的这种交互非常重要。Kubernetes 集群的一种常用部署模式是将同一个应用程序多次部署到不同的命名空间，并使用简单的主机名让应用组件之间相互通信。这种模式通常用于在同一个集群中部署应用程序的“开发”和“生产”版本。如果我们计划使用这种模式，我们需要确保在应用组件尝试寻找对方时坚持使用原始主机名；否则，可能会连接到错误的应用程序版本。\n\
  \n`/etc/resolv.conf` 中的另一个重要配置项是 `ndots` 。`ndots` 条目告诉主机解析器：当它看到带有四个或更少点的主机名时，它应该在执行不带后缀的绝对搜索*之前*，尝试追加各种搜索域名。这对于确保我们在访问集群外部之前尝试查找集群内部的服务至关重要。\n\
  \n因此，当我们在列表 9-2 中使用名称 `nginx` 时，我们容器内的 DNS 解析器立即尝试了 `nginx.default.svc.cluster.local`\
  \ 并找到了正确的服务。\n\n为了确保这一点这一点，让我们再尝试一个示例：查找另一个命名空间中的服务。`kube-system` 命名空间有一个 `metrics-server`\
  \ 服务。为了找到它，让我们在 Pod 中使用标准主机查找命令 `dig`。\n\n我们的 Pod 使用的是 Alpine Linux，所以我们需要安装 `bind-tools`\
  \ 包才能使用 `dig`：\n\n```\nroot@host01:~# kubectl exec -ti pod -- apk add bind-tools\n\
  \n...\n\nOK: 13 MiB in 27 packages\n```\n\n现在，让我们先尝试使用原始名称查找 `metrics-server`：\n\
  \n```\nroot@host01:~# kubectl exec -ti pod -- dig +search metrics-server\n\n...\n\
  \n;; Got answer:\n\n;; ->>HEADER<<- opcode: QUERY, status: SERVFAIL, id: 38423\n\
  \n...\n```\n\n我们在命令中添加了 `+search` 标志，告诉 `dig` 使用来自 `/etc/resolv.conf` 的搜索路径信息。然而，即使有了该标志，也没有找到该服务，因为我们的\
  \ Pod 在默认命名空间中，所以搜索路径没有引导 `dig` 去查找 `kube-system` 命名空间。\n\n让我们再次尝试，这次指定正确的命名空间：\n\
  \n```\nroot@host01:~# kubectl exec -ti pod -- dig +search metrics-server.kube-system\n\
  \n...\n\n;; ANSWER SECTION:\n\nmetrics-server.kube-system.svc.cluster.local. 30\
  \ IN A 10.105.140.176\n\n...\n```\n\n这次查找成功了，我们能够获取 `metrics-server` 服务的 IP 地址。它之所以奏效，是因为搜索路径包含了\
  \ `svc.cluster.local` 作为其第二项。在初始尝试 `metrics-server.kube-system.default.svc.cluster.local`\
  \ 失败后，`dig` 接着尝试了 `metrics-server.kube-system.svc.cluster.local`，这次成功了。\n\n## 流量路由\n\
  \n我们已经了解了如何创建和使用服务，但还没有查看实际的流量路由是如何工作的。事实证明，服务的网络流量工作方式与我们在第 8 章中看到的覆盖网络完全不同，这可能会一些困惑。\n\
  \n例如，因为我们可以使用 `wget` 通过 `nginx` 服务名称到达 NGINX 服务器实例，我们可能预期也能使用 `ping`，但这是行不通的：\n\n\
  ```\nroot@host01:~# kubectl exec -ti pod -- ping -c 3 nginx\n\nPING nginx (10.100.221.220):\
  \ 56 data bytes\n\n--- nginx ping statistics ---\n\n3 packets transmitted, 0 packets\
  \ received, 100% packet loss\n\ncommand terminated with exit code 1\n```\n\n名称解析符合预期，所以\
  \ `ping` 知道使用哪个 IP 地址发送 ICMP 数据包。但该 IP 地址没有返回响应。我们可以查看集群中的每个主机和容器网络接口，永远找不到带有 `10.100.221.220`\
  \ 服务 IP 地址的接口。那么我们的 HTTP 流量是如何到达 NGINX 服务实例的呢？\n\n在集群的每个节点上，都有一个名为 `kube-proxy`\
  \ 的组件用于配置服务的流量路由。`kube-proxy` 以 DaemonSet 的形式运行在 `kube-system` 命名空间中。每个 `kube-proxy`\
  \ 实例监控集群服务的变化并配置 Linux 防火墙以路由流量。\n\n我们可以使用 `iptables` 命令查看防火墙配置，了解 `kube-proxy`\
  \ 如何为我们的 `nginx` 服务配置流量路由：\n\n```\n root@host01:~# iptables-save | grep 'default/nginx\
  \ cluster IP'\n\n➊ -A KUBE-SERVICES ! -s 172.31.0.0/16 -d 10.100.221.220/32 -p tcp\
  \ -m comment \n    --comment \"default/nginx cluster IP\" -m tcp --dport 80 -j KUBE-MARK-MASQ\n\
  \n➋ -A KUBE-SERVICES -d 10.100.221.220/32 -p tcp -m comment --comment \n   \"default/nginx\
  \ cluster IP\" -m tcp --dport 80 -j KUBE-SVC-2CMXP7HKUVJN7L6M\n```\n\n\n\n\n\n`iptables-save`\
  \ 命令备份所有当前的 Linux 防火墙规则，因此它对于打印所有规则非常有用。`grep` 命令用于搜索 `kube-proxy` 为其创建的 Service\
  \ 规则所应用的注释字符串。在例例中，`kube-proxy` 为整个 Service 创建了两个规则。第一条规则 ➊ 查找目标为我们的 Service 且*不是*来自\
  \ Pod 网络的流量。这些流量必须被标记为网络地址转换（NAT）伪装，这样任何回包流量的源地址将将重写为 Service IP 地址，而不是处理请求的实际 Pod。第二条规则\
  \ ➋ 将所有目标为 Service 的流量发送到单独的规则链中，该规则链将将其发送到 Pod 实例。请注意，在两种情况下，规则都仅匹配目标为 80 端口的 TCP\
  \ 流量。\n\n我们可以检查这个单独的规则链，以查看路由到单个 Pod 的实际工作原理。请确保将此命令中的规则链名称替换为之前输出中显示的名称：\n\n```\n\
  root@host01:~# iptables-save | grep KUBE-SVC-2CMXP7HKUVJN7L6M\n\n...\n\n-A KUBE-SVC-2CMXP7HKUVJN7L6M\
  \ ... -m statistic --mode random \n\n  --probability 0.20000000019 -j KUBE-SEP-PIVU7ZHMCSOWIZ2Z\n\
  \n-A KUBE-SVC-2CMXP7HKUVJN7L6M ... -m statistic --mode random \n\n  --probability\
  \ 0.25000000000 -j KUBE-SEP-CFQXKE74QEHFB7VJ\n\n-A KUBE-SVC-2CMXP7HKUVJN7L6M ...\
  \ -m statistic --mode random \n\n  --probability 0.33333333349 -j KUBE-SEP-DHDWEJZ7MGGIR5XF\n\
  \n-A KUBE-SVC-2CMXP7HKUVJN7L6M ... -m statistic --mode random \n\n  --probability\
  \ 0.50000000000 -j KUBE-SEP-3S3S2VJCXSAISE2Z\n\n-A KUBE-SVC-2CMXP7HKUVJN7L6M ...\
  \ -j KUBE-SEP-AQWD2Y25T24EHSNI\n```\n\n输出显示了五条规则，对应于 Service 选择器匹配的五个 NGINX Pod\
  \ 实例。这五条规则共同提供了所有实例之间的随机负载均衡，使得每个实例在被选中新连接时都有相等的机会。\n\n每个规则的概率数字都在增加，这看起来可能很奇怪。这是必要的，因为规则是按顺序求值的。对于第一条规则，我们希望有\
  \ 20% 的概率选择第一个实例。然而，如果我们没有选择第一个实例，就剩下四个实例，因此我们希望有 25% 的概率选择第二个。同样的逻辑一直持续到最后一个实例，如果我们跳过了所有其他实例，我们总是会选择最后一个。\n\
  \n让我们快速验证一下这些规则是否去往了预期的目的地（再次，请确保将此命令中的规则链名称替换掉）：\n\n```\nroot@host01:~# iptables-save\
  \ | grep KUBE-SEP-PIVU7ZHMCSOWIZ2Z\n\n...\n\n-A KUBE-SEP-PIVU7ZHMC ... -s 172.31.239.235/32\
  \ ... --comment \"default/nginx\" -j KUBE-MARK-MASQ\n\n-A KUBE-SEP-PIVU7ZHMCSOWIZ2Z\
  \ -p tcp ... -m tcp -j DNAT --to-destination 172.31.239.235:80\n```\n\n此输出显示了两条规则。第一条是\
  \ NAT 伪装配置的另一半，我们标记了所有离开 Pod 实例的数据包，以便它们的源地址可以被重写为看起来像是来自 Service。第二条规则是实际上将 Service\
  \ 流量路由到特定 Pod 的规则，因为它对目标地址进行了重写，使得原始目标为 Service IP 的数据包现在目标变为 Pod。从那里开始，叠加网络（overlay\
  \ networking）将接管并将数据包实际发送到正确的容器。\n\n在理解了 Service 流量是如何实际路由的后，我们的 ICMP 数据包没有通过就情在合理了。`kube-proxy`\
  \ 创建的防火墙规则仅适用于目标为 80 端口的 TCP 流量。因此，没有防火墙规则来重写我们的 ICMP 数据包，因此它们没有办法到达可以响应它们的网络协议栈。同样，如果我们有一个监听多个端口的容器，我们将能够通过直接使用\
  \ Pod IP 地址连接到任何这些端口，但只有当我们从 Service 规范中显式声明该端口时，Service IP 地址 才会路由流量。在部署应用程序时，如果\
  \ Pod 如预期地启动并监听流量，但 Service 的配置错误导致流量没有被路由到所有正确的目标端口，这可能会是一个重大的困惑来源。\n\n### 外部网络\n\
  \n我们现在有了足够的网络层来满足我们所有的内部集群通信需求。每个 Pod 都有自己的 IP 地址，并且与其他 Pod 以及控制面具有连通性，通过 Service\
  \ 网络，我们根据运行多个带有 Service 的 Pod 实例实现了自动的负载均衡和故障转移。然而，我们仍然缺少外部用户访问我们集群中运行服务的能力。\n\n\
  为了给外部用户提供访问，我们不能再仅仅依赖于集群内部网络。为了给外部用户提供访问，我们不能再仅仅依赖于集群内部网络。为了给外部用户提供访问，我们不能再仅仅依赖于集群内部网络。为了给外部用户提供访问，我们不能再仅仅依赖于集群内部网络。为了给外部用户提供访问，我们不能再仅仅依赖于集群内部网络。为了给外部用户提供访问，我们不能再仅仅依赖于集群内部网络。为了给外部用户提供访问，我们不能再仅仅依赖于集群内部网络。为了给外部用户提供访问，我们不能再仅仅依赖于集群内部网络。为了给外部用户提供访问，我们不能再仅仅依赖于集群内部网络。为了给外部用户提供访问，我们不能再仅仅依赖于集群内部网络。为了给外部用户提供访问，我们不能再仅仅依赖于集群内部网络。为了给外部用户提供访问，我们不能再仅仅依赖于集群内部网络。为了给外部用户提供访问，我们不能再仅仅依赖于集群内部网络。为了给外部用户提供访问，我们不能再仅仅依赖于集群内部网络。为了给外部用户提供访问，我们不能再仅仅依赖于集群内部网络。为了给外部用户提供访问，我们不能再仅仅依赖于集群内部网络。为了给外部用户提供访问，我们不能再仅仅依赖于集群内部网络。为了给外部用户提供访问，我们不能再仅仅依赖于集群内部网络。为了给外部用户提供访问，我们不能再仅仅依赖于集群内部网络。为了给外部用户提供访问，我们不能再仅仅依赖于集群内部网络。为了给外部用户提供访问，我们不能再仅仅依赖于集群内部网络。为了给外部用户提供访问，我们不能再仅仅依赖于集群内部网络。为了给外部用户提供访问，我们不能再仅仅依赖于集群内部网络。为了给外部用户提供访问，我们不能再仅仅依赖于集群内部网络。为了给外部用户提供访问，我们不能再仅仅依赖于集群内部网络。为了给外部用户提供访问，我们不能再仅仅依赖于集群内部网络。为了给外部用户提供访问，我们不能再仅仅依赖于集群内部网络。\n\
  \n（抱歉，上述翻译出现了重复错误，以下为修正后的对应部分）：\n\n为了给外部用户提供访问，我们不能再仅仅依赖于集群内部网络。我们需要一种方式来将 Service\
  \ 暴露出去，通过使用入口控制器（ingress controller）将 Service 关联到外部可路由地址。\n\n#### 外部 Service\n\n\
  我们之前创建的 `nginx` Service 是 `ClusterIP` 类型。Kubernetes 支持多种 Service 类型，包括需要外部暴露的类型：\n\
  \n- **None**: 也称为无头服务（Headless Service），它用于跟踪选定的 Pod 但没有 IP 地址。\n- **ClusterIP**:\
  \ 默认 Service 类型，在集群内部路由。\n- **NodePort**: 扩展了 `ClusterIP`，在所有节点上提供一个端口。\n- **LoadBalancer**:\
  \ 扩展了 `NodePort`，并使用云提供程序获取外部 IP 地址。\n- **ExternalName**: 将集群 DNS 中的已知 Service 名称映射到某些外部\
  \ DNS 名称，使外部资源看起来像是集群内部。\n\n在这些 Service 类型中，`NodePort` 和 `LoadBalancer` 类型对于外部暴露\
  \ Service 最有用。`LoadBalancer` 类型看起来最直接，因为它简单地为 Service 添加了外部 IP。然而，它需要与云环境集成，以便在创建\
  \ Service 时创建外部 IP、将该 IP 的流量路由到集群节点，并在集群外部创建 DNS 记录，以便外部用户能够通过我们拥有的预注册域名找到 Service，而不是仅在集群内部有效的\
  \ `cluster.local` 域名。\n\n由于这个原因，`LoadBalancer` 服务适用于我们知道正在使用的云环境并且创建长期运行 Service\
  \ 的情况。对于 HTTP 流量，我们可以通过使用 `NodePort` Service 配合入口控制器获得 `LoadBalancer` 服务的大部分收益，并具有更好地支持动态部署新应用和新\
  \ Service 的功能。\n\n在继续入口控制器之前，让我们将现有的 `nginx` Service 转换为 `NodePort` Service，以便观察效果。我们可以使用补丁文件来实现：\n\
  \n*nginx-nodeport.yaml*\n\n```yaml\n---\nspec:\n  type: NodePort\n```\n\n补丁文件允许我们只更新我们关心的特定字段。在本例中，我们只更新\
  \ Service 的类型。为了使之生效，我们只需要在层级结构中的正确位置指定该更改的字段，这样 Kubernetes 就知道要修改哪个字段。我们不需要更改 Service\
  \ 的选择器或端口，只需更改类型，因此补丁非常简单。\n\n让我们使用补丁：\n\n```\nroot@host01:~# kubectl patch svc\
  \ nginx --patch-file /opt/nginx-nodeport.yaml \n\nservice/nginx patched\n```\n\n\
  \n\n\n\n对于此命令，我们必须指定要修补的资源以及要使用的补丁文件。其结果与我们直接编辑 `Service` 的 YAML 资源文件然后再次使用 `kubectl\
  \ apply` 的效果是相同的。\n\n现在 `Service` 看起来有点不同：\n\n```\nroot@host01:~# kubectl get service\
  \ nginx\n\nNAME    TYPE       CLUSTER-IP       EXTERNAL-IP   PORT(S)        AGE\n\
  \nnginx   NodePort   10.100.221.220   <none>        80:31326/TCP   2h\n```\n\n`NodePort\
  \ Service` 提供了 `ClusterIP Service` 的所有行为，因此我们仍然有一个与 `nginx Service` 关联的集群 IP。`Service`\
  \ 甚至保持了相同的集群 IP。唯一的变化是 `PORT` 字段现在显示 Service 端口 80 已绑定到节点端口 31326。\n\n每个集群节点上的 `kube-proxy\
  \ Service` 都在监听此端口（请确保为你的 `Service` 使用正确的节点端口）：\n\n```\nroot@host01:~# ss -nlp |\
  \ grep 31326\n\ntcp   LISTEN 0  4096  .0.0.0:31326 ... users:((\"kube-proxy\",pid=3339,fd=15))\n\
  ```\n\n结果是，我们可以在 `Pod` 内部使用 `nginx Service` 名称，但也可以从主机使用 `NodePort`：\n\n```\nroot@host01:~#\
  \ kubectl exec -ti pod -- wget -O - http://nginx\n\nConnecting to nginx (10.100.221.220:80)\n\
  \n...\n\n<title>Welcome to nginx!</title>\n\n...\n\nroot@host01:~# wget -O - http://host01:31326\n\
  \n...\n\nConnecting to host01 (host01)|127.0.2.1|:31326... connected.\n\n...\n\n\
  <h1>Welcome to nginx!</h1>\n\n...\n```\n\n由于 `kube-proxy` 监听所有的网络接口，我们成功地将此 `Service`\
  \ 暴露给了外部用户。\n\n### Ingress 服务\n\n尽管我们成功地将 NGINX Service 暴露到了集群外部，但我们仍然没有为外部用户提供良好的用户体验。要使用\
  \ `NodePort Service`，外部用户需要知道我们集群至少一个节点的 IP 地址，并且需要知道每个 `Service` 监听的精确端口。如果 `Service`\
  \ 被删除并重新创建，该端口可能会发生。我们可以通过告诉 Kubernetes 使用哪个端口作为 `NodePort` 来部分解决这个问题，但我们不想对任何任意的\
  \ `Service` 这样做，因为多个 `Services` 可能会选择相同的端口。\n\n我们真正需要的是集群的一个单一外部入口点，它可以跟踪多个可用的服务，并使用规则将流量路由到它们。这样一来，我们可以在集群内部完成所有的路由配置，使\
  \ `Services` 可以动态地出现和消失。同时，我们可以为集群提供一个广为人知的入口点供所有外部用户使用。\n\n对于 HTTP 流量，Kubernetes\
  \ 提供了这种能力，并称之为 `Ingress`。要配置集群将外部 HTTP 流量路由到 `Services`，我们需要定义一组指定路由的 `Ingress`\
  \ 资源，并部署接收和路由流量的 ingress 控制器（ingress controller）。在设置集群时我们已经安装了 ingress 控制器：\n\n\
  ```\nroot@host01:~# kubectl -n ingress-nginx get deploy\n\nNAME                \
  \       READY   UP-TO-DATE   AVAILABLE   AGE\n\ningress-nginx-controller   1/1 \
  \    1            1           15d\n\nroot@host01:~# kubectl -n ingress-nginx get\
  \ svc\n\nNAME                      TYPE        ... PORT(S)               ...\n\n\
  ingress-nginx-controller  NodePort    ... 80:80/TCP,443:443/TCP ...\n\n...\n```\n\
  \n我们的 ingress 控制器包含一个 `Deployment` 和一个 `Service`。由于 `Service` 的类型为 `NodePort`，我们知道\
  \ `kube-proxy` 监听集群所有节点的 80 和 443 端口，准备将流量路由到关联的 `Pod`。\n\n顾名思，我们的 ingress 控制器实际上\
  \ NGINX Web 服务器的一个实例；但在情况下，NGINX 仅作为 HTTP 反向代理，而不是提供任何自己的网页内容。ingress 控制器监听集群中 `Ingress`\
  \ 资源的变化，并根据定义的规则重新配置 NGINX 以连接后端服务器。这些规则使用 HTTP 请求中的主机（host）或路径信息来为请求选择 `Service`。\n\
  \n让我们创建一个 `Ingress` 资源，将流量路由到我们在 Listing 9-1 中定义的 `nginx Service`。这是我们要创建的资源：\n\n\
  *nginx-ingress.yaml*\n\n```\n---\n\napiVersion: networking.k8s.io/v1\n\nkind: Ingress\n\
  \nmetadata:\n\n  name: web01\n\nspec:\n\n  rules:\n    - host: web01\n      http:\n\
  \        paths:\n          - path: /\n            pathType: Prefix\n           \
  \ backend:\n              service:\n                name: nginx\n              \
  \  port:\n                  number: 80\n```\n\n此资源指示 ingress 控制器查看 HTTP Host Header。如果它看到\
  \ `web01` 作为 Host Header，它随后将尝试与我们指定的路径列表中的路径进行匹配。在这种情况下，所有路径都将匹配路径 `/` 前缀，因此所有流量将将路由到\
  \ `nginx Service`。\n\n在将其应用集群之前，让我们确认一下如果尝试使用 ingress 控制器无法识别的主机名会发生什么。我们将使用与集群关联的高可用\
  \ IP 地址，因为集群负载均衡器将将其转发到其中一个实例：\n\n```\nroot@host01:~# curl -vH \"Host:web01\" http://192.168.61.10\n\
  \n...\n\n> Host:web01\n\n...\n\n<head><title>404 Not Found</title></head>\n\n...\n\
  ```\n\n`curl` 命令中的 `-H \"Host:web01\"` 标志告诉 `curl` 使用值 `host01` 作为 HTTP 请求中的 Host\
  \ Header。鉴于我们的示例集群中没有可以将 `web01` 转换为集群 IP 地址的 DNS 服务器，这是是必要的。\n\n正如我们所看到的，作为 ingress\
  \ 控制器的 NGINX 服务器配置为：每当它收到不匹配任何配置的 `Ingress` 资源的请求时，返回 404 Not Found 错误消息。在这种情况下，由于我们还没有创建任何\
  \ `Ingress` 资源，任何请求都会得到此响应。\n\n将 `web01` `Ingress` 资源应用到集群：\n\n```\nroot@host01:~#\
  \ kubectl apply -f /opt/nginx-ingress.yaml \n\ningress.k8s.io/web01 created\n```\n\
  \n现在 `Ingress` 资源已经存在，如 Listing 9-3 所示，集群高可用 IP 和单个主机上的 HTTP 端口 80 都被路由到 nginx Service：\n\
  \n```\nroot@host01:~# curl -vH \"Host:web01\" http://host01\n\n...\n\n> Host:web01\n\
  \n...\n\n<title>Welcome to nginx!</title>\n\n...\n\nroot@host01:~# curl -vH \"Host:web01\"\
  \ http://192.168.61.10\n\n...\n\n> Host:web01\n\n...\n\n<title>Welcome to nginx!</title>\n\
  \n...\n```\n\n*Listing 9-3: 通过 Ingress 使用 NGINX*\n\n两种情况下的输出都是相同的，显示流量正路由到 `nginx\
  \ Service`。\n\n在 `web01` 资源中，我们能够使用 `nginx Service` 的名称。Service 名称查找基于 `Ingress`\
  \ 资源所在的位置。因为我们在默认 `Namespace` 中创建了 `Ingress` 资源，所以它首先会在那里查找 `Services`。\n\n将所有这些整合起来，我们现在拥有了一个高可用解决方案，可将外部用户的流量路由到集群中的\
  \ HTTP 服务器。这把集群的高可用 IP 地址 `192.168.61.10` 与在集群所有节点 80 端口上暴露为 `NodePort Service`\
  \ 的 ingress 控制器结合了一起。可以通过创建新的 `Ingress` 资源动态配置 ingress 控制器以暴露额外的 `Services`。\n\n\
  ### 生产环境中的 Ingress\n\nListing 9-3 中的 `curl` 命令看起来仍然有些奇怪，因为我们我们需要手动覆盖 HTTP Host Header。为了在生产集群中使用\
  \ `Ingress` 资源暴露服务，我们需要执行一些额外的步骤。\n\n首先，我们需要集群拥有一个外部可路由的 IP 地址，以及一个在 DNS 中注册的广良好名称。最好的方法是使用通配符\
  \ DNS 方案，以便给定域名下的所有主机都路由到集群的外部 IP 地址。例如，如果我们拥有 `cluster.example.com` 域名，我们可以创建一个\
  \ DNS 记录，使 `*.cluster.example.com` 路由到集群的外部 IP 地址。\n\n\n\n\n这种方法仍然适用于跨越多个网络的较大集群。我们只需要为\
  \ DNS 词目关联多个 IP 地址，可能还会使用位置感知的 DNS 服务器，将客户端路由到最近的服务。\n\n接下来，我们需要为我们的入口控制器（ingress\
  \ controller）创建一个 SSL 证书，并将我们的通配符 DNS 作为备用名称（SAN）包含其中。这将允许我们的入口控制器无论外部用户使用哪个特定的服务主机名，都能为他们提供安全的\
  \ HTTP 连接。\n\n最后，当我们定义 `Services` 时，需要为 `host` 字段指定完全限定域名名（FQDN）。对于前面的示例，我们会指定 `web01.cluster.example.com`\
  \ 而而不仅仅是 `web01`。\n\n在完成这些额外步骤后，任何外部用户都可以通过 HTTPS 连接到我们 `Service` 的完全限定主机名，例如 `https://web01.cluster.example.com`。该主机名将解析到集群的外部\
  \ IP 地址，负载均衡器会将将其路由到集群的一个节点上。此时，监听在标准端口 `443` 上的入口控制器将提供它的通配符证书，这将匹配客户端的预期。一旦建立安全连接，入口控制器就会检查\
  \ HTTP Host 请求头，并将连接代理到正确的 `Service`，向客户端返回 HTTP 响应。\n\n这种方法的优势在于，一旦设置完成，我们就可以随时部署一个新的\
  \ `Ingress` 资源来外部暴露 `Service`，只要我们选择唯一的主机名，它就不会与任何其他暴露的 `Service` 发生冲突。在初始设置之后，所有的配置都维护在集群内部，我们对所有\
  \ `Services` 仍然拥有了高可用配置。\n\n### 结语\n\n在 Kubernetes 集群中路由网络流量可能涉及大量的复杂性，但最终结果是直观的：我们可以将应用程序组件部署到集群中，并实现自动扩展和故障转移，外部用户可以使用已知名称访问我们的应用程序，而无需知道应用程序是如何部署的，或者我们为了满足需求使用了多少容器实例。如果我们构建的应用程序是具韧性的，我们的应用程序容器就可以升级到新版本或在发生故障时重启，而用户甚至感知不到这种变化。\n\
  \n当然，如果我们打算构建韧性的应用程序组件，了解部署容器时可能出现什么问题是非常重要的。在下一章中，我们将查看向 Kubernetes 集群部署容器时的一些常见问题以及如何调试它们。\n\
  \n## 10 当出现问题时\n\n![image](img/common01.jpg)\n\n到目前为止，我们的 Kubernetes 安装和配置一直按照计划进行，我们的控制器在创建\
  \ `Pods` 和启动容器方面没有问题。当然，在现实世界中，情况很少如此简单。虽然无法展示复杂应用程序部署中可能发生的所有问题，但我们可以查看一些最常见的问题。重要的是，我们可以探索调试工具，这些工具将帮助我们诊断任何问题。\n\
  \n在本章中，我们将学习如何诊断部署在 Kubernetes 之上的应用程序容器的问题。我们将按照调度和运行容器的周期进行操作，检查每个步骤的潜在问题，以及如何诊断和修复它们。\n\
  \n## 调度\n\n调度是 Kubernetes 对 `Pod` 及其容器执行的第一项活动。当一个 `Pod` 初被创建时，Kubernetes 调度器会将其分配到一个节点。通常情况下，这种情况是快速且自动的，但某些问题可能会阻止调度成功进行。\n\
  \n#### 无可用节点\n\n一种可能性是调度器根本没有可用的节点。这种情况可能会发生由于我们的集群没有为常规应用程序容器配置节点，或者因为所有节点都失败了。\n\
  \n为了说明没有可用节点可供分配的情况，让我们创建一个带有 `node selector`（节点选择器）的 `Pod`。`node selector` 指定了一个或多个节点标签，这些标签是\
  \ `Pod` 调度到该节点所要求的。当当我们集群中的某些节点与其他节点不同时，节点选择器非常有用（例如，当某些节点具有较新的 CPU，支持我们某些容器所需的更高级指令集时）。\n\
  \n**注意**\n\n本书的示例代码库位于 [`github.com/book-of-kubernetes/examples`](https://github.com/book-of-kubernetes/examples)。请参阅第\
  \ xx 页](#ch00.xhtml_ch00lev1sec2) 的“运行示例”获取设置详情。\n\n我们将从一个不匹配我们任何节点的节点选择器 `Pod`\
  \ 定义开始：\n\n`nginx-selector.yaml`\n\n```yaml\n---\napiVersion: v1\nkind: Pod\nmetadata:\n\
  \  name: nginx\nspec:\n  containers:\n  - name: nginx\n    image: nginx\n  nodeSelector:\n\
  \ ➊ purpose: special\n```\n\n`node selector` ➊ 告诉 Kubernetes 只将此 `Pod` 分配给具有名为 `purpose`\
  \ 且值等于 `special` 标签的节点。尽管我们目前没有任何节点匹配，但我们仍然可以创建这个 `Pod`：\n\n```bash\nroot@host01:~#\
  \ kubectl apply -f /opt/nginx-selector.yaml\n\npod/nginx created\n```\n\n然而，Kubernetes\
  \ 卡在尝试调度该 `Pod` 上，因为找不到匹配的节点：\n\n```bash\nroot@host01:~# kubectl get pods -o wide\n\
  \nNAME    READY   STATUS    RESTARTS   AGE    IP       NODE     ...\nnginx   0/1\
  \     Pending   0          113s   <none>   <none>   ...\n```\n\n我们看到状态为 `Pending`\
  \ 且节点分配为 `<none>`。这是因为 Kubernetes 尚未将此 `Pod` 调度到节点上。\n\n`kubectl get` 命令通常是我们应该运行的第一条命令，以查看部署到集群的资源是否存在问题。如果我们遇到了问题，正如在本例中一样，下一步是使用\
  \ `kubectl describe` 查看详细状态和事件日志：\n\n```bash\nroot@host01:~# kubectl describe pod\
  \ nginx\n\nName:         nginx\nNamespace:    default\n...\nStatus:       Pending\n\
  ...\nNode-Selectors:              purpose=special\n\nEvents:\n  Type     Reason\
  \            Age    From               Message\n  ----     ------            ----\
  \   ----               -------\n  Warning  FailedScheduling  4m36s  default-scheduler\
  \  0/3 nodes are \n    available: 3 node(s) didn't match Pod's node affinity/selector.\n\
  \  Warning  FailedScheduling  3m16s  default-scheduler  0/3 nodes are \n    available:\
  \ 3 node(s) didn't match Pod's node affinity/selector.\n```\n\n事件日志告诉我们问题具体是什么：Pod\
  \ 无法调度，因为没有节点匹配选择器。\n\n让我们在其中一个节点上添加必要的标签：\n\n```bash\nroot@host01:~# kubectl get\
  \ nodes\n\nNAME     STATUS   ROLES        ...\nhost01   Ready    control-plane...\n\
  host02   Ready    control-plane...\nhost03   Ready    control-plane...\n\nroot@host01:~#\
  \ kubectl label nodes host02 purpose=special\n\nnode/host02 labeled\n```\n\n我们首先列出三个可用节点，然后为其中一个添加必要的标签。一旦我们应用了这个标签，Kubernetes\
  \ 现在就可以调度该 Pod 了：\n\n\n\n\n```\nroot@host01:~# kubectl get pods -o wide\n\nNAME\
  \    READY   STATUS    RESTARTS   AGE   IP               NODE     ...\n\nnginx \
  \  1/1     Running   0          10m   172.31.89.196   host02   ...\n\nroot@host01:~#\
  \ kubectl describe pod nginx\n\nName:         nginx\n\nNamespace:    default\n\n\
  ...\n\nEvents:\n\n  Type     Reason            Age    From               Message\n\
  \  ----     ------            ----   ----               -------\n  Warning  FailedScheduling\
  \  10m    default-scheduler  0/3 nodes are \n    available: 3 node(s) didn't match\
  \ Pod's node affinity/selector.\n  Warning  FailedScheduling  9m17s  default-scheduler\
  \  0/3 nodes are \n    available: 3 node(s) didn't match Pod's node affinity/selector.\n\
  \  Normal   Scheduled         2m22s  default-scheduler  Successfully assigned \n\
  \    default/nginx to host02\n...\n```\n\n正如预期的那样，Pod 被调度到了我们应用标签的节点上。\n\n这个例子就像在本章中看到的其他例子一样，演示了\
  \ Kubernetes 中的调试。在我们创建了所需的资源后，我们查询集群状态以确保这些资源的实际部署已成功。当我们发现问题时，可以修正这些问题，我们的资源将按照预期启动，而无需重新安装应用程序组件。\n\
  \n让我们清理这个 NGINX Pod：\n\n```\nroot@host01:~# kubectl delete -f /opt/nginx-selector.yaml\n\
  \npod \"nginx\" deleted\n```\n\n让我们也移除节点上的标签。我们通过在标签名称后添加一个减号来识别并移除该标签：\n\n```\n\
  root@host01:~# kubectl label nodes host02 purpose-\n\nnode/host02 unlabeled\n```\n\
  \n我们已经涵盖了调度器的一个问题，但还有另一个问题我们需要关注。\n\n### 资源不足\n\n在选择节点来托管 Pod 时，调度器还会考虑每个节点上的可用资源以及\
  \ Pod 所需的资源。我们将在第 14 章中详细探讨资源限制；目前，只需要知道 Pod 中的每个容器都可以请求它需要的资源，而调度器将确保它被调度到具有可用资源的节点上即可。当然，如果没有节点具有足够的剩余空间，调度器将无法调度该\
  \ Pod。相反，Pod 将处于 `Pending` 状态。\n\n让我们通过示例 Pod 定义来说说明这一点：\n\n`sleep-multiple.yaml`\n\
  \n```yaml\n---\napiVersion: v1\nkind: Pod\nmetadata:\n  name: sleep\nspec:\n  containers:\n\
  \  - name: sleep\n    image: busybox\n    command: \n      - \"/bin/sleep\"\n  \
  \    - \"3600\"\n    resources:\n      requests:\n        cpu: \"2\"\n  - name:\
  \ sleep2\n    image: busybox\n    command: \n      - \"/bin/sleep\"\n      - \"\
  3600\"\n    resources:\n      requests:\n        cpu: \"2\"\n```\n\n在这个 YAML 定义中，我们在同一个\
  \ Pod 中创建了两个容器。每个容器请求两个 CPU。由于 Pod 中的所有容器必须位于同一主机上以共享某些 Linux 命名空间类型（特别是网络命名空间，以便它们可以使用\
  \ localhost 进行通信），调度器需要找到一个具有四个可用 CPU 的节点。在我们的小型集群中，这是不会发生的，正如我们尝试部署该 Pod 时看到的：\n\
  \n```\nroot@host01:~# kubectl apply -f /opt/sleep-multiple.yaml\n\npod/sleep created\n\
  \nroot@host01:~# kubectl get pods -o wide\n\nNAME    READY   STATUS    RESTARTS\
  \   AGE   IP       NODE   ...\n\nsleep   0/2     Pending   0          7s    <none>\
  \   <none> ...\n```\n\n和之前一样，`kubectl describe` 为我们提供了揭示问题的事件日志：\n\n```\nroot@host01:~#\
  \ kubectl describe pod sleep\n\nName:         sleep\nNamespace:    default\n...\n\
  Events:\n  Type     Reason            Age   From               Message\n  ---- \
  \    ------            ----  ----               -------\n  Warning  FailedScheduling\
  \  71s   default-scheduler  0/3 nodes are 3: Insufficient cpu.\n```\n\n注意，节点实际负载有多高并不重要：\n\
  \n```\nroot@host01:~# kubectl top node\n\nNAME     CPU(cores)   CPU%   MEMORY(bytes)\
  \   MEMORY%   \nhost01   429m         21%    1307Mi          69%\nhost02   396m\
  \         19%    1252Mi          66%\nhost03   458m         22%    1277Mi      \
  \    67%\n```\n\n容器实际使用多少 CPU 也不重要。调度器完全根据其请求的内容来分配 Pod；这样一来，当负载增加时，我们不会突然压垮 CPU。\n\
  \n我们无法变魔地为节点提供更多 CPU，因此为了调度此 Pod，我们需要为两个容器指定较低的 CPU 使用率。让我们使用一个合理的数字 0.1 CPU：\n\n\
  `sleep-sensible.yaml`\n\n```yaml\n---\napiVersion: v1\nkind: Pod\nmetadata:\n  name:\
  \ sleep\nspec:\n  containers:\n  - name: sleep\n    image: busybox\n    command:\
  \ \n      - \"/bin/sleep\"\n      - \"3600\"\n    resources:\n      requests:\n\
  \        cpu: \"2\"\n  - name: sleep2\n    image: busybox\n    command: \n     \
  \ - \"/bin/sleep\"\n      - \"3600\"\n    resources:\n      requests:\n        cpu:\
  \ \"2\"\n```\n\n在这个 YAML 定义中，我们在同一个 Pod 中创建了两个容器。每个容器请求两个 CPU。由于 Pod 中的所有容器必须位于同一主机上以共享某些\
  \ Linux 命名空间类型（特别是网络命名空间，以便它们可以使用 localhost 进行通信），调度器需要找到一个具有四个可用 CPU 的节点。在我们的小型集群中，这是不会发生的，正如我们尝试部署\
  \ Pod 时看到的：\n\n```\nroot@host01:~# kubectl apply -f /opt/sleep-multiple.yaml\n\n\
  pod/sleep created\n\nroot@host01:~# kubectl get pods -o wide\n\nNAME    READY  \
  \ STATUS    RESTARTS   AGE   IP       NODE   ...\n\nsleep   0/2     Pending   0\
  \          7s    <none>   <none> ...\n```\n\n和之前一样，`kubectl describe` 为我们提供了揭示问题的事件日志：\n\
  \n```\nroot@host01:~# kubectl describe pod sleep\n\nName:         sleep\nNamespace:\
  \    default\n...\nEvents:\n  Type     Reason            Age   From            \
  \   Message\n  ----     ------            ----  ----               -------\n  Warning\
  \  FailedScheduling  71s   default-scheduler  0/3 nodes are 3: Insufficient cpu.\n\
  ```\n\n注意，节点实际负载有多高并不重要：\n\n```\nroot@host01:~# kubectl top node\n\nNAME     CPU(cores)\
  \   CPU%   MEMORY(bytes)   MEMORY%   \nhost01   429m         21%    1307Mi     \
  \     69%\nhost02   396m         19%    1252Mi          66%\nhost03   458m     \
  \    22%    1277Mi          67%\n```\n\n\n\n正如我们在第 5 章中描述的，镜像仓库是一个 Web 服务器。通常，镜像仓库位于集群外部，节点需要能够连接到外部网络或互联网才能访问该仓库。此外，大多数仓库支持发布私有镜像，这些镜像需要经过身份验证和授权才能访问。当然，如果我们指定的名称下没有发布相应的镜像，容器运行时将无法从仓库中拉取它。\n\
  \n所有这些错误在我们的 Kubernetes 集群中的行为都是相同的，区别仅在于事件日志中的信息，因此我们只需要探索其中一个。我们将查看可能最常见的问题：由于镜像名称拼写错误导致的镜像缺失。\n\
  \n让我们尝试使用这个 YAML 文件创建一个 Pod：\n\n`nginx-typo.yaml`\n\n```\n---\napiVersion: v1\n\
  kind: Pod\nmetadata:\n  name: nginx\nspec:\n  containers:\n  - name: nginx\n   \
  \ image: nginz\n```\n\n因为 Docker Hub 中没有名为 `nginz` 的镜像，因此无法拉取此镜像。让我们看看当我们将此资源添加到集群时会发生什么：\n\
  \n```\nroot@host01:~# kubectl apply -f /opt/nginx-typo.yaml\npod/nginx created\n\
  \nroot@host01:~# kubectl get pods\nNAME    READY   STATUS             RESTARTS \
  \  AGE\nnginx   0/1     ImagePullBackOff   0          20s\n```\n\n我们的 Pod 状态为 `ImagePullBackOff`，这立即信号了两个点。首先，这个\
  \ Pod 还没有到达容器运行阶段，因为它还没有拉取容器镜像。其次，与所有错误一样，Kubernetes 将继续尝试该操作，但它将使用退避（back-off）算法来避免过度消耗集群的资源。拉取镜像涉及通过网络与镜像仓库通信，在短时间内向仓库发送大量请求是无礼的，且会浪费网络带宽。此外，失败的原因可能是瞬态时的，因此集群将继续尝试，希望问题能得到解决。\n\
  \nKubernetes 使用退避算法来重试错误对于调试至关重要。在这种情况下，我们显然不会通过向 Docker Hub 发布一个 `nginz` 镜像来解决问题。但对于那些通过发布镜像或更改镜像权限来修复问题的情况，重要的是，Kubernetes\
  \ 不会立即捕捉到这些变化，因为每次尝试之间的延迟会随着每次失败而增加。\n\n让我们探索事件日志，以便看到这种退避行为：\n\n```\nroot@host01:~#\
  \ kubectl describe pod nginx\nName:         nginx\nNamespace:    default\n...\n\
  Status:     ➊ Pending \n...\nEvents:\n  Type     Reason     Age                \
  \ From               Message\n  ----     ------     ----                ----   \
  \            -------\n  Normal   Scheduled  114s                default-scheduler\
  \  Successfully \n    assigned default/nginx to host03\n...\n  Warning  Failed \
  \    25s (x4 over 112s)  kubelet            Failed to pull \n    image \"nginz\"\
  : ... ➋ pull access denied, repository does not exist or may \n    require authorization\
  \  ...\n...\n  Normal   BackOff    1s ➌ (x7 over 111s)   kubelet            ...\n\
  ```\n\n和之前一样，我们的 Pod 处于 `Pending` 状态 ➊。但情况下，Pod 已经过了调度阶段并进入了拉取镜像阶段。出于安全考虑，仓库不会区分没有访问权限的私有镜像和缺失的镜像，因此\
  \ Kubernetes 只能告诉我们问题是其中之一 ➋。最后，我们可以看到在我们创建此 Pod 的两分钟内，Kubernetes 已经尝试拉取了七次镜像 ➌，最后一次尝试是在一秒前进行的。\n\
  \n如果我们等几分钟，然后再次运行相同的 `kubectl describe` 命令并关注退避行为，我们可以看到尝试之间经过了很长的时间：\n\n```\nroot@host01:~#\
  \ kubectl describe pod nginx\nName:         nginx\nNamespace:    default\n...\n\
  Events:\n  Type     Reason     Age                   From               Message\n\
  \  ----     ------     ----                  ----               -------\n...\n \
  \ Normal   BackOff    4m                    58s                  kubelet       \
  \     ...\n```\n\nKubernetes 使用退避算法来重试错误对于调试至关重要。在这种情况下，我们显然不会通过向 Docker Hub 发布一个\
  \ `nginz` 镜像来解决问题。但对于那些通过发布镜像或更改镜像权限来修复问题的情况，重要的是，Kubernetes 不会立即捕捉到这些变化，因为每次尝试之间的延迟会随着每次失败而增加。\n\
  \n如果我们等几分钟，然后再次运行相同的 `kubectl describe` 命令并关注退避行为，我们可以看到尝试之间经过了很长的时间：\n\n### 运行容器\n\
  \n在指令容器运行时拉取任何镜像后，`kubelet` 随后启动容器。对于本章中的其余示例，我们假设容器运行时工作正常。此时，我们将遇到的主要问题是容器未启动的情况。\n\
  \n#### 使用日志进行调试\n\n对于我们的简单示例，我们首先需要一个启动时失败的容器的 Pod 定义。这是一个 PostgreSQL 的 Pod 定义，可以实现我们的需求：\n\
  \n`postgres-misconfig.yaml`\n\n```\n---\napiVersion: v1\nkind: Pod\nmetadata:\n\
  \  name: postgres\nspec:\n  containers:\n  - name: postgres\n    image: postgres\n\
  ```\n\n这个定义似乎没有问题，但 `PostgreSQL` 在容器运行时需要一些配置。\n\n我们使用 `kubectl apply` 创建 Pod：\n\
  \n```\nroot@host01:~# kubectl apply -f /opt/postgres-misconfig.yaml\npod/postgres\
  \ created\n```\n\n等大约分钟让镜像拉取，我们可以使用 `kubectl get` 检查状态，并注意到一个之前没过的状态：\n\n```\nroot@host01:~#\
  \ kubectl get pods\nNAME       READY   STATUS             RESTARTS     AGE\npostgres\
  \   0/1     CrashLoopBackOff   1 (8s ago)   25s\n```\n\n`CrashLoopBackOff` 状态表示\
  \ Pod 中的某个容器已退出。由于这不是 Kubernetes Job，它不期望容器退出，因此这被视为崩溃。\n\n如果你在正确的时间捕捉到 Pod，可能会看到\
  \ `Error` 状态而不是 `CrashLoopBackOff`。这是暂时的：Pod 在崩溃后会立即转换到该状态。\n\n\n\n与 `ImagePullBackOff`\
  \ 状态类似，`CrashLoopBackOff` 使用了一种算法来重试失败，每次失败都会增加重试之间的时间间隔，以避免过载集群。我们可以等几分钟然后再次打印状态，就能看到这种退避机制：\n\
  \n```\nroot@host01:~# kubectl get pods\n\nNAME       READY   STATUS            \
  \ RESTARTS       AGE\n\npostgres   0/1     CrashLoopBackOff   5 (117s ago)   5m3s\n\
  ```\n\n在重启五次后，我们重试之间的等待时间已经超过了一分钟。等待时间将继续增加，直到达到五分钟，之后 Kubernetes 将每隔五分钟继续重试一次，永此类推。\n\
  \n让我们像往常一样使用 `kubectl describe` 来尝试获取更多关于此失败的信息：\n\n```\nroot@host01:~# kubectl\
  \ describe pod postgres\n\nName:         postgres\n\nNamespace:    default\n\n...\n\
  \nContainers:\n\n  postgres:\n\n...\n\n    State:          Waiting\n      Reason:\
  \       CrashLoopBackOff\n\n    Last State:     Terminated\n      Reason:      \
  \ Error\n      Exit Code:    1\n\n...\n\nEvents:\n\n  Type     Reason     Age  \
  \                  From               Message\n  ----     ------     ----      \
  \             ----               -------\n\n...\n\n  Warning  BackOff    3m13s (x24\
  \ over 8m1s)  kubelet            Back-off \n\n    restarting failed container\n\
  ```\n\n`kubectl describe` 命令确实给了我们一个有用的信息：容器的退出码。然而，这真的只是告诉我们发生了某种错误；不足以完全调试该失败。为了确定容器失败\
  \ true，，我们将使用 `kubectl logs` 命令查看容器日志：\n\n```\nroot@host01:~# kubectl logs postgres\n\
  \nError: Database is uninitialized and superuser password is not specified.\n\n\
  \  You must specify POSTGRES_PASSWORD to a non-empty value for the\n  superuser.\
  \ For example, \"-e POSTGRES_PASSWORD=password\" on \"docker run\".\n\n...\n```\n\
  \n即使容器已经停止，我们仍然可以看到日志，因为容器运行时已经捕获了它们。\n\n这条信息直接来自 PostgreSQL 本身。幸运的是，它准确地告诉我们问题所在：我们缺少一个必需的环境变量。我们可以通过更新\
  \ YAML 资源文件来快速修复它：\n\n`postgres-fixed.yaml`\n\n```\n---\napiVersion: v1\nkind: Pod\n\
  metadata:\n  name: postgres\nspec:\n  containers:\n  - name: postgres\n    image:\
  \ postgres\n ➊ env:\n    - name: POSTGRES_PASSWORD\n      value: \"supersecret\"\
  \n```\n\n`env` 字段 ➊ 添加了一个配置来传递必需的环境变量。当然，在实际系统中，我们不会直接以明文形式将其放在 YAML 文件中。我们在第 16\
  \ 章 查看如何保护此类信息。\n\n要应用此更改，我们首先需要删除 Pod 定义，然后将新的资源配置应用到集群：\n\n```\nroot@host01:~#\
  \ kubectl delete pod postgres\n\npod \"postgres\" deleted\n\nroot@host01:~# kubectl\
  \ apply -f /opt/postgres-fixed.yaml\n\npod/postgres created\n```\n\n和之前一样，如果我们使用如\
  \ `Deployment` 的控制器，我们只需要更新 `Deployment`，它就会处理删除旧 Pod 并为我们创建一个新 Pod。\n\n现在我们修复了配置，我们的\
  \ PostgreSQL 容器按预期启动了：\n\n```\nroot@host01:~# kubectl get pods\n\nNAME       READY\
  \   STATUS    RESTARTS   AGE\npostgres   1/1     Running   0          77s\n```\n\
  \n在继续下一个示例之前，让我们清理掉这个 Pod：\n\n```\nroot@host01:~# kubectl delete pod postgres\n\n\
  pod \"postgres\" deleted\n```\n\n大多数编写良好的应用程序会在终止前打印日志消息，但我们需要为更困难的情况做好准备。让我们来看另一个包含两种新调试方法的示例。\n\
  \n### 使用 Exec 进行调试\n\n对于这个示例，我们需要一个行为不佳的应用程序。我们将使用一个执行了某些非常恶劣内存访问的 C 程序。该程序被封装在\
  \ Alpine Linux 容器中，以便我们可以在 Kubernetes 中以容器的形式运行它。这里是 C 源代码：\n\n`crasher.c`\n\n```c\n\
  int main() {\n  char *s = \"12\";\n  s[2] = '3';\n  return 0;\n}\n```\n\n第一行代码创建了一个指向长度为两个字符字符串的指针；接着尝试写入不存在的第三个字符，导致程序立即终止。\n\
  \n这个 C 程序可以在任何系统上通过 `gcc` 编译生成名为 `crasher` 的可执行文件。如果你在主机 Linux 系统上构建，请使用此 `gcc`\
  \ 命令：\n\n```bash\n$ gcc -g -static -o crasher crasher.c\n```\n\n`-g` 参数确保调试符号可用。我们稍后会用到它们。`-static`\
  \ 参数是最重要的；我们希望将其封装为 Alpine 容器镜像内部的一个独立运行程序。如果我们在不同的 Linux 发行版（如 Ubuntu）上构建，标准库基于不同的工具链，动态链接将失败。由于由于原因，我们希望可执行文件包含所有静态依赖。最后，我们使用\
  \ `-o` 指定输出的可执行文件名称，然后提供我们的 C 源文件名。\n\n或者，你也可以使用已经构建并发布到 Docker Hub 上名为 `bookkubernetes/crasher`\
  \ 的镜像。这个 `Dockerfile` 利用了多阶段构建来减小体积。为了在 Alpine 容器内编译，我们需要 `gcc` 和 `musl-dev`。然而，这些会让最终镜像变大。我们只在编译时需要它们，如下所示：\n\
  \n```dockerfile\nFROM alpine AS builder\nCOPY ./crasher.c /\nRUN apk --update add\
  \ gcc musl-dev && \\\n    gcc -g -static -o crasher crasher.c\n\nFROM alpine\nCOPY\
  \ --from=builder /crasher /crasher\nCMD [ \"/crasher\" ]\n```\n\n在使用第 5 章看到的 `docker\
  \ build` 命令运行此构建时，Docker 将创建一个基于 Alpine Linux 的容器，将源码复制进去，安装开发工具并编译应用程序。然后 Docker\
  \ 将启动一个全新的 Alpine 容器并从第一个容器复制结果。\n\n让我们在 Kubernetes 集群中运行这个镜像。这次我们将使用 `Deployment`\
  \ 资源，以便演示如何编辑崩溃的容器：\n\n`crasher-deploy.yaml`\n\n```yaml\n---\nkind: Deployment\n\
  apiVersion: apps/v1\nmetadata:\n  name: crasher\nspec:\n  replicas: 1\n  selector:\n\
  \    matchLabels:\n      app: crasher\n  template:\n    metadata:\n      labels:\n\
  \        app: crasher\n    spec:\n      containers:\n      - name: crasher\n   \
  \     image: bookkubernetes/crasher:stable\n```\n\n这个基础 Deployment 与我们在第 7 章介绍 Deployment\
  \ 时看到的非常相似。我们指定 `image` 字段以匹配发布的位置。\n\n我们可以按照通常的方式将此 Deployment 添加到集群：\n\n```bashroot@host01:~#\
  \ kubectl apply -f /opt/crasher-deploy.yaml\n\ndeployment.apps/crasher created\n\
  ```\n\n一旦 Kubernetes 有机会调度 Pod 并拉取镜像，它就会崩溃，正如预期：\n\n```\nroot@host01:~# kubectl\
  \ get pods\n\nNAME                       READY   STATUS             RESTARTS   \
  \   AGE\ncrasher-76cdd9f769-5blbn   0/1     CrashLoopBackOff   3 (24s ago)   73s\n\
  ```\n\n和之前一样，使用 `kubectl describe` 只告诉我们容器的退出码。还有另一种获取此退出码的方法；可以使用 `kubectl get`\
  \ 的 JSON 输出格式和 `jq` 工具来仅捕获退出码：\n\n\n\n\n\n```\nroot@host01:~# kubectl get pod crasher-7978d9bcfb-wvx6q\
  \ -o json | \\\n\n  jq '.status.containerStatuses[].lastState.terminated.exitCode'\n\
  \n139\n```\n\n请务必根据 `kubectl get pods` 的输出为你的 `Pod` 使用正确的名称。我们需要的特定字段路径是基于 Kubernetes\
  \ 内部跟踪该资源的方式；通过一些练习，你将更轻松地构建出 `jq` 路径来捕获特定字段，这在脚本编写中是一个非常实用的技巧。\n\n退出代码 `139` 告诉我们容器由于段错误（segmentation\
  \ fault）而退出了。然而，日志对于诊断问题没有帮助，因为我们的程序在崩溃之前没有打印任何内容：\n\n```\nroot@host01:~# kubectl\
  \ logs crasher-76cdd9f769-5blbn\n\n[ 无任何输出 ]\n```\n\n我们遇到了一个相当大的问题。日志没有用信息，因此下一步是使用\
  \ `kubectl exec` 进入容器内部。然而，当我们的应用程序崩溃时，容器会立即停止，留存时间不足以让我们进行任何调试工作。\n\n为了修复这个问题，我们需要一种在不运行崩溃程序的情况下启动此容器的方法。我们可以通过覆盖默认命令让我们的容器保持运行状态。由于我们是基于\
  \ Alpine Linux 镜像构建的，因此可以使用 `sleep` 命令来实现此目的。\n\n我们可以通过编辑 YAML 文件并这种方式更新 `Deployment`，但也可以使用\
  \ `kubectl edit` 直接编辑 `Deployment`，这会在编辑器中打开当前的定义，我们所做的任何更改将保存到集群中：\n\n```\nroot@host01:~#\
  \ kubectl edit deployment crasher\n```\n\n这会在编辑器窗口中打开 `vi`，并显示 YAML 格式的 `Deployment`\
  \ 资源。该资源包含的字段比我们创建它时提供的要得多，因为 Kubernetes 会向我们显示资源的状态以及一些带有默认值的字段。\n\n如果你不喜欢 `vi`，可以在\
  \ `kubectl edit` 命令前加上 `KUBE_EDITOR=nano` 来改用 `Nano` 编辑器。\n\n在文件中找到以下几行：\n\n```\n\
  \ spec:\n\n      containers:\n\n      - image: bookofkubernetes/crasher:stable\n\
  \n        imagePullPolicy: IfNotPresent\n```\n\n尽管 YAML 资源中没有这一行，但你仍看到 `imagePullPolicy`\
  \ 行，因为 Kubernetes 自动为该资源添加了默认策略。在 `image` 和 `imagePullPolicy` 之间添加新行，结果如下：\n\n```\n\
  \ spec:\n\n      containers:\n\n      - image: bookofkubernetes/crasher:stable\n\
  \n        args: [\"/bin/sleep\", \"infinity\"]\n\n        imagePullPolicy: IfNotPresent\n\
  ```\n\n新添加的这一行覆盖了容器的默认命令，使其运行 `sleep` 而不是运行我们的崩溃程序。保存并退出编辑器，`kubectl` 将获取新的定义：\n\
  \n```\ndeployment.apps/crasher edited\n```\n\n在 `kubectl` 将此更改应用到集群后，`Deployment`\
  \ 必须删除旧的 `Pod` 并创建一个新的。这是自动完成的，因此我们注意到的唯一区别是 `Pod` 名称中自动生成的部分。当然，我们还会看到 `Pod` 正在运行：\n\
  \n```\nroot@host01:~# kubectl get pods\n\nNAME                       READY   STATUS\
  \    RESTARTS   AGE\n\ncrasher-58d56fc5df-vghbt   1/1     Running   0          3m29s\n\
  ```\n\n我们的 `Pod` 现在正在运行，但它只是在运行 `sleep`。我们仍然需要调试实际应用程序。为了做到这一点，我们现在可以在容器内部获取 shell\
  \ 提示符：\n\n```\nroot@host01:~# kubectl exec -ti crasher-58d56fc5df-vghbt\n```\n\n\
  \n\n\n\n通过调试器，我们能够确切看到源代码中哪一行导致了段错误（segmentation fault），现在我们可以弄清楚如何修复它。\n\n### 结语\n\
  \n当我们把应用程序组件转换为容器镜像并在 `Kubernetes` 集群中运行它们时，我们在可扩展性和自动故障恢复方面获得了巨大的收益，但我们也引入了许多在运行应用程序时可能出现问题的新可能性，并且在调试这些问题时引入了新的挑战。在本章中，我们学习了如何使用\
  \ `Kubernetes` 命令系统地跟踪应用程序的启动和运行情况，以确定是什么因素阻止了它的正常工作。通过这些命令，我们可以调试发生在应用程序层面的任何问题，即使应用程序组件在容器化环境中无法正常启动也是如此。\n\
  \n现在我们已经对使用 `Kubernetes` 运行容器有了清晰的认识，可以开始深入研究集群本身的能力。在此过程中，我们将确保探索每个组件的工作原理，以便拥有诊断问题所需的工具。在下一章中，我们将详细查看\
  \ `Kubernetes` 控制平面。\n\n## 11 控制平面与访问控制\n\n![image](img/common01.jpg)\n\n控制平面管理\
  \ `Kubernetes` 集群，负责存储应用程序的期望状态、监控当前状态以检测并恢复任何问题、调度新容器以及配置网络路由。在本章中，我们将密切关注 `API\
  \ server`，它是控制平面的主要接口，也是任何状态检索和对整个集群更改的入口。\n\n尽管我们将重点关注 `API server`，但控制平面还包含多个其他服务，每个服务都有其角色。其他控制平面服务作为\
  \ `API server` 的客户端，观察集群变化并采取相应行动更新集群状态。以下列表描述了其他控制平面组件：\n\n- **Scheduler（调度器）**：将每个新的\
  \ `Pod` 分配到节点。\n- **Controller manager（控制器管理器）**：承担多个职责，包括为 `Deployments` 创建 `Pods`、监控节点以及对故障做出响应。\n\
  - **Cloud controller manager（云控制器管理器）**：这是一个可选组件，与底层云供应商接口以检查节点并配置网络流量路由。\n\n在我们演示\
  \ `API server` 的工作时，还将看到 `Kubernetes` 如何管理安全性，以确保只有授权的用户和服务才能查询集群并进行更改。像 `Kubernetes`\
  \ 这样的容器编排环境的目的是为我们可能运行的任何容器化应用程序提供平台，因此这种安全性对于确保集群仅按预期使用至关重要。\n\n### API Server\n\
  \n尽管 `API server` 在 `Kubernetes` 架构中处于核心位置，但它的目的很简单。它使用 `HTTP` 和表现层状态转换 (`REST`)\
  \ 暴露接口，对集群中的资源执行基本的创建、检索、更新和删除。它执行身份验证（authentication）以识别客户端，授权（authorization）以确保客户端拥有特定请求的权限，以及验证（validation）以确保任何创建或更新的资源符合相应的规范。它还根据从客户端收到的命令读写数据存储。\n\
  \n然而，`API server` 并不负责实际更新集群当前状态以匹配期望状态。那是其他控制平面和节点组件的职责。例如，如果客户端创建一个新的 `Kubernetes\
  \ Deployment`，`API server` 的工作仅仅是更新数据存储中的资源信息。然后，由 `scheduler` 决定 `Pods` 运行在何处，并由分配节点上的\
  \ `kubelet` 服务负责创建和监控容器，以及配置网络将流量路由到容器中。\n\n对于本章，我们通过自动化脚本配置了一个三节点的 `Kubernetes`\
  \ 集群。三个节点中的每一个节点都充当控制平面节点，因此运行着三个副本的 `API server`。我们可以与这三个中的任何一个进行通信，因为它们共享同一个后端数据库。`API\
  \ server` 在默认端口 `6443` 上监听安全的 `HTTP` 连接。\n\n**注意**\n\n本书的示例代码库位于 [`github.com/book-of-kubernetes/examples`](https://github.com/book-of-kubernetes/examples)。详情参见第\
  \ xx 页运行示例。\n\n我们一直在使用 `kubectl` 与 `API server` 通信以创建和删除资源并检索状态，且 `kubectl` 一直使用端口\
  \ `6443` 上的安全 `HTTP` 与集群通信。它之所以这样做，是因为 `kubeadm` 在集群初始化时安装到 `/etc/kubernetes` 中的一个\
  \ `Kubernetes` 配置文件。该配置文件还包含身份验证信息，赋予了我们读取集群状态和进行更改的权限。\n\n由于 `API server` 期望安全的\
  \ `HTTP`，我们可以使用 `curl` 直接与 `Kubernetes API` 通信。这将让我们更好地感受通信实际上是如何工作的。让我们从一个简单的 `curl`\
  \ 命令开始：\n\n```\nroot@host01:~# curl https://192.168.61.11:6443/\n\ncurl: (60) SSL\
  \ certificate problem: unable to get local issuer certificate\n\nMore details here:\
  \ https://curl.se/docs/sslcerts.html\n\n...\n```\n\n此错误消息显示 `curl` 不信任 `API server`\
  \ 提供的证书。我们可以使用 `curl` 查看此证书：\n\n```\nroot@host01:~# curl -kv https://192.168.61.11:6443/\n\
  \n...\n\n* Server certificate:\n\n*  subject: CN=kube-apiserver\n\n...\n\n*  issuer:\
  \ CN=kubernetes\n\n...\n```\n\n`-k` 告诉 `curl` 忽略证书问题，而 `-v` 告诉 `curl` 提供额外的日志信息。\n\
  \n为了让 `curl` 信任此证书，它需要信任发行者，因为发行者是该证书的签名者。让我们从 `Kubernetes` 安装中获取证书，以便让 `curl` 指向它：\n\
  \n```\nroot@host01:~# cp /etc/kubernetes/pki/ca.crt .\n```\n\n确保在末尾添加 `.` 以将文件复制到当前目录。我们这样做完全是为了方便后续命令的操作。\n\
  \n在使用之前，让我们检查此证书：\n\n```\nroot@host01:~# openssl x509 -in ca.crt -text\n\nCertificate:\n\
  \n...\n\n        Issuer: CN = kubernetes\n\n...\n\n        Subject: CN = kubernetes\n\
  ```\n\n发行者和主体相同，因此这是一个自签名证书。它是我们在初始化集群时由 `kubeadm` 创建的。生成的证书允许 `kubeadm` 适应我们特定的网络配置，并允许集群在不需要外部证书颁发机构（CA）的情况下拥有独特的证书和密钥。然而这意味着我们需要需要在此\
  \ API server 通信的系统上配置 `kubectl` 信任此证书。\n\n现在我们可以告诉 `curl` 使用此证书来验证 `API server`：\n\
  \n```\nroot@host01:~# curl --cacert ca.crt https://192.168.61.11:6443/\n\n{\n\n\
  ...\n\n  \"status\": \"Failure\",\n\n  \"message\": \"forbidden: User \\\"system:anonymous\\\
  \" cannot get path \\\"/\\\"\",\n\n...\n\n  \"code\": 403\n\n}\n```\n\n现在我们为 `curl`\
  \ 提供了正确的根证书，`curl` 就可以验证 `API server` 证书，我们可以成功连接到 `API server`。然而，`API server`\
  \ 返回了 403 错误，表明我们没有权限。这是因为此时我们没有为 `curl` 提供任何传递给 `API server` 的身份验证信息，因此 `API server`\
  \ 将我们视为匿名用户。\n\n\n\n\n\n最后一点说明：为了让此 `curl` 命令生效，我们需要对使用的主机名或 IP 地址进行选择性处理。API 服务器正在监听所有网络接口，因此我们可以使用\
  \ `localhost` 或 `127.0.0.1` 连接到它。然而，这些地址并没有列在 `kube-apiserver` 证书列表中，因此无法用于安全的 HTTP\
  \ 连接，因为 `curl`不会信任该连接。\n\n### API 服务器身份验证\n\n在 API 服务器接受我们的请求之前，我们需要提供身份验证信息，因此让我们了解一下\
  \ API 服务器的身份验证流程。身份验证通过一组插件处理，每个插件都会检查请求以确定其是否可以识别客户端。第一个成功识别客户端的插件将向 API 服务器提供身份信息。然后，该身份信息将结合授权（authorization）使用，以确定客户端被允许执行的操作。\n\
  \n由于身份验证是基于插件的，可以根据需要提供任意不同的客户端身份验证方式。甚至可以在 API 服务器的前端添加一个代理，执行自定义的身份验证逻辑，并在 HTTP\
  \ 请求头中将用户身份传递给 API 服务器。\n\n出于我们的目的，我们将关注在集群内部或作为集群设置过程部分的三个主要身份验证插件：`client certificates`（客户端证书）、`bootstrap\
  \ tokens`（引导令牌）和 `service accounts`（服务账户）。\n\n#### 客户端证书\n\n如之前提到的，像 `curl` 这样的\
  \ HTTP 客户端通过将服务器主机与其证书进行比较，并对照受信任 CA 列表检查证书签名来验证服务器的身份。除了检查服务器身份外，安全的 HTTP 还允许客户端向服务器提交证书。服务器根据其受信任权威机构列表检查签名，然后使用证书的主题（subject）作为客户端的身份。\n\
  \nKubernetes 广泛使用 HTTP 客户端证书身份验证，使集群服务能够与 API 服务器进行验证。这包括控制平面组件以及运行在每个节点上的 `kubelet`\
  \ 服务。我们可以使用 `kubeadm` 列出控制平面使用的证书：\n\n```\nroot@host01:~# kubeadm certs check-expiration\n\
  \n...\n\nCERTIFICATE                ...  RESIDUAL TIME   CERTIFICATE AUTHORITY ...\n\
  \nadmin.conf                 ...  363d                                  ...\n\n\
  apiserver                  ...  363d            ca                    ...\n\napiserver-etcd-client\
  \      ...  363d            etcd-ca               ...\n\napiserver-kubelet-client\
  \   ...  363d            ca                    ...\n\ncontroller-manager.conf  \
  \  ...  363d                                  ...\n\netcd-healthcheck-client   \
  \ ...  363d            etcd-ca               ...\n\netcd-peer                  ...\
  \  363d            etcd-ca               ...\n\netcd-server                ... \
  \ 363d            etcd-ca               ...\n\nfront-proxy-client         ...  363d\
  \            front-proxy-ca        ...\n\nscheduler.conf             ...  363d \
  \                                 ...\n\n...\n```\n\n`RESIDUAL TIME` 列显示了这些证书过期前剩余的次数；默认情况下，它们在一年后过期。使用\
  \ `kubeadm certs renew` 来刷新它们，并将证书名称作为参数传递。\n\n列表中的第一项 `admin.conf` 是我们在过去几个章节中向集群进行身份验证的方式。在初始化期间，`kubeadm`\
  \ 创建了此证书并将其信息存储在 `/etc/kubernetes/admin.conf` 文件中。我们运行的每个 `kubectl` 命令都使用了这个文件，因为我们的自动化脚本设置了\
  \ `KUBECONFIG` 环境变量：\n\n```\nroot@host01:~# echo $KUBECONFIG\n\n/etc/kubernetes/admin.conf\n\
  ```\n\n如果我们没有设置 `KUBECONFIG`，`kubectl` 将使用默认值，即用户家目录下的 `.kube/config` 文件。\n\n`admin.conf`\
  \ 凭据是我们在过去几个章节中向集群进行身份验证的方式。在初始化期间，`kubeadm` 创建了此证书并将其信息存储在 `/etc/kubernetes/admin.conf`\
  \ 文件中。我们运行的每个 `kubectl` 命令都使用了这个文件，因为我们的自动化脚本设置了 `KUBECONFIG` 环境变量：\n\n```\nroot@host01:~#\
