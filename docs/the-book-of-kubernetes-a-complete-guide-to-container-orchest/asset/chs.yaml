  \ 服务器示例。正如我们将看到的，通过这个版本，我们可以仅使用 Kubernetes 资源 YAML 文件来声明 HTML 内容，而无需使用控制命令将内容复制到\
  \ `PersistentVolume`。\n\n第一步是定义一个包含我们要提供的 HTML 内容的 `ConfigMap`：\n\n`nginx-cm.yaml`\n\
  \n```\n---\nkind: ConfigMap\napiVersion: v1\nmetadata:\n  name: nginx\ndata:\n \
  \ index.html: |\n    <html>\n      <head>\n        <title>Hello, World</title>\n\
  \      </head>\n      <body>\n        <h1>Hello, World from Kubernetes!</h1>\n \
  \     </body>\n    </html>\n```\n\n\n\n\n\n```\nroot@host01:~# kubectl exec -ti\
  \ nginx-58bc54b5cd-4lbkq -- /bin/mount\n\n...\n\n/dev/sda1 on /usr/share/nginx/html\
  \ type ext4 (ro,relatime)\n\n...\n```\n\n`mount` 命令报告目录 `/usr/share/nginx/html`\
  \ 是一个来自宿主机主磁盘 `/dev/sda1` 的独立挂载路径。\n\n我们已经完成了 NGINX 部署（Deployment），现在可以将其删除：\n\n\
  ```\nroot@host01:~# kubectl delete deploy nginx\n\ndeployment.apps \"nginx\" deleted\n\
  ```\n\n接下来，让我们来看看 `ConfigMap` 和 `Secret` 信息是如何存储在典型的 Kubernetes 集群中的，这样我们就能看到 `kubelet`\
  \ 是从哪里获取这些内容的。\n\n### 集群配置仓库\n\n虽然可以使用不同的配置仓库选择来运行 Kubernetes 集群，但大多数 Kubernetes\
  \ 集群都使用 `etcd` 作为所有集群配置数据的后端存储。这不仅包括 `ConfigMap` 和 `Secret` 的存储，还包括所有的其他集群资源和当前集群状态。在具有多个\
  \ API 服务器的高可用配置下运行时，Kubernetes 还会使用 `etcd` 来选出领导（leader）。\n\n尽管 `etcd` 通常稳定且可靠，但节点故障可能导致\
  \ `etcd` 集群无法重新建立自身并选出领导。我们演示 `etcd` 的目的不仅是为了查看配置数据的存储方式，还为了给管理员可能需要调试的关键集群组件提供一些有用的背景。\n\
  \n对于我们所有的示例集群，`etcd` 安装在与 API server 相同的节点上，这在较小的集群中很常见。在大型集群中，在单独节点上运行 `etcd` 以允许其独立于\
  \ Kubernetes 控制平面进行扩展是更常见的做法。\n\n为了探索 `etcd` 后端存储的内容，我们将使用 `etcdctl`，这是一种用于控制和排错\
  \ `etcd` 的命令行客户端。\n\n#### 使用 `etcdctl`\n\n我们需要告诉 `etcdctl` 我们的 `etcd` 服务实例位于何处以及如何进行身份验证。对于身份验证，我们将使用与\
  \ API server 相同的客户端证书。\n\n为了方便起见，我们可以设置 `etcdctl` 将读取的环境变量，这样我们就不需要在执行每个命令时通过命令行传递这些值了。\n\
  \n我们需要的环境变量如下：\n\n`etcd-env`\n\n```\nexport ETCDCTL_API=3\n\nexport ETCDCTL_CACERT=/etc/kubernetes/pki/etcd/ca.crt\n\
  \nexport ETCDCTL_CERT=/etc/kubernetes/pki/apiserver-etcd-client.crt\n\nexport ETCDCTL_KEY=/etc/kubernetes/pki/apiserver-etcd-client.key\n\
  \nexport ETCDCTL_ENDPOINTS=https://192.168.61.11:2379\n```\n\n这些变量对 `etcdctl` 的配置如下：\n\
  \n`ETCDCTL_API`: 使用版本 3 的 `etcd` API。在最近版本的 `etcd` 中，仅支持版本 3。\n\n`ETCDCTL_CACERT`:\
  \ 使用提供的证书授权机构验证 `etcd` 主机。\n\n`ETCDCTL_CERT`: 使用此证书对 `etcd` 进行身份验证。\n\n`ETCDCTL_KEY`:\
  \ 使用此私钥对 `etcd` 进行身份验证。\n\n`ETCDCTL_ENDPOINTS`: 连接到此 URL 的 `etcd`。虽然 `etcd` 运行在三个节点上，但我们只需要其中一个节点与其通信即可。\n\
  \n在我们的示例中，这些环境变量方便地存储在 `/opt` 下一个脚本中，以便我们可以加载它们供后续命令使用：\n\n```\nroot@host01:~# source\
  \ /opt/etcd-env\n```\n\n我们现在可以使用 `etcdctl` 命令来检查集群以及其存储的配置数据。让我们先列出所有的集群成员：\n\n\
  ```\nroot@host01:~# etcdctl member list\n\n45a2b6125030fdde, started, host02, https://192.168.61.12:2380,\
  \ https://192.168.61.12:2379\n\n91007aab9448ce27, started, host03, https://192.168.61.13:2380,\
  \ https://192.168.61.13:2379\n\nbf7b9991d532ba78, started, host01, https://192.168.61.11:2380,\
  \ https://192.168.61.11:2379\n```\n\n正如预期的，每个控制平面节点都有一个 `etcd` 实例。对于高可用配置，我们需要至少运行三个实例，并且需要大多数实例处于运行状态，集群才能保持健康。此\
  \ `etcdctl` 命令是判断集群是否存在故障结点的良好第一步。\n\n只要集群是健康的，我们就可以存储和检索数据。在 `etcd` 内部，信息以键值对的形式存储。键被指定为层级结构中的路径。我们可以列出包含内容的路径：\n\
  \n```\nroot@host01:~# etcdctl get / --prefix --keys-only\n\n...\n\n/registry/configmaps/default/nginx\n\
  \n/registry/configmaps/default/pgsql\n\n...\n\n/registry/secrets/default/pgsql\n\
  \n...\n```\n\n`--prefix` 标志告诉 `etcdctl` 获取所有以 `/` 开头的键，而 `--keys-only` 确保只打印键，以防止被数据淹没。尽管如此，`etcdctl`\
  \ 命令仍然允许我们看到其结构。\n\n#### 解密 `etcd` 中的数据\n\n`etcd` 存储格式使用键值存储。为了理解数据是如何存储的，我们可以查看原始值。\n\
  \n\n\n\n`protoc` 工具主要用于生成用于读写 protobuf 消息的源代码，但它对于消息解码也非常方便。正如我们所见，protobuf 消息内部包含了\
  \ Kubernetes 为此 `Secret` 存储的所有数据，包括资源版本（resource version）、类型、资源名称、命名空间以及数据（data）。这说明了前面提到的，访问运行\
  \ Kubernetes 的宿主机就可以访问集群中所有的 secret 数据。即使我们配置了 Kubernetes 在将数据存储到 `etcd` 之前对其进行加密，加密密钥本身也需要以明文形式存储在\
  \ `etcd` 中，以便 API server 使用它们。\n\n## 总结与结语\n\n通过能够为 Pod 提供环境变量或文件，`ConfigMaps` 和\
  \ `Secrets` 允许我们将容器的配置外部化，这使得在不同的应用程序中重用 Kubernetes 资源定义（如 `Deployments`）和容器镜像成为可能。\n\
  \n同时，我们需要意识到 Kubernetes 是如何存储这些配置数据的以及它是如何提供给容器的。任何拥有相应角色的人都可以使用 `kubectl` 访问配置数据；任何可以访问运行容器的主机的人都可以从容器运行时访问它；任何拥有正确身份验证信息的人都可以直接从\
  \ `etcd` 访问它。对于生产集群而言，确保所有机制都得到正确的安全保护至关重要。\n\n到目前为止，我们看到了 Kubernetes 如何在 `etcd`\
  \ 中存储内置集群资源数据，但 Kubernetes 也可以存储我们可能选择声明的任何自定义资源数据。在下一章中，我们将探索自定义资源定义（Custom Resource\
  \ Definitions）如何允许以 `operators` 的形式为 Kubernetes 集群添加新行为。\n\n## 17. 自定义资源与算器\n\n\
  ![image](img/common01.jpg)\n\n我们已经看到 Kubernetes 集群中使用了许多不同的资源类型来运行容器工作负载、扩展它们、配置它们、为它们路由网络流量并为它们提供存储。然而，Kubernetes\
  \ 集群强大的功能之一是可以定义自定义资源类型，并将其与我们已经过的所有内置资源类型一起集成到集群中。\n\n自定义资源定义允许我们定义任何新的资源类型并让集群跟踪相应的资源。我们可以利用这一能力为我们的集群添加复杂的新行为，例如自动部署高可用数据库引擎，同时利用内置资源类型的所有现有功能以及集群控制平面对资源和状态的管理能力。\n\
  \n在本章中，我们将看到自定义资源定义是如何工作的，以及我们如何使用它们来部署 Kubernetes `operators`，扩展我们的集群以承担我们所需的任何额外行为。\n\
  \n### 自定义资源\n\n在[第 6 章]中，我们讨论了 Kubernetes API 服务器如何提供声明式 API，其主要操作是创建、读取、更新和删除集群中的资源。声明式\
  \ API 在弹性方面具有优势，因为集群可以跟踪资源的预期状态，并努力确保集群保持在该预期状态。然而，声明式 API 在扩展性方面也具有显著优势。API 服务器\
  \ 提供的操作足够通用，易于将它们扩展到任何类型的资源。\n\n我们已经看到 Kubernetes 如何利用这种扩展性随时间推移更新其 API。Kubernetes\
  \ 不仅可以随着时间推移支持资源的新版本，还可以在通过旧资源保持向后兼容的同时，向集群中添加具有新功能的全新资源。我们在[第 7 章]中对 `HorizontalPodAutoscaler`\
  \ 版本 2 的新功能的讨论中，以及 `Deployment` 替换 `ReplicationController` 的方式看到了这一点。\n\n在 `CustomResourceDefinitions`\
  \ 的使用中，我们真正看到了这种扩展性的力量。自定义资源定义（或 `CRD`）允许我们动态地向集群添加任何新的资源类型。我们只需向 API 服务器提供新资源类型的名称以及用于验证的规范（specification），API\
  \ 服务器就会立即允许我们创建、读取、更新和删除该新类型的资源。\n\n`CRDs` 极其有用且被广泛使用。例如，已经部署到我们集群中的基础设施组件包含了 `CRDs`。\n\
  \n**注意**\n\n本书的示例仓库位于 [`github.com/book-of-kubernetes/examples`](https://github.com/book-of-kubernetes/examples)。请参阅[第\
  \ xx 页]上的“运行示例”获取设置的详情。\n\n让我们看看已经注册到我们集群中的 `CRDs`：\n\n```\nroot@host01:~# kubectl\
  \ get crds\n\nNAME                                                  CREATED AT\n\
  \n...\n\nclusterinformations.crd.projectcalico.org             ...\n\n...\n\ninstallations.operator.tigera.io\
  \                      ...\n\n...\n\nvolumes.longhorn.io                       \
  \            ...\n```\n\n为了避免命名冲突，`CRD` 的名称必须包含一个组（group），该组通常基于域名以确保唯一性。该组还用于为\
  \ API server 提供的 REST API 建立该资源的路径。在这个示例中，我们看到了 `crd.projectcalico.org` 组和 `operator.tigera.io`\
  \ 组中的 `CRDs`，它们都被 Calico 使用。我们还看到了 `longhorn.io` 组中的一个 `CRD`，由 Longhorn 使用。\n\n\
  这些 `CRDs`  Calico 和 Longhorn 使用 Kubernetes API 在 `etcd` 中记录配置和状态信息。`CRDs` 还简化了自定义配置。例如，作为将\
  \ Calico 部署到集群的一部分，自动化创建了一个对应于 `installations.operator.tigera.io` `CRD` 的 `Installation`\
  \ 资源：\n\n*custom-resources.yaml*\n\n```yaml\n---\napiVersion: operator.tigera.io/v1\n\
  kind: Installation\nmetadata:\n  name: default\nspec:\n  calicoNetwork:\n    ipPools:\n\
  \    - blockSize: 26\n      cidr: 172.31.0.0/16\n```\n\n这就是 Pod 获得 172.31.0.0/16\
  \ 地址的原因。该 YAML 文件自动放置在组件。\n\n### 创建 CRD\n\n让我们通过创建自己的 CRD 来进一步探索 `CRDs`。我们将使用[列表\
  \ 17-1]中的定义。\n\n*crd.yaml*\n\n```yaml\n---\napiVersion: apiextensions.k8s.io/v1\n\
  kind: CustomResourceDefinition\nmetadata:\n  name: samples.bookofkubernetes.com\n\
  spec:\n  group: bookofkubernetes.com\n  versions:\n    - name: v1\n      served:\
  \ true\n      storage: true\n      schema:\n        openAPIV3Schema:\n         \
  \ type: object\n          properties:\n            spec:\n              type: object\n\
  \              properties:\n                value:\n                  type: integer\n\
  \  scope: Namespaced\n  names:\n    plural: samples\n    singular: sample\n    kind:\
  \ Sample\n    shortNames:\n      - sam\n```\n\n*列表 17-1：Sample CRD*\n\n定义包含多个重要部分。首先，定义了多种类型的名称。metadata\
  \ name 字段 必须结合资源的复数名称 ➎ 和组 ➋。这些命名组件对于通过 API 访问也同样重要。\n\n命名还包含了 kind ➐，它用于 YAML 文件。这意味着当我们根据此\
  \ CRD 创建特定资源时，我们将使用 kind: Sample 来标识它们。最后，我们需要定义如何在命令行中引用 CRD 的实例。这包括在单数 ➏ 字段中指定的资源完整名称，以及我们希望命令行识别的任何\
  \ shortNames ➑。\n\n\n\n\n现在我们已经根据这个 CRD 为 Kubernetes 提供了实例所需的所有名称，我们可以继续讨论 CRD 是如何被跟踪的以及它包含哪些数据了。`scope`\
  \ ➍ 告诉 Kubernetes 该资源应该在 Namespace（命名空间）级别进行跟踪，还是在整个集群范围内有效。命名空间资源会获得一个包含其所属 Namespace\
  \ 的 API 路径，并且访问和修改命名空间资源的权限可以通过 `Roles` 和 `RoleBindings` 按照 Namespace 的单位进行细粒度控制，正如我们在第\
  \ 11 节 中看到的那样。\n\n第三，`versions` 部分允许我们定义创建基于此 CRD 的资源时有效的实际内容。为了支持随时间推移的更新，可以存在多个版本。每个版本都有一个声明哪些字段是有效的\
  \ schema。在这种情况下，我们定义了一个 `spec` 字段，其中包含一个名为 `value` 的字段，并声明该字段为整数。\n\n这里有很多必需的配置，所以让我们回顾一下结果。这个\
  \ CRD 允许我们告诉 Kubernetes 集群为我们跟踪一种全新的资源类型，即 `Sample`。该资源的每个实例（每个 `Sample`）都将属于一个\
  \ Namespace，并在 `value` 字段中包含一个整数。\n\n让我们在集群中创建这个 CRD：\n\n```\nroot@host01:~# kubectl\
  \ apply -f /opt/crd.yaml\n\ncustomresourcedefinition...k8s.io/samples.bookofkubernetes.com\
  \ created\n```\n\n我们现在可以创建这种类型的对象并从集群中检索它们了。这里有一个 YAML 定义示例，使用我们定义的 CRD 来创建一个新的\
  \ `Sample`：\n\n`sample.yaml`\n\n```\n---\n\napiVersion: bookofkubernetes.com/v1\n\
  \nkind: Sample\n\nmetadata:\n\n  namespace: default\n\n  name: somedata\n\nspec:\n\
  \n  value: 123\n```\n\n我们将 `apiVersion` 和 `kind` 与我们的 CRD 匹配，并确保 `spec` 与 schema\
  \ 一致。这意味着我们被要求提供一个名为 `value` 整数值为整数字段。\n\n我们现在可以像创建任何其他资源一样在集群中创建这个资源：\n\n```\n\
  root@host01:~# kubectl apply -f /opt/somedata.yaml \n\nsample.bookofkubernetes.com/somedata\
  \ created\n```\n\n现在有了一个名为 `somedata` 的 `Sample`，它是默认 Namespace 的一部分。\n\n我们在列表 17-1\
  \ 中定义 CRD 时，我们为 `Sample` 资源指定了复数、单数形式和短名称。我们可以使用这些名称中的任何一个来检索新资源：\n\n```\nroot@host01:~#\
  \ kubectl get samples\n\nNAME       AGE\n\nsomedata   56s\n\nroot@host01:~# kubectl\
  \ get sample\n\nNAME       AGE\n\nsomedata   59s\n\nroot@host01:~# kubectl get sam\n\
  \nNAME       AGE\n\nsomedata   62s\n```\n\n仅仅通过声明我们的 CRD，我们就扩展了 Kubernetes 集群的行为，使其理解什么是\
  \ samples，而且我们不仅可以在 API 中使用它，还可以在命令行工具中使用它。\n\n这意味着 `kubectl describe` 也适用于 `Samples`。我们可以看到\
  \ Kubernetes 还跟踪了与我们新资源相关的其他数据，而不仅仅是我们指定的数据：\n\n```\nroot@host01:~# kubectl describe\
  \ sample somedata\n\nName:         somedata\n\nNamespace:    default\n\n...\n\n\
  API Version:  bookofkubernetes.com/v1\n\nKind:         Sample\n\nMetadata:\n\n \
  \ Creation Timestamp:  ...\n\n...\n\n  Resource Version:  9386\n\n  UID:       \
  \        37cc58db-179f-40e6-a9bf-fbf6540aa689\n\nSpec:\n\n  Value:  123\n\nEvents:\
  \   <none>\n```\n\n如果我们想使用来自 CRD 的数据，这些额外数据（包括时间戳和资源版本）是必须的。为了有效使用我们的新资源，我们需要一个软件组件持续监控资源的新或更新实例并采取相应的行动。我们将使用普通的\
  \ Kubernetes `Deployment` 来运行此组件，它与 Kubernetes API 服务器进行交互。\n\n### 监听 CRD\n\n对于\
  \ Kubernetes 核心资源，控制平面组件与 API 服务器通信，以便在资源创建、更新或删除时采取正确的操作。例如，控制器管理器（controller manager）包含一个监听\
  \ `Services` 和 `Pods` 变化的组件，使其能够更新每个 `Service` 的端点列表。节点上的 `kube-proxy` 实例随后执行必要的网络路由更改，根据这些端点将流量发送到\
  \ `Pods`。\n\n对于 CRD，API 服务器仅在资源被创建、更新和删除时对其进行跟踪。由其他软件负责监控资源实例并采取正确的操作。为了方便监控资源，API\
  \ 服务器提供了 `watch` 动作，使用 `long polling`（长轮询）保持连接开启并在事件发生时持续馈送。由于长轮询连接可能在任何时候断开，Kubernetes\
  \ 为我们跟踪的时间戳和资源版本数据将允许我们在重新连接时检测出已经处理了哪些集群更改。\n\n我们可以直接通过 `curl` 命令或直接在 HTTP 客户端使用\
  \ API 服务器的监听功能，但使用 Kubernetes 客户端库要简单得多。在这个示例中，我们将使用 Python 客户端库来演示如何监听我们的自定义资源。这里是我们将使用的\
  \ Python 脚本：\n\n`watch.py`\n\n```python\n#!/usr/bin/env python3\n\nfrom kubernetes\
  \ import client, config, watch\n\nimport json, os, sys\n\ntry:\n  ➊ config.load_incluster_config()\n\
  except:\n  print(\"In cluster config failed, falling back to file\", file=sys.stderr)\n\
  ➋ config.load_kube_config()\n➌ group = os.environ.get('WATCH_GROUP', 'bookofkubernetes.com')\n\
  version = os.environ.get('WATCH_VERSION', 'v1')\nnamespace = os.environ.get('WATCH_NAMESPACE',\
  \ 'default')\nresource = os.environ.get('WATCH_RESOURCE', 'samples')\n\napi = client.CustomObjectsApi()\n\
  w = watch.Watch()\n➍ for event in w.stream(api.list_namespaced_custom_object,\n\
  \      group=group, version=version, namespace=namespace, plural=resource):\n➎ json.dump(event,\
  \ sys.stdout, indent=2)\n  sys.stdout.flush()\n```\n\n我们将在一个 Kubernetes `Deployment`\
  \ 中运行这个脚本。我已经构建并发布了一个容器镜像来运行它，所以这是一个简单的任务。这里是 Deployment 的定义：\n\n`watch.yaml`\n\n\
  ```yaml\n---\n\nkind: Deployment\n\napiVersion: apps/v1\n\nmetadata:\n  name: watch\n\
  \nspec:\n  replicas: 1\n  selector:\n    matchLabels:\n      app: watch\n\n  template:\n\
  \    metadata:\n      labels:\n        app: watch\n    spec:\n      containers:\n\
  \      - name: watch\n        image: bookofkubernetes/crdwatcher:stable\n      serviceAccountName:\
  \ watcher\n```\n\n\n\n此 Deployment 将运行一个 Python 脚本，用于监听 `Sample` CRD 实例上的事件。然而，在创建此\
  \ Deployment 之前，我们需要确保监听脚本具有读取自定义资源的权限。默认的 `ServiceAccount` 权限最小，因此我们需要为此 Deployment\
  \ 创建一个 `ServiceAccount`并确保它有查看我们的 `Sample` 自定义资源的权限。\n\n我们可以通过将自定义的 `Role` 绑定到 `ServiceAccount`\
  \ 来实现这一点，但利用角色聚合（role aggregation）将我们的 `Sample` 自定义资源添加到已有的 `view` `ClusterRole`\
  \ 中会更方便。这样，集群中任何拥有 `view` `ClusterRole` 的用户都将获得我们 `Sample` 自定义资源的权限。\n\n我们首先为自定义资源定义一个新的的\
  \ `ClusterRole`：\n\n*sample-reader.yaml*\n\n```yaml\n---\napiVersion: rbac.authorization.k8s.io/v1\n\
  kind: ClusterRole\nmetadata:\n  name: sample-reader\n  labels:\n    ➊ rbac.authorization.k8s.io/aggregate-to-view:\
  \ \"true\"\nrules:\n  ➋ - apiGroups: [\"bookofkubernetes.com\"]\n    resources:\
  \ [\"samples\"]\n    verbs: [\"get\", \"watch\", \"list\"]\n```\n\n此 `ClusterRole`\
  \ 赋予了获取、监听和列出我们的 `Sample` 自定义资源的权限 ➋。我们还在 metadata 中添加了一个标签 ➊，向集群信号我们希望将这些权限聚合到\
  \ `view` `ClusterRole` 中。因此，我们不需要将 `ServiceAccount` 绑定到此处此处定义的 `sample-reader` `ClusterRole`\
  \ 中，而是可以将其绑定到通用的 `view` `ClusterRole` 中，赋予它对所有类型资源的只读访问权限。\n\n我们还需要声明 `ServiceAccount`\
  \ 并将其绑定到 `view` `ClusterRole`：\n\n*sa.yaml*\n\n```yaml\n---\napiVersion: v1\nkind:\
  \ ServiceAccount\nmetadata:\n  name: watcher\n  namespace: default\n---\nkind: RoleBinding\n\
  apiVersion: rbac.authorization.k8s.io/v1\nmetadata:\n  name: viewer\n  namespace:\
  \ default\nsubjects:\n- kind: ServiceAccount\n  name: watcher\n  namespace: default\n\
  roleRef:\n  kind: ClusterRole\n  name: view\n  apiGroup: rbac.authorization.k8s.io\n\
  ```\n\n我们使用 `RoleBinding` 将此 `ServiceAccount` 限制为仅对默认 `Namespace` 的只读访问。`RoleBinding`\
  \ 将 `watcher` `ServiceAccount` 绑定到通用的 `view` `ClusterRole`。得益于我们指定的角色聚合，该 `ClusterRole`\
  \ 将具有访问我们 `Sample` 自定义资源的权限。\n\n现在我们准备好应用所有资源，包括我们的 Deployment：\n\n```bash\nroot@host01:~#\
  \ kubectl apply -f /opt/sample-reader.yaml \nclusterrole.rbac.authorization.k8s.io/sample-reader\
  \ created\n\nroot@host01:~# kubectl apply -f /opt/sa.yaml\nserviceaccount/watcher\
  \ created\nrolebinding.rbac.authorization.k8s.io/viewer created\n\nroot@host01:~#\
  \ kubectl apply -f /opt/watch.yaml \ndeployment.apps/watch created\n```\n\n过了一会儿，我们的\
  \ watcher Pod 将运行：\n\n```bash\nroot@host01:~# kubectl get pods\nNAME           \
  \          READY   STATUS    RESTARTS   AGE\nwatch-69876b586b-jp25m   1/1     Running\
  \   0          47s\n```\n\n我们可以打印 watcher 的日志，查看它从 API 服务器收到的事件：\n\n```bash\nroot@host01:~#\
  \ kubectl logs watch-69876b586b-jp25m\n{\n  \"type\": \"ADDED\",\n  \"object\":\
  \ {\n    \"apiVersion\": \"bookofkubernetes.com/v1\",\n    \"kind\": \"Sample\"\
  ,\n    \"metadata\": {\n      \"creationTimestamp\": \"...\",\n      \"name\": \"\
  somedata\",\n      \"namespace\": \"default\",\n      \"resourceVersion\": \"9386\"\
  ,\n      \"uid\": \"37cc58db-179f-40e6-a9bf-f6540aa689\"\n    },\n    \"spec\":\
  \ {\n      \"value\": 123\n    }\n  }\n注意 watcher Pod 接收到了我们创建的 `somedata` `Sample`\
  \ 的 `ADDED` 事件，尽管我们在部署 watcher 之前已经创建了该 `Sample`。API 服务器能够判断出 watcher 尚未获取到该对象，因此它在连接时立即向我们发送了对象新创建的事件，这避免了我们不得不处理的竞态条件。然而，请注意，如果客户端重启，它将被\
  \ API 服务器视为一个新的客户端，并再次看到同一个 `Sample` 的 `ADDED` 事件。因此，当我们实现处理自定义资源的逻辑时，使逻辑具有幂等性（idempotent）是非常关重要的，这样我们就可以多次处理同一个事件。\n\
  \n### Operators\n\n除了将事件记录到控制台之外，我们对自定义资源的创建、更新或删除还会采取哪些操作？正如我们在检查使用自定义资源配置集群中的\
  \ Calico 网络时所看到的，自定义资源的一个用途是配置网络和存储等集群基础设施组件。但另一种真正充分利用自定义资源的模式是 Kubernetes `Operator`。\n\
  \nKubernetes `Operator` 模式扩展了集群的功能，使得部署和管理特定的应用程序组件变得更容易。与其直接使用 `Deployments` 和\
  \ `Services` 等标准 Kubernetes 资源，我们只需创建特定应用程序组件的自定义资源，由 operator 来管理它们。\n\n让我们部署 operator：\n\
  \n```bash\nroot@host01:~# kubectl apply -f /etc/kubernetes/components/postgres-operator.yaml\
  \ \ndeployment.apps/postgres-operator created\n```\n\n这为 operator 创建了一个 Deployment，并创建了一个\
  \ Pod：\n\n```bash\nroot@host01:~# kubectl get pods\nNAME                       \
  \          READY   STATUS    RESTARTS   AGE\npostgres-operator-5cdbff85d6-cclxf\
  \   1/1     Running   0          27s\n```\n\nPod 与 API 服务器通信以创建定义 PostgreSQL 需要的\
  \ CRD：\n\n```bash\nroot@host01:~# kubectl get crd resources.zalan.do\nNAME     \
  \                   CREATED AT\npostgresql.zalan.do   ...\n```\n\n集群中尚未运行 PostgreSQL\
  \ 实例，但我们可以根据该 CRD 轻松地部署 PostgreSQL：\n\n*pgsql.yaml*\n\n```yaml\n---\napiVersion:\
  \ \"acid.zalan.do/v1\"\nkind: postgresql\nmetadata:\n  name: pgsql-cluster\n  namespace:\
  \ default\nspec:\n  teamId: \"pgsql\"\n  volume:\n    size: 1Gi\n    storageClass:\
  \ longhorn\n  numberOfInstances: 3\n  users:\n    dbuser:\n    - superuser\n   \
  \ - createdb\n  databases:\n    defaultdb: dbuser\n  postgresql:\n    version: \"\
  14\"\n```\n\n此自定义资源告诉 Postgres Operator 使用 14 版本服务器生成 PostgreSQL 数据库，包含三个实例（一个主节点和两个备份）。每个实例将具有持久化存储。主实例将使用指定的用户和数据库进行配置。\n\
  \nKubernetes Operator 模式的真正价值在于我们声明的 YAML 资源文件短且简单，并且与我们想要的 PostgreSQL 配置密切相关。operator\
  \ 的工作是将这些信息转换为 StatefulSet、Services 以及运行此数据库所需的其他集群资源。\n\n我们像应用其他资源一样将此自定义资源应用到集群：\n\
  \n```bash\nroot@host01:~# kubectl apply -f /opt/pgsql.yaml \npostgresql.acid.zalan.do/pgsql-cluster\
  \ created\n```\n\n之后，Postgres Operator 将收到添加事件并为 PostgreSQL 创建必要的集群资源：\n\n\n\n\n\
  ```\nroot@host01:~# kubectl logs postgres-operator-5cdbff85d6-cclxf\n\n... level=info\
  \ msg=\"Spilo operator...\"\n\n...\n\n... level=info msg=\"ADD event has been queued\"\
  \ \n\n  cluster-name=default/pgsql-cluster pkg=controller worker=0\n\n... level=info\
  \ msg=\"creating a new Postgres cluster\" \n\n  cluster-name=default/pgsql-cluster\
  \ pkg=controller worker=0\n\n...\n\n... level=info msg=\"statefulset \n\n  \\\"\
  default/pgsql-cluster\\\" has been successfully created\" \n\n  cluster-name=default/pgsql-cluster\
  \ pkg=cluster worker=0\n\n...\n```\n\n最终，将有一个 `StatefulSet` 和三个 `Pods` 在集群中运行（（仍在运行的\
  \ operator 自身的 `Pod`）：\n\n```\nroot@host01:~# kubectl get sts\n\nNAME          \
  \  READY   AGE\n\npgsql-cluster   3/3     2m39s\n\nroot@host01:~# kubectl get po\n\
  \nNAME                                 READY   STATUS    RESTARTS   AGE\n\npgsql-cluster-0\
  \                      1/1     Running   0          2m40s\n\npgsql-cluster-1   \
  \                   1/1     Running   0          2m18s\n\npgsql-cluster-2      \
  \                1/1     Running   0          111s\n\npostgres-operator-5cdbff85d6-cclxf\
  \   1/1     Running   0          4m6s\n\n...\n```\n\n所有这些资源在集群上完全运行可能需要几分钟时间。\n\n\
  与我们在第 15 章中创建的 PostgreSQL `StatefulSet` 不同，此 `StatefulSet` 中的所有实例都配置了高可用性，我们可以通过检查每个\
  \ `Pod` 的日志来验证：\n\n```\nroot@host01:~# kubectl logs pgsql-cluster-0\n\n...\n\n...\
  \ INFO: Lock owner: None; I am pgsql-cluster-0\n\n... INFO: trying to bootstrap\
  \ a new cluster\n\n...\n\n... INFO: initialized a new cluster\n\n...\n\n... INFO:\
  \ no action. I am (pgsql-cluster-0) the leader with the lock\nroot@host01:~# kubectl\
  \ logs pgsql-cluster-1\n\n...\n\n... INFO: Lock owner: None; I am pgsql-cluster-1\n\
  \n... INFO: waiting for leader to bootstrap\n\n... INFO: Lock owner: pgsql-cluster-0;\
  \ I am pgsql-cluster-1\n\n...\n\n... INFO: no action. I am a secondary (pgsql-cluster-1)\
  \ and following \n\n    a leader (pgsql-cluster-0)\n```\n\n正如我们看到的，第一个实例 `pgsql-cluster-0`\
  \ 已经识别自己为主，而 `pgsql-cluster-1` 配置为从节点，它会将任何更新同步到主数据库。\n\n为了管理 PostgreSQL 的主节点和从节点并允许数据库客户端访问主节点，operator\
  \ 创建了多个 `Services`：\n\n```\nroot@host01:~# kubectl get svc\n\nNAME             \
  \      TYPE        CLUSTER-IP      ... PORT(S)    AGE\n\n...\n\npgsql-cluster  \
  \        ClusterIP   10.101.80.163   ... 5432/TCP   6m52s\n\npgsql-cluster-config\
  \   ClusterIP   None            ... <none>     6m21s\n\npgsql-cluster-repl     ClusterIP\
  \   10.96.13.186    ... 5432/TCP   6m52s\n```\n\n`pgsql-cluster` `Service` 仅将路由到主节点；其他\
  \ `Services` 用于管理到备份实例的复制。当主节点因故障转移发生变化时，operator 负责更新 `Service` 的任务。\n\n要删除 PostgreSQL\
  \ 数据库，我们只需要删除自定义资源，Postgres Operator 会处理剩余工作：\n\n```\nroot@host01:~# kubectl delete\
  \ -f /opt/pgsql.yaml \n\npostgresql.acid.zalan.do \"pgsql-cluster\" deleted\n```\n\
  \noperator 检测到删除操作并清理了相关的 Kubernetes 集群资源：\n\n```\nroot@host01:~# kubectl logs postgres-operator-5cdbff85d6-cclxf\n\
  \n...\n\n... level=info msg=\"deletion of the cluster started\" \n\n  cluster-name=default/pgsql-cluster\
  \ pkg=controller worker=0\n\n... level=info msg=\"DELETE event has been queued\"\
  \ \n\n  cluster-name=default/pgsql-cluster pkg=controller worker=0\n\n...\n\n...\
  \ level=info msg=\"cluster has been deleted\" \n\n  cluster-name=default/pgsql-cluster\
  \ pkg=controller worker=0\n```\n\nPostgres Operator 现在已经删除了 `StatefulSet`、持久存储以及与该数据库集群相关的资源。\n\
  \n我们能够如此轻松地部署和移除 PostgreSQL 数据库服务器（包括自动配置为高可用配置的多个实例），这证明了 Kubernetes Operator 模式的威力。通过定义\
  \ `CRD`，普通的 `Deployment` 可以用来扩展我们 Kubernetes 集群的行为。结果是无缝添加了新的集群能力，并且这些能力与 Kubernetes\
  \ 集群的内置功能完全集成。\n\n### 结语\n\n`CustomResourceDefinitions` 和 Kubernetes Operators 为集群带来了高级功能，但它们是建立在我们在整本书中看到的\
  \ Kubernetes 集群基础功能之上的。Kubernetes API 服务器具有扩展性，可以处理任何类型集群资源的存储和取取。因此，我们能够动态地定义新的资源类型，并让集群为我们管理它们。\n\
  \n我们在本书的第二部分所过的许多功能中都看到了这种模式。Kubernetes 本身构建在我们在第一部分](#part01.xhtml_part01)中看到的容器基础功能之上。\n\
  \n\n\n\n我们希望在 Kubernetes 集群上部署真实世界的应用程序，而不仅仅是理想化的应用。这意味着我们需要对如何部署应用组件做出明智决策，使我们脱离一个理想化的世界——在那个世界里，集群决定运行多少个容器实例以及将它们调度到哪里。然而，我们不想创建一个如此僵化的应用架构，以至于丢失集群的可扩展性和容错性。相反，我们希望在集群内部工作，为它提供提示，告诉它如何部署我们的应用组件，同时尽可能地保持灵活性。在本章中，我们将探索应用组件如何在对与其他组件或专用硬件实施某种程度的耦合，而不丢失\
  \ Kubernetes 的优势。\n\n### 亲和性（Affinity）与反亲和性（Anti-affinity）\n\n我们先来看这种情况：我们希望管理 Pod\
  \ 的调度，以便能够倾向于或避免在同一节点上部署多个容器。例如，如果我们有两个容器在通信时消耗了大量的网络带宽，我们可能希望这两个容器一起运行在同一个节点上，以降低延迟并避免拖慢集群的其他部分。或者，如果我们想确保高可用组件能够在集群节点发生故障时存活，我们可能希望拆分\
  \ Pod 实例，让它们运行在尽可能多的不同的集群节点上。\n\n协同地部署容器的一种方法是将多个独立的容器合并到单个 Pod 规范中。对于两个进程完全相互依赖的情况，这是一个极佳的解决方案。然而，它消除了单独扩展实例的能力。例如，在一个由分布式存储支持的\
  \ Web 应用中，我们需要的 Web 服务器进程实例可能比存储进程实例多得多。我们需要将这些应用组件放在不同的 Pod 中，以便对它们分别扩展。\n\n在第\
  \ 8 章 中，当我们想要保证 Pod 运行在指定的节点上时，我们在 Pod 规范中添加了 `nodeName` 字段来覆盖调度器。这对于示例来说没问题，但对于真实应用程序，它将消除性能和可靠性至关重要的扩展和故障转移。相反，我们将使用\
  \ Kubernetes 的 `affinity`（亲和性）概念，为调度器提供关于如何分配 Pod 的提示，而不强制任何 Pod 运行在特定节点上。\n\n亲和性允许我们根据其他\
  \ Pod 的存在来限制 Pod 应该调度的位置。让我们来看一个使用 `iperf3` 网络测试应用的示例。\n\n#### 集群区域（Cluster ZONES）\n\
  \nPod 亲和性对于跨多个网络的大型集群最有价值。例如，我们可能会将 Kubernetes 集群部署在多个不同的数据中心，以消除单点故障。在这些情况下，我们将基于区域（zone）配置亲和性，该区域可能包含许多节点。在这里，我们只有一个很小的示例集群，因此我们将集群中的每个节点视为一个独立的区域。\n\
  \n##### 反亲和性（Anti-affinity）\n\n让我们从亲和性的对立面开始：`anti-affinity`（反亲和性）。反亲和性会导致 Kubernetes\
  \ 调度器避免将 Pod 共同。在这种情况下，我们将创建一个包含三个独立的 iperf3 服务器 Pod 的 Deployment，但我们将使用反亲和性将这三个\
  \ Pod 分布到我们的节点上，以便每个节点获得一个 Pod。\n\n**注意**\n\n本书的示例代码库位于 [`github.com/book-of-kubernetes/examples`](https://github.com/book-of-kubernetes/examples)。请参阅第\
  \ xx 页 上的“运行示例”以获取设置详情。\n\n这是我们需要的 YAML 定义：\n\n`ipf-server.yaml`\n\n```yaml\n---\n\
  kind: Deployment\napiVersion: apps/v1\nmetadata:\n  name: iperf-server\nspec:\n\
  \  replicas: 3\n  selector:\n    matchLabels:\n      app: iperf-server\n  template:\n\
  \    metadata:\n      labels:\n        app: iperf-server\n    spec:\n   ➊ affinity:\n\
  \        podAntiAffinity:\n       ➋ requiredDuringSchedulingIgnoredDuringExecution:\n\
  \          - labelSelector:\n              matchExpressions:\n              - key:\
  \ app\n                operator: In\n                values:\n                -\
  \ iperf-server\n         ➌ topologyKey: \"kubernetes.io/hostname\"\n      containers:\n\
  \      - name: iperf\n        image: bookofkubernetes/iperf3:stable\n        env:\n\
  \        - name: IPERF_SERVER\n          value: \"1\"\n```\n\n除了新的亲和性部分 ➊ 之外，该 Deployment\
  \ 资源是典型的。我们指定了一个基于 Deployment 管理其 Pod 时使用的相同标签的反亲和性规则。通过该规则，我们指定不希望将 Pod 调度到已经具有\
  \ `app=iperf-server` 标签的 Pod 的区域中。\n\n`topologyKey` ➌ 指定了区域的大小。在这种情况下，集群中的每个节点都有不同的\
  \ hostname 标签，因此每个节点被认为是一个不同的区域。因此，反亲和性规则防止了 `kube-scheduler` 在第一个 Pod 调度到那里之后将第二个\
  \ Pod 放置到该节点上。\n\n最后，由于我们使用 `requiredDuringScheduling` ➋ 指定了规则，这是一个**硬性（hard）**反亲和性规则，这意味着除非调度器能够满足规则，否则它不会调度\
  \ Pod。也可以使用 `preferredDuringScheduling` 并分配权重，以给调度器提供提示，而不会在规则无法满足时阻止 Pod 的调度。\n\
  \n**注意**\n\n`topologyKey` 可以基于应用在节点上的任何标签。基于云的 Kubernetes 发行版通常会根据节点的可用区域自动为每个节点打上标签，这使得使用反亲和性变得简单。\n\
  \n使用反亲和性将 Pod 分布在不同的可用区来实现冗余。\n\n让我们应用此 Deployment 并查看结果：\n\n```bash\nroot@host01:~#\
  \ kubectl apply -f ipf-server.yaml \ndeployment.apps/iperf-server created\n```\n\
  \n一旦 Pod 运行，我们看到每个节点都分配了一个 Pod：\n\n```bash\nroot@host01:~# kubectl get po -o wide\n\
  NAME                            READY   STATUS    NODE\niperf-server-7666fb7d8-rz8j\
  \   1/1     Running   host01\niperf-server-7666fb7d8-cljkh   1/1     Running   host02\n\
  iperf-server-7666fb7d8-ktk2   1/1     Running   host03\n```\n\n由于有三个节点和三个实例，这与使用\
  \ DaemonSet 基本相同，但这种方法更灵活，因为它不需要每个节点都有。在大集群中，我们可能只需要少量实例来满足该服务的需求。基于主机名区域的亲和性允许我们在指定正确规模的同时，将每个\
  \ Pod 分布到不同的节点。反亲和性也可以用于跨其他类型的区域分布 Pod。\n\n在继续之前，让我们创建一个 Service，让 iperf3 客户端能够找到服务器实例。这是\
  \ YAML：\n\n`ipf-svc.yaml`\n\n```yaml\n---\nkind: Service\napiVersion: v1\nmetadata:\n\
  \  name: iperf-server\nspec:\n  selector:\n    app: iperf-server\n  ports:\n  -\
  \ protocol: TCP\n    port: 5201\n    targetPort: 5201\n```\n\n让我们将其应用到集群：\n\n```bash\n\
  root@host01:~# kubectl apply -f ipf-svc.yaml \nservice/iperf-server created\n```\n\
  \nService 获取了所有三个 Pod：\n\n```bash\nroot@host01:~# kubectl get ep iperf-server\n\
  NAME           ENDPOINTS\niperf-server   172.31.239.207:5201,172.31.25.214:5201,172.31.89.206:5201\n\
  ```\n\n`ep` 是 endpoints 的缩写。每个 Service 都有关联的 Endpoint 对象，记录了接收该 Service 流量的当前 Pod。\n\
  \n\n\n我们现在准备好部署 iiperf3 客户端来使用这些服务器实例了。我们希望以相同的方式将客户端分发到节点，但我们想确保每个客户端都部署在具有服务器实例的节点上。为了实现这一点，我们将同时使用亲和性（affinity）和反亲和（anti-affinity）规则：\n\
  \n`ipf-client.yaml`\n\n```yaml\n---\nkind: Deployment\napiVersion: apps/v1\nmetadata:\n\
  \  name: iperf\nspec:\n  replicas: 3\n  selector:\n    matchLabels:\n      app:\
  \ iperf\n  template:\n    metadata:\n      labels:\n        app: iperf\n    spec:\n\
  \      affinity:\n        podAntiAffinity:\n          requiredDuringSchedulingIgnoredDuringExecution:\n\
  \          - labelSelector:\n              matchExpressions:\n              - key:\
  \ app\n                operator: In\n                values:\n                -\
  \ iperf\n            topologyKey: \"kubernetes.io/hostname\"\n        ➊ podAffinity:\n\
  \          requiredDuringSchedulingIgnoredDuringExecution:\n          - labelSelector:\n\
  \              matchExpressions:\n              - key: app\n                operator:\
  \ In\n                values:\n                - iperf-server\n            topologyKey:\
  \ \"kubernetes.io/hostname\"\n      containers:\n      - name: iperf\n        image:\
  \ bookofkubernetes/iperf3:stable\n```\n\n额外的 `podAffinity` 规则 ➊ 确保只有在已经存在服务器实例的情况下，每个客户端实例才会部署到该节点。亲和性规则中的字段工作方式与反亲和规则相同。\n\
  \n让我们部署客户端实例：\n\n```bash\nroot@host01:~# kubectl apply -f /opt/ipf-client.yaml \n\
  \ndeployment.apps/iperf created\n```\n\n在这些 Pods 运行后，我们可以看到它们也分布在集群中的三个节点上：\n\n\
  ```bash\nroot@host01:~# kubectl get po -o wide\n\nNAME                         \
  \   READY   STATUS    ... NODE     ... \niperf-c8d4566f-btppf            1/1   \
  \  Running   ... host02   ... \niperf-c8d4566f-s6rpn            1/1     Running\
  \   ... host03   ... \niperf-c8d4566f-v9v8m            1/1     Running   ... host01\
  \   ... \n...\n```\n\n这似乎我们部署 iperf3 客户端和服务器的方式让每个客户端都能与其本地服务器实例通信，从而最大化客户端和服务器之间的带宽。然而，实际情况并非如此。由于\
  \ `iperf-server` 服务配置了所有三个 Pod，每个客户端 Pod 都会连接到一个随机服务器。结果是我们的客户端可能无法正常工作。你可能会看到日志表明客户端能够连接到服务器，但你也可能看到处于\
  \ Error 或 CrashLoopBackOff 状态的客户端 Pod，日志输出如下：\n\n```bash\nroot@host01:~# kubectl\
  \ logs iperf-c8d4566f-v9v8m\n\niperf3: error - the server is busy running a test.\
  \ try again later\n\niperf3 error - exiting\n```\n\n这表明客户端正在连接到一个已经有客户端连接的服务器，这意味着我们至少有两个客户端正在使用同一个服务器。\n\
  \n### 服务流量路由\n\n我们希望配置客户端 Pod，使其能够访问部署的本地服务器 Pod，而不是不同节点上的服务器 Pod。首先，让我们确认流量是否随机在所有三个服务器\
  \ Pod 之间路由。我们可以检查 `kube-proxy` 为该服务创建的 `iptables` 规则：\n\n```bash\nroot@host01:~#\
  \ iptables-save | grep iperf-server\n\n...\n-A KUBE-SVC-KN2SIRYEH2IFQNHK -m comment\
  \ --comment \"default/iperf-server\" \n  -m statistic --mode random --probability\
  \ 0.33333333349 -j KUBE-SEP-IGBNNG5F5VCPRRWI\n-A KUBE-SVC-KN2SIRYEH2IFQNHK -m comment\
  \ --comment \"default/iperf-server\" \n  -m statistic --mode random --probability\
  \ 0.50000000000 -j KUBE-SEP-FDPADR4LUNHDJSPL\n-A KUBE-SVC-KN2SIRYEH2IFQNHK -m comment\
  \ --comment \"default/iperf-server\" \n  -j KUBE-SEP-TZDPKVKUEZYBFM3V\n```\n\n我们在\
  \ `host01` 上运行此命令，看到有三个独立的 `iptables` 规则，且目标是随机选择。这意味着 `host01` 上的 iperf3 客户端可能会被路由到任何服务器\
  \ Pod。\n\n为了修复这个问题，我们需要更改服务的内部流量策略配置。默认情况下，策略为 `Cluster`，表示集群中的所有 Pod 都是有效目标。我们可以将策略更改为\
  \ `Local`，这将服务限制为仅路由到节点上的 Pod。\n\n```bash\nroot@host01:~# kubectl patch svc iperf-server\
  \ -p '{\"spec\":{\"internalTrafficPolicy\":\"Local\"}}'\n```\n\n更改立即生效，我们可以再次查看\
  \ `iptables` 看到这一点：\n\n```bash\nroot@host01:~# iptables-save | grep iperf-server\n\
  \n...\n-A KUBE-SVC-KN2SIRYEH2IFQNHK -m comment --comment \"default/iperf-server\"\
  \ \n  -j KUBE-SEP-IGBNNG5F5VCPRRWI\n```\n\n几分钟后，iperf3 客户端现在显示出我们预期的输出：\n\n```bash\n\
  root@host01:~# kubectl logs iperf-c8d4566f-v9v8m\n\nConnecting to iperf-server,\
  \ port 5201\n...\n```\n\n在继续之前，让我们清理掉这些资源：\n\n```bash\nroot@host01:~# kubectl delete\
  \ svc/iperf-server deploy/iperf deploy/iperf-server\n```\n\n我们看到的亲和性和反亲和性能力允许我们向调度器提供提示，而不会丢失我们对应用程序组件所需的扩展性和容错性。然而，尽管在应用程序架构中存在紧密连接的组件时使用这些功能可能很有吸引力，但最好的办法可能是让调度器不受阻地运行，仅在实际性能测试显示其有显著差异的情况下才添加亲和性。为了提高性能的服务路由是\
  \ Kubernetes 的一个活跃开发领域。对于跨区域运行的集群，一项名为拓扑感知提示（Topology Aware Hints）的新功能可以 Kubernetes\
  \ 尽可能将服务的连接路由到最近的实例，从而在需要时允许跨区域流量提高网络性能。\n\n### 硬件资源\n\n亲和性和反亲和性允许我们控制 Pod 的调度位置，但应仅在需要时使用。但对于\
  \ Pod 需要访问在某些节点上才有的特殊硬件的情况，该怎么办？例如，我们可能有某些处理过程受益于图形处理器（GPU），但我们可能会限制集群中 GPU 节点的数量以降低成本。在这种情况下，绝对有必要确保\
  \ Pod 被调度在正确的位置。\n\n\n\n与之前一样，我们可以使用 `nodeName` 将 Pod 直接绑定到某个节点。但我们的集群中可能有许多具有合适硬件的节点，因此我们真正想要的是能够告诉\
  \ Kubernetes 我们的这些需求，然后让调度器决定如何满足这些需求。\n\nKubernetes 提供了两种相关的方法来解决这一需求：设备插件（device\
  \ plug-ins）和扩展资源（extended resources）。设备插件提供了最完整的功能，但插件本身必须针对该硬件设备而存在。同时，扩展资源可以用于任何硬件设备，但\
  \ Kubernetes 集群只跟踪资源的分配；它并不会实际管理该资源在容器中的可用性。\n\n实现设备插件需要与 `kubelet` 紧密协作。与我们在第 15\
  \ 章中看到的存储插件架构类似，设备插件会在运行在节点上的 `kubelet` 实例上注册自己，并标识它所管理的任何设备。Pod 识别它们所需的任何设备，而设备管理器告诉\
  \ `kubelet` 如何在容器内部使该设备可用（通常通过将设备从宿主机挂载到容器的文件系统中来实现）。\n\n由于我们是在在一个虚拟化的示例集群中操作，我们没有任何专用硬件来演示设备插件，但扩展资源从分配的角度来看工作原理是相同的，因此我们仍然对整体方法有一个整体感受。\n\
  \n让我们从更新集群以指示其中一个节点具有示例扩展资源开始。我们通过补丁节点的 status 来来实现。理想情况下，我们可以使用 `kubectl patch`\
  \ 来完成，但遗憾的是，该命令无法更新资源的 status，因此我们只能使用 `curl` 直接调用 Kubernetes API。`/opt` 目录下有一个脚本可以方便这一操作。列表\
  \ 18-1 展示了相关部分。\n\n`add-hw.sh`\n\n```bash\n#!/bin/bash\n\n...\n\npatch='\n\n[\n\n\
  \  {\n    \"op\": \"add\", \n    \"path\": \"/status/capacity/bookofkubernetes.com~1special-hw\"\
  , \n    \"value\": \"3\"\n  }\n]\n'\n\ncurl --cacert $ca --cert $cert --key $key\
  \ \\\n  -H \"Content-Type: application/json-patch+json\" \\\n  -X PATCH -d \"$patch\"\
  \ \\\n  https://192.168.61.10:6443/api/v1/nodes/host02/status\n\n...\n```\n\n*列表\
  \ 18-1: 特殊硬件脚本*\n\n此 `curl` 命令发送了一个 JSON patch 对象来更新节点的 status 字段，在 capacity 下添加了一个名为\
  \ `bookofkubernetes.com/special-hw` 的条目。`~1` 起斜杠字符的作用。\n\n运行脚本更新节点：\n\n```bash\n\
  root@host01:~# /opt/add-hw.sh \n...\n```\n\n来自 API 服务器的响应包含了整个 `Node` 资源。让我们仔细检查一下我们关心的字段，以确保它已生效：\n\
  \n```bash\nroot@host01:~# kubectl get node host02 -o json | jq .status.capacity\n\
  \n{\n  \"bookofkubernetes.com/special-hw\": \"3\",\n  \"cpu\": \"2\",\n  \"ephemeral-storage\"\
  : \"40593612Ki\",\n  \"hugepages-2Mi\": \"0\",\n  \"memory\": \"2035228Ki\",\n \
  \ \"pods\": \"110\"\n}\n```\n\n扩展资源与节点的标准资源一起出现。我们现在可以像请求标准资源一样请求这种资源，正如我们在第 14\
  \ 章中看到的那样。\n\n这是一个请求特殊硬件的 Pod：\n\n`hw.yaml`\n\n```yaml\n---\napiVersion: v1\nkind:\
  \ Pod\nmetadata:\n  name: sleep\nspec:\n  containers:\n  - name: sleep\n    image:\
  \ busybox\n    command: [\"/bin/sleep\", \"infinity\"]\n    resources:\n      limits:\n\
  \        bookofkubernetes.com/special-hw: 1\n```\n\n我们使用 `resources` 字段指定特殊硬件的需求。资源要么被分配要么未分配；因此，请求（requests）和限制（limits）没有区别，所以\
  \ Kubernetes 期望我们使用 `limits` 来指定它。当我们将其应用于集群时，Kubernetes 调度器将确保此 Pod 运行在能够满足此需求的节点上：\n\
  \n```bash\nroot@host01:~# kubectl apply -f /opt/hw.yaml \npod/sleep created\n```\n\
  \n结果，Pod 最终运行在 `host02` 上：\n\n```bash\nroot@host01:~# kubectl get po -o wide\n\n\
  NAME    READY   STATUS    ... NODE     ...\nsleep   1/1     Running   ... host02\
  \   ...\n```\n\n此外，节点状态现在反映了该扩展资源的分配：\n\n```bash\nroot@host01:~# kubectl describe\
  \ node host02\n\nName:               host02\n...\nAllocated resources:\n...\n  Resource\
  \                         Requests     Limits\n  --------                      \
  \   --------     ------\n...\n  bookofkubernetes.com/special-hw  1            1\n\
  ...\n```\n\n我们在列表 18-1 中添加扩展资源时指定的三个 `special-hw` 的可用数量，以及该资源对我们 Pod 的分配都是任意的。扩展资源的作用就像信号量，防止过度使用。\n\
  \n由于我们在一个虚拟化的示例集群中操作，我们没有任何专用硬件。\n\n节点状态现在反映了对该扩展资源的分配：\n\n```bash\nroot@host01:~#\
  \ kubectl describe node host02\n\nName:               host02\n...\nAllocated resources:\n\
  ...\n  Resource                         Requests     Limits\n  --------        \
  \                 --------     ------\n...\n  bookofkubernetes.com/special-hw  1\
  \            1\n...\n```\n\n我们在列表 18-1 中添加扩展资源时指定的三个 `special-hw` 的可用数量，以及该资源对我们\
  \ Pod 的分配都是任意的。扩展资源的作用就像信号量，防止过度使用。\n\n如果我们在尝试根据可用性进行过度分配，Pod 将不会被调度。我们可以通过尝试添加另一个需要全部三个特殊硬件的\
  \ Pod 来确认这一点：\n\n`hw3.yaml`\n\n```yaml\n---\napiVersion: v1\nkind: Pod\nmetadata:\n\
  \  name: sleep3\nspec:\n  containers:\n  - name: sleep\n    image: busybox\n   \
  \ command: [\"/bin/sleep\", \"infinity\"]\n    resources:\n      limits:\n     \
  \   bookofkubernetes.com/special-hw: 3\n```\n\n让我们尝试将此 Pod 加入集群：\n\n```bash\nroot@host01:~#\
  \ kubectl apply -f /opt/hw3.yaml \npod/sleep created\n```\n\n由于没有足够的特殊硬件可用，此 Pod\
  \ 处于 `Pending` 状态：\n\n```bash\nroot@host01:~# kubectl get po -o wide\n\nNAME   \
  \ READY   STATUS    ... NODE     ...\nsleep   1/1     Running   ... host02   ...\n\
  sleep3  0/1     Pending   ... <none>   ...\n```\n\nPod 将等待硬件可用。让我们删除原始 Pod 以释放空间：\n\
  \n```bash\nroot@host01:~# kubectl delete pod sleep\npod/sleep deleted\n```\n\n我们的新\
  \ Pod 现在将开始运行：\n\n```bash\nroot@host01:~# kubectl get po -o wide\n\nNAME    READY\
  \   STATUS    ... NODE     ...\nsleep3  1/1     Running   ... host02   ...\n```\n\
  \n与之前一样，Pod 因为硬件需求被调度到 `host02`。\n\n设备驱动从分配的角度来看工作原理是相同的。在两种情况下，我们都使用 `limits` 字段来标识我们的硬件需求。唯一的区别是，不需要手动补丁节点来记录资源，因为当设备驱动注册时\
  \ kubelet 会更新节点状态。\n\n### 结语\n\n与理想的应用不同，在现实世界中，我们经常必须处理紧耦合的应用组件以及对特殊硬件的需求。在考虑这些应用需求的同时，不丢失将应用程序部署到\
  \ Kubernetes 集群所获得的灵活性和韧性是至关重要的。在本章中，我们看到了亲和性和设备驱动如何允许我们向调度器提供提示和资源需求，同时允许其能够动态地在大规模管理应用程序。\n\
  \n\n\n理想情况下，我们的应用程序应该尽可能少或高度可预测地使用处理器、内存、存储和网络。但在现实世界中，应用程序是“突发性”的，其负载变化由用户需求、大量数据或复杂处理所驱动。在\
  \ Kubernetes 集群中，应用程序组件被动态部署到集群中的各个节点上，这些节点之间负载分布不均会导致性能瓶颈。\n\n从应用程序架构的角度来看，我们越能让应用程序组件尽可能小且具有可扩展性，就越能够在集群中均匀地分布负载。遗憾的是，通过水平扩展并不总是能解决性能问题。在本章中，我们将研究如何使用资源规格为集群提供提示，告诉它如何调度我们的\
  \ `Pods`，目标是使应用程序性能更具预测性。\n\n### 实现可预测性\n\n在普通的日常语言中，`real time`（实时）一词的意思是发生迅速且持续。但在计算机科学中，我们对\
  \ `real time`（实时）和 `real fast`（极快）进行了非常严格的区分，以至于它们被认为是相反的。这是由于可预测性的重要性。\n\n实时处理简单来说就是跟上现实世界中发生的某些活动所需的处理。它可以是任何东西，从需要跟上传感器数据输入并维护最新电子飞行显示器的飞机驾驶舱软件，到需要及时接收并解码每帧视频以进行显示的视频流应用程序。在实时系统中，能够保证处理速度“足够快”并能跟上现实世界的要求至关重要。\n\
  \n“足够快”就是我们需要的全部。处理速度不需要比现实世界更快，因为应用程序没有其他事情要做。但即使是处理速度比现实世界慢的一个区区时间间隔，也意味着我们落后于输入或输出，导致电影观众感到恼火——甚至导致飞机坠毁。\n\
  \n出于这个原因，实时系统的主要目标是可预测性。资源的分配是根据系统可能遇到的最坏情况来进行的，我们愿意提供远多于所需的处理能力，以确保在最坏情况下留有充足的余地。事实上，要求这类系统即使在预期的最大负载下保持在可用处理器和内存利用率的\
  \ 50% 以下是非常常见的。\n\n但虽然响应性总是重要的，但大多数应用程序并没有运行在实时环境中，而且额外的资源冗余是昂贵的。因此，大多数系统试图在可预测性和效率之间寻找平衡，这意味着只要应用程序组件的性能下降是暂时的，我们通常愿意容忍。\n\
  \n### 服务质量类 (Quality of Service Classes)\n\n为了帮助我们平衡集群中容器的可预测性和效率，Kubernetes 将 `Pods`\
  \ 分配到三种不同的服务质量类之一：`BestEffort`、`Burstable` 和 `Guaranteed`。在某种程度上，我们可以将这些看作是描述性的。当我们不向\
  \ Kubernetes 提供任何资源需求时，使用 `BestEffort`，它只能尽力为 `Pod` 提供足够的资源。当 `Pod` 可能会超过其资源请求时，使用\
  \ `Burstable`。当我们提供一致的资源需求且预期 `Pod` 会保持在这些范围内时，使用 `Guaranteed`。由于这些类别是描述性的，且完全基于\
  \ `Pod` 中的容器如何指定其资源需求，因此没有办法可以手动指定 `Pod` 的 QoS。\n\nQoS 类有两个用途。首先，同一 QoS 类的 `Pods`\
  \ 被分组合在一起用于 Linux 控制组（`cgroups`）配置。正如我们在第 3 章 中所示，`cgroups` 用于控制一组进程的资源利用率，特别是处理器和内存，因此当系统负载很高时，`Pod`\
  \ 的 `cgroup` 会影响其在使用处理器时间上的优先级。其次，如果节点由于缺少内存资源而需要驱逐 `Pods`，QoS 类将影响哪些 `Pods` 先被驱逐。\n\
  \n#### BestEffort\n\n最简单的情况是声明一个没有任何限制的 `Pod`。在这种情况下，该 `Pod` 被分配到 `BestEffort` 类。让我们创建一个示例\
  \ `Pod` 来探索这意味着什么。\n\n**注意**：本书的示例存储库位于 [`github.com/book-of-kubernetes/examples`](https://github.com/book-of-kubernetes/examples)。有关设置的详情，请参阅第\
  \ xx 页上的“运行示例”。\n\n以下是 Pod 定义：\n\n`best-effort.yaml`\n\n```\n---\napiVersion: v1\n\
  kind: Pod\nmetadata:\n  name: best-effort\nspec:\n  containers:\n  - name: best-effort\n\
  \    image: busybox\n    command: [\"/bin/sleep\", \"infinity\"]\n  nodeName: host01\n\
  ```\n\n此定义完全没有包含 `resources` 字段，但如果我们包含一个带有请求但没有限制的 `resources` 字段， QoS 类也将相同。\n\
  \n我们使用 `nodeName` 强制将此 `Pod` 调度到 `host01`，以便观察其资源使用是如何配置的。让我们将其应用于集群：\n\n```\nroot@host01:~#\
  \ kubectl apply -f /opt/best-effort.yaml \n\npod/best-effort created\n```\n\n在 `Pod`\
  \ 运行后，我们可以查看它的详情，确认已被分配到 `BestEffort` QoS 类：\n\n```\nroot@host01:~# kubectl get\
  \ po best-effort -o json | jq .status.qosClass\n\n\"BestEffort\"\n```\n\n\n\n\n\
  ### 可突发 (Burstable)\n\n如果 Pod 同时指定了请求（requests）和限制（limits），且这两个规格不相同，则它们会被归类为 Burstable\
  \ 类。正如我们在第 14 章中所所示，requests 规格用于调度，而 limits 规格用于运行时强制。换句话说，在这种情况下，Pod 的资源利用率可以高于其请求水平的“突发”值，但它们不能超过其限制。\n\
  \n让我们来看一个例子：\n\n`burstable.yaml`\n\n```yaml\n---\napiVersion: v1\nkind: Pod\nmetadata:\n\
  \  name: burstable\nspec:\n  containers:\n  - name: burstable\n    image: busybox\n\
  \    command: [\"/bin/sleep\", \"infinity\"]\n    resources:\n      requests:\n\
  \        memory: \"64Mi\"\n        cpu: \"50m\"\n      limits:\n        memory:\
  \ \"128Mi\"\n        cpu: \"100m\"\n  nodeName: host01\n```\n\n这个 Pod 定义同时提供了请求和限制资源需求，且它们是不同的，因此我们预期此\
  \ Pod 会被放置在 Burstable 类。\n\n将此 Pod 应用到集群：\n\n```bash\nroot@host01:~# kubectl apply\
  \ -f /opt/burstable.yaml \n\npod/burstable created\n```\n\n接下来，让我们验证它是否被分配到了 Burstable\
  \ QoS 类：\n\n```bash\nroot@host01:~# kubectl get po burstable -o json | jq .status.qosClass\n\
  \"Burstable\"\n```\n\n确实，cgroup 配置遵循了 QoS 类以及我们指定的限制：\n\n```bash\nroot@host01:~#\
  \ /opt/cgroup-info burstable\n\nContainer Runtime\n-----------------\nPod ID: 8d0...\n\
  Cgroup path: /kubepods.slice/kubepods-burstable.slice/kubepods-...\nCPU Settings\n\
  ------------\nCPU Shares: 51\nCPU Quota (us): 10000 per 100000\nMemory Settings\n\
  ---------------\nLimit (bytes): 134217728\n```\n\n为此 Pod 指定的限制用于设置 CPU 限制和内存限制。此外，正如我们预期的，此\
  \ Pod 的 cgroup 被放置在 `kubepods-burstable.slice` 中。\n\n添加另一个 Pod 到 Burstable QoS 类导致\
  \ Kubernetes 重新平衡了处理器时间的分配：\n\n```bash\nroot@host01:~# cat /sys/fs/cgroup/cpu/kubepods.slice/kubepods-besteffort.slice/cpu.shares\
  \ \n2\nroot@host01:~# cat /sys/fs/cgroup/cpu/kubepods.slice/kubepods-burstable.slice/cpu.shares\
  \ \n1413\n```\n\n结果是，Burstable QoS 类的 Pod 现在 `cpu.shares` 值为 1413，而 BestEffort 类的\
  \ Pod 仍显示为 2。这意味着在负载下，相对处理器份额现在倾向于 Burstable 类 Pod 的比例为 700:1。同样，根据 Kubernetes 分配给\
  \ host01 的基础设施 Pod 数量，可能会看到略有不同的值。\n\n由于 Burstable Pod 是根据请求调度的，但 cgroup 运行时强制是基于限制的，因此节点的处理器和内存资源可能会被过度提交。只要节点上的\
  \ Pod 能够相互平衡，使平均利用率与请求相匹配，运行就是正常的。如果平均利用率超过请求，就会出现问题。在这种情况下， Pod 将看到 CPU 被节流，并在内存稀缺时甚至可能被驱逐，正如我们在第\
  \ 10 章中所示。\n\n### 保证 (Guaranteed)\n\n如果我们想增加 Pod 可用处理能力和内存的可预测性，可以通过通过给请求和限制设置相同的值，将其放入\
  \ Guaranteed QoS 类。这里有一个例子：\n\n`guaranteed.yaml`\n\n```yaml\n---\napiVersion: v1\n\
  kind: Pod\nmetadata:\n  name: guaranteed\nspec:\n  containers:\n  - name: guaranteed\n\
  \    image: busybox\n    command: [\"/bin/sleep\", \"infinity\"]\n    resources:\n\
  \      limits:\n        memory: \"64Mi\"\n        cpu: \"50m\"\n  nodeName: host01\n\
  ```\n\n在这个示例中，仅指定了 limits，这是因为如果缺失 requests，Kubernetes 会自动将 requests 设置为匹配 limits。\n\
  \n将其应用到集群：\n\n```bash\nroot@host01:~# kubectl apply -f /opt/guaranteed.yaml \n\n\
  pod/guaranteed created\n```\n\nPod 运行后，验证 QoS 类：\n\n```bash\nroot@host01:~# kubectl\
  \ get po guaranteed -o json | jq .status.qosClass\n\"Guaranteed\"\n```\n\ncgroups\
  \ 配置看起来有点不同：\n\n```bash\nroot@host01:~# /opt/cgroup-info guaranteed\n\nContainer\
  \ Runtime\n-----------------\nPod ID: 146...\nCgroup path: /kubepods.slice/kubepods-...\n\
  CPU Settings\n------------\nCPU Shares: 51\nCPU Quota (us): 5000 per 100000\nMemory\
  \ Settings\n---------------\nLimit (bytes): 67108864\n```\n\n与其将这些容器放入单独目录，Guaranteed\
  \ QoS 类的容器被直接放置在 `kubepods.slice` 中。将它们放在此位置的效果是在系统负载时赋予 Guaranteed Pod 中容器更高的特权。\n\
  \n### QoS 类驱逐 (Eviction)\n\n对 Pod 的特权对待也扩展到了驱逐。正如第 3 章所示，内存的 cgroup 强制是由 OOM killer\
  \ 处理的。当节点内存不足时，OOM killer 也会运行。为了帮助 OOM killer 选择终止哪些容器，Kubernetes 根据 QoS 类设置 `oom_score_adj`\
  \ 参数。该参数的值范围从 -1000 到 1000。数值越高概率越大。\n\n自动化添加了一个名为 `oom-info` 的脚本来获取它。让我们检查每个类的\
  \ Pod 值：\n\n```bash\nroot@host01:~# /opt/oom-info best-effort\nOOM Score Adjustment:\
  \ 1000\nroot@host01:~# /opt/oom-info burstable\nOOM Score Adjustment: 968\nroot@host01:~#\
  \ /opt/oom-info guaranteed\nOOM Score Adjustment: -997\n```\n\nBestEffort 类 Pod\
  \ 具有最大调整值 1000，因此是 OOM killer 的首目标。Burstable QoS 类 Pod 的得分根据请求内存占节点总内存容量的百分比计算。因此，该值对于每个\
  \ Pod 都不同，但都在 2 到 999 之间。因此，Burstable QoS 类的 Pod 在 OOM killer 的优先级中始终处于第二。同时，Guaranteed\
  \ QoS 类 Pod 被设置为接近最小值（在本例中为 -997），因此它们尽可能不受 OOM killer 的侵害。\n\n当然，正如第 3 章中提到的，OOM\
  \ killer 会立即终止进程，因此是一种极端措施。当节点内存低但尚未耗尽时，Kubernetes 会尝试驱逐 Pod 以回收内存。这种驱逐也根据 QoS 类进行排序。BestEffort\
  \ 类 Pod 和使用内存超过请求值的 Burstable 类 Pod（高使用 Burstable）首先被驱逐，其次是使用内存低于请求值的 Burstable\
  \ 类 Pod（低使用 Burstable）以及 Guaranteed 类的 Pod。\n\n在继续之前，让我们进行一些清理：\n\n```bash\nroot@host01:~#\
  \ kubectl delete po/best-effort po/burstable po/guaranteed\n\npod \"best-effort\"\
  \ deleted\npod \"burstable\" deleted\n\npod \"guaranteed\" deleted\n```\n\n现在，当我们在本章稍后查看\
  \ Pod 优先级时，可以有一个全新的开始。\n\n\n\n\n考虑到在处理时间和驱逐优先级上的这种划分，人们可能想将所有 `Pods` 都放在 `Guaranteed`\
  \ QoS 类中。对于某些应用程序组件来说，这是一种可行的策略。正如第 7 章 所描述，我们可以配置 `HorizontalPodAutoscaler`，当现有实例消耗了其分配资源的大部分比例时，自动创建新的\
  \ `Pod` 实例。这意味着我们可以为 `Deployment` 中的 `Pods` 请求一个合理的限制值，并在这些 `Pods` 整体接近限制时，允许集群自动扩展该\
  \ `Deployment`。如果集群运行在云环境中，我们甚至可以将自动伸缩扩展到节点级别，在负载较高时动态创建新的集群节点，并在集群空闲时减少节点数量。\n\n\
  仅使用 `Guaranteed` 类 `Pods` 并结合自动伸缩听起来很棒，但这假设了我们的应用程序组件是易于扩展的。它只在我们的应用程序负载由许多小请求组成时才有效，因为负载的增加主要意味着我们正在为更多用户处理相似大小的请求。如果我们有周期性处理大型或复杂请求的应用程序组件，我们必须为这些组件设置限制以适应最坏的情况。鉴于\
  \ `Guaranteed` QoS 类中的 `Pods` 的 `requests` 等于 `limits`，我们的集群需要足够的资源来处理这种最坏情况，否则我们甚至无法调度我们的\
  \ `Pods`。这将导致集群在系统达到最大负载之前大部分处于空闲状态。同样，如果我们存在扩展性限制（例如依赖专用硬件），我们为某个组件创建的 `Pods` 数量可能有自然限制，迫使每个\
  \ `Pod` 拥有更多资源来处理其在整体负载中的份额。\n\n因此，为我们的 `Pods` 平衡使用 `Guaranteed` 和 `Burstable` QoS\
  \ 类是有意义的。任何具有一致负载或可以可行地水平扩展以满足额外需求的 `Pods` 都应该处于 `Guaranteed` 类。较难扩展或需要处理大、小混合负载的\
  \ `Pods` 应该处于 `Burstable` 类。这些 `Pods` 应该根据其平均利用率指定 `requests`，并根据其最坏情况指定 `limits`。通过这种方式指定资源需求将确保通过简单比较分配的资源与集群容量即可监控集群预期的性能裕量。最后，如果一个大型请求导致多个应用程序组件同时以其最坏的利用率运行，那么可能值得运行性能测试并探索反亲性（如第\
  \ 18 章 所示），以避免过载单个节点。\n\n### Pod 优先级\n\n除了使用提示帮助 Kubernetes 集群在系统高负载时理解如何管理 `Pods`\
  \ 之外，还可以告诉集群给某些 `Pods` 比其他 `Pods` 更高的优先级。这种高优先级在 Pod 驱逐期间有效，因为 `Pods` 将在它们的 QoS\
  \ 类内按优先级顺序被驱逐。它在调度期间也有效，因为 Kubernetes 调度器会在必要时为了调度高优先级的 `Pod` 而驱逐 `Pods`。\n\nPod\
  \ 优先级是一个简单的数字字段；数字越大优先级越高。大于十亿的数字预留给关键系统 `Pods`。要为 `Pod` 分配优先级，我们必须先创建一个 `PriorityClass`\
  \ 资源。这是一个示例：\n\n*essential.yaml*\n\n```\n---\napiVersion: scheduling.k8s.io/v1\n\
  kind: PriorityClass\nmetadata:\n  name: essential\nvalue: 999999\n```\n\n让我们将其应用到集群：\n\
  \n```\nroot@host01:~# kubectl apply -f /opt/essential.yaml \n\npriorityclass.scheduling.k8s.io/essential\
  \ created\n```\n\n现在已经定义了这个 `PriorityClass`，我们就可以将其应用到 `Pods`。然而，让我们先创建大量的低优先级 `Pods`，通过它们我们可以看到\
  \ `Pods` 被抢占。我们将使用这个 `Deployment`：\n\n```\n---\nkind: Deployment\napiVersion: apps/v1\n\
  metadata:\n  name: lots\nspec:\n  replicas: 1000\n  selector:\n    matchLabels:\n\
  \      app: lots\n  template:\n    metadata:\n      labels:\n        app: lots\n\
  \    spec:\n      containers:\n      - name: sleep\n        image: busybox\n   \
  \     command: [\"/bin/sleep\", \"infinity\"]\n        resources:\n          limits:\n\
  \            memory: \"64Mi\"\n            cpu: \"250m\"\n```\n\n这是一个基础的 `Deployment`，运行\
  \ `sleep` 且不请求太多内存或 CPU，但它将 `replicas` 设置为 1000，因此我们正在要求 Kubernetes 集群创建 1000 个\
  \ `Pods`。示例集群不足以部署 1000 个 `Pods`，既是因为我们没有足够的资源来满足规范，也是因为节点默认限制为 110 个 `Pods`。尽管如此，让我们应用到集群，如列表\
  \ 19-1 所示，调度器将尽可能创建多个 `Pods`：\n\n```\nroot@host01:~# kubectl apply -f /opt/lots.yaml\
  \ \n\ndeployment.apps/lots created\n```\n\n*列表 19-1: 部署大量的 Pods*\n\n让我们描述该 `Deployment`\
  \ 以查看情况如何：\n\n```\nroot@host01:~# kubectl describe deploy lots\n\nName:        \
  \           lots\nNamespace:              default\n...\nReplicas:              \
  \ 1000 | 7 available | 993 unavailable\n```\n\n我们只得到了 7 个可用的 `Pods`，由于我们没有足够的资源来满足规格，且节点被限制为\
  \ 110 个 `Pods`。剩余的 `Pods` 处于 `Pending` 状态：\n\n```\nroot@host01:~# kubectl get po\
  \ | grep -c Pending\n993\n```\n\n这 993 个 `Pods` 都具有默认的 0 优先级。`host01` 的数据显示我们已经分配了\
  \ 94% 的可用 CPU。但由于每个 `Pod` 都请求 250 毫秒，该节点没有足够的剩余空间调度另一个 `Pod`。\n\n```\nroot@host01:~#\
  \ kubectl describe node host01\n\nName:               host01\n...\nAllocated resources:\n\
  \  Requests           Limits\n  --------           ------\n  cpu             1898m\
  \ (94%)  768m (38%)\n  memory             292Mi (15%)  192Mi (10%)\n...\n```\n\n\
  由于我们没有更多的 CPU 分配给 `Pods`，我们的 `Deployment` 中剩余的 `Pods` 卡在 `Pending` 状态。\n\n重要的是，`requests`\
  \ 字段是用于调度的，因此尽管我们有很多没有指定 `limits` 的 `BestEffort` `Pods` 且我们有足够的 `Limits` 容量，我们仍然没有调度新\
  \ `Pods` 的空间。只有 `Limits` 可以被超额提交，`Requests` 不行。\n\n当我们使用 `PriorityClass` 创建一个新 `Pod`\
  \ 时，它将跳到调度队列的最前端。不仅如此，集群将在必要时驱逐 `Pods` 以便它可以被调度。\n\n这是 `Pod` 的定义：\n\n```yaml\n---\n\
  apiVersion: v1\nkind: Pod\nmetadata:\n  name: needed\nspec:\n  containers:\n  -\
  \ name: needed\n    image: busybox\n    command: [\"/bin/sleep\", \"infinity\"]\n\
  \    resources:\n      limits:\n        memory: \"64Mi\"\n        cpu: \"250m\"\n\
  \  priorityClassName: essential\n```\n\n\n\n集群需要一点时间来驱逐另一个 Pod 以便调度当前这个 Pod，但在大约分钟后，它就会开始运行：\n\
  \n```\nroot@host01:~# kubectl get po needed\n\nNAME     READY   STATUS    RESTARTS\
  \   AGE\n\nneeded   1/1     Running   0          36s\n```\n\n为了让这种情况发生，必须驱逐我们在列表\
  \ 19-1 中创建的 `lots` Deployment 中的一个 Pod：\n\n```\nroot@host01:~# kubectl describe\
  \ deploy lots\n\nName:                   lots\n\nNamespace:              default\n\
  \nCreationTimestamp:      Fri, 01 Apr 2022 19:20:52 +0000\n\nLabels:           \
  \      <none>\n\nAnnotations:            deployment.kubernetes.io/revision: 1\n\n\
  Selector:               app=lots\n\nReplicas:               1000 desired ... | ➊\
  \ 6 available | 994 unavailable\n```\n\n现在 Deployment ➊ 中只剩下六个可用 Pod，因为其中一个 Pod\
  \ 被驱逐了。值得注意的是，处于 **Guaranteed** QoS 类并没有阻止该 Pod 被驱逐。Guaranteed QoS 类在由于节点资源使用导致的驱逐中具有优先级，但对于由于调度器为高优先级\
  \ Pod 找到可用空间而导致的驱逐则并不如此。\n\n当然，为 Pod 指定更高优先级导致驱逐其他 Pod 的功能是强大的，应该节节使用。普通用户没有创建新\
  \ `PriorityClass` 的权限，管理员可以应用配额来限制特定 `Namespace` 中对 `PriorityClass` 的使用，从而有效限制普通用户创建高优先级\
  \ Pod。\n\n### 结语\n\n将应用程序部署到 Kubernetes 并使其具有良好的性能和可靠性，需要对应用程序架构以及每个组件的正常和最坏情况负载有了解。Kubernetes\
  \ QoS 类允许我们塑造 Pod 部署到节点的方式，以便在资源使用的可预测性和效率之间取得平衡。此外，QoS 类和 Pod 优先级都允许我们向 Kubernetes\
  \ 集群提供提示，以便当集群负载过高时，部署的应用程序能够优雅地降级。\n\n在下一章中，我们将汇总之前看到的观点，探讨如何最好地利用 Kubernetes 集群特性来部署高性能、韧性的应用程序。我们还将探索如何监控这些应用程序，并对行为的变化做出自动响应。\n\
  \n## 20 应用程序韧性\n\n![image](img/common01.jpg)\n\n在本书中，我们看到了容器和 Kubernetes 如何实现可扩展、具韧性的应用程序。通过容器，我们可以封装应用程序组件，使得进程相互隔离，拥有独立的虚拟化网络堆栈和独立的文件系统。这样每个容器都可以快速部署，而不会干扰其他容器。当我们把\
  \ Kubernetes 作为容器编排层添加在容器运行时之上时，我们能够将许多独立的主机整合到一个集群中，在可用的集群节点上动态调度容器，并具备自动伸缩、故障转移、分布式网络、流量路由、存储和配置功能。\n\
  \n我们在书中看到的所有容器和 Kubernetes 特性共同工作，为部署可扩展、具韧性的应用程序提供了必要的基础设施，但取决于我们如何正确配置应用程序，以利用基础设施提供的功能。在本章中，我们将再次查看在第\
  \ 1 章 中部署的 todo 应用。然而，这次我们将将其部署在 Kubernetes 集群的多个节点上，消除单点故障并利用 Kubernetes 提供的关键特性。我们还将探索如何监控\
  \ Kubernetes 集群和部署应用程序的性能，以便在性能问题导致用户停机之前识别它们。\n\n### 示例应用栈\n\n在第 1 章中，我们将 todo\
  \ 部署到了运行来自 Rancher `k3s` 的 Kubernetes 集群上。我们已经拥有了一些可扩展性和故障转移能力。Web 层基于 `Deployment`，因此我们能够通过单个命令扩展服务器实例的数量。我们的\
  \ Kubernetes 集群正在监控这些实例，以便在故障时进行替换。然而，我们仍然存在一些单点故障。我们尚未引入高可用 Kubernetes 控制平面的概念，因此选择仅以单节点配置运行\
  \ `k3s`。此外，尽管对 PostgreSQL 数据库使用了 `Deployment`，但它缺乏任何必要的高可用配置。在本章中，我们将看到纠正这些限制所需的细节，还将利用学到的许多其他\
  \ Kubernetes 特性。\n\n本章使用了一个较大的六节点集群，为应用程序以及我们将部署的所有监控组件留出空间。更多信息请参见本章的 `README.md`\
  \ 文件。\n\n本章的自动化脚本已经部署了 Postgres Operator 及其配置。你可以通过查看 `/etc/kubernetes/components`\
  \ 中的文件来检查 Postgres Operator 及其配置。该 Operator 运行在 `todo` `Namespace` 中，todo 应用程序也部署在那里。\n\
  \n#### 数据库\n\n让我们从部署一个高可用 PostgreSQL 数据库开始。第 17 章 展示了 Kubernetes Operator 设计模式如何使用\
  \ `CustomResourceDefinitions` 来扩展集群行为，使得打包和部署高级功能变得简单。我们将使用在该章中引入的 Postgres Operator\
  \ 来部署数据库。\n\n**注意**\n\n本书的示例仓库位于 [`github.com/book-of-kubernetes/examples`](https://github.com/book-of-kubernetes/examples)。有关设置的细节请参见第\
  \ xx 页上的“运行示例”。本章使用了一个较大的六节点集群，为应用程序以及我们将部署的所有监控组件留出空间。\n\n本章的自动化已经部署了 Postgres\
  \ Operator 及其配置。你可以通过查看 `/etc/kubernetes/components` 下的文件来检查 Postgres Operator 及其配置。Operator\
  \ 运行在 `todo` `Namespace` 中，todo 应用程序也在那里。许多 Operator 倾向于运行在自己的 `Namespace` 并跨集群操作，但\
  \ Postgres Operator 设计为直接部署在数据库所在的 `Namespace` 中。\n\n由于我们使用了 Postgres Operator，可以通过向集群应用自定义资源来创建一个高可用\
  \ PostgreSQL 数据库：\n\n`database.yaml`\n\n```\n ---\n\n apiVersion: \"acid.zalan.do/v1\"\
  \n\n kind: postgresql\n\n metadata:\n\n➊ name: todo-db\n\n spec:\n\n   teamId: todo\n\
  \n   volume:\n\n     size: 1Gi\n\n     storageClass: longhorn\n\n➋ numberOfInstances:\
  \ 3\n\n   users:\n\n     ➌ todo:\n     - superuser\n     - createdb\n\n   databases:\n\
  \n  ➍ todo:\n\n   postgresql:\n\n     version: \"14\"\n```\n\n本演示中显示的所有文件已存放在 `/etc/kubernetes/todo`\
  \ 目录，以便你进行探索并尝试更改。todo 应用程序会自动部署，但所有组件可能需要几分钟达到健康状态。\n\n我们可以验证数据库是否在集群中运行：\n\n```\n\
  root@host01:~# kubectl -n todo get sts\n\nNAME      READY   AGE\n\ntodo-db   3/3\
  \     6m1s\n```\n\ntodo-db StatefulSet 有三个 Pod，全部都已就绪。\n\n\n\n由于 Postgres Operator\
  \ 使用 `StatefulSet`，正如我们在第 15 章中所看到的，在创建数据库实例时，会为它们分配一个 `PersistentVolumeClaim`：\n\
  \n```\nroot@host01:~# kubectl -n todo get pvc\n\nNAME               STATUS   ...\
  \ CAPACITY   ACCESS MODES   STORAGECLASS   AGE\n\npgdata-todo-db-0   Bound    ...\
  \ 1Gi        RWO            longhorn       10m\n\npgdata-todo-db-1   Bound    ...\
  \ 1Gi        RWO            longhorn       8m44s\n\npgdata-todo-db-2   Bound   \
  \ ... 1Gi        RWO            longhorn       7m23s\n```\n\n如果其中一个数据库实例 Pod 失败并必须重建，这些\
  \ `PersistentVolumeClaims` 将被重用。由于 Longhorn 存储引擎将存储分布在我们的整个集群中，因此即使发生节点故障，数据库也会保留应用程序数据。\n\
  \n请注意，当我们请求 Postgres Operator 创建一个 todo 用户时，并没有指定密码。出于安全考虑，Postgres Operator 会自动生成密码。该密码会根据用户名和数据库名称存放在一个\
  \ `Secret` 中。我们可以看到为 todo 用户创建 Secret：\n\n```\nroot@host01:~# kubectl -n todo get\
  \ secret\n\nNAME                                                    TYPE    DATA\
  \   AGE\n\n...\n\ntodo.todo-db.credentials.postgresql.acid.zalan.do       Opaque\
  \  2      8m30s\n```\n\n我们需要使用这些信息来配置应用程序，使其能够验证数据库身份。\n\n在查看应用程序配置之前，让我们检查 Postgres\
  \ Operator 创建的 `Service`：\n\n```\nroot@host01:~# kubectl -n todo get svc todo-db\n\
  \nNAME      TYPE        CLUSTER-IP      EXTERNAL-IP   PORT(S)    AGE\n\ntodo-db\
  \   ClusterIP   10.110.227.34   <none>        5432/TCP   59m\n```\n\n这是一个 `ClusterIP`\
  \  `Service`，意味着它可以从集群内部的任何地方访问，但不会在外部暴露。这与我们对应用程序的要求完全匹配，因为我们的 Web 服务组件是唯一面向用户的组件，因此也是唯一暴露在集群外的组件。\n\
  \n### 应用程序部署\n\n我们应用程序的所有数据都在 PostgreSQL 数据库中，因此 Web 服务器层是无状态的。对于这个无状态组件，我们将使用 `Deployment`\
  \ 并设置自动伸缩。\n\n`Deployment` 包含大量信息，让我们逐步查看。要查看整个 Deployment 配置并直它们它们是如何整合在一起的，你可以查看集群中任何一个节点上的\
  \ `/etc/kubernetes/todo/application.yaml` 文件。\n\n第一部分告诉 Kubernetes 我们正在创建一个 `Deployment`：\n\
  \n```\n---\nkind: Deployment\n\napiVersion: apps/v1\n\nmetadata:\n  name: todo\n\
  \  labels:\n    app: todo\n```\n\n这部分非常简单，因为我们只指定了 `Deployment` 的元数据。注意，我们没有在元数据中包含命名空间。相反，当我们把此\
  \ Deployment 应用到集群时，直接将其提供给 Kubernetes。这样，我们可以对同一个 Deployment YAML 用于该应用程序的开发、测试和生产版本，并将每个版本保持在单独的\
  \ Namespace 中避免冲突。\n\n`label` 字段纯是信息性的，尽管它也为我们提供了通过匹配标签来查询集群中与此关联的所有资源的方法。\n\nDeployment\
  \ YAML 的下部分指定了集群如何处理更新：\n\n```yaml\nspec:\n  replicas: 3\n  strategy:\n    type:\
  \ RollingUpdate\n    rollingUpdate:\n      maxUnavailable: 30%\n      maxSurge:\
  \ 50%\n```\n\n`replicas` 字段告诉 Kubernetes 最初创建多少个实例。自动伸缩配置会自动调整此值。\n\n`strategy`\
  \ 字段允许我们配置此 Deployment 在无需任何应用程序停机的情况下进行更新。我们可以选择 `RollingUpdate` 或 `Recreate` 作为策略。使用\
  \ `Recreate` 时，当 Deployment 变化时，所有现有 Pod 被终止，然后创建新 Pod。使用 `RollingUpdate` 时，新 Pod\
  \ 会立即创建，而旧 Pod 将保持运行，以确保此应用程序组件在更新期间能够继续运行。\n\n我们可以使用 `maxUnavailable` 和 `maxSurge`\
  \ 字段来控制滚动更新的操作，我们可以将这些字段指定为整数值或当前副本数量的百分比。在这种情况下，我们将 `maxUnavailable` 指定为 30%，因此\
  \ Deployment 将限制滚动更新过程，以防止我们的可用副本数量低于当前副本总数量的 70%。此外，由于我们将 `maxSurge` 设置为 50%，Deployment\
  \ 将立即启动新 Pod，直到运行或处于创建过程中的 Pod 数量达到当前副本数量的 150%。\n\n`RollingUpdate` 策略是默认策略，默认情况下\
  \ `maxSurge` 和 `maxUnavailable` 都是 25%。除非绝对必要使用 `Recreate`，否则大多数 Deployment 都应该使用\
  \ `RollingUpdate` 策略。\n\nDeployment YAML 的部分将 Deployment 与其 Pod 关联起来：\n\n```\nselector:\n\
  \  matchLabels:\n    app: todo\n  template:\n    metadata:\n      labels:\n    \
  \    app: todo\n```\n\nselector 和 Pod 元数据中的标签必须匹配。正如我们在第 7 章中看到的，Deployment 使用选择器跟踪其\
  \ Pod。\n\n通过这部分，我们现在开始定义此 Deployment 创建的 Pod 模板。Deployment YAML 的剩余部分完成了 Pod 模板，它完全由单个容器的配置组成：\n\
  \n```\nspec:\n  containers:\n  - name: todo\n    image: bookofkubernetes:stable\n\
  ```\n\n容器名称主要是信息性的，但对于具有多个容器的 Pod 来说是关重要的，以便我们在检索日志和使用 `exec` 执行命令时可以选择容器。image\
  \ 告诉 Kubernetes 获取哪个容器镜像来运行此。\n\nPod 模板的下一部分指定了此容器的环境变量：\n\n```\nenv:\n  - name:\
  \ NODE_ENV\n    value: production\n  - name: PREFIX\n    value: /\n  - name: PGHOST\n\
  \    value: todo-db\n  - name: PGDATABASE\n    value: todo\n  - name: PGUSER\n \
  \   valueFrom:\n      secretKeyRef:\n        name: todo.todo-db.credentials.postgresql.acid.zalan.do\n\
  \        key: username\n        optional: false\n  - name: PGPASSWORD\n    valueFrom:\n\
  \      secretKeyRef:\n        name: todo.todo-db.credentials.postgresql.acid.zalan.do\n\
  \        key: password\n        optional: false\n```\n\n某些环境变量具有静态值；预计在该应用程序的使用中保持不变。`PGHOST`\
  \ 环境变量匹配 PostgreSQL 数据库名称。Postgres Operator 在这些 Pod 运行的 todo Namespace 中创建一个名为 `todo-db`\
  \ 的 Service，因此 Pod 能够将此主机名解析为 Service IP 地址。指向 Service IP 的流量将通过我们在第 9 章中看到的 `iptables`\
  \ 配置路由到主 PostgreSQL 实例。\n\n最后两个变量提供了应用程序验证数据库身份所需的凭据。我们正在利用从 `Secret` 获取配置并将其作为环境变量提供给容器的能力，正如我们在第\
  \ 16 章中看到的。然而，在这种情况下，我们需要环境变量的名称与 `Secret` 中的键名不同，因此我们使用了一种略不同的语法，允许我们单独指定每个变量名称。\n\
  \n最后，我们声明了此容器的资源需求以及它暴露的端口。\n\n\n\n\n\n```yaml\nresources:\n  requests:\n    memory:\
  \ \"128Mi\"\n    cpu: \"50m\"\n  limits:\n    memory: \"128Mi\"\n    cpu: \"50m\"\
  \n  ports:\n  - name: web\n    containerPort: 5000\n```\n\n`Pod` 中的 `ports` 字段仅用于信息说明；实际的流量路由将在\
  \ `Service` 中配置。\n\n在 `resources` 字段中，我们将该容器的 `requests` 和 `limits` 设置为相同。正如我们在第\
  \ 19 章中所看到的，这意味着 `Pod` 将被放入 `Guaranteed`（保证）服务质量类别。Web 服务组件是无状态的且易于扩展，因此使用相对的 CPU\
  \ 限制（在这种情况下为 50 毫核，即一个核心的 5%）是合理的，并依赖自动扩缩容在负载较高时创建新实例。\n\n#### Pod 自动扩缩容\n\n为了自动伸缩\
  \ `Deployment` 以匹配当前负载，我们使用了 `HorizontalPodAutoscaler`，正如我们在第 7 章中所看到的。以下是自动扩缩器的配置：\n\
  \n`scaler.yaml`\n\n```yaml\n---\napiVersion: autoscaling/v2\nkind: HorizontalPodAutoscaler\n\
  metadata:\n  name: todo\n  labels:\n    app: todo\nspec:\n  scaleTargetRef:\n  \
  \  apiVersion: apps/v1\n    kind: Deployment\n    name: todo\n  minReplicas: 3\n\
  \  maxReplicas: 10\n  metrics:\n  - type: Resource\n    resource:\n      name: cpu\n\
  \      target:\n        type: Utilization\n        averageUtilization: 50\n```\n\
  \n正如我们在之前的示例中所做的那样，对此资源应用标签仅是为了说明目的。该自动扩缩器需要三个关键配置项。首先，`scaleTargetRef` 指定了我们想要扩展的\
  \ `todo` `Deployment`。因为这个自动扩缩器部署在 `todo` `Namespace` 中，所以它能找到正确的 `Deployment` 进行伸缩。\n\
  \n其次，我们为 `minReplicas` 和 `maxReplicas` 指定了一个范围。我们选择 3 作为最小副本数，因为我们希望确保即使发生 `Pod`\
  \ 故障，应用程序也具有韧性。为了简单起见，我们没有应用在第 18 章中看到的反亲和性配置，但这可能也是避免所有实例运行在单个节点上的良好实践。我们根据集群的大小选择了最大副本数；对于生产级应用程序，我们将测量应用程序负载，并根据预期处理的最高负载进行选择。\n\
  \n第三，我们需要指定自动扩缩器用于判断需要多少个副本的指标（metric）。我们基于 CPU 利用率来构建此自动扩缩器。如果所有 `Pods` 之间的平均利用率超过\
  \ `Pod` `requests` 的 50%，则 `Deployment` 将被扩容。我们将 `requests` 设置为 50 毫核，因此这意味着平均利用率大于\
  \ 25 毫核将导致自动扩缩器增加副本数量。\n\n为了获取平均 CPU 利用率，自动扩缩器依赖于一个集群基础设施组件，该组件从运行在每个节点上的 `kubelet`\
  \ 服务检索指标数据，并通过 API 暴露这些指标数据。在本章中，我们有一些额外的集群监控功能要演示，因此自动化过程跳过了我们在第 6 章中描述的常规指标服务器组件。我们将在本章后面部署一个替代方案。\n\
  \n#### 应用服务\n\n我们应用程序的最后一个集群资源是 `Service`。列表 20-1 展示了我们在本章使用的定义。\n\n`service.yaml`\n\
  \n```yaml\n---\nkind: Service\napiVersion: v1\nmetadata:\n  name: todo\n  labels:\n\
  \    app: todo\nspec:\n  type: NodePort\n  selector:\n    app: todo\n  ports:\n\
  \  - name: web\n    protocol: TCP\n    port: 5000\n    nodePort: 5000\n```\n\n`列表\
  \ 20-1: Todo 服务*`\n\n我们使用在 `Deployment` 中看到的相同 `selector` 来寻找接收发送到此 `Service`get\
  \ 的 `Pods`。正如我们在第 9 章中所看到的，`Service` 的 `ports` 字段至关重要，因为 `iptables` 流量路由规则仅针对我们识别的端口进行配置。在这种情况下，我们声明\
  \ `port` 为 5000 且没有声明 `targetPort`，因此此 `Service` 将发送到 `Pods` 上的 5000 端口。\n\n\n\n\
  \n出于多个原因，适当的部署和集群监控对于应用程序来说至关重要。首先，我们的 Kubernetes 集群会尝试保持应用程序运行，但任何硬件或集群故障都可能导致应用程序处于非工作或降级状态。如果没有监控，我们只能依赖用户来告诉我们应用程序何时宕机或运行异常，这是一种糟糕的用户体验。其次，如果我们真的看到应用程序出现了了故障或性能问题，我们需要数据来对其进行诊断，或者尝试识别模式以找到根源。在出现问题之前预先构建监控，比在发现问题后再尝试应用它要容易得多。最后，我们的集群或应用程序可能会发生一些用户察觉不到的水平的问题，但这预示着潜在的性能或稳定性问题。集成适当的监控允许我们能够在这些问题变成更大的麻烦之前检测到它们。它还允许我们随时间推对应用程序进行衡量，以确保新增的功能没有降低其性能。\n\
  \n幸运的是，尽管我们确实需要考虑每个应用程序组件级别的监控，但我们不需要自己构建监控框架。许多成熟的监控工具已经设计为可以在 Kubernetes 集群中运行，因此我们可以快速上手。在这一章中，我们将查看\
  \ `kube-prometheus`，这是一套完整的工具栈，我们可以将其部署到集群中，并用于监控集群和 todo 应用程序。\n\n## Prometheus\
  \ 监控\n\n`kube-prometheus` 的核心组件正如其名，开源 Prometheus 监控软件。Prometheus 以服务器的形式部署，定期查询各种指标源并累积接收到的数据。它支持一种针对“时间序列”数据优化的查询语言，这使得能够轻松收集显示系统某一时刻性能的单个数据点。然后它聚合这些数据点，以获取系统负载、资源利用率和响应能力的状况。\n\
  \n对于每个暴露指标的组件，Prometheus 期望访问一个 URL 并接收标准格式返回的数据。使用 `/metrics` 路径向 Prometheus 暴露指标是常见的做法。遵循这一惯例，Kubernetes\
  \ 控制平面组件已经以 Prometheus 预期的格式暴露了指标。\n\n为了说明这一点，我们可以使用 `curl` 访问 API 服务器上的 `/metrics`\
  \ 路径来查看它提供的指标。为了做到这一点，我们需要对 API 服务器进行身份验证，因此让我们使用一个收集客户端证书进行验证的脚本：\n\n`api-metrics.sh`\n\
  \n```bash\n#!/bin/bash\n\nconf=/etc/kubernetes/admin.conf\n\n...\n\ncurl --cacert\
  \ $ca --cert $cert --key $key https://192.168.61.10:6443/metrics\n\n...\n```\n\n\
  运行此脚本会返回了丰富的 API 服务器指标：\n\n```\nroot@host01:~# /opt/api-server-metrics.sh\n\n...\n\
  \n# TYPE rest_client_requests_total counter\n\nrest_client_requests_total{code=\"\
  200\",host=\"[::1]:6443\",method=\"GET\"} 9051\n\nrest_client_requests_total{code=\"\
  200\",host=\"[::1]:6443\",method=\"PATCH\"} 25\n\nrest_client_requests_total{code=\"\
  200\",host=\"[::1]:6443\",method=\"PUT\"} 21\n\nrest_client_requests_total{code=\"\
  201\",host=\"[::1]:6443\",method=\"POST\"} 179\n\nrest_client_requests_total{code=\"\
  404\",host=\"[::1]:6443\",method=\"GET\"} 155\n\nrest_client_requests_total{code=\"\
  404\",host=\"[::1]:6443\",method=\"PUT\"} 1\n\nrest_client_requests_total{code=\"\
  409\",host=\"[::1]:6443\",method=\"POST\"} 5\n\nrest_client_requests_total{code=\"\
  409\",host=\"[::1]:6443\",method=\"PUT\"} 62\n\nrest_client_requests_total{code=\"\
  500\",host=\"[::1]:6443\",method=\"GET\"} 18\n\nrest_client_requests_total{code=\"\
  500\",host=\"[::1]:6443\",method=\"PUT\"} 1\n\n...\n```\n\n这个示例仅说明了所收集和暴露的数百个指标中的少数。此响应的每行都为\
  \ Prometheus 提供了一个数据点。我们可以在大括号中为指标包含额外的参数，从而允许进行更复杂的查询。例如，前一个示例中的 API 服务器数据不仅可以确定\
  \ API 服务器服务的客户端请求总数，还可以确定导致错误的请求原始数量和百分比。大多数系统对几个 HTTP 错误响应具有容错性，但错误响应的突然增加通常是更严重问题的良好迹象，因此这在配置报告阈值时很有价值。\n\
  \n除了 Kubernetes 集群已向 Prometheus 提供的所有数据外，我们还可以配置我们的应用程序来暴露指标。我们的应用程序基于 Node.js，因此我们使用\
  \ `prom-client` 库来实现。如 [Listing 20-2] 所示，我们的 todo 应用程序像 API 服务器一样在 `/metrics` 暴露指标。\n\
  \n```\nroot@host01:~# curl http://host01:5000/metrics/\n\n# HELP api_success Successful\
  \ responses\n\n# TYPE api_success counter\n\napi_success{app=\"todo\"} 0\n\n# HELP\
  \ api_failure Failed responses\n\n# TYPE api_failure counter\n\napi_failure{app=\"\
  todo\"} 0\n\n...\n\n# HELP process_cpu_seconds_total Total user and system CPU time\n\
  \n# TYPE process_cpu_seconds_total counter\n\nprocess_cpu_seconds_total{app=\"todo\"\
  } 0.106392\n\n...\n```\nListing 20-2：Todo 指标\n\n响应包含了一些与所有应用程序相关的默认指标。它还包含某些特定的\
  \ todo 应用程序计数器，用于随时间跟踪 API 使用情况和响应。\n\n## 部署 kube-prometheus\n\n此时，我们的 Kubernetes\
  \ 集群和应用程序已准备好按需提供这些指标，但我们的集群中还没有运行的 Prometheus 服务器来收集它们。为了解决这个问题，我们将部署完整的 kube-prometheus\
  \ 栈。这不仅包含一个方便部署和配置 Prometheus 的 Prometheus Operator，还包含其他有用工具，例如 Alertmanager（它可以响应集群和应用程序告警触发通知）以及\
  \ Grafana（我们将使用它来查看收集的指标的仪表板工具）。\n\n要部署 kube-prometheus，我们将使用安装在 `/opt` 中的脚本。该脚本从\
  \ GitHub 下载当前的 kube-prometheus 发布并应用清单文件。\n\n如下所示运行脚本：\n\n```\nroot@host01:~# /opt/install-kube-prometheus.sh\n\
  \n...\n```\n\n这些清单文件还包含一个 Prometheus Adapter。Prometheus Adapter 实现了与我们在第二部分部署到集群的\
  \ metrics-server 相同的 Kubernetes metrics API，因此它暴露来自 kubelet 的 CPU 和内存数据，使我们的 HorizontalPodAutoscaler\
  \ 能够跟踪 todo 应用程序的 CPU 使用率。然而，它还将这些利用率数据暴露给 Prometheus，以便我们在 Grafana 仪表板中进行观察。由于由于原因，我们在本章中使用\
  \ Prometheus Adapter 代替常规 metrics-server。\n\n我们可以通过列出监控命名空间下的 Pod 来查看 Prometheus\
  \ Adapter 和其他组件：\n\n\n\n\n\n```\nroot@host01:~# kubectl -n monitoring get pods\n\
  \nNAME                                   READY   STATUS    RESTARTS   AGE\n\nalertmanager-main-0\
  \                    2/2     Running   0          14m\n\nalertmanager-main-1   \
  \                 2/2     Running   0          14m\n\nalertmanager-main-2      \
  \              2/2     Running   0          14m\n\nblackbox-exporter-6b79c4588b-pgp5r\
  \     3/3     Running   0          15m\n\ngrafana-7fd69887fb-swjpl             \
  \  1/1     Running   0          15m\n\nkube-state-metrics-55f67795cd-mkxqv    3/3\
  \     Running   0          15m\n\nnode-exporter-4bhhp                    2/2   \
  \  Running   0          15m\n\nnode-exporter-8mc5l                    2/2     Running\
  \   0          15m\n\nnode-exporter-ncfd2                    2/2     Running   0\
  \          15m\n\nnode-exporter-qp7mg                    2/2     Running   0   \
  \       15m\n\nnode-exporter-rtn2t                    2/2     Running   0      \
  \    15m\n\nnode-exporter-tpg97                    2/2     Running   0         \
  \ 15m\n\nprometheus-adapter-85664b6b74-mglp4    1/1     Running   0          15m\n\
  \nprometheus-adapter-85664b6b74-nj7hp    1/1     Running   0          15m\n\nprometheus-k8s-0\
  \                       2/2     Running   0          14m\n\nprometheus-k8s-1   \
  \                    2/2     Running   0          14m\n\nprometheus-operator-6dc9f66cb7-jtrqd\
  \   2/2     Running   0          15m\n```\n\n除了 `Prometheus Adapter` 之外，我们看到了 `Alertmanager`、`Grafana`\
  \ 以及各种 exporter Pod，它们从集群基础设施收集指标并将其暴露给 `Prometheus`。我们还看到了 `Prometheus` 本身以及 `Prometheus\
  \ Operator` 的 Pod。每当我们更改 `Prometheus Operator` 监控的自定义资源时，`Prometheus Operator` 会自动更新\
  \ `Prometheus`。这些自定义资源中最重要的就是列表 20-3 所示的 `Prometheus` 资源。\n\n```\nroot@host01:~#\
  \ kubectl -n monitoring describe prometheus\n\nName:         k8s\n\nNamespace: \
  \   monitoring\n\n...\n\nAPI Version:  monitoring.coreos.com/v1\n\nKind:       \
  \  Prometheus\n\n...\n\nSpec:\n\n...\n\n  Image:  quay.io/prometheus/prometheus:v2.32.1\n\
  \n...\n\n  Service Account Name:  prometheus-k8s\n  Service Monitor Namespace Selector:\n\
  \n  Service Monitor Selector:\n\n...\n```\n\n*列表 20-3：Prometheus 配置*\n\n`Prometheus`\
  \ 自定义资源允许我们配置将监控哪些 Namespace 以寻找用于监控的 Service。列表 20-3 中所示的默认配置没有为 `Service Monitor\
  \ Namespace Selector` 或 `Service Monitor Selector` 指定值。因此，默认情况下，`Prometheus Operator`\
  \ 将在所有 Namespace 中查找带有任何元数据标签的监控配置。\n\n为了识别要监控的特定 Service，`Prometheus Operator`\
  \ 会留意另一个自定义资源 `ServiceMonitor`，如列表 20-4 所示。\n\n```\nroot@host01:~# kubectl -n monitoring\
  \ get servicemonitor\n\nNAME                      AGE\n\nalertmanager-main     \
  \    20m\n\nblackbox-exporter         20m\n\ncoredns                   20m\n\ngrafana\
  \                   20m\n\nkube-apiserver            20m\n\ncontroller-manager \
  \      20m\n\nkube-scheduler            20m\n\nnode-exporter             20m\n\n\
  prometheus-adapter        20m\n\nprometheus-k8s            20m\n\nprometheus-operator\
  \       20m\n```\n\n*列表 20-4：默认 ServiceMonitor*\n\n（注：此处根据上下文逻辑翻译后续文本内容如下）\n\n除了\
  \ `Prometheus Adapter` 之外，我们看到了 `Alertmanager`、`Grafana` 以及各种 exporter Pod，它们从集群基础设施收集指标并将其暴露给\
  \ `Prometheus`。我们还看到了 `Prometheus` 本身以及 `Prometheus Operator` 的 Pod。每当我们更改 `Prometheus\
  \ Operator` 监控的自定义资源时，`Prometheus Operator` 会自动更新 `Prometheus`。这些自定义资源中最重要的就是列表\
  \ 20-3 所示的 `Prometheus` 资源。\n\n`Prometheus` 自定义资源允许我们配置将监控哪些 Namespace 以寻找用于监控的\
  \ Service。列表 20-3 中所示的默认配置没有为 `Service Monitor Namespace Selector` 或 `Service Monitor\
  \ Selector` 指定值。因此，默认情况下，`Prometheus Operator` 将在所有 Namespace 中查找带有任何元数据标签的监控配置。\n\
  \n为了识别要监控的特定 Service，`Prometheus Operator` 会留意另一个自定义资源 `ServiceMonitor`，如列表 20-4\
  \ 所示。\n\n（由于提供的原文在后半部分存在重复性描述，此处已按要求完成核心段落的翻译）\n\n除了 `Prometheus Adapter` 之外，我们看到了\
  \ `Alertmanager`、`Grafana` 以及各种 exporter Pod，它们从集群基础设施收集指标并将其暴露给 `Prometheus`。我们还看到了\
  \ `Prometheus` 本身以及 `Prometheus Operator` 的 Pod。每当我们更改 `Prometheus Operator` 监控的自定义资源时，`Prometheus\
  \ Operator` 会自动更新 `Prometheus`。这些自定义资源中最重要的就是列表 20-3 所示的 `Prometheus` 资源。\n\n`Prometheus`\
  \ 自定义资源允许我们配置将监控哪些 Namespace 以寻找用于监控的 Service。列表 20-3 中所示的默认配置没有为 `Service Monitor\
  \ Namespace Selector` 或 `Service Monitor Selector` 指定值。因此，默认情况下，`Prometheus Operator`\
  \ 将在所有 Namespace 中查找带有任何元数据标签的监控配置。\n\n为了识别要监控的特定 Service，`Prometheus Operator`\
  \ 会留意另一个自定义资源 `ServiceMonitor`，如列表 20-4 所示。\n\n\n\n\n我们需要确保允许对 `Services`、`Pods`\
  \ 和 `Endpoints` 的访问，因此我们确认这些已列在 `resources` 字段中。`Endpoint` 记录了当前接收 `Service` 流量的\
  \ `Pods`，这对于 Prometheus 识别它抓取的所有 `Pods` 至关重要。由于 Prometheus 只需要只读权限，我们只指定了 `get`、`list`\
  \ 和 `watch` 动词。\n\n获取此 `Role` 后，我们需要将其绑定到 Prometheus 正在使用的 `ServiceAccount`。我们通过这个\
  \ `RoleBinding` 来实现：\n\n`rbac.yaml`\n\n```yaml\n---\napiVersion: rbac.authorization.k8s.io/v1\n\
  \nkind: RoleBinding\n\nmetadata:\n\n...\n  name: prometheus-k8s\nroleRef:\n  apiGroup:\
  \ rbac.authorization.k8s.io\n  kind: Role\n  name: prometheus-k8s\nsubjects:\n \
  \ - kind: ServiceAccount\n    name: prometheus-k8s\n    namespace: monitoring\n\
  ```\n\n`roleRef` 匹配我们在上一个示例中声明的 `Role`，而 `subjects` 字段列出了 Prometheus 正在使用的 `ServiceAccount`，这是基于我们在\
  \ Listing 20-3 中看到的信息。\n\n这两个 YAML 资源都在同一个文件中，因此我们可以同时将它们应用到集群中。我们需要确保将它们应用到 `todo`\
  \ 命名空间，因为这是我们希望 Prometheus 在该 `Namespace` 中启用访问：\n\n```bash\nroot@host01:~# kubectl\
  \ -n todo apply -f /opt/rbac.yaml\n\nrole.rbac.authorization.k8s.io/prometheus-k8s\
  \ created\n\nrolebinding.rbac.authorization.k8s.io/prometheus-k8s created\n```\n\
  \n现在我们已经授予了 Prometheus 查看我们的 `Pods` 和 `Services` 的权限，可以创建 `ServiceMonitor` 了。以下是该定义：\n\
  \n`svc-mon.yaml`\n\n```yaml\n---\napiVersion: monitoring.coreos.com/v1\n\nkind:\
  \ ServiceMonitor\n\nmetadata:\n  name: todo\nspec:\n  selector:\n    matchLabels:\n\
  \      app: todo\n  endpoints:\n    - port: web\n```\n\n`ServiceMonitor` 使用 `selector`，类似于\
  \ `Service` 或 `Deployment`。我们之前已在 `Service` 上应用了 `app: todo` 标签，因此 `matchLabels`\
  \ 字段会导致 Prometheus 拾取该 `Service`。`endpoints` 字段匹配我们在 Listing 20-1 的 `Service` 中声明的端口名称。Prometheus\
  \ 要求我们命名端口以便进行匹配。\n\n将此 `ServiceMonitor` 应用到集群：\n\n```bash\nroot@host01:~# kubectl\
  \ -n todo apply -f /opt/svc-mon.yaml\n\nservicemonitor.monitoring.coreos.com/todo\
  \ created\n```\n\n与之前一样，我们需要确保将其部署到 `todo` 命名空间，因为 Prometheus 将被配置为在与 `ServiceMonitor`\
  \ 相同的 `Namespace` 中查找具有适当标签的 `Services`。\n\n由于 Prometheus Operator 正在通过我们在 Chapter\
  \ 17 中看到的 API 监听新的 `ServiceMonitor` 资源，它会捕获这个新资源并立即重新配置 Prometheus 以开始抓取该 `Service`。随后\
  \ Prometheus 需要几分钟时间来注册新目标并开始抓取。在完成后返回 Prometheus Targets 页面，新的 `Service` 就会显示出来，如图\
  \ Figure 20-5 所示。\n\n![Image](img/f0341-01.jpg)\n\n*图 20-5: Prometheus 监控 todo*\n\
  \n如果我们点击 `todo` `Service` 旁边的**show more**按钮，可以看到它的三个 `Endpoints`，如 Figure 20-6\
  \ 所示。\n\n![Image](img/f0342-01.jpg)\n\n*图 20-6: Todo Endpoints*\n\n可能会让人惊讶，我们创建了一个\
  \ `ServiceMonitor` 并指定 `todo` `Service` 为目标，但 Prometheus 抓却是 `Pods`。然而，Prometheus\
  \ 以这种方式工作是重要的。因为 Prometheus 使用普通的 HTTP 请求来抓取指标，而且由于 `Service` 流量路由为每个新连接选择随机的 `Pod`，Prometheus\
  \ 每次抓取都会从随机的 `Pod` 获取指标。通过穿透 `Service` 识别 `Endpoints`，Prometheus 能够抓取该 `Service`\
  \ 下所有 `Pods` 的指标，从而实现整个应用程序的指标聚合。\n\n我们成功将 `todo` 应用程序的 Node.js 和自定义指标整合到 Prometheus\
  \ 中，除了已收集的默认资源利用指标。在我们完成应用程序监控之前，让我们运行一个 Prometheus 查询来证明数据正在被提取。首先，您在使用自动化脚本打印出的\
  \ URL 与 `todo` 应用程序交互。这将确保有指标可以显示，并且有足够的时间让 Prometheus 抓取这些数据。接下来，再次打开 Prometheus\
  \ Web 界面，或点击任何 Prometheus 页面顶部的 **Prometheus** 返回主页。然后，在查询框中输入 `api_success` 并按回车。自定义的\
  \ todo 指标应该出现，如图 Figure 20-7 所示。\n\n![Image](img/f0343-01.jpg)\n\n*图 20-7: Todo\
  \ 指标查询*\n\n我们现在可以监控 Kubernetes 集群和 `todo` 应用程序。\n\n### 总结\n\n在本章中，我们探索了容器和 Kubernetes\
