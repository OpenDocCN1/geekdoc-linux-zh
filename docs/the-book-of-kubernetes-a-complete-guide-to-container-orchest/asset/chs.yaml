  \nOne final note: for this `curl` command to work, we need to be selective in the\
  \ hostname or IP address we use. The API server is listening on all network interfaces,\
  \ so we could connect to it using `localhost` or `127.0.0.1`. However, those are\
  \ not listed in the `kube-apiserver` certificate and cannot be used for secure HTTP\
  \ because `curl` will not trust the connection.\n\n### API Server Authentication\n\
  \nWe need to provide authentication information before the API server will accept\
  \ our requests, so let’s understand the API server’s process for authentication.\
  \ Authentication is handled through a set of plug-ins, each of which looks at the\
  \ request to determine whether it can identify the client. The first plug-in that\
  \ successfully identifies the client provides identity information to the API server.\
  \ This identity is then used with authorization to determine what the client is\
  \ allowed to do.\n\nBecause authentication is based on plug-ins, it’s possible to\
  \ have as many different ways of authenticating clients as needed. It’s even possible\
  \ to add a proxy in front of the API server that performs custom authentication\
  \ logic and passes the user’s identity to the API server in an HTTP header.\n\n\
  For our purposes, we’ll focus on three authentication primary plug-ins that are\
  \ used within the cluster itself or as part of the cluster setup process: `client\
  \ certificates`, `bootstrap tokens`, and `service accounts`.\n\n#### Client Certificates\n\
  \nAs mentioned previously, an HTTP client like `curl` validates the server’s identity\
  \ by comparing the server’s hostname to its certificate and also by checking the\
  \ certificate’s signature against a list of trusted CAs. In addition to checking\
  \ the server identity, secure HTTP also allows a client to submit a certificate\
  \ to the server. The server checks the signature against its list of trusted authorities\
  \ and then uses the subject of the certificate as the client’s identity.\n\nKubernetes\
  \ uses HTTP client certificate authentication extensively to enable cluster services\
  \ to authenticate with the API server. This includes control plane components as\
  \ well as the `kubelet` service running on each node. We can use `kubeadm` to list\
  \ the certificates used by the control plane:\n\n```\nroot@host01:~# kubeadm certs\
  \ check-expiration\n\n...\n\nCERTIFICATE                ...  RESIDUAL TIME   CERTIFICATE\
  \ AUTHORITY ...\n\nadmin.conf                 ...  363d                        \
  \          ...\n\napiserver                  ...  363d            ca           \
  \         ...\n\napiserver-etcd-client      ...  363d            etcd-ca       \
  \        ...\n\napiserver-kubelet-client   ...  363d            ca             \
  \       ...\n\ncontroller-manager.conf    ...  363d                            \
  \      ...\n\netcd-healthcheck-client    ...  363d            etcd-ca          \
  \     ...\n\netcd-peer                  ...  363d            etcd-ca           \
  \    ...\n\netcd-server                ...  363d            etcd-ca            \
  \   ...\n\nfront-proxy-client         ...  363d            front-proxy-ca      \
  \  ...\n\nscheduler.conf             ...  363d                                 \
  \ ...\n\n...\n```\n\nThe RESIDUAL TIME column shows how much time is left before\
  \ these certificates expire; by default, they expire after one year. Use `kubeadm\
  \ certs renew` to renew them, passing the name of the certificate as a parameter.\n\
  \nThe first item in the list, `admin.conf`, is how we’ve been authenticating ourselves\
