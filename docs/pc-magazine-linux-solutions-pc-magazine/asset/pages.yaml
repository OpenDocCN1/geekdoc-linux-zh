  md: '# 316 PC Magazine — Linux Solutions


    # USING TEXT COMMANDS


    Linux just benefit if there is a way to do the job with text commands. In this
    case, the command you need to use is smbmount and it takes the name of a server
    and share as a source and a mount point is an empty directory. So, for example,
    let''s say your mount point is /mnt/Samba. If you don''t have this, you can create
    it by giving the command mkdir /mnt/Samba. You should also give and write permission
    on this directory to everyone with the command chmod +rw /mnt/Samba. Now, you
    can mount a SAMBA share like this:


    ```

    smbmount //Server/share -mnt/Samba

    ```


    Again, replace Server with the name of the machine on which you are running the
    Samba. (You could also use an IP number for the server name in smbmount //192.168.0.43/samba-share
    /mnt/Samba.). Note that both server and share names are sensitive. Note also the
    double slash preceding the name of the server. After you have the share mounted,
    you can simply move into the directory /mnt/Samba and access the files as if they
    were located on the local machine''s hard.


    # Setting up Macintosh clients


    Although most PC Magazine readers are probably Windows users, it''s possible that
    you might have a network with different kinds of machines, including Macintosh.


    Like Nautilus and Conqueror, the Macintosh file manager —Finder—has built-in support
    for the SMB protocol. To access a SAMBA share from a Macintosh, open Finder, click
    on the Menu, and select Connect to Server. The Connect to Server window opens.
    In the server address field, type smb:/server name/share name. So, to access the
    share in our example, type smb://Server/samba-share.


    # Linux-to-Linux File Sharing


    While it is possible to share files among Linux machines using SAMBA (and indeed,
    there''s no real reason not to), there is, another method available as well. This
    method is NFS, the Network File System. There is no real reason to prefer NFS
    to SAMBA for Linux-to-Linux file sharing, except that almost Linux systems are
    configured to use NFS out of the box. In other words, it''s fairly rare that you
    have to install any NFS software. Also, NFS is a standard on many other types
    of Unix systems, which are well suited to run in a mixed-environment Unix.


    # Setting up an NFS server


    NFS is a function of the Linux kernel, so you don''t need to install client or
    server software. You may, however, want to check make sure you have a package
    called nfs-utils. If you don''t have it, it should be on your installation media
    or available for download from your distribution''s Web site. Install the package
    using whichever package management system comes with your distribution.'
