    # Revoking a key


    In the event of your key being compromised, don''t feel ashamed. The responsible
    thing to do is to immediately publicize this fact as wide and as possible so other
    people not to trust it. You should also do this if the key is no longer in use.
    How will they know it is really announcing the validity of your key and not a
