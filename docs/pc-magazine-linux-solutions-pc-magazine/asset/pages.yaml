  md: '# Chapter 23: Proxy Server Solutions


    #TAG: cache_swap_low(percent, 0-100)

    #TAG: cache_swap_high (percent, 0-100)


    #The low and high-water marks for cache object replacement.

    #Replacement begins when the swap (disk) usage is above the

    #low-water mark and attempts to maintain utilization near the

    #low water mark. As swap utilization gets close to high-water

    #mark object eviction becomes more aggressive. If utilization is

    #close to the low-water mark less replacement is done each time.


    #Defaults are 90% and 95%. If you have a large cache, 5% could be

    #hundreds of MB. If this is the case you may wish to set these

    #numbers closer together.


    #Default:

    #cache_swap_low 90

    #cache_swap_high 95


    #TAG: maximum_object_size (bytes)

    #Objects larger than this size will NOT be saved on disk. The

    #value is specified in kilobytes, and the default is 4MB.

    #If you wish to get a high BYTES hit ratio, you should probably

    #increase this (one 32 MB object hit counts for 3200 KB

    #hits). If you wish to increase speed more than your want to

    #save bandwidth you should leave this low.


    #NOTE: if using the LFU replacement policy you should increase

    #this value to maximize the hit rate improvement of LFUDA!

    #Replacement_policy below for a discussion of this policy.


    #Default:

    #maximum_object_size 4096 KB


    #TAG: minimum_object_size (bytes)

    #Objects smaller than this size will NOT be saved on disk. The

    #value is specified in kilobytes, and the default is 0 KB,

    #means there is no minimum.


    #Default:

    #minimum_object_size 0 KB


    #TAG: maximum_object_size_in_memory (bytes)

    #Objects greater than this size will not be attempted to be kept in

    #the memory cache. This should be set high enough to keep objects

    #accessed frequently in memory to improve performance whilst low'
