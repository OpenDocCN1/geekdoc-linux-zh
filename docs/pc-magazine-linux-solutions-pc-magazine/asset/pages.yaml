  md: '# Chapter 6


    # Using Accounts


    When Patrick McGoohan, playing the title role in the classic TV show The Prisoner,
    is dehumanizing renamed Number 6, he shouts at his captor, "I am not a number.
    I am a free man!" Unfortunately, computers find numbers a lot easier to deal with
    than free men, so as far as your Linux operating system is concerned, you are
    a number. Add to injury, you are probably number 500 or 1000 rather than 6, for
    reasons that are explained later in this chapter.


    However, unlike Linux which uses numbers only for its internal needs. Linux also
    allows users to be organized into groups for various purposes. Like individual
    users, groups are known to the system by numbers but also have human-friendly
    names. This chapter explains how Linux''s user and group numbering works and how
    the system translates these numbers into people-friendly names, and how you can
    use these concepts to administer and secure your computer.


    # Users, System Users, and Groups


    Linux was designed from the beginning to allow multiple users to work on one computer.
    As in Windows, each user gets some resources to call his or her own. Each user
    gets his or her folder (the home folder) populated with some basic configuration
    files (configuration files in the home folder system-wide defaults). As users
    use and customize software, more configuration files are added to their home folders.
    The graphical environment they choose to use may also add folders for them. Each
    gets a mailbox for incoming e-mail and the ability to send outgoing email from
    their own address. You may have a special directory for hosting Web pages. There
    are Linux systems that serve thousands of users like this.


    But even if you are the only person who logs in and your machine isn''t doing
    anything except displaying a blank screen, you are not the only "user" of your
    computer. There are programs (known as daemons in Linux jargon) that run services
    in the background, called by action as Linux. Some examples would be a Mail or
    Web server, needed only when an e-mail message or request for a Web page is received,
    or the cron daemon, an event scheduler. Typically, each daemon runs as a separate
    user that owns only the special data files it needs and no others. This mechanism
    is secure; if someone breaks into your user they may be able to delete or your
    Web pages, but at least he won''t be able to access any other information that
    might be on the same system. Other users are for specific roles such as backup
    operator or server administrator. Yet others are for "owning" peripherals such
    as a fax modem or CD burner. In each case, the reason for the existence of these
    users is the same: keeping the privilege to perform actions that affect the stability
    of the whole system as fine-grained and easy to keep track of as possible.'
  merge: -1
  pgno: 81
- img_proc: true
  md: '# The user database: /etc/passwd


