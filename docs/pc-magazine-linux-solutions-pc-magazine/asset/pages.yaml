    # Sources and destinations


    Earlier I mentioned that there is more than one target for a command. Typically,
    the use of multiple targets takes the form of a source and a destination target.
    As an example, look at the command which is used to move a file from one location
    to another. Assume that you have a file called /home/fred/bedrock, moving the
    file bedrock is located in the directory /home/fred (Fred''s home directory).
    Now imagine that you want to move it to the directory /home/fred/wilma. By doing
    that in this form:


    ```

    mv /home/fred/bedrock /home/wilma

    ```


    After this command runs, the file would be designated as /home/wilma/bedrock.
    If you wanted to rename the file at time you could have given the command like
    so:


    ```

    mv /home/fred/bedrock /home/wilma/gravel

    ```


    Then the file would become known as /home/wilma/gravel. This command can also
    be used to rename a file but leave it in the same directory:


    ```

    mv /home/fred/bedrock /home/fred/gravel

    ```


    This would leave the file in /home/fred but change the name from bedrock to gravel.'
