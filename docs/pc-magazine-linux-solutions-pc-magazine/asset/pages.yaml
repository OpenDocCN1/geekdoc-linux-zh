    # Compression


    The storage sizes above reflect the normal capacity for each device. However,
    backup data can be compressed, and this can allow you to substantially increase
    the amount you can store. Typically, sales brochures for backup devices double
    the normal capacity to indicate their compressed capacity, but this is overly
    optimistic. In real-usage, text and some other types of data with a regular structure
    compress well while binary files as images have a data structure that is far less
    regular, and compressing them provides only modest savings. In some cases, the
    compressed version may actually be bigger.


