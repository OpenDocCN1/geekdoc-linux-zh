  md: '# Chapter 16: Installing and Removing Hardware


    # Where Do Device Drivers Come From?


    It''s in the best interests of any hardware manufacturer to supply device (and
    print) drivers for all popular operating systems when they release a new card
    or peripheral. It takes time and money to develop and perfect these drivers, which
    often means that the driver CD falls out of the box that your new printer provides
    drivers only for Windows and Apple''s Mac OS X. Since Linux is still viewed as
    an up-and-coming operating system, few hardware vendors are savvy enough to provide
    out-of-the-box drivers for Linux. A problem? Not really? It''s simple time to
    test the horn of open source again.


    Not everyone wants to develop drivers but, however many motivated Linux fans do.
    Both Linux users who use the same hardware as you and the Linux distribution vendors
    want Linux to become increasingly popular are highly motivated to provide support
    for almost any modern card or peripheral. I''ve been using Linux systems for over
    10 years, and the last few years have been a true joy in terms of insert, built-in
    support for almost every piece of new hardware that I''ve added to my systems.
    I hope that your experience will be the.


    # Loading device drivers at boot time


    When Linux boots, they probe the hardware located in your system and then run
    a command known as modprobe (probe modules) that performs various functions including
    loading the device drivers associated with your system''s hardware and peripherals.
    On modern Linux systems (those running a version of the 2.6 kernel), the set of
    actions to perform and device drivers to load are listed in the file /etc/modprobe.conf.
    On older systems, this information was stored in a file called /etc/modules.conf,
    which is usually still present on modern Linux systems in case older system applications
    look for it. (In the modern versions, this file is always empty).


    /etc/modprobe.conf is a file that contains entries that are associated with logical
    and physical system devices. Most Linux distributions automatically create an
    /etc/modprobe.conf file for you during the installation process, but it''s useful
    to understand the format of this file if you just ever need to modify it. A small
    section of example /etc/modprobe.conf is the following:


    ```

    alias eth0 3c501

    options 3c501 io=0x280 irq=5

    ```


    The first entries tell the modprobe command to associate the driver 3c501 (a driver
    for an older 3Com Ethernet card) with the system''s primary Ethernet device, eth0.
    The second tells it to associate specific options with that device driver when
    loading it.


    The /etc/modprobe.conf file contains other types of entries, but discussing all
    of them is outside the scope of this book. For more information, you can examine
    the /etc/modprobe.conf file on your Linux system, often contains comments that
    explain various entries. For more details, you can use the man modprobe.conf command
    from a terminal to view the system''s online reference information about the format
    of this file.'
