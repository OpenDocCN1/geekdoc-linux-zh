  md: '# Chapter 16


    # Installing and Removing Hardware


    It would be great if every computer system came with all the peripherals and add-in
    cards that you''d ever need. Unfortunately, the reality of modern computing is
    that as soon as you buy a computer system, someone will announce some new printer,
    scanner, USB device, or internal card that you simply must have. Assuming that
    your computer system is sexy enough to last you a few years, at some point you''ll
    want to upgrade something that is inside it. Whether that means getting the best
    features of modern versions of operating systems or faster Ethernet card, or supporting
    for FireWire (IEEE 1394) or Bluetooth so that you can connect to your video camera
    or phone, you''re going to have to change things.


    The ability to add hardware and have "just work" with a personal or business computer
    system is one of the best features of modern versions of operating systems as
    Microsoft Windows and Mac OS X. This is typically referred to as "plug and play"
    support, which some optimistic users refer to as "plug and pray”—you attach a
    new device or add a new card, turn on your machine, and that Windows or OS X will
    locate and correctly identify the newly connected hardware. Long thought to be
    the best feature of Microsoft Windows and generations of Apple''s Macintosh system,
    this capability is provided by Linux distributions.


    The remainder of this chapter explores how Linux distributions register, and insert
    with new hardware. I show how to work with cases (such as disk drives) where merely
    recognizing new hardware isn''t enough, and then explore some of the most popular
    built-in software that Linux provides to help you get information about the hardware
    in your system, should you ever need to do so manually.


    # How Linux Handles Hardware


    All internal and external peripherals use what are known as device drivers to
    enable the Linux kernel to locate, and exchange information with them. Device
    drivers are small pieces of system software that are the operating system''s conceptual
    equivalent of the print drivers that you''re probably used when configuring your
    system to print to a new printer.


    Linux device drivers can either be compiled into the Linux kernel or loaded whenever
    the kernel needs them. Modules that are loaded on demand are loadable kernel modules
    and are stored


    267'
  merge: -1
  pgno: 291
- img_proc: true
  md: '# 268 PC Magazine — Linux Solutions


    in a subdirectory of the /lib/modules directory on your Linux system. Because
    Linux makes it easy for you to upgrade the Linux kernel whenever new capabilities
    are available, the loadable kernel modules for a specific version of the Linux
    kernel are stored in a subdirectory whose name matches the release of the kernel
    they are associated with. You can identify the release of the Linux kernel that
    is running on your system using the uname -r command, and in the following example:


    ```

    $ uname -r

    2.6.11-29.default

    $ ls /lib/modules

    2.6.11-20a-default 2.6.28-10-default

    2.6.28-14-default scripts

