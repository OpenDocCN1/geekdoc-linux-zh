  md: '# 162 PC Magazine — Linux Solutions


    This chapter gives you a look at all of these uses for text commands (with the
    exception of cron utility, which is discussed in Chapter 17). You will see that
    from far being a relic of the past, the Linux command-interface is actually one
    of the reasons that Linux is advanced!


    # The Unix Shell


    Some people use Linux without ever looking at a graphical interface. Their environment
    is composed entirely of text, and they do their work simply by entering commands
    and using text-based programs. They are able to do this by making use of the shell.
    The shell is a command interpreter that accepts commands from the user and translates
    them into actions to be executed by the system. A user who is well versed in the
    shell command language can do almost anything graphical user can, and have free
    other things, besides.


    As not weren, the shell is also a programming environment. It is possible to write
    programs using the shell''s command language and execute them with a single command.


    Why is it called a shell? The answer has to do with the propensity of programmers
    to give things whimsical names. A kernel—be it Unix, Linux, or other—is so called
    because constitutes the inner core of the system. A kernel is never really designed
    to be used by humans. Rather, it is designed so that programs can access system
    functions. A shell is designed so that humans operators interact with a system.
    From the operator''s perspective, the shell is something that surrounds and protects
    the kernel.


    Thus, I''ve been talking about “shell” as if it were a monolithic entity. Actually,
    there are many different shells, each with its own features and qualities. Some
    are better suited to certain tasks than others, but to a certain extent, they
    all manage to accomplish the same tasks. Which shell you use is largely a matter
    of preference. Here’s a brief tour of the most popular shells:


    +   **The Bourne** is the original Unix shell. Almost every Unix or Unix-derived
    system has some variant of the Bourne shell installed on. The Bourne shell is
    so basic that its program name (the command one would give to it) is bash.


    +   **The Bourne-again shell** BASH is the free software version of the Bourne
    shell that was created for the GNU project. Originally, BASH was written to be
    identical in function to the Bourne shell, but as it has developed, it takes new
    features of its. BASH is the variant of the Bourne on most Linux systems and is
    probably the most popular among Linux users. BASH extras features that mean programs
    written for the Bourne shell usually run on bash without modifications, but the
    reverse is not always true. Because of this, you may want to check for compatibility
    if you''re trying to use a Bourne-style program written for another system. The
    examples in this book use the BASH shell. The Bourne-again shell''s name is bash,
    but on many systems, it can be invoked with sh.


    +   **The Korn shell (ksh)** was the first shell to have such features as command-line
    editing (the ability to use editing functions from within a command), the ability
    to recall commands, and integer arithmetic (the ability to do arithmetic in the
    shell without having to invoke an external calculator program). The Korn shell
    was also the first shell to allow the user to manage multiple processes from the
    command line. In other words, the Korn'
  merge: -1
  pgno: 186
- img_proc: true
  md: '# Chapter 11: Using the Terminal 163


    allows the user to switch back and forth between running processes — something
    that users of graphical interfaces take for granted, but which, if you think about
    it, would not seem to be as easy in a text-based environment.


    We were not for BASH, the Korn shell (ksh) would probably have eclipsed the Bourne
    shell in popularity. BASH took a number of features, notably listed previously,
    from the Korn shell and incorporated them into another Bourne-type environment.
    To some extent, this stole some of the Korn shells thunder.


    +   The C shell was developed for the purpose of having a Unix shell with a programming
    language that is similar in syntax to the Korn language. C can do just anything
    the Bourne, BASH, or Korn shell can do, but it frequently does in a different
    way. When a user tries to do something on an unfamiliar system and runs into problems,
    the C shell has set as the default on that system, and the user is not aware of
    it. Because of this, it''s often a good idea to double-check the shell you''re
    using. You can check your shell by giving the command echo $SHELL. The C shell
    is usually known by the program name csh but may also be known as tcsh, depending
    on which version you have installed.


    # Note


    You can check your shell by giving the command echo $SHELL.


    # Finding the Terminal


    At this point, you may be staring at your Linux machine saying, "Okay, where do
