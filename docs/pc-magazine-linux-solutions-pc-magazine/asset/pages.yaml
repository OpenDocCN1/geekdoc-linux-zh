- img_proc: true
  md: '# Chapter 11: Using the Terminal 173


    take input files from an operator, you can use files that were created automatically
    as input to other commands. It only takes a little imagination to see what could
    be done using something like this. Something like ls >> etclist, for example,
    might be used to feed a command cat < etclist.


    # Pipes


    There is another type of redirection operator called a pipe. A pipe is used to
    direct the output of one command to become the input to another. The pipe is designated
    by the vertical bar character (|), found above the backlash on many keyboards.


    Suppose that you want to read the directory listing of a very popular directory.
    You give the ls command, but the list is so long that the file names at the beginning
    scroll off the screen before you can read them. How can you handle this situation?
    Well, you could redirect the output of the ls into a file and then read the file
    using the more or less command to page through it, that seems rather cumbersome
    and probably lead to having a lot of files cluttering your system unless you were
    very conscientious about deleting them. A more elegant solution is to pipe the
    output of ls directly into your pagination program, like so:


    ```

    ls -l /etc | more

    ```


    By doing this, you eliminate the need for file creation, and you''re able to get
    the result that you wanted.


    The preceding is a somewhat trivial example, but piping is a powerful function.
    Imagine that you have produced a long text document for your company, XYZCorp.
    Just as you have completed your document, the company announces that it has changed
    its name to ABCCorp, and all documents must be updated to reflect the change.
    You could go through the document and change every by hand, but that would be
    tedious and take too much time. Instead, using the sed command, a pipe, and a
    redirection operator, you can do just this.


    ```

    cat document | sed ''/XYZCorp/ABCCorp/g'' > document-updated

    ```


    # Note


    sed is a text editor that can be used in a noninteractive way to process text
    on the file.


    This command uses cat to generate the output of the file document and then uses
    the pipe to stream that output into the sed command, which makes the substitution.
    The output of the sed command is redirected into a file called document-updated.
    Voila! You have just updated your file, and it only took a few seconds.'
