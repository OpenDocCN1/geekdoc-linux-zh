  md: '# Uninstall services you don''t need


    In order to attack your system there has to be some kind of entry point a hacker
    can exploit. Your firewall will do a good job of blocking any attempts at intrusion,
    but it may not be foolproof. If there is nothing there, for a hacker to actually
    hack, you can guarantee no intrusion will occur. So, it is a good idea to deactivate
    any outside-connecting service you aren''t using.


    How do you know what''s listening on your computer? The netstat command, as its
    name suggests, gives you information about the status of the Linux kernel''s networking
