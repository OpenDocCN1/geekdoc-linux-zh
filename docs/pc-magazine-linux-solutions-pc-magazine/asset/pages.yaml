  md: '# Chapter 7


    # Setting Network Information


    Networked computers seem less of a luxury and more of a necessity nowadays. Just
    years ago, it was somewhat rare to have a network unless you worked in a large
    company, but these days it is just as rare not to be connected to a network. Many
    people have networks at home that combine wire and wireless connections. A networked
    world is just a fact of contemporary life.


    Understanding your network situation is as much a required skill as being able
    to operate and program your DVD player or cellphone. Attaching a Linux computer
    to a network is fairly straightforward. You don''t have to be a networking expert
    to be able to connect and use a network with Linux; Linux was born on the Internet
    and networking is part of its very essence. You can use Linux without ever being
    connected to any kind of network, but like any Unix-type computer, its settings
    are apparent when needed.


    Windows and Linux both speak the same network language, called TCP/IP (Transmission
    Control Protocol/Internet Protocol). The setup of network information is also
    very similar. Linux developers know that the majority of users come from a Windows
    world; they have made a concerted effort to ensure that the general elements and
    navigation to the tools are intuitive and familiar.


    This chapter shows how to configure your network information automatically and
    manually during installation. Chapter 19 illustrates how to set and adjust network
    information after installation. You also learn how to configure your Linux computer
    for cable/DSL access, LAN access, and even dial-up access via modem after installation.
    The chapter begins with an introduction to networking terminology and then segues
    into a how-to on the various types of network settings for your needs.


    # Networking Fundamentals


    The following sections offer a quick primer on the basic terms and components
    of networking.


    # Routers and gateways


    A router is a computer or piece of special equipment that provides a gateway for
    your LAN to other networks and/or the Internet. In network configurations, you
    may see your router referred to as default gateway, gateway, router, or default
    router. You can think of a router or gateway with the'
  merge: -1
  pgno: 99
- img_proc: true
  md: 'analogy: You and several other people are in a room together (your LAN), and
    you have only one door in the room. That door is your gateway to the rest of the
    world. You can communicate within the room, but any messages or communications
    that you or anyone else in the room sends out or receives go through that gateway.


    The type of router or gateway you have on your network is really not important;
    you need to know only the IP address of its LAN interface. The IP address of each
    device on the network is unique but must be related to the IP address of the LAN
    interface, as explained in the following section.


    # Understanding IP addresses


    You don''t need to understand the mysteries of IP addresses if you configure your
    network settings dynamically. However, if you need to manually configure your
    network settings, it will help you understand your LAN''s IP addressing scheme.


    # Note


    Chapter 19 provides a more extensive explanation of TCP/IP and IP addresses. If
    you want to know more about TCP/IP, pick up a copy of TCP/IP for Dummies, 5th
    Edition (Wiley Publishing, 2003). It is a great book for explaining the TCP/IP
    suite of protocols, and how everything fits.


    You can think of IP numbers or addresses as being similar to a telephone number
    for a device, such as a printer or desktop computer. Like telephone numbers, no
    two can be the same, at least on the same network. For example, everyone knows
    the number for information within any area code is the area code. You may have
    the same phone number, but the areas are different. The Internet works the same
    way. You, at some point, realize that your home or office, your workstation has
    an IP of 192.168.0.15 and your friend has the same IP address at office. Continuing
    with the telephone analogy, your friend has a different area in code. She has
    a router with a unique IP address, and all of the addresses within her office
    are seen as one IP address as the Internet is connected. However, within her network,
    the IP address for each device has to be unique. Her computer is the only one
    on her network that can have the IP address of 192.168.0.15. Likewise, yours is
    the only one on your network that can that particular IP address.


    The IP address in this example, 192.168.0.15, is a typical IP address. The dots
    within the address separate the numbers based on their functions. 192 is the class.
    A Class C is a defined range of IP addresses. 192 addresses were set by the Internet
    Network Information Center (InterNIC) and reserved for private use. The InterNIC
    part of the address tells you that this address is a private address in the Class
    C range, not for use on the Internet but only for transmitting messages within
    the LAN.


    The number following the second dot, 0 in this example, is called the subnet address.
    The subnet address for each device on your network has to match your gateway address.
    For instance, if you put an IP address of 192.168.0.15 on your workstation, but
    your router (default gateway) has an address of 192.168.1.254, your IP address
    will not work. You would have to assign 192.168.1.15 for'
  merge: -1
  pgno: 100
- img_proc: true
  md: '# Chapter 7: Setting Network Information 77


    your workstation to successfully connect to your network''s resources and the
    Internet through your gateway. The fourth number in the address (15 in the example)
    is the host address that uniquely identifies your workstation for your subnet.


    # DNS settings


    DNS (domain name service) is how computers find each other on the Internet. It
    is a phone book of sorts where IP addresses are mapped to computer names, just
    as your name are associated with your phone number. Your Internet provider will
    give you two or three IP addresses that you can use for configuring your network.
    With those numbers, your network configuration is complete. You should now be
    able to open your favorite Internet browser application, type in www.wiley.com,
    and your book publisher''s site will magically appear in the browser window.


    This works because your Web browser sends a DNS request for www.wiley.com. If
    found, the information requested is returned to your Web browser. Once your browser
    has this IP address, it sends an HTTP request to the Web server to serve the attached
    to the IP address returned from DNS.


    # Manual versus dynamic settings


    This chapter includes examples of manual settings for static addresses, and automatic
    network settings for your dynamic LAN and Internet connections. Entering network
    information (that is, IP addresses that change over time) is a manual process,
    while choosing your network information automatically configured fields yields
    dynamic results. It is to say, if your settings are dynamic, they will change
    periodically. There are advantages and disadvantages of both types. For workstations,
    dynamic settings seem to be the most appropriate because of the ease of setup
    and maintenance involved in use. Most ISPs use dynamic settings to support clients
    associated with setup. Dynamic network configuration requires a Dynamic Host Configuration
    Protocol (DHCP) server exists on the network that you connect to. This service
    must be set up and maintained by you, your network administrator, or ISP. Many
    inexpensive routers for home and small office are equipped with DHCP services
    installed and enabled by default. A DHCP service is a server that handles out
    information requested by a client (a computer or other network-connected device).
    This information utilizes the IP address, gateway address, DNS addresses, and
    home name. The DHCP server supplies all of the information to the client that
    it needs to be able to connect to network resources and the Internet, if applicable.


    Manual or statically configured settings are used in network configurations for
    servers, printers, routers, and other networking equipment. Some network administrators
    manually set up all computers with static network information to enable remote
    administration. Manual settings require intervention, and maintenance can make
    remote administration and static services available in a very convenient format.
    Using manual settings for network components like workstations and printers makes
    administration easier the LAN administrator can map the network and all of its
    components. This makes for a very reliable and stable situation for the administrator.
    The downside of this situation is that the administrator will not be able to hotplug
    a new piece of network hardware into the LAN. She will have to issue the new device
    a static IP address manually. This is time-consuming on the front end of administration,
    and in the long run locating the device on the network will be easier.'
  merge: -1
  pgno: 101
- img_proc: true
  md: '# Note


    If you are adding a computer to a company network, your network administrator
    will probably take care of these settings in accordance with company policy. These
    instructions are provided to you for connecting a computer at home or in your
    office where you are the designated administrator.


    # Connecting to the Internet


    Whether you are connecting one computer directly to the Internet or adding a machine
    to a network of desktop computers, printers, server, Linux provides tools to make
    connecting relatively easy. The following sections lead you through the setup
    process for direct connections and connections via a local access network.


    # Note


    If you don''t already have an agreement with an Internet Service Provider (ISP)
    or are not part of an existing network, you''ll need to establish service with
    an ISP in your area to get an IP address before you can connect to the outside
    world.


    # Connecting to a local area network


    LAN is the acronym for local area network, which refers to the computers, cables
    (wires), hubs, switches, panels and network interface cards that are connected
    to form a closed data loop. The term local can mean a network in a home, small
    office, a 50-story high-rise office complex, or a college campus. We typically
    think of a LAN as something very limited and in scope, but LANs connect thousands
    of users. Just because a network spans several buildings does not mean that is
    not a LAN.


    # Note


    In contrast to a LAN, WAN, or wide area network, refers to two or more LANs that
    are connected via a high-speed communications link like a T1. A T1 is a telephone
    company virtual service line that, in this case, is used to connect two LANs together
    over great distances. The line is virtual in the sense that it is not a single
    wire connected to the LANs on each end, but rather a series of connections made
    through the telephone company''s array of switches and routers.'
  merge: -1
  pgno: 102
