  md: '# What You Need to Use This Book


    To use this book, all you really need, besides a healthy sense of curiosity, a
    reliable PC with a CD-ROM drive. The CD-ROM provided with the book gives you a
    complete Linux distribution (about more in the next section). If you prefer to
    use a Linux distribution other than the one provided, you''ll need to have the
    installation CDs or DVDs for that.


    # What’s on the Companion CD-ROM


    The CD-ROM included with this book contains the Knoppix live Linux distribution.
    Knoppix is a distribution that can be used directly from the CD with no need to
    install it on your hard drive, so you don''t have to worry about messing up your
    existing operating system. Chapter 9 helps you get started using Knoppix, and
    you can find more information at http://knoppix.org.


    # Where to Go from Here


    By the time you finish this book, you should have all the skills necessary to
    install, run, and administer a Linux system. This while puts you well ahead of
    most people, it by no means makes you an expert. The flexibility and complexity
    of a Linux system is limited only by your imagination and the skills that you
    have made to make that imagination a reality.


    If you wish to become more expert with Linux, the first thing you''ll want to
    do is to learn more about your distribution. Each distribution has its own features,
    attributes, and idiosyncrasies. Fortunately, most distributions also have their
    own Web sites, and a great deal of documentation online. For example, at the time
    of which you are writing, there are no fewer than seven books listed on Amazon.com
    just Fedora Core 4!


    If you''re looking for a more general resource, www.linux.org is good portal to
    start with; or simply use your favorite Internet search engine to look up the
    topic of your choice. Linux was spawned on the Internet, and there are hundreds
    of Web sites devoted to it.'
