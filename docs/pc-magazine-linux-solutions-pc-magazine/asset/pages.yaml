  md: '# 72 PC Magazine — Linux Solutions


    merits of the operating system, one reason Linux users are relatively immune to
    the hacking attacks that plague Windows users is historically they have been more
    aware of good password practices and security measures. Put yourself and the good
    name of Linux at risk by being sloppy and making it easy to get hacked.


    Here are some examples of what are universally considered to be bad passwords:


    +   - Words that can be found in a dictionary, like yogurt or earlier examples.
    Hackers use large electronic dictionaries to attempt to guess passwords.


    +   - Words from foreign languages. The hackers have dictionaries for those too.
    Even esoteric languages.


    +   - Personal information such as telephone or social security numbers, your
    login name, names of family members, and other personal information (Searching
    your name on a search engine like Google. You''d be surprised how much personal
    information is publicly available on the Internet.).


    +   - Names of fictional characters or other cultural references (especially names
    from Tolkien books or Star Trek).


    All these passwords could easily discovered by a hacker.

    The more random a password is, the harder it is for a hacker to guess it. Here
    are some criteria for strong passwords:


    +   - It should be at least six characters long. It can be more, but the longer
    a password gets, the harder it is to remember and type correctly.


    +   - It should contain a mix of upper- and lowercase letters, numbers, and nonalphabetic
    characters.


    +   - It should be memorable enough that its owner can type it quickly, lessening
    the chance someone is observing you type.


    The problem is that a password that is very hard to create will also be hard to
    remember. This could tempt you to write the password somewhere, which in turn
    can lead to being stolen or left where it can be read by strangers. Here are some
    strategies often used for making a password easier without reducing its strength:


    +   - Making it up from the first (or last or third) letter in each word of a
    phrase. For example, the first letters of "Sing Muse of the wrath of Achilles"
    results in SMotWA.


    +   - Combine two words alternating a character from each word. For example, "apple"
    and "grape" combined as agprpple.


    +   - Combine two words, separating them by some punctuation or digits. For example,
    foot?Gold.


    You can probably think of other combination schemes along these lines.'
  merge: -1
  pgno: 96
- img_proc: true
  md: 'Another way to enhance security is to change your password on a regular basis,
    say, once a month. This can be a problem because some users find this task onerous,
    and when security becomes a burden, it often falls by the wayside. But if you
    recognize and accept the value of security, changing passwords regularly is a
    very good measure.


    # Summary


    Even on a system used by a single person, there are multiple user and group accounts.
    Linux maintains an internal representation of these accounts but has features
    that allow people to deal with them in a more human-friendly way. User and group
    information is usually stored in text files as /etc directory, but alternative
    lookup methods are also available.


    The superuser or root is an account that has privileges other users do not. It
    is possible to switch user and group identities. Some programs can run as a specific
    user or group identity regardless of whoever started them. Users can change their
    passwords and other personal account information, and root can do this for any
    account. Picking a good password that is hard to guess but easy to remember is
    very important for the security of your system.'
  merge: -1
