    If you are not using Red Hat''s key, you can replace /usr/share/rhn/RPM-GPG-KEY
    with the name of the key you downloaded. After you have imported the key, you
    can use it to check the signature on the package. Give this command:


    ```

    rpm -k rpm-file

    ```


    You''ll need to replace rpm-file with the actual name of the package you want
    to verify. If the package is authentic, you should see the message: md5 gpg OK.
    If you get an error message, you might want to make sure the site you downloaded
    your package from is actually the site you thought it was. You might want to email
    the site administrator to make sure he she knows that the packages on site are
    failing the integrity tests. Note that Red Hat''s key, for example, works only
    on software that was packed by Red Hat. If your packages come from a third party,
    you will need to use its own key.


    # Note


    It''s worth double-checking the nature of the site to make sure it''s the site
    you thought it was. For example, Red Hat''s key is not going to work on a package
    that was not created by Red Hat, if you thought the site you were downloading
    from an official Red Hat download or mirror site and it wasn''t, you might be
    getting errors on other packages.


    # Querying a package with RPM


    One of the best features of RPM is that it gives you the ability to query your
    system about the packages that are installed on it. Thus, if you have any questions
    about what''s installed on your system, or need information about the details
    of a specific package, you can run a query and find that information. You can
    find a complete list of query options by reading the RPM manual (give the command
    rpm), but the following example shows you a couple of the commonly used query
    options to give you a feel for what queries are possible.'
  merge: -1
