  md: '# THE DESKTOP


    When users usually refer to the desktop, they are usually referring to their desktop''s
    background. That is, the majority of the screen, which has nothing on it. If you''re
    using Fedora Core, the default background picture contains the Fedora Core logo.
    Others may make use of background images. This background image can be changed
    or eliminated. You can use an image of your choice, or you can set the background
    to be a solid color or gradient. You learn how to change the background in Chapter
