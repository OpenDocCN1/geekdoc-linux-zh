    on your system. Part of the process of the Fedora Core installation process is
    to install the Fedora Core boot loader, known as GRUB, which stands for Unified
    Boot Loader. GRUB is a powerful, boot loader that makes it easy to boot your system
    in many ways, including different operating systems. As you''ll see in the next
    section, part of this flexibility is meant to make it easy for you to choose which
    system whenever you restart your computer. GRUB will always start one of your
    installed operating system by default if you don''t do anything. If you want to
    start Linux by default and start selecting it from a boot menu, leave the options
    on this screen as are. If you want to boot Windows by default and start Linux
    only when selecting it from a boot menu, click the checkbox to the left of the
    Other entry.


    Those are the only dialogs that differentiate dual-boot configuration from the
    standard Fedora Core installation process. Click Next to proceed with the remainder
    of the installation process.'
