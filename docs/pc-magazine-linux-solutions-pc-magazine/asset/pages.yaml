    # Summary


    Although graphical user interfaces are relatively new on Linux, they''ve actually
    been around the Unix world even longer than Windows or Mac OS. GNOME and KDE are
    the two major competing desktops on the Linux platform; they provide the Linux
    user with many of the same functions as the desktop environments on other platforms.
    In fact, desktop environments in general have matured enough so that a common
    set of functions is found on most systems, and users familiar with one default
    desktop prefer one or the other as their should have little trouble adapting to
    another. Many distributions provide both. Many aspects of the two systems are
    the same, and to some extent, there are no compelling reasons to prefer one to
    the other.'
