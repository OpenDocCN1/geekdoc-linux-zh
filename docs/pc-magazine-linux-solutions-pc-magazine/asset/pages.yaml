  md: '# 398 PC Magazine — Linux Solutions


    And change it to look like this:


    ```

    smtp  inet  n  n    smtpd -o content_filter=spamassassin

    ```


    Now, scroll to the end and add this line:


    ```

    spamassassin unix - n n - - pipe

    user-nobody argv=/usr/bin/spamc -f -e /usr/bin/sendmail -oi -f

    $(sender) [recipient]

    ```


    You must make sure the above is all on one line, else you must start the subsequent
    lines with whitespace order for Postfix to be able to read the line correct. Save
    your change and exit the file.


    # Note


    The example configuration uses the command /usr/bin/sendmail. This is because
    the Sendmail MTA was the only one available for Unix for many years. For this
    reason, the sendmail command was integrated intensively into Unix systems. Consequently,
    the command is still but often an alias for one or more other commands.


    After you''ve done these, restart Postfix. SpamAssassin should now be checking
    your mail. SpamAssassin adds the [SPAM] to anything it thinks is spam. You can
    check for flagged spam in your inbox visually. Many e-mail programs allow you
    to set up rules that automatically move your flagged messages to another directory:
    I recommend using the visual method until you are sure that SpamAssassin is flagging
    correctly.


    # Note


    Fighting spam is an inexact science. SpamAssassin is popular enough that many
    spammers will test their methods against it. For this reason, SpamAssassin as-is
    with no additional configuration may not provide a lot of protection. You may
    wish to consider an add-on program such as Maia Mailguard (www.renaisoft.com/maia/).
    Such programs require a certain investment in time of spent learning to use them,
    but you will find the resources saved to be worth it.


    # Summary


    Running an electronic mail server is a fairly complex task. Whether you''re just
    trying to set up a simple server or you''re serving mail for an entire domain,
    you''ll need to consider many components for a working mail system. Using Postfix
    and Dovecot, you can set up a relatively simple system. This'
