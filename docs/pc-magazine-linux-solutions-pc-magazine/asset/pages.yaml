  md: '# Chapter 21


    # Web Server Solutions


    One function in which Linux excels is that of an easy-to-use, low-cost Web server.
    In addition to having an inexpensive (or free), server-oriented operating system
    that runs on off-the-shelf hardware, you also have at your disposal the most popular
    and, in my opinion, best Web server software that exists: Apache is free software
    (although some vendors offer modified Apache servers for a price) and has been
    used in just about any capacity you can imagine for a Web server.

    This chapter covers basics of getting an Apache server up and running. Like many
    servers, Apache is configured mainly by the editing of text files. So fire up
    your text editor, and let''s get started.


    Note


    Some Linux distributions ship with graphical Apache configuration tools. On the
    whole, if you''re serious about using Apache, understanding the text files and
    how to edit them is the best way to keep a handle on what you''re doing. Nevertheless,
    if you''re interested in trying one of these tools out, consult your distribution''s
    documentation.


    # Getting and Installing Apache


    Most distributions have jumped at the chance to include the extremely popular
    free software package. Odds are, whichever distribution you''re using, Apache
    is on it. You should be able to install it from your installation media in the
    same way that you''d install any other software package. In fact, there''s a good
    possibility that Apache is already on your system. If your package management
    system supports querying, you can check that, or you search for a file named httpd,
    which is often located in the /usr/sbin directory, in the main Apache executable
    file. If you find that, Apache is already installed.


    If Apache is neither your system nor your installation medium, you can download
    it from http://httpd.apache.org/download.cgi. The downloads at this site are all
    in the form of source code. Instructions on compiling Apache from source code
    are included with the package, and'
  merge: -1
  pgno: 389
- img_proc: true
  md: '# 366 PC Magazine — Linux Solutions


    Chapter 15 provides a general overview of the process. In the unlikely event that
    your distribution''s installation CDs do not include an Apache package, you may
    be able to find one at either the distribution''s or Apache''s Web site.


    # Configuring Apache


    After you have Apache installed, you''ll need to do some basic configuration to
    get it running. Before you dive into editing your configuration files, though
    you''ll need to have some information handy, so find out the following and write
    it down:


    +   * Your domain name (in this case example.com.)

    * The full machine name (host name) of the Web server machine (www.example.com)

    * The full machine names of other machines on the network (comp1.example.com,
    comp2.example.com, etc.)

    * The IP numbers of your domain and all of the machines on the network (192.168.0.1,
    192.168.0.2, etc)


    Once you''ve got that, you can start editing the configuration files.


    # Note


    A domain name is a name like example.com—a standard Internet address. In order
    for these names to work on Apache (or in general, for that matter), you can''t
    make them up. Domain names must be registered through one of the agencies that
    are licensed to perform this service. You can find a domain name registrar by
    consulting the list at www.icann.org/registrars/accredited-list.html.


    By default, Apache puts its configuration files in places that certain distributions
    don''t like. When the distributors build the packages, sometimes it changes the
    location of these files. The upshot is that your distribution may have its configuration
    files in a nonstandard location. This is complicated by the fact that the default
    locations were changed in the transition from Apache 1.3 and further by the fact
    that naming schemes are used for different Unix variants.


    The upshot is that you''re going to need to find these configuration files on
    your machine. The most likely places for them to be /etc/httpd, /etc/apache, /usr/local/apache,
    or /usr/local/apache/conf.


    # Note


    Fedora Core uses /etc/httpd, while Knoppix uses /etc/apache.'
  merge: -1
  pgno: 390
- img_proc: true
  md: '# Chapter 21: Web Server Solutions


    Once you''ve found the directory where the configuration files are kept, you can
    access the configuration files. The file you are primarily interested in is the
    one designated httpd.conf. Open this file in a text editor and look at it. There
    are a lot of comments in this file, and you can learn a lot about how to configure
    Apache by reading them.


    The general format of the configuration file works like this: The file contains
    directives that apply to the server as a whole or may be limited to one or more
    virtual domains. Virtual domains are by of using a single server to serve content
    for more than one domain name at a time. As noted previously, these names must
    be registered. You can find more information about hosting virtual domains on
    an Apache server at www.olamp.com/pub/a/apache/2003/07/24/vhosts.html.


    If you just want to test Apache and not actually set up a domain, you can identify
    its server by IP number instead of by domain name. A URL such http://192.168.0.111
    is perfectly valid.


    # Configuration directives


    The default configuration file included with Apache contains most of the directives
    that you need to get a server set up, with some reasonable default values for
    certain parameters. The rest of this chapter looks at certain sections of the
    file that you either definitely need to change (or complete), or that you might
    need to make a decision about.


    Before you start editing the main configuration file, make a backup. You can do
    this simply by giving the command cp httpd.conf httpd.conf.backup. This way, if
    you make a mistake and can''t figure out how to undo it, you can simply delete
    the file and use the backup to create a new default file. (If that happens, be
    sure to make a new backup before editing the original backup.)


    # SERVERROOT


    The ServerRoot directive defines the place where Apache looks for its configuration
    files. The relevant section of the httpd.conf file looks like this:


    ```

    # ServerRoot: The top of the directory tree under which the server''s

    # configuration, error, and log files are kept.

    #

    # NOTE! If you intend to place this on an NFS (or otherwise network)

    # mounted filesystem please read the LockFile documentation

    # (available at <URL:http://httpd.apache.org/docs

    # 2.0/mod_mp_common.html#lockfile>

    ```'
  merge: -1
  pgno: 391
- img_proc: true
  md: '# 368 PC Magazine — Linux Solutions


    # you will save yourself a lot of trouble.

    #

    # Do NOT add a slash at the end of the directory path.

    #

    ServerRoot "/etc/httpd"


    By default, the ServerRoot should be set to a directory such as /etc/httpd, /etc/apache,
    or wherever you found the configuration file you''re working on. Unless you have
    a compelling reason to do so, you should probably leave this directive alone.


    # Note


    As with shell programs, lines preceded by a hash mark (#) are comments. The server
    ignores these. If you see a directive line commented out, as


    ```

    #ServerRoot

    ```


    and need to set this directive, remember to remove the hash mark so that the server
    will recognize the directive.


    # LISTEN


    The Listen directive allows you to bind Apache to a particular network address
    or port. By default, Apache listens on port 80, but many people bind it to nonstandard
    ports when testing new Web Sites. (Port 8080 is common for this purpose.) The
    relevant section looks like this:


    +   # Listen: Allows you to bind Apache to specific IP addresses and/or

    # ports, in addition to the default. See also the <VirtualHost>

    # directive.

    # Change this to Listen on specific IP addresses as shown below to

    # prevent Apache from glomming onto all bind IP addresses (0.0.0.0)

    #Listen12.34.56.78:80

    #Listen 192.168.0.1:80


    To bind to a nonstandard port, simply change the value to something else. Remember
    to change it back to port 80 when you''re ready to take your site live, as people
    will not know to use the nonstandard port when looking for your site. Check your
    /etc/services file to make sure that you''re not using a port that''s already
    in use.'
  merge: -1
  pgno: 392
- img_proc: true
  md: '# Chapter 21: Web Server Solutions 369


    # Tip


    When using a nonstandard port for testing, you need to include the port number
    in the site''s URL when opening the site in a browser. For example, if you''re
    working on the site mydomain.com and using port 8080 for testing, you''d enter
    the URL as http://mydomain.com:8080 in your browser''s location bar. If you leave
    off :8080, the browser sends its request to port 80.


    # USER AND GROUP


    The User and Group directives are used to specify under which user and group Apache
    will run. This is an important security consideration because if a hacker were
    to gain control of the Apache program, it might be possible to damage Apache to
    run under a privileged ID. Typically, Apache will run as apache or http. You will
    not want to change this unless you have a good reason.


    ```

    # If you wish httpd to run as a different user or group, you must run

    # httpd as root initially and it will switch.

    # User/Group: The name (or #number) of the user/group to run httpd as.

    # On SCO (ODT 3) use "User nouser" and "Group nogroup".n# On HPUX you may not
    be able to use shared memory as nobody, and the

    # suggested workaround is to create a user www and use that user.

    # NOTE that some kernels refuse to setgid(Group) and cmctl(IPC_SET)

    # when the value of (unsigned)Group is above 60000:

    # don''t use Group #-1 on these systems!

    ```


    User apache

    Group apache


    # SERVERADMIN


    The ServerAdmin directive specifies the e-mail address of the server''s administrator.
    You should change this directive to contain your e-mail address. This address
    appears on pages that the server generates, as error messages.


    ```

    # ServerAdmin: Your address, where problems with the server should be

    # e-mailed. This address appears on some server-generated pages, such

    # as error documents. e.g. admin@your-domain.com

    #

    ```


    ServerAdmin root@localhost

    ServerAdmin webmaster@example.com'
  merge: -1
  pgno: 393
- img_proc: true
  md: '# 370 PC Magazine — Linux Solutions


    # SERVERNAME


    The ServerName directive sets the domain name for the server. Despite the fact
    that this can be automatically, it''s a good idea to set it manually here, as
    well. If you don''t have a registered domain name for your site, use the machine''s
    IP number here. You''re also setting the port here, make sure this agrees with
    the port you use in the Listen directive.


    ```

    # ServerName gives the name and port that the server uses to identify itself.

    # This often can be determined automatically, but we recommend you specify

    # it explicitly to prevent problems during startup.


    # If this is not set to valid DNS name for your host, server-generated

    # redirections will not work. See also the CanonicalName directive.


    # If your host doesn''t have a registered DNS name, enter its IP address here.

    # You will be to access it by its address anyway, and this will make

    # redirections work in a sensible way.


    #ServerName new.host:80

    ServerName www.example.com:80

    ```


    # DOCUMENTROOT


    The DocumentRoot is a very important document. DocumentRoot specifies where you
    will put your HTML documents so that they can be served by browsers that connect
    to the server. The directory specified in this directive should have been created
    when you installed the Apache package. You can change this directory if you want
    to, unless the specific location of your HTML files is important to you, it''s
    probably best to leave it where is. When you create HTML files, you should place
    them in this directory. You can create subdirectories within this directory, and
    you should be able to access them as well.


    For example, if your DocumentRoot is set to /var/www/html, and you have created
    the file /var/www/html/example.html, you should be able to access it as http://mydomain.com/example/example.html.
    If you create the subdirectory and move example.html into that directory, you
    should be able to access it as http://mydomain.com/subdir/example.html.


    ```

    # DocumentRoot: The directory out of which you will serve your

    # documents. By default, all requests are taken from this directory, but

    # symbolic links and aliases may be used to point to other locations.


    DocumentRoot "/var/www/html"

    ```


    # Note


    Any other directory referred to in this file is interpreted as being relative
    to the document root. In other words, if you refer to a directory elsewhere, say
    /subdir, it will be interpreted as /var/www/html/subdir.'
