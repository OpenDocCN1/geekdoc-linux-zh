    # # Summary


    Today''s Linux systems do a good job of identifying and configuring your system''s
    hardware when you first install a Linux distribution. The days of having to be
    a computer nerd to configure and use Linux systems are long gone. Linux systems
    also provide dynamic mechanisms for detecting newly attached hardware that are
    every bit as powerful and friendly as those found on operating systems such as
    Microsoft Windows.


    Admittedly, this user-friendly hardware detection is relatively new to Linux systems.
    However, as shown in this chapter, the command-line-oriented roots of Linux mean
    that a large number of powerful tools are also available should you have problems
    with any of the hardware in your system. These can help you get more-detailed
    information about your system''s hardware to make the most of that hardware, can
    help you identify problems if they begin to occur, and (if you''re lucky) can
    enable you to resolve or address those problems before you lose data.'
