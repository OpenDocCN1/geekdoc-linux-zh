    # # Creating and Assigning Users to Groups


    While users represent the most basic level of organization, Linux has inherited
    from a secondary level—the group. If you create groups, the supervisor and can
    assign users to them. Groups can be secondary owners of files, and each file has
    a set of permissions to apply to the group that owns it, without giving access
    to the members of a specific group, without giving access to the system.


    As an example, imagine you are administering a Linux machine for a small company.
    You have some permissions to payroll matters, and the information contained in
    these files is sensitive. You could create a group payroll and make only those
    users who are responsible for payroll administration members of that group. You
    can assign the sensitive files to that group and give the access to them. (Incidentally,
    this applies to programs too. One of the forms of permission that you can grant
    is the right to execute — that is, run — a program.) This permission can also
    be assigned to a group, so that only the members of that group would have the
    ability to run a given program.


    In this section, you learn how to create groups, assign users to them, and assign
    files to particular groups. The next sections explain file permissions and how
    to grant various levels of access to users and groups.'
  merge: -1
  pgno: 239
- img_proc: true
  md: '# Creating groups


    Creating groups is not all different from creating users. In fact, on many Linux
    systems, you often do both at the same time. Many distributions are set up so
    anytime you create a user account, you create a group with the same name, and
    the user is assigned to that group. In other words, in addition to the user jack,
    there is also a group jack, and the user jack is automatically assigned to. You
    can, of course, create other groups and assign users to them as well. A user can
    be assigned to any number of groups.


    # CREATING GROUPS WITH THE TEXT METHOD


    Like users, creating groups can be done in either text mode or by graphical utilities.
    To create a group in text mode, you use the groupadd command. The groupadd command
    functions similarly to usermadd and requires you to add some additional information
    on the command line. A typical groupadd command might look like this:


    ```

    groupadd -g 1015 payroll

    ```


    This command creates a group called payroll with a group ID of 1015. If you leave
    out the -g option, it automatically assigns the group number. The number will
    be above 500 (0–500 are generally reserved for system groups) and one greater
    than the highest numbered group that already exists. You must, however, supply
    the name of the group.


    # CREATING GROUPS WITH GRAPHICAL METHODS


    To add a group using a graphical tool, you will generally use the same tool that
    you did to add a user. (Most graphical tools combine the user and group creation
    functions.) So, on Knoix, you would use KUaser.


    In the main KUaser screen, click the Groups tab to see a list of all groups currently
    on the system (Figure 13-4). Notice that there are several system groups (those
    with ID numbers below 500) and a few higher-numbered ones. (If you are running
    Knopp from the live CD, you will see several groups with ID numbers above 1000
    but no actual user groups.)


    ![](img/65ef52f6e9fc73ddc3051990377c4f5b_240_0.png)


    Figure 13-4: The KUaser Groups pane.'
  merge: -1
  pgno: 240
- img_proc: true
  md: '# Chapter 13: User and File Management Solutions 217


    To add a group, click the Add button that shows an icon of a computer and two
    faces. This opens the Group Properties dialog, shown in Figure 13-5.


    ![](img/65ef52f6e9fc73ddc3051990377c4f5b_241_0.png)


    Figure 13-5: The KUser Group Properties dialog.


    You can assign a group ID number either by hand or by using the default one to
    to, and you need to enter the name of the group; for example, name the group payroll.
    You can assign users to the group at this time or later, as explained in the following
    sections. After you''ve entered the group''s name and ID number, click OK, and
    the group is created.


    # Assigning users to groups


    After you''ve created your group, it is time to assign users to it. In the following
    example, you add the users jack and jenny to the payroll group.


    # ASSIGNING USERS TO GROUPS WITH THE TEXT METHOD


    To assign a user to a new group, you need to modify user''s profile on the system.
    You can do this using the usermod command. The usermod command works in almost
    exactly the same way as (with the same options) the usermadd command, so to assign
    jack to the payroll group, do this:


    ```

    usermod -G payroll jack

    ```


    The -G option (note that it is capital G) is used to specify additional groups
    to which the user others than the default group to which he is assigned. Jack''s
    default group is probably the jack group, which was created when you created his
    account. You need to do the same thing for Jenny:


    ```

    usermod -g payroll jenny

    ```


    Jack and Jenny are now members of the payroll group.'
  merge: -1
