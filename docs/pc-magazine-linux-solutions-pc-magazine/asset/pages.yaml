    # Copying an entire partition


    Sometimes it is useful to make an exact copy or image of an entire partition or
    an entire drive. (Windows administrators often call this process *ghosting* after
    Norton Ghost, a utility that performs a similar task on the Windows platform.)
    If you need to set up many identical PCs, having an image of a standard configuration
    and copying it to each new computer and making any final adjustments is faster
    and easier than going through the full installation process on each one.


    On Linux, you can use a utility *partimage* to make partition images. *partimage*
    is included in Knoppix but may not be included in other distributions. If it is
    not available in yours, you can download it from www.partimage.org/. partimage
    requires the partition it is copying to be out of use and unmounted before it
    can begin, so you should boot from a Knoppix CD first and run partimage from there.
    *partimage* skips blank areas of the partition and also performs compression where
    possible, as shown in Figure 14-6.'
