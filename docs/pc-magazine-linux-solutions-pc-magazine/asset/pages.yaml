    # EDITING THE CONFIGURATION FILE BY HAND


    Most people generally prefer not to edit configuration files by hand, but in the
    case of SAMBA, this may be the best route to take without using a graphical tool,
    editing the configuration file by hand is not as difficult as it is with other
    types of servers. This is because the designers of SAMBA went out of their way
    to create a configuration file syntax that is easy to read, and a set of configuration
    options that have logical, intuitive names. SAMBA comes with a well written manual
    page for the configuration file (Give the command man conf to see it.) Some distributions
    (not Fedora Core) include a default configuration file with detailed comments
    to get started.


    The SAMBA configuration file is usually located at /etc/samba/samb.conf. If you
    want to edit the existing file, you can open it in an editor. (Do this as the
    superuser if you want to be able to save your changes.) Alternatively, you can
    change the name of the existing file to something like /etc/samba/samb-old, and
    create a new one.


    # Note


    We haven''t talked about much text editors far, aside from mentioning them in
    Chapter 11. Text editors are somewhat like word processors in they allow you to
    highlight text, cut-and-paste, and perform similar tasks, but unlike word processors,
    they don''t format text. This is an important distinction because a word processor
    inserts formatting in the file that determine the way file displays, both on screen
    and on paper. A text editor does not do this. So it''s important for editing configuration
    files, you use a text editor such as Gedit or KWrite, and a word processor like
    LibreOffice.Writer.


    My favorite editor is nEdit. It ships on distributions but not others. It is not
    tied to either GNOME or KDE works well on both of them. If it''s not already on
    your system, you can download it at www.nedit.org. It is not necessary that you
    use nEdit; any text editor will do so. See Chapter 11 for information on other
    text editors, such as Gedit or Kedit.


    There are other editors that work only in text mode, such as vi and emacs. Using
    these requires you to learn a few commands and hotkey mappings. It''s worth taking
    the time to learn to use one or more of these (if only you never know when you
    might find yourself working on a machine without a GUI enabled), but that discussion
    of them is beyond the scope of this book.'
