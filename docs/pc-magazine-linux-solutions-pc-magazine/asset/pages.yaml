  md: '# Configuring Squid to start at boot


    Now that Squid is running, you should configure it to start at boot time, so that
    any time you reboot the machine it will start automatically.


    Give the command `system-config-services` or choose Desktop -> System Settings
    -> Server Settings. You are prompted for the superuser password. Once you give
    it, you should see the Service Configuration window.


    Notice that in the left-hand column, some of the services have check marks next
    to them. These are the services that are configured to start upon system boot.
    Find the entry for Squid (the services are listed in alphabetical order) and make
    sure they have check marks. Then click on the File menu and select Changes. You
    can exit the Service Configuration program.


    At this point, you are done. Squid is configured and running. Next, you can configure
    your clients to use the proxy for their Internet connections.


    # Note


    The `system-config-services` program is specific to Fedora Core (and other Red
    Hat products) and also depends on your running GUI on your server machine. If
    you are using Fedora Core, but you wish to accomplish the task from a shell prompt,
    use this:


    ```

    chkconfig --add squid

    ```


    If you are not using Fedora Core, the process may be a bit trickier. You will
    need to consult your system''s documentation and find out the procedure for starting
    services at boot time. Some distributions have a graphical tool for this. Such
    tools are often referred to as *runlevel editors* or *service configuration tools*.
    If your system has no such tool, you should be able to find information about
    the startup scripts that control it. You may need to edit one of these files and
    insert a line directing it to start the service.


    # Configuring Squid Clients


    Now that you have your proxy server configured, you need to configure your clients
    to use it. There are two ways to do this, and are somewhat dependent on the operating
    system. The easiest way to do this is by configuring your Web browser to use the
    proxy server. This is relatively simple, but the drawback to this approach is
    that if you''re using a program other than your Web browser (as an FTP client
    program, say), the proxy will not be used. The other way is to configure your
    proxy in the general network parameters. In this section, I cover configuring
    Web browsers, as well as general network configuration for Windows, Linux, and
    Macintosh clients.'
  merge: -1
  pgno: 435
