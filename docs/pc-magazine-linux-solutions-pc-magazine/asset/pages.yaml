    # Mounting and unmounting file systems


    Mounting a file system provides access to file system for users and applications.
    Mounting a file system is very easy. You simply use the mount command with the
    device and the mount point where the device should be mounted for access. The
    file system type is usually specified in the command. The mount command to mount
    a CD-ROM in your CD drive is issued as (iso9660 is the file system type of a CD-ROM):


    ```

    # mount -t iso9660 /dev/cdrom mnt

    ```


    You will receive the following response:


    ```

    mount: block /dev/cdrom is write-protected, mounting read-only

    ```


    Your CD-ROM is now available for you to use. You may mount it to as any other
    directory on your system.

    Unmounting a file system (or device) is used for system maintenance or to temporarily
    access to a file system for some reason. Unmounting a CD-ROM allows you to eject
    the CD in the drive. Otherwise, it will remain in the drive until the next reboot.
    It is very simple to unmount a mounted file system. To unmount the CD-ROM that
    you just mounted, use the unmount command specifying either the device or the
    mount point to unmount:


    ```

    # unmount /dev/cdrom or unmount mnt

    ```


    You may receive the following message if you have changed directory onto the CD-ROM:


    ```

    umount: /mnt: device is busy

    ```'
