    # Knoppix


    Knoppix (www.knoppix.com) is a Debian-based distribution, the primary focus of
    which is in creating a live Linux distribution. A live CD distribution is one
    where the user boots a computer from the CD, and the CD starts Linux and standard
    services, which enables the user to log in. Knoix includes a full KDE implementation—booting
    from CD also starts the X Window system and the KDE desktop environment. A live
    DVD is also available, which provides even more software than the live CD. This
    book includes the Knoix live CD so that you can experiment with Linux without
    having to modify your PC.


    Knoppix is typically run from CD but can also be installed and executed from hard
    disk, flash, or any other bootable media (sometimes without a bit of work). Knoppix
    is often used as a portable Linux toolkit it provides all of the standard Linux
    applications that you can use to repair an existing Linux system that won''t boot.
    You can use Knoppix to recover data or repair Windows systems by mounting FAT32
    or NTFS partitions and copying data from them (Linux still does not have a great
    open source for writing to NTFS partitions).


    Knoppix is designed as a live CD and therefore not suitable for long-term use
    on systems that need reboot. Because Knoppix doesn''t have a mechanism for storing
    its configuration information, you would have to remount partitions, reconfigure
    networking, and so, each time you boot from a CD. Also, it is usually delivered
    on CD or as a CD ISO image, Knoppix is not upgradable—you simply get the next
    release when it''s available.


    Knoppix is an amazing effort and a fantastic tool for showing what Linux is like
    without requiring that they install software, repairing their disks, or anything
    at all. It is a great advertisement for the power and flexibility of Linux, as
    well as a great way of showing off Knoppix itself.'
