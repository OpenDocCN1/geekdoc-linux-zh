    # RUNNING YUM


    The most basic operation with YUM is installing software. To install a software
    package, first, assume superuser powers, and then give the command


    ```

    yum install package

    ```


    where package is the name of the package you want to install. For example, if
    you want to install the cdcrecord package, the command would be


    ```

    yum install cdcrecord

    ```


    You don’t need to mess around the full file names as RPM since the YUM configuration
    files take care of that for you. When you give this command, YUM connects to the
    appropriate repository and downloads certain information about the package package.
    If that information includes dependencies, YUM asks you whether to download and
    install the prerequisite packages as well.'
