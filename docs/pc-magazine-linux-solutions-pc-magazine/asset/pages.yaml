  md: '# Chapter 11


    # Using the Terminal


    If you told some people that you were thinking about Linux, they may have warned
    you that you would need to learn a lot of arcane commands. Generally, the progress
    made on the various desktop environments has relieved users of the need to use
    text commands for most everyday tasks. Nevertheless, Linux''s command-line interface
    is still very much alive and kicking. For many people, the very idea of using
    text seems almost charmingly retro. We weren''t all happy to get rid of our DOS
    machines back in the early 90s? Certainly now we''ve reached the 21st century,
    if not actually talking to our computers like Captain Kirk, we should not be typing
    commands into them!


    The fact of the matter is historic: there are several very good reasons to keep
    the command-line interface around. One is the first interface that Unix had, and
    believe it or not, there are still a few programs coming back-in-the-day. If you
    want to use an old, old piece of software, you need a way to run it.


    But the CLI exists for reasons beyond the mere legacy. There are actually situations
    where a command-line interface makes more sense than a graphical one. One of the
    tenets of the Unix philosophy is to avoid captive user interfaces. This means
    that whenever possible, you want programs to be able to present a way by which
    they can be used by another program, rather than a human user. Obviously, another
    program can extend an arm from the screen and wiggle the mouse around. It''s got
    to be able to send commands in a way that is available to it. For many programs—even
    if their interface is graphical—have an alternative text-based interface. If you
    need to use a certain function of the program,(when you are a human user, or another
    program) can give you the command.


    A third reason to keep the CLI around is automation. Many Linux functions can
    be automated by the *cron* utility. This utility is an example of a program that
    uses others. If a program has a command-line interface, it can be run automatically
    using *cron*.


    Furthermore, the Unix command language is more than just a set of commands. It
    also comprises an actual programming language. Unix commands are entered by a
    shell, which is a command interpreter. In order to simplify invocation commands,
    the shell can also understand programming language commands such as if then constructs.
    Using these constructs, you can create programs to serve a variety of needs


    Finally, note that the shell syntax is very rich and complex. If you aren''t bore
    writing programs, you can still use the shell language to do things as redirecting
    program input and output (if you want, for example, to redirect the output of
    a program to a file, rather than to the screen) or to pipe the output of one command
    into another.'
  merge: -1
