  md: '# Chapter 13


    # User and File Management Solutions


    ![](img/65ef52f6e9fc73ddc3051990377c4f5b_231_0.png)


    Linux, like the Unix systems upon which it was based, was designed from the beginning
    to be a true multiuser user system. Unlike Windows and older versions of the Mac
    OS, Linux is designed to handle multiple users in a way that goes beyond a simple
    set of preferences or a profile. In fact, using any of the various remote login
    systems that exist, a Linux machine can be used (within the limits of what its
    hardware can handle of course), at the same time.


    This has several implications for a user who is unfamiliar with this system. Recall
    that when you first installed your Linux system, you created both a user account
    and a superuser (root) account. You must think of these accounts as separate entities.
    The system doesn''t know that the user may also be the root. You may find yourself
    experiencing a certain amount of frustration if you try to do "user things" with
    the root account, or "root things" with the susan account.


    Some of this frustration may be derived from the concept of ownership. Under Linux''s
    user management system, files are owned by a user—usually the creator. The owner
    decides to who can read, modify, or execute (that is, run) the file (if it is
    a program). One of the biggest pitfalls experienced by Linux users comes from
    attempting to use files to which they don''t have the appropriate permissions.


    Super users may also belong to one or more groups. Groups of users can be designated
    as owners of files, and permissions can be assigned based on group affiliation
    as well as individual identity. In this way, groups can share access to files,
    keeping out anyone who isn''t a member of the group.


    In this chapter, I take you through the process of creating new user accounts,
    creating groups, assigning users to groups, so that they may be kept private,
    shared, as you desire.


    # Understanding User and Superuser


    You were introduced to the concept of the superuser in Chapter 6. The superuser
    can access any file, run any program, create new users, and delete them from the
    system. For precisely this reason, you should not use the superuser account for
    day-to-day activities on the system, and this is why you were asked to create
    a user account when you installed your system.'
  merge: -1
  pgno: 231
- img_proc: true
  md: '# 208 PC Magazine — Linux Solutions


    Unlike the superuser, a regular user is limited in what she can do. This is something
    of a double-edged sword. You might think, "Why don''t I just use the superuser
    all the time? That way I can do anything I need to do without being limited."
    The answer is simple: With the limitations of a regular user also comes a limitation
    of the amount of damage you can do. Here''s an example. As the superuser, you
    can give this command:


    # Caution


    WARNING: Do not actually run this command! It will delete every file and directory
    on your system!


    ```

    rm -rf /*

    ```


    The rm command is used to delete files and directories. This command deletes every
    file and directory on your system. If you do this with the root account, you will
    completely decimate your system. As a regular user, you cannot do this because
    you wouldn''t have ownership of the critical system files, and the superuser would
    fail.

    Keeping superuser and regular user functions separate is a safety feature, and
    the marginal inconvenience of switching to the superuser account is a very small
    price to pay for safety.


    # The su command


    That inconvenientience is further reduced by the existence of the su command.
    The su command, introduced briefly in Chapter 6, allows you to switch accounts
    in midstream. For example, suppose you are logged in under your regular account—Susan—and
    you need to perform a superuser function. You can simply open a terminal and give
    the su command. You are then prompted for the superuser''s password. When you
    have entered it, you will be using the superuser account, and can perform whatever
    actions you want. When you''re done, simply give the exit command, and you will
    be back in your regular user account.

    If that''s still inconvenient for you, you can use the -c command to give a one-off
    command as the superuser. Suppose that you want to remove the file badfile, but
    you don''t have the appropriate permission. You could do this:


    ```

    su -c rm badfile

    ```


    This gives runs rm badfile as the superuser. You are prompted for the superuser''s
    password, but in this case, you will not be dropped into an interactive shell
    when you are used by itself.

    The way su works is that when a user successfully enters another account''s password,
    the prompt asks Linux to change the user ID to the new one and then starts a new
    shell and places him in it. The problem is that, by default, su gets that information
    from the user who is running rather than the user who is su-ed to. So if Susan
    is using the Korn shell (/bin/ksh) and leaves the new user at a BASH prompt,'
  merge: -1
  pgno: 232
- img_proc: true
  md: '# Chapter 13: User and File Management Solutions 209


    not a Korn prompt. Also, the new user won''t get the benefit of any customizations
    Susan have made to her login environment. (See Chapter 11 for more information
    on this.) That may be okay. But what if the complete experience of Susan is required?
    In this case, you would run su like this:


    ```

    $ su susan

    ```


    The - option tells su that you don''t want to start a new shell; you want to mimic
    a complete login sequence as if Susan were the keyboard typing in her herself
    password.

    If you want to change this with the - option, you have to make sure - appears
    at the end of the command options:


    ```

    $ su -c mail susan

    ```


    This would start a new login susan, immediately execute the mail program to read
    her e-mail, and when she exited her log out.

    One problem you run when using su -c is that it allows only one parameter. What
    happens if you try and use to remove a file /root/badfile


    ```

    $ su -c rm /root/badfile

    Unknown id: /root/badfile

    ```


    Oops! It thought /root/badfile was the name of a user you were trying to become.

    The workaround for this [sic] is to put the entire command that you are trying
    to run in quotation marks so it will be treated as one unit like so:


    ```

    $ su -c "rm /root/badfile"

    ```


    Much better!


    # “Visual” su


    With the increasing popularity of graphical user interfaces (GUIs), many distributors
    have created various graphical administration tools for their systems. A graphical
    tool that, for example, would allow you to create a new user account on your system
    is more convenient than a command-line program that does the same. Obviously,
    running a program requires superuser privileges, and most programs of this type
    will prompt you for the superuser''s password when you start them.


    These programs contain a built-in su command that takes effect when you start
    them. When you''ve successfully entered the superuser''s password, the program
    runs as if it were running directly from the superuser account. (If you are logged
    in as the superuser, you generally don''t have to enter the superuser''s password
    to use these sorts of programs.)'
  merge: -1
  pgno: 233
- img_proc: true
  md: '# sudo


    Some systems implement an alternative using su. The su command (pronounced soo
    doo) allows certain users the right to use superuser functions. For example, suppose
    you''re logged in as susan, and you want to remove badfile. You''d give the command
    like this:


    ```

    sudo rm badfile

    ```


    You are prompted for your password (not the supersers, but susan''s). At this
    point, the sudo program checks the file /etc/sudoers, and if susan is listed in
    that file, it executes the command.

    su and sudo are not exclusive. It is possible for a system to have both commands
    on, but as a matter of good practice, it''s probably best to choose one or the
    other.


    # Switching groups


    There comparatively fewer reasons to change your group than your user identity,
    but if you choose to switch groups, the su command has counterparts in the newgroup
    and sg commands. newgroup allows you to change your primary group to one of the
    others you belong to. You can test this with the id command:


    ```

    $ id -gn

    knoppix

    $ newgroup users

    $ id -gn

    users

    $ exit

    exit

    $ id -gn

    knoppix

    ```


    Using newgroup puts you into a new shell where your default group is the one you
    specified. Of order to make it your default. When you want to revert to your former
    identity, type exit to close the shell. The default invocation of su, newgroup
    spawns a new shell. Also, like su, newgroup has a - option to get a full login
    experience in the new shell.


    sg gets pretty much the same as newgroup, but it has one extra feature that can
    be useful: a -c option (as with su) when you want to change groups for one command.
    For example:


    ```

    $ sg shadow "cat /etc/shadow"

    ```


    This lets you out the contents of the shadow password file if you are a member
    of group shadow. (And you shouldn''t be. It''s a huge security risk to let anyone
    except a few programs have access to the /etc/shadow file.)'
  merge: -1
  pgno: 234
- img_proc: true
  md: '# Chapter 13: User and File Management Solutions


    # Creating New User Accounts


    There are several methods by which you can create new user accounts, and to a
    certain extent, how it''s done will depend on the distribution you use. Almost
    all distributions have a text-mode called `adduser` or `aduser` that will allow
    you to add a user from the terminal. In addition, many systems have graphical
    programs that will allow you to add a user. It is the graphical programs that
    are likely to differ from distribution

    You will need some basic information to set up an account:


    +   - The new user''s username, that is, the name under which he or she will log
    in

    - The new user''s full name

    - An initial password for the new user

    - The shell that you would like the new user to have as his default

    - The location of the new user''s numeric ID


    These all pieces of information are optional. For example, the shell, home directory,
    and numeric ID are default values if you do not specify them. Generally, you would
    specify a numeric ID only if you had a specific reason to do so. For example,
    if you were moving a user''s account from another machine, you might want to make
    sure they have the same ID number on the new machine. For the first part, though,
    you can let the machine assign IDs.


    # Note


    As a rule, it''s best to use numeric ID numbers above 500. Numbers below 500 are
    generally reserved for system-specific functions. The superuser, for example,
    is always user number 0. Many programs need-ID numbers to function, and these
    are generally numbers below 500. `adduser` starts assigning ID numbers with 501.


    # Using text mode


    Creating user accounts may be one area of Linux administration where text mode
    really isn''t any more difficult than using a GUI tool. Using `adduser` or `aduser`
    utilities, you can create accounts quickly and simply. (Most systems have one
    of these utilities. They function virtually identically, and on many systems,
    the same utility will go by both names. For example, on Fedora Core, typing the
    command `man aduser` brings up the manual page for `adduser.) For practical purposes,
    you can consider them identical. This chapter uses `adduser` for the examples.'
  merge: -1
  pgno: 235
- img_proc: true
  md: '# 212 PC Magazine — Linux Solutions


    The useradd command takes a number of options as arguments. Each option corresponds
    to a piece of information about the new user. Imagine that you want to create
    a new user with the name harry. You want this to have UID 552, to have /bin/bash
    as his default shell, to have /home/harry as his home directory, and to have tempass
    as his initial password. You give him the command in this format:


    ```

    useradd -u 552 -s /bin/bash -d /home/harry tempass harry

    ```


    Note that the options between the command name and the target, which in this case
    is the login name that you want to give the new account. Table 13-1 shows a list
    of common options that useradd takes.


    | Option | Meaning |

    |---|---|

    | -u | Numeric user ID |

    | -g | Numeric default group ID |

    | -G | One or more additional groups to which the user may use |

    | -d | Home directory |

    | -s | Default shell |

    | -c | Comment (can be used to user''s real name) |

    | -e | Expire date (if the account should expire on a certain date) |


    # NUMERIC IDENTIFIERS


    Recall from Chapter 3 that every user on a Linux system has a unique ID number.
    Typically, these numbers are assigned sequentially, but as you see from the preceding
    example, they can also be assigned by hand. The same holds true for groups. (Groups
    are discussed in more detail later in this chapter.) You can think of these ID
    numbers as the real unique token of a particular user''s identity, the login name
    that user has is a convenience, since humans respond better to names than to numbers.


    # THE SKELETON DIRECTORY


    Sometimes, you may find it to put a standard set of files in the user''s home
    directory when it is created. This can be done automatically using a skeleton
    directory. This directory contains the basic set of files, and these files are
    copied to a new user''s home directory when it is created. Here''s a listing of
    a typical skeleton directory:


    ```

    [joe@hamachi ~]$ ls -a /etc/skel

    .. .bash_logout .bash_profile .bashrc .emacs .gtrc .kde .zshrc

    ```'
  merge: -1
  pgno: 236
- img_proc: true
  md: '# Chapter 13: User and File Management Solutions 213


    Typically, the skeleton directory is located at /etc/skel, but it may vary from
    system to system. The user can also specify a nonstandard skeleton directory by
    using useradd -k option.


    # Using graphical tools


    If graphical tools appeal to you more command-line utilities, you''ll have to
    dose investigate what your particular distribution offers. Most of the major distributions
    sport graphical user management tools, and they''re generally easy to find. On
    Knoppix, for example, the user administration tool is found by going to Start
    and choosing Main → User → KUser (User Manager). This brings you the main KDE
    User Manager, as shown in Figure 13-1.


    ![](img/65ef52f6e9fc73ddc3051990377c4f5b_237_0.png)


    | UID | User Login | Name | Home Directory | Login Shell |

