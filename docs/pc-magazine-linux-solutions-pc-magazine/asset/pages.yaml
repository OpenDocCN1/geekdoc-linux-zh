    \ current date. (By using the %b and %d options, you specify that you want the\
    \ date in month/day format.) By enclosing the command in parentheses and preceding\
    \ that expression with a dollar sign, you tell the shell that you want to use\
    \ the output of that command as the value for the variable. The importance of\
    \ this will become clearly short.\n\nNote that in this case, not only do you include\
    \ a comment describing what the section does, you also have a comment on each\
    \ variable assignment. (You can begin a comment in the middle of a line — everything\
    \ to the right of the hash mask will be considered the comment.) Some people might\
    \ consider this overkill, but I find it helpful.\n\n# THE ACTION\n\nNow that you've\
    \ done the preparation, you're ready to move on to the action part of the program.\
    \ This is the part where you give commands to the system:\n\n```\n# Do the backup\n\
    \nif [ -d $REPOSITORY ] && [ -s $REPOSITORY ]\nthen\n    tar czf $REPOSITORY/$DATE.tgz\
    \ $BACKUP_DIR\n    echo \"Backup for $DATE done\"\nelse\n    echo \"Couldn't find\
    \ repository directory\"\n\n```\n\nThere's a lot of stuff packed into this stanza,\
    \ so let's take things piece by piece. The first thing to notice is the word if\
    \ it is a flow control construct. Flow control constructs allow programs to make\
    \ decisions about how they execute themselves. The if statement alerts the system\
    \ that there is a condition coming up and all the code that is enclosed within\
    \ the if and the word fi (which is just if spelled backwards) will only execute\
    \ if that condition is met.\n\nThe if/fi construct. The section specifies that\
    \ the enclosed code will be executed if the condition in the statement is met,\
    \ and the else parts. then and else are actually parts of the if/else construct.\
    \ The section specifies alternate code that will be executed if the condition\
    \ is not met. You can look at the entire construct like this:\n\n```\nif [ a condition\
    \ is met ]\n\nthen\n    something happens\nelse\n    something different happens\n\
    fi\n```"
  merge: -1
  pgno: 202
- img_proc: true
  md: "# Chapter 11: Using the Terminal\n\n# Note\n\nYou must leave spaces between\
    \ the brackets and the text enclose.\n\nNotice that the sections are subordinate\
    \ to the if, then, and else statements indented. This is done to make it obvious\
    \ which statements are \"inside\" other statements. In most, if not all, programming\
    \ languages, it is possible to have multiple constructs inside one another. A\
    \ structure such as\n\n```\nif [ condition ]\nthen\n    command\n    command\n\
    \    if [ condition ]\n        then\n            command\nfi\n```\n\nis not only\
    \ but quite common. The indentation makes clear which section is subordinate to\
    \ which. You only align the left-hand side vertically, and the structure becomes\
    \ evident. Note that also an else section is not required.\nNow you have a handle\
    \ on the construct, turn your attention to some of the other features Looking\
    \ more closely at the if statement, you see that there are two expressions inside\
    \ square brackets. In the BASH shell, square brackets serve a special purpose.\
    \ They are syntactically equal to the test command. The test command is a program\
    \ that is used to evaluate conditions. The statement\n\n```\nif [ -d $REPOSITORY\
    \ ] && [ -s $REPOSITORY ]\n```\n\ncould be rewritten as\n\n```\nif [ test -d $REPOSITORY\
    \ ] && [ test -s $REPOSITORY ]\n```\n\nThe test command feeds a value back to\
    \ the if statement depending on whether the result of the test is true or false.\
    \ The first of these test statements has a -d option. This is used to instruct\
    \ test to ask if the targeted—in case, the value of the REPOSITORY variable—is\
    \ a directory. (By preceding the name of the variable —REPOSITORY — with a dollar\
    \ sign —REPOSITORY, you tell the shell that you want to look at the variable's\
    \ value.)\nIn second test statement, the -s option tests whether the REPOSITORY\
    \ directory has a size greater than zero. If the size of directory is zero, you\
    \ may have a problem. (The directory's name might exist, but there might not be\
    \ a file system accurately mounted.)"
  merge: -1
  pgno: 203
- img_proc: true
  md: '# 180 PC Magazine — Linux Solutions


    Between the two statements is the symbol &&. This is a logical and operator. This
    means that in order for the if statement''s condition to be evaluated, both statements
    must be true. In other words, the REPOSITORY directory must both exist and have
    a size greater than zero for the entire expression to be considered. There is
    also a logical or (|) that would evaluate as true if either test (not necessarily
    both) were to evaluate as.


    Assuming that both statements are true, the if statement executes the code that
    is directly beneath the then statement, so let''s look at code:


    ```

    then

    tar czf /$DATE.tgz /$BACKUP_DIR

    echo "Backup to $DATE done."

    ```


    The first command is an invocation of the tar program. Unfortunately, the command
    has a strange syntax; czf is a set of three options. tar does not use a dash to
    precede options. Also, the usual positions of source and target are reversed.
    As written above, the command will create an archive $DATE.tgz in the REPOSITORY
    directory: the archive will be composed of all the files, directories, and subdirectories
    within the BACKUP_DIR directory. The c option directs tar to create the archive.
    The f option allows you to specify the archive''s name, and the z option directs
    tar to compress the archive using the gzip program.


    The second command uses the echo function to print a message to the screen telling
    you that the backup has been done.


    Should either of the tests given in the if statement fail (that is, return a value
    of false), the construct executes the code directly beneath the else statement:


    ```

    else

    echo "Couldn''t find repository directory"

    ```


    This simply prints a warning to the screen that the REPOSITORY directory could
    not be found. The program will then exit without taking any action.


    And there you have it. Obviously, this is very simple, and this section merely
    intended to give you a taste of the kinds of things that are possible using the
    shell. There are many more commands and other types of flow constructs.


    If you are interested in learning more about shell programming, many fine books
    have been written on the subject. Try Beginning Scripting by Eric Foster-Johnson
    (Wrox, 2005) as a start. While many commands are the same from shell, some of
    the programming constructs — or at least the precise form of syntax for them —
    can vary quite a bit. I recommend you decide on a shell first and then look into
    its programming features.'
  merge: -1
