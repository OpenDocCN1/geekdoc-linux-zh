    uncheck the Active on Boot box and click Edit. The Edit Interface eth0 dialog
    box shown in Figure 7-3 appears for you to fill in your network configuration
    numbers.


    # Note


    If there are no Windows computers (or network administrator) on your network from
    which to gather and compare network settings, use the automatic settings shown
    in Figure 7-3.'
