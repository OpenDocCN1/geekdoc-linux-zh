    -rw-r--r-- 1 root smpps 12288 Aug 7 14:22 aliases.db

    drwxr-xr-x 4 root root 4096 May 9 12:18 alsa

    drwxr-xr-x 2 root root 4096 May 9 14:59 alternatives

    -rw-r--r-- 1 root root 329 Sep 28 2004 anracontab

    -rw-r--r-- 1 root root 5297 Aug 7 14:17 asound.state

    -rw-r--r-- 1 root root 1 Oct 5 2004 at.den

    -rw-r--r-- 1 root root 325 Oct 15 2004 auto.master

    -rw-r--r-- 1 root root 581 Oct 15 2004 auto.misc

    drwxr-xr-x 1 root root 1057 Oct 15 2004 auto.net

    drwxr-xr-x 1 root root 1182 Sep 23 2004 bashrc

    -rw-r--r-- 1 root root 350 May 9 13:08 blkid.tab

    drwxr-xr-x 2 root root 4096 May 9 12:12 bluetooth

    drwxr-xr-x 2 root root 4096 May 9 12:18 bonobo-activation

    -rw-r--r-- 1 root root 976 Oct 18 2004 cdrecordf.conf

    drwxr-xr-x 2 root root 4096 May 9 13:13 ciple

    ```


    (This is only the first part of the listing.) On most Linux systems there are
    many more entries in the /etc directory.


    In the first column on the left-hand side, you see a series of characters. This
    gives you a good deal of information about the file, including its permission
    status. The first character on the left tells you the type of file. For most purposes,
    it will be a dash (-) indicating a normal file, or a d indicating a directory.
    With the second character, you see the permissions. Characters two, three, and
    four indicate read, write, and execute permissions for the user. If you see an
    r in the second space, that means the user has read permission. If you see a dash,
    it means the user does not have read permission. Likewise, a w indicates write
    permission, and will be found in the third space, and an x indicates execute permission,
    and will be found in the fourth space.


    The next three spaces—five, six, and seven—correspond to read, write, and execute
    permission for the group, and spaces eight, nine, and ten correspond to read,
    write, and execute permission for all users. Consider this:


    ```

    -rwxr-xr-x 1 root root 1057 Oct 15 2004 auto.net

    ```'
