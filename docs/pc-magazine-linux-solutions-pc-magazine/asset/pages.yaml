  md: '# E-mail setup


    Both e-mail programs (and most others) have wizards that make the process of setting
    them up easy. The wizard asks for several bits of information:


    +   - **Your name**

    - **Your incoming mail server type:** There are two main protocols used to receive
    mail: Post Office version 3 (POP3) and Interactive Mail Access Protocol (IMAP).

    - **Your incoming mail server address:** The host name or IP address of your POP3
    or IMAP server. This will typically be something like `pop3.example.com`.

    - **Your outgoing mail server address:** The host name or IP address of your Simple
    Mail Transfer Protocol (SMTP). This is where mail actually gets sent to the Internet.
    Typically, it will be something like `mail.example.com`.

    - **Your username on mail servers:** This is the first part of your e-mail address.
    If your email is `linuxfan@example.com`, your username would be `linuxfan`. But
    you might have a different username for the mail server, or you might have different
    names for the incoming and outgoing servers.

    - **Your password on the mail servers:** With your username, you have the same
    password for incoming and outgoing or different ones. Each of these programs give
    you the option of storing and automatically entering the password as needed, saves
    some typing but leaves you at the risk of other people being able to access your
    mail if they get hold of your computer.

    - **Mail server encryption type:** Usually conversations between your e-mail software
    and the server occur in plain text. It is possible for a hacker to eavesdrop on,
    so some servers use Secure Socket Layer (SSL) or Transport Layer Security (TLS)
    to encrypt communications. In this case, you must instruct your e-mail software
    to use the same protocol. Both Evolution and Thunderbird support SSL and TLS.


    Additional features might require more information, but this is the minimum you
    need to set up an e-mail account. If you don''t have this information, or are
    unsure about it, you should be able to get it from your ISP or from your system
    or network administrator.


    # Evolution


    Evolution is the default e-mail client on Fedora Core, and it''s a good choice.
    Evolution was originally a product of the Ximian Corporation, which was the brainchild
    of Miguel De Icaza, Evolution was eventually acquired by Novell, and much of their
    work has been incorporated into Linux distribution. Individual components, however,
    run on a standalone basis and are available as free software.


    Evolution is more than just an e-mail client. It has calendar functions, as well
    as to-do list, a contact management system (sort of an address book on steroids),
    and synchronizes with a personal digital assistant (PDA). This section, however,
    focuses on its e-mail functions.'
