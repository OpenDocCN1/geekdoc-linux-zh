    The question of how you want to boot Linux largely depends on how you plan to
    use it. Standalone refers to computers where Linux is the only bootable system
    that is installed. Converting one of your systems into a standalone Linux system
    requires a certain level of commitment to Linux because you cannot run other operating
    systems (though you can still run much Microsoft Windows software through open
    source projects such as WINE, wine.com).


    If you need the ability to run Windows softly (that is, by booting Windows), you
    can install Linux on one or more spare partitions and configure your system so
    that it gives you the'
