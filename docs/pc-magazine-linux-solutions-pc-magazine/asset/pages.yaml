    # Special-Purpose Distributions


    As mentioned in Chapter 1, there were over 300 active Linux distributions available
    at the time this book was written. This chapter highlights the most popular desktop-oriented
    Linux distributions, but there are many more. See distrowatch.com for a complete
    list as well as some introductory information about and pointers to where you
    can download or obtain these other distributions.


    But why are so many Linux distributions? There are only a handful of versions
    for Microsoft Windows and only one version for Mac OS X. While the number of Linux
    distributions can be bewildering, the reasons for their existence are not—that''s
    the power of open source. Just as all the Linux distributions discussed in this
    chapter got their start in someone''s vision of what a Linux distribution should
    contain and how it could be managed, all of these Linux distributions reflect
    someone else''s notion of what''s best in certain circumstances.


    The explosive growth in the number of Linux distributions that has available partly
    because of the ease with which anyone can download the Linux source and build
    their own distribution. The most significant reason why people want to do this
    is they want to create custom Linux distributions tailored for specific purposes.
    Many people have created Linux-rescue discs, which are bootable CD or floppy disk
    images that can repair failed Linux (and Windows) systems. Many other people have
    wanted to create special-purpose Linux distributions tailored towards specific
    markets or groups of users. One common target for these other Linux distributions
    is laptop computers or the users of older computer systems, whose systems typically
    have less memory and disk space than today''s computers. Some Linux distributions
    focus on providing alternative graphical environments, X Window system managers,
    and so on. We focus on portability; as one of my favorites, the LNB-BBC distribution
    (linux-bbc.org), which is a Mini-Linux that is small enough to fit on a CD-ROM
    that has been cut, pressed, or molded to the size and shape of a business card.
    Membership cards for the Free Software Foundation are actually bootable LNB-BBC
    CDs, which lets you show your loyalty to the open community and run Linux on just
    anything at the same time. The BBC in its name stands for business card.


    Aside from Distro Watch, Ben Gross at //benross.com/smalllinux.html is an excellent
    source of information about small-footprint Linux distributions. The Frozen Web
    Site (www.frozentech.com/content/lived.php) is an excellent source for living
    Linux CDs, as well as the images for many Linux distributions.


