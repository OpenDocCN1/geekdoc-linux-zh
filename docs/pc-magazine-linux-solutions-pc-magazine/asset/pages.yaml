- img_proc: true
  md: '# ASSIGNING USERS TO GROUPS WITH GRAPHICAL METHODS


    Group assignment is one area where graphical methods are arguably easier—or at
    least straightforward—than text methods.


    Under Knoppix, with the KUser Group Properties window open as Figure 13-5, you
    can see a list of users along the right-hand side. Click on the name of a user
    that you want to add to the group, and click the button marked Add. That user
    will be shown in the pane on the left-hand side of the window. Repeat the process
    for any other users that you want to add to the group, and click OK. The users
    are added to the group.


    # Note


    You can add users to a group at the time you create the group or at any subsequent
    time. To add users to an already existing group, open KUser from the main window,
    click to highlight the group you want to edit, and click the button marked Edit,
    which shows the group icon (the computer with two faces). This opens the Group
    Properties window, showing your selected.


    # Setting File Permissions


    Now that you understand the basic principles underlying user and group identity,
    turn your attention to the topic of file ownership and permission. There are basic
    classes of permissions and three types of permission in each class, making nine
    permissions in all. The permission classes are user, group, and all, and the permission
    types are read, write, and execute. Table 13-2 shows what those permissions mean.


    | Table 13-2 File Permission Types |

    | --- | --- |

    | Permission | Meaning |

    | **User** | |

    | Read | The user can view the contents of the file. |

    | Write | The user can modify the contents of the file. |

    | Execute | The file is a program and the user can run it. |

    | **Group** | |

    | Read | Any member of the group can view the contents of the file. |

    | Write | Any member of the group can modify the contents of the file. |

    | Execute | The file is a program and any member of the group can run it. |

    | **All** | |

    | Read | Any user on the system can view the contents of the file. |

    | Write | Any user on the system can modify the contents of the file. |

    | Execute | The file is a program and any user on the system can run it. |'
  merge: -1
  pgno: 242
- img_proc: true
  md: '# Chapter 13: User and File Management Solutions 219


    A file can have any combination of these permissions. For example, there may be
    a file on the system that is readable by any user on the system, writable only
    by the owner, and executable by the payroll group. Such a file would have permissions
    User: read, write, and execute; Group: read and execute; All: read.


    # Note


    Setting permissions on a directory is almost the same as file permissions, but
    the system works slightly differently. For a directory, having read permission
    means that you can list the directory''s contents. In other words, if you give
    the ls command for a directory that you do not read permission on, you will get
    an error message. write permission for a directory means you can change the contents
    of a directory; that is, you can add files or remove files from that. execute
    permission means that you can use permission as your current working directory;
    that is, you can execute a cd command and enter that directory.


