  md: '# Chapter 18: File Sharing Solutions 303


    Now you can create your configuration file. As you can see in Figure 18-7, the
    smb.conf file is organized into sections with each section denoted by a keyword
    in square brackets, such as [global]. A section continues until another bracketed
    keyword is reached. Within each section are a number of parameters that take the
    form


    ```

    name = value

    ```


    where name is the name of the parameter and value is the setting that you want
    that parameter to. For example, if you set a share''s permission to read/write,
    you set the parameter in this way:


    ```

    writable = yes

    ```


    # Global Settings


    The first section in your configuration file should be the [global] section. In
    this section, you can define options that will be in effect for all shares being
    served by the SAMBA server. You can also define options that do not apply to any
    particular share but are relevant to the operation of the server itself. Here
    is a sample:


    ```

    [global]

    workgroup = test group

    security = share

    server string = Samba Server

    ```


    The global code defines three parameters, and they are exactly equal to the options
    you set using the Server Settings window in Fedora''s system-config-samba utility.
    In fact, system-config-samba does nothing more than write these options into the
    smb.conf file. Note that the lines underneath the section keyword are indented.
    As shell programming, this is done for readability. Visually scanning the file,
    it''s easy to see where new sections begin.


    # Share Settings


    Now that you have defined your global parameters, you can set up a share. The
    keyword for your share is the name you want it to have; in this case, samba-share.
    Give this share all the attributes you define for it using system-config-samba:


    ```

    [samba-share]

    comment = A Shared directory for demonstration

    path = /Samba

    writable = yes

    guest ok = yes

    ```


    And there it is. The Samba-share section together with the global section is all
    you need to set up the server in this way. Save the file, making sure that it
    has the path name /etc/samba/smb.conf.'
  merge: -1
