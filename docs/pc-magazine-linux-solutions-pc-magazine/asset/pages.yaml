  md: '# Chapter 6: Using Accounts


    Each line represents a user account and contains a number of fields separated
    by colons: The line that starts with knoppix is for a human user (you, the person
    using Knoppix). The other lines are for system user accounts.


    Take a look at one of those to see what the fields mean:


    ```

    knoppix:x:1000:1000:knoppix User:/home/knoppix:/bin/bash

    ```


    The first field, knoppix in this example, is the account name. When a user logs
    in or is sent mail or needs to be identified in any, this is the name. The account
    name used to be restricted to characters or fewer, but modern varieties of Linux
    no longer have that restriction. Still, accounts need to be short for no other
    reason than convenience in typing.

    The second field, x, is used to hold the user''s password. In fact, the presence
    of passwords means the user database file is called /etc/passwd. But nowadays,
    you''ll just find an x in this field. Being able to read /etc/passwd is essential
    for any program that converts UIDs to names, and a few programs need to know a
    user''s password. The passwords were encrypted, but it was too easy for malicious
    hackers to get passwords and attempt to crack them at their leisure. Now, passwords
    are kept in a separate file, /etc/shadow, which has more restricted access, whereas
    /etc/passwd remains available to all.

    The third field contains the UID (1000 in this example) which internally keeps
    track of users. System accounts by convention have UIDs under 1000 (or 500 on
    some distributions). Accounts created for people have UIDs in those numbers. There
    is one more, special UID, 0, whose significance is explained later.

    Users can also be organized into groups. Every user belongs to at least one group,
    and the fourth field is the name of the user''s primary group.


    The fifth field (knoppix User in this example) is known for historical reasons
    as the GECOS (the General Electric Operating System) field. It contains the account
    holder''s proper name or a description of what this field does in the case of
    system accounts. This field is also used to hold such information as office location,
    telephone number, and so on. If information is included, a comma is used to separate
    the fields.


    The sixth field (home/knoppix) is the account''s home directory. When the account
    logs in, this is the place where it starts. For daemons, the home directory is
    either the location of their public data or out-of-the-way directory where a break-in
    will not result in important files being created.

    The seventh and last field (/bin/bash) is the account''s shell. When the account
    logs, this program runs first. Most accounts use an interactive shell such as
    bash (Chapter 11), but any program can be the shell. This is useful for accounts
    that have a restricted purpose. For instance, if you want to give your friend
    access to a system so he can check his e-mail, but you don''t want him to have
    the full power and responsibility of a Linux account, you could make an account
    for him with an e-mail program as the shell. When he logs in, he would automatically
    be placed in the e-mail program. When he has finished checking his e-mail and
    exits the e-mail, he will automatically be logged out.


    # Groups


    You may want to give access to a particular system resource to only a subset of
    the users on the system. Take the example of a tape storage device: You might
    want to give more than one person the responsibility of backing up the system,
    but you don''t just anybody to be able to mess'
