    # # What Is Swap Space?


    I briefly mention swap space at the beginning of this chapter, where I state that
    the operating systems use part of disk space as extra memory. Microsoft Windows
    users will recognize a similar concept in the term pagefile. Windows uses a single
    file (or multiple files) for additional memory, and Linux/Unix uses a dedicated
    space on the hard drive for paging dormant processes and applications that can''t
    fit into RAM (standard memory). Generally, you want to set your swap partition
    to be twice as large as the amount of RAM you have. If you have 256MB of RAM,
    then your swap partition should be 512MB. Database and some application servers
    would be exceptions to this rule. There are complex algorithms—beyond the scope
    of this book—for computing the correct swap space for these applications. For
    most purposes, stick with the rule of twice the amount of RAM.


