    goes, for example the Web sites served by a Web server, this is also a prime time
    for frequent backups.


    +   /var: This directory is used for storing variable data, a mixed bag. Some
    subdirectories, such as /var/mail, where users'' incoming mailboxes are kept,
    or /var/log, where the system log files are kept, are definitely worth keeping;
    others as /var/run, which contains lock files for servers, are not. My advice
    is to keep things simple by just backing up everything in /var.


