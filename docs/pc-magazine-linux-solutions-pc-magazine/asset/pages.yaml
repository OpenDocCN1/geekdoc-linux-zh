  md: '# Chapter 18: File Sharing Solutions 319


    If you want to enable more than one machine to access a particular directory,
    you can list each machine separately, like so:


    ```

    /nfs 192.168.0.12(rw) 192.168.0.14(rw)

    ```


    Or you can specify a range of machines, like this:


    ```

    /nfs 192.168.0.0/255.255.255.0(rw)

    ```


    The second method allows access from any machine with an IP between 192.168.0.0
    and 192.168.0.127. (The second part of that address is a netmask, which modifies
    the address to the left of the slash. For more information about, see www.johnsloset.net/primer/subnet.html).


    # Setting up NFS clients


    There are two ways to access NFS shares from a client machine. The first way accesses
    the share temporarily. That is, the share is available until it is removed from
    the client or the client machine is turned off. If, you want to access the share
    again, you will need to go through the procedure again. The second way causes
    the client to access the server every time it is turned on.


    # TEMPORARY ACCESS


    Shares can be accessed temporarily using the mount command. To do this, you need
    to have a mount point (an empty directory) and you need to know the IP number
    of the server machine. So, first, create a mount point, for example:


    ```

    mkdir /mnt/nfs

    ```


    (You need to do this as root.) Also, make sure read/write permission is enabled
    for everyone:


    ```

    chmod a+rw /mnt/nfs

    ```


    Now that you have a mount point, you can mount the remote directory on the local
    file system, like so:


    ```

    mount 192.168.0.1:/mnt/nfs

    ```


    If, on the client, move into the /mnt/nfs directory, you can now see the contents
    of the /nfs directory on the server machine. The contents of the server''s exported
    directory behave exactly if they were on the client machine''s local drive.


    # PERMANENT ACCESS


    If wish to have the contents of a remote directory available every time you boot
    the client machine, you can configure the client machine to mount the remote directory
    automatically. You can do this by editing the /etc/fstab file on the client machine.'
  merge: -1
  pgno: 343
- img_proc: true
  md: '# 320 PC Magazine — Linux Solutions


    # Caution


    Editing the /etc/fstab file on the client machine, while not dangerous in itself,
    can lead to a problem: If the server machine is not available for any reason —
    for example, if it is down, or if it is off the network — it can cause the client
    machine to hang during boot-up. This is not a fatal problem, but the procedure
    will eventually time out, can slow down the client machine''s boot-up significantly.


    Editing /etc/fstab in a text editor. You should see that looks more or less like
    this:


    ```

    # This file is edited by fstab-sync — see ''man fstab-sync'' for details

    # /dev/VolGroup00/LogVol00 / ext3 defaults 1 1

    # LABEL=/boot /boot ext3 defaults 1 2

    # none /dev/pts devpts gid=5,mode=620 0 0

    # none /dev/shm tmpfs defaults 0 0

    # none /proc proc defaults 0 0

    # none /sys sysfs defaults 0 0

    ```


    Each line of /etc/fstab file represents part of the file system that is running
    on the machine. You may have more or fewer entries than you see, but they will
    all be in this general format. To add the file, add the line (again, anywhere
    in the file):


    ```

    192.168.0.1:/nfs /mnt/nfs nfs rw 0 0

    ```


    The first entry is the name (or IP number) of the server, and the path to the
    exported directory. The second entry is the mount point. The third is the file
    type (in this case nfs), and the fourth is any options that you want to pass to
    the mount program (in this case rw for read/write). The final entries are file
    system options, which for an NFS file system are 0 and 0. Save the file, and give
    the command


    ```

    mount -a

    ```


    This reminds out of the file systems listed in /etc/fstab, including the NFS system
    you just added. At this point you will be able to access the NFS share as you
    did in the previous section.


    # Summary


    Linux can share between Linux, Windows, and Macintosh using SAMBA, or between
    Linux and other Linux machines using NFS. A Linux machine running SAMBA and NFS
    can make a good, low-cost file server for a small- to medium-sized network.'
  merge: -1
