    # Firewall Configuration


    A firewall sits between your computer and the network, and determines resources
    on your computer remote users on the network are able to access. A properly configured
    firewall can greatly increase the out-of-the-box security of your system.


    A firewall can help prevent unauthorized access to your computer from the outside
    world. Would you like to enable a firewall?


    +   - No firewall

    - Enable firewall


    You can use a firewall to allow access to specific services on your computer from
    other computers. Which services, if any, do you like to allow access to ?


    +   - Remote Login (SSH)

    - Web Server (HTTP, HTTPS)

    - File Transfer (FTP)

    - Mail Server (SMTP)


    Choose the appropriate security level for your system.


    Security Enhanced Linux (SELinux) provides finer-grained security controls than
    those available in a traditional Linux system. It can be set up in a disabled
    state, a state which only warns about things which would be denied, or a fully
    active state.


    **No firewall — No firewall** provides complete access to your system and no security
    checking. Security checking is the disabling of access to certain services.


    Enable SELinux? Active


