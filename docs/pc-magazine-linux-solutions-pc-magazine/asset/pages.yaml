  md: '# Free Software


    Commercial software, produced by businesses with the goal of making a profit,
    is obviously important to anyone who uses an off-the-shelf computer system. There''s
    a tremendous amount of great commercial software available, enabling real people
    to get work done: writing documents, creating spreadsheets, sending and receiving
    e-mail, creating fantastic artwork, laying out complex books and advertisements,
    and much, much. However, most commercial software is closed source software, meaning
    that users cannot see the source code, fix problems, or extend its capabilities.
    Closed source software means users must attend sometimes. It does what its author
    writes to do—which is not necessarily the same thing that a user may want to do.
    If a user discovers the software does not meet his or her needs, the only recourse
    is to contact the vendor''s customer support personnel and hope they have enough
    the resources to fix the problem/or provide a new version.


    In comparison, free software, is freely distributed in the first place, is written
    by people who need a tool to share the package, or who are simply interested in
    that type of software and are savvy enough to use it. There are essentially two
    types of free software: software that makes executables but not the source code
    and software that makes both the executables and the source code. When I refer
    to free in this book, I''m referring to the latter, because it is the free software
    that underlies Linux, the GNU project, and thousands of other free packages that
    run on top of the Linux kernel.


    Earlier I mentioned that Linux and related utilities had a strong conceptual and
    philosophical component. Component is free software, which is based on the philosophy
    that no one should control your access to the source code of a program that you
    develop upon, then the possibility that you might find yourself in the position
    where you can''t get your work done because of a bug that you literally cant do
    anything about (regardless of your sophistication as a programmer). The Free Software
    Foundation''s Web page (www.fsf.org) explains this better than anyone:


    > Free software is a matter of liberty not price. You should think of it as "free
    in speech"


    Of course, because free software is free does not mean everyone has the skills
    to fix or enhance it. Free software guarantees us that whatever you want is always
    available. Another great thing about free software is that you can freely examine
    the source code for an application, you can understand the format in which it
    produces its outputs. Even if you encounter a problem with a piece of free software,
    the fact that its output formats are easily determined makes it possible for you
    to reuse and recover data in ways that no commercial software could possibly provide.


