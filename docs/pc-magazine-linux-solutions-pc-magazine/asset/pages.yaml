    discussing every nuance of configuring it is outside the scope of this book. For
    more information about GRUB, see a book on Linux system administration or see
    GRUB''s online documentation, which is available at www.gnu.org/software/grub/manual/html_node/.You
    must configure GRUB while running Linux if you want to make permanent changes,
    because the GRUB configuration file is located in the Linux/boot system.'
