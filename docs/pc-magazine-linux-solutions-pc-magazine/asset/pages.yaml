  md: '# Rolling Your Own


    Experienced system administrators prefer to compile their software packages from
    source code than using the precompiled binary packages that are available. In
    some cases, it''s a matter of old-school pride rather than practical considerations,
    but in other cases, there may be solid reasons for doing so. One of the most compelling
    reasons is that of security. Anytime you install a binary package, you''re placing
    your trust in the person or organization that issued the package. You have no
    way of knowing whether the packager has inserted any malicious code into the package.


    I talked about compiling from source code in Chapter 15, it''s worth mentioning
    to revisit the subject with specific attention to Squid. Compiling from source
    code is not difficult, but it does require some details not required when installing
    binary packages. As mentioned in Chapter 15, you must have a compiler (`gcc`)
    installed on your system with all of the libraries that Squid needs to use at
    compile. This is generally not a problem unless you''ve a minimal installation
    of Squid. On Fedora Core, for example, you may wish to run `system-config-packages`
    and make sure that you''ve got the development group installed.


    Once you have the tar, you can download the source code from www.squid.org. As
    of writing, the latest version of the source code comes in a package called `squid-2.5.STABLE10.tar.gz`.
    The .tar.gz suffix indicates that it is a compressed archive. Before you can compile
    it, you need to unpack the archive. First, give the `su` command to assume superuser
    privileges, and move the archive file into a directory, such as `/tmp`. At this
    point, you can unpack the archive with the command


    ```

    tar xvfz squid-2.5.STABLE10.tar.gz

    ```


    When the tar has finished its operation, you should have a new directory named
    `/tmp/squid-2.5.STABLE`. Move into this directory. You will find files named INSTALL
    and README. Read these files.


    At this point, you may have some choices to make. If you want to do a regular
    default installation of Squid, execute the following steps. If you want to customize
    your Squid installation, go to www.squid-cache.org and read the page `www.squid-cache.org/Doc/FAQ/FAQ-2.html`.
    This page explains the compile-time options.


    For a default installation, give these commands:


    ```

    ./configure --prefix=/usr/local/squid

    make all

    make install

    ```


    At this point, the Squid executable has been created and all of the auxiliary
    files have been placed where they should be. Note, however, the main configuration
    file will be located in `/usr/local/squid/sbin/squid` rather than in `/etc/squid/`.'
