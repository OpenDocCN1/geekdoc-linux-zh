  md: "# Accessing devices\n\nLinux systems access devices through what are known\
    \ as device nodes. Device nodes are special types of files that identify the device\
    \ driver that should be used to access each device and provide an entry point\
    \ for accessing device. Device nodes are stored in the /dev directory on any Linux\
    \ or Unix-like system. This directory can be listed using the ls command, like\
    \ any other directory on a Linux system, as shown in the following example:\n\n\
    ```\n$ ls - /dev\ntotal 161\ncrw--rw---- 1 root video 107, 0 2025-03-19 17:01\
    \ 3dfx\ncrw--rw---- 1 root root 107, 15 2025-03-19 17:01 ac\ncrw--rw---- 1 root\
    \ root 56, 0 2025-03-19 17:01 adb\ncrw--rw---- 1 root root 10, 0 2025-03-19 17:01\
    \ admbouse\ncrw--rw---- 1 vwh audio 14, 14 2025-03-19 17:01 addmidi00\ncrw--rw----\
    \ 1 vwh audio 14, 30 2025-03-19 17:01 addmidi11\ncrw--rw---- 1 vwh audio 14, 46\
    \ 2025-03-19 17:01 addmidi12\ncrw--rw---- 1 vwh audio 14, 62 2025-03-19 17:01\
    \ addmidi13\n```\n\n /dev directory on most desktop systems contains hundreds\
    \ of device nodes, each of which reflects a device that could possibly be attached\
    \ to that system. These files are small, but having hundreds of them still accounts\
    \ for some amount of disk space. Some Linux distributions, such as those used\
    \ in small Linux systems designed for embedded computing and consumer electronics,\
    \ create device dynamically when you boot the system, but most Linux distributions\
    \ preallocate all when you install Linux so they are already present if you ever\
