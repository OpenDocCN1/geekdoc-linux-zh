    the Desktop icon. This moves you to the directory /home/knoppix/Desktop. Next,
    right-click on the icon marked KNOPPIX,desktop, and from the pop-up menu that
    appears, select Properties. This brings up the Properties window as shown in Figure
    13-6.


    ![](img/65ef52f6e9fc73ddc3051990377c4f5b_243_0.png)


    Figure 13-6: The Konqueror file Properties window.'
