  md: '# Summary


    Despite their primitive appearance, text commands offer a degree of subtlety and
    flexibility that is simply not possible with graphical program interfaces. Text
    commands offer a greater number of command options, noninteractive use that enables
    them to be used by programs, and automated execution. Features such as input and
    output redirection allow commands to be combined in creative and powerful ways.
    There are a number of shells available for Linux systems, and each has its own
    features and its own unique flavor. Shells can be programmed, which allows complex
    actions to be aggregated into manageable (and automatable) pieces.'
