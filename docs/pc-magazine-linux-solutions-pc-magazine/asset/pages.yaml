  md: '# Deleting files from a tar archive


    The --delete option (with two dashes) to tar removes a file while keeping the
    rest of the archive intact.


    ```

    $ tar --delete -f etc.tar etc/passwd

    ```


    You cannot safely delete from an archive on a magnetic tape drive without first
    unpacking, the file, and replacing the archive. --delete does not work on an archive
    compressed with the -z, -j, or -Z option. Assuming /etc was backed up to a tape
    drive and you wanted to delete /etc/passwd from the archive, the full process
    would like this:


    ```

    $ tar xf /dev/tape /etc

    ```


    This extracts /etc from the tape into a subdirectory of the current directory
    called etc. Then the command


    ```

    $ rm etc/passwd

    ```


    deletes the file we no longer want and the command


    ```

    $ tar cf /dev/tape etc

    ```


    packs it all up again.


    # Refreshing or replacing files in a tar archive


    When you use the -u option to tar and a file name, the file is compared to the
    version in the existing archive (specified with -f). If it is newer, it replaces
    the version in the archive. If it is older, nothing happens. If there was no such
    file in the archive, it is added. If the archive itself doesn''t exist, it is
    created.


    ```

    $ tar -uf etc.tar /etc/passwd

    ```


    Use this to keep a backup up-to-date with the latest versions of files.

    If you want to do a true replace, that is, update an archive with a file regardless
    of whether the existing version is newer, the only way is to delete the file from
    the archive first with the -d option and then use -u.


    ```

    $ tar -df etc.tar /etc/passwd

    $ tar -uf etc.tar /etc/passwd

    ```


    The -u option won''t work on archives that have been compressed with the -z, -j,
    or -Z flag.'
