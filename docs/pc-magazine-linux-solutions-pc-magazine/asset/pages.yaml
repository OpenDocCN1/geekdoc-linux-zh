  md: '# 344 PC Magazine — Linux Solutions


    # Cross-Reference


    For a good introduction to the theory and practice of public key cryptography,
    see the article on the subject in the online encyclopedia Wikipedia (http://en.wikipedia.org/wiki/Public_key_cryptography).
    A tutorial with a focus on secure messaging can be found at www.openg.org/messaging/G260/pki_tutorial.html.
    Another tutorial from Verisign, a leading vendor of digital certificates, is at
    www.verisign.com/au/repository/tutorial/digital/intro.html.


    # Prefer open source software


    The cure for buffer overflows and other programming errors is for programs to
    be written perfectly — which is easier said than done. Open source software has
    an important advantage over proprietary software in this regard. Because the source
    code of a typical Linux program is available for all to see, many programmers
    are looking at it, and this increases the chance of a programming error being
    noticed. Having noticed such errors, the open source community doesn''t have to
    wait for a vendor to create a fix. They are free to fix themselves and distribute
    it to anyone who wants it. Therefore, if even open source software doesn''t start
    out, it tends to improve greatly over time.


    So, if you have a choice between installing proprietary software or its open source
    equivalent, pick the latter.


    # Install from source


    Given the choice between an application that is distributed in binary format (even
    though open source) and as source code — particularly when the application comes
    from some unfamiliar place — people who are serious about security source code.
    This way they can check to make sure it doesn''t contain any surprises. This is
    more practical for those who experience in programming, which unfortunately excludes
    most of the public. However, once you become familiar with Linux and are ready
    for a new challenge, learning how to compile and install programs from source
    is a useful skill to acquire.


    # Keep up with patches and updates from your distribution


    The developers of each Linux distribution regularly update software included in
    the distribution as security problems are discovered. After installation, your
    first task should be to install all the updates that have accumulated since your
    distribution was released. After that, you should check for regularly new updates.
    The default setup of Fedora under GNOME desktop includes an applet that notifies
    you if new updates are available. Chapter 15 explains how to install these updates
    using the rpm and update2 commands.


    Fedora also has a read-only mailing list for announcements of security updates
    and other useful news called fedora-announce-list, which is an important resource
    for the system administrator. You can subscribe to it at www.redhat.com/mailinginfo/fedora-announce-list.
    This is what a typical security advisory looks like:


    > From: "Dave Jones <davej@redhat.com>'
