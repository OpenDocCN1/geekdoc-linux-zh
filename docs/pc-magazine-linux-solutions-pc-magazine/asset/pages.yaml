    # Wireless connections


    Manual network configuration of a Fedora system is often not required. Many networks
    have a Ad Dynamic Host Configuration Protocol (DHCP) service that automatically
    connects connected systems with configuration data. By default, Fedora Core activates
    all network interfaces on your computer and finishes to use DHCP


    Wireless interfaces using DHCP join an open network once it is in range. wireless
    networks are restricted and accept only those systems that have the correct security
    credentials. If you are setting up a wireless connection after installation, follow
    the steps previously shown to bring up the Select Type Dialog and choose Wireless
    Connection. Set the channel in the appropriate blanks. Set the transmit rate to
    Auto. If your network requires a WEP (Wireless Encryption Protocol) key, type
    it in the block labeled Key. To find the SSID and channel, you will have to ask
    the network administrator or, in the case of a small/office home network, you
    have to use your router''s web interface to find these identifiers.


    # You Can Do It Later


    All distributions of Linux allow you to set up your network configuration during
    the installation process, but if you do not have a NIC, aren''t connected to a
    network, or are connected to one and then move the computer to a different one
    for use, you will have to configure or reconfigure the network settings later.
    There are several ways to do this regardless of distribution. You have your choice
    of command-line tools like ifconfig, character-based tools as Fedora Core/Red
    Hat has setup or netconfig, SUSEs YaSt2, and Debian''s fully graphical tools included
    in GNOME or KDE, as Network Configuration or the Internet Configuration Wizard.
    How to configure, or reconfigure, your network settings at a time other than installation,
    please refer to Chapter 19.


    # Summary


    Network computing has become a very important part of our everyday lives; you
    have to learn something about networking and how networks work to be able to use
    the resources of LANs, WANs, and the Internet. As you can get information in this
    chapter, you don''t have to be a network expert to be able to connect and use
    a network. Whether you are connecting to a LAN or to an ISP via a DSL cable connection
    or a traditional dial-up modem, you should now be comfortable doing so with Linux.'
