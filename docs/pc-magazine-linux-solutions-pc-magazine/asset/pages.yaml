  md: '# Chapter 18


    # File Sharing Solutions


    ne common use of Linux is to serve files on a network. Linux makes an excellent
    file server, capable of serving files to Windows machines, other Linux (Unix in
    general) machines, and Macintosh machines, all with free software. With these
    capabilities, Linux can make a very compelling choice for a central server on
    a mixed-platform network.


    # Linux-to-Windows File Sharing


    Many users will be primarily interested in sharing files between a Linux server
    and one or more Windows clients. The file sharing protocol used by Windows is
    called System Message Block, or SMB. Most Linux distributions have with an implementation
    of the SMB protocol called SAMBA. SAMBA is a file server that operates on SMB,
    in effect fooling Windows clients into thinking it is a WindowsNT or Windows 2000
    server.


    In addition, the most recent version of Apple''s Macintosh operating system, Mac
    OS X, has built-in support for SMB, which means a central server running SAMBA
    can share files with both Windows and Macintosh clients (and, of course, Linux
    machines).


    # Preparing to set up a SAMBA server


    There are couple of things to consider before you go ahead and set up your SAMBA
    server. The first and perhaps most important is what that you''re actually going
    to share. SAMBA is configurable enough that you could plan for various scenarios.
    For example, share all users'' home directories. This would present security problems,
    but it is possible to restrict access so that each user could access his own home
    directory only. Another common scenario, the one presented in this chapter, involves
    setting up a directory that could be shared among all users or among a selected
    group of users. This type of shared central repository is a very simple arrangement
    and serves as a jumping-off point for discussions of more-elaborate arrangements.


    # Note


    A SAMBA share refers to a shared directory.'
  merge: -1
