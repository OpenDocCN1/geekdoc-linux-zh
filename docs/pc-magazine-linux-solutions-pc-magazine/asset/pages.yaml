- img_proc: true
  md: 'If you already have a package installed, and you want to upgrade to a newer
    version of the same package, give the command


    ```

    yum update package

    ```


    This upgrades the package. It also checks the dependencies and upgrades the prerequisite
    packages if they are needed. If you''re not sure there''s a newer version of a
    package, you can give the command


    ```

    yum check-update package

    ```


    This checks whether an upgrade is available.


    # Note


    If you leave the package name off the yum check-update command, YUM checks for
    updates for all of your installed packages. If you leave the package name off
    of the yum update command, it upgrades every package on your system for which
    newer versions are available.


    To uninstall a package, use the command


    ```

    yum erase package

    ```


    or


    ```

    yum remove package

    ```


    There are other options for YUM, but these will get you started and are likely
    to be the ones you''ll most often. If you want to learn more, read the YUM manual
    page by giving the command yum or see the YUM homepage at http://linux.duke.edu/projects/yum/


    # APT


    APT, the Advanced Packaging Tool, is the management system that is most often
    found on Debian-derived systems. Like YUM, APT resolves dependencies automatically.
    That is, if you attempt to install a package whose functioning is dependent on
    another package that is not installed, APT installs that package automatically


    Like RPM, APT uses a special package format. the packages are known as deb files
    because they end with the suffix deb. As you might expect, this indicates that
    they are built for Debian systems, and even though not all of the systems that
    use the APT system are Debian systems, the suffix-fix applies to any system using
    APT.'
  merge: -1
  pgno: 284
- img_proc: true
  md: '# Chapter 15: Software Management Solutions 261


    There are several ways you can use APT. The most common is to use APT to install
    packages over the Internet. One function included with APT is the apt-get utility,
    which finds packages, resolves their dependencies, and installs them. You can
    also use APT on local files and CD-ROMs, however, with equally good results.


    # Setting up for APT


    Before you start using APT, you might want to take a few minutes and make sure
    it sets up the way you want it. With some distributions, the default setup may
    be for your use; with others, you may want to do some tweaking. The main area
    of customization is /etc/apt/sources.list file. As its name suggests, this is
    a list of sources—specifically it places, both on the Internet, and on your local
    system, where .deb files can be found. When you run APT, it looks in this file
    for information where to look for packages.

    A typical /etc/apt/sources.list file might look like this:


    ```

    # See sources.list(5) for more information, especially

    # Remember that you can only use http, ftp or file URLs

    # CDROMs are managed by the apt-cdrom tool.

    deb http://us.debian.org/debian/stable main contrib non-free

    deb http://non-us.debian.org/debian/non-US stable/non-US main contrib non-free

    deb http://us.debian.org/debian/stable/updates main contrib non-free

    ```


    ```

    # Uncomment if you want the apt-get source function to work

    @deb-src http://us.debian.org/debian/stable main contrib non-free

    @deb-src http://non-us.debian.org/debian/non-US stable/non-US main contrib non-free

    #free

    ```


    Here you see that the available sources are listed in the form of URLs. As the
    comments indicate, you can use URLs of the type http://, ftp://, or file://. If
    you are planning to use packages on a CD-ROM, you will need to use a different
    feature of APT, discussed later in this chapter.

    in the preceding example, there are three Debian mirrors. Look closely at this
    line:


    ```

    deb http://us.debian.org/debian/stable main contrib non-free

    ```


    This is the line that APT looks for packages files. The first entry in the line,
    tells APT that it is looking for .deb files. The second part, http://us.debian.org/debian,
    is the base URL for the site. The remaining entries, stable main contrib non-free,
    are subdirectories that APT searches for a particular package. If APT cannot find
    the package in any of these subdirectories, it moves to the next entry in the
    line.


    You can add lines in the preceding format to add any mirror or download site that
    you want. If you know of a particular site that tends to be very fast and reliable,
    you might want to put it first, or at very high in the list, whereas if you have
    a site that tends to be slow, you might want to put it off the list.'
  merge: -1
  pgno: 285
- img_proc: true
  md: 'You might prefer to download the packages manually and install them directly
    from your hard drive. To do this, create a directory to keep the files in. For
    this example, we''ll call it /debs. Add this line to your /etc/apt/sources.list
    file:


    ```

    deb file:/debs

    ```


    You''d probably want to place this first line in the file so that APT looks in
    the local directory, going to the Internet only if necessary.


    # Installing packages with APT


    Once you''ve got the /etc/apt/sources.list file set up, you''re ready to install
    packages. Installing packages, from either file or from the Internet, is done
    with the apt-get command. For example, to install the package cdrecord, simply
    give this command:


    ```

    apt-get install cdrecord

    ```


    APT downloads (if necessary), resolves dependencies (again, if necessary), and
    installs the package. If the package has dependencies, those are downloaded and
    installed as well. If this is the case, you get a message informing you of the
    other packages that need to be installed and asking if you want to continue. Most
    of the time there shouldn''t be a problem with saying "yes," but if you don''t
    want to install a particular package, you have the option to abort the procedure.)


    # Updating with APT


    Like RPM, APT maintains a database of packages that are installed on your system.
    You can check this database against the list of available packages by running
    the command


    ```

    apt-get update

    ```


    When you give this command, APT checks your list of installed packages against
    the lists maintained at the sites in your /etc/apt/sources.list file. If there
    are new packages available, you are informed and given the opportunity to update
    your system.


    # Note


    I''m distinguishing here between updating, which I mean checking your system against
    a list to see if there are newer versions of some programs available, and upgrading,
    by which I mean installing a newer version of a specific package (or your entire
    system if that''s applicable).


    # Upgrading packages with APT


    APT makes it very easy to upgrade the software on your system. Simply give the
    command


    ```

    apt-get upgrade

    ```'
  merge: -1
  pgno: 286
- img_proc: true
  md: '# Chapter 15: Software Management Solutions 263


    APT returns a list of all the packages that have new versions available. You are
    then given the option to upgrade those packages.


    APT can even be used to upgrade your entire system if a new version of your system
    becomes available. You can do that by giving the command


    ```

    apt get dist-upgrade

    ```


    (This particular command can take a long time to finish running, and, as one might
    expect, downloads can take a long time if you''re trying to do this soon after
    a new release is announced.)


    # Removing packages with APT


    Now you''ve seen how apt-get handles installation and upgrading, it will probably
    come as no surprise that removing packages is equally simple. To remove a single
    package, give this command:


    ```

    apt-remove package

    ```


    replacing with the name of the package you want to remove.

    This removes the program files, but leaves configuration files in place. This
    can be useful if you need to keep them for any reason, but it can be annoying
    if you''re trying to get rid of everything related to a package. If you want to
    remove everything related to a given package, you can give the command in this
    form (note the dash before purge):


    ```

    apt-purge remove <package>

    ```


    # Using a CD-ROM


    The development of APT was originally under the assumption that users would download
    files off the Internet. This was when systems were relatively small, but today''s
    Linux distributions fill entire CDs. This is a nightmare to install if you''ve
    got a slow connection. Consequently, the developers have added special functions
    to APT to enable you to install packages from CD-ROMs. For the most part, this
    works in the same way as you''ve already seen. The difference is that there is
    a procedure involved in adding the CD-ROM to the /etc/apt/sources.list file. This
    is done with the apt-cdrom add command.


    Using this command assumes that your CD-ROM is properly configured and listed
    in the /etc/stab file. If you see the contents of the CD-ROM that you drive in,
    this is probably the case. If not, refer to Chapter 16 for instructions on how
    to make sure your drive is properly configured.


    Once your drive is properly configured, you can give the command


    ```

    apt-cdrom add

    ```


    and the location of your CD-ROM drive is added to the /etc/apt/sources.list file.
    This enables APT to search any package that''s inserted in your CD-ROM for packages.
    If it doesn''t find the package it''s looking for there, it moves on other sources
    listed in the /etc/apt/sources.list file.'
  merge: -1
  pgno: 287
- img_proc: true
