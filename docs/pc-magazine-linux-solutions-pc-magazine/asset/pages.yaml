    # Summary


    Linux systems often have a bad rep as far as system administration and configuration
    go, especially in the area of network configuration. The people who propagate
    these fictions are people who haven''t seen or used a Linux system recently. Today''s
    Linux distributions provide graphical network configuration tools that are every
    bit equal of the graphical configuration utilities provided on more common computer
    operating systems such as Microsoft Windows or Apple''s Mac OS X.


    Interestingly enough, both Windows and OS X also provide command-line configuration
    tools for network interfaces and routing—but few people know about or use them.
    The high quality and ease of use provided by the graphical configuration tools
    in today''s Linux distributions are rapidly helping to eclipse the use of the
    command-line tools and continue to make it easier than ever to use a Linux system.'
