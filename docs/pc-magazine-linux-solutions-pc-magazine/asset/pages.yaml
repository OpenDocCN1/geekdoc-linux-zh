    # Using Electronic Mail


    If there is any Internet function that rivals the World Wide Web for popularity,
    it''s electronic mail. It''s difficult to say whether the Web or e-mail is more
    popular (especially since there are sites such as Hotmail that allow you to read
    your e-mail on the Web), but it''s pretty safe to say that there are very few
    people who use the Internet who don''t use e-mail.


    There are quite few e-mail programs available for Linux. This chapter covers two:
    Evolution and Mozilla''s Thunderbird. The details for these two programs should
    be easily transferable to any other client, however, because most of them tend
    to work more or less the same way. In fact, if you''ve used a Windows or Macintosh
    e-mail client, the odds are that most of the information presented here will be
    familiar, at least in its broad outline.'
