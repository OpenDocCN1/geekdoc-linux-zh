  md: '# Dealing with Spam


    Everyone hates spam, and with good reason. Unsolicited e-mail wastes the recipient''s
    time and network bandwidth. It is also a delivery vehicle for viruses, worms,
    adware, spyware, and all sorts of malicious programs. Add to that that content
    is either fraudulent or obscene, and it should be clear to everyone that spam
    is just plain no. ISPs and administrators spend a lot of time fighting spam, and
    they mostly do a good job of it. Nevertheless, a user can still get dozens, if
    not hundreds, of emails every day. Fighting spam is, at best, an inexact science.


    Still, there are steps you can take to reduce the amount of spam coming into your
    email system. First, you can use the spam-filtering functions of your mail client,
    as explained in Chapter 12. Beyond that, the most basic way of dealing with spam
    is to install and use a program called SpamAssassin Part of the Apache project,
    SpamAssassin is free software and is bundled with Fedora Core. Check to see if
    SpamAssassin is installed (rpm -q spamassassin on Fedora Core; locate spamassassin
    on other platforms) and if it is not, install it.


    Next you must use SpamAssassin to scan incoming mail. Become the superuser, open
    the file /etc/postfix/master.cf in a text editor, as shown in Figure 22-8.


    ![](img/65ef52f6e9fc73ddc3051990377c4f5b_421_0.png)


    ```

    # Postfix master configuration file. Each line

    # describes how Postfix daemon program should be run.

    # A logical line starts with non-whitespace, non-comment text.

    # Empty lines and whitespace-only lines are ignored, as are comment

    # lines starting with # character. A line starting with whitespace continues a
    line.

    # The fields that make up each line are described below. A "-” field

    # value requests that default value be used for that field.

    # Service: any name that is valid for the specified transport type

    # (the next field). With SMTP transports, a service is specified as

    # host port (or colon) may be settled. Either host and

    # port may be given in simple form or in network form. Examples

    # for SMTP server: localhost:smtp receives via the loopback

    # internet:1025 receives mail on port 10025.

    # Transport type: "inet" for Internet sockets, "unix" for UNIX-domain

    # sockets, "fifo" for named pipes.

    ```


    Figure 22-8: edit /etc/postfix/master.cf.


    The line that looks like this:


    ```

    smtp inet n n smtpd

    ```


    * Aster*'
