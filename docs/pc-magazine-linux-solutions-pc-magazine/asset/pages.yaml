- img_proc: true
  md: '# Chapter 13: User and File Management Solutions 223


    Give this command:


    ```

    chmod a+r share-file

    ```


    You get a set of permissions that looked like this:


    ```

    -rw-rw-r-- 1 joe joe 0 Dec 9 15:18 share-file

    ```


    In this case, a designates that you are changing the permission for all users.
    The plus sign designates that you are granting permission, and the r designates
    that you are granting read permission. If, after giving this command, you decided
    that wanted to revoke this permission, you could do so by giving the command


    ```

    chmod a-r share-file

    ```


    This will reverts the permissions back to


    ```

    -rw-rw-r-- 1 joe joe 0 Dec 9 15:18 share-file

    ```


    Note that you have changed the plus sign to a minus sign, indicating that you
    want to revoke that permission.


    Suppose that you wanted to read, write, and execute permissions to all users.
    In that case, you''d give this command:


    ```

    chmod +rwx share-file

    ```


    In this instance, you''ve designated all users, and you''ve included read (r),
    write (w), and execute (x) permissions.


    If you wanted to grant read and execute permission to members of the group, you''d
    give the command this way:


    ```

    chmod g+rx share-file

    ```


    By now it should be evident how the command works. You can designate the user
    (u), the group (g), or all (a), and you can designate read, write, or execute
    permissions. Use a plus sign to grant a permission and a minus sign to revoke
    it.


    # Note


    The only users who can change permissions on a file are the owner of that file
    and the superuser. Any changes in permissions are relative to the owner of the
    file. For example, if you give user execute permission to a file, the “user” in
    question is the file’s owner. Likewise, group permissions apply to the group that
    owns the file.'
  merge: -1
  pgno: 247
- img_proc: true
  md: '# Changing Ownership


    Although not an issue of permission per se, a crucial part of the whole file management
    system is the ability to change the ownership of files. Remember that every file
    has two owners: a user and a group. You can change either of these. As with permissions,
    you can change the ownership of a file if you are the file''s owner, or the superuser.


    # Caution


    If, as a user, you change the owner of a file—that is, you assign ownership of
    the file to a user other than yourself—you will not be able to get the ownership
    back. Only the user to whom you assigned owner-ship, or the superuser, can assign
    ownership back to you.


    # Changing user ownership


    Changing ownership is done with the chown command. Using the chown command is
    simple. it takes the name of the new owner as an option and the name of the file
    as the target. So, for example, if you wanted to assign ownership of the file
    share-file to the user jack, you would give the command in this format:


    ```

    chown jack share-file

    ```


    # Changing group ownership


    Changing the owning of a file is likewise simple and done with the chgroup command.
    the chgroup command operates exactly the same way as the chown command, taking
    the name of the group as an option and the name of the file as the target. So,
    if you wanted to assign the file share-file to the payroll group, you''d give
    the command like:


    ```

    chgroup payroll share-file

    ```


    If you really want to show off, you can do both at once, like so:


    ```

    chown jack.payroll share-file

    ```


    # Changing user ownership with graphical methods


    Both user and group ownership of files can be changed using graphical methods
    available with the various distributions: file managers. Look back at Figure 13-7.
    Notice that in the Ownership pane of that window you can change the group ownership
    by clicking on the arrow next to it.(Changing the user owner is not possible in
    this situation because you''re using a live CD, and you are not actually the knoppix
    user. With a more traditional installation, changing the user owner would be possible.)'
  merge: -1
  pgno: 248
- img_proc: true
  md: '# Chapter 13: User and File Management Solutions 225


    As with other operations of this type, there will be slight variations depending
    on the actual file manager program you''re using, but they are generally pretty
    much the same.


    # Setuid and Setgid Programs


    The mount command allows you to attach a new device or partition on a storage
    device to your system. This normal command can be run only by the superuser. To
    allow an ordinary user to mount, for example a Windows share, the user must have
    the ability to become root. It would be a bad idea to give everyone the root password
    just for this task and impractical to have the administrator do it each time.


    Linux has cases of this problem by a feature called setuid. A program with setuid
    permissions runs not as the user who invoked it but as the user who owns it. You
    can say that a program "setuid" to a particular user; when you do, that program
    that has setuid permission flag set is owned by your user. Looking at mount''s
    permissions with the ls command, you can see setuid root (indicated by the s instead
    of x in the first group of permissions), any user can start it, and it will not
    run as that user but root.


    ```

    -rwsrxr-x root 68496 2005-09-20 12:43 /bin/mount

    ```


    In the same way setgid programs do not assume the group of the user that started
    them; they always retain the group they created. crontab is a program for scheduling
    actions to take place at particular times. It is setgid crontab that it can create
    and write to files in /var/spool/cronab, which is crond, the daemon that actually
    runs the scheduled actions, looks for new tasks.


    The ability to change from account to another in midexecution requires keeping
    track of what the original account was, or you would not be able to change back
    again. For each process Linux maintains a record of what called effective user
    and group IDs (UID and EGID). root''s real UID, would always stay the same as
    the users. But the UID would change to 0, root''s UID, until completed execution.
    While a setuid program is running, operating system features need to check the
    identity of the process as it executes the effective value, 0 in this. They have
    the ability to see the root value if necessary (This is why you can only mount
    some types of devices unless you are really root). mount checks both the effective
    UIDs and applies its own policies.


    For all their utility, setuid and setgid programs are used only sparingly. It
    is all too easy for a coding mistake in one of these programs to allow a malicious
    user more privileges than he is entitled to. It is very dangerous if the error
    is in a program that is setuid or setgid root. Linux programmers try to avoid
    using this feature as much as possible. However, there are still a few situations
    where the use of setuid and setgid programs is unavoidable. Thus, Linux system
    has at least a few.'
  merge: -1
  pgno: 249
- img_proc: true
  md: '# Summary


    Linux''s nature as a true multiuser system presents a few challenges to the new
    user and administrator. Having multiple users requires that each have a unique
    identity and that each exercise a certain amount of control over his or her personal
    computing space. This is done using unique user group ID numbers and by allowing
    users and groups to “own” files. The owners of files may determine who has access
    to them and what kind of access will be granted.'
  merge: -1
  pgno: 250
- img_proc: true
  md: '# Chapter 14


    # Backing Up Data


    ![](img/65ef52f6e9fc73ddc3051990377c4f5b_251_0.png)


    Warning. You are about to read the boring chapter in this book. It''s true; making
    backups is near as fun and interesting as setting up a Web server or por through
    the kernel source code. Consequently, most of us find excuses to postpone or even
    completely forget this chore. Until the fateful day arrives—and it will, mark
    my words!—when important file gets accidentally deleted.


    And if you are Linux in your business, backing up data might not be a good idea
    but the law. Regulations such as the Sarbanes-Oxley Act may require you to maintain
    an audit trail of every transaction and communication your company makes.


    Keep reading; this is how you keep your data safe and sound with as little effort
    as possible.


    # What Do You Need to Back Up?


    To plan a proper backup regimen, you need to think about kinds of data you are
    going to back up and how often you want to back it up. Backing up the operating
    system itself, could be a lower priority than backing up a client''s account information.
    You might consider it sufficient to back up the former once a month, whereas the
    latter would be backed up every evening. On the other hand, if you are experimenting
    with Linux and often find yourself in a situation where you''ve rendered it imperable,
    or if you decide with your clients once a year at tax time, you will have an opposite
    set of priorities. This is something you have to determine for yourself, but once
    you have decided the scope and frequency of your backups, you can automate the
    process and have the computer take care of the burden for you.


    # Routine backups


    You can play it safe and back up your entire system, but you will generally be
    wasting a lot of time and space. Much of your systems consists of software provided
    by the vendor, which does not change and can be easily restored if you have the
    original installation media or access to the Internet. Nowadays most Linux distributions
    install in units called packages. Fedora, for'
