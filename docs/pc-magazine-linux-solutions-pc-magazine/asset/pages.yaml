  md: '# Chapter 23


    # Proxy Server

    Solutions


    ![](img/65ef52f6e9fc73ddc3051990377c4f5b_425_0.png)


    As it does with mail and the World Wide Web, Linux makes an excellent proxy server
    solution. Running a proxy server can speed up your network''s browsing and network
    communications in general, as well as allow you to exercise control over what
    comes into your network.


    A proxy server stands between your local network and the outside world. When a
    proxy network requests something, a Web page, for example, from the Internet,
    it connects to the proxy server, fetches the page, and passes it back to the local
    client. The proxy server connects to the remote server, not directly to the remote
    server.


    At this point, the astute reader may be wondering how adding a middleman, as it
    were, to the speed up lies in the process of caching. When a proxy fetches a page,
    it keeps a copy of that page in its cache for some period of time. If the page
    is requested again, it serves the page from its cache without having to make a
    second connection. In this way, frequently accessed pages are served without the
    time and bandwidth overhead of an Internet connection.


    Moreover, a proxy allows the network administrator to inspect what goes in and
    out of the network from a central location and place restrictions on what may
    go in and out. These restrictions can be based on network addresses (domain names
    or IP numbers) or on content. Many workplaces, for example, use proxy servers
    to prevent employees from accessing pornographic or frivolous web sites. In extreme
    cases, a proxy server can be used to white list remote sites. In other words,
    machines on the local network would not be able to access anything except those
    sites that are explicitly allowed by the proxy.


    # Types of Proxy Servers


    There are basically two ways of setting up a proxy server in Linux. One method
    is to use Linux''s native network management capabilities to create a firewall
    that allows or disallows connections based on the rules that you supply. The advantage
    of this type of setup is that it takes advantage of capabilities that already
    exist in the Linux kernel. Being kernel functions, moreover, these operations
    are executed very quickly and efficiently.'
  merge: -1
  pgno: 425
- img_proc: true
  md: '# # A word about Hardware


    At least some of the performance you can expect to get out of Squid depends on
    hardware configuration. Squid''s caching functions rely on memory (RAM) and hard
    disk space. The more memory you can devote to Squid, the faster it runs. Likewise,
    the faster your hard drive, the better Squid runs.


    How big a system do you need? There are no hard-and-fast rules. To a great extent
    it''s going to depend on how much traffic your squid is going to see. This depends
    on factors such as the number of users you have, how much they use the Internet,
    whether they tend to the same sites over and again, or go to different sites all
    the time, and so forth. The more traffic, obviously, the greater the hardware
    requirements. As of ''98 (the date from which Squid''s originated), the Squid
    developers were recommending a system with at least 512MB of memory and 9GB SCSI
    hard drives (presumably as a single RAID array). I suspect that this sort of setup
    was meant to serve an active network and is therefore probably overkill for a
    more modest network.


    However, at this late (2005), memory and disk space are relatively cheap. If you
    decide that running Squid is for you and you want to dedicate a machine to it,
    I recommend that you buy as much memory as you can afford.


    Memory is probably the single most important hardware feature in determining Squid''s
    speed. Squid frequently accessed items in memory to serve them faster. The more
    memory you can devote to Squid, the more items it can cache and the faster it
    will run.


    When Squid''s cache exceeds the size of its memory allotment, it moves things
    into hard disk storage. It is at this point that hard drive performance becomes
    a factor. For practical purposes, a good solid hard drive with plenty of storage
    should be fine.


    Of course, if your purpose in the short term is simply to experiment, don''t buy
    anything. You can get Squid up and running on a minimal setup, and as long as
    you don''t place too much of a load on it, you should be able to use it without
    any problems.


    There are, however, several downsides to this type of setup:


    +   - The kernel''s network filtering functions are not very easy to use. These
    functions commands that are quite complicated in their operations and are not
    designed to be used by beginners.


    +   - You do not get the advantage of caching. A kernel-style proxy can give you
    good management and logging, but it does not cache Web objects, and you would
    not reap the speed advantages of caching.


    +   - You would have to write the entire firewall yourself.'
  merge: -1
