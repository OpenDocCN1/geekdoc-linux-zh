    # Canceling jobs


    If you want to remove a job from the at queue, you can do so by using the atmrm
    command. For example, running the command


    ```

    atmrm 5

    ```


    would remove job 5 from the queue. You can remove multiple jobs by listing them
    with a space separating each job, like so:


    ```

    atmrm 4 5

    ```


    # Restricting access to at


    As the administrator of a system, you may decide that you don''t want certain
    users to have access to the at. For example, you may find that one of your users
    is using at to schedule huge downloads of personal materials to run at night.
    You can deny such user access by creating a file /etc/at.deny and placing their
    username into it. This is a simple text file, with usernames listed one per line.
    Any user whose name appears in this file will not be allowed to use the at command.


    Alternatively, you can create a file /etc/at.allow. If this exists, only those
    users whose names appear in this file will be allowed to use at. All other users
    will be denied access to it.


    # Using cron


    A somewhat complex alternative to at, cron is the natural choice for running jobs
    on a cyclical basis. Using cron, you can specify the minute, hour, day, month,
    and day of the week on which you want any given command to run. If, for example
    direct cron to run a command on the 15th of the month, that will run on the 15th
    of every month until you remove the command from cron''s to-do list, described
    in the next section.


    # The crontab file


    The to-do list is actually a file called crontab. A crontab file contains a list
    of commands along with the dates and times that they meant to be run. There is
    a master crontab file for the entire system, usually located at /etc/crontab,
    along with individual crontab files for each user. Although simple text files,
    because of the way cron works, they should not be edited directly. Instead,'
  merge: -1
  pgno: 314
- img_proc: true
  md: '# # Chapter 17: Automation and Timed Execution 291


    are created, edited, and installed using the crontab command. If you want to schedule
    a cron job, give the command


    ```

    crontab -e

    ```


    This command opens the crontab file in a text editor.


    # Note


    The editor used by the crontab -e command will be whichever editor is listed as
    the value of the EDITOR environment variable. On most Linux systems, the default
    value for this is the vi editor, but with any environment variable, the value
    can be changed. This should, however, be a text-based editor, such as vi, emacs,
    joe, pico, or the like.


    Once the editor is open, you can add entries to the file. The entries must be
    in a specific format, which looks like this:


    ```

    <minute> <hour> <month> <day of week> command

    ```


    It is not necessary to fill in every field. You can use the asterisk character
    (*) in any field to "all possible values." So, for example, you could have a crontab
    entry that looks like this:


    ```

    0 4 * * * 4 a.m. day ls /etc

    ```


    This line runs ls /etc at 4 a.m. every day. The zero in the first position indicates
    that the command is to run at zero minutes past four. If the first position had
    an asterisk, the command would be run 60 times. Once at 4:00, once at 4:01, once
    at 4:02, and so on. The asterisks in the third, fourth, and fifth positions mean
    the command will run at 4 a.m. each day of month and each day of the week. That
    may seem somewhat redundant, but those values are used to narrow down a days might
    right. For example,


    ```

    0 4 1,15 2 0 ls /etc

    ```


    would run the command at 4:00 every Sunday, as well as the 1st and 15th of February.
    (When the days of the week, 0 is Sunday, 1 is Monday, etc.)


    Once you have finished your entries, exit the editor, and the new crontab file
    is installed into the proper location.


    # Some tips for using cron effectively


    The cron function is a very useful one, and I am sure you will find plenty of
    work for it; however, its usefulness is greatly expanded if you keep in some basic
    ideas about how to deploy it effectively.'
