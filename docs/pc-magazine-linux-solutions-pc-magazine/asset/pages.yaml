  md: '# Chapter 16: Installing and Removing Hardware 271


    As you see in the section, Linux systems do a great job of identifying and configuring
    hardware at boot time and when new devices are attached to a running system. However,
    understanding concepts like device drivers and device nodes can be quite tricky
    when problems occur or you simply want to look under the hood and see exactly
    how things work on your computer system.


    # Finding new hardware dynamically with hotplugging


    In addition to automatic hardware detection during installation and at boot time,
    modern Linux systems use a mechanism known as hotplugging, which enables your
    system to manually detect and automatically configure devices as they are attached
    to a running system. Hotplugging is integrated into the device drivers used by
    Linux 2 and later kernels and supported on buses such as PCI, USB, PCMCIA, FireWire
    (IEEE 1394), used for docking laptops, and so on. A bus is any shared connection
    between the different functional units in your system—common examples are FireWire
    (IEEE 1394), PCI, SCSI, and USB, the basic for system input devices such as your
    keyboard.


    Most Linux systems use a version of hotplugging which is being done at boot time,
    to configure their hardware at boot time. This is also referred to as *coldplug*
    because the machine was cold (that is, off) when the system started. To expedite
    hardware checks at boot time, Linux systems also maintain configuration information
    about the hardware that the system contains. When you install a Linux distribution,
    each distribution uses its own, dedicated piece of software to probe your system
    and capture its current configuration. This software and its archived information
    are reused by the coldplug system as part of the process each time you boot your
    Linux system.


    Two of the best examples of hardware scanning and identification software available
    on different distributions are the software used by Novel''s SUSE Linux and the
    system shared by Fedora and Red Hat Enterprise. SUSE provides an integrated set
    of system administration modules with capabilities known as Yaast (Yet Another
    Tool), which includes a hardware detection module. Red Hat Enterprise Linux and
    Fedora use Core hardware detection and associated library known as kudzu. These
    are complex and different enough that discussing them in detail is outside the
    scope of this book—the important thing is that each Linux distribution provides
    a built-in mechanism for locating and identifying the hardware it contains and
    that each distribution stores and refreshes this information each time you boot
    your Linux system.


    Basic hotplug support is included in all current distributions of GNU/Linux, including
    Red Hat, Debian, Fedora Core, Mandriva, and SUSE. Some distributions provide dialogues
    that notify the user when new devices are detected during boot time through coldplugging
    or dynamically through hotplugging and automatically to configure the new device.
    For example, Figure 16-1 shows a pop-up notice from a SUSE 10.0 system, reporting
    that a new hard disk was detected.


    In this case, Yes displays a graphical interface for disk partitioning and formatting
    that is every bit friendly and powerful as provided by such popular operating
    systems as Microsoft Windows. The SUSE example shown in Figure 16-2. Most modern
    Linux distributions provide graphical utilities for disk partitioning and formatting.'
