  md: '# Chapter 7: Setting Network Information


    # The Network Interface Card


    If your computer does not have a network interface card (NIC), don''t worry. Locating
    a Linux-compatible NIC is very easy. Any office supply store, discount store,
    or online store will have what you need. Look for the term NE2000-compatible or
    simply choose a NIC with a recognizable brand name as Netgear, Linksys, 3Com,
    or Intel. The NIC should have instructions for physically installing the card
    in your computer.


    To connect your computer to a LAN, you need three things: a network interface
    card (NIC), a patch cable, and an IP address. Most new computers have a NIC already
    installed. I am assuming for this chapter that you have a NIC and a network to
    plug into. Unless you are connecting to a wireless network, you will need a cable,
    sometimes referred to as a *patch cable*, to connect your NIC to an outlet either
    in a wall or a hub. This cable can be purchased at office supply stores, computer
    stores, and even large discount stores. Once you are physically connected to the
    network, you will have to use communications software so that your computer can
    talk to other computers on the network and the Internet.


    # CONNECTING AUTOMATICALLY


    The instructions in this section lead you through the network setup as if you
    were setting it up for the first time while installing Linux.(Chapter 19 explains
    how to set your network information if you have already installed Linux.) The
    instructions in the following section show you how to manually enter the necessary
    network information during the installation process.


    Figure 7-1 shows the screen that appears during installation for setting up network
    information automatically.


    # Note


    The figures and instructions in this chapter reflect Fedora Core 4, and the dialogs
    for other distributions should appear very similar to the ones provided.


    The default choices are all you need to continue with automatic network settings.
    Click Next to continue.


    Figure 7-2 shows the next network information screen, asking if you want to enable
    a firewall. Use the default settings, enable firewall and using SE Linux (Security
    Enhanced).'
