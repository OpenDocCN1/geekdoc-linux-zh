  md: '# Chapter 19


    # Adjusting Your / Internet Settings


    Modern Unix and Unix-like systems are designed to support networking out of the
    box. Linux networking revolves around Transmission Control Protocol/Internet Protocol
    (TCP/IP) networking, which, as the name implies, is the core type of networking
    used on the Internet. Most aspects of your system''s networking configuration
    are set as part of the installation process for your Linux, from detecting the
    type of Ethernet card that is present in your machine or configuring your card''s
    network interface so that it works correctly on your local area network (LAN)
    or through your connection to the Internet via an Internet service provider (ISP).

    Always changes in the computer world, which is especially true in the area of
    networking. You may switch ISPs, buy a new Ethernet card for your machine, want
    to integrate your system into a home or business Linux environment, or do changes
    that will require modifying your system''s networking configuration. For example,
    a common task when moving a machine from an ISP-based connection to a SOHO (small
    office, home office) is reconfiguring it to use a static IP address rather than
    getting its IP address via DHCP. Lucky, modifying the configuration of a Linux
    machine is extremely easy. Chapter 7 discussed detailed information that you need
    to understand how networking is configured on Linux systems and explains the networking
    configuration files that are used by every Linux distribution. Unlike different
    Linux distributions each provide their own graphical tools for networking, all
    of these tools maintain and modify the underlying text-format configuration files.

    This chapter focuses on Linux networking using an Ethernet card and only touches
    upon TCP/IP over a traditional telephone modem. Chapter 7 discussed Point to Point
    Protocol (PPP) or Point to Point over Ethernet (PPPoE) connections to the Internet.
    This chapter focuses on reconfiguring existing Ethernet connections regardless
    of how they have been established.


    # Overview of the Linux TCP/IP System


    Like support for any hardware device, the lowest-level support for networking
    in your Linux system is the device driver for your Ethernet card. This device
    must be compiled into your Linux distribution''s kernel or available as a loadable
    kernel module when you use it.'
  merge: -1
  pgno: 345
- img_proc: true
  md: '# 322 PC Magazine — Linux Solutions


    device driver knows how to send and receive packets using a transport-layer networking
    protocol such as TCP/IP. TCP/IP is just one of many networking protocols that
    can be used to move packets over Ethernet networks, but it is also the most important
    when using a wide area network (WAN) as the Internet. TCP/IP is the transport
    layer for the higher-level networking protocols that are used directly by applications.
    Some application-level networking protocols are the Server Message Block (SMB)
    and Common Internet File Services (CIFS) protocols used by Microsoft Windows systems
    and the HTTP protocol that forms the foundation of the Internet''s best-known
    application, the World Web.


    TCP controls communication over the physical network, while IP controls higher-level
    issues such as routing, which is the term for forwarding information from one
    node to another if the recipient is not on the same network segment as the one
    on which communication occurs. For convenience, I don''t differentiate between
    TCP and IP throughout the rest of this chapter since they are generally thought
    of as a single unit. This chapter also focuses on configuring interfaces for IP
    version 4 (IPv4), which is the most common version of the IP protocol used today.
    Most Linux systems support IP (IPv6), which uses longer hexadecimal addresses
    to support a much larger set of Internet addresses.


    TCP/IP uniquely identifies 32-bit numbers as IP addresses, which are split into
    four 8-bit octets. TCP/IP hosts therefore have address such as 192.168.64.0, often
    referred to as dotted-quotation, because each of the four octets of the IP address
    is separated from the next by a period. Dotted-quotation also uses decimals instead
    of octal numbers for those of whom we do not think in.


    IP addresses on the Internet are assigned to companies, government entities, and
    universities by a central authority, the Network Information Center (NIC). IP
    addresses are conceptually divided into a network number, contained in the leading
    octets, and a host number, contained in the remainder. The NIC hands out networks,
    in which you can assign and use your host numbers. Network host number are divided
    into several common classes:


    +   - Class A networks are the networks 1.0.0.0 through 127.0.0.0, the network
    number is expressed in the first octet. Because only the rest can be used as host
    addresses, which enables Class A network providers to define approximately 1.6
    million hosts. All of the Class A network addresses have already been assigned
    by the NIC.

    - Class B networks are the networks from 128.0.0.0 through 191.255.0.0, where
    the network number is expressed in the first two octets. There can be up to 16,320
    Class B networks, with 65,024 hosts. Most of the Class B network addresses have
    already been assigned by the NIC.

    - Class C networks are the networks from 192.0.0.0 through 223.255.255.0, where
    the network number is expressed in the first three octets. There can be nearly
    two million networks, each of which can have up to 254 hosts. Most businesses,
    universities and ISPs use Class C networks.

    - Class D, E, and F networks fall into the range of 224.0.0.0 through 254.0.0.0,
    and are either experimental or unused. These terms are rarely used.'
  merge: -1
  pgno: 346
- img_proc: true
  md: '# Chapter 19: Adjusting Your Internet Settings 323


    The final component of an IP address is a netmask, which is a 32-bit (4-octet)
    number that is used as a mask (through a logical OR operation) with your host
    IP address to finely divide the IP address into network and host parts. The zeros
    in a mask identify the host portion. For example, the standard netmask on most
    home or small business networks is 255.255.255.0, which means that 254 hosts are
    available because the host portion of the address will always be in the last octet.


    If you''re sufficiently detail-oriented to have checked my math, you''ll note
    that the quantities of hosts in the previous list and paragraph dont strictly
    add up. This is because host numbers that contain the value 0 or 255 are reserved
    for special purposes. An address where all of host bits are zero refer to the
    network itself, while the other octet is 255 is a broadcast address. Broadcast
    addresses enable simultaneous communications to all hosts on a network segment.


    Two addresses on each host have special meaning to that host. The IP address 0.0.0.0
    is known as the default route; this is the default address to packets which are
    not intended for a host on the local segment are used for forwarding packets.
    In reality, TCP/IP systems use another host, such as the gateway, for forwarding
    packets to hosts that can''t directly contact on their network segment. The IP
    address 127.0.0.0 is known as the loopback address, which 127.0.0.1 is usually
    assigned to the loopback interface, which enables each host to communicate with
    itself without sending packets externally through an Ethernet interface.


    IP addresses are logical entities, a physical address that uniquely identifies
    it in the known universe. These physical addresses, known as Media Access Control
    (MAC) addresses, are mapped to IP addresses using protocols Address Resolution
    Protocol (ARP) and Reverse Address Resolution Protocol (RARP). However, even IP
    addresses are inconvenient to remember; surely, eBay''s network traffic numbers
    would suffer if everyone had to remember that www.ebay was 66.135.192.123.


    # Special Spaces for Private Networks


    The TCP/IP addressing scheme also includes two ranges of IP addresses that are
    known as nonroutable IP addresses. The addresses are 192.168.0.0/16 and 10.0.0.0/8.
    All private networks without a connection to the Internet are free to use addresses
    in these ranges (basically 192.168.* and 10.0.0.*). TCP/IP communications from
    machines that use addresses in these ranges cannot be routed over the Internet.
    Using these special, nonroutable IP addresses makes it possible for businesses
    and SOHO networks to use IP addresses, without using addresses at random that
    are actually officially in use on the Internet.


    At this point, if your home, business, or academic network uses addresses in these
    families but still has Internet connectivity, you''re probably wondering what
    I''m talking about. Don''t worry, we might be right—networks that use nonroutable
    IP addresses typically send packets bound for the Internet through a gateway system
    that knows how to map internal addresses specially formed externally addresses
    using something called Native Address Translation. The upset of this is that hosts
    on the Internet, and outside the gateway, thinks your packets are coming from
    its valid Internet address, while the gateway keeps track of which internal host
    sent packets and correctly forwards the packets to your internal host and IP address.
    Very could indeed.'
