    # Checking permissions from the terminal


    Permissions are also visible using text mode. On any Linux system, open a window
    and give the command ls -l / to get a listing that looks like this:


    ```

    -rw-r--r-- 1 root root 15276 Oct 5 2004 a2ps.cfg

    -rw-r--r-- 1 root root 2562 Oct 5 2004 a2ps-site.cfg

    drwxr-xr-x 4 root root 4096 May 9 12:13 acpi

