  md: '# Appending to tar files


    The -u option also won''t work if the archive is stored on magnetic tape drives
    cannot randomly access a particular point on the tape. However, there is a workaround;
    you see, tar archives can contain multiple copies of the same file. The -r option
    appends a given file to the end of an archive (specified with the -f option) regardless
    of whether that file already exists in the archive adding to any versions.


    ```

    tar -rf etc.tar /etc/passwd

    ```


    Normally, when you use -x to extract a file with multiple versions in the archive,
    only the most recently added or appended version (the one nearest to the end of
    the archive) is chosen. tar has an option called --occurrence (the two dashes)
    which lets you select a particular version. So, for instance, there are three
    versions of /etc/passwd in the archive, the command


    ```

    tar -xf etc.tar --occurrence=2 /etc/passwd

    ```


    would extract the second version. --occurrence by itself is equivalent to --occurrence=1.

    Like -u, the -r option does not work on archives compressed with -z, -j, or -Z.


