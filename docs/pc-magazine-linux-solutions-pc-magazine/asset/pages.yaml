- img_proc: true
  md: '# User-Based Authentication


    Sometimes you want to restrict access to certain shares to a particular user or
    group of users. For example, suppose that you want to give each user access to
    his or her home directory. You will need to set up a share that looked like:


    ```

    [homes]

    comment = Home Directories

    browsable = no

    writeable = yes

    security = user

    ```


    Note that you do not need to specify a path name for the home directories. The
    server can create these on the fly by using the information about each user''s
    home directory in the /etc/passwd file. By specifying security=user you ensure
    that each user can access his or her home directory only and no one else''s.


    All that remains is now to start (restart) the server. In the previous section,
    you learned how to start the server using Fedora''s system-config-services. Here,
    you see how to do it using text commands appropriate for a Knoppix system.


    # Note


    The following procedure works on many distributions, not just Knoppix. The only
    stipulation is that different distributions will place the startup scripts in
    different locations. In general, if you can find a directory called init.d, that''s
    where they''ll be. If you do not find an init.d directory, odds your distribution
    doesn''t use this kind of startup procedure. In this case, you''ll need to check
    your distribution''s documentation to find out what kind of startup procedure
    it does.


    In Knoppix, open a terminal window, and use the su command (and password) to assume
    superuser powers if you haven''t done so. If the server is not already running,
    give the following command:


    ```

    /etc/init.d/samba

    ```


    If it is already running, type the following:


    ```

    /etc/init.d/samba restart

    ```


    If you don''t know if it''s running or not, run the following command to find
    out:


    ```

    /etc/init.d/samba status

    ```'
  merge: -1
