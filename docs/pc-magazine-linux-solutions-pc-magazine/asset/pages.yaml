    # Getting hardware information from the /proc and /sys file systems


    Because they are powerful, multiprocessing operating systems, Linux systems need
    to maintain and manage a great deal of information about active processes and
    types of resources. The resources about which the Linux kernel needs information
    ranges from internal, kernel status information to information about how both
    kernel and user processes are accessing resources over system. Linux systems provide
    convenient ways of identifying and examining process and system information using
    two in-memory file systems that are mounted at /proc and /sys directories. In-memory
    file systems are simply portions of preallocated memory that have been formed
    as a type of file system and are accessed like any other file system. The in-memory
