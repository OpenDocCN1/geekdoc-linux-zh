  md: '# Chapter 5: Partitioning Your Hard Drive 49


    # # How Much Space?


    You may be wondering how much space is needed for a Linux installation and a full
    complete of applications, and how that space needs to be divided among the partitions.
    The answer depends on your needs, the type of installation you want, and the distribution
    you choose. A typical distribution with the X Window System and most of the desktop
    applications installed uses about 3GB of space on your hard drive. You should
    set aside at least 5GB of space if you are installing Linux on a shared system.
    For a dedicated system, there are dedicated Web and database application servers
    that occupy about 800MB of space. And these, with 80GB hard drives being standard,
    there shouldn''t be any issues with space, even if you install every package on
    all of the distribution CDs.


    In general, dedicating a workstation install can be done in an automatic fashion
    as discussed earlier. A server installation that is going to support several,
    or perhaps hundreds of users, should be installed with a bit more thought. A server
    installation should be installed via custom fashion and each package should be
    selected or deselected based on the use of the server.


    # ### Caution


    Never, ever do an automatic install for a server system because many packages
    installed that can pose security risks to your system.


    The official Fedora states the following space requirements for each type of installation.
    See your distribution''s Web site to get similar information for your distribution.)
    Note that these numbers are for installed software only. Swap space and the /boot
    partition will use additional space. The default /boot partition is 100MB, and
    the swap partition is set to twice the amount of RAM your computer has, in megabytes.


    +   Custom installation (minimal): 620MB

    Server: 1.1GB

    Personal desktop: 2.3GB

    Workstation: 3.0GB

    Custom installation (everything): 6.9GB


    Table 5.1 shows suggested sizes and mount points for a server system. As you gain
    experience, you can alter them for your own needs.'
