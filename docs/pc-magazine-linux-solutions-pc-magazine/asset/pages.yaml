    # Logical versus Physical Partitions


    On any hard disk, you can create only four primary physical partitions. If you
    need more than four partitions, which have to be created as logical partitions
    within an extended partition. An extended partition is simply a primary partition,
    designated extended, that can be divided into multiple logical partitions. This
    is true of any operating system and is not a function of Linux or Windows. Suppose
    you have a 40GB hard drive and need seven partitions configured as:


    ```

    /boot: 100MB

    /tmp: 500MB

    /usr: 6,000MB

    /var: 800MB

    /home: 25,000MB

    /opt: 6,600MB

    ```


    This not be possible if you tried to create all of the partitions as primary,
    but through the magic of extended and logical partitions, you can successfully
    create the partitions with the desired sizes. It is easy to create the partitions
    during installation; you don''t really have to worry about primary, extended,
    and logical partitions because the partitioning tool—for example, Diskid on Fedora
    Core or Red Hat systems—takes care of it. You simply click on the free space and
