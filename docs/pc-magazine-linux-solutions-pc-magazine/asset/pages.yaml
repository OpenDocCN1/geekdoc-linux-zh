    # Sleuthing your system hardware from Windows


    If you are running Windows, you can sleuth your system hardware using the Windows
    control panel facility. From the Windows XP control panel, choose Performance
    and Maintenance (not Printers and Other Hardware). Then, see basic information
    about your computer. The Windows System Properties dialog appears. From this dialog,
    you can determine what is installed on your system. You can also click System
    from the Control panel to get to the same System Properties dialog.

    The General tab shows the processor type, speed, and the amount of RAM that you
    have installed.

    The Hardware tab provides a button to call the Device Manager. This miniapplication
    shows the main components installed.


    # Caution


    This System Properties information is not always correct. For example, I''ve seen
    some single-processor systems that falsely report multiple CPUs.


    Armed with this knowledge, you can then look up Linux information online to see
    what Linux supports.


    # Finding compatible hardware lists


    Your best bet for determining which hardware your Linux distribution supports
    is to look online at your Linux distribution''s Web site. Each distribution differs
    (usually only slightly, but differs none same). You need to insure your hardware
    with the Linux distribution you plan to install. Table 3-1 offers a guide to online
    Linux compatibility lists.


    | Table 3-1 Linux Compatibility Lists |

    | Linux Version | Site |

    | Any | www.linuxcompatible.org/compatibility.html |

    | Debian GNU/Linux | www.tdlp.org/HOWTO/HOWTO-INDEX/hardware.html


    Continued'
