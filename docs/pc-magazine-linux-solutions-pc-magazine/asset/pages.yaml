- img_proc: true
  md: '# Chapter 23: Proxy Server Solutions


    ```

    http_access deny Sports1

    http_access allow

    ```


    The first line creates an ACL called Football1 that consists of any URL that contains
    the regular expression football.


    # Note


    A regular expression (sometimes referred to as a regex) is a construct used to
    match textual elements. Different systems and programming languages implement
    regular expressions differently, but the idea is that you can create a regular
    expression that might match one or more pieces of text. For example, suppose that
    in our regular expression system, we use the period (.) to stand for any single
    letter. We could then create the regular expression c., which matches the words
    "cat," "cut," "cot," or any other combination of three characters with c and ends
    with t.


    In the football example, the regular expression is football, which matches only
    the word "football," but will match it in any context. For example, it would match
    the URLs www.football.com, www.fantasyfootball.com,http://www.football.com,or
    any other URL containing the word "football." Writing regular expressions can
    be something of an art in itself, and indeed, there are books devoted to the subject.
    For the purposes of this discussion, it is sufficient to use whole words, keeping
    in mind that they will be matched in any context.


    The second line does the same thing, using the word "sports." The third and fourth
    direct the Squid proxy to deny HTTP (Web) access to any site using a URL that
    contains the regular expressions found in the ACL Football1 or Sports1. The final
    line tells the server to allow access to all other.


    A more thorough decursion of access control lists can be found at www.squid-cache.org/Doc/FAQ-10.html.


    # Summary


    The Squid server can be used to cache objects for more-efficient use or to control
    access to remote sites. Installation and configuration is fairly straightforward,
    and clients can be configured on any major platform. By caching frequently used
    objects in memory, Squid can substantially reduce the amount of network bandwidth
    that would otherwise be used in accessing remote sites. In addition, Squid gives
    administrators a significant amount of control over what users can and cannot
    access and provides detailed log files, which can be used to analyze network traffic
    patterns.'
