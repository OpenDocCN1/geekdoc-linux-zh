  md: '# 222 PC Magazine — Linux Solutions


    What you see here is the file auto.net a regular file (indicated by the dash in
    position one). The owning user has read, write, and execute permission, the group
    has read and execute permission, and all users have read and execute permissions.


    You can tell by looking at columns three and four that the owner of the file is
    the root group (column three) and the group that owns the file is the root group
    (column four).


    # Note


    Execute permission is a little different from directories. When you see a directory
    in a listing (indicated by the d in the first position), execute permission means
    that the relevant user class has the ability to enter directory. So, for example,
    if you see:


    ```

    drwr-xr-x  2 root root  4096  9 13:13 cipe

    ```


    It means that the owner, the group, and all users have the ability to enter the
    cipe directory.


    # Changing permissions


    Of course, the permissions system would not be very useful if you didn''t change
    permissions. Granting and limiting permissions, and otherwise customizing a file''s
    level of access, is at the heart of the system. Before you get into the nuts and
    of how exactly this is done, it''s important to point out that you must be the
    owner or the superuser to change permissions on a file. This may seem to be an
    obvious point, but it''s an important one, and that''s easy to forget.


    # CHANGING PERMISSIONS WITH GRAPHICAL METHODS


    If you''re using a graphical manager, such as Konquer or Nautilus, you can generally
    edit permissions from that program. Take another look at Figure 13–8—Konquer''s
    Advanced Permissions window. You can edit a file permissions by checking or unchecking
    the various checkboxes you see again (provided you are the file owner or the superuser).
    Graphical file managers have some sort of permissions mechanism that operates
    in a similar fashion. If you''re using a distribution other than Knoppix, consult
    your system''s documentation to find out how your file manager handles it.


    # CHANGING PERMISSIONS WITH TEXT METHODS


    Changing a file permissions also be done in text mode using the chmod command.
    The chmod (a contraction of change mode) command takes the name of the file as
    the target and the change in permission mode as an option. The options take a
    slightly unusual form, and it''s probably easiest to grasp through these examples.


    Suppose you have a file share-file, and you want to grant read access to it for
    all users on the system. Initially: share-file has this set of permissions:


    ```

    -rw-rw--  1 joe joe 0 Dec  9 15:18 share-file

    ```'
  merge: -1
