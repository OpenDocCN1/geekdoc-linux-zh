- img_proc: true
  md: '# Chapter 22


    # Mail Server

    Solutions


    Having seen the way Linux can operate as a Web server or as a file server, it
    probably comes no surprise that Linux also makes an excellent mail server. However,
    unlike Web and file servers, mail servers come with added levels of complexity.
    While getting a basic mail server up and running is not too difficult, the consequences
    of misconfiguration can be considerable. People from the outside world may find
    that their mail cannot be delivered, and people within your organization may find
    themselves effectively cut off from important communications.


    This should not necessarily deter you. The benefits of running your own mail server
    can be quite rewarding. In particular, you can control how spam is handled and
    provide alternate means of access, such as Web-based mail programs, to your users.


    The grandaddy of Unix mail is a program called Sendmail. I don''t cover Sendmail
    in this chapter for one compelling reason: it is an unbelievable nightmare to
    configure. In fact, Sendmail configuration is so complicated and macro unintuitive
    that it''s not often done by hand. Sendmail is usually configured by using the
    macro M4. M4 allows the administrator to set configuration options, and then the
    program creates the configuration file.


    While this is an interesting exercise, and can certainly teach one a great deal
    about some of the arcane aspects of Linux administration, it is not ideal for
    the beginner, nor for someone who wants to get a mail server running with minimum
    of fuss.


    This chapter focuses on Postfix. Postfix is a slightly less flexible program than
    Sendmail, but it performs the basic functions of a mail server and is much easier
    to configure. I also cover the Dovecot POP/IMAP server and give you introductions
    to the Web mail program SquirrelMail and the junk-filtering program SpamAssassin.


    # How Electronic Mail Works


    Before getting into the specifics of setting up a mail server, it''s worthwhile
    to understand some of the general concepts involved. E-mail is a little more complicated
    than other sorts of Internet communications. Rather than a single server, there
    are three types of servers that all work together to get mail where it needs to.
    The three types of servers are mail submission agents (MSAs), mail transport'
  merge: -1
  pgno: 403
- img_proc: true
  md: '# 380 PC Magazine — Linux Solutions


    agents (MTAs), and mail delivery agents (MDAs). In practice, the MSA and MTA functions
    are handled by the same program, but they are two distinct functions and should
    be thought of as. MDA programs are generally separate.


    When you send an e-mail, your mail program—the client connects to an SMTP server
    (MSA). This server takes your mail and connects to an MTA at the destination site.
    The MTA checks to make sure that the e-mail is in a valid format and that the
    intended recipient exists. If this is indeed the case, the MTA accepts the message
    and delivers it into a mailbox, a specially designated file or directory. When
    the recipient is ready to read the message, her e-mail program—another client
    connects to the MDA and asks if there’s any new mail. Figure 22-1 shows how the
    system works. MDA reads the mailbox and delivers any new mail to


    ![](img/65ef52f6e9fc73ddc3051990377c4f5b_404_0.png)


    **Figure 22-1:** e-mail requires a chain of clients and servers.


    In order to have a working e-mail system, you must install and configure an SMTP
    server/MTA, and an MDA.


    MDAs generally come in the form of POP and'' servers. POP stands for Post Office
    Protocol, and the POP server that you will see most often are, in fact, POP3 is
    the third revision of the POP protocol. LDAP stands for Message Access Protocol
    and is newer than the POP protocol. Most recent MDAs support both POP and,, although
    some can be configured to use one but not the other. The type of mail you''re
    determining decides the protocol that you must use. The MDA covered in this chapter,
    Dovecot, supports both protocols; if you have any question as to which you should
    use, you can always configure it to use both.


    As a matter of general procedure, the best way to deal with the multiple servers
    required for a functioning e-mail system is to take it one step at a time. That
    is, get one thing working before you move to the next. This is the approach for
    the remainder of this chapter: You install and configure one component, test it
    in order to make sure it''s working, and then move on to the next.'
  merge: -1
  pgno: 404
- img_proc: true
  md: '# Chapter 22: Mail Server Solutions


    # Note


    Even more with a Web server, setting up a mail server requires a domain name.
    While it is technically possible to send mail to an IP number, it''s not an especially
    useful thing to do. You''ll need DNS service set up as well, with a mail (MX)
    record pointing to the IP number of the machine upon which you will install your
    mail server. Your DNS service can help you to set up the appropriate MX record.
    (See Chapter 21 for details about how to register a domain name and find a DNS
    service.)


    For the remainder of this chapter, I assume that you have a domain name (the example
    in the chapter is example.com) with an appropriate MX record.


    # Installing and Configuring Postfix


    The example in this chapter involves setting up a mail server on Fedora Core.
    Setting up a mail server on Knppix is not practical for two reasons: Knppix''s
    slowness can lead to difficulty in delivering mail, and installing Postfix on
    live CD-based machine will simply lead to the server being lost any time the machine
    is rebooted. (This is true of any server running on a live CD, by the way. Even
    something as simple as a Samba or Apache server will be lost upon reboot. It is
    possible to save a configuration from Knppix or to customize the installation
    and burn a new CD, but if your intent is to run persistent servers, you''re better
    off dedicating a machine to Linux, doing a traditional installation, and running
    them on that.)


    # Step 1: Install the software


    With any server, the first step is to acquire and install the software. Unlike
    Apache or Samba, Postfix is not a default application for Fedora Core, so it is
    unlikely that it was installed when you set up your system. It is, however, included
    with the distribution, so you should be able to find the Postfix RPM package on
    your installation CDs. (Links to packages for other distributions can be found
    at www.postfix.org/packages.html.)


    However, if you prefer, you can also download it from any of the Fedora mirrors
    listed at http://fedora.redhat.com/download/mirrors.html. Once you''ve got the
    package, install it as described in Chapter 15. In this case, you can do it with
    the command:


    ```

    rpm -ivh postfix-2.1.5-2.2.i386.rpm

    ```


    (Note that the version number may be different depending on whichever version
    of Postfix is current when you do this.) Once you''ve got the package installed,
    you are ready to configure your software.'
  merge: -1
  pgno: 405
- img_proc: true
  md: '# Step 2: Configure Postfix


    As with Apache, you configure Postfix by making changes to the default configuration
    file that is supplied with the package.


    Open a terminal window, assume superuser powers (su - ), and move to the /etc/postfix
    directory (/etc/postfix). The central Postfix configuration file is called main.cf.
    As with Apache, you should make a backup copy of this file, so give the command


    ```

    cp main.cf main.cf.backup

    ```


    This way, if you find you have misconfigured Postfix, and you can''t figure out
    what you did wrong, you can simply delete your configuration file and start from
    scratch with the default.


    Next, use your favorite text editor to open the main.cf file; I use edit (shown
    in Figure 22-2), launched with the command edit main.cf. (Using a text editor
    to launch edit in this allows the file to be opened with superuser privileges.
    If you launch edit from the main menu, do so with your regular privileges.)


    ![](img/65ef52f6e9fc73ddc3051990377c4f5b_406_0.png)


    > # Global Postfix configuration file. This file lists only a subset

    # of all 300+ parameters. See the postfix(5) manual page for a

    # complete list.


    > # The general format of each line is: parameter = value. Lines

    # that begin with whitespace the previous line. A value can

    # contain references to other variables or {names}.


    > # MAKE CHANGE NO MORE THAN 2-3 PARAMETERS AT A TIME, AND TEST IF

    # POSTFIX STILL WORKS AFTER EVERY CHANGE.


    > # SOFT BOUNCE


    > # soft_bounce parameter provides a limited safety net for

    # testing. When soft_bounce is enabled, mail will remain queued that

    # would otherwise bounce. This parameter disables locally-generated

    # bounces, and prevents the SMTP server from rejecting mail permanently

    # (by allowing 5 retries instead of 4). However, however,

    # is no cure for address reformatting mistakes or mail routing mistakes.


    > # soft_bounce = no


    | Ln 1, Col 1 | INS |


    Figure 22-2: edit showing the main.cf file.


    Take a few minutes to read over the file. There are plenty of comments to give
    you an idea of what the various parameters do. Most of the parameters in the file
    have reasonable default values, but will need to be changed to values specific
    to your system. Some parameters have several values'
  merge: -1
  pgno: 406
- img_proc: true
  md: '# Chapter 22: Mail Server Solutions 383


    specified, with all but one commented out. To use a commented-value, simply remove
    the hash mark at the beginning of the line, and place a new hash mark at the beginning
    of the default value that you want to remove.


    # Tip


    It''s always a good idea to comment out values that you don''t want and add new
    ones rather than to delete lines. That way, you can see what old value was. If
    your new value doesn''t work, it''s a simple matter to go back to the old value.
    Also, make sure you leave comments of if you''re making a complicated configuration
    change. This will help you to retrace your footsteps later, should the need arise.


    Let''s look at a few parameters and changes that need to be made. For this example,
    suppose you''ve registered the domain name example.com, and you''re setting this
    machine up to be the mail server for your domain. You have decided to name this
    machine mail.example.com, and you have an MX record in your DNS server that points
    the hostname mail.example.com to the machine''s IP address, 192.168.0.111


    # Note


    The IP address 192.168.0.111 will not work if you want a mail server to be accessible
    from the Internet. Any IP addresses that begin with 192.168. are reserved for
    private, internal networks, meaning that anyone can use them and that if you''re
    registered to any specific network. You must use an IP address that can be attached
    to a machine on the Internet. You should have gotten this IP number from your
    Internet service provider or system administrator.


    # MYHOSTNAME


    The hostname parameter does exactly what you''d imagine from its name: it sets
    the machine (hostname) to which Postfix will answer. You must set this to the
    name of your machine, in this case mail.example.com. Look for this section in
    the main.cf file:


    ```

    # INTERNET HOST AND DOMAIN NAME

    #

    # The hostname parameter specifies the internet hostname of

    # mail system. The default is to use the fully-qualified domain name

    # from hostname(). $hostname is used as a default value for many

    # other configuration parameters.

    #

    #hostname = host.domain.tld

    ```'
  merge: -1
  pgno: 407
- img_proc: true
  md: '# 384 PC Magazine — Linux Solutions


    Comment out the last line, or leave it commented out if it already is, and add
    the line


    Myhostname = mail.example.com


    # MYDOMAIN


    The mydomain parameter is similar but without the hostname component. This parameter
    controls the domain name for which Postfix will accept mail. The relevant section
    of the my.cf file should look like this:


    ```

    # The mydomain specifies the local internet domain name.

    # The default is to use $myhostname the first component.

    # $mydomain is used as a default value for many other configuration

    # parameters.


    mydomain = example.com

    ```


    # MYORIGIN


    The myorigin parameter relates to how Postfix acts in its role as an SMTP server,
    that is how it acts when sending mail to other sites. It is sometimes but not
    always the case that you will use a different server to send mail to. For example,
    many Internet service providers require that you use their SMTP server to handle
    outgoing mail and block mail coming out of individual machines on their networks.
    This prevents spam. If you attempt to use Postfix to send mail and find that it
    isn''t getting out, this may be the problem. In any case, myorigin assumes that
    you can send mail from your local machines. Myorigin tells Postfix the format
    to use when it tells remote mail servers where the current message is coming from.
    Normally, the value of this parameter will be the same as the value of either
    the hostname or mydomain parameter and can be set in this fashion:


    ```

    # SENDING MAIL

    # The myorigin parameter specifies the domain that locally-posted

    # mail appears to come from. The default is to append $myhostname,

    # which is fine for small sites. If you run a domain with multiple

    # machines, you should (1) change this to $mydomain and (2) set up

    # a domain-wide database that aliases each user to

    # user@that.users.mailto.


    # For the sake of consistency between sender and recipient addresses,

    # myorigin also specifies the default domain name that is appended

    # to recipient addresses that have no @domain part.


    myorigin = $myhostname

    myorigin = $mydomain

    ```'
  merge: -1
  pgno: 408
- img_proc: true
  md: '# Chapter 22: Mail Server Solutions 385


    As shell programming (see Chapter 11), you can use the value of a previously set
    variable by appending a dollar to it. In the example, myorigin is set to the value
    of mydomain, that is, to example.com. When Postfix connects to remote mail servers,
    the remote server now sees addresses from your site taking the form of user@example.com.


    # INET_INTERFACES


    The inet_interfaces parameter controls the network interface through which remote
    mail servers are allowed to connect. (See Chapters 7 and 19 for discussion of
    network interfaces.) If your machine has more than one network interface, this
    parameter allows you to select which one to use for incoming mail. You are not
    restricted to one, however.


    # # RECEIVING MAIL


    # The inet_interfaces parameter specifies the network interface

    # addresses that this mail system receives mail on. By default,

    # the software claims all active interfaces on the machine. The

    # parameter also controls delivery of mail to user@[ip.address].


    # See also the proxy_interfaces parameter, for network addresses that

    # we are forwarded to us via a proxy or network address translator.


    # Note: you need to stop/start Postfix when this parameter changes.


    ```

    inet_interfaces = all

    inet_interfaces = $hostname

    inet_interfaces = $hostname, localhost

    inet_interfaces = localhost

    ```


    Note that the default value for this parameter is all, which allows all incoming
    mail to connect to any interface. If your machine has more than one interface,
    leaving inet_interfaces set to all may present a security risk, so you might want
    to narrow it down. If you prefer, you can set it to all when getting your server
    up. Once you''ve established that it''s working, you can now change this parameter,
    however, as the comments note, you need to restart the server if you do.


    # MYDESTINATION


    The mydestination parameter controls the domain(s) for which Postfix accepts mail
    for final delivery. This configuration, the default for Fedora Core, should work:


    # The mydestination parameter specifies the list of domains that this

    # machine considers itself the final destination for.


    # These domains are routed to the delivery agent specified with the

    # local_transport parameter setting. By default, that is the UNIX

    # compatible delivery agent that lookups all recipients in /etc/passwd'
