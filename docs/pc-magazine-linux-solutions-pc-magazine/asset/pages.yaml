  md: '# Introduction


    Welcome to PC Magazine Linux Solutions. This book is a bit of departure for PC
    Magazine, as the focus hereabouts is on Microsoft''s operating systems, but a
    growing number of PC users have become interested in Linux in recent years.


    Linux was first released in 1994, when I was working at Georgia Tech. Lin was
    a Finnish computer student named Lin Torvalds. He was looking for something he
    could run on his PC that would duplicate the functionality of his systems Unix
    mainframe. Finding nothing that met his needs, he decided to build it. Deciding
    that he needed help, he released it on the Internet, declaring that anybody who
    wanted a copy could have one, so long as they made changes or improvements in
    it available to the public.


    Apparently, there were a few people who were also looking for the same thing,
    because an army of developers took up the task, and within only a couple of years,
    Linux was a full-featured system.


    I first discovered Linux in 1997, when I was working as a science and engineering
    students who had many Linux regularly. Regularly by what they were doing, I installed
    Hat Linux 4.2 on an old 386 PC. It took hours, and when I was done, I had a machine
    with only a command-line interface. I was working on this type of machine, as
    I had worked on Unix machines in college, and with later employees. At the time,
    the current version of Windows was Windows 93. I had a Windows 95 machine at work,
    at home. I was still using a 496 loaded with Windows 3.1. which crashed almost
    always slow. I remember how excited I was to have a machine that could get me
    e-mail and Usenet news quickly and without crashing.


    As Linux matured and I accumulated PC hardware, I was eventually able to run a
    graphical interface, and do things like surf the Web, play music, and manage documents.
    Broadband Internet access to our town, I discovered the real power of Linux, running
    e-mail and Web servers, and using my old 386 as a router to share my Internet
    connection among several machines.


    Around that time, I met my agent, David Fugate. He was asking me to write about
    this new operating system which was beginning to get attention from a variety
    of quarters. The result of our meeting was a collaboration with other authors
    about the StarOffice suite of applications—a suite which can eventually be found
    just about every Linux distribution.


    Today, Linux is everywhere. What was once considered a "hacker''s toy is now a
    serious player in the server market and a legitimate presence on desktops. Linux
    distributions are produced by small groups of volunteers and publicly traded corporations.
    After 11 years, Linux keeps getting better. New features are added and refinements
    are made constantly. General Linux-based software applications are being created
    all the time.


    One of the best about Linux, of course, is the price. Boxed sets of most Linux
    distributions can be had for under $100, but if you have access to high-speed
    Internet connection and a CD burner, you can also download at least the basic
    parts of most distributions for the cost of a few blank CD-r CD-s. And what you
    get for such paltry investment is truly remarkable: an industrial strength operating
    system that runs on off-the-shelf hardware and can turn a modest PC into a small
    server or powerful workstation.'
  merge: -1
  pgno: 21
- img_proc: true
  md: '# xxii Introduction


    The low cost is only part of the equation. Linux brings the power of a Unix machine
    to anybody with a PC and the time to learn the system. Computing functions that
    were once the provenance of governments, universities, and large corporations
    are now available to anyone.


    Linux is as simple or complex as you want to make it. If you want to use it for
    more than e-mail and Web surfing, you can do that. Linux does not limit you. If
    you can imagine something that can be done with your computer, there''s probably
    a way to do it on Linux. Linux gives you direct control over your machine. You
    are not beholden to Redmond or Cupertino to tell you what can or cannot be done
    with your computer. That''s power, and what Linux gives you.


    # Who This Book Is For


    If you picked up this book, you are at least curious about Linux. You may be an
    experienced PC user, but perhaps never used Linux—or at all. In writing this book,
    we''ve tried not to assume any previous knowledge or experience about Linux or
    Unix. We recognize that certain concepts may be new to you, and we try to make
    your introduction to these concepts as easy as possible.


    If you''re a Windows user, this book will help you add Linux to your environment
    without giving up what you are used to. We cover dual-boot systems (running Linux
    and Windows on the same computer) as live CD distributions (Live CDs allow you
    to run Linux directly from a CD without having to install it on your computer).
    If you find, using Linux for a while, that you don''t need Windows around you
    at all, you can If you want to keep it, you can do that too. Linux is about giving
    you the power to choose how you use your computer.


    We assume that you are interested in Linux either as a home or as a business.
    To the latter end, we do cover business-related topics managing multiple users,
    running e-mail, Web, and file servers; and like the but; we do not cover heavy
    duties such as running an e-commerce server, as we feel that such topics are too
    complex to cover in a beginner-oriented book. There is a learning curve with Linux,
    and with anything new, it''s best to master the basics before you move on to the
    heavy stuff.


    # How This Book Is Organized


    This book is divided into five parts. Each part is intended to help you conquer
    a particular aspect of the Linux experience.


    # Part I: Before Installation


    This part is intended to help you understand the advantages and potential uses
    of Linux, and to help gather the information that you will need in install it.
    Linux is not a monolithic entity. Anyone who wants to create their own version
    of Linux, and many people, companies, and organizations have done just that. There
    are many Linux distributions out there, and in this section, we tell you a few
    of them, with an eye towards helping you pick the distribution that is right for
    you.


    We also help you gather all of the information that you''ll need about your computer
    to install Linux.'
  merge: -1
  pgno: 22
- img_proc: true
  md: '# Introduction


    # xxiii


    # Part II: During Installation


    When you buy a computer today, it almost always comes with an operating system
    installed. This has been the case long enough that most computer users have never
    installed an operating system. Because Linux doesn''t have anywhere near the market
    penetration of Windows, however, odds are very few people are buying computers
    with Linux installed. This means that you''ll probably have to install Linux yourself.


    Installing Linux is no more difficult than installing any other system, but of
    course, the experience of installing an operating system is itself new to you,
    that''s not much of a comfort. In this section, we walk you through the basics
    of a typical installation.


    # Part III: Running Linux


    Now you''ve got it installed, how do you use it? That''s the question we answer
    for in Part III. We show you how to log in and take stock of what you see when
    you do it.


    Linux has two major desktop environments: GNOME and KDE. Depending on the distribution
    that you install, you may have one or the other, or you may have the choice of
    which you''d prefer. We show you the basics of both desktops and how to customize
    them so that you have an interface that fits you like a glove.


    We introduce you to how truly sets Linux sets up the terminal: the system that
    Linux was modeled after, has been around since long before there were pretty graphical
    interfaces. From Unix, Linux has inherited a system of commands that is unrivaled
    in power and flexibility.


    # Part IV: Basic Administration


    In this part we go under the hood, and show you how to maintain and configure
    your Linux system. Linux typically serves multiple servers, so you will learn
    how to make changes to the system that affect you and protect all users.


    In addition, we show you how to back up data, add remove software packages, manage
    your hardware, automate repetitive tasks, set up file sharing, manage your Internet
    connection(s), and keep your system secured.


    # Part V: Server Solutions


    One of Linux''s strengths is the ability to run servers. Whether you''re looking
    for an e-mail server, a Web server, or something else, odds are an industrial-strength
    package that runs on Linux, and most of the time you can get it for free. In this
    section, we introduce you to three of the most popular servers on the Linux platform:


    +   - Apache: The Apache Web server is not only the most popular Web server on
    the Linux platform; it''s the most popular web server in the world.


    +   - Postfix: The Postfix e-mail server is a powerful mail server that can serve
    mail for a small domain or a large organization.


    +   - Squid: The Squid proxy allows you to cache frequently Web objects to speed
    up performance. It also gives you the ability to analyze your network traffic
    and see who''s going where. This is helpful in streamlining your network and improving
    your security.'
  merge: -1
