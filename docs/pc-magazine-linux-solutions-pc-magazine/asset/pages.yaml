  md: '# 46 PC Magazine — Linux Solutions


    at least two partitions when you install linux: a root file system, designated
    as /, and a swap partition. The root file system in this case will hold all the
    files and directories related to your Linux installation. The swap partition is
    a reserved space, not accessible by the user, that is used by the operating system
    for virtual memory. (A more detailed explanation of swap space is given at the
    end of this chapter).


    The main point to remember when installing any advanced operating system like
    Linux is to separate system, user files, and swap space with partitions.


    In this chapter, you learn about partitioning your hard drive(s), mounting and
    unmounting drives and swap space, and automatic partitioning. The instructions
    in the chapter lead you through using an automatic partitioning tool to partition
    your hard drive.


    # Mount Points


    Mount points are a new concept if you are coming from a Windows world. A mount
    point is a local directory on your hard drive where you map resources as if they
    are part of your system. Once a resource is mounted or mapped, you can cd (the
    command to change directories) into it as you would any other directory on your
    system. Once a partition is created, it must be mounted so that it can be used
    by the users and systems. All partitions created during installation will be automatically
    mounted.


    # Physical media versus mount points


    To illustrate the concept of mount points in contrast to physical media, let''s
    use a familiar Windows example. On Windows, you have a C drive that holds all
    of your directories such as \temp, \program files, \windows or \win, \Documents
    and Settings, and so on. The C drive represents a whole physical hard drive that
    we call IDE. IDE means that this is the first physical Integrated Drive Electronics
    (IDE) hard drive on the system. (Remember in the computer, you begin with a:—except
    partitions.) For this Windows system, the physical drive, IDE, is mounted on C:
    so that we can use it. In Linux, IDE is typically referred to as hda, or disk
    a a tells you that Linux sees this as the first hard drive. Further, there is
    a file that represents this first hard drive, appropriately named hda. This file
    is in /dev (device) directory with hundreds of other files that refer to physical
    devices of all kinds. In this directory, you will find files that represent IDE
    hard drives, SCSI hard drives, modems, CD-ROM/DVD-ROM drives, USB devices, and
    so on.


    To see the media and the mount points, you use the mount command, as follows:


    ```

    # mount <ENTER>

    ```


    ```

    /dev/mapper/VolGroup00-LogVol00 / root type ext3 (rw)

    /dev/proc /proc type proc (rw)

    /dev/sys /sys type sysfs (rw)

    /dev/devpts /dev/pts devpts (rw,gid=5,mode=620)

    /dev/hda1 /boot type ext3 (rw)

    /dev/shm /dev/shm type tmpfs (rw)

    none /proc/sys/fs/binfmt_misc type binfmt_misc misc (rw)

    sunrpc /var/nfs/rpc_pipefs type rpc_pipefs (rw)

    ```'
