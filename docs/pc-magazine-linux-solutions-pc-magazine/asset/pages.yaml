  md: '# Chapter 6: Using Accounts 67


    # Note


    By default, you can create and edit real users and groups, not system users and
    groups. You can change this behavior from the Preferences menu, but make sure
    you know what you are doing if you edit system users or groups because you may
    render part or all of your system unusable.


    One last feature of the system-config-users program I should mention is the search
    filter. On large systems with hundreds or thousands of users and groups, it can
    get very tiresome to search for the one you want to edit. By typing a few letters
    and then clicking the Apply Search Filter button, the list in the tab will be
    reduced to only those that start with the search string. this graphical administration
    tool will possibly suffice for the majority of your user and group management
    needs, it is also useful to know how to perform the tasks from command line, as
    explained in later sections of this chapter.


    # Determining Your Account Information


    If you want to know your UID, GID, and which groups belong to, you can use the
    command:


    ```

    $ id

    uid=1000(knoppix) gid=1000(knoppix) groups=20(dialout),21(fax),22(voice),

    24(cdrom),25(floppy),26(tape),27(sudo),29(audio),30(dip),44(video),60(games),

    100(users),106(usb),110(scanner),115(camera),118(fuse),1000(knoppix)

    ```


    # Note


    Recall that Linux automatically creates a single-member group with the same ID
    and name as the user. In the preceding example, the UID and GID are both 1000(knoppix).


    You can also get a username as a parameter to get similar information for that
    user.

    If want to know only one piece of the account information, id has three options:
    -u, -g, and

    -G, that give you the UID, GID, or groups respectively in numeric form. Adding
    the -n option gives

    t name instead of the number, as you can see in the following code:


    ```

    $ id -u

    1000

    $ id -g

    1000

    $ id -G

    ```'
