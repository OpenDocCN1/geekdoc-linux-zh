  md: '# Chapter 15: Software Management Solutions 265


    Notice that there are two lilo packages. The first one is the package that is
    available at the first location in your /etc/apt/sources.list file. The second
    one is the package that is currently installed on your system.


    To learn what packages the lilo depends on, you can use the command:


    ```

    apt-cache depends

    ```


    To find out which particular file belongs to, you can use this command:


    ```

    apt-file search filename

    ```


    where filename is the name of the file whose package you want to find.

    To find out the names of all the files that a particular package contains, use
    the command:


    ```

    apt-file list package

    ```


    where package is the name of the package about which you want the file list.


    # Note


    You can find an excellent description of APT''s capabilities at www.debian.org/doc/manuals/apt-howto/.
    You can also find complete documentation by giving the command man apt.


    # Summary


    Both RPM and APT provide package management systems that allow the administrator
    to install, remove, upgrade, and query software packages. Both of these systems
    are roughly equivalent in terms of functionality. Which system you use is largely
    a question of the lineage of your system. If your system is Red Hat derived, you''ll
    probably use RPM. If it''s Debian derived, you''ll probably use APT.'
