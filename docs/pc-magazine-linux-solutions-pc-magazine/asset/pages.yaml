    # The Dovecot Mail Delivery Agent


    There are a number of mail delivery agents (MDAs), and they do more or less the
    same thing: They allow mail clients to connect to the server and download mail.
    None of them is terribly difficult to set up and run, so the one you choose is
    really up to you. This chapter focuses on the Dovecot server because it is relatively
    fairly and straightforward.


    # Note


    You don''t need to use an MDA if you’re reading your mail on the machine that
    your MTA is running. The MTA puts the incoming mail into a mailbox directory,
    and most Linux clients can read directly from these directories. However, if you
    want to read mail from another machine, you definitely need an MDA. Since they’re
    easy to set up anyway, you might as well do it. That way, you’ll be prepared for
    your mail server moves beyond the realm of experiment.'
