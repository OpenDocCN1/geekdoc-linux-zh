  md: '# Hide your e-mail address


    A good way to avoid spam is to minimize the exposure your address receives. If
    you are running a mail server of your own, you can create an unlimited supply
    of throwaway e-mail addresses to use for joining lists, registering for Web sites,
    and so on. Then you can recover your main address for giving out to the people
    you actually want mail from. You can also obfuscate your address when it appears
    in a public place like a Web page, by displaying the @ sign as the word "at".
    A simple trick like this can throw off spam harvesters. Another trick is to have
    your e-mail address embedded as an image instead of plain text. But making spammers
    jump through hoops to get your address also means making legitimate users jump
    through hoops to get your address. Some may decide it''s not worth the effort
    to continue if you make it too difficult.


    # Encrypt your files and protect your identity with GnuPG


    Even though it is important to protect your operating system, whatever comes to
    worst and your computer is hacked, your OS can be reinstalled. Your personal data
    on the other hand is unique and priceless. To protect your data as it sits on
    your disk, use public key encryption.

    Your identity is also valuable. If a hacker manages to break into your computer
    and steal information, all kinds of havoc could result. Public key encryption
    can also be used to create digital signatures to authenticate your identity online.
    The next part of this chapter explains how to create digital signatures and encrypt
    files and data with a public key encryption program GnuPG.


    # Trust but verify, or it''s not paranoia they''re really out to get


    It''s not good enough to set up security barricades and then just back thinking
    you are safe. You have to make security an ongoing process in order for it to
    be effective. You also cannot rely merely on technology. Some of the biggest hacks
    have been caused by the naïve or greedy of people. Be suspicious if you get an
    e-mail saying you will get a large amount of money if you only verify your identity
    by bank account number. If someone claiming to be your ISP asks for your password
    to some defence determine if he or she is telling the truth. There are many scenarios
    men can come up with to swindle. Assume nothing, trust your common sense when
    something feels fishy, educate yourself about types of scams, and dole out the
    least personal information necessary. Then you will be safest from online fraud.


    # Using GnuPG


    You come across use of public key encryption earlier in this chapter in the section
    about SSH. Id_rsa and Id_rsa.pub are the two halves of the cryptographic key SSH
    create in order to establish the identity of your user account. There is a program
    called Gnu Privacy Guard (GnuPG) that uses the same principles to implement public
    key encryption. It may be open source and free of charge, GnuPG provides cryptographic
    power that based on the research of the world''s top researchers. To follow along
    with the examples in the next few pages, install the gnupg package if it isn''t
    already present.'
  merge: -1
