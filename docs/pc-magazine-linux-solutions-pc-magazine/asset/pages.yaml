  md: '# 124 PC Magazine — Linux Solutions


    # Window behavior


    One of the things that GNOME controls is the way that windows behave. In this
    section, we look at the default way in which windows behave. If you are familiar
    with window behavior in Microsoft Windows, this will all be second nature.


    # Cross-Reference


    For more information on configuring window behavior, see Chapter 10.


    A typical window has a title bar across the top edge. In addition to the window''s
    title (which is usually the name of the file being worked on and/or the name of
    the application in which that file is open), you will also see small icons in
    the left- and right-hand corners. The title bar changes color when your window
    is active. The active window is the one that is being used. It is usually the
    one that is topmost on the desktop. Clicking on a window brings it to the front
    and makes it active. Typically, the active window has a darker title bar than
    the inactive windows, as in Figure 9-13.


    ![](img/65ef52f6e9fc73ddc3051990377c4f5b_148_0.png)


    Figure 9-13: Active and inactive windows.'
  merge: -1
  pgno: 148
- img_proc: true
  md: '# Chapter 9: Desktop Solutions


    Clicking the icon in the left-hand corner of a window brings up a menu containing
    various functions related to window. Using this menu, the window can be minimized
    (sent to the task bar), maximized (enlarged to fill the entire screen), placed
    on top, moved, resized, or closed. In addition, there are several options related
    to the workspace where the window appears. The window can be moved to another
    workspace, or it can be designated that it will always appear on the visible workspace


    In the right-hand corner, there are three buttons that provide one-click access
    to three of the above functions. Using these buttons, the window can be minimized
    (the icon with single horizontal line), maximized (the square), or closed (the
    X).


    # Managing multiple workspaces


    As identified in Figure 9-1, there is a workspace switcher on the right-hand side
    of the lower panel. In the default configuration, four workspaces are shown in
    the window. You can think of working being a second (and third, and so on) iteration
    of your desktop. It is as if you have four desktops upon which you can work. Only
    one workspace is active at any given time, and this is what you see on your screen.
    The workspace switcher shows which workspace is active (the darker section), and
    which are not. You can switch from one workspace to another by clicking one of
    the inactive workspaces. This allows you to run different sets of applications
    for different purposes while keeping your desktop uncluttered. Unless you otherwise
    specify, applications stay on the desktop when they were opened. With a little
    practice, you will see how keeping your functions segregated can really streamline
    your work.


    # KDE


    The acronym KDE stands for K Desktop Environment. If the KDE stood for anything,
    it has been lost in the mists of time. For some time, the status of KDE was controversial
    because KDE itself was distributed as free software, Qt (toolkit, a set of programming
    functions) on which it was based was not free. This led to many arguments about
    whether it was appropriate to use KDE over free Linux systems and probably delayed
    interoperability between KDE and GNOME for many years. Now, if any of these changes
    changed the license and made it free.


    Now that a great deal of interoperability GNOME and KDE has been achieved, KDE
    is not substantially different from GNOME for most practical purposes. They may
    look different and there may be cases in which their behavior might differ, but
    when viewed from the perspective of the broad strokes, they provide the same core
    functions: a virtual desktop, windows, a file manager, menus and icons, and a
    means to configure all of this.


    This section provides a brief look at the installation of KDE that is available
    on Fedora Core and compares it with its GNOME counterpart on the same system.
    The chapter then focuses on KDE as it is implemented on Knoppix.'
  merge: -1
