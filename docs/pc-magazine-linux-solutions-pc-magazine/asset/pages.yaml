  md: '# Chapter 20: Linux Solutions 349


    This time there is feedback showing which tests have failed. The possible values
    are:


    +   - S = The size of the file has changed.

    - M = The file permissions have changed.

    - 5 = The md5sum has changed. Unfortunately, rpm stores md5sums and can check
    them, it doesn''t have an option to display. Another bad decision!

    - L = The file is a symlink, which has changed to point to a different file. This
    test will fail even if the symlink is deleted and recreated pointing to the same
    file.

    - D = The file represents a device, and its number has changed. This could mean
    it is now pointing to a different piece of hardware with potentially disastrous
    consequences.

    - U = The file''s user ownership has changed. Very suspicious if this was a setuid
    program.

    - G = The file''s group ownership has changed. Again, being very suspicious if
    this was a setgid program.

    - C = The creation time has changed. This means either the file didn''t exist
    before or that the original file was deleted and a new one created with the same
    name.

    - T = The modification time has changed.


    Failure in some of these tests does not necessarily you have been hacked. Configuration
    files as /etc/passwd are almost certain to have changed. rpm -V puts a before
    the name of a file it considers to be a configuration file. It is possible for
    other files to fail a test for innocuous reasons so, don''t blindly trust the
    results of this command. Rather, use it as a basis for identifying files that
    need to be investigated in more detail.


    You can verify all the files on your computer with the -a option. This is likely
    to be a huge list, so you will want to save the results into a file to read at
    your leisure.


    ```

    $ rpm -Va > files_on_my_system.txt

    ```


    Actually, the list won''t include all of them on your system. rpm -Va excludes
    the following:


    +   - Files that were not installed using the rpm package manager or front ends
    it like yum or update, including files installed by third-party packages and files
    you installed yourself

    - Files that were autogenerated by the package when it was installed

    - Files created by the package installation


    (For instance, if you install a word processor, the documents you write with it
    are not recorded in rpm -Vs database.)


    rpm -v is not perfect, but it can be a useful audit tool; so, I recommend you
    use it.'
