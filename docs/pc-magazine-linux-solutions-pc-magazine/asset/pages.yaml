  md: '# Chapter 22: Mail Server Solutions 393


    # Configuring Mail Clients


    We discussed the configuration of e-mail clients such as Evolution and Thunderbird
    in Chapter 12. Configuring mail clients for your newly configured mail server
    is more or less the same. Every person who is receiving mail at your server needs
    to have an account on the server machine. (If you don''t want logging into the
    machine for general use, you can change your default shell to /bin/false).


    When you configure the mail clients for use with the new server, you must enter
    the POP or IMAP server of your server (that is, the incoming mail server), and
    you must also enter it the name of the outgoing mail, if your Internet connection
    allows you to send mail directly from your machine. Otherwise, you must enter
    the name of your Internet service provider''s SMTP server. The figure shows KMail
    configured to receive incoming mail from mail.example.com.


    ![](img/65ef52f6e9fc73ddc3051990377c4f5b_417_0.png)


    KMail configuration for your new server.


    If you have configured Dovecot according to the instructions in this chapter,
    you can specify either POP or IMAP as your mail protocol. Dovecot handles both.
    If you have a compelling reason to choose one over the other, you can configure
    Dovecot to use that protocol only. In that case, you need to make sure that any
    mail client you use is configured to that protocol.


    In the left-hand column some of the services have check marks next to them. These
    are the services that are configured to start upon system boot. Find the entries
    for Dovecot and Postfixthe services are listed in alphabetical order), and make
    sure they have check marks. Then, click on the File menu and select Save Changes.
    You can then exit the Service Configuration program.'
