  md: '# 242 PC Magazine — Linux Solutions


    +   - Archive Name: KDat doesn''t use this internally, but a name makes it easier
    for humans to keep track of things.


    +   - Working Folder: This is the folder in backed-up files will be restored.


    +   - Stay on one filesystem: If checked, the backup process will not follow symlinks
    (symbolic links to files) into other file systems.


    +   - Using incremental: If you''ve already done a full backup, you can save time
    and tape space by making subsequent increments of the full one. When this option
    is selected, a snapshot of the full backup is taken and updated with each incremental
    backup. Only the files that have changed since the last incremental backup are
    archived.


    +   - Snapshot file: This is the name of the snapshot file.


    +   - Remove snapshot before backup: Checking this option effectively resets incremental
    backups by deleting the snapshot file before commencing.


    Press the Apply button to save the backup profile.


    # Configuring user preferences


    KDat be configured by selecting Preferences from the Edit menu. You can set these
    options:


    +   - Default tape size: This is the default size to use when a tape to be formatted.


    +   - Tape block size: This is the default size of a block on the tape drive.


    +   - Tape device: This is the default tape device, for example, /dev/tape.


    +   - Tar command: If some reason you want to use a command other than the standard
    tar (it it must, be tar-compatible), you can set the path to it here.


    +   - Load tape on mount: When this option is set, KDat sends a load command to
    the drive before mounting a tape.


    +   - Lock tape drive on mount: Setting this option disables a tape drive''s eject
    function while a tape is mounted.


    +   - Ej tape on unmount: Setting this option automatically ejects a tape from
    the drive when it is unmounted.


    +   - Variable block mount: If this is set, KDat attempts to increase efficiency
    by changing the tape''s block size to a variable amount if the drive supports
    it.'
