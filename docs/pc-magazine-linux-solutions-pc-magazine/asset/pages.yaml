  md: '# Chapter 20: Linux Security Solutions 355


    # Creating a key


    The actual name of the GnuPG program is gpg. It has many options to perform all
    the tasks needed to decrypt and encrypt. The first step in GnuPG is to create
    a public and private key pair. It is done using gpg --gen-key option:


    ```

    $ gpg -gen-key

    This program comes with ABSOLUTELY NO WARRANTY.

    This is free software, and you are welcome to redistribute it under certain conditions.
    See the file COPYING for details.

    ```


    ```

    gpg: directory ''/home/jaldhar/'' created

    gpg: new configuration file ''/home/jaldhar/.gnupg/gpg.conf'' created

    gpg: WARNING: options in ''/home/jaldhar/.gnupg/gpg.conf'' are not yet active
    during this run

    gpg: keyring ''/home/jaldhar/.gnupg/secring.gpg'' created

    gpg: keyring ''/home/jaldhar/.gnupg/pubring.gpg'' created

    Please select what kind of key you want:

    ```


    GnuPG starts by creating a gnupg directory in your home directory and populating
    it with some files. The gnupg.conf file contains various options for gpg, some
    of which will be changing. The pubring.gpg file contains your public key and secring.gpg
    contains your secret key. The public key is the part that gets sent to other people.
    The secret key should under no circumstances revealed to anyone. GnuPG asks some
    questions:


    +   (1) DSA and Elgamal

    (2) DSA (sign only)

    (3) RSA (sign only)


    Your selection:

    The first question is about which cryptographic cipher to employ. In most cases,
    you will want to accept the default choice, 1.

    The next question asks how long you wanted the generated key to be:


    DSA keypair will have 1024 bits.

    G-E keys may be between 1024 and 4096 bits long.

    What keys do you want? (2048)


    For every bit in length, the key becomes exponentially harder to break it so picking
    the largest possible size is the best choice, but the flip-side is that longer
    takes longer to encrypt and decrypt use more processor to do. The suggested default,
    2048, is a good compromise.

    Added security can be obtained in certain situations by having a key automatically
    invalid after some time. The next question asks if you want to set an expiration
    date on your key. Unless you have some special scenario in mind, you should choose
    0 to make the key valid indefinitely. You are asked to confirm your choice.'
