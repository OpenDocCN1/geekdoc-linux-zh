  md: '# Solutions for Common Backup Issues


    Rounding out this chapter, here are solutions to some situations you may face
    when backing up your system.


    # Deleting files


    The unthinkable happens, and an important file gets deleted. Can it be deleted?
    Sadly, the answer for the most part is no. The standard Linux file system ext3
    is engineered in such a way that in the event of a crash it can be easily restored
    to a consistent state. This is a good thing—a very useful feature indeed—but when
    you delete a file it is marked as deleted (as Windows'' FAT system does). Earlier
    file systems marked a deleted file as "space for reuse" in limbo from which, if
    you act quickly enough, it could be recovered. Your only hope with ext3 is to
    use the grep command to search through the raw data on the disk seeing if you
    recognize any sectors that belonged to your file and, when you do, laboriously
    stitch them together. This is pretty difficult for a text file and right impossible
    for binary files.


    The various GUI environments available for Linux usually implement a trashcan
    for Windows or Mac OS. When you delete files using the file managers provided
    by those environments, the files are copied to that trash and truly deleted only
    when the trash is emptied. This doesn''t work if the program you use delete the
    file wasn''t designed for that GUI. So keep those backups current!


    # Backing up OpenOffice.org documents


    People who use Linux at their job or school are mostly concerned with backing
    up the documents they create during the course of their work. If you are one of
    these people and you are creating documents with the popular OpenOffice.org office
    productivity suite, there are some options you can select to protect your work
    from a delete gone astray, a sudden power failure, or similar mishap. One such
    option is the automatic save feature. From the Tools menu, select Options -> Load/Save
    -> General. You will see a dialog box like the one in Figure 14-5. By selecting
    the AutoRecovery information every checkbox and selecting a time in minutes, OpenOffice.org
    is configured to periodically store your document in the event of a crash.


    Another useful option in this dialog is Always create backup. When this option
    is selected, every time you save your document, OpenOffice.org makes a copy of
    the file with the same name but the extension .BAK in a directory, which by default
    is home/.openoffice.org/2/user/backup/. (You can change it by selecting OpenOffice.org
    -> Paths from the Options dialog.) Unfortunately, OpenOffice.org does not keep
    a sequence of backups; if there is already a .BAK file for the document, it gets
    overwritten when a new backup is made.'
