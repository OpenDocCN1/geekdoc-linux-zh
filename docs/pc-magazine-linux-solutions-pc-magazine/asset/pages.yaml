  md: '# Chapter 16: Installing and Removing Hardware 273


    friendly. Therefore over the years, Linux has accumulated a good number of utilities
    that provide various aspects of your system and report what they find. These utilities
    were originally developed to help you identify the hardware communicating through
    various buses and interfaces in your system and provide status information that
    helps you determine whether hardware is actually doing more than just saying ''yes,
    I''m out here''.


    The next few highlight some of the best-known hardware-related utilities that
    are provided with Linux distributions. Because most of the hardware-related Linux
    utilities are associated with a specific system communication bus or interface,
    the following sections are organized by interface type.


    # Locating, listing, and activating PCI devices


    Most of the slots inside modern computers are PCI (Peripheral Component Interconnect)
    slots, where older PCI drivers may not be fully integrated with the hotplug subsystem
    discussed in earlier chapter. If you''re lucky; after shutting down your system,
    opening it, inserting a new PCI card, everything up and rebooting, your Linux
    system will recognize the new card and associated driver. However, if your system
    cannot identify the device correctly or was not built with support for the associated
    driver, you will need to get some information about the device.


    Linux provides two primary utilities for identifying the PCI devices in your system:
    lspci and scanpci. These utilities and the differences between them are discussed
    in the next two sections.


    # LISTING PCI BUS DEVICES


    The lspci utility scans the PCI bus and lists all of the devices that it finds.
    The lspci utility does a good job of locating and identifying PCI devices in a
