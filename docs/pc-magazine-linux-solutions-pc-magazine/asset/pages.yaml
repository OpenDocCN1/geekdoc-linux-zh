    # # Antispam features


    Unsolicited e-mail, or *spam*, is a huge problem. Some people receive 20 or 30
    unwanted messages for every legitimate e-mail, so some kind of sorting for mail
    is a must. Many e-mail programs, including Evolution and Thunderbird, use adaptive
    or Bayesian filters for junk mail. This is a statistical method using the Bayes
    algorithm where you train the filter by showing it messages you consider spam
    and which ones you want to read. Over time, the filter adapts to the unique style
    of spam you receive and becomes increasingly accurate in predicting whether an
    incoming message is junk or unwanted. The number of false hits in a well-trained
    Bayesian filter is impressively low. Unfortunately, the method is not foolproof.
    In the arms race between spammers and antisammers, the enemy is getting more and
    devious in finding ways to make messages seem innocuous. Still, using an adaptive
    filter provides welcome relief to users bombarded by junk mail.


    To enable filtering on Evolution, open the Evolution Settings by selecting Edit
    → Preferences, and then click the marked Junk. Click the checkbox marked Checking
    incoming mail for junk. You are also given the option to check a box marked Include
    remote tests. This applies a set of tests that are maintained in remote locations
    and may include filtering criteria beyond what you can maintain locally. Applying
    these filters may make filtering slower but will also make it more accurate.'
