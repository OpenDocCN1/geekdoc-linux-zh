  md: '# Chapter 6: Using Accounts


    # The Superuser


    As mentioned previously, UID 0 is special. This account is known as the superuser
    account, and it has the power to override any other user or group restrictions.
    Because of this feature, it is the account that is used for systems administration
    tasks such as installing and removing software, stopping and starting the system,
    and every other job that requires powers beyond that of a standard user. The superuser
    is traditionally named root, so you will also hear it referred to as the root
    account. There is nothing special about the root name. You could name the superuser
    account notroot and it would still be the superuser. Or you could create a new
    account root with UID 8192. It would still be a superuser (You could run into
    trouble creating it if your real superuser account is also named root, as you
    cannot have two accounts with the same name). Only assigning a UID of 0 makes
    an account superuser.


    The unbound power of the root account makes it very dangerous. Any runaway command
    could damage the system repair. If access to the root account gets into the wrong
    hands, the system is wide open and defenseless against any nefarious purpose.
    (Being hijacked by this is referred to getting rooted.)


    Needless to say, use as few as possible should be able to use the root account.
    Even when you can use it the root account during해서 do not so for mundane activities
    such as compiling programs, reading e-mail, or surfing the Web. Rather, you should
    have a separate user account for those types of things and switch to the superuser
    account only when performing essential administration tasks.


    # Cross-Reference


    See Chapter 13 for more information on the superuser.


    # Administering Users and Groups Graphically


    Now that you understand the basics of users and groups, you might want to add
    some to your system. With the exception of few CDs like Knoppix, which come preconfigured,
    all Linux distributions will set up the root account during installation. Figure
    6-1 shows a screen from the Fedora Core 4 installer. Because most of the features
    of the root account such as the name, user and group IDs, and home directories
    are standardized, the only information the installer needs from you is a password
    (which you have to enter twice to guard against typos).'
