    # Controlling access to cron


    Access to cron is controlled in a similar way that used to control access to at.
    If you wish to deny a user access to the cron program, you can create a file /etc/cron.deny,
    and only those users whose names appear in that file will be allowed to use cron.


    # The batch command


    The batch command is an alternative to cron and at. Instead of running a program
    at a specific time, it runs the program whenever the system load drops below a
    particular level. If you''re on a busy system and planning to run a job that will
    a lot of system resources, could run the job using at to start the job at a time
    which you believe the system load will be low. Alternatively, you can use batch
    to run the job at the first opportunity that the system load is low. The advantage
    of using batch is that you know what the actual system load will be when you start
    the job. The advantage of using at is deny


    To use batch, give your command in this form:


    ```

    batch <command>

    ```


    It should be noted that batch is really just a front end to at. When you use the
    batch command to schedule jobs, it goes into a queue just like any other job and
    can be viewed with the atq command.


    # Summary


    Timed execution can really alleviate the ted involved in certain repetitive tasks.
    It can also make system-intensive jobs much less onerous to others to use. The
    at and cron utility allow the user to schedule jobs at future times or when system
    resources permit. The at and batch commands are best suited to one-time operations,
    while the cron utility is better suited to situations where you need to run a
    command periodically. The cron utility is managed by means of the crontab command.'
