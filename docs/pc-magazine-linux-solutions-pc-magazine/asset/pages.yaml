  md: '# 348 PC Magazine — Linux Solutions


    The rest of the advisory consists of file names for the updated packages along
    with md5sums, which allow you to check whether the package has been tampered with.
    This is detailed in the next section of this chapter.


    In the information arms race between hackers and users, using tools such as vendor
    security lists, bugtracking systems, CVE, and NVD is vital for making sure you
    stay ahead of the game.


    # Check for tampering with checksums


    How do you know the software you downloaded is actually what uploaded? FTP sites
    and Web servers can be hacked and their contents replaced by seemingly legitimate
    codes that contain viruses or Trojans. Luckily, mathematics can come to the rescue.
    There are certain mathematical algorithms that can be used to check each byte
    of a file to create a checksum —a long number that creates a unique signature
    for the file. If even one byte of the file is changed, the checksum changes to
    an entirely different number. By publishing the checksum for the file in some
    secure location, a vendor can give you a way to verify the integrity of their
    downloads.


    A popular algorithm called MD5. When applied to a file, it produces a 128-bit
    checksum (usually displayed as 32 hexadecimal digits for brevity) it is often
    referred to as md5sum. You can check md5sums on the command line with a program
    called md5sum. Assume you downloaded the updated kernel-2.6.13-1._1532_FC4.i586.rpm
    mentioned in the previous section and you want to check its md5sum. You would
    do:


    ```

    $ md5sum kernel-2.6.13-1._1532_FC4.i586.rpm

    e6985094406a4d0e3ebca7e9e5733ad kernel-2.6.13-1._1532_FC4.i586.rpm

    ```


    As you can see from the advisory, this is the correct md5sum so you can trust
    that the file has not been tampered with.


    There is another checksum algorithm called SHA1, which is in use though it is
    not as popular as MD5. A command-line program called sha1 lets you verify SHA1
    checksums in the same way as md5sum.


    # Check for tampering with rpm


    You can also use rpm to verify the integrity of an installed file with the -V
    (verify) option. Say you want to verify /bin/cat:


    ```

    $ rpm -Vf /bin/cat

    $

    ```


    Well, wasn''t that informative was it? Due to what I consider a bad design decision
    by the developers of rpm, a file that passes all verification tests doesn''t give
    any output. Had this file actually changed (the /bin/cat binary myself) you would
    have got output like this:


    ```

    $ rpm -Vf /bin/cat

    S.5....T. /bin/cat

    ```'
