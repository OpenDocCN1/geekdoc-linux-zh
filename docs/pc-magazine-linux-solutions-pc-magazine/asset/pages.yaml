    \ other\nthings well, so be sure to take this into account when deciding how much\
    \ memory you want to\ndevote to the cache.\n\nA note on terms: You will notice\
    \ that the comments refer to \"in-transit\", \"hot objects\",\n\"negative-cached\"\
    \ objects. It is worthwhile to know what these are. In-transit objects are objects\n\
    at are actively being accessed by Squid. As they are the most important types\
    \ of objects. they\nneed to be moved quickly and efficiently and, therefore, they\
    \ are the ones with the highest priority\nwhen it comes to being kept in memory.\
    \ Hot objects provide a performance advantage in that they do not have to\nbe\
    \ fetched from remote sites they are accessed. Negative-cached objects are things\
    \ like the\nerror codes one when accessing a nonexistent Web page. Squid stores\
    \ these so that exter-\nrequests are not made for inaccessible objects.\n\nWhen\
    \ the memory cache fills, Squid begins to store objects on the machine's hard\
    \ drive.\nSquid uses complex logic to determine objects which are moved to the\
    \ disk and which remain\nmemory, and there are a few parameters that bear on what\
    \ happens here. In all likelihood, you\nshn't need to change these settings, but\
    \ you should be aware of them:"
