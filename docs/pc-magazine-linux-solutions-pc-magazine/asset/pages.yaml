    The output of the uname -r command shows the kernel on your system is based on
    the 2.6.11 Linux kernel, with a minor patch level of 21 and 9 subsequent patches.
    The -default at the end is an option string that anyone who compiles a kernel
    can add to provide additional information. On your system, this is the default
    kernel provided by the distribution vendor. The system on which I run actually
    has a number of kernels, so /lib/modules contains subdirectories of loadable kernel
    modules for each of the available kernels. However there is a subdirectory that
    matches the release name of the version of the Linux kernel that is currently
    running on your system.


    The decision to compile a device driver into the kernel or build it as a loadable
    kernel module is largely up to the vendor who provides the Linux distribution
    that you are using. Some device drivers, such as the device drivers that the kernel
    needs to read the type of disks that your system contains (IDE, SATA, SCSI, and
    so on) and the device driver for the type of file system used to organize information
    on your partitions, must be built into the kernel. Device drivers for other types
    of devices, such as Ethernet cards, USB devices, FireWire devices, and so on,
    are offered as loadable kernel modules because this keeps the kernel as small
    as possible, while still providing the flexibility to enable your Linux system
    to use and access those devices.

    The ability of Linux to use device drivers as loadable kernel modules is analogous
    to the Microsoft Windows systems ability to install device drivers from CDs (or
    floppies) that accompany many hardware and peripheral purchases. Loadable device
    drivers are just not a good idea in terms of effectively using system resources
    by keeping the kernel as small as possible. Being able to load device drivers
    on demand is also a good idea for hardware vendors because this enables them to
    ship drivers for their devices that are independent of a specific Linux distribution.
    Many hardware manufacturers enable you to download device drivers in source or
    binary formats from their Web sites, which enables them to provide updates without
    requiring that you rebuild your system''s kernel'
