    Your theme changes every time you click on a new one.


    # INSTALLING NEW THEMES


    A default installation of Fedora Core comes with only a few themes, and for most
    the part, they are fairly spare. These themes are designed for simplicity and
    ease of use. There are, however, literally hundreds of themes available; run the
    gamut from spare and useful to themes that are extremely entertaining, if tough
    on the eyes.


    The central clearing for GNOME themes is in the Art section of the GNOME Web site,
    located at http://art.gnome.org. The themes are broken out into several types:


    +   * Application: These are themes that control what buttons and checkboxes look
    like, what windows and panels are, and so on.


    +   * Window Border: These themes control the outlines of windows. That is, they
    determine whether corners are square or rounded, what color active and inactive
    title bars are, and more.


    +   * Icons: Here you can find sets of icons that give a unified look.


    +   * Login Manager: Login Manager themes determine what the initial login screen
    session is starting up.


    +   * Splash Screen: Splash screen controls what you see while your GNOME session
    is starting up.


    There is also a sixth category: GTK+ Engines. These themes are primarily used
    to develop others. That is, if you want to create themes from scratch, you might
    want to investigate this, but the casual user can ignore this category.


    You will find themes in several categories that have the same name. In cases like
    this, you can be reasonably assured that they form parts of an overarching theme.
    That is, an application theme with a particular name is designed for use with
    a window border theme of the same name.


    To install an application theme, first download the theme. Do not extract the
    archive — it needs to be in, compressed format. Open the Theme Preferences window
    and click the button marked Themes. This opens the Theme Details as shown in Figure
    10-8.


    The Theme Details window should be open to the marked Controls. If a different
    theme is selected, click the Controls tab. Next, find the icon for the theme that
    you downloaded. (If you didn''t download it to the desktop, open a Nautilus window
    and navigate to it.) Click on the icon and drag it onto the Theme Details window.
    Your installation of the theme is confirmed. Click OK to confirm the window. You
    should now see the name of the theme you downloaded in the pane on the left side
    of the Theme Details window. It may already be highlighted. If it''s not, you
    can click on it to highlight it. Once highlighted, the controls on your applications
    should change to display the new theme''s artwork.'
