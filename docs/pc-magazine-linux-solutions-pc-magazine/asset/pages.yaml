    # Some Common Useful Commands


    Now you''ve seen the proper way to give a command, here are a few commands you
    will probably find yourself using on a day-to-day basis. These commands are really
    the bare minimum for getting by in a text-based environment.


    # pwd


    The pwd command is given by itself without options or targets. The command''s
    name stands for working directory, and the command does just. It tells you the
    directory that you''re currently in.


    ```

    [joe@hamachi ~]$ pwd

    /etc

    ```


    # cd


    The cd (change directory) command takes as an argument the name of the directory
    to which you wish to move. So, for example, if you''re in your home directory,
    and you want to move to the /etc directory, you give the command


    ```

    cd /etc

    ```


    After you''ve done this, assuming there are no problems (such as trying to move
    into a directory that doesn''t exist or that you don''t have permission for),
    the directory that you''ve used as the target will become the current (working)
    directory.


    # Note


    To understand the pwd and cd commands, it''s helpful to understand the concept
    of the current directory. Sometimes called the working directory (as per the pwd
    command), the current directory is the directory that you are at any given time.
    When you first log into your account, or open a terminal window, you''ll be in
    your home directory. The precise location of your home directory may vary from
    system to system, but usually it will be something along the lines of /home/username
    or /user/home/username or something like that (username in this context represents
    your username — the name that you use to log into your computer). To be in a directory
    means that any command you assume the current directory as a point of reference.
    If you give the ls command without arguments, for example, you will get a listing
    of the current directory.'
