  md: '# 318 PC Magazine — Linux Solutions


    ![](img/65ef52f6e9fc73ddc3051990377c4f5b_342_0.png)


    Figure 18-21: The Add NFS Share window.


    You will need to start the NFS server for the new configuration to take effect.
    You can do this by using `system-config-services`, as you did for SAMBA (look
    for the service called nfs), or by opening a terminal and giving the command (as
    the superuser):


    ```

    /etc/rc.d/init.d/nfs restart

    ```


    At this point you should be able to access the share from the remote machine.


    # Caution


    As noted before, this command works only if your startup scripts are located in
    the `/etc/rc.d/init.d` directory. If they''re located elsewhere, you''ll need
    to change the command''s path to reflect that.


    # TEXT MODE METHOD


    Like SAMBA, the NFS server can also be configured via text mode. You do do this
    by editing the `/etc/exports` file. Open that file in a text editor, and add the
    following line. (You can put it any-where; I usually put such lines at the end
    of the file.)


    ```

    /nfs

    192.168.0.12(rw)

    ```


    Here, `/nfs` is the directory you want to export, `192.168.0.12` is the machine
    that will be allowed to access the share and `rw` stands for read/write, which
    is the type of access you want to allow to the share. (Read-only would be designated
    `(ro)`.) Save the file, and restart the NFS server as you did in the previous
    section. You should now be able to access the share from the remote machine.'
