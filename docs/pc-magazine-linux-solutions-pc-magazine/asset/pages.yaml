  md: '# Chapter 15


    # Software Management

    Solutions


    One area in which the Windows and Macintosh crowds have somewhat easier than Linux
    is the area of installing software. Most Windows or Macintosh software packages
    come in the form of binary packages that either install themselves or interface
    with a standard program like Install Shield.


    Linux, by contrast, has two major package managers, both of which require knowledge
    on the part of the user. The two major package management systems are RPM, which
    is most often found on Red Hat-derived systems, APT, which is usually found on
    Debian-derived systems. In addition, it is possible to install software from source
    code, which is the set of raw instructions written by the programmer.


    While software management can be a bit more complicated on Linux, the package
    management systems do offer some advantages over Windows and Mac counterparts.
    These systems, generally, make it very simple to keep track of what''s installed
    on your system, to install software over network connections, and to verify the
    identity of software packages.


    # RPM


    RPM originally derived its acronym from the Redhat Package Manager, which indicates
    its origin as a component of Red Hat Linux. As Red Hat became increasingly popular,
    RPM was adopted by other systems as well, and eventually development of RPM became
    somewhat independent of Red Hat. RPM officially stands for Package Manager. Although
    a good deal of the development is still done by Red Hat, RPM is free software
    and can be used on any system.

    RPM names usually follow a strict naming convention. Generally, you''ll see something
    like:


    ```

    cdrecord-2.01.1-5.1386.rpm

    ```


    There are five parts to this package identification scheme. First is the package
    name, in this case, cdrecord. This is usually, but not always, the name of the
    program as well as the name of the package. Sometimes the name of the package
    differs from the name of the program; this often happens'
  merge: -1
  pgno: 273
- img_proc: true
  md: '# 250 PC Magazine — Linux Solutions


    the package includes more than one actual program. For example, on Red-Hat systems,
    there is usually a package called utils that includes a number of small programs
    for working with binary files. Since the programs are small, they are grouped
    together in one package.


    The second part of the package name is the version number. In this example, the
    version number is 2.0.1. Versioning schemes are no means universal, and a software
    developer can choose any version-numbering scheme he she wants. The only constant
    is that a higher number indicates a later version of the package.


    Third is the build, in this case, 5. The build number indicates the number of
    times the package has been built from the source code. In most cases, the build
    number is not important, but it''s included in the package name if there was a
    problem with a certain build, the package may require a new one.


    Fourth is an identifier for the CPU architecture, in this case i386. This indicates
    that the binary is built to run on an Intel 386 or compatible system. You may
    be thinking that it''s a long time since anyone ran a 386 for any serious purpose,
    but the Intel x86 series is backward-compatible. That that a binary is built to
    run on a 386 also runs on a 486, Pentium, P2, and P3, and so on. Also these run
    on the AMD processors, which are Intel-compatible. The only caveat about architecture
    designations is that you should be certain that the architecture of your system
    is the same as or higher than the architecture designation of the package. For
    example, a package labeled with the architecture i586 will run on a Pentium or
    later CPU, but it will not run on a 386 or 486 machine.


    Finally, you have the package suffix, .rpm. This designates that the file is,
    in fact, an RPM package. The RPM program will not work on a file that does not
    have this suffix.


    # Acquiring the software packages


    In theory, acquiring software couldn''t be easier: simply find a site and download
    the package. In practice, it can be a little more complicated. Some packages are
    built with a specific distribution, and a specific version of that distribution
    in. In some cases, you''ll need to make very certain that you have the correct
    package for your distribution. If you don''t, you may have problems running or
    ever installing.


    How is this possible? There are several reasons a package might not work on a
    given distribution. First, an RPM package usually comes not with the program in
    question but also with a set of files that support that program. Configuration
    files and documentation are included along with the program binary. If your distribution
    expects these files to go in a certain location, and the packages to put somewhere
    else, you may have an issue of dependency. Some programs rely on having other
    programs or files in place for their proper functioning. These dependencies are
    listed in the RPM package, and when you attempt to install a package, the RPM
    program checks to see if all packages on the dependency list are installed. If
    one or more of them is missing, you get an error message, and the package won''t
    be installed. If your distribution has the YUM utility, you can avoid this. See
    the section on YUM later in this chapter.


    So how do you deal with this? The best thing to do is to find a download that
    is specific to the distribution and version you''re using. For example, if you''re
    using Fedora Core 3, you can go to fedora.redhat.com, in the download section
    for a mirror site that carries the list of packages for Fedora Core 3, and download
    the package you need from there. In a pinch, you might be able to'
  merge: -1
  pgno: 274
- img_proc: true
  md: '# Chapter 15: Software Management Solutions 251


    use a package from the Fedora Core 4 (FC4) set, there''s a good chance you''re
    going to run into a dependency issue, the packages for FC4 be expecting more-recent
    versions of software. Generally; look first to the Official Web site for your
    distribution. You can usually find what you''re looking for there.


    # Installing and upgrading with RPM


    Imagine that you''ve downloaded a package named foobar-1.0-i386.rpm and you''re
    ready to install it. In this example, foobar is the name of the package, 1.0-1
    are version numbers, and i386 is the architecture (in this case Intel 386, meaning
    PC-type processors). You can install an RPM package from any directory, but it''s
    best to keep the packages you''ve downloaded in a central location. You can use
    an already existing directory, or you can create one for this purpose. To install
    this file to a directory called /RPM, for example give the command to become root,
    and then give


    ```

    rpm -i /RPM/foobar-1.0-i386.rpm

    ```


    # Note


    / RPM directory needs to be writable by nonroot users if you want to be able to
    download packages without assuming superuser powers. From a security standpoint,
    it''s probably not to download things as root, so make sure that you have regular
    user access to whatever directory you''re using to download your packages into.


    The -i option stands for install. If your shell prompt returns without giving
    you any error messages, the package was installed successfully. A somewhat informative
    response is generated by using this format:


    ```

    rpm -ivh foobar.1.0-i386.rpm

    ```


    The -v option is to specify that you want verbose output. RPM is doing. The -h
    option tells RPM to print a line of hash characters (#) as the installation is
    progressing, to simulate the progress you often get in graphical applications.
    Neither of these options is critical, but they do provide feedback to make for
    less suspense. Using this form of command, you should see output that looks something
    like this:


    ```

    Preparing... ####################################################### [100%]

    1:foobar ####################################################### [100%]

    ```


    To uninstall the package, use this command:


    ```

    rpm -e foobar

    ```'
  merge: -1
  pgno: 275
- img_proc: true
  md: '# 252 PC Magazine — Linux Solutions


    The -e option stands for erase. The developers chose to use "erase" rather than
    "uninstall" to avoid confusion with the upgrade (-U) option. In this case, you
    specify only the name of the package, not the file of the original package you
    used when you installed the package. Once installed, the package name is entered
    into RPMs database, and RPM keeps track of the version number and other details.


    If you attempt to install a package that has already been installed on your system,
    your attempt fails, and generates the error message


    Package foobar is already installed.


    This is true even if you are trying to install a newer version of the package,
    so to override this, you need to use the upgrade option, -U. You can use the upgrade
    option with the additional options that you used with the -i option, like so:


    ```

    rpm -Uvh foobar

    ```


    You can do this if a previous version of the package is not installed, in which
    case the -U option ends up functioning exactly the same way as the -i option.
    For this reason, some people will use the -U option all the time, regardless of
    whether the package was previously installed.


    # Caution


    Important: Don''t use the -U option to install a new kernel. Always leave yourself
    a way to back up to an older kernel. Always install kernel packages using the
    -i command.


    # Note


    The name of an RPM file not be local. RPM can install a package file over a network
    — even the Internet. To this functionality, you can specify the RPM file as a
    URL. So, for example, suppose you have a download site with the URL http://www.rpm4u.com,
    and you want to install a file called foo.rpm that resides in the directory /newrpms.
    You can install this file with the following command:


    ```

    rpm -ivh http://www.rpm4u.com/newrpms

    ```


    Now, suppose you get foobar version 1.0 installed, and you want to upgrade to
    version 1.1 (which you''ve already downloaded). You can do it with this command:


    ```

    rpm -U foobar-1.1-1.i386.rpm

    ```


    In this case, the new package replaces the old one. There is no need to uninstall
    the old package.'
  merge: -1
  pgno: 276
- img_proc: true
  md: '# Chapter 15: Software Management Solutions


    # Verifying a package with RPM


    If you are concerned about the authenticity of a package, if you want to make
    sure that the package you''re getting is the one that was sent by the packager,
    RPM gives you a way to verify the integrity of what you download. Why should you
    be concerned about this? It is possible that malicious code could be inserted
    into a program, which then gets packaged and sent to users. This, for example,
    provide a back door for hackers to gain entry into your system or compromise your
    security in this ways.


    How much of this depends on how sensitive your system is and on what kind of software
    you are installing. For example, if you''re installing a processing program on
    a machine that has a firewall, it probably won''t be too much of it. If you''re
    installing a server on a machine that is the firewall, it''s probably critical.


    In any case, verifying is easy, so there is really no reason to worry.

    The first thing you need to do is import the public key of the packager. Of course,
    this is only possible if the packager provides a public key and uses it to sign
    packages. This is always the case with Red Hat packages. Red Hat provides its
    public key in /usr/share/rhn/RPM-PGP-KEY. In the case of other distributions,
    you may need to download the key from a Web site or FTP server. So that you can
    recognize a public key when you see one, here''s what Red Hat looks like:


    The public key can be used to verify RPM packages built and signed by Red Hat
    Software using the GNU GPG package. Questions about this key should be sent to
    security.redhat.com.


    ```

    ----- BEGIN PUBLIC KEY -

    Version: GPGv1.0.0 (Linux)

    Comment: For info http://www.gnpg.org.

    ```


