  md: '# Chapter 12: Internet Solutions in Linux 199


    # DECRYPTING RECEIVED MAIL


    Decrypting e-mail that you receive is easy. When you open the message, you are
    prompted for your GnuPG passphrase. Type it in, and the message is decrypted.
    You can see a banner at the bottom indicating GnuPGs status for the message (usually
    something like Valid Signature/Encrypted).


    # Instant Messaging


    Instant messaging is a technology that has become very popular over the past years.
    Instant messaging allows you to send a message to another user (provided that
    they use the same instant messaging service as you do) and have appear on their
    screen instantaneously. Most of the instant messaging services provide clients
    for Microsoft Windows but have largely left Linux and Mac users out. Fortunately,
    independent developers have stepped in to fill the gap.


    There are several instant messaging clients that exist for Linux. In this, I describe
    GAIM, the one that is bundled with GNOME, and the default client for Fedora Core
    and Knoppix, but almost any IM client will operate in an identical fashion.


    # Getting an account


    To use an instant messaging service, you first need to get an account. To do this,
    you visit that service''s Web site and create an account. Most services are free,
    and you can get an account simply by filling out some information. You will need
    to choose a username and password. Once you''ve done all, you are ready to set
    up your account.


    # Which IM Service?


    Instant messaging services are distinct from the software that you use. While
    it is certainly true that if you use AOL, you can use a client of your creation,
    you are not required to do so (AOL has a version of its messenger for Linux).
    For example, GAIM is a messenger program that works the AOL service but is not
    created or produced by AOL. It is an independently produced piece of free software
    that does much the same as AOL''s, but it is distinct from it. You can use any
    instant messenger client as it supports the protocol used by the service that
    you want to use.


    Even though instant messenger have been around for a while, and even though most
    of them are free, the service remains balkanized. That is to say that most of
    the services do not interoperate. If you have an account on the AOL Messenger
    service (AIM) and your friend has an account on Yahoo, you will not be able to
    talk to each other. This means for practical purposes, you will probably end up
    making your decision based on whichever service most of your friends or colleagues
    use.


    Fortunately, GAIM and a number of other IM clients are able to support multiple
    protocols at the same time. This means you can be logged into more than one service
    simultaneously. If you have a number of friends spread out disparate services,
    the solution may well be to simply get an account on each service and run them
    together. The only drawback is that you will not be able to set up group chats
    among people on multiple services.'
  merge: -1
