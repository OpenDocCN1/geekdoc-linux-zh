  md: '# Chapter 9


    # Desktop Solutions


    ![](img/65ef52f6e9fc73ddc3051990377c4f5b_137_0.png)


    The typical user-oriented Linux distribution comes with one of two major desktop
    environments: GNOME or KDE. In many distributions both environments are provided
    and the user can choose which she wants to use, but there is generally a default
    desktop, which is what developers of distribution intend to be. The specific desktop
    one used was, at one time, an object of almost religious adherence; there were
    technical and licensing differences between the two until for granted. As of this
    writing, there has been a great deal of convergence and cross-pollination between
    the two.


    What is a desktop environment? Briefly, the desktop environment provides many
    services that can easily be taken for granted. We become so used to doing things
    like dragging files from one folder to another that it''s easy to forget these
    are not core functions of an operating system. The desktop environment provides
    a consistent look and feel for applications, controls the windows are displayed,
    and provides an infrastructure for managing files and activities. GNOME and KDE
    also offer suites of applications that operate gracefully.


    # Note


    Although KDE and GNOME rule the root when it come to desktops, they''re not the
    only game in town. There are a number of other systems available. Most of these
    systems do not have all the bells and whistles that have made GNOME and KDE popular,
    but they find a niche among users who want graphic-based functionality without
    the intensive memory and CPU usage that comes with the most fully featured systems.
    If you are interested in finding out more about alternatives to GNOME and KDE,
    go to http://freshmeat.net and click Browse then Desktop Environments.


    In this chapter, I get started on the GNOME and KDE desktops and take you on a
    quick tour of some of the most essential applications you''ll need.


    # The X Window System


    It wasn''t all long ago that Linux didn''t have a graphical user interface at
    all. Linux was developed to be a system that worked like Unix, and most Unix users
    were used to entering commands textually. Developing a GUI simply wasn''t a priority
    in the early going. However, once Linux''s user began


    113'
  merge: -1
  pgno: 137
- img_proc: true
  md: '# 114 PC Magazine — Linux Solutions


    to expand GUIs for personal computers became increasingly common, Linux developers
    began to take on the task of creating a viable desktop on Linux. Unsurprisingly,
    they began by adapting systems that were already in existence, beginning with
    the X Window System.


    By the most popular graphical interface in the Linux world is the X Window System,
    or X (but never Windows), originally developed at MIT but not maintained by the
    XOrg (www.x.org/). X has an interesting architecture. Programs designed to work
    with it (called X clients) do not actually draw their elements, as icons, windows,
    or menus, but deliver such actions to a program called X server. The X server
    interfaces with graphics cards, mice, and other hardware and sends requests to
    them. X clients and servers do not have to run on the same machine; they can run
    over a local area network or the Internet.


    X also operates out the task of window management. Moving, resizing, and otherwise
    labeling windows is left to a special X client called a window manager.


    # GNOME


    GNOME is an acronym for GNU Object-Model Environment. It originated as an effort
    to create a free software desktop environment from scratch. Over the years it
    has developed into a good-looking and robust system, with a full-featured suite
    of applications. From the beginning, GNOME''s emphasis has been on usability rather
    than number of features. Consequently, GNOME applications have tended to be small
    and simple. On the other hand, there are a lot of them.


    +   GNOME, like KDE, sits on top of the X Window System, and uses the infrastructure
    provided by X to accomplish many of its functions.


    GNOME is the default system on Fedora Core, which is used for the examples in
    this section. Fedora''s desktop isn''t pure GNOME. Like almost else in the Linux
    world, GNOME can be configured in an almost infinite number of different ways,
    and the Fedora developers have tweaked GNOME to suit their own preferences. In
    fact, the only way to get GNOME is to download the packages and install them yourself.
    This is tedious, time consuming, and more than not, rather difficult. And even
    if you were to do it, all you get is the GNOME developers'' idea of what a GNOME
    desktop should look like, which is likely no better than the distributions''.


    # Cross-Reference


    In Chapter 10, I show you how to customize your desktop to create something that
    looks and works the way you want it to.


    # The GNOME desktop


    Your GNOME session begins when you log in. With any other multiuser system, you
    will need to enter your username and password at the greeting screen. When you
    start your GNOME session, you should see a desktop similar to the one shown in
    Figure 9-1.'
