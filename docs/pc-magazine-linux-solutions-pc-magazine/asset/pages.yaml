  md: '# Chapter 14: Backing Up Data 241


    # Performing a backup


    The first step is to select some directories to back up. KDat provides several
    ways of doing this. Expand the local file in the tree view on the left side of
    the screen. You can see each folder and file in the root folder of your file system.
    Each of these folders can be expanded to show the folders and files beneath it,
    which can in turn display more folders and so on. If you highlight each folder
    or file has a checkbox to select it. You cannot have flexibility in selecting
    candidates for backup by checking the appropriate boxes. You cannot miss highlighting
    and marking checkboxes; selections must be one style or the other. Finally, if
    you have set up backup profile (explained later), you can highlight it from the
    backup profiles of the tree view, and any folders or files listed in profile will
    be selected for backup.


    When you have finished your selections, Choose Backup from the File menu. A dialog
    box pops offering backup options. Once you confirm that everything is to your
    satisfaction, KDat begins the backup. The progress of the backup is shown as well
    as the progress of writing and estimated time to completion. KDat also prompts
    you to change tapes if necessary.


    # Verifying your backup


    After making a backup you should verify to make sure it went intended. If you
    are keeping your backups for the long term, you should also verify them on a regular
    basis to make sure haven''t deteriorated in any way. It adds work, but it''s better
    than being left in the lurch when you really need your backups. You can select
    files or folders for verification in the same way as you select, by highlighting
    them or checking checkboxes. The only difference is that you select files from
    the tape drive node of the tree view rather than the local files node. After you
    have selected files to verify, choose Verify from the File menu. A dialog containing
    verification options comes up, and after you have made any needed changes to them,
    the verification process begins. Just like creating backups, KDat shows the progress
    of the verification and prompts you if you need to change tapes.


    # Restoring files and folders


    Use the KDat created as part of the backup process to determine which tape contains
    the files you want to restore. Restore is similar to selecting them for verification
    or backup creation. Highlight or select files and folders to restore from the
    tape drive node of the tree view. After you have selected the files to restore,
    choose Restore from the File menu. A dialog containing recovery options comes
    up; you can make any changes you need here. One option in particular you might
    want to change the folder into which files should be restored. The restoration
    process then begins, and again, KDat shows its progress and prompts you if you
    need to change tapes.


    # Creating a backup profile


    KDat can help manage different backup tasks by creating a profile for each one,
    such as your fully weekly backup, daily incremental, and so on. Start by highlighting
    and checking files and folders from the local files node of the tree view. Choose
    Backup Profile from the File menu. You can set several options in the dialog box
    that appears.


    ![](img/65ef52f6e9fc73ddc3051990377c4f5b_265_0.png)'
