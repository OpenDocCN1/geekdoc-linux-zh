    # Setting up Linux clients


    The primary purpose of SAMBA is Linux-to-Windows file sharing. While the first
    choice for Linux-to-Windows file sharing would probably be NFS (the related section
    later in the chapter), it is also possible for Linux machines to make use of Samba
    shares. There are two ways to do this: via file manager or using text commands.


    # USING A FILE MANAGER


    The easiest way of accessing Samba shares on a Linux machine is to use a file
    manager that has a built-in SAMBA client. Both GNOME''s Nautilus file manager
    and KDE''s Konqueror have the ability to access SAMBA shares.


    # Konqueror


    If you''re using Knoppix, or any distribution with a KDE desktop, you can access
    SAMBA shares using the Konqueror file manager. Simply open Konqueror, and under
    the Go menu, select Network Folders. A list of available network folders is shown
    in the browser window. Click the icon marked Samba shares to see a list of available
    SAMBA shares, as shown in Figure 18-18.'
