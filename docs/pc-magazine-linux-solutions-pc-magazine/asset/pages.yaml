    # # Backing up databases


    Backing up databases is very important, but it presents its own problems. Most
    databases, for the sake of efficiency, do things like cache as much data in RAM
    as possible. Backing up the file system-the database is isn''t enough to capture
    its full state. The way to work around this is to temporarily shut down the database
    and run a utility to dump the contents of the database. (Most database software
    provides such a utility) Then you can use your usual backup method to store the
    dumped data.


    # # Summary


    Backing up your Linux system is a decidedly unglorous but vital task. To begin,
    you must consider what needs to be backed up and the various types of media available
    for backups. You can use the tar utility with its many options to create backup
    solutions. For users of tape drives, the command-line mt utility and the graphical
    KDat application are available. CD and DVD users can try the K3b application.
    Commercial backup software is an option, though free software is more than enough
    for most backup tasks. Some common backup issues have...'
