  md: '# # Chapter 5


    # # Partitioning Your Hard Drive


    Partitioning is a way of making logical separations on a hard disk drive. Windows
    users will be familiar with the C;, D;, E;, and other letter drives. These letters
    can represent physical devices or partitions (slices) of a single drive. Linux
    does not use drive letters but rather a hierarchical file system with a root,
    designated as /, and other file systems (simply directories) off C:\. Windows
    users will find that the root file system on Linux is roughly analogous to C:\.
    Many users who are new to Linux ask, “Why should I partition my hard drive at
    all when just one big partition will meet my needs?” There are two general answers
    to this question: Should you partition you want to run more than one operating
    system on the same hard drive (known as dual booting), and should you partition
    your hard drive to separate data file systems.


    Dual booting means that two (or more) operating systems can occupy the same hard
    drive, but only one may boot at a time. You will need to partition your hard drive
    if you currently have a Windows system and want to install Linux in a dual-boot
    situation. Dual booting is a good way to use your computer in unique way without
    losing your applications and destroying all of your data or buying a new computer
    for a second operating system. If you want to know more about dual booting and
    what is involved, refer to Chapter 8.


    As far as separating data from file systems, you partition the drive for protection—protection
    from wouldbacks, mistakes that cause a disk to fill up, and users who like to
    store too much data in their home directories. On any multipuser operating system,
    you should create partitions to separate data, and file systems from one. Ordinary
    users of a system do not need to access certain parts of the system, where they
    might (accidentally or unintentionally) destroy essential data. There should be
    common areas on an operating system, and private areas where access is restricted
    to those who need it. Partitioning makes housekeeping and system administration
    much easier.


    Linux actually does a good job of protecting operating systems from regular users
    as only the administrative user (root) has the ability to edit or remove them.
    Ordinary users have access only to the / directory and their home directory by
    default. By limiting the size of /tmp,/home, and some other key directories, you
    ensure that the root file system remains free of clusters and adequate space for
    normal operation. Also provide protection from applications or processes that
    can inadvertently cause /tmp or /var to fill to capacity and thereby render the
    root file system and possibly the whole operating system to an unusable state.


    For a single-user workstation, you can use fewer partitions (a minimum of two),
    but creating multiple partitions on advanced operating systems is common practice.
    As mentioned,'
