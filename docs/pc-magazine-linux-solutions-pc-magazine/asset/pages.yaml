  md: 'As you can see from this screen, the boot loader on my system is configured
    to automatically start Fedora Core after waiting a few seconds for me to specify
    another operating system. This is a nice feature, for example, the power goes
    out at your house, but you want computer system to be available 24 hours a day.
    Booting a default operating system after a short pause ensures that your computer
    will always restart in the of a transient problem such as a power flicker.


    The previous section explains how to specify which operating system to boot by
    default. In my case, this is Linux. If you configured your Fedora installation
    the same way, you can either wait a few seconds for Fedora to boot automatically,
    or press any key and press Return or Enter when you see the screen in Figure 8-18.


