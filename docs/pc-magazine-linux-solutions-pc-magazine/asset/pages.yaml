- img_proc: true
  md: '# Chapter 23: Proxy Solutions 403


    For these reasons, I do not recommend and do not cover this type of proxy solution.
    Instead, this chapter focuses on something more accessible to the novice administrator:
    a software-based proxy server.


    A software-based server will lose a bit of the speed advantage over a kernel-based
    one because its operations take place in application space rather than in kernel
    space, but on decent hardware, the difference is not great and is largely compensated
    by the speed advantage of caching.


    The most popular proxy server for Linux is Squid. Squid is bundled with many popular
    Linux distributions, including Fedora Core and Knoppix. In this chapter, I focus
    on running Squid on Fedora Core. Because Squid requires fast access to memory
    and hard drive, it is not particularly suited to running on a live CD-based distribution.
    This is not to say it can''t be done, but there are distinct performance advantages
    to be gained by running it on a fully installed distribution. In any case, beyond
    installation and some minor details, the process of setting up and running Squid
    should be more or less identical on any distribution.


    # Installing and Configuring Squid


    If you''ve read the previous two chapters, you know the drill by: Download and
    install the software, start the server, and configure the clients. Squid is bundled
    with both Fedora Core and Knoppix and should also be included with other major
    distributions. Before you do anything else, check to see if Squid is already installed
    on your system. The main executable is usually found at /usr/bin/squid. If Squid
    is not installed, you''ll need to install it.


    You should be able to find the Squid proxy on your installation medium. If you
    would prefer to download it, I recommend that you download the package only from
    our distributions Web or FTP server. Because of the central role that Squid plays
    in managing network connections, you don''t want to use a proxy from a source
    that you don''t know and trust. Indeed, if you have the slightest doubt about
    a package''s origins, you shouldn''t use it. For the most secure installation
    possible, you should download the source from the Squid Web site (www.squid-cache.org)
    and compile it (see the related sidebar).


    Once you''ve installed the software, you will need to edit the configuration file.
    In this case, the file is located at /etc/squid/squid.conf.default Copy this file
    to /etc/squid/squid.conf by giving the command cp /etc/squid/squid.conf.default
    /etc/squid/squid.conf. Then open it in your text editor, as shown in Figure 23-1.


    The default version of the squid.conf file is very well commented, it''s easy
    to find your way around. The values given for the parameters are all of the default
    values that are hard coded into Squid. They are all commented out. You need to
    uncomment a parameter only if you want to change it. (There are a few exceptions
    in this places where the Squid developers feel strongly that you should use a
    particular setting. For basic Squid installations, it''s probably best to leave
    these uncommented lines as they are.)'
  merge: -1
