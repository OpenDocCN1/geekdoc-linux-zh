  md: '# Chapter 14: Backing Up Data 229


    # Backup schedules


    As mentioned in the last section, doing a full backup each time is not efficient.
    Still, you should do a full backup on occasion to make sure you have a copy of
    every file. Depending on how much your system changes, once a week or even a month
    is a good interval between full backups. Doing a full backup can be a lengthy
    process, schedule it for a time when the system is being lightly used, such as
    a weekend or at night. This also minimizes the chances of files changing while
    the backup is going on.


    A partial backup of the files that have changed between your full backups should
    also be done on a regular basis, typically every day, or if you have a lot of
    activity going, perhaps every couple of times. There are two types of partial
    backup you can make.


    Incremental backups store all the files that have changed since the last full
    or partial. In other words, if you did a full backup every Sunday and an incremental
    backup every other day of the week, Monday''s backup would contain all the files
    that changed Sunday. Tuesday''s backup would contain all the files that changed
    Tuesday, and Wednesday''s backup would contain all the files that changed and
    so on. The chief advantages of incremental backups are that they are fast and
    use less storage space because only the minimum amount of data is copied.


    Differential backups store all the files that have changed since the last full
    backup. If you did a full backup every Sunday and a differential every other day
    of the week, each of those days'' backups would store the files that have changed
    Sunday. Thus differentials will be slower and take more storage than incremental
    backups. There is likely to be a lot of overlap; a file changed on Monday could
    potentially be backed up as many as six times. Some administrators like this because
    backups can go wrong. Having multiple copies of a file increases the chances at
    least one of them is good.


    # Bare-metal recovery


    It is possible for a system to become damaged to such that you cannot even start
    your backup procedures. With some planning and backing the right directories in
    advance, you can still get the system up and running to the point where you can
    restore it from your backups without having to reall.


    Keep a live CD like Knoppix handy. It will make your job immensely easier. Once
    you boot into Knoppix, you have a Linux system at your disposal. You can mount
    all the partitions from your crashed system and fix any problems that have occurred
    or start your backup software.


    What if the partition table itself has been corrupted? Part of your backup procedure
    should be to note the number and size of all the partitions on each drive in your
    computer. You can list partitions with the fdisk -l command


    ```

    # fdisk -l /dev/sda

    ```


    Disk /dev/sda: 2147 MB, 214783648 bytes

    255 heads, 63 sectors/track, 261 cylinders'
