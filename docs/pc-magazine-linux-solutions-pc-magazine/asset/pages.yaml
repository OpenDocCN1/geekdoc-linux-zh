  md: '# Setting up the Windows clients


    In theory, setting up SAMBA clients on Windows should be easy. In practice, it
    can require some fiddling. As you might, Microsoft is less than enth about the
    fact that a free software package provides the same functionality as its expensive
    server software, and it seems like every version of Windows contains some feature
    that, while not breaking compatibility with SAMBA, can make it difficult to configure.


    With that in mind, this section takes you through the process of setting up a
    SAMBA client on Windows XP Home Edition. The process for setting up a client on
    other versions of Windows will be similar, but you may have to do a little digging
    to find the exact procedure.


    # Note


    If you run into problems, you might want to have a look at any of a number of
    SAMBA resources on the World Wide Web. The process to start is www.samba.org The
    documentation at that site gives you lots of information, including troubleshooting
    for common problems.


