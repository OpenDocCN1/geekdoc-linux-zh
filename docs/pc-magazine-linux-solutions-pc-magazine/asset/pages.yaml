- img_proc: true
  md: '# 340 PC Magazine — Linux Solutions


    It''s pretty straightforward. Just select Enable firewall and you''re done. You
    can initiate connections from your system to the outside world, but all incoming
    connections will be blocked. However, if your computer is running some kind of
    server software, it means that access to your server will be blocked. If you are
    running a mail, FTP, or Web server, choose the appropriate box. I also recommend
    that everyone who needs to access their computer remotely check the box for Remote
    Login (SSH), for reasons explained later in this chapter.


    The Enableinux option is very interesting but not yet widely used. Enhanced Linux
    (SELinux) is a new feature in Linux developed by the top-secret spies of the National
    Security Agency (NASA); it has the potential to revolutionize the Linux architecture.
    Instead of omnipotent root access to everything, power is shared between roles
    with sharply defined abilities. It''s still new and not widely used except in
    Fedora, which has championed it from the beginning. I would advise new users to
    enable the feature and then forget about it for time being. Fedora does a good
    job of hiding all the details of SELinux behind the scenes in most cases.


    If you didn''t set up the firewall during installation or want to go back and
    change something, you can run the system-config-security program. It comes in
    two flavors, a text mode and a graphical button. Figure 20-2 shows the text version.


    Pressing the Customize button takes you to the rest of the options and a few besides.
    The first option is the entry for Trusted Devices. I have only one network interface
    in my PC, called eth0, but if there were more, there would be checkboxes for each
    of them. Typically, a machine with multiple interfaces is one that connects two
    or more networks together; for example, an corporate network and the public Internet.
    By designating an interface as trusted, you effectively turn off the firewall
    for it. In this way you can still keep the firewall for the big, outside world
    and design the corporate-facing interface as trusted, bypassing any filtering
    of incoming requests.


    ![](img/65ef52f6e9fc73ddc3051990377c4f5b_364_0.png)'
