  md: '# Chapter 11: Using the Terminal


    # less and more


    The less and more commands do nearly the same as cat; namely, they are pagination
    programs. Times the cat command is not suitable because a file takes up more than
    one screen of space. When it is the case, the text at the start of the file scrolls
    before the screen before you read it. By using the less or more command, the machine
    displays the contents of the file screen at a time and then pauses. When the user
    has finished reading, he presses the space bar, the next screen is displayed.
    Depending on which version of these commands, the user may be able to page backwards
    by pressing the B key. Both of these commands take the name of a file as a target.
    There are options for these commands, but they are not widely used. The curious
    can find them by reading the manual pages.


    There are differences between less and more, most notably that less allows you
    to move backwards through files. I recommend you try them both and see which one
    you like better.


    # Advanced Command Writing


    Unix shells, and BASH in particular, allow for some fairly advanced ways of using
    commands. Functions go beyond the scope of any particular command but don''t quite
    rise to the level of programming. Beyond the basics of simple commands, there
    are shell functions that allow commands to work with the shell itself and be combined
    into few powerful commands. This is where the real power of the Unix shell shows
    itself.


    # Redirecting input and output


    The first shell function addressed is redirection. Redirection means taking input
    from or sending output to some place other than the usual. Every program that
    takes input or produces output (which is to say, most of them) has a standard
    place that things come from or go to. In the majority of cases, input comes from
    the keyboard, and output goes to the screen, but each program defines its own
    defaults. These default locations are called the standard input and the standard
    output. (For the remainder of this section, assume that the input is the keyboard
    and the standard output is


    # REDIRECT OUTPUT


    I''ll start redirecting output, since it''s the easier of the two concepts to
    grasp. Consider the ls command. This command generates output in the form of a
    directory listing. When you give it the ls command, the directory listing is printed
    to the screen. Suppose that instead of the screen, you want this output go to
    a file, which you can then read. In this case, you could use the ls command in
    conjunction with the output redirection operator, which is the greater than character
    (>), and the name of the file to which you want the output redirected.


    For example, say that you (in this case, user Jeff) want to list the contents
    of the /etc directory and store them in a file eclist in your home directory.
    You would give the command in this:


    ```

    ls /etc > /home/jeff/eclist

    ```'
