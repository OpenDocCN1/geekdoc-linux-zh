    # # Uploading and downloading keys


    Where do other people find your public key? There are repositories of public keys
    on the World Wide Web. Revocation certificates should also be uploaded to them.
    GPG allows you to upload your key to the keyservers and download other people''s
    keys from them. You upload your key with the -send-key option:


    ```

    $ gpg -send-keys 0ACC9546

    ```


    Similarly, you download other keys into your keyring with the -recv-keys option:


    ```

    $ gpg -recv-keys 0F0f0F0f

    ```


    In both cases, you use the short form of the key''s fingerprint to identify it.
    You can export a public key in ASCII text that, for example, you can mail it to
    someone, with the aptly named -export-option:


    ```

    $ gpg -export -armor 0ACC9546 > mykey.txt

    ```


    And you can import a key into your keyring—you guessed it—the -import option.
    Specifying -armor to either -import or -export informs GPG that the key is in
    ASCII not binary format:


    ```

    $ gpg -import -armor < hiskey.txt

    ```


    All these operations work on revocation certificates as well as public keys.


