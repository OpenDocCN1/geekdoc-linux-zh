  md: '# Chapter 11: Using the Terminal 169


    In each these cases, you can see that the command uses the first target as the
    object to be acted upon (the source) and the second as the desired result of the
    action (the destination). In most cases, the source will come first and the destination
    second. As usual, the manual page is the final authority for the proper locations
