  md: '# Chapter 8: Dual-Boot Installation


    faster, and easier. As discussed in Chapter 3, most Linux installations require
    around 5GB of available disk space, which is sufficient space to install the operating
    system and a standard set of applications, and enough room to create and store
    a reasonable amount of your files and other personal data.


    Changing the existing partitions on your computer system is repartitioning your
    system. A number of free and commercial software packages are available that make
    it easy to repartition disks. However, the first part of software is the word
    soft, which in this case means that something can go wrong, make sure that you
    back up your current Windows Data before proceeding, as explained in the next
    section.


    # Note


    The rest of this chapter assumes that you have only one hard drive in your computer
    system and therefore want to install Linux on that without removing your current
    Windows installation or files. The process is very simple if you have the funds
    and technical expertise to add a second disk to your system and install Linux,
    except that you don''t need to do any repartitioning; you just have to ensure
    that Linux is actually installed to the correct hard disk. In that case, you should
    still back up your Windows files as described in the next section — in case —
    and skip ahead to the section edited "Installing Linux on the New Partition"


    # Backing Up Your Windows Data


    Several free and commercial packages make it easy to repartition an existing disk
    drive. In 99 times out of 100, repartitioning an existing disk drive is completely
    safe and will not damage or lose any of the installing programs or data on your
    Windows partition. However, preventing the pain associated with that remaining
    time is worth the effort to take up your important data before making changes
    to your disk partitions. If you''re tempted to skip this step and just go ahead
    with repartitioning, stop and think for a moment what it would be if you lose
    your computer system or it was destroyed. None of the saved e-mail you''ve exchanged
    with friends and family, none of the letters you''ve written, none of your digital
    photographs, none of your music collection, the great American novel—all gone.
    Are really willing to take that chance? If so, you''re braver than I.


    Explaining how to use Microsoft Windows backup utilities is outside the scope
    of this book. The critical part of backing up your data is to back it up onto
    removable media, such as a CD-ROM, DVD, or external USB or FireWire hard disk.
    The key to doing backups is to write them to a device other than the one that
    the you''re backing up. Simply making a copy of important files and directories
    on your existing hard drive doesn''t help if that hard drive is damaged. Make
    sure that you copy your important files and directories to some removable media,
    and then remove and reinsert or reattach it to make sure that actually contains
    readable copies of your files before partitioning the disk where they were originally.
    In most cases, you won''t need them, but the one time you do, you''ll be ecstatic
    that you took the time to play it.'
