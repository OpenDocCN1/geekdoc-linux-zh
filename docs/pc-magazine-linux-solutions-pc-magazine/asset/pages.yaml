  md: '# Configuring a Web browser


    Configuring a Web browser is done from within the browser itself, the method used
    is dependent on the browser in question. The following sections show the configuration
    for Mozilla Firefox and Internet Explorer.


    # MOZILLA FIREFOX


    Under the main menu, select Preferences. When the Preferences window appear, select
    the icon marked General. In the bottom portion of the screen, under the Connection
    section, click the Connection Settings button. Check the Configure Proxy to Access
    the Internet window, as shown in Figure 23-2:


    ![](img/65ef52f6e9fc73ddc3051990377c4f5b_436_0.png)


    **Figure 23-2:** The Configure Proxies to Access the Internet dialog.


    Check the Manual Proxy Configuration button, and then enter the IP number of the
    proxy server and port in the space provided. (By default, the port number is 3128,
    but you can configure using the `http_port` parameter in the `squid.conf` file.)
    Next, click OK to return to the main preferences window, and click again.


    # INTERNET EXPLORER


    Configuring Internet Explorer to use a proxy server is not as straightforward
    as one might expect. The option to use a proxy server is in some obscure location.


    From the Internet Explorer, select the Tools -> Internet Options from the dropdown
    menu. The main Internet Options window appears. Select the Connections tab and
    the LAN Settings button. The Local Area Network (LAN) Settings window opens, as
    shown in Figure 23-3:'
