  md: '# PC Magazine — Linux Solutions


    The first field is the group name. The second field used for group passwords stored
    in encrypted form. These are rarely used now, but if you want to add an extra
    layer of security when you use group changes (explained later in the chapter)
    you can use this feature. Like user passwords, group passwords have now been moved
    into their file, /etc/shadow, and is an x. If the field is completely empty, it
    means no password is needed to change this group.


    The third field is the group GID. Linux uses this number internally to refer to
    groups. As with UIDs, GIDs below 1000 (or 500 in some distributions) by convention
    refer to systems. The last field is a comma-separated list of users who belong
    to a group. In this case, only knoppix is a member of the scanner group. If there
    were a scanner attached to the PC, only he would be able to access it. Needless
    to say, any user can be the member of several groups, though only one—the mentioned
    in field four of the /etc/passwd entry—is considered the user''s primary group.


    # Storing User and Group IDs


    The text files /etc/passwd and /etc/group are the usual account and group information
    are stored, but text files are not always the best choice, so you may want an
    alternative.


    If you have a lot of users and groups, the files can get very large. As each database
    has to be read every time UID or GID information is needed, this can slow down
    the system''s performance. In cases it might be better to use a full-blown database
    server like MySQL or Oracle that is optimized for fast random access.


    If you have a network of machines and want to give user access to all of them,
    it is a pain to have to edit files on each system and keep them in sync whenever
    an account or group is added, removed, or changed in some way. In this scenario,
    it would be easier to look up the information in a master directory server implementing
    a protocol as NIS (Network Information Services) or LDAP (Lightweight Directory
    Access Protocol).


    Linux supports these and other lookup methods in a way that is transparent to
    programs, implementing them beyond the scope of this book, and the default method
    is adequate for most users anyway.


    However, because there is a chance that user and group databases on your system
    could be coming from some alternate source, you should not use commands as cat
    or less to examine /etc/passwd or /etc/group when you want database information.
    Instead, use the get command follows:


    ```

    $ get passwd

    $ get group

    ```


    getent is smart enough to get the information from the right place.'
