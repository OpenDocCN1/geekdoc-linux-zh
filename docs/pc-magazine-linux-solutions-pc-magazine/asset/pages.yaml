  md: 'If the file to which you''ve redirected your output does not already exist,
    the output operator creates it. If the file already exists, the output redirection
    operator replaces the contents of that file with output of your command. This
    behavior can be changed by giving the command in this form:


    ```

    ls /etc >> /home/jeff/etclist

    ```


    # Caution


    When using the > operator, it is possible to lose the contents of a file. Every
    time you redirect output in this way, the output from the current job overwrites
    the output from the previous job. Unless you are sure about what you''re doing,
    I recommend that you use the >> operator, which does not overwrite, but rather
    appends new data to the file.


    By using the doubled output redirector (>>, the output is appended to the end
    of the file instead of replacing the contents of the file. Like the single operator,
    the double operator creates the file if it doesn''t already exist. The double
    operator can be useful if you want to run a command several times and compare
    the output, or if you want to log the operation of several different commands.


    # REDIRECTING INPUT


    Redirecting input is similar in concept to redirecting output. In this case, instead
    of sending output to a file, you take input from a file. This is usually done
    to feed arguments to a command. For example, suppose you have a file named ls-args
    that contains the line


    ```

    /etc

    ```


    Running the following command would output a directory listing of the /etc directory.


    ```

    ls < ls-args

    ```


    # REDIRECTING INPUT AND OUTPUT AT THE SAME TIME


    You can combine the preceding two functions like (replacing username with your
    own username):


    ```

    ls < ls-args > /home/username/etclist

    ```


    By doing this, you are able to take the arguments to the command from the ls-args
    and send the output to the etclist file.


    You might be asking yourself why you''d want to do this. Remember that a part
    of the Linux philosophy is to make things automatable where possible. If you create
    files with an operator and'
  merge: -1
