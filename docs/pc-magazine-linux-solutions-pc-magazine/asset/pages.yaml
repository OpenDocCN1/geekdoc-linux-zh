  md: '# Chapter 6: Using Accounts 69


    # Passwords


    When you are using a live CD like Knoppix, you can get away with having a password
    on your account as nothing gets saved on the CD and everything is reset when reboot.
    If you install Linux on your hard drive, it would be suicidal to leave your account
    unprotected by a password and even more so for root account. During the installation
    process of most distributions, you are prompted to pick a password for root and
    any user accounts you create but you can also add, remove, and change passwords
    after installation with a program called passwd.


    # Changing your own password and account information


    Normal users can change their own passwords only. Here''s how a user logged in
    as lin changes his password to yogurt:


    ```

    $ passwd

    Changing password for linux

    (current) UNIX password:

    ```


    After entering the old password, the following prompts appear. (If the account
    previously had no password, this step is skipped).


    Enter new UNIX password:

    Retype new UNIX password:


    Now linux enters yogurt. The program requests he enter it twice as a precaution
    against typos. But the passwd program rejects yogurt:


    Bad: new password is too simple


    Oh no! What happened? Depending on the system administrator''s policy, the passwd
    program may check the password to see if it is strong enough. (system-config-users
    does the same check). Simple dictionary words like yogurt are considered weak
    passwords because they are easy to guess. (See the "Choosing Good Passwords" section
    later in the chapter). For now, linux decides to use yo-plat instead.


    Enter new UNIX password:

    Retype new UNIX password:


    Again, he has to type the new password twice.


    ```

    passwd: password updated successfully

    ```


    It seems passwd has no objections to yo-plat, so the password is changed.'
