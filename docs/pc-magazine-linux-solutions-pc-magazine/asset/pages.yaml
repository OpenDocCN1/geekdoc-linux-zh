    # Summary


    Your system is susceptible to many of threats, but there are effective countermeasures
    you can take against them. Especially if you come from a Windows background, the
    whole subject may seem quite daunting. You may wonder if Linux is worth the bother
    if you have to put this much effort into securing it. Such a view, however, is
    based on false premises. It''s actually even harder to keep Windows secure, as
    the many stories in the news about viruses and spyware remind us. It just may
    not seem harder because security information is often obscured or suppressed in
    the Microsoft world. The Linux traditions of openness, sound technology before
    profits, and peer review will serve you much better in the long run.'
