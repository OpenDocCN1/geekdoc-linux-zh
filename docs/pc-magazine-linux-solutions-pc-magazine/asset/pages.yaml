  md: '# Chapter 12


    # Internet Solutions

    in Linux


    ![](img/65ef52f6e9fc73ddc3051990377c4f5b_207_0.png)


    You have a computer, and you just installed a new operating system on it. You''re
    logged in and had a look at the desktop. What do you do now? If you''re like most
    people I know, the first you''re going to want to pull up a Web page or check
    your e-mail. This chapter shows how to use the basic Internet functions that come
    with your Linux distribution. Most distributions these days come with a number
    of programs that perform basic functions such as e-mail, Web browsing, instant
    messaging, and others.


    This chapter assumes that you have a working connection to the Internet. You should
    have configured your network connection during installation. If you did not, or
    if things have changed, refer to Chapter 19 to learn how to set up your network
    connection.


    # Browsing the World Wide Web


    It seems like the most popular Internet activity today is browsing the World Wide
    Web. The Web puts a world of information, from the most critical to the most useless,
    at your fingertips. We in the Linux community are lucky to have the best browser
    in the world, Mozilla''s Firefox browser, runs natively on Linux. This was not
    always the case. The Netscape browser runs on Linux, for several years, Netscape
    was outperformed—both in terms of popularity and functionality—by Microsoft''s
    Internet Explorer. For some time, Linux users had to contend themselves with a
    second-fiddle browser.


    That changed in 1998, when a Netscape decided to release the code to its browser
    as free software. This release was the beginning of the Mozilla project, whose
    ambition was nothing less than the creation of the world''s best browser. Given
    the high degree of overlap between the free software community in general and
    the Linux community in particular, it''s surprising that they didn''t leave Linux
    when they brought out Firefox.


    In fact, all the components of the Mozilla project run on all of the major operating
    systems, including Linux, various flavors of Unix, Windows, and Mac OS.'
  merge: -1
  pgno: 207
- img_proc: true
  md: '# Note


    The Mozilla project produces several products. The term Mozilla itself refers
    to an integrated suite of products that includes a Web browser, e-mail client,
    and HTML composition tool. Firefox is a standalone browser, and Thunderbird is
    a standalone e-mail client.


    There are other Web browsers for Linux, and I mention a few of these later in
    this chapter, but I think Firefox is the best.


    # Running Firefox


    Firefox is installed by default on almost any major Linux distribution. If for
    some reason, it is not, check your distribution''s installation media to see if
    there is a package available. If there is, install it using the techniques described
    in Chapter 15. If you can download packages from www.mozilla.org follow the instructions
    on that site to install the packages.


    Firefox is installed by default on Knoppix and Fedora Core. To start Firefox on
    Knoppix, simply click the red-and-yellow Firefox icon in the dock. On Fedora Core,
    click the Web Browser icon (the one with the globe encircled by a fox) or select
    the menu path Applications -> Internet Web Browser, as shown in Figure 12-1.


    ![](img/65ef52f6e9fc73ddc3051990377c4f5b_208_0.png)


    **Figure 12-1:** The Firefox menu path on Fedora Core.'
