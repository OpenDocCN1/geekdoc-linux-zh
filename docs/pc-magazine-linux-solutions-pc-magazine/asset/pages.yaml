  md: 'Name resolution is the technical term for the process of figuring out the human-readable
    name associated with a specific host and can be done in different ways on Linux
    systems. Many Linux hosts use a text file, /etc/hosts, to track IP addresses on
    small, local networks, but this quickly becomes impractical for identifying the
    IP addresses with medium-size networks and is out of the question on large networks
    such as the Internet. All Linux systems therefore use a mechanism called the domain
    name service (DNS) to contact hosts as name servers (or DNS servers). The name
    servers maintain a database of mappings between host name and IP addresses and
    know how to contact other domain name servers in the event that they can''t identify
    the IP address for some specific host.


    As you can see in the rest of this chapter, Linux provides some very simple, easy-to-use
    mechanisms for specifying your system''s TCP/IP configuration and related information.


    # Networking from an Administrator’s Perspective


    As discussed in the previous section, the combination of physical MAC addresses,
    IP addresses, and DNS provides a powerful, flexible mechanism for identifying
    and contacting hosts on large networks such as the Internet. The key aspects of
    configuring Linux networking consist of setting the Ethernet for a specific host,
    identifying networking resources such as your default gateway and DNS servers,
    and controlling how your system tries to look up hosts and map them to IP addresses.
    Luckily Linux systems use the underlying commands to specify this information,
    regardless of which distribution you have installed. These are automatically created
    when you boot a Linux system, using network configuration information that is
    stored in a variety of text files on your Linux system.


    Most of the network administration tasks on Linux systems consists of correctly
    setting the values in these configurations, which you can do using a text editor.
    Different Linux distributions store this information in different places. For
    example, running the Red Hat Enterprise Linux, Fedora Core, and SUSE distributions
    store network interface information files located under the directory /etc/sysconfig,
    but the specific files are used differ between SUSE and the others. The Ubuntu
    and Debian distributions store their basic network configuration information in
    the directory /etc/network, the most important of which is /etc/network/interface.
    As you see later in this chapter, many Linux distributions also provide graphical
    tools for simply mapping, and updating this information. This is not only convenient
    for the new system administrator or someone using graphical tools but also conveniently
    hides the internal details of the underlying files used. Once you settle on a
    specific Linux distribution, you will want to become one with the files that it
    uses for network configuration, but the casual or multidribution Linux user can
    save a lot of time and trouble by simply using graphical tools for Linux network
    configuration and administration.


    More general network configuration information, such as the addresses of DNS name
    servers and the sequence in your system looks in different locations for host-to-IP
    address mappings, are specified in the same text-format configuration files on
    all Linux systems. The files that contain critical pieces of this information
    are the following:'
  merge: -1
