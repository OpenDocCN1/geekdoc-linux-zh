    # If You Have a Domain Name


    In this example, I have been going on the assumption that you don''t have a registered
    domain name. You don''t need a domain name to set up and test a server, but without
    one, you will not be able to make your Web pages available to the public. Earlier
    in this chapter, I refer you to a Web page that contains a list of agencies licensed
    to register domain names to the public. Registration is fairly inexpensive, so,
    if you feel you''d like to take the plunge and register a name, there''s really
    reason not to.


    One thing you should be aware of when you register a name is that you''re going
    to need access to a domain name service (DNS) server. A DNS server translates
    your domain name into an IP number so when people type it into their Web browser,
    they''ll be directed to the proper location on the Internet to find your Apache
    server. It is possible to run a DNS server yourself, although it is somewhat complicated,
    and beyond the scope of this book. It is also possible to find DNS services on
    the Internet for a price. This is usually inexpensive, and some services have
    easy-to-use Web interfaces that allow you to be quickly up and running. There
    are even free services, but they are not usually responsive or easy to use as
    the pay services. In any event, you can find these by typing DNS service into
    your favorite search engine.


    Continued'
