- img_proc: true
  md: '# Chapter 18: File Sharing Solutions 305


    # Tip


    Instead of checking the status of the server every time you try to start it, you
    can always just start it using /etc/init.d/samba restart. If the server isn''t
    already running, the part that program stops the server simply fails, and it skips
    straight to the part where it starts again. This saves you the time of checking
    whether it is already running.


    # USING SWAT


    SWAT (SAMBA Web Administration Tool) is a program that installs a small Web server
    on your system. Once installed, you can access that server and use it to configure
    your SAMBA server from a Web browser. The advantage of this is that you can configure
    your server from any machine; you don''t have to be on the same machine which
    SWAT is running.


    The disadvantage is that SWAT does something of a security risk. It''s not a severe
    thing—anytime you run a server on your system (including a SAMBA server), you
    create an opening that can be exploited by a hacker. This doesn''t mean you shouldn''t
    run SWAT, but it does mean that you''ll need to jump through a few hoops to get
    it running. Here''s a step-by-step rundown of what you need to do to get SWAT:


    +   1. Make sure SWAT is installed. As you did with the SAMBA package, you need
    to make sure that the SWAT package is installed. The SWAT package is sometimes
    designated samba-swat, and sometimes swat. Check to see if the package is installed,
    and, if not, install it. If your distribution comes with SAMBA, you probably already
    have SWAT on the installation medium alone with SAMBA. If not, you can download
    it from www.samba.org.

    2. Make sure the service is registered. Assuming you''re using a package manager
    to install SWAT, this will probably be done for you, but it''s worth checking
    anyway. Give the command


    The usual locations for SWAT''s files are /usr/bin/swat, /usr/share/swat, /opt/swat.
    If you don''t have any of those files or directories, you probably don''t SWAT
    installed.


    ```

    more /etc/services

    ```


    Use the space bar to scroll through the file. You should see a line that looks
    like this:


    ```

    swat 901/tcp # Samba Web Administration Tool

    ```


    If you scroll through the entire file and you are unable to find this line, open
    the /etc/services file in a text editor and add it to the end of the file. Save
    the file and close the editor.'
