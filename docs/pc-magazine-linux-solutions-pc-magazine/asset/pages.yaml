  md: '# Chapter 4


    # Getting Linux and Starting to Install


    ![](img/65ef52f6e9fc73ddc3051990377c4f5b_59_0.png)


    Once you have gathered all the information you need to install Linux, the next
    step is acquire a Linux distribution and then, you guessed it, install. A process
    fraught with errors and actual danger to your computer, installing Linux simply
    isn''t that hard anymore. That''s because Linux has advanced dramatically over
    the years, especially in the area of support for PC hardware. PC hardware has
    also standardized it to a degree, further helping the situation.


    This chapter covers how to get your hands on Linux, and the first steps towards
    installing, include dealing with some of the remaining hardware issues.


    # Getting Linux


    Chapter 2 covered the most popular Linux distributions. Once you get the installation
    software for a given distribution, you need to get that software on some kind
    of installation media, such as a CD, the most common choice. If you purchased
    a CD, then you''re ready to go. If, however, down-loaded the installation software,
    you then need to copy, or burn, the software to a CD or other installation media.


    The following lists the most common forms for installation media:


    +   * Three or four CDs for a full installation

    * One CD for a live CD

    * One CD with an installer that downloads the rest of the software from the network

    * One DVD-ROM for a full installation

    * A USB drive or other disk-based installation package


    Most users will need three or four CD-ROMs with the full installation software.
    You need that many CDs to hold the full set of software that comes with most Linux
    distributions.'
  merge: -1
  pgno: 59
- img_proc: true
  md: '# Note


    This book comes with the Knoppix distribution, a live CD containing Linux. You
    can also download or purchase other Linux distributions, as explained in "Download,
    buy, or acquire."


    # Download, buy, or acquire?


    In addition to the free or very inexpensive Linux distributions, you can also
    purchase Linux with full enterprise-level support from companies such as Red Hat
    and Novell.


    If you don''t have CDs readily accessible, you can download the installation software.
    See Chapter 2 for a listing of the most common Linux distributions with their
    Web addresses. Based on the distribution you choose, download the installation
    files.


    # Note


    Whether you acquire CDs or download the data and burn your own CDs, you need to
    ensure you get the version of Linux for your processor and system architecture.
    In most cases, this will be an x86 Intel-based PC architecture. Linux, though,
    runs on everything from small devices to huge supercomputers. So, you may find
    a popular Linux distribution as Debian supports SPARC, PowerPC, ARM, and other
    processor architectures in addition to the common PC x86 architecture.


    In most cases, Linux distributions provide the installer software as one or more
    ISO files. Each ISO file corresponds to the full file system on one CD. The ISO
    file not only includes the installation software but also the description of where
    the data is laid out on a CD-ROM. Thus, each ISO file essentially holds the raw
    bits that need to get written to a CD-ROM or a DVD. DVD ISO files, though, tend
    to be much larger than CD files, due to the much larger capacity of DVDs.


    # Note


    The term ISO comes from the International Standards Organization. ISO files refer
    to ISO-9660, the standard for CD-ROM file formats.'
  merge: -1
  pgno: 60
- img_proc: true
  md: '# Chapter 4: Getting Linux and Starting to Install


    ISO files provide a convenient means to get Linux CDs. For example, a four-CD
    installation as Fedora Core Linux requires you to simply download four ISO files
    and create a CD-ROM from each one. You can also create the ISO files by hand if
    needed.


    # Note


    Typically, ISO files hold more than 600MB of data. That''s because a CD-ROM holds
    approximately 660MB. Thus, four installation CDs, in the form of four ISO files,
    fill up a lot of space on your hard disk (and take a long time to download).


    # Creating CDs from ISO files


    In this chapter, I assume you don''t have Linux installed yet, so you will likely
    be using Microsoft Windows to create the ISO files. On Windows, you can use a
    number of applications to burn ISO files to CDs. These applications include the:


    +   - ISO Recorder

    - CDrWin

    - Easy CD

    - CDBurn

    - Nero

    - WinOnCD


    # Note


    CDBurn is part of the Windows Server 2003 Support Tools from Microsoft.


    Use one of these packages to burn an ISO file to a CD-ROM under Windows. In other
    environments, you may be able to create a CD by using a graphical file manager,
    such as the Nautilus on Linux, and Finder on Mac OS X.


    # Note


    You need a CD-R or CD-RW drive to burn CDs, or a DVD-R, DVD-RW, or DVD+R drive
    to create a DVD. Create a CD for each ISO file you downloaded. If you have a drive
    for these media on a Windows PC, chances are it came with a software package for
    burning CDs.'
  merge: -1
  pgno: 61
- img_proc: true
  md: '# 38 PC Magazine — Linux Solutions


    One of the easiest packages to use is ISO Recorder and is available for download
    at http://isorecoder.alexfeinman.com/isorecoder.htm. To burn an ISO file with
    ISO Recorder, follow these steps:


    +   - Download the ISO files you need. Each ISO file corresponds to a separate
    CD.

    - Insert a blank CD-R or CD-RW in your drive.

    - From the Windows Explorer, select the ISO file to burn.

    - Right-click on this file name.

    - Click on the Copy Image to CD menu choice to launch the ISO Recorder wizard.

    - Follow the steps provided by the wizard.


    # Note


    ISO Recorder works only with files having an .iso file extension.


    As mentioned previously, each ISO file corresponds to a separate CD. Thus, for
    four ISO files, you''ll need to create four separate CDs. Remember that you are
    trying to create CDs from the raw data in the ISO files. You are not trying to
    merely make backups of the ISO files.


    # Note


    If you burn a CD and just see one large ISO file on the CD (just one file with
    .iso suffix), this is a symptom that the file was merely copied to the CD. Instead,
    you want to create the CD from the raw bits in the ISO file. In this situation,
    you need to create another CD. Look in the software you use to burn the CD for
    an option named Create CD from Disk Image or Burn CD from Image. You need to set
    an option that.


    # Creating ISO files for later burning


    Linux includes a number of programs that can help you create an ISO file from
    the software packages and programs that make an installation disk. Creating these
    files should be considered an advanced topic. On Linux, look at the documentation
    for the mkisofs command, for make ISO file system, or cdrecord, another command
    that can create an ISO file. In addition, most Linux programs that provide a graphical
    application to control CD burning supporting ISO files.


    To create the ISO files to install Linux, you need lay out all the software you
    need under a separate directory for each ISO file. This requires you to know how
    to create a bootable CD and exactly what software packages are needed to install
    Linux. That''s why this is considered an advanced topic.'
  merge: -1
  pgno: 62
- img_proc: true
  md: '# Chapter 4: Getting Linux and Starting to Install 39


    Once you have all the contents for each ISO file placed on disk, you can then
    convert the directories of files into ISO files. And then, write, or burn, each
    ISO file to a separate CD.


    # Note


    You can find a lot more information on how to create ISO files at www.linuxiso.org.


    # Understanding the Boot Process


    The boot process is what happens when a PC starts up. When a PC starts up, it
    finds and runs, boots, an operating system. The boot process becomes important
    because you need to be able to boot Linux. Furthermore, Linux installation programs
    are typically scaled-down versions of Linux, so you need the ability to boot Linux
    on your PC in order to install Linux. Circular? Yes, but useful to know.


    # Note


    All systems have some form of boot process. The process covered here describes
    the Intel-architecture boot process used in PCs.


    PC systems provide low-level hardware control through what is called the BIOS,
    short for input/output system. When a PC starts, or restarts, the BIOS tries to
    find a program called boot loader. Once, the BIOS runs the boot loader. The boot
    loader program is responsible for loading and running the operating system, such
    as Linux or Windows.

    For Linux, you can choose from a number of boot loaders, the most of which are
    LILO and GRUB. Fedora Core Linux installs GRUB as the default boot loader, for
    example. In most cases, choose the default boot loader that comes with Linux distribution.
    The boot loader searches for an operating system, such as Linux, and then starts
    the OS if it finds.

    The BIOS was designed to look in certain places for a boot loader. By default,
    the BIOS looks for the first floppy disk drive, D: to old-to-CD users. The BIOS
    looks for the default hard disk, C: under DOS. Most modern PCs can boot from a
    CD-ROM drive, if configured to so.

    This becomes important, as most Linux distributions are meant to install from
    a CD. Typically, you insert the CD as the first installation disk into your CD
    drive. Shut down and restart your PC, with the CD still in your CD drive. If your
    PC, your BIOS, is configured to boot from the CD drive, then the Linux installation
    program will start, beginning your journey, with lots of happy ponies. On the
    other hand, if your BIOS is not configured to boot from the CD drive, your previous
    operating system, typically Windows, will run.'
  merge: -1
  pgno: 63
- img_proc: true
  md: '# Caution


    Most PCs turn off the ability to boot from a CD for security reasons. On Windows,
    CDs can run a program when you insert them into the CD drive of an already running
    PC. (These are called autorun CDs.) An autorun CD could restart your Windows system,
    starting an operating system stored on the CD. In most cases, you do not want
    this behavior, hence the desire to disable booting CDs. After installing Linux,
    be sure to disable booting from CDs.


    To enable or disable booting from CDs (or other media such as USB drives), you
    need to change the configuration of the BIOS.


    # Accessing the BIOS


    The PC BIOS stores low-level system configuration data, such as the date and time
    or the system boot order, in CMOS memory.


    # Note


    Few people know what CMOS means, but you''ll find this term used for the settings
    stored in your BIOS. CMOS, short for complementary metal oxide semiconductor,
    just defines the type of memory. PC systems store the data in CMOS memory with
    a battery to maintain the data over time.


    To modify a BIOS, you need to reboot your PC and then access the BIOS the relatively
    short time that you are performing the POST, or power-on self-test. This is the
    short time before the PC starts booting. Usually you''ll see a message as the
    following, indicating you can access the BIOS, a process often called.


    ```

    Press DEL to enter SETUP

    ```


    Since this time may be relatively short, you need to be prepared to press the
    proper key or key combination. Otherwise, which key or key combination depends
    on the BIOS vendor. The key or key combination to press should be listed when
    your computer boots.


    # Setting the boot order


    Once you access the PC BIOS, you can then define the boot order. This is the order
    of storage devices in which the BIOS will check to find an operating system, in
    the form of the boot loader program listed. Typically, the first item, and often
    the only item, in the boot order is the main hard disk. This means that the BIOS
    should search for a boot order program on the main hard disk.


    What you need to do is to find the CD drive as the first to check in the boot
    order and make the hard disk second. Each BIOS system has a slightly different
    means to change the boot order. You may need to search around a number of screens
    to find where the boot order is located.'
  merge: -1
  pgno: 64
- img_proc: true
  md: '# Chapter 4: Getting Linux and Starting to Install


    # Note


    If you are installing from a USB drive or other media, then define media first
    in the boot order. Typically, a USB drive would be called a removable drive in
    the BIOS settings. But, not all BIOS versions support booting from a removable
    drive. In addition, this is also a security issue, so disable booting from USB
    drives after installing Linux.


    # Beginning the Installation


    With all of this work, you should have one or more Linux installation CDs and
    a PC that will boot from the CD drive. You are now ready to install Linux. Insert
    the first installation CD. Shut down your computer from Windows or whatever operating
    system you are currently running. After the power shuts off, wait a few seconds.
    Start the computer. Feel the anticipation. When you boot the Linux installer,
    you will see the following (from a Fedora Core installation) with the boot prompt:


    +   - To install or upgrade in graphical mode, press the <ENTER> key.

    - To install or upgrade in text mode, type: linux text<ENTER>.

    - Use the function keys listed below for more information.


    [F1-Main] [F2-Options] [F3-General] [F4-Kernel] [F5-Rescue] boot:


    The boot prompt may appear after a number of other messages, product logos, and
    so on. For example, Fedora Core includes a large Fedora image. At the boot prompt,
    you can press Enter to go with a normal installation. You can alternatively enter
    any of a number of options to control how the installation program starts. For
    example, linux text to start the installer in text mode instead of graphics mode.


    ```

    boot: linux text

    ```


    Use the method if the installer cannot display graphics on your hardware. Otherwise,
    the default graphical mode should work.


    # Setting System Options


    After years of supporting just about every kind of PC hardware imaginable, the
    Linux boot prompt accepts a number of system options. If you experience problems
    while booting Linux, or have nonstandard hardware, you may need to set other options
    at the boot prompt, as described in'
  merge: -1
  pgno: 65
- img_proc: true
  md: '# 42 PC Magazine — Linux Solutions


    this section. In most cases, when you determined hardware components are installed
    in your PC, as described in Chapter 3, you should have found any special boot
    prompt options needed by the hardware.


    # Note


    These options are used by the Fedora and Red Hat distributions. Options differ
    on other versions of Linux.


    Boot prompt options are either a single word, as text, or a name=value pair, such
    as resolution=1024x768. Combine the options by separating them with spaces. For
    example:


    ```

    boot: linux resolution=800x600 apm=off

    ```


    Table 4-1 lists the most common options.


    | Option | Use |

    | --- | --- |

    | apci-off | Turns off APCI subsystem. |

    | apic | Works around a bug in the BIOS for the Intel 440GX chipset. |

    | apm-allow_ints | Changes APM system, usually used for laptops. |

    | apm-off | Turns off APM power management. |

    | apm-power_off | Changes APM default to power off; used mostly for systems with
    multiple processors. |

    | apm=realmode_power_off | Changes APM to power off in the Windows 95 rather than
    the Windows NT. Use this option if your BIOS crashes on shutdown. |

    | dd | Prompts for a driver disk, as described. |

    | display=IP_Address:0 | Allows you to install from a remote device, the display
    on the system with the given network IP address. Note that the remote system must
    allow connections from your PC. See the xhost command for details on allowing
    access. |

    | driverdisk | Prompts for a driver disk, as dd. |

    | ide-nodma | Turns off DMA, direct memory access, to your IDE hard drive. Use
    this option if you have problems with the IDE subsystem. |

    | isa | Prompts for you of IDE configuration. |

    | kbd-reset | Tells the Linux kernel to reset the keyboard at startup. The BIOS
    is supposed to do this, but on some systems, it does not. |

    | lowres | Tells the installer to use the low resolution of 640 × 480. Same as
    resolution=640x480. |'
  merge: -1
  pgno: 66
- img_proc: true
  md: '# Chapter 4: Getting Linux and Starting to Install


    | Option | Use |


    mem=numberM Tells the Linux kernel to use the given amount of memory, in megabytes.
    Used to specify the real amount of memory if the BIOS cannot report more than
    16MB of memory. Also used in cases where the graphics cards share memory with
    the processor and you want to limit the processor to a certain amount of memory,
    lower than the reported amount.


    nmi_watchdog=1 Turns off NMIs, or non-maskable interrupts. Used to help diagnose
    problems with multiple processors.


    noaptic Turns off API chip, for systems with a buggy BIOS or a known EPIC problem.


    noathlon Tells Linux kernel not to use AMD optimizations.


    noht Turns off hyperthreading on multiple-processor systems.


    oisapnp Turns off ISA-based PNP (Plug-n-Play, often called Plug-n-Pray).


    nomce Turns off the special CPU check (machine check exception), used for older
    Compaq systems.


    opcmcia Turns off the PCMCIA bus in laptops.


    nprobe Turns off hardware probing, instead asking you for the hardware information.


    nshell Turns off the shell on the second virtual console during installation.


    nousb Turns off support for USB installation.


    nousstorage Turns off support for USB storage; when you face a problem with the
    ordering of SCSI disks.


    reboot=b Used if your system hangs during reboots. May fix the hanging problem.


    resolution=Width Sets graphical installer to use the given resolution. Be a standard
    resolution as 640 x 480, 800 x 600, or 1024 x 768. Use this if you experience
    problems with the graphical installer. If problems persist, try the text mode.


    root=/dev/device Defines the device to use as the root file system for the installer
    to boot from, as /dev/hda1, for the first IDE disk, or /dev/fd for the floppy
    A drive. Use this if the installer cannot find the root disk.


    skipddc Dips DDC monitor probe.


    text Runs text-mode installer instead of the normal graphics mode installer.


    These boot prompt options serve to turn off a normal part of Linux processing
    for those that face issues, such as those that experience problems if Linux tries
    to probe the hardware. As you can see, each option was created when users faced
    a particular problem, sometimes a very obscure problem. So, don''t use these options
    unless you see a particular error, such as an IDE-specific error for the ide=nodma,
    or if you found hardware documentation describing your system and particular hardware
    problems with Linux. Otherwise, don''t specify any options.'
