  md: '# Chapter 15: Software Management Solutions 257


    # Note


    The files that get installed when you install an RPM package may not be immediately
    locatable using the locate command. This is because locate uses a database that
    is updated at regular intervals which is not updated when you install packages.
    If you need to locate a particular file that was installed by the package, you
    can use the package query search found in the preceding example, or you can update
    the database manually by giving the command updatedb. This command may take anywhere
    from a few seconds to a few minutes to run depending on the speed of your system.
    This command must be run as root.


    # Using YUM


    YUM is a program that provides a very convenient front end to RPM that checks
    your database of installed packages against a list of available updates, download
    updates, resolve dependencies, and install packages. YUM is very similar to Debian''s
    APT utility (discussed later in this chapter) and making inmates the software
    packages on your system a lot easier. YUM is installed by default on Fedora Core.


    # CONFIGURING YUM


    If you''re using Fedora Core, YUM comes preconfigured to use the official Fedora
    repositories. If you see the contents of the directory /etc/yum.repos.d, you will
    see the following files:


    +   fedora-devel.repo

    fedora-extras-devel.repo

    fedora-extras.repo

    fedora.repo

    fedora-updates.repo

    fedora-updates-testing.repo


    Each of these files contains information about a particular repository site. So
    if you''re a Fedora user, you don''t need to do any configuration to YUM.

    If you''re not a Fedora user, or if you want to customize your YUM configuration,
    you should start with the /etc/yum.conf file. The default /etc/yum.conf file on
    Fedora Core 4 looks like this:


    ```

    [main]

    cachedir=/var/cache/yum

    debuglevel=2\logfile=/var/log/yum.log

    pkgpolicy=newest

    distroverpkg=redhat-release

    tolerant=1

    exactarch=1

    retries=20

    ```'
  merge: -1
  pgno: 281
- img_proc: true
  md: '# 258 PC Magazine — Linux Solutions


    obsoletes=1

    gpgcheck=1


    ```

    # PUT YOUR REPOS OR IN separate files named file.repo

    # in /etc/yum/repos.d

    ```


    In all likelihood, you won''t need to change anything, but look at a few of the
    variables, just in case.


    +   - cachedir: This is the directory where YUM keeps its database files, as well
    as package files that it downloads.


    +   - retries: Variable controls the number of times that YUM attempts to connect
    to a repository before giving up.


    +   - gpgcheck: This variable controls whether YUM verifies the GPG signature
    on a package. A value of 0 translates to "don''t verify," whereas a value of 1
    translates to "do verify."


    If you want to set extra repositories in the ones already listed in the /etc/yum.repos,
    you must create a new file for each repository. Here are the contents of a typical
    file in that directory:


    There are a couple of variables whose values are assumed here. The value of the
    $releaser variable defaults to the value of your operating system''s release (This
    makes sure that you search for the appropriate packages for your distribution.)
    $basearch refers to your computer''s architecture (most likely i386 for PCs).
    From those variables, you can see how values are given to the parameters in the
    file. Here''s a breakdown of the file, line-by-line.


    ```

    [base]

    ```


    This line designates the title of the file block. In this case, it refers to the
    base files for Fedora Core. It could also refer to updates or something similar.


    name=Fedora Core $releasever $basearch - Base


    This line designates the name of the repository. In this case, the name would
    be Fedora 4 - i386 - Base.'
