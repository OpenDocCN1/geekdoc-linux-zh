- img_proc: true
  md: '# 28 PC Magazine — Linux Solutions


    the mainstream and are more likely to be an issue with Linux than the components
    in most desktop PCs.


    The following list describes the main hardware issues you face.


    +   * Processor: Linux runs fine on processors: Intel, AMD, ARM (XScale), PowerPC,
    and most other processors families can run Linux. Linux runs on mobile phones,
    PDAs, PCs, Macintosh systems, all the way up to monster-sized servers and super.

    * The only issue you may face is if you have a very new processor from a new architecture.
    For example, systems with multiple dual-core processors may be too new to run.
    Even so, it is just a matter of time until Linux gets ported to these systems.

    * You also want to verify that your processor is fast enough to run the Linux
    distribution you intend to install. By just every computer that still runs should
    be enough to install.


    +   RAM: Check the minimum requirements of your Linux distribution based on the
    kind of installation you want to install. For example, you may want more RAM on
    a server than on a desktop. A good rule of thumb, if your PC currently runs Windows
    XP and the amount of RAM is acceptable for XP, you have enough to run Linux.


    +   Graphics and video hardware: Linux doesn''t always support the latest and
    greatest graphics adapters. Most mainstream adapters should work just fine, though.
    Most graphics cards sport from just a few vendors, and most of these cards are
    pretty much the same from the Linux point of view. If you work with TV tuner cards,
    you''ll need to check very carefully for compatibility.


    +   Hard disks: Linux supports most disk controllers and hard disks. (The disk
    controller, not the disk itself, is the main worry).You''ll find Linux just works
    out of the box with most hard disks in PCs. For example, most ATA/ATAPI hard-disk
    controllers work just fine.


    +   * In general, you will likely face problems if you have a RAID disk controller,
    a setup used for servers. The most common RAID adapters used by Dell, for example,
    are problematic on Linux.


    Sound cards: Linux doesn''t support all the latest sound cards. Linux supports
    the older SoundBlaster modes. Since most new cards also these SoundBlaster modes,
    you should be able to play sound from most hardware. As mentioned previously,
    you need to check with your Linux distribution vendor to verify compatibility.


    Network adapters: Linux supports most network adapters. The main issues you may
    find the following:


    +   * Propri network adapters installed on laptop systems. To save on weight and
    cost, many vendors include proprietary network adapters, especially on laptop
    systems. In many cases, Linux developers have not been able to get the detailed
    specifications necessary to support Linux. Usually, though, this is a matter of
    time until you see special drivers for this type of hardware.'
