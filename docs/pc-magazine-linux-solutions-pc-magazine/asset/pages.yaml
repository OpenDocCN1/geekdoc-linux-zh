  md: '# Chapter 17

    Automation and Timed Execution


    As the saying goes, "necessity is the mother of invention." Back in the days when
    processors were slow and time online had to be scheduled, it was not always possible
    to do tasks whenever you wanted to. A user who wanted to run a long and processor-intensive
    operation would often face the prospect of coming in after hours to use the machine
    when it would otherwise be idle. "Wouldn''t it be great," those thought, "if we
    could program the operation ahead of time and have it run automatically at a time
    we prefer?"


    Of course, in the world of information technology, when someone has an idea that''s
    likely to save time or effort, eventually it is put into practice; so Unix and
    its derivatives enable users to schedule tasks at specific times. These days,
    it is not much a matter of allocating processor time as it is having a way to
    execute repetitive or tedious tasks automatically. To be sure, the system is still
    used to schedule tasks that run best when system usage is low. For example, many
    system administrators schedule backups to run in the wee hours users are less
    likely to be online making changes to files.


    On a single-user system, such considerations are less critical. Nevertheless,
    you may find scheduler useful for some tasks, whether it''s making backups or
    just to remind you of a meeting at a particular time.


    # Overview of Scheduling Options


    There are two main ways of scheduling a task for future execution. For the simplest
    situations, you can use the `at` command. This command does exactly what its name
    implies: it executes a command at a specific time. The `at` command is best used
    for simple jobs that are going to be run once. The following section details the
    method and syntax for using this command.


    The other method is to use the `cron` program. The `cron` program is a daemon
    program that is always running in the background. `cron` is used by several other
    programs that are fairly important to the running of any system, it is generally
    installed and configured to start automatically as part of the base of most systems.
    This is true of just any Linux system, and you shouldn''t have to start it.'
  merge: -1
  pgno: 311
- img_proc: true
  md: '# PC Magazine — Linux Solutions


    Using cron, you must place the command that invokes your task in a file called
    the crontab file. Cron files exist for the system as a whole (usually located
    at /etc/crontab), and other crontab files exist for each user. Each entry in a
    crontab file contains a specific date and time designation, and when the specified
    time is reached, the command is executed.


    The advantage of using cron is that you can schedule tasks to run on a cyclical
    basis. That is, you can schedule a task to run every Tuesday at 2 a.m. or on the
    12th of every month. The disadvantage is that the syntax for designating times
    is somewhat unintuitive and can be confusing. The advantage of using at is that
    the syntax for designating times is very simple and flexible. As a rule, use at
    for simple, one-shot tasks and cron for more-complex things that need to be done
    on ongoing basis.


    # Using at


    The basic syntax of the at command is very simple. It takes this form:


    ```

    at <time> <command>

    ```


    Here <time> represents an expression that designates the time at which you''d
    like to run your command, and <command> is the command you want to run. Suppose
    you''ve written a script called (/home/susan/backup.sh) to do a system backup,
    and you want to run it at 6 p.m. You could give the command in this format:


    ```

    at 18:00 /home/susan/backup.sh

    ```


    In this example, the command that should be run is assumed to be today. (In reference
    to the at command, the term "time" means the date and the time of day.) The time
    is given as 18:00, which expresses 6 p.m. in 24-hour format. What makes the at
    command so flexible that it has several different formats in which you can express
    the time. For example, the preceding command could also been written as follows:


    ```

    at 6pm /home/susan/backup.sh

    ```


    If the current time is 2 p.m., you could write the command as


    ```

    at now + 4 hours /home/susan/backup.sh

    ```


    If you want to run the command tomorrow at 6 p.m. you could use the following
    format:


    ```

    at 6pm tomorrow /home/susan/backup.sh

    ```


    Similarly, any of the following would be valid (though they don''t always refer
    to the same date and time):'
  merge: -1
  pgno: 312
- img_proc: true
  md: '# Chapter 17: Automation and Timed Execution


    ```

    at midnight /home/susan/backup.sh

    ```


    ```

    at noon tomorrow /home/susan/backup.sh

    ```


    ```

    at teatime + 3 days /home/susan/backup.sh

    ```


    ```

    at 7am Jun 02/27/06 /home/susan/backup.sh

    ```


    As you can see, there are many possible formats for specifying the time, and the
    orders that even without being an expert, you can specify the time intuitively
    in a format that at will recognize.


    # Using at interactively


    If you have multiple jobs that you want to run at the same time, or if you just
    prefer, you can use at interactively. Suppose that you have several jobs that
    you want to run at 2 p.m. Give the command


    ```

    at 2pm

    ```


    and hit the Enter key. You are presented with a prompt that looks like this:


    ```

    at>

    ```


    At this prompt, you can enter any command, and that command will be executed at
    the designated time. When you press the Enter key, you get the same prompt again.
    To exit this interactive mode, press Ctrl+D. You are returned to your shell prompt.

    A sample interactive session might look like this:


    ```

    $ at 2pm

    at> ls /etc

    at> <EOT>

    job 3 at 2005-10-19 14:00

    ```


    (Note that all of these commands are grouped together as job 3. In this case,
    a job refers to all the commands executed in a single session.)


    # Viewing the queue


    You can view a list of pending jobs using the atq command. You will not be able
    to see the exact commands that you specified, but you can see a list of job numbers
    and the time they are scheduled to be executed. Job numbers displayed here are
    the same numbers that are output in the last line after an interactive at session.
    Here''s a sample atq list:'
