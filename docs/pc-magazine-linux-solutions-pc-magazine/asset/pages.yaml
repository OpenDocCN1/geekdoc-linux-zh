    # Anatomy of a Command


    Every Unix command invokes a unique program or a shell function. Even the simplest,
    most mundane commands invoke programs. Consequently, there can be some inconsistencies
    in the way that commands are used because the way in which a command is read by
    the program that it invokes,'
