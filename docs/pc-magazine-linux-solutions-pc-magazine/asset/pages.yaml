  md: '# Installing the software


    The first step in getting a SAMBA server up and running is to install the software.
    Depending on the options you chose when you installed your Linux system, you may
    already have SAMBA installed. You can check this by going whichever directory
    your system is used to house the startup scripts for the various servers on your
    system and looking for a script called samba or smb. For example, on a Fedora
    Core system, the appropriate directory would be /etc/rc/init.d. There you will
    find the file /etc/rc/init.d/smb, which is the main startup script for the SAMBA
    server program.


    Another method might be to use your distribution''s package management system.
    On Fedora Core, for example you can use the YUM tool to install SAMBA if it is
    installed by giving the command yum list samba like this:


    +   Setting up repositories

    Reading repository metadata in local files

    Installed Packages samba 3.0.14a-2 installed


    If you don''t find scripts, you need to install the software, using whichever
    package system is installed on your distribution. (Package management systems
    are discussed in Chapter 15.) If you''re using any of the major distributions,
    you should be able to find the SAMBA package on one of the installation CDs or
    on your distribution''s download site.


    # Note


    Again, if you''re using Fedora Core, you can use the YUM tool to install SAMBA.
    You can accomplish this by giving the command yum install samba.


    If you can''t find the source, or if you want to check whether there are newer
    packages available, check www.samba.org. The SAMBA team maintains a repository
    of packages for many Linux distributions, as well as source code packages that
    you can compile and install yourself, if you prefer. Different distributions sometimes
    puts in nonstandard locations, and a source code installation lets decide for
    where you want to put things.


    # Configuring the SAMBA server


    Once the SAMBA package is installed, you need to do something to get it ready
    to run. There are several ways to do this:


    +   - Use a graphical tool.

    - Edit the configuration file manually.

    - Use SWAT, the SAMBA Web Administration tool, a utility that allows you to configure
    SAMBA using a Web browser.'
