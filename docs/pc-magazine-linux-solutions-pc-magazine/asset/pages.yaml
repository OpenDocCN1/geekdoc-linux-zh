    # maximum_object_size_in_memory 8 KB


    These parameters detail the relationship between what''s in memory and what''s
    in the disk cache. You may adjust these parameters depending on the amount of
    memory and disk space you have. Excessive swapping between the memory and disk
    cache slows down performance a bit, it''s important to allocate enough memory
    to keep swapping to a minimum. Likewise, you''ll keep your disk allows decent
    so that objects can be moved in and out as needed. In general, you can start with
    the defaults and tune as the needs arise.


    One other option you may want to customize is the cache_dir option. This option
    defines the directory that Squid uses when it moves objects onto the hard drive.
    The default value for this option is /var/spool/squid, which is a reasonable value.
    If you''re looking to do a heavy-duty installation, you may wish to create a hard
    partition that will only use the Squid cache. You can name this directory anything
    you want, as long as you remember to set the cache_dir parameter to the name of
    directory. Other options must be set along the name of the directory; here is
    the relevant section of the configuration file:


    +   #TAG: cache_dir

    #Usage:

    #cache_dir Type Directory-Name F-specific-data [options]


    +   #You can specify multiple cache_dir lines to spread the

    #cache among different disk partitions.

    #Type specifies the kind of storage system to use. Only "ufs"

    #is built by default. To enable any of the other storage systems

    #see the --enable-storeto configure option.


    +   #''Directory'' is a top-level directory where cache swap

    #files will be stored. If you want to use an entire disk

    #for caching, this can be the mount-point directory.

    #The directory must exist and be writable by the Squid

    #process. Squid will Not create this directory for you.


    +   #The Ufs store type:

    #"ufs" is the old well-known Squid storage format that has always

    #cache_dir ufs Directory-Name Mbytes L1 L2 [options]

    #''Mbytes'' is the amount of disk space (MB) to use under this'
