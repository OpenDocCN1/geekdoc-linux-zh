  md: 'Depending on the software you choose and how your system is configured, you
    can use a dedicated package to back up your files or simply drag important files
    and directories onto your writable CD-ROM, writable DVD drive, or your external
    drive. However you do it, make sure you back up any directories where you stored
    your important files. This is usually My Documents folder, which may also contain
    folders called My Music, Pictures, and so on, that contain important data that
    you created on your system. You may also want to examine the files on your desktop.
    In theory, your desktop usually contains shortcuts to files that are actually
    stored in your personal folders, but many people also store working copies of
    their files there. You should also check the top level of your C: drive, because
    many people create personal folders and use them to organize their data. Remember,
    you making backups of important data—this is no time to cut corners or do a fast
    job to get it over.


    # Note


    This section focuses on backing up your personal data, not critical parts of Windows
    itself. Locating and backing up the right system files is a black art that is
    left to designed for Windows backups. If you''ve installed custom drivers and
    software on your system, you should back up any directories containing anything
    you''ve downloaded and installed. You should also use regent, the Windows Registry
    Editor, to make a backup copy of your Windows registry in the unthinkable situations
    and you have to reinstall Windows.


    # Making Room for Linux


    After you''ve done backups of your important files and verified that the backups
    are readable, it''s time to move on actually repartitioning your disk to make
    room for Linux. The first step in doing this is to defrag your disk, which packs
    the disk space occupied with all of the files and directories on your Windows
    partitions closely together as possible. Disks become fragmented as you create
    and delete files. There''s nothing you can do about except clean things up occasionally.
    When you partition your disk, you''re essentially slicing off part of an existing
    partition disk so that you can use it for something else. You can just remove
    a portion of an existing partition if it contains parts of files that you are
    using.


    Disk storage on a computer is allocated in blocks, which is just for the smallest
    chunk of space the file system can allocate that can be used by a file. When you
    create a file on a computer system, the underlying file system that holds the
    file tries to allocate the blocks associated with that file together so that they
    can be read or write as a unit or at least read relatively quickly. Unfortunately,
    the blocks associated with a file tend to be spread out over a disk partition
    as new blocks are allocated and old blocks released when a file is edited, appended
    to, deleted and so on. When you read a file on a computer, the computer needs
    to read its data in logical order, which is not necessarily the same order as
    the data are laid out on available blocks throughout the disk. Figures 8-1 and
    8-2 show how allocation works and how fragmentation occurs over time.'
