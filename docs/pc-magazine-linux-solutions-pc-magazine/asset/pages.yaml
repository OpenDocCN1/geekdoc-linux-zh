- img_proc: true
  md: '# Chapter 15: Software Management Solutions 255


    The most common query is this: format:


    ```

    rpm -qiv package name

    ```


    In this case, the -q option indicates that you''re running a query. The -i option
    specifies that you want the packages information, and the -v option indicates
    that you want verbose output. Don''t be confused by the fact that you have an
    -i option here. Because the first option in the set is -q, the -i option is taken
    from the set of query options, not the set of installation options. This prints
    a good deal of information about the named package, including the name, version
    and description. For example, the


