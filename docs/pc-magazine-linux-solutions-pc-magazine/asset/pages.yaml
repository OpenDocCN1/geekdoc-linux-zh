    # # Backup Devices


    After deciding what you need to back up, the next step in your backup strategy
    is to decide what kind of media you will use to store your data. The answer depends
    on several factors, including storage capacity, reliability, price, writing speed,
    and availability of media.


    # # Tapes


    You''ve probably seen old movies where a huge computer has a whole bank of tape
    machines clicking and whirring away. Tapes have been around a long time and are
    still used in wide today because of their reliability and speed. They are a bit
    expensive, and the cheaper kinds don''t have much storage capacity. There are
    several varieties:


    +   - DDS or SCSI DAT: Storage capacity for these tapes is up to 20GB. The tape
    drive uses the SCSI interface to talk to the Linux kernel, so compatibility is
    not a problem.


    +   - Qc/Travan: This is the older standard of tape technology, but still in widespread
    use. Storage capacity is between 400MB and 10GB. A special device driver is needed
    for Linux to be able to access the drive, but it is included in the standard kernel
    and is compatible with most models.'
