    In the main panel, you can see a number of themes listed. As with the Desktop
    Background Preferences window, you can select a theme simply by clicking on it.
    The visual elements of your desktop change when you do. (This may take a few seconds.)
    If you like the theme and decide to keep it, simply click Close to exit the Theme
