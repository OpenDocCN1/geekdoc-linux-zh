  md: '# 342 PC Magazine — Linux Solutions


    # Don''t use the superuser account


    It''s been said elsewhere in this book, but it bears repeating: Don''t use the
    root account for anything than essential system administration tasks. Have mail
    for root forwarded to an ordinary account and read it do other everyday tasks
    from there.


    # Don''t make files executable


    Don''t change the permissions on unknown files to make them executable unless
    you know exactly what they do. Never, under any circumstances, make such files
    setuid or setgid. (See Chapter 13.)


    # Use permissions and ownership


    Make use of Linux''s permissions and ownership system. This stops other users
    from being able to read (delete) your files. For every task that requires special
    handling, create a separate user account and make sure any automated scripts or
    executables it runs as that user.


    # Log out or use a screensaver


    A simple but effective technique for maintaining security is to log out when you
    are finished. If you can''t keep forgetting, the next best is a screensaver that
    locks the screen and reenables it after you reenter your password.


    # Use SSH with Telnet for remote access


    Telnet is a program that lets you log into another computer and work on it in
    text mode. Telnet is one of the oldest network applications; actually older than
    the Internet. However, it has a fatal flaw that transmits and receives everything
    in plain text. As I mentioned earlier in this chapter, this leaves the door open
    for eavesdroppers. Luckily, there is another program, Secure Shell (SSH) that
    does the same thing but encrypts communications. Fedora uses an open source implementation
    called openssh. It is split into two RPM packages for flexibility: openssh-clients,
    which you need to access other computers, and openssh-server, if you need other
    people to access your accounts. (In that case, remember to allow incoming SSH
    to pass through your firewall.)


    You can improve security with SSH by doing away with passwords altogether. Use
    SSH cryptographic keys to determine that you are who you say you are. By changing
    to the .ssh subdirectories of your home directory and running the ssh-keygen program
    to create a key:


    ```

    $ cd ~/.ssh

    $ ssh-keygen -t dsa -f id_dsa

    ```


    When prompted by ssh-keygen to enter a password, just press Enter. What the program
    is doing is creating two files encrypted with the DSA cipher. (Other ciphers are
    available, but this is the recommended choice.) The id_dsa is the private key,
    which you keep secret on your computer. The other, id_dsa.pub, is the public key.
    The public key can be placed on a remote computer you wish'
