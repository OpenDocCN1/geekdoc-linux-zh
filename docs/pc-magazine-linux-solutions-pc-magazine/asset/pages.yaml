- img_proc: true
  md: '# 334 PC Magazine — Linux Solutions


    The most significant entries in the routing table are the entries for local network
    traffic and the entry for your system''s default gateway, identified in the Destination
    column in the output of the route command. The routing for network traffic to
    your local network is identified by an entry with the first three octets as your
    local network, but with a zero in the fourth. In the example, the entry for local
    network routing (192.168.6.0) shows that the kernel routes all local traffic to
    your system''s eth0 interface. Similarly, any traffic to hosts that are not on
    the local network segment, identified as default routing, is sent to the Gateway
    system 192.168.6.1 through the Ethernet interface, eth0. A Linux system''s default
    gateway is always identified by the presence of the 6 in the Flags column for
    that.


    You will rarely need to change the system''s routing table because this is configured
    by the information in your system''s network configuration files. If you modify
    your IP address or your system or your local administrator changes the configuration
    of your network, you may need to update the routing table. Typically, you would
    do this by using your system''s graphical configuration tools to modify your default
    settings and reboot your system, but you can also do this by executing the route
    command to delete an existing routing table and then using the route add command
    to add a new entry to the kernel routing table. You must execute these commands
    as the root user or with the sudo command because you are modifying data that
    is stored in the running Linux kernel. This is not something that an privileged
    user should be able to do!


    For example, to change my system''s routing table so that default traffic is routed
    through the local IP address 192.168.6.66, I would execute the following commands:


    ```

    # route del default

    # route add gw 192.168.6.66

    ```


    The first command deletes the current default route, and the second command sets
    the new default gateway to the IP address 192.168.6.66. As mentioned previously,
    this is something that you would rarely, if ever, need to do, but it is better
    to know that your Linux system provides the power to make these system-level changes
    quickly, by executing a few simple commands.


    # Note


    If you change IP addresses on one of your systems and your network (or computer
    system) implements a firewall based on IP addresses, you may need to modify the
    configuration of your firewall (or at least to ensure that external communication
    is working correctly). This is especially true if you move systems from one network
    to another, it can still be significant when simply assigning a new IP address
    on the same network segment'
