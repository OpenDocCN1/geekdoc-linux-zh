  md: '# Using the Nautilus file manager and Web browser


    GNOME''s native file manager is Nautilus, and it incorporates many of the features
    that users have come to expect from a file manager on any operating system. Double-click
    on one of the icons on the desktop, or one of the folder options in the Places
    menu, and a Nautilus window (shown in Figure 9-11) opens showing contents of that
    directory.


    > Note

    The exception to this the Computer icon or menu item. This icon doesn''t actually
    access the root directory. Rather, it shows a number of options representing the
    various file locations on the system. These options might include the network,
    the floppy or CD-ROM drives, or the file system. Double-clicking on the Filesystem
    icon takes you to your root directory


    ![](img/65ef52f6e9fc73ddc3051990377c4f5b_146_0.png)


    **Figure 9-11**: Nautilus showing the Computer display.


    With any typical file manager, you can navigate through the directory tree by
    clicking on entries within the Nautilus menu. Clicking on files rather than folders
    opens in a program that depends on the file type; text files in a text editor,
    HTML files open in a Web browser, and so on.


    > Note

    autilus is also a Web browser. You are not limited to viewing files on your local
    machine. Enter a Web site address, and you will see that Web page. Nautilus is
    not as fully featured a browser as, say, Firefox, but for basic browsing, it''s
    fine.'
  merge: -1
