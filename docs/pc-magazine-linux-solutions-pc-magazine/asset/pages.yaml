- img_proc: true
  md: '# Chapter 20: Linux Security Solutions 343


    to access. Make a directory called .ssh in your home directory on the remote server
    if it doesn''t exist already. Copy id_rsa.pub into a file called authorized_keys2
    in that directory (The 2 signifies it is the location for DSA keys. The authorized_keys
    file is used to store keys using other ciphers.). The authorized keys2 file can
    store multiple keys if you want access from different machines.


    ```

    cd ~/.ssh

    scp your.local.pc:~/.ssh/id_rsa.pub

    cat id_rsa.pub >> authorized_keys2

    ```


    Make sure the permissions on the .ssh directory and authorized_keys keys are tight
    so they cannot be tampered with, and delete the id_rsa.pub file that you don''t
    need it anymore.


    ```

    chmod 700 ~/.ssh

    chmod 640 ~/.ssh/authorized_keys2

    rm ~/.ssh/id_rsa.pub

    ```


    Now back to your local computer. When you use an SSH connection to the remote
    computer, the public and private keys are compared, and if they match, you are
    logged in. Once you have SSH set up correctly, you should never use Telnet again.


    # Prefer encrypted versions of other protocols


    Secure protocols typically use Secure Sockets Layer (SSL) or Transport Layer Security
    (TLS). They require the use of a digital certificate, which is a special file
    signed by some trustworthy organization (a certification authority) and establishes
    your server''s identity.


    You can act as own certification authority with scripts included in the openssl
    package. The trouble with self-signed certificates is that most software will
    raise a red flag and ask the user if he wants to trust it before continuing. Smart
    programmers will ask only once, but some will with every connection. If that is
    tolerable for you, self-signed certificates are an option. Otherwise you can buy
    a commercial certificate from vendors like Verisign (www.verisign.com/).


    Nowadays, plain text Internet protocols also have versions that use encryption,
    and you should use them whenever possible.


    +   - openssh comes with programs scp and sftp, which can replace FTP

    - All common mail servers support SMTP over SSL/TLS (smtps). (Note you still need
    to allow plain SMTP access in order to receive mail from the majority of servers
    that don''t speak smtps)

    - Most IMAP servers support IMAP over SSL/TLS (imaps).

    - Apache and other Web servers support HTTP over SSL/TLS (https). Using https
    is must if you want to do e-commerce.'
