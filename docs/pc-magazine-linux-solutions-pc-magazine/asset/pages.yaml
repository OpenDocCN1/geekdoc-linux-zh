  md: '# Chapter 19: Adjusting Your Internet Settings 327


    A sample /etc/resolv.conf file from one of my systems is shown:


    ```

    domain vonhagen.org

    nameserver 207.44.142.94

    nameserver 204.127.202.4

    nameserver 216.148.237.68

    nameserver 207.44.212.82

    ```


    The first entry in this file uses the domain keyword to specify the default domain
    when looking up short names, such as win2k, ubuntu, myserver, and so on. This
    entry prevents you from always having to specify the name of your local network.
    In this case, default domain is vonhagen.org, which means that if I try to contact
    a host myserver, the DNS system first attempts to locate the IP address for that
    name, and then automatically locks the IP for the host myserver.vonhagen.org.


    The remaining entries in this file identify the IP addresses of different name
    servers that your system should contact when mapping host names to IP addresses.
    These name servers are queried in order, and are identified by their IP address
    because your Linux system would otherwise have to use DNS to map names to IP addresses,
    which would present an interesting bootstrapping problem when trying to find the
    IP address of the first server in this file.


    Most programs and configuration files in Linux, online help on the contents and
    format of this file is available using the Linux man command: resolv.conf.


    # Using Graphical Network Managers


    As mentioned previously, almost all Linux distributions today provide graphical
    tools for network configuration or reconfiguration. Fedora Core and Red Hat Linux
    systems include the system-config-network application in Figure 19-1. Graphical
    network configuration tools are important to Linux users and system administrators
    because they hide distribution-specific aspects of network configuration, such
    as the specific text files that hold basic network information and where they
    are located. This is especially important to new Linux users because each distribution
    uses different files, settings in those files, and so on. Trying to remember where
    each and every distribution stores network information can be a headache; using
    graphical network administration and management tools removes this pain.


    All graphical network configuration tools enable you to store the key information
    for network configuration that were discussed in the previous section:


    +   - IP address

    - Netmask

    - Default gateway (sometimes referred to as routing)


    Figure 19-1 shows the initial screen of the graphical system-config-network tool
    used in the Red Hat Enterprise Linux and Fedora Core distributions.'
