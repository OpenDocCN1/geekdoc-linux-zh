  md: '# Chapter 8


    # Dual-Boot Installation


    Dual booting is the term used to describe computer systems that can run more than
    one operating system (though not at the same time). This chapter explains how
    to configure a new existing Windows system to boot Linux using freely available
    Linux software. The only requirement for doing this is that you have sufficient
    space on your computer''s drives to hold both operating systems and their associated
    applications. In addition, you''ll need to have a copy of the Knopix live CD that
    comes with this book and the installation CDs for the version of Linux that you''ve
    decided to install.


    # The Boot Process in Detail


    One of the steps in installing Linux in general is configuring the Linux boot
    loader. This is even more important in dual-boot scenarios, as you learn in the
    "Installing Linux on the New Partition" section later in this chapter. First,
    let''s explore the boot process in a bit more detail so that you understand how
    a boot loader works and where it fits into the computer process.


    Once the loader is loaded into memory and running, it reads a configuration file
    located on the device that contains the boot loader and displays any available
    options for booting the computer system. On systems that run only one operating
    system, your boot options are straightforward and limited to starting with that
    operating system. On systems that can boot multiple operating systems, the boot
    loader options are very similar but slightly more complex, including all of the
    available operating systems on your computer. Instead of offering multiple ways
    of booting a single operating system, the options, such as they are, typically
    enable you to choose among operating systems.


    This sequence of executing a boot loader, which then loads and starts a more complex
    operating system, is known as booting your system because the system is performing
    actions that are analogous to the old expression of "pulling yourself up by your
    bootstraps."'
  merge: -1
  pgno: 115
- img_proc: true
  md: '# 92 PC Magazine — Linux Solutions


    Tip

    All computer systems, including Microsoft Windows systems, use a boot loader,
    but you rarely need to interact with it computer systems that always run a single
    operating system. However, if you''re curious, you can press F8 after you turn
    on most Microsoft Windows systems to see the options provided by the Windows boot
    loader.


    # Linux and Windows Together


    As you learn in this chapter, it''s quite easy to configure your system to run
    your choice of operating systems. You can easily configure your system to boot
    Windows when you need to read mail from your Exchange server or use Windows applications
    but boot Linux when you need to do complex, server-oriented tasks or to explore
    the power of a true multitasking, multiuser operating. Configuring a system that
    dual boots Windows and Linux is a great way to get familiar with Linux without
    having to give up Windows applications. Once you become friends with Linux and
    learned how to do everything you can choose to Linux permanently. Setting up a
    dual-boot system is also a great way to learn Linux if you have only one computer
    system and aren''t willing or able to simply take the plunge and move to Linux
    full time.


    Note

    This chapter explores how to add Linux to an existing Microsoft Windows system.
    You can also add Windows as a second operating system on an existing Linux system,
    a topic outside of the scope of this.


    Chapter 5 explains why and how to create multiple partitions on your hard drive,
    each which stores different parts of the files and directories that make up the
    Linux system. Microsoft Windows also uses partitions but usually creates a single
    partition per disk drive when you install Windows. This simplifies things but
    makes it tricky to add another operating system to that same computer. You generally
    have two choices:


    +   - Add another hard drive to the computer system and install Linux.

    - Change the existing partitions on your computer''s hard drive to provide space
    in which you can create another partition, where you can then install Linux.


    The first of these is usually an option in desktop computer systems, assuming
    that you have room for another machine drive, having sufficient funds to buy another
    disk drive, and are dedicated and technical enough to open up your computer and
    add a hard drive correctly. However, if you have sufficient free space available
    on your system''s existing drive, the second option is cheaper,'
  merge: -1
