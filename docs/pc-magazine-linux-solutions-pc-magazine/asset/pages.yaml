    the text-mode method described in the following section.) The Fedora Core configuration
    program is called system-config-nfs and can be started by giving that command
    in a terminal window or by using the menu Applications -> System Settings -> Server
    Settings -> NFS. When you start system-config-nfs, you are prompted for the supper
