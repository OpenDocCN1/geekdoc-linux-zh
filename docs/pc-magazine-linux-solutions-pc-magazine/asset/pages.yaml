  md: '# Chapter 20: Linux Security Solutions 357


    The mathematical algorithms used to create the key depend heavily on random numbers.
    The problem is: how do you get random numbers from a decidedly nonrandom machine?
    The only really unpredictable element is you, the user. By just doing things like
    typing or moving the mouse around, you can increase the randomness of the numbers
    your computer generates. Generating the key can take some time if you specified
    a long length.


    Eventually the key is created. GnuPG presents some information about the newly
    created key:


    ```

    gpg: 0ACC9546 marked as utimately trusted

    public and secret created and signed.

    ```


    ```

    gpg: checking the trustdb

    gpg: 3 marginal(s) needed, 1 complete(s) needed, PGP trust model

    gpg: dealth: 0 value; 2 signed: 0 trust: 0; Oq, 0; Om, 0; Fu

    1024D/0ACC9546 2005-10-20

    Key fingerprint = F8B1 7890 7FA2 2A2F 7466 2A1B 8E29 33 0ACC 9546

    uid Linux Torvalds (Linux inc.) <linux@example.com>

    sub 2048g/W202C034 2005-10-24

    ```


    The fingerprint is the actual binary code contained within the key. Just as your
    fingerprints are unique to you, the key''s fingerprint uniquely identifies it.
    It is usually shown as a sequence of hexadecimal digits. For you, you can use
    the last hexadecimal digits of fingerprint to refer to the key.


    The other information contained in GnuPG output concerns how trustworthy the key
    is. A big problem with public key encryption is how to know if the key is actually
    associated with the person it says it is. As if you are hiring a new employee—they
    can give you an impressive resume, but do you really know they''ve done all the
    things they say they have? You have to contact the references listed on the resume
    to see if they vouch for the accuracy of the statements made by the candidate
    and think him trustworthy.


    In the same manner, if you have contacted me and my integrity, and if I have met
    Linux Torvalds and verified it then you can also trust that 0ACC9546 belongs to
    him. GnuPG has the ability to add signatures to a key and display. So you can
    see the signatures of a key and who considers it trustworthy. In turn, you can
    see the keys of other people and the trust that has been placed in your key will
    carry over to them. This is called the web of trust and it extends across the
    entire world.


    The GnuPG web of trust and public key encryption in general depends been kept
    secret.


    +   * Do not keep your private key on a computer that is connected to the Internet.
    If the computer gets hacked your private key might get stolen.

    * Do not keep your private key on a computer where you don''t know or can trust
    the system administrator. The superuser has the power to override permissions,
    snoop through memory, or keyboard activity, any of which could be used to steal
    your key.'
