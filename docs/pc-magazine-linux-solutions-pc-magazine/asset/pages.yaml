  md: '# Chapter 20: Linux Security Solutions


    # # Security Best Practices


    Paranoid yet? Luckily, you can defend yourself against or at least mitigate the
    threats mentioned here. In this section, I go over some of the steps you should
    take.


    # ## Secure physical access to the system


    Your efforts at security can easily be bypassed if a miscream reboot the system
    and start up again from a Knoppix live CD. If your computer has a BIOS password
    option, use it. Configure the boot loader (see Chapter 4) to ask for a password.
    Keep the system in a locked room or at least out of the path of the public.


    # ## Firewall


    Your first line of defense against attacks coming from across the network should
    be a firewall, a program that filters network traffic. If you have a broadband
    connection to the Internet (cable modem or DSL) or a wireless router, the chances
    you already have a hardware firewall. If you do, not need to worry because Linux
    has built-in firewall capabilities (Setting up a Linux firewall is a must if you
    have a laptop you take out on the road.)


    You are asked if you want to set up a firewall during the installation of most
    Linux distributions. Figure 20-1 shows an example from Fedora Core 4.


    ![](img/65ef52f6e9fc73ddc3051990377c4f5b_363_0.png)


    Figure 20-1: Firewall configuration dialog.'
