  md: '# # Chapter 1


    # # Why Use Linux?


    ![](img/65ef52f6e9fc73ddc3051990377c4f5b_27_0.png)


    Welcome to the wide, world of Linux! The Linux operating system has gotten a tremendous
    amount of press over the past few years, and this explains why you want to see
    what all the fuss is about. In slightly over 10 years, Linux has blossomed from
    its roots in two free software projects to its adoption as the operating system
    of choice for most enterprise computing centers. It is also the default operating
    system used on inexpensive PCs or for many consumer electronics. ads for companies
    selling Linux distributions, and for ads offering computers running different
    versions of Linux.


    Linux is different and unique enough that anyone who is trying to learn about
    it has plenty of questions. Linux is free, so why are people selling it? It involves
    something open source, but what is the heck? This thing I keep hearing about —
    is the same thing! What do acronyms GNU, GNOME, KDE, and X mean? How can there
    be so different versions of one operating system? Can I do anything useful with
    Linux, or is it only for computer students, nerds, and hackers?


    This book answers those questions and more. This chapter provides all background
    information that you''ll need to understand what Linux is, where it comes from,
    and why it becomes popular. History lessons aren''t usually a part of learning
    a computer operating system, but Linux has social and philosophical components
    that make it more interesting than an off-the-shelf operating system that is just
    the product of some company. As you can see in this book, Linux is a powerful,
    dynamic operating system that is being built by thousands of developers all over
    the world. If you''re looking for a solution to computing problems and


    not particularly interested in changing the world, that is fine — you don''t have
    to have the Linux flag just because you decide to use it. Plenty of other people
    are willing and eager to do that for. Many people, Linux is a powerful, inexpensive
    operating system that comes with tons of free, entertainment, and easy-to-use
    software that tells them what they need to do.


    Two points are worth clearing right off the bat. First, what is Linux? Conventionally,
    Linux is the collective name for an operating system and its associated applications,
    just like any other computer operating system. A *kernel* is the common name for
    the single program that is the actual operating system and runs directly on the
    hardware, managing your memory, disks, and peripherals, starting and stopping
    other programs, handling requests for resources from applications, and so on.
    As discussed in more detail later, Linux is technically just the name of the kernel—most
    of the applications that anyone uses with Linux come from other free software
    projects. However, a Linux distribution'
  merge: -1
  pgno: 27
- img_proc: true
  md: '# PC Magazine — Linux Solutions


    is the common term for a Linux kernel, a set of applications that can run on top
    of it (regardless of where they come from), and a tool to install everything and
    configure your.


    Secondly, how can Linux be free and at the same time? That''s confusing, but easy
    enough to answer. The source code for Linux is indexed freely from thousands of
    sites on the Internet. Anyone who wants get it, but building a system out of it
    that you can easily install on a computer is another entirely. When people say
    Linux, they are basically selling a prepackaged and install collection of free
    things—they are just charging you for the media that it comes on and the time
    they invested in putting it all together; they also "charging in advance" for
    any customer support that you might need if you encounter installation or configuration
    problems.


    Now that those are out of the way, let''s explore a bit of the history of Linux
    to give you an idea of where it comes from, why it is so powerful and popular,
    and how Linux distributions make it easy for you to install and get started with
    this exciting, powerful operating system.


    # The Evolution of Linux


    The inspiration for Linux is an operating system known as Unix, which was developed
    at Bel Labs in Murray Hill, New Jersey, in 1969. The Unix name is a pun on Multics,
    which was an operating system research and development project being done at Bel
    Labs (then part AT&T) in conjunction with the U.S. government, General Electric,
    MIT, and others. As the Multics project disintegrated from much complexity and
    cost over time, a number of Multics developers and their associates continued
    their operating systems research, among Ken Thompson, Dennis Ritchie, John McIlroy,
    Rudd Canary, and J. F. Ossanna. They began developing a smaller, lighter-weight
    operating system on a much smaller system, a DEC PDP-7. Multics stood for Multiplexed
    Information and Computing Service, so UNIX was introduced as a humorous name supposedly
    for Un Information and Computing Service, referring to the fact that Unix was
    developed and ran on smaller systems than the mainframe on which Unix was to run.
    Unix was eventually adopted as a sound-alike to UNICS, and the name that we knew
    now was born.


    The original motivation for developing the Unix operating system and file system
    on the PDP-7 was to facilitate running a game that Thompson had originally written
    for Multics, called Space Travel. The capabilities of Unix, the operating system
    and associated utilities became more interesting than the game, and the rest is
    history. The team quickly took the PDP-7, so the group eventually got a newer,
    more powerful machine, a DEC PDP-11. The purchase of the new machine was justified
    by using Unix as the foundation for a text processing system for the Bell Labs
    patent office, which was the first commercial, real-world use of Unix.


    # The C language


    The process of moving any operating system and its applications to hardware, known
    as portability, is typically extremely time-consuming. Unix was originally written
    in assembly language, which differs from machine language. Thompson developed
    a language called B, based on an older language from Xerox PAR as BCPL, and attempted
    to write much of Unix in the higher-level B language, but his rewrite was hampered
    by shortcomings of the language.'
  merge: -1
  pgno: 28
- img_proc: true
  md: '# Chapter 1: Why Use Linux


    Ritchie added concepts such as types and data structures to B, eventually ending
    up with a new language, which he called C. In 1973, Thompson rewrote as much of
    Unix as possible in C.


    Minimizing the amount of machine-specific code required by Unix made porting it
    to new hardware much easier because only the machine-specific routines had to
    be rewritten for the new hardware. This portability was one of the big reasons
    for the initial popularity of Unix. The core portion of Unix remained in machine-specific
    assembly language, but this was reduced to a few hundred lines. The portions of
    Unix in C (which was most of it, at this point) could simply be complied for the
    new hardware once the compiler was ported to support the machine''s hardware instruction
    set.


    # Unix goes public


    At the time that Unix began, AT&T was operating under a government ruling that
    broke its monopoly on the telephone system. To prevent AT&T from emerging as a
    monopoly in other areas, this ruling also prohibited the company from branching
    into other lines of business. Thus, it couldn''t market its operating system.
    For this reason, it was decided to license Unix to various academic and research
    institutions.


    Once Unix hit the academic and research communities, its future was secured. Researchers
    and graduate students quickly adopted Unix as their platform of choice, using
    it as a daily platform as well as the reference platforms for research efforts.
    The reason for this quite was the source code for Unix was freely available to
    licensees, which made it easy for developers to see how the operating system worked,
    fix problems, and extend its capabilities. In this chapter, we come back to how
    having the source code for an operating system can help popularize and facilitate
    its adoption—this matter of freely available source code is one of the driving
    factors for the adoption and popularity of Linux.


    Aside from the source-code issue, Unix was interesting to researchers and developers
    for other reasons. I want not to tell you with all of the reasons (there are plenty
    of books that can do that for you), but some of the most significant reasons are
    First, Unix was a true multiuser, multitasking operating system running on relatively
    small, inexpensive machines. This meant that entire groups could share access
    to development time on the same machine. Secondly, Unix introduced a very interesting
    way of accessing and using devices. All devices attached to Unix, regardless of
    whether they are disks, printers, or network devices, can be accessed as streams
    of characters. This provides a single, consistent way of reading or writing to
    any device, unlike the complex, specialized commands that other systems at the
    time required for accessing each kind of device.


    Finally, UCB''s collection of enhancements eventually grew large enough to be
    that they turned into the popular Berkeley Standard Distribution (BSD) of Unix,
    whose source code was freely available to any Unix licensee. (Conceptual derivatives
    of BSD are freely available today as FreeBSD, NetBSD, and OpenBSD.) All System
    units since 1980 or have so supported TCP/IP networking.


    Unix is traditionally associated with workstations, which are relatively high-power
    desktop systems with sophisticated graphics capabilities. Today''s workstation
    vendors, primarily Hewlett-Packard, IBM, Silicon Graphics, and Sun Microsystems,
    all licensed for Unix from AT&T;'
  merge: -1
  pgno: 29
- img_proc: true
  md: '# 6 PC Magazine — Linux Solutions


    they have continued enhancing it developing software that enables their version
    of Unix to take full advantage of the capabilities of their hardware.


    Unix development is still taking place today, and almost all computer vendors
    offer some version of Unix. However, Unix is rapidly eclipsed by Linux for a variety
    of reasons, most notably lower cost, higher power, vendor-independence, and books
    like this one.


    # The GNU project


    While the source code for Unix has always been available to licensees, the popularity
    of Unix has ensured that many people wanted to access it. Originally owned by
    AT&T, some versions of the source code escaped into the wild thanks to its popularity
    in less fromm academic and research environments; but there were always lawyers
    of standing around, waiting to enforce AT&Ts possessive attitude irritated by
    the more progressive members of the software community, most notably Richard Stallman,
    in 1983, announced the GNU project, a project dedicated to developing software
    that would be freely available. Stallman is also known as the founder of the Free
    Software Foundation (FSF; http://www.fsf.org) which is an institution to help
    raise funds for the GNU project, and to generalize and popularize the concept
    of free software.


    The GNU project (http://www.gnu.org) consists of a completely operating system
    kernel and a huge collection of utilities. GNU is a recursive acronym that stands
    for GNU''s Not Unix. Because the source code for every part of the GNU is freely
    available, it is known as open project—the source code is freely available from
    the FSF and anyone who uses it. Interestingly enough, the source code is freely
