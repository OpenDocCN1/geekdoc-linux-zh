    Again, Linux supports most-off-the-shelf components used in desktop systems.


    # # Backing Up Your Data


    When you install Linux, you need to create two partitions on your hard disk, one
    for swap space and one for your Linux applications and data. If you already have
    installed (and chances are you), you need to adjust the size of the Windows partition
    to free up space for the Linux partitions. This operation can potentially destroy
    your Windows partition, so to back up your data prior to installing Linux. You
    can get around this issue by installing a new hard disk to use for Linux. In this
    case, the Linux partitions won''t affect your Windows partitions. Even so, some
    Linux distributions, in an effort to be friendly, format your hard disks, all
    of them, for Linux.


    > Caution

    Always double-check what the Linux installation program plans to partition and
    format. See Chapter 5 for more on partitioning your hard disk and Chapter 8 for
    building a system to dual boot Windows and Linux.


    # # Back up your system?


    Back up your data. Back it up now. Backing up is the thing to do. Why? Because
    computers and computer data storage is far too fragile. A backup of your data
    provides an extra level of protection'
  merge: -1
  pgno: 54
- img_proc: true
  md: '# Chapter 3: Preparing for Installation


    in case anything goes wrong. If all goes well, you will never need to use your
    backups. But, if all does not go well, your backup may save your keister.


    Hard disks fail. If you need to partition your hard disk, you may lose everything.
    Your system may wipe out all files on the disk. This is not supposed to happen,
    of course. But it may.


    # Note


    Most people don''t make regular backups until something goes wrong. Then, they
    realize the purpose of making backups. Of course, most people (the author included)
    learned this lesson the hard way and too late. Go ahead. Don''t back up. I dare
    you.


    # Gathering the installation and restore disks


    Windows PCs should come with a set of CDs intended to restore your system in case
    of system failure. This will likely include at least one restoration CD from the
    system vendor, such as Dell or Hewlett Packard, a Windows CD with a certificate
    of authenticity; and one more CDs of the applications that come with your PC.
    If something goes wrong with your Linux experience, you will need these disks
    to restore the system to its original Windows-only glory. Find these disks now,
    so that you need them, they are on hand.


    In addition, these may have special CD keys and strings of text that provide the
    magic code to unlock Windows and Windows applications.


    # Making backups on Windows


    Windows XP Professional includes a backup program in the System Tools submenu
    under the Accessories menu. (Select Start > Programs > Accessories > System Tools
    > Backup.) Windows XP Home includes a backup program on the Windows.


    Microsoft maintains a page describing how to make backups on Windows at www.microsoft.com/athome/security/update/howbackup.msp.
    In addition, you can find lists of backup utilities at http://directory.google.com/Top/Computers/Software/Backup/
    and http://dmoz.org/Computers/Backup/.


    # Note


    If this seems too complicated, you can generally take advantage of a poor-man''s
    backup by burning CDs of the data files on your system. You just need to back
    up the data files you''ve created, because restore disks allow you to reinstall
    Windows. Ta-Da! You''re done. This won''t save any settings made from the defaults
    on Windows, though. That''s why it is best to make a real backup, unless you can
    reproduce your Windows settings without requiring a backup.


    If you haven''t backed up your data yet, stop reading and do so right now. Then
    come back, read the next chapter, and feel good about yourself.'
  merge: -1
  pgno: 55
- img_proc: true
  md: '# Summary


    This chapter covers the steps to take prior to installing Linux.


    Before you install Linux on your computer, you should decide what kind of installation
    you want. (Whether you decide or not, the installation program will likely ask
    you anyhow) Each Linux distribution differs, but most offer choices such as a
    server installation, a desktop client installation, a soft-ware development (or
    workstation) installation, and the most interesting, the custom installation.


    After choosing the kind of installation, the next step is to determine your system
    hardware and verify this hardware runs on Linux, especially on the Linux distribution
    you want to use.


    Finally, but most importantly, back up your data before you install Linux. This
    is just in case something goes wrong.


    The next chapter covers how to get Linux and provides an overview of the major
    Linux distributions.'
  merge: -1
