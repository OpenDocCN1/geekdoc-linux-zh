    # Mozilla Firefox


    Firefox began as Netscape Navigator and was later rechristened in an open source
    version as Mozilla Navigator. More recently, the open source community took the
    somewhat ponderous Mozilla Navigator and pared it into into sleek, powerful Web
    browser called Firefox. In less than two years, not only has Firefox caught up
    with Microsoft Internet Explorer, it has surpassed the older program in many ways
    with features such as support for the latest Web standards, built in pop-up blocking,
    and greater emphasis on security. Figure 9-28 shows Mozilla Firefox in action.


    Firefox does not support ActiveX Controls (a type of Web extension used only in
    Microsoft systems), but it can use Netscape-compatible plug-ins. Available plug-ins
    include Macromedia Flash, RealAudio, and Adobe Acrobat. Some Linux distributions
    include these, but others don''t for licensing reasons, so you have to download
    and install them yourself.'
