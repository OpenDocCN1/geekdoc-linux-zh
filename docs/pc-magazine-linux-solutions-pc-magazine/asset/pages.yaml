    # OpenOffice.org


    Both GNOME and KDE contain office applications, but the premier Linux suite is
    OpenOffice.org (www.openoffice.org/). OpenOffice.org started life as a German
    product called StarOffice. Sun Microsystems bought StarOffice, while continuing
    to sell it as a commercial'
  merge: -1
  pgno: 161
- img_proc: true
  md: '# 138 PC Magazine — Linux Solutions


    product with support available, they generally decided to also release an open
    source version, OpenOffice.org. OpenOffice.org is now found in virtually every
    major Linux distribution. Several major applications make up the OpenOffice.org
    suite (with some utilities that expand its abilities even further):


    +   - Base is a simple database application similar to Microsoft Access. It can
    be used to create standalone databases with fancy reports, queries, and charts
    in conjunction with Calc and Writer.

    - Calc is the OpenOffice.org spreadsheet. It can open up and save Microsoft Excel
    spreadsheets, even that contain Visual Basic macros. It can connect to Base and
    other databases and create charts in a wide variety of styles.

    - Draw is a program for creating vector (line-based) images and diagrams. These
    can be embedded into other OpenOffice.org applications.

    - Impress is a presentation application similar to Microsoft PowerPoint. It has
    all the styles and visual effects a presentation junkie could wish for and can
    export its slides into HTML and PDF formats as may.

    - Writer is the OpenOffice.org word processor. It has all the formatting and layout
    features you would expect in a modern word processor, a thesaurus and spell checker
    for many different languages, and most importantly for Linux adopters, pretty
    accurate (though not, alas, perfect) import and export filters for Microsoft Word
    documents. Writer can also create HTML pages for the web.

    - Math is an equation editor, used for accurately typesetting complicated mathematical
    formulas. It works well with Writer and other OpenOffice.org applications and
    as a standalone application.


    Figure 9-27 shows an application from the OpenOffice.org site, Impress.


    Although I emphasized the compatibility of OpenOffice.org with Microsoft Office,
    I hope its own native formats will become industry standards in their right. Because
    OpenOffice.org is open source and cross-platform (with versions available for
    Windows and Mac as well as Linux) and because information about its file formats
    is fully available, using it is good insurance for ensuring your data stays future-proof.
    Unlike Office users, with OpenOffice.org, you can upgrade to a new version without
    worrying about compatibility, and without opening your wallet.'
