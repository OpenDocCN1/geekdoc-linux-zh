    # A (Very) Brief Introduction to Shell Programming


    As mentioned earlier in this chapter, the Unix shell is not just a command interpreter;
    it''s also a richly featured programming environment. Shell programming is more
    than a nifty feature of a Linux system; it''s a core component that makes the
    system work. When a Linux system first boots, it executes a series of shell programs
    that start all of the crucial system functions. By adjusting these programs, a
    savvy administrator can exercise fine control over the system.


    # Note


    You may have shell programs referred to as scripts. Indeed, I use that term times
    in this book as well. For all practical purposes, scripts and programs are the
    same thing. The term comes from an earlier period of Unix''s history, when the
    shell didn''t have nearly any programmer-friendly features. At that time, shell
    programs were little more than scripts that had to be followed without the way
    of self-adaptability. Days, the shell includes many of the features that you would
    find in any other programming language, and the term shell program is probably
    the more accurate one. Nevertheless, many people continue to use the term script,
    as a matter of convention and habit.


    Shell languages are interpreted. This distinguishes them from compiled languages
    such as C. The disadvantage of an interpreted language is that it is typically
    much slower than a compiled one. Compiled languages are converted to binary before
    they are run. Binary is the native language that the machine speaks, and so the
    program is ready to run right out of the gate. Interpreted languages, by contrast,
    must be converted to binary on the fly. This takes time, and so the programs tend
    to run slower, but with today''s processors, most people won''t notice a difference.
    The advantage of an interpreted language is that it''s easy to modify a program
    written in it. Because the program doesn''t need to be recompiled after every
    modification, you only edit the file in place, and the changes will be reflected
    the next time the program is run.'
