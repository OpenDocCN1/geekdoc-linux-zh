  md: '# 376 PC Magazine — Linux Solutions


    # # If You Have a Domain Name (Continued)


    Once you''ve got a name and a DNS service to go with it, you can set up your server
    to be available to the public. This is fairly simple and involves changing the
    values of a couple of directives. For this example, assume that you''ve registered
    your name myomain.com. To get your Apache server to answer to that, set the following
    directive:


    ```

    ServerName myomain.com

    ```


    and restart your server. Once the DNS service connects (and this could take as
    long as a couple of days), the public should be able to access your site from
    the outside world.


    Remember that you need a static IP address (one that doesn''t change). A lot of
    broadband and DSL services provides you with a dynamic address, which may work
    for a while, but your IP address changes, the DNS no longer points your domain
    to the proper address. It is possible to work around this—some DNS services offer
    a service that can be periodically updated via a program that you run on your
    machine—but these nowadays are probably not the best solution if you need reliable
    access to your server from the Internet.


    # # Tuning Apache’s Performance


    Web server performance can be a big deal. You can run a Web server on your desktop
    workstation that may be more than enough for experimentation or even serving the
    needs of a small department; but once you start many clients, you''re likely to
    find that all traffic can easily grind your server to a halt.


    There are lots of ways to set up servers for maximum performance. These include
    setting up dedicated servers (machines that do nothing but serve Web pages), distributed
    servers (machines that direct other machines to serve content), and so forth,
    but one of the most basic things you can do is set some parameters on your Apache
    configuration to best suit the type of traffic you anticipate. This section is
    intended to be a very brief introduction to Apache performance. It is by no means
    an exhaustive treatise on the subject, but this should be at least to get you
    thinking about the kinds of things you need to consider.


    Apache''s performance tuning controls the form of directives in the http.conf
    file. Remember that you''ll need to restart the server each time you change values
    in the file. You may need to experiment with different values before you find
    the one that best for you.


    +   * Timeout: The Timeout directive controls how long the server waits before
    sending a timeout message. The timeout message is the message that is sent when
    there''s a problem connecting to the server. You may have seen this sort of message
    when you''ve tried to connect to a site that isn''t available. The Timeout directive''s
    value is the number of seconds the server will wait.


    ```

    # Timeout: The number of seconds before receives and sends time out.

    # Timeout 120

    ```'
  merge: -1
  pgno: 400
- img_proc: true
  md: '# Chapter 21: Web Server Solutions


    +   - KeepAlive: The KeepAlive directive controls whether to allow persistent
    connections. A persistent connection means that a browser can make more than one
    page request per connection. Setting KeepAlive on can speed things up for users,
    but also means they may be connected to your server for longer than they would
    be otherwise.


    ```

    # KeepAlive: Whether or not to allow persistent connections (more than one request
    per connection). Set to "Off" to deactivate.

    ```


    ```

    KeepAlive Off

    ```


    +   - KeepAliveRequests: The MaxKeepAliveRequests directive controls the number
    of requests a persistent connection can make before the client is allowed to reconnect.
    Practically speaking, this means that the longer, the longer before the server
    kicks them off.


    ```

    # KeepAliveRequests: The maximum number of requests to allow during a persistent
    connection. Set to 0 to allow an unlimited amount. We recommend you this high
    number, for maximum performance.

    ```


    ```

    KeepAliveTimeout 100

    ```


    +   - KeepAliveTimeout: The KeepAliveTimeout directive determines how long (in
    seconds) the server waits for the next request from a persistent connection before
    deciding that it is not persistent anymore.


    ```

    # KeepAliveTimeout: Number of seconds to wait for the next request from the same
    client on the same connection.

    ```


    ```

    KeepAliveTimeout 15

    ```


    +   - Prefork MPM: Prefork MPM is not a directive but rather an Apache module.
    We haven''t described Apache''s modules, but in a nutshell, the Prefork MPM module
    determines how many Apache processes are running at the same time and how they
    will handle multiple incoming connections (Apache can create duplicates of itself—a
    process known as forking—in response to incoming connections).


    The directives enclosed within the Prefork MPM code block have their own role
    in determining how the server handles incoming load:


    +   - MinServers: The minimum number of idle processes that will wait for incoming
    requests


    +   - MaxServers: The maximum number of idle processes that can exist before Apache
    shutting down idle processes


    +   - StartServers: The number of idle copies of Apache that will be start when
    the main server is started


    +   - MaxClients: The total number of Apache processes that can be running at
    any given time'
