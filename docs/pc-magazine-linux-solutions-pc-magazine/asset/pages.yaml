    Sometimes the data you are backing up will be bigger than the media. In this case,
    tar aborts with an error unless your invocation of the command includes the -M
    option. In this case, you would be prompted to insert a CD-R or other storage
    medium. This applies to creating and appending or updating archives. In operations
    on a multivolume archive that do not require writing to it, such as listing contents
    or extracting the files, the -M option is not needed. This is one way to back
    up your entire system to a SCSI tape drive:


    ```

    tar -CM -C / f /dev/tape /

    ```


    If you want to changing the media, use the -F option followed by the name of a
    script instead of -M. Now instead of a prompt, when it is time to insert a new
    storage medium, your script runs instead. Your script can be written to do something
    as simple as playing a sound to alert you to your attention to the computer or
    more complex tasks such as deactivating and labeling a tape or sending your boss
    an e-mail with a report on the status of the backup. In the following example,

