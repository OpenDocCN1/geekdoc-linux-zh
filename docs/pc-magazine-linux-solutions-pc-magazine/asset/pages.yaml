  md: '# Chapter 20

    Linux Security Solutions


    Although Linux is developed around an ideal of sharing and trust, the world is
    not always that. In this chapter you take a look at the various types of threats
    to your identity, data, and then review some practical steps you can take to neutralize
    them. The chapter includes extensive coverage of GNU Guard, an application that
    provides industrial-strength encryption. Finally, I cover some resources for learning
    more about security issues.


    > Note

    Hacker or cracker? In the Linux community the title hacker is a mark of Respect.
    A hacker is a person of great skill and arcane knowledge who can bend computers
    to his might and make them do clever things undream of by their designers. In
    mainstream culture, a hacker is an evil villain who uses his prowess to steal
    or vandalize things. real hackers are misuse of a noble word and have suggested
    using cracker to describe a malicious person who breaks into computers. But alas,
    the mainstream definition has become too entrenched, so I use hacker to describe
    a bad guy in the rest of this chapter, albeit with a sigh and a wistful glance
    towards the true meaning of the word.


    # Security Threats


    Many nasty things can happen to your system. You can categorize them into five
    broad areas:


    +   * Programming errors: Programmers sometimes makes mistakes that can be exploited
    by hackers. A common example of this is called a buffer overflow. Buffer overflows
    occur in programs written in other languages too, they are usually caused by a
    deficiency in C, which is the most popular language for coding Linux applications.
    A C program accepting input has to create a buffer of a fixed length to hold it.
    If the programmer does not carefully check the length of the input, it can overflow
    into other parts of memory,'
  merge: -1
  pgno: 361
- img_proc: true
  md: '# 338 PC Magazine — Linux Solutions


    corrupting them. A hacker who knew a program was vulnerable could create special
    guaranteed to overflow and containing code that bypasses system checks and does
    something-malicious.


    +   * Viruses, worms, and trojans: The Windows user is sadly too familiar with
    what is collectively known as malware — harmful and unwanted programs that insert
    themselves into your system and range from the merely annoying to downright destructive.
    Is this really a problem for Linux? Linux advocates say it isn''t, but security
    experts do not rule out the possibility of malware. Undoubtedly the bad guys will
    try harder to target Linux as it becomes more popular with the mainstream, the
    chances of succeeding are unlikely. The Linux permissions model means that programs
    cannot run unless they have been executed first. Also, because running software
    under the root account is discouraged, malware that somehow manages to get executed
    could destroy at most one user''s data, not the whole system. (Admittedly, that
    could still be quite a problem if the data is not backed up.)


    +   * Eavesdropping: Because most Internet protocols use plain text it is possible
    for someone who has access to the wires or routers that form your Internet connection
    to capture recover passwords or more sensitive information, it could spill disaster.
    The situation has become even worse with the popularity of wireless networks.
    Now you do not even need to degetap to invade someone''s bandwidth; an antenna
    and some simple software will.


    +   * Spam: Unsolicited e-mail or spam is not much of a threat as an annoyance,
    but it is a relevant topic when discussing security. The task of using e-mail
    can be quite unpleasant if you have to wade through piles of junk to get to relevant
    messages. E-mail can also be used as a vehicle for malware.


    Spammers have automated programs that crawl through the Internet looking for e-mail
    addresses to target. Other spammers pay money to buy addresses that are known
    to belong to working accounts.


    Another danger of spam is on systems that have badly configured mail server installed.
    Such servers can be hijacked and send out spam, possibly leading to the termination
    of your Internet, the blacklisting of your mail server by other mail administrators,
    and losses to your reputation because it will look like the spam came from you.


    +   * Other people: The most common security threats come not from strangers but
    people you know. They may not intend to be malicious but could be dangerous anyway.
    A user might want to delete some of his files but accidentally delete some of
    yours. A bored system administrator might decide to while away the hours of the
    night shift by reading your e-mail. Or your teenager could decide to use your
    account to do a little online shopping.


    Social engineering is the age-old confidence trick when some smooth talker gets
    a girl to give him something valuable she shouldn''t have, instead of money or
    jewels, it''s passwords or corporate secrets that he is after. All the security
    measures in the world mean nothing if you just allow a hacker to walk through
    the front door.'
