  md: '# 176 PC Magazine — Linux Solutions


    At the very least, in your comments you should leave the name of the program,
    your name, the date on which it was modified, and the purpose of the program,
    like so:


    ```

    # foobar.sh (shell programs typically take the suffix .sh

    # By Joe Merino (joe@example.com)

    # 8/3/05

    # A program to foo the bar.

    ```


    The comments do not need to be in exactly that format, but that''s the general
    idea. I want to stress that you should include comments even if the program is
    very small, very simple, and intended only for your own use. It is very easy to
    write a program, only to look at it a few days or weeks later and have absolutely
    idea what it is meant to do. In addition, you know when one might find your program
    useful. Keeping that information in lets them know where the program came from.(You
    never know when you''re going to find yourself an e-mail from someone you''ve
    never heard of asking a question about a program you wrote and gave to a friend,
    who then gave it to a friend of his, and so on. Such a thing may sound annoying,
    but it''s actually quite a boost!


    In addition, if your program has more than one section, you should leave a comment
    in each section explaining what that section does. You don''t have to go into
    detail about how exactly it does—if you''re a halfway programmer, that should
    be obvious from the code—but you should at least say something "this section prepares
    the bar to be food"


    As you look at more programs, you''ll discover that quite few programmers neglect
    commenting. There are many reasons for it. Some programmers feel that commenting
    is a waste of time. Others think that if you can''t figure out exactly what is
    going on the code, you''re not worth their secrets. Others are just lazy and don''t
    bother. If I can instill one attitude about good programming, it be that comments
    are important and should not be neglected.


