    # Deactivate services you don''t need but don''t want to uninstall


    Sometimes you don''t want to uninstall a service altogether but just stop it from
    running. For instance, you might have started configuring it but want to wait
    till you''ve learned more before finally making it. You can control how a service
    starts with the system-config-services command. In Chapter 18 services are started
    by scripts in /etc/init.d, which are symlinked to directories /etc/rc0.d through
    /etc/rc6.d and which define runlevels. So switching to runlevel 5 for instance,
    runs all the /etc/init.d scripts that have the appropriate links in /etc/rc5.d.
    system-config-services manages adding and removing these symlinks for you. system-config-services
    can be found under Desktop -> System Settings -> Server Settings in the GNOME
    menu. Figure 20-4 shows you what it looks like.


    You can adjust whether a service is started either in one particular runlevel
    or in all runlevels (in practice this is only 3, 4, and 5) and do one-time starts,
    stops, or restarts of services in the current runlevel.'
