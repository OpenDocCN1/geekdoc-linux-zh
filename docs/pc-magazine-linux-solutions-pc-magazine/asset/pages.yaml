  md: '# Chapter 11: Using the Terminal


    to some degree, of the programmer. Most commands follow a format that, although
    may not appear so at first glance, is very consistent and logical. The syntax
    looks like this:


    ```

    command -option(s) target(s)

    ```


    The command part is the name of the command, ls (the list command) or cat (the
    concatenate command). This is the command''s program name and is the only required
    part of the command. (That is, it is possible to invoke commands with only the
    program name—although is not true of all commands). The second part of the command,
    designated option(s), can be used to give certain options to the command that
    affect its behavior. (Options are sometimes referred to as flags or switches).
    Examples of options might include -v (for verbose) and --help (to get information
    about the command). Note that single-letter options are preceded by a single dash,
    while word-length options are generally preceded by double dashes. The target(s)
    is the thing(s) upon which you want the command to act. Depending on the command,
    this can be a directory, or other object of the action. There can be multiple
    targets the command requires. For example, the command requires both the name
    of the file being moved, and the desired new location of the file as targets.


    Note

    Command options and targets are collectively referred to as arguments.


    # A simple example command


    Let''s look at a command in detail to get a slightly better idea of what''s going
    on here. The ls command is used to get a list of the contents of a directory.
    (It''s roughly equivalent to the old DOS command). This can be invoked purely
    by you, by simply typing ls at the command prompt.


    ```

    [joe@notagai bin]$ ls

    [ magnifier

