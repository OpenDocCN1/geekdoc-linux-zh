  md: '# 410 PC Magazine — Linux Solutions


    ```

    #

    #The coss store type:

    #block_size=n defines the "block size" for COSS cache_dir.

    #Squid uses file numbers as block numbers. Since file numbers

    #are limited to 24 bits, the block size determines the maximum

    #size of the COSS partition. The default is 512 bytes, which

    #leads to a maximum cache_dir size of 512<<24, or 8 GB. Note

    #you should not change the cache block size after Squid

    #has written some some objects to the cache_dir.

    #

    #Common options:

    #

    #read-only, this cache_dir is read only.

    #

    #max-size=n, refers to the max object size this storedir supports.

    #It is used to initially optimize use of the max-size limits you should order

    #the cache_dir lines with the smallest max-size value first and the

    #ones with no max-size specification last.

    #

    #Note that for coss, max-size must be less than COSS_MEMBUF_SZ

    #(hard coded at 1 MB).

    #

    #Default:

    #cache_dir ufs /var/spool/spool/squid 100 16 256

    ```


    Here, /var/spool/squid is the top level of the directories Squid creates for its
    disk cache. If you change the name of the directory in this partition, it creates
    elsewhere. If, for example, you installed your Linux system with the /var directory
    on its own partition, you might not have enough disk space on that partition to
    put Squid cache there as well. In such a case, you might want to put it elsewhere.
    If you are planning to dedicate an entire machine to use as a Squid server, you
    might want to create a partition for Squid to use.

    The parameters can be given by the cache_dir variable control the number and sizes
    of files that are created under the top-level directory and the file system. Tinkering
    with variables affects performance in ways that are touched upon in the preceding
    comments. More information on performance-tuning Squid can be found at http://squid.visolve.com/squid/index.htm.

    It is, of course, possible to run Squid with all its values set to the default
    (that is, without doing anything at all to the configuration file), and this is
    fine for a very small-scale installation.

    Now that you have Squid configured, you can start the server. As usual, you do
    this using the command


    ```

    /etc/rc.d/init.d/squid start

    ```'
