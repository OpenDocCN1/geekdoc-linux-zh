  md: '# Chapter 11: Using the Terminal 175


    The important thing to remember about shell programs is that anything you can
    do at the command line, you can invoke any program, pass arguments as options
    and targets, and do input and output redirection.

    With in mind, there are a couple of things you need to know before going:


    +   - Shell programs are text files. To create a program, you can use a text editor
    to create a file. Any text editor will do, pick one you. (Likely candidates can
    be found in Chapter 17.) I recommend that you stay away from word processors,
    however A word processor such as the one included with the OpenOfficeorg will
    add formatting characters to the file. This will confuse the shell. An editor
    such as edit or vi is a better choice.

    - Shell programs need to be executable. This means that you must set execute permission
    at least for yourself. You can do this with the chmod command, like:


    ```

    chmod u+x <programname>

    ```


    It''s very easy to forget to do. If you write a program and it won''t run, check
    the permissions. That''s almost always problem. (See Chapter 13 for more information
    about permissions).


    # The magic word


    All shell programs begin with the magic word. The magic word is a special combination
    of characters that lets what follows be a shell program and should be treated
    as such. The magic word consists of a hash mark (#) followed by an exclamation
    point (!), followed by the full path (location and file name) of the shell program.
    In the vast majority of cases, the shell lives in the /bin directory, for example,
    the full path of the BASH shell is almost always /bin/bash. So, for a BASH shell
    program, the magic word looks like:


    ```

    #!/bin/bash

    ```


    If you want to say this to someone, say “hash bang bin slash bash.” (An exclamation
    point is known as a bang in Linux, and whenever you''re talking about path names,
    you should include the slashes.)


    # Comments


    A very important but frequently overlooked part of any shell program, comments
    are what the programmer writes to explain what''s going on. Simply, a comment
    is a line in a program that is ignored by the interpreter. Consequently, you can
    write anything you want in the comment, and it won''t affect the operation of
    the program. In BASH shell programs, a comment is any line that begins with a
    hash mark (aside from the magic word).


    ```

    # This is an example of a comment.

    ```


    ```

    # If you want your comment to span multiple lines, you''ll need

    # to begin each line with a hash mark.

    ```'
