  md: '# 292 PC Magazine — Linux Solutions


    Know where your output is going. Some jobs, for example a backup operation, not
    produce much in the way of output. Other jobs produce a lot of verbose. The example
    of ls /etc used earlier not produce text output. If you do not specify an output
    location, your output will generally be emailed to you. If you want the output
    placed in a file, use output redirection (Chapter 11) to accomplish this.


    Keep your crontab file. Removing it from your crontab file until you delete it.
    If you''re using cron frequently, make sure you keep an eye on your crontab file,
    and delete items that are no longer needed.


    Remember cron is cyclical. If you have a job set to execute on November 15, that
    job will execute on November 15 next year if you don''t take it out of your crontab
    file.


    Use scripts for complex operations. Instead of trying to cram operations into
    a command line, consider making a script file (Chapter 11) that can be executed
    by cron. This provides you with a lot of flexibility and allows you to design
    a complex operation as you care to, while still making it easy to include as a
    line in your crontab file.


    Use full path names. Commands executed by cron are generally run in the system''s
    default shell, with default values for environment variables. Generally, this
    will present a problem, but if you have a heavily customized PATH variable, you
    may become accustomed to using path names on files that would not normally recognized.
    To avoid this, it''s often good idea to use full path names for files and commands.
    It''s not always necessary, but it can help.


    Test your commands first. There''s nothing more frustrating than setting up a
    spify cron job, only to find out that it failed. To avoid this, test any command
    you plan to before setting it up to run automatically. Make sure your syntax is
    correct and all of your command-line arguments are doing they''re supposed to
    do. Once you''ve got it verified, put it in your crontab with confidence.


    When doubt, check your logs. The cron program logs all of its activity. This log
    is usually found at /var/log/cron. If your system uses the logrotate process (most),
    you will also find files with names like /var/log/cron.1,/var/log/cron.2, and
    so on. These are older log files. The higher the number, the older the file. These
    files are rotated on a daily basis, so /var/log/cron is today''s log, whereas
    /var/log/cron.1 is yesterday''s. If anything has gone wrong with your cron jobs,
    the logs will at least give you a clue of where to look for the problem.


    # Other crontab and cron functions


    The crontab-format is the most common way of using the crontab command, but there
    are others as well.'
