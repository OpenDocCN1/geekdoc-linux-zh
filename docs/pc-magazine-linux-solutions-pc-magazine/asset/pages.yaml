  md: '# 326 PC Magazine — Linux Solutions


    For networking configuration, the critical entry in this file is the hosts entry.
    Entries following the hosts keyword and a semicolon is the list of available services
    that should be considered, in order, when trying to resolve a host name. These
    entries are the following:


    +   - files: This keyword refers to the file /etc/hosts, which is a text file
    that usually contains information about the system you''re using but can define
    all of the host name to IP address mappings for small networks that don''t need
    to run a local DNS server. A section of this file defines the IP address for the
    fully qualified ubuntu.vonhagen.org with the short name ubuntu is the following:


    ```

    192.168.6.23        ubuntu.vonhagen.org      ubunut

    ```


    +   - /etc/hosts file in Linux versions has the same function as the \win\system32\drivers\etcHOSTS
    in later versions of Microsoft Windows and is similar to the \win\system32\drivers\etcLMHOSTS
    file, which maps IP addresses to NetBIOS names.


    +   - lwres: This keyword refers to lightweight directory access protocol (LDAP)
    servers that are available on your network.


    +   - dns: This keyword refers to the DNS servers that are specified in the /etc/resolve.conf
    file, which is discussed in the next section.


    Depending on how your system creates this file during installation, you may want
    to check this file to make sure that it identifies the right resources in the
    right order. A common problem in this file is that it may not include references
    to network services such as DNS, which means that your system will be able to
    map names to IP addresses only for those hosts that are listed in your system''s
    /etc/hosts file.


    Like most programs and configuration files in Linux, online help on the contents
    and format of this file is available using the Linux command: man nsswitch.


    # Name resolution in /etc/resolve.conf


    The size of networks makes it impractical to maintain text files that define the
    mapping of IP addresses to host names in the /etc/hosts file. This is especially
    in the case of the Internet, where you can''t easily determine the IP address
    for hosts that are not under your control. To eliminate this problem, the domain
    name server was introduced in the early 1980s. DNS is a hierarchical collection
    of systems that run a DNS server can be queried for the IP address that corresponds
    to a given host name. This query is known as a name lookup. The hierarchical nature
    of DNS means that if your system contacts a DNS server that does not know the
    IP address for a specified host, DNS knows how to contact higher-level, more authoritative
    DNS servers that either have the information that you''re looking for or know
    how to contact others that do. The highest-level DNS servers for the Internet
    are known as the root name servers, and they are at the top, or root, of the DNS
    lookup hierarchy.'
