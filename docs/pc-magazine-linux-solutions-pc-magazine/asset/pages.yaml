    DLT/SuperDLT: These tapes are the top of the line and boast storage capacities
    of up to 60GB. Those that use the SCSI interface usually suffer from compatibility
    problems, but very high-end models might require driver support for maximum performance,
    and that driver might not be available for Linux. (Though the growing prominence
    of Linux in the server market, hardware manufacturers are becoming more likely
    to support these.)


    From the home or small-business user''s perspective, DAT tapes probably provide
    the best price/performance ratio, the tape drive market changes rapidly, so you
    would be well advised to do research on prices and storage capacity on sites like
    Pricewatch (www.pricewatch.com) and LinuxHardware.org (www.linuxhardware.org)
    before buying.


    # CD/DVD


    Nowadays, CD or DVD writers are standard on most desktop PCs and even laptops.
    They use the SCSI or IDE interface and do not have compatibility problems with
    Linux. This makes writable CDs or DVDs a handy solution for backup media. There
    are two types: First, CD and DVD capacities are relatively smaller than DAT tape
    capacities. CDs have a capacity of only 650MB, and DVDs tap up to 4.7GB. Second,
    CDs and DVDs can be prone to heat damage, scratching, and other factors, which
    make them unsuitable if you need high levels of reliability.


    # Zip/REV drives


    Iomega Corporation originally positioned its line of removable storage drives
    as a replacement for floppy drives. These did not become as ubiquitous as have
    a following,especially in industries like publishing and advertising where large
    files have to be transported from place to place. Zip drives have between 100MB
    and 750MB of storage. REV drives store up to 35GB. The drives have a USB or SCSI
    interface and work well. See www.iomega.com for more information about these types
    of drives.


    # USB keys


    These are small, solid-state devices with a USB interface. They hold from 64MB
    to 1GB of data. Obviously this isn''t enough to back up an entire system, but
    it is more than adequate for the typical user''s data. They are especially useful
    for the kind of user who finds himself working on several different computers.


    # Another hard drive


    Perhaps the easiest way to back up a hard drive is to have another hard drive.
    Drives are getting bigger and cheaper per gigabyte of storage every day.


    A standard method of keeping two or more hard drives synchronized is called RAID
    (Redundant Array of Independent Drives). Most Linux distributions allow you to
    set up drives in a RAID formation at installation time. It is also possible to
    set it afterwards.


    RAID can improve disk usage and performance, but from the backup perspective,
    if one drive in the set fails you still have the others that replicate the data;
    therefore, nothing is lost. It is less ideal in other ways. RAID can''t help you
    in the case of'
