    # Icons


    Depending on your distribution, you may or not have a few icons on your desktop.
    By default, Fedora Core has icons for Computer (the root, or / directory), your
    home directory, and a Trash directory. If there is a CD-ROM mounted on your machine,
    there will also be an icon for that. Clicking on any of these directories opens
    the Nautilus file manager and shows the contents of that directory, as shown in
    Figure 9-3.


    ![](img/65ef52f6e9fc73ddc3051990377c4f5b_141_0.png)


    22 items, Free space: 1.8 GB


    **Figure 9-3:** Nautilus, showing the contents of the root directory.


    You can open files by double-clicking on them. (You can configure Nautilus to
    open a file with a single click if you prefer that.)


    # THE PANELS


    Depending on your distribution''s default configuration, you may have one or two
    panels on your screen. A panel is a long, narrow running along the top or bottom
    of the screen. Panels can be configured to the left or right edge as well, but
    top or bottom is the more common configuration.


    On Fedora Core, there are two panels: one along the top and one along the bottom.
    The upper panel, shown in Figure 9-4, contains the Applications, Places, and Desktop
    menus (addressed in the next section); launcher icons for Web browser and e-mail
    programs (this may vary, depending on the type of installation you chose); and
    a system containing various informational features, such as the time and date,
    as well as an icon for the Red Hot Network and a volume control for your audio
    applications. (Red Hot Network is Red Hat''s software update service, which is
    actually not available for Fedora Core; I presume there is as an entitlement to
    check out Red Hat''s Enterprise products.)'
