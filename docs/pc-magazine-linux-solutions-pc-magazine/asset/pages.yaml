    # Access Control with Squid


    At this point, we''re going to turn the discussion of proxies back to the server.
    The configuration that you''ve developed is a cache, but it does not use Squid
    to access remote sites. This section shows how to configure access control lists.


    Many system administrators use proxies to control what clients can and cannot
    access in the outside world. This is for general security; productivity enhancement,
    protection from liability, or other purposes, you sometimes may be able to control
    what comes into your local network. Squid can be configured as this type of proxy
    using a tool called an access control list, or ACL. A full discussion of ACLs
    is not possible here; here are the basics.


    Suppose that some of the people in your organization are spending too much time
    playing football online. You would therefore to add, block access to any Web site
    with the word “football” or the “sports” in your URL. To do this, add the following
    lines to your /etc/squid/squid.conf file:


    ```

    acl Football1 url_regex football

    acl Sports1 url_regex sports

    http_access deny Football1

    ```'
  merge: -1
