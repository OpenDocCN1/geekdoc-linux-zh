    # Controlling a Tape Drive with mt


    In the previous section, I alluded in a couple of places to a peculiarity of tape
    drives, namely that they cannot be accessed randomly, only sequentially. Anotherity
    is that tape drives are not mounted as part of the file system, while other backup
    media are. Once a USB key, for instance, is mounted, you can cd to it, use cp,
    mv, ls, and so on. With a tape drive you have to use a program called mt instead.
    The GNU version of mt is part of the cpio package, which is not installed by default
    in every Linux distribution, so you may have to install yourself.


    Table 14-1 describes the most common operations you can perform on a tape drive
    with mt. The format of the command is


    ```

