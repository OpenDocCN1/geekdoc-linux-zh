    # Group passwords


    I mentioned that groups can have passwords, though they rarely do. The passwd
    command manipulates group passwords. This command can be used by root or she can
    use the -A option to design this power to group administrators. For example, the
    following command makes user knoppix an administrator of the users group.


    ```

    # passwd -A knoppix users

    ```


    Now knoppix (or root) can use the commands in Table 6-1 to control passwords for
    the users group.


    | Table 6-1 Example passwd Commands |


    | Command | Usage |

    | --- | --- |

    | passwd users | Set or change the group password. |

    | passwd -r users | Remove the group''s password. |

    | passwd -a linus users | Add user linus to the users group. |

    | passwd -d linus users | Remove user linus from the users group. |


