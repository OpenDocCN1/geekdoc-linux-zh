    # Using the ifconfig command


    The ifconfig (interface configuration) command is a Linux administration command
    with its roots in the kernel with the same name. The ifconfig command enables
    you to query and configure the state of all the Ethernet interfaces on your system.
    With a similar name, ifconfig, is even provided on Windows as a command-line tool
    for network interface examination and configuration (though its syntax is, of
    course, different).


    The most common use of ifconfig is to quickly query the state of one or all of
    the IP interfaces on your system. To get information about the current configuration
    and state of an Ethernet interface, execute the ifconfig interface-name, where
    interface-name is the short name of the Ethernet interface you want about. The
    following example shows how to use the ifconfig eth0 to get information about
    the Ethernet interface on Linux systems:


    ```

    $ ifconfig eth0

