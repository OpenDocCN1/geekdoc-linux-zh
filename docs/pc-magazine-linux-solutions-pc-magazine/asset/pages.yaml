  md: '# 14 PC Magazine — Linux Solutions


    Murdock. The Debian project (www.debian.org) was founded in 1993 and has been
    delivering quality GNU/Linux distributions ever since. The Debian project is unique
    in Linux distributions that it produces versions of Debian that run on both of
    the Linux kernel and other free, open kernels, such as the GNU project''s Hurd
    and associated microkernel. The rest of this discussion focuses on Debian''s GNU/Linux
    distribution, but it''s interesting to note that the project''s focus is on providing
    a free, powerful environment for users rather than simply on GNU/Linux.


    Debian is well known for stable releases based on thoroughly and completely integrated
    software packages. This focus on testing, integration, and stability has led to
    Debian''s reputation among Linux aficionados as a slow-moving distribution that
    easily falls behind the cutting edge of Linux technologies. While that is true—there
    have literally been three versions of Debian releases—there are stable (the released
    version), testing (the candidate for the next), and unstable (the development
    version). The Debian project is extremely picky about making sure that distributions
    include only software that is completely open source and unencumbered by any licensing
    that might affect its distribution or its heredity—see their Social Guidelines
    page (www.debian.org/social_contract/) for more information.


    One of the great contributions the Debian project has made to the open source
    community is its pioneering effort to take the rocket out of application and system
    updates. As you''ll learn in this book, many Linux software have dependencies
    on other software packages, most commonly shared libraries that are packaged as
    separately installed software packages. This can lead to a chain of dependencies
    between downloadable packages that can make it difficult to satisfy all of the
    requirements when you want to install or upgrade a given package. To facilitate
    the identities of other packages Debian introduced the DEB format, which is an
    enhanced version of the standard Red Hat Package Manager (RPM). Debian also introduced
    its Advanced Packaging Tool (APT) and related utilities. Using the APT apt-get
    utility, you can issue command-line commands such as apt-get install to install
    the package, apt-get update to update the package foo that is already installed,
    or apt-get upgrade to upgrade your distribution. You can also use apt-get to download,
    build, and install packages from source code, performing the same sort of dependency
    resolution in the process.


    Debian is a great distribution that has a huge couple of stable software (over
    15,000 available packages when this book was written) and pioneered by much of
    the usability and administrative ease-of-use that has made Linux popular and successful.
    On the downside, installing and using Debian typically requires that you know
    a bit more about Linux systems and their organization than some other distributions.
    Other popular distributions, such as Xandros Linux and Ubuntu Linux, are based
    on Debian but have focused on simplifying their administration and being as up-to-date
    as possible.


