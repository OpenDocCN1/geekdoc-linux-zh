  md: '# 394 PC Magazine — Linux Solutions


    At this point, you are done. You have successfully configured a basic e-mail server,
    and you are ready to accept incoming mail and deliver it to your clients.


    # Note


    The system-config-services program is specific to Fedora Core (and other Red Hat
    products), and also depends on running a GUI on your server machine. If you are
    using Fedora Core, but wish to accomplish the same task from a shell prompt, give
    it this command:


    ```

    chkconfig --add dovec

    ```


    If you are not using Fedora Core, the process may be a bit trickier. You will
    need to consult your system''s documentation and find out the procedure for starting
    services at boot time. Some distributions have a graphical tool for this. Such
    tools are often referred to as editors or service configuration tools. If your
    system has no such tool, you should be able to find information about the startup
    scripts to control it. You may need to edit one of these files and insert a line
    directing it to the service.


    # Serving Mail via the Web


    What do you do when you''re away from your home or your office and you need to
    get your e-mail? You can take your laptop with you if you have one and hope to
    find an Internet connection somewhere, but that''s not always practical. And if
    you have Dovecot retrieve connections from outside your local network (a reasonable
    security precaution), you won''t be able to get your mail that way anyway.


    A practical solution to this dilemma is Web mail. Web mail programs are e-mail
    programs built for the Web. Simply log into your mail server from any browser,
    and you can get your mail. SquirrelMail is a program and built with Fedora Core;
    so you can install it from the installation media or from one of the Fedora mirrors
    (or from squirrelmail.org for non-Fedora distributions).


    To run SquirrelMail, you need to have a running installation of Apache. See Chapter
    21 for an overview of how to get Apache and running. You also need to have Dovecot
    configured to take care of the IMAP protocol.


    If you install SquirrelMail from an RPM on Fedora Core, the RPM installation takes
    care of much of the configuration for you. You will notice that there is a new
    file in the /etc/httpd/conf.d directory called squirrelmail.conf. (By default,
    Apache is to read all the files in the /etc/httpd/conf.d directory and treat their
    contents as if they were part of Apache''s main configuration file.) You will
    also find a new directory called /etc/squirrelmail. This is where the SquirrelMail
    configuration lives.


    Open the file /etc/squirrelmail/config.php in a text editor, as shown in Figure
    22-5.'
