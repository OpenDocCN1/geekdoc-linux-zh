  md: '# Chapter 9: Desktop Solutions


    Nautilus has a number of configuration options that allow you to customize the
    way in which it functions. From the main Nautilus window, click the Edit menu
    and then select Preferences. This opens the File Management Preferences dialog
    as shown in Figure 9-12.


    ![](img/65ef52f6e9fc73ddc3051990377c4f5b_147_0.png)


    Figure 9-12: The File Management Preferences dialog.


    This dialog has several tabs. The most basic is the Views tab, which contains
    options related to the way in which Nautilus displays information to the viewer.
    The first option in this tab allows you to select whether you''d prefer an icon
    view or a list view. Icon view shows files and directories as it icons arranged
    left to right across a window, while list view shows them arranged in a vertical
    list.


    Whether you''re using list view or icon view, files and directories (folders)
    are listed in alphabetical order, with directories listed before. This behavior
    can be changed using the Arrange items option. In Microsoft Windows, this option
    allows you to select an arrangement based on name, size, file type, date of last
    modification, or emblem. (Emblems can be added using the Backgrounds and Emblems
    option found under the Edit menu.)


    Most of the other options and tabs are largely self-explanatory, and a little
    experimentation should yield a configuration that works for you.'
