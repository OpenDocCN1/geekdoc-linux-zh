    #  Summary


    Apache is the most popular Web server software in existence. It is free software
    and is bundled with most major Linux distributions. Apache is a powerful and flexible
    server package and can be quite complicated to configure; however, it is possible
    to get a basic configuration up and running without too much trouble.'
