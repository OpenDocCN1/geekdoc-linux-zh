    > You can click and drag any icon from the Quick Launch bar to the desktop. When
    you release the mouse button a menu will appear and you''ll have the option to
    copy or move the icon.


    # Virtual Desktops


    Would you believe if I told you that your Linspire computer can actually be twenty
    different computers in one? Maybe that''s a bit of a stretch, Linspire does allow
    you to have up to twenty different desktops. There are many reasons why virtual
    desktops can be advantageous. Virtual desktops are particularly beneficial to
    those who like to keep dozens of icons on their desktops. Using virtual desktops,
    you could create one desktop for games, another for spreadsheets, and another
    for documents. You can also use virtual desktops when installing programs or to
    download large files off the Internet because you can work in one desktop while
    the other desktop is busy. What do you do with your virtual desktops is up to
    you, just know that Linspire makes them easy to use and configure.


    # Creating Virtual Desktops


    By default there is just one desktop set up for you when you first install Linspire.
    If you want to take full advantage of the virtual desktop features, you can set
    up a total of twenty different desktops.'
