    +   4. Click the "Scan My Photos" for pictures" button. Lphoto will look to you''re
    My folder on your system. Alternatively, you can click the "Don''t import anything
    right now" button if you want to manually add photos to your library later. All
    the pictures in your My folder will now appear in the window. A dialog box will
