  md: '# A Word on Word and Other Windows Software


    A frequent question I get asked is, "Can I install Microsoft Word or other Windows
    applications on my Linspiele computer?" My typical response is, "Why would you
    want to?" Linspiele provides you with thousands of programs at less than the price
    of one component of the Microsoft Office suite. In addition, the OpenOffice suite
    that comes with Linspiele is highly compatible with Microsoft Office. Running
    Windows-based applications on any Linux operating system is like trying to fit
    a square peg into a round hole. It can be done but results vary and can make your
    system unstable. If you still want to install a Windows application even after
    my little sermon, then you can CNR a program called Wine. Wine is a windows emulator
    that fools a Windows-based program into thinking it''s running on Windows rather
    than Linux. Beware though, results may vary!


    ![](img/3926ca1fb00de3af845faa03d2c351e5_214_0.png)'
  merge: -1
