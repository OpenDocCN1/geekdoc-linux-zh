  md: '# Working in Web Pages


    # Working in Web Pages


    Once you''ve navigated to the pages you want to visit, you''ve got quite a few
    options. From downloading files and images, to jumping to other pages, to translating
    content, to finding text, there are a variety of tools that the Web Browser can
    help you with when you are working with web pages.


    # Using Links


    Within web pages you''ll find links that will take you to different web sites
    or to different locations within the same web page. It used to be that all links
    were blue and underlined, but this standard has changed. Typically, you''ll know
    when you are over a link when the mouse pointer changes to a little hand.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_224_0.png)


    +   1. Position the mouse pointer over a link. The mouse pointer will change to
    a hand to indicate that you are over a link.

    2. Click on the link. You will be taken to the page associated with that link.


    > If you right-click on a link, you''ll be provided with a variety of options.
    Among other things, you can open the link in a new tab or window, and you can
    bookmark the link or page.'
  merge: -1
  pgno: 224
