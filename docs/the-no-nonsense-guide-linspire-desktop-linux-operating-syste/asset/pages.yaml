    I''m sure you''ve got people like this at your office, and perhaps you might even
    be one of these people. You go by their computer screens and see dozens of icons
    scattered on their desktops. If you''re the type of person who needs to access
    files and programs from your desktop, here''s a quick way to keep your screen
