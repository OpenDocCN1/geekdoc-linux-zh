    # Terminating Programs


    It has happened to all of us at time or another. For some reason a program freezes
    and we are unable to continue working in it. If we were using any other operating
    system we would probably have to restart our computer. Linspire allows us to terminate
    an application without having to reboot the system.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_51_1.png)


    +   1. Click the Launch button. The Launch menu will appear.


    +   2. Click Terminate Application. The Terminate a Frozen Application dialog
    box will appear, and your cursor will change.


    +   3. Click anywhere on the frozen application. The frozen application will terminate.'
