  md: '# Formatting Worksheets


    Let''s face it, numbers scare people. A spreadsheet full of numerical data can
    be quite intimidating to the faint of heart. To alleviate some of the fear that
    people face when encountering a spreadsheet, you can format your worksheet in
    a variety of different ways. Through formatting you can emphasize certain areas
    or points, make data more understandable and accessible and change the overall
    appearance of your spreadsheet. Most formatting features can be found in the Format
    Cells dialog box.


    +   1. Select the cells that you want to apply a color to using one of the selection
    methods.

    2. Right-click anywhere on your selection. A menu will appear.

    3. Click Format Cells...The Format Cells dialog box will open.


