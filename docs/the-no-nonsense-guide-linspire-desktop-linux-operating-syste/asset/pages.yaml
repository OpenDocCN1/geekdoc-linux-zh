    +   4. Press the Enter key. The command you selected will be executed.


    # Identifying Menu Items


    When you opened an item on the menu bar, you may have noticed that some of the
    menu items have little markings beside them or that they seem to be grayed out.
    Each one of these little symbols has a different meaning.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_49_1.png)


    +   Three Dots. This indicates that a dialog box will open when the command is
    executed.


    +   Dimmed Command. This indicates that the command is currently unavailable.


    +   Check Mark. This indicates that the option is selected. If you click a menu
    option that already has a check mark beside it, the menu option will be turned
    off and the check mark will be removed.'
