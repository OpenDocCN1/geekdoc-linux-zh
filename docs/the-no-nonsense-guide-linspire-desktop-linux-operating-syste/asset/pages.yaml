  md: '# Working with Open Applications


    # Cleaning Windows


    Imagine being able to clean and organize your entire house with one click of a
    button. While that technology may not be in homes for years to come, it is available
    in Linspire. You can clean up and organize your open windows in seconds.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_46_0.png)


    # Cascading Windows


    Cascading your windows will organize them so they overlap one another, but the
    Title bar of open application will be visible in cascading order.


    +   - Right-click in any blank area of your desktop. A menu will appear.


    +   - Click Windows | Cascade Windows. Your open windows will now overlap with
    all of their Title bars exposed.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_46_1.png)


    # Uncluttering Windows


    This feature will evenly space out of your open windows.


    +   - Right-click in any blank area of your desktop. A menu will appear.


    +   - Click Windows | Unclutter Windows. Your open windows will now be spaced
    out the available room on the desktop.'
  merge: -1
  pgno: 46
- img_proc: true
  md: '# Always On Top


    Sometimes you may want a program window to remain on top of all other windows
    regardless of whether or not you are currently working in that program. A good
    example of this would be when watching a video on the computer. Regardless of
    which program you are working in, you''d want the video to remain on top so that
    it is unobstructed.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_47_0.png)


    +   1. Right-click the icon representing a program in the Taskbar. A menu will
    appear.


    +   2. Click Always on Top. This will bring the program window in front of all
    others.


    +   3. Repeat Steps 1 and 2 to remove this feature.


    # Working with Menus


    Across the top of most programs you will find a menu bar that gives you access
    to the different commands within a program. The commands can be accessed in a
    variety of ways.


    # Selecting Menu Items with the Mouse


    Selecting a menu command is simply a matter of clicking on a menu item and then
    selecting a subsequent command.'
  merge: -1
