  md: '# Managing and Editing Photos with Lphoto


    While the Image Viewer allows you to quickly view your images, Lphoto is a much
    more powerful tool to help you view, manage and edit your photographs. When you
    launch Lphoto, a wizard will appear that will scan the "My Photos" folder on your
    computer, looking for photos, that it will then add to the Photo Library.


