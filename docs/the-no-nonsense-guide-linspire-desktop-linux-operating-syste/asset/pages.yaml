  md: '# # Forward


    By Michael Robertson, CEO, Lininsp Inc.


    # # Why Lininsp?


    When I started Lininsp, I was accused of being crazy for trying to compete against
    Microsoft, the world''s biggest monolith. But that is precisely the reason why
    there needs to be competition. Without choice, consumers are treated to a mix
    of high prices, poor service and a lack of innovation. Choice is good for consumers.
    Simply put, that is why I started Lininsp.


    When I started MP3.com, the music industry was very much the same way — it was
    closed off. The major recording companies controlled music and didn''t want to
    see it on the Internet at all. They sued MP3.com, they sued content providers,
    they even went after developers of portable MP3 players. But the future cannot
    be stopped and advancements will happen. Now I can''t go to the gym without seeing
    white headphones leading to MP3 players all around. Consumers are no longer limited
    to purchasing expensive CDs. You can buy individual tracks or full albums from
    sites like MP3tunes.com and within minutes listening to them on your PC, stereo,
    or MP3 player.


    We are at a time in history where the same thing is happening to the computer
    operating system. People endured high prices, viruses, and frequent crashes because
    they wanted to, but because there has been a lack of alternatives. In early 2002,
    I sat around the "lucky table" my father-in-law gave me, feeling that the world
    was out of balance with one dominating operating system that was leading to expensive
    pricing, unfriendly licensing and depriving people access to lower-cost computing.
    So for the last three years, Lininsp has been working on creating a viable alternative
    to restore balance to the world of desktop computing.'
  merge: -1
  pgno: 7
- img_proc: true
  md: '# Why Linux?


    When I started Linsp, I realized that to compete with Microsoft meant needing
    to work smarter, not harder. They have more money, more people, and have been
    producing versions of the Microsoft Windows operating system for more than ten
    years. That''s where Linux came in.


    If you''re like most people, chances you only started hearing about Linux recently.
    While it has been mostly an underground technology used by IT professionals and
    computer science majors, Linux has been around since the early ''90s. Linux itself
    is based on UNIX, which has been around since 1970. In addition to having years
    of refinement and experience under its belt, Linux offers some very big advantages.
    Unlike Microsoft Windows, which is developed by a specific group of people who
    all work for a specific company, Linux is developed by a worldwide community.


    How does that work? It''s through a principle called "open source." Most software
    companies hide the code that drives their applications, so other people can''t
    take advantage of all the hard work they''ve put into developing it. Open source
    is exactly the opposite. Instead of hiding the source code, open source as the
    name implies and opens the source code to the world, developers all around the
    globe can contribute advances and improvements.


    By taking advantage of the open source nature of Linux, it''s no longer the few
    people in my three-year-old company competing against Microsoft, it''s the thousands
    of people who have for more than 30 years contributed to making Linux what it
    is today. This swings the pendulum back in favor of competition. If I were to
    try competing directly against Microsoft, I would lose. But with the decades of
    experience and the worldwide community that supports Linux, choice can once emerge
    again in this long-cornered marketplace.


    The problem with Linux, that is has always been a technical operating system for
    technical users. Yes, it is very stable and has many advantages over Microsoft
    Windows, but for most people it has simply been too difficult to be practical.
    So at Linsp we''ve dedicated to crossing the divide and making Linux easy enough
    for complete novices, while keeping the benefits of security and stability that
    have made it a favorite among the technical elite.'
  merge: -1
  pgno: 8
- img_proc: true
  md: '# # Is the Linspire operating system for the masses?


    Yes. Linspire is designed with you in mind. We know that most people don''t use
    their PCs for ultra-technical goals like writing computer code or hosting Internet
    forums. People do write email, surf the web, chat, use an office suite, play games,
    listen to music, and get pictures from their digital cameras. Linspire comes pre-loaded
    with all the necessary software to do those things and more.


    One of the questions I hear the most is, "Will Linspire run XYZ application that
    I use?" But after talking to the person who asked it, I find out that the person
    is never so tied to that particular application as they are tied to what application
    lets them do. It''s all about the features and functionality, not about the particular
    program. The answer I usually give is, "A program made for Microsoft Windows won''t
    run on Linspire, but there are thousands of applications that run on Linspire
    and we have one that does just what you want."


    Take Microsoft Office for example — that is probably the application that most
    people want to know about. Why? Because they need a word processor, spreadsheet,
    and presentation software. They need it to be easy to use, and most importantly
    they need it to create documents that can be read on Microsoft Windows computer.
    Surprisingly, Microsoft doesn''t make their office suite for Linux, but you really
    want to waste hundreds of dollars paying for it anyway? Linspire comes with a
    complete office suite included. That''right...you don''t have to spend as much
    on one program as you spent for your computer. The OpenOffice suite included with
    Linspire has software for word processing, spreadsheets, and presentations, all
    of which save in the same format as Microsoft Office, so you can read and edit
    files made by your friends who still use Microsoft Office, and they can read and
    edit the files you make. If you don''t tell them, they''ll probably never realize
    that aren''t using the same software that they use.


    No matter what you want to do with your PC, chances are Linspire has software
    will save you time, money, and hassle over other operating systems. In addition
    to having a number of programs pre-installed, Linspire offers you the most affordable
    way to get new software. The traditional method of getting software in the Microsoft
    Windows world is paying for each application you need. For Linux users, installing
    software usually means'
  merge: -1
  pgno: 9
- img_proc: true
  md: 'scouring the Internet for something that looks like it could be good, downloading
    several different packages, installing them with a series of commands, and hoping
    it works. One way costs you money, the other costs you time. With Lininsp, you
    won''t waste either.


    For less than fifty dollars, Lininsp users can get access to roughly 2,000 applications
    from the CNR Warehouse. In addition to this being incredibly low-priced, it''s
    also incredibly easy. Don''t waste time searching the web or looking through software
    boxes, just click and run. The warehouse is easily accessed with the CNR application
    that is integrated into the Lininsp operating system. CNR lets you search for
    the specific application you want or browse through the warehouse aisles to find
    something that suits your needs. With CNR, you can look at screen shots, read
    descriptions, and install with a single click of your mouse button, saving you
    time and money.


    # So Lininsp saves time and money, that''s good. Is that all?


    No. You see, Lininsp is all about the marriage of cutting-edge technology with
    usability. An easier, less expensive operating system is a good start, but we
    want a better operating system. Since the time that XP came out, in 2001, there
    have been many technical innovations. And at Lininsp, we don''t think you should
    have wait until 2007 to take advantage of them.


    If you''re like most people, chances you have some friends that you chat with
    AIM, Messenger, some on MSN, and even friends that use a different instant messaging
    program. It''s getting to the point where you practically need a second screen
    just for all the different buddy lists and IM windows. With Lininsp, you can simultaneously
    log onto all your IM accounts and view all of your buddies in one list. Then have
    all of your chats in one tabbed-window, freeing your screen from clutter so you
    don''t track track an important conversation. But why stop at text-based communications?
    Our instant messenger lets you make web-based worldwide phone calls.


    By now you are probably familiar with the system slowdown. Leave your computer
    on for a couple of days in a row and it screeches to a halt. Make sure to set
    aside a day every month to defragment your hard drive (defragmenting moves data
    around your hard drive because it is broken up, or fragmented), or else. Can you
    imagine if any other appliance in your house acted like that? What would it be
    like if you had to turn off your'
  merge: -1
  pgno: 10
- img_proc: true
  md: 'refrigerator occasionally or it wouldn''t stay cold, or if you had to move
    around all your DVDs once a month or the DVD player wouldn''t read them? Ridiculous,
    right? Well, why don''t we think all these things are ridiculous with the PC as
    well? Because we have been conditioned to just accept slowdowns, freezes, crashes,
    and reboots as a way of life — but we shouldn''t.


    Because of Linspired''s stability and security, you can leave your computer for
    weeks - even months - at a time without worry. As for defragment — forget about
    it! Never defragment your computer again with Linspired. That''s because Linspired''s
    file system keeps itself from getting fragmented in the first place. So say goodbye
    to these unnecessary system slideshows and freezes, and that aggravating blue
    screen that announces "your computer crashed and we lost your data." With Linspired,
    those frustrations that we''ve all had to just accept are now a thing of the past.


    # So what''s in store for the future?


    Choice. Linspired has come a long way in three years. We''ve made an operating
    system that is just as good as its more expensive competition, and in many ways
    it''s better. Expect that to continue. We work hard every day to make the world''s
    best desktop operating system.


    We''re building technologies that make your life easier. From the creation of
    Lsongs (a music manager that lets you burn CDs, rip MP3s, download music, listen
    to music, share your music, and more), to the development of a licensed DVD player
    for watching commercial movies on Linux, we''ve been on the forefront of creating
    user-friendly software. With features like the free Internet-based phone calls
    of PhoneGaim, we''re developing software that lets you do things with your computer
    that you couldn''t before.


    With the all-you-can-eat style of the CNR Warehouse and the family-friendly licensing
    that lets you install Linspired and CNR software on every computer in your home
    at no additional cost, we''re implementing practices that put the consumer first.'
  merge: -1
  pgno: 11
- img_proc: true
  md: 'We''re taking a new approach at the technology business — putting you first,
    always asking what we can do to improve your life. With this as our approach,
    rather than the traditional "how we can make more money" stance that too many
    companies have taken, you can be assured that the future for Linspire means new,
    better, less expensive, more versatile software to make your life easier.


    # # Enjoy the book, and enjoy Linspire


    I''ve given you just a glimpse of the innovations we''ve been working on at Linspire,
    and why we continue to innovate. This book will dive deeper into all the great
    features of Linspire and how to use them. You will probably find Linspire so easy
    to use that you won''t need many of the sections of this book, but it''s great
    to have as a reference.


    If you''ve been desiring a computer that is more stable, more secure, more virus-resistant,
    easier to use, and more affordable, then you have come to the right place. With
    Linspire, choice has finally returned to the desktop market. Say goodbye to high
    prices and lack of innovation. Say goodbye to the constant barrage of spyware,
    viruses, popups, freezes, crashes, and the other maladies that have plagued your
    computing experience, and say hello to Linspire. Welcome to a world of choice,
    affordability, reliability, innovation, and ease-of use. Linspire is the operating
    system designed with you in mind.'
  merge: -1
