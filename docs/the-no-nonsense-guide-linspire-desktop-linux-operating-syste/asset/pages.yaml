    new tab. You can now navigate in this new tab as you would in any other web page.


    +   5. Repeat Step 4 to create any other tabs.


    +   6. Click on any tab to switch between different tabs.


    +   7. Click on the red "X" at the right side of the Tab bar to close a tab.


    +   8. Repeat Steps 1 - 3 to close the Tab bar.


    # Using Bookmarks


    There are just so many useful web sites out there that keeping track of them all
    could be a daunting task. Rather than having to tax your brain''s memory, you
    can use bookmarks. Just like the bookmark in the novel on your nightstand, bookmarks
    in the Web Browser allow you to quickly get to specific areas.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_221_1.png)


    +   1. Navigate to the page for which you would like to create a bookmark.


