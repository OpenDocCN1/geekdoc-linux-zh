  md: '# Technical Support from Linpire


    If you can''t find the answer to your question from the knowledgebase or the forums
    you can submit the question directly to the guru at Linpire. Typically it will
    take 3-5 days to get a response, which will be sent directly to your e-mail address.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_295_0.png)


    +   1. Click the Help Center button. A menu of help options will appear.

    2. Click Online Support. The Web Browser will launch and open to the Linpire support
    page.

    3. Scroll to the bottom of the page you''ll see Step 4, Talk to your Support Representatives.

    4. Click on the Ask Us link. You will now be able to provide your contact information
    and submit your question.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_295_1.png)


    +   5. Type your e-mail address. This is the address where the response will be
    sent.

    6. Click the drop-down menu beside Product and applies to you. Repeat the same
    for the subcategory drop-down menu that appears.

    7. Click the drop-down menu beside Category and select the category that applies
    to you. Repeat the same for the subcategory drop-down menu that appears.'
  merge: -1
  pgno: 295
- img_proc: true
  md: '# Technical Support from Linspire


    # 295


    ![](img/3926ca1fb00de3af845faa03d2c351e5_296_0.png)


    +   8. Type a subject for your question.


    +   9. Type your question. Be very specific about the issue you are having. Also
    include any steps that you may have already taken to try and solve the problem.
    The more information you provide the greater the likelihood that you will get
    an answer that solves your problem.


    +   10. Click the Browse button if you have any files or documents related to
    the problem you are having that you would like to share. A dialog box will appear
    where you can navigate for the file.


    +   11. Click the Continue to the next page button.


    +   12. Review the potential answers to your question. If any address the topic
    you are looking for, you can click the link and read the answer. Otherwise proceed
    to Step 13.


    +   13. Click the Finish button. Your question will be sent to Linspire. Check
    your e-mail account frequently as they''veve been known to beat expectations on
    the time it takes to get back to you. A page will appear with a reference number.
    Take note of that reference number you can use it when communicating with Linspire.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_296_1.png)'
