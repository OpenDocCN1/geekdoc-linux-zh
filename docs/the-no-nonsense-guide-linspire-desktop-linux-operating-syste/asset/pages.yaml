  md: '# Launching Programs from Icons


    Earlier in this chapter we discussed the different icons that appear on your desktop
    by default. These icons provide you with access to different applications on your
    computer.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_39_0.png)


