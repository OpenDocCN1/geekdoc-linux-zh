    # Cutting, Copying, and Past


    Cutting, copying and pasting are the backbone of document editing in Word Processor.
    When you cut or copy objects, they are placed on a virtual clipboard that stores
    the items so that it can be pasted elsewhere. Cutting removes the object from
    the document, while copying makes a duplicate of your object on the clipboard.


