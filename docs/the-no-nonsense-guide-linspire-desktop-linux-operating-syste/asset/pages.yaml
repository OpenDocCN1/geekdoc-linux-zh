  md: '# Browsing the Internet


    To quote the immortal words of Homer Simpson: “They have the Internet on computers
    now?” Of course they do, and really, is there anything that the Internet can''t
    do? Finding recipes, to watching videos, sharing pictures, to auctioning goods,
    you name it, you can do and see anything about the Internet. Linscape comes with
    its own built-in Web Browser designed specifically for you to surf the Internet
    with ease.


    You may be thinking to yourself, “What''s the big deal about surfing the Net?,
    you can just type in an address and away you go.” While that may be true, to optimize
    your time on the web, there are a variety of tools that can make your experience
    faster, more secure and certainly more convenient.


    In this chapter we''ll cover:


    +   - Navigating with the Web Browser

    - Accessing your favorite sites

    - Cleaning the history list

    - Customizing the Web Browser'
  merge: -1
