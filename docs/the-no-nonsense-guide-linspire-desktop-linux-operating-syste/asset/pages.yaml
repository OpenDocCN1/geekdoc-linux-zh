  md: '# Maximizing and Restoring a Window


    The Maximize command allows you to resize a window so that it takes up all of
    the possible space on the desktop.


    +   1. Click the Maximize button. This action will make the program as big as
    it can be on your screen.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_43_0.png)


    > Another way to quickly minimize, maximize or restore a window is to right-click
    on the icon of the program in the Taskbar. A menu will appear where you can choose
    from the desired action.


    +   2. Click the Restore button. The window will return to its previous size.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_43_1.png)'
