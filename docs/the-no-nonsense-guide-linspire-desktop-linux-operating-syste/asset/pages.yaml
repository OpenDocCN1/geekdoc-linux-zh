    By clicking or just hovering over this command with the mouse pointer, you will
    be able to view the submenu.


    +   - Keystrokes. A series of words and letters beside a menu command indicates
    the keystrokes necessary to execute that command. For example, if it says Control+F8
    beside a menu command, pressing the Ctrl key on your keyboard and the F8 key at
    the same time will execute that command.


