  md: '# Selecting Objects


    As with most features in Drawings you have a variety of different options when
    it comes to making selections. Making selections is the cornerstone to editing,
    as an object must be selected before anything can be done to it.


    # Selecting Individual Objects


    To select individual objects you simply have to click on them.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_155_0.png)


    +   1. Click once on an object. A series of little green squares will appear around
    the object indicating that it is selected.

    2. Click on any blank area of the slide to deselect the selection.


    > You can select multiple objects by holding down the Ctrl key and clicking on
    them. If you press Ctrl+A on the keyboard, all the objects on the screen will
    be selected.


    # Selecting Multiple Objects


    The advantage of selecting multiple objects is that you can save time by editing
    objects at once. To select multiple objects, you have to create a marquee selection
    around your objects.'
  merge: -1
  pgno: 155
