  md: '# Finding Programs


    # Finding Programs


    There are a variety of ways in which you can search for software in CNR. CNR has
    a web-style search engine that allows you to conduct searches by certain keywords.
    Those keywords can be based on the functionality of the software, the name of
    the manufacturer or the title of the application. Alternatively, if you''re the
    type of person who prefers to walk the aisles while shopping for ideas, you can
    browse for different software by category.


    # Searching


    If you''re hunting for a particular piece of software, you can run a web-style
    search in CNR and you''ll be provided with all the results that match your criteria.
    You don''t necessarily have to know the name of the program for, as you can just
    type in a keyword. For example, if you were looking for a photo manipulation tool,
    you could type in "photo" as the search term or, if you were looking for a piece
    of software from a particular vendor, let''s say Adobe, you could simply type
    "Adobe" into the search box. After you''ve conducted your search, you can determine
    how you want the results displayed.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_202_0.png)


    +   1. Click on the Search Warehouse link. You will now be able to conduct a search.


    +   2. Type in the desired keyword for your search into the field.


    +   3. Click Go. The results of your search will be displayed.


    +   4. Click the scroll buttons to review your search. You can now either repeat
    Steps 1 - 3 to conduct another search or you can jump to the section entitled
    "Installing Programs with CNR" on the following pages.'
  merge: -1
  pgno: 202
- img_proc: true
  md: '# Browsing by Category


    Like most men, I can spend hours roaming the aisles of my local Home Depot, admiring
    the goods and getting an idea of what type of things I need for around the house.
    if you too like to browse for ideas, you''ll enjoy shopping the aisles of CNR.
    The programs in CNR are divided into a variety of categories that you can browse.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_203_0.png)


    +   1. Click on the Search Warehouse link. You will now see several general categories
    of software.


    +   2. Click on the desired category. The screen will change and you will see
    a list of subcategories.


    +   3. Click on the desired subcategory. All of the programs that fall under that
    category will be displayed.


    +   4. Use the scroll buttons to browse through the different software applications
    that have been found.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_203_1.png)


    > Beside each of the categories you may have noticed a number in brackets: This
    represents the number of programs that fall under that category.


    # Browsing by Aisle


    Think of an aisle as a group of software that falls under a specific purpose or
    task then just a category. For example, if you''re a graphic designer, you''re
    probably looking for programs that might span a variety of categories including
    photo editing, page layout, art and vector programs. Linscape has a wide range
    of aisles that contain groups of programs designed for specific users or uses.
    Some examples of aisles include student aisles, developer aisles, kids aisles,
    web aisles and many more. Not only can you browse through the different aisles,
    but you can also create your own. The Linscape community becomes evident when
    working with aisles as every aisle you create can potentially be viewed by other
    members of the community.'
