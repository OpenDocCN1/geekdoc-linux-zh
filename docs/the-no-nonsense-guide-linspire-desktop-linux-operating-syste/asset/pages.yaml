  md: '# Editing Graphical Elements


    # 155


    ![](img/3926ca1fb00de3af845faa03d2c351e5_156_0.png)


    +   1. Position your mouse pointer in the top left of the blank area to the objects
    that you want to select.

    2. Click and drag diagonally. As you drag a marquee will appear. The marquee must
    completely surround the objects that you would like to select. When you release
    the mouse button all of the objects that were completely surrounded by the marquee
    will be selected.

    3. Click once in any blank area of the slide show to deselect your selection.


    # Moving Objects


    Moving objects is simply a matter of selecting them and then dragging them to
    the desired location.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_156_1.png)


    +   1. Select an object or objects using one of the selection methods.

    2. Position the mouse pointer over the object. The mouse pointer will change into
    a four-sided arrow.

    3. Click and drag the object to the desired location. As you drag, a transparent
    preview of the location of the objects will appear.

    4. Release the mouse button. The objects will be moved.'
  merge: -1
  pgno: 156
- img_proc: true
  md: '# Resizing Objects


    Once you have an object selected you can quickly change its size or reshape it.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_157_0.png)


    +   1. Select an object or objects using one of the selection methods.

    2. Position the mouse pointer over one of the little squares that surround the
    object. The mouse pointer will turn into a two-sided arrow.

    3. Click and drag in any direction. As you drag a marquee will appear previewing
    the new size of the object. When you release the mouse button the object will
    be resized.


    # Squishing and Stretching Objects


    You can squash or stretch an object by clicking and dragging on any of its middle
    handles.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_157_1.png)


    +   1. Select an object or objects using one of the selection methods.

    2. Position the mouse pointer over one of the little middle squares (in other
    words, any of the squares except for the corner ones).

    3. Click and drag inwards or outwards. Dragging inwards will squish the object
    while dragging outwards will stretch the object. As you drag a marquee will appear
    previewing the new shape of the object. When you release the mouse button the
    object will be reshaped.'
  merge: -1
