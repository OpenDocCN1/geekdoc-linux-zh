  md: '# Finding Text on a Page


    This is one of the features that I use most often when web browsing. If you''re
    on a page, particularly one with a lot of information displayed, you can use the
    Find command to look for find a particular word or string of text.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_225_0.png)


    +   1. Click Edit | Find in This Page... from the menu bar. The Find Page dialog
    box will appear, where you can enter the text that you would like to find.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_225_1.png)


    +   2. Type the text string that you are looking for in the Find text field:

    3. Click on any of the checkboxes to select any of the options. You can choose
    to match a certain case, wrap around, or search backwards in the document rather
    than forwards.

    4. Click Find. The first instance of the word will be found and highlighted on
    the page.

    5. Repeat Step 4 to find other instances of the word(s) in the web page.'
  merge: -1
