  md: '# Composing E-Mail


    Sending messages to your friends, family and colleagues is a breeze in Linspring.
    Your messages can be formatted in a variety of ways and you can add as attachments.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_247_0.png)


    +   1. Click on the New Msg button. The Compose window will appear.

    2. Begin typing the e-mail address or name of the person to whom you would like
    to send the e-mail. If the contact is in the Address Book, their name will appear.

    3. Click on the desired recipient or continue typing their name.

    4. Press the Enter key. You will advance to the next line where you can add additional
    recipients.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_247_1.png)


    +   5. Click on the arrow under the From field in the next line. A list of address
    options will appear.

    6. Click on the desired option. They include:

    * To. This is for the primary recipients of your copy,

    * Cc. This stands for "carbon copy," which means that the recipient will receive
    a copy of the message and their name will be visible to everyone who received
    the message.'
  merge: -1
  pgno: 247
- img_proc: true
  md: '# Composing E-Mail


    +   - Bcc. This stands for "blind carbon copy," which means that the recipient
    will receive a copy of the message, but their name will not be visible to anyone
    else who received the message.


    +   - Reply-To. If you''d like any replies to go to different e-mail addresses,
    rather than the original addressees, use Reply-To.


    +   - Newsgroup. This field is for posting a newsgroup posting.


    +   - Followup-To. This is used to redirect a newsgroup posting. All replies will
    go to this newsgroup rather than the original.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_248_0.png)


    +   7. Type another e-mail address for the type or recipient you specified in
    Step 6.


    +   8. Press the Enter key.


    +   9. Repeat Steps 5 - 8 to add other recipients.


    +   10. Type a subject line for your e-mail. This is what recipients will see
    first, so make sure it is detailed.


    +   11. Type your e-mail message in the window.


    # Adding Attachments


    You can add any files to send along with your messages as an attachment. You should
    keep in mind however that some mail servers limit the size of files that can be
    sent and received. If you use the general rule of thumb that your attachments
    should be no larger than 2 MB (2000 KB), you should be alright. Your ISP can let
    you know the maximum size of file you can send from your e-mail account.'
  merge: -1
