    # Selecting Menu Items with a Keyboard


    Another approach for selecting menu items is to use your keyboard. This can save
    you the hassle of having to switch between the keyboard and mouse if you are already
    typing within a program.


    +   1. Press the Alt key on your keyboard. The first category in the menu bar
