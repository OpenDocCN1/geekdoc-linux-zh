  md: '# Installing Linspire


    Maybe it was just my inner geek developing, but I remember being so envious of
    the smart kids who got to skip a grade in primary school. For those of us who
    weren''t deemed bright enough to jump grades, here''s a free pass from me. If
    you purchased a Linspire computer with the operating system already installed,
    then you have my permission to skip ahead to the “Running Linspire for the First
    Time” section of this chapter. If you''re still here it means you''ve made the
    smart decision to install Linspire yourself on a new or existing system.


    It wasn''t many years ago that the process of installing a Linux based operating
    system on your computer was a daunting task that could take hours, if not days.
    In fact, there used to be install parties on weekends where people would get together
    to help each other get Linux installed and running properly.. A lot has changed
    over the years and the installation of Linspire just involves a few clicks of
    your mouse button. In this chapter we''ll explore the installation process and
    also explore LinspireLive!, an option for those hesitant to jump into the world
    of Linspire.


    In this chapter we''ll cover:


    +   - Conducting a takeover installation

    - Installing to a partition

    - Running LinspireLive!'
  merge: -1
