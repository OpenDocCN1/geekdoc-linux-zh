  md: '# Using Multimedia Programs


    It''s amazing how far computers have come over the last few years. I remember
    as a kid growing up we got excited when our local museum opened a computer wing.
    You could go into that section, and you could play Pong (a very simple tennis-like
    game for those of you who''ve never heard of it). You could also answer a yes
    or no question posed by the computer and it would do a psychological analysis
    of you or you could type in your birthday and get your biorhythm.

    Fast-forward to today, where you can download and view your favorite music videos,
    burn CDs, manipulate photos, watch DVDs, play interactive games and do so much
    more.


    No operating system would be worth its weight in salt if it didn''t give you access
    to your favorite multimedia components, and Linspur is no slouch in this department.
    Right out of the box you are provided with a full range of multimedia tools that
    are at your disposal to keep you entertained.


    In this chapter we''ll cover:


    +   - Playing music with Lsongs

    - Using Lphoto to manipulate photos

    - Downloading photos from a digital camera


    ![](img/3926ca1fb00de3af845faa03d2c351e5_164_0.png)'
