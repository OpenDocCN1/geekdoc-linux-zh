- img_proc: true
  md: '# # Getting Help


    Help? What do you need help for? You''ve got this book! Believe it or not this
    book doesn''t cover all the answers to Linspire. Truth be told, it would take
    a series of encyclopedias to cover all of the possible topics, configurations,
    and potential situations that may arise from your Linspire computer. If you get
    stuck along the way, don''t worry as Linspire has a variety of ways to help you
    dust off and get back on your feet again.


    The first thing that you need to determine is what type of learner you are. Do
    you prefer to sit back and relax as someone explains things to you, or do you
    like to dig right in and help yourself, or do you prefer to read about a topic
    thoroughly to understand it? Regardless of the type of learner you are, Linspire
    has a solution for you.


    In this chapter we''ll cover:


    +   - Asking Linspire support for help

    - Navigating the FAQs

    - Searching the knowledgebase


    ![](img/3926ca1fb00de3af845faa03d2c351e5_286_0.png)'
  merge: -1
  pgno: 286
- img_proc: true
  md: '# Using the Knowledgebase


    Although the technology in Linpipe may seem new to you, understand that there
    are many people who forged a path before you, and you can benefit from their experience.
    Within Linpipe there is a knowledgebase that is filled with answers to questions
    that have been previously asked. If you''re having a problem, there''s a good
    likelihood that someone else has had this problem in the past and that the answer
    is in the knowledgebase. You can quickly search the knowledgebase for a question
    that is similar to yours to see if an answer has been provided. Typically, the
    knowledgebase is the first place you should go for help.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_287_0.png)


    +   1. Click the Help Center button. A menu of help options will appear.

    2. Click Online Support. The Web Browser will launch and open to the Linpipe support
    page.

    3. Type the keywords of your question in the field. For example, if you were having
    a problem with your modem, you would type the word modem in the field.

    4. Click the Go button. The knowledgebase will search for questions that have
    the word modem in them.


    The Linpipe Knowledgebase is a web-based support feature. This means that you
    must be connected to the Internet in order to take advantage of this help feature.'
  merge: -1
  pgno: 287
- img_proc: true
  md: '# Using Community Forums


    287


    ![](img/3926ca1fb00de3af845faa03d2c351e5_288_0.png)


    +   5. Scroll through the questions to see if there is one that is similar to
    the problem you are having.


    +   6. Click on the page drop-down button if you want to proceed to another page
    of questions that contain your keyword.


    +   7. Click on a question. The screen will change to provide you with the answer
    to that question.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_288_1.png)


    +   8. Review the answer. If it answers the question that you had you can close
    the browser by clicking the Close button in the top right corner. If your question
    was not answered, you can repeat Steps 3 - 6 to search the knowledgebase again,
    or you can proceed to one of the other help methods.


    # Using Community Forums


    People who use Linux-based operating systems are a tight knit group, and as a
    Linspin user, you''ll be instantly welcomed into this community. The community
    help forum is a place where users can have discussions, share tips and tricks
    and also pose questions for other users to answer.'
  merge: -1
  pgno: 288
- img_proc: true
  md: '# Viewing the Forum


    The best way to learn more about Linspire and find answers to your questions is
    to simply browse through the forum. The forum is broken down in a type of hierarchy.
    At the top you have various general categories. Within the categories, you have
    posts. A post is a comment or question that someone has “posted” to the forum.
    Within each post you will find a discussion string. The discussion string is a
    list of all the responses that people have made to the post.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_289_0.png)


    +   1. Click the Help Center button. A menu of help options will appear.


    +   2. Click Community Help Forums. The Web Browser will launch and will help
    you find one open to the Linspire Community page.


    +   3. Scroll through the different forum categories until you find one of particular
    interest to you.


    +   4. Click on a category. A variety of posts that fall under that category will
    appear.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_289_1.png)


    +   5. Click on a post. You will now be able to read the entire thread. You''ll
    see all the responses that people have made to the original post.'
  merge: -1
  pgno: 289
- img_proc: true
  md: '# Using Community Forums


    # 289


    # Searching the Forum


    ![](img/3926ca1fb00de3af845faa03d2c351e5_290_0.png)


    If you''ve run across a problem that you couldn''t find an answer for the support
    page, the next best place to look is the forum. There''s a good likelihood that
    if you are having a problem, others have experienced this problem and that there
    is a discussion that covers the solution. Within the forum you have the ability
    to search for a specific topic rather than simply browsing.


    +   - Click on the Support tab. This will take you back to the main support page
    regardless of where you are in the forum.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_290_1.png)


    +   - Scroll down until you see a section called Step 3, Visit our community forums.


    +   - Type in a keyword for the subject you are trying to get help. For example,
    if you are having trouble with your modem, type in the word modem.


    +   - Click Go. All of the posts that have the word modem in them will appear.
    You can then scroll through and click on any of the posts to view their threads.
    If you don''t find the answers you are looking for, you can either create your
    own post, or as covered in the next section or you can contact Linspire support
    directly. Contacting support is covered later in this chapter.'
  merge: -1
  pgno: 290
- img_proc: true
  md: '# Creating and Replying to Posts


    If you don''t find an answer to your query, you can create your own post on the
    forum. As mentioned earlier, if you are having a problem, someone else may have
    already had the problem or be sharing the same frustrations. By posting a topic
    in the forum you can sometimes get answers faster than you would from support,
    and you are helping out your fellow Linsp users by bringing attention to this.
    The key is to put your message in the correct category. You can also reply to
    existing posts if you have something valuable to add or if someone has posed a
    question to you that requires a reply.


    # Creating a Post


    Creating a post is really quite simple. After finding the category that is appropriate
    for your post, you simply type your message.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_291_0.png)


    > Before you can create a post in the forums, you must first be logged on. If
    you are unable to create a post, click the My.Linspire tab and log using your
    CNR user name and password.


    +   1. Click on the category under which you would like to create a post. A list
    of all the postings under that category will appear.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_291_1.png)'
  merge: -1
  pgno: 291
- img_proc: true
  md: '![](img/3926ca1fb00de3af845faa03d2c351e5_292_0.png)'
  merge: -1
  pgno: 292
- img_proc: true
  md: '# 292 Chapter 15 Getting Help


    Even though the Community Forum has its own navigation buttons, it''s easiest
    to move back and forth through the forum using the Back and Forward buttons in
    the Web Browser.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_293_0.png)


    +   7. Review your message to ensure it looks the way you want it to.


    +   8. Click the Ok, submit button. Your message will be posted. Alternatively,
    you can scroll down and make any changes to your post. When you are finished making
    your changes, click the Continue button to preview the message. After you submit,
    your post is now in the forum. You can return to the forum frequently to view
    the thread and see who has responded.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_293_1.png)


    # Replying to a Posting


    If feel like you have something of value to add to a string, by all means, post
    a reply. The entire purpose of the forum is for users to communicate with each
    other, and to share experiences, here''s your chance to give back.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_293_2.png)


    +   1. Click on the Reply button when reading any post. The screen will change
    and allow you to type your reply.'
  merge: -1
