    # Tabbed Browsing


    Typically when I''m on the Internet, I''ve got several windows open so that I
    can move back and forth to work on several sites. The problem with this is that
    it becomes difficult to keep track of which window contains which website. In
    addition, the more instances of a browser I open, the more clutter on my computer.
    The solution to this is tabbed browsing. Tabbed browsing allows you to visit multiple
    sites all within the same Web Browser window. You can jump through different sites
    by clicking on their respective tabs.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_220_1.png)


    1. Click View. The View menu will appear.


    2. Click Show/Hide. A submenu will appear.


    3. Click Tab bar. The Tab bar will appear.'
