  md: '# Selecting Text


    Before you can format text, you first must tell Word Processor what text you you
    would like to format. You can perform this action by highlighting the letter,
    word, paragraph, or pages that you would like to change. There are a variety of
    ways to select.


    # Selecting with the Mouse


    The most common way to select text is simply to click and drag across the text
    that you would like to select with the mouse. Using the mouse button, you can
    also quickly select ranges.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_107_0.png)


    +   1. Position the mouse pointer right before the word, sentence, or paragraph
    that you would like to select.

    2. Click and drag to the right. As you drag the words that the cursor passes over
    will be selected.

    3. Release the mouse button. The area that you highlighted will now be selected.

    4. Click in any blank area of the document to deselect the text.


