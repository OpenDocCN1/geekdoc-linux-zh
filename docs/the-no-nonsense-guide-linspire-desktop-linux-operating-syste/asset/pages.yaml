  md: '# Working with Open Applications


    It''s very rare nowadays to be using a computer and only be running one program
    at a time. In today''s fast-paced world, everyone is expected to multitask to
    get things done quicker, so it''s quite possible that you will have multiple programs
    launched at any time. The danger this poses is that you could find yourself in
    a world of mess and clutter if you don''t know how to properly manage your open
    programs. The good news is that Linsp provides you with multiple ways to manipulate
    the appearance and location of your open applications.


    # Resizing a Window


    Resizing a program window in Linspire is as simple as clicking and dragging.


    +   1. Position your mouse pointer over the edge of a window. The cursor will
    change into a double-sided arrow when you are over the correct spot.

    2. Click and drag inward to reduce the size of the window.

    3. Click and drag outward to increase the size of the window.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_41_0.png)


    > By clicking and dragging at the corner of a window, you can change the width
    and height equally at the same time.'
  merge: -1
  pgno: 41
- img_proc: true
  md: 'Working with Open Applications


    # Minimizing and Restoring a Window


    Minimizing a program simply means that you are putting it out of the way temporarily
    so that you can work in another program. When you minimize a program window, the
    program itself won''t be affected by being minimized.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_42_0.png)


    +   1. Click the Minimize button. The window will no longer appear on the screen,
    but it can still be seen in the Taskbar.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_42_1.png)


    +   2. Click an icon in the Taskbar. The program will restore to its previous
    state.'
  merge: -1
