    +   1. Click and hold the Connectors button to see a list of connection lines.


    +   2. Click on the desired type of line.


    +   3. Click and drag from one object to the other. The connector line will be
    created between the two objects. The objects are now dynamically linked, meaning
    if you move either object, the line will still connect them.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_154_1.png)


    +   4. Click and drag one of the objects bound by a connector line to a different
    part of the page. The objects will still be linked as the connector line adjusts.


    # Editing Graphical Elements


    Basic things like copying, cutting and pasting work the same way in Drawings as
    they do for other parts of the suite. You have several unique options though when
    it comes to selecting, moving and resizing graphical elements.'
