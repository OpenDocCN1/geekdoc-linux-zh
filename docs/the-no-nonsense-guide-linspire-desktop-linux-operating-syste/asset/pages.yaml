  md: '# How To Use This Book


    Welcome to this No Nonsense Guide™ from Mimosa Books. We hope you enjoy the journey
    on which you are about to embark, learning about the Lin大气 operating system. this
    book can be used as a self-paced guide or as a reference whenever you are stuck.
    If you are upgrading to this latest version, instructions on using the many new
    and enhanced features are included.


    The book presents the material in a visual and procedural format. Rather than
    burying you in a pile of theoretical information, you are provided with step-by-step
    instructions that can be used to accomplish many different tasks. Each instruction
    is accompanied by a screen capture showing exactly where to click the task. Along
    the way you will also find dozens of tips and shortcuts for accomplishing your
    work smarter and faster.


    The instructions used in this book are straightforward and no out-of-the-ordinary
    conventions are used except perhaps ones between certain commands-for example


    As you go through the book you may notice that what you see on your screen may
    look slightly different than the screen captures you see in the book. Don''t worry,
    this is normal. Depending on how your computer was originally manufactured or
    configured, there may be slight differences between your computer and the computers
    that used for writing this book.


    It would take an encyclopedia to cover all of the features that Lin大气 has to offer,
    so not every aspect of the operating system is covered. The goal of this book
    is to show you how to use those features that are used most often when exploring
    the world of Lin大气.'
