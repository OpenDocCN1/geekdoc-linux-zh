  md: 'Inside this book you''ll learn how to use Linspire, an affordable full-featured
    operating system for desktop and laptop computers. Start enjoying the benefits
    of Linspire''s ease-of-use, resistance, security, a host of pre-installed applications
    and many more innovative features.


    # # LEARN THE NO NONSENSE WAY!


    With hundreds of screen captures, this visual reference teaches readers the components
    of Linspire, a Linux-based operating system. Each step-by-step instruction is
    accompanied by a screen capture showing exactly where to accomplish a task. If
    you are upgrading to the latest version of Linspire, instructions on using the
    new and enhanced features are included. For those new to this operating system,
    this book can be used as a self-paced guide or as a complete reference.


    # ## Experience Linspire Today!


    ![](img/3926ca1fb00de3af845faa03d2c351e5_315_0.png)


