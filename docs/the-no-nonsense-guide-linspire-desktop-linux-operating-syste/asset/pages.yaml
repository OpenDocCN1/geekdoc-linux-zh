  md: '# Printers


    No operating system is an island, and Linsp is no exception. Typically you have
    several devices that work alongside your computer to make sure it is a complete
    solution to your needs. The most common of these devices is a printer.


    Let''s face it, as convenient as computers are, most of us prefer to read documents
    from a piece of paper rather than a monitor. To do this, you need a printer installed
    and configured for your system. Linsp makes it easy for you to set up printers
    and other types of hardware that you''ll use along side your computer.


    In this chapter we''ll cover:


    +   - Setting up a printer

    - Printing documents'
  merge: -1
  pgno: 302
- img_proc: true
  md: '# 302


    # Chapter 16 Printers


    # Adding a Local Printer


    Despite of what you''ve heard, a local printer in not that one that was born and
    lives in your city. That was poor attempt at a joke, I apologize. A local printer
    is actually one that is connected directly to your computer. Turn on your printer
    and make sure it is connected to your computer before you begin.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_303_0.png)


    +   1. Double-click the Printers icon on the desktop. This will open the Printers
    window where you can add a printer.


    +   2. Click the Add button. A menu will appear.


    +   3. Click Add printer/class... The Add Printer wizard will appear and step
    you through the installation process.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_303_1.png)


    +   4. Click on Next. This will take you to the next step in the wizard.'
  merge: -1
  pgno: 303
- img_proc: true
  md: '# Adding a Local Printer


    +   5. Click on the radio button beside the Local printer option.


    +   6. Click on Next. The computer will now scan all the ports to look for a printer
    connected to your machine.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_304_0.png)


    > If you have a home network configured, you can select one of the network options
    to connect to a shared network printer.


    +   7. Click on the desired port selection. The port selection will depend on
    the type of printer connection you have. It can be Parallel, USB or if it''s an
    older printer it may be Serial.


    +   8. Click on Next. You''ll proceed to the Printer model selection screen, where
    you''ll be able to choose the model of your printer.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_304_1.png)'
