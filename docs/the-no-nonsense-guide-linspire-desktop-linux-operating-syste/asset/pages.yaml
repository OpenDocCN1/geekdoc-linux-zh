  md: '# Printing


    Printing works the same in almost every application that supports printing. If
    you have more than one printer connected to your machine, you''ll simply pick
    the printer that you want to print to, select any additional options, and away
    you print!


    ![](img/3926ca1fb00de3af845faa03d2c351e5_309_0.png)


    +   1. Execute the Print dialog box from to print from. In most cases you can
    bing this up by pressing Ctrl+P or clicking File | Print. In this example we''ll
    be printing from the Web Browser.

    2. Click on the drop-down list and select a printer to which you would like to
    send this file.

    3. Adjust any of the options presented to you in the dialog box.

    4. Click Print. Your file will be printed.'
