    # The Panel


    The Panel is the bar found at the bottom of the desktop that quickly allows you
    to access your applications. A handy feature of the Panel is that it remains visible
    regardless of the number of programs you have running. This feature is great for
    managing the programs you are running and for giving you access to applications
    at any time. Later in this chapter, we will describe in detail the four parts
    of the Panel. But right now lets look at an overview of what the parts of the
    Panel are and what they do.'
