    # Spell Checking Messages


    Because e-mail is primarily a text based method of communication, To avoid, your
    words create a great impression of the type of person you are. To avoid being
    thought of careless or lazy, your messages should be free of errors. The E-Mail
    Client helps you in this endeavor as it automatically checks your spelling as
    you type.


    +   1. Position your mouse pointer over any word that has a red underline. The
    red underline indicates that the word cannot be found in the dictionary. The word
    will become highlighted and a list of alternatives will appear.


    +   2. Click on the desired alternate word. The incorrect word will be replaced
    with the one that you have selected. Alternatively, you can click the Add to Dictionary
    option, if the word is spelled correctly but just not recognized by the dictionary.
    This is very common for proper nouns.


