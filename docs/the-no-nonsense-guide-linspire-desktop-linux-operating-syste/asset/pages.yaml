    # The Trash


    Unlike regular trash, in Linspice you don''t have to drag yourself out of bed
    early in the morning, endure the cold weather and carry heavy bags to your curb
    when you want to get rid of a file or folder. The trash folder itself is your
    safety net. When you delete a file in Linspice, the file is sent to the trash
    folder Instead of it being erased entirely. Think of the trash as a dumpster at
    the back of a building. If you inately throw something out, you can rummage through
    the dumpster to retrieve it. Don''t worry, Linspice will not have any rats or
    banana peels to deal with when sifting through the deleted contents.


    # Deleting Items


    There are several ways to delete a file or folder in Lin불어, but perhaps the fastest
    is to simply use the keyboard. Because deleting a file can be a hazardous move,
    Linspice will first confirm that this is the action you wish to take. If you agree,
    then the file will be sent to the trash folder. Once it''s in the trash, you will
    still have another opportunity to retrieve the file if it was inadately removed.'
