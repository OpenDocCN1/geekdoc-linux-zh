    +   7. Click Accept Connection. Your invitee will now have complete access to
    your desktop.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_299_0.png)


    When the person you are sharing your desktop with closes their VNC client, you
    will get a message in your system tray notifying you that your desktop is no longer
    being shared.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_299_1.png)


    # Viewing Desktops


    Not only can you share your desktop with Linspire, but you can also view the desktops
    of others.


    +   1. Click Launch | Run Programs | Utilities. A list of utility programs will
    appear.


    +   2. Click Desktop Sharing | Connect to Remote Desktop. A dialog box will appear
    where you can enter the host number.


