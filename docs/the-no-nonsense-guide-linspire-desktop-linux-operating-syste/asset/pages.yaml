  md: '# Searching the Internet


    There are a variety of different search web sites that allow you to filter through
    the web in search of your topic. The most prominent of these is Google, and the
    Web Browser incorporates the Google search engine into its Location bar. Beyond
    basic searches, you can use Linspire''s Hot Words feature to immediately search
    on any word.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_230_0.png)


    +   1. Type the type that you are searching for in the Location bar.

    2. Click the Search button or simply click Enter on the keyboard. A list of the
    search results will be displayed in the window.

    3. Scroll the different search results until you see one that matches what you
    were looking for.

    4. Click on the desired link. You will be taken to that site.


    > To conduct a search on an exact phrase, put a pair of quotations around the
    search text. Also keep in mind that the searches you conduct are not case-sensitive.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_230_1.png)


    # Hot Words Searching


    The developers of Linspire have done it again. They''ve taken the web to an entirely
    different level by creating a revolutionary feature called Hot Words searches.
    This search functionality allows you to quickly search on any word on the Internet
    with just a click of the mouse button. Not only can you conduct regular searches
    with Hot Words, but you can search particular categories and even run grammar
    and spell checks on the term you''ve selected.'
  merge: -1
  pgno: 230
- img_proc: true
  md: '# Chapter 11 Browsing the Internet


    ![](img/3926ca1fb00de3af845faa03d2c351e5_231_0.png)


    1. Position your mouse pointer over any word in a web page. The word will become
    highlighted.


    2. Click on the highlighted word, and a menu will appear.


    3. Click on the desired category of search you would like to conduct. If you click
    on the More category, you will see additional options. The results appear in a
    new tab. Your search options include:


    +   - Web. This conducts a regular Google search on the highlighted term.


    +   - Web. This will search Google''s index for the highlighted term.


    +   - Shop. This will search Froogle.com''s site for products that match that
    term.


    +   - Auctions. The eBay website will open and any auctions that match the highlighted
    term will be displayed.


    +   - Books. A search on Amazon.com will be conducted for the term.


    +   - Catalogs. A search on Google''s Catalog search function will be conducted
    and results matching the word you highlighted will appear.


    +   - Images. Any images that match the highlighted term will be displayed in
    Google''s image search.


    +   - Directory. A search will be conducted on the highlighted word using Google''s
    service.


    +   - Thesaurus. Selecting Thesaurus will launch Thesaurus.com and synonyms of
    the highlighted word will be displayed.


    +   - Dictionary. Selecting this option will launch Dictionary.com and the definition
    of the highlighted word will be displayed.


    +   - Glossary. Google will do a search of definitions of the highlighted word
    on the Internet.'
