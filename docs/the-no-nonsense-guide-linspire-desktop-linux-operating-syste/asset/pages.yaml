- img_proc: true
  md: '![](img/3926ca1fb00de3af845faa03d2c351e5_305_0.png)


    +   9. Click on the manufacturer of your printer in the Manufacturer area of the
    window. A list of models that they make will appear in the Model area of the window.


    +   10. Click on the model of your printer. If you can''t find your model, click
    on Other and select a model from the disk that came with the printer.


    +   11. Click on Next. You''ll proceed to the Driver selection screen, where you
    can select the driver for your printer.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_305_1.png)


    +   12. Click on the appropriate driver. Typically one of the drivers will say
