- img_proc: true
  md: '# # Creating Graphics & Slide Shows


    Within the OpenOffice suite that comes with your Linsp computer, you''ll find
    a program called Drawings. This program allows you to not only create graphical
    images, but also, present those graphics as slide shows. The program itself is
    actually quite advanced and has hundreds of different features you can use when
    creating your images. It would take an entire book to cover all of the features,
    so in this chapter we''ll concentrate on the basics and try to also show you a
    few advanced features.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_146_0.png)


    You may also notice that there is another program in the Launch menu, under the
    OpenOffice group called Presentations. This program is actually the same as Drawings,
    with the exception that it starts with a wizard to create a slide show. This wizard
    is accessible from within Drawings and will be covered in detail within this chapter.


    In this chapter we''ll cover:


    +   - Building and playing a slide show

    - Creating graphical elements

    - Editing and manipulating objects'
  merge: -1
  pgno: 146
- img_proc: true
  md: '# Launching Drawings


    Drawings can be found in the Launch menu along with the rest of the OpenOffice
    suite.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_147_0.png)


    +   - Click Launch | Run Programs. A list of programs categories will appear.

    - Click Business & Finance to see a list of programs that fall under that category.

    - Click OpenOffice. The OpenOffice programs will appear.

    - Click OpenOffice Drawings. The program will launch.


    # Building a Slide Show


    Here''s some rocket science for you – a slide show is built of individual slides.
    The slides themselves can include text, graphics, movies and audio. For now we''ll
    cover how to add and remove slides and how to use the wizard to automatically
    create a slide show.


    # Using AutoPilot


    If you''re not just graphically inclined or don''t want to spend a lot of time
    formatting your slide show, you can choose from a selber design templates. These
    design templates usually include formatting for backgrounds, fonts and colors.
    Using the AutoPilot wizard not only can you select a design template, but you
    can also build the content of your slide show. The wizard will ask you a variety
    of questions about what you want to include in your slides and upon answering
    those questions, the slide will be built for you.'
  merge: -1
  pgno: 147
