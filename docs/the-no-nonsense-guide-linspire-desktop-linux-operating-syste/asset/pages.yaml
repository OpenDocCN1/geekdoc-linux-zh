  md: '# Word Processing


    Typically when you purchase a computer, you are given only a bare bones system
    with little useful software. In order to do anything meaningful with it, you must
    go out and spend money on a suite of office with a word processor, a spreadsheet
    and a slide show program.


    Your Linspread computer comes pre-installed with the OpenOffice suite. This office
    is not run-of-the-mill, freebie software package. It is jam-packed with features
    to meet all your document, spreadsheet and slide show needs. If you''re migrating
    from Microsoft Windows to Linspread, you''ll find making the switch to OpenOffice
    a breeze. The functionality is almost identical and the document conversion is
    almost flawless. Word Processor is the cornerstone of the OpenOffice suite. It
    provides you with all of the components you''ll need to create just about any
    type of document Although it would take an entire book to cover all of the features
    of Word Processor, the goal of this chapter is to give you a thorough grounding
    in the program and take you beyond just the basics of creating documents.


    In this chapter we''ll cover:


    +   - Document file basics

    - Page setup

    - Basic and advanced formatting


    ![](img/3926ca1fb00de3af845faa03d2c351e5_100_0.png)'
  merge: -1
  pgno: 100
