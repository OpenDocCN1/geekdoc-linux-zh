- img_proc: true
  md: '# Sharing Desktops


    Almost every family has a computer geek, it happens to be me with my family and
    you may be the one for your family. If you know a thing or two about computers,
    you may become the help desk guru for every uncle, grandparent, cousin and in-law
    who has a computer problem. I can''t get your family members to stop calling you,
    but I can save you some time. The flip side may also be true. If you happen to
    need help from that good-for-nothing-else relative, at least you won''t have to
    feel guilty anymore because you now have the option of desktop sharing. Desktop
    sharing allows you to share and control other people''s computers from your computer''s
    desktop.


    # Giving Control of Your Desktop


    If you want to share your desktop with others, you need to create an invitation
    for them that includes the details of how they can connect.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_297_0.png)


    +   1. Click Launch | Run Programs. Categories of different programs will appear.

    2. Click Utilities. A submenu of different utilities will appear.

    3. Click Desktop Sharing. Another submenu will appear.

    4. Click Share This Desktop. The Desktop Sharing program will launch.


    To share your desktop with others, you create an invitation that contains a host
    and password. That password and host will be valid for one hour from the time
    the invitation is created.'
  merge: -1
  pgno: 297
- img_proc: true
  md: '# Sharing Desktops


    5. Click the Create Personal Invitation... button. A screen will appear providing
    you with a host and password that you can share with others who would like to
    connect to your desktop. Alternatively, you can click the Invite Via Email...
    button where you compose an e-mail to the person or people whom you would like
    to share your desktop.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_298_0.png)


    6. Take note of the host and the password. You can now pass this information on
    to the person with whom you would like to share your desktop. They will need a
    program that is called a VNC client in order to connect and view your desktop.
    Proceed to the next section to learn about the VNC client to connect to your Linspire
    computer. Once the person runs their VNC client to connect to your machine, a
    dialog box will appear asking you how you would like to handle the request to
    share your desktop.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_298_1.png)'
  merge: -1
