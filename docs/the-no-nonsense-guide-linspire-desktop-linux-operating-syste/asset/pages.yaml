  md: '# Switching Slides


    # Switching Slides


    The quickest way to switch from one slide to another is to simply click on the
    name of the slide you would like to move to.


    +   1. Click on the name of the slide you would like to move to. You will now
    be taken to that slide.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_152_0.png)


    # Creating Graphical Elements


    Whether you are going to use the graphics you create on their own or as part of
    a slide show, Drawing gives you a variety of tools that you can use to create
    some amazing, visually appealing graphics.


    # Inserting Shapes


    Drawing provides you with tools to quickly add a variety of preset shapes to your
    slide show. If you''re not satisfied with the shapes that are included, you can
    always draw your own.'
