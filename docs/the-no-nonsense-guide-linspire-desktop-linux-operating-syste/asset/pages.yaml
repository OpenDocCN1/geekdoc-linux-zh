    +   - Info List. This view displays your files and folders as a list.


    +   - Detailed List. This view displays additional information on your files like
    their size, type, permission and so on.


    +   - Text View. This view is very similar to the Detailed List View except the
    Text View displays no icons and there is a "/" in front of every folder name.'
