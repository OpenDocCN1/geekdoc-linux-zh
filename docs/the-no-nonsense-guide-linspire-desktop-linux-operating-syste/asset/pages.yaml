- img_proc: true
  md: '# Personalizing & Customizing Linspire


    Imagine what kind of a world it would be if everyone had to drive the same car,
    wear the same clothes, watch the same shows and eat the same meals. Our individuality
    is of extreme importance to us, so it''s understandable why Linspire offers so
    many customization options when it comes working in the operating system.


    Since everyone works a little differently, Linspire allows you to change the look
    and feel of your computer to suit your individual tastes. From backgrounds to
    screen savers to icons to screen size Linspire gives you the ability to make the
    operating system your own. Linspire be personalized, but it offers a variety of
    unique tools that allow you to control the way in which you work.


    In this chapter we''ll cover:


    +   - Changing backgrounds

    - Selecting screen savers

    - Manipulating icons

    - Working with virtual desktops


    ![](img/3926ca1fb00de3af845faa03d2c351e5_52_0.png)'
  merge: -1
  pgno: 52
- img_proc: true
  md: '# Changing the Wallpaper


    The easiest way to personalize the look of your computer is to change the background
    image of the desktop. This background is also known as the "wallpaper." For the
    background, you can select from a variety of images, create a customized background,
    use one of your favorite photos, or even run a slide show.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_53_0.png)


    +   1. Right-click any blank area of the desktop. A menu will appear.

    2. Click Configure Desktop... The Configure - Desktop dialog box will open to
    let you configure different elements of your desktop.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_53_1.png)


    +   3. Click the Background icon if it is not already selected. This action will
    bring you to the area where you can control the look of your desktop.

    4. Click the arrow beside "Setting for desktop" and pick a specific virtual desktop
    where you can apply any setting. Alternatively you can select All Des to apply
    the same setting to each virtual desktop. You''ll be learning more about virtual
    desktops later in this chapter.


    You must now decide what you would like: a picture, a slide show or a colored
    background.'
  merge: -1
  pgno: 53
