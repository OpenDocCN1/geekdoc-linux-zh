  md: '# Organizing E-Mail


    Once you get started e-mailing, it won''t be long before your Inbox is full of
    messages. Sorting through all your mail may pose a challenge, and Linsphere is
    up to the task. There are a variety of features included in the e-mail program
    that will allow you to sort, organize and find e-mail.


    # Searching Messages


    Finding messages is a breeze in Linsphere. You simply type the keywords in the
    search box and all messages that match criteria will appear.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_253_0.png)


    +   1. Type the keyword(s) in the field provided. The keyword can be the name
    of the person who sent you the message or any words in the subject line.

    2. Press the Enter key. All messages that match the criteria will be displayed
    in the window as you type.

    3. Click the Clear button to clear the search and return to see all the messages
    in your inbox.


    # Sorting


    Another way to quickly find a message is to use the sort functionality. Across
    the top of the message window you''ll find different column headings. You can
    click on any of these headings to sort by column. For example, if you wanted to
    put all of your messages in alphabetical order you could click on the Sender heading.'
  merge: -1
