  md: '# Connecting to the Internet


    There''s a good likelihood that the bulk of the time that you spend on your computer
    will be used surfing the web, e-mailing, chatting or downloading files. To get
    access to the wonderful world of the Internet you will have to configure your
    connection. In some cases, this is simply a matter of plugging in your network
    cable and you are off and running. In other cases you''ll need to configure your
    computer for use with an Internet Service Provider (ISP). Whether you are using
    a dial-up modem, a cable modem or some other broadband connection, Linsp makes
    it relatively easy to connect to the Internet.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_184_0.png)


    There are also a variety of troubleshooting tools you can use should you come
    across some issues while trying to connect to the Internet. Once you are connected,
    you''ll be able to explore the features described in the following chapters including
    surfing the web, e-mailing, and chatting.


    In this chapter we''ll cover:


    +   - Setting up a dial-up connection

    - Configuring a broadband connection

    - Troubleshooting connection issues'
