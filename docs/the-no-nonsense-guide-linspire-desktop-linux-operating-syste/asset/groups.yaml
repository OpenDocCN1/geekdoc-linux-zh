    ## Navigating Files


    When you start the File Manager, you''ll be taken to the location called "Home."
    Think of the Home screen as your home base, a location you can return to at any
    time, no matter where you''ve navigated. The File Manager provides you with a
    variety of tools for getting around. If you''re wondering what some of the folders
