    ## Accessing Virtual Desktops


    To access your virtual desktops you will need to set up an applet (a mini program).
    Once this is set up you will have instant access to your desktops. The applet
    we are going to use is called the "Pager" option. This feature allows you to see
    a series of buttons, each button representing a virtual desktop.


    - 1. Right-click any empty area on the Taskbar. A menu will appear.

    - 2. Click Add | Applet. A list of different Applets will appear.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_68_0.png)


    - 3. Click Pager. Several of your virtual desktops that you set up earlier, will
    appear on the Taskbar.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_68_1.png)


    ## Chapter 3 Personalizing & Customizing Linspire


    - 4. Click on the desired desktop number to toggle between the different desktops.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_69_0.png)


    ## Sending Applications to Desktops


    Say for example you are watching a video on your computer, and you want to ensure
    that you can see video on any desktop that you switch to. You can pin down an
    application so that it appears on every desktop. Alternatively you can send an
    application to any other desktop.


    - 1. Click the triangle in the upper left corner of any open application.

    - 2. Click the To Desktop option.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_69_1.png)


    ## Adjusting the Date


    During the Startup wizard you were prompted to enter the current date to be displayed
    on your computer. You can adjust the date that was entered at any time using the
    system tray.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_70_0.png)


    - 1. Click the clock in the system tray. A calendar will appear from which you
    can specify the date.

    - 2. Click today''s date. It will be highlighted. You can also use the arrows
    at the top of the calendar to toggle between days and months.

    - 3. Click the clock again to hide the calendar. The date you entered will now
    take effect.


    ## Adjusting the System Volume


    You can adjust the master control for your computer''s volume from the system
    tray.


    - 1. Click the Volume icon in the system tray. A volume slider will appear.

    - 2. Click and drag the slider up or down to adjust the volume level.

    - 3. Click the Volume icon again to close the slider. The master volume will now
    be set.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_70_1.png)


    ## File Management


    The ability to manage your files is of paramount importance when working on your
    computer. Almost everything contained in your computer, whether it''s a document,
    a spreadsheet, a photo, a song or an e-mail, is stored as a file. Even the programs
    that run are made up of different files. In fact, most computers have literally
    thousands of different files.


    Keeping track of these files would be a complete nightmare if you didn''t have
    a proper filing system, and it just so happens that Linspire has an excellent
    one. Files are categorized into folders (sometimes called directories) and are
    placed into logical categories. If you have experience with other operating systems
    like Windows, you''ll find that the file structure in Linspire is a little different,
    but you''ll get the hang of it in no time.


    In this chapter we''ll cover:


    - Navigating your computer for files

    - Using the File Manager

    - Creating, editing and deleting files

    - Searching your computer


    ## The File Manager


    Think of the File Manager as a very large virtual filing cabinet. Your computer
    is made up of thousands of files, and the File Manager allows you to access those
    files in a logical fashion. Just like in a real filing cabinet, the files in your
    computer are contained in folders.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_73_0.png)


    - Click the File Manager icon from the Quick Launch bar. The File Manager will
    launch. Alternatively you can double-click the My Computer icon on the desktop
    to launch a simplified version of the File Manager. Although simplified, it still
    provides most of the functionality of the File Manager. All of the file management
    techniques found in this book can be done using either version of the File Manager.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_73_1.png)


    ## Viewing Files


    The File Manager gives you a graphical representation of all of the files on your
    computer. You can adjust this graphical representation to suit your particular
    preference. For example, you can view your files as different sized icons, choose
    to view your files in columns, or change the view structure. The type of view
    you select will depend on your goals and preferences.


    ## The File Manager


