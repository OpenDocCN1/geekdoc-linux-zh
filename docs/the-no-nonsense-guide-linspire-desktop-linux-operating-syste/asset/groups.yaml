    # 94 第 4 章 文件管理


    > 许多电子邮件程序会阻止包含使用 zip 方法归档的附件的消息。如果你要通过电子邮件发送文件，可能需要使用不同的压缩类型。


    ## 解压或扩展压缩文件


    “解压”（Unzipping）已成为扩展归档文件的流行术语，无论压缩包是否为 zip 文件，该词通用。扩展压缩包的实际过程非常简单。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_95_0.png)


    - 1. 按照上一节所述，打开“压缩和 Zip 工具”程序。

    - 2. 点击“打开”按钮。将出现“打开”对话框。

    - 3. 导航到包含你想扩展的压缩文件的文件夹。

    - 4. 点击你想要扩展的压缩包。

    - 5. 点击“打开”。压缩包将打开，你就可以查看其内容。


    ## 将文件刻录到 CD


    ![](img/3926ca1fb00de3af845faa03d2c351e5_96_0.png)


    - 6. 点击“提取”按钮。将打开一个对话框，你可以在其中指定要提取文件夹的位置。

    - 7. 输入你想提取文件夹的位置。或者，你也可以点击浏览字段右侧的蓝色文件夹，打开一个对话框，你可以在其中选择一个文件夹。

    - 8. 点击“确定”按钮。文件将提取到你指定的位置。你提取文件的文件夹也会打开。


    ## 将文件刻录到 CD


    随着 CD 刻录机和 CDR（可写 CD 光盘）的价格低廉，许多人正通过将文件刻录到 CD 来共享和存储文件。无论你是想和朋友分享你喜欢的照片，还是仅仅备份你的文件，Inspire
    都能让这一切变得轻而易举。实际上有几种方法可以刻录 CD，在这里我们将探索使用“CD & DVD 刻录程序”。


