  - '[PAGE 272]


    # Away Message


    There''s nothing worse than sending someone an instant message and not getting
    a response because that person is away from their computer. If you are logged
    on Instant Messenger but are unavailable for conversations, you should create
    an away message that notifies people that you are away from your computer. By
    default, if you are away from your computer for 15 minutes, the away message appears
    automatically.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_272_0.png)


    +   1. Click the Away Message button.

    A menu will appear.


    +   2. Click New Away Message. A dialog box will open you where you can create
    and save an away message.


    +   3. Type a name for your away message. This is how you will identify the message
    when selecting away messages.


    +   4. Type the desired message to let the people who you send a message know
    that you are away. If you like, you can add details like how they can contact
    you or when you''ll be back.


    +   5. Click the Save & Use button if you want to use that away message right
    now. Alternatively just click the Save button to use the away message later.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_272_1.png)'
  - '[PAGE 273]


