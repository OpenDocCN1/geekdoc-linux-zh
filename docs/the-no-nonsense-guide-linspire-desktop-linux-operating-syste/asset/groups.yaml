    ## 使用多媒体程序


    电脑在过去几年取得的进步令人惊叹。我记得小时候，当我们当地的博物馆开辟一个计算机展厅时，我们感到非常兴奋。你可以进入那个区域，玩玩 Pong 球（对于那些没听过它的人来说，这是一个非常简单的类网球游戏）。你还可以回答电脑提出的是或否问题，它会对你进行心理分析；或者你可以输入你的生日获取你的生物节律。


    回到今天，你可以下载并查看你喜欢的音乐视频、刻录 CD、处理照片、观看 DVD、玩互动游戏，并进行更多操作。


    如果一个操作系统不能让你访问喜爱的多媒体组件，那么它的价值将一文不值，而 Muse 在这方面也毫不逊色。开箱即用，你就能获得全系列的工具供你使用，以保持娱乐。


    在本章中，我们将涵盖：


    - 使用 Muse 播放音乐

    - 使用 Photo 处理照片

    - 从数码相机下载照片


    ![](img/3926ca1fb00de3af845faa03d2c351e5_164_0.png)


    ## 使用 Muse


    Muse 是一个强大的程序，允许你管理和播放喜爱的 mp3 和其他音频歌曲。你还可以假装自己是电台的节目总，因为你可以创建播放列表。提到广播，Muse 允许你收听一系列基于互联网的电台。Muse
    预装在你的电脑上，可以从“库”（Library）菜单访问。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_165_0.png)


    1. 点击“库”。将出现一个类别列表。

    2. 点击“音频与 MP3”（Audio & MP3）显示该类别下的程序。

    3. 点击 Muse。Muse 程序将启动。


    ## 添加歌曲


    在开始播放 mp3 文件之前，你需要将它们添加到 Muse 的媒体库中。你可以选择单个文件、整个文件夹或 CD。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_165_1.png)


    ## 添加单曲歌曲


    要逐个将歌曲添加到媒体库，你只需浏览电脑的硬盘即可。


    1. 点击“文件”（File） | “添加到媒体库...”（Add to Media Library...）。将出现一个对话框，你可以在其中选择文件。

    2. 导航到包含你想添加到媒体库的歌曲文件夹。

    3. 点击所需的歌曲。它将被高亮显示。

    4. 按住 Ctrl 键并点击文件夹中你想要添加的其他任何歌曲。

    5. 点击“确定”（OK）按钮。所选的文件将添加到你的媒体库中。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_166_0.png)


    ## 添加整个文件夹


    大多数人将所有的音乐文件保在一个或两个文件夹中，因此 Muse 通过允许你将文件夹中的所有歌曲添加到媒体库来帮助保持整洁。当你选择一个文件夹进行添加时，Muse
    会搜索该文件夹，选择音乐文件并将其导入媒体库中。


    1. 点击“文件”（File）。将出现文件菜单。

    2. 点击“将文件夹添加到媒体库...”（Add Folder to Media Library...）。将出现一个对话框，你可以在其中选择包含音乐文件的文件夹。

    3. 点击加号展开文件夹以查看其中的子文件夹。

    4. 点击包含你想添加的音乐文件的文件夹。该文件夹现在将高亮显示。

    5. 点击“确定”（OK）按钮。该文件夹中的任何音乐文件现在将添加到媒体库中。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_166_1.png)


    ## 第8章 使用多媒体程序


    ## 从 CD 导入歌曲


    从 CD 创建 mp3 文件的过程通常被称为“刻录”（ripping）。虽然可以在不先将 CD 转换为 mp3 的情况下在 Muse 中播放 CD，但除非将它们制成
    mp3，否则轨道无法添加到媒体库中。将 CD 轨道转换为 mp3 的过程只需要几次点击。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_167_1.png)


    1. 将你的 CD 插入电脑。片后 Muse 将加载所有轨道。

    2. 点击“导入”（Import）按钮。Muse 将将轨道转换为 mp3 并添加到媒体库。

    3. 完成后点击“确定”（OK）按钮，将 CD 从驱动器。


    ## 播放歌曲


    一旦将歌曲加载到媒体库，你就可以双击歌曲来播放它们。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_168_0.png)


    1. 双击你想播放的任何歌曲。歌曲将开始播放。任何时候点击“暂停”（Pause）按钮都可以暂停播放。

    2. 点击并拖动音量滑块来调整音量。向左拖动减少音量，向右拖动增加音量。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_168_1.png)


    > 按住 Ctrl 键并按右箭头播放列表中的下一首歌曲。按左箭头将播放上一首歌曲。


    ## 查找和整理音乐


    MP3 非常受欢迎，但为什么呢？它们廉价、随处可见且便于携带。无论你是将 CD 收藏转换为 mp3 还是购买文件，你的收藏都有可能增长到数百甚至上千首。如果不是因为
    Muse 许多组织功能，这可能会成为一个问题。mp3 的好处在于你可以关联艺术家、专辑、流派等信息，这使得搜索和整理变得简单。默认情况下，Muse 根据文件中提供的信息对音乐进行分类，以便你快速找到你需要的内容。


    ## 为音乐文件添加数据


    1. 在搜索框中输入查找的歌曲、艺术家或专辑名称。随着你的输入，所有匹配搜索词的结果将显示在窗口中。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_169_0.png)


    2. 删除搜索词返回完整列表。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_169_1.png)


    3. 点击艺术家。该艺术家的所有歌曲将出现在歌曲列表中。

    4. 点击专辑。列表中属于该专辑的所有歌曲将出现。

    5. 点击列表区域中的任何标题。列表将根据你选择的标题进行排序。例如，如果你点击“艺术家”标题，歌曲将按字母顺序重新排列。


    取决于你从哪里获得 mp3 文件，它们可能不包含与文件相关的的所有正确信息。Muse 允许向你的 mp3 文件添加各种信息，例如流派和专辑封面等。你文件上的信息越准确，查找和整理就越容易。


