    > 你可以通过点击查找文件对话框中的“内容”（Contents）或“属性”（Properties）选项卡来执行更详尽的搜索。你可以为搜索添加额外的标准。


    ## 使用对话框进行文件管理


    在几乎每个计算机应用程序中，你都需要导航计算机以选择、打开或保存文件。这通常通过一个提供文件访问的对话框来实现。虽然每个应用程序的对话框有所不同，但在许多情况下，对话框的工作方式与文件管理器几乎完全相同。每当你需要导航计算机硬盘器、选择并复制文件或文件夹、移动文件，甚至创建文件夹时，都可以使用对话框而不是访问文件管理器。由于不同的程序具有不同风格框，某些对话框将具有你可能不熟悉的按钮。在处理对话框中熟悉的按钮时，最好的主意是将鼠标指针悬停在按钮上。在大多数情况下，一两秒钟后，会出现一个工具提示，描述该按钮的功能。另一个好主意是右键点击对话框中的文件以查看可用选项。在下一页中，你将看到不同程序的对话框示例，它们提供了某些文件管理功能。


    ## 使用对话框进行文件管理


    ### 对话框示例一


    这是 OpenOffice 文字处理器的“打开”对话框。如你所见，有各种文件管理功能可用。


    - 新文件夹（New Folder）。让你创建一个新文件夹来存储文件。

    - 上级（Up）。此功能将允许你在文件层次结构中向上移动一级。

    - 右键菜单（Right-Click Menu）。在此对话框中对文件点击右键可以重命名或删除文件。

    - 排序（Sort）。你可以通过点击列标题对文件进行排序。


    ### 对话框示例二


    这是图像查看器的“打开”对话框。如你所见，有与文件管理器看起来完全不同的文件管理功能。


    - 新文件夹（New Folder）。让你创建一个新文件夹来存储文件。

    - 右键菜单（Right-Click Menu）。当你在此对话框中对文件点击右键时，可以对文件排序或查看其属性。

    - 导航按钮（Navigation Buttons）。此对话框有各种导航按钮，允许你快速跳转到特定区域。


    ## 理解 Linspire 文件夹


    当你启动文件管理器时，你会进入“主”（Home）窗口，其中包含四个非常自显易懂的图标。“我的桌面”（My Desktop）快捷方式带你进入系统上的一个文件夹，其中包含桌面的内容。“我的文档”（My
    Documents）快捷方式带你进入 Linspire 设置的用于存储文档的文件夹。“网络共享”（Network Shares）快捷方式带你进入一个允许你查看网络上其他计算机的窗口。最后是“系统”（System）文件夹。其他图标只是计算机内部文件夹的快捷方式，而“系统”文件夹实际上包含了你计算机上所有的文件夹。如果你没有使用过基于
    Linux 的系统，“系统”文件夹中的文件夹可能会让你感到有些困惑。以下是系统中包含的大多数文件夹用途简要介绍：


    - bin。用于二进制（binary），bin 文件夹包含运行关键程序和操作系统所需的二进制文件。

    - boot。此文件夹包含计算机首次启动时需要的文件。

    - dev。控制你的设备的文件在此处。

    - etc。此文件夹包含系统程序的关键配置文件。

    - home。这是每个用户在会话开始时登录的文件夹。

    - lib。此文件夹包含系统上程序使用的库。


    > 不要删除“系统”文件夹内直接找到任何文件夹。这些文件夹包含的许多文件对于你的程序和操作系统的运行至关重要。


    - mnt。此文件夹包含你挂载的硬件，如不同的软磁盘或 CD 驱动器。

    - opt。此文件夹包含附加程序的信息。

    - proc。此文件夹包含存储在计算机内存中的信息。

    - root。包含管理员账户的文件。


    ## 归档文件


    - sbin。此文件夹包含用于管理系统功能的二进制文件。

    - tmp。此文件夹包含临时文件。

    - usr。你安装的软件的应用程序在此目录中。

    - var。此文件夹包含在系统运行期间大小变化的文件。


    ## 归档文件


    当我十四岁时，我在麦当劳找了我的第一份工作，我的职责之一是将垃圾带到后门并通过压缩机处理。我总是对垃圾桶在压缩后垃圾桶里能装下这么多垃圾而感到惊奇。你的 Linspire
    计算机内置了压缩机。如果你发现硬盘空间不足，可以对一些文件进行归档。归档基本上是压缩文件，使它们不再占用那么多空间。在发送电子邮件时，归档特别有用。如果你有一个太大无法通过电子邮件发送的文件，可以将其归档以减小文件大小。在
    Linspire 中有一个名为“归档与 Zip 工具”（Archiving & Zip Tool）的程序，它不仅允许你归档文件，还可以扩展发送给你的归档文件。你可以从多种不同的压缩格式选择来归档文件。


    ## 第4章 文件管理


    - 1. 点击“启动程序”（Launch Programs）。将出现程序分类列表。

    - 2. 点击“实用程序”（Utilities）。将出现各种实用程序。

    - 3. 点击“归档与 Zip 工具”。归档与 Zip 程序将打开。

    - 4. 点击“新建”（New）按钮。归档对话框将打开。

    - 5. 导航到你想创建归档的位置。

    - 6. 在“位置”（Location）字段中为你的归档输入名称。

    - 7. 点击下拉菜单查看存档类型列表。

    - 8. 点击所需的方法。如果不确定选择哪种，选择 zip。

    - 9. 点击“保存”（Save）按钮。


    ## 归档文件


    - 10. 点击“添加文件”（Add File）或“添加文件夹”（Add Folder）按钮。将出现一个对话框，你可以在其中选择想要添加到归档的文件或文件夹。

    - 11. 导航到包含你想归档的文件的文件夹。

    - 12. 点击所需的文件。它将被高亮。你可以按住 Ctrl 键并点击该文件夹中任何你想添加到归档的其他文件。

    - 13. 点击“确定”（OK）。你选择的文件现在将添加到归档中。


    > 文件的缩减量取决于两个因素：你选择的压缩方法类型（zip, tar 等 等）以及原始文件类型。


    - 14. 重复步骤 8 - 12，向你的归档添加任何其他文件或文件夹。

    - 15. 点击“关闭”（Close）按钮关闭归档与 Zip 工具程序。归档中的所有文件现在都将进行压缩。


    '
