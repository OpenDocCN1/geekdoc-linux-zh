- md: '

    ## Working with Icons


    - 3. Click the Layout button if it is not already selected.

    - 4. Click one of the position boxes to change where on the screen the Panel will
    appear.

    - 5. Click and drag the slider to adjust the length of the Panel. As you drag,
    a preview of the look of the adjusted Panel will appear in the monitor icon in
    the dialog box.

    - 6. Click the size drop-down button and select a size for your Panel.

    - 7. Click OK, the dialog box will close and the changes will take effect.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_60_0.png)


    ## Working with Icons


    Icons represent a convenient way to launch your programs and gain access to your
    files. Icons can actually act as double-edged swords if you don''t manage them
    properly, because they can cause clutter, confusion and an outright mess.


    ## Arranging Desktop Icons


    I''m sure you''ve got people like this at your office, and perhaps you might even
    be one of these people. You go by their computer screens and see dozens of icons
    scattered on their desktops. If you''re the type of person who needs to access
    files and programs from your desktop, here''s a quick way to keep your screen
    looking organized.


    ## Chapter 3 Personalizing & Customizing Linspire


    - 1. Right-click any blank area of the desktop. A menu will appear.

    - 2. Select the Icons option and then select Sort Icons. A submenu will appear
    giving you more choices.

    - 3. Click the desired method for sorting your icons.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_61_0.png)


    > You can also manually sort or move your icons simply by clicking and dragging
    them to the desired location on your desktop.


    ## Removing an Icon


    The truth is that there are only a few programs that you use most of the time,
    so why have extra icons cluttering your screen? Even if you delete an icon you
    can always go back and recreate it.


    - 1. Right-click the icon you want to delete. A menu will appear.

    - 2. Click Delete. The icon will be removed from the desktop. If a Delete dialog
    box appears, click the Delete button to confirm the deletion.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_61_1.png)


    ## Changing an Icon’s Appearance


    If you don’t like the look of a particular icon, you can change its appearance.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_62_0.png)


    - 1. Right-click the icon you want to change. A menu will appear.

    - 2. Click Properties. A dialog box will open where you can adjust its appearance.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_62_1.png)


    - 3. Click the icon in the top left corner of the dialog box. The Select Icon
    dialog box will open.

    - 4. Click the radio button beside the desired source of icon you would like to
    see. A list of icons from that source will appear.

    - 5. Click the drop-down menu and select a category of icons to view.

    - 6. Click a desired icon. It will be selected.

    - 7. Click the OK button. The new icon will appear in the dialog box.

    - 8. Click the OK button. The new icon will appear on the desktop replacing the
    old.


    ## Chapter 3 Personalizing & Customizing Linspire


    ## Changing the Name of an Icon


    You can change the name of any of the icons on your desktop, with the exception
    of system icons like the Trash.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_63_0.png)


    - 1. Right-click on the icon that you would like to change. A menu will appear.

    - 2. Click Rename. The Properties dialog box will open.

    - 3. The name of the icon will now be highlighted and you can type a new name.

    - 4. Press the Enter key on your keyboard when you have finished renaming the
    icon.


    ## Creating an Icon


    We all know the benefits of using an icon, so it just makes sense that you should
    be able to create them for any application. You can do this by clicking and dragging
    from the Launch menu.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_63_1.png)


    - 1. Click Launch | Run Programs. The Launch menu will appear.

    - 2. Click on the category that contains the program that you would like to add
    to the desktop.

    - 3. Click and drag the desired program to the desktop.


    ## Working with Icons


    - 4. Release the mouse button and a menu will appear.

    - 5. Click Copy Here. An icon for the program you dragged will appear on the desktop.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_64_0.png)


    > Once you have created a desktop icon you can move it, sort it and change its
    appearance like any other icon.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_64_1.png)


    ## Adding Icons to the Quick Launch Bar


    Any program can be added to the Quick Launch bar so that it can be accessed at
    any time with just one click of the mouse button.


    - 1. Click the Taskbar Menu button. It is a little black arrow at the end of the
    Quick Launch bar. A menu will appear.

    - 2. Click Panel Menu | Add | Application Button. A list of different categories
    of buttons will appear.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_64_2.png)


    ## Chapter 3 Personalizing & Customizing Linspire


    - 3. Click Programs. A list of different types of programs will appear.

    - 4. Click the category that falls under the programs you want to add. A list
    of programs in that category will appear.

    - 5. Click the name of the program whose icon you''d like to add to the Quick
    Launch bar. The icon for the program you selected will now be a part of the Quick
    Launch bar.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_65_0.png)


    You can remove an icon from the Quick Launch bar by right-clicking on it and then
    selecting the Remove (button name) command.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_65_1.png)


    ## Repositioning Quick Launch Icons


    Icons on the Quick Launch bar can be repositioned to customize the way in which
    you work.


    - 1. Right-click the icon you''d like to move. A menu will appear.

    - 2. Move (button name). As you drag your pointer across the Quick Launch bar
    the number of desktops will increase with it.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_65_2.png)


    ## Virtual Desktops


    - 3. Click once, the icon will be in its location.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_66_0.png)


    > You can click and drag any icon from the desktop. When you release the mouse
    button a menu will appear.


    ## Virtual Desktops


    Would you believe if I told you that your Linspire computer can actually be different
    computers in one? Maybe that''s a bit of a stretch, Linspire does allow you to
    have up to twenty desktops. There are many reasons why virtual desktops can be
    advantageous to those who like dozens of icons on their desktops. Using virtual
    desktops, you could create one desktop for games, another for spreadsheets, and
    another for documents. You can also use virtual desktops when installing programs
    or to download large files off the Internet because you can work in one desktop
    while the other is busy. What do you do with your virtual desktops is up to you,
    just know that Linspire makes them easy to use and configure.


    ## Creating Virtual Desktops


    By default there is just one desktop set up for you when you first install Linspire.
    If you want to take full advantage of the virtual desktop features, you can set
    up a total of twenty desktops.


    ## Chapter 3 Personalizing & Customizing Linspire


    - 1. Right-click any blank area of the desktop. A menu will appear.

    - 2. Click Configure... The Configure - Desktop dialog box will open to let you
    configure different elements of your desktop.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_67_0.png)


    - 3. Click the Multiple Desktops icon.

    - 4. Click and drag the slider to the right. As you drag, the number of desktops
    will increase, up to a maximum of twenty.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_67_1.png)


    - 5. Type a name for any or all of the virtual desktops you''ve set up. To change
    a name, doubleclick the existing name and then begin typing. Although you don''t
    have to give your desktops a name, it makes it easier to manage them if you do.

    - 6. Click OK. Your virtual desktops will now be configured.


