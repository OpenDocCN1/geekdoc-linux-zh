    \n[content]\n## Personalizing & Customizing Linspire\n\nImagine what kind of a\
    \ world it would be if everyone had to drive the same car, wear the same clothes,\
    \ watch the same shows and eat the same meals. Our individuality is of extreme\
    \ importance to us, so it's understandable why Linspire offers so many customization\
    \ options when it comes working in the operating system.\n\nSince everyone works\
    \ a little differently, Linspire allows you to change the look and feel of your\
    \ computer to suit your individual tastes. From backgrounds to screen savers to\
    \ icons to screen size, Linspire gives you the ability to make the operating system\
    \ your own. Linspire can be personalized, but it offers a variety of unique tools\
    \ that allow you to control the way in which you work.\n\nIn this chapter we'll\
    \ cover:\n\n- Changing backgrounds\n- Selecting screen savers\n- Manipulating\
    \ icons\n- Working with virtual desktops\n\n![](img/3926ca1fb00de3af845faa03d2c351e5_52_0.png)\n\
    \n## Changing the Wallpaper\n\nThe easiest way to personalize the look of your\
    \ computer is to change the background image of the desktop. This background is\
    \ also known as the \"wallpaper.\" For the background, you can select from a variety\
    \ of images, create a customized background, use one of your favorite photos,\
    \ or even run a slide show.\n\n![](img/3926ca1fb00de3af845faa03d2c351e5_53_0.png)\n\
    \n1. Right-click any blank area of the desktop. A menu will appear.\n2. Click\
    \ Configure Desktop... The Configure - Desktop dialog box will open to let you\
    \ configure different elements of your desktop.\n\n![](img/3926ca1fb00de3af845faa03d2c351e5_53_1.png)\n\
    \n3. Click the Background icon if it is not already selected. This action will\
    \ bring you to the area where you can control the look of your desktop.\n4. Click\
    \ the arrow beside \"Setting for desktop\" and pick a specific virtual desktop\
    \ where you can apply any setting. Alternatively you can select All Des to apply\
    \ the same setting to each virtual desktop. You'll be learning more about virtual\
    \ desktops later in this chapter.\n\nYou must now decide what you would like:\
    \ a picture, a slide show or a colored background.\n\n## Changing the Wallpaper\
    \ 53\n\n### Selecting a Pre-Installed Wallpaper\n\nLinspire comes with a variety\
    \ of different images from which you can select. Before proceeding make sure you\
    \ have followed Steps 1 - 4 in the “Changing the Wallpaper” section earlier.\n\
    \n1. Click the radio button beside Picture: if it is not already selected. A dot\
    \ should be in the circle.\n2. Click the drop-down arrow. This action will display\
    \ a list of backgrounds that come with Linspire.\n3. Click the desired wallpaper.\
    \ A preview of the wallpaper will appear in the window.\n4. Click the OK button\
    \ to finalize the background changes.\n\n![](img/3926ca1fb00de3af845faa03d2c351e5_54_0.png)\n\
    \n## Selecting Your Own Photos for the Wallpaper\n\nNothing personalizes a desktop\
    \ more than a picture of your family, vacation, pets, or any other image from\
    \ your personal collection. Linspire makes it easy to add your own pictures to\
    \ the desktop. Before proceeding make sure you have followed Steps 1 - 4 in the\
    \ “Changing the Wallpaper” section.\n\n1. Click the Browse button. A dialog box\
    \ will open allowing you to navigate your computer for the desired image.\n\n\
    ![](img/3926ca1fb00de3af845faa03d2c351e5_54_1.png)\n\n2. Navigate to the directory\
    \ that contains the image you would like to use as your wallpaper. If you are\
    \ unclear on how to navigate through your folders, see the chapter entitled \"\
