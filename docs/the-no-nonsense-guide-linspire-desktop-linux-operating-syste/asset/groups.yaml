    ![](img/3926ca1fb00de3af845faa03d2c351e5_241_0.png)


    16. 点击“下一步”（Next）按钮。你现在将进入向导的最后一个界面以确认你的设置。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_241_1.png)


    17. 点击“启用垃圾邮件过滤器”（Enable Spam Filter）旁边的选择框。这将开启账户的垃圾邮件过滤器功能，防止你接收垃圾邮件。


    18. 点击“完成”（Finish）按钮，账户将创建。现在你需要输入密码。或者，你也可以点击“返回”（Back）按钮回到向导的任何步骤进行任何更改。


    ## 接收和查看电子邮件


    ![](img/3926ca1fb00de3af845faa03d2c351e5_242_0.png)


    19. 输入你的密码。它将以一系列星号的形式显示。


    20. 如果只有你可以使用这台电脑，点击“使用密码管理器”（Use Password Manager）旁边的选择框记住此密码。


    21. 点击“确定”（OK）按钮。电子邮件服务器上的现有消息将下载到你的账户。


    ## 接收和查看电子邮件


    默认情况下，电子邮件客户端每三分钟检查服务器一次电子邮件。当新消息到达时，它们将存放在“收件箱”（Inbox）文件夹供你查看。未读的新消息将以粗体文本显示。电子邮件窗口被分为预览窗口，你可以在其中立即阅读消息内容。你也可以选择在单独的窗口中查看消息。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_242_1.png)


    - 1. 点击某条消息。消息的内容将出现在预览窗口中。或者，你也可以双击消息在自己的独立窗口中打开它。读完消息后，你可以点击窗口右上角的“关闭”（Close）按钮关闭消息并返回收件箱。


    - 2. 滚动消息以阅读其内容。


    # 242

    # 第 12 章 电子邮件


    ## 接收附件


    电子邮件的主要益处之一是你不仅可以发送和接收消息，还可以发送和接收文件附件。当有人向你发送文件时，你可以选择打开它或将其保存到你的计算机。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_243_0.png)


    - 1. 点击带有附件的电子邮件消息。你可以通过消息主题旁的一个小回形针图标来判断它是否带有附件。


    - 2. 在附件上点击右键。将出现一个菜单。


    - 3. 点击“另存为...”（Save As...）。将出现一个对话框，你可以在其中指定想要在计算机上保存文件的位置。或者，你也可以点击“打开”（Open），这将用与该文件关联的程序打开文件。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_243_1.png)


    - 4. 导航到计算机上你想要保存文件的文件夹。


    - 5. 如果你需要，为文件起一个新名称。


    - 6. 点击“保存”（Save）按钮。附件将保存到你指定的文件夹中。


    ## 通讯录


    > 在任何情况下，都不要打开来自陌生人的附件。该附件可能是可能会损坏你计算机的病毒。


    虽然使用通讯录不是必不可少的的，但它确实会让事情变得方便得多。存储你的联系人意味着你在发送消息时可以立即访问他们。这在当今特别有用，因为现在有这么多免费的电子邮件服务，人们倾向于拥有多个电子邮件地址。使用通讯录，你可以添加单独条目或创建列表，这允许你只需输入列表名称即可向一组人发送电子邮件。


    - 1. 点击“窗口”（Window）。将出现“窗口”菜单。

    2. 点击“通讯录”（Address Book）。通讯录程序将启动。


