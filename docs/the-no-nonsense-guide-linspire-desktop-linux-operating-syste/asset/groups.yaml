    ## 网络电台


    有各种互联网电台，你可以直接从你的 Linspire 计算机收听。不论是轻松音乐、硬摇滚还是古典音乐，你都有可能找到一个符合你音乐口味的网络电台。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_172_1.png)


    - 1. 点击“电台”（Stations）按钮。将出现 Shoutcast 页面。


    - 2. 在搜索框中输入你正在的特定电台。你可以按电台、歌曲、流派或艺术家进行搜索。或者你可以浏览不同的电台直到找到你喜欢的。


    - 3. 点击“前往”（Go!）按钮。将出现符合你标准的电台列表。


    - 4. 点击你想听的电台旁边的“收听”（Tune In）。电台将开始通过你的电脑扬声器播放。


    ## 处理照片


    在过去的五几年里，数字摄影的普及和增长飞速发展。这就是你知道技术正在被大众接受的：我的母亲和我的岳母都拥有数字相机，并且都非常精通使用。Linspire 自带了一些处理照片的极佳工具。无论你只是想查看照片，还是想管理和编辑照片，Linspire
