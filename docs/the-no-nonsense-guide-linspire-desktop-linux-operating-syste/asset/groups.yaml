    it will be copied to the new location, rather than just moved.


    # Cutting, Copying, and Past


    Cutting, copying and pasting are the backbone of document editing in Word Processor.
    When you cut or copy objects, they are placed on a virtual clipboard that stores
    the items so that it can be pasted elsewhere. Cutting removes the object from
    the document, while copying makes a duplicate of your object on the clipboard.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_117_1.png)


    +   1. Create a selection using one of the selection methods.

    2. Click Edit | Copy. Alternatively you can select Edit | Cut to remove the selection
    and place it on the clipboard. You can use Ctrl+C to copy or Ctrl+X to paste.

    3. Click once at the location where you want to place the contents of the clipboard.
    Alternatively if you want the contents of the clipboard to replace a selection,
    you can create a new selection.'
