    transition of your slides. A preview of the transition effect you selected will
    appear in the window.


    +   12. Click Next to move to the next stage of the AutoPilot wizard.'
  - '[PAGE 150]


    # Building a Slide Show


    13. Type in the desired information about your presentation in the fields provided.


    14. Click Next to proceed to the pages section of the wizard.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_150_0.png)


    15. Click on the + beside any page to view its contents. These are the headings
    that you''ll see on the pages when you create the slide show.


    16. Click the check box beside any of the pages that you want to include. Keep
    in mind that these pages can be completely customized after the slide show has
    been created.


    17. Click Create. The slides show will be created based on the information that
    you have entered into the wizard.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_150_1.png)


    > A slide show can be played at any time by pressing the F9 key. While it is playing,
    pressing any key will advance to the next slide. Press the Esc key will exit your
    slide show.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_150_2.png)'
  - '[PAGE 151]


    # Creating Slides


    Whenever you add a slide you are given a choice as to its layout. You can select
    from a variety of layouts or choose a blank slide.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_151_0.png)


    +   1. Click the Insert... button from the Presentation toolbar. The Presentation
    toolbar is only present if you used the AutoPilot wizard to create your slide
    show. It can be opened from the View menu by selecting Toolbars | Presentation.

    2. Click on the desired layout. The layouts typically include a heading, a graphic,
    a table, a picture, a bulleted list, or some combination of these elements.

    3. Click OK. The slide you selected will be added to the slide.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_151_1.png)


    # Deleting a Slide


    +   4. Follow the on-screen instructions for adding the elements to the slide
    you created. Typically double-click in an area to add that element.

    1. Right-click on the name of the slide you would like to delete. A menu will
    appear.

    2. Click Delete Slide... A dialog box will open confirming that you would like
    to delete the slide. Click Yes when that dialog box appears.


    Removing a slide from your slide show is a piece of cake.'
  - '[PAGE 152]


    # Switching Slides


    # Switching Slides


    The quickest way to switch from one slide to another is to simply click on the
    name of the slide you would like to move to.


    +   1. Click on the name of the slide you would like to move to. You will now
    be taken to that slide.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_152_0.png)


    # Creating Graphical Elements


    Whether you are going to use the graphics you create on their own or as part of
    a slide show, Drawing gives you a variety of tools that you can use to create
    some amazing, visually appealing graphics.


    # Inserting Shapes


    Drawing provides you with tools to quickly add a variety of preset shapes to your
    slide show. If you''re not satisfied with the shapes that are included, you can
    always draw your own.'
  - '[PAGE 153]


    ![](img/3926ca1fb00de3af845faa03d2c351e5_153_0.png)


    1. Click and hold any of the three shape buttons. A menu of different shapes will
    appear.


    2. Click on the desired shape. You will now be able to draw that shape across
    the page.


    3. Click and drag across the page. As you drag a preview of the location of the
    shape will appear. When you release the mouse button the shape will appear on
    your page.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_153_1.png)


    # Connector Lines


    Common Drawings is used to illustrate an organizational chart. Most organizational
    charts are simply a matter of boxes that are connected with lines. Drawings allow
    you to create lines that dynamically link to objects. This means that if you move
    an object with dynamically linked line attached to it, the line will move along
    with the object. If you''d prefer to create regular lines and arrows, you can
    do so using the same method as for drawing shapes that was discussed in the last
    section.'
- md: "\n## Editing Graphical Elements\n\n![](img/3926ca1fb00de3af845faa03d2c351e5_154_0.png)\n\
    \n- 1. Click and hold the Connectors button to see a list of connection lines.\n\
    - 2. Click on the desired type of line.\n- 3. Click and drag from one object to\
    \ the other. The connector line will be created between the two objects. The objects\
    \ are now dynamically linked, meaning if you move either object, the line will\
    \ still connect them.\n\n![](img/3926ca1fb00de3af845faa03d2c351e5_154_1.png)\n\
    \n- 4. Click and drag one of the objects bound by a connector line to a different\
    \ part of the page. The objects will still be linked as the connector line adjusts.\n\
    \n## Editing Graphical Elements\n\nBasic things like copying, cutting and pasting\
    \ work the same way in Drawings as they do for other parts of the suite. You have\
    \ several unique options though when it comes to selecting, moving and resizing\
    \ graphical elements.\n\n## Selecting Objects\n\nAs with most features in Drawings\
    \ you have a variety of different options when it comes to making selections.\
    \ Making selections is the cornerstone to editing, as an object must be selected\
    \ before anything can be done to it.\n\n## Selecting Individual Objects\n\nTo\
    \ select individual objects you simply have to click on them.\n\n![](img/3926ca1fb00de3af845faa03d2c351e5_155_0.png)\n\
    \n- 1. Click once on an object. A series of little green squares will appear around\
    \ the object indicating that it is selected.\n- 2. Click on any blank area of\
    \ the slide to deselect the selection.\n\n> You can select multiple objects by\
    \ holding down the Ctrl key and clicking on them. If you press Ctrl+A on the keyboard,\
    \ all the objects on the screen will be selected.\n\n## Selecting Multiple Objects\n\
    \nThe advantage of selecting multiple objects is that you can save time by editing\
    \ objects at once. To select multiple objects, you have to create a marquee selection\
    \ around your objects.\n\n## Editing Graphical Elements\n\n## 155\n\n![](img/3926ca1fb00de3af845faa03d2c351e5_156_0.png)\n\
    \n- 1. Position your mouse pointer in the top left of the blank area to the objects\
    \ that you want to select.\n- 2. Click and drag diagonally. As you drag a marquee\
    \ will appear. The marquee must completely surround the objects that you would\
    \ like to select. When you release the mouse button all of the objects that were\
    \ completely surrounded by the marquee will be selected.\n- 3. Click once in any\
    \ blank area of the slide show to deselect your selection.\n\n## Moving Objects\n\
    \nMoving objects is simply a matter of selecting them and then dragging them to\
    \ the desired location.\n\n![](img/3926ca1fb00de3af845faa03d2c351e5_156_1.png)\n\
    \n- 1. Select an object or objects using one of the selection methods.\n- 2. Position\
    \ the mouse pointer over the object. The mouse pointer will change into a four-sided\
    \ arrow.\n- 3. Click and drag the object to the desired location. As you drag,\
    \ a transparent preview of the location of the objects will appear.\n- 4. Release\
    \ the mouse button. The objects will be moved.\n\n## Resizing Objects\n\nOnce\
    \ you have an object selected you can quickly change its size or reshape it.\n\
    \n![](img/3926ca1fb00de3af845faa03d2c351e5_157_0.png)\n\n- 1. Select an object\
    \ or objects using one of the selection methods.\n- 2. Position the mouse pointer\
    \ over one of the little squares that surround the object. The mouse pointer will\
    \ turn into a two-sided arrow.\n- 3. Click and drag in any direction. As you drag\
    \ a marquee will appear previewing the new size of the object. When you release\
    \ the mouse button the object will be resized.\n\n## Squishing and Stretching\
    \ Objects\n\nYou can squash or stretch an object by clicking and dragging on any\
    \ of its middle handles.\n\n![](img/3926ca1fb00de3af845faa03d2c351e5_157_1.png)\n\
    \n- 1. Select an object or objects using one of the selection methods.\n- 2. Position\
    \ the mouse pointer over one of the little middle squares (in other words, any\
    \ of the squares except for the corner ones).\n- 3. Click and drag inwards or\
    \ outwards. Dragging inwards will squish the object while dragging outwards will\
    \ stretch the object. As you drag a marquee will appear previewing the new shape\
    \ of the object. When you release the mouse button the object will be reshaped.\n\
    \n## Editing Graphical Elements\n\n## Colors, Fills and Outlines\n\nWhat's better\
    \ than a rectangle? A rectangle with some color! You can add colors, patterns\
    \ and change line fills for your objects.\n\n- Select the object or objects that\
    \ you would like to apply a fill to.\n- Click the Fill drop-down menu. A list\
    \ of types of fills will appear.\n- Click the desired fill your options include:\n\
    \  - Invisible. Removes the fill.\n  - Color. Creates a solid-colored fill.\n\
    \  - Gradient. Creates a multi-colored fill.\n  - Hatching. Creates a patterned\
    \ fill.\n  - Bitmap. Inserts a picture of a pattern.\n\n![](img/3926ca1fb00de3af845faa03d2c351e5_158_0.png)\n\
    \n- Click on the drop-down for the Areas Style/Filing. A variety of fills for\
    \ the type of fill you selected will appear.\n- Click the desired fill. It will\
    \ be applied to the selected object.\n\n![](img/3926ca1fb00de3af845faa03d2c351e5_158_1.png)\n\
    \n- 6. Click the drop-down menu and select an outline style for your object if\
    \ you don't want the outline to be a solid line.\n\n![](img/3926ca1fb00de3af845faa03d2c351e5_159_0.png)\n\
    \n- 7. Click the up or down arrows to adjust the width of the object's outline.\n\
    - 8. Click the drop-down menu to select a color for your outline.\n\n![](img/3926ca1fb00de3af845faa03d2c351e5_159_1.png)\n\
    \n- 9. Click on the desired color. It will be applied.\n- 10. Click on the shadow\
    \ button to give your object a shadow.\n\n> Holding down the Shift key while you\
    \ are creating or resizing an object will constrain the horizontal and vertical\
    \ motion. This is great if you want to create symmetrical circles or squares.\n\
    \n![](img/3926ca1fb00de3af845faa03d2c351e5_159_2.png)\n\n## Working with Text\n\
    \nMost of your slides will contain text in one form or the other. There are so\
    \ many things that can be done to text to make it stand out.\n\n## Adding Text\n\
    \nTo add text to a slide you must create a text box. A text box is a container\
    \ for your text that helps you organize how text appears on your slide. The Text\
    \ box tool can be found in the toolbar.\n\n![](img/3926ca1fb00de3af845faa03d2c351e5_160_0.png)\n\
    \n- 1. Click the Text tool. It will be highlighted.\n- 2. Click once at the approximate\
    \ location you would like the text to appear. A text box will be created and the\
    \ cursor will be flashing within.\n- 3. Begin typing. The text will appear in\
    \ the text box that you have created.\n\n## Formatting Text\n\nMost of the formatting\
    \ tools that can be applied to text can be found in the toolbar. To format text,\
    \ the text itself must be selected. This means you must first select the text\
    \ box and then click and drag across the text that you would like to format. Once\
    \ you have selected it it is easily formatted.\n\n## Chapter 7 Creating Graphics\
    \ & Slide Shows\n\n![](img/3926ca1fb00de3af845faa03d2c351e5_161_0.png)\n\n- 2.\
    \ Double-click on the text that you would like to format. The cursor will now\
    \ be in the text box.\n- 3. Click and drag the text that you would like to format.\
    \ It will be highlighted.\n- 4. Click on the desired formatting option on the\
    \ toolbar. This includes selecting font face, size, justification.\n\n## Font\
    \ Color\n\nUsing color can make certain elements of your slides stand out from\
    \ others. Keep in mind that certain colors may make your document difficult to\
    \ read.\n\n![](img/3926ca1fb00de3af845faa03d2c351e5_161_1.png)\n\n- Unlike applying\
    \ other formatting, don't double-click on the box to bring up the cursor.\n- 2.\
    \ Click Format | Character... The Character dialog box appears.\n\n## Fontwork\n\
    \n![](img/3926ca1fb00de3af845faa03d2c351e5_162_0.png)\n\n- 3. Click on the Font\
    \ Effects tab.\nYou'll now see a variety of font effects.\n- 4. Click the drop-down\
    \ menu to see a list of colors from which you can select.\n- 5. Click on the desired\
    \ color. It will be selected.\n- 6. Click OK. The color will change.\n\n## Fontwork\n\
    \nThe Fontwork feature in Drawings allows you to apply a variety of preset effects\
    \ to your text. It's really the easiest way to create some outstanding effects\
    \ to your text, with very little effort.\n\n![](img/3926ca1fb00de3af845faa03d2c351e5_162_1.png)\n\
    \n- 1. Click on the text that you would like to apply the effect to.\n- 2. Click\
    \ Format | Fontwork. The Fontwork dialog box appears.\n"
  mdcn: "\n\n## 编辑图形元素\n\n![](img/3926ca1fb00de3af845faa03d2c351e5_154_0.png)\n\n\
    - 1. 点击并按住“连接器（Connectors）”按钮以查看连接线列表。\n- 2. 点击所需的线条类型。\n- 3. 从一个对象点击并拖到另一个对象。两个对象之间将创建连接线。这两个对象现在是动态链接的，这意味着如果你移动任何一个对象，线条仍然会连接它们。\n\
    \n![](img/3926ca1fb00de3af845faa03d2c351e5_154_1.png)\n\n- 4. 点击并拖动其中一个被连接线绑定的对象到页面的不同部分。随着连接线的调整，对象之间仍将保持链接状态。\n\
    \n## 编辑图形元素\n\n在绘图（Drawings）中，复制、剪切和粘贴等基本操作与该套件的其他部分相同。但在选择、移动和缩放图形元素时，你将会有几个独特的选项。\n\
    \n## 选择对象\n\n与绘图中的大多数功能一样，在进行选择时，你有多种不同的选项。选择是编辑的基础，因为在对对象进行任何操作之前，必须先选中它。\n\n\
    ## 选择单个对象\n\n要选择单个对象，只需点击它们即可。\n\n![](img/3926ca1fb00de3af845faa03d2c351e5_155_0.png)\n\
    \n- 1. 点击对象一次。对象周围会出现一系列绿色小方块，表示该对象已被选中。\n- 2. 点击幻灯片的任何空白区域以取消选择。\n\n> 你可以通过按住\
    \ Ctrl 键并点击对象来选择多个对象。如果你在键盘上按下 Ctrl+A，屏幕上的所有对象将被选中。\n\n## 选择多个对象\n\n选择多个对象的优势是你可以通过同时编辑对象来节省时间。要选择多个对象，你需要在对象周围创建一个框形选择区域（marquee\
    \ selection）。\n\n## 编辑图形元素\n\n## 155\n\n![](img/3926ca1fb00de3af845faa03d2c351e5_156_0.png)\n\
    \n- 1. 将鼠标指针置于想要选择的对象空白区域的左上角。\n- 2. 点击并对角线拖动。当你拖动时，会出现一个框形。该框形必须完全包围你想选择的对象。当你松开鼠标键时，所有被框形完全包围的对象将被选中。\n\
    - 3. 点击幻灯片的任意空白区域一次以取消选择。\n\n## 移动对象\n\n移动对象只需选择它们，然后将其拖动到所需位置。\n\n![](img/3926ca1fb00de3af845faa03d2c351e5_156_1.png)\n\
    \n- 1. 使用一种选择方法选择一个或多个对象。\n- 2. 将鼠标指针置于对象上。鼠标指针将变为一个四向箭头。\n- 3. 点击并拖动对象到所需位置。在拖动过程中，将显示对象位置的透明预览。\n\
    - 4. 松开鼠标键。对象将移动到位。\n\n## 缩放对象\n\n一旦选中对象，你就可以快速更改其大小或重塑其形状。\n\n![](img/3926ca1fb00de3af845faa03d2c351e5_157_0.png)\n\
    \n- 1. 使用一种选择方法选择一个或多个对象。\n- 2. 将鼠标指针置于围绕对象的一个小方块上。鼠标指针将变为双向箭头。\n- 3. 向任何方向点击并拖动。在拖动时，会出现一个框形预览对象的新尺寸。当你松开鼠标键时，对象将完成缩放大小。\n\
    \n## 压缩和拉伸对象\n\n你可以通过点击并拖动对象的任何中间手柄来压缩或拉伸对象。\n\n![](img/3926ca1fb00de3af845faa03d2c351e5_157_1.png)\n\
    \n- 1. 使用一种选择方法选择一个或多个对象。\n- 2. 将鼠标指针置于中间的小方块之一（换句话说，除了角落以外的任何方块）。\n- 3. 向内或向外点击并拖动。向内拖动将压缩对象，向外拖动将拉伸对象。在拖动时，会出现一个框形预览对象的新形状。当你松开鼠标键时，对象将完成重塑。\n\
    \n## 编辑图形元素\n\n## 颜色、填充和轮廓\n\n有什么比矩形更好的呢？带颜色的矩形！你可以为你的对象添加颜色、图案并更改线条填充。\n\n- 选择你想要应用填充的单个或多个对象。\n\
    - 点击“填充（Fill）”下拉菜单。将出现填充类型的列表。\n- 点击所需的填充，你的选项包括：\n  - 不可见（Invisible）。移除填充。\n\
    \  - 颜色（Color）。创建实色填充。\n  - 渐变（Gradient）。创建多色填充。\n  - 阴影（Hatching）。创建图案填充。\n \
    \ - 位图（Bitmap）。插入图案图片作为填充。\n\n![](img/3926ca1fb00de3af845faa03d2c351e5_158_0.png)\n\
    \n- 点击“区域样式/填充（Areas Style/Filing）”下拉菜单。将出现你所选填充类型的各种填充方式。\n- 点击所需的填充。它将应用到选中的对象上。\n\
    \n![](img/3926ca1fb00de3af845faa03d2c351e5_158_1.png)\n\n- 6. 如果你不希望轮廓是实线，点击下拉菜单为你的对象选择轮廓样式。\n\
    \n![](img/3926ca1fb00de3af845faa03d2c351e5_159_0.png)\n\n- 7. 点击向上或向下箭头调整对象轮廓的宽度。\n\
    - 8. 点击下拉菜单为你的轮廓选择颜色。\n\n![](img/3926ca1fb00de3af845faa03d2c351e5_159_1.png)\n\
    \n- 9. 点击所需的颜色。它将被应用。\n- 10. 点击阴影按钮为你的对象添加阴影。\n\n> 在创建或缩放对象时按住 Shift 键将限制水平和垂直方向的运动。如果你想创建对称的圆形或正方形，这非常有用。\n\
    \n![](img/3926ca1fb00de3af845faa03d2c351e5_159_2.png)\n\n## 使用文本\n\n你的大多数幻灯片都会以某种形式包含文本。有很多方法可以对文本进行处理使其脱而出。\n\
    \n## 添加文本\n\n要在幻灯片中添加文本，你必须创建一个文本框。文本框是文本的容器，帮助你组织文本在幻灯片上的显示方式。文本框工具可以在工具栏中找到。\n\
    \n![](img/3926ca1fb00de3af845faa03d2c351e5_160_0.png)\n\n- 1. 点击文本工具。它将被高亮。\n\
    - 2. 在你希望文本出现的大致位置点击一次。将创建一个文本框，光标将在其中闪烁。\n- 3. 开始输入。文本将出现在你创建的文本框中。\n\n## 设置文本格式\n\
    \n大多数应用于文本的格式工具都可以在工具栏中找到。要对文本设置格式，必须选中文本本身。这意味着你必须先选择文本框，然后跨越拖动想要格式化的文本。一旦选中，就可以很容易地进行格式化。\n\
    \n## 第7章 创建图形与幻灯片\n\n![](img/3926ca1fb00de3af845faa03d2c351e5_161_0.png)\n\n-\
    \ 2. 双击你想要格式化的文本。光标现在将位于文本框中。\n- 3. 点击并拖动想要格式化的文本。它将被高亮。\n- 4. 点击工具栏上所需的格式化选项。这包括选择字体、大小、对齐方式。\n\
    \n## 字体颜色\n\n使用颜色可以使幻灯片的某些元素从其他元素中颖而出。请注意，某些颜色可能会让文档难以阅读。\n\n![](img/3926ca1fb00de3af845faa03d2c351e5_161_1.png)\n\
    \n- 与应用其他格式不同，不要双击框来调出光标。\n- 2. 点击“格式 | 字符（Format | Character...）”。字符对话框出现。\n\n\
    ## 艺术字（Fontwork）\n\n![](img/3926ca1fb00de3af845faa03d2c351e5_162_0.png)\n\n- 3.\
    \ 点击“字体效果（Font Effects）”选项卡。\n你现在可以看到各种字体效果。\n- 4. 点击下拉菜单查看可以从中选择的颜色列表。\n- 5.\
    \ 点击所需的颜色。它将被选中。\n- 6. 点击“确定”。颜色将改变。\n\n## 艺术字（Fontwork）\n\n绘图中的 Fontwork 功能允许你对文本应用各种预设效果。这真的是为你的文本创建一些出色效果的最简单方法，只需非常少的努力。\n\
    \n![](img/3926ca1fb00de3af845faa03d2c351e5_162_1.png)\n\n- 1. 点击想要应用效果的文本。\n-\
    \ 2. 点击“格式 | 艺术字（Format | Fontwork）”。艺术字对话框出现。\n\n"
