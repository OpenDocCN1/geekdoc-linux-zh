    # Click-N-Buy


    4. Click the Continue button if the credit card that you would like to use is
    listed. Otherwise, click the Add button to add a different credit card to use.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_212_0.png)


    5. Click the Place Your Order button. The product that you purchased will now
    be downloaded to your machine.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_212_1.png)


    > Linscape also gives you the option of purchasing services like virus protection
    and parental controls for web browsing. These features can be found by clicking
    the Services option.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_212_2.png)'
  - '[PAGE 213]


    # Autostarting Programs


    I love listening to the radio through Lsongs when I work on the computer. This
    program is so important to me that I have it start automatically when the Linspike
    operating system launches. You can do the same with any program.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_213_0.png)


    +   1. Click Launch. The Launch menu will appear.

    2. Click Settings. A submenu will appear.

    3. Click Additional Options. Another submenu will appear.

    4. Click Programs to Autostart. A window will appear with all of the programs
    that are currently set to autostart.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_213_1.png)


    +   5. Click Launch | Run Programs. A list of categories will appear.

    6. Click the category under which the program you would like to autostart falls.

    7. Click and drag the program that you would like to autostart to the Autostart
    window. When you release the mouse button, a menu will appear.

    8. Click Copy Here. A shortcut will appear in this window. This program will now
    start automatically whenever you start your computer.'
- md: '

    # A Word on Word and Other Windows Software


    A frequent question I get asked is, "Can I install Microsoft Word or other Windows
    applications on my Linux computer?" My typical response is, "Why would you want
    to?" Linux provides you with thousands of programs at less than the price of one
    component of the Microsoft Office suite. In addition, the OpenOffice suite that
    comes with Linux is highly compatible with Microsoft Office. Running Windows-based
    applications on any Linux operating system is like trying to fit a square peg
    into a round hole. It can be done but results vary and can make your system unstable.
    If you still want to install a Windows application even after my little sermon,
    then you can run a program called Wine. Wine is a windows emulator that fools
    a Windows-based program into thinking it''s running on Windows rather than Linux.
    Beware though, results may vary!


    ![](img/3926ca1fb00de3af845faa03d2c351e5_214_0.png)


    # Browsing the Internet


    To quote the immortal words of Homer Simpson: “They have the Internet on computers
    now?” Of course they do, and really, is there anything that the Internet can''t
    do? Finding recipes, to watching videos, sharing pictures, to auctioning goods,
    you name it, you can do and see anything about the Internet. Linux comes with
    its own built-in Web Browser designed specifically for you to surf the Internet
    with ease.


    You may be thinking to yourself, “What''s the big deal about surfing the Net?,
    you can just type in an address and away you go.” While that may be true, to optimize
    your time on the web, there are a variety of tools that can make your experience
    faster, more secure and certainly more convenient.


    In this chapter we''ll cover:


    - Navigating with the Web Browser

    - Accessing your favorite sites

    - Cleaning the history list

    - Customizing the Web Browser


    # Launching the Web Browser


    An icon for the Web Browser is located on the Quick Launch bar so you always have
    instant access to it.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_217_0.png)


    - 1. Click the Web Browser icon on the Quick Launch bar. The Web Browser will
    launch and you can begin surfing the Internet. Alternatively, you can double-click
    the Web Browser icon on the desktop or use the Launch menu to start the program.


    # Navigating the Web Browser


    The Web Browser provides you with a variety of different tools for getting around
    the Internet. From basic browsing to creating bookmarks, and link buttons, to
    tabbed browsing, navigating through the Internet has never been easier.


    # Basic Browsing


    Browsing the Internet is like looking through the pages of a book: you can move
    forward in your book, backwards, or you can jump to specific pages.


    > When entering a URL into the Web Browser, you can save yourself a few keystrokes
    as you don''t have to include the http:// before the address you''d like to visit.


    # Navigating the Web Browser


    ![](img/3926ca1fb00de3af845faa03d2c351e5_218_0.png)


    - 1. Double-click in the Location bar. The contents of the Location bar will be
    highlighted.

    - 2. Type the address of the URL you''d like to visit.

    - 3. Press Enter on your keyboard. You will be taken to the address specified.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_218_1.png)


    - 4. Click the Back button. You will be taken to the page you last visited. You
    can continue pressing the Back button to keep navigating back through your pages.

    - 5. Click the small gray arrow beside the Back button. A list of the previous
    pages you visited will be displayed.

    - 6. Click on the desired page. This will allow you to jump back to a specific
    page you visited without having to continuously click the Back button.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_218_2.png)


    > You can navigate back and forth through web pages by using your keyboard. Pressing
    the Alt key and the left arrow will move backwards and Alt and the right arrow
    moves forwards.


    # Chapter 11 Browsing the Internet


    ![](img/3926ca1fb00de3af845faa03d2c351e5_219_0.png)


    - 7. Click the Forward button. If you have pressed the Back button, the Forward
    button will be activated so you can move Forward to the page you had originally
    visited.

    - 8. Click the gray down arrow to see a full list of the pages you can move forward
    to.

    - 9. Click on the desired page. You will move forward to that page.


    # Navigating with the History List


    The Web Browser remembers the pages that you have visited, so if you want to quickly
    get back to a page you have visited use the history list. You can either view
    the entire history list, or you can begin typing a URL in the address bar and
    a list of sites that match the URL you are typing appear.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_219_1.png)


    - 1. Click the gray down arrow at the Location bar. A list of your previously
    visited will appear.

    - 2. Click on the desired page. You will be taken to that page.


    # Navigating the Web Browser


    ![](img/3926ca1fb00de3af845faa03d2c351e5_220_0.png)


    - 3. Type a URL in the address bar. As you type, web sites that match will appear.

    - 4. Click on the desired site you would like to visit.


    # Tabbed Browsing


    The problem with the more tabs you open, the more clutter becomes. The solution
    to this is tabbed browsing. Just like the bookmark in a novel, tabbed browsing
    in the Web Browser allows you to jump to specific areas.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_220_1.png)


    - 1. Click View | Show/Hide | Tabs.

    - 2. Click Tabs.

    - 3. Click Tabs.


    # Chapter 11 Browsing the Internet


    ![](img/3926ca1fb00de3af845faa03d2c351e5_221_0.png)


    - 4. Click the green + on the left side of the bar to create a new tab.

    - 5. Repeat Step 4 to create any tabs.

    - 6. Click on any tab to switch between tabs.

    - 7. Click the red "X" at the right side of the bar to close a tab.

    - 8. Repeat Steps 1-3 to close the bar.


    # Using Bookmarks


    There are just so many useful web sites out there that keeping track of them could
    be a daunting task. Rather than having to tax your brain''s memory, you can use
    bookmarks. Just like the bookmark on your nightstand, bookmarks in the Web Browser
    allow you to quickly get to areas.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_221_1.png)


    - 1. Navigate to the page for which you would like to create a bookmark.

    - 2. Click Bookmarks from the menu bar. The Bookmarks menu will appear.

    - 3. Click Bookmark Page. A bookmark will be created.


    # Navigating the Web Browser


    Another way to create a bookmark is to use the keyboard. When you are at the page
    that you would like to bookmark, simply press Ctrl and D on the keyboard.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_222_0.png)


    - 4. Click on Bookmarks in the menu bar. The Bookmarks menu will appear.

    - 5. Click on the desired bookmark. You will be taken to that page.


    # Using The Personal Toolbar


    The Personal toolbar goes one step further than a bookmark. Rather than just remembering
    the location of a web site, a link will appear on the Personal toolbar that you
    can click on to instantly jump to a specific site. By default the Personal toolbar
    should be open, if not, you can access it by following Step 1; otherwise proceed
    to Step 2. The Personal toolbar can be found under the Navigation toolbar.


    - 1. Click View | Show/Hide | Personal Toolbar.

    '
  mdcn: '


    # 关于 Word 和其他 Windows 软件


    我经常被问到的问题是：“我可以在 Linux 计算机上安装 Microsoft Word或其他 Windows 应用程序吗？”我的典型回答是：“为什么要这样做呢？”Linux
    为你提供了数千个程序，其价格低于 Microsoft Office 套件中的某一个组件。此外，Linux 自带的 OpenOffice 套件与 Microsoft
    Office 高度兼容。在任何 Linux 操作系统上运行基于 Windows 的应用程序就像是方凿入圆。这可以实现，但结果因而异，并可能导致你的系统不稳定。如果你在听了我的小建议后仍然想安装
    Windows 应用程序，你可以运行一个名为 Wine 的程序。Wine 是一个 Windows 模拟器，它可以欺骗 Windows 程序使其认为自己运行在
    Windows 而不是 Linux 上。但要注意，结果可能有所不同！


    ![](img/3926ca1fb00de3af845faa03d2c351e5_214_0.png)


    # 浏览互联网


    引用荷马·辛普森的经典名言：“他们现在电脑上有互联网了吗？”当然了，而且真的，互联网还有什么是做不到的吗？从寻找菜谱到观看视频，分享照片到拍卖商品，凡是你能到的，你都可以在互联网上做到并看到任何事情。Linux
    自带了 Web 浏览器，专门为你设计，让你能够轻松地浏览互联网。


    你可能在心里想：“上网有什么大不了的？只需要输入地址就可以出发了。”虽然这可能是事实，但为了优化你在网络上的时间，有各种工具可以让你的体验更快速、更安全，而且显然更方便。


    在本章中，我们将涵盖：


    - 使用 浏览器进行导航

    - 访问你喜爱的网站

    - 清理历史列表

    - 自定义 浏览器


    # 启动 Web 浏览器


    浏览器的图标位于快速启动栏上，这样你就可以随时访问它。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_217_0.png)


    - 1. 点击快速启动栏上的 浏览器图标。浏览器将启动，你就可以开始浏览互联网了。或者，你也可以双击桌面上的 浏览器图标，或使用启动菜单启动程序。


    # 浏览器导航


    Web 浏览器为你提供了各种不同的工具来在互联网上移动。从基础浏览到创建书签、链接按钮，再到标签页浏览，在互联网上导航从未如此简单。


    # 基础浏览


    浏览互联网就像翻阅书的页码：你可以向向前翻、向后翻，也可以跳转到特定页面。


    > 在 Web 浏览器中输入 URL 时，你可以节省几次击键操作，因为不需要在你想要访问的地址之前包含 http://。


    # 浏览器导航


    ![](img/3926ca1fb00de3af845faa03d2c351e5_218_0.png)


    - 1. 在位置栏中双击。位置栏的内容将被高亮。

    - 2. 输入你想要访问的 URL 地址。

    - 3. 按下键盘上的回车键（Enter）。你将被带到指定的地址。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_218_1.png)


    - 4. 点击后退按钮。你将被带回到上次访问的页面。你可以继续按后退按钮以不断向后导航页面。

    - 5. 点击后退按钮旁的小灰色箭头。将显示你之前访问过的页面列表。

    - 6. 点击所需的页面。这将允许你跳回访问过的特定页面，而无需不断点击后退按钮。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_218_2.png)


    > 你可以使用键盘在网页之间来回进行导航。按下 Alt 键和左箭头将向后移动，按下 Alt 和右箭头则将向前移动。


    # 第 11 章 浏览互联网


    ![](img/3926ca1fb00de3af845faa03d2c351e5_219_0.png)


    - 7. 点击前进按钮。如果你按过后退按钮，前进按钮将被激活，这样你就可以回到你最初访问的页面。

    - 8. 点击灰色向下箭头以查看你可以前进的页面完整列表。

    - 9. 点击所需的页面。你将前进到该页面。


    # 使用历史列表导航


    Web 浏览器会记住你访问过的页面，所以如果你想快速回到访问过的页面，请使用历史列表。你可以查看整个历史列表，也可以开始在地址栏中输入 URL，此时会出现与你输入的
    URL 匹配的网站列表。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_219_1.png)


    - 1. 点击位置栏处的灰色向下箭头。将出现你之前访问过的列表。

    - 2. 点击所需的页面。你将被带到该页面。


    # 浏览器导航


    ![](img/3926ca1fb00de3af845faa03d2c351e5_220_0.png)


    - 3. 在地址栏中输入 URL。当你输入时，与匹配的网站将会出现。

    - 4. 点击你想访问的所需网站。


    # 标签页浏览


    打开的标签页越多，界面就越混乱。解决此问题的办法是标签页浏览。就像小说中的书签一样，Web 浏览器中的标签页允许你跳转到特定区域。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_220_1.png)


    - 1. 点击 查看 | 显示/隐藏 | 标签页。

    - 2. 点击 标签页。

    - 3. 点击 标签页。


    # 第 11 章 浏览互联网


    ![](img/3926ca1fb00de3af845faa03d2c351e5_221_0.png)


    - 4. 点击栏左侧的绿色 + 号创建一个新标签页。

    - 5. 重复步骤 4 以创建任何标签页。

    - 6. 点击任何标签页以在标签页之间切换。

    - 7. 点击栏右侧的红色“X”关闭标签页。

    - 8. 重复步骤 1-3 关闭该栏。


    # 使用书签


    世界上有太多有用的网站了，跟踪它们可能是一项艰巨的任务。与其负担大脑的记忆，不如使用书签。就像你床头柜上的书签一样，Web 浏览器中的书签允许你快速到达某些区域。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_221_1.png)


    - 1. 导航到你想创建书签的页面。

    - 2. 点击菜单栏中的 书签。书签菜单将出现。

    - 3. 点击 书签页面。一个书签将被创建。


    # 浏览器导航


    创建书签的另一种方法是使用键盘。当你处于想要书签的页面时，只需在键盘上按下 Ctrl 和 D 键。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_222_0.png)


    - 4. 点击菜单栏中的 书签。书签菜单将出现。

    - 5. 点击所需的书签。你将被带到该页面。


    # 使用个人工具栏


    个人工具栏比书签更进一步一步。它不仅仅是记住网站的位置，个人工具栏上会出现一个链接，你可以点击它立即跳转到特定网站。默认情况下，个人工具栏应该是打开的，如果没有，你可以按照步骤
    1 访问它；否则继续步骤 2。个人工具栏可以在导航工具栏下找到。


    - 1. 点击 查看 | 显示/隐藏 | 个人工具栏。


    '
