  mdcn: '


    ## 从桌面访问网络


    每当你为网络上的共享文件夹创建挂载时，桌面上就会出现一个图标，该图标是通往该网络文件夹的快捷方式。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_283_0.png)


    - 1. 双击桌面上的“远程共享”图标。文件管理器将打开，显示网络上共享文件夹的内容。


    ## 从文件管理器访问网络


    当你启动文件管理器时，它会打开到“主目录”文件夹。在“主目录”文件夹中，你会找到一个指向网络的快捷方式。


    - 1. 点击快速启动栏上的文件管理器图标。文件管理器将打开。


    - 2. 点击“网络共享”快捷方式。你网络上的所有共享文件夹现在都会显示出来，无论它们属于哪个工作组。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_283_1.png)


    ## 访问网络


    网络上的文件和文件夹可以像电脑上的其他文件一样进行移动、复制、粘贴和打开。请参阅“文件管理”章节以回顾这些功能。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_284_0.png)


    ## 从对话框访问网络


    在几乎任何程序中打开或保存文件时，都会弹出一个对话框，你可以在其中导航并选择合适的文件夹。当你设置了网络后，可以直接从这些对话框访问网络上的共享文件夹。这样做的好处在于，当你想要从另一台电脑打开或保存文件时，不需要拿着磁盘在家里到处跑，而是可以直接从网络访问它们。


    - 从任何程序内部访问“打开”或“保存”对话框。在示例中，我们正在使用 Lphoto 的“打开”对话框。每个程序中的对话框略有不同，但大多数都提供访问网络的权限。


    - 点击“网络”选项。将出现网络上可用的文件夹列表。然后你可以像选择本地硬盘上的任何其他文件夹一样选择这些文件夹。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_284_1.png)


    某些程序中的对话框没有提供直接指向你网络的链接。在浏览时，你可以在 `/root/Network` 文件夹中找到网络中的所有电脑。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_284_2.png)


    ## 获取帮助


    需要帮助？你需要什么帮助？你手里有这本书了！信不信，这本书并没有涵盖关于 Linspire 的所有问题答案。坦率说，需要一系列百科全书才能涵盖从你的 Linspire
    计算机中可能出现的所有可能主题、配置和潜在情况。如果你在过程中遇到困难，不要担心，因为 Linspire 有多种方法帮助你扫除灰尘并重新回到正轨。


    你首先需要确定的是你是哪种类型的学习者。你是倾向于坐着放松，让别人向你解释，还是你喜欢直接钻进去并自己动手，或者你倾向于彻底阅读某个主题以理解它？无论你是哪种类型的学习者，Linspire
    都能为你提供解决方案。


    在本章中，我们将涵盖：


    - 向 Linspire 支持部门寻求帮助

    - 浏览常见问题解答 (FAQs)

    - 搜索知识库


    ![](img/3926ca1fb00de3af845faa03d2c351e5_286_0.png)


    ## 使用知识库


    尽管 Linspire 的技术对你来说可能很新，但请理解，在你之前有许多人开拓了道路，你可以从他们的经验中获益。Linspire 内部有一个知识库，里面满了对以前提问过的问题的回答。如果你遇到了问题，很有可能其他人在过去也遇到过这个问题，而答案就在知识库中。你可以快速在知识库中搜索与你的问题类似的问题，查看是否已经提供了答案。通常情况下，知识库是你寻求帮助的首选之地。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_287_0.png)


    - 1. 点击“帮助中心”按钮。将一个帮助选项菜单。

    2. 点击“在线支持”。网络浏览器将启动并打开到 Linspire 支持页面。

    3. 在字段中输入你问题的关键词。例如，如果你在使用调制解调器时遇到问题，你会在字段中输入“modem”。

    4. 点击“转”按钮。知识库将搜索包含“modem”词的问题。


    Linspire 知识库是一个基于网络的支持功能。这意味着你必须连接互联网才能利用此帮助功能。


    ## 使用社区论坛


    287


    ![](img/3926ca1fb00de3af845faa03d2c351e5_288_0.png)


    - 5. 滚动浏览论坛查看是否有与你的问题类似的论坛。

    - 6. 点击关键词。将显示包含该关键词的所有帖子。

    - 7. 点击帖子。你现在可以查看相关主题。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_288_1.png)


    - 8. 查看主题。如果你没有找到想要的答案，可以发布自己的帖子，或者直接联系 Linspire 支持。


    ## 社区论坛


    使用 Linux 操作系统的用户是一个紧密的群体。社区是一个用户可以分享技巧并提问的地方。


    ## 查看论坛


    289


    了解更多 Linspire 并找到问题答案的最佳方法是浏览论坛。论坛被划分为层级。在顶部你有分类。在分类中你有帖子。帖子是某人发布的评论或问题。讨论是人们做出的回复。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_289_0.png)


    - 1. 点击“帮助中心”按钮。将出现帮助选项菜单。

    2. 点击“社区论坛”。网络浏览器将启动并打开到 Linspire 社区页面。

    3. 滚动查看不同的分类直到找到你特别感兴趣的一个。

    4. 点击分类。将出现该分类下的各种帖子。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_289_1.png)


    - 5. 点击帖子。你现在可以阅读整个主题。


    ## 搜索论坛


    290


    ![](img/3926ca1fb00de3af845faa03d2c351e5_290_0.png)


    如果你在支持页面上遇到了没有找到答案的问题，下一个最佳查找地点是论坛。很有可能如果你遇到了问题，其他人也经历过，并且有一个涵盖该解决方案的讨论。在论坛中，你有能力搜索特定主题，而不是简单的浏览。


    - 点击“支持”选项卡。无论你在论坛的哪个位置，这都会带回到主支持页面。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_290_1.png)


    - 滚动直到看到“第 3 步，访问我们的社区论坛”部分。

    - 输入你试图寻求帮助的主题关键词。例如，如果你在调制解调器上遇到麻烦，请输入“modem”。

    - 点击“转”。所有包含“modem”词的帖子都将出现。然后你可以滚动查看并点击任何帖子来查看其主题。


    '
