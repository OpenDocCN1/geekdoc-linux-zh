  - '[PAGE 196]


    # Installing Programs


    The good folks at Linspire should moonlight as futurists. If you''re not familiar
    with the term, a futurist is simply someone who predicts the future. Several years
    ago they came up with an idea of how software programs should be distributed,
    and their method is now becoming increasingly popular amongst many software vendors.
    Imagine being able to walk into your favorite computer store, grab any program
    off the shelf, walk out of the store and not have to pay. That''s pretty much
    how it works with Linspire. Rather than having to go out and purchase programs,
    they have a subscription service that allows you to download as much software
    as you want while you are a member. Linspire''s version of this is called CNR
    and as a subscriber you get access to thousands of dollars worth of software included
    in your subscription fee.


    While CNR is by far the easiest and most recommended way to install programs on
    your Linspire computer, it is not the only method. Advanced users have the option
    of downloading programs off the web or installing from disk or CD.


    In this chapter we''ll cover:


    +   - Signing up for a CNR subscription

    - Navigating and using CNR

    - Uninstalling and updating programs'
- md: '

    ## Creating a CNR Subscription


    In order to take advantage of this revolutionary feature, you must have a subscription
    to the CNR Service. When you first started your Linspire computer, you may have
    seen a window open where you could sign up for a 15-day trial membership. Here
    will walk you through obtaining your trial membership so you can test CNR before
    you make the commitment to buy. I can almost guarantee that after only a few minutes
    on CNR, you''ll want to make the move to the yearly membership. The process of
    signing up is quite simple, and within minutes you''ll be downloading programs
    to your heart''s content. It actually takes two steps. The first is to register
    for a free account, which gives you access to security updates free of charge
    and the second is to acquire the subscription.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_197_0.png)


    - 1. Click on the Web Browser. The Web Browser will launch and by default it should
    open to a page where you can sign up for your CNR subscription. If the trial membership
    page doesn''t appear, type www.linspire.com/freetrial in the Location bar of the
    browser.

    - 2. Click on the TRY IT FREE button. You will be prompted to enter your billing
    information. Keep in mind if you do not cancel your subscription within the trial
    period, you will be automatically billed for the one year subscription.


    Because CNR is an ever-evolving web-based program, some of the screens may be
    updated over time. The following instructions were accurate at the time of publication.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_197_1.png)


    ## Creating a CNR Subscription


    ![](img/3926ca1fb00de3af845faa03d2c351e5_198_0.png)


    - 3. Type in your e-mail address. This will be your user name whenever accessing
    the Linspire web site.

    - 4. Click the radio button beside No, I need to create a new account. It''s free!

    - 5. Click the Go button. You will now have to create and confirm a password.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_198_1.png)


    - 6. Type in the requested information into the fields provided. Here you are
    just being asked to confirm your e-mail address, create a password and enter your
    name. When you type and confirm password it will appear as a series of stars so
    that nobody looking over your password will be able to steal your password.

    - 7. Click the Continue button. A screen will appear where you will be prompted
    to create an address.


    ## Chapter 10 Installing Programs


    - 8. Click the Continue button to proceed to the next screens where you''ll need
    to enter your address and billing information.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_199_0.png)


    - 9. Type in all of the requested information. You can press the Tab key on the
    keyboard to move from one field to the other, or you can simply click on the desired
    field.

    - 10. Click the create new address button. You will now be prompted to enter your
    credit card information.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_199_1.png)


    ## Creating a CNR Subscription


    - 11. Type in the requested information into the appropriate fields.

    - 12. Click the Add Payment Method button.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_200_0.png)


    - 13. Click on the Place Your Order button to finalize your trial membership order.
    A screen will appear thanking you for your order. You will now be able to login
    to CNR with the e-mail address and password you supplied.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_200_1.png)


    ## Launching CNR


    The CNR icon can be found on your desktop. Because you''ll be using it so often,
    it may be a good idea to add the icon to your Quick Launch bar. Instructions on
    doing this are located in the “Personalizing and Customizing Linspire” chapter
    of the book.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_201_0.png)


    - 1. Double-click on the CNR icon. CNR will launch.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_201_1.png)


    - 2. Click on the Login link on the left side of the screen. You will now need
    to enter the e-mail address and password supplied when registering.

    - 3. Type in your e-mail address and password in the fields provided.

    - 4. Click the radio button beside, "Yes, I have an account."

    - 5. Click the Go button. You are now able to browse CNR.


    ## Finding Programs


    ## Finding Programs


    There are a variety of ways to search in CNR. CNR has a web-style search that
    allows you to search by keywords. Some examples of keywords are photo, design,
    or web. If you''re looking for a specific category, you can just type the name
    of the category. For example, if you''re looking for a photo tool, you could type
    "photo" into the search box. If you''re looking for a specific vendor, you could
    type "Adobe." After you''ve conducted your search, all of the results will be
    displayed.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_202_0.png)


    - 1. Click on the Search link. You will now see general categories.

    - 2. Click on the category. The screen will change and you will see a list of
    subcategories.

    - 3. Click on the desired subcategory. All of the programs that fall under that
    category will be displayed.

    - 4. Use the scroll buttons to browse through the applications.


    ## Browsing by Category


    Think of an aisle as a group of software that falls under a specific purpose or
    task. For example, if you''re a graphic designer, you''re probably looking for
    programs that span various categories including photo editing, page layout, art
    and vector programs. Linscape has a wide range of aisles that contain programs
    designed for specific users or uses. Some examples of aisles include student aisles,
    developer aisles, kids aisles, web aisles and many more. Not only can you browse
    through the different aisles, but you can also create your own. The Linscape community
    becomes evident when working with aisles as every aisle you create can potentially
    be viewed by other members of the community.


    ## Finding Programs


    ![](img/3926ca1fb00de3af845faa03d2c351e5_204_0.png)


    1. Click on the Aisles link on the left side of the screen.

    2. Type a name for the type of aisle you are looking for. Some examples of search
    terms would be student, kids, design or web.

    3. Click the Go button. All of the results that match your search will be displayed.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_204_1.png)


    > Linspire gives you the ability to change the size of the text in CNR without
    adjusting your monitor''s resolution. Simply click the Text Zoom In or Out buttons
    on the toolbar.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_204_2.png)


    4. Click on the desired result to see all of the programs that fall within that
    aisle. A list of all the programs that fall within that aisle will appear. When
    you are ready to download and install a program, proceed to the section entitled
    "Installing Programs with CNR."

    '
  mdcn: '


    ## 创建 CNR 订阅


    为了利用这一革命性的功能，您必须拥有 CNR 服务订阅。当首次启动 Linspire 计算机时，您可能会看到弹出的窗口，您可以在那里注册 15 天试用会员。本指南将引导您完成获取试用会员的过程，以便您在决定购买之前测试
    CNR。我几乎可以保证，在 CNR 上只用了几分钟后，您就会想要升级为年会员。注册过程非常简单，几分钟内您就可以尽情下载程序了。实际上只需要两步：第一步是注册免费账户，这将为您免费访问安全更新；第二步是获取订阅。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_197_0.png)


    - 1. 点击浏览器。浏览器将启动，默认情况下它会打开一个允许您注册 CNR 订阅的页面。如果试用会员页面没有出现，请在浏览器的地址栏中输入 www.linspire.com/freetrial。

    - 2. 点击“免费试用”（TRY IT FREE）按钮。系统将提示您输入账单信息。请记住，如果您在试用期内未取消订阅，系统将自动按年扣费。


    由于 CNR 是一个不断演变的网络程序，某些屏幕可能会随着时间的而更新。以下说明在出版时是准确的。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_197_1.png)


    ## 创建 CNR 订阅


    ![](img/3926ca1fb00de3af845faa03d2c351e5_198_0.png)


    - 3. 输入您的电子邮件地址。这将是您访问 Linspire 网站时的用户名。

    - 4. 点击“否，需要创建一个新账户”（No, I need to create a new account）旁边的单选按钮。它是免费的！

    - 5. 点击“前往”（Go）按钮。您现在需要创建并确认密码。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_198_1.png)


    - 6. 在提供的字段中输入所需信息。在这里您仅被要求确认您的电子邮件地址、创建密码并输入姓名。当您输入并确认密码时，它将显示为一系列星号，这样任何查看您密码的人都无法窃取。

    - 7. 点击“继续”（Continue）按钮。将出现一个屏幕，提示您创建地址。


    ## 第 10 章 安装程序


    - 8. 点击“继续”（Continue）按钮进入下一个屏幕，在这些屏幕上您需要输入地址和账单信息。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_199_0.png)


    - 9. 输入所有所需信息。可以使用键盘上的 `Tab` 键从一个字段移动到另一个字段，或者直接点击所需的字段。

    - 10. 点击“创建新地址”（create new address）按钮。现在系统将提示您输入信用卡信息。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_199_1.png)


    ## 创建 CNR 订阅


    - 11. 在相应的字段中输入所需信息。

    - 12. 点击“添加付款方式”（Add Payment Method）按钮。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_200_0.png)


    - 13. 点击“提交订单”（Place Your Order）按钮完成您的试用会员订单。屏幕将显示感谢您订单的页面。您现在可以使用提供的电子邮件地址和密码登录
    CNR。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_200_1.png)


    ## 启动 CNR


    可以在您的桌面上找到 CNR 图标。由于您会经常使用它，将图标添加到您的快速启动栏可能是一个好主意。有关如何此此的操作请见书籍中的“个性化和自定义 Linspire”章节。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_201_0.png)


    - 1. 双击 CNR 图标。CNR 将启动。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_201_1.png)


    - 2. 点击屏幕左侧的“登录”（Login）链接。您现在需要输入注册时提供的电子邮件地址和密码。

    - 3. 在提供的字段中输入您的电子邮件地址和密码。

    - 4. 点击“是，我有账户”（Yes, I have an account）旁边的单选按钮。

    - 5. 点击“前往”（Go）按钮。您现在可以浏览 CNR 了。


    ## 查找程序


    ## 查找程序


    在 CNR 中有多种搜索方法。CNR 具有网络风格的搜索，允许您通过关键词进行搜索。关键词的示例包括照片、设计或网络。如果您想查找特定类别，可以直接输入类别名称。例如，如果您正在寻找照片工具，可以在搜索框中输入“photo”。如果您想查找特定供应商，可以输入“Adobe”。在进行搜索后，将显示所有结果。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_202_0.png)


    - 1. 点击“搜索”（Search）链接。您现在将看到常规分类。

    - 2. 点击分类。屏幕将切换，您将看到子类别列表。

    - 3. 点击所需的子类别。该类别下的所有程序将显示。

    - 4. 使用滚动按钮浏览应用程序。


    ## 按类别浏览


    将通道（isle）视为特定用途或任务的软件组。例如，如果您是一名平面设计师，您可能在寻找涵盖照片编辑、排版、艺术和矢量程序的程序。Linscape 拥有大量针对特定用户或用途设计的通道。通道的示例包括学生通道、开发者通道、儿童通道、网络通道等。您不仅可以浏览不同的通道，还可以创建自己的。在操作通道时，社区变得非常明显，因为您创建的每个通道都可能被社区成员查看。


    ## 查找程序


    ![](img/3926ca1fb00de3af845faa03d2c351e5_204_0.png)


    1. 点击屏幕左侧的“通道”（Aisles）链接。

    2. 输入您要查找的通道类型名称。搜索词的示例可以是学生、儿童、设计或网络。

    3. 点击“前往”（Go）按钮。将显示所有匹配搜索的结果。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_204_1.png)


    > Linspire 让您能够在不调整显示器分辨率的情况下更改 CNR 中文本的大小。只需点击工具栏上的“放大文本”或“缩小文本”按钮。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_204_2.png)


    4. 点击所需的结果以查看该通道下的所有程序。将显示该通道内的所有程序列表。当您准备好下载并安装程序时，请阅读“使用 CNR 安装程序”章节。


    '
