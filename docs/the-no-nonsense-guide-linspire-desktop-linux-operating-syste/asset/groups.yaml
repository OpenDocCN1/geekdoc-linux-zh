    +   3. Click on the History option. It will be highlighted and you will see options
    for clearing your history of sites visited.


    +   4. Click the Clear History button to clear the history of the web pages you
    have visited.


    +   5. Click the Clear Location Bar button to clear the history of sites you''ve
    visited from the Location bar.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_234_1.png)


    +   6. Click the triangle beside Advanced to expand the options.


    +   7. Click on the Cache option. A variety of cache configuration settings will
    appear.


    +   8. Click the Clear Cache button. All the files in the cache will be deleted.


    +   9. Click the OK button to clear the Preferences dialog box.


    # Managing Popups


    There''s nothing more annoying when you are peacefully browsing the Internet,
    then to have a popup ad for the miracle medical cure of the week appear. Pop ads
    are the Internet''s equivalent to used car salesmen: annoying and inconsiderate.
    Linspire''s Web Browser is leading the war on pop ads as it automatically blocks
    them. There are, occasions where legitimate site uses popups. You can let the
    Web Browser know from which sites it can accept popups.'
