  mdcn: '


    操作打开的应用程序


    ## 最小化和恢复窗口


    最小化程序仅意味着你暂时将其移出视野，以便在另一个程序中工作。当你最小化一个程序窗口时，程序本身不会受到最小化的影响。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_42_0.png)


    - 1. 点击最小化按钮。窗口将不再出现在屏幕上，但在任务栏中仍然可以看到它。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_42_1.png)


    - 2. 点击任务栏上的一个图标。程序将恢复到之前的状态。


    ## 最大化和恢复窗口


    最大化命令允许你调整窗口大小，使其占据桌面上所有可用的空间。


    - 1. 点击最大化按钮。此此操作将使程序在你的屏幕上显示为最大尺寸。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_43_0.png)


    > 快速最小化、最大化或恢复窗口的另一种方法是右键点击任务栏上的程序图标。将出现菜单，你可以在其中选择所需的操作。


    - 2. 点击恢复按钮。窗口将恢复到之前的尺寸。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_43_1.png)


    ## 操作打开的应用程序


    ## 移动窗口


    你可以轻松更改窗口的位置并将其重新定位到屏幕上的任何地方。除了最大化的窗口外，任何窗口都可以执行此操作。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_44_0.png)


    - 1. 从标题标题栏点击并拖动窗口到所需的位置。随着你的拖动，窗口会移动。


    - 2. 松开鼠标按钮。此操作将允许你重新定位窗口。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_44_1.png)


    ## 切换程序


    任务栏将包含代表每个当前正在运行程序的矩形按钮。你可以使用任务栏在程序之间快速移动。


    ## 第 2 章 熟悉 Linspire


    - 1. 点击任务栏中代表程序的图标。此操作将把选定的程序带到你正在运行的所有程序的前面。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_45_0.png)


    > 你可以按住 Alt 键然后按 Tab 键，在打开的程序之间切换。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_45_1.png)


    - 2. 点击任务栏中的另一个程序图标。你刚刚选择的程序现在将出现在你之前选择的程序前面。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_45_2.png)


    ## 操作打开的应用程序


    ## 清理窗口


    想象一下点击一下按钮就能清理并整理你的整个房子。虽然这种技术在未来几年内可能不会进入家庭，但在 Linspire 中是可以实现的。你可以在几秒钟内清理并整理打开的窗口。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_46_0.png)


    ## 层叠窗口


    层叠窗口会将窗口相互重叠，但打开的应用程序的标题栏将按层叠顺序可见。


    - 右键点击桌面的任何空白区域。将出现一个菜单。

    - 点击 窗口 (Windows) | 层叠窗口 (Cascade Windows)。你打开的窗口现在将重叠，并且所有的标题栏都暴露。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_46_1.png)


    ## 整理窗口


    此功能将使打开的窗口均匀分布。


    - 右键点击桌面的任何空白区域。将出现一个菜单。

    - 点击 窗口 (Windows) | 整理窗口 (Unclutter Windows)。你打开的窗口现在将分布在桌面的可用空间上。


    ## 始终置顶


    有时你可能希望程序窗口保持在所有窗口之上，无论你当前是否正在该程序中工作。这的一个很好的例子是在电脑上看视频。无论你在哪个程序中工作，你都希望视频保持在上方，这样就不会被遮挡。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_47_0.png)


    - 1. 右键点击任务栏中代表程序的图标。将出现一个菜单。

    - 2. 点击 始终置顶 (Always on Top)。这将程序窗口带到所有其他窗口之前。

    - 3. 重复步骤 1 和 2 以移除此功能。


    ## 使用菜单


    在大多数程序的顶部，你会找到一个菜单。


    ## 使用鼠标选择项


    当你位于程序顶部，你会发现一个提供命令的菜单。可以通过多种方式访问命令。


    ## 打开的应用程序


    无论你在程序中工作，你都可以点击菜单来执行命令。


    - 1. 点击文件 (File) 菜单。该菜单将打开。

    - 2. 点击你想要执行的命令。该命令将执行。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_48_0.png)


    无论你在程序中工作，你都可以点击菜单来执行命令。


    ## 使用键盘选择项


    选择菜单项的另一种方法是使用你的键盘。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_48_1.png)


    ## 第 2 章 熟悉 Linspire


    - 1. 按住 Alt 键然后按 Tab 键在打开的程序之间切换。

    - 2. 按下向下箭头键，直到到达你想要执行的命令。

    - 3. 按回车键。该命令将执行。


    ## 滚动


    当窗口中的信息比可以显示的内容多时，会出现滚动条。滚动条允许你在水平或垂直方向移动窗口，以便看到所有内容。


    ## 识别程序选择项


    - 2. 点击并拖动滚动框。随着你的拖动，屏幕内容将移动。

    - 3. 点击滚动条上的任何位置。窗口将跳转到你点击的位置。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_50_0.png)


    - 1. 点击滚动箭头移动窗口内容。每次点击箭头，内容都会向上或向下移动一个单位。


    ## 终止程序


    这种情况在每个人身上都会发生。由于某些原因，程序死住了，我们无法继续在那里工作。如果我们使用任何其他操作系统，我们可能需要重启计算机。Linspire 允许我们在不重启系统的情况下终止应用程序。


    - 1. 点击启动 (Launch) 按钮。启动菜单将出现。

    - 2. 点击终止应用程序 (Terminate Application)。将终止冻结应用程序的对话框，光标将发生变化。

    - 点击冻结应用程序的任何位置。冻结应用程序将终止。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_51_1.png)


    '
