  - '[PAGE 39]


    # Launching Programs from Icons


    Earlier in this chapter we discussed the different icons that appear on your desktop
    by default. These icons provide you with access to different applications on your
    computer.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_39_0.png)


    +   1. Double-click the Web Browser icon. This action will launch the Web Browser
    application that allows you to surf the Internet.

    2. Click the "X" in the top right corner of an application to close it. This "X"
    is also referred to as the Close button.


    > You may be asking yourself, “Why is there an icon flashing beside my cursor
    when I launch an application?” This flashing indicates that your computer is busy
    performing the requested task.


    # Launching Programs from the Launch Button


    The Launch button gives you complete access to most of the applications on your
    computer. From the Launch button, you can select programs that are categorized
    based on their function. Although the Launch button gives you access to a variety
    of other tools, for now we will examine the steps to launch a program from this
    handy button.'
  - '[PAGE 40]


    # Launching Programs


    +   1. Click the Launch button. The Launch menu will appear with a variety of
    operations or programs from which to choose.


    +   2. Click or just hover your mouse pointer over Run Programs. A submenu will
    appear with categories of the different programs that you have on your computer.


    +   3. Click Games. This feature will show you all of the programs that you have
    in this category.


    +   4. Click Tron. This action will launch the Tron program. You can then close
    it by clicking the Close button.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_40_0.png)


    # Launching Applications with the Quick Launch Bar


    As we learned earlier, using the Quick Launch bar to launch programs has several
    advantages over using desktop icons. The first benefit is that it only requires
    one click with the mouse button to launch a program. The other advantage is that
    no matter how many programs you have running, you will still be able to view the
    Quick Launch bar.


    +   1. Click the File Manager icon in the Quick Launch bar. The File Manager application
    will open.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_40_1.png)'
  - '[PAGE 41]


    # Working with Open Applications


    It''s very rare nowadays to be using a computer and only be running one program
    at a time. In today''s fast-paced world, everyone is expected to multitask to
    get things done quicker, so it''s quite possible that you will have multiple programs
    launched at any time. The danger this poses is that you could find yourself in
    a world of mess and clutter if you don''t know how to properly manage your open
    programs. The good news is that Linsp provides you with multiple ways to manipulate
    the appearance and location of your open applications.


    # Resizing a Window


    Resizing a program window in Linspire is as simple as clicking and dragging.


    +   1. Position your mouse pointer over the edge of a window. The cursor will
    change into a double-sided arrow when you are over the correct spot.

    2. Click and drag inward to reduce the size of the window.

    3. Click and drag outward to increase the size of the window.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_41_0.png)


    > By clicking and dragging at the corner of a window, you can change the width
    and height equally at the same time.'
- md: '

    Working with Open Applications


    ## Minimizing and Restoring a Window


    Minimizing a program simply means that you are putting it out of the way temporarily
    so that you can work in another program. When you minimize a program window, the
    program itself won''t be affected by being minimized.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_42_0.png)


    - 1. Click the Minimize button. The window will no longer appear on the screen,
    but it can still be seen in the Taskbar.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_42_1.png)


    - 2. Click an icon in the Taskbar. The program will restore to its previous state.


    ## Maximizing and Restoring a Window


    The Maximize command allows you to resize a window so that it takes up all of
    the possible space on the desktop.


    - 1. Click the Maximize button. This action will make the program as big as it
    can be on your screen.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_43_0.png)


    > Another way to quickly minimize, maximize or restore a window is to right-click
    on the icon of the program in the Taskbar. A menu will appear where you can choose
    from the desired action.


    - 2. Click the Restore button. The window will return to its previous size.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_43_1.png)


    ## Working with Open Applications


    ## Moving a Window


    You can easily change the location of a window and reposition it anywhere on your
    screen. This action can be done with any window except one that has been maximized.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_44_0.png)


    - 1. Click and drag a window from its Title bar to the desired location. As you
    drag, the window will move.


    - 2. Release the mouse button. This action will let you reposition your window.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_44_1.png)


    ## Switching Between Programs


    The Taskbar will contain a rectangular button representing each program that is
    currently running. You can use the Taskbar to quickly move between programs.


    ## Chapter 2 Getting Acquainted with Linspire


    - 1. Click the icon representing a program in the Taskbar. This action will bring
    the selected program up in front of all other programs that you are running.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_45_0.png)


    > You can hold down the Alt key and then press the Tab key to toggle between open
    programs.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_45_1.png)


    - 2. Click another program icon in the Taskbar. The program that you have just
    selected will now appear in front of your previously selected program.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_45_2.png)


    ## Working with Open Applications


    ## Cleaning Windows


    Imagine being able to clean and organize your entire house with one click of a
    button. While that technology may not be in homes for years to come, it is available
    in Linspire. You can clean up and organize your open windows in seconds.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_46_0.png)


    ## Cascading Windows


    Cascading your windows will organize them so they overlap one another, but the
    Title bar of open application will be visible in cascading order.


    - Right-click in any blank area of your desktop. A menu will appear.

    - Click Windows | Cascade Windows. Your open windows will now overlap with all
    of their Title bars exposed.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_46_1.png)


    ## Uncluttering Windows


    This feature will evenly space out of your open windows.


    - Right-click in any blank area of your desktop. A menu will appear.

    - Click Windows | Unclutter Windows. Your open windows will now be spaced out
    the available room on the desktop.


    ## Always On Top


    Sometimes you may want a program window to remain on top of all other windows
    regardless of whether or not you are currently working in that program. A good
    example of this would be when watching a video on the computer. Regardless of
    which program you are working in, you''d want the video to remain on top so that
    it is unobstructed.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_47_0.png)


    - 1. Right-click the icon representing a program in the Taskbar. A menu will appear.

    - 2. Click Always on Top. This will bring the program window in front of all others.

    - 3. Repeat Steps 1 and 2 to remove this feature.


    ## Working with Menus


    Across the top of most programs you will find a menu bar that gives you access
    to the different commands within a program. The commands can be accessed in a
    variety of ways.


    ## Selecting Menu Items with the Mouse


    Selecting a menu command is simply a matter of clicking on a menu item and then
    selecting a subsequent command.


    ## Working with Open Applications


    - 1. Click File on the menu bar in an open application. The File menu will open,
    displaying commands that fall under that category.

    - 2. Click the desired command. That command will now be executed.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_48_0.png)


    Depending on the program you are using, you may be able to bring up a menu of
    commands by right-clicking your mouse in a blank area of the screen.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_48_1.png)


    ## Selecting Menu Items with a Keyboard


    Another approach for selecting menu items is to use your keyboard. This can save
    you the hassle of having to switch between the keyboard and mouse if you are already
    typing within a program.


    - 1. Press the Alt key on your keyboard. The first category in the menu bar is
    highlighted. You can now press the right or left arrow keys on your keyboard to
    navigate across the menu bar.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_48_2.png)


    ## Chapter 2 Getting Acquainted with Linspire


    - 2. Press the down arrow. This will expand the currently selected menu.

    - 3. Press the down arrow again until you''ve reached the desired command that
    you would like to execute.

    - 4. Press the Enter key. The command you selected will be executed.


    ## Identifying Menu Items


    When you opened an item on the menu bar, you may have noticed that some of the
    items have markings beside them or that they seem to be grayed out. Each of these
    symbols has a different meaning.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_49_1)


    - Three Dots: Indicates that a dialog box will open.

    - Triangle: Indicates there is a submenu. By clicking or just hovering over this
    command with the mouse, you will be able to view the submenu.

    - Keystrokes: A series of words and letters beside a menu command indicates the
    keystrokes necessary to execute it. For example, if it says Control+F8 beside
    a menu command, pressing the Ctrl key on your keyboard and the F8 key at the same
    time will execute that command.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_50_1)


    - Dimmed Command: Indicates that the command is unavailable.

    - Check Mark: Indicates that the option is selected. Unlike a check mark, a dot
    indicates that only one selection can be chosen at any given time.


    ## Scrolling


    When there is more information within a window than can be displayed, scroll bars
    will appear. Scroll bars allow you to move through a window either horizontally
    or vertically so that you can see all of its contents.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_50_0)


    - 1. Click a scroll arrow to move the contents of the window up or down. Each
    time you click an arrow, the contents will move up or down by one increment.

    - 2. Click and drag on the scroll box. The contents of the screen will move as
    you are dragging.

    - 3. Click anywhere along the scroll bar. The window will jump to a location where
    you clicked and its current location.


    ## Terminating Programs


    It has happened to all of us at time or another. For some reason a program freezes
    and we are unable to continue working in it. If we were using any other operating
    system we would probably have to restart our computer. Linspire allows us to terminate
    an application without having to reboot the system.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_51_1.png)


    - 1. Click the Launch button. The Launch menu will appear.

    - 2. Click Terminate Application. The Terminate a Frozen Application dialog box
    will appear, and your cursor will change.

    - 3. Click anywhere on the frozen application. The frozen application will terminate.

