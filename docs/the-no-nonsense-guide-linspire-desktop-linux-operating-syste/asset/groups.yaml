    text box will be created and the cursor will be flashing within.

    3. Begin typing. The text will appear in the text box that you have created.


    # Formatting Text


    Most of the formatting tools that can be applied to text can be found in the toolbar.
    To format text, the text itself must be selected. This means you must first select
    the text box and then click and drag across the text that you would like to format.
    Once you have selected it it is easily formatted.'
