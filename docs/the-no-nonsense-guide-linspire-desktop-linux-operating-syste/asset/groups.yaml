    在这本书中，你将学习如何使用 Linspire，这是一款功能强大的桌面和笔记本电脑操作系统。开始享受 Linspire 的易用性、安全性以及大量的预装应用程序。


    通过数百张截图，本书向读者介绍了 Linspire 的各个组件。每一步操作说明都配有截图，展示了如何完成任务。如果你正在升级到 Linspire 的最新版本，书中包含了对新增强功能的说明。对于初次使用该系统的用户，这本书可以作为自学指南，也可以作为完整的参考。


    以无废话的方式学习！


    Linspire 包含了强大的互联网应用程序，以及兼容微软 Office 的办公套件、照片和音乐管理器等更多。


    在整书中，你会发现许多技巧和快捷键，可以帮助你更快完成工作。你很快就能成为 Linspire 的大师。


    Greg Grebler 是一位技术作家、认证培训师和 Linux 爱好者，他编写过多种关于操作系统、办公套件、图形出版和数字音频编辑的计算机书籍。通过培训数千名用户，他亲身了解了用户在使用技术时遇到的各种挑战和困难。


    今天就体验 Linspire！


    包含

