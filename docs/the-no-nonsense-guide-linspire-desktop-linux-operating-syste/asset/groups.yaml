    # 240

    # Chapter 12 E-Mail


    15. Type a name for this account. Because the E-Mail Client allows you to have
    multiple accounts, it''s a good idea to give the account a descriptive name that
    distinguishes it from other accounts you might be creating.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_241_0.png)


    16. Click the Next button. You''ll now be brought to the final screen of the wizard
    to confirm your settings.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_241_1.png)


    17. Click the check box beside Enable Spam Filter. This will turn the Spam Filter
    feature on your account to prevent you from getting junk e-mail.


    18. Click the Finish button and your account will be created. You will now have
    to enter your password. Alternatively, you can click the Back button to go back
    to any of the steps in the wizard to make any changes.


    ## Receiving and Viewing E-mail


    ![](img/3926ca1fb00de3af845faa03d2c351e5_242_0.png)


    19. Type in your password. It will appear as a series of stars.


    20. Click the check box beside Use Password Manager to remember this password
    if you are the only one who has access to this computer.


    21. Click the OK button. Existing messages on your e-mail server will be downloaded
    to your account.


    ## Receiving and Viewing E-mail


    By default, the E-Mail Client will check the server every three minutes for e-mail.
    When new messages arrive, they will be placed in the Inbox folder for you to view.
    New messages that have not been read will appear in bold text. The E-Mail Client
    window is split into a preview window where you can instantly read the contents
    of your messages. You can also choose to view your messages in their own separate
    window.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_242_1.png)


    - 1. Click on a message. The contents of the message will appear in the preview
    window. Alternatively you can double-click on a message to open it in its own
    window. When you are finished reading the message you can click the Close button
    in the top right corner of the window to close the message and return to your
    inbox.


    - 2. Scroll through the message to read its contents.


    # 242

    # Chapter 12 E-Mail


    ## Receiving Attachments


    One of the key benefits of e-mail is that not only can you send and receive messages,
    but you can also send and receive files as attachments. When someone sends you
    a file, you have the option of opening it or saving it to your computer.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_243_0.png)


    - 1. Click on an e-mail message with an attachment. You can tell if it has an
    attachment because there will be a little paperclip icon beside the subject of
    the message.


    - 2. Right-click on the attachment. A menu will appear.


    - 3. Click Save As... A dialog box will appear where you can specify where on
    your computer you would like the file saved. Alternatively you can click Open,
    which opens the file with the program that is associated with it.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_243_1.png)


    - 4. Navigate to the folder on your computer where you would like to save the
    file.


    - 5. Give the file a new name if you so desire.


    - 6. Click on the Save button. The attachment will be saved to the folder that
    you specified.


    ## Address Book


    > Never under any circumstances open an attachment from someone you are unfamiliar
    with. The attachment could be a virus that could damage to your computer.


    While using the Address Book is not essential, does make things a whole lot easier.
    Storing your contacts means that you have instant access to them when sending
    messages. This is especially beneficial nowadays as there are so many free e-mail
    services, and people tend to have multiple e-mail addresses. Using the Address
    Book, you can add individual entries or create lists which allows you to send
    an e-mail to a group of people by only entering the name of the list.


    - 1. Click Window. The Window menu will appear.

    2. Click Address Book. The Address Book program will launch.


