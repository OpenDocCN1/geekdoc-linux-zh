    ## 数据排序


    还记得小学时，班级要按身高从矮到高排队吗？除了那些特别矮或特别高的同学，这给了你一个关于排序的宝贵教训。从本质上说，排序改变了电子表格中信息的显示顺序。你不仅可以选择想要排序的内容，还可以选择排序的顺序。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_129_0.png)


    - 1. 点击并拖动你想要排序的数据。或者你也可以点击 Ctrl+A 对整个电子表格进行排序。

    - 2. 点击 数据 | 排序...。将打开排序对话框。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_129_1.png)


    - 3. 点击所需排序选项旁的单选按钮。你可以选择升序或降序。

    - 4. 点击下拉菜单并选择排序依据。通常这是你想要排序的列标题。


    ## 自动筛选


    ![](img/3926ca1fb00de3af845faa03d2c351e5_130_0.png)


    - 5. 在“按...排序依据”区域重复步骤 3 和 4，以设置二级和三级排序选项。换句话说，在选择了第一个排序选项后，应该遵循的第二和第三排序依据是什么。

    - 6. 点击确定。对话框将关闭，你的排序将执行。


    ## 自动筛选


    谁说面包是最伟大的发明？与其手动排序，不如自动筛选可以根据你设置的标准自动从你的电子表格中筛选信息。会出现一些小菜单，你可以从中选择标准来筛选数据。我们以足球队为例。如果我有一份包含整个联赛的电子表格，并想筛选数据以寻找某些相似性（例如，只查看某个特定球队的人），自动筛选允许我点击鼠标即可实现这一点。


    - 1. 点击并拖动你想要应用自动筛选的单元格。

    - 2. 点击 数据 | 筛选 | 自动筛选。你选择区域顶部单元格边缘将出现小箭头。这些是用于筛选数据的弹出菜单。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_130_1.png)


    ## 第 6 章 创建电子表格


    ![](img/3926ca1fb00de3af845faa03d2c351e5_131_0.png)


    - 3. 点击任何自动筛选箭头。将出现一个可以筛选的目录列表，以及其他几个选项。

    - 4. 点击你想要筛选所需的标准。在这个例中，我只想看属于红队的人，并过滤掉其他人，因此所以我点击了“红队”。电子表格将过滤掉我所选标准以外的所有内容。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_131_1.png)


    - 5. 对任何其他想要筛选的列重复步骤 4 和 5。

    - 6. 点击你之前筛选过的任何自动筛选箭头。列表将再次出现。

    - 7. 点击“全部”。筛选将被移除，列中的所有数据将重新出现，除非有其他列的筛选阻止数据的显示。


    ## 自动填充


    - 8. 点击 数据 | 筛选 | 自动筛选以移除自动筛选，并将文档恢复到筛选前的状态。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_132_0.png)


    在创建电子表格时，你通常需要反复创建某些文本字符串。这些示例包括星期几、月份和编号列表。为了帮助你更快地完成这些任务，电子表格有一个自动填充工具，它允许你只输入字符串的第一部分，而电子表格将完成剩余工作。例如，如果你想创建一个星期几的表格，你只需要输入“Monday”（周一），其余几天就可以自动填充。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_132_1.png)


    ## 基础自动填充


    对于简单的自动填充，你可以输入一个值，然后点击并拖动。


    - 1. 输入你想要创建的字符串的值。可以是任何数字或特定的单词，包括星期几、月份或日期。

    - 2. 将鼠标指针悬放在单元格的右下角。鼠标指针将变成一个小加号。


    ## 第 6 章 创建电子表格


    - 3. 在你希望其余字符串出现的方向上点击并拖动。在这个例中，我们正在向下拖动以在第一列输入不同的星期。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_133_0.png)


    - 4. 在拖动时，将鼠标指针悬停在出现的工具上。提示将告诉你字符串的内容。

    - 5. 松开鼠标键。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_133_png)


    ## 使用自动填充复制


    自动填充的另一个方便用途是复制。无论你想复制一个单元格还是多个单元格，都可以这样操作：


    - 1. 点击并拖动你想复制的单元格。

    - 2. 将鼠标指针悬放在单元格的右下角。鼠标指针将变成一个加号。

    - 3. 在你希望目标字符串出现的地方点击并拖动。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_134_0)


    - 4. 松开鼠标键。如果区域大于选择，单元格将被填充。


    > 复制、粘贴和撤销等典型功能是一致的。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_134_1)


    ## 设置电子表格格式


    让你的数据更易理解的方法之一是给电子表格上色。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_134_2)


    面对数字数据可能是令人生畏的。为了缓解人们遇到电子表格时的恐惧，你可以进行多种方式的格式设置。许多格式功能可以在单元格对话框中找到。


    - 1. 选择所需的单元格。它们将被选中。

    - 2. 在任何位置点击右键。将出现一个菜单。

    - 3. 点击“设置单元格格式...”。


    | 名称 | | |

    |---|---|---|

    | Ethan | | 6 |

    | Eric | | 2 |

    | Kara | | 5 |

    | Ron | | 2 |

    | Leon | | 1 |

    | Rob | | 3 |


    > 下提到的许多格式功能也可以从工具栏访问。将鼠标悬停在任何按钮上查看其功能。


    ## 给单元格上色


    ![](img/3926ca1fb00de3af845faa03d2c351e5_135_0)


    - 1. 点击“填充”选项卡。你将看到一个色板来选择单元格背景。

    - 2. 点击你想应用的颜色。对话框中将出现颜色预览。

    - 3. 点击确定。对话框将关闭，你的选择将上色。


    ## 设置电子表格格式


    ![](img/3926ca1fb00de3af845faa03d2c351e5_135_1)


    ## 文本换行和旋转


    如果你在一个宽度大于文本宽度的单元格中输入文本，文本会被相邻单元格的内容截断。为了避免这种情况，你可以选择“换行”。就像在文字处理器中一样，当启用文本换行时，文本达到单元格宽度将流向另一行。你还可以在单元格内旋转文本。


    - 1. 选择所需的单元格。它们将被选中。

    - 2. 按照之前“设置电子表格格式”部分所述打开“设置单元格格式”对话。

    - 3. 点击“对齐”选项卡。

    - 4. 点击向上和向下箭头更改单元格内文本的旋转角度。

    - 5. 勾选“自动换行”选择框以便文本换行。

    - 6. 点击确定。效果已生效。


