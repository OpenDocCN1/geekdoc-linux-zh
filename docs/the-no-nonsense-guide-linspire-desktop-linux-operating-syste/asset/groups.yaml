  mdcn: "\n\n## 发布和回复帖子\n\n如果你在查询中没有找到你问题的答案，可以在论坛上创建自己的帖子。如前所述，如果你遇到了某个问题，其他人可能已经遇到过相同的问题，或者正面临着同样的困扰。通过在论坛上发布主题，你有时可以获得比寻求支持更快的答案，而且通过引起关注这个问题，你也在帮助你的其他\
    \ Linspire 用户。关键在于将你的信息放在正确的类别中。如果你有有价值的内容可以添加，或者有人向你提出了一个需要回答的问题，你也可以回复现有的帖子。\n\
    \n## 创建帖子\n\n创建帖子其实非常简单。找到适合你帖子的类别后，你只需输入你的信息即可。\n\n![](img/3926ca1fb00de3af845faa03d2c351e5_291_0.png)\n\
    \n> 在论坛中创建帖子之前，你必须先登录。如果你无法创建帖子，请点击 My.Linspire 标签页并使用你的 CNR 用户名和密码登录。\n\n- 1.\
    \ 点击你想创建帖子的类别。将出现该类别下所有的帖子列表。\n\n![](img/3926ca1fb00de3af845faa03d2c351e5_291_1.png)\n\
    \n![](img/3926ca1fb00de3af845faa03d2c351e5_292_0.png)\n\n## 第15章 获取帮助\n\n尽管社区论坛有自己的导航按钮，但使用网络浏览器“后退”和“前进”按钮在论坛中来回移动是最简单的。\n\
    \n![](img/3926ca1fb00de3af845faa03d2c351e5_293_0.png)\n\n- 7. 检查你的信息，确保它看起来符合你的预期。\n\
    - 8. 点击 Ok（确定）、提交按钮。你的信息将被发布。或者，你可以向下滚动并对帖子进行任何更改。修改完成后，点击 Continue（继续）按钮预览信息。提交后，你的帖子就发布在论坛上了。你可以经常返回论坛查看主题并查看谁回复了你。\n\
    \n![](img/3926ca1fb00de3af845faa03d2c351e5_293_1.png)\n\n## 回复帖子\n\n如果你觉得对某个主题有价值可以添加的内容，请尽管发布回复。论坛的全部目的是让用户之间相互交流并分享经验，这是你回馈的机会。\n\
    \n![](img/3926ca1fb00de3af845faa03d2c351e5_293_2.png)\n\n- 1. 在阅读任何帖子时点击 Reply（回复）按钮。屏幕将切换并允许你输入回复。\n\
    \n## 使用社区论坛\n\n![](img/3926ca1fb00de3af845faa03d2c351e5_294_0.png)\n\n- 2. 如果你不想使用显示的默认主题，请为你的回复输入主题。通常情况下，人们保持主题不变。\n\
    - 3. 在提供的区域输入你的回复。你还可以通过点击字体颜色或点击表情图标旁边的单选按钮来为回复应用格式，将其包含在消息中。\n- 4. 点击 Continue（继续）按钮。你将能够预览你的回复。\n\
    \n![](img/3926ca1fb00de3af845faa03d2c351e5_294_1.png)\n\n- 5. 点击 Ok（确定）、提交按钮。你的回复将被发布。或者，你可以向下滚动并对回复进行任何更改。修改完成后，点击\
    \ Continue（继续）按钮预览你的回复。提交后，你的回复将作为论坛中主题的一部分出现。\n\n![](img/3926ca1fb00de3af845faa03d2c351e5_294_2.png)\n\
    \n社区论坛不仅仅是为了发布问题。你可以分享你经历过的经验，表达观点并讨论许多话题。只需确保你发布在正确的类别中。\n\n## 来自 Linspire 的技术支持\n\
    \n如果你无法从知识库或论坛找到找到问题的答案，可以直接将问题提交给 Linspire 的专家（guru）。通常需要 3-5 天才能收到回复，回复将直接发送到你的电子邮件地址。\n\
    \n![](img/3926ca1fb00de3af845faa03d2c351e5_295_0.png)\n\n- 1. 点击 Help Center（帮助中心）按钮。将出现帮助选项菜单。\n\
    - 2. 点击 Online Support（在线支持）。网络浏览器将启动并打开 Linspire 支持页面。\n- 3. 滚动到页面底部，你会看到第 4\
    \ 步：与支持代表交流。\n- 4. 点击 Ask Us（联系我们）链接。你现在可以提供联系信息并提交你的问题。\n\n![](img/3926ca1fb00de3af845faa03d2c351e5_295_1.png)\n\
    \n- 5. 点击 Ok（确定）、提交按钮。你的回复将被发布。或者，你可以向下滚动并对回复进行任何更改。修改完成后，点击 Continue（继续）按钮预览回复。提交后，你的回复将作为论坛中主题的一部分出现。\n\
    - 6. 输入你的电子邮件地址。\n- 7. 点击类别下拉菜单。\n- 8. 点击下拉菜单。\n\n## 来自 Linspire 的支持\n\n![](img/3926ca1fb00de3af845faa03d2c351e5_296_png)\n\
    \n- 8. 如果你不想使用显示的默认主题，请为你的回复输入主题。通常情况下，人们保持主题不变。\n- 9. 在提供的区域输入你的回复。你还可以通过点击字体颜色或点击表情图标旁边的单选按钮来为回复应用格式，将其包含在消息中。\n\
    - 10. 点击 Continue（继续）按钮。你将能够预览你的回复。\n- 11. 点击 Ok（确定）、提交按钮。你的回复将被发布。或者，你可以向下滚动并对回复进行任何更改。修改完成后，点击\
    \ Continue（继续）按钮预览你的回复。提交后，你的回复将作为论坛中主题的一部分出现。\n- 12. 点击 Continue（继续）按钮。\n- 13.\
    \ 点击 Finish（完成）按钮。\n\n## 桌面\n\n尽管社区论坛有自己的导航按钮，但使用网络浏览器“后退”和“前进”按钮在论坛中来回移动是最简单的。\n\
    \n![](img/3926ca1fb00de3af845faa03d2c351e5_293_0.png)\n\n## 桌面\n\n几乎每个家庭都有电脑，使用网络浏览器“后退”和“前进”按钮在论坛中来回移动是最简单的。\n\
    \n![](img/3926ca1fb00de3af845faa03d2c351e5_293_1.png)\n\n## 桌面 \n\n几乎每个家庭都有电脑，使用网络浏览器“后退”和“前进”按钮在论坛中来回移动是最简单的。\n\
    \n## 控制你的桌面\n\n如果你想和他人共享你的桌面，你需要创建一个包含他们如何连接详情的邀请。\n\n![](img/3926ca1fb00de3af845faa03d2c351e5_297_0.png)\n\
    \n- 1. 点击 Launch | Run（启动|运行）。将出现程序类别。\n- 2. 点击 Utilities（工具）。将出现工具子菜单。\n- 3.\
    \ 点击 Desktop Sharing（桌面共享）。将出现子菜单。\n- 4. 点击 Share This Desktop（共享此桌面）。桌面共享程序将启动。\n\
    \n要与他人共享桌面，创建一个包含主机和密码的邀请。该密码从创建创建起有效期为一小时。\n\n## 桌面\n\n- 5. 点击 Create Personal\
    \ Invitation... (创建个人邀请...)按钮。将出现一个界面，提供供想要连接你桌面的人的主机和密码。或者，你可以点击 Invite Via Email...\
    \ (通过电子邮件邀请...)按钮，向你想共享桌面的人员编写电子邮件。\n\n![](img/3926ca1fb00de3af845faa03d2c351e5_298_0.png)\n\
    \n- 6. 记住主机和密码。你现在可以将这些信息传递给你想共享桌面的人。他们需要一个名为 VNC 客户端的程序来连接并查看你的桌面。阅读下一节以了解连接到\
    \ Linspire 计算机的 VNC 客户端。当他们运行他们的 VNC 客户端连接到你的机器时，将弹出一个对话框，询问你想如何处理共享桌面请求。\n\n\
    ![](img/3926ca1fb00de3af845faa03d2c351e5_298_1.png)\n\n"
