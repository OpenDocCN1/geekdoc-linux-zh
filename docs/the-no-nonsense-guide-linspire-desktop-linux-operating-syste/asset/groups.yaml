    ## Creating Spreadsheets


    Spreadsheet is a powerful software application that allows you to store, manipulate
    and display data in a variety of formats. The uses for spreadsheets are limited
    only by your imagination. Everything from business finances, stock portfolios,
    baseball statistics, invitation lists, invoices and much, much more can be stored
    in spreadsheets.


    At first glance, a spreadsheet can look intimidated with its seemingly endless
    grid of rows and columns. The truth is that once you understand the basics of
    creating and working within spreadsheets, you''ll get addicted quickly. Because
    Spreadsheet is part of the OpenOffice suite, many of the basic functionality is
    the same as the other components of the suite. For that reason, you can refer
    back to Chapter 5: “Word Processing” if you need a refresher on some of the file
    basics including opening, saving and creating new documents.


    In this chapter we''ll cover:


    - Entering data into a spreadsheet

    - Using formulas

    - Formatting worksheets

    - Creating charts


    ![](img/3926ca1fb00de3af845faa03d2c351e5_120_0.png)


    ## Launching Spreadsheet


    The entire OpenOffice suite is located in the Business & Finance section of the
    Launch Menu. All of the programs, including Word Processor, Spreadsheet, Drawings
    and Presentations can be found there.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_121_0.png)


    1. Click the Launch button and then click Run Programs. A list of categories will
    appear.

    2. Click Business & Finance. A submenu will appear.

    3. Click OpenOffice. Another submenu will appear.

    4. Click Opensheet to launch the Spreadsheet program.


    ## Entering Data


    Once you have a spreadsheet open, you can begin entering data. Typically, data
    in a spreadsheet takes one of three forms, either text (sometimes this is referred
    to as a ''label''), numbers or formulas. The distinction between the three forms
    is how you enter them.


    ## Entering Formulas


    To be considered a formula, the data that you enter must begin with an operator.
    The equals sign (=) is the operator that lets Spreadsheet know you are entering
    a formula. Formulas will be covered later in the chapter, but for now, it''s just
    important to note that an operator is needed to start a formula.


    ## Entering Data


    ![](img/3926ca1fb00de3af845faa03d2c351e5_122_0.png)


    1. Click once in the cell that you would like to add a formula to. It will be
    highlighted to indicate that it is selected.

    2. Type the equals sign (=) followed by the mathematical formula. The equals sign
    will appear in the cell and in the formula bar. Formulas are covered in detail
    later in the chapter.

    3. Click the check mark in the formula bar when you are finished entering your
    formula or simply press the Enter key on the keyboard. The results of the formula
    will appear in the cell.


    ## Entering Text and Values


    Entering text and numbers into your cells is simply a matter of typing. Once you''ve
    selected the cell that you want to enter text into, the rest is a breeze.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_122_1.png)


    1. Click the cell into which you would like to add text or numbers. The cell will
    be highlighted

    2. Type your text. Ensure that it does not start with an equals (=) sign.

    3. Click the check mark in the formula bar when you are finished entering your
    formula or press Enter on the keyboard.


    ## Making Selections


    Before you can format, edit, or manipulate a cell or cells they must first be
    selected.


    ## Clicking and Dragging


    Probably the quickest way to select one or a series of cells is to simply click
    and drag across them.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_123_0.png)


    1. Click any cell. The cell will be selected and an outline around the cell will
    appear.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_123_1.png)


    2. Click and drag across any cells that you would like to select. The selected
    cells will be highlighted.

    3. Click any cell to deselect the selection.


    ## Selecting Entire Rows or Columns


    At the top of every column and to the left of every row there is a letter or a
    number called the column or row heading. By clicking on these row or column headings
    you can select entire rows or columns.


    1. Click a row or column heading. The entire row or column will be selected.

    2. Click and drag across row or column headings. As you drag multiple rows and
    columns will be selected.

    3. Click any individual cell. This action will deselect your selection.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_124_0.png)


    > Pressing Ctrl+A on your keyboard will select all of the cells in your spreadsheet.
    Holding down the Ctrl key as you click lets select cells that aren''t together.


    ## Worksheets


    The files you create in Spreadsheet are called notebooks. Within each workbook
    there are a series of worksheets where you can enter data. You can name them so
    your spreadsheet doesn''t become too confusing. By default, worksheets are created
    in every workbook.


    ## Accessing Sheets


    To access a worksheet you have to click the tab with it.


    1. Click the tab you want to access. The worksheet will become active.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_125_0.png)


    ## Creating Sheets


    If you require more than the three worksheets created, you can easily create ones
    from the Insert menu.


    1. Right-click any tab. A menu will appear.

    2. Click Insert... The Insert dialog box will appear.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_125_1.png)


    3. Click the radio beside the desired location for the new sheet.

    4. Type a name for the sheet.

    5. Click the OK button. The new sheet will be added.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_126_0.png)


    > To change the order of worksheets, move your mouse over the tab and drag it
    before or after other tabs.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_126_1.png)


    ## Naming Worksheets


    The names Sheet 1, Sheet 2, etc., aren''t the most descriptive. You can rename
    the sheet more appropriately.


    1. Right-click the tab of the worksheet you would like to rename.

    2. Click Rename... The dialog box will open where you can enter the name.


    | Tuesday |

    | Wednesday |

    | Thursday |

    | Friday |


    ![](img/3926ca1fb00de3af845faa03d2c351e5_126_2.png)


    ## Deleting Sheets


    You can remove any sheet from your workbook. Just be careful when you delete the
    tab as you will lose all the data on it.


    1. Right-click the tab of the sheet you would like to remove. A menu will now
    appear.

    2. Click Delete. A dialog box will open to confirm that you want to delete the
    sheet and all of its contents.

    3. Click OK in the dialog box that appears. The sheet will be deleted.


    ## Adding or Deleting Rows and Columns


    Once you have entered data, you may find it necessary to add a row or a column
    to your sheet. You have the ability to add or delete single or multiple rows at
    any time.


    1. Click a cell or create a selection where you would like to add or delete a
    row or column. The number of cells you select will indicate how many rows or columns
    will be added or deleted.

    2. Right-click anywhere on your selection. A menu will appear.

    3. Click Insert Cells... The Insert dialog box will appear.

    Or

    3. Delete Cells... This will delete the selected rows or columns.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_128_0.png)


    4. Click the radio beside the selected option for inserting or deleting rows or
    columns.

    5. Click OK. The dialog box will close and rows or columns will be added or removed
    based on the settings you have entered.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_128_1.png)

