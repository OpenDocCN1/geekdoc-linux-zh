    # Working with Text


    Most of your slides will contain text in one form or the other. There are so many
    things that can be done to text to make it stand out.


    # Adding Text


    To add text to a slide you must create a text box. A text box is a container for
    your text that helps you organize how text appears on your slide. The Text box
    tool can be found in the toolbar.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_160_0.png)


