    image of the desktop. This background is also known as the "wallpaper." For the
    background, you can select from a variety of images, create a customized background,
    use one of your favorite photos, or even run a slide show.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_53_0.png)


    +   1. Right-click any blank area of the desktop. A menu will appear.

    2. Click Configure Desktop... The Configure - Desktop dialog box will open to
    let you configure different elements of your desktop.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_53_1.png)


    +   3. Click the Background icon if it is not already selected. This action will
    bring you to the area where you can control the look of your desktop.

    4. Click the arrow beside "Setting for desktop" and pick a specific virtual desktop
    where you can apply any setting. Alternatively you can select All Des to apply
    the same setting to each virtual desktop. You''ll be learning more about virtual
    desktops later in this chapter.


    You must now decide what you would like: a picture, a slide show or a colored
    background.'
