    Alternatively you can click Ctrl+A to sort the entire spreadsheet.


    +   2. Click Data | Sort... The Sort dialog box will open.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_129_1.png)


    +   3. Click the radio button beside the desired sorting option. You can choose
    either ascending or descending.


    +   4. Click the drop-down menu and choose the criteria to sort. Typically this
    is the column title that you would like to sort.'
  - '[PAGE 130]


    # AutoFilter


    ![](img/3926ca1fb00de3af845faa03d2c351e5_130_0.png)


    +   5. Repeat Steps 3 and 4 in the "Then by" areas for secondary and tertiary
    sort options. In other words, after the first sort option is selected, what is
    the second and third sorting criteria that should be followed.


    +   6. Click OK. The dialog box will close and your sort will be conducted.


    # AutoFilter


    Who says that bread was the greatest invention? Rather than sorting yours, AutoFilter
    automatically filters information from your spreadsheet based on criteria you
    set. Little menus will appear from which you can select criteria to filter your
    data. We''ll use the example of a soccer team. If I had a spreadsheet of an entire
    league and wanted to filter the data to find certain similarities, for example,
    see only the people who were on a specific team, AutoFilter allows me to do this
    at the click of a mouse button.


    +   1. Click and drag across the cells that you would like to filter AutoFilter.


    +   2. Click Data | Filter | AutoFilter. Little arrows will appear at the edge
    of the top cells in your selection. These are pop-up menus that can be used to
    filter your data.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_130_1.png)'
  - '[PAGE 131]


    # 130 Chapter 6 Creating Spreadsheets


    ![](img/3926ca1fb00de3af845faa03d2c351e5_131_0.png)


    3. Click any of the AutoFilter arrows.

    A list of contents that can be filtered will appear, along with a few other options.


    4. Click the desired criteria that you want to filter. In this example, I want
    to see only those people who are on the Red team and filter out the rest. so I
    click Red. The spreadsheet will filter out everything but the criteria that I
    selected.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_131_1.png)


    5. Repeat Steps 4 and 5 for any other columns that you would like to filter.


    6. Click any of the AutoFilter arrows that you have previously filtered. The list
    will reappear.


    7. Click All. The filter will be removed and all of the data within the column
    will reappear, unless there is a filter on another column preventing the data
    from being shown.'
  - '[PAGE 132]


    # AutoFill


    8. Click Data | Filter | AutoFilter to remove AutoFilter and return your document
    to its pre-filtered state.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_132_0.png)


    # AutoFill


    When creating spreadsheets there are certain strings of text that you typically
    have to create and over. Examples of these include, days of the week, months,
    and numbered lists. To help you complete these tasks faster Spreadsheet has an
    AutoFill tool which allows you to enter only the first part of a string, and Spreadsheet
    will do the rest. For example, if you wanted to create a sheet with the days of
    the week, you would only have to type Monday, the rest of the days could be AutoFilled.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_132_1.png)


    # Basic AutoFills


    For simple AutoFills you can enter a value, then click and drag.


    +   1. Type the first value for the string you want to create. This can be any
    number or certain words including days of the week, months or dates.

    2. Position the mouse pointer over the bottom right corner of a cell. The mouse
    pointer will turn into a small plus sign.'
  - '[PAGE 133]


    # 132 Chapter 6 Creating Spreadsheets


    3. Click and drag in the direction where you want the rest of the string to appear.
    In this example, we are dragging downwards to enter the different days of the
    week in the first column.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_133_0.png)


    4. Take note of the tool tip that appears as you drag. The will tell you the content
    final cell of your string.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_133_1.png)


    5. Release the mouse button. The cells you dragged over will automatically be
    filled.


    # Copying with AutoFill


    Another handy use of AutoFill is to copy cells. Whether you want to copy one cell
    over and over or if you want to copy multiple cells, you can accomplish this with
    the AutoFill.'
  - '[PAGE 134]


    # Copying with AutoFill


    +   1. Click and drag across the cell or cells that you would like to copy.

    They will be highlighted.


    +   2. Position the mouse pointer at the bottom right corner of the cells that
    you would like to copy. The mouse pointer will turn into a little plus sign.


    +   3. Click and drag over the destination cells where you want to copy your selection.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_134_0.png)


    +   4. Release the mouse button. The selection will be copied to the selected
    rows. If the area selected in Step 3 was greater than your original selection,
    the selection will repeat once copied.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_134_1.png)


    > Typical editing features like copying, cutting, pasting and undoing are the
    same across the OpenOffice suite. Refer to the last chapter to review using these
    features.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_134_2.png)'
  - '[PAGE 135]


    # Formatting Worksheets


    Let''s face it, numbers scare people. A spreadsheet full of numerical data can
    be quite intimidating to the faint of heart. To alleviate some of the fear that
    people face when encountering a spreadsheet, you can format your worksheet in
    a variety of different ways. Through formatting you can emphasize certain areas
    or points, make data more understandable and accessible and change the overall
    appearance of your spreadsheet. Most formatting features can be found in the Format
    Cells dialog box.


    +   1. Select the cells that you want to apply a color to using one of the selection
    methods.

    2. Right-click anywhere on your selection. A menu will appear.

    3. Click Format Cells...The Format Cells dialog box will open.


    | Name | Team | Goals |

    |---|---|--|

    | Ethan | | 6 |

    | Eric | | 2 |

    | Kara | | 5 |

    | Ron | | 2 |

    | Leon | Gold | 1 |

    | Rob | Gold | 3 |

    | Meredith | Gold | 2 |

    | Evan | Red | 2 |


    ![](img/3926ca1fb00de3af845faa03d2c351e5_135_0.png)


    > Many of the formatting features discussed in the section below can also be accessed
    from the toolbar. Hover your mouse pointer over any button in the toolbar to see
    what it does.


    # Applying Colors to Cells


    One of the best ways to make your data easier to understand is to apply colors
    to the cells in your spreadsheet.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_135_1.png)'
  - '[PAGE 136]


    # Formatting Worksheets


    ![](img/3926ca1fb00de3af845faa03d2c351e5_136_0.png)


    +   1. Click on the Background tab. You will be presented with a palette of colors
    to select the cell background.


    +   2. Click the color that you want to apply. A preview of the color will appear
    in the dialog box.


    +   3. Click OK. The Format Cells dialog box will close and your selection will
    be colored.


    # Wrapping and Rotating Text


    If you enter text into a cell that is longer than the width of the cell, the text
    will be cut off by any content in the cell beside it. To avoid this you can select
    the wrap cell. Just like in a word processor, when text reaches the width of the
    cell, it will flow to another line with text wrapping activated. You can also
    rotate text within a cell.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_136_1.png)


    +   1. Select the cells that you want to edit. They will be highlighted.


    +   2. Open the Format Cells dialog box as discussed in the "Formatting Worksheets"
    section earlier.


    +   3. Click on the Alignment tab.


    +   4. Click on the up and down arrows to change the degree of rotation for the
    text in the cell.


    +   5. Click on the Automatic line break check box so that text will wrap.


    +   6. Click OK. The effect is applied.'
- md: "\n# 136 Chapter 6 Creating Spreadsheets\n\n## Borders\n\nSpreadsheet offers\
    \ a range of border options, in terms of both styles and thicknesses that you\
    \ can apply to your selections.\n\n1. Select the cell(s) that you want to apply\
    \ a border to using one of the selection methods.\n2. Open the Format Cells dialog\
    \ as discussed in the \"Formatting Worksheets\" section earlier.\n3. Click on\
    \ the Borders tab.\n4. Choose one of the default border types.\n5. Click on the\
    \ selected line thickness for your cell.\n\n![](img/3926ca1fb00de3af845faa03d2c351e5_137_0.png)\n\
    \n6. Click on the color drop-down menu to select a color for your border.\n7.\
    \ Click the desired color. It will be selected.\n8. Click OK. The dialog box will\
    \ close and the borders will be applied to your selection.\n\n![](img/3926ca1fb00de3af845faa03d2c351e5_137_1.png)\n\
    \n## Numerical Formatting\n\nDo you remember 5th Grade math class where you had\
    \ to learn how to round up or down to two decimal places? If only you had Spreadsheet\
    \ which could do it for you automatically. Spreadsheet has a variety of preset\
    \ numerical formats that you can apply to your cells. Any data that you enter\
    \ into those formatted cells will take on the numerical formatting that you have\
    \ selected. For example, if you have formatted a cell to be three decimal places\
    \ and then enter the number 4.5678, the number will appear as 4.568.\n\n![](img/3926ca1fb00de3af845faa03d2c351e5_138_0.png)\n\
    \n1. Select the cell(s) to which you want to apply numerical formatting using\
    \ one of the selection methods.\n2. Open the Format Cells dialog box as discussed\
    \ in the \"Formatting Worksheets\" section.\n3. Click on the Numbers tab.\n4.\
    \ Click on the desired category of number you are formatting.\n5. Click the desired\
    \ format from the samples of formats that appear.\n6. Click OK. The numerical\
    \ formatting will be applied and the dialog box will close.\n\n> There are dozens\
    \ of other formatting features that you can apply to your cells. You should explore\
    \ the Format Cells dialog box to experiment with other formatting options.\n\n\
    ![](img/3926ca1fb00de3af845faa03d2c351e5_138_1.png)\n\n## Formulas and Other Math\n\
    \nThe real power of Spreadsheet is that you can enter formulas, change your data,\
    \ and then quickly see the changes in the results of your formulas.\n\n### AutoCalculate\n\
    \nHere's a way to impress your friends at parties. Have them gather around your\
    \ computer and call out numbers. You can instantly provide them with the sum of\
    \ those numbers, the average, the count and a variety of other calculations based\
    \ on the numbers they've provided. There's no need for a Mensa membership to perform\
    \ this trick, it's as simple as highlighting the numbers.\n\n![](img/3926ca1fb00de3af845faa03d2c351e5_139_0.png)\n\
    \n1. Create a selection of numbers that you want to find the sum.\n2. Observe\
    \ the status bar at the bottom of the screen. It will automatically provide you\
    \ with the sum of those numbers. If you don't want to find the sum, there are\
    \ a variety of other calculations that can be done instantly.\n3. Right-click\
    \ on the status bar. menu of auto calculations will appear.\n4. Click on the desired\
    \ calculation including:\n   - Average. This will display the mean or average\
    \ of your selection.\n   - Count. This will indicate the total number of cells\
    \ that are selected.\n   - CountA. This will indicate the total number of cells\
    \ that contain numbers that are selected.\n   - Max. This will display the maximum\
    \ number in the selection.\n   - Min. This will display the lowest number in the\
    \ selection.\n   - Sum. This will show the sum of all the numbers in the selection.\n\
    \n## Formulas and Other Math\n\n### AutoSum\n\nThe most common formula entered\
    \ in Spreadsheet is sum, or in other words, adding up a series of cells. Since\
    \ this is such a common formula, the good folks at OpenOffice made it easy for\
    \ you to calculate a sum by creating a button that will insert the formula for\
    \ you. This button is called AutoSum and will instantly calculate the sum of a\
    \ selection\n\n1. Click on a cell or to the right of the cells that you would\
    \ like to add.\n2. Click the AutoSum button. A formula will appear in the cell\
    \ and a blue outline will appear around the cells to be added.\n3. Press the Enter\
    \ key on the keyboard or click the Accept button. The cells will be added and\
    \ the results will appear in the cell you selected.\n\n![](img/3926ca1fb00de3af845faa03d2c351e5_140_0.png)\n\
    \n4. Change any of the numbers that were added.\n5. Observe the results. The results\
    \ will automatically update to reflect the changes that you made to the data.\n\
    \n![](img/3926ca1fb00de3af845faa03d2c351e5_140_1.png)\n\n## Formulas\n\nThere\
    \ are countless formulas that you can enter into your spreadsheet to perform calculations.\
    \ All formulas have one thing in common: they all begin with an operator, an equals\
    \ sign (=). An operator tells Spreadsheet that the content of the cell is a formula\
    \ and not a label.\n\n![](img/3926ca1fb00de3af845faa03d2c351e5_141_0.png)\n\n\
    1. Click once in a cell that you would like to add a formula to. The cell will\
    \ be highlighted.\n2. Type the equals sign (=) then type the rest of your formula.\
    \ It will appear in the formula bar.\n3. Click the check mark in the formula bar\
    \ (the Accept button) or press the Enter key. The formula will be inserted into\
    \ the cell.\n\n> [Inspire]\n> The rules of order of operation apply when creating\
    \ formulas in Spreadsheet. Remember the order is BEDMAS: Brackets, Exponents,\
    \ Division, Multiplication, Addition, and Subtraction.\n\n## Cell References\n\
    \nWhen creating formulas in Spreadsheet, you can use the values of cells as part\
    \ of your equations. In this example we'll simply add 3 and the contents of two\
    \ cells together, but you can enter any formula.\n\n## Charts\n\n1. Click once\
    \ on the cell where you would like the results of your calculation to be displayed.\n\
    \n![](img/3926ca1fb00de3af845faa03d2c351e5_142_0.png)\n\n2. Click the equals sign\
    \ to begin the formula and type the number 3. It will appear in the formula bar.\n\
    3. Type the plus sign (+). It will appear after the 3 in the formula bar.\n4.\
    \ Click on a cell where you would like to include in your formula. It will have\
    \ a red outline.\n\n![](img/3926ca1fb00de3af845faa03d2c351e5_142_1.png)\n\n5.\
    \ Repeat Steps 4 - 5 to add any other cells to the formula.\n6. Click the Accept\
    \ button to complete the formula.\n\n## Charts\n\nIf there's a better visual than\
    \ a pie chart, I haven't seen it. The ability to convert your data from boring,\
    \ senseless numbers to visual masterpieces is the real power of Spreadsheet. There\
    \ are dozens when it comes to creating graphs (more commonly referred to as charts)\
    \ in Spreadsheet. The beauty of the program is that stunning graphical representations\
    \ of your data can be created in seconds with a few clicks of the mouse.\n\n##\
    \ Chapter 6 Creating Spreadsheets\n\n1. Select the data you would like represented\
    \ in a graph using one of the selection methods.\n2. Click the Format | Chart.\
    \ The AutoFormat Chart wizard will appear.\n\n![](img/3926ca1fb00de3af845faa03d2c351e5_143_0.png)\n\
    \n3. Click the Next button to proceed to the next stage in the wizard.\n\n![](img/3926ca1fb00de3af845faa03d2c351e5_143_1.png)\n\
    \n4. Click on the type of graph that you would like to create. A preview of that\
    \ type of graph will appear in the display.\n\n![](img/3926ca1fb00de3af845faa03d2c351e5_144_0.png)\n\
    \n5. Click on the Show text elements in preview check box if you want to see how\
    \ the text labels will appear in the graph.\n6. Click the Next button to move\
    \ to the next stage.\n7. Click on a variant of the graph if so desired. This gives\
    \ you additional options for the graph you've selected.\n\n![](img/3926ca1fb00de3af845faa03d2c351e5_144_1.png)\n\
    \n8. Click the Next button to move to the next stage.\n\n> You don't have to complete\
    \ every step of the AutoFormat Chart wizard. You can click on the Create button\
    \ at any time to finish the graph.\n\n![](img/3926ca1fb00de3af845faa03d2c351e5_144_2.png)\n"
  mdcn: "\n\n# 136 第 6 章 创建电子表格\n\n## 边框\n\n电子表格提供了多种边框选项，包括样式和粗细，你可以应用于所选区域。\n\n\
    1. 使用一种选择方法选择要应用边框的单元格。\n2. 按照之前在“设置工作表”部分所述的方法打开“单元格格式”对话框。\n3. 点击“边框”选项卡。\n\
    4. 选择一种默认边框类型。\n5. 点击单元格选定的线条粗细。\n\n![](img/3926ca1fb00de3af845faa03d2c351e5_137_0.png)\n\
    \n6. 点击颜色下拉菜单为你的边框选择颜色。\n7. 点击所需的颜色。该颜色将被选中。\n8. 点击“确定”。对话框将关闭，边框将应用于你的所选区域。\n\
    \n![](img/3926ca1fb00de3af845faa03d2c351e5_137_1.png)\n\n## 数值格式\n\n你还记得 5 年级数学课吗？当时你必须学习如何四舍五入保留两位小数。如果当时电子表格能自动为你完成这些工作就好了。电子表格有多种预设的数值格式，你可以应用于单元格。你输入到这些格式化单元格中的任何数据都将采用你选择的数值格式。例如，如果你将单元格格式化为三位小数，然后输入数字\
    \ 4.5678，该数字将显示为 4.568。\n\n![](img/3926ca1fb00de3af845faa03d2c351e5_138_0.png)\n\
    \n1. 使用一种选择方法选择要应用数值格式的单元格。\n2. 按照“设置工作表”部分所述打开“单元格格式”对话框。\n3. 点击“数字”选项卡。\n4.\
    \ 点击你正在格式化的数字所需的类别。\n5. 从出现的格式样本中点击所需的格式。\n6. 点击“确定”。数值格式将得到应用，对话框将关闭。\n\n> 还有几十种其他可以应用于单元格的格式化功能。你应该探索“单元格格式”对话框，以尝试其他的格式选项。\n\
    \n![](img/3926ca1fb00de3af845faa03d2c351e5_138_1.png)\n\n## 公式和其他数学计算\n\n电子表格真正的威力在于你可以输入公式、更改数据，然后快速看到公式结果的变化。\n\
    \n### 自动计算\n\n这里有一个在派对上让朋友印象深刻的方法。让他们围着你的电脑报数字。你可以立即为他们提供这些数字的总和、平均值、计数以及根据他们提供的数字进行的各种计算。执行这个魔术不需要门萨协会（Mensa）会员，它就像高亮数字一样简单。\n\
    \n![](img/3926ca1fb00de3af845faa03d2c351e5_139_0.png)\n\n1. 创建一个想要求和的数字区域。\n2.\
    \ 观察屏幕底部的状态栏。它将自动为你提供这些数字的总和。如果你不想求和，还有许多其他计算可以立即完成。\n3. 在状态栏上点击右键。将出现自动计算菜单。\n\
    4. 点击所需的计算，包括：\n   - 平均值。这将显示你所选区域的平均数或平均。\n   - 计数。这将显示选中单元格的总数。\n   - 计数A。这将显示包含数字的所选单元格总数。\n\
    \   - 最大值。这将显示区域中的最大数字。\n   - 最小值。这将显示区域中的最小数字。\n   - 求和。这将显示区域内所有数字的和。\n\n##\
    \ 公式和其他数学计算\n\n### 自动求和\n\n电子表格中最常用的公式是求和（sum），换句话说，是对一系列单元格进行相加。由于这是一个常用公式，OpenOffice\
    \ 的朋友们创建了一个按钮来为你插入公式，让你轻松计算总和。这个按钮被称为“自动求和”（AutoSum），它将立即计算所选区域的和。\n\n1. 点击要相加的单元格或单元格右侧。\n\
    2. 点击“自动求和”按钮。单元格中将出现公式，要加的单元格周围会出现一个蓝色轮廓。\n3. 按键盘上的 Enter 键或点击“接受”按钮。单元格将相加，结果将出现在你选择的单元格中。\n\
    \n![](img/3926ca1fb00de3af845faa03d2c351e5_140_0.png)\n\n4. 修改已添加的任何数字。\n5. 观察结果。结果将自动更新，反映你对数据所做的更改。\n\
    \n![](img/3926ca1fb00de3af845faa03d2c351e5_140_1.png)\n\n## 公式\n\n你可以在电子表格输入无数公式来执行计算。所有公式都有一个共同点：它们都以运算符开头，即等号\
    \ (=)。运算符告诉电子表格，单元格的内容是公式而不是文本标签。\n\n![](img/3926ca1fb00de3af845faa03d2c351e5_141_0.png)\n\
    \n1. 点击要添加公式的单元格。该单元格将会被高亮。\n2. 输入等号 (=)，然后输入公式的其余部分。它将出现在公式栏中。\n3. 点击公式栏中的勾标记（接受按钮）或按\
    \ Enter 键。公式将插入到单元格中。\n\n> [提示]\n> 在电子表格中创建公式时，适用运算优先级规则。记住顺序是 BEDMAS：括号（Brackets）、指数（Exponents）、除法（Division）、乘法（Multiplication）、加法（Addition）和减法（Subtraction）。\n\
    \n## 单元格引用\n\n在电子表格中创建公式时，你可以将单元格的值作为方程的一部分。在这个例中，3 和两个单元格的内容相加，但你可以输入任何公式。\n\n\
    ## 图表\n\n1. 点击你想显示计算结果的单元格。\n\n![](img/3926ca1fb00de3af845faa03d2c351e5_142_0.png)\n\
    \n2. 点击等号开始公式并输入数字 3。它将出现在公式栏中。\n3. 输入加号 (+)。它将出现在公式栏中 3 之后。\n4. 点击你想包含在公式中的单元格。它将有一个红色轮廓。\n\
    \n![](img/3926ca1fb00de3af845faa03d2c351e5_142_1.png)\n\n5. 重复步骤 4-5，将其他单元格添加到公式中。\n\
    6. 点击“接受”按钮完成公式。\n\n## 图表\n\n如果有比饼图更好的视觉化效果，我还没见过。将枯燥、无意义的数字转换为视觉杰作是电子表格真正的威力。在电子表格中创建图形（通常称为图表）有很多种。该软件的魅力在于，只需点击几次鼠标即可创建震撼的数据表示。\n\
    \n## 第 6 章 创建电子表格\n\n1. 使用一种选择方法选择要在图表中表示的数据。\n2. 点击格式 | 图表。自动格式图表向导将出现。\n\n![](img/3926ca1fb00de3af845faa03d2c351e5_143_0.png)\n\
    \n3. 点击“下一步”按钮进入向导的下一个阶段。\n\n![](img/3926ca1fb00de3af845faa03d2c351e5_143_1.png)\n\
    \n4. 点击你想创建的图表类型。该类型图表的预览将显示在屏幕上。\n\n![](img/3926ca1fb00de3af845faa03d2c351e5_144_0.png)\n\
