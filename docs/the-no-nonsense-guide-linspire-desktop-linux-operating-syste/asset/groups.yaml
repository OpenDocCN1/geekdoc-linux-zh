  mdcn: '


    ## 管理网络浏览器


    每个人在操作电脑时都有不同的偏好，使用网络浏览器也是如此的。你可以配置并控制某些页面的显示方式，管理它们的处理方式，并确定某些信息的交换方式。


    ## 更改主页


    当你首次启动网络浏览器时，会进入一个被称为“主页”的页面。默认情况下，该页面是 CNR 尝试会员注册页面，但你可以将其更改为任何喜欢的页面。


    - 1. 点击“编辑 (Edit) | 偏好 (Preferences...)”。将打开偏好对话框。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_232_0.png)


    ## 第11章 浏览互联网


    ![](img/3926ca1fb00de3af845faa03d2c351e5_233_0.png)


    - 2. 如果“导航 (Navigator)”选项尚未被高亮，请点击它。

    - 3. 在“位置 (Location)”框中双击。它将显示为高亮。

    - 4. 输入你想要作为主页的 URL。或者，你可以点击“使用当前页面 (Use Current Page)”按钮将当前页面作为你的主页。

    - 5. 点击“确定 (OK)”。你的更改将被接受，新主页也将生效。


    ## 清除历史和缓存


    网络浏览器会记录你访问过的所有网站。你可能注意到，当你返回某些网站时，它们会记住你是谁，或者加载你设置的一些偏好。为了让某些页面加载得更快并记住关于你的数据，系统会创建一个包含你访问过的网站某些信息和文件的缓存文件。为了隐私，偶尔清理此缓存以及访问过的网站历史记录是一个好主意。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_233_1.png)


    - 1. 点击“编辑 (Edit)”。将编辑菜单。

    - 2. 点击“偏好 (Preferences)”。将出现偏好对话框。


    ## 管理网络浏览器


    ![](img/3926ca1fb00de3af845faa03d2c351e5_234_0.png)


    - 3. 点击“历史 (History)”选项。它将被高亮，你将看到清除访问过的网站历史的选项。

    - 4. 点击“清除历史 (Clear History)”按钮以清除你访问过的网页历史。

    - 5. 点击“清除位置栏 (Clear Location Bar)”按钮，以从位置栏清除你访问过的网站历史。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_234_1.png)


    - 6. 点击“高级 (Advanced)”旁边的三角形展开选项。

    - 7. 点击“缓存 (Cache)”选项。将出现各种缓存配置设置。

    - 8. 点击“清除缓存 (Clear Cache)”按钮。缓存中的所有文件都将被删除。

    - 9. 点击“确定 (OK)”按钮清除偏好对话框。


    ## 管理弹出窗口


    当你平静地浏览互联网时，没有什么比突然弹出一个关于某项“本周奇迹医疗疗法”的弹出广告更令人生厌了。弹出广告就像互联网版的二手车推销员：烦人且不体贴。Linspire
    的网络浏览器在反对弹出广告的战争中处于领先，因为它会自动拦截它们。在某些情况下，合法网站也会使用弹出窗口。你可以让浏览器知道从哪些网站接受弹出窗口。


    ## 第11章 浏览互联网


    ![](img/3926ca1fb00de3af845faa03d2c351e5_235_0.png)


    - 1. 点击“工具 (Tools)”。将出现工具菜单。

    - 2. 点击“弹出窗口管理器 (Popup Manager)”。将出现选项子菜单。

    - 3. 点击“管理弹出窗口 (Manage Popups)”。现在将打开弹出窗口对话框。或者，如果你只想允许当前访问的网页弹出窗口，可以点击“允许来自此站弹出窗口
    (Allow Popups From this Site)”。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_235_1.png)


    - 4. 输入你允许弹出窗口的网站 URL。你不需要包含 www.。

    - 5. 点击“添加 (Add)”按钮。该网站将被添加到允许弹出窗口列表中。

    - 6. 点击你想要从允许列表中移除的任何网站。

    - 7. 点击“移除 (Remove)”按钮。该网站将从列表中移除。

    - 8. 点击“确定 (OK)”接受更改并关闭对话框。


    ## 更改缩放级别


    并不是所有的网页看起来都一样。根据字体创建的方式，它们的显示方式可能让你难以阅读。你不需要通过更改电脑的分辨率来更好地查看网页文本，只需使用内置的缩放控制即可。


    > 你可以使用键盘放大或缩小网页文本文本。按住 Ctrl 键并按 + 键放大，或按 - 键缩小。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_236_0.png)


    - 1. 点击“视图 (View)”。将出现视图菜单。

    - 2. 点击“缩放 (Zoom)”。将出现不同缩放级别的子菜单。


    ## 显示和隐藏工具栏


    有几个工具栏构成了界面。根据你的偏好，你可以选择哪些工具栏显示，哪些隐藏。


    - 1. 点击“视图 (View)”。

    - 2. 点击“显示/隐藏 (Show/Hide)”。将出现工具栏列表。

    - 3. 点击你想显示或隐藏的工具栏。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_237_0.png)


    ## 电子邮件


    你还记得上次坐在桌前写信吗？电子邮件可能是你最好的朋友或最大的敌人，取决于你如何对待它。即时通信的便利可能会被垃圾邮件的干扰。Linspire 自带电子邮件软件。在本章中，我们将涵盖：


    - 配置电子邮件客户端

    - 发送和接收电子邮件

    - 组织你的邮件


    ## 新账户设置


    当你首次启动电子邮件程序时，将出现账户对话框。由于电子邮件对你在电脑上的工作非常重要，可以直接从快速启动栏访问。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_239_0.png)


    - 1. 点击快速启动栏上的“电子邮件 (E-Mail)”。将打开账户对话框。

    - 2. 点击“电子邮件账户 (Email account)”旁边的单击按钮（如果尚未选中）。

    - 3. 点击“下一步 (Next)”按钮进入下一步。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_239_1.png)


    - 4. 点击并拖动“姓名 (Your Name)”字段中的现有文本。它将变为高亮。

    - 5. 在字段中输入你的名字。

    - 6. 按键盘上的 Tab 键。“电子邮件地址 (Email Address)”字段的内容现在将变为高亮。

    - 7. 输入你的电子邮件地址。

    - 8. 点击“下一步 (Next)”按钮进入下一步。


    - 9. 点击你使用的接收服务器类型旁边的单击按钮。此信息以及步骤 10 和 11 需要的信息可以从你的服务提供商 (ISP) 获取。

    - 10. 在字段中输入你的接收服务器名称。

    - 11. 在字段中输入你的发送服务器名称。

    - 12. 点击“下一步 (Next)”进入设置电子邮件账户过程的下一个阶段。


    - 13. 输入你电子邮件账户的接收和发送用户名。再次，这些信息可以从你的服务提供商 (ISP) 获取。

    - 14. 点击“下一步 (Next)”按钮进入下一步。


    '
