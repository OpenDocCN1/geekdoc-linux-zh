    ![](img/3926ca1fb00de3af845faa03d2c351e5_48_2.png)'
  - '[PAGE 49]


    # 48


    # Chapter 2 Getting Acquainted with Linsp


    ![](img/3926ca1fb00de3af845faa03d2c351e5_49_0.png)


    +   2. Press the down arrow. This will expand the currently selected menu.


    +   3. Press the down arrow again until you''ve reached the desired command that
    you would like to execute.


    +   4. Press the Enter key. The command you selected will be executed.


    # Identifying Menu Items


    When you opened an item on the menu bar, you may have noticed that some of the
    menu items have little markings beside them or that they seem to be grayed out.
    Each one of these little symbols has a different meaning.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_49_1.png)


    +   Three Dots. This indicates that a dialog box will open when the command is
    executed.


    +   Dimmed Command. This indicates that the command is currently unavailable.


    +   Check Mark. This indicates that the option is selected. If you click a menu
    option that already has a check mark beside it, the menu option will be turned
    off and the check mark will be removed.'
  - '[PAGE 50]


    # Scrolling


    ![](img/3926ca1fb00de3af845faa03d2c351e5_50_0.png)


    +   - Triangle. Indicates that there is a submenu associated with this command.
    By clicking or just hovering over this command with the mouse pointer, you will
    be able to view the submenu.


    +   - Keystrokes. A series of words and letters beside a menu command indicates
    the keystrokes necessary to execute that command. For example, if it says Control+F8
    beside a menu command, pressing the Ctrl key on your keyboard and the F8 key at
    the same time will execute that command.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_50_1.png)


    +   - Dot. This indicates that the option is currently selected. Unlike a check
    mark, a dot indicates that only one selection can be chosen at any given time.


    # Scrolling


    When there is more information within a window than can be displayed, scroll bars
    will appear. Scroll bars allow you to move through a window either horizontally
    or vertically so that you can see all of its contents.'
  - '[PAGE 51]


    # 50


    # Chapter 2 Getting Acquainted with Linspire


    ![](img/3926ca1fb00de3af845faa03d2c351e5_51_0.png)


    +   1. Click a scroll arrow to move the contents of the window up or down. Each
    time you click an arrow, the contents will move up or down by one increment.


    +   2. Click and drag on the scroll box. The contents of the screen will move
    as you are dragging.


    +   3. Click anywhere along the scroll bar. The window will jump to a location
    where you clicked and its current location.


    # Terminating Programs


    It has happened to all of us at time or another. For some reason a program freezes
    and we are unable to continue working in it. If we were using any other operating
    system we would probably have to restart our computer. Linspire allows us to terminate
    an application without having to reboot the system.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_51_1.png)


    +   1. Click the Launch button. The Launch menu will appear.


    +   2. Click Terminate Application. The Terminate a Frozen Application dialog
    box will appear, and your cursor will change.


    +   3. Click anywhere on the frozen application. The frozen application will terminate.'
- md: "\n## Personalizing & Customizing Linspire\n\nImagine what kind of a world it\
    \ would be if everyone had to drive the same car, wear the same clothes, watch\
    \ the same shows and eat the same meals. Our individuality is of extreme importance\
    \ to us, so it's understandable why Linspire offers so many customization options\
    \ when it comes working in the operating system.\n\nSince everyone works a little\
    \ differently, Linspire allows you to change the look and feel of your computer\
    \ to suit your individual tastes. From backgrounds to screen savers to icons to\
    \ screen size, Linspire gives you the ability to make the operating system your\
    \ own. Linspire can be personalized, but it offers a variety of unique tools that\
    \ allow you to control the way in which you work.\n\nIn this chapter we'll cover:\n\
    \n- Changing backgrounds\n- Selecting screen savers\n- Manipulating icons\n- Working\
    \ with virtual desktops\n\n![](img/3926ca1fb00de3af845faa03d2c351e5_52_0.png)\n\
    \n## Changing the Wallpaper\n\nThe easiest way to personalize the look of your\
    \ computer is to change the background image of the desktop. This background is\
    \ also known as the \"wallpaper.\" For the background, you can select from a variety\
    \ of images, create a customized background, use one of your favorite photos,\
    \ or even run a slide show.\n\n![](img/3926ca1fb00de3af845faa03d2c351e5_53_0.png)\n\
    \n1. Right-click any blank area of the desktop. A menu will appear.\n2. Click\
    \ Configure Desktop... The Configure - Desktop dialog box will open to let you\
    \ configure different elements of your desktop.\n\n![](img/3926ca1fb00de3af845faa03d2c351e5_53_1.png)\n\
    \n3. Click the Background icon if it is not already selected. This action will\
    \ bring you to the area where you can control the look of your desktop.\n4. Click\
    \ the arrow beside \"Setting for desktop\" and pick a specific virtual desktop\
    \ where you can apply any setting. Alternatively you can select All Des to apply\
    \ the same setting to each virtual desktop. You'll be learning more about virtual\
    \ desktops later in this chapter.\n\nYou must now decide what you would like:\
    \ a picture, a slide show or a colored background.\n\n## Changing the Wallpaper\
    \ 53\n\n### Selecting a Pre-Installed Wallpaper\n\nLinspire comes with a variety\
    \ of different images from which you can select. Before proceeding make sure you\
    \ have followed Steps 1 - 4 in the “Changing the Wallpaper” section earlier.\n\
    \n1. Click the radio button beside Picture: if it is not already selected. A dot\
    \ should be in the circle.\n2. Click the drop-down arrow. This action will display\
    \ a list of backgrounds that come with Linspire.\n3. Click the desired wallpaper.\
    \ A preview of the wallpaper will appear in the window.\n4. Click the OK button\
    \ to finalize the background changes.\n\n![](img/3926ca1fb00de3af845faa03d2c351e5_54_0.png)\n\
    \n## Selecting Your Own Photos for the Wallpaper\n\nNothing personalizes a desktop\
    \ more than a picture of your family, vacation, pets, or any other image from\
    \ your personal collection. Linspire makes it easy to add your own pictures to\
    \ the desktop. Before proceeding make sure you have followed Steps 1 - 4 in the\
    \ “Changing the Wallpaper” section.\n\n1. Click the Browse button. A dialog box\
    \ will open allowing you to navigate your computer for the desired image.\n\n\
    ![](img/3926ca1fb00de3af845faa03d2c351e5_54_1.png)\n\n2. Navigate to the directory\
    \ that contains the image you would like to use as your wallpaper. If you are\
    \ unclear on how to navigate through your folders, see the chapter entitled \"\
    File Management.\"\n\n3. Click the picture file you would like to use. It will\
    \ be highlighted.\n4. Click OK. The dialog box will close and your picture will\
    \ be loaded.\n5. Click the OK button to finalize the background changes.\n\n##\
    \ 54 Chapter 3 Personalizing & Customizing Linspire\n\n![](img/3926ca1fb00de3af845faa03d2c351e5_55_0.png)\n\
