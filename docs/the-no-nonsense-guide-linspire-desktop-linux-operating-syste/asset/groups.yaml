    # Chapter 12 E-Mail


    # Receiving Attachments


    One of the key benefits of e-mail is that not only can you send and receive messages,
    but you can also send and receive files as attachments. When someone sends you
    a file, you have the option of opening it or saving it to your computer.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_243_0.png)


    +   1. Click on an e-mail message with an attachment. You can tell if it has an
    attachment because there will be a little paperclip icon beside the subject of
    the message.


    +   2. Right-click on the attachment. A menu will appear.


    +   3. Click Save As... A dialog box will appear where you can specify where on
    your computer you would like the file saved. Alternatively you can click Open,
    which opens the file with the program that is associated with it.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_243_1.png)


    +   4. Navigate to the folder on your computer where you would like to save the
    file.


    +   5. Give the file a new name if you so desire.


    +   6. Click on the Save button. The attachment will be saved to the folder that
    you specified.'
