  mdcn: '


    ## 创建电子表格


    电子表格是一种强大的软件应用程序，允许你以各种格式存储、操纵和显示数据。电子表格的用途仅限于你的想象力。从业务财务、股票组合、棒球统计数据到邀请名单、发票等等，一切内容都可以存储在电子表格中。


    初看之下，电子表格那看似无止尽的行列网格可能令人生生畏。但事实是，一旦你理解了在电子表格中创建和工作的基础知识，你很快就会上瘾。因为电子表格是 OpenOffice
    套件的一部分，许多基本功能与套件的其他组件相同。因此，如果你需要复习一些文件基础知识（包括打开、保存和创建新文档），可以查阅第 5 章：“文字处理”。


    在本章中，我们将涵盖：


    - 向电子表格中输入数据

    - 使用公式

    - 电子工作表格式化

    - 创建图表


    ![](img/3926ca1fb00de3af845faa03d2c351e5_120_0.png)


    ## 启动电子表格


    整个 OpenOffice 组合件位于“启动”菜单的“业务与财务”部分。所有的程序，包括文字处理器、电子表格、绘图和演示，都可以在那里找到。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_121_0.png)


    1. 点击“启动”按钮，然后点击“运行程序”。将出现分类列表。

    2. 点击“业务与财务”。将出现子菜单。

    3. 点击“OpenOffice”。将出现另一个子菜单。

    4. 点击“Opensheet”以启动电子表格程序。


    ## 输入数据


    一旦打开了电子表格，你就可以开始输入数据。通常，电子表格中的数据以三种形式之一存在：文本（有时被称为“标签”）、数字或公式。这三种形式之间的区别在于你输入它们的方式。


    ## 输入公式


    要被视为公式，你输入的数据必须以运算符开头。等号 (=) 是让电子表格知道你正在输入公式的运算符。公式将在本章稍后部分详细介绍，但现在，重要的是知道需要一个运算符来启动公式。


    ## 输入数据


    ![](img/3926ca1fb00de3af845faa03d2c351e5_122_0.png)


    1. 在你想添加公式的单元格中点击一下。它将高亮显示表示它已被选中。

    2. 输入等号 (=)，然后输入数学公式。等号将出现在单元格和公式栏中。公式将在本章稍后详细介绍。

    3. 完成公式输入后，点击公式栏中的勾选标记，或简单地按下键盘上的 Enter 键。公式的结果将出现在单元格中。


    ## 输入文本和数值


    在单元格中输入文本和数字只需打字即可。一旦你选择了想要输入文本的单元格，剩下的工作就轻而易了。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_122_1.png)


    1. 点击你想添加文本或数字的单元格。单元格将高亮。

    2. 输入你的文本。确保它不是以等号 (=) 开头的。

    3. 完成输入后，点击公式栏中的勾选标记，或按下键盘上的 Enter 键。


    ## 选择内容


    在格式化、编辑或操纵一个或多个单元格之前，必须先选中它们。


    ## 点击并拖拽


    选择一个或一系列单元格最快的方法可能是直接跨越它们点击并拖拽。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_123_0.png)


    1. 点击任意单元格。该单元格将被选中，单元格周围会出现轮廓。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_123_1.png)


    2. 跨越你想选择的任何单元格点击并拖拽。选中的单元格将高亮显示。

    3. 点击任意单元格取消选择。


    ## 选择整行或整列


    每列的顶部和每行的左侧都有字母或数字，称为行列标题。通过点击这些行列标题，你可以选择整行或整列。


    1. 点击行或列标题。整行或整列将被选中。

    2. 跨越行或列标题点击并拖拽。当你拖动时，将选中多行或多列。

    3. 点击任意单个单元格。此操作将取消你的选择。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_124_0.png)


    > 在键盘上按 Ctrl+A 将选择电子表格中的所有单元格。按住 Ctrl 键再点击可以选择不连续的单元格。


    ## 工作表


    你在电子表格中创建的文件称为“电子工作簿”。在每个工作簿中，有一系列可以在其中输入数据的“工作表”（worksheets）。你可以为它们命名，这样你的电子表格就不会变得过于混乱。默认情况下，每个工作簿中都会创建工作表。


    ## 访问工作表


    要访问工作表，你必须点击带有它的标签。


    1. 点击你想访问的标签。该工作表将变为激活状态。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_125_0)


    ## 创建工作表


    如果你需要比默认创建的更多的工作表，可以轻松从“插入”菜单创建。


    1. 右点击任意标签。将出现菜单。

    2. 点击“插入...”。将出现对话框。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_125_1.png)


    3. 点击新工作表所在的单选框。

    4. 为工作表命名。

    5. 点击 OK 按钮。新工作表将被添加。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_126_0.png)


    > 要更改工作表的顺序，将鼠标悬停在标签上并拖动。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_126_1.png)


    ## 命名工作表


    Sheet 1、Sheet 2 等命名没有描述性。你可以更准确地命名工作表。


    1. 右点击你想重命的工作表标签。

    2. 点击“重命名...”。将打开一个可以输入名称的对话框。


    | 周二 |

    | 周三 |

    | 周四 |

    | 周五 |


    ![](img/3926ca1fb00de3af845faa03d2c351e5_126_2.png)


    ## 删除工作表


    你可以从工作簿中删除任何工作表。删除标签时要小心，因为你会丢失其中的数据。


    1. 右点击你想删除的工作表标签。现在将菜单。

    2. 点击“删除”。将打开一个对话框确认你想要删除该工作表。

    3. 点击弹出对话框中的 OK。该工作表将被删除。


    ## 添加或删除行和列


    一旦输入数据，你可能需要在工作表中添加行或列。你有随时添加或删除单行或多行的能力。


    1. 点击你想添加或删除行或列的单元格或创建选择。你选择的单元格数量将指示将添加或删除多少行或列。

    2. 在你的选择区域任意位置右点击。

    3. 点击“插入单元格...”。将出现对话框。

    或

    3. 点击“删除单元格...”。这将删除选定的行或列。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_128_0.png)


    4. 点击插入或删除行或列的对应单选框。

    5. 点击 OK。对话框将关闭，并根据你输入的设置添加或删除行或列。


    '
