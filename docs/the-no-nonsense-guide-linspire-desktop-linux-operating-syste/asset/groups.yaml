    charts are simply a matter of boxes that are connected with lines. Drawings allow
    you to create lines that dynamically link to objects. This means that if you move
    an object with dynamically linked line attached to it, the line will move along
    with the object. If you''d prefer to create regular lines and arrows, you can
    do so using the same method as for drawing shapes that was discussed in the last
    section.

