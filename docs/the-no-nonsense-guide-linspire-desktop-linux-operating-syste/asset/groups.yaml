    5. Click on any of the other options to test how it affects the text.


    6. Click any of the up and down arrows to adjust the settings that you''ve applied.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_163_1.png)


    7. Click the Close button in the top right corner of the Fontwork window to close
    it.


    > File management options like saving and opening files work the same across the
    OpenOffice suite. To review these commands, examine the chapter entitled "Word
    Processing."


    ![](img/3926ca1fb00de3af845faa03d2c351e5_163_2.png)'
  - '[PAGE 164]


    # Using Multimedia Programs


    It''s amazing how far computers have come over the last few years. I remember
    as a kid growing up we got excited when our local museum opened a computer wing.
    You could go into that section, and you could play Pong (a very simple tennis-like
    game for those of you who''ve never heard of it). You could also answer a yes
    or no question posed by the computer and it would do a psychological analysis
    of you or you could type in your birthday and get your biorhythm.

    Fast-forward to today, where you can download and view your favorite music videos,
    burn CDs, manipulate photos, watch DVDs, play interactive games and do so much
    more.


    No operating system would be worth its weight in salt if it didn''t give you access
    to your favorite multimedia components, and Linspur is no slouch in this department.
    Right out of the box you are provided with a full range of multimedia tools that
    are at your disposal to keep you entertained.


    In this chapter we''ll cover:


    +   - Playing music with Lsongs

    - Using Lphoto to manipulate photos

    - Downloading photos from a digital camera


    ![](img/3926ca1fb00de3af845faa03d2c351e5_164_0.png)'
  - '[PAGE 165]


    # Using Lsongs


    Lsongs is a comprehensive program that allows you to manage and play your favorite
    mp3 and other audio songs. You can also pretend to be your own program director
    at a radio station, as you can create custom playlists. And speaking of radio,
    Lsongs allows you to listen to a range of Internet-based radio stations. Lsongs
    comes pre-installed on your Linire computer and can be accessed from the Launch
    menu.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_165_0.png)


    +   1. Click Launch | Run Programs. A list of program categories will appear.


    +   2. Click Audio & MP3 to reveal the programs that fall within that category.


    +   3. Click Lsongs. The Lsongs program will launch.


    # Adding Songs


    Before you begin playing your mp3 files, you''ll need to add them to the media
    library in Lsongs. You can select individual files to import, entire folders,
    or CDs.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_165_1.png)


    # Adding Individual Songs


    To add songs to the media library one at a time you can simply browse your computer''s
    hard drive.


    +   1. Click File | Add File to Media Library... A dialog box will appear from
    which you can select your files.'
  - '[PAGE 166]


    # Using Lsongs


    2. Navigate to the folder that contains the songs that you would like to add to
    your media library.


    3. Click on the desired song. It will be highlighted.


    4. Hold down the Ctrl key and click on any other songs in the folder that you
    would like to add.


    5. Click the Open button. The files you selected will be added to your media library.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_166_0.png)


    # Adding Entire Folders


    Most people keep all of their music files within one or two folders, so Lsongs
    rewards those among us that keep organized by allowing you to add all the songs
    within a folder to your media library. When you select a folder to add, Lsongs
    will search through that folder, select the music files and import them into the
    media library.


    1. Click File. The File menu will appear.


    2. Click Add Folder to Media Library... A dialog box will appear from which you
    can select the folder that contains music files.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_166_1.png)'
  - '[PAGE 167]


    # Chapter 8 Using Multimedia Programs


    ![](img/3926ca1fb00de3af845faa03d2c351e5_167_0.png)


    3. Click on a plus sign to expand a folder in order to see the subfolders that
    are within.


    4. Click on the folder that contains the music files that you would like to add
    to your library. The folder will now be highlighted.


    5. Click the OK button. Any music files in that folder will now be added to the
    media library.


    # Importing Songs from a CD


    The process of creating mp3 files from CDs is commonly referred to them as ripping.
    Although it is possible to play your CDs in Lsongs without first converting them
    to mp3s, the tracks cannot be added to the media library unless they are made
    into mp3s. The process of converting CD tracks to mp3s is just a matter of one
    click of the mouse button.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_167_1.png)


    +   1. Insert your CD into your computer''s CD drive. After a moment, Lsongs will
    load all of the tracks and they will appear on the screen.


    +   2. Click the Import button. Lsongs will convert the tracks to mp3''s and add
    them to the media library.


    +   3. Click the E button when you are finished and your CD will be ejected from
    the drive.'
  - '[PAGE 168]


    # Using Lsongs


    # Playing Songs


    Once you have your songs loaded into the media library you can play them by double-clicking
    on any song.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_168_0.png)


    +   1. Double-click on any song that you would like to play. The song will begin
    to play. When the song reaches the end, the next song in your list has a check
    mark in the box to let it play. You will learn more about controlling which songs
    and in what order in the next section.


    +   2. Click the Pause button at any time to pause the playback.


    +   3. Click and drag the volume slider to adjust the volume. Dragging to the
    left decreases the volume and dragging to the right increases it.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_168_1.png)


    > Holding down the Ctrl key and pressing the right arrow key will play the next
    song in the list. Pressing the left arrow key with the Ctrl key held will play
    the previous song.


    # Finding and Organizing Music


    Mp3 are popular, very popular, and really why? They don''t scratch, they''re cheap,
    they''re widely available and they are portable. Whether you are converting your
    CD collection to mp3s or purchase your files, there''s a good possibility that
    your collection will grow into hundreds if not the thousands. That could pose
    a problem, if not for the many organizing features available in Lsongs. The beauty
    of mp3s is that you can associate information like the artist, album, genre and
    the title, which makes for easy searching and organizing. By default, Lsongs categorizes
    your music by the information provided in the file so that you can quickly find
    what you''re looking for.'
  - '[PAGE 169]


    # Adding Data to Music Files


    1. Type the name of a song, artist or album that you are looking for in the Search
    box. As you type, all of the results that match your search terms will be displayed
    in the window.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_169_0.png)


    2. Delete the search term to return to your full list.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_169_1.png)


    3. Click on an artist. All of the songs by that artist will appear in the song
    list.


    4. Click on an album. All the songs in your list that belong to that album will
    appear.


    5. Click on a heading in the song list area. The list will be sorted by the title
    that you selected. For example if you clicked the Artist heading, the songs would
    be rearranged by artist in alphabetical order.


    Depending on where you obtained your mp3 files, them may not contain all of the
    correct information associated with the file. Lsongs allows you to add a variety
    of information to your mp3 files, such things as genres and album covers. The
    more accurate the information you have on your files, the easier it will be to
    find and sort.'
