    # Managing the Web Browser


    Everyone has different preferences when it comes to working on the computer, and
    using the Web Browser is no different. You can configure and control how certain
    pages appear, manage how they are handled and determine how certain information
    is exchanged.


    # Changing the Home Page


    When you first start the Web Browser you are taken to a page that is called your
    Home page. By default this page is the CNR trial membership sign up page, but
    it can be changed to any page you like.


    +   1. Click Edit | Preferences... The Preferences dialog box will open.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_232_0.png)'
  - '[PAGE 233]


    # 232


    # Chapter 11 Browsing the Internet


    ![](img/3926ca1fb00de3af845faa03d2c351e5_233_0.png)


    +   2. Click on the Navigator option if it is not already highlighted.


    +   3. Double-click in the Location box. It will appear highlighted.


    +   4. Type in the URL that you would like to use as your Home page. Alternatively
    you can click the Use Current Page button to use the current page as your Home
    page.


    +   5. Click the OK button. Your changes will be accepted and your new Home page
    will be.


    # Clearing History and Cache


    The Web Browser keeps track of all of the web sites that you have visited. You
    may have noticed that when you return to certain sites, they remember who you
    are or they load up some preferences that you have set. In order for some pages
    to load faster and remember data about you, a cache file with certain information
    and files on the sites you''ve visited is created. It''s a good idea to occasionally
    clear this cache and also the history of the sites you''ve visited for the sake
    of privacy.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_233_1.png)


    +   1. Click Edit. The Edit menu will appear.


    +   2. Click Preferences. The Preferences dialog box will appear.'
