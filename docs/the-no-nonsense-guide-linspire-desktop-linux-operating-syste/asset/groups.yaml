    > You can launch the Address Book at any time by pressing Ctrl+5 on your keyboard.


    # 244

    # Chapter 12 E-Mail


    - 3. Click the New Card button. A window will appear where you can add someone
    to the Address Book.

    - 4. Type the information of the person in the fields provided. None of the fields
    are mandatory but you should include their first and last name as well as their
    e-mail address.

    - 5. Click on any of the other tabs to include additional information on the person
    you are adding to the Address Book.

    - 6. Click OK. The person will be added to the Address Book. You can repeat Steps
    1 - 5 for anyone you would like to add.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_245_1)


    > You may have noticed one of the fields called Nickname. A nickname can be used
    as a substitute for entering in the e-mail address of a contact when composing
    an e-mail.


    ## Creating Lists


    If you have a group of people that you routinely send e-mails to, you can create
    a list. Rather then having to type each person''s address individually when composing
    your e-mail, you simply type in the name of the list and everyone on the list
    will receive that e-mail.


    ## Address Book


    1. Click on New List button. The Mailing List dialog box will appear.

    2. Type a name for your list.

    3. Type a nickname and description for the list if desired.

    4. Click in the first empty line and begin typing the first or last name or nickname
    of the person you''d like to add to the list. All of the contacts in the Address
    Book that match the name you are typing will appear.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_246_0.png)


    5. Click on the desired contact to add them to the list. Alternatively, if the
    person is not part of the Address Book, you can continue typing in their e-mail
    address until it''s complete.

    6. Repeat Steps 4 and 5 to add anyone else to your list.

    7. Click OK. The list will now be created. The list will be added to the Address
    Book and can be accessed like any other.

    8. Click the Close button in the top right corner to exit the Address Book finished.


    > Double-click on any entry in the Address Book to open up a window where you
    can edit the address information.


    ## Composing E-Mail


    Sending messages to your friends, family and colleagues is a breeze in Linspring.
    Your messages can be formatted in a variety of ways and you can add as attachments.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_247_0.png)


    - 1. Click on the New Msg button. The Compose window will appear.

    2. Begin typing the e-mail address or name of the person to whom you would like
    to send the e-mail. If the contact is in the Address Book, their name will appear.

    3. Click on the desired recipient or continue typing their name.

    4. Press the Enter key. You will advance to the next line where you can add additional
    recipients.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_247_1.png)


    - 5. Click on the arrow under the From field in the next line. A list of address
    options will appear.

    6. Click on the desired option. They include:

    * To. This is for the primary recipients of your copy,

    * Cc. This stands for "carbon copy," which means that the recipient will receive
    a copy of the message and their name will be visible to everyone who received
    the message.

