  - '[PAGE 32]


    # # Getting Acquainted with Linsphere


    You''ve either gone through the installation process, or you''ve turned on your
    pre-installed Linsphere computer for the first time – now what? It''s time to
    get acquainted with the operating system, learn your way around the key areas
    and start having some fun.


    One of the best attributes of the Linsphere operating system is that it is so
    easy to use. Whether you''ve never used a computer before or you are a seasoned
    veteran, you''ll find that you''ll be mastering Linsphere in no time. On that
    note, if you are an experienced computer user, most of this chapter will be a
    review for you, so I suggest skimming over it. If on the other hand you''re brand
    new to Linux, Linsphere or computers in general, stick around and we''ll discover
    the operating system together.


    In this chapter we''ll cover:


    +   * Identifying the components of the user interface

    * Getting around in Linsphere

    * Starting programs

    * Managing open windows


    ![](img/3926ca1fb00de3af845faa03d2c351e5_32_0.png)'
  - '[PAGE 33]


    # The User Interface


    The term "user interface" is just fancy computer talk for what you see on your
    screen. The Linspire user interface is made up of a variety of components, each
    designed to make finding and executing programs easy.


    # The Desktop


    The desktop is the background area of the screen in Linspire. When you run programs,
    they run on top of the desktop. In Linspire the desktop is made up of a variety
    of components, with their own special name and function.


    # Desktop Icons


    The desktop icons are the little pictures that appear along the left side of your
    screen. Each one of these icons has a different function, but in general when
    you double-click a desktop icon, the program associated with it will launch. You
    can also rearrange, customize and delete icons based on your preferences. You
    can find more on customizing icons in the next chapter entitled "Personalizing
    & Custom Linspire.\ For now, we will cover the icons that appear by default on
    the desktop. By double-clicking these icons you can perform the following actions.
    Note that the order of appearance of icons on your desktop may be slightly different
    from what you see.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_33_0.png)


    +   - My Computer. Lets you open a window where you can view the files on your
    computer.


    +   - Printers. Lets you open a window so you can add, configure, or remove printers.


    +   - Network Browser. Lets you open a window so you can view and configure computers
    on your network.'
- md: '

    ## The User Interface


    ![](img/3926ca1fb00de3af845faa03d2c351e5_34_0.png)


    - Trash. When you delete a file on your computer, it is sent to the Trash. You
    can restore files that you have inadvertently deleted if the files have not yet
    been emptied from the Trash. More information on the Trash will be covered in
    the chapter titled "File Management."


    - Web Browser. Lets you launch the Linspire Internet suite so you can surf the
    Internet.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_34_1.png)


    - E-Mail. Lets you launch the Linspire e-mail application (called the E-Mail Client)
    so you can send, receive, and manage your e-mail.


    - Instant Messenger. Lets you communicate instantly with family, friends and coworkers.
    Double-clicking this icon will launch the Instant Messenger program.


    - Floppy. Lets you access the files on any floppy disks you have inserted in your
    computer.


    ## Chapter 2 Getting Acquainted with Linspire


    ![](img/3926ca1fb00de3af845faa03d2c351e5_35_0.png)


    - CD-ROM. Lets you reveal the contents of a CD that has been inserted in your
    computer''s CD drive.

    - CNR. This is a subscription-based software service that makes installing software
    on your Linspire computer fast and easy.


    > If you don''t see an icon for a particular application that you would like to
    launch, don''t worry. In the next chapter you''ll learn to create an icon for
    any program.


    ## The Panel


    The Panel is the bar found at the bottom of the desktop that quickly allows you
    to access your applications. A handy feature of the Panel is that it remains visible
    regardless of the number of programs you have running. This feature is great for
    managing the programs you are running and for giving you access to applications
    at any time. Later in this chapter, we will describe in detail the four parts
    of the Panel. But right now lets look at an overview of what the parts of the
    Panel are and what they do.


    ## The User Interface


    ![](img/3926ca1fb00de3af845faa03d2c351e5_36_0.png)


    - Launch button. Lets you launch almost every program on your computer. From the
    Launch button you can start programs, configure your system, get help, or exit
    Linspire. The Launch menu appears when you click the Launch button is composed
    of certain actions, all your applications and your recently accessed programs.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_36_1.png)


    - Quick Launch bar. Lets you access applications instantly. The Quick Launch bar
    never gets obstructed by open programs and, unlike desktop icons, the icons on
    the Quick Launch bar only need to be clicked once to launch their respective programs.


    ## Chapter 2 Getting Acquainted with Linspire


    ![](img/3926ca1fb00de3af845faa03d2c351e5_37_0.png)


    - Taskbar. Lets you minimize, maximize, restore, close and switch between programs.
    All open programs are represented by an icon on the Taskbar.


    - System Tray. Lets you configure certain elements of Linspire computer. Among
    other things, it allows you to set and view the time and date, adjust the system
    volume and turn your computer off.


    ## The Quick Launch Bar


    The Quick Launch bar allows you to launch programs with a single click of the
    mouse button. Unlike icons on your desktop, the Quick Launch bar is never hidden,
    so you can always access any application on that bar. By default, there are five
    icons on the Quick Launch bar, but you can add or remove icons as you see fit.
    More on customizing the Quick Launch bar can be found in the next chapter entitled
    “Personalizing & Customizing Linspire.” In the section below, we will examine
    the five icons on the Quick Launch bar:


    ![](img/3926ca1fb00de3af845faa03d2c351e5_37_1.png)


    - File Manager. Lets you launch the File Manager, where you can manage the files
    and folders on your computer.


    - Web Browser. Lets you start the Web Browser so you can surf the Internet. The
    Web Browser icon looks like a globe.


    - Instant Mail. Lets you launch the E-Mail Client application that will allow
    you to configure, send, receive and view e-mail messages.


    - Instant Messenger. Lets you launch Instant Messenger, one of the most popular
    Internet features. Instant messaging allows you to chat directly with other computer
    users.


    - Show desktop. Lets you minimize all the programs you have open so you can see
    the contents of the desktop.


    ## Launching Programs


    In order to get anything accomplished with your computer, you will need to launch
    your software programs so that you can take advantage of what they have to offer.
    Linspire provides you with many ways to launch your programs.


    ## Launching Programs from Icons


    Earlier in this chapter we discussed the different icons that appear on your desktop
    by default. These icons provide you with access to different applications on your
    computer.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_39_0.png)


    1. Double-click the Web Browser icon. This action will launch the Web Browser
    application that allows you to surf the Internet.

    2. Click the "X" in the top right corner of an application to close it. This "X"
    is also referred to as the Close button.


    > You may be asking yourself, “Why is there an icon flashing beside my cursor
    when I launch an application?” This flashing indicates that your computer is busy
    performing the requested task.


    ## Launching Programs from the Launch Button


    The Launch button gives you complete access to most of the applications on your
    computer. From the Launch button, you can select programs that are categorized
    based on their function. Although the Launch button gives you access to a variety
    of other tools, for now we will examine the steps to launch a program from this
    handy button.


    ## Launching Programs


    1. Click the Launch button. The Launch menu will appear with a variety of operations
    or programs from which to choose.

    2. Click or just hover your mouse pointer over Run Programs. A submenu will appear
    with categories of the different programs that you have on your computer.

    3. Click Games. This feature will show you all of the programs that you have in
    this category.

    4. Click Tron. This action will launch the Tron program. You can then close it
    by clicking the Close button.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_40_0.png)


    ## Launching Applications with the Quick Launch Bar


    As we learned earlier, using the Quick Launch bar to launch programs has several
    advantages over using desktop icons. The first benefit is that it only requires
    one click with the mouse button to launch a program. The other advantage is that
    no matter how many programs you have running, you will still be able to view the
    Quick Launch bar.


    1. Click the File Manager icon in the Quick Launch bar. The File Manager application
    will open.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_40_1.png)


    ## Working with Open Applications


    It''s very rare nowadays to be using a computer and only be running one program
    at a time. In today''s fast-paced world, everyone is expected to multitask to
    get things done quicker, so it''s quite possible that you will have multiple programs
    launched at any time. The danger this poses is that you could find yourself in
    a world of mess and clutter if you don''t know how to properly manage your open
    programs. The good news is that Linsp provides you with multiple ways to manipulate
    the appearance and location of your open applications.


    ## Resizing a Window


    Resizing a program window in Linspire is as simple as clicking and dragging.


    1. Position your mouse pointer over the edge of a window. The cursor will change
    into a double-sided arrow when you are over the correct spot.

    2. Click and drag inward to reduce the size of the window.

    3. Click and drag outward to increase the size of the window.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_41_0.png)


    > By clicking and dragging at the corner of a window, you can change the width
    and height equally at the same time.

    '
