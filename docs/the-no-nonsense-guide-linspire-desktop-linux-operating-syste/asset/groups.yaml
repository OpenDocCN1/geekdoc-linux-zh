    to add an album cover you can click on the Artwork tab and explore that option.


    6. Click the OK button when you have completed adding information to the file.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_170_1.png)


    # Playlists


    I remember when I was in high school, if a guy wanted to impress a girl he would
    make a mixtape of her favorite songs. You can create one "mix tapes" (called playlists),
    that include particular songs that you would like to hear in a certain order.
    You can create playlists that reflect certain moods, types of music, artists,
    albums or genres.'
  - '[PAGE 171]


    # 170


    # Chapter 8 Using Multimedia Programs


    +   1. Click the Add Playlist button. You will now be prompted to type a name
    for your playlist.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_171_0.png)


    +   2. Type a name for your playlist. It is a good idea to give it a descriptive
    name. Examples include: my favorite songs, jazz blend, driving music, else.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_171_1.png)


    +   3. Click and drag any songs from the window onto your playlist. When your
    mouse pointer is over the playlist, a little + will appear, indicating that when
    you release your mouse button, the song will be added to the playlist.


    +   4. Click on any Playlist to reveal its contents.


    # Creating CD''s from Playlists


    Just as you can convert audio CD''s to mp3''s, the opposite is also true. After
    you''ve created a playlist, you can burn the contents of that playlist to an audio
    CD that you can play in your car or home stereo.'
  - '[PAGE 172]


    # Using Lsongs


    ![](img/3926ca1fb00de3af845faa03d2c351e5_172_0.png)


    +   1. Right-click on any playlist that you would like to create an audio CD from.
    A menu will appear.


    +   2. Click Burn Playlist to Disc.


    +   3. Insert your writeable CD into the CD burner.


    +   4. Click OK. Your playlist will be converted to audio files and be burnt to
    the CD. It now can be played like any other audio CD.


    # Internet Radio


    There are a variety of Internet-based radio stations that you can listen to directly
    from your Linspire computer. Whether it''s easy listening, hard rock or classical,
    there''s a good chance you''ll find an Internet radio station to meet your musical
    tastes.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_172_1.png)


    +   1. Click the Stations button. The Shoutcast page will appear.


    +   2. Type the particular station you are looking for in the search box. You
    can search by station, song, genre or artist. Alternatively you can scroll through
    the different stations until you find one you like.


    +   3. Click the Go! button. A list of stations that match your criteria will
    appear.


    +   4. Click the Tune In beside the station you''d like to hear. The radio station
    will begin to play through your computer speakers.'
  - '[PAGE 173]


    # Working with Photos


    Over the last five years, the popularity and growth of digital photography has
    skyrocketed. This is how you know the technology is being accepted by the masses:
    Both my mother and my mother in law both have - and are quite proficient with
    their digital cameras. Linspire comes with a couple of great tools for working
    with photos. Whether you''re just looking to view pictures or to manage and edit
    your photos, Linspire has the solution for you.


    # Viewing Photos


    Technically speaking, if you just want to view pictures you could simply use the
    File Manger in Thumbnail view mode. If you recall the chapter entitledFile Management,"
    if you simply hover your mouse pointer over a thumbnail of a picture you would
    see an enlarged version of your photo. If you''re looking for a method of viewing
    photos that is a little more functional, you can use the Image Viewer.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_173_0.png)


    +   1. Click Launch | Run Programs. You''ll now see a list of categories.


    +   2. Click Multimedia & Design to see a list of programs that fall under that
    category.


    +   3. Click Image Viewer. The Image Viewer will launch.'
  - '[PAGE 174]


    # Working with Photos


    +   4. Press Ctrl+O on your keyboard.

    The Open dialog box will appear.


    +   5. Navigate to the folder that contains the photo that you would like to open.


    +   6. Click on one of the photos that you would like to open. It will be highlighted.


    +   7. Hold down the Ctrl key and continue clicking other image files. They will
    now be highlighted.


    +   8. Click the Open button. The photos will be loaded into the image viewer.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_174_0.png)


    +   9. Click View | Fit Image to Window. The image will be enlarged to fit the
    entire space of the window.


    +   10. Press S on the keyboard to begin a slide show of your images.


    +   11. Press S again on your keyboard to end the slide show of your images.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_174_1.png)


    ![](img/3926ca1fb00de3af845faa03d2c351e5_174_2.png)


    If you prefer to manually toggle between your photos, you can use the keyboard.
    Alt+right arrow moves to the next image and Alt+left takes you to the previous
    image.'
  - '[PAGE 175]


    # Managing and Editing Photos with Lphoto


    While the Image Viewer allows you to quickly view your images, Lphoto is a much
    more powerful tool to help you view, manage and edit your photographs. When you
    launch Lphoto, a wizard will appear that will scan the "My Photos" folder on your
    computer, looking for photos, that it will then add to the Photo Library.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_175_0.png)


    +   1. Click Launch | Run Programs. A list of program categories will appear.


    +   2. Click Multimedia & Design. A submenu of different programs appears.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_175_1.png)


    +   4. Click the "Scan My Photos" for pictures" button. Lphoto will look to you''re
    My folder on your system. Alternatively, you can click the "Don''t import anything
    right now" button if you want to manually add photos to your library later. All
    the pictures in your My folder will now appear in the window. A dialog box will
    appear asking you whether you want to delete images from the original location
    as Lphoto has made a copy of the images to be included in the Photo Library.'
  - '[PAGE 176]


    # Working with Photos


    175


    +   5. Click the No button. It''s always a good idea to leave a copy of your images
    in their original location.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_176_0.png)


    +   6. Double-click on any photo to see an enlarged version of the photo.


    +   7. Click the Photo Library button to return to the thumbnail view.


    # Creating Albums


    Think of the Photo Library as one large album that contains all of your photographs.
    Rather than having to keep all of your photos in one large album, you can create
    individual albums to make it easier to view and sort your photos. Adding photos
    to the albums you create is simply a matter of clicking and dragging.


    +   1. Press Ctrl+N on your keyboard. A new album will be created and you will
    be prompted to give it a name.


    +   2. Type a name for your folder. It''s a good idea to give it a descriptive
    name.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_176_1.png)


    +   3. Press the Enter key and, the album will now be be named.'
  - '[PAGE 177]


    # 176


    # Chapter 8 Using Multimedia Programs


    ![](img/3926ca1fb00de3af845faa03d2c351e5_177_0.png)


    +   4. Click on Photo Library to return to the photo library.


    +   5. Click and drag the photos you would like to add to an album. When you are
    over the album name, indicating that you will be highlighted, when you release
    the mouse button, the photo will be added to that album.


    +   6. Click on any album name to view its contents.


    # Scaling Images


    You can adjust the size of the thumbnails that appear in the window by clicking
    and dragging on a slider. It doesn''t only work on thumbnails, as it can also
    be used when you have a picture for editing. This tool is a great way to quickly
    zoom in and out of images.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_177_1.png)


    +   1. Position the mouse pointer over the slider button.


    +   2. Click and drag to the left or right to increase or decrease the zoom level.
    Dragging to the right increases the zoom level while dragging to the left decreases
    the zoom level.'
- md: '

    ## Changing Photo Information


    Typically, when you import photos from a digital camera, the photos are given
    a generic name and number. The problem with this is that the name associated with
    the photo really doesn''t tell you anything about it. By changing the information
    of a photo, you''ll make it easier to find and sort them later. You can even rate
    your photos so that you can view them by their rating.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_178_0.png)


    - 1. Click or double-click on any photo. You''ll be able to edit a variety of
    information about your photo.

    - 2. Type a name for your photograph.

    - 3. Click the up or down arrows to adjust the time and date.

    - 4. Click in the Rating box to add a star to your photo. Clicking to the right
    to add more stars. Clicking on a star after it will remove it.

    - 5. Type any comments that you would like to add.


    You can add photos to your library at any time by using the keyboard. Press Ctrl+O
    to bring up the Open dialog from which you can select photos to import into the
    library.


    ## Sorting Photos


    The beauty of digital photos is that you can take as many as you like without
    having to develop them which typically means you''ll have thousands of photos.
    This can be a problem when trying to find a particular image. Lphoto gives you
    several options for sorting your images to make them easier to find.


    ## Chapter 8 Using Multimedia Programs


    ![](img/3926ca1fb00de3af845faa03d2c351e5_179_0.png)


    - 1. Click on the album you would like to sort. Alternatively you can click on
    the Photo Library to sort all your pictures.

    - 2. Click View | Arrange Photos. A submenu will appear.

    - 3. Click on the desired option: Date, Title, or Rating. The photos will now
    be sorted by the method you selected.


    ## Creating Slide Shows


    Lphoto allows you to display your images as a full-screen slide show and gives
    you some control over how the slide shows are displayed.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_179_1.png)


    - 1. Click on the name of the album that contains the pictures you would like
    to view in a slide show. Alternatively you could click on the Photo Library to
    include all your pictures in the slide show.

    - 2. Click on the Organize tab if it is not already selected.

    - 3. Click on the Slide Show button. A dialog box will appear where you can set
    certain options for the show.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_180_0.png)


    - 4. Click the up and down arrows to adjust the length of time each image is displayed
    before the next one appears.

    - 5. Take note of the keyboard commands for controlling your slide show.

    - 6. Click on the Play Slide Show button. The slide show will begin to play.

    - 7. Press the Esc key on the keyboard to end the slide show.


    ## E-Mailing Photos


    One of the most convenient ways of sharing your photos with others is by e-mail.
    The only problem with e-mail is that you are typically limited to the size of
    a file you can attach to your message. Lphoto solves this problem by allowing
    you to resize your pictures to make them e-mailable before they are sent.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_180_1.png)


    - 1. Click on the photo that you would like to e-mail. It will be highlighted.

    - 2. Click the Organize tab if it is not already selected.

    - 3. Click the Send Email button. A dialog box will appear where you can adjust
    the image file size.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_181_0.png)


    - 4. Take note of the size of the picture. If it is greater than 2000 KB proceed
    to Step 5 and 6 to resize. Otherwise jump to Step 7.

    - 5. Click on the Image Size drop-down menu. A list of options will appear.

    - 6. Click Medium to make the size smaller.

    - 7. Note the new file size. If it is still larger than 2000 KB repeat Steps 5
    and 6, selecting a smaller option.

    - 8. Click Send E-Mail... The E-Mail Client will launch and the photo you selected
    will be loaded as an attachment to a message. You can then proceed to type in
    your e-mail message, select a recipient and send the e-mail.


    If you haven''t already configured the E-Mail Client, you''ll be prompted to do
    so when attempting to send a picture. Instructions on doing this can be found
    in the chapter titled "E-Mail."


    ![](img/3926ca1fb00de3af845faa03d2c351e5_181_1.png)


    ## Adding Photos to the Desktop


    In the chapter titled "Personalizing & Customizing Linux" you learn how to use
    an image as the background for your desktop. Lphoto provides you with a method
    to instantly change the background image to any photo in your library.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_182_0.png)


    - 1. Click on the photo you would like to use as the background.

    - 2. Click on the Organize tab if it is not already selected.

    - 3. Click on the Desktop button. The photo is now your background.


    ## Fixing Photos


    Lphoto provides you with a variety of tools to touch up your photos.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_182_1.png)


    - 1. Double-click on the photo you would like to edit.

    - 2. Click on the Edit tab. A submenu will appear.

    - 3. Click on the Enhance button. Lphoto will automatically adjust the colors
    and brightness.

    - 4. Click B&W to convert your image to black and white.

    - 5. Click the Revert button at any time to bring your image back to its original
    state.


    ## Importing Photos from a Digital Camera


    There''s a good likelihood that the bulk of the time you spend on your computer
    will be used surfing the web, e-mailing, chatting or downloading files. To get
    access to the Internet you will have to configure your connection. In some cases,
    this is simply a matter of plugging in your network cable and you are off and
    running. In other cases you''ll need to configure your computer for use with an
    Internet Service Provider.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_183_0.png)


    - 1. Connect your digital camera to the computer.

    - 2. Click the Import tab. You will now see options for importing.

    - 3. Click the Import button. Lphoto will scan for any digital cameras that are
    attached.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_183_1.png)


    - 4. Select the photos you want to import.

    - 5. Click "Yes" to import the photos to the Photo Library, while clicking "No"
    will leave them.


    ## Connecting to the Internet


    If you do not already have an ISP, Linspired gives you a range of choices that
    you can use to sign up with, directly from your computer. The beauty of using
    one of these providers is that Linspired has done their homework and selected
    those ISPs that work well in a Linux environment.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_185_0.png)


    - 1. Click Launch | Run Programs | Internet. A submenu of Internet options will
    appear.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_185_1.png)


    - 2. Click Internet Connection Tools and then click on one of the desired ISPs.
    There will be several to choose from. Depending on the ISP you select, what happens
    next will differ. Typically, a wizard will appear you step-by-step through the
    process of creating an account with ISP. Simply follow the on-screen instruction
    for creating an account.

    '
  mdcn: '


    ## 修改照片信息


    通常，当你从数码相机导入照片时，照片会被赋予一个通用的名称和数字。这样做的问题在于，与照片关联的名称并不能告诉你关于照片的任何信息。通过更改照片的信息，你可以以后更容易地查找和排序它们。你甚至可以对照片进行评分，以便按评分查看它们。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_178_0.png)


    - 1. 点击或双击任意照片。你将能够编辑关于照片的各种信息。

    - 2. 为你的照片输入名称。

    - 3. 点击向上或向下箭头来调整时间和日期。

    - 4. 点击“评分”（Rating）框为你的照片添加星级。点击右侧添加更多星级。点击星级之后的星级将将其移除。

    - 5. 输入任何想要添加的注释。


    你可以随时使用键盘将照片添加到库中。按下 `Ctrl+O` 调出打开对话框，从中从中选择照片导入库中。


    ## 排序照片


    数字照片的优之处在于你可以随心所欲地拍摄而不需要冲洗，这通常意味着你有数千张照片。在尝试寻找特定图像时这可能会成为一个问题。Lphoto 提供了几种排序图像的选项，使其更容易查找。


    ## 第 8 章 使用多媒体程序


    ![](img/3926ca1fb00de3af845faa03d2c351e5_179_0.png)


    - 1. 点击你想排序的专辑。或者，你可以点击“照片库”（Photo Library）来排序你所有的图片。

    - 2. 点击 查看（View） | 整理照片（Arrange Photos）。将出现子菜单。

    - 3. 点击所需的选项：日期（Date）、标题（Title）或评分（Rating）。照片现在将按你选择的方法进行排序。


    ## 创建幻灯片


    Lphoto 允许将图像显示为全屏幻灯片，并让你对幻灯片的显示方式进行一些控制。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_179_1.png)


    - 1. 点击包含你想在幻灯片中查看的图片的专辑名称。或者，你可以点击“照片库”来将你所有的图片都包含在幻灯片中。

    - 2. 如果尚未选中“组织”（Organize）标签，请点击它。

    - 3. 点击“幻灯片”（Slide Show）按钮。将出现一个对话框，你可以在其中为演示设置某些选项。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_180_0.png)


    - 4. 点击向上和向下箭头来调整每张图像在下一张出现之前的显示时长。

    - 5. 注意控制幻灯片的键盘命令。

    - 6. 点击“播放幻灯片”（Play Slide Show）按钮。幻灯片将开始播放。

    - 7. 按键盘上的 `Esc` 键结束幻灯片。


    ## 电子邮件发送照片


    与他人分享照片最方便的方法之一是通过电子邮件。电子邮件唯一的问题是，你通常受限于信息中可以附件的文件大小。Lphoto 解决了此问题，允许你在发送之前调整图片的大小，使其可以通过电子邮件发送。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_180_1.png)


    - 1. 点击你想通过电子邮件发送的照片。它会被高亮。

    - 2. 如果尚未选中“组织”（Organize）标签，请点击它。

    - 3. 点击“发送电子邮件”（Send Email）按钮。将出现一个对话框，你可以在其中调整图像文件大小。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_181_0.png)


    - 4. 注意图片的大小。如果大于 2000 KB，继续执行第 5 和第 6 步调整大小。否则，跳转到第 7 步。

    - 5. 点击“图像大小”（Image Size）下拉菜单。将出现选项列表。

    - 6. 点击“中等”（Medium）减小尺寸。

    - 7. 注意新的文件大小。如果仍然大于 2000 KB，重复步骤 5 和 6，选择更小的选项。

    - 8. 点击“发送电子邮件...”（Send E-Mail...）。电子邮件客户端将启动，你选择的照片将作为附件加载到消息中。你可以继续输入你的电子邮件消息、选择收件人并发送电子邮件。


    如果你尚未配置电子邮件客户端，在尝试发送照片时系统会提示你进行配置。关于如何操作的说明可以在名为“电子邮件”（E-Mail）的章节中找到。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_181_1.png)


    ## 将照片添加到桌面


    在名为“个性化与定制 Linux”（Personalizing & Customizing Linux）的章节中，你学习了如何使用图像作为桌面背景。Lphoto
    提供了一种方法可以立即更改背景图像。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_182_0.png)


    - 1. 点击你想作为背景的照片。

    - 2. 如果尚未选中“组织”（Organize）标签，请点击它。

    - 3. 点击“桌面”（Desktop）按钮。照片现在是你的桌面。


    ## Fixing照片


    Lphoto 提供了各种工具来完善你的照片。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_182_1.png)


    - 1. 双击你想编辑的照片。

    - 2. 点击“编辑”（Edit）标签。

    - 3. 点击“增强”（Enhance）按钮。Lphoto 将自动调整色彩和亮度。

    - 4. 点击“黑白”（B&W）将图像转换为黑白。

    - 5. 随时点击“还原”（Revert）按钮将图像恢复原始状态。


    ## 从数码相机导入照片


    很有可能你在电脑上花费大部分时间将用于上网、发送电子邮件、聊天或下载文件。要访问互联网，你需要配置连接。在某些情况下，这只需插上网络线即可运行。在其他情况下，你需要为使用互联网服务商而配置电脑。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_183_0.png)


    - 1. 将数码相机连接到电脑。

    - 2. 点击“导入”（Import）标签。你现在将看到导入选项。

    - 3. 点击“导入”按钮。Lphoto 将扫描任何连接的数码相机。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_183_1.png)


    - 4. 选择你想导入的照片。

    - 5. 点击“是”将照片导入照片库，点击“否”将保留它们。


    ## 连接互联网


    如果你还没有互联网服务商（ISP），Lspired 为你提供了一些可以从电脑直接注册的选择。使用这些提供商的优处在于，Lspired 做了功课，并选择了在
    Linux 环境下良好的 ISP。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_185_0.png)


    - 1. 点击 启动（Launch） | 运行程序（Run Programs） | 互联网（Internet）。将出现互联网选项子菜单。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_185_1.png)


    - 2. 点击“互联网连接工具”（Internet Connection Tools），然后点击所需的 ISP 之一。会有多个供你选择。根据你选择的 ISP，后续情况会有所不同。通常会出现一个向导，引导你逐步完成创建
    ISP 账户的过程。


    '
