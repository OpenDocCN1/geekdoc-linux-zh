    ![](img/3926ca1fb00de3af845faa03d2c351e5_177_0.png)


    - 1. 将鼠标指针置在滑块按钮上。

    - 2. 点击并向左或右拖动以增加或减少缩放比例。向右拖动增加缩放比例，而向左拖动则会减少。


