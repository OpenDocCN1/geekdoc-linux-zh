    # Adjusting the Panel


    By default the Panel appears at the bottom of the screen, but if you prefer, it
    can be moved or resized to fit your preference. You can also change its size and
    length.


    +   1. Right-click any blank area in the Taskbar. A menu will appear.


    +   2. Click Configure Panel. The Configure - Panel dialog box will open.


