    # File Management with Dialog Boxes


    In almost every computer application, you''ll need to navigate your computer in
    order to select, open, or save files. Typically this is done through a dialog
    box that gives you access to your files. Although the dialog boxes for each application
    are different, in many cases the way in which the dialog boxes works is almost
    identical to that of the File Manager. You can use dialog boxes rather than accessing
    the File Manager whenever you want to navigate your computer''s hard drive, select
    and copy files or folders, move files, or even create folders. Because different
    programs have different styles of boxes, Some of these dialog boxes will have
    buttons that may unfamiliar to you. When dealing with unfamiliar buttons in a
    dialog, the best idea is to hover your mouse pointer over the button. In most
    cases, after a second or two, a tool tip will appear that will describe the function
    of the button. Another good idea is to right-click a file in dialog box to see
    what options are available. On the next page you''ll find examples of dialog boxes
    from different programs that offer some file management capabilities.'
