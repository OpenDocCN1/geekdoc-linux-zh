    Click and hold the View button. A list will appear. Your choices include:


    - Icon View: This view displays your files as icons.

    - Column View: This is almost identical to Icon View except that it sorts your
    files into columns.

    - List View: This view displays your files in a list.

    - Tree View: This view is very similar to List View except it displays your folders
    in a tree.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_74_1.png)


    ## Chapter 4 File Management


