- md: '

    ## Creating and Replying to Posts


    If you don''t find an answer to your query, you can create your own post on the
    forum. As mentioned earlier, if you are having a problem, someone else may have
    already had the problem or be sharing the same frustrations. By posting a topic
    in the forum you can sometimes get answers faster than you would from support,
    and you are helping out your fellow Linspire users by bringing attention to this.
    The key is to put your message in the correct category. You can also reply to
    existing posts if you have something valuable to add or if someone has posed a
    question to you that requires a reply.


    ## Creating a Post


    Creating a post is really quite simple. After finding the category that is appropriate
    for your post, you simply type your message.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_291_0.png)


    > Before you can create a post in the forums, you must first be logged on. If
    you are unable to create a post, click the My.Linspire tab and log using your
    CNR user name and password.


    - 1. Click on the category under which you would like to create a post. A list
    of all the postings under that category will appear.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_291_1.png)


    ![](img/3926ca1fb00de3af845faa03d2c351e5_292_0.png)


    ## Chapter 15 Getting Help


    Even though the Community Forum has its own navigation buttons, it''s easiest
    to move back and forth through the forum using the Back and Forward buttons in
    the Web Browser.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_293_0.png)


    - 7. Review your message to ensure it looks the way you want it to.

    - 8. Click the Ok, submit button. Your message will be posted. Alternatively,
    you can scroll down and make any changes to your post. When you are finished making
    your changes, click the Continue button to preview the message. After you submit,
    your post is now in the forum. You can return to the forum frequently to view
    the thread and see who has responded.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_293_1.png)


    ## Replying to a Posting


    If feel like you have something of value to add to a string, by all means, post
    a reply. The entire purpose of the forum is for users to communicate with each
    other, and to share experiences, here''s your chance to give back.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_293_2.png)


    - 1. Click on the Reply button when reading any post. The screen will change and
    allow you to type your reply.


    ## Using Community Forums


    ![](img/3926ca1fb00de3af845faa03d2c351e5_294_0.png)


    - 2. Type a subject for your reply if you don''t want to use the default subject
    that appears. Typically, people leave the subject as is.

    - 3. Type your reply in the area provided. You can also apply formatting to your
    reply by clicking on a font color or clicking the radio button beside an emotion
    icon to be included in your message.

    - 4. Click the Continue button. You will be able to preview your reply.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_294_1.png)


    - 5. Click the Ok, submit button. Your reply will be posted. Alternatively, you
    can scroll down and make any changes to your reply. When you are finished making
    your changes, click the Continue button to preview your reply. After you submit,
    your reply will appear as part of the thread in the forum.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_294_2.png)


    The Community Forum isn''t just for posting issues. You can share experiences
    you''ve had, express opinions and discuss many topics. Just make sure you are
    posting to the correct category.


    ## Technical Support from Linspire


    If you can''t find the answer to your question from the knowledgebase or the forums
    you can submit the question directly to the guru at Linspire. Typically it will
    take 3-5 days to get a response, which will be sent directly to your e-mail address.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_295_0.png)


    - 1. Click the Help Center button. A menu of help options will appear.

    - 2. Click Online Support. The Web Browser will launch and open to the Linspire
