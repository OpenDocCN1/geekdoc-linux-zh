  - '[PAGE 291]


    # Creating and Replying to Posts


    If you don''t find an answer to your query, you can create your own post on the
    forum. As mentioned earlier, if you are having a problem, someone else may have
    already had the problem or be sharing the same frustrations. By posting a topic
    in the forum you can sometimes get answers faster than you would from support,
    and you are helping out your fellow Linsp users by bringing attention to this.
    The key is to put your message in the correct category. You can also reply to
    existing posts if you have something valuable to add or if someone has posed a
    question to you that requires a reply.


    # Creating a Post


    Creating a post is really quite simple. After finding the category that is appropriate
    for your post, you simply type your message.


