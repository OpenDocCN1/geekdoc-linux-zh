    All of the messages you receive are stored in a folder called the Inbox. Just
    as you can use folders on your computer to store your different files, so can
    you use folders when dealing with e-mails. The types of folders you create are
    up to you, but typically people create folders to store messages from specific
    people or specific topics or projects. Once you have your folders created, you
    can add messages to them simply by clicking and dragging.


    1. Click the triangle beside Local Folders to see a list of folders already created
    for you by the e-mail package.


    2. Right-click on the word Local Folders. A menu will appear.


    3. Click New Folder... The New folder dialog box will open when you can name your
    newly created folder.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_254_1.png)'
- md: '

    4. Type a name for your folder. It''s a good idea to give it a name that describes
    the type of messages that you''ll be within.


    5. Click OK. The folder will be created.


    6. Repeat Steps 2 - 5 to create any other folders.


    7. Click and drag any message from the window into any of the folders that you
    created. When the message is over the folder, the folder name will be highlighted.
    When you release the mouse button, the message will be moved to that folder.


    8. Click on any folder to reveal its contents.


    Holding down the Ctrl key when you drag a message to a folder will copy the message
    to that folder rather than just move it.


    # Trashing Messages


    Removing an e-mail message is very similar to removing files on your computer.
    When a message is deleted, it is actually just sent to a folder called Trash.
    Once you empty messages out of the trash, they will be permanently deleted.


    - 1. Click on a message you would like to delete. It will be highlighted.

    2. Press the Delete key on your keyboard. The message will be sent to the Trash
    folder.

    3. Right-click on the Trash Folder. A menu will appear. Make sure that it is the
    Trash folder under your ISP, not the one under Local Folders.

    4. Click Empty Trash. All the folders in your Trash will be permanently deleted.


    When you are deleting a message, you can bypass the Trash by holding down the
    Shift key while pressing the Delete key.


    # Instant Messaging


    Think of instant messaging as e-mail on steroids. While e-mail has so many advantages
    over traditional mail, instant messaging takes things a few steps further. Instant
    messaging allows you to conduct online chat sessions that you can rapidly communicate
    with another party. Unlike e-mail, you can always tell whether or not the person
    you are sending a message to is online, you don''t have to wait several minutes
    for the message to arrive, and you don''t have to periodically check an inbox.
    Once you create a list of people that you want to communicate with, you can always
    tell if those people are online and available for a chat session.


    As its name would suggest, in instant messaging, when you type a message, the
    recipient receives that message instantly. Beyond just chatting back and forth
    with text, you can send files, add expressions to your messages, share web links,
    photos, music, and do much more.


    In this chapter we''ll cover:


    - Setting up an Instant Messenger account

    - Creating a contact list

    - Sending and receiving messages

    - Sharing files and other content


    # Creating an Instant Messaging Account


    There are a wide range of different instant messaging services that are supported
    in Linspire. Before you can begin instant messaging, you''ll need to set up an
    account with one of these providers. Not all messaging services can communicate
    with one another, so I would recommend finding out what services your friends
    use; otherwise, with AIM as it is the most popular. The following instructions
    will show you how to create an AIM account, but the process of creating an account
    with other providers is similar.


    - 1. Click the Web Browser button in the Quick Launch bar. The Web Browser will
    open.

    - 2. Type www.linspire.com/screenname in the Location bar.

    - 3. Click on the AIM link. You''ll be taken to a web page where you can create
    an account.

    - 4. Type in a desired screen name. Keep in mind that there are millions of users
    of AIM so you''ll have to create a fairly unique ID or it''s a good likelihood
    someone already has it.

    - 5. Type and re-type your password in the fields provided. It will appear as
    a series of stars.

    - 6. Type in your e-mail address in the field provided.


    # Creating an Instant Messaging Account


    - 7. Click the drop-down arrows to enter the day, month, and year of your birth
    date.

    - 8. Type in the word that you see in the graphic. This is a security feature
    that prevents computers from creating automatic accounts.

    - 9. Click the Submit button.


    > There''s a good likelihood that the screen name you chose is taken as there
    are millions of users. If a screen appears telling you your name is taken, simply
    enter a new one.

    - 10. Close the web browser when the screen appears. You are now ready to launch
    instant messenger.


    # Logging Into Instant Messenger


    Now that you have an account created, the hard part is over. Logging into Instant
    Messenger is just a matter of entering your username and password. This first
    time you launch the program, you will have to add your username and profile to
    the accounts list.


    - 1. Click on the Instant Messenger icon in the Quick Launch bar. Both the Login
    window and Accounts will appear.

    2. Click the Add button. The Add Account dialog box will appear.

    - 3. Click on the down arrow beside Protocol. A list of instant messenger providers
    will appear.

    4. Click on the profile associated with your username and password. For example,
    if you signed up for an AIM account, click the AIM/IC option.

    5. Type in your username, password and alias in the fields provided.


    # Logging Into Instant Messenger


    6. Click the check box beside Remember password. This way you won''t be prompted
    for your password when login.

    7. Click the check box beside Auto-login if you don''t want to enter your account
    and password when you start Instant Messenger. Check this option if you have one
    account.

    8. Click the Open button. You can now choose a photo to use as your buddy icon.
    This is the image people will see in their messenger window when chatting with
    you.

    9. Navigate to the location that contains the image you would like to use as your
    buddy icon.

    10. Click on the desired photo. It will be highlighted.

    11. Click Open. The file will be selected as your buddy icon.

    12. Click Save. The account will be added to the Accounts list.

    13. Repeat Steps 2 - 12 to add any other accounts you may have created.


    # Chapter 13 Instant Messaging


    14. Click the Close button to close the accounts when you are finished adding
    accounts.

    15. Select your account from the Accounts drop-down list.

    16. Type your password if it does not already appear.

    17. Click Sign on. Now you will be signed on. The first time you sign on you will
    be prompted to sign up for a free SIP account. If this is something you''re interested
    in, you can proceed with creating an account, otherwise click the Close button
    in the window that appears.


    # Chatting Acronyms


    Because instant messaging is intended to be a quick and convenient way of communicating,
    several acronyms have become widely used and accepted. It is wise to understand
    these acronyms before you begin chatting so you are not dumbstruck the first time
    you see them. Here is a sampling of the most popular:


    - LOL. Laugh out loud | GL. Good luck | RUOK? Are you OK?

    - BRB. Be back right | HTH. Hope this helps | THX. Thanks

    - CFN. Ciao for now | IMS. I am sorry | NP. No problem

    - FYI. For Your Information | ROTFL. Rolling on the floor laughing | YT? You be
    there?


    A long list of common acronyms that can be used in instant messaging can be found
    at www.aim.com.


    # Adding Buddies


    Before you can begin chatting, you''ll need someone to chat with. If you have
    friends already using instant messaging you can add their screen names to your
    buddy list.


    - 1. Click Buddies from the menu bar. A list of options will appear.

    - 2. Click Add Buddy... The Add Buddy dialog box will appear.

    - 3. Type in the screen name of your buddy. This is the only field that you must
    enter; all others are optional.

    - 4. Type a nickname or alias for your buddy if desired. It''s a good idea to
    type a nickname if the screen name of the person you are adding is obscure that
    you wouldn''t know who it was just by looking at it.

    - 5. Click the down arrow and select a group that you would like to add this buddy
    to. You''ll be learning more about creating groups later in this chapter.

    - 6. Click the Add button to add your buddy to your list.

