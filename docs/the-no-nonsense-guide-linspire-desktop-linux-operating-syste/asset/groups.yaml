- md: '

    ## Accessing the Network from Your Desktop


    Whenever you create a mount to a shared folder on your network, an icon will appear
    on your desktop with a shortcut to that folder on the network.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_283_0.png)


    - 1. Double-click on the Remote Share icon on the desktop. The File Manager will
    be open, revealing the contents of the shared folder on the network.


    ## Accessing the Network from the File Manager


    When you launch the File Manager, it opens to the Home folder. Within the Home
    folder you''ll find a direct shortcut to your network.


    - 1. Click on the File Manager icon on the Quick Launch bar. The File Manager
    will open.


    - 2. Click on the Network Shares shortcut. All of the shared folders on your network
    will now be displayed, regardless of what workgroup they belong to.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_283_1.png)


    ## Accessing the Network


    Files and folders on your network can be moved, copied, pasted and opened like
    any other files on your computer. See the chapter "File Management" to review
    these features.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_284_0.png)


    ## Accessing the Network from Dialog Boxes


    Whenever you open or save a file in almost any program, a dialog box appears where
    you can navigate your computer to select the appropriate folder. When you have
    a network set up, you can access shared folders on the network directly from these
    dialog boxes. The beauty of that is, rather than having to run around the house
    with disks when you want to open or save a file from a different computer, you
    can access them directly from your network.


    - Access an Open or Save dialog box from within any program. In this example,
    we''re using the Open dialog box from Lphoto. The dialog boxes in each program
    are slightly different, but most give you access to your network.


    - Click on the Network option. A list of folders that are available on your network
    will appear. You can then select these folders like you would any other folder
    on your local hard drive.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_284_1.png)


    The dialog boxes in some programs do not provide you with a direct link to your
    network. When browsing, you can find all the computers in your network in the
    folder /root/Network.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_284_2.png)


    ## Getting Help


    Help? What do you need help for? You''ve got this book! Believe it or not this
    book doesn''t cover all the answers to Linspire. Truth be told, it would take
    a series of encyclopedias to cover all of the possible topics, configurations,
    and potential situations that may arise from your Linspire computer. If you get
    stuck along the way, don''t worry as Linspire has a variety of ways to help you
    dust off and get back on your feet again.


    The first thing that you need to determine is what type of learner you are. Do
    you prefer to sit back and relax as someone explains things to you, or do you
    like to dig right in and help yourself, or do you prefer to read about a topic
    thoroughly to understand it? Regardless of the type of learner you are, Linspire
    has a solution for you.


    In this chapter we''ll cover:


    - Asking Linspire support for help

    - Navigating the FAQs

    - Searching the knowledgebase


    ![](img/3926ca1fb00de3af845faa03d2c351e5_286_0.png)


    ## Using the Knowledgebase


    Although the technology in Linspire may seem new to you, understand that there
    are many people who forged a path before you, and you can benefit from their experience.
    Within Linspire there is a knowledgebase that is filled with answers to questions
    that have been previously asked. If you''re having a problem, there''s a good
    likelihood that someone else has had this problem in the past and that the answer
    is in the knowledgebase. You can quickly search the knowledgebase for a question
    that is similar to yours to see if an answer has been provided. Typically, the
    knowledgebase is the first place you should go for help.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_287_0.png)


    - 1. Click the Help Center button. A menu of help options will appear.

    2. Click Online Support. The Web Browser will launch and open to the Linspire
    support page.

    3. Type the keywords of your question in the field. For example, if you were having
    a problem with your modem, you would type the word modem in the field.

    4. Click the Go button. The knowledgebase will search for questions that have
    the word modem in them.


    The Linspire Knowledgebase is a web-based support feature. This means that you
    must be connected to the Internet in order to take advantage of this help feature.


    ## Using Community Forums


    287


    ![](img/3926ca1fb00de3af845faa03d2c351e5_288_0.png)


    - 5. Scroll through the forum to see if there is one similar to yours.

    - 6. Click on the keyword. The screen will show all posts that contain that keyword.

    - 7. Click on a post. You will now be able to view the thread.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_288_1.png)


    - 8. Review the thread. If you don''t find the answers you are looking for, you
    can either create your own post, or as covered in the next section or you can
    contact Linspire support directly.


    ## Community Forums


    People who use Linux operating systems are a tight-knit group. The community is
    a place where users can share tips and also pose questions for others.


    ## Viewing the Forum


    289


    The best way to learn more about Linspire and find answers to your questions is
    to simply browse the forum. The forum is broken down into hierarchy. At the top
    you have categories. Within the categories, you have posts. A post is a comment
    or question that someone has posted. The discussion is all the responses people
    have made.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_289_0.png)


    - 1. Click the Help Center button. A menu of help options will appear.

    - 2. Click Community Forums. The Web Browser will launch and open to the Linspire
    community page.

    - 3. Scroll through the different categories until you find one of particular
    interest.

    - 4. Click on a category. A variety of posts that fall under that category will
    appear.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_289_1.png)


    - 5. Click on a post. You will now be able to read the entire thread.


    ## Searching the Forum


    290


    ![](img/3926ca1fb00de3af845faa03d2c351e5_290_0.png)


    If you''ve run across a problem that you couldn''t find an answer for the support
    page, the next best place to look is the forum. There''s a good likelihood that
    if you are having a problem, others have experienced this and that there is a
    discussion that covers the solution. Within the forum you have the ability to
    search for a specific topic rather than simply browsing.


    - Click on the Support tab. This will take you back to the main support page regardless
    of where you are in the forum.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_290_1.png)


    - Scroll down until you see a section called Step 3, Visit our community forums.

    - Type in a keyword for the subject you are trying to get help. For example, if
    you are having trouble with your modem, type in the word modem.

    - Click Go. All of the posts that have the word modem in them will appear. You
    can then scroll through and click on any of the posts to view their threads.

