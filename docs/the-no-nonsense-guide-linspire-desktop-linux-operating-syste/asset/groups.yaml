    ## Setting Up a Home Network


    Setting up a home network isn''t as hard as it may seem, and the benefits far
    outweigh the investment it takes to get your network up and running. There are
    entire books dedicated to the subject, but here we will just cover the basics.


    As far as hardware is concerned there are only a few things that you need. First
    and foremost is more than one computer, and all of the computers must have an
    Ethernet connection. Although it is possible to set up a home network through
    a dial-up modem, that goes beyond the scope of this book. The computers should
    also all be connected through a router, either by cable or a wireless connection.


    Once the hardware is set up, you configure your network. How a network is configured
    depends on the operating system of all the computers on the network. Linspire
    itself will automatically recognize all other computers on a network.


    ## The Network Share Manager


    The Network Share Manager is really your one-stop shop for setting up and viewing
    computers on your network. Within the Network Share Manager, you can look for
    computers, view their shared folders and set up a network.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_275_0.png)


    - 1. Double-click the Network Browser icon on your desktop. The Network Share
    Manager will open.


    ## Finding Computers on Your Network


    Linspire will automatically recognize all of the computers that are attached to
    your network.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_276_0.png)


    - 1. Double-click on Entire Network.

    All of the workgroups on your network will appear. A workgroup is simply a category
    name that you give to a group of computers, files or folders that belong to a
    network. Later you''ll learn to create and name a workgroup.

    - 2. Double-click on a workgroup.

    All of the computers on the network that fall under that workgroup will appear.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_276_1.png)


    - 3. Double-click on a computer. All of the folders on that computer that are
    shared and available to network users will appear.


    ## Mounting a Share


    In order for you to view the contents of a folder on your network, the folder
    must first be mounted. Mounting basically means to install that folder so that
    it is viewable from your computer. Once a folder is mounted, you can view its
    contents as if the folder was actually on your computer, rather than on the network.
    You''ll be able to access this shared program from the File Manager, your desktop
    or from any application that allows you to open files. You only have to mount
    a share once. Once it is mounted, you will always have access to it.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_277_0.png)


    - 1. Double-click on the folder that you would like to view. The share dialog
    box will appear. All of the details already should be filled in as your computer
    recognizes it on the network.

    - 2. Click OK. The folder will be added to your computer and the File Manager
    will launch, showing you the contents of that folder. An icon has also been added
    to your desktop so that you can always get back to this folder, which is called
    a remote share.


    ## Mounting Your Linspire Computer


    Not only can you view files and folders from other computers on the network, but
    you can also make the files and folders on your Linspire computer available to
    other machines connected to the network. Before you share folders, however, you
    will first need to mount your computer onto the network.


    ## Finding Your Computer Name


    In order to mount your computer, you will need the name you gave to your Linspire
    computer when it was first installed. If you didn''t install the operating system
    yourself, the computer name can be found in the Control Center by following these
    steps.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_278_0.png)


    ## Setting a Network Password


    The network you set up needs to be secure to avoid unwanted, uninvited visitors.
    Imagine the damage that could be done if someone had full access to your computer.
    For this reason, a password for networking needs to be set before you can mount
    your computer.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_279_0.png)


    - 1. Click Launch | Settings. A submenu will appear.

    - 2. Click Additional Options. Another submenu will appear.

    - 3. Click Change Password. The Change password dialog box will appear.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_279_1.png)


    - 4. Click the radio button beside File Sharing Password.

    - 5. Type a password for file sharing. Make sure it is a password that you''ll
    remember.

    - 6. Type the same password in the Verify field.

    - 7. Click OK. The dialog box will close. Click OK again when a confirmation dialog
    box appears.


    ## Creating a Mount for Your Computer


    Now that you know your computer''s name and your User ID and password, you have
    all the necessary to share your computer.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_280_0.png)


    - 1. Click Launch | Settings. A submenu will appear.

    - 2. Click Additional Options. Another submenu will appear.

    - 3. Click Change Password. The Change password dialog box will appear.

    - 4. Click the radio button beside File Sharing Password.

    - 5. Type a password for file sharing. Make sure it is a password that you''ll
    remember.

    - 6. Type the same password in the Verify field.

    - 7. Click OK. The dialog box will close. Click OK again when a confirmation dialog
    box appears.


    ## Sharing Folders


    When you mounted your computer, you selected one folder to share. You can make
    any folder on your computer accessible on the network. There are a variety of
    ways in which folder can be shared, but the easiest is through the File Manager.


    ## Chapter 14 Home Networking


    When you restart your computer, your network shares will be disconnected. To reconnect
    to the shares, click the desired in the Network Manager.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_281_0.png)


    - 6. Type in your username and password for your network.

    - 7. Click OK. Your computer will now be mounted.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_281_1.png)


    - 1. Click on the File Manager icon in the Quick bar. The File Manager will launch.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_281_2.png)


    - 2. Navigate to the folder that contains a folder that you would like to share.
    More on navigating for files and folders can be found in the chapter titled "File
    Management."

    - 3. Right-click on the folder that you would like to share. A menu will appear.

    - 4. Click Share. A dialog box will appear.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_282_1.png)


    - 5. Click the check box entitled Share this folder in the local network. A variety
    of options will now become available.

    - 6. Click the check box if you want to give access to this folder to Linux-based
    or Unix-based computers on the network.

    - 7. Click the Share with Samba check box if you want to give access to this folder
    to Microsoft Windows-based computers on the network.

    - 8. Click OK. The folder will now be accessible on the network.

    '
  mdcn: '


    ## 设置家庭网络


    设置家庭网络并没有想象中那么困难，而且它的收益远大于运行网络所需的投入的投入。虽然有整本书都在专门介绍这个主题，但在这里我们只介绍基础知识。


    在硬件方面，你只需要几样东西。首先，重要的是要有至少一台计算机，并且所有计算机都必须有以太网连接。虽然可以通过拨号调制解调器建立家庭网络，但这超出了本书的范围。计算机还应该通过路由器连接，无论是通过电缆还是无线连接。


    硬件设置好后，就可以配置网络了。网络如何配置取决于网络上所有计算机的操作系统。Linspire 本身会自动识别网络上的所有其他计算机。


    ## 网络共享管理器


    网络共享管理器是你设置和查看网络上计算机的一站式平台。在网络共享管理器中，你可以查找计算机、查看它们的共享文件夹并设置网络。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_275_0.png)


    - 1. 双击桌面上的“网络浏览器”图标。网络共享管理器将打开。


    ## 在网络上查找计算机


    Linspire 会自动识别连接到你网络的所有计算机。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_276_0.png)


    - 1. 双击“整个网络”。

    你网络上的所有工作组都将出现。工作组只是你给一组属于网络的计算机、文件或文件夹命名的分类名称。稍后你将学习如何创建和命名工作组。

    - 2. 双击某个工作组。

    网络上属于该工作组的所有计算机都将出现。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_276_1.png)


    - 3. 双击某台计算机。该计算机上所有共享并供网络用户的文件夹都将出现。


    ## 挂载共享


    为了让你查看网络上文件夹的内容，必须先对该文件夹进行挂载。挂载基本上意味着安装该文件夹，使其可以在你的计算机上查看。一旦文件夹被挂载，你就可以查看它的内容，就像该文件夹实际上在你的计算机上，而不是在网络上一样。你可以从文件管理器、桌面或任何允许打开文件的应用程序访问此共享程序。你只需要挂载一次共享。一旦挂载，你将始终可以访问它。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_277_0.png)


    - 1. 双击你想要查看的文件夹。将出现共享对话框。由于你的计算机在网络上识别了它，所有细节都应该已经填写完毕。

    - 2. 点击“确定”。文件夹将添加到你的计算机中，文件管理器将启动并向你显示该文件夹的内容。桌面上也添加了一个图标，以便你随时回到这个文件夹，这被称为“远程共享”。


    ## 挂载你的 Linspire 计算机


    你不仅可以查看网络上其他计算机的文件和文件夹，还可以让你的 Linspire 计算机上的文件和文件夹对连接到网络的其他机器可用。但是，在共享文件夹之前，你首先需要将你的计算机挂载到网络上。


    ## 查找你的计算机名称


    为了挂载你的计算机，你需要你初次安装 Linspire 计算机时给它起的名称。如果你不是自己安装的操作系统，可以在“控制中心”按照以下步骤找到计算机名称。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_278_0.png)


    ## 设置网络密码


    你设置的网络需要是安全的，以避免不受欢迎、未经邀请的访客。想象一下，如果有人完全访问你的计算机会造成多大的损害。因此，在挂载计算机之前，需要设置网络密码。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_279_0.png)


    - 1. 点击“启动 | 设置”。将出现一个子菜单。

    - 2. 点击“其他选项”。将出现另一个子菜单。

    - 3. 点击“更改密码”。将出现“更改密码”对话框。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_279_1.png)


    - 4. 点击“文件共享密码”旁边的单选按钮。

    - 5. 输入文件共享密码。确保这是一个你记得的密码。

    - 6. 在“验证”字段中输入相同的密码。

    - 7. 点击“确定”。对话框将关闭。当出现确认对话框时，再次点击“确定”。


    ## 为你的计算机创建挂载


    现在你已经知道了计算机的名称、用户 ID 和密码，你拥有了共享计算机的所有必要条件。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_280_0.png)


    - 1. 点击“启动 | 设置”。将出现一个子菜单。

    - 2. 点击“其他选项”。将出现另一个子菜单。

    - 3. 点击“更改密码”。将出现“更改密码”对话框。

    - 4. 点击“文件共享密码”旁边的单选按钮。

    - 5. 输入文件共享密码。确保这是一个你记得的密码。

    - 6. 在“验证”字段中输入相同的密码。

    - 7. 点击“确定”。对话框将关闭。当出现确认对话框时，再次点击“确定”。


    ## 共享文件夹


    当你挂载计算机时，你选择了一个共享的文件夹。你可以让计算机上的任何文件夹在网络上可用。共享有多种方法，但最简单是通过文件管理器。


    ## 第 14 章 家庭网络


    当你重启计算机时，网络共享将断开连接。要重新连接共享，请在“网络管理器”中点击所需的。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_281_0.png)


    - 6. 输入你的网络用户名和密码。

    - 7. 点击“确定”。你的计算机现在已挂载。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_281_1.png)


    - 1. 点击快速栏上的“文件管理器”图标。文件管理器将启动。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_281_2.png)


    - 2. 导航到包含你想共享的文件夹的文件夹。更多关于导航文件和文件夹的知识可以在“文件管理”章节找到。

    - 3. 右键点击你想共享的文件夹。将出现一个菜单。

    - 4. 点击“共享”。将出现一个对话框。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_282_1.png)


    - 5. 点击“在局域网中共享此文件夹”复选框。现在将可以使用各种选项。

    - 6. 如果你想让网络上的基于 Linux 或 Unix 的计算机访问此文件夹，请勾选复选框。

    - 7. 点击“与 Samba 共享”复选框，如果你想让网络上的基于 Microsoft Windows 的计算机访问此文件夹。

    - 8. 点击“确定”。该文件夹现在可以在网络上访问了。


    '
