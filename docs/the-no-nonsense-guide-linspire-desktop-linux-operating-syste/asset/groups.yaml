- md: "\n# Chapter 15 Getting Help\n\n- 7. Click Accept Connection. Your invitee will\
    \ now have complete access to your desktop.\n\nWhen the person you are sharing\
    \ your desktop with closes their VNC client, you will get a message in your system\
    \ tray notifying you that your desktop is no longer being shared.\n\n## Viewing\
    \ Desktops\n\nNot only can you share your desktop with Linspire, but you can also\
    \ view the desktops of others.\n\n- 1. Click Launch | Run Programs | Utilities.\
    \ A list of utility programs will appear.\n- 2. Click Desktop Sharing | Connect\
    \ to Remote Desktop. A dialog box will appear where you can enter the host number.\n\
    \n## Sharing Desktops\n\n- 3. Type in the host number that you were provided from\
    \ the person who is sharing their desktop.\n- 4. Click Connect. A dialog box will\
    \ appear where you can select your type of Internet connection.\n- 5. Click the\
    \ drop-down arrow to see a list of different types of Internet connections.\n\
    - 6. Click the option that matches your type of connection.\n- 7. Click OK. The\
    \ person on the other end sharing their desktop will get a notification that you\
    \ are trying to access their desktop. As soon as they accept, a window will appear\
    \ where you will need to type the password they provided you.\n\n## Printers\n\
    \nNo operating system is an island, and Linspire is no exception. Typically you\
    \ have several devices that work alongside your computer to make sure it is a\
    \ complete solution to your needs. The most common of these devices is a printer.\n\
    \nLet's face it, as convenient as computers are, most of us prefer to read documents\
    \ from a piece of paper rather than a monitor. To do this, you need a printer\
    \ installed and configured for your system. Linspire makes it easy for you to\
    \ set up printers and other types of hardware that you'll use alongside your computer.\n\
    \nIn this chapter we'll cover:\n\n- Setting up a printer\n- Printing documents\n\
    \n# Chapter 16 Printers\n\n## Adding a Local Printer\n\nDespite of what you've\
    \ heard, a local printer is not that one that was born and lives in your city.\
    \ That was a poor attempt at a joke, I apologize. A local printer is actually\
    \ one that is connected directly to your computer. Turn on your printer and make\
    \ sure it is connected to your computer before you begin.\n\n- 1. Double-click\
    \ the Printers icon on the desktop. This will open the Printers window where you\
    \ can add a printer.\n- 2. Click the Add button. A menu will appear.\n- 3. Click\
    \ Add printer/class... The Add Printer wizard will appear and step you through\
    \ the installation process.\n- 4. Click on Next. This will take you to the next\
    \ step in the wizard.\n- 5. Click on the radio button beside the Local printer\
    \ option.\n- 6. Click on Next. The computer will now scan all the ports to look\
    \ for a printer connected to your machine.\n\n> If you have a home network configured,\
    \ you can select one of the network options to connect to a shared network printer.\n\
    \n- 7. Click on the desired port selection. The port selection will depend on\
    \ the type of printer connection you have. It can be Parallel, USB or if it's\
    \ an older printer it may be Serial.\n- 8. Click on Next. You'll proceed to the\
    \ Printer model selection screen, where you'll be able to choose the model of\
    \ your printer.\n- 9. Click on the manufacturer of your printer in the Manufacturer\
    \ area of the window. A list of models that they make will appear in the Model\
    \ area of the window.\n- 10. Click on the model of your printer. If you can't\
    \ find your model, click on Other and select a model from the disk that came with\
    \ the printer.\n- 11. Click on Next. You'll proceed to the Driver selection screen,\
    \ where you can select the driver for your printer.\n- 12. Click on the appropriate\
    \ driver. Typically one of the drivers will say recommended. If that is the case\
    \ with the printer selected, choose that option. If it's the wrong driver, you\
    \ can change it after testing.\n- 13. Click Next. You will proceed to the next\
    \ screen of the wizard, where you can test your printer.\n- 14. Click on Test.\
    \ This will print a test page to confirm that your printer is working properly.\n\
    - 15. Click OK to close the dialog box that appears after the test page has been\
    \ sent to the printer.\n- 16. Click Next if the test page printed normally. You'll\
    \ proceed to the Banner selection screen. Alternatively, click on Back if the\
    \ test did not print out, then select a different driver.\n- 17. Click Next. Typically\
    \ you don't need to print banners before or after your print job. You will proceed\
    \ to the Printer quota settings screen.\n- 18. Click Next, unless you want to\
    \ set a quota for your printer. This means you limit the number of pages printed\
    \ in a certain period and the size of files that are allowed to be printed. You\
    \ will proceed to the Users settings screen.\n- 19. Click Next, unless you want\
    \ to limit who can use the printer. If so, you can set this in this screen. You\
    \ will proceed to the General information screen.\n- 20. Type a name for the printer\
    \ in the Name text box. The name cannot have any spaces in it.\n- 21. Click Next,\
    \ and you'll be taken to the Confirmation screen.\n- 22. Click Finish after you've\
    \ reviewed the settings. Your printer will now be set up and ready for printing.\n\
    \n## Printing\n\nPrinting works the same in almost every application that supports\
