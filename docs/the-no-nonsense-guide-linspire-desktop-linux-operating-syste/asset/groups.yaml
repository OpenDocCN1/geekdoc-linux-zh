    information about your photo.


    +   2. Type a name for your photograph.


    +   3. Click the up or down arrows to adjust the time and date.


    +   4. Click in the Rating box to add a star rating to your photo. Keep clicking
    to the right to add more stars. Clicking on a star after it will remove it.


    +   5. Type any comments that you would like to add about your photo.


    > You can add photos to your library at any time by using the keyboard. Press
    Ctrl+O to bring up the Open dialog box from which you can select photos to import
    into the library.


    # Sorting Photos


    The beauty of digital photos is that you can take as many photos as you like without
    having to develop them, which typically means that you''ll have hundreds of thousands
    of photos. This can prove to be a problem when trying to find a particular image.
    Lphoto gives you several options for sorting your images to make them easier to
    find.'
  - '[PAGE 179]


    # 178


    # Chapter 8 Using Multimedia Programs


    ![](img/3926ca1fb00de3af845faa03d2c351e5_179_0.png)


    +   1. Click on the album that you would like to sort. Alternatively you can click
    on the Photo Library to sort all of your pictures.


    +   2. Click View | Arrange Photos. A submenu will appear.


    +   3. Click on the desired option. They include by Date, by Title and by Rating.
    The photos will now be sorted by the method you selected.


    # Creating Slide Shows


    Lphoto allows you to display your images as a full-screen slide show and gives
    you some control over how the slide shows are displayed.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_179_1.png)


    +   1. Click on the name of the album that contains the pictures you would like
    to view in a slide show. Alternatively you could click on the Photo Library to
    include all of your pictures in a slide show.


    +   2. Click on the Organize tab if it is not already selected.


    +   3. Click on the Slide Show button. A dialog box will appear where you can
    set certain options for the show.'
  - '[PAGE 180]


    # Working with Photos


    ![](img/3926ca1fb00de3af845faa03d2c351e5_180_0.png)


    +   4. Click the up and down arrows to adjust the length of time each image is
    displayed before the next one appears.


    +   5. Take note of the keyboard commands for controlling your slide show.


    +   6. Click on the Play SlideShow... button. The slide show will begin to play.


    +   7. Press the Esc key on the keyboard to end the slide show.


    # E-Mailing Photos


    One of the most convenient ways of sharing your photos with others is by e-mail.
    The only problem with e-mail is that you are typically limited to the size of
    a file you can attach to your message. Lphoto solves this problem by allowing
    you to resize your pictures to make them e-mailable before they are sent.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_180_1.png)


    +   1. Click on the photo that you would like to e-mail. It will be highlighted.


    +   2. Click the Organize tab if it is not already selected.


    +   3. Click the Send EMail button. A dialog box will appear where you can adjust
    the image file size.'
  - '[PAGE 181]


    # Chapter 8 Using Multimedia Programs


    ![](img/3926ca1fb00de3af845faa03d2c351e5_181_0.png)


    +   4. Take note of the size of the picture. If it is greater than 2000 KB proceed
    to Step 5 and 6 to resize. Otherwise jump to Step 7.


    +   5. Click on the Image Size drop-down menu. A list of options will appear.


    +   6. Click Medium to make the size smaller.


    +   7. Note the new file size. If it is still larger than 2000 KB repeat Steps
    5 and 6, selecting a smaller option.


    +   8. Click Send E-Mail... The E-Mail Client will launch the photo that you selected
    will be loaded as an attachment to a message. You can then proceed to type in
    your e-mail message, select a recipient and send the e-mail.


    > If you haven''t already configured the E-Mail Client, you''ll be prompted to
    do so when attempt to send a picture. Instructions on doing this can be found
    in the chapter titled "E-Mail."


    ![](img/3926ca1fb00de3af845faa03d2c351e5_181_1.png)


    # Adding Photos to the Desktop


    In the chapter titled "Personalizing & Customizing Lin불어" you learn how to use
    an image as the background for your desktop. Lphoto provides you with a method
    to instantly change the background image to any photo in your library.'
  - '[PAGE 182]


    # Working with Photos


    181


    ![](img/3926ca1fb00de3af845faa03d2c351e5_182_0.png)


    +   1. Click on the photo that you would like to use as your background image.


    +   2. Click the Organize tab if it is not already selected.


    +   3. Click the Desktop button. The photo you selected will now be your desktop
    background image.


    # Fixing Photos


    Lphoto provides you with a variety of different tools to help you touch up your
    photos. All of these effects can be applied at the touch of a button.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_182_1.png)


    +   1. Double-click on the photo that you would like to edit.


    +   2. Click on the Edit tab. You''ll be presented with different editing options.


    +   3. Click on the Enhance button. Lphoto will automatically adjust the colors
    and brightness of your image.


    +   4. Click the B & W button to convert your image to black and white.


    +   5. Click the Revert button at any time to bring your image back to its original
    state.'
  - '[PAGE 183]


    # Importing Photos from a Digital Camera


    If there is an easier way using Lphoto to get pictures from your digital camera
    onto your computer, I certainly haven''t found it. With a few clicks of the mouse
    button, all of your photos will be downloaded into the program.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_183_0.png)


    +   1. Connect your digital camera to the computer and turn it on.

    2. Click the Import tab. You will now see options for importing photos.

    3. Click the Rescan button. Lphoto will scan your computer looking for any digital
    cameras that are attached and turned on.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_183_1.png)


    +   4. Click the Import button. All of the photos on the digital camera will be
    imported to the Photo Library.

    5. Click on the desired button in the dialog box that appears. Clicking the "Yes,
    delete the images." button will delete the images on the digital camera, while
    clicking the "No" will leave them on the camera.'
  - '[PAGE 184]


    # Connecting to the Internet


    There''s a good likelihood that the bulk of the time that you spend on your computer
    will be used surfing the web, e-mailing, chatting or downloading files. To get
    access to the wonderful world of the Internet you will have to configure your
    connection. In some cases, this is simply a matter of plugging in your network
    cable and you are off and running. In other cases you''ll need to configure your
    computer for use with an Internet Service Provider (ISP). Whether you are using
    a dial-up modem, a cable modem or some other broadband connection, Linsp makes
    it relatively easy to connect to the Internet.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_184_0.png)


    There are also a variety of troubleshooting tools you can use should you come
    across some issues while trying to connect to the Internet. Once you are connected,
    you''ll be able to explore the features described in the following chapters including
    surfing the web, e-mailing, and chatting.


    In this chapter we''ll cover:


    +   - Setting up a dial-up connection

    - Configuring a broadband connection

    - Troubleshooting connection issues'
  - '[PAGE 185]


    # Selecting an Internet Service Provider


    If you do not already have an ISP, Linspired gives you a range of choices that
    you can use to sign up with, directly from your computer. The beauty of using
    one of these providers is that Linspired has done their homework and selected
    those ISPs that work well in a Linux environment.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_185_0.png)


    +   1. Click Launch | Run Programs | Internet. A submenu of Internet options will
    appear.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_185_1.png)


    +   2. Click Internet Connection Tools and then click on one of the desired ISPs.
    There will be several to choose from. Depending on the ISP you select, what happens
    next will differ. Typically, a wizard will appear you step-by-step through the
    process of creating an account with ISP. Simply follow the on-screen instruction
    for creating an account.'
- md: '

    ## Configuring a Dial-Up Connection


    If you are using a dial-up connection, you''ll need to obtain some information
    from your ISP before you properly setup your Internet connection. This information
    includes the access phone(s) of your provider, your user name and your password.
    There is one other essential component that you''ll need in order to use a dial-up
    connection - a modem! It may seem obvious, but not all Linsp computers come with
    a modem, so ensure that you not only have a modem, but that the phone line is
    connected.


    - 1. Click Launch | Run Programs | Internet. A submenu of Internet options will
    appear.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_186_0.png)


    - 2. Click Internet Connection Tools | Internet Dial-Up Tool. The Internet Dial-Up
    Tool dialog box will appear.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_186_1.png)


    > You may be asking yourself


    ![](img/3926ca1fb00de3af845faa03d2c351e5_187_0.png)


    - 3. Click on the Configure… button. A dialog box will appear where you can configure
    your connection.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_187_1.png)


    - 4. Click on the Accounts tab if it is not already selected. You can now create
    a new account.


    - 5. Click the New… button. The New Account dialog box will open where you will
    create a name and add the phone number for your connection.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_187_2.png)


    - 6. Type a name for your connection. You can give it any name, but typically
    this would be the name of your ISP, e.g. AOL, Earthlink, Net Zero, etc.


    - 7. Click on the Add button. You will now be able to add the access phone number
    that was provided from your ISP.


    - 8. Type the number and click OK. The access number will be added.


    - 9. Repeat Steps 9 - 10 if there are any other access numbers that your ISP provided
    you with.


    - 10. Click OK. The account will now be configured. You must now configure your
    modem.


    - 11. Click on the Modems tab. If your modem appears in the list then you can
    skip to the next section.


    - 12. Click New. You will now be able to add your modem to the list.


    - 13. Type a name for your modem and use any of the drop-down menus to change
    the configuration of your modem if needed. You can also click the Modem tab to
    further configure your modem if necessary.


    - 14. Click OK. Your modem is set up.


    - 15. Click OK to close the Configuration dialog box. You will now be taken back
    to the Internet Dial-Up Tool dialog box, which you can leave open if you plan
    on connecting to the Internet now, or you can close it by clicking the Quit button.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_188_0.png)

    ![](img/3926ca1fb00de3af845faa03d2c351e5_188_1.png)


    ## Connecting with a Dial-Up Modem


    Once you have your connection and modem configured, dialing up is simply a matter
    of entering your user name and password.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_189_0.png)


    - 1. Click Launch | Run Programs | Internet. A submenu of Internet will appear.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_189_1.png)


    - 2. Click Internet Connection Tools | Internet Dial-Up Tool. The Internet Dial-Up
    tool dialog box will appear. Alternatively, if you see a dialer for your specific
    ISP, select that instead. For example, if you are using AOL, you would click AOL
    dialer.


    ## Disconnecting the Internet Connection


    - 3. Select your ISP from the drop-down list if you have more than one configured.

    - 4. Type your Login ID (also known as your User ID) and password in the fields
    provided.

    - 5. Click Connect. Your modem will now dial up your ISP and connect to the Internet.
    The dialog box will remain open, but it can be minimized. Once connected you can
    use any Internet-related feature like instant messaging, web browsing or e-mail.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_190_0.png)


    ## Disconnecting the Internet Connection


    Once you''re done using the Internet, it''s a good idea to disconnect as it will
    free up your phone line and you won''t use any more of your hours, if your ISP
    limits your usage.


    - 1. Click on the button in the Taskbar that represents your connection. A dialog
    box will appear.

    - 2. Click the Disconnect button. You will be disconnected from the Internet.

    - 3. Click the Close button to close the dialog box.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_190_1.png)


    ## Connecting with DSL


    If you have a DSL connection, you''ll need your account name and password from
    your ISP before you can properly configure your connection. With that information
    in hand, the rest is a breeze - just make sure your cable is connected to your
    computer before you begin.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_191_0.png)


    - 1. Click Launch | Settings | Control Center. The Control Center will open.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_191_1.png)


    - 2. Click the Internet & Network link. The screen will change to give you Internet
    options.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_192_0.png)


    - 3. Click on the Network Settings & Profiles link.

    - 4. Click on the Configuration Mode drop-down. A list of options will appear.

    - 5. Click on PPPoE. It will now be selected.

    - 6. Type in your account name and password in the fields provided.

    - 7. Click OK. A dialog box will appear, confirming that you would like to make
    those changes.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_192_1.png)


    - 8. Click the Yes button. A connection to the Internet will be made and you''ll
    be able to use all of the Internet-related tools.

    '
  mdcn: '


    ## 配置拨号连接


    如果你正在使用拨号连接，在正确设置 Internet 连接之前，你需要从你的互联网服务提供商（ISP）获取一些信息。这些信息包括提供商的接入电话、你的用户名和密码。使用拨号连接还需要另一个关键组件——调制解调器！这似乎是显而易见的，但并非所有的
    Linsp 电脑都配备了调制解调器，因此请确保你不仅有一个调制解调器，而且电话线已连接。


    - 1. 点击  | 运行程序 | Internet。将出现 Internet 选项的子菜单。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_186_0.png)


    - 2. 点击 连接工具 | 拨号工具。将出现 拨号工具对话框。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_186_1.png)


    > 你可能在问自己


    ![](img/3926ca1fb00de3af845faa03d2c351e5_187_0.png)


    - 3. 点击 配置…按钮。将出现一个对话框，你可以在其中配置你的连接。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_187_1.png)


    - 4. 如果尚未选中，请点击 账户 卡。你现在可以创建一个新账户。


    - 5. 点击 新…按钮。将打开 新账户对话框，你可以在其中创建一个名称并为你的连接添加电话号码。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_187_2.png)


    - 6. 为你的连接输入名称。你可以赋予它任何名称，但通常是 ISP 的名称，例如 AOL、Earthlink、Net Zero 等。


    - 7. 点击 添加按钮。你现在可以添加来自 ISP 提供的接入号码。


    - 8. 输入号码并点击 好。接入号码将被添加。


    - 9. 如果你的 ISP 还提供了其他接入号码，请重复步骤 9 - 10。


    - 10. 点击 好。账户现在已配置完成。你现在必须配置你的调制解调器。


    - 11. 点击 调制解调器 卡。如果你的调制解调器出现在列表中，你可以跳到下一节。


    - 12. 点击 新建。你现在可以将你的调制解调器添加到列表中。


    - 13. 为你的调制解调器输入名称，并根据需要使用任何下拉菜单更改调制解调器的配置。如有必要，你也可以点击 调制解调器 选项进一步配置你的调制解调器。


    - 14. 点击 好。你的调制解调器已设置。


    - 15. 点击 好 关闭 配置对话框。你现在将返回 拨号工具对话框，如果你计划现在连接 Internet，可以保持它打开，也可以点击 退出 按钮将其关闭。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_188_0.png)

    ![](img/3926ca1fb00de3af845faa03d2c351e5_188_1.png)


    ## 使用拨号调制解调器连接


    一旦你配置好连接和调制解调器，拨号只需输入你的用户名和密码。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_189_0.png)


    - 1. 点击  | 运行程序 | Internet。将出现 Internet 的子菜单。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_189_1.png)


    - 2. 点击 连接工具 | 拨号工具。将出现 拨号工具对话框。如果你看到特定的 ISP 拨号器，请选择它。例如，如果你使用的是 AOL。


    ## 断开 Internet 连接


    - 如果配置了多个账户，请选择你的 ISP。

    - 在提供的字段中输入你的登录 ID（即用户名）和密码。

    - 点击 连接。你的调制解调器将拨号并连接到 Internet。对话框将保持打开，但你可以将其最小化。连接后，你可以使用任何 Internet 相关功能，如即时消息或网页浏览。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_190_0.png)


    ## 断开 Internet 连接


    在使用 Internet 后，断开连接是一个好主意，因为它可以释放电话线，如果你的 ISP 时长。


    - 1. 点击任务栏上代表你连接的按钮。将出现一个对话框。

    - 2. 点击 断开按钮。你将与 Internet 断开连接。

    - 3. 点击 关闭 关闭对话框。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_190_1.png)


    ## DSL 连接


    如果你使用的是 DSL 连接，在正确配置连接之前，你需要 ISP 的账户和密码。有了这些信息，剩下的工作就简单了——只需在开始前确保电缆已连接到电脑。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_191_0.png)


    - 1. 点击  | 设置 | 控制中心。控制中心将打开。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_191_1.png)


    - 2. 点击 Internet 与网络 链接。屏幕将更改提供 Internet 选项。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_192_0.png)


    - 3. 点击 网络设置和配置文件链接。

    - 4. 点击 配置模式下拉菜单。将出现列表。

    - 5. 点击 PPPoE。它现在会被选中。

    - 6. 在提供的字段中输入你的账户名和密码。

    - 7. 点击 好。将出现一个对话框，确认你是否想要进行这些更改。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_192_1.png)


    - 8. 点击 是 按钮。将建立与 Internet 的连接，你将能够使用所有 Internet 相关工具。


    '
