    +   2. Click on the desired justification button. Your options include:


    +   - Justified – Lets you spread the text to the edges of the page for any full
    lines.


    +   - Align Right - Lets you align all of the text to the right side.


    +   - Centered - Lets you center the text on the page.


    +   - Align Left - Lets you align all of the text to the left side.


    # Numbering


    Ask many legal secretaries and they''ll tell you that they couldn''t live without
    this feature. Being able to number lines and paragraphs is important. There are
    a variety of different ways you can create numbered lists.


    # Auto-Numbered Lists


    By default, the auto-numbered lists feature is turned on. This feature allows
    you to create a numbered list automatically simply by using the Tab key.


    +   1. Type the number 1 and a period and then press the Tab key.


    +   2. Type in the text that you would like as your first line.


    +   3. Press the Enter key. The number 2. will automatically appear.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_113_1.png)'
  - '[PAGE 114]


