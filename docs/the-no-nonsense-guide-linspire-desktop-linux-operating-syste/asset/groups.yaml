    - Formatting worksheets

    - Creating charts


    ![](img/3926ca1fb00de3af845faa03d2c351e5_120_0.png)'
  - '[PAGE 121]


    # Launching Spreadsheet


    The entire OpenOffice suite is located in the Business & Finance section of the
    Launch Menu. All of the programs, including Word Processor, Spreadsheet, Drawings
    and Presentations can be found there.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_121_0.png)


    +   1. Click the Launch button and then click Run Programs. A list of categories
    will appear.

    2. Click Business & Finance. A submenu will appear.

    3. Click OpenOffice. Another submenu will appear.

    4. Click Opensheet to launch the Spreadsheet program.


    # Entering Data


    Once you have a spreadsheet open, you can begin entering data. Typically, data
    in a spreadsheet takes one of three forms, either text (sometimes this is referred
    to as a ''label''), numbers or formulas. The distinction between the three forms
    is how you enter them.


    # Entering Formulas


    To be considered a formula, the data that you enter must begin with an operator.
    The equals sign (=) is the operator that lets Spreadsheet know you are entering
    a formula. Formulas will be covered later in the chapter, but for now, it''s just
    important to note that an operator is needed to start a formula.'
  - '[PAGE 122]


    # Entering Data


    ![](img/3926ca1fb00de3af845faa03d2c351e5_122_0.png)


    +   1. Click once in the cell that you would like to add a formula to. It will
    be highlighted to indicate that it is selected.


    +   2. Type the equals sign (=) followed by the mathematical formula. The equals
    sign will appear in the cell and in the formula bar. Formulas are covered in detail
    later in the chapter.


    +   3. Click the check mark in the formula bar when you are finished entering
    your formula or simply press the Enter key on the keyboard. The results of the
    formula will appear in the cell.


    # Entering Text and Values


    Entering text and numbers into your cells is simply a matter of typing. Once you''ve
    selected the cell that you want to enter text into, the rest is a breeze.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_122_1.png)


    +   1. Click the cell into which you would like to add text or numbers. The cell
    will be highlighted


    +   2. Type your text. Ensure that it does not start with an equals (=) sign.


    +   3. Click the check mark in the formula bar when you are finished entering
    your formula or press Enter on the keyboard.'
  - '[PAGE 123]


    # Making Selections


    Before you can format, edit, or manipulate a cell or cells they must first be
    selected.


    # Clicking and Dragging


    Probably the quickest way to select one or a series of cells is to simply click
    and drag across them.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_123_0.png)


    +   1. Click any cell. The cell will be selected and an outline around the cell
    will appear.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_123_1.png)


    +   2. Click and drag across any cells that you would like to select. The selected
    cells will be highlighted.


    +   3. Click any cell to deselect the selection.'
  - '[PAGE 124]


    # Selecting Entire Rows or Columns


    At the top of every column and to the left of every row there is a letter or a
    number called the column or row heading. By clicking on these row or column headings
    you can select entire rows or columns.


    +   1. Click a row or column heading. The entire row or column will be selected.

    2. Click and drag across row or column headings. As you drag multiple rows and
    columns will be selected.

    3. Click any individual cell. This action will deselect your selection.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_124_0.png)


    > Pressing Ctrl+A on your keyboard will select all of the cells in your spreadsheet.
    Holding down the Ctrl key as you click lets select cells that aren''t together.


    # Worksheets


    The files you create in Spreadsheet are called notebooks. Within each workbook
    there are a series of worksheets where you can enter your data. These sheets are
    perfect for breaking up data into logical categories so your spreadsheet doesn''t
    become too confusing. By default, three worksheets are created in every new workbook.
    Spreadsheet allows you to create additional worksheets, name them, and organize'
  - '[PAGE 125]


    124 Chapter 6 Creating Spreadsheets


    # Accessing Sheets


    To access a worksheet you have to click the tab associated with it.


    +   1. Click on the tab associated with the worksheet you want to open. The worksheet
    will now become active.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_125_0.png)


    # Creating Sheets


    If you require more than the three worksheets that are created with every workbook,
    you can easily create and configure new ones from the Insert Sheet dialog box.


    +   1. Right-click on any tab. A menu will appear.

    2. Click Insert Sheet... The Insert Sheet dialog box will open.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_125_1.png)'
  - '[PAGE 126]


    # Worksheets


    3. Click the radio button beside the desired location for the new sheet, either
    before or after the current sheet.


    4. Click the up arrow key to increase the number of sheets you''d like to add.


    5. Type a name for your sheet if desired.


    6. Press Enter or click the OK button. The new sheet will be added to your workbook.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_126_0.png)


    > To change the order that worksheets appear, position your mouse pointer over
    the tab of the worksheets you want to move, and click and drag it before or after
    other tabs.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_126_1.png)


    # Naming Worksheets


    The names Sheet 1, Sheet 2, Sheet 3, etc. aren''t the most descriptive of names.
    You can rename the sheet tabs to something more appropriate.


    +   1. Right-click on the tab of any worksheet you would like to rename.


    +   2. Click Rename Sheet... A dialog box will open where you can rename your
    sheet.


    | 6 | Tuesday |

    | 7 | Wednesday |

    | 8 | Thursday |

    | 9 | Friday |


    ![](img/3926ca1fb00de3af845faa03d2c351e5_126_2.png)'
  - '[PAGE 127]


    # 126


    # Chapter 6 Creating Spreadsheets


    ![](img/3926ca1fb00de3af845faa03d2c351e5_127_0.png)


    +   3. Type a new name for the sheet.

    It''s a good idea to give the sheet a descriptive name.


    +   4. Press the OK button. The sheet will be renamed.


    # Deleting Sheets


    You can remove any sheet from your workbook. Just be careful when you delete the
    tab as you will lose all the data on that sheet.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_127_1.png)


    +   1. Right-click the tab of the sheet that you would like to remove. A menu
    will now appear.


    +   2. Click Delete. A dialog box will open to confirm that you want to delete
    the sheet and all of its contents.


    +   3. Click OK in the dialog box that appears. The dialog box confirms that you
    want to delete the sheet. The sheet will be removed.'
  - '[PAGE 128]


    # Adding or Deleting Rows and Columns


    # Adding or Deleting Rows and Columns


    Once you have entered data, you may find it necessary to add a row or a column
    to your sheet. You have the ability to add or delete single or multiple rows at
    any time.


    +   1. Click a cell or create a selection where you would like to add or delete
    a row or column. The number of cells you select will indicate how many rows or
    columns will be added or deleted.

    2. Right-click anywhere on your selection. A menu will appear.

    3. Click Insert Cells... The Insert dialog box will appear.

    Or

    3. Click Delete Cells... This will delete the selected rows or columns.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_128_0.png)


    +   4. Click the radio beside the selected option for inserting or deleting rows
    or columns.

    5. Click OK. The dialog box will close and rows or columns will be added or removed
    based on the settings you have entered.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_128_1.png)'
