    ![](img/3926ca1fb00de3af845faa03d2c351e5_118_1.png)


    +   1. Click Edit | Undo. The last action that you took will be undone.


    +   2. Repeat Step 1 until you have returned to the desired point in your document.


    > Ctrl+Z is the universal shortcut for the Undo command. Not only will it work
