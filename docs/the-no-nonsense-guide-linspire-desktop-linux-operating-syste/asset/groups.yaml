    - 8. Release the mouse button. They will be moved to that group.


    ## Chatting


    This is the easiest part. Simple double-click on the name of any buddy that is
    currently online and you can begin your chatting session. There are a variety
    of tools you can use to change how your information is displayed during the chat
    session.


    - Double-click on any buddy that is currently online. A window will appear where
    you can begin chatting.

    - Type your message in the bottom part of the window and press Enter. The text
    will appear in the top half of the window. Both you and the person you are chatting
    with will be able to see all the contents of the top half of the window.

    - View their reply. The screen name of the person you are chatting with will appear
    in red, while your name will appear in blue.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_266_0.png)


    ## Formatting Messages


    When you speak with someone on the phone, you are able to show emotion by changing
    the volume of your voice or by adding inflections. You can use formatting to convey
    your feelings and emotions when instant messaging. You can add little smiley icons
    to further convey your emotions.


    - Click and drag the message text that you would like to format. It will be highlighted.
    Alternatively, you can change formatting settings before you begin to type.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_266_1.png)


    ## Chapter 13 Instant Messaging


    2. Click any of the one-click formatting options including:


    - Bold

    - Italics

    - Underline

    - Decrease Font Size

    - Increase Font Size


    ![](img/3926ca1fb00de3af845faa03d2c351e5_267_0.png)


    3. Click the Font Face button if you want to change the font of the selected text.
    A dialog box will appear.


    4. Click on the desired font face, style and size. They will be highlighted when
    selected.


    5. Click OK. The font will be applied to the selected text.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_267_1.png)


    > Capitalizing all letters of a word is the equivalent of SHOUTING when instant
    messaging.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_267_2.png)


    ## Chatting


    ![](img/3926ca1fb00de3af845faa03d2c351e5_268_0.png)


    6. Click on the Foreground font color button if you want to change the color of
    your font. A dialog box will appear.


    7. Click anywhere on the circle to change the hue level.


    8. Click anywhere in the triangle to select a color.


    9. Click OK and the color will be applied.


    10. Repeat Steps 7 - 9 with the Background font color if desired.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_268_1.png)


    11. Click on the Insert smiley button. A menu of smiley emotion icons will appear.


    12. Click on the desired icon. It will be added to your message.


    ## Warning and Blocking Users


    There may be times when you are chatting with people unfamiliar to you and they
    may say something offensive. You have the ability to warn users to let them know
    that their comments are unwelcome. The person you are warning doesn''t have to
    know it''s you sending the warning as they can be sent anonymously. After repeated
    warnings, the user will not be able to send you messages. You also have the ability
    to block any users from sending you messages at all.


    ## Chapter 13 Instant Messaging


    ![](img/3926ca1fb00de3af845faa03d2c351e5_269_0.png)


    1. Click the Warn button. A dialog box will appear, confirming that you want to
    warn that user.


    2. Click the check box if you want to warn them anonymously. When you warn anonymously,
    your warning level goes up by 5%. Otherwise it goes up by 20%. When it reaches
    100%, they will no longer be able to send you messages.


    3. Click Warn. The dialog box will close and you will be returned to your session.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_269_1.png)


    4. Click the Block button if you want to block a user from sending you messages.
    A dialog box will appear, confirming that you want to block that user.


    5. Click Block. The user will no longer be able to send you messages.


    ## Sending Files


    One of the major limitations of e-mail is that you are typically limited to the
    file size that you can send as an attachment. Not so with Instant Messenger. You
    can send files as large as you want directly to the person you are chatting with.


    ## Chatting


    ![](img/3926ca1fb00de3af845faa03d2c351e5_270_0.png)


    1. Click Conversation. The Conversation menu appears.

    2. Click Send File... The Send File dialog box allowing you to select a file to
    transfer.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_270_1.png)


    3. Navigate to the folder that contains the file you would like to send.

    4. Click on the desired file. It will be highlighted.

    5. Click Open. The file will be sent to the recipient.


    ## Receiving Files


    While most e-mail programs have filters that disallow files from being accepted,
    Instant Messenger has no such filter. With that said, before you accept any files,
    make sure you know the person who is sending it to avoid potential viruses.


    ## Chapter 13 Instant Messaging


    1. Click the Accept button to accept the file that is being sent. Another dialog
    box will appear where you can choose to save the file.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_271_0.png)


    2. Type a new name for the file if you don''t want to accept the default name.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_271_1.png)


    3. Click the Browse for folders arrow to expand the window if you don''t want
    to save the file to the default location, which is My Documents folder.

    4. Click on the desired folder where you would like to save the file.

    5. Click Save. The File Transfers dialog box will appear. It will close automatically
    when the file has been downloaded.


    Besides the group headings in your buddy list there are numbers in brackets, e.g.
    (2/3). In this example, it means 2 out of the 3 contacts are available for chatting.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_271_2.png)


    ## Away Message


    There''s nothing worse than sending someone an instant message and not getting
    a response because that person is away from their computer. If you are logged
    on Instant Messenger but are unavailable for conversations, you should create
    an away message that notifies people you are away from your computer. By default,
    if you are away from your computer for 15 minutes, the away message appears automatically.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_272_0.png)


    1. Click the Away Message button. A menu will appear.

    2. Click New Away Message. A dialog box will open where you can create and save
    an away message.

    3. Type a name for your away message. This is how you will identify the message
    when selecting away messages.

    4. Type the desired message to let the people you send a message know that you
    are away. If you like, you can add details like how they can contact you or when
    you''ll be back.

    5. Click the Save & Use button if you want to use that away message right now.
    Alternatively just click the Save button to use the away message later.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_272_1.png)


    6. Click the Away Message button. A menu will appear.

    7. Click Custom. A list of your saved away messages will appear.

    8. Click the desired message.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_273_1.png)


    9. Click the I''m Back! button when you are back at your computer and are willing
    to accept instant messages.


    ## Home Networking


    A friend of mine was over the other day and he was fascinated when I saved a digital
    photo I was working on my upstairs computer directly to a computer in the basement.
    That''s the beauty of networks - no matter what computer you are working on, you
    have access to all of the others on the network.


    People, especially new to the world of computing, get very nervous when they hear
    the word networking. Visions of high-speed cables, computer geeks, smoking computers,
    and hours of lost time and frustration might fill your head, but these are all
    misconceptions. If you''re unfamiliar with the term networking or networks - in
    a nutshell, it''s when two or more computers communicate with each other. If you
    have two or more computers in your home, you can create your own home network.
    The advantages of home networks are numerous and include sharing hardware devices
    like printers and scanners, sharing a single Internet connection and playing games
    with multiple users. Your Linspire computer actually makes it a piece of cake
    to communicate with other computers on your home network, regardless of the operating
    system each computer is running.

