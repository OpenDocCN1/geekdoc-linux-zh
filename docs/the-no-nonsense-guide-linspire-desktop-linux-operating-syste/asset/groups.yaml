  - '[PAGE 238]


    # E-Mail


    Do you remember the last time you sat down at your desk to write a letter? If
    you''re like most people, it''s been at least a few years due to the popularity
    of e-mail. Why would you wait days to get your message to someone when you can
    beam it directly to your recipient over the Internet in seconds - no stamp required!
    As you may already know, e-mail can be your best friend or your worst enemy, depending
    on how you approach it.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_238_0.png)


    The convenience of almost instantaneous communication can quickly be countered
    by the annoyance of spam (unsolicited e-mail), clutter and disorganization.


    Linspire comes with its own e-mail software that you can use to send and receive
    messages. Before using this e-mail package you''ll have to configure it so that
    it knows where to look for the mail that belongs to you. This information is typically
    available from your Internet Service Provider (ISP), so it''s a good idea to get
    their contact information ready before proceeding with this chapter.


    In this chapter we''ll cover:


    +   - Configuring the E-Mail Client

    - Sending and receiving e-mails

    - Organizing your messages'
