  mdcn: "\n\n# 第 15 章获取帮助\n\n- 7. 点击“接受连接”。你的邀请者现在将拥有对你桌面的完全访问权限。\n\n当你共享桌面的人关闭他们的\
    \ VNC 客户端时，你将在系统托盘中收到一条消息，通知你桌面已不再共享。\n\n## 查看桌面\n\n你不仅可以与 Linspire 共享桌面，还可以查看他人的桌面。\n\
    \n- 1. 点击“启动 | 运行程序 | 实用程序”。将一个实用程序列表。\n- 2. 点击“桌面共享 | 连接到远程桌面”。将出现一个对话框，你可以在其中输入主机号。\n\
    \n## 共享桌面\n\n- 3. 输入由共享桌面的人提供的主机号。\n- 4. 点击“连接”。将出现一个对话框，你可以在其中选择你的 Internet 连接类型。\n\
    - 5. 点击下拉箭头查看不同类型的 Internet 连接列表。\n- 6. 点击与你的连接类型匹配的选项。\n- 7. 点击“确定”。另一端共享桌面的人将收到一个通知，告知你正尝试访问他们的桌面。一旦他们接受，就会出现一个窗口，你需要在其中输入他们提供的密码。\n\
    \n## 打印机\n\n没有任何操作系统是孤立的，Linspire 也不例外。通常，你有几个设备与你的电脑协同工作，以确保你的需求得到完整的解决方案。这些设备中最常见的是打印机。\n\
    \n面对现实吧，尽管电脑很方便，但我们大多数人更倾向于从纸上阅读文档而不是显示器。为了实现这一点，你需要为你的系统安装并配置打印机。Linspire 让你能够轻松设置打印机以及你与电脑配合使用的其他类型硬件。\n\
    \n在本章中，我们将涵盖：\n\n- 设置打印机\n- 打印文档\n\n# 第 16 章打印机\n\n## 添加本地打印机\n\n无论你听过什么，本地打印机并不是出生并居住在你城市的那个东西。这是一个拙劣的笑话，我道歉。本地打印机实际上是直接连接到你的电脑的设备。在开始之前，打开打印机并确保它已连接到你的电脑。\n\
    \n- 1. 双击桌面上的“打印机”图标。这将打开打印机窗口，你可以在其中添加打印机。\n- 2. 点击“添加”按钮。将出现一个菜单。\n- 3. 点击“添加打印机/类...”。将出现添加打印机向导并引导你完成安装过程。\n\
    - 4. 点击“下一步”。这将带你进入向导的下一步。\n- 5. 点击“本地打印机”选项旁的单选按钮。\n- 6. 点击“下一步”。电脑现在将扫描所有端口，以寻找连接到你机器的打印机。\n\
    \n> 如果你配置了家庭网络，可以选择一个网络选项来连接到共享网络打印机。\n\n- 7. 点击所需的端口选择。端口选择取决于你的打印机连接类型。它可以是并行（Parallel）、USB，或者如果是旧式打印机，它可能是串口（Serial）。\n\
    - 8. 点击“下一步”。你将进入打印机型号选择屏幕，你可以在其中选择你的打印机型号。\n- 9. 点击窗口中“制造商”区域的你的打印机制造商。窗口的“型号”区域将出现他们制造的型号列表。\n\
    - 10. 点击你的打印机型号。如果你找不到你的型号，点击“其他”并从打印机附带的磁盘中选择型号。\n- 11. 点击“下一步”。你将进入驱动程序选择屏幕，你可以在其中为你的打印机选择驱动程序。\n\
    - 12. 点击相应的驱动程序。通常其中一个驱动程序会显示“推荐”。如果所选打印机确实如此，请选择该选项。如果是驱动程序错误，你可以在测试后更改它。\n-\
    \ 13. 点击“下一步”。你将进入向导的下一个屏幕，你可以在其中测试你的打印机。\n- 14. 点击“测试”。这将打印测试页以确认你的打印机工作正常。\n\
    - 15. 点击“确定”，关闭在测试页发送到打印机后出现的对话框。\n- 16. 如果测试页打印正常，点击“下一步”。你将进入横幅选择屏幕。或者，如果测试没有打印出来，点击“返回”，然后选择不同的驱动程序。\n\
    - 17. 点击“下一步”。通常你不需要在打印作业之前或之后打印横幅。你将进入打印配额设置屏幕。\n- 18. 点击“下一步”，除非你想为打印机设置配额。这意味着你限制了特定时间内打印的页数以及允许打印的文件大小。你将进入用户设置屏幕。\n\
    - 19. 点击“下一步”，除非你想限制谁可以使用打印机。如果是这样，你可以在此屏幕中设置。你将进入常规信息屏幕。\n- 20. 在“名称”文本框中为打印机输入名称。名称不能包含任何空格。\n\
    - 21. 点击“下一步”，你将带到确认屏幕。\n- 22. 在检查设置后点击“完成”。你的打印机现在已设置好并准备好打印。\n\n## 打印\n\n几乎所有支持打印的应用程序的打印方式都是相同的。如果你的机器上连接了多台打印机，你只需选择想要打印到的打印机即可。\n\
    \n## 索引\n\n### A\n- 地址簿 243\n- 桌面 202\n- 相册 175\n- 存档 91, 93\n- 附件 242\n- 自动 138\n\
