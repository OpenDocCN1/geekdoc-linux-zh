    \ worry, this is normal. Depending on how your computer was originally manufactured\
    \ or configured, there may be slight differences between your computer and the\
    \ computers that used for writing this book.\n\nIt would take an encyclopedia\
    \ to cover all of the features that Linspire has to offer, so not every aspect\
    \ of the operating system is covered. The goal of this book is to show you how\
    \ to use those features that are used most often when exploring the world of Linspire.\n\
    \n# Forward\n\nBy Michael Robertson, CEO, Linspire Inc.\n\n## Why Linspire?\n\n\
    When I started Linspire, I was accused of being crazy for trying to compete against\
    \ Microsoft, the world's biggest monolith. But that is precisely the reason why\
    \ there needs to be competition. Without choice, consumers are treated to a mix\
    \ of high prices, poor service and a lack of innovation. Choice is good for consumers.\
    \ Simply put, that is why I started Linspire.\n\nWhen I started MP3.com, the music\
    \ industry was very much the same way — it was closed off. The major recording\
    \ companies controlled music and didn't want to see it on the Internet at all.\
    \ They sued MP3.com, they sued content providers, they even went after developers\
    \ of portable MP3 players. But the future cannot be stopped and advancements will\
    \ happen. Now I can't go to the gym without seeing white headphones leading to\
    \ MP3 players all around. Consumers are no longer limited to purchasing expensive\
    \ CDs. You can buy individual tracks or full albums from sites like MP3tunes.com\
    \ and within minutes listening to them on your PC, stereo, or MP3 player.\n\n\
    We are at a time in history where the same thing is happening to the computer\
    \ operating system. People endured high prices, viruses, and frequent crashes\
    \ because they wanted to, but because there has been a lack of alternatives. In\
    \ early 2002, I sat around the \"lucky table\" my father-in-law gave me, feeling\
    \ that the world was out of balance with one dominating operating system that\
    \ was leading to expensive pricing, unfriendly licensing and depriving people\
    \ access to lower-cost computing. So for the last three years, Linspire has been\
    \ working on creating a viable alternative to restore balance to the world of\
    \ desktop computing.\n\n# Why Linux?\n\nWhen I started Linspire, I realized that\
    \ to compete with Microsoft meant needing to work smarter, not harder. They have\
    \ more money, more people, and have been producing versions of the Microsoft Windows\
    \ operating system for more than ten years. That's where Linux came in.\n\nIf\
    \ you're like most people, chances you only started hearing about Linux recently.\
    \ While it has been mostly an underground technology used by IT professionals\
    \ and computer science majors, Linux has been around since the early '90s. Linux\
    \ itself is based on UNIX, which has been around since 1970. In addition to having\
    \ years of refinement and experience under its belt, Linux offers some very big\
    \ advantages. Unlike Microsoft Windows, which is developed by a specific group\
    \ of people who all work for a specific company, Linux is developed by a worldwide\
    \ community.\n\nHow does that work? It's through a principle called \"open source.\"\
    \ Most software companies hide the code that drives their applications, so other\
    \ people can't take advantage of all the hard work they've put into developing\
    \ it. Open source is exactly the opposite. Instead of hiding the source code,\
    \ open source as the name implies and opens the source code to the world, developers\
    \ all around the globe can contribute advances and improvements.\n\nBy taking\
    \ advantage of the open source nature of Linux, it's no longer the few people\
    \ in my three-year-old company competing against Microsoft, it's the thousands\
    \ of people who have for more than 30 years contributed to making Linux what it\
    \ is today. This swings the pendulum back in favor of competition. If I were to\
    \ try competing directly against Microsoft, I would lose. But with the decades\
    \ of experience and the worldwide community that supports Linux, choice can once\
    \ emerge again in this long-cornered marketplace.\n\nThe problem with Linux, that\
    \ is has always been a technical operating system for technical users. Yes, it\
    \ is very stable and has many advantages over Microsoft Windows, but for most\
    \ people it has simply been too difficult to be practical. So at Linspire we've\
    \ dedicated to crossing the divide and making Linux easy enough for complete novices,\
    \ while keeping the benefits of security and stability that have made it a favorite\
    \ among the technical elite.\n"
