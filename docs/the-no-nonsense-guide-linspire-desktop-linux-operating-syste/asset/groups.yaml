    - 7. 按住 `Shift` 键进行选择。

    - 8. 点击打开。

    - 9. 点击“适应”（Fit）。

    - 10. 按下空格键开始幻灯片。

    - 11. 按下空格键结束幻灯片。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_174_0)


    ## 管理与编辑


    虽然图像查看器可以让你快速查看照片，但它是管理和编辑照片的更强大的工具。当你启动它时，你会看到各种选项。


