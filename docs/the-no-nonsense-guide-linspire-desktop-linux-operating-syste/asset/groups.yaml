    # 244

    # 第 12 章 电子邮件


    - 3. 点击“新建卡片”（New Card）。将出现一个窗口，你可以在其中向通讯录添加某人。

    - 4. 输入该人的信息。没有字段是必填的，但你应该包括他们的姓名、姓氏以及电子邮件地址。

    - 5. 点击通讯录以添加你想添加的任何人。

    - 6. 点击“确定”（OK）。该人将被添加。


    > 双击通讯录中的任何条目以打开一个你可以在其中编辑地址信息的窗口。


    ## 编写电子邮件


    向你的朋友、家人和同事发送消息在 Linspring 中非常简单。你的消息可以进行多种方式格式化，并添加附件。


    - 1. 点击“新邮件”（New Msg）按钮。编写窗口将出现。

    2. 输入你想发送电子邮件的人的电子邮件地址或姓名。如果该联系人在通讯录中，他们的姓名将会出现。

    3. 点击理想的收件者或继续输入他们的姓名。

    4. 按回车键。你将跳转到下一行，可以在那里添加额外的收件者。


    - 5. 点击下一行发件人（From）字段下的箭头。将出现地址选项列表。

    6. 点击所需的选项。它们包括：

    * 收件人（To）。这是你的消息副本的主要收件者，

    * 抄送（Cc）。这代表“抄送”，这意味着接收者将收到消息副本，并且他们的姓名对所有接收消息的人可见。


    ## 创建列表


    如果你有一组经常发送电子邮件的人，你可以创建一个列表。与其其在撰写电子邮件时逐个输入每个人的地址，不如你只需输入列表的名称，列表中的每一个人都会收到那封电子邮件。


    ## 通讯录


    1. 点击“新建列表”（New List）按钮。邮件列表对话框将出现。

    2. 为你的列表输入名称。

    3. 如果需要，为列表输入昵称和描述。

    4. 点击空行并开始输入想要添加到列表的姓名、姓氏或昵称。通讯录中匹配你输入内容的联系人将会出现。


    5. 点击理想联系人将其添加到列表。或者，如果该人不在通讯录中，你可以继续输入他们的电子邮件地址直到完成。

    6. 重复步骤 4 和 5 以添加其他人。

    7. 点击“确定”（OK）。列表现在已创建。该列表将添加到通讯录中，并可以像其他列表一样被访问。

    8. 点击窗口右上角的“关闭”（Close）按钮退出通讯录。


