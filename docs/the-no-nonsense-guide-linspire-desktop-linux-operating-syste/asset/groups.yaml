    ## Linspire 操作系统是大众化的吗？


    是的。Linspire 的设计初衷是为您考虑的。我们知道，大多数人使用电脑并不是为了编写计算机代码或托管互联网论坛等超技术目标。人们确实会写邮件、浏览网页、聊天、使用办公套件、玩游戏、听音乐以及从数码相机中获取照片。Linspire
    预装了完成这些任务以及更多任务的所有必要软件。


    我听到的最多的问题之一是：“Linspire 能运行我使用的 XYZ 应用程序吗？”但在与问这个问题的人交流后，我发现他们其实并不纠结于某个特定的应用程序，而是纠结于哪种应用程序能让他们实现某个功能。关键在于功能和实用性，而不是某个特定的程序。我通常给出的答案是：“为
    Microsoft Windows 制作的程序无法在 Linspire 上运行，但有数千个可以在 Linspire 上运行的应用，我们这里有一个恰好满足你的需求。”


    以 Microsoft Office 为例——这可能是大多数人想了解应用程序。为什么？因为他们需要文字处理器、电子表格和演示文稿软件。他们需要这些软件易用，最重要的是，他们需要创建可以在
    Microsoft Windows 计算机上的文档。令人的是，微软并没有为 Linux 制作办公套件，但你真的愿意再花数百美元去购买它吗？Linspire
    附带了一套完整的办公套件。没错……你不需要在一个程序上花费与你买电脑一样多的钱。Linspire 附带的 OpenOffice 套件包含了文字处理、电子表格和演示文稿软件，所有软件都可以以与
    Microsoft Office 相同的格式保存，因此你可以读取和编辑仍使用 Microsoft Office 的朋友创建的文件，他们也可以读取和编辑你创建的文件。如果你不告诉他们，他们可能永远不会意识到他们使用的不是同一种软件。


    无论你想用电脑做什么，Linspire 的软件都有可能比其他操作系统为你节省更多时间、金钱和烦恼。除了预装了许多程序外，Linspire 还为您提供了获取新软件的最廉价方式。在
    Microsoft Windows 世界，获取软件的传统方法是为你需要的每个应用程序付费。对于 Linux 用户来说，安装软件通常意味着在互联网上搜索看起来还好的东西，下载几个不同的包，使用一系列命令进行安装，并希望它能运行。一种方法花钱，另一种方法花时间。有了
    Linspire，你两者都不会浪费。


    花费不到五十美元，Linspire 用户就可以从 CNR 仓库中访问约 2,000 个应用程序。除了价格极低之外，它也极其简单。不要浪费时间在网上搜索或翻看软件盒，只需点击并运行。通过集成在
    Linspire 操作系统中的 CNR 应用程序可以轻松访问该仓库。CNR 让你能够搜索所需的特定应用程序，或浏览仓库货道寻找适合你需求的东西。通过 CNR，你可以查看截图、阅读描述，并只需点击鼠标按键即可安装，为你节省了时间和金钱。


    # 所以 Linspire 节省了精力和金钱，这很好。就只有这些吗？


