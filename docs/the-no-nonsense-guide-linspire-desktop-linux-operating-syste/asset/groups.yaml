    ## 文件管理


    在操作电脑时，管理文件的能力至关重要。电脑中包含的所有内容，无论是文档、电子表格、照片、歌曲还是电子邮件，都以文件的形式存储。即使是运行的程序也是由不同的文件组成的。事实上，大多数计算机字面上拥有成千上万个不同的文件。


    如果没有适当的文件分类系统，跟踪这些文件将完全是一场噩梦，而 Linspire 恰好有一套优秀的系统。文件被分类到文件夹（有时称为目录）并置于逻辑类别中。如果你有
    Windows 等其他操作系统的经验，你会发现 Linspire 中的文件结构稍有不同，但你很快就能学会。


    在本章中，我们将涵盖：


    - 在电脑中导航查找文件

    - 使用文件管理器

    - 创建、编辑和删除文件

    - 搜索你的电脑


