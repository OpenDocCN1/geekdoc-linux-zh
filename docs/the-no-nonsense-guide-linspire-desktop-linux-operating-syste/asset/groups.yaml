    ## 播放列表


    我记得上高中时，如果一个男生想给女女孩留下印象，他就会为她制作一张包含她喜欢的歌曲的磁带。你可以创建一个“混音带”（称为播放列表），其中包含你想要按特定顺序听的特定歌曲。你可以创建反映特定心情、音乐类型、艺术家、专辑或流派的播放列表。


    ## 第 8 章 使用多媒体程序


    - 1. 点击“添加播放列表”（Add Playlist）按钮。现在将提示你为播放列表输入一个名称。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_171_0.png)


    - 2. 为你的播放列表输入名称。给它一个描述性的名称是个好主意。例如：我喜欢的歌曲、爵士混音、驾驶音乐等。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_171_1.png)


    - 3. 点击并将窗口中的任何歌曲拖到你的播放列表中。当你的鼠标指针悬停在播放列表上时，会出现一个小的 `+` 号，表示当你松开鼠标按钮时，歌曲将添加到播放列表中。


    - 4. 点击任何播放列表以显示其内容。


    ## 从播放列表创建 CD


    就像你可以将音频 CD 转换为 mp3 一样，反之亦然。在你创建播放列表后，你可以将该播放列表的内容刻录到音频 CD 上，你可以在汽车或家庭音响中播放它。


    ## 使用歌曲


    ![](img/3926ca1fb00de3af845faa03d2c351e5_172_0.png)


    - 1. 在任何想要创建音频 CD 的播放列表上点击右键。将弹出一个菜单。


    - 2. 点击“刻播放列表到光盘”（Burn Playlist to Disc）。


    - 3. 将可刻录 CD 插入刻录机。


