    person is not part of the Address Book, you can continue typing in their e-mail
    address until it''s complete.


    6. Repeat Steps 4 and 5 to add anyone else to your list.


    7. Click OK. The list will now be created. The list will be added to the Address
    Book and can be accessed like any other.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_246_1.png)


    8. Click the Close button in the top right corner to exit the Address Book finished.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_246_2.png)


    > Double-click on any entry in the Address Book to open up a window where you
