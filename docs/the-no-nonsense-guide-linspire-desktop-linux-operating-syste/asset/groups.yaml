    4. Repeat Steps 1 - 4 to add any other bookmarks.


    - 5. Click any of your bookmark buttons on the toolbar to quickly jump to those
    locations.


    ## Selecting Files and Folders


    Before you can do any type of file management like copying, moving or deleting
    folders, you must first select the ones that you would like to manipulate. There
    are several different methods you can use to select individual or multiple files
    and folders.


    1. Click a file or folder. A highlighted file or folder indicates that you have
    selected it.


    2. Hold down the Ctrl key and click any other files or folders. They too will
    now be selected.


    3. Click any blank area of the screen. The files and folders will no longer be
    selected.


    4. Click a file or folder. A highlighted folder indicates that you have selected
    it.


    5. Hold down the Shift key and click a file elsewhere in the window. All the files
    in the same rows and columns between the original file you clicked and the last
    file you clicked will now be selected.


    - 6. Position the mouse pointer in a blank area between files.


    - 7. Click and drag diagonally. As you drag a marquee will appear. The files and
    folders that the marquee touches will be selected.


    ## Copying and Pasting Files


    Copying and pasting are the most common tasks performed with files and folders.
    When you cut or copy a file or folder it is sent to a virtual clipboard. It can
    then be pasted to any location that you specify. Here we''ll go through one of
    the quickest methods to copy.


    - 1. Select the file(s) or folder(s) that you would like to copy using one of
    the selection methods.


    - 2. Right-click on the selection you would like to copy. A menu will appear.


    - 3. Click Copy. The selection will be copied to the clipboard. Pressing Ctrl+C
    on your keyboard also enables the Copy command.


    - 4. Navigate to the location where you want to paste the file.


    - 5. Right-click in any blank area of the screen. A menu will appear.


    - 6. Click Paste. The selection will be pasted to this location. Alternatively
    you can press Ctrl+V to paste the file.


    > When copying and pasting a folder, both the folder and all of its contents will
    be pasted to the new location.


    ## Moving Files


    Moving a file works the same as copying, the only exception being that you''ll
    use the Cut command rather the Copy command.


    - 1. Select the file(s) or folder(s) that you would like to move.


    - 2. Right-click the selection you would like to move. A menu will appear.


    - 3. Click Cut. The icon(s) of the selection will appear dimmed.


    - 4. Navigate to the location where you would like to move the file.


    - 5. Right-click in any blank area of the screen. A menu will appear.


    - 6. Click Paste. The selection will be moved to this location. Alternatively
    you can click the Paste button that is located on the toolbar.


    ## Renaming Files


    Whether you want to give your files and directories more specific names or you
    just don''t like the name you originally selected, you can quickly change their
    names.


    - 1. Click a file or folder that you would like to rename. It will be highlighted.


    - 2. Press the F2 key on your keyboard. The name of the file will now be highlighted
    and you can give it a new name.


    - 3. Type a new name for your file.


    - 4. Press Enter on the keyboard or click anywhere else on the screen. Your file
    will now have a new name.


    ## Creating Folders


    Folders are an essential part of keeping the files on your computer organized.
    While Linspire provides some folders for you to start with, such as "My Documents,"
    it is a good idea to create additional folders to further organize and categorize
    your work. The process of creating a folder involves just a few clicks of the
    mouse button.


    - 1. Navigate to the location on your computer where you would like to create
    a folder.


    - 2. Right-click in any blank area of the screen. A menu will appear.


    - 3. Click Create New and then click Folder... A dialog box will appear asking
    you to name your new folder.


    - 4. Type a name for your folder that best describes its contents.


    - 5. Click OK. The folder will be created.


    - 2. Double-click the "mnt" folder. You will now see all of the drives that are
    mounted to your computer. You can then double-click the desired device to see
    its contents.


    ## The Trash


    Unlike regular trash, in Linspire you don''t have to drag yourself out of bed
    early in the morning, endure the cold weather and carry heavy bags to your curb
    when you want to get rid of a file or folder. The trash folder itself is your
    safety net. When you delete a file in Linspire, it is sent to the trash folder.


    1. Select the file or folder that you wish to delete. It will be highlighted.


    2. Press the Delete key on your keyboard. A dialog box will appear confirming
    that you want to send this to the trash folder.


    3. Click the Trash button. The file will be sent to the trash.


    > You can bypass the Trash and completely delete a file by holding down the Shift
    key as you press Delete. A dialog box will appear confirming that want to delete
    the file.


    ## Viewing and Reclaiming Trashed Items


    If you''ve trashed an item inadvertently or you now realize that you actually
    need an item you have trashed, it can be retrieved.


    - Double-click the Trash icon on your desktop. The File Manager will open to the
    folder that contains the trash.


    - Cut and paste your file to any other location.


    ## Emptying the Trash


    If you no longer require the files that you have sent to the Trash, you can empty
    the files in the Trash folder. Keep in mind that once the Trash has been emptied,
    the files are gone for good.


    - 1. Right-click the Trash icon. A menu will appear.


    - 2. Click Empty Trash Bin. The files in the Trash Bin will be permanently deleted.


    ## Finding Files


    While having a good filing system goes a long way to keeping you organized, there
    will often be times when you just can''t seem to find a file you''re looking for
    when navigating the File Manager. For these occasions you can take advantage of
    Linspire''s search functionality.


