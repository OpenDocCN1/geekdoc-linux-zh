  - '[PAGE 25]


    # Running Linspire for the First Time


    19. Click OK. Your computer will restart, and the CD will be ejected from the
    CD drive. Take the CD out when it ejected then close the CD door and press the
    Enter key on your keyboard. It may take several minutes for the system to completely
    restart. Linspire is now installed on your computer and is ready to use.


    What you see on your screen the first time you turn on your Linspire machine will
    depend on several factors: who configured your Linspire computer; whether you
    installed the operating system yourself, or if your computer came pre-installed
    from the store. There are several screens that may appear including an initialization
    screen, the CNR trial membership screen, a tutorial video, and perhaps the Startup
    wizard.


    > If you entered an Administrator password during the installation process, you
    will need to type that password before you can proceed into the operating system.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_25_0.png)


    ![](img/3926ca1fb00de3af845faa03d2c351e5_25_1.png)'
- md: "\n# Running Linspire for the First Time\n\n- 1. Click the 'X' in the top right\
    \ corner to clear the screen of any open windows.\n\n![](img/3926ca1fb00de3af845faa03d2c351e5_26_0.png)\n\
    \n# The Startup Wizard\n\nThe Startup will run automatically the first time you\
    \ launch your Linspire computer. If this wizard does not appear, do not panic.\
    \ This simply means that whoever installed Linspire on your machine has completed\
    \ the wizard for you. In any case, all of the configurations set by the Startup\
    \ wizard can be adjusted at any time. You'll learn how to make these adjustments\
    \ in the chapter entitled \"Personalizing and Customizing Linspire.\"\n\n- 1.\
    \ Click the check box beside the phrase \"I Agree\" after you've reviewed the\
    \ license agreement. A check will appear in the box.\n\n- 2. Click Next. You'll\
    \ advance to the next screen of the wizard.\n\n![](img/3926ca1fb00de3af845faa03d2c351e5_26_1.png)\n\
    \n# Chapter 1 Installing Linspire\n\n- 3. Click and drag the slider bar to adjust\
    \ the volume of your system. Dragging the slider to the left will lower the volume\
    \ and dragging it to the right will make it louder.\n\n# Sound Volume\n\nUse the\
    \ slider to adjust the volume of your computer. Please note the lower button please\
    \ hold until you hear music playing at a lower sound level then click the higher\
    \ button. If there is no sound click the higher button for some time. Note you\
    \ can always adjust the volume in the future by clicking on the option in the\
    \ bottom right corner of the desktop.\n\n- 4. Click Next. You will advance to\
    \ the next screen of the wizard where you can adjust the time and date settings.\n\
    \n![](img/3926ca1fb00de3af845faa03d2c351e5_27_0.png)\n\n# Date & Time\n\n- 5.\
    \ Click the correct date. You can adjust the month and year by clicking the arrows\
    \ at the top of the calendar.\n\n- 6. Enter the current time in the fields provided.\
    \ The easiest way is to click the up or down arrows beside each field.\n\n- 7.\
    \ Click the down arrows. This feature lets you expand the menus where you can\
    \ adjust the time zone and region if they are not already correct.\n\n![](img/3926ca1fb00de3af845faa03d2c351e5_27_1.png)\n\
    \n- 8. Click Next. You will proceed to the Advanced Settings screen.\n\n# Running\
    \ Linspire for the First Time\n\n- 9. Click Next at the Advanced Settings dialog\
    \ box. Alternatively you can click any of the boxes to adjust the settings. Most\
    \ of these settings will be discussed in detail later in the book.\n\n![](img/3926ca1fb00de3af845faa03d2c351e5_28_0.png)\n\
    \n- 10. Click Finish. The wizard will close and you're now ready to explore the\
    \ wonderful world of Linspire. At this point a tutorial video may appear. You\
    \ can choose to watch this video or click the \"X\" in the top right corner to\
    \ close the tutorial.\n\n![](img/3926ca1fb00de3af845faa03d2c351e5_28_1.png)\n\n\
    # LinspireLive!\n\nAre you one of those people who get into one at a time instead\
    \ of diving in? For many people change is difficult, so if you're a little hesitant\
    \ about exploring Linspire, you can take advantage of LinspireLive! LinspireLive!\
    \ lets you enjoy the benefits of Linspire on your computer by running the operating\
    \ system off a CD rather than installing it to your hard drive. The Linspire CD\
    \ is attached to the back of this book.\n\nRunning LinspireLive! is as simple\
    \ as putting the CD into your computer's CD drive and restarting your system.\
    \ The only work you have to do is let your computer know to boot from the CD rather\
    \ than the hard drive if it is not already configured to do so. See the section\
    \ earlier in the chapter entitled \"Booting from CD\" to see more information\
    \ on accessing the BIOS.\n\n- 1. Insert the Linspire CD into your computer's CD\
    \ drive.\n\n- 2. Restart your computer. Depending on the operating system you\
    \ are using this action may involve using the Restart feature of the operating\
    \ system or it may require turning off your computer then again. Within moments\
    \ the Linspire operating system will be loaded and you can begin exploring the\
    \ world of this innovative operating system.\n\n> LinspireLive! is a wonderful\
    \ feature for testing Linspire, but it is not meant as a permanent solution. If\
    \ you like what you see, you should install Linspire to your computer's hard drive.\n\
    \n# Ending Your Linspire Session\n\nI know... I know... you're too excited about\
    \ using your computer and you don't want to turn it off. I'll give you five more\
    \ minutes of playing, but then you have to come back and read the following section\
    \ that instructs you on the proper procedure for turning off your computer.\n\n\
    # Ending Your Linspire Session\n\n![](img/3926ca1fb00de3af845faa03d2c351e5_30_0.png)\n\
    \n- 1. Close any of your open applications by clicking the “X” in the top right\
    \ corner. You may be prompted to save your files.\n\n- 2. Click the Launch button.\
    \ A menu will appear.\n\n- 3. Click Logout/Turn Off. A dialog box will appear\
    \ and will present you with several options.\n\n- 4. Click one of the options,\
    \ which include:\n\n  - End Session. This logs you off but keeps your computer\
    \ on.\n  - Quick Restart. Lets you restart your computer quickly to allow a setting\
    \ to take effect or resolve an issue. This usually takes seconds to complete.\n\
    \  - Restart Computer. Lets you completely turn your computer off and on again.\n\
    \  - Turn Off Computer. I’ll give you three guesses as to what this does.\n\n\
    ![](img/3926ca1fb00de3af845faa03d2c351e5_30_1.png)\n\n![](img/3926ca1fb00de3af845faa03d2c351e5_30_2.png)\n\
    \n> Pressing the Ctrl, Alt and Delete key on the keyboard, all at the same time,\
    \ will open the End Session dialog box.\n\n## Getting Acquainted with Linspire\n\
    \nYou've either gone through the installation process, or you've turned on your\
    \ pre-installed Linspire computer for the first time – now what? It's time to\
    \ get acquainted with the operating system, learn your way around the key areas\
    \ and start having fun.\n\nOne of the best attributes of the Linspire operating\
    \ system is that it is easy to use. Whether you've never used a computer before\
    \ or you are a seasoned veteran, you'll be mastering Linspire in no time. On that\
    \ note, if you are an experienced computer user, most of this chapter will be\
    \ a review for you, so suggest skimming over it. If on the other hand you're brand\
    \ new to Linspire or computers in general, stick around and we'll discover the\
    \ operating system together.\n\nIn this chapter we'll cover:\n\n* Identifying\
    \ the components of the user interface\n* Getting around in Linspire\n* Starting\
    \ programs\n* Managing open windows\n\n![](img/3926ca1fb00de3af845faa03d2c351e5_32_0.png)\n"
  mdcn: "\n\n# 首次运行 Linspire\n\n- 1. 点击右上角的“X”以清除屏幕上所有打开的窗口。\n\n![](img/3926ca1fb00de3af845faa03d2c351e5_26_0.png)\n\
    \n# 启动向导\n\n当你第一次启动 Linspire 计算机时，启动向导会自动运行。如果此向导没有出现，请不要惊慌。这仅仅意味着在你的机器上安装 Linspire\
    \ 的人已经为你完成了向导操作。无论如何，通过启动向导设置的所有配置都可以随时调整。你将在标题为“个性化和自定义 Linspire”的章节中学习如何进行这些调整。\n\
    \n- 1. 在审阅许可协议后，点击“我同意”文字旁边的复选框。框内将出现一个勾标记。\n\n- 2. 点击“下一步”。你将进入向导的下一个屏幕。\n\n\
    ![](img/3926ca1fb00de3af845faa03d2c351e5_26_1.png)\n\n# 第 1 章 安装 Linspire\n\n\
    - 3. 点击并拖动滑动条来调整系统音量。向左拖动滑动条将降低音量，向右拖动将增大音量。\n\n# 音量\n\n使用滑动条调整电脑音量。请注意，请按住低音按钮直到听到较低音量的的音乐播放，然后点击高音按钮。如果没有声音，请点击高音按钮一段时间。注意，你以后可以通过点击桌面右下角的选项随时调整音量。\n\
    \n- 4. 点击“下一步”。你将进入向导的下一个屏幕，在其中你可以调整时间和日期设置。\n\n![](img/3926ca1fb00de3af845faa03d2c351e5_27_0.png)\n\
    \n# 日期与时间\n\n- 5. 点击正确的日期。你可以通过点击日历顶部的箭头调整月份和年份。\n\n- 6. 在提供的字段中输入当前时间。最简单的方法是点击每个字段旁边的向上或向下箭头。\n\
    \n- 7. 点击向下箭头。此功能允许你展开菜单，如果时区和区域尚未正确，你可以在其中进行调整。\n\n![](img/3926ca1fb00de3af845faa03d2c351e5_27_1.png)\n\
    \n- 8. 点击“下一步”。你将进入高级设置屏幕。\n\n# 首次运行 Linspire\n\n- 9. 在高级设置对话框中点击“下一步”。或者你也可以点击任何方框来调整设置。这些设置中的大部分将在本书的后部分详细讨论。\n\
    \n![](img/3926ca1fb00de3af845faa03d2c351e5_28_0.png)\n\n- 10. 点击“完成”。向导将关闭，你现在准备好探索\
    \ Linspire 的奇妙世界了。此时可能会出现一个教程视频。你可以选择观看此视频，或点击右上角的“X”来关闭教程。\n\n![](img/3926ca1fb00de3af845faa03d2c351e5_28_1.png)\n\
    \n# LinspireLive!\n\n你是那种一次只尝试一个而不是一次性全部投入的人吗？对很多人来说，改变是困难的，所以如果你对探索 Linspire\
    \ 稍有犹豫，可以利用 LinspireLive!。LinspireLive! 让你通过从 CD 运行操作系统而不是将其安装到硬盘上，来享受 Linspire\
    \ 带来的好处。Linspire CD 附在本书的后面。\n\n运行 LinspireLive! 只需要将 CD 放入电脑的 CD 驱动器并重启系统。你唯一需要的工作是如果电脑尚未配置为从\
    \ CD 启动，则让电脑知道从 CD 而硬盘启动。参见本章节前面的“从 CD 启动”部分以获取有关访问 BIOS 的更多信息。\n\n- 1. 将 Linspire\
    \ CD 插入电脑的 CD 驱动器。\n\n- 2. 重启电脑。根据你正在使用的操作系统，此操作可能涉及使用操作系统的重启功能，也可能需要关闭电脑再重新开启。片刻之后，Linspire\
    \ 操作系统将加载，你可以开始探索这个创新操作系统的世界。\n\n> LinspireLive! 是测试 Linspire 的绝佳功能，但它并不是永久解决方案。如果你喜欢你看到的内容，应该将\
    \ Linspire 安装到电脑的硬盘上。\n\n# 结束 Linspire 会话\n\n我知道……我知道……你对使用电脑太兴奋了，不想关闭它。我会再给你五分钟时间玩，但之后你必须回来阅读以下章节，该章节将指导你关闭电脑的正确程序。\n\
    \n# 结束 Linspire 会话\n\n![](img/3926ca1fb00de3af845faa03d2c351e5_30_0.png)\n\n-\
    \ 1. 点击右上角的“X”关闭任何已打开的应用程序。可能会提示你保存文件。\n\n- 2. 点击“启动”按钮。将出现菜单。\n\n- 3. 点击“注销/关闭”。将出现一个对话框并向你提供几个选项。\n\
    \n- 4. 点击选项之一，包括：\n\n  - 结束会话：注销但保持电脑开启。\n  - 快速重启：快速重启电脑使设置生效或解决问题。这通常只需要几秒钟。\n\
    \  - 重启电脑：完全关闭并重新开启电脑。\n  - 关机：让我猜三个它是干做什么的。\n\n![](img/3926ca1fb00de3af845faa03d2c351e5_30_1.png)\n\
    \n![](img/3926ca1fb00de3af845faa03d2c351e5_30_2.png)\n\n> 同时按下键盘上的 Ctrl、Alt 和\
    \ Delete 键将打开结束会话对话框。\n\n## 熟悉 Linspire\n\n你已经完成了安装过程，或者你刚刚开启了预装的 Linspire 计算机——现在该怎么办？是时候熟悉该操作系统，了解各个区域并开始享受乐趣了。\n\
    \nLinspire 操作系统的最大优点之一就是易于使用。无论你是从未用过电脑，还是深老兵，很快就能精通 Linspire。就此而言，如果你是经验丰富的用户，本章的大部分对你来说都是复习，建议浏览即可。相反，如果你是\
    \ Linspire 或电脑新手，请留下来，我们将一起发现这个操作系统。\n\n在本章中，我们将涵盖：\n\n* 识别用户界面组件\n* 在 Linspire\
    \ 中浏览\n* 启动程序\n* 管理打开的窗口\n\n![](img/3926ca1fb00de3af845faa03d2c351e5_32_0.png)\n\
    \n"
