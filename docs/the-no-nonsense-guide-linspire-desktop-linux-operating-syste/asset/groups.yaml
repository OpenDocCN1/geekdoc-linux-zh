    # 94 Chapter 4 File Management


    > Many e-mail programs will block messages that contain an attachment that has
    been archived using the zip method. You may want to use a different compression
    type if e-mailing your files.


    ## Unzipping or Expanding Archived Files


    Unzipping has become the popular term for expanding archived files, and is used
    universally regardless of whether the archive is a zip file or not. The actually
    process of expanding an archive is quite straightforward.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_95_0.png)


    - 1. Open the Archiving & Zip Tool program as outlined in the previous section.

    - 2. Click the Open button. The Open dialog box will appear.

    - 3. Navigate to the folder that contains the archived file you''d like to expand.

    - 4. Click on the archive that you would like to expand.

    - 5. Click Open. The archive will open and you will be able to view its contents.


    ## Burning Files to CD


    ![](img/3926ca1fb00de3af845faa03d2c351e5_96_0.png)


    - 6. Click the Extract Button. A dialog box will open where you can specify the
    location for the folder to be extracted.

    - 7. Type the location of where you would like the folder extracted. Alternatively,
    you can click the blue folder to the right of the browse field to bring open a
    dialog box where you can select a folder.

    - 8. Click the OK button. The files will be extracted to the location you specified.
    The folder where you extracted the files will also open.


    ## Burning Files to CD


    With the low price of CD burners and CDRs (writeable CDs) many people are sharing
    and storing files by burning them to CD. Whether you want to share your favorite
    photos with friends or simply back up your files, Inspire makes it a breeze. There
    are actually several ways to burn a CD, here we''ll explore using the CD & DVD
    Burning program.


    - 1. Click Launch | Run Programs. A submenu of categories will appear.

    - 2. Click Audio & MP3. A variety of programs under that category will appear.

    - 3. Click CD & DVD Burning. This will launch a program that will allow you to
    burn files to CD. The first time you launch the program, you will be asked to
    enter the write speed of your CD burner. This information should be available
    from the company you purchased your computer or CD burner from.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_96_1.png)


    # 96 Chapter 4 File Management


    - 4. Use the arrow keys to enter the write speed of your CD writer.

    - 5. Click OK. The dialog box will close.

    - 6. Click New Data CD Project. You will now be able to select files and/or folders
    to include on your CD.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_97_0.png)


    - 7. Double-click a folder in the left pane of the window to reveal its contents.
    You can browse through different folders just as you would in the File Manager.

    - 8. Click and drag a file or folder from the top right pane to the Current Projects.
    The file will be added to the CD project.

    - 9. Review the green bar that indicates how your project is.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_97_1.png)


    - 10. Repeat Steps 7 - 9 until you have completed adding data to your project.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_97_2.png)

    ![](img/3926ca1fb00de3af845faa03d2c351e5_97_3.png)


    Most CDs allow you to add up to 700MB of files. If you are burning your files
    to a DVD you can typically store up to 4.7 GB of data.


    ## Burning Files to CD


    - 11. Click on any file that you would like to remove from your project.

    - 12. Click the Delete key on your keyboard. The file will be removed from the
    project.

    - 13. Insert a writeable CD into your CD burner.

    - 14. Click Burn. A dialog box will appear where you can adjust settings for your
    burner.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_98_0.png)


    - 15. Review the settings and make any changes if desired. Typically you can just
    leave these settings as is.

    - 16. Click the Burn button. The process of copying the files to CD will begin.
    A progress indicator will appear on the screen letting you know what percentage
    of the project is complete. When it is finished, the CD will be ejected from the
    CD drive and a trumpet sound will play indicating that everything went successfully.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_98_1.png)


    ## Word Processing


    Typically when you purchase a computer, you are given a word processor. It is
    used for creating and editing documents.


    ## Launching Word Processing


    The word processor is located in the Start menu. It is also available on the desktop.


    - 1. Click Launch | Run Programs. A submenu of categories will appear.

    - 2. Click All. A submenu will appear.

    - 3. Click Word Processing. Another submenu will appear.

    - 4. Click Word Processor. This action will launch the program.


    ## Creating a New Document


    If you''re interested in creating a document from scratch, you can do so easily.


    - 1. Click the New button on the toolbar. A blank document will open.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_101.png)


    ## Opening an Existing Document


    There will be many occasions when you will continue working on a document that
    you have previously opened. In these cases, you simply have to open the file.


    - 1. Click File | Open. The Open dialog box will appear.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_102.png)


    > The keyboard shortcut to execute the Open command is Ctrl+O.


    - 2. Navigate to the folder that contains the file you would like to open.

    - 3. Click the desired file that you would like to open. The file will be highlighted.

    - 4. Click Open. The file you selected will open.


    ## Opening Other Formats


    Believe it or not, not everyone creates all their documents using the same software
    program. No worries though, Word Processor supports a multitude of different file
    types that you can open. The procedure for opening these types of files is the
    same as any other file.


    - 1. Click the Open icon. This action will bring up the Open dialog box.

    - 2. Click the File type drop-down menu button to see a list of different file
    types that can be opened.

    - 3. Click the desired file type to see only those types of files in the dialog
    box.

    - 4. Click the desired file that you would like to open and press Enter on the
    keyboard. The file that you selected will open.

