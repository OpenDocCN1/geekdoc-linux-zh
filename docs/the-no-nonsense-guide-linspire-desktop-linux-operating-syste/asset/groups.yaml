    ![](img/3926ca1fb00de3af845faa03d2c351e5_28_0.png)


    10. Click Finish. The wizard will close and you''re now ready to explore the wonderful
    world of Linspire. At this point a tutorial video may appear. You can choose to
    watch this video, or click the "X" in the top right corner to close the tutorial.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_28_1.png)'
  - '[PAGE 29]


    # LinspireLive!


    Are you one of those people who get into a pool one inch at a time instead of
    diving in? For many people change is difficult, so if you''re a little hesitant
    about exploring Linspire, you can take advantage of LinspireLive! LinspireLive!
    lets you to enjoy the benefits of Linspire on your computer by running the operating
    system off of a CD rather than installing it to your hard drive. The Linspire
    CD is attached to the back of this book.


    Running LinspireLive! is as simple as putting the CD into your computer''s CD
    drive and restarting your system. The only work you have to do is let your computer
    know to boot from the CD reader rather than the hard drive if it is not already
    configured to do so. See the section earlier in the chapter entitled "Booting
    from CD" to see more information on accessing the BIOS.


    +   1. Insert the LinspireLive CD into your computer''s CD drive.


    +   2. Restart your computer. Depending on the operating system you are using,
    this action may involve using the Restart feature of the operating system or it
    may require turning off your computer then or again. Within moments the Linspire
    operating system will be loaded and you can begin exploring the world of this
    innovative operating system.


    > LinspireLive! is a wonderful feature for testing Linspire, but it is not meant
    as a permanent solution. If you like what you see, you should install Linspire
    to your computer''s hard drive.


    # Ending Your Linspire Session


    I know...I know... you''re too excited about using your computer and you don''t
    want to turn it off. I''ll give you five more minutes of playing, but then you
    have to come back and read the following section that instructs you on the proper
    procedure for turning off your computer.'
  - '[PAGE 30]


    # Ending Your Linspire Session


    ![](img/3926ca1fb00de3af845faa03d2c351e5_30_0.png)


    +   1. Close any of your open applications by clicking the “X” in the top right
    corner. You may be prompted to save your files.


    +   2. Click the Launch button. A menu will appear.


    +   3. Click Logout/Turn Off. A dialog box will appear and will present you with
    several options.


    +   4. Click one of the options, which include:


    +   - End Session. This logs you off but keeps your computer on.


    +   - Quick Restart. Lets you restart your computer quickly to allow a setting
    to take effect or resolve an issue. This usually takes seconds to complete.


    +   - Restart Computer. Lets you completely turn your computer off and on again.


    +   - Turn Off Computer. I’ll give you three guesses as to what this does.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_30_1.png)


    ![](img/3926ca1fb00de3af845faa03d2c351e5_30_2.png)


    > Pressing the Ctrl, Alt and Delete key on the keyboard, all at the same time,
    will open the End Session dialog box.'
