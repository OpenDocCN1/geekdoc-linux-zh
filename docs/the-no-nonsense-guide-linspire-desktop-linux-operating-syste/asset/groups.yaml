    +   4. Repeat Steps 2 - 3 for any remaining items that you would like to add to
    your numbered list.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_114_0.png)


    5. Press the Enter key twice to end the numbered list.


    Numbering button. Wherever there is a hard return in your text, a new number will
    be created for your list. Alternatively you can start by pressing the Number button
    to create your numbered list from scratch.


    +   1. Select the text that you would like to make into a numbered list. It will
    be highlighted.

    2. Click the Numbering button. A numbered list will be created from the selected
    text.

    3. Click the Numbering button again to remove the numbered list.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_114_1.png)'
  - '[PAGE 115]


    # Bullets


    Bullets are used to make key points about a particular topic stand out. While
    numbered lists are used when information has to appear in a specific order, bullets
    can be used to emphasize lists of information in any order. As with numbering,
    bullets can be created from scratch or they can be applied to text.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_115_0.png)


    +   1. Select the text that you would like to make into a bulleted list. It will
    be highlighted. Alternatively, you could create a bulleted list from scratch by
    clicking the Bullets button before you begin your list.

    2. Click the Bullets button. A bulleted list will be created from the selected
    text.

    3. Click the Bullets button again to remove the numbered list.


    # Highlighting


    When you were making notes from your textbooks in school, you probably highlighted
    certain passages so that you could quickly reference them. Word Processor has
    a Highlight tool that mimics real-life highlighting. You simply have to select
    a highlighter and drag across the text you want to highlight.


    +   1. Click and hold the Highlight button. A list of different colors will appear.

    2. Click the desired highlighter color.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_115_1.png)'
