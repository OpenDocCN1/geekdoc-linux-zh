    \n本书以视觉化和程序化的格式呈现材料。我们没有让您埋没在一堆理论信息中，而是提供了可以完成许多不同任务的逐步指令。每条指令都配有一张屏幕截图，准确显示了点击何处完成任务。在此过程中，您还将发现许多技巧和快捷键，以让您的工作更明智、更快速。\n\
    \n书中使用的指令非常直接，除了某些命令之间的约定外，没有使用任何异常惯例，例如\n\n在您阅读本书时，您可能会注意到屏幕上显示的内容与书中的截图略有不同。别担心，这是正常的。取决于您的计算机最初的制造或配置方式，您的计算机与用于编写本书的计算机之间可能存在细微差异。\n\
    \n原本需要百科全书才能涵盖的内容，在书中都得到了呈现。\n\n前言\n\nMichael Robertson，Linspire 首席执行官\n\n## 为什么选择\
    \ Linux？\n\n当我创立 Linspire 时，我意识到要与微软竞争需要更聪明地工作，而不是更苦地工作。他们拥有更多的资金、更多的人手，并且生产 Windows\
