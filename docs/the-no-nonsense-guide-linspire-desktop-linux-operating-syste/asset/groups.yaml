    ![](img/3926ca1fb00de3af845faa03d2c351e5_73_1.png)


    ## 查看文件


    文件管理器为你提供了电脑上所有文件的图形化表示。你可以根据自己的偏好调整这种图形化表示。例如，你可以以不同大小的图标查看文件，选择以列的形式查看文件，或更改视图结构。你选择的视图类型取决于你的目标和偏好。


