    # Printers


    No operating system is an island, and Linsp is no exception. Typically you have
    several devices that work alongside your computer to make sure it is a complete
    solution to your needs. The most common of these devices is a printer.


    Let''s face it, as convenient as computers are, most of us prefer to read documents
    from a piece of paper rather than a monitor. To do this, you need a printer installed
    and configured for your system. Linsp makes it easy for you to set up printers
    and other types of hardware that you''ll use along side your computer.


    In this chapter we''ll cover:


    +   - Setting up a printer

    - Printing documents'
