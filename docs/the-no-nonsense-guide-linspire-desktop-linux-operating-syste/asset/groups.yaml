    ## Sorting Data


    Remember in primary school when your class would have to line up from shortest
    to tallest? Aside from the really short or the really tall, it gave you a valuable
    lesson in sorting. Sorting, in essence, changes the order of how your information
    is displayed in the spreadsheet. Not only can you select what you want to sort
    but also in what order.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_129_0.png)


    - 1. Click and drag across the data that you would like to sort. Alternatively
    you can click Ctrl+A to sort the entire spreadsheet.

    - 2. Click Data | Sort... The Sort dialog box will open.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_129_1.png)


    - 3. Click the radio button beside the desired sorting option. You can choose
    either ascending or descending.

    - 4. Click the drop-down menu and choose the criteria to sort. Typically this
    is the column title that you would like to sort.


    ## AutoFilter


    ![](img/3926ca1fb00de3af845faa03d2c351e5_130_0.png)


    - 5. Repeat Steps 3 and 4 in the "Then by" areas for secondary and tertiary sort
    options. In other words, after the first sort option is selected, what is the
    second and third sorting criteria that should be followed.

    - 6. Click OK. The dialog box will close and your sort will be conducted.


    ## AutoFilter


    Who says that bread was the greatest invention? Rather than sorting yours, AutoFilter
    automatically filters information from your spreadsheet based on criteria you
    set. Little menus will appear from which you can select criteria to filter your
    data. We''ll use the example of a soccer team. If I had a spreadsheet of an entire
    league and wanted to filter the data to find certain similarities, for example,
    see only the people who were on a specific team, AutoFilter allows me to do this
    at the click of a mouse button.


    - 1. Click and drag across the cells that you would like to filter AutoFilter.

    - 2. Click Data | Filter | AutoFilter. Little arrows will appear at the edge of
    the top cells in your selection. These are pop-up menus that can be used to filter
    your data.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_130_1.png)


    ## Chapter 6 Creating Spreadsheets


    ![](img/3926ca1fb00de3af845faa03d2c351e5_131_0.png)


    - 3. Click any of the AutoFilter arrows. A list of contents that can be filtered
    will appear, along with a few other options.

    - 4. Click the desired criteria that you want to filter. In this example, I want
    to see only those people who are on the Red team and filter out the rest. so I
    click Red. The spreadsheet will filter out everything but the criteria that I
    selected.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_131_1.png)


    - 5. Repeat Steps 4 and 5 for any other columns that you would like to filter.

    - 6. Click any of the AutoFilter arrows that you have previously filtered. The
    list will reappear.

    - 7. Click All. The filter will be removed and all of the data within the column
    will reappear, unless there is a filter on another column preventing the data
    from being shown.


    ## AutoFill


    - 8. Click Data | Filter | AutoFilter to remove AutoFilter and return your document
    to its pre-filtered state.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_132_0.png)


    When creating spreadsheets there are certain strings of text that you typically
    have to create and over. Examples of these include, days of the week, months,
    and numbered lists. To help you complete these tasks faster Spreadsheet has an
    AutoFill tool which allows you to enter only the first part of a string, and Spreadsheet
    will do the rest. For example, if you wanted to create a sheet with the days of
    the week, you would only have to type Monday, the rest of the days could be AutoFilled.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_132_1.png)


    ## Basic AutoFills


    For simple AutoFills you can enter a value, then click and drag.


    - 1. Type the first value for the string you want to create. This can be any number
    or certain words including days of the week, months or dates.

    - 2. Position the mouse pointer over the bottom right corner of a cell. The mouse
    pointer will turn into a small plus sign.


    ## Chapter 6 Creating Spreadsheets


    - 3. Click and drag in the direction where you want the rest of the string to
    appear. In this example, we are dragging downwards to enter the different days
    of the week in the first column.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_133_0.png)


    - 4. Take the mouse pointer over the tool that appears as you drag. The tip will
    tell you the content of the string.

    - 5. Release the mouse button.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_133_1.png)


    ## Copying with AutoFill


    Another handy use of AutoFill is to copy. Whether you want to copy one cell over
    or if you want multiple cells, you can accomplish this with:


    - 1. Click and drag across the cells that you would like to.

    - 2. Position the mouse pointer over the bottom right corner of a cell. The mouse
    pointer will turn into a plus sign.

    - 3. Click and drag over the destination where you want to.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_134_0.png)


    - 4. Release the mouse button. If the area was greater than the selection, the
    cells will be filled.


    > Typical editing features like copying, pasting and undo are the same in the
    suite.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_134_1.png)


    ## Formatting Spreadsheets


    One of the best ways to make your data easier to understand is to apply colors
    to the cells in your spreadsheet.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_134_2.png)


    Let''s face numerical data can be quite intimidating. To alleviate some of the
    fear people face when encountering a spreadsheet, you can format in a variety
    of ways. Most formatting features are found in the Format Cells dialog box.


    - 1. Select the cells that you want to. They will be highlighted.

    - 2. Right-click anywhere on the selection. A menu will appear.

    - 3. Click Format Cells...


    | Name | | |

    |---|---|---|

    | Ethan | | 6 |

    | Eric | | 2 |

    | Kara | | 5 |

    | Ron | | 2 |

    | Leon | | 1 |

    | Rob | | 3 |

    | Meredith | | 2 |

    | Evan | | 2 |


    > Many of the formatting features discussed below can also be accessed from the
    toolbar. Hover your mouse pointer over any button to see what it does.


    ## Applying Colors to Cells


    ![](img/3926ca1fb00de3af845faa03d2c351e5_135_0.png)


    - 1. Click on the Background tab. You will be presented with a palette of colors
    to select the cell background.

    - 2. Click the color that you want to apply. A preview of the color will appear
    in the dialog box.

    - 3. Click OK. The Format Cells dialog box will close and your selection will
    be colored.


    ## Formatting Worksheets


    ![](img/3926ca1fb00de3af845faa03d2c351e5_135_1.png)


    ## Wrapping and Rotating Text


    If you enter text into a cell that is longer than the width of the cell, the text
    will be cut off by any content in the cell beside it. To avoid this you can select
    the wrap. Just like in a word processor, when text reaches the width of the cell,
    it will flow to another line with text wrapping activated. You can also rotate
    text within a cell.


    - 1. Select the cells that you want to. They will be highlighted.

    - 2. Open the Format Cells dialog box as discussed in the "Formatting Worksheets"
    section earlier.

    - 3. Click on the Alignment tab.

    - 4. Click on the up and down arrows to change the degree of rotation for the
    text in the cell.

    - 5. Click on the Automatic line break check box so that text will wrap.

    - 6. Click OK. The effect is applied.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_136_0.png)

