    # Word Processing


    Typically when you purchase a computer, you are given only a bare bones system
    with little useful software. In order to do anything meaningful with it, you must
    go out and spend money on a suite of office with a word processor, a spreadsheet
    and a slide show program.


    Your Linspread computer comes pre-installed with the OpenOffice suite. This office
    is not run-of-the-mill, freebie software package. It is jam-packed with features
    to meet all your document, spreadsheet and slide show needs. If you''re migrating
    from Microsoft Windows to Linspread, you''ll find making the switch to OpenOffice
    a breeze. The functionality is almost identical and the document conversion is
    almost flawless. Word Processor is the cornerstone of the OpenOffice suite. It
    provides you with all of the components you''ll need to create just about any
    type of document Although it would take an entire book to cover all of the features
    of Word Processor, the goal of this chapter is to give you a thorough grounding
    in the program and take you beyond just the basics of creating documents.


    In this chapter we''ll cover:


    +   - Document file basics

    - Page setup

    - Basic and advanced formatting


    ![](img/3926ca1fb00de3af845faa03d2c351e5_100_0.png)'
  - '[PAGE 101]


    # Launching Word Processor


    The entire OpenOffice suite is located in the Business & Finance section of the
    Launch menu. All of the programs, including Word Processor, Spreadsheets, Drawings
    and Presentations can be found there.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_101_0.png)


    +   1. Click the Launch button then click Run Programs. A list of categories will
    appear.

    3. Click Business & Finance. A submenu will appear.

    4. Click OpenOffice. Another submenu will appear.

    5. Click OpenOffice Word Processor. This action will launch the Word Processor.


    # Creating a New Document


    If you''re interested in creating a document from scratch, you can do so easily.


    +   1. Click the New button on the toolbar. A blank document will open.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_101_1.png)'
  - '[PAGE 102]


    # Opening an Existing Document


    # Opening an Existing Document


    There will be many occasions when you will continue working on a document that
    you have previously been working on. In these cases, you simply have to open the
    file.


    +   1. Click File | Open. The Open dialog box will appear.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_102_0.png)


    > The keyboard shortcut to execute the Open command is Ctrl+O.


    +   2. Navigate to the folder that contains the file that you would like to open.


    +   3. Click the desired file that you would like to open. The file will be highlighted.


    +   4. Click Open. The file that you have selected will open.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_102_1.png)'
  - '[PAGE 103]


    # Opening Other Formats


    Believe it or not, not everyone creates all their documents using the same software
    program. No worries though, Word Processor supports a multitude of different file
    types that you can open. The procedure for opening these types of files is the
    same as any other file.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_103_0.png)


    +   1. Click the Open icon. This action will bring up the Open dialog box.

    2. Click the File type drop-down menu button to see a list of different file types
    that can be opened.

    3. Click the desired file type to see only those types of files in the dialog
    box.

    4. Click the desired file that you would like to open and press Enter on the keyboard.
    The file that you selected will open.


    # Saving


    Everyone has a horror story about losing some or all of their work due to computer
    failure, power outage, etc. It''s always a good idea to save your documents frequently.


    # Save As...


    The Save As function allows you to save and name your document at the same time.
    The first time you save a new document, the Save As dialog box will appear, regardless
    of whether you choose Save or Save As... Save As can also be used at any time
    to save your document under a new name or in a new location.'
