    ## Preparing for Installation


    If you''re a frequent flyer you know that before taking off the pilot goes through
    an intensive checklist to ensure that everything is ready for a safe and uneventful
    flight. The same is true for the Linspire installation process. There are several
    key points that you should understand before beginning the installation process.
    These include: understanding how to boot from a CD, creating partitions for your
    hard drive (this is optional), and ensuring your minimum system requirements are
    correct.


    ## Booting from CD


    When a computer starts


    Although every computer is different, you can generally find instructions about
    accessing the BIOS from a splash screen that appears when you first start your
    computer. This screen will indicate what key to press to enter the system BIOS,
    which is sometimes called "setup." Once you are in the BIOS you can change the
    boot sequence so that your computer looks to your CD drive. If you''re having
    trouble changing the boot sequence for your computer, the Internet is a great
    resource for getting help. If you can access a computer with an Internet connection
    you can perform a Google search (www.google.com). In the Google search box, type
    the brand of your computer and the words "boot sequence." The results will display
    instructions on changing the boot sequence for your computer.


    ## Creating Partitions


    You can divide the hard drive on your computer into distinct sections called "partitions."
    Linspire lets you install the operating system either to the entire hard drive
    or to one of these partitions. Before you install to a partition, you must first
    set it correctly. Please keep in mind that you should be comfortable with creating
    partitions as you can inadvertently delete existing data on your computer. You
    can find instructions on creating hard drive partitions on the Internet, or as
    part of the documentation of your partitioning software.


    ## Installing Linspire


    ### Minimum System Requirements


    The final thing you need to do before starting the installation process is to
    ensure that your computer has enough power to run Linspire. Although it is possible
    to install the operating system on a machine that doesn''t meet all of these requirements,
    it is not recommended. The minimum system requirements are as follows:


    - 128 MB of RAM

    - An 800MHz processor (or equivalent AMD processor)

    - 4GB of available hard disk space

    - A monitor with 1024 x 768 resolution

    - CD-ROM or DVD drive, keyboard and mouse

    - Linspire-compatible sound card and speakers or headphones (recommended)

    - Ethernet card for Internet/LAN connectivity (recommended)


    ## Installing Linspire


    To complete the installation process, you must answer a few simple questions in
    the Installation wizard. As you go through the wizard, you will have to make a
    decision whether you want to install the operating system to the hard drive, or
    to install the operating system to a partition.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_20_0.png)


    - 1. Insert the Linspire installation CD in your computer''s CD drive and start
    your computer. After several moments a splash screen will appear. At this point
    you can press Enter on your keyboard or just wait, and after several seconds the
    installation process will continue.

    - 2. Click Next. You''ll advance to the next screen of the installation process.


    ## Chapter 1 Installing Linspire


    > Be patient during the initial install stage. Depending on the speed of your
    computer and its components, it may take several minutes for the initial install
    screens to appear.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_21_0.png)


    - 3. Click your desired keyboard settings. Your selection will be highlighted.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_21_1.png)


    - 4. Click Next. You''ll advance to the next step of the installation process.

    - 5. Click the radio button beside Install, unless you already have a version
    of Linspire installed on your computer. If you are upgrading your current version
    of Linspire, click the radio button beside Update.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_21_2.png)


    - 6. Click Next. If you selected the Update option in Step 5 skip to Step 11.
    You''ll have to make a decision whether you want to install Linspire to a partition
    or if you want it to take over your entire hard drive. If you want Linspire to
    take over your entire hard drive then continue to Step 7, otherwise skip to Step
    9.


    ## Installing Linspire


    - 7. Click the radio button beside Take over an entire hard disk. A little dot
    will appear in the circle after it has been selected.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_22_0.png)


    - 8. Click Next. You''ll advance to the next step of the installation process.
    Proceed to Step 11 as the next steps deal with partition installations.


    If you are installing Linspire to a partition make sure that the partition has
    at least four gigabytes of space. This will ensure you have enough space for both
    Linspire and your files.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_22_1.png)


    - 9. Click the radio button beside Advanced Install. A little dot will appear
    in the circle after it has been selected.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_22_2.png)


    - 10. Click Next. You''ll advance to the next step of the installation process.


    ## Chapter 1 Installing Linspire


    - 11. Click the desired partition you would like to install the operating system.
    After you click the partition, it will be highlighted.

    - 12. Click Next. If you select the "Update" installation option in Step 5 jump
    to Step 16. Otherwise continue to 13.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_23_0.png)


    - 13. Type a name for your computer. This is how your computer will be recognized
    on a network.

    - 14. Type a password in the Administrator and Confirm Password fields. The password
    will appear as a series of stars, so that nobody watching your screen will be
    able to see it. It is optional, but it''s a good idea to help you make your computer
    more secure.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_23_1.png)


    - 15. Click Next. You''ll advance to the Setup Confirmation screen of the install
    wizard.


    Use only letters and numbers when naming your computer. Hyphens, underscores,
    and other characters cause problems if you want to network your computer.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_23_2.png)


    ## Installing Linspire


    > Use a password that you are sure to remember as Linspire has no way of recovering
    it. It may be a good idea to write the password down and store it in a safe place.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_24_0.png)


    - 16. Click the Back button after reviewing the Setup Confirmation screen if there
    is anything that needs to be changed.


    ### Setup Confirmation

    Linspire will now be installed on your computer using the following settings:


    | Installation Method | Target |

    | :--- | :--- |

    | | |


    Setup Confirmation shows a summary of the selections you made in the previous
    steps. If you find an error, you can return to any step using the Back button.


    If the selections are correct, click Finish to start the installation.


    - 17. Click Finish. A dialog box will appear giving you a last chance to go back
    and make changes before the installation begins.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_24_1.png)


    - 18. Click OK. Your computer will restart, and the CD will be ejected from the
    CD drive. Take the CD out when ejected then close the CD door and press the Enter
    key on your keyboard. It may take several minutes for the system to completely
    restart.


    ### Setup Confirmation

    PLEASE VERIFY YOUR CHOICES

    You have selected the following


    | Installation Method | Target |

    | :--- | :--- |

    | Take over Disk | |


    This process will ERASE ALL DATA from the drive on which you have selected. If
    you are happy with what you want, select OK to continue select Let Make Changes
    and then the Back button to return to another selection or to make more changes.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_24_2.png)


    ## Running Linspire for the First Time


    - 19. Click OK. Your computer will restart, and the CD will be ejected from the
    CD drive. Take the CD out when ejected then close the CD door and press the Enter
    key on your keyboard. It may take several minutes for the system to completely
    restart. Linspire is now installed on your computer and is ready to use.


    What you see on your screen the first time you turn on your Linspire machine will
    depend on several factors: who configured your Linspire computer; whether you
    installed the operating system yourself, or if your computer came pre-installed
    from the store. There are several screens that may appear including an initialization
    screen, the CNR trial membership screen, a tutorial video, and perhaps the Startup
    wizard.


    > If you entered an Administrator password during the installation process, you
    will need to type that password before you can proceed into the operating system.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_25_0.png)


    ![](img/3926ca1fb00de3af845faa03d2c351e5_25_1.png)

