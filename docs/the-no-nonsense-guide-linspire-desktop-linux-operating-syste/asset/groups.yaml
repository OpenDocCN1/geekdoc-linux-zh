    +   3. Click on the desired subcategory. All of the programs that fall under that
    category will be displayed.


    +   4. Use the scroll buttons to browse through the different software applications
    that have been found.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_203_1.png)


    > Beside each of the categories you may have noticed a number in brackets: This
    represents the number of programs that fall under that category.


    # Browsing by Aisle


    Think of an aisle as a group of software that falls under a specific purpose or
    task then just a category. For example, if you''re a graphic designer, you''re
    probably looking for programs that might span a variety of categories including
    photo editing, page layout, art and vector programs. Linscape has a wide range
    of aisles that contain groups of programs designed for specific users or uses.
    Some examples of aisles include student aisles, developer aisles, kids aisles,
    web aisles and many more. Not only can you browse through the different aisles,
    but you can also create your own. The Linscape community becomes evident when
    working with aisles as every aisle you create can potentially be viewed by other
    members of the community.'
  - '[PAGE 204]


    # Finding Programs


    ![](img/3926ca1fb00de3af845faa03d2c351e5_204_0.png)


    1. Click on the Aisles link on the left side of the screen.


    2. Type a name for the type of aisle you are looking for. Some examples of search
    terms would be student, kids, design or web.


    3. Click the Go button. All of the results that match your search will be displayed.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_204_1.png)


    > Linspire gives you the ability to change the size of the text in CNR without
    adjusting your monitor''s resolution. Simply click the Text Zoom In or Out buttons
    on the toolbar.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_204_2.png)


    4. Click on the desired result to see all of the programs that fall within that
    aisle. A list of all the programs that fall within that aisle will appear. When
    you are ready to download and install a program, proceed to the section entitled
    "Installing Programs with CNR."'
- md: '

    ## Creating Aisles


    You always have the ability to create your own aisles in Linspire. Whether you''ve
    got a great idea for an aisle that you''d like to share or if you''d just like
    to group some programs for your own use, creating an aisle is a breeze.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_205_0.png)


    1. Click the Aisles link on the left side of the page.

    2. Click the Create Aisle link. You will now be prompted to add information about
    your link.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_205_1.png)


    3. Type a name for your Aisle in the field provided.

    4. Type a short description that tells about the type of programs that will be
    found in your aisle.

    5. Type in a name for an express URL. This will provide you quick access to your
    aisle.

    6. Click the radio button to make your aisle Public or Private.


    ## Finding Programs


    7. Scroll to the bottom of the page and click the Create Aisle button. Your aisle
    will be created and you can now add programs to that aisle. Keep in mind that
    you can create as many aisles as you''d like.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_206_0.png)


    8. Search for programs using any of the search methods.

    9. Click the Add to Aisle button beside any of the programs you would like to
    add to an aisle. It is the orange button with three lines in it.


    ## Chapter 10 Installing Programs


    ![](img/3926ca1fb00de3af845faa03d2c351e5_207_0.png)


    10. Click on the Add to this Aisle link beside the aisle that you would like to
    add this program to. Alternatively you can click the Add to New Aisle link if
    you want to create a new aisle for this program.

    11. Click on the + beside Aisles in the left panel of the screen. The area under
    Aisles will expand.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_207_1.png)


    12. Click the My Aisles Link. a list of all your aisles will appear.

    13. Click on the link under the desired aisle to view its contents.


    ## Installing Programs with CNR


    Now that you know how to find programs, it''s time to start installing them. It''s
    incredibly easy to add programs to your Linspire computer using CNR.


    1. Click on the CNR logo beside the name of the program you want to load. The
    CNR logo is green and has a white image of a man running in it. The program will
    be downloaded and installed to your computer. Take note of the category that the
    program falls under as this is where you will find it on the Launch menu.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_208_0.png)


    ## Getting Program Information


    You may have noticed during your search for programs that there was a little blue
    icon beside the names of certain programs. You can use this button to get additional
    information on the programs in CNR.


    1. Click on the blue button that appears beside a program name. The screen will
    now change to provide you with information on that program.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_208_1.png)


    2. Click on any of the Description/Comparison links to get even more information
    on the title.

    3. Click the CNR button if you are ready to install this program. Alternatively
    you can click the Add to Aisle to add this to one of your aisles.

    3. Click the Back button to return to the previous screen.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_209_0.png)


    ## Updating and Removing Programs


    Don''t just have it when you buy a program and a couple of weeks later they come
    out with a new version? You''ll have less worry when using CNR, because not only
    do you not have to pay for updates, CNR can update all your software at the click
    of a button. CNR also keeps tracks of all the programs you''ve installed, on any
    computer, so it knows exactly what you have and what needs to be updated.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_209_1.png)


    1. Click on the My Products tab at the top of the page. You will be taken to a
    screen that shows all of the products you have installed on your computer as well
    as those where installation was attempted but not completed.

    2. Click on the product that you would like to update, install or remove. If an
    update is available, a check mark will appear in the Update Available column.
    You can hold the Ctrl and click on multiple products if you would like update
    or remove more than one at a time.


    ## Managing Your CNR Account


    ![](img/3926ca1fb00de3af845faa03d2c351e5_210_0.png)


    3. Click on the Install/Update Selected button. The highlighted programs will
    be updated.

    or

    3. Click on the Uninstall Selected button.

    4. If you selected Uninstall, click Yes at the dialog box to confirm that you
    would like to uninstall the selected programs. The program will be removed from
    your system.


    ## Managing Your CNR Account


    You can view the status of your account, change passwords, and adjust your address
    and billing information from the My Account section of CNR.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_210_1.png)


    1. Click on the CNR Warehouse tab if it is not already selected.

    2. Click on the My Account option. The main page of the My Account window will
    appear, showing the current status of your subscriptions.

    3. Click on any of the links to move to the desired screen. Once you are there
    you can follow the on-screen directions for changing any of the information. For
    example, if you clicked on the My Password link, there will be instructions on
    changing your password.


    ## Click-N-Buy


    You may have noticed browsing the aisles of CNR that some programs had a price
    labeled underneath their listing. While most programs in the CNR Warehouse come
    free with your subscription, there are other premium packages that need to be
    paid for installed, as a CNR member you get a significant discount off the retail
    price of these products.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_211_0.png)


    1. Click on the Click-N-Buy option on the left side of the window. A list of software
    packages available for purchase will appear.

    2. Click on the green button beside the program you would like to purchase. Your
    shopping cart summary will appear.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_211_1.png)


    3. Click on Checkout. A screen confirming your credit card information will appear.


    ## Click-N-Buy


    4. Click the Continue button if the credit card you would like to use is listed.
    Otherwise, click the Add button to add a different credit card.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_212_0.png)


    5. Click the Place Order button. The product you purchased will now be downloaded
    to your machine.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_212_1.png)


    > Linscape also gives you the option of purchasing services like virus protection
    and parental controls for web browsing. These features can be found by clicking
    the Services option.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_212_2.png)


    ## Autostarting Programs


    I love listening to the radio through Lsongs when I work on the computer. This
    program is so important to me that I have it start automatically when the Linspire
    operating system launches. You can do the same with any program.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_213_0.png)


    1. Click Launch. The Launch menu will appear.

    2. Click Settings. A submenu will appear.

    3. Click Additional Options. Another submenu will appear.

    4. Click Programs to Autostart. A window will appear with all of the programs
    that are currently set to autostart.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_213_1.png)


    5. Click Launch | Run Programs. A list of categories will appear.

    6. Click the category under which the program you would like to autostart falls.

    7. Click and drag the program that you would like to autostart to the Autostart
    window. When you release the mouse button, a menu will appear.

    8. Click Copy Here. A shortcut will appear in this window. This program will now
    start automatically whenever you start your computer.

    '
  mdcn: '


    ## 创建通道 (Aisles)


    在 Linspire 中，你随时可以创建属于自己的通道。无论你有一个想要分享的绝佳通道主意，还是只是为了方便自己而对某些程序分组，创建通道都是轻而易举的。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_205_0.png)


    1. 点击页面左侧的“通道”（Aisles）链接。

    2. 点击“创建通道”（Create Aisle）链接。现在系统会提示你添加有关该链接的信息。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_205_1.png)


    3. 在提供的字段中为你的通道输入一个名称。

    4. 输入简短描述，说明该通道中将找到什么类型的程序。

    5. 输入快速 URL（express URL）。这将让你能够快速访问该通道。

    6. 点击单选按钮将你的通道设置为“公共”（Public）或“私有”（Private）。


    ## 查找程序


    7. 滚动到页面底部并点击“创建通道”按钮。你的通道将被创建，现在你可以向该通道添加程序了。请记住，你可以创建任意数量的通道。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_206_0.png)


    8. 使用任何搜索方法查找程序。

    9. 点击你想添加到通道的任何程序旁边的“添加到通道”（Add to Aisle）按钮。它是一个带有三条横线的橙色按钮。


    ## 第 10 章 安装程序


    ![](img/3926ca1fb00de3af845faa03d2c351e5_207_0.png)


    10. 点击你想添加此程序的通道旁边的“添加到此通道”（Add to this Aisle）链接。或者，如果你想为此程序创建一个新通道，可以点击“添加到新通道”（Add
    to New Aisle）链接。

    11. 点击屏幕左侧面板“通道”旁边的 `+` 号。通道下方的区域将会展开。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_207_1.png)


    12. 点击“我的通道”（My Aisles）链接。将出现你所有通道的列表。

    13. 点击所需通道下的链接以查看其内容。


    ## 使用 CNR 安装程序


    现在你已经学会了如何查找程序，是时候开始安装它们了。使用 CNR 为你的 Linspire 计算机添加程序极其简单。


    1. 点击你想要加载的程序旁旁的 CNR 图标。CNR 图标是绿色的，里面有一个男人跑步的白色图像。程序将会被下载并安装到你的计算机上。请注意程序所属的类别，因为你将在启动菜单（Launch
    menu）中找到它。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_208_0.png)


    ## 获取程序信息


    在查找程序时，你可能注意到某些程序名称旁边有一个蓝色小图标。你可以使用此按钮获取 CNR 中程序的额外信息。


    1. 点击程序名称旁出现的蓝色按钮。屏幕现在将切换，为你提供该程序的信息。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_208_1.png)


    2. 点击“描述/比较”（Description/Comparison）链接中的任意一个以获取更多标题信息。

    3. 如果你准备好安装此程序，请点击 CNR 按钮。或者，你可以点击“添加到通道”（Add to Aisle）将其添加到你的某个通道中。

    3. 点击“返回”（Back）按钮返回上一个屏幕。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_209_0.png)


    ## 更新和移除程序


    难道你不希望在购买程序几周后他们就发布了新版本吗？使用 CNR 时你的担心会更少，因为你不仅不需要为更新付费，CNR 还可以点击一下即可更新你所有的软件。CNR
    还会跟踪你在任何计算机上安装的所有程序，因此它确切地知道你拥有什么以及哪些需要更新。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_209_1.png)


    1. 点击页面顶部的“我的产品”（My Products）选项卡。你将进入一个显示你计算机上安装的所有产品，以及尝试安装但未完成的产品界面。

    2. 点击你想更新、安装或移除的程序。如果有可用更新，“可用更新”（Update Available）列将出现复选标记。如果你想一次更新或移除多个产品，可以按住
    `Ctrl` 键并点击多个产品。


    ## 管理你的 CNR 账户


    ![](img/3926ca1fb00de3af845faa03d2c351e5_210_0.png)


    3. 点击“安装/更新已选”（Install/Update Selected）按钮。高亮的程序将被处理。

    3. 点击“卸载”（Uninstall）。


    ## 管理你的 CNR账户


    你可以查看账户状态、更改密码并调整账单信息。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_210_1.png)


    1. 点击 CNR 仓库中的“我的账户”（My Account）选项。将出现显示你订阅状态的窗口。

    2. 点击“已选”（Selected）程序。

    3. 如果你想要卸载，点击对话框中的“是”。被选中的程序将被移除。


    ## 点击即可购买


    你可能在浏览 通道时发现有些程序标有价格。虽然大多数 CNR 程序是免费的，但作为 CNR 会员，这些产品可以大幅折扣。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_211_0.png)


    1. 点击左侧的“点击即可购买”（Click-N-Buy）。将出现可购买的软件包列表。

    2. 点击你想购买的程序旁边的绿色按钮。将出现购物车摘要。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_211_1.png)


    3. 点击“结账”（Checkout）。将出现确认信用卡信息的界面。


    4. 如果你想使用的信用卡在列表中，点击“添加”（Add）按钮添加不同的信用卡。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_212_0.png)


    5. 点击“下单”（Place Order）按钮。你购买的产品现在将下载到你的机器上。


    > Linscape 还提供病毒防护和网页家长控制等服务。这些功能可以通过点击“服务”（Services）选项找到。


    ## 自动启动程序


    在计算机上工作时，我喜欢通过 Lsongs 听广播。由于这个程序对我来说非常重要，以至于我让它在 Linspire 操作系统启动时自动运行。你可以对任何程序执行此操作。


    1. 点击“启动”（Launch）。将启动菜单。

    2. 点击“设置”（Settings）。将出现子菜单。

    3. 点击“其他选项”（Additional Options）。将出现另一个子菜单。

    4. 点击“自动启动程序”（Programs to Autostart）。将出现显示所有设置为自动启动的程序的窗口。


    5. 点击“启动 | 运行程序”（Launch | Run Programs）。将出现类别列表。

    6. 点击你想自动启动的程序所属的类别。

    7. 点击并拖动你想自动启动的程序到“自动启动”窗口。松开鼠标时，将出现菜单。

    8. 点击“复制到此处”（Copy Here）。该窗口将出现一个快捷方式。现在，每当你启动计算机时，该程序都会自动启动。


    '
