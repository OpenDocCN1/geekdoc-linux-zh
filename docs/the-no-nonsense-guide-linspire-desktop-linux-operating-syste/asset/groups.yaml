    IM 窗口了。有了 Linspire，你可以同时登录所有的 IM 账户，并在列表中查看你所有的好友。然后将所有的聊天都放在一个标签页窗口中，让你的屏幕告别杂乱，这样就不会跟掉重要的对话。但为什么要停留在基于文本的通信呢？我们的即时通讯工具可以让你拨打基于网络的全球电话。


    到目前为止，你可能已经熟悉系统变慢的问题。让电脑连续运行几天，它就会尖叫着停止。确保每个月留一天进行硬盘碎片整理（碎片整理是移动硬盘上的数据，因为数据是分散或碎片化的），否则后果很严重。你能想象如果你家里的任何其他电器变成那样吗？如果你必须偶尔关闭冰箱否则它就无法保持低温会怎样？或者如果你每个月必须移动所有的
    DVD 否则 DVD 播放器就无法读取它们会怎样？太荒谬了对吧？那么，为什么我们对电脑也认为这些事情是不荒谬的呢？因为我们已经习惯了接受变慢、死机、崩溃和重启作为生活的一部分——但我们不应该这样做。


    由于 Linspire 的稳定性和安全性，你可以一次离开电脑几周甚至几个月而无需担心。至于碎片整理——忘掉它吧！使用 Linspire 再也不需要对电脑进行碎片整理。这是因为
    Linspire 的文件系统从根本上防止了碎片产生。所以告别这些不必要的系统幻灯片、死机以及那个宣布“你的计算机崩溃，我们丢失了数据”的令人恼的蓝屏吧。有了
    Linspire，我们一直不得不接受的那些挫折现在已成为过去。


    # 所以 Linspire 未来还有什么期待？


    选择。Linspire 在三年内走过了很长的一路。我们开发了一个与其昂贵的竞争对手一样好的操作系统，在许多方面它更好。预计这种情况将持续。我们每天努力工作打造最好的桌面操作系统。


    我们正在构建让生活变得更简单的技术。从 Lsongs（一个可以让你刻录 CD、提取 MP3、下载音乐、听音乐、分享音乐等功能的音乐管理器）到用于观看商业电影的授权
    DVD 播放器，我们一直处于用户友好软件的前沿。通过 CNR 仓库的“自助餐”模式，以及允许无额外费用即可在家里每台电脑上安装 Linspire 和 CNR
    软件的家庭友好许可，我们正在实施以消费者为先的实践。


    我们在技术行业采取了一种新方法——将你优先，始终询问我们如何改进你的生活。通过这种方法，而不是许多公司采取的传统“如何赚更多钱”的立场，你可以确信 Linspire
    的未来意味着新的、更好的、更廉价、多功能的软件将让生活变得更轻松。


    ## 享受这本书，并享受 Linspire


    我只是让你一览了 Linspire 一直研究的创新，以及我们继续持续创新的原因。这本书将深入探讨 Linspire 的所有优秀功能以及如何使用。你可能会发现
    Linspire 非常易用，以至于你不需要书中的许多章节，但作为参考是非常棒的。


