- md: '

    ## Managing the Web Browser


    Everyone has different preferences when it comes to working on the computer, and
    using the Web Browser is no different. You can configure and control how certain
    pages appear, manage how they are handled and determine how certain information
    is exchanged.


    ## Changing the Home Page


    When you first start the Web Browser you are taken to a page that is called your
    Home page. By default this page is the CNR trial membership sign up page, but
    it can be changed to any page you like.


    - 1. Click Edit | Preferences... The Preferences dialog box will open.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_232_0.png)


    ## Chapter 11 Browsing the Internet


    ![](img/3926ca1fb00de3af845faa03d2c351e5_233_0.png)


    - 2. Click on the Navigator option if it is not already highlighted.

    - 3. Double-click in the Location box. It will appear highlighted.

    - 4. Type in the URL that you would like to use as your Home page. Alternatively
    you can click the Use Current Page button to use the current page as your Home
    page.

    - 5. Click the OK button. Your changes will be accepted and your new Home page
    will be.


    ## Clearing History and Cache


    The Web Browser keeps track of all of the web sites that you have visited. You
    may have noticed that when you return to certain sites, they remember who you
    are or they load up some preferences that you have set. In order for some pages
    to load faster and remember data about you, a cache file with certain information
    and files on the sites you''ve visited is created. It''s a good idea to occasionally
    clear this cache and also the history of the sites you''ve visited for the sake
    of privacy.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_233_1.png)


    - 1. Click Edit. The Edit menu will appear.

    - 2. Click Preferences. The Preferences dialog box will appear.


    ## Managing the Web Browser


    ![](img/3926ca1fb00de3af845faa03d2c351e5_234_0.png)


    - 3. Click on the History option. It will be highlighted and you will see options
    for clearing your history of sites visited.

    - 4. Click the Clear History button to clear the history of the web pages you
    have visited.

    - 5. Click the Clear Location Bar button to clear the history of sites you''ve
    visited from the Location bar.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_234_1.png)


    - 6. Click the triangle beside Advanced to expand the options.

    - 7. Click on the Cache option. A variety of cache configuration settings will
    appear.

    - 8. Click the Clear Cache button. All the files in the cache will be deleted.

    - 9. Click the OK button to clear the Preferences dialog box.


    ## Managing Popups


    There''s nothing more annoying when you are peacefully browsing the Internet,
    then to have a popup ad for the miracle medical cure of the week appear. Pop ads
    are the Internet''s equivalent to used car salesmen: annoying and inconsiderate.
    Linspire''s Web Browser is leading the war on pop ads as it automatically blocks
    them. There are, occasions where legitimate site uses popups. You can let the
    Web Browser know from which sites it can accept popups.


    ## Chapter 11 Browsing the Internet


    ![](img/3926ca1fb00de3af845faa03d2c351e5_235_0.png)


    - 1. Click Tools. The Tools menu will appear.

    - 2. Click Popup Manager. A submenu of options will appear.

    - 3. Click Manage Popups. The Manage Popups dialog box will now open up. Alternatively,
    if you just want to allow pops from the web page you are currently visiting, you
    can Click Allow Popups From this Site.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_235_1.png)


    - 4. Type the URL of the site that you would like to allow popups from. You don''t
    need to include the www.

    - 5. Click the Add button. The site will be added to the list of allowable popups.

    - 6. Click on any site that you would like to remove from the allowable list.

    - 7. Click the Remove button. The site will be removed from the list.

    - 8. Click OK to accept the changes and close the dialog box.


    ## Changing Zoom Levels


    Not all web pages appear the same. Depending on how the fonts were created, they
    may be displayed in a manner that makes them difficult to see. Rather then having
    to change your computers resolution in order to better see the text of a web page,
    you can simply use the built-in zoom controls.


    > You can zoom in and out of a web page''s text using the keyboard. Hold down
    the Ctrl key and press the + key to zoom in or out the - key to zoom out.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_236_0.png)


    - 1. Click View. The View menu will appear.

    - 2. Click Zoom. A submenu of different zoom levels will appear.


    ## Showing and Hiding Toolbars


    There are several toolbars that make up the interface. Depending on your preferences,
    you can select which toolbars should appear and which remain hidden.


    - 1. Click View.

    - 2. Click Show/Hide. A list of toolbars will appear.

    - 3. Click on the toolbar you want to show or hide.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_237_0.png)


    ## E-Mail


    Do you remember the last time you sat at your desk to write a letter? E-mail can
    be your best friend or your worst enemy, depending on how you approach it. The
    convenience of almost instantaneous communication can be countered by the annoyance
    of spam. Linspire comes with its own e-mail software. In this chapter we''ll cover:


    - Configuring the E-Mail Client

    - Sending and receiving emails

    - Organizing your messages


    ## New Account Setup


    When you first launch the e-mail program you will be presented with the Account
    dialog box. Because e-mail is so central to the work you do on the computer, it
    can be accessed directly from the Quick Launch bar.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_239_0.png)


    - 1. Click on the E-Mail client on the Quick Launch bar. The Account dialog box
    will appear.

    - 2. Click the radio button beside Email account if it is not already selected.

    - 3. Click the Next button to move to the next step.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_239_1.png)


    - 4. Click and drag across the existing text in the Your Name field. It will become
    highlighted.

    - 5. Type your name into the field.

    - 6. Press the Tab key on your keyboard. The contents of the Email Address field
    will now be highlighted.

    - 7. Type your e-mail address.

    - 8. Click the Next button to move to the next step.


    - 9. Click the radio button beside the type of incoming server you are using.
    This information, along with the information needed for Steps 10 and 11, can be
    obtained from your ISP.

    - 10. Type the name of your incoming server in the field.

    - 11. Type the name of your outgoing server in the field.

    - 12. Click Next to advance to the next stage in the process of setting up an
    e-mail account.


    - 13. Type the incoming and outgoing user name for your e-mail account. Again,
    this information can be obtained from your ISP.

    - 14. Click the Next button to move to the next step.

