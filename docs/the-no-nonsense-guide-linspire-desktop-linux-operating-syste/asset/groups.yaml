    ## Chapter 12 E-Mail


    ## Composing E-Mail


    - Bcc. This stands for "blind carbon copy," which means that the recipient will
    receive a copy of the message, but their name will not be visible to anyone else
    who received the message.

    - Reply-To. If you''d like any replies to go to different e-mail addresses, rather
    than the original addressees, use Reply-To.

    - Newsgroup. This field is for posting a newsgroup posting.

    - Followup-To. This is used to redirect a newsgroup posting. All replies will
    go to this newsgroup rather than the original.


    - 7. Type another e-mail address for the type or recipient you specified in Step
    6.

    - 8. Press the Enter key.

    - 9. Repeat Steps 5 - 8 to add other recipients.

    - 10. Type a subject line for your e-mail. This is what recipients will see first,
    so make sure it is detailed.

    - 11. Type your e-mail message in the window.


    ## Adding Attachments


    You can add any files to send along with your messages as an attachment. You should
    keep in mind however that some mail servers limit the size of files that can be
    sent and received. If you use the general rule of thumb that your attachments
    should be no larger than 2 MB (2000 KB), you should be alright. Your ISP can let
    you know the maximum size of file you can send from your e-mail account.


    - 1. Click the Attach button when composing your e-mail. The Attach(s) dialog
    box will appear from which you can select a file.

    - 2. Navigate to the folder that contains the file that you would like to attach.

    - 3. Click on the file that you would like to attach. It will be highlighted.

    - 4. Click the Open button. The file will be attached to the e-mail.

    - 5. Repeat Steps 1 - 5 to add any additional files.


    ## Formatting Messages


    If you''ve already reviewed the chapter entitled "Word Processing" then you''re
    already familiar with how to format an e-mail message. When formatting a message
    keep in mind that not all e-mail recipients have programs that can view messages
    with formatting.


    - 1. Click and drag across the text that you would like to format.

    - 2. Click on the drop-down list to select a list of fonts and click on the desired
    font.

    - 3. Click on either of the font size buttons to increase or decrease the font
    size.

    - 4. Click on the Bold, Italics or Underline to format the selected text with
    one of those features.

    - 5. Click on the Font Color button. A dialog box will appear.

    - 6. Click on the desired color. It will be selected.

    - 7. Click on the OK button. The color will be applied to your text.


    ## Spell Checking Messages


    Because e-mail is primarily a text based method of communication, your words create
    a great impression of the type of person you are. To avoid being thought of as
    careless or lazy, your messages should be free of errors. The E-Mail Client helps
    you in this endeavor as it automatically checks your spelling as you type.


    - 1. Position your mouse pointer over any word that has a red underline. The red
    underline indicates that the word cannot be found in the dictionary. The word
    will become highlighted and a list of alternatives will appear.

    - 2. Click on the desired alternate word. The incorrect word will be replaced
    with the one that you have selected. Alternatively, you can click the Add to Dictionary
    option, if the word is spelled correctly but just not recognized by the dictionary.
    This is very common for proper nouns.


    ## Sending Messages


    Once you have your e-mail message composed, sending it is just a matter of pressing
    the Send button.


    - 1. Click the Send button. The message will be sent to the recipients that you
    specified.


    > Copies of the messages that you send will be kept in your Sent folder. More
    on folders will be covered later in the chapter.


    ## Replying to Messages


    If you''d like to respond to messages you''ve received, you can do so with ease
    in the E-Mail Client. When you reply to a message, you are responding to the person
    who sent it to you and potentially to anyone who was included in the original
    message.


    ## Forwarding Messages


    - Click on the message that you would like to reply to. It will be highlighted.

    - Click on the Reply or Reply All. Clicking Reply will send your message back
    to the original sender while Reply All will send it to the original sender and
    anyone else who was copied on the message.

    - Compose the message as you would. The only difference is that the original message
    will be included in the body of the e-mail.


    - Click on the message that you would like to forward.

    - Click on the Forward button.

    - Compose the message as you would. You will have to specify recipients for the
    message. The only difference is that the original message will be included in
    the body of the e-mail.


    ## Organizing E-Mail


    Once you get started e-mailing, it won''t be long before your Inbox is full of
    messages. Sorting through all your mail may pose a challenge, and the email client
    is up to the task. There are a variety of features included in the e-mail program
    that will allow you to sort, organize and find e-mail.


    ## Searching Messages


    Finding messages is a breeze in the email client. You simply type the keywords
    in the search box and all messages that match criteria will appear.


    - 1. Type the keyword(s) in the field provided. The keyword can be the name of
    the person who sent you the message or any words in the subject line.

    - 2. Press the Enter key. All messages that match the criteria will be displayed
    in the window as you type.

    - 3. Click the Clear button to clear the search and return to see all the messages
    in your inbox.


    ## Sorting


    Another way to quickly find a message is to use the sort functionality. Across
    the top of the message window you''ll find different column headings. You can
    click on any of these headings to sort by column. For example, if you wanted to
    put all of your messages in alphabetical order you could click on the Sender heading.


    - 1. Click on the column that you would like to sort. The messages will be sorted
    in ascending order.

    - 2. Click on the same column that you clicked on Step 1 to sort in descending
    order. You can also tell which column has been selected because there will be
    a little green arrow in the column heading. An arrow pointing up means the column
    is sorted in ascending order and if it is pointing down, the column is sorted
    in descending order.


    ## Organizing Folders


    All of the messages you receive are stored in a folder called the Inbox. Just
    as you can use folders on your computer to store your different files, so can
    you use folders when dealing with e-mails. The types of folders you create are
    up to you, but typically people create folders to store messages from specific
    people or specific topics or projects. Once you have your folders created, you
    can add messages to them simply by clicking and dragging.


    - 1. Click the triangle beside Local Folders to see a list of folders already
    created for you by the e-mail package.

    - 2. Right-click on the word Local Folders. A menu will appear.

    - 3. Click New Folder... The New folder dialog box will open when you can name
    your newly created folder.

    '
  mdcn: '


    ## 第 12 章 电子邮件


    ## 撰写电子邮件


    - Bcc（密送）。这代表“盲目抄送”，意味着收件者将收到消息的副本，但其他接收该消息的其他人将无法看到他们的姓名。

    - Reply-To（回复至）。如果你希望任何回复发送到不同的电子邮件地址而不是原始收件人，请使用 Reply-To。

    - Newsgroup（新闻组）。此字段用于发布新闻组帖子。

    - Followup-To（后续回复）。这用于重定向新闻组帖子。所有回复将发送到此新闻组而不是原始新闻组。


    - 7. 为你在步骤 6 中指定的类型或收件人再次输入另一个电子邮件地址。

    - 8. 按 Enter 键。

    - 9. 重复步骤 5 - 8 以添加其他收件人。

    - 10. 为你的邮件输入主题。这是收件人首先看到的内容，因此请确保其详细。

    - 11. 在窗口中输入你的邮件正文。


    ## 添加附件


    你可以将任何文件作为附件随消息发送。然而，你应该记住，某些邮件服务器会限制发送和接收的文件大小。如果你遵循附件不大于 2 MB (2000 KB) 的通用规则，通常应该是没问题的。你的互联网服务提供商（ISP）可以告诉你你可以从电子邮件账户发送的最大文件大小。


    - 1. 在撰写邮件时点击 Attach（附件）按钮。将出现 Attach(s）对话框，你可以在其中选择文件。

    - 2. 导航到包含你想附件的文件文件夹。

    - 3. 点击你想附件的文件。它将被高亮。

    - 4. 点击 Open（打开）按钮。文件将作为添加到邮件中。

    - 5. 重复步骤 1 - 5 以添加任何额外文件。


    ## 设置消息格式


    如果你已经查看过标题为“文字处理”的章节，那么你已经熟悉如何格式化邮件消息。在格式化消息时，请记住并非所有的邮件收件人都有可以查看格式化消息的程序。


    - 1. 点击并拖动你想格式化的文本。

    - 2. 点击下拉列表以选择字体列表，并点击所需的字体。

    - 3. 点击字体大小按钮之一来增大或减小字体大小。

    - 4. 点击 Bold（粗体）、Italics（斜体）或 Underline（下划线），用这些功能之一格式化选中文本。

    - 5. 点击 Font Color（字体颜色）按钮。将出现对话框。

    - 6. 点击所需的颜色。它将被选中。

    - 7. 点击 OK（确定）按钮。颜色将应用到你的文本。


    ## 检查消息拼写


    由于电子邮件主要是一种基于文本的通信方式，你的用词会给你的人格类型留下深刻印象。为了避免被认为粗心或懒惰，你的消息应该是没有任何错误。电子邮件客户端在这方面为你提供了帮助，因为它会在你输入时自动检查你的拼写。


    - 1. 将鼠标指针悬停在任何带有红色下划线的单词上。红色下划线表示字典中找不到该单词。该单词将被高亮，并出现备选词列表。

    - 2. 点击所需的备选单词。错误的单词将被你选择的单词替换。或者，如果单词拼写正确但只是未被字典识别，你可以点击 Add to Dictionary（添加到字典）选项。这对于专有名词非常常见。


    ## 发送消息


    一旦你写好了邮件消息，发送它只需按下 Send（发送）按钮。


    - 1. 点击 Send 按钮。消息将发送到你指定的收件人。


    > 你发送的消息副本将保存在 Sent（已发送）文件夹中。关于文件夹的更多内容将在本章节后面介绍。


    ## 回复消息


    如果你想对收到的消息进行回复，可以在电子邮件客户端中轻松完成。当你回复消息时，你是在回复发给你的的人，并可能回复了原始消息中包含的任何人。


    ## 转发消息


    - 点击你想回复的消息。它将被高亮。

    - 点击 Reply（回复）或 Reply All（全部回复）。点击 Reply 将你的消息发回给原始发送者，而点击 Reply All 将将其发送给原始发送者以及消息中被抄送的任何其他人。

    - 像往常一样撰写消息。唯一的区别是原始消息将包含在邮件正文中。


    - 点击你想转发的消息。

    - 点击 Forward（转发）按钮。

    - 像往常一样撰写消息。你需要为消息指定收件人。唯一的区别是原始消息将包含在邮件正文中。


    ## 管理电子邮件


    一旦你开始发送电子邮件，很快你的收件箱（Inbox）就会装满消息。处理所有邮件可能是一项挑战，而电子邮件客户端完全胜任这项任务。电子邮件程序包含多种功能，允许你对电子邮件进行排序、组织和查找。


    ## 搜索消息


    在电子邮件客户端查找消息是轻而易举。你只需在搜索框中输入关键词，所有符合标准的消息就会出现。


    - 1. 在提供的字段中输入关键词。关键词可以是发送消息给你的人的名字，可以是主题行中的任何单词。

    - 2. 按 Enter 键。随着你的输入，所有符合标准的消息将显示在窗口中。

    - 3. 点击 Clear（清除）按钮清除搜索并返回所有消息。


    ## 排序


    查找消息的另一种方法是使用排序功能。在消息窗口顶部，你会发现不同的列标题。你可以点击这些标题之一按列排序。例如，如果你想让所有邮件按字母排序，你可以点击 Sender（发送者）标题。


    - 1. 点击你想排序的列。消息将按升序排列。

    - 2. 点击你在步骤 1 中点击的同一列进行降序排列。你也可以判断哪个列被选中了，因为列标题中有一个小绿色箭头。箭头向上表示列按升序排列，如果向下，则列按降序排列。


    ## 组织文件夹


    收到的所有消息都存储在一个名为 Inbox（收件箱）的文件夹中。就像你在电脑上可以使用文件夹存储不同的文件一样，你在处理电子邮件时也可以使用文件夹。创建的文件夹类型取决于你，但通常人们创建文件夹来存储来自特定人员或特定主题或项目的消息。一旦你创建了文件夹，只需点击并拖动即可将消息添加到其中。


    - 1. 点击 Local Folders 旁的三角形查看电子邮件软件包为你创建的文件夹列表。

    - 2. 右键点击 Local Folders。将出现一个菜单。

    - 3. 点击 New Folder...（新建文件夹...）。New folder 对话框将打开，你可以在其中为新创建的文件夹命名。


    '
