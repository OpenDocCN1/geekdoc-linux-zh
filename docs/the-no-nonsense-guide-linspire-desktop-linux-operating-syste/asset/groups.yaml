    ## 安装准备


    如果你是一名常常旅客，你会知道在起飞之前，飞行员会经过详尽的检查单，以确保一切都准备就绪，从而保证飞行安全且顺利。Linspire 的安装过程也是如此。在开始安装过程之前，你应该理解几个关键点。这些包括：了解如何从
    CD 启动、为硬盘创建分区（可选的）以及确保你的最低系统要求正确。


    ## 从 CD 启动


    当计算机启动时


    尽管每台电脑都各不相同，但你通常可以在首次启动电脑时出现的启动闪屏中找到如何访问 BIOS 的说明。此屏幕将指示按哪个键进入系统 BIOS，它有时被称为“设置（setup）”。一旦进入
    BIOS，你就可以更改启动顺序，让你的电脑查找 CD 驱动器。如果你在更改电脑启动顺序时遇到困难，互联网是获取帮助的绝佳资源。如果你有一台连接了网络的电脑，可以进行
    Google 搜索 (www.google.com)。在 Google 搜索框中，输入你的电脑品牌和“boot sequence（启动顺序）”。结果将显示更改电脑启动顺序的说明。


    ## 创建分区


    你可以将计算机上的硬盘划分为不同的部分，称为“分区”。Linspire 允许你将操作系统安装到整个硬盘，也可以安装到这些分区之一。在安装到分区之前，你必须先正确设置它。请记住，你应该熟悉创建分区操作，因为你可能会无意中删除电脑上的现有数据。你可以在互联网上或你的分区软件的文档中找到创建硬盘分区的说明。


    ## 安装 Linspire


    ### 最低系统要求


    在开始安装过程之前，你需要做的最后一件事是确保你的电脑有足够的性能运行 Linspire。虽然可以在不符合所有这些要求的机器上安装操作系统，但并不建议这样做。最低系统要求如下：


    - 128 MB RAM

    - 一个 800MHz 处理器（或相应的 AMD 处理器）

    - 4GB 可用硬盘空间

    - 1024 x 768 分辨率显示器

    - CD-ROM 或 DVD 驱动器、键盘和鼠标

    - Linspire 兼容声卡和扬声器或耳机（推荐）

    - 用于互联网/局域网连接的以太网（推荐）


    ## 安装 Linspire


    要完成安装过程，你必须在安装向导中回答几个简单的问题。在通过向导的过程中，你必须决定是将操作系统安装到硬盘上，还是安装到某个分区上。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_20_0.png)


    - 1. 将 Linspire 安装 CD 插入电脑的 CD 驱动器并启动电脑。片刻后将会出现一个启动闪屏。此时，你可以按下键盘上的 Enter（回车）键或直接等待，几秒后安装过程将继续。

    - 2. 点击“Next（下一步）”。你将进入安装过程的下一个屏幕。


    ## 第 1 章 安装 Linspire


    > 在初始安装阶段请保持耐心。根据你电脑及其组件的速度，初始安装屏幕可能需要几分钟才会出现。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_21_0.png)


    - 3. 点击你所需的键盘设置。你的选择将被高亮显示。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_21_1.png)


    - 4. 点击“Next（下一步）”。你将进入安装过程的下一个步骤。

    - 5. 点击“Install（安装）”旁边的单选按钮，除非你已经安装了 Linspire。如果你正在升级当前的 Linspire 版本，请点击“Update（更新）”旁边的单选按钮。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_21_2.png)


    - 6. 点击“Next（下一步）”。如果你在第 5 步选择了 Update，跳到第 11 步。你需要决定是将 Linspire 安装到分区还是让它接管整个硬盘。如果你想让
    Linspire 接管整个硬盘，请继续到第 7 步，否则跳到第 9 步。


    ## 安装 Linspire


    - 7. 点击“Take over entire disk（接管整个磁盘）”旁边的单选按钮。选中后圆圈内会出现一个小点。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_22_0.png)


    - 8. 点击“Next（下一步）”。你将进入安装过程的下一个步骤。继续到第 11 步，后续步骤将处理分区。如果你正在将 Linspire 安装到分区，请确保该分区至少有四
    GB 的空间。这将确保你有足够的空间存放 Linspire 和你的文件。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_22_1.png)


    - 9. 点击“Advanced Install（高级安装）”旁边的单选按钮。选中后圆圈内会出现一个小点。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_22_2.png)


    - 10. 点击“Next（下一步）”。你将进入安装过程的下一个步骤。


    ## 第 1 章 安装 Linspire


    - 11. 点击你想安装操作系统的目标分区。点击分区后，该分区将被高亮显示。

    - 12. 点击“Next（下一步）”。如果你在第 5 步选择了“Update”选项，跳转到第 16 步。否则继续到第 13 步。


    ![](img/3926ca1fb00de3af845faa_23_0.png)


    - 13. 为你的电脑输入一个名称。这是在网络上识别电脑的方式。

    - 14. 在 Administrator（管理员）和 Confirm Password（确认密码）字段中输入密码。密码将以星号形式显示，这样看着屏幕的人就看不到它。这是可选的，但有助于让你的电脑更安全。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_23_1.png)


    - 15. 点击“Next（下一步）”。你将进入安装向导的设置确认屏幕。命名电脑时仅使用字母和数字。如果你想让电脑接入网络，连字符、下划线和其他字符会导致问题。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_23_2.png)


    ## 安装 Linspire


    > 使用你确信能记得密码，因为 Linspire 无法找回它。将密码写下来存放在安全的地方可能是个主意。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_24_0.png)


    - 16. 查看设置确认屏幕后，如果有任何需要更改的内容，点击“Back（返回）”按钮。


    ### 设置确认

    Linspire 现在将按照设置安装到你的电脑上：


    | 安装方法 | 目标 |

    | :--- | :--- |

    | | |


    设置确认显示了你之前在步骤中所做选择的摘要。如果你发现错误，可以使用“Back（返回）”按钮返回任何步骤。


    如果选择正确，点击“Finish（完成）”开始安装。


    - 17. 点击“Finish（完成）”。将弹出一个对话框，在安装开始前给你最后一次返回并更改的机会。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_24_1.png)


    - 18. 点击“OK”。你的电脑将重启，CD 将从 CD 驱动器中弹出。弹出后取出 CD，关上 CD 门并按下键盘上的 Enter 键。系统可能需要几分钟才能完全重启。


    ### 设置确认

    请核实你的选择

    你选择了以下内容：


    | 安装方法 | 目标 |

    | :--- | :--- |

    | Take over Disk（接管磁盘） | |


    此过程将删除你所选驱动器上的**所有数据**。如果你对你的操作满意，选择 OK 继续；选择“Let Make Changes（允许更改）”然后点击“Back（返回）”按钮返回其他选择或进行更多更改。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_24_2.png)


    ## 首次运行 Linspire


    - 19. 点击“OK”。你的电脑将重启，CD 将从 CD 驱动器中弹出。弹出后取出 CD，关上 CD 门并按下键盘上的 Enter 键。系统可能需要几分钟才能完全重启。Linspire
    现在已安装在你的电脑上并准备好使用。


    第一次开启 Linspire 电脑时屏幕上的显示取决于几个因素：谁配置了你的 Linspire 电脑；是你自己安装的操作系统，还是电脑商店预装的。可能会出现多个屏幕，包括初始化屏幕、CNR
    试用会员屏幕、教程视频以及可能的启动向导。


    > 如果在安装过程中输入了管理员密码，在进入操作系统之前需要输入该密码。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_25_0.png)


