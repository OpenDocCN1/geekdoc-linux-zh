    # # Is the Linspire operating system for the masses?


    Yes. Linspire is designed with you in mind. We know that most people don''t use
    their PCs for ultra-technical goals like writing computer code or hosting Internet
    forums. People do write email, surf the web, chat, use an office suite, play games,
    listen to music, and get pictures from their digital cameras. Linspire comes pre-loaded
    with all the necessary software to do those things and more.


    One of the questions I hear the most is, "Will Linspire run XYZ application that
    I use?" But after talking to the person who asked it, I find out that the person
    is never so tied to that particular application as they are tied to what application
    lets them do. It''s all about the features and functionality, not about the particular
    program. The answer I usually give is, "A program made for Microsoft Windows won''t
    run on Linspire, but there are thousands of applications that run on Linspire
    and we have one that does just what you want."


    Take Microsoft Office for example — that is probably the application that most
    people want to know about. Why? Because they need a word processor, spreadsheet,
    and presentation software. They need it to be easy to use, and most importantly
    they need it to create documents that can be read on Microsoft Windows computer.
    Surprisingly, Microsoft doesn''t make their office suite for Linux, but you really
    want to waste hundreds of dollars paying for it anyway? Linspire comes with a
    complete office suite included. That''right...you don''t have to spend as much
    on one program as you spent for your computer. The OpenOffice suite included with
    Linspire has software for word processing, spreadsheets, and presentations, all
    of which save in the same format as Microsoft Office, so you can read and edit
    files made by your friends who still use Microsoft Office, and they can read and
    edit the files you make. If you don''t tell them, they''ll probably never realize
    that aren''t using the same software that they use.


    No matter what you want to do with your PC, chances are Linspire has software
    will save you time, money, and hassle over other operating systems. In addition
    to having a number of programs pre-installed, Linspire offers you the most affordable
    way to get new software. The traditional method of getting software in the Microsoft
    Windows world is paying for each application you need. For Linux users, installing
    software usually means'
  - '[PAGE 10]


    scouring the Internet for something that looks like it could be good, downloading
    several different packages, installing them with a series of commands, and hoping
    it works. One way costs you money, the other costs you time. With Lininsp, you
    won''t waste either.


    For less than fifty dollars, Lininsp users can get access to roughly 2,000 applications
    from the CNR Warehouse. In addition to this being incredibly low-priced, it''s
    also incredibly easy. Don''t waste time searching the web or looking through software
    boxes, just click and run. The warehouse is easily accessed with the CNR application
    that is integrated into the Lininsp operating system. CNR lets you search for
    the specific application you want or browse through the warehouse aisles to find
    something that suits your needs. With CNR, you can look at screen shots, read
    descriptions, and install with a single click of your mouse button, saving you
    time and money.


    # So Lininsp saves time and money, that''s good. Is that all?


    No. You see, Lininsp is all about the marriage of cutting-edge technology with
    usability. An easier, less expensive operating system is a good start, but we
    want a better operating system. Since the time that XP came out, in 2001, there
    have been many technical innovations. And at Lininsp, we don''t think you should
    have wait until 2007 to take advantage of them.


    If you''re like most people, chances you have some friends that you chat with
    AIM, Messenger, some on MSN, and even friends that use a different instant messaging
    program. It''s getting to the point where you practically need a second screen
    just for all the different buddy lists and IM windows. With Lininsp, you can simultaneously
    log onto all your IM accounts and view all of your buddies in one list. Then have
    all of your chats in one tabbed-window, freeing your screen from clutter so you
    don''t track track an important conversation. But why stop at text-based communications?
    Our instant messenger lets you make web-based worldwide phone calls.


    By now you are probably familiar with the system slowdown. Leave your computer
    on for a couple of days in a row and it screeches to a halt. Make sure to set
    aside a day every month to defragment your hard drive (defragmenting moves data
    around your hard drive because it is broken up, or fragmented), or else. Can you
    imagine if any other appliance in your house acted like that? What would it be
    like if you had to turn off your'
  - '[PAGE 11]


    refrigerator occasionally or it wouldn''t stay cold, or if you had to move around
    all your DVDs once a month or the DVD player wouldn''t read them? Ridiculous,
    right? Well, why don''t we think all these things are ridiculous with the PC as
    well? Because we have been conditioned to just accept slowdowns, freezes, crashes,
    and reboots as a way of life — but we shouldn''t.


    Because of Linspired''s stability and security, you can leave your computer for
