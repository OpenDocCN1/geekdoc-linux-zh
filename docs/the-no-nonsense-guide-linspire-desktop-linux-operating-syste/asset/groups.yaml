    > You can conduct more detailed searches by clicking on the Contents or Properties
    tab in the Find Files dialog box. You can add additional criteria to your search.


    ## File Management with Dialog Boxes


    In almost every computer application, you''ll need to navigate your computer in
    order to select, open, or save files. Typically this is done through a dialog
    box that gives you access to your files. Although the dialog boxes for each application
    are different, in many cases the way in which the dialog boxes works is almost
    identical to that of the File Manager. You can use dialog boxes rather than accessing
    the File Manager whenever you want to navigate your computer''s hard drive, select
    and copy files or folders, move files, or even create folders. Because different
    programs have different styles of boxes, Some of these dialog boxes will have
    buttons that may be unfamiliar to you. When dealing with unfamiliar buttons in
    a dialog, the best idea is to hover your mouse pointer over the button. In most
    cases, after a second or two, a tool tip will appear that will describe the function
    of the button. Another good idea is to right-click a file in dialog box to see
    what options are available. On the next page you''ll find examples of dialog boxes
    from different programs that offer some file management capabilities.


    ## File Management with Dialog Boxes


    ### Dialog Box Example One


    This is the Open dialog box from OpenOffice Word Processor. As you can see there
    are various File Management functions available.


    - New Folder. Lets you create a new folder to store files.

    - Up. This feature will allow you to move up one level in file hierarchy.

    - Right-Click Menu. Right-clicking on a file in this dialog box lets you rename
    or delete files.

    - Sort. You can sort files by clicking on the column heading.


    ### Dialog Box Example Two


    This is the Open dialog box from the Image Viewer. As you can see there are various
    file management functions that look quite different from the File Manager.


    - New Folder. Lets you create a new folder to store files.

    - Right-Click Menu. When you right-click on a file in this dialog box you can
    sort your files or view their properties.

    - Navigation Buttons. This dialog box has various navigation buttons that allow
    you to quickly jump to certain areas.


    ## Understanding Linspire Folders


    When you first start the File Manager, you are taken to the Home window, which
    includes four icons that are pretty self explanatory. My Desktop shortcut takes
    you to a folder on your system that contains the contents of your desktop. My
    Documents shortcut takes you to a folder that Linspire has set up to store your
    documents. The Network Shares shortcut takes you to window that allows you to
    view other computers on your network. Finally there is the System folder. The
    other icons are just shortcuts to folders within your computer, the System folder
    actually contains all of the folders on your computer. The folders within the
    System may seem a little confusing to you if you haven''t worked on a Linux-based
    system before. Here is a quick rundown of the purpose of most of the folders contained
    within the System:


    - bin. For binary, the bin folder contains the binary files needed for the key
    programs and operating system to run.

    - boot. This folder contains the files needed when the computer first starts.

    - dev. The files that control your devices are found here.

    - etc. This folder contains critical configuration files for system programs.

    - home. This is the folder that each user logs into at the start of a session.

    - lib. This folder contains the libraries that are used by the programs on your
    system.


    > Do not delete any of the folders found directly within the System folder. Many
    of the files contained within these folders are essential for your programs and
    operating system to run.


    - mnt. This folder contains your mounted hardware like different floppies or CD
    drives.

    - opt. This folder contains information on add-on programs.

    - proc. This folder contains information that is stored in the computer''s memory.

    - root. This contains the files of the administrator account.


    ## Archiving Files


    - sbin. This folder contains the binary files used for administering system functions.

    - tmp. This folder contains temporary files.

    - usr. The application files for the software you''ve installed are found in this
    directory.

    - var. This folder contains files that vary in size while the system is operating.


    ## Archiving Files


    When I was fourteen, I got my first job at McDonald''s and one of my responsibilities
    was to take the garbage to the back and put it through the compactor. I was always
    so amazed at how much garbage could fit in the dumpster after it had been compacted.
    Your Linspur computer has a compactor built in. If you''re finding that you''re
    getting low on hard drive space you can archive some files. Archiving basically
    compacts the files so they don''t take up as much space. Archiving is particularly
    useful when sending emails. If you have a file that is too large to send over
    e-mail, you can archive it to reduce its file size. Within Linspur there is a
    program called the Archiving & Zip Tool that will not only allow you to archive
    files, but you can also expand archived files that have been sent to you. You
    can select from a variety of different compression formats to archive your files.


    ## Chapter 4 File Management


    - 1. Click Launch Programs. A list of program categories will appear.

    - 2. Click Utilities. A variety of utility programs will appear.

    - 3. Click Archiving & Zip Tool. The Archiving & Zip program will open.

    - 4. Click the New button. The Archive dialog box will open.

    - 5. Navigate to the location where you would like your archive to be created.

    - 6. Type a name for your archive in the Location field.

    - 7. Click the drop-down menu to see a list of archive types.

    - 8. Click the desired method. If you are unclear of which one to select, choose
    zip.

    - 9. Click the Save button.


    ## Archiving Files


    - 10. Click the Add File or Add Folder buttons. A dialog box will appear where
    you can select the files or folders that you would like to add to your archive.

    - 11. Navigate to the folder that contains the file that you would like to archive.

    - 12. Click on the desired file. It will be highlighted. You can hold down the
    Ctrl key and click on any other files in that folder that you would like to add
    to the archive.

    - 13. Click OK. The files you select will now be added to the archive.


    > The amount that a file will depend on two factors: the type of compression method
    you have selected (zip, tar, etc.) and the original file type.


    - 14. Repeat Steps 8 - 12 to add any other files or folders to your archive.

    - 15. Click the Close button to shut down the Archiving & Zip Tool program. All
    the files within the archive will now be compressed.

