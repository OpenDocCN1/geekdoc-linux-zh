    ## 用户界面


    ![](img/3926ca1fb00de3af845faa03d2c351e5_34_0.png)


    -   垃圾桶。当你在电脑上删除一个文件时，它会被发送到垃圾桶。如果文件尚未从垃圾桶中清空，你就可以恢复不小心删除的文件。关于垃圾桶的更多信息将在“文件管理”章节中介绍。


    -   Web 浏览器。让你能够启动 Linspire 互联网套件，以便你可以在网上上冲浪。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_34_1.png)


    -   电子邮件。让你能够启动 Linspire 电子邮件应用程序（称为“E-Mail客户端”），以便你能够发送、接收和管理你的电子邮件。


    -   即时通讯工具。让你能够与家人、朋友和同事进行即时通信。双击此图标将启动即时通讯程序。


    -   软盘。让你能够访问插入电脑的任何软软盘上的文件。


    ## 第 2 章了解 Linspire


    ![](img/3926ca1fb00de3af845faa03d2c351e5_35_0.png)


    -   CD-ROM。让你能够查看已插入电脑 CD 驱动器的 CD 内容。

    -   CNR。这是一种基于订阅的软件服务，它让在你的 Linspire 电脑上安装软件变得快速简单。


    > 如果你没有看到想要启动的特定应用程序图标，请担心。在下一章节中，你将学习如何为任何程序创建图标。


    ## 面板 (Panel)


    面板是位于桌面底部的栏，可以让你快速访问应用程序。面板的一个方便功能是，无论你运行了多少程序，它都保持可见。此功能对于管理正在运行的程序以及随时访问应用程序非常有帮助。在本章的后半部分中，我们将详细描述面板的四个部分。但现在，让我们先看看面板的各个部分及其功能。


    ## 用户界面


    ![](img/3926ca1fb00de3af845faa03d2c351e5_36_0.png)


    -   启动按钮。让你能够启动电脑上的几乎每一个程序。通过启动按钮，你可以启动程序、配置系统、获取帮助或退出 Linspire。当你点击启动按钮时出现的启动菜单由某些操作、你所有的应用程序以及你最近访问的程序组成。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_36_1.png)


    -   快速启动栏。让你立即访问应用程序。快速启动栏永远不会被打开的程序阻挡，而且与桌面图标不同，快速启动栏上的图标只需点击一次即可启动相应的程序。


    ## 第 2 章了解 Linspire


    ![](img/3926ca1fb00de3af845faa03d2c351e5_37_0.png)


    -   任务栏。让你可以在程序之间进行最小化、最大化、恢复、关闭和切换。所有打开的程序都由任务栏上的图标表示。


    -   系统托盘。让你能够配置 Linspire 电脑的某些元素。除外，它还允许你设置和查看时间和日期、调整系统音量并关闭电脑。


    ## 快速启动栏


    快速启动栏允许你通过单击鼠标按键来启动程序。与桌面上的图标不同，快速启动栏永远不会隐藏，因此你可以随时访问该栏上的任何应用程序。默认情况下，快速启动栏上有五个图标，但你可以添加或删除它们。关于自定义快速启动栏，可以在下一章节中找到。在下文中，我们将查看快速启动栏各个部分及其功能：


    ![](img/3926ca1fb00de3af845faa03d2c351e5_37_1.png)


    -   文件管理器。让你访问电脑上的各种文件。


    -   Web 浏览器。让你启动 Web 浏览器，以便你能够浏览网页。


    -   电子邮件。让你启动电子邮件客户端，以便你能够发送、接收和管理邮件。


    -   即时通讯工具。让你与他人即时聊天，这是一个非常流行的功能。


    -   显示桌面。让你最小化所有运行的程序。


    ## 启动程序


    为了完成任务，你需要启动各种程序。Linspire 提供了多种方法。


    ## 从图标启动程序


    在本章节早期我们讨论了桌面上的各种图标。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_39_0.png)


    1.   双击 Web 浏览器图标。这将启动 Web 浏览器应用程序，以便你浏览网页。

    2.   点击应用程序右上角的“X”关闭它。


    > 你可能在问，“为什么当我启动应用程序时，光标旁边在闪烁？”闪烁表示电脑正在执行请求的任务。


    ## 从启动按钮启动程序


    启动按钮让你访问电脑上的大多数程序。通过启动按钮，你可以根据功能选择程序。


    ## 启动程序


    1.   点击启动按钮。启动菜单将显示各种供选择的操作。

    2.   将鼠标指针悬停在运行程序上。这将显示不同的程序分类。

    3.   点击游戏。这将显示你拥有的程序。

    4.   点击 Tron。这将启动 Tron 程序。你可以通过点击按钮关闭它。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_40_0.png)


    ## 使用快速启动栏启动应用程序


    正如我们之前学到的，使用快速启动栏启动程序比使用桌面图标更有优势。第一个优点是只需单击鼠标按键即可启动程序。另一个优势是，无论运行了多少程序，你始终可以访问快速启动栏。


    1.   点击快速启动栏上的文件管理器图标。文件管理器将打开。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_40_1.png)


    ## 处理已打开的应用程序


    现在很少有人在使用电脑时只运行一个程序。在当今快节奏的世界里，每个人都被要求多任务处理以更快地完成工作，因此你可能随时启动多个程序。如果你不知道如何正确管理打开的程序，这种做法可能会让你陷入一片混乱。


    ## 调整窗口大小


    在 Linspire 中调整窗口大小只需点击并拖动即可。


    1.   将鼠标指针置于窗口边缘。当您处于正确位置时，光标将变为双向箭头。

    2.   向内拖动以缩小窗口大小。

    3.   向外拖动以增大窗口大小。


    '
