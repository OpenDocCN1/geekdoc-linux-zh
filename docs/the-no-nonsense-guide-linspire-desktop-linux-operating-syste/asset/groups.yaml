  - '[PAGE 137]


    # 136 Chapter 6 Creating Spreadsheets


    # Borders


    Spreadsheet offers a range of border options, in terms of both styles and thicknesses
    that you can apply to your selections.


    +   1. Select the cell(s) that you want to apply a border to using one of the
    selection methods.

    2. Open the Format Cells dialog as discussed in the "Formatting Worksheets" section
    earlier.

    3. Click on the Borders tab.

    4. Choose one of the default border types.

    5. Click on the selected line thickness for your cell.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_137_0.png)


    +   6. Click on the color drop-down menu to select a color for your border.

    7. Click the desired color. It will be selected.

    8. Click OK. The dialog box will close and the borders will be applied to your
    selection.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_137_1.png)'
  - '[PAGE 138]


    # Numerical Formatting


    Do you remember 5th Grade math class where you had to learn how to round up or
    down to two decimal places? If only you had Spreadsheet which could do it for
    you automatically. Spreadsheet has a variety of preset numerical formats that
    you can apply to your cells. Any data that you enter into those formatted cells
    will take on the numerical formatting that you have selected. For example, if
    you have formatted a cell to be three decimal places and then enter the number
    4.5678, the number will appear as 4.568.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_138_0.png)


    +   1. Select the cell(s) to which you want to apply numerical formatting using
    one of the selection methods.

    2. Open the Format Cells dialog box as discussed in the "Formatting Worksheets"
    section.

    3. Click on the Numbers tab.

    4. Click on the desired category of number you are formatting.

    5. Click the desired format from the samples of formats that appear.

    6. Click OK. The numerical formatting will be applied and the dialog box will
    close.


    > There are dozens of other formatting features that you can apply to your cells.
    You should explore the Format Cells dialog box to experiment with other formatting
    options.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_138_1.png)'
  - '[PAGE 139]


    # Formulas and Other Math


    The real power of Spreadsheet is that you can enter formulas, change your data,
    and then quickly see the changes in the results of your formulas.


    # AutoCalculate


    Here''s a way to impress your friends at parties. Have them gather around your
    computer and call out numbers. You can instantly provide them with the sum of
    those numbers, the average, the count and a variety of other calculations based
    on the numbers they''ve provided. There''s no need for a Mensa membership to perform
    this trick, it''s as simple as highlighting the numbers.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_139_0.png)


    +   1. Create a selection of numbers that you want to find the sum.


    +   2. Observe the status bar at the bottom of the screen. It will automatically
    provide you with the sum of those numbers. If you don''t want to find the sum,
    there are a variety of other calculations that can be done instantly.


    +   3. Right-click on the status bar. menu of auto calculations will appear.


    +   4. Click on the desired calculation including:


    +   * Average. This will display the mean or average of your selection.


    +   * Count. This will indicate the total number of cells that are selected.


    +   * CountA. This will indicate the total number of cells that contain numbers
    that are selected.


    +   * Max. This will display the maximum number in the selection.


    +   * Min. This will display the lowest number in the selection.


    +   * Sum. This will show the sum of all the numbers in the selection.'
  - '[PAGE 140]


    # Formulas and Other Math


    # AutoSum


    The most common formula entered in Spreadsheet is sum, or in other words, adding
    up a series of cells. Since this is such a common formula, the good folks at OpenOffice
    made it easy for you to calculate a sum by creating a button that will insert
    the formula for you. This button is called AutoSum and will instantly calculate
    the sum of a selection


    +   1. Click on a cell or to the right of the cells that you would like to add.


    +   2. Click the AutoSum button. A formula will appear in the cell and a blue
    outline will appear around the cells to be added.


    +   3. Press the Enter key on the keyboard or click the Accept button. The cells
    will be added and the results will appear in the cell you selected.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_140_0.png)


    +   4. Change any of the numbers that were added.


    +   5. Observe the results. The results will automatically update to reflect the
    changes that you made to the data.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_140_1.png)'
  - '[PAGE 141]


    # Formulas


    There are countless formulas that you can enter into your spreadsheet to perform
    calculations. All formulas have one thing in common: they all begin with an operator,
    an equals sign (=). An operator tells Spreadsheet that the content of the cell
    is a formula and not a label.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_141_0.png)


    +   1. Click once in a cell that you would like to add a formula to. The cell
    will be highlighted.

    2. Type the equals sign (=) then type the rest of your formula. It will appear
    in the formula bar.

    3. Click the check mark in the formula bar (the Accept button) or press the Enter
    key. The formula will be inserted into the cell.


    > > [Inspire]


    nThe rules of order of operation apply when creating formulas in Spreadsheet.
    Remember the order is BEDMAS: Brackets, Exponents, Division, Multiplication, Addition,
    and Subtraction.


    # Cell References


    When creating formulas in Spreadsheet, you can use the values of cells as part
    of your equations. In this example we''ll simply add 3 and the contents of two
    cells together, but you can enter any formula.'
  - '[PAGE 142]


    # Charts


    1. Click once on the cell where you would like the results of your calculation
    to be displayed.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_142_0.png)


    2. Click the equals sign to begin the formula and type the number 3. It will appear
    in the formula bar.


    3. Type the plus sign (+). It will appear after the 3 in the formula bar.


    4. Click on a cell where you would like to include in your formula. It will have
    a red outline.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_142_1.png)


    5. Repeat Steps 4 - 5 to add any other cells to the formula.


    6. Click the Accept button to complete the formula.


    # Charts


    If there''s a better visual than a pie chart, I haven''t seen it. The ability
    to convert your data from boring, senseless numbers to visual masterpieces is
    the real power of Spreadsheet. There are dozens of dozens when it comes to creating
    graphs (more commonly referred to as charts) in Spreadsheet. The beauty of the
    program is that stunning graphical representations of your data can be created
    in seconds with a few clicks of the mouse button.'
  - '[PAGE 143]


    # Chapter 6 Creating Spreadsheets


    +   1. Select the data you would like represented in a graph using one of the
    selection methods.


    +   2. Click the Format | Chart. The AutoFormat Chart wizard will appear.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_143_0.png)


    +   3. Click the Next button to proceed to the next stage in the wizard.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_143_1.png)'
  - '[PAGE 144]


    # Charts


    # 143


    +   4. Click on the type of graph that you would like to create. A preview of
    that type of graph will appear in the display.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_144_0.png)


    +   5. Click on the Show text elements in preview check box if you want to see
    how the text labels will appear in the graph.


    +   6. Click the Next button to move to the next stage.


    +   7. Click on a variant of the graph if so desired. This gives you additional
    options for the graph you''ve selected.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_144_1.png)


    +   8. Click the Next button to move to the next stage.


    > You don''t have to complete every step of the AutoFormat Chart wizard. You can
    click on the Create button at any time to finish the graph.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_144_2.png)'
