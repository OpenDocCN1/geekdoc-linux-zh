    ## Linspire 的个性化与定制


    想象一下，如果每个人都必须开同样的车、穿同样的衣服、看同样的节目并吃同样的食物，世界会变成什么样。我们的个性对我们来说至关重要，因此，为什么 Linspire
    在操作操作系统时提供这么多自定义选项也是可以理解的。


    由于每个人的工作方式略有不同，Linspire 允许你更改计算机的外观和感受以适应你的个人喜味。从背景、屏幕保护程序到图标和屏幕尺寸，Linspire 赋予了你让操作系统属于自己的能力。Linspire
    可以进行个性化定制，它提供了许多独特的工具，让你控制自己的工作方式。


    在本章中，我们将涵盖：


    - 更改背景

    - 选择屏幕保护程序

    - 操作图标

    - 使用虚拟桌面


    ![](img/3926ca1fb00de3af845faa03d2c351e5_52_0.png)


    ## 更改壁纸


    个性化计算机外观最简单的方法是更改桌面背景图像。这种背景也称为“壁纸”。对于背景，你可以从各种图像中选择、创建自定义背景、使用你喜爱的照片，甚至运行幻灯片。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_53_0.png)


    1. 右键点击桌面的任何空白区域。将出现一个菜单。

    2. 点击“配置桌面 (Configure Desktop...)”。将打开“配置 - 桌面”对话框，让你配置桌面的不同元素。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_53_1.png)


    3. 如果尚未选中，点击“背景”图标。此操作将带你进入控制桌面外观的区域。

    4. 点击“桌面设置 (Setting for desktop)”旁边的箭头，选择一个特定的虚拟桌面，可以在那里应用任何设置。或者，你可以选择“全部 (All
    Des)”将相同的设置应用于每个虚拟桌面。你将在本章稍后的部分学习更多关于虚拟桌面知识。


    你现在必须决定你想要：图片、幻灯片还是彩色背景。


    ## 更改壁纸 53


    ### 选择预装壁纸


    Linspire 带有各种不同的图像供你选择。在继续之前，请确保你已经遵循了之前“更改壁纸”部分中的步骤 1 - 4。


    1. 如果尚未选中，点击“图片 (Picture)”旁边的单选按钮。圆圈内应该有一个圆点。

    2. 点击下拉箭头。此操作将显示 Linspire 自带的背景列表。

    3. 点击所需的壁纸。窗口将显示该壁纸的预览。

    4. 点击“确定”按钮以完成背景更改。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_54_0.png)


    ## 为壁纸选择自己的照片


    没有什么比家人、假期旅行、宠物或你个人收藏中任何其他图像的图片更能让桌面更具个性化了。Linspire 让你轻松地将自己的照片添加到桌面。在继续之前，请确保你已经遵循了“更改壁纸”部分中的步骤
    1 - 4。


    1. 点击“浏览 (Browse)”按钮。将打开一个对话框，允许你在计算机中导航所需的图像。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_54_1.png)


    2. 导航到包含你想用作壁纸的图像目录。如果你不如何导航文件夹，请参阅标题为“文件管理 (File Management)”的章节。


    3. 点击你想使用的图片文件。它将被选中。

    4. 点击“确定 (OK)”。对话框将关闭，图片将被加载。

    5. 点击“确定”按钮以完成背景更改。


    ## 54 第 3 章 Linspire 的个性化与定制


    ![](img/3926ca1fb00de3af845faa03d2c351e5_55_0.png)


    ### 更改颜色


    如果你更倾向于彩色背景而不是图像，Linspire 为你提供了该选项。你可以背景应用多种颜色。在继续之前，请确保你已经遵循了“更改壁纸”部分中的步骤 1 -
    4。


    ![](img/3926ca1fb00de3af845faa03d2c351e5_55_1.png)


    1. 如果尚未选中，点击“颜色 (Color)”旁边的单选按钮。圆圈内应该有一个圆点。

    2. 点击下拉箭头。此操作将显示 Linspire 自带的背景列表。

    3. 点击所需的壁纸。窗口将显示该壁纸的预览。（注：根据上下文，此处应为颜色预览）

    '
