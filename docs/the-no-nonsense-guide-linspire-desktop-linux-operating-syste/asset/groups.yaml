    the page.


    3. Click and drag across the page. As you drag a preview of the location of the
    shape will appear. When you release the mouse button the shape will appear on
    your page.


    ## Deleting a Slide


    1. Right-click on the name of the slide you would like to delete. A menu will
    appear.

    2. Click Delete... A dialog box will open confirming that you would like to delete
    the slide. Click Yes when that dialog appears.


    ## Switching Slides


    The quickest way to switch from one slide to another is to simply click on the
    name of the slide you would like to.


