    # Moving Text


    ![](img/3926ca1fb00de3af845faa03d2c351e5_116_2.png)


    It''s common to have to move a block of text to another location in your document.
    This can be done very quickly by simply clicking and dragging.


    +   1. Create a selection of text using one of the selection methods.


    +   2. Click and drag the selection to the desired location. As you drag, your
