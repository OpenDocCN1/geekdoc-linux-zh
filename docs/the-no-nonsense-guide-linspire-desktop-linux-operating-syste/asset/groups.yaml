    ## Creating Graphics & Slide Shows


    Within the OpenOffice suite that comes with your Linsp computer, you''ll find
    a program called Drawings. This program allows you to not only create graphical
    images, but also, present those graphics as slide shows. The program itself is
    actually quite advanced and has hundreds of different features you can use when
    creating your images. It would take an entire book to cover all of the features,
    so in this chapter we''ll concentrate on the basics and try to also show you a
    few advanced features.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_146_0.png)


    You may also notice that there is another program in the Launch menu, under the
    OpenOffice group called Presentations. This program is actually the same as Drawings,
    with the exception that it starts with a wizard to create a slide show. This wizard
    is accessible from within Drawings and will be covered in detail within this chapter.


    In this chapter we''ll cover:


    - Building and playing a slide show

    - Creating graphical elements

    - Editing and manipulating objects


    ## Launching Drawings


    Drawings can be found in the Launch menu along with the rest of the OpenOffice
    suite.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_147_0.png)


    - Click Launch | Run Programs. A list of programs categories will appear.

    - Click Business & Finance to see a list of programs that fall under that category.

    - Click OpenOffice. The OpenOffice programs will appear.

    - Click OpenOffice Drawings. The program will launch.


    ## Building a Slide Show


    Here''s some rocket science for you – a slide show is built of individual slides.
    The slides themselves can include text, graphics, movies and audio. For now we''ll
    cover how to add and remove slides and how to use the wizard to automatically
    create a slide show.


    ## Using AutoPilot


    If you''re not just graphically inclined or don''t want to spend a lot of time
    formatting your slide show, you can choose from a selber design templates. These
    design templates usually include formatting for backgrounds, fonts and colors.
    Using the AutoPilot wizard not only can you select a design template, but you
    can also build the content of your slide show. The wizard will ask you a variety
    of questions about what you want to include in your slides and upon answering
    those questions, the slide will be built for you.


    ## Building a Slide Show


    1. Click File. The File menu appears.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_148_0.png)


    2. Click New. A submenu will expand.


    3. Click Presentation. The AutoPilot window will appear. You can use this wizard
    to build your slide show.


    4. Click on the radio button beside From template. This will allow you to select
    a template in the next step.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_148_1.png)


    5. Click on the desired template. It will be highlighted.


    6. Click the Next button to move to the next page of the AutoPilot.


    You don''t have to complete every step of the AutoPilot Presentation wizard. You
    can click on the Create button at any time to finish the presentation based on
    the info you''ve given so far.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_148_2.png)


    7. Click on the desired slide design template. It will be highlighted and a preview
    of the design will appear in the window.


    8. Click on the radio button beside the desired output for the slide show. This
    will help determine the settings for the layout of the slide show. Those designed
    to be printed will be formatted differently then designed for on-screen.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_149_0.png)


    9. Click Next to move to the next stage of the AutoPilot wizard.


    10. Click the drop-down arrow beside Effect and click on a desired effect for
    the transition of your slides. A preview of the transition effect that you selected
    will appear in the window.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_149_1.png)


    11. Click the drop-down arrow beside Speed and click on the speed for the transition
    of your slides. A preview of the transition effect that you selected will appear
    in the window.


    12. Click Next to move to the next stage of the AutoPilot.


    ## Building a Slide Show


    13. Type in the desired information.


    14. Click Next to proceed to the next stage.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_150_0.png)


    15. Click on any of the pages you view.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_150_1.png)


    16. Click on any of the pages you want to include.


    17. Click Create. The slide show will be created.


    ## Creating Slides


    The quickest way to switch from one slide to another is to simply click on the
    name of the slide you would like to.


    1. Click on the name of the slide you would like to move to. You will now be taken
    to that slide.


    ## Creating Elements


    Whether you are going to use the graphics you create on their own or as part of
    a slide show, Drawing gives you a variety of tools that you can use to create
    some amazing, visually appealing graphics.


    ## Inserting Shapes


    Drawing provides you with tools to quickly add a variety of preset shapes to your
    slide show. If you''re not satisfied with the shapes that are included, you can
    always draw your own.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_151_0.png)


    1. Click and hold any of the three shape buttons. A menu of different shapes will
    appear.


    2. Click on the desired shape. You will now be able to draw that shape across
    the page.


    3. Click and drag across the page. As you drag a preview of the location of the
    shape will appear. When you release the mouse button the shape will appear on
    your page.


    ## Deleting a Slide


    1. Right-click on the name of the slide you would like to delete. A menu will
    appear.

    2. Click Delete... A dialog box will open confirming that you would like to delete
    the slide. Click Yes when that dialog appears.


    ## Switching Slides


    The quickest way to switch from one slide to another is to simply click on the
    name of the slide you would like to.


    1. Click on the name of the slide you would like to move to. You will now be taken
    to that slide.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_152_0.png)


    ## Connector Lines


    Common Drawings is used to illustrate an organizational chart. Most organizational
    charts are simply a matter of boxes that are connected with lines. Drawings allow
    you to create lines that dynamically link to objects. This means that if you move
    an object with dynamically linked line attached to it, the line will move along
    with the object. If you''d prefer to create regular lines and arrows, you can
    do so using the same method as for drawing shapes that was discussed in the last
    section.

