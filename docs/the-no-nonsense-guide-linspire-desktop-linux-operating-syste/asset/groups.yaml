    # Selecting Screen Savers


    It used to be that computer monitors required screen savers to avoid an image
    being permanently burned into the monitor. Modern-day monitors don''t have this
    issue, but screen savers still remain popular. Linscape comes with a variety of
    very creative screen savers from which you can choose.


    +   1. Right-click any blank area of the desktop. A menu will appear.


    +   2. Click Configure Desktop... The Configure - Desktop dialog box will be open,
