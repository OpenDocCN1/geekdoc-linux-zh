    # Navigating the Web Browser


    Another way to create a bookmark is to use the keyboard. When you are at the page
    that you would like to bookmark, simply press Ctrl and D on the keyboard.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_222_0.png)


    +   4. Click on Bookmarks in the menu bar. The Bookmarks menu will appear.

    5. Click on the desired bookmark. You will be taken to that page.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_222_1.png)


    # Using The Personal Toolbar


    The Personal toolbar goes one step further than a bookmark. Rather than just remembering
    the location of a web site, a link will appear on the Personal toolbar that you
    can click on to instantly jump to a specific site. By default the Personal toolbar
    should be open, if not, you can access it by following Step 1; otherwise proceed
    to Step 2. The Personal toolbar can be found under the Navigation toolbar.


    ![](img/3926ca1fb00de3af845faa03d2c351e5_222_2.png)


    +   1. Click View | Show/Hide | Personal Toolbar.'
- md: '

    ## Working in Web Pages


    Once you''ve navigated to the pages you want to visit, you''ve got quite a few
    options. From downloading files and images, to jumping to other pages, to translating
    content, to finding text, there are a variety of tools that the Web Browser can
    help you with when you are working with web pages.


    ## Using Links


    Within web pages you''ll find links that will take you to different web sites
    or to different locations within the same web page. It used to be that all links
    were blue and underlined, but this standard has changed. Typically, you''ll know
    when you are over a link when the mouse pointer changes to a little hand.


    - 1. Position the mouse pointer over a link. The mouse pointer will change to
    a hand to indicate that you are over a link.

    - 2. Click on the link. You will be taken to the page associated with that link.


    > If you right-click on a link, you''ll be provided with a variety of options.
    Among other things, you can open the link in a new tab or window, and you can
    bookmark the link or page.


    ## Finding Text on a Page


    This is one of the features that I use most often when web browsing. If you''re
    on a page, particularly one with a lot of information displayed, you can use the
    Find command to look for find a particular word or string of text.


    - 1. Click Edit | Find in This Page... from the menu bar. The Find Page dialog
    box will appear, where you can enter the text that you would like to find.

    - 2. Type the text string that you are looking for in the Find text field:

    - 3. Click on any of the checkboxes to select any of the options. You can choose
    to match a certain case, wrap around, or search backwards in the document rather
    than forwards.

    - 4. Click Find. The first instance of the word will be found and highlighted
    on the page.

    - 5. Repeat Step 4 to find other instances of the word(s) in the web page.

    - 6. Click OK when the Alert dialog box appears. This indicates that the Web Browser
    can find no more instances of the text on the page.

    - 7. Click Cancel to close the Find in this Page dialog box.


    ## Downloading Files


    The Internet is an amazing resource for finding all sorts of files. What and where
    you download is up to you, but here''s the process for handling downloads.


    - 1. Click on the link associated with the download. A dialog box will appear.

    - 2. Click the radio button beside Save to disk it if it is not already selected.

    - 3. Click the OK button. You will be prompted to specify a location to save the
    file on your computer.

    - 4. Navigate to the folder where you would like to save this file.

    - 5. Type a file name if you want to replace the default name of the file.

    - 6. Click Save. The download process will begin and a dialog box will appear
    showing the progress of your download. The file will be saved to the location
    you have specified.

    - 7. Click the Close button to close the Saving dialog box once the download is
    complete.


    ## Saving Images


    Any image you see on the web can be downloaded. Keep in mind that images that
    you save directly from a web page are low resolution. In other words, their image
    quality is low. Also keep in mind that many of the images you see on the Internet
    are copyrighted, so make sure you have permission before saving and using the
    images.


    - 1. Right-click on the image that you would like to download, and a menu will
    appear.

    - 2. Click Save Image As... A dialog box will appear where you can specify a location
    to save the image.

    - 3. Navigate to a folder where you would like to save the image.

    - 4. Type a file name if you want to replace the default name of the file.

    - 5. Click Save. The download process will begin and a dialog box will appear
    showing the progress of your download. The file will be saved to the location
    you have specified.

    - 6. Click the Close button to close the Saving dialog box once the download is
    complete.


    ## Translating Pages


    - 1. Navigate to the page you would like to translate.

    - 2. Click Tools from the menu.

    - 3. Click Translate. The current page will translate.


    ## Searching the Internet


    There are a variety of search sites that allow you to search. The most prominent
    of these is Google, and the Web Browser incorporates its search engine.


    - 1. Type the type you are searching for in the Location bar.

    - 2. Click the Search button or simply click Enter on the keyboard. The results
    appear in the window.

    - 3. Scroll the search results until you see one that matches you were looking
    for.

    - 4. Click on the desired link. You will be taken to that site.


    > To conduct a search on an exact phrase, put a pair of quotations around the
    search text.


    ## Hot Words Searching


    The developers of Linspire have done it again. They''ve taken the web to an entirely
    different level by creating a revolutionary feature called Hot Words searches.
    This search functionality allows you to quickly search any word on the Internet
    with just a click of the mouse. Not only can you conduct regular searches with
    Hot Words, but you can search particular categories and even run grammar and spell
    checks on the term you''ve selected.

    '
  mdcn: '


    ## 在网页上进行操作


    一旦你导航到想要访问的页面，你会有很多选择。从下载文件和图片、跳转到其他页面，到翻译内容、查找文本，当你处理网页时，网络浏览器可以提供多种工具来帮助你。


    ## 使用链接


    在网页中，你会发现一些链接，它们会带你去往不同的网站或同一网页页内的不同位置。以前所有链接都是蓝色并带有下划线的，但这一标准已经改变了。通常，当鼠标指针变成一个小手形状时，你就知道自己正悬停在链接上。


    - 1. 将鼠标指针悬停在链接上。鼠标指针将变成手形，表示你正悬在链接上。

    - 2. 点击链接。你将被带到与该链接相关的页面。


    > 如果你右键点击链接，将提供多种选项。除此之外，你可以在新标签页或窗口中打开链接，还可以收藏链接或页面。


    ## 在页面上查找文本


    这是我浏览网页时最常用的功能之一。如果你在一个页面上（特别是显示了大量信息的页面上），可以使用“查找”命令来寻找特定的单词或文本字符串。


    - 1. 从菜单栏点击“编辑 | 在在本页查找...”。将出现“查找页面”对话框，你可以在其中输入想要查找的文本。

    - 2. 在“查找文本”字段中输入你正在查找的文本字符串：

    - 3. 点击任何复选框以选择相应选项。你可以选择匹配大小写、循环查找或在文档中反向查找而不是向前查找。

    - 4. 点击“查找”。页面将找到并突出显示该单词的实例。

    - 5. 重复步骤 4，以查找网页中该单词的其他实例。

    - 6. 当警报对话框出现时点击“确定”。这表示网络浏览器无法在页面上找到更多该文本的实例。

    - 7. 点击“取消”关闭“在在本页查找”对话框。


    ## 下载文件


    互联网是寻找各种文件的神奇资源。下载什么以及下载到哪里取决于你，但以下是处理下载的过程。


    - 1. 点击与下载相关的链接。将出现一个对话框。

    - 2. 如果“保存到磁盘”未选中，点击其旁边的单选按钮。

    - 3. 点击“确定”按钮。系统将提示你指定在计算机上保存文件的位置。

    - 4. 导航到你想要保存此文件的文件夹。

    - 5. 如果你想替换文件的默认名称，请输入文件名。

    - 6. 点击“保存”。下载过程将开始，并出现一个显示下载进度的对话框。文件将保存到你指定的位置。

    - 7. 下载完成后，点击“关闭”按钮关闭“保存”对话框。


    ## 保存图片


    你在网页上看到的任何图片都可以下载。请记住，直接从网页保存的图片是低分辨率的。换句话说，它们的图像质量很低。请记住，你在互联网上看到的许多图片都受版权保护，因此在保存和使用图片之前，请确保你已获得许可。


    - 1. 右键点击你想下载的图片，将出现菜单。

    - 2. 点击“图片另存为...”。将出现一个对话框，你可以在其中指定保存图片的位置。

    - 3. 导航到你想要保存图片的文件夹。

    - 4. 如果你想替换文件的默认名称，请输入文件名。

    - 5. 点击“保存”。下载过程将开始，并出现一个显示下载进度的对话框。文件将保存到你指定的位置。

    - 6. 下载完成后，点击“关闭”按钮关闭“保存”对话框。


    ## 翻译页面


    - 1. 导航到你想翻译的页面。

    - 2. 从菜单点击“工具”。

    - 3. 点击“翻译”。当前页面将进行翻译。


    ## 搜索互联网


    有很多允许你搜索的搜索网站。其中最著名的是 Google，网络浏览器集成了它的搜索引擎。


    - 1. 在地址栏中输入你正在搜索的内容。

    - 2. 点击“搜索”按钮或直接按键盘上的 Enter 键。结果将显示在窗口中。

    - 3. 滚动搜索结果，直到看到一个与你寻找的内容匹配。

    - 4. 点击所需的链接。你将被带到该网站。


    > 要对精确短语进行搜索，请在搜索文本周围加上双引号。


    ## 热词搜索


    Linspire 的开发者们再次做到了。他们通过创建一个名为“热词”（Hot Words）搜索的革命性功能，将网络提升到了全新的高度。此搜索功能允许你只需点击鼠标即可快速搜索互联网上的任何单词。你不仅可以使用热词进行常规搜索，还可以搜索特定类别，甚至对你选定的术语进行语法和拼写检查。


    '
