  \    2. `Cross-site scripting`（跨站脚本）\n    3. `Phishing`（钓鱼）\n    4. `SQL injection`（SQL\
  \ 注入）\n\n14. 你如何描述通过拦截传输中的数据执行的攻击？\n    1. `Phishing`（钓鱼）\n    2. `Man-in-the-middle`（中间人）\n\
  \    3. `SQL injection`（SQL 注入）\n    4. `物理渗透`\n\n15. 风险评估的最终报告应该包含哪些元素？（选择三个）\n\
  \    1. 现有漏洞清单\n    2. 组织成本的估算\n    3. 需要更改的详细列表\n    4. 每项评估的\n\n\n\n\n\n*   你可以尝试使用由大型安全公司和政府机构提供的加密工具（例如\
  \ [`noransom.kaspersky.com/`](https://noransom.kaspersky.com/)），并希望它们能在你的系统上运行。这确实是一个有效选项，但并非所有情况下都有效。\n\
  *   你可以彻底清空系统并从头开始重建一切。这可能非常昂贵，并且需要几个月的时间才能完成。\n\n但你知道如何彻底阻止攻击并让你几乎毫发无损地抽身吗？如果你拥有系统完整且最新的备份副本（包括用户数据和应用程序系统本身），那么你只需要从备份中恢复即可。在最坏的情况下，你只需要停机一两个小时，而且几乎没有人会注意到。更好的是，你可以通过设计一个始终运行的“热”备份基础设施来周周计划，该设施经过预配置，在主系统宕机的一刻刻即可上线。这被称为\
  \ `failover`（故障转移），这种计划可以让你成为大英雄并为你赢得大额加薪。\n\n仍然不确定备份与安全有什么关系吗？\n\n让我们来看看它是如何运作的。\n\
  \n## 为什么你第一次就要做好正确的备份\n\n让我们想象一下我们的勒索软件场景本可以如何不同的发展。你从显示黑客威胁的屏幕前抬起头，对助理说：“幸好我们都做了了备份。我们最好开始工作恢复系统。”假设接下来发生了以下情况之一：\n\
  \n*   你发现你实际上已经六个月没有进行过完整备份了。你拥有的数据太旧了，已经没有用。\n*   你最初设定了定期备份计划，但你发现你的助理从去年 3 月以来就没抽空创建过。\n\
  *   你最近的备份非常新，但你发现关键数据库的数据没有包含在内。你可以找回系统，但你不知道该给老师和救护司机付多少钱，或者说，你不知道他们的名字以及你应该如何向他们的银行账户存款资金。你甚至不知道如何访问市自己的备份账户。\n\
  *   所有关键数据都完好无损，但消耗这些数据的自定义软件解决方案从未被备份。\n*   你的备份协议非常完美并涵盖了你需要的一切，但当你开始恢复操作时，你发现备份介质驱动器故障了。无法恢复。你明智地决定不接市长的电话。也许现在是去开启你计划已久的假期的好时机。\n\
  \n仅仅备份“东西”是不够的。你必须确保获取了所有的东西。偶尔做一次是没有帮助的。当情况变得时，你需要能够迅速将系统恢复到`working`状态，这显然必须包含从最近交易中收集的最新数据。\n\
  \n“快”到什么程度才，“完整”到什么程度才？这取决于组织的运营需求。管理员通常用恢复点目标（`RPO`）和恢复时间目标（`RTO`）来衡量他们的需求。`RPO`\
  \ 是你需要能够恢复的系统状态，该状态要足够新以满足你组织的最低要求。例如，如果你恢复的系统数据包含了崩溃前最后一小时内的所有数据，那么你就可以应付了。但丢失\
  \ `two` 小小时的数据将是灾难性的；你面临的财务或声誉损失将太严重。对于这样的组织，你最好确保你的 `RPO` 为一小时或更短。\n\n另一方面，`RTO`\
  \ 衡量的是在糟糕的事情开始影响你的组织之前，你需要多快让系统恢复运行并全速运行。例如，假设你的电子商务网站离线了 12 小时。你显然会损失一些业务，但你的业务分析师告诉你，长达\
  \ 48 小时的内是可以接受的。然而，超过 48 小时，客户就会认为你已经彻底关门，并转向竞争对手（在所有条件相同的情况下，就是 Amazon）。\n\n因此，当你制定备份方案时，你会同时考虑\
  \ `RPO` 和 `RTO`。你需要确保在 `RPO` 内（例如，一小时）运行新的备份，并确保你能够访问备份存档，并在少于 `RTO`（在我们的示例中为 48\
  \ 小时）的时间内成功将数据恢复到应用程序中。\n\n这种计划对于“做好正确的备份”至关重要。但还有其他考虑因素。让我们来探索一下。\n\n### 评估风险\n\
  \n在备份游戏中，究竟关乎什么？正如你所见的，不生成定期备份会让你容易受到勒索软件的侵害，还会让你面临其他其他潜在噩梦的恐怖景象。想一想，由于灾难性的火灾或类似的中断，你的组织可能会发生什么。是否有足够的资源位于距离你建筑足够安全的地方，供你在紧急情况下进行重建？当问及严重的盗窃案时，这个问题同样有效——而且同样可怕：你能够从所有电脑的突然丢失中恢复过来吗？\n\
  \n因为担心那种灾难场景而晚上难以入睡？嗯，你知道，这没非表现得那么戏剧化。想象一下，如果新的管理员或开发者不小心删除了你的主数据库会发生什么。如果你没有处理过数据库，你将不知道这有多简单。如果你处理过数据库，你可能会在想着火灾、龙卷风和盗窃时安稳地进入睡梦……任何能让你的大脑不去想数据库错误的事。\n\
  \n我确信你已经发现了这里的规律。如果你还没有一个可靠的计划，从现在开始制定一个吧。已经有了一个很好的计划？我打赌你现在感觉自己棒极了。\n\n走错了。\n\n\
  原因如下。你正在备份到什么物理介质上？高密度硬盘？DVD？磁带驱动器？你知道吗，所有类型的备份驱动器都因故障而闻名，而且通常发生在最糟糕的时间？任何驱动器都可能运行十年，但无法确定它明天不会发生故障。而且即使它们一直在旋转，数字数据在长时间推移后也会发生退化。一旦数字存档中即使是最微小的扇不再可靠，你就可以对检索其余部分的能力做最坏的打算。\n\
  \n即使你的存储介质存过了时间的侵蚀，你确定在多年后还能读取它吗？也许，就像你不可能找到一个可以工作的 5.25 英寸软盘驱动器来检索 30 年前的数据存档一样，你可能在访问今天存储驱动器技术的数据时也会遇到困难。尽管技术变化的速度让这变得很困难，但提前做好计划以匹配你的目标至关重要。\n\
  \n底线是，你永远不要把重要的备份寄托在一个存储设备上。你永远不要把你的备份放在同一个地点。目标是至少某种程度的内置冗余将显著提高数据的安全性。\n\n###\
  \ 将备份分布在多个站点\n\n鉴于将备份存档分布在多个位置可以大大提高你生存重大事件的几率，值得花时间考虑一些实际方案。广义地说，你可以定期将存档写入本地物理驱动器，并手动将驱动器运输到远程位置，或者你可以通过网络传输数据。第一种方法不利，而且如果你的名字不是鲁比·高德，就无法自动化；而第二种方法受限于网络连接质量。你最终使用什么取决于你面临的具体需求和限制。\n\
  \n\n\n\n\n大多数组织运营都需要频繁进行数据备份才能发挥作用——我所说的“频繁”是指更接近“每小时一次”而非“每周一次”，这意味着，如果一个系统涉及到循环使用备份介质，并在每周内于主站点和远程地点之间多次物理往返这些介质，那么实现起来将会既复杂又昂贵。\n\
  \n这意味着在大多数情况下，你将不得不考虑某种网络传输。这个主意有多好取决于一些实际因素。如果你的互联网连接上限仅为每秒 50 MB，而你每天有 1 个 TB\
  \ 的数据需要传输，你应该能一眼看出问题所在：每次传输都需要近两天时间才能完成，而且这还是假设在此期间你所在的地方没有其他人使用互联网进行任何严肃操作。\n\n\
  你的选择包括投资于更快的互联网连接，或者减小备份的大小。在不损害备份本身质量的情况下，实现这一目标的一种方法是实施差异备份或增量备份系统，我们稍后会讨论。\n\n\
  通过网络传输的归档应该放在哪里？如今，那几乎总是在公云中。如果你还不熟悉，“云”是由成千上万个面向公众的服务器和存储设备的资源组成的。拥有这些资源的公司像我们这样的用户就可以根据需求租用精确的空间或计算能力。例如，如果我需要运行一个每天可以处理\
  \ 100,000 个访问者的网站，但仅限每个月的前两天，我可以只租用那部分容量且仅针对那几天。同样，我可以将备份归档推送到云存储提供商那里，它将在那里保留直到我需要为止，甚至在设定一段时间后，自动移动到成本更低的长期存储分层。这种按需并按你使用的精确容量请求即时访问的能力，可以使许多原本复杂的操作变得简单且具有成本效益。\n\
  \n对于我们所讨论的这类备份，你通常会考虑云服务提供商，如 Amazon Web Services (AWS)、Simple Storage Service (S3)，或者在某些有限的情况下使用\
  \ Dropbox。如果你感兴趣了解更多关于云、特别是 AWS 版本，我由 Wiley/Sybex 出版的书 *AWS Certified Cloud Practitioner\
  \ Study Guide*（与我的合著者 Ben Piper 合著，2019 年）应该能给你很多启发。\n\n为了让你对这种备份的形式有个直观的感受，以下是编写将典型\
  \ Web 服务器的关键文件备份到 Amazon S3 的脚本步骤。你需要在服务器上安装并配置 AWS CLI。完成这一步在 Amazon 自己的文档中有最好的描述：`docs.aws.amazon.com/cli/latest/userguide/cli-chap-install.html`\n\
  \n我假设你需要备份的文件包含在 `/var/` 和 `/etc/` 目录。我们不妨为这两个目录树分别创建独立的 S3 桶（bucket）。记住 S3 桶的名称在全局范围内是唯一的，因此你可能需要包含一些随机数字：\n\
  \n```bash\n$ aws s3 mb s3://varfiles4356\n$ aws s3 mb s3://etcfiles4356\n```\n\n\
  如果该操作出现任何问题，你将看到错误信息。\n\n接下来，你可以创建一个 Bash 脚本，运行 `sync` 操作以将这些目录树中的任何新文件或最近编辑的文件添加到它们对应的\
  \ S3 桶中。由于这些桶中还没有任何内容，第一次运行脚本可能会花费更长的时间。但随后的运行将快得多。\n\n注意我们是如何使用其绝对路径 `(/usr/local/bin/aws)`\
  \ 来引用 `aws` 命令的。当通过 `anacrontab` 运行时，这是必要的，否则它可能不知道去哪里查找。`s3` 告诉 `aws` 命令我们要在 S3\
  \ 环境中执行后续内容，`sync` 将将新文件或更改的文件从例如本地 `/var/` 目录复制到 S3 上的 `varfiles4356` 桶。\n\n```bash\n\
  #!/bin/bash\n/usr/local/bin/aws s3 sync /var s3://varfiles4356\n/usr/local/bin/aws\
  \ s3 sync /etc s3://etcfiles4356\n```\n\n由于物理定律决定了管理员不太可能忠实且可靠地记住每月手动运行备份命令超过几次，你将希望通过\
  \ `cron` 任务自动化脚本的执行。为了让备份每天运行不超过一次，且在系统启动十分钟后运行，请将此行添加到 `/etc/anacrontab` 文件中：\n\
  \n```\n1    10    myBackupJob    /home/myname/backup.sh\n```\n\n当然，我信你意识到这在真实的 Web\
  \ 服务器上是没有意义的，因为这种服务器不太可能每天启动。对于真实的服务器，你最好将脚本放入 `/etc/cron.daily/` 目录或创建一个 systemd\
  \ 定时器（timer）。但 `anacron` 也是一个很有的工具。\n\n### 测试你的备份\n\n想象一下，当你遭遇灾难性的数据丢失并自豪地推出备份归档时，却发现预期的数据并不在那里，那会有多趣。深入研究日志可能会发现初始配置存在问题，或者在中间发生了网络故障。但现在唯一的问题是你空守着昂贵的硬件，却没有运行它所需的数据。这种情况是无法补救的。但完全可以避免这种情况发生。请注意，这并不容易：我所知没有简单的自动化解决方案。但完整的测试协议部分可能如下：\n\
  \n1. 创建一个与测试环境尽可能类似的硬件环境。你不需要匹配存储和计算能力，但它必须运行相同的操作系统、软件包和版本。为了降低成本，你可能希望使用虚拟机构建这个测试环境。\n\
  2. 创建新的备份归档后，立即将其复制到测试环境中并执行与真实环境相同的恢复过程。\n3. 最后，测试软件本身以确保一切运行正常。\n4. 对后续的备份迭代重复此操作。\n\
  \n如果你有时间和精力，这个过程可以完全自动化，通过脚本在虚拟机之间移动归档文件，并对功能测试进行报告。你是否想走这条路取决于你的预算和环境的整体复杂性，但它值得考虑。\n\
  \n### 满足合规性\n\n合规性与 IT 安全最佳实践在很大程度上是重叠的。换句话说，政府机构或行业标准组织与运行你组织基础设施的管理员共享大部分目标：保护你、你的用户和你的客户。因此，在大多数情况下，至少你应该将合规要求视为提高运营稳定性和价值的机会，而不是官僚主义的负担。\n\
  \n因此，当美国医疗行业运行的工作负载必须遵守《健康保险可流动性与责任法案》（HIPAA）的标准时，或者处理信用卡交易的公司被其银行要求符合支付行业数据安全标准（PCI-DSS）时，可能有很多值得学习的内容。\n\
  \n\n\n\n\n大多数（如果不是所有的话）监管标准中的元素之一都涉及数据留存。例如，如果你正在处理成上万名患者的健康记录，你最好绝对确定这些记录不会发生泄露，或者发生同样糟糕的丢失。因此，密切关注\
  \ `HIPAA`、`PCI-DSS` 等及其背后的机构期望你如何管理备份，是非常明智的。遵循他们的预期不仅能让你在这些市场上运营，还能让你成为一名更出色的管理员。\n\
  \n## 备份类型\n\n深入研究数据备份的复杂世界可能会让我们稍微偏离主题太远。但我们至少应该简要查看一些主要的顶层备份策略。最简单、最直观的方法是全量备份，即你每次都将所有内容都丢进备份。正如你所看到的，这将花费大量时间并需要大量的可用存储空间，以至于这通常是不可能的。但即便如此，你仍然有选择。你不一定因为某些数据无法放入可用的备份空间就将其排除在外。相反，你可以使用下一节中描述的方法之一，仅更新自上一次备份以来发生更改或更新的资源。只要你有一个可靠的系统来确保你没有遗漏任何内容，这就可以简化并优化你的备份流程。\n\
  \n### 增量备份\n\n增量备份始于单次全量备份，但在执行时，备份软件还会记录存档中每个对象的状态。随后，当启动第一次 `incremental`（增量）备份时，会扫描源系统是否有任何更改，只有自第一次备份以来更新的对象或新创建的对象将成为备份的增量部分。因此，第二次备份将比原始备份小得多，且完成速度快得多，但现在已经存在原始系统的有效且最新的镜像。\n\
  \n一个长期增量备份协议可能是这样工作的：在周一进行全量备份，然后在本周剩余的每一天进行增量备份。下周一可能再次进行第二次完整备份，并将原始备份（包括其所有增量）“轮转”下来作为二级备份。你可能希望维护一个三到四个备份周期的稳定循环，然后再永久删除最旧的版本。\n\
  \n增量备份允许你显著减少备份所需的网络和带宽，同时仍然能够覆盖所有需要覆盖的内容。如果你需要从备份归档中恢复系统，你需要访问原始备份以及所有增量备份。你显然不会手动管理这些步骤，而是将使用\
  \ Linux 的 `Rsync` 等工具的备份脚本进行工作。\n\n以下是你如何使用 `tar` 工具创建、管理并恢复增量备份归档。在第一个示例命令的 `czvg`\
  \ 参数中，`g` 通知 `tar` 创建一个索引文件（此例中 `index.txt`）来跟踪单个对象。存档名称将为 `backup.tar.gz`，备份将包含\
  \ `/var/`、`/etc/` 和 `/home/myname` 树中的文件。\n\n```\ntar czvg index.txt -f backup.tar.gz\
  \ /var /etc /home/myname\n```\n\n需要时，通过运行完全相同的但使用相应更改的文件名来增量添加新文件。\n\n```\ntar czvg\
  \ index.txt -f backup-1.tar.gz /var /etc /home/myname\ntar czvg index.txt -f backup-2.tar.gz\
  \ /var /etc /home/myname\n```\n\n当需要恢复归档时，你按照它们创建的相同顺序对每个归档文件使用常规 `xvf` 参数。\n\n\
  ```\n### tar xvf backup.tar.gz\n# tar xvf backup-1.tar.gz\n# tar xvf backup-2.tar.gz\n\
  ```\n\n去试试吧。你自己尝试一下。\n\n### 差异备份\n\n差异备份的工作方式与它的增量备份兄弟非常相似，但它不是只获取自上一次增量以来更改的对象，差异备份会复制并备份自`原始全量备份`以来更改的`all`（所有）对象，这意味着特定文件在单个周期内可能会被复制多次。差异备份相对于增量备份的优势在于，恢复归档速度更快、更简单，因为你只需要解压初始和最近的归档即可确保获得所有内容。另一方面，随着更新归档的生成，差异备份通常会消耗更多资源。\n\
  \n### 备份生命周期\n\n即使数据留存受到法律或行业标准的监管，你也不希望无限期保留旧归档。但我打赌，你也不希望在旧数据集合最后使用多年后，还要去手动删除它们。正如你所预期的，自动化管理归档生命周期过程是可能的。\n\
  \n例如，`AWS S3` 服务允许你创建生命周期规则，这些规则可以将归档在最昂贵的存储类型中保留（例如）一年；将其移动到访问频率较低、成本更低的存储类型中保留四年；然后在满整五年后完全删除归档。通过这种方式，你可以在享受最低成本的同时对数据进行适当的访问，而不必担心丢失更改跟踪。\n\
  \n一如既往，自动化是你的最好的朋友。\n\n### 多级备份\n\n维护可靠的备份归档以备在生活带来意外惊喜时使用是非常极了的。但根据你使用数据的方式，这可能仍然不够。考虑一下，从当前设置中恢复数据可能花费一两天的时间对于你组织的需求来说是否太长了。或者，如果你管理的数据恰好是为警察力量或军事力量提供支持呢？此类基础设施面临的威胁可能足够需要特殊的保护。\n\
  \n由于还没有任何地方可以为你的备份提供`绝对`的安全保障，你的次优选择是利用多个位置的价值，提供一种深度防御。这可以表现为简单的在多个站点复制备份归档、利用云提供者的地理隔离设施，或使用完全不同的云平台维护并行归档。你选择的存档存储模式也可以由特定的恢复策略定义。这些主题将在本章的后续简要探讨。\n\
  \n### 多站点存储解决方案\n\n对于存储来说，两个站点绝对比一个站点好。两个独立的备份设备在给定时间内故障的概率在统计学上比一个要低。两个建筑发生火灾的概率在统计学上比一个低得多，两个国家遭受重大政治动荡的概率在统计学上也比一个要低。因此，将冗余备份分散得越远越有利于你。大型全球云提供商（如\
  \ `AWS` 或 `Microsoft Azure`）在这方面特别具有优势。例如，`AWS` 将资源分布在 20 多个地理区域中，每个区域至少有两个名为可用区（`AZ`）的独立设施。\n\
  \n\n\n\n如果那种复制方式无法满足你的需求，你也可以使用第三方编排工具来实现归档在跨*多云*资源之间的自动化复制。这可以防止你受限于供应商锁定，或者防止服务商直接破闭的风险。你选择的方法将反映你组织的业务需求以及对故障的容忍度。\n\
  \n## 灾难恢复计划\n\n你从故障中快速恢复的能力取决于备份目前存储在何处，同样重要的是它们存储的格式。理想情况下，你希望针对应用程序的合法请求被重定向到替换环境，而无需人工干预。这个过程被称为*故障转移*（failover），并以一种对用户实际上不可见的方式来实现。\n\
  \n故障转移可以通过使用域名系统（DNS）路由策略、网络负载均衡器和防火墙规则的某种或多种组合来实现自动化。但这需要存在某种备用资源栈。这可以表现为启动新服务器并从你的备份归档中为其填充数据的脚本。或者，为了获得更快的响应，你可以投资一组永久的、预构建并定期更新的服务器资源，镜像你“活动”服务器的当前内容。如果需要故障转移，这些备份服务器可以在几秒钟进入活动状态。\n\
  \n这种持续的备份准备工作分为三种：\n\n*   *冷备份栈*将随时提供备用服务器资源，但在启动之前需要向其填充软件和数据。\n*   *热备份栈*可能会永久运行并带有你的核心应用程序数据，但在启动之前需要导入最新数据。\n\
  *   *热备份栈*是你生产服务器的近乎完美的镜像，只需进行请求重定向即可投入使用。显然，这是最快最昂贵的选项。\n\n备份资源的快速配置是大型云平台特别擅长的领域。单此这一点就足以成为将资源从本地服务器机房迁移到云端（或至少创建某种云地本地结合的混合模式）的强有力论据了。\n\
  \n## 配置监控与告警\n\n系统可见性：获取的越多越好。即使是最微小的计算机也是极其复杂的实体，有数百万行代码定义了其操作系统、网络服务和应用程序的行为。由于现在几乎所有设备都享有全天候的网络连接，其系统的变化将比过去几年频繁得多。因此，为了了解自己的安全程度，你绝对希望对系统状态有一个全面且实时的视图。\n\
  \n在本节中，我们将学习两种帮助你深入观察设备内部的并行方法：在担忧的趋势演变成实际问题之前识别并捕捉它们，以及尽可能地识别并切断现有问题以防止进一步的损害。这两种方法使用了两类工具：系统日志和入侵检测工具。\n\
  \n### 使用系统日志\n\n每当我想到系统日志时，脑海中浮出的第一个想法就是信息过载。数字系统产生大量的数字噪声，而这些噪声大部分以未经过滤的日志文件形式存在。图\
  \ 8.1 显示了典型 Linux 机器日志输出的一个微小片段。由于忽略整个内容并不是真正的解决方案，实用日志系统的首要任务是为我们提供理解这些混乱的方法。\n\
  \n![图像显示了说明典型 Linux 机器日志输出的一个微小片段的截图。](img/61474.png)\n\n图 8.1 Linux Ubuntu 18.04\
  \ 系统上 `dmesg` 命令的一些输出。读起来很有趣，不是吗？\n\n你将根据所使用的特定操作系统选择可视化工具。广义来说，这些工具的工作方式如下：\n\n\
  *   根据搜索过滤器自动扫描原始日志输出，并以电子邮件或文本告警的形式发布任何匹配项\n*   以图表、图形或偶尔的打印报告的形式在屏幕上显示数据\n\n无论你采取哪种方法，只有当线路末端真的有人在并能够做出时，你才能从系统中获得价值。为此，你的监控系统应该足够简单，让管理员只需一眼就能识别故障迹象，但配置必须足够智能，不至于产生过多的误报，导致最终所有内容都被忽略。预计在开始阶段花一些时间精调你的配置。\n\
  \n日志也可以在攻击后作为取证分析的一部分使用。即使攻击目标已无法成功启动（且其日志未自动保存到外部收集系统），你通常可以使用 Linux 实时启动会话挂载驱动器并访问日志。一旦进入，你可以检查系统日志文件，关注发生在攻击时间段内的事件。\n\
  \n请记住，*加密*驱动器上的数据只有在知道解密密钥/密码的情况下才能通过实时启动会话访问。\n\n### 入侵检测\n\n主动监控系统的有效方法是安装某种入侵检测系统（IDS）。IDS\
  \ 会定期运行脚本，将系统资源的*实际*状态与其*预期*状态进行比较。如果检测到关键系统配置文件或网络行为发生意外变化，将发出告警。IDS 分为两种：基于主机的入侵检测系统（HIDS）和网络入侵检测系统（NIDS）。\n\
  \nHIDS 跟踪关键文件系统配置文件的变化。在 Linux 机器上，可能这意味着扫描 `/etc/` 目录层次结构下系统配置文件的大小和修改日期。例如，每次检测到对\
  \ `/etc/passwd` 文件的编辑，你都会收到告警。如果更改符合你的正常模式（也许你最近添加了新用户），你可以安全地忽略警告。如果你想不起该编辑的任何原因，你应该进一步调查。运行在\
  \ Windows 机器上的 HIDS 可能关注注册表的变化。\n\n相反，NIDS 分析入站流量记录。NIDS 能够检测可疑流量模式。\n\n你只需几分钟即可设置好流行的\
  \ Snort IDS。从安装包开始。安装过程中，系统会要求你以 CIDR 格式提供所在的所在的子网。完成后，你可以通过 `/etc/snort/snort.conf`\
  \ 文件管理 Snort 配置。例如，`HOME_NET` 变量可以限制 Snort 监听的子网。默认值为 `any`。\n\n```\n### apt install\
  \ snort\n### nano /etc/snort/snort.conf\n```\n\n在运行工具之前，你可以使用 `-T` 测试参数验证配置。此示例将\
  \ Snort 指向 `enp0s3` 接口并用 `-c` 设置配置文件。\n\n```bash\n# snort -T -i enp0s3 -c /etc/snort/snort.conf\n\
  ```\n\n这是一个实际扫描操作，将输出重定向到控制台 `(-A)`，以静默模式运行 `(-q)`，将用户和组设置为 `snort`，并正如测试运行中所看到的，定义配置文件和接口。\n\
  \n```bash\n# snort -A console -q -u snort -g snort -c /etc/snort/snort.conf -i enp0s3\n\
  ```\n\n\n\n\n为了在安静的服务器上生成一些输出以查看效果，你可以从远程机器 ping 你的服务器。在真实环境中，Snort 可能会输出大量数据，这些数据会被写入\
  \ `/var/log/snort/` 目录下的文件中。为了让这些内容更易阅读，可以使用 `snort-stat` 工具将日志转换为 MySQL 格式，然后作为电子邮件发送：\n\
  \n```\n# cat /var/log/snort/snort.log.1597335187 | /usr/sbin/snort-stat | sendmail\
  \ myname@domain.com\n```\n\n## 总结\n\n可靠的备份和恢复计划共享一个重要目标：确保你的数据和应用程序能够尽可能可靠地为用户提供。\n\
  \n尝试可视化可能发生在你组织上的所有可能的灾难是非常重要的，这样你才能做出充分准备。这些包括硬件故障、通过黑客攻击盗窃、火灾等物理灾难以及政治动荡。\n\n\
  你将备份存储在何处——特别是本地和云解决方案之间进行选择——在很大程度上取决于你的数据量以及你所可用的网络带宽。\n\n像 AWS S3 这样的云存储提供商提供了多个层级的高性价比大规模存储解决方案，这些层级在成本、冗性和检索时间上各不相同。\n\
  \n未经过可用性测试的备份存档应被视为无用。\n\n数据备份策略必须符合你和你的组织所面临的任何数据保留和保护的法规及行业标准标准。\n\n备份生命周期定义了数据存档在特定的可访问级别上维持多久，以及何时（如果\
  \ ever）应该被销毁。\n\n应该通过日志数据可视化工具和某种入侵检测系统，持续监控系统行为是否存在可疑之处。\n\n## 回归基础\n\n### 理解什么是完整且可用的备份。\n\
  为了使备份有用，它必须包含你快速将应用程序恢复到工作状态快所需的所有数据。\n\n### 理解可能导致备份失效的问题类型。\n备份介质可能会故障，备份内容可能证明不足，存档可能会过时。\n\
  \n### 理解构建灾难恢复计划的关键考虑因素。\n恢复点目标（`RPO`）代表了在不破坏组织运行的情况下可能丢失的最大数据量。恢复时间目标（`RTO`）是你的应用程序恢复到功能状态之前你可以生存的最长时间。\n\
  \n### 理解备份冗余的重要性。\n将你的备份存档集中在一个位置或使用单一软件平台，可能会使其暴露于“单点故障”，降低其生存几率。\n\n### 理解各种备份策略。\n\
  差异备份在自最近一次 `full` 备份之后的每次备份操作中保存所有更改的对象。增量备份仅保存自最近一次 `incremental` 备份以来更改的对象。\n\n\
  ### 理解各种备份模式。\n故障转移是系统在生产环境栈故障时，将入站请求重路由到备用资源栈的能力。根据即时恢复对你组织的重要性，你可以使用冷备、温备和热备栈进行故障转移。\n\
  \n## 复习题\n\n你可以在附录中找到答案。\n\n1. 与勒索软件攻击相关的最大风险是什么？\n    1. 你的系统管理员身份被盗取\n    2. 对你的物理服务器进行有效破坏\n\
  \    3. 对你自己的数据访问权的灾难性丢失\n    4. 盗取你第三方软件许可的合法所有权\n\n2. 在需要缩小存档大小的正常情况下，全系统备份应该包含哪些元素？\n\
  \    1. 系统配置、应用程序、日志、帐户和用户数据\n    2. 应用程序和用户数据\n    3. 系统配置、硬件配置、应用程序和用户数据\n   \
  \ 4. 包括虚拟文件系统的完整快照镜像\n\n3. 哪个最能描述恢复点目标（RPO）？\n    1. 你预期的可能影响应用程序可用性的最坏情况\n    2.\
  \ 你的组织为满足最低要求所需的系统状态\n    3. 你的组织可以承受应用程序不可用的的最长时间\n    4. 你的组织应用程序的理想运行状态\n\n4.\
  \ 哪个最能描述恢复时间目标（RTO）？\n    1. 你的组织为满足最低要求所需的系统状态\n    2. 你预期的可能影响应用程序可用性的最坏情况\n \
  \   3. 你的组织应用程序的理想运行状态\n    4. 你的组织可以承受应用程序不可用的的最长时间\n\n5. 为什么要将数据备份到多个存储介质中？\n\
  \    1. 因为任何介质设备都可能老化\n    2. 因为你存储数据的位置可能被火灾损坏\n    3. 因为任何介质设备的兼容硬件可能变得无法找到\n\
  \    4. 因为实时应用程序数据很快过时\n\n6. 什么考虑因素可能会让你难以定期将备份推送到云端？\n    1. 可用的网络带宽\n    2. 云存储的可靠性较低\n\
  2. 数据传输过程中的安全性\n    4. 丢失备份数据的风险\n\n7. 为什么你想确保你的系统和数据符合法规合规标准？（选择两个）\n    1. 因为法规合规将几乎更具成本效益\n\
  \    2. 因为法规合规的许多元素对于维护数据完整性非常重要\n    3. 因为遵守标准允许你在受控行业内工作\n    4. 因为大多数企业软件的设计是为了在运行不合规负载时发生故障\n\
  \n8. 哪个能准确描述差异备份？\n    1. 目标存储设备内的所有对象都将被备份。\n    2. 仅自上一次全备份以来发生更改或添加的对象将被备份。\n\
  \    3. 对象将根据随机生成的计划进行备份，以确保随时间推移复制所有对象。\n    4. 仅自最近备份以来发生更改的对象将被备份。\n\n9. 哪个能准确描述增量数据备份？\n\
  \    1. 仅自最近备份以来发生更改的对象将被备份。\n    2. 仅自上一次全备份以来发生更改或添加的对象将被备份。\n    3. 目标存储设备内的所有对象都将被备份。\n\
  \    4. 对象将根据随机生成的计划进行备份，以确保随时间推移复制所有对象。\n\n10. 哪些考虑因素可能会迫使你配置增量而非差异备份？\n    1.\
  \ 配置成功的差异备份所需的学习曲线\n    2. 敏感和私有数据存在\n    3. 分布在多个远程站点的数据\n    4. 可用网络带宽和存储容量的限制\n\
  \n11. 下列哪些是使备份架构多样化的有效方法？（选择三个）\n    1. 使用多个软件系统存储存档。\n    2. 使用多个硬件设备平台存储存档。\n\
  \    3. 使用多个版本增量存储存档。\n    4. 在多个地理区域存储存档。\n\n\n\n\n\n## 12. 他们的平台架构中哪些特性让大型云提供商能够更好地保护你受重大物理故障的影响？\n\
  \n1. 广泛分布的物理基础设施\n2. 强力防火墙保护\n3. 快速扩展和缩小资源的能力\n4. 大规模、经过培训的工程师团队\n\n## 13. 你如何称呼一种始终运行并维护最新应用程序数据副本的应急恢复系统？\n\
  \n1. 负载均衡器\n2. 冷备份\n3. 温备份\n4. 热备份\n\n## 14. 下列哪种监控系统可以配置为主动寻找你的服务器文件系统被篡改的迹象？\n\
  \n1. 基于主机的入侵检测系统 (HIDSs)\n2. `journald` (Linux 系统)\n3. `dmesg` 设施 (Linux 系统)\n4.\
  \ 网络入侵检测系统 (NIDSs)\n\n## 15. 如何才能将监控数据有效地可视化为易于消费的格式？（选择两项。）\n\n1. 通过自动过滤日志数据中的“感兴趣”的条目，并将其转发给管理员进行可视化\n\
  2. 使用可视化软件，通过图表和图形显示日志数据\n3. 通过安排时间对完整日志文件进行仔细的人工审查\n4. 在每个管理员桌面的后台窗口中流式传输日志数据\n\
  \n## 16. 哪种系统资源可以帮助你在攻击之前、期间和之后理解系统漏洞？\n\n1. 入侵检测系统\n2. 网络入侵检测系统\n3. 日志\n4. VPN\n\
  \n# 第 9 章：资源隔离设计模式\n\n![image](img/clogo.jpg) 想一想他们建造大型轮只的方式。通过（垂直）隔舱板和（水平）甲板划分的多个不隔水隔舱可以在外船壳受损时防止船只沉没。这种想法是是，即使船体受损导致漏水，水的积聚也可以被限制在最靠近问题源的隔舱内。其余隔舱可以继续提供浮力。\n\
  \n这是思考 IT 安全的一种很好的方式。考虑到随着时间的推移，你几乎肯定会成为恶意攻击的目标，并且考虑到其中某些攻击注定会有程度的成功，因此尝试限制它们造成的损害是合理的。在你的基础设施设计中构建等于隔舱和甲板的数字对应物，可以产生巨大的影响。\n\
  \n这里的“设计”，我的不仅是指你可能编写软件或配置 IT 资源栈的方式——尽管我也确实指的是这些。但除此之外，我想鼓励你在与数字设备进行的所有交互的语境下，从“隔离”的角度来思考。\n\
  \n以你的智能手机为例。或者更准确地说：当*别人*拿走你的智能手机会发生什么？那个小偷现在将拥有你的多少重要数据？他现在将访问哪些重要账户？你还能验证现有的启用\
  \ MFA 的账户吗？你确定你能够发现自己被抢劫了，并找到一台可以登录所有这些账户并更新它们的身份验证的电脑，在你的在线、财务和法律身份不再属于你之前？\n\n\
  为什么不通过在你的账户和攻击者之间设置一些距离——一个虚拟的不隔水隔舱——来提前保护自己呢？一个明显的步骤是对你的移动设备进行密码保护和加密。另一种方法可以是为你从手机访问的所有服务使用一次性邮箱帐户。这样，如果你遭遇了不幸运，你用于银行和工作等严肃登录的主账户仍将受你控制，你只需要选择一个新的一次性邮箱帐户来替代你在出门时使用的内容。从你的主账户将邮件转发到与手机关联的帐户，让你在不产生不必要风险的情况下保持个人和业务生活的最新动态。\n\
  \n这种*账户隔离*原则也适用于你使用的任何数字助理。没有人真正知道亚马逊的 Alexa、苹果的 Siri 或 Google Assistant 之类的工具收集了多少数据，或者它们正在对这些数据做什么。我们也不真正知道这些数据暴露在第三方窃取风险中的程度有多大。因此，避免将你的助理与主电子邮件地址和个人身份账户关联是有意义的，以便在发生安全事件时限制你的损失。\n\
  \n这些是将*隔离*应用到你个人在线活动的一些方法。本章的其余部分将介绍如何将其作为大型 IT 系统的一部分使用。我们将研究设计网络、创建“安全空间”沙箱环境，以及构建虚拟墙以更密切地控制谁可以访问特定资源。\n\
  \n## 配置网络防火墙\n\n在第 3 章“控制对资产的访问”中，你学习了如何通过物理或软件防火墙以及路由器来控制和引导网络流量。但使用这些设备可以实现的控制水平也可以允许你有效地将资源划分为不同的且隔离的分区。你可以对一组设备配置相对开放的访问，同时在更严格的控制下保护其他更敏感的操作。\n\
  \n对于像 AWS 这样的云提供商，你可以使用虚拟资源组织工具（如虚拟私有云或安全组）提供类似的功能。对于本地基础设施，通常的做法是将你的资产划分为单独的物理网络，使用布线或无线配置来构建防止网络重叠的“墙”。\n\
  \n以下是使用这种隔离模式的几种场景。\n\n### 平衡公共网络和私有网络\n\n构建多层 Web 应用程序常用方法是将你的 Web 服务器放在面向公共的网络中，而将为\
  \ Web 服务器提供数据的数据库服务器放在私有网络中，限制仅允许需要它的管理员和服务访问。图 9.1 阐释了这种设置可能的样子。原则是什么？保护你可以保护的，只暴露必须暴露的。\n\
  \n![图显示了面向可能的 Web 服务器允许从公共网络进行开放访问，而后端数据库服务器得到了更好的保护。](img/61426.png)\n\n图 9.1 面向可能的\
  \ Web 服务器允许从公共网络进行开放访问，而后端数据库服务器得到了更好的保护。\n\n为了获得更严密的访问保护，你可以创建一个第三网络，通常称为 DMZ（借自地缘政治术语的*非军事区*）。DMZ\
  \ 充当“不信任”的公共网络（Web 服务器等资源所在地）与用于本地基础设施的私有“信任”网络之间的安全阀。典型的 DMZ 架构如图 9.2\n\n图 9.2\
  \ 常见的双防火墙 DMZ 设置\n\n在不信任网络和信任网络中的设备之间创建连接所需的额外网络配置和身份验证提供了额外的保护层。考虑到完全使用物理组件构建此类网络可能涉及的复杂性和费用，虚拟化网络环境越来越多地被用于将单一物理网络划分为多个安全划分的虚拟子网。\n\
  \n\n\n\n\nDMZ 主题的一种变体是在 DMZ 内部使用一个称为 `bastion host`（堡垒机）的独立服务器，外部访问私有“受信任”区域的请求可以通过它进行路由。需要在运行在受信任网络的服务器上开启远程安全外（`SSH`）会话的管理员，首先需要登录堡垒机上的用户账户。从那里开始，管理员被允许“跳转”到私有服务器上的\
  \ SSH 会话中。堡垒机有时也被称为 `jump boxes`（跳板机）。请查看图 9.3 以了解其工作原理。\n\n![该图显示了如何将堡垒机放置在 DMZ\
  \ 中，远程管理员可以通过它访问私有网络中的资源。](img/61444.png)\n\n图 9.3 堡垒机是放置在 DMZ 内的服务器，远程管理员可以通过它访问私有网络中的资源。\n\
  \n### 构建隔离开发环境\n\n目标是强制执行开发不同阶段工作负载之间的分离。为什么你可能想将自己的操作划分到不同的网络中？因为你的编程团队在产品开发早期可能想要尝试的风险实验很容易逃离实验室并影响网络上运行的任何服务器。你希望开发人员能够创新和实验，但你也希望保护生产资源免受开发者可能意外释放的任何“怪物”的影响。\n\
  \n组织通常会从整体基础设施中划分出三个环境。一个环境——使用私有网络——可能用于应用程序未来版本的早期开发。第二个环境可以专门用于部署最终的发布前版本。这个被称为“staging”（预发布）的环境用于在技术栈上测试新的软件发布版本，该技术栈与发布后将使用的几乎完全相同。这提供了一个最后的机会来确认一切都运行正常。第三个环境是生产环境，你的用户将使用的发布版本将在其活跃周期内驻留在此。\n\
  \n这三个环境的共同点是，它们*不共享*单一的网络或服务器资产。\n\n## 使用沙箱工作\n\n除了我们刚刚讨论的实现相对简单的物理隔离开沙箱外，隔离环境还有其他一些“美味”的选择。在构建复杂的多服务器环境时，寻求简单性和成本效益往往会引导你走向虚拟化。\n\
  \n虚拟机程序虚拟化涉及一台宿主机服务器，其计算、存储和网络资源可以被划多个虚拟服务器，每个服务器都在愉快地运行，且完全不知道自己并没有接管整台机器。在配置适当的情况下，除非你明确允许，否则一个虚拟机（`VM`）不应访问运行在同一台虚拟机程序上的任何其他虚拟机的数据或资源。\n\
  \n这种灵活性和隔离性使虚拟机成为构建沙箱的优秀工具。但许多虚拟机程序平台（包括 `Xen` 和 `KVM`）以难以安装和配置而闻名。Oracle 的 `VirtualBox`\
  \ 是一种 `hosted hypervisor`（宿主型虚拟机程序），它可以像其他应用程序一样安装在任何操作系统上，但它可以为你运行 Linux 或 Windows\
  \ 虚拟机提供一个高度可配置的环境。如图 9.4 所示，VirtualBox 设置对话框让你对虚拟机的运行方式具有高层级的控制权，包括其网络环境的具体样子。这让你能够精确定义所需的连接性和可用性选项。\n\
  \n### 沙箱的用例\n\n你是否需要在不危及自身基础设施的情况下测试新软件？如果是这样，沙箱正是你需要的。沙箱是一个隔离环境，你可以在其中运行不受信的代码而不会影响系统的其余部分。这对于以下场景特别有用：\n\
  \n* 测试新的或未经证明的软件\n* 分析恶意软件\n* 开发新功能\n* 探索系统配置\n\n数字取证分析（如果你还没有体验过的话的话）是分析遭受过攻击的数字设备的过程。诀窍在于安全地访问恶意软件并了解其来源、操作能力和漏洞，而不会让自己的设备面临风险。\n\
  \n\n\n\n\n像 Docker 和 LXD 等轻量级容器技术与虚拟机管理器不同，它们不仅共享硬件资源，还共享宿主机操作系统的软件内核。这种架构是容器能够获得卓越速度和性能的主要原因，但只要你正确配置了相关内容，就不应该丢失任何隔离性。容器显而易见的缺点是，它们并不是为了提供带有图形界面的虚拟平台。只要你只需要一个终端登录连接，就可以考虑将容器作为你的沙箱。\n\
  \n正如你之前在开发/生产环境中看到的那样，你可以使用 Amazon 的虚拟私有云（V）等云基础设施元素来创建安全且有效的沙箱。只需意识到，你可能需要花些精力收紧安全组规则，以达到你所需的隔离水平。\n\
  \n## 控制本地系统访问\n\n在讨论了如何在较大的网络中隔离你的数据和资源之后，我们何不花时间谈如何保护单台计算机上属于某个用户的资源免受其他用户的侵害？你确实需要讨论这个话题。毕竟，作为我们之前提到的那些水密性隔舱的一部分，这都是合理的。将这种保护看作一艘非常潮湿的船内部的最后一个干燥隔舱。\n\
  \n你如何创建访问控制取决于你具体的操作系统——或者说，取决于你使用的特定云提供商。但过程始终始于用户建立身份的方式，这通常通过登录账户来实现。一旦建立了用户账户，你就可以使用系统工具来确保没有人能够获取超过其应得份额的资源大饼。\n\
  \n| ![note](img/note.jpg) | 我们在这里的大部分时间将讨论 Linux 工具，但微软的安全配置框架对于 Windows 上的企业安全来说是一个非常有用的指南。该框架鼓励你对设备的安全需求进行评估，并将它们与一个或五个安全配置（或“级别”）关联起来。请参\
  \ [`docs.microsoft.com/en-us/windows/security/threat-protection/windows-security-configuration-framework/windows-security-configuration-framework`](https://docs.microsoft.com/en-us/windows/security/threat-protection/windows-security-configuration-framework/windows-security-configuration-framework)。\
  \ |\n\n### 配置强制性访问控制\n\n现代操作系统上存在的所有事物都有明确定义的状态。\n\n* 用户账户与单个个人关联，该个人在受到身份验证时可以提供正确的身份验证信息。\n\
  * 运行中的进程与一个特定的用户账户或组关联，而不属于其他任何组。\n* 对象——如文件、目录或网络端口——可以根据拥有（或 `launched`）该进程的用户或组所关联的权限，供运行中的进程访问。\n\
  \n因此，如果你启动一个进程来（例如）创建、编辑和保存一个新的文本文件，只有在涉及对适当对象的访问时，系统才会允许该进程成功完成。在这种情况下，这意味着你正尝试在你的用户账户拥有权限的文件文件系统目录中创建文件。\n\
  \n此类系统的一个例子是 Linux 如何为 `users`、`groups` 和 `others` 分配权限，以控制他们读取、写入和执行对象的能力。这种系统被称为裁量性访问控制（DAC）。之所以被称为“裁量性”，是因为某些用户可以选择调用管理权限，并根据其账户执行超出其账户给定正常范围的操作。\n\
  \n然而，在许多场景下，DAC 控制并不足够安全。对于此类情况，有可以执行更严格策略的系统，被称为强制性访问控制（MACs）。多用户系统上的 MAC 策略通常由单一中央管理员设置，其目的是让即使是具有某些管理权限的用户（如\
  \ Linux 上的 `sudo` 用户）也难以或无法覆盖。\n\nMAC 的一种常见实现是安全增强 Linux（SELinux），它广泛用于 Red Hat\
  \ Enterprise Linux 相关的发行版中。SELinux 策略可以在内核级别使用，保护最脆弱的资源免受未经授权的访问和使用。\n\n需要注意的是，在启用\
  \ SELinux 的系统上，误报可能是常见的。用户可能尝试安装一个新的软件包，然后发现默认的 SELinux 规则正在产生阻碍。对 SELinux 配置中固有的复杂性感到沮丧，具有顶级管理员权限的用户通常会直接禁用\
  \ SELinux，向自己承诺“晚些时候会搞定一切并重启它”。值得记住，“晚些时候”可能永远不会到来，你的系统将无限处于易受状态。只是随口一说。\n\n其他重要的\
  \ MAC 系统包括 Ubuntu 的 Apparmor——根据声誉，它比 SELinux 要易用得多。\n\n### 设置使用配额\n\n无论 PC 内存和计算能力增长有多快，海量存储变得有多便宜，可用量总会有限制。因此，偶尔，在你计算机上并发运行的许多进程可能会争夺某项或其他资源的访问权限。有时会是一个不法的进程——例如未经授权的加密货币挖掘操作——试图独占所有好处。为了防止你的系统被恶意进程淹没和瘫痪，对特定用户或进程可以请求的特定资源数量设置限制（或配额）是明智的。\n\
  \nLinux 使用 `quota` 工具来控制每个用户或组可以使用的磁盘空间。更现代的 `control groups`（通常称为 `cgroups`）可以对进程消耗的内存、CPU\
  \ 利用率和磁盘 I/O 吞吐量应用限制。\n\n云平台也提供了限制用量的工具。事实上，大多数 AWS 服务都有内置的默认限制，限制任何一个账户可以消耗的量。\n\
  \n## 总结\n\n仔细考虑你如何使用移动设备和智能数字助手，确保你的数据和身份面临的风险没有超出你能承受的范围。\n\n智能地将你的网络分成更小的部分可以减少你的风险暴露。\n\
  \n虚拟化工具如 VirtualBox 和 Docker 容器非常适合创建干净且隔离的环境来运行更安全的负载。\n\n用户消耗资源的方式可以通过 Quota 和\
  \ `cgroups` 等工具进行限制。这些限制可以防止恶意和未经授权的进程主导并最终破坏整个系统的完整性。\n\n## 回到基础\n\n理解你如何使用网络隔离来保护价值的基础的基础资源。防火墙和其他网络配置工具可以用于划分你的资源，降低易感设备的风险暴露。\n\
  \n熟悉可以改进基础设施安全的常见网络架构。多层网络设计可以提供显著保护。此类设计包括 DMZ（军事化区）、堡垒机和根据用途划分的网络（开发/测试/生产环境）。\n\
  \n理解构建干净且隔离的“沙箱”环境如何提供更安全的操作。与测试或学习新技术相关的操作风险可以通过为你的早期开发练习划分隔离环境来大大降低。\n\n## 复习题\n\
  \n你可以在附录中找到答案。\n\n\n\n\n\n### 1. 什么是资源隔离？\n1. 严密监控基础设施活动并按资源拆分日志输出\n2. 控制基础设施元素之间的访问，以限制攻击造成的损害范围\n\
  3. 在多个物理站点部署资源以增加高可用性\n4. 仅部署尽可能少的资源，以减少您的受攻击面\n\n## 2. 哪些网络设计模型主要用于增加私有网络资源的安全性？（选择两个）\n\
  1. DMZ（非军事化区）\n2. 多可用区 (AZ)\n3. 生产/分阶段测试/开发网络\n4. 堡垒机 (Bastion host)\n\n### 3. 哪些工具可以实现网络段及其托管的资源相互隔离？（选择两个）\n\
  1. 虚拟网络环境（如 AWS 上的虚拟私有云）\n2. 防火墙设备\n3. 自动扩展软件\n4. 故障转移路由规则\n\n## 4. 哪项最能解释计算术语 `sandboxing`（沙箱）的来源？\n\
  1. 沙承诺了一个愉快的体验——这在计算环境中是可以实现的。\n2. 任何“箱（box）”都旨在可靠地容多个名义上相关的对象。\n3. 计算机电路通常构建在硅基（沙基）表面上。\n\
  4. 传统的沙箱是一个安全且洁净的游戏区域，儿童可以在那里学习新技能——这也是应用程序开发环境所追求的目标。\n\n## 5. 哪些技术最适合快速配置清洁且隔离的沙箱计算环境？（选择两个）\n\
  1. 云计算实例\n2. Docker\n3. LXD\n4. VMware vSphere\n\n### 6. 沙箱环境对数字取证分析有什么价值？（选择两个）\n\
  1. 沙箱化使得在分析环境中排除意外软件安装或配置的存在成为可能。\n2. 沙箱化更容易防止任何感染目标系统的恶意软件扩散。\n3. 沙箱化使得进行更快速、更高效的分析成为可能。\n\
  4. 沙箱化便于对独立但可比的系统进行性能测试。\n\n## 7. 在构建计算隔离环境的范围内，以下哪些特性是容器优于虚拟机（hypervisor）技术的优点？\n\
  1. 优越的技术支持\n2. 快速配置、启动和高性能\n3. 原生图形界面的可用性\n4. 增加应用程序的持久性\n\n### 8. 部署“空隙隔离（air-gapped）”服务器的主要价值是什么？\n\
  1. 提供了最优的无线网络连接。\n2. 提供了最优的有线（以太网）网络连接。\n3. 确保了最优的资源隔离。\n4. 空隙隔离服务器用于对多个环境进行安全受控的网络访问。\n\
  \n### 9. 哪项最能定义自主访问控制（DAC）系统的工作方式？\n1. 访问控制是绝对的，不允许任何例外。\n2. 访问控制是灵活的，可以被任何经过身份验证的用户覆盖。\n\
  3. 访问控制是灵活的，只能被管理员用户覆盖。\n4. 访问控制取决于上下文，且有时可以被身份验证的用户覆盖。\n\n## 10. 以下哪些可以被视为强制性访问控制（MAC）系统？（选择两个）\n\
  1. SELinux\n2. 网络访问控制列表 (ACLs)\n3. Apparmor\n4. 防火墙路由规则\n\n## 11. 防止通过受损的用户账户运行加密挖矿操作的最简单且有效的方法是什么？\n\
  1. SELinux\n2. ACLs\n3. 使用配额 (Usage quotas)\n4. 容器\n\n# 录\n\n## 复习题答案\n\n### 第 1\
