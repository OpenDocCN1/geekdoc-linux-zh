  \n# 介绍\n\n从一开始，我想明确说明这本书到底是什么，以及它不是什么。《Linux 安全基础》（Linux Security Fundamentals）*是*是一本针对\
  \ Linux 管理员的安全最佳实践指南。然而，它*并不是*关于在 Linux 环境中部署安全负载的全面指南。\n\n因此，不要期望会有大量关于复杂管理任务的细化演示。我们甚至不会涵盖\
  \ Linux 命令行的核心基础。我假设你已经掌握了所有这些内容。这不是一本非常*技术性*的书籍。事实上，可能有一一两个章节甚至没有特别提到 Linux。\n\n\
  我们不会讨论（例如）控制 `cgroups` 的详细配置设置，或建立有效且无懈可击的 `Nagios` 服务器——尽管它们非常重要。对于这类细节，你可以查阅 Chris\
  \ Negus 的《Linux 圣经》（Linux Bible）——或者我与 Chris 合作编写的《Ubuntu 圣经》（Ubuntu Bible）。\n\n\
  相反，这本书将快速提供每个管理员都应该知道（但通常不知道）的宏观安全知识。这里的诀窍在于，所有这些知识都将在 Linux 语境下交付。例如，除了宏观内容之外，你还可以预期学习如何安装\
  \ `OpenVAS` 漏洞扫描器、使用 `iptables` 构建防火墙，或者构建自定义的 `Wireguard` VPN。但不要期望在每一章中都能发现这类技术细节。\n\
  \n为什么这样的书是必要的？\n\n\n\n\n\n当我们把手机、笔记本电脑和服务器连接到互联网的那一刻，我们就已经生活在一个非常危险的社区了。没有任何一种“设置好就可以置不用管”的方案能可靠地挡住所有迫在眉睫的威胁。你能够保护自己和数字资源的唯一方法，就是理解可能影响你基础设施的漏洞类型，以及通过智能管理来最大限度地预防和缓解损害的方法。但不仅如此，由于\
  \ IT 威胁形势的变化非常快，你还需要学习如何持续监控你的基础设施，并跟上技术领域的发展。\n\n无论你是一个专业的 `Linux` 运维员、开发者、数据工程师，还是仅仅是一个普通的技术消费者，只要你能够理解并应用安全最佳实践，你所做的一切都将变得更安全、更高效。考虑到\
  \ `Linux` 已经主导了 Web 应用、DevOps、物联网和移动连接行业，在 `Linux` 上做好安全工作比以往任何时候都更至关重要。\n\n本书的每一章都包含了复习题，以彻底测试你对所见服务的理解程度。这些问题旨在帮助你更好地理解和记忆内容。虽然问题的难度水平会有不同，但它们都针对真实的数字世界。一旦你完成一章的评估，请参阅附录获取正确答案和详细解释。\n\
  \n## 本书涵盖了什么？\n\n本书涵盖了你准备 Security Essentials 认证考试所需的知识点。\n\n- **第 1 章：负责任地使用数字资源**\
  \ 在这一章中，你将学习保护与你互动的人的数字权利和隐私，包括你的员工和你服务的用户。\n- **第 2 章：什么是漏洞和威胁？** 在这里你将发现针对你基础设施的许多类威胁的范围，包括数字间谍活动、凭据窃取和恶意软件。\n\
  - **第 3 章：控制对资产的访问** 你对抗坏人的防线是你财产的外边缘。因此，学习管理对资源的物理和网络访问是一件大事。\n- **第 4 章：控制网络连接**\
  \ 在有效审计和保护你的网络之前，你需要了解 `IP/TCP` 网络实际上是如何工作的。这一章将向你介绍通用网络管理和网络安全基础。\n- **第 5 章：对静态数据进行加密**\
  \ 我能说什么呢？让窥视者无法看到你的重要数据存储是安全的关键组成。学习为什么、如何以及在哪里这样做。\n- **第 6 章：对传输中的数据进行加密** 在这一章中，你将学习网站和电子邮件加密，以及虚拟专用网络\
  \ (`VPNs`）的维护与管理。\n- **第 7 章：风险评估** 在基础设施遭受攻击之前，你永远不知道它有多安全。现在，你更希望谁来发起第一次攻击？这将是你更愿意通过漏洞扫描器和渗透测试员自己完成的事情。\n\
  - **第 8 章：配置系统备份和监控** 尽管你付出了所有努力，你会在某些时候丢失重要数据。如果你做了妥当的备份，那么你就稳了。你越早发现坏事的发生，你的歌唱得就越开心。\n\
  - **第 9 章：资源隔离设计模式** 章节将讨论一些重要的安全设计工具，例如防火墙、沙箱和 `OS` 访问控制软件。\n\n## 交互在线学习环境和题库\n\
  \n我们整合了一些非常棒的在线工具，帮助你更好地吸收你将学习的内容。在线部分包括以下内容：\n\n**问题** 本书全程提供了许多复习题，并作为题库的一部分包含在网上。我们还提供了一个在线模拟考试。使用这些工具测试你对\
  \ `Linux` 安全的知识。在线题库可以在多个设备上运行。\n\n**闪卡** 在线题库包含 100 张专门编写的用于测试你知识的闪卡。问题以数字闪卡格式提供（一个问题后跟一个唯一的正确答案）。你可以使用闪卡来强化你的学习。\n\
  \n| ![note](img/note.jpg) | 访问 [www.wiley.com/go/sybextestprep](http://www.wiley.com/go/sybextestprep)\
  \ 注册，并在激活后获得带有学习工具的交互式在线学习环境和题库一年免费访问权限。 |\n\n### 第 1 章：负责任地使用数字资源\n\n![image](img/clogo.jpg)\
  \ “能力越大，责任越大。”\n\n智慧之言。这是管理员在第一次登录许多 `Linux` 发行版时显示的信息。是谁先说这些话的？亚里士多德？康德？不。是蜘蛛侠的叔叔。但嘿，接受来自任何来源的真相。\n\
  \n虽然我们会在书后详细讨论如何保护自己免受攻击，但这一章完全关于责任。这关乎你作为计算机技术 `消费者` 和计算机技术 `管理员` 的责任。确保你在网上或使用设备时做的任何事情都不会对任何人的资产造成损害是你的职责。\n\
  \n这一切与信息技术（IT）世界特别是 IT 安全有什么关系？计算机会放大你的优势。无论你能记住多少、计算有多快，或者你能影响多少人的生活，都无法比你使用计算设备和网络所做的范围。因此，鉴于数字技术内在的力量以及这种力量可能释放的混乱，在你利用它行善之前，你`需要`了解可能会如何出错。\n\
  \n本章的其余部分将探索考虑你的行为如何影响人的个人权利和隐私的重要性，以及你如何确保并评估在线信息的真实性。\n\n我不是律师，这本书也不自称提供法律建议，因此我们不会讨论一些个人权利与技术驱动事件冲突的晦涩之处。相反，我们将保持简单。人们应该能够处理自己的事务并享受彼此的互动，而不必担心遭受身体、财务或情感伤害。而你应该准备好采取一切必要的措施来避免或防止此类伤害。\n\
  \n###保护个人权利\n\n如今，对个人健康最大的技术威胁可能存在于某个社交媒体平台上。`Facebook`、`Twitter`、`LinkedIn` 和其他在线网站为任何人提供了与数百万甚至数十亿其他用户通信的机会。这使得建立整个业务或社会倡导运动成为可能，这在几年前是不可想象的。但正如我们现在所知道的，它也让传播危险的诈骗、政治恶剧和社会冲突成为可能。\n\
  \n\n\n\n\n正如那句话所说，“权力越大，责任越大。”因此，你需要意识到你所从事的任何互动都可能产生的影响。这不仅适用于你使用自己的社交媒体或电子邮件/即时消息账户，也适用于你管理的任何网站或平台上发生的任何互动。例如，你可能需要在你博客上留下的匿名评论或对你所属组织的电子邮件账户的使用承担法律责任。这是一个很难达到的平衡。你的政策是否在不必要的情况下允许了破坏性内容的发布，或者相反，不公平地限制了无害的内容？\n\
  \n在这些领域保持客观视角的一个非常有帮助的工具是应用“祖母测试”（`grandmother test`）。那是什么呢？在任何在线论坛发布消息或评论之前，花几分钟再仔细读一两遍，然后问自己：“我的两个祖母都会批准我写的内容吗？有什么什么会让她们感到不舒服吗？”换句话说，问问自己是否有人会因为你即将发布的内容而合理地感到受到威胁或欺凌。底线是充分利用常识和善意。\n\
  \n由于对此类细节的典型关注，社交媒体社区想出了新名称来描述每种最恶劣的网络威胁。不幸的是，你应该熟悉其中的每一个。\n\n### 网络跟踪 (Cyberstalking)\n\
  跟踪并不局限于在线活动，但这并没有让它变得不那么可怕。总来说，跟踪者会持续跟踪和观察目标，通常目的是强迫对方产生不希望的反应。在网络世界中，`cyberstalking`\
  \ 可以包括对目标的在线账户和活动进行电子监控。骚扰性的网络跟踪可能会升级到不仅仅是监控，还包括威胁、诽谤和身份盗窃。\n\n### 网络暴凌 (Cybermobbing)\n\
  网络暴凌涉及大群体聚集在一起参与欺凌行为。许多社交平台的性质——特别是匿名账户的普及以及用户之间相互连接的便利性——本身就导致了群体暴民的形成。通常，只需要一个表达不受欢迎场的公共帖子，就能动用成千上万用户的力量，其目标是让帖者的生活变得痛苦。\n\
  \n### 人肉搜寻 (Doxxing)\n无论你是使用真实姓名还是匿名身份向网络世界展示自己，你绝对都不希望自己的完整个人资料公开。考虑到互联网上已经存在的所有数据，对于有空闲的人来说，追踪你的物理地址和私人电话号码通常并不困难。但为了给目标带来伤害而将此类信息轻松地发布在热门社交媒体网站上是错误的——在某些司法管辖区，这也是犯罪。公开人肉搜寻的受害者经历过相对轻微的骚扰，比如半夜收到披萨外。但这种做法也被证明是致命的：它被用作“特警”（swatting）攻击的一部分，人们拨打受害者当地警察局电话，谎称受害者地址正在发生暴力犯罪。多一人肉搜寻者因为这种看起来像精明恶作剧的行为而入狱。\n\
  \n## 保护数字隐私\n\n你首要关注的必须始终确保你所控制的数据安全。但你是否想过为什么呢？如果你的数据副本被盗，最坏的情况会怎样？毕竟，你还有原始数据，对吧？好吧，如果你的组织是靠从创新和复杂的、难以复制的技术栈中获利的，那么数据泄露的后果是显而易见的。但即使你的数据只包含私人和个人信息，也会出现很多问题。\n\
  \n让我们通过提问几个问题来探索所有这些。\n\n### 什么是个人数据？\n\n你的个人数据是任何与你的健康、就业、银行活动、亲密关系以及与政府机构互动相关的信息。在大多数情况下，你应该有法律权利预期此类信息在没有你许可的情况下，任何人无法访问。\n\
  \n但“个人数据”也可以是任何你贡献的、并合理预期它将保持私密的内容。这可能包括电子邮件和消息的交换，或者电话对话的录音和转录。它还应该包括保存在计算设备使用的存储设备中的数据——例如你的浏览器搜索历史。\n\
  \n政府以国家利益关切为由，将保留其安全和执法机构在法律要求的情况下强制访问你个人数据的权利。诚然，不同的政府将根据其自身的标准设定定义“法律要求”的情况。当你有异议时，某些司法管辖区允许法律上诉。\n\
  \n### 我的个人数据可能躲在哪里？\n\n对这个问题的简短回答是“很可能在很多你不会批准的地方”。长回答将以类似于“我可以告诉你，但要做好变得并保持深度压力和焦虑的准备”之的话开头。换句话说，情况不会很好看。但既然你问了，这里有一些需要考虑的事。\n\
  \n#### 浏览历史\n你在浏览器中访问的网站的数字历史可以采取多种形式。你的浏览器可以维护你打开的所有页面的 `URLs` 日志。你的浏览器缓存将持有来自这些网站的一些实际页面元素（如图像）和\
  \ `state` 信息。像 `Google` 这样的在线服务将拥有你历史自己的记录，既作为他们整合你各种在线活动的方式，也是通过可能安装在所访问网站代码中的网站使用分析器功能而实现的。\n\
  \n其中一些数据将是匿名化的，使得无法与任何单一用户关联，而另一些根据设计是可追踪的。第三类数据本意是匿名化的，但在实践中可以被第三方解码并追溯到你身上。在正确的（或错误的）情况下，任何此类数据都可能被犯罪分子获取并用于对不利你的利益。\n\
  \n#### 电子商务和社交媒体账户数据\n你在在线平台上做过的每件事——你发布的每一条评论、你输入的每一个密码、你进行的每笔交易——都会被写入数据库，并在某个点用于你未预料的用途。即使过去留有疑疑问的空间，我们现在也绝对确信，拥有海量数据存储的公司总会寻找利用这些数据来赚钱的方法。在许多情况下，这完全没有任何面面或非法行为。例如，无法否认\
  \ `Google` 利用了其大部分数据为我们提供了极大地改善我们生活和生产力的大部分免费服务。\n\n但我们的数据使用方式也有令人担忧的方面。除了你的社交媒体或在线服务提供商有一天可能会变黑化并滥用对你数据的访问权限之外，许多公司——也许最出盛名的\
  \ Facebook——已向外部公司出售了可识别的用户数据。更普遍的场景是从保护不足的服务器上直接盗取私人用户数据。这在过去几年里已经在无数公司身上发生过。无论如何，你几乎无力追踪、更不用说去控制你的私人数据可能正在经历的精彩冒险，以及它们在一年、五年或十年后可能到达哪些其他奇特的目的地。\n\
  \n#### 政府数据库\n\n\n\n\n\n国家和地区政府机构也控制着海量数据，涵盖了公民行为的许多层面。我们当然希望这些机构能够遵守其管理个人数据使用的法律，但你永远无法确定政府持有的数据绝不会被窃取——或者与不受相同标准的外国机构共享。违规的政府机构或个人员工滥用对你及你的数据应承担的义务也非罕见。\n\
  \n## 公共档案馆\n\n互联网从不遗忘。想一下你十年前随手凑出来的那个网站，当时是为了表达对你最喜欢的电影的永恒忠诚……等等，它叫什么名字来着？一年后，当你意识到那一切看起来有多愚蠢时，你把整个网站删掉了。现在没什么好好意思的，对吧？唯一的例外是，你的网站内容很有可能正由互联网档案馆（Internet\
  \ Archive）在其 Wayback Machine ([`archive.org/web/web.php`](https://archive.org/web/web.php))\
  \ 上存储并公开显示。此外，你在 Facebook 或 LinkedIn 等社交网站上创建的个人资料，在删除很久后仍以某种形式存在，这并不不寻常。\n\n##\
  \ 暗网\n\n正如我们在第 6 章“加密你的移动数据”中所学到的，信息可以通过一种被称为 `virtual private network`（VPN）的特殊加密连接进行安全且匿名的传输。VPN\
  \ 是在跨越公共不安全网络进行通信而不泄露你身份信息的工具。这是一项强大的安全工具。但让 VPN 安全的相同特性，也让它们在迷雾重罩的互联网犯罪地下世界中具有巨大的价值。\n\
  \n描述你可以进行不可追踪活动场所流行方式是使用 `dark web`（暗网）一词。暗网由内容组成，按照规定，这些内容无法通过主流互联网搜索引擎找到，只能通过使用特殊网络设置的工具访问。发生这一切的所有私有或隐藏网络统称为\
  \ `darknet`（暗网）。访问这些内容的工具包括 Tor 匿名网络，它使用由成千上万参与者提供并维护的连接。Tor 用户通常可以模糊自己在互联网上的活动，使其操作实现有效的匿名。像\
  \ VPN 一样，暗网经常被用于隐藏犯罪活动，但在寻求规避检测的政治异人士团体以及与举报人通信的记者之间也很流行。\n\n从服务器和私有设备中窃取的大量数据最终流向了暗网。\n\
  \n### 作为网站管理员，我的责任是什么？\n\n除了保护你的用户和组织免受伤害的道德义务外，你可能还需要确保你的基础设施配置符合法律和监管要求。一组特别突出的法律是欧盟的《通用数据保护条例》（GDPR）。GDPR\
  \ 影响任何处理发送至欧盟（EU）或发自欧盟的数据的机构。未能妥善保护通过欧盟领土的受保护数据的隐私和安全，可能会导致巨额——甚至是毁灭性的罚款。\n\n根据你的组织运营的地点和方式，其他可能需要你合规的监管系统还包括由主要国际信用卡公司管理的《支付卡行业数据安全标准》（PCI-DSS），以及美国政府的健康保险可携带性与责任法案（HIPAA）。\n\
  \n### 逃掉的神精能被强制送回瓶子里吗？\n\n嗯，让我问你这个问题：*你*曾经成功地将一个神精送回瓶子里吗？我想是的。遗憾的是，尝试寻找并删除已在未知数量网站（包括暗网上的某些网站）传播的所有被窃取数据的副本可能同样不切实际。\n\
  \n即使是从搜索引擎结果中移除私人引用，也可能涉及一场漫长而艰难的斗争，且无法保证成功。得益于 GDPR，欧洲居民可以使用“个人信息删除请求表”向 Google\
  \ 寻求帮助。但你永远不知道结果会如何，有时提交请求可能会让情况变得糟糕。考虑关掉一个违规网站吗？你确定自己知道如何找到所有副本吗？例如，你是否意识到互联网档案馆项目\
  \ ([`archive.org/web/`](https://archive.org/web/)) 截至本文写作时，托管了超过 3,760 亿个网页的历史版本？我实际上使用过该项目从我自己网站\
  \ 15 年前的迭代版本中恢复了丢失的数据。\n\n### 作为用户，我可以做什么？\n\n这是一个很好的开始点：在在线平台上发布任何内容之前深思熟虑。你是否泄露了太多关于自己的信息？你会让你未来的雇主和孙辈在\
  \ 10 或 20 年后阅读这些内容感到舒服吗？尝试预测你的内容可能流向何处，以及它对你从未见过的人会有什么价值——那些不受伦理顾虑限制、只关心赚钱的人。\n\n\
  对你的数据保持现实。不要假设与你分享文件和信息的联系人是唯一看到这些内容的人。即使你自己的账户保持安全，他们的账户可能不会。而且谁说那些朋友或同事会永远尊重你的隐私偏好呢？\n\
  \n永远不要假设你所依赖的文件存储或共享平台在未来的某个时刻不会改变其隐私规则——或者更好，不要假设它永远不会决定将你的数据卖给别人。\n\n最后，这里有一条非常有道理且显而易见的事。但我不仅确定你从未做过这件事，我还确信你可能永远不会这样做。记得那些你在打开新在线账户前必须勾选的复选框吗？就是那些写着类似这样的话：\n\
  \n“我已阅读并接受隐私政策条款。”\n\n嗯，你在点击之前真的完整读过这些文档之一吗？我也没有。我的意思是，Google 的《隐私与条款》文档 ([`policies.google.com/privacy?hl=en`](https://policies.google.com/privacy?hl=en))\
  \ 长度和本章差不多（而且没意思得多）。谁有时间呢？另一方面，从头到尾阅读可能会让你对使用 Google 服务产生重要的见解。它甚至可能说服你改变使用产品的方式。\n\
  \n但我们都知道这不会发生，对吧？\n\n## 建立真实性\n\n你对区分数字生活中真假与虚假有强烈且活跃的兴趣。考虑到网络上有这么多不可靠的内容，要做出这种区分可能并不简单。你对金钱、财产和态度的许多选择在很大程度上取决于你在网上遇到的信息，而你显然不想做出错误的选择。所以在这里我们将讨论测试和验证内容以避免受害的方法。\n\
  \n### 考虑来源\n\n始终仔细考虑你想要使用的信息的来源。要意识到企业（无论合法与否）经常会在网页上填充旨在引导读者进行某种交易的内容。\n\n\n\n\n\
  \n考虑到这一点，我建议你更有可能从知名政府机构网站获取准确且有用的健康信息，例如英国卫生和社会保健部网站，或学术医疗提供机构（如梅奥医学中心 [[`www.mayoclinic.org/`](https://www.mayoclinic.org/)]），而不是一个名为\
  \ CheapCureZone.com(http://CheapCureZone.com) 的网站（这是一个虚构的名字，但代表了数百个真实网站）。\n\n同样，你应该考虑你所消费信息的背景。它是来自你认识的人发的邮件吗？你预收到这封邮件了吗？你是根据另一个网站的链接进入某个特定网页的吗？你信任那个网站吗？\n\
  \n顺便说一下，我个人认为维基百科是一个基本准确且可靠的信息网站，通常包含指向源材料的有用链接。偏见或完全错误的信息有时会出现在页面上，但这种情况很少见；而且在大多数情况下，问题的页面会包含警告，指示当前状态的内容正处于争议中。如果你发现了错误怎么办？自己修复它们。\n\
  \n### 注意常见的威胁类别\n\n垃圾邮件——发送到你的电子邮箱地址或手机的未经许可信息——是一个大问题。除了每天传输的数十亿垃圾邮件消耗了大量的网络带宽外，它们还携带了数千种危险的恶意软件，并纯浪费我们的时间。\n\
  \n防止垃圾邮件的第一道防线是确保你的电子邮件服务的垃圾邮件过滤器已激活。下一步是：让自己了解垃圾邮件发送者如何利用社会工程作为其策略的一部分。\n\n身份欺骗（Spoofing）涉及误导发送者地址和身份的电子邮件信息。你可能不会回复来自\
  \ suspiciousguy@darkw3b.com(mailto://suspiciousguy@darkw3b.com) 的邮件，但如果他伪装成 b.gates@microsoft.com(mailto://b.gates@microsoft.com)，你可能会重新考虑。至少，要意识到电子邮件和网络地址是可以被伪造的。使用域名密钥识别邮件\
  \ (DKIM) 来确认每封邮件真实来源的组织，在反身份欺骗方面是有效的。\n\n钓鱼攻击通常与伪造邮件一起打包出现，涉及犯罪分子声称代表银行等合法机构。钓鱼邮件可能包含一个指向网站的链接，该网站看起来属于你的银行，但实际上并非如此。当你输入登录凭据时，这些凭据会被网站后端捕获，然后使用你的身份通过验证进入真实的银行或服务网站。我不需要告诉你那会导致什么样的结果。\n\
  \n在点击之前——或至少在提供身份详情之前——务必仔细阅读你遵循的实际网页地址。拼写很重要：gmall.com(http://gmall.com) 与 gmail.com(http://gmail.com)\
  \ 不同。考虑为你的所有账户登录使用多因素身份验证 (MFA)。这样，除了保护你的密码不被未经授权使用外，理想情况下，你应该在没有被要求进行次要身份验证方法时察觉并退出。\n\
  \n通常情况下，对绝望的帮助请求和未经请求的入职机会要保持深度的怀疑。诈骗者经常假装成在旅行途中遇到麻烦并需要快速电汇转账的亲戚或密友。工作机会有时可能掩盖访问你银行账户的尝试，或者开具针对合法企业的虚假支票。\n\
  \n外面的世界是恶劣且危险的。深思。提问。寻求第二意见。永远记住这条明智的规则：“如果一件事好得令人难以，那么它可能不是。”并记住，尼日利亚前国防部长的遗孀并不希望你在你的银行账户里为她代存\
  \ 3400 万美元。真的。\n\n## 总结\n\n你对使用你的账户或由你管理的账户进行的数字交互和操作负责。你应该努力防止任何此类活动造成的伤害。\n\n\
  了解犯罪分子（以及疏忽的管理员）如何能让你的数据面临风险，对于学习如何保护你自己以及你负责的用户至关重要。\n\n在进行在线活动之前，始终尝试思考可能的短期和长期后果。你正要做的事情可能会对你或他人造成伤害吗？\n\
  \n阅读与你使用的平台和服务相关的隐私政策文档，可以帮助你理解你将使用的威胁环境。\n\n始终检查在线信息的背景：它是可靠网站的一部分吗，还是与知名机构相关？\n\
  \n在互联网上生活时，要注意你可能面临的威胁类型。只有通过了解可能会发生什么错误，你才能够保护你自己和依赖你的人。\n\n## 回归基础\n\n**理解常见的在线攻击行为，包括网络跟踪、网络暴民和人肉搜（doxxing）。**\
  \ 网络跟踪涉及以以威胁性的方式持续追踪个人的在线身份和私下身份。网络暴民是指大量在线社交媒体账户所有者合作骚扰一个与他们意见不合的个人。人肉搜者会研究并公开他们想要伤害的个人的私有信息。\n\
  \n**理解最敏感和最易被滥用的个人数据类型。** 你的浏览器历史、社交媒体账户活动、在线电子商务交易信息和健康记录都是需要特别关注和保护的个人数据类别。\n\n\
  **理解你和你的基础设施负责的合规性要求。** 在欧盟运营的企业必须符合《通用数据保护条例》(GDPR) 的政策。支付卡行业数据安全标准 (PCI-DSS) 以及美国《健康保险流动性与责任法》(HIPAA)\
  \ 也是重要的标准。\n\n**熟悉常见的数字“社会工程学”攻击。** 垃圾邮件描述了为了让你回复而发送的未经许可邮件，通常价值不明。身份欺骗误导了邮件的来源和发送者。钓鱼攻击试图让你与看起来像真实合法网站的网络资源交互。\n\
  \n## 复习题\n\n答案可以在附录中找到。\n\n1. 什么什么描述了人肉搜 (doxxing)？\n   1. 非法地引导执法部门处理不存在的案件\n \
  \  2. 未经授权的情况下公开个人的联系方式和位置信息\n   3. 以威胁性的方式持续骚扰个人\n   4. 大量在线社交媒体账户所有者合作骚扰个人\n\n\
  2. 什么描述了网络暴民 (cybermobbing)？\n   1. 未经授权的情况下公开个人的联系方式和位置信息\n   2. 非法地引导执法部门处理不存在的案件\n\
  \   3. 大量在线社交媒体账户所有者合作骚扰个人\n   4. 以威胁性的方式持续骚扰个人\n\n3. 作为雇主，以下哪些最可能让你和你的组织承担法律责任？（选择两个）\n\
  \   1. 员工在你组织网站上发布的威胁性评论\n   2. 员工在自己的社交媒体账户上发布的威胁性评论\n   3. 员工使用公共资源发起的网络犯罪\n \
  \  4. 员工使用你组织网站资源（如技术支持论坛）发起的网络犯罪\n\n4. 以下哪些类型的数据通常应被视为个人和隐私数据？（选择两个）\n\n\n\n\n\n\
  1.  用户个人计算机上的浏览器历史记录\n2.  旧的社交媒体帖子\n3.  消费者在在线商店的购买历史\n4.  刑事审判诉讼的官方记录\n5.  你的“浏览器历史记录”中可能包含哪些元素？（选择两项。）\n\
  \    1.  近期短信对话的转字稿\n    2.  你用于在线应用程序身份验证时使用的密码\n    3.  关于你的计算机和软件配置的信息\n    4.\
  \  关于过去某个网站会话状态的信息\n6.  为什么你应该对在线服务和应用程序所有者可能控制的任何个人数据保持警惕和关注？（选择两项。）\n    1.  因为你可能被阻止自行访问此类信息\n\
  \    2.  因为信息可能会被第三方窃取，并挖掘出对你造成不利的信息\n    3.  因为信息可能会被卖给第三方，或被服务本身以侵犯你权利的方式使用\n\
  \    4.  因为你的信息可能会变化，而更新远程数据库可能耗费时间且不方便\n7.  哪项最能描述《通用数据保护条例》(GDPR)？\n    1.  它规定，一旦组织不再需要保留财务和健康数据，必须立即销毁。\n\
  \    2.  它规定，一旦组织不再需要保留与欧盟相关的记录，必须立即销毁。\n    3.  它规定，一旦组织不再需要保留其医疗保健数据，必须立即销毁。\n\
  \    4.  它规定，必须保护与美国相关的隐私和安全。\n8.  以下哪项是（强制性的）行业框架？\n    1.  HIPAA\n    2.  PCI-DSS\n\
  \    3.  GDPR\n    4.  《萨班斯-奥莱法》(SOX)\n9.  为什么你应该关注在线服务和应用程序所有者可能控制的任何个人数据？（选择两项。）\n\
  \    1.  因为你可能被阻止自行访问此类信息\n    2.  因为信息可能会被第三方窃取，并挖掘出对你造成不利的信息\n    3.  因为信息可能会被卖给第三方，或被服务本身以侵犯你权利的方式使用\n\
  4.  因为你的信息可能会变化，而更新远程数据库可能耗费时间且不方便\n10. 哪项最能描述“欺骗攻击 (spoofing)”？\n    1.  使用一个看起来像合法网站的网址来伪造源地址\n\
  \    2.  发送未经请求的电子邮件\n    3.  试图诱导泄露私人信息\n    4.  伪造源地址（origin address）\n11. 哪项最能描述“钓鱼攻击\
  \ (phishing)”？\n    1.  使用一个看起来像合法网站的网址来伪造源地址\n    2.  发送未经请求的电子邮件\n    3.  试图诱导泄露私人信息\n\
  \    4.  伪造源地址（origin address）\n12. 在评估数据的安全性时，你最好考虑哪些因素？（选择两项。）\n    1.  数据的完整性\n\
  \    2.  数据的可用性\n    3.  数据的机密性\n    4.  数据的不可否认性（---）\n\n# 第二章：什么是漏洞和威胁\n\n![image/vulnerabilities.jpg]\
  \ 那么，当我们开始考虑是否要担心那些恶意软件、后门和键盘记录器时，我们在面临什么？泛而言之，本章将定义漏洞和威胁。\n\n### 基础：我们要实现什么？\n\n\
  有时值得问的问题是，什么是安全？事实上，在技术背景下，问题越简单越好。你也可以说，一套良好的安全协议确保了以下四个结果：\n\n*   **机密性 (Confidentiality)**：你负责的敏感数据和用户信息得到保护。\n\
  *   **完整性 (Integrity)**：你预期的数据和服务状态始终保持一致，不受损坏或丢失。\n*   **可用性 (Availability)**：你提供的服务可以根据需要随时使用。\n\
  *   **不可否认性 (Nonrepudiation)**：在 IT 基础设施中执行的任何操作都可以追溯到特定的作者或账户。\n\n在解决这些之后，让我们来看一些更具体的问题。\n\
  \n### 什么是漏洞和威胁？\n\n在我们开始讨论*如何*保护资源之前，我们需要准确了解我们正在面对什么。让我们从定义两个更重要的概念开始：漏洞 (vulnerability)\
  \ 和威胁 (threat)。一个 `vulnerability` 是任何可能导致安全违规的配置错误、疏忽或防御漏洞。漏洞本身，并不意味着意味着大问题，毕竟，即使你把大门开在繁忙的街道旁，只要没有人进来，你是安全的。\n\
  \n但在数字领域，你应该假设任何“敞开的大门”都会被注意到——而且发现得很快。我曾见过一些全新的 `Apache` 服务器在启动后*不到一分钟*，日志文件就报告了入侵尝试。这为我们理解另一个概念——`threat`\
  \ 提供了充分理由。本章还将讨论那些最常见的威胁。\n\n\n\n\n请考虑这一点：默认情况下，你的智能冰箱可能会将自己宣扬为一个网络主机，邀请范围内的任何人来加入这场“清凉”之旅。不信？试着在任何居住区，使用移动设备扫描可用的\
  \ WiFi 网络（例如，使用：`sudo iwlist wlan0 scan`），我敢打赌，你最终会看到至少一个使用家电厂商命名的网络 ID。任何连接到网络的设备都是可能受攻击和被利用的候选对象，一旦攻击者进入网络，将攻击扩大到其他——更有价值的——连接设备只是时间问题。\n\
  \n你的智能电视看你的次数是否比你看它的次数还要多？你知不知道你的移动设备向外传输了多少数据——以及是谁在接收这些数据？你的笔记本电脑摄像头和麦克风是否正被你不知情的情况下运行的进程访问，你是否知道录制了什么，以及这些录像存到了哪里？你的智能灯泡、连接家居门锁和报警器能向世界透露关于你的家庭和个人行为的多少信息？恶意的陌生人对你恒温器的控制权是否和你一样，甚至更多？（这也许可以解释为什么你的地下室在冬天总是那么冷？）\n\
  \n随着物联网（IoT）的增长，廉价的计算功能被嵌入到批量生产的商业和工业产品中，设计阶段的一个配置错误可能会在后期产生灾难性的后果。现在，全球运行的连接设备总数已达到数十亿，潜在的损害几乎没有限制。例如，威胁者已经接管了成千上万个受损设备集群，并利用它们组合的网络和计算资源对无助的第三方目标发动攻击。\n\
  \n这些并不是说更传统的 PC 和企业服务器并不同样容易受到攻击。事实上，它们额外的处理能力和网络连接使其成为更具“油水”的目标，而其操作系统环境的复杂性也意味着它们更有可能包含你错过的漏洞。底线情况是，如果它们含有硅片，它们可能就处于易受攻击的状态。\n\
  \n### 谁在进行攻击？\n\n到底是谁对你的 IT 基础设施威胁最大？嗯，`你以及你组织的团队成员`可能构成了最大的危险。也就是说，如果你忘记备份旧硬盘上的宝贵数据，而该硬盘随后故障了，你就是那个责任人，对吧？你穿过衣服进洗衣时忘在裤口袋里的\
  \ USB 盘也是如此。\n\n如果你想看到一个关于外面对有多少个配置错误的设备的惊人说明，可以看看 `https://shodan.io`。Shodan 是一个可以帮助你找到连接到互联网的服务器和媒体设备的搜索引擎。在\
  \ Shodan 上搜索例如 `webcam`，将返回全球成千上万个连接摄像头的信息和链接。这些结果中的许多将包含让你即时查看直播流的链接。如果摄像头对准主人家门口街道，那并不是世界末日；但如果它被用作婴儿监视器……好吧，我们只能说人们不应该允许对他们私生活中这种私密的视角进行无密码访问。\n\
  \n但除此之外，世界上最危险的数字生物是谁？\n\n*   **政府：** 执法机构可以——通过法律允许或其他手段——针对怀疑违反法律或反对机构议程的个人或组织开展侵入性监视行动。\n\
  *   **军事组织：** 渗透和攻击行动——例如 2010 年首次发现的 USB 携带的 Stuxnet 蠕病毒——通常由国家机构发起，旨在收集情报或禁用敌对实体运行的计算机系统功能。\n\
  *   **公司：** 渗透行业竞争对手的 IT 基础设施可以商业参与者提供有用信息，以及对技术进步的不公平早期访问权。\n*   **政党：** 任何还不知道政治竞选经常访问与其对手相关的敏感信息信息的人，说明他们还没有留心。这种访问通常会涉及非法进入私有和受保护的数据存储系统。\n\
  *   **诈骗者：** 电话和电子邮件诈骗操作通常会试图让你在无意中交出银行密码或计算机系统的登录权限。\n*   **黑客（黑帽）：** 某些个人发现并执行非法进入私有和受保护的数字基础设施（也被称为\
  \ `crackers`）。\n*   **黑客（白帽）：** 某些个人为了基础设施所有者的利益，发现并（有时）执行非法进入私有和受保护的数字基础设施。白帽黑客通常会提醒所有者和利益方漏洞的存在，以便他们避免损失。\n\
  \n### 他们为什么要攻击？\n\n至少对攻击者从其活动中可能获得什么有一个大致了解，可以让你更容易组织防御。“知己知彼”之类的。以下是一些常见的动机。\n\n\
  #### 身份盗用\n\n在一个你可以从家里隐私完成大部分银行业务和购物的世界里，你用于识别身份的凭据在最个人的层面上代表了你。在很大程度上，你选择的用户名和密码变成了“你”，它们的价值上升到等同于你所拥有的一切。\n\
  \n人们为什么想要偷取你的身份？有时是因为他们可以使用该身份清空你的银行账户或声称你的所有物。在其他情况下，持有你的身份可以作为筹码，强迫或勒索你做出符合他人利益的行为。而盗窃为了简单——且具有破坏性的复仇利益也并不常见。对于某些人来说，毁灭受害者的生活就足够充分了。\n\
  \n#### 数据外泄\n\n无论是急于看到你的秘密业务计划的商业竞争对手，还是对评估你的防御能力感兴趣外国军队，或者是想要偷取 Syex 新书未完成手稿的人，如果他们想进去，就必须进入。但仅仅进入是不够的。他们还必须找到一种将找到的信息再次传出去的方法以便攻击者读取。\n\
  \n这个过程被称为 `exfiltration`。你可以完全合理地认为，如果你有值得保护的数据，某人在某会对你尝试外泄。\n\n#### 资源破坏\n\n通过删除某网站服务器上的数据可以造成巨大的破坏。即使他们有应用程序代码和后端数据的备份副本，重新组合所有组件并重新启动服务仍时间。\n\
  \n对于某些生产模式来说，持续几小时的完全停机就可以永久破坏业务。想象一下，如果一家银行网站离线几小时，然后出现并显示客户在至少未来一周内无法访问其账户。你怀疑许多客户不会去其他地方办理银行业务吗？\n\
  \n\n\n\n无论你是负责数百台活动设备的系统管理员，还是仅有一笔记本电脑和智能手机的终端用户，保持你所运行软件的安全并不需要耗费多少精力。但这并不意味着足够的人真的做到了。从攻击的混乱中恢复时，往往会发现问题在于一个非常出意料的根问题列表。\n\
  \n第一个——可能也是最关键的——是存在未打补丁的操作系统和软件包。诚然，Linux 发行版包含了仓库管理工具——例如 `APT`（高级包工具）、`YUM`（修改版黄狗更新器）以及\
  \ `snaps`——这些工具可以被设置为自动为所有活动包安装安全更新。因此，每当新版本可用时，不将软件更新到最新版本将是愚蠢的。理想情况下，此类更新将修复任何最近发现的安全漏洞。不打补丁的代价可能是灾难性的。\n\
  \n也许，从安全的角度来看，运行在消费级 PC 上最重要的单个软件是你的 Web 浏览器。因为它是你连接互联网最常用的工具，它也成为受到最多攻击的目标。因此，确保你已安装的发布版本中包含了最新的补丁，并确保你使用的是最新的发布版本，这一点至关重要。\n\
  \n除了不使用未打补丁的浏览器外，你还应该考虑可能：由于设计的原因，你的浏览器本身可能正在监视你。记住，浏览器知道你在互联网上的每一个地方以及你所的一切。而且，通过使用\
  \ `cookies`（Web 机存储在你计算机上的数据包，以便能够恢复之前的会话状态）等对象，可以维护你活动的完整记录。\n\n请记住，你使用大多数浏览器的权利（以及许多“免费”移动应用）是通过看广告来“支付”的。还要考虑像\
  \ Google 这样的广告商如何通过向你投放你可能购买的产品的广告来获取大部分利润，在某些情况下，通过将你的隐私数据出售给第三方。所以，当你思考你真正希望你的隐私数据如何被使用时，将商业浏览器本身讨论成一种可能的漏洞可能并不离谱。\n\
  \n在我们的“愚蠢软件漏洞大赏”列表中，我们不能不提到那些未能通过密码和屏幕锁保护自己设备的人——尤其是那些一直登录着敏感在线账户的移动设备。或者，同样糟糕的是，那些坚持使用弱密码且易于破解的密码的人。不要试图隐藏，你很清楚自己是谁。\n\
  \n## 硬件漏洞\n\n你的硬件可能会出什么问题？嗯，一方面，所有硬件迟早都会不可避免地故障。但这并不是专门的安全问题。然而，这里有几件事应该引起关注。\n\n\
  例如，你应该保护你的计算设备免受物理攻击。这可能意味着确保机房门锁好，或者设置启动时的基本输入/输出系统 (`BIOS`）或统一扩展固件接口 (`UEFI`）密码。它还可能涉及建立\
  \ `USB` 盘的使用策略（这些优盘可以在不知不觉中被将恶意软件引入系统），或安装监控摄像头以及查看和存档视频流的协议。\n\n## 生物学漏洞\n\n涉及到\
  \ IT 安全时，显而易见的问题是房间里的**人**。如果我们不需要考虑人类干扰，一切可能会运行顺畅得多。但考虑到我们短期内不会消除人类，你应该通过妥当地教育你的用户（以及你自己），让他们在数字基础设施周围采取负责任的行动来此做好准备。\n\
  \n这包括对针对你所在地区或特定行业发起的最新电话和电子邮件诈骗保持关注。这还意味着提高你在公共场合讨论技术使用情况时的意识，特别是通过社交媒体帖子。你永远不知道有谁在关注。一个信息丰富的技术用户是一个安全得多的用户。\n\
  \n接下来，我将向你介绍一些特别严重的威胁类别。\n\n## 数字间谍活动\n\n正如你之前读到的，各种人员和组织可能都在密切关注你，寻找机会获取你拥有的东西。无论是外国政府，还是一个停在你房子前面带着笔记本电脑的家伙，了解他们正在参考的“数字晚餐菜单”上的项目都是好事。\n\
  \n### USB 设备\n\n你是否曾经路过一个遗弃在人行道上的 `USB` 闪盘？它可能是某人的婚礼照片，如果你插上并寻找一些联系信息，你就是在帮他们大忙。但它也可能是一个装有恶意软件的陷阱，正迫不及待地被激活并释放到你的计算机上。\n\
  \n记得 `Stuxnet`（震网病毒）吗？那是利用几个国家安全机构的资源和智慧创建的软件蠕虫，用于物理破坏用于伊朗核计划的离心机。病毒是如何深入到系统的？它显然是通过简单的\
  \ `USB` 闪盘带入的。所以，对在街上发现的东西要保持怀疑态度。\n\n### 后门\n\n`backdoor`（后门）是访问计算设备的未记录（且通常是未经授权的）方法。设备和软件制造商可能出于完全正当的原因包含后门：例如，为支持团队提供一种访问和管理故障服务器的方法。但它们也可以被用来犯罪分子进入，以损害设备所有者的利益。\n\
  \n近年来，许多政府的执法机构引发了争议，要求应用开发人员和设备制造商提供让官方机构绕过加密和其他安全保护的方法。这种想法是，犯罪分子和恐怖分子利用加密来逃避检测，因此赋予政府更大的权力来监控他们具有合法的公共利益。但另一方面，由于错误的人获知它们只是时间问题，后门的存在使得所有计算机和所有软件对所有人来说都变得不安全——包括像你这样诚实守法的公民。\n\
  \n这不是我们中任何人可以独立解决的辩论，但你绝对应该考虑你计划使用的技术可能存在一个或多个安全妥协。\n\n### 无线接入点\n\n时代变了。我们现在生活在一个无线（虚拟化）的世界里。许多年轻的系统管理员永远不会体验在吊花板和墙壁之间拉网线的乐趣。我个人诚实地说，并不怀念它。但所有的无线连接都是代价的：对你来说越方便的东西，对试图攻击你的人来说也越方便。有时攻击涉及对你的设备进行未经授权的登录，有时有人从你的设备中提取数据。但无论如何，你都不希望为无线滥用留下任何余地。以下是一些需要监控的技术：\n\
  \n`WiFi` 本地计算设备网络通常使用 IEEE 802.11 无线标准的变体连接。问题是，在没有通过现代且安全的加密方法保护的 `WiFi` 网络上通信的数据对任何其他网络用户都是可见的。随着时间的推移，这一直是导致重大数据丢失的原因。在连接公共\
  \ `WiFi` 网络之前，你应该格外小心。\n\n\n\n\n\n# 射频识别 (RFID)\n少量数据可以嵌入特殊的标签中，这些标签可以被贴在文档（如护照）、零售产品、工具、动物，甚至人类身上。这项技术（近场通信\
  \ [NFC] 协议的一部分）允许对库存和文档移动进行简单且廉价的追踪，但也可能导致重要和敏感信息的泄露。尽管在加强 RFID 携带数据的隐私性方面正在取得进展，但你应该意识到与它们使用相关的所有问题。\n\
  \n# 蓝牙\n你可能从未亲自用过它们，但我确定你见过有些人耳朵上戴着奇怪的设备四处走动并自言自语。当然，他们正在通过蓝牙无线连接与口袋或包包里的手机通信。虽然这项技术在目前已经成熟，但在历史上一直存在过安全疑虑，即外部人员曾成功让自己加入蓝牙连接中。\n\
  \n# 蜂窝网络\n现在各种海量数据正通过手机使用的无线网络进行传输。目前正在使用的手机蜂窝技术标准有第三代 (3G)、第四代 (4G)以及正在实施中的第五代\
  \ (5G)。你可能永远不应该认为蜂窝连接是完全安全且保密的。特别是，人们一直担心在设计用于大规模监控计划的 5G 网络设备中，可能秘密植入了敌对政府支持的后门。\n\
  \n## 被盗的凭据\n如你所见，你的一切以及你拥有的通常由你登录在线医疗、财务和数据服务时使用的凭据来代表。因此，你一定要保护这些凭据免受泄露和误用。重要的第一步是意识到外面最大的（也是最令人恐惧的）威胁。\n\
  \n### 数据泄露\n你的信用卡和账户信息是否在 2013 年那场臭名昭彰的数据泄露的数百万 Target 零售账户之中？你的 LinkedIn 账户登录凭据呢？是否在\
  \ LinkedIn 2016 年泄露的 1.64 亿用户之中？或者你的账户可能是 2013 年被破解的 30 亿（是的：`billion`）Yahoo 账户之一，或者是\
  \ 2018 年受影响的 5 亿万豪/万华酒店账户之一。担心你的信用评分吗？如果你的账户在 Equifax 2017 年泄露受影响的 1.45 亿账户之中，你绝对应该感到担心。\n\
  \n所有规模的公司都在努力保护用户的私有数据，但这是一段艰巨的旅程。作为某种终端用户，你的工作是尽力保护自己。其中一个重要的步骤是，正如你将在书后部分学到的，永远不要在多个账户之间重复同一个密码。\n\
  \n你的下一个最佳防御是定期检查你的任何账户是否被包含在现实世界的泄露中。做到此点最有效的方法是在 Troy Hunt 的免费网站 [`haveibeenpwned.com`](https://haveibeenpwned.com)\
  \ 注册，以跟踪你的电子邮件地址或密码是否出现在已知泄露中。为什么现在就去那个网站检查一下你的地址和密码状态呢？\n\n### 身份盗窃（泄露之外）\n在很大程度上，重大的数据泄露是你无法控制的：由于某些\
  \ Equifax 管理员没有费力修复服务器上的程序包这并不是你的错。但你确实有很多*可以*做的事来保护你的身份免受泄露。秘诀在于让坏人更难获取你的凭据。我们将在书后部分更详细地讨论这些内容，但你应该了解如何避免它们：\n\
  \n**使用弱密码**：好的密码应该是长长的、复杂的，并且不反映关于你个人生活的任何已知细节（如你的生日）。理想情况下，密码应该由某种多因素身份认证 (MFA)\
  \ 补充。\n\n**网络钓鱼/社会工程攻击**：骗子经常使用电子邮件或电话骗人们泄露身份验证凭据。学习如何识别并避免此类尝试。\n\n**开源情报 (OSINT)\
  \ 泄露**：社交媒体帖子、公司网站甚至职位广告可能会揭示比你想象更多的关于你和你所在组织的信息。审计从公开信息中可以了解到哪些关于你的信息，并学习如何避免产生可能暴露过多信息的信息。\n\
  \n## 恶意软件\n恶意软件（malicious software 的缩写）是指任何旨在损害目标设备或网络功能的软件。恶意软件包可以通过电子邮件附件、通过作为网页部分加载到浏览器中的脚本（通常被称为特洛马，因为就像希腊人围攻特洛伊时送出的木马一样，危险的脚本是作为看似有用网站的一部分传递的），或通过\
  \ USB 闪存盘等物理插入引入系统。关于恶意软件可以通过愤怒的情绪和对过度工作且薪水低的系统管理员的不 set 敏感来传输的持续传言完全毫无根据（但你永远不会分谨慎）。\n\
  \n恶意软件通常设计为系统打开次要访问路径，创建者可以使用这些路径提取重要数据。例如，恶意软件包可能会安装键盘记录器程序，该程序将记录用户所有的击键，允许发现用户登录名和密码等敏感信息。麦克风和摄像头也可能被劫持，允许完整录制设备房间内发生的事件。\n\
  \n恶意软件包通常包含 `rootkits`，它们在系统级自动运行，以保护非法操作免受检测和删除。Rootkits 还可以创建新的后门，通过后门可以启动完全远程管理会话。这些会话可用于完全控制主机以更改本地软件配置并删除私有数据。\n\
  \n一种特别恶毒的恶意软件被称为 `ransomware`，其脚本用于加密系统中的全部或大部分数据。当受害者下次尝试登录操作系统时，会看到一个弹窗，要求在使用加密货币支付巨额赎金以移除加密。近年来，许多大型企业和政府机构遭受了此类勒索软件的攻击，有些被迫支付数十万美元恢复关键系统。然而，你应该意识到一些重要的事实。\n\
  \n- 由于我们讨论的是犯罪分子，无法保证支付赎金真的能重新获得访问权限。\n- 某些勒索软件攻击可以使用像卡巴斯基等安全公司提供的服务免费破解（[`norransom.kaspersky.com/`](https://norransom.kaspersky.com/))）。\n\
  - 通过确保你的重要数据在多个离线存档中妥善备份，你可以避免大多数勒索软件攻击带来的破坏和。如果你遭受了攻击，可以使用备份的数据重新构建系统。\n- 更好的是，你应该小心只加载你认为是安全的在线资源。\n\
  \n\n\n\n\n随着加密货币（一种安全且匿名的数字货币）的日益流行，通过生成被称为 `hashes` 的令牌来验证交易的需求也随增加。由于生成 `hashes`\
  \ 需要大量昂贵且耗电的计算时间，一些“挖矿者”会劫持远程计算机作为服务器，为他们产生的 `hashes` “赚取”报酬。除了你绝对不希望在设备上运行未经授权的操作外，挖矿可能会消耗你所有的系统资源并产生巨额的电费。你需要监控系统（以及公用事业账单）是否存在此类活动。\n\
  \n## 基于网络的攻击\n\n有时，外部人员可以在技术上完全不发起任何“攻击”的情况下，非法访问你的数据。他们只需要出现在用于传输未加密文件或数据包的网络中即可。由于未加密的数据是以明文形式在网络上传输的，“攻击者”可以使用封数据包分析器（如\
  \ `Wireshark`）“嗅探”往回传输的内容，并将其重组为原始格式。\n\n你肯定不想与这类麻烦产生任何关系。但你的网络中还潜伏着更多的黑暗。\n\n###\
  \ 中间人攻击\n\n网络上的个人可能会拦截传输序列，并在允许部分或全部数据包到达目的地之前对其进行修改。例如，他们可能使用这种技术将浏览器重定向到假的银行网站而非真实网站，然后记录用户输入的登录详情。这种攻击被称为\
  \ `man-in-the-middle`（中间人）攻击。\n\n### 拒绝服务和分布式拒绝服务攻击\n\n坚决的攻击者甚至可以在没有获得服务器访问权限的情况下让你的网站崩溃。拒绝服务（`DoS`）攻击向网络服务发送大量的资源请求，占用服务器大量的资源，以至于它没有剩余资源来为合法客户提供服务。例如，2019\
  \ 年，针对免费图片库 `openclipart.org` 背后的服务器发动了此类攻击。该攻击导致整个业务离线了数月之久，使其恢复的可能性变得扑朔未测。\n\n\
  由于生成足够的伪造请求来成功攻倒大型网站可能超出了单一攻击者的能力，因此某些攻击会利用第三方计算设备，从而发送更多的请求。我所指的“第三方”是指被劫持并变成“僵尸”的服务器、个人电脑和\
  \ IoT 设备，这些设备实际上成了攻击者指挥指号的奴隶。此类僵尸的群体有时被称为 `botnets`（僵尸网络）。当攻击结合此类分组资源时，它们被称为分布式拒绝服务（`DDoS`）攻击。\n\
  \n拒绝服务攻击可以使用智能防火墙技术进行阻止。大型云提供商有能力和经验提供企业级的 DDoS 防护。亚马逊云服务的 `AWS Shield` 就是一个很好的例子。\n\
  \n### 网络路由攻击\n\n计算机网络运行在一套复杂的路由规则之上。特定数据包将在如何、何时以及何地被发送取决于既有协议，如传输控制协议/网际协议（`TCP/IP`）、地址解析协议（`ARP`）和动态主机配置协议（`DHCP`）。但协议只是协议，总有人试图寻找新方法来欺骗使用它的软件。\n\
  \n因此，请警惕整个充满迷人数据窃取恐怖之物的“玩具箱”，例如 `ARP` 欺骗（在网络的 `ARP` 表中插入虚假的 IP 地址/主机关系）、`MAC` 泛洪（数据可以从托管网络交换机中“冲”出，从而暴露敏感的路由数据）以及\
  \ `switch spoofing`（攻击设备可以伪装成网络中的中干交换机，从而获得合法网络交换机的信任）。\n\n## 总结\n\n技术安全确保你的 IT\
  \ 资源免受未经授权的访问，并维护你的用户的隐私。\n\n安全的 IT 实践包括了解与软件、硬件以及电子邮件或电话诈骗者使用的各种方法相关的现有和新兴威胁。\n\
  \n配置不当的网络和互联网连接是许多（如果不是大多数）导致数据丢失的严重攻击的原因。\n\n即使对可能面临的恶意软件威胁类型的基本了解，也能帮助你调整在线行为以更有效地保护自己。\n\
  \n## 回归基础\n\n**定义漏洞和威胁。** 漏洞是一种软件或硬件状态，如果被利用，将允许对你的基础设施进行危险且未经授权的访问。威胁是对漏洞的任何可能的利用。\n\
  \n**理解安全格局的“大局”。** 了解哪些类型的设备可能面临威胁、谁对攻击你感兴趣以及他们想要实现什么是非常重要的。\n\n**熟悉主要的威胁类别。** 威胁者可能在追求这三个目标之一：身份盗窃（可能导致某种形式的财产损失）、数据外泄和资源破坏。\n\
  \n**熟悉常见的软件漏洞。** 永远不要运行安装了未打补丁和过期软件的设备。这对于你使用的任何网络浏览器都是如此。\n\n**理解数字间谍使用的工具和漏洞。**\
  \ 敌对间谍攻击可能利用廉价的移动存储设备（USB 闪存）、现有硬件或软件后门以及配置不当的无线网络来渗透你的网络并访问你的资源。\n\n**理解在连接的世界中用户身份的脆弱性。**\
  \ 你用于访问在线甚至本地服务的许多凭据很可能因为服务提供者的数据泄露或私人信息的疏意暴露而遭到破解。\n\n**理解各种类型的恶意软件。** 你应该理解木马、键盘记录器、根内核和勒索软件等恶意软件威胁是如何工作的（当然，还有你可以如何保护自己）。\n\
  \n**理解各种类型的网络攻击。** 网络传输可能会被中间人攻击中断，公开服务可能会被拒绝服务（`DoS`）攻击有效关闭，通过路由工具传输的数据往往会暴露。\n\
