  2. USB 存储设备\n3. 4G 移动网络设备\n4. 以太网\n\n11. 以下哪项最好地描述了后门漏洞？\n1. 一种访问计算设备的未记录方法\n2.\
  \ 一个未公布的 `WiFi` 主机网络\n3. 一个没有密码保护其 `BIOS/UEFI` 启动过程的服务器\n4. 受未配置防火墙保护的服务器\n\n12.\
  \ 以下哪项理由是公共安全机构用于在所有大众市场计算设备中保留“后门”的理由？\n1. 确保所有合法的服务器活动得到适当保护\n2. 防止有组织犯罪阻止政府对其非法活动的监控\n\
  3. 妥善保护消费者设备与政府服务器之间所有连接的末端\n4. 监控大众市场设备中的漏洞和缺陷\n\n13. 以下哪些是保护你免大规模公共凭据泄露影响的重要且实际步骤？（选择三项）\n\
  1. 使用密码库生成并安全地存储强密码。\n2. 避免使用在线电子商务和银行网站。\n3. 绝不在多个账户之间重复使用密码。\n4. 定期监控在线泄露的密码/邮箱组合集合。\n\
  \n14. “钓鱼攻击”是如何作为凭据窃取的一部分？\n1. 钓鱼攻击使用 AI 生成的数据片段来渗透网络的外层防御。\n2. 钓鱼攻击向目标账户发送大量可能的登录名/密码，直到偶然碰上正确的组合。\n\
  3. 钓鱼攻击可以欺骗目标用户向危险人物透露个人信息。\n4. 钓鱼攻击嗅探网络包，并尝试从捕获的数据中重建凭据集。\n\n15. OSINT 泄露与钓鱼攻击有何不同？（选择两项）\n\
  1. `OSINT` 工作涉及对你计算环境的物理访问，而钓鱼攻击可以远程执行。\n2. `OSINT` 泄露发生在公开来源中，而钓鱼攻击针对来自私人来源的信息。\n\
  3. `OSINT` 是一个反犯罪过程，根本不是一种攻击。\n4. 技术上，`OSINT` 收集不需要违反任何隐私法，而钓鱼行为通常是犯罪行为。\n\n16.\
  \ 以下哪项最好地描述了勒索软件？\n1. 恶意软件静默禁用运行在受害者计算机上的本地反恶意病毒软件。\n2. 恶意软件被秘密地安装在计算机上，随后删除本地数据。\n\
  3. 受害者的计算机被破解，其全部或大部分数据被加密，导致所有者无法访问。\n4. 加密货币挖掘操作在受害者计算机上秘密运行，使用本地的电力的计算资源。\n\n\
  17. 以下哪些措施对于对抗勒索软件攻击有效？（选择两项）\n1. 维护关键数据的完整且更新的备份\n2. 注册在线勒索软件预防服务\n3. 仔细遵循勒索软件作者发送的屏幕指令\n\
  4. 与在线及执法机构合作以解密你受影响的数据\n\n18. 以下哪些项可以被分子用于直接支持其分布式拒绝服务（DDoS）攻击？（选择两项）\n1. 设计用于探索受感染系统以寻找价值数据的人工智能软件\n\
  2. 设计不当的物联网网络\n3. 用于破坏远程文件系统的脚本\n4. 具有配置不当的访问和验证设置的网络连接计算设备\n\n19. 以下哪些是专门针对网络协议的攻击方法？（选择两项）\n\
  1. `ARP` 欺骗\n2. `MAC` 泛洪\n3. 钓鱼\n4. 社会工程学\n\n20. 在 IT 安全术语中，什么是僵尸（zombie）？\n1. 一个配置为为了非法目的误导流量的防火墙\n\
  2. 一个资源作为攻击的一部分被劫持的计算设备\n3. 一个操作系统故障导致其处于永久睡眠状态的计算设备\n4. 未经授权从服务器控制台注销的人类管理员\n\n\
  \n\n\n在学习保护你的物理计算基础设施之前，可能花一点时间确保你清楚地理解基础知识是值得的。我所说的“基础”，是指组成实际计算机的核心组件。毕竟，如果你不了解某个东西，就无法对其进行有效的保护，对吧？\n\
  \n## 计算是如何工作的\n\n计算机的“计算”部分是中央处理器（`CPU`）。这是实际上执行让事情发生所需的大部分算术、输入/输出、逻辑和控制操作的设备。对于我们大多数人来说，关于\
  \ `CPUs` 唯一需要的就是它们代表我们想要运行的应用程序执行得有多快、多高效。因此，在做出购买决策之前，我们将研究处理器速度（以吉赫兹 [`GHz`]测量）、核心数（现在有八个核心很不错）以及架构（32\
  \ 位或 64 位——尽管 32 位在很长一段时间内都没什么大用）。\n\n`CPUs` 与安全之间有什么关系？事实证明，其关系比我们大多数人在几年前想象的要大得多。例如，最近在某些高端\
  \ `Intel` 芯片中发现的漏洞（如 `Spectre` 和 `Meltdown`）已被证明可能会将服务器上的私有数据暴露给未经授权的访问。根据你的工作负载，谨慎且负责的管理员可能会调整他们在生产环境中使用\
  \ `CPUs` 的方式。\n\n`iostat`（作为 `sysstat` 包的一部分安装）除了其他统计数据外，还会给你 Linux 机器自最近启动或上一次运行命令（以较晚者为准）以来平均\
  \ `CPU` 处理器负载：\n\n```\n $ iostat\nLinux 5.4.0-42-generic (workstation)  2020-08-06\
  \  _x86_64_  (4 CPU)\n\navg-cpu:  %user   %nice %system %iowait  %steal   %idle\n\
  \           5.02    0.03    1.26    0.02    0.00   93.66\n\nDevice   tps    kB_read/s\
  \    kB_wrtn/s  kB_dscd/s kB_read kB_wrtn  kB_dscd\nsda    11.02       131.42  \
  \     215.06       0.00 4015073 6570653        0\n```\n\n## 内存是如何工作的\n\n用于存储系统使用的应用程序数据的主要资源是随机存取存储（`RAM`）。总的来说，你的\
  \ `RAM` 模块越快、越可靠——并且安装的容量越多，你的计算机享到的性能就越好。是否存在基于 `RAM` 的安全威胁？遗憾的是，有的。例如，通过启动第二个操作系统可能会从\
  \ `RAM` 模块中检索会话数据。这被称为冷启动攻击。有时也可以通过系统交换文件的内容访问敏感数据。\n\n`free` 命令将为你提供系统内存当前状态的快速快照，包括任何可能使用的交换文件：\n\
  \n```\n $ free -h\n        total     used    free   shared  buff/cache available\n\
  Mem:    13Gi     123Mi    13Gi    0.0Ki       442Mi      13Gi\nSwap:     0B    \
  \    0B      0B\n```\n\n旨在持久化的数据并不存储在 `RAM` 模块上，甚至不存储在虚拟内存交换文件中，而是存储在物理存储驱动器的永久分区上。此类驱动器可能使用磁介质存储你的数据，或者最近使用的更快速、密度更高的固态介质。考虑到全世界创建和消耗几乎所有的数字数据都存储在某种驱动器上，维护你设备的物理安全是一项重大责任。\n\
  \n## 存储是如何工作的\n\n并不总是显而易见的是，在你用完存储驱动器后，仍然需要担心它们。仅仅因为它们太慢或无法满足你当前的需求，并不意味着某人的地方没有动力将其插上看看是否有价值之物。研究显示，数量惊人的丢弃和售后驱动器包含未删除的数据。\n\
  \n在丢弃旧存储驱动器之前，一种经过测试的工具是 `dd`。请务必小心分配给 `of=` 的值指向你想要擦写的驱动器——而不是你正在使用的驱动器！\n\n```\n\
  \ $ sudo dd if=/dev/urandom of=/dev/sdc bs=1M\n```\n\n## 外设是如何（可能不）工作的\n\n如果以上这些还没有提高你的血压，只需考虑：即使是你的键盘和鼠标也可能向世界泄露你的秘密。概念攻击已经成功记录了无线外设的活动。我甚至不想提到网络打印机的问题。除此我刚刚提到了。很抱歉。\n\
  \n## 保护你的设备\n\n在你拥有的设备上发生的一切都应该是因为你希望它发生。进程的执行应该是因为你能从结果中获益。数据应该只在有助于你的目标时才被写入和读取。账户应该只为你希望在那里的用户存在。\n\
  \n但是有没有什么方法可以确保你的机器上服务的真的是你的目标呢？除了那些显而易见的，比如不要将手机或笔记本电脑留在不受保护的地方（如未锁的汽车），以及限制进入包含昂贵服务器的建筑和房间，这里还有其他重要的考虑因素。\n\
  \n### 还有谁在看？\n\n在过去的几个小时里，你是否在键盘上高效地敲击了一段快乐的时光？在那个会话期间你输入了密码或其他敏感信息吗？有人看吗？没有？你绝对确定吗？你可能会惊讶于“肩膀窥视者”在办公室或其他公共环境中计算机用户身后静静地走动，微妙地观察并记录你的登录和密码信息。\n\
  \n但你应该更担心监控摄像头的可能存在。多年来，关于使用廉价且易隐藏的无线摄像头的恐怖报告屡见不鲜。它们被发现安装在销售点（POS）终端的范围内（完美捕捉捕捉你输入信用卡密码\
  \ 时的手指），以及酒店房间内（完美捕捉你所做的一切）。\n\n不幸的是，你需要担心所有这些可能性，时刻意识到你的环境、谁可能穿过那里，以及哪些设备可能非法地监视你。偶尔环顾四周没有害，从天花板高度视觉扫描新房间是否有可疑设备也是个好主意。\n\
  \n但即使你独自在家，并且知道没有安装非法摄像头，你还没有完全脱身。如果你的操作系统上安装了键记录软件，你输入一切（包括银行密码）都可能被记录并传输到地球任何地方。此类软件（例如\
  \ Linux `LogKeys` 包）在理论上可能预装在新的出厂系统中。但也可能由任何短暂访问你未受保护系统的黑客在之后安装。\n\n\n\n\n\n便携式存储设备（也称为\
  \ `flash drives` 和 `data sticks`）使用通用串行总线（USB）标准，非常适合廉价方便地在不同之间传输大量数据。遗憾的是，它们也非常适合廉价方便地在不同地点之间传输大量数据。这种“不幸”之处在于，当此类设备被插入他人的电脑时，别人很容易利用它造成严重的破坏。\n\
  \n也许最简单的 USB 攻击是利用实时 Linux 会话（live Linux session）。许多 Linux 发行版允许你将操作系统镜像写入 USB 驱动器，当你插入该驱动器并启动电脑时，会获得“无需安装即可尝试\
  \ Linux”的选项。这种实时会话可以为你提供功能完整的 Linux 体验，而无需接触机器主数据硬盘上的软件。实时会话对于诊断和修复无法启动的电脑问题非常有帮助，但它们也可以用于在无需身份验证的情况下访问并操作现有驱动器的内容。\n\
  \n保护数据驱动器免受此类访问的唯一方法是对内容进行加密——我们将在第 5 章“加密你的静态数据”中讨论这一点。当然，正如你将在该章中学到的，加密可能会使你处理数据某些变得变得复杂。\n\
  \n你还应该担心加载了危险脚本的 USB 设备，这些脚本在插入电脑时会预先准备执行。针对这种情况，你可以使用 `systemd-udevd` 在内核层面强制执行策略以阻止使用\
  \ USB 存储设备。\n\n我在这里先停一下，向你们介绍一下我自己。我是一个系统管理员，所以正如你们所预期的那样，我构建并维护自己的电脑。除了这些，我非常喜欢排查故障和玩弄不可预测的硬件，我也不愿意把我的电脑交给专业的\
  \ IT 技术人员。当然，大多数技术人员都是完全诚实且可靠的。但那些不那么可靠的人多到已经足以让我感到紧张。\n\n让我给你们讲一个故事来解释一下。大约四分之一世纪，我还不是一个专业的系统管理员，所以当我的某一台\
  \ PC 出现超出我有限技能范围的问题时，我别无选择地把那台有问题的机器拖到当地的电脑服务店。随着时间推移，我和老板变得非常友好，当他处理我的问题时，我们会愉快地聊聊“行话”。\n\
  \n有一次，我在他忙于其他客户的一天进入他的店里，老板看着我，切换了背景播放的音乐，并对我眨了眨眼。当他继续在我之前服务那里的人时，我慢慢意识到播放的新音乐并不是那个家伙通常会听的类型。他后来笑着承认，他从我一个品味相似的朋友的电脑里复制了音乐文件。什么时候呢？就在那个朋友拿走*他*的电脑时。\n\
  \n看来那个 IT 哥子养成了一个习惯，自动吸入进入他店的驱动器中的所有有趣文件，稍后查看其中是否有有用的东西。而且，如果你相信国家和国际媒体报道的源源不断的事件，似乎那个\
  \ IT 哥子远不是唯一具有这种习惯的人。\n\n如果你把电脑 交给了一个 `甚至听过` USB 设备的人（也就是说，任何任何人）照顾，那么除非你认识并完全信任那个人，否则你应该假设你的数据已经被复制，并且安装了恶意脚本。\n\
  \n## 通过有效使用密码管理身份验证\n\n泛而言之，运行电脑需要两种程序。启动本身由一类通常被称为 `firmware`（固件）的指令管理。固件代码——如统一扩展固件接口（UEFI）或旧的基础输入输出系统（BIOS）——内置在电脑主板上，当电脑开启时，它用于枚举连接的硬件，定位安装在启动磁盘上的可用软件\
  \ `boot loader`（引导加载程序），然后唤醒引导加载程序并将控制权交给它。引导加载程序将如其名，开始加载操作系统软件，从该点起将管理系统进程。引导加载程序和它加载的操作系统构成了系统软件，这是第二种程序。图\
  \ 3.1 展示了涉及 UEFI 的典型启动过程。\n\n![流程图显示了使用 UEFI 启动（Linux）电脑时涉及的六个阶段。从上到下，这些阶段标记为：“上电”、“UEFI:\
  \ 枚举硬件环境”、“UEFI: 查找并挂载主引导记录 (MBR)”、“加载 GRUB 启动管理器并执行镜像内核”、“内核: 挂载根分区”以及“将控制交给 Systemd”。](img/60946.png)\n\
  \n图 3.1 使用 UEFI 启动（Linux）电脑涉及的阶段\n\n这些内容与安全有什么关系？嗯，这两个阶段中的每一个——由 UEFI/BIOS 固件控制的早期启动阶段和由操作系统软件管理的后期阶段——都可以通过密码进行保护。但重要的是记住，那些将是`不同的`密码。在启动菜单中设置\
  \ UEFI/BIOS 密码将有效防止系统启动，除非你知道密码。虽然重置启动密码是可能的，但理想情况下，这将花费足够的时间和精力来说服一个坏人放弃。相比之下，丢失你用于登录操作系统的账户密码并不会阻止你启动操作系统；它只会让你无法进入那个特定的账户。否则，操作系统将正常运行，你可能可以使用一个独立的管理员账户来找回自己的数据。\n\
  \n如果你的电脑可能会出现在某些容易受到陌生人无意关注的地方，那么你将可能想用 UEFI/BIOS 密码将其锁定。对于大多数笔记本电脑和其他移动设备，以及 24/7\
  \ 留在公共场所的自助机来说，情况如此。但几乎所有的用例都需要为你的操作系统账户设置密码——不仅仅是任何密码，而是那种真正能把人挡在外的强密码。事实上，这正是我们将在接下来的章节中讨论的密码。\n\
  \n### 密码策略\n\n有三种密码，其中只有一种具有真正的安全价值。让我们一个一个地来看。\n\n第一种是简单到令人尴尬的易猜密码。亲爱的读者，请放心，我永远不会怀疑你使用\
  \ `123456` 或 `pa$$word` 或者你的生日或宠物的名字。一刻也不会。我知道你意识到这些和完全没有密码没有区别。事实上，它们可能 worse，因为它们带给了你一种虚假的安全感。\n\
  \n第二类涵盖了那些并不算尴尬但可以很容易使用所谓的 `dictionary attack`（字典攻击）来破解的密码。“什么是字典攻击？”我听到你这样问。问得好。它是一个脚本，会读取一个“字典”——或者说一个包含成千上万个热门密码和常用词的列表，并针对你的账户尝试其中的每一个。你几乎任何可能凭空想到的字母组合都可能出现在那些字典中的一个。为了保护你免受此类攻击，许多服务限制了账户冻结前允许的错误尝试次数。你应该考虑配置你的账户仅允许有限的尝试，但更好的办法是从口头上选一个更好的密码。\n\
  \n\n\n\n这带我们进入了第三类——真正有效的一类。你自己的密码理想情况下应该是长、复杂且唯一的。我所说的“唯一”是指你为某个特定账户选择的密码在任何其他地方都没有被使用。为什么这如此重要？因为如果你在一个发生过数据泄露的在线服务上拥有账户（它们迟早都会发生），那么黑客将获得你使用的密码以及你的电子邮箱地址或登录名。如果你在多个服务中都使用这种组合，那么所有的服务都将变得脆弱。这可能是你甚至都听不到的坏消息。\n\
  \n基于以上所有点，完美的密码看起来像这样：\n\n```\nq34raD;foKjpoq{\n```\n\n遗憾的是，完美的密码是你很可能记不住的。我过一两分钟就会解释这个问题。但在此之前，我会告诉你另一种类型的完美密码。这种想法是，即使是面对字典攻击，想要破解一个长度为\
  \ 20 个字符的密码也会很费力。所以，为什么不组合像这样四个五个字母的单词呢：\n\n```\nhouse whale drive plain angry\n\
  ```\n\n这些字母非常多，而且这些单词之间没有明显的联系，对于任何现有的计算机来说，破解这样的短语都会非常非常困难。但因为它们都是普通单词，对你来说应该相对容易记忆。考虑升级吧。\n\
  \n当你是制定规则的管理员时，你可以强制所有用户使用那种复杂度的密码。例如，你可以要求他们的选择至少包含八个字符，由字母、数字、非字母数字字符和至少一个大写字母组成。控制用户密码处理方式的方法是通过\
  \ `/etc/login.defs` 配置文件。\n\n直到几年前，最佳实践还建议要求用户每隔 30 天左右更改一次密码。那是过去了。现在我们意识到，强迫更改密码提供的额外安全非常小，另一方面，会导致一些糟糕的意之外的后果。为什么更改密码不会更安全呢？嗯，黑客恰好在旧版本准备被替换之前发生的概率有多大呢？概率并不高。更有可能的是，密码更改发生在攻击发生几天或几周后，这意味着在门关上之前，马早就跑光了。\n\
  \n那么那些意之外的后果是什么呢？嗯，把自己放在普通 IT 用户的角度考虑：想出一个密码已经够难了，但如果你每个月都需要一个新密码，你可能会做什么呢？比如 `myword5`、`myword6`、`myword7`\
  \ 等等等。我妻子曾收到一位 `manager` 的建议，根据当前月份更改更新后的密码。你认为破解这些密码有多难？\n\n尽管如此，在复杂和易记之间找到正确的平衡将始终是困难的。除非你变得聪明。\n\
  \n### 密码管理器\n\n处理密码的明智方法是使用密码管理器（有时被称为 `password vault`）。简单来说，密码管理器是运行在你的桌面、、浏览器中或作为在线服务的软件，它可以让你将身份验证信息存储在受强加密保护的数据库中。有人想从管理器中获取任何有用信息的唯一方法就是输入管理员密码。虽然这个密码应该是一个好密码，但它实际上是你需要记住的最后一个好密码，因为每当你被提示要对在线服务或软件包包进行身份验证时，你都可以轻松地从管理器中复制并粘贴到提示框中。图\
  \ 3.2 显示了一个跨平台密码管理器。它展示了你如何为任何数量的账户添加和管理密码以及登录信息。\n\n![图显示了密码管理器中一个典型账户条目的截图。](img/60959.png)\n\
  \n图 3.2 密码管理器中的典型账户条目\n\n良好的管理器会在需要时为你生成高质量的密码。某些管理器还可以直接与网络浏览器集成。流行的管理器包括 `LastPass`\
  \ 和 `KeePass2`。\n\n### 多因素身份验证\n\n仅仅依靠密码——无论多强——对于可能面临坚决攻击者的服务来说，真的还不够。如今行业首选的解决方案是在密码`之外`添加第二种身份验证方法。意料之中的是，这种方法被称为`多因素身份验证`（`MFA`）。这种想法是，登录需要两个或多个完全独立的确认来证明你确实是你所称的身份：只有你应该知道的（比如你的密码）和只有你应该拥有的（如智能手机或专用的\
  \ `MFA device`）。窃贼同时拥有`两者`知识和实体的概率远比仅拥有其中一个要得多。\n\n我们如何确认你确实拥有（比如）智能手机呢？手机可以与你的在线账户关联。每当你尝试登录并提供密码时，你会被提示输入某种类型的一次性密码码（通常由六个数字组成）。你获取通过短信发送到手机的代码并在登录页面上输入它。保护密码码是没有必要的，因为它通常在\
  \ 30 秒后就会过期。\n\n对于你和你的用户来说，为所有提供 `MFA 计划` 的在线服务账户注册是一项安全最佳实践。如果你的组织维护自己的基础设施，理想情况下你也应该为你的账户配置\
  \ `MFA`——特别是通过远程连接访问的账户。\n\n### 监控泄露密码\n\n一旦私人账户被泄露，尽快更新你的身份验证信息就变得很重要。如果你最初在该账户使用的密码在其他地方也使用过（尽管我们已经看到这是个坏主意），你必须立即更新所有其他账户。\n\
  \n但存在两个问题：你如何知道你的某个账户实际上已经泄露了呢？如果你使用过某个特定密码多次，但不确定它是否真的暴露了怎么办？\n\n这两个问题的答案都可以在 Troy\
  \ Hunt 的 Have Been Pwned? (HIBP) 网站上找到。Troy 是一位备受推崇的安全专业人士，几年前，他亲自免费提供一项关键服务。他的网站维护了一个由黑客和黑客组织发布的所有\
  \ `credential dumps`（凭据泄露）内容的数据库。如果你的电子邮箱地址或密码包含在任何泄露中，它们将出现在 Troy 数据库的搜索中——尽管不会一起显示，因为那将是一个巨大的安全泄露！\n\
  \n如你从图 3.3 所示，该网站允许你搜索自己的电子邮箱。我的“info”邮箱地址看起来是干净的。\n\n![图显示了 HIBP 邮箱搜索结果的截图。](img/60969.png)\n\
  \n图 3.3 HIBP 邮箱搜索结果\n\n域名搜索将返回数据库中与特定域名相关的匹配项。要完成此搜索，你首先需要验证你是该域的所有者。此外，如图 3.4 所示，你也可以搜索单个密码。这次搜索显示我不再使用的一个旧密码已被泄露过多次。\n\
  \n![图显示了 HIBP 密码字符串搜索结果的截图。](img/60977.png)\n\n图 3.4 HIBP 密码字符串搜索结果\n\n\n\n\n更重要的是，你还可以订阅任何此类搜索的更新，这样每当发生新的泄露时，你都会收到提醒。这是你应该立即处理的事情。\n\
  \n## 通过权限管理授权\n\n与 `authentication`（认证）过程紧密相关的是 `authorization`（授权）。前者控制谁可以进入系统，而后者则决定他们进入系统后能够做什么。本节将简要探讨我们为什么要实现授权以及它是如何工作的。\n\
  \n正如其名称所示，多用户环境——如现代操作系统或云平台——允许多个账户用户同时登录。但众所周知，并非所有用户都应该获得系统资源的对等访问权限。毕竟，某人可能是管理员，另一个人可能只登录是为了访问某个相关项目的数据，而第三个人则仅仅是为了使用生产力工具。其中每个角色都需要访问不同的资源集，而且你不希望它们之间出现任何不必要的叠。例如，让办公效率套件或访客用户能够玩某些核心系统配置文件，这显然是不符合逻辑的，不是吗？\n\
  \n因此，按资源设置权限是常见的做法，定义谁应该能够读取、编辑或删除特定的文件或文件夹。管理员用户可能会被赋予全局权限，而个人用户默认情况下只能编辑属于该账户的对象。权限可以分配给组，使得该组的任何成员都能够使用任何相关资源。一个典型的权限设置模式如图图\
  \ 3.5\n\n图 3.5 分配给用户和用户组的权限级别\n\n在 Linux 上，我确定你已经知道，这种访问控制是通过对象权限管理的，使用了 `chmod`、`chown`、`usermod`、`cgroups`\
  \ 和 `nice` 等工具。\n\n## 控制网络访问\n\n如今，针对设备的远程威胁与我们目前为止讨论的人身威胁同样常见且严重。这是因为如果没有网络连接，计算机就不再那么好用了。但当然，如果你可以远程登录，那么你可以确定其他人也会尝试效仿。为了帮助你加强网络防御，本节将涵盖网络防火墙的基础知识、保护免受网络恶意软件的方法，以及如何有效地运用那种在正正义战斗中最罕见的品质：常识。\n\
  \n### 防火墙\n\n防火墙本质上只是一个用于检查到达或离开给定设备的每个数据包的工具。如果一个数据包符合你的防火墙规则定义的一个或多个条件（有时称为 `access\
  \ control list` [`ACL`]），则将根据规则条款将其被允许通过或被拒绝。这是所有防火墙的共同点。但它们完成工作的方式、工作的位置以及它们在此过程中使用的架构将取决于你的选择。让我们探索其中一些内容。\n\
  \n#### 软件防火墙 vs. 硬件防火墙\n\n尽管它们的功能几乎相同，但一台思科或 Juniper（瞻 per）硬件防火墙可能轻松花费你超过 10,000\
  \ 美元，而开源的 `OpenWRT` 或 `pfSense` 包是免费的。那么，区别在哪里呢？其实不在于复杂性：这两类解决方案都需要大量的专业知识才能进行正确的配置和管理。也不在于通用性：这两类解决方案都拥有我能想到的任何用例所需的所有功能。\n\
  \n在某种程度上，至少对于较小规模的部署而言，这取决于认知。有些经理仅仅不觉得使用运行开源软件防火墙的通用 PC `感觉不对劲`，即使他们的管理员支持这样做。而且，不应该低估大型商业供应商提供的软件支持的价值。但在某些环境中，选择将要简单得多。例如，如果你负责保护\
  \ 1,000 台服务器免受攻击威胁，并且你的流量通常以每秒 GB 计，那么你的通用 PC 就无法胜任这项任务。\n\n你选择的解决方案将像往常一样反映你的特定需求。如果你负责全面的企业级部署，你可能想要一个专门的防火墙设备。如果你使用的基础设施和网络带宽相对有限，软件防火墙也可以工作。而对于独立\
  \ PC 或笔记本电脑，你可以使用适用于 CentOS 和 RHEL 的 `firewalld`、Ubuntu 的 `Uncomplicated Firewall`\
  \ (`UFW`)，或 `iptables`（及其继任者 `nftables`）。\n\n为了了解防火墙是如何工作的，想象你的当地图书馆设置了一个自助终端，人们可以停下来在那里搜索有趣的标题或查找可用的媒体。但出于安全考虑，图书馆不希望这台终端被用于访问更广泛的互联网。\n\
  \n下方显示的 Bash 脚本前两行包含了 `iptables` 命令，将锁定终端，使其仅允许（`ACCEPT`）来自你图书馆 Web 域名和本地 Ubuntu\
  \ 软件库的所有出站请求。这将允许用户查询图书馆数据库，并让系统自动更新软件。\n\n接下来的两条命令将阻止（`DROP`）所有使用 `HTTP` 或 `HTTPS`\
  \ 协议的其他出站请求。这将有效地阻止用户加载除包含图书馆官方内容之外的任何网页。\n\n第五行将允许来自本地网络单个主机的 SSH（端口 22）会话。这将允许你的管理员（可能意味着`你`）在终端机器内部打开\
  \ SSH 会话。最后一行阻止了任何其他源的 SSH 流量。你执行这些命令的顺序对于获得想要的结果至关重要。\n\n```bash\n#!/bin/bash\n\
  iptables -A OUTPUT -p tcp -d library.mytown.org -j ACCEPT\niptables -A OUTPUT -p\
  \ tcp -d ca.ubuntu.com -j ACCEPT\niptables -A OUTPUT -p tcp --dport 80 -j DROP\n\
  iptables -A OUTPUT -p tcp --dport 443 -j DROP\niptables -A INPUT -p tcp -s 192.168.4.87\
  \ --dport 22 -j ACCEPT\niptables -A INPUT -p tcp -s 0.0.0.0/0 --dport 22 -j DROP\n\
  ```\n\n#### 本地防火墙 vs. 云端防火墙\n\n数据包根据最初发送时附加的微小元数据标头的内容，在网络中的不同位置之间引导。各种协议使用的标头包含了数据包的初始源地、最终目的地以及它正在使用的网络协议的信息。图\
  \ 3.6 演示了网络数据包的设计方式。\n\n![图中是 TCP 数据包内容的元数据头简化示意图。](img/60997.png)\n\n图 3.6 TCP\
  \ 数据包内容的元数据头简化示意图\n\n在数据包旅程的每个跳点上，网络路由器必须读取其标头并决定下一步做什么。如果目标地址是本地的，路由器可以将数据包重定向到该主机。另一方面，如果目标在另一个网络，那么路由器可以将数据包转发到更近的路由器。但无论如何，运行在路由器上的防火墙都必须应用，根据本地规则决定是否允许处理该数据包。如果出现问题，可以直接删除数据包——无论是否向发送者发出通知。\n\
  \n\n\n\n\n无论防火墙位于何处，其工作原理都是完全相同的。在企业服务器房中构建的传统操作会将防火墙设备放置在本地网络的“边缘”，成为所有入站流量的第一道站点，以及出站流量的最后一个本地停站。我所说的“边缘”，是指防火墙通常是直接插入互联网服务提供商（ISP）路由器的唯一设备，而所有其他设备都*通过*防火墙访问互联网。图\
  \ 3.7 显示了其可能的布局。\n\n![该图显示了一个典型的网络设置，防火墙设备位于互联网和其他本地资源之间。](img/61006.png)\n\n图 3.7\
  \ 典型的网络设置，防火墙设备位于互联网和其他本地资源之间\n\n像 Amazon Web Services (AWS) 等云服务上的防火墙的基本结构和功能原理也是类似的——即使它们并不一定称之为防火墙。例如，AWS\
  \ 将用于过滤进出计算（弹性计算云 [EC2]）和数据库（关系型数据库服务 [RDS]）流量的工具命名为*安全组*。\n\n默认情况下，AWS 安全组会阻止所有入站流量并允许任何传出流量。图\
  \ 3.8 所示的示例将允许使用端口 22 的 Secure Shell（SSH）远程登录会话，以及使用端口 80 的来自任何源地的入站超文本传输协议（HTTP）流量。其他使用任何协议或端口的入站流量都将被拒绝。\n\
  \n![图中显示了一个截图，说明了 AWS EC2 安全组如何允许 SSH 和浏览器（HTTP）流量进入资源，无论其来自何处。](img/61014.png)\n\
  \n图 3.8 AWS EC2 安全组，无论来自何处都允许 SSH 和浏览器（HTTP）流量进入资源\n\n### 病毒与恶意软件防护\n\n病毒与网络有什么关系呢？请考虑，至少在现在，绝大多数病毒感染都是通过各种网络连接发生的。我感染的第一种病毒——那是追溯到\
  \ 20 世纪 90 年代初我运行 MS DOS 3.3 的时候——是软件程序 5.25 英寸软盘上的“免费赠品”。但你上一次在磁盘上购买软件是什么时候了？\n\
  \n老旧版本的病毒不太可能对 Linux 系统造成伤害，以至于你通常不需要运行反病毒软件就能幸免。尽管如此，对于那些想要谨慎的人，Sophos 和 Clam AV\
  \ 软件套件仍然可供。但不要将*病毒*与*恶意软件*混淆。外面的恶意软件多到足以让你晚上夜睡不着。\n\n将*恶意软件*想象成任何旨在执行违背受感染设备所有者利益和愿望操作的脚本或程序。无论你还做什么，请确保你的用户\
  \ Web 浏览器已修补并更新到最新版本。\n\n### 网络防火墙 vs 应用防火墙\n\n防火墙可以在不同的通信层运行，允许它们使用不同的方法过滤流量。网络（或第三层）防火墙（也称为*数据包防火墙*）将利用\
  \ TCP/IP 栈的协议和功能，根据源和目的 IP 地址及端口来过滤网络流量。另一方面，应用（或第七层）防火墙可以深入挖掘数据包头元数据之外的实际有效载负载内容。此类防火墙可以使用更复杂的模式来控制流量，这些模式考虑了流量最终在应用层被使用的方式。这使得防火墙能够更好地理解你的应用程序面临的威胁。虽然第七层防火墙似乎提供了更强大的力和准确性，但在某些时候你仍然应该考虑使用第三层防火墙。第三层所提供的更高吞吐量和更广泛的协议支持，有时会超过第七层增加的细粒度控制，而且处理加密的应用数据对第三层来说并不是问题。\n\
  \n### 开展用户教育\n\n你面临何种漏洞取决于你的设备运行什么种的工作负载。Web 服务器的设计初衷是尽可能让多的客户端用户访问，因此你可以确定，随着时间的推移，某些客户端将是敌意的。另一方面，消费级笔记本电脑通常通过调制解调器或路由器访问互联网，因此使用默认设置，从网络外部发起越过边界的攻击并不容易。然而，消费级\
  \ PC 的主要弱点在于那些悬停在键盘上的手指。\n\n通常情况下，PC 用户必须在恶意软件行动之前发起某些接触。例如，在危险的有效载荷激活之前，你需要打开一封来自陌生发件者的电子邮件，可能还要点击一个附件。或者，你必须访问一个网站并加载页面或点击链接来启动危险的脚本。\n\
  \n而这正是教育发挥用场的地方。如果你谨慎地只访问合法的、声良好的网站，那么你将显著降低风险暴露。但你如何将合法网站与其他类区分开呢？一个重要的工具是熟悉互联网地址是如何构造的。诀窍在于学习如何“读取”统一资源定位符（URL）使用的语法。\n\
  \n我们将从一个实用的例子开始：Amazon 上我另一本 Wiley 书籍的 URL。\n\n`https://www.amazon.com/gp/product/1119490707`\n\
  \n`/gp/product/1119490707`\n\n等等，这是它的拆解方式：\n\n`.com` 代表此网站所属的顶级域名。其他顶级域名还有 `.org`、`.edu`\
  \ 以及用于政府网站的 `.gov`。`amazon` 是 `.com` 顶级域名下的特定主机名。理论上，`amazon.org` 可能是另一个组织拥有的域名。实践中，`amazon.org`\
  \ 也由杰夫·贝佐斯公司拥有，如果你向浏览器指向它，你会发现它会将访问重定向到 `amazon.com` 网站。\n\nURL 示例中的 `https` 指定了浏览器应读取和显示页面内容时使用的协议。因为它以\
  \ *s* 结尾，`https` 代表 HTTP 协议的安全（加密）版本。如果你在 URL 中未使用 `http` 或 `https`，大多数浏览器将假设你请求的是普通的非加密\
  \ HTTP。\n\n`.amazon` 之前的 `www` 子域名代表“万维网”（World Wide Web）。但对于绝大多数网站来说，包含它是可选的。事实上，万维网的发者蒂姆·伯纳斯李（Tim\
  \ Berners-Lee）对最初在协议规范中包含 `www` 表示道歉，意识到多年年来给数百万网络用户带来了不必要的负担。\n\n主机名之后 `/` 后的任何内容都代表你正在阅读的网页文件在\
  \ Web 服务器文件系统中的名称和位置，通常被称为*路径*。数字 1119490707 可能是文件本身的名字（存在服务器的 `/gp/product/` 目录中），也可能是某个目录的名字，该目录包含实际名为\
  \ `index.html` 或 `index.php`。URL 还可以包含进一步的数据来表示端口号和身份验证令牌等细节，但目前这样足够了。\n\n那么现在，你如何利用这些背景知识来改进你的网络安全呢？方法如下：\n\
  \n\n\n\n\n*   在登录网站之前——尤其是电子商务或银行网站——请确认浏览器显示的 URL 是以 `https` 开头，而不仅仅是 `http`。如果网站经过可靠加密，大多数浏览器还会显示类似绿色锁的符号。在缺少这些标识的网站上，切勿进行任何敏感活动。\n\
  *   双重检查以确保主机名和顶级域名符合你的预期。如果你看到银行或企业使用 `.org` 域名，你应该产生疑虑。如果你看到公司名称拼写错误（例如 `ammazon.com`\
  \ 或 `amazonbooks.com`），你应该保持非常警惕。犯罪分子经常尝试购买并使用常见拼写错误的域名，而一旦你进入其中一个网站，就无法得知他们会试图诱导你做什么。\n\
  \n最后，始终要意识到你在网上所做的任何操作的背景。永远不要忘记你正在访问的网站所有者是谁，以及你通常预期他们会做什么。在点击电子邮件或网页上的链接之前，请务必查看链接的完整\
  \ URL。你通常可以通过将鼠标悬停在链接上来查看完整 URL。不要被长地址吓到：你现在已经知道如何解析它们了。\n\n## 控制软件来源\n\n如你所见，你不希望允许任何人随意启动并登录你的设备。你也不希望留下任何不必要的网络连接，让错误的人接触到你的数字资源。但仍然有一个可能的攻击向量需要你仔细留意：你使用的软件。想一想：如果一个软件开发者想在你刚刚下载的\
  \ Android 媒体播放器代码深处包含一个键盘记录器，你会留意吗？你又要花费多长时间才能意识到，你在智能手机上输入的所有银行密码和私密邮件正被那个记录器捕获，并发送到某个地处的远程命令服务器，其目的何在无人知？\n\
  \n你对经常使用的几十个应用程序、程序和脚本真的了解多少呢？如果你不是开发者，通过阅读代码肯定学不到什么东西。即使你熟悉集成开发环境 (`IDE`)——而且你正在查看的软件恰好是开源的，你真的有时间和耐心去有条理地审查成千上万行代码以寻找漏洞和恶意功能吗？因此，无论如何，当你在设备上安装应用时，是因为你选择了信任该提供者。\n\
  \n但这总是个好主意吗？简短的是是不是”。详细的回答是，你应该坚持让你的软件供应商赢得你的信任。换句话之，由于你的设备和数据的健康乃至生存依赖于你所使用的软件，请确保只从可靠的来源获取软件。\n\
  \n这说易做难。你该如何审查你的软件来源呢？第一步是改掉快速下载和安装任何看起来有趣或有趣的应用的习惯。相反，要寻找有关开发者和托管软件的仓库的信息。理想情况下，只使用来自少数几个集中化的、官方仓库的软件。你如何识别“集中化的、官方仓库”呢？在某些情况下，这会比其他时候容易得多。\n\
  \n### PC 软件仓库\n\n我们 Linux 用户很幸运，可以访问与精心策划的仓库集成的软件包管理器，这些仓库提供了数以十万计的软件包。例如，Debian/Ubuntu\
  \ 用户将获得“高级软件包工具” (`APT`) 系统，而 Red Hat/Fedora/CentOS 系统则通过 `YUM` 或 Dandified YUM\
  \ (`DNF`) 管理器使用 RPM 包管理器。如果你坚持使用这些包管理器，你就可以确信获取到的软件是可靠的，而且只要你继续维护它，它就会获得定期的更新和补丁。\n\
  \n### 移动包管理\n\n虽然只要你遵循规则，Linux 软件管理世界运行良好，且 Windows 和 macOS 基本处于受控状态，但在手机和平板电脑上加载内容完全是另一回事。iPhone\
  \ 和 Android 的官方应用商店很有帮助，但已经出现过许多热门问题。特别是对于 Android 手机，保持核心 OS 软件的更新和补丁仍然是一个尚未完全解决的挑战。你可能会根据智能手机供应商和无线运营商取决于其提供定期和及时软件更新的能力——在这方面并非所有运营商都是平等的。\n\
  \nGoogle 现在在 `Play Store` 应用中包含了 `Play Protect` 软件。你应该检查 `Play Store` 设置以确认该工具已激活，并且你的设备已通过“Play\
  \ Protect 认证”。\n\n## 总结\n\n*   对你的计算环境保持尽可能的控制，包括原始 OS 安装程序及其物理位置。这也确保了你不认识也不信任的\
  \ IT 技术人员无法在无监督的情况下访问你的数据。\n*   你的计算机可以在两个阶段由密码保护：UEFI/BIOS 启动阶段和 OS 登录阶段。对这两个阶段保持强密码是非常重要的。\n\
  *   确保你使用的密码是长、复杂且唯一的。密码管理器可以安全地存储无尽的高质量密码，并在无需记忆的情况下安全地提供给你使用。\n*   你使用身份凭据登录账户，但你在该账户上被允许的操作由你的特定授权定义，而授权是由与特定资源相关的权限决定的。\n\
  *   始终保持你的网络浏览器处于最新更新并已打补丁状态。\n*   尽可能从可靠且官方的仓库获取你的应用和软件程序。\n\n## 回归基础\n\n*   **意识到你的计算机活动可能被非法监控的方式。**\
  \ 理解“侧击窥视者”和键盘记录软件如何在你不知情的情况下监控并记录你的计算活动。\n*   **理解如何控制便携设备的使用。** 你可以使用 OS 设置来限制组织或家庭中使用\
  \ USB 闪存。对私有电脑上的存储驱动器进行加密也可以防止你通过 Live USB 会话导致泄露。\n*   **理解在选择密码时应避免什么。** 密码应该是复杂且难以预测的，但为了限制风险暴露，它们在全球范围内不应用于多个账户。\n\
  *   **理解多因素身份验证（MFA）的工作原理。** 当账户设置为使用 MFA 时，除了密码外，你可能被要求输入虚拟或物理设备显示的临时代码。这结合了“你所知道的”和“你所拥有的”来增加身份验证的安全性。\n\
  *   **了解如何监控受损的密码和身份验证信息。** Have I Been Pwned 网站提供了对受损数据库的访问。你应该跟踪这些数据库，以确保你的凭据信息没有出现在泄露中。\n\
  *   **理解如何控制所有系统用户的行为。** 通过对所有系统资源适当应用权限，单个用户和组成成员都应该只能访问他们完成工作所需的资源，而不再更多。\n* \
  \  **理解网络防火墙的功能和目的。** 防火墙可以配置为检查来自网络外部的每个数据包的元数据。如果元数据特征与防火墙策略规则冲突，可以拒绝该数据包。\n\n\
  \n\n\n\n## 如何为你的环境选择正确的防火墙解决方案\n个人电脑可以使用操作系统内置的防火墙；小规模基础设施部署可以使用基于 Linux 的开源软件防火墙；大型企业部署通常需要由\
  \ `Juniper` 和 `Cisco` 等公司制造的专有硬件防火墙。\n\n## 了解如何“读取”URL。能够解析 URL 并将协议、主机、顶级域名和本地文件地址元素隔离开，是区分合法网站和危险网站的重要工具。\n\
