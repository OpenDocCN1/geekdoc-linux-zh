  \ Linux 内核默认保护。\n2. 开源软件几乎不会包含恶意软件。\n3. Linux 免费使用。\n4. 大多数（如果不是全部）软件将来自精选仓库。\n\n\
  \n\n\n如果基础原理很简单，那么在由日益强大的计算机统治的世界里，让它们工作的问题占据了世界上最伟大的智脑数多年。早期的计算机，如布莱切利园的 `Colossus`，专门为了解密传输而创建的。\n\
  \n我怀疑幼稚的替换密码在 `Colossus` 面前没有机会。现代加密算法产生的结果复杂得多，当使用得当时，产生的文本对目标接收者以外的人无效。\n\n###\
  \ 加密方法\n\n对于数据加密有三种通用方法：对称加密、非对称加密以及两者的混合。对称加密在加密和解密步骤都需要一个秘密（或私有）密钥。如图 5.1 所示，你可能拥有一个想要安全地发送给一组同事的文件。在你的这边，你将使用软件创建一个密钥，其内容会将文件的每个字符转换为其他形式。如果你显示文件的加密版本，它将由不可读的乱码组成。你可以通过不安全的网络地传输加密文件，并相信没有人能利用它。然而，在你的同事解密它之前，他们需要拥有该密钥的精确副本，他们可以使用自己的软件将文件还原为可读的表格。\n\
  \n![图中显示了典型的对称加密和解密过程。](img/61406.png)\n\n图 5.1 典型的对称加密和解密过程\n\n这就是对称加密的主要缺点，因为以一种保护其完整性的方式往返发送包含密钥的文件是很复杂的。最终某人一定会出错，将其作为未加密的消息发送，或者将其留在被盗的\
  \ USB 闪盘上。一旦密钥的副本离开了信任手，它被用于加密的每一个文档都会变得脆弱。\n\n非对称加密不需要共享共同秘密以及它们带来的麻烦。相反，每个参与者将拥有自己唯一的私有密钥，该密钥由加密框架（如\
  \ `OpenSSH`）生成，并永久安全地留在用户的计算机上。同时，加密软件还会生成一个数学上相关的公密钥，可以安全地与连接者共享。在一种变体中，如图 5.2\
  \ 所示，原始文档使用接收者的公密钥加密，由于它是公密钥，可以无风险传输。在接收者计算机上进行的解密只有在接收者私有密钥的帮助下才能进行。\n\n![图中显示了如何使用接收者的公密钥加密并稍后解密文件。](img/61415.png)\n\
  \n图 5.2 接收者的公密钥用于使用两个私密钥加密并稍后解密文件。\n\n发送者的私有密钥也可以用于对文档应用数字签名，然后可以在发送者公密钥的帮助下进行解密。该公密钥现在由接收者所有，证明了文档确实是由合法的发送者签名的。参见图\
  \ 5.3 查看其可视化效果。\n\n![图中显示了如何使用发送者的公密钥加密并稍后解密文件。](img/61424.png)\n\n图 5.3 发送者的公密钥用于使用两个私密钥加密并稍后解密文件。\n\
  \n像对称加密一样，它的非对称亲戚也有自己的缺点：将所需的算法应用于大量移动数据所需的计算强度可能会减慢交换。为了允许更高效的安全操作，大多数现代连接系统将使用对称和非对称工具的混合——或混合。初始密钥交换将使用完全非对称连接进行，而随后的数据将使用该原始密钥通过计算密集程度的对称加密进行传输。\n\
  \n在任何情况下，这一切通常都会无形地发生，由你选择的软件自动管理。\n\n\n\n正如我之前提到的，哈希和加密之间存在差异。例如，哈希是单向的。这意味着，你可以根据数据创建哈希值，但无法从哈希值中还原出源数据。这意味着你无法使用哈希来隐藏数据，并让远程接收者能够检索这些数据。\n\
  \n那么，你**可以**在哪里使用哈希呢？哈希是存储密码等身份验证信息的绝佳工具。当你为在线服务创建账户和密码时，如果实际密码对服务的管理员是可见的，那将是一个糟糕的做法。这就是为什么——在理想情况下——客户支持人员无法告诉你你忘记的密码是什么。\n\
  \n相反，在线软件会创建你密码的哈希值并将其存储在系统中。当你下一次登录时，系统会针对你输入的密码创建一个新的哈希值，并将其与从原始密码生成的哈希值进行比较。如果它们匹配，你就可以进入系统。\n\
  \n### 什么是区块链？\n\n顾名其名，区块链是一个数据块链，可以作为交易记录，并在以后用于记录和确认交易的真实性。其核心思想是提供一种类似于会计账本的功能，但通过分布式共识的形式进行持续审计。\n\
  \n其工作原理如下：一笔交易会生成一个包含基于交易详情加密哈希的数据块。区块链网络上的第二台计算机会读取第一个区块的完整内容，根据该内容计算一个新的哈希值，并创建一个包含该哈希的新区块。网络的后续成员将根据之前的区块添加更多区块。图\
  \ 5.4 是该过程的可视化。\n\n![该图显示了区块链交易的逐步表示。](img/61436.png)\n\n图 5.4 区块链交易的逐步表示\n\n这种哈希链为我们带了实际上是不可破译的验证。如果日后有人尝试更改交易细节——也许为了声称他支付了价值百万美元的商品而非仅仅五十万——原始区块的哈希值将发生巨大变化。这将导致整个链条失效，因为后续每个区块的哈希值将不再有效。\n\
  \n区块链最初被构想为可靠管理第一种加密货币：比特币的方法。从那时起，它被用于验证在分布式网络上执行的日益广泛的金融和机构交易。\n\n从安全的角度来看，区块链技术可以增强合法交互的可靠性、隐私性和安全性。然而同样，它们在为犯罪组织提供隐私和匿名性方面同样有效。我猜这就是技术运作的方式。\n\
  \n### 加密技术\n\n我承认，在本章目前为止我们看到的所有内容都有些抽象。但现在你已经理解了加密和加密哈希是如何工作的，是时候看看一些你可以使用的实用工具，来增强你自己的安全防护了。\n\
  \n首先是 VeraCrypt，一个用于在存储驱动器上加密数据的免费实用程序。除了免费之外，VeraCrypt 还有很多值得喜欢的地方。首先，它支持 Windows、macOS\
  \ 和 Linux。其次，它可以用于加密整个驱动器、单个分区或单个文件系统。但它能够将文件系统作为虚拟存档嵌入到单个文件中，这一事实使其变得很有趣。\n\n容器虚拟化在计算世界并不新鲜。这种想法即说服几个目录容量的文件认为它们确实在自己的物理计算机上是独立自足的，并可以使用它来启动和运行虚拟操作系统会话，这虽然很棒，但现在看来有点无聊。但\
  \ VeraCrypt 的虚拟容器是对该概念的创造性转化，因为它们可以为特别敏感的数据提供额外层的保护，即它们所谓的“合理的否认（plausible deniability）”。\n\
  \n你担心某一天会被迫违背意愿放弃系统密码吗？强迫就是强迫，你通常对此无能为力。但假设你的主系统密码仅提供对你 `some` 数据的访问呢？如果你能将特别敏感的数据保留在自己的容器中，并由完全不同的密码保护呢？这就是你使用\
  \ VeraCrypt 容器可以做到的。坏人可能永远不知道这样一个容器的存在，即使他们发现了它，获取密码也会多出一道阻碍。\n\nLinux 计算机上的驱动器可以使用\
  \ eCryptfs 进行保护。例如，Ubuntu 在安装过程中会为你提供一个使用 eCryptfs 加密新驱动器的选项。在驱动器生命周期的任何时候对现有驱动器进行加密也是可行的。eCryptfs\
  \ 特别灵活，因为它允许你加密单个文件或与单个用户账户相关的所有文件，而不是整个驱动器。对于计算机（例如 Web 服务器）将被不同`classes`（类别）的用户访问的场景，这可能尤为有用。\n\
  \n| ![note](img/note.jpg) | 如果你在一个较大的系统中选择特定的单个目录树进行加密，请确保你没有遗漏任何应该被选中的内容。考虑到这一点，请记住让\
  \ eCryptfs 加密任何活动交换分区（使用 `ecryhptfs-setup-swap` 命令），因为它们通常包含来自你加密文件系统的明文版本文件。 |\n\
  \n`cryptsetup` 是一个用于基于 Linux 内核的 dm-crypt 磁盘加密系统的命令行界面。你将 `cryptsetup` 应用于干净的、新格式化的驱动器。`cryptsetup`\
  \ 特别适用于加密移动数据。加密后的驱动器可以在任何安装了该软件的主机上挂载和编辑。这种技术非常适合的场景可能是你旅行时需要安全地携带数据。由于你将在到达地的服务器上工作，你不想带自己的笔记本电脑。准备一个外部硬盘或\
  \ U 盘，并将数据加密后保存其中，是一个安全且简单的选择。\n\n静态加密（encryption-at-rest）拼图的最后一块是云存储问题。公共云平台如 Amazon\
  \ Web Services（AWS）和 Microsoft Azure——以及纯存储服务的 Dropbox 和 Google Drive——是管理可用可用数据的廉且高效的工具，但它们也需要安全规划。\n\
  \n以 AWS 密钥管理服务（KMS）为例，它允许你管理存储在例如其简单存储服务（S3）上的数据时强加密密钥的使用。你甚至可以将 `KMS` 密钥的使用扩展到上传\
  \ `S3` 之前的本地资源。\n\n## 总结\n\n防止数据受到未经授权访问的最最终方法是通过加密来对其进行模糊处理——使其在没有解密密钥的情况下无法读取。\n\
  \n可接受的加密标准必须不断改进，以跟上更强大的计算技术及其暴力破解加密密钥的能力。\n\n\n\n\n\n你选择的加密类型取决于你使用数据的方式，包括数据可能面临的风险水平。\n\
  \n敏感的身份信息可以使用哈希值（hashes）存储在服务器上，但对于必须检索的数据来说，并不合适。对于这类数据，对称或非对称加密的效果更好。\n\n哈希被用作区块链的核心元素。\n\
  \n## 回归基础\n\n**理解对称加密、非对称加密和混合加密工具的基本原理。** 对称加密涉及数据发送方和接收方都拥有的共享密钥。非对称加密通过私钥和公钥的组合工作，消除了共享私钥的需求。混合加密会在单个事务中结合对称和非对称方案，以平衡安全性和效率。\n\
  \n**明确哪些需要加密。** 评估你的数据面临的风险、访问需求，以及任何可以将文件系统与整个硬盘分离的方法。\n\n**理解加密与密码哈希之间的区别。** 加密使用密钥将明文转换为密文。该密钥（或其子集）随后可以用于恢复原文。哈希是一个单向过程：原始文本无法恢复。哈希的价值在于它们可以用于存储密码，以便日后确认匹配。\n\
  \n**理解区块链的基本原理和用途。** 区块链是交易的哈希记录，由于其“区块”的分布式来源，实际上几乎无法更改。除了可靠性外，它们还允许高水平的匿名性。\n\n\
  **注意加密软件软件包的基本功能。** `VeraCrypt` 可以加密整个硬盘或单个文件系统——包括通过在文件系统中创建一个虚拟容器，来保护子目录和文件。基于\
  \ Linux 的硬盘、单个分区或移动设备的加密可以使用 `eCryptfs` 或 `cryptsetup` 进行管理。云端数据存储可以使用云服务提供商的系统或开源软件包\
  \ `Cryptomator` 进行加密。\n\n## 复习题\n\n你可以在附录中找到答案。\n\n1. 下列哪项描述描述了解密过程？\n    1. 将加密密钥应用于密文以将其还原为可读格式\n\
  \    2. 将加密密钥应用于明文以使文本变得不可读\n    3. 在明文包在远程网络位置之间传输时对其进行模糊处理\n    4. 提高涉及文本应用程序的网络传输效率\n\
  \n2. 必须提前将你的单个私有加密密钥副本手动发送给接收方，这是哪类加密的特征？\n    1. 混合加密\n    2. 非对称加密\n    3. 双工加密\n\
  \    4. 对称加密\n\n3. 与替代方案相比，非对称加密最大的潜在缺陷是什么？\n    1. 它需要通过远程传输暴露私钥。\n    2. 维护长时间远程会话消耗资源。\n\
  \    3. 用于非对称加密的加密算法较弱。\n    4. 非对称加密需要更多的人工输入。\n\n4. 下列哪项最能描述哈希？\n    1. 非对称加密数据的解密\n\
  \    2. 使用复杂算法对数据进行可逆模糊\n    3. 使用复杂算法对数据进行不可逆模糊\n    4. 将多个加密密钥合并为单个数字签名的过程\n\n\
  5. 尽管有安全优势，为什么你可能不想加密笔记本电脑硬盘？\n    1. 在软件或硬件故障的情况下，加密硬盘可能访问。\n    2. 加密会显著减慢笔记本电脑的操作。\n\
  \    3. 加密占用大量磁盘空间。\n    4. 加密很复杂，需要大量的背景知识才能正确执行。\n\n6. 区块链在哪些用途中特别有效？（选择两个）\n\
  \    1. 允许零售交易处理得更快\n    2. 加强数字交易的可靠性和安全性\n    3. 实现加密货币的有效使用\n    4. 加强身份密码的使用\n\
  \n7. 下列哪项最能描述区块链中的“链”\n    1. 区块链交易可以很容易追溯到发起交易的人\n    2. 使用特定区块链技术执行的所有交易都相互关联\n\
  \    3. 区块链中“区块”内包含的任何单个哈希在不影响其他哈希的情况下都无法更改\n    4. 区块链依赖于全栈安全软件\n\n8. 下列哪种软件包可以跨平台使用，以加密单个分区上的数据？\n\
  \    1. `dm-crypt`\n    2. `VeraCrypt`\n    3. `BitLocker`\n    4. `eCryptfs`\n\n\
  9. 为什么你应该考虑加密在计算机上可能配置的任何交换文件（swap files）？\n    1. 如果可能，所有数据都应该加密。\n    2. 交换文件可能包含明文形式的隐私信息。\n\
  \    3. 交换文件是恶意软件的频繁来源。\n    4. 未加密的交换文件可能会降低服务器性能。\n\n# 第 6 章：加密你的传输中数据\n\n![image](img/clogo.jpg)\
  \ 在你在第 2 章](#c02.xhtml)（“什么是漏洞和威胁？”）中遇到的威胁类别中，包括针对数据在网络主机之间移动时所로攻击。你可以将自己的 PC 或服务器构建成带有吊桥、加固门楼和毒液城河的数字中世纪城堡，但一旦你的部分数据通过大门送出去，它们就变得孤立无援且脆弱不堪。\n\
  \n除非，当然，你带着自己的盔甲发送到世界上。目前，对于传输中的数据，最好的保护就是某种形式的加密——其工作方式与你在上一章看到的静态数据加密非常相似。因此，与其使用\
  \ `Telnet` 等过时工具与远程主机建立明文终端连接，你将使用通过 `OpenSSH` 等软件包实现的加密的安全 Shell (`SSH`) 协议。而且，与其使用古老的文件传输协议\
  \ (`FTP`) 或史前级的传真技术（这些技术早在 19 世纪 60 年代就作为“传真”存在），你将使用加密变体，如 SSH 文件传输协议 (`SFTP`)\
  \ 或提供安全传真传输的服务。\n\n但本章的重点将是你可以如何加密以下内容：\n\n* 网站和客户端浏览器之间传输的数据\n* 电子邮件内容\n* 通过虚拟专用网络\
  \ (VPN) 浏览时产生的数据\n* 从远程仓库下载的软件软件包\n\n\n\n\n\n使用不安全的超文本传输协议（HTTP）的浏览器连接将始终使用明文，而该协议的安全版本——超文本传输安全协议（HTTPS）提供了加密连接。HTTPS\
  \ 连接使用传输层安全（TLS）协议。在支持的情况下，你可以通过在地址前加上 `https` 来指定安全连接，例如使用 [`amazon.com`](https://amazon.com)\
  \ 而不是 [`amazon.com`](http://amazon.com)。然而，无论你使用何种前缀，大多数网站现在都会自动将你重定向到加密页面。这是一场由安全专家参与的战斗，并且在很大程度上已经取得了胜利。\n\
  \n| ![note](img/note.jpg) | TLS 设计用于取代现在已废弃且不安全的安全套接层（SSL）协议。但旧习难改：你经常仍听到技术人员将现代网站加密称为“SSL”。当然，他们真正的意思是\
  \ TLS。 |\n\n但在两种情况下，理解安全站点与不安全站点之间的区别至关重要。第一种是你作为网站所有者设计网站架构时。特别是如果你计划建立一个较小的非商业网站，你可能会倾向于选择更简单的路径使用\
  \ HTTP。不要这样做。正如我们很快看到的，为你的网站添加企业级加密比你想象的要简单得多。而且依赖 HTTP 连接可能产生后果，即使对于简单的操作也是如此。\n\
  \n第二种情况是你作为消费者考虑与商业网站交互以进行购买或处理个人信息时。在交出信用卡或健康信息之前，你*必须*确保你的连接是加密的。如果 `https` 不是网站地址的一部分，地址旁边没有出现锁锁图标，或者你的浏览器向你发出“证书错误”警告，那么你应该假设出现了某种问题。这可能是暂时的配置错误，也可能是你访问的网站是伪的。但继续该会话绝对是不安全的。\n\
  \n在确认你构建的网站已妥善加密之前——或者如果你是一个担心第三方网站完整性的访问者——你可以使用像 SSL Server Test ([`www.ssllabs.com/ssltest`](https://www.ssllabs.com/ssltest))这样的在线服务。将网站地址提交此类服务将返回一份关于加密设置质量的报告，其类似于图\
  \ 6.1 所示。\n\n![该图显示了说明 bootstrap-it.com 网站 TLS 配置的成功 SSL 报告截图。](img/61520.png)\n\
  \n图 6.1 对 bootstrap-it.com 网站 TLS 配置的成功 SSL 报告\n\n### 网站加密的工作原理\n\n基本原理是，除非浏览器确信它连接的服务器是可靠的，否则它不会加载应该是加密的页面。如何为新连接建立这种信任呢？该系统取决于可靠且被广泛接受的公共证书机构（CA）的存在。CA\
  \ 是一家向能够证明其合法的网站颁发加密证书的公司或组织。一旦获得确认，CA 会将其证书发送给网站管理员，由管理员随后将其安装在服务器上。\n\n所有知名的网络浏览器都默认预装了代表主流\
  \ CA 的根证书。正如你从图 6.2 所示，当你将浏览器指向一个网站时，浏览器会询问服务器是否具有由证书机构颁签的有效证书，并检查该密钥是否与浏览器上存储的\
  \ CA 公钥匹配。根据服务器的公钥，浏览器将向服务器发送一个新的加密会话密钥回该该密钥将用于会话剩余的传输，加密数据包将在两端根据需要解密。\n\n![该图说明了客户端浏览器与支持\
  \ TLS 的网络服务器之间的对话。](img/61531.png)\n\n图 6.2 客户端浏览器与支持 TLS 的网络服务器之间的对话\n\n| ![note](img/note.jpg)\
  \ | 为了应对会话密钥被破解的风险——这甚至危害之前会话的数据传输——可以应用完全正向密钥（PFS）。我们担心的破解可能涉及服务器私钥的泄露。如果多个会话使用同一个会话密钥，那么与所有会话相关的数据（可能溯到几个月前）都变得脆弱。由于启用\
  \ PFS 的配置为每个新会话生成唯一的会话密钥，损害可以被大大限制。PFS 目前在 TLS 中广泛使用但并非通用。 |\n\n这对于使用受认可 CA 颁发证书的网站效果良好。但有时你可能希望成为自己的\
  \ CA 并颁发私有的、自签证书。这对于维护由世界各地团队成员访问的内部网站的组织有时效果良好。因为你希望他们都愿意信任自己的 IT 部门，所以他们不需要来自知名机构的\
  \ CA 证书。\n\n问题是，你团队成员在电脑上使用的浏览器对你的 CA 一无所知，因此无法与你组织的站点建立安全连接。为了让其运行，你将要求用户在第一次访问时，点击浏览器显示的“添加异常”、“仍然继续”或“继续访问此网站（不推荐）”警告。这将导致浏览器将你的自签证书添加到其配置文件中，让你的用户在下次访问时直接进入。\n\
  \n你的 TLS 证书看起来像什么样？首先需要知道——如你从示例 6.1 所示——它是格式化的文本。标准要求包含主体身份（颁发证书的机器或组织）、颁发者（CA）、证书有效的日期、由\
  \ CA 颁发的序列号以及密钥本身。\n\n**列表 6.1:** 示例自签根证书（感谢来自：[`en.wikipedia.org/wiki/X509`](https://en.wikipedia.org/wiki/X509))\n\
  \n```\n Certificate:\n    Data:\n        Version: 3 (0x2)\n        Serial Number:\n\
  \            04:00:00:00:01:15:4b:5a:c3:94\n        Signature Algorithm: sha1WithRSAEncryption\n\
  \        Issuer: C=BE, O=GlobalSign nv-sa, OU=Root CA, CN=GlobalSign Root CA\n \
  \       Validity\n            Not Before: Sep  1 12:00:00 1998 GMT\n           \
  \ Not After : Jan 28 12:00:00 2028 GMT\n        Subject: C=BE, O=GlobalSign nv-sa,\
  \ OU=Root CA, CN=GlobalSign Root CA\n        Subject Public Key Info:\n        \
  \    Public Key Algorithm: rsaEncryption\n                Public-Key: (2048 bit)\n\
  \                Modulus:\n                    00:da:0e:e6:99:8d:ce:a3:e3:4f:8a:7e:fb:f1:8b:\n\
  \                    ...\n                Exponent: 65537 (0x10001)\n        X509v3\
  \ extensions:\n            X509v3 Key Usage: critical\n                Certificate\
  \ Sign, CRL Sign\n            X509v3 Basic Constraints: critical\n             \
  \   CA:TRUE\n            X509v3 Subject Key Identifier:\n                60:7B:66:1A:45:0D:97:CA:89:50:2F:7D:04:CD:34:A8:FF:FC:FD:4B\n\
  \    Signature Algorithm: sha1WithRSAEncryption\n         d6:73:e7:7c:4f:76:d0:8d:bf:ec:ba:a2:be:34:c5:28:32:b5:\n\
  \         ...\n```\n\n\n\n\n\n从以前，某些管理员因为复杂性而避免对他们的网站应用加密。另一些——特别是对于较小的网站——可能会被\
  \ CA（证书颁发机构）收费用劝退。得益于一项成功的行业倡议，这些不再是理由。\n\n自 2013 年以来，数十家大型科技公司一直合作支持非营利的互联网安全研究小组（Internet\
  \ Security Research Group），其使命是“减少互联网安全通信的财务、技术和教育障碍”。它的第一个项目是 Let’s Encrypt 证书颁发机构\
  \ ([`letsencrypt.org/`](https://letsencrypt.org/))，作为一个 CA，它免费提供无限量的证书。\n\n安装 Let’s\
  \ Encrypt 证书的流程在某些情况下已经整合到第三方平台的设置脚本中。但即使你运行自己的网站，你也可以使用开源工具 `Certbot` 来自动化安装。`Certbot`\
  \ 是电子前疆基金会（Electronic Frontier Foundation）的一个项目，还可以自动续订 Let’s Encrypt 证书（其有效期仅为\
  \ 90 天）。图 6.3 显示了你如何告诉 `Certbot` 网站 ([`certbot.eff.org/`](https://certbot.eff.org/))\
  \ 你正在运行什么软件以显示详细指令。\n\n![该图显示了 Certbot 网站上安装说明的截图。](img/61541.png)\n\n图 6.3 Certbot\
  \ 网站上的安装指令\n\n安装 `Certbot` 本身只需要几步，而请求、安装和配置证书的复杂操作（至少在运行 Apache 的 Ubuntu Linux\
  \ 服务器上）仅需这条单一命令：\n\n```\n$ sudo certbot --apache\n```\n\n你会被要求识别想要颁发证书的域名，软件将处理所有细节。\n\
  \n## 电子邮件加密\n\n保护你的网页浏览活动很重要，但这些并不是你所做的唯一涉及在不安全网络上传输敏感数据的操作。电子邮件消息以及你经常包含其中的附件的安全性对你和你的组织来说至少同样重要，因此你应该了解一些加密它们的工具。\n\
  \n### GNU Privacy Guard\n\nGNU Privacy Guard (`GPG` 或 `GnuPG`) 是一种用于安全加密文件的软件。`GPG`\
  \ 符合 OpenPGP 系统。反过来，OpenPGP 是受限的 Pretty Good Privacy（`PGP`）程序的开源实现。这些标准、系统和程序的混杂——更不用说那些缩写——是技术演变的结果。`PGP`\
  \ 最初在 20 世纪 90 年代发布，供非商业用途免费，但法律以及最终的商业考量导致了它的私有化。OpenPGP 是定义 `PGP` 加密使用的标准，而 `GPG`\
  \ 是作为该标准的免费实现而创建的。\n\n无论你选择哪个版本，你都会使用 `PGP` 加密文件，目标将其传输给接收者，由对方解密并读取（使用公/私密钥对的私半部分）。`PGP`\
  \ 通常会使用接收者的公钥加密文件，该系统与我们已经看到的 `TLS` 使用的公钥过程相似。基于 OpenPGP 标准的加密可以通过添加诸如 `Enigmail`\
  \ ([`enigmail.net/index.php/en/`](https://enigmail.net/index.php/en/)) 等加密扩展，添加到运行在任何现代操作系统上的开源电子邮件客户端（如\
  \ Mozilla 的 `Thunderbird`）中。\n\n### Gmail 会加密你的邮件吗？\n\n是的，它会。但话又回来，它也不会。我的意思是：Google\
  \ 确实会对它们传输于你的账户与其他 Gmail 账户之间或发送到其他符合 `TLS` 的邮件提供商的邮件应用 `TLS` 加密。一些较小的私人提供商可能没有实现\
  \ `TLS`，因此与它们的通信显然不会受到保护。\n\n但一旦邮件到达 Gmail 服务器，加密就会停止。如果事实并非如此，那么 Gmail 机器将无法读取你的邮件并应用垃圾邮件和钓鱼攻击过滤——更不用说为你提供智能回复建议（或向你“投放”广告）。通过在\
  \ Gmail 浏览器客户端中使用诸如 `FlowCrypt` ([`flowcrypt.com/`](https://flowcrypt.com/)) 的浏览器扩展，在消息到达\
  \ Gmail 服务器之前对其加密，就可以实现真正的端到端加密。\n\n## 使用 VPN 连接和软件存储库\n\n虚拟专用网络（`VPNs`）和软件仓库并不是一个可以放在同一个章节中的显而易见的组合，但我将在这里解释它们的作用。首先，为了确保我们达成共识，`VPN`\
  \ 是一种将单个私有网络扩展到不安全的公共网络的技术，而不会损害往来数据的安全性。软件仓库是一个在线网站，托管以特定格式存储的软件包存档，这种格式便于更新和下载。Linux\
  \ 发行版以提供方便访问包含数千个开源软件包的精选软件存储库而闻名。\n\n现在，尽管它们存在差异，它们有什么共同点？我确定你已经猜到了，它们都受益于通过某种加密技术隐藏传输中的数据。\n\
  \n### 使用 VPN 保护你的操作\n\n在 `VPNs` 的情况下，目标是让敌对视线看不到你的数据。启动 `VPN` 涉及首先在你的本地网络和远程端点之间建立安全网络连接。一旦建立，连接就可以作为一个`tunnel`（隧道），你的数据可以通过它安全传输。创建初始连接的热门技术包括\
  \ `OpenSSH`、`TLS` 和 IP 协议安全 (`IPsec`）。图 6.4 显示了一个简单的 VPN 连接。\n\n![图显示了典型的 VPN 如何通过隧道连接。](img/61550.png)\n\
  \n图 6.4 通过隧道运行的典型 VPN\n\n如果你觉得可以信任它，可以使用互联网上的一个公共 VPN 服务。或者你可以使用 `OpenVPN` 等软件构建自己的。为什么要费这些精力呢？这里我介绍一些常见的用例。\n\
  \n如果你经常旅行并通过多个 WiFi 接入点连接互联网，你可能不想让你的浏览活动暴露在可能不安全的网络上。同样，你可能并不完全信任自己的互联网服务提供商会尊重你的隐私并妥保护你的数据。在这种情况下，你会希望使用\
  \ `VPN` 登录到远程代理服务器，以向未经授权的视线隐藏你的活动。你可以使用公共 VPN 提供商而不是创建和维护自己的，但只需确保该提供商本身是安全可靠的。\n\
  \n如果你的组织在多个地理位置处理敏感操作和数据，你可能需要一种让你的团队成员远程连接并访问资源的方法。在站点之间建立 `VPN` 连接在配置恰当的情况下是解决此问题的极佳方法。\n\
  \n如果你不确定供应商如何处理游戏机或智能电视产生的数据，可以在家用路由器上配置 `VPN`，以屏蔽传输中的数据并在某种程度上控制其使用方式。此类 `VPN`\
  \ 还可以允许用户绕过访问内容的地理限制。请注意，为此目的使用 `VPN` 可能会违反当地法律或合同条款。\n\n\n\n\nVPN 的处理起来非常复杂，要对其正确配置并不总是易事。这里有一份快速指南，教你如何在运行\
  \ Ubuntu 20.04 的云实例上使用 Wireguard VPN 构建一个基础版 VPN。Wireguard 近期引起了广泛关注，特别是在被接收到 Linux\
  \ 主线内核之后。它速度快、代码库非常整洁，而且操作相对简单。\n\n首先，你需要为你的云实例开启 `51820` 端口。在 `AWS EC2` 上，你可以通过安全组规则来实现。这就是你需要的全部底层基础设施。\n\
  \n接下来的步骤将在服务器实例本身上进行。为了让请求能够自由地通过服务器传输，你需要取消 `/etc/sysctl.conf` 文件中 `net.ipv4.ip_forward=1`\
  \ 一行的注释。然后运行此命令来更新环境：\n\n```\nsudo sysctl -p\n```\n\nWireguard 现在是主流 Debian 仓库的一部分，因此只需运行\
  \ `apt install wireguard` 即可完成。你需要生成一对私钥/公钥对，用于操作你的隧道。该命令会方便地在 `/etc/wireguard/`\
  \ 目录下创建密钥。完成后，请记录 `privatekey` 和 `publickey` 文件的内容，以便将它们添加到配置中。这将在创建和编辑 `.conf`\
  \ 文件时完成。你可以将其命名为 `wg0.conf`。\n\n```\nsudo wg genkey | sudo tee /etc/wireguard/privatekey\
  \ \\\n  | wg pubkey | sudo tee /etc/wireguard/publickey\nsudo nano /etc/wireguard/wg0.conf\n\
  ```\n\n该文件的内容可能所示。VPN 将将在 `10.0.0.0/24` 子网上运行，服务器地址为 `10.0.0.1`。你告诉 Wireguard 监听\
  \ `51820` 端口。请确保用你刚刚创建的私钥实际值替换 `<SERVER_PRIVATE_KEY>`。`PostUp` 和 `PostDown` 行定义了\
  \ VPN 的网络设置。\n\n```\n[Interface]\nAddress = 10.0.0.1/24\nSaveConfig = true\nListenPort\
  \ = 51820\nPrivateKey = <SERVER_PRIVATE_KEY>\nPostUp = iptables -A FORWARD -i %i\
  \ -j ACCEPT; iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE\nPostDown = iptables\
  \ -D FORWARD -i %i -j ACCEPT; iptables -t nat -D POSTROUTING -o eth0 -j MASQUERADE\n\
  ```\n\n完成后，你可以使用 `wg-quick` 指向 `.conf` 文件中设置的 `wg0` 配置来启动 VPN 本。如果你愿意，可以使用 `systemctl\
  \ enable` 设置服务在重启时自动启动。\n\n```\nsudo wg-quick up wg0\nsudo systemctl enable wg-quick@wg0\n\
  ```\n\n现在回到你的客户端。Android Play Store 和 iOS App Store 都有官方的 Wireguard 应用，Windows 机器的应用也可以直接从\
  \ Wireguard 网站（`wireguard.com/install`）下载。但那样有什么趣呢？让我向你展示如何将你的 Linux 笔记本电脑或 PC 配置为\
  \ Wireguard 客户端。\n\n在客户端上，按照在服务器上相同的方法安装 Wireguard 并生成密钥。你还需要创建一个 `wg0.conf` 文件：\n\
  \n```\nsudo apt install wireguard\nsudo wg genkey | sudo tee /etc/wireguard/privatekey\
  \ \\\n  | wg pubkey | sudo tee /etc/wireguard/publickey\nsudo nano /etc/wireguard/wg0.conf\n\
  ```\n\n它看起来可能像这样。记得用你刚刚在客户端创建的 `/etc/wireguard/privatekey` 文件的值替换 `<CLIENT_PRIVATE_KEY>`，用你之前在服务器上生成的公钥值替换\
  \ `<SERVER_PUBLIC_KEY>`，用云实例的公网 IP 地址替换 `SERVER_IP_ADDRESS`。\n\n```conf\n[Interface]\n\
  PrivateKey = <CLIENT_PRIVATE_KEY>\nAddress = 10.0.0.2/24\n\n[Peer]\nPublicKey =\
  \ <SERVER_PUBLIC_KEY>\nEndpoint = <SERVER_IP_ADDRESS:51820>\nAllowedIPs = 0.0.0.0/0\n\
  ```\n\n回到服务器，你需要将客户端信息添加到正在运行的 Wireguard 接口。操作方法如下（用客户端的实际公钥替换 `<CLIENT_PUBLIC_KEY>`）。注意你为客户端设置的本地\
  \ IP 地址 `(10.0.0.2)` 是在何被引用的。\n\n```\nsudo wg set wg0 peer <CLIENT_PUBLIC_KEY> allowed-ips\
  \ 10.0.0.2\n```\n\n现在回到客户端。运行此命令根据 `wg0.conf` 配置启动 Wireguard：\n\n```\nsudo wg-quick\
  \ up wg0\n```\n\n你现在应该一切就绪。运行 `ip addr` 应该会显示一个活跃的 `wg0` 接口，以及你设置的 IP：\n\n```\n\
  $ ip addr\n7: wg0: mtu 1420 qdisc noqueue state UNKNOWN group default qlen 1000\n\
  \    link/none\n    inet 10.0.0.2/24 scope global wg0\n```\n\n\n\n\n### 理解网站加密的工作原理\n\
  证书颁发机构为网站颁发证书，该证书在安装后将用于向客户端浏览器确认该网站已加密。`Session keys`（会话密钥）根据证书生成并在整个会话中使用。\n\n\
  ### 理解 TLS X.509 证书的作用和基本结构\n遵循 `X.509` 标准的证书将包含标识证书范围（开始和结束日期）和所有权（发行者和主体）的条目，以及序列号和定义公钥本身的十六进制字符串。\n\
  \n### 理解文件加密的基础\n使用 `PGP` 标准的加密软件使用接收者的公钥对对象进行加密，使得只有拥有该密钥私钥的人才能对其解密。\n\n### 理解如何使用\
  \ VPN 在不安全网络上保护你的活动免受拦截\n`VPN` 是一种将安全的本地网络跨越不信任区域扩展到远程网络的方法。通常，你会首先使用 `SSH` 等底层技术建立安全连接，并将其作为\
  \ `VPN` 活动的隧道。\n\n## 复习题\n你可以在附录中找到答案。\n\n1. 在加密的上下文中，填充网页页的数据最准确的称呼是哪一个？\n    1.\
  \ `Data in transit`（传输中数据）\n    2. `Static data`（静态数据）\n    3. `Data at rest`（静态中数据）\n\
  \    4. `Dynamic data`（动态数据）\n\n2. 以下哪些缩写代表用于传输加密网页的协议？\n    1. `VPN`\n    2. `SFTP`\n\
  \    3. `HTTPS`\n    4. `HTTP`\n\n3. 你如何（相对）确定你访问的网站使用了数据加密？（选择两个）\n    1. 你的浏览器将在页面顶部显示文本确认。\n\
  \    2. URL 地址将以 `https` 开头。\n    3. 页面的文本内容将由你的浏览器以更深、更粗的字体显示。\n    4. 当你尝试加载页面时，浏览器不会显示明显的警告和安全提示。\n\
  \n4. 根证书在浏览器安全中起什么作用？\n    1. 根证书将防止浏览器加载未加密的网页。\n    2. 安装在证书颁发机构 (`CA`) 服务器上的根证书用于在全球范围内验证浏览器请求。\n\
  \    3. 包含在浏览器包中的根证书用于识别服务器上是否存在由 `CA` 颁发的证书。\n    4. 安装在 Web 服务器上的根证书用于确认客户端浏览器的状态。\n\
  \n5. Let’s Encrypt 项目的首要任务是什么？\n    1. 研究新的、更好的网站加密方法\n    2. 维护全球网站加密采用情况的统计数据\n\
  \    3. 尽可能广泛地提供有关加密证书的重要性的信息\n    4. 尽可能免费地提供 `TLS` 加密证书\n\n6. 可以使用什么技术防止会话密钥被不当重用以未经身份验证的情况下访问受保护的数据？\n\
  \    1. `GNU Privacy Guard`\n    2. `OpenPGP`\n    3. `Perfect forward secrecy`（完全前向安全性）\n\
  \    4. `HTTPS`\n\n7. 以下哪些项可以被视为明文协议？（选择两个）\n    1. `FTP`\n    2. `HTTP`\n    3.\
  \ `SSH`\n    4. `HTTPS`\n\n8. SSL Server Test 旨在衡量什么功能？\n    1. 电子邮件服务器加密配置的有效性\n\
  \    2. 网站域名使用的名称服务器的可靠性\n    3. 网站初始证书请求的有效性\n    4. 网站加密配置的有效性\n\n9. `OpenPGP`\
  \ 是什么？\n    1. `PGP` 加密使用的商业实现\n    2. 用于实现 `PGP` 标准的开源标准\n    3. `GPG` 标准的开源实现\n\
  \    4. 一个安全的电子邮件客户端软件包\n\n10. 哪种工具是实现你的 Gmail 邮件端到端加密的第三方工具？\n    1. `FlowCrypt`\n\
  \    2. `GPG`\n    3. `TLS`\n    4. `Thunderbird`\n\n11. 什么是 `VPN`？\n    1. 一种保护私有网络免受外部渗透的网络拓扑\n\
  \    2. 一种安全远程传输和安装应用程序的软件包\n    3. 一种将单一私有网络安全跨越不稳定公共网络的技术\n    4. 防火墙的软件等效物\n\n\
  12. 哪项最能描述网络隧道？\n    1. 一种允许双工传输的“网络中的网络”\n    2. 一种物理连接多个设施资源的有线网络扩展\n    3. 描述虚拟专用网络的常用方式\n\
  \    4. 可供辅助进程利用的现有安全远程网络连接\n\n13. 你如何确保下载的软件包在传输过程中没有被篡改或替换？\n    1. 通过将源网站上的校验和与你对下载的文件上生成的校验和进行比较\n\
  \    2. 仅从可靠来源获取你的软件\n    3. 在安装新软件之前对其进行恶意软件测试\n    4. 通过使用防火墙在下载软件时关闭你的网络连接\n\n\
  # 第 7 章\n风险评估\n\n![image](img/clogo.jpg) 当我们向 IT 专业人员教授风险管理主题时，我们实际上是在向他们展示如何入侵私有系统、获取私有数据并对尽可能多的私有资源造成最大的混乱和破坏。\n\
  \n等等。\n\n公开教授危险的技能真的是好主意吗？你敢认为。因为这是准备管理员保护系统免受他们早晚一定会面临的攻击的最佳——可能也是唯一的方法。\n\n事实上，定期对你自己的基础设施进行激进的网络攻击是非常重要的，以至于在你的业务被认证为可以在某些行业内运营之前，这通常是强制要求的。例如，在你能成功通过使用支付卡行业数据安全标准\
  \ (`PCI-DSS`) 目标的审计之前，你的银行可能不允许你通过你的网站处理信用卡。\n\n全面的 IT 风险评估将帮助你理解系统的弱点，但实现这一目标需要经过几个步骤。你需要执行以下操作：\n\
  \n* 扫描互联网以获取可能用于攻击你基础设施的公开信息（`开源情报收集`）。\n* 建立一个最新的已知漏洞定义数据库。\n* 使用这些定义扫描你的基础设施，寻找潜在的软件或配置漏洞（`漏洞测试`）。\n\
  * 查看你是否可以使用未经授权的访问你的基础设施（`渗透测试`）。\n\n虽然任何处理数字资源的人都不应该忽视威胁态势，但执行完整的漏洞和渗透扫描通常会留给专业人士。许多组织会聘请外部顾问来完成这项工作。这在一定是因为他们拥有更丰富的实践经验和必要的行业认证，但也是因为了解自己有多脆弱的最佳方法，就是看一个很少或完全没有“内部”信息的人是否能击败你的防御。\n\
  \n但无论谁来测试你的安全态势，你至少应该了解该行业的基本原理和工具。这些就是我们在本章剩余部分将发酵的葡萄。\n\n\n\n\n\n你可能无法相信，现在有多多少关于你组织的敏感信息正暴露在公共互联网上等待被发现。而且你可能无法相信，是谁把它们放在那里的。剧透一下：是你（以及与你一起工作的同事）。\n\
  \n假设你公司的电子商务应用程序是由一种由复杂技术混杂而成的“秘密配方”构建的。整个系统通过一个不被广泛使用的软件平台连接起来。你认为，这让事情变得更加安全，因为潜在的黑客想要猜测他需要哪些技能才能造成破坏要困难得多。为了进一步保护你们的安全和竞争优势，公司非常谨慎，不会发布太多关于应用程序底层运行机制的细节。而且，所有的管理员和开发人员在看到“皇冠明珠”之前，都必须签署那份\
  \ 25 页的保密协议。\n\n所以，你可能认为在机密性方面你的状态相当不错。但你可能错了。还记得你去年夏天参加的最新一轮招聘吗？你不就是那个花了一整个上午，为你招募的两名新开发者精心撰写那条\
  \ `LinkedIn` 广告的人吗？我确定你现在应该想起来了，尤其是你列出所有希望开发者以前工作过的技术栈的那部分。回想一下你是如何确保该列表包含了你（曾经的）秘密配方中的每一种成分的？\n\
  \n这就是开源情报（`OSINT`）黑客所做的事情。仅需你的公司名称和一个 `LinkedIn` 账号，有人就可以搜索你公司账户历史中的招聘广告，并吸取所有有用的信息。\n\
  \n那里还有什么呢？你的黑客知道你团队某些成员的名字吗？这些名字是否可能与活跃的 `Stack Overflow` 或 `Reddit` 账户关联起来？搜索这些平台以查看从你的开发者正在处理的问题或巧妙解决方案的对话中可以学习到什么，是否困难？\n\
  \n觉得这很可怕吗？等你听听存在的一些免费的自动化侦察工具吧。例如，`Recon-ng` 允许你提供一些基础的识别信息（如公司名称和网站），然后它会独自在互联网上寻找可以发现什么。该软件已经掌握了所有的技巧，在几分钟内覆盖的范围比你花一个月才能完成的还要多。\n\
  \n这一切的意义并不是为了教你如何攻击他人的网站。`Recon-ng` 的创始人 Tim Tomes 并不是一个两个月没洗澡的怪黑客，而是一位广受尊敬且成功的互联网安全专家，为正义的一方而战。这些工具的真正目标是帮助你重建组织的安全态势，让其他人无法攻击你。知道发现关于你组织的这么多信息是如此简单，应该激励你收紧防线，也许还可以改变你向世界展示自己的方式。\n\
  \n除了开源的 `Recon-ng`（[`github.com/lanmaster53/recon-ng`](https://github.com/lanmaster53/recon-ng)），其他\
  \ `OSINT` 工具还包括 `Maltego`（[`www.maltego.com`](https://www.maltego.com)，专有，带有有限用途的社区版）、`Shodan`\
  \ 搜索引擎（[`www.shodan.io/`](https://www.shodan.io/ 可部分免费访问)）、图像搜索工具 `TinEye`（[`www.tineye.com/`](https://www.tineye.com/)\
  \ ），以及一种被称为 `Google Dorks` 的巧妙搜索引擎使用方法（参见 `[`en.wikipedia.org/wiki/Google_hacking`](https://en.wikipedia.org/wiki/Google_hacking)`）。\n\
  \n## 访问公共漏洞数据库\n\n在下一节中，我们将讨论如何针对你的基础设施运行漏洞扫描。现在，“运行扫描”固然很好，但如果你真的不知道自己在寻找什么，那又有多大用呢？这听起来有点像雇了一个人在你度假期间帮你看守房子，却忘记了分享你的地址。所以，这里我将向你展示如何找到并使用一些大型、公开的数据库，里面充满了大量的漏洞定义宝库。\n\
  \n漏洞，正如我们在 `第 2 章`（“什么是漏洞和威胁？”中所看到的，是指你防御中的任何配置错误、疏忽或漏洞，可能导致安全破坏。考虑到已经有数万个已知漏洞——而且每月还有数百个新漏洞被发现——你知道从哪里开始寻找吗？\n\
  \n由于数据和基础设施安全是如此关键的问题，许多公共资助的安全组织维护着漏洞定义数据库，这些数据库可以被扫描系统读取并使用。在适当更新的情况下，你可以相对快速地检查你的操作系统、配置、运行的服务和网络是否存在问题。更，你可以自动化这一过程，以便每周或每月运行扫描，并在检测到严重问题时立即收到警报。\n\
  \n但为了让结果有用，你需要理解这些定义是如何分类的。为了理解这一点，你需要熟悉它们是谁收集的以及它们是如何管理的。在我们开始之前，我应该警告你，将会出现一些严重的缩写，如\
  \ `SCAP`、`ARF`、`CPE`、`SCE`、`CVSS` 和 `TMSAD`。请谨慎操作。\n\n### 漏洞数据框架\n\n它始于美国的国家漏洞数据库（`NVD`），这是美国标准与技术研究院（`NIST`）的一个项目。`NVD`\
  \ 是基于标准的漏洞管理数据仓库，使用安全内容自动化协议（`SCAP`）表示；参见 `[`nvd.nist.gov/`](https://nvd.nist.gov/)`。`NVD`\
  \ 在其网站 `[`nvd.nist.gov/general/nvd-dashboard`](https://nvd.nist.gov/general/nvd-dashboard)`\
  \ 上维护了一个仪表板，你可以在那里按类别查看当前的漏洞统计数据。`图 7.1` 显示了 NVD 的截图。\n\n![图中显示了说明 NVD 仪表板的截图。](img/61511.png)\n\
  \n图 7.1 NVD 仪表板\n\n`SCAP` 框架是一系列标准和协议，可以用于创建和管理自动化漏洞扫描和测量。在英语中，这意味着 `SCAP` 支持一组组织可以在其内部基础设施中自由使用的工具，以定期监控其系统是否存在漏洞。`SCAP`\
  \ 框架充当负责收集、分类和分发新旧漏洞定义，以及针对私有基础设施启动扫描操作的所有部分的组织结构。`SCAP` 是一个任何人在任何地方都可以使用的免费服务。\n\
  \n除了 `SCAP`，开放 Web 应用安全项目（`OWASP`，`https://www.owasp.org`）也是安全评估信息和工具极极来源。\n\n###\
  \ 漏洞数据格式\n\n`SCAP` 工作涉及大量定期更新的数据，这些数据将在不可预测环境中广泛使用。为了方便管理，你希望使用一些精心设计的格式对这些数据进行标准化。以下是一些常用的关键格式：\n\
  \n- **常见漏洞披露 (CVE)：** `CVE` 是安全漏洞和披露的命名标准。每个漏洞都会被分配一个 `CVE` 名称，并作为其标识符，特别是在实施平台内部使用时。\n\
  - **通用平台枚举 (CPE)：** `CPE` 值用于漏洞定义文档的一部分，识别漏洞的目标操作系统和已安装软件包。`cpe:/o:fedoraproject:fedora:22`\
  \ 是指向 Fedora Linux 操作系统的标识符。\n\n\n\n\n\n*   **开放漏洞与评估语言 (OVAL):** OVAL 是一种声明性语言，用于包含和报告系统的配置及安全状态。\n\
  *   **资产报告格式 (ARF):** ARF 可用于将多个 OVAL 结果文件合并为一个数据流。\n\n### 漏洞数据指标\n\n海量自动生成数据存在两个问题：(1)\
  \ 它们数量惊人；(2) 它们让阅读过程变得极其枯燥乏味——事实上，这种阅读体验极其无聊，让你绝对想让计算机替你阅读。虽然你的计算机非常乐意提供帮助，但你仍然需要一种方法以某种格式消耗这些结果，否则整个尝试都将白费于事。\n\
  \n漏洞扫描器可以通过警报或报告的形式呈现其输出，以一种易于理解的格式提供快速摘要。这些报告中最重要的元素是一致地使用评分系统。我们到底在对什么评分？虽然扫描在系统上发现几十个漏洞是很常见的现象，但通常情况下，大多数漏洞都是细微配置选择的结果，甚至是误报。为了帮助你将注意力集中在最紧的安全漏洞上，结果将按严重程度进行排序。一个已经成为活跃攻击目标并获得\
  \ 9 或 10 分的漏洞可能会在输出显示中用亮红色清晰地标记。\n\n该指标是如何工作的？通用漏洞评分系统 (CVSS) 会根据多个因素为每个漏洞分配评分。例如，如果特定漏洞被利用的概率很高（意味着黑客相对容易发现并滥用该漏洞），那么分数就会增加。同样，如果一个利用可能会对你的系统运行产生重大的负面影响，分数会进一步提高。任何超过\
  \ 7 分左右的总分应该引起你的立即关注。\n\n### 漏洞数据管理工具\n\n你可以直接从 NVD 网站下载 NVD 数据（[`nvd.nist.gov/vuln/data-feeds`](https://nvd.nist.gov/vuln/data-feeds)）。但这对你来说可能没太大帮助。毕竟，谁想在计算机屏幕上手动阅读数百兆的、以\
  \ JavaScript 对象表示法 (JSON) 格式的数据呢？相反，你更有可能安装软件，定期且无感地将你已有的数据与 NVD 集合的最新更新进行同步。用于处理这些任务的软件包包括\
  \ OpenSCAP、OpenVAS 和 Nessus。\n\n本章的下一部分将描述漏洞扫描过程。但首先，为了让你对完整的漏洞工具生态系统有一个可视化了解，图\
  \ 7.2 说明了各种标准、协议和工具之间的关系。\n\n![图像显示了 NVD 相关工具的分层图。](img/61520.png)\n\n图 7.2 NVD\
  \ 相关工具的分层图\n\n| ![note](img/note.jpg) | 截至 2019 年 10 月，旧的可扩展标记语言 (XML) 漏洞数据馈已被弃用，改为\
  \ JSON 馈。JSON 馈提供了更多数据点和更高的准确性。 |\n\n### 执行漏洞扫描\n\n在边缘领域，漏洞扫描和渗透测试之间存在某些重叠。它们的最终目标是相同的，并且经常使用一些相同的工具。但在核心，*扫描*是关于使用\
  \ NVD 定义来发现漏洞，而*渗透测试*设计用于查看这些漏洞实际上能被利用到什么程度。因此，在这里我们将讨论被动扫描，并将所有肮脏的黑帽内容留到下一节。\n\n\
  出于许多原因，你——或你聘的 IT 安全专家——可能会在扫描时使用一台新的专用笔记本电脑或一台干净的虚拟机。其一是，你不想冒着让由于之前的任务留在机器上可能任何东西污染你结果的风险。而且，你真的不想冒着让可能居住在你正在扫描的机器上的黑暗怪物污染你自己机器的风险。\n\
  \n由于 Linux 非常擅长虚拟化，而且扫描软件在 Linux 上往往感觉格格不入，Linux 可能会是你的操作基地。事实上，存在一些 Linux 发行版——例如\
  \ Kali Linux——它们已经针对安全操作进行了优化，并预装了许多你将需要的软件工具。\n\n漏洞扫描通常会从一台独立于你目标设备的计算机上运行。尽管如此，你需要在某种程度上拥有网络访问权限。如果你的目标是提供公共\
  \ Web 应用程序的服务器，你应该能够从互联网的任何地方进行扫描。但对于本地机器和后端服务器，你至少必须访问局域网 (LAN)。在某些情况下，为扫描器提供目标的登录凭据也是有意义的\n\
  \n你可能会从开源命令行工具 `Nmap` 开始。`Nmap` 将扫描网络主机——或整个网络——返回详细信息，包括单个主机上开启了哪些网络端口。从你看到的开放端口列表中，你通常会对你扫描的主机上运行的种种软件以及一些可能的漏洞有一个很好的了解。\n\
  \n| ![note](img/note.jpg) | 网络端口是一种标识符，告诉服务器如何处理客户端请求。例如，在网络地址的同时指定端口 `80` 会告诉主机将请求发送到\
  \ HTTP 服务器以加载网站。在浏览器中加载网站。端口 `22` 与网络地址关联时将告诉服务器使用 `OpenSSH` 建立安全连接。当服务器上有服务监听传入请求时，该端口被认为是“开放”的。你通过关闭该软件来“关闭”端口。\
  \ |\n\n有很多软件包包含了包括 `Nmap` 在内的一系列扫描工具。这类产品 `OpenVAS`、`Nessus`、`Nexpose` 和 `Burp Suite`\
  \ 通常是商业性的，但通常提供轻量级的“社区版”。Greenbone 的开源版本 `OpenVAS` 是一个例外，因为它对使用没有限制。除了这些商业产品，`OpenSCAP`\
  \ 项目（[`www.open-scap.org/`](https://www.open-scap.org/））是完全免费的。\n\n那些软件包提供了图形用户界面、相对直观的配置控制和复杂的报告选项。它们将调查你的目标网络中运行着什么，`Apache`、`WordPress`\
  \ 和 `PHP` 等服务器软件是否安装并激活，最重要的是是否存在可见的配置问题或未修补的漏洞。\n\n| ![warn](img/warn.jpg) | 全扫描可能会消耗大量的带宽，导致合法进程缓慢。务必提前确认你计划要做的操作安全且允许。\
  \ |\n\n虽然所有漏洞扫描器都会提供详细的扫描报告，但结果可能并不相同。你可能需要在你的基础设施上测试多个工具，因此，根据结果，你可以决定哪种最适合你的需求，或微调你的扫描配置。\n\
  \n`OpenVAS` 可以在标准的软件仓库中找到且安装方便。然而，设置过程涉及下载成千上万个跨越几十年 IT 历史的漏洞签名，需要时间。完成后，你最好记录下显示的那个非常长的密码。这就是你登录\
  \ `OpenVAS` 浏览器界面时使用的密码。\n\n\n\n\n\n接下来，你可能需要确认一切都配置正确并运行正常。`openvas-check-setup`\
  \ 命令将测试你的配置并报告任何问题。请密切关注此处看到的任何错误信息，如果你不确定如何处理，不要害怕将它们粘贴到网络搜索中。完成所有这些操作后，使用 `openvas-start`\
  \ 启动进程。\n\n```bash\n # apt install openvas\n### openvas-setup\n# openvas-check-setup\n\
  ### openvas-start\n```\n\n如果你想通过远程机器上的浏览器访问 OpenVAS 接口，则需要告诉服务监听来自你客户端 IP 地址的请求。你可以通过编辑\
  \ `/lib/systemd/system/greenbone-security-assistant.service` 文件来实现。以下是 `ExecStart`\
  \ 条目的样式（请修改以反映你的客户端 IP 地址）：\n\n```\n ExecStart=/usr/sbin/gsad --foreground \\\n\
  \   --listen=192.168.1.3 \\\n   --port=443 --listen=192.168.1.3 --mport=9390 \\\n\
  \   --allow-header-host 192.168.1.3 \\\n   --timeout=1440\n```\n\n你使用 `systemctl`\
  \ 使该更改生效，然后运行 `gsad` 命令启动 OpenVAS 监听。从那里开始，将浏览器指向 OpenVAS 服务器的 IP（如果是本地运行则指向 localhost），粘贴你之前保存的那个密码（你**确实**保存了吧？），并开始工作。\n\
  \n```bash\n # systemctl daemon-reload && systemctl restart \\\n   greenbone-security-assistant.service\n\
  ### gsad\n```\n\n## 进行渗透测试\n\n在完成一轮可靠漏洞扫描并获取数据后，你就准备好尝试破解你的目标系统并造成一些破坏了。\n\n也许没那么快。在按下那个“红色大按钮”之前，你应该考虑一下为什么这可能*不是*一个好主意。首先，如果你在没有获得所有者明确书面授权的情况下对目标启动渗透测试工具，你可能会承担刑事责任。穿黑色西装的人员对数字侵入往往非常敏感。更进一步一点：如果你不小心，你可能会在毫无察觉的情况下对目标造成真实且不可逆的损害。最后，并不是所有的用例都一定需要渗透测试；有时，漏洞扫描就是医生要求的全部内容。\n\
  \n但一旦你仔细定义了操作范围，处理了所有法律问题，并决定将你的测试提升到下一个水平，你将需要确定你所需的攻击类型组合。\n\n### 攻击向量\n\n渴望获取你数字价值资产的黑客所展现出的智慧和创造力是无尽的。但这里是一些你应该理解并准备好作为渗透测试的一部分进行仿常用方法：\n\
  \n*   **网络钓鱼 (Phishing)：** 你是否可以直接给组织内的某人打电话或发送电子邮件，并冒充身份别人来请求机密内容（如身份验证信息）？如果你能这样做，你就有了进入系统的入场券。\n\
  *   **未经授权的物理访问 (Unauthorized Physical Access)：** 我指的是一种老式的*入室盗窃*游戏。访问目标服务器和网络硬件有多容易？如果你能够在不引起任何人注意的情况下直接进入机房，那么插入一个廉价的\
  \ USB 恶意软件或嗅探设备或安装后门将极其简单。\n*   **SQL 注入 (SQL Injection)：** 一个配置不当的用于支持网站的数据库消耗前端一旦被发现，就可以被用来窃取或破坏你组织的私有数据。测试这种技术轻而易举（但通过正确配置你的网站来防止它也同样简单）。\n\
  *   **中间人攻击 (Man-in-the-Middle Attacks)：** 未加密的远程通信可以被任何访问网络的人拦截和更改。发现此类会话的渗透人员可以冒充会话的任何端并插入非预期的响应，破坏数据并可能诱导出敏感信息。\n\
  *   **跨站点脚本 (XSS)：** 易有漏洞的网页可以被注入恶意的客户端脚本，可能让攻击者获得他们不应拥有的高权限。\n\n### 工具框架\n\n前一节提到的某些攻击向量不需要任何特殊工具。例如，网络钓鱼只需要一些关于目标的基本信息和一点技巧。未经授权的物理访问只需要双脚（以及一种厚脸的态度）。但要进行一项严谨且完整的挑战，必须包含更广泛的攻击，其中许多攻击在技术上要求很高。为此，大多数人需要漏洞利用平台形式的帮助。\n\
  \n安全社区支持许多旨在引导你完成攻击过程的框架。之前提到的 OWASP 项目提供了 OWASP 攻击代理 (ZAP)，你可以用它针对 Web 应用程序。此外，安全公司\
  \ Rapid7 是 Metasploit 项目的后盾，该项目包含了针对易受远程机器执行漏洞利用的工具。\n\n不用说，预计此类由伦理合法的组织创建并维护的工具仅允许用于伦理合法的目的。这意味着你仅允许出于安全测试目的针对自己的财产运行它们，而不是任何其他目标。\n\
  \n你还应该意识到红队/蓝队演习，这是渗透测试的一种极端形式，让管理员和安全专业人员团队进行相互对抗。蓝队负责防御定义的架构栈，而红队则试图渗透系统并实现目标。\n\
  \n### 后续\n\n一旦情报收集、漏洞扫描、枚举和漏洞利用阶段结束，在你执行影响分析并在如果涉及其他人员时提交报告之前，你的工作还没有完成。影响分析是为了确保你完全理解了发生了什么、你的基础设施中存在哪些缺陷、必须修复什么以及你应该如何优先分配精力。报告应该对操作进行清晰的审查，并使用所有阅读人员都能读懂的语言。维护测试报告存档可以为你的操作提供持续的历史背景，并为后来的合规性和监管需求奠定良好基础。\n\
  \n换句话说，确保你跟上你的文书工作。\n\n## 总结\n\n如果不针对真实的模拟攻击进行测试，你就无法正确理解你的基础设施有多安全。\n\n开源情报收集 (OSINT)\
  \ 搜索公共网络上寻找有关你组织的漏洞信息。\n\n`recon-ng` 是一个软件套件示例，它可以有效自动化 OSINT 过程。\n\n漏洞扫描工具使用在美国政府资助数据库中策划和维护的定义。如果不使用这些定义，几乎不可能有效地扫描你的基础设施。\n\
  \n通用漏洞评分系统 (`CVSS`) 用于提醒你系统上发现了哪些更紧急的漏洞。\n\n漏洞扫描和渗透测试是复杂的、多步骤的任务，需要仔细的准备和扎实的技能。它们通常由第三方顾问执行。\n\
  \n在扫描之前，获得目标基础设施所有者的书面许可是关重要的，并要避免违反任何法律或造成不必要的损害。\n\n\n\n\n\n关注可用的漏洞定义更新数据库存储。国家漏洞数据库（`NVD`）维护并托管使用\
  \ `SCAP` 协议格式化的漏洞数据，以兼容自动化漏洞扫描操作。\n\n了解用于漏洞定义的格式、协议和评分系统。常见漏洞与暴露（`CVE`）决定了漏洞如何命名，通用平台枚举（`CPE`）用于识别主机操作系统（OS）和安装的软件，开放漏洞评估语言（`OVAL`）用于报告主机状态，通用漏洞评分系统（`CVSS`）用于突出特别严重的漏洞。\n\
  \n了解可用的漏洞扫描和渗透测试工具。`Kali Linux` 是一个预配置了你可能需要的设置和工具的发行版。`Nmap`、`OpenVAS`、`Nessus`、`Nexpose`、`Burp\
  \ Suite` 和 `OpenSCAP` 都是好扫描工具。OWASP 攻击代理（`ZAP`）和 Metasploit 项目特别适用于渗透测试。\n\n关注可能针对你基础设施的常见攻击向量。`Phishing`（钓鱼）攻击试图欺骗人们泄露私人信息。通过未经授权的物理访问可以获得（以及失去）许多东西。`SQL\
  \ injection`（SQL 注入）、`man-in-the-middle`（中间人）和 `cross-site scripting`（跨站脚本）攻击经常用于非法获取或破坏隐私。\n\
