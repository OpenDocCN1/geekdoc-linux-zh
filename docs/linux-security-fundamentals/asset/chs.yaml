  3. A. 防御中的漏洞或旨在禁用您的基础设施的实体是威胁，而非漏洞。难以替换的数据是目标而非漏洞。\n4. B. 分配私有网络 IP 地址的计算设备以及构成复杂环境的多个简单系统都是本地网络配置（NAT）的描述。物联网（IoT）实际上是一个定期交换数据的批量生产计算设备网络。\n\
  5. B, C. 阻断网络连接不是攻击的主要动机，因为通常不会提供造成损害或提取私有数据的有用机会。\n6. C, D. 使用弱密码或不可信的网站是不健康的，但这些选项与浏览器没有直接关系。\n\
  7. B, C. 防火墙规则是软件漏洞的解决方案，而非物理漏洞。从安全角度来看，旧硬件很少更有漏洞。\n8. A, B, D. 在线服务（如 Gmail 或 Salesforce）通常由其提供商维护和修补。根据原则，你只负责你安装和管理的软件。\n\
