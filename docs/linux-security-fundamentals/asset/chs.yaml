  1. 使用不可信的网站\n2. 使用弱密码和过度使用的密码\n3. 对你的系统资源进行未经授权的访问\n4. 你的浏览历史和数据在意之外可见\n\n7. 你可以采取哪些措施来控制对服务器的物理访问？（选择两项）\n\
  1. 在你的网络上设置适当的防火墙规则。\n2. 设置 `BIOS/UEFI` 密码。\n3. 在运行计算机的房间安装安全锁。\n4. 确保你正在使用的硬件是最新且经过更新的。\n\
  \n8. 在以下哪些软件包中是你负责定期应用补丁的？（选择三项）\n1. 网页浏览器\n2. PC 操作系统\n3. 在线软件服务\n4. 移动设备操作系统\n\
  \n9. 可以采取什么措施来减少组织遭受外部攻击的风险？（选择两项）\n1. 培训团队了解最新的钓鱼诈骗。\n2. 培训团队警惕同事之间的异常行为。\n3. 培训团队有效使用你的业务应用程序。\n\
