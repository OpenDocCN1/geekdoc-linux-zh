  \n\n\n\n\n11. A. `Backdoor`（后门）是用于描述一种未记录（且通常未经授权）的访问计算常用表达式。\n\n12. B. 保护第三方网络连接和私有设备的安全状态超出了政府指令的范围。\n\
  \n13. A, C, D. 虽然避开在线电子商务和银行网站可以保护你免受数据泄露，但对大多数人来说，这并不是一个实行的解决方案。\n\n14. C. 钓鱼攻击试图说服目标用户将其个人和私有信息提供给未经授权的人员或数据采集应用程序。\n\
  \n15. B, D. `OSINT`（开源情报）收集是使用公开可用数据进行的，不需要物理访问。虽然 `OSINT` 方法可以用于对抗攻击的努力，但它们也可以作为犯罪活动的一部分发挥作用。\n\
  \n16. C. 勒索软件涉及插入恶意软件以加密本地数据，要求在恢复所有者访问权限之前支付赎金。\n\n17. A, D. 至少至少没有可以防止勒索软件攻击的实用在线服务。屈从勒索软件作者的要求通常是一个糟糕的主意，绝不应将其作为最后的手段——而且要理解你可能也无法找回数据。\n\
  \n18. B, D. 分布式拒绝服务攻击接管易受攻击的网络连接设备，并利用其资源对目标发起持续的服务请求，防止其执行正常服务。此类攻击并不是为了获取或破坏宝贵数据。\n\
  \n19. A, B. `ARP` 欺骗和 `MAC` 泛洪都试图更改网络设备处理流量的方式以破坏网络活动。广义的社会工程特别是钓鱼攻击是旨在欺骗人们不当地暴露隐私信息的方法。\n\
  \n20. B. 僵尸是一种计算设备，其资源作为针对第三方的攻击而被劫持。这是使用许多 `IoT` 设备组合资源的攻击常见特征。\n\n## 第 3 章：控制对资产的访问\n\
  \n1. B. 缓解是指组织为减少对你的 IT 基础设施攻击的影响而采取的步骤。\n\n2. C. 窥视者是人，而不是设备。键盘记录器和操作系统安装在你的计算机上；因此，它们不是外部的。\n\
  \n3. A. 现场 `Linux` 会话不需要密码登录，因为默认情况下，它们创建了一个包含任何预存私有数据的纯净环境。现场 `Linux` 会话并不比在私有网络中运行的任何计算机更容易受到外部攻击。虽然隐藏恶意软件可能随现场\
  \ `Linux` 镜像传输，但这种情况极低概率，因此不属于“主要风险”。\n\n4. D. 你应该使用浪涌保护器和 USB 电源保护服务器和 PC 防止电压浪涌和中断，但电源不是间谍软件的来源。存储在便携数据卷或智能手机上数据的主要风险是被盗，而不是间谍软件或恶意软件的植。\n\
  \n5. B. 软件防火墙可以保护你的计算机免受未经的网络访问，但不能防止物理盗窃。`OS` 密码只能防止攻击者加载操作系统，无法阻止其访问数据驱动。控制计算机的物理访问是好的，在这种情况下，看来它已经被盗了。\n\
