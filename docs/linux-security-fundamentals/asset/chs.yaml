  \ 4 章\n\n## 控制网络连接\n\n![image](img/clogo.jpg) 任何网络，包括互联网本身，都是主机（各种计算设备）和路由器（在网络之间转发数据的设备）以及连接它们的电缆或无线通道的集合。目标是尽可能快速、安全和可靠地将数据从一个主机传输到另一个主机。\n\
  \n如果没有对网络运行方式的基本了解，你将很难理解网络安全的要素。因此，本章将从网络本身结构的高层概述开始。接下来，你将学习如何有效地扫描网络漏洞和流氓设备。最后，我们将讨论主动保护你的网络以及使用这些网络的设备。\n\
  \n\n\n\n\n网络面临的一个问题是，它们由硬件和软件工具组成，而这些工具受到广泛范围标准的控制。为了成功地交换数据，这些标准必须相互兼容。自 20 世纪\
  \ 70 年代以来用于网络运行的标准化架构模型被称为 `internet protocol suite`（互联网协议族）。该组合使用的主要协议是传输控制协议（`TCP`）和互联网协议（`IP`）。它们共同构成了你经常看到的\
  \ `TCP/IP` 标识符。\n\n关于这些协议的更多信息，你可以阅读它们的原始请求意见（`RFC`）页面。对于 `TCP`，对应 `RFC 793`：[`tools.ietf.org/html/rfc793`](https://tools.ietf.org/html/rfc793)。对于\
  \ `IP`，则是：`RFC 791`：[`tools.ietf.org/html/rfc791`](https://tools.ietf.org/html/rfc791)。\n\
  \n## 传输控制协议\n\n`TCP` 被许多核心连接应用使用，包括使用超文本标记语言（`HTML`）的浏览器、电子邮件服务以及像 `OpenSSH` 这样的远程话工具。该协议允许连接两端的应用程序相互通信，而无需了解底层连接的任何信息。`TCP`\
  \ 会建立连接并通过准备传输数据、传输数据、检查错误以及发送成功或失败的通知来管理连接。\n\n`TCP` 的兼容性和功能通常直接内置在操作系统中，供使用它们的软件应用程序。因此，你很少需要亲自动手进行配置。但是，为了正确配置防火墙或使用网络故障排除工具，你至少需要知道你的网络应用程序中哪一个在使用\
  \ `TCP`，而不是像用户数据报协议（`UDP`）或互联网控制消息协议（`ICMP`）之类的协议。\n\n## 互联网协议\n\n`IP` 协议定义了网络数据包在源主机和目的主机之间的定向方式。该定义涵盖了描述互联网地址的语法的接受标准，以及这些地址如何嵌入数据包头中。在数据包旅程的任何一步，数据包头都会被路由软件读取，路由软件将使用符合\
  \ `TCP` 标准的网络设施，将数据包导向其最终目标。我们现在感兴趣的是 `IP` 地址使用的结构，因为这有助于我们理解我们网络本身是如何设计的。而*那*将帮助我们理解如何最好保护这些网络。\n\
  \n任何连接到网络的设备必须有某种方式将自己与其他所有设备区分开；否则，就无法确定地知道流量应该发送到哪里。`IP` 协议的第四版本——被称为 `IPv4`——建立了一个\
  \ 32 位数值命名系统，其中 0 到 255 之间的数字分配给四个字节中的每一个。一个典型的 `IPv4` 地址可能像这样：\n\n`192.168.3.25`\n\
  \n如果你曾经花时间计算过 `256 × 256 × 256 × 256`（其中 `256` 是 0 到 255 之间的可能数字），你会知道会得到一个大于四十亿的数字（精确说是\
  \ `2³²`）。这意味着 `IPv4` 地址可以为我们提供理论上略高于四十亿的最大可用地址集。这听起来是一个巨大的数字。好吧，它*确实*是一个巨大的数字。但当你考虑到已经有数十亿计设备（如智能手机、摄像头和联网汽车）连接到互联网——以及每天每秒又增加多少设备时——你就会理解\
  \ 20 世纪 90 年代网络工程师面临的阴暗而可怕的未来。当时采用了两个成功的解决方案：网络地址转换（`NAT`）和现在被称为 `IPv6` 的新 128 位地址系统。我们很快就会查看每一个。但首先让我们理解\
  \ 32 位寻址是如何工作的。\n\n### IPv4 排序\n\n一个 `IPv4` 地址由一个网络标识符和一个主机标识符组成。例如，`192.168.1`\
  \ 可以代表网络，该网络是所有希望位于该孤立网络中的设备共同共享的地址空间。右侧的最后一个数字——假设 `10`——将是你笔记本电脑的唯一主机标识符。使用该配置，你的网络打印机可能会被分配地址\
  \ `192.168.1.20`，而你的智能手机在家里时使用的 WiFi 连接可能会获得 `192.168.1.55`。路由器本身除了负责为本地设备分配地址并提供与外部世界的连接外，其地址可能为\
  \ `192.168.1.1`。图 4.1 显示了这样的设置可能是什么样的。\n\n![图显示了私有子网内 IP 地址分配的典型示例。](img/61583.png)\n\
  \n图 4.1 私有子网内 IP 地址分配的典型示例\n\n但这里有一个问题，因为单个地址（如 `192.168.1.10`）可以有多种方式读取。如果网段是 `192.168.1`，那么主机标识符是\
  \ `10`。但如果网络标识符是 `192.168`，那么主机段就是 `1.10`。一个糟糕的路由器如何知道你想做什么呢？\n\n别担心。表示子网掩码有两种方法。使用无类域间路由（`CIDR`）表示法，你会在地址后添加一个斜杠和一个数字来告诉路由器真正的状况。假设网络段占据前三个字节（`192.168.1`），那么\
  \ CIDR 方式会将你的笔记本电脑描述为 `192.168.1.10/24`（其中 `24` 表示此 32 位地址的前 `24` 位代表网络）。反之，如果你只需要\
  \ `16` 位网络段，你应该将其写为 `192.168.1.10/16`——而主机段为 `10`。\n\n第二种表示方法涉及掩码。使用掩码，`192.168.1.10/24`\
  \ 的掩码为 `255.255.255.0`，而 `192.168.1.10/16` 的掩码为 `255.255.0.0`。\n\n构建网络涉及大量的数学、工程甚至可能是物理学——其中大部分内容远超此本书的范围。但我将分享一个网络设计的基本原则。如果你的网段是\
  \ `192.168.1`，那么理论上你可以拥有一个独立的网段（也称为*子网*）`192.168.2`，另一个 `192.168.3`，依此类推。这种分割使得让不同功能的网络保持分离成为可能。也许一家小公司可能想要一个用于生产基础设施的网络，另一个用于开发者，第三个用于办公室员工，第四个用于未身份验证的访客。\n\
  \n还有一点想法：你并不局限于掩码值 255 或 0。你可以将一个字节的一部分指定给网络地址，其余部分指定给主机。计算子网很复杂，但你可以轻松找到在线计算器来帮你完成繁重工作。如果你好奇，可以搜索*在线子网计算器*。\n\
  \n#### NAT 地址转换\n\n`NAT` 地址的核心概念是，并不是所有连接的设备都需要自己唯一的公共地址。当然，经常在网络之间移动的移动设备由于其工作性质，需要从任何地方被直接访问。但位于互联网服务提供商（`ISP`）提供的路由器后的\
  \ PC 或服务器地址可以在本地网络层面进行管理。这在实践中释放了数以百万计的公共地址，成功推迟了 `IPv4` 地址的耗尽。\n\n\n\n\n\n# 它是如何工作的？像你互联网服务商（ISP）面向网络的路由器这类设备——通过单个公有\
  \ IP 地址——可以为位于其局域网“后面”的所有设备分配 `private`（私有）地址。设备在这些设备与互联网之间的任何流量都会通过路由器的地址转换被重定向到相应的目标。地址转换，如图\
  \ 4.2\n\n图 4.2 翻译 IP 地址并管理本地与公共主机之间流量的 NAT 服务器\n\n为了实现这一功能，IP 标准将所有地址分为两类：公有和私有地址。私有地址属于以下三个范围：\n\
  \n- `10.0.0.0` 到 `10.255.255.255`\n- `172.16.0.0` 到 `172.31.255.255`\n- `192.168.0.0`\
  \ 到 `192.168.255.255`\n\n在这些范围内有超过 1700 万个可用地址，这应该足够用于任何私有基础设施环境（我家的设备仍然只使用了大约 20\
  \ 个地址——我们还有很大的剩余空间可以利用）。除了少数特殊的预留地址外，所有其他地址都是完全可路由的并可供公用的。它们由互联网名称与数字分配机构（ICANN）管理。\n\
  \n## IPv6 地址\n\n解决 IPv4 限制的第二种更持久的解决方案是将地址方案从 32 位切换到 128 位。你从一个 128 位的范围内挤出多少个唯一地址？老实说，我不知道该如何称呼这个数字。理论上，如果这对你有帮助的话，至少有\
  \ `2¹²⁸` 个可能的地址。要点在于，该标准使得我们几乎不可能在已知宇宙中找到足够的物理空间来容纳足够多的设备以分配所有可用地址。保持所有数据传输所需的 WiFi\
  \ 信号可能会把所有生命都烤成乌有。\n\n这是好消息（扩展的地址范围，而不是关于烤掉所有生命的那条信息）。坏消息是，IPv6 地址相当难读，甚至更难记忆。IPv4\
  \ 地址由四个字节组成，而 IPv6 有八个字节。而且它们之间是用冒号而不是点号隔开的。这里是一个自动分配给我某台机器网络接口的不可路由、链路本地地址的示例：\n\
  \n`fe80::fc9b:9cff:fee2:ffd6/64`\n\n我确定你注意到了与 IPv4 的另一个一个重要区别：在那堆杂字符中有字母，而不只是数字。嗯，从技术上说，那些也是数字。你会发现，IPv6\
  \ 地址使用十六进制（16 进制）计数系统，该系统使用数字 0–9 以及英语（或更准确地说是拉丁语）字母的前六个字母。`a` 是 10，`f` 等于 15。再看一眼地址，你应该会发现另一个有点奇怪的地方。你发现了吗？只有五组数字，而不是八组。哦，在第一组后面有两个连续的冒号。\n\
  \n所以，这里发生了什么？嗯，这两个冒号实际上是多个零组的缩写，这些零在地址的完整版本中恰好相邻。以下是该特定地址在原始完整面貌下的样子：\n\n`fe80:0000:0000:0000:fc9b:9cff:fee2:ffd6/64`\n\
  \n我们 IPv6 之旅的终点是那个 `/64` 后缀。正如你可能已经猜到的，IPv6 地址在网络部分和主机部分的划分方式与我们处理 IPv4 的非常相似。然而，在这里指定它的唯一方法是使用\
  \ CIDR 表示法。主要的区别在于，我们处理的是 128 位数据而不是 32 位，所以 `/64` 会比像 `/16` 那样的常见得多。\n\n## 理解域名系统\n\
  \n由 TCP/IP 协议管理的 IP 地址是现代网络管理的骨干。但你在日常活动中可能很少直接与它们交互。相反，你使用人类可读的名称，如 `wikipedia.org`\
  \ 或 [`bootstrap-it.com`](http://bootstrap-it.com) 来访问网络资源。但事实上，你的浏览器之所以能理解你通过这些名称所指的内容，唯一方法就是查询域名系统（DNS）提供的\
  \ IP 地址/域名对的数据库。\n\n你的浏览器查询的特定地址翻译数据库可能存在于你 PC 的文件系统中、你网络中的一台独立服务器上、你互联网服务商的服务器上，或者作为由\
  \ Google 或 OpenDNS 等公司运行的全网服务。无论你的计算机配置查询哪种组合的 DNS 服务器，它都始于对例如我的 [`bootstrap-it.com`](http://bootstrap-it.com)\
  \ 对应的 IP 地址的请求。你可以从任何计算机的命令行终端通过使用 `host` 命令（Windows 用户使用 `nslookup`）来亲自尝试。\n\n\
  ```\n$ host bootstrap-it.com\n```\n\n```\nbootstrap-it.com has address 52.3.203.146\n\
  ```\n\n拿到该回复后，你的浏览器将使用 `52.3.203.146` 地址向 Web 服务器发送请求。如果一切按计划运行，我 Bootstrap IT 网站的默认主页内容将在你的浏览器中加载。\n\
  \n除了 DNS 是所有现代网络活动的关键组件外，从安全的角度来看，确保它的配置恰当也是件大事。想一想如果错误的人秘密地响应了你对 `mybank.com` IP\
  \ 的请求（你计划在那里登录并支付账单），会发生什么？你确定在回复中获得的 IP 是合法的吗？如果你在不知情的情况下被发送到一个假的银行网站并被骗输入身份验证信息，会发生什么？这种情况使用\
  \ DNS 欺骗或 DNS 劫持等攻击技术确实会发生。\n\n## 网络审计\n\n一旦你知道网络是如何工作的，下一步就是学习如何分析你正在使用的私有网状态。在这里，“私有网”是指你\
  \ ISP 提供的调制解调器/路由器侧连接到互联网的所有有线和无线连接。在审计中，我们要寻找的两个主要方面是开放端口和异常主机。\n\n网络端口是将 TCP 或\
  \ UDP 网络请求路由到服务器上特定功能的机制。例如，向网络地址添加端口 `80` 会告诉服务器你正在寻找来自超文本协议（HTTP）服务器的响应，而端口 `22`\
  \ 则表示你想要开启一个安全外（SSH）会话。\n\n当服务器上有配置为监听传入请求的软件时，该端口被认为是“开放”的；当没有运行此类软件时，则为“关闭”的。如果在网络审计期间，你发现某些不该开放的端口处于开放和监听状态，你应该采取适当措施将其关闭。搞清楚它们为什么会开放可能也是个好主意。\n\
  \n\n\n\n揭示不必要的开放端口和流氓主机将是后续章节的主题。\n\n## 网络审计工具\n\n据我所知，定期使用审计范式进行扫描是获取网络有用可见性的唯一方法。你可能想要知道网络中有哪些设备、哪些端口是开放的，以及如果发生了什么可疑的事情，这些设备到底在尝试实现什么。在这里，我们将介绍与上述每项任务关联最密的两个跨平台工具：`Nmap`\
  \ 和 `Wireshark`。\n\n## Nmap (映射)\n\n安装 `Nmap` 并不困难，而且它是免费的。对于 Linux 用户，只需运行 `apt\
  \ install nmap`（适用于 Debian、Ubuntu 或 Mint）或 `yum install nmap`（如果你使用的是 Fedora、CentOS\
  \ 或 Red Hat Linux）。\n\n直观的 `Nmap` 扫描，嗯，确实很直观。但不要认为这东西的功能并不深奥。Linux 版本的 `Nmap` 官方用户指南长达近\
  \ 1000 行。你可以应用非常广泛的选项来精细控制搜索返回的结果。你还可以通过从文本文件传递长目标列表，让 `Nmap` 同时指向多个主机。输出数据可以重定向到格式为各种标准的外部文件。\n\
  \n但在这里我们将保持简单直观。在实际开始扫描网络之前，你需要打开一个命令行 shell，以便确定你的网络使用的特定地址子网。在现代 Linux 发行版中，`ip\
  \ a` 就能解决问题。以下是 Linux 上典型输出的示例：\n\n```\n$ ip a\n\n1: lo: <LOOPBACK,UP,LOWER_UP>\
  \ mtu 65536 qdisc noqueue state UNKNOWN group default qlen 1000\n\n    link/loopback\
  \ 00:00:00:00:00:00 brd 00:00:00:00:00:00\n\n    inet 127.0.0.1/8 scope host lo\n\
  \       valid_lft forever preferred_lft forever\n\n    inet6 ::1/128 scope host\n\
  \       valid_lft forever preferred_lft forever\n\n7: eth0@if8: <BROADCAST,MULTICAST,UP,LOWER_UP>\
  \ mtu 1500 qdisc noqueue state UP group default qlen 1000\n\n    link/ether 00:16:3e:53:d4:ce\
  \ brd ff:ff:ff:ff:ff:ff link-netnsid 0\n\n    inet 10.0.3.80/24 brd 10.0.3.255 scope\
  \ global dynamic eth0\n       valid_lft 3224sec preferred_lft 3224sec\n\n    inet6\
  \ fe80::216:3eff:fe53:d4ce/64 scope link\n       valid_lft forever preferred_lft\
  \ forever\n```\n\n第一个条目被称为 `lo`——代表“loopback”（回环），表示连接到本地系统的虚拟网络连接。按照惯例，该连接的“inet”地址是\
  \ `127.0.0.1`。标记为 7 标识为 `eth0` 的条目是实际的网络接口，正如你在条目的第三行所看到的，其 inet 地址为 `10.0.3.80`，且\
  \ IPv4 网络配置为 24 位。这就是我需要知道的全部，因为这意味着我所在的网络子网被定义为 `10.0.3.0/24`——我只需要将地址中的主机部分（在我的情况下是\
  \ 80）替换为 0 即可。\n\n让我们通过对网络上的 TCP 端口进行快速调查来开始扫描。`-F` 选项告诉 `Nmap` 以快速模式运行，这意味着它将仅对发现的每个主机扫描\
  \ 100 个端口，而不是它默认情况下会扫描的 1000 个常用端口。在某些情况下，你当然可能希望 `Nmap` 扫描所有 65000 多个端口，但这需要更长的时间完成。在这里使用\
  \ `-F` 将有助于我们快速了解网络上存在哪些主机。\n\n```\n$ nmap -F 10.0.3.0/24\n\nStarting Nmap 7.60\
  \ ( https://nmap.org ) at 2019-08-05 09:26 EDT\n\nNmap scan report for workstation\
  \ (10.0.3.1)\nHost is up (0.00019s latency).\nNot shown: 96 closed ports\n\nPORT\
  \     STATE SERVICE\n22/tcp   open  ssh\n53/tcp   open  domain\n631/tcp  open  ipp\n\
  \nNmap scan report for 10.0.3.80\nHost is up (0.00018s latency).\nAll 100 scanned\
  \ ports on 10.0.3.80 are closed\n\nNmap scan report for 10.0.3.88\nHost is up (0.00020s\
  \ latency).\nNot shown: 98 closed ports\n\nPORT   STATE SERVICE\n22/tcp open  ssh\n\
  80/tcp open  http\n\nNmap scan report for 10.0.3.177\nHost is up (0.00020s latency).\n\
  Not shown: 99 closed ports\n\nPORT   STATE SERVICE\n22/tcp open  ssh\n\nNmap done:\
  \ 256 IP addresses (4 hosts up) scanned in 2.37 seconds\n因为我们告诉了 `Nmap` 网络是 24 位，因此只有\
  \ 256 个可能的主机地址需要查找（在 `10.0.3.0` 和 `10.0.3.255` 之间）。在这些 256 个理论地址中，`Nmap` 发现了 4 个实际主机。分配\
  \ IP 为 `10.0.3.1` 的第一个主机有 4 个开放端口：22 用于 SSH，53 用于 DNS 请求，631 用于 Unix 打印系统 (CUPS)\
  \ 管理工具。第二个主机（`10.0.3.80`）在扫描的 100 个端口中没有开放端口。另外两个主机正在监听 SSH 请求，其中一个通过 80 端口作为 Web\
  \ 服务器。\n\n## Wireshark\n\n`Wireshark` 是一个网络数据包分析器。你为什么想要分析网络数据包呢？因为你已经看到的，网络数据包包含了大量有趣信息，关于谁在连接和通信，涉及什么种的软件，以及在某种程度上，这些数据包到底是什么。\n\
  \n这里有一个场景。假设你使用 `Nmap` 确实在网络上发现了一个意外设备，但无法立即确定它是什么。确保你已经安装了 `wireshark` 软件包，然后启动它。从启动界面上出现的列表中，双击连接到网络的接口。由于在这个特定的工作站上发生了很多事情，图\
  \ 4.3 所示的启动界面可能让你感到困惑。但你的可能只有两三个选择。\n\n\n\n\n\n在接下来的章节中，你将看到名为 `Frame`、`Ethernet`\
  \ 等可展开的行。点击展开某行将发现许多极客喜欢的精妙内容。例如，如果会话未加密的，你可能可以使用这些数据拼凑出重要的内容——如登录名和密码。但无论什么情况下，很可能存在有助于了解该设备正在做什么以及它在与谁通信的信息。\n\
  \n和 `Nmap` 一样，`Wireshark` 也是一个非常复杂且功能强大的软件，我们在这里不会挖掘得太深。作为额外加分项，你可以阅读文档来学习如何应用复杂的过滤器，以便从\
  \ `Wireshark` 提供的海量数据中更轻松地找到你想要的信息。你还可以学习如何将 `Wireshark`（或 `Nmap`）的输出写入 `.pcap`\
  \ 格式的文件，以便在更适合你需求的环境中进行归档和分析。\n\n### 自动化审计\n\n了解如何扫描和评估你的网络资产是非常棒的，但如果你不尽早且频繁地应用这些技能，它们对你也没有什么大用。在高风险或高价值的环境中，你应该至少每周运行一次严肃的扫描。好吧，你知道这种任务在刚开始一段时间后，你就不可能记得去执行了，对吧？所以，让我向你介绍管理员管理员的好朋友：自动化。\n\
  \n具体的细节可能随操作系统而异，但通用方法是相同的：在计算机上任何值得做的事情都可以转换为脚本，然后设置为设置为按计划自动运行。`Nmap` 甚至带了 500\
  \ 多个预构建的脚本，用于执行各种任务，例如测试 WordPress 安装是否存在弱密码（`http-wordpress-brute.nse`）或测试 Web\
  \ 服务器是否存在弱加密配置（`ssl-enum-ciphers.nse`）。在安装了 `Nmap` 的 Linux 机器上，你可以在 `/usr/share/nmap/scripts/`\
  \ 目录下找到这些脚本。\n\n那么 `Wireshark` 呢？有没有办法可以自动化 GUI 应用的操作？简而言之，肯定的。但这需要你安装 `Wireshark`\
  \ 的命令行版本 `Tshark`。请注意，在某些发行版中，安装 `Wireshark` 时会自动安装 `Tshark`。使用 `Tshark`，你可以运行包含你深为喜爱的\
  \ `Wireshark` 中所有过滤功能的复杂扫描，并将它们整合到你自定义的脚本中。就像 `Wireshark` 一样，你可以将输出写入 `.pcap` 文件。\n\
  \n例如，这个小巧的命令将让 `Tshark` 监控 DNS 地址请求，并输出扫描期间所有请求的域名列表：\n\n```\ntshark -i eth0 -f\
  \ \"dst port 53\" -n -T fields -e dns.qry.name\n```\n\n`-i` 指向设备的网络接口（在这台 Linux\
  \ 机器上为 `eth0`）。`-f` 将过滤捕获的数据，只检索发送到 TCP 或 UDP 端口 53（DNS 端口）的数据包。`-n` 将禁用网络对象名称解析。`-T\
  \ fields` 允许将输出格式设置为由 `-e` 值指定的 `dns.qry.name`。\n\n当然，这只是成功了一半。在所有这些扫描对结果产生任何价值之前，必须有人阅读这些结果。最简单的方法是重定向并解析扫描产生的数据，过滤掉除最紧迫的结果以外的所有内容。然后你可以将这些摘要推送给负责系统的管理员。这听起来还不够简单吗？那么也许你应该等到第\
  \ 7 章“风险评估”，在那里你将学习一些用于执行全面漏洞扫描的工具。\n\n## 网络安全\n\n对于本章中讨论的审计工具所提出的问题，正确的响应通常非常显而易见。如果它不该在那里，就删除它。如果配置错误，就修复它。但你也应该考虑一些主动行动，这些行动如果整合到你的\
  \ IT 运营中，可以很大程度上防止麻烦。这就是我们在本章剩余部分将探索的内容。\n\n### 补丁你的软件\n\n这一点怎么强调都不为过。考虑到软件开发可能是多么复杂和混乱，你应该预见到会有漏洞被发现，新的威胁模型被引入。即使你在选择和安装系统上的软件包包时非常小心，也无法保证它们的完整性会永远持续。随着新威胁的出现，积极管理的软件应该及时打补丁，并公开发更新。从历史上来看，Linux\
  \ 开发者更擅长提供及补丁，但所有负责任的软件供应商都在尽力。\n\n然而，要考虑的第一点是你正在使用的软件提供者是否负责，或者这些项目是否正在被积极管理。公司会倒闭，开源项目背后的人会转向其他挑战，甚至生病或去世。监控系统资源的状态是你的责任。这是如何实现的？\n\
  \n每天花一点时间扫描技术新闻头条，寻找可能影响你系统的进展。30 年来，我一直在各种方式通过 `ZDNet` ([`www.zdnet.com/`](https://www.zdnet.com/))\
  \ 关注行业动态。但有很多网站、电子邮件通讯和社交媒体资源可以满足你的需求和兴趣。为了说明我的意思，在写这些文字的一小时前，我的每日 `ZDNet` 邮件就提醒了一个直接威胁到系统的未修复漏洞。\n\
  \n对生产服务器应用软件更新总是令人担忧的，特别是当它们加载了复杂的堆栈时。但只要可能，你应该尝试找到自动化软件更新的方法。你可以通过以下过程为 Ubuntu\
  \ 服务器配置无人升级：\n\n```\nsudo apt install unattended-upgrades\n```\n\n编辑 `/etc/apt/conf.d/`\
  \ 目录下的 `50unattended-grades`，取消 `\"${distro_id}:${distro_codename}-updates\"` 一行的注释。\n\
  \n```\nsudo nano /etc/apt/conf.d/50unattended-grades\n```\n\n你可以在上述文件中使用如下语法可选设置邮件警报：\n\
  \n```\nUnattended-Upgrade::Mail \"david@bootstrap-it.com\";\n    Unattended-Upgrade::MailOnError\
  \ \"true\";\n```\n\n然后你应该创建（或编辑）`/etc/apt/conf.d/` 中的 `20auto-upgrades` 文件，包含以下活动项：\n\
  \n```\nAPT::Periodic::Update-Package-Lists \"1\";\n    APT::Periodic::Download-Upgradeable-Packages\
  \ \"1\";\n    APT::Periodic::AutocleanInterval \"7\";\n    APT::Periodic::Unattended-Upgrade\
  \ \"1\";\n```\n\n使用以下命令启动工具：\n\n```\nsudo unattended-upgrades\n```\n\n记住，软件更新对你的所有设备都很，而不只是\
  \ PC 和服务器。网络路由器和智能手机运行的软件与任何软件一样需要更新。区别在于，当你谈到更新时，你不太可能考虑到这些设备，而且更新过程通常并不简单。\n\n\
  ### 物理保护你的基础设施\n\n你是否亲自认识每天进入你大楼的每个人的身份？是否有网络交换机甚至活的以太网连接处于公共区域且未受保护？你是否与其他组织共享办公空间，而其成员包括你不认识的人？如果有人自称来送包裹，或者冒充你的日常清洁工，他们悄悄向\
  \ PC 后面插入一个恶意的 U 盘，或者留下一个设计用于嗅探网络本地流量并将结果传回家的微型单板计算机，会有多容易（IBM 研究人员已经演示了这有多容易\n\n\
  \n\n花些时间仔细观察你的设施，并思考你当前的设置可能被滥用的所有糟糕方式。然后，花些时间填补所有的漏洞。最重要的是，创建一套实用的安全策略，这样在未来，你可以确信当下一次灾难发生时，至少那不是你的错。\n\
  \n### 加固你的网络行为\n\n即使你已经解决了物理和基础设施方面的漏洞，仍然会有很多攻击缺口。但是，通过你处理技术时的思维方式和行为，可以减少其中的许多风险。游戏的一部分可能涉及调整你对\
  \ IT 投资的预期。另一部分则要求你思考一些简单的行为模式，这些模式可能在无意中让你暴露在不必要的风险之中。\n\n考虑一下无线连接。从安全的角度来看，通过智能手机的数据服务访问资源，与你在家里使用的\
  \ ADSL 或电缆连接并没有区别。但通过 `WiFi` 接入点连接可能会带来麻烦——尤其是当这些连接没有使用或使用了非常弱的加密时。你确定你在公共场所连接的\
  \ `WiFi` 网络是安全的吗？问题在于，我们往往期望在任何需要的时候、任何我们所在地的地方消费数字数据。对数据的需求可能是如此强烈，以至于当没有安全连接可用时，我们许多人会——“就这一次，真的！”——依赖于任何现可用的连接。\n\
  \n同样，你肯定知道那些提供电影或软件免费下载的明亮闪烁网站是危险的。我的意思是，一家好莱坞制片厂花费一亿美元制作产品，却乐高兴地把它送人，这不符合逻辑。而且，下载网站的所有者像偷那部电影一样，从你的电脑里偷东西的可能性有多大？可疑下载之所以可疑是有原因的。不要成为为抹除你\
  \ IT 资产的恶意软件打开大门的人。\n\n如果你确实决定冒险，至少要计算一下可能的后果。例如，你的在线银行账户等高价值目标应该只暴露在极小的风险中。这可能意味着决定从不通过公共\
  \ `WiFi` 网络访问银行——或者只从家里的 PC 访问。这在如何在风险与需求之间取得平衡。\n\n### 其他事项\n\n你永远无法真正完成加固网络安全的工作：可能的细节太多了，而且，规则在不断变化。你永远无法完全将注意力从问题上移开。一些重要任务将在书的后面讨论，包括加密你的连接，并在适当的情况下使用虚拟专用网络（`VPNs`）进行通信。在结束本章之前，我将向你提供几个更多松散关联的想法。\n\
  \n当你按照我们之前描述的方法执行网络审计时，对发现的任何连接设备给予特殊关注。网络打印机、文件共享设备，甚至是智能冰箱都可能向任何经过该区域的人广播其自己的网络服务。默认情况下，其中某些设备被设置为提供无密码访问，一旦有人进入，就很难知道这种访问在设备之外还能延伸到多远。底线是，你所拥有的任何带有无线功能的设备都应该被锁定，并仅供授权用户使用。\n\
  \n同样，确保你的 `WiFi` 路由器被配置为强制执行安全加密和受密码保护的客户端登录。目前 `WiFi` 加密的最新技术是 `WPA2` 标准，但要密切关注那些证明在保护你的连接方面更优的新协议——例如最近发布的\
  \ `WPA3`。\n\n最后，对你的电子邮件账户要格外警惕，尤其是那些用于身份验证其他服务的账户。如果用作多个在线服务登录 ID 的单一邮箱地址被破解，就会变成一个单点攻击。为了说明，如果你的\
  \ `Gmail` 账户凭据被泄露并导致你的身份被盗用，窃贼可能就能像你本人一样，重置你用该地址用于或其他服务的密码。对于此类账户，尝试使用复杂的密码和你在第\
  \ 3 章“控制对资产的访问”中所看到的多因素认证（`MFA`）。限制与任意邮箱关联的账户数量也是一个好主意。\n\n## 总结\n\n`TCP/IP` 指一套管理网络连接（`TCP`）和主机地址（`IP`）的标准和协议。\n\
  \n理解 `IPv4` 和 `IPv6` 地址的结构和功能对于掌握所有的网络安全过程至关重要。\n\n智能网络分允许对大型 IT 基础设施栈进行高效且安全的管理。\n\
  \n域名系统（`DNS`）数据库将人类友好的网络地址（如 [`bootstrap-it.com`](http://bootstrap-it.com)）的请求转换为机器友好的\
  \ `IP` 地址。如果没有工作的 `DNS` 服务器，大多数正常的互联网活动将是不可能的。\n\n可以使用 `Nmap` 和 `Wireshark` 等工具进行网络扫描和数据包分析。你可以使用此类工具来寻找网络上未经授权或其他危险的活动。\n\
  \n自动执行定期网络扫描——包括漏洞报告协议——至关重要，这样你就能随时意识到网络资源的状态和情况。\n\n定期修补你的 `OSs` 和软件、跟上 IT 进展、保护你的物理基础设施，并在使用网络时保持纪律，都是实施有效网络安全方案的所有重要元素。\n\
  \n## 回归基础\n\n**理解 `IPv4` 和 `IPv6` 地址之间的区别。** `IPv4` 地址由四个 8 位的字节组成，每个数字都是 0 到 256\
  \ 之间的数字。`IPv6` 地址包含八个十六进制字节，并使用 128 位地址空间提供了几乎无限的主机地址。\n\n## 复习题\n\n答案可以在附录中找到。\n\
