  md: "# Version Control (CVS)\n\nTo add a new project directory to the CVS repository,\
    \ use the import command.\nImport places the current directory's files in the\
    \ repository under the specified name.\nImport also requires a short string to\
    \ identify who is adding the project and a string to describe the state of the\
    \ project.These strings are essentially commands and can be any-thing.Your login\
    \ name and init-rel for initial release are good choices.\n\n```\n$ cvs import\
    \ scripts kburtch init-rel\n```\n\nCVS starts your default text editor indicated\
    \ by the environment variables EDITOR or cvSEDITOR. CVS does not recognize the\
    \ VISUAL variable. The file to be edited contains comment lines marked by a CVS:\n\
    \n```\nCVS:\nCVS: Enter Log. Lines beginning with 'CVS': are removed automatically\n\
    CVS:\nCVS: \n```\n\nWhen you are finishing editing, CVS adds your program to the\
    \ repository, recording your comments in the change log. The results are written\
    \ to screen.\n\n```\nN scripts/ftp.sh\nNo conflicts created by this import\n```\n\
    \nThe N scripts/ftp.sh line indicates that CVS created a new project called scripts\
    \ and added the Bash script ftp.sh to it. ftp.sh is now stored in the CVS repository,\
    \ ready to be shared among the development team members. It is now safe to delete\
    \ the project directory from your directory. In fact, it must be deleted before\
    \ work can contin-ue on the project.\n\nUse the CVS checkout command (or co) to\
    \ work on a project. This CVS command saves a copy of the project in the current\
    \ directory. It also creates a CVS directory to save private data files using\
    \ CVS.\nTo use checkout, move to your home directory and type:\n\n```\n$ cvs checkout\
    \ scripts\ncvs checkout: Updating .\nU scripts/ftp.sh\n```\n\nThe subdirectory\
    \ called scripts contains personal copies of project files from the repository,\
    \ CVS maintains the original copy of ftp.sh. Another programmer can also checkout\
    \ ftp.sh while you are working on your personal copy.\nTo add new files or directories\
    \ to the project directory, use the add command. To add a file called process_orders.sh,\
    \ use this:\n\n```\n$ cvs add process_orders.sh\n```\n\nAs work on your scripts,\
    \ periodically check your work against the repository using the update command.\
    \ If another programmer makes changes to the scripts, CVS will update your project\
    \ directory to reflect the changes to the scripts. Any changes you have made,\
    \ however, will not yet be added to the repository copies."
