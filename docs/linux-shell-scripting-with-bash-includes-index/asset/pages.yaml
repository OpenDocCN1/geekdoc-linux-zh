  md: '# Folding


    The Linux fold command ensures a line is no longer than a certain number of characters.
    If a line is too long, a carriage return is inserted. fold wraps at 80 characters
    by default, but the -width=n (or -w) switch folds at any characters. The -spaces
    (or -s) switch folds to the nearest space to preserve words. The -bytes (or -b)
    switch counts a Tab as one character instead of expanding it.


    ```

    $ head -3 orders.txt | cut -d, -f 1

    Birchwood China Hutch

    Bookcase Oak Veneer

    Small Bookcase Oak Veneer

    $ head -3 orders.txt | cut -d, -f 1 | fold -width=10

    Birchwood

    China Huc

    h

    Bookcase O

    ak Veneer

    Small Book

    case Oak V

    eneer

    $ head -3 orders.txt | cut -d, -f 1 | fold -width=10 -spaces

    Birchwood

    China

    Hutch

    Bookcase

    Oak Veneer

    Small

    Bookcase

    Oak Veneer

    ```


    # Joining


    The Linux join command combines two files together. join examines one line at
    a time from each file. If a certain segment of the lines match, they are combined
    into one line. Only one instance of the same segment is printed. The files are
    assumed to be sorted in the same order.


    The segment (or field) is chosen using three switches. The -1 switch selects the
    field number from the first file. The -2 switch selects the field number from
    the second. The -t switch specifies the character that separates one field from
    another. If these switches are not used, join separates fields by spaces and examines
    the first field on each line.


    Suppose the data in the orders.txt file was separated into two files, one with
    the pricing information (orders1.txt) and one with the quantity and account information
    (orders2.txt).'
