    Most of the files are owned by user 500 (ken) and primary group 100 (users). Because
    my login is ken, I qualify for access rights on all files except the last one.
    Because eval_example.sh is owned by someone else but is in one of my groups, group
    access rights apply if I try to access the file.


    Only the owner of file can delete it.


    Each file has a permissions number that indicates which users can access it. Each
    bit in the file permissions represents the right to perform certain kinds of actions
    such as reading the file, writing the file, or executing a program.

    The permissions are grouped into three sets of bits. Each set represents access
    rights for a particular kind of user. Because three bits form one octal (base
    8) digit, permissions are often written as four octal digits. The rightmost digit
    represents the access rights for users not in any other category:These are commonly
    "other" or "world" permissions. The second digit from the right represents the
    access rights for users in the same group as the file. The third digit represents
    the access rights for the file''s owner. For example, the /tmp directory has user
    permission number of 777, which indicate full rights to any user.


    For directories, read access indicates the capability to read the directory''s
    contents. Write access enables a user to create new files in the directory, effectively
    "writing" a new directory entry. Because directories cannot be executed, the execute
    permission-users can run a program in a directory only if they know the name.


    The meaning of the bits within each set of three is partially determined by the
    kind of file. The left bit indicates the capability to read a file. The middle
    bit enables writing. The right bit enables the file to be executed, or in the
    case of a directory, the capability to move the current directory to that directory.
    A common user permission number of 755 indicates a file can be read or executed
    by anyone, but only the file''s owner can make changes.


    The following is a breakdown of the bits.


    +   1 (octal 1)—Others execute

    2 (octal 2)—Others write

    4 (octal 4)—Others read

    8 (octal 8)—Group execute'
