    The tail command displays the final lines contained in a file. Like head, the
    amount of lines or bytes can be followed by a a c for characters, an 1 for lines,
    a k for kilobytes, or an m for megabytes.


    The switches are similar to the head command. The -bytes=n (or -c) switch prints
    the number of bytes you specify. The -lines=n (-n) switch prints the number of
