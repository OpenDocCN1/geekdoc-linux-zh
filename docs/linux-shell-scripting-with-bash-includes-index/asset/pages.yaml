  md: '# Files, Users, and Shell Customization


    WHEN A FRIEND OF MINE GOT A New Unix computer, the console display didn''t look
    quite right. When we tried to view files, the operating system didn''t know how
    big the screen. It displayed the entire file instead of a screen at a time.


    My Unix was a bit rusty at the time, but I remembered there was a stty command
    to change attributes of the display. Looking at the help listing for stty, I noticed
    a person could set the rows and the line.Thinking that line must be the number
    of lines on the display, I typed atty line 24.The computer stopped responding,
    forcing us to reboot it.


    We phoned up a Unix professional who had the same operating system. He said, "That
    should have worked. Let me try it."There was a brief pause. "I locked up my computer,
    too."


    It turned out that stty line 24 set the serial port for the display, changing
    it to port 24 when there was no device connected to port 24. With the wide variety
    of options available to Unix-based operating systems like Linux, it can sometimes
    be difficult to predict what a command actually does. This chapter expands on
    the last chapter, covering more basic commands and their many, confusing, options.


    # Listing Files


    The `ls` (list) command shows the contents of the current directory. Although
    `ls` is a familiar command available on all Unix-like operating system, Linux
    uses the `ls` command from the GNUutils project and has many special switches
    and features.


    ```

    ls

    archive check-orders.sh orders.txt

    ```


    ls has switches that affect how the files are listed, including the level of detail,
    the sorting order, and the number of columns. Most Linux distributions set up
    certain'
