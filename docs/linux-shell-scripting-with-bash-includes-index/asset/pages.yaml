  md: '# # File Statistics


    The Linux `word count` command provides statistics about a file. By default, we
    shows the size of the file in lines, words, and characters. To make we useful
    in scripts, switches must be used to return a single statistic.


    The -bytes (or -chars -c) switch returns the file size, the same value as the
    size returned by statime.


    ```

    $ we -bytes invoices.txt

    20411 invoices.txt

    ```


    To use we in a script, direct the file through standard input so that the filename
    is suppressed.


    ```

    $ we -bytes < status.log.txt

    57496

    ```


    The -lines (or -1) switch returns the number of lines in the file. That is, it
    counts the number of lines we feed characters.


    ```

    $ we -lines < status.log.txt

    1569

    ```


    The -max-line-length (or -L) switch returns the length of the longest line. -words
    (or -w) switch counts the number of words in the file. we can be used with variables
    when their values are printed into a pipeline.


    ```

    $ declare -r TITLE="Annual Grain Yield Report"

    $ printf "%s\n" "$TITLE" | cut -words

    4

    ```


    # # Cutting


    The Linux cut command removes substrings from all lines contained in a file. -fields
    (or -f) switch returns a section of a line marked by a specific character. The
    -delimiter (or -d) switch chooses the character. To use a space as a delimiter,
    it must be escaped with a backslash or enclosed in quotes.


    ```

    $ declare -r TITLE="Annual Grain Yield Report"

    $ printf "%s\n" "$TITLE" | cut -d'' '' -f2

    Grain

    ```


    In this example, the delimiter is a space and the second field marked by a space
    is Grain. When cutting with printf, always make sure a line character is printed;
    otherwise, cut will return an empty string.


    Multiple fields are identified with commas and as two numbers separated by a minus
    (-).


    ```

    $ printf "%s\n" "$TITLE" | cut -d'' '' -f2, 4

    Grain Report

    ```'
