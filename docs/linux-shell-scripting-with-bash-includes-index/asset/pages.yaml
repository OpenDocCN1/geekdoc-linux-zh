    Some expression switches refer to measurements of time. Historically, find times
    measured in days, but the GNU version adds minutes for switches. find looks for
    an exact match.


    To search for files older than an amount of time, include a plus or minus sign.
    If a plus (+) precedes the amount of time, find searches for times greater than
    this amount. If minus sign (-) precedes the time measurement, find searches for
    times less than this amount. The plus and minus zero designations are not the
    same: +0 in days "older than no", or in other words, files one or more days old.
    Likewise, -5 in minutes "younger than 5 minutes" or "zero to four minutes".


    There are several switches to test the access time, which is the time a file was
    read or written. The -answer switch checks to whether one file was accessed recently
    than -atime the number of days ago a file was accessed.-amin checks the access
    time in minutes.


    Likewise, you can check the change time with -ctime, -ctmin. The inode usually,
    but not always, represents the time a file was created. You can check the modified
    time, which is the time a file was written to, by using -newer,-mtime, and -mmin.


    To find files that have changed in not one day:


    ```

    $ find -name "*.sh" -type f -mtime +0

    ./archive/old_orders.txt

    ```


    To find files that have been accessed in the last 10 to 60 minutes:


    ```

    $ find -name "*.txt" -type f -amin +9 -amin -61

    ./advocacy/linux.txt

    ```


    The -size switch tests the size of a file. The default measurement is 512-blocks,
    which is counterintuitive to many users and a common source of errors. Unlike
    the time-measurement switches, which have different measurements of time, to change
    the unit of measurement for you must follow the amount with a b (bytes), c (characters),
    k (kilobytes), or w (16-bit megabyte). Like the measurements, a minus (-) to test
    for files smaller than the specified size, or a plus (+) to test for larger files.'
