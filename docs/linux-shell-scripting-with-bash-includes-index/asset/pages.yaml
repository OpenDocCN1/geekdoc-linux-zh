    # Creating Man Pages


    Linux man pages are special text files formatted for the groff program (GNU run
    off). groff is based on the older troff (for printers) and nroff (for terminals).
    Troff was originally created in 1973 by Joseph F. Ossanna. By creating man pages
    for important scripts, a single access point can be created for online information
    about your projects.


    Place man pages for your projects in section 9 of the manual. Originally, section
    9 was used to document the Linux kernel, but it now follows the traditional Unix
    inter-interpretation. Manual pages for section 9 are usually stored in /usr/share/man/man9.
    If you do not have access to this directory, make a man9 directory to store your
    personal man pages. By adding HOME to the MANPATH variable in your Bash profile
    file, man will search the pages stored in your man9 directory.


    ```

    $ mkdir -man9

    $ declare -x MANPATH="$HOME/usr/share/man"

    ```


    man pages are files containing markup codes (macros) embedded in the text. These
    codes, much like HTML tags in a Web page, control the spacing, layout, and graphics
    in the pages. You can also define your own groff codes. These codes always appear
    at the start of a line and begin with a period.'
