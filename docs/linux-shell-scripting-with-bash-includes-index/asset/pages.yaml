  md: '# Text streams


    parent directory is a directory immediately containing the current directory,
    specified by .. in Linux.


    A shar file is a shell archive created by the shar command.


    Patch files contain list of changes to upgrade one set of files to another set.


    A shell is a program that runs operating system commands.


    Pathnames (or paths) are strings that describe the location of a file.


    Shell archives are collections of text files or scripts encoded as single shell
    scripts.


    Permissions are the access rights to a file.


    A shell option is a flag that enables or disables a particular Bash feature.


    PIDs are process identification numbers.


    Sparse files are files that contain a large amount of zeros that, for example,
    don''t consume any disk space.


    Pipe files are named pipes.


    Standard error is the default file to which error messages are written. The symbol
    is && and the path is /dev/sterr.


    A pipeline is a series of commands joined by the pipe symbol ({}).


    Polling is the act of continuously checking to see whether a daemon has work to
    do.


    Standard input is the default file from which input is read for commands. The
    symbol is && and the path is /dev/stdin.


    Process substitution is the redirection of the input or output of a command through
    a temporary pipe to be read or written by another command.


    Standard output is the default file to which output is written. The symbol is
    && and the path is /dev/stdout.


    Regular files contain data that can be executed, as opposed to files as directories
    or pipes.


    Status codes are numbers between 0 and 255 that indicate what problems occurred
    when the previous command was executed.


    Relative paths are pathname leading to a file from the current directory.


    Switches (also called "options" or "flags") are characters preceded by a minus
    sign that enable command features.


    A repository is the database maintained by a version control system where all
    master copies are kept.


    Symbolic links are links that are sometimes treated as different files than the
    ones they represent.


    The root directory is the top-most directory in the directory hierarchy


    Text streams are text files in a shell pipeline.


    Sanity checks are tests at the beginning of a script that verify the existence
    of files and variables.


