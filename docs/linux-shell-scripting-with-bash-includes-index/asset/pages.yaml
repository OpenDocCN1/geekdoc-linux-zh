  md: '# Basic Web Page Stripping (lynx)


    You can get the same effect by opening a socket with Bash and sending the appropriate
    HTTP commands. However, the browser can take care of Web server issues like cookies
    and Web site aliases for you.


    The -source switch is useful when a Web page contains many kinds of information.
    For example, you can search HTML tags and identify headlines on a news site looking
    for the fonts and styles of headline text.


    The -dump switch returns a rendered version of the Web page. On Web pages with
    simple content, this switch hides the HTML tags, thus making the page easier to
    work with. Normally, lynx footnotes all the links on a Web page, but you can hide
    these with the -no-list switch.


    ```

    $ lynx -dump -no-list http://www.pegasoft.ca

    REFRESH(10 sec) http://www.pegasoft.ca/frames.html

    ```


    PegaSoft Canada


    Your computer takes flight with PegaSoft


    PegaSoft Home Welcome to PegaSoft’s home

    Most people click here

    Basic Site Same Site, Less Filling

    No music or Java

    PegaSoft Portal The Start Page for Linux Professionals

    News, weather, categories, or more


    Please select a site

    Veuillez choisir un site

    Wählen Sie bitte eine Site aus

    Seleccione por favor un sitio


    The full site will automatically be chosen after a few seconds


    PegaSoft logo Copyright © 1998-2003 PegaSoft Canada. All Rights Reserved.


    Using the -source option, you can check the official time on the National Research
    Council of Canada’s (NRCC) Web site. The time is the first on the Web page containing
    UTC.


    ```

    $ lynx -dump http://time5.nrc.ca/webclock_e.shtml | grep UTC | head -1

    15:45:55 UTC

    ```'
