    $ ls -l \"$TMP\"\n-rw------- 1 kbturch kbturch 0 Aug 14:34 reports.3LnWvW\n\n\
    In this case, the letters XXXXX are replaced by the code 3LnWvW.\nmktemp creates\
    \ temporary directories with the -d (directories) switch. You can suppress error\
    \ messages with -q (quiet) switch.\n\n# Lock Files\n\nWhen many scripts share\
    \ the same files, there needs to be a way for one script to indicate to another\
    \ that it has finished its work. This typically happens when scripts overseen\
    \ by two different development teams need to share files, or when a shared file\
    \ can be used by only one script at a time.\n\nA simple method for synchronizing\
    \ scripts is the use of lock files. A lock file is like a flag variable: The existence\
    \ of the file indicates a certain condition, in this case, that the file is being\
    \ used by another program and should not be altered.\n\nMost Linux distributions\
    \ include a directory called /var/lock, a standard location to place lock files.\n\
    \nSuppose the invoicing files can be accessed by only one script at a time. A\
    \ lock file called invoices_lock can be created to ensure only one script has\
    \ access.\n\n```\ndeclare -r INVOICES_LOCKFILE=/var/lock/invoices_lock\nwhile\
    \ test ! -f \"$INVOICES_LOCKFILE\"; do\n  printf \"Waiting for invoices to be\
    \ printed...\\n\"\n  sleep 10\ndone\ntouch \"$INVOICES_LOCKFILE\"\n```\n\nThis\
    \ script checks every 10 seconds for the presence of invoices_lock. When the file\
    \ disappears, the lock completes and the script creates a new lock file and proceeds\
    \ to do its work. When the work is complete, the script should remove the lock\
    \ file to allow other scripts to proceed.\n\nIf a lock file is not removed when\
    \ one finishes, it causes the next script to loop indefinitely. The while loop\
    \ can be modified to use a timeout so that the script stops with an error if the\
    \ files are not accessible after a certain period of time.\n\n```\ndeclare -r\
    \ INVOICES_LOCKFILE=/var/lock/invoices_1800\ndeclare -ir INVOICES_TIMEOUT=1800\
    \ # 30 minutes\ndeclare -i TIME=0\nTIME START=$(date +%s)\nwhile test ! -f \"\
    $INVOICES_LOCKFILE\"; do\n  printf \"Waiting for the invoices to be printed...\\\
    n\"\n```"
