    Small Bookcase Oak Veneer,205.99,1,756

    Reclining Chair,1599.99,1,757

    Bunk Bed,705.99,1,757

    ```


    If either file contains a line with a unique field, the field is discarded. Lines
    are joined only if matching fields are found in both. To print unpaired lines,
    use -a 1 to print the unique lines in the first file or -a 2 to print the unique
    lines in the second file. The lines are printed as they appear in the file.


    The sense of matching can be reversed with the -v switch. -v 1 prints the unique
    lines in the first file and -v 2 prints the unique lines in the second file.

    The tests are case-insensitive with the -o output switch. Use a comma-separated
    field list to order the files. A field is specified using the field number (1
    or 2), and the number from that file. A zero is a soft form of the join file.


    ```

    $ join -1 1 -2 1 -t, -o "1.2,3,2,2,0" orders1.txt orders2.txt

