    xtrace shows the line-by-line progress of the script. In this case, the script
    xtrace contains a mistake resulting in an extra cycle through the while loop.
    Using xtrace, you can examine the variables and see that -ge should be replaced
    by -gt to prevent a cycle when TOTAL is zero.


