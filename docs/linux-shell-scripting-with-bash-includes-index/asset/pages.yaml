    A complete list appears in the reference section at the end of this chapter. By
    default, any of formatting codes referring to time will be based on the file''s
    modified time.


    ```

    $ stattime -f "%c" orders.txt

    Tue Feb 6 15:17:32 2001

    ```


    Other types of time can be selected by using a time code. The format argument
    is read left to right, which means different time codes can be combined in one
    format string. Using %c, for example changes the format to the inode time (usually
    the time the file was created). Using %L (local time) or %U (UTC) makes stat behave
    like the date command.


    ```

    $ stattime -f "modified time = %c current time = %L%c" orders.txt

    modified time = Tue Feb 6 15:17:32 2001 current time = Wed May

    9 15:49:01 2001

    ```


    ```

    $ date

    Wed May 9 15:49:01 2001

