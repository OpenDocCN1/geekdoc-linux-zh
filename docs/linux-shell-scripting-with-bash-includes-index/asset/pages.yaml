    # Predefined Variables


    Bash has more than 50 predefined variables. These variables, created when Bash
    is first started, provide information about the Bash session and can be used to
    control some of the shell''s features.


    Some of these variables have special properties that might be lost if you unset
    the variable and create a new one with the same name. For example, the RANDOM
    contains a random number. If you delete RANDOM with unset and declare a new variable
    called RANDOM, this variable is a normal shell variable and does not contain random
    numbers. Therefore, it''s best to avoid creating variables with the same name
    as the predefined variables.


    The declare command, with no switches, lists all currently defined values.


    +   - BASH—The full pathname of Bash.

    - ENV—In a shell, the name of the profile file executed before she was started.

    - BASH_VERSION—The version of Bash (for example, 2.04.0(1)-release).

    - COLUMNS—The number of characters per line on your display (for example, 80).

    - FUNCNAME—If inside a function, the name of the function.

    - HOSTNAME—The name of the computer. Under some versions of Linux, this can be
    the fully qualified domain name.

    - HOSTTYPE—Type of computer.

    - HOME—The name of your home directory.

    - IFS—The internal field separator, a list of characters used to split a line
    into words.

    - LINENO—The current line number in a script or function.

    - LINES—The number of horizontal lines in your display (for example, 24).'
