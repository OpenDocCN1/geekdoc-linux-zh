  md: '# Global Declarations


    Global declarations that apply to the entirety of the script should occur at the
    top of the script, beneath the header. By placing global declarations in one place,
    you make it easy for someone to refer to them while reading the script


    # Global Declarations


    ```

    declare -rx SCRIPT=${BASH##*/}


    declare -rx who="/usr/bin/who"

    declare -rx sync="/bin/sync"

    declare -rx wc="/usr/bin/wc"

    ```


    ```

    # the who command - man 1 who

    # the sync command - man 1 sync

    # the wc command - man 1 wc

    ```


    # Sanity Checks


    The next section, sanity checks protects the script from unexpected changes in
    the computer. Normal, when a command runs at the prompt, Bash searches several
    directories for the command you want to run. If it can''t find the command, perhaps
    because of a spelling mistake, Bash reports an error. This kind of behavior is
    good for working interactively because Bash saves time and any mistakes are easily
    corrected with a few keystrokes.


    Scripts, on the other hand, run without any human supervision. Before a script
    executes any statements, it needs to verify that all the necessary files are accessible.
    All required commands should be executable and stored in the expected locations.
    These are sometimes sanity checks because they do not let the script begin its
    main task unless the computer is in a known, or "sane," state. This is especially
    important with operating systems such as Linux that are highly customizable:What
    is true on one computer might not be true on.


    Another way of putting it is Bash relies on runtime error checking. Most errors
    are only caught when the faulty statement executes. Checking for dangerous situations
    early in the script prevents the script from failing in the middle of a task,
    otherwise making it difficult to determine where the script left off and what
    needs to be done to continue.


    Sometimes system administrators unintentionally delete or change the accessibility
    of a file, making it unavailable to a script. Other times, changes in the environment
    can cause commands to be unexpected. Malicious computer users have also been known
    to tamper with a person''s login profile so that the commands you think you are
    running are not the ones you are actually using.


    In the case of the sample script, you need to verify that the commands you need
    where they are available to the script.


    # Sanity checks


    ```

    if test -z "$BASH"; then

    ```'
