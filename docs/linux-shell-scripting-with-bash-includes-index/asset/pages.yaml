  md: '# Customizing Your Prompt


    The built-in hash command maintains the hash table. Without any switches, hash
    lists the memorized commands, where they are, and the number of times the command
    has been executed during this session.


    ```

    $ hash

    hits command

    1 /bin/ls

    1 /bin/uname

    1 /usr/bin/tput

    1 /bin/stty

    1 /usr/bin/uptime

    1 /usr/bin/man

    ```


    When a command is specified, Bash searches for the new location of the command.
    For example, if you create your own ls command in your current directory, the
    PATH variable gives precedence to files in your current directory, the hash ls
    command finds your ls command first, replacing /bin/ls with /.ls.


    ```

    $ ls

    $ hash

    hits command

    1 /bin/touch

    0 ./ls

    1 /bin/chmod

    ```


    The -p (path) switch explicitly sets a path for a command. The -d (delete) switch
    deletes a specific entry, and -r (remove) clears the hash table, removing all
    commands. The -t (table) option lists the pathnames for specific commands, and
    -1 (list) lists the commands in a format that allows them to be removed by the
    hash command.


    ```

    $ hash -t ls less

    ls /bin/ls

    less /usr/bin/less

    ```


    # Customizing Your Prompt


    The default Bash prompt is a dollar sign ($), although some distributions use
    a different symbol. Most Linux distributions redefine the prompt to include additional
    information, such as your current login and computer, which is useful when you''re
    moving between accounts and computers.


    If a variable named PS1 (prompt string 1) is defined, Bash will use the value
    of this for your prompt. If you include variable names in the string, Bash will
    substitute the value of the variables into your prompt.


    ```

    $ declare -x PS1=Bash $

    Bash $pwd

    /home/kburtch/archive

    Bash $

    ```'
