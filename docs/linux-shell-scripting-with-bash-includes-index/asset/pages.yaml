  md: '# Multiple Tests


    ```

    test -f "$TMP" -a ! -w "$TMP"; then

    printf "$SCRIPT:$LINENO: the temp file $TMP exists and cannot\nbe overwritten
    - aborting" >2

    exit 192

    fi

