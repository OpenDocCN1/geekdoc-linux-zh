  md: "# Splitting Large Files\n\nThe basic csplit pattern is a regular expression\
    \ in slashes followed by an optional offset. The regular expression represents\
    \ lines that will become the first line in the next file. The offset is the number\
    \ of lines to move forward or back from the matching line, which is by default\
    \ zero. The pattern \"/dogs/+1\" will separate a file into two small-files, the\
    \ one ending with the first occurrence of the pattern.\n\nQuoting the pattern\
    \ prevents it from being interpreted by Bash instead of the csplit command.\n\n\
    The -prefix=P (or -f P) switches the prefix for the new filenames. --suffix=S\
    \ (or -b S) switches the file numbers using the specified C printf function codes.\
    \ --digits=D (or -n D) switches the maximum number of digits for file numbering\
    \ to two digits.\n\n```\n$ csplit -prefix \"chairs\" orders.txt \"/Chair/\"\n\
    ```\n\n```\n$ ls -1 chairs*\n-rw-rw-r- 1 kburch kburch 107 Oct 1 15:33 chairs00\n\
    -rw-rw-r- 1 kburch kburch 485 Oct 1 15:33 chairs01\n```\n\n```\n$ head -1 chairs01\n\
    Reclining Chair,1599.99,1757\n```\n\nThe first occurrence of the pattern Chair\
    \ was in the line Reclining Chair. Multiple patterns can be listed. A delineated\
    \ pattern with percent signs (%) instead of slashes indicates a portion of the\
    \ file that should be ignored up to the indicated pattern. It can also have an\
    \ offset. A number by itself indicates that particular line is to start the next\
    \ new file. A number in curly braces repeats the pattern specific number of times,\
    \ or an asterisk to match all occurrences of a pattern.\n\nTo split the orders.txt\
    \ into separate files, each beginning with the word Chair, use the all occurrences\
    \ pattern.\n\n```\n$ csplit -prefix \"chairs\" orders.txt \"/Chair/\" \"{*}\"\
    \ \n```\n\n```\n$ ls -1 chairs*\n-rw-rw-r- 1 kburch kburch 107 Oct 1 15:33 chairs00\n\
    -rw-rw-r- 1 kburch kburch 222 Oct 1 15:33 chairs01\n-rw-rw-r- 1 kburch kburch\
    \ 23 Oct 1 15:33 chairs02\n-rw-rw-r- 1 kburch kburch 179 Oct 1 15:33 chairs03\n\
    -rw-rw-r- 1 kburch kburch 61 Oct 1 15:33 chairs04\n```\n\nThe --elide-empty-files\
    \ (or -z) switch switches files that contain nothing. --keep-files (or -k) doesn't\
    \ delete the generated files when an error occurs. --quiet (or -silent -or q or\
    \ -s) switch hides progress information.\ncsplit is used in splitting large files\
    \ containing repeated information, such as extracting individual orders sent from\
    \ a customer as a single file."
