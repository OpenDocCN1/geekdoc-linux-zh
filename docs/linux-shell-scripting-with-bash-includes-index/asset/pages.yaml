- img_proc: true
  md: 'Using standard output is a way to send all the output from a script and any
    commands in it to a new destination.


    A script doesn''t usually need to know where the messages are going: There''s
    always the possibility they were redirected. However, when errors occur and when
    warning messages are printed to the user, you don''t want these messages to get
    redirected along with everything else.


    Linux defines a second file specially for messages intended for the user called
    standard error. This file represents the destination for all error messages. The
    symbol for standard error is &. /dev/stderr can also be used. The default destination,
    like standard output, is the screen. For example,


    ```

    printf "$SCRIPT:$LINENO: No files available for processing" >&2

    ```


    This command would work the same as a printf without the > redirection, but there
    is an important difference. It displays an error message to the screen, no matter
    where standard output has been previously redirected.


    Because standard error, like standard output, is a kind of renaming of another
    destination, standard error can be likewise redirected. The redirection symbols
    for standard error are the same as standard output except with the number 2.


    ```

    $ bash listorders.sh 2 > listorders_errors.txt

    ```


    In this example, all the error messages from the listorders.sh script are saved
    in the file listorders_errors.txt.


    If the la command wrote the error messages directly to the screen with /dev/tty,
    there would be no way to redirect the messages to a separate file.


    Linux treats all input as if it was being read from a file.This special file is
    called standard input, and uses the symbol &. /dev/stdin can also be used for
    standard input. When commands are joined together with the | symbol, the standard
    input of the second command becomes the standard output of the first command.


    Redirections can be combined for a single command. Order is as important as redirection
    is handled left-to-right. To redirect both standard output and standard error
    to a single file, the following command works.


    ```

    $ bash listorders.sh > listorders_errors.txt >&2

    ```


    However, reversing the order of the redirections does not work because it redirects
    standard error to the old standard output and then redirects output to the file
    listorders_errors.txt.


    Because redirecting both standard input and standard error is so common, Bash
    provides a short form & that redirects both.


    ```

    $ bash listorders.sh &> listorders_errors.txt

    ```'
