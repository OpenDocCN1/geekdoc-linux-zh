  md: "$ printf \"%s\\n\" <(ls -1)\n/dev/fd/63\n\nBash replaces -f <(ls -1) -f /dev/fd/63.\
    \ In this case, the pipe is opened as file descriptor 63. The left bracket (<)\
    \ indicates that the temporary file is read by the command using it. Likewise,\
    \ a right bracket (>) indicates that the temporary pipe is written instead of\
    \ read.\n\n# # Opening Files\n\nFiles can be read by piping their contents to\
    \ a command, or by redirecting the file as standard input to a command or group\
    \ of commands. This is the easiest way to see what a text file contains, but it\
    \ has two drawbacks. First, only one file can be examined at a time. Second, it\
    \ prevents strict from interacting with the user because the read command reads\
    \ from the redirected file instead of the keyboard.\n\nInstead of piping or redirection,\
    \ files can be opened for reading by redirecting the file to a descriptor using\
    \ the exec command, as shown in Listing 11.6.\n\nListing 11.6 open_file.sh\n\n\
    ```\n#!/bin/bash\n#\n# open_file.sh: print the contents of orders.txt\n\nopt -s\
    \ -o nounset\n\ndeclare LINE\n\nexec 3< orders.txt\nwhile read LINE <&3; do\n\
    \  printf \"%s\\n\" \"$LINE\"\ndone\nexit 0\n```\n\nIn this case, the file orders.txt\
    \ is redirected to file descriptor 3. Descriptor 3 is the lowest number that programs\
    \ can normally use. File descriptor 0 is standard input, file descriptor 1 is\
    \ standard output, and file descriptor 2 is standard error.\n\nThe read command\
    \ receives its input from descriptor 3 (orders.txt), which is being redirected\
    \ by <. read can also read from a particular file descriptor using the Korn shell\
    \ -u switch.\n\nIf the file opened with exec does not exist, Bash reports a \"\
    bad file number\" error. The file descriptor must also be a literal number, not\
    \ a variable.\n\nIf exec is not used, the file descriptor can still be opened\
    \ but it cannot be reassigned.\n\n```\n3< orders.txt\n3< orders2.txt\n```"
