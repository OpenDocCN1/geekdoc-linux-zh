    # Transferring Files with FTP


    Besides wget, the most common way of transferring files between accounts is using
    the ftp command. FTP is a client/server system: An FTP server must be set up on
    your computer if there isn''t one already. Most Linux distributions include an
    FTP server by default.


    With an FTP client, you will have to redirect the necessary download commands
    using standard input, but this is not necessary with wget.


    To use ftp from a script, you use three switches. The -i (not interactive) switch
    disables the normal FTP prompts to the user. -n (no auto-login) suppresses the
    login prompt, requiring you to explicitly log in with the user and open commands.
    -v (verbose) displays more details about the transfer. The ftp commands can be
    embedded in a script using a here file.'
