  md: '# Chapter 13 Console Scripting


    +   - Checklists (--checklist)—Lists of selectable items

    - File select (--fselect)—Selects a file

    - Gauge (--gauge)—Thermometer graphs

    - Info box (--infobox)—Status messages

    - Input box (--inputbox)—Requests text from the user

    - Menu (--menu)—Lists alternative choices

    - Message box (--msgbox)—Info box with an OK button

    - Password (--password)—Requests text from the user hide typing

    - Radio list (--radiolist)—Lists of alternative items

    - Tail box (--tailbox)—Monitors a command

    - Time box (--timeout)—Selects time values

    - Yes/No box (--yesno)—Asks a yes/no question

    - Text boxes

    - Yesno boxes


    A yesno box is created with the --yesno switch. The dialog box contains a message
    with Yes and No buttons. The switch takes three parameters: the text, the height,
    and the width. All dialog boxes have these three parameters. the --default switches
    the No button default.


    For example, to create a dialog box with the message Are you sure? 70 characters
    wide and 7 characters, and centered in the screen, you type the following.


    ```

    $ dialog --yesno "Are you sure?"

    ```


    The status code returned by dialog indicates which button was selected: 0 is Yes
    (or OK on other dialog boxes), and 1 is No (or Cancel on other dialog boxes).
    -1 indicates an error or that the user aborted the dialog box by pressing the
    Escape key. Figure 13.1 shows a typical yesno dialog box.


    You can divide line text into separate lines by embedding line feed codes (\n)
    in the message.


    ```

    $ dialog --title Testbox "Delete files.\nAre you sure?" 7 70

    ```


    The --checklist creates a list of checkboxes. The basic parameters are the text
    caption, the height, and the width of the list. After each, checklist item is
    described using its name, the item text, and an indication of whether it is currently
    selected (on) or not (off). The selected items are printed to standard error.


    ```

    $ dialog --checklist "Printer type:" 20 70 14 p14 "printer 1" on p2 \n"printer
    2" off "Fax" off "pl1" "fax"

    $

    ```


