- img_proc: true
  md: '# Specialized Navigation and History


    Because most users can open multiple shell sessions, there is little need for
    complex movement between directories. cd switches between two directories, which
    is suitable for most circumstances. However, if you are restricted to a single
    shell session and want Bash to remember more directories, there are three built-in
    commands that maintain a list of directories.


    The built-in dirs command shows the list of saved directories. The current directory
    is always the first item in the list.


    ```

    $ dirs

    ```


    The built-in pushd (push directory) command adds (or pushes) directories onto
    the list and changes the current directory to the new directory.


    ```

    $ pushd /home/kburch/invoices

    ~/invoices

    $ pushd /home/kburch/work

    ~/work -invoices

    $ pwd

    /home/kburch/work

    ```


    There are now three directories in the list. The -n (no change) switch will put
    a directory into the list without changing directories. The -n (rotate Nth) moves
    the nth directory from the left (or, with +N, from the right) to the top of the
    list.


    The dirs -1 switch displays the directory names without any short forms.


    ```

    $ dirs -1

    /home/kburch/work /home/kburch/invoices /home/kburch

    ```


    The -v switch displays the list as a single column, and -p shows the same information
    without the list position. The -c switch clears the list. The -N (view Nth) shows
    the nth directory from the left (or, with +N, from the right).


    ```

    $ popd +1

    ```


    The built-in popd (pop directory) command is the opposite of the pushd. popd discards
    the first directory and moves to the next directory in the list.


    ```

    $ popd

    ~/invoices

    $ pwd

    /home/kburch/invoices

    ```


    The switches for popd are similar to pushd: -n to pop without moving, and -N to
    delete the Nth entry from the left (or, with +N, the right).'
  merge: -1
  pgno: 44
- img_proc: true
  md: "# The Colon Command\n\nThe simplest shell command is the colon (:). This is\
    \ the colon command (sometimes called a \"no-op\" or \"null command\") and does\
    \ nothing. What's the use of a command that does nothing? There are some places\
    \ in shell programs where a statement is required. In those cases, you can use\
    \ : to indicate nothing special should be done.\n\nAt the command prompt, : has\
    \ no effect.\n\n```\n$ \n$ \n```\n\nThe colon command can have parameters and\
    \ file redirections. This can have strange effects, such as running the date command\
    \ using backquotes, giving the results to the null command that quietly discards\
    \ them.\n\n```\n$ : `date`\n$\n```\n\nThis has the same effect as redirecting\
    \ the output of date to the /dev/null file.\n$ date > /dev/null\nBackquotes and\
    \ redirection are discussed in an upcoming chapter.\n\n# Reference Section\n\n\
    # date Command Switches\n\n+   - --date=s (or -d s)—Displays time described by\
    \ s.\n- --file=f (or -r f)—Displays times listed in file f.\n- --iso-8601=t (or\
    \ -I t)—Displays an ISO-8601 standard time.\n- --reference=f (or -r f)—Displays\
    \ last modification date of file.\n- --rfc-822 (or -R)—Uses RFC-822 format.\n\
    - --universal (or -utc or -u)—Uses Coordinated Universal Time.\n\n# tty Command\
