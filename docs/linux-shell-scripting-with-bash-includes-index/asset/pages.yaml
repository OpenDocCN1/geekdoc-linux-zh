    The groff codes begin line by themselves with a period (.), followed by a one-two-letter
    code. For example, the .B code indicates that the text that follows is bold (similar
    to the HTML <b> tag).

    The groff predefined macros panting to manual pages are documented in the section
    7 manual page on man (man 7). Some of the more commonly used groff codes are as
    follows:


