    # # noclobber and Forced Overwriting


    Normally, when standard output is redirected using, an existing file with the
    same name is overwritten.


    ```

    $ printf "First line\n" > temp.txt

    $ printf "Second line\n" > temp.txt

    $ cat temp.txt

    Second line

    ```


    To provide a safety measure against overwriting an important file, the noclobber
    prevents a file from being overwritten by a redirection.


    ```

    $ | -o noclobber

    $ printf "First line\n" > temp.txt

    $ printf "Second line\n" > temp.txt

    bash: temp.txt: cannot overwrite existing file

    ```


    A file can be forcibly overwritten using >| instead of.


    ```

    $ printf "Second line\n" | temp.txt

    $ cat temp.txt

    Second line

    ```


    The noclobber option is primarily intended for interactive sessions whereby might
    type the wrong filename. However, it can also be used as a debugging tool in scripts,
    identifying places where > used instead of >> or where files are not cleaned up
    between script runs.'
