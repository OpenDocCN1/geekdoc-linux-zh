    East Coast Branch

    Inner script finished

    West Coast Branch

    ```


    The only way to return a value to the calling program is to write it to a file
    (or standard output) and having the calling program read (or assign) the value
    back into a variable.


    # The eval Command


    Bash performs substitutions as variables are encountered in a command. Before
    a command is executed, Bash searches the command for all dollar signs and inserts
    the value of variables before the command is carried out. If a variable contains
    a value with a dollar sign in it and the value is substituted into a command,
    the value with the dollar sign remains unchanged.


    ```

    $ declare -rx COMPANY="Value Book Resellers"

    $ declare -rx TITLE=''$COMPANY''

    $ printf "%s\n" "$TITLE"

    COMPANY

    ```


    Before the printf is performed, Bash substitutes the value "$COMPANY" for TITLE.
    Bash does not repeat the substitution process to replace the COMPANY variable
    with "Value Book Resellers". Substitutions are performed only once.'
