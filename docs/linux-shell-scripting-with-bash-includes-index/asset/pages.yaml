  md: '# Device Files


    be dereferenced:When Linux opens the symbolic link file, it reads the correct
    pathname and opens that file instead. When the file being referred to is deleted,
    the symbolic link becomes a dangling link to a non-existent file.


    Using links means that two different pathnames can indicate the same file. To
    identify a particular file, Linux assigns a number to each file:This number is
    called the node (or "index node")and is unique to any storage device. If two pathnames
    refer to a file with the same node, one of the paths is a hard link.


    In the ext2 file system, there is a limited number of inodes, which in turn places
    an upper limit to the number of files that can be stored on a disk. The number
    of inodes compared to the amount of disk space is called the inode density. The
    density is specified when a disk or partition is initialized. Most Linux distributions
    use an inode density of 4K, or one node per 4096 bytes of disk space.


    # Pipe and Socket Files


    Pipe files are a special kind of file shared between two programs. The file acts
    as a buffer for sharing information. One program writes to the pipe file and the
    other reads from the pipe. When the pipe file reaches a certain size, Linux halts
    the writing program until the reading program can "catch up"


    A similar kind of file is a Unix socket file. A socket file acts like a pipe but
    works using network sockets. However, this kind of file is not easily used in
    shell scripts and it won''t be covered in this book.


    # Device Files


    The last common kind of nonregular file is a device file. Keeping with the file-oriented
    design of Linux, devices are represented by files. Device files allow direct communication
    to a particular device attached to a computer. There are actually two kinds of
    device files, but shell programmers are mainly interested in the type called character
    device files.


    All files are located in the /dev directory. Even though many files are located
    in /dev, not all of these devices may be present. Rather, /dev contains a list
    of devices that can be attached to your computer because the Linux kernel is configured
    to recognize them if they were attached.


    Most of these files are not accessible to regular users, but there are few that
    are open to general use. One important device file available to all users is /dev/null.This
    file represents an imaginary "black hole" device to your computer that consumes
    anything sent to it. It is useful for discarding unwanted responses from a shell
    command. /dev/null can also be read, but the file is always empty.


    Another device file is /dev/zero. This file contains an endless stream of zeros,
    and can be used to create new files that are filled entirely with zeros.


    There are a variety of other devices that may appear in /dev, depending on your
    distribution and computer hardware. Common device files include:'
  merge: -1
