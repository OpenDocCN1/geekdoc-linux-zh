    bits have no effect on shell scripts.


    chmod does not change symbolic links. Linux ignores the permissions on a symbolic

    link and they always appear as 0777 permissions. The only access rights that matter

    the permissions of the file that the symbolic link points to. If a file cannot
    be accessed, it

    won''t be accessed through a symbolic link.


    The chmod switches are same as the command, except there is no -from

    switch to verify old permissions.

    If no g, o, or a, the permission is applied as if a was typed, except that only

    reasonable changes are allowed. What is a reasonable change? This is determined
    by the

    umask command.


    Use chmod to qualify how the users with the right to access a file can change
    the file.

    The correct permissions should reflect how the file is to be used. If a file is
    infrequently

    updated, remove the write permission to protect against accidental changes. If
    a file is

    maintained by its owner and only read by its group, remove the group''s permission
    to

    write. Files with 777 permissions are a sign of a sloppy programmer or the hasty
    work of

    bus consultant.


    In most cases, you don''t want other users to have any access to the file; remove
    all

    access rights for other users. If you can''t remove all access rights for others,
    consider

    changing the file ownership.


    Users who run a script should always be able to read it. Unlike a normal program,

    execute permission does not allow a user to run a script. Bash must load a script

    in order to execute it, scripts must be read. If you want a user to be able to
    run a script

    directly, without referring to the Bash program, include both execute and read
    rights.


    Don''t depend on the access rights of a directory to protect a file. There is
    always a

    chance that the file will move in the future; moving the file should not change
    the access

    to data it contains.'
