    \ sign to it. This closes the original file after the descriptor was copied.\n\
    \n```\nexec 4<&3\n```\n\nYou can likewise duplicate file descriptors with >& and\
    \ move them by appending a minus sign. The default output is standard output (descriptor\
    \ 1).\n\nTo open a file for writing, use the output redirection symbol (>).\n\n\
    ```\nexec 3>orders.txt\nexec 4>orders.log\nwhile read LINE <3; do\n  printf \"\
    %s\\n\" \"$LINE\" >4\ndone\n```\n\nThe <> symbol opens a file for both input and\
    \ output.\n\n```\nexec 3<>orders.txt\n```\n\nThe reading or writing proceeds sequentially\
    \ from the beginning of the file. Writing to the file overwrites as long as the\
    \ characters being overwritten are the same length as the original characters,\
    \ the new characters replace the old. If the next line in a file is dog, writing\
    \ the line cat replaces the word dog. However, if the next line in the file is\
    \ horse, writing cat creates two lines—the cat and the line se. The script will\
    \ now read the line se. <> has limited usefulness with regular files because there\
    \ is no way to \"back up\" and rewrite something that was just read. You can only\
    \ overwrite something that you are about to read next.\n\nThe script in Listing\
    \ 11.7 reads through a file and appends a \"Processed on\" message to the end\
    \ of the file."
