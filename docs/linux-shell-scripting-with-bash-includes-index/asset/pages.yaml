- img_proc: true
  md: '# Chapter 2 Operating the Shell


    The built-in cd (change directory) command changes your current directory. As
    discussed in Chapter 1,"The Linux Environment,"the special directory . . represents
    the parent directory, whereas . represents the current directory.


    ```

    $ pwd

    /home/kburtch

    $ cd

    /home/kburtch

    $ pwd

    /home/kburtch

    $ cd ..

    /home/kburtch

    $ pwd

    /home

    $ cd kburtch

    $ pwd

    /home/kburtch

    ```


    Each time you change the directory, Bash updates the variable PWD containing the
    path to your current working directory. Bash also maintains a second variable
    called OLDPWD that contains the last directory you were in.


    Using the minus sign (-) with cd, you can switch between the current directory
    and the last directory. This is a useful shortcut if you are doing work in two
    different directories.


    ```

    $ pwd

    /home/kburtch

    $ cd ..

    $pwd

    /home

    $ cd -

    $pwd

    /home/kburtch

    $ cd -

    $pwd

    /home

    ```


    The tilde (~) represents your current directory. Use it to move to a directory
    relative to your home directory. To move to a directory called mail in your home
    directory, type $ cd ~/mail


    Although and . . work in all Linux programs, ~ and - are features of Bash and
    only work with Bash and Bash scripts.


    cd by itself returns you to your home directory, the same as cd ~

    If a CDPATH variable exists, it is assumed to contain a list of directories similar
    to the PATH variable. This is a drawback to the days when a user was only able
    to use one shell session on his terminal and is now considered a security risk.
    Its use should be avoided.'
  merge: -1
