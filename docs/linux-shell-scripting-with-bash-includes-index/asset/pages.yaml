  md: "# Word Designators and Modifiers\n\nFor example, in the following script fragment,\
    \ a log is created, but the date is missing\from the log. Using noclobber. Bash\
    \ displays an error for the line overwriting the date.\n\n```\n!/bin/bash\n\n\
    shopt -s o nounset\nshopt -s o noclobber\n\ndeclare -rx LOG=\"log.txt\"\n\ndate\
    \ >$LOG\nprintf \"Results of night batch run:\\n\" > $LOG\n```\n\n# etc.\nThe\
    \ printf should use a >> redirection.\n| shouldn't be used in a script because\
    \ it defeats the purpose of using noclobber.\n\n# The fc Command\n\nThe built-in\
    \ fc (fix command) command lists and edits the command history. This command has\
    \ been largely superseded by the history and ! recall commands.\nfc starts the\
    \ default editor to alter the last command executed. When you leave thent editor,\
    \ the command executes. Of the entire command, only the first characters of a\
    \ command are needed to make a match. Alternatively, you can specify a range of\
    \ lines to edit. If the lines with a minus sign, the lines are counted from the\
    \ end of the history (with -1 being the most recent command).\nnWith the -s (substitute)\
    \ switch, instead of starting the editor, fc substitutes all occurrences of a\
    \ word that you specify before executing the command for another word. For example,\
    \ to edit a file with pico and then compile the file with the gcc compiler, use\
    \ -pico=\"gcc\" to substitute gcc for pico.\n\n```\n$ pico project.c\n$ fc -s\
    \ \"pico=gcc\" p\ngcc project.c\n```\n\nThe -1 (list) switch lists the most recent\
    \ items in the history, and you can specify the first line, or the first and last\
    \ lines, to display. The -n (no line numbers) switch suppresses the line numbers\
    \ in the history, and -r (reverse) reverses the order in which they are printed.\n\
    \n# ! Word Designators and Modifiers\n\nThe basic features of the ! history recall\
    \ command were discussed in Chapter 3. In fact, ! has a number of features that\
    \ you can enable to select which command is recalled and determine whether not\
    \ new information should be substituted into the command before executing it."
