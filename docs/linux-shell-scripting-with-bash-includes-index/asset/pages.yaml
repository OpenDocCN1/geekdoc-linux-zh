  md: '# Default Access Rights (umask)


    Bash determines the default access rights to a file using the built-in umask command.
    The umask, or user file creation mask, is a number indicating which access rights
    are normally disallowed. Running umask by itself shows the current umask value
    as an octal number, and the -s switch shows which bits the umask allows.


    ```

    $ touch newfile.txt

    $ ls -1 newfile.txt

    -rw-rw- 1 kburtch kburtch      0 May 22 11:34 newfile.txt

    $ umask

    0022

    $ umask -S

    u=rwx,g=rwx,o=rx

    ```


    In this example, the umask is set to 2, meaning bit 2 (others can write to the
    file) should normally be off. The touch command gave all users read and write
    access except for other users who are not allowed to write.


    You can create new umask values by specifying an octal number or a permission
    string.


    ```

    $ umask 0

    $ rm newfile.txt

    $ touch newfile.txt

    $ ls -1 newfile.txt

    -rw-rw-rw 1 kburtch kburtch      0 May 22 11:40 newfile.txt

    ```


    With a umask of 0 (everything allowed), the touch command created a file that
    can be written or read by anyone.


    Honoring the umask command is strictly up to an individual script or command.
    There is nothing built into Bash that programs to check the umask value. In a
    script, applying umask is cumbersome because the umask and the permissions are
    in octal notation, but it can be done, as shown in Listing 15.1.


    Listing 15.1 calculate_mode.sh


    ```

    #!/bin/bash

    # calculate_mode.sh: fragment showing how to honor the umask

    DESIRED_MODE="$1"

    # Convert from octal to decimal

    DESIRED_MODE_DECIMAL=$(printf "%d" "$DESIRED_MODE")

    # Get umask and convert to decimal

    UMASK_DECIMAL=$(printf "%d" "$umask")

    # Invert the bits in the umask so set bits are the allowed bits

    let UMASK_INVERT=$~UMASK_DECIMAL

    # Only allow bits that are allowed by the umask

    ```'
