  md: '# Restricted Shells


    Bash enters restricted mode when it starts with the name bash or when the -r option
    is supplied when Bash runs. A restricted shell prevents a script or user from
    creating or accessing files outside of the current directory. In particular, a
    restricted shell has the following restrictions:


    +   - No changing directories with cd

    - No setting or unsetting the values of SHELL, PATH, ENV, or BASH_ENV

    - No specifying command names containing /

    - No specifying a filename containing a / (slash) as an argument to the built-in
    command

    - No specifying a filename containing a slash as an argument to the -p option
    to the hash built-in command

    - No parsing the value of SHELLOPS from the shell environment at startup

    - No redirecting the output using the >, |, <, &, >> redirection operators

    - No using the exec built-in command to replace the shell with another command

    - No adding or deleting built-in commands with the -f and -d options to enable
    built-in command

    - No specifying the -p option to the built-in command

    - No turning off restricted mode with set +r or +o restricted

    - No exporting of shell functions


    Otherwise, a restricted shell operates the same as a normal shell. These restrictions
    are enforced after any start-up files are read, so the profile files can set the
    user''s environment without restrictions. The only exception is that function
    definitions can''t be imported at startup.


    ```

    $ bash -r

    $ cd *

    bash: cd: restricted

    $ echo $DATE > temp.txt

    bash: temp.txt: restricted: cannot redirect output

    $ NOW="date"

    $ printf "%s\n" "$NOW"

    Thu Jul 5 16:59:28 EDT 2001

    $ exit

    exit

    ```


    Restricted shells are very confining but provide a high level of security. When
    used in script programming, redirect standard output and standard error prior
    to running the restricted script because the script itself cannot redirect standard
    output.'
