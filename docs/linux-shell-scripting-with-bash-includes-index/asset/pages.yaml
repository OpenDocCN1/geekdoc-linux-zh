    stattime can create meaningful filenames. Often files are sent with a name as
    orders.txt and the script saves to order the files with the date as part of the
    name.


    ```

    $ stattime -f "%a_%L%d.txt" orders.txt

    orders.0509.txt

    ```


    Besides generating new filenames, stattime can be used to save information about
    a file to a variable.


    ```

    $ BYTES=$(stattime -f "%s" orders.txt)

    printf "The file size is %d bytes\n" "$BYTES"

    The file size is 21704 bytes

    ```


    When a list of files is supplied on standard input, the command processes each
    file in turn. The %z code provides the position of the filename in the list, starting
