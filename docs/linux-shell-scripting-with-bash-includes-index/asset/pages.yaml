  md: '# 13


    # Console Scripting


    IN ANY OF THE COMPANIES THAT I worked for, if you were given the task of writing
    a short utility program, and after two weeks, you returned with a beautiful-looking
    X Windows application, you would be called in front of the boss and be sharply
    criticized. In the business world, time is money and developing GUI applications
    are time-consuming and expensive.


    Console scripts, sometimes called text-based or terminal scripts, are scripts
    designed to run in a text-only environment such as the Linux console, a Telnet
    session, or an xterm window. Console scripts are easy to design and quick to build,
    but they don''t have to be hostile to the user. Bash and Linux both provide features
    for writing friendly console scripts that won''t drain a department''s development
    budget.


    # The Linux Console


    In the early days of Unix, a computer was a number-crunching device that had neither
    keyboard nor monitor. To control the computer, a separate administration workstation
    had to be attached to the system. This dedicated workstation was known as the
    console. From its keyboard, the system administrator oversaw the startup and shutdown
    of the computer. All critical error messages were displayed on the console''s
    screen or, sometimes, on its printer.


    Linux, which is based on Unix, still requires a dedicated console. From Linux''s
    point of view, the console is not a separate device—it''s the computer''s keyboard
    and monitor. The console is the text-only display that appears when a Linux computer
    starts up. When terminal windows are opened in X Windows, they are not consoles.
    The console is hidden "behind" the desktop.


    Linux actually creates seven virtual consoles (also called VCs or VTs) that act
    much the same way as separate X Windows terminal sessions. Each one can be selected
    using the Alt-F1 through Alt-F7 keys.'
  merge: -1
  pgno: 254
