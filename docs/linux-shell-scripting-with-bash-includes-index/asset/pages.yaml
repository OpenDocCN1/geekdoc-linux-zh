  md: '# The Console Display


    237


    # # The Console Display


    The consoleVT-100 compatible display is not controlled by Linux commands through
    special sequences of characters printed to the display. The console recognizes
    these characters as commands to execute and the characters are not shown.


    The Linux setter command acts like a printf command, printing the appropriate
    characters to execute a display command. Some of the setter uses the words "on"
    or "off" to enable or disable features. Because setter is essentially a printf
    command, you can save common commands into a variable by capturing the command''s
    output. Doing so improves the performance of a script.


    There are several switches for changing the color of text. A color is one of black,
    red, green, yellow, blue, magenta, cyan, or one of these with bright in front
    of it. default is the default color. The -foreground switch sets the console normal
    text color. The -background sets the console background text color. The -ulcolor
    switch sets the console dim text color.


    Different text styles can be turned on or off with the appropriate switch: -bold,-half-bright,-blink,-reverse,
    or -underline.


    ```

    $ setter -ulcolor bright blue

    $ setter -underline on; printf "This is bright blue\n" \

    $ setter -underline off

    ```


    This is bright blue


    Because the Linux console cannot show underlining, underlined text is shown the
    underline color you select. In this case, the color is bright blue. In an xterm
    window, the text is actually underlined.


    The same can be done by storing the setter results in variables.


    ```

    $ UNDERLINE=''setter -underline on''\n$ UNDEROFF=''setter -underline off''

    $ printf "$UNDERLINEThis is underlined\$UNDEROFF\"\n"

    ```


    This is underlined


    The -inverscreen switch reverses the console''s colors. If you use it twice,-inverscreen
    can make the display flash to alert the user to an important event,


    For example, to flash the screen for second, do this


    ```

    $ setter -inverscreen on

    $ sleep 1

    $ setter -inverscreen off

    ```'
  merge: -1
