  md: '# The eval Command 79


    Under rare cases, you might want to force Bash to perform an additional round
    of substitutions. The Bash eval command can do substitutions on demand and run
    the results. Take the following simple example, shown in Listing 5.3, whereby
    one of three variables is shown on the screen.


    Listing 5.3 eval_example.sh


    ```

    shopt -s -o nounset


    declare -r DISPLAY_VARIABLE=''$SALES_EAST''


    declare -i SALES_EAST=1000

    declare -i SALES_WEST=2000

    declare -i SALES_NORTH=3000

    ```


    ```

    printf "DISPLAY_VARIABLE = %s\n" "$DISPLAY_VARIABLE"

    printf "reprocessed with eval, DISPLAY_VARIABLE = %s\n" \

    ''eval printf "%s\n" "$DISPLAY_VARIABLE"

    ```


    This script can display the sales figures for one of three branches. The constant
    DISPLAY_VARIABLE contains the variable to display, SALES_EAST, SALES_WEST, or
    SALES_NORTH. But if DISPLAY_VARIABLE is substituted, only the string "$SALES_EAST"
    is printed.


    The backquotes run and perform a new set of substitutions. The results can be
    substituted into the original printf command. Now are the results as you expect.


    ```

    $ bash eval_example.sh

    DISPLAY_VARIABLE = $SALES_EAST

    reprocessed with eval, DISPLAY_VARIABLE = 1000

    ```


    In this example, Bash first processes the printf command as


    ```

    printf "reprocessed with eval, DISPLAY_VARIABLE = %s\n" \

    ''eval printf "%s\n" "$SALES_EAST"

    ```


    This only prints $SALES_EAST because Bash is finished substituting the values
    of variables. When Bash executes the eval command, there is a second examination
    of the echo command.


    ```

    printf "reprocessed with eval, DISPLAY_VARIABLE = %s\n" '' printf "%s\n" 1000''

    ```


    Because Bash also attempts to run the result, the echo command, a simpler version
    of printf, is required: eval tries to execute the re-evaluated $DISPLAY_VARIABLE
    as it were a command. That is, with eval 1000, Bash would try to execute the number
    1000, which is not what you want.


    ```

    printf "reprocessed with eval, DISPLAY_VARIABLE = %s\n" 1000

    ```'
