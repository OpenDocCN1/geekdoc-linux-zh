  md: '+   - .sh—A Bash shell script


    +   - .txt—A generic text file


    +   - .log—A log file


    +   - .html—A HTML Web page


    +   - .tgz (or .tar.gz)—Compressed file archive


    Commands usually have no suffix.


    # # Directories


    Shell scripts, text files and executable commands and other normal files are collectively
    referred to as regular files. They contain data that can be read or instructions
    that can be executed. There are also files that are not regular, such as directories
    or named pipes; they contain unique data or have special behaviors when they are
    accessed.


    Files are organized into directories, or listings of files. Like all other files
    in Linux, a directory is also treated as a file. Each directory can, in turn,
    contain subdirectories, creating hierarchical listings.


    Directories are organized into a single monolithic tree. The top-most directory
    is called the root directory. Unlike some other operating systems that have separately
    labeled disks, Linux treats any disk as subdirectories within the main directory
    structure.


    From a user''s point of view, it is impossible to tell which disk this particular
    directory belongs to. Everything appears as if it belongs to a single disk.


    A pathname is a string that identifies the location of a particular file, the
    sequences of directories to move through to find it. The root directory is denoted
    by a forward slash (/) and so /payroll.dat represents a named payroll.dat, located
    in the top-most directory. Using more directories and forward slashes can specify
    additional directories.


    When users log in, their home directories are located under the directory /home.
    The path /home/julbis/payroll.dat identifies a file named payroll.dat in the home
    directory of the user julbis. The home directory is represented by a tilde (~)
    in Bash.


    The current directory (working directory) is denoted by a period (.). When a pathname
    doesn''t start with a leading slash, Bash assumes it''s a path relative to the
    current directory. /payroll.dat and payroll.dat both refer to a file named payroll.txt
    in the current directory. When running programs, this might not be true. This
    exception is discussed in the next chapter.


    The parent directory is represented by a double period (.. The double period can
    be used at any place in a path to move towards the root of the directory tree,
    effectively canceling the previously mentioned directory in a path. However, it
    makes the most sense to use the double period as the first directory in a path.
    If /home/julbia/../kburtch/payroll.dat is the same as the pathname /home/kburtch/payroll.dat.
    The double period represents the parent directory of /home/julbis, the /home directory.'
