  md: '# Chapter 13 Console Scripting


    A console acts as if you are an enhanced DEC VT-100 terminal and any program designed
    to run on a VT-100 (or in an xterm window) can also run on the Linux console.
    The text is drawn in the current console font as selected by the Linux consolechars
    command (or the obsolete setfont command).


    To determine whether the current session is in a console, use the tty command.
    This command prints the name of the terminal you are on.


    ```

    $ tty # not a console

    /dev/pts/1

    ```


    Each console has a unique tty device name, /dev/tty1 to /dev/tty7. The main console,
    the one that appears on Linux startup, is /dev/tty1.


    ```

    $ tty # the main console

    /dev/tty1

    ```


    The Linux fgconsole command prints the number of the console. It reports an error
    if you are not on a console.


    ```

    $ fgconsole

    ```


    If your distribution doesn''t have fgconsole, check the name returned by tty:


    ```

    IS_CONSOLE=

    TTY=''tty'' in

    case ''tty'' in

    /dev/tty*/|/dev/vc*) IS_CONSOLE="1";

    *) printf "\s\n" "This is a console";

    esac

    ```


    Some Linux commands work only on a console, not a text session. The errors are
    not always intuitive.


    ```

    $ showkey

    Couldn''t get a file descriptor referring to the console

    $ setsled

    KDGETLED: Invalid argument

    Error reading current led setting. Maybe stdin is not a VT?

    ```


    # The Console Keyboard


    A shell script can control the console keyboard''s key layout, change the current
    input mode, and the LED lights.


    The console input method determines how the keystrokes typed by the users are
    processed. There are four input modes:


    +   * Scancode (or Raw) mode—read the numeric codes representing the individual
    keys on the keyboard. Pressing or releasing a key results in separate codes. Up
    to six individual scancodes can be returned for a single key press.'
  merge: -1
  pgno: 255
- img_proc: true
  md: '# The Console Keyboard 235


    +   - Keycode (or MEDIUMRAW) mode—Scripts read the numeric codes representing
    the console driver''s interpretation of the keys. Usually two keycodes are returned,
    for pressing and another for releasing a key. Different keys have different keycodes.
    For example, pressing the left or right Shift key returns different keycodes.


    +   - ASCII (or XLATE) mode—This is the normal console mode. A script reads the
    ASCII character codes for each keyboard board. Modifier keys leave the Shift key
    only affect other keys.


    +   - UTF-8 (or UNICODE) mode—THE same as ASCII mode except 16-bit Unicode characters
    are returned instead of ASCII. For most characters, ASCII and UTF-8 are the same.
    However, this can return as many as three bytes for a particular key instead of
    the ASCII simple byte.


    The Linux showcommand demonstrate each of these modes. Use -scancodes to run the
    program in scancode mode, -keycodes to run the program in keycode mode, and so
    on. The following example shows what happens when the a is pressed.


    ```

    $ showkey -keycodes

    kb mode XLATE

    press any key (program terminates after 10s of last keypress)

    keycode 28 release

    keycode 30 press

    keycode 30 release

    $ showkey -scancodes

    kb mode XLATE

    ```


    The kbd mode command changes the current keyboard mode:-s (scancode), -k (code),
    -a (ASCII) or u (UTF-8).

    Scripts can safely switch between ASCII and UTF-8 mode. In both cases, the Return
    or Enter key is treated normally and commands as read behave as expected.


    Things are more difficult when in scancode or keycode mode. Pressing the Return
    key no longer returns the ASCII/UTF-8 code 13, and as a result, is no longer certain
    to finish reading. The only solution is to use the timeout feature and have the
    script check for the appropriate scancode or keycode representing the Return key.


    If a console has LED lights for caps lock, scroll lock, and number lock, they
    can be turned on and off using the setled command. Without arguments, setled shows
    the current settings.'
