  md: '# Variable Assignments and Displaying Messages


    +   - rprnt (usually ^R)—Redraw the current line.

    - stop (usually ^S)—Pauses the program so you can read the results on the screen.

    - start (usually ^Q)—Resumes the program.

    - susp (usually ^Z)—Suspends the current program.

    - werase (usually ^W)—Erases the last word typed.


    To change the suspend character to control-v,

    $ stty susp ^v


    Changing key combinations can be very difficult. For example, if you are running
    an X Windows server (the software that runs on a client computer) on a Microsoft
    Windows computer to access a Linux computer, key combinations can be affected
    by the following:


    +   - Microsoft Windows

    - The X server software

    - The Linux window manager

    - The stty settings


    Each acts like layers of an onion and they must all be in agreement. For example,
    shift-insert, often used to paste text, might be handled by your X Window server
    before your Linux computer or your shell have a chance to see it.


    # Variable Assignments and Displaying Messages


    Variables can be created and assigned text using an equals sign. Surround the
    text with double quotes.


    ```

    $ FILENAME="info.txt"

    ```


    The value of variables can be printed using the printf command. printf has two
    arguments: a formatting code, and the variable to display. For simple variables,
    the formatting code is "%s\n" and the variable name should appear in double quotes
    with a dollar sign in front of the name


    ```

    $ printf "%s\n" "$FILENAME"

    ```


    info.txt


    printf can also display simple messages. Put the message in the place of the formatting
    code.


    ```

    $ printf "Bash is a great shell.\n"

    ```


    Bash is a great shell.


    printf and variables play an important role in shell scripting and they are described
    in greater detail in the chapters to come.'
