  md: '# Chapter 10 Job Control and Signals


    ```

    $ sleep 15 &

    [1] sleep 1225

    $ killall sleep

    [1]+ Terminated

    ```


    There are a number of switches for killall. The -e switch doesn''t kill swapped
    processes with long filenames. The -g switch kills the process group. The -i prompts
    before killing. The -q suppresses the warning when no processes are killed. The
    -w switch forces killall to wait until all processes have finished.


    # Being Nice


    All Linux programs run with a priority number between -20 and 19. The priority
    indicates the importance of the program, with lower numbers getting more time
    running than higher numbers.


    The nice command changes the priority of a command. nice should always be used
    when a script consumes a lot of resources in order to prevent more important jobs,
    such as handling user sessions, from being slowed or interrupted. Background tasks
    are automatically nice by Bash when they are started.


    By default, nice reduces the priority (that is, it increases the priority number)
    by 10. Any number can be used, but the priority can only be reduced and can never
    be less than 19. (The superuser, however, can reduce or increase the priority
    of any program.) The adjustment can be specified as a number after a minus sign,
    or by using the more readable --adjustment=VALUE (or -n VALUE) switch.


    ```

    $ nice --adjustment=20 big_script.sh &

    ```


    A corresponding renice command changes the priority of a running background task.
    As nice, the priority can only be reduced. Unlike renice, the priority is a specific
    priority, not an offset.


    The priority is a number immediately after the command (with no -). The -p (PID)
    switch indicates the parameters are process identification numbers. The -g switch
    indicates a list of process groups. The -u switch indicates usernames to change.
    Obviously, you can only renice programs that you own.


    ```

    $ bash_script.sh &

    [1] 22516

    $ renice 10 22516

    ```


    22516: old priority 0, new priority 10


