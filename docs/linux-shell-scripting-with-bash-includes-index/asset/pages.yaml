    tr supports character equivalence. To translate any e-like characters in a variable
    named FOREIGN_STRING to a plain e, for example, you use


    ```

    $ printf "%FOREIGN_STRING" | tr "[=e]" "e"

    ```


    The--truncate-set (or -t) ignores any characters in the first parameter that don''t
    have a matching character in the second parameter.


    The--complement (or -c) switch reverses the sense of matching. The characters
    in the first parameter are not mapped into the second, but characters that aren''t
    in the first parameter are changed to the indicated character.


    ```

    $ printf "%s\n" "The cow jumped over the moon" | tr -complement ''aeiou'' ''?''
    ??????u??o=???oc??

    ```


    The--squeeze-repeats (or -s) switch reduces multiple occurrences of a letter to
    a single character for each of the letters you specify.


    ```

    $ printf "%s\n" "aaabbccc" | tr -squeeze-repeats ''c'' aaabbbc

    ```


    By the most common use of tr is to translate MS-DOS text files to Unix text files.
    DOS text files have carriage returns and line feeds, whereas Linux uses only line
    feeds to mark the end of a line. The extra carriage returns need to be deleted.


    ```

    $ tr -d ''\\r'' < dos.txt > linux.txt

    ```


    Apple text files have carriage returns instead of line feeds. tr can take care
    of that by replacing the carriage returns.


    ```

    $ tr ''\\r'' ''\\n'' < apple.txt > linux.txt

    ```


