  md: "# Positional Parameters\n\nAlthough positional parameters are a straightforward\
    \ way to view switches and arguments, they do not “walk through” the list. There\
    \ is a built-in shift command that clears the parameter in $1 and moves the remaining\
    \ parameters down one number to its place. Using shift, you can check each parameter\
    \ in turn as if it were the first parameter.\n\nListing 9.2 shows a complete example,\
    \ using shift.\n\n# Listing 9.2 param2.sh\n\n```\n#!/bin/bash\n#\n# param2.sh\n\
    #\n# This script expects the switch -c and a company name. --help (h)\n# is also\
    \ allowed.\n\nshopt s -o nounset\n\ndeclare -rx SCRIPT=${###}\n\n# Make sure there\
    \ is at least one parameter or accessing $1\n# later will be an error.\n\nif [\
    \ $# -eq 0 ]; then\n    printf \"%s\\n\" \"Type --help for help.\"\n    exit 192\n\
    fi\n\n# Process the parameters\n\nwhile [ $# -gt 0 ]; do\n    case \"$1\" in\n\
    \        -h | --help) Show help\n            printf \"%s\\n\" \"usage: $SCRIPT\
    \ [-h][--help] -c companyid\"\n            exit 0\n            ;;\n        -c\
    \ )\n            if [ $# -eq 0 ]; then\n                printf \"%s\\n\" \"$SCRIPT:$LINENO:\
    \ company for -c is missing\" >&2\n                exit 192\n            fi\n\
    \            COMPANY=\"$1\"\n            ;;\n        -*) printf \"%s\\n\" \"$SCRIPT:$LINENO:\
    \ switch $1 not supported\" >&2\n            exit 192\n    esac\n    shift\n```"
