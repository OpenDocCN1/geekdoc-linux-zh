    The actual Linux security model is much more complex with more types of ID numbers,
    but these don''t affect scripting. The fourth and left-most permissions digit
    represents access rights for special programs and directories. These are covered
    in the section on chmod, later in this chapter. Normally, this digit is zero.


    The superuser, root, or uid has full access to all files.


    # Knowing Who You Are (id)


    The id command identifies your login name and group and any supplementary groups
    you belong to. The command displays both the names and the corresponding numbers.


