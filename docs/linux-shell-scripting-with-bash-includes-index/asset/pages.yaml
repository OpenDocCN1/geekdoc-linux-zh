  md: '# Chapter 3 Files, Users, and Shell Customization


    +   * %s-Display an unquoted string

    * %u-Display an unsigned number

    * %x-Display an unsigned hexadecimal number


    If there is a large number, Bash reports an out-of-range error.


    ```

    $ printf "%d\n" 123456789123456789012

    bash: printf: warning: 123456789123456789012: Numerical result out of range

    ```


    For compatibility with C''s printf, Bash also recognizes the following flags,
    but treats them same as %d:


    +   * %j-A C intmax_t or uintmax_t integer

    * %t-A C ptrdiff_t integer

    * %z-A C size_t or ssize_t integer


    Also for C compatibility, you can preface the format codes with a 1 or L to indicate
    a number.


    The %q format is important in shell programming and is discussed in the quoting
    section, in the Chapter 5, "Variables."


    To create reports with neat columns, numbers can proceed many of the formatting
    codes to indicate the width of a column. For example, "%10d" prints a signed number
    in a column 10 characters wide.


    ```

    $ printf "%10d\n" 11

    11

    ```


    Likewise, a negative number left-justifies the columns.


    ```

    $ printf "-%10d %-10d\n" 11 12

    11        12

    ```


    A number with a decimal point represents a column width and a number of digits
    (or decimal places with floating-point numbers). For example, "%10.5f" indicates
    a floating-point number in a 10-character column with a minimum of five decimal
    places.


    ```

    $ printf "%10.5f\n" 17.2

    17.20000

    ```


    Finally, an apostrophe ('''') displays the number with thousands groupings by
    the current locale.


    The \ in the format string is an example of a backslash code for representing
    unprintable characters. \n indicates a new line should be started. There are special
    backslash formatting codes for the representation of unprintable characters.'
