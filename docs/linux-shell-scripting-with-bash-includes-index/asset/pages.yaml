    # # File Editing (sed)


    The Linux sed (stream editor) command makes changes to a text file on a line-by-line
    basis. Although the name contains the word "editor," it''s not a text editor in
    the usual sense You can''t use it to interactively change a file. Where the grep
    command locates regular expression patterns in a file, the sed command locates
    patterns and makes alterations where the patterns are found.


    sed''s main argument is a complex four-part string, separated by slashes.

    $ sed "/s/dog/canine/g" animals.txt


    The first part indicates the kind of editing sed will do. The second part is the
    pattern of characters sed is looking for. The third part is the pattern of characters
    to apply with the command. The fourth part is the range of the editing (if there
    are multiple occurrences of the target pattern). In this example, the sed expression

    "/s/dog/canine/g", the pattern to match is the pattern to apply is canine, and
    the range is g. Using this expression, sed will substitute all occurrences of
    the string dog with canine in the file animals.txt.


    The use of quotation marks around the sed expression is very important. Many characters
    with a special meaning to the shell also have a special meaning to sed. To prevent
    the shell from interpreting these characters before sed has a chance to analyze
    the expression, the expression must be quoted.


    Like grep, sed uses regular expressions to describe the patterns. Also, there
    is no limit to the line lengths that can be processed by the Linux version of
    sed.

    Some sed commands can operate on a specific line by including a line number. A
    1-2 searches all lines, starting at line 1, and stepping by 2. That is, it picks
    all the odd lines in a file. A range of addresses can be specified with the first
    line, a comma, and the line number. 1,10 searches the first 10 lines.


    1,10 searches all lines except the first 10. If no lines are specified, all lines
    are searched.

    The sed s (substitute) command replaces any matching pattern with new text.

    To replace the word Pine with Cedar in the first 10 lines of file, use this


    ```

    $ head orders.txt | sed ''s/Pine/Cedar/g''

    Birwood China Rutch,475.99,1,756

    Bookcase Oak Veneer,205.99,1,756

    Small Bookcase Oak Veneer,205.99,1,756

    Reclining Chair,1599.99,1,756

    Bunk Bed,705.99,1,756

    Queen Bed,925.99,1,757

    Two-drawer Nightstand,125.99,1,756

    Cedar Toy Chest,65.99,1,756

    Six-drawer Dresser,525.99,1,756

    Cedar Round Table,375.99,1,756

    ```


    Pine Round Table becomes Cedar Round Table.


