  md: "# Chapter 7 Compound Commands\n\nThis example counts customer orders stored\
    \ as files in a directory. If there are not enough order files in the current\
    \ directory, the script will run the statements between the then and fi keywords,\
    \ printing a message and stopping the script.\n\nThe semicolon before the then\
    \ is required. then is technically a separate command, although it works in conjunction\
    \ with if. Because they are on one line, the semicolon is needed to separate the\
    \ commands.\n\nif commands can have an else part that is only executed when the\
    \ condition fails.\n\n```\nNUM_ORDERS=`ls -1 | wc -1\"\nif [ $NUM_ORDERS -lt \"\
    CUTTOFF\" ]; then\n    printf \"%s\\n\" \"Few orders...but will process them anyway\"\
    \nelse\n    printf \"%s\\n\" \"Starting to process the orders\"\nfi\n```\n\nif\
    \ commands can be nested inside other if commands.\n\n```\nNUM_ORDERS=`ls -1 |\
    \ wc -1\"\nif [ $NUM_ORDERS -lt \"STOOFEW\" ]; then\n    printf \"%s\\n\" \"Few\
    \ orders...but will process them anyway\"\nelse\n    if [[ $NUM_ORDERS -gt \"\
    STOOMANY\" ]]; then\n        printf \"%s\\n\" \"There are many orders. Processing\
    \ may take a long time\"\n    else\n        printf \"%s\\n\" \"Starting to process\
    \ the orders\"\n    fi\n```\n\nThe commands cannot be cross-nested; the inner\
    \ if must always always be completed by the outer if.\n\nTo choose a series of\
    \ alternatives, if commands can have an elif part. elif is a shortcut for else\
    \ and reduces unnecessary nesting. The elif part can be followed by a final else\
    \ part, if it is required, executed only when there are no alternatives. Combining\
    \ these ideas, you can rewrite the previous example as follows.\n\n```\nNUM_ORDERS=`ls\
    \ -1 | wc -1\"\nif [ $NUM_ORDERS -lt \"STOOFEW\" ]; then\n    printf \"%s\\n\"\
    \ \"Few orders...but will process them anyway\"\nelif [ $NUM_ORDERS -gt \"STOOMANY\"\
    \ ]; then\n    printf \"%s\\n\" \"There are many orders. Processing may take a\
    \ long time\"\nelse\n    printf \"%s\\n\" \"Starting to process the orders\"\n\
    fi\n```\n\nThe if command doesn't have to be used with the test command. It can\
    \ run and test the status code of any command."
