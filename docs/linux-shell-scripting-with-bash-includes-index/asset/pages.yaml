    # Character Editing (tr)


    The Linux tr (translate) command substitutes or deletes characters on standard
    input,

    writing the results to standard output.

    The - d (delete) switch deletes a specific character.


    ```

    $ printf "%s\n" ''The total is $234.45 US''

    nThe total is $234.45 US

    $ printf "%s\n" ''The total is $234.45 US '' | tr -d ''\''$\nThe total is 234.45
    US

    ```


    Ranges of characters are represented as the first character, a minus sign, and
    the last

    character.


    ```

    $ printf "%s\n" ''The total is $234.45 US '' | tr -d ''A-Z''

    The total is $234.45

    ```


    ```

    tr supports GNU character classes.

    ```


    ```

    $ printf "%s\n" ''The total is $234.45 US '' | tr -d ''[:upper:]''

    The total is $234.45

    ```


    Without any options, tr maps one set of characters to another. The first character
    in

    t first parameter is changed to the first character in the second parameter. The

    character in the first parameter is changed to the second character in the second
    parame-

    ter. (And so on).


    ```

    $ printf "%s\n" ''The cow jumped over the moon'' | tr ''aeiou'' ''AEIOU''

    The cOw jUmped OvEr thE mOoOn

    ```


