  md: '# 17


    # Data Structures and Databases


    ALWAYS SAID THAT I WOULD RATHER die than work in a tiny, windowless office with
    a green monochrome terminal. Of course, the first job I had after university featured
    just like that, except the monochrome terminal was amber instead of green.


    While I was pondering a taxation problem in the custom-built BASIC software that
    company used, I got a buzz on my phone and the president asked me to come to his
    office. His office, of course, had windows. The president had written much of
    his early days and he mentioned me to come over to his terminal. "Look at this,"
    he said. "Here is an array of nine numbers. I turned it into a two-dimensional
    3x3 array by multiplying one by index and adding a second index! Pretty slick,
    huh?


    Having graduated from university with straight A''s, I suppressed a yawn and said,
    "Oh, yes, sir. You are very clever."


    It was my first introduction to the fact that most software in that company and
    every other company I worked at was written at a high school programming level.
    Hash tables and binary trees are considered dangerously elaborate and unnecessarily
    risky, even though they save time and money. Multillion dollar corporations rely
    on flat files and simple arrays—that the boss will understand and if the software
    is slow and clunky, the corporation can acquire the newest hardware to improve
    performance.


    Working in a small company can put a premium on programming skills. This chapter
    demonstrates how to do some of these "dangerous" things, if you''re lucky enough
    that you won''t be reprimanded for programming above a junior level.


    # Associative Arrays Using Bash Arrays


    Associative arrays (also called "lookup tables" or what the Perl language calls
    "hashes") are arrays containing pairs of values. The first item is the key, the
    known value being looked-up. The second item is the value associated with the
    key. For a table of phone numbers, the key might be the names of employees and
    the associated value is the phone number extension for each employee.'
