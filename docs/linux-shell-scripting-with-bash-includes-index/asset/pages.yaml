  md: '# 5 Variables


    THE RESULTS OF COMMANDS CAN be written to a file or saved in variables. Because
    variables are saved in memory, they tend to be faster to examine than files. Bash
    doesn''t put an upper limit on the size of a variable:They are large enough to
    contain anything you will ever need to hold.


    Using variables is essential to shell script programming. This chapter is an in-depth
    look at variables and how they are used in the shell, from basic variables to
    expanding variables with the eval command.


    # Variable Basics


    Variables are declared using the Bash declare command.To declare a variable name,
    use this:


    ```

    $ declare COST

    ```


    Use the built-in typeset statement for compatibility with the Korn shell. If you
    are using Bash, use declare instead. declare has all the features of the older
    typeset command.


    Choosing good variable names is important. One time, when I was grading a first-computer
    science assignment, a student used 26 variables named a to z. There was no explanation
    about what the variables represented and it took me half an hour to determine
    whether the program actually worked. (Surprisingly, it did.)


    Names should also be considered. In the mutual fund industry, for example, "portfolio,"accounts,"
    and "funds" mean the same thing. It is better to use one of these three names
    throughout your script. If three different terms are used, the reader might assume
    there are subtle differences in meaning between them.


    Because Bash does minimum checking of variable names, even with the unset option
    turned on, another common mistake is using a variable that looks the same. In
    my first year in university, I ran into an old friend who was frustrated because
    his Fortran'
