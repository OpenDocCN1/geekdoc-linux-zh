  md: 'The number of files without a .txt suffix can be counted as well.


    ```

    $ find ! -name "*.txt" -type f | wc -1

    185

    ```


    Parentheses must be escaped by a backslash or quotes to prevent Bash from interpreting
    them as a subshell. Using parentheses, the number of files ending in .txt or .sh
    can be expressed


    ```

    $ find "-name "*.txt" -or name "*.sh" -type f | wc -1

    11

