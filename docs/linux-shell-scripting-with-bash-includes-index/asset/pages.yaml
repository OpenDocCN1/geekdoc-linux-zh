  md: '# Chapter 6 Expressions


    If a pattern does not match any files, Bash assumes that the pattern is the filename
    you intended to give to the command.


    ```

    $ ls X*

    ```


    X*: not found


    In this case, there are no files that begin with the letter X. Bash, failing to
    find a match, gives the pattern X* as the filename to the ls command.


    # Globbing Options


    There are a number of shell options that affect pattern matching. Filename pattern
    matching can be turned off completely by setting the nogglob shell option (shopt
    -o nogglob). If the nullglob option is set (with shopt -s nullglob), the pattern
    is discarded if not matched. In the previous example, ls would receive no argument
    and would list all files in the current directory. You can disable case sensitivity
    by setting the nocaseglob option (shopt -s nocaseglob). Likewise, you can turn
    off the treatment of leading periods in filenames by setting the dotglob option
    (shopt -s dotglob).


    These shell options have a wide-ranging effect; use them with care. Change the
    setting for as few lines of script as possible and clearly comment the effect
    of the change.


    The GLOBORIGNORE variable also affects how filenames are matched. This variable
    resembles the PATH variable; a colon-separated list of filenames that Bash will
    not attempt to match. If you are aware of files with pattern symbols in their
    names, adding them to the GLOBORIGNORE list will ensure that Bash will treat them
    as files and not as globbing expressions.


    If you need more sophisticated pattern recognition, or if you need to apply a
    pattern to an entire file, you can use the grep family of commands. These are
    described in Chapter 11, "Text File Basics" and Chapter 12, "Text File Processing."


    # Filename Brace Expansion { .. }


    One filename can be expanded into multiple filenames using curly braces. Inside
    the curly braces, use commas to list each substring in order to build a new argument.
    Brace expansion is typically used to specify a root filename with different endings.


    ```

    $ printf "%s %s \n" "Files should be named: %s" orders.{txt,out}

    ```


    Files should be named: orders.txt orders.out


    Because Bash expands the first line to:


    ```

    $ printf "%s %s \n" "Files should be named: %s" orders.txt orders.out

    ```


    three s codes are necessary, one for each parameter to print.


    The braces can contain file-matching characters. The actual file matching occurs
    after the braces are processed by Bash.'
