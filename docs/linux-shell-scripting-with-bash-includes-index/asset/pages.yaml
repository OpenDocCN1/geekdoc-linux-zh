  md: '# Shell Archives


    A shell archive (or a shar file) is a collection of text files or scripts encoded
    as a single shell script. The data in the scripts is represented here as files.
    Binary files are converted to text with the Linux encode command. Shell archives
    are self-extracting archives; when the shell script executes, the files in the
    archive are unpacked.


    The Linux shar (shell archive) is a utility to create new shell archives. To save
    a file called orders.txt as a shell archive, use this


    ```

    $ shar orders.txt > orders.shar

    shar: Saving orders.txt (text)

    ```


    To extract the file, run the shell archive with Bash.


    +   - bash orders.shar

    - creating lock directory

    - extracting orders.txt (text)


    To create a shell archive of the files in the current directory, use this


    ```

    $ shar > myproject.shar

    ```


    The shar command recursively archives any subdirectories when a directory is being
    archived.

    There are a large number of switches for shar. These are primarily for handling
    special cases. A complete list appears in the reference section of this chapter.

    There is also an unshar command. Not exactly the opposite of shar, this command
    extracts archives from a saved email message and uses Bash to unpack the files.

    Shell archives were a popular method of sharing files over newssgroups during
    the early days of the Internet. Shell archives are not particularly efficient,
    but they provide an example of an unusual use for shell scripts and support for
    them is available on all Linux distributions.

    Although shell scripts might not run vertical bars down your screen and eject
    your disks as my C program in my third-year O/S course, they can be as difficult
    to debug. Knowing that there are debugging features in Bash make makes it much
    easier to find and repair scripts. With version control, patches, and transcripts,
    your work can be shared with other programmers and problems caused by updates
    to scripts can be quick-isolated. These tools come handy in the next chapter on
    subshells.


    # Reference Section


    # tee Command Switches


    +   - -append—Adds the output to the end of an existing file.

    - -ignore-interrupts (or -i)—Keeps tee running if it''s interrupted by a Linux
    signal.'
