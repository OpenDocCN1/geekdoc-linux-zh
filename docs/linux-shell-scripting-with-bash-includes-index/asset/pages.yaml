  md: '# Operating the Shell


    ONE DAY MY FATHER WAS WORKING on the electrical wiring on his pontoon boat. He
    worked for several hours without success. No matter what he tried, he couldn''t
    get his running lights to work. Frustrated, he turned the light switch off...
    and the lights came on.


    This chapter is a brief overview of how to use the shell in an interactive session
    at the Bash command prompt. Like my father and his wiring problem, understanding
    how the commands work at the fundamental, interactive level is important before
    digging into the intricacies of scripts. That is, unless you like unexpected surprises.


    # Bash Keywords


    A keyword is a word or symbol that has a special meaning to a computer language.
    The following symbols and words have special meanings to Bash when they are unquoted
    and the first word of a command.


    ```

    esac select }

    case fi then [[

    do for until ]

    done function while

    elif if time

    else in {

    ```


    Unlike many computer languages, Bash allows keywords to be used as variable names
    even though this can make scripts difficult to read. To keep scripts understandable,
    keywords should not be used for variable names.


    # Command Basics


    The commands that can be typed at the Bash prompt are usually Linux programs stored
    externally on your file system. Some commands are built into the shell for speed,
    standardization, or because they can function properly only when they are built-in.'
  merge: -1
  pgno: 34
- img_proc: true
  md: '# Chapter 2 Operating the Shell


    No matter what their source, commands fall into a number of informal categories.

    Utilities are general-purpose commands useful in many applications, such as returning
    the date or counting the number of lines in a file.


    Filters take the results of one command and modify them in some way, such as removing
    unwanted lines or substituting one word for another. Many commands act as filters
    under the right circumstances.


    To execute a command, type it at the Bash prompt. The prompt is usually a $, but
    often Linux distributions customize it to something else. S.u.S.E., for example,
    uses a > command prompt.


    The date command prints the current date and time on the screen.


    ```

    $ date

    Wed Apr 4 10:44:52 EDT 2001

    ```


    All files, including shell commands, are case-sensitive. By convention, all shell
    commands are in lowercase.


    ```

    $ DATE

    bash: DATE: command not found

    ```


    Arguments are additional information supplied to a command to change its behavior.
    The date command takes a format to change the appearance of the date and the time.


    ```

    $ date ''+%H:%M''

    10:44

    ```


    Switches (also called "options" or "flags") are characters preceded by a minus
    sign to enable command features. To see the date in Coordinated Universal Time
    (UTC, formerly GMT), use the -u switch.


    ```

    $ -u

    Wed Apr 4 14:46:41 UTC 2001

    ```


    Because the terms "options" and "flags" are used in so many contexts, they are
    referred to as switches in this book.

    Switches and arguments are collectively called parameters. Some commands allow
    number of parameters or have parameters that can be arranged in complex ways.

    The GNU and Linux convention is for longer, more readable options to be proved
    by a double minus sign. The longer equivalent to the -u switch is --universal.


    ```

    $ date --universal

    Wed Apr 4 14:46:41 UTC 2001

    ```


    The long switches remind the reader exactly what the switch does. This makes debugging
    of shell scripts much easier because there is no standard convention for the short
    switches across Linux commands. Most Linux commands recognize the switches --help,
    --verbose, and --version.'
  merge: -1
  pgno: 35
- img_proc: true
  md: '# Command-Line Editing


    Comments can be added to the end of any command or they can be typed on a line
    by themselves. Comments are denoted with a number sign (#).


    ```

    $ date --universal show the date in UTC format

    ```


    Built-in Bash commands and most other GNU software treat -- as a special switch
    that indicates the end of a list of switches. This can be used when one of the
    arguments starts with a minus sign.


    # Command-Line Editing


    There are special key combinations to edit what you type or to repeat previous
    commands.


    Bash has two editing modes. These modes emulate the keys used in two popular Linux
    text editors. Vi mode mimics the vi and vim. Emacs mode works like emacs, nano
    or pico.


    The current editing mode can be checked with the shop command. shop -o emacs shop
    -o vi is on if you are in vi mode. Only one mode can be at a time.


    ```

    $ shop -o emacs

    emacs      on

    $ shop -o vi

    vi             off

    ```


    Regardless of the mode, the arrow keys move the cursor to the left and step through
    the most recently executed command:


    +   - Left arrow—Moves back one character to the left. No characters are erased.

    - Right arrow—Moves forward one character to the right.

    - Up arrow—Moves to the previous command in the command history.

    - Down arrow—Moves to the next command in the command history (if any).


    Using the left and right keys, the cursor moves to any position in the command.
    A new line is inserted into the middle of line without overwriting any old typing.


    Emacs mode is the default mode on all the major Linux distributions. The most
    common emacs keys are as follows:


    +   - control-b—Moves back one character to the left. No characters are erased.

    - control-f—Moves forward one character to the right.

    - control-p—Moves to the previous command in the command history.

    - control-n—Moves to the next command in the command history (if any).

    - Tab key—Finds a matching filename and completes it if there is one exact match.'
  merge: -1
  pgno: 36
- img_proc: true
  md: '# Chapter 2 Operating the Shell


    The filename completion feature attempts to find a matching filename beginning
    with the final word on the line. If a matching filename is found, the rest of
    the filename is typed in Bash. For example:


    ```

    $ dat

    ```


    is completed when the Tab key is pressed


    ```

    $ date

    ```


    if date is the only command that can be found starting with the characters dat.
    The vi key combinations are as follows:


    +   - Esc-Enters/exits editing mode.

    - h-Moves back character to the left. No characters are erased.

    - l-Moves forward one character to the right.

    - k-Moves to the previous command in the command history.

    - j-Moves to the next command in the command history (if any).


    +   - Esc twice—Finds a matching filename and completes it if there is one exact
    match.


    A complete list of key combinations (or bindings) is listed in the Bash man page
    in the Readsection. The default key combinations can be changed, deleted, reassigned
    using the bind command. To avoid confusion, it is best to work with the defaults
    unless you have a specific application in mind.


    Other editing keys are controlled by the older Linux stty (set teletype) command.
    Running stty shows the common command keys as well as other information about
    your session. Use the -a (all) switch for all settings.


    ```

    $ stty

    speed 9600; baudev hupcl

    intr = "C; erase = ?; kill = ^X;

    eol2 = "@; swch = @;

    susp = "Z; dsusp = ^Y;

    werase = "W; lnext = "@;

    -inpok -istrip icrnl -ixany ixoff oncler

    -iecton echo echoch

    -echochtl -echoke

    ```


    Many of these settings are used only when you''re working with serial port devices
    and can be ignored otherwise. The other settings control key combinations marked
    with a caret (^) symbol. Keys with ^ (or ASCII 0) are not defined. The keys are
    as follows:


    +   - erase (usually ?) which is the spacebar—Moves left and er one character.

    - intr (usually ^C)—Interrupts/stops the current program or cancels the current
    line.

    - kill (usually ^X)—Erase the current line.'
