    in a pipeline, several commands run at once. The status code returned from a pipe
    is the status code of the final command. In the following example, the status
    code is for the wc command, not ls.


    ```

    $ ls badfile.txt | wc -1

    ls: badfile.txt: No such file or directory

    0

    $ printf "%d\n" "$?"

    0

    ```


    Although 1 reported an error, the result of the pipeline is zero because wc was
    successful counting no lines.

    Bash also defines an array PIPESTATUS that contains the individual status codes
    for each command in the last pipeline.


    ```

    $ ls badfile.txt | wc -1

    ls: badfile.txt: No such file or directory

    0

    $ printf "%d\n" "${PIPESTATUS[0]}" "${PIPESTATUS[1]}"

    10

    ```


    $? is essentially another name for the final PIPESTATUS Value.

    A command or pipeline can be preceded by a ! to negate the status code. If the
    status is 0, it becomes 1. If the status is greater than 0, it becomes 0.


