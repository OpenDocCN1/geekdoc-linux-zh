  md: '# Directory Commands


    The -s switch adds new history entries. -w (write) and -r (read) save or load
    the history from a file, respectively. The -a (append) switch appends current
    session history to the history file. This is done automatically when you quit
    the shell. The -n switch loads the complete history from the history file. history
    -c (clear) deletes the entire history.


    The command history can be searched with ? for the most recent command containing
    the text. If there is additional typing after the !? search, the command fragment
    will be delineated with a trailing ?.


    ```

    $ date

    Thu Jul 5 14:12:33 EDT 2001

    $ !ate

    date

    Thu Jul 5 14:12:38 EDT 2001

    $ !? ''+%Y''

    date ''+%Y''

    2001

    ```


    The quick substitution command, ^, runs the last command again, replacing one
    string with another.


    The Bash history can be turned off by unsetting the -o history shell option. The
    cmdhist option saves multiple line commands in the history. The lithist option
    breaks up commands separated by semicolons into separate lines.


    # Directory Commands


    The built-in pwd (present working directory) command returns the name of your
    current directory.


    ```

    $ pwd

    /home/kburtch

    ```


    Although you might not think such a simple command needs options, pwd has a couple
    of switches. The -P (physical) switches the actual directory, whereas the default
    -L (logical) switch shows the directory, including any symbolic links. For example,
    if /home was a link to a directory called /user_drive/homes/, the switches work
    as follows:


    ```

    $ pwd -P

    /user_drive/homes/kburtch

    $ pwd -L

    /home/kburtch

    ```'
  merge: -1
