  md: "# Chapter 17 Data Structures and Databases\n\nAssociative arrays can be created\
    \ easily using Bash arrays. Pairs of items can be combined into a single item\
    \ using a special separator character. The character should be a seldom-used character,\
    \ such as a tilde.\n\n```\nTABLE[$NEXTITEM]=\\$${SEPARATOR}\"$2\"  # add the pair\
    \ to the table\nprintf \"%s\\n\" \"Added $1 / $2 at $NEXTITEM\"\nlet NEXTITEM++\n\
    ```\n\nIf NEXTITEM is an integer value containing the free position in the TABLE\
    \ array, the pair is added to the table and NEXTITEM is advanced to the next free\
    \ position. NEXTITEM starts at zero, the pair is added at position zero and NEXTITEM\
    \ is incremented to one.\nTo find an item, the table must be searched until the\
    \ item is found or until the end of the table is reached.\n\n```\nwhile [$ITEM\
    \ -lt $NEXTITEM ]; do  # reached end of table?\n  KEY=\\${TABLE[$ITEM]}\\    \
    \                      # if not, get the pair\n  KEY=${KEY%\"${SEPARATOR}*\" \
    \                   # extract the key part\n  if [ \"$SKEY\" = \"$${KEYFIND}\"\
    \ ]; then         # is it the key we want?\n    break                        \
    \               # good, it matches\n  else                                   \
    \      # otherwise\n    let ITEM=ITEM+1                             # move to\
    \ the next item\nndone\n```\n\nIf ITEM is the position in the table, when the\
