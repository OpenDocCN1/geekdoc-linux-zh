  md: '# Shell Aliases


    An alias is a short form of a command. The built-in alias command creates simple
    abbreviations for the current Bash session.


    To create an alias, use the alias command to assign a command and its switches
    to a name.


    ```

    $ alias lf=''ls -qFL''

    $ lf

    --rw-r---- 1 kburtch devgroup 10089 Apr 6 11:00 assets.txt

    -tw-r---- 1 kburtch devgroup 47113 Mar 9 2000 mailing_list.txt

    ```


    Typing the alias command itself, or with the -p switch, which lists the current
    aliases.


    ```

    $ alias

    alias lf=''ls -qFL''

    ```


    Bash intercepts an alias only once, allowing the aliasing of a command with its
    name.


    ```

    $ alias ls=''ls -qPF''  # Bash isn''t confused

    ```


    Normally, the first word of a command is checked for an alias. As a special exception,
    the last character in the alias string is a blank, Bash checks the next word in
    the command to see whether it is also an alias.


    There is no method for giving arguments to an alias. If arguments are needed,
    use a more powerful shell function instead.


    The built-in unalias command removes an alias. Use the -a switch to remove them
    all.


    Most Linux distributions have aliases defined for commands. dir, for example,
    is often an alias for ls. Some distributions define an alias for commands such
    as rm -i to force prompting, which is not required by default. This can be a problem
    for some users as experienced Unix programmers who are used to working with these
    features disabled. Use unalias to remove any aliases you don''t want to use.


    Aliases with shell functions can be confusing because aliases are expanded only
    when a line from a script is read. If aliases are used in a shell function, they
    are expanded when the shell function is defined, not when it is executed. For
    this reason, it is safer to avoid aliases altogether in shell scripts. Use the
    shop -s expand_aliases command.


    # The Bash Hash Table


    When a command is executed without naming a path, the shell searches for the command
    (in the directories in the PATH variable). When Bash finds the command, it remembers
    it, storing the location in a hash table. Thereafter, Bash checks the table for
    the location of the command instead of searching for the command again, making
    commands faster. However, if the command moves after Bash has recorded its location,
    the shell won''t be able to find the.'
  merge: -1
