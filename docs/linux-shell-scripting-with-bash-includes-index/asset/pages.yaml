  pgno: 88
- img_proc: true
  md: '# Chapter 5 Variables


    program wasn’t working. When I examined it closely, I saw that he had declared
    a variable HIGH, in the body of his program he spelled the variable H2. When the
    program printed the value of HIGH, it was zero because it was never actually assigned
    a value. The same kind of situation can occur in Bash scripts.


    Variable names begin with a leading alphabetic or underscore character followed
    by additional alphanumeric characters or underscores.


    Although variables can be in upper- or lowercase, tradition dictates variables
    are named in uppercase so not to be confused with shell commands, which are almost
    always in lowercase. TOTAL, ORDERS, EUROPE, and W3C are all legitimate variable
    names. There are no reserved words, which are words that are reserved for a specific
    purpose in the shell.


    Variables are assigned new values with an equals sign (=). To assign an empty
    string to a variable, don''t supply any value.


    ```

    $ COST=

    ```


    Otherwise, include some text to be assigned.


    ```

    $ COST=0

    ```


    Although printf %d prints a zero for both value of zero and an empty string, Bash
    considers the two values to be different. A variable with no value is not the
    same as a variable with value of zero.


    Values can also be assigned with the let statement described in Chapter 6. Bash
    differentiates between a variable’s name and the value it represents. To must
    precede the name with a dollar sign ($).


    ```

    $ printf "%s" $COST

    ```


    The dollar sign means “substitute.” The shell replaces $COST with the value represents.
    In this case, the value of COST is zero. After substituting the value of COST,
    the command becomes:


    ```

    $ printf "%d" 0

    ```


    Bash executes this command and displays a zero.


    Values can be assigned an initial value when the variable is first declared.


    ```

    declare COST=5

    ```


    ```

    $ printf "%d" $COST

    ```


    Because declare is a command, variables are created only when the declare command
    is executed. They remain in existence until the script ends or until the variable
    is destroyed with the built-in unset command.


    ```

    $ unset COST

    ```'
