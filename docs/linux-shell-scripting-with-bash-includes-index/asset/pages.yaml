  md: '# A comprehensive guide and reference for Linux users and administrators


    # Linux Shell Scripting with Bash


    Bash—the Bourne Again Shell—is the most commonly programming environment on Linux.
    Every Linux programmer, at one time or another during the day, uses the Bash shell
    as part of his or her job. Scripting with Bash can also be a key part of business
    development—shell scripts are uniquely suited for managing flow, scheduling jobs,
    and automating corporate tasks.


    Linux Shell Scripting with Bash explains how to get the maximum benefit from this
    powerful tool. The book covers the essentials of good script design, database
    scripting, system administration and security, basic Web scripting, and TCP/IP
    networking programming.


    The book emphasizes the practical application of Bash and features many real-world
    examples, including the complete script for a useful resource monitoring and troubleshooting
    program.


    A well-organized summary of important Bash commands, options, error codes, and
    signals rounds out Linux Shell Scripting with Bash, making it a valuable reference
    that any Linux user or administrator will want to keep handy after the book has
    been read.


    Ken O. Burch heads up PegasusSoft Canada, one of Canada''s oldest Linux companies.
    He has been using Linux kernel since 0.9. He is a member of both the Association
    of Computing Machinery (ACM) and the Durham Region Writers'' Circle (one of the
    largest writing organizations in Canada). He received a computer science degree
    from Brock University in St. Catharines, Canada, and did his Masters work at Queen''s
    University in Kingston, Canada.


    Linux Programming


