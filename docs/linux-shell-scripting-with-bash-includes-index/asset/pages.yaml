  md: '# Finding Files 211


    find is much more powerful than this script fragment. Like the built-in test command,
    find switches create expressions describing the qualities of the files to find.
    There are also switches to change the overall behavior of find and other switches
    to indicate actions to perform when a match is made.


    The basic matching is -name, which indicates the name of the file to find. Name
    can be a specific filename or it can contain path wildcard characters like * and
    ?. If pattern matching is used, the pattern must be enclosed in quotation marks
    to prevent the shell from expanding it before the find command executes it.


    ```

    $ find -name *.txt"

    ./orders.txt

    ./advocacy/linux.txt

    ./advocacy/old_orders.txt

    ```


    The first parameter is the directory to start searching in. In this case, it''s
    the current directory.

    The previous find command matches any type of file, including files as pipes or
    directories, which is not unusual the input of a user. The -type switch limits
    the files to a certain type of file. The -type f matches regular files, the most
    common kind of search. The type can also be b (block device), c (character device),
    d (directory), p (pipe), l (symbolic link), or s (socket).


    ```

    $ find -name *.txt" -type f

    ./orders.txt

    ./advocacy/linux.txt

    ./archive/old_orders.txt

    ```


    The switch -name *.txt -type f is an example of a find expression. These switches
    match a file that meets both of these conditions (implicitly, a logical "and").
    There are other operator switches for combining conditions into logical expressions,
    as follows:


    +   - ( expr )—Forces the switches in the parentheses to be tested first

    - -not expr (or ! expr)—Ensures that the switch is not matched

    - expr -and expr (or expr -a expr)—The default behavior; looks for files that
    match both sets of switches

    - expr -or expr (or expr -o expr)—Logical "or". Looks for files that match either
    set of switches

    - expr ,—Always checks both sets of switches, but uses the result of the set to
    determine a match


    For example, to count the number of regular files and directories, do this:


    ```

    $ find -type d -o -type f | wc -l

    224

    ```'
