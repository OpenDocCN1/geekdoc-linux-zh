    The first 11 commands are executed in the profile scripts on the Linux distributions.
    The number of plus signs indicate how the scripts are nested. The last four lines
    are the script fragment after Bash has performed all substations and expansions.
    Notice the compound commands (like the if command) are left out (see Listing 8.2).


    Listing 8.2 bad.bash


