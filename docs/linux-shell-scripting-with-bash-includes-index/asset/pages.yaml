  md: "# Secure File Deletion (wipe)\n\nThe rm command removes a file by deleting\
    \ the directory entry, the old information is still available on the disk until\
    \ a new file overwrites it. Normally, this information is not accessible except\
    \ at the device driver level. However, for critical information must never be\
    \ read, this might not be acceptable.\n\nThe wipe utility first overwrites all\
    \ the information in a file with random data and then deletes the file like the\
    \ rm command. Nothing remains on the disk that can be read by an unscrupulous\
    \ person.\n\n```\n$ ls\nlogins.txt\n$ wipe logins.txt\n$ \n```\n\n- -s switches\
    \ wipes quietly (not the usual -q), -r wipes all subdirectories. -D wipes the\
    \ data but keeps the file. For faster wiping, -z fills the file with zeros instead\
    \ of random data. -b overwrites the file using a specific character. There are\
    \ a few other wipe switches, primarily related to how the random data is generated.\n\
    \nUse with caution. If a device file, such as a hard disk partition, is specified\
    \ instead of a file, wipe attempts to erase the entire partition.\n\nAll shell\
    \ programmers need to pay careful attention to security concerns. They will not\
