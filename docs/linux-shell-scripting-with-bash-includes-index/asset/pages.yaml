  md: '# Chapter 11 Text File Basics


    For greater checksum security, some distributions include a md5sum command to
    create an MD5 checksum. The -status switch quietly tests the file. The -binary
    (or -b) switch treats the file as binary data as opposed to text. The -warn switch
    prints warnings about MD5 formatting.-check (or -c) checks the sum on a file.


    ```

    $ md5sum orders.txt

    945ecc13070da243e22730a44740004 orders.txt

    $ md5sum orders.txt > ordersum.txt

    $ md5sum -check ordersum.txt

    file1.txt: OK

    ```


    Differences between two files can be pinpointed by the Linux cmp command.


    ```

    $ cmp orders.txt orders2.txt

    orders.txt orders2.txt differ: char 179, line 6

    ```


    If two files differ, diff prints nothing.


    # Splitting Large Files


    Extremely large files can be split into smaller files using the Linux split command.
    Files can be split by bytes or by lines. The -bytes=s (or -b) switch creates files
    of no more than s bytes. The -lines=s (or -l s) switch creates files of no more
    than s lines. The -line-bytes=s (or -c) switch each line to no more than s bytes.
    The size is a number with an optional b (512 byte blocks), k (kilobytes), or m
    (megabytes). The final parameter is the prefix to use for the filenames.


    ```

    $ split -bytes=10k huge_file.txt small_file

    $ ls -1 -small_file*

    -rw-rw-r- 1 kburch kburtch 10240 Aug 28 16:19 small_filea

    -rw-rw-r- 1 kburch kburtch 10240 Aug 28 16:19 small_fileab

    -rw-rw-r- 1 kburch kburtch 1319 Aug 28 16:19 small_fileac

    ```


    You reassemble a file using the Linux cat command. This command combines files
    and writes them to standard output. Be careful to combine the split files in the
    correct order.


    ```

    $ cksum huge_file.txt

    491404265 21799 huge_file.txt

    $ cat small_file small_fileab small_fileac > new_file

    $ cksum new_file

    491404265 21799 new_file

    ```


    If the locale where the split split occurred is the same as the locale where the
    file is reassembled, it is safe to use wildcard globbing for the cat filenames.


    The Linux csplit (context split) command splits a file at the points where a specific
    pattern appears.'
