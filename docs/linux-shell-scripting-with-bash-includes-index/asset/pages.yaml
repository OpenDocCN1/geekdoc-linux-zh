  md: '# Transferring Files Between Accounts (wget)


    The wget program uses the same form of address as a Web browser, supporting ftp://
    and http:// URLs. Information is added to a URL by using user:password to retrieve
    the hostname. FTP URLs can end with an optional; ;type=a or ;type=1 for ASCII
    or IMAGE FTP downloads. For example, to download the info.txt file from the kburtch
    login with the hostname jabber12 on the current computer, you use:


    ```

    $ wget ftp://kburtch:jabber12@localhost/info.txt;type=i

    ```


    By default, wget uses -verbose message reporting. To report only errors, use the
    -quiet switch. When lo happened, the result appends to a log file using -output
    and a log name and log server responds with the -server-response switch.


    ```

