  md: '# The Set and Shopt Commands


    A complete list of built-in shell commands appears in Appendix B.


    Although builtin and command are useful in testing and porting order to Bash,
    well-structured scripts should not rely on them because they indicate ambiguity
    in a script''s design.


    The built-in enable command temporarily hides the shell built-in commands and
    enables them later. The -n switch disables the command.


    ```

    $ enable test

    $ type test

    test is a shell builtin

    $ enable -n test

    $ type test

    test is /usr/bin/test

    ```


    The -d switch disables the built-in command and releases any memory it was using.
    It can be reloaded with the -f switch, whereby the filename containing the built-in
    must be specified.


    With -p, all enabled shell built-ins are printed. You can use -p with -n to list
    the disabled built-ins, or use -a to show them all. The -s switch restricts the
    listing to POSIX special built-ins.


    ```

    $ enable -pn

    enable -n test

    ```


    Well-structured scripts, enable should be used in your global declaration section.
    Using enable throughout a script makes it difficult to remember whether a particular
    command is a built-in command.


    # The Set and Shopt Commands


    Bash contains many optional features that can be enabled or disabled. These options
    pertain to how Bash responds interactively with the user, how it behaves in shell
    scripts, and how compatible Bash is with other shells and standards.


    Bash options can be enabled or disabled by commands or as a command switch when
    Bash is started. For example, to start a Bash session and allow the use of undefined
    variables, use:


    ```

    $ bash -o nounset

    ```


    In a script or at the Bash dollar prompt, you can disable the use of undefined
    variables by using:


    ```

    $ shopt -s nounset

    ```


    Historically, the set command was used to turn options on and off. As the number
    of options grew, set became more difficult to use because options are represented
    by single letter codes. As a result, Bash provides the shopt (shell option) command
    to turn options'
