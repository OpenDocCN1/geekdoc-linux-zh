    By removing the colon, no assignment takes place.


    # Variable Existence Check (:?)


    If a trailing colon question mark appears after the variable name, the message
    following the question mark is returned and the Bash script exits. This provide
    a crude form of a sanity check. The message is optional.


    ```

    $ printf "Company is %s\n" \

    "${COMPANY?Error: Company has not been defined-aborting}"

    ```


    By removing the colon, no check takes place.


    # Overriding a Default Value (+)


    If a trailing colon plus appears after the variable name, the message following
    the plus sign will replace the value of the string. Empty strings are not changed.


    ```

    $ COMPANY="Nightlight Inc."

    $ printf "%s\n" "${COMPANY+Company has been overridden}"

    ```


    Company has been overridden


    By removing the colon, variables with empty strings are replaced as well.


    # Substrings (:n)


    If a trailing colon followed by a number appears after the variable name, a substring
    is returned. The number indicates the first position of the substring, minus one.
    The first character in the string is character 0. Optionally, colon and a second
    number can follow, which indicates the length of the substring.


    ```

    $ printf "%s\n" "${COMPANY:5}"

    light Inc.

    ```


    ```

    $ printf "%s\n" "${COMPANY:5:5}"

    light

    ```


    # Substring Removal by Pattern (%, #, %, and ##)


    If a trailing number sign appears after the variable name, the substring returned
    has the pattern removed. One number sign matches the smallest possible substring
    and two number signs matches the largest possible substring. The expression returns
    the characters to the right of the pattern.


    ```

    $ printf "%s\n" "${COMPANY#*}"

    ght Inc.

    ```


    ```

    $ printf "%s\n" "${COMPANY##*}"

    ```


    ```

    $ printf "%s\n" "${COMPANY##**}"

    ```'
