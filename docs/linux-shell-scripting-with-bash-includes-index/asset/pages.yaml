  md: "# Changing Access Rights (chmod) 27\n\nof the permission bits and some other\
    \ file information. Although the name suggests that the command can change any\
    \ file mode settings, this command changes just the access rights.\n\nThe permissions\
    \ can be expressed in two ways.\nFirst, they can be represented by the four-digit\
    \ octal permissions number.\n\n```\n$ touch orders.txt\n$ ls -l orders.txt\n-rw-r--r--\
    \ 1 ken      users      May 9 12:48 orders.txt\n$ chmod 0755 orders.txt\n$ ls\
    \ -l orders.txt\n-rwxr-xr-x 1 ken      users      May 9 12:48 orders.txt\n```\n\
    \nFor those who are not using octal numbers, permissions can be added with a plus\
    \ sign, or removed with a minus sign. Permissions are grouped by user (u), group\
    \ (g), others (o), or all (a) and can read (r), write (w), or execute (x) permissions.\
    \ Therefore, to add permissions for the file and the user, you do\n\n```\n$ chmod\
    \ 0000 orders.txt\n$ ls -l orders.txt\n       1 ken      users      May 9 12:48\
    \ orders.txt\n$ chmod +r orders.txt\n$ ls -l orders.txt\n-r--r--r-- 1 ken    \
    \  users      May 9 12:48 orders.txt\n```\n\nTo remove write permissions from\
    \ users who don't own the file and aren't in the same group, you do\n\n```\n$\
    \ chmod a+rwx orders.txt\n$ ls -l orders.txt\n-rw-rwxrwx 1 ken      users    \
    \  May 9 12:48 orders.txt\n$ chmod o-w orders.txt\n$ ls -l orders.txt\n-rwxr-xr-x\
    \ 1 ken      users      May 9 12:48 orders.txt\n```\n\nAn equals sign causes the\
    \ permissions to be set to the specified values, rather than adding or subtracting\
    \ them from the existing set. The letters u, g, and o refer to the current values\
    \ of user, group, and other access bits respectively. For example, g=u assigns\
    \ the group permissions the same value as the user permissions.\n\n```\n$ chmod\
    \ 0755 orders.txt\n$ ls -l orders.txt\n-rwxr-xr-x 1 ken      users      May 9\
    \ 12:48 orders.txt\n$ chmod g=u orders.txt\n$ ls -l orders.txt\n-rwxr-xr-x 1 ken\
    \      users      May 9 12:48 orders.txt\n```"
