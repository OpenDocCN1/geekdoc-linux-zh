  md: 'Find all the directories beginning with t, use


    ```

    $ compgen -A directory t

    tia

    test

    texttools

    ```


    The completion process is more complicated than you might think.

    A script can run functions or programs specified with the -F (function) switch
    or run commands with the -C (command) switch to create the initial list of possible
    completions. The arguments include the name of the command being completed ($2),
    and the word before the word being completed ($3).


    ```

    $ function printf "%s\n" "Cmd=$1 Word=$2 Prev=$3";

    $ compgen -A directory -F info t

    bash: warning: compgen: -F option may not work as you expect

    Cmd= Word=Prev=

    temp

    tia

    texttools

    ```


    In this case, t is the word being completed, and there is no command or word prior
    to t.

    Acceptable matches are returned in the COMPREPLY variable (or standard output
    for -C). Assigning trucking_reports to COMPRELY adds trucking_reports to the list
    of possible matches.


    ```

    $ function printf "%s\n" "Cmd=$1 Word=$2 Prev=$3";

    COMPREPLY="trucking_reports";

    $ compgen -A directory -F info t

    bash: warning: compgen: -F option may not work as you expect

    Cmd= Word=Prev=

    temp

    tia

    texttools

    trucking_reports

    ```


    Several variables provide additional information when completing functions and
    commands. COMP_LINE is the command being completed. COMP_POINT is the cursor position
    relative to the start of the command. COMP_WORDS is an array of the words in the
    command. CWORD is the cursor position as an index into the COMP_WORDS array.


    Bash contains profiles for many commands so that it knows the kind of completion
    that is necessary. These are called completion specifications. If the -G switch
    is used, the process takes a filename pattern and creates additional matches.
    After a list of possible solutions is found, any items found in the shell variable
    IGNORE are discarded. The -W (words) switch is used to name the list.


    After the user''s filtering, the -X (exclude) switch applies a pattern match to
    further reduce the list. An ampersand represents the text of the word being'
