  md: '```

    $ du --summarize --human-readable

    $36M

    $ du --summarize --human-readable , archive

    $36M

    28M    archive

    ```


    For scripts, there are a number of switches controlling how the results are grouped
    and what units are. The space totals can be in --bytes (or -b), --kilobytes (or
    -k), --megabytes (or -m), or blocks of --blockSize=b bytes. The default units
    are kilobytes. The --si (or -H) switch uses units of 1000 instead of 1024. You
    can determine a --total (or -c) for all files on the command line, as well as
    totals for --all (or -a) files within directories. The --separate-dirs (or -S)
    shows the totals for subdirectories, and default behavior.


    The amounts and the filenames are separated by a Tab character. To extract one
    column or the other, use the cut command.


    ```

    $ TAB=''printf "\t"

    $ du --all --kilobytes incoming_orders | cut -d"$TAB" -f1

    20

    12

    40

    56

    132

    ```


    Other switches affect how the files are searched.The --dereference-args (or -D)
    switch dereferences paths that are symbolic links.The --count-links (-l) switch
    counts each link to the same file as separate files.The --one-file-system (-x)
    switch constrains the search to the current file system. The search can be constrained
    to --depth=n levels of subdirectories, or can exclude any files with --exclude=f
    or a list of files in a file f with --exclude-from=f (or -X f)


    # Memory Usage


    The free command reports memory usage on the system.


    ```

    $ free

    ```


    | | total used free shared buffers cached |

    | Mem: | 61792 | 58756 | 3036 | 10116 | 36152 | 8988 |

    | +/- buffers/cache: | | 13616 | 48176 | | |

    | Swap: | 514072 | 8180 | 505892 | | |


    The used, free and free columns are the total amount of memory, the amount of
    memory currently used by the Linux kernel, and respectively. The free and used
    columns always add up to the total. The last three columns show how the memory
    is allocated; within shared memory, buffers, or caches. The final line shows the
    swap space allocated, used, and free on disk.'
