    You can use the exec command to run other programs, not just other shell scripts.
    If the -c switch is used, exec destroys all variables before running the new program.
    The -l switch runs the program as if it were the first program being run when
    a user logs in (by putting a minus sign in parameter $0). The -a switch can specify
    a specific name for $0.


    A specialized command, exec is used primarily for scripts that are a "front end"
    to a series of other scripts. For example, a script can examine a file sent by
    a customer, categorize it, and then run an appropriate script to process using
    exec. Because there''s no reason to return to the original script, exec is the
    appropriate command to use.


    # Writing Recurring Scripts


    There are several Linux commands for scheduling recurring jobs. The main scheduling
    program is cron (as in chronological). The cron program runs continually in the
    background, starting up scripts or other programs at specific times.'
