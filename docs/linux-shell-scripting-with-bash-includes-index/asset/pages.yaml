  md: "```\nwhile Loop 119\n\nif rm \"$TEMPFILE\"; then\n    printf \"%s\\n\" \"$SCRIPT:temp\
    \ file deleted\"\nelse\n    printf \"%s status code %d\\n\" \\\\\n    \"\\$$SCRIPT:$LINENO:\
    \ unable to delete temp file\" $? 2>&>\nfi\n```\n\nEmbedding complex commands\
    \ inside an if command can make a script difficult to read and debug; in this\
    \ case, the rm command is not as prominent as it would be if it appeared on a\
    \ line of its own. Likewise, it is possible to declare variables inside of an\
    \ if command, but it makes it very difficult to determine which variables exist\
    \ and which do not.\n\n# case Command\n\nThe case command compares a variable\
    \ against a series of values or patterns. If the value or pattern matches, the\
    \ corresponding statements are executed. The name comes from the fact that the\
    \ variable is tested on a case-by-case basis.\n\nUnlike elif commands test the\
    \ status code for individual commands, case tests the value of a variable. The\
    \ case command is preferable to a long set of elifs testing string values.\n\n\
    Each individual case must end with a pair of semicolons. Without the semicolons,\
    \ Bash will attempt to execute the next case designation and report an error.\n\
    \n```\nprintf \"%s -> \"%s\" = delete, 2 = archive. Please choose one\"\nread\
    \ REPLY\ncase \"$REPLY\" in\n1) rm \"$TEMPFILE\";\n2) mv \"$TEMPFILE\" \"$TEMPFILE.old\"\
    ;\n*) printf \"%s\\n\" \"$REPLY was not one of the choices\";\nesac\n```\n\nThe\
    \ pattern (*) is the catch-all; it matches all values that were not handled by\
    \ a previous case. Although this case is optional, it's good design to always\
    \ include a catch-all, even if it only contains a null statement (:).\n\nThe pattern-matching\
    \ rules follow the file globbing rules, as discussed in the previous chapter.\
    \ For example, vertical bars separate multiple patterns.\n\nThe cases don'tfall\
    \ through” like some computer languages, notably C. When one case is selected,\
    \ only those commands are executed. The commands in the following are not executed.\n\
    \n# while Loop\n\nThere are several commands for repeating a set of commands.\n\
    \nThe while command repeats the enclosed commands while the command being tested\
    \ succeeds. If the command fails on the first try, the enclosed commands are never\
    \ executed."
