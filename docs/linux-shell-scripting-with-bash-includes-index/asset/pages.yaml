  md: '# 18


    # Final Topics


    THE ARCANE AND THE OBSCURE. The obsolete and the advanced. This final chapter
    contains a mix of subjects suitable for those who need to know every last detail
    about the Bash shell.


    # The echo Command


    The built-in echo command is an older form of printf. Bash provides it for compatibility
    with the Bourne shell, echo does not use a format string: It displays all variables
    as if "\n" formatting was used. It can sometimes be used as a shortcut when you
    don''t need the full features of printf.


    ```

    $ echo "BASH VERSION"

    2.05a.0(1)-release

    ```


    A line is automatically added after the string is displayed. It can be suppressed
    with the n (no new line) switch.


    ```

    $ echo -n "This is " ; echo "one line."

    This is one line

    ```


    If the e (escape) switch is used, echo interprets certain escape sequences as
    special characters.


    +   - \a-A beep ("\alert")

    - \b-A backspace

    - \e-Suppresses the next character; at the end of the string, suppresses the trailing
    line feed

    - \E-The escape character

    - \f-A form feed

    - \n-A line feed (new line)

    - \r-A carriage return

    - \t-A horizontal tab'
  merge: -1
  pgno: 340
- img_proc: true
  md: '# 320 Chapter 18 Final Topics


    +   - \v—A vertical tab

    - \-A backslash

    - \num—The octal ASCII code for a character


    ```

    $ echo "101"

    \101

    $ echo -e "101"

    ```


    The -E switch turns off escape sequence interpretation. This is the default setting.


    # More Uses for set


    The built-in set command is used to turn on or off shell options. However, set
    has other uses as well.

    When set has arguments, the arguments are assigned to the position parameters.
    This is the only way to change the value of positional parameters.


    ```

    $ printf "%s %s %s\n" "$1" "$2" "$3"

    $ set "first" "second" "third"

    $ printf "%s %s %s\n" "$1" "$2" "$3"

    first second third

    ```


    When set is used by itself, it acts like the env command, displaying all variables.
    It also displays all functions.


    # Date Conversions


    The Linux date command returns the current date in a variety of formats. date
    with the -d switch converts an arbitrary text date and displays it in different
    formats.


    ```

    $ date -d ''may 1 10am''

    Tue May 1 09:00:00 2001

    $ date -d ''8pm 01/03/02''

    Thu Jan 3 19:00:00 2002

    ```


    On some older Linux distributions, the convdate command is provided and performs
    a similar function.


    ```

    $ convdate ''8pm 01/03/02''

    Thu Jan 3 19:00:00 2002

    ```


    The -n (number) switch returns the seconds since January 1, 1970 (the epoch).
    The -c switch returns a date string for seconds from the epoch.


    ```

    $ convdate -n ''may 1 10am''

    988722000

    $ convdate -c 988722000

    Tue May 1 10:00:00 2001

    ```'
