  md: '# The Effect of Quotations


    These two assignments produce the same result: COST is assigned a value of 0.
    The double quotes explicitly show that the value to assign to COST includes the
    character zero. Short alphanumeric values can be assigned to variables without
    quotations. However, when the string contains spaces, it''s no longer apparent
    what value is to be assigned. Consider the following example.


    ```

    $ DISTRIBUTION_CENTERS=London

    printf "%s" $DISTRIBUTION_CENTERS

    London

    $ DISTRIBUTION_CENTERS=London ; Paris ; New York

    bash: Paris: command not found

    bash: New: command not found

    printf "%s" $DISTRIBUTION_CENTERS

    London

    ```


    When Bash examines the second assignment statement, it sees a value of London
    terminated by a space. It assigns that value to the variable. It sees the semicolon,
    and separates a new statement to follow. It tries to execute the Paris command
    (there is none). It tries to do the same with the New command, giving it the York
    argument.


    For this reason, it is a safe practice to enclose all assignment values in double
    quotation marks. Even if your company only has a distribution center in London,
    there''s always the chance that a new distribution center will be added to the
    string, causing the shell to crash. Always enclosing values in quotes ensures
    that Bash knows exactly what value is to be assigned.


    ```

    $ DISTRIBUTION_CENTERS="London ; Paris ; New York"

    printf "%s" $DISTRIBUTION_CENTERS

    London;Paris;NewYork

    ```


    The results are still not correct. Bash took the DISTRIBUTION_CENTERS value and
    removes the spaces so that printf doesn''t interpret it as separate arguments
    of London,, Paris,, New, and York. The printf argument must also be enclosed in
    double quotes to keep the value of the variable as a single argument with the
    spacing intact.


    ```

    $ printf "%s" "$DISTRIBUTION_CENTERS"

    London ; Paris ; New York

    ```


    Again, it is a safe practice to always enclose variable substitutions with hints
    on how to interpret special characters. Because the quotation marks are not delimiters
    but hints, they can be used back-to-back. This is a convenient way to separate
    variables from the surrounding text in a string.


    ```

    $ TAX=7.25

    $ TAX MESSAGE="$TAX%"

    printf "%s" "$TAX_MESSAGE"

    ```


    The tax is 7.25%'
