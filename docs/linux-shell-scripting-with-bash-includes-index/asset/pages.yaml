  md: '# Transferring Ownership (chown/chgrp)


    The Linux chown (change owner) command changes the owner of a file. To chown,
    you must be the owner of the file. Only root can use chown to change ownership.
    An ordinary user can use it to change the group, as long as the user is also a
    member of the target group.


    The owner can be either a numeric uid or a name.


    ```

    $ chown order_sys orders.txt

    ```


    The --reference switch can copy the ownership from another file.


    ```

    $ chown--reference=last_orders.txt orders.txt

    ```


    For additional security in switches, the --from switch can verify the old owner
    before changing it to a new owner. The --reference and --from switches can''t
    be combined in a single chown.


    ```

    $ chown --from=kburtch order_sys orders.txt

    ```


    When a colon and a group name follow the owner, chown changes both the owner and
    the group. If the group part is missing, the group is set to the owner''s group.
    If the owner part is missing, only the owner is changed. A group can also be specified
    in the --from switch using a colon.


    ```

    $ chown --recursive (or -R) nogroup orders.txt

    ```


    The --recursive (or -R) switch recursively changes files in subdirectories. The
    --changes (or -c) switch announces each change. The --verbose (or -v) switch provides
    more information. The --quiet (or --silent or -f) switch hides error messages.
    The --dereference switch dereferences symbolic links.


    Use chown to determine if one can access a script and its related files, minimizing
    the problems a hidden script can cause.


    Avoid running scripts under the superuser login. A script running under the superuser
    login can change the owner of any file. However, if you find that you have to
    use the superuser login for a script that performs a task other than system administration,
    it is an indication that the ownership of the files is wrong. Change the owner
    of the files, or even create a fictitious user to own the files, instead of running
    under the superuser login. Mistakes in a superuser script can be wide-ranging,
    very dangerous, and difficult to track down.


    The Linux chgrp (change group) command is a short form for group :group. chgrp
    changes only the group ownership.


    # Changing Access Rights (chmod)


    Like chown to change file ownership, the Linux chmod (change mode) command changes
    a file''s permissions. The name comes from the Linux term mode, a number consisting'
