  md: '# Chapter 5 Variables


    Although not particularly realistic in this example, the eval command is useful
    when the user types commands to execute, or when reading commands to execute from
    a file. The commands can contain variables, dollar functions, and so forth, provided
    you use eval to process them.


    A common pitfall is not following through the substitution process. Suppose, for
    instead of assigning $DISPLAY_VARIABLE the value $SALES_EAST, $SALES_EAST was
    assigned and a second dollar sign was assigned to the printf statement.


    ```

    printf "reprocessed with eval, DISPLAY_VARIABLE = %s\n" \\printf "%s" \$DISPLAY_VARIABLE"

    ```


    You would get a response to this:


    ```

    reprocessed with eval, DISPLAY_VARIABLE = 14235SALES_EAST

    ```


    In this case, the substitution leaves the command:


    ```

    printf "reprocessed with eval, DISPLAY_VARIABLE = %s\n" \\eval printf "%s" \$SALES_EAST''

    ```


    But $$ is a built-in shell function. Bash doesn''t understand that $SALES_EAST
    is supposed to be nested inside the first dollar sign: it simply reads from left
    to right, substituting as it does. The second substitution would execute the $$
    function, not substitute the value of the SUM variable. To execute this properly,
    you have to escape the first dollar sign with a backslash to keep Bash from substituting
    it.


    After the first substitution, you get this:


    ```

    printf "reprocessed with eval, DISPLAY_VARIABLE = %s\n" \\eval printf "%s\n" \$$SUM

    ```


    This prevents $$ from being treated as a built-in function: Bash substitutes $$SALES_EAST
    instead. You bypassed these in the first example when the dollar sign was inside
    DISPLAY_VARIABLE.


    The same effect can be achieved by escaping some quotation marks in the right
    places.


    Variables and constants form the building blocks of all scripts, but they only
    serve as storage containers without expressions.These are covered in the next
    chapter (Chapter 6, "Expressions")


