  md: '# # Parameters and Subshells


    TO SERVE AS A FLEXIBLE TOOL, a script has to be qualified when it is called, given
    additional information about how and where to perform its task. Like commands,
    a script is qualified using parameters. Switches and arguments make a script reusable,
    which in turn reduces costs and time.


    # ## Positional Parameters


    There are three methods available to extend Linux scripts using parameters. The
    first method uses positional parameters. A script can refer to the parameters
    on the command line by the position (or order) in which they appear. Because the
    other two methods rely on positional parameters, they are discussed first.


    The Bash variable $0 is the pathname of the script. It is not necessarily the
    full pathname, but rather the path used to specify the script when it was executed.


    ```

    $ printf "%s\n" "$0"

    /bin/bash

    ```


    In this case, the Bash session was started with the command /bin/bash. When combined
    with the basename command, the name of the script is removed from the rest of
    the pathname.


    ```

    $ declare -rx SCRIPT=''basename $0''

    $ printf "%s\n" "$$SCRIPT"

    bash

    ```


    A slightly faster version uses Bash''s substring features and avoids running an
    outside program.


    ```

    $ declare -rx SCRIPT=${$0##*/}

    $ printf "%s\n" "$$SCRIPT"

    bash

    ```'
  merge: -1
  pgno: 166
- img_proc: true
  md: 'By finding the name of the script from $0, there is no danger that the wrong
    name will be printed after the script has been copied or renamed. SCRIPT is always
    the correct name of the script.


    The variable $# contains the number of parameters to a script or a shell session.
    If there are no parameters, $# is zero.The number doesn''t include the script
    name in $0.


    ```

    $ printf "%d\n" $$\$

    0

    ```


    The first nine parameters are placed in the variables $1 through $9. (Parameters
    beyond nine can be accessed if curly braces surround the number.) When the unset
    shell is used, accessing an undefined parameter results in an error, as if it
    were an undeclared variable.


    ```

    $ printf "%s\n" $9

    bash: unbound variable

    ```


    The variable $* (or $) returns a complete list of all the parameters as a single
    string. When using positional parameters, Bash does not differentiate between
    switches and arguments. Each item on the command line is a separate parameter
    to the script. Consider the following script, shown in Listing 9.1.


    # Listing 9.1 params.sh


    ```

    #!/bin/bash


    # params.sh: a positional parameter demonstration


    printf "There are %d parameter(s)\n" "$*"

    printf "The complete list is %s\n" "$@"

    printf "The first parameter is %s\n" "$1"

    printf "The second parameter is %s\n" "$2"

    ```


    When the script runs using the parameters -c and t2341, $1 refers to and t2341


    ```

    $ bash params.sh -c t2341

    There are 2 parameter(s)

    The complete list is -c t2341

    The first parameter is -c

    The second parameter is -t

    ```


    Both $* and $@ refer to all the parameters, they differ when they are enclosed
    in double quotes. $* are separated by the first character of the IFS variable,
    or if spaces IFS is empty, or without anything when IFS is unset. $* treats the
    set of parameters as a single group.


    On the other hand, always separates the parameters by spaces and treats the parameters
    as individual items, even when they are enclosed in double quotes. " is often
    used to transfer the entire set of switches to another command (for example, ls
    $@).'
