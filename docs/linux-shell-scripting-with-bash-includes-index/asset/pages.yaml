  md: '# emacs mode


    emacs mode involves command editing in an interactive session using keys similar
    to the emacs editor.


    Environment is a Linux term for the collection of variables and open files exported
    from one program to another.


    Environment variables are the variables Linux shares between programs via its
    environment.


    The epoch is the start of the calendar, January 1, 1970.


    Expansion is the replacement of variables and expressions embedded in an executable
    line.


    Exporting variables is the process of providing the variables to programs run
    from the script.


    Expressions are formulas that calculate values.


    FIFOs (First-In, First-Out) are named pipes.


    Filename completion is when Bash, in an interactive session, searches for a suitable
    filename matching specified characters.


    Filters are commands that take the results of one command and modify them in some
    way to supply them to another command or file.


    Flags are string variables that indicate a given condition if the value is not
    an empty string.


    Globbing is pattern matching by the shell''s wildcard filename matching conventions.


    Hard links are links that act identically to the files they represent.


    Here files are the lines of data associated with the << redirection operator.


    A home directory is the directory a user is given when he she logs in, specified
    with - in Bash.


    Hostnames are computer names used to refer specific machines on the network.


    Indexes are the positions of items in an array.


    Inode density represents the number of inodes per storage capacity.


    Inodes are the unique identification numbers for Linux files.


    Job control is the capability to manage background tasks using built-in shell
    commands.


    Jobs are background tasks started from the shell.


    Keywords are words or symbols with special meaning to Bash.


    Links are shortcuts referring to a file.


    Lock files are files that indicate a certain condition, typically that a resource
    or another file is in use.


    Named pipes are special files that can be read by one script while writing to
    another.


    Open source refers to software that is released with the source code to the general
    public so programmers can rebuild or alter the software to suit their needs.


    A parameter is a switch or an argument.'
  merge: -1
  pgno: 393
