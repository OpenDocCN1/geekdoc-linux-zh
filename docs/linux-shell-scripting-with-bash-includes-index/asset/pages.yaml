    ```


    COMPANY_BRANCH is a read-only variable in the current script. When it''s exported
    to a second script, it''s exported as a normal variable—the read-only effect is
    lost. The reason for this strange behavior is rooted in the way Linux shares environment
    variables between programs and has nothing to do with the Bash shell itself.


    Environment variables are the variables Linux shares between a program and the
    program that executed it. Like layers of an onion, each program must explicitly
    export a variable into the next program to see it.


    Although Linux has provisions for exporting environment variables, there is no
    way to assign any attributes to them. Linux has no notion of attributes. Bash
    attributes were thought up after environment variables were first invented. When
    Bash variables are given to Linux to share with a new program, the attributes
    are lost. When the second script starts, it has no way of knowing what the original
    attributes were.


    The variables shared with a new program are copies of the original. If a script
    declares an exported variable and runs a second script, any changes made to the
    variable by the second script are invisible to the first. There is no way for
    a second script to assign a new value to a variable that the first script will
    see. Unlike other programming languages, shell variables are a one-way.


    Suppose there are two scripts outer.sh and inner.sh. outer.sh declares a variable
    and runs the inner.sh script, as shown in Listings 5.1 and 5.2.


    +   Listing 5.1 outer.sh


    ```

    # outer.sh

    #

    # This script runs first.

    ```


    ```

    declare -rx COMPANY_BRANCH="West Coast Branch"

    bash inner.sh

    printf "%s\n" "$COMPANY_BRANCH"

    ```


    ```

    exit 0

    ```'
