  md: '# Debugging and Version Control


    WHEN I WAS IN BROCK UNIVERSITY, the Macquarie lab was filled with used Macintosh
    Plus computers passed down from professors who had outgrown them. One day I was
    working on a program for my third-year operating system course. The short C program
    I was working on was reported to be error free. When I ran it, vertical bars appeared
    in the monochrome desktop, my floppy disk ejected, and the computer rebooted.
    Upon mistake inspection, I noticed that I used an = instead of a == in an statement.
    That small mistake created unforeseen results. Ever since then, I treat the C
    language as a psychotic romance: we might live and work, but I never take my eye
    off it for a minute in case it tries to stab me in the back.


    Unfortunately, shell scripts are almost as difficult to debug as C programs. Like
    C, shell commands usually assume you know what you are doing and issue an error
    only when the offending line occurs. Unless shell scripts are thoroughly tested,
    bugs can linger for months or years until the faulty command is finally executed.
    A solid knowledge of shell debugging tools is essential for professional script
    development.


    # Shell Debugging Features


    There are several Bash switches and options useful in tracking down problems in
    scripts. The -n (no execution) switch checks a syntax for errors without running
    it. This switch to check a script during development.


    ```

    $ bash -n bad.sh

    bad.sh: line 3: syntax error near unexpected token ''fi''

    bad.sh: line 3: ''fi''

    ```


    In this example, there is an error on or before line 3 of the script. The term
    token refers to a keyword or piece of text near the source of the error.

    The -o errexit terminates the script if a command returns an error code. The exceptions
    are loops, so if the command work properly if commands cannot return a non-zero
    status. Use this option only on the simplest scripts without any other error handling;
    for example, it does not terminate the script if an error occurs in a subshell.'
