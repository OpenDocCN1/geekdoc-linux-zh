  md: '# 4


    # Script Basics


    I WAS FIRST INTRODUCED TO COMPUTERS when my high school purchased a shiny new
    TRS-80, Model I. The computer was installed in the library, free for anybody to
    use. I remember following the dog-eared manual and typing in my first BASIC program.


    ```

    10 PRINT "KEN WAS HERE";n20 GOTO 10

    ```


    When I ran the program, I was in for a surprise. Not only did the computer faithfully
    carry out my instructions over and over, but also the words scrolling up the screen
    formed a shifting pattern. When the screen became full, it scrolled to make room
    for more messages. If I changed the length of the message to a number that evenly
    divided into 64 (the TRS-80 had 64 character lines), the messages marched up the
    screen in columns. There was unexpected magic in my name.

    The joy of programming is the joy of creating something new by giving "airy nothing
    a local habitation and a name." Even bugs, in their way, are unexpected signposts
    on the long road of creativity that offer choices depending on how you decide
    to deal with them. Choice leads to another, and no two programs of any size are
    the same. They are truly the offspring of a creative process as much as any painting,
    song, or poem.


    In Bash, the journey starts with a programmer''s first script. This chapter introduces
    the basic techniques of shell scripting—creating an organized script, redirecting
    standard file descriptors, and working with different kinds of commands.


    # Creating a Script


    By convention, Bash scripts have names ending with .sh. Listing 4.1 shows a script
    called hello.sh, a very short script that writes a message on the screen.'
