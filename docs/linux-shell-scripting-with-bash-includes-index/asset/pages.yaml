    # Process Substitution


    Sometimes the vertical bar pipe operators cannot use to link a series of commands
    together. When a command in the pipeline does not use standard input, or it uses
    two sources of input, a pipe cannot be formed. To create pipes when normal pipelines
    do not work, Bash uses a special feature process substitution.


    When a command is enclosed in ((..)), Bash runs the command in a subshell, redirecting
    the results to a temporary named pipe instead of standard input. In place of the
    command, Bash substitutes the name of a named pipe containing the results of the
    command.


    Process substitution can be used anywhere where a filename is normally used. For
    example, the Linux grep command, a file-searching command, can search for a file
    for a list of strings. A temporary file can be used to search a log file for references
    to the current directory.


    ```

    $ ls -l > temp.txt

    $ grep -f temp.txt /var/log/nightrun_log.txt

    Wed Aug 29 14:18:38 EDT 2001 invoice_error.txt deleted

    $ rm temp.txt

    ```


    A pipeline cannot be used to combine these commands because the list of files
    is being read from temp.txt, not standard input. However, these two commands can
    be rewritten as a single command using process substitution in place of the temporary-file.


    ```

    $ grep -f <(ls -1) /var/log/nightrun_log.txt

    Wed Aug 29 14:18:38 EDT 2001 invoice_error.txt deleted

    ```


    In this case, the results of ls -1 are written to a temporary pipe, grep reads
    the list of files from the pipe and matches them against the contents of the nightrun.log.txt
    file. The fact that Bash replaces the ls command with the name of a temporary
    pipe can be checked with a printf statement.'
