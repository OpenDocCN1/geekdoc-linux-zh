  md: '# Watching Running Scripts


    To test cron scripts without installing them under cron


    # Timing Execution with Time


    There are two commands available for timing a program or script.

    The Bash built-in command time tells you how long a program to run. You can also
    use time to time a series of commands. Except for the real time, the statistics
    returned by time refer to the system resources used by the script and not any
    of the commands run by the script.


    The results are formatted according the value of the TIMEFORMAT variable. The
    layout of TIMEFORMAT is similar to the date command formatting string in that
    it uses a set of % codes.


    +   - %—A literal %

    - %[precision] [1]R—The real time, the elapsed time in seconds.

    - %[precision] [1]U—The number of CPU seconds spent in user mode.

    - %[precision] [1]S—The number of CPU seconds spent in system mode.

    - %P—The CPU percentage, calculated as (%U+%S) / %R.


    The precision indicates the number decimal positions to show, with a default of
    3. The character l (long) prints the value divided into minutes and seconds. If
    there is no TIMEFORMAT, Bash uses \nreal\t\31R

    user\t\31U

    sys\t\31S.


    ```

    $ unset TIMEFORMAT

    $ ls > /dev/null


    real    0m.018s

    user    0m.010s

    sys     0m.010s

    $ declare -x TIMEFORMAT="%P"

    $ ls > /dev/null

    75.34

    $ declare -x TIMEFORMAT="The real time is %lR"

    $ ls > /dev/null

    The real time is 0m.023s

    ```


    Notice the times can vary slightly between the runs because other programs running
    on the computer affect them. To get the most accurate test, test a script several
    times and take the lowest value.'
