    \ script when the shell (or shell script) is first started. Second, after each\
    \ command is executed, the command is placed in the environment as a variable\
    \ containing the pathname of the command.\n\n```\n$ /bin/date\nFri Jun 29 14:39:58\
    \ EDT 2001\n$ printf \"%s\\n\" \"_\"\n/bin/date\n$ date\nFri Jun 29 14:40:04 EDT\
    \ 2001\n$ printf \"%s\\n\" \"_\"\ndate\n```\n\nYou can use $_ to repeat the last\
    \ argument.\n\n# The getopts Command\n\nThere are two limitations to the positional\
    \ parameter approach. First, it requires the script writer to test for errors\
    \ and create the corresponding messages. Second, the shift command destroys all\
    \ the parameters. If you want to access them later, you can't.\n\nTo deal with\
    \ these issues, Bash includes a built-in getopts (get options) command that extracts\
    \ and checks switches without disturbing the positional parameter variables. Unexpected\
    \ switches, or switches that are missing arguments, are recognized and reported\
    \ as errors.\n\nUsing getopts requires some preparation by the script writer.\
    \ You must define a string containing a list of expected switch letters. By convention,\
    \ this variable is called OPTSTRING. If any switch requires an argument, add a\
    \ colon after the switch character."
