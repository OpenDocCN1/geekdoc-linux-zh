  md: "# Moving and Copying Files\n\nFiles are renamed or moved to new directories\
    \ using the mv (move) command. If -f (force) is used, move overwrites an existing\
    \ file instead of reporting an error. Use -f only when it is safe to overwrite\
    \ the file.\n\nYou can combine touch with mv to back up an old file under a different\
    \ name starting a new file. The Linux convention for backup files is to rename\
    \ them with a trailing t (-). See Listing 11.4.\n\nListing 11.4 backup_demo.sh\n\
    \n```\n#!/bin/bash\n# backup_demo.sh\nshopt -s o nounset\ndeclare -rx RUN_RESULTS=\"\
    ./run_results.txt\"\nif [ -f \"$RUN_RESULTS\" ]; then\n  mv -f \"$RUN_RESULTS\"\
    \ \"$RUN_RESULTS-\"\n  if [ $? -ne 0 ]; then\n    printf \"%s\\n\" \"Error: unable\
    \ to backup $RUN_RESULTS\" >&2\n  fi\n  touch \"$RUN_RESULTS\"\nfi\n```\n\nprintf\
    \ \"Run stated %s\\n\" \"$date\" >> \"$RUN_RESULTS\"\n\n> Because it is always\
    \ safe to overwrite the backup, the move is forced with the -f switch. Archiving\
    \ files is usually better than outright deleting because there is no way to \"\
    undelete\" a file in Linux.\n\n> Similar to mv is the cp (copy), cp makes copies\
    \ of a file and does not delete the original file. cp can also be used to make\
    \ links instead of copies using the -link switch.\n\n# More Information About\
    \ Files\n\nThere are two Linux commands that display information about a file\
