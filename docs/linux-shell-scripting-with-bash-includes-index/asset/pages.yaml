  md: '# 12


    # Text File Processing


    SEVERAL YEARS AGO, DAN, AN OLD HIGH SCHOOL FRIEND, arrived at my house with two
    photocopied binders and a CD-ROM. "You''ve got to try this," he said. "This is
    version 0.9 of a free operating system called Linux."


    We loaded Linux onto a spare 386 computer. The distribution didn''t show the current
    directory in the command prompt. After several minutes of searching and experimenting,
    Dan deleted his temporary files with rm -f *. After several seconds, I interrupted
    the command with control-c and looked worried. "That was taking too long. I think
    I was in the wrong directory."


    "What are we going to do? The CD-ROM''s still mounted, but we can''t find the
    file to restore the directory when we can''t list anything."


    I didn''t criticize: I had a few horror stories of my own. After a few minutes,
    I took a chance and typed find -type f -maxdepth 1 -print and the files in the
    current directory scrolled up the screen. I smiled. "You fried ls, but the find
    command is still intact." We managed to replace the missing files and were back
    in business. The find saved us from performing a complete reinstall.


    This chapter contains more examples of working with text files using the orders.txt
    file introduced at the start of the last chapter.


    # Finding Lines


    The Linux grep command searches a file for lines matching a pattern. On Unix-based
    systems, there are two other grep commands egrep (extended grep) and fgrep (fixed
    string grep). Linux combines these variations into one command. The egrep command
    runs grep with the -extended-regex (or -E) switch, and the fgrep command runs
    grep with the -fixed-strings (or -F) switch.'
  merge: -1
  pgno: 228
- img_proc: true
  md: '# Chapter 12 Text File Processing


    The strange name grep originates in the early days of Unix, whereby one of the
    line-editor commands was g/re/p (globally search for a regular expression and
    print the matching lines). Because this editor was used so often, a separate grep
    command was created to search files without first starting the line editor.

    grep uses matching patterns called regular expressions, which are similar to the
    pattern of the extended text command ([...]). The basic symbols are as follows:


    +   - Zero or more characters

    - +One or more characters

    - ?Follows a character, which is optional

    - .A single character (this is ? in the extended text)

    - ^The start of the line

    - $-The end of the line

    - [...]A list of characters, including ranges and character classes

    - {n}-Follows an item that is to appear n times

    - {n,}-Follows an item that is to appear n or more times

    - {n,m}-Follows an item that is to appear n to m times

    - (...)A subpattern that’s used to change the order of operations


    Notice that the symbols are not exactly the same as the globbing symbols used
    for file matching. On the command line a question mark represents any character,
    whereas in grep, period has this effect.

    The characters ?, +, {, [, and ) must escape with backslashes to prevent Bash
    from treating them as file-matching characters.

    Suppose you want to match all orders in the orders.txt file containing a


    ```

    $ grep "W" orders.txt

    Mahogany Writing Desk,463.99,1,756

    Walnut TV Stand,388.99,1,756

    ```


    The asterisk (*) is a placeholder representing zero or more characters.


    ```

    $ grep "M*Desk" orders.txt

    Mahogany Writing Desk,463.99,1,756

    ```


    The fixed-strings switch suppresses the meaning of the pattern-matching characters.
    When used with M*Desk, grep searches for the exact string, including the asterisk,
    which does not appear anywhere in the file.


    ```

    $ grep -fixed-strings "M*Desk" orders.txt

    $

    ```


    The caret (^) character indicates the beginning of a line. Use the caret to check
    for a pattern at the start of a line.'
