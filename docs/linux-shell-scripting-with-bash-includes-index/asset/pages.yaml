    # Sorting


    The Linux sort sorts a file or a set of files. A file can be made explicitly or
    redirected to sort on standard input. The switches for sort are completely different
    from commands such as grep or cut. sort is one of the last commands to support
    long versions of switches: As a result, the short switches are used here. Even
    so, the switches for common options are not the same as other Linux commands.'
