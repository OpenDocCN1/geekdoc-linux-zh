    # Creating Transcripts


    The output of a command can be saved to a file with the tee command.The name

    symbolizes a pipe that splits into two at a T connection:A copy of the output
    is stored

    in a file without redirecting the original standard output. To capture both standard
    out-

    put and standard error, redirect standard error to standard output before piping

    tresults to tee.


    ```

    $ bash buggy_script.sh >& | tee results.txt

    ```


    The tee --append (-a) switch adds the output to the end of an existing file.The

    --ignore-interrupts (-i) switch keeps tee running even if it is interrupted by
    a Linux

    signal.

    This technique doesn''t copy what is typed on standard input. To get a complete

    recording of a script''s run, Linux has a script command.When a shell script is
    running

    under script, a file named typescript is created in the current directory. The
    typescript

    is a text file that records a list of everything that appears in the shell session.

    You can stop the recording process with the exit command.


    ```

    $ script

    Script started, file is typescript

