  md: 'recognizes word designators, which recall a different word than the command.
    The term "word" is a word in the shell sense; a string separated by whitespace.
    The word designator is separated from the rest of the history recall command with
    a colon.


    A :select \n$ nth word on the history line. Word zero is the command.


    ```

    $ printf "%s\n" "date"

    Thu Jul 5 14:34:41 EDT 2001

    $ NOW==2

    NOW="%s\n"$NOW"

    ```


    ```

    $ printf "%s\n"

    Thu Jul 5 14:34:55 EDT 2001

    ```


    A :indicates the first word after the command, the same as :1. A :indicates the
    last word. A :* represents ^ through $.


    ```

    $ touch temp.txt

    $ rm !!

    rm temp.txt

    ```


    Other designators include % (the last word matched by a history search), :x-y
    (words x through y, inclusive), :x* (word x through the end), :x- (word x through
    the end, including the last word).


    ```

    $ printf "%s and %\n" "apples" "oranges"

    apples and oranges

    $ printf "Two fruits are %s and %\n" !!2*

    printf "Two fruits are %s and %\n" "apples" "oranges"

    Two fruits and oranges

    ```


    After a word designator, you can include a series of modifiers, each preceded
    by a colon:


    +   - :e—indicates the suffix of a pathname

    - :g—Makes the changes "global" over the entire command

    - :h—indicates the path of a pathname

    - :p—Prints but does not execute

    - :r—Shows the pathname without the filename

    - :s/old/new—Substitutes the first occurrence of the string old with new (essentially
    same as :^)

    - :t—Shows the filename of a pathname

    - :q—Quotes the words after breaking them into individual words

    - :x—Quotes the words after breaking them into individual words

    - :&—Repeats the last :s


    Here are a few examples.


    ```

    $ touch /home/kburtch/temp.txt

    $ ls -l /home/kburtch/temp.txt

    ```'
