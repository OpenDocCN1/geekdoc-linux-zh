  md: '# Shell Security


    SYSTEM SECURITY CAN OFTEN BE A TWO-EDGED SWORD. Many companies spend large sums
    of money on system administration tools; often inadequately train their admin
    staff. The first word of system resource shortages invariably comes from the programmers
    themselves.


    At one company I worked for, the official policy was to prevent the programmers
    from the system from accessing the performance monitoring utilities. When head
    of administration the tools were accessible, he ordered them to be made secure.
    After a couple of weeks, the staff silently enabled the utilities again because
    disabling them bottled up the company''s first line of defense.


    Security in a shell script, like system security, is a matter of tightening everything
    to the point that the script barely functions, but of ensuring that the script
    doesn''t make any unnecessary assumptions when porting to a new system or debugging
    a difficult problem later. It involves making your scripts crash-proof in case
    of an emergency or during the malicious sabotage of a coworker. Like using unset
    shell option, more security means less maintenance.


    # The Basic Linux Security Model


    All files are owned by an owner and a group. But who owns a file? Each file is
    assigned the user ID of a particular login. Users are further divided into groups,
    and each user is assigned a group number. Originally, Unix assigned users to a
    single group, called the primary gid. BSD 4.3 introduced additional supplemental
    groups. In terms of files, a user must have a primary or supplemental group that
    matches the file GID in order to qualify for group access.


    Each Linux user has a uid (user id number) and every file on a Linux system has
    a uid number that indicates owns that file.


    ```

    -numeric-uid-gid ls shows the octal numbers instead of the names of the file''s
    uid and gid owners.

    ```'
