    \ for -ugG\n- -real (or -r)—Prints the real ID instead of the effective ID; for\
    \ -ugG\n- -user (or -u)—Prints only the user ID\n\n# chown Command Switches\n\n\
    +   - -changes (or -c)—Is verbose whenever changes occur\n- -dereference-Follows\
