  md: "# Chapter 16 Network Programming\n\n+   - 403 Forbidden—The script permissions\
    \ are wrong or the script is not in a CGI directory\n- 404 Not Found—The CGI script\
    \ was missing or the wrong URL was used.\n- 500 Internal Server Error—The script\
    \ did not return a proper CGI header.\n\nThe server error is the most common error.\
    \ This occurs when the script stops with an error before it is able to write the\
    \ HTTP header. Any messages written to standard error appear in the Web server's\
    \ error log. A Web page returned missing or incorrect information, check the Web\
    \ server log for errors.\n\nBecause it's inconvenient to check the server error\
    \ log, the CGI script should attempt to capture any errors and display them through\
    \ standard output on the Web page.\nTo return a Web page instead, change the content\
    \ to text/html. When displaying errors using a Web page, make the font and colors\
    \ are set to reasonable values so that the errors are clearly visible. In Listing\
    \ 16.3, errors are displayed in a white box at the bottom of the page.\n\n# Listing\
