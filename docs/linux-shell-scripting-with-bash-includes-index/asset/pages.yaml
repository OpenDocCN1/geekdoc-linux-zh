  md: '# The getopt Command


    The getopt command makes programming scripts somewhat easier, it doesn''t adhere
    to the Linux switch standards. In particular, getopt doesn''t allow double minus
    long switches.


    To get around this limitation, getopt includes its own getopt (singular, not todays)
    command. Similar to getopt, getopt allows switches and has other features that
    getopt does not, and it is used in scripts in an entirely different way.


    Because getopt is an external command, it can''t save switches into variables
    that the getopt does. It has no way to export environment variables to the script.
    Likewise, getopt doesn''t know which switches it has unless they are copied to
    the getopt command $. As a result, instead of being in a loop, getopt runs once
    to process all the parameters as a single group.


    Like getopt, getopt uses OPTSTRING list of options. The list can be preceded by
    --options (or -o) to make it clear that these are the list of switches. The items
    are listed as in getopt or as a comma-separated list.


    The list of options given to the script must be appended to the getopt command
    using a double minus and $. The double minus indicates that the getopt switches
    end and where the script switches begin.


    Listing 9.5 contains a script that duplicates the getopt.sh using getopt. Notice
    that the --name (or -n) switch is used to give getopt the name of the script to
    be used in any error messages.


    +   Listing 9.5 getopt.sh


    ```

    #!/bin/bash

    #

    #getopt.sh - a demonstration of getopt

    declares -rx SCRIPT=${0*/}

    declare RESULT

    RESULT=$(getopt --name "SCRIPT" --options "-h, -c:" -- "$@"

    printf "status code=$result=\\$RESULT\"

    "

    ```


    Here are the results:


    ```

    $ bash getopt.sh -h

    status code=0 result="-h"

    $ bash getopt.sh -c

    getopt.sh: option requires an argument -c

    status code=1 result="--"

    $ bash getopt.sh -x

    getopt.sh: invalid option --x

    status code=1 result="--"

    ```


    The status code indicates whether getopt was successful. Status code 1 indicates
    getopt printed error messages. Status code 2 indicates a problem with options
    given to the getopt command itself.'
