  md: "# Built-In Versus Linux Commands\n\nThe original Bourne shell was designed\
    \ in a way that anything that was not an essential part of the shell was implemented\
    \ as some program outside of the shell. Even arithmetic, for example, had to be\
    \ performed by an outside program. This design made the Bourne shell very flexible,\
    \ but it also introduced a couple of drawbacks. First, it meant programs were\
    \ constantly loading and restarting to perform even the simplest of tasks. Second,\
    \ it made shell scripts difficult to port because there were no guarantees that\
