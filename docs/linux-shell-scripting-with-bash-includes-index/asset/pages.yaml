  md: '# Finding Files 213


    For example, use this to find log files greater than 1MB:


    ```

    $ find -type f -name "*.log" -size +1024k

    ./logs/giant.log

    ```


    find the matching paths on standard output. Historically, the -print switch had
    to be used. Printing the paths is not the default behavior for most Unix-like
    operating systems, including Linux. If compatibility is a concern, add -print
    to the end of the find parameters.


    To perform a different action on a successful match, use -exec. The -exec switch
    runs a program on each matching file. This is often combined with rm to delete
    files, or grep to test the files to see whether they contain a pattern. The name
    of the file is inserted into the command by a pair of curly braces ({}) and the
    command ends with an escaped semicolon. If the semicolon is not escaped, the shell
    interprets it as the end of the find command instead.


    ```

    $ find -type f -name "*.txt" -exec grep Table {} \

    ```


    Pine Table,375.99,1,257

    Pine Table,375.99,1,257


    More than one action can be specified. To show the filename after a grep match,
    include -print.


    ```

    $ find -type f -name "*.txt" -exec grep Table {} \ -print

    ```


    Pine Table,375.99,1,257

    ./orders.txt

    Pine Table,375.99,1,257

    /archive/old_orders.txt


    find exec {} to appear by itself (that is, surrounded by whitespace). It can''t
    be combined with other characters, such as in an attempt to form a new pathname.


    The -exec switch can be used to execute for each match. When you have the option
    of piping the results to a second command, the execution speed is significantly
    faster than using -exec. A pipe generates the results with two commands instead
    of hundreds or thousands of commands.


    The -ok switch works the same as -exec except that it interactively verifies whether
    the command should run.


    ```

    $ find -type f -name "*.txt" -ok rm {} \;

    < rm ../orders.txt ? n

    < rm ../advocacy/linux.txt ? n

    < rm ../advocacy/old_orders.txt ? n

    ```


    The -ls action lists matching files with more detail. find runs ls -dils for each
    matching file.


    ```

    $ find -type f -name "*.txt"*

    ```


    243300 4 -rw-rw-r- 1 kburtch kbch 592 May 17 14:41 ./orders.txt

    114683 0 -rw-rw-r- 1 kburtch kbch 0 May 17 14:41 ./advocacy/


    * With-*'
