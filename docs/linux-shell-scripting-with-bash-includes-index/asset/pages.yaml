  md: "# Chapter 7 Compound Commands\n\nThe unofficial Linux convention uses 127 and\
    \ below for Linux standard error codes. In this case, ls returns a status code\
    \ of 9, which is the Linux error code for \"bad file number\". The complete set\
    \ of Linux error codes is listed in Appendix D,\"Error Codes.\n\nIf a command\
    \ is interrupted by a signal, Bash returns a status code of 128, plus as a result,\
    \ user-defined error codes should be above 191, and the code returned by Bash\
    \ for the final Linux signal, number 63. The list of status codes is in Appendix\
    \ E,\"Signals.\n\n```\nif test -x \"who\"; then\n    printf \"$SCRIPT:$LINENO:\
    \ the command $who is not available - \"\"\n    aborting\\n\" >&2\n    exit 192\n\
    fi\n```\n\nUnfortunately, most Linux commands simply return one or zero to indicate\
    \ failure or success. This is often all the information needed by a script if\
    \ it stops immediately when an error occurs. The particular error message is still\
    \ displayed on standard output.\n\n```\n$ ls po_1473.txt\npo_1473.txt\n$ printf\
    \ \"%d\\n\"\n0\n$ ls no_file\nno_file not found\n$ printf \"%d\\n\"\n1\n```\n\n\
    The status code is different from the truth values returned by the let command\
    \ as discussed in Chapter 6, in the section called \"Logical Expressions.\\ In\
    \ let, false (a failed comparison) has the value of 0. This follows the conventions\
    \ of computer languages as C. However, a status code of 0 is success, not a failure.\n\
    \n```\n$ let RESULT=1>0\n$ printf \"%d\\n\" \"$RESULT\"\n1\n$ test 1 -gt 0\n$\
    \ printf \"%d\\n\"\n0\n```\n\nlet assigns 1 to RESULT, indicating that 1 is greater\
    \ than 0. The test command returns a status code of 0 to indicate that 1 is greater\
    \ than 0. What's more, the let command has a status code of 0, indicating the\
    \ let command successfully performed the comparison.\n\nThese opposite codes and\
    \ conventions can lead to mistakes that are hard to debug. Bash has two built-in\
    \ commands called true and false. These return status codes, not let truth values."
