  md: '# Processing Forms


    +   - SERVER_PORT—The TCP/IP port used to connect to the Web server

    - SERVER_PROTOCOL—Version of HTTP used by the server

    - SERVER_SOFTWARE—Description of the Web server


    # Processing Forms


    The HTML equivalent of environment variables is the form. Each form contains a
    set of variables. For example, the form input tag


    ```

    <input type="hidden" name="user" value="bsmith>

    ```


    is the HTML equivalent of

    declare user="bsmith"


    Other nonhidden input tags represent variables whose values can be changed by
    the user through items on the form. Such items include buttons, menus, and text
    boxes. In all these cases, the choices made by the user are saved as new values
    of the variable before the form is sent to a CGI script.


    Because the CGI script does not receive a copy of the Web page, how then does
    it know the values of the input tags? There are two methods. The older GET method
    sends the variables in an environment called QUERY_STRING. Consider the following-form.


    ```

    <html>

    <head>

    <title>Form Test</title>

    </head>

    <body>

    <form action="http://localhost/cgi-bin/form.cgi">

    <input type="hidden" name="user" value="bsmith">

    <input type="submit" name="submit" value="Click Me!">

    </form>

    </body>

    </html>

    ```


    The query string contains the names and values of the two variables.

    user=bsmith&submit=ClickMe21


    One of the reasons forms are difficult to work with is that the information is
    encoded. The standard form encoding (x-www-form-urlencoded) converts spaces to
    plus and non-alphanumeric characters to ASCII hexadecimal numbers with leading
    percent signs. In this case, the exclamation point is converted to hexadecimal
    21.


    The POST method writes the variables to standard input, eliminating the risk of
    a buffer overflow in the Web server if the list of variables becomes very long.
    It also keeps the variables off the Web page URL. If a script reads the variables
    in a while loop, the final line is not executed in the while because the line
    does not end in a line feed.'
