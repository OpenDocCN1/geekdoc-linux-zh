  md: "# Chapter 13 Console Scripting\n\nA gauge is a thermometer bar showing the\
    \ percentage progress. New percentages are read one at a time from standard input\
    \ until the end of file is reached. The -gauge switch requires a text message,\
    \ the height, width, and an optional starting percentage (see Listing 13.2). The\
    \ percentages can be set to the gauge by a named pipe, discussed in Chapter 11,\"\
    Text File Basics\".\n\nSuppose you would like to show a thermometer graph showing\
    \ the progress of printing a series of invoice files stored in a directory called\
    \ invoices. The following demo displays the invoices as they are sent another\
