  md: '# Chapter 4 Script Basics


    In this example, the variable ARCHIVE_DAYS contains the number of days typed by
    the user.


    There are a number of options for read. First, -p (prompt) is a shorthand feature
    that combines printf and read statements. read displays a short message before
    waiting for the user to respond.


    ```

    read -p "Archive files for how many days? " ARCHIVE_DAYS

    ```


    The -r (raw input) option disables the backslash escaping of special characters.
    Normally, read understands escape sequences as \n when they are typed by the user.
    Using raw input, read treats the backspace as any other character typed on the
    keyboard. You need to use -r only when you need to handle the backslash character
    yourself.


    ```

    read -p "Enter a Microsoft Windows pathname (backslashes allowed): " -r MS_PATH

    ```


    The -e option works only interactively, not in shell scripts. It enables you to
    use Bash''s history features to select the line to return. For example, you can
    use the Up and Down Arrow to move between recently typed commands.


    A timeout can be set up using the -t (timeout) switch. If nothing is typed by
    the end of the timeout period, the shell continues with the next command and the
    value of the variable is unchanged. If the user starts typing after the timeout
    period, anything typed is lost. The timeout is measured in seconds.


    ```

    read -t 5 FILENAME # wait up to 5 seconds to read a filename

    ```


    If there is a variable called TIMEOUT, Bash times out after the number of seconds
    in the variable if -t is not used.

    A limit can be placed on the number of characters to read using the -n (number
    of characters) switch. If the maximum number of characters is reached, the shell
    continues with the next command without waiting for the Enter/Return key to be
    pressed.


    ```

    read -n 10 FILENAME # read no more than 10 characters

    ```


    If you don''t supply a variable, read puts the text into a variable named REPLY.
    Well-structured scripts should avoid this default behavior to make it clear to
    a script reader where the value of REPLY is coming from.


    Also read has some special purpose options that are discussed later in Chapter
    13, "Console Scripting." While reading from the keyboard, read normally returns
    a status code of 0.


    # Basic Redirection


    You can divert messages from commands to files or other commands. Bash refers
    to this as redirection. There are a large number of redirection operators.


    The > operator redirects the messages of a command to a file. The redirection
    operator is followed by the name of the file the messages should be written to.
    For example,'
