    +   - \0—octal value o (one to threeal digits)

    - \\\—Backslash

    - \a—Audible beep

    - \b—Backspace

    - \f—Form feed

    - \n—New line

    - \r—Return

    - \t—Horizontal tab

    - \v—Vertical tab


    You can perform more complicated file editing with the sed command, discussed
    next.'
