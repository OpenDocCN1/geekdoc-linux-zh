  md: '# The Linux Environment


    IN THE EARLY DAYS OF COMPUTERS, instructions and data were often divided into
    two separate storage areas. Modern computers follow what is called a "von Neumann
    architecture," a design proposed by the Hungarian-born computer scientist John
    von Neumann. These machines have one storage area for both data and instructions.
    Effectively, instructions and data were treated the same, making computer simpler
    to build and use.


    Unix-based operating systems, including Linux, extend this principle to long-term
    storage. Linux organizes information on a disk as a collection of files. Every
    file, whether a program or data, is treated the same, making the operating system
    very simple to build as well as flexible to use. Commands that work on a certain
    kind of file tend to have a similar effect on other kinds of files as well, reducing
    the number of commands a programmer needs to learn.


    This chapter presents an overview of the Linux operating system, how it is organized
    and its common conventions. If you are new to Linux, you are not expected to understand
    all the terms presented here. After this foundation, future chapters demonstrate
    these principles using practical examples.


    # The Origin of Linux


    The Linux system was created as a hobby by a young student, Linus Torvalds, at
    the University of Helsinki in Finland. Linux, interested in the Unix clone operating
    system Minix, wanted to create an expanded version of Minix with more capabilities.
    He began his work in 1991 when he released version 0.02 and invited programmers
    to participate in his project. Version 1.0 was released in 1994.


    Linux uses GNU General Public License (GPL) and its source code is freely available
    to everyone. Linux distributions, CD-ROMs with the Linux kernel and other software
    ready for installation, do not have to be free, but the Linux source code must
    remain available. Making source code available means as distributing open source.


    The word "Linux" is properly pronounced using a Swedish accent, making it difficult
    to say in North America. It is most often pronounced with a short "i" and with
    the first'
