    * /dev/fd0—The first floppy drive

    * /dev/hda1—The first IDE drive partition

    * /dev/sda1—The first SCSI drive partition


    The name tty, for historical reasons, is a short form of “teletypewriter,” a printer
    and keyboard connected to a computer by a cable.


    With this overview of the Linux philosophy, you are ready to begin using Linux
    through the Bash shell.'
