    # Verifying Files


    Files sent by FTP or wget can be further checked by computing a checksum. The
    Linux cksum command counts the number of bytes in a file and prints a cyclic check
    (CRC) checksum, which can be used to verify that the file arrived complete and
    intact. The command uses a POSIX-compliant algorithm.


    ```

    $ cksum orders.txt

    491404265 21799 orders.txt

    ```


    There is also Linux sum command that provides compatibility with older Unix systems,
    but be aware that cksum is incompatible with sum.'
