  md: '# Introduction


    Bash is the standard shell provided with most Linux distributions, including Red
    Hat, SuSE, Mandrake, Slackware, and UnitedLinux.


    # When Is a Program a Shell Script?


    A script is similar to a program but there is no formal definition for what constitutes
    a script. It is a type of simple program, and scripts share many features in common.
    Linux programmers with few special requirements never advance beyond writing scripts.


    As shells matured, they gained features that you might not expect to find in a
    program designed to schedule commands. Most shells, including Bash, can perform
    manipulation, string processing, and TCP/IP connections. They have typed variables,
    built-in commands, and user-defined functions. The distinction between shells
    and programming languages has blurred.


    In general, there are two key differences between shell scripts and more complex
    programs. First, shells are designed to handle simple tasks. They lack the rigid
    structure and semantic checking of a high-level language. Shell scripts can be
    written quickly because they assume the programmer knows what or she is doing,
    and for this is true. Second, shells always execute their scripts slowly. Although
    most shells perform some kind of pre-processing to speed up execution, they still
    interpret and carry out one line at a time. High-level languages are faster because
    they almost translate a program into machine language to gain the best performance.


    When tackling any programming problem, it''s essential to choose the right tool
    for the job. Developing large projects as shell scripts will mean your project
    will run slowly and be difficult to maintain. Developing scripts in a high-level
    language will lead to a longer and more costly development time.


    # The Necessity of Structured Shell Programming


    Shell remain a staple of the business world. With high development costs, it is
    not practical to develop everything in a high-level language. Many business processes
    are simply a matter of following a series of steps, after which the results are
    labeled and archived. This is the very type of activity scripts are made to handle.


    Over time, shells have collected new features, often by copying the capabilities
    of other shells. In his book, The Humane Interface, Apple Macintosh interface
    designer Jeff Raskin once spoke with a pilot regarding the design of the plane''s
    autopilot. The device was designed with five ways to enter coordinates. The reason
    for this design was to reduce training costs by emulating other autopilots. A
    pilot pointed out that the operator of the aircraft is responsible for knowing
