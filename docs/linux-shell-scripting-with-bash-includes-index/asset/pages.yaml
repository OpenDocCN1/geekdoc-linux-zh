  md: '# Chapter 13 Console Scripting


    Other switches include:


    +   - cursor--Shows or hides the input cursor

    - -repeat--Turns a console''s keyboard repeating on or off

    - -appcursorkey--Turns cursor key application mode on or off

    - -linewidth--Turns a console''s line wrapping on or off


    These can be turned on or off. For example, to hide the input cursor, type this

    $ setter -cursor off


    There are other attributes to control features like power saving and Tab usage.
    See the reference section at the end of this chapter for a complete list of switches.


    # tput


    You can use the setter command for any terminal display, but an attempt to use
    a feature specific to the console is ignored. Instead, there is an old command
    called tput (terminal put) that works the same as setter but works with all text-only
    displays.

    tput has one parameter; a screen attribute code based on the terminfo terminal
    database. These codes are different from the setter switches. You can find a complete
    list on the terminfo manual page (man 5 terminfo).


    ```

    $ tput cols # width of display

    80

    $ tput clear # the screen

    ```


    # select Menus


    The built-in select command creates simple menus. select is a special loop. The
    command is followed by a list of arguments and displays them as numbered options.
    When the user selects an item by typing that number, the argument is assigned
    to the select variable and the commands inside the select statement are executed.
    See Listing 13.1.


    Listing 13.1 select_demo.sh


    ```

    #!/bin/bash

    #

    # select_demo.sh: a simple select menu

    #

    shopt -s nounset


    declare ITEM

    declare -rx SCRIPT=$0##*/}


    printf "%s\n" "Select a document type:"

    ```'
