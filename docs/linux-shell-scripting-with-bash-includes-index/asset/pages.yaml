  md: '# Chapter 8 Debugging and Version Control


    The -o nounset option terminates with an error if unset (or nonexistent) variables
    are referenced. This option reports misspelled variable names. nounset does not
    guarantee that all spelling mistakes will be identified (see Listing 8.1).


    Listing 8.1 nounset.bash


    ```

    ```bash

    #!/bin/bash

    #

    # A simple script to list files


    shopt -o -s nounset


    declare -i TOTAL=0


    let TOTAL=$TOTAL+1      # not caught

    printf "%s\n" "$TOTAL"


    if [ $TOTAL -eq 0 ]; then # caught

    printf "TOTAL is %s\n" "$TOTAL"

    fi

    ```

    ```


    The -o xtrace option displays each command before it is executed. The command
    has all substitutions and expansions performed.


    ```

    ```bash

    declare -i TOTAL=0

    if [ $TOTAL -eq 0 ]; then

    printf "%s\n" "$TOTAL is zero"

    fi

    ```

    ```


    If this script fragment runs with the xtrace option, you should see something
    similar to the following results:


    +   + alias ''rm=-i''

    + alias ''cp=-i''

    + alias ''mv=-i''

    + ''['' -f /etc/bashrc ]''

    + . /etc/bashrc

    +++ id -gn

    +++ id -un

    +++ id -u

    ++ ''['' root = root -a 0 -gt 99 ]''

    ++ umask 022

    ++ ''['' '' '' ]

    + declare -i TOTAL=0

    + ''['' 0 -eq 0 ]''

    + printf "%s\n" ''0 is zero''

    is zero'
