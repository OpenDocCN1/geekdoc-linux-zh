  md: '# Compound Commands


    EXCEPT FOR THE SIMPLEST SCRIPTS, you seldom want to execute every command. It''s
    helpful to execute one set of commands instead of another, or repeat a set of
    commands several times. Compound commands are commands that enclose a group of
    other commands.


    For readability, the enclosed commands are indented to make it clear their execution
    depends on the compound command. I once had a supervisor complain that I indented
    my lines one space less than the standard he insisted on. (I had to put a ruler
    to the screen to see whether it was true.) I figured this was a minor problem
    because we went to another programmer and pointed out that his program crashed
    when a zero was typed.


    Compound commands always consist of two commands that bracket the commands inside.
    The ending command is usually the name of the first command spelled backwards.
    The mysterious semicolon command is actually the ending command for the compound
    command case.


    # Command Status Codes


    Every Linux command returns a status code (or exit status), which is a number
    between 0 and 255 that indicates what problems the command experienced. A status
    code of zero indicates that the last command ran successfully. Any other status
    code indicates some kind of error.


    The status code is contained in the variable $.


    ```

    $ unzip no_file.zip

    unzip: cannot find no_file.zip, no_file.zip.zip or no_file.zip.ZIP.

    $ printf "%d\n" "$?"

    9

    ```


    When unzip command doesn''t find a file to decompress, the status code returned
    is 9 (an error).'
