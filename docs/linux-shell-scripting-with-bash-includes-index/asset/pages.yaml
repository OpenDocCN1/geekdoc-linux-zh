  md: "# Tabs and Spaces\n\nThe Linux expand command converts Tab into spaces. The\
    \ default is eight spaces, although you can change this with -tabs=n (or -t n)\
    \ to n spaces. The -tabs switch can also use a comma-separated list of Tab stops.\n\
    \n```\n$ printf \"%a\\tTEST\\n\" > test.txt\n$ wc test.txt\n      1      2   \
    \   8 test.txt\n$ expand -i test.txt | wc\n      1      2      21\n```\n\nThe\
    \ -initial (or -i) switch converts leading Tabs on a line.\n\n```\n$ expand -initial\
    \ test.txt | wc\n      1      2      15\n```\n\nThe corresponding unexpand command\
    \ converts multiple spaces back into Tab characters. The default is eight spaces\
    \ to a Tab, but you can use the -tabs=n switch to change this. By default, only\
    \ initial tabs are converted. The -all (or -a) switch to consider all spaces on\
    \ a line.\n\nUse expand to remove tabs from a file before processing.\n\n# Temporary\
    \ Files\n\nTemporary files, that exist only for the duration of a script's execution,\
    \ are traditionally named using the $$ function. This function returns the process\
    \ ID of the current script. By including this number in the name of the temporary\
    \ files, it makes the name of the file unique for each run of the script.\n\n\
    ```\n$ TMP=\"/tmp/reports.\\$\\$\"\n$ printf \"%s\\n\" \"$TMP\"\n/tmp/reports.20629\n\
    $ touch \"$TMP\"\n```\n\nThe drawback to this traditional approach lies in the\
    \ fact that the name of a temporary is predictable. A hostile program can see\
    \ the process ID of your scripts when it runs and use that information to identify\
    \ temporary files your scripts are using. The temporary file could be deleted\
    \ or the data replaced in order to alter the behavior of your script.\n\nFor better\
    \ security, or to create multiple files with unique names, Linux has the mktemp\
    \ command. This command creates a temporary file and prints the name to standard\
    \ output so it can be stored in a variable. Each time mktemp creates a new file,\
    \ the file is given a unique name. The name is created from a filename template\
    \ the program supplies, which ends in the letter X six times. mktemp replaces\
    \ the six letters with a unique, random code to create a new filename."
