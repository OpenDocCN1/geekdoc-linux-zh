  md: '# Job Control and Signals


    ALTHOUGH I GREW UP ON A GRAPE FARM, I didn''t spend a lot of time out in the fields.
    I suppose that was like my father''s way of not biasing me towards a life of sweat
    and sunburns. Somehow farming skill that I never mastered was the use of hand
    signals. It seemed like those who had spent years outdoors were used to gesticulating
    distances and noise, able to understand the most incomprehensible motioning. Not
    so for me.


    One summer my father was trying to place a heavy piece of equipment into the back
    of a pickup truck using his tractor. He had stationed at the base of the truck
    to line up the equipment and tell him when to start lowering. When everything
    looked in position, I gave him the signal. Unfortunately, my glasses are thick
    enough that they cause spherical aberration—that is, things sometimes appeared
    crooked because the light passing through the lenses is bent. Almost at once I
    saw that the equipment wasn''t centered and I started hopping up and down, gesturing
    wildly. But my father didn''t notice anything was wrong until the equipment caved
    in the side of the truck with a sickening crunch.


    Whether it was my bad signaling or his failure to pay attention is the point.
    An important condition had risen that was unable to be communicated. Similarly,
    scripts need to be able to delegate responsibilities to other scripts and interrupt
    each each when matters arise. This cooperation is achieved through job control
    and Linux signal handling.


    # Job Control


    You can start background tasks by typing an ampersand (&) at the end of a command.
    Bash refers to background tasks as jobs. Any command or script running in the
    background is a job. During an interactive session, the shell keeps a list of
    all outstanding jobs. Managing background tasks using Bash commands is called
    job control.


    Job control is available by default at the command prompt but must be enabled
    in scripts with the -o monitor shell option. Without job control, background tasks
    can still be started from a script, but Bash''s job-management commands are unavailable.'
  merge: -1
  pgno: 178
- img_proc: true
  md: '# Chapter 10 Job Control and Signals


    The built-in jobs command lists active jobs. When a background task completes,
    the job is removed from the list.


    ```

    $ sleep 60 &

    [1]. 28875

    $ jobs

    [1]+ Running      60 &

    ```


    In interactive sessions, Bash automatically checks and reports any changes to
    the background-jobs before showing the command prompt. The job status is shown
    in the same format as the jobs. The set -b command changes in job status to be
    displayed immediately when they occur, even if it means interrupting the user
    while she types. In scripts running with job control, the status of background
    tasks is also checked and printed.


    The plus sign indicates the current running job, the one that moves into the foreground
    when the fg command is used. A minus sign indicates the last job started.


    Linux assigns all jobs a unique process identification number (PID). You can view
    it by using the -l (long) switch.


    ```

    $ jobs -1

    [1]+ 28875      sleep 60 &

    ```


    The number in square brackets is the position of the job in the shell''s job list.
    The PID for the job can be expanded into a command using a percent sign (%). To
    kill the first background task, use a %. The following example produces the same
    results as typing kill 28875.


    ```

    $ kill %1

    [1]+ Terminated      sleep 60

    ```


    Other job list percent codes include %% and %+ for the current background task,
    % for the last background task started, and %name for a job with the name name.
    You search the job names by using ?, which matches a job containing a particular
    substring.


    ```

    $ sleep 10 &\n[1] 13692

    $ kill %1

    $

    [1]+ Terminated      sleep 10

    ```


    The job control is not the same as variable substitution, (PID), although the
    jobs command -x (execute) switch makes it behave that way.


    ```

    $ printf "%d\n" %1

    bash: printf: %1: invalid number

    $ jobs -x printf "%d\n" %1

    6259

    ```'
  merge: -1
  pgno: 179
- img_proc: true
  md: 'In this case, the printf command (unlike kill) is not a job control command
    and has no knowledge of job numbers. The jobs -x command substitutes PID numbers
    for job numbers and then runs the printf command.


    The -p (PID) switch lists only the process identification number. The jobs displayed
    can be narrowed to three types: Jobs with status changes -n (new status)


    You can remove background tasks from Bash''s job list using the built-in disown
    command.


    ```

    $ sleep 10 &\n[1] 14611

    $ sleep 10 &\n[2] 14623

    $ sleep 10 &\n[3] 14628

    $ disown %2

    [1] Running sleep 10 &\n[3]+ Running sleep 10 &

    ```


    A disowned task continues to run even though it no longer appears in the shell''s
    job list, but job control commands will not accept the task. In this case, the
    second job continues to run, but %2 is no longer defined. When the second job
    is complete, Bash cannot notify the user because it is no longer monitoring the
    task. The disown command is useful when removing background tasks you are not
    interested in tracking, such as MP3 players, Web browsers, or other background
    applications on the X desktop.


    The -a (all) switch disowns all jobs just if the background tasks were started
    in a script without job control. The -r (running) switch disowns all running jobs.


    You can force a script to wait for one or more background tasks to complete using
    the built-in wait command. If no jobs are specified, wait suspends the script
    until all the background tasks are finished.


    ```

    $ sleep 5 &\n[1] 7338

    $ wait

    [1]+ Done sleep 5

    ```


    # Signals


    A signal is sometimes referred to as a software interrupt; it''s a request to
    break away from a program and perform an urgent task. When Bash receives the signal,
    it finishes the current command, identifies which signal was received, and takes
    the appropriate action. If it is able to continue the script afterwards, it does
    so, advancing to the next command.'
  merge: -1
  pgno: 180
- img_proc: true
  md: "Signals are sent to scripts with the built-in kill command. Despite its name\n\
    implyes, kill can do more than just terminate programs with its default SIGTERM\
    \ signal.\n\nSuppose a slow command is running in the background.\n\n```\n$ {\
    \ sleep 60; echo \"DONE\"; & \n[1] 7613\n```\n\nThe kill command can suspend the\
    \ command using the SIGSTOP signal.\n\n```\n$ kill -SIGSTOP 7613\n{ sleep 60;\
    \ echo \"DONE\"; }\n[1]+ Stopped\n```\n\nAfter the command is stopped, it remains\
    \ inactive until it receives another signal, such\nas SIGCONT.\n\n```\n$ kill\
    \ -SIGCONT 7613\n$ DONE\n[1]+ Done { sleep 60; echo \"DONE\"; }\n```\n\nThe SIGCONT\
    \ continues execution at the point of interruption.\nLinux defines 63 different\
    \ signals. The signals most commonly sent to scripts are\nTERM (immediately exit\
    \ the script), SIGSTOP (stop the script, putting it to sleep tem-\nporarily),\
    \ SIGHUP (hang up a connection), and SIGCONT (continue a stopped script). A\n\
    complete list appears in Appendix E, \"Signals.\"\n\nThe built-in suspend command\
    \ affects how signals are shared with background tasks.\nIf the -h (SIGHUP) switch\
    \ is used, Bash does not share SIGHUP with the background jobs\nof a particular\
    \ task when a SIGHUP is received (such as when a user logs out).\n\n# The suspend\
    \ Command\n\nThe built-in suspend command stops a script until a signal is received,\
    \ just as if the\nscript received a SIGSTOP signal. It is equivalent to using\
    \ the command kill -SIGSTOP\n$ for the script to stop itself. When in a script,\
    \ suspend requires job control\nto be enabled. Listing 10.1.\n\nListing 10.1 suspend_demo.sh\n\
    \n```\n#!/bin/bash\n#\n# suspend_demo.sh\n#\n# Wait for a SIGCONT signal and then\
    \ print a message\n\nopt -s -o nounset\nshopt -s -o monitor # enable job control\n\
    \nwait for SIGCONT\n```"
