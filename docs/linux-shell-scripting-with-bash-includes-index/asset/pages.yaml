  md: "Instead of running a second script, you can insert a second script into the\
    \ first. The built-in source command (often abbreviated with a period . ) copies\
    \ the second script into the first script as if the programmer had typed the lines.\
    \ Because the second script is treated as part of the first script, no declarations\
    \ in the second script are lost when the second script finishes execution. It\
    \ acts as if it were a single combined script. For example, consider the two scripts\
    \ shown in Listing 14.1.\n\n# Listing 14.1 source1.sh\n\n```\n#!/bin/bash\n# source1.sh:\
    \ including source fragments\n#\n# Source command example\nshopt -s o nounset\n\
    \ndeclare -x RX=$$(0##*/)\ndeclare -r source2=\"source2.sh\"\n\nif test ! -r \"\
    $source2\"; then\n  printf \"SCRIPT: the command $source2 is not available\\n\"\
    \ >&2\n  exit 1\nfi\n```\n\n```\nsource $source2\nprintf \"The variable YEAR is\
    \ %s\\n\" \"$YEAR\"\nexit 0\n```\n\n# source2.sh: this will be inserted into source1.sh\n\
    \n```\ndeclare -r YEAR=$(date '+%Y')\n```\n\nWhen the scripts run, the content\
    \ of source2.sh is inserted into the original script at the point of the source\
    \ command. When the variable YEAR is declared, it is effectively being declared\
    \ in the original script.\n\nThe variable YEAR exists at the point of the printf\
    \ command; there is no error. Notice that the sourced script is a fragment and\
    \ not a standalone script; it doesn't contain an exit command or a # line.\n\n\
    The source command can be used to define commonly declared items shared among\
    \ several scripts. This saves a programmer from having to type the same definitions\
    \ over and again into several different scripts. Placing the declared items in\
    \ a single place also makes scripts easier to maintain. See Listing 14.2."
  merge: -1
