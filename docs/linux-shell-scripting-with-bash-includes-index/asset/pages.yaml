  md: "# Shell Functions\n\nFunctions are a way of embedding small subscripts into\
    \ a Bash script without saving them in a separate file. Because they are embedded\
    \ in a script, they do not have to be loaded in order to be used. This, in turn,\
    \ makes them run faster than separate scripts. Like separate scripts, functions\
    \ can be used to break up a complex script into separate, named tasks to improve\
    \ readability.\n\nShell functions differ from functions in other programming languages\
    \ in that they return a status code instead of a return value. Without a return\
    \ value, they cannot be used in expressions.\n\nLike variables, functions must\
    \ be declared before they are used. Instead of the declare command, functions\
    \ are declared using the function command. Each function has a name and the statements\
    \ composing the function are enclosed in curly brackets. Listing 14.10\n\nListing\
    \ 14.10 function.sh\n\n```\n#!/bin/bash\n# function.sh - A simple function example\n\
    \ndeclare -rx SCRIPT=${0##*/}\ndeclare -rx TMP=\"tmp/temp.\\$\"\ndeclare -rx TRASH_DIR=\"\
    $HOME/trash\"\n\n# TRASH TMP\n#\n# Move the TMP file to the trash directory\n\n\
    function trash_tmp {\n\tif test -d \"$TRASH_DIR\"; then\n\tprintf \"%s\\n\" \"\
    $SCRIPT:$FUNCNAME:$LINENO: trash directory \\$TRASH_DIR is missing\" >&2\n\texit\
    \ 1\n\tfi\n\tif test -f \"$TMP\"; then\n\tmv $TMP \"$TRASH_DIR/\"\n\tfi\n}\nreadonly\
    \ -f trash_tmp\ndeclare -t trash_tmp\n\nprintf \"This is a function test\\n\"\
    \ > $TMP\ntrash_tmp\n\nexit 0\n```"
