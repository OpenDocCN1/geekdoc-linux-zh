    # Your Session Profile


    When you log into a computer and start a new Bash session, you might need to type
    several commands to customize your session. Perhaps you want to change the editing
    mode from emacs to create new key bindings, or change your command-prompt. Rather
    than typing these special commands, Bash will run these commands for each time
    you log on if they are saved in a profile. This file is called a profile file
    because it contains the commands to tailor the session to your requirements.


    The Bourne shell ran two profile files whenever a user logged on. First, a file
    named /etc/profile was the general profile executed for all users. If a file named
    .profile appeared in the user'' home directory, this contained additional commands
    for each user. Bash mimics this behavior when it is started as sh instead of bash.


    Bash extended the principle to run several profile files depending on the circumstances.
    In addition, Linux distributions often customize the general profile files to
    run additional commands stored in other scripts.


    Bash differentiates between a login session and other instances. Bash runs as
    a login shell when a program first logs in or when a login is simulated with Bash''s
    --login (-1) switch. A login shell is not necessarily one that presents a user
    with a prompt. It only indicates that Bash is the top program in the current session,
    and when Bash completes its run, the login session will be over.


    The login_shell option is turned on when you are in a login shell. This option
    can be used to verify that you are in a login shell.


    ```

    $ login_shell

    login_shell on

    ```


    Bash runs as an interactive shell when it is started without a script or when
    the -i switch is used. An interactive shell presents the user with a command prompt.
    An'
