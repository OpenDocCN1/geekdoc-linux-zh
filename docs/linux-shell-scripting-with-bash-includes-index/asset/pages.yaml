    -r (remove) command removes the defined completion.

    -o (option) switches various options. -o dirnames attempts to match directories
    if no other matches exist. -o filenames the word to be alerted (such as dropping
    a trailing slash) to help identify matches. -o default is the default, providing
    no special handling when a match fails. Newer versions of Bash support -o nospace,
    which prevents a space from being appended to the end of a completed word.

    The completion commands can be combined with functions to create powerful command-line
    utilities.


    # Locales


    Under Linux, the language and culture of a user is represented by his or her "locale".The
    locale information is stored in environment variables. Some of the standard ones
    are:


    +   - LC_TYPE—The character classes and case conversion

    - LC_COLLATE—The collating sequence for the character set

    - LC_NUMERIC—The radix character (character used to separate number from base)
    and thousands separator

    - LC_MONETARY—Like LC_NUMERIC, but for formatting money'
