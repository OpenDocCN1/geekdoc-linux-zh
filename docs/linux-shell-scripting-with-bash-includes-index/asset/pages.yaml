  md: '# Introduction


    Many shells, including Bash, have developed a mixture of features with specialized
    or arcane applications. Like the autopilot, it is not always clear how these features
    should be used nor which features are primarily for compatibility. Too often,
    poorly designed scripts are all-but ineligible to another programmer, or even
    to the same programmer a few months after a script was hastily assembled.


    This presents a problem for serious business scripts. The cost of developing a
    high-level language solution is high, but a disorganized script can be expensive
    to maintain over time. As the needs of the business change, the shell script is
    modified by successive generations of programmers, the problem escalates.


    As a rule of thumb, business programs never go away. At one place I worked, what
    started off as a simple shell script used to print reports evolved into a Web-based
    reporting system with personal customizations and secure access. The original
    program had no idea what this script would become.


    Because of the essential openness and complex syntax of Bash, to the benefit of
    any serious project to adapt some kind of standard. Bash is very forgiving, but
    the costs are not. For example, there are many ways to add 2 + 2 in Bash. Like
    the autopilot anecdote, it is not practical to expect the programmers who maintain
    the scripts to have deal with this level of redundancy.


    Likewise, shell word quoting is optional, sometimes required, depending on the
    context. A command that works with one form of quotation can suddenly stop working
    when different data appears in the quotes.


    Issues like shell word quoting, specialized capabilities, or portability features,
    when abused, lead to increased maintenance and long-term development costs.


    # Installing Bash


    Bash is the standard shell on most Linux distributions. However, there are other
    shells available and there is no requirement that Bash should be present on any
    particular distribution.


    Bash is open source software released under the GNU Public License (GPL). If you
    need to install Bash, the C language code is freely available from the Free Software
    Foundation at http://www.gnu.org or through one of its mirrors.


    The Bash installation procedure can vary over time. Complete instructions are
    found in the README file that accompanies the sources. However, the installation
    is largely automated. The Bash procedure is as follows:


    +   1. Run the configure program to determine your operating system and verify
    the features necessary to compile Bash.


    +   2. Run make to build Bash.


    +   3. Run make tests. This will run diagnostic tests to ensure Bash was built
    properly.


    +   4. Run make install to install Bash under the /usr/local/ subdirectory.'
  merge: -1
  pgno: 25
- img_proc: true
  md: 'Assuming your PATH variable is set correctly, you can start Bash by typing
    bash at the shell prompt.


    If you do not have superuser privileges on your computer, you can still compile
    and install Bash under your personal account. Use the -prefix option with configure
    to specify the directory to install Bash. For example, -prefix=$HOME or prefix=$HOME/bash
    might be good choices.


    # # Bash and Other Scripting Tools


    Ksh, Perl, and Python are similar, but not identical, to Bash.


    The Korn shell (ksh) is an enhanced version of the Bourne shell. A public version
    exists called pdksh Korn shell is a popular shell on many commercial Unix systems.
    Most, but not all, of the Korn shell''s features work under Bash. Both shells
    can do bitwise arithmetic; for example. Some features have different names. The
    Korn shell built-in print command is a rough equivalent to the Bash printf command,
    and whence command is equivalent to the type command. A complete list of differences
    and porting issues is available in the Bash FAQ http://www.faqs.org/faqs/unix-faq/shell/bash.


    Perl (Practical Extraction and Report Language) is, as its name suggests, a scripting
    language for generating reports. It combines the features of a shell language,
    the sed command, and the awk command to create a single tool. It is not a shell
    and Perl scripts are not compatible with Bash.


    Python (named after the "Monty Python" comedy troupe) is an interpreted language
    designed for small projects needing rapid development. It is not a shell, but
    like Bash, it contains many features designed for interactive sessions. Python
    scripts are not compatible with Bash.'
