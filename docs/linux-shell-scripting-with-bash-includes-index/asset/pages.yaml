  md: '# A Complete Example


    PEEK IS A FUN AND USEFUL EXAMPLE OF WHAT SHELL scripts can do. A resource monitoring
    and troubleshoot script, peek sleeps for 20 or 30 seconds. Upon waking, it checks
    (or “peeks at”) system statistics using commands such as free and vmstat, and
    draws graphs representing the computer activity. Across the top of the display
    is the time of the last update, and the actual CPU and memory usage. Below the
    graphs, warnings about potential problems or bottlenecks.


    Because the format of commands such as vmstat changes over time, the script might
    have to be modified for certain distributions. This version was designed for Red
    Hat 7.3. Figure A.1 shows peek in action.


    ![](img/4c72e572dd594bb8169f8df7353433ba_358_0.png)


    Figure A.1 peek.sh.'
