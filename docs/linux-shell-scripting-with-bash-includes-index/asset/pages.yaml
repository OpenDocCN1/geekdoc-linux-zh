  md: 'This might seem like a lot of work, but for scripts with many complex switches,
    getopt makes the job of handling them much easier.


    There are also a number of special switches. The --alternative (or -a) switch
    allows long options with only a single leading minus sign. Using this switch violates
    Linux convention. --output (or -q) can be used to check the switches without returning
    the list to standard output. --quiet (or -q) indicates any errors by returning
    the status code but hides the error messages so you can create your own custom
    messages. The --shell (or -u) switch uses quotation to protect special characters
    spaces that might be treated in a special way by a shell. (This is necessary only
    in C compatibility.).


    # Subshells


    Chapter 7. "Compound Commands," mentioned that a set of commands can be grouped
    together using curly braces. These commands act as a group and return a single
    status code.


    ```

    $ sleep 5 ; printf "%s\n" "Slept for 5 seconds" ; ;

    Slept for 5 seconds

    ```


    A subshell is a set of commands grouped using round parentheses instead of curly
    braces. Unlike a command group, if a subshell appears on a single line, a semicolon
    is required after the last command.


    ```

    $ sleep 5 ; printf "%s\n" "Slept for 5 seconds"

    Slept for 5 seconds

    ```


    Subshells act like a hybrid of curly braces command set and a separate script.
    Like a statement group, a subshell is a set of statements that returns a single
    status code. Like a separate script, a subshell has its own environment variables.


    ```

    $ declare -ix COUNT=15

    { COUNT=10 ; printf "%d\n" "$COUNT"; ; }

    10

    ```


    ```

    $ printf "%d\n" "$COUNT"

    10

    ```


    ```

    $ COUNT=20 ; printf "%d\n" "$COUNT"

    20

    ```


    ```

    $ printf "%d\n" "$COUNT"

    10

    ```


    In this example, a command group can change the value of the variable COUNT in
    the shell session because the group runs as part of the session. The subshell
    cannot change the value of COUNT in the main program because it runs as if it
    were a separate script. COUNT is a copy of the variable from the session and the
    subshell can only change its private copy of COUNT.'
  merge: -1
