  md: '# # Introduction

    COSC 101


    Most senior students who supervised introductory computer science labs at Brock
    University back when I was kicked their feet up on the front desk with a calculus
    book cracked open and growled when their homework was interrupted by a question.
    As anyone will tell you, I never fit the mode of the typical student. In my first
    lab, I put together a short booklet covering all the questions I had when I took
    my first lab in COSC 101; namely what was that funny prompt drawn in flickering
    green the ailing terminals and how the heck can you use it to give yourself a
    cool nickname VAX Dude in the DEC VMS process?


    I inadvertently left a pile of my booklets behind and the next day one of the
    other supervisors stormed up to me and angrily waved in my face. Her class wanted
    to know why she hadn''t covered any of the material in the booklet. Doing an introductory
    lesson in shell of the first lab would have cut into her homework time, and make
    better sure it did not happen again. It didn''t, and my lab students gained about
    a three-week advantage over the others in the fact they didn''t have to learn
    the development environment piecemeal between assignments.


    Many books, and many teachers, try to separate computer languages from the environment
    where they run. That''s like about cooking an egg indicating whether the egg will
    be cooked in a microwave oven, fried in a frying pan, or boiled in a pot of water.
    The environment affects what you can do and how you can do it. It is also true
    with shells.


    So''t let a disgruntled supervisor prevent you from getting your feet grounded
    in the fundamentals. Like my first-year lab booklet, this chapter provides background
    information on where the Bourne Again Shell came from and why it was developed.
    Shell programming has its own unique mindset and a quick review is never a waste
    of time.


