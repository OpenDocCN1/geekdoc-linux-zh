    # Standard Output, Error, and Input


    Linux assumes that all output goes to some kind of file. To Linux, the screen
    is a file called /dev/tty.


    ```

    printf "Sales are up" > /dev/tty # display on the screen

    ```


    When messages are redirected in your program, the messages don''t go directly
    to the screen. Instead, the output goes through a special file called standard
    output. By default, standard output represents the screen. Everything sent through
    standard output is redirected to the screen. Bash uses the symbol &1 to refer
    to standard output, and you can explicitly redirect messages to it.


    ```

    printf "Sales are up" > results.txt # sent to a file on disk

    printf "Sales are up" > /dev/tty # sent explicitly to the screen

    printf "Sales are up" # sent to screen via standard output

    printf "Sales are up" >&1 # same as the last one

    printf "Sales are up" > /dev/stdout # same as the last one

    ```


    /dev/stdout is another name for the standard output file. The last three examples
    are identical. Make sure &1 is directly beside the redirect symbol, with no intervening
    spaces.


    Standard output does not have to refer to the screen. For example, consider the
    following script called listorders.sh:


    ```

    #!/bin/bash


    # This script shows a long listing of the contents of the orders directory.

    shopt -s -o nounset


    ls -l incoming/orders

    exit 0

    ```


    Suppose you run this script listorders.sh > listing.txt


    Inside the script, standard output no longer refers to the screen. Instead, standard
    output refers to the file you''ve redirected to, in this case listorders.txt.


    ```

    ls -l incoming/orders # listing saved in listing.txt

    ls -l incoming/orders 1>&&1 # listing saved in listing.txt

    ls -l incoming/orders > /dev/tty # listing displayed on screen

    ```'
