    This is not exactly the same as


    ```

    test -f "$TMP" && ! -w "$TMP"; then

    printf "$SCRIPT:$LINENO: the temp file $TMP exists and cannot\nbe overwritten
    - aborting" >2

    exit 192

    fi

    ```


    The version using && executes the test command twice and can run slower than the
    version using the -a switch, so the -a switch is preferred over && in an if expression.


    Parentheses can also be used as long as they are escaped with backslashes. Parentheses
    have special meaning to the shell. In certain cases, they are required.


    One situation that tends to confuse programmers is mixing the operator with -a
    or -o switch. In computer languages, not takes precedence as a unary operator
    and executes first. In Bash, -a and -o take precedence over the not operator,
    causing the following test to be false:


    ```

    test ! -f "$TMP" -o -f "$TMP"; then

    ```


    Bash interprets this command as "if the file neither exists nor exists." This
    odd behavior is in accordance with the POSIX standard. To get the expected result,
