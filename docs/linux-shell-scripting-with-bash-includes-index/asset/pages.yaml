  md: "When using system to run a script, two shell sessions are created; for one\
    \ system and another to run the script (unless the script is started with exec).\
    \ To run scripts instead of shell commands, the C popen function is a less cumbersome\
    \ method. popen runs a program and attaches a pipe to or from the program, as\
    \ the shell pipe operator | was used. The command has two parameters: the program\
    \ to run and its arguments, and an if the C program reads the standard output\
    \ of the script, or if a pipe writes to the standard input of the script. When\
    \ the program is finished, close the pipe with pclose.\n\nIn the case of shell\
    \ scripts, the popen runs is Bash. You can rewrite the c_system.c using popen,\
    \ as shown in Listing 18.2\n\n# Listing 18.2 /bin/popen.c\n\n```\n* c popen.c:\
    \ run a Bash command from C using popen */\n\n#include <stdio.h>\n#include <stdlib.h>\n\
    \nint main() {\n\n    FILE *f = NULL; /* the pipe file */\n    char s[ 255 ] =\
    \ \"\"; /* a string buffer */\n\n    f = popen(\"/bin/bash -c 'ls -1 *.txt\",\
    \ \"r\"); /* open the pipe */\n    while ( feof( f ) ) { /* while more output\
    \ */\n        fgets(s, 255, f); /* get the next line */\n        printf(\"%s\"\
    , s); /* print the results */\n    }\n    pclose( f ); /* close the pipe */\n\n\
    \    return 0; /* successful status */\n\n\n```\n\nThe results are the same.\n\
    \n$ ./c popen\ncompany.txt\nlog.txt\norders.txt\ntemp.txt\ntemp.txt\n\nIf C variables\
    \ are to be shared with a Bash script, they must be exported to the shell's environment.\
    \ The C putenv function declares or changes an environment variable. The declaration\
    \ should be in the same form as a Bash variable assignment. Because putenv increases\
    \ the size of the environment, there is a chance it might fail. The command returns\
    \ a zero if the assignment was successfully carried out."
  merge: -1
