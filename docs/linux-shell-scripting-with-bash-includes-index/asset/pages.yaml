    # Logical Expressions


    In let, true is represented by the value of 1, and false by 0. Any value other
    than 1 or 0 is treated as true, but the logical operators themselves only return
    1 or 0.


    Remember that logical truth (a greater than zero) is not the same as the success
    of a command (a status code zero). In this respect, test and let are opposites
    of each other.

    To use logical negation at the prompt, you must disable the shell history option
    or Bash will interpret the ! as a history look-up request.


    ```

    $ let "RESULT=10"

