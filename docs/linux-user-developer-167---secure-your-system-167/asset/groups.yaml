    欢迎阅读 Linux User & Developer 最新杂志，这是英国和欧洲最喜爱的 Linux 和开源杂志。你对如何设置陷阱了解吗？事实确实如此，特别是在安全方面。设置得好固然不错，但为了获得最大的安全性，你需要像黑客一样去保护系统和网络。不要把硬币储放在可能被勒索软件丢失的数据中；学习哪些数据是重要的，并将其埋藏在触不到的地方。树莓派看起来像是在度假。但请假设你正处于防御状态：运行漏洞扫描器，准备好数据包嗅探器，进行渗透测试，尝试破解自己的安全防护。如果你成功了，说明你的方法错了。这方面没有完美的解决方案，但本期提供了一些极佳的建议。书中充满了各种操作指南，通过使用
    Kali 和一套工具，将帮助你检查系统是否安全。记住，每一期杂志也是一种黑客工具，所以要明智且良好地使用。你也可以在我们关于如何使用 Pi 进行渗透测试的完整指南中找到相关内容。祝安全……

    April Mullen，编辑


    April Mullen

