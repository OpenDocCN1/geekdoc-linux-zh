    # Feature Security Toolkit


    ## Scan your ports nmap and monitor


    Nmap is a widely-used open source tool that supports more than 15 scanning techniques.


    It can be used by network administrators as well as security auditors. In addition
    to securing your network, it can be used for hacking, de-masking, and to be the
    world''s leading port scanner and security tool.


    Nmap as an online port scanner is able to scan your perimeter devices and servers
    from an external perspective, outside yourself. It can discover what services
    a host is running, to fingerprint the operating system and applications on a host,
    or to provide a quick inventory of a local network. In short, it''s a very good
    tool to know.


