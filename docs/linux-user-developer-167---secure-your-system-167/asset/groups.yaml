    ## 03 Uninstall nmap and dependencies


    The following command can be used to remove the nmap package and any other dependent
    packages that are longer required:


    ```

    sudo apt-get remove --auto-remove nmap

    ```


    ## 05 Scan multiple hosts


    It is relatively easy to install nmap on your Linux box:


    You can scan multiple hosts at a time, if you are using IP addresses, we can specify
    a range - like to-x-y - or if you have multiple hosts, we can scan them by the
    command line separated by spaces


    ```

    sudo apt-get install nmap

    ```


    ## 01 Uninstall nmap


    ```

    sudo nmap -H host host2.com

    ```


    ## 04 Scan host''s OS


    Removing or uninstalling nmap is a good idea if you are changing methods. If you
    decide not to use nmap anymore and you care about the few megabytes of disk space
    it consumes, then remove nmap:


    The basic use of nmap is to scan any host and see what operating system it is
    running


    ```

    sudo apt-get remove nmap

    ```


    ## 06 Check open ports


    Another use of nmap is to discover the open ports on a network. If you run nmap
    with no options, it will scan for open ports and display the list of open ports
    as well as services running on those open ports:


    ```

    sudo nmap -O localhost

    ```


    nmap requires privileges to run this type of scan. Also, as it can be seen from
    its output, nmap provides a list of data. You can use the output to learn more
    about the operating system it''s liking:


    ## 07 Verbose option


    If you need to capture more, then the verbose option comes in handy. This can
    be done using the -v or --vv nmap. With these options, nmap provides more information
    about the various steps that are involved in nmap execution.


    - sudo nmap -vv localhost


    ## 08 What services are running on a host?


    To see what services are running on a host, you can use the -sV nmap. With this
    option, nmap will do a more aggressive scan and find out what versions of services
    are running on a specific host


    - sudo nmap -sV localhost


    ## 09 Nmap GUI


    Zenmap is the nmap GUI. This is free and open source application that makes nmap
    easy to use. It also provides advanced features for experienced nmap users. The
    following commands can be used to install and run zenmap:


    - sudo apt get install zenmap

    - sudo zenmap


    You can use this GUI if you need to check out any scanning-related activities.


    # Encrypt and monitor network traffic


    ## OpenWrt


    OpenWrt is a distribution for your router. It basically includes a package manager,
    and with the help of this packet you can install packages from a software repository.


    There are lot of ways that you can use OpenWrt, but one of the most useful is
    for locking down network security.


    You can use the SSH Server for SSH Tunnelling OpenWrt includes an SSH server and
    with this, you can access your terminal.


    > SSH tunnelling can be used to forward traffic over an encrypted connection


    ![](img/5f89d575ba10642195ede1686f72dbb1_26_0.png)


    if this SSH server is exposed to the internet, then you can access it remotely
    and SSH tunneling to forward the traffic over an encrypted connection.


    If you use a VPN - since SSH tunneling works in a similar way to VPN, you will
    also be able to set up a proxy on OpenWrt router. You can also run server software
    as mentioned earlier, OpenWrt''s software repositories contain this and this allows
    it to work as a web server.


    Most importantly, you can analyse network traffic - use tcpdump to see the packets
    traffic and this traffic can be analysed using a tool like Wireshark. If you decide
    to install OpenWrt, then basically you are replacing your router''s built-in firmware
    with the OpenWrt Linux system.


