    ```


    ## 10 bridge 命令


    `bridge` 命令允许你更改和桥接地址以及设备。桥可以用于以太网接口之间的关联。

    如果你想进行更改，需要 root 权限来执行 `bridge` 命令。


    ## 08 使用 AWK 命令处理


    下一个命令显示 Linux 机器的默认网关：


