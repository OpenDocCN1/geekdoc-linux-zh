    # Tutorial NAS


    # # Build your own Linux-powered network-attached storage


    ![](img/5f89d575ba10642195ede1686f72dbb1_35_0.png)


    # ## With its server roots, Linux is the perfect operating system for your own
    NAS


    In this tutorial, we are going to work through everything from choosing the right
    hardware for your NAS, installing your Linux distribution and connecting your
    NAS and non-clients. Linux is incredibly versatile - it runs on a wide range of
    hardware and has a huge number of different ways of what you are trying to achieve.
    We will also talk about what is important when setting up Linux, it can perform
    a whole host of tasks.


    Before we start, have a think about any hardware you have lying around and what
    your budget is. It is important to consider the data you are going to store. This
    will help you plan how you are going to proceed after reading our tutorial.


    As well as using the larger distributors such as Ubuntu, we are going to look
    at dedicated platforms for NAS devices, which might have a smaller footprint and
    more finely tuned to the task at hand. We also going to make sure that you''re
    not tied to one specific solution by a widely adopted file system so you''ll be
    able to switch between NAS operating systems without losing your data.


    # ## 01 Hardware


    The first step in planning your new NAS is to decide what hardware you are going
    to run it on. Now, with Linux, this means it''s going to run on pretty much anything.
    Although NAS isn''t a particularly intensive task. With that said, there are elements
    to take into account when it comes to connect to your network at a decent speed.
    This means a high-speed wireless card (if there''s no better option) or a Ethernet
    connection to your router or routers. We have a 1200Mbps setup looking up our
    NAS and it''s wonderful.


    ![](img/5f89d575ba10642195ede1686f72dbb1_35_1.png)


    Connectivity, the second most important thing is how you are going to accommodate
    your storage devices. Sure, you might have an ancient laptop kicking around the
    cupboard, but can it take all the things you want to put in it?


    ![](img/5f89d575ba10642195ede1686f72dbb1_35_2.png)


