    \n```bash\n$ ip route show\n```\n\nYou can change the default route of your Linux\
    \ machine as:\n\n```bash\n$ ip route default via 192.168.x.y\n```\n\nPlease use\
    \ the following command with extra care because a wrongly defined route – also\
