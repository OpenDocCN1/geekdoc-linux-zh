    Welcome to the latest issue of Linux User & Developer, the UK and Europe''s Favourite
    Linux and open source magazine. You know old about setting up a catch? It''s true,
    especially when it comes to security. It''s very well setting up, but for maximum
    security you need to protect systems and networks like a hacker. Don''t store
    coins in your data gets lost by ransomware; learn what data is important and bury
    it out of reach. The Pit will look like holiday. Please assume that you are guarded:
    get a vulnerability scanner running, have a packet sniffer, pen-testing, try to
    break your own security. If you succeed, you''re doing it wrong. There''s no perfect
    solution there, but this issue comes some great advice. Packed with how-to guides,
    using Kali and a set of tools, it''ll help you check if it is secure. Remember,
    every issue is also a hacking tool, so use them wisely and well. You can find
    out in our complete guide on how to use your Pi for pen-testing too. Stay safe
    there...

    April Mullen, Editor


