    # Linus addressed the RC1 kernel earlier in the day than his custom of late Sunday
    afternoon time


    Contemporary Linux systems have governors with names such as ''ondemand'', ''performance'',
    and ''powersave'' that are fairly coarse hammers used to switch CPU frequency
    once certain system load metrics have been reached. You''ve perhaps used a tool
    like ''powtop'' to perform better on your laptop and followed its advice to switch
    CPU governor. The existing governors don''t do, however, to specifically calibrated
    in the underlying Linux process scheduler determining the CPU frequency that is
    warranted upon a running program. It might be that a system can save significant
    battery life by waking the processors to do some work when done, then throttle.


    Existing governors look at certain system metrics based on a larger window of
    time when determining during which CPU frequency is allocated of individual programs.
    In large parts of this the frequency was much lower than the traditional ones
    (period of time to react to frequency requests) being higher so as to reduce contention
    impact. The true of contemporary systems, which may have many domains of possibilities
    that can be adopted with only a minimal amount of delay.


    The newly introduced ''schedutil'' CPU performance governor interacts directly
    with the Linux CFS (Completely Fair Scheduler) to determine during each scheduler
    window whether or not a task needs an ack, in order to request any change in frequency
    of the CPU to respond to these needs


    immediately, it makes a frequency selection for the next period of time using
    a simple formula based on current frequency, and the ratio of utilisation to maximum
    possible frequency. If the underlying CPU frequency is oscillating, the system
    makes these adjustments even when hardware not supporting fast switching between
    orders will adjust frequency often. It is interesting to see how this new governor
    works in practice.


    # Announcements


    John announced version 1.0 of the ''rt-tests''. This is a set of utilities designed
    to aid in verification of the performance characteristics of the Realtime Kernel
    (preempt-rt or just ''real time'') patches. Linux kernels are used by stock trading
    companies, audio-video vendors, and by others with requirements around maximum
