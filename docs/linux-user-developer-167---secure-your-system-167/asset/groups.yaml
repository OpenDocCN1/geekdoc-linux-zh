    采用模块化架构，支持多个服务器进行扫描以及允许管理员控制的远程客户端。您可以从网络中的任何点部署 Nessus 扫描器，并从单个客户端进行控制。通过这种方式，您能够从多个视角扫描分段网络，而对大型网络的扫描需要多个扫描器同时运行。在运行实际漏洞扫描时，Nessus
    为您提供了很多选择。您可以扫描单台计算机、IP 地址范围或子网段。您可以在 Nessus 中运行它并使用它来测试单个或一组网络。您可以识别出允许外部黑客访问敏感信息的漏洞，检查网络中的系统是否安装了最新的软件软件包，并设置配置审核。


    ![](img/5f89d575ba10642195ede1686f72dbb1_22_0.png)


    ## 安全工具包 (Security Toolkit)


    ### 搜索预定义模式

    这些模式被定义为 Snort 规则。Snort 可以以多种输出格式报告其发现。其中一些格式包括 syslog、tcpdump、数据库、alert 和统一格式。统一输出被认为是最佳方法，因此被广泛使用。


    ![](img/5f89d575ba10642195ede1686f72dbb1_23_0.png)


    ### 命令行选项

    Snort 带有各种命令行选项。某些选项可以在配置文件中指定，而不是在命令行中。通用规则是，如果您只是在尝试某些东西，请在命令行指定设置；如果您计划长期保留该设置，则在配置文件中进行设置。


    ## 使用 Snort 检测入侵者


    ### 实时监控流量

    Snort 仔细检查每个数据包以查看是否存在任何负载。它还可以用于执行协议分析、内容搜索和匹配。它被用于检测 Linux、Unix 以及所有 BSD 操作系统上的各种攻击，如端口扫描和缓冲区溢出。它不需要您重新编译内核或修改任何现有发行版，但它要求您拥有
    root 权限。


    > Snort 示例针对一组规则对网络流量进行检测


    Snort 设计用于最经典意义的网络入侵检测系统（IDS）。它所做的只是将网络流量与一组规则进行比较，允许系统管理员监控可疑活动以便您可以采取适当的。您可以配置
    Snort 三种不同的模式：嗅探模式（sniffer mode）、日志模式（logger mode）和网络入侵检测模式。在嗅探模式下，Snort 将读取数据包并显示在控制台上。在日志模式下，Snort
    将协议信息记录到磁盘中。在网络入侵检测模式下，Snort 将监控网络流量并根据用户定义的规则进行分析。Snort 将能够根据结果采取特定操作。它内置了实时告警能力。网络入侵检测系统被放置在网络中的特定点。


    '
