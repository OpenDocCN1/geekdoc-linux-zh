    # Open Source on the disc


    # On your free DVD this issue


    # Find out what''s on your free disc


    **Welcome to the Linux User & Developer DVD.** This issue helps you lock down
    your system and network with the best tools a sysadmin can have. From vulnerability
    scanning to packet sniffing, this complete toolkit has everything you need to
    protect your data and test your security. Take control of your system and banish
    risks for good!


    ![](img/5f89d575ba10642195ede1686f72dbb1_5_0.png)


    # Load DVD


    To access software and tutorials, simply insert the disc into your computer and
    double-click the icon.


    # Live boot


    To live-boot the distros supplied on this disc, insert the disc into your drive
    and reboot your computer.


    # Featured software:


    - Please note:

    - You need to ensure that your computer is set up to boot from media; check your
    computer''s BIOS screen to change Boot Options.

    - Some computers require you to press a key when booting from disc; check your
    manual or our website to find out if this is the case.

    - Live-booting distros run from the disc; they will not be installed on your computer
    unless you choose to.


    ![](img/5f89d575ba10642195ede1686f72dbb1_5_1.png)


    # Kali Linux


    This security testing distro for Linux users will help you to map your system
    and network vulnerabilities. This distro boots from the disc or can be installed
    onto your system.


