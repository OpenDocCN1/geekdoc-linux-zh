    ## 功耗


    设置 NAS 时需要注意的一点是功耗。这是在选择硬件时需要考虑的因素。除非你确实需要强大的性能，否则并不一定要采用低功耗 24/7 NAS。你可以配置网络唤醒（Wake
    On LAN）或使用 `rtcwake` 等工具来定时运行。


    ![](img/5f89d575ba10642195ede1686f72dbb1_36_0.png)


    ![](img/5f89d575ba10642195ede1686f72dbb1_36_1.png)


    RAID 1 是 NAS 的良好选择，它可以创建一个镜像，如果你有两个完全相同的磁盘，这非常完美。RAID 5 是另一个热门选择，它至少需要三块磁盘，并在所有磁盘上进行带校验信息的条带化。这不仅提供了极的性能，还能在驱动器故障时提供恢复能力。


    在硬件中实现 RAID 时——对于家用 NAS，可以实现软件 RAID，这对于所有最苛刻的应用来说都足够。


    ## 04 安装专用平台


    如果你想将机器专门运行 Linux 发行版，那么基于 FreeBSD 的流行软件 FreeNAS 是一个很好的选择。FreeNAS 易于安装并运行在几乎任何硬件上——无论是家庭还是企业环境。


    FreeNAS 包含了 ZFS 文件系统并且文档齐全。它还包含完整的 Web 界面、广泛的存储协议、用于管理更改的“快照”以及用于镜像服务器内容的高级复制功能。


    FreeNAS 以 ISO 格式分发。你可以使用 `ubootany` 轻松将其拷贝到 USB 盘中，你会发现它对于安装新操作系统或在 VirtualBox
    或 VMware 等虚拟机软件中进行预演非常有用。这样，你可以在迁移到实际服务器之前轻松地体验。


    ![](img/5f89d575ba10642195ede1686f72dbb1_36_2.png)


    这很大程度上取决于你想如何使用你的 NAS。它是一个纯粹的存储盒，还是用于其他用途？


    ## 02 专用 NAS 还是多用途？


    如果你曾认为某台计算硬件在你手里落灰了十年，那么很有可能由于 Linux 的多功能性，它可以不仅仅是一个 NAS。它是一个用于网络存储的基础媒体服务器，也可以用于其他功能。


    我们发现，得益于 ZoneMiner（一个实用的 Web 服务器），NAS 具备了服务器安全能力，可以在不暴露网络的情况下测试软件，即使你还在为全家人运行一个内部的
    Minecraft 服务器。你可以通过软件的选择，以及硬件的选择来实现你的最终目标。


    ## 03 使用 RAID 还是不使用 RAID？


    你可能只是把 NAS 当作存放其他机器没有空间存放文件的“垃圾倒场”，或者它是为了存储来自主机器的那些重要照片。


    如果你的机器里有空间，你应该考虑实现 RAID。使用 RAID 0 使用两块或更多磁盘创建条带，给你提供一个大容量、高性能的空间，但没有容错能力。


    > 如果你的硬件有空间，请考虑实现 RAID


    ## 教程


    ## NAS


    ### HP Microserver

    HP Microserver 是家庭用户中非常受欢迎的机器，这套廉价的小型设备放在任何家庭办公室中都不会突兀。它有四个驱动器接口和一个用于内存棒条的内部 USB
    接口，这使得 HP 流行的企业级管理工具通常只需 150 英镑左右即可获得。


    NAS 驱动的另一种流行文件系统是 BTRFS。同样，它重点关注容错性，非常适合 NAS 设置，BTRFS 拥有许多功能，包括处理海量存储大小、快照、压缩、RAID、内置增量备份等。


    ![](img/5f89d575ba10642195ede1686f72dbb1_37_0.png)


    通常这些高级文件系统最好列在专用的 NAS 驱动上。发行版本身从运行 EXT4 的廉价磁盘、SSD 甚至 USB 盘启动，这会让 NAS 驱动运行得更快。


    基于文本的安装程序引导你完成快速安装，最终使用你的浏览器创建 Web UI 完成设置。


    ## 05 设置 Ubuntu


    有很多 NAS 发行版，例如 FreeNAS、OpenMediaVault（基于 Debian）或类似的，它们运行良好。Ubuntu 不像其他那样轻量，但它非常灵活，并且该平台有大量的对对支持。取决于你打算如何使用它，如果你运行无头模式（headless），安装服务器版本而不是桌面版本可能更值得。


    ## 07 启用网络协议


    一旦你的系统运行起来并格式化了驱动器（用于 RAID 等）


    > 从外部世界安全地访问你的 NAS 实际上非常简单


    请注意，如果你需要免费的发行版，你将获得像 FreeNAS 等解决方案提供的免费 NAS 界面优势——你将从命令行管理服务器的功能。


    （注：提供的 OCR 文本包含大量重复/乱码片段。我已合并了连贯的部分。）

    '
