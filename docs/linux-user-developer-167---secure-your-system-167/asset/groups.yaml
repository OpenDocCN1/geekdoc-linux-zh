    ## 02 Is your WPS password cracked?


    Get started collecting information about your Pi''s card with iwconfig. The default
    interface is wlan0, and we need to switch to:


    ```bash

    airmon-ng start wlan0

    ```


    This will output the monitor interface name, usually wlan0. It is now time to
    find the BSSID of your router, so:


    ```bash

    airoddump-ng wlan0

    ```


    If this doesn''t work, try airodump-ng mon to identify the BSSID (which is a MAC
    address) that you''re looking for, and make a note. Now you can start reaver to
    crack the password with it, changing BSSID to include the BSSID you noted earlier.


    ```bash

    reaver -i mon -b [BSSID] -vv

    ```


    The strength of your password will determine how long it takes:


    ## 05 Airplay, tcpdump


    With Wireshark you might have seen in Kali Linux or use it afterwards to identify
    one of the other features you found, to give it a try.


    The problem is Wireshark is a configuration issue on the router. For instance,
    it seems correctly configured for performance, so you need a load of alternatives.
    Alternatively, you might need something that doesn''t need a load of configuration
    before, and such a tool like tcpdump is. Like Wireshark, tcpdump is used for network
    topology and to help you capture commands, you should use to view traffic through
    the Ethernet port:


    ```bash

    tcpdump -i interface

    ```


    ## 06 Where is your data?


    Given the problems with the use of firewalls in routers and remote computers is
    that making them more secure, and to get more control over the data that is coming
    in. To find out, we can use traceroute (which has various options, you can use
    with -h switch). If suspected data was being removed from your router, and had
    an address for the attacker, traceroute shows where the data was used.


    ```bash

    traceroute [HOSTNAME]

    ```

    where the hostname is a URL or IP address.


    ## 07 Detect your smell


    To establish whether your online activity is secure or not, you need a sniffer
    tool that is capable of picking up any data that might be attracted to attackers.
    A good choice is airodump, which can be run using the command:


    ```bash

    sudo airodump-ng -i wlan0

    ```


    Again, -w is included if you specify the network device, in this case for run
    and for results you''ve specified (-filename). Of course you won''t get any results
    here, but you can establish whether your passwords and other data can be caught
    by logging out.


    ## 08 Map your network


    It''s a good idea, when testing, to have an idea of the devices currently connected
    to your network. While investigating the router is one option, tools can also
    be used and will tell you how operating systems you are using like nmap.


    ## 09 Scan your network


    There is flexibility here, for instance, if you want to find out which OS is running,
    you would use something like:


    ```bash

    sudo nmap [TARGET]

    ```

    where [TARGET] is replaced with the device name or IP address. Since this can
    take a while to run, it will reveal details about the OS and embedded systems
    within the device. For a hacker, this can reveal a vast tranche of vulnerabilities
    every device that presents an easier target than your main PC, phone or tablet.
    Your network is only as strong as its weakest link, and the aim is to find this
    and fix it.


    ## Scan ports with nmap


    The resilience of the computer''s ports can be established using nmap. All you
    need to find open ports is a basic command:


    ```bash

    nmap [TARGET]

    ```


    Open ports will be listed, along with their type (such as TCP) and what they are
    running (HTTP, MySQL, perhaps SSH). nmap will also list ports which might be open,
    filtered, or closed. Fixing any vulnerabilities means the firewall on the device
    is aware of the ports.


    ## Has your network changed?


    While nmap shows you how your network is turning, it is on a date and time when
    you run the software, and for more stable and organic result, Wireshark should
    be your choice. A real-time report of your network topology, Wireshark can capture
    in real time, and report back on any changes that occur, as they happen. This
    uses for pen testing, not monitoring an attack is progressing.


    ## 12 Scan with Wireshark


    Hopefully scanning with Wireshark is relatively simple, but you''ll need to get
    into the GUI to use it. All you need to run the tool to see the results, a diagram,
    and the connected devices. Various views are available, and by adjusting the Preferences
    you can adjust the type of information that depends on what it you want to see.
    Additionally, clicking on a network device will display a report on its IP address,
    the network speed, and more besides.


    ## 14 Manipulating nmap


    Other conditions you can add to the nmap scan to create an output file:


    ```

    - nmap -i wlan0 -v to output.txt

    ```


    Using passive fingerprinting, nmap captures traffic information coming from a
    connecting host, rather than targeting a remote host. Because of this, it is capable
    of returning results quickly, and without detection. For testing, this is very
    useful, and can also be used to determine the origin of an attacker.


    ## 15 Tip of the pen-testing iceberg


    With over 200 pen-testing tools at your fingertips, it is unlikely that you will
    not be able to find a solution to your particular ethical hacking issue. The problem
    is at hand: the sheer volume of what''s available, but we''ve given you a few
    suggestions to get started.

