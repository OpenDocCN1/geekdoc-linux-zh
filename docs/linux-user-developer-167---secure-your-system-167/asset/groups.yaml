    ## 03 Reaver cracked your router – what''s next?


    Typically Reaver will take five to ten hours to complete, and it may appear that
    your Pi has locked up during this time. The best solution is to leave things as
    they are, and then Ctrl+C will cancel Reaver''s scan. Reaver uses a vulnerability
    in Wi-Fi Protected Setup, the WPS access system supported by many routers. Disabling
    it in the router will prevent this attack.


    ## 04 Other tools for password sniffing


    Pen testing isn''t just about cracking passwords, but several other tools are
    included in these packages and that provide further assistance in your search.
    So, look at John (John the Ripper) and airc-ng, among many others.


    ## 01 Test your Wi-Fi password with Reaver for your Raspberry Pi


    One of the first things you can do with your Raspberry Pi testing suite is to
    test the password on your router. To do this, we use a custom utility specifically
    designed to sign out passwords on routers and other access points (such as your
    smartphone''s wireless tether).


    While WPS is considered much secure than WEP, routers with security holes that
    have been exploited with certain tools: reveal is that:


