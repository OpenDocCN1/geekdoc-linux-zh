    ## GNU Make 教程


    ## 在旧发行版上运行新软件


    在预编译二进制包的世界里，你仍然会面临 GNU Make 构建系统的复杂性。


    跟上新软件版本是非常困难的。较新的版本需要较新的库，而某些 GNU/Linux 发行版无法跟上节奏。这就是为什么将旧发行版升级到新版本显然是有用的。除非出现问题，否则没有必要这样做。如果你的发行版已经达到了生命周期终点，不必急于。旧系统可以很容易地从源码（例如库）进行适配和构建。有时运气并不那么好：遇到无法获取源码的专有软件。


    即使对于某些极端情况也有希望。使用像 Debian Backports 这样的工具会大有用处。但你必须面对现实：使用没有源码的软件是不可能的。在某些情况下，退回到
    backports 或技巧可以减轻你的痛苦。更不用说，你可能会导致某些用户成为特定程序的受害者！


    对于这类情况，我们的下一个技术将派上用场。


    我们的第一个场景如下：你有一个 Debian GNU/Linux 发行版。在编写时，LTS 项目将提供直到 2018 年 5 月 31 日的更新。如果计划用新系统升级，则不需要使用
    Telegram Desktop。一旦你下载了 GNU/Linux 的二进制文件并执行它，你会得到：


    - /Telegram

    - libtelegram-x86_64-linux-gnu.libc.so.6 not found (required by /Telegram)

    - libtelegram-x86_64-linux-gnu.libc.so.6: version ''GLIBC_2.14'' not found (required
    by /Telegram)


    知道该软件是开源的，你可以遵循构建说明并完成。但如果我们谈论的是专有软件，另一种方法是使用旧版本。在这里，我们需要 Telegram Desktop 至少
    2.13 版本。我们可以用它运行你的发行版，但会出现同样的错误：


    - / lib/x86_64-linux-gnu.libc.so.6 release release 2.13


    对于 Telegram Desktop 的每个符号（函数），你可能需要通过运行 `read` 命令从较新的二进制版本中查找，这可能是其可执行文件的构建。


