    # Security Toolkit


    ## Scan for rootkits Chkrootkit


    If you suspect your system has been compromised, download and build chkrootkit.


    This tool helps you detect rootkits that may have taken over your Linux system.
    Chkrootkit can be considered as a collection of tools that will help in detecting
    the presence of rootkits. It searches for artifacts that system administrators
    know, is open source and is available for various distributions, and it has the
    ability to detect almost the latest rootkits because of the fact that contributions
    from source contributors are helping to keep up to date.


    Chkrootkit uses C and shell scripts to perform a detailed check, and scans binaries
    to detect signatures. Upon detection, it can remove rootkits. It also has a feature
    to report the results of a possible rootkit, even if it is not officially supported.


