    ## 访谈 CHRIS BUEHLER


    ### pfSense


    您的桌面到底有多安全？Chris Buehler 讨论了为什么 pfSense 是保护大型和小网络安全的领先防火墙


    Chris Buehler

    Chris Buehler 是 pfSense 项目的创始人之一，并在该软件的发展中发挥了关键作用，同时他还编写了 *pfSense: 权威指南：构建防火墙的必读书籍*。


    > 您能向我们概述一下 pfSense 及其功能吗？pfSense 拥有超过 250,000 个活跃用户，是一款开源防火墙和路由器发行版，帮助各种规模的网络。熟悉防火墙的
    IT 管理员将迅速学会如何使用 Web 界面配置软件包和组件。刚开始接触安全的学者将学习到丰富且易于理解的功能。


    pfSense 的核心功能之一是其状态检测防火墙。状态表维护着网络连接的信息。它能够按规则监控网络状态，并为保护各种协议提供多种选项。最后，它提供的工具还支持复杂布局、无线链路（卫星连接）、限制同时客户端连接数、限制内存配置等。


    pfSense 的其他功能还包括网络地址翻译 (NAT)、高可用性配置（包括多个实例之间的同步）、多 WAN 和负载均衡、带有 IPsec 和 OpenVPN
    的 VPN 连接、PPPoE 服务器、动态 DHCP、DNS 服务器和路由器发行版，当然还有详尽的监控和日志——可以说是防火墙和路由器发行版的“全能工具”。


    pfSense 还具有可扩展性。有许多免费软件包可供选择，帮助您使用 BGP 馈源为地址构建自定义的透明代理，等等等。最受欢迎的软件包是 Snort、Squid
    和 SquidGuard。


    ## pfSense 与其他领先的商业防火墙相比如何？它的做法有什么不同吗？


    当然，商业防火墙非常不同。pfSense 的功能和特性与所有商业防火墙平相当，但当你深入挖掘时，会发现两个显著的差异。第一个是 pfSense 的总成本更低。由于
    pfSense 是开源的，传统上不需要商业防火墙供应商所要求的年度许可费用。另一个差异化点是源代码社区。这个社区由极其聪明的人才组成，他们乐于解决问题并分享自己的所学。pfSense
    论坛、文档 wiki 和 YouTube 是 pfSense 可获取的三个信息宝库。


    ## 软件的可定制性如何？用户可以根据自己的需求进行定制吗？


    由于 pfSense 是开源的，对于那些想要将其个性化的人来说，有很多定制空间。大型公司已将 pfSense 集成到它们的商业产品中，实现个人级别的访问控制、VPN
    隧道、负载均衡和多 WAN 路由。在 pfSense 2.3 版本中，图形主题基于 CSS，因此您可以随心所欲更改 Web GUI 的外观。除了定制外观和体验之外，通过定制内置和可用软件包，您可以进行组合以满足您特定的防火墙需求。配置非常简单，对于您所需的大部分功能都有在线指南。它不像使用硬件或深入研究我们那样困难。


    终端用户可以在许多供应商支持的各种 x86 平台上运行 pfSense。我们最近审查了用于小型安装的硬件平台预览版，您还会看到一些用于大型企业级系列服务器。由于客户需求不同，我们提供系列桌面级和服务器供匹配。


    ## 运行该软件有任何硬件要求吗？


    对于小型企业和家庭用户，我们建议使用至少 1 GB RAM 的 64 位 CPU。随着您需求的增加，我们建议增加这些资源。整体系统要求取决于通过系统的流量大小、所需的并发连接数、外部攻击的安全性和严重程度、启用了哪些功能，以及加载了哪些额外的软件包（如果有）。我们乐意根据特定需求提供建议，请联系我们。


    我们主要使用并测试 Netgate 的 Intel C2000 (Relay Atom) 系统。Netgate 上的 pfSense 软件提供商业级支持。


    ## 选择合适的硬件


    虽然 pfSense 可以安装在各种硬件上，但在目前状态下它仅支持 x86-64 架构。尽管如此，根据您的需求选择最佳硬件是非常值得的。其中的佼佼者是 pfSense-2540
    网关设备：这是一种具有高性能技术的双成本解决方案，它还带来了


    ## 通过定制内置和可用软件包，您可以进行组合以满足您特定的防火墙需求


    Netgate 系统在美国制造，并具有适用于各种用途的 AES-NI 兼容平台。这些系统支持 VPN 连接。pfSense-2500 可用于高性能地配置或扩展现有的防火墙、LAN
    或 WAN 路由。在您的业务中，可以轻松定制 pfSense 以严密匹配您的 Sense-2540 和高性能网络需求。


    我们还提供了适用于 AWS、Azure 和 VMware 的云和虚拟选项。所有这些均可免费开始，并提供高效的站点到站点隧道，涵盖 Amazon 或 Azure
    区域之间的云到云集成。


    您还能找到为 pfSense 推荐的硬件，它们是专门为配合 pfSense 软件而定制的吗？


    是的。我们有定制的硬件，旨在最大限地发挥 pfSense 的能力。该硬件的设计目标是高可靠性和低功耗，同时充分利用 pfSense 提供的所有优势。从我们或我们的……处发现更多信息，由于这是我们在
    ARM 平台上的首次尝试，我们感到非常兴奋。我们的目标是 2016 年 9 月上市。


    ### 软件的安全性如何？软件是如何发现并消除漏洞的？


    让我先说，pfSense 团队在网络安全方面并不陌生。该项目始于多年前，并且一直在增长。我们不仅拥有一支拥有运营经验的开发团队，还在在全球范围内不断寻求解决方案以应对不断变化的威胁。pfSense
    社区始终处于前沿，这在检测和保护您的网络方面表现卓越。


    ### 您能邀请我们参加培训计划吗？包含哪些内容？


    我们提供为期两天的深度教学，可以在线或课堂环境中进行。课程由拥有多年经验的专业人士提供，每位学生都有自己的虚拟网络环境，包括 LAN 和 DMZ、分支机构以及外部网络。我们在两天内涵盖了大量内容！


    更多信息可以在 https://pfense.university/ 找到。我们还有一个社区成员组成的在线论坛，您可以在那里提问或查找从流量整形到高可用 OpenVPN
    的任何主题信息。


    ### 对于从未尝试过 pfSense 的人，您想说的话是什么？


    如果您想在 Netgate 系统上安装，免费下载的社区版具有商业版的所有功能。您可以选择终身免费的订阅选项。您也可以在 AWS 或 Azure 上使用该版本。您无需向我们提供姓名或电子邮件地址即可下载。我们理解。这没有许可或订阅费用，所以您有什么损失的呢？试一试，加入
    pfSense 社区，并为网络安全做出贡献。■


    合作伙伴网络是下一步可以帮助您运行 pfSense。由于这些平台正是我们自己环境中使用的设备，这使我们能够在每次发布时获得最佳的测试结果。pfSense 软件由广泛的合作伙伴网络、VAR、MSP
    和转销商支持，他们都致力于通过合作解决问题提供网络解决方案。我们很高兴与全球范围内的、理解我们业务以及 pfSense 软件和 Netgate 平台能力的合作伙伴。


    最新的 Netgate 平台是一款微型防火墙，具有两个千兆以太网连接和 ARM 芯片，极大地降低了价格，让每个人都能负担得起世界级的防火墙。


