    ## 09 路由与命令


    `route` 可执行文件是一个简单的脚本，用于查找路由表，这意味着它删除所有路由——这可能会损害你机器的连接性。此外，如果你的 Linux 充当网络路由器，`route`
    命令可能会破坏整个网络的连接性；`route` 是另一个脚本，使用 `ip` 在前缀中插入所有路由并显示每个脚本的内容：


    ```

    $ ip route show | awk ''{print $3}''

