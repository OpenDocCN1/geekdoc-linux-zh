    欲了解更多信息，请访问 www.codeclub.org.uk 加入我们。


    ## 开源

    ## 你的 Linux 新闻与观点来源


    观点


    ### 内核专栏


    Jon Masters 庆祝了 Linux 4.7 开发合并窗口的关闭，并发布了未来内核的新功能。


    > Linus Torvalds 宣布了 Linux 4.7 的首次发布。根据 Linux 的说法，新内核是一个巨大的发布，但并不完全巨大。


    随着 Linux 4.7 的发布，隐含的特性是4.7 并不包含全新的子系统（例如新的文件系统或架构），而是某些功能。后者恰好是处理文件系统的内核开发人员向
    VFS（虚拟文件系统）层推进的一项相当重大但对内核内部的工作。


    每当挂载一个伪文件系统时，都会创建一个“独立实例”，以防止为相似挂载设置产生不良交互，因为这些更改可能会影响主机。最近的修复将在下个月的发行后不久移除 Linux
    4.7 中对 `schedit` 的需求。我们将在下次提供关于 Linux 4.7 发布以及即将到来的 4.8 特性的完整总结。


    ### CPU 频率生成器


    Linux 4.7 中提到的新功能之一是新的频率“调节器”，被称为“schedutil”。CPU 调节器（Governors）是一组软件算法，用于决定何时更改系统的动态频率（速度）。在某些特定限制内的频率——毕竟是一个处理硬件开发的特定平台——考量了可用（电池）电量以及系统的热功率密度（TDP），后者限制了其频率和速度。


    随着 Linux 4.7 的发布，标志着“合并窗口”的关闭——即允许对内核开发周期进行更改的阶段——以及下一次发布邀请的就临。Linux 4.7 版本引入了“增添趣味”，在客户历史的最后更新日期之前，对于任何试图在最后时刻补丁中计划的人来说，这可能是任何事情；对于利益相关者来说，要维护合并窗口中提出的项目，这些项目将成为下一次发布
    4.7-rc2 路线的一部分，他提到计划稍后进行几分钟的清理。


    Jon Masters 是一位内核开发者，从事 Linux 工作已约 19 年。他目前就读于利兹大学。此外，他还为一家企业级 Linux 工作，并参与了企业级
    ARM 电源开发者标准的制定。


    名为“删除 DEVPTS_MOUNT 配置选项”的 Linux 清单与内核处理伪文件系统（ptys）有关，这些是非图形程序的小型输出设备。用户通过 ssh
    登录到服务器，然后打开一个新的 pty 与其 shell 交互。这些终端由服务器上的一个目录表示。该目录在磁盘上并不真实存在（它是一个内存中的伪文件系统，代表系统中可用
    ptys 的信息及其内容，根据启动时挂载 /devpts 动态变化）。内核过去曾有显式处理来确保其可靠性。


    如今，系统微处理器中的频率转换由操作系统软件管理——这一概念被称为 OSPM。操作系统的电源管理允许启用的操作系统在不影响性能的情况下执行频率转换。传统上，这些是相当粗粒度的，但其数量可以精细得多。跨架构的频率更改的确切机制（例如，内核可以使用
    ACPI - 高级配置电源接口或 ARM 电源状态）仅使用 ACPI。你的 x86 笔记本电脑使用系统 ACPI 固件提供的特殊平台回调，形式为体代码，这些代码由想要进行电源转换的内核
    ACPI 解释器决定；因此 Linux 不需要知道底层的细节。


    Linus 在他习惯的周日傍晚更早时候处理了 RC1 内核。


    当今 Linux 系统拥有名为“ondemand（按需）”、“performance（高性能）”和“powersave（节电）”的调节器，这些是相当粗放的工具，用于在达到某些系统负载指标后切换
    CPU 频率。你可能用过像“powtop”之类的工具让你的笔记本电脑运行得更好，并遵循其建议切换 CPU 调节器。然而，现有的调节器并没有在底层 Linux
    进程调度器中进行特定的校准，以确定运行程序所需的 CPU 频率。系统可以在完成工作后唤醒处理器执行一些任务，然后节流，从而节省大量的电池寿命。


    现有的调节器在更长的时间窗口内观察某些系统指标，以决定为单个程序分配哪个 CPU 频率。在很大程度上，这种频率远低于传统的（响应频率请求的时间周期），反而要高，以减少竞争的影响。当今系统的真实情况是，许多可能性领域可以在只有极微延迟的情况下被采纳。


    新引入的“schedutil”CPU 性能调节器直接与 Linux CFS（完全公平调度器）交互，以在每个调度器窗口内确定任务是否需要确认，以便。


