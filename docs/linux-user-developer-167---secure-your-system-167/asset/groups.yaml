    ## Ubuntu is built for its speed, and moving around the desktop is quick


    The desktop is very much on the blank side, and it''s easy enough to navigate,
    we would have liked to see a bit of flair to help it stand out. We could have
    been better served with a selection of default applications, which compared to
    the choice we had back in the 15.10 update, has been largely stripped back. We''ve
    found all its suspects: Firefox, Parrot, and Parole; but for other clients like
    VLC and GIMP, you''re going to need to also find and install them.


    One of the pleasant aspects of using Ubuntu 16.04 was its relatively low impact
    on our RAM and CPU. Despite not explicitly marked as a lightweight distribution,
    with only 40MB of memory being used there, it''s also minimal on the CPU. We couldn''t
    help but feel a little disappointed by what we were able to do. It means it is
    a complete work, but there are plenty of minor issues that need to be ironed out.
    In this instance it was with the package management front end. While many of us
    are accustomed to the Ubuntu Software Centre, Xubuntu has implemented (GNOME)
    Software. We don''t doubt that Xubuntu will be quick of mark to eradicate all
    the bugs that users are facing. Regardless, we''re still questioning some of the
    changes made here, and in its current state, worth looking elsewhere.


