    # What is pen testing?

    Short for "penetration testing", pen testing is basically assessing a computer,
    wireless access point, underlying network, or individual application, to see how
    it would handle an attack. If vulnerabilities are present, they will be detected
    by the pen testing software.


    > If vulnerabilities are present, then this would be detected by the pen testing
    software employed.


    When starting out pen testing, you will find a lot of tools available to use.
    The burden of choice is considerable, and there is some duplication of function;
    it is important not to be intimidated by the selection available. Many are open
    although some are proprietary; the choice of which to use is yours.


    Your choice will be dictated by the package of equipment you employ. All pen testing
    with a Raspberry Pi is a wireless dongle (the Raspberry Pi 3''s onboard Wi-Fi
    isn''t up to the task), perhaps a battery pack in order to take your pen testing
    tool mobile, and a suitable distro. Kali Linux is a particular favourite, as is
    Raspberry Pwn, comes with over 200 security tools pre-installed, with great quality
    of penetration-testing software.


    Before proceeding, keep in mind that pen testing on computers that do not belong
    to you is illegal. Unless you''re a government agency or department, you have
    the authority to do this. However, these tools are available for you to employ
    on your own computer and network. If you have ever been concerned about the resilience
    of a particular network to intrusion, or a particular firewall application, then
    pen testing is a good way to find the answers.


    Similarly, if you want to test your home network, your wireless hub or mobile
    carrier-provided wireless access point then pen testing is to evaluate your security.


