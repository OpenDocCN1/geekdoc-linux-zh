    $ ip route | awk ''/default/ {print $3 }''

    ```


    随后的命令统计 rtmon 创建的日志文件中发现的状态：


    ```bash

    $ ip monitor rtmon.log | grep state | awk ''{print $5}'' | sort | uniq -c

    ```


