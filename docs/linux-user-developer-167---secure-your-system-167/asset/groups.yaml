    # Build an explorer


    # pHAT robot Part one


    Make your own autonomous Raspberry Pi-powered robot using a Pi Zero, Zumo chassis,
    and Pimoroni Explorer pHAT


    Welcome to part one of a special robotics series. We will equip you with everything
    you need to know to make your Raspberry Pi robot. In this first part we break
    down a robot into all its component parts and give you an insider''s perspective
    on batteries, motors, input controllers and more.


    ![](img/5f89d575ba10642195ede1686f72dbb1_76_0.png)

    ![](img/5f89d575ba10642195ede1686f72dbb1_76_1.png)

    ![](img/5f89d575ba10642195ede1686f72dbb1_76_2.png)


    Alex Ellis

    @alexitloukas is a software engineer at Docker, Docker Captain and enthusiast
    for all things Linux. He is never far from Raspberry Pi and regularly posts tutorials
    on his blog.


    ![](img/5f89d575ba10642195ede1686f72dbb1_76_3.png)

    ![](img/5f89d575ba10642195ede1686f72dbb1_76_4.png)


    # What exactly is a ''robot''?


    A robot is considered to be any machine that can perform tasks or tasks, either
    autonomously or with direct instruction. Robots come in many shapes and sizes
    - they can be used for manufacturing, for search and rescue, and for just fun
    and seeing what you can create. The hobbyists we saw recently reeled or disconnected
    from any wires, capable of being driven by a gamepad. We''re not going to be too
    strict about what constitutes a robot; we''d like to leave that to you.


    ![](img/5f89d575ba10642195ede1686f72dbb1_76_5.png)


    # The chassis


    The chassis is the heart of the robot and its size and shape dictates everything
    you add to it. Choose between big or small, strong or light, or heavy. If you
    are going autonomous then you will need a base with plenty of space for expansion.
    We saw RC cars deposed with new electronics; this can be a cheap way of great
    finish. DIY platforms are the most flexible and rewarding; made from laser-cut
    wood, acrylic and even 3D-printed parts.


    # Tutorial


    Motor controllers are driven with a PWM (Pulse Width Modulation) signal generated
    by the Pi or an add-on board. It''s a good idea to buy one or two spare motors
    for each project – and be kind to them because they can be misused. The Zumo chassis
    uses micro-geared motors from Pololu. We sourced most of these components from
    there. We assume you already have your Raspberry Pi Zero, microSD card and few
    AA batteries in the back of a drawer.


    | Item | Price |

    | :--- | :--- |

    | Raspberry Pi | £35.00 |

    | Pololu Zumo chassis | £15.00 |

    | Explorer pHAT | £10.00 |

    | 2x Metal-gear motors | £10.00 |

    | Battery (x8) | £2.00 |


    ![](img/5f89d575ba10642195ede1686f72dbb1_77_0.png)

    ![](img/5f89d575ba10642195ede1686f72dbb1_77_1.png)

    ![](img/5f89d575ba10642195ede1686f72dbb1_77_2.png)

    ![](img/5f89d575ba10642195ede1686f72dbb1_77_3.png)

    ![](img/5f89d575ba10642195ede1686f72dbb1_77_4.png)


    # The motor controller


    The type of motor and its peak current dictate the choice of motor controller.
    For small motors, a cheap chip like the L298N may well suit your needs. Borg produces
    a much more efficient board which can drive large loads, with the cost increasing
    to around £30.


    # Power source


    It is best to run your motors and circuits from separate sources. This helps isolate
    the Pi, motor controllers and sensors from potential surges. For the experienced
    user, LiPo batteries are recommended, but we must warn that all notices must be
    read and followed before charging or handling them. USB power banks, AA batteries
    and 9V batteries.


    # Understanding gear ratios


    The gear ratio is the ratio of input speed to output speed. For instance, 35:1
    means the motor shaft (driver) turns 35 times as fast as the drive shaft (where
    the motor is mounted). The higher the ratio, the more torque you get. With the
    D Thumper 4WD robot (available at robosavvy.com) a ratio of 34:1 gives a top speed
    of 4.5mph with a stall torque of 5kg-cm, in contrast to 75:1 with a lower top
    speed but higher torque of 11kg.


    For more detailed info, check out the gear deck from Physics: https://bodyphysics.org/Robotics/_Gears_and_Gear_Ratios/


    # Get your running motor


    Brushless motors for RC-cars typically run at high speeds and make your robot
    easily fast at travelling in a straight line, but hard to control over obstacle
    courses and for autonomous navigation. Brushed motors can be driven with a motor,
    but you must refer to the stall current of the motor when choosing.


    Most robots will need input from a joystick or gamepad. We have had good success
    with PS3 controllers which use Bluetooth. The Xbox 360 and PS2 controllers would
    work but add complexity and draw more current than a Bluetooth adapter. Separate
    your code into different classes so that you can swap controllers in the future.


    # Explorer robot


    ![](img/5f89d575ba10642195ede1686f72dbb1_78_0.png)

    ![](img/5f89d575ba10642195ede1686f72dbb1_78_1.png)

    ![](img/5f89d575ba10642195ede1686f72dbb1_78_2.png)


    # LED outputs


    When starting and stopping your robot, or just turning the motor speed up or down,
    it''s important to have visual feedback. The simplest way to do this is by plugging
    LEDs directly into the resistor of your motor-driver. For our first robot, a flashing
    sequence was performed for LEDs when the bluetooth service was turned up or down.
    If you have a few free slots left on your robot''s top level, you can attach an
    LCD display at the same time as everything for communicating data from the sensors.


    A camera can be added to the Raspberry Pi Zero for around £4-£10 which means that
    you are navigating around the kitchen or garden you can take pictures or stream
    live video back to your control station (laptop). For something more advanced,
    a Raspberry Pi robot can be made to follow a series of GPS waypoints with a 360-degree
    camera and a digital compass.


    # Autonomous control


    There are two types of autonomous control programs for a robot: open and closed
    loop. In an open loop, a robot will move at constant speed regardless of the environment,
    meaning a small turn on carpet will translate to a manoeuvre on tile. Generally,
    an open loop is easier to start with as it absolutely needs no feedback. Advanced
    robots need feedback from sensors and inputs to adjust their speed or movements.
    An example of this is a robot with the first one going up; a closed loop uses
    an encoder so that it knows it is travelling at 50 cm; we can task the robot with
    moving at a minimum of 100cm.


    ![](img/5f89d575ba10642195ede1686f72dbb1_78_3.png)


    # Starting out with sensors


    There are many types of sensors available and each has its own protocol or wiring
    scheme. We suggest using well-known sensors that are easy to connect. The Parallax
    ultra-sonic gives the distance in centimetres, helping you avoid crashing into
    walls. A pair of infrared line sensors can be used to follow a dark line – you
    could use black insulation tape on the kitchen floor.


    # NEXT


    Join next issue where we will guide you how to construct a robot using the Zumo
    chassis. We will put the tracks and wheels onto the chassis and servo motors to
    the motors and then get on we will see all about manual control of the robot and
    autonomous navigation through sensing the real world.

