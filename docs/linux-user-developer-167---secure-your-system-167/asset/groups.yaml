    ### 03 Detect rootkits


    A system administrator can use this program to detect rootkits in their system.
    Following are some of the ways to use this tool. It lists various tests that are
    supported.


    ### 05 Run in a cron job


    Chkrootkit is installed in /usr/sbin/chkrootkit. We need to specify this path
    in the cron job. To create an entry for /usr/sbin/chkrootkit, we can use the following
    command:


    ```

    $ 0 * * * * /usr/sbin/chkrootkit 2>&1 | mail -s "chkrootkit output of my server"
    me@domain.com

    ```


    ### 01 install chkrootkit


    If chkrootkit is not already installed on your system, you can use the following
    command:


    ```

    # sudo apt-get install chkrootkit

    ```


    ```

    $ sudo apt-get install chkrootkit

    ```


    ### 02 chkrootkit options


    Chkrootkit comes with some options and system administrators can use these options
    in various ways to perform their operations. These can be used to see lists of
    data:


    ```

    $ sudo /usr/sbin/chkrootkit -h

    ```


    ```

    $ sudo /usr/sbin/chkrootkit -x | more

    ```


    ### 04 Use Quiet mode


    Use chkrootkit in Quiet mode it displays if a binary is found. The following commands
    are handy when you want to use Quiet mode:


    ```

    $ sudo /usr/sbin/chkrootkit -q

    ```


    ### 06 Interpret output


    We also need to understand the output. The phrases such as "Not found" or "Not
    infected" are displayed in most cases. When a rootkit is found, the presence of
    a rootkit is, the output highlights it with "INFECTED", or "The following suspicious
    files or directories have been found":


