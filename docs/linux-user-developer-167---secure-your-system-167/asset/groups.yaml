  mdcn: '


    ## 免费软件回顾


    ## WEB 服务器


    ### Hiawatha 10.2


    一个注重安全性的轻量级 Web 服务器。


    自从 Apache 不再是 Web 服务器的首选（尽管它在所有情况下仍然是最好的，但在需要时，较小的竞争对手也是不错的选择）——我们不得不使用 Nginx
    和 Lightpd；但还有另一个选择。

    Hiawatha 已经存在多年，凭借其安全性、速度和简单性的结合，一直脱颖而出。


    Hiawatha 可以阻止 SQL 注入、XSS 和 CSRF 攻击以及漏洞利用尝试，并具有诸如“最大请求大小”等功能，而其他服务器在实现这些功能时往往会消耗大量的资源。它非常适合
    Drupal、WordPress 以及其他 PHP 应用——这些应用实际上存在许多已知的漏洞。由于 Uwe Lesik 在近 15 年前启动该项目时，它是为了在旧硬件上运行的，因此可以想象它在今天运行得非常快。

    安装非常简单，流程直观。通过 Hiawatha 网站可以引导你了解用例，但对于新手来说，只需阅读配置文件就能让你上手运行。


    ![](img/5f89d575ba10642195ede1686f72dbb1_89_0.png)


    优点

    - 简单且快速。使用 Polar SSL；现在免费了！Let''s Encrypt，代码库简单且经过审计。


    缺点

    - 如果你已经在应付 Apache 和 Nginx 老板带来的影响了，再学习另一个服务器将是一件坏事。


    适用场景...

    - 使用 hiawatha-webserver.org 记录时间段。


    使用 Monitor 跟踪你所有由 Hiawatha 管理的网站。它是一个很棒的小型 Web


    ## 停机监控


    ### downtime 1.0


    你的服务器或 VPS 宕机多久？问问 downtime。


    如果说我们有什么喜欢的东西，那就是那些提供特定功能且能完成任务的命令行工具。downtime 记录所有的系统停机时间，并在你需要时提供报告。命令 `downtime`
    和 `downtime -c` 是运行时间计数器。

    你已经在部署仓库中拥有了 downtime 0.6。这个 1.0 版本变化不大，更多是对该应用稳定性的反映——当 Linux、Unix、Hard、BSD 以及许多版本的
    Solaris 和 MacOS 上的系统发生变化时，它不需要太大的更改。这些单元的启动方式略有不同（当 downtime 无法理解操作系统内核的方法时，它会拥有自己的守护进程启动方式），以及
    GNU/Linux 发行版中的启动系统。

    无论哪种方式，它们都有效。downtime 在你的 GNU/Linux 发行版上会在系统关闭和崩溃时保留良好的运行时间记录，通过持续获取时间戳对后者给出清晰的停机时间估计。查看“现在”的运行时间总是很容易，但考虑到我们许多人的托管环境，查看停机时间同样重要。它简单，但非常耐用。


    优点

    - 简单实现在其目标：记录可以从命令行查询的时间段记录。


    缺点

    - 不适用于会影响启动期间系统时间的非计划变动。


    适用场景...

    - 分析为什么你的 VPS 经常离线；dist.ee.org/downtime


    ## 键盘屏幕录屏工具


    ### Screenkey 0.9


    更好的屏幕录屏，通过显示你输入的按键来实现，包括用于显示多媒体键的 Awesome 字体——例如选择（Select Operation - 用于有趣的发布，这会让你显得很困惑，并让你去弄清楚它的依赖关系以便工作)。


    如果你曾尝试过命令行工具的基础基础屏幕录屏，或者在你最喜欢的编辑器中编程，你可能会为了可读性而感到沮丧，Screenkey 为你的显示代码留出了空间。Screenkey
    以更自然的尺寸记录你的桌面或终端，并在你在教室或演讲室输入所有内容，或在会议和代码单元的非正式需求时弹出更好的屏幕录屏效果。

    使用 Python 3 编写非常简单，且无论是否安装都可以运行，Screenkey 的依赖项并不沉重——可以通过包管理器安装。


    优点

    - 输入内容或按键组合的设计灵活。


    缺点

    - 即使你确定了使用哪种模式，所有的快捷键都变了。


    适用场景...

    - 与朋友一起屏幕录屏或演示游戏

    http://bit.ly/1tkydB8


    ## 回合策略游戏


    ### Battle For Wesnoth 1.1.2.6


    仍然是一款出色的免费软件游戏。


    ![](img/5f89d575ba10642195ede1686f72dbb1_90_0.png)


    ![](img/5f89d575ba10642195ede1686f72dbb1_90_1.png)


    自从我们上次玩回合制游戏 Battle For Wesnoth 以来，稳定分支在更新中进行了一些改进和修复。它已经存在了十，一直是自由和开源软件质量的杰出范例。我们有一段时间没玩了，也没有错过战役、艺术作品、音乐以及最新功能发布中增量改进的积累，这些功能通常可以通过二进制包获得，因为它们会很快地进入仓库。我们用的是
    Debian 包。如果你正在寻找一款出色的回合制游戏，选它就了。


    优点

    - 深度且具有策略性的内容

    - 拥有惊人的社区


    缺点

    - 对初学者来说学习曲线陡峭


    适用场景...

    - 策略游戏爱好者

    http://bit.ly/1tkydB8


    '
