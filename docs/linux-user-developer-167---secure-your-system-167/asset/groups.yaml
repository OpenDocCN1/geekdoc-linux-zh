    Dear Lu,

    At my team and I use Slack to coordinate and send each other information. I find
    it really useful when I need to connect with colleagues who are working on the
    same project and it''s particularly good when we''re debugging. The question about
    whether fellow contributor is ''right'' doesn''t depend much on your personal
    views more strongly than others and some people search for others who are completely
    open source, it is pleasing to note that there is an open alternative to Slack.
    There are a couple, but our favourite is RocketChat which has great drag-and-drop
    features and video conferencing.


    Dear team,

    A friend put Ubuntu on our family computer when my daughter started studying Electronics
    and her teacher introduced her about Raspberry Pi so she decided to install Windows
    10 by hiding the bootloader on Raspberry Pi in her work she''s done.


    In recent time, I''ve started contributing to an open source project, and thinking
    of how useful me and my team found, I suggested that we use a web tool to communicate
    across different countries and timezones, we currently use a mailing list and
    IRC channel, it''s easy for beginners.


    However one of the other contributors pointed out that Slack is a closed-source
