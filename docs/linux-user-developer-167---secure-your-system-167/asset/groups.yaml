    ELF versioning and ABI issues concerning glibc can be circumvented by patching
    the dependency. This is far more simple than installing glibc in a separate directory
    and it works well. The idea is to easily depend on it with a substitute like PRELOAD.


    # Newer glibc versions do not fix issues and supersede symbols, but add new functionalities
    as well


    So the binary needs glibc 2.14 and __felt_chk_glibc_2.15. To run on this, follow
    these steps:


    +   - Download, build with a proper GNU glibc in a separate directory.

    - Set LD_LIBRARY_PATH to the directory where the new glibc is located.

    - Load the Telegram binary with the appropriate dynamic linker/loader;LD-linux.so.2.

    - After the first time, you will have to build, and install glibc_2.15. These
    commands will:


    ```

    $ wget http://ftp.gnu.org/pub/glibc-2.15.tar.gz

    $ tar xvf glibc-2.15.tar.gz

    $ cd glibc-2.15

    $ make libc-ld.so

    $ ./configure --prefix=/usr/local/glibc_2.15-enable-all

    $ make

    $ make install

    ```


    # Building software for backwards ABI compatibility


