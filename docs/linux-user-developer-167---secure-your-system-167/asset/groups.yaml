    ## Review Black HAT Hack3r


    ![](img/5f89d575ba10642195ede1686f72dbb1_85_0.png)


    ## MINI PC


    ### Pimoroni Black HAT Hack3r and Mini Black HAT Hack3r


    If you need to diagnose problems with a Raspberry Pi (HAT) standard you’ll find
    these boards invaluable.


    | Feature | Details |

    | :--- | :--- |

    | Size (Full) | 65mm x 105mm x 11.2mm |

    | Weight (Full) | 31g (excluding cable and mounting hardware) |

    | Available From | pimoroni.com |


    The ‘Hardware Attached on Top’ (HAT) makes the Raspberry Pi easier than ever to
    make use of its boards’ general-purpose input-output (GPIO) headers without wastage.
    HAT boards, by their very nature, take up the entire 40-pin header of the Pi to
    which they attach, even if they only need one or two breakout connectivity for
    the unused pins.


    That''s where the Black HAT Hack3 shines. In traditional full-size and new Mini
    variants, the Black HAT Hack3 boards are as simple as they come: there are no
    active electronics present at all. Instead, you get an easy way to access or break
    two breakout pins to the port expanders of the 8-bit controller. The ability to
    switch between multiple inputs is simple: connect the either 40-pin cable, the
    same type used to connect various HATs to their controllers, to the GPIO header,
    then drives the first row of pins on the header of the Black HAT3. You can attach
    any HAT device to one of the two headers on the full-size model, while the Mini
    variants support the Pi Zero-model HATs on the mini header and still have a complement
    of 40 pins for additional devices.


    The catch, of course, is that with no hardware on board not the pins will be available.
    This is both a blessing and curse: if two devices need to use the same GPIO pins
    at the same time, the Black HAT boards won''t help.


    ![](img/5f89d575ba10642195ede1686f72dbb1_86_0.png)


    ### mini black hat hack3


    > A Black HAT board allows the user to make use of pins used by HAT without modifying
    it. In the least; having the pins mirrored makes it possible to see what a given
    board is doing—a valuable tool for diagnosing problems and reverse-engineering,
    though when building a more complex project; a Black HAT board allows the user
    to use pins used by HAT without modifying it directly. It itself, the Mini is
    the most beginner-friendly, as it''s available in board-only and fully assembled
    formats; the size variant, however, is exclusively available as a solder-it kit.
    If you''re dealing with full-size HATs, the board provides mounting hardware to
    ensure they don''t come loose; for smaller devices known as HATs. While it is
    possible to use full-size HATs on the Mini, the full-size HAT must be installed
    on the Mini board using one of the three headers and thus cover. There''s really
    little to complain about the Black HAT boards: the PCBs are somewhat thin but
    sturdy, and the PCB-only Mini variant—without adhesive feet. Perhaps the only
    issue we encountered was with the push-pin mounting hardware, which proved tricky
    to install in HAT.


