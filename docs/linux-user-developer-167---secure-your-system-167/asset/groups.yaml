    # Review


    # Virtual Private Networks


    # In brief: compare and contrast the verdicts


    | | PrivateTunnel | IPvanish | TunnelBear | CyberGhost |

    |---|---|---|---||

    | Setting up a VPN | Plenty of options are here readily on hand, but a free VPN
    is one click for advanced users | A well-designed UI can''t mask the lack of choice
    when it comes to customisation | For a default VPN, all of it takes a flick of
    switch. For beginners users | Every part of your VPN can be altered from top to
    bottom, depending on what you need |

    | Connection options | PrivateTunnel will automatically search the fastest servers,
    which is a big help | Connections can be quite enough, but not enough for advanced
    users | Very little of it can be customised, which isn''t great for users | Lots
    to take advantage of one or two features to be pointless addresses |

    | Browsing speeds | Low latency was a particular highlight for that we tested
    | No issues here, with servers all working at optimal speeds | Speeds are generally
    good, with some congestion on after servers | CyberGhost''s speeds hit and miss
    that can drop on occasion |

    | Security features | There''s enough here to provide you with everything you
    need to stay safe | IP masking is a highlight and range of other features on-board
    | Everything included and once again, there''s enough useful elements | For advanced
    users, plenty of options are here to keep you secure |

    | Overall | An easy-to-use interface plus quality and security features | Speedy
    and offers good options, but not quite enough | Good for VPN newcomers, but security
    connection can be an issue | A plethora of custom options, but let down by server
    performance |


    # # AND THE WINNER IS...


    # ## PrivateTunnel


    When it comes to keeping your anonymity, users have plenty of VPN services to
    choose from. Both PrivateTunnel and CyberGhost proved to be the best we tested,
    but it''s the former that we''ve chosen as our winner here.


    At times, PrivateTunnel offers one of the VPN-based browsing experiences out,
    while still providing an array of options for advanced users who want the maximum
    use from it. But that''s not forgetting that who might want to use a VPN for the
    first time, PrivateTunnel really simply seems to get a secure VPN in matter of
    seconds.


    While it shines in its browsing experience, we also take out its out of security
    options to keep you safe. Of course, it provides complete anonymity, but it also
    uses an encrypted protocol to make sure your anonymity cannot be traced. You''ll
    appreciate that feature far more than you might think.


    Obviously a superb feature isn''t free, but PrivateTunnel is a fair price package,
    depending on your usage. Packages are on a per-gigabyte basis, with a 50GB allowance


    ![](img/5f89d575ba10642195ede1686f72dbb1_83_0.png)


    +   * Switch protocols to alter how the VPN keeps you safe online


    costing just $10/£12. But if you don''t want to dive into a paid subscription,
    then take advantage of the free trial offered on the Private.


    We argue that advanced users should certainly check out CyberGhost, due


    to the sheer scale of what it offers, but as a package, PrivateTunnel has to be
    the winner here. It doesn''t over-complicate and manages to turn what''s a tricky
    situation into something a bit more manageable.


    +   * Oliver Hill


