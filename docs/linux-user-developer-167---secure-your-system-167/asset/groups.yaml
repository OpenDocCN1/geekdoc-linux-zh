    ## Storepass secures securely Vaultier


    Keep your passwords organised and away from prying eyes.


    Password managers are designed to help you keep your access more secure and make
    it easier to remember unique passwords for every site. A password management tool
    will store all your passwords in one place and it is considered a great way for
    small business owners to manage several different accounts while keeping them
    informed. Vaultier is a commonly used password manager. It has gained popularity
    because of features such as easy user management - it''s pretty easy to add/remove
    members. It offers the liberty to access with the help of its permission system,
    which has control over all information, and it offers a simple facility to generate
    passwords that you generate strong passwords very easily. Vaultier is also considered
    the best option for large-scale password management.


    > You can identify the vulnerabilities that could allow an external hacker to
    access sensitive information


    ## Scan for vulnerabilities Nessus


    Your system is a widely used vulnerability scanner that works through web interfaces,
    scan and view reports. The great thing about Nessus is that it is easy to run
    but offers a robust set of features and also has good community support. Nessus
    uses a modular architecture, supporting multiple servers for scanning and remote
    clients that allow for administrator control. You can deploy Nessus scanners from
    any points within your network and control them from a single client. With this,
    you will be able to scan segmented networks from multiple vantage points and scans
    of large networks require multiple scanners running simultaneously. Nessus gives
    you a lot of choices when it comes to running the actual vulnerability scan. You
    can scan individual computers, ranges of IP addresses or subnet teams. You can
    run it in Nessus and you can use them to test for individual or sets of networks.
    You can identify the vulnerabilities that could allow an external hacker to access
    sensitive information, check whether systems in the network have the latest software
    packages, and set up configuration audits.


    ![](img/5f89d575ba10642195ede1686f72dbb1_22_0.png)


    ## Feature Security Toolkit


    ### Search for predefined patterns

    The patterns are defined as Snort rules. Snort can report its findings in a number
    of output formats. Some of these formats include syslog, tcpdump, database, alert,
    and unified. Unified output is considered the best method and hence used widely.


    ![](img/5f89d575ba10642195ede1686f72dbb1_23_0.png)


    ### Command line options

    Snort comes with a variety of command line options. Some of the options can be
    specified in the config file instead of the command line. The general rule is
    that if you are just trying something out, specify the setting on command line,
    and if you are planning on keeping the setting for a while, set it in the config
    file.


    ## Detect intruders Snort


    ### Monitor traffic in real time

    Snort scrutinizes every packet to see if there are any payloads. It can also be
    used to perform protocol analysis, content searching and matching. It is used
    to detect various types of attacks such as port scans and buffer overflows on
    Linux, Unix, and all BSD operating systems. It does not require you to recompile
    your kernel or modify any existing distribution, but it does not require that
    you have root privileges.


    > Snort examples network traffic against a set of rules


    Snort is intended to be used in the most classic sense of a network intrusion
    detection system. All it does is compare network traffic against a set of rules,
    allowing the system administrator to monitor suspicious activity so that you can
    take appropriate actions. You can configure Snort three different modes: sniffer
    mode, logger mode and network intrusion detection mode. In sniffer mode, Snort
    will read packets and display them on the console. In logger mode, Snort will
    log the protocol information to the disk. In network intrusion detection mode,
    Snort will monitor the network traffic and analyze it against the rules defined
    by the user. Snort will then be able to take a specific action based on the outcome.
    It has a built-in real-time alert capability. Network intrusion detection systems
    are placed at certain points within the network so you can monitor the traffic
    from all devices in the network. If an attack or an abnormal situation is identified,
    an alert can be triggered to take corrective actions as needed.


    The snort.conf file controls everything about what Snort does, how it defends
    itself from attack, what rules it uses to find malicious traffic, and how it watches
    for traffic that isn''t signed by a signature.


    ## 01 Install Snort


    Execute the command on your Linux terminal:


    ```bash

    $ sudo apt-get install snort

    ```


    Once the installation is completed, you can check for a successful installation
    by:


    ```bash

    $ snort -version

    ```


    ## 02 Program dependencies


    A few programs are needed when you''re going to run Snort. They are: apache2 for
    the web server, mysql-server for the database, php5 for the server-side client,
    php-mysql, php-gd for graphics handling, and PEAR (PHP Extension and Application
    Repository). You apt-get install all of the programs.


    - apt-get install apache2

    - apt-get install mysql-server

    - apt-get install php5

    - apt-get install php-mysql

    - apt-get install php5-gd

    - apt-get install php-pear


    ## 03 Required dependencies


    We need to create some directories required for the successful running of Snort.
    Use the following commands to create these files:


    - mkdir /etc/snort

    - mkdir /etc/snort/rules

    - mkdir /var/log/snort


    The snort.conf file controls everything about what Snort does, how it defends
    itself from attack, what rules it uses to find malicious traffic and how it watches
    for potentially dangerous traffic that isn''t signed by a signature. My goal is
    to understand how Snort works and how it can be configured to provide a successful
    deployment of Snort as an IDS in your environment. By default, the configuration
    file is located at /etc/snort. If you need the configuration located somewhere
    else, you need to use -c switch with the file''s path.


    ## 04 Execute Snort


    To execute Snort, use the following:


    ```bash

    $ snort -c /etc/snort/snort.conf

    ```


    ## 05 Generated alerts


    An alert file will be created in /var/log/snort. All alerts generated while Snort
    is running are classified by type. You can then filter out noisy alerts and focus
    on the most important ones.


    ```bash

    $ /var/log/snort

    ```


    ## 06 Packet logger mode


    In logger mode, the main idea is to record the packets to the disk. Specify a
    logging directory and Snort will automatically know how to get into logs.


    ```bash

    $ snort -c /etc/snort/snort.conf -l /var/log/snort

    ```


    ## 07 Network intrusion mode


    To enable network intrusion mode, use:


    ```bash

    $ snort -c /etc/snort/snort.conf -H HOME_NET

    ```


    Note that Snort is the name of the rule and HOME_NET is a variable which is defined
    in the configuration file. The rule set defined in snort.conf will be applied
    to each packet and a decision will be made. The default action is alert. It is
    good to read the entire snort.conf before calling it from the command line. If
    you are going to use Snort over a long period as an IDS, do not use -v on the
    command line for the sake of speed.

