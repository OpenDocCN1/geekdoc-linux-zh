    # pHAT 机器人 第一部分


    使用 Pi Zero、Zumo 底盘和 Pimoroni Explorer pHAT 制作你自己的自主树莓派驱动机器人。


    欢迎来到特殊机器人系列的第一部分。我们将为你提供制作树莓派机器人所需的所有知识。在第一部分中，我们将机器人拆解为所有组件部分，并为你提供关于电池、电机、输入控制器等的内部视角。


    ![](img/5f89d575ba10642195ede1686f72dbb1_76_0.png)

    ![](img/5f89d575ba10642195ede1686f72dbb1_76_1.png)

    ![](img/5f89d575ba10642195ede1686f72dbb1_76_2.png)


    Alex Ellis

    @alexitloukas 是 Docker 的软件工程师、Docker Captain 以及所有 Linux 事务爱好者。他从未远离树莓派，并定期在他的博客上发布教程。


    ![](img/5f89d575ba10642195ede1686f72dbb1_76_3.png)

    ![](img/5f89d575ba10642195ede1686f72dbb1_76_4.png)


    # 到底什么是“机器人”？


    机器人被认为是任何可以自主或根据直接指令执行任务的机器。机器人有许多形状和大小 - 它们可以制造、搜索和救援，以及仅仅为了好和看看你能创造出什么。我们最近看到的爱好者们收回或断开了任何电线，能够通过游戏手柄驱动。我们不会对什么是机器人定义得太严格；我们想把那留给你。


    ![](img/5f89d575ba10642195ede1686f72dbb1_76_5.png)


    # 底盘


    底盘是机器人的核心，它的尺寸和形状决定了你添加上面的一切东西。在大和小之间、强或轻之间进行选择。如果你是自主的，你将需要一个有足够扩展空间的底座。我们看到的
    RC 汽车是新电子设备的廉价方式。DIY 平台最灵活且最有成就感；由激光切割的木材、亚烯甚至 3D 打印零件。


    教程


    电机控制器由树莓派或扩展板生成的 PWM（脉冲宽度调制）信号驱动。为每个项目购买两个备用电机是个好主意并善对待它们，因为它们可能会误用。Zumo 底盘使用
    Pololu 的齿轮电机。我们从那里获取大部分组件。假设你已经有了树莓派 Zero、microSD 卡和几节 AA 电池。


    | 项目 | 价格 |

    | :--- | :--- |

    | 树莓派 | £35.00 |

    | Pololu Zumo 底盘 | £15.00 |

    | Explorer pHAT | £10.00 |

    | 金属2轮 x2 | £10.00 |

    | 电池 (x8) | £2.00 |


    ![](img/5f89d575ba10642195ede1686f72dbb1_77_0.png)

    ![](img/5f89d575ba10642195ede1686f72dbb1_77_1.png)

    ![](img/5f89d575ba10642195ede1686f72dbb1_77_2.png)

    ![](img/5f89d575ba10642195ede1686f72dbb1_77_3.png)

    ![](img/5f89d575ba10642195ede1686f72dbb1_77_4.png)


    # 电机控制器


    电机的类型及其峰值电流决定了电机控制器的选择。对于小型电机，像 L298 这样的廉价芯片可能适合你的需求。Borg 产生更高效的板可以驱动大负载，成本增加到
    £30 左右。


    # 电源


    最好从独立源运行你的电机和电路。这有助于隔离树莓派、电机控制器和传感器免受潜在浪涌的影响。对于经验用户，建议使用 LiPo 电池，但必须在充电或处理它们之前阅读并遵循所有注意事项。USB
    充电宝、AA 电池和9V 电池。


    # 理解齿比


    齿比是输入速度与输出速度的比率。例如，35:1 意味着电机轴（驱动端）旋转速度是驱动轴（电机安装处）的 35 倍。比例越高，获得的扭矩越大。对于 Thumper
    4WD 机器人（可在 robosavvy.com 获取），34:1 的比例提供了 4.5mph 的最高速度，扭矩为 5kg-cm；相比之下，75:1 的速度较低但扭矩更高（11kg）。


    更多详细信息，请查看 Physics 的齿比介绍：https://bodyphysics.org/Robotics/_Gears_and_Gear_Ratios/


    # 获取你的电机


    无刷电机通常以高速运行，让你的机器人直线行驶非常快，但在障碍赛和自主导航中难以控制。有刷电机可以用电机驱动，但在选择时必须参考电机的堵转电流。


    大多数机器人需要来自摇杆或游戏手柄的输入。我们在使用蓝牙的 PS3 控制器上取得了成功。Xbox 360 和 PS2 控制器也可以会增加复杂性并比蓝牙适配器消耗更多电流。将你的代码分为不同的类，以便将来更换控制器。


    # Explorer 机器人


    ![](img/5f89d575ba10642195ede1686f72dbb1_78_0.png)

    ![](img/5f89d575ba10642195ede1686f72dbb1_78_1.png)

    ![](img/5f89d575ba10642195ede1686f72dbb1_78_2.png)


    # LED 输出


    在启动和停止机器人，或者仅仅调节电机速度时，具有视觉反馈是很重要的。这样做最简单的方法是将 LED 直接插入电机驱动器的电阻器中。对于我们的第一个机器人，当蓝牙服务开启或关闭时，LED
    会执行闪烁序列。如果你在机器人的顶层留有几个空槽，你可以同时为所有部分连接一个 LCD 显示器，用于通信传感器数据。


    树莓派 Zero 可以添加摄像头，约为 £4-£10，这意味着当你在厨房或花园中穿行时，你可以拍照或将直播视频传回你的控制站（笔记本）。对于更高级的，可以制作树莓派机器人带有
    360 度摄像头和数字罗盘遵循一系列 GPS 标记。


    # 自主控制


    机器人有两种类型的自主控制程序：开环和闭环。在开环中，机器人无论环境如何都以恒定速度移动，这意味着在地毯上的小转弯会转化为在瓷砖上的动作。通常情况下，开环更容易开始，因为它绝对不需要反馈。高级机器人需要传感器的反馈来调整其速度或动作。一个例子是第一个一个向上移动；闭环使用编码器，以便它知道自己正在移动
    50 厘米；我们可以任务机器人至少移动 100cm。


