    ## INTERVIEW CHRIS BUEHLER


    ### pfSense


    Just how safe is your desktop? Chris Buehler discusses why pfSense is the leading
    firewall for securing both large and small networks


    Chris Buehler

    Chris Buehler is one of the founders of pfSense project and has been an instrumental
    part in the development of the software but he''s also written *pfSense: The Definitive
    Guide: must-have book for building firewalls*.


    > Could you give us an overview of what pfSense is and its features? With over
    250,000 active users, pfSense is an open source firewall and router distribution
    that helps networks, both large and small. IT administrators familiar with firewalls
    will quickly understand how to configure the packages and components using the
    web interface. Those who are just starting with security will learn and rich,
    easily understand features.


    One of the key features of pfSense is its stateful firewall. The state maintains
    information on network connections. Monitoring the state of the network on a per-rule
    basis, and provides multiple options to secure a wide variety of protocols. Finally,
    it provides tools to support complex layouts, wireless links (satellite connection),
    limiting the number of simultaneous client connections, limited memory configurations...


    Other features of pfSense include Network Address Translation (NAT), high availability
    configurations, including syncing between multiple instances, multi-WAN and load
    balancing, VPN connectivity with IPsec and OpenVPN, a PPPoE server, dynamic DHCP,
    DNS server and router distributions, and of course extensive monitoring, logging,
    the kitchen sink of firewall, and router distributions.


    pfSense is also extensible. There are many free packages that are available to
    help you roll-your-own set up a transparent proxy for addresses using BGP feeds,
    and more. The most popular packages are Snort, Squid, and SquidGuard.


    ## How does pfSense compare to other leading commercial firewalls? Does it do
    things differently?


    Of course, commercial firewalls are quite different. The functions and features
    of pfSense are on par with all commercial firewalls, but when you dig a little
    deeper there are two significant differences. The first of these is that total
    cost of ownership is lower with pfSense. Since pfSense is open source, there are
    no annual licensing fees traditionally demanded by commercial firewall vendors.
    The other differentiator is the source community. This community is formed of
    incredibly smart people who like to figure things out and then share what they''ve
    learned. The pfSense forum, documentation wiki and YouTube are three of the goldmines
    of information available for pfSense.


    ## How customizable is the software? Can users tailor it to their own?


    Since pfSense is open source, there are very customizations for those who want
    to make it yours. Large companies have incorporated pfSense in their commercial
    products to enable access control, VPN tunneling, load balancing and multi-WAN
    routing at individual level, with the pfSense version 2.3, graphical themes are
    based on CSS so you can change the look of the web GUI as much as you want. Beyond
    tailoring the look and feel, by tailoring built-in and available packages, you
    can mix and match to meet your specific firewall needs. Configuration is easy
    and there are online guides for most of what you need to get started. It is not
    as hard as it with a hardware or go deep into us


    End users can run pfSense on a wide variety of x86 platforms, supported by many
    providers. We have recently reviewed previews of our hardware platform for small
    installs, and you''ll also see some range servers for larger enterprises. Since
    customers have different requirements, we have a range of desktops and servers
    to match.


    ## Are there any hardware requirements for running the software?


    For small businesses and home users, we recommend a 64-bit CPU with a minimum
    of 1 GB RAM. We recommend increasing these resources as your demands increase.
    Overall system requirements depend on the amount of traffic flowing through the
    system, how many simultaneous connections are required, the security and severity
    of external attacks which features are in, and which additional packages, if any,
    are loaded. We are happy to provide a recommendation based on specific requirements,
    just come us


    We use and test primarily on Intel C2000 (Relay Atom) systems by Netgate. The
    pfSense software on Netgate is commercially supported


    ## Choosing the right hardware


    While pfSense can be installed on a wide range of hardware, in its current state
    is only supported on x86-64 architecture. With that, it''s well worth choosing
    the best hardware for your needs. The top of the crowd, and the pfSense-2540 Gateway
    appliance: is a dual-cost solution with high performance technology that also
    brings on board


    ## By tailoring the built-in and available packages, you can mix and match to
    meet your specific firewall needs


    Netgate, systems are made in the USA and have AES-NI compatible platforms for
    various uses. These systems are supported on VPN connections. The pfSense-2500
    can be used to configure or extend an existing firewall, LAN or WAN route with
    high performance. In your business, it''s easy to tailor pfSense to closely match
    your Sense-2540 and high performance networking needs.


    We also have cloud and virtual options for AWS, Azure, and VMware. All are free
    to get started with and provide cost-effective site-to-site tunnels, from cloud-to-cloud
    integration between Amazon or Azure regions.


    You can also find recommended hardware for the pfSense, they are specially tailored
    to work with pfSense software?


    Yes. We have custom-built hardware tuned to maximize the capabilities of pfSense.
    The hardware is designed for high reliability, low power consumption while taking
    advantage of all that pfSense has to offer. Discover more from us or our since
    this is our first effort on ARM, and we are very excited. We are targeting September
    2016 for availability.


    ### How are secure for the software? How is the software finding vulnerabilities
    and removing them?


