    ![](img/5f89d575ba10642195ede1686f72dbb1_86_2.png)

    ![](img/5f89d575ba10642195ede1686f72dbb1_86_3.png)


    ## Pros

    - Gain access to otherwise wasted pins, move hardware elsewhere on the project,
    debug communications through access to CSI and SDI pins


    ## Cons

    - Push-pin mounting hardware difficult to remove


    ## Summary

    Not everyone with a HAT will benefit from the Black HAT, especially those who
    only have one board, or don''t use a HAT at all, or for any purpose. However,
    expanding the capabilities of a HAT, build your own with extra GPIO communications,
    the Black HAT is a must-have.


    ![](img/5f89d575ba10642195ede1686f72dbb1_86_4.png)


    ## Xubuntu 16.04


    ![](img/5f89d575ba10642195ede1686f72dbb1_87_0.png)


    ### DISTRO

    Xubuntu 16.04


    Xubuntu has had a great track history, but this latest update misses the mark.
    Very few distros can claim the longevity that Xubuntu has managed to achieve in
    its years of pleasing users around the world. While it has never really been touted
    as one of the primary distros out there, it can certainly boast a fairly hefty
    user base. That said, the updates with buggy software, bare desktops and problematic
    installations have been relatively common problems brought up in many forums.


    The recent 16.04 looks to have addressed lot of these problems on paper, but in
    use there''s still some quick fixes. However, Installation is one of the highlights
    of Xubuntu in the latest update, with Secure Boot creating partitions not taking
    long as a whole just under 20 minutes, which is relatively quick; booting up Xubuntu
    16.04 for the first time highlights some of the issues that we faced in previous
    updates.


