    ## The complete security toolkit Kali Linux


    Kali Linux is a Debian-derived Linux distribution designed for digital forensics
    and penetration testing. Kali Linux is preinstalled with over 300 penetration
    tools, such as nmap (packet scanner), Wireshark (a packet sniffer), John Ripper
    (a password cracker) and many others. The point of Kali Linux is that you can
    test the vulnerability of your network and then secure it.


    Kali Linux is a comprehensive platform to identify, and exploit the vulnerabilities
    in the target environment. With Kali Linux, you can apply appropriate definitions
    and methodology with a scheduled test plan, resulting in a successful penetration-testing
    engagement. Kali Linux does many things, but is best known for penetration test,
    or "hack", Kali WPA and WPA2 networks.


    > There is only one way that hackers get into your network, and that is with a
    Linux-based OS and a wireless card capable of monitor mode


    only one way that hackers get into your network, and that is a Linux-based OS
    and a wireless card capable of monitor mode. Note that, Kali Linux is not de-facto
    for beginners. Playing with it requires basic knowledge of how to use WPA authentication,
    and familiarity with Kali Linux.


    Note that Kali Linux is packed with a ton of software for securing security holes
    in your network. A few of the popular tools are Aircrack, Abuse and AARPpoof.
    Kali Linux has other tools that are among the best security and penetration testing
    tools. Kali Linux is used by security professionals and professionals. Professionals
    use it for analysing vulnerability systems and networks, for forensic analysis,
    for finding exploits, and for applications testing.


    ## Protect against viruses ClamAV


    ClamAV is a popular open source antivirus software that has found its place in
    various roles including security and e-mail scanning. It supports most popular
    UNIX operating systems (GNU/Linux, Solaris, FreeBSD) and can scan your servers
    and files for weaknesses. The best way to use ClamAV is when a potential security
    threat is identified, will prompt you on how to resolve that issue.


    Once you install and configure ClamAV, you can use the available unit to check
    whether the completed binaries work on your system. The Clam-clamd is a multi-threaded
    daemon and it uses libam to scan the files for viruses. The end user will configure
    the daemon through the configuration file clamd.conf. Some of the popular commands
    recognized by this daemon are Ping, Shutdown, which performs a clean exit, and
    Scan file, which scans a file or a directory respectively.


    ![](img/5f89d575ba10642195ede1686f72dbb1_20_0.png)


    ## Stay behind a firewall IPFire


    When you are creating a new firewall rule, you need to be clear with the host
    and the destination IP addresses (or hosts), and with any other firewall, there
    can be three possible actions for any rule: ACCEPT, DROP and REJECT.


    Firewall rules are grouped into three sections: forwarding rules, incoming connections
    and outgoing connections. You can enter a number, at which position the new rule
    will be evaluated from top to bottom, the order of rules matters a lot. The rules
    are processed from top to bottom. The first rule that matches (where source, destination
    and all others are equal with those in the packet that is currently processing)
    is executed and all rules thereafter are not evaluated anymore.


    With the help of a checkbox, you can activate a rule. You can enable the log option
    so that logs will be populated for debugging purposes. You can see these log messages
    at `/var/log/messages` on your IPFire filesystem.


    ![](img/5f89d575ba10642195ede1686f72dbb1_20_1.png)


