    # Tutorial Bash masterclass


    Giving people jobs without a progress indicator leads to burnout. This problem
    can be solved by putting a "running tally" into the subject line.


    For this information, the number of files to be processed - it can be gathered
    by iterating over the contents of the files array before the sending process.


    ```

    fileCount=

    for in ''ls .mp3''

    done

    fileCount=$($fileCount+1)

    done

    ```


    With that, we are ready to create a second version of the script:


    ```

    fileNow=1

    for in ''ls .mp3''

    done

    echo "$emailTitle $fileOf

    $fileCount"

    echo "$file"

    fileNow=$($fileNow+1)

    done

    ```


    Running it on today counts both MP3 and non-MP3 files yields the results in the
    figure - by file name and email subject ready for deployment.


    # Power of the Thunderbird


    Many - not most show skills working by connecting Unix options to one another.
    We will handle the email dispatch via Thunderbird. The command line parameters
    are available on the internet at sites like https://kb.mozilla.org/Command_line_arguments_%26_Thunderbird%29
    and https://developer.mozilla.org/en-US/docs/Command_Line_Options.


    Sending the email can be accomplished by an invocation string; which is when you
    run the command line. Using the information from the above sites tells us that
    the attachment must be qualified; finding the current working directory is achieved
    with a trick like:


    ```

    for in ''ls .mp3''

    done\mailsubject="$emailTitle $fileOf

    $fileCount"

    fullpath=$(readlink -f $file)

    fileNow=$($fileNow+1)

    done

    ```


    The actual determination of the path is accomplished via the readlink command.
    It follows a symbolic link or a file, and returns the "root" to the element at
    the end of the inheritance hierarchy.


    Some examples show how to use the local keyword. In theory, it is used to limit
    a variable. In practice, using outside of a function is strongly discouraged for
    compatibility reasons. The next steps involve creating the actual string, which
    is then passed to Thunderbird:


    ```

    do

    pullpath=$(readlink -f $file)

    thunderbird --compose

    unto="example.com"

    subject="$emailsubject"

    attachment="$fullpath"

    done

    ```


    ```

    do

    fileNow=$($fileNow+1)

    done

    ```


    By default, the Thunderbird task exists will halt the script until the newly generated
    email is closed; adding an attachment at the end of the file allows Thunderbird
    to spawn the thread asynchronously and keep running the script.


    With that, the exercise is complete. Running Thunderbird shows a "window tree"
    - clicking the button a few times ensures the files are on the way to the coordinating
    office.


