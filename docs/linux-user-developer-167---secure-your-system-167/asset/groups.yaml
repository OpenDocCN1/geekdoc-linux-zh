    linker/loader:


    ```

    #include <stdio.h>

    #include <stdlib.h>

    #include <string.h>

    int main(int argc, char **argv[]) {

    char *p = malloc(6);

    if (p) {

    memcmp(p, "GLIBC", 6);

    printf("%%s\n", p, p);

    free(p);

    }

