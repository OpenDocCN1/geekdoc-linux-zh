  md: '# Tutorial


    # # Make a Ras Pi-poweredndigital picture frame


    Use a Raspberry Pi to create your fully configurable digital picture frame, complete
    with touchscreen display


    ![](img/5f89d575ba10642195ede1686f72dbb1_73_0.png)


    Christian

    Clay


    Christian is a former IT and software engineer and since 2010 has provided advice
    and insight into computer and mobile software online and in print. He covers Raspberry
    Pi and Linux at makeuseof.com.


    Digital picture frames that display a selection of your favourite photos were
    quite popular for a time, but are now seemingly available as free gifts when signing
    up. These tablet-like devices often made for low memory, poor user interface,
    or offline only. One of the problems with this project is getting to set up some
    photo-displaying software, connect a touchscreen display, in a suitable stand,
    and sit back to enjoy the results. Still, with this set-up, we''ll be able to
    pull images from both online and offline sources, giving us great variety.


    # 01 Prepare your Pi


    You''ve saved a lot of time with this project if you ensure that wireless networking
    is set up, and SSH is enabled. Both via the Raspberry Pi desktop – you''ll find
    the new Menu Preferences, where you can connect SSH in the Interfaces tab.


    # 02 Connect the display


    With a towel to dry your scratches, connect the Raspberry Pi to the back of the
    7" Touchscreen display, making sure all cables are connected correctly. (Older
    releases require you to connect and mount the display board.) Secure with screws,
    and mount in stand.


    ![](img/5f89d575ba10642195ede1686f72dbb1_73_1.png)


    # Grab

    from the

    web


    # What you''ll need


    You don''t feel restricted by the photos you display on your Raspberry Pi picture
    frame. Options exist for you to pull from popular web services like Flickr or
    Facebook. To build this you''ll need a dedicated Raspberry Pi, which has already
    been written for you. Neal Clay''s GitHub to download them, but don''t add the
    scripts until you''ve confirmed they work.


    +   - Raspberry Pi 2 or 3 with

    Raspberry Jessie

    - Wi-Fi dongle

    (if using Raspberry Pi 2)

    - Display (7-inch)

    (Waveshare or official recommended)

    - Phillips screwdriver

    - Frame and stand (suitable

    options for the official touchscreen

    are available at Pimoroni and

    other Raspberry Pi hardware and

    accessory supplies)

    - Scripts from https://github.com/

    samuelclay/Raspberry-Pi-Photo-

    Frame


