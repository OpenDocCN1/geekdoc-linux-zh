    In this tutorial, we are going to work through everything from choosing the right
    hardware for your NAS, installing your Linux distribution and connecting your
    NAS and non-clients. Linux is incredibly versatile - it runs on a wide range of
    hardware and has a huge number of different ways of what you are trying to achieve.
    We will also talk about what is important when setting up Linux, it can perform
