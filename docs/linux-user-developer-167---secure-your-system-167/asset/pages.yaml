    # WEB


    # # Amazon debuts new runtime application model


    The highly regarded Amazon Web Service has announced new open-source project creating
    a serverless, runtime application environment that can be of benefit to all developers,
    enhancing how applications scale.


    Speaking at the ServerlessConf in Brooklyn, Tim Wagner, GM of AWS Services,, "We
    are now in the early and dev stages where this ecosystem is growing and enabling
    companies to start their own projects. For the next stage, we want to get a mass
    of developers who are using a self-filling tool that is driving vibrant ecosystems."


    Want into another detail: Flourish went useful for developers, being partnered
    with ecosystems and all their repositories available for download on GitHub, but
    it is also a tool that is still in flux. The concept will need to be helped out
    as: "As we go up the stack, we are in need of more solutions for scaling, for
    splitting a video, or running facial recognition paradigms." Flourish will be
    launched as a project on GitHub in the coming months, which will be freely available
    for anyone to access.


    Named Flourish, the project looks to highlight the simplicity of serverless environments,
    which can be scaled to not miss server capabilities. Other benefits include being
    able to code in their preferred language, thanks to the runtime being open, and
    not having to pay for using computing power.


    > We are going need more solutions at the application-inspired level


