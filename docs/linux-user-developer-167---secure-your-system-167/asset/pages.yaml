    # KERNEL


    # # Finally! Orange FS and cgroup get support in 4.6


    The latest Linux kernel update unveils frequently requested features


    After two months of development, the highly anticipated 4.6 release of the Linux
    kernel is now available for download. Through his release notes, Torvalds discussed
    that this release was better than many previous updates, with an array of new
    features that have been frequently requested by users "The 4.6 kernel on the whole
    was a fairly big release - more than we had in, but it felt all maine despite
    that," noted Torvalds.


    One said feature is the new distribution system, named Orange FS. The integration
    of cgroup is complete to manage leading systems currently out, it also improved
    support for 802.1AE MACsec encryption and out of memory handling. In addition,
    it provides an safer user experience, without over-complicating anything.


    Also at the core of Linux 4.6 "Changed" is the improvement of namespaces. The
    ways in which the kernel has been criticised, but with the addition of namespaces,
    processes can be isolated more easily. There''s now a there in place


    kernel has dealt with container spaces criticised, but with the addition of namespaces,
    processes can be isolated more easily


    ![](img/5f89d575ba10642195ede1686f72dbb1_7_0.png)


    | Kernel Module | OrangeFS | Other OS Source Interfaces | Direct Interface | FUSE
    |

    |---|---|---|---|--|

    | Linux Programs | | | | Linux Programs | Linux Programs |

    | User Microservices | | Web-Interfaces: WebAPI, SLB, REST | NEST Cells | User
    Microservices |

    | Requested features | | 53 Cells | Linux Kernel | |

    | Client Area | | Orange FS | Orange Kernel | Direct Interface | FUSE |

    | PVS Library | | | PVS Library | PVS Library |


    ![](img/5f89d575ba10642195ede1686f72dbb1_7_1.png)


    | ROSKO (MPC) | Hadron |

    |---|---|

    | MPI Programs | Kernel Management |

    | API Library | |

    | BROWSE-with-cgroup | Orange FS |

    | ROS2 Client | Direct Interface |

    | PVS Library | PVS Library |


    ![](img/5f89d575ba10642195ede1686f72dbb1_7_2.png)


    Support for Orange FS-based cells will help integration within Linux and external
    hardware


    In a recent interview with linux.com, Linux founder Greg Torvalds stated that
    these updates are the part of the new wave that users need.


    "We''re running all enough hours now, 24 hours a day, to keep up. It''s one bug
    to fix, ten another, but we also need to add more features for the users we are
    serving."


    While Orange FS takes the headlines, embedded machines are also getting a noticeable
    boost in the


    4.6 Update. For 13 new ARM-based SoCs we integrated with Linux communication at
    the top of list of manufacturers. For the


    with a number of compatible devices, including the Raspberry Pi-computer and high-end
    Wi-Fi routers. 64-bit architecture is also getting some Chrome with performance
    enhancements that help support key areas of the desktop.


    The next development release of Linux will have much better kernel ARM integration.


    For the upcoming release of Linux 4.7, head across to https://linux.com/2016/05/18/.
    It is also noted that


    the early early Linux 4.7-1c is


    available now with improvements, including a new Silicon DRM driver, DisplayPort+
    dong dongle for HDMI adapters and support for AMD''s


    integration range of GPU. A final release of Linux 4.7 is not expected until August,
    so


    they won''t get excited just yet.


