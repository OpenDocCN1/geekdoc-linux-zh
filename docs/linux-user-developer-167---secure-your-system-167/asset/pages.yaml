  md: '# Visualise music in Minecraft

    with the PianoHAT


    # Combine code, Minecraft and the PianoHAT to play

    music and create a visualisation of the melody


    Pimonori has created the PianoHAT, the ultimate mini

    musical companion for your Raspberry Pi. It is inspired by

    Zachary Laiman''s PianoHAT and made with his blessing.

    HAT consists of a dinky eight-key piano add-on, with touch-

    sensitive keys and LEDs.


    It can be used for many creative and musical purposes,

    as as playing music in Python, controlling software

    synths on your Raspberry Pi, taking control of hardware

    synthesizers and more.


    ![](img/5f89d575ba10642195ede1686f72dbb1_69_0.png)


    This tutorial will show you how to set up the hardware,

    introduce you to the basic features of the software and show

    how to use them together in Minecraft to create

    music blocks and a visualisation of your melodies. You can

    view a demonstration video here: https://www.youtube.com/watch?v=eljJqQI0MPk


    Dan Alfred

    Raspberry Certified Educator

    as a lead teacher

    He is passionate about creating

    demos and uses projects like this

    to show the students that he

    tached the winning team of the

    Astr School Contest

    and his students'' code

    as being run around

    the ISS

    appeared in the

    teacher''s TV advert.


    # 01 Starting up


    Pimonori has made it extremely easy to install

    the software for PianoHAT. Assuming you have not

    connected your Raspberry Pi, simply attach the board and boot up

    your Raspberry Pi. type: Load the LX Terminal and update the

    software:


    ```

    $ sudo apt-get update

    $ sudo apt-get upgrade

    ```


    Type the following line to install the PianoHAT libraries:


    ```

    $ sudo curl -sSL get.pimonori.com/pianohat | bash

    ```


    Follow the instructions displayed. This will now download the

    required libraries and a set of programs to try.


    # What you''ll need


    +   - PianoHAT

    - Raspberry Pi


    ![](img/5f89d575ba10642195ede1686f72dbb1_69_1.png)'
