  md: '# Key Security Concerns


    # Issues for Linux Admins


    The problem with security advice is that there is too much of it and that those
    responsible for security certainly have too little time to implement all of it.
    Determine what the biggest risks are and to worry about those first and others
    as time permits.


    # Weak passwords


    People''s choice of passwords continues to pose a huge security risk. Weak passwords
    are a general security concern in the Linux environment. Make it practice to use
    public keys to allow access to your system without using any password. Or at least
    pick a better password for your ssh.


    # Open network ports


    Just as every account on your system is a potential target, every network service
    is a road to it. Use the network firewall to restrict unnecessary services that
    are running. If there are services running that you do not want to be provided
    by this, disable them. Maybe there is a program that can be exploited on that
    port.


    # Old software versions


    Linux and UNIX are not perfect. People find vulnerabilities every month. Your
    challenge is to always stay updated. One of the advantages of Linux is that when
    a fix is issued, it is quick to install. Thus, it is always better to have the
    latest version of software you need.


    # Insecure programs


    The use of insecure programs (such as FTP, rsh, NFS) or others in then controlled
    situations, and failure to configure other programs properly can be a major security
    concern. It is common for security administrators to configure programs incorrectly.
    Many programs are secure only if configured properly.


    # Stale accounts


    It is important to understand that each account is a possible entry point into
    your system. If a stale account password will not be changed, it leaves a hole
    that can become a bottleneck. Also, make it practice to disable all unnecessary
    accounts that exist on the system.


    > Just as every account on your system is a potential path for a password cracker,
    every network service is a road to it


    Securing your Linux system means restricting access to the user accounts and systems
    that you have. After that, securing that no one has gone the defences that you
    have set. Ubuntu, Debian and other systems based on Linux distributions are designed
    to be secure by default. There means that there are no user accounts with blank
    passwords and most network services are off by default.


    While many tools are available for securing your Linux system, the first line
    of security with commands such as sudo and password are the standard tools for
    setting up user and group accounts. Most security breaches outside of your organisation
    can come from accessing your system on networks connected to the internet. Setting
    up firewall provides the facility features that are built into the Linux kernel.


    During most installation procedures, you may be asked to assign a password to
    root. Think about your choice of a password as well. If you need multiple administrators
    for a system, it is better not to share a single root password among many people.
    Instead, use sudo to give access to users who will be authenticated with their
    password. Once Linux is installed, you can use commands or tools to manage many
    users, modify users and assign and change passwords.


    ![](img/5f89d575ba10642195ede1686f72dbb1_18_0.png)'
