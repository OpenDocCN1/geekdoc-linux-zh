  md: '![](img/5f89d575ba10642195ede1686f72dbb1_88_0.png)


    # # Ubuntu is built for its speed, and moving around the desktop is quick


    The desktop is very much on the blank side, and it''s easy enough to navigate,
    we would have liked to see a bit of flair to help it stand out. We could have
    been better served with a selection of default applications, which compared to
    the choice we had back in the 15.10 update, has been largely stripped back. We''ve
    found all its suspects: Firefox, Parrot, and Parole; but for other clients like
    VLC and GIMP, you''re going to need to also find and install them.


    One of the pleasant aspects of using with Ubuntu 16.04 was its relatively low
    resource usage. Despite not being explicitly marked as a lightweight distribution,
    with only 40MB of memory being used at there, it''s also minimal on the CPU which
    is quite a touch. What this means for users is that Ubuntu is built for speed,
    not for fancy effects. As you''ve learned with the desktop to match it, it also
    helps with media playback and we had no trouble watching our favourite but did
    seem to find another issue. In this instance it was with the package management
    front end. While many of us are accustomed to the Ubuntu Software Centre, Xubuntu
    has implemented (GNOME) Software. It''s surprisingly difficult to find the pages
    you may actually need to install, and we found there was little


    if anything required an update. The whole idea of ''If it isn''t broken, don''t
    fix it'' comes terribly to mind here. Perhaps a lot of issues arise throughout
    Ubuntu 16.04, but they''re repeated issues with our Wi-Fi connectivity which has
    been dropped, and in another instance we found our mouse pointer disappearing
    sporadically. But the most frustrating was the lack of support for smartphones.
    Hardware where we seemed to have problems with connecting speakers and connecting
    to everything working as it should be. It''s some issues that really do not matter
    and others are things coming from both new and established distributions. Of course,
    like this will be removed in later updates, but the overall experience was disappointing,
    considering that this is a real problem.


    We couldn''t help but feel a little disappointed by what we were able to do. It
    means it is a complete work, but there are plenty of minor, issues that need to
    be ironed out. If you''re checking out if your hardware requires a low resource
    usage you can install in minutes, but most should hold off for now.


    # ## Pros


    An installation system is a highlight, but we especially love its minimal impact
    on our RAM and CPU


    Lots of issues that happen when the user is older, and power management options


    # ## Summary


    We don''t doubt that Xubuntu will be quick of mark to eradicate all the bugs that
    users are facing. Regardless, we''re still questioning some of the changes made
    here, and in its current state, worth looking elsewhere.


    +   * Oliver Hill


