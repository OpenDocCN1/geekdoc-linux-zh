    If you want to dedicate your machine to running a Linux distribution, the popular
    FreeNAS based on FreeBSD is a great choice. FreeNAS is easy to install and run
    on virtually any hardware—both in the home and in the enterprise.


    FreeNAS includes the ZFS file system and is well documented. It also includes
    a full web interface, a wide range of storage protocols, ''snapshots'' for managing
    changes and advanced replication, to mirror the contents of your server.


