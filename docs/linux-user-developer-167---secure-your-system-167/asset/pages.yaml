    The next command adds an IP address to eth0:


    ```

    $ ip addr add 192.168.1.2/24 dev eth0

    ```


    The following command deletes the previously assigned IP address from eth0:


    ```

    $ ip addr del 192.168.1.2/24 dev eth0

    ```


    # The ip command perform many things and do the job of many existing command line
    utilities, including netstat, arp, route and ifconfig


    The ip command does even more than the ones presented in this tutorial: configuring
    and configuring rules, managing multiple IP addresses in a network interface,
    MAC address of a network interface, and dealing with multicast addresses.


    ip-command handles both IPv4 and IPv6 addresses. By using the -4 or -6 option
    you can display only IPv4 or IPv6 information.


    ![](img/5f89d575ba10642195ede1686f72dbb1_40_0.png)


    # 03 The ip command


    Your Linux routes its TCP/IP traffic is very important because configured routing
    table can isolate your Linux machine from your local network and the internet.


    Usually, you will not need to change your routing table. However, the inspection
    of routing table should be done if you find a Linux machine with multiple interfaces
    has connectivity issues. You can view the route of your machine with the following:


    ```

    $ ip route

    ```


    You can get a more detailed output with the next version:


    ```

    $ ip route show local

    ```


    You can change the default route of your Linux machine as:


    ```

    $ ip route default via 192.168.x.y

    ```


    Please use the following command with extra care because a wrongly defined route
    – also as gateway – can limit the connectivity of your Linux system.


    If an ip command makes changes to your Linux system, you will likely need root
    privileges to execute it. Otherwise you will get an error similar to the:


    ```

    $ ip route default via 192.168.1.1

    ```


    # 04 The /sbin/rtmon command


    The rtmon utility is used for monitoring the state of network devices and storing
    them to a binary file, as:


    ```

    $ /sbin/rtmon file /tmp/rtmon.log

    $ ip -l /tmp/rtmon.log

    --route- 1 interface eth0 mtkoute gateway May 18 10:33:02 /tmp/rtmon.log

    ```


    ```

    $ file /tmp/rtmon.log

    # /tmp/rtmon.log: data

    ```


    As you can see, this shows the output of rtmon out to the /tmp/rtmon.log file.
    You can catch IPv4-only with the -4 option and IPv6-only with the -6 option. The
    difference between rtmon and ip is that rtmon writes its output to a binary log
    file instead of displaying the information on screen. The ip monitor allows you
    to display the contents of a log file generated by rtmon.


    ```

    $ ip monitor file /tmp/rtmon.log

    ```'
