  md: '# Picture frame


    The Raspberry Pi is connected to the back of the touchscreen display ready to
    power on this project


    ![](img/5f89d575ba10642195ede1686f72dbb1_74_0.png)


    # Prepare your photos


    Naturally, you''ll need a collection of photos to display on the Pi-powered digital
    picture frame. We have different options (here see below) but we recommend using
    photos stored on your Pi that have been copied via USB, via a network drive, or
    downloaded through your browser.


    ```

    sudo nano /home/pi/start-picture-frame.sh

    ```


    Add the following:


    ```

    # /bin/bash

    DISPLAY=0 XAUTHORITY=/home/pi/.Xauthority /usr/bin/fe -p -Z -f R -60 -Y -D 15.0
    /media/STORAGE/test

    ```


    Exit and save, then test with:


    # Set up your picture frame


    To configure Raspberry Pi as a picture frame, we first need to prevent the screen
    from switching off. This means editing the lightdm.conf.


    ```

    sudo nano /etc/lightdm/lightdm.conf

    ```


    # Make your picture frame run at boot


    The script can now be set to run at boot.


    ```

    sudo nano /etc/rc.local

    ```


    Add this line [SeatDefaults]:


    ```

    xserver-command=X -s 0 -dpms

    ```


    When done, save and exit with Ctrl+C, then reboot:


    and before exit 0.


    ```

    sleep 10

    pi -c ''/bin/bash /home/pi/start-picture-frame.sh''

    ```


    ```

    sudo reboot

