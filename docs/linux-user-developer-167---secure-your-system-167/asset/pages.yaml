  md: '# Tutorial


    Motor controllers are driven with a PWM (Pulse Width Modulation) signal generated
    by the Pi or an add-on board. It''s a good idea to buy one or two spare motors
    for each project – and be kind to them because they can be misused. The Zumo chassis
    uses micro-geared motors from Pimonori.


    # # PARTS LIST


    We sourced most of these components from Pimonori around £35. We assume you already
    have your Raspberry Pi Zero, microSD card and few AA batteries in the back of
    a drawer.


    +   * £15.00 Pololu Zumo chassis

    * £10.00 Explorer pHAT

    * £10.00 2x Metal-gear motors

    * £2.00 Battery LEE (x8)


    ![](img/5f89d575ba10642195ede1686f72dbb1_77_0.png)


    ![](img/5f89d575ba10642195ede1686f72dbb1_77_1.png)


    ![](img/5f89d575ba10642195ede1686f72dbb1_77_2.png)


    ![](img/5f89d575ba10642195ede1686f72dbb1_77_3.png)


    ![](img/5f89d575ba10642195ede1686f72dbb1_77_4.png)


    # ## The motor controller


    The type of motor and its peak current will dictate the choice of motor controller.
    For small motors, a cheap chip like the L298N may well suit your needs. PiBorg
    produces a much more efficient board which can drive large loads, with the cost
    will increase to around £30.


    # ## Power source


    It is best to run your motors and circuits from two separate sources. This helps
    isolate the Pi, motor controllers and sensors from potential surges. For the experienced
    user, LiPo batteries are recommended, but we must warn that all notices must be
    read and followed before charging or handling them. USB power banks, AA batteries
    and Ni9V batteries.


    # ## Understanding gear ratios


    The gear ratio is the ratio of input speed to output speed. For instance, 35:1
    means the motor shaft (driver) turns 35 times as fast as the drive shaft (where
    the motor is mounted). The higher the ratio, the more torque you get.


    With the Dagu Thump 4WD robot (available at robosavvy.com) a ratio of 34:1 gives
    a top speed of 4.5mph with a stall torque of 5kg-cm, in contrast to 75:1 with
    a lower top speed but higher torque of 11kg.


    For more detailed info, check out the gear deck from Physics: https://bodyphysics.org/Robotics/_Gears_and_Gear_Ratios/


    # ## Get your running motor


    # ## Controller/input options


    Brushless motors for RC-cars typically run at high speeds and make your robot
    easily fast at travelling in a straight line, but hard to control over obstacle
    courses and for autonomous navigation. Brushed motors can be driven with a motor,
    but you must refer to the stall current of the motor when choosing the.


    Most robots will need input from a joystick or gamepad. We have had good success
    with Jimiethos and PS3 controllers which use Bluetooth. The Xbox 360 and PS2 controllers
    would work but adds complexity and draws more current than a Bluetooth adapter.
    Separate to separate your code into different classes so that you can swap controllers
    in the future.'
