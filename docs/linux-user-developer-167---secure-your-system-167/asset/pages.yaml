    # # On your free DVD this issue


    # Find out what''s on your free disc


    **Welcome to the Linux User & Developer DVD.** This issue helps you lock down
    your system and network with the best tools a sysadmin can have. From vulnerability
    scanning to packet sniffing, this complete toolkit has everything you need to
    protect your data and test your security. Take control of your system and banish
    risks for good!


    ![](img/5f89d575ba10642195ede1686f72dbb1_5_0.png)


    # Load DVD


    To access software and tutorials, simply insert the disc into your computer and
    double-click the icon.


    # Live boot


    To live-boot the distros supplied on this disc, insert the disc into your drive
    and reboot your computer.


    # Featured software:


    +   Please note:

    * You need to ensure that your computer is set up to boot from media; check your
    computer''s BIOS screen to change Boot Options.

    * Some computers require you to press a key when booting from disc; check your
    manual or our website to find out if this is the case.

    * Live-booting distros run from the disc; they will not be installed on your computer
    unless you choose to.


    ![](img/5f89d575ba10642195ede1686f72dbb1_5_1.png)


    # Kali Linux


    This security testing distro for Linux users will help you to map your system
    and network vulnerabilities. This distro boots from the disc or can be installed
    onto your system.


    ![](img/5f89d575ba10642195ede1686f72dbb1_5_2.png)


    # ipFire


    A professional and hardened Linux firewall distribution that is secure, easy to
    operate and has functionality for really, enterprises and anyone alike. This distro
    installs from disc; ensure you have backed up your data before partitioning and
    installing.


    ![](img/5f89d575ba10642195ede1686f72dbb1_5_3.png)


    # For best results:


    This distro has been optimized for maximum rendering of recent updates to the
    HTML, and CSS standards. So to get the best performance we recommend you use:


    +   * Internet Explorer 8 or higher

    * Safari 4 or higher

    * Chrome 5 or higher


    ![](img/5f89d575ba10642195ede1686f72dbb1_5_4.png)


    # chkrootkit


    Got root? Don''t get rooted. Check for signs of rootkit infiltrating your files.


    ![](img/5f89d575ba10642195ede1686f72dbb1_5_5.png)


    # Snort


    Sniff out security risks over your network with the complete intrusion detection
    system.


    ![](img/5f89d575ba10642195ede1686f72dbb1_5_6.png)


    # OpenSSH


    SSH is the premier connectivity tool for remote login with the SSH protocol; it
    encrypts all traffic to eliminate attacks.


    ![](img/5f89d575ba10642195ede1686f72dbb1_5_7.png)


    # nmap


    Nmap is for network discovery and security auditing. Many systems and network
    administrators find it useful.


    # Problems with the disc?


    Send us an email at imagine-publishing.co.uk. If you are having problems using
    the programs or resources provided, then let us know any relevant software comments.


    ![](img/5f89d575ba10642195ede1686f72dbb1_5_8.png)


    # Wireshark


    Wireshark is the world''s foremost network protocol analyzer that lets you see
    what''s happening on your network at a microscopic level.


