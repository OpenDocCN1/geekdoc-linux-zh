  md: '# Secure remote logins OpenSSH


    Connect to a PC remotely and securely


    OpenSSH is a very popular connectivity tool when it comes to remote login. It
    encrypts all traffic to eliminate any type of attack. For remote operations, it
    has ssh, sc and sftp. Key management is done with sshd, ssh-keygen and ssh-agent.
    From a server-side perspective, it offers sshd and ssh-agent. OpenSSH is a freely
    available version of the SSH protocol tools.


    > SSH key allow authentication between two hosts without providing a password.
    SSH key authentication uses a pair of keys


    ![](img/5f89d575ba10642195ede1686f72dbb1_28_0.png)


    # 01 Install OpenSSH


    Use the following commands for installing the OpenSSH server and client


    ```

    $ sudo apt install openssh-server

    $ sudo apt install openssh-client

    ```


    ![](img/5f89d575ba10642195ede1686f72dbb1_28_1.png)


    # 03 OpenSSH key generation


    SSH keys allow authentication between two hosts without providing a password.
    SSH key authentication uses a pair of keys - private and public. Use the following
    command to generate the keys:


    ```

    $ ssh-keygen -t rsa

    ```


    # 06 Check the daemon


    You can check whether the ssh daemon is running or not using the following command:


    ```

    $ ps -A | grep ssh

    ```


    ![](img/5f89d575ba10642195ede1686f72dbb1_28_2.png)


    By default, the public key is saved in ~/.ssh/id_rsa.pub while the private key
    will be in ~/.ssh/id_rsa


    # 04 Disable password authentication


    This can significantly improve your security. When you disable password authentication,
    it will only be possible to connect from computers you have specifically approved.
    In order to achieve this, it''s highly recommended, you just need to change the
    value of PasswordAuthentication directive in your configuration file. Do not forget
    to save your changes and restart your ssh server so that these changes will be
    effective.


    ![](img/5f89d575ba10642195ede1686f72dbb1_28_3.png)


    # 02 Configure SSH


    By editing the configuration file (/etc/ssh/sshd_config), you can configure the
    default behaviour of the OpenSSH server. Using the main pages of the file to get
    details about the configuration options used in your server. Once you have made
    changes to the configuration file sshd_config, you need to save and restart the
    sshd server application so that these changes will be effective.


    # 07 Log in from your own computer


    After verifying that your setup is working, you can log in from your own computer
    using the following command:


    ```

    $ ssh user@localhost

    ```


    ```

    $ sudo systemctl restart sshd.service

    ```


    You can see that the command prints a log of debugging information and will try
    to connect to your ssh server. You will be prompted to key-in your password and
    you should get another command-line when you type your password.


    # 05 Specify access


    Allowing or denying ssh access for a specific user or group of users can manage
    users with poor security practices do not need ssh access. In order to allow only
    users jane and eric to connect to your computer using SSH, you can simply add
    the following line to the configuration file


    AllowUsers jane eric'
