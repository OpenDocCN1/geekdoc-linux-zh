  md: '# The snort.conf file controls everything about what Snort does, how it defends
    itself from attack, what rules it uses to find malicious traffic, and how it watches
    for traffic that isn''t signed by a signature


    # 01 Install Snort


    Execute the command on your Linux terminal


    ```

    $ sudo apt-get install snort

    ```


    Once the installation is completed, you can check for a successful installation
    by


    ```

    $ snort -version

    ```


    # 02 Program dependencies


    A few programs are needed when you''re going to run Snort. They are: apache2 for
    the web server, mysql-server for the database, php5 for the server-side client,
    php-mysql, php-gd for graphics handling, and PEAR (PHP Extension and Application
    Repository). You apt-get install all of the programs.


    +   * apt-get install apache2

    * apt-get install mysql-server

    * apt-get install php5

    * apt-get install php-mysql

    * apt-get install php5-gd

    * apt-get install php-pear


    # 03 Required dependencies


    We need to create some directories required for the successful running of Snort.
    Use the following commands to create these files.


    +   * mkdir /etc/snort

    * mkdir /etc/snort/rules

    * mkdir /var/log/snort


    The snort.conf file controls everything about what Snort does, how it defends
    itself from attack, what rules it uses to find malicious traffic and how it watches
    for potentially dangerous traffic that isn''t signed by a signature. My goal is
    to understand how Snort works and how it can be configured to provide a successful
    deployment of Snort as an IDS in your environment. By default, the configuration
    file is located @ /etc/snort. If you need the configuration located somewhere
    else, you need to use -c switch with the file''s location.


    # 04 Execute Snort


    To execute Snort, use the following


    ```

    $ snort -c /etc/snort/snort.conf -var

    log/snort/

    ```


    If you want to only the TCP/IP packet headers to the screen, you can use


    ```

    $ /usr/bin/snort -v

    ```


    # 05 Generated alerts


    A alert file will be created in /var/snort directory. This file contains the alerts
    generated while Snort is running. All alerts are classified by the type of alert.
    A Snort rule specifies a priority for an alert. You can then filter out noisy
    alerts and focus on the most important ones. You can also run it as a daemon process
    using the -d option


    ```

    $ snort -0 -c /etc/snort/snort.conf -l /

    var/log/snort/

    ```


    If you want to start Snort sending SIGHUP to the daemon, you need to use the full
    path to the Snort binary when you start it.


    # 06 Packet logger mode


    In packet logger mode, the main idea is to record the packets to the disk. Specify
    a logging directory and Snort will automatically know how to get into packet logs.
    A simple command to operate in this mode


    ```

    $ snort -dev /log

    ```


    # 07 Network intrusion mode


    To enable network intrusion mode, use


    ```

    $ snort -dev /l -h HOME_NET -c

    /etc/snort/snort.conf

    ```


    Note that Snort is the name of the rule and HOME_NET is a variable which is defined
    in the configuration file. The rule set defined in snort.conf will be applied
    to each packet and a decision will be made. The default action is alert. conf
    references several other rules, so it is good to read the entire snort.conf file
    before calling it from the command line. If you are going to use snort over a
    long period as an IDS, do not use -v-switch in the command line for the sake of
    speed.


