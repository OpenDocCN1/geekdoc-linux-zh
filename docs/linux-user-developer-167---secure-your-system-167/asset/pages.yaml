    The ‘Hardware Attached on Top’ (HAT) makes the Raspberry Pi easier than ever to
    make use of its boards’ general-purpose input-output (GPIO) headers without wastage.
    HAT boards, by their very nature, take up the entire 40-pin header of the Pi to
    which they attach, even if they only need one or two few breakout connectivity
    for the unused pins.


    That''s where the Black HAT Hack3 shines. In traditional full-size and new Mini
    variants, the Black HAT Hack3r boards are as simple as they come: there are no
    active electronics present at all. Instead, you get an easy way to access or break
    two breakout pins to the port expanders of the 8-bit controller, minus


    the ability to switch between multiple inputs is simple: connect the either 40-pin
    cable, the same type used to connect various HATs to their controllers, to the
    Pi GPIO header, then drives the first row of pins on the header of the Black HAT
    Hack3r. You can attach any HAT device to one of the two headers on the full-size
    model, while the Mini variants support the Pi Zero-model mini-HATs on the mini
    header - and still have a complement of 40 pins for additional devices.


    The cavat, of course, is that with no hardware on board not all the pins will
    be available. This is both a blessing and a curse: if two devices need to use
    the same GPIO pins at the same time, the Black HAT Hack3r boards won''t help


