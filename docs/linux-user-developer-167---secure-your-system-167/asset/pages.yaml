    # Setting up a VPN


    It''s as simple as turning on a switch, no really. TunnelBear''s simplistic UI
    includes more than a switch, which contains an automatic VPN connection default
    settings. Additional customizations to improve your VPN are possible, but are
    minimal compared to both CyberGhost and Private Internet


    # Setting up a VPN


    CyberGhost for the first time shows all of its core features in one place, which
    can be a little daunting. It does, however, showcase everything you could possibly
    need for setting up your VPN, with each tool having a little easier to explain
    what to do. Of course, users connect to a VPN with defaults in a few seconds.


    # Connection options


    Choices are relatively small in this department and the server list is too barebones.
    Finding a working server is entirely possible, but there''s little you if a server
    goes down. We like TunnelBear''s simplicity, but there''s a list more thorough
