  md: '# Feature Security Toolkit


    Search for predefined patterns

    The patterns are defined as Snort rules. Snort can report its findings in a number
    of output formats. Some of these formats include syslog, topdump, database, alert,
    and unified. Unified output is considered the best method and hence used widely


    ![](img/5f89d575ba10642195ede1686f72dbb1_23_0.png)


    Command line options

    Snort comes with a variety of command line options. Some of the options can be
    specified in the config file instead of the command line. The general rule is
    that if you are just trying something out, specify the setting on command line,
    and if you are planning on keeping the setting for a while, set it in the config
    file


    # Detect intruders Snort


    Monitor traffic in real time

    Snort scrutinizes every packet to see if there are any payloads. It can also be
    used to perform protocol analysis, content searching and matching. It is used
    to detect various types of attacks such as port scans and buffer overflows on
    Linux, Unix, and all BSD operating systems. It does not require you to recompile
    your kernel or modify any existing distribution, but it does not require that
    you have root privileges.


    > Snort examples network traffic against a set of rules


    Snort is intended to be used in the most classic sense of a network intrusion
    detection system. All it does is network traffic against a set of rules, the system
    administrator to monitor suspicious activity so that you can take appropriate
    actions. You can configure Snort three different modes: sniffer mode, logger mode
    and network intrusion detection mode. In sniffer mode, Snort will read packets
    and display them on the console. In logger mode, Snort will log the protocol information
    to the disk. In network intrusion detection mode, Snort will monitor the network
    traffic and analyze it against the rules defined by the user. Snort will then
    be able to take a specific action based on the outcome. It has a built-in real-time
    alert capability. Network intrusion detection systems are placed at certain points
    within the network so you can monitor the traffic and from all devices in the
    network. If an attack or an abnormal situation is identified, an alert can be
    triggered to take corrective actions as needed.'
