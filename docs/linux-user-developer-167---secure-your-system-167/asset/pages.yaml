    # Git 2.8.3 updates us in improved command support


    Over 20 improvements in the latest Git update


    Git, the popular source code manager, has released its third point release. Version
    2.8.3 shows many fixes and over 20 improvements to the stable 2.8 branch which
    is being used by the majority of projects currently using Git today.


    Within the update, users will find and enhancements to many core Git commands,
    including git send-email, git push, git submodule, git config, git replace, and
    git format. On this side, there''s some performance improvements,


    that its ORB portable apps are now fully compatible with Ubuntu 16.04. We can
    confirm that all flavours of Ubuntu will work with portable apps, including Lubuntu,
    Xubuntu and the other variants.


    ORB is an open-source package format, enabling users to use apps that can run
    on-the-fly, without the need for administrator privileges. Through the free ORB
