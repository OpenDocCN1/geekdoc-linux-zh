  \n# 第 15 章：排版与文字处理\n\n标准通用标记语言（或 `sgml`）并不是一种实际格式，而是用于编写标记语言的规范；标记语言“格式”本身被称为 `dtd`（“文档类型定义”）。\n\
  \n等等，Linux 上的各种 `sgml` 软件包目前处于过渡状态，而且已经有一段时间了。原始的 `sgml-Tools` 包（在另一个生命周期被称为 `LinuxDoc-sgml`；随后变为\
  \ `sgmltools v1`）不再开发。然而，新的 `sgmltools v2`（“sgmltools Next Generation”和“sgmltools\
  \ ’98”）在本书第一版时还是 Alpha 版本，`sgmltools-lite` 是另一个 `sgmltools` 的新子集。具有原始且易用的 `dtd`\
  \ 的旧 `Linuxdoc-Tools` 包仍然存在，似乎仍用于个人作者编写的小文档，例如多部分文章、`faq` 或白皮书。\n\n## 15.6 使用 sgml\n\
  \n如果你想深入并开始使用 `LinuxDoc dtd` 创建文档，这并不难。虽然较新的 DocBook dtd 在制作技术书籍和相关项目方面变得非常流行，但\
  \ `LinuxDoc dtd` 仍然很好用。`Linuxdoc-Tools` 包的名字来源于旧的 Linux Documentation Project，它们在文档中使用这种格式。在鼎盛时期，Linux\
  \ howtos 和较大的指南是用 LinuxDoc 编写的。通过 `Linuxdoc-Tools` 包，你可以从同一个纯文本文件编写文档并生成多种格式的输出——包括\
  \ `html`、纯文本、`pdf` 和 `PostScript`。\n\n当你使用 sgml dtd 编写文档时，你编写的是带有标记的纯文本输入。之前的示例文本将产生类似于图\
  \ 15-4 的表格。使用 `groff` 的 ascii 参数将输出一个漂亮的字符表，而 html 参数将输出一个带有该文件标记的 png 格式文件。你也可以用\
  \ `LaTeX` 制作漂亮的表格。对于良好的教程，请参考 *The LaTeX Environment* 第 5 章（参见附录 D [参考]，第 731 页）。\n\
  \n**注意：** 有关关于使用 `tbl` 的更多信息，请参见附录 D [参考]，第 731 页。这些文件是压缩的；如果你找不到副本，可以随时从 Debian\
  \ 软件包安装源码（参见配方 1.1 [配方格式]，第 3 页）。如果你想打印或转换它们，必须先解压缩（参见配方 8.4 [使用文件压缩]，第 196 页）。\n\
  \n这里有两种使用方法：\n\n* 要查看 `Linuxdoc-Tools` 指南的压缩文本版本，输入：\n```\nzless /usr/share/doc/linuxdoc-tools/guide.txt.gz\n\
  ```\n* 将 `Linuxdoc-Tools` 指南的 PostScript 版本副本打印到默认打印机，输入：\n```\nzcat /usr/share/doc/linuxdoc-tools/guide.ps.gz\
  \ | lpr\n```\n\n以下配方使用了 `Linuxdoc-Tools` 包，并演示了使用 LinuxDoc dtd 编写文档。\n\n### 15.6.1\
  \ 编写 sgml 文档\n\n使用 dtd 编写的文档看起来非常像 `html`，这并非巧合，因为 `html` 是 `sgml` 的子集。一个非常简单的“Hello,\
  \ world” `LinuxDoc dtd` 示例可能如图 15-5 所示。\n\n```\n<!doctype linuxdoc system>\n<article>\n\
  <title>示例文档</title>\n<author>Ann Author</author>\n<date>2000 年 5 月 4 日</date>\n\
  <abstract>\n这是一个示例 LinuxDoc 文档。\n</abstract>\n<sect>简介\n<p>Hello, world.\n</article>\n\
  ```\n*图 15-5. 一个 LinuxDoc “Hello, world.”*\n\n**注意：** `Linuxdoc--Tools` 包还带有一个简单的示例文件\
  \ `example.sgml.gz`，它安装在 `/usr/share/doc/linuxdoc-tools/example` 目录下。\n\n### 15.6.2\
  \ 检查 sgml 文档语法\n\n要确保 sgml 文档的语法正确，使用 `linuxdoc` 并将“check”作为 `-B` 选项的参数。这将输出在指定文档中发现任何错误。\n\
  \n* 要检查 sgml 文件 `myfile.sgml`，输入：\n```\nlinuxdoc -B check myfile.sgml\n```\n\n###\
  \ 15.6.3 从 sgml 生成输出\n\n使用 `linuxdoc` 从 sgml 源文件制作排版输出。将要生成的输出格式指定为 `-B` 选项的参数。\n\
  \n这些命令将生成与你提供的 sgml 文件相同基础的新文件，但文件扩展名为其输出格式的扩展。\n\n\n\n\n下表列出了各种格式参数，并描述了它们生成的输出类型。\n\
  \n`html`\n生成 html 文件。\n\n`info`\n生成 gnu Info 文件。\n\n`lyx`\n生成 LyX 输入文件。\n\n`latex`\n\
  生成 LaTEX 输入文件（可用于打印；首先按照方案 15.3.3 [处理 LaTEX 文件]，第 374 页所示通过方案 1 进行处理，然后打印生成的 dvi\
  \ 或 PostScript 输出文件）。\n\n`rtf`\n生成微软的“富文本格式”（Rich Text Format）文件。\n\n`txt`\n生成纯文本。\n\
  \n⇒ 要从 `myfile.sgml` 创建一个纯文本文件，请输入：\n```bash\n$ linuxdoc -B txt myfile.sgml\n```\n\
  `RET`\n此命令写入一个名为 `myfile.txt` 的纯文本文件。\n\n要从 sgml 文件生成 PostScript 或 pdf 文件，首先生成一个\
  \ LaTEX 输入文件，通过 `latex` 运行生成 dvi 输出文件，然后使用 `dvips` 处理该文件以生成最终输出。\n\n第 15 章：排版与文字处理\
  \ 391\n\n⇒ 要从 `myfile.sgml` 创建一个 PostScript 文件，请输入：\n```bash\n$ linuxdoc -B latex\
  \ myfile.sgml\n```\n`RET`\n```bash\n$ latex myfile.latex\n```\n`RET`\n```bash\n\
  $ dvips -t letter -o myfile.ps myfile.dvi\n```\n`RET`\n$\n\n在此示例中，`linuxdoc` 从 sgml\
  \ 源文件写入一个 LaTEX 输入文件，然后通过 `latex` 工具处理该 LaTEX 文件生成 dvi 输出，再通过 `dvips` 处理以获得最终输出：一个名为\
  \ `myfile.ps` 的 PostScript 文件，纸张尺寸为“美式信纸大小”（8.5 英寸 x 11 英寸）。\n\n要从 PostScript 文件创建\
  \ pdf 文件，你需要额外采取一步，使用 `ps2pdf`，它是 `gs` (Ghostscript) 软件包的一部分；这会将 PostScript 转换为\
  \ pdf。\n\n⇒ 要从 PostScript 文件 `myfile.ps` 创建一个 pdf 文件，请输入：\n```bash\n$ ps2pdf myfile.ps\
  \ myfile.pdf\n```\n`RET`\n\n## 15.7 使用其他文字处理器和排版系统\n\n下表描述了 Linux 下提供的其他建议文字处理器和排版工具。\n\
  \n### `AbiWord`\n一种适用于 Linux 系统的图形化、见即所得（wysiwyg）文字处理器。它可以读取 Microsoft Word 文件，据报道它在某些方面与那个著名的文字处理器相似。\n\
  \nDEB: `abiword-common`\nRPM: `abiword`\nWWW: `http://www.abisource.com/`\n\n###\
  \ `ImPress`\n一个功能齐全的、见即所得的布局桌面出版系统。\n\nDEB: `impress`\nRPM: `impress`\nWWW: `http://www.ntlug.org/~ccox/impress/index.html`\n\
  \n### `LilyPond`\n一个用于乐谱排版的系统。\n\nDEB: `lilypond`\nRPM: `lilypond`\nWWW: `http://lilypond.org/web/`\n\
  \n### `Maxwell`\n一个用于 X 环境的图形化文字处理器。\n\nWWW: `http://sourceforge.net/projects/maxwellwp`\n\
  \n### `OpenOffice.org`\n一个基于窗口的图形化“办公软件套件”，其中包含一个名为 `WRITER` 的文字处理器（以及电子表格、演示文、图表和数据库应用程序）。\n\
  \nDEB: `openoffice`\nRPM: `openoffice`\nWWW: `http://www.openoffice.org/`\n\n###\
  \ `PostScript`\nPostScript 语言本身。PostScript 通常被认为是由软件生成的格式，但有些人会直接编写 PostScript！方案\
  \ 15.2 [将文本输出到 PostScript]，第 359 页包含了从文本创建 PostScript 输出的配方，包括以特定字体输出文本。人们还编写了 PostScript\
  \ 模板文件来创建各种文档——从桌面日历到用于冥的曼荼罗。Debian 的 `cdlabelgen` 和 `cd-circleprint` 软件包包含了编写光盘标签的工具。此外，以下用于打印视频和音频磁带标签页的模板也值得关注；在文本编辑器中编辑这些文件，然后像处理任何\
  \ PostScript 文件一样查看或打印它们。\n\nWWW: `http://www.jwz.org/hacks/audio-tape.ps`\nWWW:\
  \ `http://www.jwz.org/hacks/video-tape.ps`\n\n### `Scribus`\n一种使用 Type 1 字体的简单布局和桌面出版系统。\n\
  \nDEB: `scribus`\nRPM: `scribus`\nWWW: `http://web2.altmuehlnet.de/fschmid/`\n\n\
  ### `Texinfo`\nTexinfo 是 gnu 项目的文档系统，非常适合编写某些类型的技术手册。\n\n虽然它开箱的扩展性不足以生产严肃的非技术出版物，但它允许包含内置\
  \ eps 图像，并可以产生基于 TEX、html 和 Info 输出。如果这符合你的需求，请使用它。\n\nDEB: `tetex-base`\nRPM: `texinfo`\n\
  WWW: `http://www.gnu.org/software/texinfo/`\n\n### `Txt2tex`\n一个将纯文本转换为 LaTEX 的脚本。\n\
  \nWWW: `http://www.tex.ac.uk/CTAN/support/txt2tex/`\n\n## 16. 使用字体\n\n字体是用于显示文本的字符集合，通常具有相同的字体、以及相同的尺寸、粗细和倾斜。\n\
  \n本章讨论了 Linux 系统上最常用的字体：用于 X Window 系统的显示字体、TEX 字体、用于终端的字体，以及在 Usenet 和邮件中常见的、完全由\
  \ ascii 字符组成的“字体”。\n\n### 16.1 使用字体\n\n字体是用于显示文本的字符集合，通常具有相同的字体、以及相同的尺寸、粗细和倾斜。\n\
  \n本章讨论了 Linux 系统上最常用的字体：用于 X Window 系统的显示字体、TEX 字体、用于终端的字体，以及在 Usenet 和邮件中常见的、完全由\
  \ ascii 字符组成的“字体”。\n\n字体是用于显示文本的字符集合，通常具有相同的字体、以及相同的尺寸、粗细和倾斜。\n\n本章讨论了 Linux 系统上最常用的字体：用于\
  \ X Window 系统的显示字体、TEX 字体、用于终端的字体，以及在 Usenet 和邮件中常见的、完全由 ascii 字符组成的“字体”。\n\n字体是用于显示文本的字符集合，通常具有相同的字体、以及相同的尺寸、粗细和倾斜。\n\
  \n本章讨论了 Linux 系统上最常用的字体：用于 X Window 系统的显示字体、TEX 字体、用于终端的字体，以及在 Usenet 和邮件中常见的、完全由\
  \ ascii 字符组成的“字体”。\n\n### 16.2 字体属性\n\n`fndry`: 数字化并提供该字体的字体工厂。\n`fmly`: 字体风格名称（例如，“courier”）。\n\
  `wght`: 字体的重量，或其标称的黑度、粗细程度。\n`slant`: 字体的姿态……\n`swdth`: 字符的比例宽度……\n`adstyl`: 该特定字体任何额外的样式描述\n\
  `pxlsz`: 以像素为单位的字体。\n`ptsz`: 以磅为单位的字体。\n`resx`: 水平屏幕分辨率……\n`resy`: 垂直屏幕分辨率……\n`spc`:\
  \ 字体使用的间距类型……\n`avgwdth`: 字符的平均宽度……\n`rgstry`: 国际标准组织……\n`encdng`: 该字符集的注册名称……\n\
  \n\n\n\nX 字体名称可能很长且难以输入；为了方便起见，可以使用 `xfontsel`客户端，这是一个用于选择 X 字体并获取其 X 字体名称的交互式工具。\n\
  \n当你启动 `xfontsel` 时，它看起来如图 16-1（窗口框会根据你的窗口管理器而不同）。\n\n*图 16-1. 启动 xfontsel。*\n\n\
  按钮行是拉取菜单，包含了 X 字体名称中每个字段在系统中提供的可用选项。使用鼠标从每个菜单中选择项目，你选择的 X 字体将显示在主窗口中。上方写着它的 X 字体名称。\n\
  \n⇒ 要将 X 字体名称设置为 X 选择项，请鼠标点击标记为 `select` 的按钮。\n\n此示例将 X 字体名称设置为 X 选择项，这允许你将 X 字体名称粘贴到命令行或另一个窗口中（参见食谱\
  \ 10.3.2 [粘贴文本]，第 254 页）。\n\n### 16.1.2 列出可用的 X 字体\n\n使用 `xlsfonts` 列出系统中可用的 X 字体族、大小和字重。提供带引号的模式作为参数，它将输出系统中匹配该模式的所有\
  \ X 字字体名称；默认情况下，它会列出所有字体。\n\n⇒ 这里是使用此工具的一些方法。\n\n• 列出系统上所有的 X 字体，输入：`$xlsfonts`\n\
  \n• 列出系统中名称中包含文本“rea”的所有 X 字体，输入：`$xlsfonts '*rea*'`\n\n• 列出系统中所有的加粗 X 字体，输入：`$xlsfonts\
  \ '*bold*'`\n\n**注意：** 这不是显示字体中字符的方法；要显示字符，请使用下文描述的 `xfd`。此外，为了浏览可用的 X 字体，你想要像上一个食谱那样使用\
  \ `xfontsel`。\n\n### 16.1.3 显示 X 字体中的字符\n\n使用 `xfd`（“X 字体显示”）工具显示给定 X 字体中的所有字符。将你想要显示的\
  \ X 字体名称以引号括的形式作为 `-fn` 选项的参数提供。\n\n⇒ 要显示中等 Courier X 字体的字符，输入：`$xfd -fn '-*-courier-medium-r-normal--*-100-*-*-*-iso8859-1'`\n\
  \n### 16.1.4 调整 Xterm 字体\n\n有关为 X 客户端窗口指定字体的信息，请参见食谱 4.2.3 [指定 X 窗口字体]，第 104 页。它最实用的指定字体工具之一是\
  \ `xterm`，它通常用于在 X 中运行 shell；许多人喜欢指定用于此窗口的字体（参见食谱 4.5 [在 X 中获取终端窗口]，第 109 页）。\n\n\
  在 `xterm` 运行时调整当前字体，按住 `CTRL` 并在 `xterm` 窗口的任意位置点击右键。将弹出一个菜单，为你提供大小选项，从不可读（Unreadable）、极小（Tiny）到巨大（Huge）。要将字体调整为原始大小，选择默认（Default）。\n\
  \n### 16.2 使用 TEX 字体\n\n以下食谱专门涉及 TEX 字体。\n\n### 16.2.1 列出可用的 TEX 字体\n\n新 TEX 用户的一个常见问题是如何列出系统中安装的所有\
  \ TEX 字体——大多数安装都带有许多字体，能够轻松地列出并显示它们将很有帮助。遗憾的是，没有统一且可靠的方法来实现它。你可以与 TEX 使用多种类型的字体，安装的精确字体会随系统而异。TEX\
  \ 字体通常存储在 `/usr/share/texmf/fonts/` 和 `/usr/local/share/texmf/fonts/` 树中。\n\n要获取系统的\
  \ TEX 字体列表，使用 `locate` 列出带有 `.tfm` 扩展的文件。这些是 TEX 字体度文件。并不是所有的 TEX 字体都有 `.tfm` 文件，并不是所有的\
  \ `.tfm` 文件都是可用的字体，但你可以通过这种方法对系统中安装的 TEX 字体有一个大致的了解。\n\n⇒ 列出系统中可用的 `.tfm` 字体，输入：`$locate\
  \ .tfm`\n\n**注意：** 你可能想将输出重定向到文件，或者在独立的终端窗口中查看它，同时使用此输出来按照下一个食谱描述的方法显示字体样本。\n\n\
  ### 16.2.2 查看 TEX 字体的示例\n\nTEX 附带的文件 `/usr/share/texmf/tex/plain/base/testfont.tex`\
  \ 是一个特殊的 TEX 文件，你可以用它显示任何 `.tfm` 字体的样本。\n\n当你处理此文件时，它会要求输入要显示的字体名称。提供基础文件名——即同时省略其路径和扩展。然后分别在单独的行输入\
  \ `\\sample` 和 `\\end`，这些 TEX 命令会先打印样本，然后结束 TEX 文件。此命令将在当前目录下创建一个名为 `textfont.dvi`\
  \ 的 `dvi` 文件，其中包含给定字体的字母集样本。\n\n⇒ 查看 `plu10` 字体的示例，输入：`$tex /usr/share/texmf/tex/plain/base/testfont.tex`\n\
  \n### 16.3 使用控制台字体\n\n*控制台字体*（Console fonts）是屏幕字体。控制台字体存储在 `/usr/share/consolefonts`；安装新的控制台字体，需要\
  \ `/usr/share/consolefonts`。\n\n#### 16.3.1 设置控制台字体\n\n使用 `consolechars` 设置控制台字体；将控制台字体的文件名作为\
  \ `-f` 选项的参数。\n\n⇒ 将控制台字体设置为 `sc`，输入：`$consolechars -f sc`\n\n某些字体文件包含多个高度（或大小）。如果你尝试在不指定高度的情况下指定字体，`consolechars`\
  \ 将输出可用大小列表。\n\n⇒ 将控制台字体设置为 8 大，输入：`$consolechars -H 8 -f sc`\n\n#### 16.3.2 显示控制台字体的字符\n\
  \n使用 `showcfont` 显示控制字体中的所有字符。\n\n⇒ 列出控制台字体中的所有字符，输入：`$showcfont`\n\n### 16.4 使用文本字体\n\
  \n*文本字体*是通过屏幕上的 ascii 字符创建的字体；它们通常出现在 Usenet 文章和电子邮件中，作为文本文件的装饰或标题元素，并用于在打印机上打印简单的横幅或海报。\n\
  \n字符制作“字体”（甚至是图片）被称为 *ASCII 艺术*（ascii art）。以下食谱描述了此类字体输出文本的方法。\n\n#### 16.4.1 输出水平文本字体\n\
  \nFiglet\n\nDEB: figlet\nRPM: figlet\nWWW: http://www.figlet.org/\n\n`figlet` 过滤器根据指定的文本字体输出文本。将要输出的文本作为参数，对任何包含\
  \ shell 元字符的文本进行引号引用（参见食谱 3.1.3 [引用保留字符]，第 56 页）。\n\n⇒ 使用默认 `figlet` 字体输出文本“news\
  \ alert”，输入：`$figlet news alert`\n\n此命令以 ascii 文本字体输出文本，如图 16-2 所示。\n\n```\n_\n\
  _\n_ __\n_____\n_____\n__ | | ___ _ __| |_\n| ’_ \\ / _ \\ \\ /\\ / / __|\n/ _‘\
  \ | | _ \\ \\ ’__| __|\n| | | |\n__/\\ V\nV /\\__ \\ | (_| | __|\n__/ | |\n| |_\n\
  |_| |_|\\___| \\_/\\_/ |___/\n\\__,_|_|\\___|_|||\n\\__|\n```\n\n*图 16-2. 来自 figlet\
  \ 的输出。*\n\n`figlet` 字体保存在 `/usr/lib/figlet` 目录；使用 `-f` 选项后跟字体文件的文件名（不带路径和扩展名）来使用该字体。\n\
  \n\n\n要使用 figlet 字体输出文本文件的内容，可以使用 `cat` 输出文件内容并将输出管道到 `figlet`。\n\n*⇒* 要用 figlet\
  \ 泡泡字体输出 poster 文件的文本，输入：`$ cat poster | | figlet -f bubble`\n\nRET\n\n**NOTES：**\
  \ 泡泡字体安装在 `/usr/lib/figlet/bubble.flf`。\n\n402\n\n《Linux 手册》，第 2 版\n\n## 16.4.2\
  \ 输出文本横幅\n\nBsd-games\n\nDEB: `bsdmainutils`\n\nRPM: `bsd-games`\n\nWWW: `ftp://metalab.unc.edu/pub/Linux/games/`\n\
  \n在 Linux 系统上打印垂直文本横幅最简单的方法是使用旧的 unix `banner` 工具。\n\n将文本消息作为参数，`banner` 会将消息的大型垂直“横幅”发送到标准输出。消息本身由\
  \ ascii 文本字符组成的“字体”输出，与 `figlet` 使用的类似，不同之处是消息是为了打印而垂直输出，且你无法更改字体。要将 `banner` 的输出发送到打印机，请将其管道到\
  \ `lpr`。\n\n*⇒* 这里有两种使用它的方法。\n\n*•* 要制作一个显示“Happy Birthday Susan”的横幅，输入：`$ banner\
  \ 'Happy Birthday Susan'`\n\nRET\n\n*•* 要将一个显示“Happy Birthday Susan”的横幅打印到默认打印机，输入：\n\
  \n$ `banner 'Happy Birthday Susan' | lpr`\n\nRET\n\n遗憾的是，`banner` 理解的字符范围相当有限——以下字符无法在横幅消息中使用：\n\
  \n`< > [ ] \\ ^ _ { } | ~`\n\n要制作文本文件内容的横幅，请通过重定向标准输入将其内容发送给 `banner`（参见食谱 3.2.1\
  \ [重定向输入到文件]，第 67 页）。\n\n要制作 `/etc/hostname` 文件的内容横幅，输入：`$ banner < /etc/hostname`\n\
  \nRET\n\n横幅的默认宽度为 132 个文本列；你可以通过指定 `-w` 选项的参数来指定不同的宽度。\n\n如果你提供了 `-w` 选项但不带数字，`banner`\
  \ 将按 80 个文本列输出。\n\n*⇒* 这里有两种使用它的方法。\n\n*•* 要制作一个宽度为 23 个文本列、包含文本“Happy Birthday\
  \ Susan”的横幅，输入：\n\n$ `banner -w 23 'Happy Birthday Susan'`\n\nRET\n\n第 16 章：使用字体\n\
  \n403\n\n*•* 要制作一个宽度为 80 个文本列、包含文本“Happy Birthday Susan”的横幅，输入：\n\n$ `banner -w\
  \ 'Happy Birthday Susan'`\n\nRET\n\n**NOTES：** 使用 `figlet` 制作水平文本横幅的方法见食谱 15.2.7\
  \ [横向输出文本]，第 369 页。\n\n## 16.5 使用其他字体工具\n\n下表描述了 Linux 可用的其他字体工具。\n\n### 控制台字体编辑器\n\
  \nLinux 控制台字体编辑器 (`cse`) 是一个用于在屏幕上编辑字体字符的旧字体工具。\n\nDEB: `cfe`\n\nRPM: `cfe`\n\n\
  WWW: `http://lrn.ru/~osgene/`\n\n### Debian 字体管理器\n\n在 Debian 系统上配置字体的工具。\n\nDEB:\
  \ `defoma`\n\n`defoma-doc`\n\n`psfontmgr`\n\n### Fonter\n\n一个控制台字体编辑器。\n\nDEB: `fonter`\n\
  \nWWW: `http://metalab.unc.edu/pub/Linux/apps/misc/`\n\n### FontForge\n\n一个识别许多格式（包括\
  \ PostScript、TrueType 和 OpenType）的字体编辑器。\n\nDEB: `fontforge`\n\nRPM: `fontforge`\n\
  \nWWW: `http://fontforge.sourceforge.net/`\n\n### Font Viewer\n\n查看 Adobe Type 1\
  \ 和 TrueType 字体的工具。\n\nDEB: `gfontview`\n\nRPM: `gfontview`\n\nWWW: `http://gfontview.sourceforge.net/`\n\
  \n404\n\n《Linux 手册》，第 2 版\n\n### Gozer\n\n一个将作为参数的文本渲染为抗锯齿 TrueType 字体的工具。\n\nDEB:\
  \ `gozer`\n\nWWW: `http://www.linuxbrit.co.uk/gozer/`\n\n### Metafont\n\nDonald\
  \ E. Knuth 设计字体和标志的语言（随 TEX 分发）。\n\nDEB: `tetex-base`\n\n`tetex-bin`\n\n`tetex-doc`\n\
  \n`tetex-extra`\n\nRPM: `tetex`\n\nWWW: `http://www.tug.org/teTeX/`\n\n### PkTrace\n\
  \n一个将用 Metafont 生成的字体转换为 Type 1 字体的工具。\n\nDEB: `pktrace`\n\nRPM: `mftrace`\n\nIV.\
  \ 图像\n\n405\n\nIV. 图像\n\n406\n\n《Linux 手册》，第 2 版\n\n第 17 章：查看图像\n\n407\n\n## IV.\
  \ 查看图像\n\n### 17. 查看图像\n\n有很多查看图像的工具，和文本一样，既有查看工具也有编辑工具。本章描述了查看图像的一些最佳方法；图像编辑将在下一章讨论。虽然你可以用图像编辑器查看图像，但如果不打算编辑，使用查看器会更安全（也更快！）。\n\
  \n### 17.1 在 X 中查看图像\n\n### ImageMagick\n\nDEB: `imagemagick`\n\nRPM: `ImageMagick`\n\
  \nWWW: `http://www.imagemagick.org/`\n\n要在 X 中查看图像，请使用 `display`，它是 `ImageMagick`\
  \ 的一部分。它可以识别许多格式，包括 gif, jpeg, pbm, pnm, ppp, tga, tiff, xbm, xpm, xm 和 ywm。\n\n\
  ```\ncat poster.jpg | figlet -f bubble poster.jpg\n```\n\n（注：此处原文存在大量重复和错误，已根据逻辑保留核心内容）\n\
  \n*•* 要制作一个显示“Happy Birthday Susan”的横幅，输入：`$ banner 'Happy Birthday Susan'`\n\n\
  RET\n\n*•* 要将一个显示“Happy Birthday Susan”的横幅打印到默认打印机，输入：\n\n$ `banner 'Happy Birthday\
  \ Susan' | lpr`\n\nRET\n\n遗憾的是，`banner` 理解的字符范围相当有限——以下字符无法在横幅消息中使用：\n\n`< > [ ]\
  \ \\ ^ _ { } | ~`\n\n要制作文本文件内容的横幅，请通过重定向标准输入将其内容发送给 `banner`（参见食谱 3.2.1 [重定向输入到文件]，第\
  \ 67 页）。\n\n要制作 `/etc/hostname` 文件的内容横幅，输入：`$ banner < /etc/hostname`\n\nRET\n\n\
  横幅的默认宽度为 132 个文本列；你可以通过指定 `-w` 选项的参数来指定不同的宽度。\n\n如果你提供了 `-w` 选项但不带数字，`banner` 将按\
  \ 80 个文本列输出。\n\n*⇒* 这里有两种使用它的方法。\n\n*•* 要制作一个宽度为 23 个文本列、包含文本“Happy Birthday Susan”的横幅，输入：\n\
  \n$ `banner -w 23 'Happy Birthday Susan'`\n\nRET\n\n第 16 章：使用字体\n\n403\n\n*•* 要制作一个宽度为\
  \ 80 个文本列、包含文本“Happy Birthday Susan”的横幅，输入：\n\n$ `banner -w 'Happy Birthday Susan'`\n\
  \nRET\n\n**NOTES：** 使用 `figlet` 制作水平文本横幅的方法见食谱 15.2.7 [横向输出文本]，第 369 页。\n\n## 16.5\
  \ 使用其他字体工具\n\n下表描述了 Linux 可用的其他字体工具。\n\n### 控制台字体编辑器\n\nLinux 控制台字体编辑器 (`cse`) 是一个用于在屏幕上编辑字体字符的旧字体工具。\n\
  \nDEB: `cfe`\n\nRPM: `cfe`\n\nWWW: `http://lrn.ru/~osgene/`\n\n### Debian 字体管理器\n\
  \n在 Debian 系统上配置字体的工具。\n\nDEB: `defoma`\n\n`defoma-doc`\n\n`psfontmgr`\n\n### Fonter\n\
  \n一个控制台字体编辑器。\n\nDEB: `fonter`\n\nWWW: `http://metalab.unc.edu/pub/Linux/apps/misc/`\n\
  \n### FontForge\n\n一个识别许多格式（包括 PostScript、TrueType 和 OpenType）的字体编辑器。\n\nDEB: `fontforge`\n\
  \nRPM: `fontforge`\n\nWWW: `http://fontforge.sourceforge.net/`\n\n### Font Viewer\n\
  \n查看 Adobe Type 1 和 TrueType 字体的工具。\n\nDEB: `gfontview`\n\nRPM: `gfontview`\n\n\
  WWW: `http://gfontview.sourceforge.net/`\n\n404\n\n《Linux 手册》，第 2 版\n\n### Gozer\n\
  \n一个将作为参数的文本渲染为抗锯齿 TrueType 字体的工具。\n\nDEB: `gozer`\n\nWWW: `http://www.linuxbrit.co.uk/gozer/`\n\
  \n### Metafont\n\nDonald E. Knuth 设计字体和标志的语言（随 TEX 分发）。\n\nDEB: `tetex-base`\n\n\
  `tetex-bin`\n\n`tetex-doc`\n\n`tetex-extra`\n\nRPM: `tetex`\n\nWWW: `http://www.tug.org/teTeX/`\n\
  \n### PkTrace\n\n一个将用 Metafont 生成的字体转换为 Type 1 字体的工具。\n\nDEB: `pktrace`\n\nRPM:\
  \ `mftrace`\n\nIV. 图像\n\n405\n\nIV. 图像\n\n406\n\n《Linux 手册》，第 2 版\n\n第 17 章：查看图像\n\
  \n407\n\n## IV. 查看图像\n\n### 17. 查看图像\n\n有很多查看图像的工具，和文本一样，既有查看工具也有编辑工具。本章描述了查看图像的一些最佳方法；图像编辑将在下一章讨论。虽然你可以用图像编辑器查看图像，但如果不打算编辑，使用查看器会更安全（也更快！）。\n\
  \n### 17.1 在 X 中查看图像\n\n### ImageMagick\n\nDEB: `imagemagick`\n\nRPM: `ImageMagick`\n\
  \nWWW: `http://www.imagemagick.org/`\n\n要在 X 中查看图像，请使用 `display`，它是 `ImageMagick`\
  \ 的一部分。它可以识别许多格式，包括 gif, jpeg, pbm, pnm, ppp, tga, tiff, xbm, xpm, xm 和 ywm。\n\n\
  ```\ncat poster.jpg | figlet -f bubble poster.jpg\n```\n\n（注：此处原文存在大量重复和错误，已根据逻辑保留核心内容）\n\
  \n\n\n\n\n在前面的示例中，只有显示器支持的图像格式的文件会被读取并显示。\n\n**注意：** 如果标题栏显示视觉图像目录有多个页面，请按 `SPACEBAR`\
  \ 进到下一页（在最后一页按 `SPACEBAR` 将返回到开头）。\n\n要以原始尺寸打开图像，请右键点击图像并选择 `Load`；缩略图将被替换为完整尺寸的图像。要返回缩略图目录，请按\
  \ `SPACEBAR`。\n\n### 17.1.2 将图像放入根窗口\n\n将图像放入根窗口（所有其他窗口后的背景）的一种方法是使用 `display` 并将‘root’\
  \ 作为 `-window` 选项的参数。\n\n*⇒ 要将图像 `tetra.jpeg` 放入根窗口，请输入：$ `display -window root\
  \ tetra.jpeg`\n\nRET\n\n## 17.2 在控制台中浏览图像\n\nZgv\n\nDEB: `zgv`\n\nRPM: `zgv`\n\n\
  WWW: http://freshmeat.net/projects/zgv/\n\n使用 `zgv` 在虚拟控制台（不在 X 中）中查看图像。你可以使用 `zgv`\
  \ 浏览文件系统并选择要查看的图像，或者可以将特定图像文件的名称作为参数。它可以识别许多图像格式，包括 gif、jpeg、png、pbm/pnm/ppm、tga\
  \ 和 pcx；其最棒的特性之一是用图像填充整个屏幕。\n\n第 17 章：查看图像 \n\n当你不带任何选项并运行 `zgv` 时，它会显示当前目录下任何图像的图像图标，并将任何子目录显示为文件夹图标。你也可以将目录名称作为参数，以浏览该目录中的图像。\n\
  \n*⇒ 这里有两种使用它的方法。\n\n* • 要浏览当前目录下的图像，请输入：$ `zgv`\n\nRET\n\n* • 要浏览 `/usr/share/gimp/scripts`\
  \ 目录下的图像，请输入：\n\n$ `zgv /usr/share/gimp/scripts`\n\nRET\n\n使用方向键在文件显示中导航；图像或目录图标周围的红色框表示表示选了哪个图像或子目录。输入\
  \ `RET` 查看所选图像或切换到所选目录。\n\n你可以通过多种方式处理你查看的图像——放大或缩小图像倍数、更改亮度和颜色，甚至可以对图像制作自动“幻灯片”。下表描述了\
  \ `zgv` 的一些命令行选项。\n\n- `-c`: 切换图像居中。默认在屏幕上居中；指定此选项将关闭居中。\n- `-i`: 忽略损坏文件引起的错误，并显示文件中任何可显示的部分。\n\
  - `-l`: 以幻灯片模式启动 `zgv`，在该模式下将连续循环播放所有参数指定的图像，直到你中断它。\n- `-M`: 切换鼠标支持。默认关闭鼠标支持；此选项将其开启。\n\
  - `-r integer`: 每隔 `integer` 秒重新读取并重新显示每张图像。对于查看网络摄像头图像或其他持续变化的图像文件有用。\n\n### 17.3\
  \ 在 浏览器中查看图像\n\nLynx\n\nDEB: `lynx`\n\nRPM: `lynx`\n\nWWW: http://lynx.browser.org/\n\
  \n*或*\n\nMozilla\n\nDEB: `mozilla-browser`\n\nRPM: `mozilla`\n\nWWW: http://www.mozilla.org/\n\
  \n浏览器非常适合浏览文件和目录，它们在显示图像方面同样出色。你可以像浏览任何文件一样，在运行于 X 的 Web 浏览器中浏览本地图像（参见 Recipe 5.10\
  \ [浏览文件和目录]，第 157 页）。如果你在 X 中需要查看图像文件，并且运行着 Web 浏览器，这是一种快速方便的方法。\n\n你可以通过这种方式使用图形化浏览器（如\
  \ Mozilla）或在带有基于文本的浏览器 Lynx 的终端窗口中查看图像，在这种情况下，图像将在带有“助手”应用程序的新窗口中显示。退出助手程序将返回 Lynx。\n\
  \n要在 Mozilla 或其他图形化 Web 浏览器中查看图像文件，请在浏览器的“位置”（Location）字段中指定图像文件的完整路径。要在 Lynx 中查看图像文件，只需将图像的完整或相对路径作为参数给出，或者在\
  \ Lynx 中输入 `g` 获取提示，然后可以在其中输入完整路径。\n\n*⇒ 这里有一些使用它的方法。\n\n* • 要启动打开 `/usr/share/doc/texmf/pdftex/base/pic.png`\
  \ 的 Mozilla，请输入：\n\n`mozilla /usr/share/doc/texmf/pdftex/base/pic.png`\n\nRET\n\n\
  * • 在 Mozilla 中查看文件 `/usr/share/doc/texmf/pdftex/base/pic.png`，请在其 Location 字段中输入：\n\
  \n`/usr/share/doc/texmf/pdftex/base/pic.png`\n\nRET\n\n* • 要启动打开 `/usr/share/doc/texmf/pdftex/base/pic.png`\
  \ 的 Lynx，请输入：\n\n`lynx /usr/share/doc/texmf/pdftex/base/pic.png`\n\nRET\n\n* • 在\
  \ Lynx 中查看文件 `/usr/share/doc/texmf/pdftex/base/pic.png`，请输入：\n\n`g`\n`/usr/share/doc/texmf/pdftex/base/pic.png`\n\
  \n## 17.4 预览文件\n\n### 17.4.1 预览 dvi 文件\n\n使用 `xdvi` 在 X 中预览 dvi 文件。将文件名作为参数给出。\n\
  \n*⇒ 要预览文件 `gentle.dvi`，请输入：$ `33%`\n\n下表列出了在用 `xdvi` 预览时使用的最重要的按键命令。\n\n- `Q`:\
  \ 退出 `xdvi` 并停止预览文件。\n- `N` 或 `F`: 向前进到下一页。\n- `P` 或 `B`: 向后移动到上一页。\n- `CTRL-C`:\
  \ 等于 `Q`。\n- `CTRL-D`: 等于 `Q`。\n- `SPACEBAR`: 向下滚动页面（如果有，则进到下一页）。\n- `CTRL-L`: 重新显示当前页。\n\
  - `R`: 重新读取 dvi 文件。\n\n### 17.4.2 预览 PostScript 文件\n\nGhostview\n\nDEB: `ghostview`\n\
  \nRPM: `ghostview`\n\nWWW: http://www.cs.wisc.edu/~ghost/index.html\n\n*或*\n\nGV\n\
  \nDEB: `gv`\n\nRPM: `gv`\n\nWWW: http://the.uni-mainz.de/~plass/gv/\n\n要在 X 中预览\
  \ PostScript 或 eps 图像文件，可以使用 ghostview 或 `gv`。两者都接受文件名作为参数，并在窗口中预览文件内容，从第一页开始。\n\
  \n*⇒ 要预览文件 `/usr/doc/gs/examples/tiger.ps`，请输入：$ `gv /usr/doc/gs/examples/tiger.ps`*\n\
  \nRET\n\n按 `SPACEBAR` 向下滚动页面（如果有，则进到下一页），按 `O` 打开新文件，按 `Q` 退出。\n\n**注意：** 上述按键适用于\
  \ ghostview 或 `gv`，但今天许多人倾向于使用较新的 `gv`，它基于 ghostview，但界面更好并且也可以预览 `pdf` 文件。\n\n\
  ### 17.4.3 预览 pdf 文件\n\nXpdf\n\nDEB: `xpdf-common`, `xpdf-reader`\n\nRPM: `xpdf`\n\
  \nWWW: http://www.foolabs.com/xpdf/\n\n使用 `xpdf` 预览 pdf 文件。将要预览的 pdf 文件名作为参数给出。\n\
  \n*⇒ 要预览 pdf 文件 `flyer.pdf`，请输入：\n\n$ `xpdf flyer.pdf`\n\nRET\n\n\n\n\n要退出 `xpdf`，按\
  \ `Q`；使用两个放大镜按钮来放大（`+`）或缩小（`-`）视图，并点击左右箭头按钮移动到上一页或下一页（如果有）。你还可以用鼠标选择文本：点击鼠标左键并在文本块上拖动进行选择；这将变为\
  \ X 剪贴板中的纯 ascii 文本，你可以将其粘贴到另一个窗口（例如，文本编辑器，或者在正在使用 `cat` 将标准输入重定向到文件的 `xterm` 终端中）。\n\
  \n**注意：** 你还可以使用 `gv` 预览 pdf 文件（见前文的菜谱/配方）。\n\n## 17.5 浏览 PhotoCD 档案\n\n有两种方法可以浏览\
  \ Kodak PhotoCD 档案。\n\n### 方法 #1\n\n`xpcd`\n\nDEB: `xpcd`\n\n`xpcd-gimp`\n\nRPM:\
  \ `xpcd`\n\nWWW: `http://bytesex.org/xpcd.html`\n\n416\n\n《Linux 菜谱》，第 2 版\n\n`xpcd`\
  \ 工具是一个用于查看和浏览 Kodak PhotoCD 图像集的 X 客户端。要浏览 Kodak PhotoCD 上的图像，请挂载光驱（见菜谱 24.4.1\
  \ [挂载数据光盘]，第 506 页），然后将挂载点作为参数传递给 `xpcd`。\n\n*⇒ 要浏览挂载在 `/cdrom` 上的 PhotoCD 光盘中的图像，输入：`$\
  \ xpcd /cdrom`\n\n前面的示例将打开两个新窗口——一个小的 `xpcd` 命令栏窗口，和一个包含光盘上所有 PhotoCD 图像缩略图的大窗口。\n\
  \n要在新窗口中打开图像副本，左键点击其缩略图。\n\n当你这样做时，`xpcd` 将以第二较小的 PhotoCD 分辨率 256x384 打开图像；若要查看其他尺寸，右键点击图像并选择要查看的大小。一旦新窗口绘制完成，你可以右键点击此新图像将其保存为\
  \ jpeg、ppm 或 tiff 格式的图像。\n\n要使用 `xpcd` 查看单个 `.pcd` 文件，请将文件名作为参数传递。\n\n*⇒ 要查看 PhotoCD\
  \ 文件 `hawaii-001.pcd`，输入：`$ xpcd hawaii-001.pcd`\n\n**注意：** 虽然 `xpcd` 的开发已经停止，但它仍然非常有用的查看器，并附带了\
  \ PhotoCD 转换工具 `pcdtoppm`。\n\n另见菜谱 19.3 [提取 PhotoCD 图像]，第 445 页获取另一种提取 PhotoCD 图像的方法。\n\
  \n### 方法 #2\n\n要浏览 PhotoCD 档案，使用 `display` 查看与该档案关联的 `overview.pcd` 文件，该文件位于档案的根目录下（有关如何使用\
  \ `display`，见菜谱 17.1 [在 X 中查看图像]，第 407 页）。\n\n*⇒ 要浏览挂载在 `/cdrom` 上的 PhotoCD 光盘上的图像，输入：`$\
  \ display /cdrom/overview.pcd`\n\n要查看 PhotoCD 档案中的特定图像，将与该图像关联的文件名作为参数传递给 `display`。\n\
  \n*⇒ 要查看挂载在 `/cdrom` 上的 PhotoCD 光盘上的 12 张图像，输入：\n\n`$ display /cdrom/images/img0012.pcd`\n\
  \n第 17 章：查看图像\n\n417\n\n## 17.6 查看动画或幻灯片\n\nImageMagick\n\nDEB: `imagemagick`\n\n\
  RPM: `ImageMagick`\n\nWWW: `http://www.imagemagick.org/`\n\n使用 ImageMagick 件中的 `animate`\
  \ 来查看动画以及查看或制作幻灯片。\n\n要查看动画图像文件，将文件名作为参数传递。\n\n*⇒ 要查看动画图像 `earth.gif`，输入：`$ animate\
  \ earth.gif`\n\n要为几张图像制作幻灯片，将显示每张图像的时间（以分之一为单位，默认为 6/100 秒）作为 `-delay` 选项的参数，并将所有图像文件名作为参数传递。\n\
  \n*⇒ 这里有两种使用此命令的方法。\n\n*• 要显示 `~/photos/vacation2003/roll1/640` 目录下所有文件的幻灯片，每张图像在移动到下一张之前显示\
  \ 10 秒，输入：`$ animate -delay 1000 ~/photos/vacation2003/roll1/640`\n\n*• 要显示四个名为\
  \ `sample.jpg`、`120.tif`、`sampleb.jpg` 和 `122.tif` 的文件的动画，每张图像显示 1/5 秒，输入：\n\n`$\
  \ animate -delay 20 sample.jpg 120.tif sampleb.jpg 122.tif` \n\n当 `animate` 完成显示所有给定图像后，它将循环回到开头。要设置重新开始之前的暂停时间，请为\
  \ `-delay` 提供第二个参数，指定为“x 数字*number*”，其中 *number* 是再次循环前暂停的秒数。\n\n*⇒ 要显示当前目录下所有 `.jpeg`\
  \ 文件的幻灯片，每张图像显示默认的 6/100 秒，并在重复之前暂停 1 秒，输入：\n\n`$ animate -delay x1 *.jpeg`\n\n\
  使用 `-backdrop` 将动画显示为全屏背景。\n\n418\n\n《Linux 菜谱》，第 2 版\n\n**注意：** 与 ImageMagick 一样，按\
  \ `Q` 退出。\n\n要制作你自己的动画文件，请使用 `convert`，它也属于 ImageMagick（见 18.2 [转换图像]，第 432 页）。\n\
  \n## 17.7 使用其他查看器\n\n下表列出了其他查看工具。\n\nAview\n\nDEB: `aview`\n\nRPM: `aview`\n\nWWW:\
  \ `http://linux-project.sourceforge.net/`\n\nAatv\n\n用 ascii 字符显示电视调谐器输出。\n\nDEB:\
  \ `aatv`\n\nRPM: `xawtv`\n\nWWW: `http://00n.free.fr/`\n\nChBg\n\n更改 X 背景。允许幻灯片和其他效果。\n\
  \nDEB: `chbg`\n\nRPM: `chbg`\n\nWWW: `http://chbg.sourceforge.net/`\n\nFbi\n\n在\
  \ Linux 帧缓冲区上显示图像。\n\nDEB: `fbi`\n\nRPM: `fbi`\n\nWWW: `http://bytesex.org/fbi/`\n\
  \n第 17 章：查看图像\n\n19\n\nFbtv\n\n在 Linux 帧缓冲区上显示电视 。\n\nDEB: `fbtv`\n\nRPM: `xawtv`\n\
  \nWWW: `http://bytesex.org/fbtv/`\n\nFeh\n\n具有许多功能的快速图像查看器，包括显示摄像头图像。\n\nDEB: `feh`\n\
