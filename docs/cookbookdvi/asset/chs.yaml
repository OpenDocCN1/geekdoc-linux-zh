  \ 引言\n在我们开始“烹饪”之前，将在本章中完成一些准备工作，本章解释了书的组织结构以及贯穿始终的惯例。它还会告诉 Linux 新手应该从哪里开始，以及在需要时如何获取更多帮助。最后，它以对本书主题软件的简短背景介绍作为结束。\n\
  \n\n\n\n本书的其余部分全是“食谱”（recipes），它们根据其执行的任务或处理的对象进行分类——例如文本、文件、图像等。\n\n本书的第一个部分解释了操作\
  \ Linux 的通用技术和方法——包括如何准备好系统以供使用、如何在系统上运行命令、每一位 Linux 用户都应该知道的命令，以及如何使用 Linux 自带的接口。\n\
  \n## 1.1 食谱\n\n`Recipes` 是在 Linux 上完成特定任务的方法。食谱被组织成章节，每章处理一种特定类型的任务，例如查看文本或编辑图像。章节末尾通常以一个提示表结束，列出与该主题相关的更多应用程序或工具。\n\
  \n### 1.1.1 食谱编号\n\n每个食谱都通过其 `recipe number` 进行引用，其构建方式如下：食谱编号中的第一个数字始终对应章节号，第二个数字对应食谱的节或类别。例如，如果第\
  \ 3 章是 Shell，那么食谱 `3.5` 就是关于 Shell 的第五个食谱。\n\n有时食谱编号会包含第三个数字。这适用于主题非常宽泛、以至于有多个食谱可以涵盖的情况。例如，第\
  \ 74 页的食谱 `3.4` [使用你的命令历史] 是关于在 shell 中使用命令历史的主题，并进一步细分为更多食谱；第 75 页的食谱 `3.4.2` [搜索你的命令历史]\
  \ 是关于命令历史的第二个食谱。\n\n### 1.1.2 食谱的准备\n\n每个食谱都描述了一种在系统上完成特定任务的方法，而这些任务至少需要一个软件程序。食谱在准备过程中所需的软件程序或文件称为其\
  \ `ingredients`（配料）。\n\n你可能没有在系统中安装所有这些程序并已准备就绪，因此食谱的开头会列出它所使用的程序以及可以找到它们的程序包或 `urls`。\n\
  \n大多数人确信自己手头拥有的配料将从此列表中省略。例如，用于列出目录中文件的 `ls` 命令在所有系统中都可用，因此其列表总是被省略。\n\n确定是否列出某种配料的衡量规则源于\
  \ Debian 发行版，它将软件包按重要性进行分类，从所有系统运行必须具备的“必需”（Required）包，到只有在你需要时才安装的“可选”（Optional）和“额外”（Extra）包。如果对于\
  \ Debian 来说是“必需”或“重要”，那么无论你使用什么发行版，它都是非常常用的程序，我不需要列出它。\n\n### 1.1.3 食谱的格式\n\n食谱的结构如下：\n\
  \n1. 食谱编号和食谱标题。\n2. 食谱的总体描述，以及可选的建议准备方法数量。\n3. 如果一个食谱有多种建议的方法来获得相同的结果，将在此处给出方法编号，并为每个方法重复食谱的其余元素，每个方法前都标有其方法编号。\n\
  4. 特殊配料（如果有）。在这里列出软件包名和可以获取软件的 `urls`。\n\n软件包以两种主要的 Linux 格式列出：`deb` 和 `rpm`；你的发行版很可能使用其中一种。`deb`\
  \ 格式起源于 Debian 并被其他发行版使用，而 `rpm` 起于 Red Hat，从那时起被其他采用。\n\n要找到适用于你的硬件平台和发行版版本的软件包，请在你的\
  \ Linux 发行版光盘或存档中查找此软件包基础名称。\n\n你也可以在网上搜索它们：`deb` 软件包可以在 Debian 软件包网站 [http://packages.debian.org/]\
  \ 获取，`rpm` 软件包可以在在线 rpm 数据库 [http://rpmfind.net/] 搜索。\n\n例如，如果 `rpm` 软件包列出了 `XFree86`，那么适用于你特定的\
  \ `rpm` 系统的实际软件包可能是 `XFree86-VGA16-3.3.6-29.sparc.html`，根据 rpmfind.net 上 `XFree86`\
  \ 的页面，该包是 `sparc` 平台上 `vga16` 显卡的软件包。\n\n这些程序的源码和二进制文件通常也以未打包的形式提供；如果有，将列出从全球网上获取它们的位置。对于不使用这两种软件包格式的发行版（Slackware\
  \ 是一个典型的例子），或者对于某些程序不存在 `deb` 或 `rpm` 的特殊情况，可以使用这些源码。（有时，主页会包含一种或两种这些软件包格式的源码。）\n\
  \n网站是瞬息万变的；如果你找不到某个程序的源包，始终可以从 Debian 软件包网站 [http://packages.debian.org/] 获取源码，那里每个软件包都有自己的页面，其中包含指向其源码\
  \ `.tar.gz` 存档的链接。\n\n5. 特殊准备或设置（如果有）。如果你必须是超级用户或需要特殊权限才能运行命令，将在此处注明。当描述可配置程序时，除非另有说明，否则假设使用\
  \ Debian 发行版提供的标准设置。\n6. 正“烹饪”方法。\n7. 关于结果和使用的备注。\n8. 该方法在特定上下文中的至少示例，通过箭头与正文隔开。如果执行示例需要几个步骤，则对这些步骤进行编号。如果给出了多个示例，每个示例都通过项目符号与正文隔开。\n\
  9. 标准准备的变体，带有额外的示例。\n10. 你可能想要执行的后续命令或操作。某些程序接受许多修改其工作方式的选项。有时，工具的各种选项列在表格中。这些列表并不总是详尽的；而是包含了流行或常用的选项，或者与当前讨论相关的选项。请特定工具的在线手册页（参见食谱\
  \ `2.8.4` [阅读系统手册页]，第 46 页）。\n11. 特别注意或感兴趣的说明。\n12. 进一步信息的来源。\n\n## 1.2 排版约定\n\n\
  计算机交互的显示在著作中呈现了一个特殊问题。在这里，描述了本书使用的约定。食谱通常会提供至少一个动手示例来演示其用法。\n\n⇒ 引入示例的文本通过箭头与文隔开，如下。\n\
  \n• 如果有多个示例，则每个单独的示例使用项目符号。当需要几个离散步骤时，对其进行编号。\n\n食谱中的文档或用户名称并不总是引用你系统上的实际文档或用户，而是演示涉及原理的示例。因此，当我展示如何打印名为\
  \ `resume` 的文件时，你的系统中并不一定有同名文件，但你应该通过它理解如何打印文件。\n\n有时会显示终端屏幕以说明交互会话：$ *你实际输入的文本以斜体显示，如下。如果是要在\
  \ shell 提示符处输入的命令，则命令前有一个 `$` 字符。*\n\n表示程序输出的文本以等宽字体显示，如下。当有此类输出时，还会给出一个 shell 提示符以表示程序完成。\n\
  \n```\n$\n```\n\n在要输入的 shell 脚本和其他程序列表周围还会画一个框。\n\n```\n\n\n\n\n# 第一章：引言\n\n在显示\
  \ shell 提示符的示例中，默认当前工作目录在提示符中被省略，并单独使用一个“$”符号；当一个命令输出文本并退出时，示例的最后一行包含一个“$”字符，表示返回到\
  \ shell 提示符。如果你现在觉得听起来很奇怪，请不要担心；所有关于“shell”的内容将在第 3 章 Shell；它的表示方式为：`CTRL - ALT\
  \ - DEL`。\n\n同样，需要按顺序按下的按键之间用空格分隔；空格不需要字面上输入。因此，对于如下所示按键序列：\n\n```\nRET\nRET\n```\n\
  \n你会按下一次回车键，再次按下一次回车键，但它们之间不要输入空格。文本后接按键的情况也是如此——例如，书中命令与结束命令行的最后一个 `RET` 之间会出现一个物理空格，它不应该被字面上输入（尽管实际上输入这个空格通常也不会产生后果）。当明确要求按下空格键时，该键在示例中被表示为\
  \ `SPACEBAR`。\n\n1 此键在某些键盘上被标记为“Enter”，而另一些键盘上只有一个向下的然后指向左侧的箭头，类似于老式打字机的回车键。\n\n\
  除少数特殊的三个键组合外，`CTRL`（“Control”，控制）键始终与另一个键组合使用。首先按下 `CTRL` 键，在保持其按下状态的同时，按下第二个键；然后释放两个按键。这是一种控制键组合。控制键在大多数程序中具有通用的特殊含义。例如，“Control-C”组合（先按下\
  \ `CTRL` 键再按下 `C`）是“取消”（cancel）命令，它可以取消或中断正在运行的任何命令。\n\n这些控制键组合在书写上有三种表示方法。\n\n\
  传统方法是使用脱字符（`^`）后跟组合中第二个键的大写字母。例如，用这种方式表示“Control-C”，应写为 `^C`。这被称为帽符号（hat notation）。\n\
  \n第二种方法是用 `C-`（表示 `CTRL` 键）后跟第二个键的小写字母。因此，用这种方式表示“Control-C”键组合，应写为 `C-c`。这种标记被\
  \ gnu Emacs 编辑器及其相应的 gnu 文档使用（参见 Recipe 10.1 [Using Emacs] 第 232 页），因此我称之为 gnu 标记。\n\
  \n表示控制键组合的第三种方法是显示字面的 `CTRL` 键，后跟一个连字符和要按下的第二个键。因此，“Control-C”应写为 `CTRL - C`。我称称为键标记（key\
  \ notation），它是本书贯使用的标记。\n\n要输入这些组合之一，按下并按住 `CTRL`，按下第二个键，然后释放两个键。\n\n*⇒* 例如，要输入“Control-D”（可以写为\
  \ `^D`、`C-d` 或 `CTRL - D`），按下并按住 `CTRL`，输入 D 键，然后释放两个键。\n\n在某些应用程序中，`META` 键用法与\
  \ `CTRL` 相同。\n\ngnu 项目程序和文档将 META 键组合表示为 `M-x`，其中 `x` 是组合中的第二个键。当然，现在的大多数键盘都没有 `META`\
  \ 键；当你看到对该键的引用时，只需使用 `ALT` 键即可。在书中，我会用 `ALT` 代替 `META` 以键标记的形式编写这些组合，因为后者通常是实际使用的按键。\n\
  \n*⇒* 因此，要输入 `M-c`，按下并按住 `ALT`，按下 `C` 键，然后释放两个键。\n\n你通常可以通过按下并释放 `ESC`，然后按下第二个键来实现相同效果。如果你的键盘没有\
  \ `ALT` 键，或者你的 `ALT` 未被设置为 `META` 键，可以这样做。2\n\n*⇒* 在不使用 `ALT` 的情况下输入 *M-c*，按下并释放\
  \ `ESC`，然后按下 C 键。\n\n`CTRL` 和 `ALT` 序列不区分大小写；也就是说，按下大写 `C` 的效果与按下小写 `c` 相同（假设大写锁定关闭）。在\
  \ gnu 标记中，`C-` 或 `M-` 前缀始终以大写字母给出，随后的键始终以小写字母给出。\n\n此外，某些程序接受按键组合和序列的命令，因此连字符和空格表示可以组合。例如，如果命令是按下并按住\
  \ `CTRL`，按下 `X` 并释放两个键，然后输入小写字母“q”，这在文中表示为：\n\n```\nCTRL - X q\n```\n\n最后，关于引号内标点的说明。在互联网时代，出现了一种背离美国打印习惯的趋势，即将末尾标点放在引号外面。其理由是计算机无法识别标点的真实含义，并会认为它是被引用的字符的一部分。我们操作员不想困扰机器，所以将末尾标点放在引号之外。这种做法首先用于计算机编程语言（据我所知，没有一种语言接受美国习惯的文本），随后用于技术手册和计算机书籍，现在正广泛应用于其他文献中，尤其是在线出版物。\n\
  \n但我们人类理解标点，它是为了我们而存在的。我们应该制作为我们服务的系统，并按照我们意图的方式打印单词——而不是扭曲自己的表达来适应棘轮的齿槽。\n\n1.3\
  \ 本书假设你是谁\n\n本书对你（读者）以及你的 Linux 系统有几点假设。\n\n2 如果你的键盘上有 Windows 键，那么该键（而不是 `ALT`）可能被设置为\
  \ `META` 键。你需要测试一下哪种组合在你的系统中有效。\n\n\n\n\n本*指南》（*Cookbook*）假设你对计算机至少有基本的了解——你知道`hardware`是机器本身，而`software`是运行在上面的上的指令。你不需要知道如何拆解系统或类似的知识，但你应该知道如何操作鼠标、电脑和显示器上的电源按钮在哪里、如何给打印机装纸等。如果你在处理任何这些任务或概念时需要帮助，请咨询你的经销商或负责安装你电脑的人员。\n\
  \n本书还假设你已经安装并正确配置了 Linux，并且在系统中设置了自己的了自己的用户账户（创建用户账户的描述请参阅食谱 A.6.1 [创建用户账户]，第 717\
  \ 页；如果你需要安装和设置方面的帮助，请参阅食谱 1.6 [如果你需要更多帮助]，第 13 页）。书中不假设使用某一个特定的 Linux 发行版，文中提到的针对任何某一个发行版的特殊之处都会予以注明。\n\
  \n虽然 Linux 初手可以也可以也应该使用这本书，但我喜欢认为自己对基于 Linux 的系统涵盖了足够广泛的内容，并包含了足够有趣或冷门的内容，使得大师（gurus）、黑客（hackers）以及\
  \ Linux 组织（Linux Cabal）的成员可能会发现其中某些内容新颖且实用——而且任何这样的用户都不会觉得在自己的书桌上放这本书或将其作为收藏的一部分感到羞耻。\n\
  \n本书还有另一个假设，但仅对那些大师和老手们重要。正如你们这些大师所知，Bash shell 可以被认为是 Linux 的默认 shell；正因如此，书中所有的示例都假设使用它。所以，如果你有其他\
  \ shell 的经验，请注意其中的差异——你可能会发现某些示例在你喜欢的非 Bash shell 中无法正常工作（例如，命令 `locate *txt` 在\
  \ Csh 中无法按预期方式工作）。\n\n## 1.4 本书不会向你展示的内容\n\n本书的重点是向人们展示如何使用 Linux 处理所有的日常任务。这是一个宽泛的主题，包含了大量材料。\n\
  \n超出该范围的主题在书中完全没有出现；其中几个值得提前提到。\n\n本书将不会向你展示如何：\n\n1. **安装 Linux。** 没有任何一书能做到这一点并长期保持准确。那些声称可以教你如何安装的书籍都在撒谎。正如本章稍后描述的，Linux\
  \ 有许多不同的“发行版”，每种都有自己的安装过程。发行版本身有不同的版本，并且不断变化。此外还必须考虑硬件的变数：迪克（Dick）使用 USB 在那台预装了\
  \ Windows 2000 的 Dell 电脑上安装 Linux 的步骤将与简（Jane）在她的 Apple iPod 上安装 Linux 的步骤不同。\n\n\
  \   如果你是计算机新手，且技术水平尚不足以自己安装操作系统并进行必要的硬件调整，你最好的选择是：\n\n   a. 购买一台预装了 Linux 的电脑。\n\
  \   b. 让一个精通 Linux 的朋友为你安装。\n   c. 将你的系统带到当地的 Linux 用户组（lug），让他们在你观看时为你操作。他们经常为了这个目的举办“安装活动”（Install-Fests）。\n\
  \n2. **使用专有软件。** 我使用 Linux 并将其推荐给他人的根本原因在于它不是专有的，而是以这种发布使得任何人都可以检查软件、与他人分享并根据需要对其进行调整。我完全不使用专有软件，对它一无所知。因此，书中不会有专有软件。\n\
  \n3. **使用实验性软件。** Linux 有成千上万的程序可用，我涵盖了其中大部分最流行和最重要的软件。我省略的是那些目前处于“测试版”（beta）或其他尚未面向普通公众的不稳定版本的软件包。\n\
  \n4. **保护你的系统。** 安全这一专门课题足够大，值得单独出一一本书。\n\n5. **成为系统管理员。** 家庭用户系统管理的基本任务描述在附录 A\
  \ [管理问题]，第 699 页，这足够让你顺利上手；如果需要更详细的内容，你需要一本关于该主题的专业书籍。我推荐《Linux 系统管理员指南》（*Linux\
  \ System Administrators’ Guide*），它应该就在你的系统中（关于如何访问，请参阅食谱 2.8.6 [阅读系统文档和帮助文件]，第 50\
  \ 页）。\n\n6. **管理网络。** 网络种类太多，而且这通常是一个技术性的应用而非基于用户的应用。为此目的推荐《Linux 网络管理员指南》（*Linux\
  \ Network Administrators Guide*）（参见附录 D [进一步感兴趣的参考文献]，第 731 页）。\n\n7. **在软件开发中使用\
  \ Linux。** 程序开发、编译和软件项目管理不在本书的范围内。然而，程序员会发现书中的许多材料对他的工作很有用。\n\n8. **在其他专业领域中使用 Linux。**\
  \ 书中的所有内容对你都应该有用，无论你是音乐作曲家、生物化学家、学校老师、秘书或其他身份。然而，本书将没有关于“使用 Linux 进行音乐创作”、“在生物化学研究中使用\
  \ Linux”、“在教室中使用 Linux”或“秘书的 Linux 指南”等特定章节，尽管 Linux 在这些领域领域取得了巨大成功。关于在无数特殊领域使用\
  \ Linux，已经有许多报告、论文、网站甚至书籍被写出。\n\n9. **使用非 Linux 系统。** 本书中描述的大多数免费软件已经移植到其他系统。书中的食谱在这些系统中或多程度上可行。然而，这不是《UNIX\
  \ 指南》（*UNIX Cookbook*），因此没有讨论非 Linux 的用法——书中假设平台为 Linux。\n\n## 1.5 首先尝试的内容\n\n本书的前四章包含了开始使用\
  \ Linux 所需的所有入门内容。这些是基础。Linux 初学者应该从这几章开始。一旦学会了如何启动系统并登录，你应该查看关于 shell 的章节，只需熟悉在提示符中输入即可；然后，查看名为\
  \ X Window System 的图形界面章节，这样你就可以启动 X 并在那里运行程序。\n\n当你熟悉了 X 之后，你可能想跳跃先读关于文件和目录的章节，以直系统的体系以及如何在其中操作。然后，继续学习如何查看文本，以及如何在编辑器中编辑它（描述在查看文本和编辑文本的章节中）。之后，根据需求和兴趣探索书中剩下的。\n\
  \n总结一下，以下是我认为为了熟悉 Linux 系统的基本用法而吸收的核心内容：\n\n1. 第 1 章 [引言]，第 3 页（本章）。\n2. 第 2 章 [每个\
  \ Linux 用户应该知道]，第 27 页。\n3. 第 3 章 [Shell]，第 53 页（特别关注前三个主要部分，暂时忽略其余）。\n4. 第 4 章\
  \ [X Window System]，第 95 页（暂时忽略配置部分）。\n5. 第 5 章 [文件和目录]，第 125 页。\n6. 第 9 章 [查看文本]，第\
  \ 211 页（主要是浏览文本的第一部分）。\n7. 第 10 章 [编辑文本]，第 231 页（足以选择文本编辑器并开始使用它）。\n\n\n\n\n如果你对特定的程序名称、函数名称或模式名称有疑问，请查阅\
  \ `program` 索引（`Program Index`，第 739 页）。\n\n另一个列出食谱名称、专有名词和涉及的通用概念索引被称为 `concept`\
  \ 索引（`Concept Index`，第 747 页）。\n\n## 1.6 如果你需要更多帮助\n\n如果你需要比本书能提供的更多帮助，请记住你还有其他选择。尝试以下步骤来获取帮助：\n\
