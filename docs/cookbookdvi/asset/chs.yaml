  \n* • 杜克大学数学系提供了一套用于各种文档的 TEX 模板，大部分为学术和教学用 [`http://www.math.duke.edu/computing/tex/templates.html`]。\n\
  \n## 15.4 使用 LyX\n\n### LyX\n\nDEB: `lyx`\nRPM: `lyx`\nWWW: `http://www.lyx.org/`\n\
  \nLyX 是排版和文字处理领域的新新秀，它是该领域最真正新鲜的想法之一：它是一种用于编写 LaTEX 输入的文字处理器（参见 Recipe 15.3 [使用\
  \ TEX]，第 372 页）。它适用于那些既想要 TEX 和 LaTEX 的好处，又想在类文字处理器的应用程序中编写文档的人。这意味着它是 X 的一个视觉图形编辑器，但它不会直接在显示器上模拟打印输出。与精确指定文档中每个字符的样式不同（例如，“将此词设为\
  \ Helvetica 粗体，18 字体”），你指定的是所写文本的*结构*（“将此词设为章节标题”）。而且，与所见即所得（wysiwyg）范式不同，其作者将新方法称为\
  \ wysiwym——“你所看到的即你所*意*的”。\n\nLyX 自带许多已定义的文档*类*——例如“信件”、“文章”、“报告”和“书籍”——包含了这些文档类型可能包含的元素定义。你可以更改每个元素以及整个文档的外观，也可以更改单独文本的外观，但有了这些元素，通常没有必要这样做。\n\
  \n由于 LyX 使用 LaTEX 作为实际排版的后端，并且 LyX 能够导出文档到 LaTEX，你可以将 LyX 视为一种不需要了解 LaTEX 命令的编写方式。\n\
  \n然而，即使是那些确实使用 LaTEX 及相关语言的人也能发现 LyX 可以快速创建某些在 LaTEX 中很难实现的文档，例如带有多栏布局的简报。\n\n第\
  \ 15 章：排版与文字处理 379\n\n你也可以将 LaTEX 文件（以及纯文本）导入 LyX 进行进一步布局或操作。\n\n以下配方展示了如何开始使用 LyX，以及去哪里获取更多信息。\n\
  \n在 LyX 中编辑时，你会发现它拥有你预期文字处理器的所有命令——例如编辑菜单中的剪切、复制、粘贴、查找和替换以及拼写检查。\n\n以下是它的主要功能：\n\
  \n* • 自动生成目录、嵌套列表和章节编号。\n* • 轻松插入 PostScript 图片，图片可以旋转、缩放和添加说明。\n* • 所见即所得构建表格。\n\
  * • 撤销和重做任何操作或操作序列的能力。\n* 所有 LyX 功能可以通过键盘命令和下拉菜单使用。\n* 命令的所有按键均可配置。\n\n### 15.4.1\
  \ 开始使用 LyX\n\nLyX 在 X 下运行，你按照通常的方式启动它——要么从窗口管理器提供的应用程序菜单选择它，要么在 xterm 窗口中输入 `lyx`。（有关在\
  \ X 中运行程序的更多信息，请参见 Recipe 4.2 [在 X 中运行程序]，第 101 页）。\n\n要从头创建一个新文档，从文件菜单选择“新建”。\n\
  \n你也可以从 LyX 包含的许多模板之一创建文档，这些模板已经为特定类型的文档设置好了基础布局和设置——只需填写实际文档的元素即可。要从模板创建新文档，从文件菜单选择“从模板新建”，然后选择要使用的模板名称。\n\
  \n下表列出了包含的一些模板名称以及它们通常用于文档类型。\n\n380\n《Linux 食谱》，第 2 版\n\n`aapaper.lyx`\n适用于提交给《天文与天体物理学》期刊的论文。\n\
  \n`dinbrief.lyx`\n根据德国习惯排版的信件格式。\n\n`docbook_`\n使用 sgml DocBook 模板编写的文档格式。\n\n`hollywood.lyx`\n\
  按美国电影行业格式化的电影剧本。\n\n`iletter.lyx`\n根据意大利习惯排版的信件格式。\n\n`latex8.lyx`\n适用于提交给 IEEE\
  \ 会议的文章。\n\n`letter.lyx`\n信件和信函的基本格式。\n\n\n\n\n\n`linuxdoctemplate.lyx` 格式用于使用 sgml\
  \ LinuxDoc dtd 编写的文档，此前 Linux 文档项目（Linux Documentation Project）曾在使用\n\n`revtex.lyx`\n\
  \n适用于提交给美国物理学会 (aps)、美国物理学会 (aip) 和美国光学学会 (osa) 出版的文章格式。\n\n`slides.lyx`\n\n用于制作幻灯片和透明片的格式。\n\
  \n如需查看文档打印后的效果，请从 `File` 菜单选择 `View DVI`。此命令会启动 `xdvi` 工具，在屏幕上预览输出内容。（关于使用 `xdvi`\
  \ 的更多信息，请参见第 413 页的 `Recipe 17.4.1 [Previewing a DVI File]`）。\n\n如需打印文档，请从 `File`\
  \ 菜单选择 `Print`​。你也可以将其导出为 `LaTeX`、`PostScript`、`dvi` 或纯文本格式；要执行此操作，请从 `File` 菜单选择\
  \ `Export`，然后选择要导出的格式。\n\n**注意：** 如果你计划在 LyX 中再次编辑该文档，请务必保存实际的 `.lyx` 文件。\n\n##\
  \ 第 15 章：排版与文字处理 381\n\n### 15.4.2 深入了解 LyX\n\nLyX 文档项目监督了大量 LyX 免费文档的创建，包括实用教程、用户手册和示例文档。\n\
  \nLyX 图形之旅 7 是一个基于 Web 的教程，向你展示如何创建和编辑简单的 LyX 文件。\n\nLyX 拥有一套内置手册，你可以像阅读任何 LyX 文档一样在\
  \ LyX 编辑器内部阅读它们，也可以将其打印出来。所有手册均可通过 `Help` 菜单获取。\n\n*⇒ 要运行 LyX 的内置教程，请从 `Help` 菜单选择\
  \ `Tutorial`。*\n\n此命令将打开 LyX 教程，随后你可以在屏幕上阅读，或通过从 `File` 菜单选择 `Print` 将其打印。\n\n下表列出了\
  \ `Help` 菜单中可用手册的名称，并描述了每个手册的内容：\n\n**Introduction（简介）**\n关于使用 LyX 手册的介绍，介绍了其内容以及如何查看和打印它们。\n\
  \n**Tutorial（教程）**\n使用 LyX 编写文档的实用教程。\n\n**User’s Guide（用户指南）**\n主要的 LyX 使用手册，描述了所有常用的命令、选项和功能。\n\
  \n**Extended Features（扩展功能）**\n`User’s Guide` 的“第二部分”，描述了高级功能，如书目录、索引、多文件文档以及在特殊情况下使用的技术，例如传真真支持、SGML-Tools\
  \ 支持以及在 LyX 文档中使用版本控制。\n\n**Customization（自定义）**\n对可以自定义的 LyX 元素的说明以及如何进行自定义。\n\n\
  **Reference Manual（参考手册）**\n对所有菜单条目和内部函数的描述。\n\n**Known Bugs（已知漏洞）**\n漏洞列表。LyX 处于活跃开发中，与任何大型应用程序一样，已经发现了漏洞。\n\
  \n7 参见 http://www.lyx.org/about/lgt-1.0/lgt.html。\n\n382\n《Linux 烹指南》，第 2 版\n\n\
  **LaTeX Configuration（LaTeX 配置）**\n你的 `LaTeX` 配置清单，包括正在使用的 `LaTeX` 版本、可用字体、可用文档类以及可能安装在系统上的其他相关包。此文档由\
  \ LyX 安装在你的系统时自动生成。\n\n最后，LyX 在 `/usr/X11R6/share/lyx/examples` 目录中包含了一些示例文档。\n\n\
  以下是这些文件的部分列表以及每个文件内容的描述：\n\n`Foils.lyx`：描述如何使用 `FoilTEX` 宏制作灯片——幻灯片或投影透明片。\n`ItemizeBullets.lyx`：项目列表中各种项目符号样式的示例。\n\
  `Literate.lyx`：将 LyX 作为“字面编程”组合环境的示例。\n`MathLabeling.lyx`：方程编号和标记的技术。\n`Math_macros.lyx`：如何在数学模式下创建宏的说明。\n\
  `Minipage.lyx`：如何编写双栏双语文档的说明。\n`TableExamples.lyx`：在 LyX 中使用表格的示例。\n`aa_head.lyx`,\
  \ `aa_paper.lyx`：讨论并展示在文学领域使用 LyX 文件。\n`aas_sample.lyx`, `amsbook-test.lyx`：使用数学学会格式编写的文档示例。\n\
  `docbook_example.lyx`：DocBook 文档示例。\n`multicol.lyx`：多栏格式的示例。\n`scriptone.lyx`：好莱坞剧本的示例。\n\
  \n第 15 章：排版与文字处理 383\n\n### 15.5 使用 groff\n\n**Groff**\n\nDEB: `groff`\nRPM: `groff`\n\
  WWW: http://www.gnu.org/software/groff/groff.html\n\n`gnu troff`（也称为 `groff`）是多年以来在类\
  \ Unix 系统上可用的一系列照排版系统（phototypesetting systems）中的最新版本；该系列中的原始系统是 `roff`（“runoff”，意味着它允许文件输出到打印机）。`groff`\
  \ 用于手册页（man pages）的排版，但也可以用它排版各种文档。它能产生非常高质量的输出，并拥有一群忠实的追随者。\n\n像 TEX 一样，`groff`\
  \ 是一种排版系统，其输入是纯文本。`groff` 文档通常具有 `.ms` 扩展名。\n\n#### 15.5.1 处理 groff 文件\n\n使用 `groff`\
  \ 处理 groff 文件。给定源文件名作为参数，`groff` 将其生成排版输出，写入标准输出。\n\n默认情况下，`groff` 输出到标准输出；要将其保存到文件，请重定向输出。\n\
  \n*⇒ 使用 PostScript 阅读器预览 groff 文件的内容，输入：*\n\n```bash\ngroff -T ps .ms | gv\n```\n\
  \n384\n《Linux 烹指南》，第 2 版\n\n`groff` 可以写入多种输出格式。要指定格式，请将其作为 `-T` 选项的参数。下表列出了参数并描述了它们：\n\
  \n`ps`：PostScript\n`dvi`:设备无关格式\n`X75`：在 X 中以 75 dpi 显示（无需输出）\n`X100`：在 X 中以 100\
  \ dpi 显示（无需输出）\n`ascii`：纯文本\n`latin1`：iso Latin1 字符集的纯文本\n`lj4`：用于 LaserJet 4 的\
  \ pcl5 打印格式\n`html`：html\n\n*⇒ 在新的 X 窗口中以 100 dpi 预览 groff 文件的内容，输入：*\n\n```bash\n\
  groff -T X100 .ms\n```\n\n*⇒ 处理 groff 文件并将输出发送到名为 frontoffice 的 LaserJet 4 打印机，输入：*\n\
  \n```bash\ngroff -T lj4 .ms | lpr -Pfrontoffice\n```\n\n*⇒ 忽略任何错误消息，显示 groff 文件内容的前\
  \ 20 行，输入：*\n\n```bash\ngroff -T ascii .ms 2>/dev/null | head -20\n```\n\n*⇒ 将 groff\
  \ 文件的内容作为纯文本邮件给 home@example.net，输入：*\n\n```bash\ngroff -T ascii .ms | mail home@example.net\n\
  ```\n\n#### 15.5.2 确定 groff 文件的命令行选项\n\n某些 groff 输入文件在处理时需要命令行选项。这些选项设置各种预处理标志，并在其他方面控制\
  \ `groff` 如何排版文档。\n\n要确定特定 groff 文件应使用的命令行选项，请将文件名作为参数传递给 `grog`（“groff 选项生成器”）。该工具是\
  \ groff 局的一部分，其目的是确定并输出用于特定文件的正确 `groff` 命令行。\n\n*⇒ 要查看在 meintro.me 文件上使用 groff\
  \ 应使用哪些选项，输入：*\n\n```bash\ngrog meintro.me\n```\n\n### 15.5.3 运行 groff 教程\n\n\n\n\
  \n\n其发行版中包含一个使用 `groff` 的教程，位于 `/usr/doc/groff` 目录下，是一个名为 `meintro.me.gz` 的压缩 groff\
  \ 文件。由于该文件本身是一个 `groff` 文件，因此必须通过 `groff` 处理才能获得输出文件。\n\n⇒ 将 `groff` 发行版包含的教程文件输出为名为\
  \ `intro.dvi` 的 dvi 文件，请输入（全一行）：\n\n```bash\nzcat /usr/doc/groff/me-intro.me.gz\
  \ | groff -me -Td > intro.dvi\n```\n\n在这个示例中，文件的未解压缩内容通过 `zcat` 发送到了标准输出（参见第 256\
  \ 页的配方 10.6 [合并文本]）。你可以使用 `xdvi` 预览结果生成的 `dvi` 输出，或使用 `dvips` 将其打印出来。\n\n用于此文件的命令选项由\
  \ `grog` 确定（如上一个配方所述）。\n\n**注意：** 同一目录下包含的另外两个 `groff` 文档文件是完整的参考手册 `meref.me.gz`，以及使用\
  \ `pic` 扩展制作方框和箭头图的指南 `pic.ms.gz`。\n\n更多学习 `groff` 的推荐资源可以参见第 731 页的附录 D [感兴趣的参考文献]。\n\
  \n## 15.5.4 制作图表或表格\n\n`groff` 提供了制作各种表格和图表的功能。一旦你学会了基本的格式化命令，就能很容易地排版专业的表格。\n\n\
  表格数据存储在纯文本文件中，并使用 `groff` 命令指定如何格式化；使用 `tbl` 来处理此类文件。它接受带有 `groff` 表格格式的的文本文件作为输入，并默认输出\
  \ PostScript。\n\n每个表格都写在自己的文件中，第一行以 `.TS` 命令（表格开始”）开头。随后是用于排版表格的格式化命令、数据本身，最后在文件的最后一行是\
  \ `.TE` 命令（表格结束”）。\n\n例如，假设你有一个名为 `zones` 的文件，如图 15-3 所示。\n\n```text\n.TS\nallbox;\n\
  c s s\nc c c\nn n l.\n植物耐寒分区\nZone | Min. Temp. | Example Cities\n1 | Below -50\
  \ F | 阿拉斯斯加州费尔银行；Resolute，西北地区（加拿大）\n2a | -50 to -45 F | 阿拉斯斯加州普德霍湾；Flin Flon，曼尼托瓦（加拿大）\n\
  2b | -45 to -40 F | 阿拉斯斯加州阿拉纳基特；明尼苏达州 Pinecreek\n3a | -40 to -35 F | 明尼苏达州国际瀑布；阿拉斯加州圣迈克尔\n\
  3b | -35 to -30 F | 威斯康星州托霍克；蒙大拿州西尼\n4a | -30 to -25 F | 明尼苏达州明尼阿利斯/圣保罗；蒙大拿州刘斯\n\
