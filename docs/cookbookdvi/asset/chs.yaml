  \ `play`。\n\n\n\n\n你可以使用分号字符（`;`）将所有内容在单行中作为单个命令运行。以下命令等同于之前的示例：\n\n```bash\nfor\
  \ i in *; { mv -i $i echo $i | tr '[A-Z]' '[a-z]'; }\n```\n\n在 `mv` 命令中使用 `-i` 选项是因为否则该命令可能会无意中删除文件——例如，如果你有名为\
  \ `CAT`、`Cat` 和 `cat` 的文件，在不加 `-i` 的情况下，该命令将删除其中两个。\n\n此外，对于不受转换为小写转换影响的文件（例如，名为\
  \ `dog` 的文件），此命令将不执行任何操作，并输出一条消息指示原始文件名和新文件名相同。\n\n⇒ 要将当前目录下所有 `.JPG` 扩展的文件名转换为小写，请输入：\n\
  \n```bash\nfor i in *.JPG; { mv -i $i echo $i | tr '[A-Z]' '[a-z]'; }\n```\n\n你可以使用\
  \ `tr` 对一组文件执行任意数量的转换，例如将所有小写字母转换为大写，或删除某些字符。\n\n⇒ 这里是使用它的几种方法。\n\n• 要将当前目录下所有 `.jpg`\
  \ 扩展的文件名转换为大写，请输入（同一行）：\n\n```bash\nfor i in *.jpg; { mv -i $i echo $i | tr '[a-z]'\
  \ '[A-Z]'; }\n```\n\n• 要重命名当前目录下所有文件名中包含 `386` 的文件并删除名称中的 `386`，请输入：\n\n```bash\n\
  for i in *386*; { mv -i $i echo $i | tr -d '386'; }\n```\n\n### 5.5.2 重命名相同扩展名的多个文件\n\
  \n有三种可靠的方法可以将具有相同扩展名的文件组全部重命名为其他扩展名。前两种方法与之前的食谱相同。\n\n#### 方法 #1\n\n使用 `rename`\
  \ 工具，它是 Perl 编程语言的一部分。它接受两个参数：一个描述要进行更改的引号内的 Perl 表达式，以及要执行更改的文件。\n\n⇒ 要将当前目录下所有以\
  \ `.JPG` 结尾的文件重命名为以 `.jpeg` 结尾的文件，请输入：\n\n```bash\nrename 's/.JPG/.jpeg/' *.JPG\n\
  ```\n\n#### 方法 #2\n\n使用 `mv` 移动文件，并用 `basename` 工具导出新文件名。使用 Bash 内置的 `for` 结构遍历所有文件，并在每个文件上运行此命令行（有关此内置命令的更多信息，请参见\
  \ bash Info 文档）。\n\n⇒ 要将当前目录下所有以 `.JPG` 结尾的文件重命名为以 `.jpeg` 结尾的文件，请输入：\n\n```bash\n\
  for i in *.JPG\n>\n    mv -i $basename $i JPG.jpeg\n}\n```\n\n你可以使用分号字符（`;`）在单行中运行这些命令。以下命令等同于之前的示例：\n\
  \n```bash\nfor i in *.JPG; { mv -i $basename $i JPG.jpeg; }\n```\n\n#### 方法 #3\n\
  \n要将一组文件从一种扩展名重命名为另一种，可以使用 `for` 循环配合 `mv`（如方法 2），但不再使用 `basename`，而是使用 Bash Shell\
  \ 参数扩展功能指定新的扩展名。\n\n⇒ 要重命名当前目录下所有的 `.jpg` 文件，使其它们都具有 `.jpeg` 扩展名，请输入：\n\n```bash\n\
  for i in .jpg\n>\n    mv $i \"${i%.jpg*}.jpeg\"\n}\n```\n\n**注意：** 同时重命名多个文件是一个常见请求。\n\
  \n### 5.6 删除文件和目录\n\n使用 `rm`（“remove”）删除文件并将其从系统中移除。将要删除的文件名作为参数提供。\n\n⇒ 要删除当前工作目录下的\
  \ `notes` 文件，请输入：\n\n```bash\nrm notes\n```\n\n要删除目录及其包含的所有文件和子目录，请使用 `-R`（递归）选项。\n\
  \n⇒ 要删除 `waste` 目录及其所有内容，请输入：\n\n```bash\nrm -R waste\n```\n\n要删除空目录，使用 `rmdir`；它会删除你指定的空目录。如果你指定的目录包含文件或子目录，`rmdir`\
  \ 将报告报告错误。\n\n⇒ 要删除 `empty` 目录，请输入：\n\n```bash\nrmdir empty\n```\n\n#### 5.6.1 删除命名特殊的文件\n\
  \n文件名中带有特殊字符（如空格、控制字符和开头的连字符）的文件在想要删除它们时会产生问题。这个问题有几种解决方案。\n\n##### 方法 #1\n\n一种方法是使用制表符补全完成文件名（参见食谱\
  \ 3.1.4 [让 Shell 自动完成你输入的内容]，第 61 页）。当你想要删除的文件名有足够的字符来唯一标识它以便补全功能工作时，这种方法有效。\n\n\
  ⇒ 要删除当前目录下的 `notes` 文件，请输入：\n\n```bash\nrm notes\n```\n\n##### 方法 #2\n\n当文件名以控制字符开头时，可以使用模式指定文件名（参见食谱\
  \ 5.8 [指定文件名]，第 48 页）。使用 `-i` 选项确认删除。\n\n⇒ 在一个包含 `dog` 的目录中删除 `cat` 文件，请输入：\n\n\
  ```bash\nrm -i ?cat\n```\n\n##### 方法 #3\n\n上述两种方法对于以连字符（-）开头的文件无效，因为 `rm` 将此类文件名解释为选项；要删除此类文件，请使用\
  \ `--` 选项——它指定后续内容是参数而不是选项。\n\n⇒ 要从当前目录删除文件 `-cat`，请输入：\n\n```bash\nrm -- -cat\n\
  ```\n\n#### 5.6.2 交互式删除文件\n\n一旦文件被删除，它就会被永久删除，没有没有命令可以恢复它；你无法“撤销删除”。（然而，如果你能在删除文件后立即卸载包含该文件的文件系统，向导可能通过使用\
  \ `grep` 搜索文件系统设备来重构丢失的文件。）\n\n删除文件的安全方法是使用带有 `-i` 选项的 `rm`，该选项指定 `rm` 以*交互式*模式运行，它会询问你确认删除每个文件。\n\
  \n⇒ 要交互式删除 `~/tmp` 目录下的文件，请输入：\n\n```bash\nrm -i ~/tmp\n```\n\n\n\n如果文件受写保护，当你尝试删除它时，`rm`\
  \ 总是会要求你先确认删除。当你有大量文件要删除时，这非常麻烦。在这种情况下，使用 `yes` 将自动的“y”答案传递到带有 `-R` 选项的 `rm`（参见方案\
  \ 3.1.10 [自动回答命令提示]，第 65 页）。\n\n⇒ 要删除 `scrap` 目录及其所有内容（包括任何写保护的文件），输入：\n\n```bash\n\
  yes | rm -R scrap\n```\n\n**注意：** 这是一个危险的操作！此命令将永久删除你提供的所有文件和目录，因此在运行之前，请确定你想要删除它们！\n\
  \n4 查看文件 `/usr/doc/FAQ/unix-faq-part3`，或者在 Web 上：http://www.faqs.org/faqs/unix-faq/faq/。\n\
  \n152\n《Linux 操指南》，第 2 版\n\n## 5.7 给文件多个名称\n\n`链接`（Links）是指向其他文件的特殊文件；当你对链接文件进行操作时，你实际上是对它指向的文件进行操作。链接有两种类型：符号链接和硬链接。\n\
  \n`符号链接`（有时称为“symlink”或“软链接”）将大多数操作（如读取和写入）传递给它所指向的文件。在文件列表中，符号链接通过第一列第一个字符的“l”来识别，并且默认情况下，它们在彩色列表中被输出为青色。\n\
  \n如果你删除一个符号链接，你只删除了链接本身，而*不是*原始文件。然而，如果你删除了原始文件并将其替换为其他文件，符号链接将指向新文件的内容。你可以为目录创建符号链接，也可以跨文件系统创建符号链接（参见第\
  \ 24 章 [磁盘存储]，第 501 页）。\n\n`硬链接`是现有文件的另一个名称，它与它所链接的文件不可区分。如果你修改了一个文件，任何指向该文件的硬链接也会随之修改；反之，修改任何一个硬链接也会修改原始文件以及该文件可能拥有的任何其他硬链接。因此，如果你从文件\
  \ `foo` 到文件 `bar` 创建一个硬链接，然后修改文件 `bar`，文件 `foo` 也会被同样修改。\n\n所以，如果说符号链接指向它所链接的文件，那么硬链接就是该文件的另一个实例。如果你更改了原始文件，所有的硬链接也会跟着改变。如果你更改了任何一个硬链接，原始文件和所有其他硬链接都会改变。但如果你*删除*了原始文件，任何硬链接仍然包含原始文件的内容。\n\
  \n与符号链接不同，你无法为目录创建硬链接，也无法跨文件系统创建硬链接。\n\n系统上的每个文件至少有一个硬链接，即原始文件名本身。目录始终至少有*两个*硬链接——目录名称本身（出现在其父目录中）以及目录内部的特殊文件\
  \ `.`。同样，当你创建一个新的子目录时，父目录会为新子目录内部的特殊文件 `..` 一个新的硬链接。\n\n### 方法 #1\n\n使用 `ln`（“link”）来为文件创建链接。提供要链接的现有文件名称和用于链接的名称作为参数。默认情况下，`ln`\
  \ 创建硬链接。\n\n第 5 章：文件和目录\n\n153\n\n⇒ 要从 `seattle` 到 `emerald-city` 创建一个硬链接，输入：\n\n\
  ```bash\nln seattle emerald-city\n```\n\n此命令从现有文件 `seattle` 到新文件 `emerald-city`\
  \ 创建一个硬链接。你可以像处理 `seattle` 一样读取和编辑 `emerald-city` 文件；你对 `emerald-city` 做的任何更改也会写入\
  \ `seattle` 中（反之亦然）。但如果你删除了 `emerald-city` 文件，`seattle` 文件*不会*被删除（反之亦然）。\n\n###\
  \ 方法 #2\n\n要创建符号链接，请使用带有 `-s` 选项的 `ln`。\n\n⇒ 要从 `seattle` 到 `emerald-city` 创建符号链接，输入：\n\
  \n```bash\nln -s seattle emerald-city\n```\n\n此命令从现有文件 `seattle` 到新文件 `emerald-city`\
  \ 创建一个符号链接。如果你删除了文件 `emerald-city`，文件 `seattle`*不会*被删除；但另一方面，删除 `seattle` 文件将导致\
  \ `emerald-city` 变成一个失效链接，直到另一个名为 `seattle` 的文件再次出现在其位置——此时，`emerald-city` 将指向那个新文件。\n\
  \n**注意：** 该方案也可以称为“将一个文件链接到另一个文件”。\n\n## 5.8 使用模式指定文件名\n\n当你在命令中指定一个或多个文件的名称时，你提供了一个*文件规范*（file\
  \ specification），通常简写 `filespec`。\n\n这些 `filespecs` 不需要是特定文件的字面名称。Shell 提供了一种强大的构建模式的方法，称为文件名*扩展*（expansions），用于指定一组路径和文件。在\
  \ Unix 术语中，这种方式指定文件被称为*通配匹配*（globbing）。\n\n在指定文件和目录名称时，可以使用这些模式作为任何工具或应用程序的参数；Shell\
  \ 会将你的模式（或“通配匹配”）扩展为符合模式的文件名。给定的模式是一个*通配表达式*。\n\n下表列出了各种扩展字符及其含义。\n\n154\n《Linux\
  \ 操纵指南》，第 2 版\n\n`*` 星号匹配零或多个字符，有时被称为“通配符”字符。例如，`*` 扩展为指定目录下的所有名称，`a*` 扩展为以“a”开头并跟随任意字符字符，`a*b`\
  \ 扩展为以“a”开头并以“b”结尾的名称。\n\n`?` 问号匹配恰好一个字符。因此，`?` 扩展为所有恰好有一个字符的名称，`??` 扩展为所有具有*两个*字符的名称，`a?`\
  \ 扩展为以“a”开头且恰好有一个字符的名称。\n\n`{string1,string2,...}` 大括号对逗号分隔的字符串分组，所有字符串将被匹配。因此 `{a,b}c`\
  \ 扩展为“ac”和“bc”。\n\n`[list]` 方括号匹配*list* 中的一个字符。例如，`[ab]` 匹配两个名称：“a”和“b”。模式 `c[io]`\
  \ 匹配“ci”和“co”，但不其他名称。\n\n`~` 波浪字符扩展为你的家目录（`HOME` 变量的值；参见方案 3.5 [使用 变量]，第 77 页）。例如，如果你的用户名是\
  \ `mary` 且家目录是 `/home/mary`，那么 `~` 将扩展为 `/home/mary`。你可以在波浪号后加上路径以指定家目录中的文件——例如\
  \ `~/work` 将扩展为 `/home/mary/work`。\n\n第 5 章：文件和目录\n\n155\n当与其他字符结合使用时，括号也具有特殊含义，如下表所示。\n\
  \n`-` 连字符作为括号*列表*的一部分表示要匹配的字符*范围*——所以 `[a-m]` 匹配从“a”到“m”的所有小写字母。要匹配字面连字符，请将其作为列表中的第一个或最后一个字符。例如，`a[-b]c`\
  \ 匹配两个文件：`a-c` 和 `abc`。\n\n`!` 在括号列表开头放置感叹号，以匹配列出字符之外的所有字符。例如，`a[!b]c` 匹配所有以“a”开头、以“c”结尾且中间有任意一个字符（除“b”之外）的文件；它匹配\
  \ `aac`、`adc` 等文件。\n\n你可以任意组合这些特殊的扩展字符，并且可以将多个模式作为多个参数指定。\n\n⇒ 以下示例了文件扩展的用法，使用了本章之前描述的命令。\n\
  \n* 要列出 `/usr/bin` 目录下名称中任何地方包含“tex”文本的文件，输入：\n\n\n\n\n```bash\nls /usr/bin/*tex\n\
  ```\nRET\n\n- 要将所有以 `.txt`、`.text`、`.doc` 或 `.info` 结尾的文件复制到 `doc` 子目录下，请输入：\n\n\
  ```bash\ncp *.txt,text,doc,info doc\n```\nRET\n\n- 要输出所有三个字符扩展名结尾的文件详细列表，并对列表进行排序使较新的文件排在前面，请输入：\n\
  \n```bash\nls -lt *.???\n```\nRET\n\n- 要将 `/usr/tmp` 目录下所有名称由“song”文本后跟 `0` 到 `9`\
  \ 之间的整数以及 `.cdda` 扩展的文件移动到你家目录下的 `music` 目录中，请输入：\n\n```bash\nmv /usr/tmp/song[0-9].cdda\
  \ ~ */music\n```\nRET\n\n156\n\n《Linux 厨房指南》，第 2 版\n\n- 要删除当前工作目录下所有以连字符开头、且文件名中其他地方包含“out”文本的文件，请输入：\n\
  \n```bash\nrm -- -out\n```\nRET\n\n- 要合并所有名称由字母“a”后跟两个或更多字符的文件，请输入：\n\n```bash\n\
  cat a??\n```\nRET\n\n## 5.9 列出目录树图\n\n### Tree (树)\n\nDEB: `tree`\n\nRPM: `tree`\n\
  \nWWW: `ftp://mama.indstate.edu/linux/tree/`\n\n使用 `tree` 输出给定目录树的 ascii 文本树图。\n\
  \n⇒ 要输出当前目录及其所有子目录的树图，请输入：\n\n```bash\ntree\n```\nRET\n\n```\n.\n|-- projects\n\
  |\n|-- current\n|\n`-- old\n|\n|-- 1\n|\n`-- 2\n`-- trip\n-- schedule.txt\n4 directories,\
  \ 3 files\n```\n\n在前面的示例中，绘制了一幅树图显示了当前目录，它包含了两个目录 `projects` 和 `trip`；`projects`\
  \ 目录又包含了 `current` 和 `old` 目录。\n\n要输出特定目录树的树图，请将该目录树的名字作为参数。\n\n第 5 章：文件与目录\n\n\
  157\n\n⇒ 要输出你的家目录及其所有子目录的树图，请输入：\n\n```bash\ntree ~\n```\nRET\n\n要输出仅包含目录名的目录树图，请使用\
  \ `-d` 选项。这对于输出整个系统的目录树，或者获取特定目录树的结构非常有帮助。\n\n⇒ 这里是使用该功能的一些方法。\n\n- 要将整个系统的树图输出到文件\
  \ `tree`，请输入：`````bash\ntree -d /* > tree\n```\nRET\n\n- 要查看 `/usr/local` 目录树的树图，请输入：`````bash\n\
  tree -d /usr/local | less\n```\nRET\n\n**注意：**另一种输出目录树的工具在食谱 24.2 [列出文件的磁盘占用] 第\
  \ 502 页中介绍。\n\n## 5.10 浏览文件与目录\n\n有几种方法可以浏览系统上的文件。这里有我推荐的三种。\n\n### 方法 #1：Midnight\
  \ Commander (午夜司令)\n\nDEB: `mc-common`\n\n```bash\nmc\n```\n\nRPM: `mc`\n\nWWW:\
  \ `http://www.ibiblio.org/mc/`\n\n浏览系统上文件最简单的方法是使用一个专门为此目的设计的“文件管理器”工具。Linux 上至少有几个这样的工具，除了\
  \ gnome5 和 kde 自带的文件管理器之外；最流行的独立文件管理器可能是久誉的“Midnight Commander”。\n\n输入 `mc` 运行它。提供一个要浏览的目录名称作为参数，可以是相对于当前目录的路径，也可以是完整路径。如果你没有提供任何参数，`mc`\
  \ 将使用当前工作目录。\n\n⇒ 使用 Midnight Commander 浏览 `/usr/local/` 目录，请输入：\n\n```bash\nmc\
  \ /usr/local\n```\nRET\n\n5 分别 Nautilus 和 Konqueror。\n\n![](img/index-192_1.jpg)\n\
  \n158\n\n《Linux 厨房指南》，第 2 版\n\n在浏览目录时，`mc` 会提供两个显示窗口，称为*目录* *面板* (*directory *panels*)。使用鼠标访问顶部菜单栏上的下拉菜单。\n\
  \n功能键提供帮助和其他菜单；它们列在屏幕的最底部。上方是 Bash 命令行，你可以像平常在 shell 中一样使用它。输入 `F10` 退出 `mc` 并返回到运行它的\
  \ shell。\n\n图 5-7 展示了在浏览典型系统的根目录时 Midnight Commander 的外观。\n\n*图 5-7. 使用 Midnight\
  \ Commander 浏览本地文件。*\n\n### 方法 #2：Lynx\n\nDEB: `lynx`\n\nRPM: `lynx`\n\nWWW: `http://lynx.browser.org/`\n\
  \n你可以在 Web 浏览器中查看和浏览本地文件，例如纯文本浏览器 `lynx` 或用于 X 的图形化 Mozilla 浏览器。\n\n`lynx` 工具非常适合浏览系统上的文件——提供要浏览的目录名称作为参数，`lynx`\
  \ 将显示该目录下可用文件和目录的列表。\n\n![](img/index-193_1.jpg)\n\n第 5 章：文件与目录\n\n159\n\n你可以使用光标键进行浏览，并在子目录上按\
  \ RET 进入该目录。6 你可以使用 `lynx` 浏览系统上的文件——提供路径名称作为参数。这对于 `/usr/doc` 和 `/share/doc` 目录非常有帮助。\n\
  \n⇒ 这里是使用该功能的一些方法。\n\n- 要输出整个系统的树图到文件 `tree`，请输入：`````bash\ntree -d /* > tree\n\
  ```\nRET\n\n- 要查看 `/usr/local` 目录树的树图，请输入：`````bash\ntree -d /usr/local | less\n\
  ```\nRET\n\n在浏览典型系统的根目录时 Midnight Commander 的外观见图 5-7。\n\n*图 5-7. 使用 Lynx 浏览本地文件。*\n\
  \n**注意：**另一种输出目录树的工具在食谱 24.2 [列出文件的磁盘占用] 第 502 页中介绍。\n\n### 方法 #3：Mozilla\n\nDEB:\
  \ `mozilla-browser`\n\nRPM: `mozilla`\n\nWWW: `http://www.mozilla.org/`\n\n使用 Mozilla\
  \ 像方法 #2 那样浏览，提供路径名称作为参数。\n\n第 5 章：文件与目录\n\n161\n\n**注意：**另一种输出目录树的工具在食谱 24.2 [列出文件的磁盘占用]\
  \ 第 502 页中介绍。\n\n162\n\n《Linux 厨房指南》，第 2 版\n\n第 6 章：共享文件\n\n163\n\n## 6. 共享文件\n\n\
  组、所有权和访问权限是允许用户之间共享文件的 Linux 特性。但即使你不计划与其他用户共享文件，了解这些主题也是重要的；这些概念将帮助你理解 Linux 如何处理文件访问和安全，并让你能够控制访问方式。\n\
  \n### 6.1 组工作\n\n*组*是用户集合，用于共享文件并促进协作。\n\n所有组都有唯一的名称，并被分配一个唯一的组 ID，称为 gid。组的每个成员都可以处理该组的文件并创建属于该组的新文件。系统管理员可以根据用户的组织需求添加新组并赋予用户不同的组身份。例如，一个供船员使用的系统可能会有特殊组，如厨房、甲板、驾驶舱和船员；船长可能是所有组的成员，但管家可能只是厨房组和船员组的成员。\n\
  \n在 Linux 系统上，你至少是一个组的成员：你的*登录组*。它的名称与你的用户名相同，你是它唯一的成员。1\n\n以下食谱展示了如何列出组及其成员。\n\n\
  #### 6.1.1 列出可用组\n\n系统上所有可用组的列表保存在文件\n\n\n\n\n\n`/etc/group` 被称为*用户组文件*。这是一个文本文件，包含一个组列表，每行一个，字段由冒号（`:`）分隔：组名、加密后的密码（现代系统使用所谓的*影子*密码\
  \ *shadow passwords*，这意味着实际的加密密码存储在其他处，这里显示一个“x”字符作为占位符）、组 ID（gid）以及该组所有成员用户的逗号分隔的列表。\n\
  \n要列出系统上可用的组，请列出此文件的内容。\n\n1 这是某些系统（包括 Debian 发行版）的默认设置，但并非所有发行版的标准；在这些问题上，本章将假设\
  \ Debian 的行为。\n\n*⇒* 要列出文件 `/etc/group` 的内容，输入：\n```\n$cat /etc/group\n```\n\n此命令使用\
  \ `cat` 工具输出文件的全部内容（参见食谱 9.2 [显示文本]，第 216 页），列出所有字段。使用 `cut` 输出特定字段（参见食谱 13.7.4\
  \ [从文本中删除列]，第 324 页）。\n\n*⇒* 要输出系统上所有组名的列表，输入：\n```\n$cut -d : -f1 /etc/group\n\
  ```\n\n**注意：** 关于用户组文件的更多信息，请参阅 group 的 man 页面。\n\n## 6.1.2 列出用户所属的组\n\n要列出用户的组成员身份，请使用\
  \ `groups` 工具。提供任意数量的用户名作为参数，`groups` 将每个用户输出一行，包含该用户所属的所有组的列表，前面是用户名和冒号（`:`）。如果不提供任何参数，`groups`\
  \ 将列出你自己的组成员身份。\n\n*⇒* 要列出你的组成员身份，输入：\n```\n$groups\n```\n```\nsteward galley crew\n\
  ```\n\n在此示例中，输出了三个组：steward（用户的登录组）、galley（厨房组）和 crew（船员）。\n\n*⇒* 要列出用户 marlow 的组成员身份，输入：\n\
  ```\n$groups marlow\n```\n```\nmarlow : marlow\n```\n\n在此示例中，命令输出了指定的用户名 `marlow`，随后是一个组名\
  \ `marlow`，表示用户 `marlow` 仅属于一个组：他的登录组。\n\n## 6.1.3 列出组的成员\n\n有两种方法可以列出特定组的成员。\n\n\
  ### 方法 #1\n\n使用 `members` 工具列出特定组的成员。将特定组的名字作为参数。\n\n*⇒* 要输出 galley 组的成员列表，输入：\n\
  ```\n$members galley\n```\n```\ncaptain steward pete\n```\n\n在此示例中，输出了三个用户名，表示这三个用户是\
  \ galley 组的成员。\n\n**注意：** `members` 工具在 Debian 发行版之外尚未广泛可用；如果你找不到其副本，可以随时从 Debian\
  \ 软件包安装源码（参见食谱 1.1.2 [食谱的准备]，第 3 页）。\n\n### 方法 #2\n\n在没有方便安装 `members` 的系统上，可以通过结合使用\
  \ `grep` 和 `cut` 来列出特定组的成员。首先，使用 `grep` 输出 `/etc/group` 中第一个字段匹配特定组名的行，并将输出通过给 `cut`\
  \ 以仅输出最后一个字段，该字段包含属于该组的用户列表。\n\n*⇒* 要列出 `crew` 组的所有成员，输入：\n```\n$grep ^crew:/etc/group\
  \ | cut -d : -f 4\n```\n\n**注意：** 关于 `grep` 和 `cut` 的更多信息，请分别食谱 14.1 [在文中搜索单词]，第\
  \ 333 页和食谱 13.7.4 [从文本中删除列]，第 324 页。\n\n## 6.2 文件所有权\n\n每个文件都属于一个用户和一个组——通常属于创建它的用户以及该用户当时所属的组（这几乎总是是该用户的登录组）。文件所有权决定了用户对特定文件的访问类型（参见食谱\
  \ 6.3 [控制文件的访问]，第 167 页）。\n\n### 6.2.1 确定文件的所有权\n\n要确定哪个用户和组拥有特定文件，使用带有 `-l` 选项的\
  \ `ls` 查看文件的属性（参见食谱 5.3.3 [列出文件属性]，第 136 页）。所有文件的用户名出现在输出的第三列，所有文件的组名出现在输出的第四列。\n\
  \n例如，假设一个名为 `cruise` 的文件的详细列表如下：\n```\n-rwxrw-r--\n1 captain\ncrew\n8,420 Jan 12\
  \ 21:42 cruise\n```\n所有此文件的用户是 `captain`，所有文件的组是 `crew`。\n\n**注意：** 当你创建一个文件时，它通常属于你和你的登录组，但你可以按照下一个食谱中的描述更改它的所有权。你通常拥有你主目录下的所有文件。\n\
  \n### 6.2.2 更改文件的所有权\n\n你不能将文件送给另一个用户，但其他用户可以创建属于你的文件的副本，前提他们对该文件有读取权限（参见食谱 6.3\
  \ [控制文件的访问]，第 167 页）。当你复制另一个用户的文件时，你拥有该副本。\n\n你也可以更改任何文件的所有权。要执行操作，使用 `chgrp`；它接受要设置的组名以及要操作的文件名。\n\
  \n*⇒* 要将 `cruise` 的组改为 `bridge`，输入：\n```\n$chgrp bridge cruise\n```\n这将将 `cruise`\
  \ 的组所有权转移给 `bridge`；组权限（如下）现在适用于该组成员。\n\n使用 `-R` 选项递归更改目录及其所有内容的所有权。\n\n*⇒* 要将 `maps`\
  \ 目录及其所有内容的组改为 `bridge`，输入：\n```\n$chgrp -R bridge maps\n```\n\n## 6.3 控制文件的访问\n\
  \n每个文件都有一组权限，规定了不同用户的访问类型。有三种权限：读取、写入和执行。你需要*读取*权限来读取文件内容，需要*写入*权限来写入更改或删除文件，需要*执行*权限来运行程序。\n\
  \n通常，用户只对自己目录下的文件具有写入权限。只有超级用户对 `/bin` 和 `/etc` 等重要目录的文件具有写入权限——因此作为普通用户，你不需要担心写入或删除重要的系统文件。\n\
  \n权限的工作方式与其他类型的文件不同。\n\n目录的读取权限意味着你可以看到目录中的文件；写入权限允许你创建、移动或删除目录中的文件；执行权限允许你在路径中使用目录名（参见第\
  \ 5 章 [文件和目录]，第 125 页）。\n\n如果你对目录有读取权限但没有执行权限，你只能读取目录中的文件名——无法读取它们的其他属性、查看其内容、写入它们或执行它们。对于具有执行权限但没有读取权限的目录，只要你知道文件名并且对该文件拥有相应的权限，就可以读取、写入或执行该目录中的任何文件。\n\
  \n每个文件针对三类用户都有单独的权限：拥有文件的用户、该文件所属组的其他成员，以及系统上的所有其他用户。如果你是拥有该文件的组的成员，则该文件的组权限适用于你（除非你是该文件的所有者，在这种情况下用户权限适用于你）。\n\
  \n当你创建一个新文件时，它拥有一组默认权限——通常用户具有读取和写入权限，组和所有其他用户具有读取权限。（在某些系统上，默认权限是用户和组都具有读取和写入权限，所有其他用户具有读取权限。）\n\
  \n文件的访问权限统称为其*访问模式*。\n\n\n\n\n以下章节描述了如何列出和更改文件访问模式，包括如何设置最常用的访问模式。\n\n**注意：** 超用户\
  \ `root` 始终可以访问系统上的任何文件，无论其访问权限如何。\n\n有关文件权限和访问模式的更多信息，请参阅 `fileutils` Info 文档（参见\
  \ Recipe 2.8.5 [阅读 Info 手册]，第 48 页）。\n\n### 6.3.1 列出文件的权限\n\n要列出文件的访问权限，请使用带有 `-l`\
  \ 选项的 `ls` 命令（参见 Recipe 5.3.3 [列出文件属性]，第 136 页）。文件访问权限出现在输出的第一列，紧跟文件类型字符之后。\n\n\
  例如，考虑文件 `cruise` 的详细列出：\n\n```\n-rwxrw-r-- 1 captain crew 8,420 Jan 12 21:42 cruise\n\
  ```\n\n第一个字符（`-`）是文件类型；接下来的三个字符（`rwx`）指定文件所有者的权限；接下来的三个（`rw-`）指定文件所在组所有成员的权限，但文件所有者除外。列中的最后三个字符（`r--`）指定系统中所有其他用户的权限。\n\
  \n所有三个权限部分具有相同的格式，从左到右分别用 `r`、`w` 和 `x` 字符表示读、写和执行权限。\n\n用连字符（`-`）代替这些字母中的一个表示未赋予该权限。\n\
  \n在此示例中，列出结果表示文件所有者 `captain` 具有读、写和执行权限，文件所有组 `crew` 具有读和写权限。系统上的所有其他用户只有读权限。\n\
  \n### 6.3.2 更改文件的权限\n\n要更改你拥有的任何文件的访问模式，请使用 `chmod`（更改模式”）工具。它接受两个参数：一个*操作*（指定为某些用户授予或撤销的权限），以及要处理的文件名。\n\
  \n要构建操作，首先通过以下字符的组合指定用户类别或类别：\n\n- `u`: 文件的所有者。\n- `g`: 文件组的所有其他成员。\n- `o`: 系统上的所有其他用户。\n\
  - `a`: 系统上的所有用户；这等同于 `ugo`。\n\n随后是表示要执行操作的运算符：\n\n- `+`: 在用户现有的权限上添加权限。\n- `-`:\
  \ 从用户现有的权限中删除权限。\n- `=`: 使这些成为用户在该文件拥有的*唯一*权限。\n\n最后，用特殊字符指定权限本身：\n\n- `r`: 设置读权限。\n\
  - `w`: 设置写权限。\n- `x`: 设置执行权限。\n\n例如，使用 `u+w` 为文件所有者的现有权限添加写权限，使用 `a+rw` 为所有用户的现有权限同时添加读权限和写权限。（你也可以用\
  \ `ugo+rw` 代替 `a+rw`。）\n\n### 6.3.3 对文件进行写保护\n\n如果你撤销了用户对文件的写权限，他们将无法向该文件写入内容或删除文件。这有效地对文件进行了“写保护”，防止对其进行意外更改。写保护的文件有时被称为“只读”文件。\n\
  \n要对文件进行写保护以便除你之外的没有用户可以写入，请使用 `chmod` 并将 `go-w` 作为操作。\n\n⇒ 对文件 `cruise` 进行写保护以使其他用户无法更改它，输入：\n\
  \n```bash\n$ chmod go-w cruise\n```\n\n### 6.3.4 使文件私有\n\n要使文件对系统上的所有其他用户私有，请使用\
  \ `chmod` 并将 `go=` 作为操作。这会撤销所有组权限和其他访问权限。\n\n⇒ 使文件 `cruise` 对你以外的所有用户私有，输入： \n\n\
  ```bash\n$ chmod go= cruise\n```\n\n### 6.3.5 使文件公开\n\n要允许系统上有账户的任何人读取并更改文件，请使用\
  \ `chmod` 并将 `a+rw` 作为操作。这授予所有用户读和写权限，使文件变为“公开”。当文件对所有用户设置了读权限时，它被称为*世界可读*（world\
  \ readable），当文件对所有用户设置了写权限时，它被称为*世界可写*（world writable）。\n\n⇒ 使文件 `cruise` 同时变为世界可读和世界可写，输入：\n\
  \n```bash\n$ chmod a+rw cruise\n```\n\n### 6.3.6 使文件可执行\n\n*可执行文件*是你可以作为程序运行的文件。要更改文件权限以便所有用户都能作为程序运行它，请使用\
  \ `chmod` 并将 `a+x` 作为操作。\n\n⇒ 为所有用户赋予文件 `myscript` 执行权限，输入：\n\n```bash\n$ chmod\
  \ a+x myscript\n```\n\n**注意：** 通常，你获取或自己编写的 脚本没有设置执行权限，你必须手动设置。\n\n# 7. 查找文件\n\n\
  有时你可能想在系统中查找匹配给定条件的文件，例如特定的名称或文件大小。本章将向你如何在只知道文件名部分时查找文件，以及如何查找名称匹配给定模式的文件。你还将学习如何列出文件和目录。\n\
  \n### 7.1 查找匹配模式的所有文件\n\n查找文件的最简单方法是使用 `locate`。当你想要列出系统中匹配某种模式的文件时，可以使用它——例如路径中任何位置包含特定字符串的文件，或以某些扩展名结尾的文件。`locate`\
  \ 工具输出你给出的模式所匹配的文件列表，每行显示一个路径。\n\n在指定模式时，你可以使用任何文件名通配符（参见 Recipe 5.8 [使用通配符指定文件名]，第\
  \ 153 页）。\n\n⇒ 以下是一些用法：\n\n- 查找系统中路径名中任何位置包含 `audio` 的文件，输入：\n\n```bash\n$ locate\
  \ audio\n```\n\n- 查找系统中以 `.c` 扩展名结尾的文件，输入：\n\n```bash\n$ locate *.c\n```\n\n- 查找系统中所有的隐藏“点文件”，输入：\n\
  \n```bash\n$ locate /.*\n```\n\n有时，locate 搜索会产生大量输出。将输出通过给 `less` 以进行浏览（参见 Recipe\
  \ 9.1 [浏览文本]，第 211 页）。\n\n⇒ 浏览系统中所有的 `.cfg` 文件列表，输入：\n\n```bash\n$ locate .cfg |\
  \ less\n```\n\n**注意：** 搜索区分大小写。因此，搜索 `history` 会匹配 `~/.bash_history` 和 `/usr/local/history_data/README`，但不会匹配\
  \ `~/History_of_a_nation`。\n\n### 7.2 在目录树中查找文件\n\n使用 `find` 在特定的目录树中查找特定文件，将其完整路径输出到标准输出，每行一个。首先指定要搜索的目录树名称，然后指定匹配标准，以及要执行的操作。（与大多数其他工具不同，你必须在指定任何其他选项之前先指定目录树参数。）你可以在一个命令中指定多个搜索标准，并可以多种格式化输出。\n\
  \n\n\n下述配方中描述的选项数值参数有三种形式：当数字前面有加号（`+`）时，它匹配所有`greater`大于数字的文件；当数字前面有连字符或减号（`-`）时，它匹配所有`less`小于数字的文件；如果两种前缀都没有，它则匹配数字`exactly`等于指定值的文件。\n\
  \n### 7.2.1 按名称在目录树中查找文件\n\n要按名称在目录树中查找文件，请使用 `find`，首先给出要搜索的目录树名称，然后提供 `-name`\
  \ 选项，最后跟上你想查找的名字。\n\n*⇒* 列出系统中所有名为 `top` 的文件，请输入：\n```bash\nfind / -name top\n```\n\
  RET\n\n此命令将搜索你权限访问的系统中所有目录；如果你对某个目录没有执行权限，`find` 将报告无权限搜索该目录。\n\n`-name` 选项是区分大小写的；使用类似的\
  \ `-iname` 选项可以不区分大小写地查找名称。\n\n*⇒* 列出系统中所有名为 `top` 的文件（不区分大小写），请输入：\n```bash\nfind\
  \ / -iname top\n```\nRET\n\n此命令将匹配任何名称由字母 `top` 组成的文件，不区分大小写——包括 `Top`、`top` 和 `TOP`。\n\
  \n#### 第 7 章：查找文件\n\n使用文件扩展符字符（参见配方 5.8 使用模式指定文件名，第 153 页）来查找名称匹配模式的文件。将这些文件名模式放在单引号之间。\n\
  \n*⇒* 以下是使用此功能的一些方法。\n\n*•* 列出系统中所有以字符 `top` 开头的文件，请输入：\n```bash\nfind / -name 'top*'\n\
  ```\nRET\n\n*•* 列出所有以 `top` 三个字符开头且后面恰好接三个字符的文件，请输入：\n```bash\nfind / -name 'top???'\n\
  ```\nRET\n\n*•* 列出所有以 `top` 三个字符开头且后面接五个或更多字符的文件，请输入：\n```bash\nfind / -name 'top????*'\n\
  ```\nRET\n\n*•* 列出你家目录树中所有以 `.tex` 结尾的文件（不区分大小写），请输入：\n```bash\nfind ~ -iname '*.tex'\n\
  ```\nRET\n\n*•* 列出 `/usr/share` 目录树中所有以 `.jpg` 或 `.jpeg` 结尾的文件（不区分大小写），请输入：\n```bash\n\
  find /usr/share -iname '*.jp*g'\n```\nRET\n\n*•* 列出 `/usr/share` 目录树中名称中包含 `farm`\
  \ 文本的文件，请输入：\n```bash\nfind /usr/share -name '*farm*'\n```\nRET\n\n使用 `-regex` 代替\
  \ `-name` 来查找完整路径或相对路径匹配`regular expression`（正则表达式）的文件是一种描述字符串集合的模式（参见配方 14.3 匹配文本模式，第\
  \ 335 页）。\n\n*⇒* 以下是使用此功能的两种方法。\n\n*•* 列出当前目录树中所有相对路径中包含 `net` 或 `comm` 字符串的文件，请输入：\n\
  ```bash\nfind . -regex '.*\\(net\\*| *comm\\).*'\n```\nRET\n\n*•* 列出 `/usr/share`\
  \ 目录树中仅`only`以 `.jpg` 或 `.jpeg` 结尾的文件（不区分大小写），请输入：\n```bash\nfind /usr/share -iregex\
  \ '.*\\.\\(jpg\\*| *jpeg\\)'\n```\nRET\n\n该模式还匹配用任何其他字符替换“e”的文件——例如，`.jpog` 或 `.jp123g`。要匹配`only`以\
  \ `.jpg` 或 `.jpeg` 结尾的文件，请使用下文描述的 `-regex` 或 `-iregex` 搜索。\n\n`-regex` 选项相对于你指定的目录树匹配整个路径名，而不仅仅是文件名；由于由于，之前示例中的正则表达式以\
  \ `.*` 开头，以便首先匹配路径字符。要在搜索单词或短语时仅匹配文件名，请在搜索字符串后排除正斜杠字符（`/`），并使用 `! -type d` 排除目录（参见配方\
  \ 7.4.5 列出文件数量，第 184 页）。\n\n*⇒* 列出当前目录树中所有文件名中包含 `net` 或 `comm` 字符串的文件，请输入：\n```bash\n\
  find . -regex '.*\\(net\\*| *comm\\).[*^ */]*' ! -type d\n```\nRET\n\n### 7.2.2\
  \ 按大小在目录树中查找文件\n\n要查找特定大小的文件，请使用 `-size` 选项，后跟要匹配的文件大小。默认单位是 512 字节块；在大小后加上 `k`\
  \ 表示千字节，加上 `b` 表示字节。\n\n*⇒* 以下是使用此功能的一些方法。\n\n*•* 列出 `/usr/local` 目录树中所有大于 10,000\
  \ 千字节的文件，请输入：\n```bash\nfind /usr/local -size +10000k\n```\nRET\n\n*•* 列出你家目录树中所有小于\
  \ 300 字节的文件，请输入：\n```bash\nfind ~ -size -300b\n```\nRET\n\n*•* 列出系统中所有大小恰好为 42 字节块的文件，请输入：\n\
  ```bash\nfind / -size 42\n```\nRET\n\n使用 `-empty` 选项查找空文件——大小为 0 的文件。\n\n*⇒* 查找你目录树中的所有空文件，请输入：\n\
  ```bash\nfind ~ -empty\n```\nRET\n\n### 7.2.3 按访问时间在目录树中查找文件\n\n要查找指定时间访问的文件，请使用\
  \ `find` 配合 `-amin`、`-anewer` 或 `-atime` 选项。在 `-amin` 后提供的参数指定访问前的分钟数或二十四小时。\n\n\
  *⇒* 以下是使用此功能的一些方法。\n\n*•* 列出你家目录树中在一小时前访问的文件，请输入：\n```bash\nfind ~ -amin 60\n```\n\
  RET\n\n*•* 列出你家目录树中在过去六十分钟内访问的文件，请输入：\n```bash\nfind ~ -amin -60\n```\nRET\n\n*•*\
  \ 列出 `/usr/share` 目录树中二十四小时前访问的文件，请输入：\n```bash\nfind /usr/share -atime 1\n```\n\
  RET\n\n*•* 列出 `/usr/share` 目录树中比 `~/template` 文件更晚访问的文件，请输入：\n```bash\nfind /usr/share\
  \ -anewer ~/template\n```\nRET\n\n`-daystart` 选项从今天开始计算时间，而不是从二十四小时前。该选项必须放在时间表达式之前。\n\
  \n*⇒* 列出 `/usr/share` 目录树中两天前访问的文件，请输入：\n```bash\nfind /usr/share -daystart -atime\
  \ 2\n```\nRET\n\n### 7.2.4 按更改时间在目录树中查找文件\n\n要查找状态改变（即权限而非内容）的文件，请使用 `find` 配合 `-ctime`、`-cmin`\
  \ 或 `-cnewer` 选项；在 `-ctime` 后参数指定二十四小时周期，在 `-cmin` 后指定分钟数。作为 `-cnewer` 参数的文件名指定了状态比该特定文件修改更晚的文件。\n\
  \n*⇒* 以下是使用此功能的一些方法。\n\n*•* 列出你家目录树中在过去十分钟内状态改变的文件，请输入：\n```bash\nfind ~ -cmin -10\n\
  ```\nRET\n\n*•* 列出系统中所有状态比 `/etc/inittab` 文件修改更晚的文件，请输入：\n```bash\nfind / -cnewer\
  \ /etc/inittab\n```\nRET\n\n*•* 列出当前目录树中状态恰好在二十四小时前改变的文件，请输入：\n```bash\nfind . -ctime\
  \ 1\n```\nRET\n\n*•* 列出当前目录树中在过去二十四小时内状态改变的文件，请输入：\n```bash\nfind . -ctime -1\n\
  ```\nRET\n\n`-daystart` 选项从今天开始计算时间，而不是从二十四小时前。该选项必须放在时间表达式之前。\n\n*⇒* 列出当前目录树中状态在一周前改变的文件，请输入：\n\
  ```bash\nfind . -daystart -ctime 7\n```\nRET\n\n\n\n\n## 7.2.5 按修改时间在目录树中查找文件\n\n\
  要查找在指定时间最后修改的文件，请使用 `find` 命令配合 `-mtime` 或 `-mmin` 选项；`-mtime` 的参数指定 24 小时的周期数，而\
  \ `-mmin` 则指定分钟数。\n\n⇒ 以下是该的一些用法。\n\n• 列出当前目录树中在过去 10 分钟内修改过内容的所有文件，输入：\n\n```bash\n\
  find . -mmin -10\n```\n\n• 列出 `/usr/local` 目录树中正好 24 小时前修改的文件，输入：\n\n```bash\nfind\
  \ /usr/local -mtime 1\n```\n\n• 列出 `/usr` 目录树中正好 5 分钟前修改的文件，输入：\n\n```bash\nfind\
  \ /usr -mmin 5\n```\n\n• 列出 `/usr/local` 目录树中在过去 24 小时内修改的文件，输入：\n\n```bash\nfind\
  \ /usr/local -mtime -1\n```\n\n• 列出 `/usr` 目录树中在过去 5 分钟内修改的文件，输入：\n\n```bash\nfind\
  \ /usr -mmin -5\n```\n\n包含 `-daystart` 选项可以从今天开始计算时间，而不是从 24 小时前开始。该选项必须置于其作用的时间表达式之前。\n\
  \n⇒ 以下是该的一些用法。\n\n• 列出你家目录树中在昨天修改的所有文件，输入：\n\n```bash\nfind ~ -daystart -mtime 1\n\
  ```\n\n• 列出 `/usr` 目录树中在一年前或更早修改的所有文件，输入：\n\n```bash\nfind /usr -daystart -mtime\
  \ +365\n```\n\n• 列出你家目录树中在 2 到 4 天前修改的所有文件，输入：\n\n```bash\nfind ~ -daystart -daystart\
  \ -mtime +2 -mtime -4\n```\n\n在前面的示例中，组合选项 `-mtime +2` 和 `-mtime -4`（每个都以 `-daystart`\
  \ 选项为前）匹配了在 2 到 4 天前修改的文件。\n\n要查找比给定文件更新的文件，请将该文件的文件名作为 `-newer` 选项的参数。\n\n⇒ 查找\
  \ `/etc` 目录树中比 `/etc/motd` 文件更新的文件，输入：\n\n```bash\nfind /etc -newer /etc/motd\n\
  ```\n\n要查找比给定日期更新的文件，使用 `find` Info 文档中描述的技巧：使用 `touch` 在 `/tmp` 中创建一个临时文件，并将其时间戳设置为要搜索的日期，然后将该临时文件指定为\
  \ `-newer` 选项的参数。\n\n⇒ 列出你家目录树中今年 5 月 4 日之后修改的所有文件，输入：\n\n```bash\ntouch -t 05040000\
  \ /tmp/timestamp\nfind ~ -newer /tmp/timestamp\n```\n\n在此示例中，写入了一个名为 `/tmp/timestamp`\
  \ 的临时文件；搜索完成后，你可以将其删除（参见食谱 5.6 [删除文件和目录]，第 149 页）。\n\n**注意：** 你还可以通过将该数字作为 `-used`\
  \ 选项的参数，查找在修改后指定天数内被访问的文件。这对于查找很少使用的文件很有用——例如，匹配 `-used +100` 的文件是在最后修改后 100 天或更多被访问的。\n\
  \n## 7.2.6 按所有者在目录树中查找文件\n\n要查找特定用户所有的文件，将要搜索的用户名作为 `-user` 选项的参数。\n\n⇒ 列出 `/usr/local/fonts`\
  \ 目录树中由用户 `warwick` 的所有文件，输入：\n\n```bash\nfind /usr/local/fonts -user warwick\n\
  ```\n\n`-group` 选项类似，但它匹配组所有权而非用户所有权。\n\n⇒ 列出 `/dev` 目录树中属于 `audio` 组的所有文件，输入：\n\
  \n```bash\nfind /dev -group audio\n```\n\n## 7.2.7 对找到的文件执行命令\n\n你还可以使用 `find` 对每个找到的文件执行你指定的命令，这只需将命令作为\
  \ `-exec` 选项的参数即可。如果你在命令中使用字符串 `'{}'`，则该字符串在命令执行时会被替换为当前找到的文件名。用由单引号括起来的分号（`';'`）来标记命令的结束。\n\
  \n⇒ 查找 `~/html/` 目录树中所有扩展名为 `.html` 的文件，然后输出这些文件中包含字符串 \"organic\" 的行，输入（全部写一行）：\n\
  \n```bash\nfind ~/html/ -name '*.html' -exec grep organic '{}' \\;'\n```\n\n在此示例中，对于\
  \ `find` 找到的每个文件都会执行命令 `grep organic file`，其中 `file` 轮流为每个文件的文件名。\n\n若要让 `find`\
  \ 在找到每个文件时暂停并确认执行，请使用 `-ok` 代替 `-exec`。\n\n⇒ 从你家目录树中删除在最后修改后一年多才被访问的文件，并在每次删除前暂停进行确认，输入：\n\
  \n```bash\nfind ~ -used +365 -ok rm '{}' \\;\n```\n\n## 7.2.8 按多项标准查找文件\n\n你可以组合\
  \ `find` 的许多选项来查找匹配多个标准的文件。\n\n⇒ 以下是使用该方法的两种方式。\n\n• 列出你家目录树中名称以 `top` 开头且比 `/etc/motd`\
  \ 文件更新的文件，输入：\n\n```bash\nfind ~ -name 'top*' -newer /etc/motd\n```\n\n• 查找目录树中大于\
  \ 2MB 且未以 `.gz` 压缩的文件，输入：\n\n```bash\nfind ~ -size +2000 ! -name '*.gz'\n```\n\n\
  使用特殊的 `-o` 选项（或运算符）来分隔两个选项，以便匹配其中任意一个。例如，你可以将其配合 `-name` 使用查找同一目录下不同的文件名。\n\n⇒ 查找\
  \ `.ps`、`.pdf` 或 `.dvi` 文件，输入：\n\n```bash\nfind . -name '*.ps' -o -name '*.pdf'\
  \ -o -name '*.dvi'\n```\n\n下表描述了你可以用于 `find` 的许多选项。第一个表列并描述了指定其行为的选项。\n\n- `-daystart`:\
  \ 时间标准使用今天开始而非 24 小时前。\n- `-depth`: 在每个目录之前搜索子目录。\n- `-maxdepth levels`: 指定进入目录的最大层数。\n\
  - `-mount` 或 `-xdev`: 不进入挂载了另一个磁盘的目录。\n\n下表列并描述了 `find` 用于指定查找文件的选项。通过以下三种方式指定这些选项的数值参数：前加号（`+`）匹配大于或等于给定参数的值；前加减号（`-`）匹配小于或等于给定参数的值；或单独列出数字以匹配精确值。\n\
  \n- `-amin minutes`: 文件最后访问以的分钟数。\n- `-anewer file`: 文件比 `file` 更新访问。\n- `-atime\
  \ days`: 文件最后访问以的天数。\n- `-cmin minutes`: 文件最后更改以的分钟数。\n- `-cnewer file`: 文件比 `file`\
  \ 更新更改。\n- `-ctime days`: 文件最后更改以的天数。\n- `-empty`: 文件为空。\n- `-group group`: 所有该文件的组名。\n\
  - `-iname pattern`: 不区分大小的文件名模式（“report”可匹配 Report、report、REPORT 等文件）。\n- `-ipath\
  \ pattern`: 文件的完整路径匹配模式 `pattern`，不区分大小（\"./r*rt”匹配 ./records/report 和 ./Record-Labels/ART）。\n\
  - `-iregex regexp`: 相对于指定目录树的文件路径匹配正则表达式 `regexp`，不区分大小（“t?p”匹配 TIP 和 top）。\n- `-links\
  \ links`: 链接数。\n\n\n\n\n指向该文件的链接数（参见食谱 5.7 [给文件起多个名称]，第 152 页）。\n\n- `-mmin *minutes`\n\
  自文件数据上次更改以来的分钟数。\n\n- `-mtime *days`\n自文件数据上次更改以来的天数。\n\n- `-name *pattern`\n文件的基名匹配模式\
  \ `pattern`。\n\n# 第 7 章：查找文件\n\n181\n\n- `-newer *file`\n文件修改时间比 `file` 更晚。\n\n\
  - `-path *pattern`\n文件的完整路径名匹配模式 `pattern`（“./r*rt”匹配 ./records/report）。\n\n- `-perm\
  \ *access mode`\n文件的权限恰等于 `access mode`（参见食谱 6.3 [控制文件访问权限]，第 167 页）。\n\n- `-regex\
  \ *regexp`\n文件的路径名（相对于指定的目录树）匹配正则表达式 `regexp`。\n\n- `-size *size`\n文件占用了 `size`\
  \ 大的空间，单位为 512 字节块。在 `size` 后面附加“b”表示字节，或“k”表示千字节。\n\n- `-type *type`\n文件类型为 `type`，其中\
  \ `type` 可以是“d”（目录）、“f”（普通文件）或“l”（符号链接）。\n\n- `-user *user`\n文件属于 `user`。\n\n下表列并描述了\
  \ `find` 的选项，用于指定对找到的文件执行什么操作。\n\n- `-exec *commands`\n指定要在匹配的文件上执行的命令，命令之间用分号分隔。若要将当前文件名作为命令的参数，请使用“{}{}”。\n\
  \n- `-ok *commands`\n与 `-exec` 类似，但在执行 `commands` 之前会提示确认。\n\n- `-print`\n将找到的文件名输出到标准输出，每个文件名后面都跟一个换行符，以便每个文件名单独占一行显示（默认设置）。\n\
  \n- `-printf *format`\n使用字符串 `format` 指定的“C 风格”输出（与 C 语言中 `printf` 函数的形式相同）。\n\n\
  下表描述了 `-printf` 选项使用的 `format` 字符串中可能使用的变量。\n\n`\\a`\n响外系统铃声（在旧系统中称为“alarm”）。\n\n\
  `\\b`\n输出一个退格字符。\n\n`\\f`\n输出一个分页符字符。\n\n182\n《Linux 手册》，第 2 版\n\n`\\n`\n输出一个换行符。\n\
  \n`\\r`\n输出一个回车符。\n\n`\\t`\n输出一个水平表符。\n\n`\\\\`\n输出一个反斜杠字符。\n\n`%%`\n输出一个百分号字符。\n\
  \n`%b`\n输出文件大小，按 512 字节块向上取整。\n\n`%f`\n输出文件基名。\n\n`%h`\n输出文件名前面的目录。\n\n`%k`\n输出文件大小，按\
  \ 1 k 块向上取整。\n\n`%s`\n输出以字节计算的文件大小。\n\n## 7.3 查找目录\n\n要查找特定名称目录，请使用 `find` 配合 `-name`\
  \ 选项，给出匹配的 glob 表达式，并给出 `-type` 选项配合参数 `d`，这指定只搜索目录。\n\n*⇒* 这里有两种这种用法方法。\n\n*• 要在你你家目录树中查找所有名为\
  \ audio 的目录，请输入：\n```bash\nfind ~ -name audio -type d\n```\nRET\n\n*• 要在你你家目录树中查找所有名称中包含“audio”字符串的目录，请输入：\n\
  ```bash\nfind ~ -name audio -type d\n```\nRET\n\n## 7.4 在目录列表中查找文件\n\n以下食谱展示了如何通过按大小列出，在给定目录或树中查找最大和最小的文件。它们还展示了如何查找给定目录中的文件数量。\n\
  \n### 7.4.1 查找目录中最大的文件\n\n要查找给定目录中最大的文件，使用 `ls` 配合 `-S` 选项列出内容，该选项按大小降序排列文件（通常情况下，`ls`\
  \ 按字母顺序输出文件）。包含 `-l` 选项以输出大小和其他文件属性。\n\n*⇒* 要列出当前目录下的文件及其属性，按文件从大到小排序，请输入：\n```bash\n\
  ls -lS\n```\nRET\n\n**注意：** 将输出通过到 `less` 以进行浏览（参见食谱 9.1 [浏览文本]，第 211 页）。\n\n###\
  \ 7.4.2 查找目录中最小的文件\n\n要按文件最小优先列出目录内容，请使用 `ls` 同时配合 `-S` 和 `-r` 选项，这会反转列表的排序顺序。\n\
  \n*⇒* 要列出当前目录下的文件及其属性，按从小到大排序，请输入：\n```bash\nls -lSr\n```\nRET\n\n### 7.4.3 查找最小的目录\n\
  \n要输出按大小（即其包含的所有文件的大小）排序的目录列表，请使用 `du` 和 `sort`。`du` 工具按升序输出目录，最小在前；`-S` 选项将每个目录的大小以千字节为单位放在输出的第一列。将你想要输出的目录树作为选项，并将输出通过到\
  \ `sort` 配合 `-n` 选项，该选项按数字对输入进行排序。\n\n*⇒* 要输出按大小排序的目录列表，请输入：\n```bash\ndu -S * |\
  \ sort -n\n```\nRET\n\n### 7.4.4 查找最大的目录\n\n使用 `-r` 选项配合 `sort` 来反转排序顺序，使最大的在前。\n\
  \n*⇒* 这里是这种用法的几种方法：\n\n*• 要按大小降序输出当前目录树的目录列表，请输入：\n```bash\ndu -S . | sort -nr\n\
  ```\nRET\n\n*• 要按大小降序输出 /usr/local 目录树列表，请输入：\n```bash\ndu -S /usr/local | sort\
  \ -nr\n```\nRET\n\n### 7.4.5 查找文件的数量\n\n要查找目录中的文件数量，使用 `ls` 并将其输出通过到 `wc -l`，后者输出行数（参见食谱\
  \ 12.1 [计数]，第 293 页）。\n\n*⇒* 要输出当前目录的文件数量，请输入：\n```bash\nls | wc -l\n```\nRET\n\n\
  19\n\n在此示例中，命令输出“19”，表示有 19 个文件。\n\n由于 `ls` 默认不列出隐藏文件（参见食谱 5.3.4 [列出隐藏文件]，第 138\
  \ 页），上述命令没有计算它们。使用 `ls` 的 `-A` 选项来包含它们。\n\n*⇒* 要统计当前目录中包括隐藏文件在内的文件数量，请输入：\n```bash\n\
  ls -A | wc -l\n```\nRET\n\n81\n此命令输出“81”，表示有 81 个文件。\n\n要查找给定目录树（而非单个目录）中的文件数量，请使用\
  \ `find` 代替 `ls`，给出特殊的 `find` 谓词 `!type d` 以排除目录的列出（以及计数）。\n\n*⇒* 这里是这种用法的几种方法：\n\
  \n*• 要查找 /usr/share 目录树中的文件数量，请输入：\n```bash\nfind /usr/share !type d | wc -l\n```\n\
  RET\n\n*• 要查找 /usr/share 目录树中的文件和目录数量，请输入：\n```bash\nfind /usr/share | wc -l\n```\n\
  RET\n\n*• 要查找 /usr/share 目录树中的目录数量，请输入：\n```bash\nfind /usr/share !type f | wc -l\n\
  ```\nRET\n\n185\n\n## 7.5 查找程序的位置\n\n使用 `which` 从基文件名查找工具或应用程序的完整路径名；当你将基文件名作为选项时，`which`\
  \ 会输出如果你输入该命令时将运行的命令绝对文件名。\n\n当你不确定特定命令是否安装在系统上，这非常有用。\n\n*⇒* 要查找 `perl` 程序是否已安装在你的系统中，如果是，它位于哪里，请输入：\n\
  ```bash\nwhich perl\n```\nRET\n\n/usr/bin/perl\n\n在此示例中，`which` 输出“/usr/bin/perl”，表示\
  \ perl 二进制文件安装在 /usr/bin 目录。\n\n\n\n\n\n文件管理工具包括用于拆分、比较和压缩文件、制作备份存档以及跟踪文件修订的工具。其他管理工具则用于确定文件的内容以及更改其时间戳。\n\
  \n## 8.1 获取有关文件的信息\n\n下面的方案描述了获取文件信息的方法：如何确定其文件类型和格式，以及如何显示和更改其时间戳。\n\n### 8.1.1\
  \ 确定文件的类型和格式\n\n当我们谈论文件的 `type`（类型）时，指的是它包含的数据种类，这可能包括文本、可执行命令或其他数据；这些数据在文件中以特定的方式组织，而这种组织被称为它的\
  \ `format`（格式）。例如，图像文件可能包含 `jpeg` 图像格式的数据，或者文本文件可能包含英文的未格式化文本，或者包含使用 `TEX` 标记语言格式化的文本。\n\
  \n`file` 工具分析其输入文件，指明它们的类型以及（如果已知的话）它们所包含的数据的格式。将文件名作为参数提供给 `file`，它会输出文件名，随后紧跟一个关于其格式和类型的描述。\n\
  \n*⇒* 要确定文件 `/usr/doc/HOWTO/README.gz` 的格式，输入： `$file /usr/doc/HOWTO/README.gz`\n\
  \nRET\n\n```\n/usr/doc/HOWTO/README.gz: gzip compressed data, deflated, original\
  \ filename, last modified: Sun Apr 26 02:51:48 1998, os: Unix $\n```\n\n该命令报告文件\
  \ `/usr/doc/HOWTO/README.gz` 包含用 `gzip` 工具压缩的数据。\n\n要确定压缩文件中数据的原始格式，请使用 `-z` 选项。\n\
  \n*⇒* 要确定文件 `/usr/doc/HOWTO/README.gz` 中包含的压缩数据的格式，输入：\n\n `$file -z /usr/doc/HOWTO/README.gz`\n\
  \nRET\n\n```\n/usr/doc/HOWTO/README.gz: English text (gzip compressed data, deflated,\
  \ original filename, last modified: Sun Apr 26 02:51:48 1998, os: Unix) $\n```\n\
  \n该命令报告 `/usr/doc/HOWTO/README.gz`（一个压缩文件）中的数据是英文。\n\n**注意：** 目前，`file` 能够区分一百多种不同的数据格式，包括几十种人类语言、许多音频和图形格式，以及针对许多不同操作系统的可执行文件。\n\
  \n有关文件格式的更多信息，请参见附录 B [常规文件扩展名]，第 723 页。\n\n### 8.1.2 确定程序的类型\n\n使用 `type`（`Bash`\
  \ shell 的一个内置函数）来确定给定的程序是种类型的命令：是某些其他命令的别名、shell 关键字、内置函数（例如 `type` 本身），还是普通文件（例如存储在\
  \ `/usr/bin` 目录中的任何工具）。将程序名作为参数提供。\n\n这对于判断特定命令是直接运行工具还是先运行别名非常有用。例如，`ls` 命令经常被别命名为\
  \ `ls --color`，以便其默认以彩色模式运行。\n\n*⇒* 要查看你在 shell 提示符处键入 `ls` 是别名还是工具本身，输入：\n\n `$type\
  \ ls`\n\nRET\n\n```\nls is aliased to 'ls --color=auto'\n$\n```\n\n### 8.1.3 列出文件最后修改的时间\n\
  \n要显示文件的时间戳，请使用带有 `-r` 选项的 `date`，并将文件名作为参数。\n\n*⇒* 要显示文件 `/vmlinuz` 的时间戳，输入： `$date\
  \ -r /vmlinuz`\n\nRET\n\n### 8.1.4 更改文件的修改时间\n\n使用 `touch` 在不修改内容的情况下更改文件的时间戳。将要更改的文件名作为参数。默认操作是将时间戳更改为当前时间。\n\
  \n*⇒* 要将文件 `pizzicato` 的时间戳更改为当前日期时间，输入：\n\n `$touch pizzicato`\n\nRET\n\n要指定当前系统时间以外的时间戳，请使用\
  \ `-d` 选项，随后跟上用引号括起来应使用的日期和时间。你可以只指定日期、只指定时间或两者兼有。\n\n*⇒* 以下是使用该选项的一些方法。\n\n*• 要将文件\
  \ `pizzicato` 的时间戳更改为 1990 年 5 月 17 日下午 2:16，输入：\n\n `$touch -d '17 May 1990 14:16'\
  \ pizzicato`\n\nRET\n\n*• 要将文件 `pizzicato` 的时间戳更改为当年 5 月 17 日，输入：\n\n `$touch -d\
  \ '17 May' pizzicato`\n\nRET\n\n*• 要将文件 `pizzicato` 的时间戳更改为当天下午 2:16，输入：\n\n `$touch\
  \ -d '14:16' pizzicato`\n\nRET\n\n**注意：** 当仅给出时间时，日期被设置为当前日期；当仅给出日期时，时间被设置为“0:00”。当仅给出年份时，将使用当前的日期月份；当给出日期和月份但没有年份时，将使用当年。\n\
  \n有关日期输入格式的更多信息，请查阅 `date` 的 Info 文档。\n\n## 8.2 拆分文件\n\n有时需要将文件拆分成较小文件。例如，假设有一个文件大到无法放入一张软盘，这时你可以使用\
  \ `split`。`split` 工具将一个文件切分成指定大小的文件。它接受可选参数：输入文件名（如果没有提供则使用标准输入）以及用于输出文件的前缀（如果没有提供则使用“x”）。输出文件名将由前缀加上字母组成：aa、ab、ac\
  \ 等。\n\n指定每个文件中包含的行数使用 `-l` 选项，或者使用 `-b` 选项指定每个文件中包含的字节数。\n\n要以字节或兆字节指定输出文件的大小，使用\
  \ `-b` 选项并在数值后加上“k”或“m”。如果未使用 `-l` 或 `-b`，`split` 默认每个文件 1000 行。\n\n*⇒* 要将 `large.mp3`\
  \ 拆分为每个兆字节的文件，以 `large.mp3` 开头，输入： `$split -b 1m large.mp3`\n\nRET\n\n```\n该命令创建了五个以\
  \ large.mp3 开头的文件。前四个文件的大小为一兆字节，最后一个文件为 200 字节——即文件的剩余部分。large.mp3 本未被修改。\n```\n\
  \n你可以将这五个文件拷贝到四张软盘上（最后一个可以放入较大的文件中），将它们全部拷贝到笔记本电脑，然后使用 `cat` 重建原始文件（参见方案 10.6 [合并文本]，第\
  \ 256 页）。\n\n*⇒* 从拆分的文件重建原始文件，输入： `$cat large.mp3 > large.mp3`\n\nRET\n\n `$rm large.mp3`\n\
  \nRET\n\n在此示例中，重建原始文件后使用 `rm` 工具删除所有的拆分文件。\n\n## 8.3 比较文件\n\n有很多工具可以用不同的方式比较文件内容；这些方案展示了如何使用其中一些。这些工具对于比较文件中的文本特别有用，但并不是你它们的唯一方法。\n\
  \n### 8.3.1 确定两个文件是否存在差异\n\n使用 `cmp` 来确定两个文本文件是否存在差异。它接受两个文件名作为参数，如果文件内容相同，`cmp`\
  \ 不输出任何内容。然而，如果文件存在差异，`cmp` 将输出文件中第一个差异处的字节位置和行号。\n\n\n\n\n\n*⇒ 要确定文件 `master` 和\
  \ `backup` 是否不同，请输入： `$ cmp master backup`\n\n## 8.3.2 判断两个目录是否不同\n\n有两种方法可以判断两个目录是否不同。\n\
  \n### 方法 #1：Midnight Commander\n\nDEB: `mc-common`\n\n`mc`\n\nRPM: `mc`\n\nWWW:\
  \ http://www.ibiblio.org/mc/`\n\n确定两个整个目录是否不同的快速且简单的方法是使用 `mc`，即 Midnight Commander。默认情况下，`mc`\
  \ 启动时会绘制两个目录列；在每列中各选择一个目录，然后使用目录比较命令 `CTRL - X d` 进行比较（按下 `CTRL - X` 然后输入 `d`）。\n\
  \n你可以通过这种方式比较文件的三种方法：快速方法，它仅比较文件大小和日期（如果文件内容不同但大小相同，它们仍将显示为无差异）；仅大小比较；以及“彻底”方法，它会逐字节比较所有文件。\n\
  \n*⇒ 要使用 `mc` 比较两个目录，请执行以下操作：1. 使用光标键在当前列中选择要比较的第一个目录。\n2. 输入 `TAB` 移动到另一列。\n3.\
  \ 使用光标键选择第二个目录。\n4. 输入 `CTRL - X d` 比较两个选定的目录，并从弹出菜单中选择要使用的方法。\n\n在差异文件的总数中，差异的字节数显示在第一列底部；两个目录中*相同*的文件字节数显示在第二列底部。\n\
  \n### 方法 #2\n\n第二种方法是使用 `cmp` 对每个目录中的所有文件进行比较。遍历所有文件，并在每个文件上运行此命令，使用 Bash 内置结构（有关有关此内置命令的更多信息，请参考\
  \ bash Info 文档）。\n\n*⇒ 要比较 `~/site/current` 目录中的所有文件与 `~/development/latest` 目录中的所有文件，请输入：\
  \ `$ for i in ~/site/current/*; { cmp $i ~/development/latest/$i; }`\n\n**注意：**\
  \ 此 `cmp` 方法仅适用于包含普通文件的目录；如果目录包含子目录，此方法将失败。\n\n## 8.3.3 查找文件之间的差异\n\n使用 `diff` 比较两个文件并输出一份*差异报告*（有时称为“diff”），其中包含两个文件之间*不同*的文本。差异报告的格式使得其他工具（特别是\
  \ `patch`——参见食谱 8.3.7 [使用差异报告补丁文件]，第 196 页）可以使用它使文件与与其比较的文件完全相同。\n\n要比较两个文件并输出差异报告，请将文件名作为参数传递给\
  \ `diff`。差异报告被写入标准输出；若要将其保存到文件，请重定向标准输出。\n\n*⇒ 以下是使用该工具的一些方法。\n\n* 要比较文件 `manuscript.old`\
  \ 和 `manuscript.new`，输入： `$ diff manuscript.old manuscript.new`\n* 要比较文件 `manuscript.old`\
  \ 和 `manuscript.new`，并将差异报告写入名为 `manuscript.diff` 的文件，输入： `$ diff manuscript.old\
  \ manuscript.new > manuscript.diff`\n\n差异报告旨在配合 `patch` 等命令使用，以便将差异应用到文件中。关于 `diff`\
  \ 及其输出格式的更多信息，请咨询其 Info 文档（参见食谱 2.8.5 [阅读 Info 手册]，第 48 页）。\n\n为了更好地看到两个文件之间的差异，请使用\
  \ `sdiff` 代替 `diff`；它不是输出差异报告，而是以两列并排的形式输出文件，中间用空格分隔。文件中不同的行用管道符（`|`）分隔；只出现在第一个文件中的行以小于号（`<`）结尾；只出现在第二个文件的行以大于号（`>`）开头。\n\
  \n*⇒ 要在屏幕上并排查看文件 `laurel` 和 `hardy`，并在列之间标出任何差异，请输入： `$ sdiff laurel hardy | less`\n\
  \n要输出*三个*独立文件之间的差异，请使用 `diff3`。\n\n*⇒ 为文件 `larry`、`curly` 和 `moe` 输出差异报告，并输出到名为\
  \ `stooges` 的文件中，输入： `$ diff3 larry curly moe > stooges`\n\n## 8.3.4 浏览一组文件中的差异\n\
  \n要查看两组文件之间的差异，可以使用 shell `for` 指令来指定要用 `diff` 比较的文件，并将输出重定向到 `less`。\n\n*⇒ 要查看当前目录下所有\
  \ `.news` 文件与其在 `../archive` 目录中的对应文件的差异，请输入：\n```bash\nfor i in *.news\n{\n  diff\
  \ $i ../archive/$i | less\n}\n```\n\n在此示例中，一个目录中的每个文件与其另一个目录中的对应文件的差异将依次显示；按 `N`\
  \ 移动到下一个文件，按 `P` 回到上一个文件。\n\n## 8.3.5 查找目录之间的差异\n\n你可以使用 `diff` 比较两个目录及其所有内容。这对于为文本文件目录（例如计算机源代码目录或写作集）制作补丁非常有用。执行此操作，将要比较的目录名称作为参数传递给\
  \ `diff`。\n\n要检查目录树之间的差异（每个目录可能包含子目录），使用 `-r` 选项，并使用 `-N` 选项让 `diff` 在文件不存在时写入整个文件。由于目录\
  \ `diff` 输出通常很大，使用 `-u` 选项指定*统一*的格式，该格式消除了冗余且更加紧凑。\n\n*⇒ 以下是两种使用方法。\n\n* 要制作使 `~/apples`\
  \ 目录匹配 `~/oranges` 目录的补丁，并将补丁写入当前目录名为 `fruit-patch.diff` 的文件，输入： `$ diff -N apples\
  \ oranges > fruit-patch.diff`\n* 要制作 `~/apples` 目录树匹配 `~/oranges` 目录树的补丁，以统一格式写入当前目录的文件，输入：\
  \ `$ diff -r -u -N apples oranges > fruit-patch.diff`\n\n要应用这些补丁，请使用带有 `-p1` 选项的\
  \ `patch`，它可以消除文件名前的斜杠。将补丁文件放在要修复的目录中，并在该目录下运行 `patch` 工具。使用 `-s` 选项进行*静默*操作，省略任何标准输出。\n\
  \n*⇒ 要静默将补丁文件 `fruit-patch.diff` 应用到 `~/apples` 目录，输入：\n```bash\nmv fruit-patch.diff\
  \ ~/apples/\ncd ~/apples\npatch -p1 -s < fruit-patch.diff\n```\n\n## 8.3.6 查找文件的差异百分比\n\
  \nWdiff\n\nDEB: `wdiff`\n\nRPM: `wdiff`\n\nWWW: http://www.gnu.org/software/wdiff/wdiff.html\n\
  \n`wdiff` 工具是 `diff` 的前端。它查找并显示你作为参数提供的两个文本文件之间的单词差异。它输出第二个文件的注释版本，显示使其与第一个文件完全相同所需的更改：单词删除被标记为\
  \ `[- this -]`，添加被标记为 `[+ this +]`，更改被标记为 `{+ this +}`。\n\n*⇒ 要查看文件 `story_draft.1`\
  \ 的注释副本，显示使其与文件 `story_draft.2` 完全相同所需的更改，请输入： `$ wdiff story_draft.2 story_draft.1\
  \ | less`\n\n若要放弃默认注释并转而生成适合发送打印机*的注释，请使用 `-p` 选项；删除的文本将下划线，插入的文本将加粗输出。\n\n\n\n\n\
  ⇒ 有两种使用此工具的方法。\n\n• 要打印文件 `story_draft.1` 的注释版本，显示使其与文件 `story_draft.2` 相同所需的更改，请输入：\n\
  \n```\n$ wdiff -p story_draft.2 story_draft.1 | lpr\n```\n\n• 要查看文件 `story_draft.1`\
  \ 的注释版本，用下划线和粗体字显示使其与文件 `story_draft.2` 相同所需的更改，请输入：\n\n```\n$ wdiff -p story_draft.2\
  \ story_draft.1 | less\n```\n\n使用 `wdiff` 配合 `-s` 选项可以显示关于差异的 `statistics`：单词总数；共同单词数以及占总数的百分比；删除或插入的单词数以及占总数的百分比；以及更改的单词数和占总数的百分比。这些统计数据将在第二个文件的注释之后以两行的形式输出。\n\
  \n196\n《Linux Cookbook》，第 2 版\n\n⇒ 有两种使用此工具的方法。\n\n• 要输出文件 `story_draft.1` 和 `story_draft.2`\
  \ 之间单词的差异，并显示关于差异的统计信息，请输入：\n\n```\n$ wdiff -s story_draft.1 story_draft.2\n```\n\
  \n• 要输出文件 `story_draft.1` 和 `story_draft.2` 之间单词差异的两个行统计数据，请输入：\n\n```\n$ wdiff\
  \ -s story_draft.1 story_draft.2 | tail -2\n```\n\n**注意：**并非所有的 Linux 发行版都包含 `wdiff`\
  \ 命令。\n\n## 8.3.7 使用差异报告补丁文件\n\n要将差异报告中的差异应用到报告中比较的原始文件，请使用 `patch`。它接受参数是要待修复的文件名和差异报告文件名（或“补丁文件”）。然后，它会将\
  \ `patchfile` 中指定的更改应用到原始文件中。这对于分发文件的不同版本特别有用——较小的 `patchfile` 比大型源文件更容易通过网络传输。\n\
  \n⇒ 要用补丁文件 `manuscript.diff` 更新原始文件 `manuscript.old`，请输入：\n\n```\n$ patch manuscript.old\
  \ manuscript.diff\n```\n\n## 8.4 使用文件压缩\n\n文件压缩对于存储或传输大文件非常有用。当你对文件进行 `compress`\
  \ 时，它会缩小文件体积并节省磁盘空间。文件压缩使用算法来更改文件中的数据使其更小；要使用压缩文件中的数据，你必须先对其进行 `uncompress` 以恢复原始数据（以及原始文件大小）。\n\
  \n`gzip` 压缩工具多年来一直是流行标准，但最近较新的 `bzip2` 的使用率正在增加。它使用了更的压缩算法——在许多情况下，它可以压缩出比 `gzip`\
  \ 更小的文件——但这是以在压缩和解压缩过程中花费更长时间为代价的。用 `gzip` 压缩的文件解压缩速度比用 `bzip2` 压缩更快（但通常在现代计算机上，我们讨论的是几十秒钟的问题）。\n\
  \n以下配方解释了如何使用 `gzip` 和 `bzip2` 压缩和解压缩文件，它们的工作非常相似。\n\n第 8 章：文件管理\n197\n\n### 8.4.1\
  \ 压缩文件\n\n压缩文件有两种方法。使用 `gzip` 追求速度和兼容性，在压缩率最重要时使用 `bzip2`。\n\n#### 方法 #1\n\n使用 `gzip`\
  \ (“gnu zip”)工具，将任何要压缩的文件名作为参数提供；它会写出指定文件的压缩版本，在文件名后添加 `.gz` 扩展，然后删除原始文件。\n\n⇒ 要压缩文件\
  \ `war-and-peace`，请输入：\n\n```\n$ gzip war-and-peace\n```\n\n此命令压缩了 `codewar-and-peace`\
  \ 文件，将其放入一个名为 `war-and-peace.gz` 的新文件中；然后 `gzip` 会删除原始文件 `war-and-peace`。\n\n**注意：**\
  \ 可以通过提供 1 到 9 之间的数字作为选项来指定压缩程度，其中 1 是压缩最小且速度最快，9 是最佳压缩效果，但是以花费最长时间压缩为代价的。默认行为设置为使用值\
  \ 6。\n\n解压缩时不需要指定使用的比例；无论数据的压缩率如何，文件的解压缩速度都是相同的。\n\n特殊选项 `-fast` 和 `-best` 分别与 `-1`\
  \ 和 `-9` 同义。\n\n#### 方法 #2\n\nBzip2\nDEB: `bzip2`\nRPM: `bzip2`\nWWW: http://sources.redhat.com/bzip2/\n\
  \n使用 `bzip2` 工具，将任何要压缩的文件名作为参数提供；它会写出指定文件的压缩版本，在文件名后添加 `.bz2` 扩展，然后删除原始文件。\n\n⇒\
  \ 要压缩文件 `war-and-peace`，请输入：\n\n```\n$ bzip2 war-and-peace\n```\n\n此命令压缩了 `war-and-peace`\
  \ 文件，将其放入一个名为 `war-and-peace.bz2` 的新文件中；随后原始文件 `war-and-peace` 被删除。\n\n198\n《Linux\
  \ Cookbook》，第 2 版\n\n### 8.4.2 解压缩文件\n\n解压缩文件有两种，取决于压缩文件的方法。用 `gzip` 压缩的文件默认会添加\
  \ `.gz` 扩展，而用 `bzip2` 压缩的文件会添加 `.bz2` 扩展。\n\n#### 方法 #1\n\n要访问用 `gzip` 压缩的文件，使用\
  \ `gunzip` 进行解压缩（或“解压”）。\n\n与 `gzip` 一样，`gunzip` 接受要处理的文件名作为参数。它将指定文件的输出写入不带 `.gz`\
  \ 扩展的新文件，然后删除原始文件。\n\n⇒ 要扩展文件 `war-and-peace.gz`，请输入：\n\n```\n$ gunzip war-and-peace.gz\n\
  ```\n\n此命令压缩了 `war-and-peace.gz` 文件，将其放入一个名为 `war-and-peace` 的新文件中；`gzip` 然后删除该文件。\n\
  \n**注意：** 使用 `gunzip` 解压缩时不需要指定 `.gz` 扩展。\n\n你也可以在不解压缩的情况下查看 `gzip` 压缩的文件。可以使用 `zless`\
  \ 查看压缩的文本文件（参见章节 9.1 [使用文本]，第 211 页），或使用 `see` 查看其他已压缩的文件。\n\n#### 方法 #2\n\nBzip2\n\
  DEB: `bzip2`\nRPM: `bzip2`\nWWW: http://sources.redhat.com/bzip2/\n\n要访问用 `bzip2`\
  \ 压缩的文件，使用 `bunzip2` 进行解压缩。\n\n与 `gzip` 一样，`bunzip2` 接受要处理的文件名作为参数。它将指定文件的输出写入不带\
  \ `.bz2` 扩展的新文件，然后删除原始文件。\n\n⇒ 要扩展文件 `war-and-peace.bz2`，请输入：\n\n```\n$ bunzip2\
  \ war-and-peace.bz2\n```\n\n此命令压缩了 `war-and-peace.bz2` 文件，将其放入一个名为 `war-and-peace`\
  \ 的新文件中；`bzip2` 然后删除原始文件。\n\n199\n第 8 章：文件管理\n\n### 8.4.3 查看压缩文件的内容\n\nRun-mailcap\n\
  DEB: `mime-support`\n\n要在不解压缩磁盘上的文件的情况下查看压缩文件的内容，请使用 `see` 并提供文件名作为参数。当你想要读取或查看压缩文件的内容，但在查看后想保持其压缩状态时，这非常有用。\n\
  \n`see` 可以读取由 `gzip` 或 `bzip2` 压缩的文件；如果是文本文件，`see` 使用 `less` 显示文件（参见章节 9.1 [使用文本]，第\
  \ 211 页）；如果是 dvi 文件，`see` 使用 `xdvi` 显示它；PostScript、eps 和 pdf 文件均在 `gv` 中查看（如果该程序已安装）。\n\
  \n⇒ 要查看 `full_dossier.pdf.bz2` 的内容，请输入：\n\n```\n$ see full_dossier.pdf.bz2\n```\n\
  \n**注意：** `see` 不适用于压缩图像；要在不解压缩的情况下查看其内容，请使用 `display`。它可以查看压缩图像格式（参见章节 17.1 [在\
  \ X 中查看图像]，第 407 页）。\n\n\n\n\n\n`see` 命令并不包含在某些 Linux 发行版中。你可以从其 Debian 软件包页面通过源码安装一个副本（参见配方\
  \ A.4 [管理 deb 包]，第 709 页）。\n\n# 8.5 管理文件归包\n\n`archive`（归包）是一个包含其他文件（通常还包括目录）的单个文件。归包通常用于传输或对一组文件和目录创建备份副本——通过这样，你只需要处理一个文件而不是许多文件。正如上一节过的，这个单独的文件可以被轻松压缩，而且归包中的文件保留了原始文件的结构和权限。\n\
  \n使用 `tar` 工具可以创建、列出和提取归包中的文件。用 `tar` 创建的归包有时被称为“tar 文件”、“tar 归包”或——由于所有归档的文件都被合并成一个大文件——被称为“tar\
  \ 包（tarballs）”。\n\n下面的配方展示了如何使用 `tar` 创建归包、列出归包内容以及从归包中提取文件。这三个操作通用的两个常用选项是 `-f`\
  \ 和 `-v`：使用 `-f` 后跟文件名来指定归包文件的名称，使用 `-v`（“详细模式”）选项让 `tar` 在处理文件时输出文件名。\n\n虽然 `-v`\
  \ 选项不是必须的，但它能让你观察 `tar` 操作的进度。\n\n**注意：** 该工具的名称来源于“tape archive”（磁带归档），因为它最初被用于将归包直接写入磁带设备。虽然现在仍用于此目的，但如今，归包几乎总是被保存到磁盘上的文件中。\n\
  \n有关使用 `tar` 管理归包的更多信息，请参阅其 Info 文档（参见配方 2.8.5 [阅读 Info 手册]，第 48 页）。\n\n## 8.5.1\
  \ 创建文件归包\n\n使用 `tar` 创建归包时，使用 `-c`（“创建”）选项并使用 `-f` 选项指定要创建的归包文件名。通常的做法是使用带有 `.tar`\
  \ 扩展名的名称，例如 `my-backup.tar`。\n\n将要归档的文件名作为参数提供；要创建一个目录及其包含的所有文件和子目录的归包，只需将目录名作为参数提供。\n\
  \n*⇒ 要从 project 目录的内容创建一个名为 `project.tar` 的归包，输入：\n\n```\ntar -cvf project.tar project\n\
  ```\n\n此命令创建了一个名为 `project.tar` 的归包文件，包含 project 目录及其所有内容。原始 project 目录保持不变。\n\n\
  使用 `-z` 选项在写入归包的同时对其压缩。这产生的输出与先创建一个未压缩的归包然后使用 `gzip` 进行压缩的结果相同，但它消除了额外的步骤。\n\n在其他操作系统上流行的\
  \ `zip` 归包将在配方 26.7 [管理 zip 归包]，第 533 页中讨论。\n\n*⇒ 要从 project 目录的内容创建一个名为 `project.tar.gz`\
  \ 的压缩归包，输入：\n\n```bash\ntar -zcvf project.tar.gz project\n```\n\n此命令创建了一个压缩归包文件\
  \ `project.tar.gz`，包含 project 目录及其所有内容。原始 project 目录保持不变。\n\n**注意：** 当你使用 `-z` 选项时，你应该指定带有\
  \ `.tar.gz` 扩展名的归包名称而不是 `.tar` 扩展名，这样文件名就能显示该归包是压缩过的。这并不是强制要求，但它起到了提醒作用并是标准做法。\n\
  \n## 8.5.2 列出归包内容\n\n要在不提取的情况下列出 `tar` 归包的内容，请使用带有 `-t` 选项的 `tar`。\n\n*⇒ 要列出名为 `project.tar`\
  \ 的归包的内容，输入：\n\n```bash\ntar -tvf project.tar\n```\n\n此命令列出了 `project.tar` 归包的内容。使用\
  \ `-v` 选项配合 `-t` 选项会让 `tar` 输出文件的权限、修改时间以及文件名——与 `ls` 命令配合 `-l` 选项格式相同（参见配方 5.3.3\
  \ [列出文件属性]，第 136 页）。\n\n包含 `-z` 选项可以列出压缩归包的内容。\n\n*⇒ 要列出名为 `project.tar.gz` 的压缩归包的内容，输入：\n\
  \n```bash\ntar -ztvf project.tar.gz\n```\n\n## 8.5.3 从归包中提取文件\n\n要提取（或解压）`tar` 归包的内容，使用带有\
  \ `-x`（“提取”）选项的 `tar`。\n\n*⇒ 要提取名为 `project.tar` 的归包的内容，输入：\n\n```bash\ntar -xvf\
  \ project.tar\n```\n\n此命令将 `project.tar` 归包的内容提取到当前目录。\n\n如果归包是压缩的（通常意味着它具有 `.tar.gz`\
  \ 或 `.tgz` 扩展名），请包含 `-z` 选项。\n\n*⇒ 要提取名为 `project.tar.gz` 的压缩归包的内容，输入：\n\n```bash\n\
  tar -zxvf project.tar.gz\n```\n\n**注意：** 如果当前目录存在与归包中任何文件同名的文件或子目录，这些文件将在提取时被覆盖。如果你不知道归包中哪些文件，可以考虑像前面的配方那样先列出归包的内容。\n\
  \n在提取之前列出归包内容的另一个原因是确定归包中的文件是否包含在一个目录中。\n\n如果不是，且当前目录包含许多不相关的文件，它们可能会与从归包提取的文件混淆。要将文件提取到独立的目录中，创建一个新目录，将归包移动到该目录，然后从中提取。\n\
  \n# 8.6 跟踪文件的版本\n\n版本控制系统（rcs）是一组管理单文件多个版本的工具。\n\n为了让 rcs 能够跟踪文件的版本，你必须 `check in`\
  \ 提交文件。这会将文件的版本存入 `repository`（存储库）——一个 rcs 用于存储该文件所有更改的文件。rcs 会创建一个与提交的文件同名但带有\
  \ `.v` 扩展名的存储文件。例如，提交文件 `foo.text` 会创建一个存储文件 `foo.text.v`。\n\n每当让 rcs 记住文件的版本时，运行\
  \ `check in` 命令，rcs 会将文件与上次记录之间的差异写入存储文件。\n\n要访问文件的版本，你从 rcs `check out` 该版本。该版本从存储文件中获取并写入当前目录。\n\
  \n尽管 rcs 最常用于文本文件，你也可以用它来跟踪其他类型文件的版本，例如图像文件和声音文件。\n\n另一个版本控制系统并发版本系统（cvs）用于跟踪多个作者同时修改的多个文件。虽然它不像\
  \ rcs 那么简单，但在管理互联网上的自由软件项目中非常流行。有关使用 cvs 的信息，请参阅其 Info 文档（参见配方 2.8.5 [阅读 Info 手册]，第\
  \ 48 页）。\n\n## 8.6.1 提交文件版本\n\n当你有一个想要跟踪的文件版本时，使用 `ci` 用 rcs 提交该文件。\n\n输入 `ci` 后跟文件名，将该文件存入\
  \ rcs 存储库。如果文件以前从未被提交过，ci 会提示输入一个用于该文件的描述；之后每次提交该文件时，ci 都会提示输入包含在文件版本日志中的文本（参见配方\
  \ 8.6.3 [查看文件的版本日志]，第 205 页）。日志消息可以包含多行文本；单独占一行输入点（.）来结束条目。\n\n例如，假设你有一个像图 8-1 中的\
  \ `novel` 文本文件。\n\n```text\n这是一个关于许多事情的故事，包括一次跨越美国的长途。\n```\n\n*图 8-1. novel 的第一个版本。*\n\
  \n\n\n\n⇒ 要使用 `rcs` 提交文件 `novel`，请输入：\n\n```\n$ ci novel\n```\n\nRET\n\nnovel,v\n\
  \n<--\n\nnovel\n\n输入描述信息，以单个点 '.' 结束或\n\n或文件末尾：\n\n注意：这并不是日志消息！\n\n>> *伟大的美国小说。*\n\
  \nRET\n\n>> *.*\n\nRET\n\n$\n\n此命令 `ci` 将文件 `novel` 存入到一个名为 `novel,v` 的 `rcs` 存储库文件中，并且原始文件\
  \ `novel` 将被删除。要再次编辑或访问该文件，你必须从 `rcs` 中检出（check out）该文件的某个版本进行操作（有关如何操作，请参阅下一个配方）。\n\
  \n每当你有一个想要保存的新版本时，请再次使用 `ci` 提交文件。这会重新开始整个过程。\n\n204\n\n《Linux 菜谱》，第 2 版\n\n例如，假设你已经检出了\
  \ `novel` 的第一个版本并修改了文件，使其现在看起来像图 8-2 所示。\n\n这是一个关于许多事情的长故事，包括我横跨美国并回家的漫长旅行。\n\n\
  *图 8-2. `novel` 的新版本。*\n\n⇒ 要将此版本存入 `rcs`，请输入：\n\n```\n$ ci novel\n```\n\nRET\n\n\
  novel,v\n\n<--\n\nnovel\n\n新版本: 1.2; 上一个版本: 1.1\n\n输入日志消息，以单个点 '.' 结束或文件末尾：\n\n\
  >> *第二草稿。*\n\nRET\n\n>> *.*\n\nRET\n\n$\n\n如果你在当前目录下创建一个名为 `RCS`（全大写字母）的子目录，`rcs`\
  \ 会识别这个具有特殊命名的目录，而不是当前目录作为存储 `.v` 版本文件的位置。这有助于减少你工作目录的杂乱程度。\n\n如果你要提交的文件是一个文本文件，你可以让\
  \ `rcs` 在每次检出文件时在文件中插入一行文本，该文本包含文件名、版本号、`utc`（协调世界时）的日期和时间，以及作者的用户 ID。要实现此操作，请在文件中你希望写入该文本的地方放置文本“`Id$`”。你只需要执行一次；每次你检出文件时，`rcs`\
  \ 都会用页眉文本替换文件中的此字符串。\n\n例如，本章被写入一个文件 `managing-files.texinfo` 中，其版本通过 `rcs` 进行跟踪；该文件中的“`$Id$`”字符串目前显示为：\n\
  \n```\n$Id: managing-files.texinfo,v 2.11 2004/07/03 18:54:01 m Exp m $\n```\n\n\
  **注意：** 你应该始终让你的日志消息具有描述性，这样以后你就不会对文件做了什么感到困惑。\n\n### 8.6.2 检出文件版本\n\n使用 `co` 从\
  \ `rcs` 存储库中检出一个文件的版本。\n\n第 8 章：管理文件\n\n205\n\n要检出你打算编辑（并稍后作为新版本提交）文件的最新版本，请使用 `-l`（代表“lock”，锁定）选项。以这种方式锁定版本可以防止在该版本提交之前，不小心检出了另一个版本而导致对文件进行重叠的更改。\n\
  \n⇒ 要检出文件 `novel` 的最新版本进行编辑，请输入：\n\n```\n$ co -l novel\n```\n\nRET\n\n此命令 `co` 从\
  \ `novel,v` 存储库中检出文件 `novel` 的最新版本，将其写入当前目录中名为‘novel’ 的文件中。（如果当前目录下已存在同名文件，`co`\
  \ 会询问是否覆盖该文件）。你可以对此文件进行更改，然后作为新版本提交（参见上一个配方）。\n\n你还可以以*只读*方式检出文件版本，此时无法对其写入更改。这样做是为了检出一个仅供查看而不编辑的版本。\n\
  \n要检出文件的当前版本进行检查，请输入 `co` 后跟文件名。\n\n⇒ 要检出文件 `novel` 的当前版本但不允许对其进行更改，请输入：\n\n```\n\
  $ co novel\n```\n\nRET\n\n此命令 `co` 从 `rcs` 存储库 `novel,v` 中检出文件 `novel` 的最新版本（从当前目录或名为\
  \ `RCS` 的子目录中）。\n\n要检出除最新版本以外的版本，请使用 `-r` 选项指定要检出的版本号。再次使用 `-l` 选项允许该版本被编辑。\n\n\
  ⇒ 要检出文件 `novel` 的版本 1.14，请输入：\n\n```\n$ co -l -r1.14 novel\n```\n\nRET\n\n**注意：**\
  \ 在检出文件的旧版本之前，请记住先提交最新的更改，否则它们可能会丢失。\n\n可以创建*分支*（branching）版本；否则，你带有更改的旧版本将作为主“分支”上的最新版本被提交（请查看\
  \ `rcs` 手页以获取有关 `rcs` 中分支的信息）。\n\n### 8.6.3 查看文件的版本日志\n\n使用 `rlog` 查看文件的 `rcs` 版本日志——输入\
  \ `rlog` 后跟文件名以列出该文件的所有版本。\n\n206\n\n《Linux 菜谱》，第 2 版\n\n⇒ 要查看文件‘novel’ 的版本日志，请输入：\n\
  \n```\n$ rlog novel\n```\n\nRET\n\nRCS file: novel,v\nWorking file: novel\nhead:\
  \ 1.2\nbranch:\nlocks:\naccess:\nsymbolic names:\ntotal revisions: 2\ndescription:\n\
  The Great American Novel.\n----------------------------\nrevision 1.2\ndate: 1991/06/20\
  \ 15:31:44\nauthor: leo;\nstate: Exp\n----------------------------\nrevision 1.1\n\
  date: 1991/06/21 03:58\nauthor: leo;\nstate: Exp\nInitial revision\n======================\n\
  \n\n\n\n\n如果你不确定文件内容是否为文本，可以使用 `file` 命令来查找，如食谱 8.1.1 [确定文件的类型和格式]，第 187 页所示。\n\n\
  一种仅允许你在屏幕上查看文本而不能进行编辑的工具被称为 `pager`（分页器）。当大多数人在查看文本时不进行编辑时，他们会使用 `less`，接下来的食谱中将介绍\
  \ `less`。\n\n有有许多方法可以查看或输出文本。例如，你可以在浏览文件及其内容时查看文本，如食谱 5.10 [浏览文件和目录]，第 157 页所示。当你的意图是编辑文件的文本内容时，你应该在文本编辑器中打开它，如第\
  \ 10 章 [编辑文本]，第 231 页所示。`Vi` 编辑器带有一个特殊的命令 `view`，可以以只读模式通过 `Vi` 打开文件，这样它就可以被查看——如果你使用此命令，你就无法（无论无意还是有意地）对打开的文件进行任何更改。\n\
  \n某些类型的文件——例如 PostScript、`dvi` 和 `pdf` 文件——通常包含文本，但它们技术上并不是文本文件。这些是图像格式文件，我在食谱 17.4\
  \ [预览打印文件]，第 413 页中描述了查看它们的方法。\n\n# 9.1 审阅文本\n\n使用 `less` 来审阅文本，每次显示一屏（或“页”）。`less`\
  \ 工具作用于文件或标准输出——它经常被用作管道的最后一个命令，以便你可以翻页某些命令的文本输出。示例，请参见食谱 3.2.4 [将输出重定向到另一个命令的输入]，第\
  \ 69 页。以下食谱描述了使用 `less` 的各种方法。\n\n另一个工具 `zless` 与 `less` 相同，但你用它来查看压缩文本文件；它允许你在无需先解压缩文件的情况下读取压缩文本的内容（参见食谱\
  \ 8.4 [使用文件压缩]，第 196 页）。\n\n例如，`/usr/doc` 和 `/usr/share/doc` 目录下的大多数系统文档由压缩文本文件组成。\n\
  \n你偶尔可能会遇到一个用于文本分页的命令，称为 `more`。在 20 世纪 90 年代初中期它被 `less` 取代之前，它是文本分页的标准工具；`less`\
  \ 带有更多的选项——它最显著的优势是能够反向滚动文件——但代价是其尺寸几乎是 `more` 的三倍。\n\n因此，“less is more”（少即是多）这句话有两种含义。\n\
  \n下表总结了在 `less` 中翻页文本的最基本的键盘命令。它列出了按键并描述了这些命令。\n\n### 光标标移动\n\n| 命令 | 描述 |\n| :---\
  \ | :--- |\n| Up | 向后滚动文本（“向上”）一行。 |\n| Down | 向前滚动文本（“向下”）一行。 |\n| or | 水平方向（向左或向右）滚动一个制表位；对于审阅包含长行的文件非常有用。\
  \ |\n| `PgUp` 或 `SPACEBAR` | 向后（“向上”）滚动一屏文本。 |\n| `PgDn` | 向前（“向下”）滚动一屏文本。 |\n|\
  \ `<` | 移动到文件开头。 |\n| `>` | 移动到文件末尾。 |\n\n### 文本搜索\n\n| 命令 | 描述 |\n| :--- | :---\
  \ |\n| `/ pattern` | 在文件中正向搜索包含 `pattern` 的行。 |\n| `? pattern` | 在文件中反向搜索包含 `pattern`\
  \ 的行。 |\n\n| 杂项\n\n| 命令 | 描述 |\n| :--- | :--- |\n| `R` 或 `CTRL - L` | 重绘（或“重漆”）屏幕。\
  \ |\n| `H` | 显示帮助屏幕。 |\n| `V` | 在 `Vi` 编辑器中打开文件，以便对其进行编辑。（然后，当你使用 `:wq` 写入并保存，或直接用\
  \ `:q` 退出时，你将回到 `less`。） |\n| `Q` | 退出文件查看并退出 `less`。 |\n\n**注意：** `less` 许多许多命令行选项以及运行期间使用的按键命令，你可以使用它执行各种小技巧——几乎足够写成一整个章节了。如果你对这类事情感兴趣，值得读一下\
  \ `less` 的手册页（man page）。\n\n## 9.1.1 审阅文本文件\n\n要审阅或翻页文本文件，请将文件名作为 `less` 的参数。\n\n\
  ⇒ 要翻页文本文件 `README`，输入：\n```bash\n$ less README\n```\nRET 此命令启动 `less` 并在屏幕上显示文件\
  \ `README`。\n\n你可以通过输入 `,` 逐行向前移动文档，通过输入 `PgDn` 逐屏向前移动文档。要向后移动一行，输入 `,`（此处可能有误），输入\
  \ `PgUp` 向后移动一屏。\n\n你还可以搜索当前正在审阅的文本——这在食谱 14.11 [搜索你正在审阅的文本]，第 354 页描述。要停止查看文件并退出\
  \ `less`，请按 `Q`。\n\n## 9.1.2 带提示审阅文本\n\n当你用 `less` 审阅文本文件时，它会在屏幕底部显示一个默认提示符，并用反色视频显示文件名。一旦你触碰按键，提示符就会消失。\n\
  \n使用 `-M` 选项显示长提示符行，其中包含文件名、当前行和总行数以及当前行在文件中的百分比。当你移动文本时，此提示符会保持显示。\n\n⇒ 要带长提示符审阅文件\
  \ `README`，输入：\n```bash\n$ less -M README\n```\nRET\n**注意：** 你可以利用持有文件信息的变量来创建自己的提示符；查看\
  \ `less` 手册页了解如何操作。\n\n## 9.1.3 从底部审阅文本\n\n在 `less` 中输入 `F` 可移动到其正在显示的文本的底部。当文件正在被写入或你将某些命令的输出管道到\
  \ `less` 时这非常有用。\n\n当你输入 `F` 时，`less` 将尝试从输入继续读取。输入 `CTRL - C` 中断此命令并让 `less` 停止从底部读取。正常。\n\
  \n## 9.1.4 审阅原始文本\n\n默认情况下，`less` 以符号形式显示非打印控制字符（因此，`CTRL - L` 组合显示为 `^L`），但影响间距的控制字符除外，如制表符\
  \ `CTRL - I`。有时希望显示*原始文本*，即未经处理且未格式化的文本。显示原始文本将显示任何非打印或控制字符，而不是它们所代表的格式。例如，当 `CTRL\
  \ - L` 组合出现在文本中时，你希望显示字面分页，而不是 `^L`。\n\n有两种方法可以做到。\n\n### 方法 1\n\n要在文本中显示原始控制字符，使用\
  \ `-r` 选项运行 `less`。这会对屏幕显示产生任何问题，因为原始字符可能会影响它。\n\n⇒ 要审阅文件 `README` 并显示其中的原始控制字符，输入：\n\
  ```bash\n$ less -r README\n```\nRET\n\n### 方法 2\n\n要在文本中显示原始控制字符，但尝试保持屏幕外观，使用 `-R`\
  \ 选项运行 `less`。这显示原始控制字符，但尽可能控制由屏幕控制字符引起的任何差异。\n\n⇒ 要审阅文件 `README` 并显示其中的原始控制字符，但尝试保持屏幕顺序，输入：\n\
  ```bash\n$ less -R README\n```\nRET\n\n## 9.1.5 审阅多个文本文件\n\n审阅多个文本文件有两种方法。\n\n###\
  \ 方法 1\n\n你可以为 `less` 指定多个文件进行翻页，并指定文件模式以打开所有匹配模式的文件。\n\n文件将按顺序显示——less 依次显示每个文件，从你指定的第一个文件或匹配给定模式的第一个文件开始。要到下一个文件，按\
  \ `N`；要回到上一个文件，按 `P`。\n\n\n\n\n\n*⇒ 要翻阅 `/usr/doc/FAQ` 下所有的 unix faq 文件，请输入： `$\
  \ less /usr/doc/FAQ/unix-faq-part`\n\nRET\n\n此命令启动 `less`，它会打开所有匹配模式 `/usr/doc/FAQ/unix-faq-part*`\
  \ 的文件，并开始显示第一个，如图 9-1 所示。\n\n## 方法 #2\n\n另一种方法是使用 `cat` 将所有文件合并，并将该输出通过到 `less`。将没有指示器来标记一个文件的结束和另一个文件的开始，但你可以流畅地滚动整个文本，而无需按键在文件之间切换。\n\
  \n*⇒ 要一次性翻阅 `/usr/doc/FAQ` 下所有的 unix faq 文件，请输入：\n\n`$ cat /usr/doc/FAQ/unix-faq-part\
  \ | less`\n\nRET\n\n一个文件结束下一个文件开始时没有指示器，而是所有文件都按给定顺序被视为一个长文件。（在这种情况下，由于使用了通配符 `*`，它们将按照\
  \ shell 扩展 `*` 到所有名称的顺序显示。）\n\n## 9.2 显示文本\n\n查看文本最简单的方法是将其发送到标准输出。这对于显示文本的部分内容，或者将文本的部分内容传递给命令行中的其他工具非常有用。\n\
  \n许多人仍然使用 `cat` 来查看文本文件，特别是当它是一个小文件时。要在屏幕上输出文件的所有内容，请使用 `cat` 并将文件名作为参数。\n\n*⇒ 要输出文件\
  \ `notes` 的内容，请输入： `$ cat notes`\n\nRET\n\n如果你有一个想要查看的小文本文件，只需将其 `cat` 到屏幕上即可。它很快，能完成任务，你不需要费心。\n\
  \n但虽然它在合并文本时很有用（参见食谱第 10.6 节 [合并文本]，第 256 页），但它并不总是审阅或阅读文本的最佳方法——例如，非常大的文本会滚出屏幕顶部之外。\n\
  \n第 9 章：查看文本\n\n217\n\n有时，简单地输出文本是非常合适的，例如当你只想显示文件中的某一行，或者当你想显示文件的开头或结尾部分时。\n\n\
  本节描述了用于此类目的的工具。这些工具最好作为过滤器来使用，通常位于管道的末尾，从其他命令的输出中获取输入。要以某种字体显示文本，首先将其转换为 PostScript\
  \ 并查看它（参见食谱第 15.2 节 [输出文本到 PostScript]，第 359 页）。\n\n### 9.2.1 显示非打印字符\n\n使用带有 `-v`\
  \ 选项的 `cat` 输出非打印字符（如控制字符），以便看到它们。使用此选项，`cat` 以*帽子表示法（hat notation）*输出这些字符，用脱符号\
  \ (`^`) 和 与实际控制字符对应的字母或其他字符表示（例如，“Control-G”或铃声字符将输出为 `^G`）。\n\n*⇒ 要输出所有非打印字符都以帽子表示法显示的翻译文件，请输入：\n\
  \n`$ cat -v translation`\n\nRET\n\n要视觉化显示每行的结束，使用 `-E` 选项；它指定在每行结束后输出一个 `$`。这对于确定行是否包含尾空格字符很有用。（你也可以使用\
  \ `grep` 输出包含尾空格的行。）\n\n同样有用的是 `-T` 选项，它将制表符作为其字面控制字符输出，以帽子表示法写为 `^I`。\n\n`-A` 选项结合了这三个选项——它等同于指定\
  \ `-vET`。\n\n*⇒ 这里是一些使用这些选项的方法。\n\n* • 要输出在每行末尾显示 `$` 字符的翻译文件，请输入：\n\n`$ cat -E\
  \ translation`\n\nRET\n\n* • 要输出所有制表符写为 `^I` 而不是字面制表符的翻译文件，请输入：\n\n`$ cat -T translation`\n\
  \nRET\n\n* • 要输出包括制表符在内的非打印字符以帽子表示法显示，且每行末尾显示 `$` 字符的翻译文件，请输入：\n\n`$ cat -A translation`\n\
  \nRET\n\n218\n\n《Linux Cookbook》，第 2 版\n\n### 9.2.2 显示文本的开头\n\n使用 `head` 输出文本的开头。默认情况下，它输出输入的前十行。\n\
  \n*⇒ 要输出文件 `placement-list`的前十行，请输入： `$ head placement-list`\n\nRET\n\n你可以指定数值选项指定输出的行数。如果你指定的行数多于文件包含的行数，`head`\
  \ 将输出整个文本。\n\n*⇒ 这里是使用此功能的两种方法。\n\n* • 要输出文件 `placement-list` 的第一行，请输入： `$ head\
  \ -1 placement-list`\n\nRET\n\n* • 要输出文件 `placement-list` 的前 66 行，请输入： `$ head -66\
  \ placement-list`\n\nRET\n\n要输出指定数量的*字符*（字节）而不是行，将要输出的字符数作为 `-c` 选项的参数。\n\n*⇒ 要输出文件\
  \ `placement-list` 中的第一个字符，请输入： `$ head -c1 placement-list`\n\nRET\n\n**注意：** 一个名为\
  \ `line` 的旧 unix 工具仅输出其输入的第一行。\n\n该工具在 Linux 中不存在，但你可以通过为 `head` 定义 `-1` 来模拟（别名请参见第\
  \ 82 页）。\n\n### 9.2.3 显示文本的结尾\n\n`tail` 的工作类似于 `head`，但它输出输入的最后部分。默认情况下，它输出十行。\n\
  \n*⇒ 这是使用它的一些方法。\n\n* • 要输出 `placement-list` 的最后十行，请输入： `$ tail placement-list`\n\
  \nRET\n\n* • 要输出 `placement-list` 的最后 14 行，请输入： `$ tail -14 placement-list`\n\n\
  RET\n\n* • 要输出 `placement-list` 的最后 100 个字符，请输入： `$ tail -c100 placement-list`\n\
  \nRET\n\n要相对于文本的*开头*指定要输出的部分，在数字前加加号 (`+`)。\n\n第 9 章：查看文本\n\n219\n\n*⇒ 这是使用此功能的两种方法。\n\
  \n* • 输出从第三行开始的 `placement-list` 结尾，请输入：\n\n`$ tail +3 placement-list`\n\nRET\n\n\
  * 输出从第百百个字符开始的 `placement-list` 结尾，请输入：\n\n`$ tail -c +100 placement-list`\n\nRET\n\
  \n有时持续查看文件的结尾很有用；这对于正在写入另一个进程的“增长型”文件有用。使用带有 `-f` 选项的 `tail` 来查看此类文件。按 `CTRL-C`\
  \ 停止查看。\n\n*⇒ 要跟踪 `access_log` 的结尾，请输入： `$ tail -f access_log`\n\nRET\n\n**注意：**\
  \ 你可以使用 `less` 实现相同的结果；在审阅文本时输入 `F`（第 211 页）。\n\n### 9.2.4 显示文本的中间部分\n\n有几种方法输出文本的中间部分。\n\
  \n#### 方法 #1\n\n要输出文件的某一行，使用 `sed`（参见食谱第 10.5 节 [编辑流]，第 255 页）。提供要输出的行号后跟 `!d` 作为\
  \ `sed` 的参数；将要输出的文件作为第二个参数。\n\n*⇒ 输出 `placement-list` 的第 47 行，请输入： `$ sed '47!d'\
  \ placement-list`\n\nRET\n\n要输出多于一行的区域，提供起始和结束行号，用逗号分隔。\n\n*⇒ 输出 `placement-list`\
  \ 的第 47 到 108 行，请输入： `$ sed '47,108!d' placement-list`\n\nRET\n\n#### 方法 #2\n\n\
  要输出某些文本的中间部分，你也可以在管道中组合多个 `head` 或 `tail` 命令（参见食谱第 3.2.4 节 [将输出重定向到另一个命令的输入]，第 69\
  \ 页）。\n\n220\n\n《Linux Cookbook》，第 2 版\n\n*⇒ 这里是一些使用这种方法。\n\n* • 输出 `placement-list`\
  \ 文件中的第十行，请输入： `$ head placement-list | tail -1`\n\nRET\n\n* • 输出 `placement-list`\
  \ 的倒数第五行和第四行，请输入：\n\n`$ tail -5 placement-list | head -2`\n\nRET\n\n* • 输出 `placement-list`\
  \ 中的第 500 个字符，请输入： `$ head -c500 placement-list | tail -c1`\n\nRET\n\n\n\n\n\n```\n\
  $ head -5 placement-list | tail -1 | head -c1\n```\nRET\n\n在前面的示例中，使用了三个命令：首先将文件\
  \ `placement-list` 的前五行传递给 `tail`，由 `tail` 输出结果中的最后一行（即文件中的第五行）；然后，最后一个 `head` 命令输出该最后行的第一个字符，从而实现了预期的结果。\n\
  \n## 9.2.5 显示字符串之间的文本\n\n使用 `sed` 选择字符串之间的文本行，并输出仅该部分文本，或者输出*除*该部分以外的所有文本行。这些字符串可以是单词，也可以是正则表达式（参见第\
  \ 14.3 节谱 [文本模式的匹配]，第 335 页）。\n\n运行 `sed` 并使用 `-n` 选项，后跟 `'/first*/,/last*/p'`，以仅输出字符串\
  \ `first` 和 `last` 之间的文本（包含边界）。这对于输出文本文件中的某个章节或节非常有用，前提是你知道用于标记章节开始的文本。\n\n⇒ 要输出文件\
  \ `book-draft` 中“Chapter 3”和“Chapter 4”之间的所有文本，输入：\n\n```\n$ sed -n '/Chapter 3/,/Chapter\
  \ 4/p' book-draft\n```\nRET\n\n要输出*除*两个模式之间之外的所有文本行，请省略 `-n` 选项。\n\n⇒ 要输出文件 `book-draft`\
  \ 中的所有文本，但“Chapter 3”和“Chapter 4”文本之间的除，输入：\n\n```\n$ sed '/Chapter 3/,/Chapter\
  \ 4/p' book-draft\n```\nRET\n\n**注意：** 有更多关于 `sed` 的信息，请参见第 10.5 节 [文本流编辑]，第 255\
  \ 页。\n\n第 9 章：查看文本\n\n## 9.2.6 显示文本的字面字符\n\n有些工具可以显示字面字符——即经过格式化的文本，让你清晰无地看到每个字符及其在文件中的位置。\n\
  \n以下方法展示了如何使用这些工具。\n\n### 方法 #1\n\n使用 `od`（“八进制转储”工具）配合 `-c` 选项显示某些文本中的 ascii 字符。这将每行\
  \ 16 个字符一组输出，并用空格分隔，在可能的情况下为控制字符提供反斜杠转义。左侧显示一列，包含该行第一个字符的 `offset`（距离文件起始的字节数）。使用\
  \ `-A` 选项并提供“d”作为参数，以十进制输出这些数字，而不是默认的八进制。\n\n⇒ 以下是使用该工具的一些方法。\n\n• 要显示文件 `details`\
  \ 中的字面字符，每行 16 个字符一组，每行均以偏移量数字开头，输入：\n```\n$ od -Ad -c details\n```\nRET\n\n• 要输出文件\
  \ `details` 最后一行的字面字符，输入：\n```\n$ tail -1 details | od -Ad -c\n```\nRET\n\n### 方法\
  \ #2\n\n你可以使用 `hexdump` 达到 `od` 的效果。使用 `-c` 选项，它将文件中的每个字节显示为其代表的字符。与方法 #1 类似，每行显示输入的\
  \ 16 个字符，用空格分隔，并在左侧写一列显示文件的偏移量值，在这种情况下，偏移量是以十六进制给出的。\n\n⇒ 要显示文件 `exam` 中的字面字符，每行\
  \ 16 个字符一组，每行均以十六进制偏移量数字开头，输入：\n```\n$ hexdump -c exam\n```\nRET\n\n## 9.2.7 显示文本的十六进制值\n\
  \n所有文本字符在磁盘上都以数值存储（参见第 9.3.7 节 [查看字符集]，第 228 页）。有时你可能想要显示文本字符的值，而不是这些值所代表的字符。\n\n\
  这对于检查包含非打印字符的文本文件的字面内容，或显示构成二进制文件的字面字符很有帮助。\n\n有几种方法可以实现，每种方法都有自己的输出格式。\n\n它们都能以十六进制（或简称为“hex”）输出；这些输出有时被称为*十六进制储*（hex\
  \ dumps）。\n\n### 方法 #1\n\n`hexdump` 过滤器以多种格式之一转储其输入，每行显示文件的多个字符，并在一个指示该行第一个字符在文件中位置的数字。\n\
  \n要以十六进制显示文本，首先使用 `tr` 过滤器消除输入中的回车符，并将此文本通过 `-c` 选项传递给 `hexdump`，该选项以十六进制显示输入，每个字符一个字节。每行显示输入的\
  \ 16 个字符，用空格分隔，并在左侧写一列显示十六进制的文件的偏移量值。\n\n⇒ 要以十六进制查看文件 `tarpon` 的内容，输入：\n```\n$ tr\
  \ -d '\\r' < tarpon | hexdump -c | less\n```\nRET\n\n### 方法 #2\n\n使用 `od`（“八进制转储”）对某些文本进行字面且无歧的转储。\n\
  \n它可以作为过滤器工作，也可以接受文件名作为参数，并以八进制、十六进制或其他格式输出。\n\n使用 `-t` 选项指定输出的格式类型，并提供“x1”作为参数，指定显示应为十六进制，每个整数一个字节（如果参数为“x2”，则为十六进制整数）。\n\
  \n⇒ 要输出文件 `book-draft` 中的所有文本，但“Chapter 3”和“Chapter 4”文本之间的除，输入（注：此处原文逻辑似乎有重复，已按要求翻译）：\n\
  ```\n$ sed '/Chapter 3/,/Chapter 4/p' book-draft\n```\nRET\n\n（注：原文在此处可能存在逻辑重复或错误，此处严格遵循原文内容翻译。）\n\
  \n\n\n\n\n⇒ 这里有两种使用它的方法。\n\n• 要查看 `nroff` 文件 `program.1`，输入：\n\n```\nman -l program.1\n\
  ```\nRET\n\n• 要将 `nroff` 文件 `program.1` 转换为文本，并将该文本写入新文件 `program.txt`，输入：\n\n```bash\n\
  man -l program.1 > program.txt\n```\n\nRET\n\n在最后一个示例中，新文件 `program.txt` 将包含用于粗体文本的重叠字符。原始文件\
  \ `program.1` 保持不变。\n\n**注意：** 所有的帮助页（man pages）都是以 `nroff` 编写的，因此使用该命令进行查看。\n\n\
  # 9.3.3 查看 C 程序源代码\n\n查看 C 程序源代码至少有两种两种方法。\n\n第 9 章：查看文本\n225\n\n## 方法 #1\n\nCutils\n\
  \nDEB: `cutils`\n\nWWW: `http://www.sigala.it/sandro/software.html#cutils`\n\n使用\
  \ `chilight` 过滤器（该工具作为 `Cutils` 软件包的一部分分发）来查看带有语言高亮的 C 程序源代码。给定文件名作为参数（如果省略文件名，则使用标准输入），`chilight`\
  \ 将输出以多种格式之一高亮的 C 程序源代码。\n\n通过向 `-f` 选项提供以下内容之一作为参数来指定高亮格式；默认值为“tty”。\n\n`ansi_color`\n\
  带有 ANSI 颜色的 ASCII 文本。\n\n`ansi_bold`\n带有 ANSI 粗体效果的 ASCII 文本。\n\n`html_color`\n\
  带有颜色高亮的 HTML。\n\n`html_font`\n带有粗体和斜体高亮的单色 HTML。\n\n`roff`\ntroff 输入文本。\n\n`tty`\n\
  带有重叠显示字符的 ASCII 文本（默认值）。\n\n由于文本中的 `ansi` 高亮由非打印控制序列组成，因此要查阅此类输出，请使用带有 `-R` 选项的\
  \ `less` 命令（参见食谱 9.1.4 [查阅原始文本]，第 214 页）。\n\n⇒ 要以彩色语言高亮查看文件 `myprog.c` 中的 C 程序源代码，输入：\n\
  \n```bash\nchilight -f ansi_color myprog.c | less -R\n```\nRET\n\n默认情况下，`chilight`\
  \ 将输出发送到标准输出。若要写入文件，请将要写入的文件名作为 `-o` 选项的参数。\n\n⇒ 要将文件 `myprog.c` 中的 C 程序源代码格式化为带高亮的\
  \ HTML，并将输出写入文件 `myprog.html`，输入：\n\n```bash\nchilight -f color_html -o myprog.html\
  \ myprog.c\n```\nRET\n\n## 方法 #2\n\n要查看带有高亮的 C 程序源代码，请使用 `enscript` 对其进行“美化打印”，如食谱\
  \ 15.2.4 [输出带有语言高亮的文本]，第 365 页所示。\n\n226\n《Linux 食谱》，第 2 版\n\n此方法以 PostScript 格式输出文本，然后对其进行查看或打印。\n\
  \n它也适用于许多其他语言和格式，而不只是 C 语言——参见上述食谱中的表格。\n\n⇒ 要以带有语言高亮的 PostScript 格式显示文件 `myprog.c`\
  \ 中的 C 程序源代码，输入：\n\n```bash\nenscript -Ec -o i myprog.c | gv -\n```\nRET\n\n在此示例中，使用了\
  \ `gv` 命令来显示 `enscript` 的输出。\n\n# 9.3.4 查看排序文本的行\n\n使用 `look` 显示排序后的文本文件中的某些行。它对排序后的文件进行快速搜索，因此对于查看大型排序列表中的行特别有用。将要在行首匹配的文本以及要从哪个文件读取的文件名作为参数。\n\
  \n⇒ 要显示排序文件 `catalog` 中所有以文本“DOT”开头的行，输入：\n\n```bash\nlook DOT catalog\n```\nRET\n\
  \n如果要匹配的文本包含空格，请将其括起来。\n\n⇒ 要显示排序文件 `parts-list` 中所有以文本“Part No. 42”开头的行，输入：\n\n\
  ```bash\nlook \"Part No. 42\" parts-list\n```\nRET\n\n**注意：** 如果没有第二个参数，`look` 使用系统字典。这在食谱\
  \ 11.2.1 [列出匹配模式的单词]，第 283 页中有描述。\n\n# 9.3.5 查看下划线文本\n\n可以通过在每个需要下划线的字符后插入一个退格字符（“Control-H”），随后是一个下划线字符（`_`）来实现普通文本的下划线。发送到打印机时，打印机会先打印原始字符，然后退格并在下方打印一个下划线。这种下划线被称为*重叠式*下划线或*退格下划线*（参见食谱\
  \ 13.9 [文本下划线]，第 327 页）。\n\n如果你使用 `cat` 等工具将此类文本输出到标准输出，你将在显示器看到下划线字符，而不是它们原本要下划的字符——退格字符已经提前删除了它们。（但如果你将\
  \ `cat` 的标准输出通过到文件或其他命令，原始输入中的所有字符都将保留。）\n\n第 9 章：查看文本\n227\n\n有几种方法可以用不同的方式查看包含退格下划线的文本。\n\
  \n## 方法 #1\n\n使用 `less` 阅包含退格下划线的文本（参见食谱 9.1 [查阅文本]，第 211 页）。\n\n⇒ 要查阅包含退格下划线的文件\
  \ `term-paper`，以便查看其包含的下划线，输入：\n\n```bash\nless term-paper\n```\nRET\n\n## 方法 #2\n\
  \n使用 `ul` 工具输出包含退格下划线的文本，以便这些下划线能够正确显示。\n\n⇒ 要输出 `term-paper` 文件中的任何退格下划线，输入：\n\n\
  ```bash\nul term-paper\n```\nRET\n\n通过 `cat` 查看 `ul` 在 `term-paper` 中的输出。\n\n⇒ 要通过\
  \ `cat` 查看 `term-paper` 中的任何输出，输入：\n\n```bash\nul term-paper | cat\n```\nRET\n\n\
  ## 方法 #3\n\n使用 `colcrt` 将退格下划线转换为虚线（一系列连字符，如“------”）。\n\n⇒ 要将 `term-paper` 中的退格下划线转换为虚线，输入：\n\
  \n```bash\ncolcrt term-paper\n```\nRET\n\n虚线会在文本下方直接插入新行，这并不总是理想的。使用 `-` 选项完全抑制下划线，并纯文本显示任何下划线。\n\
  \n⇒ 要输出移除所有下划线的 `term-paper` 文件，输入：\n\n```bash\ncolcrt - term-paper\n```\nRET\n\n\
  228\n《Linux 食谱》，第 2 版\n\n# 9.3.6 列出二进制文件中的文本\n\n使用 `strings` 输出二进制文件中任何可打印文本。将搜索的文件名作为参数，所有非文本字符串都被发送到标准输出。有时，通过\
  \ `fmt` 过滤文本可以改进显示。\n\n⇒ 这里有一些使用它的方法。\n\n• 将 `table.com` 中的任何文本字符串保存到文件 `table.txt`，输入：\n\
  \n```bash\nstrings table.com > table.txt\n```\nRET\n\n• 查阅 `table.com` 中的任何文本字符串，输入：\n\
  \n```bash\nstrings table.com | less\n```\nRET\n\n• 查阅 `table.com` 中文本字符串的格式化输出，输入：\n\
  \n```bash\nstrings table.com | fmt | less\n```\nRET\n\n# 9.3.7 查看字符集\n\n*字符集*是表示集合中每个字符的数值编码规范。ascii（美国标准信息交换）是一种自\
  \ 1968 年以来一直使用的字符集，它仍然是计算中标准的字符集。其他字符集也可用。Linux 的默认字符集 `iso 8859-1`（“Latin1”）是`ascii`的一种“变体”，包含了所有的标准`ascii`字符集以及额外的\
  \ 128 个字符。这些额外字符有时被称为*扩展字符*。\n\n多个字符集都有自己的帮助页；要查看这些字符集之一，请查看相应的帮助页（参见食谱 2.8.4 [读取系统手册页]，第\
  \ 46 页）。\n\n要查看列出 ascii`字符集中所有有效字符以及输入它们所需的字符代码的表，请查看`ascii`帮助页。\n\n⇒ 要查看`ascii`字符集，输入：\n\
  \n```bash\nman ascii\n```\nRET\n\n这显示了每个字符的八进制、十进制和十六进制值，还显示了它们的转义码。这些值对于引用特殊字符很有用。\n\
  \n\n\n\n\n`iso_8859_1` 手页包含了整个 `iso 8859-1` 字符集，包括标准 127 个 ASCII 字符以上的所有扩展字符。\n\n\
  # 第 9 章：查看文本\n\n*⇒ 要查看 `iso_8859-1` 字符集，请输入：`$ man iso_8859_1`\n\n你可以使用此页面查看该字符集中的所有字符以及如何输入它们。\n\
  \n**注意：** 在 Emacs 中，有一种特殊的方法来“引用”这些字符；该技术请参见食谱 10.1.4 [在 Emacs 中插入特殊字符]，第 239 页。\n\
  \n`miscfiles` 软件包也包含了这些字符集的图表，如食谱 11.4 [使用词汇表和参考文件] 第 289 页所阐述的那样。\n\n# 第 10 章：编辑文本\n\
  \n## 10. 编辑文本\n\n编辑文本是在基于 Linux 的系统（或者说是任何计算机）上进行计算最基础的活动之一。我们在撰写文档、发送电子邮件、制作网页、为\
  \ Usenet 发布文章、编程时都会编辑文本——此类比比少。\n\n大多数文本编辑是在*文本编辑器*中完成的，它是一种通常打开包含某些文本的文件并允许你对该文本进行重新排列、插入、删除和其他其他编辑的应用程序。人们花费大量的计算时间使用文本编辑器应用程序来编辑文本。\n\
  \n在本章中，我将介绍目前最流行的两个文本编辑器。我还会涵盖不使用编辑器即可编辑文本的其他基本或方便的方法，包括合并、文件包含以及使用鼠标剪切和粘贴。\n\n\
  有很多文本编辑器可供选择，但人人都知道只有两个选择：Emacs 和 Vi。大多数编辑器都属于这两个主分支之一；受 Emacs 影响的程序可能比受其他任何应用程序的影响得多，而且几乎每一个\
  \ Unix 系统都安装了某个版本的 Vi。大多数用户倾向于选择其中一种；很少有人对两者都精精通。许多工具和应用程序都有特殊模式，在这些模式下可以识别 Emacs\
  \ 和 Vi 的按键命令，包括 `Bash` 终端（见第 3 章 [Shell]，第 53 页）。\n\n本章的章节将对这两者都要介绍。新手们，你们最好为每种编辑器都花半小时时间，留出时间尝试内置的教程。然后，选择让你产生共鸣的那一个。\n\
  \nEmacs 和 Vi 并不是你可能熟悉的种种程序，一些新手起初可能会感到困惑——但它们实际上并不难用，而且这种体验是极有回报的。任何具有其中一种工具经验的人都知道，在这样的编辑器中可以做的事情比其他系统上的任何“文字处理器”都要多得多，也快得多。如果你运行了\
  \ Emacs 和 Vi 的教程，你就可以感受一下它们是如何运作的，并看看哪一个可能适合你（运行它们的方法请参见食谱 10.1.2 [运行 Emacs 教程]\
  \ 第 237 页和食谱 10.2.2 [运行 Vi 教程] 第 247 页）。\n\n当然，还有其他编辑器，并且许多编辑器都有他们他们忠诚的追随者；值得看看有哪些可用工具。如果你习惯了其他系统上的某个特定编辑器，那么\
  \ Linux 上很有可能存在该编辑器的“克隆版”。例如，某些编辑器的工作方式与 dos 中的 `edit` 程序或旧的 `WordStar` 文字处理器类似（Emacs\
  \ 中有一个特殊模式 `wordstar-mode`，可以模拟它的按键绑定）。本章最后列出了其他推荐编辑器的列表。\n\n## 10.1 使用 Emacs\n\n\
  ### GNU Emacs\n\n- `DEB`: `emacsen-common`\n- `emacs21`\n- `RPM`: `emacs`\n- `WWW`:\
  \ `http://www.emacs.org/`\n\n```\nemacsen-common\nemacs21\nemacs\n```\n\n将 `Emacs`\
  \ 称为文本编辑器是对它的一种低估——它是一个能够执行许多功能的大型应用程序，包括读取电子邮件和 Usenet 新闻、浏览万维网，甚至是浅尝的心理分析（证明，请参见食谱\
  \ 30.7 [接受心理分析]，第 594 页）。\n\nEmacs 有两个主要变体，以及许多分支和替代版本。`gnu Emacs` 由 `fsf` 作为其“gnu\
  \ 系统”的一部分发布，它是原始的 Emacs。`XEmacs`（以前称为 Lucid Emacs）是一个替代版本。它提供的功能基本上与 `gnu Emacs`\
  \ 相同，但也包含了其用于 `X Window System` 的自己的功能（它在某些细微方面也也与 `Gnu Emacs` 有不同）。\n\n`gnu Emacs`\
  \ 和 `XEmacs` 是目前最流行的 `emacsen`（人们这样称呼它们）；其他版本包括 `jed`（见食谱 10.8 [使用其他文本编辑器]，第 263\
  \ 页）和由凯斯西储大学的一位程序员开发的 Chet's Emacs (`ce`)。`gnu Emacs` 是后续食谱中假设的 Emacs 版本，但原则上，它们应该适用于任何\
  \ Emacs 变体。\n\n首先是对使用 Emacs 的简要介绍，其中穿插了必要的 Emacs 术语；随后是描述如何使用某些 Emacs 独有编辑功能的食谱。\n\
  \n### 10.1.1 熟悉 Emacs\n\n熟悉 Emacs 的快方法是启动它并尝试进行一些编辑。\n\n通过通常的方式启动 Emacs，要么在 X 窗口管理器中选择它，要么在\
  \ shell 提示符输入它的名称（小写）。提供任何文件名作为参数来打开它们。\n\n*⇒ 有两种这样做的方法：*\n\n* 在 shell 提示符下启动 `gnu\
  \ Emacs`，输入：`$ emacs`\n* 在 shell 提示符下启动 `XEmacs` 并打开名为 `journal` 的文件，输入：`$xacs journal`\n\
  \n```\nemacs\nxemacs journal\n```\n\n当 Emacs 首次启动时会显示欢迎消息，它告诉我们如何运行教程（我们稍后会看）。沿窗口整个左侧运行的条被称为滚动条（scroll\
  \ bar）。显示 Emacs 会话的 X 客户端窗口（或在不运行 X 时的终端屏幕）被称为框架（frame）。注意，侧面没有边框（如果你仔细看会发现即使是滚动条所在的侧也没有边框）；这是因为今天的许多窗口管理器（包括插所示）只在顶部和底部绘制边框。\n\
  \n顶部的条称为菜单栏（menu bar），你可以通过鼠标左键点击菜单并向下拖动来展开它的菜单。当你在终端运行 Emacs 时，无法使用鼠标展开菜单，但你可以通过\
  \ F10 在文本菜单窗口中访问并选择相同的菜单项。\n\n在 Emacs 中打开的文件或其他文本存储在称为缓冲区（buffer）的区域中。\n\n默认情况下，当前缓冲区出现在菜单栏下方的巨大区域。要在缓冲区中写入文本，只需输入即可。光标所在的缓冲区位置称为点（point），许多\
  \ Emacs 命令都会引用它。\n\nEmacs 窗口底部、当前缓冲区正方的水平条称为模式行（mode line）；它提供了有关当前缓冲区的信息，包括它的名称、缓冲区占据屏幕的百分比、`point`\
  \ 所在的行以及缓冲区是否已保存到文件。\n\n\n\n\n模式行（mode line）还会列出缓冲区中激活的模式。Emacs `modes` 是控制 Emacs\
  \ 行为的通用状态——例如，当设置 `overwrite-mode` 时，你输入的文本会“覆盖”光标处的文本；在 `insert-mode`（默认模式）下，你输入的文本会被“插入”光标处。通常会列出\
  \ `fundamental-mode`（默认）或 `text-mode`。\n\n模式行正下方是 `echo area`（回显区），Emacs 在此编写短的状态消息，例如错误信息；它是\
  \ Emacs 窗口的最后一行。\n\n当你输入一个需要输入的命令时，该区域会请求输入（当这种情况发生时，你在回显区输入内容的地方就被称为 `minibuffer`（微缓冲区））。如果你仔细观察，会发现它也有自己的滚动条。\n\
  \nEmacs 广泛使用 `CTRL` 和 `ALT` 组合键。由于 Emacs 在文化上与 Microsoft Windows 和 Apple macOS 世界的编辑器方法不同，它在那些领域得了一个相当毫无根据的声誉，认为它奇怪且难以使用。事实并非如此。运行其各种功能的键盘命令设计得易于使用和易于记忆——一旦你习惯了这个概念，就可以非常快速地输入这些组合键。\n\
  \n在 Emacs 符号中，这些按键以特定方式写入。许多命令通过输入 `CTRL - X` 开始，写为“C-x”（例如，退出 Emacs 的命令是 `CTRL\
  \ - X CTRL - C`，写为“C-x C-c”）。\n\n1. `F10` 键在 `X` 中同样有效，其行为与在终端中相同。\n\n# 第 10 章：编辑文本\n\
  \n235\n\n函数以 `ALT - X` 为前缀，在 Emacs 中写为“M-x”。\n\n你可以通过函数开启或关闭各种模式。\n\n例如，你可以通过切换\
  \ `menu-bar-mode` 来让菜单栏出现或消失。通过输入 `F10` 激活菜单下拉列表无论 `menu-bar-mode` 是否开启都有效；如果它是关闭的，菜单选项将出现在新的缓冲区窗口中。\n\
  \n你可以通过输入 `ALT - * X` 紧接着输入函数名并按 `RET` 来运行任何 Emacs 函数。\n\n*⇒ 若要运行 `menu-bar-mode`\
  \ 函数从而关闭顶部菜单栏，请输入：\n\n`ALT - * X menu-bar-mode RET`\n\n（如果菜单栏已经关闭，运行此函数将将其重新打开。）\n\
  \n在 Emacs 中输入 `CTRL - * G` 可以退出你正在输入的函数或命令；如果你在输入命令时出错，这对于取消和终止键盘输入非常有用。\n\n`find-file`\
  \ 函数会提示文件名并在新的缓冲区中打开文件的副本；其键盘快捷键是 `CTRL - X CTRL - F`（你可以在按下并释放 `X` 和 `F` 键时一直按住\
  \ `CTRL` ）。\n\n*⇒ 若要运行 `find-file` 函数，请输入：\n\n`ALT - * X find-file RET`\n\n此命令运行\
  \ `find-file` 函数，它会提示文件名并在新的缓冲区中打开文件的副本。\n\nEmacs 可以同时打开多个缓冲区。你作为 `emacs` 参数提供的任何文件名都将在单独的缓冲区中打开：`$\
  \ emacs diary etc/todo etc/rolo RET`\n\n（当然，你也可以创建新缓冲区并在之后在缓冲区中打开文件。）正如函数以 `ALT\
  \ - X` 键为前缀一样，许多命令也以类似的 `CTRL - X` 键为前缀，特别是处理缓冲区、文件或与退出 Emacs 的命令。\n\n要在缓冲区之间切换，输入\
  \ `CTRL - X CTRL - B`。然后输入要切换到的缓冲区名称，后按 `RET`；或者，在不输入缓冲区名称的情况下输入 `RET` 以切换到上次访问的缓冲区。（在\
  \ Emacs 中查看缓冲区被称为 `visiting` 缓冲区。）\n\n2. 技术上，这指的是 `META` 键。不过你的键盘可能有一个 `ALT` 键而没有\
  \ `META` 键，在这种情况下你使用 `ALT` 来输入它，所以我用 `ALT` 来表示此键（参见第 1.2 节 [排版规范]，第 6 页）。\n\n236\n\
  \n《Linux 食谱》，第 2 版\n\n*⇒ 若要切换到名为 `todo` 的缓冲区，请输入：\n\n`CTRL - X CTRL - B todo RET`\n\
  \n如果缓冲区不存在，Emacs 将根据你提供的名称创建一个新缓冲区。\n\n当你启动 Emacs 时，存在一个名为 `scratch` 的特殊缓冲区，你可以用它来写笔记和其他不想保存的内容；其内容不会保存，下次运行\
  \ Emacs 时 `scratch` 缓冲区将再次变为空。\n\n*⇒ 若要切换到 `scratch` 缓冲区，请输入：\n\n`CTRL - X CTRL\
  \ - B scratch RET`\n\n要在当前缓冲区中写文本，直接输入即可。你输入的文本插入在光标处。\n\n*⇒ 若要在当前缓冲区的光标处插入一行文本，请输入：*This\
  \ is how to type in Emacs.* `RET`\n\n通过使用 `CTRL - X k` 命令“杀死”（killing）缓冲区来关闭缓冲区。Emacs\
  \ 在微缓冲区中请求要杀死的缓冲区名称。默认是当前缓冲区；只需按 `RET` 即可杀死它。如果缓冲区的内容来自文件，且缓冲区中包含未保存的工作，Emacs 将要求你确认杀死缓冲区。如果它是\
  \ `scratch` 缓冲区或内容从未写入过的新缓冲区。\n\n（注：此处原文存在大量乱码/重复字符，已跳过翻译）\n\n当你在 Emacs 中并在任何时候，输入\
  \ `CTRL - * X CTRL - C`\n\n*\n\n* 要退出 Emacs，\n\n`\n\n - - -\n\n\n\n\n\n the `RET`\n\
  \n下表列出了基础编辑按键并描述了它们的功能。\n\n如果一个函数有两个常用的按键可用，则两个都会给出。\n\n*移动光标*\n\n*或* `CTRL - *\
  \ P`\n\n将光标向上移动到上一行。\n\n*或* `CTRL - * N`\n\n将光标向下移动到下一行。\n\n*或* `CTRL - * B`\n\n\
  将光标在缓冲区中*向后*（向左）移动一个字符。\n\n*或* `CTRL - * F`\n\n将光标在缓冲区中*向前*（向右）移动一个字符。\n\n`ALT -\
  \ * F`\n\n将光标向前一个*单词*。\n\n238\n\n《Linux 食谱》，第 2 版\n\n（续）\n\n*移动光标*\n\n`ALT - * B`\n\
  \n将光标向后移动一个*单词*。\n\n`ALT - *`\n\n将光标向后回到下一个段落开头。\n\n`ALT - *`\n\n将光标向前移动到下一个段落结尾。\n\
  \nPgUp *或* `CTRL - * V`\n\n将光标向前通过缓冲区移动一个屏幕。\n\nPgDn *或* `ALT - * V`\n\n\n\n\n\n\
  将光标向上移动一个屏幕的高度。\n\n`CTRL-*A`\n\n将光标移动到当前行开头。\n\n`CTRL-*E`\n\n将光标移动到当前行末尾。\n\n`CTRL-*L`\n\
  \n重新居中 Emacs 窗口中的文本，使光标所在位于位于中间。\n\n### 插入与删除\n\n`INS`\n\n切换 `overwrite-mode`。\n\
  \n`CTRL-*T`\n\n将光标处的字符与左侧字符交换。\n\n`ALT-*T`\n\n将光标处的单词与左侧单词交换。\n\n`BKSP` 或 `CTRL-*H`\n\
  \n删除光标左侧的字符。\n\n`DEL` 或 `CTRL-*D`\n\n删除光标右侧字符。\n\n### 剪切与粘贴\n\n`SHIFT-*INS` 或 `Y`\n\
  \n将光标处的文本存到 kill ring 中（见食谱 10.3.2）\n\n`CTRL-*Y`\n\n粘贴文本。\n\n`CTRL-*SPACEBAR`\n\n\
  设置标记（见食谱 10.3.1 [剪切文本]，第 254 页)。\n\n`CTRL-*`\n\n撤销上一次操作（控制-下划线）。\n\n`CTRL-*K`\n\n\
  删除从光标到行尾的文本。\n\n`CTRL-*W`\n\n删除从标记到光标的文本。\n\n# 第 10 章：文本编辑\n239\n\n### 获取帮助\n\n\
  `CTRL-*H t`\n\n启动 Emacs 教程。\n\n`CTRL-*H k keystroke`\n\n描述 `keystroke`。\n\n`CTRL-*H\
  \ a function`\n\n列出所有与 `function` 相关的 Emacs 命令。\n\n`RET`（注：原文为 `RET` 然后 `CTRL-*H\
  \ F`，根据上下文可能是一个序列）\n\n`CTRL-*H F`\n\n在新缓冲区中打开 `Emacs FAQ` 的副本。\n\n`CTRL-*H i`\n\n\
  启动 Info 系统。\n\n### 命令操作\n\n`CTRL-*G`\n\n取消当前命令。\n\n`CTRL-*U number`\n\n重复你输入的 `number`\
  \ 次的下一个命令或按键。\n\n### 文件操作\n\n`CTRL-*X` `CTRL-*C`\n\n保存 Emacs 中打开的所有缓冲区，然后退出程序。\n\
  \n`CTRL-*X` `CTRL-*F`\n\n在新缓冲区中打开 `file` 进行编辑。要创建一个尚不存在的 `file`，按 `RET` 并指定你想给它的文件名即可。要浏览文件，输入\
  \ `TAB` 而不是文件名。\n\n### 特殊菜单\n\n`CTRL-*left-click`\n\n显示所有打开缓冲区的菜单，按主模式排序（仅在 X 下有效）。\n\
  \n`SHIFT-*left-click`\n\n显示字体选择菜单（仅在 X 下有效）。\n\n## 10.1.4 在 Emacs 中插入特殊字符\n\n某些字符是你无法正常输入到\
  \ Emacs 缓冲区中的。例如，在文本文件中，你可以通过插入分页符字符（formfeed character，ASCII 的 `CTRL-*L` 或八进制代码\
  \ 014），当当你打印带有分页符的文件时，当前页面会在该字符处跳出，并在新页上继续打印。\n\n然而，`CTRL-*L` 作为 Emacs 命令具有含义。\n\
  \n要插入此类字符，请使用 `quoted-insert` 函数，`CTRL-*Q`。它接受你想插入的字符的字面按键，或该字符的八进制代码。它会在光标处插入该字符。\n\
  \n240\n《Linux 烹饪之道》，第二版\n\n⇒ 这里有两种使用它的方法。\n\n• 通过指定其实际的按键（`CTRL-*L`）在光标处插入分页符，输入：\n\
  \n`CTRL-*Q`\n`CTRL-*L`\n\n• 通过指定其八进制字符代码在光标处插入分页符，输入：\n\n`CTRL-*Q` `014` `RET`\n\
  \n上述示例的作用相同：它们都在光标处插入一个分页符。\n\n`CTRL-**--Q` 的一个有趣用法是给文本加下划线。要做到这一点，在每个想要下划线的字符后插入一个字面的\
  \ `CTRL-*H` 字符，后面跟着下划线（`_`）。\n\n⇒ 给光标前的字符加下划线，输入：`CTRL-*Q`\n`CTRL-*H _`\n\n然后你可以使用\
  \ `ul` 将文本输出到屏幕（见第 327 页 [给文本加下划线]）。\n\n另一种你可能想要插入的特殊字符是用于各种语言的带音字符和其他字符。\n\n在缓冲区中插入它们有两种方法。\n\
  \n### 方法 1\n\n要插入带音字符，使用 `iso-accents-mode`。当此模式激活时，你可以输入一个特殊音字符，加上要带音的字符，相应的带音字符将插入到光标处。\n\
  \n下表显示了特殊音字符和使用的组合。\n\n| 前缀 | 加上字母 | 产生结果 |\n| :--- | :--- | :--- |\n| \" | a |\
  \ ä |\n| \" | e | ë |\n| \" | i | ï |\n| \" | o | ö |\n| \" | u | ü |\n| \" | s\
  \ | ß |\n| ' | a | á |\n| ' | e | é |\n| ' | i | í |\n| ' | o | ó |\n| ' | u | ú\
  \ |\n| ` | a | à |\n| ` | e | è |\n| ` | i | ì |\n| ` | o | ò |\n| ` | u | ù |\n\
  | ~ | a | ã |\n| ~ | c | ç |\n| ~ | d | ˜ |\n| ~ | n | ˜ |\n| ~ | t | ˜ |\n| ~ |\
  \ u | ˜ |\n| ~ | < | << |\n| ~ | > | >> |\n| ~ | ! | ¡ |\n| ~ | ? | ¿ |\n| ^ | a\
  \ | â |\n| ^ | e | ê |\n| ^ | i | î |\n| ^ | o | ô |\n| ^ | u | û |\n| / | a | ˚\
  \ |\n| / | e | æ |\n| / | o | ø |\n\n⇒ 在当前缓冲区写入文本“Emacs ist spa!”，输入：`ALT-*X iso-accents-mode`\
  \ `RET`\n*Emacs spa* *ss!*\n\n如果在 `iso-accents-mode` 开启的情况下，你想输入组成带音字符的字面组合，请输入两次前缀。\n\
  \n⇒ 在 `iso-accents-mode` 开启时在缓冲区中输入文本“o”（而不是字符 ó），输入：\n\n`''o`\n\n242\n《Linux 烹饪之道》，第二版\n\
  \n### 方法 2\n\n要在进入 `iso-accents-mode` 的情况下在缓冲区中插入带音字符和其他特殊语言字符，使用 `CTRL-*X 8` 后跟音音的特殊按键组合。\n\
  \n非字母字符不需要前缀。\n\n⇒ 在当前缓冲区写入文本‘Hasta Mañana!’，输入：`CTRL-*X 8` Hasta Ma `CTRL-*X 8`\
  \ ana!\n\n**注意：** 当缓冲区包含带音字符时，它不再作为纯文本保存，而是作为 iso-859-1 字符集（见 9.3.7）。\n\n最近 Emacs\
  \ 增加了许多国际化函数。对这些函数的完整讨论超本书的范围；更多信息请参阅*手册*中的“国际字符支持”部分。\n\n## 10.1.5 在 Emacs 中创建缩写\n\
  \n*abbrev*（缩写）是一个较长单词或短语的缩写。缩写的存在是为了方便你——你可以定义缩写来扩展难以输入的短语，或者定义你倾向的拼写错误以转换为正确的拼写。只有在开启了\
  \ `abbrev-mode` 时，缩写才会生效。\n\n⇒ 开启 `abbrev-mode`，输入：`ALT-*X abbrev-mode` `RET`\n\n\
  要定义缩写，输入你想使用的缩写，然后输入 `CTRL-*X`。Emacs 会会在缓冲区中提示你想让它扩展的文本；输入该文本后按 RET。\n\n• 将“ww”定义为“Walla\
  \ Walla, Washington”的缩写，执行以下操作：\n\n1. 首先，输入缩写本身：`ww`\n2. 接下来指定该文本为缩写；输入：`CTRL-*X`\n\
  3. 现在输入扩展后的文本：“ww”的全局扩展：*Walla Walla, Washington* `RET`\n\n现在，每当你在当前缓冲区中输入文本“ww”并跟随空格或标点符号时，该文本就会扩展为“Walla\
  \ Walla, Washington。”\n\n保存你定义的缩写，使用 `write-abbrev-file` 函数。这会将所有当前定义的缩写保存到一个文件中，你可以在未来的\
  \ Emacs 会话中读取它（如果你喜欢，也可以在缓冲区中打开文件并编辑缩写）。\n\n⇒ 将当前定义的缩写保存到 ~/.abbrevs，输入：`ALT-*X\
  \ write-abbrev-file` `RET` ~/.abbrevs* `RET`\n\n然后，在未来的 Emacs 会话中，你可以使用 `read-abbrev-file`\
  \ 函数为该会话定义这些缩写。\n\n⇒ 从 ~/.abbrevs 文件读取缩写并为当前会话定义它们，输入：`ALT-*X read-abbrev-file`\
  \ `RET` ~/.abbrevs* `RET`\n\n\n\n\n\n注意事项：Emacs 模式命令是切换开关。因此，要关闭缓冲区中的 `abbrev-mode`，只需再次输入\
  \ `ALT -*- X` `abbrev-mode` `RET` 即可。如果你在当前的 Emacs 会话稍后在该缓冲区中开启了 `abbrev-mode`，缩写将被记住并再次展开。\n\
  \n## 10.1.6 在 Emacs 中录制和运行宏\n\n`macro`（宏）就像按键序列的录制——当你运行宏时，Emacs 会执行该按键序列，就像是你输入过它一样。\n\
  \n要开始录制宏，输入 `CTRL -*- X (` 。然后，你输入的内容都会被记录为宏，直到你输入 `CTRL -*- X )` 停止录制。\n\n录制宏后，你可以在\
  \ Emacs 会话期间任何时候通过输入 `CTRL -*- X e` 来回放它。你可以在它前面加上通用参数命令 `CTRL -*- U` 来指定回放的次数。\n\
  \n⇒ 以下是一些使用它的方法。\n\n• 要录制一个将当前行首单词大写化然后移动到下一行的宏（`ALT -*- C` 将光标右侧的单词大写），输入：\n\n\
  ```\nCTRL -*- X (\nCTRL -*- A\nALT -*- C\nCTRL -*- N\nCTRL -*- X )\n```\n\n• 要回放该宏\
  \ 20 次，输入：\n\n```\nCTRL -*- U 20 CTRL -*- X e\n```\n\n注意事项：宏是 Emacs 工作机制的基础——事实上，Emacs\
  \ 的名字就源于“Editing MACroS”（编辑宏），因为 1976 年第一版本的 Emacs 实际上是为另一个文本编辑器编写的一此类宏的集合。\n\n\
  ## 10.1.7 同时查看多个 Emacs 缓冲区\n\n你可以将一个 Emacs 帧（frame）分为多个 `windows`（窗口），每个窗口显示自己的缓冲区。这对于同时查看多个缓冲区的部分非常有用。当你有一个长缓冲区，并且想在编辑一部分时查看另一部分时，这也很有——如果你将帧分成二，你可以在一个窗口中移动到想要查看的文本，并在另一个窗口中编辑它的不同部分。\n\
  \n使用 `CTRL -*- X 2` 将当前帧分为两个窗口（上下堆叠），使用 `CTRL -*- X 3` 将其垂直分割，形成两个并排的窗口。默认情况下，当前缓冲区在两个窗口中显示，但你可以随时更改任何窗口中显示的缓冲区。在\
  \ X 中，使用鼠标调整任何窗口的大小——左键点击窗口的状态行（mode line），并拖动它来调整该窗口的大小。\n\n通过使用鼠标指针定位光标位置并左键点击，或者通过输入\
  \ `CTRL -*- X o` 切换到另一个窗口来切换不同的窗口。当你需要反复从长文件的一个部分到另一个部分剪切（kill）文本选择时，这非常方便：在一个窗口中剪切文本，在另一个窗口中将其粘贴（yank）到目标位置。当你有很多选择内容需要剪切和粘贴时，这种方法可以节省时间。\n\
  \n使用 `CTRL -*- X 1` 移除多个窗口并使帧恢复为单个窗口。\n\n## 10.2 使用 Vi\n\nNvi\n\nDEB: `nvi`\n\n\
  RPM: `nvi`\n\nWWW: `http://www.bostic.com/vi/`\n\nWWW: `http://vasc.ri.cmu.edu/old_help/Editors/Vi/`\n\
  \n以下配方适用于 Vi 编辑器。它的读音为“vye”，或有时读作“vee-eye”，是 `visual` 的缩写；当它首次发明时，它是最早可以在整个屏幕上视觉显示文本以进行交互编辑的编辑器之一（当时的其他交互式编辑器通常按行显示文件）。\n\
  \n与 Emacs 一样，Vi 有许多变体；今天最流行的包括 `Vim` 和 `Elvis`，它们都是较新的实现，比原始 Vi 多出许多功能。本节假设使用 `Nvi`，这是针对\
  \ bsd 的原始 Vi 的新实现，常见于今天的大多数 Linux 系统。\n\n### 10.2.1 熟悉 Vi\n\n与 Emacs 一样，熟悉 Vi 的方法是启动它并尝试一些基础编辑。\n\
  \n你可以通过从 X 窗口管理器提供的菜单中选择它，或者在 shell 提示符处输入它的名称（小写字母）来启动 Vi。\n\n提供文件名即可开始编辑文件。\n\n\
  ⇒ 以下是两种实现方法。\n\n• 在 shell 提示符下启动 Vi，输入：\n\n```\n$ vi\nRET\n```\n\n• 要在 Vi 中打开名为\
  \ `journal` 的文件进行编辑，输入：\n\n```bash\n$ vi journal\nRET\n```\n\nVi 是一个 `modal`（模态）编辑器，你输入的文本含义取决于编辑器当前所处的编辑模式。当你启动时，Vi\
  \ 处于命令模式（command mode），这意味着你输入的文本被解释为字面的 Vi 命令。\n\n典型的 Vi 会话在以命令模式打开新文件启动后，看起来如图\
  \ 10-2 所示。\n\n光标位于右上角。Vi 会在文件末尾之后用波浪号（`~`）填充屏幕上的行；因此当你处于新文件时（例如当你不带参数启动 Vi 时），屏幕上充满了波浪号，因为文件中还没有任何内容。\n\
  \n屏幕的底部被称为 `command line`（命令行），Vi 在此处显示关于你正在编辑的文件的重要消息和信息。\n\n当 Vi 启动时，命令行会显示三条信息：首先是用于该文件的恢复文件名。其次，Vi\
  \ 会显示它使用 `/tmp` 目录存储你编辑的所有文件的临时文件文件名；它会保存你的编辑工作，以便在程序崩溃或你在未保存的情况下意外退出 Vi 时进行恢复。在这种情况下，文件还没有名称，因此命令行上会写着“new\
  \ file”。命令行上显示的第三条信息是光标所在文件的行号。\n\n*图 10-2. Vi 启动时的界面。*\n\n⇒ 在命令模式下输入 `ZZ` 退出 Vi。\n\
  \n• 从命令模式退出 Vi，输入：\n\n```\nZZ\n```\n\n要开始编辑特定文件，请将其名称作为参数提供；如果你指定了一个不存在的文件，Vi 将开始编辑一个新文件，当你将其写入磁盘时，它将以你给出的名称保存。\n\
  \n⇒ 要启动 Vi 并打开名为 `planner` 的文件，输入：\n\n```bash\n$ vi planner\nRET\n```\n\n在命令模式下，通过输入命令来执行操作。要取消已输入的命令，按下\
  \ `ESC`。某些命令（特别是用于写文件的命令）前面有一个冒号字符（`:`）；从技术上说，按下冒号会带你进入一个新的模式，即命令行模式。\n\n要切换到 `insert\
  \ mode`（插入模式，即你输入的文本会被插入到正在编辑的文件中，可以使用几个命令之一；`i` 命令在光标当前位置进入插入模式，并允许你在该处插入输入的文本。要退出插入模式并返回命令模式，输入\
  \ `ESC`。\n\n⇒ 在 Vi 中插入一行文本然后返回命令模式，输入：\n\n```\ni Hello, world.\nRET\nESC\n```\n\n\
  这从命令模式移动到插入模式，在当前文件的光标所在处插入文本“Hello, world.”和一个换行符，然后让 Vi 回到命令模式。\n\n获取帮助的命令是 `:help`，要获取命令列表及其用法，运行\
  \ `:viusage` 命令。\n\n⇒ 要获取 Vi 命令及其用法的列表，输入：\n\n```\n:viusage\nRET\n```\n\n当你在 Vi\
  \ 中打开文件时，文件内容被放在自己的缓冲区中，与 Emacs 一致。在写入之前，更改不会应用到磁盘文件。\n\n要将缓冲区写入文件，使用 `:w` 并提供文件名。\n\
  \n使用 `:wq` 将文件写入磁盘并退出，使用 `:q!` 放弃所有未保存的编辑并退出 Vi。\n\n⇒ 以下是两种使用方法。\n\n• 将缓冲区的内容写入文件\
  \ `my_practice_file` 并退出 Vi，输入：\n\n```\n:wq my_practice_file\nRET\n```\n\n• 放弃任何未保存的编辑并退出\
  \ Vi，输入：\n\n```\n:q!\nRET\n```\n\n注意事项：你也可以输入 `ZZ` 将更改保存到当前文件并退出。\n\n## 10.2.2 运行\
  \ Vi 教程\n\n\n\n\n\nVi 编辑器带有一个实操性的、自步进式的教程，你可以在一小时内完成。与 Emacs 教程一样，它仅仅是一个用 Vi 打开的只读文本文件。它的设计目的是通过向你展示各种命令及其对文本的影响，来教你如何使用\
  \ Vi。它以压缩文件的形式存储在 `/usr/doc/nvi` 目录下；将此文件复制到你的家目录，解压，然后用 `vi` 打开它即可开始教程。\n\n《Linux\
  \ 厨房指南》（The Linux Cookbook），第 2 版\n\n⇒ 要运行 vi 教程，在主目录下输入以下命令：$ cp /usr/doc/nvi/vi.beginner.gz\
  \ .`\n\nRET\n\n```bash\n$ gunzip vi.beginner.gz\n```\n\nRET\n\n```bash\n$ vi vi.beginner\n\
  ```\n\nRET\n\n**注意：** `/usr/doc/nvi` 中还提供了一个高级教程。\n\n`vim` 编辑器有一个交互式教程，你可以通过其自身的命令\
  \ `vimtutor` 来运行它。\n\n## 10.2.3 使用基础 Vi 编辑键\n\n编辑键取决于你所处的模式。在插入模式下，你输入的任何文本都会插入到文件中，直到你输入\
  \ `ESC` 切换回命令模式。\n\n下表描述了在命令模式下可用的命令。\n\n### 光标移动\n\n*   `CTRL - F`: 向下滚动一整屏文本。\n\
  *   `CTRL - B`: 向上滚动一整屏文本。\n*   `CTRL - D`: 向下滚动半屏文本。\n*   `CTRL - U`: 向上滚动半屏文本。\n\
  *   `or j`: 向下移动一个字符。\n*   `or k`: 向上移动一个字符。\n*   `or h`: 向左移动一个字符。\n*   `or l`:\
  \ 向右移动一个字符。\n*   `H`: 移动到屏幕顶部。\n*   `L`: 移动到屏幕底部。\n*   `w`: 向向前一个单词。\n*   `b`: 向后移动一个单词。\n\
  *   `(`:向前一个句子。\n\n第 10 章：编辑文本 249\n\n### 光标移动（续）\n\n*   `)`: 向后移动一个句子。\n*   `number\
  \ G`: 跳到第 `number` 行。（如果前面没有数字，`G` 将跳转到文件的最后一行。）\n*   `0`: 跳到光标所在行的开头。\n*   `$`:\
  \ 跳到光标所在行的末尾。\n\n### 剪切与粘贴\n\n*   `x`: 删除光标所在的字符。\n*   `dd`: 删除光标所在的行。\n*   `D`:\
  \ 删除从光标到行尾的所有内容。\n*   `J`: 将光标所在的行与其后的下一行合并（即删除它们之间的换行符）。\n*   `p`: 在光标后粘贴上次删除的文本。\n\
  *   `P`: 在光标前粘贴上次删除的文本。\n*   `number yy`: “复制”（Yank）当前行。如果前面有数字，则复制指定数量的行。\n*  \
  \ `u`: 撤销上一次的编辑。\n*   `.`: 重做上一次的编辑。\n\n### 搜索\n\n*   `/ pattern RET`: 向前搜索 `pattern`（如果未提供，则向前搜索上次搜索模式的下一次出现处）。搜索会从文件末尾绕回到开头。\n\
  *   `? pattern RET`: 向后搜索 `pattern`（如果未提供，则向后搜索上次搜索模式的下一次出现处）。搜索会从文件开头绕回到末尾。\n\n\
  《Linux 厨房指南》（The Linux Cookbook），第 2 版 250\n\n### 进入插入模式\n\n*   `a`: 在光标后紧追加文本。\n\
  *   `A`: 在光标所在行的末尾追加文本。\n*   `i`: 在光标前插入文本。\n*   `I`: 在光标所在行的开头插入文本。\n*   `o`: 在光标所在行下方开启新行，并在那里开始插入文本。\n\
  *   `O`: 在光标所在行*上方*开启新行，并在那里开始插入文本。\n*   `r`: 用你输入的字符替换光标所处的字符。\n*   `R`: 用你输入的文本替换现有文本。\n\
  *   `s`: 用你输入的文本替换光标下的字符，删除该字符并在此处插入文本。\n*   `S`: 用你输入的文本替换光标所在的行，删除该行并在该处插入文本。\n\
  \n### 退出 Vi\n\n*   `:q RET`: 只有在没有未保存编辑的情况下才退出 Vi。\n*   `:q! RET`: 不保存直接退出，即使文件已更改。\n\
  *   `:w name RET`: 将文件写入磁盘；如果指定了 name，则写入该文件名。\n*   `:wq name RET`: 将文件写入磁盘并退出 Vi；如果指定了\
  \ name，则写入该文件名。\n*   `ZZ`: 保存文件并退出 Vi。\n\n第 10 章：编辑文本 251\n\n## 10.2.4 在 Vi 中插入特殊字符\n\
  \n要在 Vi 中按输入的内容逐封地插入控制字符，请在输入模式下输入 `CTRL - V`，然后输入控制字符。\n\n⇒ 这里有两种使用此功能的方法。\n\n\
  *   在命令模式下，要在光标前插入页符字符（“Control-L”），请输入：\n    ```bash\n    i\n    CTRL - V\n   \
  \ CTRL - L\n    ```\n*   当你在命令模式下，要在光标前插入页符字符，输入：\n    ```bash\n    CTRL - V\n \
  \   CTRL - L\n    ```\n\n## 10.2.5 在 Vi 中运行命令\n\n要在 Vi 中按原样运行 shell 命令，在命令模式下输入\
  \ `!` 后接命令。\n\n*   在命令模式下，运行 shell 命令使用 `!`：\n    ```bash\n    !command\n    ```\n\
  *   在输入模式下，运行 shell 命令：\n    ```bash\n    !:command\n    ```\n\n**注意：** 运行命令后会返回编辑模式。\n\
  \n## 10.2.6 在 Vi 中插入命令输出\n\n你可以将命令的输出插入到正在编辑的文件。使用 `:r` 后接命令。输出将插入到光标所在的位置。\n\n\
  ⇒ 在文件中插入当前日期，输入：\n```bash\n:r date\n```\nRET\n\n《Linux 厨房指南》（The Linux Cookbook），第\
  \ 2 版 252\n\n## 10.2.7 定制 Vi\n\n有很多可以设置的选项；使用 `set` 命令加上选项名称进行设置。单独使用 `set` 会列出与默认值不同的选项，加上\
  \ `all` 则列出所有可用选项。\n\n⇒ 这里有两种使用此功能的方法。\n\n*   要显示所有与默认值不同的选项，输入：\n    ```bash\n\
  \    set\n    ```\n    RET\n*   要显示所有可用选项，输入：\n    ```bash\n    set all\n    ```\n\
  \    RET\n\n下表列出了某些 `set` 选项及其描述：\n\n*   `autoindent`: 自动缩进。\n*   `autowrite`: 切换文件时自动写入磁盘。\n\
  *   `beautify`: 不显示控制字符。\n*   `columns=number`: 设置列数（默认 80，X 下更多）。\n*   `flash`:\
  \ 闪烁屏幕而不是蜂响。\n*   `leftright`: 允许左右滚动。\n*   `lines=number`: 设置显示的行数（默认 24，X 下更多）。\n\
  *   `list`: 无歧义地显示文本，制表符显示为 `^I` 而不是八个空格，每行末尾显示 `$`。\n*   `nonumber`: 不显示行号（默认值）。\n\
  *   `number`: 显示行号。\n*   `ruler`: 在命令行上绘制标尺，显示当前行号和列号。\n*   `showmatch`: 在闭合括号或大括号时显示其匹配的左括号。\n\
  *   `showmode`: 在命令行右侧显示当前编辑模式名称，并在文件被修改时显示星号 (*)。\n*   `verbose`: 提供详细的错误信息。\n\n\
  **注意：** 完整的选项列表请参阅 vi 的 man 页。\n\n第 10 章：编辑文本 253\n\n## 10.3 操作文本选择\n\n你可以在 X 和终端中对文本进行“剪切粘贴”操作。\n\
  \n在 X 中，你可以在不同的窗口之间剪切粘贴文本，包括 Xterm 和 Emacs 窗口。最近选择的文本被称为 *X 选择*。\n\n在终端中，你可以在同一个虚拟控制台或不同的虚拟控制台之间剪切粘贴。要实现这一点，你需要安装\
  \ `gpm` 包并为鼠标进行配置（大多数系统上默认已设置）。\n\n\n\n\n\n鼠标上的三个按钮用于剪切和粘贴。如果你有一个双键鼠标，管理员可以将其设置为模拟三键，此时你只需同时按下左键和右键来指定中间键。\n\
  \n点击左鼠标键并将鼠标在文本上拖动以选择它。你也可以在单词上双击左鼠标键来选择该单词，或在某行上三击左鼠标键来选择该行。此外，你可以在想要选择的文本的一端点击左鼠标键，然后在另一端点击右鼠标键以选择两点之间的所有文本。\n\
  \n**注意：** 在 `xterm` 窗口中，当你于 shell 中本地运行工具或应用程序（例如 `Lynx` Web 浏览器）时，仅使用左鼠标键将不起作用。发生这种情况时，请在使用鼠标选择文本时按住\
  \ `SHIFT`。\n\n### 10.3.1 剪切文本\n\n你不需要选择文本即可剪切。在 shell 提示符或 Emacs 中，输入 `CTRL -*-\
  \ K` 可剪切从光标到行尾的文本。\n\n在 Emacs 术语中，剪切文本被称为 `killing` 文本。\n\n*⇒ Emacs 有额外的命令来杀死文本：\n\
  \n*• 当你按照前述通过鼠标选择了一个文本区域时，可以输入 `SHIFT -*- DEL` 将删除。\n*• 你也可以在文本区域的一端点击左鼠标键，然后在区域的另一端双击右鼠标键，以杀死该文本区域。\n\
  *• 要杀死 Emacs 缓冲区中的大部分文本，请将光标移动到文本的一端并输入 `CTRL -*- SPACEBAR` 在此处设置 `mark`。然后，将光标移动到文本的另一端，输入\
  \ `CTRL -*- W` 杀死它。\n\n### 10.3.2 粘贴文本\n\n`XPaste`\n\nDEB: `xpaste`\n\nRPM: `xpaste`\n\
  \nWWW: `http://www.seindal.dk/rene/software/xpaste/`\n\n要粘贴上次用鼠标选择的文本，请在想要粘贴的地方点击鼠标中间键。你也可以使用键盘，将光标移动到想要粘贴的地方然后输入\
  \ `SHIFT -*- INS`。\n\n这些命令在 X 环境和终端中均有效。\n\n在 X 中，要在单独的窗口中显示 X 选择的内容，请运行 `xpaste`\
  \ X 客户端；它存在的唯一目的就是在它的窗口中显示这段文本。\n\n在 Emacs 中，粘贴文本被称为 `yanking` 文本。Emacs 提供了一个额外的快捷键\
  \ `CTRL -*- Y`（“yank”），用于拉取上次被选择或杀死的文本。此键在 Bash shell 中同样有效，它会粘贴该 shell 会话中用 `CTRL\
  \ -*- K` 杀死的文本（如果有的话）。\n\n### 10.4 使用标记 (Token)\n\n一种方便但很少被讨论的文本编辑方法涉及标记（token）的使用。标记无非你放置在某处的一小段文本，代表占位符或其他稍后出现的某些文本。\n\
  \n标记的用处在于，当你离开该文本部分时，以后可以通过搜索标记字符串快速返回那里。\n\n你用于标记的字符串必须是唯一的，且不出现在正文中，但同时又必须是你能够识别的。使用它来标记你正在编辑的文本中的某一点，以便在你需要移动到文本的其他地方去做其他事情，但打算稍后回到这里时使用。它在你编辑文本且必须暂时留出空格时也非常方便，例如你将在以后确定后添加的某人的姓名。\n\
  \n当你想要回到用标记标记的地方时，只需使用编辑器的搜索功能搜索该标记。（在 Vi 中，你可以使用 `m` 命令在光标所在点的文件中设置一个命名的 `mark`。）\n\
  \n我最喜欢的标记是“tk”，即打印机的排版标记。这个双字母组合在英文文本中很少出现，而且它非常短，因此是用于此类目的的好选择。\n\n有些人使用一个可以记住的愚蠢无意义词，另一些人则使用\
  \ `***` 或 `###` 或其他内容。\n\n### 10.5 编辑文本流\n\n书中某些过滤文本的配方使用了 `sed`，即“流编辑器”。\n\n它不是通常意义上的文本编辑器——你不会在\
  \ `sed` 中打开一个文件并交互式编辑；相反，它对发送到其标准输入流的文本 `stream` 执行一组给定的编辑操作列表，并将结果写入标准输出流。这更像是一个过滤器而不是编辑器；`sed`\
  \ 拥有自己的编程语言，是格式化和搜索文本的有用工具。它通常在管道中作为过滤器。\n\n命令本身被称为 `sed`；它通常通过提供一组 `sed` 命令以及可选的文件规范作为参数来运行。\n\
  \n如果没有 `filespec`，标准输入将从何处读取。\n\n使用 `sed` 最简单的方法是将其作为过滤器以某种方式编辑输入流，并将其发送到输出。\n\n\
  例如，使用\n\n```\nsed\n```\n\n命令来搜索输入流中某些模式的所有实例。在印刷术中（该标记的起源地），它代表“即将到来的文本”，意味着放置此标记的文本将稍后出现。\n\
  \n```bash\nsed 's/pattern/replacement/g'\n```\n\n\n\n\n\n如果你运行的是 `cat later early`\
  \ > `novels`，文件将按照相反的顺序进行合并，从 `later` 开始；因此文件 `novels` 将看起来如图 10-6 所示。\n\n《不起盖的华传》\n\
  \n《夜色温柔》\n\n《最后的大亨亨》\n\n《天堂乐园》\n\n《美丽而堕落》\n\n*图 10-6. 反转后的 `novels` 文件。*\n\n接下来的章节提供了合并文本的其他配方。\n\
  \n**注意：** 你也可以使用 `cat` 来合并*非*文本文件，但它最常用的用法是处理文本文件。另一种自动化方式合并文本文件的方法是使用文件*包含*——参见第\
  \ 261 页的配方 10.7 [从其他文件包含文本]。\n\n一个类似的工具 `zcat` 可以作用于压缩文件的内容。\n\n258\n\n《Linux 厨房指南》，第\
  \ 2 版\n\n### 10.6.1 将文本写入文件\n\n有时候，调用文本编辑器来完成特定的任务太麻烦了——你只想写一个包含两行的文本文件，或者只是想在文本文件中追加一行。有很好的方法可以在不使用文本编辑器的情况下完成这类微编辑工作。\n\
  \n要在不使用文本编辑器的情况下写入文本文件，将 `cat` 的标准输出重定向到要写入的文件。你可以输入你的文本，并在单独的一行输入 `CTRL-D` 来结束文件。这在你想要快速创建一个小型文本文件时非常有用，但仅此而已；通常情况下，你会像本章前面的节描述的那样，在文本编辑器中打开或创建文本文件。\n\
  \n⇒⇒ 要创建一个包含某些文本的文件 `novels`，输入：`$ cat > novels`\n\n```\nRET\n*天堂乐园*\nRET\n*美丽而堕落*\n\
  RET\n*不起盖的华传*\nRET\n*夜色温柔*\nRET\nCTRL-D $\n```\n\n在这个例中，创建了文本文件 `novels`，它包含四行文本（带中带有\
  \ `CTRL-D` 的最后一行永远不是文件的一部分）。\n\n在不使用编辑器的情况下这样输入文本，在紧急情况下有时可以应付，但如果你犯了错误，除了重新开始外没有多少补救措施——你可以输入\
  \ `CTRL-U` 删除当前行，或者输入 `CTRL-C` 终止整个操作且不将文本写入文件，但仅此而已。\n\n### 10.6.2 向文件追加文本\n\n\
  要在不使用文本编辑器打开文件的情况下向文本文件添加文本，请使用带有追加运算符 `>>` 的 `cat`。（使用 `>` 则会覆盖文件。）\n\n⇒⇒ 要向文件\
  \ `novels` 的底部添加一行文本，输入：`$ cat >> novels`\n\n```\nRET\n*最后的大亨亨*\nRET\nCTRL-D\n```\n\
  \n第 10 章：编辑文本\n\n259\n\n在这个例中，没有为 `cat` 指定输入文件，因此 `cat` 使用了标准输入；然后输入了一行文本，该文本被追加到文件\
  \ `novels` 中（上一个配方中使用的文件）。所以现在这个文件看起来如图 10-5 所示。\n\n### 10.6.3 在文件开头插入文本\n\n在不调用文本编辑器的情况下在文本文件的*开头*插入文本比向文件末尾追加文本要复杂一点——但它是*可能*的。有几种方法可以实现。\n\
  \n#### 方法 #1\n\n图 10-7 所示提供的 shell 脚本将你提供的行插入到作为参数指定的文件中。\n\n将其放入名为 `ins` 的文件中，并将其安装为\
  \ shell 脚本（参见第 708 页的配方 A.3.4 [安装 shell 脚本]）。\n\n```bash\n#!/bin/sh\n/bin/ed $1\
  \ <<EOF\n0a\ncat\n.\nw\nq\nEOF\n```\n*图 10-7. `ins` 文件。*\n\n要在文件开头插入一行或多行文本，请将要插入文本的文件名作为参数传递\
  \ `ins`；`ins` 将从标准输入读取文本行并将其插入文件开头。（它通过在 `ed`（一个简单的行编辑器）中打开文件来实现。）给出 eof——即在单独的一行上输入\
  \ `CTRL-D` 来表示要插入的文本行的结束。\n\n260\n\n《Linux 厨房指南》，第 2 版\n\n⇒⇒ 要在文件 `novels` 的开头插入几行文本，输入：`$\
  \ ins novels`\n\n```\nRET\n*菲茨杰德·菲杰拉德小说*\nRET\n---------------------------------\n\
  RET\nCTRL-D $\n```\n\n此命令在 `novels` 的开头插入了两行文本（该文件是本节之前示例中使用的文件）。该文件现在看起来如图 10-8\
  \ 所示。\n\n菲茨杰德·菲茨杰拉德小说\n---------------------------------\n天堂乐园\n美丽而堕落\n不起盖的华传\n\
  夜色温柔\n最后的大亨亨\n*图 10-8. 带有新开头的 `novels` 文件。*\n\n#### 方法 #2\n\n要使用 `cat` 在文件开头插入文本，请使用\
  \ `cat` 合并标准输入和文件；将此重定向到一个新文件名，该文件将包含在开头插入了文本的文件。\n\n⇒⇒ 要在文件 `novels` 的开头插入几行文本，输入：`$\
  \ cat - novels > novels.tmp`\n\n```\nRET\n*菲茨杰德·菲茨杰拉德小说*\nRET\n---------------------------------\n\
  RET\nCTRL-D $\n```\n\n此命令写入一个新文件 `novels.tmp`，包含了输入的行以及 `novels` 内容。\n\n第 10 章：编辑文本\n\
  \n261\n\n### 10.7 从其他文件包含文本\n\n*包含*是指将文件的内容包含在另一个文件的特定位置，只需指定文件名即可，如下所示：\n\n`include(file)`\n\
  \n当你处理此文件时，带有 `include` 语句的行将被替换为 `file` 的内容（路径相对于当前目录）。\n\n使用 `m4` 工具（GNU 宏处理器）处理包含文件。它接受文件名作为参数并输出到标准输出。你可以使用重定向将输出到文件。\n\
  \n例如，假设你有三个文件：图 10-9 所示的 `soups`、图 10-10 所示的 `sandwiches` 以及图 10-11 所示的 `menu`。对于这些情况，你可以将每个部分分开，并构建一个包含你所需的顺序的文件名的包含文件：\n\
  \n```\ninclude(soups)\ninclude(sandwiches)\n```\n\n⇒ 处理该文件并写入文件 `monday.txt`，输入：`$\
  \ m4 menu > monday.txt`\n\n262\n\n如图 10-12 所示。\n\n今日菜单\n汤\n-----\n蛤蜊汤\n龙虾汤\n蔬菜\n\
  三明治\n----------\nBLT\n黑麦三明治\n烤牛肉\n图 10-12. `monday.txt` 文件。*\n\n![](img/index-297_1.png)\n\
  \n第 10 章：编辑文本\n\n263\n\n**注意：** 你可以编写多个使用你文件的包含文件——这些包含文件本身也可以拥有自己的包含。\n\n### 10.8\
  \ 使用其他文本编辑器\n\n下表描述了 Linux 上可用的一些流行或有趣的文本编辑器，并包含了关于它们的特殊特性和特征的信息以及截图。\n\nAEE\n\n\
  这种*高级**易用*编辑器具有弹出菜单界面，旨在无需预先说明即可使用；包含了用于 X、xae 的接口。\n\nDEB: aee\nRPM: aee\nWWW:\
  \ http://mahon.cwx.net/\n\n\n\n*图 10-13. 高级 Easy 编辑器。*\n\n![](img/index-298_1.jpg)\n\
