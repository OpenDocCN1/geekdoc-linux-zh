  \ | 音频 | ircam SoundFile 格式，用于某些音乐创作软件，如 CSound 和 MiXViews。 |\n| `.sgml` | 文本 |\
  \ sgml (“标准化通用标记语言”)格式。 |\n| `.stm`, `.tex` | 音频 | mod 文件。 |\n| `.tex` | 文本 | TEX\
  \ 或 LaTeX 文档。 |\n| `.text`, `.txt` | 文本 | 纯文本、无格式文本。 |\n| `.tga` | 图像 | TrueVision\
  \ Targa 图像格式。 |\n| `.tif`, `.tiff` | 图像 | 标记图像格式。 |\n| `.ult`, `.uni` | 音频 | mod\
  \ 文件。 |\n| `.voc` | 音频 | SoundBlaster voc 文件。 |\n| `.wav` | 音频 | Microsoft riff\
  \ 格式（也叫 wav）。 |\n| `.xbm` | 图像 | X Window 系统位图格式。 |\n| `.xm` | 音频 | mod 文件。 |\n\
  | `.xml` | 文本 | xml (“扩展标记语言”)格式。 |\n| `.xpm` | 图像 | 彩色 X Window 系统位图格式。 |\n| `.xwd`\
  \ | 图像 | 彩色 X Window 系统窗口“转储”文件格式。 |\n\n\n\n\n你的主目录是你存放个人文件的地方。良好的组织能力和一些远见将有助于保持你的“家”整理得井井有序。本附录主要提供了关于如何组织主目录的提示。\n\
  \n你会发现，这里概述的主目录在许多方面与 `/usr/local` 目录树相镜像，而该目录树本身在某种程度上又镜像了系统根目录 `/`；这并非巧合。Linux\
  \ 目录结构组织良好，非常适合这一目的；我发现主目录以及任何特定项目或“事物”的目录，通常有一些相似的目录和文件：`bin`、`doc` 等、`src`、`tmp`、`THANKS`、`passwd`\
  \ 等。\n\n你可以按照自己喜欢的方式配置主目录，当然，也可以随时更改它。没有任何规定说“你必须将此类文件存储在此处的目录中”或“你必须有一个 `etc` 之类的目录”。以下是我的做法。\n\
  \n### C.1 使用目录存放个人二进制文件\n\n二进制文件目录本质就是一个存储可执行文件的目录。\n\n为了让 shell 识别它，请将此目录添加到你在\
  \ `~/.bashrc` 文件定义的路径变量中。该目录可以命名为任何名称。我倾向于遵循 `bin` 习惯并将其直接放在主目录中：`~/bin`。\n\n⇒ 要创建自己的\
  \ bin 目录并将其添加到路径，请执行以下操作：1. 使用 `mkdir` 在主目录中创建一个 bin 目录：`$mkdir ~/bin`\n\n2. 使用文本编辑器编辑你的\
  \ `.bashrc`，更改路径以包含 `~/bin`（参见食谱 3.5.7 [添加到你的路径]，第 81 页）。这是一个用引号括起来、逗号分隔的列表。例如：\n\
  \n```\nPATH=\"/usr/local/bin:/usr/bin:/bin:/usr/bin/X11:/usr/games:~/bin:.\"\n```\n\
  \n在你自己的 bin 目录中，你可以放置自己设计的脚本和工具。它们由你执行，但系统上的其他用户无法执行。要让所有用户都能执行，超级用户必须将文件放在 `/usr/local/bin`，这是系统级的本地二进制文件目录。\n\
  \n**注意：**当前的 shell 不会识别你在 `.bashrc` 中所做的任何更改；你第一次必须手动运行它，或者直接退出并启动一个新的 shell。\n\n\
  ### C.2 使用目录存放个人列表和数据\n\n每个人都有一套包含列表、数据和其他“配置”的个人文件，例如密码、账户和口令、账户信息、地址等。将这些内容放在名为\
  \ `etc` 的目录中是很好的。有些人可能喜欢使用 `personal` 或 `per` 代替，但无论名称为何，我发现专门为此类目的设置一个目录非常方便。\n\
  \n这里是存放下表列出的类型的好地方。\n\n- `address` 或 `addr`：地址簿（参见食谱 27.5.1 [保留免费地址列表]，第 546 页）。\n\
  - `appointments` 或 `contacts`：待办事项列表。\n- `todo` 或 `TODO`：大写的文件名在目录列表中排在最前面。\n- `birthdays`：生日列表。\n\
  - `calendar`：个人日历文件。你可以根据自己的兴趣保留特殊的日历，例如 `calendar.birthdays` 或 `calendar.wwii`。\n\
  - `crontab`：个人 cron 表文件（参见食谱 28.3 [调度命令]，第 557 页）。\n- `passwd` 或 `passwords`：个人密码文件。务必更改其权限，让其他人无法查看（参见食谱\
  \ 6.3.4 [使文件私有]，第 169 页）。\n- `quotes`：喜欢的格言。\n\n### C.3 使用目录存放邮件\n\n你可能需要一个目录来存放所有的邮件通信，包括传入和传出的。大多数人使用\
  \ `Mail` 或 `mail` 作为此目录的；许多电子邮件应用程序使用其中一个作为存储消息的默认值。你可以在这里创建子目录将消息存储在更整洁的文件夹中，例如用于发送邮件的\
  \ `outgoing`、家庭通信的 `family` 以及项目邮件的 `projects`。\n\n### C.4 使用目录存放项目\n\n在处理某种类型的项目时，将一组文件放在一起有时是理想的。根据你的工作和企业，你可能想为项目创建一个目录——根据你的工作内容选择\
  \ `jobs`、`projects`、`work`、`drafts` 或 `research`，并在其中为你正在进行的任何特定项目或任务创建子目录。\n\n\
  程序员通常有一个用于计算机程序源码的 `src` 目录；你可能想要考虑的其他特殊工作常用目录还包括 `photos` 或 `photographs`、`art`\
  \ 或 `images`、`books` 以及 `music` 或 `recordings`。爱好者可能会保留 `scrapbook` 或 `craft` 目录。这些大类反过来可能包含特定项目的目录，而那些项目目录可能包含自己的用于源文件的\
  \ `src` 目录、用于文档的 `doc`、用于感谢的 `THANKS` 文件等。\n\n### C.5 使用目录存放临时文件\n\n你可能希望有一个目录作为某种“暂池”，用来引入那些可能很快需要处理但不必立即处理的新文件。我不喜欢弄乱主目录，所以有一个\
  \ `~/tmp` 目录来存放这些东西可以保持它的整洁。\n\n当然，你可以将文件保存在系统级的临时目录 `/tmp` 中，但该目录会被系统定期清理，而且如果你是在多用户系统中，你可能仍然需要一个私有的临时目录（所有用户通常对\
  \ `/tmp` 读写权限）。\n\n# 附录 D 进一步感兴趣的参考文献\n\n本附录列出了你应该了解 Linux 软件和信息的重要来源。\n\n### D.1\
  \ Linux 软件和硬件来源\n\n这些是获取软件（包括整个 Linux 发行版）以及关于与 Linux 兼容的硬件信息的来源。\n\n#### D.1.1\
  \ Linux 发行版\n\n以下是最流行的 Linux 发行版。你可以在 DistroWatch [http://www.distrowatch.com/]\
  \ 上找到更完整的列表，那里有一张比较它们特性的图表。\n\n- **Debian Gnu/Linux** 由致力于自由软件理念的志愿者开发。[http://debian.org/]\n\
  - **Fedora Core** 是旧版 Red Hat Linux 发行版的两个当代后裔之一（另一个是 Red Hat Enterprise Linux）。[http://fedora.redhat.com/]\n\
  - **Gentoo Linux** 与其他发行版不同，它仅以源码形式分发——所有二进制文件都为主机系统编译，从而提供了最高的效率。[http://www.gentoo.org/]\n\
  - **KNOPPIX** 是一种运行在可启动光光上的上的德国发行版。它使用 `deb` 作为包格式。[http://www.knoppix.com/]\n-\
  \ **Mandrakelinux** 以安装简单著称，并让你在硬盘的一个分区区上保留原有的操作系统。[http://www.mandrakelinux.com/en/]\n\
  - **muLinux** 是一个为旧电脑设计的小型发行版。[http://mulinux.sunsite.dk/]\n- **Red Hat Enterprise\
  \ Linux** 是 Red Hat, Inc. 其流行且成熟发行版的继任者。[http://redhat.com/]\n- **Run Up to date\
  \ Linux Everywhere** (rule) 专为需要现代 Linux 但负担不起现代计算机的用户设计。它基于最新的 Fedora Core，但可以在低内存和小型\
  \ CPU 的系统上运行。[http://www.rule-project.org/]\n- **Slackware Linux** 是仍在发布的最老的 Linux\
  \ 发行版。[http://slackware.com/]\n- **SuSE Linux** 德国设计，现由 Novell 所有，在欧洲非常流行。[http://suse.com/]\n\
  - **Turbolinux** 是 UnitedLinux 发行版的变体，是中国最流行的发行版。[http://www.turbolinux.com/]\n\
  - **Yellow Dog Linux** 专为 powerpc 电脑制造，例如某些 Apple Macintoshes（Debian 和其他发行版也有此类版本）。[http://www.yellowdoglinux.com/]\n\
  \n\n\n\n\n## D.1.2 Linux 及相关软件存档\n\n这些是 Linux 免费软件以及整个 Linux 发行版的在线资源来源。\n\n**Freshmeat**\
  \ 包含了数以千计的免费软件软件包的可搜索描述和链接。它还包含一个用于桌面桌面的 GUI“主题”仓库。\n\n[http://freshmeat.net/ and\
  \ http://themes.freshmeat.net/]\n\n**FSF/UNESCO 自由软件目录** 是一个按类别排序的大型软件包目录。[http://www.gnu.org/directory/]\n\
  \n**Ibiblio Linux Archive**（以前名为 `ssite`）是一个非常大的 Linux 软件存档，可能是持续运行最老的存档。它包含一个供下载的完整发行版公共存档。[http://www.ibiblio.org/pub/Linux/]\n\
  \n**Savannah** 托管了不属于 Gnu 项目但仍为自由软件的软件包。[http://savannah.nongnu.org/]\n\n**Linux\
  \ 科学应用** (`sal`) 是运行在基于 Linux 系统上的科学软件的权威列表。[http://ftp.llp.fu-berlin.de/lsoft/]\n\
  \n**Linux 音频与 MIDI 软件**是基于 Linux 系统的声音和音频的全面指南。[http://linux-sound.org/]\n\n**SourceForge**\
  \ 是互联网最大的自由软件开发者社区；它为自由软件开发者提供免费资源。[http://sourceforge.net/]\n\n**Sweetcode** 跟踪具有`创新性`的免费软件——而不仅仅是某些本就不无趣的旧专有应用程序的最新免费克隆版。[http://sweetcode.org/]\n\
  \n## D.1.3 Linux 硬件\n\n这些在线资源将帮助你挑选并获取与 Linux 兼容的硬件。\n\n附录 D：感兴趣的参考文献 733\n\n**LinuxHardware.net**\
  \ 是由用户贡献的兼容 Linux 的硬件数据库。[http://www.linuxhardware.net/]\n\n**LinuxHardware.org**\
  \ 拥有兼容 Linux 的硬件新闻和组件评测。[http://linuxhardware.org/]\n\n**Linux on Laptops** 拥有笔记本电脑和笔记本机型的最新数据库，以及它们对\
  \ Linux 支持程度。[http://www.linux-laptop.net/]\n\n**ResellerRatings** 是一个硬件销售商的消费者数据库，带有评分和评论。[http://resellerratings.com/]\n\
  \n**Price Watch** 是一个销售商库存及其价格的实时数据库。按组件或品牌搜索以获取当前的销售列表。[http://pricewatch.com/]\n\
  \n## D.2 Linux 书籍与指南\n\n这些是对特定主题的完整指南，通常是长篇书籍。\n\n### D.2.1 通用 Linux 指南与说明\n\n这些书籍和在线资源用于学习如何使用\
  \ Linux 系统。\n\nKirch, Olaf, 和 Terry Dawson，`Linux 网络管理员指南`，第二版，`Linux Documentation\
  \ Project`，2000 年。一本关于 90 年代初管理 Linux 网络的经典早期文本，由 O’Reilly & Associates 在 2000 年修订。[http://tldp.org/LDP/nag2/]\n\
  \n`Linux Gazette`。一份每月出版的网络杂志，致力于“让 Linux 变得更有趣”，多年来由 `ssc` 出版。它的“更多 2 分钱的小贴士”专栏闻名。[http://linuxgazette.com/]\n\
  \n`Linux HOWTOs` 和 `mini-HOWTOs`，`The Linux Documentation Project`。关于使用 Linux 各方面的著名文档合集。`ldp`\
  \ 还托管了一些较大的、书籍长度的指南。[http://tldp.org/HOWTO/HOWTO-INDEX/]\n\nMerrill, David C.,`The\
  \ Linux FAQ`，2003 年。包含了关于 Linux 的最常见问题的解答。[http://tldp.org/FAQ/Linux-FAQ/]\n\nSheer,\
  \ Paul，`Linux: Rute 用户教程与阐述`，`Prentice Hall PTR`，2001 年。一本 Linux 的完整指南，包含许多关于编程和网络的技术材料。与《Linux\
  \ 食谱》第二版书籍一样，它是在 Linux 系统上使用 `TEX` 排版的的（包含 `cd-rom`）。[http://rute.sourceforge.net/]\n\
  \nWirzenius, Lars 等等，`Linux 系统管理员指南`，`Linux Documentation Project`，1993 年。一本关于管理\
  \ Linux 系统的经典文本。[http://tldp.org/LDP/sag/]\n\n### D.2.2 Linux 工具与应用指南\n\n这些文档描述了特定的软件程序。\n\
  \n**AWK**\n\nRobbins, Arnold D.,`The GNU Awk 用户指南`，`Free Software Foundation`，1997\
  \ 年。[http://gnu.org/software/gawk/manual/]\n\n**Dselect**\n\nBortzmeyer, Stéphane，`Dselect\
  \ 初学者文档`，`Debian Documentation Project`，1999 年。推荐给 `dselect` 的首次用户。[http://debian.org/releases/2.1/i386/dselect-beginner.en.html]\n\
  \n**GROFF**\n\n我的 `Groff` 资源，网站，2002 年。文档和链接合集。[http://www.neverland.ch/groff/]\n\
