  \ Groff 资源`，网站，未标记。一份庞大的文档列表。[http://tylx.tripod.com/groff-resources.html]\n\nLesk,\
  \ M.E.,`tbl`——一个格式化表格的程序，`Bell Laboratories`，1976 年。关于使用 `tbl` 的极具价值的介绍。[http://www.neverland.ch/groff/tbl.ps.gz]\n\
  \nProvins, Dean Allen，`Groff and Friends HOWTO`。关于使用 `groff` 的介绍。[http://www.neverland.ch/groff/TheGroffFriendsHowto.ps.gz]\n\
