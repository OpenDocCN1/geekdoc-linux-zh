  \ `120x120` 像素），并将这些图像按五行四列进行平铺而成的。\n\n使用 `composite` 将两个图像合并为一个新图像——给出两个源图像的名称和输出文件的名称。蒙太奇图像是通过将所有输入图像缩放以适应尽可能大的尺寸（最高\
  \ `120x120` 像素），并将这些图像按五行四列进行平铺而成的。\n\n## 18.1.8 图像变形\n\n变形（Morphing）是一种用于在两个图像之间创建平滑过渡的特殊技术。蒙太奇图像是通过将所有输入图像缩放以适应尽可能大的尺寸（最高\
  \ `120x120` 像素），并将这些图像按五行四列进行平铺而成的。\n\n使用 `composite` 将两个图像合并为一个新图像——给出两个源图像的名称和输出文件的名称。蒙太奇图像是通过将所有输入图像缩放以适应尽可能大的尺寸（最高\
  \ `120x120` 像素），并将这些图像按五行四列进行平铺而成的。\n\n使用 `composite` 将两个图像合并为一个新图像——给出两个源图像的名称和输出文件的名称。蒙太奇图像是通过将所有输入图像缩放以适应尽可能大的尺寸（最高\
  \ `120x120` 像素），并将这些图像按五行四列进行平铺而成的。\n\n使用 `composite` 将两个图像合并为一个新图像——给出两个源图像的名称和输出文件的名称。蒙太奇图像是通过将所有输入图像缩放以适应尽可能大的尺寸（最高\
  \ `120x120` 像素），并将这些图像按五行四列进行平铺而成的。\n\n\n\n\n在整个图像下载之前，由早期扫描通过组成的低分辨率图像。`non-interlaced`图像在单次扫描中绘制。\n\
  \n⇒ 要将 `pnm` 文件 `pike.pnm` 转换为非交错的 `jpeg`，同时将图像锐 `50` 百比并添加 `2x2` 边界和版权注释，请输入（全部在一行）：\n\
  \n```bash\nconvert -interlace NONE -sharpen 50 -border 2x2 -comment 'Copyright 2008\
  \ Toby Smith' pike.pnm pike.jpeg\n```\n\n此命令将其输出写入文件 `pike.jpeg`。请注意，`-border` 和\
  \ `-comment` 选项之前已为 `mogrify` 工具描述过。某些 `ImageMagick` 工具共享常用选项，这在你同时对一个图像文件进行多项更改时非常有用；只需一个工具即可完成工作。\n\
  \n你可以相互与 `ImageMagick` 识别的任何图像格式（包括动画）进行转换。要制作动画，请将各个帧的文件作为参数，按你希望它们出现的顺序排列，并将新文件的名称作为最后一个参数。支持动画的格式包括\
  \ `miff` 和 `gif`。\n\n使用 `-delay` 选项指定帧之间的延迟，单位为百分之一秒。\n\n⇒ 要将所有文件 `drive1.jpg`、`drive2.jpg`、`drive3.jpg`、`drive4.jpg`\
  \ 和 `drive5.jpg` 制作成动画 `miff` 文件 `driving.miff`，帧之间延迟为五分之一秒，请输入（全部在一行）：\n\n```bash\n\
  convert -delay 20 drive1.jpg drive2.jpg drive3.jpg drive4.jpg drive5.jpg driving.miff\n\
  ```\n\n**注意：** 某些图像格式是“损真的”，这意味着在转换为它们时会丢失一些图像信息。例如，`jpeg` 格式是一种通常用于照片的损真格式。如果你将文件从源\
  \ `pnm` 格式转换为 `jpeg` 再转换回 `pnm`，生成的 `pnm` 将与原始源 `pnm` 不相同。\n\n要交互式转换图像文件，在 `gimp`\
  \ 中打开图像，然后从 `File`（文件）菜单中选择 `Save as`（另存为），并选择要使用的文件类型；更多信息请参见下文方案。\n\n434\n\n《Linux\
  \ 食谱》，第 2 版\n\n## 18.3 使用 gimp\n\n### GIMP\n\n- DEB: `gimp1.2`\n- `gimp-manual`\n\
  - RPM: `gimp`\n- WWW: `http://www.gimp.org/`\n\n如果你计划进行即使是最微或最偶尔的图像编辑，例如对图像应用过滤器或效果，或对数字照片进行修、调整大小或裁剪，你将希望花些时间熟悉\
  \ `gimp`（“GNU 图像处理程序”）。\n\n它是基于 Linux 系统的旗舰图像编辑器，一个全面的图像处理程序，你可以用它以复杂的方式绘画、绘制、创建和编辑图像。你还可以用它来转换图像文件、修饰和编辑照片，以及浏览图像集。\n\
  \n`gimp` 预装了数百种工具、过滤器、字体和其他精彩功能。以下是其核心功能的部分列表：\n\n- 包含一整套绘画工具，包括 `Brush`（画笔）、`Pencil`（铅笔）、`Airbrush`（喷笔）和\
  \ `Clone`（克隆仿）。\n- 支持自定义画笔和图案。\n- 包含一整套图像选择、变换和处理工具，包括渐变编辑器、颜色混合和特殊效果。\n- 包含动画支持。\n\
  - 允许使用图和通道。\n- 允许大型图像，其大小仅限于可用磁盘空间。\n- 提供高质量的字体抗锯齿。\n- 提供全 Alpha 通道支持。\n- 支持命令脚本。\n\
  - 允许多次撤销和重做，仅限于可用磁盘空间。\n- 允许同时打开多个图像。\n- 支持所有流行的图像文件格式，包括 `jpeg`、`png`、`xpm`、`tiff`、`tga`、`mpeg`、`ps`、`pdf`、`pcx`\
  \ 和 `bmp`。\n- 允许为新文件格式和新效果过滤器轻松添加超过 100 个插件。\n\n`gimp` 在 `X` 下运行，通过运行 `gimp` 或从窗口管理器菜单中选择启动。将任何要打开的图像文件名作为参数。\n\
  \n⇒ 从 shell 提示符后台启动 `gimp`，请输入：\n\n```bash\ngimp &\n```\n\n启动时，你作为参数提供的任何图像文件将在自己的窗口中打开。主\
  \ `gimp` 面板将在自己的窗口中打开，如图 18-10 所示。\n\n图 18-10。主 gimp 面板。\n\n**注意：** 要学习使用 `gimp`\
  \ 的基础知识，请参阅《GIMP 用户手册》以及 `gimp` 网站 `http://www.gimp.org/` 提供的其他文档和资源。你也可以在系统中安装手册；在\
  \ Debian 系统上，它通过 `gimp-manual` 包单独提供。\n\n## 18.4 使用其他图像编辑器\n\nLinux 有各种图像编辑应用程序可用——制作和编辑图像的方法与实现它的工具一样多。\n\
  \n下表列出了你可能想要探索的用于制作和编辑图像的其他流行工具和应用程序。这并非详尽列表。\n\n436\n\n《Linux 食谱》，第 2 版\n\n| 工具\
  \ | 描述 |\n| :--- | :--- |\n| `Aa3d` | 生成立体图。 |\n| `AutoTrace` | 将位图转换为矢量图形。 |\n\
  | `Barcode` | 制作条形码；识别所有商业标准。 |\n| `Blender` | 极其流行的 3d 建模、渲染、动画设计软件。 |\n| `Cadubi`\
  \ | 绘制“ASCII 艺术”。 |\n| `Drgenius` | 两个用于绘制几何图形的相关工具。 |\n| `Dia` | 用于简单图表和图的绘制工具。将文件导出为\
  \ `eps`。 |\n| `Effectv` | 通过各种特殊效果处理电视输入。 |\n| `Electric` | 设计电路、原理图等的图像的系统。 |\n\
  | `Figurine` | 矢量图形编辑器，旨在比 `Xfig` 更容易上手，同时保持与 `Xfig` 文件格式兼容。 |\n| `Findimagedup`\
  \ | 对两个图像文件执行“视觉差异；给定一组文件，它可以找到相似或重复的图像。 |\n| `Gnuplot` | 健壮的非交互式函数绘图工具。从数据文件和公式生成图表和图形。\
  \ |\n| `Innovation3d` | 3d 建模程序。 |\n| `Ivtools` | 绘制编辑器套件，包括矢量图形编辑器 `idraw`。 |\n\
  | `Kali` | 用于绘制图案和铺贴的工具，包括饰边图案以及带有 M.C. 埃尔精神的无限或递归瓷砖。 |\n| `Kino` | 数字视频编辑器，还具有从数字电影摄像机导入的功能。\
