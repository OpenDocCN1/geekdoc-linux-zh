  \ 漂亮打印保存到文件 important-mail 的电子邮件，并带有漂亮的页眉打印到默认打印机，输入：`enscript -G important-mail`\n\
  \n使用特殊的 `--help-pretty-print` 选项列出你拥有的语言。\n\n⇒ 浏览语言列表，输入：`enscript --help-pretty-print\
  \ | less`\n\n### 15.2.5 使用水印输出文本\n\n你可以指定一种*水印*（水印），出现在文本页面上。要实现这一点，将文本作为 `-u` 选项的参数，确保不要在选项和文本之间跳过空格。如果文本超过一个单词，请将其括起来。\n\
  \n⇒ 使用默认的 enscript 格式和“TOP SECRET”水印打印文件 `intelligence.report`，输入：`enscript -u\"\
  TOP SECRET\" intelligence.report`\n\n有许多指定水印属性的选项，如下表所示。\n\n| 选项 | 描述 |\n| :---\
  \ | :--- |\n| --ul-angle= | 指定水印的角度，以度为单位（默认是负高度与宽度的正切）。 |\n| --ul-font= | 指定水印的字体和字号（默认\
  \ 200 点的 Times Roman）。 |\n| --ul-gray= | 指定用于填充水印的灰色值，范围在 0 到 1 之间（默认为 0.8）。 |\n\
  | --ul- | 指定水印的起始位置，使用 PostScript 位置坐标。x 位置由“+”或“-”在前给出，随后是 y 位置，以同样的方式给出（例如，左上角为“+0-0”）。\
  \ |\n| --ul-style= | 指定文本样式，“outline”仅打印字符轮廓（默认值），或“filled”即字符填充灰色。 |\n\n\n\n\n\n\
  *• 要在 PostScript 打印机上带有花式页眉打印文本文件 `saved-mail` 的内容，输入：\n\n```bash\nenscript -G saved-mail\n\
  ```\nRET\n\n*• 要创建一个名为 `saved-mail.ps` 的 PostScript 文件，其中包含文本文件 `saved-mail` 的内容并带有花式页眉，输入：\n\
  \n```bash\nenscript -G -p saved-mail.ps saved-mail\n```\nRET\n\n如果不使用 `-G` 选项，`enscript`\
  \ 将以粗体文本输出带有普通头的文本，打印文件名和最后修改时间。如前文所述，`-B` 选项将省略所有页眉。\n\n# 第 15 章：排版与文字处理 369\n\n\
  你可以通过将你想要使用的文本作为 `-b` 选项的参数并用括起来，来自定义页眉文本。使用特殊符号 `$%` 在页眉文本中指定当前页码。\n\n*⇒* 要带有包含当前页码的自定义页眉标签打印文本文件\
  \ `saved-mail` 的内容，输入（全部写在一行）：\n\n```bash\nenscript -b \"Page $% of the saved email\
  \ archive\" saved-mail\n```\nRET\n\n**注意：** 目前没有选项可以在除第一页以外的所有页面放置页眉，因此，如果你需要以这种常见方式格式文本，请先使用\
  \ `enscript` 输出不带页眉的文件，然后使用 `enscript` 输出另一个*带有*页眉的文件，并使用 `psselect` 将前者的第一页与后者的剩余页面合并（参见食谱\
  \ 20.1.2 [从 PostScript 文件中提取页面]，第 452 页）。\n\n你也可以创建自己的自定义花式页眉——这在 `enscript` 手页的“CUSTOMIZATION（自定义）”部分有描述。\n\
  \n## 15.2.7 输出横向布局的文本\n\n要以*横向*布局输出文本（文本逆时针旋转 90 度），请使用 `-r` 选项。\n\n*⇒* 要将文本文件 `saved-mail`\
  \ 的内容打印到 PostScript 打印机，文本设置为 28 点 Times Roman 字体并横向布局，输入：\n\n```bash\nenscript\
  \ -f \"Times-Roman28\" -r saved-mail\n```\nRET\n\n`-r` 选项对于通过将 `figlet` 工具的输出传递给\
  \ `enscript` 来制作水平横有用（参见食谱 16.4.1 [水平文本字体]，第 401 页）。\n\n*⇒* 要用 `figlet` 字体输出文本“Quite\
  \ a long banner”并将其写入默认打印机，且文本设置为 18 点 Courier 字体并横向布局，输入：\n\n```bash\nfiglet \"\
  Quite a long banner\" | enscript -B -r -f \"Courier18\"\n```\nRET\n\n## 15.2.8 输出垂直切片的文本\n\
  \n当文本超出右边距时，`enscript` 会将其换行到下一行，除非你使用 `-c` 选项指定在右边距处截断。你也可以指定输出哪个垂直区域；这些区域被称为*切片（slices）*，每个切片从页面的左边距延伸到右边距，此时页面的下一个切片开始。使用\
  \ `--slice=`\n\n370\n\n《Linux 烹饪》，第二版\n\n后跟一个数字来指定该切片；切片从 1 开始编号。\n\n*⇒* 要打印文件 `annual-report.txt`\
  \ 的第二个切片，输入：\n\n```bash\nenscript --slice=2 annual-report.txt\n```\nRET\n\n## 15.2.9\
  \ 输出带缩进的文本\n\n要对用 `enscript` 处理的文本进行缩进，将缩进的字符数作为 `-i` 的参数，注意不要在选项及其参数之间留空格。若要指定字符以外的单位，请在数字后跟以下内容之一：“i”表示英寸，“c”表示厘米，或“p”表示\
  \ PostScript 点。\n\n*⇒* 要将文件 `installment.007` 的内容打印到默认打印机，使用 `enscript` 默认设置，并将行缩进半英寸，输入：\n\
  \n```bash\nenscript -i.5i installment.007\n```\nRET\n\n## 15.2.10 输出文本的多个副本\n\n\
  当使用 `enscript` 将文本发送到打印机时，要输出多个副本，请将数字作为 `-#` 选项的参数。\n\n此选项在发送到文件时不起作用，但请注意 `lpr`\
  \ 采用相同的选项（参见食谱 25.1.2 [打印作业的多个副本]，第 510 页）。\n\n*⇒* 要将文本文件 `saved-mail` 的三个副本打印到\
  \ PostScript 打印机并使用默认的 `enscript` 页眉，输入：\n\n```bash\nenscript -#3 saved-mail\n```\n\
  RET\n\n## 15.2.11 分列输出文本\n\n若要指定应分列输出文本，请将列数作为 `-columns=` 选项的参数。\n\n*⇒* 要将文件 `payroll-data`\
  \ 发送到默认打印机，使用默认的 `enscript` 处理，并将每页设置四列文本，输入：\n\n```bash\nenscript -columns=4 payroll-data\n\
  ```\nRET\n\n如果列数为一或二，你也可以直接将数字本身作为选项。使用 `-j` 选项在每列周围绘制边框。\n\n*⇒* 要将文件 `payroll-data`\
  \ 发送到默认打印机，使用默认的 `enscript` 处理，每页设置两列文本，并在每列周围绘制边框，输入：\n\n```bash\nenscript -j -2\
  \ payroll-data\n```\nRET\n\n371\n\n第 15 章：排版与文字处理\n\n**注意：** 你也可以通过 `pr` 将文本分列放置（参见食谱\
  \ 13.3.4 [分列放置文本]，第 314 页）。\n\n## 15.2.12 输出指定页面的文本\n\n要指定输出文本的哪些页，将页码范围作为 `-a`\
  \ 选项的参数。你可以通过数字指定特定页，通过逗号指定页列表，或通过连字符指定起始结束页范围。\n\n*⇒* 要带有默认的 `enscript` 页眉打印 `saved-mail`\
  \ 的第 2 到 10 页，输入：\n\n```bash\nenscript -a2-10 saved-mail\n```\nRET\n\n要打印奇偶数页，使用“odd”和“even”参数。这对于双面打印很有用：首先打印奇数页，然后将输出传回\
  \ `enscript` 并打印偶数页。\n\n*⇒* 有以下两种使用方法：\n\n*• 要带有默认的 `enscript` 页眉打印 `saved-mail`\
  \ 的奇数页，输入：\n\n```bash\nenscript -a odd saved-mail\n```\nRET\n\n*• 要带有默认的 `enscript`\
  \ 页眉打印 `saved-mail` 的偶数页，输入：\n\n```bash\nenscript -a even saved-mail\n```\nRET\n\
  \n## 15.2.13 通过过滤器输出文本\n\n在 `enscript` 将其转换为 PostScript 之前，你可以将输入文本通过外部过滤器。该过滤器可以是工具或命令。将过滤器作为\
  \ `-I` 选项的参数，确保不要在选项及其参数之间留空格。\n\n*⇒* 要将文件 `sensitivity_training` 打印到默认过滤器，使用默认的\
  \ `enscript` 设置，但首先通过 `newspeak` 过滤器传递输入文本，输入：\n\n```bash\nenscript -Innewpeak sensitivity_training\n\
  ```\nRET\n\n372\n\n《Linux 烹饪》，第二版\n\n## 15.3 使用 TEX\n\nteTeX\n\nDEB: tetex-base\n\
  \ntetex-bin\n\ntetex-doc\n\ntetex-extra\n\nRPM: tetex\n\nWWW: http://www.tug.org/teTeX/\n\
  \n在 Linux 系统上最强大的排版工具是 TEX 排版系统及相关软件。它是顶尖的计算机排版系统——其输出超过或媲目前所有其他系统。它执行的高级行段落处理、断字、字间距和其他字体特性策略及算法，其精度是文字处理器无法比拟的。\n\
  \nTEX 系统本身并不是文字处理器或单一程序，而是大量文件和数据的集合——它以发行版的形式封装；teTeX 是为 Linux 设计的 TEX 发行版。\n\n\
  TEX 输入文档是用 TEX 排版语言编写的纯文本文件，TEX 工具可以处理并写入用于打印或查看的输出文件。这种方法对作者有很大好处：纯文本输入文件可以在不同的操作系统或编辑软件之间进行编写和交换，而且这些输入文件不会随着\
  \ TEX 软件版本的更新而失效或无法使用。\n\n\n\n\nDonald E. Knuth 是世界算法领域的顶尖权威，他在 1984 年编写了 `TEX`\
  \ 用来为他的书籍排版，因为他对现有系统的质量并不满意。自首次发布以来，`TEX` 格式语言已经有了许多扩展——其中最著名的是 Leslie Lamport 的\
  \ `LaTEX`，它是一组用 `TEX` 格式语言编写的复杂宏集合，旨在方便结构化文档的排版。这一年也是 Knuth 关于该主题的权威著作《TEX 书》（*The\
  \ TEXbook*）出版的一年，在此之前系统在技术上已经可以运行了——版本 `1.0` 于 1983 年 12 月 3 日发布，该系统的最初设计于 1977\
  \ 年，而第一批使用早期的 `TEX` 排版的书籍已在 1979 年前出版。\n\n3  own 参阅 `http://www-cs-faculty.stanford.edu/~knuth/taocp.html`。\n\
  \n# 第 15 章：排版与文字处理\n\n(`LaTEX` 的日常使用频率可能比纯 `TEX` 格式更高，但在我看来，每种在不同情况下都有用处。）\n\n“TEX”的读音不像牛仔的名字，“LaTEX”的也不像某种油漆：字母“T”、“E”和“X”分别代表希腊字母\
  \ `tau`、`epsilon` 和 `chi`（源自希腊语 `techne`，意为“艺术与科学”）。因此，“TEX”的最后一个音类似于“Bach”的最后一个音，而“LaTEX”根据当地方言，读音为“lay-teck”或“lah-teck”。那些精通使用该系统的人被\
  \ Knuth 称为 `TEXnicians`（TEX 专家）。\n\n`TEX` 及相关程序的集合家族（包括 `Metafont`；见配方 16.5 [使用其他字体工具]，第\
  \ 403 页）有时被称为“TEX 及其朋友”（TEX and friends），它们始终保存在名为 `texmf` 的目录中。例如，基础 `TEX` 系统自带的辅助文件存在\
  \ `/usr/lib/texmf` 目录树中。\n\n以下配方描述了如何开始编写 `TEX` 输入，以及如何处理这些文件以便查看和打印。虽然并不是所有人都想甚至需要用\
  \ `TEX` 和 `LaTEX` 编写文档，这些格式被广泛使用——尤其是在 Linux 系统上——因此每个 Linux 用户都有可能遇到其中某一个文件，并应该知道如何处理它们。\n\
  \n## 15.3.1 区分 TEX 和 LaTEX 文件\n\n处理 `TEX` 和 `LaTEX` 文件有单独的命令，它们不能互换，因此当你想要处理一个 `TEX`\
  \ 或 `LaTEX` 输入文件时，应首先确定其格式。\n\n按照习惯，`TEX` 文件始终具有 `.tex` 文件扩展名。`LaTEX` 输入文件有时使用 `.latex`\
  \ 或 `.ltx` 作为文件扩展名，但并非总是如此——判断一个 `.tex` 文件是否实际上为 `LaTEX` 格式的一种方法是使用 `grep` 在文件中搜索文本\
  \ `\\document`，每个 `LaTEX` 文档（且*非* `TEX` 文档）都会包含这个词。因此，如果搜索输出了任何匹配的行，你就拥有一个 `LaTEX`\
  \ 文件。（在 `grep` 中使用的正则表达式为 `\\\\document`，因为反斜线字符必须用两个反斜线来指定。）\n\n⇒ 要确定文件 `smith.tex`\
  \ 是 `TEX` 还是 `LaTEX` 文件，输入：\n\n```\n$ grep '\\\\document' smith.tex\n```\nRET\n\n\
  `\\documentclass{letter}`\n\n在此示例中，`grep` 返回了匹配项，因此可以安全假设 `smith.tex` 是一个 `LaTEX`\
  \ 文件（属于“letter”文档类）而不是 `TEX` 文件。\n\n**注意：** 关于正则表达式和使用 `grep` 搜索的更多信息，请参阅配方 14.3\
  \ [正则表达式——匹配文本模式]，第 335 页。\n\n## 15.3.2 处理 TEX 文件\n\n使用 `tex` 来处理 `TEX` 文件。它接受要处理的\
  \ `TEX` 源文件名称作为参数，并写入一个 `dvi`（设备无关）格式的输出文件，该文件的基础文件名与源文件相同，但扩展名为 `.dvi`。\n\n⇒ 要处理文件\
  \ `gentle.tex`，输入：\n\n```bash\n$ tex gentle.tex\n```\nRET\n\n一旦你通过这种方法生成了 `dvi`\
  \ 输出文件，你就可以对其进行任何任何操作：\n\n• 使用 `xdvi` 在屏幕上预览它；见配方 17.4.1 [预览 dvi 文件]，第 413 页。\n\
  • 使用 `dvips` 或 `lpr` 打印它；见配方 25.2.5 [打印 dvi 文件]，第 515 页。\n• 使用 `dvips` 将其转换为 PostScript；见配方\
  \ 25.3.2 [为打印准备 dvi 文件]，第 520 页；然后，你还可以将 PostScript 输出转换为 pdf 或纯文本。\n\n## 15.3.3\
  \ 处理 LaTEX 文件\n\n`latex` 工具的工作原理与 `tex` 相同，但它用于处理 `LaTEX` 文件。\n\n⇒ 要处理 `LaTEX` 文件\
  \ `lshort.tex`，输入：\n\n```bash\n$ latex lshort.tex\n```\nRET\n\n此命令写入一个名为 `lshort.dvi`\
  \ 的 `dvi` 输出文件。\n\n你可能需要连续对一个文件运行多次 `latex`。`LaTEX` 文档有时包含索引和交叉引用由于 `LaTEX` 的工作方式，有时需要运行\
  \ `latex` 两次或更多才能生成正确的结果。为了确保 `lshort.tex` 中的所有交叉引用已生成，再次通过 `latex` 文件：\n\n```bash\n\
  $ latex lshort.tex\n```\nRET\n\n`lshort.dvi` 文件将带有正确的页码和索引条目。你可以查看它。\n\n## 15.3.4\
  \ 入门 TEX 和 LaTEX\n\n要用 `TEX` 或 `LaTEX` 创建文档，你通常使用你喜欢的文本编辑器编写包含文本的*输入文件*。然后，处理该 `TEX`\
  \ 或 `LaTEX` 输入文件以创建 `dvi` 格式的*输出文件*，你可以预览、转换或打印它。\n\n编程界有一个传统是用一个简单的程序在屏幕上输出“Hello\
  \ world”来介绍编程语言；这样的程序对于不熟悉该语言的人来说足够详细了。\n\n我们可以用 `TEX` 和 `LaTEX` 等文档处理语言这样做。图 15-1\
  \ 包含了 `TEX` 文档的“Hello world”。\n\n```tex\nHello, world\n```\n*图 15-1. TEX Hello world。*\n\
  \n如果你用 `tex` 处理图 15-1 所示的输入文件，它将输出一个以默认 `TEX` 字体、默认页面大小和默认页边距显示“Hello world”的 `dvi`\
  \ 文件。图 15-2 包含了相同的“Hello world”，但是是针对 `LaTEX` 的。\n\n```latex\n\\documentclass{article}\n\
  \\begin{document}\nHello, world\n\\end{document}\n```\n*图 15-2. LaTEX Hello world。*\n\
  \n尽管 15-1 中的 `TEX` 示例比 `LaTEX` 示例简单得多，但 `LaTEX` 通常更便于“开箱即用”地编写某些类型的结构化文档——例如信函和文章——因为它带有了预定义的*文档类*，这些类控制文档包含的结构元素的标记。相比之下，纯\
  \ `TEX` 更适合非正式的出版项目，包括自定义布局和特殊文档。\n\n`TEX` 和 `LaTEX` 标记语言各值得写一本书，介绍它们的使用方法完全超出了本文的范围。为了学习如何为它们编写输入，我建议参考两个入门教程：Michael\
  \ Doob 的《TEX 快速入门》（A Gentle Introduction to TEX）和 Tobias Oetiker 的《LaTeX 简短介绍》（The\
  \ Not So Short Introduction to LaTeX）。这两本书都可以在附录 D [进一步感兴趣的参考文献]，第 731 页列出的 URL\
  \ 上找到。这些教程都是以它们描述的格式提供的；为了阅读它们，你必须按照之前的两个配方所述对其进行*处理*。\n\n在许多 Linux 系统上，可以找到安装良好的\
  \ html 格式 `LaTEX` 文档，位于 `/usr/share/texmf/doc/latex/latex2e-html/` 目录；随意浏览这些文件（见配方\
  \ 5.10 [浏览文件和目录]，第 157 页）。\n\n\n\n\n\n其他一些排版系统，如 LyX、Linuxdoc-Tools 和 Texinfo（本章的其他部分均有描述），也会编写\
  \ TEX 或 LaTEX 输出——因此你可以使用这些系统来生成上述输出，而无需实际学习 TEX 和 LaTEX 输入格式。（本书使用 Texinfo 格式在\
  \ Emacs 中编写，排版输出随后由 TEX 生成。）**注意：** Oetiker 的文本由 `lshort` 目录中的几个单独的 LaTEX 文件组成；请下载并保存所有文件。\n\
  \n## 15.3.5 使用 TEX 和 LaTEX 文档模板\n\n### TEX 和 LaTEX 模板\n\nWWW: `http://dsl.org/comp/templates/`\n\
  \n在上述列出的 URL 可以找到一组用于用 TEX 和 LaTEX 排版某些类型文档的示例模板。这些模板包括创建信件和信函、文章和学期论文、信封和邮寄标签以及传真封面的模板。如果你有兴趣使用\
  \ TEX 和 LaTEX 生成排版输出，这些模板非常值得探索。\n\n4 LyX 本质上是 LaTEX 的图形前端，它使用了这些相同的文档类。\n\n5 此外，通常在\
  \ `/usr/share/texmf/tex/latex/labels/` 下安装了用于打印多种类型运输和包装标签的高级 LaTEX 样式。\n\n第 15\
  \ 章：排版与文字处理 377\n\n使用模板编写文档，是将模板文件的内容插入到具有 `.tex` 或 `.ltx` 扩展的新文件中，并通过对该文件的修改来编写你的文档。（使用你喜欢的文本编辑器执行此操作。）为了确保你不会意外覆盖实际模板文件，可以对其进行写保护（参见\
  \ Recipe 6.3.3 [保护文件]，第 169 页）：\n\n```\n$ chmod a-w template-file-names\n```\n\n\
  回车\n\n在模板本身中，括号内的大写文本解释了那里应该属于什么类型的内容；用你自己的文本填充这些行，并删除不需要的行。然后，根据情况使用 `latex` 或\
  \ `tex` 处理你的新文件，你就得到了一份精美的文档！\n\n下表列出了 TEX 模板的文件名，并描述了它们的用途。使用 `tex` 处理你用这些模板创建的文件（请参见前面的配方）。\n\
