  \n## 1.7 Linux 的背景和历史\n\n为了理解 Linux 到底是什么，了解它是如何开始的会有帮助——Linux 的历史可以追溯到 1991 年之前，当时\
  \ Linus Torvalds 著名的开始编写他的免费操作系统。以下是历史概述，提供了本书所涉及软件的简要背景。你可以在附录 D [`References For\
  \ Further Interest`，第 731 页] 列出的书籍中找到关于该主题的更多信息。\n\n这段历史可能解释了 unix 的长寿，以及为什么它在未来可能以某种形式存在——今天作为\
  \ Linux，明天可能是其他东西。\n\n### 1.7.1 unix 的早期\n\nunix 是 Linux 的原始祖先，是一个 `operating system`。3。或者说它\
  \ `曾经`是一个操作系统；被称为 `unix` 本身的原始系统并不是我们今天所认识和使用的“unix”；现在有许多“口味”的 unix，其中 Linux 已成为最受欢迎的一种。\n\
  \nunix 是 20 世纪 60 年代的产物，及其相关软件是由 Dennis Ritchie、Ken Thompson、Brian W. Kernighan\
  \ 和其他黑客 4 于 1969 年在贝尔实验室发明的；它的名字是 multics 的双关语，那是当时的另一种操作系统。5。\n\n在 unix 早期，任何拥有运行它的硬件的感兴趣的方都可以以极低的费用从贝尔实验室获得软件磁带以及打印版的手册。（这在个人电脑时代之前，在实践中，主要是大学和研究实验室这样做。）本地站点可以使用软件的\
  \ `source code`（构成软件的指令）3 计算机运行所需的套基本软件工具集，以便你成功地操作任何内容，包括运行其他程序的方法。\n\n4 虽然 `hacker`\
  \ 一词已演变为指计算机破坏者或入侵者，但最初的计算机含义是指在编程中发现痴迷快乐的计算机程序员或技术人员，因此在编程方面熟练或富有发明性。\n\n5 unix\
  \ 的名字最初写作 unics，代表“Uniplex Information and Computing System”（统一信息与计算系统）。\n\n16\n\
  《Linux 食谱》，第 2 版\n软件本身（用人类可读的语言编写），6 并根据他们的喜好扩展和定制软件。\n\n从 20 世纪 70 年代末，加州大学伯克利分区的计算机科学家作为\
  \ unix 源代码的许可者，在研究过程中对 unix 进行了自己的改进和增强，这些改进包括了 tcp/ip 网络的发展。他们的工作被称为 bsd (“伯克利系统发行版”)\
  \ 口味的的 unix。\n\n他们工作的源代码根据许可公开，允许带或不带源代码进行重新分发，只要对伯克利做出贡献。现在有许多仍在开发的 bsd 现代变体，其中一些如\
  \ netbsd、openbsd 和 Apple 的 Mac OS X——可以在个人电脑上运行。\n\n### 1.7.2 自由软件运动的起源\n\n随着时间的推移，unix\
  \ 的流行程度增加。但在 at&t 于 1984 年剥离后，贝尔实验室提供的源代码磁带变成了一个专有商业产品的基础：at&t unix。大写的单词 unix 变成了\
  \ at&t 的商标（后转让给其他组织），用于识别其特定的操作系统。7 它价格昂贵，并且没有附带显示工作原理并让你能够修复、扩展或改进的源代码。即使你额外付费购买了源代码副本，你也无法与程序员同事分享你所做的任何改进、修复或发现。\n\
  \n20 世纪 80 年代初，营利性专有软件开发正迅速成为常规——即使在大学里也是如此。软件源代码不再被视为供受过教育的公众的技术文献，但这些文字作品现在被保密和隐藏，并在它们的编译形式下被装在盒子里作为专有商业产品出售。\n\
  \n6 为了让计算机利用这些文字作品，必须通过 `compiler` 编译器运行源代码，编译器是一种使用这些文字输出新机器指令文件的程序。处于编译形式的、人类不可读的软件程序被称为\
  \ `binary` 或 `executable` 文件。二进制文件就是你在系统上运行程序时使用的文件。\n\n7 但今天，当人们说“unix”时，他们通常指的是“类\
  \ unix 操作系统”，这是一个包含 Linux 的泛指概念。\n\n第 1 章：引言\n17\n\n\n\n\n\n1984 年，在马萨诸塞州剑桥的马萨诸塞理工学院期间，黑客理查·斯尔曼（Richard\
  \ Stallman）看到他的同事们逐渐转向这种专有开发模型。但他无法接受这种专有主义所提供的文明：不与同伴分享你的发现，不允许任何人查看已发布作品的“内部结构”以理解它或在其基础上进行构建，更谈不上通用的进步。人们甚至无法改进或扩展自己拥有的此类作品副本，也无法从其他程序员的著作中获得见解。专有模型意味着计算机软件作为文学的终结。\n\
  \n斯尔曼并没有遵循大多数计算领域所采取的方向，而是决定启动一个项目，从零开始构建并组合一个新的类 `unix` 操作系统，并以书面（源代码）的形式将其发布。\n\
  \n这就是 `gnu` 项目，它的名称代表了它本身（`gnu’s not unix`，即“不是 unix”）。⁸\n\n斯尔曼必须设计一种发布这些著作的方法，以便他人可以使用它们来推进源代码文学的发展，但又不能让任何人将其作为软件“产品”的秘密指令。他不能将它们放入公有领域，因为那样他将放弃版权法赋予的所有权利，并且无法阻止其他人在保持保密的产品中使用这些源代码。\n\
  \n许可机制的开发是作为一种明确赋予每个人复制、分发和修改其作品副本的权利的方法，尽管须遵守某些严格的条款和条件。对于 `gnu` 项目，斯尔曼设计了通用公共许可证，或称\
  \ `gnu gpl`，⁹。它通过法律手段形式化了 `unix` 早期一种常见的、不言而明的惯例：通俗称为 `copyleft`（反向拷贝），它允许任何人复制、分发或修改经此类许可的作品，前提是所有副本都必须以相同的许可发布，并且所有更改都经过记录。即使在今天，它也是所有此类许可中使用最为广泛的。\n\
  \n这种软件被称为`自由软件`。斯尔曼成立了自由软件基金会（`fsf`）——一家非营利机构，以推进这一理念和他的 `gnu` 项目。`fsf` 在开发过程中还提供了\
  \ `gnu` 软件的副本供出售；个人和公司可以为自由软件作品的副本付费，但绝没有任何秘密著作——对于自由软件，任何人都可以阅读源代码。\n\n⁹ 最初在 1985\
  \ 年发布时称为“Emacs 公共许可证”；目前的 `gnu gpl` 位于 `http://www.gnu.org/copyleft/gpl.txt`。\n\n\
  # 第 1 章：引言\n(第 19 页)\n\n《Linux Linux 常指南》，第 2 版\n\n### 1.7.3 Linux 的到来\n\n20 世纪\
  \ 90 年代初，新一代人发现了规模小但蓬勃发展的自由软件运动。芬兰计算机科学学生林纳斯·托瓦尔斯（Linus Torvalds）开始对 `Minix` 进行破解，这是一种当时在大学操作系统课程中使用的微型类\
  \ `unix` 操作系统.¹⁰。他决定通过编写自己的代码来改进 `Minix` 底层的主要软件组件，即 `kernel`（内核）。（`kernel` 是任何类\
  \ `unix` 操作系统的核心组件。）\n\n1991 年底，托瓦尔斯在互联网上发布了该 `kernel` 的第一个版本，并将其命名为“Linux”，这是对\
  \ `Minix` 和他自己名字的双关。¹¹\n\n当托瓦尔斯发布 Linux 时，他使用了自由软件基金会发布的副本软件许可证——`gnu gpl`。托瓦尔斯还邀请了其他程序员的贡献，这些贡献起初缓慢，但随着互联网的增长，来自全球的成千上万黑客和程序员为他的自由软件项目做出了贡献。\n\
  \n这开启了一个令人兴奋的开发时期，Linux 在整个 90 年代成为了计算世界的*焦点话题*；技术媒体最初忽视了它，而老兵们则说，自从多年前 PC 革命开始以来，从未见过这样的东西——它给了每个人一个工作的机会，一个为公共利益做出贡献的机会。换句话说，正如许多观察者所言，它让计算再次变得*有趣*了！\n\
  \n但尽管在此期间 Linux 的声誉不断高涨，但某些 `unix` 成员和其他怀疑论者并不总是认真对待它。这在某种程度上是因为 Linux 运行在带有现成组件的家用电脑上，而\
  \ `unix` 像任何“严肃”的操作系统一样，运行在普通人无法触及的小型计算机和强大机器上。\n\n另一个可能是，作为一种“官方”的 `unix`，Linux\
  \ 还没有完全到位。`posix`（一个注册商标，发音为“pahz-icks”）是 `ieee` 发布的标准，¹²，为基础 `unix` 操作系统应该具备的特性和功能提供了规范。\n\
  \n¹¹ 然而，这并不是原始名称。托瓦尔斯最初将其命名为 `freax`，代表“‘free’ + ‘freak’ + 强制性的‘-x’”；虽然 90 年代正正迅速成为“怪异”的亚文化中心（至少在时尚方面），但更多人似乎青睐“Linux”，这个名字就留了下来。\n\
  \n¹² 电气电气工程师协会（IEEE），尽管大家都只使用缩写，发音为“I triple E”。\n\n当 Linux 开始满足这些技术规范，并且当它最终符合\
  \ `posix` 标准时，Linux 作为一种可行的 unix 版本的有效性是不容否疑的，它在曾存在明显阻力的领域获得了认可。通过这短短几年的开发，Linux\
  \ 软件得到了巨大的扩展和改进，使得如今基于 Linux 的系统是一个完整的现代操作系统。\n\n### 1.7.4 Debian、Red Hat 以及其他 Linux\
  \ 发行版 有大量的发行版，尽管只有六个占据了所有 Linux 系统的大部分：`Debian gnu/Linux`、`Fedora Linux`、`Mandrakelinux`、`Red\
  \ Hat Enterprise Linux`、`Slackware Linux` 和 `SuSE`。因此，当人们提到 Debian、Fedora、Mandra、Red\
  \ Hat、Slackware、SuSE 等 Linux 时，他们指的是由这些公司或组织组装并封装的 Linux*发行版*。这些发行版的核心是相同的——都是 Linux\
  \ 内核、`gnu` 项目软件以及许多自由软件包——但每个发行版都有自己的软件包方案、默认设置和配置方法。除非另有说明，书中的方案适用于 Linux，不依赖于特定的发行版。\n\
  \n今天所有主要的发行版都有良好的声誉，在使用其中任何一个都不会遇到严重问题。每个发行版都有自己的忠实者和支持者，而有些 Linux 用户喜欢在不同的发行版之间切换，尝试所有的版本。\n\
  \n\n\n\n\n在众多发行版中，Debian 具有值得关注的特殊品质。它是唯一一个由志愿者按照 Linux 内核及大多数其他自由软件相同的开放方式进行设计和构建的发行版。它也非常健壮（标准的\
  \ Debian cd-rom 集合包含了比其他任何版本都多的软件，多达 2500 个不同的软件包），并且在设计上完全致力于自由软件（是的，确实有些发行版并非如此）。在\
  \ Debian 早期，它被称为“黑客的发行版”，因为对于 Linux 新手 13 来说，安装和管理它可能非常困难。然而，这种情况已经改变了。\n\n### 1.7.5\
  \ 企鹅\n\n你一定在广告和网络各处见过“Linux 企鹅”。Larry Ewing 绘制的企鹅（使用自由软件图像编辑器 gimp 制作）已成为任何出现 Linux\
  \ 的地方必不可见的标志，它是“官方”的 Linux 吉祥物。是的，它有一个名字：Tux。\n\n现在存在许多该标准图的变体。\n\nLinus Torvalds\
  \ 最喜欢的版本现在直接随 Linux 内核源代码一起分发，所以如果你的系统安装了 Linux 源代码（它保存在 `/usr/src/linux`），你就可以在\
  \ `/usr/src/linux/Documentation/logo.gif` 看到它的副本；它看起来就像图 1-1。\n\n*图 1-1。Tux。*\n\n\
  虽然它似乎一直是 Linux 的一部分，但 Tux 直到 1994 年左右才出现。在 Linux 早期，风暴燕是一个流行的吉祥物，由 Peter Williams\
  \ 绘制。这幅插图展示了飞行中的风暴燕，从视角看，它的左翼似乎抬起，右翼与视角锐平行，因此它的身体形成了一个 L 形。14。\n\n### 1.7.6 开源、自由内容与未来\n\
  \n`open source` 一词最早由一些自由软件支持者于 1998 年引入，作为自由软件的营销术语。他们认为，某些人 13（新手的俚语，源自学校里的英语“new\
  \ boy”）——不熟悉自由软件运动的人，特别是突然对该软件投入的十多年工作产生兴趣的某些大型公司高管——可能会被“free”（免费）这个词吓跑。他们担心这些行业决策者可能会将自由软件与无关的概念混淆，例如\
  \ `freeware`（免费软件，指仅以可执行形式免费提供的软件）。15。开源倡议（`osi`）的成立是为了促进符合其公共“开源定义”的软件，而该定义又源于“Debian\
  \ 自由软件指南”（`dfsg`），该指南最初由 Bruce Perens 编写，作为 Debian 的一套软件包含准则。所有自由软件——包括根据 `gnu`\
  \ 通用公共许可证条款发布的软件——都符合这一定义。\n\n但一些自由软件支持者和组织（包括自由软件基金会）对“开源”一词表示严厉批评，认为它掩盖了这一运动中“自由”的重要性。\n\
  \n然而，即使是“自由软件”现在也太局限了，因为“运动”本身的范围就是一个争议和辩论的来源。早在 1994 年，我就指出创建一个完整且可运行的操作系统不仅需要计算机程序源代码（还需要非软件元素，如文档、图形图标、音频样本和数据库），随后形成了一些小组，用以推进特定类型非软件作品（如流行音乐的音频录音）的自由复制和修改。\n\
  \n随后，包括“开放内容”和“自由内容”在内的新术语流行起来，以区分这些新作品与自由软件。最终，甚至软件组织也开始承认非软件作品在实现其设定目标方面的作用，一些组织认可其他类型的作品（如软件文档）理获得自由许可。\n\
  \n今天，在网络上自出版的大量业余“自由”或“开放”作品泛滥，表明许多人显然想要分享——但结果可能并不是他们所预期的。由于有许多种许可证和冲突的“自由”发布方法，这些作品仍然互不兼容，被困在各自独立的公有地中。\n\
  \n其他问题和担忧也随之而来：许可证制定者的目标并不总是与使用此类许可证的出版者的目标一致；当然，15 “自由软件”的承诺并不意味着那种意思，“free”一直指的是用户阅读和使用软件源代码的\
  \ `freedom`（自由），而不是他获取它时支付的价格；“free”会引导普通用户和业余出版者轻率地违反许可证条款和条件；执行非常困难，甚至不可能；援助是无从的，因为这种实践发生在传统出版之外；对于不同的作品，什么构成开放“源”存在很大争议；而且，虽然互联网上作品的可用性通常是跨国的，但不清楚国际法或主权国家的法律是否适用于这些许可作品及其副本和衍生品。\n\
  \n### 1.7.7 unix 与工具哲学\n\n`unix` 操作系统生存了三十多年这一事实应该告诉我们关于其设计考量的胆量。这些考量之一——也许是它最人喜爱的之一——是“工具”哲学。对这一哲学的简要讨论将有助于明确作为“食谱”的角色。我将向你展示如何使用工具在\
  \ Linux 上运行命令，以及为系统执行指定命令是一种什么样的语言。\n\n大多数操作系统的设计都有文件概念，并带有一组实用程序来处理这些文件，然后将有趣的工作交给大型应用程序：文字处理器、电子表格软件、演示文稿设计器、Web\
  \ 浏览器。（当其中几个应用程序识别彼此的文件格式或共享共同接口时，这组应用程序被称为“套件”。）\n\n这些单体应用程序中的每一个可能都有一个 `open file`\
  \ 命令来从磁盘读取文件并在应用程序中打开；大多数它们还带有搜索和替换文本、检查拼写、打印当前文档等命令。处理所有这些任务的程序代码必须包含在每个应用程序内部——在内存和磁盘上都占据了额外空间。这是反\
  \ unix 的方法。在专有软件的情况下，所有的实际程序源代码对公众隐藏——所以其他程序员无法使用、构建或学习其中的任何内容。这种闭源软件向世界展示就像魔术：如果你购买了程序的副本，你可以*使用*它，但你永远无法得知程序实际上是如何*工作*的。16。\n\
  \n\n\n\n结果是，在所有这些不同的应用程序中，处理本质上相同功能的代码必须由程序员从零开始、每次独立且独立于他人进行开发——因此，整个社会的进展都被滞后了，因为程序员为了低效地重复发明所有相同的软件功能以执行相同的任务，浪费了无数的人工时和精力和。\n\
  \n类 Unix 操作系统并不那么看重应用程序。相反，它们配备了许多称为 `tools`（工具）的小型程序。每个工具通常都能执行一个非常简单、特定的任务，并且执行良好——一个工具只负责输出传递给它的文件或数据，一个工具将其输入缓冲到打印队列中，一个工具对其输入行进行排序，以此此类推。\n\
  \n围绕特定领域或概念设计的工具集，在较旧的 Unix 系统中被称为“工作台”（workbenches）——例如，用于检查文本拼写、写作风格和语法的工具是“写作者工作台”（Writer’s\
  \ Workbench）软件包的一部分（参见食谱 11.3 [检查语法]，第 286 页）。虽然“工作台”的理念通常不再是今天基于 Unix 系统的术语，但工具集通常以\
  \ `toolkits`（工具包）的形式发布，且 GNU 项目仍然根据某些通用主题（如“gnu text utilities”和“gnu file utilities”）发布工具集。随着基于\
  \ Linux 的系统日益普及，为了满足新需求而发明的新工具和应用程序日益增加；在编写本文时，我的 Linux 系统中两个主要程序目录 `/bin` 和 `/usr/bin`\
  \ 总共有 1,631 个工具和应用程序。\n\nUnix 早期的一项重要进展是“管道”（pipes）的发明，这是将一个工具的输出传递给另一个工具输入的方法。通过了解单个工具的作用以及它们如何组合，用户现在可以构建出强大的命令“链”。\n\
  \n就像铬镍钢的拉伸强度大于其组件增加的强度一样，多个工具可以组合起来执行一个单个工具功能无法预测的任务。这就是 `synergy`（协同）的概念，它构成了 Unix\
  \ 工具哲学的基础。\n\n这里有一个使用两个工具的示例。第一个工具称为 `who` 输出当前登录到系统的所有用户列表（参见食谱 2.6.2 [列出系统中的用户]，第\
  \ 39 页）。第二个工具称为 `wc`，代表“word count”（单词计数）；它输出你提供的输入的单词数（或行数或字符数）（参见食谱 12.1 [计数文本]，第\
  \ 293 页）。\n\n通过结合这两个工具，将 `who` 的输出交给 `wc` 命令，你可以构建一个新的命令来列出当前系统中的用户数量，如图 1-2 所示。\n\
  \n```\n$ who | wc -l\n```\n*图 1-2。列出系统中的用户数量。*\n\n`who` 的输出（当前系统中所有用户的列表）通过竖线 `|`\
  \ 指定的“管道”到 `wc` 的输入，`wc` 通过使用 `-l` 选项输出输入的 `lines`（行数）。\n\n在这个示例中，输出了数字 4，表示当前有四个用户登录到系统。\n\
  \n拼写检查工具出现之前的另一个著名的管道如图 1-3 所示。\n\n```\n$ tr -cs A-Za-z '\\012' | tr A-Z a-z | sort\
  \ -u | comm -23 - /usr/dict/words\n```\n*图 1-3。一个早期的拼写检查器。*\n\n该命令（全部写在一行中）使用 `tr`、`sort`\
  \ 和 `comm` 工具来制作拼写检查器——在你输入此命令后，你输入的文本行（直到你中断它）会通过两次 `tr` 调用转换为单列小写单词列表，然后按字母顺序排序并剔除所有重复项，最后生成的列表将与\
  \ `/usr/dict/words` 进行比较，后者是系统的“字典”，是一个按字母顺序排列的拼写正确的单词列表（参见食谱 11.1 [拼写检查]，第 275\
  \ 页）。\n\n本书的大部分内容详细介绍了你可以运行的各种工具组合，以获得各种常见任务所需的。。某些任务需要一个一个命令序列；另一些任务则需要通过大型应用程序进行精细、复杂的动作。你会发现，通常有一个工具或命令序列可以完美适用于给定任务，但有时通过不同工具的不同组合，也可以获得满意的甚至相同的结果——特别是在\
  \ Unix 专家手中。\n\n事实上，根据克林顿总统于 1998 年 10 月 28 日签署成为法律的《数字千年版权法》（dmca），你即使是尝试（这种行为）也是联邦犯罪。\n\
  \n---\n# 第 1 章：引言\n\n# 第 2 章：每个 Linux 用户都知道的\n\n## 2. 每个 Linux 用户都知道的\n\n本章涉及每个\
  \ Linux 用户都知道的概念和命令——如何启动和停止系统、登录和注销系统、更改密码、查看系统正在发生什么以及使用系统帮助。掌握这些基本概念对于在任何程度上成功使用\
  \ Linux 至关重要。\n\n这些食谱中的一些引用文件和目录；这些概念在第 5 章 [文件和目录]，第 125 页中进行了解释。\n\n### 2.1 控制系统电源\n\
  \n这些食谱展示了如何启动和停止系统电源——如何开启和关闭。这不仅仅是按下电脑箱上的按钮；特别是，关闭系统有一个正确的方法，错误操作可能会导致丢失工作。\n\n\
  #### 2.1.1 启动系统\n\n开始使用系统的第一件事是为系统供电。启动系统只需将其开启。这被称为系统引导 `booting`（有时称为 `booting\
  \ up`）。\n\n当 Linux 内核引导时，屏幕上会出现许多消息。过一会儿，系统将显示登录 提示符。现在可以登录了。参见食谱 2.2.1 [登录系统]，第\
  \ 29 页。\n\n某些系统配置为启动时启动 xdm（参见食谱 4.1.1 [启动 X]，第 98 页）。如果你的系统是这样配置的，你看到的不是登录提示符，而是一个图形界面，中间有一个包含登录和密码提示符的框。输入\
  \ `CTRL-ALT-F1` 切换到第一个虚拟控制台，可以在那里以通常的方式登录系统（参见食谱 2.3 [使用控制台和终端]，第 32 页）。\n\n\n\n\
  \n当你用完电脑时，不能直接拨电源开关，因为 Linux 正在不断向磁盘写入数据。（它也会在内存中保留数据，即使这些数据看起来已经写入了磁盘。）简单地关闭电源可能会导致你的部分工作丢失或损坏。\n\
  \n系统管理员可以使用特殊的关机工具来关闭计算机，详见第 703 页的配方 A.2 关闭系统。\n\n但你始终可以从控制台关闭系统，无论你是否登录，只需使用特殊的\
  \ `CTRL``-`ALT``-`DEL` 组合键即可（该键也称为“三指山”，是沿自 DOS 时代的习惯）。此组合键会立即启动启动程序，然后重启系统。如果你在系统重启之前切断电源，就可以以此方式关闭它。\n\
  \n⇒ 即使你没有以管理员身份登录，要关闭单个用户系统，也输入 `CTRL``-`ALT``-`DEL`（同时按住这三个键）。\n\n当你执行此操作时，系统会在关机时向屏幕显示一些消息；当你看到“Rebooting...（正在重启……）”这一行时，就可以安全地拨掉电源开关了。\n\
  \n**注意：** 看到这条消息后你不应该等太久；如果置之不理，系统将重启，你就会回到起点！\n\n## 2.2 使用你的账户\n\nLinux 是一个多用户系统，这意味着许多用户可以从不同的终端同时使用一个\
  \ Linux 系统。因此，为了避免混淆（并保持某种程度的隐私），每个用户的工作空间必须与他人保持分离。\n\n即使特定的 Linux 系统是一台没有物理连接到它的其他终端的独立个人电脑，它也可以在不同时间由不同的人共享，因此用户工作空间的分离仍然是一个有效的问题。\n\
  \n这种分离通过为每个用户提供一个系统账户来实现。你需要一个账户才能使用系统；有了账户后，系统会为你分配一个供使用的个人工作空间，以及一个让系统和其他用户识别你身份的唯一用户名。用户名就是系统（以及使用该系统的人）永远用来称呼你的名字；它是一个单词，全部由小写字母。\n\
  \n在安装过程中，系统管理员应该已经为你创建了一个账户。（系统管理员有一个特殊的账户 1 如果你的键盘有两个 ALT 和 CTRL 键，请使用这些键的左侧一组，其名为\
  \ `root`；此账户对整个系统拥有完全访问权限，因此通常被称为超级用户。）\n\n在 20 世纪 90 年代中期，用户名使用名字的首字母加上整个姓氏、总共最多\
  \ 12 个字符是非常常见的。例如，根据这一惯例，用户 George Washington 的用户名将是 `gwashington`；然而，这不是一个硬性规定，特别是在你可能是唯一用户的家用级系统上。有时会加上中间名字的首字母（“usgrant”），有时甚至会使用昵称或缩写（“gipper”或“jfk.”）。但无论你为自己选择什么用户名，请确保它是你能接受的，并且你能够忍受系统和其他用户这样称呼（你的用户名也将成为你电子邮件地址的一部分，正如你将在第\
  \ 32 章 电子邮件 第 611 页看到样）。\n\n除了用户名，你还应该有一个可以自己保密的密码，这样只有你本人才能使用你的账户。良好的密码是别人可能猜不到的文本字符串（即：不是像“secret”这样明显的词，或者像“Ruski”（如果你的猫恰好叫这个）这样的标识性名称）。一个良好的密码是对你来说容易记忆，至于你不需要写下来，但在结构上又足够复杂，以至于别人永远猜不到。例如，对于一个第一次约会是看阿尔弗雷德·希区柯克导演的电影《39\
  \ 步》的人来说，“t39sAH”可能是一个不错的密码。\n\n**注意：** 用户名始终全小写，但密码是区分大小写的；密码“Secret”、“secret”、“SECReT”和“SECRET”均被视为不同的。\n\
  \n### 2.2.1 登录系统\n\n要在 Linux 系统上开启会话，你需要登录。在终端的 `login:` 提示符处输入你的用户名，然后在提示时输入你的密码。一旦输入了用户名和密码，你就登录了系统。然后你可以使用该系统并运行命令。\n\
  \n典型的 `login:` 提示符如图 2-1 所示。\n\n```\nDebian GNU/Linux 3.0 bardo tty1\nbardo login:\n\
  ```\n*图 2-1。典型的 Linux 登录提示符。*\n\n`login:` 提示符会在系统启动后出现在终端。如果你的系统配置为在启动时启动 X 窗口系统，你将看到\
  \ X 登录界面而不是标准的登录提示符。如果发生这种情况，按下 `CTRL``-`ALT``-`F1` 切换到文本登录界面；这在第 32 页的配方 2.3 使用控制台和终端\
  \ 中有进一步解释。\n\n登录系统时，在 `login:` 提示符处输入用户名（后按 `RET`），然后在提示时输入密码（同样按 `RET`）。出于安全起见，在你输入密码时屏幕上不会显示任何内容；要用用户名“kurt”和密码“empathy”登录系统，输入：\n\
  \n```\nDebian GNU/Linux 3.0 bardo tty1\nbardo login: kurt\nRET\nPassword: empathy\n\
  RET\nLinux bardo 2.4.18 #1 Sat 6 16:05:52 EST 2003 i686 unknown\nLast login: Tue\
  \ Apr 5 12:03:47 on tty1.\nNo mail.\n~ $\n```\n如果你输入错误，输入 `U`。\n\n系统立即显示 `/etc/motd`\
  \ 文件（今日消息）的内容。系统随后显示上次登录的时间和日期，并报告你是否有邮件待收（参见第 611 页第 32 章 电子邮件 中解释。\n\n**注意：**\
  \ 每个 Linux 系统都有自己的名称，称为系统主机名；Linux 系统有时被称为主机，它在 `login:` 提示符处用其主机名识别自己。为系统命名很重要；就像用户账户的用户名一样，主机名为你使用的系统提供一个名称（当系统接入网络时，这变得尤为重要）。系统管理员通常在初始配置时为系统命名（主机名可以随时更改；其名称存储在\
  \ `/etc/hostname` 文件中）。\n\n\n\n\n\n和用户名一样，主机名（hostname）也是全小写的单个单词。人们通常给自己的系统起一个自己喜欢的名字，例如\
  \ `darkstar` 或 `shiva`。在前面的示例中，“bardo”是这个特定 Linux 系统的主机名，它正好运行着 Debian 发行版。\n\n\
  你所连接的终端名称显示在主机名之后。在这个示例中，终端是 `tty1`，这意味着这是该系统上的第一个终端。（顺便提一下，“tty”是“teletype”（电字机）的缩写，历史上大多数基于\
  \ Unix 的系统默认使用的那种终端硬件。）\n\n### 2.2.2 退出系统\n\n退出系统可以释放你正在使用的终端，并确保没有人从该终端访问你的账户。\n\
  \n要结束系统会话，请在 shell 提示符处输入 `logout`。此命令将你注销系统，终端上会出现一个新的登录提示。\n\n与输入 `logout` 命令同样有效的方法是直接输入\
  \ `CTRL-*-D`（按住 `CTRL` 并按 `D`）。你甚至不需要再输入 `RET`。许多用户更喜欢这种快速快捷键。\n\n*⇒* 要退出系统，请输入：\n\
  \n```bash\n$ logout\nRET\nDebian GNU/Linux 3.0 bardo tty1\nbardo login:\n```\n\n\
  **注意：** 如果你是该系统的唯一使用者，并且刚刚通过注销结束了会话，你可能想要关闭系统。请参见本章前面的食谱 2.1.2 [关闭系统]，第 27 页。\n\n\
  ### 2.3 使用控制台和终端\n\nLinux *终端*（terminal）是一种用于向系统输入并从系统获取输出的设备。它可以是带有键盘和显示器的物理设备，通过网络或串口线连接到系统；也可以是运行在计算机上模拟此类终端的软件程序，称为*终端模拟器*（terminal\
  \ emulator）。有许多终端模拟器可用，特别是针对图形化的 X Window 系统（参见食谱 4.5 [在 X 中获取终端窗口]，第 109 页）。\n\n\
  当你使用直接连接到 Linux 系统的键盘和显示器，并利用内置的 Linux 模拟文本终端设备时访问系统时，被称为正在使用*控制台*（console）终端。\n\
  \nLinux 系统具有*虚拟控制台*（virtual consoles），它们作为独立的控制台运行，可以同时运行自己的登录会话，但从同一个物理控制台终端访问。大多数\
  \ Linux 系统默认配置有七个虚拟控制台（目前最多可达六三个）。\n\n当你处于控制台终端时，可以随时在虚拟控制台之间切换，并同时从多个虚拟控制台登录并使用系统。虚拟控制台有时也被称为*虚拟终端*（virtual\
  \ terminals）。\n\n下面的食谱解释了操作虚拟控制台以及普通终端的基本方法。\n\n专为此功能构建的硬件被称为*哑终端*（dumb terminals），因为它们没有自己的计算能力，只是与连接的实际计算机进行交互的输入和输出设备。\n\
  \n#### 2.3.1 获取虚拟控制台编号\n\n当你未登录时，当前虚拟控制台的编号会显示在控制台屏幕上。当你已登录并处于 shell 中，使用 `fgconsole`\
  \ 来确定你处于哪个虚拟控制台。它会输出当前虚拟控制台的编号。\n\n*⇒* 查看你处于哪个虚拟控制台，请输入：\n\n```bash\n$ fgconsole\n\
  RET\n3\n$\n```\n\n在这个示例中，`fgconsole` 输出了数字 3，表示用户处于第三个虚拟控制台。\n\n**注意：** 如果你尝试从 X\
  \ Window 系统中的终端模拟器运行 `fgconsole`，你会发现它不会输出数字，因为你不是在虚拟控制台上运行它的。\n\n#### 2.3.2 在控制台之间切换\n\
  \n切换到不同的虚拟控制台有两种方法：一种使用特殊的组合键，另一种是命令。\n\n**方法 #1**\n\n要切换到不同的虚拟控制台，按住 `ALT` 加上功能键，该键的数字对应你想要切换到的控制台编号。\n\
  \n*⇒* 要切换到第四个虚拟控制台，按 `ALT-F4`。\n\n此命令切换到第四个虚拟控制台，表示为“tty4”：\n\n```bash\nDebian GNU/Linux\
  \ 3.0 bardo tty4\nbardo login:\n```\n\n你还可以用左右方向键在不同的虚拟控制台之间循环切换。要切换到下一个较小的虚拟控制台（如果在第一个虚拟控制台，则循环到最大的虚拟控制台），按\
  \ `ALT-←`。要切换到下一个较大的虚拟控制台，按 `ALT-→`。\n\n*⇒* 从第四个虚拟控制台切换到第三个虚拟控制台，按：`ALT-<-`\n\n\
  此组合键切换到第三个虚拟控制台，“tty3”：\n\n```bash\nDebian GNU/Linux 3.0 bardo tty3\nbardo login:\n\
  ```\n\n要切换回你上次停留的控制台，按 `ALT-PrtScrn`。\n\n第七个虚拟控制台留给 X Window 系统使用。如果安装了 X，这个虚拟终端将永远不会显示登录提示，但当你使用\
  \ X 时，这就是你的 X 会话出现的地方。如果你的系统被配置为立即启动 X，这个虚拟控制台将显示 X 登录界面。\n\n你可以使用 `CTRL` 配合通常的\
  \ `ALT` 和功能键从 X Window 系统切换到虚拟控制台。这是在 X 中有效的唯一的控制台操作组合键。\n\n*⇒* 从 X 切换到第一个虚拟控制台，按：`CTRL-ALT-F1`\n\
  \n**方法 #2**\n\n使用 `chvt` 切换到不同的虚拟控制台。它接受一个编号作为参数。\n\n*⇒* 切换到第七个虚拟控制台，输入：\n\n```bash\n\
  $ chvt 7\nRET\n```\n\n**注意：** 这种方法适用于脚本。\n\n#### 2.3.3 控制台中的文本滚动\n\n当你登录虚拟控制台时，新的文本行出现在屏幕底部，而旧的文本行会超出屏幕顶部。使用\
  \ `SHIFT` 配合 `PgUp` 或 `PgDn` 向上（向后）或向下（向前）滚动文本。\n\n*⇒* 以下是使用此功能的两种方式：\n* 查看超出顶部的文本，按\
  \ `SHIFT-PgUp` 向后滚动。\n* 回滚后，按 `SHIFT-PgDn` 向前滚动。\n\n你可以回滚的文本量取决于系统内存。\n\n**注意：**\
  \ 这种技术用于滚动 shell 会话中的文本（参见第 3 章 [Shell]，第 53 页）。它不适用于滚动控制台中工具或应用程序中的文本。也就是说，你不能使用这种技术滚动由工具显示的文本。要滚动应用程序中的文本，请使用其自身的滚动功能（如果有的话）。\n\
  \n#### 2.3.4 清除屏幕\n\n清除终端屏幕有两种方法。\n\n**方法 #1**\n\n输入 `clear` 清除你工作的终端屏幕。屏幕将重绘，新的命令行将位于顶端，屏幕上所有其他内容都将被擦除。\n\
  \n*⇒* 清除终端屏幕，输入：\n\n```bash\n$ clear\nRET\n```\n\n这在控制台中以及 X 中的终端模拟器中均有效。你可以将此命令放入脚本。\n\
  \n**方法 #2**\n\n输入 `CTRL-L` 清除屏幕并在顶端重绘当前命令行。与在命令行输入的完整命令 `clear` 不同，你可以在可以在包含其他输入内容的命令行任何处输入\
  \ `CTRL-L`——它会在屏幕顶部重绘你当前所在的命令行，包括其中的所有内容。\n\n*⇒* 清除屏幕并在屏幕顶部重绘当前命令行，输入：\n\n```bash\n\
  CTRL-L\n```\n\n**注意：** 此组合键在 Bash shell 中有效，它是下一章的主题。\n\n\n\n\n\n### 2.3.5 重置终端屏幕\n\
  \n要将终端屏幕重置为默认设置，请使用 `reset`。当二进制文件的内容意外显示在屏幕上时，这非常有用，之后你在输入时只会打印乱码。其他情况下，终端可能会停止正常清除字符。此命令可以修复这个问题。\n\
  \n当发生这种情况时，输入 `reset` 然后按 RET，即使你无法在屏幕上看到自己输入的内容。这在控制台中以及运行在 X 中的终端均有效。\n\n*⇒* 要重置终端，请输入：\n\
  \n```bash\n$ reset\n```\n\nRET\n\n**注意：** 你可以练习这个操作，以便在它真的发生时你知道那是什么样子。\n\n通过将二进制文件的输出发送到终端屏幕来实现——输入\
  \ `cat /bin/ls` 观察它对终端做了什么；然后输入 `reset` 进行重置。\n\n### 2.4 运行命令\n\n`tool`（工具）是一个执行特定功能的软件程序——通常是专门的、简单的任务。例如，`hostname`\
  \ 工具输出系统的主机名，而 `who` 工具输出当前登录用户列表。`application`（应用程序）是一个更大的、通常是交互式的程序，用于完成更广泛的任务——想想图像编辑器和文字处理器。\n\
  \n工具或应用程序可以接受任意数量的 `options`（选项，有时称为“标志”），用于指定其默认行为的变化。它还可以接受 `arguments`（参数），指定要操作的文件或其他文本。参数通常指定在任何选项之后。\n\
  \n`command`（命令）一词是指工具或应用程序的名称，以及任何指定的选项和参数。由于输入工具名称本身通常就足以完成所需任务，因此工具通常被称为命令。\n\n\
  命令是对大小写敏感的；工具和应用程序的名称通常全小写。\n\n要在不提供任何选项或参数的情况下运行（或“执行”）工具或应用程序，请在 shell 提示符输入其名称，然后按\
  \ RET。\n\n*⇒* 要运行 `hostname` 工具，请输入：\n\n```bash\n$ hostname\n```\n\nRET\n\ncamelot\n\
  \n$\n\n示例中的系统主机名为 `camelot`。\n\n选项始终以连字符（`-`）开头，其后面通常跟着一个字母或数字。要在命令中包含选项，请在工具或应用程序名称后加上该选项。始终使用空格字符将工具名、每个选项和每个参数分开。\n\
  \n`Long-style` 选项（有时称为“gnu 样式”选项）以两个连字符（`--`）开头，通常是一个英文单词。\n\n有时选项本身可以接受一个参数。例如，`hostname`\
  \ 有一个 `-F` 选项，用于指定从哪个文件读取主机名；它接受文件名作为参数，即 `hostname` 应读取的文件。\n\n*⇒* 要运行 `hostname`\
  \ 并指定文件 `host.info` 为读取文件，请输入：\n\n```bash\n$ hostname -F host.info\n```\n\nRET\n\
  \n#### 2.4.1 显示工具的可用选项\n\n要获取工具可用选项列表和其他帮助信息，请使用 `--help`（长格式）或 `-h` 选项。它通常会输出一些关于工具用法的信息，并列出其可用选项。\n\
  \n*⇒* 要列出 `hostname` 工具的可用选项，请输入：\n\n```bash\n$ hostname --help\n```\n\nRET\n\n\
  有时可用选项列表的内容远超过一个屏幕，因此你可能想通过 `less` 管道输出进行查阅（参见 Recipe 9.1 [查阅文本]，第 211 页）。按 Q 停止查阅。\n\
  \n*⇒* 要查阅 `lynx` 工具的可用选项，请输入：\n\n```bash\n$ lynx -? | less\n```\n\nRET\n\n某些工具没有任何选项，在这种情况下你应该尝试\
  \ `-?` 选项。\n\n#### 2.4.2 显示工具的版本\n\n有时知道你系统上是哪个版本的命令是有用的。如果某个选项或功能没有按预期工作，可能是因为你安装的命令是旧版本。\n\
  \n使用 `--version`（长格式）或 `-v` 选项输出特定工具的版本号。\n\n*⇒* 要输出 `hostname` 工具的版本，请输入：\n\n```bash\n\
  $ hostname --version\n```\n\nRET\n\nhostname 2.10\n\n$\n\n此命令输出文本“hostname 2.10”，表示这是\
  \ `hostname` 工具的 2.10 版本。\n\n### 2.5 修改密码\n\n要更改密码，请使用 `passwd` 工具。它会提示你当前密码以及要替换它的新密码。出于安全考虑，在你输入时，旧密码和新密码都不会显示在屏幕上。为了确保你正确输入新密码，`passwd`\
  \ 会提示你输入两次新密码。你两次输入必须完全相同，否则 `passwd` 将不会更改你的密码。\n\n*⇒* 要更改密码，请输入：\n\n```bash\n\
  $ passwd\n```\n\nRET\n\nChanging password for kurt\n\nOld password: *your current\
  \ password*\n\nRET\n\nEnter the new password (至少 5 位，最多 8 位字符) 请使用大小写字母和数字的组合。\n\
  \nNew password: *your new password*\n\nRET\n\nRe-enter new password: *your new password*\n\
  \nRET\n\nPassword changed.\n\n$\n\n**注意：** 密码可以包含大写和小写字母、数字 0 到 9 以及标点符号；长度应在五到八个字符之间。参见\
  \ 2.2 [使用你的账户]，第 28 页关于选择良好密码的建议。\n\n### 2.6 列出用户活动\n\n本节配方描述了一些查看你与谁共享系统以及他们在做什么简单命令。\n\
  \n#### 2.6.1 显示你的用户名\n\n使用 `whoami` 输出登录用户的用户名。这并没有你想象的那么简单——如果你在一个共享终端上，这有助于判断是否是你的账户；对于有多个账户的用户，这可以查看你当前登录的是哪一个。\n\
  \n*⇒* 要输出你的用户名，请输入：\n\n```bash\n$ whoami\n```\n\nRET\n\nwill\n\n$\n\n在示例中，登录此终端的用户名是“will”。\n\
  \n#### 2.6.2 列出谁在系统中\n\n使用 `who` 输出所有登录系统的用户列表。它输出至少三列，列出用户的用户名、终端位置和登录时间。如果用户在使用\
  \ X 系统，会显示第四列；列出用户会话的位置（参见第 4 章 [X Window 系统]，第 95 页）。\n\n*⇒* 要查看谁在线，请输入：\n\n```bash\n\
  $ who\n```\n\nRET\n\nmurky tty1 Oct 20 20:09\n\ndave tty2 Oct 21 14:37\n\nkurt tty3\
  \ Oct 21 15:04\n\nkurt ttyp1 Oct 21 15:04 (:0.0)\n\n$\n\n示例输出显示用户 murky 登录在 tty1（系统的第一个虚拟控制），并从\
  \ 10 月 20 日 20:09 登录至今。用户 dave 登录在 tty2（第二个虚拟控制），并从 10 月 21 日 14:37 登录至今。用户 kurt\
  \ 登录了——在 tty3（第三个虚拟控制）和 ttyp1（后者是一个 X 会话，窗口位置为 (:0.0）。\n\n**注意：** 此命令用于列出本地系统的用户；要列出连接到网络远程系统的用户，或查看用户可能公开的更详细个人信息，请参见\
  \ Recipe 34.5.1 [检查用户是否在线]，第 683 页。\n\n\n\n\n`w` 工具类似于 `who`，但它显示的细节更详细。它会输出一行表头信息，其中包含当前系统状态的信息，包括当前时间、系统运行的时间以及系统上的用户数量。然后，它会列出当前登录系统的用户列表，并为每个用户提供八列信息。这些列包括用户名、终端位置、X\
  \ 会话（如果有）、登录时间、用户空闲的时间以及用户正在运行的命令。\n\n(它还提供了两列，显示系统 CPU 在用户当前所有作业上花费的时间 (`jcpu`)\
  \ 以及在前台进程上花费的时间 (`pcpu`)；关于进程的讨论请参见菜谱 2.7 [列出进程] 第 41 页，关于作业的讨论请参见菜谱 3.3 [管理作业]\
  \ 第 70 页。)\n\n⇒ 要查看谁当前登录系统以及他们正在做什么，输入：$ `w`\n\nRET\n\n5:27pm\nup 17:53, 4 users,\
  \ load average: 0.12, 0.06, 0.01\n\nUSER | TTY | FROM | LOGIN | IDLE | JCPU | PCPU\
  \ | WHAT\nmurky | tty1 | Oct 20 20:09 | 17:22m | 0.32s | 0.32s | -bash\ndave | tty2\
  \ | 14:37 | 13.00s | 2:35 | 0.07s | less foo\nkurt | tty3 | 15:04 | 1:00m | 0.41s\
  \ | 0.09s | startx\nkurt | ttyp1 | :0.0 | 15:04 | 0:00s 21.65s 20.96s | emacs\n\
  $\n\n在这个示例中，命令的输出显示当前系统时间为下午 5:27，系统已运行了 17 小时 53 分钟，当前有四个用户登录：murky 登录在 `tty1`，空闲了\
  \ 17 小时 22 分钟，处于 Bash shell 提示符下；dave 登录在 `tty2`，空闲了 13 秒，正在使用 `less` 查看一个名为 `foo`\
  \ 的文件（参见菜谱 9.1 [浏览文本] 第 211 页）；而 kurt 登录了两个终端——`tty3` 和 `ttyp1`，后者是一个 X 会话。他在 `tty3`\
  \ 上运行了 `startx` 命令来启动 X 会话，在他的 X 会话中，他目前正在使用 Emacs。\n\n## 2.6.4 列出用户上次登录的时间\n\n\
  使用 `last` 来查找最近使用系统的人、他们使用了哪些终端，以及他们登录和退出的时间。\n\n⇒ 要输出最近系统使用的列表，输入：$ `last`\n\n\
  RET\n\n要查找特定用户上次登录系统的时间，请将用户名作为参数提供。\n\n⇒ 要查找用户 `james` 上次登录的时间，输入：$ `last james`\n\
  \nRET\n\n**注意：** `last` 工具从系统文件 `/var/log/wtmp` 获取数据；输出的最后一行告诉该文件可以追溯多久。有时，输出会追溯到几周或更久。\n\
  \n## 2.7 列出进程\n\n当你运行一个命令时，你是在系统上启动了一个*进程*，它是一个正在执行的程序。每个进程都被赋予一个唯一的数字，称为其*进程*标识，或\
  \ `pid`。\n\n你可以列出系统在任何时刻运行的进程；使用 `ps` 来实现。\n\n默认情况下，`ps` 输出每个进程的五列信息：进程 ID；启动进程的终端名称；进程的当前状态（包括“S”表示*睡眠*\
  \ (sleeping)，意味着它目前处于挂起状态，“R”表示它正在运行，“Z”表示它是一个*僵尸* (zombie) 进程，即已经死亡的进程）；自进程开始以来\
  \ CPU 在该进程上花费的总时间；最后，是正在运行的命令名称。\n\n接下来的菜谱描述了 `ps` 的常用用法；在下一章中会有更多关于控制你运行的进程的内容。\n\
  \n### 2.7.1 列出你当前的进程\n\n不带任何参数输入 `ps` 以列出你在当前 shell 会话中运行的进程。\n\n⇒ 要列出你当前 shell\
  \ 会话中的进程，输入：$ `ps`\n\nRET\n\nPID TTY STAT TIME COMMAND\n193 1 S 0:01 -bash\n204\
  \ 1 S 0:00 ps\n$\n\n在这个示例中，`ps` 显示有两个进程正在运行：`bash` 和 `ps` 命令。\n\n### 2.7.2 列出某个用户的所有进程\n\
  \n要列出特定用户的所有进程，使用 `ps` 并将用户名作为 `-u` 选项的参数。虽然你不能监控其他用户的实际活动，但你可以列出他们在特定时刻正在运行的命令。\n\
  \n⇒ 要列出用户 `harry` 在系统上运行的所有进程，输入：$ `ps -u harry`\n\nRET\n\n**注意：** 该命令用于列出你跨越所有终端和\
  \ shell 会话运行的所有进程；请提供你*自己的*用户名作为参数。\n\n### 2.7.3 列出所有进程\n\n要列出系统中所有的进程，有两种方法：\n\n\
  **方法 1**\n要获取所有进程列表，使用带有 `ax` 选项的 `ps`。\n\n⇒ 列出所有进程，输入：$ `ps ax`\n\nRET\n\n**注意：**\
  \ 输出很多，你可能希望通过 `less` 进行处理。\n\n**方法 2**\n使用 `top` 按需显示当前进程。\n\n⇒ 查看持续更新的当前进程，输入：$\
  \ `top`\n\nRET\n\n### 2.7.4 按名称或数字列出进程\n\n要列出匹配名称或其他文本的进程，将输出通过给 `grep`。这里有两种用法：\n\
  \n⇒ 列出命令包含 `sbin` 字符串的进程：\n`ps aux | grep sbin`\n\nRET\n\n⇒ 列出进程 ID 包含 `13`：`ps\
  \ aux | grep 13`\n\nRET\n\n要列出对应的进程（如果有），将该 `pid` 作为 `-p` 选项的参数。\n\n⇒ 列出 pid 为 344\
  \ 的进程，输入：$ `ps -p 344`\n\nRET\n\n## 2.8 使用帮助设施\n\nLinux 系统自带大量的帮助设施，包括文本格式的手手册。事实上，Linux\
  \ 文档的问题不在于不够，而是你需要从中筛选出寻找的精确信息！\n\n我将在接下来的章节中介绍各种帮助设施；并在它们对于你寻找的特定类型信息的有用性。\n\n\
  ### 2.8.1 为任务寻找合适的工具\n\n通过关键字查找工具有几种方法。第一种是常用方法，后两种是：\n\n**方法 1**\n当你知道某个工具或应用程序的作用，但不记得它的名字时，首先应该使用\
  \ `apropos`。该工具接受关键字作为参数，并输出包含该关键字的安装软件列表。它在系统手册的名称和短描述中搜索给定文本，并输出匹配的工具列表。这对于查找系统中与“音频”、“声音”或“排序”或其他类似的通用概念相关的软件也非常有用。\n\
  \n⇒ 要输出与控制台相关的程序列表，输入：$ `apropos console`\n\nRET\n\n**注意：** `apropos` 工具匹配你给出的关键字完全相同的行，且位于行中的任何位置。搜索关键字“consoles”列出的程序可能没有搜索“console”列出的多。\n\
  \n\n\n会产生结果；搜索“con”会匹配到更多内容。因此，最好尝试单数形式，如果需要，再精炼你的术语。使用 `apropos` 获取良好结果的诀窍在于，知道哪些关键词适合出现在你正在寻找的对象的描述中。\n\
  \n`apropos` 工具是带有 `-k` 选项的 `man` 命令的别名（参见食谱 2.8.4 [阅读系统手册中的页面]，第 46 页）。\n\n## 方法\
  \ #2：dpkg\n\nDEB: `dpkg`\n\n在 Debian 系统上，通过关键词查找已安装软件另一种方法是使用 `dpkg`，即 Debian 软件包工具。使用\
  \ `-l` 选项列出所有已安装的软件包，每个包单独一行输出，包含其包名和简要描述。\n\n你可以通过将输出通过到 `grep` 来输出匹配关键词的包列表。使用\
  \ `grep` 的 `-i` 选项可以不区分大小写地匹配关键词（`grep` 在第 14 章 [搜索文本]，第 333 页中讨论）。\n\n第 2 章：每个\
  \ Linux 用户都应该的知识 45\n\n此外，你可以用 `less` 直接浏览文件 `/var/lib/dpkg/available`（参见食谱 9.1\
  \ [浏览文本]，第 211 页）；此文件列出了所有可用软件包并提供了它们的描述。\n\n*⇒ 这里有三种使用此方法的方法。\n\n*• 列出系统中所有已安装的\
  \ deb 包，输入：$ `dpkg -l`\n\nRET\n\n*• 列出系统中所有名称中包含文本“edit”（不区分大小写）的已安装 deb 包，输入：\n\
  \n$ `dpkg -l | grep -i edit`\n\nRET\n\n*• 浏览当前所有可用 deb 包的描述，输入：\n\n$ `less /var/lib/dpkg/available`\n\
  \nRET\n\n**注意：** 有关使用 `dpkg` 的更多信息，请参见食谱 A.4 [管理 deb 软件包]，第 709 页。\n\n## 方法 #3：rpm\n\
  \n在 Fedora 和 Red Hat Enterprise Linux 等基于 `rpm` 的系统上，你可以使用软件包管理工具 `rpm` 通过关键词查找已安装的软件。给出\
  \ `-qa` 选项以输出系统中所有已安装包的名称。要查找特定软件包，将输出通过到带有 `-i` 选项和匹配模式的 `grep`（参见食谱 14.1 [在文本中搜索单词]，第\
  \ 333 页）。将其通过到 `less` 进行浏览。\n\n*⇒ 这里有一些使用此方法的方法。\n\n*• 浏览系统中已安装的所有 `rpm` 包的列表，输入：$\
  \ `rpm -qa | less`\n\nRET\n\n*• 列出所有名称或描述中包含单词“edit”（不区分大小写）的软件包，输入：\n\n$ `rpm -qa\
  \ | grep -i edit`\n\nRET\n\n*• 列出系统中名称中包含文本“1.2”的所有 `rpm` 包，输入：\n\n$ `rpm -qa |\
  \ grep \"1\\.2*\"`\n\nRET\n\n**注意：** 有关使用 `rpm` 的更多信息，请参见食谱 A.5 [管理 rpm 软件包]，第 714\
  \ 页。\n\n46\n\n《Linux 烹饪指南》，第 2 版\n\n## 2.8.2 获取程序的描述\n\n使用 `whatis` 获取程序的程序的单行描述。将你想要描述的工具或应用程序名称作为参数给出。\n\
  \n*⇒ 获取 `who` 工具的描述，输入：$ `whatis who`\n\nRET\n\n**注意：** `whatis` 工具从给定程序的 `manual\
  \ page` 获取其描述；手册页将在本节稍后部分介绍，参见食谱 2.8.4 [阅读系统手册中的页面]，第 46 页。\n\n## 2.8.3 列出工具的用法\n\
  \n许多工具都有长样式选项 `--help`，它输出关于工具的用法信息，包括工具所接受的选项和参数。\n\n*⇒ 列出 `whoami` 的可能选项，输入：$\
  \ `whoami --help`\n\nRET\n\n```\nUsage: whoami [OPTION]...\n\n打印与当前有效用户 id 关联的用户名。\n\
  \n同于 id -un。\n\n--help\n\n显示此帮助并退出\n\n--version\n\n输出版本信息并退出\n向 <bug-sh-utils@gnu.org>\
  \ 报告错误。\n$\n```\n\n此命令输出了关于 `whoami` 工具的一些用法信息，包括简短描述和可能选项列表。\n\n**注意：** 并非所有工具都支持\
  \ `--help` 选项；某些工具改用 `-h` 或 `-?` 选项，其功能的功能相同。\n\n## 2.8.4 阅读系统手册中的页面\n\n在过去，大多数\
  \ Unix 系统随附的纸质参考手册也以电子形式存在于系统本身；每个随系统自带的软件程序都有自己的描述它的 `manual page`（通常称为“man page”）。这在今天基于\
  \ Linux 的系统上仍然适用，只是它们通常不再附带纸质手册了。\n\n![](img/index-81_1.png)\n\n第 2 章：每个 Linux 用户都应该的知识\n\
  \n47\n\n使用 `man` 工具查看系统手册中的页面。作为 `man` 的参数，给出想要查看的手册页的程序名称（因此，要查看 `man` 的手册页，输入\
  \ `man man`）。\n\n*⇒ 查看 `w` 的手册页，输入：\n\n$ `man w`\n\nRET\n\n此命令显示 `w` 的手册页，如图 2-2\
  \ 所示。\n\n*图 2-2。阅读手册页。*\n\n使用上下方向键浏览手册页。按 `Q` 停止查看手册页并退出。由于 `man` 使用 `less` 显示文本，请参见食谱\
  \ 9.1 [浏览文本]，第 211 页。\n\n**注意：** 尽管名为手册页，手册页并不总是包含完整文档；它通常包含文档名称以及指向各个章节的 Info `menu`。\n\
  \n48\n\n《Linux 烹饪指南》，第 2 版\n\n要打印手册页，请参见食谱 25.3 [打印手册]，第 522 页。\n\n## 2.8.5 阅读 Info\
  \ 手册\n\nGNU Info 系统是一种以 Info 格式编写的在线超文本系统。这种文档比手册页更完整，通常给定软件包的 Info 文档将是一整本书。Free\
  \ Foundation 发布的所有手册都以 Info 格式发布；这些手册包含的内容与从 Free Foundation 直接购买的纸质手册相同。\n\n有多种方法可以浏览\
  \ Info 文档：你可以使用独立的 `info` 工具、在 `Emacs` 编辑器中阅读 Info（参见食谱 10.1 [使用 Emacs]，第 232 页），或使用为此设计的其他工具。此外，还可以将\
  \ Info 文档转换为 html 的工具，可以在网页浏览器中阅读（参见食谱 5.10 [浏览文件和目录]，第 157 页）。\n\n要用 `info` 工具读取工具或应用程序的\
  \ Info 手册，将其名称作为参数给出。无参数时，`info` 会打开系统的“Top”菜单，列出系统中安装的所有手册。\n\n*⇒ 查看系统中所有的 Info\
  \ 手册，输入：$ `info`\n\nRET\n\n此命令从系统的“Top”菜单启动 info，显示可用手册列表，如图 2-3 所示。\n\n使用方向键浏览信息的“页面”，称为\
  \ Info `node`。节点是层级排列的。每个 Info 文档都有一个“Top”节点，类似于打印书籍的前言和目录；它通常包含文档名称以及指向各个章节的 Info\
  \ `menu`。章节节点将包含指向其部分的菜单，以此类推。其他节点的链接也出现在在菜单项和交叉引用中看起来相同：一个星号（`*`）、它指向的节点名称，以及一个或两个冒号（`:`\
  \ 或 `::`）。要跳转到链接指向的节点，将光标移动到链接中节点名称的任何部分并按 RET。\n\n\n\n\n按下 `H` 运行描述如何使用 `info`\
  \ 的教程。按下 `Q` 停止阅读文档并退出程序。你可以在处于 `info` 的任何时候按下这些按键。\n\n要读取特定工具或应用程序的 `Info` 文档，请将其名称作为参数传递给\
  \ `info`；如果该工具没有 `Info` 手册，`info` 将显示该工具的 man 页面（帮助页）。\n\n⇒ 要读取 `tar` 工具的 `Info`\
  \ 文档，输入：`$ info tar`\n\nRET\n\n此命令会在 `info` 中打开 *GNU tar 手册*的副本。\n\n要读取以 `Info`\
  \ 格式编写的文件内容，请使用 `-f` 选项指定要读取的文件名。这对于读取你从其他处获取的 `Info` 文件非常有用，这些文件并不位于与其它已安装的 `Info`\
  \ 文件相同的 `/usr/info` 目录中。`Info` 可以自动识别并展开压缩的且具有 `.gz` 扩展名的 `Info` 文件（参见参见食谱 8.4 [压缩文件]，第\
  \ 196 页）。\n\n⇒ 要读取当前目录下名为 `faq.info` 的 `Info` 文件，输入：`$ info -f faq.info`\n\nRET\n\
  \n此命令启动 `info` 并打开 `Info` 文件 `faq.info`，从文件的顶部节点开始。\n\n50\n\n《Linux 食谱》，第 2 版\n\n\
  要读取 `Info` 文件中的特定 `node`（节点），请将带引号的节点名称作为 `-n` 选项的参数。\n\n⇒ 要读取当前目录下的 `Info` 文件 `faq.info`\
  \ 并从 `Text` 节点开始，输入：\n\n`$ info -n 'Text' -f faq.info`\n\nRET\n\n**注意：** 你也可以直接从\
  \ `Emacs` 编辑器读取 `Info` 文；在 `Emacs` 中输入 `CTRL-H i` 启动 `Emacs Info` 阅读器，然后使用与独立 `info`\
  \ 工具相同的命令（参见参见食谱 10.1.1 [熟悉 Emacs]，第 232 页）。\n\n`Emacs` 的“增量”搜索命令 `CTRL-S` 在 `info`\
  \ 中同样有效；这是一种在整个 `Info` 文本（如这整本书）中搜索单词或短语的非常快速、高效的方法（参见食谱 14.9.1 [在 Emacs 中增量搜索]，第\
  \ 352 页）。\n\n有些人任何事情都使用 `Info`；在 Linux 系统上，如果工具缺少 `Info` 文档，`Info` 被设置为在 `Info`\
  \ 中显示该工具的 man 页面。因此，如果 `foofoo` 工具没有任何 `Info` 手册，输入 `info foofoo` 将给你它的 man 页面。\n\
  \n## 2.8.6 读取系统文档和帮助文件\n\nLinux 文档项目 HOWTO\n\nDEB: `doc-linux-html`\n\n`doc-linux-text`\n\
  \nRPM: `howto`\n\nWWW: `http://tldp.org/`\n\n`/usr/doc` 目录用于杂杂文档：howtos、faqs、特定发行版的文档文件以及随命令提供的文档。（要了解更多关于文件和目录的知识，请参见第\
  \ 5 章 [文件和目录]，第 125 页。）要审阅这些任何一个文件，请使用 `less`，它在食谱 9.1 [审阅文本]，第 211 页中有详细描述。\n\n\
  当安装一个软件包时，它除了手册页和 `Info` 手册之外可能有的任何额外文档文件都会放置在此处的以该包命名的子目录中。在某些系统中，`/usr/doc` 被\
  \ `/usr/share/doc` 目录取代；另一些系统两者兼有。因此，如果文件不在它应该在的位置，请尝试查看 `/usr/share/doc/`。例如，用户字典众名的位于\
  \ `/usr/dict/words`。在现在的某些发行版中，它已被移动到 `/usr/share/dict/words`，但如果你想将其恢复到经典位置，你（作为超级用户）可以从前者到后者创建一个符号链接（参见食谱\
  \ 5.7 [给文件起多个名称]，第 152 页）。\n\n第 2 章：每个 Linux 用户都应该知道的 51\n\n例如，`hostname` 包的额外文档位于\
  \ `/usr/doc/hostname`，`passwd` 包的文档位于 `/usr/doc/passwd`。大多数软件包都有名为 `README` 的文件，通常包含相关信息。该文件通常被压缩为\
  \ `README.gz`，在这种情况下你可以使用 `zless` 代替 `less`。\n\nLinux 文档项目（ldp）监督了超过 100 个 `howto`\
  \ 文件的创建，每个文件涵盖了基于 Linux 系统安装或使用的一个方面。\n\n`ldp` howtos 是存储在 `/usr/doc/HOWTO` 目录下的压缩文本文件；要查看它们，请使用\
  \ `zless`。\n\n文件 `/usr/doc/HOWTO/HOWTO-Index.gz` 包含安装的所有 `howto` 文档的注释索引。5\n\n`/usr/doc/FAQ`\
  \ 目录包含许多关于各种主题的 `faq`（常见问题解答）文件。\n\n最后，某些发行版在 `/usr/doc` 中保留了一个用于自身文档的目录；例如，Debian\
  \ 使用 `/usr/doc/debian` 用于与该发行版相关的文档：组成 Debian `faq` 的文件位于 `/usr/doc/debian/FAQ`\
  \ 目录，提供 html 格式（你可以在 Web 浏览器中查看（参见 5.10 [浏览文件和目录]，第 157 页））和压缩文本文件（你可以使用 `zless`\
  \ 查看）。\n\n⇒ 这里有两种使用它的方法。\n\n• 在 `lynx` 浏览器中查看 Debian `faq` 的 html 版本，输入：\n\n`$ lynx\
  \ /usr/doc/debian/FAQ/debian-faq.html`\n\n• 在 `zless` 中查看 Debian `faq` 的压缩文本版本，输入：\n\
  \n`$ zless /usr/doc/debian/FAQ/debian-faq.txt.gz`\n\nldp 文档也有其他格式，包括 html。\n\n52\n\
  \n《Linux 食谱》，第 2 版\n\n第 3 章：Shell\n\n53\n\n## 3. Shell\n\n本章的主题是 *shell*，读取你的命令输入并运行指定命令的程序。它的名字是因为它提供了一个覆盖，保护你免受外部环境的影响，就像海洋中软体动物的硬壳一样。shell\
  \ 是你和系统之间的中介，所有的交互都通过它完成；从你成功登录系统的时刻起直到你注销的那刻，你被认为“处于”一个 shell 中。\n\n\n\n\n在 Recipe\
  \ 3.9.5 [使用其他 Shell] 第 92 页中给出了其他推荐的 shell 列表。有关在本文章提供的内容之外使用 Bash 的更多信息，请参阅 `bash`\
  \ 的 Info 文档（参见 Recipe 2.8.5 [阅读 Info 手册]，第 48 页）。\n\n## 3.1 在命令行处输入\n\n在 Recipe\
  \ 2.4 [运行命令] 第 36 页中，你学习了如何通过在 shell 提示符处输入命令来运行命令。在 shell 提示符处输入命令的行称为 `command\
  \ line`（命令行，也称为输入行）。在命令行上编写命令的过程被称为 `command line editing`（命令行编辑）。\n\n接下来的章节描述了命令行编辑的一些重要功能，例如对特殊字符和字符串加引号、让\
  \ shell 全全你的输入、重新运行命令以及运行多个命令。\n\n**注意：** 有关 Bash 命令行编辑功能的更多信息，请参阅 `bash` 的 Info\
  \ 文档（参见 Recipe 2.8.5 [阅读 Info 手册]，第 48 页）。\n\n### 3.1.1 使用基础命令行编辑键\n\n有特殊的按键可以可以在输入行中移动并编辑你正在输入的行；下表描述了这些键。\n\
  \n**输入命令**\n\n| 命令 | 描述 |\n| :--- | :--- |\n| 插入 `text` | 在光标处插入 `text`；光标右侧已有的任何文本都将向右移动以容纳新文本。\
  \ |\n| `RET` | 将命令行发送给 `Bash` 执行（换句话说，它运行在 shell 提示符处输入的命令）。你不需要在命令行的最右端输入 `RET`；你可以在光标位于命令行任意任意位置时输入它。\
  \ |\n\n**剪切和粘贴**\n\n| 命令 | 描述 |\n| :--- | :--- |\n| `BKSP` 或 `CTRL - H` | 删除光标左侧的字符。\
  \ |\n| `DEL` 或 `CTRL - D` | 删除光标下方的字符。 |\n| `CTRL - K` | 杀死（或“剪切”）输入行中从光标所在字符到行尾的所有文本。\
  \ |\n| `CTRL - U` | 杀死输入行中光标左侧的所有内容。 |\n| `CTRL - Y` | 提取（或“粘贴”）上次杀死的文本。文本插入到光标所在。\
  \ |\n\n**移动**\n\n| 命令 | 描述 |\n| :--- | :--- |\n| `CTRL - A` | 将光标移动到输入行的开头。 |\n\
  | `CTRL - E` | 将光标移动到输入行的结尾。 |\n| `CTRL - F` | 将光标向右（前）移动一个字符。 |\n| `CTRL - B` |\
  \ 将光标向左（后）移动一个字符。 |\n| `ALT - F` | 将光标向前移动一个*单词*。 |\n| `ALT - B` | 将光标向后移动一个*单词*。\
  \ |\n| `CTRL - L` | 清终端屏幕，并在顶部重绘当前输入行。 |\n\n**注意：** 这些键盘命令与 `Emacs` 编辑器使用的相同（参见\
  \ Recipe 10.1 [使用 Emacs]，第 232 页）。许多其他 `Emacs` 键盘命令在命令行也有效（参见 Recipe 10.1.3 [使用基础\
  \ Emacs 编辑键]，第 237 页）。而且，对于 `Vi` 爱好者，可以配置 `Bash` 来识别 `Vi`风格的绑定（参见 Recipe 3.7.3 [使用\
  \ Shell 启动文件]，第 86 页）。\n\n### 3.1.2 输入控制字符\n\n可以通过 `CTRL - V`（shell 的字面插入函数）后跟你想要的控制字符，在输入行上输入控制字符。\n\
  \n⇒ 要在输入行的当前位置插入分页符（`Control-L`），请输入：\n\n```\nCTRL - V\nCTRL - L\n```\n\n### 3.1.3\
  \ 为保留字符加引号\n\n某些字符是`保留`的，它们对 shell 本身具有特殊含义，例如美元符号（`$`）、单引号（`'`）、双引号（`\"`）、感叹号（`!`）、反斜杠（`\\\
  `）以及将你在命令行输入的内容发送给 shell 执行的换行符（`RET`）。在将这些字符作为参数传递给命令之前，你必须对其进行 `quote`（引用）。\n\n\
  有多种方法引用字符。每种方法适用于特定的用途，因此你应该了解它们之间的区别。有时，各种引用方法会在同一个参数中组合（参见下文方法 #3 的最后一个示例）。\n\n\
  为了演示引用，接下来的示例将使用 `echo`，这是一个简单的工具，用于显示传递给它的参数的任何文本（技术上，此命令将其参数回显到标准输出——参见 Recipe\
  \ 3.2 [重定向输入和输出]，第 67 页）。\n\n#### 方法 #1\n\n要引用保留字符，在其前面加一个反斜杠（`\\`）。反斜杠是 `Bash`\
  \ 的 `escape character`（转义字符）；紧随其后的字符将被视为 Literal，而不具有任何保留含义。该规则的唯一例外是换行符（参见 Recipe\
  \ 3.1.12 [输入长行]，第 66 页）。\n\n⇒ 这里是使用此方法的一些。\n\n* 要显示字符串“Isn't this nice?”，输入：\n```\n\
  $ echo Isn\\'t this nice?\nRET\nIsn't this nice?\n$\n```\n\n* 要显示“Isn't this nice!”，输入：\n\
  ```\n$ echo \"Isn\\'t this nice!\"\nRET\nIsn't this nice!\n$\n```\n\n* 要显示$HOSTNAME\
  \ is nice!，输入：\n```\n$ echo \\$HOSTNAME is nice!\nRET\nHOSTNAME is nice!\n$\n```\n\
  \n* 要显示\"$HOSTNAME is nice!\"，输入：\n```\n$ echo \\\"$HOSTNAME is nice!\\\"\nRET\n\
  HOSTNAME is nice!\n```\n\n最后的示例使用了 `$HOSTNAME`，其值为主机名（参见 Recipe 3.5 [使用变量]，第 77\
  \ 页）。首先 `$HOSTNAME` 被显示了。\n\n**注意：** 对于单个保留字符，这是最简单的引用方法；传递短语时你需要转义所有空格。\n\n```\n\
  $ echo '\n```\n\n#### 方法 #2\n\n使用单引号（`'`）包裹字面短语。引号内的所有字符都被字面处理，而不具有保留含义——因此你甚至引用变量。单引号中无法传递的字符是单引号本身。\n\
  \n⇒ 这里是使用此方法的一些。\n\n* 要显示反斜杠，输入：\n```\n$ echo '\\'\nRET\n\\\n$\n```\n\n* 要显示“! /”，输入：\n\
  ```\n$ echo '! /'\nRET\n! /\n$\n```\n\n* 要显示$HOSTNAME is nice!，输入：\n```\n$ echo\
  \ '$HOSTNAME is nice!'\nRET\nHOSTNAME\nis nice!\n$\n```\n\n**注意：** 第二种方法是较简单的引用方法之一。\n\
  \n#### 方法 #3\n\n使用双引号（`\"`）包裹短语，以保留*某些*字符的特殊含义：美元符号（`$`）、反引号（`` ``）、感叹号（`!`）和反斜杠（`\\\
  `）。\n\n这意味着：变量会被展开为其值（参见 Recipe 3.5 [使用变量]，第 77 页），可以指定命令输出（参见 Recipe 3.1.11 [将命令输出作为参数]，第\
  \ 65 页），可以引用命令历史（参见 Recipe 3.4 [使用你的命令历史]，第 74 页），并且可以像上述方法一样转义字符。\n\n你可以传递单引号和换行符；要传递双引号、美元符号、反引号或反斜杠，请先用反斜杠（`\\\
  `）对其进行转义。在双引号外部转义感叹号。\n\n⇒ 这里是使用此方法的一些。\n\n* 要显示“Isn't this nice?”，输入：\n```\n$ echo\
  \ \"Isn't this nice?\"\nRET\nIsn't this nice?\n$\n```\n\n* 要显示“Isn't $HOSTNAME it?”，输入：\n\
  ```\n$ echo \"Isn't \\$HOSTNAME it?\"\nRET\nIsn't $HOSTNAME it?\n$\n```\n\n* 要显示“Isn't\
  \ this $HOSTNAME?”，其中 $HOSTNAME 是要展开的 shell 变量，输入：\n```\n$ echo \"Isn't this $HOSTNAME?\"\
  \nRET\nIsn't this [value]?\n$\n```\n\n\n\n\n\n这不幸运吗？\n\n$\n\n• 要输出“Wow!This isn't\
  \ \"$HOSTNAME\"!”，其中第一个感叹号后有一个换行符，请输入：\n\n```bash\n$ echo \"Wow!\" \"!\"\nRET\n\
  > \"This isn't $HOSTNAME!\"\n```\n\nWow!\nThis isn't \"$HOSTNAME\"!\n\n在倒数第二个例子中，系统的主机名是幸运的。在第二个和最后一个例子中，文本“$HOSTNAME”被字面量引用，没有被扩展为变量；通过省略直接位于美元符号之前的反斜杠，shell\
  \ 就会扩展该变量。\n\n**注意：** 有时你可以在双引号中引用感叹号而没问题，但因为它是预留用于引用你的 Bash 命令历史的，在错误的上下文中使用可能会导致意料之外的结果。除非你只使用单引号方法，否则，在双引号之外转义感叹号是最安全的。\n\
  \n## 方法 #4\n\n要将特殊字符作为字符串传递，请将它们提供为 `$'string'`，其中 `string` 是要传递的字符字符串。这被称为“ansi-c\
  \ 样式”引用。\n\n字符串中通常包含某些字符的特殊反斜杠转义序列，如下表所示。\n\n- `\\a`: 警报（响系统蜂鸣声）。\n- `\\b`: 退格。\n\
  - `\\e`: 转义键（Escape）。\n- `\\f`: 分页。\n- `\\n`: 换行。\n- `\\r`: 回车。\n- `\\t`: 水平制表。\n\
  - `\\v`: 垂直制表。\n- `\\\\`: 反斜杠。\n- `\\NNN`: ASCII 码为八进制（基 8）`NNN` 的字符。\n\n⇒ 这里是使用它的几种方法。\n\
  \n• 要输出字符串“Hello”后跟两个换行符，输入：\n```bash\n$ echo Hello$'\\n\\n'\nRET\nHello\n```\n\n\
  $\n\n• 要输出段落标记字符（八进制字符代码 266），输入：\n```bash\n$ echo $'\\266'\nRET\n¶\n```\n\n$\n\n\
  • 要向文件 `draft` 中追加一个换行符和一个段落标记字符（八进制字符代码 266），输入：\n\n```bash\n$ echo $'\\n\\266'\
  \ >> draft\nRET\n```\n\n## 3.1.4 让 shell 补全你输入的内容\n\n*补全*（Completion）是指 Bash 尽力为你完成输入。要使用它，在输入行上按下\
  \ `TAB` 键，shell 将尽力地*补全*光标左侧的单词。补全是那种一旦你开始使用，你就会怀疑自己过去是如何在没有它的情况下过来的东西之一。\n\n补全对文件名和命令名都有效，取决于你按下\
  \ `TAB` 键时光标的上下文。\n\n当有多种方法可以补全一个单词时，shell 会发出蜂鸣声提醒你；再次按下 `TAB` 将显示可能的选项，然后重新绘制你的命令行行。如果选项很多，shell\
  \ 此时会问你是否真的想显示所有选项。\n\n⇒ 要使用补全功能将 `/usr/lib/emacs/20.7/i386-debian-linux-gnu/` 目录作为\
  \ `ls` 命令的参数，输入：\n```bash\n$ ls /usr/lib/* TAB\n*发出蜂鸣声*\nTAB\n显示所有 767 种可能性？(y 或\
  \ n) n\n$ ls /usr/lib/*e TAB\n*发出蜂鸣声*\nTAB\nelm-me+\nemacs\nemacsen-common\nentity-map\n\
  $ ls /usr/lib/e *m* TAB\n*发出蜂鸣声*\n$ ls /usr/lib/emacs TAB\n*发出蜂鸣声*\n$ ls /usr/lib/emacs\
  \ TAB\nemacs\nemacsen-common\n$ ls /usr/lib/emacs */* TAB 20.7/ TAB i386-debian-linux-gnu/\n\
  ```\n\n注意只需输入字母“e”然后按两次 `TAB` 键就会调出一系列文件，而“em”被补全为“emacs”，因为此目录中所有以字母“em”开头的选项至少补全为该单词。\n\
  \n最后两个 `TAB` 补全是在没有发出蜂鸣声的情况下完成的，这意味着补全的是唯一的可能。\n\n**注意：** 许多应用程序也支持命令和/或文件名补全；其中最著名的例子是\
  \ Emacs 编辑器（参见食谱 10.1 [使用 Emacs]，第 232 页）。\n\n## 3.1.5 在命令行撤销错误\n\n如果你想撤销刚刚在输入行上输入的内容，请输入\
  \ `CTRL-*`。\n\n如果你一直在使用退格键删除内容，shell 会记住你删除了什么并将其放回输入行。你可以连续多次使用此撤销命令，使行返回到更早的状态。如果你刚刚输入了一行短命令，那么此命令将将其完全删除。\n\
  \n你也可以通过输入 `CTRL-*U` 来删除光标左侧的所有内容。\n\n最后，你可以对字符进行*交换*（transpose）：使用 `CTRL-*T` 交换光标前的两个字符，使用\
  \ `ALT-*T` 交换光标前的两个单词。这对于纠正拼写错误很有用。\n\n⇒ 要交换字母“m”和“o”：\n交换光标前的两个字符，使用 `CTRL-*T`。交换光标前的两个单词，使用\
  \ `ALT-*T`。这对于纠正拼写错误很有用。\n\n## 3.6 重复最后一个命令\n\n输入 `!!` 重复最后一个命令。你也可以通过 `CTRL-x`\
  \ 编辑最后一个命令。\n\n⇒ 要交换字母“m”和“o”：\n交换光标前的两个字符，使用 `CTRL-*T`。交换光标前的两个单词，使用 `ALT-*T`。这对于纠正拼写错误很有用。\n\
  \n## 3.1.7 运行命令列表\n\n有两种方法：一种是在命令行指定命令，另一种是从文件获取。\n\n### 方法 #1\n\n要在输入行上运行多个命令，请按你的运行顺序输入每个命令，并用分号（`;`）分隔每个命令。这是一种运行多个非交互命令的快捷方法。\n\
  \n⇒ 这里是使用它的两种方法：\n\n• 清屏然后退出系统，输入：\n```bash\n$ clear; logout\n```\n\n• 运行三次 `hostname`\
  \ 命令，输入：\n```bash\n$ hostname; hostname; hostname\n```\n\n**注意：** 这种组合命令有很多用途。一种流行的用法是先运行\
  \ `sleep`，然后运行另一个命令。\n\n### 方法 #2\n\n你也可以通过将命令放在文件中来运行命令列表。\n\n使用特殊的 `.` 命令，并将文件名作为参数。这将在当前\
  \ shell 中运行文件中的所有命令。\n\n⇒ 要运行 `~/lists/nightly` 中的命令，输入：\n```bash\n$ . ~/lists/nightly\n\
  ```\n\n**注意：** 这种方法适用于运行带有大量参数的命令。例如，你可能想要运行一个接受 url 作为参数的工具，并且有一系列这样的 url 需要运行。使用文本编辑器将\
  \ url 复制到文件中每行一个，然后在每行的开头插入工具名称。\n\n内置命令 `source` 是 `.` 的同义词；使用这种方法运行文件命令通常被称为“源”（source）文件。\n\
  \n## 3.1.8 运行一个命令后运行另一个\n\n正如你可以用分号将命令连接在一起并在列表中运行它们一样，你还可以指定某个命令*仅当*在前一个命令执行成功时运行。要这样做，请使用特殊的\
  \ `&&` 控制运算符分隔命令。如果第一个命令执行成功，则运行第二个命令；如果第一个命令执行失败——即命令不存在，或者它返回错误或任何非零退出状态——则不运行第二个命令。\n\
  \n\n\n\n\n- 运行 `foo`，并且在 `foo` 存在且成功运行后才运行 `bar`，输入：\n\n```bash\nfoo && bar\n```\n\
  \n- 不区分大小写地在 `operations` 文件中搜索“planning”一词，只有在文件中找到该词时才查看操作，输入：\n\n```bash\ngrep\
  \ -i planning operations && less operations\n```\n\n### 3.1.9 运行一个或另一个命令\n\n要指定运行一个*或*另一个命令，请使用特殊的控制运算符\
  \ `||` 来分隔两个命令。如果第一个命令存在，shell 将运行它并忽略第二个命令；如果第一个命令不存在、返回错误，或者其他以非零退出状态返回，则 shell\
  \ 将运行第二个命令。\n\n*⇒* 要运行 `w` 或 `who`，输入：\n\n```bash\nw || who\n```\n\n在例例中，如果 `w`\
  \ 存在且运行无错误，shell 将运行它并退出；否则，它将运行 `who`。\n\n### 3.1.10 自动回答命令提示\n\n有时，我们希望在不直接与命令交互的情况下回答交互式命令。使用\
  \ `yes` 来实现此；默认情况下，它会输出“y”并跟一个换行符，直到被杀掉。如果你有一个命令需要多次请求确认，且你希望将回答过程自动化，可以将 `yes`\
  \ 的输出管道到该命令中。\n\n*⇒* 要运行命令 `barfoo` 并对它的所有提示自动回答 `y`，输入：\n\n```bash\nyes | barfoo\n\
  ```\n\n若要输出“y”以外的内容，请将其指定为参数。若要指定输出的次数，可以将 `yes` 管道给 `head`，并将输出次数作为选项。\n\n*⇒* 这里有两种使用它的方法。\n\
  \n- 使用 `mv` 将当前目录下所有以 `.sample` 结尾的文件移动到名为 `live` 的目录，但在覆盖任何现有文件时回答 `no`，输入：\n\n\
  ```bash\nyes n | mv *.sample live\n```\n\n- 运行命令 `farboo` 并用你的用户名自动回答五次提示，输入：\n\n\
  ```bash\nyes `whoami` | head -5 | farboo\n```\n\n### 3.1.11 将命令的输出作为参数\n\n你可以让 shell\
  \ 用其输出替换给定的命令。这被称为*命令替换*，用于指定将某些命令的输出作为其他命令的参数。\n\n有两种方法可以实现，如下文所示。\n\n**注意：** 你可以嵌套替换，将一个替换放在另一个替换内部。\n\
  \n#### 方法 #1\n\n要替换命令的输出，将命令括在括号中并在前面加上美元符号（`$`）。\n\n*⇒* 在系统中查找任何名称中包含你的用户名的文件，输入：\n\
  \n```bash\nlocate $(whoami)\n```\n\n#### 方法 #2\n\n要替换命令的输出，将命令括在反引号（`` ` ``）中。\n\
  \n*⇒* 在系统中查找任何名称中包含你的用户名的文件，输入：\n\n```bash\nlocate `whoami`\n```\n\n**注意：** 这是旧式方法。包裹任何嵌套替换的反引号必须在每个前面都加上反斜杠字符（`\\\
  `）；同样也使用反斜杠来指定美元符号或字面反斜杠字符。\n\n### 3.1.12 输入长行\n\n当你输入一个长命令并希望保持屏幕上的外观整洁时，使用反斜杠（`\\\
  `）后跟换行符在该处停止当前行，并在屏幕的下一行开头继续它。\n\nshell 会在新行前加一个特殊的“>”提示符，这样你就知道这一行是上一行的延续。反斜杠和换行符都会被\
  \ shell 忽略，就像第一行开头的文本和随后的行是无缝衔接的一的一条长行一样。\n\n在行的任何位置断行都不要紧，你可以使用这种方法扩展到任意数量的行。\n\
  \n*⇒* 这里有两种使用它的方法。\n\n- 在跨越两个屏幕行输入时回显字符串‘verylongword’，输入：\n\n```bash\necho ver\\\
  \n> ylongword\n```\n```verylongword\n```\n\n- 在跨越四个屏幕行输入时回显字符串‘verylongword’，输入：\n\
  \n```bash\nech\\\n> o verylo\\\n> ngwor\\\n> d\n```\n```verylongword\n```\n\n**注意：**\
  \ 看起来可能并不总是那么整洁，但你可以在不使用这种技术的情况下输入长命令。\n\n### 3.2 重定向输入和输出\n\nshell 在指定的“流”中移动文本。*标准输出*是\
  \ shell 流传输命令文本输出的地方——默认是你的终端屏幕。*标准输入*（通常是键盘）是你为命令输入数据的地方。当命令读取标准输入时，它通常会一直读取文本，直到你在单独的一行输入\
  \ `CTRL - D` 为止。\n\n当命令运行并带错误退出时，错误消息通常输出到你的屏幕，但它是一个独立的流，称为*标准错误*。\n\n你通过*重定向*将这些流重定向到一个文件，甚至是另一个命令。接下来的章节描述了你可以用于重定向它们的\
  \ shell 重定向运算符。\n\n#### 3.2.1 将输入重定向到文件\n\n要重定向标准输入（有时称为“stdin”），使用 `<` 运算符。要执行此操作，在命令后面加上\
  \ `<` 和文件名。\n\n*⇒* 将标准输入重定向到名为 `keywords` 文件：\n\n```bash\napropos < keywords\n```\n\
  \n#### 3.2.2 重定向输出到文件\n\n有两种运算符可以将标准输出（或“stdout”）重定向到文件。`>` 运算符会覆盖已的文件，而 `>>` 运算符会将输出追加到文件。如果指定的文件不存在，任何一个运算符都会创建它。\n\
  \n要使用任何运算符，在命令后面加上运算符和应写入的文件名。\n\n*⇒* 这里有两种使用它的方法。\n\n- 将 `apropos bash` 的输出重定向到文件\
  \ `suggestions`，如果存在则覆盖：\n\n```bash\napropos bash > suggestions\n```\n\n- 将 `apropos\
  \ shells` 的输出追加到现有文件 `suggestions`：\n\n```bash\napropos shells >> suggestions\n\
  ```\n\n#### 3.2.3 将错误消息重定向到文件\n\n要重定向标准错误流（有时称为“stderr”），使用 `2>` 运算符。在命令后面加上该运算符和文件名。\n\
  \n*⇒* 将 `apropos bash` 的标准错误重定向到文件 `command.error`：\n\n```bash\napropos bash 2>\
  \ command.error\n```\n\n与重定向标准输出有两个变体；`2>>` 的工作方式与 `2>` ，但会将标准错误追加到文件（如果文件存在）。\n\
  \n*⇒* 将 `apropos shells` 的标准错误追加到现有文件 `command.error`：\n\n```bash\napropos shells\
  \ 2>> command.error\n```\n\n要将*所有*标准输出和标准错误重定向到同一个文件，请使用 `&>` 代替 stdout 和 stderr\
  \ 运算符。\n\n*⇒* 将 `apropos shells` 的标准输出和标准错误重定向到名为 `commands` 文件：\n\n```bash\napropos\
  \ shells & > commands\n```\n\n**注意：** `&>` 运算符会覆盖预先的文件；在这种情况下没有用于追加 stdin 和 stderr\
  \ 的 `&>>` 运算符。\n\n#### 3.2.4 将输出重定向到另一个命令的输入\n\n*管道*是指将一个命令的标准输出连接到另一个命令的标准输入。你通过按顺序指定两个命令并用竖线字符（`|`，有时称为“管道”）分隔它们来实现这一点。\n\
  \n以这种方式构建的命令被称为*管道线*（pipelines）。\n\n\n\n\n管道（Pipes）经常与`filter`（过滤器）配合使用，过滤器是指接收输入、以某种方式对其修改并将结果发送到标准输出的工具。你可以通过流水线将过滤器和工具连接起来，将每一个工具的输出推向下一个工具的输入。管道作为应用和组合过滤器的手段非常强大，以至于我们可能专门用一章来讨论“文本过滤”；目前，更改文本格式的过滤器有自己的专门章节，而其他过滤器在书的其他地方有描述。\n\
  \n将显示大量文本输出的命令管道到输出较少的工具通常很有用，后者是一种用于查阅文本的工具（参见 Recipe 9.1 [查阅文本]，第 211 页）。\n\n\
  ⇒ 要将 `apropos bash shell shells` 的输出管道到 `less`，请输入：\n\n```bash\n$ apropos bash shell\
  \ shells | less\n```\n\n这会将命令 `apropos bash shells`的标准输出重定向到命令 `less` 的标准输入，从而将其显示在屏幕上供查阅。\n\
  \n### 3.2.5 将输出重定向到多个地方\n\n使用 `tee` 将标准输出重定向到多个地方。`tee` 的命名源于那些 T 型的管道接头，它们的作用与管道完全相同。\n\
  \n当你在流水线的末尾使用 `tee` 时，它会将输入同时重定向到标准输出和你作为参数提供的文件名。\n\n⇒ 要将 `apropos bash shell shells`\
  \ 输出的副本写入到名为 `shell.commands` 的文件，并同时用 `less` 查阅输出，请输入：\n\n```bash\n$ apropos bash\
  \ shell shells | tee shell.commands | less\n```\n\n使用 `-a` 选项向文件追加（`append`）内容，而不是覆盖现有数据。\n\
  \n要重定向到多个文件，请将多个 `tee` 命令组合在一起。\n\n⇒ 要将 `apropos bash shell shells` 输出的副本写入到名为 `shell.commands`\
  \ 的文件，将输出的副本追加到名为 `command.suggestions` 的文件，并同时用 `less` 查阅输出，请输入（全部写在一）：\n\n```bash\n\
  $ apropos bash shell shells | tee shell.commands | tee -a command.suggestions |\
  \ less\n```\n\n### 3.2.6 将内容重定向到无处\n\n文件 `/dev/null` 是一个特殊的设备文件，称为“空设备”（`null device`）。它不包含任何内容；你可以把它想象成巨大的无底洞，你永远无法到达或看到它的深度。如果你尝试显示它的内容，你将一无所获，你发送到那里的内容将消失于无有，你永远无法将其找回。\n\
  \n这实际上非常有用！将任何不想看到的内容重定向到 `/dev/null`——例如标准错误。你也可以执行相反的操作，将 `/dev/null` 的内容写入某些东西中，这对于那些需要某些可选输入但你希望在不提供任何此类输入的情况下运行的命令来说很有处。\n\
  \n⇒ 要运行命令 `errant` 并将任何错误消息重定向到 `/dev/null`，请输入：\n\n```bash\n$ errant 2> /dev/null\n\
  ```\n\n**注意：** “发送到 /dev/null”是一个常用短语。现在你知道人们这样做是什么意思了。有些人称其为“比特桶”（bit bucket）。现在你也知道那个了。\n\
  \n### 3.3 管理作业\n\n你在特定 shell 中运行的进程被称为你的 `jobs`（作业）。\n\n你可以同时从一个 shell 运行多个作业；读取标准输入并写入标准输出的作业是前台作业（`foreground`），而任何其他作业都被认为在后台（`background`）运行。\n\
  \nshell 为每个作业分配一个唯一的 `job number`（作业编号）。你可以将其作为参数为命令指定特定的作业。只需在作业编号前加上百分号（`%`）即可。\n\
  \n要找到正在运行作业的编号，请列出你的作业（参见 Recipe 3.3.4 [列出你的作业]，第 73 页）。\n\n以下章节介绍了管理作业的各种命令。\n\n\
  #### 3.3.1 挂起作业\n\n输入 `CTRL-Z` 可挂起或停止前台作业——这对于你想在 shell 中做其他事情稍后返回当前作业时非常有用。作业将停止，直到你将其带回前台或让它在后台运行（参见\
  \ Recipe 3.3.3 [将作业置于前台]，第 73 页并参见 Recipe 3.3.2 [将作业放入后台]，第 72 页）。\n\n例如，如果你正在 `info`\
  \ 中阅读文档，输入 `CTRL-Z` 将挂起 `info` 程序并返回到 shell 提示符，你可以在那里做其他事情（参见 Recipe 2.8.5 [读取\
  \ Info 手册]，第 48 页）。shell 会输出一行提供挂起作业的作业编号（括号内）、文本“Stopped”表示作业已停止，以及命令行本身，如下所示：\n\
  \n```\n[1]+\nStopped\ninfo -f manual.info\n```\n\n在此示例中，作业编号为 1，停止的命令是“info -f manual.info”。作业编号旁边的\
  \ `+` 字符表示最近的一个作业。\n\n如果你在注销时有任何挂起的作业，shell 会提示你，而不是直接注销，如图 3-2 所示。\n\n```bash\n\
  $ logout\nThere are stopped jobs.\n$\n```\n*图 3-2。注销时存在挂起的作业。*\n\n此时，你可以列出你的作业（参见\
  \ Recipe 3.3.4 [列出你的作业]，第 73 页）。\n\n#### 3.3.2 将作业放入后台\n\n输入 `fg` 将后台作业移至前台。默认情况下，`fg`\
  \ 于最近的后台作业。\n\n⇒ 要将最近的后台作业带回前台，请输入：\n\n```bash\n$ fg\n```\n\n当你有多个后台作业时，要将特定作业移至前台，请指定作业编号作为选项。\n\
  \n⇒ 要将作业 3 带回前台，输入：\n\n```bash\n$ fg %3\n```\n\n除非你另有指定，否则新作业都在前台运行。\n\n若要在后台运行作业，请在输入行末尾加上符号（`&`）。\n\
  \n⇒ 例如，要在前台启动命令 `apropos bash shells`，先挂起它，然后将其放入后台，你需要输入：\n\n```bash\n$ apropos\
  \ bash shells\nCTRL-Z\n[1]+\nStopped\napropos bash shells\n$ bg\n[1]+ apropos shell\
  \ &\n```\n\n如果你有挂起的作业，通过提供作业编号来指定要放入后台的作业。\n\n⇒ 要在后台运行作业 4，输入：\n\n```bash\n$ bg\
  \ %4\n```\n\n完成后，shell 将列出作业编号、命令以及文本“Done”，表示作业已完成。\n\n要将作业从前台移到后台，先挂起它（参见 Recipe\
  \ 3.3.1 [挂起作业]，第 71 页），然后输入 `bg`（代表“background”）。\n\n#### 3.3.3 将作业放入前台\n\n输入 `fg`\
  \ 将后台作业移至前台。默认情况下，`fg` 作用于最近的后台作业。\n\n⇒ 要将最近的后台作业带回前台，输入：\n\n```bash\n$ fg\n```\n\
  \n当你有多个后台作业时，要将特定作业移至前台，请指定作业编号。\n\n⇒ 要将作业 3 带回前台，输入：\n\n```bash\n$ fg %3\n```\n\
  \n#### 3.3.4 列出你的作业\n\n要列出当前 shell 中运行的作业，输入 `jobs`。\n\n⇒ 要列出你的作业，输入：\n\n```bash\n\
  $ jobs\n[1]-\nStopped\napropos shell\n[2]+\nStopped\napropos bash\n$\n```\n\n此示例显示了两个作业——`apropos\
  \ shell` 和 `apropos bash`。作业编号旁边的 `+` 字符表示最近的作业，`-` 字符表示最近之前的作业。如果你没有当前作业，`jobs`\
  \ 不返回任何内容。\n\n要列出系统中运行的所有进程，请使用 `ps` 而不是 `jobs`——参见 Recipe 2.7 [列出进程]，第 41 页。\n\n\
  #### 3.3.5 停止作业\n\n输入 `CTRL-C` 在作业完成前中断前台作业，退出程序。\n\n\n\n\n⇒ 要运行 `cat` 工具并在其于前台运行时中断它，请输入：\n\
  \n```bash\n$ cat\n```\nRET\nCTRL-C\nRET\n$\n```\n\n使用 `kill` 来中断（或“杀死”）一个后台作业，并将作业号作为参数。\n\
  \n⇒ 要杀死作业号为 2，请输入：\n\n```bash\n$ kill %2\n```\nRET\n\n## 3.4 使用你的命令历史\n\n你的命令 `history`\
  \ 是你在当前和之前的 shell 会话中已经输入的命令的顺序列表。此历史列表中的命令被称为 `events`（事件）。\n\n默认情况下，`Bash` 记得最后的\
  \ 500 个 `events`，但这个数字是可以配置的（请参见 Recipe 3.7.3 [使用 Shell 启动文件]，[使用 Shell 启动文件]，第\
  \ 86 页）。\n\n你的命令 `history` 存储在家目录下一个名为 `.bash_history` 的文本文件中；你可以像处理其他文本文件一样查看或编辑此文件。\n\
  \n拥有命令 `history` 提供的两个非常实用的功能是：重复你输入的最后一个命令，以及（如本章前面的介绍）对你的历史进行增量反向搜索。\n\n以下章节将解释如何查看历史以及如何在命令行上指定历史事件。有关命令\
  \ `history` 的更多信息，请查阅 `bash` 的 Info 文档（参见 Recipe 2.8.5 [阅读 Info 手册]，[阅读 Info 手册]，第\
  \ 48 页）。\n\n### 3.4.1 查看你的命令历史\n\n使用 `history` 查看你的命令 `history`。它输出 `.bash_history`\
  \ 中所有 `events` 的列表，每行一个，从最旧的事件开始。`Events` 前有事件编号和两个空格。\n\n⇒ 查看你的命令 `history`，输入：\n\
  \n```bash\n$ history\n```\nRET\n1 who\n2 apropos shell >shell-commands\n3 apropos\
  \ bash >bash-commands\n4 history\n$\n```\n\n此命令显示了你的命令 `history` 文件的内容，每行列出一个命令，每个命令前都有其\
  \ `event number`。使用事件编号来指定历史中的该事件（参见 Recipe 3.4.3 [从历史中指定命令]，[从历史中指定命令]，第 76 页）。\n\
  \n如果你的历史很长，此列表将滚出屏幕，在这种情况下，你可能希望将输出通过到 `less` 以便浏览。通过将输出通过到 `grep` 来搜索过去的命令也是常见的（参见\
  \ Recipe 3.2.4 [将输出重定向到另一个命令的输入]，将输出重定向到另一个命令的输入]，第 69 页，以及 Recipe 14.1 [在文本中搜索单词]，在文本中搜索单词]，第\
  \ 333 页）。\n\n⇒ 在你的历史中搜索文本“apropos”，输入：\n\n```bash\n$ history | grep apropos\n```\n\
  RET\n2 apropos shell >shell-commands\n3 apropos bash >bash-commands\n5 history |\
  \ grep apropos\n$\n```\n\n此命令将显示你的历史中包含文本“apropos”的 `events`。（输出的最后一行是你刚刚输入的命令。）\n\
  \n### 3.4.2 搜索你的命令历史\n\n搜索历史有两种方法。\n\n#### 方法 #1\n\n你可以使用 `Bash` 的反向增量搜索功能 `CTRL-R`\
  \ 来反向（`search`）你的命令历史。如果你记得最近输入过一条包含“foo”的命令行，并且希望重复该命令而无需重新输入，你会发现这非常有用。输入 `CTRL-R`\
  \ 后跟文本 `foo`，你输入过的包含“foo”的最后一个命令就会出现在输入行上。\n\n与同名的 `Emacs` 命令（参见 Recipe 14.9.1 [在\
  \ Emacs 中增量搜索]，在 Emacs 中增量搜索]，第 352 页）一样，这被称为 `incremental`（增量）搜索，因为它随着你的输入逐字符增加地构建搜索字符串。输入字符串“cat”将在你输入搜索字符串的每个字符时搜索（并显示）包含“c”、“ca”，最后是“cat”的输入行。再次输入\
  \ `CTRL-R` 将检索下一个匹配搜索字符串的命令行。\n\n⇒ 这里有两种使用此功能的方法。\n\n* 将你输入的包含字符串“grep”的最后一个命令放回输入行，输入：\n\
  \n```bash\n$ CTRL-R\n(reverse-i-search)`':grep\n```\n\n* 将你输入的包含字符串“grep”的倒数第三个命令放回输入行，输入：\n\
  \n```bash\n$ CTRL-R\n(reverse-i-search)`':grep\nCTRL-R\nCTRL-R\n```\n\n**注意：** 当命令显示在输入行上，输入\
  \ `RET` 运行它。你也可以像往常编辑命令行。\n\n#### 方法 #2\n\n你也可以将历史通过 `grep` 输出输出匹配模式的行（参见 Recipe\
  \ 14.2 [在文本中搜索短语]，在文本中搜索短语]，第 334 页）。这不会在输入行上放置任何内容，但会一次给出所有匹配项。你可能还希望将此输出通过到 `less`\
  \ 等文本分页器（参见 Recipe 9.1 [浏览文本]，浏览文本]，第 211 页）。\n\n⇒ 查看你的命令历史中包含文本“newfile”的所有行，输入：\n\
  \n```bash\n$ history | grep newfile | less\n```\nRET\n\n### 3.4.3 从历史中指定命令\n\n你可以在输入行上指定历史中的过去事件以便再次运行它。\n\
  \n指定历史事件最简单的方法是在 shell 提示符处使用 `up` 和 `down` 箭头键来浏览历史。`up` 键带你回到之前的事件，`down` 键带你移动到更最近的事件。当历史事件位于输入行上时，你可以像正常一样编辑它，并输入\
  \ `RET` 运行它。\n\n通过编号指定历史事件，输入感叹号 (`!`) 后紧跟事件编号（参见 Recipe 3.4.1 [查看命令历史]，查看命令历史]，第\
  \ 74 页）。\n\n⇒ 指定事件编号 1，输入：\n\n```bash\n$ !1\n```\nRET\n\n**注意：** 特殊事件编号 `!!` 是运行你输入的最后一个命令的另一种方式。\n\
  \n## 3.5 使用变量\n\nshell `variable`（变量）是一个存储值并具有唯一名称的符号。当引用它的名称时，就会给出它包含的值。变量对大小写敏感，因此\
  \ `NAME`、`Name` 和 `name` 都是不同的变量。\n\n你可以分配自己的变量，但也有许多对 shell 有特殊含义的内置变量。其中 `HOME`\
  \ 包含家目录名称。变量经常被脚本和程序使用。例如，一种约定是使用 `EDITOR` 变量来存储首选编辑器；程序经常检查此变量是否设置，并运行该编辑器。\n\n\
  变量在脚本中使用非常有用，脚本将在本章后面部分介绍。\n\n以下配方将解释如何使用变量，并展示使用某些内置变量可以做的事情。有关这些变量的完整列表，请查阅 `bash`\
  \ 手手册（参见 Recipe 2.8.4 [阅读系统手册页]，阅读手册页]，第 46 页）。\n\n### 3.5.1 分配变量\n\n要分配新变量，输入其名称后跟一个等号\
  \ `=` 和应作为变量值的引号字符串。确保不要在等号两侧输入任何空格字符。\n\n⇒ 创建名为 `NAME` 的新变量并赋值为“Mary Jones”，输入：\n\
  \n```bash\n$ NAME='Mary Jones'\n```\nRET\n\n值本身可以包含变量，这些变量在变量赋值时会被展开。你可以使用任何引用方法给出值，并可以指定命令的输出（参见\
  \ Recipe 3.1.11 [将命令的输出作为参数]，将命令输出作为参数]，第 65 页）。\n\n⇒ 这里有两种使用此功能的方法。\n\n* 给名为 `NAME`\
  \ 的变量赋值 `FIRSTNAME` 和 `LASTNAME` 变量的内容，中间留一个空格，输入：\n\n```bash\n$ NAME=\"$FIRSTNAME\
  \ $LASTNAME\"\n```\nRET\n\n* 给名为 `NAME` 的变量赋值 `whoami` 命令的输出，输入：\n\n```bash\n$ NAME=`whoami`\n\
  ```\nRET\n\n要更改现有变量的内容，只需提供其名称作为要使用的变量。\n\n⇒ 为名为 `NAME` 的现有变量分配新值，输入：\n\n```bash\n\
  $ NAME=\"whoami\"\n```\nRET\n\n\n\n\n此命令将值“whoami”赋值给变量 `NAME`。\n\n### 3.5.2 引用变量\n\
  \n在命令中，通过在变量名之前加上美元符号 ($) 来引用变量。当执行命令时，shell 将首先将变量单词（以及美元符号）替换为存储在该变量单词中的值。这个过程被称为*扩展*（expansion）。\n\
  \n*⇒ 要将 `NAME` 变量的值作为命令执行，请输入：`$NAME`\n\n```\nRET\nmary\n$\n``` \n\n如果 `NAME` 变量的值为“whoami”，将其作为命令引用将将运行\
  \ `whoami` 工具（参见食谱 2.6.1 [显示你的用户名]，第 39 页）。在本文示例中，发生的就是这种情况，且用户名是 `mary`。\n\n###\
  \ 3.5.3 显示变量的内容\n\n当你想要查看变量的内容时，使用 `echo` 并将变量作为参数引用。\n\n*⇒ 要显示变量 `NAME` 的内容，请输入：`echo\
  \ $NAME`\n\n```\nRET\nwhoami\n$\n```\n\n在本示例中，显示变量 `NAME` 包含字符串“whoami”。\n\n当你想在变量名之后立即输出其他字符时，将变量名括在大括号\
  \ ({}) 中，并将美元符号放在外面且紧接其前。\n\n*⇒ 要显示变量 `NAME` 的内容并跟上字符串“now”，请输入：`echo ${NAME}now`\n\
  \n```\nRET\nwhoaminow\n$\n```\n\n如果没有大括号，在 shell 看来就像是你正在引用一个名为 `NAMEnow` 的变量。\n\
  \n### 3.5.4 移除变量\n\n关于变量，你可以移除两个部分：它的内容，以及变量本身。要移除现有变量的*内容*，请给它赋值一个新值，但不提供任何内容。该变量仍然存在，但它将被赋值为空字符串（有时称为“空字符串”，因为它的值是无）。\n\
  \n*⇒ 要给名为 `NAME` 的变量赋予空字符串的值，请输入：`NAME=`\n\n```\nRET\n```\n\n要移除变量本身（无论它包含什么值），请请使用\
  \ `unset` 并提供变量名。\n\n*⇒ 要移除名为 `NAME` 的变量，请输入：`unset NAME`\n\n```\nRET\n```\n\n###\
  \ 3.5.5 列出变量\n\n使用不带选项的 `set` 来显示当前 shell 中的所有变量及其它们包含的值。\n\n*⇒ 要列出当前 shell 中的所有变量，请输入：`set`\n\
  \n```\nRET\n```\n\n### 3.5.6 更改 shell 提示符\n\n特殊变量 `PS1` 用于 shell 提示符的文本。要更改 shell\
  \ 提示符的文本，请更改此变量的内容。\n\n*⇒ 要将你的 shell 提示符改为“Your wish is my command:\",请输入：`PS1=\"\
  Your wish is my command:\"`\n\n```\nRET\nYour wish is my command:\n```\n\n由于替换文本包含空格，我对其加上了引号（参见食谱\
  \ 3.1.3 [引用保留字符]，第 56 页）。\n\n你可以在提示符变量中放置特殊字符，以便输出特殊文本。例如，`PS1` 值中的字符“\\w”会在 shell\
  \ 提示符文本在该处列出当前工作目录。\n\n*⇒ 要将提示符更改为默认 Bash 提示符——当前工作目录后跟一个“$”字符——请输入：`PS1='\\w $'`\n\
  \n```\nRET\n~ $\n```\n\n下表列出了一些特殊字符及其在 shell 提示符中的文本输出。\n\n- `\\a`: 警告或“铃声”字符，会触发系统铃声（你可以通过输入\
  \ `CTRL-G` 自己触发它）。\n- `\\d`: 当前日期。\n- `\\h`: 系统的主机名。\n- `\\n`: 换行符。\n- `\\t`: 当前系统时间（24\
  \ 小时制）。\n- `\\@`: 当前系统时间（12 小时制）。\n- `\\w`: 当前工作目录。\n- `\\u`: 你的用户名。\n- `\\!`: 命令历史。\n\
  \n你可以在创建 `PS1` 时将这些特殊字符与普通字符结合。\n\n*⇒ 要将提示符改为当前日期、主机名和大于字符，请输入：`PS1='\\d (\\h)>'`\n\
  \n```\nRET\n14 Dec 99 (ithaca)>\n``` \n\n在本示例中，系统主机名是 `ithaca`。\n\n### 3.5.7 添加路径\n\
  \n要向路径中添加或删除目录，请使用文本编辑器修改 `PATH` 变量，正如它在你家目录下的 `.bashrc` 文件中定义的那样（参见第 231 页的编辑文本）。\n\
  \n例如，假设 `.bashrc` 中定义 `PATH` 的行如下：\n`PATH=\"/usr/bin:/bin:/usr/games:/games\"`\n\
  \n你可以通过如下修改将 `/home/nancy/bin` 添加到此路径：\n`PATH=\"/usr/bin:/bin:/usr/games:/games:/home/nancy/bin\"\
  `\n\n**注意:** 参见第 5 章 [文件和目录] 获取关于路径的完整说明。\n\n### 3.5.8 控制 shell 提示符\n\n使用 `alias`\
  \ 为命令设置别名；后面跟随别名名称、等号 (=) 以及别名单词应代表的引号字符串。\n\n*⇒ 要为退出命令设置别名，请输入：`alias bye=\"exit\"\
  `\n\n```\nRET\n```\n\n此命令为当前 shell 中的退出工具设置了别名“bye”，因此输入 *bye* 将运行 `exit`。\n\n你可以在别名中包含选项和参数。这样做时，请确保将整个别名括在双引号中。\n\
  \n*⇒ 要为允许颜色显示的终端设置“ls”别名以列出目录，请输入：`alias ls=\"ls --color=auto\"`\n\n```\nRET\n```\n\
  \n特殊变量 `SECONDS` 包含了 shell 运行的秒数。\n\n*⇒ 要查看 shell 运行了多少秒，请输入：`SECONDS=$`\n\n```\n\
  RET\n```\n\n**注意:** 要获取 shell 以分钟、小时或其他单位的运行时间，你可以转换输出的秒数（参见食谱 29.5.1 [单位间的转换]，第\
  \ 567 页）。\n\n### 3.6 使用别名单词\n\n*别名*是代表其他命令的单词——可能是工具名称、长命令行或你喜欢的任何内容。别名对于为常用命令创建短命令名非常有用。\n\
  \n### 3.6.1 通过其他名称调用命令\n\n要关闭邮件，将 `MAIL` 设置为空。\n\n*⇒ 要关闭邮件，请输入：`MAIL=`\n\n```\n\
  RET\n```\n\n\n\n\n\n指定了 `color=auto` 选项，当输出重定向到能够显示颜色的终端时设置颜色。\n\n这是一个常用的别名，许多 Linux\
  \ 系统在默认的 `.bashrc` 文件中预配置了它。将“l”设为带有 `-l` 选项的 `ls` 名也很常见（参见方案 5.3.3 [列出文件属性]，第 136\
  \ 页）。\n\n当你定义了这个别名后，你仍然可以通过指定其他选项来向 `ls` 传递参数；因此，在这种情况下输入 `ls -l` 将执行 `ls --color=auto\
  \ -l` 作为实际命令。\n\n别名在 shell 查找路径（path）之前始终会被展开，因此，要运行一个名称与别名相同的工具或程序，请提供要运行程序的完整路径（关于路径的更多信息请参见第\
  \ 5 章 [文件和目录]，第 125 页）。\n\n当“ls”已定义为某些内容的别名时，要带 `-l` 选项运行实际的 `ls` 工具，请输入：\n\n```bash\n\
  $ /bin/ls -l\n```\n\n**注意：** 当你定义一个别名时，它只在当前 shell 中有效。要让别名在每次运行 shell 时都生效，请将其放入你家目录下的\
  \ `.bashrc` 启动文件中，它是家目录中的一个隐藏文件。\n\n### 3.6.2 列出别名\n\n要列出当前 shell 中定义的别名，只需使用不带任何参数的\
  \ `alias`。\n\n要列出当前定义的所有别名，输入：\n\n```bash\n$ alias\n```\n\n### 3.6.3 删除别名\n\n要删除别名，请使用\
  \ `unalias` 并将要删除的别名名称作为参数。它在 shell 会话期间会被移除，除非你再次将该词设为别名。\n\n删除“ls”的别名，请输入：\n\n\
  ```bash\n$ unalias ls\n```\n\n**注意：** 如果你在 `.bashrc` 或 `.bash_profile` 文件中设置了别名，这将删除它——但仅针对当前\
  \ shell。要从以后所有的会话中删除此类别名，请编辑定义它的文件并移除特定的别名行。\n\n### 3.7 使用 shell 脚本\n\n你已经知道 shell\
  \ 拥门编程语言；构成 Bash 编程语言的命令包含我在本章中讨论的那些。shell 程序简单来说是供 shell 执行的一系列命令；*shell 脚本*是一个包含此类序列的文本文件。脚本也是可执行的，因此你可以通过输入它们的名称作为命令来运行它们（参见方案\
  \ 6.3.6 [使文件变为可执行]，第 170 页）。\n\n下面的方案展示了如何创建和运行脚本，以及你如何在启动或停止运行 shell 时自动运行特殊脚本。\n\
  \n#### 3.7.1 创建 shell 脚本\n\n由于 shell 脚本是文本文件，因此你使用文本编辑器来创建一个（参见第 10 章 [编辑文本]，第 231\
  \ 页）；然后将文件设为可执行以便其运行。为 Bash 编写的脚本都包含两种方式之一编写的第一行：\n\n```bash\n#!/bin/bash\n```\n\
  \n或\n\n```bash\n#!/bin/sh\n```\n\n两个示例中的井号和感叹号（`#!`）指示 shell 该文件包含要执行的命令；随其后的完整路径告诉\
  \ shell 使用哪个程序来执行命令——这可以是 shell 的名称、`perl`、`sed`、`awk` 或其他命令语言的名称。\n\n第一个示例告诉 Bash\
  \ 该文件将由 `bash` 程序本身（可执行文件 `/bin/bash`）执行，而不是其他程序。\n\n第二个示例告诉 Bash 该文件将由 `/bin/sh`\
  \ 执行，在现代系统中，它是 `bash` 可执行文件的另一个名称。`sh` 曾是旧的 Bourne shell，Bash 取代了它。Bash 可以运行任何 Bourne\
  \ shell 脚本，你会发现许多人仍然在他们的 Bash 脚本中写 `/bin/sh`。\n\n要创建一个名为 `hello` 且仅向标准输出输出文本“Hello,\
  \ world”的 Bash shell 脚本，请执行以下操作：\n\n1. 使用文本编辑器在名为 `hello` 的文件中放入以下内容：\n\n```bash\n\
  #!/bin/sh\necho Hello, world\n```\n\n2. 使用 `chmod` 使文件变为可执行：\n\n```bash\n$ chmod\
  \ a+x hello\n```\n\n#### 3.7.2 运行 shell 脚本\n\n你通过提供文件名作为命令来运行（或“执行”）shell 脚本，就像运行任何其他程序一样。该文件必须具有执行权限。从技术上讲，`/bin/sh`\
  \ 是指向 `/bin/bash` 的符号链接，这样做是为了与旧脚本的向后兼容（参见方案 5.7 [给文件起多个名称]，第 152 页）。脚本像其他类型的程序一样接受参数。\n\
  \n如果脚本存储在你的路径所在的目录中（参见方案 3.5.7 [添加到你的路径]，第 81 页），只需输入脚本名称即可运行它。\n\n否则，提供脚本的路径（完整路径或相对路径）来运行它（完整和相对路径将在第\
  \ 5 章 [文件和目录]，第 125 页中讨论）。\n\n以下是使用此方法的几种方式：\n\n* 运行存储在路径目录中的名为 `hello` 的脚本，输入：\n\
  \n```bash\n$ hello\n```\n\n* 运行存储在非路径目录中的名为 `hello` 的脚本，输入：\n\n```bash\n$ ./hello\n\
  ```\n\n* 运行存储在你家目录中的名为 `hello` 的脚本，输入：\n\n```bash\n$ ~/hello\n```\n\n**注意：** 为了保持整洁并避免必须通过全路径调用脚本，你应该将它们放在自己的目录中，正如方案\
  \ C [使用目录存放二进制文件] 第 727 页所述的那样。\n\n#### 3.7.3 使用启动文件\n\n每当你登录、注销或启动新 shell 时，shell\
  \ 都会在你的家目录查找特殊文件并执行它们包含的命令。这些被称为启动文件，因为它们在你启动（或停止）shell 时会自动运行。\n\n当你登录时，Bash 首先检查\
  \ `/etc/profile` 是否存在，如果存在，则执行该文件中的命令。这是一个通用的系统级启动文件，适用于所有用户；只有系统管理员可以添加、删除或更改此文件的命令。接下来，Bash\
  \ 读取并执行你家目录下的 `.bashrc` 文件（参见 5.3.4 [隐藏文件]，第 138 页）。因此，要让一个命令每次登录时都运行，请将命令添加到此文件中。\n\
  \n对于登录后启动的所有新 shell（即除登录 shell 外），Bash 都会读取并执行你家目录下的 `.bashrc` 文件。\n\n\n\n\n这使得\
  \ `Bash` 在你登录时运行你主目录下的 `.bashrc` 文件。通过这种方式，你可以将*所有*自定义内容都放在 `.bashrc` 文件中，它们将在登录时以及后续的所有\
  \ shell 中*都*运行。`.bash_profile` 中此行之前的任何自定义内容只会在你登录时运行。\n\n例如，一个简单的 `.bash_profile`\
  \ 可能看起来如图 3-3 所示，相应的，一个简单的 `.bashrc` 文件可能看起来如图 3-4 所示。\n\n图 3-3 中的 `.bash_profile`\
  \ 使用 `figlet` 文本字体工具打印欢迎消息（参见食谱 16.4.1 [输出水平文本字体]，第 401 页），然后运行用户的 `.bashrc` 文件。\n\
  \n图 3-4 中的 `.bashrc` 设置了几个实用的命令别名，并在每次运行新 shell 时使用自定义路径和 shell 提示符。\n\n当你注销时，如果存在，`Bash`\
  \ 会读取并执行你主目录下的 `.bash_logout` 文件中的命令。\n\n若要在注销时运行命令，请将它们放入此文件中。\n\n*⇒* 若要在每次注销时清除屏幕，你的\
  \ `.bash_logout` 应该包含以下行：\n\n```bash\nclear\n```\n\n这会执行 `clear` 命令，从而清除当前终端的屏幕。\n\
  \n**注意：** 某些发行版自带了默认 shell 启动文件，其中充满了各种有趣的内容。Debian 用户可能想查看位于 `/usr/share/doc/bash/examples/startup-files`\
  \ 的示例启动文件。\n\n## 3.8 创建 Shell 会话的类型记录\n\n使用 `script` 创建 shell 会话的类型记录（typescript），或“捕获日志”——它会将你的会话逐字复制到文件中，包括你输入的命令及其输出。这对于你在系统上执行大型操作时非常有用——例如安装或升级某些软件，或者更改配置。正如其帮助页中所出的，编程指导老师在学生提交作业时，通常要求学生提供一份编译和运行程序的操作“脚本（script）”记录。\n\
  \n文件的第一行和最后一行显示了捕获会话的开始和结束时间及日期。要停止记录类型记录，在 shell 提示符处输入 `exit`。默认情况下，类型记录保存到当前目录下的名为\
  \ `typescript` 的文件中；可以通过参数指定文件名。\n\n*⇒* 若要创建一个 shell 会话的类型记录并将其保存到文件 `log.19990525`\
  \ 中，输入：\n\n```bash\n$ script log.19990525\nScript started, output file is log.19990525\n\
  $ hostname\n$ apropos bash > bash.commands\n$ exit\nexit\nScript done, output file\
  \ is log.19990525\n```\n\n在这个示例中，类型记录将一个包含两个命令（`hostname` 和 `apropos`）的 shell 会话记录到名为\
  \ `log.19990525` 的文件中。该类型记录看起来如图 3-5 所示。\n\n```text\nScript started on Tue May 25\
  \ 14:21:52 1999\n$ hostname\n$ apropos bash > bash.commands\n$ exit\nexit\nScript\
  \ done on Tue May 25 14:22:30 1999\n```\n*图 3-5。shell 会话的类型记录。*\n\n**注意：** 如果你用\
  \ `Emacs` 或 `Vi` 等交互式程序记录会话，你将对输出感到失望。这是因为此类程序控制显示；它们所有操作屏幕的序列都将保存到类型记录中，在人类看来它们将显示为乱码字符。\n\
  \n在另一个脚本会话内部运行 `script` 是可能的，但通常不是理想的。这通常发生在你忘记自己正在运行它，而在当前类型记录内部再次运行它时，甚至运行了多次。结果是，你可能会得到多个像俄罗斯套娃一样“嵌套”在一起的会话。\n\
  \n## 3.9 运行 shell\n\n有时启动另一个 shell 是有意义的。如果你正在运行一种 shell 并想运行另一种，或者如果你想在运行命令之前更改某些\
  \ shell 设置，并在完成后恢复到之前的设置，就可以这样做。\n\n接下来的食谱涉及了 shell 的运行。\n\n### 3.9.1 启动 shell\n\
  \n启动 shell 有不同的不同的方法。一种方法是在你当前的 shell 内部运行 shell，另一种方法是用新 shell *替换*你当前的 shell。\n\
  \n**方法 #1**\n\n若要启动另一个 shell 稍后返回当前的 shell，只需通过提供其命令名称（例如运行 `Bash` 的命令是 `bash`）来运行新\
  \ shell。\n\n这将挂起你当前的 shell 并运行新 shell；当你退出新 shell 时，你将返回旧 shell。\n\n*⇒* 若要运行一个新的\
  \ `Bash` shell，输入：\n\n```bash\n$ bash\n```\n\n**方法 #2**\n\n若要*替换*你当前的 shell 来运行\
  \ shell，请使用 `exec`。将你想运行的新 shell 的命令名称作为参数。这会停止你当前的 shell 并用新 shell 替换它。如果你在登录 shell\
  \ 中运行此命令，那么当你退出新 shell 时，你会被注销。\n\n*⇒* 若要替换当前的 shell 运行 `Csh`，输入：\n\n```bash\n$\
  \ exec csh\n```\n\n**注意：** 你可以使用 `exec` 替换当前 shell 来运行任何命令，而不只是另一个 shell。\n\n###\
  \ 3.9.2 退出 shell\n\n使用 `exit` 退出当前 shell。这是一个内置命令。\n\n*⇒* 若要退出 shell，输入：\n\n```bash\n\
  $ exit\n```\n\n你也可以在 shell 提示符处按下 `CTRL-D`。\n\n### 3.9.3 获取当前 shell 的名称\n\n这里有一个显示你当前\
  \ shell 名称的技巧。特殊变量 `$0` 总是被赋值为当前运行 shell 的名称（参见第 77 页的[使用 shell 变量]）。因此在 shell 提示符处使用\
  \ `echo` 查看你正在使用的 shell。\n\n*⇒* 若要查看你正在使用的 shell，输入：\n\n```bash\n$ echo $0\n```\n\
  \n**注意：** 这在大多数 shell 中都有效，但也有例外。对于 `tclsh` 和 `wish` 程序，它会输出以下错误信息：“无法读取 0：没有这样的变量”。\n\
  \n### 3.9.4 更改默认 shell\n\n使用 `chsh` 更改你的默认 shell。当你运行它时，`chsh` 会出于安全考虑要求输入密码，然后询问你想替换为什么\
  \ shell。你的回答必须是系统中已存在的 shell。如果你改变主意，在询问时直接按回车——这样你的登录 shell 将不会更改。\n\n*⇒* 若要将默认\
  \ shell 改为 `pdmenu`，输入：\n\n```bash\n$ chsh\nPassword: sesame\nChanging login shell\
  \ for suzie\nEnter the new value, or press return for the default\nLogin Shell [/bin/bash]:\
  \ pdmenu\n```\n\n在这个示例中，用户 suzie（密码为 sesame）将登录 shell 更改为 `pdmenu`，该 shell 在下一个食谱中描述。\n\
  \n### 3.9.5 使用其他 shell\n\n本章内容都是关于 `Bash` 的，如果真的存在“Linux shell”，那它它——以 `Bash` 作为默认的系统比任何其他\
  \ shell 都多。但有很多种 shell，就像文本编辑器和发行版一样，每个人都有自己喜欢的。你有许多选择，它们的工作方式各不相同，都有自己的魅力（和麻烦）。\n\
  \n大多数普通用户没有理由运行 `Bash`以外的任何 shell，但如果你是程序员或从其他 Unix 背景进入 Linux，你可能已经有了自己喜欢的 shell。\n\
  \n下表描述了一些替代方案。\n\nAsh\n\nnetbsd 的 `ash`（“Almquist shell”）比 `Bash` 小，并且具有与原始 Bourne\
  \ shell 类似的功能。适用于软磁盘运行的 Linux 和小型安装。\n\nDEB: ash\nRPM: ash\nWWW: http://sources.isc.org/utils/shell/ash.txt\n\
  \n3 列表保存在 `/etc/shells` 中。\n\n\n“sea shell”（海壳）的界面类似于 C 语言语言，它源于 bsd 版本的 unix，因此在这些系统中非常流行。\n\
  \nDEB: `csh`\n\nRPM: `tcsh`\n\nWWW: `http://tcshrc.sourceforge.net/`\n\n## Esh\n\
  “easy shell”（易用 shell）是一个小型 shell，它使用类 Lisp 语法作为主要的交互手段。\n\nDEB: `esh`\n\nRPM: `esh`\n\
  \nWWW: `http://olympus.het.brown.edu/doc/esh/esh.html`\n\n## Eshell\n\n一个完整的 Emacs\
  \ 命令行 shell，使用 Emacs Lisp 作为接口。\n\nDEB: `eshell`\n\nWWW: `http://www.emacswiki.org/johnw/EmacsShell.html`\n\
  \n## Lsh\n\n受旧式 pc 命令解释器的启发，这是一个为那些有 dos 经验但新接触 unix 的学者设计的 shell。\n\nDEB: `lsh`\n\
  \n## Psh\n\n一个使用 perl 编程语言语法和特性的 shell。\n\nDEB: `psh`\n\nRPM: `psh`\n\nWWW: `http://sourceforge.net/projects/psh/`\n\
  \n## Pdksh\n\nat&t 的 Korn shell，以其作者 David Korn 命名，它结合了 Csh 和原始 shell 的特性；Pdksh\
  \ 是这个老旧 unix 备品的公共领域实现。\n\nDEB: `pdksh`\n\nRPM: `pdksh`\n\nWWW: `http://web.cs.mun.ca/~michael/pdksh/`\n\
  \n## Pdmenu\n\n这是一个全屏彩色文本菜单系统，旨在为没有经验的用户提供选择和运行程序。\n\nDEB: `pdmenu`\n\nRPM: `pdmenu`\n\
  \nWWW: `http://kitenet.net/programs/pdmenu/`\n\n## rc\n\n基于 at&t Plan 9 shell，这是一个语法类似于\
  \ C 语言语言的快速 shell。\n\nDEB: `rc`\n\nWWW: `http://www.star.le.ac.uk/~tjg/rc/`\n\n\
  ## Tcsh\n\ntenex C shell 是 Csh 的增强版本。\n\nDEB: `tcsh`\n\nRPM: `tsch`\n\nWWW: `http://www.tcsh.org/`\n\
  \n## Zsh\n\n类似于 Korn shell，但具有拼写纠错和脚本增强等功能。\n\nDEB: `zsh`\n\nRPM: `zsh`\n\nWWW:\
  \ `http://www.zsh.org/`\n\n# 第 4 章：X Window 系统\n\n## 4. X Window System\n\n### XFree86\n\
  \nDEB: `xserver-common`\n\nRPM: `XFree86`\n\nWWW: `http://www.xfree86.org/`\n\n\
  X Window 系统通常称为“X”，1 是一个所有流行的 Linux 发行版自带的图形窗口界面。X 适用于许多基于 unix 的操作系统；运行在带有 x86\
  \ CPU 的 Linux 系统上的 X 版本被称为“XFree86”。X 的当前版本是 11 第 6 版——或“X11R6”。\n\n你可以在台中运行的所有命令行工具和大多数应用程序都可以在\
  \ X 中运行；还有许多专门为 X 编写的应用程序。\n\n通常，你从控制台运行 X，但也有其他方法。\n\n当你在这系统上运行 X 时，可以从远程系统运行某些图形程序并将其显示在你的屏幕上；还有专门为\
  \ X 设计并连接到主系统的特殊终端。这些终端只需要键盘、鼠标和显示器而没有处理能力，就像哑终端（参见 Recipe 2.3 [使用控制台和终端]，第 32 页），但它们是为访问\
  \ X Window 系统设计的，被称为*X 终端*。\n\n本章将向你如何在 X 中操作：如何启动和停止它、在其中运行程序、操作窗口以及根据喜好自定义 X。参见\
  \ *The Linux XFree86 HOWTO* 获取有关安装 X 的信息（参见 Recipe 2.8.6 [读取系统文档和帮助文件]，第 50 页）。\n\
  \n## 4.1 运行 X\n\n当你启动 X 时，你应该能看到鼠标指针出现在屏幕上，作为一个巨大的黑色“X”。如果你的 X 配置为启动任何工具或应用程序，它们应该各自启动并出现在独立的窗口中。一个非常基础简单的\
  \ X 会话可能像图 4-1 所示。\n\n*根窗口*（root window）是所有其他窗口后面的背景。它通常被设置为颜色，但你可以更改它（参见 Recipe\
  \ 4.7.3 [更改根窗口参数]，第 118 页）。X 中的每个程序或应用程序都运行在自己的窗口中。每个窗口在部分或全部侧边都有装饰边框，被称为*窗口边框*（window\
  \ border）；L 型的角称为*帧*（frames）；顶部的窗口栏称为*标题栏*（title bar），它显示窗口名称；标题栏左侧和右侧有几个标题栏按钮（见\
  \ Recipe 4.3 [操作 X 客户端窗口]，第 105 页）。取决于窗口管理器及其设置，这些元素中的任何一个可能是不可见的。\n\n*图 4-1。一个简单的\
  \ X 会话。*\n\n整个可见工作区域包括根窗口和任何其他窗口，被称为*桌面*（desktop）。右下角的框被称为*页管理器*（pager），它允许你在大型桌面上移动（参见\
  \ Recipe 4.4 [在桌面上移动]）。\n\n有时你可能会捕捉到听到它被称为“X Windows”，但这个术语在技术上是不准确的。\n\n![](img/index-130_1.png)\n\
  \n*窗口管理器*（window manager）是一个控制窗口外观和显示方式的程序。窗口管理器通常允许你自定义窗口的颜色和边框，如上图所示。有很多窗口管理器可以选择，它们各不相同；本章不是只描述一个，或浅尝地描述所有它们，而是解释\
  \ X 的*基础*，即无论配置如何，每个人使用 X 都必须知道的基础知识，而且这些知识是所有窗口管理器共有的。\n\n近年来，*桌面环境*（desktop environments）也变得流行。这些是运行在窗口管理器之上的应用程序套件，目的是为你的\
  \ X 会话提供标准的“外观和感受”；这些套件通常带有几个工具，如时钟和文件管理器。\n\n两个主要的桌面是 gnome（gnu 项目的“gnu 网络对象环境”）和\
  \ kde（“K 桌面环境”）。2\n\n如果你使用一个较新的 Linux 发行版并选择了默认安装，那么很有可能你已经安装了 gnome 或 kde，并分配了类似\
  \ Window Maker 或 fwm2 的作为默认窗口管理器。（虽然你可以在系统上安装多个管理器，但你一次只能运行一个。）\n\n2 桌面旨在为 X 提供一个直观且易于使用的界面，因此在书中我解释\
  \ X 本身的基础知识；从它们的网站了解更多关于这些桌面环境的信息：http://gnome.org/ 和 http://kde.org/。\n\n![](img/index-131_1.png)\n\
  \n### 4.1.1 启动 X\n\n有两种启动 X 的主要方法。你如何在系统上启动它取决于是否安装了 X 显示管理器。\n\n### 方法 1\n\nXdm\n\
  \nDEB: `xdm`\n\nRPM: `xdm`\n\nWWW: `http://www.xfree86.org/`\n\n如果安装了 X 显示管理器 xdm，请使用它来管理你的\
  \ X 会话。\n\n安装了它的系统通常配置为系统启动时进入第七个虚拟控制台，因此你会立即看到图形化的 xdm 登录界面。某些发行版会自定义此登录界面——例如，Fedora\
  \ 显示“Fedora Core”标志并在下方画一个用于输入用户名的框。\n\n你可以直接从这个界面登录到 X 会话，在相应的框中输入你的用户名和密码。\n\n\
  \n\n\n当 `xdm` 运行时但系统未配置为在启动时进入第七个虚拟控制台时，请切换到该控制台，以便登录 X 会话。\n\n⇒ 要切换到第七个虚拟控制台，请输入：`ALT-F7`\n\
  \n### 方法 #2\n\n在未运行 `xdm` 的系统上，预留给 X 的虚拟控制台将是空白，直到你在另一个虚拟控制台中通过运行 `startx` 手动启动\
  \ X。来自 `startx` 的信息（包括任何错误信息）将显示在执行运行该命令的控制台中，而 X 本身将在第七个虚拟控制台中运行。\n\n⇒ 这里有两种使用此的方法：\n\
  \n* 从另一个虚拟控制台手动启动 X，请输入：`$ startx`\n\n* 运行 `startx` 并将其标准输出和标准错误都重定向到日志文件，输入：\n\
  \  `$ startx & > ~/startx.log`\n\n# 第 4 章：X 窗口系统\n\n这两个示例无论你 own 执行命令时处于哪个控制台，都会在第七个虚拟控制台上启动\
  \ X——你的控制台会自动切换到第七个控制台的 X。你可以在 X 会话期间随时切换到另一个控制台（参见食谱 2.3 [使用控制台和终端]，第 32 页）。第二个示例将\
  \ `startx` 的任何错误信息或输出写入你主目录中名为 `startx.log` 的文件中。\n\n当你启动 X 时，可以指定使用的 `color depth`（颜色深度），它是用于渲染显示器上每个像素的可能颜色所使用的位数（bits）。\n\
  \n它是以 2 的幂次形式指定的；因此，8 位颜色意味着像素可以是 $2⁸$ 或 256 种可能颜色中的一种；16 位颜色提供 65,536 种可能的颜色（$2^{16}$），而\
  \ 24 位颜色（$2^{24}$）像素可以是 16,777,216 种颜色中的任意一种（那么 1 位颜色正好是两种颜色）。颜色深度受显示硬件限制。根据你的系统配置和显卡，X\
  \ 可能会以 8 位到 24 位之间的任何默认颜色深度启动。\n\n你可以通过带有特殊选项 `-bpp` 的 `startx` 来指定另一种颜色深度；后面跟随一个指示要使用的颜色深度的数字，并在选项前加上两个字符（`--`），这告诉\
  \ `startx` 将后面的选项传递给 X 服务器本身。\n\n⇒ 从虚拟控制台启动 X 并指定 24 位颜色深度，输入：`$ startx -- -bpp\
  \ 24`\n\n**注意：** 如果你的系统运行 `xdm`，你可以随时切换到第七个虚拟控制台（或 `xdm` 运行的任何控制台），然后在 `xdm` 登录界面登录。\n\
  \n## 4.1.2 停止 X\n\n停止 X 有几种方法。\n\n### 方法 #1\n\n结束 X 会话的正常方法是通过你的窗口管理器来进行。\n\n大多数窗口管理器都有\
  \ `Exit X`（退出 X）菜单选项或类似的选项，你可以用鼠标选择；另一些带有退出 X 的快捷键命令。\n\n⇒ 这里有一些使用此方法的方法。\n\n* 如果你正在运行\
  \ `fvwm2` 窗口管理器，请执行以下操作：\n  1. 在根窗口的任何地方点击左鼠标键弹出启动菜单。\n  2. 从 `Exit Fvwm` 子菜单中选择\
  \ `Really quit?`（真的退出吗？）。\n\n* 如果你正在运行 `AfterStep` 窗口管理器，请执行以下操作：\n  1. 在根窗口的任何地方点击左鼠标键弹出启动菜单。\n\
  \  2. 从 `Quit`（退出）子菜单中选择 `Exit?`（退出吗？）。\n  3. 点击 `Logout`（注销）。\n\n* 如果你正在运行 `Ion`\
  \ 窗口管理器，请执行以下操作：\n  1. 按 `F12`。\n  2. 在 Ion 模式行回答“y”：\n     `Exit Ion (y/n)? y`\n\
  \n如果你是用 `startx` 启动 X 会话的，这些命令将带回到输入命令的虚拟控制台中的 shell 提示符。如果你是通过在第七个虚拟控制台上登录 `xdm`\
  \ 来启动 X 会话的，你将退出 X 会话并出现 `xdm` 登录界面；然后你可以切换到另一个虚拟控制台或重新登录 X。\n\n### 方法 #2\n\n要立即退出\
  \ X 并终止所有 X 进程，请按下 `CTRL-ALT-BKSP` 组合（如果你的键盘有两个 ALT 和 CTRL 键，请使用左侧的）。你会丢失任何未保存的应用程序数据，但在无法正常退出\
  \ X 会话时（例如系统冻结或其他问题），这是很有用的。\n\n⇒ 要立即退出 X，输入：`CTRL-ALT-BKSP`\n\n## 4.2 在 X 中运行程序\n\
  \n在 X 会话中运行的程序被称为 X `clients`（客户端）（X 窗口系统本身被称为 X `server`（服务器）。要在 X 中运行程序，你需要作为\
  \ X 客户端启动它——要么从菜单中选择它，要么在 `xterm` shell 窗口中输入运行该程序的命令（参见食谱 4.5 [在 X 中运行 shell]，第\
  \ 109 页），如下。\n\n### 方法 #1\n\n大多数窗口管理器都有某种类型的“启动菜单”；通常通过点击根窗口的任何地方的左鼠标键来访问。要从启动菜单运行\
  \ X 客户端，点击左鼠标键从子菜单中选择客户端名称。\n\n⇒ 要从启动菜单启动一个方形的模拟盘钟，点击左鼠标键从子菜单中选择客户端名称：\n  1. 在根窗口的任何地方点击左鼠标键弹出启动菜单。\n\
  \  2. 在 `xclock` 子菜单中选择 `Really quit?`（真的退出吗？）。（注：此处原文示例逻辑略有重复，已按字意翻译）\n\n*更正翻译逻辑：*\n\
  ⇒ 要从启动菜单启动一个方形的模拟盘钟，点击左鼠标键选择：\n  1. 在根窗口的任何地方点击左鼠标键弹出启动菜单。\n  2. 从子菜单中选择客户端名称。\n\
  \n实际上，此处根据原文逻辑的翻译如下：\n\n* 从另一个虚拟控制台手动启动 X，请输入：`$ startx`\n\n* 运行 `startx` 并将其标准输出和标准错误都重定向到日志文件，输入：\n\
  \  `$ startx & > ~/startx.log`\n\n这两个示例都会在第七个虚拟控制台上启动 X，无论你在执行命令时处于哪个控制台——你的控制台会自动切换到第七个控制台的\
  \ X。你可以在 X 会话期间随时切换到另一个控制台（参见食谱 2.3 [使用控制台和终端]，第 32 页）。第二个示例将 `startx` 的任何错误信息或输出写入你主目录中名为\
  \ `startx.log` 的文件中。\n\n当你启动 X 时，可以指定使用的 `color depth`（颜色深度），它是用于渲染显示器上每个像素的可能颜色所使用的位数。\n\
  \n它是以 2 的幂次形式指定的；因此，8 位颜色意味着像素可以是 $2⁸$ 或 256 种可能颜色中的一种；16 位颜色提供 65,536 种可能的颜色（$2^{16}$），而\
  \ 24 位颜色（$2^{24}$）像素可以是 16,777,216 种颜色中的任意一种（那么 1 位颜色正好是两种颜色）。颜色深度受显示硬件限制。根据你的系统配置和显卡，X\
  \ 可能会以 8 位到 24 位之间的任何默认颜色深度启动。\n\n你可以通过带有特殊选项 `-bpp` 的 `startx` 来指定另一种颜色深度；后面跟随一个指示要使用的颜色深度的数字，并在选项前加上两个字符（`--`），这告诉\
  \ `startx` 将后面的选项传递给 X 服务器本身。\n\n⇒ 从虚拟控制台启动 X 并指定 24 位颜色深度，输入：`$ startx -- -bpp\
  \ 24`\n\n**注意：** 如果你的系统运行 `xdm`，你可以随时切换到第七个虚拟控制台（或 `xdm` 运行的任何控制台），然后在 `xdm` 登录界面登录。\n\
  \n## 4.1.2 停止 X\n\n停止 X 有几种方法。\n\n### 方法 #1\n\n结束 X 会话的正常方法是通过你的窗口管理器来进行。\n\n大多数窗口管理器都有\
  \ `Exit X` 菜单选项或类似的选项，你可以用鼠标选择；另一些带有退出 X 的快捷键命令。\n\n⇒ 这里有一些使用此方法的方法。\n\n* 如果你正在运行\
  \ `fvwm2` 窗口管理器，请执行以下操作：\n  1. 在根窗口的任何地方点击左鼠标键弹出启动菜单。\n  2. 从 `Exit Fvwm` 子菜单中选择\
  \ `Really quit?`（真的退出吗？）。\n\n* 如果你正在运行 `AfterStep` 窗口管理器，请执行以下操作：\n  1. 在根窗口的任何地方点击左鼠标键弹出启动菜单。\n\
  \  2. 从 `Quit`（退出）子菜单中选择 `Exit?`（退出吗？）。\n  3. 点击 `Logout`（注销）。\n\n* 如果你正在运行 `Ion`\
  \ 窗口管理器，请执行以下操作：\n  1. 按 `F12`。\n  2. 在 Ion 模式行回答“y”：\n     `Exit Ion (y/n)? y`\n\
  \n如果你是用 `startx` 启动 X 会话的，这些命令将带回到输入命令的虚拟控制台中的 shell 提示符。如果你是通过在第七个虚拟控制台上登录 `xdm`\
  \ 来启动 X 会话的，你将退出 X 会话并出现 `xdm` 登录界面；然后你可以切换到另一个虚拟控制台或重新登录 X。\n\n### 方法 #2\n\n要立即退出\
  \ X 并终止所有 X 进程，请按下 `CTRL-ALT-BKSP` 组合（如果你的键盘有两个 ALT 和 CTRL 键，请使用左侧的）。你会丢失任何未保存的应用程序数据，但在无法正常退出\
  \ X 会话时（例如系统冻结或其他问题），这是很有用的。\n\n⇒ 要立即退出 X，输入：`CTRL-ALT-BKSP`\n\n## 4.2 在 X 中运行程序\n\
  \n在 X 会话中运行的程序被称为 X `clients`（客户端）（X 窗口系统本身被称为 X `server`（服务器）。要在 X 中运行程序，你需要作为\
  \ X 客户端启动它——要么从菜单中选择它，要么在 `xterm` shell 窗口中输入运行该程序的命令（参见食谱 4.5 [在 X 中运行 shell]，第\
  \ 109 页），如下。\n\n### 方法 #1\n\n大多数窗口管理器都有某种类型的“启动菜单”；通常通过点击根窗口的任何地方的左鼠标键来访问。要从启动菜单运行\
  \ X 客户端，点击左鼠标键从子菜单中选择客户端名称。\n\n⇒ 要从启动菜单启动一个方形的模拟盘钟，点击左鼠标键选择：\n  1. 在根窗口的任何地方点击左鼠标键弹出启动菜单。\n\
  \  2. 从子菜单中选择客户端名称。（注：此处原文示例逻辑略有重复，已按字意翻译）\n\n*更正翻译逻辑：*\n⇒ 要从启动菜单启动一个方形的模拟盘钟，点击左鼠标键选择：\n\
  \  1. 在根窗口的任何地方点击左鼠标键弹出启动菜单。\n  2. 从子菜单中选择客户端名称。\n\n### 4.2.1 指定 X 窗口大小和位置\n\n通过使用\
  \ `geometry` 选项给出 `window geometry` 来指定窗口的大小和位置。四个字段控制窗口宽度、高度以及距离屏幕边缘的距离（偏移量）。它的格式为：\n\
  \n`-geometry WIDTHxHEIGHT+XOFF+YOFF`\n\n这些四个字段中的值通常以像素给出，尽管某些应用程序按字符测量 WIDTH 和 HEIGHT。虽然你必须顺序给出这些值，但可以省略任何一对。例如，如果只想指定窗口的大小，给出\
  \ WIDTH 和 HEIGHT 的值。\n\n⇒ 这里有一些使用此的方法。\n\n* 启动一个小的 xclock，48 像素宽和 48 像素高，输入：`$ xclock\
  \ -geometry 48x48`\n\n* 启动一个大的 xclock，480 像素宽和 500 像素高，输入：`$ xclock -geometry 480x500`\n\
  \n* 启动一个宽度为 48 像素且高度默认的 xclock，输入：`$ xclock -geometry 48`\n\n* 启动一个高度为 48 像素且宽度默认的\
  \ xclock，输入：`$ xclock -geometry x48`\n\n你可以为 XOFF 和 YOFF 字段给出正或负数。\n\n正 XOFF 值指定从屏幕左侧的位置；负值指定从右侧的位置。如果\
  \ YOFF 为正，则它指定从屏幕顶部的位置；如果为负，则指定从底部的位置。在给出这些偏移量时，必须同时指定 XOFF 和 YOFF 的值。\n\n要将窗口放置在桌面的四个角之一，对相应的\
  \ XOFF 和 YOFF 值使用零，如下：\n\n`+0+0`\n\n左上角。\n\n\n\n\n\n# +0-0\n左下角。\n\n# -0+0\n右上角。\n\
  \n# -0-0\n右下角。\n\n*⇒ 要在左下角启动一个默认尺寸的 `xclock`，输入：$ `xclock -geometry +0-0`\n\n回车\n\
  \n或者，为了完成所有设置，你可以用一个包含四个值的几何线条来来指定窗口的大小和位置。\n\n*⇒ 要启动一个宽度为 120 像素、高度为 100 像素、距离屏幕右侧偏移\
  \ 250 像素、距离屏幕顶部偏移 25 像素的 `xclock`，输入：\n\n$ `xclock -geometry 120x100-250+25`\n\n\
  回车\n\n使用 `-iconic` 选项以图标形式启动客户端，这样它在运行后会立即以图标形式出现。客户端将启动，但在你点击它之前，它将显示为一个小图标（参见\
  \ Recipe 4.3.5 [X 窗口的去图标化]，第 107 页）。\n\n*⇒ 要以图标形式启动 `xclock`，但当最大化时它会在右上角打开，输入：\n\
  \n$ `xclock -geometry -0+0 -iconic`\n\n回车\n\n## 4.2.2 指定 X 窗口颜色\n你的 X 会话中可用的窗口颜色取决于你的显示器硬件和正在运行的\
  \ X 服务器。`xcolors` 工具将显示你的 X 服务器上所有可用颜色以及指定这些颜色的名称。（颜色名称不区分大小写。）\n\n*⇒ 要列出可用颜色，输入：\n\
  \n$ `xcolors`\n\n回车\n\n按 Q 退出 `xcolors`。\n\n要指定用于窗口背景、窗口边框以及窗口本身文本或图形的颜色，请将颜色名称作为参数传递\n\
  \n![](img/index-138_1.png)\n\n104\n《Linux 食谱指南》，第 2 版\n\n传递给相应的选项：`-bg` 用于背景颜色，`-bd`\
  \ 用于窗口边框颜色，`-fg` 用于前景颜色。\n\n*⇒ 要启动一个具有蓝色窗口背景的 `xclock`，输入：$ `xclock -bg lightblue`\n\
  \n回车\n\n你可以指定这些属性的任何组合。\n\n*⇒ 要启动一个具有海绿色窗口背景和青色窗口前景的 `xclock`，输入：\n\n$ `xclock -bg\
  \ seagreen -fg turquoise`\n\n回车\n\n**注意：** `-bordercolor`、`-background` 和 `-foreground`\
  \ 选项与 `-bd`、`-bg` 和 `-fg` 同义。\n\n## 4.2.3 指定 X 窗口字体\n要指定窗口使用的字体，使用 `-fn` 选项后跟要使用的\
  \ X 字体名称。（要获取 X 字体名称，请使用 `xfontsel`；参见 Recipe 16.1 [使用 X 字体]，第 395 页）。\n\n*⇒ 要启动一个带有数字显示的\
  \ `xclock`，并指定其使用 17 点 Helvetica 字体作为文本，输入：\n\n$ `xclock -digital -fn -*-helvetica-*-r-*-*-17-*-*-*-*-*-*-`\n\
  \n回车\n\n此命令启动了一个看起来如图 4-4 的 `xclock`。\n\n*图 4-4。带有 Helvetica 类型的数字 xclock。*\n\n\
  **注意：** 如果你为 shell 窗口指定字体，可以在运行后对其调整大小，如 Recipe 16.1.4 [调整 Xterm 字体] 第 398 页所示。\n\
  \n`-font` 选项与 `-fn` 同义。\n\n## 4.2.4 指定 X 窗口边框宽度\n要指定 X 客户端边框的宽度，使用 `-bw` 后跟所需的宽度（单位为像素）。\n\
  \n*⇒ 要启动一个边框宽度为 30 像素的 `xclock`，输入：$ `xclock -bw 30`\n\n回车\n\n**注意：** `-borderwidth`\
  \ 选项与 `-bw` 同义。\n\n第 4 章：X 窗口系统\n105\n\n## 4.2.5 指定 X 窗口标题\n为客户端指定自定义标题，使用 `-title`\
  \ 并后跟一个带引号的字符串作为窗口标题。如果你使用长标题，可能需要指定客户端宽度以确保窗口足够长。\n\n*⇒ 这里有两种使用此功能的方法。\n\n* 要启动一个标题为“Time”的\
  \ `xclock`，输入：$ `xclock -title \"Time\"`\n\n回车\n\n* 要启动一个宽度为 225 像素、标题为“As Time\
  \ Goes By”的 `xclock`，输入：\n\n$ `xclock -title \"As Time Goes By\" -geometry 225`\n\
  \n回车\n\n## 4.2.6 在 X 窗口中指定属性\n当 X 客户端已经在窗口中运行时，你可以指定某些特殊属性。\n\nX 应用程序通常有多达三个特殊菜单，带有更改某些属性的选项。要查看这些菜单，按住\
  \ `CTRL` 键然后点击客户端窗口内某处的三个鼠标按钮之一。（如果你的鼠标只有两个按钮，请同时点击两个按钮以模拟中键。）\n\n*⇒ 要显示 X 客户端的第三个菜单，按住\
  \ `CTRL`，将鼠标指针移动到 X 客户端窗口的某处，并点击第三个鼠标按钮。\n\n## 4.3 操作 X 客户端窗口\n一次时间只有一个 X 客户端可以接受键盘和鼠标输入，该客户端被称为*活动客户端*。要使客户端变为活动，点击它的窗口。当客户端处于活动状态，它被认为“具有焦点”。根据窗口管理器的不同，鼠标指针的形状可能会发生变化。每个窗口都有自己的控制方法。\n\
  \n106\n《Linux 食谱指南》，第 2 版\n\n### 4.3.1 移动 X 窗口\n通过拖动标题栏移动客户端窗口。\n\n*⇒ 要移动 X 窗口，执行以下操作：\n\
  \n1. 点击并按住标题栏上的左键。\n2. 将窗口拖到所需位置。\n3. 松开鼠标。\n\n### 4.3.2 调整 X 窗口大小\n通过拖动任何框架来调整客户端窗口的大小。\n\
  \n*⇒ 要调整窗口大小，执行以下操作：\n\n1. 点击并按住任何框架上的左键。\n2. 移动鼠标以缩小或增大窗口轮廓。\n3. 松开鼠标。\n\n### 4.3.3\
  \ 最大化 X 窗口\n有时你可能希望调整客户端窗口，使其尽可能大，通常填充整个屏幕。这被称为*最大化*窗口。\n\n*⇒ 最大化窗口的方法取决于窗口管理器；通常以下一种或多种方法有效：\n\
  \n* 双击标题栏上的左键（在最大化窗口上，此操作具有返回较小尺寸的效果）。\n* 点击标题栏上的方形按钮。\n* 在根窗口任何处点击中键或右键，调出一个包含你会话中任何\
  \ X 客户端窗口选项的菜单；选择客户端名称进行最大化。\n\n**注意：** 如果最大化所有客户端窗口的想法吸引你，我建议查看 Ion，它是一个没有真正“窗口”概念、只有全屏运行的的管理器（参见\
  \ Recipe 4.7.5 [使用其他管理器]，第 120 页）。\n\n107\n---\n\n### 4.3.4 最小化 X 窗口\n你可以*最小化* X\
  \ 客户端窗口，使其消失并将代表运行程序的图标放在桌面上，带有窗口的“_”按钮，通常位于标题栏的右上角。这也称为*图标化*窗口。\n\n*⇒ 要最小化 X 窗口，点击窗口“_”按钮上的左键。\n\
  \n**注意：** 某些窗口管理器的方法可能略有不同，但基本原理是相同的。\n\n### 4.3.5 去图标化 X 窗口\n将最小化后的窗口带回来被称为*去图标化*窗口。代表窗口的图标将消失，窗口返回之前的大小和位置。\n\
  \n*⇒ 去图标化窗口的方法取决于窗口管理器，但通常以下一种或多种方法有效：\n\n* 双击图标上的左键。\n* 双击图标下方书写的图标名称上的左键。\n* 在根窗口任何处点击中键或右键，调出一个包含你会话中任何\
  \ X 客户端窗口选项的菜单；选择客户端名称进行去图标化。\n\n\n\n\n\n### 4.3.6 获取 X 窗口信息\n\n使用 `xwininfo` 输出客户端窗口的信息。这对于获取你想要在命令中指定的数值有用——它会列出所选窗口的几何形状、颜色、边框宽度、颜色深度以及其他值。在终端窗口中运行它（参见配方\
  \ 4.5 [在 X 中获取终端窗口]，第 109 页）。\n\n⇒ 要获取客户端窗口的信息，请执行以下操作：1. 在终端窗口中运行 `xwininfo`：\n\
  \n```\n$ xwininfo\nxwininfo: Please select the window about which you would like\
  \ information by clicking the mouse in that window.\n``` \n\n2. 在你想要信息的窗口内任意位置点击左鼠标键。\n\
  \n该命令会在你输入命令的终端窗口中输出你用鼠标选定的客户端窗口的信息列表。\n\n### 4.3.7 销毁 X 窗口\n\n当你退出或关闭 X 客户端时，窗口将不再显示。你也可以在\
  \ X 中 `destroy` 一个窗口，此时在该窗口中运行的客户端将被终止，窗口将不再显示。\n\n要销毁一个窗口，点击标题栏右上角“X”按钮上的左鼠标键。这在窗口中运行的程序停止响应且你无法正常退出时非常有用。\n\
  \n### 4.4 在桌面上移动\n\n许多窗口管理器（包括 AfterStep 和 fvwm2）允许你使用 `virtual desktop`（虚拟桌面），这让你能够使用比你的显示器一次能显示的更多的屏幕空间。虚拟桌面可以比显示器大，在这种情况下，你可以通过鼠标进行滚动。填满显示器的视图称为\
  \ `viewport`（视口）。当你将鼠标向当前（虚拟）桌面延伸的方向移出屏幕时，视图将向该方向滚动。虚拟桌面对于同时全屏运行许多客户端非常有用，每个客户端都可以在自己独立的桌面上。\n\
  \n某些配置不允许在桌面之间滚动；在这种情况下，请使用 `pager`（分页器）在它们之间切换，它会显示虚拟桌面的缩略视图，并允许你在桌面之间切换。它是一个 `sticky`\
  \ `window`（它“粘附”在所有其他窗口上方），并且始终位于屏幕的右下角，即使你滚动虚拟桌面也是如此。你的当前桌面和活动 X 客户端会在分页器中被高亮显示。\n\
  \n默认的 `fvwm2` 虚拟桌面大小是 3x3 网格中的九个桌面，如图 4-5 所示。一个 fvwm2 分页器。\n\n在之前的插图中，当前桌面是第一行中的第二个。第一个桌面包含两个\
  \ X 客户端窗口——一个较小的和一个较大的——但在任何其他桌面（包括当前桌面）中都没有窗口。\n\n要切换到另一个桌面，请点击分页器中对应视图的左鼠标键，或者如果你的窗口管理器提供了键盘快捷键，则使用该快捷键。\n\
  \n⇒ 在 `fvwm2` 中，切换桌面的默认键是 `ALT` 配合方向键；在 AfterStep 中，使用 `CTRL` 键代替 `ALT`。\n\n• 在运行\
  \ `fvwm2` 时，要切换到当前桌面左侧桌面，输入 `ALT -`。\n\n• 在运行 `AfterStep` 时，要切换到当前桌面正左侧桌面，输入 `CTRL\
  \ -`。\n\n### 4.5 在 X 中获取终端窗口\n\n`xterm`\n\nDEB: `xterm`\nRPM: `xterm`\nWWW: http://dickey.his.com/xterm/\n\
  \n`terminal emulator`（终端模拟器）让你能够在 X 客户端窗口中运行 shell。Linux 系统上标准的终端模拟器是 `xterm`，它模拟了\
  \ dec vt102/220 和 Tektronix 4014 视频终端。\n\n你可以在 `xterm` 窗口中运行命令，就像在虚拟控制台中一样；`xterm`\
  \ 中的 shell 作用与虚拟控制中的 shell 相同（参见第 3 章 [Shell]，第 53 页）。\n\n你可以配合 `xterm` 使用所有标准的\
  \ X 客户端选项（参见配方 4.2 [在 X 中运行程序]，第 101 页），但它也有许多自己的选项，这些将在下一个配方中描述。\n\n⇒ 要打开一个带有 shell\
  \ 的新窗口，并将文本字体设置为大小为 18 像素的 Lucida Sans Typewriter 字，输入：\n\n```\n$ xterm -fn lucidasanstypewriter-18\n\
  ```\n\n此示例要求你已经运行了一个终端模拟器，并且有一个你可以从中从中打字的 shell 提示符。如果你没有，则必须通过从窗口管理器提供的应用程序菜单中选择它来启动\
  \ `xterm`。\n\n⇒ 在使用 `Ion` 窗口管理器时，打开一个带有 shell 的新窗口并将文本字体设置为大小为 18 像素的 Lucida Sans\
  \ Typewriter 字，输入：\n\n```\nF3\nRun: xterm -fn lucidasanstypewriter-18\n```\n\n你可以从\
  \ `xterm` 剪切并粘贴文本到另一个 X 客户端（参见配方 10.3 [处理文本选择]，第 253 页）。\n\n要滚动已过屏幕顶部的文本，输入 `SHIFT\
  \ - PgUp`。你可以向上回滚的行数取决于 `sl` 选项；其默认值为 64。\n\n#### 4.5.1 更改默认 X 行为\n\n有许多命令行选项可以控制\
  \ `xterm` 的特性；下表列出了其中一些。注意，这些选项有些奇特；有时 `-` 选项开启某项功能，而另此时却是 `+` 选项。表格中注明了默认行为，尽管某些\
  \ Linux 发行版可能会更改这些设置。要查看原始外观，请访问 http://www.netktop.org/terminal/dec.html 和 http://www.netktop.org/terminal/various.html。\n\
  \n- `-ah`: 始终高亮光标，即使窗口不再处于焦点。\n- `+ah`: 当窗口没有焦点时，使光标变为空心（默认值）。\n- `-aw`: 开启自动换行，使到达右边距的文本换到下一行（默认值）。\n\
  - `+aw`: 关闭自动换行；超出右边距的文本将被删除，使得每行的最后一个字符被打印为边距前的最后一个字符。\n- `-b`: 指定内部边框的像素大小（默认值为\
  \ 2）。\n- `-bdc`: 关闭以颜色显示粗体字符，而不是加粗显示（默认值）。\n- `+bdc`: 以颜色显示粗体字符。\n- `-cm`: 禁用 ansi\
  \ 控制序列识别。\n- `+cm`: 启用 ansi 控制序列识别（默认值）。\n- `-cr`: 指定用于文本光标的颜色。\n- `-fb`: 指定用于粗体的字体（默认是对普通字体叠加）。你提供的字体必须与普通字体相同的高度和宽度。\n\
  - `-hc`: 设置高亮或选中文本的背景颜色（默认使用普通文本颜色的反色）。\n- `-j`: 开启跳转滚动，在快速流文本时一次跳过多行，而不是滚动屏幕上的每一行；对于处理大量文本时提高速度（默认值）。\n\
  - `+j`: 关闭跳转滚动。\n- `-leftbar`: 将滚动条放在窗口的左侧（默认值），如果同时也通过 `-sb` 选项启用。\n- `-ls`: 为\
  \ shell 使用登录 shell（对于 Bash 用户来说，这意味着在启动时会运行 `.bash_profile`；这是默认值）。\n- `+ls`: 指定不使用登录\
  \ shell——而是使用普通的子 shell（对于 Bash 用户来说，这意味着不运行 `.bash_profile`）。\n- `-mb`: 开启边距铃，当光标接近右边距时会响铃。\n\
  - `+mb`: 关闭边距铃（默认值）。\n- `-mc`: 指定选择文本时多次点击之间的时间（毫秒）。\n- `-ms`: 指定 X 鼠标指针在 `xterm`\
  \ 窗口内的颜色（这有时被称为。\n\n\n\n\n\n`pointer cursor`；指针光标（值默认为前景颜色）。\n\n`-color`\n\n指定从右边缘开始的字符数，如果使用了该选项，边缘铃声在该处响起（默认值为十）。\n\
  \n`-nul`\n启用下划线显示（默认值）。\n\n`+nul`\n禁用下划线显示。\n\n`-pc`\n启用 pc 样式加粗颜色（更亮的颜色值；默认值）。\n\
  \n`+pc`\n禁用 pc 样式加粗颜色。\n\n`-rightbar`\n如果也启用了 `-sb` 选项，则将滚动条位于窗口的右边缘。\n\n# 第 4 章：X\
  \ 窗口系统\n113\n\n`-rw`\n允许反向换行，在编辑长命令行行时，光标可以从当前行回退到上一行的右边缘（默认值）。\n\n`+rw`\n不允许反向换行。\n\
  \n`-sb`\n启用滚动条，以便可以通过向上滚动滚动条来查看滚出窗口顶部的行。\n\n`+sb`\n禁用滚动条（默认值）。\n\n`-sk`\n指定当在使用滚动条查看之前的文本时按下按键，窗口显示将移动到当前输入行（默认值）。\n\
  \n`+sk`\n指定当在使用滚动条查看之前的文本时按下按键，窗口显示将不会移动到当前输入行。\n\n`-sl number`\n指定应保存的滚出屏幕顶部行数，以便通过滚动条查看。\n\
  \n`-ulc`\n指定带下划线的字符不应以颜色显示（默认值）。\n\n`+ulc`\n指定带下划线的字符应以颜色显示而不是显示下划线。\n\n`-vb`\n\
  指定使用视觉铃声（visual bell）而不是听觉铃声（窗口会快速闪烁）。\n\n`+vb`\n禁用任何视觉铃声（默认值）。\n\n选项比这些多得多；请参阅\
  \ `xterm` 手页以获取完整列表（参见食谱 2.8.4 [从系统手册读取页面]，第 46 页）。\n\n## 4.5.2 在 X 窗口中运行命令\n\n\
  `xterm` 工具默认运行一个 shell，但你也可以用它来运行任何交互式终端程序；使用 `-e` 选项执行此操作，并将要运行的命令名称作为参数传递。`xterm`\
  \ 将带有该命令打开，并在它自己的窗口中运行；当该命令退出时，`xterm` 窗口将关闭。这在你只想在自己的窗口中运行特定命令但不需要 shell 时非常方便。\n\
  \n`⇒` 在它自己的 X 窗口中运行 `bc`，请输入：\n\n```\nxterm -e bc\n```\n\n当你退出命令时，shell 将退出，窗口也将关闭。\n\
  \n你也可以向命令传递参数。\n\n`⇒` 运行带有 url `file:/usr/local/` 的 `lynx`，请输入：\n\n```\nxterm -e\
  \ lynx file:/usr/local/\n```\n\n在此示例中，`lynx` 在它自己的窗口中打开给定的 url，并将保持打开直到你杀死窗口或退出\
  \ `lynx`。\n\n**注意：** 如果使用其他选项调用 `xterm`，`-e` 选项必须是命令行中指定的最后一个选项。\n\n## 4.5.3 使用其他终端模拟器\n\
  \n虽然 `xterm` 是标准的 Linux 终端模拟器，但它绝对不是唯一的；有很多供选择，且都具有特殊功能。下表列出了其中一些较好的。\n\n**AfterStep**\n\
  这种彩色 vt102 终端模拟器是为了配合 AfterStep 窗口管理器设计的，但也可以与其他一起一起；具有许多调色和阴影等特殊效果，但比 `xterm` 小——而且使用的交换空间也更少。\n\
  DEB: `aterm`\nRPM: `aterm`\nWWW: http://aterm.sourceforge.net/\n\n**Enlightened**\n\
  这种彩色 vt102 终端模拟器是为了配合 Terminal Enlightenment 窗口管理器设计的，但也可以与其他模拟器一起；支持主题并有许多控制其外观的功能。\n\
  DEB: `eterm`\nRPM: `Eterm`\nWWW: http://www.eterm.org/\n\n**Konsole**\n用于 `kde`\
  \ 的图形化终端模拟器，允许你在单个窗口中运行多个终端。\nDEB: `konsole`\nRPM: `konsole`\nWWW: http://konsole.kde.org/\n\
  \n**Multi Terminal**\n用于 `gnome` 的图形化终端模拟器具有受 `Konsole` 启发的增强功能，允许在单个窗口中运行多个终端。\n\
  DEB: `multi-gnome-terminal`\nRPM: `multi-gnome-terminal`\nWWW: http://multignometerm.sourceforge.net/\n\
  \n**Multi Lingual**\n顾如名，该终端模拟器支持各种外国语言编码。\nDEB: `mlterm`\nRPM: `mlterm`\nWWW: http://mlterm.sourceforge.net/\n\
  \n**PowerShell**\n这种彩色终端模拟器允许在同一窗口中使用多个终端，你可以通过点击“tab”按钮在之间切换。\nDEB: `powershell`\n\
  RPM: `powershell`\nWWW: http://powershell.sourceforge.net/\n\n**our XVT**\n大家通过其命令名\
  \ `rxvt` 熟悉它，这是一个彩色 vt102 终端模拟器，设计用于 `xterm` 的替代品，比后者更小且内存密集程度较低，但配置选项较少。\nDEB:\
  \ `rxvt`\nRPM: `rxvt`\nWWW: http://sourceforge.net/rxvt\n\n**Unicode**\n这是支持 Unicode\
  \ 的 `xterm`\nDEB: `xterm`\nRPM: `xterm`\nWWW: http://dickey.com/xterm/\n\n116\n\
  《Linux 菜谱》，第 2 版\n\n**wterm**\n这是基于 `XVT` 的，但针对窗口管理器进行了优化。它的功能包括透明、调色和背景图片。\nDEB:\
  \ `wterm`\nRPM: `wterm`\nWWW: http://windowmaker.org/files.php#wterm\n\n## 4.6 放大桌面区域\n\
  \n使用 `xmag` 放大桌面。它将打开一个显示桌面部分的放大窗口。\n\n有两种选择桌面区域的方法：点击左上角的鼠标按钮并拖动到右边缘。\n\n`⇒` 这里有两种使用方法。\n\
  \n• 要放大桌面区域，请执行以下操作：1. 启动 `xmag`：\n\n```\nxmag\n```\n2. 点击左上角的鼠标按钮。\n3. 将指针移动到右边缘，然后释放鼠标按钮。\n\
  \n• 为了延迟三秒运行 `xmag`，以便在运行之前你有时间切换桌面，请输入：\n\n```\nsleep 3; xmag\n```\n\n点击关闭或输入 Q\
  \ 退出程序并关闭窗口。\n\n\n\n\n\n**备注：** 有关视频模式的更多信息，请参见 *The XFree86 Video Timing HOWTO*（参见\
  \ Recipe 2.8.6 [读取系统文档和帮助文件]，第 50 页）。\n\n## 4.7.2 自动运行 X 客户端\n\n`.xsession` 文件是你主目录下的一个隐藏文件，指定了\
  \ X 会话首次启动时自动运行的客户端（“隐藏”文件见第 5 章 [文件和目录]，第 125 页）。它只是一个 shell 脚本，通常包含一个要运行的客户端列表。你可以用文本编辑器编辑\
  \ `.xsession` 文件，如果该文件不存在，你可以创建它。\n\n客户端按照它们在列表中出现的顺序启动，最后一行应该指定要使用的窗口管理器。下面的 `.xsession`\
  \ 文件示例启动了一个具有黑色背景、白色文字、棕色光标且无滚动条的 `aterm`；在左上角放置了一个 `asclock`（AfterStep 的时钟，灵感源于\
  \ nextstep 的“撕离式”日历钟）；启动了 `Emacs` 文本编辑器并将 `~/TODO` 文件打开在自己的缓冲区中；然后启动了 `AfterStep`\
  \ 窗口管理器：\n\n```sh\n#! /bin/sh\n#\n# 一个示例 .xsession 文件.\naterm +sb -bg black -fg\
  \ white -cr brown &\nasclock -geometry +0+0 &\nemacs ~/TODO &\nexec /usr/bin/afterstep\n\
  ```\n\n所有的客户端都作为后台作业启动，最后行的窗口管理器除外，因为当此文件运行时，X 会话是在前台运行的（参见 Recipe 3.3 [管理作业]，第\
  \ 70 页）。在你 `.xsession` 文件中放入的任何命令行末尾，始终加上符号 `&`，但最后一行指定窗口管理器的行除外。\n\n## 4.7.3 更改根窗口参数\n\
  \n默认情况下，根窗口背景被涂成带有织纹图案的灰色。为了绘制这些图案，X 使用 *位图*（bitmap）填充根窗口，位图是一种存储在特殊文件格式中的黑白图像。X\
  \ 自带了一些安装在 `/usr/X11R6/include/bitmaps/` 目录下的位图；默认位图文件是 `root_weave`（你可以使用位图工具创建自己的图案；参见\
  \ Recipe 18.4 [使用其他图像编辑器]，第 435 页）。\n\n使用 `xsetroot` 来更改根窗口的颜色和位图图案。\n\n要更改颜色，使用\
  \ `-solid` 选项并将要使用的颜色名称作为参数。（使用 `xcolors` 获取可能的颜色名称列表，参见 Recipe 4.2.2 [指定 X 窗口颜色]，第\
  \ 103 页。）\n\n⇒ 将根窗口颜色更改为蓝紫色，输入：`$xsetroot -solid blueviolet`\n\n要更改根窗口图案，使用 `-bitmap`\
  \ 选项并提供要使用的位图文件名。\n\n⇒ 用星形图案填充根窗口，输入：`$xsetroot -bitmap /usr/X11R6/include/bitmaps/star`\n\
  \n在指定图案时，使用 `-fg` 和 `-bg` 选项来指定前景和背景颜色。\n\n⇒ 用黑色背景的浅石板灰星形图案填充根窗口，输入（全部在一行）：\n\n\
  `$xsetroot -fg slategray2 -bg black -bitmap /usr/X11R6/include/bitmaps/star`\n\n\
  使用带有特殊选项 `-gray` 的 `xsetroot`，可以将根窗口更改为一种护眼的灰色，且无图案。\n\n⇒ 让根窗口显示为无图案的灰色，输入：`$xsetroot\
  \ -gray`\n\n**备注：** 你也可以将图像放入根窗口（尽管这消耗了内存，本可以留给内存密集型的 Web 浏览器；具体方法请参见 Recipe 17.1.2\
  \ [在根窗口中放置图像]，第 410 页）。\n\n## 4.7.4 控制 X 中的系统蜂铃\n\nX 有一个用于控制用户偏好的工具称为 `xset`，你可以用它控制系统的各个方面例如例如你可以用它控制屏幕保护时间、LED\
  \ 灯设置、按键点击音量等。\n\n要关闭系统蜂铃响声，使用 `xset` 并向 `b` 选项提供 `off` 参数。\n\n⇒ 关闭 X 中的系统蜂铃，输入：`$xset\
  \ b off`\n\n你可以使用 `on` 参数重新开启蜂铃。\n\n你可以通过给 `b` 选项提供三个数字参数来控制蜂铃的音量、音调和持续时间：第一个是最大值的百分比，第二个是赫兹（Hz），第三个是毫秒（ms）。运行不带参数的带有\
  \ `b` 选项的 `xset` 将蜂铃恢复为默认。\n\n⇒ 这里有两种使用方法。\n\n*   要将蜂铃设置为最大音量的 75%，以 440 Hz 响一秒钟，输入：`$xset\
  \ 75 440 1000`\n*   将系统蜂铃恢复为默认值，输入：`$xset b`\n\n**备注：** 为了让 `xset` 设置永久生效并影响你运行的每一个\
  \ X 会话，你可能需要将命令放在 `.xsession` 文件中。\n\n## 4.7.5 使用其他窗口管理器\n\n是的，有很多窗口管理器可选。下表描述了一些流行的窗口管理器。\n\
  \n| 窗口管理器 | 描述 |\n| :--- | :--- |\n| **9wm** | `9wm` 是一种受 at&t Plan 9 启发的简单管理器——它不使用标题栏或图标。它应该吸引极简主义者。\
  \ |\n| **AfterStep** | `AfterStep` 的灵感源于 nextstep 的外观和感受。 |\n| **BlackBox** | `BlackBox`\
  \ 是一种快速、轻量且具有现代感的窗口管理器。 |\n| **Enlightenment** | `Enlightenment` 是一个图形密集型管理器，使用桌面“主题”来装饰\
  \ X 会话的各种控件。 |\n| **Fluxbox** | `Fluxbox` 基于 BlackBox，增加了标签页、快捷键和图标栏等功能。 |\n| **FVWM95**\
  \ | `fvwm95` 让 X 看起来像 1995 年的某种专用桌面。 |\n| **Ion** | Ion 设计用于键盘导航，将应用程序和客户端窗口保持在全屏框架中，它是那些重视速度和效率且并不在意窗口系统的人的喜爱。\
  \ |\n| **TWM** | Tab Window Manager 是一种老旧且简单的窗口管理器，几乎适用于每个系统。（它有时被称为 Tom's Window\
  \ Manager，以其主要作者 Tom LaStrange 命名。） |\n| **WM2** | `wm2` 是一个极简的、无需配置的窗口管理器。 |\n\
  | **Window Maker** | GNU 项目的首选窗口管理器，Window Maker 可以通过简单的菜单进行配置，经常与 nextstep 比较。\
  \ |\n\n要尝试其中一个窗口管理器，请从当前窗口管理器提供的应用程序菜单中选择它。这将退出你的窗口。\n\n\n\n\n管理窗口管理器并启动一个新的。如果你发现了一个喜欢的并希望将其设置为默认值，请编辑你的\
  \ `.xsession` 文件，使其最后一行包含 `exec`，后跟要使用的窗口管理器的完整路径名（参见 Recipe 4.7.2 [自动运行 X 客户端]，第\
  \ 117 页）。\n\n⇒ 要将 AfterStep 设置为默认窗口管理器，请将以下内容放在 `.xsession` 文件的最后一行：\n\n```bash\n\
  exec /usr/bin/X11/afterstep\n```\n\n**注意：** 某些窗口管理器（如 `twm` 和 `wm2`）没有应用程序菜单，因此如果你运行了此类窗口管理器，你将无法在当前会话期间轻松切换到另一个——你必须退出\
  \ X 并重新启动。\n\n# II. 文件\n\n# 5. 文件与目录\n\n本章讨论了操作文件和目录的基本工具——这些工具是 Linux 系统最重要的工具之一。\n\
  \n`file`（文件）是存储在磁盘上的数据集合，可以通过其名称作为单个单元进行操作。\n\n`directory`（目录）是一个充当其他文件文件夹的文件。目录也可以包含其他目录（在此语境下称为\
  \ `subdirectories` 子目录）；包含另一个目录的目录被称为其包含的 `child` 子目录的 `parent` 父目录。\n\n你可以将普通文件想象成文件柜抽屉里的文件夹。文件夹有一个名称，它保存放入其中的信息，且这些信息可以重新排列；你可以随时调回该文件，也可以销毁它。文件柜的抽屉就是目录，每个文件都必须保存在其中一个。\n\
  \n比喻到此为止。文件夹可以被完全相同地复制，并且可能存在“幻影文件夹”，其内容指向你某个真实文件夹的内容，因此当你查看幻影内部时，你实际上是在查看某处文件夹的内容。你可以拥有任意数量的目录，与物理文件柜不同，你可以在抽屉内部放置抽屉，而抽屉内部又有自己的抽屉，层层循环。事实上，有一个“主”抽屉，即根目录，它包含了所有其他抽屉——每个抽屉反过来都必须保存在另一个抽屉中。\n\
  \n将系统上的目录想象成一棵带有分支的树也有帮助，因为目录形成了一个分支层次结构——树形的比喻被频繁用于描述它们：`directory tree`（目录树）包括一个目录及其所有文件，包括所有子目录的内容。（每个目录都是“树”中的一个“分支”。）单独的斜杠字符（`/`）是目录树层次结构底部\
  \ `root directory`（根目录）的名字；将其想象为根和树干，所有其他文件或目录都由此支撑，并不可避免地由此分支。\n\n图 5-1 显示了根目录树的简化版本。\n\
  \n为了表示目录在文件层次结构中的位置，请指定它与根目录之间的所有目录，使用斜杠（`/`）作为分隔符来区分目录。因此，在图中显示的 `dict` 目录将表示为\
  \ `/usr/dict`。\n\n每个用户在 `/home` 目录下都有一个存放自己文件的分支，被称为他的 `home directory`（家目录）。前一个图中的层次结构有两个家目录：`joe`\
  \ 和 `jon`，它们都是 `/home` 的子目录。\n\n```\n(root)\n  |\n  ├── bin\n  ├── etc\n  ├── home\n\
  \  |    ├── joe\n  |    │    ├── bin\n  |    │    ├── play\n  |    │    └── work\n\
  \  |    └── jon\n  |         ├── bin\n  |         ├── play\n  |         └── work\n\
  \  └── usr\n```\n图 5-1. 根目录树。\n\n当你处于 shell 中时，你始终处于系统上的某个目录，该目录被称为 `current working\
  \ directory`（当前工作目录）。当你首次登录系统时，你的家目录就是当前工作目录。\n\n每当将文件名作为工具或应用程序的参数时，你可以提供相对于当前工作目录的由斜杠分隔的\
  \ `path name`（路径名）。例如，如果 `/home/joe` 是当前工作目录，你可以使用 `work` 来指定目录 `/home/joe/work`，并使用\
  \ `work/schedule` 来指定 `/home/joe/work` 目录下的 schedule 表文件。\n\n每个目录都有两个特殊文件，其名称由一个或两个点组成：`..`\
  \ 指向当前工作目录的父目录，`.` 指向当前工作目录本身。如果当前工作目录是 `/home/joe`，你可以使用 `.*` 来指定 `/home/joe`，使用\
  \ `*..` 来指定 `/home`。\n\n此外，你可以通过 `../jon` 指定 `/home/jon` 目录。\n\n指定文件名的另一种方法是指定从根目录（`/`）一直到你想要指定的文件的所有目录分支列表，用斜杠分隔。这种从根目录到文件的唯一的、特定的路径被称为文件的\
  \ `full path name`（完整路径名）。当引用非目录的文件时，这有时被称为 `absolute file name`（绝对文件名）。\n\n你可以通过提供完整路径名来指定系统上的任何文件或目录。文件可以与系统中不同目录下的文件同名，但没有两个文件或目录可以共享同一个路径名。\n\
  \n例如，用户 `joe` 可以在他的 `/home/joe/work` 目录下有一个文件 `schedule`，在它的 `/home/joe/play` 目录下也有一个文件\
  \ `schedule`。虽然这两个文件的名称相同（schedule），但它们位于不同的目录中。然而，当你启动一个工具或应用程序时，你并不需要输入该工具或应用程序的完整路径名。shell\
  \ 维护的一个目录列表被称为 `path`，如果一个程序在路径中，意味着你只需输入名称即可运行它。下表描述了一些标准目录。\n\n| 目录 | 描述 |\n|\
  \ :--- | :--- |\n| `/` | 系统所有目录的祖先；所有其他目录直接或通过子目录位于其下。 |\n| `/bin` | 必要的工具或其他二进制文件。\
  \ |\n| `/dev` | 表示系统各种设备的文件。例如，你使用 `/dev/cdrom` 来访问光驱驱动。 |\n| `/etc` | 杂项系统配置文件、启动文件等。\
  \ |\n| `/home` | 系统所有用户的家目录。 |\n| `/lib` | `/bin` 中工具使用的系统库。 |\n| `/proc` | 提供当前进程信息的文件。\
  \ |\n| `/root` | 超级用户的家目录，用户名 root（过去超级用户的家目录是 `/`；后来采用了 `/root` 用于此目的。） |\n| `/sbin`\
  \ | 必要的系统管理员工具或系统二进制文件。 |\n| `/tmp` | 临时文件。 |\n| `/usr` | 与用户工具和应用程序相关的子目录。 |\n\
  | `/usr/X11R6` | 与 X 窗口系统相关的文件，包括仅在 X 下运行的程序（位于 `/usr/X11R6/bin`）。 |\n| `/usr/bin`\
  \ | 用户工具和应用程序。 |\n| `/usr/dict` | 字典和词表（正逐渐被 `/usr/share/dict` 取代）。 |\n| `/usr/doc`\
  \ | 杂项系统文档。 |\n| `/usr/games` | 游戏和娱乐。 |\n| `/usr/info` | Gnu Info 超文本系统文件（参见 Recipe\
  \ 2.8.5 [阅读 Info 手册]，第 48 页）。 |\n| `/usr/lib` | `/usr/bin` 中工具使用的库。 |\n| `/usr/local`\
  \ | 本地文件——系统唯一的文件，包括本地文档（位于 `/usr/local/doc`）和程序（位于 `/usr/local/bin`）。 |\n| `/usr/man`\
  \ | 在线手册，通过 man 命令读取（参见 Recipe 2.8.4 [阅读手册页]）。 |\n\n\n\n\n（《系统手册》，第 46 页）。\n\n`/usr/share`\n\
  \n已安装应用程序的数据，与架构无关且可以在系统之间共享。\n\n这里也出现了许多与 `/usr` 对应的子目录，包括 `/usr/share/doc`、`/usr/share/info`\
  \ 和 `/usr/share/icons`。\n\n# 第 5 章：文件与目录\n\n129\n\n`/usr/src`\n\n在系统上编译的软件源代码。\n\
  \n`/usr/tmp`\n\n另一个存放临时文件的目录。\n\n`/var`\n\n可变数据文件，例如打印队列和日志文件。\n\n有关基于 Linux 的系统的目录结构的更多信息，请参阅\
  \ [文件系统层次结构标准](http://www.pathname.com/fhs/) 。\n\n在 Debian 系统上，你也可以在 `/usr/doc/debian-policy/fsstnd/`\
  \ 目录下的压缩文件中查看这些信息（参见 Recipe 9.1 [阅读文本]，第 211 页）。\n\n## 5.1 命名文件和目录\n\n文件名可以由大小写字母、数字、点（`.`）、连字符（`-`）和下划线（`_`）的任何组合组成。文件名区分区分大小——`foo`、`Foo`\
  \ 和 `FOO` 都是不同的文件名，并且它们可以同时存在于目录中（同名的文件不能）。按照惯例，文件名几乎全都是小写字母。\n\nLinux 并不强制你使用文件扩展名，但给文件赋予适当的扩展名是非常方便实用的，因为它们可以帮助你一眼识别文件类型。\n\
  \n扩展名没有特殊要求；`.` 只是一个旧习惯——你可以为任何文件使用你喜欢的任何后缀：`Penny_Parker-20031103.letter`\n\n文件可以完全没有任何扩展名，例如\
  \ `myfile`，你也可以拥有多个扩展名的文件，例如 `long.file.with.many.extensions`。\n\n例如，一个 jpeg 格式的图像文件不必有\
  \ `.jpg` 或 `.jpeg` 扩展名，程序文件不需要特殊的扩展名也能运行。\n\n如果你正在向其他计算机上的用户发送文件，扩展名会变得特别有用，特别是对于需要扩展名的系统——如果向\
  \ Windows 用户发送一个 Microsoft Word 格式的文件，而不先给它加上 `.doc` 扩展名，你可能会收到该文件无法使用的提示。\n\n从技术上讲，你还可以使用其他字符——但这样做可能会在以后给你带来麻烦。\n\
  \n130\n\n《Linux 食谱指南》，第 2 版\n\n任何文件扩展名之前的、但不包含路径的文件称为基文件名（base file name）。例如，`/home/lisa/house.jpeg`\
  \ 的文件名是 `house`，不包含点或结尾的 `jpeg`，也不包含路径。\n\n有关常用文件扩展名及其含义的列表，请参阅附录 B [常规文件名扩展名]，第\
  \ 723 页。\n\n以下章节将展示如何创建新文件。要重命名现有文件，只需将其移动到一个新名称的文件——参见 Recipe 5.5 [移动文件和目录]，第 144\
  \ 页。\n\n### 5.1.1 创建空文件\n\n你有时可能想创建一个新的空文件作为某种“占位符”。\n\n要这样做，将你想要为文件使用的名称作为 `touch`\
  \ 的参数。\n\n⇒ 这里是使用该命令的一些方法。\n\n• 在当前目录中创建名为 `a_fresh_start` 的文件，输入：$ `touch a_fresh_start`\n\
  \nRET\n\n• 在当前目录的 `work/completed` 子目录中创建名为 `another_empty_file` 的文件，输入：\n\n$ `touch\
  \ work/completed/another_empty_file`\n\nRET\n\n此工具会“触摸”你提供的参数文件。如果文件不存在，它会创建它；如果文件已存在，它会将文件的修改时间更改为当前日期和时间，就像你使用过该文件一样。\n\
  \n**注意：** 通常你会在编辑文件时创建它，例如使用文本、图像或声音编辑器时；在这种情况下，你不需要先创建文件。\n\n### 5.1.2 创建目录\n\n\
  使用 `mkdir`（“make directory”）来创建一个新目录，并将新目录的路径名作为参数。目录名遵循与其他文件相同的惯例——即，不建议使用空格、斜杠或其他异常字符。\n\
  \n⇒ 这里是使用该命令的一些方法。\n\n• 在当前工作目录中创建一个名为 `work` 的新目录，输入：\n\n$ `mkdir work`\n\nRET\n\
  \n• 在 `/tmp` 目录中创建一个名为 `work` 的新目录，输入：$ `mkdir /tmp/work`\n\nRET\n\n第 5 章：文件与目录\n\
  \n131\n\n### 5.1.3 创建目录树\n\n使用 `mkdir` 配合 `-p` 选项创建一个子目录及其任何不存在的父目录。当你想要从零开始创建一个相当复杂的目录树且不想逐个创建目录时，这非常有用。\n\
  \n⇒ 要创建 `work/completed/2001` 目录——它是 `completed` 目录的子目录，而 `completed` 又是当前目录下 `work`\
  \ 目录的子目录，输入：\n\n$ `mkdir -p work/completed/2001`\n\nRET\n\n这会在名为 `completed` 的目录中创建一个\
  \ `2001` 子目录，该子目录位于当前目录中名为 `work` 的目录内；如果 `completed` 或 `work` 目录不存在，它们也会被创建。如果\
  \ `work` 和 `completed` 目录已经存在，则无需 `-p` 即可工作。\n\n### 5.1.4 使用带空格的文件\n\n虽然文件名中不允许使用空格，但它会让使用变得困难。如果目录名或文件名包含空格，在命令行中有两种方法指定它。\n\
  \n**方法 1**\n\n使用带空格的文件时，将其包含在单引号（''）中。\n\n⇒ 列出名为 `Top Secret` 的目录内容，输入：$ `ls 'Top\
  \ Secret'`\n\nRET\n\n你也可以使用双引号（\"）；如果文件名包含一种引号，就用另一种。\n\n⇒ 列出名为 `McHale's Restaurant`\
  \ 的目录内容，输入：$ `ls \"McHale's Restaurant\"`\n\nRET\n\n132\n\n《Linux 食谱指南》，第 2 版\n\n\
  **方法 2**\n\n使用带空格的文件时，在每个空格字符前加上反斜杠（\\）。\n\n⇒ 进入名为 `Newspaper Photo Archive` 的目录，输入：$\
  \ `cd Newspaper\\ Photo\\ Archive`\n\nRET\n\n使用反斜杠引导其他字符，包括引号。\n\n⇒ 删除名为 `A \"tough\"\
  \ one` 的文件，输入：$ `rm -i A\\ \"tough\"\\ one`*\n\nRET\n\n在此示例中，调用了带有 `-i` 选项的 `rm`，会在每次删除执行前请求确认（参见\
  \ Recipe 5.6.2 [交互式删除文件]，第 150 页）。\n\n**注意：** 如果你不希望文件名中有空格，但希望名称中的单词隔开，可以将文件名中的空格改为下划线（`_`）。这是一个常见的\
  \ Unix 惯例。\n\n## 5.2 切换目录\n\n使用 `cd` 切换当前工作目录；将目标目录的相对路径或完整路径作为参数。\n\n⇒ 这里是使用该命令的一些方法。\n\
  \n• 将工作目录切换到当前目录下的子目录 `work`，输入：\n\n$ `cd work`\n\nRET\n\n• 切换到当前目录的父目录，输入：$ `cd\
  \ ..`\n\nRET\n\n• 将工作目录切换到 `/usr/doc`，输入：$ `cd /usr/doc`\n\nRET\n\n以下配方展示了 `cd`\
  \ 的特殊用法。\n\n### 5.2.1 切换到主目录\n\n不带参数时，`cd` 将你的主目录变为当前工作目录。\n\n⇒ 返回主目录，输入：$ `cd`\n\
  \nRET\n\n第 5 章：文件与目录\n\n133\n\n### 5.2.2 切换到上一次访问的目录\n\n\n\n\n\n要返回你上次所在的目录，请使用\
  \ `cd` 并将 `-`  作为目录名。例如，如果你位于 `/home/mrs/work/samples` 目录，并使用 `cd` 切换到了其他目录，那么在处于其他目录的任何时刻，你都可以输入\
  \ `cd -` 将当前工作目录切回 `/home/mrs/work/samples`。\n\n⇒ 要返回你上一次所在的目录，请输入：$ cd -`\n\n##\
  \ 5.2.3 获取当前目录名称\n\n大多数人的 shell 提示符（prompt）都设置为为显示当前目录的名称；这是大多数 Linux 发行版的默认设置。\n\
  \n但你始终可以使用 `pwd`（“打印工作目录”）获取当前目录的名称，它会列出当前工作目录的完整路径。\n\n⇒ 要输出当前工作目录的名称，请输入：$ pwd`\n\
  \n```bash\n/home/mrs\n$\n```\n\n在这个示例中，`pwd` 输出文本 `/home/mrs`，表示当前工作目录是 `/home/mrs`。\n\
  \n## 5.3 列出目录\n\n使用 `ls` 列出目录的内容。它接受要列出的目录名称作为参数。如果不带任何参数，`ls` 将列出当前工作目录的内容。\n\n\
  ⇒ 这里是使用该命令的一些方法。\n\n- 要列出当前工作目录的内容，请输入：$ ls`\n\n```bash\napple\ncherry\norange\n\
  $\n```\n\n- 要列出当前目录下子目录 `work` 的内容，请输入：$ ls work`\n\n- 要列出 `/usr/doc` 目录的内容，请输入：$\
  \ ls /usr/doc`\n\n第一个示例中，当前工作目录包含三个文件：apple、cherry 和 orange。\n\n接下来的小节描述了一些用于控制\
  \ `ls` 列出哪些文件的常用选项，以及 `ls` 输出了关于这些文件的哪些信息。\n\n你可以组合这些选项以获得组合效果；选项指定的顺序并不重要。选项甚至比这里给出的更多；`ls`\
  \ 的 Info 文档值得仔细细读。它是类 Unix 系统上最经常使用的文件命令之一。\n\n**注意：** 还有其他几种列出目录内容的常用方法。\n\n当在\
  \ `X` 中且你想浏览这些目录中的图像文件时，一种常用方法是使用 Mozilla 或其他 Web 浏览器作为本地文件浏览器。使用前缀 `file:` 来查看本地文件。单独使用它会打开根目录的目录列表；`file:/home/joe`\
  \ 会打开用户 joe 家目录的目录列表，`file:/usr/local/src` 会打开本地源代码目录，以此此类推。目录列表将在几乎所有浏览器中动态渲染为\
  \ html，因此你可以点击子目录跳转到它们，并点击文件在浏览器中打开它们。这种方法和其他浏览文件的方法在食谱 5.10 [浏览文件和目录] 第 157 页中描述。\n\
  \n### 5.3.1 以彩色列出目录\n\n使用带有 `--color` 选项的 `ls` 以彩色列出目录内容；文件根据其内容显示不同的颜色。某些默认颜色设置包括将目录显示为蓝色、文本文件显示为白色、可执行文件显示为绿色以及链接显示为青色。\n\
  \n⇒ 以彩色列出根目录下的文件，请输入：$ ls --color /*`\n\n此命令以彩色列出根目录，如图 5-2 所示。（虽然插图是黑白的，但实际的目录列表是有颜色的。）2\
  \ 被称为 URN，或“统一资源名称”。\n\n![](img/index-169_1.png)\n\n*图 5-2. 彩色目录列表。*\n\n**注意：**\
  \ 许多系统默认启用此标志，因此在使用无选项的 `ls` 时将彩色列出。如果你的系统不是这样设置的，而你希望如此，你始终可以在 `.bashrc` 启动文件中将\
  \ `ls` 设置为 `ls --color` 的 shell 别名（参见食谱 3.6.1 [通过其他名称调用命令] 第 83 页和食谱 3.7.3 [使用 shell\
  \ 启动文件] 第 86 页）。\n\n### 5.3.2 列出文件类型\n\n使用带有 `-F` 选项的 `ls` 显示文件名的文件类型。\n\n设置此选项后，普通文件按常显示，`ls`\
  \ 为其他文件附加以下类型的指示器：\n\n- `/` 文件是目录。\n- `*` 文件是可执行文件。\n- `@` 文件是符号链接（参见食谱 5.7 [给文件起多个名称]\
  \ 第 152 页）。\n- `|` 文件是 fifo（也称为*命名管道*），是进程用于读写的特殊文件。\n- `=` 文件是*套接字*（socket），是一种提供进程间通信的连接点的特殊文件。\n\
  \n![](img/index-170_1.jpg)\n\n⇒ 要列出目录内容，以便目录、可执行文件和特殊文件与其他所有文件区分开，请输入：$ ls -F`\n\
  \n```bash\nrepeat\ntest1\ntest2\nwords/\n$\n```\n\n在这个示例中，当前目录包含一个名为 `repeat` 的可执行文件、一个名为\
  \ `words` 的目录，以及一些名为 `test1` 和 `test2` 的其他普通文件。\n\n### 5.3.3 列出文件属性\n\n使用带有 `-l`（“长格式”）选项的\
  \ `ls` 输出更详尽的列表——一个包含每个文件大小、修改时间和所有权的列表（参见食谱 6.2 [所有权] 第 166 页）。\n\n⇒ 输出 `/home/mrs`\
  \ 目录的详细列表，请输入：$ ls -l /home/mrs`\n\n```bash\n/home/mrs\n$\n```\n\n在这个示例中，`pwd` 输出文本\
  \ `/home/mrs`，表示当前工作目录是 `/home/mrs`。\n\n第一行输出文件占用的总空间，以 1024 字节块为单位。后续每行显示关于一个文件的列信息。第一列显示类型；第一个字符\
  \ `-` 表示该文件是普通文件。目录由 `d` 表示，符号链接（参见食谱 5.7 [给文件起多个名称] 第 155 页）由 `l` 表示。其余九字符显示权限。第三列和第四列显示该文件所属的用户和组名。第五列显示文件大小（字节），第六列显示最后修改日期，最后一列显示文件名。\n\
  \n其他选项可以更改长格式输出的默认值。\n\n要将修改日期从简写的月份、日期和年份输出改为显示完整的时间日期（如 `date` 的默认输出，参见 27.1 [显示日期和时间]\
  \ 第 537 页），请使用特殊的 `--full-time` 选项。\n\n⇒ 输出 `/usr/share/bash` 目录的详细列表并给出完整的修改时间日期，请输入：$\
  \ ls -l --full-time /usr/share/bash`\n\n此命令列出 `/usr/share/bash` 目录下的文件详细列表，显示完整的修改时间和日期，如图\
  \ 5-4 所示。\n\n要指定输出中的数字以“人类可读”的格式而不是块格式，请使用 `-h` 选项。当与 `-l` 结合时，它将总空间和每个文件的大小以字节、千字节（后跟\
  \ k）或兆字节（后跟 M）的形式给出。\n\n⇒ 输出 `/usr/share/bash` 目录的详细列表并以人类可读的格式给出所有数字，请输入：$ ls -lh\
  \ /usr/share/bash`\n\n*图 5-5. 具有人类可读数字的详细目录。*\n\n\n\n\n人类可读的格式，如图 5-5 所示。\n\n###\
  \ 5.3.4 列出隐藏文件\n\n默认情况下，`ls` 不输出以点字符（`.`）开头的文件。\n\n为了减少混乱，许多应用程序通过赋予以点开头的名称来“隐藏”你家目录中的配置文件；这些被称为*点**文件*（dot\
  \ files），或者有时被称为“隐藏”文件。如前所述，每个目录都有两个特殊的点文件：`..`（父目录）和 `.`（目录本身）。\n\n要列出目录的*所有*内容，包括这些点文件，请使用\
  \ `-a` 选项。\n\n*⇒* 列出当前目录下的所有文件，输入：\n```bash\n$ ls -a\n```\nRET\n\n使用 `-A` 选项列出目录中*几乎*所有文件：它列出所有文件，包括点文件除了`..`\
  \ 和 `.` 目录文件。\n\n*⇒* 列出当前目录中除 `..` 和 `.` 外的所有文件，输入：\n```bash\n$ ls -A\n```\nRET\n\
  \n### 5.3.5 分列列出目录\n\n使用 `-1` 选项以单列列出目录。文件将每行显示一个。这便于剪切粘贴。\n\n*⇒* 以单列列出 `/usr/bin`\
  \ 的内容，输入：\n```bash\n$ ls -1 /usr/bin\n```\nRET\n\n当 `ls` 的输出通过到终端以外的任何地方时，`ls` 会使用这种单列格式。\n\
  \n通常，`ls` 垂直方向列出文件——首先填充最左侧列，然后是下一列，一直到屏幕右侧。使用 `-x` 让列改为*水平*列出——这样第一行将先填充文件名，然后是下一行，直到所有文件都列出。\n\
  \n第 5 章：文件与目录\n\n139\n\n*⇒* 以水平打印的列出 `/usr/bin` 的内容，输入：\n```bash\n$ ls -x /usr/bin\n\
  ```\nRET\n\n使用 `-m` 选项不以列的形式输出文件，而是以单行水平输出，并用逗号分隔。\n\n*⇒* 以单行输出 `/usr/bin` 的内容，文件名用逗号分隔，输入：\n\
  \n```bash\n$ ls -m /usr/bin\n```\nRET\n\n### 5.3.6 按排序顺序列出文件\n\n默认情况下，`ls` 输出的文件列表按字母顺序（字符顺序）排序——也就是说，文件按从小到大的\
  \ ASCII 码排序（参见食谱 9.3.7 [查看字符集]，第 228 页），因此，例如大写字母开头的文件列在小写字母开头的文件之前。\n\n有几个选项可以控制输出的排序方式；下面给出了一些。\n\
  \n#### 方法 #1\n\n按大小排序文件，使用 `-S` 选项。文件按从到小的顺序排序。\n\n*⇒* 按大小列出 `/usr/bin` 目录中的所有文件，最大的在前面，输入：\n\
  \n```bash\n$ ls -S /usr/bin\n```\nRET\n\n#### 方法 #2\n\n在 `ls` 中使用 `-t` 选项按*时间*对目录列表进行排序，使文件根据最后修改时间列出，最近修改的排在前面。\n\
  \n*⇒* 按修改时间列出 `/usr/tmp` 目录中的所有文件，最近修改的文件在前面，输入：\n```bash\n$ ls -t /usr/tmp\n```\n\
  RET\n\n#### 方法 #3\n\n按扩展名排序文件，使用 `-X` 选项。没有扩展名的文件列在前面。\n\n*⇒* 按扩展名列出当前目录中的所有文件，输入：\n\
  ```bash\n$ ls -X\n```\nRET\n\n140\n\n《Linux 鸟书》，第 2 版\n\n#### 方法 #4\n\n使用 `-v` 进行*版本排序*，其中文件名不是按字符排序，而是按数字编号的方式进行排序，这样\
  \ `file-2` 将位于 `file-1` 和 `file-10` 之间，而不是像普通字符排序那样排在两个文件之后。这对于文件名以某种方式编号的文件（例如版本、索引或日期）很有用。\n\
  \n*⇒* 列出当前目录下所有以 `.jpeg` 结尾并按版本排序的文件，输入：\n\n```bash\n$ ls -v *.jpeg\n```\nRET\n\n\
  #### 方法 #5\n\n使用 `-r` *反转*排序输出的顺序。这适用于所有其他排序选项。\n\n*⇒* 从高 ASCII 字符值到低值列出当前目录中的文件，输入：\n\
  \n```bash\n$ ls -r\n```\nRET\n\n*⇒* 按大小从从小到大列出 `/usr/bin` 目录中的所有文件，最小的在前，输入：\n```bash\n\
  $ ls -Sr /usr/bin\n```\nRET\n\n*⇒* 按修改日期列出当前目录中的所有文件，最近修改的文件在最后，输入：\n```bash\n$\
  \ ls -tr\n```\nRET\n\n#### 方法 #6\n\n使用 `-U` 选项关闭所有排序并按*未排序*顺序输出文件——即它们在磁盘上出现的顺序。\n\
  \n*⇒* 按磁盘上出现的顺序输出当前目录中的所有文件，输入：\n\n```bash\n$ ls -U\n```\nRET\n\n### 5.3.7 递归列出子目录\n\
  \n通常当你列出一个目录时，子目录只是按名称列出——其内容不会列出。要列出目录包含的所有子目录，请使用 `-R` 选项。\n\n第 5 章：文件与目录\n\n\
  141\n\n递归列出目录的内容，包括子目录。\n\n*⇒* 递归列出根目录的内容，输入：\n```bash\n$ls -R\n```\nRET\n\n该命令会递归地列出目录的内容，包括子目录。....\
  \ 5.4 复制文件与目录\n\n使用 `cp` (“复制”)来复制文件。它接受两个参数：*源文件*（即要复制的文件）和*目标文件*（即新文件的文件名）。`cp`\
  \ 命令随后为源文件创建一个相同的副本。如果目标文件名已存在文件，`cp` 将覆盖它。它不会更改源文件。\n\n*⇒* 将 `my-copy` 复制到 `neighbor-copy`，输入：\n\
  ```bash\n$ cp my-copy neighbor-copy\n```\nRET\n\n142\n\n《Linux 鸟书》，第 2 版\n\n该命令创建一个名为\
  \ `neighbor-copy` 的新文件，它在名称外与 `my-copy` 完全相同——新文件具有显示复制时间的时间戳。\n\n使用 `-v` (“详细输出”）选项在复制文件时列出它们。这对于大型拷贝很有用，因为有很多文件正在复制，你可以监控进度。\n\
  \n*⇒* 将 `~/workgroup/final` 目录中的所有文件复制到 `~/workgroup/backup` 目录，指定详细输出以便每个文件在复制时都列出，输入：\n\
  \n```bash\n$ cp -v ~/workgroup/final/* ~/workgroup/backup\n```\nRET\n\n### 5.4.1\
  \ 带有属性复制文件\n\n当你复制文件时，时间戳和文件所有权等属性在原始文件和拷贝之间会有不同。使用带有 `-p` 选项的 `cp` 尽可能保留原始属性，包括时间戳、所有者、组和权限。\n\
  \n*⇒* 将 `my-copy` 复制到 `neighbor-copy`，在目标文件中保留源文件的所有属性，输入：\n```bash\n$ cp -p my-copy\
  \ neighbor-copy\n```\nRET\n\n该命令将 `my-copy` 复制到名为 `neighbor-copy` 的新文件中，它除了名称外与\
  \ `my-copy` 完全相同。\n\n虽然 `-p` 不复制目录包含的任何子目录，但你可以改用 `-a` (“归档”)选项，它尽可能保留属性，但还会复制任何子目录以及符号链接（参见食谱\
  \ 5.7 [给文件起多个名称]，第 152 页）。这有利于将一个目录树存档备份到另一个目录树。\n\n\n\n\n*⇒ 要将 `/cdrom` 的内容归档拷贝到当前目录，输入：\n\
  \n```bash\ncp -a /cdrom .*\n```\nRET\n\n此命令将 `/cdrom` 拷贝（包括其可能包含的任何子目录）到当前目录。原始文件属性在副本中会被保留。\n\
  \n**注意**：*快照*是目录树的副本，显示了它在特定时间的状态。快照通常在软件开发项目中的每次发布时创建——“对当前版本拍摄快照”意味着对包含源代码的目录树创建一个归档副本。\n\
  \n# 第 5 章：文件与目录\n\n143\n\n要为目录树创建快照，请如上所示使用带有 `-a` 选项的 `cp` 命令。\n\n## 5.4.2 复制子目录\n\
  \n要复制目录及其包含的文件和子目录，请使用 `-R` 选项——它会对指定的目录及其整个内容进行*递归*复制。\n\n*⇒ 要将目录 `public_html`\
  \ 及其所有文件和子目录复制到名为 `private_html` 的新目录，输入：\n\n```bash\ncp -R public_html private_html\n\
  ```\nRET\n\n`-R` 选项不会复制符号链接文件（参见配方 5.7 [给一个文件起多个名称]，第 152 页），并且不会保留所有原始权限。要递归复制目录（包括链接）并保留其所有权限，请使用\
  \ `-a`（“归档”）选项。这对于为大型目录树创建备份副本非常有用。\n\n*⇒ 要将目录树 `public_html` 归档拷贝到目录 `private_html`，输入：\n\
  \n```bash\ncp -a public_html private_html\n```\nRET\n\n## 5.4.3 通过唯一父目录复制文件\n\n\
  有时，我们希望复制或重命名一组具有共同名称的文件，以便新名称与每个原始文件所属的唯一父目录匹配。为了实现这一点，使用 `basename` 为 `cp` 命令获取每个唯一路径的名称。使用\
  \ Bash 的内置 `for` 结构遍历所有文件，并在每个文件上运行该命令行（有关该内置构构件的更多信息，请参阅 Bash Info 文档）。\n\n例如，假设你的主目录下有一个名为\
  \ `photographs` 的目录，其中有若干子目录，每个子目录以一个唯一的数字命名，且每个子目录都包含许多目录，如图 5-6 所示，其中一个名为 `src`。\n\
  \n假设你只想复制 `src` 目录及其内容，但希望这些复制的目录的名称为 `src` 之前的唯一路径（01、02 等）。使用 `basename` 将唯一路径传递给\
  \ `cp`。\n\n144\n\n《Linux 命令行手册》，第 2 版\n\n~/photographs/01/\n~/photographs/01/640x480\n\
  ~/photographs/01/320x280\n~/photographs/01/src\n~/photographs/02\n~/photographs/02/640x480\n\
  ~/photographs/02/320x280\n~/photographs/02/src\n~/photographs/03\n~/photographs/03/640x480\n\
  ~/photographs/03/320x280\n~/photographs/03/src\n*... 继续 ...*\n\n图 5-6. 具有唯一父目录的子目录。\n\
  \n*⇒ 要将所有 `src` 目录复制到 `/mnt` 目录，并为每个文件赋予在 `~/photographs` 中父目录的唯一名称，输入：\n\n```bash\n\
  for i in ~/photographs/**\n{\n    cp -a $i/src /mnt/`basename $i`\n}\n```\n\n此命令复制\
  \ `~/photographs` 中所有的 `src` 目录，并赋予它们父目录的唯一名称——使得 `~/photographs/01/src` 变成 `/mnt/01`，`~/photographs/02/src`\
  \ 变成 `/mnt/02`，依此类推。\n\n你可以使用分号（`;`）将所有内容在一行命令行中作为单个命令运行（参见配方 3.1.7 [运行命令列表]，第 63\
  \ 页）。以下命令与前面的示例等效：`for i in ~/photographs/*; { cp -a $i/src /mnt/`basename $i`;\
  \ }`\n\n**注意**：如需用此方法通过*重命名*文件，请使用 `mv` 代替 `cp`（参见配方 5.5 [移动文件和目录]，第 144 页）。\n\n\
  ## 5.5 移动文件和目录\n\n使用 `mv`（“移动”）工具将文件或目录移动或重命名到不同的位置。它接受两个参数：要移动的文件或目录名称，随后是移动到的路径名。如果你将文件移动到一个包含同名文件的目录，该文件将被覆盖。\n\
  \n第 5 章：文件与目录\n\n145\n\n*⇒ 要将当前工作目录下的文件 `notes` 移动到 `../play`，输入：\n\n```bash\nmv\
  \ notes ../play\n```\nRET\n\n此命令将当前目录下的 `notes` 文件移动到 `play`，它是当前工作目录父目录的一个子目录。如果\
  \ `play` 中已存在文件 `notes`，则该文件将被覆盖。如果子目录 `play` 不存在，此命令将 `notes` 文件从当前目录移动到其父目录，并将文件重命名为\
  \ `play`。\n\n如果你将一个文件移动到一个包含同名文件的目录，该文件将被覆盖。\n\n*⇒ 要将文件或目录 移动或重命名到不同的位置。\n\n要移动一个文件，将其移动到不同的位置。\n\
