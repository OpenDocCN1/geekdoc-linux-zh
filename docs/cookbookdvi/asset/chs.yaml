  # 概念索引 (747)\n\n《Linux 食谱》，第 2 版\n\n## 第二修订版序言\n\n这是一本关于如何利用计算机以最佳且最高效的方式完成工作的书。就像菜谱一样，它提供了经过测试的配方，用于成功准备或完成特定的任务。\n\
  \n在本书第一版的序言中，我曾这样解释它：我知道 Linux 并不难用，特别是与其他软件和操作系统相比时，但需要的是一份指南，告诉人们如何使用它来完成任务：“哦，你想做那个吗？来，输入这个命令。”\n\
  \n这解释了本书的初衷——这是一本关于在 Linux 系统上完成任务的实战指南，专为不一定是程序员的普通用户设计。这本全新的修订版 `Cookbook` 保留了所有内容并更进一步。它的涵盖范围已经扩大，每一个配方都经过了精炼。\n\
  \n再次，这本书的出版离不开一些个人的帮助，现在我很荣幸地感谢他们——首位是 Starch Press 的同事：出版者 William Pollock；在 Karol\
  \ Jurado 的编辑下完成了本书的准备；John Mark Walker 对手稿进行了技术审查；以及感谢在加速生产方面提供有用帮助的 Hillel Heinstein、Riley\
  \ Hoffman 和 Leigh Sacks。我代表出版社感谢 Andy Carroll 和 Mary Johnson 提供了宝贵的纠正和建议。\n\n我还要感谢以下个人提供的批判性意见和建议：Ralph\
  \ Amissah, Jiri Baum, Simon Bellwood, Conny Brunnkvist, Ed Casas, John R. Daily,\
  \ Herbert Martin Dietze, Eric Engberg, David Fabiani, Nelson Correa de Toledo Ferraz,\
  \ John Gilmore, Sven Grewe, V.T. Jones, Donald E. Knuth, Rüdiger Kuhlmann, Adrian\
  \ Lanning, Jonathan Nichol, Miroslaw Osys, Fernando Perez, Alex Radsky, Mark Rahner,\
  \ Rinaldo Rasa, Roel Schroeven, Ken Stewart, Frank Wallingford, Rich Warren, 以及\
  \ Albert Witteveen。\n\n最后，我很高兴感谢那些老面孔的鼓励和一直陪伴：Jack Angelotta, Bradford W. Byron,\
  \ Aldo P. Magi, Steven Snedker, Walter V. Stutz 先生夫妇，以及——最重要的——Marie R. Stutz。\n\
  \n这本书三年前出版了第一版，而它的构思在四年前。生活在不断向前。而在它的表现上，Linux 系统也在不断变化；这个外壳随着季节的时尚而移动，老去并过时，最终消失在时间的长河中，而其内核并非如此。\n\
