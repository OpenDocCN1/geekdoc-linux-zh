  \ 由于系统错误，上述文本出现了大量重复，此处已根据要求完成清理翻译。\n\n\n\n\n\n# 全球维网\n\nNetscape 的浏览器，从最早的 Navigator\
  \ 版本到后来的 Communicator 系列，在公司内部一直被称为 `Mozilla`；这是对 Mosaic 名称的一个幽默双关语，Mosaic 是 20\
  \ 世纪 90 年代初第一个流行的图形化 Web 浏览器——Netscape 的目标是打造一个“Mosaic 杀手”。\n\n这个术语是我提出的。Mozilla\
  \ 将其称为为 `home page`（首页），但这很令人困惑，因为该术语主要指的是个人或组织发布的 网站的主页。\n\n![](img/index-673_1.jpg)\n\
  \n⇒ 以下是使用该功能的一些方法。\n\n* 使用你的默认起始页启动 Mozilla，输入：`$ mozilla`\nRET\n\n* 使用 url `http://gutenberg.net/`\
  \ 启动 Mozilla，输入：`$ mozilla http://gutenberg.net/`\n\nRET\n\n一个典型的 Mozilla 窗口如图 33-1\
  \ 所示，其中加载了美国会图书馆 `[http://www.loc.gov/]` 的首页。\n\n*图 33-1. Mozilla。*\n\n网页标题和 Mozilla\
  \ 名称写在 Mozilla 窗口的标题栏中。\n\nMozilla 窗口顶部的栏被称为 `Menu Bar`（菜单栏），包含用于访问其所有主要功能的下拉菜单。其下方的栏被称为\
  \ `Navigation Bar`（导航栏），包含控制页面导航的按钮。`Navigation Bar` 中间的 `Location box`（位置框）包含当前加载页面的\
  \ url。它还有搜索、打印按钮以及一个样式化的蓝色 M 标志，它可以带你去 Mozilla 首页 `[http://www.mozilla.org/]`。\n\
  \n在下方，窗口最大的区域用于显示网页本身。\n\n底部是 `Status Bar`（状态栏），它告诉你（以及其他信息）当前 Web 页面或文档的状态。在示例中，状态为\
  \ `Done`（完成），意味着整个页面已成功加载。\n\n和大多数图形化 Web 浏览器一样，它的用法非常直而了懂。在 `Location` 对话框中输入 url\
  \ 以打开该 url，左键点击链接以进行跳转，用该链接的内容替换浏览器窗口的内容。\n\n点击鼠标右键会打开一个特殊的选项菜单，其内容取决于鼠标指针的上下文。如果指针在链接上时你点击右键，你将看到几个处理链接的选项，包括在新窗口中打开它、将其书签以及显示其属性。如果指针在图像上时点击右键，你将看到处理图像的选项，包括查看它（浏览器将图像显示为自己的“页面”）、将其保存为文件以及将其书签。\n\
  \n如果指针在空白区域、纯文本或页面的其他地方时点击右键，你将看到处理当前页面的选项，包括将其书签、查看其 html 源代码或页面信息、重新加载以及保存。\n\n\
  ## 33.1.2 使用基础 Mozilla 快捷键\n\n下表列出了 Mozilla 中的基础导航键。\n\n### 导航\n\n| 键位 | 说明 |\n\
  | :--- | :--- |\n| `ALT -` | 返回上一次访问的 url |\n| `ALT -` | 前进到历史记录中的下一个 url。 |\n|\
  \ `CTRL - H` | 打开浏览器历史记录。 |\n| `ALT - HOME` | 转到预定义的 Mozilla 起始页（或“首页”）。 |\n| `SHIFT\
  \ - CTRL - L` | 打开一个 url。 |\n\n### 书签\n\n| 键位 | 说明 |\n| :--- | :--- |\n| `CTRL -\
  \ B` | 在新窗口中打开你的书签文件。 |\n| `CTRL - D` | 将带有当前属性的页面添加到书签文件的底部。 |\n| `SHIFT - CTRL\
  \ - D` | 在书签文件的特定位置添加页面，同时可选择编辑其属性。 |\n\n### 窗口操作\n\n| 键位 | 说明 |\n| :--- | :---\
  \ |\n| `CTRL - N` | 打开一个新的 Mozilla 窗口（参见下文配方）。 |\n| `CTRL - W` | 关闭当前 Mozilla 窗口。\
  \ |\n| `CTRL - Q` | 退出 Mozilla。 |\n\n### 页面查看\n\n| 键位 | 说明 |\n| :--- | :--- |\n\
  | `ESC` | 停止加载当前页面。 |\n| `CTRL - R` | 重新加载当前页面。 |\n| `CTRL - U` | 查看当前页面的 html 源代码。\
  \ |\n| `CTRL - I` | 查看当前页面的文件和服务器信息。 |\n| `CTRL -` | 减小字体大小。 |\n| `CTRL - +` | 增大字体大小。\
  \ |\n| `CTRL - E` | 编辑当前页面。 |\n| `CTRL - P` | 打印当前页面。 |\n\n### 文本选择\n\n| 键位 | 说明\
  \ |\n| :--- | :--- |\n| `CTRL - A` | 选择页面上的所有文本。 |\n| `CTRL - X` | 剪切选中文本。 |\n|\
  \ `CTRL - C` | 复制选中文本。 |\n| `CTRL - V` | 粘贴选中文本。 |\n| `DEL` | 删除选中文本。 |\n| `CTRL\
  \ - Z` | 撤销上一次文本操作。 |\n| `CTRL - Y` | 重做上一次文本操作。 |\n\n### 文件操作\n\n| 键位 | 说明 |\n\
  | :--- | :--- |\n| `CTRL - O` | 打开文件进行查看。 |\n| `CTRL - S` | 将当前页面保存为文件。 |\n\n**注意：**\
  \ 这些键在某些窗口管理器中可能无法产生预期效果；如果它们对你无效，请尝试使用 `CTRL` 键代替 `ALT` 键。\n\n对于 Emacs 粉丝来说，一个很棒的功能是你可以在\
  \ Mozilla 的对话框框中使用 Emacs 风格的快捷键进行光标移动（参见配方 10.1.3 [使用基础 Emacs 编辑快捷键]，第 237 页）。\n\
  \n## 33.1.3 创建新的 Mozilla 窗口\n\n同时打开多个 Mozilla 窗口通常很有用——这样可以同时显示多个 Web 页面。有两种方法：一种是创建一个包含链接内容的新窗口，另一种是创建一个包含你的\
  \ Mozilla 起始页的窗口。\n\n### 方法 #1\n\n要在新的 Mozilla 窗口中打开链接，请点击链接鼠标中键。当你进行大量“深度浏览”时，将多个链接在各自的窗口中打开可以节省时间。\n\
  \n### 方法 #2\n\n要打开内容为 Mozilla 起始页的新 Mozilla 窗口，输入 `CTRL - N`。\n\n## 33.1.4 从 Mozilla\
  \ 复制链接到剪贴板\n\n要在 Mozilla 中复制链接到剪贴板，右键点击链接然后选择 `Copy Link Location`（复制链接位置）。\n\n\
  然后你可以将链接粘贴到其他地方，包括另一个 X 窗口，只需在想要粘贴的地方点击中键即可（参见配方 10.3 [文本选择]，第 253 页）。\n\n**注意：**\
  \ 要复制 url（例如显示在 `Location` 对话框中的 url），用左键点击 url 的两侧并拖动。你就可以将其粘贴到其他地方。\n\n## 33.1.5\
  \ 从 Mozilla 复制邮箱地址到剪贴板\n\n要在 Mozilla 中复制邮箱地址到剪贴板，右键点击地址并选择 `Copy Email Address`（复制邮箱地址）。\n\
  \n然后你可以将地址粘贴到其他地方，包括另一个 X 窗口，只需在想要粘贴的地方点击中键即可（参见配方 10.3 [文本选择]，第 253 页）。\n\n## 33.1.6\
  \ 在 Mozilla 中搜索网页源代码\n\n查找页面命令（参见配方 33.1.2 [使用基础 Mozilla 快捷键]，第 640 页）适用于 Mozilla\
  \ 中显示的任何页面，包括 html 源代码。这对于搜索显示中不可见的链接或其他文本非常有用。\n\n⇒ 要搜索网页源代码，请执行以下操作：\n1. 在网页上输入\
  \ `CTRL - U` 查看其源码。\n2. 使用鼠标指针移动到源码窗口。\n3. 输入 `CTRL - F` 在源码中查找文本。\n4. 输入要搜索的文本并按\
  \ `RET`。\n5. 输入 `CTRL - G` 重复搜索。\n\n## 33.2 使用 Lynx\n\nLynx\n\nDEB: lynx\n\nRPM:\
  \ lynx\n\nWWW: http://lynx.browser.org/\n\n截至本文编写，古老的 Lynx 仍然是许多 Linux 系统的标准 Web\
  \ 浏览器；它也是最早提供的 Web 浏览器之一。它不显示图形，但它是阅读超文本的良好界面。\n\n输入 `lynx` 启动。如果定义了起始页，它将加载（参见配方\
  \ 33.7 [设置起始页]，第 658 页）。\n\n要打开 url，将其作为参数提供。\n\n⇒ 要查看 url `http://www.whitehouse.gov/`\
  \ 的内容，输入：` lynx http://www.whitehouse.gov/`\n\nRET\n\n### 33.2.1 使用基础 Lynx 快捷键\n\
  \n下表描述了在 Lynx 中有效的一些键盘命令。\n\n\n\n\n\n正如我那个时代的许多人一样，我是通过 `Lynx` 第一次看到 Web 的。\n\n\
  《Linux Cookbook》，第 2 版\n\n# 文档内导航\n\n- 在当前文档的链接中向上移动（后退）：`CTRL - N`\n- 在当前文档的链接中向下移动（前进）：`CTRL\
  \ - P`\n- 移动到当前文档的 `next` 行：`CTRL - P`\n- 移动到当前文档的 `previous` 行：`PgDn` 或 `CTRL -\
  \ F`\n- 向下滚动（向前）到当前文档的下一页：`SPACEBAR` 或 `+`\n- 向上滚动（后退）到当前文档的上一页：`PgUp` 或 `CTRL -\
  \ B`\n- 移动到当前文档的开头：`CTRL - A`\n- 移动到当前文档的结尾：`CTRL - E`\n\n# 文档间导航\n\n- 跳转到 url；`Lynx`\
  \ 会提示你要访问的 url。输入 `g` 在此行插入上次访问的 url；插入后你可以对其进行编辑。\n- 通过编辑当前 url 来跳转；`Lynx` 会显示当前\
  \ url 并允许你编辑：`G` 或 `RET`。\n- 遵循光标当前选中的超链接：`G`。\n- 返回上一个文档：`DEL`。\n- 查看会话期间访问的所有文档历史：`Z`。\n\
  - 停止下载当前页面：`Z`。\n\n# 信息与帮助\n\n- 显示 `Lynx` 帮助文件：`H` 或 `?`\n- 显示按键命令完整列表：`K`\n- 显示当前文档信息（如\
  \ `Lynx` 中显示的所有文档，输入 `=` 返回上一个文档）：`=`\n- 在当前页面的渲染 HTML 显示和源代码显示之间切换：`\\ `\n- 显示当前会话中访问过的链接历史：`BKSP`\n\
  \n# 退出 Lynx\n\n- 临时退出到 shell（`CTRL - D` 返回）：`!`\n- 退出浏览并退出程序；`Lynx` 会要求你确认此操作：`q`\n\
  - 不经验证退出浏览并退出程序：`Q` 或 `CTRL - D`\n\n## 33.2.2 从 Lynx 保存网页\n\n使用“打印到本地文件”（Print to\
  \ local file）选项来保存 `Lynx` 中网页的渲染内容或 html 源代码文件。\n\n⇒ 这里有两种使用方法：\n\n- 要保存 `Lynx`\
  \ 中显示的网页渲染内容，请执行以下操作：\n  1. 输入 `P`（`print` 选项）打开打印选项页面。\n  2. 选择 `Print to local\
  \ file` 并按 `RET`。\n- 要保存 `Lynx` 中显示的网页 html 源码，请执行以下操作：\n  1. 输入 `*` 查看源码。\n  2.\
  \ 输入 `p` 打开打印选项页面。\n  3. 选择 `Print to local file`。\n\n## 33.2.3 列出页面中的所有链接\n\n当你想要浏览页面包含的所有链接的超文本列表（经过编号并以\
  \ html 格式排列，以便列表中的每个成员都是热链接）时，在 `Lynx` 中查看页面时使用列表引用命令。\n\n⇒ 要查看当前页的所有链接列表，按 `L`。\n\
  \n当你输入此命令时，`Lynx` 会加载一个新页面，其中包含你正在查看页面中所有链接列表（称为 `references`）。这个列表让人想起旧的 Internet\
  \ Gopher 服务，非常适合查看包含“隐藏”链接的页面链接，例如某些图像链接。它也适合为页面包含的链接创建 html 注释列表；可以通过上一个配方描述保存链接页面来实现。\n\
  \n## 33.2.4 从 Web 发送文本到标准输出\n\n要输出 url 的渲染文本，请使用带有 `-dump` 选项的 `lynx`。这会将给定 url\
  \ 的文本导出到标准输出，你可以将其管道至 `less` 以查看，或使用重定向将其保存到文件。这有助于很多事情，包括查看或格式化来自 Web 的文本。\n\n\
  ⇒ 获取 `http://sc.edu/fitzgerald/winterd/winter.html` 的文本并查看，输入（全部在一行）：\n\n```bash\n\
  $ lynx -dump http://www.sc.edu/fitzgerald/winterd/winter.html | less\n```\n```bash\n\
  RET\n```\n\n一种旧的网络惯例是将斜体词显示在带有下划线内部的 etext 中，如 `_this_`；使用 `-underscore` 选项以这种方式输出任何斜体文本。\n\
  \n默认情况下，`lynx` 会对所有超链接进行注释，并在屏幕底部生成带脚注的链接列表。如果你不需要它们，添加 `-nolist` 选项并将仅返回“纯文本”。\n\
  \n⇒ 输出上一个 url 的带下划线的纯文本，并将其保存到文件 `winter_dreams`，输入（全部在一行）：\n\n```bash\n$ lynx -dump\
  \ -nolist -underscore http://sc.edu/fitzgerald/winterd/winter.html > winter_dreams\n\
  ```\n```bash\nRET\n```\n\n要指定 dump 的行宽（字符数），请使用 `-width=` 选项给出。默认值为 `80`。你可以对纯文本进行其他操作，例如将其管道至\
  \ `enscript` 以设置打印字体。\n\n这些链接由 `-number_links` 选项控制；你也可以通过此选项在普通浏览中开启注释和脚注。\n\n\
  ⇒ 以 Times Roman 字体打印上一个 url 的纯文本，并将下划线转换为斜体，行宽为 40 个字符，输入（全部在一行）：\n\n```bash\n$\
  \ lynx -dump -width=40 -nolist -underscore http://sc.edu/fitzgerald/winterd/winter.html\
  \ | enscript -B -Eetext -f \"Times-Roman12\"\n```\n```bash\nRET\n```\n\n**注意：**\
  \ 要查看移除 html 标签且未对文本进行格式化的 url 纯文本，请参见配方 33.9.2 [转换 html]，第 663 页。\n\n你还可以使用 `-dump`\
  \ 选项打印网页（参见配方 25.2.4 [打印网页]，第 514 页），或将 Web 上的文件传递给另一个命令，例如将 wav 音频文件传递给 `sox` 音频处理工具。\n\
  \n## 33.2.5 查看需要授权的站点\n\n要查看需要注册的站点或网页，使用带有 `-auth` 选项的 `lynx`，并将用户名和密码作为参数用冒号（`:`）分隔。\n\
  \n⇒ 使用用户名和密码 `guest` 访问 `http://www.example.com/archive/`，输入：\n\n```bash\n$ lynx\
  \ -auth=guest:guest http://www.example.com/archive/\n```\n```bash\nRET\n```\n\n\
  将此与保存文件的选项结合使用是常见的，这样你就可以从通常需要注册的站点获取文件的带注释文本副本。\n\n⇒ 将 url `http://www.example.com/archive/`\
  \ 保存为注释文本文件 `mynews`，输入（全部在一行）：\n\n```bash\n$ lynx -dump -number_links -auth=guest:guest\
  \ http://www.example.com/archive/ > mynews\n```\n```bash\nRET\n```\n\n**注意：** 你在命令行提供的用户名和密码参数将记录在你的\
  \ shell 日志中（参见配方 3.4 [使用你的命令历史]，第 74 页），如果系统上的其他用户查看你运行的进程，他们将看到它们（参见配方 2.7.2 [列出用户所有进程]，第\
  \ 42 页）。\n\n## 33.2.6 查看 html 选择\n\n要在 `Lynx` 中查看渲染的 html 源码，选择源码并使用带有 `-stdin`\
  \ 选项的 `lynx` 从标准输入读取其起始页。然后将选择的内容粘贴到 `Lynx` 的标准输入中。\n\n如果你有朋友给你发 html 格式的邮件，而你无法通过\
  \ `mu` 方便地阅读，这个冷为人知的小技巧将让你快乐。\n\n⇒ 要将 html 源码选择作为渲染文本，请执行以下操作：\n1. 通过左键点击并拖动鼠标指针来选择要渲染的源码（参见配方\
  \ 10.3 [操作文本选择]，第 253 页）。\n2. 在终端中启动 `Lynx`，使其从标准输入读取：\n\n```bash\n$ lynx -stdin\n\
  ```\n```bash\nRET\n```\n3. 在运行 `Lynx` 的终端中，点击鼠标中间键以粘贴文本。\n4. 在该终端中输入 `CTRL - D`\
  \ 结束对 `Lynx` 的输入。\n\n当你这样做时，`Lynx` 将渲染并显示 html 代码。\n\n\n\n\n\n**注意：** Lynx 在显示代码后仍会运行，此时你必须输入\
  \ `Q` 来退出并关闭 Lynx。或者，包含 `-dump` 选项让 Lynx 将渲染后的 HTML 输出到标准输出，然后立即退出。\n\n每当你从流中获取\
  \ HTML 代码时，你都可以将其管道到 `lynx -stdin -dump` 以将渲染后的代码显示在标准输出。\n\n这种技术也适用于测试任意选择的 HTML\
  \ 代码。\n\n### 33.2.7 在 Lynx 中指定键绑定\n\n你可以在 Lynx 中指定特殊的键位绑定，使得移动命令的操作方式与你喜喜欢的编辑器完全一样：使用\
  \ `-emacskeys` 选项启用 Emacs 风格的键绑定，使用 `-vikeys` 选项启用 Vi 风格的键绑定。\n\n⇒ 使用 Vi 风格的键位绑定通过\
  \ URL `http://nostarch.com/` 启动 Lynx，请输入：\n\n```\n$lynx -vikeys http://nostarch.com/\n\
  ```\nRET\n\n### 33.2.8 使用鼠标使用 Lynx\n\n要配合鼠标使用 Lynx，请给 `lynx` 提供 `-use_mouse` 选项。如果你的\
  \ Lynx 版本启用了鼠标支持，提供此选项将允许你只需点击鼠标左键即可跟踪链接；在窗口任何地方点击鼠标右键即可返回到上次访问的页面。\n\n![](img/index-683_1.jpg)\n\
  \n第 33 章：万维网\n649\n\n⇒ 使用鼠标通过 `lynx` 浏览 `/usr/share/doc` 目录下的文件，请输入：\n\n```\n$lynx\
  \ -use_mouse /usr/share/doc\n```\nRET\n\n### 33.3 在 Emacs 中访问 Web\n\nW3\n\nDEB:\
  \ `w3-el-e21`\n\nRPM: `w3`\n\nWWW: `http://www.cs.indiana.edu/elisp/w3/docs.html`\n\
  \n可以在 Emacs 中获取 Web。目前它非常慢，但可能有其用处。要实现这一点，请使用 `w3-mode`。它的功能很多——你唯一可能想念的功能就是 SSL\
  \ 支持（尽管这可能即将推出）以及 JavaScript 和 Java 支持（嗯，*你*可能不会想念它们，但会让某些网站变得有些难以使用）。它可以处理框架、表格、样式表以及许多其他\
  \ HTML 特性。\n\n*图 33-2. Emacs 中的 w3-mode。*\n\n⇒ 在 Emacs 中加载 `w3-mode`，输入：\n\n```\n\
  ALT - X w3\n```\nRET\n\n在新缓冲区中打开 URL，输入 `CTRL - O` 并在微缓冲区（minibuffer）中给出要打开的 URL（留空将打开\
  \ w3-mode 主页）。中间点击链接以跟踪它，从而在新缓冲区中打开该 URL。\n\n⇒ 这里有两种使用此功能的方法。\n\n• 打开 URL `http://emacs.org/`，输入：\n\
  \n```\nCTRL - O http://emacs.org/\n```\nRET\n\n• 打开 w3-mode 主页的 URL，输入：\n\n```\n\
  CTRL - O\n```\nRET\n\n上一个示例在独立的缓冲区中打开了 `w3-mode` 主页，如图 33-2 所示。\n\n下表描述了在 w3-mode\
  \ 模式下的一些特殊命令。\n\n| 命令 | 说明 |\n| :--- | :--- |\n| `SPACEBAR` | 跟踪光标处的链接。 |\n| `BKSP`\
  \ | 在当前缓冲区中向下滚动。 |\n| `ALT - TAB` | 在当前缓冲区向上向上。 |\n| `ALT - S` | 将当前文档的 URL 插入另一个缓冲区。\
  \ |\n| `CTRL - O` | 将文档保存到本地磁盘（你可以从 HTML 源码、格式化文本、LaTEX 源码或二进制文件中选择）。 |\n| `B` |\
  \ 打开 URL。 |\n| `F` | 在访问过的 URL 历史栈中后移动。 |\n| `F` | 在访问过的 URL 历史栈中向前移动。 |\n| `i`\
  \ | 查看当前缓冲区文档的信息（信息在名为 `Document Information` 的新缓冲区中打开）。 |\n| `I` | 查看当前缓冲区光标处链接的信息（信息在名为\
  \ `Document Information` 的新缓冲区中打开）。 |\n| `k` | 将当前缓冲区文档的 URL 放入剪切环（kill ring），并将其变为\
  \ `X` 选择（用于将 URL 复制并粘贴到另一个缓冲区或另一个应用程序；参见 Recipe 10.3 [操作文本选择]，第 253 页）。 |\n| `K`\
  \ | 将光标处链接的 URL 放入剪切环并将其变为 `X` 选择（用于将 URL 复制并粘贴到另一个缓冲区或另一个应用程序；参见 Recipe 10.3 [操作文本选择]，第\
  \ 253 页）。 |\n| `l` | 移动上次访问的缓冲区。 |\n| `o` | 打开本地文件。 |\n| `q` | 退出 w3-mode，杀死当前缓冲区并回到上次访问的缓冲区。\
  \ |\n| `r` | 重新加载当前文档。 |\n| `s` | 查看当前缓冲区文档的 HTML 源码（在以 URL 命名的新缓冲区中打开）。 |\n| `S`\
  \ | 查看当前缓冲区光标处链接的 HTML 源码（在以 URL 命名的新缓冲区中打开）。 |\n| `v` | 显示当前文档的 URL（URL 显示在微缓冲区中）。\
  \ |\n| `V` | 显示当前缓冲区光标处链接的 URL（URL 显示在微缓冲区中）。 |\n\n### 33.4 查看 Web 图像\n\n通常你通过在正在使用的浏览器中打开图像来查看\
  \ Web 图像，但你也可以无需浏览——方法如下。\n\n#### 方法 #1 Lynx\n\nDEB: `lynx`\n\nRPM: `lynx`\nWWW:\
  \ `http://lynx.browser.org/`\n\n你可以通过将图像 URL 作为 `lynx` 的参数来查看 Web 上的图像（参见 Recipe\
  \ 33.2 [使用 Lynx]，第 643 页）。图像将由设置好的通过 `lynx` 显示图像的“助手”应用程序显示。\n\n⇒ 查看 URL `ftp://garbo.uwasa.fi/garbo-gifs/garbo01.gif`\
  \ 图像，输入：\n\n```\n$lynx ftp://garbo.uwasa.fi/garbo-gifs/garbo01.gif\n```\nRET\n\n\
  **注意：** 此方法仅在 X 环境下有效。\n\n你也可以以此方式将图像 URL 作为参数传递给其他浏览器，例如 Mozilla（参见 Recipe 33.1\
  \ [使用 Mozilla]，第 638 页）。\n\n#### 方法 #2 ImageMagick\n\nDEB: `imagemagick`\n\nRPM:\
  \ `ImageMagick`\nWWW: `http://www.imagemagick.org/`\n\nLibwww-perl\n\nDEB: `libwww-perl`\n\
  \nRPM: `perl-libwww`\nWWW: `http://ftp.ics.uci.edu/pub/websoft/libwww-perl/`\n\n\
  如果你只想查看来自 Web 的图像文件，完全不需要使用 Web 浏览器——相反，你可以使用 `display`，并将想要查看的 URL 作为参数。它使用 `libwww-perl`\
  \ 软件包中的 `GET`（有时为 `get`）来获取该 URL。\n\n这种方法对于查看你喜爱的网络摄像头图像、查看 ftp 站点上的图像或将其放入脚本中特别有用——你不需要启动浏览器、登录或输入任何其他命令。\n\
  \n⇒ 查看 URL `http://waquarium.otted.hawaii.edu/coralcam/ccam.jpg` 图像，输入：\n\n```\n\
  $display http://waquarium.otted.hawaii.edu/coralcam/ccam.jpg\n```\nRET\n\n`-remote`\
  \ 选项会在已经在运行的显示窗口中打开图像；你可以使用这种方法查看经常更改的图像——例如网络摄像头图像——并自动用最新图像刷新显示。要实现这一点，首先在后台运行\
  \ `display`，然后运行 `watch`（参见 Recipe 28.4 [定期监控命令]，第 559 页）。将重新加载之间的秒数作为 `-n` 选项的参数，并将带有\
  \ `-remote` 选项的 `display` 和图像 URL 作为引号参数作为监控的命令。\n\n⇒ 查看 URL `http://waquarium.otted.hawaii.edu/coralcam/ccam.jpg`\
  \ 图像，每 30 秒用网络摄像头的最新图像更新一次，输入：\n\n```\n$watch -n 30 'display -remote http://waquarium.otted.hawaii.edu/coralcam/ccam.jpg'\n\
  ```\nRET\n\n在此示例中，第一个 `display` 命令在后台运行，作为该 shell 的第三作业，进程号为 29621。要停止查看，在包含 `watch`\
  \ 命令的终端输入 `CTRL - C`，然后杀死第一个 `display`作业（参见 Recipe 3.3.5 [停止作业]，第 73 页）。\n\n**注意：**\
  \ 查看图像时，可以使用 `display` 支持的所有图像处理命令，包括调整大小和更改放大率。有关 `display` 的更多信息，请参见 Recipe 17.1\
  \ [在 X 中查看图像]，第 407 页。\n\n### 33.5 从 Web 获取文件\n\nWget\n\nDEB: `wget`\n\nRPM: `wget`\n\
  WWW: `http://www.gnu.org/software/wget/wget.html`\n\n使用 `wget`，“Web get”从万维网下载文件。它可以从\
  \ http 或 ftp url 获取文件。它保留文件的原始时间戳，它\n\n\n\n\n比浏览器更小、使用更快，并显示下载进度的视觉化界面。\n\n若要从 Web\
  \ 获取 html 文件并将其保存为渲染后的文本，请使用 `Lynx` ——参见配方 33.2.4 [从 Web 发送文本到标准输出]，第 646 页。\n\n\
  以下子节包含了使用 `wget` 从 Web 获取信息的配方。如需更多关于 `wget` 可以执行的操作示例，请参考其 Info 文档（参见配方 2.8.5 [读取\
  \ Info 手册]，第 48 页）。\n\n### 33.5.1 下载 url\n\n要从 Web 下载单个文件，将文件的 url 作为参数传递给 `wget`。\n\
  \n⇒ 要下载 `ftp://garbo.uwasa.fi/garbo-gifs/garbo20.gif`，输入：\n\n```\nwget ftp://garbo.uwasa.fi/garbo-gifs/garbo20.gif\n\
  ```\n\n此命令下载给定的 url，并写入当前工作目录中与原 url 相同的文件，即 `garbo20.gif`。\n\n如果你在下载完成前中断了下载，你所获取的文件内容将仅包含\
  \ `wget` 在中断前已获取的部分。使用带有 `-c` 选项的 `wget` 可以从断点继续下载。\n\n⇒ 要恢复上一个示例中的 url 下载，输入：\n\
  \n```\nwget -c ftp://garbo.uwasa.fi/garbo-gifs/garbo20.gif\n```\n\n**注意：** 为了让 `-c`\
  \ 选项产生预期效果，你应该在之前运行 `wget` 的相同目录下运行它，该部分下载的文件应该仍然存在。\n\n### 33.5.2 归档整个网站\n\n要归档单个网站，请使用带有\
  \ `-m`（“镜像”）选项的 `wget`，它会尽可能按照原始时间戳保存文件，并设置“递归检索”选项以下载所有内容。要指定检索过程中发生错误时的重试次数，请使用带有数字参数的\
  \ `-t` 选项——`-t3` 通常适用于跨网络安全检索；使用 `-t0` 指定无限次重试，适用于网络连接*非常*糟糕但你*非常*想要归档某些东西的情况，无论花费多长时间。最后，使用文件名作为参数的\
  \ `-o` 选项将进度日志写入文件——如果在归档过程中出现问题，检查它会很有用；一旦归档过程完成且你确认成功，就可以删除日志文件。\n\n⇒ 要镜像 `http://www.example.org/`\
  \ 网站，允许最多三次文件检索重试，并将错误信息写入名为 `mirror.log` 的日志文件，输入：\n\n```\nwget -m -t3 http://www.example.org/\
  \ -o mirror.log\n```\n\n此命令会在当前目录的名为 `www.example.org` 的子目录下，为 `http://www.example.org/`\
  \ 网站创建一个归档。日志信息被写入当前目录中名为 `mirror.log` 的文件中。\n\n若要继续已中断的归档，请使用 `-nc`（“不覆盖”）选项；它不会检索已经下载的文件。为了让此选项按你预期的方式工作，请确保你处于最初开始归档该网站时所在的目录中。\n\
  \n⇒ 要继续被中断的 `http://www.example.org/` 网站镜像，并确保现有文件不被下载，允许最多三次文件检索重试，并将错误信息写入名为 `mirror.log`\
  \ 的日志文件，输入：\n\n```\nwget -nc -m -t3 http://www.example.org/ -o mirror.log\n```\n\
  \n### 33.5.3 归档网站的部分\n\n若仅归档网站的一部分——例如，用户的主页——请使用 `-I` 选项，后跟要归档目录的绝对路径列表；网站上的所有其他目录将被忽略。\n\
  \n⇒ 要归档 `http://example.edu/~jim/` 网站，仅归档 `/~jim` 目录，并将日志信息写入名为 `jim.log` 的文件，输入：\n\
  \n```\nwget -m -t3 -I /*~jim http://example.edu/~jim/ -o jim.log\n```\n\n此命令归档 `http://example.edu/~jim/`\
  \ 网站上所有目录名以 `/~jim` 开头的文件。\n\n若仅获取给定目录的文件，请使用 `-r` 和 `-l` 选项（`-l` 选项的参数是从给定层级向下递归的层数）。仅下载给定目录中的文件，请将这些选项与\
  \ `--no-parent` 选项结合使用，该选项指定不进入父目录。\n\n使用 `-A` 选项来指定要接受的文件扩展名——例如，使用 `-A txt,text,tex`\
  \ 仅下载以 `.txt`、`.text` 和 `.tex` 扩展结尾的文件。`-R` 选项的作用类似，但它指定要*拒绝*且不下载的文件扩展。\n\n⇒ 要下载\
  \ `example.org` 上给定目录 `/~jim/papers/` 中仅以 `.gz` 扩展结尾的文件，输入（全部写在一行）：\n\n```\nwget\
  \ -m -r -l1 --no-parent -A.gz http://www.example.org/~jim/papers/\n```\n\n### 33.5.4\
  \ 读取网页的头部信息\n\n所有 Web 服务器在页面请求开始时都会输出特殊的*头部*（headers），但当你使用 浏览器检索 url 时通常看不到它们。\n\
  \n这些头部信息包含如 Web 服务器主机的当前系统日期，以及 Web 服务器和操作系统软件的名称和版本。\n\n使用 `wget` 的 `-S` 选项在检索文件时输出这些头部信息；头部信息将输出到标准输出，或者如果使用了则输出到日志文件。\n\
  \n⇒ 要检索 `http://google.com/` 文件并输出头部信息，输入：\n\n```\nwget -S http://google.com/\n\
  ```\n\n此命令将服务器响应头部写入标准输出，并将 `http://google.com/` 的内容保存到当前目录的一个文件中，文件名与原文件相同。\n\n\
  ### 33.6 保留浏览器历史记录\n\n`browser-history`\n\nDEB: `browser-history`\n\nRPM: `browser-history`\n\
  \nWWW: `http://www.inria.fr/koala/colas/browser-history/`\n\n许多 Web 浏览器都有“历史记录”功能，记录你访问的网站列表以及访问的时间和日期，但没有哪个工具比\
  \ `browser-history` 好用。如果你目前为了记住发现的优质链接而维护一个*网络日志*（或“博客”），那么一旦安装了这个工具，你就不再需要那样做了。\n\
  \n使用 `browser-history` 维护你访问的所有 Web 网站的历史日志。\n\n你可以在后台启动它，每当你在 Web 浏览器中访问 url 时（截至本文编写，它支持\
  \ Netscape、Arena 和 Amaya 浏览器，但不支持 Mozilla），它会将名称和 url 写入其当前的历史日志中，你可以随时查看。\n\n⇒\
  \ 要在每次启动 X 时启动 `browser-history`，请将以下行放入你的 `.xsession` 文件中：\n\n```\nbrowser-history\
  \ &\n```\n\n以下配方展示了使用你的历史日志的方法。\n\n### 33.6.1 查看你的浏览器历史记录\n\n浏览器历史日志保留在你家目录下一个名为\
  \ `.browser-history` 的隐藏目录中。本周的历史日志始终称为 `history-log.html`；这是一个可以在 Web 浏览器中查看的 html\
  \ 文件。\n\n⇒ 要使用 `lynx` 查看当前历史日志，输入：\n\n```\nlynx ~/.browser-history/history-log.html\n\
  ```\n\n过去的日志在文件名后附加了年份、月份和周，并且经过了压缩（参见配方 8.4 [使用文件压缩]，第 196 页）。如果你在浏览器中查看它们，可以直接将文件名作为参数而无需解压——大多数浏览器会自动处理这种情况。\n\
  \n**注意：** 如果你有一个起始页，你会发现在其上添加一个指向当前历史日志文件 `~/.browser-history/history-log.html`\
  \ 的链接非常有用（参见下一页的配方 33.7 [设置起始页]）。\n\n### 33.6.2 搜索你的浏览器历史记录\n\n你也可以使用 `zgrep` 搜索旧的浏览器历史日志。日志记录了你访问的每个网站的\
  \ url 和标题，你可以搜索其中任何一个——当有人问“你还记得那篇关于某某的好文章吗？”时。\n\n\n\n\n你可以对 `~/.browser-history`\
  \ 目录下的文件执行 `zgrep` 来查找它。\n\n⇒ 要要在你 2000 年访问过的列表找到找到标题包含“Confessions”一词的任何 URL，请输入：\n\
  \n```\n$ zgrep Confessions ~/.browser-history/history-log-2000\n```\n\nRET\n\n此命令会在你\
  \ 2000 年的所有日志中搜索文本“Confessions”，并输出包含该内容的行。\n\n658\n\n《Linux 命令行指南》，第 2 版\n\n**注意：**\
  \ 有关关于 `zgrep` 的更多，请参阅菜谱 14.7.2 [在压缩文件中匹配行]，第 349 页。\n\n## 33.7 设置起始页\n\n*起始页*（start\
  \ page）是浏览器在不带 URL 作为参数启动时自动加载的 Web 页面。它也是点击浏览器的主页按钮（如果有该按钮的话）时加载的页面。\n\n你可以定义浏览器的起始页。有些人将其设置为喜爱的新闻源或出版物的\
  \ URL，而另一些甚至会编写自己的起始页，其中包含经常访问的链接列表、搜索引擎表单等等。\n\n要创建你自己的起始页，只需将其编写为 html 文件；你可以将其保存在主目录的某处并提供完整路径名；或者，如果你在本地系统上运行\
  \ Web 服务器，可以将其放在服务器 html 目录树的某处，并使用 http URL 访问。\n\n以下是在 Mozilla 和 Lynx 中定义起始页的方法。\n\
  \n### 方法 #1\n\n#### Mozilla\n\nDEB: mozilla-browser\n\nRPM: mozilla\n\nWWW: http://www.mozilla.org/\n\
  \n要在 Mozilla 中定义起始页，请在“Mozilla 首选项...”（Preferences...）菜单中定义“主页”。\n\n⇒ 要将 Mozilla\
  \ 中的默认起始页更改为你自己的起始页 `http://localhost/start/`，请执行以下操作：\n\n1. 从菜单栏上的“编辑”（Edit）菜单选择“首选项...”。\n\
  2. 在“位置”（Location）框中左点击。\n3. 将内容替换为你想要的起始页：\n`http://localhost/start/`\n4. 左点击确定按钮。\n\
  \n**注意：** 在 Mozilla 中，每当你不带参数启动它、点击主页按钮或输入 `ALT -HOME` 时，起始页都会加载。\n\n第 33 章：万网\n\
  \n659\n\n### 方法 #2\n\n#### Lynx\n\nDEB: lynx\n\nRPM: lynx\n\nWWW: http://lynx.browser.org/\n\
  \nLynx 的起始页定义为 `/etc/lynx.cfg` 中的 `STARTFILE`，它可以是任何 URL，包括指向系统上本地文件的 `file://`\
  \ URL。\n\n你需要超级用户权限来编辑此文件。\n\n• 要将 Lynx 的起始页更改为 URL `http://localhost/start/`，请使用文本编辑器编辑\
  \ `/etc/lynx.cfg`使其包含以下行：\n\n```\nSTARTFILE:http://localhost/start/\n```\n\n**注意：**\
  \ Linux 发行版通常预先定义 Lynx 起始页为该发行版的主页。例如，在 Debian 系统上，起始文件定义为 Debian 主页 [http://www.debian.org/]。\n\
  \n## 33.8 在文本中列出 URL\n\n使用以下两种方法之一列出文本中的 URL——Web 页面的 html 源码、Web 页面的文本或任何文本文件。\n\
  \n要列出某些 Web 页面源码中的 URL，首先使用带有 `-q` 和 `-O` 选项的 `wget` 将源码导出到标准输出（见菜谱 33.5 [从网络获取文件]，第\
  \ 653 页），然后将其传递到方法之一。\n\n要列出 Web 页面*文本*而非源码中的 URL，首先使用带有 `-dump` 选项的 `lynx` 将页面内容导出到标准输出，然后将其传递到方法之一。\n\
  \n为了确保不列出重复的 URL，请将输出传递给 `sort` 以仅输出唯一行（见菜谱 13.5 [过滤文本重复行] 中的方法 #2，第 319 页）。\n\n\
  一种方法使用 `grep`，另一种使用 `sed`，两者都使用相同的查找 URL 的正则表达式。该正则相当长，包含了两个字面空格和两个字面制表符；如果你经常使用这些方法之一，你肯定会希望将运行它的命令放在脚本中（见菜谱\
  \ 3.7 [使用 Shell 脚本]，第 84 页）。\n\n660\n\n《Linux 命令行指南》，第 2 版\n\n### 方法 #1\n\n要在文本中输出\
  \ URL 列表（每行一个），使用带有 `-o` 选项的 `grep`，并提供匹配 URL 的正则表达式作为参数。要搜索文本文件，提供文件名作为第二个参数。\n\
  \n⇒ 这里是使用此方法的一些方法。\n\n• 要输出 `/etc/lynx.cfg` 文件中包含的所有 URL 列表，输入（全部在一行）：\n\n```\n\
  $ grep -o '\\(\\(\\(http\\(s\\)\\?| *ftp\\*| *gopher\\*| *telnet\\*| *news\\):\\\
  /\\/\\| *mailto:\\).[*^ SPACEBAR *,;* CTRL -V TAB <\"> *]*[*^ SPACEBAR *.,;* CTRL\
  \ -V TAB <\"> *]\\)' /etc/lynx.cfg RET\n```\n\n• 要输出 URL `http://news.example.com/`\
  \ 文本中包含的所有 URL 列表，输入（全部在一行）：\n\n```\n$ lynx -dump http://news.example.com/ | grep\
  \ -o '\\(\\(\\(http\\(s\\)\\?| *ftp\\*| *gopher\\*| *telnet\\*| *news\\):\\/\\/\\\
  | *mailto:\\).[*^ SPACEBAR *,;* CTRL -V TAB <\"> *]*[*^ SPACEBAR *.,;* CTRL -V TAB\
  \ <\"> *]\\)' RET\n```\n\n• 要输出 `http://news.example.com/` html 源码中包含的所有 URL 列表，输入（全部在一行）：\n\
  \n```\n$ wget -q -O http://news.example.com/ | grep -o '\\(\\(\\(http\\(s\\)\\?|\
  \ *ftp\\*| *gopher\\*| *telnet\\*| *news\\):\\/\\/\\| *mailto:\\).[*^ SPACEBAR *,;*\
  \ CTRL -V TAB <\"> *]*[*^ SPACEBAR *.,;* CTRL -V TAB <\"> *]\\)' RET\n```\n\n###\
  \ 方法 #2\n\n要在文本中输出 URL 列表（每行一个），使用相同正则表达式的 `sed`。要搜索文本文件，提供文件名作为第二个参数。\n\n• 要输出\
  \ `/etc/lynx.cfg` 文件中包含的所有 URL 列表，输入（全部在一行）：\n\n```\n$ sed -n 's/\\(\\(\\(http\\\
  (s\\)\\?| *ftp\\*| *gopher\\*| *telnet\\*| *news\\):\\/\\/\\| *mailto:\\).[*^ SPACEBAR\
  \ *,;* CTRL -V TAB <\"> *]*[*^ SPACEBAR *.,;* CTRL -V TAB <\"> *]\\)//p' /etc/lynx.cfg\
  \ RET\n```\n\n• 要输出 URL `http://news.example.com/` 文本中包含的所有 URL 列表，输入（全部在一行）：\n\n\
  ```\n$ lynx -dump http://news.example.com/ | sed -n 's/\\(\\(\\(http\\(s\\)\\?|\
  \ *ftp\\*| *gopher\\*| *telnet\\*| *news\\):\\/\\/\\| *mailto:\\).[*^ SPACEBAR *,;*\
  \ CTRL -V TAB <\"> *]*[*^ SPACEBAR *.,;* CTRL -V TAB <\"> *]\\)//p' RET\n```\n\n\
  • 要输出 `http://news.example.com/` html 源码中包含的所有 URL 列表，输入（全部在一行）：\n\n```\n$ wget\
  \ -q -O http://news.example.com/ | sed -n 's/\\(\\(\\(http\\(s\\)\\?| *ftp\\*| *gopher\\\
  *| *telnet\\*| *news\\):\\/\\/\\| *mailto:\\).[*^ SPACEBAR *,;* CTRL -V TAB <\"\
  > *]*[*^ SPACEBAR *.,;* CTRL -V TAB <\"> *]\\]//p' RET\n```\n\n第 33 章 万网\n\n## 33.9\
  \ 编写 html\n\n超文本标记语言（html）是 Web 的标记语言；html 文件只是用这种标记语言编写的文本文件。你可以使用任何文本编辑器编辑 html\
  \ 文件，与其他类型的文本文件没有区别（见第 10 章 [编辑文本]，第 231 页）。\n\n以下是此任务的一些特殊方法。\n\n### 方法 #1\n\n\
  #### Mozilla\n\nDEB: mozilla-browser\n\nRPM: mozilla\n\nWWW: http://www.mozilla.org/\n\
  \n使用 Mozilla Composer 编写 html。它是最流行的所见即所得 html 编辑器之一。你可以在 Mozilla 运行时通过“窗口”菜单选择它，或输入\
  \ CTRL -4 启动它。\n\n⇒ 要启动 Mozilla Composer，请执行以下操作：1. 启动 Mozilla（见菜谱 33.1.1 [熟悉 Mozilla]，第\
  \ 638 页）：\n\n```\n$ mozilla\n```\n\n2. 按 CTRL -4 .\n\n### 方法 #2\n\n#### Bluefish\n\
  \nDEB: bluefish\n\nRPM: bluefish\n\nWWW: http://bluefish.openoffice.nl/\n\n许多人推崇\
  \ Bluefish，这是一款功能齐全、易于使用的 X html 编辑器。它具有语法高亮功能，并且可以同时打开 500 个文档。\n\n\n\n\n⇒ 要启动\
  \ Bluefish，输入：\n\n```bash\n$ bluefish\n```\n\n## 方法 #3：GNU Emacs\n\nDEB: `emacsen-common`\n\
  \n`emacs21`\n\nRPM: `emacs`\n\nWWW: `http://www.emacs.org/`\n\nEmacs（参见配方 10.1 [Using\
  \ Emacs]，第 232 页）有一个用于编辑 html 文件的主要模式，称为 `html-mode`。\n\n⇒ 要在缓冲区中启动 `html-mode`，输入：\n\
  \n```bash\nALT -* X html-mode RET\n```\n\n`html-mode` 的功能包括插入“骨架”（skeleton）结构。\n\
  \nEmacs 为 `html-mode` 函数提供的帮助文本中包含一个非常短的 html 编写教程——查看该函数的文档即可显示该教程。\n\n⇒ 要在 Emacs\
  \ 中阅读简短的 html 教程，输入：\n\n```bash\nCTRL -* H f html-mode RET\n```\n\n**注意：** 当你在 Emacs\
  \ 缓冲区中编辑 html 文件时，可以在另一个窗口中用 Web 浏览器打开同一个文件——Web 浏览器只读不写它们打开的 html 文件，因此你可以在 Emacs\
  \ 中创建文档的同时在浏览器中查看渲染后的文档。当 Emacs 缓冲区中进行并保存更改时，重新加载浏览器中的文件即可立即看到更改。\n\n### 33.9.1\
  \ 为图像标签添加参数\n\nImgsizer\n\nDEB: `imgsizer`\n\nWWW: `http://www.catb.org/~esr/imgsizer/`\n\
  \n为了易用性，html 图像源标签应该具有 `HEIGHT` 和 `WIDTH` 参数，这些参数指定了标签描述的图像尺寸。通过在页面上所有的图像标签中指定这些参数，该页面上的文字将在图像加载之前显示。如果没有这些参数，浏览器在显示页面任何文本之前必须加载所有图像。\n\
  \n使用 `imgsizer` 自动确定这些值并将其插入 html 文件。将 html 文件名作为参数。\n\n⇒ 为文件 `index.html` 添加 `HEIGHT`\
  \ 和 `WIDTH` 参数，输入：\n\n```bash\n$ imgsizer index.html\nRET\n```\n\n### 33.9.2 转换\
  \ html\n\n有方法可以将 html 文件转换为其他格式。你可以将 html 转换为纯文本以便阅读，或者转换为 PostScript，你可以查看、打印或也转换为其他格式，包括\
  \ pdf。\n\n#### 方法 #1：Unhtml\n\nDEB: `unhtml`\n\nWWW: `http://maruhn.com/sec/unhtml.html`\n\
  \n使用 `unhtml` 从文本中移除 html 格式。它从标准输入（或指定的文件名）读取，并将输出写入标准输出。\n\n⇒ 有两种两种使用它的方法：\n\n\
  * 查看移除了 html 标签的 `index.html` 文件，输入：\n\n```bash\n$ unhtml index.html | less\nRET\n\
  ```\n\n* 从文件 `index.html` 移除 html 标签并将输出写入名为 `index.txt` 的文件，输入：\n\n```bash\n$ unhtml\
  \ index.html > index.txt\nRET\n```\n\n**注意：** 使用 `unhtml` 从文件中移除 html 标签时，不会对文本进行进一步处理。此外，它适用于文件，不适用于\
  \ url 本。\n\n#### 方法 #2：Lynx\n\nDEB: `lynx`\n\nRPM: `lynx`\n\nWWW: `http://browser.org/`\n\
  \n使用 `lynx` 将 html 文件或 url 保存为*格式化*文本文件，以便结果在 `lynx` 中查看时像原始 html 一样。它还可以保留原始 html\
  \ 中的斜体和超链接信息。\n\n参见配方 33.2.4 [Sending Text from the Web to Standard Output]，第 646\
  \ 页。\n\n你可以将此 `lynx` 输出管道到工具进行间距设置，然后发送到 `enscript` 设置字体。这对于以 typescript 手稿稿格式打印网页非常有用。\n\
  \n⇒ 以 typescript 手稿格式打印 url `http://example.com/essay/` 的副本（全一行），输入：\n\n```bash\n\
  $ lynx -dump -nolist http://example.com/essay/ | pr -d\nB\nRET\n```\n\n**注意：** 在某些情况下，你可能想在打印之前编辑文件，例如网页包含导航栏或其他你在转换为手稿之前想要移除的文本。在这种情况下，你会将\
  \ `lynx` 输出管道到文件，编辑该文件，然后对文件使用 `pr` 并将其输出管道到 `enscript` 进行打印。\n\n#### 方法 #3：Html2ps\n\
  \nDEB: `html2ps`\n\nRPM: `html2ps`\n\nWWW: `http://www.tdb.uu.se/~jan/html2ps.html`\n\
  \n使用 `html2ps` 将 html 文件转换为 PostScript；当你想要打印带有所有图形和图像的网页，或者想要将整个网站或部分网站转换为 pdf\
  \ 时，这非常有用。将要转换的 html 文件的 url 或文件名作为选项。使用 `-u` 选项为超链接锚点文本加下划线；默认不给链接下划线并写入标准输出。\n\
  \n⇒ 有两种使用它的方法：\n\n* 将 url `http://example.com/essay/` 的 PostScript 副本打印到默认打印机，输入：\n\
  \n```bash\n$ html2ps http://example.com/essay/ | lpr\nRET\n```\n\n* 将 url `http://example.com/essay/`\
  \ 的副本写入 PostScript 文件 `submission.ps`，且所有超链接带下划线，输入：\n\n```bash\n$ html2ps -u -o\
  \ submission.ps http://example.com/essay/\nRET\n```\n\n### 33.9.3 验证 html\n\nWeblint\n\
  \nDEB: `weblint`\n\nRPM: `weblint`\n\nWWW: `http://www.webmaster.bham.ac.uk/weblint/`\n\
  \n使用 `weblint` 验证 html 文件的基本结构和语法。将要检查的文件名作为参数，`weblint` 输出它对该文件的任何意见，例如 `IMG` 元素是否缺少\
  \ `ALT` 描述，或嵌套元素是否重叠。\n\n⇒ 要验证文件 `index.html` 中的 html，输入：\n\n```bash\n$ weblint\
  \ index.html\nRET\n```\n\n## 33.10 分析你的 Web 流量\n\n如果你有一个网站，无疑会对分析你的 Web 流量产生兴趣：知道哪些页面受欢迎，谁在看它们，他们什么时候看以及从哪里。通过从托管你网站的服务器检索\
  \ *Web 日志*（Web logs）来实现——这些是服务器编写的纯文本文件，包含你网站每次访问的数据，每行一个。存在工具来分析这些日志；这里是两种此两种简单方法。\n\
  \n#### 方法 #1：Analog\n\nDEB: `analog`\n\nRPM: `analog`\n\nWWW: `http://www.analog.cx/`\n\
  \n分析日志最流行的工具是 `analog`，它产生一组全面的报告，包括：\n\n* 人通过搜索引擎找到你网站的顶级关键词。\n* *引用页*（referrers），即请求计算机访问你页面的页面。\n\
  * 请求页面的顶级组织。\n* 请求页面的操作系统。\n* 网站上流行的目录。\n* 网站上流行的文件。\n\n将要分析的日志文件规范作为参数传递给 `analog`。\n\
  \n该命令读取你提供的日志并将报告输出到标准输出。输出为 html 格式；要么将其管道到浏览器的标准输入进行查看，要么重定向到文件保存。日志文件必须是 `analog`\
  \ 可以识别的日志格式，例如流行的 Apache Web 服务器使用的格式；它们也可以经过压缩。\n\n⇒ 有一些使用它的方法：\n\n* 要查看 `~/web/logs/2005/www.20050408.gz`（一个\
  \ Web 日志文件），输入：\n\n```bash\n$ analog ~/web/logs/2005/www.20050408.gz | lynx -stdin\n\
  RET\n```\n\n* 将 `~/web/logs/2005/` 目录下所有 Web 日志文件的分析写入当前目录下名为 `analog.html` 的 html\
  \ 文件，输入：\n\n```bash\n$ analog ~/web/logs/2005/** > analog.html\n```\n\n\n\n\n\n\n\
  你也可以用 `grep` 搜索你的日志文件。如果日志文件遵循标准格式，你可以使用 `cut` 过滤掉你不感兴趣的字段，从而输出所需的字段。这在某些任务中非常有用，例如查找访问你某个目录或页面的唯一域名数量，你可以通过\
  \ `grep` 将结果传递给 `cut`。\n\n⇒⇒ 要根据 `~/private_html/logs/2006` 目录下的日志，列出访问你评论页的唯一域名数量，请输入（全部写在一行）：\n\
  \n```bash\n$ grep reviews ~/private_html/logs/2006 | cut -f2 -d':' | cut -f1 -d'\
  \ ' | sort -u | wc -l\n```\n\nRET\n\n**备注：** 如果任何日志文件是压缩的，请使用 `zgrep` 或带有 `-z` 选项的\
  \ `grep`。\n\n## 33.11 使用其他 浏览器\n\n惊讶的是，Linux 下的浏览器远没有文本编辑器——甚至没有文本查看器多。这对于任何操作系统都是如此，我经常在思考这是为什么；也许“浏览网页”本身是一项相当的活动，很快就会被\
  \ Web 阅读器和其他工具取代。无论如何，下表列出了目前适用于 Linux 系统的其他浏览器。\n\n### Amaya\n由万维网联盟（World Wide\
  \ Web Consortium）开发；既是一个图形化 Web 浏览器，也是一个编写 HTML 的所见所得编辑器。\n- DEB: `amaya`\n- RPM:\
  \ `amaya`\n- WWW: `http://www.w3.org/Amaya/`\n\n### Arena\n由万维网联盟开发；一个非常紧凑、符合 html\
  \ 3.0 标准的 X 浏览器。\n- RPM: `arena`\n- WWW: `http://www.w3.org/Arena/`\n\n### Dillo\n\
  非常快速且小型的图形化浏览器。\n- DEB: `dillo`\n- RPM: `dillo`\n- WWW: `http://www.dillo.org/`\n\
  \n### Express\n在安装了 gnome 的 X 下运行的小浏览器。\n- WWW: `http://tinyurl.com/32p4d`\n\n###\
  \ Galeon\n基于 Mozilla 的 gnome 浏览器。\n- DEB: `galeon-common`, `galeon`\n- RPM: `galeon`\n\
  - WWW: `http://galeon.sourceforge.net/`\n\n### Gzilla\nX 的图形化浏览器，目前处于开发早期。\n- RPM:\
  \ `gzilla`\n- WWW: `http://www.levien.com/gzilla/`\n\n### Links\n较新的纯文本浏览器，有些人认为它比\
  \ Lynx 好用。\n- DEB: `links`\n- RPM: `links`\n- WWW: `http://artax.netula.com/links/`\n\
  \n### Skipstone\n基于 Mozilla 的图形化浏览器，功能丰富。\n- RPM: `skipstone`\n- WWW: `http://www.skipstone.net/`\n\
  \n### W3m\n较新的纯文本浏览器，其功能包括：\n- DEB: `w3m`\n- RPM: `w3m`\n- WWW: `http://www.w3m.sourceforge.net/`\n\
  \n668\nLinux Cookbook，第 2 版\n\n## 34. 其他服务\n\n除了 Web 之外，还有许多 Internet 服务。本章将如何使用其中一些服务。\n\
  \n### 34.1 连接到远程主机\n\n要连接到远程主机，请使用其名称或数字 IP 地址作为参数。如果主机可达，系统将提示你使用用户名和密码登录（如果你在那个系统上有账号的话）。\n\
  \n如果主机不可用，你将收到错误信息。这对于检查主机是否宕机很有用。\n\n#### 34.1.1 挂起与远程主机的连接\n\n要挂起与远程主机的连接，在 telnet\
  \ 命令提示符处输入 `z` 命令。\n\n⇒⇒ 要临时返回 shell，输入：\n\n```bash\ntelnet> z\n```\n\nRET\n[Stopped]\n\
  telnet\n\n（参见第 73 页“将作业置前台”）。\n\n#### 34.1.2 终止与远程主机的连接\n\n要终止与远程主机的连接并退出 telnet，在\
  \ telnet 命令提示符处输入 `q` 命令。\n\n⇒⇒ 要终止与远程系统的连接，输入：\n\n```bash\ntelnet> q\n```\n\nRET\n\
  Connection closed.\n$\n\n### 34.2 在远程主机之间传输文件\n\n文件传输协议 (`ftp`) 是一种在系统间交换文件的方法。使用\
  \ `ftp` 工具通过此协议连接到另一个系统，并将你想要连接的系统名称或数字 IP 地址作为参数。一旦连接，系统将提示你使用用户名和密码登录（如果你在那个系统上有账号的话）。\n\
  \n⇒⇒ 要建立 `ftp.example.org` 的匿名 ftp 连接，输入：\n\n```bash\n$ ftp ftp.example.org\n```\n\
  \nRET\nConnected to ftp.example.org.\n220-Welcome to EXAMPLE.ORG.\n220-See file\
  \ README for more information about this archive archive.\n220-\n220 FTP server\
  \ example.org ready.\nName (ftp.example.org:tom): *anonymous*\nRET\n\n\n\n\n\n331\
  \ 访客登录成功，将您的电子邮件地址作为密码。\n\n密码：`*tom*@ *example.edu*` RET\n\n230-远程系统类型为 UNIX。\n\n\
  正在使用二进制模式传输文件。\n\nftp>\n\n一旦连接并登录，可以使用 `cd` 和 `ls` 命令来切换目录并列出远程系统上的文件。\n\n公共系统的标准做法是在其\
  \ ftp 主机上有一个 `/pub` 目录，其中包含了所有对普通公众开放的文件和资源。\n\n⇒ 要切换到远程系统上的 `/pub` 目录并查看其中的文件，输入：\n\
  \nftp> `cd /pub`\n\nRET\n\n250 目录已更改 `/pub`。\n\nftp> `ls`\n\nRET\n\nftp> `ls`\n\n\
  200 `PORT` 命令成功。\n\n150 正在打开文件的 ASCII 连接（918 字节）\n\ntotal 52048\n\n-rw-rw-r--\n\n\
  1 ftpadmin ftpadmin 1095772 Sep 28 06:32 INDEX.gz\n\n-rw-rw-r--\n\n1 ftpadmin ftpadmin\
  \ 9521446 Sep 28 06:42 ls-lR.gz\n\ndrwxr-xr-x\n\n2 ftpadmin ftpadmin\n\n512 Sep\
  \ 17 18:23 rec\n\ndrwxr-xr-x\n\n3 ftpadmin ftpadmin\n\n512 Sep 17 18:23 sci\n\n\
  drwxr-xr-x\n\n5 ftpadmin ftpadmin\n\n512 Sep 17 18:23 text\n\n226 传输完成，速度为 918 字节/s。\n\
  \nftp>\n\n# 第 34 章：其他 Internet 服务\n\n675\n\n在本示例中，`/pub` 目录包含三个子目录（rec、sci 和 text）和两个文件（`INDEX.gz`\
  \ 和 `ls-lR.gz`）；许多公共系统在其 `/pub` 目录中都有类似这些的文件——`INDEX.gz` 是其 ftp 站点上所有文件的列表并带有描述，而\
  \ `ls-lR.gz` 是在他们的 ftp 服务器目录树上运行 `ls -lR` 命令的输出。\n\n接下来的子节描述了如何上传和下载文件。使用 `quit`\
  \ 命令退出 ftp 并关闭与远程系统的连接。\n\n## 34.2.1 向远程主机上传文件\n\n使用 `put` 命令上传文件；将文件名作为参数。\n\n\
  `put` 获取本地系统当前目录下的该文件，并将其副本放在远程系统的当前目录中。\n\n⇒ 要从本地系统的当前目录将文件 `latest.rcp` 上传到远程系统的当前目录，请输入：ftp>\
  \ `put latest.rcp`\n\nRET\n\n*本地*系统的当前目录默认是您运行 `ftp` 命令时所在的目录。要在您的本地系统上切换目录，请使用\
  \ `lcd`；它的用法与 `cd` 命令一样，但它更改的是*本地*目录。\n\n⇒ 要切换到本地系统当前目录的父级目录，请输入：\n\nftp> `lcd ..`\n\
  \nRET\n\n本地目录现在为 /home/james/demos\n\nftp>\n\n在本示例中，本地当前目录现在是 `/home/james/demos`。\n\
  \n还有其他下载文件的重要命令——使用 `i` 指定文件以*二进制*格式传输；通常，传输是为文本文件设置的。当你想传输程序、归档、压缩文件或任何非文本文件时，先将传输类型设为\
  \ `i`。\n\n近年来，大多数公共系统增加了一种安全措施，禁止匿名用户上传到 `/incoming` 或 `/pub/incoming` 目录以外的任何地方。\n\
  \n`mput` 命令的作用与 `put` 类似，但它允许您指定通配符。\n\n默认情况下，`mput` 会针对每个文件询问是否上传；要关闭此文件提示，在提供\
  \ `mput` 命令之前输入 `prompt`。\n\n676\n《Linux Cookbook》，第 2 版\n\n此命令是一个开关——再次输入 `prompt`\
  \ 即可为会话重新开启文件提示。\n\n## 34.2.2 从远程主机下载文件\n\n`get` 命令的作用与 `put` 类似，但方向相反——指定远程系统上的一个文件，`get`\
  \ 将其副本保存到本地系统的当前目录中。\n\n同样，在下载非文本文件时先使用 `i`。（您也可以用 `i` 下载文本文件，因此在传输文件之前*始终*设置它是一个良好的习惯；大多数\
  \ Linux 系统都配置为在连接后立即将类型设置为 `i`）。\n\n⇒ 要下载远程系统当前目录下的文件 `INDEX.gz` 并将其保存到您的 `~/tmp`\
  \ 目录，输入：\n\nftp> `lcd ~ */tmp*`\n\nRET\n\n本地目录现在为 /home/james/tmp\n\nftp `get INDEX.gz`\n\
  \nRET\n\nlocal: INDEX.gz remote: INDEX.gz\n\n传输了 10942767 字节\n\nftp>\n\n**注意：**\
  \ `mget` 命令的作用与 `get` 类似但允许通配符；与 `mput` 一样，除非您先使用 `prompt` 命令将其关闭，否则会被提示验证每个文件。\n\
  \n## 34.3 使用安全 Internet 服务\n\n### OpenSSH\n\nDEB: `ssh`\n\nRPM: `openssh`\n\nWWW:\
  \ http://www.openssh.com/\n\n这些涉及安全加密连接的新方法取代了之前食谱中用于连接远程系统以及在远程系统之间传输文件的旧旧方法。当需要或要求增强安全性时，使用它们来替代\
  \ `telnet` 和 `ftp`。\n\n您仍然可以使用旧方法，它们对于本地网络可能是没问题的，但在互联网上，安全变体已成为大多数地方的标准——网络不再是十年前那样的避风港，而且实际上，很少有站点允许\
  \ `telnet` 访问。\n\n677\n第 34 章：其他 Internet 服务\n\n接下来的食谱描述了如何使用著名的 `ssh`（“安全外”）协议的\
  \ `openssh` 实现。`openssh` 包含了旧 `rlogin`、`rsh` 和 `rcp` 安全连接工具的现代替代品。\n\n**注意：** 当您第一次使用这些工具之一连接远程系统时，可能会收到一条消息，告诉您已知主机列表中未找到“主机密钥”，并询问是否继续连接——回答“yes”。\n\
  \n### 34.3.1 向远程主机建立安全 Shell 连接\n\n使用 `ssh` 安全地连接到远程系统。它在您提供主机名作为参数的远程系统上打开登录连接。\n\
  \n⇒ 要向 arctic.example.org 建立安全连接，输入：$ `ssh arctic.example.org`\n\nRET\n\nernie@arctic.example.org's\
  \ password: *snowshoe*\n\nRET\n\n上次登录: Wed Aug 13 11:39:29 EDT 2003\n\n欢迎来到 arctic.example.org!\n\
  \n[ernie@arctic ~]\n\n在本示例中，用户名 ernie 通过 `ssh` 连接到系统 arctic.example.org，他的密码是“snowshoe”。“~\
  \ $”是该系统上的 shell 提示符，他可以在可以在那里运行命令，直到通过运行 `exit` 命令或在 shell 提示符处输入 `CTRL-* D` 退出。\n\
  \n如果您在远程系统上的用户名与本地系统的用户名不同，请使用 `-l` 指定不同的用户名。\n\n678\n《Linux Cookbook》，第 2 版\n\n\
  ⇒ 要以远程用户名 scout 向 arctic.example.org 建立安全连接，输入：\n\n$ `ssh -l scout arctic.example.org`\n\
  \nRET\n\nscout@arctic.example.org's password: *igloo*\n\nRET\n\n上次登录: Wed Aug 13\
  \ 13:14:53 EDT 2003\n\n欢迎来到 arctic.example.org!\n\n您有新邮件。\n\n[scout@arctic ~]\n\n\
  在本示例中，用户以系统用户名 scout 登录 arctic.example.org，该用户的密码是“igloo”。\n\n### 34.3.2 向远程主机进行安全文件复制\n\
  \n使用 `scp` 在您的本地系统和远程主机之间进行安全文件复制。它将源文件的名称和目标文件的文件名作为参数。对于本地系统上的文件，按常提供文件名即可；指定远程系统上的文件名时使用这种格式：`user@remote:filename`\n\
  \n对于 *user*，提供您在远程系统上的用户名（如果与本地相同，则省略它和后面的 @ 符号）。对于 *remote*，提供要连接的远程系统主机名，对于 *filename*，提供文件在\
  \ *user* 主目录中应名称。\n\n⇒ 要将本地 _html 目录下的 index.html 文件复制到您在 arctic.example.org 账户中的\
  \ public_html 目录，输入（一行）：\n\n$ `scp local_html/index.html arctic.example.com:public_html/index.html`\n\
  \nRET\n\nernie@arctic.example.org's password: *snowshoe*\n\nRET\n\nindex.html\n\n\
  100% |*****************************|\n\n2365\n\n00:00\n\n$\n\n在本示例中，用户在两个系统上的用户名都是\
  \ ernie；在 scp 退出之前，屏幕上会显示复制进度。\n\n\n\n\n\n使用 `-r` 选项复制整个目录树。\n\n# 第 34 章：其他互联网服务\n\
  \n这里是使用这些功能的一些方法。\n\n* 若要复制 `local_html` 目录树并将其成为你在系统 `arctic.example.org` 账户上的\
  \ `public_html` 目录，输入：`: scp -r local_html arctic.example.com:public_html`\n* 若从系统\
  \ `arctic.example.org` 上用户 `scout` 的 `public_html` 目录复制文件 `log.txt` 到你本地系统的当前目录，输入：`:\
  \ scp scout@arctic.example.org:public_html/log.txt log.txt`\n\n在最后一个示例中，该用户在 `arctic`\
  \ 上的本地用户名与他在 `scout` 上的用户名不同。\n\n**注意：** 使用 `-v` 选项详细显示；这将在文件传输过程中显示相关信息。\n\n##\
  \ 34.4 阅读 Usenet\n\nUsenet 是一个著名的、庞大的全球讨论板集合，被称为 `newsgroups`（新闻组），在其中可以发布、阅读和公开回复消息（称为\
  \ `articles` 文章）。\n\n拥有数以千计这样的新闻组——涵盖家庭维修、烹饪、收藏、家庭酿酒、当地工作以及运行 Linux 上的硬件设置等主题——Usenet\
  \ 始终是获取技术问题答案的好地方，但不要期望会有柏拉图式的对话；讨论很少超出茶水间闲，寻求者找不到比这多多的内容。网上存在可搜索的存档，其中包含了大部分内容——20\
  \ 年的闲聊和观点。\n\n2 随时准备好被“喷”（`flamed`），或者你的问题或目的被某些想要展示其广博知识的好斗个人所嘲笑。\n3 `http://groups.google.com/`\n\
  \n新闻组按层级命名和组织，层级可以有任意数量的分支。每个分支由一个点字符（`.`）分隔；例如，`comp.os.linux` 新闻组是 `comp` 层级中\
  \ `comp.os` 分支的一部分。\n\n下表列出了 Usenet “八大”层级，并提供了每个层级一些新闻组的示例。\n\n| 层级 | 说明 | 示例 |\n\
  | :--- | :--- | :--- |\n| `comp` | 计算 | `news:comp.os.linux.advocacy`, `news:comp.text.tex`\
  \ |\n| `humanities` | 人文学 | `news:humanities.music.composers.wagner` |\n| `misc`\
  \ | 杂项 | `news:misc.consumers.frugal-living` |\n| `news` | 与 Usenet 本身相关的新组 | `news.newusers.questions`\
  \ |\n| `rec` | 娱乐 | `news:rec.music.marketplace.vinyl`, `news:rec.food.cooking`\
  \ |\n| `sci` | 科学 | `news:sci.math`, `news:sci.cognitive` |\n| `soc` | 社会群体和文化 |\
  \ `news:soc.culture.usa`, `news:soc.college` |\n| `talk` | 聊天闲聊 | `news:talk.environment`,\
  \ `news:talk.politics.guns` |\n\n还有许多其他层级，但从技术上讲，这八个是唯一认为是 Usenet 正部分的新闻组。虽然 `netnews`\
  \ 是包括 Usenet 在内所有新闻组集合的术语，但这些术语经常互换使用。\n\n“替代”层级 `alt` 也许是所有层级中最受欢迎的——你可能讨论的几乎每个主题（以及许多你可能不想讨论的）在这里都有相应的新闻组。它甚至为无关的内容（non\
  \ sequiturs）留了位置。\n\n还有关于某些地理区域的主题的层级：例如，`cmh.` 层级用于俄亥俄州哥伦布大都会区的主题；`seattle` 用于华盛顿州西雅图市。因此，虽然\
  \ `cmh.forsale` 关于在哥伦布大地区出售的物品，但 `seattle.forsale` 用于在西雅图及周边地区出售的物品。某些组织也可能存在层级；例如，`gnu`\
  \ 层级用于有关 `gnu` 项目的新闻组，而 `bit` 用于热门的 `Bitnet` 列表服务邮件列表的重发新闻组。\n\n接下来的“食”描述了用于阅读和向\
  \ `netnews`（网络新闻）发布文章的工具。\n\n### 34.4.1 选择新闻阅读器\n\n允许你向新闻组阅读和发布文章的应用程序被称为 `newsreader`（新闻阅读器）。以下是适用于\
  \ Linux 系统的的一些最佳新闻阅读器。\n\n**Gnus**\n用于 Emacs 的非常强大且功能齐全的新闻阅读器；也可以读取邮件。\n* DEB: `gnus`\n\
  * RPM: `gnus`\n* WWW: `http://gnus.org/`\n\n**Knews**\n用于 X 的图形化新闻阅读器，其功能包括以图形树的形式显示文章线程，以及在慢连接上阅读新闻的选项。\n\
  * DEB: `knews`\n* RPM: `knews`\n* WWW: `http://www.matematik.su.se/~kjj/`\n\n**Mozilla**\n\
  内置在 `Mozilla` 浏览器中的新闻阅读器（历史上，商业新闻浏览器内置了邮件和新闻阅读器，这种功能仍然保留在 `Mozilla` 浏览器中）。\n* DEB:\
  \ `mozilla-browser`\n* RPM: `mozilla`\n* WWW: `http://mozilla.org/`\n\n**NN**\n\
  较旧（非常流行）的新闻阅读器，设计用于在最短时间内阅读最多的新闻；它的口号是“没有消息就是好消息，但 `nn` 更好。”\n* DEB: `nn`\n* RPM:\
  \ `nn`\n* WWW: `http://www.nndev.org/`\n\n**PAN**\n为速度设计的 gnome 新闻阅读器，旨在让初学者使用。\n\
  * DEB: `pan`\n* RPM: `pan`\n* WWW: `http://pan.rebelbase.com/`\n\n**NewsSuite**\n\
  一组用于 X 的小型工具，通过在你的系统在线时批量下载新闻，方便在离线状态下阅读和编写新闻文章。\n* DEB: `peruser`\n* WWW: `http://ibiblio.org/pub/Linux/system/news/readers/`\n\
  \n**SLRN**\n针对慢连接（如家庭拨号连接）进行了优化。基于 `rn`，它是最古老的新闻阅读器之一。\n* DEB: `slrn`\n* RPM: `slrn`\n\
  * WWW: `http://www.slrn.org/`\n\n### 34.4.2 为主题查找新闻组\n\n**NN**\n* DEB: `nn`\n* RPM:\
  \ `nn`\n* WWW: `http://www.nndev.org/`\n\n使用 `nngrep` 查找匹配模式的新闻组名称。这对于查找特定主题组很有用。\n\
  \n* 若要输出所有匹配模式“society”的新闻组列表，输入：`: nngrep society`\n\n使用 `-u` 选项仅搜索未订阅（`unsubscribed`）组。如果你订阅了许多组，并且只想寻找你尚未订阅的组，这非常有用。\n\
  \n* 若要输出所有匹配模式“society”的未订阅的新闻组列表，输入：`: nngrep society`\n\n在上一个示例中，如果你已经订阅了 `alt.society.neutopia`\
  \ 组，该组将不会显示，但其他匹配“society”模式且你未订阅的组将被列出。\n\n**注意**：`nngrep` 使用你的 `~/.newsrc` 文件来获取你已订阅组列表。\n\
  \n## 34.5 显示用户信息\n\n以下工具用于列出互联网上其他用户和系统的活动，显示他们当前是否在线并可能显示关于他们的更多信息。\n\n### 34.5.1\
  \ 检查用户是否在线\n\n使用 `finger` 检查给定用户是否在线。作为参数提供给定用户的用户名（如果在本地系统）或其电子邮件地址（如果在远程系统）。\n\
  \n如果他使用的系统启用了 `finger`（大多数类 Unix 系统应该启用，但今天出于安全考虑通常会被关闭），该命令将告诉你以下信息：他上次登录的日期和时间；当前是否在线；全名；办公室房间和电话号码；主目录的完整路径；所使用的\
  \ shell；是否有待处理的邮件；上一次阅读邮件的时间；最后是他的“计划”，如下文所示。\n\n* 若要 finger 用户 `joe@home.example.org`，输入：`:\
  \ finger joe@home.example.org`\n\n```\n[home.example.org]\nLogin: joe\nName: Joe\
  \ Smith\nDirectory: /sp1/joe\nShell: /bin/tcsh\nLast login Fri Jan 20 16:38 1989\
  \ (PST) on ttypb from work.example.com No mail.\nNo plan.\n```\n\n\n\n\n\n在这个示例中，`home.example.org`\
  \ 上的用户 `joe` 目前未登录，上次登录时间是 1 月 20 日，并使用 `bsch` 壳。\n\n**注意：** 在基于 Unix 的系统上，你可以将信息放在家目录下的一一个名为\
  \ `.plan` 的隐藏文件中，当有人使用 `fingers` 查询你时，这些文本将会输出。有些人会在他们的 `.plan` 文件中放入详细信息；在 20 世纪\
  \ 90 年代初，拥有长篇、散漫的 `.plans` 是非常流行的。\n\n有时，人们会在 `.plan` 文件中为特殊事件放置信息——例如，下周末要举办派对可能会在\
  \ `.plan` 文件中写下他家的地址。\n\n## 34.5.2 列出登录系统的用户\n\n要列出当前登录到特定系统的*所有*用户列表，请使用 `finger`\
  \ 并指定系统名称（或数字 IP 地址），在名称前加上 at 符号（@`）。\n\n这将列出该系统上当前登录的所有用户。它不会提供每个人的 `.plans`，但输出内容包含了每个用户空闲的时间、其连接的位置以及（有时）他正在运行的命令。（输出的特定信息取决于远程系统的操作系统和配置。）\n\
  \n*⇒ 输出当前登录到系统 `ap.example.org` 的用户，输入：\n\n```bash\n$ finger @ap.example.org\n```\n\
  \nRET\n\n[ap.example.org]\n\n| 登录 | 姓名 | Tty | 空闲 | 登录时间 | 办公室 |\n| :--- | :---\
  \ | :--- | :--- | :--- | :--- |\n| joe | Joe Smith | q2 | 16:23 | 9 月 27 17:22 (work.example.com)\
  \ | |\n| gopherd | Gopher Client | r4 | 1:01 | 9 月 28 08:29 (gopherd) | |\n| friday\
  \ | Hildy Johnson | r1 | 14 | 9 月 28 09:35 (ap.example.org) | |\n| sysop | Admin\
  \ Account | t2 | 2 | 9 月 28 08:42 (console) | |\n\n$\n\n## 34.6 显示关于主机的信息\n\n这些都是显示连接到\
  \ Internet 的主机信息的方法。\n\n### 第 34 章：其他 Internet 服务\n\n### 34.6.1 确定主机是否在线\n\n使用 `ping`\
  \ 来确定特定系统当前是否连接到 Internet。它会告诉你 IP 包从你的系统传输到另一个系统并返回所需的时间。\n\n输入 `ping`，后跟你想要检查的系统的主机名或数字\
  \ IP 地址；如果你的系统在线且被要检查的系统也在线，`ping` 应该会持续输出行信息，说明两个系统之间的延迟（以毫秒计）。输入 `CTRL - C` 来中断它并停止\
  \ ping。\n\n*⇒ ping 主机 `bfi.org`，输入：\n\n```bash\n$ ping bfi.org\n```\n\nRET\n\n```\n\
  PING bfi.org (209.196.135.250): 56 data bytes\n64 bytes from 209.196.135.250: icmp_seq=0\
  \ ttl=63 time=190.0 ms\n64 bytes from 209.196.135.250: icmp_seq=1 ttl=63 time=159.9\
  \ ms\n64 bytes from 209.196.135.250: icmp_seq=2 ttl=63 time=160.5 ms CTRL -C\n---\
  \ bfi.org ping statistics ---\n3 packets transmitted, 3 packets received, 0% packet\
  \ loss round-trip min/avg/max = 159.9/170.1/190.0 ms\n```\n\n$\n\n在这个示例中，对主机 `bfi.org`\
  \  ping，在用户输入 `CTRL - C` 中断它之前，总共发送并接收了三个 ping。只要这些 `ping` 行在输出，你就知道另一台机器连接到了 Internet（或至少连接到你的\
  \ `localhost` 所连接的同一个网络）。\n\n你真的不需要分析 `ping` 消息中每一行的信息——唯一有用信息是行尾的数字，它告诉你在访问 Internet、触碰或“ping”该主机并返回需要多少毫秒。越快越好——长度为四或五位数（或更多）的\
  \ ping 意味着两台机器之间的连接缓慢。当你中断 `ping` 时，会输出一些统计数据，包括 ping 给定主机所需的最小、平均和最大毫秒数。在上一个示例中，最大值为\
  \ 190，最低值为 159.9 毫秒，往返平均为 170.1 毫秒。\n\n**注意：** 如果你自己的系统未在线，`ping` 将报告网络不可或找不到主机。\n\
  \n## 34.6.2 追踪到另一个主机的路径\n\n使用 `traceroute` 追踪从你的主机到另一个主机的路径。将远程主机名称作为参数，`traceroute`\
  \ 将显示你与该主机之间连接的所有系统列表。这对于检查特定主机属于什么 ISP 或什么种连接类型、检查你与主机之间经过的路由以及查看主机是否在线非常有帮助。\n\
  \n*⇒ 追踪你的主机与 `whitehouse.gov` 之间的路径，输入：\n\n```bash\n$ traceroute whitehouse.gov\n\
  ```\n\nRET\n\n**注意：** 在某些系统上，`traceroute` 保存在 `/usr/sbin/` 中。如果是这样，它不在普通用户的路径中，尽管这些用户仍然可以运行它——只需在运行时指定完整路径名即可，例如\
  \ `/usr/sbin/traceroute`。\n\n## 34.6.3 获取主机名的 IP 地址\n\n当你知道一个特定主机的名称，并想要找到它对应的 IP\
  \ 地址时，有几种方法可以尝试。\n\n**方法 #1**\n\n要获取主机的 IP 地址，请 `ping` 该主机；这将在括号中输出该主机的 IP 地址（参见食谱\
  \ 34.6.1 [确定主机是否在线]，第 685 页）。\n\n**方法 #2**\n\n使用 `host` 获取你提供的主机名（作为参数）的主机 IP 地址。\n\
  \n*⇒ 获取 `example.net` 的 IP 地址，输入：\n\n```bash\n$ host example.net\n```\n\nRET\n\n\
  **注意：** 取决于远程主机的设置，这种方法可能不起。\n\n**方法 #3**\n\n使用 `dig`（“域名信息生成器”工具）来获取主机的 IP 地址。将主机名作为参数以输出关于该主机的信息，包括其\
  \ IP 地址，位于标记为 `ANSWER SECTION` 的部分。\n\n*⇒ 查找 `example.net` 的 IP 地址，输入：\n\n```bash\n\
  $ dig example.net\n```\n\nRET\n\n```\n...output messages...\n;; ANSWER SECTION:\n\
  example.net. 1 IN A\n64.240.156.195\n```\n\n$\n\n在这个示例中，`dig` 输出了主机 IP 地址 64.240.156.195。\n\
  \n## 34.6.4 获取 IP 地址的主机名\n\n当你知道一个系统的 IP 地址时，可以确定其完整网络名称，或 fqdn（“完全限定域名”）。有几种方法可以。\n\
  \n**方法 #1**\n\n使用 `host` 获取你提供的 IP 地址（作为参数）的系统主机名。\n\n*⇒ 获取 `127.0.0.1` 的主机名，输入：\n\
  \n```bash\n$ host 127.0.0.1\n```\n\nRET\n\n**注意：** 取决于远程主机的设置，这种方法可能不起。\n\n**方法\
  \ #2**\n\n要查找给定 IP 地址的主机名，请使用带有 `-x` 选项 `dig`。\n\n*⇒ 查找对应于 IP 地址 `152.2.210.81`\
  \ 的主机名，输入：\n\n```bash\n$ dig -x 152.2.210.81\n```\n\nRET\n\n```\n...output messages...\n\
  ;; ANSWER SECTION:\n81.210.2.152.in-addr.arpa. 1 IN PTR\nmetalab.unc.edu.\n```\n\
  \n$\n\n在这个示例中，`dig` 输出对应给定 IP 地址的 fqdn 为 `metalab.unc.edu`。\n\n## 34.6.5 列出域名的所有者\n\
  \nInternet 域名的*域名记录*包含了注册该域名的组织或个人的联系信息。使用 `whois` 命令可以查看常见的 .com、.org、.net 和 .edu\
  \ 顶级域的域名记录。\n\n仅将域名名作为参数，`whois` 将输出拥有特定域名记录的“Whois 服务器”名称。要输出域名记录，请指定作为 `-h` 参数使用的\
  \ Whois 服务器。\n\n*⇒ 输出 `columbia.edu` 的 Whois 服务器名称，输入：\n\n```bash\n$ whois columbia.edu\n\
  ```\n\nRET\n\n\n\n\n\n# 要查看 `columbia.edu` 的域名记录，请使用 `whois.educause.net` Whois\
  \ 服务器并输入：\n\n```bash\nwhois -h whois.educause.net columbia.edu\n```\n\n**注意：** 此命令还会输出处理该域名的名称服务器名称——这对于了解特定网站的托管位置很有帮助。\n\
  \n## 34.7 与其他用户聊天\n\n有多种方法可以在互联网上与其他用户进行交互式聊天，无论他们的平台或操作系统如何。以下配方描述了实现此目的的最常用工具和方法。\n\
  \n第 34 章：其他互联网服务\n689\n\n## 34.7.1 向另一个用户的终端发送消息\n有几种方法可以实现此点，取决于你是发送给特定用户还是*所有*用户。\n\
  \n### 方法 #1\n\n使用 `write` 向另一个用户的终端写入消息。将要写入的用户名作为参数。该命令会写入你提供的消息，并在前面带有行头，指示后续内容是来自你的消息，并给出当前系统时间。它还会响起用户终端的铃声。\n\
  \n⇒ 向用户 `sleepy` 登录的终端发送消息“Wake up!”，输入：\n\n```bash\nwrite sleepy\n```\n\n`Wake\
  \ up!`\n\n`CTRL-D`\n\n$\n\n另一个用户可以通过运行 `write` 并提供你的用户名作为参数来回复你。传统上，用户用 `-o` 结束写入消息，这表示他所说的话已经“结束”了，现在轮到对方说话了。当用户认为对话已完成时，他会以“oo”结束一行，意为他已“结束并离开（over\
  \ and out）”。\n\n### 方法 #2\n\n类似的命令 `wall` 会向本地系统上的所有其他用户写入文本消息。它接受文本文件作为参数并输出该文件的内容；如果没有参数，它将输出你输入的内容，直到你在单独的一行输入\
  \ `CTRL-D` 为止。它会在消息前加上文本“Broadcast message from *username*”（其中 *username* 是你的用户名），随后是当前系统时间，并且它会响起它广播所到所有终端的铃声。\n\
  \n⇒ 这里是使用该命令的两种方法。\n\n• 将 `/etc/motd` 的内容输出到所有登录的终端，输入：`wall /etc/motd`\n\n`RET`\n\
  \n690\n《Linux Cookbook》，第 2 版\n\n• 将文本“Who wants to go out for Chinese food?”输出到所有登录的终端，输入：\n\
  \n```bash\nwall\n```\n\n`Who wants to go out for Chinese food?`\n\n`CTRL-D`\n\n\
  ## 34.7.2 拒绝向你终端的消息\n\n你可以控制 `write` 和 `wall` 等命令对你终端的写入权限，以免受到打扰。使用 `mesg` 来实现。它的工作原理类似于\
  \ `biff`（见配方 32.4.2 [设置新邮件通知]，第 624 页）：不带参数时，输出是否已设置；参数为 `y` 时允许消息发送到你的终端；参数为 `n`\
  \ 时禁止。\n\n所有用户的默认设置都是允许向终端写入消息；不社交的人通常会在 `.bashrc` 文件中加入 `mesg n` 行（见配方 3.7.3 [使用\
  \ Shell 启动文件]，第 86 页）。\n\n⇒ 这里是使用该命令的一些方法。\n\n• 禁止向你的终端写入消息，输入：`mesg n`\n\n`RET`\n\
  \n• 输出你终端的当前访问状态，输入：`mesg`\n\n`is n`\n\n$\n\n在前面的示例中，`mesg` 表明目前禁止向你的终端写入消息。\n\n\
  ## 34.7.3 与用户直接聊天\n\n**Ytalk**\n\nDEB: `ytalk`\nRPM: `ytalk`\nWWW: `http://www.iagora.com/~espel/ytalk/ytalk.html`\n\
  \n使用 `talk` 与另一个用户进行实时交互式聊天。将你想聊天的用户的用户名（或电子邮件地址）作为参数；消息将发送到该用户的终端，指示请求建立连接。\n\n\
  ![](img/index-725_1.png)\n\n第 34 章：其他互联网服务\n691\n\n如果那个人随后运行 `talk` 并提供你的用户名作为参数，你们将连接到\
  \ `talk` 会话中——屏幕将清空，然后你输入的内容将显示在屏幕顶部；另一个用户输入的内容将显示在屏幕底部。\n\n⇒ 向用户 `watson@example.edu`\
  \ 请求聊天，输入：`talk watson@example.edu`\n\n`RET`\n\n此命令向用户 `watson@example.edu` 发送连接请求。\n\
  \n如果用户未登录或拒绝接收消息，`talk` 将输出指示此类情况的消息；但如果用户可用，`talk` 将向该用户发送消息请求完成连接，并并你它正在响起你的分机。\n\
  \n如果该用户未登录，你会收到通知，然后 `talk` 将退出。如果用户已登录并输入 `talk bell@myers.example.org`（在此示例中，如果你的电子邮件地址是这个），你们之间将建立\
  \ `talk` 连接。此时，你的屏幕将清空并看起来像图 34-1。\n\n*图 34-1. 开始 talk 会话。*\n\n你然后可以输入，你输入的内容将显示在你的屏幕和该用户的屏幕上；该用户反过来*也可以*输入——即使在你输入时，该用户输入的内容也会显示在两个屏幕的另一半部分，如图\
  \ 34-2 所示。\n\n![](img/index-726_1.png)\n\n692\n《Linux Cookbook》，第 2 版\n\n*图 34-2.\
  \ 进行中的 talk 会话。*\n\n惯例是通过输入 `RET` 来表示你已经说完某些话，从而将光标移过你屏幕半部分的空白行。某些用户在对话过程中当他们一直输入到他们屏幕部分的底部后，会反复输入\
  \ `RET` 来“清空”他们半部分的屏幕，从而将光标带回空白半部分的顶部。\n\n输入 `CTRL-C` 结束 `talk` 会话。\n\n当你输入时，两名用户都能看到字符实时出现；我对互联网交互特性的首次演示，回到过去，当我运行这个命令时！\n\
  \n**注意：** 类似的命令 `ytalk` 允许多个用户同时连接，并且它包含其他功能；它通常被认为是 talk 的优越替代品。\n\n## 34.7.4 在\
  \ irc 上聊天\n\n网络中继聊天 (irc) 是一个全球聊天系统，可能是互联网上最古老且最大的。要“进入”irc，你需要使用 irc 客户端连接到 irc\
  \ 服务器。\n\n有几个 `irc` 网络，每个网络都有自己的服务器和数万用户；就像对无线电一样，，irc` 网络有*频道*，通常基于特定主题，你加入频道以与频道内的用户聊天（你也可以向其他用户发送私信）。\n\
  \n下表列出了 Linux 可用的某些 irc 客户端。\n\n**BitchX**\nirc 客户端，其功能包括 ansi 转义序列，因此它可以显示 irc\
  \ 上流行的用于特殊效果的所有字符转义码。尽管从它的名字中可以推断，但它实际上不需要 X 即可运行。\n`bitchx`\nRPM: `BitchX`\nWWW:\
  \ `http://www.bitchx.org/`\n\n**EPIC**\n功能丰富的 irc 客户端。\nDEB: `epic`\nRPM: `epic`\n\
  WWW: `http://www.epicsol.org/`\n\n**Irssi**\n模块化 irc 客户端；注意某些版本只能在带有 gnome 的环境下运行。`irssi-common`\n\
  RPM: `irssi`\nWWW: `http://irssi.org/`\n\n**Xchat**\n用于 X 的图形化 irc 聊天客户端。\nDEB:\
  \ `xchat`\nRPM: `xchat`\nWWW: `http://www.xchat.org/`\n\n**ZenIRC**\nEmacs 中极简且无哨（但完全可扩展）的\
  \ irc 模式。\nDEB: `zenirc`\nWWW: `http://www.zenirc.org/`\n\n## 34.7.5 在 icq 上聊天\n\
  \n在 20 世纪 90 年代后期，名为 Mirabilis 的公司发布了一种名为 `icq` (“I Seek You”）的 pc 私有程序，用于向发送文本消息。\n\
  \n694\n《Linux Cookbook》，第 2 版\n\n\n\n\n实时与其他用户通信。从那时起，已经出现了许多使用 `icq` 协议的免费软件聊天工具。\n\
  \n`icq` 的一个优秀特性是你可以维护一个包含电子邮件地址的“联系人列表”，当你运行 `icq` 客户端时，它会告诉你你的任何朋友是否在线。但与 `talk`\
  \ 不同，你无法实时看到其他用户的输入过程——只有在你发送消息后，消息才会显示在用户的 `icq` 客户端中。\n\n下表列出了目前可用的一些免费软件 `icq`\
  \ 客户端。\n\n### LICQ\n用于 X 系统的 `icq` 客户端。\nDEB: `licq`\nRPM: `licq`\nWWW: `http://www.licq.org/`\n\
  \n### MICQ\n“Matt 的 icq 克隆版”，一个可以在 shell 中使用的简单 `icq` 客户端。\nDEB: `micq`\nRPM: `micq`\n\
  WWW: `http://www.micq.org/`\n\n### ZICQ\n修改了用户界面的 `micq`。\nRPM: `zicq`\n\n## 第 34\
  \ 章：其他互联网服务\n\naol 的即时消息器 (`aim`) 与 `write` 类似，是为互联网运行设计的——它将消息发送到用户的终端，并通过“联系人列表”功能告诉你你的朋友是否在线。最初，`aim`\
  \ 和类似的服务使用专有格式，但现在有了各种免费软件工具可以配合 `aim` 使用（尽管你必须在 aol 的 `aim` 网站注册才能使用它们），而且还有其他新的\
  \ im 服务。\n\n下表描述了目前 Linux 可用的各种即时消息（im）工具。\n\n### Everybuddy\n一个 im 客户端（现在称为“Ayttm”），可以识别\
  \ `aim`、`icq`、`Yahoo` 和 `msn` 使用的协议。\nDEB: `everybuddy`\nRPM: `everybuddy`\nWWW:\
  \ `http://ayttm.sourceforge.net/`\n\n### Gaim\n流行的消息客户端，可以识别许多 im 网络使用的协议，包括 `aim`、`icq`、`Yahoo`、`msn`、`irc`\
  \ 和 `Jabber`。\nDEB: `gaim`\nRPM: `gaim`\nWWW: `http://gaim.sourceforge.net/`\n\n\
  ### Jabber\n使用基于 xml 协议的免费 im 系统，在 Linux 世界非常流行。\nDEB: `jabber`\nRPM: `jabber`\n\
  WWW: `http://www.jabber.org/`\n\n### Tik\n用于 `aim` 的 tcl/tk 客户端。\nDEB: `tik`\nRPM:\
  \ `tik`\nWWW: `http://tik.sourceforge.net/`\n\n## 附录 A：管理问题\n\n每个 Linux 系统都有一个 `administrator`（管理员），负责安装硬件和软件、维护系统并通常保持系统运行良好。单用户家用\
  \ Linux 系统在安装并运行后，很少需要管理——但偶尔的升级或维护任务是必要的。\n\n本附录旨在为那些也将对自己的系统执行管理职责的用户提供参考。虽然完整的管理指南不在本书的涵盖范围内，但本附录的目标是为新的\
  \ Linux 管理员指明正确的方向，提供关于如何选择用于 Linux 的计算机、在其上安装 Linux 以及为使用做好准备的建议。\n\n与本书的其他部分不同，本章包含了描述由\
  \ `root`（超级用户账户）运行的命令的配方。这些命令中的许多*无法*由普通用户运行。这些配方中的示例没有使用书中其他部分使用的“$” shell 提示符，而是使用井号（`#`），这是\
  \ root 账户的默认提示符。\n\n如果你是 Linux 管理的新手，你可能想查阅配方 1.6 [如果你需要更多帮助] 第 13 页列出的帮助资源。\n\n\
  ### A.1 设置硬件\n在过去的日子里，Linux 爱好者必须从各个组件组装计算机系统，因为计算机商店的销售员甚至从未听说过 Linux 或自由软件运动。但现在不再如此了。今天，许多经销商出售销售预装了\
  \ Linux 的完整系统，包括戴尔电脑和 `ibm` 等公司。\n\n#### A.1.1 确定哪些硬件兼容\n由于 Linux 运行在许多不同的计算机上并支持广泛的硬件，而且每个人的需求不同，我不会对购买哪些特定硬件给出过多的建议。（毕竟，系统的变化太快，这种列表永远不会有用。）\n\
  \n不过，在购买硬件之前，请确保它与 Linux 兼容——如果那个廉价的视频采集卡具有仅适用于特定非自由操作系统的专有接口，那么它将毫无用处。\n\n要确定你的硬件是否能在\
  \ Linux 下工作，请尝试以下操作：\n1. 阅读 `Linux Hardware Compatibility HOWTO`（见配方 2.8.6 [阅读系统文档和帮助文件]，第\
  \ 50 页），这是一份与 Linux 兼容的硬件最新列表。\n2. 在提供 Linux 硬件评论和信息的两个网站上搜索：`http://www.linuxhardware.net/`\
  \ 和 `http://www.linuxhardware.org/`。\n3. 搜索互联网——特别是 Usenet 新组和 `linux.com` 网站——关于你打算购买的硬件的信息。阅读人们可能写的关于使其在\
  \ Linux 上运行的故障报告，这样你就不会写下一个了。\n\n#### A.1.2 设置系统日期和时间\n有几种方法可以设置系统日期和时间。第一种简单且适用于所有系统，但依赖操作输入准确的时间；如果你需要或想要更高的准确性，请使用第二种方法描述的工具之一。\n\
  \n**方法 #1**\n使用 `date` 的 `-s` 选项设置系统日期。将要使用的日期和时间作为参数——在命令运行瞬间，系统日期将被设置为该日期。对长格式的日期加引号。\n\
  \n⇒ 这里有两种使用这种方法。\n* 要将系统日期设置为 1994 年 3 月 4 日正午，输入：\n```\n# date -s \"Mar 4 12:00\
  \ 1994\"\n```\n* 要将系统日期设置为下午 4:15，输入：\n```\n# date -s 16:15\n```\n在上面的第二个示例中，日、月、年没有被设置，它们将保持在运行此命令之前的值。\n\
  \n**方法 #2**\n使用以下工具之一将系统日期和时间设置为互联网上远程主机提供的日期和时间。这对于保持你的时间与各种公共时间服务器（例如美国海军运行的服务器）同步非常好。\n\
  \n### Chrony\n根据互联网上可用的时间服务器设置日期，并通过定期从这些服务器重新调整系统时间来补偿“漂移”。\nDEB: `chrony`\nRPM:\
  \ `chrony`\nWWW: `http://chrony.sunsite.dk/index.php`\n\n### Rdate\n将系统日期设置为远程主机提供的日期和时间。\n\
  DEB: `rdate`\nRPM: `rdate`\n\n### A.1.3 为特定设备指定挂载点\n有时为设备设置特殊的挂载点很方便，例如你经常使用的 `cd`\
  \ 或软驱，这样当你将该挂载点作为 `mount` 的参数时，该设备就会自动挂载。\n\n要执行此操作，编辑 `/etc/fstab`，使特定的挂载点有一个条目，并在第一列给出设备名称。例如，你可能想在\
  \ `/etc/inittab` 的某处包含图 A-1 中两行的变体。\n\n```\n/dev/fd0  /floppy  auto  defaults,user,noauto\
  \  0  0\n/dev/cdrom /cdrom   iso9660 defaults,ro,user,noauto  0  0\n```\n*图 A-1.inittab\
  \ 中的用户挂载设备。*\n\n这意味着当任何用户（因为这两个挂载点都有用户访问权限）输入 `mount /floppy` 时，对应 `/dev/fd0` 设备（第一个软驱）将挂载到\
  \ `/floppy`，并且其文件系统类型将自动检测。如果用户输入 `mount /cdrom`，则对应 `/dev/cdrom` 设备的数据光盘将挂载到 `/cdrom`，并作为\
  \ iso 9660 文件系统。\n\n**注意：** 如果你为 `/etc/fstab` 中已有的设备指定了特定的挂载点，那么该设备将挂载到你指定的点上——这种方法并不会将你的挂载点限制为文件中指定的设备。\n\
  \n\n\n\n《Linux 厨房指南》，第 2 版\n\n## A.1.4 制作启动软盘\n\n`boot floppy`（启动软盘）是一张存有可启动 Linux\
  \ 内核的软盘。拥有一个启动软盘是非常有用的，以防你的 `root partition`（根分区）——即你硬盘上包含可启动 Linux 内核的分区——万一发生损坏时可以使用。在紧急情况下，你可以从软盘启动系统，然后挂载你的其他分区。如果你没有启动软盘，你将无手无策。这就是为什么启动软盘有时被称为“救援磁盘”。\n\
  \n要制作启动软盘，你首先需要在你的系统中找到包含你想要让软盘拥有的 Linux 内核镜像文件的文件。通常，在 `/boot` 目录下会有一个名为 `vmlinuz`\
  \ 的压缩内核启动镜像文件。你也可以从你的发行版中获取启动镜像。\n\n⇒ 以下是使用此方法的两种方式。\n\n• 对于 Debian 系统，你始终可以从以下\
  \ URL（给定如下）获取最新 x86 版本的救援镜像（所有内容在同一行）：`ftp://debian.crosslink.net/debian/dists/stable/main/disks-i386/current/images-1.44/rescue.bin`\n\
  \n• 对于 Red Hat 系统，可以通过 ftp（参见菜谱 34.2 [向远程主机传输和传输文件]，第 673 页）从主机 `ftp.redhat.com`\
  \ 获取 x86 启动镜像。它被保存在名为 `/pub/redhat/linux/*version*/en/os/i386/images/` 的目录中，其中 `version`\
  \ 是你的 Red Hat 版本号，文件名为 `boot.img`（旧版本）或 `bootdisk.img`。\n\n要从 Linux 内核镜像制作启动软盘，请使用\
  \ `dd` 命令，将内核镜像的名称作为输入文件，将软盘设备的名称作为输出文件。\n\n⇒ 要将第一个软盘驱动器中的软盘制作成包含启动镜像文件 `bootdisk.img`\
  \ 的启动盘，请输入：\n\n```bash\ndd if=bootdisk.img of=/dev/fd0\n```\n\n## A.1.5 删除主引导记录\n\
  \n要删除磁盘的主引导记录（`mbr`），请使用 `dd` 将 `/dev/zero` 的内容覆盖到磁盘的前 512 字节。\n\n⇒ 要删除 `/dev/hda`\
  \ 的主引导记录，请输入：\n\n```bash\ndd if=/dev/zero of=/dev/hda bs=512\n```\n\n**注意:** 执行此操作时请务必小心，因为这将导致磁盘无法启动。\n\
  \n\n\n人们不断为自由软件运动做出贡献，并将他们的工作发布在网上。这意味着新的软件程序不断被添加到 Linux 发行版中，而现有的程序也在不断改进——为了匹配新硬件的新功能、更快的程序执行、安全更新等。因此，Linux\
  \ 系统需要保持更新，以获得最新免费软件的益处。\n\n早晚，你都会想要安装更多程序，或者当有带有你所需功能的新版本可用时，想要升级现有的软件。\n\n以下“食谱”用于在你的系统上安装软件。\n\
  \n### A.3.1 获取并安装 Linux 发行版\n\n你可以从本地或在线供应商处，或者从朋友那里通过 CD-ROM 获得 Linux 副本。某些发行版还允许从互联网下载（当然，这只有在你拥有快速互联网连接时才被推荐）。Linux\
  \ 发行版列表位于附录 D [进一步感兴趣的参考]，第 731 页。\n\n无论你从哪里获取 Linux 副本，请确保你获得的是来自信良好发行版的最新版本。如果只提供旧版本，你可能应该放弃：该软件可能无法与你全新的硬件兼容！\n\
  \n如果你更倾向于在线购买副本，推荐的来源是 `CheapBytes` [http://www.cheapbytes.com/]。在那里你可以找到各种价格实惠的\
  \ CD-ROM Linux 发行版。\n\n安装步骤因发行版而异，安装任何特定发行版和版本的细节超出了本书的范围。然而，该过程通常涉及使用 CD-ROM 提供的工具制作\
  \ Linux “启动盘”，或在你的系统上启动 Linux。硬盘会被分区并格式化，Linux 软件会被加载到它们中。许多用户随后会重新编译一个针对他们的需求和硬件定制的\
  \ Linux 内核。如果你觉得这很难，或者需要帮助，你应该找到当地的 Linux 用户组并将电脑带到那里——总有一些“极客”（lug）成员特别乐意帮助初学者在电脑上安装\
  \ Linux，许多极客还会为此目的定期定的“安装节”（InstallFests），参与活动总是免费的（参见食谱 1.6 [如果你需要更多帮助]，第 13 页）。\n\
  \n### A.3.2 为你的 Linux 发行版安装包\n\nLinux 发行版将软件程序放在 `packages`（包）中，这些是单个文件（通常是压缩的），包含了该特定程序所需的所有文件的归档。发行版有一套软件管理系统用于安装和维护包；在安装时，首先会检查该包为了正确运行可能依赖其他包（其\
  \ `dependencies` 依赖项）。\n\n通过这种方式，你可以确保安装在系统上的软件将正常运行。\n\nLinux 世界中两种主要的包格式：Debian\
  \ 的 `deb` 格式和 Red Hat 的软件包管理器格式 `rpm`。前者用于 Debian 和 Knoppix 发行版；后者由 Red Hat、Mandrake、SuSE\
  \ 等使用。另一些发行版可能完全不使用包，或者可能使用源码包（参见下文食谱）。\n\n你系统所需的大部分软件将以你发行版的包格式存在，但你并不限于此。你始终可以安装源码包，甚至安装以另一个发行版格式封装的软件：`Debian`\
  \ 长期以来能够通过特殊软件读取并安装 `rpm` 包，而默认使用 `rpm` 的发行版（包括 `Fedora` 和 `Red Hat Enterprise`）同样拥有使用\
  \ `deb` 的工具。\n\n我有点老派，因为我不喜欢打包系统与发行版混合，但某些人可能需要这样做。\n\n这些包格式的管理将在附录的后续章节中描述：食谱 A.4\
  \ [管理 deb 包]，第 709 页和食谱 A.5 [管理 epm 包]，第 714 页。\n\n### A.3.3 安装源码包\n\n通常源码包以压缩的\
  \ tar 归档形式作为单个文件分发，扩展名为 `.tar.gz` 或 `.tgz`。这些文件的集合通常被称为计算机程序的 `sources`（源码）。\n\n\
  这些文件通常放置在 `/usr/local/src` 中，并解压到自己的目录中。如果是源码发行版，则必须编译软件。通常包目录中名为 `INSTALL` 或 `README`\
  \ 的文件会指示你如何操作。许多源码包附带有一个名为 `configure` 的脚本，通过运行它来为你的系统配置编译程序。这就像任何文件名一样，仅仅是惯例。没有任何惯例（以及常识）能阻止你给压缩的\
  \ tar 文件加上 `.EXE` 扩展名，或给 Debian `deb` 格式文件加上 `.rpm`，或者完全省略文件扩展名，然后使用 `install` 或\
  \ `all` 作为参数运行，取决于软件包特定文档的指示。\n\n⇒ 要从源码目录编译并安装软件包包，你通常输入：\n\n```bash\n./configure\n\
  # ... 配置消息 ...\nmake install\n# ... 编译消息 ...\n# ... 安装消息 ...\n```\n\n当你在系统上安装源码包时，被称为是在安装本地软件——文件被保留在\
  \ `/usr/local` 目录树中。二进制文件被放在 `/usr/local/bin`，库放在 `/usr/local/lib`，手册页放在 `/usr/local/man`，文档放在\
  \ `/usr/local/doc` 或 `/usr/local/share/doc` 中。\n\n### A.3.4 安装 Shell 脚本\n\n当你有一个想要安装在系统的\
  \ Shell 脚本时，首先确保脚本文件是可执行的（参见食谱 6.3.6 [使文件可执行]，第 170 页）。通常管理员会将新的 Shell 脚本安装在 `/usr/local/bin`\
  \ 目录下。如果你在一个多用户系统上且你是唯一可能运行特定脚本的用户，可以将其放在家目录下的特殊目录中——`~/bin` 目录是标准推荐——然后将该目录添加到你的路径中（参见食谱\
  \ 3.5.7 [添加到你的路径]，第 81 页）。\n\n并不是所有可执行脚本文件都是 Shell 脚本。脚本的第一行包含用于解释和执行脚本的 shell 或其他程序的完整路径名；有时系统上的路径可能与编写脚本时的路径不同，因此你可能需要更改此行。\n\
  \n例如，脚本可能以以下行开头：\n\n```\n#!/usr/local/bin/perl\n```\n\n此行意味着脚本是用 perl 语言编写的；`#!`\
  \ 之后的文本是 perl 程序的完整路径，在此情况下为 `/usr/local/bin/perl`。如果脚本第一行中的工具位置与你系统上的位置不同，它将无法工作（参见食谱\
  \ 7.5 [查找程序位置]，第 185 页）。例如，如果 perl 在你系统上的位置是 `/usr/bin/perl`，你必须编辑此脚本的第一行以匹配该实际位置。\n\
  \n如果你尝试执行此脚本，而系统报告找不到文件，你将不得不更改第一行以对应你系统上 perl 二进制文件的位置。`which` 工具将输出此位置。\n\n⇒ 要找出\
  \ perl 在你系统上的安装位置，输入：\n\n```bash\nwhich perl\n```\n\n如果此命令返回 `/usr/bin/perl` 或 `/usr/local/bin/perl`以外的路径名，你必须将脚本第一行的位置更改为给定的路径名：\n\
  \n```\n#!/usr/bin/perl\n```\n\n**注意：** 如果 `which` 命令的输出为空，意味着你的系统上完全没有安装 perl 程序；在这种情况下，你应该安装\
  \ perl 软件以运行该脚本。\n\n\n\n\n\n# A.4 管理 deb 软件包\n\n### Dpkg\nDEB: `dpkg`\n\n或\n\n###\
  \ Apt\nDEB: `apt`\n\n`deb` 是 Debian 系统上的原生软件包格式。\n\n这些软件包可以在 http://packages.debian.org/\
  \ 找到。\n\n有许多工具可用于 `deb` 软件包管理。传统上，`dselect`（通过菜单选择软件包）是用于从系统中安装和删除软件的工具。它的界面非常独特，因此需要学习。遗憾的是，正确使用它是一项后天习得技能。建议安装新系统的管理员运行\
  \ `dselect` 并至少重启几次，以确保所有基本软件包及其依赖项都已安装。\n\n`dpkg` 工具是 Debian 主要的命令行包管理器（事实上，`dselect`\
  \ 只是它的前端界面），它可以独立地在命令行中运行。接下来的配方将重点描述这种用法。本文还将描述使用来自 Debian“高级软件包工具”（Advanced Package\
  \ Tool）系统的较新工具 `apt-get`的方法；大多数经验丰富的用户倾向于使用 `apt-get`。\n\n**注意：** 以下所有操作也可以通过 `dselect`\
  \ 程序完成，但本文将不再描述该方法。\n\n### A.4.1 列出 deb 软件包\n\n使用带有 `-l` 选项的 `dpkg` 列出已安装的 `deb`\
  \ 软件包。单独使用，它会列出系统中当前安装的所有软件包并描述其状态；你可以提供通配符表达式作为参数，列出匹配该模式的软件包（参见配方 5.8 [使用模式指定文件名]，第\
  \ 153 页）。\n\n⇒ 以下是使用此的一些方法。\n\n• 浏览系统中所有的 `deb` 软件包，输入：\n\n```\ndpkg -l | less\n\
  ```\nRET\n\n• 列出所有名称以“gimp”开头的已知 `deb` 软件包，输入：\n\n```\ndpkg -l gimp\n```\nRET\n\n\
  • 列出系统中名称中任何包含“gimp”的 `deb` 软件包，输入：\n\n```\ndpkg -l '*gimp*'\n```\nRET\n\n要列出特定软件包，请提供其名称。要在已安装软件包中搜索模式，可以将\
  \ `dpkg -l` 的输出通过给 `grep`。\n\n⇒ 以下是使用此功能的两种方法。\n\n• 确定是否安装了 `gimp` 软件包，输入：\n\n```\n\
  dpkg -l gimp\n```\nRET\n\n• 列出所有名称中包含“gimp”的已安装 `deb` 软件包，输入：\n\n```\ndpkg -l |\
  \ grep gimp\n```\nRET\n\n你也可以通过将软件包作为参数传递给 `apt-cache` 并使用 `show` 选项获取特定 `deb` 软件包的摘要。\n\
  \n⇒ 要获取 `gimp` 软件包的摘要，输入：\n\n```\napt-cache show gimp\n```\nRET\n\n### A.4.2 安装\
  \ deb 软件包\n\n安装 `deb` 软件包有两种方法。\n\n**方法 #1**\n\n使用 `dpkg` 安装 `deb` 软件包，请将要安装的软件包文件名作为\
  \ `-i` 选项的参数。\n\n⇒ 要安装 `deb` 文件 `gimp1.2_1.2.3-2_i386.deb`，输入：\n\n```\ndpkg -i gimp1.2_1.2.3-2_i386.deb\n\
  ```\nRET\n\n**注意：** 在软件包之前，你必须解决任何冲突或依赖关系。如果检测到问题，`dpkg` 将报告该问题并在不安装软件包的情况下退出。\n\
  \n你还可以结合 `-i` 与 `--no-act` 标志来测试安装。这将通过所有安装步骤，但不会实际安装任何文件。\n\n**方法 #2**\n\n使用 `apt-get`\
  \ 获取并安装软件包，使用 `install` 选项并将软件包的基名作为参数。运行此命令时，请确保你的 Debian 发行版已就绪。如果你从光盘安装，请将第一张\
  \ Debian 光盘放入光驱器；如果通过互联网安装，请确保你的系统在线。\n\n⇒ 要获取并安装 `hello` `deb` 软件包的正确文件，输入：\n\n\
  ```\napt-get install hello\n```\nRET\n\n**注意：** 如果存在任何依赖关系，或者软件包与已安装的其他软件包冲突，将呈现一个修复此问题的操作，并提示你确认或取消操作。\n\
  \n### A.4.3 升级 deb 软件包\n\n要升级 `deb` 软件包，只需安装较新的软件包文件。根据你使用的软件包工具，有两种方法可以。\n\n**方法\
  \ #1**\n\n使用 `dpkg` 升级 `deb` 软件包，只需再次使用 `-i` 选项安装它；如果你安装的软件包文件较新，Debian 将自动升级；如果较旧，它将自动降级。\n\
  \n⇒ 使用 `deb` 文件 `gimp1.2_1.2.4_i386.deb` 升级 `gimp1.2` 软件包，输入：\n\n```\ndpkg -i gimp1.2_1.2.4_i386.deb\n\
  ```\nRET\n\n**方法 #2**\n\n使用 `apt-get` 升级单个软件包或整个系统。使用 `apt-get` 升级单个软件包，只需再次使用 `install`\
  \ 选项安装它，并跟上要升级的软件包名称。\n\n⇒ 要升级 `hello` 软件包，输入：\n\n```\napt-get install hello\n```\n\
  RET\n\n如果你的 Debian 分发源存在比系统中已安装版本更高的版本，此命令将把 `hello` 软件包升级到可用的最新版本。为了使此新软件包升级正常运行，必须先升级额外的软件包，此命令也将获取并升级这些软件包。在下载任何软件包之前，`apt-get`\
  \ 将显示将安装、替换或其他更改的软件包列表，并首先等待确认。\n\n要将整个 Debian 系统更新到最新状态，请使用带有以下参数的 `apt-get` 工具。首先，使用\
  \ `update` 参数更新系统的可用软件软件包列表。然后再次运行 `apt-get`，使用 `upgrade` 参数将所有已安装的软件包升级到它们最新的可用版本，或者在发布\
  \ Debian 系统新版本时，使用 `dist-upgrade` 参数升级到该新版本。\n\n⇒ 以下是使用此功能的两种方法。\n\n• 将你系统上的所有软件升级到它们的最新版本，输入：\n\
  \n```\napt-get update\napt-get upgrade\n```\nRET\n\n• 将你的 Debian 系统升级到最新发布版本，输入：\n\
  \n```\napt-get update\napt-get dist-upgrade\n```\nRET\n\n### A.4.4 移除 deb 软件包\n\n\
  要移除 `deb` 软件包，使用带有 `-r` 选项的 `dpkg` 并提供要移除的软件包名称（不是文件名）。\n\n⇒ 要移除 `gimp1.2` 软件包，输入：\n\
  \n```\ndpkg -r gimp1.2\n```\nRET\n\n这会移除软件包但保留任何配置文件。使用 `--purge` 选项完全消除与软件包相关的所有内容，包括所有配置和设置文件。\n\
  \n⇒ 要清除 `gimp1.2` 软件包，输入：\n\n```\ndpkg --purge gimp1.2\n```\nRET\n\n**注意：** 如果彻底清除软件包会破坏依赖关系，`dpkg`\
  \ 将不允许你这样做。不过，你可以强制执行；要获取“强制”选项列表，请运行带有 `--force-help` 选项的 `dpkg`。\n\n### A.4.5\
  \ 获取 deb 软件包的状态\n\n获取 `deb` 软件包的状态，使用带有 `-s` 选项的 `dpkg`并将软件包名称（不是文件名）作为参数。这将告诉你软件包名称、安装状态、Debian“优先级”级别和部分。如果软件包已安装，`dpkg`\
  \ 还会提供描述和其他信息。\n\n⇒ 输出 `gimp1.2` 软件包的状态，输入：\n\n```\ndpkg -s gimp1.2\n```\nRET\n\n\
  ### A.4.6 列出 deb 软件包中的所有文件\n\n使用带有 `-L` 选项的 `dpkg` 列出系统中随你安装的特定软件包的所有文件。提供软件包名称（不是文件名）作为参数。\n\
  \n⇒ 浏览属于 `gimp1.2` 软件包的所有文件，输入：\n\n```\ndpkg -L gimp1.2\n```\nRET\n\n**注意：** 如果软件包未安装，`dpkg`\
  \ 会对此说明。\n\n\n\n\n\n### A.4.7 列出文件所属的 deb 包\n要确定一个文件属于哪个包，可以将该文件作为参数传递给带有 `-S` 选项的\
  \ `dpkg`。\n\n⇒ 要列出文件 `/bin/ls`的包名称，输入：\n\n```bash\ndpkg -S /bin/ls\n```\n\n### A.4.8\
  \ 列出 deb 包的依赖关系\n要查找一个 deb 包有哪些依赖项，使用带有 `-s` 选项的 `dpkg`，并将包名作为参数。然后使用 `grep` 显示包含“Depends”的行。这将输出该包运行所需的所依赖的其他包的列表。\n\
  \n⇒ 要列出 `gimp-1.2` 包的依赖关系，输入：\n\n```bash\ndpkg -s gimp-1.2 | grep Depends\n```\n\
  \n### A.5 管理 rpm 包\nRPM 软件包管理器\n\nRPM: `rpm`\n\nWWW: `http://www.rpm.org/`\n\n`rpm`，即\
  \ `rpm` 软件包管理器是 Red Hat 发行版以及许多其他流行的 Linux 发行版（包括 Mandrake 和 SuSE）的原生软件包格式。\n\n\
  你可以从 `http://rpmfind.net/` 和 `http://freshrpms.net/` 获取 rpm 包，这两个网站都是可搜索的软件包数据库。\n\
  \nrpm 包的管理通过命令行工具 `rpm` 完成；以下配方描述了它的用法。\n\n4 像 gnu 一样，这是一个递归缩写。\n\n附录 A：管理问题\n\n\
  #### A.5.1 列出 rpm 包\n使用带有 `-qa` 选项的 `rpm` 列出系统上安装的所有 rpm 包。\n\n你可以将此输出通过传递给 `grep`\
  \ 来搜索特定的包名。\n\n⇒ 这里有两种使用它的方法。\n\n• 要浏览系统上安装的所有 rpm 包，输入：\n\n```bash\nrpm -qa | less\n\
  ```\n\n• 要列出名称中包含字符串“gimp”的所有 rpm 包（不区分大小写），输入：\n\n```bash\nrpm -qa | grep -i gimp\n\
  ```\n\n要列出某个特定的包，请使用带有 `-q` 选项的 `rpm` 并提供包名。\n\n⇒ 要查看是否安装了 `gimp` 包，输入：\n\n```bash\n\
  rpm -q gimp\n```\n\n#### A.5.2 安装 rpm 包\n要安装 rpm 包，请使用带有 `-i` 选项的 `rpm` 并提供要安装的包名。\n\
  \n⇒ 要安装 `gimp-1.2.3-9.i386.rpm` 包，输入：\n\n```bash\nrpm -i gimp-1.2.3-9.i386.rpm\n\
  ```\n\n如果一个包未满足依赖关系，`rpm` 将不会安装它；如果已安装了当前或更高版本，它也不会安装该包。使用 `-i` 配合 `--nodeps` 标志可以在即使未满足依赖的情况下安装包。\n\
  \n⇒ 无论是否存在未满足的依赖，要安装 `gimp-1.2.3-9.i386.rpm` 包，输入：\n\n```bash\nrpm -i --nodeps gimp-1.2.3-9.i386.rpm\n\
  ```\n\n#### A.5.3 升级 rpm 包\n要升级 rpm 包，请使用 `-U` 选项并提供要安装的新版本包文件名。\n\n⇒ 要升级到 `gimp-1.2.3-10.i386.rpm`\
  \ 包，输入：\n\n```bash\nrpm -U gimp-1.2.3-10.i386.rpm\n```\n\n#### A.5.4 删除 rpm 包\n\
  要删除当前安装的 rpm 包，请使用 `-e`（“erase”）选项，并将包名（*不是*文件名）作为参数。\n\n⇒ 要删除 `gimp` 包，输入：\n\n\
  ```bash\nrpm -e gimp\n```\n\n如果其他包依赖于该包，`rpm` 将不会删除它；使用 `--nodeps` 可以覆盖此行为。\n\n\
  ⇒ 无论是否存在任何依赖关系，要删除 `gimp` 包，输入：\n\n```bash\nrpm -e --nodeps gimp\n```\n\n#### A.5.5\
  \ 获取 rpm 包的状态\n使用带有 `-q` 选项的 `rpm` 查看 rpm 包是否已安装。提供包名作为参数，而不是文件名。这会显示已安装包的版本号。\n\
  \n⇒ 要确定是否安装了 `gimp` 包，输入：\n\n```bash\nrpm -q gimp\n```\n\n要获取关于包的一些基本信息（包括简短描述），使用带有\
  \ `-qi` 选项的 `rpm` 并将包名作为参数。\n\n⇒ 要显示关于 `gimp` 包的一些信息，输入：\n\n```bash\nrpm -qi gimp\n\
  ```\n\n#### A.5.6 列出 rpm 包中的所有文件\n使用带有 `-ql` 选项的 `rpm` 列出属于 rpm 包的文件。将包名作为参数。\n\n\
  ⇒ 要列出 `gimp` 包包含的所有文件，输入：\n\n```bash\nrpm -ql gimp\n```\n\n#### A.5.7 列出文件所属的 rpm\
  \ 包\n要确定特定文件属于哪个包，将文件名作为参数传递给带有 `-qf` 选项的 `rpm`。\n\n⇒ 要列出文件 `/bin/ls`所属的包，输入：\n\n\
  ```bash\nrpm -qf /bin/ls\n```\n\n#### A.5.8 列出 rpm 包的依赖关系\n使用带有 `-qR` 选项的 `rpm`\
  \ 列出特定 rpm 包的依赖关系。将包名作为参数。\n\n⇒ 要列出 `gimp` 包的依赖关系，输入：\n\n```bash\nrpm -qR gimp\n\
  ```\n\n### A.6 管理用户\n本节描述了系统管理员在管理系统用户时需要执行的一些工作。所有这些命令必须由超级用户使用 root 账户运行——因为这些命令会编辑系统文件。\n\
  \n#### A.6.1 创建用户账户\n要创建新用户账户，请使用 `adduser`。它接受用户名作为新账户的参数。它会提示输入默认设置信息，包括用户的全名和使用的初始密码。\n\
  \n⇒ 要创建一个名为 `mary` 的新用户，输入：\n\n```bash\nadduser mary\n```\n\n**注意：** 默认情况下，用户主目录的名称将与用户名相同。例如，用户\
  \ `mary` 将拥有主目录 `/home/mary`。\n\n#### A.6.2 查看系统系统中存在哪些用户\n`/etc/passwd` 文件包含了系统上所有用户的列表，包括“特殊”用户，例如\
  \ *daemons*（守护进程），这些作为后台进程运行的系统程序，不对应于普通登录账户。\n\n文件中的信息是以每行一个用户的形式写入，每行由多个由冒号（`:`）分隔的字段组成。字段如下：用户名；加密后的密码（或者通常是“x”，表示系统使用了\
  \ *shadow* 密码文件来增加安全性）；用户 ID (`uid`)；组 ID (`gid`)；用户全名；主目录；以及登录时运行的 shell 或解释器。\n\
  \n要只输出用户名列表，可以通过 `cut` 进行过滤，提供冒号作为字段分隔符，并指定仅输出第一个字段。\n\n⇒ 这里有几种使用它的方法。\n\n• 要获取系统上所有用户的列表，输入：\n\
  \n```bash\ncut -d: -f1 /etc/passwd\n```\n\n• 要获取系统上所有用户全名的列表，输入：\n\n```bash\ncut\
  \ -d: -f5 /etc/passwd\n```\n\n• 要输出自己的全名，输入：\n\n```bash\ngrep id -u /etc/passwd\
  \ | cut -d ':' -f5 | cut -d* * -f1\n```\n\n**注意：** 这些示例非常适合 shell 脚本。\n\n#### A.6.3\
  \ 允许用户访问硬件外设\n某些硬件外设（如 CD 驱动器和声卡）通常需要超级用户权限才能访问。这些设备也有自己的*组*，因此普通用户也可以通过加入这些组来访问它们（参见配方\
  \ 6.1 [在用户组中工作]，第 163 页）。\n\n普通用户可能想要加入的组包括 floppy（软驱驱动器）、audio（声卡）以及 dialout 和\
  \ dip（调制调器拨出权限）。\n\n使用 `addgroup` 将用户添加到与硬件设备相关的组中。将要添加的用户名和要加入的组名作为参数。\n\n⇒ 将用户\
  \ `doug` 添加到 `audio` 组，输入：\n\n```bash\naddgroup doug audio\n```\n\n#### A.6.4 允许用户挂载驱动器\n\
  `/etc/fstab` 文件指定了系统中使用的文件系统的细节，包括可能通过软驱或 CD 驱动器挂载的文件系统。\n\n为了让用户在这些驱动器上挂载磁盘，请确保\
  \ `/etc/fstab` 中存在软驱和 CD 驱动器的行，每行都包含 `user` 标志，如图 A-1 所示（参见配方 A.1.3 [为某些设备指定挂载点]，第\
  \ 701 页）。\n\n\n\n\n\n以下配方描述了显示正在运行的系统信息的方法。\n\n# 附录 A：管理问题\n\n## A.7.1 显示系统运行时间\n\
  \n要查看系统已运行多久，请使用 `uptime` 工具。当你将其作为命令运行时运行时，它会输出当前时间、系统运行的时间、登录的用户数，以及过去 1、5 和 15\
  \ 分钟的系统“负载平均值”。\n\n⇒ 要查看系统运行了多久，请输入：\n\n```\nuptime\n3:34pm\nup 4:31,\n4 users,\n\
  load average: 0.01, 0.05, 0.07\n```\n\n要获取系统最近重启的时间和日期列表，请将 `reboot` 作为参数传递给 `last`（参见配方\
  \ 2.6.4 [列出用户上次登录的时间]，第 41 页）。\n\n⇒ 要输出系统重启的时间列表，请输入：\n\n```\nlast reboot\n```\n\
  \n**注意：** 一个能够长时间运行而不崩溃或冻死的操作系统是一个优秀的系统，因此对于许多 Linux 用户来说，拥有高 uptime 值是一件自豪的事。听到某些系统连续运行了几个月甚至几年的情况并不罕见——一位\
  \ Linux 管理员在互联网上报告了他的一个工作系统，该系统已经连续运行了三年没有重启！\n\n## A.7.2 显示 cpu 类型\n\n有几种方法可以显示\
  \ cpu 类型。\n\n### 方法 #1\n\n`/proc/cpuinfo` 文件包含有关系统中央处理器的信息，包括品牌、型号以及以 MHz 为单位的速度。使用\
  \ `cat` 输出该文件的内容。\n\n⇒ 要显示系统 cpu 信息，请输入：\n\n```\ncat /proc/cpuinfo\n```\n\n**注意：**\
  \ 这要求安装特殊的 `/proc` 文件系统，但这已经是 Linux 的标准长时间了。\n\n### 方法 #2\n\n你也可以使用 `uname` 输出系统的\
  \ cpu 处理器类型（如 i686、powerpc 等）；使用 `-m` 选项指定。\n\n⇒ 要输出系统的 cpu 处理器类型，请输入：\n\n```\n\
  uname -m\n```\n\n## A.7.3 显示内存使用\n\n使用 `free` 显示系统内存使用。它同时显示物理内存和交换内存，给出系统可用内存、已内存和空闲内存的值。输出以千字节（KB）为单位；使用\
  \ `-b` 以字节（byte）为单位，使用 `-m` 以兆字节（MB）为单位。`-t` 关还会显示系统中所有内存类型的总计列表。\n\n⇒ 要以兆字节输出当前系统内存使用报告，并带有一行计算出的总值，请输入：\n\
  \n```\nfree -m -t\n```\n\n## A.7.4 显示 Linux 版本\n\n使用 `uname` 工具查看你运行的是什么版本的 Linux。默认情况下，它输出操作系统的名称。\n\
  \n⇒ 要输出操作系统名称，请输入：\n\n```\nuname\n```\n\n使用 `-r` 选项输出操作系统发布版本。\n\n⇒ 要输出操作系统的发布版本，请输入：\n\
  \n```\nuname -r\n```\n\n`-a` 选项非常有用；它可以输出系统的*所有*信息，包括操作系统名称和发布版本、cpu 类型，以及操作系统的日期和版本以及机器主机名。\n\
  \n⇒ 要输出当前系统所有的 `uname` 信息，请输入：\n\n```\nuname -a\n```\n\n## A.7.5 显示发行版版本\n\n安装的发行版版本存储在\
  \ `/etc` 中的特定文件中，其名称取决于发行版。这些列在下表中。使用 `cat` 显示该文件的内容。\n\n| 路径 | 发行版 |\n| :--- |\
  \ :--- |\n| `/etc/debian-version` | Debian |\n| `/etc/fedora-release` | Fedora |\n\
  | `/etc/mandrake-release` | Mandrake |\n| `/etc/redhat-release` | Red Hat |\n| `/etc/SuSE-release`\
  \ | SuSE |\n| `/etc/slackware-version` | Slackware |\n\n⇒ 要输出 Fedora 系统上的发行版版本，请输入：\n\
  \n```\ncat /etc/fedora-release\n```\n\n# 附录 B：常规文件扩展名\n\n文件类型表示文件中数据的类型，通常为文本、图像、音频或二进制。你始终可以使用\
  \ `file` 来确定文件包含什么类型的数据（参见配方 8.1.1 [确定文件的类型和格式]，第 187 页）。\n\n下表列出了某些文件类型使用的典型文件名扩展（文件名中最后一个点之后的部分），识别了该扩展名用于什么类型的文件，并描述了特定的格式。\n\
