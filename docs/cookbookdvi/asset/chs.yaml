  \n![](img/index-455_1.jpg)\n\n第 18 章：编辑图像\n\n421\n\n**18. 编辑图像**\n\n当你获取一个图像文件（例如包含数字化照片或用图形程序绘制的图片）并对其进行更改时，你就是在*编辑*图像。\n\
  \n本章包含了编辑和修改图像的菜谱，包括图像格式之间的转换。它还概述了你可能需要的其他图像应用程序，包括功能强大的 gimp 图像编辑器。\n\n### 18.1\
  \ 转换图像\n\nImageMagick\n\nDEB: `imagemagick`\n\nRPM: `ImageMagick`\n\nWWW: `http://www.imagemagick.org/`\n\
  \n\n\n\n许多 Linux 工具可以以各种方式转换或处理图像。这里描述的是 ImageMagick 图像处理套件，其中 `mogrify` 工具特别适用于执行快速的命令行图像转换；可以使用它来更改图像的大小、旋转或减少图像中的颜色数量。\n\
  \n`mogrify` 工具始终将要处理的文件名作为参数，并将更改写入该文件。使用连字符 `-` 来指定标准输入，在这种情况下，`mogrify` 将输出写入到标准输出。\n\
  \n*图 18-1. phoenix.jpeg 图像。*\n\n![](img/index-456_1.jpg)\n\n422\n\n《Linux 菜谱》，第\
  \ 2 版\n\n在接下来的示例中，我将使用图 18-1 所示的 `phoenix.jpeg` 图像来让你了解如何使用 `mogrify`。\n\n**注意：**\
  \ 你还可以通过 `gimp` 交互地执行后续章节中描述的许多图像转换（参见食谱 18.3 [使用 Gimp 编辑图像]，第 434 页）；另一个用于转换图像和在图像格式之间转换非常有用的包是\
  \ `netpbm` 实用程序套件（参见食谱 19.2 [扫描图像]，第 443 页）。\n\n*图 18-2. 缩放到约为 480x320 像素的 phoenix.jpeg\
  \ 图像。*\n\n### 18.1.1 更改图像大小\n\n使用 `mogrify` 调整图像大小有三种方法，如下。\n\n**注意：** 缩放到更大尺寸的图像会出现颗粒或模糊。\n\
  \n![](img/index-457_1.jpg)\n\n423\n\n第 18 章：编辑图像\n\n要在不修改文件的情况下*查看*特定比例的图像，请使用 `display`；当你调整窗口大小时，只调整了屏幕上的图像，除非你选择保存它（参见食谱\
  \ 4.3.2 [调整 X 窗口]，第 106 页）。\n\n*图 18-3. 恰好缩放到 640x480 像素的 phoenix.jpeg 图像。*\n\n\
  #### 方法 #1\n\n要调整图像大小但保持其*宽高比*（即宽和高的比例保持不变），请使用带有 `-geometry` 选项的 `mogrify`，并提供理想的像素宽度和高度作为参数。\n\
  \n*⇒ 要将 `phoenix.jpeg` 调整为 480x320 像素，输入：`$ mogrify -geometry 480x320 phoenix.jpeg`\n\
  \nRET\n\n![](img/index-458_1.jpg)\n\n424\n\n《Linux 菜谱》，第 2 版\n\n此命令将原始的 `phoenix.jpeg`\
  \ 文件转换为尽可能接近 480x320 像素大小的图像，同时保留其原始宽高比，如图 18-2 所示。\n\n#### 方法 #2\n\n要将图像调整为特定尺寸而不一定保留其宽高比，请使用带有\
  \ `-geometry` 选项的 `mogrify`，并在提供的几何值参数末尾添加一个感叹号（`!`）。\n\n*⇒ 要无论宽高比如何，将 `phoenix.jpeg`\
  \ 调整为*恰好* 640x480 像素，输入：\n\n`$ mogrify -geometry 640x480! phoenix.jpeg`\n\nRET\n\
  \n此命令将原始的 `phoenix.jpeg` 转换为恰好为 640x480 像素的图像，而不尝试保留原始的宽高比，如图 18-3 所示。\n\n*图 18-4.\
  \ 按比例缩放的 phoenix.jpeg 图像。*\n\n#### 方法 #3\n\n你还可以通过按百分比指定宽度或高度来 `mogrify` 缩放图像。要*减少*百分比，请给出数值后加百分号（`%`）。要*增加*百分比，请给出数值加\
  \ 100 后加百分号。例如，要增加 25%，请给出“125%”。\n\n![](img/index-459_1.jpg)\n\n425\n\n第 18 章：编辑图像\n\
  \n*⇒ 要将 `phoenix.jpeg` 的高度增加 25% 宽度减少 50%，输入：\n\n`$ mogrify -geometry 125%x50% phoenix.jpeg`\n\
  \nRET\n\n此命令将原始的 `phoenix.jpeg` 转换为高度增加 25 宽度增加 50% 的图像，如图 18-4 所示。\n\n### 18.1.2\
  \ 旋转图像\n\n要旋转图像，请使用带有 `-rotate` 选项的 `mogrify`，后跟要旋转的角度数。如果图像宽度超过高度，则在该数字后跟一个“>”；如果高度超过宽度，则在其后跟一个“<”。（由于\
  \ `<` 和 `>` 都是 shell 重定向运算符，请将此参数括在引号中，如果图像高宽相同，则省略其中一个。）\n\n*⇒ 将高度大于宽度的 `phoenix.jpeg`\
  \ 旋转 90 度，输入：\n\n`$ mogrify -rotate '90<' phoenix.jpeg`\n\nRET\n\n此命令将原始的 `phoenix.jpeg`\
  \ 旋转 90 度，如图 18-5 所示。\n\n*图 18-5. 旋转后的 phoenix.jpeg 图像。*\n\n**注意：** 执行此命令后，`phoenix.jpeg`\
  \ 的宽度现在超过了高度，因此再次旋转时请使用 `>` 而不是 `<`。\n\n### 18.1.3 调整图像颜色\n\n你可以使用 `mogrify` 对图像的颜色进行调整。要减少颜色数量，请使用\
  \ `-colors` 选项，后跟使用的数字。\n\n![](img/index-460_1.jpg)\n\n![](img/index-460_2.jpg)\n\
  \n426\n\n《Linux 菜谱》，第 2 版\n\n*⇒ 要将 `phoenix.jpeg` 的颜色减少到两种，输入：`$ mogrify -colors\
  \ 2`\n\nRET\n\n此命令将原始的 `phoenix.jpeg` 转换为黑白图像，如图 18 所示。\n\n*图 18-6. 黑白的 phoenix.jpeg\
  \ 图像。*\n\n*图 18-7. 黑白的 phoenix.jpeg 图像。*\n\n使用 `-dither` 选项在减少颜色期间提高图像质量。\n\n*⇒\
  \ 要将 `phoenix.jpeg` 的颜色减少到四种并应用 Floyd-Steinberg 抖动扩散算法，输入：*\n\n`$ mogrify -colors\
  \ 4 -dither phoenix.jpeg`\n\nRET\n\n此命令将原始的 `phoenix.jpeg` 转换为抖动处理过的黑白图像，如图 18 所示。\n\
  \n带有第二个文件名作为参数的 `-map` 选项，从第二个图像读取*颜色映射*（颜色集）并将其用于第一个图像。\n\n*⇒ 要将 `phoenix.jpeg`\
  \ 中的颜色更改为 `prism.jpeg` 中使用的颜色，输入：*\n\n`$ mogrify -map prism.jpeg phoenix.jpeg`\n\
  \nRET\n\n使用 `-monochrome` 选项将彩色图像变为黑白。\n\n*⇒ 将彩色图像 `phoenix.jpeg` 变为黑白，输入：*\n\n\
  `mogrify -monochrome phoenix.jpeg`\n\nRET\n\n如果你有一个 ppm 文件，可以使用 `ppmquant` 对图像中的颜色进行*量化*或减少到指定的数量——详情请参见\
  \ `ppmquant` 帮助页（参见食谱 2.8.4 [从系统手册中读取页面]，第 46 页）。\n\n由于显示硬件的差异，图像的亮度在不同计算机系统之间可能会不同。例如，在\
  \ Macintosh 上创建的图像在其他系统上通常看起来更暗。当你调整图像亮度时，这被称为*伽马校正*。\n\n要调整图像亮度，请将要应用的数值校正级别作为\
  \ `-gamma` 选项的参数。大多数 PC 显示器的伽马值为 2.5，而 Macintosh 显示器的伽马值较低，为 1.4。\n\n*⇒ 要将图像 `phoenix.jpeg`\
  \ 的伽马校正设置为 .8，输入：*\n\n`$ mogrify -gamma .8 phoenix.jpeg`\n\nRET\n\n### 18.1.4 为图像添加注释\n\
  \n有几种方法可以读取和写入图像文件中的注释。这种做法对于为图像添加版权声明或用 URL 标注图像文件很有用。并非所有的格式都支持注释；jpeg 是最流行的。\n\
  \n在查看图像时不会看到注释；它被添加到文件的图像头部。然而，你可以使用显示图像文件信息的工具（如 `display` 或 `gimp`）读取图像注释。\n\n\
  下文描述另一种输出注释文本的方法。\n\n#### 方法 #1\n\n使用 `wrjpgcom` 在 jpeg 文件中写入注释。将注释作为 `-comment`\
  \ 选项的参数括起来，并将输入文件名作为参数。默认向标准输出写入新的 jpeg 文件。\n\n\n\n\n\n*⇒ 若要在文件 `map.jpeg` 中的图像添加注释“Map\
  \ not drawn to full scale”并将其写入文件 `warnmap.jpeg` 中，请输入（全部写在一行）：\n\n```\n$ wrjpgcom\
  \ -comment \"Map not drawn to full scale\"\n```\n\n`map.jpeg` > `warnmap.jpeg`\n\
  \nRET\n\n使用 Bash 的 for 循环对一组文件执行相同的注释（有关此内置命令的更多信息，请参阅 Bash 信息文档）。\n\n*⇒ 若要为当前目录下所有的\
  \ `.jpg` 文件添加注释“Image courtesy Rick Blaine”，并将其写入具有相同基本文件名但扩展名为 `.jpeg`的新文件中，请输入：\n\
  \n```bash\n$ for i in *.jpg\n{\n  wrjpgcom -comment \"Image courtesy Rick Blaine\"\
  \ \"$(basename $i).jpeg\"\n}\n$\n```\n\n上一个示例也可以写在单行输入中，省略 `for` 循环，如下所示：\n\n```bash\n\
  for i in *.jpg; { wrjpgcom -comment \"Image courtesy Rick Blaine\" \"$(basename\
  \ $i).jpeg\"; }\n```\n\nRET\n\n## 方法 #2\n\n使用 `mogrify` 配合 `-comment` 选项为图像文件添加注释。将引号中的注释作为该选项的参数。\n\
  \n*⇒ 若为图像文件 `phoenix.jpeg` 添加注释，请输入（全部写在一行）：\n\n```bash\n$ mogrify -comment \"If\
  \ you can read this, you're too close!\" phoenix.jpeg\n```\n\nRET\n\n![](img/index-463_1.jpg)\n\
  \n## 方法 #3\n\n要读取 `jpeg` 文件中的注释，请使用 `rdjpgcom` 工具——它输出作为参数提供的 `jpeg` 文件中的任何注释。\n\
  \n*⇒ 若要读取图像文件 `phoenix.jpeg` 中的任何注释，请输入：\n\n```bash\n$ rdjpgcom phoenix.jpeg\n```\n\
  \nRET\n\nIf you can read this, you're too close!$\n\n## 18.1.5 为图像添加边框\n\n要在图像周围绘制边框，请使用\
  \ `mogrify` 配合 `-border` 选项，后面跟所需的边框宽度和高度（像素）。\n\n*⇒ 若为 `phoenix.jpeg` 添加一个宽两像素高四像素的边框，请输入：\n\
  \n```bash\n$ mogrify -border 2x4 phoenix.jpeg\n```\n\nRET\n\n此命令将原始的 `phoenix.jpeg`\
  \ 转换为具有 `2x4` 像素边框的图像，如图 18-8 所示。\n\n*图 18-8。带有边框的 phoenix.jpeg 图像。*\n\n`-frame`\
  \ 选项的作用类似于 `-border`，但它为图像添加一个更具装饰性的边框。\n\n*⇒ 若为 `phoenix.jpeg` 添加一个宽八像素高八像素的装饰性框架，请输入：\n\
  \n```bash\n$ mogrify -frame 8x8 phoenix.jpeg\n```\n\nRET\n\n![](img/index-464_1.jpg)\n\
  \n此命令将原始的 `phoenix.jpeg` 转换为具有 `8x8` 装饰性框架的图像，如图 18-9 所示。\n\n*图 18-9。带有装饰框的 phoenix.jpeg\
  \ 图像。*\n\n**注意：** 边框或框架被添加到现有图像的外部；不会裁剪或缩小图像尺寸来添加边框。\n\n## 18.1.6 创建图像蒙太奇\n\n要制作多个图像的蒙太奇，请使用\
  \ `montage`。它的参数是要使用的图像名称，随后是写入蒙太奇图像输出文件名。\n\n蒙太奇图像是通过将所有输入图像缩放以适应尽可能大的尺寸（最高 `120x120`\
  \ 像素），并将这些图像按五行四列进行平铺而成的。\n\n*⇒ 若从文件 `owl.jpeg`、`thrush.jpeg` 和 `warbler.jpeg` 创建蒙太奇并写入\
  \ `ohio-birds.png`，请输入：\n\n```bash\n$ montage owl.jpeg thrush.jpeg warbler.jpeg\
  \ ohio-birds.png\n```\n\nRET\n\n**注意：** 在此示例中，读取了三个 `jpeg` 并输出到一个 `png` 文件；要指定输出使用的格式，请在输出文件名提供相应的扩展名。\n\
