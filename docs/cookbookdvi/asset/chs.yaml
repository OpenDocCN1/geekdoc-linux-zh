  \ Ronda Hauba，`网民：网络的历史与影响`，`ieee Computer Society Press`，1997 年。一部详尽的网络社会史，贯穿其中许多关于\
  \ `unix` 历史的内容。[http://www.columbia.edu/~hauben/netbook/]\n\n\n\n\nKernighan, Brian\
  \ W. and Rob Pike, *The Unix Programming Environment*, Prentice Hall Computer Books,\
  \ 1984.\n\n描述了 unix 的工具哲学以及它为程序员提供的便利。\n\n[http://cm.bell-labs.com/cm/cs/upe/]\n\
  \nSalus, Peter H., *A Quarter Century of UNIX*, Addison-Wesley, 1994. unix 操作系统的完整历史。\n\
  \nWalker, A.N., *The UNIX Environment*, John Wiley and Sons Ltd., 1984. 一次对系统的愉快之旅；其在如此老旧的设备上运行的事实恰恰证明了工具的韧性。\n\
