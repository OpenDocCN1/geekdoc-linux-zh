  md: '# 136 ■ Mastering Perl


    Person A examines the data in the file. Closes it and begins editing the data
    (finishing the first file).


    Meanwhile, Person B opens the file to inspect/read it and discovers it is empty.


    That is a collision! The entire system will disrupt.


    # SOLUTION


    This is where file locking is implemented. Person A, Person B, and Person C are
    willing to commit to the document.


    Person A opens the file, examines its data, and then closes it (shared lock enabled)
    (unlocking the file). Person A then wants to commit changes to the file and re-opens
    the file to make adjustments (this is when the exclusive lock comes into action).
    While Person A is making changes to the file, neither Person B nor person C can
    read or write from the file.


    Person A completes his work and closes the file (unlocking it).


    Person B would have received the error "File being viewed by another candidate"
    if they attempted to open the file in the interim. Consequently, there is no reading
    on one another''s toes, and the work flows smoothly.


    ```

    flock() vs lockf()

    ```


    In contrast to flock(), which locks entire files at once, the lockf() method locks
    fragments of a file. lockf() cannot be used directly in Perl, but Perl natively
    supports the file system function but does not apply to network locks.


    Perl supports fcntl() system function, providing the most excellent locking controls.


