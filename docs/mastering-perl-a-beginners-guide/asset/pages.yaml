    ~ (Complement operator) is a unary operator that acts as a bit flipper. Its job
    is to reverse the bits and return the result in 2''s complement due to a signed
    binary number.


    (<<)Binary left shift operator accepts two integers, shifts the bits of the first
    operand, and the second operand determines the number of places to shift. The
    left operand is multiplied by the number of times the right operand provides.
    As an example:


    ```

    $x = 70;

    $z = $x << 2;

    print $z;

    ```


    Output: 280


    Explanation:

    70 * 2 = 140 --- (1)

    140 * 2 = 280 --- (2)


    (>>)Binary right shift operator takes two numbers, right shifts the bits of the
    first operand, and the second operand determines the number of places to shift.
    It divides the left operand by the number of times provided by the right operand.
    As an example:


    ```

    $x = 80;

    $z = $x >> 2;

    ```'
