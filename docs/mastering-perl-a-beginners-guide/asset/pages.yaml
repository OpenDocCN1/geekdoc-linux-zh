    # PERL print() AND say() METHODS


    Perl evaluates input provided by the user or presented as Hardcoded input in the
    code using statements and expressions. Because it has been evaluated in the compiler,
    this evaluated expression will not display to the programmer. Perl employs the
    print() and say() functions to display the evaluated expression. These routines
    can show whatever parameters are supplied to them.


    print() Operator


    The print() operator in Perl is used to print the values of expressions in a List
    supplied to it as an input. The print operator returns anything passed to it as
    an argument'
