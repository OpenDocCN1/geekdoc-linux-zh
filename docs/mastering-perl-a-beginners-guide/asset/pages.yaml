- img_proc: true
  md: "A subroutine or function with a defined signature can only accept arguments\
    \ of the type specified in its signature. An error will occur if the inputs given\
    \ to the procedure do not match its signature. A function signature reveals a\
    \ great deal about the subroutine type. It allows the user to create subroutines\
    \ with the same name but distinct signatures, i.e. different arguments. Different\
    \ subroutines may have the same name in Perl, but their arguments must be distinct.\n\
    \n# Example:\n\n```\nsub examplefunc($variable)\n{\n    statement;\n}\nsub examplefunc($variable1,\
    \ $variable2)\n{\n    statement;\n}\n```\n\nIn the above code, the names of the\
    \ subroutines are identical, but their parameter counts are distinct; as a result,\
    \ they are not deemed to be distinct subroutines, and our Perl code will not raise\
    \ an error.\n\nPassing Parameters of a Type other than Specified in the Signature\
    \ When a subroutine is defined with a signature, it must take arguments of the\
    \ same type as its signature. If an argument differs from the function signature\
    \ given, an error will be generated, causing the code compilation to fail.\n\n\
    # Example:\n\n```\n#!/usr/bin/perl\n\n# Defining the Function Signature\nsub example(Int\
    \ $variable)\n{\n    return $variable / 2;\n}\n\n# Function-Call\nprint example(66)\n\
    ```"
  merge: -1
