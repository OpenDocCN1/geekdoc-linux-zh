    in allocating memory and deciding what to store in reserved memory. Variables
    can hold old integers, decimals, or texts by assigning multiple data types to
    the variables.


    Naming of a Variable


    With the usage of a certain data type, a variable in Perl can be called anything.
    When naming a variable, there are various guidelines to follow:


    +   - Perl variables are case-sensitive.


    Example:


    $Seema and $seema are two different variables


    +   - According to the data type, it begins with $, @, or % and is followed by
    zero or more letters, underscores, and digits.


    +   - Variables in Perl are not permitted to contain white spaces or any special
    character other than underscore.'
