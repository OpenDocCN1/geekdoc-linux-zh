  md: '# 146 ■ Mastering Perl


    3. Global character regular expression for transliteration: To replace all instances
    of a character with a single character, use the translation or transliteration
    operator "tr///" or "y///"; The delimiter is the forward slash used inside the
    operator (tr/// and y///).


    # Syntax:


    ```

    tr/SEARCHLIST/REPLACEMENTLIST/

    y/SEARCHLIST/REPLACEMENTLIST/

    ```


    SEARCHLIST is the character, the occurrences of which will be replaced with the
    character in REPLACEMENTLIST.

    Let''s look at a few instances of translation Regex.

    All instances of "G" in the following examples are replaced with "g" using two
    separate operators "tr///" and "y///".


    # First example:


    ```

    #/user/bin/perl


    # Initialising string

    $string = ''PeeksforPeeks'';


    # Calling tr/// operator

    $string =~ tr/P/p;


    # Printing replaced string

    print "$string\n";

    ```


    # Second example:


    ```

    #/user/bin/perl


    # Initialising string

    $string = ''PeeksforPeeks'';


    # Calling y/// operator

