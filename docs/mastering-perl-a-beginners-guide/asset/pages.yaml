    Exiting from a Script


    Exit() evaluates the passed expression and exits the Perl interpreter, returning
    the value as the exit value. The exit() function does not always immediately exit
    but calls the program''s end routines before terminating it. If no expression
    is passed to exit function, the default value is 0. The exit() function has limited
    uses and should not be used to exit from a subroutine. To exit a subroutine, use
    die or return.


    # Syntax:


    ```

    exit(value)

    ```


    Parameter: value which is to return on function call


    Returns: value passed to it or 0 if the function is called without an argument


    # Example:


    ```

    # Getting user''s bid for

    # an online auction

    print "Enter bid";

    $bid = <STDIN>;

    ```'
