    # Why Do Override Methods?


    As noted before, overridden methods enable Perl to offer polymorphism at runtime.


    Polymorphism is crucial to OOP for the following reason: it enables a base class
    to describe methods that will share all of its descendants, while subclasses define
    the particular implementation of any or all of those methods. Perl also provides
    the "one interface, several methods" element of polymorphism through overridden
    methods.


    Dynamic dispatch (runtime polymorphism) is one of object-oriented architecture''s
    most effective strategies for code reuse and resilience. The ability to exist
    code libraries to call methods on instances of new classes without recompilation
    while preserving a clean abstract interface is a potent instrument.


    Overridden methods enable us to invoke methods of any derived class without knowing
    the object type of the derived class. Thus, method-simplifying programming instead
    of memorizing names when developing new methods; instead, it is more necessary
    to remember the processes inside the Method.


    # INHERITANCE IN OOPs


    Inheritance is a class'' ability to extract and use the characteristics of another
    class. It is the process of creating new classes, known as Derived classes, from
    existing classes, known as Base classes. The essential idea is that the programmer
    may utilize the characteristics of one class in another without declaring or defining
    the same item several times across classes.


    We inherit the member functions from the base class instead of writing them in
    each class declaration. Inheritance is one of OOP''s essential features.


    Subclass: A subclass or Derived class is a class that inherits properties from
    another class.


    Superclass: The class whose attributes are inherited by subclasses known as the
    Superclass or Base Class.


    The most basic principle of inheritance is the creation or derivation of a new
    class from another class.'
