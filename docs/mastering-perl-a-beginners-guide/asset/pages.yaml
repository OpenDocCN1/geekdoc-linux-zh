    # REGEX "ee" MODIFIER


    The regular expression in Perl allows you to execute numerous actions on a given
    text using appropriate operators. These operators can execute operations such
    as string modification, substituting substrings, and so on. Substitution of a
    string in a given string is accomplished with the "s" (substitution) operator,
    which accepts two operands: the string to be replaced and the replacement text.


    ```

    s//To_replaced/Replacement/

    ```


    In Perl, modifiers match a string with a specified pattern using a regular expression.
    In Perl, the "ee" modifier is equivalent to the "e" modifier. It is used to evaluate
    the string on the right and then to assess the result further. In Perl, it is
    equivalent to the double "eval" operator. The "e" operator is used to evaluate
    a string on the right. "ee" is one step ahead of it. It uses the "e" operator
    on a string that already has the "e" operator.


    The "ee" modifier, like the "e" modifier, can be combined with the "g" (globally)
    modifier to apply modifications to all possible substrings in the provided string.


    # Example:


    ```

    #!/usr/bin/perl

    my $var = ''for'';

    ```'
