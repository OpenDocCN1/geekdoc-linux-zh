  md: '# Regular Expressions in Perl ■ 159


    # "e" MODIFIER IN REGULAR EXPRESSION


    The regular expression in Perl allows us to execute numerous actions on a given
    text using appropriate operators. These operators can execute operations such
    string modification, substituting other substrings, and so on. Substitution of
    a substring in a given string is accomplished with the "s" (substitution) operator,
    which accepts two operands: the substring to be replaced and the replacement string.


    ```

    s/To_be_replaced/Replacement/

    ```


    Furthermore, the "e" modifier is used to replace the substring with a replacement
    string that is a regular expression to be evaluated. The "e" modifier is added
    to the substitution expression.


    ```

    s/To_be_replaced/Regular_Expression/e;

    ```


    The "e" modifier can also use with the "g" (globally) modifier to affect all possible
    substrings in the specified string.


    **First example:** Substitution using a character class


    ```

    #!/usr/bin/perl

    ```


    ```

    # Defining string to be converted

    $String = "Peeks for the best";

    print "The Original String: $String\n";n

    # Converting string to UPPERCASE

    # using ''uc'' Function

    $String ~ s/(\w+)/uc($1)/ge;

    print "Uppercased String: $String\n";n

    # Converting string to lowercase

    # using ''lc'' Function

    $String ~ s/(\w+)/lc($1)/ge;

    print "Lowercased String: $String\n";

    ```


    The above code uses the character class "w", which contains the lower and upper
    case alphabets and all digits ([a-zA-Z0-9]). This is used to replace the entire
    string with a single replacement operation.'
