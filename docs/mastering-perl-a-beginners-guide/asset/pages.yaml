    # INTRODUCTION OF FILE HANDLING


    A FileHandle in Perl connects a name to an external file that can use until the
    program terminates or the FileHandle is closed. In summary, a FileHandle is a
    connection that can be used to edit the contents of an external file, and the
    connection (the FileHandle) is given a name for easier access and convenience.'
