  md: '# Object-Oriented Programming in Perl ■ 179


    2. **Object**: It is a fundamental unit of OOPs that represents real-world entities.
    A typical Perl program generates many objects, which interact by invoking methods.
    An object is made up of:


    +   - State: State is represented by an object''s attributes. It also reflects
    an object''s properties.

    - Behavior: Behavior is represented by an object''s methods. It also reflects
    an object''s interaction with other objects.

    - Identity: It gives an object a unique name and allows one object to interact
    with other objects.


    **Example**: A dog is an example of an object.


    3. **Method**: A method is a group of statements that perform a task and return
    the result to the caller. A method can complete a task without returning anything.
    Methods save time by allowing us to reuse code without having to retype it.


    4. **Polymorphism**: Polymorphism refers to the ability of OOPs programming languages
    to distinguish between entities with the same name efficiently. Perl accomplishes
    this through the use of these entities'' signatures and declarations.


    Polymorphism in Perl is primarily of two types:


    +   - Perl overloading

    - Perl overriding


    5. **Inheritance**: An essential pillar of OOP is inheritance (object-oriented
    programming). It is the mechanism in Perl that allows one class to inherit the
    features (fields and methods) of another.

    Important terms to remember:


    +   - Superclass: A subclass is a class with inherited characteristics a base
    class or a parent class.

    - Subclass: It is a class that derives from the another (or derived class, extended
    class, or child class). The subclass can add its fields and methods to those of
    the superclass.

    - Reusability: Inheritance promotes “reusability,” which means that if we want
    to create new class and there is already class that includes some of the code
    we want, we can derive our new class'
