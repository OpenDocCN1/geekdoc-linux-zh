    \ these issues by making use of references.\n\n# FUNCTION SIGNATURE IN PERL\n\n\
    A Perl function or subroutine is a collection of statements that perform a specific\
    \ task. Every programming language user wishes to reuse code. The user places\
    \ the code section in a function or subroutine to avoid having to write the code\
    \ repeatedly. Although the terms function, subroutine, and method are interchangeable\
    \ in Perl, they are not in other programming languages. Because it is created\
    \ with the keyword sub, the subroutines are commonly used in Perl programming.\
    \ When a function is called, Perl stops executing its entire program and jumps\
    \ to the function to execute it before returning to the section of code that was\
    \ previously running. The return statement can be avoided.\n\n# Defining Subroutines\n\
    \nIn Perl, the general form of defining a subroutine is as follows:\n\n```\nsub\
    \ subroutinename\n{\n    # body of the method or subroutine\n}\n```\n\n# Function\
    \ Signature\n\nWhen a function is constructed, a set of parameters is also provided\
    \ inside the parenthesis to specify the sort of arguments the function will receive\
    \ on its call. This function signature may include one or several arguments."
