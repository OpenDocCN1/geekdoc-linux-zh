  md: '# Mastering Perl


    The locking of a file is performed at the system level; thus, the user need not
    be concerned with the specifics of applying the lock. The purpose of file locks
    is to put temporary limitations on certain files to limit how they may share between
    programs. Two sorts of locks are developed based on the nature of a given operation.


    A shared lock is the first kind, whereas an exclusive lock is the second. Multiple
    processes may share read access to a file since read access does not alter the
    shared resource''s state. Therefore, keeping a consistent picture of the shared
    resource is possible. The flock command may use in Perl to lock files.


    ```

    flock()

    ```


    flock() has two arguments. The FileHandle is the first. The second input specifies
    the locking procedure that is required.


    # Syntax:


    ```

    flock [FILEHANDLE], [OPERATION]

    ```


    OPERATION is a number value that might be 1, 2, 4, or 8.

    These numerical values have many meanings and are used to execute various operations
    as:


    ```

    LOCK_SH

    LOCK_EX

    LOCK_NB

    LOCK_UN

    ```


    Perl employs to represent values:


    ```

    sub LOCK_SH { 1 } ## set as the shared lock

    sub LOCK_EX { 2 } ## set as the exclusive lock

    sub LOCK_NB { 4 } ## set the lock without any blocks

    sub LOCK_UN { 8 } ## unlock FILEHANDLE

    ```


    +   **Shared Lock:** A shared lock can be used when we just want to read a file
    while allowing others to view it. Shared lock not only creates a lock, but it
    also checks for the presence of additional locks. This lock does not cover the
    existence check for all locks, just the “Exclusive Lock.” If an exclusive lock
    is present, it will wait until the lock is'
