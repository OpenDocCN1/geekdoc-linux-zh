    ```

    print "$string1"

    print "$string2";

    ```


    The above example uses the print function to print both strings, but they are
    written on the same line. To avoid this and print them on distinct lines, we must
    use the "\n" operator, which changes the line whenever it is used.


    Example:


    ```

    #!/usr/bin/perl -w


    # Defining a string

    $string1 = "Peeks For Peeks"

    $string2 = "Welcome all";

    ```


    ```

    print "$string1\n"

    print "$string2";

    ```


    If we use single quotes instead of the double quotes, the print() method will
    not output the values of variables or the escape characters used in the statement,
    as "\n". These characters will be printed in their entirety and will not be evaluated.


    ```

    print ''$string1\n''

    print ''$string2'';

    ```'
