  md: "multiple subroutines with the same name without generating an error. This can\
    \ be defined by varying the arity of each subroutine with the same name.\n\nSubroutine\
    \ arity: Perl subroutines can have the same name as long as they have a different\
    \ set of arguments. The number of arguments a subroutine has is referred to as\
    \ its arity. These arguments could be of a different data type or not. The Perl\
    \ program will not generate an error as long as the number of subroutines differs.\n\
    \n# Use of the \"multi\" Keyword\n\nThe keyword \"multi\" can use to create multiple\
    \ subroutines in Perl. This is useful for creating multiple subroutines with the\
    \ same name.\n\n# Example:\n\n```\nmulti Func($var){statement};\nmulti Func($var1,\
    \ $var2){statement-1};\nstatement-2};\n```\n\nMultiple subroutines are commonly\
    \ used to create built-in functions and most operators in a programming language\
    \ such as Perl. The program’s complexity is reduced by not using different names\
    \ for each other subroutine. Whatever code statement is required, simply pass\
    \ the number of arguments for that function, and the work will be completed. In\
    \ this case, compiler will select the version of the subroutine, the function\
    \ signature of which matches the one invoked.\n\nVarious programs, such as factorial\
    \ of a number, Fibonacci series, and so on, require the use of more than function\
    \ to solve the problem. The use of multiple subroutines will aid in the reduction\
    \ of the complexity of such programs.\n\n**First example:** Fibonacci series sum\n\
    \n```\n#!/usr/bin/perl\n# Program to print sum of the fibonacci series\n\n# Function\
    \ for the $n = 0\nmulti Fibonacci_func(0)\n{\n  1; # returning 1\n}\n```"
