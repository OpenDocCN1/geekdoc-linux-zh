  md: "subroutine gets a value rather than a variable when a parameter is supplied\
    \ to the function through the caller function. Consequently, any modifications\
    \ to the function parameter are not reflected.\n\nPerl's subroutine parameters\
    \ are immutable by default, meaning they cannot modify inadvertently alter the\
    \ arguments of the calling function. In specific programming languages, this is\
    \ referred to as \"call by value,\" which indicates that the subroutine being\
    \ called gets a value rather than the variable, so the parameters of the calling\
    \ function are not altered.\n\n# Example:\n\n```\n#!/usr/bin/perl\n\n# Function-Definition\n\
    sub Func (Int $variable)\n{\n    # Operation to perform\n    $variable /= 2;\n\
    }\n```\n\n```\n# Defining local variable\nmy $value = 40;\n```\n\n```\n# Function\
    \ Call with the local variable\nprint Func($value);\n```\n\nTraits are used to\
    \ change the properties of these parameters. The value of a parameter can be changed\
    \ within a subroutine using traits.\n\nTraits\n\nThese are predefined built-in\
    \ subroutines that alter the method's behavior when run at compile time when used\
    \ within a method. Traits can even be used to modify the method's body or tag\
    \ the method with metadata.\nDepending on their usage, traits can be of various\
    \ types, such as:\n\n+   - is cached trait automatically caches the function's\
    \ return value based on the arguments passed to it.\n- is rw trait enables writable\
    \ accessors to subroutine parameters."
