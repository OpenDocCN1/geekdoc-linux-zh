    Concepts of OOP''s.


    Let us look at the various features of an OOPs language:


    +   1. **Class**: A class is a user-defined blueprint or prototype to create objects.
    It represents a set of properties or methods shared by all objects of the same
    type. In general, class declarations can include the following components in the
    following order:


    +   * Class name: The name of the class should begin with an initial letter (capitalized
    by convention).


    +   * Superclass (if any): If applicable, the name of the class''s parent (superclass),
    preceded by the keyword “use”.


    +   * Constructors (if any): Perl subroutine constructors return an object that
    is an instance of the class. The constructor is usually named “new” in Perl.


    +   * Body: The class body is surrounded by braces {}.'
