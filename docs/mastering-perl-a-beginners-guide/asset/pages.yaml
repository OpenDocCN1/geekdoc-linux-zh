  md: 'The GNU General Public License offers its users free and open-source software.
    Any program derived from GNU-licensed source code must use the same license.


    According to the Artistic license, a package derived from Perl must clearly highlight
    its modifications. The original module, as well as the derived one, should be
    distributed. Above all, the original author must be acknowledged as the package''s
    owner. Users should be able to distinguish between original and derived modules.


    # PERL AND THE WEB


    Because of its text manipulation capabilities and quick development cycle, Perl
    was once the most popular web programming language.


    Perl is commonly referred to as “the duct tape of the Internet.”


    Perl is capable of processing encrypted Web data, including ecommerce-transactions.


    Perl can be embedded in web servers to speed up processing by up to 2000%.


    The Perl mod enables the Apache web server to include a Perl interpreter.


    Perl’s DBI package simplifies web-database integration.


    # PERL IS INTERPRETED


    Because Perl is an interpreted language, our code can run without being compiled
    into a non-portable executable program.


    Traditional compilers translate programs into machine code. When you run a Perl
    program, it is first compiled into byte code, which is then converted into machine
    instructions (as the program runs). As a result, it differs from shell or Tcl,
    which are strictly interpreted without an intermediate-representation.


    It’s unlike most C or C++ versions, which are compiled directly into machine-dependent
    formats. It is in the middle, alongside Python, AWK, and Emacs. etc files.


    # ADVANTAGES


    Perl has the following advantages:


    +   - Options: Perl users have numerous options for writing programs or solving
    problems.'
