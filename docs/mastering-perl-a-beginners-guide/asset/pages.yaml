    # CSV FILE READING


    Perl was originally intended for text processing, such as extracting information
    from a text file and converting it to a new format. In Perl, reading a text file
    is a pretty frequent activity. For example, reading CSV (comma-separated) files
    to extract data and information is a common task.

    A CSV file can be created using any text editor, such as notepad, notepad++, or
    others. After adding material to a notepad text file, save it as a CSV file with
    the .csv extension.


    A CSV file example:


    | | A | B | C | D |

    |---|---|---|---|---|

    | 1 | Danish | M | | 18 |

    | 2 | Jaipur | M | | 20 |

    | 3 | Emma | F | | 21 |

    | 4 | | | | |

    | 5 | | | | |


    CSV file example.


    A CSV file can be used to handle database record files for an enterprise organization.
    These files can be opened with ease in Excel and can be edited with any compatible
    application. Perl also enables processing and construction of these "csv" files
    by extracting values from the file, modifying these values, and inserting the
    modified values back into the file. We will use the split function to extract
    every value from a particular line.


    Use of Split() for Data Extraction


    split() is a standard Perl function used to divide a string into sections using
    a delimiter. This delimiter can be any character specified by the user; however,
    we usually use a comma.

    split() accepts two arguments. The first is a delimiter, and the second is the
    string to be divided.'
