    Database Independent Interface


    DBI, as the name implies, provides an independent interface for Perl programs.
    This means the Perl code is not dependent on the database that is running in the
    backend. The DBI module provides abstraction, which allows us to write code without
    worrying about the database that runs in the backend


    To import functions of the Database-Independent Interface, use the “use” pragma
    to import or include the module. The use of DBI enables us to manipulate the database
    to which we are connected using the DBI module.


    Syntax:


    ```

    use DBI;

    ```


    Accessing the Database


    To connect to the specified database, use the connect() method. It requires three
    arguments:


    +   - A three-value string separated by a “:” is “DBI:mysql-test” in this case.
    The first value indicates that we are employing DBI. The second value specifies
    the database engine, which is MySQL in this case. The third value is the database
    name to which we want to connect.


    +   - The username is the next argument to the connect() method. The user in this
    case is “root.”


    +   - The last argument is our local system’s password. It is “password” in this
