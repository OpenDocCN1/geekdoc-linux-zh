  md: '# Introduction


    IN THIS CHAPTER


    +   - Perl Introduction

    - Installation and Environment Setup

    - Hello World Program


    Perl is a high-level, interpreted, and dynamic, general-purpose programming language.

    It was created in 1987 by Larry Wall. Although “Practical Extraction and Reporting
    Language” is the most common expansion, there is no official full form of Perl.
    Some programmers refer to Perl as “Pathologically Eclectic Rubbish Lister” and
    “Practically Everything Likable.” The abbreviation “Practical Extraction and Reporting
    Language” is often used since Perl was initially designed for text processing,
    such as extracting the necessary information from a specific text file and converting
    the text to a new format. Perl supports both procedural and object-oriented programming.

    Perl is syntactically similar to C, making it accessible to C and C++ programmers.


    # EVOLUTION OF PERL


    It all began when Larry Wall was tasked with generating reports from text files
    containing cross-references. Then he began awk for this work but quickly realized
    it was insufficient. Instead of designing a tool for this purpose, he created
    a new programming language, Perl, and its


    DOI: 10.1201/9781003358442-1'
  merge: -1
  pgno: 19
- img_proc: true
  md: 'interpreter. He built the Perl programming language in C, using principles
    from awk, sed, and, among others. Perl was initially designed only for system
    administration and text processing, but subsequent versions included the ability
    to manage regular expressions (Regex) and network sockets. Presently, Perl is
    renowned for its capability to handle Regex. The first release of Perl was version
    1.0 on December 18, 1987. 5.28 is the most current version of Perl. Perl 6 is
    distinct from Perl 5 since it is a reimplementation of Perl 5 that is entirely
    object-oriented.


    # WHY PERL?


    Perl''s popularity and demand stem from a variety of factors. Some of the causes
    are as follows:


    +   Perl is a high-level language; thus; it is similar to other popular programming
    languages such as C and C++, making it simple for anybody to learn.


    +   Text-processing: As the name "Practical Extraction and Reporting Language"
    suggests, Perl has powerful text manipulation capabilities, allowing it to create
    reports from various text files readily. Additionally, it may convert the files
    to a different format.


    +   Perl incorporates the exemplary aspects of other languages, such as C, sed,
    awk, and sh, making the language more useful and productive.


    +   System management: Perl''s ability to use many scripting languages makes system
    administration a simple operation. Instead of relying on many languages, utilize
    Perl to fulfill all system management tasks. Despite this, Perl is also used for
    web development, web automation, and Graphical User Interface (GUI) programming,
    among other things.


    +   Web and Perl: Perl may be incorporated into web servers to boost their processing
    capacity, and the DBI module makes web-database interaction quite simple.


    # Getting started with Perl programming:


    +   Locating an interpreter: Numerous online integrated development environments
    (IDEs) may be used to execute Perl programs without installation.'
  merge: -1
  pgno: 20
- img_proc: true
  md: 'Windows: A number of IDEs are available to execute Perl applications or scripts,
    including Padre and Eclipse with the EPIC plugin.


    # PERL FEATURES


    +   - The capabilities listed below are present in Perl and have been widely adopted
    by other programming and scripting languages.


    +   - Most of Perl''s features, including variables, expressions, statements,
    control structures, and subroutines, are derived from C.


    +   - It also utilizes shell scripting for detecting data kinds.


    +   - Perl provides built-in functions often used in shell programming, such as
    sort and system facilities use, that may be denoted using leadings, such as an
    array, scalar, and hash.


    +   - In addition, Perl 5 supports complicated data structures and an object-oriented
    programming style that includes packages, references, and compiler directives.


    +   - The interpreter knows the storage and memory needs for each data type and
    allocates and deallocates memory depending on use in all versions of Perl.


    +   - It also typecast during execution, such as converting an integer to a string,
    and all conversions that are not valid, which result in errors being raised.


    +   - Perl does not impose or promote any particular programming style, such as
    procedural, object-oriented, or functional; the interpreter and its functions
    constitute the language''s only definition.


    +   - Perl has APIs (text manipulation facilities) that help deal with XML, HTML,
    and other mark-up languages.


    +   - Perl offers the most significant level of security and is even certified
    by Coverity, a third-party security company, for having a low defect density and
    fewer security issues.


    +   - Perl is extensible and includes libraries that handle XML and database integration
    (DI), such as Oracle and MySQL.'
  merge: -1
