  md: '# redo OPERATOR


    In Perl, the redo operator begins from the specified label without evaluating
    the conditional expression. Once redo is called, no further statements in that
    block will execute. Even if there is a continue block, it will not be performed
    after the redo call. When a Label is used with the redo operator, the execution
    begins with the loop defined by the Label.


    Syntax:


    redo Label


    Returns:


    No Value


    First example:


    ```

    #!/usr/bin/perl -w


    $x = 1;


    # Assigning label to the loop label

    PFP: {

    $x = $x + 5;

    redo PFP if ($x < 10);

    }

    ```


    ```

    # Printing value

    print ($x);

    ```


    Second example:


    ```

    #!/usr/bin/perl -w


    $x = 1;


    # Assigning label to the loop label

    $count = 1;

    PFP: while ($count < 10) {

    $x = $x + 5;

    $count++;

    redo PFP if ($x < 100);

    }

    ```


    ```

    # Printing value

    print ("\$x \$count");

    ```'
