    # PASS BY REFERENCE


    When variable is passed by reference, the function operates on the function''s
    original data. The function can change the original value of a variable by passing
    it by reference.


    When the values of the elements in the argument arrays @_ are changed, so the
    values of the corresponding arguments. This is what passing by reference accomplishes.


    In the following example, updating the elements of an array @a in subroutine sample
    changes the value of the parameters, which is reflected through the program. As
    a result, when parameters are referenced, changing their value in the function
    changes their value in the main program.


    # First example:


    ```

    #!/usr/bin/perl

    ```


    ```

    # Initialising array ''a''

    @a = (0..10);

    ```


    ```

    # Array before the subroutine call

    print("The Values of an array before function

    call: = @a\n");

    ```


    ```

    # calling subroutine ''sample''

    sample(@a);

    ```'
