    (API), including command line shells and utility interfaces. It also provides
    a number of “character groupings” with names like (alpha, alphan, ascii, blank,
    etc.). The SIX character classes are always in the form of [:class], where class
    is the name and the delimiters are [: and]. POSIX character classes are always
    contained within the bracketed character classes. These classes provide a quick
    and easy method to list a set of characters.


    # Syntax:


    ```

    $string ~ /[:class:]]/

    ```


    Here, can be alpha, alphan, ascii, and so on.

    As illustrated, POSIX character classes support larger bracket-ed classes:

    [01[:Class:]]

    It will match "0", "1," any character classes, and the % sign in this case. Perl
    supports the following PO SIX character classes, as given in the table below:


    | Class | Description |

    | --- | --- |

    | Alpha | Any alphabetical character ("[A-Za-z]") |

    | Alnum | Any alphanumeric character ("[A-Za-z0-9]") |

    | Ascii | Any character in ASCII character set |

    | blank | A space or horizontal tab |

    | Cntrl | Any control character |

    | Digit | Any digit ("[0-9]") |

    | graph | Any printable character, excluding space |

    | lower | Any lowercase character ("[a-z]") |

    | punct | Any graphical character |

    | space | Any whitespace character |

    | upper | Any uppercase character ("[A-Z]") |

    | xdigit | Any hexadecimal digit ("[0-9a-fA-F]") |

    | word | Perl extension ("[A-Za-z0-9_]"), equivalent to "w |


    3. Word character \w[0-9a-zA-Z]: The letter w belongs to the word character class.
    The w character can be any single alphanumeric character, including an alphabetic
    character, a decimal digit, or a'
