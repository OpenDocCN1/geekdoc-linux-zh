  md: '# SPECIAL CHARACTER CLASSES IN REGULAR EXPRESSIONS


    Perl has several distinct character classes, some of which are used frequently
    that a specific sequence is built for them. Writing a custom sequence aims to
    make the code more understandable and concise. Perl’s special character classes
    are as follows:


    +   1. **Digit \d[0-9]**: The d character is used to match any digit character
    and is identical to [0-9]. A single digit will be matched by the regex /\d/. The
    d has been standardized to “digit”. The key advantage is that the user may write
    in a shorter format that is easier to read. This unique character class can be
    used in two ways. Let’s look at example to how to match the character string.


    **Example:**


    ```

    / [MNOPQ]-\d\d\d/

    ```


    The character, as mentioned earlier, the string will match as follows:


    #M-12345

    #N-66666


    We may also utilize quantifiers in this case by placing them on the character
    class.


    **Example:**


    ```

    / [MNOPQ]-\d{5}/

    ```


    The above example is identical to the previous regex in that it accepts any number
    of digits following the dash and may be expressed as /#[MNOPQ]-\d+.


    In larger character classes, the second technique is utilized. The \d is surrounded
    by square brackets and matches a single character digit.


    **Example:**


    ```

    [\dABCDEFGHIJKLMN]

    ```


    A single digit or any capital letters A, B, C, D, E, F, G, H, I, J, K, L, M, or
    N can match. It can be written more concisely by using a dash (-). Then it will
    be something like:


    ```

    [\dA-N]

    ```'
