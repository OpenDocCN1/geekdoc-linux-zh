  md: '^ (bitwise XOR) takes two operands and performs XOR on each bit of the two
    numbers. If two bits are different, the result of XOR is 1.

    As an example:


    ```

    $x = 13; // 1101

    $y = 5; // 0101

    $z = $y ^ $x;

