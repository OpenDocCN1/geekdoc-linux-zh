  md: '# 162 ■ Mastering Perl


    # Defining string

    my $String = ''Peeks $var Peeks is the best'';


    # String before using the ''ee'' modifier

    print "The Original String: $String\n";


    Because $var is considered a substring of the provided string and is not considered
    variable, it is written as it was before the regex was applied to the string in
    the string. However, once the regex is applied, the "ee" modifier evaluates the
    value of $var and displays it.


    If we apply the "ee" modifier in the above code, the resultant string is the same
    as the original string:


    # String before using ''e'' modifier

    print "The Original String: $String\n";


    # Applying ''e'' modifier using regex

    $String ~ s/(\w+)/$1/e;

    print "The Updated String: $String";


    This is when the "e" modifier is applied, the regex considers the RHS to be evaluated
    as a replacement; in this case, the RHS is $1, which retains $var but not its
    value. As a result, applying the "ee" modifier will re-evaluate the RHS, which
    contains the already eval’d value $var.


    When Doing Mathematical Calculations, Use the "ee" Modifier

    If a mathematical expression is contained in a string, the value of the expression
    is not evaluated and is displayed as is. This is because it is seen as both a
    string and an expression to be evaluated.'
