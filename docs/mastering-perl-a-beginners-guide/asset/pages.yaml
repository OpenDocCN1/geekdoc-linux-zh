  md: '# Fundamentals of Perl ■ 31


    # Modulus operator (%)


    The modulus operator (%) divides the left-hand operand from the right-hand operand
    and returns the remainder. As an example:


    ```

    $x = 10;

    $y = 15;

    print $x % $y;

    ```


    Here Result will be 5


