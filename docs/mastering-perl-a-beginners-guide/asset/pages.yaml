    # Bitwise Operators


    The bitwise operation is carried out using these operators. It will convert the
    integer to bits first, and then perform the bit-level action on the operands.


    +   & (bitwise AND) is a function that takes two operands and performs AND on
    each bit of the two numbers. AND returns only 1 if both bits are 1. As an illustration,


    $x = 13;   // 1101

    $y = 5;    // 0101

    $z = $y & $x;

    print $z;

    Here Output will be 5


    Explanation:


    ```

    $x = 1 1 0 1

    $y = 0 1 0 1

    ----------------

    $z = 0 1 0 1

    ```


    +   | (bitwise OR) is a function that takes two operands and performs OR on each
    bit of the two numbers. OR returns 1 if either of two bits is 1. As an illustration,


    $x = 13;   // 1101

    $y = 5;    // 0101

    $z = $y | $x;

    print $z;

    Here Output will be 13


    Explanation:


    ```

    $x = 1 1 0 1

    $y = 0 1 0 1

    ----------------

    $z = 1 1 0 1

    ```'
