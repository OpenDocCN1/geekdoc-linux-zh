  md: 'between the “diamond” and “spaceship” operators, i.e. <>. This is standard
    procedure. The < > operator can also be used to write to files. <STDIN> can be
    used in both Scalar and List contexts.


    # Syntax:


    ```

    $a = <STDIN>; or $a = <>;

    ```


    # Example:


    ```

    #!/usr/bin/perl -w

    use strict;

    use warnings;

    ```


    ```

    print "Enter text:";

    my $string = <STDIN>;

    ```


    ```

    print "We entered $string as a String";

    ```


    After entering Input, the code requires us to press ENTER. This ENTER instructs
    the compiler to run the following line of code. However, <STDIN> treats the ENTER
    key as part of the input and prints the line when we hit it. Following the Input
    string, a new line will be written automatically. To avoid this, the chop() method
    is used. This method will delete the newline character placed at the end of the
    user-supplied Input.


    # Example:


    ```

    #!/usr/bin/perl -w

    use strict;

    use warnings;

    ```


    ```

    print "Enter text:";

    my $string = <STDIN>;

    chomp $string;

    ```


    ```

    print "We entered $string as a String";

    ```


    In this chapter, we covered the use of print() and say(), print operator, and
    STDIN for Input.'
