  md: "# Regular Expressions in Perl ■ 153\n\nPerl quantifiers are classified into\
    \ six types, which are listed below:\n\n+   1. * = This indicates that the component\
    \ must appear zero or more times.\n\n+   2. + = This indicates that the component\
    \ must appear one or more times.\n\n+   3. ? = This specifies that the component\
    \ must appear either zero or once.\n\n+   4. {n} = This specifies that the component\
    \ must be present n times.\n\n+   5. {n,} = This specifies that the component\
    \ must appear at least n times.\n\n+   6. {n,m} = This specifies that the component\
    \ must appear at least n times and no more than m times.\n\nQuantifier Table\n\
    \nAll of the kind may be comprehended using this table, which contains regular\
    \ expression quantifiers and examples.\n\n| Regex | Examples |\n| /Bx*B/ | BB,\
    \ BxB, BxxB, BxxxB, ...... |\n| /Bx+B/ | BxB, BxxB, BxxxB, ...... |\n| /Bx?/ |\
    \ BB, BxB |\n| /Bx[1,3]B/ | BxB, BxxB |\n| /Bx[2,9]B/ | BxB, BxxxB, ...... |\n\
    | /Bx[4]B/ | BxxxB |\n\nLet's look at some examples of these quantifiers.\nFirst\
    \ Example: In this example, the * quantifier is employed in a regular expression\
    \ /Pe*ks/, which yields either \"Pks\", \"Peks\", \"Peeks\"...and so on, and is\
    \ matched with the input text \"Pks\", yielding \"Match Found.\"\n\n```\n#!/usr/bin/perl\n\
    \n# Initializing string\n$sa = \"Pks\"\n\n# matching above string with \"*\"\n\
    # quantifier in the regular expression /Ge*ks/\nif ($sa ~ m/Pe*ks/)\n{\n    print\
    \ \"Match is Found\\n\";n}\n```"
