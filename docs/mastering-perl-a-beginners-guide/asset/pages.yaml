    +   - 2. Quotes: In Perl, we can use either single or double quotes (" or "").
    Single quotes do not interpolate any variable or special character, but double
    quotes do.


    +   - 3. \n: It is used for newline character, which escapes any character with
    a backslash (\).


    +   - 4. /usr/bin/Perl: It is the original interpreter binary, which always begins
    with #!. This is used in Perl Script Mode Programming.'
