    To match from a Specified Position, use \G Assertion

    In Perl Regex, the \G Assertion is used to match a string beginning at a position
    specified by the pos() function and concluding at the matching character specified
    in the regex. The position of the first occurrence of the character specified
    by the "m" modifier will return.


    # Example:


    ```

    #!/usr/bin/perl

    ```


    ```

    # Defining default string

    $_ = "Peeks World is the best";

    ```


    ```

    # Terminating character

    # using the m modifier

    m/o/g;

    ```


    ```

    # Specifying starting position

    $position = pos();

    ```


    ```

    # Using the \G Assertion

    m/\G(.*)/g;

    ```


    ```

    # Printing position

    # and the remaining string

    print "$position \$1";

    ```


    In the preceding example, the position of the first occurrence of the matching
    substring is printed alongside the remaining string. If we need to restart the
    counting position for the next occurrence of the matching character, simply store
    the remaining string in $1 into the default string.'
