  md: 'It works with the vast majority of operating systems and is included in the
    Oxford English Dictionary. It borrows concepts and syntax from a variety of languages,
    including AWK, bourne shell, C, sed, and even English.


    # HISTORY OF PERL


    Larry Wall created Perl in 1987 as a scripting language to help with report processing.


    +   - On December 18, 1987, it was released in version 1.0.

    - Perl 2 was released in 1988, and it included a much improved regular expression
    engine.

    - Perl 3 was released in 1989, and it included support for binary data streams.

    - Perl 4, released in 1991, had better documentation than previous versions.

    - On October 17, 1994, Perl 5 was released. Its most recent version included many
    new features, such as objects, variables, references, and modules.

    - The most recent version, 5.24, was released on May 9, 2016.


    # FEATURES OF PERL


    It has a straightforward object-oriented programming syntax.

    It can easily expand because it supports 25,000 open-source modules. Unicode is
    supported.

    It includes powerful tools for processing text to make it compatible with mark-up
    languages, such as HTML and XML.

    It supports third-party databases, such as Oracle and MySQL.

    It can embed in other systems like web servers and database servers.

    It is GNU-licensed open-source software.

    Perl is used to write many frameworks.

    It is capable of processing encrypted web data, including e-commerce transactions.


    It is a platform-independent language.

    It includes a regular expression engine that can transform any type of text.


    # LICENSING FOR PERL


    Larry Wall owns the copyright (C) to Perl 5. It is free and open-source software.
    It may be redistributed or modified under the terms of the GNU and Artistic Licenses.'
