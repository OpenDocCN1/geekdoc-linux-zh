    +   6. Encapsulation: Encapsulation is wrapping data into a single unit. It is
    the mechanism that connects code and the data that it manipulates. Encapsulation
    can also be considered a protective shield that prevents code from accessing data
    outside of the shield.


    +   Technically, in encapsulation, a class'' variables or data are hidden from
    other classes and can only be accessed through any member function of the class
    in which they are declared.


    +   Because the data in a class is hidden from other classes, it is also referred
    to as data-hiding.


    +   Encapsulation can accomplish by declaring all variables in the class as private
    and writing public methods in the class to set and retrieve variable values.


    +   7. Abstraction: Data abstraction is the property that only displays the essential
    details to the user. The user is not shown the trivial or non-essential units.
    For example, a car is considered a whole rather than its individual components.


    Data abstraction is also defined as the process of identifying only the necessary
    characteristics of an object while ignoring irrelevant details. An object''s properties
    and behaviors distinguish it from other objects of a similar type and aid in classifying/grouping
    objects.


    Consider the following scenario: A man is driving a car. The man only knows that
    pressing the accelerators will increase the car''s speed or applying the brakes
    will stop the car. Still, he has no idea how pressing the accelerator will increase
    the speed, nor does he understand the car''s inner mechanism or how the car''s
    accelerator, brakes, and other controls are implemented. This is the definition
    of abstraction.'
