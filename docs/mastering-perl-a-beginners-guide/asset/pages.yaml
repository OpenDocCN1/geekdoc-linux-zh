  md: "# 216 ■ Mastering Perl\n\nIf we pass an argument of a type other than the function\
    \ signature, the following error will be generated:\n\n```\n#!/usr/bin/perl\n\n\
    # Defining the Function Signature\nub example(Int $variable)\n{\n    return $variable\
    \ / 2;\n}\n\n# Function Call with the\n# string type parameter\nprint example(\"\
    66\");\n```\n\nDifference in Number of Arguments\nWhen function signature is defined,\
    \ it also includes the number and type of arguments that can be passed to it.\
    \ If we call the function with a different number of arguments, Perl will throw\
    \ an error because functions with different signatures have different meanings.\n\
    \n# Example:\n\n```\n#!/usr/bin/perl\n\n# Defining Function-Signature\nsub example(Int\
    \ $variable)\n{\n    return $variable / 2;\n}\n\n# Function Call with the\n# two\
    \ arguments\nprint example(66, 49);\n```\n\nFunction signature is a useful feature,\
    \ but it can be very annoying for some programmers because it restricts the use\
    \ of the function to a specific type of parameter. There are no restrictions on\
    \ the type of parameters that can pass to the function if it is defined without\
    \ a signature."
