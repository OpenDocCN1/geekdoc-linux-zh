  md: "is copy trait allows us to change the value of a parameter within a\nsubroutine\
    \ but not the argument in the caller function.\n\n# Example: Use of the copy trait\n\
    \n```\n#!/usr/bin/perl\n\n# Function Definition using the\n# 'is copy' trait\n\
    sub Func(Int $variable is copy)\n{\n    # Operation to be performed\n    $variable\
    \ += 5;\n}\n\n# Defining the local variable\nmy $value = 20;\n\n# Function Call\
    \ with the local variable\nprint Func($value), \"\\n\";\n```\n\nChecking if\n\
    # the $value gets updated or not\nprint $value;\n\nBecause Perl does not allow\
    \ the modification of arguments within a\nsubroutine by default, the copy trait\
    \ is used in the above code. This trait\nenables the program to assign the caller's\
    \ parameter value to the\nsubroutine being called a parameter. This trait, however,\
    \ will only affect\nthe value of the argument in the called function.\n\n# Example:\
    \ Use of the rw trait\n\n```\n#!/usr/bin/perl\n\n# Function Definition using the\n\
    # 'is rw' trait\nsub Func(Int $variable is rw)\n{\n    # Operation to perform\n\
    \    $variable += 5;\n}\n```"
