  md: 'The following are examples of assignment operators:


    +   - = (Simple assignment): The most basic assignment operator. This operator
    assigns the variable on the left the value on the right.


    $x = 20;

    $y = 40;


    +   - += (Add assignment): A combination of the “+” and "=” operators. This operator
    adds current value of variable on the left to value on the right, and then assigns
    result to the variable on the left.

    As an example:


    ($x += $y) can be written as ($x = $x + $y)


    +   - If the initial value of a is 5, ($a += 6) = 11.


    +   - -= (Substract assignment): This operator combines the “-” and "=” operators.
    This operator subtracts the variable’s current value from the value on right and
    assigns the resulting value to the variable on the left.

    As an example:


    ($x -= $y) can be written as ($x = $x - $y)


    +   - If the initial value of a is 8, ($a -= 6) = 2.


    +   - *= (Multiply assignment): This operator combines the “*” and "=” operators.
    The variable on the left is multiplied by the value on the right, and the result
    is assigned to a variable on the left.

    As an example:


    ($x *= $y) can be written as ($x = $x * $y)


    +   - If the initial value of a is 5, ($x *= 6) = 30.


    +   - /= (Division assignment): This operator combines the “/” and "=” operators.
    This operator divides the current value of variable on the left by the value on
    the right and allocates the result to the variable on the left.

    As an example:


    ($x /= $y) can be written as ($x = $x / $y)


    +   - If the initial value stored in a is 6, ($x /= 2) = 3.'
