    # Linux Sendmail Server


    # Overview


    The Sendmail program is a very widely used Mail Transport Agent (MTA). MTAs send
    mail from one to another. Sendmail is not a client program, which you use to read
    your e-mail. Sendmail is a behind-scenes program, which actually moves your email
    networks or the Internet where you want it to go. Sendmail has been rather buggy
    and as an easy system for crackers to exploit, with the advent of version 8 it
    becomes difficult.'
