    that is generated

    locally | Accept external mail

    (via its firewall) for

    centralized and | Receive

    send mail |


    The openarch.com domain is accessible only through mail.openarch.com.


    This is the graphical representation of the Sendmail configuration we use in this
    book. We try to show you different settings (Central Mail Hub Relay, and local
    or neighbor client and server machines) on different servers. All possibilities
    exist and depend on your needs and network architecture.


