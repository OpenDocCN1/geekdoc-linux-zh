  pgno: 34
- img_proc: true
  md: 'Comments and suggestions concerning this page should be mailed to gmnourai@videotron.ca


    Social engineering of server passwords and other methods is still the easiest
    and most popular way to gain access to accounts and servers. Most desk workers
    have access to many user accounts due to poor user security and the general tendency
    in any environment to place trust in other employees at all—especially those who
    are there to solve problems. Very successful server and client attacks have been
    documented many different networks due to ambitious individuals who gained access
    through lax security measures. Often, seeming as simple as a superior or executive
    in a company and yelling at the right point of the day yields terrific results,
    and in some cases, total access to internal servers.


    Since password cracking can be a time-resource consuming art, make it hard for
    any cracker who has grabbed your password file. Running a password cracker on
    a weekly basis based on your system is a good idea. This helps to find and replace
    passwords that are easily guessed or weak. Also, a password checking mechanism
    should be present to reject a weak password when first choosing password or changing
    an old one. Character strings that are plain dictionary words, or are all in the
    same case, or do not contain numbers or special characters should not be accepted
    as a new password.


    I recommend the following rules to make passwords effective:


    +   - They should be at least six characters in length, preferably including at
    least one numeral special character.

    - They must not be trivial; a trivial password is one that is easy to guess and
    is usually based on the user''s name, family, occupation or other personal characteristic.

    - They should have an aging period, requiring a new password to be chosen within
    a specific time frame.

    - They should be revoked and required to be reset after a limited number of concurrent
    incorrect retries.


    # 5. The password length


    The minimum acceptable password length by default when you install your Linux
    system is 5. This mean that when a new user is allowed to have an access to the
    server, his/her password length will be at minimum 5 characters strings, letter,
    number, special character. This is not enough and must be at least 8. To prevent
    unconscious people or administrator to be able to just 5 character length for
    the valuable password rather important "etc/login.defs" file and change the value
    of 5 to 8 length.


    Edit the login.defs (vi /etc/login.defs) and change the line that read:


    ```

    PASS_MIN_LEN    5

    To read:

    PASS_MIN_LEN    8

    ```


    The "login.defs" is the configuration file for the login program. You should review
    or make changes to this file for your particular system. This is where you set
    other security policy (like password expiration defaults or minimum acceptable
    password length).


    # 6. The root account'
  merge: -1
  pgno: 35
- img_proc: true
  md: 'Comments and suggestions concerning this page should be mailed to gmnourani@videotron.ca


    The "root" account is the most privileged account on a Unix system. The "root"
    account has no security restrictions upon it. This means the system assumes you
    know what you are doing, and will do exactly what you request -- no questions
    asked. Therefore it is easy, with a mistype command, wipe out system files. When
    using this account it is crucial to be careful as possible. For security reasons,
    never log in as "root" unless absolutely necessary for tasks that necessitates
    "root" access. Also if you are not on your server, never sign in and let it be
    "root" VERY VERY BAD.


    # 7. Encryption


    Encryption uses a key, a value, as input to an algorithm to make data readable
    only by someone who knows the key. This works extremely well while all the hosts
    involved under your control in a secure environment, but if a "trusted" host gets
    compromised, then you are again at risk. It is not only user IDs and passwords
    that are at risk. Most encryption implementations are used to pass confidential
    or classified information. If one of the systems is compromised the information
    may become known or exposed. This will be minimized by an effective security policy,
    but remains a risk whether or not the encryption key is exposed to the Internet.
    Use of encryption technologies like OpenSSL, SSH, MD5 can be very helpful, see
    later in this book for more information on the topic.


    # 8. The "/etc/exports" file


    If you are exporting files using NFS, be sure to configure "/etc/exports" file
    with the most restrictive access possible. This means not using wildcards, not
    allowing root write access, and reading-only where ever possible.


    Edit the exports file (vi /etc/exports) and add:


    +   For example:

    /dir/to/export host1.mydomain.com(ro,root_squash)

    /dir/to/export host2.mydomain.com(ro,root_squash)


    When "/dir/to/export" is the directory you export, host.mydomain.com is the machine
    allowed to log reading-only and <root_squash> for not allowing root write access
    in this directory.


    For this change to effect you will need to run /usr/sbin/exportsfs -a


    NOTE: Please be aware that having an NFS service available on your system can
    be a security risk. Personally, I don''t recommend using it.


    # 9. Disabling console program access


    One of the simplest and commonest customizations is to entirely disable all console-equivalent
    access to programs like shutdown and halt. To do this:


    ```

    [root@dead# rm -f /etc/console.access/servicervice

    ```


    Where servicervice is the name of the program to which you wish to disable console-equivalent
    access. Unless you use xdm, be careful not to remove the xserver file or no one
    but root will be to start the X server. If you always use xdm to start the X server,
    root is the only user that needs to start X, in which case you might actually
    want to remove the xserver file.


    © Copyright 1999 Open Network Architecture ®


    37'
