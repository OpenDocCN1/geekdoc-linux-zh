  md: 'Comments and suggestions concerning this page may be mailed to gmourai@videotron.ca


    POP stands for “Post Office Protocol” and simply allows you to list messages,
    retrieve them, and delete them. There are many POP servers for Linux available,
    the one that sticks with most distributions is for the majority of users. IMAP
    is on steroids. It allows you to easily maintain multiple accounts, have multiple
    people access one account, leave mail on the server, just download the headers,
    or bodies no attachments, and so on.


    IMAP is ideal for anyone on the go or with serious emails. The default POP and
    IMAP servers that most distributions ship (bundled together into a single package
    named imap oddly enough) fulfill most needs.


    # These installation instructions assume


    Commands are Un-compatible.

    The source path is `/var/tmp` (other paths are possible).

    Installations were tested on RedHat Linux 6.1.

    All steps in the installation happen in superuser account ''root''.

    Imap version number is 4.5


    # Packages


    Imap Homepage: http://www.washington.edu/imap/

    You must be sure to download: imap-4.5.tar.Z


    # Tarballs


    It is a good idea to make a list of files on the system before you install Imap,
    and one afterwards, and then compare them using `diff` to find out what file placed
    where. Simply run `find / > imap1` before and `find /* > imap2` after you install
    the software, and use `diff imap1 imap2` to get a list of what changed.


    # Compilation


    Decompress the tarball (tar.Z).


    ```

    [root@deep]# cp imap-version.tar.Z /var/tmp

    [root@deep]# cd /var/tmp

    [root@deep]# tar xzf imap-version.tar.Z

    ```


    # Compile and Optimize


    Cd into the new directory and type the following commands on your terminal:


    Edit the `Makefile` file (vi +668 src/odepunix/Makefile) and change:

    sh -c ''test -f /usr/include/sys/statvs -a $(OS) != sc5 -a $(OS) != sco && $(LN)
    flocksun.c flockbd.c || $(LN) flocksockv4 flockbd.c''

    To read:

    sh -c ''test -f /usr/include/sys/statvs -a $(OS) != sc5 -a $(OS) != inx && $(LN)
    flocksun.c flockbd.c || $(LN)''


