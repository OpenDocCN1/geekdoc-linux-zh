    # ssh2


    SSH2 (Secure Shell) is a program for logging into a remote machine and executing
    commands in a remote machine. It is intended to replace login and rsh, and provide
    secure communications between two untrusted hosts over an insecure network. X11
    connections and arbitrary TCP/IP ports can be forwarded over the secure channel.


    +   * To logging to a remote machine, use the command:

    `[root@deep]# ssh2 -l <hostname>`

    For example:

    `[root@deep]# ssh2 -l username.openarch.com

    Passphrase for key "/home/username/.ssh2/id_dsa_1024_a" with comment "1024-dsa,

    username@deep.openarch.com, Oct 19 1999 14:31:00-0400"

    username''s password:

    Last login: Tue 19 Oct 1999 18:13:00-0400 from gate.openarch.com

    Welcome to username on Deepfreest.


    Where <login> is the name you use to connect to ssh server and <hostname> is the
    address of your ssh.


    sftp (Secure Transfer) is a ftp-like client that can be used in file transfer
    over the network. sftp uses ssh2 in data connections, so the transport is secure.
    You must be connected with ssh2 before using sftp.


    +   * To ftp over ssh2, use the following command:

    `[username@deep] sftp <hostname>`

    For example:

    `[username@deep] sftp :home/username

    local path :home/username

    Passphrase for key "/home/username/.ssh2/id_dsa_1024_a" with comment "1024-dsa,

    username@deep.openarch.com, Oct 19 1999 14:31:40-0400"

    username''s password:

    remote path :home/username

    sftp


    Where <hostname> is the name of the server you use to sftp.


