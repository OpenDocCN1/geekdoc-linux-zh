    # Configurations


    All software we describe in our book "Linuxuos.pdf" will have a specific directory
    and subdirectory in a tar compressed archive "floppy.tgz" containing configuration
    files for the specific program. If you edit this file, you won''t be obliged to
    reproduce the different configuration files below manually or copy and paste them
    to create your configuration files. Whatever you decide to copy manually or get
    make for your convenience from the compressed files, it will be to your responsibility
    to modify, adjust for your needs and place the files below Squid server to their
    appropriate places on your server machine, like show. The server configuration
    files archive is located at following Internet address: http://pages.infinit.net/lotus1/docopt/floppy.tgz


    +   * To run squid, the following files are required and must be created or copied
    to their appropriate directories on your server.


    Copy the squid.conf file in the "etc/squid/" directory.

    Copy the script file in the "etc/rc.init.d/" directory.

    Copy the squid file in the "etc/logrotate.d/" directory.


    You can obtain configuration files below on our floppy.tgz archive. Copy the following
    files from the decompressed floppy.tgz archive to their appropriate places and
    copy and paste them directly from this to the concerned file.


    # Configuration of the "etc/squid/squid.conf" file as a httpd-accelerator


    Configure your "etc/squid/squid.conf" file to be in httpd mode. If the Web Server
    on the same server where Squid is installed, you put your httpd (Apache) daemon
    running on port 81. With Apache you can do it by assigning the line (Port 81)
    in "httpd.conf". If the Web Server (Apache) run on other server in your network
    like we do, you can keep the same port number (80) for Apache, since Squid Proxy
    will bind on different IP number where the port (80) is not already in use.


    Edit the squid.conf file (vi /etc/squid/squid.conf) and add:


    ```

    http_port 80

    icp_port 0

    acl QUERY query regex \?

    o_cache deny QUERY

    cache_mem 16 MB

    cache_dir ufs /cache 200 16 256

    emulate_httpd_log on

    irectirect_rewrite_, host_header off

    replacement_policy GDSF

    half_closed_clients GDS

    acl all src 0.0.0.0/0

    http_access allow all

    cache_mgr admin

    cache_effective_user squid

    cache_effective_group squid

    httpd_accel_host 206.164.186.333

    httpd_accel_port 80

    ```


