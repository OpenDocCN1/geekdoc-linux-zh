    +   - Masquerading the Internal Machines


    # The firewall scripts files


    The iptables allows you to filter packets. To set up firewalls, IP masquerading,
    iptchains chains to the kernel and tells it what packets to filter. Therefore
    all your firewall setup are stored in the kernel, and will be lost on reboot.


    To avoid this, we recommend using the System V init scripts to make your rules
    permanent. To do this, create a firewall script file like below in your `/etc/rc.d/init.d`
    directory for each server you have. For, each server has services to offer and
    need different firewall setup. For reason, we provide tree different firewall
    setting, which you can play, examine and fit your needs. I assume that you have
    a minimum knowledge on how filtering and firewall rules works.


    # Configuration of the `/etc/rc.d/init.d/firewall` script file for the Web Server


    This is the configuration file for our Web Server machine. This configuration
    allows, unlimited traffic on the Loopback interface, DNS Caching and Client Server
    (53), SSH Server (22), HTTP (80), HTTPS Server (443), SMTP Client (25), FTP Server
    (20, 21), and OUTGOING ROUTE requests by default.


    If you don''t want some services listed in the firewall rules for the Web Server
    that I make ON by default, comment them out with a `#` at the beginning of the
    line. If you want other services that are commented out with a `#`, then remove
    the `#` at the beginning of their lines.


    Create the firewall script file (touch `/etc/rc.d/init.d/firewall`) on your Web
    Server and:


