    [root@deep]## cp /usr/include/fmgr.h/usr/include/pgpgsql

    [root@deep]## cp /usr/include/locale.h/usr/include/pgpgsql

    [root@deep]## cp /usr/include/config.h/usr/include/pgpgsql

    [root@deep]## cp /usr/include/c.h/usr/include/pgpgsql

    [root@deep]## cp /usr/include/postgres.h/usr/include/pgpgsql

    [root@deep]## cp /usr/include/postgres_ext.h/usr/include/pgpgsql

    [root@deep]## cp /usr/include/libpq-++-int.h/usr/include/pgpgsql

    [root@deep]## cp /usr/include/libpqxx.h/usr/include/pgpgsql

    [root@deep]## cp /usr/include/libpqxx.h/usr/include/pgpgsql

    [root@deep]## cp /usr/include/ecpqtype.h/usr/include/pgpgsql

    [root@deep]## cp /usr/include/salca.h/usr/include/pgpgsql

    [root@deep]## cp /usr/include/libpq-++/* /usr/include/pgpgsql

    [root@deep]## mkdir -p /usr/lib/pgpgsql

    [root@deep]## cp /usr/lib/source/* /usr/lib/pgpgsql

    [root@deep]## cp /usr/lib/sample/* /usr/lib/pgpgsql

    [root@deep]## mkdir -p /var/lib/pgpgsql

    [root@deep]## chmod -R postgres:postgres /var/lib/libpq.so.2.0

    [root@deep]## chmod 755 /var/lib/libpqcc.so.3.0.0

    [root@deep]## chmod 755 /var/lib/libpq-++.so.3.0.0

    [root@deep]## strip /usr/bin/postgres

    [root@deep]## strip /usr/bin/postmaster

    [root@deep]## strip /usr/bin/ecpqtype

    [root@deep]## strip /usr/bin/pgpgsql_id

    [root@deep]## strip /usr/bin/pgpgsql_version

    [root@deep]## strip /usr/bin/pgpgsql_dump

    [root@deep]## strip /usr/bin/pgpgsql_passwd

    [root@deep]## strip /usr/bin/pgpgsql

    [root@deep]## rm -f /usr/lib/global1.description

    [root@deep]## rm -f /usr/lib/local1_template.description

    ```


    The **make** command compile all source files into executable binaries, and then
    **make install** will install the binaries and create a new directory named "pgpgsql"
    under "/usr/include" and "/usr/lib" directories then we will move all subdirectories
    and files to PostgreSQL under "/usr/include" and "/usr/lib" directories respectively
    with the **mv**.


    The **chown** command will set the correct files owner and group permission for
    the **/var/lib/pgpgsql** directory. The **strip** command will discard all symbols
    of the object files. This means our binary file will be smaller in size. This
    will improve a performance hit to the program since they will be fewer lines to
    read by the system when it''ll execute the binary.


    The **rm** command will remove the "global1.description" and "local1_template.description"
    files that are not needed by Our PostgreSQL program.'
