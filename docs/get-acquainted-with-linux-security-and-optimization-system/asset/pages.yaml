  md: 'Comments and suggestions concerning this page will be mailed to gmourani@videotron.ca


    # # Linux General Security


    Overview

    A UNIX system is only as secure as the administrator makes it. The more services
    you add, the more chances of introducing a security hole. Operating systems like
    SCO and others may actually be more prone to security breaches because they offer
    more services that are an integral part of how they operate, in order to be more
    "user friendly".


    Linux itself is very stable and in it is distributed in many flavors. When installing
    Linux, one should tend to install with the minimum, and add only the ESSENTIAL
    items, reducing chances of an "application" of having a security weakness. Linux
    is the most SECURE if properly implemented.


    If a weakness is present in the system, there are thousands of volunteers to point
    it out immediately, with a fix. In a large organization, some of the commercial
    products have a limited size of team working on it. It is not always in their
    best interests to publish discoveries too loudly, or sometimes it takes a while
    before fixes trickle down the pipes to the releases or upgrades. They may become
    available as patches, but most administrators of commercial products prefer use
    them with the distribution only, with a false sense of comfort that they have
    more professionally designed software.


    Mistakes happen in programming at any level, but when you have 10''s of thousands
    of people with source code available to, these mistakes are often discovered faster
    in an open source code environment. Of course, with 10''s of thousands of people
    meddling with the source code, and what? 12 million copies of Linux are there
    now... there is a much better chance that someone will open a security hole


    This document will discuss some of the general techniques used to secure your
    site. Generally speaking services such as NFS, Samba, Imam and pop will only need
    to be accessible to internal users, blocking external access greatly simplifies
    matters. Following is a list of features that can be used to help prevent attacks
    from external and internal sources.


    #  1. Basic Information


    Let outsiders know as little as possible about your system. A simple figure to
    a victims system can reveal much about a system; How many users, when the admin
    is in, when do they work, when THEY ARE, who uses the system and personal information
    that might help an attacker guess a users password. You can use a powerful finger
    daemon or topd to limit who can connect to your system and how they know your
    system. It is better to uninstall package on your system.


    Logs are the only you have to know what''s going on your Linux system. Of course,
    this assumes that an attacker has not corrupted your logs, but that side. Full
    logging of all connections, can reveal what they are saying then get help to understand
    them. There is nothing wrong with someone helping you with something you find
    every down-and-go on something that I have made a mistake on that I am told to
    clarify or fix something. It is better to be arrogant than to be stupid. See below
    in section "28. Physical hard copies of all important logs for more information
    on how to have more control on log files.


    Limit the number of SUID programs on your system. SUID programs are programs that
    run, at the level of root (God in the UNIX world). Sometimes this is needed but
    many times


    © Copyright 1999 Open Network Architecture ®


    34'
