    # Linux Apache Web Server


    Apache is a full-featured web server with full support for the HTTP 1.1, standard,
    authenticated web pages, and many other features. Apache is one of the most popular
    web servers, and provides performance equal or better to commercial servers.


    Because Apache is a complex package there are a lot of variations and options.
    For more information please read this document when you want to install Apache
    under Unix. Here, I explain how to compile and optimize Apache with a lot options
    like mod_ssl, mod_perl, mod_php3, LDAP... because I don''t want to make several
    individual decisions from each one. Feel free to complete the want with what you
    want, e.g. For Apache + PHP but without mod_ssl or PostgreSQL... or follow the
    section that speaks about Apache and PHP and skip the rest.


    As you noticed above there are a lot of variations, and options for installing
    Apache. So, in the following we provide step-by-step examples of how you can build
    Apache with other third-party modules. For simplification we assume some prerequisites
    for each example. If they don''t fit your situation you have to adjust the steps.


    This session is geared for new Apache Webmasters, describes how to install an
    Apache and run it. It also covers many ways in which you can adjust the configuration
    to improve the server''s performance. In our configuration and we''ll run Apache
    as non-root-user and in a chrooted environment for optimal security.


    # These installation instructions assume


    Commands are Unix-compatible.

    The source path is "var/tmp" (other paths are possible).

    Installations were tested on RedHat Linux 6.1.

    All steps in the installation will happen in superuser account "root".

    Apache version number is 1.3.9

    Mod_perl version number is 1.21

    SSL version number is 2_4-10-1_3_9

    PHP version number is 3_0_13

    MM version number is 1.0.12'
