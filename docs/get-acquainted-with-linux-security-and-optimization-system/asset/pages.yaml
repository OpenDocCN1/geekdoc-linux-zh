    # Configure sshd to use tcp-wrappers inetd super server


    tcp-wrappers is important to start and stop sshd server. Upon execution, inetd
    reads its configuration information from a configuration file, which by default,
    is "etc/inetd.conf". There must be an entry for each field of the configuration
    file, with entries separated by a tab or a space.


    # Step 1


    Edit the inetd.conf file (/etc/inetd.conf) and add the line:


    ```

    ssh stream tcp nowait root /usr/sbin/tcpd -i

    ```


    NOTE: The -i parameter is important to specifies that sshd is being run from inetd.
    Also, update your "inetd.conf/root# by sending a SIGHUP signal (killall -HUP inetd)
    after adding the line.


    ```

    [root@deep/root# killall -HUP inetd]

    ```


    # Step 2


    Edit the hosts.allow file (/etc/hosts.allow) and add the line:


    ```

    sshd: 192.168.1.4 win.openarch.com

    ```


    Which mean client "192.168.1.4" with host name "win.openarch.com" is allowed to
    ssh on the server.


    These "daemon" strings (for tcp-wrappers) are in use by sshd2.


    ```

    sshd,sshd2

    The name sshd was called with (usually "sshd")\sshdfw-X11 (If you want to allow/deny
    X11-forwarding)

    hdfw-<port-name> (port-name defined in /etc/services. Used in tcp-forwarding).

    ```


    NOTE: If you decide to switch to using ssh, make sure you install and use it on
    all your servers. Having ten secure servers and one insecure is a waste of time.


