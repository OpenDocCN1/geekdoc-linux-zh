  md: '# TCP/IP Security Problem


    The TCP/IP protocol suite has a number of weaknesses that allow an attacker to
    leverage

    techniques in the form of covert channels to surreptiously pass data in otherwise
    benign

    packets. This section attempts to illustrate these weaknesses in theoretical examples.


    # Application


    A covert channel is described as: "any communication channel that can be exploited
    by a process

    to transfer information in a manner that violates the systems security policy.
    Essentially, it is

    a method of communication that is not part of an actual computer system design,
    and can be used

    to transfer information to users or processes that normally would not be allowed
    access to

    t information.


    In the case of TCP/IP, there are a number of methods available where covert channels
    can be

    established and can be surreptiously passed between hosts. These methods can be
    used

    in a variety of areas such as the following:


    +   * Bypassing packet filters, network sniffers, and "dirty word" search engines.

    * Encapsulating encrypted or non-encrypted information within otherwise normal
    packets of

    information for secret transmission through networks that prohibit such "TCP/IP
    Steeganography."

    * Concealing locations of transmitted data by "bouncing" packets with encapsulated

    information innocuous Internet sites.


    It is important to realize that TCP is a "connection oriented" or "reliable" protocol.
    Simply put, TCP

    has features that ensure data arrives at the remote host in a usually intact manner.
    The

    basic operation of this relies in the initial TCP "three way handshake" which
    is described in the

    three steps below.


    Step 1

    Send a synchronize (SYN) packet and Initial Sequence Number (ISN)


    Host A wishes to establish a connection to Host B. Host A sends a solitary packet
    to Host B with

    the synchronize bit (SYN) setting the new connection and an Initial Sequence Number
    (ISN)\which will allow tracking of packets sent between hosts:


    ```

    Host A ------SYN(ISN)-----> Host B

    ```


    Step 2

    Allow remote host respond with an acknowledgment (ACK)


    Host B responds to the request by sending a packet with the synchronize bit set
    (SYN) and ACK

    (acknowledgment) bit set in the packet back to the calling host. This packet contains
    not only the

    residents'' sequence number, but the Initial Sequence Number one (ISN+1) to

    indicate the remote packet was correctly received as part of the acknowledgment
    and is awaiting

    the next transmission:


    ```

    Host A <-----SYN(ISN+1)/ACK----- Host B

    ```


    Step 3

    Complete the negotiation by sending a final acknowledgment to the remote host.'
