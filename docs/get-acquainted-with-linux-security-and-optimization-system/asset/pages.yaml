    IP address

    mapping file. It is very similar to the "hosts" format, except that the hostname
    component

    must correspond to the Net BIOS naming format.


    Create the inhosts file (touch /etc/inhosts) and add:


    ```

    # Sample Samba inhosts file.

    #

    127.0.0.1 localhost

    192.168.1.1 deep

    192.168.1.4 win

    ```


