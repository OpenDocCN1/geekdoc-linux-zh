  md: 'Comments and suggestions concerning this page should be mailed to gnourian@videotron.ca


    any critical filesystem, putting "/var" and "/usr" on separate partitions is also
    a very good idea. By isolating the "/var" partition, you protect your root partition
    from overflowing.


    In our partition configuration we reserve 400 MB of disk space for chrooted programs
    like Apache, DNS and other software. This is necessary because Apache DocumentRoot
    files and other binaries, related to Apache will be installed in this partition.


    Take a note that the size of the Apache chrooted directory is proportional to
    the size of your "DocumentRoot" files. If you''re not intended to install and
    use Apache on your server, you can reduce the size of this partition to something
    like 10 MB for DNS that you need.


    # Minimum size of partitions


    This is the minimum size in megabyte of a Linux installation that may function
    properly. The sizes of partitions listed below are really small. This configuration
    can fit in any very old hard disk of 512MB that we can find on old 486 computers.
    I show you this partition just to get an idea only.


    +   / 35MB

    /boot 5MB

    /chroot 10MB

    /home 100MB

    /tmp 30MB

    /usr 232MB

    /var 25MB


    # Disk Droid


    Disk Droid is a program that partition your hard drive for. Choose "Add" to add
    new partition, "Edit" to edit partition, "Delete" and "Reset" to reset partition
    to the original state. When adding a new partition, a new window appear on your
    screen and give you parameters to choose. Different parameters are:


    **Mount Point:**where you want to mount your partition.

    **Size (Megs):**for the size of your partition in megabyte.

    **Partition Type:**native for Linux Ts and Swap for Linux Swap.


    If you have a SCSI device the will be "/dev/sda" and if you have an IDE disk it
    will be "/dev/hda". If you looking for performance and stability, a SCSI disk
    is highly recommended.


    Linux refers to disk partitions using a combination of letters and numbers. It''s
    a naming scheme that is more flexible and conveys information the approach used
    by other operating systems. Here is a summary:


    **First Two Letters –**the first two letters of the partition name indicate the
    type of device on which the partition resides. You''ll normally see either "hd
    (for IDE disks), or "sd" (for SCSI disks).


    **The Next Letter –**this indicates which device the partition is on. For example,
    "/dev/hda" (the first IDE disk) and "/dev/hdb" (the second IDE disk).


    Keep this information in mind, it will make things easier to understand when you''re
    setting up the partitions Linux requires.


    # A swap partition


