    \ do not need to restore files contained in the archive, you can specify one or\
    \ more files that you wish to restore, in the following example:\n\n+   * To specify\
    \ one or more files that you wish to restore\n\n© Copyright 1999 Open Network\
    \ Architecture ®\n\n340"
