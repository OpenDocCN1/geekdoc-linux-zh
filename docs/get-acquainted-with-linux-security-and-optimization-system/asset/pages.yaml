  md: '# # "/etc/mail/virtertable, domainable, mailertable, and virtertable.db, domainable.db,
    mailertable.db" files for the Central Mail Hub


    Some sites need to use multiple domain when transitioning from an old domain to
    a new one. The domainable feature enables transitions to operate smoothly by rewriting
    the old domain to the new.


    A virtertable is a database that maps virtual domains into news addresses. A domain-specific
    format of aliasing, allowing multiple virtual domains to be hosted on one machine.


    A mailertable is a database that maps "host.domain" names to special delivery
    agent and new domain name pairs. This can be used to override routing for particular
    domains.


    +   To use the virtertable, domainable, mailertable, and their corresponding ".db
    files into `/etc/mail` directory, use the following commands:


    ```

    [root@dead]# for map in virtertable domainable mailertable

    > do

    > touch /etc/mail/${map}

    > chmod 0644 /etc/mail/${map}

    > makemap /etc/mail/${map}.db < /etc/mail/${map}

    > done

    ```


