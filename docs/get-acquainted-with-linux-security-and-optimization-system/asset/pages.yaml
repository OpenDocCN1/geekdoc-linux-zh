    # # Configuration of the "usr/TSS/policy/twpol.txt" file


    The "usr/TSS/policy/twpol.txt" is a text file that specifies files and directories,
    called system objects, to check. A rule specifies check the object you want to
    monitor, and a property is what specifies how to check. A property mask specifies
    individual properties of a file to examine during integrity checks. Take a note
    that editing the policy file can take several iterations as you establish by experience
    what information you want to appear in the Tripwire reports.


    Step1

    You must modify the default policy file, or create your own. The "policy.guide.txt"
    file under /usr/TSS/policy/twpol.txt with a text editor (vi /usr/TSS/policy/twpol.txt)
    and change it to look like:


    ```

    @section GLOBAL

    TWROOT="/usr"

    TWBIN="/usr/bin"

    TWPOL="/usr/TSS/policy";

    TWDB="/usr/TSS/db";nTWKEY="/usr/TSS/key";

    WLKEY="/usr/TSS/key";nWLKEYREPORT="/usr/TSS/report";nHOSTNAME=deep.openarch.com.

    ```


    ```

    @section FS

    SEC_OPT = $(ignoreNone)_Sha; # Critical files - we cannot afford to make any changes.

    SEC_SUID = $(ignoreNone)_Sha; # Binaries with the UID and SGID flags. Members
    of the Trusted Computing Base.

    SEC_C = $(ReadOnly); # Binaries that shouldn''t change.

    SEC_BIN = $(ReadOnly);

    SEC_CONFIG = $(Dynamic); # Config files that are changed

    SEC_LOG = $(Growing); # Files that should never change ownership.

    SEC_INVARIANT = +pkg; # Directories that should never change permission or ownership.

    SIG_LOW = 33; # Non-critical files that are of minimal security impact

    SIG_MED = 66; # Non-critical files that are significant of security impact

    SIG_HI = 100; # Critical files that are significant points of vulnerability

    ```


