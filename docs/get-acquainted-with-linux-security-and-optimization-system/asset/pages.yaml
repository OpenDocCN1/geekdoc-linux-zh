    # Build a kernel with IPX support and NCP protocol


    The first thing you need to do is ensure that your kernel has been built with
    IPX support enabled and NCP protocol. In the 2.2.14 kernel you must ensure that
    you have answered Y to the following question:


    +   The IPX protocol (CONFIG_IPX) N

    NCP filesystem support (CONFIG_NCP_PS) N

    Packet signature (CONFIG_NCPFS_PACKET_SIGNING) N

    Clear remove/delete itself when needed (CONFIG_NCPFS_STRONG) N

    Use NFS namespace if available (CONFIG_NCPFS_NFS) N

    Use LONG (0/2) namespace if available (CONFIG_NCPFS_OS_2 No) Y

    Allow mounting of volume subdirectories (CONFIG_NCPFS_MOUNT_SUBDIR) N

    Enable symbolic links and ensure flags (CONFIG_NCPFS_EXTRAS) N


    # Trying to set up an IPX network interface without TCP/IP


    You can have the interface active without protocols to be in. Instead of using
    ifconfig to place IP numbers, simply say ifconfig eth0 up


    Assuming you want to set up eth1 as an IPX network interface without TCP/IP, you
    must check that the following file exists (ifcfg-eth1) and be sure the lines IPADDR,
    NETMASK, NETWORK and BROADCAST contain values:


    ```

    [root@local]# vi /etc/sysconfig/network-scripts/ifcfg-eth1


    DEVICE=eth1

    IPADDR=

    NETMASK=

    BROADCAST=

    ONBOOT=none

    BOOTPROTO=none

    USERCTL=

    ```


    After, all you have to do is restart the network daemon with the command:

    /etc/rc.init/d/network restart and make sure the Ethernet card exists with the
    command: config eth1 up.


    Since Linux by default configure the IPX protocol on both interfaces (eth0 and
    eth1) and make the first card the primary interface (eth0) you must deactivate
    the IPX protocol on this card (eth0) because we want to use our second card (eth1)
    to transfer IPX data''s.


    To make this, use the command: ipx_interface_def eth0 802.3. If you make an ifconfig,
    you will see that our network interfaces are configured in this way: eth0 TCP/IP
    protocol only and IPX protocol only.


