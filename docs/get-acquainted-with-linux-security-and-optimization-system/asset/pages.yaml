- img_proc: true
  md: "Comments and suggestions concerning this page should be mailed to gmourani@videotron.ca\n\
    \n```\nrm -f /var/lock/subsystems/ldap\nrm -f /var/run/slapd.args\n\n;\nfi\nstatus\
    \ slapd?\nRETVAL=$\nif [ $RETVAL -eq 0 ]; then\n  if grep -q \"replofile\" /etc/openldap/slapd.conf;\
    \ then\n    status slurpd\n    RETVAL=$$\n  fi\nfi\n\nstart)\n$0 stop\n$0 start\n\
    RETVAL=$\n\nreload)\nkillproc -HUP slapd\nRETVAL=$\nif [ $RETVAL -eq 0 ]; then\n\
    \  if grep -q \"replofile\" /etc/openldap/slapd.conf; then\n    killproc -HUP\
    \ slurpd\n    RETVAL=$$\n  fi\nfi\n\n)\necho \"Usage: $0 start|restart|status]\"\
    \nexit 1\n```\n\nexit $RETVAL\n\nNow, make this script execute and change its\
    \ default permission:\n[root@deep]# chmod 700 /etc/rc.d/init.d/ldap\n\nCreate\
    \ the symbolic rc.d links for OpenLDAP with the command:\n[root@deep]# chkconfig\
    \ --add ldap\n\nOpenLDAP will not start automatically the slapd daemon when you\
