    program that require some specific needs like for example: vminuz-2.2.14 instead
    of vminuz-2.2.14.a


    +   2. Copy the file `/usr/src/linux/System.map` from the kernel tree to `/boot`
    directory, and give it an appropriate name.


    ```

    [root@deep]# cp /usr/src/linux/System.map /boot/System.map-kernel.version

    ```


    +   3. Cd into the "boot" directory and rebuild the links vminuz and System.map
    with the following commands:


    ```

    [root@deep]# cd boot

    [root@deep]# In -s vminuz-kernel.version vminuz

    [root@deep]# In -s System.map-kernel.version System.map

    ```


    We must rebuild the links of "vminuz" and "System.map" to point them to the new
    kernel version installed. Without them LILO program will look by default for the
    old version of your linux kernel.


    +   4. Remove obsolete files under "boot" directory to make space:


    ```

    [root@deep]# rm -f module-info

    [root@deep]# rm -f initrd-2.2.12-20.img

    ```


    The "module-info" links to the old modules of your original kernel. Since we are
    installed a brand kernel, we don''t need to keep this broken link. The "initrd-2.2.12-20"
    is a file that contains an internal RAM image that serves as a system before the
    disk is available. This file is only available and installed from the linux setup
    installation if you have a SCSI adapter present. If we use a SCSI system, the
    driver is now incorporated in the Linux kernel since we have built a monolithic
    kernel. So we can remove this file safety.


    +   5. Create a new Linux directory that will handle all header files related
    to Linux kernel for compilation of all programs on your system.


    When, we recall that we use symlinks under the "include" to point to the kernel
    to be able to compile it without receiving error and also to be complete programs.
    The "include" directory is where header files of your Linux system are kept for
    reference and dependencies when you compile and install new programs. The asm,
    linux, and sc links are used when program require to know some functions in compile
    time specific. Other header on the "include" directory are called by program installed
    on your system. When they must to know specific information, etc of your system.


    ```

    [root@deep]# mkdir -p /usr/src/linux-2.2.14/include

    [root@deep]# cp -r /usr/src/linux/include-generic /usr/src/linux-2.2.14/include

    [root@deep]# cp -r /usr/src/linux/include/x86 /usr/src/linux-2.2.14/include

    [root@deep]# cp -r /usr/src/linux/include /usr/src/linux-2.2.14/include

    [root@deep]# cp -r /usr/src/linux/asm /usr/src/linux-2.2.14/include

    [root@deep]# cp -r /usr/src/linux/video /usr/src/linux-2.2.14/include

    [root@deep]# cp -r /usr/src/linux/scsi /usr/src/linux-2.2.14/include

    [root@deep]# rm -rf /usr/src/linux

    [root@deep]# cd /usr/src

    [root@deep]# In -s /usr/src/linux-2.2.14 linux

    ```


