    # DNS Administrative Tools


    The commands listed below are those that we use in our regular use but much more
    exist and you must check the page and documentation for more details and information.


    # dig


    The ''db.cache'' tells you where the servers for the ''root'' zone are. It be
    updated periodically. The root name servers do not change very often, but they
    do change. A good practice is to check your ''db.cache'' file every month or two.


    +   * Using the following command to query a new db.cache file for your DNS Server:

    [root@deep] dig @root-servers.net -ns db.cache

    Copy the db.cache file to /var/named/ after retrieving it.


    Where @root-servers.net is the address of the root server for query the new db.cache
    file and db.cache file is the name of your new db.cache.


    # ndc


    This command allows the system administrator to control the operation of a name
    server. If no command is given, ndc will prompt for commands until it reads EOF.


    +   * Type ndc on your terminal and then to help to see help on different command.

    [root@deep]# ndc

    [root@deep]# ndc help


    # DNS Users Tools


    The commands listed below are some that we use in our regular use but much more
    exist and you must check the page and documentation for more details and information.


    # nslookup


    nslookup is a program to query Internet name servers. nslookup has two modes:
    interactive and non-interactive. Interactive allows the user to query name servers
    for information about various hosts and domains to print a list of hosts in a
    domain. Non-interactive mode is used to print just the name and requested information
    for a host or domain.


    Interactive have a lot options, better approach will be to see the page nslookup
    for information about Interactive mode or by typing under nslookup mode.


