    # Starting and stopping daemon services


    Init is the program that runs by the kernel at boot time. It is in charge of starting
    all the normal processes that need to run at boot. These include the APACHE daemons,
    NETWORK daemons, and anything else you want to run when your machine boots.


    How does init start and stop services? Each of the scripts is written to accept
    an argument, which can be "start" and "stop" and are located under `/etc/rc.d/init.d/`
    directory. You can execute these scripts by hand with a command like:


    For example:


    +   - To start the httpd Web Server manually under Linux.

    [root@deep#] /etc/rc.d/init.d/httpd start


    +   - To stop the httpd Web Server manually under Linux.

    [root@deep#] /etc/rc.d/init.d/httpd stop


    Check your `/etc/rc.d/init.d/` directory for services available and use command
    start | stop to work.


