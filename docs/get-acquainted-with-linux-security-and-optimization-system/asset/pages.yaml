  md: '# Making an emergency boot floppy


    The first pre-install is to make an emergency boot floppy (if you haven''t made
    one already). You can simply do this with the mkbootdisk command.


    First find out what kernel, you are currently using. Check your "/etc/lilo.conf"
    file and see which image was booted from. In my example, I have the following
    in the file.


    ```

    [root@deep]# cat /etc/lilo.conf

    boot=/dev/sda

    map=/boot/map

    install=/boot/boot.b

    prompt

    timeout=50

    image=boot/vmlinux-2.2.12-20

    label=linux

    root=/dev/sda6

    initrd=/boot/initrd-2.2.12-20.img

    read-only

    ```


    Now you will need to find the image that you booted. On a standard install, it
    will be the-labeled kernel. The above example shows that the machine booted the
    "/boot/vmlinux-2.2.12-20" kernel. Now simply use a formatted 1.44 floppy in your
    system, and make sure you root have logged in as.


    ```

    [root@deep]# mkbootdisk --device=/dev/fd0 2.2.12-20

    Insert a disk in dev/fd0. Any information on the disk will be lost.

    Press <Enter>to continue or <C> to abort

    ```


    Following these guidelines, you will have a boot floppy with a working kernel
    in case of problems with the upgrade. I recommend rebooting with the floppy to
    make sure that the floppy works correctly.


