  md: '# Overview


    Network management covers a wide variety of topics. In general it includes gathering
    data and information about parts of your network, and taking action as necessary
    to deal with failures and other changes. The most primitive technique for network
    monitoring is periodic "pinging" of critical hosts. More sophisticated network
    monitoring requires the ability to get specific status and statistical information
    from various devices on the network. These should include various sorts of datagram
    counts, as well as counts of errors of various kinds.


    In this chapter we will try to answer fundamental questions about networking devices,
    files related to networking functionality, essential networking commands and TCP/IP
    security overview.


    # Install more than one Ethernet Card per Machine


    You might use Linux as a gateway between two Ethernet networks. In that case,
    you might have two Ethernet cards on your server. To eliminate problems at boot
    time, the Linux kernel doesn''t detect multiple cards automatically. If you have
    two or more cards, you should specify the parameters of the cards using the `filo.conf`
    file for a monolithic kernel or the `conf.modules` file for a modularized kernel.


    # If the driver(s) are being used as a loadable module (modularized kernel)


    In the case of PCI drivers, the module will typically detect all the installed
    cards automatically. For ISA cards, you need to supply the I/O base address of
    the card so the module knows where to look. This information is stored in the
    file `/etc/conf.modules`.


    As an example, we have two ISA 3c509 cards, one at I/O 0x300 and one at I/O 0x320.


    For ISA cards, edit the `conf.modules` file (vi /etc/conf.modules) and add:


    ```

    alias eth0 3c509

    alias eth1 3c509

    options 3c509 io=0x300,0x320

    ```


    This says that the 3c509 driver should be loaded for eth0 or eth1 (alias eth0,
    eth1) and it should be loaded with the options that drivers know where to look
    for the cards. That 0x is important – things like 300h as commonly used in the
    DOS world won''t work.


    For PCI cards, you only need to alias the eth interfaces with the appropriate
    driver name, since the I/O base of a PCI card can be safely detected.


    For PCI cards, edit the `conf.modules` file (vi /etc/conf.modules) and add:


    ```

    alias eth0 3c509

    alias eth1 3c509

    ```


    # If the drivers(s)/are compiled into the kernel (monolithic kernel)


    PCI probes will find all related cards. ISA cards will also find all related cards
    automatically, but in some circumstance ISA cards still need to do the following.
    This information'
