    # 39. Finding “.hosts" files


    The “.hosts" files should be a part of your regular system administration duties,
    as these files should not be permitted on your system. Remember that a cracker
    needs only one insecure account to potentially gain access to your entire network.


    +   - You can locate all “.hosts" files on your system with the following command:

    `[root]@]# find /home -name_hosts`


    You can also use a cron job to periodically check, report the contents of and
    delete $HOME/.hosts files. Also, users should be aware that this type of audit,
    as directed by policy.


    +   - To use a cron to periodically check and report via mail all “.hosts" files,
    do the following:


    Create as root "find_hosts" script file under "/etc/cron.daily/" directory (touch
    /etc/cron.daily/find_hosts_files) and add the following lines in this script file:


    ```

    #!/bin/sh

    /usr/bin/find -name_hosts | cat <<EOF

    This is an automated report of possible event “.hosts" files on the server

    deep.openarch.com, generated by the utility command.


    New detected “.hosts" files under the "home" directory include:

    EOF

    cat

    ) | /bin/mail -s "Content of .hosts file audit report"

    ```


    Now make this script file executable then change, verify the owner, and get report
    by "root"

    `[root]@]# chmod 755 /etc/cron.daily/find_hosts_files

    `[root]@]# chmod 0.0 /etc/cron.daily/find_hosts_files


    Each day a mail will be sent to "root" with a subject: "Content of .hosts file
    audit report"

    containing potential finding “.hosts" files.


