    # If CLOBBER is false, existing files are not overwritten.

    CLOBBER=false


    # The root of the TSS directory tree.

    TWROOT="/usr"


    # Tripwire binaries are stored in TWBIN.

    TWBIN="$(TWROOT)/bin"


    # Tripwire policy files are stored in TWPOLICY.

    TWPOLICY="$(TWROOT)/TSS/policy"


    # Tripwire manual pages are stored in TWMAN.

    TWMAN="$(TWROOT)/man"


    # Tripwire database files are stored in TWDB.

    TWDB="$(TWROOT)/TSS/db"


    # The Tripwire site key are stored in TWITESKEYDIR.

    TWITESKEYDIR="$(TWROOT)/TSS/key"


    # The Tripwire local key are stored in TWOLOCALKEYDIR.

    TWLOCALKEYDIR="$(TWROOT)/TSS/key"


    # Tripwire report files are stored in TWREPORT.

    TWREPORT="$(TWROOT)/TSS/report"


    # This sets the default text editor for Tripwire.

    WEDITOR="/bin/vi"


    # TWLATEPROMPING controls the point when tripwire asks as for a password.

    TWLATEPROMPING=false


    # TWLOOSESEDIRCK selects the directory should be monitored for

    # properties that change when files in the directory are monitored.

    TWLOOSESEDIRCK=false


    # TWMAILVIOLATIONS determines whether Tripwire sends a no violation

    # report when integrity check is run with -email report but no rule

    # violations are found. This lets the admin know that the integrity

    # was run, as to having failed for some reason.

    TWMAILVIOLATIONS=true


    # TWMAILREPORTLEVEL determines the verbosity of e-mail reports.

    TWMAILREPORTLEVEL=3


    # TWREPORTLEVEL determines the verbosity of report printouts.

    TWREPORTLEVEL=3


    # TWSYSLOG determines whether Tripwire will log to the system log

    TWSYSLOG=false


