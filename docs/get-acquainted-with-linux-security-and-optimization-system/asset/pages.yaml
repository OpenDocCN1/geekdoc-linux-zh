    \ chkconfig -level 345 ldap on\n\nStart your OpenLDAP manually with the following\
    \ command:\n[root@deep]# /etc/rc.d/init.d/ldap start\n\n# Securing OpenLDAP\n\n\
    Immunize important configuration files\nThe immutable bit can be used to prevent\
