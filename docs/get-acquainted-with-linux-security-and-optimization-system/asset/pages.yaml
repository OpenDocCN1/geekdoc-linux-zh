    # The ip_local_port_range parameter


    This documentation is for the sysctl files in "proc/sys/net/ipv4/ip_local_port_range"
    and is valid for Linux kernel version 2.2. ip_local_port_range - INTEGERS.


    Defines the local port range used by TCP and UDP to choose the local port. The
    first number is the first (port), the second last port number. For high-usage
    systems change this to 32768-61000


    ```

    echo "32768 61000" > /proc/sys/net/ipv4/ip_local_port_range

    ```


    Add the above commands to "/etc/rc.d.local" file and you''ll not have to type
    it again the next time you reboot your system.


    # Physical memory


    The most important resource for Squid is physical memory. Your processor does
    not need to be ultra-fast. Your disk system will be the major bottleneck, so fast
    disks are important for high-volume caches. Do not use IDE disks if you can help.


