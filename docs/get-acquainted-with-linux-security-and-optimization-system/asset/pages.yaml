    The "sh -f" command would build and make the necessary dependencies in "obj.Linux-architecture"
    of the different files required by sendmail build installation on your system.


    The "make install" command would install sendmail, mailmaps, paliases, smsh binaries
    and links as well as the making pages on your system.


    The "ls -s" command would create a symbolic link of sendmail binary to "/usr/lib"
    directory. It is requiring since some programs hope to find sendmail in this directory
    (/usr/lib).


    The "strip" command would reduce the size of mailmats, paliases, smsh, and makemap
    binaries for optimum performance.


    The install command would create the directory "mqueue" with permission 755 under
    "var/spool. A message can be temporarily undeliverable for a wide variety of reasons.
    To ensure that such messages are eventually delivered, sendmail stores them in
    its queue directory until they can be delivered successfully.


    The "chown" command would make UID and GID to "root" for files: mailmats, makemap,
    paliases, smsh, and UID "root" GID "mail" for mqueue directory.


    The "mkdir" command would create "etc/mail" and "etc/smsh" directories on your
    system.


    NOTE: The programs "makemap" and "paliases" must be installed on the Central Mail
    Hub Server. The "makemap" program to create databases like the "etc/aliases" or
    the "etc/mail/access" files will display the sendmail aliases (the content of
    /etc/aliases file). Since it is better to have only one place like the Central
    Mail Hub to handle and manage all the db in our network, it is not necessary to
    use "makemap", and "paliases" programs to build db files on your other hosts in
    the network.


