    # # The "/etc/sysconfig/network" file


    The "etc/sysconfig/network" file is used to specify information about the desired
    network configuration on your server.


    Following is a sample "etc/sysconfig/network" file:


    ```

    NETWORKING=yes

    FORWARD_IPV4=yes

    HOSTNAME=deep.openarch.com

    GATEWAY=0.0.0.0

    GATEWAYDEV=

    ```


    The following values may be used:


    NETWORKING=answer, where answer is yes or no (configured or not configured).


    FORWARD_IPV4=answer, where answer is yes or no (perform IP forwarding not IP forwarding).


    HOSTNAME=hostname, where hostname is the hostname of your server.


    GATEWAY=gw-ip, where gw-ip is the IP address of the network''s gateway.


    GATEWAYDEV=gw-dev, where gw-dev is the gateway device like eth0.


    **NOTE:** For compatibility with older software, the /etc/HOSTNAME file should
    contain the same value as HOSTNAME=hostname. above.


    # # The "etc/hosts" file


    As your machine gets started, it will need to know the mapping of some hostnames
    to IP addresses before DNS is referenced. This mapping is kept in the "etc/hosts"
    file. In the absence of a name server, any network program on your system uses
    this file to determine the IP address that corresponds to a host.


    Following is a sample "etc/hosts" file:


    | IP Address | Hostname | Alias |

    |---|---|---|

    | 127.0.0.1 | localhost | gate.openarch.com |

    | 208.164.1.1 | gate.openarch.com | gate |

    | 208.164.1.2 | forest.openarch.com | forest |

    | 208.164.1.3 | deep.openarch.com | deep |


    The leftmost column is the IP address to resolve. The next is that host''s name.
    Any subsequent columns are aliases for host. In the second line, for example,
    the address 208.164.1.1 if the host gate.openarch.com. Another name for gate.openarch.com
    is gate.


    After you are finish to configure your networking files, don''t forget to restart
    the network for the change to take effect.


    +   - To restart your network, use the command:

    [root@deep]# /etc/rc/init.d/network restart


    **IMPORTANT: The tcpd** command is responsible to monitored requests for **telnet,
    ftp** and other services that have a one-to-one mapping onto executable files.


    © Copyright 1999 Open Network Architecture ®


