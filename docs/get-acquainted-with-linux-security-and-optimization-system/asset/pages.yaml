  md: 'Comments and suggestions concerning this page should be mailed to <a href="mailto:gmourani@videotron.ca">gmourani@videotron.ca</a>


    IPADDR=addr, where addr is the IP address.


    NETMASK=mask, where mask is the netmask value.


    NETWORK=addr, where addr is the network addresses.


    BROCAST=addr, where addr is the broadcast address.


    ONBOOT=answer, where answer is yes or no (active or inactive at boot time).


    BOOTPROTO=proto, where proto is one of the following:


    +   * None No boot protocol should be used.

    * boot The boot protocol should be used.

    * dhcp The dhcp protocol should be used.


    USERCTL=answer, where answer is one of the following:


    +   * yes Non-root users are allowed to control this device.

    * no Non-root users are not allowed to control this device.


    # ## The `/etc/resolv.conf` file


    This file is another text file used by the resolver—library that determines the
    IP address for a host name.


    Following is a sample `/etc/resolv.conf` file:


    ```

    search openarch.com

    nameserver 208.164.186.1

    nameserver 208.164.186.2

    ```


    **NOTE:** Name servers are queried in the order they appear in the file.


    # ## The `/etc/host.conf` file


    This file specifies how names are resolved. Linux uses a resolver library to obtain
    the IP address corresponding to a host name.


    Following is a sample `/etc/host.conf` file:


    ```

    # Lookup names via DNS then fall back to /etc/hosts.

    order hosts dns

    # We have machines with multiple addresses.

    multi on

    # Check for IP address spoofing.

    nspoof on

    ```


    The **order** option determines the order of services. The sample entry specifies
    that the resolver library should first consult the name server to resolve a name
    and then the `/etc/hosts.conf`.


    The **multi** option determines whether a host in `/etc/hosts.conf` file can have
    multiple IP addresses (multiple interface ethN). Hosts that have more than one
    IP address are said to be multimed, because the presence of multiple IP addresses
    implies that host has several network interfaces.


    The **nspoof** option indicates to take care of permit spoof on this machine.
    IP-Spoofing is a security exploit that works by tricking computers in a trust
    relationship that you are someone that you really aren''t.


