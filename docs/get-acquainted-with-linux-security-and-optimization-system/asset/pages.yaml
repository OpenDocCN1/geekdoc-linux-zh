    # FEATURE(local_procmail)


    This m4 macro enables the use of "procmail as local delivery agent". The procmail
    program can handle a user''s mail (for example, sorting into folders by subject)
    and can function as a Sendmail delivery agent.


    # FEATURE(nouuccp)


    This m4 macro enables the "eliminate all UUOC support". If your sites want nothing
    to do with UUOC exceptions, you can enable the nouuccp feature. The macros that
    relate to UUOC are ignored.


    # MAILER(procmail) and MAILER(smtp)


    Delivery agents are not automatically declared. Instead, you must specify which
    ones you want to use and which ones to ignore with the MAILER m4 macro. MAILER(procmail)
    and MAILER(smtp) cases support procmail, smtp, smtp8 and relay delivery agents
    to be included.


    # FEATURE(access, db)


    Turns on the access database gives you the ability to allow or reject mail accept
    from specific domains for administrative reasons. For example, you may choose
    to reject all mailing from known spammers.


    # FEATURE(blacklist_recipients)


    Turns on the ability to block mailing for certain recipient users, usernames,
    or addresses. For example, you can block mailing to user nobody, host foo.mydomain.com,
    or guest@bar.mydomain.com.

    `http://maps.vix.com` is used, this is a database maintained in DNS of servers.
    For details see "http://maps.vix.com/".


    # FEATURE(rbl)


    This will cause sending to reject mail in the Realtime Blackhole List database.
    If an argument is proved; otherwise, the main RBL server at `maps.vix.com` is
    used, this is a database maintained in DNS of servers.


    NOTE: A domain may end in the RBL list with which you wish to continue communications
