    \ ca` command has some string requirements and the default OpenSSL config doesn't\
    \ allow easily to use `openssl ca` directly. We will create this `sign.sh` program\
    \ to replace it.\n\nCreate the `sign.sh` program file (touch `/usr/bin/sign.sh`)\
    \ and add to this file:\n\n```\n#!/bin/sh\n##\n## sign.sh -- Generate a SSL Certificate\
    \ Request (CSR)\n## Copyright (c) 1998-1999 Ralph S. Engelschall, All Rights Reserved.\n\
    ##\n# argument line handling\nCSR=$1\nif [ $# -ne 1 ]; then\n  echo \"Usage:sign.sign\
    \ <whatever>.csr\"; exit 1\nfi\nif [ ! -f $CSR ]; then\n  echo \"CSR not found:\
    \ $CSR\"; exit 1\nfi\ncase $CSR in\n  * .csr) CERT=$(echo $CSR | sed -e 's/\\\
    .csr/\\.crt/')\" ;\n  *) CERT=\"$CSR.crt\";\nesac\n# make sure environment exists\n\
    if [ ! -d ca.db.certs ]; then\n  mkdir ca.db.certs\nfi\nif [ ! -f $ca.db.serial\
    \ ]; then\n  echo '01'>ca.db.serial\nfi\nif [ ! -f $ca.db.index ]; then\n  cp\
    \ /dev/null ca.db.index\nfi\n# create an own SSLay config\ncat-ca.config <<EOF\n\
    [ca]\ndefault_ca = CA_own\ndir = /etc/ssl\ncerts = /etc/ssl/certs\nnew_certs_dir\
    \ = /etc/ssl/ca.db.certs\ndatabase = /etc/ssl/ca.db.index\nserial = /etc/ssl/ca.db.serial\n\
    RANDFILE = /etc/ssl/ca.db.rand\ncertificate = /etc/ssl/certs.crt\nprivate_key\
    \ = /etc/ssl/private/ca.key\ndefault_days = 365\ndefault_crt_days = 30\ndefault_md\
