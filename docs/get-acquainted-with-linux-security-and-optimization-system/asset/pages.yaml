    log transfers

    You probably should log all transfers for security purposes. The format of this
    command is:


    log transfers <typelist> -<directions>


    Where <typelist> is a comma-separated list specifying which kinds of users should
    be logged (**anonymous, guest, real**), and <directions> is a comma-separated
    list specifying which direction the transfers must track in order to be logged.
    The two directions you can choose to are inbound and outbound.


    For example, to log all **real** and **guest** transfers that are both inbound
    and outbound, you would use the following:


    ```

    log transfers real,guest,inbound,outbound

    ```


    The resulting logs are stored in the `/var/log/xferlog` file.


    guestgroup

    This command allow you to specify all of guestgroups, one line.

    `/home/ftp/etc/group` has entries for each of these groups, each of which has
    just one member.


    For example:

    **guestgroup ftpadmin**

    **guestgroup webmaster**


    log security

    Enables logging of violations of security rules (nretrieve, .notar, ...) for real
    guest, and/or anonymous users.


    log security <typelist> is a comma-separated list of any of the keywords "**anonymous**","**guest**"
    and "**real**". If the "real" keyword is included, logging will be done for users
    using FTP to access real accounts, and if the "anonymous" keyword is included
    logging done for users using anonymous FTP. The "guest" keyword matches guest
    access accounts.


    For example:

    **log security real,guest**


    restricted-uid, restricted-gid and guest-root

    These clauses control whether or not **real** or **guest** users will be allowed
    access to areas on the FTP site outside their home directories. An example of
