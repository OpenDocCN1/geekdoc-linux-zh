    # Configuration of the /etc/rc.d/init.d/firewall script file for the Gateway Server


    This is the configuration script file for our Gateway Server machine. This configuration
    allow, unlimited traffic on the Loopback interface, ICMP, DNS Server and Client
    (53), SSH Server and Client (22), HTTP Server and Client (80), HTTPS Server and
    Client (443), POP Client (110), NNTP News and Client (119), SMTP Server and Client
    (25), IMAP Server and Client (143), IRC Client (6667), ICQ Client (4000), FTP
    Client (20), RealAudio / QuickTime Client, and OUTGOING ROUTRACER runs default.


    If you don''t want some services listed in the firewall rules for the Gateway
    Server that I make ON by default, comment them out with a #" at the beginning
    of the line. If you want some other services that I commented out with a #", then
    remove the "#" at the beginning of your lines. If you are configured Masquerading
    on your server, uncomment the modules necessary to masquerade their respective
    services that you need like ip_masq_rc.o, ip_masq_radio.o, etc.


