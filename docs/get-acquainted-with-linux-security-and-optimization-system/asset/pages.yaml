    The line openarch 208.164.186.*


    Allows only guest users with accounts on the FTP server access to their accounts
    via FTP they are coming from the 208.164.186.*


    limit

    The limit command allows you to control the number of users who log in to the
    system via FTP by

    class and time of day. The format of the limit command is:


    limit <class> <time> <message_file>


    Where <class> is the class list, <time> is the maximum of people allowed in that
    class, <time> is the duration which the limit is in effect, and <message_file>
    is the file that should be displayed to the client when the limit is reached.


    The format of the <time> parameter is in the form of a comma-delimited string,
    where each option is for a separate day. Sunday through Saturday take the form
    Su, Mo, Tu, We, Th, Fr, Sa, and all weekdays can be referenced as Wk. Time should
    be kept in military format without a colon separating the hours and minutes. The
    character specifies a range.


    For example, to limit openarch to 20 users from Monday through Thursday, all day,
    and Friday from midnight to 6:00 p.m., you would use the following limit line:


    ```

    limit openarch 20 MoTuWeTh,Fr0000-1800/ftp/.too_many.msg

    ```


    In this case, if the limit is hit, the contents of the file "/home/ftp/.too_many.msg"
    are displayed to the connecting user.


    loginfails

    The loginfails command allows you to set the number of failed login attempts clients
    can make before disconnecting them. You can set it by using the command:


    ```

    loginfails <n>

