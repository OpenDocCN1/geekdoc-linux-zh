    # The "etc/aliases" file


    The aliases file can be used to gain privileged status if it is poorly or carelessly
    administered. For example, many vendors use to ship systems with a "decode" alias
    as file. This practice is becoming less common.


    The intention is to allow users to transfer binary files using mail. At the sending
    site the user converts the binary to ASCII with `uuencode`, then mails the result
    to the "decode" alias at the receiving site. That pipes the mail message through
    converts the ASCII back into the original binary file.


    Remove the "decode" alias. Similarly, every alias that executes a program -you
    did not place yourself and check completely- should be questioned and probably
    removed. For this change to take effect you will need to run:


    ```

    [root@deep]#usr/bin/newaliases

    ```


    Edit the aliases file (/etc/aliases) and remove the following lines:


    ```

    # Basic system aliases.

    MAILER-DAEMON: postmaster

    postmaster: root


    # General redirections for persone accounts.

