    Now, if we have a firewall on the remote server (we are supposed to have), we
    must add or verify the existence of the following lines:


    ```

    ipchains -A -i $EXTERNAL_INTERFACE -p udp \

    -s $SYSLOG_CLIENT \

    -d $IPADDR 514 -j ACCEPT

    ```


    Where EXTERNAL_INTERFACE="eth0" in the firewall file.

    Where IPADDR="208.164.186.2" in the firewall file.

    Where SYSLOG_CLIENT="208.164.186.0/24" in the firewall file.


    +   - Now restart your firewall on the remote host for the change to take effect:

    [root]# /etc/rc.d/init.d/firewall restart


