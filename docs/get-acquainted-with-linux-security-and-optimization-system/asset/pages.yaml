  md: "Comments and suggestions concerning this page should be mailed to gmnourani@videotron.ca\n\
    \n# Configuration of the \"/etc/rc.d/init.d/ldap\" script file\n\nConfigure your\
    \ \"/etc/rc.d/init.d/ldap\" script to start and stop ldap Server.\n\nCreate the\
    \ ldap script file (touch /etc/rc.d/init.d/ldap) and add:\n\n```\n#!/bin/sh\n\
    # ldap This shell script takes care of starting and stopping\n# ldap servers (slapd\
    \ and slurped).\n# chkconfig: 70-40\n# description: LDAP for Lightweight Directory\
    \ Access Protocol, used \\\\\n# for implementing the industry standard directory\
    \ services.\n# processname: slapd\n# config: /etc/openldap/slapd.conf\n# pidfile:\
    \ /var/run/slapd.pid\n\n# Source function library.\n./etc/rc.d/init.d/functions\n\
    \n# Source networking configuration.\n./etc/sysconfig/network\n\n# Check that\
    \ networking is up.\n[$($NETWORKING) = \"no\"] && exit 0\n\n[- -f /usr/sbin/slapd\
    \ ]] || exit 0\n[- -f /usr/sbin/slurped ]] || exit 0\n\nRETVAL=0\n\n# See how\
    \ we were called.\ncase \"$1\" in\nstart)\n# Start \"Starting ldap:\"\necho -n\
    \ \"\"\ndemon slapd\n\tRETVAL=$?\nif [ $RETVAL -eq 0 ]; then\n\tgrep -q \"replofile\"\
    \ /etc/openldap/slapd.conf; then\n\tdemon slurped\n\tRETVAL=$?\nfi\n[ $RETVAL\
    \ -eq 0 ] && kill pid slurped | cut -f 1 -d \" \" > /var/run/slurped\n\n\ntecho\n\
    \t [$RETVAL -eq 0 ] && touch /var/lock/subsystems/ldap\n:;\nstop)\n# Stop daemons.\n\
    echo -n \"Shutting down ldap:\"\nkillproc slapd\nRETVAL=$?\nif [ $RETVAL -eq 0\
    \ ]; then\n\tgrep -q \"replofile\" /etc/openldap/slapd.conf; then\n\tkillproc\
    \ slurped\n\tRETVAL=$?\nfi\n\ntecho\nif [ $RETVAL -eq 0 ]; then\n```\n\n© Copyright\
    \ 1999 Open Network Architecture ®\n\n272"
