  md: 'Comments and suggestions concerning this page should be mailed to gmourani@videotron.ca.


    # ## Compilation


    Decompress the tarball (tar.gz).


    ```

    [root@deep]# cp postgresql_version_tar.gz /var/tmp

    [root@deep]# cd /var/tmp

    [root@deep]# tar xzf postgresql_version_tar.gz

    ```


    # ## Compile and Optimize


    Step 1


    First of all, create the Postgres Superuser Account (**postgres** is commonly
    used).


    +   - To create the Postgres account, use the command:

    [root@deep]# useradd -M -o -d /var/lib/pgsql -s /bin/bash -c "PostgreSQL Server"
    -u 40 postgres >/dev/null 2>&1

    nThe 2&1 sends the contents of stder to stdout.


    Step 2


    Before compiling Postgres program, you must verify that egcs-c++-1.1.2.24.i386.rpm
    package is installed on your system. The egcs-c++-1.1.2.24.i386.rpm package is
    located on Red Hat 6.1 CD-ROM from "RedHat/RPM" directory. After compilation and
    installation of PostgreSQL you can remove the egcs-c++-1.1.2.24.i386.rpm package
    from your system.


    +   - To verify egcs-c++-1.1.2.24.i386.rpm is installed, use the command:

    [root@deep]# rpm -q egcs-c++

    - To install egcs-c++-1.1.2.24.i386.rpm, use the command:

    [root@deep]# rpm -U egcs-c++-1.1.2.24.i386.rpm


    Step 3


    Cd into the PostgreSQL directory and type the following commands on your terminal:


    ```

    [root@deep]# cd src

    CC="egcs"

    ./configure \

    --prefix=/usr \

    --enable-locale

    ```


    **This tells PostgreSQL to set itself up for this particular hardware with:**


    +   - Enable local support.


    Edit the **Makefile.global** file (vi +210 Makefile.global) and change:


    To read:

    CFLAGS-=$(SRDIR)/include -$(SRDIR)/backend **-O9 -funroll-loops -fast-math -align-double
    -**

    mmppu=pentiumpro -march=pentiumpro -fomit-frame-pointer -fno-exceptions


    This is our optimization flag for PostgreSQL Server. Of course you must change
    it to fit your system and CPU architecture.'
