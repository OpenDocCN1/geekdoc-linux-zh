- img_proc: true
  md: '# Introduction to Linux


    Linux is an operating system that was initially created as a hobby by a student,
    Linux Torvalds, at Helsinki in Finland. Linux had an interest in Minix, a small
    UNIX system, and decided to develop a system that exceeded the Minix standards.
    He began his work in 1991 when he released 0.02 and worked steadily until 1994
    when version 1.0 of the Linux Kernel was released. The current full-featured version
    is 2.2 (released January 25, 1999), and continues development.


    Linux is developed under the GNU General Public License and its source code is
    freely available to everyone. However, this doesn''t mean that Linux and its associated
    distributions are free companies and developers may charge money for it as long
    as the source code remains available. Linux may be used for a variety of purposes
    including networking, software development, and as an end-user platform. Linux
    is often considered an, low-cost alternative to more expensive operating systems.


    Due to the very nature of Linux''s functionality and availability, it has become
    quite popular worldwide and a vast number of programmers have taken Linux''s source
    code and adapted it to meet their individual needs. At this time, there are dozens
    of ongoing projects for porting Linux to various hardware configurations and purposes.


    # Some good reasons to use Linux


    There are no royalty or licensing fees. Although Linus Torvalds holds the Linux
    trademark, the Linux kernel and much of the accompanying software are distributed
    under the GNU General Public License. This means you may modify the source code
    and selling programs for profit, but original authors retain copyright and you
    must provide the source to your changes.


    Although most popular on Intel-based computers, Linux runs on more CPUs and different
    platforms than any other operating system. One of the reasons for this, beside
    the programming talents of its rabid followers, is that Linux comes with source
    code to the kernel and is quite portable.


    The recent trend of the software and hardware industry is to push consumers to
    purchase computers with ever-increasing amounts of system memory and hard drive
    storage. Linux doesn''t suffer the prevalent bloat of "creeping featureat," and
    works quite well, even on aging x86-based computers with limited amounts of RAM.


    On the occasion a program crashes, Linux won''t collapse like a house of cards.
    You can kill the program and continue with confidence. Linux uses sophisticated,
    state-of-the-art memory management to control all system processes. You won''t
    lose control and won''t have to suffer the difficulties of rebooting the system.


    If you need a support platform for servers, Linux has real advantages, especially
    when compared to the cost of other operating systems, such as Windows 2000. An
    additional benefit is that Linux is, for practical purposes, immune to the horde
    of computer viruses that plague other operating systems. Because of the GNU GPL
    and Open Source, nearly your entire system comes with source code.


    # Let''s dispel some of the fear, uncertainty, and doubt about Linux'
  merge: -1
  pgno: 10
- img_proc: true
  md: '# It''s a toy operating system.


    There''s a big software company on the West coast of the United States that would
    love for this to be true, but it''s not. Linux is being put to work more and more
    everyday for Fortune 500 companies, governments, and consumers as a cost-effective
    computing solution. Just ask IBM, Compaq, Dell. Apple Computer, Burlington Coat
    Factory, Amtrak, Virginia Power, NASA, and millions of users around the world.


    # There''s no support.


    Although dreaded by unbelievers as an "unsupported" operating system, every Linux
    distribution comes with more than 12,000 pages of documentation. Commercial distributions
    such as Red Hat Linux, Caldera, SuSE, and OpenLinux offer initial support for
    registered users, and small business and corporate accounts get 24/7 support through
    a number of commercial support companies. As an Open Source operating system,
    Linux also comes with full source code. If you have a problem and have the savvy,
    fix it yourself! There''s no six-month wait for a service release, and many serious
    bugs (such as security flaws) are fixed within hours by the online Linux community.'
