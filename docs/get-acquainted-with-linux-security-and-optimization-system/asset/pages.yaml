    At this point Host A sends back a final ACK packet and sequence number to indicate
    successful reception and the connection is complete and data can now flow:


    Host A -------> Host B


    The entire connection process happens in a matter of milliseconds and both sides
    independently acknowledge each packet from this point. This handshake method ensures
    a "reliable" connection between hosts and is why TCP is considered a "connection
    oriented" protocol. It should be noted that only TCP packets exhibit this negotiation
    process. This is not so with UDP packets which are considered "unreliable" and
    do not attempt to correct errors nor negotiate a connection before sending to
    a remote host:


    # Encoding Information in a TCP/IP Header


    The TCP/IP header contains a number of areas where information can be stored and
