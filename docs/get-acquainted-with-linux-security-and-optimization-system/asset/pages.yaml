- img_proc: true
  md: 'Comments and suggestions concerning this page should be mailed to gmourani@videotron.ca


    As an example:

    [root@deep] rm -f /etc/security/console.apps/halt

    [root@deep] rm -f /etc/security/console.apps/poweroff

    [root@deep] rm -f /etc/security/console.apps/reboot

    [root@deep] rm -f /etc/security/console.apps/shutdown

    [root@deep] rm -f /etc/security/console.apps/xserver (if removed, root will be
    the only user to start X).


    Will disable console-equivalent access to programs halt, poweroff, reboot, and
    shutdown. Once again, the program xserver apply only is you installed the Windows
    interface on your system.


    NOTE: If you use our installation, the Window interface is not in your server
    and all the files described above will not appear in the `/etc/security/` directory,
    so don''t make attention to the step.


    # 10. Disabling all console access


    In order to disable all access, including program and file access, in the `/etc/pam.d/`
    directory, comment out all lines that refer to `pam_console.so`. This is the continuity
    of the above hack "7. Disabling console access”


    The following script will do the trick automatically for you. As “root” create
    the disabling.sh script file (touch disabling.sh) and add the following lines
    inside:


    ```

    #!/bin/sh

    cd /etc/pam.d

    for i in *; do

    sed ''s/\(.*pam_console.so\).*/\1/'' < $i && mv $i *

    done

    ```


    Make this script execute with the following command and execute it:

    [root@deep] chmod 700 disabling.sh

    [root@deep]# disabling.sh


    This will comment out all lines that refer to `pam_console.so` for all files located
    under `/etc/pam.d/`. Once the script has been executed, you can remove it from
    your system.


    # 11. The "etc/inetd.conf" file


    Inetd, called the “super server”, will load a program based upon a request from
    the network. The `inetd.conf` file tells ports to listen to and what server to
    start for each port. As soon as you put your Linux system on ANY network the first
    thing to look at is what services need to offer.


    Services that do not need to offer should be disabled and best untouched so that
    you have one less to worry about and attackers have one less place to look for
    a hole. Look at your `/etc/inetd.conf` file and see what services are being offered
    by your inetd. Disable that which you do not need by commenting them out (# at
    the beginning of the line), and sending your process a SIGHUP.


    Step 1


    Change the permissions on this file to 600.

    [root@deep] chmod 600 /etc/inetd.conf


    Step 2


    ENSURE THAT the owner is root.'
