  md: '# "/etc/null.mc" for the local or neighbor client and server machines


    Instead of having each individual server or workstation in a network handle its
    own mail, it can be advantageous to have central server that handles all mail.
    Such a server is called a Mail Hub. The advantage of a central Mail Hub is:


    +   * All incoming mail is sent to the hub, and no mail is sent directly to a
    client machine.

    * All outgoing mail from clients is sent to the Hub, and the Hub forwards that
    mail to its ultimate destination.

    * All outgoing mail appears to come from a single server and client''s name needs
    to be known to the outside.

    * No clients need to run a sendmail daemon listen for.


    Step 1

    Since our local clients never receive mail directly and, relay all their mail
    through the Mail Hub server, we will create a special file called "null.mc", which,
    when processed, we will create a customized "sendmail.cf" configuration that respond
    to this special setup for our neighbor or local server.


    Create the null file (touch /etc/null.mc) and add the following lines:


    ```

    divert(1)

    dnl This is the macro config file used to generate the /etc/sendmail.cf

    dnl If you modify this file you will need to regenerate the

    dnl /etc/sendmail.cf by running this config through the m4

    dnl preprocessor:

    dnl cp sendmail.8.9.3.gz /var/tmp

    dnl cd /var/tmp

    dnl tar -xzf sendmail.8.9.3.gz/cf

    dnl cd /var/tmp/sendmail-8.9.3/cf

    dnl m4../m4/m4 /etc/null.mc /etc/sendmail.cf

    dnl dnl

    dnl You will need to have the sendmail source distribution for this to

    dnl work.

    divert(0)

    OSTYPE(linux)

    FEATURE("nullclient";mail.openarch.com")

    define("ALIAS_FILE)

    ```


    This tells null.mc to set itself up for this particular configuration setup with:


    ```

    divert(-1) and divert(0)

    divert(-1) will delete the cr in the resulting output file and the divert(0) restores
    regular

    output.

    ```


    OSTYPE(linux)

    Support for various operating systems is supplied with the OSTYPE m4 "mc" file
    must declare the operating system with this command. This is one of the minimal
    information require by the "mc" file.


    FEATURE("nullclient";mail.openarch.com")

    This option set your server or client to never receive mail directly, send their
    mail as though the Central Mail Hub and they relay all mail through that server
    rather than sending directly. This is a special case - it creates a stripped down
    configuration file containing nothing but support for forwarding all mail to a
    central hub via a local SMTP-based network. The argument is the name of that hub.
    The **mail.openarch.com** is the canonical name of'
