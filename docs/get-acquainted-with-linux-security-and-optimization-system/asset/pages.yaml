    # Check for IP address spoofing.

    spoof on


    The **order** option indicates the order of services. The sample entry specifies
    that the resolver

    library should first consult the name server to resolve a name and check the `/etc/hosts`
    file.

    It is recommended to set the resolver library to first check the name server (bind)
    and then the

    hosts (hosts) for better performance and security on all of servers. Of course
    you must

    have DNS/bind installed or this configuration will not work.


    The **multi** option determines whether a host in the `/etc/hosts` can have multiple
    IP addresses

    (multiple interface eth). Hosts that have more than one IP address are to be multimomed,

    because the presence of multiple IP addresses implies that host has several network
    interfaces.

    As example, a Gateway Server will always have multiple IP address and must have
    this option

