    # # Linux DNS and BIND Server


    DNS is the MOST important network service for IP networks. All Unix Client machines
    should be configured to perform caching functions at minimum. Setting up a caching
    server for Client local machines will reduce load on the site''s primary server.
    A caching name server will find the answer to name queries and remember the answer
    next we need it. This will shorten the waiting time next time significantly.


    For security reason, it is very important that DNS doesn''t exist between hosts
    on the corporate network and external hosts, it is far safer to simply use IP
    addresses to connect to external machines from the corporate network and vice
    versa.


    In our configuration and installation it will run BIND as non root-user and in
    a chrooted environment. We also provide you three different configurations, one
    for a simple caching name server only, one for slave and another for a master
    name server.


    The simple caching name server configuration will be used for your servers that
    not as a master or slave name server and the slave and master configurations will
    be used for your servers that act as a master name server and slave name server.
    Usually one of your server act as master, another one for slave and the rest acts
    as simple caching name server.


    ![](img/4444dd2a96323af53b5149a2b33efe8b_195_0.png)


    This is the graphical representation of the DNS configuration we use on this book.
    We try to show you different setting (Caching Only DNS, Master DNS, and Slave
    DNS) on different servers. All possibilities exist and depend of your needs and
    network architecture.


