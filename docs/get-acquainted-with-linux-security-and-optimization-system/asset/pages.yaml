    - To prevent attacks, limit the src address to your ISP range.


    +   - For outgoing traceroute.

    - Message Types: INCOMING Dest_Unreachable (3), Time_Expired (11)

    - default UDP base: 33434 to base+nops-1


    +   - For incoming traceroute.

    - Message Types: OUTGOING Dest_Unreachable (3), Time_Expired (11)

    - To block this, deny OUTGOING 3 and 11


    +   # 0: echo-reply (ping)

    # 3: destination-unreachable, port-unreachable, fragmentation-needed, etc.

    # 4: source-quench

    # 5: redirect

    # 11: time-exceeded

    # 12: parameter-problem


