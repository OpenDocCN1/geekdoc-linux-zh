    The project is managed by a worldwide community of volunteers that use the Internet
    to communicate, plan, and develop the OpenSSL toolkit and its related documentation.


    # Cryptography Advantages


    Data Confidentiality


    When a message is encrypted, the input plaintext is transformed by an algorithm
    to enciphered text that hides the meaning of the message. This process involves
    a secret key that is used to encrypt and later decrypt the message. Without the
    secret, the encrypted data is meaningless. With cryptography, only the secret
    data encryption key can be transmitted by a secure method; the encrypted text
    can be sent via any public mechanism.


    Data Integrity


    Cryptography is also used to protect the integrity of the data. For example, a
    cryptographic checksum, called a message authentication (MAC), can be calculated
    on arbitrary user supplied text. The text and MAC are then sent to the receiver.
    The receiver of the message can verify the MAC appended to a message by recalculating
    the MAC for the message, using the appropriate secret key and verifying that it
    exactly equals the trial MAC.


    Authentication


    Other use of cryptography is in personal identification, where the user knows
    a secret which can serve to authenticate his identity.


