  md: '# Securing Sendmail


    The Sendmail restricted shell "smrsh"

    The smrsh program is intended as a replacement for /bin/sh/ in the program mail
    definition of sendmail. The smrsh software is a restricted shell utility that
    provides the ability to specify, through the /etc/smrsh directory, an explicit
    list of executable programs. Briefly, if a "bad guy" can get sendmail to run a
    program without going an alias or forward line, shell limits the set of programs
    that he can execute. In conjunction with sendmail, smrsh effectively limits sendmail''s
    scope of program execution to only those programs in smrsh''s directory. If you
    follow what we above, smrsh program is already compiled and installed on your
    computer under /usr/bin/smrsh.


    Step 1

    The first thing we need to do is to list the commands that "smrsh" should allow
    sendmail to run. By default we include but not limited to:


    +   - /bin/mail/ (if you have installed on your system)

    - /usr/bin/procmail/ (if you have installed on your system)


    NOTE: You should NOT include interpreter programs such as sh(1), csh(1), perl(1),
    ucode(1) or the stream editor sed(1) in your list of acceptable commands.


    Step 2

    You will need to populate the /etc/smrsh/ directory with the programs that are
    allowable for sendmail to execute. To prevent duplicate programs and make a nice
    job, it is better to establish links to the allowable programs from /etc/smrsh/
    rather than copy programs to this directory.


    +   - To allow the mail program "bin/mail", use the command:

    [root@deep]# cd /etc/smrsh

    [root@deep]# in -s /bin/mail


    - To allow the mail program /usr/bin/procmail, use the command:

    [root@deep]# cd /etc/procmail

    [root@deep]# in -s /usr/bin/procmail


    Would allow the mail and procmail programs to run from a user''s "forward" file
    or an "aliases" which uses the /program/ syntax.


    Step 3\We can now configure sendmail to use the restricted shell. The program
    mailer is defined by a single line in the sendmail configuration file, /etc/sendmail.cf;
    You must modify this single line "Mprog" in the sendmail.cf file, by replacing
    the /bin/sh/ specification with /usr/bin/smrsh.


    Edit the sendmail.cf (/etc/sendmail.cf) and change the line:


    For example:

    Mprog, /bin/sh, F=isDFMogueu9, S=10/30, R=20/40, D=$; T=X-Unix, A-sh $cu

    Which should be changed:

    Mprog, /usr/bin/smrsh, F=isDFMogueu9, S=10/30, R=20/40, D=$; T=X-Unix, A-sh $cu


    +   - Now re-start the sendmail process manually with the following command:

    [root@deep]# /etc/rc.d/sendmail restart'
