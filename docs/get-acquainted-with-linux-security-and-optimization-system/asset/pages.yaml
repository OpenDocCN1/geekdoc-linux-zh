    # # Installation Class and Method (Install Type)


    RedHat Linux 6.1 defines four different classes, or type of installation. They
    are:


    +   - GNOME Workstation

    - KDE Workstation

    - Server

    - Custom


    These classes (GNOME Workstation, KDE Workstation, and Server) give you the option
    of simplifying the installation process with a lot of configuration flexibility
    that we don''t want to have.


    For this reason we highly recommend "Custom", as this allows you to choose what
    services are added and how the system is partitioned


    The idea is to load the minimum packages, while maintaining maximum efficiency.
    The less software resides on the box, the fewer potential security exploits or
    holes.


    Select "Custom" and click Next.


    # # Disk Setup (Disk Druid)


    **Warning**

    We highly recommend, that you make a backup of your current system before proceeding
    with the disk partitioning.


    For performance, stability and security you must do something like the following
    partition listed below on you. We suppose for this partition configuration the
    fact that you want to set up a Web server with a Proxy Server on your machine.


    We will make two special partitions "chroot" and "cache", "chroot" partition is
    for DNS server chrooted, Apache server and other chrooted future programs. The
    "/cache" partition is for our Squid proxy. If you are not intended to install
    Squid Proxy server you don''t need to create the "/cache" partition but Squid
    + Apache will improve a lot of your performance and security.


    Putting "/tmp" and "/home" on separate partitions is pretty mandatory if users
    shell access to the server, splitting these off onto separate partitions also
    prevents users from filling


