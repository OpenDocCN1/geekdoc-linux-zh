    This configuration option automatically rebuilds file if needed.


    ```

    define(''CONTO_CONNECT'', ''1m'')

    ```


    This configuration option sets the timeout waiting for an connect() to complete.
    This can only shorten timeouts; the kernel itself enforces an absolute maximum
    (which varies depending on the system).


    ```

    define(''CONTRY_NULL_MX_LIST'',true)

    ```


    This configuration option says that if the server is the MX for host and haven''t
    made other arrangements, connecting to the host directly.


    ```

    define(''CONFONT_PROBE_INTERFACES,true)

    ```


    This configuration option sets if sendmail will not insert the names and addresses
    of any local interfaces into the $w class (list of known "equivalent" addresses).


    ```

    define(''PROMAIL_MAILER_PATH'',''/usr/bin/procmail'')

    ```


    This configuration option sets the path to procmail. This is also used by FEATURE(''local_procmail'').


    ```

    FEATURE(''smush'',''/usr/bin/smush'')

    ```


    This m4 macro enables the use of "smush" (sendmail restricted shell). Although
    Sendmail is to be careful about how it runs programs from the "etc/aliases" and
    "~/.forward" files , it may still be vulnerable to internal attacks. To limit
    the selection of programs that Sendmail is allowed to run, V8 of Sendmail includes
    the "smush" (Sendmail restricted shell) program. This improves the ability of
    the local system administrator to control what gets run via e-mail. The default
    location for the "smush" program is "/usr/local/etc/smush", since we are in another
    location, we need to add an argument to the smush feature for the new replacement
    "/usr/bin/smush". The use of "smush" is recommended by CERT, so you are encouraged
    to use this feature as often as possible.


    ```

    FEATURE(mailter)

    ```


    This m4 macro enables the use of "database selects new delivery agents. A mailter
    is a database that maps "host.domain" to special delivery agent and new domain
    name pairs. The new domain names are for routing but are not revealed in the headers
    of messages.


    ```

    FEATURE(''virtuerable'',''hash -o /etc/mail/virtuerable'')

    ```


    This m4 macro enables the use of "support for virtual domains. A virtuerable is
    a database that maps virtual domains into new addresses.


    ```

    FEATURE(redirect)

    ```


    This m4 macro enables the use of "support for address.REDIRECT". The redirect
    feature allows aliases to be set up for retired accounts. These aliases bounce
    with an indication of the new forwarding address. Note that the message is bounced
    and forwarded. No notification is sent to the recipient''s address.


    ```

    FEATURE(always_add_domain)

    ```


    This m4 macro enables the use of "add the local domain on local mail". The always_add_domain
    feature is safe and recommended. It ensures that all addresses that locally defined
    will be fully qualified.


    ```

    FEATURE(use_cw_file)

    ```


