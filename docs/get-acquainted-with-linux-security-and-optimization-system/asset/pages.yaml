    # # What is Packet Filtering?


    Packet Filtering is the type of firewall built into the Linux kernel. A filtering
    firewall works at the network level. Data is only allowed to leave the system
    if the filtering rules allow it. As packets arrive they are filtered by their
    type, source address, destination address, and port information contained in each
    packet.


    Most of the time, packet-filtering is accomplished by using a router that forwards
    packets according to filtering rules. When a packet arrives at the packet-filtering
    router, the router extracts information from the packet header and makes decisions
    according to the filter rules as to whether the packet will pass through or be
    discarded.


    The following information can be extracted from the packet header:


    +   * Source IP address

    * Destination IP address

    * TCP/UDP source port

    * TCP/UDP destination port

    * ICMP message type

    * Encapsulated protocol (TCP, UDP, ICMP or IP tunnel)


    Because little data is analyzed and logging firewalls take less CPU and create
    less latency in your network. There are lots of ways to structure your network
    to protect your systems using a firewall.


    # # The topology


    All servers should be configured to block unused ports at least if there are not
    a firewall server. This require for more security. Imagine someone gain access
    to your firewall gateway server, if your neighbors servers are not configured
    to block unused ports so let get the party. The same is true for local connection.
    Unauthorized employees can gain access from the inside to your other servers.


    In our configuration we will give you tree examples that can help you to configure
    your firewall rules of the type of server you want to protect and the emplacement
    of these servers on your network architecture. The first example firewall rules
    file will be for a Web Server, the second for a Mail Server and the last for a
    Gateway Server that act as proxy for the inside Winds, Workstations and Servers
    machines. See the graph below to get an idea.


