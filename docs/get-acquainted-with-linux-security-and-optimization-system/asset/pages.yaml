- img_proc: true
  md: '# Tweaks, Tips and Administration tasks


    Some of the tips in this presentation are specific to Linux systems. Most are
    applicable to UNIX system in general.


    # 1.0 The "du" utility


    You can use the "du" utility to help determine required space. For example, to
    determine the requirements of the "var/log" and "/home" directory trees, type:


    ```

    [root@deep]$ du-sh /var/log /home

    1.0M /var/log

    66M  /home

    ```


    Bear mind that this command will return the actual size of your data. Nice and
    neat in human readable form. Now that you know "home" is using 66M you can "cd
    /home" and then "du -sh " to locate the largest files are.


    **NOTE:** You can add to your crontab command so that every day you emailed a
    disk space list so you can monitor it without logging constantly.


    # 1.1 Find the route that the packets sent from your machine to a remote host


    If you want to find out the route the packets sent from your machine to a remote
    host, simply issue the command: (traceroute hostname) where hostname is the name
    or ip address of the host you want to trace.


    ```

    [root@deep]$ traceroute www.redhat.com

    ```


    # 1.2 Display the number of time you web pages has been accessed:


    To display the number of times your page has been accessed this command:


    ```

    [root@deep]$ grep "GET /.*" /var/log/httpd/access_log | wc -l

    ```


    # 1.3 Shut down most services altogether


    As root, you can shut down most services with the following command:


    ```

    [root@deep]$ killall httpd smbd nmbd sendmail

    ```


    The above command will shut down the Apache server, Samba services, e-mail server,
    and DNS server.


    # 1.4 Want a clock on the time of your terminal for all user?


    Edit the profile file (vi /etc/profile) and add the following line:


    ```

    PROMPT_COMMAND=echo -ne

    \"\033[033;2:999R\033[1:H\033[00:04:44m\033[K]date=\033[00m\0338"\"

    ```


    The result will look like:'
