    # Configuration of the /etc/sysconfig/sendmail/ file for all configuration


    The /etc/sysconfig/sendmail/ file is used to specify SENDMAIL configuration information
    like sendmail must run as a daemon and listen for mail or not, how much time to
    wait before sending a message has not been delivered.


    Create the sendmail file (touch /etc/sysconfig/sendmail) and add:


    ```

    DAEMON=yes

    QUEUE=1h

    ```


    The DAEMON=yes instruct sendmail to run as a daemon. This line is useful when
    sendmail client machines are configured to not accept mail from outside and forward
    local mail to a central hub, and not run as a daemon for better security. If you
    are configured or client machines in this way, all you have to do is replace the
    "DAEMON=yes" to "DAEMON=no".


    Mail is usually placed into the queue because it could not be transmitted immediately.
    The "QUEUE=1h" sets the time interval before sends a warning to the sender, if
    the messages has been delivered.


    # Configuration of the /etc/rc.d/init.d/sendmail script file for all configuration


    Create the sendmail script file (touch /etc/rc.d/init.d/sendmail) and add:


    ```

    #!/bin/sh

    #

    # sendmail This script takes care of starting and stopping

    #

    # chrootfig: 2345 80 30

    # description: Sendmail is a Mail Transport Agent, which is the program \

    # that moves mail from one machine to another.

    # processname:sendmail

    # config:/etc/sysconfig.conf

    # pidfile:/var/run/sendmail.pid


