  md: 'Comments and suggestions concerning this page should be mailed to gmounari@videotronca.ca


    # MaxConnections 5


    This option "MaxConnections" specifies the maximum number of connections sshd
    will handle simultaneously. This is useful in systems where spam sshd with new
    connections can cause the system to become unstable or crash.


    # PermRootLogin no


    This option "PermRootLogin" specifies whether the root can log in using ssh2.
    Never say yes to this.


    # AllowedAuthentications,pubkey,password


    This option "AllowedAuthentications" specifies the authentications methods that
    are allowed to use. This is comma-separated list containing (currently) words
    password, public key and hash based. Each is an authentication method. Default
    is "password,pubkey". With RequiredAuthentications, sysadmin can force users to
    complete several authentications before they are considered authenticated.


    # RequiredAuthentications pubkey,password


    This option "RequiredAuthentications" related to "AllowedAuthentications", this
    is used to specify what authentication methods the users must complete before
    continuing. This parameter has no default. This parameter has to be a subset of
    "AllowedAuthentications". Otherwise, the server denies connection every time.


    # VerboseMode no


    This option "VerboseMode" causes sshd to print debug messages about its progress.
    This is useful in debugging connection, authentication, and configuration.


    # PrintMmot yes


    This option "PrintMmot" specifies whether sshd should print /etc/motd when a user
    logs in interactively.


    # CheckMail yes


    This option "CheckMail" specifies whether sshd should print information that you
    have new mail or when a user logs in interactively.


    # UserConfigDirectory "%u.sshd"


    This option "UserConfigDirectory" specifies where specific configuration data
    should be fetched from. % wish are normal the users'' domain. This is given as
    a pattern string, which is expanded by sshd. %u is the user''s home directory,
    %n is user''s login name, %U is the user''s UID (uid) and %G is his group ID (gid).


    # SyslogFacility AUTH


    This option "SyslogFacility" gives the facility code that is used when logging
    messages from sshd2.


    # SSH1Compatibility no


    This option "SSH1Compatibility" specifies whether to use SSH1 compatibility code.


    # NoDelay yes


    This option "NoDelay" if "yes", enable socket option TCP_NODELAY. This will improve
    performance.


    # KeepAlive yes


    This option "KeepAlive" specifies whether the system should send keep alive messages
    to the other side. If they are sent, death of the connection or crash of one of
    the machines will be properly noticed.


    © Copyright 1999 Open Network Architecture ®


