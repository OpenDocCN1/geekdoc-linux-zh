    # 35. Unusual or hidden files


    Look everywhere on the system for unusual or hidden files (files that start with
    a period and are normally not shown by ''ls''), these can be used to hide tools
    and information (password cracking programs, files from other systems, etc.).
    A common technique on UNIX systems is to put a hidden directory in a user''s account
    with an unusual name, something like ''...'' or ''(dot space) or ''.G'' (dot control-G).
    The ''find'' program can be used to look for hidden files.


    As an example:

    [root@deep]# find / -name ".*" -print -xdev

    [root@deep]# find / -name ".*" -print -xdev | cat -v


    Also, with names such as ''.xxx'' and ''.mail'' have been used (that is, files
    that might appear to be normal).


    # 36. Find all files with the SUID/SGID bit enabled


    SUID and SGID files on your system are a potential security risk, and should be
    monitored closely. Because these programs grant special privileges to the user
    who is executing them, it is necessary to ensure that insecure programs are not


    A favorite trick of crackers is to exploit SUID "root" programs, then leave a
    SUID program as a backdoor to get in the next time, even if the original file
    is plugged. Find all SUID and SGID programs on your system, and keep track of
    them all, so you are aware of what could indicate a potential.


    +   Use the following command to find all SUID/SGID programs on your system:

    [root@deep]# find -type f -perm -04000 -perm -02000 \exec ls -lg {} \;


    NOTE: See in this book chapter 9 "Securities Software" for more information about
    the software Xsid that will make the job for you automatically each day and report
    the results via mail.


    # 37. Find group and Writable files and directories


    Particularly sensitive files can be a security hole if a cracker gains access
    to your system and modifies them. Additionally, world-writable directories are
    dangerous, they allow a cracker to add or delete files as "dev". In the normal
    course of operation, several files will be writable, including some from "dev",
    and symbolic links.


    +   To locate all world-writable files on your system, use the following command:

    [root@deep]# find -type f -perm -002 -perm -020 \exec ls -lg {} \

    [root@deep]# find -type d -perm -002 -perm -020 \exec ls -ld {} \;


    NOTE: A file and integrity checker like Tripwire can be used regularly to scan,
    manage and find modified group or world writable files easily. See in this book
    under chapter 9 "Securities Software" for more information about Tripwire.


