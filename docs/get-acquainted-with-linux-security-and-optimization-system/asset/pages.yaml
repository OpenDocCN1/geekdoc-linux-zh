    # ## Securing FTP


    ENSURE that you have set up a file /etc/ftpusers which specifies those users that
    are NOT allowed to connect to. This should include, as a MINIMUM, the entries:
    root, bin, daemon, adm, lp, sync, shutdown, halt, mail, users, uucp, operator,
    games, nobody and ALL vendor supplied accounts.


    To disable anonymous ftp, remove the ftp from your system file. Verify that anonftp-version.i86.rpm
    package is not installed on your system with the command:


    ```

    [root@deep]# rpm -q anonftp

