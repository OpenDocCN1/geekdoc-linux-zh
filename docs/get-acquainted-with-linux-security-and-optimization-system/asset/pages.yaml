- img_proc: true
  md: 'Comments and suggestions concerning this page should be mailed to gmourani@videotron.ca


    # # Backup and Restore Procedures


    # ## Server Backup Procedures


    A secure and reliable server is closely related to performing regular backups.
    Regular backups should be considered one of a top priorities. Failures will probably
    occur. They may be caused by hardware failure, power outages, or human error.
    If you are hosting users on your system, you will most certainly be requested
    to restore an inadvertently deleted files.


    If you perform backups, you will hopefully reduce the possibility of such loss
    files. The safest method of doing backups is to record them in a location separate
    from your system like tape, removable drive, writable CD-ROM, etc.


    There are a variety of methods for performing backups with Linux. These include
    command-line tools included with every Linux distribution, such as "dd," "dump,"cpio,"
    as well as "tar." Available is text-based utility, such as "Amanda," which is
    designed to add a more user-friendly interface to the backup and restore procedures.
    Finally, commercial backup utility is also available, such as "BRU".


    Obviously, the performance for performing a backup and restore will depend on
    your choice of backup system. For this reason, we will discuss methods for performing
    backups with the tool we use: "tar," which is a command-line tool largely portable
    across "nix systems.


    The following command will perform a backup of your linux server onto the "/archive"
    file, with the exception of the "/proc" pseudo-filesystem, any mounted files in
    "/mnt," the "/archive" file system (no backing up backup sets), as well as Squid''s
    large cache files (which are, a waste of backup media and unnecessary to back
    up):


    **When:** When backing up your file systems, do not include the "/proc" pseudo-filesystem!
    The files in "/proc" are not actually files but are file-like links which describe
    and point to kernel data structures, do not include the "/mnt" and "/archive"
    links.


    +   * To perform a backup of your entire system, use the command:

    `[root]# cd /\n`[root]# tar -cvpf /archive/full-backup date +%Y-%m-%d.tar.gz --exclude=/proc
    --exclude=/mnt --exclude=/archive --exclude=cache`


    z specifies the backup data be compressed with "zip" program.

    c specifies if an archive file is created

    v display a list of files as they get.

    p preserves permissions; file protection will be "remembered.\nt states that the
    very next argument will be the name of the archive file or directory.


    Notice a filename when the current date is displayed, by simply including the
    "date" command between two-back-quote marks. A common naming convention is to
    add a "tar" suffix for non-compressed archives, and a "tar.gz" suffix for compressed
    ones.


    The "--directory" option allows tar to first switch to the directory path (the
    "/" directory in this example) prior to starting the backup of the specified directories
    or files. Finally, the "-" character at the end of the command tell tar that it
    should back up everything in the current directory.


