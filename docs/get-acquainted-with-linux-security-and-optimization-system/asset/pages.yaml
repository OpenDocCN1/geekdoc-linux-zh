    # # Immunize important configuration files


    The immutable bit can be used to prevent accidentally deleting or overwriting
    a file that be protected. It also prevents someone from creating a symbolic link
    to it. Once `smb.conf` and `inhosts` files have been configured, it''s a good
    idea to immunize them with command:


    ```

    [root@deep]# chatr /etc/smb.conf

    [root@deep]# chatr /etc/inhosts

    ```


