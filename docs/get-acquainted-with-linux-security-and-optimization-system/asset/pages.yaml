  md: 'Comments and suggestions concerning this page may be mailed to gnourani@videotron.ca


    # # Introduction


    When I begin, the first question I ask to myself was how to install a server with
    Linux and be sure that no one from the outside and inside accesses to it without
    authorization. Then I was wondering if any methods similar to the one on windows
    exist to improve the computer performance. I began a search on the Internet and
    read several books to get the most information on security and performance for
    my server. After many years of research and studies, I finally found the answer
    to my questions. Answers, Internet sites. I created a documentation based on my
    documents, books, articles, etc., which help me with daily activities. By then
    this documentation got bigger and started to look more like a book and less than
    just scattered notes. I decided to make it public on the Internet so that anyone
    can take advantage of it. By sharing this information I did past for answered
    many of my needs in computer with one magic relic, strong, powerful, fast and
    free operating system named Linux. I received a lot of feedback and comments about
    my documentation, help to improve it and techniques. I also find that a lot of
    people want to see it for contents, to get advantage out of it and use the power
    of this beautiful Linux system in action.


    # ## Overview


    This document is tailored as step-by-step, example document instead of a detailed
    explanation on each Linux feature. It doesn''t go into debugging aspects since
    the Linux Development Project''s (LDP) HOWTOs already cover.


    This document is intended for a technical audience! It''s discuss how to install
    a RedHat Server with all the security and optimization for a high performance
    Linux machine. Since we speak of optimization and configuration options, we will
    use a source distribution (tar.gz) program the most possible especially for critical
    server software like Apache, Bind, Samba, Squid, Openssl etc.


    Source program will give you a fast upgrade when necessity and customization,
    optimization for our specific machines that we often can''t have with RPM. I have
    used many freely available sources to write this documentation, it seems only
    fair to give back to the Linux community. This is fixed on the Intel x86 hardware,
    if you are looking for PPC, ARM, SPARC, APX, etc.; features; you probably won''t
    find what you are looking for.


    Minimal installation for this Server requires that you recompile the kernel, other
    programs are specific to your needs.


    # ## These installation instructions assume


    You have a CD-ROM drive and the Official Red Hat Linux CD-ROM. Installations were
    tested on the Official RedHat Linux 6.1.


    You should understand the hardware system on which the operating system will be
    installed. After examining the hardware, the rest of this document guides you,
    step-by-step, through the installation process.


