  md: '# Linux General Optimization


    Tuning a network is very much dependent on the implementation of the products
    in the network (software and hardware). It is impossible to put together in one
    volume all the information required to complete a network. Also, you will not
    be able to identify the bottlenecks and holdups that may exist until the network
    is up and running. tuning is not straight-forward and should be looked upon as
    a complex task. It requires a great deal of discipline and excellence. Unless
    appropriate tests are used to identify specific bottlenecks within the system
    it is difficult to interpret results. Occasionally performance tuning can be very
    frustrating and tedious especially after a great analysis of the results are still
    inconclusive. Nevertheless, performance tuning can be very rewarding and provide
    long term benefits.


    # 1. The "/etc/profile" file


    The "etc/profile" file contains system environment staff and startup programs.
    All customizations that you will put in this file apply for the entire environment
    variable in your system. So putting optimization flags in this file is a good
    choice. To squeeze the performance from your x86 programs, you can use full optimization
    compiling with the -O9 flag. Many programs contain -O2 in the Makefile. -O9 is
    the highest level of optimization. It will increase the size of what it does,
    but it runs faster.


    When compiling, use -fomit-frame-pointer. This will use the stack for accessing
    variables. Unfortunately debugging is almost impossible with this option. You
    can use the -mcpu=cpu_type and -march=cpu_type, which will optimize for the CPU
    listed to the best of GCC''s ability. However, the resulting code will only be
    runnable on the indicated CPU or higher.


    # For CPU i86 or Pentium, Pentium II, Pentium III


    In the "etc/profile" file, put this line for a PentiumPro, Pentium II and III
    Pro Processor family:


    ```

    CFLAGS=-O3 -funroll-loops -fast-math -malign-align -mcpu=pentiumpro -march=pentium
    -fomit-frame-pointer -no-exceptions

    ```


    # For CPU i586 or Pentium


    In the "etc/profile" file, put this line for a Pentium Processor family:


    ```

    CFLAGS=-O3 -march=pentium -mcpu=pentium -pentium -funroll-loops -fomit-frame-pointer
    -fforce-mem -fforder-addr -malign-double -fno-exceptions

    ```


    # For CPU i486


    In the "etc/profile" file, put this line for an i486 Processor family:


    ```

    CFLAGS=-O3 -funroll-all-loops -malign-double -mcpu=i486 -march=i486 -fomit-frame-pointer
    -no-exceptions

    ```


    Now after the choice of architecture (i686, i586, or i486) a bit further down
    in the "/etc/profile" file, add "_ LANG LESSCHARSET" to the "export" line:


    ```

    export PATH PS1 HOSTNAME HITSIZE HISTFILESIZE USER LOGIN MAIL INPUTTRUC CFLAGS
    LANG LESSCHARSET

    ```'
