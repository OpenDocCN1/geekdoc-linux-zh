  md: '# Compilers functionality


    # Overview


    Before we begin to explain how to compile and install software with all the necessary
    securities and optimizations we will need on our server, it is important to know
    the commands and programs we will often use to do the job. First of all, we must
    ensure that we have the necessary packages needed to make compilation on our system.
    These packages must be installed on your server or you''ll not be able to compile
    programs.


    # The necessary packages


    The following is the necessary packages needed to be able to make compilation
    on your system after recompilation of your kernel. Those software are on your
    Red Hat 6.1 Part 1 CD-ROM under RedHat/ RPM directory if they are not already
    installed.


    ```

    [root@deep]# mount /dev/cdrom /mnt/cdrom/

    [root@deep]# cd /mnt/cdrom/RedHat/RPM/


    autocf-2.13.5-noarch.rpm

    m4.1.4-12.386.rpm

    automake-1.4.5-noarch.rpm

    dev86-0.14.9-1.386.rpm

    bison-1.26-1.386.rpm

    byacc-1.9-11.386.rpm

    cdcl-2.5-9.386.rpm

    cpp-1.1.2-24.386.rpm

    cproto-4.6-2.386.rpm

    crato-2.5-2.386.rpm

    eegs-3.1.2-24.386.rpm

    ElectricFence-2.1-1.386.rpm

    flex-2.5.4a-7.i386.rpm

    gdb-4.18-4.386.rpm

    gibc-devel-2.1.2-11.i386.rpm

    make-3.7.7-6.i386.rpm

    patch-2.5.9-1.i386.rpm

    ```


    +   - The RPM command to install A RPM package on your system:

    [root@deep]# rpm -Uvh foo-1.0-2.i386.rpm

    - The RPM command to verify if package are or not installed on your system:

    [root@deep]# rpm -q foo


    Once again, after installation and compilation of all programs that need on your
    server, it''s important to uninstall all sharp objects (compilers, etc) describe
    this. This will protect your system from unauthorized users trying to compile
    programs on your server without authorization.


    Another thing is to move the "rpm" binary program in a safe place like the floppy
    disk for the same reason that above. realize that compilers are not available.
    Imagine some evil people trying to compile programs on your server and realize
    install it with the RPM commands. Hops surprise RPM commands are not available
    too. Of course in the future if you need to install new software on your server
    that require RPM program, all you have to do is put it from the floppy disk to
    his original place.'
  merge: -1
  pgno: 143
- img_proc: true
  md: 'Comments and suggestions concerning this page should be mailed to gnmouari@videotron.ca


    +   - To move RPM binary in the floppy disk, use the command:

    [root@deep] # mount /dev/fd0 /mnt/floppy/

    [root@deep] # mv /bin/rpm /mnt/floppy

    [root@deep] # umount /mnt/floppy/


    +   - To put RPM binary to his original directory, use the command:

    [root@deep] # mount /dev/td0 /mnt/floppy/

    [root@deep] # cp /mnt/floppy/rpm /bin/

    [root@deep] # umount /mnt/floppy/


    **NOTE:** Never uninstall RPM program completely from your system or you will
    be unable to reinstall it later since to install RPM or other software commands.


    # Why would we choose use tarballs?


    The Red Hat distribution of Linux is provided as RPM file, also known as a "package"
    is a way of distributing software that it can be easily installed, upgraded, queried,
    and deleted. However, in the Unix world facto-standard for package distribution
    continues to be by of so-called "tarballs". Tarballs are simple files that are
    readable with the "tar" utility. Installing from tar is significantly more tedious
    than using RPM. So why we would choose to do?


    +   1- Unfortunately, it takes a few weeks for developers to get the latest version
    of a package converted to RPM because many developers first release as tarballs.


    +   2- When developers release a new RPM, they include a lot of options that are
    not necessary. Developers don''t know what options you will need and what you
    will not need, so they must use the method to fit the needs of every one.


    +   3- RPM are not optimized for your specific processors, companies like Red
    Hat Linux build RPM based on a standard PC. This permit their RPM packages to
    be installed on all sort computers compiling programs for i386 machine can fit
    on all systems.


    +   4- Some time you download and install RPM, that others around the world are
    build and make available for your purpose. This can cause conflicts in certain
    depends how this is build the package, errors, security and all other descriptions
    above.


    # Compiling software on your system


    Roughly speaking, a program is a computer code that can execute. Somebody wrote
    the "source code" in a language he/she understand. That might have been C (very
    likely) or something thing. The program "source code" also makes sense to a compiler
    that converts the instructions into a binary file to whatever processor is inserted
    - e.g. 386 or similar. A modern file format for these "executable" is Elf. The
    programmer shows his source to the compiler and gets a result of some sort. It''s
    not at all uncommon that early attempts fail to compile, or having compiled as
    expected. Half of programming is tracking down and fixing these problems (debugging).


    More aspect and new words relating to compilation of a source code that you will
    see and in this book include but are not limited to:


    The Multiple Files


    © Copyright 1999 Open Network Architecture ®'
  merge: -1
  pgno: 144
- img_proc: true
  md: 'Comments and suggestions concerning this page should be mailed to gmournai@videotron.ca


    One-file programs are rare. Usually there are a number of files (say *c) that
    are each compiled into object files (*.o) and linked into an executable. The compiler
    is usually used to perform the linking (and it calls the ''ld'' program behind
    the scenes).


    # The Makefiles


    These are intended to aid consistency (when you build the program the same way
    each). They also help with speed. Some programs are quite long - tens of minutes
    for a large program. The ''make'' program uses ''dependencies'' in the Makefile
    to decide what parts of the program need to be recompiled. If you change one source
    file of fifty you to get away with and compile one link step, instead of starting
    from scratch. Be aware that the format includes tabs at the start of some lines
    (spaces won''t).


    # The Libraries


    Programs can be linked not only to object files (*o) but also to libraries (collections
    of object files). Sometimes you will have to link to system-supplied libraries
    (e.g., -lm for the math library, without which your mathematical C programs will
    produce nonsense). There are two forms of linking libraries: static (the code
    goes in the executable file) and dynamic (the code is loaded when the program
    starts to run). Large compiler manuals usually explain the pros and cons of two.


    # The Patches


    Before, it was common to executable files to be given corrections before recompiling
    them. This practice has almost died out. People ''patch'' source code, putting
    a change into files (usually changing a small portion of the whole). Larry Wall''s
    ''patch'' program is used for this. When different versions of a program require
    small changes to code to be released, saving the trouble of having two large distributions.


    # The Errors in Compilation and Linking


    These are often typos, compilations, and misuse of the language.... Checks that
    the right includes are used for the functions you are calling. Unreferenced symbols
    are the sign of an incomplete link step. Also checks if the necessary development
    libraries or tools are installed on your system.


    # The Debugging


    This is a large topic. It usually helps to have statements in the code that inform
    you of what is happening. Avoid drowning in output when you sometimes get to print
    out only the first 3 passes in a loop. Checking that variables have passed correctly
    between modules often helps. Get familiar with your debugging tools.


    # Build and Install software on your system


    You will see in the ''Part VI Software''s-Related-Reference'' below that we use
    many different commands to build and install programs on the server. These commands
    are UNIX compatible and are used on all variant ''nik'' machines to compile and
    install software.


    The procedure to compile and install tarballs software on your server:


    +   First of all you must download the tarball from your trusted source archive
    site.


    +   2. After downloading the tarball, change to the "var/tmp/" directory (note
    that other paths are possible) and update the archive by typing commands (as root)
    in the following example:


    ```

    [root@deep]# tar xzpf foo.tar.gz

    ```'
