  md: "# Installation of your Linux Server\n\n# Know your Hardware!\n\nUnderstanding\
    \ the hardware is essential for a successful installation of RedHat Linux. Therefore,\
    \ you should take a moment now and familiarize yourself with your hardware. Be\
    \ prepared to answer the following questions:\n\n+   1. How many hard drives do\
    \ you have?\n2. What size is each drive (3.2GB)?\n3. If you have more than one\
    \ hard drive, which is the primary?\n4. How much RAM do you have?\n5. Do you have\
    \ a SCSI adapter? If so, what did it make and what model is it?\n6. What type\
    \ of mouse do you have?\n7. How many buttons?\n8. If you have a serial mouse,\
    \ COM port is it connected?\n9. What is the name and model of your video card?\
    \ How much video RAM do you have?\n10. What kind of monitor do you have (make\
    \ and model)?\n11. Will you be connecting to a network? If so, will will be:\n\
    \    a. Your IP address?\n    b. Your netmask?\n    c. Your gateway address?\n\
    \    d. Your domain server's IP address?\n    e. Your domain name?\n    f. Your\
    \ hostname?\n    g. Your types of network(s) card(s) (make and model)?\n\n# Creating\
    \ the Boot Disk and Booting\n\nFrom time to time you will find that the installation\
    \ may fail, if this happens, a revised diskette image is required in order to\
    \ work properly. In these cases, special images are available via the Red Hat\
    \ Linux Errata page to solve the problem.\n\nSince this is a relatively rare occurrence,\
    \ you will save time if you try to use the standard diskette first, and then read\
    \ the Errata if you experience any problems completing the installation. Before\
    \ you make the boot disk, insert the Official Red Hat Linux 6.1 CD-ROM Part 1\
    \ in your computer. When the program asks for the filename, use boot.img for the\
    \ boot disk. To make the floppies drive under MS-DOS, you need to use these commands\
    \ (assuming your CD is D: and contain the Official Red Hat 6.1 CD-ROM).\n\n+ \
    \  * Open the Command Prompt under Windows: Start | Programs | Command Prompt\n\
    D:\\> cd dsutils\nD:\\> dsutils=write\nEnter disk image source file name: .images/boot.img\n\
    Enter target diskette drive A:\nnPlease insert a formatted diskette into drive\
    \ A: and press--ENTER--:\nD:\\>dsutils>\n\nThe rewrite exe program asks for the\
    \ filename of the disk. Enter boot.img. Insert a floppy into drive A. It will\
    \ then ask you for a disk to write to. Enter a: Label the Red Hat boot disk."
