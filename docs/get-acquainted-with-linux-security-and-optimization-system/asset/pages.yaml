  md: 'Comments and suggestions concerning this page should be mailed to gmounrai@videotronron.ca


    Performance increases have been reported on massive disk I/O operations by setting
    the IDE drivers to DMA, 32-bit transfers and Multiple sector mode. The kernel
    seems to use more conservative settings unless told otherwise. The magic command
    to change the setting of your drive is `hdpm`.


    To enable 32-bit I/O over the PCI buses, use the command:

    `root@deep]# /sbin/hdpm -d 1 /dev/hda` (or hbd, hdc etc).


    `hdpm` (8) manages pages that you may need to use -c 3 for chipsets. All (E)IDE
    drives still use a 16-bit connection over the ribbon cable from the interface
    card.


    To enable DMA, use the command:

    `root@deep]# /sbin/hdpm -d 1 /dev/hda` (or hbd, hdc etc.).


    This may depend on your motherboard chipset being compiled into your kernel.


    To enable multiword DMA mode 2 transfers, use the command:

    `root@deep]# /sbin/hdpm -d 1-X3 /dev/hda` (or hbd, hdc etc).


    This sets the IDE interface for newer (E)IDE/ATA2 drives. Check your hardware
    manual if you have it.


    To enable UltraDMA mode 2 transfers, use the command:

    `root@deep]# /sbin/hdpm -d 1-66 /dev/hda` (or hbd, hdc etc).


    You''ll need to prepare sector mode for UltraDMA beforehand, also you may see
    page about `hdpm` for more information. Use this with extreme caution!


    To set multiple sector mode I/O, use the command:

    `root@deep]# /sbin/hdpm -m XX /dev/hda` (or hbd, hdc etc).


    Where "XX" is the maximum setting supported by your drive. The -i flag can be
    used to find the maximum setting supported by an installed drive, look for MaxMultSet
    in the output.


    ```

    `root@deep]# /sbin/hdpm -d 1 /dev/hda` (or hbd, hdc etc).

    ```


    /dev/hda


    ```

    Model=Maxtor 750 AV,FRev=GA7647,SerialNo=L1007YS

    Config=-Hard NoHfmD SiU15Sec Fixed DTR=5Mbs FmpRep

    RawCS-H=1046/63,TrigSize=0,SectorSize=0,ECCBytes=11

    BusType=3(DualPort),Cur:LBAectors=32,MaxMultSet,MultSet-8

    DbiQWords=yes,DMA-PIO(first)=yes,DMA-1 (medium)

    CurC=322/323,Cur:Sector=37598,LBAectors,LBA-bytes,LBAectors=105468

    IDMA=mid:150,rec:160;DMA modes: sword1* sword2

    IORDY=off,PIO(min:24,IORDY:180); PIO modes: mode3

    ```


    Multiple sector mode (aka IDE Block) is a feature of most modern IDE drives, permitting
    the transfer of multiple sectors per I/O interrupt, rather than the usual sector
    per interrupt. When this feature is enabled, it typically reduces operating system
    for disk I/O by 30-50%. On many systems, it provides increased data throughput
    of anywhere from 5% to 50%.


    You can test the results of your changes by running `hdpm` in performance test
    mode:

    `root@deep]# /sbin/hdpm -t /dev/hda` (or hbd, hdc etc).


