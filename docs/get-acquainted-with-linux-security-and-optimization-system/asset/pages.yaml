  md: "Comments and suggestions concerning this page should be mailed to gmourani@videotron.ca\n\
    \n```\nindex objectclass pres,eq\nindex default none\n# ldbm access control definitions\n\
    defaultaccess read\naccess to attr=userpassword\n  by self write\n  by dn=\"cn=admin,\
    \ o=openarch, c=com\"\n  by * compare\n```\n\nYou should be sure to set the following\
    \ options in your \"slapd.conf\" file before starting the slapd daemon program:\n\
    \n+   - suffix <dn>\n\nThis option says that entries are to be held by this database.\
    \ You should set this to the DN of the root of the subtree you are trying to create.\n\
    \nFor example:\nsuffix \"o=openarch, c=com\"\n\nYou should be sure to specify\
    \ a directory where the index files should be created\n\n+   - directory <directory>\n\
    \nFor example:\ndirectory /var/ldap\n\nYou need to make it so you can connect\
    \ to slap somebody with permission to add entries. This is done through the following\
    \ two options in the database definition:\n\n+   - rootpw <passwd> /* Remember\
    \ to use crypto password here !!! */\n\nFor example:\nrootdn \"cn=admin, o=openarch,\
    \ c=com\"\nrootpw secret\n\nThese options specify a DN and password that can be\
    \ used to authenticate as the \"superuser\" entry of the database (e.g. the entry\
    \ allowed to do anything). The DN and password specified here will always work,\
    \ regardless of whether the entry actually exists or has the password given.\n\
    \nFinally, you should make sure that the database contains the index definitions\
    \ you want:\n\nindex <attrlist| default> [pres,eq,approx,sub,none]\n\nFor example,\
    \ to the cn, sn, uid and objectclass attributes the index configuration lines\
    \ could be used.\n\nFor example:\nindex cn,sn,uid\nindex objectclass pres,eq\n\
    index default none\n\n© Copyright 1999 Open Network Architecture ® 271"
