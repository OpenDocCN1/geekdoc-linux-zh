    # Securing Apache


    There are important configuration options that can affect security. The first
    is the user that the web server runs (User and Group, httpd.conf). It is best
    to choose a user that has as few privileges - ideally, a user created just for
    the purpose of running the web server daemon. (We generally call it root) and
    ensure that it has minimal access to the system and functions.


    ```

    [root@deep#] groupadd -g 80 www

    [root@deep#] useradd -g 80 -u www

    ```


    # Change some important permissions file and directory of your Web Server.


    ```

    [root@deep#] chmod 511 /usr/bin/httpd

    [root@deep#] chmod 750 /etc/httpd/conf/

    [root@deep#] chmod 750 /var/log/httpd/

    ```


    You can create an http subdirectory which is modifiable by other users -- since
    root never executes any files out of, and shouldn''t be creating files in there
    (e.g. "home/httpd/ona/").


    # Automatic indexing


    By default, Apache comes with automatic indexing of directories enabled (IndexesOptions
    in httpd.conf). This means any request for a directory that does not find an index
    file, will build an index of what is in the directory. In many cases, this is
    a security issue, as you only want people seeing that you specifically link to.


    To turn off, you need to remove permissions from the directory (but not the files
    inside) - that is, chmod 311. Depending on the ownership of the directory, it
    should look like:


    ```

    [root@deep#] cd /home/httpd/

    [root@deep#] chmod 311 ona

    [root@deep#] ls -la

    ```


    ```

    d-w-xr-x 13 webmaster 1024

    ```


    Then, any requests for this protected directory should return an error message
    like this:


    Forbidden


