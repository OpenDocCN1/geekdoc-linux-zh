    # Increase the Tasks


    To increase the number of tasks (the maximum number of processes per user), you
    will need to edit the `/usr/src/include/tasks.h` file and change the following
    parameters.


    +   - Edit the tasks.h file (+14 /usr/src/include/tasks.h) and change:

    NR_TASKS from 512 to 3072

    MIN_TASKS_LEFT_FOR_ROOT from 4


    NOTE: 1) The value in NR_TASKS denotes the maximum number of tasks (processes)
    that the kernel will allocate per users. Increasing this number will allow to
    handle more connection from client (example an HTTP web server will be able to
    serve more client connections). 2 Linux is protected against allocating all slots
    by normal users. There are reserved MIN_TASKS_LEFT_FOR_ROOT for root. So there
    should be also protection to avoid allocating memory by normal users.


