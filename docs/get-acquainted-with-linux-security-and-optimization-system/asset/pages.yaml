    \ tape is automatically rewind after the backup set is written.\n\nWhen working\
    \ with tapes, you can use the following commands to rewind, and eject your tape:\n\
    [root@deep]# mt -f /dev/nst0 rewind\n[root@deep]# mt -f /dev/nst0 offline\n\n\
    # Server Restore Procedures\n\nThe thing that is more important than performing\
    \ regular backups is having them available when it comes time to recover an archive!\
    \ As discussed above, the procedures for performing a restore will differ depending\
    \ on your choice of a backup solution. In this section, we will discuss methods\
    \ for restoring files which have been backed up with \"tar\".\n\nThe following\
    \ command will restore all files from the \"full-backup-14-November-1999.tar.gz\"\
    \ archive, which is an example of a Linux server as created in the commands shown\
    \ above.\n\n+   * To restore a backup of your entire system, use the command:\n\
    \  [root@deep]# tar -xvpf/archive/full-backup-14-November-1999.tar.gz\n\nThe above\
    \ command extracts all files contained in the compressed archive, preserving original\
    \ ownership and permissions.\n\nz option that the archive is compressed with gzip.\n\
