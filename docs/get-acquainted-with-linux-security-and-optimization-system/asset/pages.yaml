    # malloc


    Many users found improved performance when linking Squid with an external malloc
    library, such as GNU malloc. Many Squid users use GNU malloc to follow these simple
    steps:


    +   1. Download the GNU malloc source, available from one of The GNU FTP Mirror
    sites (http://www.gnu.org/get/ftp.html).


    +   2. Compile GNU malloc:

    [root@deep]# tar xpf malloc.tar.gz

    [root@deep]# cd malloc

    [root@deep]# vi Makefile and uncomment the line: CPPFLAGS = -DUSG # the Makefile

    [root@deep]# export CC=gcc

    [root@deep]# make


    +   3. Copy libmalloc.a to your system''s directory and name it to libgnumalloc.a.

    [root@deep]# cp libmalloc.a /usr/lib/libgnumalloc.a


    +   4. (Optional) Copy the GNU malloc.h to your include directory and be sure
    to name it gnumalloc.h. This step is not required, but if you do this, Squid will
    be able to use the mstat() function to report memory usage statistics on the cachemgr
    info page.

    [root@deep]# cp malloc.h /usr/include/gnumalloc.h


