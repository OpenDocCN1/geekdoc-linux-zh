    | named | | 2599 | ipv4 | 3093 | UDP | deep.openarch.com:domain |

    | named | | 2599 | ipv4 | 3094 | UDP | deep.openarch.com:domain (LISTEN) |


    # 1.6 Run commands on remote via ssh without protocol logging in


    The ssh command can be used to run commands on remote systems without logging
    in. The output of the command is displayed and control returns to the local system.
    Here is an example which will display all users logged in the remote system.


    ```

    [admin@deep]$ $ ssh mail.openarch.com

    admin@mail.openarch.com''s password:

    root tty1 Dec 2 14:45

    admin tty2 Dec 2 14:45

    wahib pts0 Dec 2 11:38

    ```


    # 1.7 File Completion


    Tab completion allows you to type in portions of a program, and then press [TAB],
    and it will complete the filename for you. If there''s more than one file or program
    that starts


