    Now, return to the "/usr/src/linux/" (if you are not already on). You need to
    compile the new kernel. You can do so by using the following command:


    ```

    [root@deep]# make make; make clean; make bzimage

    ```


    This line contains three commands in one. The first one, **make**, actually takes
    your configuration and builds the dependency tree. This process determines what
    is compiled and when. The next step, **make clean**, erases all previous traces
    of a compilation so to avoid mistakes in which version of a feature gets into
    the kernel. Finally, **make bzimage** does the full compilation.


    After the process is complete, the kernel is compiled and ready to be installed.
    Before you install the kernel, you need to compile the corresponding modules.
    This is require only if you''re saying **Yes** to "Enable loadable module support
    (CONFIG_MODULES)" and are compiled some options as a module.


    +   - You do so by using the following command:

    [root@deep]# make modules

    [root@deep]# make modules_install


    NOTE: **make modules** and **make modules_install** commands are require only
    if you''re say to "Enable loadable module support (CONFIG_MODULES)" in your kernel
    configuration above.


    # Installing the new kernel


    +   1. Copy the file "/usr/src/linux/arch/i386/boot/bzimage" from the kernel source
    to "boot/ directory, and give it an appropriate name.


    ```

    [root@deep]# cp /usr/src/linux/arch/i386/boot/bzimage /boot/vmlinux-kernel.version.number

    ```


    NOTE: An appropriate or recommended new name is something like vmlinux-2.2.14,
    this is important if you want a new rescue floppy or emergency floppy booting
    using the mkbootdisk


