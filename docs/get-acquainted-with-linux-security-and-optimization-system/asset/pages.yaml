    # Configuration of the "/var/named/db.cache" file for a master and name server
    servers


    Before starting your DNS server you take a copy of "db.cache" file and copy this
    file in the "/var/named/" directory. The "db.cache" tells you the servers for
    the "root" zone are.


    Use the following command on other Unix in your organization to query a new db.cache
    file for your DNS Server or pick one from your Red Linux CD-ROM source distribution:


    ```

    [root@deep]# $ dig @root.servers.net -ns ns db-cache

    ```


    Don''t forget to copy the "db.cache" file to the "/var/named/" directory on your
    server where you are installing DNS server after retrieving it.


    # Secondary name server Server


    A name server splits the load with the master server and handles the whole load
    by the master server is down. A name server loads its data over the network from
    another name server (usually the master name server). This process is called a
    zone transfer.


