    # Securing BIND/DNS


    Running BIND in a chroot jail

    This part focuses on preventing BIND from being used as a point of break-in to
    the system hosting it. Since BIND performs a relatively large and complex function,
    the potential for bugs that affect security is high. In fact, there have been
    exploitable bugs that allowed a remote attacker to obtain access to hosting BIND.


    To minimize this risk, BIND can run as a non-root user, which will limit any damage
    to what can be done as a normal user with a local shell. Of course, allowing amounts
    to an anonymous guest account falls short of the security requirements for most
    DNS servers, so additional step can be taken - is, running BIND in a chroot jail.


    The main benefit of a chroot jail is that the jail will limit the portion of the
    filesystem daemon to see the root directory of the jail. Additionally, the jail
    only needs to support BIND, the programs available in the jail are extremely limited.
    Most importantly, there is no need for setuid-root programs, which have the right
    (or wrong...) bug, can be used to gain root access and break out of the jail.


    NOTE: named program must be in a directory listed in your PATH environment variable
    for this to work. If you''re root, and indeed do have BIND installed; this should
    be the case. For the rest of the documentation, I''ll assume the path of your
    original named is "/usr/sbin/named".


    Find the shared library dependencies of BIND. These will need to be copied into
    the chroot jail later.


    ```

    [root@deep]# ldd /usr/sbin/named

    ```


    © Copyright 1999 Open Network Architecture ® 206'
