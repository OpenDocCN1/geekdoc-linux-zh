    # The noatime


    Linux has a mount option for filesystems noatime. This option can be added to
    the mount options in `/etc/fstab`. When a filesystem is mounted with this option,
    read accesses will no longer result in an atime information associated with the
    file. The atime info is generally not all that is useful, so the lacks of updates
    to this file are not often relevant.


    The importance of the noatime setting is that it eliminates the need to make writes
    to the filesystem, which are simply being read. Since writes tend to be somewhat
    expensive, this can result in measurable performance gains. Note that the wtime
    will continue to be updated anytime if the file is written.


    Edit the fstab (`/etc/fstab`) and add noatime option to:


    ```

    /dev/sda7    /chroot  ext2  nosuid,nodel,noatime

    ```


    Assuming `/dev/sda7` is your partition where the `/chroot` live.


    # Reboot your system and test your results with the command:


    ```

    [root@deep]# reboot

    [root@deep]# cat /proc/mounts

    ```


    # The ip_local_port_range


    This documentation is for the sysctl file `/proc/sys/net/ipv4/ip_local_port_range`
    and is valid for Linux kernel 2.2. `ip_local_port_range` - 2 INTEGERS.


    Defines the range used by TCP and UDP to choose the local port. The first number
    is the first (port), the second last local port number. For high-usage systems
    change this to 32768-61000.


    ```

    echo "32768 61000" > /proc/sys/net/ipv4/ip_local_port_range

    ```


    Add the above command to `/etc/rc.d/rc.local` and you won''t have to type it again
    next time if you reboot your system.


