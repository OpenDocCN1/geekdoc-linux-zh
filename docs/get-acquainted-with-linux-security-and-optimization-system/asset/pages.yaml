    # 1.5 Do you have "isof" installed?


    If not, install and execute "isof -i". This should list ports you have open on
    your machine. Isof is a great tool, however a much easier way to check for tcp
    ports is ''netstat -an | grep LISTEN''. The nice thing about isof is that it will
    tell you which processes are listening on a given port. Netstat tells you which
    ports are open, not what process is attached.


    | COMMAND USER FD TYPE SIZE NAME |

    | --- | --- | --- | --- | --- | --- | --- |

    | Inetd | | 344 | ipv4 | 327 | TCP | *:ssh (LISTEN) |

    | sendmail | | 389 | ipv4 | 387 | TCP | *:smtp (LISTEN) |

    | nmbd | | 450 | ipv4 | 452 | TCP | deep.openarch.com:netbios-ssn (LISTEN) |

    | nmbd | | 461 | ipv4 | 463 | UDP | *:netbios-ns |

