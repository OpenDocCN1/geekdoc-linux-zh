  md: '# Obtaining Requests for Comments (RFCs)


    Requests for Comments (RFCs) is an ongoing set of documents issued by the Internet
    Engineering Task Force (IETF) at the Network Information Center (NIC) that presents
    new protocols and establishes standards for the Internet protocol suite. Each
    such document defines an aspect of regulating the Internet. We have listed below
    all the RFCs that pertain to this book. RFCs are available from the following
    site: http://www.cis.ohio-state.edu/rfc/


    +   - RFC706: On the Junk Mail Problem.

    - RFC733: Standard for the Format of ARPA Network Text Messages.

    - RFC768: User Datagram Protocol (UDP).

    - RFC791: Internet Protocol (IP).

    - RFC792: Internet Control Message Protocol (ICMP).

    - RFC793: Transmission Control Protocol (TCP).

    - RFC805: Computer Mail Mailing Notes.

    - RFC821: Simple Mail Transfer Protocol (SMTP).

    - RFC822: Standard for the Format of ARPA Internet Text Messages.

    - RFC934: Proposed Standard for Message Encapsulation.

    - RFC950: IP Sub Extention.

    - RFC959: File Transfer Protocol (FTP).

    - RFC976: UUCP Mail Interchange Format Standard.

    - RFC1034: Domain Names: Concepts and Facilities.

    - RFC1036: Standard for Interchange of USENET Message.

    - RFC1058'
