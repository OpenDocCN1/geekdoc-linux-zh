    \nWithin each header there are multitudes of areas that are not used for normal\
    \ transmission or as \"optional\" fields to be set as needed by the sender of\
    \ the datagrams. An analysis of the areas of a typical IP header that are either\
    \ unused or optional reveals many possibilities where data can be stored and transmitted.\
    \ The basis of exploitation relies in encoding ASCII values of the range 0-255.\
    \ Using this method it is possible to pass data between packets that appear to\
    \ be initial connection requests, established data streams, or other intermediate\
    \ steps. These packets can contain no actual data, or data designed to look innocent.\
    \ These packets can also contain forged source and destination IP addresses as\
    \ well as forged source and destination ports. This can be useful for tunneling\
    \ information past some types of packet filters. Additionally, forged packets\
    \ can be used to initiate an anonymous TCP/IP \"bounced packet network\" whereby\
    \ packets between systems are relayed off legitimate sites to thwart tracking\
    \ by sniffers and other network monitoring devices.\n\n# Implementation of Security\
    \ Solutions\n\n+   The following protocols and systems are commonly used to solve\
