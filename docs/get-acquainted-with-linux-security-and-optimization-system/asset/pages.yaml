    # Running the integrity check


    The Integrity Check mode compares the current file system objects with their properties
    recorded in the Tripwire database. Violations will be printed to stdout; the report
    file will be saved and can later be accessed by triprint.


    The syntax for integrity check mode is:


    ```

    [root]@deep]# tripwire --check

    ```


    +   * To run the integrity check mode, use the command:

    [root]@deep]# tripwire --check


    You can also run Tripwire in Interactive Check mode. In interactive mode you can
    automatically update your changes with the terminal. With the adding "-interactive"
    syntax, the resulting report is opened in an editor for database updates.


    +   * To run in interactive check mode, use the command:

    [root]@deep]# tripwire --check--interactive


    An email option enables you to send email. Running Tripwire with the option [-email-report]
    specifies that reports will be emailed to the recipients in the policy file, using
    the options in the default configuration file.


    +   * To run the integrity check mode and send email to the recipient, use the
    command:

    [root]@deep]# tripwire --check--email-report


    # Updating the database after an integrity check


    Database Update mode enables you to update the Tripwire database after an integrity
    check, if the violations discovered are actually valid. This process saves you
    time by enabling you to update the database without having to regenerate; even
    more importantly it enables selective updating, which can be done through regeneration.
    In our configuration of tripwire, the configuration file specifies the report
    filename using time-based variables, the report will not be in a regular mode.
    This happens because the $(DATE) variable will have changed to reflect the current
    time. To solve this, the report file must be specified on the command line with
    the -r or -twistle argument.


    The syntax for database update mode is:


    ```

    [root]@deep]# tripwire --update -r

    ```


    +   * To update the database, use the command:

    [root]@deep]# tripwire --update -r /usr/TSS/report/deep.openarch.com-200001-021854


    Where "r" specifies the report file (deep.openarch.com-200001-021854.twr). This
    option is required the REQUIRED_REPORT variable in the configuration file $(DATE).


    NOTE: In Database Update mode or Interactive Check mode, Tripwire displays the
    report with a ballot box next to each policy violation. You can approve a change
    to the system by leaving the "x" next to each policy violation. If you remove
    the "x" from the ballot box, the database will not be updated with the new value(s)
    for that object. After you exit the editor and provide the local passphrase, Tripwire
    software update and save the database.'
