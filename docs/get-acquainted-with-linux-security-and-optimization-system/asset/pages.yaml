    # # Packages


    Tripwire Homepage: http://www.tripwiresecurity.com/

    You must be sure to download: Tripwire_221_for_Linux_x86_tar.gz


    # ## Compilation Tripwire-2.2.1


    Decompress the tarball (tar.gz).


    ```

    [root@deep6 #] cp Tripwire_version_for_Linux_x86_tar.gz /var/tmp

    [root@deep6 #] cd /var/tmp

    [root@deep6 #] tar xpf Tripwire_version_for_Linux_x86_tar.gz

    ```


    NOTE: After the decompression of Tripwire you will see the following files in
    "var/tmp" directory to Tripwire software: License.txt, README, Release_Notes,
    install.cfg, install.sh, the pkg directory and the Tripwire tar.gz file Tripwire_version_for_Linux_x86_tar.gz.


    # ## Compile and Optimize


    During the installation procedure, you will:


    +   1. Specify configuration options for default operation.

    2. Plan for two passphrases to be assigned for your site and local keys.

    3. Run the installation script.

    4. Edit the configuration and policy files.

    5. Troubleshoot configuration and policy setup, as needed.

    6. Initialize the Tripwire software database.


    # ## Configuration of the "var/tmp/install.cfg" file


    Recall that Tripwire version 2.2.1 is not open source, so you cannot compile and
    install it like other archive sources instead you must modify the "install.cfg"
    file of Tripwire (that will install automatically Tripwire software for you) specify
    installation paths for your system. We must modify this file to be compliant with
    Red Hat file system structure and install Tripwire binaries under our PATH ENVIRONMENT
    VARIABLE.


    Step 1

    Edit the install.cfg file (vi /var/tmp/install.cfg) and change this file to look
    like:


    ```

    #

    # install.cfg

