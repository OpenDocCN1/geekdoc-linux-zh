    # Configure the /etc/ssh/ssh2_config


    The configuration file for "/etc/ssh/ssh2_config" allows you to set options that
    modify the operation of the client programs. These files contain keyword-value
    pairs, one per line, with keywords being case sensitive. Here are the most important
    keywords; a complete listing is available in the man page for ssh2 (1).


    Edit the ssh2_config file (vi /etc/ssh/ssh2_config) and add:


    ```

    # ssh2_config

    # SSH 2.0 Client Configuration File

    ```


    | | |

    |---|---|

    | Port Ciphers | AnyStdCipher |

    | Compression | yes |

    | IdentityFile | identification |

    | AuthorizationFile | authorization |

    | RandomSeedFile | random_seed |

    | VerboseMode | no |

    | ForwardAgent | no |

    | ForwardX11 | no |

    | PasswordPrompt | %U''s password:"* |

    | Sh1Compatibility | no |

    | Sh1AgentCompatibility | none |

    | NoDelay | yes |

    | KeepAlive | yes |

    | QuietMode | no |


    This ssh2_config file to set itself up for this particular configuration setup
    with:


    Port 22

    This option "Port" specifies the port number that sshd listens on.


    Ciphers AnyStdCipher

    This option "Ciphers" specifies the ciphers to use for encrypting the session.
    AnyStd allows only standard ciphers.


    Compression yes

    This option "Compression" specifies whether to use compression.


    IdentityFile identification

    This option "IdentityFile" specifies the name of the user''s identification file.


    AuthorizationFile authorization

    This option "AuthorizationFile" specifies the name of the user''s authorization
    file.


    RandomSeedFile random_seed

    This option "RandomSeedFile" specifies the name of the user''s randomseed.


    VerboseMode no

    This option "VerboseMode" causes ssh2 to print debug messages about its progress.
    This is helpful in debugging connection, authentication, and configuration problems.


    ForwardAgent no

    This option "ForwardAgent" specifies whether the connection to the authentication
    agent (if any) will be forwarded to the remote machine.


    © Copyright 1999 Open Network Architecture ®'
