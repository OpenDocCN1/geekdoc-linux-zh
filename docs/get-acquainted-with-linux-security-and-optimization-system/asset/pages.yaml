  md: '# IP Masquerading and ICMP Masquerading are require only for a Gateway Server.

    IPMasquerading (CONFIG_IP_MASQUERADE) [N] Y

    ICMP Masquerading (CONFIG_IP_MASQUERADE_ICMP) [N] Y


    NOTE: Only your Gateway Server need to have "IP:Masquerading" and "IP:ICMP Masquerading"
    kernel option. This is require to your Internal Network for the outside.


    Masquerade means that if one of the computers on your local network for your Linux
    box acts as a firewall wants to send something to the outside, your box can "masquerade"
    as that computer, i.e it forwards the traffic to the intended outside destination,
    but makes it look like came from the firewall itself.


    It works both ways; if the outside replies, the Linux firewall will silently forward
    the traffic to the corresponding local computer. This way, the computers on your
    local network are completely invisible to the outside, even though they can reach
    the outside and receive replies. This makes it possible to have the computers
    on the local network participate on the Internet even if they don''t officially
    registered IP addresses.


    The IP masquerading code will only work if IP forwarding is enabled across a line:


    ```

    echo "1" > /proc/sys/net/v4/ip_forward

    ```


    from a boot script the "/proc" filesystem has been mounted. You can add this line
    in "/etc/rc.d/rc.local" so IP forwarding is enabled automatically when your server
    is rebooted.


    Edit the rc.local file (vi /etc/rc.d/rc.local) and add the line:


    ```

    echo "1" > /proc/sys/net/v4/ip_forward

    ```


    NOTE: The IP forwarding line above is only require when you answer "Yes" to the
    kernel option "IP:Masquerading (CONFIG_IP_MASQUERADE) and choose to have a server
    act as a Gateway and masquerading for your inside network.


    If you enable IP Masquerading, then the modules ip_masq_ftp.o (for ftp file transfers),
    ip_masq_irc.o (for irc chats), ip_masq_aque.o (you guessed it), ip_masq_vdolive.o
    (for VDOLIVE video connections), ip_masq_cuseeme.o (for CU-See broadcasts) and
    ip_masq_radio.o (for Real/Audio downloads) will be automatically compiled. They
    are needed to make masquerading for these protocols.


    Also, you''ll need to build a modularized kernel and answer "Yes" to the "Enable
    module support (CONFIG_MODULES)" option instead of a monolithic kernel to be able
    to use masquerading functions and modules like ip_masq_ftp.o on your Gateway server
    (see the Kernel section for more information).


    The basic masquerade code described for "IP: masquerading" above only handles
    TCP or UDP packets (and ICMP errors for existing connections). IP-Masquerading
    adds additional support for masquerading ICMP packets, such as ping or the probes
    used by the Windows 95 tracer program.


    NOTE: Remember, other servers like Web Server and Mail Server (which also) doesn''t
    need to have these options enabled since there have a real IP address assigned
    or doesn''t act as a Gateway for the inside network.'
