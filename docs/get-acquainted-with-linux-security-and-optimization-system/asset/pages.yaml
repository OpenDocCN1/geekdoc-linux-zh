    # Exporting keys


    GnuPG has options to help you publish public keys. This is called "exporting"
    a key. By exporting public keys you can broaden your horizon. This can be done
    by publishing it on homepage, through a key server or any other method you can
    think of.


    +   - To extract your public key in ASCII armored output, use the following command:

    [root@deep]# gpg --export --armor > Public-key.asc


    Which mean "-export" is for extracting your public key from publishing keyring,
    "-armor" to create ASCII armored output that you can mail, publish or put on a
    web page and > Public-key.asc to put the result in a file that you''ve named Public-key.asc.


    # Signing and checking


    Everyone knows your public key (you can and sign your public key by putting it
    on a server, web page, etc) is now able to check whether you signed this text.


    +   - To sign a signature or a binary file, use the following command:

    [root@deep]# gpg --detach-sign --armor <Data>


    You can write the signature in a separate file. It is highly recommended to use
    this option when signing binary files (like archives for instance). Also the --armor
    option can be extremely useful here. \<data> can be a file or a binary file like
    tar.


    +   - To check the signature of encrypted data, use the following command:

    [root@deep]# gpg --verify <Data>


    GPG now checks whether the signature is valid and prints an appropriate message.
    If the signature is good, you know at least the person (or machine) has access
    to the secret key, which corresponds to the public key. When encrypted data has
    been signed as well, the signature is checked when the data is decrypted. This
    will only work (of course) when you own the public key of the sender. \<data>
    is the same as yours.


