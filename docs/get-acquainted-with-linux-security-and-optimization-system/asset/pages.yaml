    \ the following files are required and must be created or copied to their appropriate\
    \ directories on your server.\n\nThe copy.slapd file is in \"/etc/ldap/\" directory.\
    \ The copy ldap script file is in \"/etc/rc/init.d/\" directory.\n\nYou can obtain\
    \ configuration files listed below on floppy.tgz archive. Copy the following from\
