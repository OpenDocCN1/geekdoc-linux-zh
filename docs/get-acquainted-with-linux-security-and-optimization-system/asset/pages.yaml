    # Running Apache in a chroot jail


    This focuses on preventing Apache from being used as a proxy of break-in to the
    system

    hosting. Apache runs by default as a non-root user, which will limit any damage
    to what can be

    eas a normal user with a local shell. Of course, allowing amounts to an anonymous

    guest accounts allows for short of the security requirements for most Apache servers,
    or as

    additional step can be - that is, running Apache in a chroot jail.


    The main benefit of a chroot jail is that it will limit the portion of the filesystem
    daemon

    can see to the root directory of the jail. Additionally, since the jail only supports
    Apache,

    the programs in the jail can be extremely limited. Most importantly, there is
    no need for

    setuid-root programs, which given the right (or wrong...) bug, can be used to
    gain root access

    break out of the jail.


    Chrooting apache is no easy task and has a tendency to break things. Before embark
    on this,

    we need to first decide whether it is beneficial for you to do so. Some pros and
    cons are but most

    certainly limited to:


    # Pros:


    +   If apache is ever compromised, the attacker will not have access to the entire
    file system.

    Also make sure apache is running as its own unique user/group, and not something
    that''s

    over used, such as "nobody". Consider the scenario where a web server is running
    as


