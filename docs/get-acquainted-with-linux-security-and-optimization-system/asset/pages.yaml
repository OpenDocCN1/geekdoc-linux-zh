  md: 'Comments and suggestions concerning this page should be mailed to gmnourani@videotron.ca


    Operation is as follows: whenever a request for service arrives, the inet daemon
    is tricked into running the tcp program instead of the desired server. tcpd does
    some additional checks. When well, tcp runs the appropriate server program and
    goes away.


    tcp verifies the client name that is returned by the address->name server by looking
    at the host name and address returned by the address->name DNS server. Any discrepancy
    is detected, tcp concludes that it is dealing with a pretend that has to someone
    else''s host.


    Optional, tcpd assigns source-routing options on every connection that it connects
    to. This will take care of most attacks from hosts that pretend to have an address
    that belongs to someone else''s network. UDP services do not benefit from this
    protection. Time out problems often caused by the server trying to resolve the
    client IP address to a DNS name. Either DNS isn''t properly configured on your
    server or the clients not known to DNS.


    If you are intended to run telnet or ip services on your server, and aren''t using
    to add client machine name and IP in your "etc/hosts" file on the server or you
    can expect to wait several minutes for the DNS lookup to time out, before you
    get a: prompt:


