    half_closed_clients

    This option "half-closed_clients" if set to off, tell Squid to immediately close
    client connections when read(2) returns no data to read, some clients may shut
    down the side of TCP connections, leaving their receiving open. Times, Squid can
    not tell the difference between a half-closed and a fully-closed TCP connection.


    acl all 0.0.0.0/0.0 and http_access allow all

    These options "acl" and "http_access" defining an Access List. See your documentation
    for information. "acl" and "http_access" allow every one to connect to the proxy
    server we use this proxy to accelerated our Web Server.


    cache_mgr_admin

    This option "cache_mgr_admin" specifies the email-address of local cache manager
    who will receive mail if the cache dies.


    cache_effective_user squid and cache_effective_group squid

    This option "cache_effective_user and cache_effective_group" specifies the UID:GID
    the cache will run on. This is a security feature and you must never run Squid
    as a "root" user. In our configuration we use the "Squid" and the GID "squid".


    httpd_acc_host 208.164.186.3 and httpd_acc_port 80


