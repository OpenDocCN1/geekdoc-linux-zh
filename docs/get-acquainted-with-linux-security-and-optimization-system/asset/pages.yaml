    # ### The ''etc/aliases and aliases.db'' files for the Central Mail Hub

    alias is the process of converting one recipient into another. One is to convert
    a generic name (such as root) to a real username. Another is to convert one name
    into a list of names (for mailing). For every envelope that lists a user as a
    recipient, sendmail looks up the recipient in the "aliases" file. Because sendmail
    may have to search through thousands of names in the "aliases" file, a version
    of the file is stored in a separate "db" database format to significantly improve
    lookup speed. If you configure your sendmail to use a central server (Mail Hub)
    to handles all, you do not need to install "aliases" and "aliases.db" files on
    the neighbor server or client machines.


    Step 1

    Create the aliases file (touch /etc/aliases) and add the following lines:


    ```

    #

    # @(#)aliases 8.2 (Berkeley) 3/5/94

    # Aliases in this file will NOT be expanded in the header

    # Mail, but WILL be visible over networks or from /bin/mail.

    #

    >>>>>>> The program "must be run after

    >>>>>> NOTE >> this file is updated for any changes to

    >>>>>>> show through sendmail.

    #

    ```


    ```

    # Basic system aliases -- these MUST be present.

    MAILER-DAEMON: postmaster

    postmaster: root

    # General redirections for pseudo accounts.

    bin: root

    daemon: root

    nbody: root

    # Person who should get root''s mail

