    # This tells Squid to set itself up for this particular hardware setup with:


    +   - Use Cache Digests to improve performance.

    - Enable poll() instead of select().

    - Disable-indent-lookups allows you to remove code that performs Ident (RFC 9317)
    lookups,

    - Enable-truncate instead of unlink() when removing cache files. Truncate gives
    a little performance improvement. Also take a note that Truncate uses many inodes
    without unlink.

    - Enable-underscores. Squid by default rejects any hosts with _ in their name
    to conform to Internet standards. If you disagree with this you may allow _hostnames
    using this switch, provided that the resolver library of the host Squid does not
    reject _hostnames.

    - Enable-heap-replacement. This option allows you to use various cache replacement
    algorithms. See below for more explication.


    ```

    [root@deep]$ make makefile

    [root@deep]$ make install

    [root@deep]$ mkdir -p /var/log/squid

    [root@deep]$ rm -rf /var/logs/

    [root@deep]$ chmod squid.squid /var/log/squid/

