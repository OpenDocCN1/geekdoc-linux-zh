    # These installation instructions assume


    Commands are Unix-compatible.

    The source path is `/var/tmp` (other paths are possible).

    Installations are tested on RedHat Linux 6.1.

    All steps in the installation will be performed in superuser account ''root''.

    OpenLDAP version number is 1_2_8


    # Packages


    OpenLDAP Homepage: http://www.openldap.org/

    You must be sure to download: openldap-1_2_8.tgz


    # Tarballs


    It is a good idea to make a list of files before the system you install OpenLDAP,
    and one afterwards, and then compare them using `diff` to find out what it placed
    where. Simply run `find * > ldap1` and `find * > ldap2` after you install the
    software, and use `diff ldap1 > ldap2` to get a list of changed.


    # Compilation


    Decompress the tarball (tar.gz).


    ```

    [root@deep#] cp openldap-version.tgz /var/tmp

    [root@deep#] cd /var/tmp/

    [root@deep#] tar xzf openldap-version.tgz

    ```


    # Compile and Optimize


    Cd into the new OpenLDAP directory and type the following commands on your terminal:

    Edit the string.h file (vi +52 include/ac/string.h) and remove the lines:


    #else


    > /* some systems have struct(), but fail to declare it */

    extern char (*strdup);


    The following lines do not apply to your Linux system and must be removed:


    ```

    CC=gcc

    CFLAGS=-O9 -unroll-loops -fast-math -align-double -mpu=pientiumpro -march=pientiumpro
    -fomit-

    frame-pointer -fno-exceptions*\

    ./configure\\

    --prefix=/usr

    --libexecdir=/usr/bin

    --localstatedir=/var/run

    --sysconfdir=/etc

    --enable-shared\

    --with-gnu-ld

    ```


    This tells OpenLDAP to set itself up for this particular hardware setup with:


    +   - Build shared libraries.

    - Assume the C compiler uses GNU Id.


    © Copyright 1999 Open Network Architecture ®


