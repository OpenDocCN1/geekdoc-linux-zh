    finished to install your new Linux system, or using a RPM package to upgrade your
    Linux system, use the following command to install the Linux kernel:


    +   - You can verify if a kernel RPM packages are installed on your system with
    the following command:

    [root@deep]# rpm -qa | grep kernel

    kernel-headers-2.2.12-20.i386

    kernel-2.2.12-20.i386'
