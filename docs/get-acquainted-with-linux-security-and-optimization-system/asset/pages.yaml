    # Overview


    The OpenSSL Project is a collaborative effort to develop a robust, commercial-grade,
    fully featured, and Open Source toolkit for implementing the Secure Sockets Layer
    (SSL v2/v3) and Transport Layer Security (TLS v1) protocols with full-strength
    cryptography.


