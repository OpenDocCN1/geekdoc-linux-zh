    With this method you use the ldadd tool to add entries, just like you would once
    the database is created. For example, to add “Europe Mourani” entry into the ldadd
    tool, you could create a file called "tmp/newentry" with the contents:


    Create the new entry (/tmp/newentry) and add this in the file contents:


    cn=Europe Mourani, o=openarch, c=com

    cn=Europe Mourani

    sn=Mourani

    ail=mourani@old.com

    description=Marketing relation.

    objectClass=top

    objectClass=person


    +   And use a command to actually create this entry:

    [root@deepj] ldadd -f /tmp/newentry -D "cn=admin, o=openarch, c=com" -W

    ter LDAP Password :


    The above command assumes that you set rootdn to "cn=admin, o=openarch, c=com"
    and rootpw to "secret". You will be prompted to enter the password.


    ldapmodify

    The ldapmodify command opens a connection to an LDAP server, binds, and modifies
    or adds entries. The entry information is read from standard input or from file
    through the use of the -f option.


    Input format for the ldmodify/entry exists and has the contents:

    c=Europe Mourani, o=openarch, c=com

    - mail=mourani@old.com # will delete the mail address for Europe Mourani in the
    database.


