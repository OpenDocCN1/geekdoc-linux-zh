    There are a number of files related to the Linux IPX support that are located
    within the /proc

    filesystem. They are:


    /proc/net/ipx_interface


    This file contains information about the IPX interfaces configured on your machine.
    These

    have been configured manually by command or automatically detected and configured.


    /proc/net/ipx_route


    This file contains a list of the routes that exist in the IPX routing table. These
    routes may

    been added manually by command or automatically by an IPX routing daemon.


    /proc/net/ipx


    This file is a list of the IPX sockets that are currently open for use on the
    machine.


    # Linux FTP Server


    # Overview


    Using the File Transfer Protocol (FTP) is a popular way to transfer files from
    machine to machine\across a network. Clients and servers have been written for
    all the popular platforms, thereby

    often making FTP the most convenient way of performing file transfers.


    You can configure FTP servers in many ways. One is as private user-only site,
    which

    is the default configuration for FTP server; A private FTP server allows users
    on the system

    to only be able to connect via FTP and access their files. You can place access
    controls on

    users so that certain can be explicitly denied or granted access.


    Another kind of FTP server is anonymous. An anonymous FTP server allows anyone
    on the

    network to connect to it without having an account. Due to the potential security

    risk involved with this setup, you should take precautions to allow access only
    to certain

    directories on the system.


