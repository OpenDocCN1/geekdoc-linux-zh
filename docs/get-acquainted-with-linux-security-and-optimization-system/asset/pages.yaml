    # # TCP/IP security problem overview


    It is assumed that the reader is familiar with the basic operation of the TCP/IP
    protocol suite, which includes IP and TCP header field functions and initial connection
    negotiation. For the unsolicited, brief description of TCP/IP connection negotiation
    is given below. The user is strongly encouraged to research other published literature
    on the subject.


    # # IP Packets


    The packet refers to an Internet Protocol (IP) network message. It''s name given
    to a single, discrete message or piece of information that is sent across an Ethernet
    network. Structurally, a packet contains an information header and a message body
    containing the data being transferred. The body of the IP packet-is data: it is
    all or a piece (fragment) of a higher-level protocol message.


    # # The IP mechanism


    Linux supports three message types: ICMP, UDP, and TCP. An ICMP (Internet Message
    Protocol) is a network-level, control and status message. ICMP messages contain
    information about the connection between the two end points. A UDP (User Datagram
    Protocol) packet carries data between two network-programs, without any guarantees
    guaranteeing successful delivery or delivery ordering. Sending a UDP packet is
    akin to sending a postcard to another post. A TCP (Transmission Control Protocol)
    IP packet carries data between two network-based programs, as well, but the packet
    header contains additional state information for maintaining an ongoing, reliable
    connection. Connecting a TCP is to having a phone conversation with another process.
    Most Internet services use the TCP communication protocol rather than UDP communication
    protocol. In other words, most Internet services are based on the idea of an ongoing
    connection with two-way communication between a client and a server program.


    # # IP packet headers


    All IP packets contain the source and destination IP addresses and the type of
    protocol message (ICMP, UDP or TCP) this packet contains. Beyond this, a packet
    headers slightly different fields depending on the protocol. ICMP packets contain
    a type field identifying the control or status message, with a second code field
    for defining the message more specifically. UDP and TCP packets contain source
    and destination port numbers. TCP packets contain additional information about
    the state of the connection and unique identifiers for each packet.'
