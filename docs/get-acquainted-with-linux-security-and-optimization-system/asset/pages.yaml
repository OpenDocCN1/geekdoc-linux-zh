    # # Linux GnuPG


    # ## Overview


    GnuPG - The Gnu Privacy Guard. GnuPG is GNU''s tool for secure communication and
    data storage. It can be used to encrypt data and create digital signatures. It
    is an advanced key management facility and compatible with the proposed OpenPGP
    Internet standard as described in RFC2440.


    Because GnuPG does not use any patented algorithm it not compatible with PGP2
    versions. PGP 2.x uses only IDEA (which is patented worldwide) and RSA (which
    is patented in the United States until Sep 20, 2000).


