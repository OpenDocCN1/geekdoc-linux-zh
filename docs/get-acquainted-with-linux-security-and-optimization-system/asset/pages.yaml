    # 17. The "/etc/host.conf" file


    Linux uses a resolver library to obtain the IP address corresponding to a host
    name. The

    `/etc/host.conf` file specifies how names are resolved. The entries in the `/etc/host.conf`
    file tell the

    resolver library services to use, and in what, to resolve names.


    Edit the **host.conf** file (/etc/host.conf) and add the following lines:


    +   # Lookup names via DNS first then fall back to /etc/hosts.

