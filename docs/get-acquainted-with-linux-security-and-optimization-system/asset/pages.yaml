    # 13. The "etc/aliases" file


    The aliases file can easily be used to gain privileged status if it wrongly or
    carelessly administered. For example, many vendors use to ship systems with a
    "decode" alias in the aliases file.


    The intention is to provide an easy way for users to transfer binary files using
    mail. At the sending side user converts the binary to ASCII with "uencode", then
    mails the result to the "decode" alias at the receiving side. That alias pipes
