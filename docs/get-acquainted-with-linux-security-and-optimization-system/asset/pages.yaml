    \ paste them directly from this book to the concerned file.\n\n# # Configuration\
    \ of the \"/etc/ldap/slapd.conf\" file\n\nThe \"/etc/ldap/slapd.conf\" file is\
    \ the main config file for configuring ldap server, permission, password, database\
