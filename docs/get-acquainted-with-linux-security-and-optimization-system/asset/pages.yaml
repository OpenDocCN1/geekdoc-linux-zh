    code of the patch.


    # Applying the path


    Decompress the tarball (tar.gz).


    ```

    [root@deep]# cp linux-2_2_14-ow1.tar.gz /usr/src/

    [root@deep]# cd /usr/src/

    [root@deep]# tar zpf linux-2_2_14-ow1.tar.gz

    [root@deep]# cd linux-2_2_14-ow1/

    [root@deep]# mv linux-2_2_14-ow1.diff /usr/src/

    [root@deep]# cd ..

    [root@deep]# patch -p0 < linux-2_2_14-ow1.diff

    [root@deep]# rm -rf linux-2_2_14-ow1

    [root@deep]# rm -f linux-2_2_14-ow1.diff

    [root@deep]# rm -f linux-2_2_14-ow1.tar.gz

    ```


    First we copy the archive to the "/usr/src" directory, then we move to the "/usr/src"
    directory and decompress the linux patch, move the file linux-2_2_14-ow1.diff
    containing the patch to "/usr/src", return to the "/usr/src" and patch our kernel
    with the file linux-2_2_14-ow1.diff. After, we remove all files related to the
    patch.


    NOTE: All security messages related to the linux-2_2_14-ow1 patch like non-executable
    stack part should get logged to the log file "var/log/messages".


    The step of patching your new kernel is completed. Now follow the rest of installation
    to build the Linux kernel and reboot.


