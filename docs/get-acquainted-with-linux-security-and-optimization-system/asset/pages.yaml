  md: 'Swap partition are used to support virtual memory. If your computer has 16
    MB of RAM or less, you must create a swap partition. Even if you have more memory,
    a swap partition is still recommended. The minimum size of your swap partition
    should be equal to your computer''s RAM or 16 MB (whichever is larger). The largest
    usable swap partition is roughly 1 GB, (since 2.2 kernel, GB swap files are supported)
    making a swap partition larger than that will result in wasted space. Notes, however,
    you can create and use more than one swap partition (this is only necessary for
    very large server installations).


    Try to put your swap partitions near the beginning of your drive. The beginning
    of the drive is physically located on the outer portion of the cylinder, the read/write
    head can cover much more ground per revolution.


    Now as an example:


    To make the partitions listed below your system (this is the partition we''ll
    need for our server installation), the command will be Disk Druid:


    Add

    Mount Point: /boot ← our /boot directory.

    Size (Megs): 5

    Partition Type: Linux Native

    Ok


    Add

    Mount Point: /usr ← our /usr directory.

    Size (Megs): 1000

    Partition Type: Linux Native

    Ok


    Add

    Mount Point: /home ← our /home directory.

    Size (Megs): 500

    Partition Type: Linux Native

    Ok


    Add

    Mount Point: /chroot ← our /chroot directory.

