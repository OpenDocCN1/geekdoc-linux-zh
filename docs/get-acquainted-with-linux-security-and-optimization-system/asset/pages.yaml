  md: "# Necessary files to setup a secondary slave name server are:\n\nnamed.conf\n\
    db.127.0.0\ndb.cache\nnamed script\n\n# Configuration of the \"/etc/named.conf\"\
    \ file for a slave name server\n\nUse this configuration for the slave name server\
    \ on your network that acts as a slave name server. You must modify the \"named.conf\"\
    \ file for the slave name server host. Change every occurrence of primary to secondary\
    \ except for \"0.0.127.in-addr.arpa\" and adds a master line with the IP address\
    \ of the master server.\n\nCreate the named.conf file (/etc/named.conf) and add:\n\
    \n```\noptions {\n  directory \"var/named\";\n  fetch-glue no;\n  recursion no;\n\
    \  allow-query { 208.164.186/24; 127.0.0.8 };\n  allow-transfer { 208.164.186.1\
    \ };\n  transfer-many-answers;\n};\n```\n\n```\n// These files are not specific\
    \ to any zone\nzone \" {\n  type hint;\n  file \"db.cache\";\n};\n```\n\n```\n\
    zone \"0.0.127.in-addr.arpa\" in {\n  type master;\n  file \"db.127.0.0\";\n};\n\
    ```\n\n```\n// These are your slave zone files\nzone \"openarch.com\" in {\n \
    \ type slave;\n  file \"db.openarch\";\n  masters { 208.164.186.1 };\n};\n```\n\
    \n```\nzone \"186.164.208.in-addr.arpa\" in {\n  type slave;\n  file \"db.208.164.186\"\
    ;\n  masters { 208.164.186.1 };\n};\n```\n\nA slave name server doesn't need to\
    \ retrieve all of its files over the network; the overhead files, \"db.127.0.0\"\
    \ and \"db.cache\", are the same as on a primary master, so keep a local copy\
    \ of the slave.\n\nCopy the \"db.127.0.0\" file from master name server to slave\
    \ name server.\nCopy the \"db.cache\" file from master name server to slave name\
    \ server."
