    # # Linux Squid Proxy Server


    A few proxy-server programs are on the market. These proxy-servers have two main
    drawbacks: they are commercial software and do not support ICP. The excellent
    Apache web server has included a proxy-cache module since its 1.2. This module
    is a very interesting option: it''s free, and works with the most popular web
    server on the Net. However, it doesn''t use ICP, and its robustness is not comparable
    to the best choice for a proxy-cache server: SQUID.


    Squid consists in these programs:


    +   - **squid**: the main proxy server

    - **dnsserver**: a DNS lookup program performs single, blocking DNS operations

    - **unlink**: a program to delete files in the background from the cache directory.


    It also provides a CGI program, designed to run through a web interface, that
    outputs statistics about its configuration and performance and allows some management
    capabilities.


    Squid is a high-performance proxy-cache server and it is the result of numerous
    individuals from the Internet community. Development is led by Du Welles of the
    National Laboratory for Applied Network Research and funded by the National Science
    Foundation. Squid is derived from the "cache" software from the ARPA-funded Harvest
    research project. Squid offers high-performance caching of objects, Gopher, and
    HTTP requests. It stores objects in RAM, maintains a robust database of objects
    in disk directories. Squid supports the SSL protocol for securing connections
    and has a complex access control mechanism. In addition, Squid can be hierarchically
    linked to other Squid-based proxy servers for streamlined caching of pages.


    In our configuration and we will configure Squid as an httpd-accelerator to get
    more performance. In accelerator mode, the Squid acts as a reverse proxy cache:
    it accepts client requests, serves them out of cache if possible, or requests
    them from the origin server for which it is the reverse proxy. You move the server
    away from port 80 (or whatever your port is), and substitute the accelerator,
    which then pulls the HTTP data from the "real" HTTP server the outside sees no
    difference (apart from an increase in speed, with luck).


