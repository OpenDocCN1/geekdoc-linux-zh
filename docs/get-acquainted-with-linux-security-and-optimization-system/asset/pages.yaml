    # Prevent Sendmail being abused by unauthorized users


    The very latest versions of Sendmail (8.9.3) include powerful Anti-Spam features,
    which can help prevent your mail server being abused by unauthorized users. To
    do that, edit your `/etc/sendmail.cf` file and make a change to the configuration
    file to block off spammers.


    Edit the `sendmail.cf` file (vi /etc/sendmail.cf) and change the line:


    ```

    O PrivacyOptions=authwarnings

    To:

    O PrivacyOptions=authwarnings,noexpn,novfry

    ```


    Setting "noexpn" causes sendmail to disable all SMTP "EXPN" commands, it also
    causes sendmail to reject all SMTP "VERB" commands. Setting "novrfy" prevents
    spammers from using the "EXPN" and "VRFY" commands. Unethical individuals too
    often abuse these commands.


    # The SMTP greeting message


    When sendmail accepts an SMTP connection it sends a greeting message to the other
    host. This message identifies the local machine and the first thing it sends to
    say is ready.


    Edit the `sendmail.cf` file (vi /etc/sendmail.cf) and change the line:


    ```

    O SmtpGreetingMessage=$ Mail $v/$S;$

    To:

    O SmtpGreetingMessage=$ Mail $v/$S; $ NO UCE C=xx Lxx

    ```


    +   - Now restart the sendmail process manually for the change to take effect:
    [root]#etc/rc.d/sendmail.restart


    The change modifies the banner, which Sendmail displays upon receiving a connection.
    You should replace the "xx" in the "C=xx Lxx" entries with your country and location
    codes. For example, in my case I would use "C=CA L-QC" for Canada, Quebec. The
    latter change doesn''t actually affect anything, but was recommended by folks
    in the "news.admin.net-abuse.email" newsgroup as a least precaution.


    # Restrict who may examine the queue''s contents


    Ordinarily, anyone may examine the mail queue''s contents by using the `mailq`
    command. To restrict who may examine the queue''s contents, specify "restrictmail"
    in the `/etc/sendmail.cf` file. With this option, sendmail only allows users who
    are in the same group ownership of the queue directory (root) to examine. This
    allows the queue directory to be fully protected by mode 0700 for selected users
    to be able to see its contents.


    Edit the `sendmail.cf` file (vi /etc/sendmail.cf) and change the line:


    ```

    O PrivacyOptions=authwarnings,noexpn,novfry

    To:

    O PrivacyOptions=authwarnings,noexpn,novfry,restrictmail

    ```


    +   - Now change the mode of our queue directory to be fully protected: [root]#
    chmod 0700 var/spool/mqueue


    NOTE: We are adding "noexpn" and "novfry" option to our line "PrivacyOptions="
    in sendmail.cf. Now continue by adding the "restrictmail" option to this line.


    Any privileged user who attempts to examine the mail queue content will get this
    message:


