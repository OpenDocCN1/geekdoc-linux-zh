    # Securing IMAP/POP


    Do you really need IMAP/POP service?

    The IMAP/POP program is a very common exploit method for attackers as some versions
    contain a serious and easily exploited buffer overflow that allows execution commands
    as root. Make sure you have updated your daemon version 4.5. Some POP servers
    also not report failed logins, so an attacker can brute force passwords and you
    will never know. If does this you should upgrade.


    Be aware that IMAP/POP programs use plaintext by default. Anyone running a sinner\program
    along your network path can get your username/password and use them to log in

    it is not because to use an IMAP/POP mail reader on your LINUX system you may
    need

    to run an IMAP/POP server local. Check your configuration and if you use a remote/external

    IMAP/POP server shut off or until the local daemon on your system.


    Also if you intended to use a web interface to read your mail via the Internet
    (WebMail) it is a good idea to use the SSL protocol to encrypt the communication
    with the IMAP/POP server. see the part V "Software-s Related Reference" in chapter
    10 "Server Software" under the section

    Linux Apache Web Server" for more information on the topic.


