  md: '# Create the database installation from your Postgres superuser account


    ```

    [root@deep#] su postgres

    [postgres@deep#] initdb --pgdata=/usr/lib/pgql -pgdata=/var/lib/pgql

    ```


    We are initializing the database system with username postgres (uid=40).

    This user will own all the files and must own the server process.


    Creating Postgres database system directory /var/lib/pgql/base


    Creating template database in /var/lib/pgql/base/template1


    Creating global classes in /var/lib/pgql/base


    Adding template1 database to pg_database...


    Vacuuming template1

    Creating public pg_user view

    Creating view pg_rules

    Creating view pg_views

    Creating view pg_tables

    Creating view pg_indexes

    Loading pg_description


    ```

    [postgres@deep#] chmod 640 /var/lib/pgql/pg_pwd

    [postgres@deep#] exit

    ```


    NOTE: Do not create the database installation as "root" this would be a major
    security hole.


    # Cleanup after work


    ```

    [root@deep#] cd /var/tmp

    [root@deep#] rm -rf postgresql-version_tar.gz

    ```


    Removes the egs-c++-1.1.24.j386.rpm package to make space.


    The "rm" command will remove the source files we have used to compile and install
    PostgreSQL. It will also remove the PostgreSQL compressed archive from the "var/tmp"
    directory.


    The "rm -e" command will remove the egs-c++ package we have installed to compile
    the PostgreSQL server. Note that egs-c++ package is required only for compiling
    program like PostgreSQL and can be uninstalled after successfully compilation
    of PostgreSQL safety.


    # Configurations


    All software we describe in book "Linuxos.pdf" will have a specific directory
    and subdirectory in a tar archive named "floppy.tgz" containing configuration
    files for the specific program. If you have this archive, you won''t be able to
    reproduce the desired configuration files manually or cut and past to create your
    configuration files. Whatever you decide to copy manually or get the files to
    your convenience from the archived files, adjust them for your needs and place
    the files related to PostgreSQL software to their appropriate places on your server
    machine, like show below. The server configuration archive is located at the following
    Internet address: http://pages.infini.net/lotus1/doc/opt/floppy.tgz'
