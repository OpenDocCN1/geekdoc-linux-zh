    \n# Zone transfers\n\nRestrict Zone Transfers:\nRestricting zone transfers prevents:\n\
    \n+   - Others from taxing the name server.\n- Hackers from listing the contents\
    \ of the zones.\n\nHere is an example of what \"allow-transfer\" option in the\
    \ named.conf file would contain:\n\n```\noptions {\n  allow-transfer ( 208.164.186.2;);\n\
    }\n```\n\nThis control allow name servers can transfer any zones from this name\
    \ server. Note on restricting zone transfers: Remember to restrict zone transfers\
    \ from slave name servers, not just the primary master.\n\n# Allow-query\n\nRestrict\
    \ the queries that your name servers accept to:\n\n+   - The address they should\
    \ come from.\n- The zones they should ask about.\n\nHere is an example of what\
    \ a \"allow-query\" option in the named.conf file would contain:\n\n```\noptions\
    \ {\n  allow-query ( 208.164.186/24; 127.0.0.8;);\n}\n```\n\nThis specifies which\
    \ IP addresses are allowed to send queries to the server. In particular, people\
