  md: "# Configuration of the \"etc/rc.d/init.named\" script file for all type of\
    \ name server\n\nThis configuration script file can be used for all type of name\
    \ server (caching, master or slave). Configure your \"etc/rc.d/init.named\" script\
    \ file to start and stop DNS/BIND daemons Server.\n\nCreate the named script file\
    \ (touch /etc/rc.d/init.named) and add:\n\n```\n#!/bin/sh\n#\n# named      This\
    \ script takes care of starting and stopping\n             named (BIND DNS server).\n\
    \n# chconfig: -55 45\n# description: named (BIND) is a Domain Name Server (DNS)\
    \ \\\n# that is used to resolve host names to IP addresses.\n# probe: true\n\n\
    # Source function library.\n# /etc/rc.d/init/functions\n\n# Source networking\
    \ configuration.\n# /etc/sysconfig/network\n\n# Check that networking is up.\n\
    [ $(NETWORKING) = \"no\" ] && exit 0\n\n[ -f /usr/sbin/named ] || exit 0\n[ -f\
    \ /etc/named.conf ] || exit 0\n\nRETVAL=0\n\n# See how we were called.\ncase \"\
    $1\" in\nstart)\n  # Start daemons.\n  echo -n \"Starting named: \"\n  daemon\
    \ named\n  RETVAL=$?\n  [ $RETVAL -eq 0 ] && touch /var/lock/subsys/named\n  echo\n\
    \  ;\nstop)\n  # Stop daemons.\n  echo -n \"Shutting down named: \"\n  killproc\
    \ named\n  RETVAL=$?\n  [ $RETVAL -eq 0 ] && rm -f /var/lock/subsys/named\n  echo\n\
    \  ;\nstatus)\n  /usr/sbin/ndc status\n  exit $?\n  ;\nrestart)\n  $0 stop\n \
    \ $0 start\n  ;\nreload)\n  /usr/sbin/ndc reload\n```"
