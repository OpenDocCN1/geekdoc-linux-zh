    # FCHECK


    FCHECK is a very stable Perl script written to generate and comparatively monitor
    UNIX system against its baseline for any file alterations and report them through
    syslog, console, or any logging interface. Monitoring events can be done in little
    as one minute intervals if a system''s drive size is small enough, making it very
    difficult to circumvent. This is a freely open-source alternative to "tripwire"
    that is time tested, and is easier to configure and use.


