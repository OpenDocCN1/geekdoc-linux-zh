  md: '# 9. The “noatime” attribute


    Linux has a mount option for filesystems call noatime. This option can be added
    to the mount options field in `/etc/fstab`. When a filesystem is mounted with
    this option, read accesses to the file will no longer result in an update to the
    atime associated with the file. The atime info is generally not that useful, the
    lacks of updates to this field are not often relevant.


    The importance of the noatime setting is that it eliminates the need to make writes
    to the filesystem for files, which are simply being read. Writers tend to be somewhat
    expensive, this can result in measurable performance gains. Note that the atime
    information will continue to be updated when the file is written to.


    Edit the fstab file `/etc/fstab` and add for example in the line:


    ```

    E.I.: `/dev/sda7` `/chroot` ext2 defaults,noatime 1 2


    [root@]# reboot

    [root@]# cat /proc/mounts

    ```


    Reboot your system and test your results with the command:


    # 10. TCP/IP Stack settings


    Red Linux, out of the box, does not optimize the TCP/IP window size. This can
    make a BIG difference with performance. For more information, check out: RFC 1106
    - High Latency WAN links - Section 4.1 and RFC 793 - Transmission Control Protocol.


    Edit `/etc/sysconfig/network-scripts/ifcfg` and around lines 110, 112, 117, 125,
    and 134, find the lines:


    ```

    110: `route add -net $(NETWORK) mask $(NETMASK) window 8192 $[DEVICE]`

    112: `route add -host $(IPADDR) window 8192 $[DEVICE]`

    117: `route add default $(GATEWAY) window 8192 metric 1 $[DEVICE]`

    125: `route add default $(GATEWAY) window 8192 $[DEVICE]`

    134: `route add default $gw window 8192 $[DEVICE]`

    ```


    And change them to


    ```

    110: `route add -net $(NETWORK) mask $(NETMASK) window 8192 $[DEVICE]`

    112: `route add -host $(IPADDR) window 8192 $[DEVICE]`

    117: `route add default $(GATEWAY) window 8192 metric 1 $[DEVICE]`

    125: `route add default $(GATEWAY) window 8192 $[DEVICE]`

    134: `route add default $gw window 8192 $[DEVICE]`

    ```


    # 11. The swap partition


    Try to put your partitions near the beginning of your drive. The beginning of
    the drive is physically located on the outer portion of the cylinder, so the read/write
    head can cover more ground per revolution. I typically see partitions at the end
    3MB/s slower using hdparm -t.


