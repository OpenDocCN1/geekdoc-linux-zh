    This option ''bind interfaces only'' if set to True, allows to limit what interfaces
    on a machine will serve smb requests. This is a security feature. The configuration
    "interfaces = eth0 192.168.1.1" complete this option.


    interfaces = eth0 192.168.1.1

    This option ''interfaces'' allows you to override the default network interfaces
    that Samba will use for browsing, name registration and NBT traffic. By default
    Samba will query the kernel for the list of all active interfaces and any interfaces
    except 127.0.0.1 which are broadcast capable. With this option, Samba will only
    listen on interface "eth0" on the IP address 192.168.1.1. This is a security feature
    and compute the above configuration (bind interfaces only = True).


    hosts deny = All

    Hosts listed ''hosts deny'' are NOT permitted access to services unless the services
    have their own lists. We deny access to hosts by default and allow access in the
    hosts (hosts allow =) option below.


    hosts allow = 192.168.1.4 127.0.0.1

    This option ''allow'' is a comma, space or delimited set of hosts which are permitted
    to access a service. We allow host 192.168.1.4 and our localhost 127.0.0.1 to
    access the samba server. Note that localhost must be set or you will receive some
    error messages.


    debug level = 1

    This option ''debug level'' allows the debug level (logging level) to be specified
    in "smb.conf" file. If you set the debug level higher than 2 you may suffer a
    large lag in performance. This is because the server floods the log file after
    each operation, which can be very expensive.


    create mask = 0640

    This option ''create mask'' sets the necessary permissions according to the mapping
    from DOS to UNIX permissions. With this option set to 0640, all files copying
    or creating from the Windows systems to the Unix system will have a permission
    of 0640 by default.


    directory mask = 0750

    This option ''directory mask'' sets the octal modes which are used when converting
    DOS to UNIX modes when creating directories. With this option set to 0750, all
    directories copying or creating from the Windows systems to the Unix system will
    have a permission of 0750 by default.


    level2 oplocks = True

    This option ''level2 oplocks'' increases the performance for many accesses of
    files that are not commonly used (such as application .EXE files).


    wide links = no

    This option ''wide links'' controls whether or not links in the UNIX file system
    may be followed by the server. Links point to areas within the directory tree
    exported by the server are always allowed; this parameter controls only areas
    that are outside the directory tree exported. It is recommended to disable it
    for better security.


    read raw = no

    This option ''read raw'' controls whether or not the server will support the read
    raw SMB requests when transferring data to clients. Note that memory mapping is
    not used by the "read raw" operation. You may find memory mapping is more effective
    if you disable the "read raw" using "read raw = no" like we do.


