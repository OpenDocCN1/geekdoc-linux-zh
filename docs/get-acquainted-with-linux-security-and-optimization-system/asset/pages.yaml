    system in the future.


    # What is Rescue Mode


    Rescue mode is a term used to describe a method of booting a small Linux environment
    completely from diskettes. By using rescue mode, it''s possible to access the
    files stored on your system''s hard drive, even if you can''t run Linux from that
    hard drive.


    # Making a rescue floppy disk


    Since it is possible to create only a rescue floppy on modular kernel, we must
    find another way to boot your Linux system using the Kernel on the hard disk is.
    After you successfully start Linux and log in as root, you should immediately
    create a Linux emergency floppy disk.


    +   - To create the emergency floppy disk and format it, follow these steps:


