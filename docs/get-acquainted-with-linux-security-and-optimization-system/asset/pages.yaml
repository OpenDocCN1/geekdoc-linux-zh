    # smbclient


    smbclient is a client that can talk to an SMB/CIFS server. It offers an interface
    similar to that of the FTP program. Operations include things like getting files
    from the server to the local machine, putting files from the local machine to
    the server, retrieving directory information from the server and so on.


    +   * To connect to a Windows machine, use the command:

    [root]@desktop$ smbclient //smbserver/sharename -U username

    [root]@desktop$ smbclient //gate/tmp -U webmaster

    Password:

    Domain=[OPEN Windows NT 4.0] Server=[NT LAN Manager 4.0]

    Smb: >


    -Where smbserver is the server you want to connect to. /sharename is the directory
    on this server you want to connect, and -U is your username on this machine.


