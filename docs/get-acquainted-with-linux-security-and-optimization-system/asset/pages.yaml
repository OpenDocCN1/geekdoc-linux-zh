    domain master = Yes


    This "domain master" identifies (nbmd) the Samba daemon as a domain master browser
    for its workgroup. This option, usually must be set to "Yes" only on one Samba
    server for its workgroup for all other samba server on the same network and workgroup.


    local master = Yes


    This "local master" allows (nbmd) the Samba daemon to become and a local master
    browser on a subnet. The above, usually this option must be set to "Yes" only
    on one Samba server that acts as a local master on a subnet for all other Samba
    server on your network.


    preferred master = Yes


    This "preferred master" controls whether (nbmd) the Samba daemon is a preferred
    master browser for its workgroup. Once again must be set to "Yes" for all the
    other on your network.


    os level = 65


    This "os level" determines whether (nbmd) the Samba daemon has a chance of becoming
    a local master browser for the WORKGROUP in the local broadcast area. The number
    65 will win if any NT server on your network and to set your Linux Samba server
    to be win NT server for becoming a local master browser for the workgroup in the
    local broadcast area then you must set the "os level" to 65. Also this option
    must be set on one Linux server and be disabled for all Linux samba server may
    have on your network.


    dns proxy = No


    This "dns proxy" if set to "Yes" specifies that (nbmd) the Samba daemon when acting
    as a WINS server and finding that a Net BIOS name has not been registered, should
