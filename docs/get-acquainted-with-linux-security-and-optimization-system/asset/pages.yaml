    # Linux Tripwire 2.2.1


    Tripwire''s initial version, release 1.0, was originally designed in 1992. Tripwire
    software has been completely rewritten as version 2.0. The rewrite is not open
    source. Policies are no longer in the configuration file, and the policy language
    has also changed. The base 64 notation is different. Tripwire 2.0 and later versions
    use four cryptographic signatures; the ASR offered signatures, a "no signature"
    option, and the ability to add a custom signature. Many of the ASR signatures
    are weak by current standards.


    According to the official Tripwire site, Tripwire works at the most fundamental
    layer, protecting the servers and workstations that make up the corporate network.
    Tripwire works by scanning a computer and creating a database of system files,
    a digital "snapshot" of the system in a known secure state. The user can configure
    Tripwire precisely, specifying individual files and directories on each machine
    to monitor, or creating a standard template that can be used on all machines in
    an enterprise.


    Once this database is created, a system administrator can use Tripwire to check
    the integrity of any system at time. By scanning the current system and comparing
    information with the data stored in the database, Tripwire detects and reports
    any additions, deletions, or changes to the system outside of the specified boundaries.
    If these changes are valid, the administrator can update the database with the
    new information. If malicious changes are found, the system administrator will
    instantly know which parts of components of the network have been affected.


    This version of Tripwire has significant found enhancements over previous versions
    of Tripwire. Some of the enhancements include:


    +   * Multiple levels of reporting allowing you to choose different levels of
    report detail.

    * Syslog option sends about database initialization, database update, policy update
    and integrity check to syslog.

    * Database performance has been optimized to increase the efficiency of integrity
    checks.

    * Individual email recipients can be sent sections of a report.

    * SMTP email reporting support.

    * Email test enables you to verify that the email files are correct.

    * Ability to create multiple sections within a policy file to be executed separately.


    These installation instructions assume

    Commands are Unix-compatible.

    The source path is "/var/tmp" (other paths are possible).

    Installations were tested on RedHat Linux 6.1.

    All steps in the installation will happen in superuser account "root".

    Tripwire version number is 2.2.1


    © Copyright 1999 Open Network Architecture ® 171'
