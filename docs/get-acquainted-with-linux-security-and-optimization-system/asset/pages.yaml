    # Configuration of the "etc/rc.d/init.d/squid" script as a http-accelerator

    Your script has been modified to setup squid swap cache for "cache" instead of
    "var/spool/squid."


    Create the squid script file (touch /etc/rc.d/init.d/squid) and add:


    ```

    #!/bin/bash

    # squid

    # This script takes care of starting and stopping

    # Squid Internet Object Cache


    # chkconfig:- 90 25

    # description: Squid Internet Object Cache. Internet caching is:\n# a way to store
    requested Internet objects (i., data available\

    # via HTTP, FTP, and gopher protocols) on a system closer to the\

    # requesting site than to. Brows can then use the\

    # local squid cache as a proxy HTTP server, reducing access time as\

    # well as bandwidth consumption.

    # pidfile=/var/run/squid.pid

    # config:etc/squid/squid.conf

    ```


    ```

    PATH=/usr/bin:/sbin/bin:/usr/sbin

    export PATH


    # Source function library.

    ./etc/rc.d/init.d/functions


    # Source networking configuration.

    # /etc/sysconfig/network

    ```


    ```

    # Check that networking is up.

    [$NETWORKING] = "no" && exit 0

    ```


    ```

    # Check if the squid conf file is present

    [ -f /etc/squid/squid.conf ] && exit 0

    ```


    ```

    # determine the one of the squid binary

    [ -x /usr/sbin/squid ] && SQUID=squid

    [ -z "$SQUID" ] && exit 0


    # determine which one is the cache_swap directory

    CACHE_SWAP=$(sed -e ''s/.*:\/etc/squid/squid.conf//'' \

    grep cache_swap_dir | sed -e ''s/.*cache_dir///'' | \

    cut -d''\'''' -f2

    [ -z "$CACHE_SWAP" ] && CACHE_SWAP=/

    ```


