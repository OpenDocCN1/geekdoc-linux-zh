    ```

    libc.so.6 => /lib/libc.so.6 (0x40017000)

    /ld-linux.so.2 => /lib/ld-linux.so.2 (0x40000000)

    ```


    Make a note of the files listed above; you will need these later.


    Step 1:

    Add a new user id and a new group id for running named. Running root defeats the
    purpose of the jail, and using a different user id that already exists on the
    system can allow your users to access others'' resources. Think multi-layer security.


    These are sample user and group numbers. Check "etc/passwd" and "etc/group" files
    for a free uid/gid number. We will use 53.


    ```

    [root@deep]# groupadd -g 53 named

    [root@deep]# useradd -g 53 named

    ```


    Step 2:

    Set up the chroot environment. First, create the root directory of the jail. We''ve
    chosen /chroot/named because we wanted to put this on its own filesystem to prevent
    filesystem errors. In our installation procedure we create a special partition
    "chroot" for this purpose.


    ```

    [root@deep]# /etc/rc.d/init.named_stop (only if named daemon is running)

    [root@deep]# mkdir -p /chroot/named

    ```


    Next, create the copy directories like the following:


    ```

    [root@deep]# mkdir /chroot/named/dev

    [root@deep]# mkdir /chroot/named/lib

    [root@deep]# mkdir /chroot/named/etc

    [root@deep]# mkdir -p /chroot/named/var/named/var/named/dev/null c 13

    [root@deep]# cp /usr/sbin/named/var/run

    ```


    Copy the main configuration file, the zone files, and the named and named-xfer
    programs:


    ```

    [root@deep]# cp /etc/named.conf /chroot/named/etc/

    [root@deep]# cp /var/named /chroot/named/var/named/

    [root@deep]# mkdir /chroot/named/var/named/var/named/dev/null

    [root@deep]# chmod 666 /chroot/named/dev/null

    [root@deep]# cp /usr/sbin/named /chroot/named/usr/sbin/

    [root@deep]# cp /usr/sbin/named-xfer /chroot/named/usr//

    ```


    IMPORTANT NOTE: The owner of /chroot/named/var/named and all file in this directory
    must be the process "named" under the slave server and only the slave server or
    you wouldn''t be able to make a zone transfer.


    +   - To make "named" directory and all its files owned by "named" process under
    the slave server, use the command:

    [root@deep]# chown -R named.named /chroot/named/var/named/

    - Set the immutable bit on "named.conf":

    [root@deep]# cd /chroot/named/etc/

    [root@deep]# chatter +i named.conf


    Copy the shared libraries identified above to the chrooted directory:


