    \ (SET)\n\nThis Graph illustrates where those security solutions fit within the\
    \ TCP/IP layers:\n\n| Applications | - S-MIME\n - Kerberos\n - Proxies\n - SET\n\
    \ - IPSec (ISAKMP) |\n| TCP/UDP (Transport) | - SOCKS\n - SSL, TLS |\n| IP (Internetwork)\
