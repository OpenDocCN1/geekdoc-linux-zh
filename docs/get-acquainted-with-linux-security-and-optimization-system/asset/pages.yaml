    # # Linux Kernel


    The first thing to do next is build a kernel that best suits your system. It is
    very simple to do but, in any case, refer to the README file in `/usr/src/linux/`.
    When configuring your kernel only compile in code you need and use. Four main
    reason come into mind; the kernel will be faster (Less code to run), you will
    have more memory (Kernel parts are NEVER swapped to the virtual memory), more
    stable (Ever proved for a non-expert card?), unnecessary parts can be used by
    an attacker gain the machine or other machines. Modules are also slower than support
    directly in the kernel.


    In our configuration we will build a monolithic kernel. Monolithic kernel mean
    to, only answer **Yes** or **No** to the questions (when making any module) and
    omit the opts: `make` and `modules_install`. We will also patch our kernel with
    the buffer overflow protection from kernel patches. Patches for the Linux kernel
    exist, like Solar Designer''s non-executable stack patch, which disable execution
    on the stack, making a number of buffer attacks harder - defeating a complete
    of current exploits used by ''script kiddies'' worldwide.


    Remember that the steps above to only answer **Yes** or **No** to the questions
    when configuring your new kernel are requiring only if you intended to build a
    monolithic kernel. If you intended to use firewall masquerading function or dpp
    pup connection, you cannot build a monolithic kernel, since this function must
    be built by default of some modules. Instead need a modularized kernel.


    A new kernel is very specific to your computer hardware, in the kernel configuration
    part, I assume the following hardware for my example. Of course you must change
    them to fit your system component.


    +   - 1 Pentium II 400 MHz (i686) processor

    - 1 Motherboard SCSI

    - 1 Hard Disk SCSI

    - 1 SCSI Controller Adaptec AIC 7xxx

    - 1 CD-ROM ATAPI IDE

    - 1 Floppy Disk

    - 2 Ethernet Cards Intel EtherXpress Pro 10/100

    - 1 Mouse FS/2


