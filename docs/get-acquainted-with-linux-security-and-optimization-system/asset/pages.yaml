  md: '# Further documentation


    For more details, there are several pages you can read:


    +   - $ ldap (8) - LDAP X-500 Protocol Daemon

    - $ ldapdelete (1) - ldap delete entry tool

    - $ ldapfilter.conf (5) - configuration file for LDAP filter routines

    - $ ldapfriendly (5) - data file for LDAP friendly routines

    - $ ldapmodify, ldadd (1) - ldap modify entry and add entry tools

    - $ ldapmodn1 (1) - ldap modify entryDN tool

    - $ ldappasswd (1) - change the password of an LDAP entry

    - $ ldapsearch (1) - ldap search tool

    - $ ldapsearch.conf (5) - configuration file for LDAP search preferences

    - $ ldaptemplates.conf (5) - configuration file for LDAP display template routines

    - LDAP Data Interchange Format

    - $ slapadd (8) - Stand-alone LDAP Daemon

    - $ slapadd.conf (5) - configuration file for slap, the stand-alone LDAP daemon

    - $ slurped (8) - Standalone LDAP Update Replication Daemon

    - $ slapcat (1) - interactive LDAP Directory Server query program


    # OpenLDAP Creation and Maintenance Tools


    Creating a database off-line

    This method is best if you have thousands of entries to create, which would take
    an unacceptably long time using the ldadd method. This tool will read the slap
    configuration file and an input file containing a text representation of the entries
    to add.


    An input file containing a text representation of entries named "my-data-file"
    is always better for our example.


    +   - To create a database off-line, use the command:

    `[root@]# if2ldm -i infiltrate -f slapconfigfile`

    `[root@]# if2ldm -i my-data-file -f /etc/ldap/slapd.conf`


    Where `<infiltrate>` specifies the LDIF input file containing the entries to add
    in text form.

    `<slapconfigfile>` specifies the slap configuration file that tells where to create
    the indexes, what create, etc.


    > NOTE: Our slap is not started in this mode of creation.


    # The LDIF input file (input file containing a text representation of entries)


    When you install OpenLDAP for the first time and have a big archive to put in
    your Openldap software, it is always a god idea to put all your database in a
    file containing a text representation of entries and add this file in OpenLDAP
    with the command shown.


    Create the my-data-file (touch /tmp/my-data-file) and add as an example in this
    file the following lines:


    ```

    dn: o=openldap, c=com

    oo=openldap

    objectclass: organization


    dn: cn=Ronald Smith, o=openldap, c=com

    cn: Ronald Smith

    s: Smith

    telephonenumber: (480) 757-5856

    title: Operator.

    objectclass: top

    ```'
