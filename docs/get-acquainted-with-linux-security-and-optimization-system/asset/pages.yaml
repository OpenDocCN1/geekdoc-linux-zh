    # # Linux PostgreSQL Database Server


    Postgres, developed originally in the UC Berkeley Computer Science Department,
    pioneered many of the object-relational concepts becoming available in commercial
    databases. It provides PostgreSQL/SQL3 language support, transaction integrity,
    and type extensibility. PostgreSQL is a public domain, open source descendant
    of this original Berkeley.


    # These installation instructions assume


    Commands are Unix-compatible.

    The source path is `/var/tmp` (other paths are possible).

    Installations were tested on RedHat Linux 6.1.

    All steps in the installation will happen in superuser account ''root''.

    PostgreSQL version number is 6_5_3

    ec++-1.1.2.24.i386.rpm package must be installed on your system.


    # Packages


    PostgreSQL Homepage: `http://www.postgresql.org/`

    You must be to download: `postgresql-6_5_3.tar.gz`


    # Tarballs


    It is a good idea to make a list of files on the system you install before, and
    one afterwards, and then compare them using `diff` to find out what file it placed
    where. Simply run `find / > sql1` before and `find / > sql2` after you install
    the tarball, and `diff sql1 sql2` to get a list of what changed.'
