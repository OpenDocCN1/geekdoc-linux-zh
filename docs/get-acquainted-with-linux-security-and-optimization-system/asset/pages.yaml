  md: 'Comments and suggestions concerning this page should be mailed to gmourani@videotron.ca


    etc/passwd usr/sbin/chpassword and "etc/passwd" usr/sbin/chpassword files from
    the archive.


    If you are trying to restore only one or a few files from your archive, you will
    not be successful unless you specify the file name or directory path as stored
    in the archive. The following example might help:


    ```

    [root]@deep#$ cd

    [root]@deep#$ tar -ztvpf archive/full-backup-09-October-1999.tar.gz \

    grep -i chpassword

    ```


    In this example all files contained in the archive are listed by file name. The
    output is then piped to the "grep" command using grep''s "i" option to ignore
    mixed case, displaying any files containing the word "chpassword" in either directory
    path or file name. Once you determine the exact file name you wish to restore,
    you can then specify it in a regular tar expression like above.


    NOTE: When creating an archive file, tar will strip "/" (slash) from file names.
    These names may not end in the same locations where they were backed up from.
    Therefore, to solve the problem the solution is to change the "/" root directory
    before make all backup or restore. Another solution is to restore the desired
    files under a different directory, and then compare, move, or update the files
    to their original locations afterwards.


    Caution: If you have a files on your system with the immutable bit, the "chattr"
    command, these files will not be remembered with the immutable bit from your restore
    backup. You must restore it immutable with the command "chattr" after the backup
    is completed.


    # Further documentation


    For details, there is man you can read:


    +   tar (1) - The GNU version of the archiving utility


    # Alternatives to tar backup


    AMANDA

    AMANDA (Advanced Maryland Automatic Network Disk Archiver) is a backup system
    that allows the administrator of a LAN to set up a master backup server to back
    up multiple hosts to a single large capacity drive. AMANDA uses native dump and/or
    tar capabilities to back up a large number of workstations multiple versions of
    Unix. Recent versions can also use SAMBA to back up Microsoft Windows 95/NT hosts.


    Packages

    AMANDA Homepage: http://www.cs.umd.edu/projects/amanda/


    BRU

    ™ is the Unix Backup and Restore Utility designed for maximum reliability and
    flexibility. BRU makes Unix backups easy, fast and safe. BRU is much more than
    just a replacement for tar and cpio, it''s a backup system with a multitude of
    options.


    Packages

    BRU Homepage: http://www.bru.com/


    341'
