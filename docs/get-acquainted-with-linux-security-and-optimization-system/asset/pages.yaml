- img_proc: true
  md: 'Comments and suggestions concerning this page should be mailed to gnoumouri@videotron.ca


    In our configuration and installation we''ll provide you two different configurations
    that you can use setup for sendmail, one for a Central Mail Hub Relay, and another
    one for the local or neighbor client and server machines.


    The Central Mail Hub Relay configuration will be used for your server where the
    assigned task is to send, receive and relay mail for all local or neighbor client
    and server mail machines you may have on your network. A local or neighbor client
    and server members refer to all other local server or client machines on your
    network that run sendmail and send all outgoing mail to the Central Mail Hub for
    future delivery. This kind of internal mail never receive mail directly via the
    Internet, instead all receiving from the Internet for those computers keeps on
    the Mail Hub. It is a good idea to run Central Mail Hub Server for all computers
    on your network architecture the task management on internal server, client machines
    and improve the security of your site.


    You can configure the neighbor sendmail so it accepts only mail that is generated
    locally, insulating machines for easier security. The Gateway server (outside
    the firewall or part of it) acts as a proxy and accepts mail (via its Firewall)
    that is destined for internal delivery from the outside and forwards it to the
    Central Mail Hub Server. Also note that the Gateway server is configured like
    a neighbor sendmail to never accept incoming mail from the outside (Internet).


    | Our Web Server

    www.openarch.com | Our Gateway Server

    deepopenarch.com | Our Mail Server

    mail.openarch.com |

    |---|---|---|n| ONE INTERNAL

    MAIL SERVER | ANOTHER INTERNAL

    MAIL SERVER | OUR CENTRAL

    MAIL SERVER |

    | Accept only mail

    that is generated

