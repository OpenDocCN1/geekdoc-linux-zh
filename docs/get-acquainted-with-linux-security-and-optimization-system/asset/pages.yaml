    # -march=cpu_type


    Generate instructions for the machine type cpu. The choices for cpu are the same
    as for -mcpu=mcpu. Moreover, picking -march=cpu_type implies -mcpu=cpu_type.


    # -force-memory


    Force memory operands to be copied into registers before arithmetic on them. This
    produces better code by making all memory references potential common subexpressions.
    When they are not common subexpressions, instruction combination should eliminate
    the separate register-loader.


    # -force-addr


    Force memory address constants to be copied into registers before arithmetic on
    them. This may produce better code using -force-force-mem.


    # -fomit-frame-pointer


    Don''t keep the frame pointer in a register for functions that don''t need it.
    This avoids the instructions to save, set and restore frame pointers; it also
    makes an extra register available in many functions. It also makes debugging impossible
    on most machines.


    NOTE: All future optimization that will describe in this book refer by default
    for a Pentium II/III CPU family. So, you must adjust the compilation flag to target
    your specific CPU processor.


