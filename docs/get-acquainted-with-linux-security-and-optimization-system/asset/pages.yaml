  md: 'Comments and suggestions concerning this page should be mailed to gmouriani@videotron.ca


    The GDFS optimizes hit rate by keeping smaller popular objects in cache so it
    has a better chance of getting a hit. It achieves a lower bite rate than LFUDA
    since it evicts larger (possibly) objects.


    The LFUDA keeps popular objects in cache regardless of their size and thus optimizes
    hit rate by the expense of hit rate one large, popular object will prevent many
    smaller, slightly less popular objects from being cached.


