    # Configure sshd to tcp-wrappers inetd server


    Tcp-wrappers take to start and stop sshd server. Upon execution, inetd reads its
    configuration information from a configuration file which, by default, is "etc/inetd.conf".
    There must be an entry for each field of the configuration file, with entries
    for each field separated by a tab or space.


    Step 1

    Edit the inetd.conf file (/etc/inetd.conf) and add the line:


    ```

    ssh      stream now rout /usr/sbin/tcp sshd -i

    ```


    NOTE: The -i parameter is important since it specifies sshd is being run from
    inetd. Also, update your "inetd.conf" file by sending SIGHUP signal (killall -HUP
    inetd) after adding the line.

    [root@deep./root] # killall -HUP inetd


    Step 2

    Edit the hosts.allow file (/etc/hosts.allow) and add the line:


    ```

    sshd: 192.168.1.4 win.openarch.com

    ```


    Which mean client IP "192.168.1.4" with host name "win.openarch.com" is allowed
    to ssh on the server.


    These "daemon" strings (for tcp-wrappers) are used by sshd:

    sshdwd-X11 (if you want to allow/deny X11 forwarding).

    sshdwd-<port-number> (for tcp-forwarding).

    sshdwd-<port-name> (port-name defined in /etc/services. Used are in tcp-forwarding).


    NOTE: If you decide to switch to using ssh, make sure you install and use it on
    all your servers. Having ten secure servers and one insecure is a waste of time.


