    # 34. Bits from root-owned programs


    All programs and files in your computer with the ''s'' bits appearing on it, have
    the SUID (r---xr-x) or SGID (r---xr-s) bit enabled. Because these programs grant
    special privileges to the user who is executing them, it is important to remember
    the ''s'' bits from root-owned programs that won''t require such privilege. This
    can be accomplished by executing the command ''chmod a-s'' with the name(s) of
    the offending files as it''s arguments.


    Such programs include, but not limited to:


    +   1.programs you never use.

    2.programs that don''t want any non-root users to run.

    3.programs you use occasionally, and don''t mind having to su (1) to root to.


    We''ve placed an asterisk (*) next to each program you could personally disable.
    Remember that your system needs to use root-owned programs to work properly, so
    be careful.


    +   To find files with the ''s'' bits from root-owned programs, use the command:

    `[root@]$ find -type f \( -perm -0400 -o -perm -0200 \) -exec ls -lg {}`


