    # Compile and optimize


    The Build script of Sendmail allows you to specify a site configuration by using
    the -f flag like (Build _f ./BuildTools/siteconfig.m4). A site configuration file
    contains definitions for system installation. We''ll build this site configuration
    to suit our system installation and put it in the default "BuildTools/SiteSource
    of Sendmail distribution since the Build script will look for the site configuration
    files in the directory.


    Cd into the Sendmail directory then create the siteconfig.m4 file (touch BuildTools/siteconfig.m4)
    and adds the following lines inside this file:


    ```

    define(MAPDEF,"DNEWDB") (Require for Mail Hub configuration)

    define(CONVENDEF,"DICKPY_QF_NAME_CHECK-DXDEBUG=0")

    define(CONFC,''ecgs")

    define(OPTIMIZE,"-O9 -foll-opts -fast-path -maglin-multigen -mcpu=pent ummarch-pertium
    -fomit-frame-pointer -no-exceptions")

    define(LLBS,-d")

    define(CONFLOPTS,''root'')

    define(MANOWN,''root'')

    define(MANLOQUE,''84'')

    define(MAN1SRC,''1'')

    define(MAN5SRC,''5'')

    define(MAN8SRC,''8")

    ```


    This siteconfig.m4 file to set itself up for this particular setup with:


    ```

    define(MAPDEF,"DNEWDB")nThis macro option specifies database types to be included
    for the aliases and for general maps of Sendmail. We''ll use the Berkeley db(both)
    hash and btree database. The "define(MAPDEF,"DNEWDB") is only for the Central
    Mail Hub configuration and it is not for local server, client sendmail machines,
    in our internal client sendmail machines will use "aliases" and the other maps
    that need this function "DNEWDB".

    ```


    ```

    define(CONVENDEF,"DICKPY_QF_NAME_CHECK-DXDEBUG=0")n macro option uses primary
    code that should either be included or excluded. With "DICKPY_QF_NAME_CHECK",
    sendmail will log an error if the "q" file is not formed and will rename the "q"
    file into a "Q" file. The "-DXDEBUG=0" argument allows the step of additional
    internal checking during compile time.

    ```


    ```

    define(CONCC,''ecgs")n macro option defines the C compiler for compilation of
    Sendmail. In our case we use the "ecgs" C compiler for better optimization.

    ```'
