    # Files related to networking functionality


    In Linux, the TCP/IP network is configured through several files you may have
    to edit to make networking working. It''s very important to know the configurations
    related to TCP/IP networking, so that you can edit and configure the files if
    necessary. Remember that our server doesn''t have a Window interface to configure
    files via graphical interface. The following sections describe the basic TCP/IP
    configuration files.


    # The "etc/HOSTNAME" file


    This file stores your system''s host name—your system''s fully qualified domain
    name (FQDN), such as deep.openarch.com


    Following is a sample "etc/HOSTNAME" file:


    deep.openarch.com


    # The "etc/sysconfig/network-scripts/ifcfg-ethN" files


    Files for each network device you may have to 따로 or add to your system are located
    in the "etc/sysconfig/network-scripts/ directory with Red Hat Linux 6 and named
    ifcfg-eth0 for the first interface and ifcfg-eth1 for the second sec.


    Following is a sample "etc/sysconfig/network-scripts/ifcfg-eth0":


    ```

    DEVICE=eth0

    ADDR=208.164.186.1

    MASK=255.255.255.255

    NETWORK=208.164.186.0

    BROADCAST=208.164.186.255

    ONBOOT=eth0

    BOOTPROTO=none

    USERCTL=eth0

    ```


    If you want to modify your network address manually or create new network on new
    interface, this file (ifcfg-ethN) where name is the name of the physical device.


    ```

    DEVICE=name, where name is the name of the physical device.

    ```'
