  md: 'Comments and suggestions concerning this page should be mailed to gmourani@videotronca.ca


    # ### PRIVPORTS

    The privileged ports, 0 through 1023, are usually referenced in total.


    # ### UNPRIVPORTS

    The unprivileged ports, 1024 through 65535, are usually referenced in total. They
    are addresses dynamically assigned to the client side of a connection.


    # ### Default Policy

    A firewall has a default policy and a collection of actions to take in response
    to specific message types. This means that if a packet has not been selected by
    any other rule, the default policy rule will be applied.


    NOTE: There are two basic approaches to an IPFW firewall, deny everything by default
    and explicitly select accesses, accept by default and explicitly deny accesses.
    The deny everything is the recommended approach, because it''s easier to set up
    more secure firewall.


    # ### Enabling Local Traffic

    Since the policies are to deny, some of this must be undone. Local network services
    do not go through the external network interface. They go through a special, private
    interface called the loopback interface. None of your local network programs will
    work until loopback is allowed.


    ```

    # Unlimited traffic on the loopback interface

    ipchains -A input -i $LOOPBACK_INTERFACE -j ACCEPT

    ipchains -A output -i $LOOPBACK_INTERFACE -j ACCEPT

    ```


    # ### Source Address Filtering

    The only method of identification using the Internet Protocol (IP) is the source
    address in the IP packet header. This opens the door to source address spoofing;
    where the sender replaces its address with a nonexistent address, or the address
    of some other site. This can allow unwise threats to enter your system or appear
    as you while attacking other sites.


    ```

    # Refuse spoofed packets pretending to be from the external address.

    ipchains -A input -i $EXTERNAL_INTERFACE -s $IPADDR -j DENY

    ```


    Also, there are at least seven of source addresses that you should refuse on your
    external interface in all cases.


    +   * These are incoming packets claiming to be from:

    * Your external IP address

    * Class A IP addresses

    * Class B private IP addresses

    * Class C private IP addresses

    * Class D multicast addresses

    * Class E reserved addresses

    * The loopback interface


    With the exception of your own address, blocking outgoing packets containing these
