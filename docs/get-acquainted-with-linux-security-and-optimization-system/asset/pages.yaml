    # Linux Tripwire ASR 1.3.1


    # Overview


    With the advent of increasingly sophisticated and subtle attacks the need for
    tools to aid in the detection of unauthorized modification of files becomes clear.
    Tripwire is a tool that helps system administrators and users in monitoring a
    designated set of files for any changes. Used with system files on a regular (e.g.,
    daily) basis, Tripwire can notify administrators of corrupted or tampered files,
    so control measures can be taken in a timely manner.


