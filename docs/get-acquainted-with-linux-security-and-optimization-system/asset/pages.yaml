  md: "Comments and suggestions concerning this page should be mailed to gmourani@videotron.ca\n\
    \n+   - To run PostgreSQL database, the following file is required and must be\
    \ create or copied to the appropriate directory on your server.\n\nCopy the postgresql\
    \ script file in the `/etc/rc.d/init.d/` directory.\n\nYou can obtain configuration\
    \ files listed below on your floppy.tgz archive. Copy the following files from\
    \ the decompressed floppy.tgz archive to the appropriate places or copy them directly\
    \ from this to the configured file.\n\n# Configuration of the `/etc/rc.d/init.d/postgresql`\
    \ script file\n\nConfigure your `/etc/rc.d/init.d/postgresql` script file to start\
    \ and stop PostgreSQL Server.\n\nCreate the postgresql script (touch `/etc/rc.d/init.d/postgresql`\
    \ ) and add:\n\n```\n#!/bin/sh\n# postgresql This is the init script for starting\
    \ the PostgreSQL\n# server\n\n# chconfig:345 85 15\n# description:Starts and stops\
    \ the PostgreSQL backend daemon handles \\\n# all database requests.\n# processname:postmaster\n\
    # pidfile:/var/run/postmaster.pid\n#\n\n# Source function library.\n# /etc/rc.d/init.d/functions\n\
    \n# Get config.\n# /etc/sysconfig/network\n\n# Check that networking is up.\n\
    # Pretty much need it for postmaster.\n[ [$NETWORKING] = \"no\" && exit 0\n\n\
    [- /usr/bin/postmaster ] || exit 0\n\n# This script usually in that the name of\
    \ the daemon (postmaster)\n# is not the same as the name of the subsystem (postgresql)\n\
    \n# See how we were called.\ncase \"$1\" in\nstart)\necho -n \"Checking postgresql\
    \ installation:\"\n# Check for the PGDATA structure\nif [ -f /var/lib/postgresql/PG_VERSION\
    \ ] && [ -d /var/lib/postgresql/base/template1 ];\nthen\n# Check version of existing\
    \ PGDATA\nif [ \"$(cat /var/lib/postgresql/PG_VERSION)\" != '6.5' ];\nthen\nntecho\
    \ \"old version. Need to Upgrade.\"\nntecho \"/usr/doc/postgresql-6.5.2/README.rpm\
    \ for more information.\"\n\texit 1\nelse\nntecho \"looks good!\"\nfi\n\n# No\
    \ existing PGDATA! Initdb by it.\n```"
