    the squid and "chmod" command will make the mode of "squid" and "cache" directories
    to be (0750drwx-x) for security reason.


    Take a note that we remove the small scripts "RunCache" and "RunAccess" which
    take care to start Squid in caching mode or accelerator mode we use a better script
    named "squid" located at "/etc/rc.d/squid to take advantage of Linux system V.
    The "strip" command would reduce the size of binaries for optimal performance.


    # What is a Cache Digest?


    A Cache Digest is a summary of the contents of an Internet Object Caching Server.
    It contains in a compact (i.e. compressed) format, indication of whether or not
    particular URLs are in the cache. A "lossy" technique is used for compression,
    which means that very high compression factors can be achieved at the expense
    of not having 100% correct information.


