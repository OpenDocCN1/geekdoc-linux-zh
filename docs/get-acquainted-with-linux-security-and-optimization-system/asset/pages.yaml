  md: '# Some Points to Consider


    If you connect your system to the Internet then you can safely assume that you
    are potentially at risk. Your gateway to the Internet is your greatest exposure,
    we recommend the following:


    +   - The gateway should not run any applications other than absolutely necessary.

    - The gateway should strictly limit the type and number of protocols allowed to
    flow through it (protocols potentially provide security holes, such as FTP and
    telnet).

    - Any system containing confidential or sensitive information should not be directly
    accessible from the Internet.


    # Some explanation of rules used in the firewall script files


    The following is an explanation of a few of the rules that will be used in the
    Firewalling examples below. This is just as a reference, the firewall scripts
    are well commented and very easy to modify.


    # Constants used in the firewall scripts files


    Constants are used for most values. The most basic constants are:


    EXTERNAL_INTERFACE

    This is the name of the external network interface to the Internet. It''s defined
    as eth0 in the examples.


    LOCAL_INTERFACE_1

    This is the name of the internal network interface to the LAN, if any. It''s defined
    as eth1 in the examples.


    LOOPBACK

    This is the name of the loopback interface. It''s defined as lo in the examples.


    IPADDR

    This is the IP address of your interface. It''s either a static IP address registered
    with InterNic, or a dynamically assigned address from your ISP (usually via DHCP).


    LOCALNET_1

    This is your LAN network address, if any - the range of IP addresses used by the
    machines on your LAN. These may be statically assigned, or you might use a local
    DHCP server to assign them. in which the range is 192.168.1.0/24, the post of
    Class C private address.


    ANYWHERE

    Anywhere is a label for an address used by ipchains to match any (non-broadcast).
    Both programs provide any/0 as a label for this address, which is 0.0.0.0/0.


    NAMESERVER_1

    This is the IP address of your Primary DNS Server from your network or your ISP.


    NAMESERVER_2

    This is the IP address of your Secondary DNS Server from your network or your
    ISP.


    LOOPBACK

    The loopback address range is 127.0.0.0/8. The interface itself is addressed as
    127.0.0.1 (in /etc/hosts).


