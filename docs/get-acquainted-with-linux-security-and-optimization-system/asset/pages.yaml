    Since the default configuration of the syslog daemon is to not receive any messages
    from the network, we must enable on the remote server the facility to receive
    message from the network. To enable the facility to receive message from the network
    on the remote server, add the following option `-r` to your syslog daemon script
    (only on the remote host):


    +   - Edit the syslog daemon (vi +24 /etc/rc.d/init.d/syslog) and change:


    daemon syslog -m 0

    To read:

    daemon syslog -r m 0


    +   - Now restart your syslog daemon on the remote host for the change to take
    effect:

