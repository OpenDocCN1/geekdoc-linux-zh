    # ## 28. Shell logging


    It is easy to repeat logging, the bash stores up to 500 old commands in the `~/.bash_history`
    (where `~` is your home directory). Each users that has a account on the system
    will have file `.bash_history` in their home directory. Reducing the number of
    old commands the `.bash_history` files can hold protect users on the server to
    mistake their password on the screen in plain text and have their password stored
    for a long time in the `~/.bash_history` file.


    The HISTFILESIZE and HISTSIZE in the `/etc/profile` file determine the size of
    old commands the `.bash_history` file for all users on your system can hold. For
    all accounts I would highly recommend setting the HISTFILESIZE and HISTSIZE in
    `/etc/profile` file to a low value such 20.


    Edit the profile (`/etc/profile`) and change the lines to:


    ```

    HISTFILESIZE=20

    HISTSIZE=20

    ```


    Which mean, the `~/.bash_history` file in each user home directory can store 20
    old commands and not more. Now, if a cracker tries to see the `~/.bash_history`
    file of users on your server to find some password passed by mistake in plain
    text, he has less change to find one.


    # ## 29. `/etc/lilo.conf` file


    LILO is a versatile boot loader for Linux. It does not depend on a specific file
    system, it can boot Linux kernels from floppy disks and hard disks and can act
    as a "boot manager" for other operating systems.


    LILO primarily includes the following parts of the system: The root file system
    is important for two reasons: first, LILO needs to tell the kernel where to look
    for. Second, it is frequently a convenient place for many other items LILO uses,
    such as the boot sector, the "boot" directory, and the kernels. The boot sector
    contains the first part of LILO''s boot loader. It handles the larger second-stage
    loader. Both loaders are typically installed in the file `/boot`. The kernel is
    loaded by the boot loader. Kernels typically reside in the root directory or in
    `/boot` for Red Hat Linux.


    We have seen that LILO is very important in the Linux system and for this reason,
    we must protect it by the best. The most important configuration file of LILO
    is the `lilo.conf` file and reside under `/etc` directory. With this file that
    we can configure and improve the security of our LILO program and Linux system.
    Following are three important options that will improve the security of valuable
    LILO program.


    +   - Add: timeout=00

    Controls how long (in tenths of seconds) LILO waits for user input before booting
    the default selection. One of the crackers of C2 security is that this interval
