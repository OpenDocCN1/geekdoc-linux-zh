    # ## upload command


    By default, the WU-FTPD server will grant upload privileges to all guest users.
    The example users are chrooted to /home/ftp and cannot access any area of the
    filesystem outside the directory structure. What we''re interested in, then, is
    simply protecting the filesize in the root directory we want to keep the users
    out.


    In our installation, there will be "bin", "etc", "dev", and "lib" subdirectories
    in the /home/ftp directory. We don''t want users being able to upload these areas.
    In case something happens to the permissions on them, you should deny upload privileges
    in your /etc/ftpaccess file. In our case, we say the following:


    ```

    upload/home/ftp/* / no

    upload/home/ftp/* /etc no

    upload/home/ftp/* /dev no

    upload/home/ftp/* /bin no (require only if you are not using the "enable-ls" option)

    upload/home/ftp/* /lib no (require only if you are not using the "enable-ls" option)

    ```


    # ## The retrievee command


    It is also a good idea to prevent downloads of those subdirectories in the /home/ftp
    directory with the command "retrieve" in your /etc/ftpaccess file.


    ```

    retrieve/home/ftp/etc

    retrieve/home/ftp/dev

    retrieve/home/ftp/bin (require only if you are not using the "enable-ls" option)

    retrieve/home/ftp/lib (require only if you are not using the "enable-ls" option)

    ```


    # ## The special file .notar


    Whether you allow-the-fly tar of directories or not, you should make sure an end-run
    cannot be made using it tar in any area where the upload is not permit. To do
    so, create a special file .notar in each directory and in the FTP directory.


    ```

    [root@deep]# # touch /home/ftp/.notar

    [root@deep]# chmod 0 /home/ftp/.notar

    [root@deep]# # touch /home/ftp/.notar

    ```


