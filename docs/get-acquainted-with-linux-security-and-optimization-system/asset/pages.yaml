    # # Components to Install (Package Group Selection)


    After your partitions have been configured and selected for formatting, you are
    ready to select packages for installation. By default, Linux is a powerful operating
    system that executes many useful services. However, most of these services are
    unnecessary and pose a potential security risk.


    A proper installation of Linux is the first step to a stable, secure system. You
    first have to choose which system components to install. Choose the components,
    and then you can go through and select or deselect each individual package of
    each component by **(Select individual packages)** option.


    Since we are configuring a Linux Server, we do not need to install a graphical
    interface (XFree86) on our system (graphical interface on a server mean less process;
    less cpu; less memory; security risks and so on). Graphical interface is usually
