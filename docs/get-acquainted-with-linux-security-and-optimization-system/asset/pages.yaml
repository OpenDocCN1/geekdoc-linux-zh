  md: 'Comments and suggestions concerning this page should be mailed to gmourani@videotron.ca


    Edit your **fstab** file (via /etc/fstab) and add:


    ```

    /dev/sda8      cache ext2  nosuid,nodev,noexec 1 2

    ```


    Assuming "dev/sda8" is the partition where your "cache" for Squid lives.


    Which mean for <nodev> do not interpret character or block devices on the file
    system, for <nosuid> do not allow set-user-identifier or set-group-identifier
    bits to take effect and for <noexec> do not allow execution of binaries on the
    mounted file system. Applying this procedure on the partition where Squid reside
    will help to eliminate the possibility of DEV, SUID/SQID, and execution of any
    binaries.


    Immunize important configuration files

    The immutable bit used to prevent accidentally deleting or overwriting a file
    that must be protected. It also prevents someone from creating a symbolic link
    to this file. Once your "squid.conf" file has been configured, it''s a good idea
    to immunize it with command like:


    ```

    [root@deep#] chattr +i /etc/squid/squid.conf

    ```


    # Optimizing Squid


    The noatim attribute

    Linux has an option for filesystems called noatim. This option can be added to
    the mount options in "/etc/fstab". When a filesystem is mounted with this option,
    read accesses to the file will no longer result in an update to the time information
    about the file. The time is generally not all that useful, so the lacks of updates
    to the file are not relevant.


    The importance of the noatim setting is that it eliminates the need to make writes
    to the filesystem for files, which are simply being read. Since writes to be somewhat
    expensive, this can result in measurable performance gains. Note that the watime
    information will continue to be updated the file it is written to.


    Edit the fstab file (via /etc/fstab) and add:


    ```

    E1: /dev/sda8      cache  nosuid,nodev,noexec  1 2

    ```


    Assuming "dev/sda8" is the partition where your cache directory for Squid resides
    on the server.


    Reboot your system and test your results with the command:


    ```

    [root@deep#] reboot

    [root@deep#] cat /proc/mounts

    ```


    The bdflush parameter

    This documentation is for the sysctl files in /proc/sys/vm and is valid for Linux
    kernel version 2.2. The files in this directory can be used to tune the operation
    of the virtual memory (VM) subsystem of the Linux kernel, and one of the files
    (bdflush) has a little influence on disk usage.


    This file (bdflush) controls the operation of the bdflush daemon. We generally
    use this to improve system performance:


    ```

    echo "100 1200 128 512 15 5000 1884 2" >/proc/sys/vm/bdflush

    ```


