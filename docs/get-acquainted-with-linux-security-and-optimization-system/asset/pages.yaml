    # Linux Samba Server


    # Overview


    Samba is the protocol by which a lot of PC-related machines share files and printers
    and other information such as lists of available files and printers. Operating
    systems that support this natively include Windows 95/98/NT, OS/2, and Linux and
    add on packages that can achieve the same thing are available for DOS, Windows,
    VMS, Unix of all kinds MVS, and more.


    Apple Macs and some Web Browsers can speak this protocol well. Alternatives to
    SMB include Nether, NFS, AppleTalk, Banyan Views, Decnet etc; many of these have
    advantages and are both public and widely implemented in desktop machines by default.


    # These installation instructions assume


