    # 12. TCP_WRAPPERS


    By default Red Hat Linux allows all requests. TCP_WRAPPERS makes securing your
    servers against outside intrusion a lot simpler and powerful than you could expect.
    Deny all hosts by using "ALL@ALL, PARANOID" in "/etc/hosts.deny" and explicitly
    list hosts who are allowed to your machine in /etc/hosts.allow file is the safest
    configuration. TCP_WRAPPERS is controlled from two files. The search stops at
    the first match.


    /etc/hosts.allow

    /etc/hosts.deny


    +   * Access will be granted when a (daemon, client) pair matches an entry in
    the /etc/hosts.allow file.

    * Otherwise, access will be denied when a (daemon, client) pair matches an entry
    in the /etc/hosts.deny file.

    * Otherwise, access will be granted.


    Step 1

    Edit the hosts.deny file (/etc/hosts.deny) and add the following line:


    Access is denied by default.

