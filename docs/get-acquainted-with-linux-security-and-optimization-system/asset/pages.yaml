- img_proc: true
  md: 'Comments and suggestions concerning this page should be mailed to gmnourani@videotronet.ca


    not. Since SUID programs can do anything that root can bear a high level of responsibility
    in following the golden rules of security programming. Sometimes they do, sometimes
    they don''t and when they don''t, users sometimes get them to do things not supposed
    to. This is where exploits come in. An exploit is a program or script that will
    get a SUID root program to do bad stuff (Give root shells, grab passwords, read
    other people''s mail, delete files, etc.). See below on section "31. Bits from
    root-owned programs" for more information on the subject.


    # 2. BIOS Security, a set boot password


    Disallowing booting from floppy drives and allow access to some BIOS features.
    Check your BIOS manual or look at it next time you boot up. This will improve
    the security of your system. Disallowing booting from floppy drives will block
    undesired people trying to boot your Linux system with a boot disk and allow access
    to the BIOS features will protect you from people trying to change BIOS feature
    like allowing boot from floppy drive or booting the server without prompt.


    # 3. Security Policy


    It is important to point out that you cannot implement security if you have not
    defined what needs to be protected and from whom. You need a security policy,
    a list of who you consider allowable and what you do not consider allowable upon
    to base any decisions regarding security. The policy should also determine your
    response to security violations. What you should consider compiling a security
    policy will depend entirely on your definition of security. The following questions
    should provide some general guidelines:


    +   - How do you classify confidential or sensitive information?

    - Exactly who do you want to guard against?

    - Do remote users access to your system?

    - Does the system contain confidential or sensitive information?

    - What will be the consequences if this information is leaked to your competitors
    or other outsiders?

    - Will passwords or encryption provide enough protection?

    - Do you need access to the Internet?

    - How much access do you want to allow to your system from the Internet?

    - What action will you take if you discover a breach in your security?


    This list is short, and your policy will likely encompass a lot more before it
    is complete. The very first time you need to assess the depth of your paranoia.
    Any security policy must be based on some degree of paranoia; deciding how much
    you trust people, both inside and outside your organization. The policy must,
    however, provide a balance between allowing your users reasonable access to the
    information they require to do their jobs and totally disallowing access to your
    information. The point where this line is drawn will determine your policy.


    # 4. Password


    The starting point of our Linux Security tour is that. Many people keep their
    entire life on a computer and the only thing preventing others from seeing it
    is the eight-character string password. Not something could completely reclaim.
    Contrary to popular belief, an unlockable password does not exist. Given time
    and resources all passwords can be guessed either by social engineering or by
    brute force.


    © Copyright 1999 Open Network Architecture ®'
