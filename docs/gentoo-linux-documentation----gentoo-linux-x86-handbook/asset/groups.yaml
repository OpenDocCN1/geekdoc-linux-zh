- md: "\n## Adding and Removing Services\n\nYou have already added init scripts to\
    \ the \"default\" runlevel during the installation of Gentoo. At that time you\
    \ might not have a cue of what the \"default\" is for, but now you should. The\
    \ rc-update script requires a second argument that defines the action: add, del\
    \ or show.\n\nTo add or remove an init script, just re-update the add or del argument,\
    \ followed by the init script and the runlevel. For instance:\n\n> Code Listing\
    \ 13: Removing Postfix from the default runlevel\n\n```\n# rc-update del postfix\
    \ default\n```\n\nThe rc-update command will show all the available scripts and\
    \ list at which runlevels they execute.\n\n> Code Listing 14: Receiving init script\
    \ information\n\n```\n# rc-update show\n```\n\n## 4.c. Configuring Services\n\n\
    ### Why the Need for Extra Configuration?\n\nInit scripts can be complex. It is\
    \ therefore not desirable to have the user edit the init script directly, as it\
    \ would make it more error-prone. It is important to be able to configure such\
    \ a service. For instance, you might want to give more options to the service\
    \ itself.\n\nA second reason to have this configuration outside the init script\
    \ is to update the init scripts without the fear that your configuration will\
    \ be undone.\n\n### The etc/conf.d Directory\n\nGentoo provides an easy way to\
    \ configure such a service: every init script that can be configured has a file\
    \ in /etc/conf.d. For instance, the apache2 initscript (called /etc/init.d/apache2)\
    \ has a configuration file /etc/conf.d/apache2, which can contain the options\
    \ you want to give to the Apache 2 when it is started:\n\n> Code Listing 15: Variable\
    \ defined in /etc/conf.d/apache2\n\n```\nAPACHE_OPTS=\"-D PHP*\"\n```\n\nSuch\
    \ a configuration file contains variables and variables alone (like /etc/make.conf),\
    \ making it very easy to configure such a service. It also allows us to provide\
    \ more information about the variables (as comments).\n\n## 4.d. Writing Init\
    \ Scripts\n\n### Do I Have To?\n\nNo writing is usually necessary as Gentoo provides\
    \ ready-to-use init scripts for all provided services. However, you might have\
    \ installed a service without using Portage, in which case you will likely have\
    \ to create an init script.\n\nDo not use the init script provided by the service\
    \ if it isn't explicitly written for Gentoo: Gentoo's init scripts are not compatible\
    \ with the init scripts used by other distributions!\n\n### Layout\n\nThe basic\
    \ layout of an init script is shown below.\n\n> Code Listing 16: Basic layout\
    \ of an init script\n\n```\n#!/bin/runscript\ndepend() {\n  (Dependency information)\n\
    }\nstart() {\n  (Commands necessary to start the service)\n}\n```\n\n```\nstop()\
    \ {\n  (Commands necessary to stop the service)\n}\nstart() {\n  (Commands necessary\
    \ to restart the service)\n}\n```\n\nAny init script requires the start() function\
    \ to be defined. All other sections are optional.\n\n### Dependencies\n\nThere\
    \ are two dependencies that you can use: need and after. As we have mentioned\
    \ before, the need dependency is more strict than the dependency. Following this\
    \ dependency type you enter the service you depend on, or the virtual dependency.\n\
    \nA virtual dependency is a service provides, which is not solely provided by\
    \ it. Your init script can depend on a system logger, but there are many system\
    \ loggers available (metalog, syslog-ng, syslog, ...): As you cannot need every\
    \ one of them (no sensible system has all these systems installed and running)\
    \ we make sure that all these services provide a virtual dependency.\n\nLet us\
    \ take a look at the dependency information for the postfix service.\n\n![](img/c0231913cf632f51d9b75da531c717e6_60_0.png)\n\
    \n```\ndepend() {\n  need net\n  use logger dns\n  provide mta\n}\n```\n\nAs you\
    \ can see, the postfix service:\n\n- requires the (virtual) net dependency (which\
    \ is provided by, for instance, /etc/init.d/net.0)\n- uses the (virtual) logger\
    \ dependency (which is provided by, for instance, /etc/init.d/syslog-ng)\n- uses\
    \ the (virtual) dns dependency (which is provided by, for instance, /etc/init.d/named)\n\
    - provides the (virtual) mta dependency (which is common for all mail servers)\n\
    \n### Controlling the Order\n\nIn cases you might require a service, but want\
    \ your service to be started before (or after) another service if it is available\
    \ on the system (note the conditional - need dependency) and run in the same runlevel\
    \ (note the conditional - only services in the same runlevel are involved). You\
    \ can provide this information using the before or after settings.\n\nAs an example\
    \ we view the settings of postfix service:\n\n![](img/c0231913cf632f51d9b75da531c717e6_60_1.png)\n\
    \n```\ndepend() {\n  need net\n  before inet\n  before xinetd\n}\n```\n\nYou can\
    \ use \"*\" glob to catch all services in the same runlevel, although this isn't\
    \ advisable.\n\n![](img/c0231913cf632f51d9b75da531c717e6_60_2.png)\n\n```\ndepend()\
    \ {\n  before *\n}\n```\n\n### Standard Functions\n\nNext to the depend() functionality,\
    \ you also need to define the start() function. This one contains all the commands\
    \ to initialize your service. It is advisable to use ebegin and end functions\
    \ to inform the user about what is happening.\n\n![](img/c0231913cf632f51d9b75da531c717e6_60_3.png)\n\
    \n```\nstart() {\n  ebegin \"Starting my_service\"\n  start-daemon --quiet --exec\
    \ /path/to/my_service\n  end\n}\n```\n\nIf you need more examples of the start()\
    \ function, please read the source code of the available init scripts in /etc/init.d.\
    \ For start-daemon is an excellent man page if you need more information:\n\n\
    > Code Listing 21: Getting the man page for start-daemon\n\n```\n# start-daemon\n\
    ```\n\nOther functions you can define: stop() and restart(). You are not obliged\
    \ to define these functions! Our init system is intelligent enough to fill these\
    \ itself if you use start-daemon. Gentoo's init script syntax is based on the\
    \ Bourne Shell (bash) so you are free to use bash-compatible constructs inside\
    \ your script.\n\n### Adding Custom Options\n\nIf you want your script to support\
    \ more options than the ones we have encountered, you should add the option to\
    \ the opts variable, and create a function with the same name as your option.\
    \ For instance, to support an option called restartdelay:\n\n> Code Listing 22:\
    \ Supporting restartdelay\n\n```\nopts=\"$opts\"\n\nrestartdelay() {\n  stop\n\
    \  sleep 3  # Wait 3 seconds before starting again\n  start\n}\n```\n\n### Service\
    \ Configuration Variables\n\nYou don't have anything support a configuration file\
    \ in /etc/conf.d: if your init script is executed, the following files are automatically\
    \ sourced (the variables are available to use):\n\n- /etc/conf.d/<your init script>\n\
    - /etc/conf.d/basic\n- /etc/conf\n\nAlso, if your init script provides a virtual\
    \ dependency (such as net), the file associated with that dependency (such as\
    \ /etc/conf.d/) will be sourced too.\n\n## 4.4. Changing the Runlevel Behaviour\n\
    \nWho might benefit from this?\n\nMany laptop users know the situation: at home\
    \ you need to start net.eth0 while you want to start net.eth1 when you're on the\
    \ road (as there is no network available). With Gentoo you can alter the runlevel\
    \ behaviour to your own.\n\nFor instance you can create a \"default\" runlevel\
    \ which can boot has other init scripts assigned to it. You can then select at\
    \ boot time which runlevel you want to use.\n\n### Using offline\n\nFirst of all,\
    \ create the runlevel directory for your second \"default\" runlevel. As an example\
    \ we create the offline:\n\n> Code Listing 23: Creating a runlevel directory\n\
    \n```\n# mkdir /etc/runlevels/offline\n```\n\nAdd the necessary init scripts to\
    \ the newly created runlevel. For instance, if you want to have an exact copy\
    \ of your current default runlevel but without net.eth0:\n\n> Code Listing 24:\
    \ Adding the necessary init scripts\n\n```\n# Copy all services from default runlevel\
    \ to offline runlevel\n# cd /etc/runlevels/default\n# for service in *; do rc-update\
    \ $service offline; done\n# Remove unwanted service from offline runlevel\n# rc-update\
    \ -d offline\n# Display active services for offline runlevel\n# rc-update show\
    \ offline\nPartial sample Output:\nacpid       offline\ndomainname  offline\n\
    local      offline\nnet.eth0\n```\n\nNow edit your boot configuration and add\
    \ a new entry for the offline runlevel. For instance, in /boot/grub/grub.conf:\n\
    \n> Code Listing 25: Adding an entry for the offline runlevel\n\n```\ntitle Gentoo\
    \ Offline Usage\nroot (hd0,0)/kernel-2.4.25 root=/dev/hda3 softlevel=offline\n\
    ```\n\nVoila, you're all set. If you boot your system and select the newly added\
    \ entry at boot, the offline runlevel will be used instead of the \"default\"\
    \ runlevel.\n\n### Using booklet\nUsing booklet is completely analogous to itself.\
    \ The only difference is here that you define a second \"boot\" instead of a \"\
    default\" runlevel.\n\n## 5. Environment Variables\n\n## 5.a. Environment Variables?\n\
    \n### What they are\n\nAn environment variable is a named object that contains\
    \ information used by one or more applications. Many users (especially those new\
    \ to Linux) find this a bit weird or unmanageable. However, this is a mistake:\
    \ using environment variables can easily change a configuration setting for one\
    \ or more applications.\n"
  mdcn: "\n\n## 添加和移除服务\n\n在安装 Gentoo 期间，你已经向“default”（默认）运行级别（runlevel）添加了初始化脚本。当时你可能不知道“default”是做什么的，但现在你应该已经了。`rc-update`\
    \ 脚本需要第二个参数来定义操作：`add`（添加）、`del`（删除）或 `show`（显示）。\n\n要添加或删除初始化脚本，只需更新 `add` 或\
    \ `del` 参数，后跟初始化脚本和运行级别即可。例如：\n\n> 代码列表 13：从默认运行级别中移除 Postfix\n\n```\n# rc-update\
    \ del postfix default\n```\n\n`rc-update` 命令将显示所有可用的脚本并列出它们执行的运行级别。\n\n> 代码列表\
    \ 14：获取初始化脚本信息\n\n```\n# rc-update show\n```\n\n## 4.c. 配置服务\n\n### 为什么需要额外配置？\n\
    \n初始化脚本可能非常复杂。因此，不希望用户直接编辑初始化脚本，因为这会增加出错的概率。能够配置此类服务是非常重要的。例如，你可能想为服务本身提供更多选项。\n\
    \n将配置放在初始化脚本之外的第二个原因是：在更新初始化脚本时，无需担心你的配置会被重置。\n\n### etc/conf.d 目录\n\nGentoo 提供了一种简单的方法来配置此类服务：每个可以配置的初始化脚本在\
    \ `/etc/conf.d` 中都有一个文件。例如，`apache2` 初始化脚本（路径为 `/etc/init.d/apache2`）有一个配置文件 `/etc/conf.d/apache2`，其中可以包含你在启动\
    \ Apache 2 时想要提供给它的选项：\n\n> 代码列表 15：在 /etc/conf.d/apache2 中定义的变量\n\n```\nAPACHE_OPTS=\"\
    -D PHP*\"\n```\n\n此类配置文件仅包含变量（类似于 `/etc/make.conf`），这使得配置此类服务变得非常容易。它还允许我们通过注释为变量提供更多关于变量的信息。\n\
    \n## 4.d. 编写初始化脚本\n\n### 我必须写吗？\n\n通常不需要编写任何内容，因为 Gentoo 为所有提供的服务都提供了现现用的初始化脚本。但是，你可能没有使用\
    \ Portage 安装了某个服务，在这种情况下，你可能需要创建一个初始化脚本。\n\n如果服务提供的初始化脚本不是显式为 Gentoo 编写的，请不要使用它：Gentoo\
    \ 的初始化脚本与其他发行版所使用的初始化脚本是不兼容的！\n\n### 布局\n\n初始化脚本的基本布局所示。\n\n> 代码列表 16：初始化脚本的基本布局\n\
    \n```\n#!/bin/runscript\ndepend() {\n  (依赖信息)\n}\nstart() {\n  (启动服务所需的命令)\n}\n\
    ```\n\n```\nstop() {\n  (停止服务所需的命令)\n}\nstart() {\n  (重启服务所需的命令)\n}\n```\n\n任何初始化脚本都要求定义\
    \ `start()` 函数。所有其他部分都是可选的。\n\n### 依赖关系\n\n你可以使用两种依赖：`need` 和 `after`。正如我们之前提到的，`need`\
    \ 依赖比 `after` 依赖更严格。遵循这种依赖类型时，输入你所依赖的服务或虚拟依赖（virtual dependency）。\n\n虚拟依赖是由某个服务提供的，但并非由该服务唯一提供。你的初始化脚本可以依赖于系统日志程序，但有很多系统日志程序可用（metalog,\
    \ syslog-ng, syslog, ...）：由于你无法需要它们中的每一个（没有哪个合理的系统会安装并运行所有这些系统），我们确保所有这些服务都提供虚拟依赖。\n\
    \n让我们来看 postfix 服务的依赖信息。\n\n![](img/c0231913cf632f51d9b75da531c717e6_60_0.png)\n\
    \n```\ndepend() {\n  need net\n  use logger dns\n  provide mta\n}\n```\n\n如你所见，postfix\
    \ 服务：\n\n- 需要（虚拟）`net` 依赖（例如由 `/etc/init.d/net.0` 提供）\n- 使用（虚拟）`logger` 依赖（例如由\
    \ `/etc/init.d/syslog-ng` 提供）\n- 使用（虚拟）`dns` 依赖（例如由 `/etc/init.d/named` 提供）\n\
    - 提供（虚拟）`mta` 依赖（这对所有邮件服务器都是常见的）\n\n### 控制顺序\n\n在某些情况下，你可能需要某个服务，但如果该服务在系统可用，你希望你的服务在另一个服务之前（或之后）启动（注意条件\
    \ - `need` 依赖），并且在同一个运行级别中运行（注意条件 - 仅涉及相同运行级别中的服务）。你可以使用 `before` 或 `after` 设置来提供此类信息。\n\
    \n例如，我们查看 postfix 服务的设置：\n\n![](img/c0231913cf632f51d9b75da531c717e6_60_1.png)\n\
    \n```\ndepend() {\n  need net\n  before inet\n  before xinetd\n}\n```\n\n你可以使用\
    \ `*` 通配符来捕获相同运行级别的所有服务，尽管不建议这样做。\n\n![](img/c0231913cf632f51d9b75da531c717e6_60_2.png)\n\
    \n```\ndepend() {\n  before *\n}\n```\n\n### 标准函数\n\n除了 `depend()` 功能外，你还需要定义\
    \ `start()` 函数。它包含了所有初始化命令。使用 `ebegin` 和 `end` 函数可以告知用户正在发生什么。![](img/c0231913cf632f51d9b75da531c717e6_60_3)\n\
    \n```\nstart() {\n  ebegin \"Starting my_service\"\n  # (启动服务的命令)\n  end\n}\n\
