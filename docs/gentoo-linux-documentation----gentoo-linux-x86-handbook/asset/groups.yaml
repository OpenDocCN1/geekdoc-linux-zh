  - '[PAGE 78]


    DHCP can be provided by dhclient, dhcped, or udhcpc. Each DHCP module has its
    pros and cons - here''s a quick run.


    | Module | Package | Pros | Cons |

    |---|---|---|---|

    | dhclient | net-misc/dhcp | Made by ISC, the people who make the DNS software.
    Very configurable | Configuration is overly complex, software is quite bloated
    |

    | dhcped | net-misc/dhcp | Long time Gentoo default, reliance on outside tools
    | No longer maintained upkeep, can be slow at times, not daemonize when lease
    is finite |

    | pump | net-misc/pump | Lightweight, reliance on outside tools | No longer maintained
    upkeep, unreliable, especially over modems, cannot get NIS servers from DHCP |

    | udhcpc | net-misc/udhcpc | Lightweight - smallest DHCP client, for embedded
    systems | Unproven - no distro uses it by default, cannot define a timeout beyond
    3 seconds |


    If you have more than one DHCP client, you need to specify which one to use -
    otherwise we use dhcpcd if available.


    To specify options for the DHCP module, module_eth0="..." (change the DHCP module
    you''re using - ie dhcpcd_eth0).


    We try and make DHCP deactively agnostic - as we support the following using the
    dhcp_eth0 variable. The variable is not set by any of them:


    +   - releases the IP address for re-use

    - nodns - don''t overwrite /etc/resol.conf

    - nonstop - don''t overwrite /etc/ntp.conf

    - nonis - don''t overwrite /etc/resol.conf


    # Code Listing 4: Sample DHCP configuration in /etc/conf.d


    ```

    # Only needed if you have more than one DHCP module installed

    modules=(\dhcpcd")


    config_eth0="10" # Timeout after 10 seconds

    dhcpcd_eth0="Telease nodes nontp nonis" # Only get an address

    ```


    > Note: dhclient, udhcpc and pump send the hostname to the DHCP server by default
    you don''t need to specify this.


    # 3.d. ADSL Modem


    First we to install the ADSL software.


    # Code Listing 5: Install the rp-pppoe package


    ```

    # emerge-netdialup/rp-pppoe

    ```


    > Warning: baselayout-1.11.supports PPPoE only. Hopefully future versions will
    support PPPoA.


    Now we need to configure eth0 to be an ADSL interface and enter our username by
    updating /etc/conf.d/net.


    # Code Listing 6: Configure eth0 for ADSL in /etc/conf.d/net


    ```

    config_eth0="*adsl"

    adsl_user_eth0="username"

    ```


    Finally we need to define your username and password in /etc/ppp/pap-secrets.


    # Code Listing 7: sample /etc/ppp/pap-secrets


