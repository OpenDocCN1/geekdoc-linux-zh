    # 5. Environment Variables


    # 5.a. Environment Variables?


    What they are


    An environment variable is a named object that contains information used by one
    or more applications. Many users (especially those new to Linux) find this a bit
    weird or unmanageable. However, this is a mistake: using environment variables
    can easily change a configuration setting for one or more applications.


    # Important Examples


    The following table lists a number of variables used by a Linux system and describe
    their use. Example values are presented after the table.


    | Variable | Description |

    | PATH | This variable contains a colon-separated list of directories in which
    your system looks for executable files. If you enter a name of an executable (such
    as rc-update or emerge) but this is not located in a listed directory, your system
    will not execute it (unless you enter the full path, such as /) |

    | ROOTPATH | This variable has the same function as PATH, but this only lists
    the directories that should be checked when the root-user enters an account |

    | LDPATH | This variable contains a colon-separated list of directories in which
    the dynamic linker searches to find a library |

    | MANPATH | This variable contains a colon-separated list of directories in which
    the man search searches for the pages. |

    | INFODIR | This variable contains the path to the program used to list the list
    of files (with such as less or more) |

    | PAGER | This variable contains the path to the program used to change the list
    of files (with such or no name) |

    | EDITOR | KEDIRS | This variable contains a colon-separated list of directories
    which contain KDE-specific material. |

    | CLASSPATH | This variable contains a colon-separated list of directories which
    contain Java classes. |

    | CONFIG_PROTE | This variable contains a space-delimited list of directories
    which should be protected by Portage during updates. |

    | CONFIG_PROTE_MASK | This variable contains a space-delimited list of directories
    which should not be protected by Portage during updates. |


    Below you will find an example of all these variables:'
- md: '

    ## The /etc/envd directory


    To centralization of these variables, Gentoo introduced the /etc/envd directory.
    Inside this directory you will find a number of files, such as 0basic, 05gcc,
    etc. which contain the variables needed by the application mentioned in their
    name.


    For instance, when you installed gcc, a file called 05gcc was created by the ebuild
    which contains the definitions of the following variables:


    ## Code List 2: /etc/envd/05gcc


    ```bash

    PATH=/usr/x86_64-pc-linux-gnu/gcc-bin/3.2*

    ROOTPATH=/usr/x86_64-pc-linux-gnu/gcc-bin/3.2*

    MANPATH=/usr/share/gcc/data-i686-pc-linux-gnu/3.2/man*

    INFOPATH=/usr/share/gcc/data-i686-pc-linux-gnu/3.2/info*

    CC=*cc.cache

    XX*=

    LDPATH=/usr/lib/gcc/i686-pc-linux-gnu/3.2.3*

    ```


    Other distributions let you to change or add environment variables in /etc/profile
    or other locations. Gentoo on the other hand makes it easy for you (or Portage)
    to maintain and manage the environment variables without having to pay attention
    to numerous files that can contain environment variables.


    For instance, when gcc is updated, the /etc/envd/05gcc file is updated without
    requiring any user-interaction. Occasionally you may be asked to set a certain
    environment variable system-wide. As an example we take the http_proxy variable.
    Instead of messing with /etc/profile, you can now create a file (/etc/envd/99local)
    and enter your definition(s) in it:


    ## Code List 3: /etc/envd/99local


    ```bash

    http_proxy="proxy.server.com:8080*"

    ```


    By using the file for all your variables, you have a quick overview on the variables
    you have defined yourself.


    ## The env-update script


    Several files in /etc/envd define the PATH variable. This is not a mistake: when
    you run env-update, it will append the several definitions before it updates the
    environment variables, making it easy for packages (or users) to add their own
    environment variable settings without interfering with the existing files.


    The env-update script will append the variables in the alphabetical order of /etc/envd
    files. The files must begin with two decimal digits.


    ## Code List 4: Update env-vars by env-update


    | 00basic | 99k-env | 99local |

    | :--- | :--- | :--- |

    | PATH=/usr/bin:/usr/lib/3.2/bin:/usr/local/bin* | | |


    The concatenation of variables does not always happen, with the following variables:
    KEDIRS, PATHCLASS, LDPATH, MANIPATH, INFOPATH, ROOTPATH, CONFIG_PROTECT, CONFIG_MASK,
    PRELINK_PATH and PRELINK, MASK. Only the last defined value (in alphabetical order
    of /etc/envd) is used.


    When you run env-update, the script will create all environment variables and
    place them in /etc/profile (which is used by /etc/). It will extract the information
    from the LDPATH variable and use that to create /etc/ld.so.cache. After this,
    you will run ldconfig to recreate the /etc/ld.so file used by the dynamic linker.


    If you want to notice the effect of env-update immediately after you run it, execute
    the following command to update your environment. Users who have installed Gentoo
    will probably remember this from the installation instructions.


    ## Code List 5: Updating the environment


    ```bash

    env-update --all source /etc/profile

    ```


    Note: The above command only updates the variables in your current terminal, new
    consoles, and their children. Thus, if you are working in X11 you will need to
    type source /etc/profile in every new terminal or restart X as all new source
    variables will be used. If you use a login manager, become root and type /etc/init.d/xdm
    restart. If not, you will need to logout and log in for X to spawn children with
    the new variable.


    ## 5.c. Defining Variables Locally


    ### User Specific


    You do not have to define an environment variable globally. For instance, you
    might want to add /home/my_user/bin and the working directory (the directory you
    are in) to the PATH variable but don''t want all other users on your system to
    have that in their PATH too. If you want to define an environment variable locally,
    you should use ~/.bashrc or ~/.bash_profile:


    #### Code Listing 6: Extending PATH for local usage in ~/.bashrc


    ```bash

    # colon followed by no directory is treated as the current working directory

    PATH=$PATH:/home/my_user/bin;

    ```


    When you relogin, your PATH variable will be updated.


    ### Session Specific


    Sometimes even stricter definitions are required. You might want to be able to
    use binaries from a temporary directory you created without adding the path to
    binaries or editing ~/.bashrc for the short time you need.


    In this case, you can define the PATH in your current session by using the export
    command. As you don''t log out, the PATH variable will be modified by the temporary
    settings.


    #### Code Listing 7: Defining a session-specific environment variable


    ```bash

    export PATH=$PATH:/home/my_user/tmp/usr/bin*

    ```


    ## C. Working with Portage


    ### 1.a. Files and Directories


    ### Configuration


    Portage comes with default locations. When you look at it, you''ll notice that
    all have well-known locations. This chapter explains special-purpose locations
    and how to alter their placement. This document is not meant to be used as a reference.
    If you need 100% coverage, please consult the Portage page:


    #### Code List 1: Reading the Portage page


    ```bash

    $portage

    ```


    ### 1.b. Storing Files


    ### The Portage Tree


    The Portage tree location is /usr/portage. This is defined by the PORTDIR variable.
    When you store the Portage tree elsewhere (altering this variable), don''t forget
    to change the /etc/profile link accordingly.


    If you alter the PORTDIR variable, you might want to alter the following variables
    as well they will not notice the PORTDIR change. This is due to how Portage handles
    variables: PKGDIR, DISTDIR, RMPDIR.


    #### Prebuilt Binaries


    Even Portage does not use prebuilt binaries by default, it has extensive support
    for them. When you ask Portage to work with prebuilt packages, it will look for
    them in /etc/packages. This location is defined by the PKGDIR variable.


    #### Source Code


    Application source code is stored in /etc/dist by default. This location is defined
    by the DISTDIR variable.


    #### RPM Files


    Even Portage cannot use RPM files, it is able to generate them using the ebuild
    command. The default location where Portage stores RPM files is /etc/rpm and this
    is defined by the RMPDIR variable.


    #### Portage Database


    Portage stores the state of your (what packages are installed, what files belong
    to which package, ...) in /var/db/pkg. Do not alter these files manually! It might
    break Portage''s knowledge of your system.


    #### Portage Cache


    The Portage cache (with modification time, virtual, dependency tree, ...) is stored
    in /var/cache/edb. This location is a cache: you can clean it if you are not running
    any portage-related application at that moment.


    ### Profile-Specific


    #### Information


    Profile-specific information is contained within /etc/profile. The previously
    mentioned configuration can be altered through /etc/profile. This is because many
    Portage uses use profiles.


    #### User Specific Configuration


    User-specific configuration is handled through /etc/profile. Within /etc/profile
    you can find the following:


    - package.mask: packages you want to mask

    - package.unmask: packages you want to unmask

    - package.keywords: packages you want to keyword

    - package.use: flags you want to use

    - package.local: local overrides


    ### 2. Building Software


    #### Temporary Portage Files


    Portage''s temporary files are stored in /var/tmp by default. This is defined
    by the PORTAGE_TMPDIR variable. To change this, you can set the variable in /etc/profile.

