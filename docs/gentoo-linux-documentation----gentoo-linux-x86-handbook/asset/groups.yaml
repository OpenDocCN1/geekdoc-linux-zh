    ## Configuring


    To configure LILO, you must create /etc/lilo.conf. Fire up your favorite editor
    (in this handbook we use nano for consistency) and create the file.


    ```

    Code Listing 10: Creating/etc/lilo.conf

    # nano -w /etc/lilo.conf

    ```


    Some things we have asked you to remember is the kernel-name that you have created.
    In the next example lilo.conf we use the example partitioning scheme. There are
    two separate parts:


    - One for those who have not used kernels to build their kernel

    - One for those who have used kernels to build their kernel


    Make sure you use your kernel filename and, if appropriate, your initrd line after
    each boot item. JFS needs to replay its log before it allows read-writing.


    > Note: If your root filesystem is JFS, you must add an append=''ro'' line after
    each boot item since JFS needs to replay its log before it allows read-writing.


    ```

    Code Listing 11: Example/etc/lilo

    boot=/dev/hda      # Install LILO in the MBR

    prompt            # Give the user chance to select another section

    timeout=50         # Wait 5 (five) seconds before booting the default section

    default=gentoo     # When the timeout has passed, boot the "gentoo" section


    # For non-generickernel users

    image=/boot/kernel-generic-2.6.12-gentoo-r10

    label=gentoo      # Name the kernel give to this section

    read-only=ro      # Start with a read-only root. Do not alter!

    root=/dev/hda3    # Location of the root filesystem


    # For kernel users

    image=/boot/kernel-generic-x86-2.6.12-gentoo-r10

    label=gentoo

    read-only=n

    append="initrd=/linuxux_ramdisk=8192 root=/dev/hda3 udev"

    initrd=/boot/initramfs-kernel-generic-2.6.12-gentoo-r10


    # The two lines are only if you dualboot with a Windows system.

    # In this case, Windows is hosted on /dev/hda6.

    other=/dev/hda6

    label=windows

    ```


    > Note: The udev mentioned at the append line is needed to work around in some
    kernel versions if you use udev in the first place (which is the default behaviour).


    If you need to pass any additional options to the kernel, add an append statement
    to the section. As an example, we add the video statement to enable framebuffer:


    ```

    Code Listing 12: Using append to add kernel options

