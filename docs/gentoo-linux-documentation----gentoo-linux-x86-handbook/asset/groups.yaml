    +   11. Finalizing your Gentoo Installation

    You''re almost done. We''ll create one (or more) users for your system.


    +   12. Where to go from?

    Now have your Gentoo system, but what''s next?


    +   * Working with Gentoo

    Learn how to work with Gentoo installing software, altering variables, changing
    Portage behaviour.


    +   1. A Portage Introduction

    This chapter explains the "simple" steps you need to know to maintain the software
    on your system.


    +   2. USE Flags

    USE-flags are a very important aspect of Gentoo. In this chapter, you learn to
    use USE-flags and understand how USE-flags interact with your system.


    +   3. Portage Features

    This chapter discusses Portage features, such as support for distributed caching,
    ccache and more.


    +   4. Initscripts

    Gentoo uses a generic script format, which other features allows dependency-driven
    decisions and initscripts. This chapter explains all these aspects and how to
    deal with them.


    +   5. Environment Variables

    With Gentoo you can easily manage the environment variables for your system. This
    chapter shows how to do that, and also used variables.


    +   * Working with Portage

    "Working with Portage" provides an in-depth coverage of Portage, Gentoo''s Software
    Management Tool.


    +   1. Files and Directories

    Once you want to know Portage in Gentoo you need to know where it stores its files
    and data.


    +   2. Configuring Variables

    Portage is completely configurable through various variables you can set in the
    configuration file or as environment variable.


    +   3. Mixing Software Branches

    Gentoo provides software separated in several branches, depending on stability
    and architectural support. "Mixing Software Branches" informs you how these branches
    can be configured and how you can oversee this situation individually.


    +   4. Additional Tools

    Portage comes with a few extra tools that make your Gentoo experience even better.
    Read on discover how to use dispatch-config and other tools.


    +   5. Diverging from the Official Tree

    "Diverging from the Official Tree" gives you some tips and tricks on how to use
    your Portage tree, to synchronise the categories, you inject packages and more.


    +   6. The Ebuild Application

    In "The Ebuild Application" you are informed about the steps Portage take while
