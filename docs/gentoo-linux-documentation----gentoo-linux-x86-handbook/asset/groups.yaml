    ## 2. USE-flags


    ### 2a. What are USE-flags?


    In the hope that you understand the importance of USE-flags we will now inform
    you how to declare USE-flags. To make it easy for users to search and pick USE-flags,
    we already provide a default setting. This setting is a collection of USE-flags
    that are commonly used by the Gentoo. This is declared in the make profile.


    The profile system is linked to the /make.profile. Each profile works on top of
    another, the end result is the sum of all. The top profile is the base profile
    (/usr/portage/profiles/base).


    Let us take a look at this default setting for 2004.3.


    ```

    Code List 1: Cumulative.default USE variable for the 2004.3 profile

    (This example is the sum of the settings in base, default-linux, default-linux/x86
    and default-linux/x86/2004.3)

    use86 oss avx build-fonts ctype encode f77

    usekde sdl glip python gnome lib+ matt mad

    usemod mikft mreq nis obgovnis opennis pdfrib python qt

    quicktime release sdl svga truetype x xml znz xv*)

    ```


    ### 2b. Using USE-flags


    #### Declare USE-flags


    As you can see, this variable contains quite a lot of keywords. Do not alter any
    make.files to declare the USE variable to your needs: changes in this file will
    be visible when you update!


    To change this default setting, you need add or remove keywords to the USE variable.
    This is done globally by defining the USE variable in /etc/make.conf. In this
    variable you can add the extra USE-flags you require, or remove the USE-flags
    you don''t want. This latter is done by prefixing the keyword with the minus sign
    (-


    For instance, to support KDE and Qt add support for ipad, the following USE can
    be defined in /etc/make.conf:


    ![](img/c0231913cf632f51d9b75da531c717e6_51_0.png)

    '
  mdcn: '

    是任何虚拟系统的良好选择：由于每个系统日志记录器都提供了 virtual/syslog，使得应用程序可以依赖 virtual/syslog。


    Portage 树中的软件可以存在分支中。默认情况下，你的系统只接受 Gentoo 抽象（deabs）。大多数稳定软件在提交后会被添加到测试分支（testing
    branch），这意味着在标记为稳定之前需要进行更多测试。虽然你会在 Portage 树中看到这些软件的 ebabs，但在它们被放入稳定分支（stable
    branch）之前，Portage 不更新它们。


    某些本体（ontology）仅适用于少数功能。该软件无法在其他架构上运行，或者需要更多测试，或者提交软件到 Portage 树的开发者无法验证该包在某些架构上是否可用。


    每个 Gentoo 安装都遵循一个配置（profile），该配置包含了除其他信息外，系统正常运行所需的软件包列表。


