    Ebuild features inform Portage about its dependencies. There are two possible
    dependencies: build dependencies, declared in DEPEND and run dependencies, declared
    in RDEPEND. When one of these dependencies makes a package or virtual as being
    not llicting, it triggers a conflict.


    To fix a conflict, you can choose to not install the package or remove the conflicting
    package. In this case, you can opt not to install package or remove sntpt first.


    It is also possible that two packages are to be installed blocking each other.
    In this case, you should find out why you need to install both. If you cannot
    do so with one of the packages, please file a bug at Gentoo''s bug system.


