    ## Configuring the use variable


    USE is one of the most powerful features Gentoo provides to us. Several programs
    can be compiled with without certain items. For instance, some programs can be
    compiled with gtk-support, or with qt-support. Others can be compiled with without
    SSL support. Some programs can be compiled with framebuffer support (vga) instead
    of X-server.


    Most distributions compile their packages with much as possible, increasing the
    size of the programs and startup time, not to mention the enormous amount of dependencies.
    With Gentoo you can define what options a package should be compiled with. This
    is where USE comes in. In the USE variable you define keywords which are mapped
    onto option-classes. For instance, sdl will compile with ssl-support in the programs
    that it -X will remove X-server support (the minus sign in front). gnome-kde will
    compile your programs with gnome (and kde) and not with (qt) which you will need
    fully tuned for OpenGL.


    The default settings are placed in the /make.files directory of your profile.
    The default USE is the sum of all USE settings in make.files. If you add a USE
    setting, it is added to the default list. If you remove it from the default list
    (by placing a minus sign in front of it) it is removed from the default list (if
    it was in the default list at all); it gets overwritten when you update Portage!
    A full description of USE can be found in the second part of the Gentoo Handbook,
    USE flags. A full description on the available USE flags can be found on your
    system at /usr/portage/use.desc


    # Code Listing 12: Viewing USE flags


    ```bash

    # less /usr/portage/use.desc

    (You can scroll using arrow keys, it is by pressing ''q'')

    ```


    As an example of using a USE setting for a KDE-based system with DVD, ALSA and
    CD:


    # Code Listing 13: Opening/etc/make.conf


    ```bash

    # nano -w /etc/make.conf

    ```


    # Code Listing 14: USE setting


    ```bash

    USE="gtk kde dvd alsa"

    ```


