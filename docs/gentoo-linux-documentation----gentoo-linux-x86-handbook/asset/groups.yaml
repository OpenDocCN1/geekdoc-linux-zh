- md: "\nAPIPA tries to find a free address in the 169.254.0.0-169.254.255.255 by\
    \ arping an address in that range on the interface. If no reply is found then\
    \ this is only for LANs where there is no DHCP server and you don't connect directly\
    \ to the internet and all other computers use APIPA.\n\nFor APIPA support, merge\
    \ net-misc/iputils or net-analyze/arping.\n\n# Code Listing 8: APIPA configuration\
    \ in /etc/conf.d/net\n\n```\n# Try DHCP - if that fails fallback to APIPA\nconfig_eth0=\"\
    dhcp\"\nfallback_eth0=\"apipa\"\n\n# Just use APIPA\nconfig_eth0=\"apipa\"\n```\n\
    \n## 3.5. Bonding\n\nFor link bonding/trunking emerge net-misc/ifensave.\n\nBonding\
    \ is used to increase network bandwidth. If you have two network cards going to\
    \ the same network, you can bond them together so your applications just see one\
    \ interface but they really use both network cards.\n\n# Code Listing 9: bonding\
    \ configuration in /etc/conf.d/net\n\n```\n# To bond interfaces together\nslaves_bond0=\"\
    eth0 eth1 eth2\"\n\n# You may not want to assign an IP to the bonded interface\n\
    config_bond0=\"null\"\n\n# Depend on eth0, eth1 and eth2 as they may require extra\
    \ configuration\ndepend_bond0() {\n  need net_eth0 net_eth1 net_eth2\n}\n```\n\
    \n## 3.6. Bridging (802.1d support)\n\nFor bridging support emerge net-misc/bridge-utils.\n\
    For example, you may have a server that connects to the internet via an ADSL modem\
    \ and a wireless card to enable other computers to connect to the internet via\
    \ the ADSL modem. You could create a bridge to join the two interfaces together.\n\
    \n# Code Listing 10: Bridge configuration in /etc/conf.d/net\n\n```\n# Configure\
    \ the bridge - see man brctl- for more details\nbrctl_br0=\"setethlo 0\" \"stp.off\"\
    \n\n# Add ports to bridge br0\nbridge_br0=\"eth0\"\n\n# You need to connect the\
    \ ports to null values as dhcp does not get started\nconfig_eth0=\"null\"\nconfig_eth1=\"\
    null\"\n\n# Finally give the bridge an address - you could use DHCP as well\n\
    conf_br0=\"192.168.0.1/24\"\n\n# Depend on eth0 and eth1 as they may require extra\
    \ configuration\ndepend_br0() {\nneed net_eth0 net_eth1\n}\n```\n\nImportant:\
    \ For some use cases, you may need to consult the variable name documentation.\n\
    \n## 3.7. MAC Address\n\nYou don't need to change anything for changing the MAC\
    \ address of your interface if you have sys-apps/baselayout-1.11.14 and want to\
    \ change to a specific MAC address. However, if you need to change to a random\
    \ MAC address or a baselayout older than the version mentioned above, you have\
    \ to emerge net-analyzer/maccchanger to be able to make use of this feature.\n\
    \n# Code Listing 11: MAC address example\n\n```\n# To set the MAC address of the\
    \ interface\nmac_eth0=00:11:22:33:44:55\n\n# To randomize the last 3 bytes only\n\
    mac_eth0=*random-ending\"\n\n# To randomize between the same physical type of\
    \ connection (eg fibre,\n# copper, wireless), all vendors\nmac_eth0=*random-anykind\"\
    \n\n# To randomize between any physical type of connection (eg fibre, copper,\n\
    # wireless), all vendors\nmac_eth0=*random-anykind\"\n\n# Full randomization WARNING:\
    \ some MAC addresses generated by this may\n# NOT work as expected\nmac_eth0=*random-full*\"\
    \n```\n\n## 3. Tunnelling\nYou don't need to emerge anything tunnelling as the\
    \ interface handler can do for you.\n\n# Code Listing 12: Tunnelling configuration\
    \ in /etc/conf.d/net\n\n```\n# For GRE tunnels\niptunnel_vpn0= mode gre 207.170.82.1\
    \ key 0xffffff ttl 255\n\n# For IPIP tunnels\niptunnel_vpn0= mode ipip 207.170.82.2\
    \ ttl 255\n\n# To configure the interface\nconfig_vpn0=\"172.168.0.2 peer 192.168.1.1\"\
    \n```\n\n## 3.j. VLAN (802.1q support)\nFor VLAN support, emerge net-misc/vconfig.\n\
    Virtual LAN is a group of network devices that behave as if they were connected\
    \ to a single network segment - even though they may not. VLAN members can be\
    \ any members of the same VLAN that share the same physical network.\n\n# Code\
    \ Listing 13: VLAN configuration in /etc/conf.d/net\n\n```\n# Specify the VLAN\
    \ numbers for the interface like so\n# Please ensure your VLAN IDs are NOT zero-padded\n\
    vlan_eth0*=\"1*\"\n\n# You can also configure the VLAN\n# for each config page\
    \ for more details\nvconfig_eth0*=(set_name \"VLAN_PLUS_NOD_PAD\"\nvconfig_vlan*=(set_flag\
    \ 1 \"egress_map 2 6\")\n\n# To configure the interface as usual\nconfig_vlan*=\"\
    172.168.0.1 netmask 255.255.254.0\"\nvconfig_vlan*=\"172.168.0.1 netmask 255.255.254.0\"\
    \n```\n\n> Important: For some VLAN setups, you need to consider the variable\
    \ name documentation.\n\n## 4. Wireless Networking\n\n### 4.a. Introduction\n\
    Currently we use wireless setup either by wireless-tools or wpa_supplicant. The\
    \ important thing to remember is that you configure wireless networks on a global\
    \ basis and not an interface base. wpa_supplicant is the best choice, but it does\
    \ not support all drivers. For a list of supported drivers, read wpa-site. Also,\
    \ wireless-tools supports nearly all cards but cannot connect to SSIDs that you\
    \ have configured.\n\nWarning: The linux-wlan-driver is not supported by baselayout\
    \ at this. This is because linux-wlan-ng have their own setup and configuration\
    \ which is completely different from everyone's. When this happens you use linux-wlan-ng\
    \ by baselayout.\n\n### 4.b. WPA Supplicant\nWPA Supplicant is a package that\
    \ allows you to connect to WPA enabled access points. Its setup is fairly fluid\
    \ as it is still in beta - however it works for the most part.\n\nImportant: You\
    \ have to configure CONFIG_PACKET enabled in your kernel for wpa_supplicant to\
    \ work.\n\n# Code Listing 1: Install wpa_supplicant\n\n```\n# emerge net-wireless/wpa_supplicant\n\
    ```\n\nNow we have to configure /etc/conf.d/net to set wpa_supplicant over wireless-tools.\
    \ It's important that we tell wpa_supplicant which driver we should use as it's\
    \ not very good at guessing yet. Note: If you use the host-driver you will need\
    \ to put the card in Managed mode before it can be used with wpa_supplicant correctly.\
    \ You can use iwconfig eth0 managed to achieve this in /etc/conf.d/net. However,\
    \ we have to configure wpa_supplicant itself which is a bit tricky how the Access\
    \ Points are that you are trying to connect to. The below is taken and simplified\
    \ from /etc/wpa_supplicant.example which shows with wpa_supplicant.\n\n# Code\
    \ Listing 2: configure /etc/conf.d/net for wpa_supplicant\n\n```\n# Prefer wpa_supplicant\
    \ over wireless-tools\nmodules=( \"wpa_supplicant\" )\n\n\n# Configure WEP keys\
    \ for Access Points called ESSID1 and ESSID2\n# You may configure up to 4 WEP\
    \ keys, but only one is active at\n# any time so we supply a default index of\
    \ [1] to set key [1] and then\n# again afterwards change the key to [1]\n```\n\
    \n# Code Listing 3: example /etc/wpa_supplicant.conf\n\n```\n# The below line\
    \ not to be changed otherwise we refuse to work\nctrl_interface=/var/run/wpa_supplicant\n\
    \n# Ensure that only root can read the WPA configuration\nctrl_interface_group=0\n\
    \n# Let wpa_supplicant take care of scanning and AP selection\nap_scan=1\n\n#\
    \ Simple case: WPA-PSK, PSK as an ASCII passphrase, allow all valid ciphers\n\
    network={\nssid=\"simple\"\npsk=\"secret passphrase\"\n# The higher the priority\
    \ the sooner we are matched\npriority=2\n}\n\n# Same as previous, request SSID-specific\
    \ scanning (for APs that broadcast: SSID)\nnetwork={\nssid=\"second ssid\"\nscan=ssid0\n\
    psk=\"secret passphrase\"\npriority=2\n}\n\n# Only WPA-PSK is used. Any valid\
    \ cipher combination is\nnetwork={\nssid=\"example\"\nproto=WPA\nmgmt=WPA-PSK\n\
    pairwise=TKIP\ngroup=CCMP TKIP WEP104 WEP40\npsk=6b4862b1d4a289f745aa643cb793029ddab3db7a2ee932eb0106c2accb\n\
    priority=2\n}\n\n# Plaintext connection (no WPA, no IEEE 802.1x)\nnetwork={\n\
    \  ssid=\"plaintest\"\n  key_mgmt=NONE\n}\n\n# Shared WEP key connection (no WPA,\
    \ no IEEE 802.1x)\nnetwork={\n  ssid=\"static-wep-test\"\n  key_mgmt=NONE\n  wep_mode=\"\
    code\"\n  wep_key1=010203045\n  wep_key2=\"1234567890123\"\n  wep_alg=0\n  priority=5\n\
    }\n\n# Shared WEP key connection (no WPA, no IEEE 802.1X) using Shared Key\n#\
    \ IEEE 802.11 authentication\nnetwork={\n  ssid=\"static-wep-test\"\n  key_mgmt=NONE\n\
    \  wep_key1=010203045\n  wep_key2=\"1234567890123\"\n  wep_alg=0\n  priority=5\n\
    }\n\n# IBSS /ad-hoc network with WPA-None/TKIP\nnetwork={\n  ssid=\"test adhoc\"\
    \n  mode=1\n  proto=WEP\n  key_mgmt=WPA-NONE\n  pairwise=NONE\n  group=TKIP\n\
    \  psk=\"secret passphrase\"\n}\n```\n\n## 4.c. Wireless Tools\n\nWireless Tools\
    \ provides a generic way to configure wireless interfaces to the WEP security\
    \ level. WEP is a weak security method it is also the most prevalent.\n\nWireless\
    \ Tools configuration is controlled by a few variables. The sample configuration\
    \ file below should describe all you need. One thing to bear in mind is that no\
    \ configuration means \"connect to the strongest unencrypted Access Point\" -\
    \ we will always try and connect you to something\n\n# Code Listing 4: Install\
    \ wireless-tools\n\n```\n# emerge net-wireless/wireless-tools\n```\n\n> Note:\
    \ Although you can store your wireless settings in /etc/conf.d/wireless this guide\
    \ recommends you store them in /etc/conf.d\n\n# Code Listing 5: sample iw_config\
    \ setup in /etc/conf.d/net\n\n```\n# Prefer: iw_config over wpa_supplicant\nmodules=(\
    \ \"iwconfig\" )\n\n\n# Configure WEP keys for Access Points called ESSID1 and\
    \ ESSID2\n# You may configure up to 4 WEP keys, but only one is active at\n# any\
    \ time so we supply a default index of [1] to set key [1] and then\n# again afterwards\
    \ change the key to [1]\n```\n"
  mdcn: "\n\nAPIPA 尝试通过在接口上对169.254.0.0-169.254.255.255 范围内的地址进行 arping 来寻找空闲地址。如果没有找到响应，则仅适用于没有\
    \ DHCP 服务器且你没有直接连接互联网且所有其他计算机都使用 APIPA 的局域网。\n\n若要支持 APIPA，请 merge net-misc/iputils\
    \ 或 net-analyze/arping。\n\n# 代码列表 8：/etc/conf.d/net 中的 APIPA 配置\n\n```\n# 尝试 DHCP\
    \ - 如果失败则回退到 APIPA\nconfig_eth0=\"dhcp\"\nfallback_eth0=\"apipa\"\n\n# 仅使用 APIPA\n\
    config_eth0=\"apipa\"\n```\n\n## 3.5. 绑定 (Bonding)\n\n对于链路绑定/汇聚（link bonding/trunking），请\
    \ emerge net-misc/ifensave。\n\n绑定用于增加网络带宽。如果你有两个连接到同一个网络的网卡，可以将它们绑定在一起，这样你的应用程序只会看到一个接口，但实际上它们使用了两个网卡。\n\
    \n# 代码列表 9：/etc/conf.d/net 中的绑定配置\n\n```\n# 将接口绑定在一起\nslaves_bond0=\"eth0 eth1\
    \ eth2\"\n\n# 你可能不想为绑定后的接口分配 IP\nconfig_bond0=\"null\"\n\n# 依赖 eth0、eth1 和 eth2，因为它们可能需要额外配置\n\
    depend_bond0() {\n  need net_eth0 net_eth1 net_eth2\n}\n```\n\n## 3.6. 桥接 (支持\
    \ 802.1d)\n\n若要支持桥接，请 emerge net-misc/bridge-utils。\n例如，你可能有一台服务器通过 ADSL 调制解器连接互联网并通过无线网卡让其他计算机通过\
    \ ADSL 调制解器上网。你可以创建一个桥接将这两个接口连接起来。\n\n# 代码列表 10：/etc/conf.d/net 中的桥接配置\n\n```\n\
    # 配置桥接 - 更多详情请 man brctl-\nbrctl_br0=\"setethlo 0\" \"stp.off\"\n\n# 将端口添加到桥接\
    \ br0\nbridge_br0=\"eth0\"\n\n# 你需要将端口连接到 null 值，因为 dhcp 不启动\nconfig_eth0=\"null\"\
    \nconfig_eth1=\"null\"\n\n# 最后给桥接分配地址 - 你也可以使用 DHCP\nconf_br0=\"192.168.0.1/24\"\
    \n\n# 依赖 eth0 和 eth1，因为它们可能需要额外配置\ndepend_br0() {\nneed net_eth0 net_eth1\n}\n\
    ```\n\n重要：对于某些用例，你可能需要查阅变量名文档。\n\n## 3.7. MAC 地址\n\n如果你拥有 sys-apps/baselayout-1.11.14\
    \ 并且想要更改为特定的 MAC 地址，你不需要为接口的 MAC 地址更改任何内容。然而，如果你需要更改为随机 MAC 地址或比上述版本旧的 baselayout，你必须\
    \ emerge net-analyzer/maccchanger 才能使用此功能。\n\n# 代码列表 11：MAC 地址示例\n\n```\n# 设置接口的\
    \ MAC 地址\nmac_eth0=00:11:22:33:44:55\n\n# 仅随机最后 3 个字节\nmac_eth0=*random-ending\"\
    \n\n# 在相同物理类型的连接之间随机（例如光纤、\n# 铜线、无线），所有厂商\nmac_eth0=*random-anykind\"\n\n# 在任何物理类型的连接之间随机（例如光纤、铜线、\n\
    # 无线），所有厂商\nmac_eth0=*random-anykind\"\n\n# 全随机警告：此处生成的某些 MAC 地址可能\n# 不按预期工作\n\
    mac_eth0=*random-full*\"\n```\n\n## 3. 隧道 (Tunneling)\n你不需要 emerge 任何隧道，接口处理器可以为你完成。\n\
    \n# 代码列表 12：/etc/conf.d/net 中的隧道配置\n\n```\n# GRE 隧道\niptunnel_vpn0= mode gre 207.82.1\
    \ key 0ffff ttl 255\n\n# IPIP 隧道\niptunnel_vpn0= mode ipip 207.82.2 ttl 255\n\n\
    # 配置接口\nconfig_vpn0=\"172.168.0.2 peer 192.168.1.1\"\n```\n\n## 3.j. VLAN (支持\
    \ 802.1q)\n若要支持 VLAN，请 emerge net-misc/vconfig。\n虚拟局域网是一组设备，其表现就像连接到同一个网络段 - 尽管并非如此。VLAN\
    \ 成员可以是共享相同物理网络的成员。\n\n# 代码列表 13：/etc/conf.d/net 中的 VLAN 配置\n\n```\n# 如下所示为接口指定\
    \ VLAN 数字\n# 请确保你的 VLAN ID 是零填充的\nvlan_eth0=\"1*\"\n\n# 你也可以为每个配置页面配置 VLAN\n#\
    \ 更多详情\nvconfig_eth0*=(set_name \"VLAN_NOD_PAD\"\nvconfig_vlan*=(set_flag 1 \"\
    egress_map 2\")\n\n# 像通常一样配置接口\nconfig_vlan*=\"172.168.0.1 netmask 255.255.254.0\"\
    \nvconfig_vlan*=\"172.168.0.1 netmask 255.255.254.0\"\n```\n\n> 重要：对于某些 VLAN 设置，你需要考虑变量名。\n\
    \n## 4. 无线网络 (Wireless Networking)\n\n### 4.a. 简介\n目前我们使用 wireless-tools 或 wpa_supplicant\
    \ 进行无线设置。重要的是，我们在全局范围内配置无线网络，而不是基于接口。wpa_supplicant 是最佳选择，但它不支持所有驱动程序。支持的驱动列表请阅读\
    \ wpa-site。此外，wireless-tools 支持几乎所有的卡，但无法连接到你配置的 SSID。\n\n警告：baselayout 不支持 linux-wlan-driver。因为\
    \ linux-wlan-ng 有自己的设置和配置，与其他人完全不同。在这种情况下使用 linux-wlan-ng。\n\n### 4.b. WPA Supplicant\n\
    WPA Supplicant 是一个允许你连接到启用 WPA 热点的包。它的设置相当灵活，因为它仍处于测试阶段 - 但大多数情况下有效。\n\n重要：为了让\
    \ wpa_supplicant 工作，你必须在内核中配置 CONFIG_PACKET。\n\n# 代码列表 1：安装 wpa_supplicant\n\n\
    ```\n# emerge net-wireless/wpa_supplicant\n```\n\n现在我们必须配置 /etc/conf.d/net 以在\
    \ wireless-tools 上设置 wpa_supplicant。告诉 wpa_supplicant 我们应该使用哪个驱动程序很重要，因为它现在还不擅长猜测。注意：如果你使用\
    \ host-driver，你需要将卡设置为 Managed 模式才能正确与 wpa_supplicant 使用。你可以在 /etc/conf.d/net\
    \ 中通过 iwconfig eth0 managed 实现这一点。然而，我们必须配置 wpa_supplicant 本身，对于你尝试连接的热点来说有点复杂。以下内容来自\
    \ /etc/wpa_supplicant.example 并简化了 wpa_supplicant 的用法。\n\n# 代码列表 2：为 wpa_supplicant\
    \ 配置 /etc/conf.d/net\n\n```\n# 优先使用 wpa_supplicant 而非 wireless-tools\nmodules=(\
    \ \"wpa_supplicant\" )\n\n\n# 为名为 ESSID1 和 ESSID2 的热点配置 WEP 密钥\n# 你可以配置最多 4 个\
    \ WEP 密钥，但任何时候只有一个活跃\n# 所以我们提供默认索引 [1]\n# 之后再次将密钥更改为 [1]\n```\n\n# 代码列表 3：示例 /etc/wpa_supplicant.conf\n\
    \n```\n# 下方行不要更改，否则我们将拒绝工作\nctrl_interface=/var/run/wpa_supplicant\n\n# 确保只有 root\
    \ 可以读取 WPA 配置\nctrl_interface_group=0\n\n# 让 wpa_supplicant 扫描和 AP 选择\nap_scan=1\n\
    \n# 简单情况：WPA-PSK，PSK 为 ASCII 密码，允许所有有效的加密算法\nnetwork={\nssid=\"simple\"\npsk=\"\
    secret passphrase\"\n# 优先级越高，匹配得越快\npriority=2\n}\n\n# 与之前相同，请求特定 SSID 的扫描（对于广播:\
    \ SSID 的 AP）\nnetwork={\nssid=\"second ssid\"\nscan=ssid0\npsk=\"secret passphrase\"\
    \npriority=2\n}\n\n# 只使用 WPA-PSK。任何有效的加密组合都是\nnetwork={\nssid=\"example\"\nproto=WPA\n\
    mgmt=WPA-PSK\npairwise=TKIP\ngroup=CCMP TKIP WEP104 WEP40\npsk=6b48621d4a2f793029db7a2ecb930f6\n\
    priority=2\n}\n```\n\n## 4.c. Wireless Tools\n\nWireless Tools 提供了一种通用的方法将无线接口配置为\
    \ WEP 安全级别。WEP 是一种弱的安全方法，但也是最常见的。\n\nWireless Tools 的配置由几个变量控制。下面的示例配置文件描述了你需要的一切。需要记住，没有配置意味着“连接到最强的未加密热点”\
    \ - 我们总是尝试让你连接到某些东西。\n\n注意：虽然你可以将无线设置存储在 /etc/conf.d/wireless，但本指南建议将其存储在 /etc/conf.d\n\
    \n# 代码列表 5：/etc/conf.d/net 中的示例 iw_config 设置\n\n```\n# 优先使用 iw_config 而非 wpa_supplicant\n\
    modules=( \"iwconfig\" )\n```\n\n"
