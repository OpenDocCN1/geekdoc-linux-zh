    ## 5. 偏离官方树


    ### 5.a. 使用 Portage 树子集


    排除包/类别


    你可以选择性地更新类别/包并忽略其他类别。我们通过让 rsync 在合并 --sync 时排除类别/包来实现这一点。


    你需要在 `/etc.conf` 的 `RSYNC_EXCLUDE` 变量中定义包含排除模式的文件名。


    ## 代码列表 1：在 etc.conf 中定义排除文件


    ```

    RSYNC_EXCLUDE=/etc/portage/rsync_excludes

    ```


    ## 代码列表 2：在 /etc/portage/rsync_excludes 中排除所有游戏


    ```

    games/*

    ```


    注意这可能导致依赖问题，因为允许的包可能依赖于新的排除包。


    ### 5.b. 添加非官方构建


    你可以使用 Portage 使用 Portage 树未提供的构建。创建一个新目录（例如 `/usr/portage`），在其中存储第三方构建。使用与官方 Portage
    树相同的目录结构。


    然后在 `/etc.conf` 中定义 `PORTDIR_OVERLAY` 并将其指向自定义目录。现在当你使用 Portage 时，它将考虑这些构建，而不会在下次运行
    `emerge --sync` 时移除/覆盖这些构建。


    处理多个 Overlay


    对于想要多个 Overlay、在包进入 Portage 树之前进行测试或仅仅是为了从各种来源使用非官方构建的强力用户，app-portage-gentookit-build
    package sync 是一个帮助你保持 Portage Overlay 更新的工具。每个仓库应该在 `/etc/gentoo/configuration`
    目录下有一个 `.rsyncsource` 文件，其中包含仓库位置、名称、ID 等。


    假设你有两个额外的仓库，分别名为 `java`（用于开发中的 Java 构建）和 `entapps`（用于为企业内部开发的应用程序）。你可以使用以下命令更新这些仓库：


