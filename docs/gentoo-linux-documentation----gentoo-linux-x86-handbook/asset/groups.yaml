    ## 5. Diverting from the Official Tree


    ### 5.a. Using Portage Tree Subset


    Excluding Packages/Categories


    You can selectively update categories/packages and ignore the other categories.
    We achieve this by having rsync exclude categories/packages during the merge --sync.


    You need to define the name of the file that contains the exclude patterns in
    the RSYNC_EXCLUDE variable in your /etc.conf.


    ## Code List 1: Defining the exclude file in /etc.conf


    ```

    RSYNC_EXCLUDEFROM=/etc/portage/rsync_excludes

    ```


    ## Code List 2: Excluding all games in /etc/portage/rsync_excludes


    ```

    games/*

    ```


    Note how this may lead to dependency issues since, allowed packages might depend
    on new but excluded packages.


    ### 5.b. Adding Unofficial Builds


    You can use Portage to use builds that are not available through the Portage tree.
    Create a new directory (for instance /usr/portage) in which you store the 3rd-party
    builds. Use the same directory structure as the official Portage tree.


    Then define PORTDIR_OVERLAY in /etc.conf and point it to the self-defined directory.
    When you use Portage now, it will take builds into account without removing/overwriting
    those builds the next time you run emerge --sync.


    Working with Several Overlays


    For the powersusers who want several overlays, test packages before they hit the
    Portage tree or just to use unofficial builds from various sources, app-portage-gentookit-build
    package sync is, a tool to help you keep the Portage overlays up to date. Each
    repository should have a .rsyncsource file in the /etc/gentoo/configuration directory
    which contains the repository location, name, ID, etc.


    Suppose you have two additional repositories called java (for the in-development
    java builds) and entapps (for the applications developed in-house for your enterprise).
    You can update those repositories with the following command:


    ## Code List 3: Using gensync to update a few repositories


    ```

    #ync java entapps

