    # 4. Wireless Networking


    4.a. Introduction

    Currently we use wireless setup either by wireless-tools or wpa_supplicant. The
    important thing to remember is that you configure wireless networks on a global
    basis and not an interface base.


    wpa_supplicant is the best choice, but it does not support all drivers. For a
    list of supported drivers, read the wpa_supplicant site. Also, wpa_supplicant
    can only connect to SSIDs that you have configured for.'
