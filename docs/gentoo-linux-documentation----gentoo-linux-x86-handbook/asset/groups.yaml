    ## 10.b: Default: Using GRUB


    ### Understanding GRUB''s terminology


    The most critical part of installing GRUB is getting comfortable with how GRUB
    refers to drives and partitions. Your Linux partition /dev/sda1 will likely be
    called as (hd0,0) under GRUB. Notice the parenthesis.


    Hard drives come from zero "a" and partitions start zero rather than. Be aware
    that with the hd devices, only hard drives are counted, not at devices such as
    cd players and burners. Also, the count is used with SCSI devices. (Normally they
    get higher IDE indices where the BIOS is configured to boot from SCSI devices).
    When you use the BIOS to boot from a different hard disk (for your primary slave),
    that is seen as hd0.


    Assuming you have a drive on /dev/sda, a cdrom on /dev/cdrom, a burner on /dev/hdc,
    a second hard drive on /dev/hdd and no SCSI hard drive, /dev/hdb1 translates to
    (hd1,1). It might sound tricky and it is, but as we will see, GRUB offers a completion
    mechanism for those of you having a lot of hard drives and partitions and who
    are lost in the GRUB numbering scheme.


    Getting the feel for that, it is time to install GRUB.


    ### Installing GRUB


    To install GRUB, let''s first emerge it:


    ```bash

    # Code List 1: Installing GRUB

    # emerge grub

    ```


    Although GRUB is now installed, we will need to write a configuration file for
    it and place GRUB in the MBR so that GRUB automatically boots your newly created
    kernel. Create /boot/grub.conf with nano (or, if applicable, another editor):


    ```bash

    # Code List 2: Creating /boot/grub.conf

    # nano -w /boot/grub.conf

    ```


    Now we are going to edit the first grub.conf. You will find two grub.conf for
    the partitioning example we use in this guide. We''ve only extensively commented
    the first grub.conf. Make sure you use your kernel filename indent, and if appropriate,
    your initrd image filename.


    - The first grub.conf is for people who have not used genkernel to build their
    kernel

    - The second grub.conf is for people who have used genkernel to build their kernel


    > Note: If your filesystem is JFS, you must add "ro" to the kernel line since
    JFS needs to replay its log before it allows read-write mounting.


    ```bash

    # Code List: 3. grub.conf for non-genkernel users

    # Which listing to boot as default. 0 is the first, the second etc.

    default 0

    # How many seconds to wait before the default listing is booted.

    timeout 30

    # Nice flat splash-image to space up :

    # Comment out if you don''t have a graphics card installed

    splashimage=(hd0,0)/boot/splash.xpm

    title=center Linux 2.6.12-r10

    # Partition where the kernel image (or operating system) is located

    root=(hd0,0)

    kernel /kernel-2.6.12-genkernel-r10 root=/dev/hda3

    # The next lines only if you dual boot with a Windows system.

    # In this case windows is hosted on /dev/hdat

    title=Windows XP

    rootverify=(hd0,5)

    makeactive

    chaloader +1

    ```


    ```bash

    # Code List: 4. grub.conf for genkernel users

    default 0

    timeout 30

    splashimage=(hd0,0)/boot/splash.xpm

    title=center Linux 2.6.12-r10

    kernel /kernel-x86-2.6.12-genkernel-r10 root=/dev/ram0 init=/inituxrd mask=8192
    real_root=/dev/hda3

    initrd /initramfs-genkernel-x86-2.6.12-genkernel-r10

    # Only in case you want to dual boot

    title=Windows XP

    rootverify=(hd0,5)

    makeactive

    chaloader +1

    ```


    > Note: The udev mentioned at kernel line is needed to work around a bug in some
    genkernel versions if you use udev in place (which is the default).


    If you used a different partitioning scheme and kernel image accordingly, make
    sure that all GRUB device (such as (hd0,0)) is relative to the mountpoint, not
    the root. In other words, (hd0,0)/grub/splash.gz is in /boot/grub/splash.gz. If
    you choose to use a different partitioning scheme and not boot in a separate partition,
    the boot prefix used in all the above samples is required. If you followed our
    suggestion, the boot prefix is not required, but a boot symlink makes it work.
    In this, the above examples should work whether you define a separate /boot partition
    or not.


    If you need to add any additional options to the kernel, simply add them to the
    end of the kernel command. We are already passing one option (root=/dev/hda5 or
    real_root=/dev/hda3), but you can pass others, such as video=vga. If you''re using
    2.6 or higher kernels and your BIOS can handle large drives then you''ll need
    to append hdx=stripe.


    Now save the grub.conf file. You still need to install grub in the MBR (Master
    Boot Record) so that GRUB is automatically updated when you boot your system.
    However, for some reason grub-install fails to work correctly, you will have the
    option to manually install grub.


    ### Default: Setting up GRUB using grub-install


    To install GRUB you will need to use the grub-install command. However grub-install
    will not work off-the-shelf since we are inside a chrooted environment. We need
    to edit /etc/mtstab which includes all mounted filesystems. Fortunately, there
    is an easy way to accomplish - just copy /proc/mounts, excluding the root lines
    if you have created a separate boot partition. The following command will work
    in cases:


    ```bash

    # Code List 5: Creating /etc/mtstab

    # grep -v root /proc/mounts > /etc/mtstab

    ```


    ```bash

    # Code List 6: Running grub-install

    # grub-install /dev/hda

    ```


    If you have more questions regarding GRUB, please consult the GRUB FAQ or the
    GRUB Manual.


    ### Alternative: Setting up GRUB using manual instructions


    To start configuring GRUB, type in grub. You will be presented with the grub>
    command-line prompt. Now, you need to type the commands to install the GRUB boot
    record onto your hard drive.


    ```bash

    # Code List 7: Starting the GRUB shell

    # grub

    ```


    > Note: If your system does not have floppy drives, add the --no-floppy option
    to the boot command to prevent GRUB from probing the (non-existing) floppy drives.


    In the example we want to install GRUB so that it reads its information from the
    boot-partition /dev/hda1, and installs GRUB boot record on the hard''s MBR (master
    boot record) so that the first time we see on the computer is the GRUB prompt.
    If you''ve followed the example configuration during installation, the commands
    work accordingly.


    The table completion of GRUB can be used from within GRUB. For instance, if you
    type "root " followed by a TAB, you will be presented with a list of devices (such
    as hda0). If you type "root(hd0,0)," followed by a TAB, you will see a list of
    partitions to choose from (such as hd0).


    By using the table completion, setting up GRUB should not be hard. Now, on configuring
    GRUB, shall we:


    ```bash

    # Code List 8: Installing GRUB in the MBR

    grub root (hd0,0)               (Specify where your /boot partition resides)

    grub> setup                     (Install GRUB in the MBR)

    grub> quit                      (Exit the GRUB shell)

    ```


    > Note: If you want to install GRUB in a certain partition of the MBR, you have
    to alter the setup command so it points to the right partition. For instance,
    if you want GRUB in /dev/hda3, the command becomes setup (hd0,2). Few users want
    to do this.


    If you have more questions regarding GRUB, please consult the GRUB FAQ or the
    GRUB Manual.


    > Note: When you reinstall a kernel, you do not need to copy the files anymore.
    Just run make install after compiling the kernel; it will automatically copy the
    necessary files and update the GRUB configuration.


