    # Code Listing 17: Filling in the networking information


    ```

    127.0.0.1      localhost

    192.168.0.5    jenny.homenetwork jenny

    192.168.0.6    benny.homenetwork benny

    192.168.0.7    tux.homenetwork tux

    ```


    If your system is only the system (or the nameser handle all name resolution)
    a single line is sufficient. For instance, if you want to call


    # Code Listing 18: /etc/hosts for lonely or fully integrated PCs


    ```

    127.0.0.1      localhost tux

    ```


    Save and edit the editor to commit.


    If you don''t have PCMCIA, you can now continue with System Information. PCMCIA-users
    should read the following topic on PCMCIA.


    Optional: Get PCMCIA Working


    Note: pcmcia-cs is only for x86, amd64 and ppc platforms.


    PCMCIA-users should first install the pcmcia-cs package. This also includes users
    who will be working with a 2.6 kernel (even though they won''t

    using the PCMCIA drivers from this package). The USE="-X" is necessary to avoid
