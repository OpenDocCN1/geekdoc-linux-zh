    \ the necessary user accounts and change the root password.\n\nTo change the root\
    \ password, use the password utility:\n\n# Code List 9: Changing the root password\n\
    \n```\n# password\nNew password: (Enter your new password)\nRe-enter password:\
    \ (Re-enter your password)\n```\n\nTo create a user account, we first enter their\
    \ credentials, followed by their password. We use useradd and passwd for these\
    \ tasks. In the next, we create a user called \"john\".\n\n# Code List 10: Creating\
    \ a user account\n\n```\n# useradd -m -G users john\n# passwd john\nNew password:\
    \ (Enter john's password)\nRe-enter password: (Re-enter john's password)\n```\n\
    \nYou can change your id from root to the newly created user by using su:\n\n\
    # Code List 11: Changing user id\n\n```\n# su - john\n```\n\n# Optional: Viewing\
    \ Documentation while Installing\n\nIf you want to view the Gentoo Handbook (either\
    \ from CD or online) during the installation, make sure you have created a user\
    \ account (Optional: User Accounts). Then press Alt-F2 to go to a new terminal\
    \ and log in.\n\nIf you want to view the documentation on the CD you can immediately\
    \ run links to it:\n\n# Code List 12: Viewing the on-CD documentation\n\n```\n\
    # links /mnt/cdrom/docs/html/index.html\n```\n\nHowever, it is preferred that\
    \ you use the Gentoo Handbook as it will be more recent than the one provided\
    \ on the CD. You can view it using links, but only after configuring your Network\
    \ chapter (otherwise you won't be able to go on the Internet to view the document):\n\
    \n# Code List 13: Viewing the Online Documentation\n\n```\n# links http://www.gentoo.org/doc/en/handbook/handbook-x86.html\n\
    ```\n\nYou can go back to your original terminal by pressing Alt-F1.\n\n# Optional:\
    \ Starting SSH Daemon\n\nIf you want to allow other users to access your computer\
    \ during the Gentoo installation (perhaps because those users are helping to help\
    \ install Gentoo, even if you do), you need to create a user account for them\
    \ and perhaps provide them with your root password (only do if you fully trust\
    \ that user).\n\nTo fire up the SSH daemon, execute the following command:\n\n\
    # Code List 14: The SSH daemon\n\n```\n# /etc/init.d/sshd start\n```\n\nTo be\
    \ able to use sshd, you first need to set up your networking. Continue with the\
    \ chapter on Configuring your Network.\n\n# 3. Configuring your Network\n\n##\
    \ 3.a. Automatic Network Detection\n\nMaybe it just works?\n\nIf your system is\
    \ plugged into an Ethernet network with a DHCP server, it is very likely that\
    \ your networking configuration has already been set up automatically for you.\
    \ If so, you should be able to take advantage of the many included network-aware\
    \ commands on the Installation CD such as sh, scp, ping, ifconfig, and links,\
    \ others.\n\nIf networking has been configured for you, the /sbin/ifconfig command\
    \ should list network interfaces be lo, so as eth0:\n\n# Code List 15: /sbin/ifconfig\
    \ for working a network configuration\n\n```\n# /sbin/ifconfig\neth0\n    link:Ethernet\
    \  HAddr:00:50:BA:BF:61:7A\n    inet addr:192.168.0.2  Broadcast:192.168.0.255\
    \  Mask:255.255.255.255\n    inet6 fe80::2050:5baff:fe67/64 MTU:1500 Metric:1\n\
    \    UP BROADCAST DYNAMIC MULTICAST  \n    RX packets:1489792 errors:0 overruns:0\
    \ frame:0\n    TX packets:1248980 errors:0 overruns:0 carrier:0\n    collision:0\
    \ RX bytes:86592125 (82.6 Mb) TX bytes:123951388 (118.2 Mb)\n    Interrupt:1 Base\
    \ address:0xe800\n```\n\n# Optional: Configure proxy\n\nIf you access the Internet\
    \ through a proxy, you might need to set up proxy information during the installation.\
    \ It is very easy to define a proxy: you just need to define a variable that the\
    \ proxy server information.\n\nIn many cases, you can just define the variables\
    \ using the server hostname. As an example, if your proxy is called proxy.gentoo.org\
    \ and your port is 8080.\n\n# Code List 2: Defining proxy servers\n\n```\n(IF\
    \ the proxy filters HTTP traffic)\n# export http_proxy=proxy.gentoo.org:8080\n\
    (IF the proxy filters HTTPS traffic)\n# export https_proxy=proxy.gentoo.org:8080\n\
    (IF the proxy filters RSSYNC traffic)\n# export RSSYNC_PROXY=proxy.gentoo.org:8080*\n\
    ```\n\nIf you require a username and password, you should use the following syntax\
    \ for the variable:\n\n# Code List 3: Adding username/password to the proxy variable\n\
    \n```\nhttp://username:password@proxy.gentoo.org:8080\n```\n\n# Testing the Network\n\
    \nYou might try to ping your ISP's DNS (found in /etc/resolv.conf) and a Web site\
    \ of your choice, just to make sure that your packets are reaching the net, DNS\
    \ resolution is working correctly, etc.\n\n# Code List 4: Further testing\n\n\
    ```\n# ping -c 3 yahoo.com\n```\n\nIf you are now using your network, you can\
    \ skip the rest of this section and continue with the Disks. If not, read on.\n\
    \n## 3.b. Automatic Network Configuration\n\nIf the network doesn't work immediately,\
    \ some installation media allow to use net-setup (for regular or wireless networks),\
    \ adsl-setup (for ADSL) or pptp (for PPTP - only available on x86). If installation\
    \ media does not contain any of the tools or your network doesn't function yet,\
    \ continue with Manual Configuration.\n\n- Regular Ethernet users should continue\
    \ with Default: net-setup\n- ADSL users should continue with Alternative: PoE\n\
    - PPTP users should continue with Alternative: PPTP\n\nThe simplest way to set\
    \ up network if it didn't get automatically configured is to run the net-setup\
    \ script:\n\n# Code List 5: Running net-setup\n\n```\n# net-setup eth0\n```\n\n\
    net-setup will ask you some questions about your environment. When all is done,\
    \ you should have a working connection. Test your connection as stated. If tests\
    \ are successful, congratulations! You are now ready to install Gentoo. Skip the\
    \ rest of this section and continue with the Disks. If your network doesn't work,\
    \ continue with Manual Configuration.\n\nAssuming you need to connect to the internet,\
    \ the Installation CD (any version) has made things easy for you using PoE. use\
    \ the provided adsl-setup to configure your network. You will be prompted for\
    \ the ethernet device that is connected to your adsl modem, your username and\
    \ password, the IPs of DNS servers and if you need a basic firewall.\n\n# Code\
    \ List 6: Using PoE\n\n```\n# adsl-setup\n# adsl-start\n```\n\nIf something goes\
    \ wrong, double-check that you correctly typed your username and password by looking\
    \ /etc/ppp/pap-secrets or /etc/ppp/chap-secrets make sure you are using the right\
    \ ethernet device. If your ethernet device doesn't exist, you will have to load\
    \ the appropriate network modules. In that case continue with Manual Configuration\
    \ as we explain how to load the appropriate network modules. If everything worked,\
    \ continue with the Disks.\n\n> Note: PPTP support is only available for x86\n\
    \nIf you need PPTP, you can use pppclient which is provided by your Installation\
    \ CDs. But first you need to make sure that your configuration is correct. Edit\
    \ /etc/ppp/pap-secrets or /etc/ppp/chap-secrets contains the correct username/password\
    \ combination:\n\n# Code List 7: Editing /etc/ppp/chap-secrets\n\n```\n# nano\
    \ -w /etc/ppp/chap-secrets\n```\n\nThen adjust /etc/ppp/options.ppt if necessary:\n\
    \n# Code List 8: Editing /etc/ppp/options.ppt\n\n```\n# nano -w /etc/ppp/options.ppt\n\
    ```\n\nWhen all is done, run pptp (along with the options set in options.ppt)\
    \ to connect to the server:\n\n# Code List 9: Connection to a dial-in server\n\
    \n```\n# pptp <server ip>\n```\n\n## 3.c. Manual Network Configuration\n\n###\
    \ Loading the Appropriate Network Modules\n\nWhen the Installation CD boots, it\
    \ tries to detect all your hardware devices and loads the appropriate kernel modules\
    \ (drivers) to support your hardware. In the vast majority of cases, it does a\
    \ very good job. However, in some cases, it may not auto-load the kernel modules\
    \ you need.\n\nIf net-setup or add-setup failed, it is possible that your network\
    \ card wasn't found immediately. This means you may have to load the appropriate\
    \ kernel modules manually.\n\nTo find out which kernel modules provide networking,\
    \ use ls:\n\n# Code List 10: Searching for provided modules\n\n```\n# ls /lib/modules/$(uname\
    \ -r)/kernel/drivers/net\n```\n\nIf you find a driver for your network card, use\
    \ modprobe to load the kernel module:\n\n# Code List 11: Using modprobe to load\
    \ a kernel module\n(As an example, we load the pcnet32 module)\n```\n# modprobe\
    \ pcnet32\n```\n\nTo check if your network card is detected, use ifconfig. A detected\
    \ network card would result in something like this:\n\n# Code List 12: Testing\
    \ availability of your network card, successful\n\n```\n# ifconfig eth0\nlink\
    \ encap:Ethernet Hardware:00:00:00:00:00:00\nBROADCAST MULTICAST MTU:1500 Metric:1\n\
    RX packets:0 dropped:0 overruns:0 frame:0\nTX packets:0 dropped:0 overruns:0 carrier:0\n\
    collisions:0 queue:0\nRX bytes:0 (0.0 b) TX bytes:0 (0.0 b)\n```\n\nIf you receive\
    \ the error then the network card is not detected:\n\n# Code List 13: Testing\
    \ availability of your network card, failed\n\n```\n# ifconfig eth0\neth0: error\
    \ fetching interface information: Device not found\n```\n\nIf you have multiple\
    \ network cards in your system they are named eth0, eth1, etc. Make sure that\
    \ the network card you want to use works well and to use the correct name throughout\
    \ this document. We assume that the network card eth0 is used.\n"
