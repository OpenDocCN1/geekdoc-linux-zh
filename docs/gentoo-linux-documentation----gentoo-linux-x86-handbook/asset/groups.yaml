  - '[PAGE 31]


    *etc/fstab, etc.)


    /etc/fstab uses a special syntax. Every line consists of six fields, separated
    by whitespace(space), tabs or a mixture). Each field has its own

    meaning:


    +   - The first field shows the partition (described by the path to the device
    file)

    - The second field shows the mountpoint at which the partition should be mounted

    - The third field shows the filesystem used by the partition

    - The fourth field shows the options (used by mount when it comes to mount the
    partition). As every filesystem has its own options, users are encouraged to read
    the man page (mount for a listing). Multiple options are comma-separated.

    - The fifth field is used by dump to determine if the partition is dumped or not.
    You can easily generate this as 0 (zero).

    - The sixth field is used by fsck to determine the order in which filesystems
    should be checked if the system wasn''t down properly. The root filesystem should
    have 1 while the rest should have 2 (or 0 if a fsck check isn'' necessary).


    The default /etc/fstab provided by Gentoo is not a valid file, so start none (or
    your favorite) to create your /etc/fstab:


    ```

    Code List 1: Opening /etc/fstab

    # nano -w /etc/fstab

    ```


    Let us look at how we write the options for the /boot partition. This is an example,
    if your architecture doesn''t require a /boot partition (such as PPC machines),
    don''t copy it.


    In our x86 partitioning example /boot is the /dev/sda1, with ext2 as filesystem.
    It needs to be checked during boot, so we would

    write:


    ```

    Code List 2: An example /boot line for /etc/fstab

    /dev/sda1 /boot ext2 defaults 1 2

    ```


    Some users don''t want /boot partition to be mounted automatically to improve
    their system''s security. Those people should use defaults

    with noaos. This means you need to manually mount this partition time you want
    to use it.


    Now, to improve performance, users would want to add the noatime option as mountpoint,
    which is in a faster system since times aren''t registered (you don''t need those
    generally anyway):


    ```

    Code List 3: An improved /boot line for /etc/fstab

    /dev/sda1 /boot ext2 defaults,noatime 1 2

    ```


    If we continue with this, we would use with the following lines (for /boot / and
    the swap partition):


    ```

    Code List 4: Three /etc/fstab lines

    /dev/sda1 /boot ext2 defaults,noatime 1 2

    /dev/sda2 none swap 0 0

    /dev/sda3 / ext3 noatime 0 1

    ```


    To finish up, you should add a rule for /proc,tmpfs (required) and for your CD-ROM
    drive (and, if you have other partitions or drives, for those two):


    ```

    Code List 5: A full /etc/fstab example

    /dev/sda1 /boot ext2 defaults,noatime 1 2

    /dev/sda2 none swap 0 0

    /dev/sda3 / ext3 noatime 0 1


    none /proc proc defaults 0 0

    none /dev/sh tmpfs nodev,nosuid,noexec 0 0


    /dev/cdrom0 /mnt/cdrom auto noauto,user 0 0

    ```'
  - '[PAGE 32]


    auto make mount guise for the filesystem (recommended for removable media as they
    can be created with one of many filesystems) and user makes it possible for non-root
    users to mount the CD.


    Now use the above example to create /etc/fstab. If you are a SPARC-user, you should
    add the following line to your /etc/fstab too:


    ```

    Code Listing 6: Adding openprism filesystem to /etc/fstab

    none /proc/openprism openprism defaults 0 0

    ```


    Double-check your /etc/fstab, save and quit to continue.


    8.b. Networking Information


    Hostname, Domainname etc.


    One of the choices the user has to make is his/her PC. This can be quite easy,
    but lots of users are having difficulties finding the appropriate name for your
    Linux-pc. To speed things up, know that any name you choose can be changed afterwards.
    For all care, you can just call your system and domain hostnetwork.


    We use these values in the next examples. First we set the hostname:


    ```

    Code Listing 7: Setting the hostname

    # nano -w /etc/conf.d/hostname

    (Set the HOSTNAME variable to your hostname)

    HOSTNAME=ua

    ```


    Second we set the domainname:


    ```

    Code Listing 8: Setting the domainname

    # nano -w /etc/conf.d/domainname

    (Set the DNSDOMAIN variable to your domain name)

    DNSDOMAIN=hoomenetwork

    ```


    If you have a NIS domain (if you don''t know what that is, then you don''t have
    one), you need to define that one too:


    ```

    Code Listing 9: Setting the NIS domainname

    # nano -w /etc/conf.d/domainname

    (Set the NISDOMAIN variable to your NIS domain name)

    NISDOMAIN="my-nisdomain"

    ```


    Configuring your Network


    Before you get that "Hey, we''ve already athe-feeling, you should remember the
    networking you set up in the beginning of the Gentoo installation was just for
    the installation. Now you are going configuring for the Gentoo system permanently.


    More: Detailed information about networking, including advanced topics like bonding,
    bridging, 802.1Q VLANs or wireless networking is covered in the Gentoo Network
    Configuration section.


    All networking information is found in /etc/conf.d. It means a straightforward
    yet not intuitive system if you don''t know how to set up manually. But don''t
    fear, we''ll explain everything. A fully commented example covers many different
    configurations are available in /etc/conf.d/example.


    DHCP is used by default and does not require any configuration.

    If you need to configure your network connection either because you need specific
    DHCP options or because you do not use DHCP at all, /etc/conf.d/net with your
    favorite editor (nano is used in this example):'
  - '[PAGE 33]


    # Code List 10: Opening /etc/conf.d/net for editing


    # nano -w /etc/conf.d/net


    You will see the following file:


    # Code List 11: Default /etc/conf.d


    ```

    # This blank configuration will automatically use DHCP for any net.

    # scripts in /etc/init.d. To create a more complete configuration,

    # please review /etc/conf.d/net.example and save your configuration

    # in /etc/conf.d/net (this file is!);

    ```


    Enter your IP address, net and gateway, you need to set config_eth0 and routes_eth0:


    # Code List 12: Manually setting information for eth0


    ```

    config_eth0="192.168.0.2 netmask 255.255.255.0 brd 192.168.0.255"

    routes_eth0="default gw 192.168.0.1"

    ```


    To use DHCP and add specific options, define config_eth0 and dhcp_eth0:


    # Code List 13: Automatically obtaining an IP address for eth0


    ```

    config_eth0="dhcp"

    dhcp_eth0="nodns nontop persist"

    ```


    Please read /etc/conf.d/net.example for a list of all available options.


    If you have several network interfaces repeat the above steps for config_eth1,
    config_eth2, etc.


    Now save the configuration and exit to continue.


    Automatically Start Networking at Boot


    To have your network interfaces activated at boot, you need to add them to the
    default runlevel. If you have PCMCIA interfaces you should skip this as the PCMCIA
    interfaces are started by the PCMCIA script.


    # Code List 14: Adding net.eth0 to the default runlevel


    ```

    # rc-update add net.eth0 default

    ```


    If you have several network interfaces, you need to create the appropriate net.eth1,
    net.eth2 etc. inscripts for them. Use in this to do:


    # Code List 15: Creating inscripts


    ```

    # cd /etc/init.d

    # in -s net.eth0 net.eth1

    # rc-update add net.eth1 beth default

    ```


    Writing Down Network Information


    You need to inform Linux about your network. This is defined in /etc/hosts and
    helps in resolving hostname IP addresses for hosts that aren''t resolved by your
    nameserver. For instance, if your internal network consists of three PCs called
    jenny (192.168.0.5), benny (192.168.0.6) and tux (192.168.0.7) this system would
    open /etc/hosts and fill in the values:


    # Code List 16: Opening /etc/hosts


    # nano -w /etc/hosts'
