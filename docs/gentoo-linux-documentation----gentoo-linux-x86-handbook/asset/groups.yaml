    当你想要安装一个不可用的包时，你将收到此错误。这可能是为了安装一个你的用户可用的不同应用程序，或者等待该包可用。包被屏蔽是有的：


    - arch keyword 意味着该应用程序尚未经过充分测试，无法进入稳定分支。等几天时间它们就会回来。

    - arch keyword 或 ** keyword 意味着该应用程序在你的架构上无法运行。如果你认为该包运行良好，请在我们的 bugzilla 上提交一个
    bug。

