    # 4.d. Creating Filesystems


    # Introduction


    Now that your partitions are created, it is time to create a filesystem on them.
    If you don''t care about what filesystem to choose and are happy with what we
    use in this handbook, continue with Applying a Filesystem to a Partition. Otherwise
    read on learn about the available filesystems...


    Filesystems?


    The Linux kernel supports various filesystems. We will explain ext2, ReiserFS,
    XFS and JFS as these are the most used filesystems on Linux systems.


    ext2 is the true and only Linux filesystem that has metadata journaling, which
    means that ext2 check at startup can be quite time-consuming. Now there is quite
    a selection of new-generation journaled filesystems that can be checked for consistency
    quickly and are then greatly preferred over their non-journaled counterparts.
    Journaled filesystems prevent long delays when you boot your system and your happens
    to be in an inconsistent state.


    ext3 is the journal version of ext2, providing metadata journaling for fast recovery
    in addition to other enhanced modes like full and data journaling. ext3 is a very
    good and reliable filesystem. It has an additional hashed b-tree indexing option
    that enables fast file access without almost any slowdown. In short, ext3 is an
    excellent filesystem.


    ReiserFS is a B+-tree filesystem that has very good overall performance and greatly
    outperforms both ext2 and ext3 when dealing with small files (files less than
    4kb), by a factor of 10x+. ReiserFS is also solid and usable as both general-purpose
    filesystem and for extreme cases such as the creation of large filesystems, the
    use of many small files, large files and directories containing thousands of files.
    As kernel 2.4.18+...


    XFS is a filesystem with metadata journaling that comes with a robust feature-set
    and is optimized for scalability. We recommend using this on Linux systems with
    high-speed SCSI and/or fiber channel and an uninterrupted power supply. Because
    XFS aggressively caches data in RAM, do not take precautions when writing files
    to disk and there (a few of them) can lose a good deal of data if the system goes
    down unexpectedly.


    JFS is IBM''s high-performance journaling filesystem. It has recently become production-ready
    and hasn''t been a sufficient track record to comment positively negatively on
    its general stability at this point.


    Applying a Filesystem to a Partition


    To create a filesystem on a partition or volume, there are tools available for
    each possible filesystem:


    # Filesystem Command


    +   ext2

    mke2fs

    ext3

    mke2fs -j

    reiserfs

    mkeiserfs

    xfs

    mkmfs.xfs

    jfs

    mke2fs.jfs


    For instance, to have the boot partition (/dev/hd1 in our example) in ext2 and
    the root partition (/dev/hd3 in our example) in ext3 as in our example), you would
    use:


    ```

    Code Listing 12: Applying a filesystem on a partition

    ```'
