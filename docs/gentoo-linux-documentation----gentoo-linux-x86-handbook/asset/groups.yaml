    # Removing Software


    When you want to remove a software package from your system, use emerge --unmerge.
    This will tell Portage to remove all files installed by that from your system
    except the configuration files that you have altered after the installation. Leaving
    the configuration files allows you to continue working with the package if you
    ever decide to install it again.


    However, a big warning: Portage will not remove the package if it is required
    by another package. It will however warn you when you want to remove an important
    package that breaks your system if you unmerge it.


    # Code Listing 12: Removing gnumeric from the system


    ```

    # emerge --unmerge gnumeric

    ```


    When you remove a package from your system, the dependencies of that package that
    were installed automatically can be removed, use emerge --depclean functionality.
    We will talk about this later.


    # Updating your System


    To keep your system in perfect shape (and not to install the latest security updates)
    you need to update your system regularly. Since Portage only checks the entries
    in your Portage tree when your Portage tree is updated, you can update your system
    with emerge --update date. In the next example, we''ll use the --ask switch which
    will tell Portage to display the list of packages it wants to upgrade and ask
    if you want to continue:


    ![](img/c0231913cf632f51d9b75da531c717e6_47_0.png)'
  - '[PAGE 48]


    # Code List 13: Updating your system


    ```

    # emerge --update --ask world

    ```


    Portage will then search for newer version of the applications you have installed.
    However, it will only verify the versions of the applications you have explicitly
    installed -not the dependencies. If you want to update every single package on
    your system, add the --deep argument:


    # Code List 14: Updating your entire system


    ```

    # emerge --update --deep world

    ```


    Since security updates also happen in packages you have not explicitly installed
    on your system (but that are pulled in as dependencies of programs), it is recommended
    to run this command once a while.


    If you have altered any of USE flags you might lightly want to add --newuse as
    well. Portage will then verify if the change requires the installation of new
    packages or recompilation of these ones:


    # Code List 15: Performing a full update


    ```

    # emerge --update --newuse world

    ```


    Metapages


    Some packages in the Portage tree don''t have real content but are used to install
    a collection of packages. For instance, the kde package will install a complete
    KDE environment by pulling in various KDE-related packages as dependencies.


    If you ever want to remove a package from your system, running --remove on the
    package won''t have effect as the dependencies remain on system.


    Portage has the functionality to remove orphaned dependencies as well, since the
    availability of software is dynamically dependent when you need to update your
    entire system, including the new changes when changing USE flags. After you can
    run --deplean to remove the orphaned dependencies. When this is done, you need
    to rebuild the applications that were dynamically linked to the new-removed software
    tiles but don''t require them.


    All is handled with the following three commands:


    # Code List 16: Removing orphaned dependencies


    ```

    # emerge --depth --newuse world

    # emerge --deplean

    # revdep-rebuild

    ```


    revdep-rebuild is provided by the gentoolkit package; don''t forget to emerge
    it first:


    # Code List 17: Installing the gentoolkit package


    ```

    # emerge gentoolkit

    ```


    1.d. When Portage is Complaining...


    About SLOTs, Virtuals, Branches, Architectures and Profiles


    As stated before, Portage is powerful and supports many features that offer software
    management tools like. To understand this, we explain a few aspects of Portage
    without going into much detail.


    With different versions of a single package can coexist. While others tend to
    name their package to those versions (like freetype and type2) Portage uses a
    technology to call SLOTs. An ebb declares a SLOT for its system. Ebuilds with
    different slots can coexist on the same system. For instance, the freetype package
    builds with SLOT="1" and SLOT="2".


    There are also packages that provide the same functionality but are implemented
    differently. For instance, metalog, syslog, and syslog-ng are all system loggers.
    Applications that rely on the availability of "a system logger" cannot depend
    on, for instance, metalog, as the other system loggers'
- md: '

    are a good choice as any virtual: each system logger provides virtual/syslog so
    that applications can depend on virtual/syslog.


    Software in the Portage tree can reside in branches. By default your system only
    accepts Gentoo deabs. Most stable software, when committed, are added to the testing
    branch, meaning more testing needs to be done before it is marked as stable. Although
    you will see the ebabs for those software in the Portage tree, Portage will not
    update them before they are placed in the stable branch.


    Some ontology is only available for a few features. The software doesn''t work
    on the other architectures, or it needs more testing, or the developer that committed
    the software to the Portage tree is unable to verify if the package works on architectures.


    Each Gentoo installation adheres to a profile which contains, amongst other information,
    the list of packages that are required for a system to normally.


    ## Blocked Packages


