    \ | | Sends some iwpriv commands to the interface after scanning. See the iwpriv\
    \ man page for more details. |\n\n## 4. Defining network configuration by ESSID\n\
    \nSometimes, you might need IP when connecting to ESSID1 and need DHCP when connecting\
