    MD5 checksum and compare it with the MD5 checksum we provide (such as install-x86-minimal-2006.0.iso).
    You can check the MD5 checksum using the md5sum tool under Linux/Unix or md5sum
    for Windows.


    Another way to check the validity of the downloaded file is GnuPG to verify the
    cryptographic signature that you find (the file ending with .asc). Download the
    signature file and obtain the public key:


    # Code List 1: Obtaining the public key


    ```

    $ gpg --keyserver subkeys.pgp.net --recv-keys 170720578

    ```


    Now verify the signature:


    # Code List 2: Verify the cryptographic signature


    ```

    $ gpg --verify <signature file> <downloaded iso>

    ```


    To burn the downloaded ISO, you have to select raw-burning. This how is highly
    hardware-dependent. We will discuss discrecord and K3B; more information you can
    find here in Gentoo FAQ.


    +   - With Discrecord, use Select Tools > CD Burn. You can then locate your ISO
    file within the ''Image to Burn'' . Finally click start.

    - With K3B, select Tools > CD Burn


    Booting the Installation CD


    > Important: Read this section before continuing, you will probably not have the
    opportunity to read it before doing things later.


    Once you have installed your CD


    Now place the Installation in the CD-ROM drive (ready) and reboot. You should
    see a prompt. At this screen, you can hit Enter to begin the boot process with
    the default options, or boot the Installation with custom boot options by specifying
    a kernel followed by boot options and hitting Enter.


    Selecting a kernel? We provide several kernels on our Installation CDs. The default
    one is gentoo. Other kernels are for specific hardware and need the -nob variants
    which disable framebuffer.


    Below you find a short overview of the available kernels:


    | Kernel Description |

    nentoo Default 2.6 kernel with support for multiple CPUs |

    entoo-nob Same as gentoo but without framebuffer support |

    mentest86 Test your kernel RAM for errors |


    You can also provide other kernels. You can select them at will. The following
    list is the same as the one you receive when you press F2 at the bootscreen.


    # Code List 3: Options to pass to your kernel of choice


    +   - agpgart loads agpg (use if you have graphics problems,lockups)

    - acpi-on loads support for ACPI firmware'
  - '[PAGE 5]


    ```

    ide=nodma force disabling of malfunctioning IDE devices

    doscal scan-for service for PCI devices (some cards)

    pcmia disable firewalls in initifrd (for cdrom,etc)

    firewire disable keymap for non-usb keyboards

    cache=disable partition of id to ram, allows you

    to ummount /mnt/cdrom to mount cdrom

    detetub disable usb module load from initrd, inhibits

    dbhcp dhcp does not automatically start if not detected

    hotplug disable hotplugging service

    apic disable apic (if trying having hardware problems nci,sci,etc)

    lvm2 disable loading of LVM2 modules\allows you to partition the whole harddrive
    when your BIOS

    hdw-stroke allow root boot large harddrives

    nload=module,2,[...]

    disable disable loading of specific kernel modules

    ```


    Now your boot CD, select a kernel (if you are not happy with the default gentoo
    kernel) and boot options. As an example, we show you how to

    boot the kernel, with gentoo parameters:


    # Code Listing 4: Booting an Installation


    ```

    boot: gentoo opcmia

    ```


    You will be greeted with a boot screen and progress bar. If you are installing
    Gentoo on a system with a non-US keyboard, make sure you are

    pressing Alt-F7 to switch to verbose mode and handle the prompt. If no selection
    in 10 seconds (the US keyboard) will be

    accepted and the boot process will continue. Once the process completes, you will
    be automatically logged in to the "Gentoo Linux

    "root", the super user. You will have a root (\#) prompt on the current console
    and can also switch to consoles by Alt-F2, Alt-F3

    Alt-F4. Get back to the one you started on pressing Alt-F1.


    Now continue with Extra Hardware Configuration.


    Extra Hardware Configuration


    When the Installation CD boots, it tries to detect all hardware devices and load
    the appropriate kernel modules to support your hardware. In

    t vast majority of cases, it does a very good job. However, in some cases it may
    not auto-load the kernel modules you need. If the PCI

    auto-detection missed some of your system''s hardware, you will have to load the
    appropriate kernel modules manually.


    In the next example we try to load the 8139tomodule (support for certain kinds
    of network interfaces):


    # Code Listing 5: Loading kernel modules


    ```

    # modprobe 8139to

    ```


    If you need PCMCIA support, you should start the pcmia in script:


    # Code Listing 6: Starting the PCMCIA in script


    ```

    # /etc/init.d/pcmia start

    ```


    Optional: Tweaking Hard Disk Performance


    If you are an advanced user, you might want to tweak the IDE disk performance
    using hdparam. With the -t options you can test the

    performance of your disk (execute it several times to get a more precise impression):


    # Code Listing 7: Testing disk performance


    ```

    # hdparam -tT /dev/hda

    ```


    To tweak, you can use any of the following examples (or experiment yourself) which
    use /dev/hda as disk (substitute with your disk):


    # Code Listing 8: Tweaking hard disk performance'
- md: "\nActivate DMA: # hdparam -d 1 /dev/hda\nSafe Performance Options: # hdparam\
    \ -d 1 -A -1 -m 16 -u 1 -a 64 /dev/hda\n\n# Optional: User Accounts\n\nIf you\
    \ plan on giving other people access to your installation environment or you want\
