    ## 10. Rebooting the System


    Exit the environment and unmount all mounted partitions. Then type in that magical
    command you have been waiting for: reboot.


    # Code List 14: Unmounting all partitions and rebooting


    ```

    # exit

    cd /

    umount -f /mnt/gentoo/boot /mnt/gentoo/dev /mnt/gentoo/proc /mnt/gentoo

    reboot -f

    ```


    Of course, forget to remove the bootable CD, otherwise the CD will be booted again
    instead of your Gentoo system.


    Once rebooted in your Gentoo installation, finish up with Finalizing your Gentoo
    Installation.


    ## 11. Finalizing your Gentoo Installation


    ### 11.a. User Administration


    #### Adding a User for Daily Use


    Working as root on a Unix/Linux system is dangerous and should be avoided as much
    as possible. Therefore it is strongly recommended to add a user for day-to-day
    use.


    The groups you are member of define what activities the user can perform. The
    following table lists a number of important groups you might wish to use:


    | Group | Description |

    | :--- | :--- |

    | audio | be able to access the audio devices |

    | cdrom | be able to directly access optical devices |

    | floppy | be able to directly access floppy devices |

    | games | be able to play games |

    | port | be able to use --pretend as a normal user |

    | usb | be able to access USB devices |

    | plugdev | be able to mount and use pluggable devices such as cameras and USB
    sticks |

    | video | be able to access video hardware and doing hardware acceleration |

    | wheel | be able to use su |


    For instance, to create a user called john who is a member of the wheel, users
    and audio groups, log in as root (only root can create users) and run useradd:


    # Code Listing 1: Adding a user for day-to-day use


    ```

    Login: root

    Password: (Your root password)

    # useradd -m -G users,wheel,audio -s /bin/bash john

    # password john

    Password: (Enter the password for john)

    Re-enter password: (Re-enter the password to verify)

    ```


    If a user needs to perform some task as root, you can use su - to temporarily
    receive root privileges. Another way is to use the sudo package which is, if correctly
    configured, secure.


