  - '[PAGE 51]


    # The ideas behind USE-flags


    When you are using Gentou (or any other distribution, or even operating system
    for that) you make choices depending on the environment you are working with.
    A setup for a server differs from a setup for a workstation. A gaming workstation
    differs from a 3D rendering workstation.


    This is not only for choosing packages you want to install, but also what features
    a package should support. If you don''t need OpenGL, why would you installing
    OpenGL and OpenGL support in most of your packages? If you don''t want KDE, why
    would you both compiling with KDE-support if these packages work flawlessly without?


    To help users in deciding what to install/activate and what not, we do not alter
    his/her environment in any way. This forces the user to decide what they really
    want and use the Portage, or package management system, to make decisions.


    # Definition of a USE-flag


    Enter the USE-flags. Such a flag is a keyword that embodies support and dependency-information
    for a certain concept. If you define a USE-flag, Portage will know that you support
    the chosen keyword. Of course this also alters the dependency for a package.


    Let us take at a specific example: the kde keyword. If you do not have it in your
    VARIABLE, all packages that have optional KDE will be compiled without KDE support.
    All KDE dependency will be installed without installing the KDE libraries (as
    dependency). If you have defined kde keyword, those packages will be compiled
    with KDE support, and the KDE libraries will be installed as dependency.


    By correctly defining the keywords you will receive a system tailored to your
    needs.


    What USE-flags?


    There are two types of USE-flags: global and local USE-flags.


    +   - A global USE-flag is used by several packages, system-wide. This is what
    most people see as USE-flags.

    - A local USE-flag is used by a single package to make package-specific descriptions.


    A list of available global USE-flags can be found online or locally in /etc/portage/profiles/use.global.desc.


    A list of available local USE-flags can be found locally in /etc/portage/profiles/use.local.desc.


    2.b. Using USE-flags


    Declare prevent USE-flags


    In the hope that you understand the importance of USE-flags we will now inform
    you how to declare USE-flags. To make it easy for users to search and pick USE-flags,
    we already provide a default USE setting. This setting is a collection of USE-flags
    that we are commonly used by the Gentoo users. This default setting is declared
    in the make files of your profile.


    The profile system is linked to the /etc/make.profile link. Each profile works
    on top of another, larger profile, the end result is the sum of all. The top profile
    is the base profile (/usr/portage/profiles/base).


    Let us take a look at this default setting for 2004.3.


    ```

    Code List 1: Cumulative.default USE variable for the 2004.3 profile

    (This example is the sum of the settings in base, default-linux,

    default-linux/x86 and default-linux/x86/2004.3)

    use86 oss asm avx build-fonts ctype encode f77

    usekde sdl glip python gnome lib+ matt mad

    use mikmod mikft mrequrs nis obgovnis opennis pdfrib python qt

    quicktime release sdl spell svga truetype x xml znz xv xl*)

    ```


    As you can see, this variable contains quite a lot of keywords. Do not alter any
    make.files to declare the USE variable to your needs: changes in this file will
    be visible when you update!


    To change this default setting, you need add or remove keywords to the USE variable.
    This is done globally by defining the USE variable in /etc/make.conf. In this
    variable you can add the extra USE-flags you require, or remove the USE-flags
    you don''t want. This latter is done by prefixing the keyword with the minus sign
    (-


    For instance, to support KDE and Qt add support for ipad, the following USE can
    be defined in /etc/make.conf:


    ![](img/c0231913cf632f51d9b75da531c717e6_51_0.png)'
- md: "\nSometimes you want to declare a certain USE flag for (or a couple) of applications\
    \ but not system-wide. To accomplish this, you will need to create the /etc/portage/directory\
    \ (if it does not exist) and edit /etc/portage/package.use.\n\nFor instance, if\
    \ you don't want kerdb support globally but you do want it for mysql, you would:\n\
    \n```\nCode List 3: /etc/portage.use example\ndev-db/mysql kerdb\n```\n\nYou can\
    \ of course explicitly disable USE flags for a certain application. For instance,\
    \ if you don't want java support in PHP:\n\n```\nCode List 4: /etc/portage/package.use\
    \ 2nd example\ndev-php/php-java-\n```\n\n## Declare temporary USE-flags\n\nSometimes\
    \ you want to set a certain USE-setting only once. Instead of editing /etc/make.conf\
    \ twice (to do and undo the USE-changes) you can just declare the USE-variable\
    \ as environment variable. Remember, when you re-merge or update this application\
    \ (either explicitly or as part of a system update) your changes will be:\n\n\
    As an example we will temporarily remove java from the USE-setting during the\
    \ installation of mozilla.\n\n```\nCode List 5: Using USE as environment variable\n\
    USE=\"-java*\" emerge mozilla\n```\n\n## Automatic USE Flags\n\nAfter packages\
    \ are installed, installed USE flags will automatically be enabled for you if\
    \ you don't explicitly disable them. To view the list of packages with flags,\
    \ check /etc/make.profile.defaults and the use.defaults files of your profiles.\n\
    \n```\nCode List 6: A snippet from /etc/make.profile.defaults\ngnome gnome-base/gnome\n\
    gtk x11-libs/gtk+\ndqt x11-libs/qt\nkde kde-base/kdebase\nmotif x11-libs/motif\n\
    ```\n\n## Precedence\n\nOf course there is a certain precedence that has priority\
    \ over the USE setting. You don't want declare USE=\"-java\" only to see that\
    \ java is still used due to a setting that has a higher priority. For the USE\
    \ setting, is ordered by priority (first has lowest):\n\n1. Default USE setting\
    \ in the make.defaults files of your profile\n2. Inherited USE setting if a package\
    \ from profile.defaults is installed\n3. User-defined USE setting in /etc/make.conf\n\
    4. User-defined USE setting in /etc/portage/package.use\n5. User-defined USE setting\
    \ as environment variable\n\nTo view the final USE setting as seen by Portage,\
    \ run emerge --info. This will list all relevant variables (including the USE\
    \ variable) with the content used by Portage.\n\n```\nCode List 7: Running emerge\
    \ --info\n# emerge --info\n```\n\n## Adapting Your System to New USE Flags\n\n\
    If you have altered your USE flags and wish to update your entire system to use\
    \ the new USE flags, use emerge ----newuse option:\n\n```\n### Code Listing 8:\
    \ Rebuilding your entire system\n# emerge --update --deep --newuse\n```\n\nNext,\
    \ run Portage's declean to remove the conditional dependencies that were merged\
    \ on your \"old\" system but that have been obso by the new USE flags.\n\n**Warning:**\
    \ Running emerge --depclean is a dangerous operation and should be handled with\
    \ care. Double-check the provided list of \"obsolete\" packages to make sure it\
    \ doesn't remove packages you need. In the following example we add the -p switch\
    \ to declean list only the packages without removing them.\n\n```\n### Code Listing\
    \ 9: Removing obsolete packages\n# emerge --depclean\n```\n\nWhen declean has\
    \ finished, rundev-rebuild to rebuild the applications that are dynamically linked\
    \ against shared objects provided by possibly removed packages. revdev-rebuild\
    \ is part of the gentoolkit package; don't forget to emerge it.\n\n```\n### Code\
    \ Listing 10: Running revdev-rebuild\n# revdev-rebuild\n```\n\nWhen all is accomplished,\
    \ your system is using the new USE flag settings.\n\n### 2.c. Package specific\
    \ USE-flags\n\n**Viewing available USE-flags**\n\nLet us take the example of mozilla:\
    \ what USE-flags does it listen to? To find out, we merge with the --pretend and\
    \ --verbose options:\n\n```\n### Code Listing 11: Using the used USE-flags\n#\
    \ emerge --pretend --verbose mozilla\nThese are the packages that I would merge,\
    \ in order:\nCalculating dependencies ...done\n[build] R //www/mozilla-1.7.2-2\
    \ USE='crypt gnome java mozsvg ssl\ntruetype xtprint -xdap -ipv6 -lapad mozcalendar\
    \ -mozdevel -nozcompose\nnozoirc -moznall -nozoft -postgres -xineama 0 KB\n```\n\
    \nemerge isn't the only tool for this job. In fact, we have a dedicated to package\
    \ information called every query which resides in the gentoolkit package. First,\
    \ install gentoolkit\n\n```\n### Code Listing 12: Installing gentoolkit\n# emerge\
    \ gentoolkit\n```\n\nNow run use the arguments to view the USE-flags of a certain\
    \ package. For instance, for the gnumeric package:\n\n```\n### Code Listing 13:\
    \ Using query to view used USE-flags\n# query use gnumeric\n[ Colour : set theme\
    \ ]\n[ Legend\n- (U) Col 1 Current USE flags\n (I) Col 2 Installed with USE flags\
    \ ]\n```\n\n```\nU I [ Found these variables in : app-office/numeric-1.2\nlibda\
    \ : Adds Data Access (CORBA wrapper) support for gnumeric\ngomedeb : unknown\n\
    + + python : support/bindings for the Python language\n+ + bonobo : Adds support\
    \ for gnome-base/bonobo (Gnome CORBA interfaces)\n```\n\n## 3. Portage Features\n\
    \n### 3.a. Portage Features\n\nPortage has several additional features that make\
    \ the Gentoo experience even better. Many of these features rely software tools\
    \ to improve performance, reliability, security. To enable or disable Portage\
    \ features you can edit /etc/make.conf's FEATURES variable which contains the\
    \ feature keywords, separated by space. In some cases will also need to install\
    \ the additional tool to include the feature. Not all Portage supports are listed\
    \ here. For a full overview, please consult the make.conf page:\n\n```\nCode List\
    \ 1: Consulting the make.conf page\n$ man make.conf\n```\n\nTo find out WHAT FEATURES\
    \ are default, run emerge --info and search for the FEATURES variable or grep\
    \ it:\n\n```\nCode List 2: Finding out the FEATURES that already set\n$ emerge\
    \ --info | grep FEATURES\n```\n\n### 3.b. Distributing Compiling\n\n**Using distcc**\n\
    \ndistcc is a program to distribute compilations across several, not necessarily\
    \ identical, machines on a network. distcc sends all necessary information to\
    \ the available distcc servers (running distcc) to compile pieces of source code\
    \ for the client. The net result is a faster compilation. You can find more information\
    \ about distcc (and how to use it with Gentoo) in the Distcc Documentation.\n\n\
    **Installing distcc**\n\ndistcc ships with a graphical monitor to track when your\
    \ computer sending for compilation. If you use Gnome then put 'gnome' in your\
    \ USE variable. However if you don't use Gnome and still like to have you should\
    \ put 'gtk' in your USE variable.\n\n```\nCode List 3: Installing distcc\n# emerge\
    \ distcc\n```\n\n**Activating Portage Support**\n\nAdd this to the FEATURES variable\
    \ inside /etc/make.conf. Next, edit the MAKEOPTS to your liking. A known guideline\
    \ is to fill in '-X' with the number of CPUs that distcc runs (including the current\
    \ host) but might have better results with other numbers. Now run distcc and enter\
    \ the list of available distcc servers are 192.168.102 (the current host), 192.168.103\
    \ and 192.168.104 (two \"remote\" hosts):\n\n```\nCode List 4: Configuring distcc-daemons\n\
    # distcc-config --set-hosts \"192.168.102 192.168.103 192.168.104\"\n```\n\nDon't\
    \ forget to run the distcc daemon as well:\n\n```\nCode List 5: Starting the distccd\
    \ daemons\n# rc-update add distccd default\n# /etc/init.d/distccd start\n```\n\
    \n### 3.c. Caching Compilation\n\n**About ccache**\n\nccache is a fast compiler\
    \ cache. When you compile a program, it will cache intermediate results so that\
    \ whenever you recompile the program, the compilation time is greatly reduced.\
    \ In common compilations this can result in 5 to 10 times faster compilation.\
    \ If you are interested in the ins and outs of ccache, please visit the ccache\
    \ homepage.\n\n**Installing ccache**\n\nTo install ccache, run emerge ccache:\n\
    \n```\nCode List 6: Installing ccache\n# emerge ccache\n```\n\n**Activating Portage\
    \ Support**\n\nOpen /etc/make.conf and add ccache to the FEATURES variable. Next,\
    \ add a new variable called CCACHE_SIZE and add it to \"2G\":\n\n```\nCode List\
    \ 7: Editing CCCACHE_SIZE in /etc/make.conf\nCCACHE_SIZE=\"2G\"\n```\n\nTo check\
    \ if ccache functions, ask ccache to provide you with its statistics. Because\
    \ Portage uses a different ccache home directory, you need to set the CCACHE_DIR\
    \ variable as\n\n```\nCode List 8: Viewing cache statistics\n# CCACHE_DIR=/var/tmp/ccache\
    \ ccache -s\n```\n\nThe /var/tmp/ccache location is Portage default cache home\
    \ directory; if you want to alter this set the CCACHE_DIR variable in /etc/make.conf.\
    \ However, if you would run it, it would use the default location of ${HOME}/.ccache,\
    \ which is why you needed to set the CCACHE_DIR variable when asking for the (Portage)\
    \ cache statistics.\n\n**Using ccache for non-Portage Compiling**\n\nIf you would\
    \ like to use ccache for non-Portage compilations, add /usr/lib/ccache/bin to\
    \ the beginning of your PATH variable (before /usr/bin). This can be accomplished\
    \ by editing /etc/env/d00base, which is the environment file that defines the\
    \ PATH variable:\n\n```\nCode List 9: Editing /etc/env/d00base\nPATH=\"/usr/lib/ccache/bin:/opt/*\n\
    ```\n\n### 3.d. Binary Package Support\n\n**Creating Prepackages**\n\nPortage\
    \ supports the installation of preprint packages. Even though Gentoo does not\
    \ provide preprint packages by itself (except for the GRP snapshot) Portage can\
    \ be made fully aware of preprint packages.\n\nTo create a preprint package you\
    \ can use quickpkg if the package is already installed on your system, or use\
    \ the --buildpkg or --buildpkg-only options.\n\nIf you want to create preprint\
    \ packages for every single install, add buildpkg to the FEATURES variable.\n\n\
    More support for creating preprint package sets can be obtained with Catalyst.\
    \ For more information on catalyst please read the Catalyst Reference Manual and\
    \ Catalyst Frequently Asked Questions.\n\n**Installing Prepackages**\n\nAlthough\
    \ Gentoo does not provide one, you can create a repository where you store preprint\
    \ packages. If you want to use this repository, you need to make Portage aware\
    \ of it by having the PORTAGE_BINHOST variable point to it. For instance, if the\
    \ preprint packages are on\n"
  mdcn: "\n有时你只想为某个（或几个）应用程序声明特定的 USE flag，而不是全局范围。要实现这一点，你需要创建 `/etc/portage/` 目录（如果不存在）并编辑\
    \ `/etc/portage/package.use`。\n\n例如，如果你不想在全局启用 `kerdb` 支持，但想为 `mysql` 启用，你可以执行：\n\
    \n```\nCode List 3: /etc/portage.use example\ndev-db/mysql kerdb\n```\n\n当然，你可以显式地禁用某个应用程序的\
    \ USE flag。例如，如果你不想在 PHP 中支持 java：\n\n```\nCode List 4: /etc/portage/package.use\
    \ 2nd example\ndev-php/php-java-\n```\n\n## 声明临时 USE-flags\n\n有时你只想设置一次某个特定的 USE\
