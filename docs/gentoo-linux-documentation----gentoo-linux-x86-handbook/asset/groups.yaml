    8.c. System Information


    Root Password


    First we set the root password by typing:


    # Code Listing 21: Setting the root password


    ```

    # passwd

    ```


    If you want root to be able to log on through serial console, add tts/0 to /etc/security:


    # Code Listing 22: Adding tts/0 to /etc/security


    ```

    # echo "tts/0" >> /etc/secsecurity

    ```


    System Information


    Gentoo uses /etc/rc.conf for general, system-wide configuration. Open up /etc/rc.conf
    and enjoy all the comments in that file :


    # Code Listing 23: Opening /etc/rc.conf'
- md: '

    ```bash

    # nano -w /etc/rc.conf

    ```


    When you''re finished configuring /etc/rc.conf, save and exit.


    As you can see, this file is filled with comments to help you set up the necessary
    configuration variables. You can configure your system to use unicode and define
    your default editor and display manager (like gdm or kdm).


    Gentoo uses /etc/conf.d/keymaps to handle keyboard configuration. Edit it to configure
    your keyboard.


    Code List 24: Opening /etc/conf.d/keymaps


    ```bash

    # nano -w /etc/conf.d/keymaps

    ```


    Take care when using the KEYMAP variable. If you select the wrong KEYMAP, you
    will get weird results when typing on your keyboard.


    > Note: Users of USB-based SPARCS and SPARC might need to select an i386 keyboard
    (such as "us") instead of "sunkeymap". PPC uses x86 kernels on most systems. Users
    who are able to use ADB keymaps on boot to enable ADB keycod sendings in their
    kernel and have to set a mac/ppc keymap in /etc/conf.d/keymaps.


    When you''re finished configuring /etc/conf.d/keymaps, save and exit.


    Gentoo uses /etc/conf.d/clock to set clock options. Edit it to your needs.


    Code List 25: Opening /etc/conf.d/clock


    ```bash

    # nano -w /etc/conf.d/clock

    ```


    If your hardware is not using CLOCK, you need to add CLOCK="local" to the file.
    Otherwise you will notice some clock skew. Furthermore, Windows assumes that your
    hardware clock uses local time, so if you want to doable, you should set this
    variable appropriately, otherwise your clock will go crazy.


    When you''re finished configuring /etc/conf.d/clock, save and exit.


    If you are not installing Gentoo on IBM PPC64 hardware, continue with Installing
    Necessary System Tools.


    ## Configuring the Console


    > Note: The following section applies to the IBM PPC64 hardware platforms.


    If you are running Gentoo on IBM PPC64 hardware and using a virtual console you
    must uncomment the appropriate line in /etc/initittab for the virtual console
    to spawn a login prompt.


    Code List 26: Enabling hvc or hvs support in /etc/initstab


