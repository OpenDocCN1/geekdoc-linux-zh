    # A. Installing Gentoo


    # 1. About the Gentoo Installation


    I.a. Introduction


    Welcome!


    First of all, welcome to Gentoo. You are about to enter the world of choices and
    performance. Gentoo is about choices. When installing Gentoo, this is made clear
    several times -- you can choose how much you want to compile yourself, how to
    install Gentoo, system logger when want, etc.


    Gentoo is a fast, modern medium distribution with a clean and fresh design. Gentoo
    is built around free software and to hide from its users what is beneath the hood.
    Portage, the package maintenance system which Gentoo uses, is written in Python,
    meaning you can easily view and modify'
  - '[PAGE 2]


    the code Gentoo''s packaging system uses source code (although for precompiled
    packages is included too) and configuring Gentoo happens through regular updates.
    In text editors, nothing everywhere.


    It is important that you understand what makes Gentoo run. We try not to force
    you into anything that you don''t like. If you feel like we do, bugreport.


    How is the Installation Structured?


    The Gentoo Installation can be seen as a 10-step procedure, continuing to chapters
    2-11. Every step results in a certain state:


    +   * After step 1, your internet connection is ready to install Gentoo

    * After step 2, your hard disks are installed to house your Gentoo installation

    * After step 3, your installation environment is prepared and you are ready to
    choose into the new environment

    * After step 4, packages, which are all on the Gentoo installations, are installed

    * After step 5, you have compiled most of your Gentoo system configuration files

    * After step 7, you have written necessary tools

    * After step 8, necessary tools (which you can choose from a list) are installed

    * After step 9, your choice of bootloader is installed and configured and you
    are logged into your new Gentoo installation

    * After step 10, your Gentoo environment is ready to be deployed


    When you are given a choice, we try to explain the pros and cons of are. We will
    continue with a default choice, if by "Default": the others are marked by "Optional":
    Do not think that the default is what we recommend. It is however what we believe
    most users want.


    Sometimes you can choose an optional step. Steps are marked as "Optional": and
    are therefore not to install Gentoo. However, some optional steps are dependent
    on your decision you. We will tell you when this happens, when you make the decision,
    and right before the optional step is started.


    What are my Options?


    You can install Gentoo in many different ways. You can download and install from
    one of your Gentoo CDs, from an existing distribution, from a bootable CD (as
    Knops), from a networked environment, from a floppy disk, etc. This installation
    assumes that you are ready to install the latest version of each package. If you
    want to perform a network installation, you should read the Gentoo 2006.6 Handbooks


    Also note that, if you plan on using GRP (the Gentoo Reference Platform, a collection
    of prebuilt packages for immediate use after the Gentoo installation), you must
    follow the instructions in the Gentoo 2006.6 Handbooks.


    For the help on other installations, please read our Alternative Installation
    Guide. Gentoo Tips & Tricks document may be useful to read as well. If you feel
    that the current installation instructions are too elaborate, feel free to use
    our Quick Installation Guide available from Documentation Resources which has
    such a document.


    You also have several possibilities: you can compile your entire system from scratch
    or use a script to help you have your Gentoo environment up and running in no
    time. And of course you have intermediate solutions in when you don''t complete
    everything but start from a semi-ready system.


    Troubles?


    If you find a problem in the installation (or the installation details), please
    visit our bugtracking system if the bug is known. If not, create a bugreport for
    so we can take care of it. Do not be afraid of the developers who are assigned
    to (your) bugs -- they don''t eat people.


    Note that though, the document you are now reading is architecture-specific; it
    contains hints to other architectures as well. This is due to the fact that large
    parts of the Gentoo Handbook source code is common for all architectures (to avoid
    duplication of efforts and development of resources). We will try to keep this
    to a minimum to avoid confusion.


    If you are uncertain whether the problem is a user-problem (some error you made
    despite having reading the documentation carefully) or a software-problem (some
    error we made despite having the installation/documentation carefully) you are
    free to join gentoo on ire.freenet.net. Of course, you are otherwise welcome too
    :)


    If you have a question regarding Gentoo, check out our Frequently Asked Questions,
    available from the Gentoo Documentation. You can also view the FAQs on our forums.
    If you can''t find the answer there on #gentoo, our irc-channel on ire.freenet.net,
    yes of us are freaks who on IRC :)


