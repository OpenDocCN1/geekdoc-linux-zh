    # 简介


    在开始之前，我们首先列出在您的设备上成功安装 Gentoo 所需硬件要求。


    # 硬件要求


    | CPU | 要求 |

    | :--- | :--- |

    | CPU | i486 或更高版本 |

    | 内存 | 64 MB |

    | 磁盘空间 | 1.5 GB（不包括交换空间） |

    | 交换空间 | 至少 256 MB |


    ## 2.b. Gentoo 安装 CD


    ### 简介


    Gentoo CD 是可启动的光盘，包含一个自包含的 Gentoo 环境。它们允许你从光盘启动 Linux。在启动过程中，系统会检测你的硬件并加载相应的驱动程序。它们由
    Gentoo 开发人员维护。


    所有安装 CD 都允许你启动、设置网络、初始化分区并从互联网开始安装 Gentoo。我们目前提供两份安装 CD，它们都适用于安装 Gentoo，只要你使用的是可用软件包最新版本进行基于互联网的安装即可。


    **重要：** 如果你希望在没有网络连接的情况下安装 Gentoo，或者想使用提供的安装程序之一，请使用 Gentoo 2006.06 手册中规定的安装说明。


    我们目前提供的两份安装 CD：


    - *最小安装 CD（Minimal Installation CD）是一个小巧、直接的可启动 CD，其目的是启动系统、准备网络并继续进行 Gentoo 安装。*

    - *安装程序 LiveCD（Installer LiveCD）包含了安装 Gentoo 所需的所有内容。它提供了图形化和控制台安装程序，可以自动为你执行安装，或者提供适用于你架构的指令。*


    为了帮助判断需要哪种 CD，我们列出了每份安装 CD 的主要优缺点。


    ### Gentoo 的最小安装 CD


    最小安装版名为 i386-minimal.2006.0.iso，占用 49 MB 磁盘空间。你可以使用此安装 CD 安装 Gentoo，但必须始终保持网络连接可用。


    | 最小安装 CD | 优缺点 |

    | :--- | :--- |

    | | 下载量最小 |

    | | 不包含 stage3ball、不包含 Portage 快照、没有预构建的软件包，因此不适用于无线安装 |


    ### Gentoo 的安装程序 LiveCD


    Live CD 名为 livecd-i686-2006.0.2.iso，占用 97 MB。你可以使用此安装 CD 安装 Gentoo，并且可以在没有网络连接的情况下进行安装，以防你想要将
    Gentoo 安装到除当前安装机器之外的另一台 PC 上：


    #### 安装程序 LiveCD 优缺点


    - *包含你所需的所有内容。你可以在没有网络连接的情况下使用。*（优点）

    - 下载量巨大（缺点）


    ### Stage3 Tarball


    stage3ball 是一个包含最小 Gentoo 环境的归包，适用于按照主手册中的指令继续进行 Gentoo 安装。此前，Gentoo 手册描述了使用三个阶段之一进行安装。虽然
    Gentoo 仍然在使用 stage1 和 stage2 阶段，但官方安装程序使用的是 stage3ball。如果你感兴趣使用 stage1 或 stage2
    进行 Gentoo 安装，请阅读 Gentoo FAQ 中的“我如何使用 stage1 或 stage2 Tarball 安装 Gentoo？”


    Stage3 charballs 可以从 releases/x86/2006.0/stages/ 或其中一个官方 Gentoo 镜像下载，且 LiveCD
    上不提供。


    ## 2.c. 下载、刻录和启动 Gentoo 安装


    ### 下载和刻录安装 CD


    你选择了使用 Gentoo CD。我们首先将下载并刻录所选的安装 CD。我们之前讨论过多种安装 CD，但可以在哪里找到它们呢？


    如果你愿意，可以下载任何一个安装 CD，或者从某个镜像站下载软件包 CD（Packages CD）。安装 CD 位于 releases/x86/2006/installed。


    在这些目录下，你会找到 ISO 文件。这些是你可以写入 CD-R 光盘的小型镜像。


    如果你怀疑下载的文件已损坏，可以检查其 MD5 校验和，并与我们提供的 MD5 校验和（例如 install-x86-minimal-2006.0.iso）进行对比。你可以使用
    Linux/Unix 下的 md5sum 工具或 Windows 下的 md5sum 来检查 MD5 校验和。


    另一种检查下载文件有效性的方法是使用 GnuPG 验证你找到的加密签名（以 .asc 结尾的文件）。下载签名文件并获取公钥：


    #### 代码列表 1：获取公钥


    ```

    $ gpg --keyserver subkeys.pgp.net --recv-keys 170720578

    ```


    现在验证签名：


    #### 代码列表 2：验证加密签名


    ```

    $ gpg --verify <signature file> <downloaded iso>

    ```


    刻录下载的 ISO 时，必须选择“原始刻录”（raw-burning）。这高度取决于硬件。我们将讨论 Discrecord 和 K3B；更多信息你可以在 Gentoo
    FAQ 中找到。


    - 使用 Discrecord，选择 Select Tools > CD Burn。然后你可以在 ''Image to Burn'' 中找到你的 ISO 文件。最后点击开始刻。

    - 使用 K3B，选择 Tools > CD Burn。


    ### 启动安装 CD


    > **重要：** 在继续之前请阅读本节，你可能在稍后的操作中没有机会阅读它了。


    一旦你刻好了 CD，现在将安装盘放入 CD-ROM 驱动器（就绪）并重启。你应该看到一个提示。在此屏幕上，你可以按回车以默认选项开始启动过程，或者通过指定内核后跟启动选项并按回车以自定义启动选项启动安装。


    选择内核？我们在安装 CD 上提供了多个内核。默认的是 Gentoo。以下是内核列表：


    | 内核 | 描述 |

    | :--- | :--- |

    | default | 默认内核 |

    | acpi-on | 支持 ACPI |

    | video | 带帧缓冲区 |

    | lvm2 | 用于 LVM |

    | cdrom | 支持 cdrom |

    | hotplug | 支持热插拔 |


