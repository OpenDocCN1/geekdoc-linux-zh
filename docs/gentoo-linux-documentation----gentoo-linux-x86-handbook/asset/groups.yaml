    # 7. Configuring the Kernel


    7.a. Timezone


    You need to select your timezone so that your system knows where it is located.
    Look for your timezone in /usr/share/zoneinfo, then copy it to /etc/locale. Please
    use the /usr/share/zoneinfo/etc/GMT* names as they do not indicate the expected
    zones. For instance, GMT-8 is in fact GMT+8.


    ```

    Code Listing 1: Setting the timezone information


    # ls /usr/share/zoneinfo

    (Suppose you want to use GMT)

    # cp /usr/share/zoneinfo/GMT /etc/localtime

    ```


    7.b. Installing the Sources


    Choosing a Kernel


    The core around which all distributions are built is the Linux kernel. It is the
    layer between the user programs and your system hardware. Gentoo provides its
    users several possible kernel sources. A full list with description is available
    at the Gentoo Kernel Guide.


    For x86-based systems we have, another kernels, vanilla-sources (the default kernel
    source provided by the linux-kernel developers), gentoo-sources (kernel source
    patched with performance-enhancing features), ...


    Choose your kernel and install it using emerge. The USE=”oc" is necessary to avoid
    installing x-11 or other dependencies at this point. USE=”symink" is not necessary
    for a manual setup, but ensures proper correction of the /usr/src/linux symlink.


    ```

    Code Listing 2: Installing a kernel source


    # USE=”oc" emerge gentoo-sources

    ```


    When you look in /usr/src you will see a symlink pointing to your kernel source.
    In this, the installed kernel source points to gentoo-sources-2.6.12-10. Your
    version may be different, so keep this in mind.


    ```

    Code Listing 3: Viewing the kernel source symlink


    # ls -l /usr/src/linux

    lrwxrwxrwx 1 root root 12 Oct 13 11:04 /usr/src/linux-2.6.12-gentoo-r10

    ```


    Now is time to configure and build your kernel. You can use genkernel for this,
    which will build a generic kernel as used in the System Installation. We use the
    “manual” configuration first, as it is the best way to optimize your environment.


    If you want to continue manually with Default: Manual Configuration. If you want
    to use genkernel you should read Alternative: Using genkernel instead.


