    ## Understanding Network Terminology


    > Note: If you know your IP address, broadcast address, netmask and nameservers,
    then you can skip this section and continue with Using ifconfig and route.


    If all of the above fails, you will have to configure your network manually. This
    is not difficult at all. However, you will need to be familiar with network terminology,
    and you will be able to configure your network to your satisfaction. After reading,
    you will know what a gateway is, what servers are, how a broadcast address is
    and why you need nameservers.


    In a network, hosts are identified by their IP address (Internet Protocol address).
    Such an address is a combination of four numbers between 0 and 255. Well, at least
    that is how we perceive it. In reality, such an IP address consists of 32 bits
    (ones and zeros). Let''s view an example:


    # Code Listing 17: Example of an IP address


    | IP Address (numbers): | 192.168.0.2 | 11000000 10101000 00000010 |

    | IP Address (bits): | 192 | 168 | 2 |


    Such an IP address is unique to a host as far as all associative networks are
    concerned (i.e every host that you are able to reach must have a unique IP address).
    In order to distinguish between hosts inside and outside a network, the IP address
    is divided into two parts: the network part and the host part.


    The separation is with netmask, a connection of ones followed by a collection
    of zeros. The part of the IP that can be mapped on is the network-part, the other
    one is the host-part. As usual, the netmask can be written down as an IP-address.


    # Code Listing 18: Example of network/host separation


    | IP-address: | 192.168.0.2 | 11000000 10101000 00000010 |

    | Netmask: | 255.255.255.0 | 11111111 11111111 11111111 0 |

    | Network Host: | | |


    In other words, 192.168.0.1 is part of our network, 192.168.1.2 is not. The broadcast
    is an IP-address with the same network-part as our network, but with only one
    host-part. Every host on your network listens to this IP address. It is truly
    meant for broadcasting packets.


    To be able to surf on the internet, you must know which host is the gateway. Since
    it is a regular host, it has a IP address (for instance 192.168.0.1). We previously
    stated that each host has its own IP address. To be able to reach this host by
    a name (instead of an IP address) you need a service that translates a name (as
    google.org) to an IP address (as /etc/resolv.conf). Such a service is called DNS
    service. To use such service, you must define the nameserver in /etc/resolv.conf.
    In some cases, you may also serve as nameserver. Otherwise you will have to enter
    nameservers provided by your ISP. To summarise, you will need the following information
    before continuing:


    | Network | Example |

    | :--- | :--- |

    | Your IP address | 192.168.0.2 |

    | Netmask | 255.255.255.0 |

    | Broadcast | 192.168.0.255 |

    | Gateway | 192.168.0.1 |

    | Nameserver(s) | 8.8.8.8 |


    ## Using ifconfig


    Setting up your network consists of three steps. First we assign an IP address
    using ifconfig. Then we set routing up to the gateway. Then you will need to fill
    up by placing the nameserver in /etc/resolv.conf.


    To assign an IP address, consider your IP address, broadcast and netmask. Then
    execute the command, substituting IP_ADDR with your IP address, BROADCAST with
    your broadcast address and NETMASK with your netmask:


    # Code Listing 20: Using ifconfig


    ```

    # ifconfig eth0 $(IP_ADDR) broadcast $(BROADCAST) netmask $(NETMASK) up

    ```


    Now set up routing using route. Substitute GATEWAY with your gateway IP address:


    ```

    # Code Listing 21: Using route

    # route add default gw $(GATEWAY)

    ```


    Now open /etc/resolv.conf with your favorite editor (in instance, we use nano):


    ```

    # Code Listing 22: Creating /etc/resolv.conf

    # nano -w /etc/resolv.conf

    ```


    Now fill in your nameserver(s) using the following as a template. Make sure you
    substitute NAMESERVER1 and NAMESERVER2 with the appropriate addresses:


    ```

    Code Listing 23: /etc/resolv.conf template

    nameserver ${NAMESERVER1}

    nameserver ${NAMESERVER2}

    ```


    That''s not how you network it by picking some Internet server (like Google).
    If this works, congratulations then. You are now ready to install Gentoo. Continue
    with Preparing the Disks.


    # 4. Preparing the Disks


    ### 4.a. Introduction to Block Devices


    #### Block Devices


    We''ll take a look at disk-oriented partitions of Gentoo Linux and Linux in general,
    including Linux systems, partitions and block devices. Once you''re familiar with
    the ins and outs of disks and filesystems, you''ll be guided through the process
    of setting partitions and filesystems for your Gentoo Linux installation.


    To begin, we will introduce devices. The most block device is probably the one
    that represents the first DRIVE in a Linux system, /dev/sda. If your system uses
    SCSI or SATA devices, then your first hard drive would be /dev/sd.


    The block devices represent an abstract interface to the disk. Your programs can
    use these block devices to interact with your disk without worrying whether your
    drives are IDE, SCSI or something else. The program can manage the storage on
    the disk as a bunch of contiguous, randomly-512-byte blocks.


    #### Partitions


    Although it is theoretically possible to use a full disk to house your Linux,
    this is almost never done in practice. Instead, full block devices are split in
    smaller, more manageable block devices. On x86 systems, these are called partitions.


    Partitions are divided in three types: primary, extended and logical.


    A primary partition is the one that is stored in the MBR (master boot record).
    As an MBR is very small (512 bytes) only four primary partitions can be defined
    (for instance, /dev/sda1 to /dev/sda4).


    An extended partition is a special primary partition (meaning the extended partition
    must be one of the four primary partitions) No more partitions can be defined.
    But if one of those was four, it was brought to life to extend the formatting
    scheme without losing backward compatibility.


    A logical partition is inside the extended partition. These definitions aren''t
    placed inside the MBR, but are declared inside the extended partition.

