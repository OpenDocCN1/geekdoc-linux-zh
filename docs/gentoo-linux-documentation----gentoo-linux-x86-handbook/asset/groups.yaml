    When you want to install a package that is not available, you will receive this
    error. This might installing a different application that is available for your
    user or until the package is available. There is a reason why a package is masked:


    - arch keyword means that the application is not sufficiently tested to be in
    the stable branch. Wait a few days or they return.

    - arch keyword or * keyword means that the application does not work on your architecture.
    If you believe the package does work fine a bug at our bugzilla

    - missing keyword means that the package has not been installed on your architecture.
    Ask the Portage team to test the package or test it if you find your reports on
    bugzilla website.

    - package mask means that the package has been found corrupt, unstable or worse
    and has been deliberately marked as-not-use.

    - profile mask means that the package has been found unsuitable for your profile.
