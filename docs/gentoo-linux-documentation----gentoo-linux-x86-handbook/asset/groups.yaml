    Configuring the use variable


    USE is one of the most powerful features Gentoo provides to us. Several programs
    can be compiled with or without optional certain items. For instance, some programs
    can be compiled with gtk-support, or with qt-support. Others can be compiled with
    or without SSL support. Some programs can be compiled with framebuffer support
    (vga) instead of XI (X-server).


    Most distributions compile their packages with as much as possible, increasing
    the size of the programs and startup time, not to mention an enormous amount of
    dependencies. With Gentoo you can define what options a package should be compiled
    with. This is where USE comes in.


    In the USE variable you define keywords which are mapped onto option-classes.
    For instance, sdl will compile ssl-support in the programs that it - X will remove
    X-server support (the minus sign in front). gnome gtk-kde -qt will compile your
    programs with gnome (and kde) and not with (and qt) support, which you will need
    fully tuned for GNOME.


    The default settings are placed in the make.files of your profile. You will find
    default files in the directory /etc/make.profile points to all parent directories
    as. The default USE is the sum of all USE settings in all make.files. If you do
    adding the USE setting, it is added to the default list. If you remove it from
    /etc/makefile (by placing a minus sign in front of it) it is removed from the
    default list (if it was in the default list at all). After never anything except
    the /etc/make.profile directory; it gets overwritten when you update Portage!


    A full description of USE can be found in the second part of the Gentoo Handbook,
    USE flags. A full description on the available USE flags can be found on your
    system at /usr/portage/use.desc


    Code Listing 12: Viewing USE flags


    ```

    # less /usr/portage/profiles/use.desc

    (You can scroll using arrow keys, it is by pressing ''q'')

    ```


    As an example of using a USE setting for a KDE-based system with DVD, ALSA and
    CD Recording:


    Code Listing 13: Opening/etc/make.conf


    ```

    # nano -w /etc/make.conf

    ```


    Code Listing 14: USE setting


    ```

    USE="gtk-gnome kde dvd alsa cdr"

    ```


