  mdcn: "\n\n## Gentoo Linux x86 手册\n\nSven Vermeulen 作者\nRoy Marples 作者\nDaniel Robbins\
    \ 作者\nChris Houser 作者\nJerry Alexandratos 作者\nSeemann Kullen Gentoo x86 开发者\n\
    Tavis Ordway Gentoo Alpha 开发者\nJason Huebel Gentoo AMD64 开发者\nGuyy Martin Gentoo\
    \ HPPA 开发者\nPeter van den Abeele Gentoo PPC 开发者\nJoe Sellar Gentoo SPARC 开发者\n\
    John P. Davis 编写\nPierre-Henri Jondot 编写\nEric Stockridge 编写\nRaj Mangoldt 编写\n\
    Jungmin Seo 编写\nStoyan Zekov 编写\nJared Hudson 编写\nColin More 编写\nJorge Paulo 编写\n\
    Carl Anderson 编写\nJon Portny 编写\nZack Gilbard 编写\nJack Morgan 编写\nBenny Chuang\
    \ 编写\nErwin 编写\nJoshua Kismir 编写\nTobias Scherbaum 编写\nXavier Neves 编写\nGrant\
    \ Goodyear 审核者\nGerald A. Normandin Jr. 审核者\nDonnie Berkholz 审核者\nKen Nowak 审核者\n\
    Lars Weiler 贡献\n\n2006年3月31日更新\n\n目录：\n\n- * 安装 Gentoo\n在这一部分中，你将学习如何在你的系统上安装\
    \ Gentoo。\n  1. 关于 Gentoo Linux 安装\n     本章向你介绍了在本部分描述的安装方法。\n  2. 选择正确的介质\n \
    \    你可以通过多种方式安装 Gentoo。本章解释了如何通过通用安装 CD 安装 Gentoo 最小化安装，这也是可行的。\n  3. 配置你的网络\n\
    \     为了能够下载最新内容，你需要设置网络。\n  4. 准备磁盘\n     要安装 Gentoo，必须创建必要的分区。本章描述了如何为未来使用对磁盘分区。\n\
    \  5. 安装 Gentoo 安装文件\n     Gentoo 通过 stage3 归包运行。本章描述了我们如何提取 stage3 存档并配置 Portage。\n\
    \  6. 安装 Gentoo 基础系统\n     安装并配置 stage3 之后，最终就是你拥有了一个可用的 Gentoo 基础系统。本章解释了如何进入下一个阶段。\n\
    \  7. 配置内核\n     内核是每个发行版的核心。本章解释了如何配置你的内核。\n  8. 配置你的系统\n     你将编辑一些重要的配置文件。在本章中，你将获得这些文件的概述以及如何操作的说明。\n\
    \  9. 安装必要的系统工具\n     如前所述，Gentoo 关乎选择。在本章我们将选择并安装一些重要的工具。\n  10. 配置引导程序\n   \
    \  x86 架构存在多个引导程序。每一个引导程序都有自己的配置方法。我们将逐步介绍根据你的需求配置引导程序的过程。\n  11. 完成你的 Gentoo\
    \ 安装\n     你快完成了。我们将为你的系统创建一个（或多个）用户。\n  12. 接下来去哪里？\n     现在你有了 Gentoo 系统，但接下来是什么？\n\
    \n- * 使用 Gentoo\n学习如何使用 Gentoo，包括安装软件、修改变量、更改 Portage 行为。\n\n  1. Portage 简介\n\
    \     本章解释了维护系统上软件需要知道的“简单”步骤。\n\n  2. USE Flags\n     USE flags 是 Gentoo 一个非常重要的方面。在本章中，你将学习使用\
    \ USE flags 并理解 USE flags 如何与你的系统相互作用。\n\n  3. Portage 功能\n     本章讨论了 Portage\
    \ 的功能，例如对分布式缓存、ccache 等等的支持。\n\n  4. Initscripts\n     Gentoo 使用通用的脚本格式，其他功能允许依赖驱动的决策和\
    \ initscripts。本章解释了所有这些方面以及如何处理它们。\n\n  5. 环境变量\n     通过 Gentoo，你可以轻松地管理系统的环境变量。本章展示了如何做到这一点，以及使用的变量。\n\
    \n- * 使用 Portage\n“使用 Portage”部分对 Gentoo 的软件管理工具 Portage 提供了深度介绍。\n\n  1. 文件和目录\n\
    \     一旦你想了解 Gentoo 中的 Portage，你就需要知道它将文件和数据存储在何处。\n\n  2. 配置变量\n     Portage可以通过你可以在配置文件中或作为环境变量设置的各种变量进行完全配置。\n\
    \n  3. 混合软件分支\n     Gentoo 提供的软件分为几个分支，取决于稳定性和架构支持。“混合软件分支”会告知你这些分支可以如何配置，以及你如何单独地监督这种状况。\n\
    \n  4. 额外工具\n     Portage 自带了一些额外的工具，让你的 Gentoo 体验变得更好。继续阅读以发现如何使用 dispatch-config和其他工具。\n\
    \n  5. 偏离官方树\n     “偏离官方树”为你提供了一些关于如何使用 Portage 树、同步类别、注入包等的技巧和秘门。\n\n  6. Ebuild\
    \ 应用\n     在“Ebuild 应用”中，你将获知 Portage 在安装软件时采取的步骤，以及你可以如何执行此操作\n\n- * Gentoo 网络配置\n\
    关于 Gentoo 网络的全面指南。\n\n  1. 入门\n     基础指南将帮助你获取网络接口并在最常见的环境中运行。\n\n  2. 高级配置\n\
    \     在这里我们学习配置是如何工作的——在学习学习模块化网络之前你需要了解这些。\n\n  3. 模块化网络\n     Gentoo 提供了灵活的网络——这里将告诉你有关不同的\
    \ DHCP 客户端、设置绑定（bonding）、桥接（bridging）、VLAN 等。\n\n  4. 无线网络\n     无线网络并不简单。希望你能成功运行！\n\
    \n  5. 添加功能\n     如果你觉得很冒险，你可以添加功能\n  6. 网络管理\n\n## 关于 Gentoo 安装\n\n### 1. 简介\n\
    欢迎！\n首先，欢迎 Gentoo。\n\nGentoo 通过 stage3 存档运行。本章描述了我们如何提取 stage3 存档并配置 Portage。\n\
    \n安装并配置 stage3 之后，最终就是你拥有了一个可用的 Gentoo 基础系统。本章解释了如何进入下一个阶段。\n\n内核是每个发行版的核心。本章解释了如何配置你的内核。\n\
