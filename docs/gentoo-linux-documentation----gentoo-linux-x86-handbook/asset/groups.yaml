    fdisk is a popular and powerful tool to split your disk into partitions. Use fdisk
    on your disk (in our example, we use /dev/hda):


    # Code List 2: Starting fdisk


    ```

    # fdisk /dev/hda own```


    Once in fdisk, you''ll be greeted with a prompt that looks like this:


    # Code List 3: fdisk prompt


    ```

    Command (m for help):

    ```


    Type p to display your disk''s current partition configuration:


    # Code List 4: An example partition configuration


    ```

    Command (m for help): p


    Disk /dev/hda 240 heads, 63 sectors, 2184 cylinders

    Units = cylinders of 15120 * 512 bytes

    ```


    | Device Boot | Start | Blocks | System |

    | :--- | :--- | :--- | :--- |

    | /dev/hda1 | 1 | 105008+ | Linux |

