    \ Code Listing 9: override network settings per ESSID\n\n```\nconfig_ESSID1=\"\
    192.168.0.2/24 192.168.0.255\"\nroutes_ESSID1=\"dhcp\"\n\nconfig_ESSID2=\"dhcp\"\
    \nfallback_route_ESSID2=\"192.168.3.1/24\"\n\n# We can rename server and other\
    \ things\n# We do not override these unless it's not too to\ndns_server_ESSID1=\"\
    192.168.0.1 192.168.0.2\"\ndns_domain_ESSID1=\"domain.domain\"\ndns_search_ESSID1=\"\
    search.domain,search.domain\"\n\n# We override the MAC address of the Access Point\n\
    # This handy if you got different locations that have the same ESSID\nconfig_0011ee22334455*=\"\
    dhcp\"\ndhcpopt=\"10\"\nins_server_0011ee22334455*=\"192.168.0.2\"\n```\n\n##\
    \ 5. Adding Functionality\n\n### 5.a. Standard function hooks\n\nTwo functions\
    \ can be defined which will be called during the start/stop operations. The functions\
    \ are called with the interface name first so that one can control multiple adapters.\n\
    \nThe return value for the (preup) function should be 0 (success) to indicate\
    \ that configuration or deconfiguration of the interface can continue. If it returns\
    \ a non-zero value, then configuration will be aborted.\n\nThe return value for\
    \ the (postdown) function is ignored since there's nothing to do if it indicates\
    \ failure.\n\n# Code Listing 1: pre/post up examples\n\n```\npreup() {\n    #\
    \ Test for link on the interface prior to bringing up. This\n    # only works\
    \ on some adapters and requires the mi-diag\n    # package to be installed.\n\
    \    if ettool($FACE) 2>/dev/null grep -q 'no link'; then\n        warn \"No link\
    \ on $FACE; aborting configuration\"\n        return 1\n}\n\n# Remember to return\
    \ 0 on success\nreturn 0\n\npostdown() {\n    # The default in the script is test\
    \ for root and disallow\n    # interfaces in case. Note that if you specify a\n\
    \    # postdown() function will override that logic.\n    if [ -f /etc/fd ]; then\n\
    \        error \"root filesystem is network mounted - can't stop $FACE\"\n   \
    \     return 1\n    fi\n}\n\n# Remember to return 0 on success\nreturn 0\n\npostup()\
    \ {\n    # This function could be used, for example, to register with a\n    #\
    \ dynamic DNS service. Another possibility would be to\n    # send/receive mail\
    \ once the interface is brought up.\n    return 0\n}\n\npostdown() {\n    # This\
    \ function is mostly for completeness... I have never\n    # thought of anything\
    \ nifty to do with it\n    return 0\n}\n```\n\n### 5.b. Wireless Tools function\
    \ hooks\n\nNote: This will not work with WPA Supplicant - the $[ESSID] $[ESSIDVAR]\
    \ variables are available in the setup() function.\n\nTwo functions can be defined\
    \ which will be called during the associate function. The functions are called\
    \ with the interface name first so that one function can control multiple adapters.\n\
    \nThe return value for the (preassociate) function should be 0 (success) to indicate\
    \ that configuration or deconfiguration of the interface can continue. If it returns\
    \ a non-zero value, then configuration will be aborted.\n\nThe return value for\
    \ the (postassociate) function is ignored since there's nothing to do if it indicates\
    \ failure.\n\n$[ESSID] is set to set the ESSID of the AP you're connecting to.\
    \ $[ESSIDVAR] is $[ESSID] converted to variable name bash allows.\n\n# Code Listing\
    \ 2: pre/post association functions\n\n```\npreassociate() {\n    # The below\
    \ adds two configuration variables leap_user_ESSID\n    # and leap_pass_ESSID.\
    \ When they are both configured for the ESSID\n    # being connected to then we\
    \ run the CISCO LEAP script\n```\n"
  mdcn: "\n\n# 我们通过内联定义 ESSID 来使用除 1以外的 WEP 密钥\n# 在密钥前加 s: 表示它是 ASCII 密钥，否则为 HEX 密钥\n\
    # enc open 指定安全级别（最安全）\n# enc open restricted 指定安全级别（最不安全）\nkey_ESSID_eth0[1]\
    \ = \"your key [1] enc open\"\nkey_ESSID_eth0[1] = \"aaaa-bbbb-cccc-ddcc [1] enc\
    \ restricted\n\n# 以下内容仅在我们扫描可用接入点（AP）时生效\n# 有时当一个接入点可见时，我们需要\n# 定义一个优先的连接顺序\n\
    preferred_order=\"ESSID*2\"\n\n# 细调接入点选择\n\n你可以添加一些选项来微调你的接入点选择，也可以不添加。这些通常不是必须的。\n\
    \n你可以决定是否仅连接到首选接入点。默认情况下，如果所有尝试都失败且我们可以连接到未加密的接入点，可以通过 `associate_order` 变量来控制。以下是这些值及其控制方式的表格。\n\
    \n| 值 | 描述 |\n|---|---|\n| preferably |默认行为 |\n| forpreferred | 我们仅连接到首选列表中的 AP。如果在扫描中未找到这些\
    \ AP，我们将按照优先顺序尝试连接它们。 |\n| - | 不扫描 AP - 仅按顺序尝试连接每一个 AP |\n| forego | 等同于 preferred\
    \ + 连接到任何其他可用 AP |\n\n最后，我们可能有 `blacklist_aps`（黑名单）和 `unique_ap` 选择。`blacklist_aps`\
    \ 的工作方式类似于 `preferred_aps`。`unique_ap` 是一个是或否的值，用于判断第二个无线接口是否与第一个接口连接到同一个接入点。\n\
    \n# 代码列表 6：blacklist_aps 和 unique_ap 示例\n\n```\n# 有时你不想连接到某些接入点\nblacklist_aps=\"\
    ESSID*4\"\n\n# 如果你有多张无线卡，你可以设置是否允许\n# 允许它们都关联到同一个接入点\n# 值为 \"yes\" 和 \"no\"\n\
    # 默认是 \"yes\"\nunique_ap=\"*yes\"\n```\n\n# Ad-Hoc 主机模式\n\n如果你在管理模式下无法连接到任何接入点，你也可以将自己设置为\
    \ Ad-Hoc 节点\n\n# 代码列表 7：回退到 ad-hoc 模式\n\n```\nadhoc_essid_eth0=\"This Adhoc Node\"\
    \n```\n\n连接到 Ad-Hoc 网络或运行主机模式以成为接入点如何？这里有该部分的配置！你可能需要如所示指定 WEP 密钥。\n\n# 代码列表 8：示例\
    \ ad-hoc/master 配置\n\n```\n# 设置模式 - 可以是 managed（默认）、ad-hoc 或 master（主机）\n# 并非所有驱动程序都支持所有模式\n\
    mode_eth0=\"ad-hoc\"\n\n# 设置接口的 ESSID\n# 在管理模式下，这将强制接口尝试连接到\n# 指定 ESSID 而不是其他\n\
    essid_eth0=\"This Adhoc Node\"\n\n# 如果你不指定通道，我们将使用 3 通道\nchannel_eth0=\"*3\"\n\
    ```\n\n重要：以下内容节录自 NetBSD 文档中的 BSD wavelen 文档。共有 14 个可用通道：据介绍，1-11 通道适用于北美，11-13\
    \ 通道适用于大部分欧洲，10-13 通道适用于法国，第 14 通道适用于日本。如有疑问，请参考你的网卡或接入点的文档。确保你选择的通道与你的接入点（或 ad-hoc\
    \ 网络中的另一个通道）匹配。北美和大部分欧洲销售的网卡默认通道为 5，法国销售的网卡默认为 11，日本销售的网卡默认为 14。\n\n# 无线工具的故障排除\n\
    \n有一些变量可以帮助由于驱动或环境问题导致无线无法启动。以下是可以尝试的其他事项列表。\n\n| 变量 | 默认值 | 描述 |\n|---|---|---|\n\
    | iwconfig_eth0 | | 查看 iwconfig 手页了解如何设置 |\n| iwpriv_eth0 | | 查看 iwpriv 手页了解如何设置\
    \ |\n| sleep_scan_eth0 | 0 | 扫描之前的等待秒数。当驱动/固件需要时间之前 |\n| sleep_associate_eth0\
    \ | 5 | 接口关联接入点之前的等待秒数 |\n| associate_test_eth0 | MAC | 某些驱动在丢失或尝试关联时不会重置 MAC\
    \ 地址。某些驱动在丢失或尝试关联时不会重置质量级别。有效设置为 MAC, quality 和 all |\n| scan_mode_eth0 | | 某些驱动在扫描失败时必须处于\
    \ ad-hoc 模式 |\n| iwpriv_scan_eth0 | | 扫描后向接口发送一些 iwpriv 命令。更多详情查看 iwpriv 手页 |\n\
    \n## 4. 通过 ESSID 定义网络配置\n\n有时，连接到 ESSID1 时需要 IP，连接到 ESSID2 时需要 DHCP。事实上，大多数变量可以通过\
    \ ESSID 定义。做法如下：\n\n> 注意：如果你使用 WPA Supplicant 或 Wireless Tools，这将生效。\n\n> 重要：你需要咨询变量名称。\n\
    \n> 代码列表 9：按 ESSID 覆盖设置\n\n```\nconfig_ESSID1=\"192.168.0.2/24 192.168.0.255\"\
    \nroutes_ESSID1=\"dhcp\"\n\nconfig_ESSID2=\"dhcp\"\nfallback_route_ESSID2=\"192.168.3.1/24\"\
    \n\n# 我们可以重命名 server 和其他事项，除非\ndns_server_ESSID1=\"192.168.0.1 192.168.0.2\"\n\
    dns_domain_ESSID1=\"domain.domain\"\ndns_search_ESSID1=\"search.domain,search.domain\"\
    \n\n# 我们覆盖接入点的 MAC 地址\n# 如果你有具有相同 ESSID 的位置\nconfig_0011ee233455*=\"dhcp\"\ndhcpopt=\"\
    10\"\nins_server_0011ee233455*=\"192.168.0.2\"\n```\n\n## 5. 添加功能\n\n### 5.a.\
    \ 标准函数\n\n可以定义两个在启动/停止操作期间调用的函数。调用时先传入接口名称，以便控制多个适配器。\n\n`preup` 函数的返回值应该是 0（成功），表示接口的配置或去配置可以继续。如果返回非零值，则配置将中止。\n\
    \n`postdown` 函数的返回值将被忽略，因为如果失败无事可做。\n\n# 代码列表 1：pre/post up 示例\n\n```\npreup()\
    \ {\n    # 在启动之前测试接口连接。这\n    # 仅在某些适配器上工作，并且需要\n    # 安装 mi-diag 包。\n    if ettool($FACE)\
    \ 2>/dev/null grep -q 'no link'; then\n        warn \"No link on $FACE; aborting\
    \ configuration\"\n        return 1\n}}\n\n# 成功时返回 0\nreturn 0\n\npostdown() {\n\
    \    # 脚本默认是检查 root 并禁止\n    # 接口情况。注意如果你指定了\n    # postdown() 函数将覆盖该逻辑。\n   \
    \ if [ -f /etc/fd ]; then\n        error \"root filesystem is network mounted\
    \ - can't stop $FACE\"\n        return 1\n    fi\n}\n\n# 成功时返回 0\nreturn 0\n\n\
    postup() {\n    # 这个函数可以用于，例如向动态 DNS\n    # 服务注册。另一种可能性是在接口\n    # 启动后发送/接收邮件。\n\
    \    return 0\n}\n\npostdown() {\n    # 这个函数主要是为了完整性……我从未\n    # 想过用它做什么有趣的事\n\
    \    return 0\n}\n```\n\n### 5.b. 无线工具函数钩\n\n注意：这与 WPA Supplicant 不兼容——$[ESSID]\
    \ $[ESSIDVAR] 变量在 `setup()` 函数中可用。\n\n可以定义两个在 `associate` 函数期间调用的函数。调用时先传入接口名称，以便一个函数控制多个适配器。\n\
    \n`preassociate` 函数的返回值应该是 0（成功），表示接口的配置或去配置可以继续。如果返回非零值，则配置将中止。\n\n`postassociate`\
    \ 函数的返回值将被忽略，因为如果失败无事可做。\n\n$[ID] 用于设置你连接的 AP 的 ESSID。$[ESSIDVAR] 是将 $[ESSID]\
    \ 转换为 bash 允许的变量名。\n\n# 代码列表 2：pre/post 关联函数\n\n```\npreassociate() {\n    # 以下添加两个配置变量\
    \ leap_user_ESSID\n    # 和 leap_pass_ESSID。当它们为正在连接的\n    # ESSID 都配置了配置时，我们运行\
    \ CISCO LEAP 脚本\n```\n\n"
