    ### Alternative: Using genkernel


    If you are reading this section, you have chosen to use our genkernel script to
    configure your kernel for you. Now that your kernel source is installed, it is
    time to compile your kernel using genkernel script to automatically build a kernel
    for you. genkernel works by configuring a kernel identically to the way our Installation
    CD is configured. This means that when you build, your system will generally detect
    all hardware at boot, just like our Installation CD does. Because genkernel doesn''t
    require any manual configuration, it is an ideal solution for users who may not
    comfortable owning owning own kernels. Now let''s see how to use genkernel. First,
    emerge genkernel:


    **# Code List 16: Emerging genkernel**


    ```

    # emerge genkernel

    ```


    Next, if you are going to configure a 2.6 kernel, copy over the kernel used by
    the Installation CD to the location where genkernel looks for the default configuration:


    **# Code List 17: Copying over the Installation CD kernel**


    ```

    (Only do if you are going to configure a 2.6 kernel)

    # zcat /proc/config.gz > /usr/share/genkernel/x86/kernel-2.6

    ```


    Now, compile your kernel by running genkernel. Be aware, as genkernel compiles
    a kernel that supports almost all hardware, this compilation will take a while
    to finish!


    Note, if your boot partition doesn''t use ext2 or ext3 as filesystem you might
    need to manually configure your kernel using genkernel --config and add support
    for your filesystem in the kernel (i.e. not as a module). Users of EXT2 or LVM2
    probably want to add -ext2 or -lvm2 as argument.


    **# Code List 18: Running genkernel**


    ```

    # kernel all

    ```


    Once genkernel completes, a kernel, full set of modules and root disk (initrd)
    will be created. We will use the kernel and initrd when configuring a boot later
    in this document. Write down the names of the kernel and initrd as you will need
    it when writing the boot configuration file. The initrd will start immediately
    after booting to perform hardware autodetect (just like on the Installation CD)
    before your "real" system starts up.


    **# Code List 19: Checking the created kernel name and initrd**


    ```

    # ls /boot/initramfs*

    ```


    Now, let''s perform one more step to get your system like the Installation CD
    -- enable coldplug. When the initrd detects hardware is needed to boot your system,
    coldplug detects everything else. To emerge and enable coldplug, type the following:


    **# Code List 20: Emerging and enabling coldplug**


    ```

    # emerge coldplug

    # rc-update add coldplug boot

    ```


