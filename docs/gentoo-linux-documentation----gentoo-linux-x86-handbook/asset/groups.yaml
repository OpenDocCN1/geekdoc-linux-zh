    # 3. Portage Features


    3.a. Portage Features


    Portage has several additional features that make the Gentoo experience even better.
    Many of these features rely on carry software tools to improve performance, reliability,
    security, ...


    To enable or disable Portage features you can edit /etc/make.conf''s FEATURES
    variable which contains the feature keywords, separated by space. In some cases
    you will also need to install the additional tool to include the feature relies.


    Not all Portage supports are listed here. For a full overview, please consult
    the make.conf man page:


    # Code List 1: Consulting the make.conf man page


    ```

    $ man make.conf

    ```


    To find out WHAT FEATURES are default set, run emerge --info and search for the
    FEATURES variable or grep it out:


    # Code List 2: Finding out the FEATURES that are already set


    ```

    $ emerge --info | grep FEATURES

    ```


    3.b. Distributing Compiling


    Using distcc


    distcc is a program to distribute compilations across several, not necessarily
    identical, machines on a network. The distcc sends all necessary information to
    the available distcc servers (running distcc) to compile pieces of source code
    for the client. The net result is a faster compilation time.


    You can find more information about distcc (and how to use it with Gentoo) in
    the Gentoo Distcc Documentation.


    Installing distcc


    distcc ships with a graphical monitor to track when your computer is sending for
    compilation. If you use Gnome then put ''gnome'' in your USE variable. However
    if you don''t use Gnome and still like to have the monitor then you should put
    ''gtk'' in your USE variable.


    # Code List 3: Installing distcc


    ```

    # emerge distcc

    ```


    Activating Portage Support


    Add this to the FEATURES variable inside /etc/make.conf. Next, edit the MAKEOPTS
    to your liking. A known guideline is to fill in ''-X'' with the number of CPUs
    that distcc runs (including the current host) but you might have better results
    with other numbers.


    Now run distcc and enter the list of available distcc servers. For a simple example
    assume that we are using the available Distcc servers are 192.168.1.102 (the current
    host), 192.168.1.103 and 192.168.1.104 (two "remote" hosts):


    # Code List 4: Configuring distcc-daemons


    ```

    # distcc-config --set-hosts "192.168.1.102 192.168.1.103 192.168.1.104"

    ```


    Don''t forget to run the distcc daemon as well:


    # Code List 5: Starting the distcded daemons


    ```

    # rc-update add distccd default

    # /etc/init.d/distccd start

    ```


    3.c. Caching Compilation'
