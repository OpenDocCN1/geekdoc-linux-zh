    - ADSL 用户应继续使用：PoE\n- PPTP 用户应继续使用：PPTP\n\n如果没有自动配置网络，最简单的方法是运行 `net-setup` 脚本：\n\
    \n# 代码列表 5：运行 net-setup\n\n```\n# net-setup eth0\n```\n\n`net-setup` 会向您询问一些关于环境的问题。完成后，您应该有一个工作的连接。按照说明测试您的连接。如果测试成功，恭喜！您现在可以安装\
    \ Gentoo 了。跳过本节其余部分继续操作磁盘。如果您的网络不起工作，请继续手动配置。\n\n假设您需要连接互联网，安装 CD（任何版本）已通过 PoE\
    \ 让事情变得简单。使用提供的 `adsl-setup` 配置您的网络。系统会提示您连接到 ADSL 调制器的以太网设备、用户名和密码、DNS 服务器的 IP\
    \ 以及您是否需要基础防火墙。\n\n# 代码列表 6：使用 PoE\n\n```\n# adsl-setup\n# adsl-start\n```\n\n\
    如果出现问题，请通过 `/etc/ppp/pap-secrets` 或 `/etc/ppp/chap-secrets` 检查用户名和密码输入是否正确。确保使用了正确的以太网设备。如果以太网设备不存在，将必须加载正确的网络模块。在这种情况下，请继续手动配置，我们将说明如何加载正确的网络模块。如果一切正常，继续操作磁盘。\n\
    \n> 注意：PPTP 支持仅适用于 x86\n\n如果您需要 PPTP，可以使用安装 CD 提供的 `pppclient`。但首先您需要确保您的配置是正确的。编辑\
    \ `/etc/ppp/pap-secrets` 或 `/etc/ppp/chap-secrets` 以包含正确的用户名/密码组合：\n\n# 代码列表 7：编辑\
    \ /etc/ppp/chap-secrets\n\n```\n# nano -w /etc/ppp/chap-secrets\n```\n\n然后根据需要调整\
