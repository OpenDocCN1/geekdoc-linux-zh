    \n# 3. 配置网络\n\n## 3.a. 自动网络检测\n\n也许直接就能用？\n\n如果您的系统连接到带有 DHCP 服务器的以太网，很有可能您的网络配置已经自动为您设置好了。如果是这样，您应该能够利用安装\
