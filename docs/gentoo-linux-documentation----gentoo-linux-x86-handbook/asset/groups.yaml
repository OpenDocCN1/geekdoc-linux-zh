    For instance, if you don''t want kerdb support globally but you do want it for
    mysql, you would:


    ```

    Code List 3: /etc/portage.use example

    dev-db/mysql kerdb

    ```


    You can of course explicitly disable USE flags for a certain application. For
    instance, if you don''t want java support in PHP:


    ```

    Code List 4: /etc/portage/package.use 2nd example

    dev-php/php-java

    ```


    Declare temporary USE-flags


    Sometimes you want to set a certain USE-setting only once. Instead of editing
    /etc/make.conf twice (to do and undo the USE-changes) you can just declare the
    USE-variable as environment variable. Remember, when you re-merge or update this
    application (either explicitly or as part of a system update) your changes will
    be:


    As an example we will temporarily remove java from the USE-setting during the
    installation of mozilla.


    ```

    Code List 5: Using USE as environment variable

    USE="-java* emerge mozilla

    ```


    Automatic USE Flags


    After packages are installed, installed USE flags will automatically be enabled
    for you if you don''t explicitly disable them. To view the list of packages with
    flags, check /etc/make.profile.defaults and the use.defaults files of your profiles.


    ```

    Code List 6: A snippet from /etc/make.profile.defaults

    gnome gnome-base/gnome

    gtk x11-libs/gtk+

    dqt x11-libs/qt

    kde kde-base/kdebase

    motif x11-libs/motif

    ```


    Precedence


    Of course there is a certain precedence that has priority over the USE setting.
    You don''t want declare USE="-java" only to see that java is still used due to
    a setting that has a higher priority. For the USE setting, is ordered by priority
    (first has lowest):


    +   1. Default USE setting in the make.defaults files of your profile

    2. Inherited USE setting if a package from profile.defaults is installed

    3. User-defined USE setting in /etc/make.conf

    4. User-defined USE setting in /etc/portage/package.use

    5. User-defined USE setting as environment variable


    To view the final USE setting as seen by Portage, run emerge --info. This will
    list all relevant variables (including the USE variable) with the content used
    by Portage.


    ```

    Code List 7: Running emerge --info

    # emerge --info

    ```


