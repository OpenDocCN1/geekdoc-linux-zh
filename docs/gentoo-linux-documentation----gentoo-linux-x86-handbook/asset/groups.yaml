    # Introduction


    Before we start, we first list hardware requirements to successfully install Gentoo
    on your box.


    # Hardware Requirements


    | CPU | Requirement |

    | :--- | :--- |

    | CPU | i486 or later |

    | Memory | 64 MB |

    | Diskspace | 1.5 GB (excluding swap space) |

    | Swap space | At least 256 MB |


    ## 2.b. The Gentoo Installation CDs


    ### Introduction


    The Gentoo CDs are bootable CDs which contain a self-sustained Gentoo environment.
    They allow you to boot Linux from the CD. During the boot process your hardware
    is detected and the appropriate drivers are loaded. They are maintained by Gentoo
    developers.


    All Installation CDs allow you to boot, set up networking, initialize your partitions
    and start installing Gentoo from the Internet. We currently provide two Installation
    CDs which are equally suitable to install Gentoo from, as long as you''re performing
    an Internet-based installation using the latest version of the available packages.


    **Important:** If you wish to install Gentoo without a working Internet connection
    or would like to use one of the provided installers, please use the installation
    instructions described in the Gentoo 2006.06 Handbook.


    The two Installation CDs that we currently provide:


    - *The Minimal Installation CD, a small, no-nonsense, bootable CD which purpose
    is to boot the system, prepare the networking and continue with the Gentoo installation.*

    - *The Installer LiveCD contains everything you need to install Gentoo. It provides
    a graphical, as well as console, installer which automatically carries out the
    installation for you, or the instructions for your architecture.*


    To help decide which CD you need, we have written down the major advantages and
    disadvantages of each Installation CD.


    ### Gentoo''s Minimal Installation CD


    The Minimal Installation is called i386-minimal.2006.0.iso and takes up 49 MB
    of diskspace. You can use this Installation CD to install Gentoo, always with
    a working Internet connection.


    | Minimal Installation CD | Pros and Cons |

    | :--- | :--- |

    | | Smallest download |

    | | Contains no stage3ball, no Portage snapshot, no prebuilt packages and is therefore
    not suitable for wireless installation |


    ### Gentoo''s Installer LiveCD


    The Live CD is called livecd-i686-2006.0.2.iso and takes up 97 MB. You can use
    this Installation CD to install Gentoo, and you can install it without a working
    Internet connection, just in case you want to bring Gentoo to another PC than
    the one you are currently installing Gentoo:


    #### Installer LiveCD Pros and Cons


    - *Contains everything you need. You can use it without a network connection.*
    (Pros)

    - Huge download (Cons)


    ### The Stage3 Tarball


    A stage3ball is an archive containing a minimal Gentoo environment, suitable to
    continue the Gentoo installation using the instructions in the main manual. Previously,
    the Gentoo Handbook described the installation using one of three stages. While
    Gentoo still uses stage1 and stage2 stage, the official installer uses stage3ball.
    If you are interested in performing a Gentoo installation using a stage1 or stage2,
    please read the Gentoo FAQ on How I Install Gentoo Using a Stage1 or Stage2 Tarball?


    Stage3 charballs can be downloaded from releases/x86/2006.0/stages/ or one of
    the Official Gentoo Mirrors and are not provided on the LiveCD.


    ## 2.c. Download, Burn and Boot a Gentoo Installation


    ### Downloading and Burning the Installation CDs


    You have chosen to use a Gentoo CD. We''ll first start by downloading and burning
    the chosen Installation CD. We previously discussed the several Installation CDs,
    but where can you find them?


    You can download any of the Installation CDs, if you want to, a Packages CD from
    one of mirrors. The Installation CDs are located in the releases/x86/2006/installed.


    Inside that you will find ISO-files. These are small images which you can write
    to a CD-R.


    In case you wonder the downloaded file is corrupted, or not, you can check its
    MD5 checksum and compare it with the MD5 checksum we provide (such as install-x86-minimal-2006.0.iso).
    You can check the MD5 checksum using the md5sum tool under Linux/Unix or md5sum
    for Windows.


    Another way to check the validity of the downloaded file is GnuPG to verify the
    cryptographic signature that you find (the file ending with .asc). Download the
    signature file and obtain the public key:


    #### Code List 1: Obtaining the public key


    ```

    $ gpg --keyserver subkeys.pgp.net --recv-keys 170720578

    ```


    Now verify the signature:


    #### Code List 2: Verify the cryptographic signature


    ```

    $ gpg --verify <signature file> <downloaded iso>

    ```


    To burn the downloaded ISO, you have to select raw-burning. This how is highly
    hardware-dependent. We will discuss discrecord and K3B; more information you can
    find here in Gentoo FAQ.


    - With Discrecord, use Select Tools > CD Burn. You can then locate your ISO file
    within the ''Image to Burn''. Finally click start.

    - With K3B, select Tools > CD Burn.


    ### Booting the Installation CD


    > **Important:** Read this section before continuing, you will probably not have
    the opportunity to read it before doing things later.


    Once you have installed your CD, now place the Installation in the CD-ROM drive
    (ready) and reboot. You should see a prompt. At this screen, you can hit Enter
    to begin the boot process with the default options, or boot the Installation with
    custom boot options by specifying a kernel followed by boot options and hitting
    Enter.


    Selecting a kernel? We provide several kernels on the Installation CDs. The default
    one is Gentoo. Below you find a list of kernels:


    | Kernel | Description |

    | :--- | :--- |

    | default | The default kernel |

    | acpi-on | support for ACPI |

    | video | with framebuffer |

    | lvm2 | for LVM |

    | cdrom | support for cdrom |

    | hotplug | support for hotplug |

    '
