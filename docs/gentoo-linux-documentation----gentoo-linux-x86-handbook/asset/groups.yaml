    # nano -w /etc/conf.d/domainname

    (Set the NISDOMAIN variable to your NIS domain name)

    NISDOMAIN="my-nisdomain"

    ```


    ### Configuring your Network


    Before you get that "Hey, we''ve already athe-feeling, you should remember the
    networking you set up in the beginning of the Gentoo installation was just for
    the installation. Now you are configuring for the Gentoo system permanently.


    More: Detailed information about networking, including advanced topics like bonding,
    bridging, 802.1Q VLANs or wireless is covered in the Gentoo Network Configuration
    section. All networking information is found in /etc/conf.d. It means a straightforward
    yet intuitive system if you don''t know how to set up manually. But don''t fear,
    we''ll explain everything. A fully commented example covers many different configurations
    available in /etc/conf.d/example.


    DHCP is used by default and does not require any configuration. If you need to
    configure your network either because you need specific options or because you
    do not use DHCP at all, /etc/conf.d/net with your favorite editor (nano is used
    in this example): you will see the following file:


    ```

    Code List 10: Opening /etc/conf.d/net for editing

    # nano -w /etc/conf.d/net

    ```


    ```

    Code List 11: Default

    # This blank configuration will automatically use any scripts in /etc/init.d.
    To create a more complete configuration, please review conf.d/net.example and
    save your configuration (this file is!);

    ```


    Enter your IP address and gateway, you need to set config_eth0 and routes_eth0:


    ```

    Code List 12: Manually setting information for eth0

    config_eth0="192.168.0.2 netmask 255.255.255.0 brd 192.168.0.255"

    routes_eth0="default gw 192.168.0.1"

    ```


    To use DHCP and add specific options, define config_eth0 and dhcp_eth0:


    ```

    Code List 13: Automatically obtaining an IP address for eth0

    config_eth0="dhcp"

    dhcp_eth0="none persist"

    ```


    Please read net.example for a list of all available options. If you have several
    network interfaces repeat the above steps for config_eth1, config_eth2, etc.


    Now save the configuration and exit.


    ### Automatically Start Networking at Boot


    To have your network interfaces activated at boot, you need to add them to the
    default runlevel. If you have PCMCIA interfaces you should skip this as they are
    started by the script.


    ```

    Code List 14: Adding net.eth0 to the default runlevel

    # rc-update add net.eth0 default

    ```


    If you have several network interfaces, you need to create the appropriate net.eth1,
    net.eth2 etc. scripts for them. Use this to do:


    ```

    Code List 15: Creating scripts

    # cd /etc/init.d

    # in -s net.eth0 net.eth1

    # rc-update add net.eth1 default

    ```


    ### Writing Down Network Information


    You need to inform Linux about your network. This is defined in /etc/hosts and
    helps in resolving hostname IP addresses for hosts that aren''t resolved by your
    nameserver. For instance, if your internal network consists of three PCs called
    Jenny (192.168.0.5), benny (192.168.0.6) and tux (192.168.0.7) this system would
    open /etc/hosts and fill in the values:


    ```

    Code List 16: Opening /etc/hosts

    # nano -w /etc/hosts

    ```


    ```

    Code Listing 17: Filling in the networking information

    127.0.0.1      localhost

    192.168.0.5    jenny.homenetwork jenny

    192.168.0.6    benny.homenetwork benny

    192.168.0.7    tux.homenetwork tux

    ```


    If your system is only one (or the nameserver handles all name resolution) a single
    line is sufficient. For instance, if you want to call


    ```

    Code Listing 18: /etc/hosts for lonely or fully integrated PCs

    127.0.0.1      localhost tux

    ```


    Save and edit the editor to commit.


    If you don''t have PCMCIA, you can now continue with System Information. PCMCIA-users
    should read the following topic on PCMCIA.


