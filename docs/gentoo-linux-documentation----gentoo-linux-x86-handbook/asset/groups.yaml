    ### 12.a. Documentation


    Congratulations! You now have a working Gentoo system. Where to go from here?
    What are your options now? What to explore first?


    Gentoo provides users with lots of possibilities, and therefore lots of documented
    (and less documented) features. You should take a look at the next part of the
    Handbook which explains how to keep your software up to date, how to install more
    software, USE flags, and how the Init system works.


    If you are interested in optimizing your system for desktop, check out Documentation
