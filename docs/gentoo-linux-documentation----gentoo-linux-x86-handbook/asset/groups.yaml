    # 3.c. Manual Network Configuration


    Loading the Appropriate Network Modules


    When the Installation CD boots, it tries to detect all your hardware devices loads
    the appropriate kernel modules (drivers) to support your hardware. In the vast
    majority of cases, it does a very good job. However, in some cases, it may not
    auto-load the kernel modules you need.


    If net-setup or add-setup failed, it is possible that your network card wasn''t
    found immediately. This means you may have to load the appropriate kernel modules
    manually.


    To find out which kernel modules provide for networking, use ls is:


    ```

    Code Listing 10: Searching for provided modules

    # ls /lib/modules/ uname -r /kernel/drivers/net

    ```


    If you find a driver for your network card, use modprobe to load the kernel module:


    ```

    Code Listing 11: Using modprobe to load a kernel module

    (As an example, we load the pcnet32 module)

    # modprobe pcnet32

    ```


    To check if your network card is detected, use ifconfig. A detected network card
    would result in something like this:


