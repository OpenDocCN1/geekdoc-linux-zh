    \ predown and postdown().\n\n## 6. Network Management\n\n### 6.a. Network Management\n\
    \nIf you and your computer are always on the move, you may not always have an\
    \ ethernet cable or plugged in or an access point available. We may want networking\
    \ to automatically work when an ethernet cable is plugged in or an access point\
    \ is found.\n\nHere you can find things that you manage.\n\n> Note: This document\
    \ only talks about ifplugd, but there are alternatives you can look into like\
    \ quickswitch.\n\n## 6.b. ifplugd\n\nifplugd is a daemon that starts and stops\
    \ interfaces when an ethernet is inserted or removed. It can also managing association\
    \ to Access Points or when new ones come into range.\n\n### Code Listing 1: Installing\
    \ ifplugd\n\n```bash\n# emerge sys-apps/ifplugd\n```\n\nConfiguration for ifplugd\
    \ is fairly straightforward forward too. The configuration file is held in /etc/conf.d/ifplugd.\
