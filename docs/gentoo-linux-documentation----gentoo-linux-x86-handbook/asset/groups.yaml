- md: "\n## Gentoo Linux x86 Handbook\n\nSven Vermeulen Author\nRoy Marples Author\n\
    Daniel Robbins Author\nChris Houser Author\nJerry Alexandratos Author\nSeemann\
    \ Kullen Gentoo x86 Developer\nTavis Ordway Gentoo Alpha Developer\nJason Huebel\
    \ Gentoo AMD64 Developer\nGuyy Martin Gentoo HPPA developer\nPeter van den Abeele\
    \ Gentoo PPC developer\nJoe Sellar Gentoo SPARC developer\nJohn P. Davis Editor\n\
    Pierre-Henri Jondot Editor\nEric Stockridge Editor\nRaj Mangoldt Editor\nJungmin\
    \ Seo Editor\nStoyan Zekov Editor\nJared Hudson Editor\nColin More Editor\nJorge\
    \ Paulo Editor\nCarl Anderson Editor\nJon Portny Editor\nZack Gilbard Editor\n\
    Jack Morgan Editor\nBenny Chuang Editor\nErwin Editor\nJoshua Kismir Editor\n\
    Tobias Scherbaum Editor\nXavier Neves Editor\nGrant Goodyear Reviewer\nGerald\
    \ A. Normandin Jr. Reviewer\nDonnie Berkholz Reviewer\nKen Nowak Reviewer\nLars\
    \ Weiler Contributor\n\nUpdated March 31, 2006\n\nContent:\n\n- * Installing Gentoo\n\
    In this part you learn how to install Gentoo on your system.\n  1. About the Gentoo\
    \ Linux Installation\n     This chapter introduces you to the installation approach\
    \ described in this part.\n  2. Choosing the Right Medium\n     You can install\
    \ Gentoo in many ways. This chapter explains how to install Gentoo minimal installation\
    \ through the Universal Installation CD is possible as well.\n  3. Configuring\
    \ your Network\n     To be able to download the latest, you will need to setup\
    \ networking.\n  4. Preparing the Disks\n     To install Gentoo you must create\
    \ the necessary partitions. This chapter describes how to partition a disk for\
    \ future use.\n  5. Installing the Gentoo Installation Files\n     Gentoo works\
    \ through a stage3 archive. This chapter describes how we extract the stage3 archive\
    \ and configure Portage.\n  6. Installing the Gentoo Base System\n     After installing\
    \ and configuring stage3, the eventual result is that you have a Gentoo base system\
    \ at your disposal. This chapter explains how to progress to to stadium.\n  7.\
    \ Configuring the Kernel\n     The kernel is the core of every distribution. This\
    \ chapter explains how to configure your kernel.\n  8. Configuring your system\n\
    \     You will edit some important configuration files. In this chapter you receive\
    \ an overview of these files and an explanation on how to proceed.\n  9. Installing\
    \ Necessary System Tools\n     As mentioned before, Gentoo is about choices. In\
    \ this chapter we will choose and install some important tools.\n  10. Configuring\
    \ the Bootloader\n     Several bootloaders exist for the x86 architecture. Each\
    \ one of them has its own way of configuration. We step through the process of\
    \ configuring bootloader to your needs.\n  11. Finalizing your Gentoo Installation\n\
    \  You're almost done. We'll create one (or more) users for your system.\n  12.\
    \ Where to go from?\n  Now have your Gentoo system, but what's next?\n\n- * Working\
    \ with Gentoo\nLearn how to work with Gentoo installing software, altering variables,\
    \ changing Portage behaviour.\n\n  1. A Portage Introduction\n  This chapter explains\
    \ the \"simple\" steps you need to know to maintain the software on your system.\n\
    \n  2. USE Flags\n  USE-flags are a very important aspect of Gentoo. In this chapter,\
    \ you learn to use USE-flags and understand how USE-flags interact with your system.\n\
    \n  3. Portage Features\n  This chapter discusses Portage features, such as support\
    \ for distributed caching, ccache and more.\n\n  4. Initscripts\n  Gentoo uses\
    \ a generic script format, which other features allows dependency-driven decisions\
    \ and initscripts. This chapter explains all these aspects and how to deal with\
    \ them.\n\n  5. Environment Variables\n  With Gentoo you can easily manage the\
    \ environment variables for your system. This chapter shows how to do that, and\
    \ also used variables.\n\n- * Working with Portage\n\"Working with Portage\" provides\
    \ an in-depth coverage of Portage, Gentoo's Software Management Tool.\n\n  1.\
    \ Files and Directories\n  Once you want to know Portage in Gentoo you need to\
    \ know where it stores its files and data.\n\n  2. Configuring Variables\n  Portage\
    \ is completely configurable through various variables you can set in the configuration\
    \ file or as environment variable.\n\n  3. Mixing Software Branches\n  Gentoo\
    \ provides software separated in several branches, depending on stability and\
    \ architectural support. \"Mixing Software Branches\" informs you how these branches\
    \ can be configured and how you can oversee this situation individually.\n\n \
    \ 4. Additional Tools\n  Portage comes with a few extra tools that make your Gentoo\
    \ experience even better. Read on discover how to use dispatch-config and other\
    \ tools.\n\n  5. Diverging from the Official Tree\n  \"Diverging from the Official\
    \ Tree\" gives you some tips and tricks on how to use your Portage tree, to synchronise\
    \ the categories, you inject packages and more.\n\n  6. The Ebuild Application\n\
    \  In \"The Ebuild Application\" you are informed about the steps Portage take\
    \ while installing software and how you can do this with\n\n- * Gentoo Network\
    \ Configuration\nA comprehensive guide to Networking in Gentoo.\n\n  1. Getting\
    \ Started\n  A basic guide gets you your network interface and running in most\
    \ common environments.\n\n  2. Advanced Configuration\n  Here we learn how the\
    \ configuration works - you need to know before we learn about modular networking.\n\
    \n  3. Modular Networking\n  Gentoo provides you flexible networking - here you\
    \ are told about different DHCP clients, setting up bonding, bridging, VLANs and\
    \ more.\n\n  4. Wireless Networking\n  Wireless isn't straight-forward. Hopefully\
    \ you'll get it working!\n\n  5. Adding Functionality\n  If you feel adventurous,\
    \ you can add functions\n  6. Network Management\n\n## About the Gentoo Installation\n\
