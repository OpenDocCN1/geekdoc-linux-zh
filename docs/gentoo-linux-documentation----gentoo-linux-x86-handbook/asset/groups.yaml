    192.168.0.2/24 brd 192.168.0.255\"\nconfig_eth0=\"192.168.0.2 mask 255.255.255.0\
    \ broadcast 192.168.0.255\"\n```\n\n# 3.c DHCP\n\nDHCP is a means of obtaining\
    \ information (IP address, DNS servers, Gateway, etc) from a DHCP server. This\
    \ means that if there is\nd DHCP server running on the network, you have to tell\
