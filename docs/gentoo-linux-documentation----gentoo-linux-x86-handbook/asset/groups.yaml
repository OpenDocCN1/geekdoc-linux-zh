    # 8. Configuring your System


    # 8.a. Filesystem Information


    What is fstab?


    Under Linux, all partitions used by the system must be listed in /etc/fstab. This
    file contains the mountpoints of those partitions (where they are seen in the
    file system structure), how they should be mounted and with special options (automatically
    or not, whether users can mount them'
- md: '

    *etc/fstab, etc.)


    /etc/fstab uses a special syntax. Every line consists of six fields, separated
    by whitespace(space, tabs or a mixture). Each field has its own meaning:


    - The first field shows the partition (described by the path to the device file)

    - The second field shows the mountpoint at which the partition should be mounted

    - The third field shows the filesystem used by the partition

    - The fourth field shows the options (used by mount when it comes to mount the
    partition). As every filesystem has its own options, users are encouraged to read
    the man page (mount for a listing). Multiple options are comma-separated.

    - The fifth field is used by dump to determine if the partition is dumped or not.
    You can easily generate this as 0 (zero).

    - The sixth field is used by fsck to determine the order in which filesystems
    should be checked if the system wasn''t down properly. The root filesystem should
    have 1 while the rest should have 2 (or 0 if a fsck check isn''t necessary).


    The default /etc/fstab provided by Gentoo is not a valid file, so start none (or
    your favorite) to create your /etc/fstab:


    ```

    Code List 1: Opening /etc/fstab

    # nano -w /etc/fstab

    ```


    Let us look at how we write the options for the /boot partition. This is an example,
    if your architecture doesn''t require a /boot partition (such as PPC machines),
    don''t copy it.


    In our x86 partitioning example /boot is the /dev/sda1, with ext2 as filesystem.
    It needs to be checked during boot, so we would write:


    ```

    Code List 2: An example /boot line for /etc/fstab

    /dev/sda1 /boot ext2 defaults 1 2

    ```


    Some users don''t want /boot partition to be mounted automatically to improve
    their system''s security. Those people should use defaults with noauto. This means
    you need to manually mount this partition every time you want to use it.


    Now, to improve performance, users would want to add the noatime option as mountpoint,
    which is in a faster system since times aren''t registered (you don''t need those
    generally anyway):


    ```

    Code List 3: An improved /boot line for /etc/fstab

    /dev/sda1 /boot ext2 defaults,noatime 1 2

    ```


    If we continue with this, we would use with the following lines (for /boot / and
    the swap partition):


    ```

    Code List 4: Three /etc/fstab lines

    /dev/sda1 /boot ext2 defaults,noatime 1 2

    /dev/sda2 none swap 0 0

    /dev/sda3 / ext3 noatime 0 1

    ```


    To finish up, you should add a rule for /proc,tmpfs (required) and for your CD-ROM
    drive (and, if you have other partitions or drives, for those two):


    ```

    Code List 5: A full /etc/fstab example

    /dev/sda1 /boot ext2 defaults,noatime 1 2

    /dev/sda2 none swap 0 0

    /dev/sda3 / ext3 noatime 0 1


    none /proc proc defaults 0 0

    none /proc/sh tmpfs nodev,nosuid,noexec 0 0


    /dev/cdrom0 /mnt/cdrom auto noauto,user 0 0

    ```


    auto make mount guise for the filesystem (recommended for removable media as they
    can be created with one of many filesystems) and user makes it possible for non-root
    users to mount the CD.


    Now use the above example to create /etc/fstab. If you are a SPARC-user, you should
    add the following line to your /etc/fstab too:


    ```

    Code Listing 6: Adding openprism filesystem to /etc/fstab

    none /proc/openprism openprism defaults 0 0

    ```


    Double-check your /etc/fstab, save and quit to continue.


    ## 8.b. Networking Information


    ###name, Domainname etc.


    One of the choices the user has to make is his/her PC. This can be quite easy,
    but lots of users are having difficulties finding the appropriate name for your
    Linux-pc. To speed things up, know that any name you choose can be changed afterwards.
    For all care, you can just call your system and domain hostnetwork.


    We use these values in the next examples. First we set the hostname:


    ```

    Code Listing 7: Setting the hostname

    # nano -w /etc/conf.d/hostname

    (Set the HOSTNAME variable to your hostname)

    HOSTNAME=ua

    ```


    Second we set the domainname:


    ```

    Code Listing 8: Setting the domainname

    # nano -w /etc/conf.d/domainname

    (Set the DNSDOMAIN variable to your domain name)

    DNSDOMAIN=hoomenetwork

    ```


    If you have a NIS domain (if you don''t know what that is, then you don''t have
    one), you need to define that one too:


