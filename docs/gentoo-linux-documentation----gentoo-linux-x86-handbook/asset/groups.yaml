    ```

    # mke2fs /dev/hda1

    # mke2fs -j /dev/hda3

    ```


    Create the filesystems on your newly created partitions.


    Activating the Swap Partition


    mkswap is the command that is to initialize swap partitions:


    # Code List 13: Creating a Swap signature


    ```

    # mkswap /dev/hda2

    ```


    To activate the swap partition, use swapon:


    # Code Listing 14: Activating the swap partition


