    USE 是 Gentoo 提供的最强大的功能之一。许多程序可以在不包含某些项的情况下编译。例如，某些程序可以带有 gtk-support 编译，或者带有 qt-support。其他可以在不带
    SSL 支持的情况下编译。某些程序可以带有 framebuffer support (vga) 而不是 X-server。


    大多数发行版尽可能多地编译包，这增加了程序的大小和启动时间，更不用说大量的依赖项。通过 Gentoo，你可以定义包应该带有哪些选项。这就是 USE 的用处。在
