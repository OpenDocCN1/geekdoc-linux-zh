    ftp://buildhost/gentoo:


    ```

    Code List 10: Setting PORTAGE_BINHOST in /etc/make.conf

    ```


    PORTAGE_BINHOST="*ftp://buildhost/gentoo*"

    When you want to install a prebuilt package, use the --binpkg option to the emerge
    command alongside the --usepkg option. The former tells emerge to download the
    prebuilt package from the previously defined server while the latter asks emerge
    to install the prebuilt package first before fetching the sources and compiling
    it.

    For instance, to install gnumeric with prebuilt packages:


    ```

    Code List 11: Installing the gnumeric prebuilt package

    ```


    ```

    # emerge --usepkg --binpkg gnumeric

    ```


    More information about emerge''s prebuilt options can be found in the emerge manager:


    ```

    Code List 12: Reading the emerge manager

    ```


    ```

    $ man emerge

    ```


    # 4. Initslevels


    ### 4.a. Runlevels


    #### Booting your System

    When you boot your system, you will notice lots of text floating by. If you pay
    close attention, you will notice this text is the same every time you reboot your
    system. The sequence of all actions is called the boot sequence and is (more or
    less) statically defined.

    First, your boot loader will load the kernel you have defined in the boot loader
    configuration into memory after it tells the CPU to run the kernel. When the kernel
    is loaded and run, it initializes all kernel-specific structures and tasks and
    starts the init process.

    This process makes sure that all filesystems (in /etc/fstab) are mounted and ready
    to use. Then it executes several scripts located in /etc/initd, which will start
    the services you need in order to have a successfully booted system.

    Finally, when all scripts are executed, it activates the terminals (in most cases
    the virtual consoles which are hidden beneath Alt-F1, Alt-F2...) attaching a special
    process called getty to. This process will then make sure you are able to log
    on these terminals by running login.


    #### Init Scripts

    Now init just executes the scripts in /etc/initd.random. Even it doesn''t run
    all scripts in /etc/initd.d, only the scripts it is told to execute. It decides
    which to execute by looking into /etc/runlevels.

    First, init runs all scripts in /etc/initd/ that have symbolic links inside /etc/runlevel/root.
    Usually, it will start the scripts in alphabetical order, but some scripts have
    dependency information in them, telling the system that another script must run
    before they can be started.

    When all /runlevel/default referenced scripts are executed, it continues with
    running the scripts that have a symbolic link to in them.


    #### How Init Works

    Of init does not decide that by itself. It needs a configuration file that specifies
    what actions need to be taken. This configuration file is in /etc/initab.

    If you remember the boot sequence we have just described, you will remember that
    init''s first action is to mount all filesystems. This is defined in the following
    line in /etc/initab


    ```

