    # 6. Emerge and Ebuild


    The ebuild is a lower level interface to the Portage system. Using this application
    you can execute specific actions against a given ebuild. For instance, you can
    perform the individual merging steps by yourself.


    Using ebuild for development purposes; more information about ebuild can therefore
    be found in the Developers Handbook. However, we will explain how ebuild instances
    are invoked by Portage during the merge process of a certain software title, and
    how to invoke the post-configuration steps some ebuild allows you to perform.


    # 6.b. Manually Installing Software


    # Fetching the Sources & Checksumming


    Whenever you invoke ebuild against a given ebuild, it will verify if the checksums
    of all involved files are equal to those given in the accompanying Manifest or
    files/digest-<name>-<version> file. This happens after the sources have been fetched.


    To fetch the sources using ebuild, run:


    ![](img/c0231913cf632f51d9b75da531c717e6_72_0.png)


    ```

    # ebuild path/to/ebuild fetch

    ```


    If the ebuild mdsum does not match the one listed in the Manifest file, or one
    of the downloaded sources doesn''t match listed in the files/digest-<package>
    file, you will receive an error similar to this:


    ![](img/c0231913cf632f51d9b75da531c717e6_72_1.png)


    ```

    !!! File is corrupt or incomplete. (Digests do not match)

    >>> our recorded digest: db20421ce35e854346e3ef19e6044e

    >>> your file''s digest: f10392b7c0b2bc463ad0964260a7d6

    ```


    The subsequent line will mention the erroneous file.


    If you are certain that the sources you''ve fetched and the ebuild itself are
    valid, you can regenerate the Manifest and digest-<package> file using your ebuild''s
    functionality:


    ![](img/c0231913cf632f51d9b75da531c717e6_72_2.png)


    ```

    # ebuild path/to/ebuild digest

    ```


    # Unpacking the Sources


    To unpack the sources in /var/tmp/portage (or any other directory you have specified
    in /etc/make.conf), run ebuild''s unpack functionality:


    ![](img/c0231913cf632f51d9b75da531c717e6_72_3.png)


    ```

    # ebuild path/to/ebuild unpack

    ```


    This will execute the ebuild''s src_unpack() function (which defaults to plain
    extraction if no src_unpack() is defined). It is also in this step that necessary
    patches are applied.


    # Compiling the Sources


    The next step in the merge process is to compile the sources. The ebuild''s compile
    functionality takes care of this step by executing the src_compile() function
    in the ebuild. This also includes the configure steps if appropriate.


    ![](img/c0231913cf632f51d9b75da531c717e6_72_4.png)


    ```

    # ebuild path/to/ebuild compile

    ```


    You are advised to edit the ebuild''s src_compile() function if you want to change
    the compilation instructions. However, you can also trick Portage'
  - '[PAGE 73]


    into believe that the ebuild application has finished the compile steps. Run all
    necessary commands yourself and create an empty file called

    compiled in the working directory:


    # Code Listing 6: Informing Portage about the finished compilation jobs


    ```

    # touch .compiled

    ```


    Installing the Files in a Temporary Location

    In the next step Portage will install all necessary files in a temporary location.
    This directory will contain all files that are to be merged on the\livesystem.
    You can accomplish this by running ebuild''s install functionality, which executes
    the ebuild''s src_install() function:


    # Code Listing 7: Installing the files


    ```

    # ebuild path/to/ebuild

    ```


    Merging the Files onto the Livesystem

    The final step is to merge all files onto the livesystem and register those in
    the Portage backend. ebuild''s this step "qmerge" and involves the

    following steps:


    +   - Execute the pkg_preinst() function if specified

    - Copy all files to the live livesystem

    - Register the files in the Portage backend

    - Execute the pkg_postinst() function if specified


    Run ebuild''s qmerge functionality to accomplish these steps:


    # Code Listing 8: Merging the ebuild on the livesystem


    ```

    # ebuild path/to/ebuild qmerge

    ```


    Cleaning the Temporary Directory

    Finally you can clean the temporary directory using ebuild''s clean functionality:


    # Code Listing 9: Cleaning the temporary directory


    ```

    # ebuild path/to/ebuild clean

    ```


    6.c. Additional Ebuild Features

    Running all Merge-related Commands

    Using ebuild''s merge functionality you can run the fetch, unpack, compile, install
    and qmerge commands in one:


    # Code Listing 10: Installing software


    ```

    # ebuild path/to/ebuild merge

    ```


    Performing Configuration Actions

    Some applications include instructions that configure the package further on your
    system. These instructions are interactive and are therefore

    not automatically executed. To run these configuration steps, which are enlisted
    in the ebuild''s (optional) config() function, use ebuild''s config


    # Code Listing 11: Configuring a package


    ```

    # ebuild path/to/ebuild config

    ```'
  - '[PAGE 74]


    # Building an (RPM) Package


    You can instruct Portage to create a binary package of an ebuild or an RPM file.
    Use ebuild''s package or rpm functionality to create archives. There are a few
    differences between these functionalities though:


    +   * The package functionality is a lot like the merge functionality, executing
    all necessary steps (fetch, unpack, compile) before creating the package

    * The rpm functionality builds an RPM package from the files created after having
    run build''s install functionality


    # Code Listing 12: Creating packages


    ```

    (For a Portage-compatible binary package)

    # ebuild path/to/ebuild package


    (For an RPM package)

    # ebuild path/to/ebuild rpm

    ```


    The created RPM file does not contain the ebuild''s dependency information.


    # 6.d. More Information


    Please consult the following man pages for more information about Portage, the
    ebuild application and the ebuild files:


    # Code Listing 13: Man pages


    ```

    $ portage     (Portage itself)

    $ emerge      (The emerge command)

    $ ebuild      (The ebuild command)

    $ man ebuild  (The ebuild file syntax)

    ```


    You will also find development-related information in the Developers Handbook.


    # D. Gentoo Network Configuration


    # 1. Getting Started


    1.a. Getting started


    > Note: This document assumes that you have correctly configured your kernel,
    its modules for your hardware and you know the interface name of your hardware.
    We also assume that you are configuring eth0, but it could be eth1, wlan0, etc.


    > Note: This document requires you running baslayout-1.11.11 or better.


    To get started your network card, you will need to tell the Gentoo RC system about
    it. This is done by creating a symbolic link from net.lo to net.eth0 in /etc/init.d.


    # Code Listing 1: Symlinking net.eth0 to net.lo


    ```

    # cd /etc/init.d

    # ln -s net.lo net.eth0

    ```


    Gentoo''s RC system now knows about interface. It also needs to know how to configure
    the new interface. All the network interfaces are configured in /etc/conf/net.d.
    Below is a sample configuration for DHCP and static addresses.


    # Code Listing 2: Examples for /etc/conf.d/net


    ```

    # For DHCP

    config_eth0=( "dhcp )


    # For static IP using CIDR notation

    config_eth0="192.168.0.7/24"

    routes_eth0=( "default via 192.168.0.1"

    ```'
