    wireless-tools supports nearly all cards and drivers, but it cannot connect to
    WPA Only Access Points.


    Warning: The linux-wlan-driver is not supported by baselayout at this. This is
    because linux-wlan-ng have their own setup and configuration which is completely
    different from everyone''s. The linux-wlan-ng developers are rumoured to be changing
    their setup over wireless-tools - when this happens you use linux-wlan-ng by baselayout.


    # 4.b. WPA Supplicant


    WPA Supplicant is a package that allows you to connect to WPA enabled access points.
    Its setup is fairly fluid as it is still in beta - however it works for the most
    part.


    ```

    Code List 1: Install wpa_supplicant


    # emerge net-wireless/wpa_supplicant

    ```


    Important: You have to configure CONFIG_PACKET enabled in your kernel for wpa_supplicant
    to work.


    Now we have to configure /etc/conf.d/net to set wpa_supplicant over wireless-tools
    (if wireless-tools is the default).


    ```

    Code List 2: configure /etc/conf.d/net for wpa_supplicant


    # Prefer wpa_supplicant over wireless-tools

    modules= "wpa_supplicant" *


    # It''s important that we tell wpa_supplicant which driver we should

    # be using as it''s not very good at guessing yet

    wpa_supplicant_eth0=~0dmasif

    ```


    Note: If you use the host-driver you will need to put the card in Managed mode
    before it can be used with wpa_supplicant correctly. You can use iwconfig eth0~managed
    to achieve this in /etc/conf.d/net.


    That was, simple! However, we have to configure wpa_supplicant itself which is
    a bit more tricky down how the Access Points are the that you are trying to connect
    to. The below example is taken and simplified from /etc/wpa_supplicant.example
    which shows with wpa_supplicant.


    ```

    Code List 3: example /etc/wpa_supplicant.conf


    # The below line not to be changed otherwise we refuse to work

    ctrl_interface=/var/run/wpa_supplicant


    # Ensure that only root can read the WPA configuration

    ctrl_interface_group=0


    # Let wpa_supplicant take care of scanning and AP selection

    ap_scan=1


    # Simple case: WPA-PSK, PSK as an ASCII passphrase, allow all valid ciphers

    network={\ssid="simple"

    psk="very secret passphrase"

    # The higher the priority the sooner we are matched

    prior=2

    }


    # Same as previous, request SSID-specific scanning (for APs that reject

    # broadcast: SSID)

    network={

    ssid="second ssid"

    scan=ssid0

    psk="very secret passphrase"

    prior=2

    }


    # Only WPA-PSK is used. Any valid cipher combination is

    network={

    ssid="example"

    proto=WPA

    ```'
