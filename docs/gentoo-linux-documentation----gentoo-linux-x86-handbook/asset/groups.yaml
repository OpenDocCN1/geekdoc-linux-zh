    ## 5.e. Configuring the Compile Options


    ### Introduction


    To optimize Gentoo, you can set a couple of variables that impact Portage behaviour.
    All these variables can be set as environment variables (using export) but isn''t
    permanent. To keep your settings, Portage provides you with /etc/make.conf, a
    configuration file for Portage. It is this file we will edit.


    Fire up your favorite editor (in this guide we use nano) so we can alter the variables
    we will discuss hereafter.


    # Code List 15: Opening/etc/make.conf


    ```bash

    # nano -w /mnt/gentoo/etc/make.conf

    ```


    As you noticed, the make.conf file is structured in a generic way: commented lines
    start with "#", other lines variables using the VARIABLE="content" syntax. The
    make.conf file uses the same syntax. Several of those variables are discussed
    next.


    ### CHOST


    The CHOST variable declares the target host for your project. This variable should
    be set to the correct value. Do not edit it as that may break your stage. If the
    CHOST variable does not look correct to you, you might be using the wrong stage3ball.


    ### CFLAGS and CXX


    The CFLAGS and CXX variables define the optimization flags for the gcc C and C++
    compiler respectively. Although we define generally here, you will only have maximum
    performance if you optimize these for each program separately. The reason for
    this is every program is different.


    In make.conf define the optimizations that will make your system responsive. General
    experience suggests settings in this file; too optimization can make programs
    behave bad (crash, or even worse, malfunction).


    We will not explain all possible options. If you want to know them, the GNU Online
    Manual(s) and the gcc info file (info gcc -- works on a working Linux system).
    The make.conf file also contains lots of examples and information; don''t forget
    to read it too.


    A first setting is the march= flag, which specifies the name of the target architecture.
    Possible options are defined in the make.conf example file (comments). For instance,
    for the x86 Architecture experience


    # Code List 16: Extracting the datestamp


    size-optimized, 0 (zero for no optimizations), 1, 2 or 3 for more speed-optimization
    flags; every class has the same flags as the one before, plus extras. For instance,
    for a class-2 optimization:


    # Code Listing 17: The GCC setting


    ```bash

    -O2

    ```


    Another popular optimization flag is -pipe (use pipes rather than temporary files
    for communication between the various stages of compilation).


    Mind that using -omit-frame-pointer (which doesn''t keep the frame pointer in
    a register for functions that don''t need one) might have serious repercussions
    on the debugging of applications!


    When you define the CFLAGS and CXX, you should combine some optimization flags,
    like in the following:


    # Code Listing 18: Defining the CFLAGS and CXX


    ```bash

    CFLAGS="-march=atlon-xp -pipe -O2"

    # AM64 users should use march=k8

    # EM64 users should use march=nocona

    CXX="$(CFLAGS)"

    # Use the same settings for both variables

    ```


    ### MAKEOPTS


    With MAKEOPTS define how many parallel compilations should occur when you install
    a package. A good choice is the number of CPUs in your system plus one, this isn''t
    always perfect.


    # Code Listing 19: MAKEOPTS for a regular, 1-CPU system


    ```bash

    MAKEOPTS="-j2"

    ```


    Ready, Set, Go!


    Update your /mnt/gentoo/etc/make.conf to your preference and save (nano users
    hit Ctrl-X). You are now ready to continue with Installing the Gentoo Base System.


    ## 6. Installing the Gentoo Base System


    ### 6.a. Chrooting


    #### Optional: Selecting Mirrors


    In order download source code it is recommended to select a fast mirror. Portage
    will look in your make.conf file for the GENTOO_MIRROR variable and use the mirrors
    listed there. You can turn to a mirror list and search for a mirror (or mirrors)
    choice (as those are most the fastest ones), or use a nice tool mirrorselect which
    provides you with a nice interface to select your mirrors.


    # Code List 1: Using mirrorselect for the GENTOO_MIRROR variable


    ```bash

    mirrorselect -i o >> /mnt/gentoo/etc/make.conf

    ```


    > **Warning:** Do not select any IPv6. Our stages currently do not support IPv6.


    A second important setting is the SYNC setting in make.conf. This variable handles
    the rsync server you want to use when updating your Portage tree (the collection
    of scripts).


    # Code List 2: Using mirrorselect for the SYNC variable


    ```bash

    mirrorselect -i o >> /mnt/gentoo/etc/make.conf

    ```


    After mirrorselect it is advisable to double-check the settings in /make.conf.


    ### DNS Info


    One thing remains to be done before enters the new environment and is copying
    the DNS information in /etc/resolv.conf. You need to ensure that networking still
    works after entering the new environment.


    # Code List 3: Copying etc/resolv.conf


    ```bash

    (The "L" option is needed to make sure we don''t copy a symbolic link)

    # cp -L /etc/resolv.conf /mnt/gentoo/etc/resolv.conf

    ```


    ### Mounting /proc /dev


    Mount the proc filesystem to allow the kernel-provided information within the
    chrooted environment and then bind the /dev filesystem.


    # Code List 4: Mounting /proc and dev


    ```bash

    # mount -t proc none /mnt/gentoo/proc

    # mount -o bind /mnt/gentoo/dev

    ```


    ### Entering the new environment


    Now that all are initialized and the base environment installed, we is time to
    enter our new environment by chrooting into it. This choosing is done in three
    steps. First we will copy the root from (the installation medium) to /mnt/gentoo
    (on your partitions). Then we create a new environment using env-update. Finally,
    we load those variables.


    # Code List 5: Chroot into the new environment


    ```bash

    # chroot /mnt/gentoo /bin/bash

    # env-update

    >> Regenerating /etc/ld.so.cache...

    # source /etc/profile

    # export PS1=$(chroot) $

    ```


    Congratulations! You are now inside your Gentoo Linux. Of course it is far from
    finished, which is why the installation still has some sections left


    6.b. Configuring Portage


    #### Updating the Portage tree


    You should update your Portage tree to the latest version. --sync does this for
    you.


    # Code List 6: Updating the Portage tree


    ```bash

    # emerge --sync

    (if you''re using a slow terminal like some framebuffers or a serial console,
    you can add the --quiet option to speed up this process)

    # emerge --sync --quiet

    ```


    If you are behind a firewall that blocks rsync, you can use env-websync which
    will download and install a Portage snapshot for you.


    If you are aware that a new Portage version is available and you should update
    Portage, you should ignore it. Portage will be updated later on the day installation.


    ### Choosing the Right Profile


    First, a small definition is in place.

    A profile is a building block for any Gentoo system. Not only does it specify
    default values for CHOST, FLAGS and other important variables, it is

