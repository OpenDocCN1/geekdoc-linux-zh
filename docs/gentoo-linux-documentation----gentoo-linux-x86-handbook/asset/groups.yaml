    # 4. Additional Portage Tools


    # 4.a. etc-update


    etc-update is a tool that aids in the merging of _cf0000_<name> files. It provides
    an interactive merging setup and can also auto-merge trivial changes, _cf0000_<name>
    files are generated by Portage when it wants to overwrite a file in a directory
    protected by the CONFIG_PROTECT variable.


    Running etc-update is pretty straightforward:


    # Code List 1: Running etc-update


    ```

    # etc-update

    ```


    After merging the straightforward changes, you will be prompted with a list of
    protected files that have an update waiting. At the bottom you are greeted by
    the following options:


    # Code List 2: etc-update options


    ```

    Please select a file to edit by the corresponding number.

    (-1 to exit) (-3 to auto merge all remaining files)

    (-5 to auto-merge AND use ''mv -i'');

    ```


    If you enter -1, etc-update will exit and discontinue any further changes. If
    you enter -3 or -5, all configuration files will be overwritten with'
  - '[PAGE 70]


    the newer versions. It is therefore very important to select the first configuration
    files that should not be automatically updated. This is simply a matter of entering
    the number listed to the left of that configuration file.


    As an example, we select the configuration file /etc/perf.conf:


    # Code Listing 3: Updating a specific configuration file


    ```

    Beginning of differences between /etc/perf.conf and /etc/._cfgg0000_perf.conf

    ---

    End of differences between /etc/perf.conf and /etc/._cfgg0000_perf.conf

    1) Replace original with update

    2) Update, keeping original as is

    3) Interactively merge original with update

    4) Show differences again

    ```


    You can see the differences between the two files. If you believe the updated
    configuration file can be used without problems, enter 1. If you believe the updated
    configuration file is incorrect, or does not provide any useful information, enter
    2. If you want to interactively update your current file, enter 3.


    There is no point in further elaborating the merging here. For completeness sake
    will list the possible commands you can use while interactively merging the two.
    You are greeted with two files (the original one, and the proposed new one) and
    a prompt at which you can enter one of the following commands:


    # Code Listing 4: Commands for the interactive merging


    ```

    ed    Edit both versions, each decorated with a header.

    eeb   Edit use both versions.

    elf   Edit use the left version.

    err   Edit use the right version.

    e    Edit a new version.

    i    Use the left version.

    r    Use the right version.

    s    Slightly include common lines.

    v    Verbosity include common lines.

    q    Quit.

    ```


    When you have finished updating the important configuration files, you can now
    automatically update all the other configuration files. etc-update will exit if
    it doesn''t find any more updatable configuration files.


    4.dispatch-conf


    Using dispatch-conf you are able to merge patches to your configuration files
    while keeping track of all changes. dispatch-conf stores the differences between
    the configuration files as patches or to keep the configuration files as-is, the
    new configuration file, edit the current one or merge the changes interactively.


    Like etc-update, you can use dispatch-conf which has some additional features:


    +   - Automatically update configuration files that only contains updates to comments

    -* Automatically merge configuration files which only differ in the amount of
    whitespace


    Make sure you edit /etc/dispatch-conf first and create the directory referenced
    by the archive-dir variable.


    For more information, check the dispatch-conf man page:


    # Code Listing 5: Reading the dispatch-conf man page


    ```

    $ dispatch-conf

    ```


    4.quickpkkg


    With quickpkkg you can create archives of the packages that are already merged
    on your system. These archives can be used as prebuilt packages. Running quickpkkg
    is straightforward: just add the names of the packages you want to archive.


    For instance, to archive curl, arts and procs:


    # Code Listing 6: Example quickpkage usage'
  - '[PAGE 71]


    ```

    # quickpkg curl arts procps

    ```


    The prebuilt packages are stored in $PKGDIR (/usr/portage/All by default). Symbolic
    links to these packages are placed in $PKGDIR/<category>.


    # 5. Diverting from the Official Tree


    5.a. Using a Portage Tree Subset


    Excluding Packages/Categories


    You can selectively update categories/packages and ignore the other categories/packages.
    We achieve this by having rsync exclude categories/packages during the emerge
    --sync step.


    You need to define the name of the file that contains the exclude patterns in
    the RSYNC_EXFROM variable in your /etc/make.conf.


    # Code List 1: Defining the exclude file in /etc/make.conf


    ```

    RSYNC_EXCLUDEFROM=/etc/portage/rsync_excludes

    ```


    # Code List 2: Excluding all games in /etc/portage/rsync_excludes


    ```

    games/*

    ```


    Note how this may lead to dependency issues since, allowed packages might depend
    on new but excluded packages.


    5.b. Adding Unofficial Builds


    You can use Portage to use builds that are not officially available through the
    Portage tree. Create a new directory (for instance /usr/portage) in which you
    store the 3rd-party builds. Use the same directory structure as the official Portage
    tree!


    Then define PORTDIR_OVERLAY in /etc/make.conf and point it to the self-defined
    directory. When you use Portage now, it will take builds into account without
    removing/overwriting those builds the next time you run emerge --sync.


    Working with Several Overlays


    For the powersusers who want several overlays, test packages before they hit the
    Portage tree or just to use unofficial builds from various sources, app-portage-gentookit-build
    package sync is, a tool to help you keep the Portage overlays up to date. Each
    repository should have a .rsyncsource file in the /etc/gentoo/configuration directory
    which contains the repository location, name, ID, etc.


    Suppose you have two additional repositories called java (for the in-development
    java builds) and entapps (for the applications developed in-house for your enterprise).
    You can update those repositories with the following command:


    # Code List 3: Using gensync to update a few repositories


    ```

    # gensync java entapps

    ```


    5.c. Non-Portage Maintained Software


    Using Portage with Self-Maintained Software


    In cases where you want to install and maintain software yourself without using
    Portage automate the process, even though Portage can provide the software titles.
    Known cases are kernel sources and nvidia drivers. You can configure Portage so
    it knows that a certain package is manually installed on your system. This process
    is called and supported by Portage through the /etc/portage/profile/package.provided


    For instance, if you want to inform Portage about vanilla-sources-2.6.11.6 which
    you''ve installed manually, add the following line to /etc/portage/profile/package.provided:


    # 6. The Build Application'
- md: "\n# 6. Emerge and Ebuild\n\nThe ebuild is a lower level interface to the Portage\
    \ system. Using this application you can execute specific actions against a given\
    \ ebuild. For instance, you can perform the individual merging steps by yourself.\n\
    \nUsing ebuild for development purposes; more information about ebuild can therefore\
    \ be found in the Developers Handbook. However, we will explain how ebuild instances\
    \ are invoked by Portage during the merge process of a certain software title,\
    \ and how to invoke the post-configuration steps some ebuild allows you to perform.\n\
    \n## 6.b. Manually Installing Software\n\n### Fetching the Sources & Checksumming\n\
    \nWhenever you invoke ebuild against a given ebuild, it will verify if the checksums\
    \ of all involved files are equal to those given in the accompanying Manifest\
    \ or files/digest-<name>-<version> file. This happens after the sources have been\
    \ fetched.\n\nTo fetch the sources using ebuild, run:\n\n![](img/c0231913cf632f51d9b75da531c717e6_72_0.png)\n\
    \n```\n# ebuild path/to/ebuild fetch\n```\n\nIf the ebuild mdsum does not match\
    \ the one listed in the Manifest file, or one of the downloaded sources doesn't\
    \ match listed in the files/digest-<package> file, you will receive an error similar\
    \ to this:\n\n![](img/c0231913cf632f51d9b75da531c717e6_72_1.png)\n\n```\n!!! File\
    \ is corrupt or incomplete. (Digests do not match)\n>>> our recorded digest: db20421ce35e854346e3ef19e6044e\n\
    >>> your file's digest: f10392b7c0b2bc463ad0964260a7d6\n```\n\nThe subsequent\
    \ line will mention the erroneous file.\n\nIf you are certain that the sources\
    \ you've fetched and the ebuild itself are valid, you can regenerate the Manifest\
    \ and digest-<package> file using your ebuild's functionality:\n\n![](img/c0231913cf632f51d9b75da531c717e6_72_2.png)\n\
    \n```\n# ebuild path/to/ebuild digest\n```\n\n### Unpacking the Sources\n\nTo\
    \ unpack the sources in /var/tmp/portage (or any other directory you have specified\
    \ in /etc/make.conf), run ebuild's unpack functionality:\n\n![](img/c0231913cf632f51d9b75da531c717e6_72_3.png)\n\
    \n```\n# ebuild path/to/ebuild unpack\n```\n\nThis will execute the ebuild's src_unpack()\
    \ function (which defaults to plain extraction if no src_unpack() is defined).\
    \ It is also in this step that necessary patches are applied.\n\n### Compiling\
    \ the Sources\n\nThe next step in the merge process is to compile the sources.\
    \ The ebuild's compile functionality takes care of this step by executing the\
    \ src_compile() function in the ebuild. This also includes the configure steps\
    \ if appropriate.\n\n![](img/c0231913cf632f51d9b75da531c717e6_72_4.png)\n\n```\n\
    # ebuild path/to/ebuild compile\n```\n\nYou are advised to edit the ebuild's src_compile()\
    \ function if you want to change the compilation instructions. However, you can\
    \ also trick Portage into believe that the ebuild application has finished the\
    \ compile steps. Run all necessary commands yourself and create an empty file\
    \ called .compiled in the working directory:\n\n# Code Listing 6: Informing Portage\
    \ about the finished compilation jobs\n\n```\n# touch .compiled\n```\n\n### Installing\
    \ the Files in a Temporary Location\nIn the next step Portage will install all\
    \ necessary files in a temporary location. This directory will contain all files\
    \ that are to be merged on the lifesystem. You can accomplish this by running\
    \ ebuild's install functionality, which executes the ebuild's src_install() function:\n\
    \n# Code Listing 7: Installing the files\n\n```\n# ebuild path/to/ebuild\n```\n\
    \n### Merging the Files onto the Livesystem\nThe final step is to merge all files\
    \ onto the livesystem and register those in the Portage backend. ebuild's \"qmerge\"\
    \ step involves the following steps:\n\n- Execute the pkg_preinst() function if\
    \ specified\n- Copy all files to the lifesystem\n- Register the files in the Portage\
    \ backend\n- Execute the pkg_postinst() function if specified\n\nRun ebuild's\
    \ qmerge functionality to accomplish these steps:\n\n# Code Listing 8: Merging\
    \ the ebuild on the lifesystem\n\n```\n# ebuild path/to/ebuild qmerge\n```\n\n\
    ### Cleaning the Temporary Directory\nFinally you can clean the temporary directory\
    \ using ebuild's clean functionality:\n\n# Code Listing 9: Cleaning the temporary\
    \ directory\n\n```\n# ebuild path/to/ebuild clean\n```\n\n## 6.c. Additional Ebuild\
    \ Features\n### Running Merge-related Commands\nUsing ebuild's merge functionality\
    \ you can run fetch, unpack, compile and qmerge commands in one:\n\n# Code Listing\
    \ 10: Installing software\n\n```\n# ebuild path/to/ebuild merge\n```\n\n### Performing\
    \ Configuration Actions\nSome applications include instructions that configure\
    \ your system further. These instructions are interactive and therefore not automatically\
    \ executed. To run these steps enlisted in the ebuild's (optional) config() function,\
    \ use ebuild's config:\n\n# Code Listing 11: Configuring a package\n\n```\n# ebuild\
    \ path/to/ebuild config\n```\n\n### Building an (RPM) Package\nYou can instruct\
    \ Portage to create a binary package or an RPM file. Use ebuild's package or rpm\
    \ functionality to create archives. There are a few differences between these\
    \ functionalities:\n\n- The package functionality is a lot like merge functionality,\
    \ executing all necessary steps (fetch, unpack, compile) before creating the package\n\
    - The rpm functionality builds an RPM package from the files after having run\
    \ the install functionality\n\n# Code Listing 12: Creating packages\n\n```\n(For\
    \ Portage-compatible binary package)\n# ebuild path/to/ebuild package\n\n(For\
    \ RPM package)\n# ebuild path/to/ebuild rpm\n```\n\nThe created RPM file does\
    \ not contain the dependency information.\n\n## 6.d. More Information\nPlease\
    \ consult the following man pages for more information about Portage, the ebuild\
    \ application and ebuild files:\n\n# Code Listing 13: Man pages\n\n```\n$ portage\
    \ (Portage itself)\n$ emerge (The emerge command)\n$ ebuild (The ebuild command)\n\
    $ man ebuild (The ebuild file syntax)\n```\n\nYou will also find development-related\
    \ information in the Developers Handbook.\n\n## D. Gentoo Network Configuration\n\
    ### 1. Getting Started\n### 1.a. Getting started\nNote: This document assumes\
    \ that you have correctly configured your kernel, its modules for hardware and\
    \ you know the interface name of hardware. We also assume that you are configuring\
    \ eth0, but it could be eth1, wlan0, etc.\n\nNote: This document requires running\
    \ baslayout-1 or better. To get started your network card, you will need to tell\
    \ the Gentoo RC system about it. This is done by creating a symbolic link from\
    \ net.lo to net.eth0 in /etc/init.d.\n\n# Code Listing 1: Symlinking net.eth0\
    \ to net.lo\n\n```\n# cd /etc/init.d\n# ln -s net.lo net.eth0\n```\n\nGentoo's\
    \ RC system now knows about interface. It also needs to know how to configure\
    \ the new interface. All the network interfaces are configured in /etc/conf.d.\
    \ Below is a sample configuration for DHCP and static addresses.\n\n# Code Listing\
    \ 2: Examples for /etc/conf.d\n\n```\n# For DHCP\nconfig_eth0=( \"dhcp\" )\n\n\
    # For static IP using CIDR notation\nconfig_eth0=\"192.168.0.7/24\"\nroutes_eth0=(\
    \ \"default via 192.168.0.1\" )\n```\n\n```\n# For static IP using netmask notation\n\
    config_eth0=(\"192.168.0.7 255.255.255.0\")\nroutes_eth0=(\"default gw 192.168.0.1\"\
    )\n```\n\nNote: If you do not specify a configuration for your interface then\
    \ DHCP is assumed.\n\nNote: CIDR stands for Classless Domain Routing. IPv4 addresses\
    \ were classified as A, B, or C. The early classification system did not prevent\
    \ the massive power of the Internet and there is an addressing scheme that allows\
    \ one IP address to represent many IP addresses. A CIDR address looks like a normal\
    \ IP address except that it ends with a slash followed by a number; 192.168.0.0/16\
    \ CIDR is described in RFC 1519.\n\nNow that we have configured our interface,\
    \ we can start and stop it using the commands:\n\n```\n# /etc/init.d/net.eth0\
    \ start\n# /etc/init.d/net.eth0 stop\n```\n\nImportant: When troubleshooting networking,\
    \ it is recommended to set RC_VERBOSE=\"yes\" in /etc/conf.d/rc so that you get\
    \ more what's happening.\n\nNow that you have successfully started and stopped\
    \ your interface, you may wish to get it to start Gentoo boots. Here is how to\
    \ do that the \"rc\" command instructs Gentoo to start any scripts in the runlevel\
    \ that have not been:\n\n```\n# rc-update add net.eth0 default\n# rc\n```\n\n\
    ## 2. Advanced Configuration\n### 2.a. Advanced Configuration\nThe config_eth0\
    \ variable is the heart of an interface. It's a high level instruction for configuring\
    \ the interface (eth0 in this case). Each command in the list is performed. The\
    \ interface is deemed OK if at least one command works.\n\nHere's a list of in-built\
    \ instructions:\n\n| Command | Description |\n| --- | --- |\n| null | noop If\
    \ the interface is up and there is address then abort configuration successfully\
    \ |\n| IPv4 or IPv6 addresses | Add the address to the interface dhcp, adsl or\
    \ ip6 (a custom command from a 3rd party module) | Run the module which provides\
    \ the command. For example dhcp will run a module that provides DHCP which is\
    \ one of either dhcp, udhc, client or prompt |\n\nIf a command fails, you can\
    \ specify a fallback command. The fallback has to match the config structure exactly.\n\
    \nYou can chain these together. Here are some real world examples:\n\n```\n# Adding\
    \ three IPv4 addresses\nconfig_eth0={\n  \"192.168.0.2/24\"\n  \"192.168.0.3/24\"\
    \n  \"192.168.0.4/24\"\n}\n\n# Adding an IPv4 address and two IPv6 addresses\n\
    config_eth0={\n  \"192.168.0.5/32\"\n  \"4321:0:1:2:3:4:567:89ab\"\n  \"4321:0:1:2:3:4:567:89ac\"\
    \n}\n```\n"
  mdcn: "\n\n# 6. Emerge 和 Ebuild\n\nebuild 是 Portage 系统的一个低级接口。使用此应用程序，你可以针对指定的 ebuild\
    \ 执行特定的操作。例如，你可以手动执行单独的合并步骤。\n\nebuild 通常用于开发目的；因此，关于 ebuild 的更多信息可以在《开发者手册》（Developers\
    \ Handbook）中找到。然而，我们将解释 Portage 在特定软件标题的合并过程中是如何调用 ebuild 实例的，以及如何调用某些 ebuild\
    \ 允许你执行的配置后步骤。\n\n## 6.b. 手动安装软件\n\n### 获取源码与校验\n\n每当你针对给定的 ebuild 调用 ebuild 时，它会验证所有涉及文件的校验和是否与附带\
    \ `Manifest` 文件或 `files/digest-<name>-<version>` 文件中的值相等。这在获取源码之后发生。\n\n使用 ebuild\
    \ 获取源码，运行：\n\n![](img/c0231913cf632f51d9b75da531c717e6_72_0.png)\n\n```\n# ebuild\
    \ path/to/ebuild fetch\n```\n\n如果 ebuild 的 mdsum 与 `Manifest` 文件中列出的不匹配，或者下载的源码与\
    \ `files/digest-<package>` 文件中列出的不匹配，你会收到类似下面的错误：\n\n![](img/c0231913cf632f51d9b75da531c717e6_72_1.png)\n\
    \n```\n!!! File is corrupt or incomplete. (Digests do not match)\n>>> our recorded\
    \ digest: db20421ce35e854346e3ef19e6044e\n>>> your file's digest: f10392b7c0b2bc463ad0964260a7d6\n\
    ```\n\n后续的一行将提到错误的文件。\n\n如果你确定获取的源码和 ebuild 本身是有效的，可以使用 ebuild 的功能重新生成 `Manifest`\
    \ 和 `digest-<package>` 文件：\n\n![](img/c0231913cf632f51d9b75da531c717e6_72_2.png)\n\
    \n```\n# ebuild path/to/ebuild digest\n```\n\n### 解包源码\n\n要在 `/var/tmp/portage`（或任何你在\
    \ `/etc/make.conf` 中指定的目录）中解包源码，请运行 ebuild 的 unpack 功能：\n\n![](img/c0231913cf632f51d9b75da531c717e6_72_3.png)\n\
    \n```\n# ebuild path/to/ebuild unpack\n```\n\n这将执行 ebuild 的 `src_unpack()` 函数（如果没有定义\
    \ `src_unpack()`，则默认执行纯粹解压）。必要的补丁（patches）也是在这一步应用的的。\n\n### 编译源码\n\n合并过程的下一步是编译源码。ebuid\
    \ 的 `compile` 功能通过执行 ebuild 中的 `src_compile()` 函数来处理这一步。这这也包括相应的 `configure` 步骤。\n\
    \n![](img/c0231913cf632f51d9b75da531c717e6_72_4.png)\n\n```\n# ebuild path/to/ebuild\
    \ compile\n```\n\n如果你想更改编译指令，建议编辑 ebuild 的 `src_compile()` 函数。不过，你也可以骗过 Portage，使其认为\
    \ ebuild 已经完成了编译步骤。运行所有必要的命令并在工作目录下创建一个名为 `.compiled` 的空文件：\n\n# 代码列表 6：告知 Portage\
    \ 编译任务已完成\n\n```\n# touch .compiled\n```\n\n### 在临时位置安装文件\n在下一步，Portage 将将所有必要文件安装在临时位置。该目录将包含所有要在运行系统上合并的文件。你可以通过运行\
    \ ebuild 的 `install` 功能来实现这一点，该功能会执行 ebuild 的 `src_install()` 函数：\n\n# 代码列表 7：安装文件\n\
    \n```\n# ebuild path/to/ebuild\n```\n\n### 将文件合并到运行系统\n最后一步是将所有文件合并到运行系统（livesystem）并在\
    \ Portage 后端注册这些文件。ebuid 的 \"qmerge\" 步骤涉及以下操作：\n\n- 如果指定，执行 `pkg_preinst()` 函数\n\
    - 将所有文件复制到运行系统\n- 在 Portage 后端注册文件\n- 如果指定，执行 `pkg_postinst()` 函数\n\n运行 ebuild\
    \ 的 `qmerge` 功能来完成这些步骤：\n\n# 代码列表 8：在运行系统上合并 ebuild\n\n```\n# ebuild path/to/ebuild\
    \ qmerge\n```\n\n### 清理临时目录\n最后，你可以使用 ebuild 的 `clean` 功能清理临时目录：\n\n# 代码列表 9：清理临时目录\n\
    \n```\n# ebuild path/to/ebuild clean\n```\n\n## 6.c. 额外的 Ebuild 功能\n### 运行合并相关命令\n\
    使用 ebuild 的 `merge` 功能，你可以一次性运行 `fetch`、`unpack`、`compile` 和 `qmerge` 命令：\n\n\
    # 代码列表 10：安装软件\n\n```\n# ebuild path/to/ebuild merge\n```\n\n### 执行配置操作\n某些应用程序包含了进一步配置你的系统的指令。这些指令是交互式的，因此不会自动执行。要运行\
    \ ebuild（可选的）`config()` 函数中列出的这些步骤，请使用 ebuild 的 `config` 功能：\n\n# 代码列表 11：配置包\n\
    \n```\n# ebuild path/to/ebuild config\n```\n\n### 构建包（或 RPM）\n你可以指示 Portage 创建二进制包或\
    \ RPM 文件。使用 ebuild 的 `package` 或 `rpm` 功能来创建归档。这些功能之间存在一些差异：\n\n- `package` 功能类似于\
    \ `merge` 功能，在创建包之前执行所有必要的步骤（`fetch`、`unpack`、`compile`）\n- `rpm` 功能在运行 `install`\
    \ 功能后构建 RPM 包\n\n# 代码列表 12：创建包\n\n```\n（对于二进制包）\n# ebuild path/to/ebuild package\n\
    \n（对于 RPM 包）\n# ebuild path/to/ebuild rpm\n```\n\n生成的 RPM 文件不包含依赖信息。\n\n## 6.d.\
    \ 更多信息\n关于 Portage、ebuid 应用和 ebuild 文件的更多信息请参考以下帮助页：\n\n# 代码列表 13：帮助页\n\n```\n\
    $ portage (Portage 本身)\n$ emerge (emerge 命令)\n$ ebuild (ebuid 命令)\nman ebuild\
    \ (ebuid 文件)\n```\n\n你还可以在《开发者手册》中找到开发相关信息。\n\n## D. Gentoo 网络\n### 1. 开始\n###\
    \ 1.a. 开始\n注意：本文假设你已经正确配置了内核、硬件模块以及接口名称。我们还假设你配置的是 `eth0`，但可能是 `eth1`、`wlan0`\
    \ 等。\n\n注意：本文需要更好的布局。要启动你的网卡，你需要告知 Gentoo RC 系统。这是通过在 `/etc/init.d` 中从 `net.lo`\
    \ 到 `net.eth0` 创建符号链接实现的。\n\n# 代码列表 1：将 net.eth0 链接到 net.lo\n\n```\n# cd /etc/init.d\n\
    # ln -s  \n```\n\nGentoo 的 RC 系统现在知道了接口。它还需要知道如何配置新接口。所有的网络接口都在 `/etc/conf.d`\
    \ 中配置。以下是 DHCP 和静态地址的示例。\n\n# 代码列表 2：etc/conf.d 示例\n\n```\n# 对于 DHCP\nconfig_eth0=(\
    \ \"dhcp\" )\n\n# 使用 CIDR 法的静态 IP\nconfig_eth0=\"192.168.0.7/24\"\nroutes_eth0=(\
    \ \"default via 192.168.0.1\" )\n```\n\n```\n# 使用子网掩码法的静态 IP\nconfig_eth0=(\"\
    192.168.0.7 255.255.255.0\")\nroutes_eth0=(\"default gw 192.168.0.1\")\n```\n\n\
    注意：如果你没有为接口指定配置，则假设为 DHCP。注意：CIDR 代表无类域间。IPv4 地址被分类为 A、B 或 C。早期的分类系统并没有阻止互联网的巨大力量，有一种地址方案允许一个\
    \ IP 地址表示许多 IP 地址。CIDR 地址看起来像普通的 IP 地址，结尾是一个斜杠加上一个数字；192.168.0.0/16。CIDR 在 RFC\
    \ 1519 中描述。\n\n现在我们已经配置了接口，可以使用以下命令启动和停止：\n\n```\n# /etc/init.d/net.eth0 start\n\
    # /etc/init.d/net.eth0 stop\n```\n\n重要：在排除网络故障时，建议在 `/etc/conf.d/rc` 中设置 `RC_VERBOSE=\"\
    yes\"` 以获取更多信息。\n\n现在你已经成功启动并停止了接口，可能希望它在 Gentoo 启动时自动运行。做法如下，“rc”命令指示 Gentoo\
    \ 启动运行级别（runlevel）中尚未启动的脚本：\n\n```\n# rc-update add net.eth0 default\n# rc\n```\n\
    \n## 2. 高级配置\n### 2.a. 高级配置\n`config_eth0` 变量是接口的核心。它是配置接口（在本例中为 eth0）的高级指令。列表中的命令都会执行。如果至少有一个有效，则认为接口是正常的。\n\
    \n以下是内置指令列表：\n\n| 命令 | 描述 |\n| --- | --- |\n| null | 如果操作接口已启动且有地址，则成功终止配置 |\n\
    | IPv4 或 IPv6 地址 | 将地址添加到接口。dhcp、adsl 或 ip6（后者是来自第三方模块的自定义命令） | 运行提供该命令的模块。例如，dhcp\
    \ 将运行一个提供 DHCP 的模块，可以是 `dhcp`、`udhc`、`client` 或 `prompt` 之一 |\n\n如果命令失败，你可以指定一个回退命令。回退命令必须与配置结构完全匹配。\n\
    \n你可以将这些命令链起来。这里是一些真实的示例：\n\n```\n# 添加三个 IPv4 地址\nconfig_eth0={\n  \"192.168.0.2/24\"\
    \n  \"192.168.0.3/24\"\n  \"192.168.0.4/24\"\n}\n\n# 添加一个 IPv4 地址和两个 IPv6 地址\n\
    config_eth0={\n  \"192.168.0.5/32\"\n  \"4321:0:1:2:3:4:567:89ab\"\n  \"4321:0:1:2:3:4:567:89ac\"\
    \n}\n```\n\n"
