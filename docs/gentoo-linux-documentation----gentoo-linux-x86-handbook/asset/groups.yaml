    # B. Working with Gentoo


    # 1. A Portage Introduction


    1.a. Welcome to Portage


    Portage is probably Gentoo''s most notable innovation in software management.
    With its high flexibility and enormous amount of features it is frequently seen
    as the best software management tool for Linux.


    Portage is completely written in Python and Bash and therefore fully visible to
    the users as both scripting languages.


    Most users will use Portage through the emerge tool. This chapter is not meant
    to duplicate the information available from the emerge man page. For a complete
    rundown of emerge''s options, please consult the man page:


    ```

    Code Listing 1: Reading the emerge man page

    ```


    ```

    $ man emerge

    ```


    1.b. The Portage Tree


    Ebuilds


    When we talk about packages, we often mean software titles that are available
    to the Gentoo users through the Portage tree. The Portage tree is a collection
    of ebuilds, files that contain all Portage needs to maintain software (install,
    search, query, ...). These ebuilds reside in /usr by default.


    Whenever you want to perform some action regarding software titles, it will use
    the ebuilds on your system as a base. It is important that you regularly update
    the ebuilds on your system Portage knows about new software, security updates,
    etc.


    Updating the Portage Tree


    The Portage tree is usually updated with rsync, a fast incremental file utility.
    Updating is fairly simple as the emerge command provides a front-end for rsync:


    ```

    Code Listing 2: Updating the Portage tree

    ```'
- md: '

    ```bash

    # emerge --sync

    ```


    If you are unable to resync due to firewall restrictions you can still update
    your Portage tree by using our daily generated Portage tree snapshots. The emergewebsync
    tool automatically fetches and installs the latest snapshot on your system:


    # Code Listing 3: Running emerge-webresync


    ```bash

    # emerge-webresync

    ```


    ### 1.c. Maintaining Software


    #### Searching for Software


    To search through the Portage tree after software titles, you can use emerge built-in
    search capabilities. By default, --search returns the names of packages whose
    title matches (either or partially) the given search term.


    For instance, to search for all packages who have "pdf" in their name:


    # Code Listing 4: Searching for pdf-name packages


    ```bash

    $ emerge --search pdf

    ```


    # Code Listing 5: Searching for pdf-related-packages


    ```bash

    $ emerge --searchdesc pdf

    ```


    # Code Listing 6: Example ''emerge--search'' output


    ```text

    * net-print/cups-pdf

    Latest version available: 1.5.2

    Latest version installed: [ Not Installed ]

    Size of installed files: 15 kB

    Homepage: http://cip.physik.uni-weiersburg.de/~vrherr/cups-pdf/

    Description: Provides a virtual printer for CUPS to produce files.

    License: GPL-2

    ```


    #### Installing Software


    Once you''ve found a software title you like, you can easily install it with emerge:
    just add the package name. For instance, to install gnumeric:


    # Code Listing 7: Installing gnumeric


    ```bash

    # emerge gnumeric

    ```


    Since many applications depend on each other, any attempt to install a certain
    software package might result in the installation of several dependencies as well.
    Don''t worry, Portage handles dependencies well. If you want to find out what
    Portage would install when you ask it to install a certain package, add the --pretend
    switch. For instance:


    # Code Listing 8: Pretend to install gnumeric


    ```bash

    # emerge --pretend gnumeric

    ```


    When you ask to install a package, it will download the necessary source code
    from the internet (if necessary) and store it by default in /usr/port/distfiles.
    After this it will unpack, compile and install the package. If you want Portage
    to only download the sources without installing them, add the --fetchonly option
    to the emerge command:


    # Code Listing 9: Download the sourcecode for gnumeric


    ```bash

    # emerge --fetchonly gnumeric

    ```


    #### Finding Installed Package Documentation


    Many packages come with their own documentation. Sometimes, the doc flag determines
    whether the package documentation should be installed or not. You can check the
    existence of a doc flag with the emerge -vp <package name> command.


    # Code Listing 10: Checking the existence of a doc flag


    ```bash

    (alsa-lib is just an example, of course.)

    # emerge -vp alsa-lib

    ebuid N media-lib/alsa-lib-1.0.9_rc +doc -jack 674 KB

    ```


    You can enable the doc use flag globally in the /etc/make.conf file or per package
    in the /etc/portage/package.file. The USE Flags covers this aspect in detail.

    Once the package is installed, its documentation is generated in a subdirectory
    named after the package under /usr/share/doc. You can also list all installed
    files with list package.


    # Code Listing 11: Locating package documentation


    ```bash

    # ls -l /usr/share/doc/alsa-lib-1.0.9_rc

    total 24

    -rw-r--r 1 root      669 May 17 21:54 Changelog.gz

    -rw-r--r 1 root      9373 May 17 21:54 COPYING.gz

    dr-xr-x 2 root      4096 May 17 21:54 hinfo

    dr-xr-x 1 root      196 May 17 21:54 TODO.gz


    (Alternatively, use equ to locate installing files):

    # query files alsa-lib | less

    media-lib/alsa-lib-1.0.9_rc:

    *

    /usr

    /usr/bin

    /usr/bin/alsaisimp

    (Output truncated)

    ```


    #### Removing Software


    When you want to remove a software package from your system, use emerge --unmerge.
    This will tell Portage to remove all files installed by that from your system.
    However, you can also use --unmerge to remove specific packages.


    # Code Listing 12: Removing gnumeric


    ```bash

    # emerge --unmerge gnumeric

    ```


    #### Updating System


    To keep your system in perfect shape, you need to update regularly. Since security
    updates also happen, it is recommended to run this command once a while:


    # Code Listing 13: Updating your system


    ```bash

    # emerge --ask world

    ```


    If you want to update every single package on your system, add the --depth argument:


    # Code Listing 14: Updating your entire system


    ```bash

    # emerge --depth world

    ```


    If you have altered any USE flags, you might want to add --newuse as well:


    # Code Listing 15: Performing a full update


    ```bash

    # emerge --newuse world

    ```


    ![](img/0231913cf6f51d9b747.png)


    #### Metapages


    Some packages in the Portage tree don''t have real content but are used to install
    a collection of packages. For instance, the kde package will install a complete
    KDE environment by pulling in various packages.


    If you ever want to remove a package from your system, running --remove on the
    package won''t have effect as the dependencies remain. Portage has the functionality
    to remove orphaned dependencies as well. All is handled with the following three
    commands:


    # Code Listing 16: Removing orphaned dependencies


    ```bash

    # emerge --depth world

    # emerge --deplean

    # revdep-rebuild

    ```


    revdep-rebuild is provided by the gentoolkit package; don''t forget to emerge
    it first:


    # Code Listing 17: Installing the gentoolkit package


    ```bash

    # emerge gentoolkit

    ```


