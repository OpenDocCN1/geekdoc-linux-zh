    ## Building Directory


    Portage creates specific build directories for each package it embeds inside /var/tmp/portage.
    This location is defined by the BUILD_PREFIX variable.


    ### Live Filesystem Location


    By default Portage installs all files on the current filesystem (/), you can change
    this by setting the ROOT environment variable. This is useful when you want to
    create build images.


    ### 1.d. Logging Features


    #### Ebuild Logging


    Portage can create re-ebuild logs, but only when the PORT_LOGDIR variable is set
    to a location that is writable by Portage (the postage user). By default this
    is unset.


    ## 2. Configuring Variables


    ### 2.a. Portage Configuration


    As noted, Portage is configurable through many variables which you should define
    in /etc/make.conf. Please refer to the make.conf man page for more complete information:


    ![](img/c0231913cf632f51d9b75da531c717e6_66_0.png)


    ```

    $ man make.conf

    ```


    ### 2.b. Build-specific Options


    #### Configure and Compiler Options


    When Portage builds, it passes the defined compiler flags for the following to
    the compiler and configure script:


    - - CFLAG and CXXFLAGS flags for C and C++ compiling.

    - CHOST defines the host information for the application''s configure script

    - MAKEOPTS is passed to the make command and is usually set to define the amount
    of parallelism during compilation. More information about the make options can
    be found in the make man page.


    The USE variable is used during configure and compiling has been explained in
    great detail in previous chapters.


    #### Merge Options


    When Portage has merged a newer version of a certain software title, it will remove
    the obsolete files of the older version from your system. Portage gives you a
    5 second delay before merging the older version. These 5 seconds are defined by
    the CLEAN_DELAY variable.


    ### 2.c. Configuration File Protection


    #### Portage''s Protected Locations


    Portage overlays provided by newer versions of a software file if the files aren''t
    stored in a protected location. These protected locations are defined by the CONFIG_PROTECT
    variable and are generally configuration file locations. The directory list is
    space-delimited.


    A file that is written in such a protected location is renamed and the user is
    warned about the presence of a newer version of the (presumable) configuration
    file.


    You can find out about the current CONFIG_PROTECT setting from the emerge --info
    output:


    ![](img/c0231913cf632f51d9b75da531c717e6_66_1.png)


    ```

    $ emerge --info | grep ''CONFIG_PROTECT=''

    ```


    More information about Portage''s Configuration File Protection is available through
    emerge:


    # Code Listing 3: More information about Configuration File Protection


    ```

    $ emerge --help config

    ```


    #### Excluding Directories


    To ''unprotect'' certain subdirectories of protected locations you can use the
    CONFIG_PROTECT_MASK variable.


    ### 2.d. Download Options


    #### Server Locations


    When the requested information or data is not available on your system, Portage
    will retrieve it from the Internet. The server locations for the various information
    and data channels are defined by the following variables:


    - - GENTOO_MIRRORS defines a list of locations which contain source code (distifles)

    - PORTAGE_BINHOS defines a particular location containing prebuilt packages for
    your system


    A third setting involves the location of the rsync server which you use when you
    update your Portage tree


    - - SYNC_MIRRORS and SYNC variables can be set automatically by the mirrorselect
    application. You need to merge mirrorselect before you use it. For more information,
    see mirrorselect''s online help:


    # Code Listing 4: More information about mirrorselect


    ```

    # mirrorselect --help

    ```


    If your environment requires you to use a proxy server, you can use the HTTP_PROXY,
    FTP_PROXY and RSYNC_PROXY variables to declare a proxy server.


    #### Fetch Commands


    Portage is able to resume partially downloaded source code. It uses wget by default.
    You can change this through the FETCHCOMMAND variable.


    Make sure that your FETCHCOMMAND and RESUMECOMMAND stores the source code in the
    correct location. In the variables you use $[URI] and $[DISTDIR] to point to the
    source code location and distfiles location respectively.


    You can also define protocol-specific handlers with FETCHCOMMAND_HTTP, FETCHCOMMAND_FTP,
    RESUMECOMMAND_HTTP, RESUMECOMMAND_FTP, and so on.


    #### Rsync Settings


    You cannot use the rsync command to update the Portage tree, but you can set some
    variables to handle the rsync:


    - - SYNC_EXCLUDE points to a file listing the packages/categories rsync should
    ignore during the update process

    - SYNC_RETRIES defines how many times rsync should try connecting to the mirror
    pointed to by the SYNC variable before bailing out.

    - SYNC_TIMEOUT defines the number of seconds an rsync connection can idle before
    it counts as timed-out. This variable defaults to 180 dialup users or individuals
    with slow computers might want to set this to 300 or higher.


    ### 2.e. Portage Configuration


    #### Branch Selection


    When you change your branch with the ACCEPT_KEYWORDS variable. It defaults to
    your architecture''s stable branch. More information on Gentle''s branches can
    be found in the next chapter.


    #### Portage Features


    You can activate Portage features through the FEATURES variable. The Portage Features
    have been discussed in previous chapters.


    ### 2.f. Portage Behaviour


    #### Resource Management


    With the PORTAGE_NICENESS variable you can augment or reduce the nice value. For
    more information about nice values, see the man page:


    ```

    Code Listing 5: More information about nice

    $ man nice

    ```


    #### Output Behaviour


    The NOCOLOR, which defaults to "false", defines if Portage should disable the
    use of coloured output.


    ## 3. Mixing Software Branches


    ### 3.a. Using One Branch


    #### The Stable Branch


    ACCEPT_KEYWORDS variable defines what software branch you use on your system.
    It defaults to the stable branch for your architecture, instance x86.


    We recommend you use only the stable branch. However, if you do not care about
    stability much and you want to help Gentoo by submitting bugports to http://bugs.gentoo.org,
    read on.


    #### The Testing Branch


    If you want to use more software, you can consider using the testing branch. Have
    Portage to use the testing branch, a - in your architecture.

    The testing branch is exactly what it says - Testing. If a package is in testing,
    it means the developers who feel that it is functional but not thoroughly tested.
    You will likely be the first to discover a bug in the package in which case you
    could file a bugreport.


    Beware though, you might notice stability issues, imperfect packaging (for instance
    wrong/missing dependencies), frequent updates (resulting in lots of builds) or
    broken packages. If you do not know Gentoo works and how to solve problems, we
    recommend that you stick with the stable branch.


    For example, select the testing branch for the x86 architecture, edit /etc/make.conf
    and:


    ```

    Code Listing 1: Setting the ACCEPT_KEYWORDS variable

    ACCEPT_KEYWORDS="x86"

    ```


    If you update your system now, you will find out that lots of packages will be
    updated. Mind though: when you have updated your system using the testing branch
    there is no easy back to the stable, official branch (except for using backups
    of).


    ### 3.b. Mixing Stable with Testing


    #### The package.keywords file


    You can ask Portage to allow the testing branch for particular packages but use
    the stable branch for the rest of the system. To achieve this, add the package
    name and want to use the testing branch in /etc/portage/package.keywords. For
    instance, to use the testing branch for gnumeric:


    ```

    Code Listing 2: /etc/portage/package.keywords setting for gnumeric, full line

    app-office/gnumeric-x86

    ```


    #### Test Particular Versions


    If you want to use a specific software version from the testing branch you don''t
    want Portage to use the testing branch for subsequent versions, you can add the
    version in the package.keywords file. In this case you must use the = operator.
    You can also use a version range using the <,

