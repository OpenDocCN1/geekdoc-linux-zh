    # The /etc/envd directory


    To centralisation of these variables, Gentoo introduced the /etc/envd directory.
    Inside this directory you will find a number of files, such as 0basic, 05gcc,
    etc. which contain the variables needed by the application mentioned in their
    name.


    For instance, when you installed gcc, a file called 05gcc was created by the ebuild
    which contains the definitions of the following variables:


    # Code List 2: /etc/envd/05gcc


    ```

    PATH=/usr/x86_64-pc-linux-gnu/gcc-bin/3.2*

    ROOTPATH=/usr/x86_64-pc-linux-gnu/gcc-bin/3.2*

    MANPATH=/usr/share/gcc/data-i686-pc-linux-gnu/3.2/man*

    INFOPATH=/usr/share/gcc/data-i686-pc-linux-gnu/3.2/info*

    CC=*cc.cache

    XX*=

    LDPATH=/usr/lib/gcc/i686-pc-linux-gnu/3.2.3*

    ```


    Other distributions let you to change or add environment variables in /etc/profile
    or other locations. Gentoo on the other hand makes it easy for you (or Portage)
    to maintain and manage the environment variables without having to pay attention
    to numerous files that can contain environment variables.


    For instance, when gcc is updated, the /etc/envd/05gcc file is updated without
    requiring any user-interaction. Occasionally you may be asked to set a certain
    environment variable system-wide. As an example we take the http_proxy variable.
    Instead of messing with /etc/profile, you can now create a file (/etc/envd/99local)
    and enter your definition(s) in it:


    # Code List 3: /etc/envd/99local


    ```

    http_proxy="proxy.server.com:8080*

    ```


    By using the file for all your variables, you have a quick overview on the variables
    you have defined yourself.


    The env-update script


    Several files in /etc/envd define the PATH variable. This is not a mistake: when
    you run env-update, it will append the several definitions before it updates the
    environment variables, making it easy for packages (or users) to add their own
    environment variable settings without interfering with the existing files.


    The env-update script will append the variables in the alphabetical order of /etc/envd
    files. The files must begin with two decimal digits.


    # Code List 4: Update env-vars by env-update


    | 00basic | 99k-env | 99local |

    |---------|---------|---------|

    | PATH=/usr/bin:/usr/lib/3.2/bin:/usr/local/bin* |


    The concatenation of variables does not always happen, with the following variables:
    KEDIRS, PATHCLASS, LDPATH, MANIPATH, INFOPATH, ROOTPATH, CONFIG_PROTECT, CONFIG_MASK,
    PRELINK_PATH and PRELINK, MASK. Only the last defined value (in alphabetical order
    of /etc/envd) is used.


    When you run env-update, the script will create all environment variables and
    place them in /etc/profile (which is used by /etc/). It will extract the information
    from the LDPATH variable and use that to create /etc/ld.so.cache. After this,
    you will run ldconfig to recreate the /etc/ld.so file used by the dynamic linker.


    If you want to notice the effect of env-update immediately after you run it, execute
    the following command to update your environment. Users who have installed Gentoo
    will probably remember this from the installation instructions.


    # Code List 5: Updating the environment


    ```

    # env-update --4 source /etc/profile

    ```


    Note: The above command only updates the variables in your current terminal, new
    consoles, and their children. Thus, if you are working in X11 you will need to
    type source /etc/profile in every new terminal or restart X as all new source
    variables will be used. If you use a login manager, become root and type /etc/init.d/xdm
    restart. If not, you will need to logout and log in for X to spawn children with'
