    What is a runlevel?


    You have seen init using a number to decide which runlevel it should activate.
    A runlevel is a state in which your system is running and contains a collection
    of scripts (runlevel scripts or scripts) that must be executed when you enter
    or leave a level.


    In Gentoo, there are seen seven runlevels: three internal runlevels, and four
    user-defined runlevels. The internal runlevels are called system, shutdown and
    reboot and they initialize or reboot the system.


    The user-defined runlevels are those with an accompanying /etc/runlevels subdirectory:
    boot, default, network and single. The boot runlevel starts all-system services
    which all runlevels use. The remaining three runlevels differ in what services
    they start: default for day-to-day operations, network is used in case no connectivity
    is required, and single is used when you need to fix the system.


    Working with the Init Scripts


    The scripts that the rc process starts are all init scripts. Each script in /etc/init.d
    can be executed with the arguments start, restart, pause, zap, status, init, use,
    needs, usename or broken.


    To start, or restart a service (and all dependencies), start, stop and restart
