  - "[PAGE 59]\n\n# Adding and Removing Services\n\nYou have already added init scripts\
    \ to the \"default\" runlevel during the installation of Gentoo. At that time\
    \ you might not have a cue of what the \"default\" is for, but now you should.\
    \ The rc-update script requires a second argument that defines the action: add,\
    \ del or show.\n\nTo add or remove an init script, just re-update the add or del\
    \ argument, followed by the init script and the runlevel. For instance:\n\n> Code\
    \ Listing 13: Removing Postfix from the default runlevel\n\n```\n# rc-update del\
    \ postfix default\n```\n\nThe rc-update command will show all the available scripts\
    \ and list at which runlevels they execute\n\n> Code Listing 14: Receiving init\
    \ script information\n\n```\n# rc-update show\n```\n\n# 4.c. Configuring Services\n\
    \n# Why the Need for Extra Configuration?\n\nInit scripts can be complex. It is\
    \ therefore not desirable to have the user edit the init script directly, as it\
    \ would make it more error-. It is important to be able to configure such a service.\
    \ For instance, you might want to give more options to the service itself.\n\n\
    A second reason to have this configuration outside the init script is to update\
    \ the init scripts without the fear that your configuration will be undone.\n\n\
