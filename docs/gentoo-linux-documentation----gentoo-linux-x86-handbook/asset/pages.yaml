  md: 'If you are now using your network, you can skip the rest of this section and
    continue with Preparing the Disks. If not, read on.


    # 3.b. Automatic Network Configuration


    If the network doesn''t work immediately, some installation media allow you to
    use net-setup (for regular or wireless networks), adsl-setup (for ADSL users)
    or pptp (for PPTP-users - only available on x86)


    If you installation media does not contain any of the tools or your network doesn''t
    function yet, continue with Manual Network Configuration.


    +   * Regular Ethernet users should continue with Default: Using net-setup

    * ADSL users should continue with Alternative: Using RP-PPPoE

    * PPTP users should continue with Alternative: Using PPTP


    Default: Using net-setup


    The simplest way to set up network if it didn''t get automatically configured
    is to run the net-setup script:


    ```

    Code Listing 5: Running the net-setup script


    # net-setup eth0

    ```


    net-setup will ask you some questions about your network environment. When all
    is done, you should have a working network connection. Test your connection as
    stated. If the tests are successful, congratulations! You are now ready to install
    Gentoo. Skip the rest of this section and continue with Preparing the Disks.


    If your network doesn''t work, continue with Manual Network Configuration.


    Alternative: Using RP-PPPoE


    Assuming you need it to connect to the internet, the Installation CD (any version)
    has made things easy for you using rp-pppoe. use the provided adsl-script to configure
    your network. You will be prompted for the ethernet device that is connected to
    your adsl modem, your username and password, the IPs of your DNS servers and if
    you need a basic firewall or.


    ```

    Code Listing 6: Using rp-pppo


    # adsl-setup

    # adsl-start

    ```


    If something goes wrong, double-check that you correctly typed your username and
    password by looking at /etc/ppp/pap-secrets or /etc/ppp/chap-secrets make sure
    you are using the right ethernet device. If your ethernet device doesn''t exist,
    you will have to load the appropriate network modules. In that case you continue
    with Manual Network Configuration as we explain how to load the appropriate network
    modules.


    If everything worked, continue with Preparing the Disks.


    Alternative: Using PPTP


    > Note: PPTP support is only available for x86


