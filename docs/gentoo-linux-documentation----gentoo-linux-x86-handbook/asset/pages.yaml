    ```


    Entering the new environment

    Now that all are initialized and the base environment installed, it is time to
    enter our new installation environment by chrooting into it. This means we change
    the current installation environment (Installation CD or other installation medium)
    to your installation system (namely initialized partitions).

    This choosing is done in three steps. First we will copy the root from (the installation
    medium) to /mnt/gentoo (on your partitions) using copy. Then we create a new environment
    using env-update, essentially creates environment variables. Finally, we load
    those variables into memory usage.


    # Code List 5: Chroot into the new environment


    ```

    # chroot /mnt/gentoo /bin/bash

    # env-update

    >> Regenerating /etc/ld.so.cache...

    # source /etc/profile

    # export PS1=$(chroot) $

    ```


    Congratulations! You are now inside your Gentoo Linux. Of course it is far from
    finished, which is why the installation still has some sections left :-)

