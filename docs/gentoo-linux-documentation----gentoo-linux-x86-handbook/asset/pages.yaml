    # 4. Initslevels


    4.a. Runlevels


    Booting your System

    When you boot your system, you will notice lots of text floating by. If you pay
    close attention, you will notice this text is the same every time you reboot your
    system. The sequence of all actions is called the boot sequence and is (more or
    less) statically defined.

    First, your boot loader will load the kernel you have defined in the boot loader
    configuration into memory after it tells the CPU to run the kernel. When the kernel
    is loaded and run, it initializes all kernel-specific structures and tasks and
    starts the init process.

    This process makes sure that all filesystems (in /etc/fstab) are mounted and ready
    to use. Then it executes several scripts located in /etc/initd, which will start
    the services you need in order to have a successfully booted system.

    Finally, when all scripts are executed, it activates the terminals (in most cases
    the virtual consoles which are hidden beneath Alt-F1, Alt-F2...) attaching a special
    process called getty to. This process will then make sure you are able to log
    on these terminals by running login.

    Init Scripts


    Now init just executes the scripts in /etc/initd.random. Even it doesn''t run
    all scripts in /etc/initd.d, only the scripts it is told to execute. It decides
    which to execute by looking into /etc/runlevels.

    First, init runs all scripts in /etc/initd/ that have symbolic links inside /etc/runlevel/root.
    Usually, it will start the scripts in alphabetical order, but some scripts have
    dependency information in them, telling the system that another script must run
    before they can be started.

    When all /runlevel/default referenced scripts are executed, it continues with
    running the scripts that have a symbolic link to in them.

    How Init Works

    Of init does not decide that by itself. It needs a configuration file that specifies
    what actions need to be taken. This configuration file is in /etc/initab.

    If you remember the boot sequence we have just described, you will remember that
    init''s first action is to mount all filesystems. This is defined in the following
    line in /etc/initab


    ```

    Code List 1: The system initialisation in /etc/initab

    ```


    ```

    si:sysinit:/sbin/init.d rc sysinit

    ```'
  merge: -1
  pgno: 56
- img_proc: true
  md: 'This line tells it that it must run /sbin/rcinit to initialize the system.
    The /sbin/rc script takes care of the initialisation, so you might say that init
    does not do much - it delegates the task of initialising the system to another
    process.


    Second, init executed all scripts that have symbolic links in /etc/runlevels/boot.
    This is defined in the following line:


    ```

    Code Listing 2: The system initialisation, continued


    rc::boot:sbin/rc boot

    ```


    Again the rc script performs the necessary tasks. The option given to rc (boot)
    is the same as the subdirectory of /etc/runlevels that is used.


    Now init checks its configuration file to see what runlevel it should run. To
    decide this, it reads the following line from /etc/initab:


    ```

    Code Listing 3: The infinite line


    id3:initdefault:

    ```


    In this case (which is the majority of Gentoo users will use), 3. Using this information,
    init checks what it must run at runlevel 3:


    ```

    Code Listing 4: The runlevel definitions


    10:0:wait;/sbin/rc shutdown tty1 linux

    11:0:wait;/sbin/rc single tty2 linux

    12:0:wait;/sbin/rc nonwork tty3 linux

    13:0:wait;/sbin/rc default tty4 linux

    14:0:wait;/sbin/rc default tty5 linux

    15:0:wait;/sbin/rc default tty6 linux

    16:0:wait;/sbin/rc reboot

    ```


    The line defines 3, again uses the rc script to start the services (now with argument
    default). Again note that the argument of rc is the same as the subdirectory from
    /etc/runlevels.


    When rc has finished, init decides what virtual consoles should activate and what
    commands need to be run at each console:


    ```

    Code Listing 5: The virtual consoles definition


    c1:2345:respawn;/sbin/agetty 38400 tty1 linux

    c2:12345:respawn;/sbin/agetty 38400 tty2 linux

    c3:12345:respawn;/sbin/agetty 38400 tty3 linux

    c4:12345:respawn;/sbin/agetty 38400 tty4 linux

    c5:1234:respawn;/sbin/agetty 38400 tty5 linux

    c6:12345:respawn;/sbin/agetty 38400 tty6 linux

    ```


    What is a runlevel?


    You have seen init using a number to decide which runlevel it should activate.
    A runlevel is a state in which your system is running and contains a collection
    of scripts (runlevel scripts or scripts) that must be executed when you enter
    or leave a level.


    In Gentoo, there are seen seven runlevels: three internal runlevels, and four
    user-defined runlevels. The internal runlevels are called system, shutdown and
    reboot and they initialize or reboot the system.


    The user-defined runlevels are those with an accompanying /etc/runlevels subdirectory:
    boot, default, network and single. The boot runlevel starts all-system services
    which all runlevels use. The remaining three runlevels differ in what services
    they start: default for day-to-day operations, network is used in case no connectivity
    is required, and single is used when you need to fix the system.


    Working with the Init Scripts


    The scripts that the rc process starts are all init scripts. Each script in /etc/init.d
    can be executed with the arguments start, restart, pause, zap, status, init, use,
    needs, usename or broken.


    To start, or restart a service (and all dependencies), start, stop and restart
    should be used:'
