  md: '# a.b. Designing a Partitioning Scheme


    Default Partitioning Scheme


    If you are not interested in drawing a partitioning scheme for your system, you
    can use the partitioning scheme we use throughout this book:


    | Filesystem Size Used Description |

    | /dev/hd1 ext2 | 32M | Boot partition |

    | /dev/hd2 (swap) | 512M | Swap partition |

    | /dev/hd3 ext3 | | Rest of the disk partition |


    If you are interested in knowing how big a partition should be, or how many partitions
    you need, read on. Continue with partitioning your disk by using fdisk to Partition
    your Disk.


    # How Many and How Big?


    The number of partitions is highly dependent on your environment. For instance,
    if you have lots of users, you will most want to have your /home separate as it
    ensures security and backups easier. If you are installing Gentoo as a mailserver,
    your /var should be separate as all its small stores are inside /var. A good choice
    of filesystem will maximise your performance. Geervers will have a separate /opt
    / most assembling managers easier. You will definitely want to keep /usr not:
    not only will it limit the capacity of the applications, the Portage tree takes
    around 500 MB excluding the various sources that are stored in it.


    As you can see, it depends on what you want to use. Separate partitions for each
    partition or volume will have the following advantages:


    +   - You can choose the best performing filesystem for each partition or volume

    - Your entire system cannot run out of free space if one defunct continues writing
    files to a partition or volume

    - If necessary, file system checks are reduced, as multiple checks can be done
    in parallel (although this advantage is more with multiple disks than with multiple
    partitions)

    - Security can be enhanced by mounting some partitions as read-only (setuid bits
    are ignored), noexec (executables binaries are ignored) etc.


    multiple partitions have one disadvantage: if not configured properly, you might
    result in having a system with lots of free space on one partition and not another.
    There is also a 15-partition limit for SCSI and SATA.


    As an example, we show you one of a 20GB disk, as a demonstration laptop (containing
    webserver, mailserver, gnome,):


    ```

    Code Line 1: Filesystem example usage

    $ fdisk -l

    Filesystem Type Size Used Avail% Mounted on

    /dev/hd5 ext4 50M 132M 28%

    /dev/hd6 ext3 5G 3.2G 65% /home

    /dev/hd7 ext3 7.9G 6.2G 13% /usr

    /dev/hd8 ext3 101M 48M 47% /opt

    /dev/hd9 ext2 2G 607M 35% /var

    /dev/hd1 ext2 1M 17M 36% /root

    /dev/hd4 swap 512M 504M <not mounted>

    (Partitioned for future usages: )

    ```


    /usr is root (85% used here), but all software is installed, /usr doesn''t tend
    to grow that much. Allocating few gigabytes of disk for /var might seem excessive,
    remember that Portage uses this partition for compiling packages. If you want
    to keep /var small, you will need to alter your PORTAGE_TMPDIR variable in /etc/make.conf
    to point to the partition with enough free space for compiling large packages
    such as OpenOffice.


