    To summarise, you will need the following information before continuing:


    Network Item Example

    Your IP address 192.168.0.2

    Netmask 255.255.255.0

    Broadcast 192.168.0.255

    Gateway 192.168.0.1

    Nameserver(s) 195.130.130.5, 195.130.130.333


    Using ifconfig


    Setting up your network consists of three steps. First we assign an IP address
    using ifconfig. Then we set routing up to the gateway route. Then you will need
