    # Mountings /proc /dev Filesystems

    Mount the proc filesystem /mnt/gentoo/proc to allow the installation to use the
    kernel-provided information within the chrooted environment and then-bind the
    /dev filesystem.


    # Code List 4: Mounting /proc and /dev


    ```

