    support PPPoA.


    Now we need to configure eth0 to be an ADSL interface and enter our username by
    updating /etc/conf.d/net.


    # Code Listing 6: Configure eth0 for ADSL in /etc/conf.d/net


    ```

    config_eth0="*adsl"

    adsl_user_eth0="username"

    ```


    Finally we need to define your username and password in /etc/ppp/pap-secrets.


