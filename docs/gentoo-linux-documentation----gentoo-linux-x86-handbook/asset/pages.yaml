    Extra Hardware Configuration


    When the Installation CD boots, it tries to detect all hardware devices and load
    the appropriate kernel modules to support your hardware. In

    t vast majority of cases, it does a very good job. However, in some cases it may
    not auto-load the kernel modules you need. If the PCI

    auto-detection missed some of your system''s hardware, you will have to load the
    appropriate kernel modules manually.


    In the next example we try to load the 8139tomodule (support for certain kinds
    of network interfaces):


    # Code Listing 5: Loading kernel modules


    ```

    # modprobe 8139to

    ```


    If you need PCMCIA support, you should start the pcmia in script:


    # Code Listing 6: Starting the PCMCIA in script


    ```

    # /etc/init.d/pcmia start

    ```


