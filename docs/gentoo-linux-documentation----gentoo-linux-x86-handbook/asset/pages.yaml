    # 5.c. Defining Variables Locally


    # User Specific


    You do not have to define an environment variable globally. For instance, you
    might want to add /home/my_user/bin and the working directory (the directory you
    are in) to the PATH variable but don''t want all other users on your system to
    have that in their PATH too. If you want to define an environment variable locally,
    you should use ~/.bashrc or ~/.bash_profile:


    ```

    Code Listing 6: Extending PATH for local usage in ~/.bashrc

    ```


    ```

    # colon followed by no directory is treated as the current working directory

    PATH=$PATH://home/my_user/bin;

    ```


    When you relogin, your PATH variable will be updated.


    # Session Specific


    Sometimes even stricter definitions are required. You might want to be able to
    use binaries from a temporary directory you created without adding the path to
    binaries or editing ~/.bashrc for the short time you need.


    In this case, you can define the PATH in your current session by using the export
    command. As you don''t log out, the PATH variable will be modified by the temporary
    settings.


    ```

    Code Listing 7: Defining a session-specific environment variable

    ```


    ```

    # export PATH=$PATH:/home/my_user/tmp/usr/bin*

    ```


    # C. Working with Portage


    # 1. Files and Directories


    # 1.a. Portage Files


    # Configuration Directories


    Portage comes with a default configuration stored in /etc/make.globals. When you
    look at it, you''ll notice that all Portage configuration is handled through variables.
    What Portage lists to and what they mean are described later.


    Since many configuration directives differ between architectures, Portage also
    has default configuration files which are part of your profile. Your profile is
    pointed to by /etc/make.profile link; Portage configurations are set in the make.defs
    files of your profile and all parent profiles. We''ll explain more about and the
    /etc/make.profile directory later.


    If you''re planning to change a configuration variable, don''t alter /etc/make
    globals. Use /etc/make.conf which has precedence over the previous files. You''ll
    also find an /etc/make.conf example. As the name implies, this is merely an example
    file - Portage does not read in this file.


    You can also define a Portage configuration as an environment variable, but we
    would recommend not to.


    # Profile-Specific Information


    We''ve already encountered the /etc/make.profile directory. Well, this isn''t
    exactly a directory but a symbolic link to a profile, by default inside /usr/portage/profiles
    although you can create your profiles elsewhere and point to them. This profile
    symlink points to the profile that your system defines.


    A profile contains architecture-specific information for Portage, such as a list
    of packages that belong to the system corresponding with that profile, a list
    of packages that don''t work (or are masked-out) for that profile, etc.


    # User-Specific Configuration


    When you need to override Portage''s behaviour regarding the installation of software,
    you will end up editing files within /etc/portage. You are highly recommended
    to use files within /etc/portage and highly discouraged to override the behaviour
    through environment variables!


    Within /etc/portage you can create the following files:'
  merge: -1
  pgno: 64
