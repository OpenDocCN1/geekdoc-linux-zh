    # 5. Environment Variables


    # 5.a. Environment Variables?


    What they are


    An environment variable is a named object that contains information used by one
    or more applications. Many users (especially those new to Linux) find this a bit
    weird or unmanageable. However, this is a mistake: using environment variables
    can easily change a configuration setting for one or more applications.


    # Important Examples


    The following table lists a number of variables used by a Linux system and describe
    their use. Example values are presented after the table.


    | Variable | Description |

    | PATH | This variable contains a colon-separated list of directories in which
    your system looks for executable files. If you enter a name of an executable (such
    as rc-update or emerge) but this is not located in a listed directory, your system
    will not execute it (unless you enter the full path, such as /) |

    | ROOTPATH | This variable has the same function as PATH, but this only lists
    the directories that should be checked when the root-user enters an account |

    | LDPATH | This variable contains a colon-separated list of directories in which
    the dynamic linker searches to find a library |

    | MANPATH | This variable contains a colon-separated list of directories in which
    the man search searches for the pages. |

    | INFODIR | This variable contains the path to the program used to list the list
    of files (with such as less or more) |

    | PAGER | This variable contains the path to the program used to change the list
    of files (with such or no name) |

    | EDITOR | KEDIRS | This variable contains a colon-separated list of directories
    which contain KDE-specific material. |

    | CLASSPATH | This variable contains a colon-separated list of directories which
    contain Java classes. |

    | CONFIG_PROTE | This variable contains a space-delimited list of directories
    which should be protected by Portage during updates. |

    | CONFIG_PROTE_MASK | This variable contains a space-delimited list of directories
    which should not be protected by Portage during updates. |


    Below you will find an example of all these variables:'
