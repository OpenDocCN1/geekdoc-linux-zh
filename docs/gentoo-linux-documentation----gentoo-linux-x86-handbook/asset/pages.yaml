    # A. Installing Gentoo


    # 1. About the Gentoo Installation


    I.a. Introduction


    Welcome!


    First of all, welcome to Gentoo. You are about to enter the world of choices and
    performance. Gentoo is about choices. When installing Gentoo, this is made clear
    several times -- you can choose how much you want to compile yourself, how to
    install Gentoo, system logger when want, etc.


    Gentoo is a fast, modern medium distribution with a clean and fresh design. Gentoo
    is built around free software and to hide from its users what is beneath the hood.
    Portage, the package maintenance system which Gentoo uses, is written in Python,
    meaning you can easily view and modify'
