    # 8.a. Filesystem Information


    What is fstab?


    Under Linux, all partitions used by the system must be listed in /etc/fstab. This
    file contains the mountpoints of those partitions (where they are seen in the
    file system structure), how they should be mounted and with special options (automatically
    or not, whether users can mount them'
  merge: -1
