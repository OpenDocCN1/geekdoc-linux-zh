    The final step is to merge all files onto the livesystem and register those in
    the Portage backend. ebuild''s this step "qmerge" and involves the

    following steps:


    +   - Execute the pkg_preinst() function if specified

    - Copy all files to the live livesystem

    - Register the files in the Portage backend

    - Execute the pkg_postinst() function if specified


    Run ebuild''s qmerge functionality to accomplish these steps:


    # Code Listing 8: Merging the ebuild on the livesystem


    ```

    # ebuild path/to/ebuild qmerge

