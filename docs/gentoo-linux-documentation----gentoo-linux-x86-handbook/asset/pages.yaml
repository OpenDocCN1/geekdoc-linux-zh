  md: '# 3. Portage Features


    3.a. Portage Features


    Portage has several additional features that make the Gentoo experience even better.
    Many of these features rely on carry software tools to improve performance, reliability,
    security, ...


    To enable or disable Portage features you can edit /etc/make.conf''s FEATURES
    variable which contains the feature keywords, separated by space. In some cases
    you will also need to install the additional tool to include the feature relies.


    Not all Portage supports are listed here. For a full overview, please consult
    the make.conf man page:


    # Code List 1: Consulting the make.conf man page


    ```

    $ man make.conf

    ```


    To find out WHAT FEATURES are default set, run emerge --info and search for the
    FEATURES variable or grep it out:


    # Code List 2: Finding out the FEATURES that are already set


    ```

    $ emerge --info | grep FEATURES

    ```


    3.b. Distributing Compiling


    Using distcc


    distcc is a program to distribute compilations across several, not necessarily
    identical, machines on a network. The distcc sends all necessary information to
    the available distcc servers (running distcc) to compile pieces of source code
    for the client. The net result is a faster compilation time.


    You can find more information about distcc (and how to use it with Gentoo) in
    the Gentoo Distcc Documentation.


    Installing distcc


    distcc ships with a graphical monitor to track when your computer is sending for
    compilation. If you use Gnome then put ''gnome'' in your USE variable. However
    if you don''t use Gnome and still like to have the monitor then you should put
    ''gtk'' in your USE variable.


    # Code List 3: Installing distcc


    ```

    # emerge distcc

    ```


    Activating Portage Support


    Add this to the FEATURES variable inside /etc/make.conf. Next, edit the MAKEOPTS
    to your liking. A known guideline is to fill in ''-X'' with the number of CPUs
    that distcc runs (including the current host) but you might have better results
    with other numbers.


    Now run distcc and enter the list of available distcc servers. For a simple example
    assume that we are using the available Distcc servers are 192.168.1.102 (the current
    host), 192.168.1.103 and 192.168.1.104 (two "remote" hosts):


    # Code List 4: Configuring distcc-daemons


    ```

    # distcc-config --set-hosts "192.168.1.102 192.168.1.103 192.168.1.104"

    ```


    Don''t forget to run the distcc daemon as well:


    # Code List 5: Starting the distcded daemons


    ```

    # rc-update add distccd default

    # /etc/init.d/distccd start

    ```


    3.c. Caching Compilation'
  merge: -1
  pgno: 54
- img_proc: true
  md: '# About ccache


    ccache is a fast compiler cache. When you compile a program, it will cache intermediate
    results so that, whenever you recompile the program, the compilation time is greatly
    reduced. In common compilations this can result in 5 to 10 times faster compilation
    times.


    If you are interested in the ins and outs of ccache, please visit the ccache homepage.


    Installing ccache


    To install ccache, run emerge ccache:


    ```

    Code List 6: Installing ccache


    # emerge ccache

    ```


    Activating Portage Support


    Open/etc/make.conf and add ccache to the FEATURES variable. Next, add a new variable
    called CCACHE_SIZE and add it to "2G":


    ```

    Code List 7: Editing CCCACHE_SIZE in /etc/make.conf


    CCACHE_SIZE="2G*"

    ```


    To check if ccache functions, ask ccache to provide you with its statistics. Because
    Portage uses a different ccache home directory, you need to set the CCACHE_DIR
    variable as


    ```

    Code List 8: Viewing cache statistics


    # CCACHE_DIR=/var/tmp/ccache ccache -s

    ```


    The /var/tmp/ccache location is Portage default cache home directory; if you want
    to alter this set the CCACHE_DIR variable in /etc/make.conf.


    However, if you would run it, it would use the default location of ${HOME}/.ccache,
    which is why you needed to set the CCACHE_DIR variable when asking for the (Portage)
    cache statistics.


    Using ccache for non-Portage Compiling


    If you would like to use ccache for non-Portage compilations, add /usr/lib/ccache/bin
    to the beginning of your PATH variable (before /usr/bin). This can be accomplished
    by editing /etc/env/d00base, which is the environment file that defines the PATH
    variable:


    ```

    Code List 9: Editing /etc/env/d00base


    PATH="/usr/lib/ccache/bin:/opt/*

    ```


    3.d. Binary Package Support


    Creating Prepackages


    Portage supports the installation of preprint packages. Even though Gentoo does
    not provide preprint packages by itself (except for the GRP snapshot) Portage
    can be made fully aware of preprint packages.


    To create a preprint package you can use quickpkg if the package is already installed
    on your system, or use the --buildpkg or --buildpkg-only options.


    If you want to create preprint packages for every single install, add buildpkg
    to the FEATURES variable.


    More support for creating preprint package sets can be obtained with Catalyst.
    For more information on catalyst please read the Catalyst Reference Manual and
    Catalyst Frequently Asked Questions.


    Installing Prepackages


    Although Gentoo does not provide one, you can create a repository where you store
    preprint packages. If you want to use this repository, you need to make Portage
    aware of it by having the PORTAGE_BINHOST variable point to it. For instance,
    if the preprint packages are on'
