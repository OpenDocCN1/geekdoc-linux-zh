  md: '# Code Listing 17: Example of an IP address


    | IP Address (numbers): | 192.168.0.2 | 11000000 10101000 00000010 |

    | IP Address (bits): | 192 | 168 | 2 |


    Such an IP address is unique to a host as far as all associative networks are
    concerned (i.e every host that you are able to reach must have a unique IP address).
    In order to distinguish between hosts inside and outside a network, the IP address
    is divided into two parts: the network part and the host part.


    The separation is with netmask, a connection of ones followed by a collection
    of zeros. The part of the IP that can be mapped on is the network-part, the other
    one is the host-part. As usual, the netmask can be written down as an IP-address.


    # Code Listing 18: Example of network/host separation


    | IP-address: | 192 168 0 2 |

    | 11000000 10101000 00000000 00000010 |

    | Netmask: | 11111111 11111111 11111111 00000000 |

    | 255 255 255 0 |

    | Network Host |


    In other words, 192.168.0.14 is part of our example network, 192.168.1.2 is not.


    The broadcast is an IP-address with the same network-part as our network, but
    with only one as host-part. Every host on your network listens to this IP address.
    It is truly meant for broadcasting packets.


    # Code Listing 19: Broadcast address


    | IP-address: | 192 168 0 2 |

    | 11000000 10101000 00000000 00000010 |

    | Broadcast: | 11000000 10101000 00000000 11111111 |

    | 192 168 0 255 |

    | Network Host |


    To be able to surf on the internet, you must know which host shares the Internet
    connection. This host is the gateway. Since it is a regular host, it has a regular
    IP address (for instance 192.168.0.1).


    We previously stated that each host has its own IP address. To be able to reach
    this host by a name (instead of an IP address) you need a service that translates
    a name (as dev.getoo.org) to an IP address (as /etc/resolv.conf). Such a service
    is called a name service. To use such service, you must define the nameserver
    in /etc/resolv.conf.


    In some cases, you may also serve as nameserver. Otherwise you will have to enter
