    # Optional: User Accounts


    If you plan on giving other people access to your installation environment or
    you want to use gentoo without root privileges (for security reasons), you need
    to create the necessary user accounts and change the root password.


    To change the root password, use the password utility:


    # Code List 9: Changing the root password


    ```

    # password

    New password: (Enter your new password)

    Re-enter password: (Re-enter your password)

    ```


    To create a user account, we first enter their credentials, followed by their
    password. We use useradd and passwd for these tasks. In the next, we create a
    user called "john".


    # Code List 10: Creating a user account


    ```

    # useradd -m -G users john

    # passwd john

    New password: (Enter john''s password)

    Re-enter password: (Re-enter john''s password)

    ```


    You can change your id from root to the newly created user by using su:


    # Code List 11: Changing user id


    ```

    # su - john

    ```


    Optional: Viewing Documentation while Installing


    If you want to view the Gentoo Handbook (either from CD or online) during the
    installation, make sure you have created a user account (Optional: User Accounts).
    Then press Alt-F2 to go to a new terminal and log in.


    If you want to view the documentation on the CD you can immediately run links
    to it:


    # Code List 12: Viewing the on-CD documentation


    ```

    # links /mnt/cdrom/docs/html/index.html

    ```


    However, it is preferred that you use the Gentoo Handbook as it will be more recent
    than the one provided on the CD. You can view it using links, but only after configuring
    your Network chapter (otherwise you won''t be able to go on the Internet to view
    the document):


    # Code List 13: Viewing the Online Documentation


    ```

    # links http://www.gentoo.org/doc/en/handbook/handbook-x86.html

    ```


    You can go back to your original terminal by pressing Alt-F1.


