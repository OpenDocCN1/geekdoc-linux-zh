  md: '# 240 CHAPTER 4: Basic Linux Tools


    Under Linux, there are two kinds of variables: environment variables and shell
    variables. The difference is simple: an environment variable is set by the system
    and is available to all users, while a shell variable is managed by the shell
    and available only when the user is logged in the system and running the shell.


    For the most part, you''ll use shell variables, even on a single-user Linux installation.
    Setting these variables is a matter of using a simple formula:


    ```

