  md: "# CHAPTER 3: Installing and Configuring XFree86 131\n\n# Virtual Terminals\n\
    \nLinux supports virtual terminals. A virtual terminal is a pseudo-tty UNIX terminal\
    \ connected to your screen. X uses up one virtual terminal, but you may have many\
    \ more.\n\nEach virtual terminal takes over your entire display and presents a\
    \ traditional UNIX textual terminal, much like what you see when you login. A\
    \ special key sequence allows you to change between virtual terminals. When you\
    \ do this, the screen gets cleared and you see the next virtual terminal.\n\n\
    The magic key sequence to change to a virtual terminal is Alt-Fn, where Fn is\
    \ one of your keyboard's function keys, such as F1. But watch out: In X, the magic\
    \ key sequence to change to a virtual terminal is not Alt-Fn, but rather Ctrl-Alt-Fn.\
    \ The discrepancy occurs because window managers capture all Alt-Fn keys.\n\n\
    ![](img/05da311512608405596dd882623b9142_162_0.png)\n\n> Most laptops have a special\
    \ Fn key that's used to provide a second set of functions to the keyboard function\
    \ keys. The Fn key on a laptop keyboard should not be confused with the Fn notation\
    \ used here.\n\nA virtual terminal is not very worthwhile when you have a whole\
    \ screen with multiple xterm terminal windows. The X environment allows you to\
    \ use the font of your choice, which brings a great many, supports a scrollbar,\
    \ and copies and pastes—none of which the virtual terminals do. So, we rarely\
    \ use a virtual terminal.\n\nBut there's one place where a virtual terminal comes\
    \ in handy: if your X display gets locked up, you can switch to another virtual\
    \ terminal and Kill off all the X processes.\n\nThe VTSysReq option in Table 3.8\
    \ allows you to use Alt-SysReq-Fn instead of the default Ctrl-Alt-Fn.\n\nPutting\
    \ this all together, our Keyboard section follows:\n\n+   Section \"Keyboard\"\
    \n  Protocol \"Standard\""
  merge: -1
  pgno: 162
- img_proc: true
