    # Other Text-Editing Tools


    If these text editors don''t fit your needs, you''re welcome to try out some of
    the other text editors:


    +   - Vim is a vi-compatible text editor (only the q command is missing). It adds
    to the basic-line vi set with several shell-like features, including command-line
    history, filename completion, and more.

    - Jove is Jonathan''s Own Version of Emacs, and it works pretty much like emacs
    in the major ways, using buffers and such. If you year for emacs in text mode
    and you installed emacs to run under the X Window System, you can use jove and
    pretty much feel right at home (there are some areas where jove differs significantly
    from emacs; you can read all about it in the online man pages).

    - Joe is Joe''s Own Editor (notice how these software creators name things after
    themselves?), and it''s basically a text editor that supports some old WordStar
    conventions. (History lesson: WordStar is a text editor that used to be very big
    in the MS-DOS world; Windows'
  merge: -1
