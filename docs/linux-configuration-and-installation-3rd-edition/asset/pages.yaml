  md: "# 384 CHAPTER 7: Linux and Telecommunications\n\n# Expanding Your Reach via\
    \ Modem\n\nEven if you’re using Linux as a standalone system, you’re not limited\
    \ to your little neck of the woods. Linux and its many accompanying tools allow\
    \ you to connect via modem to other parts of the world, whether it be bulletin-board\
    \ systems (BBSes), online services, or the Internet. Thanks to its reliance on\
    \ good UNIX software, Linux also contains several tools for connecting to character-based\
    \ systems like CompuServe or local bulletin-board systems.\n\nIn this chapter\
    \ we will cover the many Linux features for serial communications, beginning with\
    \ a very functional telecommunications program, seyon, followed by discussions\
    \ of the minicom, xminicom, and term packages, and ending with a discussion of\
    \ older UNIX telecommunications tools like rzsz. All the tools covered here are\
    \ included in the Slack Linux distribution.\n\n# Seyon: Telecommunications from\
    \ Linux\n\nThe seyon telecommunications program (as immortalized in Figure 7.1),\
    \ developed by Muhammed M. Saggaf is a surprisingly functional terminal-emulation\
    \ package for the X Window environment. \n\nSeyon supports many features that\
    \ can be found in popular telecommunications packages like Procomm, including\
    \ a dialing directory, support for several protocols (including Zmodem), various\
    \ emulation modes (including DEC VT102, Tektronix 4014, and ANSI), and translation\
    \ modes (for communicating with PC-based services).\n\nTo use seyon, you need\
    \ to have a modem and a connection to a telephone line. When you installed Linux,\
    \ you were prompted about the location of the modem on your PC—in other words,\
    \ the COM port connected to your modem (if your PC was typical, this would have\
    \ been COM1 or COM2). This information was then translated into a device file\
    \ called /dev/modem, which is used by input for seyon.\n\nTherefore, to launch\
    \ seyon, use the following command line:\n\n```\ngilbert:~$ seyon -modems /dev/modem\n\
    ```"
  merge: -1
