    # Using the Z Option


    As we''ve mentioned repeatedly here, you''ll probably use the **tar** command
    in conjunction with **gzip**, creating an archived and compressed file. Because
    Linux works with tools from the Free Software Foundation, you can expect some
    integration of similar tools (as you''ve see with **emacs** and **texinfo**).
    This integration is extended with an option unique to the GNU versions of **tar**
    and **gzip**: the z option. This handy function allows you to both archive and
    compress a file or set of files by using the z options with **tar**. For example,
    you could use the following command line to both archive and compress a set of
    files:


    ```

    gilbert:$- tar cvzf archive.tar.gz

    ```'
