  md: '# 74 CHAPTER 2: Installing Linux


    There may be cases where DOS does see CD-ROM drive with no problems but Linux
    cannot. In these cases you won''t necessarily know about this problem until you
    try to install Linux from the CD-ROM and are told that the CD-ROM drive does not
    exist. In this case, there are two ways to go: Search for a Linux bootkernel that
    supports your CD-ROM or use DOS to copy the installation files to a hard partition.
    The first option was discussed earlier in this chapter; the second option will
    be discussed later in this chapter.


    ![](img/05da311512608405596dd882623b9142_105_0.png)


    The setup program gives you a set of choices about the CD-ROM you''re installing.
    The choices are straightforward; if you''re using a Sony or SoundBlaster CD-ROM
    interface, you certainly would have known about it before now (you would have
    needed the proper bootdisk to get to this point), so there are no surprises on
    this menu.


    # Should You Keep Some Stuff on the CD-ROM?


    For those of you with smaller hard drives, Slackware gives you the option of doing
    a partial installation, leaving some of the program files on the CD-ROM and running
    it from there. The advantage, of course, is that you keep hard disk space free
    that normally would be devoted to Linux. The disadvantages come in the form of
    speed—accessing your CD-ROM drive with Slackware. Our recommendation, of course,
    is to install everything to your hard drive; this offers the best performance
    overall, and it''s the easiest system to maintain.


    However, Slackware does an alternative that uses the CD-ROM, as slakst links /usr
    to /cdrom/live/usr and runs everything from the CD-ROM. This yields a Linux disk
    installation of 10 megabytes or so. The disadvantage, of course, is that you''ll
    need to completely reinstall Linux if you decide to upgrade your system.


    If it sounds like we''re a little negative about the idea of running Linux off
    of the CD-ROM, it''s because we are. If you''re careful about installation, you
    can easily install only the parts of Linux you''re really going to use. And by
    running partially from the CD-ROM, you''re sacrificing both speed and flexibility.


    If you''re doing a normal install, choose the slakware selection.'
  merge: -1
