  md: '# CHAPTER 3: Installing and Configuring XFree86 163


    This uses the default configuration file, `/usr/X11R6/lib/X11/fs/config`, and
    runs on TCP/IP port 7000 (an arbitrary port to which the X font server defaults).


    Once started, we can verify that the font server is running by using the `fsinfo`
    command:


    ```

    gilbert:/$ fsinfo -server hostname:port

    ```


    You need to fill in the hostname and port number. For example, with a hostname
    of `eric` and the default port number of `7000`, the command would be:


    ```

    gilbert:/$ fsinfo -server eric:7000

    ```


    You should see output like the following:


    ```

    name of server: eric:7000

    version number: 2

    vendor string: X Consortium

    vendor release number: 6000

    maximum request size: 16384 longwords (65536 bytes)

    number of catalogues: 1

    all

    Number of alternate servers: 0

    number of extensions: 0

    ```


    Once you verify that the font server is running, you can set up XFree86 to communicate
    with the font server. This is necessary so that X applications can take advantage
    of the font server''s fonts.


    To get the X server ready to accept the font server, you need to adjust its font
    path, or `fp`. Enter the following commands:


    ```

    gilbert:/$ xset +fp tcp/eric:7000

    gilbert:/$ xset fp rehash

    ```


    In your case, you need to replace `eric` with your system’s hostname. The first
    command tells the X server to use a TCP/IP port as a sort of font'
