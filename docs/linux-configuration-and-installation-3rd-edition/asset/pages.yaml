    Figure 9.3 Incoming mail.


    As always, end input from the keyboard by typing Ctrl-D. Some e-mail programs
    also accept a single period on its own line to terminate the message, instead
    of Ctrl-D. The procedure would be the same if you were sending a message to a
    user on a remote machine:


    ```

    gilbert:$$ mail reichard@mr.net

    ```


    You can send the same message to multiple users with the -t option:


    ```

    gilbert:$$ mail -t johnsone@camax.com reichard@mr.net

