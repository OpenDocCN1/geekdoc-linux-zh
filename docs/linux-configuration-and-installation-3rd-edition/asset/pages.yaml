  md: '# 482 CHAPTER 10: Programming in Linux


    good to remember that gawk applies each gawk command to every record, that is,
    every line of text, in the input file. A commandlike (print) says that each line
    in the input file should be printed.


    The gawk BEGIN command lists what to do before reading each line of text. For
    example:


    ```

    BEGIN { print "Workers for Spacy Sprockets"; print "" }

    { print }

    ```


    The preceding gawk program will print out the text "Workers for Spacy Sprockets"
    before printing each line in the workers file. One the command line, this will
    look like the following (if we stored the preceding gawk program in a file named
    gawk.2):


    ```

    gilbert:$ gawk -f gawk.2 workersnWorkers for Spacy Sprockets

    ```


    Eric 286 555-6674 erc 8

    Geisha 280 555-4221 geisha 10

    Kevin 279 555-1112 kevin 2

    Tom 284 555-2121 spike 12


    The print "" prints a blank line.

    The END statement simply lists commands to execute after all data is read. Here''s
    where the NR command, number of records (or lines) comes in, in the following
    example:


    ```

    BEGIN { print "Workers for Spacy Sprockets"; print "" }

    { print }

    ```


    ```

    END { print "There are ",nNR,

    * employees left after the latest wave of layoffs." }

    ```


    This example uses cleaner formatting for the END statements. It would make no
    difference in the output if we had instead placed the entire'
