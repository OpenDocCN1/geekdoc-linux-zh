    # Midnight Commander


    The Midnight Commander is a clone of the Norton Commander, one of the more useful
    pieces of software written for the MS-DOS operating system. The Midnight Command
    approaches the functionality of the Norton Commander, allowing you to move, rename,
    and copy files and directories.


    Basically, the Midnight Commander divides file management into four screens: Two
    display file directories (so you can see where files and directories are going
    and where they have been), one is a shell command line (where you can directly
    enter shell commands), and one'
