  md: 'To edit the file, you can use the basic movement and editing keys on the keyboard.
    When it''s time to save your file, you can select Save Buffer (Ctrl-x-s) from
    the File menu; if you''re working with an existing file, you should select Save
    Buffer As (Ctrl-x-w) from the File menu, but using the existing filename.


    To quit emacs, select Exit Em from the File menu or type Ctrl-x Ctrl-c. If you
    haven''t saved any changes to the file, *emacs* will make sure you want to quit
    and give you the option of saving the file at that time.


    # The Undo Command


    Emacs allows you to undo your most recent action; naturally enough, the *Undo*
    menu selection from the Edit menu does just this. (The keyboard equivalent is
    *Ctrl-_*)


    # Editing Text


    When you edit existing text, you can go one of two ways. Old-time UNIX and *emacs*
    users make a big deal about the scads of commands that are used to delete and
    edit text. We''re modernists (relatively speaking), so we''re into the more recent
    (and handler) methods of doing things.


    For example, to cut and copy text, there''s a host of commands for cutting existing
    text, saving it to a buffer, and then reinserting the buffer in either the existing
    file or a new file. We find it''s a lot easier to use the mouse to mark a section
    of text and then use the menu choices in the Edit menu to make the changes (cut,
    copy, and paste). If you''re used to this trinity of choices from the Windows,
    Macintosh, or OS/2 worlds, you''ll feel comfortable with them under Linux:


    +   - The Cut (Ctrl-w) menu choice cuts the marked text and saves it to another
    buffer.

    - The Copy (Alt-w) menu choice copies the marked text to a buffer, leaving the
    marked text intact.

    - The Paste (Ctrl-y) menu choice pastes the text in the buffer where the cursor
    is positioned.


    There are two things to note here: the keyboard equivalents for these mechanisms
    aren''t the same as the keyboard equivalents under Windows, Macintosh, or OS/2,
    and marked text is grayed when you select it with the mouse but not when you release
    the mouse. The text is still marked; you just can''t tell.'
