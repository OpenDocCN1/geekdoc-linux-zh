    # Summary


    This chapter began with a list of neat Linux text editor and then went into an
    extended discussion of the emacs text editor. Part of the GNU Project, emacs is
    a full-featured text editor that runs both in character mode and under the X Window
    System. While emacs may take some getting used to for some users, it''s easy to
    understand and powerful at the same time—a combination you don''t find every day
    in the Linux software world.


    Linux contains a number of text processors, which take the output from a text
    editor and turn it into something a printer can understand. Primary among these
    tools are groff, the GNU version of troff; Tex, the high-end text-processing tool
    from Donald Knuth; and texinfo, the formatting tool from the Free Software Foundation.
    In addition, sed was covered as a text processor, although it contains elements
    of both text editors and text processors.


    Printing straight text is one thing, but printing graphics and text under Linux
    is quite another. Luckily, there are tools for editing and printing PostScript-formatted
    document, in the form of Ghostscript.'
