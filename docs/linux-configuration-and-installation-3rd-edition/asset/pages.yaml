- img_proc: true
  md: '# CHAPTER 5: Linux Applications 259


    Although we''re not going to get into the religious war that separates vi and
    emacs editors, we think that emacs is worth checking out, especially if you''ve
    not used either editor extensively. Emacs offers many things not found in vi:


    +   - Emacs allows you to edit more than one file at a time and to cut and paste
    between files.

    - Emacs features online help—a rarity in the Linux/Unix world.

    - A spelling checker, based on the UNIX spell command, can be accessed from a
    pull-down menu.

    - With pull-down menus and a graphical interface (though, sadly, without what-you-see-is-what-you-get
    capabilities), emacs comes closest to a true word processor in the Linux world.


    Beginners will probably get a little more out of emacs than other Linux text-editing
    tools, if only because the basic commands are always available in pull down menus.
    In addition, emacs can be used for a host of other functions, including the reading
    of electronic mail and Usenet news, and the editing of source-code files for C,
    Lisp, and TeX.


    This discussion will center around the X Window version that ships with the Slack
