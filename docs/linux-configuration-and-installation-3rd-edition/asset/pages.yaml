    endif

    ```


    After a while, you should see a graphical login screen. It is best to test xdm
    using init 4 first, to see if everything is set up correctly. Try to login and
    see what happens. If it works, you''re in business and can confidently modify
    the /etc/inittab file.


    The xdm configuration files are in /usr/lib/X11/xdm. If you want to change the
    background color for the login screen, look in Xsetup_0 in that directory. You
    probably won''t have to edit in /usr/lib/X11/xdm, especially for a stand-alone
    Linux system without terminals on the network. (If yours are more demanding, you''ll
    need to look into a book about X, as The UNIX System Administrator''s Guide to
    X; see Appendix A for more on this.)'
