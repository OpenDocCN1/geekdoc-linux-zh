    To use **gawk** with the Linux **sort** utility, we can sort the output of the
    last example:


    ```

    gilbert:$ awk ''$1 ~ /Eric/,/Kevin/ {print $2, $1}'' workers |

    sort

    279 Kevin

    280 Geisha

    286 Eric

    ```


    (Please note that this is sorting on the leading number.)

    **Gawk** also provides some summary abilities. The NR symbol in a **gawk** command
    returns the number of records, for example.


    We can combine this with **gawk''s** ability to total fields in an **gawk** program.


    # Gawk Programs


    You''re not limited to what fits in on the command line with **gawk**. You can
    also store a series of **gawk** commands in a file and then use **gawk** to execute
    the file.


    For example, we can store our simplest **gawk** command, `{print}`, in a separate
    file and use the following **gawk** command:


    ```

    gilbert:$ awk -f gawk.1 workers

    Eric 286 555-6674 erc 8

    Geisha 280 555-4221 geisha 10

    Kevin 279 555-1112 kevin 2

    Tom 284 555-2121 spike 12

    ```


    In this case, we''re assuming that the file **gawk.1** contains our very simple
    **gawk** program:


    ```

    { print }

    ```


    You can combine this with the **gawk BEGIN, END, and NR** commands to make a more
    complex **gawk** program. When working with this, it''s'
