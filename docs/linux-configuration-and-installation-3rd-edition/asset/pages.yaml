    # Slurping the News


    As the Internet grows in popularity, more and more of the Usenet news gets transmitted
    over the Internet than the older uucp phone-line method.


    Over the Internet, the Usenet news jumps from one machine to another through the
    NNTP. If you use NNTP to get your news, you can view the news with a Web browser
    as Netscape Navigator.


    In addition, a freeway program called Slurp can acquire news for you via NNTP.
    This is very useful for downloading select Usenet newsgroups to your Linux system.
    You can then read the messages offline with a newsreading program such as xrn,
    nn, or trn. We''ve included Slurp on the second CD-ROM.


