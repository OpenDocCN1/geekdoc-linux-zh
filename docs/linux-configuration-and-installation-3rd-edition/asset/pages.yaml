    > The Bourne SHell, bash, also supports the dir command in a limited sense. The
    dir command does the same thing as the ls -l command, which will be explained
    later in this section. DOS users will be relieved to know that their familiar
    dir command can also be used under Linux.


    You can use one of the many command-line options to the ls command. For example,
    if you use the ls command in your home directory, you''ll discover that there
    are no apparent files to be found:


    ```

    gilbert:$ ls

