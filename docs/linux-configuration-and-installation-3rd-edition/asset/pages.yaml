  md: 'pretty much wiped it out.) When you think of WordStar, you should think of
    Ctrl-key combinations used to perform basic tasks, and that''s exactly what you''ll
    find in joe.


    +   - If you''re a UNIX old-timer, you might feel comfortable with the ed text
    editor (which can also be summoned under the red command). The Slackware Linux
