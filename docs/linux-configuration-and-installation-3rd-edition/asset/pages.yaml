  md: '# CHAPTER 4: Basic Linux Tools


    Linux can be fairly harsh when you''re moving and renaming files. For example,
    the `mv` command will overwrite an existing file with a renamed file and not warn
    you. If you ran the following command line and a file named `aardvark` already
