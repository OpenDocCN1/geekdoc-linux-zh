    If you''ve installed Slack from the CD-ROM, and then the system refuses to see
    the drive when you reboot, you''ll need to install a new kernel or add the support
    through loadable kernel modules.


    # Using Kernel Modules


    The kernels used in Slack are designed to support the hardware needed to get Linux
    installed. Once you''ve installed and rebooted your system, you may find that
    your kernel lacks support for some of your hardware, such as a CD-ROM drive or
    Ethernet card. In this case, there are a couple of ways you can add this support.
    The traditional way would be to compile a custom Linux kernel that includes drivers
    for all your hardware. This requires that you have the Linux source code and C
    compiler installed and that you know exactly which options need to be compiled
    into your kernel. In short, compiling a custom kernel can be a rather difficult
    task for Linux beginners.


    Kernel modules to the rescue! If you''ve installed device drivers before MS-DOS,
    you''ll probably find this familiar way of adding support—just think of the module
    configuration file /etc/rc.d/modules being the Linux counterpart of DOS''s CONFIG.SYS
    file.'
