    # Creating Directories with Mkdir


    The mkdir command is used to create directories. If you plan on using Linux for
    most of your day-to-day stuff, we advise creating directories to help organize
    the many files Linux (and any other version of UNIX, for that matter) creates.
    Using mkdir is simple:


    ```

    gilbert:-$ mkdir directory

    ```


    where directory is the name of the directory you want to create. To create a directory
    named letters in your home directory, you''d use the following command:


    ```

    gilbert:-$ mkdir letters

    ```


    To see if the directory was really created, you can use the ls command:


    ```

    gilbert:-$ ls

    letters/    text

    ```


    You can also use it to create a new directory elsewhere in the directory hierarchy:


    ```

    gilbert:-$ mkdir /users/kevin/letters

    gilbert:-$ ls /users/kevin

    letters/

    ```


    Mkdir can create more than one directory on a command line:


    ```

    gilbert:-$ mkdir letters data

    gilbert:-$ ls

    data/    letters/    text

    ```


    Mkdir can also create a directory and a subdirectory in a single command line:'
