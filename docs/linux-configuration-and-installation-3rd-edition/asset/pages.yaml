    # Using the Mouse


    When you installed Slackware Linux, you were asked about installing

    mouse support for Linux when running in a command-line mode—

    chiefly, the gpm server—and at that time we recommended that

    you do not, because gpm support may conflict with the mouse

    functionality of the X Window System.


    However, if you''re not going to use the X Window System and you

    want to use the mouse in Midnight Commander, you should go back to the

    setup program and install the gpm mouse support.


    If you run the Midnight Commander under X Window, you should

    have the functionality of the mouse.


    You''ll want to use Midnight Commander with a mouse; its greatest

    virtues lie in its ability to click on files and directories in order to

    perform further actions on them. You can perform all of your Slackware

    Linux computing tasks from within Midnight Commander; to launch an

    application, you can just double-click on its executable command, and if

    you want to associate a filename extension with an application (say,

    associating all files ending in dec or txt (emacs), you can do so.


