    +   - The device name of the Linux partition you intend to boot as /dev/hda2

    - The path and filename of the Linux kernel you plan to use as C:\LOADIN\ZIMAGE

    - Whether the partition should be mounted read-only (as in the case of a native
    Linux partition, so it can do safe filesystem checking at boot time) or read-write
    (needed by UMSDOS, which does not check filesystems at boot


    This information is fed to the LOADLIN.EXE program, which in turn loads Linux
    into memory and boots it. Here''s an example:


