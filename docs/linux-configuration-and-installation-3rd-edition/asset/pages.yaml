  md: '# CHAPTER 10: Programming in Linux 479


    In our case, gawk would print the following to the screen:


    ```

    Geisha 280 555-4221 geisha 10

    ```


    Not every action has to be the result of matching a specific pattern, of course.
    In gawk, the tilde (~) acts as a relational operator, which sets forth a condition
    for gawk the tilde to use. There are a number of other relational operators available
    to gawk users who allow gawk to compare two patterns. (The relational operators
    are based on algebraic notation.) Gawk supports the same relational operators
    found in the C programming language; they are listed in Table 10.7.


    # Table 10.7 Gawk Relational Operators


    | Operator | Meaning | Usage |

    | --- | --- | --- |

    | < | Less than | $1 < "Eric" returns every pattern with ASCII value less than
    "Eric" |

    | <= | Less than or equal to | $1 <= "Eric" |

    | == | Equals | $1 == "Eric" returns instance of "Eric" |

    | != | Does not equal | $1 != "Eric" returns field not containing the string "Eric"
    |

    | >= | Greater than or equal to | $1 >= "Eric" returns every field greater than
    "Eric" |

    | > | Greater than | $1 > "Eric" returns every field greater than "Eric" |


    We could increase the sophistication of gawk searches in a number of ways. Firstly,
    we could incorporate the use of compound searches, which use three logical operators:


    +   - &&&, which works the same as the logical AND

    - ||, which works the same as the logical OR

    - !, which returns anything NOT equaling the original'
