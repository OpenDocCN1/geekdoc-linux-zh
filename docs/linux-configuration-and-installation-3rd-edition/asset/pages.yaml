  md: 'programs, they take up more memory (real and virtual). To help alleviate this
    problem, Linux supports shared libraries, similar to Windows DLLs, or Dynamic
    Link Libraries. The whole purpose is that many programs can reference a single
    copy of the library loaded into memory. For X Window programs, this saves a lot
    of RAM.


    The problem with Linux shared libraries is that they are very tightly linked to
    their version numbers. If you upgrade your version of Linux, many old applications
    may still demand the old versions of the shared libraries, and you may no longer
    have these old versions on your system. If you have a lot of Linux programs that
    came only in binary format (Netscape Navigator is a common program in this category),
    you either need to load the old shared libraries or wait until all the programs
    you use get upgraded. If you have the source code for the program, you can simply
    recompile and relink, and everything should be OK.


    # Programming with X


    Linux comes with a number of X Window libraries, ready both for you to program
    with and for you to use when compiling freeware X Window applications. Unfortunately,
    Linux does not come with the Motif libraries, which are necessary to compile a
    number of neat programs, including the Mosaic Internet browser. (You can purchase
    the Motif libraries from a number of third parties, though; you see Appendix A
    for details. Or, you can try a freeware version of the Motif API, called LessTif,
    which is described later).


    When compiling X programs, you normally don''t have to do anything special to
    link, other than adding the X libraries to your cc command line. The X Window
    include files should be in the proper place, /usr/include/X11 (actually a symbolic
    link to /usr/X11R6/include/X11, but good enough for the compiler).


    To compile and link an X program, you can use the following command line:


    ```

    cc -o foo foo.c -lXaw -lXt -lExt -lX11 -lXSM -lXICE

    ```'
