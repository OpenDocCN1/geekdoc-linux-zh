  md: '# CHAPTER 2: Installing Linux


    # Before You Install Linux


    Now that you have the perfect PC for running Linux, it’s time to prepare for the
    installation. No, you can''t just install Linux from the accompanying CD-ROMs;
    you must first configure your hard drive and create boot floppies. Neither step
    is particularly difficult. Here, we''ll cover how to create boot floppies for
    booting Linux, followed by a discussion of preparing your hard drive for the Linux
    installation. The actual installation process is:


    +   * Create boot and root floppies

    * Prepare your hard drive for installation

    * Boot Linux from boot and root floppies

    * Install Linux from the CD-ROM


    In the following steps, we’re assuming you already have an Intel-based PC up and
    running with the MS-DOS operating system installed correctly, because you’ll need
    to copy some files from the CD-ROM onto your hard drive. (On a PC, you’ll need
    to install special drivers to use the CD-ROM drive; these drivers ship with the
    CD-ROM drive). This doesn’t need to be the PC on which you plan to install Linux—it
    just needs to be a PC with a DOS command line and access to the CD-ROM drive.


    ![](img/05da311512608405596dd882623b9142_73_0.png)


    > The procedures in this chapter are closely tied to the installation and configuration
    routines found on the accompanying CD-ROMs. Other distributions of Linux are not
    exactly the same. If you’re using a distribution of Linux other than the Slackware
    distribution on the accompanying CD-ROMs, you can still follow along, keeping
    in mind that your steps may differ.


    # Creating Boot and Root Floppies


    Your first steps will be to create two floppy disks used to boot Linux: the boot
    and root diskettes. The boot diskette is the diskette used (as the name implies)
    to boot the PC, while the root diskette contains a set of Linux commands (actually,
    a complete mini-Linux system). Creating these disks is probably the best way to
    install Linux, although it is'
  merge: -1
  pgno: 73
- img_proc: true
  md: '# CHAPTER 2: Installing Linux 43


    possible to install Linux without using any floppy disks using LOADLIN.EXE, a
    DOS program that loads Linux from an MS-DOS prompt. We''ll cover this option it
    later, but unless your floppy disk doesn''t work under Linux it is recommended
    that you install using a bootdisk and a rootdisk.


    Your next step is to determine which bootdisk and rootdisk images you''ll be using
    and writing the images onto formatted floppy disks. Selecting the disk images
    to use (especially the bootdisk) can be a relatively large task, it warrants its
    own section.


    # Choosing Bootdisk and Rootdisk Images


    Linux needs to know alot about your PC''s hardware, and that knowledge begins
    the second you boot the system. That''s why you need to put some thought into
    selecting your bootdisk and rootdisk images.


    Before we go any further, we should explain what bootdisk and rootdisk images
    are. Linux needs to boot from floppies initially, and it needs to know what sort
    of hardware it''s working with. When you boot Linux for the first time, the information
    is contained on the bootdisk and rootdisk. To create a bootdisk and a rootdisk,
    you need to select the proper image. You''ll then use the RAWWRITE.EXE utility
    to copy the image byte-for-byte to the diskette.


    How do you select the proper image? The first step is to determine the disk size
    of your drive A;, which you boot the system from. If you''re using a 3.5-inch
    disk as drive A;, you''ll need to grab an image from the bootdsks.144 directory.
    This is so labeled because the capacity of a 3.5-inch high-density floppy is 1.4
    megabytes.) If you''re using a 5.25-inch disk to boot from, you''ll need to grab
    an image from the bootdsks.12 directory. (This is so labeled because the capacity
    of a 5.25-inch high-density floppy is 1.2 megabytes.)


    If you look inside either directory, you''ll see a list of filenames ending in
    .I (for IDE) or .S (for SCSI). (The filenames are the same in both directories;
    it doesn''t matter from this point which directory you grab the image.) Each image
    supports a different set of hardware; a list of the files and supported hardware
    is in Tables 2.1 (for IDE bootdis) and 2.2 (for SCSI bootdis).'
