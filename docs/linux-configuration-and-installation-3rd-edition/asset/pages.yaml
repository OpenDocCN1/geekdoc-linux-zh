    # The Sticky Bit


    In our continuing obsession with security, we present information about the sticky
    bit. In the past, UNIX hackers used to get around file permissions by messing
    with entire directories, as most system administrators would forget to set restrictive
    permissions for the directory itself.


    The sticky bit was a response to this security problem. Linux allows you to set
    the sticky bit, which makes a directory impenetrable to everyone but the owner
    of a directory and the root user. To set the sticky bit, use the chmod command
    in the following manner:


    ```

    gilbert:-$ chmod +t directoryname

    ```


    Once the sticky bit is set, no one (except the root user and the owner of the
    directory) has the ability to move or delete files in a directory, no matter what
    permissions are associated with a file.


