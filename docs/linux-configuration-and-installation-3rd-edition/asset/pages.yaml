    required that the files be decompressed prior to use, but this is not necessary
    anymore. The kernel on the bootdisk will detect that rootdisk is compressed and
    will automatically decompress the disk as it is loaded into RAM. This allows the
    use of a 1.44MB uncompressed image for both 1.44MB and 1.2MB floppy drives.


    Most users will use COLOR.GZ rootdisk image.


    # Should You Use UMSDOS?


    The UDOS filesystem allows you to install Linux in an MS-DOS directory on an existing
    DOS partition. The advantage of this is that you won''t need to reformat or partition
    your existing system. There are two disadvantages to using this system, however.


    First, the UMSDOS system is much slower than a native Linux filesystem. This is
    especially true of machines with 8 megabytes of memory or less—UMSDS is virtually
    unusable on a 4MB machine. The second disadvantage of UMSDOS has to do with a
    shortcoming of the MS-DOS FAT filesystem. MS-DOS allocates space for files in
    units clusters. A cluster is 4K or 8K in size. This means that the smallest file
    that can be created on a UMSDOS filesystem takes up a full cluster (4096+ bytes),
    even if the file is much smaller. Linux contains many such files, including symbolic
    links and device entries. As a result, installing with UMSDOS may require more
    drive space than installing with a native Linux filesystem.


    Now that you''ve chosen your bootdisk and rootdisk images, it''s time to actually
    create the bootdisk and rootdisk.'
