    This indicates that the default object file format on Linux is now ELF, as expected.


    > The term a.out, unfortunately, means different things in different contexts.
    You compile a C program with gcc, the default output filename remains a.out. Even
    so, this a.out file will appear in ELF object file format, not the older object
    file format, called a.out format. This is yet another confusing part of Linux.


    ![](img/05da311512608405596dd882623b9142_481_1.png)


    If for some reason you need to force gcc to compile in a.out format, you can use
    the following command in place of gcc:


    ```

    gcc -b i486-linuxaout -o foo.c -o foo

    ```


    This command requires the a.out libraries. If you did not load them, this command
    will fail.


