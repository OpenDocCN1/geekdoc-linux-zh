    # Video-Capture Boards


    Slack Linux doesn''t support any video-capture boards right out of the box. To
    use such a board, you''ll need to make a driver, and then go out and grab that
    from the Internet. Boards with Linux drivers are available: FAST Screen II (ftp://sunsite.unc.edu/pub/linux/apps/video/ScreenMachineII.1.2.tar.gz),
    ImageNation Cortex I (ftp://sunsite.unc.edu/pub/linux/apps/video/cortex.drv-0.1.tar.gz),
    ImageNation CX100 (ftp://sunsite.unc.edu/pub/linux/apps/video/drv-0.1beta.tar.gz),
    Pro Video Studio (ftp://sunsite.unc.edu/pub/linux/apps/video/PMS-grabber-2.0.tar.gz),
    Quantum WinVision video card (ftp://sunsite.unc.edu/pub/linux/apps/video/frgrabber-1.0.tar.gz),
    Video Blaster/Rombo Media Pro+ (ftp://sunsite.unc.edu/pub/linux/apps/video/vid_src.gz),
    and VT1500 TV cards (ftp://sunsite.unc.edu/pub/linux/apps/video/vt1500-0.5.tar.gz).


    # Uninterruptible Power Systems


    Slackware Linux doesn''t support UPSes out of the box, but there are drivers available
    for APC SmartUPS (ftp://sunsite.unc.edu/pub/linux/system/UPS/apcd-0.1.tar.gz)
    and general UPSes with RS-232 monitoring port (known as the “unipower” package)
    (ftp://sunsite.unc.edu/pub/linux/system/UPS/unipower-1.0.0.tgz). Others have managed
    to interface Linux with other UPSes; for more details, check out the UPS-HOWTO,
    with the accompanying CD-ROM.'
