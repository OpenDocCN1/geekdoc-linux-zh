    # Using FIPS to Divide Your Hard Drive


    After you make your backup


    Basically, FIPS works by creating a new partition on the physical end of the drive.
    Before the FIPS utility does this, you must first defragment your hard drive.
    A word about how a PC’s hard drive stores data is in order here.


    When a PC writes to a hard disk, it writes to clusters on the disk. Generally
    speaking, this writing is done sequentially; the first clusters appear at the
    physical beginning of the disk. As you use the system, you inevitably write more
    and more to the hard drive, and as you delete some data the clusters it occupied
    are free; at the same time, new data is written to the end of the disk. Any hard
    disk that’s been in use for a while will have data scattered throughout the physical
    drive. (This is why hard drives slow down when they fill with data; the drive
    head must physically hop around the drive to retrieve scattered data.)


    When you defragment your hard drive, you’re replacing the free clusters at the
    beginning of the drive with data from the end of the drive. While not purely sequential,
    your data is crammed at the beginning of the hard drive. This improves disk performance—because
    your data is physically closer together, the drive head spends less time retrieving
    data that was scattered in the past.'
