    # Linking Files


    Linking allows you to create links to other files. As a matter of fact, when you
    installed Linux, you unwittingly set up dozens of linked files (which''d see if
    you did an ls -l listing of many the XFree86-related directories). If you''re
    a single user, you probably won''t have much need to link files; after all, you''re
    not sharing data with anyone else, and you''re not necessarily trying to distribute
    data efficiently in limited disk space.


    However, if you''re using Linux on a network, you might find advantageous to create
    a linked file or two. For example, you''re working with Pat and Eric on a large
    project, and you want to share a file containing important addresses. This file
    is updated regularly by all of you. Instead of all three of you maintaining separate
    files and trying to synchronize the changes regularly, the better move would be
    to create one main file and create links to that file. In this way, all changes
    can be seen by the other users, and there''s less of an administrative'
  merge: -1
  pgno: 264
- img_proc: true
  md: '# CHAPTER 4: Basic Linux Tools


    hassle in keeping the file current. It also cuts down on the hard disk space needed,
    as there''s only one file actually stored on the hard drive.


    To link a file named addresses to Eric''s home directory, you''d use the following
    command line:


    ```

    gilbert:-$ ln addresses /home/eric

    ```


    To link a file named addresses to Pat''s home directory, you''d use the following
    command line:


    ```

    gilbert:-$ ln addresses /home/pat

    ```


    After this is, Eric and Pat will see the file addresses in their directories.
    However, the actual file won''t be in their directory; instead, a link to the
    file addresses in your home directory will be there. There''s one drawback to
    this, however; you can''t delete the original file addresses until the links have
    been deleted, as Linux treats all hard links equally. Therefore, to get rid of
    addresses, you''d need to remove (with the rm command) /home/eric/addresses and
    /home/pat/addresses before you remove the addresses file in your directory. If
    you haven''t created many links, you can probably keep track of the links and
    you may find that you may be stymied in your attempt to delete the original file.


    > Some UNIX purists advise setting up links whenever possible, arguing that hard-disk
    space should be conserved at all times. However, we are not of this mindset. Indeed,
    the fewer links you can create, the better it will be for all of you. System administrators
    need to set up links occasionally, this practice should be mainly reserved for
    them. We present the mechanics of creating links, but we don''t endorse the practice
    on a large scale.


