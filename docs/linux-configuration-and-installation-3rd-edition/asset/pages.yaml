  md: '# # The Core Components


    In the rest of this chapter, we''ll run down the various PC components and warn
    you about any potential downfalls if you want to use Linux. In addition, you''ll
    want to check out Chapter 3 for a discussion of supported graphics cards—support
    becomes vitally important if you''re looking to run FreeX86 (the implementation
    of the X Window System) with Linux.


    In this section, we''ll begin with a rundown of the basic components of your computer:
    bus, processor, and so on.


    # # Bus


    Linux runs on all the major bus architectures—ISA, VLB, PCI, ISA—except for the
    nonstandard Micro Channel Architecture, found on most IBM PS/2 models. (Not every
    IBM PC features a MCA bus; luckily; the ValuePoint and PS/1 models feature an
    industry-standard ISA bus.)


    # # Processor


    Linux needs at least an Intel 80386-based processor in order to run efficiently.
    Don''t bother with a 80286-based PC. If you''ve got an older PC sitting in the
    closet and you think it might be neat to recycle by using Linux, leave it, donate
    it to your local charity, or give it to the kids to band on. It won''t be useful
    in your Linux adventure.


    Basically, any PC built around the Intel 80386 or better (including the i486,
    Pentium, and chips from AMD and Cyrix) is capable of running Linux. If there is
    no math coprocessor (which may be an issue in older 80386-based PCs), Linux has
    built-in FPU emulation.


    # # A Few CPU Problems


    There are a few reported instances of Linux conflicting with a CPU or math coprocessor:'
  merge: -1
  pgno: 38
