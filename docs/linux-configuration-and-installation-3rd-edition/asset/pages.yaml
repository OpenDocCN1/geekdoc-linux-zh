  md: '# CHAPTER 2: Installing Linux


    # Installing from 3.25-Inch Floppy Disks


    The disk sets contained on the CD-ROM can be copied directly to DOS-formatted
    diskettes. (You''ll end up with a slew of diskettes, of course.) For each disk,
    make an MS-DOS format disk and copy the proper files to it. Then, when you run
    the setup program, you can specify that you''re installing from diskettes and
    not from another source.


    The 00index.txt files are added by the FTP server; you don''t need those.


    # Installing from 5.25-Inch Floppy Disks


    Linux prefers to be installed from a 3.5-inch disk drive. However, it is possible
    to install on a machine that has only a 5.25-inch drive. This isn''t as easy as
    installing from a 3.5-inch drive, but if you install off of your hard drive it
    may actually be easier.


    The first three disks of Slack Linux, the A disks, should all fit within a 1.2MB
    diskette. To install them, you''ll need a boot kernel and a rootdisk. To make
    the boot-kernel disk, copy the boot kernel of your choice to a floppy using the
    UNIX command `dd` or `RAWWRITE.EXE`. To write `color.gz, text.gz, umsdos.gz, or
    tape.gz` to a floppy in the same way. (These are in /ROOTDSKS.)


    Use the boot-kernel ramdisk to boot the rootdisk, and then install from there.
    This will load the ramdisk. Once you have the slackware: prompt you to remove
    the disk from your machine and continue with the installation.


    Once you''ve got the base system installed, you can install the rest of the disks
    by downloading them on to your hard drive and installing them from there. Disk
    series other than � won''t fit onto 1.2MB disks.


    # Installing from Tape


    The TAPE.GZ rootdisk file can be used to install Slackware96 from tape. This has
    been tested on a Colorado Jumbo 250, but it should work for most floppy tape and
    SCSI drives. To do this, you''ll need to know a little about UNIX and its filesystem.'
