    Disaster enters. Because you placed a space between the asterisk wildcard and
    the rest of the command line, the rm command uses only the asterisk as an argument,
    ignoring the golf part of the command line. Since every file is returned by the
    asterisk wildcard, you''ve just removed the files in your current directory. (By
    the way, the chance of this happening is an excellent argument for using the -i
    option at all times and setting it up as an alias.)


