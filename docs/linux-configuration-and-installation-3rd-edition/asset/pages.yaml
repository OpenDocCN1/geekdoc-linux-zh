    # Emulating DOS over Linux


    If you''re hot to run DOS programs under Linux, you''ll want to check out dosemu
    or xdos (they''re the same software, essentially, with one difference: xdos will
    run in an X Window window with mouse support; dosemu does not). Dosemu is found
    on the second CD-ROM in the contrib directory (dosemu0.60.4.tgz).


    Strictly speaking, neither dosemu nor xdos is a DOS emulator even though they''re
    referred to as such in the documentation (the emu in dosemu refers to emulator).
    Dosemu runs a virtual DOS machine on the Intel-based PC architecture (much in
    the same manner as OS/2 handles DOS sessions). You''ll need to compile dosemu
    for use on your own machine; the HOWTO file details the exact procedure.


    # Emulating Microsoft Windows over Linux


    If there''s one area where Microsoft Windows is superior to Linux, it''s in the
    vast amount of software that runs under Windows. That''s why team of volunteers
    is working on WINE, the Windows Emulator (or, by some other accounts, Wine Is
    Not an Emulator; both are correct, apparently). WINE allows you to run Windows
    binaries under Linux.


    For more information on WINE, you can set your WWW browser to http://www.asgardpro.com/wine,
    or you can grab it directly via FTP from these sites:'
