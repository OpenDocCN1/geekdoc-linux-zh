    # Creating a Text File


    Elvis can be as simple or as complex as you want. On the one hand, it''s really
    easy to create or edit a text file; all you need to know are the following steps:


    +   - Launch elvis from the command line.

    - Switch to insert mode by typing I.

    - Type.

    - When you want to save the file and exit elvis, press the Esc key (which moves
    you to command mode), type:wq filename (use your filename here), followed by Enter.
    The file is saved, and your command prompt reappears.


    # Moving through Your Document


    If you''re running elvis from the command line (as opposed to running it the X
    Window System), you''ll find that your mouse won''t help much. If your documents
    get too long, you''ll need to learn about some of the nifty shortcuts that can
    be used to move through a document.


    The easiest way to move through a document in elvis is to use the cursor and page-movement
    keys that exist on your keyboard (PageUp, PageDown). The PageUp and PageDown keys
    will move you up and down a single page; if there''s less than a page of text
    to scroll, you''ll be placed at the beginning or the end of the file. Similarly,
    the up and down cursor keys (↑) and (↓) can be used to move the cursor through
    the document; if you press the up cursor (↑) key at the top of the screen, the
    previous line will scroll to the top.'
