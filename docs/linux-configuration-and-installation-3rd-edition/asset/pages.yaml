- img_proc: true
  md: '# CHAPTER 5: Linux Applications 325


    In Figure 5.19, we’re showing the clocks with no command-line options. However,
    you can customize oclock on the command line; some of the options are listed in
    Tables 5.13 and 5.14.


    Table 5.13 Some Oclock Command-Line Options


    | Option | Changes... |

    | --- | --- |

    | -bd color | the border color to the specified color |

    | -bg color | the background color to the specified color |

    | -fg color | the foreground color to the specified color |

    | -hour color | the foreground color to the specified color |

    | -jewel color | the jewel color to the specified color |

    | -minute color | the minute-hand color to the specified color |

    | -transparent | the appearance so that only the hands, border, and jewel of the
    clock are showing. |


    Table 5.14 Some xclock Command-Line Options


    | Option | Changes... |

    | --- | --- |

    | -analog | the display from digital to analog |

    | -chime | the sound setting so the clock will ring twice on the hour and once
    on the half-hour. |

    | -digital or -d | the display to digital. |

    | -hands color | the color of the hands color. |


