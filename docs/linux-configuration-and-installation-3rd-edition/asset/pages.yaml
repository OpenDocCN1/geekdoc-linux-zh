  md: '# CHAPTER 3: Installing and Configuring XFree6


    # Configuring the Xterm


    The xterm program is probably the most popular X program. It seems


    Figure 3.6 shows xterm.


    ![](img/05da311512608405596dd882623b9142_181_0.png)


    Figure 3.6 The xterm program.


