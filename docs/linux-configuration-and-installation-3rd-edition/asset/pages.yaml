  md: '# CHAPTER I: Linux and PC Hardware


    +   - Some AMD 486DX CPUs may hang in very specific situations, a problem that''s
    not unique to Linux. If this happens to you, contact your PC vendor and get a
    replacement chip.

    - Some older math coprocessors from Cirix, IIT, and ULSI (the Math*Co series)
    have problems with the FSAVE and FRSTOR instructions, which may cause problems
    with Linux. Again, you can get a replacement chip from your PC vendor.


    # RAM


    Random-access memory is one of those sticky issues when it comes to the PC. If
    you''re a workstation user, you''re probably used to working with scads of RAM.
    (Then again, most workstation users have someone else footing the bill, as the
    costs of that RAM add up rather quickly.) In theory, it would be great to work
    with scads of RAM on a PC. Linux, like any 32-bit operating system, loves to work
    with as much RAM as possible.


    In the real world, however, there are bills to pay, and the reality is that RAM
    is one of the most expensive parts of a PC, both upon initial purchase and if
    you ever want to upgrade. If you''re a workstation user, you''ll want to read
    through the following section, which explains RAM and the PC; if you''re a PC
    user and are comfortable in your knowledge of RAM, you can skip to the following
    section.


    # The PC and RAM


    If you buy a PC these days and aren''t too attentive to details, you can easily
    end up with a PC that has 8 megabytes (MB) of RAM, as this is a popular figure
    with packages offered by the likes of CompUSA, Best Buy, and Computer City. In
    this day and age, 8MB isn''t a whole lot of memory, even when running Microsoft
    Windows, MS-DOS, and memory-hungry applications. It becomes even more confining
    when running Linux.'
  merge: -1
