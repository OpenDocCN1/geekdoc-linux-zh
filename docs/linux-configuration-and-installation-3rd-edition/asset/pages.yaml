    # Processes


    Multiple requests to the shell are called processes. As these requests are made,
    the shell numbers them. These numbers are important if you want to kill a process.
    To see a list of processes, use the ps command:


    ```

    gilbert/:$ ps

    PID TTY STAT COMMAND

    71 v1 S 0:00 -bash

    72 v2 S 0:00 /sbin/agetty 38400 tty2 linux

    73 v3 S 0:00 /sbin/agetty 38400 tty3 linux

    74 v4 S 0:00 /sbin/agetty 38400 tty4 linux

    75 v5 S 0:00 /sbin/agetty 38400 tty5 linux

    76 v6 S 0:00 /sbin/agetty 38400 tty6 linux

    83 v1 R 0:00 ps

    ```


    There are at least two processes running when you use the ps command: the shell
    process (in this case, bash) and the ps process. (Unlike other versions of UNIX,
    Linux does not return the init process as part of ps.) However, you''ll rarely
    see a ps command with only two processes. When the Linux system boots, it usually
    starts a series of processes, mostly related to networking and communications.
    A program may generate a series of processes. If you''re running the X Window
    System, your list of processes will be considerably longer.


