  md: '# Internet Resources


    Linux is a big topic on the Internet; a recent search on the Alta Vista search
    engine yielded 200,000 Web pages that mention Linux somewhere. Even when discarding
    the Web pages created by undergraduates who tinker with little Linux, you''re
    left with an amazing number of Web pages that cover Linux in some depth.


    We''ve done a little editing for you and compiled this assortment of interesting
    Linux-related Web pages. Naturally—this being the World Wide Web and all—most
    of these pages spend a lot of time pointing you to other Web pages, which in turn
    point you to even more Web pages. Still, by beginning with these pages, you can
