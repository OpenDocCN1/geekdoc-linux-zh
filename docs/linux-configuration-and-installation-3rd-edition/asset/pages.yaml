  md: '# Introduction


    # Welcome to Linux


    Welcome to the Linux operating system and the third edition of Linux Installation
    and Configuration! Whether you are looking for a version of UNIX that you can
    run on an inexpensive PC or are just totally disgusted with the antics of Microsoft
    et al. when it it comes to operating systems, we think you''ll get a lot out of
    this book.


    In these pages, you''ll be guided through a Linux installation and configuration
