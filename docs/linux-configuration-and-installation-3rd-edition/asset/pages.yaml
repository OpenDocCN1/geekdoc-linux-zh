  md: 'without modifying its contents. Normally, though, you don’t want to fool make;
    use its simple rules to make your life easier.


    Make supports a number of useful command-line parameters, as shown in Table 10.4.


    # Table 10.4 Make Command-Line Parameters


    | Parameter | Meaning |

    |--- | --- |

    | -f makefile | Uses the named file instead of Makefile for the rules |

    | -n | Runs in no-execute mode—only prints the commands, doesn''t execute them
    |

    | -s | Runs in silent mode; doesn''t print any commands make executes |


    As you compile Linux freeware, you’ll notice that there are a lot of conventions
    with make and Makefiles. For example, most Makefiles contain a target called all,
    which rebuilds the entire program when you execute:


    ```

    $ make all

    ```


    For this command to work, the Makefile must have a target named all that tells
    make what to do to rebuild everything. In addition, most Makefiles contain a clean
    target that removes all .o files and other files created by the compiler, and
    an install target that copies the built executable file to an installation directory,
    such as /usr/local/bin.


    # Imake


    In addition to make, there’s another tool called imake. Imake is used to generate
    Makefiles on a variety of systems. Imake uses an Makefile for its rules. These
    rules then help generate a Makefile, which is used by make to build the program.
    Sound convoluted? It is the main reason imake exists because of radically different
    system configurations, especially where the X Window System is concerned.


    You’ll find imake especially popular with programs for X Window. The problem with
    X is that there are so many options that every UNIX'
  merge: -1
  pgno: 491
- img_proc: true
  md: '# CHAPTER 10: Programming in Linux 461


    platform is configured slightly differently. There''s simply no way you could
    write a portable Makefile that could work on all such platforms. Make using an
    Makefile and configuration files are local to your system. Together, the Makefile
    and the local configuration files generate a Makefile that should work on your
    system. (In addition to make, there''s an even harder package called GNU configure.
    Unfortunately, imate is very common among X Windows programs, and configure is.)


    If you need to compile programs for the X Window System and you see an Imakefile,
    here''s what you should do. First, run the xmkmf shell script. This script is
    merely a simple front end to make:


    ```

    $ xmkmf

    m Makefile Makefile..

    make -DUSEInstalled -I/usr/lib/X11/config

    ```


    These commands should make a backup of any Makefile you have (to Makefile.bak)
    and then create a new Makefile based on the commands in an Imakefile.


    Imake isn''t easy to grasp, so if you have problems with imake, check with your
    system administrator or look up imake in a book on the X Window System (such as
    Using X, MIS:Press, 1992; see Appendix A for a list of books using the X Window
    System).


    # Debuggers


    Because Linux remains firmly in the GNU program-development world, it provides
    the gdb debugger, as well as the X Window front end, xxgdb, as shown in Figure
    10.1.


    # X Window Tools


    If you''re developing X applications, a few extra utilities may help. the xman
    program (mentioned in Chapter 5) provides a graphical front end and nice formatting
    for UNIX online-manual pages.


    For critical programs, you''ll find xcmap very useful. This simple X application
    displays the current colormap. For color-intensive X applications, this can help
    you track down obscure X problems.'
  merge: -1
  pgno: 492
- img_proc: true
  md: '# 462 CHAPTER 10: Programming in Linux


    Similarly, the xev application helps you see what events the keyboard keys are
    really sending to the X server.


    For selecting fonts, xfd xfontsel both help you choose a good-looking font for
    your applications.


    ![](img/05da311512608405596dd882623b9142_493_0.png)


    Figure 10.1 The xxdb debugger.


    # Parsers and Lexers


    If you''re used to building your own parsers, you''ll like the GNU bison (a port
    of UNIX yacc—Yet Another Compiler Compiler) and flex (a fast lex). Linux even
    includes flex++ for developing C++ scanners.'
