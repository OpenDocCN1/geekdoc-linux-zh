    # Looking for Help


    Most UNIX systems have an online-manual page system, and Linux is no exception.
    You can use the man command to summon information about specific commands:


    ```

    darkstar:-# man man

    ```


    Online-manual pages aren''t organized by topic; they''re organized by specific
    command.


    There are other informational sources included with the Linux operating system.They''ll
    be discussed in Chapter 5.


    # Shutting Linux Down


    Like any UNIX, Linux responds to the shutdown command. You''ll need to provide
    it with a command-like parameter and an amount of time to wait before actually
    shutting the system down. This may seem odd if you''re used to working alone on
    a PC, but the shutdown command is'
  merge: -1
  pgno: 133
- img_proc: true
  md: '# CHAPTER 2: Installing Linux


    usually saved for serious shutdowns, as most UNIX installations support many users
    and rarely shutdown. In fact, you must be logged in as root in order to use the
    shutdown command. Use the following command line:


    ```

    $ shutdown -r now

    ```


    This shuts down the system immediately.


    ![](img/05da311512608405596dd882623b9142_134_0.png)


    Don''t just turn off the power to turn off a Linux system. This can cause important
    files.


    An alternative method of shutting down Linux is the old tried-and-true PC Ctrl-Alt-Del
    sequence, which is used to reboot a system. When running Linux, this sequence
    performs the same functions as shutdown -r now. When the PC cycles to reboot,
    simply turn it off. Whatever others may claim, this is a perfectly acceptable
    way to shut down a Linux system.


    # What to Do if Things Go Wrong


    For the most part, installation of Linux from the accompanying CD-ROMs is a pretty
    straightforward proposition, and you shouldn''t have many problems. However, there
    may be some cases when you run into problems when you reboot the Linux system
    after installation. These problems may include:


    +   - You''re told that the system is out of memory. You''ll probably run into
    this problem if you''re operating with 4 megabytes of RAM or less.

    - Your system hangs when you first run Linux. In these situations, you''ll want
    to watch the screen closely for error messages. Sometimes Linux will be seeking
    a device at a specific address (say, a CD-ROM drive) and instead find a network
    card. In these situations, Linux will hang. You''ll need to tell Linux to look
    for the device at the address on your system, which requires that you send an
    option line to Linux upon bootup. This is a situation that''s covered in the many
    documents included on the CD-ROMs.'
