  md: '# CHAPTER 4: Basic Linux Tools


    Cat can also be used to create simple ASCII files; we say simple because cat sends
    your keyboard input directly to a file, rather than giving you the chance t0 edit
    the file. (The full-screen editors elvis and emacs can be used to edit files.)
    To create a simple file named memo, you''d use the following command line:


    ```

    gilbert:-$ cat > memo

    ```


    Anything you type would go directly into the memo file one line at a time. When
    creating a file like this, there are a few things to remember:


    +   * Hit the Enter key at the end of every line. Otherwise, part of your typing
    will end up in the ether.

    * You can move within the line using the Backspace key (well, partially, anyway;
    Backspace will merely delete the preceding character). You can''t move to a previous
    line, however.

    * Type Ctrl-D when you''re finished typing.


    > The Ctrl-D sequence can be used whenever you run a Linux command that requires
    keyboard input.


    ![](img/05da311512608405596dd882623b9142_253_0.png)


    Finally, cat can be used to combine files. For example, you can add to the aforementioned
    memo file with the following command line:


    ```

    gilbert:-$ cat >> memo

    ```


    Whatever you type will be added to the memo file. The previous rules apply. In
    addition, you can redirect two existing files as input to a new third file:


    ```

    gilbert:-$ cat memo memo2 > memo

    ```


    The order of the files on the command line determines the order of the data in
    the new file.

