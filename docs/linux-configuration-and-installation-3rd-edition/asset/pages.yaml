  md: '# CHAPTER I: Linux and PC Hardware 15


    However, be warned that you may need to play around with various SCSI cards, as
    you''ll see this from the excerpt from the Slackware FAQ:


    > Q: Why the $$$! isn''t my UltraStor SCSI card detected? It works under DOS?

    A: Set the I/O address to 0x340 instead of 0x330.


    For any hardware that doesn''t work, a good rule is to try playing around with
    the IRQ and I/O settings on to see what happens. If your system is up and running
    and you''re having problems with a CD-ROM or tape or something like this, you
    can always look for the driver source in /usr/src/linux/drivers... really, it
    won''t bite! The source contains important documentation, such as the default
    IRQ settings for that type of device and the major number for the entry in /dev.
    Also, try other boot kernels and see if that helps.


    ![](img/05da311512608405596dd882623b9142_46_0.png)


    A discussion of IRQs and interrupts can be found later in this chapter.


    Support for SCSI should extend to tape drives (as you''ll learn in the section
    entitled "Tape Drives," later in this chapter).


