- img_proc: true
  md: '# CHAPTER 9: Linux and the Internet


    # # Getting on the Worldwide Network


    The Internet has been the recipient of a ton of hype recently, and with good reason:
    it’s one of the most exciting developments in the computer world in some time
    came. As both a computer user and a Linux user, you’ll greatly benefit from the
    many possibilities offered by the many offerings of the Internet.


    As a matter of fact, you’ve probably noticed the many references to the Internet
    throughout the course of this book. It seems as though anyone who wants to do
    any advanced work with Linux needs a link to the Internet. (As the authors of
    this book, who spent much of their time planning this book and coordinating material
    through electronic mail and the Internet.) Usenet newsgroups—which we cover in
    Appendix A–well as great Web sites can certainly enhance your understanding and
    usage of the Linux operating system.


    How you connect to the Internet depends on your specific circumstances, however.
    If you’re using Linux in a corporation that’s already connected to the Internet,
    you can merely piggyback from that connection. If you’re working on a stand alone
    Linux workstation, you can set up your own Internet connection with the aid of
    an Internet service provider.


    Both of these possibilities exist because Linux’s built-in networking capabilities—namely,
    TCP/IP, which you learned about in Chapter 8. Basically, this support for TCP/IP
    allows a Linux user to use another computer on the network. In Chapter 8, the
    computers on the network were in the same physical location as your computer.
    On the Internet, the computers on the network can be just about anywhere. (In
    other words, the Internet is basically the world’s largest TCP/IP network.)


    The concept behind TCP/IP networking is actually pretty simple. Each machine on
    the network has an individual TCP/IP address, and every other machine on the network
    can access this machine (if only to be denied access, of course; there are some
    security measures involved if need be). The extent of the network depends on your
    needs; some companies purposely restrict their TCP/IP networks to a very confined
    set of machines; other allow full access to the global Internet.


    In this chapter, we’ll discuss getting on the Internet using the tools built into
    Linux.'
  merge: -1
  pgno: 433
- img_proc: true
  md: '# CHAPTER 9: Linux and the Internet 403


    # Finding a Window to the Internet


    If you aren''t connected to the Internet via a direct network connection, you''ll
    need to make arrangements to do so. There are two ways to do this.


    One method involves piggybacking off a machine that is directly connected to the
    Internet. In this manner, you can essentially use the specifics of the connected
    machine. Connectivity tools that fall under this category include SLIRP, which
    is run in a remote UNIX shell account and makes act like a SLIP/CSL account. We
    compiled it on the Ultrix machine and connected to it with DIP. It works great!
    The source for it is on the CD-ROM in /contrib.


    > The term program, which was covered in the first edition of this book, is no
    longer supported under newer versions of Linux.


    ![](img/05da311512608405596dd882623b9142_434_0.png)


    # Linux''s SLIP and PPP Tools


    If you don''t have a permanent TCP/IP connection to the Internet through work
    or a friend, you can use Linux''s SLIP and PPP tools to connect to the Internet
    via an Internet service of some sort. SLIP (Serial Line Internet Protocol) and
    PPP (Point-to-Point Protocol) allow you to connect to another TCP/IP machine.


    To connect to the Internet via SLIP and PPP, your implementation of Linux must
    first support both protocols. If you installed directly from the CD-ROM, your
    Linux kernel will indeed support SLIP and PPP; if you look at the screen when
    you boot Linux, you''ll notice that SLIP and PPP will be listed. However, for
    some reason you decided to compile your own kernel, then you should have the foresight
    to compile in SLIP and PPP support. (You asked if you wanted support for these
    protocols as part of the make process.) If not, you''ll need to go back and compile
    a new kernel, paying special attention to the Network section of the makefile.


    After doing that, you''ll set up an account with a service provider (like Netcom,
    PSI, GNN, Microsoft Network, or Minnesota Regional Network), which gives you Internet
    access using a standard modem.'
  merge: -1
  pgno: 434
- img_proc: true
  md: '# CHAPTER 9: Linux and the Internet


    When you connect via a service provider, you''ll be assigned an IP address right
    on the spot; the process yields a dynamically assigned IP address, which is used
    by your Linux system to connect to the Internet.


    When you set up an account, you should get a list of information from the service
    provider. Out of this information, you''ll need to know the following:


    +   * The access telephone number—if you don''t have this number, you can''t dial
    up the service provider.

    * The IP numbers of the Domain Name Servers. These are the servers your system
    looks when you want to connect to another machine on the Internet. Without these
    servers, your Linux system would be lost in cyberspace.

    * Your username and password.

    * The mechanism for logging on the system. This is a little more daunting than
    it looks, because it seems that every service handles dialup connections a little
    differently. As an example: our service provider uses a standard UNIX-style login
    procedure, where the entry of a username and a password is followed by a standard
    UNIX prompt:


    ```

    Welcome to the Twin Cities MRNet dialIP Service.

    User Access Verification

    Username:

    Password:

    lip-server> ppp

    ```


    After entering ppp at the command prompt, the server initiates the PPP protocol
    with your machine. This is not standard in the ISP world; most initiate the process
    immediately after you enter your password.


    Basically, SLIP and PPP do the same thing. However, SLIP (the older of the two
    protocols) is decreasing in popularity, because PPP (quite honestly) is easier
    to configure and use. Linux contains the dip command, which handles SLIP connections
    to a service provider.


    The dip command stands for dialup IP connections, that is, a TCP/IP connection
    between your Linux system and some other system. The'
  merge: -1
  pgno: 435
- img_proc: true
  md: '# CHAPTER 9: Linux and the Internet


    connection is made over a serial line (and presumably a phone line and modem)
    instead of the traditional Ethernet or other TCP/IP connection. On top of the
    serial line connection, dip implements one of a number of serial-line Internet
    protocols, including SLIP, CSLIP (Compressed SLIP), and PPP.


    Thus, without a hard-wired network link, you can establish an IP (network) link
    over a phone line. This is very useful for connecting to an Internet service provider.
    The way this works is that all data going between the two computers is sent over
    the serial line. At each end, the data is converted into network packets and sent
    to the appropriate programs. To most programs on either end, there is no real
    difference between this type of link and a direct network connection, except that
    serial-line links are typically much slower than direct network connections.


    You can use dip for both incoming and outgoing dialup links.


    When you dial out with dip, you can configure a chat script to set up a link to
    your remote system. The chat script contains things like which serial port to
    use, the system (host) to connect to, what speed to set the modem, the protocol
    (e.g., PPP, SLIP, etc.), and so on.


    You can also use dip to manage incoming connections. Users then login over a serial
    link, but the “shell” launched on login is not bash or csh, but diplogin.


    In this case, you can set up a program called login as the “shell” to execute
    for a particular user in the /etc/passwd file. (Normally, dip is a link to dip
    with the -i option to set dip into input mode. Upon login, dip looks up the user''s
    name in the /etc/diphosts file. Each entry in this file is a like the system password
    file, /etc/passwd. For each user, you can have an extra dial-in password to add
    an extra level of security—a useful thing in the wild atmosphere of the Internet.


    Upon successful login, dip sets up a network connection between the dial-in and
    your Linux system, using the protocol specified in the /etc/diphosts file for
    the given user who logged in. Normally, this is CSLIP, SLIP, or PPP.


    Dip also supports dynamic IP address allocation. See the online documentation
    for more on this.


    ![](img/05da311512608405596dd882623b9142_436_0.png)'
  merge: -1
  pgno: 436
- img_proc: true
  md: '# 406 CHAPTER 9: Linux and the Internet


    Because dialup Internet connections are so individualistic (we''ve dealt collectively
    with both static and dynamically allocated addresses), we''re going to leave it
    to you to configure dip. You''ll want to read carefully through the online-manual
    pages for dip, as they contain plenty of examples. They also contain example scripts,
    which you can adapt to automatically log you on a remote connection.


    To help make the first connection, it''s very handy to run dip in test mode. To
    run it, use the following command line:


    ```

    gilbert:$ dip -t

    ```


    The -l option tells dip to accept interactive commands. You can use these interactive
    commands to find out more information about what steps work and what steps don''t
    while you''re debugging a dip connection.


    Unfortunately, there is no really easy way to set up dip. You can find out more
    about dip and its configuration options by looking in the /usr/doc/dip directory.


    # Linux’s PPP Tools


    We recommend that you use the PPP protocol instead of SLIP for many reasons, some
    technical and some not; basically, it''s easier to set up PPP connections when
    you''re using dynamically assigned IP addresses.


    Not that it''s simple to set up a PPP connection. The trouble with the Linux world
    is that it lacks a suite like Trump Winsock to automate dialup connections to
    the Internet, which is why you need to slog through descriptions like the one
    here.


    In addition to the dip program, Linux supports a suite of PPP-only applications.
    The dip program supports the PPP protocol, along with SLIP and CLISP. The PPP
    suite of applications only supports PPP. Of these PPP-only tools, the pppd command
    acts as the PPP daemon and in the background awaiting PPP connections.


    The ppp-on command brings up a connection. The ppp-off command brings it down.
    As with dip, there''s a lot of configuration to'
  merge: -1
  pgno: 437
- img_proc: true
  md: '# CHAPTER 9: Linux and the Internet 407


    do. This is one area of Linux that could really use some improvement. You can
    find out more about Linux’s PPP tools by looking in the /usr/doc/ppp directory.


    Confusing as it sounds, the dip program supports the PPP protocol, but not the
    separate PPP suite of commands. Nor do the PPP commands support dip. That is,
    you can''t really mix and match dip with ppp-on, ppp-off, and pppd.


    ![](img/05da311512608405596dd882623b9142_438_0.png)


    In addition to the slip and ppp suites, you can run dial, short for Dial Daemon.
    The pseudo-networking connection for your phone line, even if the phone line is
    not actively connected to the Internet. This capability allows you to only tie
    up your phone line when needed, because dial automatically reconnects when needed
    and hangs up when a connection is no longer necessary.


    > ON THE CD-ROMS Dial is on the second CD-ROM.


    # Setting up a PPP Connection


    Here are the steps you’ll want to follow to establish a PPP connection to an Internet
    Service Provider, or ISP. In these situations, you’re calling the same phone number
    and are dynamically allocated an IP address each time you login the ISP’s computer.


    First, you’ll need to make sure that your local permissions are set up correctly.
    When logged in as root, you should edit your /etc/hosts.deny file to add the following
    line:


    ALL: ALL


    This prevents others from logging on on your system via the Internet when you’re
    connected to your ISP. However, you do want to allow yourself'
  merge: -1
  pgno: 438
- img_proc: true
  md: '# 408 CHAPTER 9: Linux and the Internet


    access to your own machine (we assume you do, anyway), so edit your /etc/hosts.allow
    file to add the following line:


    ```

    ALL: 127.0.0.1

    ```


    If you haven''t done so already, you should give your own machine name (we told
    you how to change this in Chapter 2). This information is found in /etc/HOSTNAME.


    Next, you''ll need to tell your Linux system where to find data on the Internet.
    It involves adding the name of your service provider and a DNS server to the /etc/resolv.conf
    file, in the following format:


    ```

    search mr.net

    nameserver xxx.xxx.xxx.xxx

    ```


    In this example, we told Linux to look for things like news and mail at mr.net.
    In the place of xxx.xxx.xxx.xxx you''ll provide a DNS address provided by your
    ISP.


    You''ll also want to take a look at /etc/hosts. It should contain two lines, looking
    something like this:


    ```

    127.0.0.1 localhost

    0.0.0.0 gilbert

    ```


    If 127.0.0.1 is used for your machine name, change it. This should not be used
    when a connection to the Internet is made, because it may conflict with some Internet
    services.


    Finally, you''ll want to give Linux the username and password provided to you
    by your ISP in the /etc/ppp/pap-secrets file. This line will look something like
    this:


    ```

    reichard * password

    ```


    where password is the password.


    One more step before you make a connection: You''ll need to create an /etc/ppp/chatscript
    to include information about your ISP, particularly a phone number. The following
    script works with most modems:'
  merge: -1
  pgno: 439
- img_proc: true
  md: '# CHAPTER 9: Linux and the Internet 409


    ```

    TIMEOUT 5

    '' ATZ

    OK ATDTxxx-xxxx

    ABORT ''NO CARRIER''

    ABORT BUSY

    ABORT ''NO DALTONE''

    ABORT WAITING

    TIMEOUT 45

    CONNECT ''We are connected!''

    TIMEOUT 5

    "name": reichard@mr.net

    "word": password

    in> ppp

    ```


    where xxx-xxxx is the phone number of your ISP. The final three lines are tailored
    to our ISP, which presents two prompts (username: and password:) as well as a
    command line for launching ppp on the host computer. You''ll want to change this
    for your specific ISP.


    Once connected, you should be able to use any of the Internet tools presented
    here.


    # Internet Tools


    After you work out your connections to the Internet, you can take advantage of
    the network tools available under Linux.

    We''ll begin with a discussion of Internet mail, then we''ll discuss other Internet
    goodies.


    # Using Electronic Mail


    The ability to send electronic messages to individuals, groups of people, or everyone
    in the company is not one of the flashiest features of the Linux operating system,
    but it is certainly one of the most used. Other networking systems, particularly
    from the MS-DOS world (like Novell NetWare) lack basic electronic-mail (or e-mail)
    capabilities, while other'
  merge: -1
  pgno: 440
- img_proc: true
  md: '# CHAPTER 9: Linux and the Internet


    operating systems featuring built-in electronic mail lack the other extensive
    capabilities featured in Linux.


    The mail program has been an important part of UNIX almost since the very beginning.
    As UNIX evolved, so has mail—to an extent. The actual electronic-mail mechanisms
    are similar to the original mail mechanisms; changes mainly concern how a user
    interacts with a mail program. The procedures described here may not appear exactly
    the same on your system, as there are many mail programs, both UNIX- and Window-based,
    that vary in how they present information to the user.


    Linux gives you a few options for reading and sending mail, starting with the
    mailx command and ending with programs like elm and pine, which ship on the accompanying
    CD-ROMs.


    # Receiving Mail


    Linux informs you of incoming mail when you login the system. You''ll see a message
    like:


    > You have mail.


    Unless you read your mail at this point, this message will reappear periodically,
    as the shell is automatically set up to remind you of unread mail.


    To view this mail, type:


    ```

    gilbert:$$ mail

    ```


    You''ll see something like what''s shown in Figure 9.1.


    The shell responds with a list of your mail messages, listed in the order they
    were received by your system, newest mail first. The first field lists the sender
    of the message, the second through fifth fields denote the time and date the message
    was received, the sixth field records the number of lines in the message and the
    size of the message (in bytes), and the final field indicates the subject of the
    message.


    Press Enter to read the first message on the list. If it''s a long message, the
    entire message will scroll by. If you want to stop scrolling the message, type
    Ctrl-S; to start again, type Ctrl-Q.'
  merge: -1
  pgno: 441
- img_proc: true
  md: '# CHAPTER 9: Linux and the Internet 411


    ```

    gilbert:/# mail

    Mail version 5.5 8/1/90. Type for help.

    /var/spool/mail/root: 4 messages unread\SU 1 root Thu Sep 15 02:23 130/4321 "Register
    with the Lin"

    U 2 volkerdi@mhd1.moorhead Thu Sep 15 02:53 66/2758 "Welcome to Linux!"

    U 3 root Thu Sep 15 02:23 132/4321 "Register with the Lin"

    U 4 volkerdi@mhd1.moorhead Thu Sep 15 02:53 66/2758 "Welcome to Linux!"

    D

    ```


    Figure 9.1 Incoming mail.


    There are two types of messages waiting for us: messages from root and messages
    from volkerdi@mhd1.moorhead. If you''re connected to the Internet and have your
    own network with other users, your electronic mail can come from two sources:
    your own system and other systems. Mail from other systems, sent on the Internet
    or the Usenet, has its own unique addressing scheme (more on that in the next
    section). Mail from your own system uses the same login names as described in
    Chapter 1; these names are contained in the /etc/passwd file.


    The newer addressing scheme, and one that is growing in popularity (mainly because
    of the growing popularity of the Internet), is called domain addressing. Structured
    as the exact opposite of a bang path, a domain address couples the name of the
    user with an address grew out of the need for international standardization of
    electronic-mail addresses and provides a hierarchical structure to addressing.
    Essentially, the world is split into country domains, which are divided into educational
    domains (indicated by the suffix .edu in the address) and commercial domains (indicated
    by the suffix .com in the address). There are hundreds and hundreds of commercial
    and educational domains, and the number is growing every day.


    Reading a domain address is quite simple. In the address of:


    reichard@mr.net'
  merge: -1
  pgno: 442
- img_proc: true
  md: '# 412 CHAPTER 9: Linux and the Internet


    reichard refers to the user, while mr.net refers to the domain. The user and domain
    names are separated by the at as (c) symbol. As a user, you don''t need to know
    the specific path a message must take, nor do you need to know the name of a gateway.
    With a domain address, sending a message is simple:


    ```

    gilbert:$ mail reichard@mr.net

    ```


    The idea of the Internet is fairly amorphous and abstract. The Internet is technically
    a collection of many networks that somehow manage to talk to each other. As a
    user, all you need to know is a electronic-mail address; the system administrator
    handles the basic details of linking a system to the Internet.


    If you''re on the Internet, you can also receive electronic-mail from afar. To
    find your machine address, type uname -n at the prompt:


    ```

    gilbert:$ uname -n

    gilbert

    ```


    where gilbert is the name of your UNIX system, also called the hostname. To list
    all the systems you can directly communicate with, type uname:


    ```

    gilbert:$ uname

    othersystem1

    othersystem2

    othersystem3

    ```


    where othersystem refers to the other systems.


    The uname command doesn''t support this option on all systems. If this is the
    case, you can look in the file /etc/hosts covered earlier in this chapter, to
    get a good idea of what other systems your computer networks with.


    In a large regional or nationwide network, the list of other systems can be quite
    large. If you want to find a specific system and you don''t want to wade through
    a huge list of names, use uname in conjunction with grep:'
  merge: -1
  pgno: 443
- img_proc: true
  md: '```

    $ uname | grep othersystem121

    othersystem121

    ```


    If the name of the other system is returned, you can send electronic mail to someone
    with an account on that system. In addition, you can send messages to people on
    the Internet if you are connected to the Internet, provided you know the exact
    address of the recipient.


    Let''s look at the first message from *root*, shown in Figure 9.2.


    ![](img/05da311512608405596dd882623b9142_444_0.png)


    **Figure 9.2** An incoming electronic-mail message.


    At the beginning of an e-mail message is a *header*. With the Internet, mail may
    go down one or more systems on its way to you. You can''t count on a direct link
    between systems, and because of uncontrollable paths it take some time for a message
    to reach the recipient; delivery times of 15 hours to 24 hours are not uncommon,
    but neither are delivery times of 10 seconds.


    # Creating Mail


    It''s very easy to create mail. (Too easy, some would say, as they survey mailboxes
    full of irrelevant mail messages.) To create a short message at the keyboard,
    simple combine **mail** with the name of the recipient, followed by a period on
    its own line. The resulting mail is shown in Figure 9.3.'
  merge: -1
  pgno: 444
- img_proc: true
  md: '# 414 CHAPTER 9: Linux and the Internet


    ```

    Saved 1 message in inbox

    Meld 1 message in /var/spool/mail/root

    gilbert:/var/X11R/lib# mail root

    Subject: This is great!

    This is great!


    ngilbert:/var/X11R/lib# mail

    Mail version 5.5 6/1/90. Type 7 for help

    /var/spool/mail/root> 2 messages new 2 reread

    U root Thu Sep 5 May 15:02:23 132/432

    ON 2 root@gilbert.kevinete "Register with the Lin"

    "This is great!"

