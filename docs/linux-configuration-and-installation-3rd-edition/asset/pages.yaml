    # Linux Shells


    A shell acts as the intermediary between you and the raw operating system, interpreting
    your commands into a form the operating system can understand. In addition, a
    shell adds much of the functionality we''ve discussed in this chapter and adds
    even when (or if) you start programming your own shell scripts.


    As you''ll remember from Chapter 2, you set up a shell when you add a new user
    to your system, the default being bash. How much emphasis you put on the shell
    depends on your UNIX background and needs. On the one hand, if you''re used to
    working with a particular shell, you should use that shell (or its equivalent)
    in Linux. On the other hand, if you''re not experienced with any particular shell,
    you should stick with the default shell under Linux, bash.'
