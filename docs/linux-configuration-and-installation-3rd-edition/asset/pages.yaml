- img_proc: true
  md: '# CHAPTER 3: Installing and Configuring XFree86 129


    commented out in this section. The main options you can set here are listed in
    Table 3.7.


    Table 3.7 Server Flags Options


    | Option | Meaning |

    | --- | --- |

    | NoTrapSignals | Core dumps X when a signal arrives; useful for debugging |

    | DontZap | Disables Ctrl-Alt-Backspace |

    | DontZoom | Disables switching between graphics modes |


    Most of these flags work backwards. If you uncomment the entry, it turns the feature
    off. By default, we comment out (leaving on) the two “don’t” features. We also
    comment out (leaving off) the NoTrapSignals option.


    We like being able to kill an errant X server by simply holding down Ctrl-Alt-Backspace,
    so we always comment out DontZap. If you turn on DontZap, you are disabling this
    feature.


    DontZoom disables the keyboard sequences that allow you to switch between graphics
    modes. We find this switching to be essential in testing our XF86Config files,
    so we always leave this feature on by commenting it out in the XF86Config file.


    Our Server "ServerFlags" section, with everything commented out, looks like:


    ```

    "ServerFlags"

    # NoTrapSignals

    # DontZap

    # DontZoom

    EndSection

    ```


    Just like in UNIX shell scripts, the # character marks a comment line in the XF86Config
    file.


    # Configuring the Keyboard Section


    The keyboard section allows you to set up a number of options about your keyboard,
    which we list in Table 3.8.'
