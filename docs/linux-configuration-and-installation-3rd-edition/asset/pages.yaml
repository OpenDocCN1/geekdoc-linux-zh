    # Moving and Renaming Files with Mv


    The **mv** command is used to move files from one directory to another. This command
    doesn''t leave a copy of the original file in the original location (for that,
    use the **cp** command); it deletes the original copy and inserts the new copy
    in the new location.


    The following command line would move the **textfile** file to the new home (~
    ) location:


    ```

    gilbert:/usr$ mv textfile ~

    ```


    If you were to run the ls, you''d find that **textfile** didn''t appear in /usr/,
    but was now located in your home directory.


    In this example, **textfile** retains its current filename, no matter where you
    move it. You can also use the **mv** command to rename a file. (In fact, it''s
    one of the few ways to actually rename a file, because there''s no command for
    doing so within Linux.) The following command changes the **textfile** filename
    to **aardark**:


    ```

    gilbert:-$ mv textfile aardvark

    ```


    The following command would move **textfile** to a new directory and give it a
    new filename of **aardark**:


    ```

    gilbert:/usr$ mv textfile ~/aardark

    ```'
