    Be careful when you combine the rm command and wildcards, because a wildcard—especially
    an asterisk—in the wrong spot can wreak havoc with your system. For example, let''s
    say you wanted to delete all the files ending with .golf on your system (say the
    boss is beginning to be a little suspicious about your afternoon field trips and
    you want to remove any incriminating evidence). So you tell Linux to remove all
    files ending with golf—or you think you will, anyway:


    ```

    gilbert:~/emos$ rm * golf

