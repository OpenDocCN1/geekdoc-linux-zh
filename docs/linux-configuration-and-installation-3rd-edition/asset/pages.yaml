  md: '# CHAPTER I: Linux and PC Hardware


    This selection from the Slackware FAQ should illustrate problems associated with
    low memory:


    Q: I can''t get anything to work at all! What''s the deal?


    A: If you seem to suffer catastrophic failure (!), then check the file FILE_LIST
    against ftp.cdrom.com in /pub/linux/ slackware against the contents of your disks
    and make sure you''re not missing any files.


    Also, I''ve noticed that most of the reports of kernel panics and system hangs
    have come from people with 4MB. If you''re running into these types of problems
    I''d suggest forcing over the $$$ for 4 more megss. I have 8MB of RAM and never
    have crashes. (Well, when I really push my luck). If you don''t want to do that,
    then go through your /etc/init.rc.* files and get rid of any daemons you don''t
    use, cron, lpd, or selection.


    If you''ve got 4MB and you''re getting "virtual memory exceeded in new!" warnings,
    make sure you do it and activate a swap partition before running setup. If you''re
    really hard up on memory, you can boot a rootdisk using editroot instead of the
    usual boot kernels. You will miss the floppy in the root drive, or from the hard
    drive. And you''ll also not be able to create any kind of boot disk, so you''ll
    have to install LILO and take your chances. I suggest using this approach only
    a swapfile which will not work.


    Linux will boot and run on a PC with 4MB of RAM. However, you''ll be running into
    memory constraints very quickly, and the chances are that you won''t be able to
    run the X Window System at all. In fact, 8MB is barely enough to run X and Linux.
    We used the combo on an 8MB machine, and the results weren''t too encouraging;
    in fact, we were strongly encouraged to ramp up to 16MB of RAM right away.


    This is why we recommend you upgrade and buy as much RAM as you can afford. Before
    you do so, you should know how today''s PCs handle RAM and how you can buy it.


    Almost every new PC supports Single Inline Memory Modules, or SIMMs. Additionally,
    almost every new PC has four SIMM slots on the motherboard, and most SIMMs are
    sold in multiples of two or four—1MB, 2MB, 4MB, or 8MB. The less memory on a SIMM,
    the cheaper the SIMM.


    If you bought a PC with only 4MB of RAM, you probably ran into a situation where
    there were four 1MB SIMMs installed in the four motherboard slots. When you upgrade
    your PC''s RAM, this means 1MB


    ![](img/05da311512608405596dd882623b9142_40_0.png)'
  merge: -1
  pgno: 40
- img_proc: true
  md: '# CHAPTER I: Linux and PC Hardware


    SIMMs were relatively worthless, unless you bought a PC from a vendor that allows
    you to trade in old RAM when buying new RAM. (The trade-in price depends on the
    vendor. Typically, you''ll get a credit for half the price of the old RAM when
    trading it in, provided you bought a PC from a vendor that assembles its PCs.
    We''ve dealt with some clones that give you full credit on the old RAM when trading
    it in, provided the PC was bought within the last year.) The same would be true
    if you bought a system with 8MB of RAM, and the SIMM slots were filled with 2MB
    SIMMs.


    The best-case scenario is if you have a PC and only half of the SIMM slots are
    filled; in our case, we lucked into purchasing an 8MB PC that had 4MB SIMMs. (Contrary
    to popular belief, not every PC needs the SIMM slots filled in order to function.)
    In this case, we needed to buy two more 4MB SIMMs to stick in the slots, bringing
    the total to 16MB.


    Depending on the motherboard configuration, you might have to play with the SIMMs
    and their order in the slots. In the case of the 8MB PC with two more SIMMs added,
    we needed to stagger the SIMMs (old SIMM, new SIMM, old SIMM, new SIMM) before
    the system would recognize all 16MB of RAM. Normally this isn''t that''s documented,
    so you might need to call the customer-support line for your PC manufacturer for
    advice when adding new SIMMs.


    ![](img/05da311512608405596dd882623b9142_41_0.png)


    EDO RAM is all the rage these days on new PCs. Basically, EDO RAM is faster than
    conventional RAM, but like everything else in the computer, you may pay a little
    extra for the privilege of speed.


    Therefore, the issue becomes whether it''s worth the extra money to buy EDO RAM
    instead of conventional RAM (provided, of course, the base price of a PC doesn''t
    already feature EDO RAM; several large computer companies, such as Dell, have
    already started featuring EDO RAM in all of their configurations). Our experience
    is that it''s worth the extra money. We''ve never run into a situation where the
    price of upgrading to EDO was too exorbitant, and the increase in performance
    was worth the slight increase in price.


    ![](img/05da311512608405596dd882623b9142_41_1.png)


    Slackware Linux doesn''t care whether you''re using EDO RAM or conventional RAM.'
  merge: -1
