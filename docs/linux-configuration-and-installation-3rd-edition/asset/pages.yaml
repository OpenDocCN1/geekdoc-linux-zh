    # Using Emacs


    The elvis/vi text editor covered in Chapter 4 is a pure text editor; all it

    did allow you to open or create a text file and edit it in a full-screen

    layout. (It also performs this basic capability in a very confusing manner,

    forcing you to distinguish between command and input modes.)


    The emacs text editor goes a little further in its capabilities and

    eisier to use. Created by Richard Stallman and controlled by the Free

    Software Foundation, emacs has evolved into an essential piece of

    software for most UNIX users, even though emacs ships with relatively

    few commercial implementations of UNIX; its appeal is such that

    system administrators are willing to go the extra mile and obtain it for

    use on their systems.'
