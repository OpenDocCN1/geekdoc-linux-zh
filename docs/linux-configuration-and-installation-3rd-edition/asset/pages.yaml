  md: '# 238 CHAPTER 4: Basic Linux Tools


    Several shells ship with Unix:


    +   - **bash**, the Bourne Again SHell. This contribution from the Free Software
    Foundation is the default Linux shell and probably the most popular Linux shell.
    **Bash** is compatible with the Bourne shell (sh), which means it will run scripts
    written for the Bourne shell. In addition, **bash** adds some popular features
    not found in the original Bourne shell, such as the *history* command (which will
    be covered later in this section) and command-line editing. By and large, you''ll
    want to stick with **bash** unless you have some reason to switch.

    - **csh**, the C shell. This widely available shell is also popular, and because
    it''s available on most UNIX platforms, you may be familiar with it. The C shell
    originated the notion of command history, but it doesn''t offer command-line editing.

    - **sh**, the original Bourne shell. It offers compatibility with **bash** and
    Bourne scripts from other implementations of UNIX. However, the original Bourne
    shell does not offer command history or command-line editing.

    - **dksh**, the Public Domain Korn shell. This is a free version of the commercial
    Korn shell, which in many ways combines the best aspects of the C and Bourne shells,
    such as command-line editing and command history. Be warned that it''s not exactly
    like the commercial Korn shell, and if you decide to move existing scripts from
    any other UNIX box, you may find that they don''t totally work on **dksh**.

    - **tesch**, an enhanced version of the C shell that supports command-line editing.
    In most ways, this is the best choice for C shell users who want the equivalent
    on their Linux box.

    - **ash**, a trimmed-down shell used when memory is extremely tight.

    - **zsh**, the Z shell. Yet another Bourne-compatible shell.


    To list the shells you''re using, use the following command line:


    ```

    gilbert:-$ echo $SHELL

    bash

    ```


    As noted, the **bash** shell is very popular on Linux, and unless there''s a reason
    to switch, you''ll probably want to stick with it. (It also is POSIX-'
