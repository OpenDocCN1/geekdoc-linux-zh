    while additional information about abuse can be found at /usr/games/abuse-1.05.
    An X Window version, xabuse, is also available.


    # Arithmetic


    If you''ve successfully installed Slack Linux, you can probably handle the simple
    math problems posed by arithmetic with a series of equations; to the end, press
    Ctrl-C. If you''re really competitive, however, you''ll note that you''re judged
    at both the number of correct answers and how fast you answered the questions.


