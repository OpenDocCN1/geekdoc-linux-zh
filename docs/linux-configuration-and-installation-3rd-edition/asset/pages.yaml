  md: '# PCMCIA and Laptops


    A separate package, Card Services, is used for PCMCIA support on laptops; this
    package is included on the accompanying CD-ROM. We''ll cover the topic in more
    depth in Chapter 2 (including the installation of Card Services), but for now,
    you all need to know is that all common PCMCIA controllers (including those built
    around chips from Databook, Intel, Cirus, Ricoh, Vadem, and VLSI), as well as
    custom controllers found in IBM and Toshiba laptops, are supported. In addition,
    the PCMCIA-HOWTO reports that the package is used on desktop computer systems
    with PCMCIA card adapters.


    Be warned that the Motorola 6AHC05GA controller used in some Hyundai laptops and
    the proprietary controller used in Hewlett-Packard Omnibook 600 notebooks are
    not supported.


    # Learning About PC Hardware


    You''ve probably noticed references in this chapter to things like interrupts
    and IRQ settings. If you''re a PC hack, you know what these nasty things mean.
    If you''re not a PC hack—you are in for a rude awakening.


    Simply put, the PC architecture assigns addresses to peripheral devices. If these
    addresses conflict, you have problems. Some peripherals, such as network cards,
    need to be set to specific addresses, which others do not.


    Our goal isn''t to turn you into a hardware hack (and, quite honestly, discussions
    of interrupts and IRQ settings really depress us), so we suggest checking into
    a more specifically angled PC hardware book like Jim Aspwall''s IRQ, DMA & I/O
    (MIS:PRESS). PC hardware doesn''t have to be intimidating, but you should be prepared
    for a high level of detail if you start messing around with the innards of your
    personal computer, especially if you''re a UNIX hack who doesn''t know much about
    PCs in general. For your convenience, we list several good books on PC hardware
    in Appendix A.'
  merge: -1
