    # Text-Processing Tools


    Like the UNIX operating system as a whole, UNIX offers many tools for text processing,
    in addition to the text-editing tools already covered in this chapter and in Chapter
    4. This split requires a little background first, however.


    As you''ve been told repeatedly throughout the course of this book, UNIX (and
    by extension, Linux) is built upon a set of specialized commands, as computing
    chores are divided between many small-scale, specific commands. To create a document,
    for example you can''t merely call on a word processor like WordPerfect and create
    a document from beginning to end, with fancy layouts and fonts. While emacs does
    do many of the things a good Windows or Macintosh word processor would do, it''s
    still limited when it comes to page layouts and other things associated with advanced
    word processing and rudimentary desktop publishing.


    That weakness is actually inherent in the UNIX operating system, which delegates
    small tasks to small commands. Traditionally, creating a document within UNIX
    has involved three sets of tools:


    +   - Text editors, such as vi or emacs

    - Text processors, such as groff or TeX

    - Printing commands, such as lpr


    In this chapter and in Chapter 4, you''ve learned about the major text editors
    in Linux. In this section, we''ll run down the major text processors in Linux;
    then we''ll discuss printing in Linux.'
  merge: -1
  pgno: 305
- img_proc: true
  md: '# CHAPTER 5: Linux Applications 275


    # Groff:The Traditional Standard


    Early in its history, UNIX was viewed as the perfect front end to a robust printing
    system. (This is how early UNIX development was justified by Bell Labs, as a matter
    of fact.) As a result, there are many text-processing tools in UNIX. Some of them
    have been superseded by commercial what-you-see-is-what-get text editing/processing
    packages in the commercial world (such as FrameMaker and WordPerfect). However,
    for most of your basic text-processing needs, you''ll find that groff and its
    brethren fit the bill.


    roff was an original text-processing tool from the Bell Labs days of UNIX, which
    evolved into various other tools (like troff and psoff). Groff and its descendants
    were viewed as text-processing filters, which would take the output of a text
    editor (properly formatted with groff commands, of course) and send it to a specific
    printer. These formatting commands could include columns, fonts, boxes, and other
    layout elements.


    The Slackware version of Linux features groff, the Free Software Foundation version
    of troff. Groff and its accompanying utilities allow you to format documents for
    a wide range of devices, including PostScript printers (using the ps device driver),
    TeX, X Window programs, and other line printers.


    # Using Groff


    As mentioned, groff is a text processor, which means it takes input from a text
    editor (like vi or emacs) and prepares it for output on another device. For your
    part, you must input groff formatting commands into your text document.


    Groff formatting commands begin with a backslash (\) or a period (.). groff takes
    these commands and interprets them for the output device. For example, you may
    want to input the text found in Figure 5.8, using vi or emacs, saving the file
    as rules in your home directory.


    You can also send the groff-formatted document to the default printer, using the
    following command line:


    ```

    gilbert:~/ groff rules | lpr

    ```'
  merge: -1
