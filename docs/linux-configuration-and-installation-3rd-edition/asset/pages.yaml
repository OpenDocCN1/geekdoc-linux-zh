  md: '# CHAPTER 10: Programming in Linux


    # Compiling the Long Way


    When we used the cc command, cc first compiled the program into an object module.
    Then cc linked the object module to create an executable program, the file named
    chap10. This is very important if you need to compile more than one file into
    your program. Most C programs require a number of .c files, all of which must
    be compiled and linked to form one program. One of the main reasons for separating
    C programs into multiple files is sanity: reading a 1MB program in one file is
    ludicrous. And yes, C programs get to this size, and even much bigger than 1 megabyte.
    Some C programs we''ve worked on include more than a million lines of C code.
    You need to know how to compile multiple .c files into the executable command
    because the vast majority of Linux freeware comes in this fashion.


    To use the long method of compiling and linking, split the tasks into two steps.
    First, you compile all the .c files you require. Then you link the resulting .o
    files (we''ll get into this later) into your executable program. Because we have
    a very small C program in already (did you type it in, didn''t you?), we''ll start
    with that.


    Compile chap10.c into an object module, an .o file, with the following command:


    ```

    $ cc -c chap10.c

    ```


    If you are successful, you should see a file named chap10.o in your directory.
    The .o file is called the object file (or object module); it contains unlinked
    machine code.


    The next step is to link the object files (there''s usually more than one) into
    an executable file. To do this, we again use the -o option to cc, but this time
    we pass a .o file at the end of the command line, rather than the .c file we used
    earlier:


    ```

    $ cc -o chap10.o

    ```


    This command links the file chap10.o into the executable program chap10. You can
    place more than one object filename on the command line, as in the following example:


    ```

    $ cc -o chap10_a.o chap10_b.o chap10_c.o

    ```'
  merge: -1
  pgno: 477
- img_proc: true
  md: '# CHAPTER 10: Programming in Linux 447


    Normally you''ll want to pick more descriptive filenames than the ones

    we''ve used.


    # Working with Cc


    In normal operation, the cc command executes a number of other

    commands under the hood. One such command is cpp. The cpp

    command is the C preprocessor. This reads a C program file, a c file,

    ands expands any # directives. In the short program you typed in earlier,

    the #include directive means to include the file stdio.h. That is, cpp reads

    in stdio.h and inserts the contents right at the #include directive. Most C

    programs use one or more include files.


    These include files are normally stored in /usr/include/. If you use

    angle brackets, (< and >), around an include filename, like <stdio.h>,

    means that cpp looks for a file named stdio.h in the standard places,

    of which /usr/include is the default (the -command-line parameter can

    add more directories to the include file search path; see Table 10.2 later).

    You can also use quotation marks ('''') around the filename.


    All C programs are built around a function labeled main(). The

    main() section (called a function in C parlance) is executed when the

    program starts. Our main() function simply calls the printf() function,

    which prints the text between the quotation marks to your screen. As

    You can tell, this is not a sophisticated program.


    The \ character passed to printf() in our program means that a

    newline character is printed. This starts a new line. If you''re used to a

    DOS machine, you''ll note that UNIX uses a newline character where DOS

    uses a carriage return and then a new line. The backslash \, is used as a

    special character in C programs. Usually, a backslash is combined with

    another character to make a nonprintable character, such as \n for a new

    line, \t for a tab, or \a for a bell.


    # Using the Cc Command


    The cc command uses a number of command-line parameters to tell it

    what to do and allow you to fine-tune the process of building

    executable programs from C language text files. Table 10.2 lists

    commonly used cc command-line parameters.'
