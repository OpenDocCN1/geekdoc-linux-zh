    gilbert:-$ man tar

    ```


    or use the info command to view the texinfo explanation of tar.


    # Unarchiving an Archive


    You''ll also use tar to unarchive a tar file, using a command line that looks
    like the following:


    ```

    gilbert:-$ tar xvf archive.tar

    ```


    This will unarchive the files and create any subdirectories found in the archive.
    However, these subdirectories will be created as subdirectories of the current
    working directory. In the preceding command line, if there''s a directory named
    stuff, it will be created as a subdirectory of the user''s home directory. When
    files are archived, tar automatically strips the leading slash (/), which denotes
    an absolute pathname. If you''ve been a good UNIX user, you''ve created an archive
    based on a new subdirectory, so all the files that are unarchived will be in their
    own subdirectory.


    To see what files are in an archive, use the t function with tar:'
