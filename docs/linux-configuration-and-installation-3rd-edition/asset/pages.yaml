  md: '# Appendix B: XFree86 and Extensions


    (Yes, we cheated and built the LBX extension at the same time we built PEX).

    Once you''re confident that everything is built up properly, run make clean in
    the /usr/X11R6/lib/Server directory (again as root):


    ```

    $ make clean

    ```


    This will get rid of the .o files created when you built the X servers and free
    up a lot of wasted disk space.


    As a final test, you may want to run one of the PEX demo programs that comes with
    X (you may not have loaded these programs, though), such as beach_ball.


    # Performance and Memory Issues


    PEX consumes a lot of system resources, so don''t load this extension if you''re
    short on physical memory. When we built PEX and LBX into a new X server, it grew
    quite a lot, from 1,351,712 bytes to 1,509,550 bytes on disk.


    Because of this, you may not want to compile in PEX or XIE, two of the largest
    X servers. If you have a low-memory system, then PEX or other large extensions
    like XIE (the X Image Extension) are simply not for you.'
