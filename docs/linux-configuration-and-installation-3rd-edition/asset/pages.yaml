  md: '# CHAPTER I: Linux and PC Hardware


    # Removable Drives


    As is the case with all SCSI controllers, any removable drive connected to a working
    SCSI controller should work, including optical (MO), WORM, floptical, Bernoulli,
    Zip, SyQuest, and other PD drives.


    If you''re using a parallel-port drive, you can grab a patch from ftp://gear.torque.net/pub/
    and see if it works.


    Linux supports both 512 and 1024 bytes/sector disks.


    # I/O Controllers


    Any standard serial/parallel/joystick/combo card can be used with Linux, including
    those sporting 8250, 16450, 16550, and 16550A UARTS. Cards that support nonstandard
    IRQs (such as an IRQ of 9) can be used.


    # Outward Connectivity


    UNIX was written with the express purpose of linking computers outward connectivity.
    Therefore, it''s no surprise that Linux puts a premium on outward connectivity.
    This begins at a very basic level with network cards and expands to other telephone-based
    connectivity tools, such as modems and ISDN cards. This section covers all such
    devices.


    # Network Cards


    If you''re planning on using Linux on a network, you''ll need a networking card.
    (If you''re not planning on using Linux on the network, you won''t need a card.)
    Other PC Unices require the presence of a network card to run (even on a single-user
    installation), but Linux is not one of them.


    The following Ethernet cards have been tested and are supported under Linux: 3Com
    3C501, 3C503, 3C505, 3C507, 3C509/3C509B (ISA)/3579 (EISA); AMD LANCE (79C60)/PCnet-ISA/PCI
    (AT1500, HP J2405, NE1500/NE2100); AT&T GIS WaveLAN; Allied Telesis'
