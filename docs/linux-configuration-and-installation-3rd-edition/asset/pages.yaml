- img_proc: true
  md: '# 80 CHAPTER 2: Installing Linux


    When you install a kernel from this menu, all it does is put the kernel file onto
    your root Linux partition as /mlinuz. Until you make a system bootdisk from it
    or install LILO, your system is not ready to boot. So, you''ll want to make a
    system bootdisk from the next menu.


    ![](img/05da311512608405596dd882623b9142_111_0.png)


    # Creating a Boot Floppy


    Linux will boot from either a floppy drive or a hard drive. However, it''s recommended
    that you set up the means to boot either way; that way, if you have hardware problems,
    you can always boot the system from a floppy drive. Hence, the request from the
    setup program to create a boot floppy. This floppy can be used to boot Linux at
    any point. This will be handy should you experience some hard disk problems or
    screw your hard disk so severely that the system won''t load.


    If you don''t create a boot floppy at this time, you can always do so later. The
    topic is covered in some depth in Chapter 6.


    ![](img/05da311512608405596dd882623b9142_111_1.png)


    # Configuring the Modem


    If you''re planning on using a modem for connecting to online systems or to a
    TCP/IP network via SLIP or PPP, you need to configure the modem. Essentially,
    this involves just telling Linux what serial port the modem is connected to. The
    first serial port on a PC is called com1, and under Linux parlance this becomes
    cua0; the second serial port on a PC is called com2, and under Linux parlance
    this becomes cua1; and so on. (Note the noting difference; UNIX likes to start
    things at 0, and PCs prefer to start things at 1.)


    After you set up the modem, you''ll be asked to set the speed for the modem. The
    choices (38400, 19200, et. al.) are pretty clear.


    If you''re using a modem and the speed isn''t represented on the menu, use the
    next-fastest speed. For example, to properly configure a 28800-bps modem, you''d
    choose 38400.


    ![](img/05da311512608405596dd882623b9142_111_2.png)'
  merge: -1
