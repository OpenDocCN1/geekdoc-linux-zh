    # Setting a Screen Background


    In X, you can display a bitmap image, a solid color, or a graphics file as your
    screen background, depending on the program you use to accomplish this task.


    The xsroot program sets the screen background color. It can also set the screen
    background to a monochrome bitmap. .xinitrc files set the background color to
    SteelBlue. Other good screen background colors include bisque and MediumTurquoise.
    You can see the whole list of X color names in the text file /usr/lib/X11/rgb.txt.
    This file contains a number of entries, including:


    +   - 255 239 213 PapayaWhip

    - 255 235 205 BlancheAlmond

    - 50 205 50 LimeGreen


    The xsroot program can also be used to set the screen background to a monochrome
    bitmap, stored in an X bitmap file. The syntax for setting the screen background
    to a bitmap is:


    ```

    gilbert:$ xsetroot -bitmap filename -fg fore -bg bg

    ```


    where filename is the name of the file containing the bitmap and the fore and
    back are optional parameters that set the image''s foreground and background color,
    respectively. Use the colors from the rgb.txt file explained earlier.


    For example, if you have an X bitmap file named prisoner.xb, you can set it to
    be tiled over the screen background with the following command:'
  merge: -1
  pgno: 195
- img_proc: true
  md: '# CHAPTER 3: Installing and Configuring XFree86 16


    ```

    gilbert:$ xsetroot -bitmap prisoner.xb

    ```


    You’ll see a screen like that shown in Figure 3.8.


    ![](img/05da311512608405596dd882623b9142_196_0.png)


    Figure 3.8 Using a bitmap as the screen background.


    Because the image looks good in black and white, we skip the -fg and -bg options
    to xsetroot (and leave the famous penny-farthering bicycle alone).

    If, instead of an X bitmap file, you have a GIF, TIFF, or JPEG image, you can
    use xv to display the image. Xv is a very neat image and file manager that sports
    the ability to convert images from one format to another and way a very cool Visual
    Schnauzer. Normally, you display images in xv’s window, but it can also display
    images on the screen background, also called the root window.

    For xv, use the following syntax to display an image on the root window:


    ```

    gilbert:$ xv -quit -root -max filename

    ```


    where filename is the name of the file you want to display. When you run this
    command on an image file, you’ll see a result like the one in Figure 3.9.'
