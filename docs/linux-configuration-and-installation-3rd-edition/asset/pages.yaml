    # Dealing with Errors


    Although it is a very infrequent occurrence, you may experience an error message
    or two when installing Linux from the disk sets. One of the errors may be Device
    Full, which means that you''ve filled your hard drive. Slackware, will continue
    to attempt to install software, even if the disk is full.


    To end the installation program, either hit the Esc key a few times or type Ctrl-C.


    # Configuring the Installed Software


    There are two main tasks involved after the Linux disk sets are installed: configuring
    XFree86 and setting up boot options.


    # Installing a Kernel


    The first Linux configuration task is to install a Linux kernel on your hard drive.
    It''s possible that you''ve already installed a kernel from the A series (there
    are two kernels on the A series, an IDE and a SCSI generic kernel), but in most
    cases it is preferable to replace this kernel with the one you''ve used to install.
    That way, there''ll be any surprises when you reboot; you''ve installed a kernel
    that you know works on your machine.


    To do this, select the bootdisk option on the Kernel Installation menu. You''ll
    be asked to insert your installation bootdisk, and the kernel will be copied from
    onto your hard drive. Other options on this menu include installing a kernel from
    a DOS floppy or from the Slackware CD-ROM. If you know exactly which kernel you
    need, you can try one of these options. You should be aware that installing the
    wrong kernel here can leave Linux unbootable, requiring you to use your bootdisk
    or Loadlin to start the system.'
