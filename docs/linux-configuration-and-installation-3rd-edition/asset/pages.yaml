  md: '# CHAPTER 4: Basic Linux Tools 215


    several improvements to the basic ls command found on other versions of UNIX.
    One improvement, which we can''t show you in the confines of a black-and-white
    text, is the addition of color to indicate directories (which will appear on your
    color as blue) and special types of files. (Later in this section we''ll explain
    how to change these colors and what the colors mean.) Linux also uses slashes
    after the name to indicate directories.


    In addition, ls (by default) sorts files and directories in ASCII order, in columns.
    beginning with b and c, followed by the rest of the alphabet. If there were directories
    that began with any capital letter, they''d be listed first; the directory X/
    would appear before bin/, because under ASCII uppercase letters prefers lowercase
    letters.


