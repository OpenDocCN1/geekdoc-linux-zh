  md: '# CHAPTER 4: Basic Linux Tools


    # Changing Ownerships and Permissions


    In the act of creating a file or directory, you automatically assign permissions
    to the file or directory. To see what permissions are the default, use the umask
    command:


    ```

    $ umask

    744

    ```


    This means that the owner of the file has full privileges, while your group and
    the world have the ability to read the file. To change this permission, you''ll
    again use the umask command, listing a new permission on the command line:


    ```

    $ umask 007

    ```


    This may look old, and indeed it is odd. The umask command changes permissions
    relative to a baseline of 777. The input to the umask command is therefore subtracted
    from the baseline 777, leaving you with the total of 770, meaning that the owner
    of the file and the group have full permissions to the file, while the rest of
    the world has no permissions at all.


    In the same way, you''re automatically the owner of a file when you create it,
    but there may be times when you want to transfer this ownership to another user.
    You can do so with the chown command, provided you''re logged in the system as
    the root user. (You didn''t think you could change the ownership logged in as
    an ordinary user, did you? If anyone could change the ownership of a file, security
    in the UNIX operating system would be nonexistent.) When using the chown (short
    for change ownership, by the way) command, you list the new owner of the command
    and the file in question:


    ```

    gilbert:~$ chown pat report

    ```


    You can also transfer ownership of an entire directory by using the -R option
    to the chown command:


    ```

    gilbert:~$ chown -R pat reports_1996

    ```'
  merge: -1
