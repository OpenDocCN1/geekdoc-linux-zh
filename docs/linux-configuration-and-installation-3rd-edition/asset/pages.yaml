    \ of course, would be meaningless if the users already had the ability to execute\
    \ the file. Table 4.4 lists the various symbols used with the chmod command.\n\
    \nTable 4.4 Symbols Used with the Symbolic Method\n\n| Symbol | Meaning |\n| ---\
    \ | --- |\n| u | User (owner of the file). |\n| g | Group. |\n| o | Other (the\
    \ world). |\n| a | Everyone (the owner, the group, and the world). |\n| + | Adds\
    \ permission. |\n| - | Removes permission. |\n| r | Read permission. |\n| w |\
    \ Write permission. |\n x | Execute permission. |\n| t | Sets the \"sticky bit\"\
