- img_proc: true
  md: '# CHAPTER 5: Linux Applications


    documents through the groff text processor. However, to create an online-manual
    page, you''d need to run the page through groff with two options: -Tascii (which
    tells groff to output in ASCII text, rather than formatting for a printer; the
    default is PostScript) and -man (which tells groff to use the manual-page macros).


    Groff is also capable of outputting for other devices and software applications.
    An option of -Tdvi produces files in the TeX device-independent DVI format.


    Table 5.5 Useful Groff Formatting Commands


    | Command | Result |

    |---|---|

    | .ad | Turns off text justification. |

    | .bp | Inserts a page break. |

    | .ce n | Centers the next n lines: if no number is specified, only the following
    line will be centered. |

    | .fi | Tells groff to fill the text lines (counters .nf). |

    | .ft n | Changes the font to n (B for bold, and so on). |

    | .fn | Changes the font to n (B for bold, and so on). |

    | .in n | Indents the following lines by n spaces. |

    | .ls n | Sets the line spacing on a document. For example, ls 2 would change
    the spacing to double-spaced; the default is single-spaced. |

    | .na | Turns on text justification (counters .ad). |

    | .nf | Tells groff not to fill the lines of text. |

    | .pl n | Sets the number of lines on a page to n; the default is 66 lines to
    a page. |

    | .po ni | Sets the left margin; II (one ell) would set the left margin to I—must
    set this or the printing will begin at the absolute left of the page (you can
    use centimeters instead of using c instead of i). |

    | .ps n | Changes the point size to n. |

    | .sn n | Changes the point size to n. |

    | .sp n | Sets the number of lines to skip by n; to skip a specific space, use
    ni or for centimeters. |

    | .ti n | Indents the first line of the following paragraphs by n spaces. |

    | .un n | Underlines the following line; if a number (n) is specified, then n
    lines will be underlined. This must be used with entire lines, as you can''t underline
    a specific word. |'
  merge: -1
