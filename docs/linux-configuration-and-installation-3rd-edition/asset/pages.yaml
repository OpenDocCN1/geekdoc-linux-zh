- img_proc: true
  md: '# 372 CHAPTER 6: Basic Linux System Administration


    keys (depending on your keyboard) to stop the process. (If Delete or Break doesn''t
    work, try Ctrl-C or Ctrl-D.) If a process is running in the background or has
    been launched by another user at another terminal, however, you must kill the
    process via the kill command:


    ```

    gilbert:~# kill PID

    ```


    using the PID returned by the ps or other commands. This sends a signal to the
    process, telling it to cease and desist. Most processes don''t know what to do
    when they receive a signal, so they might commit suicide. Not all processes respond
    to the straight kill command; for example, shells ignore a kill command with no
    options. To kill a shell or other particularly stubborn processes, use kill with
    the -9 option:


    ```

    gilbert:~# kill -9 PID

    ```


    This sends an unconditional kill signal to the process. If you have many processes
    to kill, you can wipe them all out with:


    ```

    gilbert:~# kill 0

    ```


    This kills all the processes in a current process group, which oversees processes
    created by a common ancestor, usually the login shell.


    # More on the Foreground and Background


    As the Linux operating system keeps track of these many processes, it must set
    priorities; all, computing resources are typically finite (yes, we''d all love
    to have the power of a Cray for our tasks, but we make do with our overpowered
    multiuser systems), and some tasks are simply more important than other tasks
    when it comes to it attention. If a process doesn''t require input from you, go
    ahead and run it in the background. This means the process will run out of sight
    (and out of mind, too often), popping up only when the command is completed. While
    the command runs in the background, you''re free to work on other tasks with other
    commands.


    As you learned earlier in this book, running a process in the background is a
    matter of adding an ampersand (&) to the end of the command line:'
  merge: -1
  pgno: 403
- img_proc: true
  md: '# CHAPTER 6: Basic Linux System Administration 373


    $ command options &


    For example, you should run CPU-intensive commands, such as sort, in the background.
    There''s no reason for you to interact with the sort command as it goes through
    large files; your role in the process is to issue the command and stay out of
    the way. The sort command requires no input from you, and it doesn''t write to
    the screen as it performs the sort. The same goes for programmers who need to
    compile programs; their damage is done when creating the source code, not when
    compiling said code.


    The temptation, of course, is to assume that all commands can be run in the background,
    but this isn''t true. As a matter of fact, there''s a limited number of commands
    that you should run in the background. For example, any command that relies on
    continued input from you, as text editors and anything to do with electronic mail,
    shouldn''t be in the background.


    # Swap Space and Performance


    When you installed Linux, you were prompted about the installation of swap space,
    which extends your system''s random-access memory (RAM) to a physical disk. The
    notion of a swap space should be familiar to you if you''ve worked at all with
    UNIX on any sort of hardware platform, especially as you notice your drive thrashing
    when you switch between memory-intensive applications.


    Linux uses paging to swap portions of memory (in this case, a page of 4096 bytes)
    between your RAM and the hard disk. When you consider how memory-intensive any
    PC-based version of UNIX is (ounded by the memory requirements of the X Window
    System), it''s amazing Linux achieves the performance that it does. Of course,
    there are a few tricks used along the way: if the page from a read-only file,
    then that page is actually tossed aside and reread from hard disk when needed
    again. Similarly, Linux can share pages between applications; when you load two
    separate instances of an application at the same time, each instance of the application
    is actually reading from the same page of memory.


    When you installed Linux, you had the option of installing a separate partition
    for swap space. Before getting into that, we''ll go into Linux''s'
  merge: -1
  pgno: 404
- img_proc: true
  md: '# CHAPTER 6: Basic Linux System Administration


    memory-management tools and then let you decide if you really need to install
    more swap space.


    # I''m Free!


    The Linux free command lists the amount of free RAM in your system and how much
    RAM is being used:


    | gilbert:-$ free | | total used free shared buffers cached |

    |---|---|---|---|---|---|--|

    | Mem | 63252 | 8124 | 55128 | 6484 | 980 | 3852 |

    | -/+ buffers: Swap: | | 3292 | 59960 | | 0 |


    This output is new in Linux 1.3 and 2.0.


    ![](img/05da311512608405596dd882623b9142_405_0.png)


    The free command lists the total amount of RAM in blocks; a block is equivalent
    to 1024 bytes, which makes the total available memory on this machine 14.99 megabytes
    (no, we didn''t use a Pentium-based PC for this computation!). Where''s the rest
    of the memory, because there''s 16 megabytes installed? The free command literally
    lists the free memory; the rest is under control of the kernel and can''t be accessed
    at any time.


    Because there''s not a lot happening on this machine (the free command was run
    immediately after the machine was booted), it''s no surprise that only 3 megabytes
    or so of RAM are actually being used, while more than 11 megabytes are free. In
    addition, 2 megabytes are shared between processes. Contrast this to Figure 6.1,
    run after XFree86 is running.'
  merge: -1
  pgno: 405
- img_proc: true
  md: '# CHAPTER 6: Basic Linux System Administration 375


    | | total used free shared buffers |

    |---|---|---|---|---||

    | Mem: | 14648 8296 6352 5960 3112 |

    | +/- buffers: | | 5184 9464 | |

    | Swap: | 0 | 0 |


    **Figure 6.1** Running the free command under X.


    The numbers change a bit after loading X Window—all of a sudden there''s only
    a little more than 6 megabytes, free, with more than 8 megabytes in use, and more
    than 6 megabytes shared between processes.


    The numbers in the buffers column refer to memory set aside by the system for
    common disk operations; instead of going to disk for every little task, Linux
    sets a portion of discretionary memory for these tasks (meaning that RAM gets
    low, this memory will be freed for other purposes).


    In this example, no swap space was set up when Linux was installed; hence the
    zeros.


    # Deciding Whether to Swap Space


    If you''ve got 16 megabytes of RAM in your PC, as was in the case in the previous
    example, you probably won''t need swap space, unless you''re performing some computational-intensive
    task, such as programming. In these cases, you''ll probably want to set up some
    swap space. However, if you didn''t set up a separate swap partition when installing
    Linux, you''re out of luck unless you use fdisk to partition your hard drive and
    reinstall Linux.


    If the owner of the machine used as an example in the previous section wanted
    to install some swap space and not reinstall Linux, the only option would be to
    set up a swap file. Installing a swapfile is actually very similar to the routine
    for setting up a swap partition in Chapter 2, though it can be a tad involved.'
  merge: -1
  pgno: 406
- img_proc: true
  md: '# CHAPTER 6: Basic Linux System Administration


    It’s best to perform this task logged in as *root*; otherwise, you’ll probably
    run into file-permission problems.

    Your first step is to actually set aside the space for your swap file on your
    hard disk, which means you’ll use the **dd** command. Before you use it, however,
    you’ll need to figure out how much hard-disk space you want to set aside for a
    swap file and what you want to name it (no, it''s a little less than naming a
    child; you’re best off calling it *swap* and leaving it at that). For example,
    the following command would set up a 10MB swap space:


    ```

    gilbert:~# dd if=/dev/zero of=/swap bs=1024 count=10240

    ```


    The **dd** command writes data from a special device file called /dev/zero (don’t
    worry; you don’t need to know anything about this file past its existence in this
    circumstance) into a new file called /swap. We set the block size as 1,024, and
    we set aside a total of 10,240 bytes, which ends up being 10 megabytes of RAM.
    We chose 10 megabytes because it’s a nice round number.


    You’ve created a swap file, but you need to format it. Do so with the **mkswap**
    command (a command you should recall from the Linux installation information).
    In this case, you can format the /swap file to a size of 10,240 bytes:


    ```

    gilbert:~# mkswap -c /swap 10240

    ```


    Make sure that the new swap file and the rest of the file system are set up correctly,
    use the **sync** command:


    ```

    gilbert:~# sync

    ```


    You’re not through yet! You still need to tell Linux that it has a swap file available.
    In this case, you’ll use the **swapapon** command, specifying the name of the
    swap file:


    ```

    gilbert:~# swapapon /swap

    ```


    After doing all this, we can see from running the **free** command again (as shown
    in Figure 6.2) that there is indeed swap space available.'
  merge: -1
  pgno: 407
- img_proc: true
  md: '# CHAPTER 6: Basic Linux System Administration 377


    ```

    $ free

    gilbert# free total used free shared buffers

    Mem: 14648 14116 532 6192 8540

    -/a buffers: 5576 9072

    Swap: 10236 0 10236

    gilbert# |

    ```


    Figure 6.2 Running free after installing swap space.


    After you''ve installed the swap space and you want the space to be permanently
    loaded on your Linux every time you boot, you''ll need to add a line to the /etc/fstab
    file. It is the file that maintains the mounting of filesystems when Linux boots.
    It''s a somewhat confusing process, but essentially the /etc/rc.d/rc.5 file contains
    the following line:


    ```

    swapon -a

    ```


    that searches the /etc/fstab file for any swap spaces. If none are present, then
    installation continues as normal. If there is a swapfile or partition noted in
    /etc/fstab, then it is automatically mounted as Linux loads. Therefore, make sure
    you add to /etc/fstab a line like the following:


    | device directory type options |

    | /swap none swap sw ||


    To disable the swap partition, use the swapoff command:


    ```

    gilbert:~# swapoff /swap

    ```


    Don''t delete the swap file before using the swapoff command.'
  merge: -1
  pgno: 408
- img_proc: true
  md: 'If you''re not going to be using the swap file again, you can go ahead and
    remove it from your system, using the rm command. You''ll also need to edit the
    aforementioned /etc/fstab file and remove the swap file line from the file; if
    Linux searches for a swap file and doesn''t find one, it will generate a few errors
    and you run the danger of risking memory integrity.


    # Mounting Filesystems


    In UNIX parlance


    In theory, you won''t need to mount anything through your Linux system if everything
    installed correctly. You may need to mount a hard drive or a new CD-ROM if you
    make changes in your system, or you may want to mount a tape drive only when you
    actually need it.


    However, mounting a device is rather simple. Basically, you can use the mount
    command to mount a device, specifying both the device to be mounted and the location
    in the filesystem where you want the device to be located. (The location must
    already exist, so you need to create it before using the mount command.) Rendered
    abstractly, the mount command looks like this:


    ```

    gilbert:~# mount device mountlocation

    ```


    where device is the name of the device and mountlocation is the location of the
    device on the filesystem. As you''ll recall from Chapter 2, Linux uses a series
    of device names to specify devices, such as /dev/cd0 for the first CD-ROM drive
    on a system, /dev/cd1 for the second CD-ROM drive on a system, and so on. The
    mountlocation is merely the place in the filesystem where you want to be able
    to access the files on the'
  merge: -1
  pgno: 409
- img_proc: true
  md: '# CHAPTER 6: Basic Linux System Administration


    device; a good place to locate mountlocation is in the usr directory, and you
    must combine this with a name of a directory. Therefore, to mount a SCSI CD-ROM
    drive with a location of /usr/cdrom, you''d use the following command line:


    ```

    gilbert:-# mount /dev/scd0 /usr/cdrom -rt iso9660

    ```


    > NOTE the mount command no longer autoprobes reliably for the filesystem type,
    so you''ll need to specify it on the command line.


    To unmount a mounted filesystem, use the unmount command:


    ```

    gilbert:-# unmount /dev/scd0

    ```


    # Sending a Message of the Day


    System administrators who have worked on other UNIX systems may be used to sending
    out a message of the day to all the users of the system. The same capability exists
    in Linux.


    When a user logs in the system, the contents of the file /etc/motd are automatically
    displayed on their screen. Therefore, to send out a message of the day, you need
    to create a /etc/motd file. This can be done with a text editor vi or emacs, saving
    a text file with a filename of /etc/motd.


    > NOTE One of the system setup scripts (/etc/rc.d/rc.cs) creates new /etc/motd
    and /etc/issue messages based on the name of the running kernel. If you wish to
    use your own message files, you''ll need to comment out the lines in this script
    that make the new /etc/motd and /etc/issue files, or your custom versions will
    be overwritten upon reboot.'
  merge: -1
  pgno: 410
- img_proc: true
  md: '# Summary


    This chapter covered the basic system-administration tasks you''re going to run
    when using Linux. This involves mundane tasks like adding and deleting users,
    managing groups, creating boot floppies, scheduling commands, and more. However,
    there''s a lot more to UNIX system administration than we presented here, and
    if you''re planning on tackling the issue, we recommend that you purchase a good
    UNIX system-administration book and apply the general UNIX guidelines to Linux.


    The next chapter begins our coverage of extending Linux to the outside world,
    with a discussion of Linux serial-telecommunications tools.'
