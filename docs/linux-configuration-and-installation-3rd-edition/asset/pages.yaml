  md: '# CHAPTER 3: Installing and Configuring XFree86


    # User Accounts Under Xdm


    While you probably won''t have to edit any of the xdm system files in /usr/lib/X11/xdm,
    it''ll likely have to edit files in your home directory. By default, xdm runs
    a file named .session from your home directory, instead of the .xinitrc which
    is run by startx (and xinit).


    To create a .session file, you can start by copying your .xinitrc file to .session
    in your home directory. (Remember to put in the leading period on the filename
    in your home directory.) Then modify this file like you changed it.


    Here''s a copy of your .session file:


    ```

    #!/bin/sh


    resources=$HOME/.Resources

    ermodmap=$HOME/.Xmodmapnsysresources=/usr/X11R6/lib/X11/xinit/.Resources

    sermodmap=/usr/X11R6/lib/X11/xinit/.Xmodmap


    # merge in defaults and keymaps


    if [ -f $sysresources ]; then

    xrddb -merge $sysresources

    fi


    if [ -f $sysmodmap ]; then

    xmodmap $sysmodmap

    fi


    if [ -f $userresources ]; then

    xrddb -merge $userresources

    fi


    if [ -f $usermodmap ]; then

    xmodmap $usermodmap

    fi

    ```'
