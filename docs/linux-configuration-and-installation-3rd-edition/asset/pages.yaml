  md: '# CHAPTER 2: Installing Linux 85


    Any of the boot-kernel disks will work for floppy tape support. You''re installing
    from a SCSI drive, make sure you use a boot kernel with SCSI support.


    You need a blank MS-DOS formatted disk ready to store the install scripts and
    installation defaults. The installation uses two tape passes—one to read these
    files from the tape and the second to do the actual installation. Once you''ve
    written the files from the first tape pass to your floppy, you won''t need to
    scan those files again if you install from the same tape in the future.


    The tape must be written in GNU tar format (or in a compatible block size with
    some other tar). This is the command that would write out the tape, assuming you''re
    sitting in a directory set up like /pub/linux/slackware at ftp.cdrom.com:


    ```

    tar cv (a?,ap?,d1?,e2?,f?,k?,n?,t?,tcl?,x?,x1?,xap?,xd?,xv?,y)?/*

    ```


    This ensures that the files are written to the tape in the proper order.


    You must set your TAPE variable first, like these lines in the .profile file under
    bash:


    ```

    TAPE=/dev/nrft0

    export TAPE

    ```


    Unlike uninstalling from floppy disks, you don''t need to install all the *.tgz
    files, or even all the directories. The only requirement is that base.tgz is the
