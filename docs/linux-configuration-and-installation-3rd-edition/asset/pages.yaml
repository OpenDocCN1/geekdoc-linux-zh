  md: '# 422 CHAPTER 9: Linux and the Internet


    The work of rendering the home page is done at the local level, matching local
    resources to the specifications of the Web page. You''ll notice that there are
    few different point sizes and typefaces on the home page. The Web document makes
    a reference to <TITLE>; the Web page matches a local font and point size to the
    text.


    A graphic is also rendered locally. When the document downloads, the graphic is
    sent separately, in the GIF format, which makes for quicker file transfers. (Even
    so, some GIF documents can be very large and take a long time to download, even
    at a high-speed network link.)


    # URL Formats


    You tell a Web browser where to look by entering a Uniform Resource Locator, or
    URL. The WWW community has standardized on a number of URL formats, as listed
    in Table 9.2.


    Table 9.2 URL Formats and Their Meanings, from the WWW FAQ


    | Format | Represents |

    |---|---|

    | ftp://microsoft.com | File at an ftp site |

    | ftp://wuarchive.wustl.edu/mirrors | FTP site |

    | http://info.cern.ch:80/default.html | WWW site |

    | news:alert.hypertext | Usenet newsgroup |

    | telnet://dra.com | Telnet connection to Internet-connected server |


    This means that you can connect to many Internet resources via a Web browser.
    Most Web browsers have a menu selection or dialog box that allows you to enter
    a URL.


    # Communications with the UUCP Commands


    In many respects, the Internet is the “new wave” of UNIX communications. However,
    there are many UNIX and Linux users who might want to take advantage of other
    communications methods.


    One older method is UUCP. Originally, UNIX-to-UNIX Copy Program (UUCP) was written
    to communicate between systems via ordinary'
  merge: -1
  pgno: 453
- img_proc: true
  md: '# CHAPTER 9: Linux and the Internet


    telephone lines. The UUCP program allows you to copy files from one system to
    another. Today, these connections can take place between those same telephone
    lines via modem (at all speeds, from 2400 bits per second to 19.2 kbps), direct
    wiring, a local-area network, or a wide-area network connected via dedicated phone
    lines. Although the connection mechanisms have changed, the basic UUCP system
    has not; it remains mechanism-independent, which makes your life simpler. As a
    user, you don''t need to know the specifics of the connection mechanism; all you
    need to know is how to access the utilities that make communication possible.


    Dealing with UUCP and the networking utilities on a configuration level is an
    advanced topic best left to system administrators and those with iron stomachs,
    suitable for dealing with the complex task of networking Linux machines.


    There''s no one uberprogram that oversees Linux connections to the outside world.
    Much like everything else in the Linux and UNIX worlds, the communications utilities
    are quite small and serve limited purposes by themselves; only when strung together
    do they actually make up a powerful communications system.


    Why connect to the outside world? Some companies directly link far offices via
    dedicated phone line to ensure instantaneous communication among employees. Others
    connect via modem over phone lines to the UUCP Network, a series of UNIX computers
    that pass along electronic mail and files all around the world.


    In a rather confusing situation, UUCP refers to a specific command (uucp) and
    a series of related commands (most of which begin with uuc). In this chapter,
    uuc will refer to the specific uuc command, while UUCP will refer to the general
    command set.


    To make things even more confusing, there''s more than one implementation of the
    UUCP utilities on the market. In this chapter, we will be covering the HoneyDanBer
    UUCP, named for its three creators (Peter Honeyman, Dan A. Nowitz, and Brian E.
    Redman). This implementation is supported in the version of Linux on the accompanying
    program CD-ROM.


    # A UUCP Primer


    At its core, the UUCP commands allow machines to communicate directly via network
    links or telephone connections. They are limited in'
  merge: -1
  pgno: 454
- img_proc: true
  md: 'scope and are geared toward the rudimentary purposes of sending along files,
    electronic mail, and (sometimes) Usenet news.


    In this chapter, we''ll focus on the few commands you''re likely to use. (If you
    want information about all of the UUCP commands, check Appendix A for a list of
    further reading material.) We''ll also avoid configuration issues, which are best
    left to a system administrator.


    Before you use uucp, you need to know what machines are connected to yours. The
    uuname command does just this:


    ```

    gilbert:$ uaname

    geisha

    spike

    ```


    Why is this information important? Because you''ll need to specify machine names
    with the uucp command.


    # Using UUCP


    The uucp command is used to copy files from one machine to another. At first glance,
    in this age of Internet and the Information Superhighway, you may think that this
    is incredibly retro technology. And, conceptually, it is.


    Realistic, however, the uucp command has its widest application in the corporate
    world, where interconnected computers are very common. In these situations, the
    corporate systems may not be tied to the outside world but only connected to other
    corporate systems. In these cases, the uucp command is a handy way of transferring
    a file from your system to the corporate headquarters in Sioux City, Iowa.


    The best way to understand the uucp command isn''t to think of it as a strange
    and unfamiliar networking command—just think of it as an extended version of the
    common cp command, which you used earlier in this book. Instead of downloading
    and uploading files from a local directory, you''re using uucp to download and
    upload files from another machine.


    There''s an added advantage to the uucp command: All in all, it''s a rather secure
    method of transferring files, when everything is set up'
  merge: -1
  pgno: 455
- img_proc: true
  md: '# CHAPTER 9: Linux and the Internet 425


    correctly. (There''s the issue of security popping up again.) The uuc command
    and the UUCP utilities can enact very specific guidelines on where files can be
    uploaded or downloaded from.


    Let''s look at a typical uuc command line:


    ```

    $ uucp chap9.txt spike!/usr/spool/uucppublic/chap9.txt

    ```


    While this may seem to be a command line, a closer look will show that it''s actually
    rather simple.


    The uucp portion of the command line, obviously, refers to the uuc command. This
    is followed by the name of the file to be copied (chap9.txt).


    The next portion is potentially the most confusing portion for novice users, as
    it represents the destination of the file by name of the machine and the directory.
    In this case, spike refers to the name of the machine; the uuc command knows this
    because the name of the machine ends with an exclamation mark (!).


    If the examination mark looks familiar, it should; remember, the Usenet method
    of electronic-mail addressing with bang paths makes heavy use of exclamation marks.


    The examination mark is immediately followed by the destination directory. The
    usr/spool/uucppublic directory is a common destination for UUCP sites.


    Please be aware that none of the machine names in this chapter are real. Don''t
    use these specific examples on your own system.


    Generically, the uuc command would look like this:


    ```

    gilbert:/ uucp sourcefile destinationfile

    ```


    The uuc command can also be used to grab files from another machine, as long as
    you have the proper permissions (again, a configuration issue that we''ll duck).
    In this case, you''ll alter the uuc command line used earlier in this chapter.
    The principle is the same: use the uuc command to list the source file and its
    destination. In this case, the remote file is the source file and a local directory
    is the destination:


    ```

    gilbert:/$ uucp spike!/usr/spool/uucppublic/chap9.txt\n/usr/spool/uucppublic

    ```'
  merge: -1
  pgno: 456
- img_proc: true
  md: '# CHAPTER 9: Linux and the Internet


    When using the uucp command to download a file, all you need to do specify the
    destination directory; the command assumes that the filename will remain the same
    and that the destination directory exists on your local machine.


    # Potential Problems with the Uucp Command


    As many frustrated users can attest to, the uucp command and the greater UUCP
    command set are not foolproof. Perhaps the greatest frustration is that the uucp
    command isn''t interactive, and there''s no way to monitor the status of a file
    transfer. You can tell uucp to send you a receipt via electronic mail when the
    transfer is completed:


    ```

    gilbert:$ uucp -m chap9.txt spike!/usr/spool/uucpublic/chap9.txt

    ```


    However, if you do not receive the electronic mail confirmation, you can assume
    that the transfer has failed. Finding out why, however, isn''t an easy task.


    It is made somewhat easier, however, by the presence of a logfile that uucp maintains
    as part of the transfer process. To get at this file, use the uulog command:


    ```

    uulog

    ```


    This will provide a lot of output—probably too much for your troubleshooting purposes.
    It''s probably better if you combine the uulog with the name of the machine:


    ```

    uulog -sspike

    ```


    Yes,-spike is correct. In an oddity, the -s option to uulog must be immediately
    followed by the name of the machine (in this case, spike).


    You''ll need to read through the arcane information from uulog and try to make
    some sense of it. Successful file transfers will end with REMOTE REQUESTED or
    OK.'
  merge: -1
  pgno: 457
- img_proc: true
  md: '# CHAPTER 9: Linux and the Internet 427


    # What Can Go Wrong?


    When a uucp connection fails, there are can be many potential culprits. The uulog
    command can be handy to discover that a connection was denied by the remote system
    (something like ACCESS DENIED) will appear in the logfile. In this case, the login
    name or the password required by the remote machine may have been changed; this
    is a task for the system administrator to tackle.


    If this isn''t the case and ACCESS DENIED still appears in the logfile, it could
    be a simple case of a mistyped command line. If you type the wrong filename or
    directory, the connection will succeed, but the transfer will fail. Again, by
    a careful read of the logfile, you can determine this.


    Your transfer may also be the victim of your own impatience. Not all uucp requests
    are instantaneous; many system administrators choose to queue requests and make
    the transfers after hour, when longdistance rates are cheaper.


    # Free Software and ftp


    Linux also features ftp, a command that allows you to link directly to another
    computer using the network TCP/IP. Essentially, if you have a TCP/IP connection
    to the Internet, you can use ftp to connect to any public site on the Net. In
    this section, we''ll guide you through an FTP session.


    # Using FTP


    The ftp command can be used to connect to any other computer on your network running
    ftp. If your system is connected to the Internet, you can use ftp to access files
    from other Internet computers worldwide. The machines with which you network may
    or may not be running the UNIX or Linux operating systems; this operating-system
    independence is what makes FTP so widely used.'
  merge: -1
  pgno: 458
- img_proc: true
  md: '# CHAPTER 9: Linux and the Internet


    FTP is interactive software, which means it asks for information at specific times.
    Start it with the following:


    ```

    gilbert:$$ ftp

    ftp>

    ```


    You''ll be presented with the ftp prompt, where you enter special ftp commands.
    To get a list of available commands, type a question mark (?) or help at the prompt:


    ```

    ftp> ?

    or

    ftp> help

    ```


    A list of the most common FTP commands is contained in Table 9.3.


    | Command | Result |

    | --- | --- |

    | ascii | Use ASCII as the file-transfer type. |

    | bell | Ring the bell when file transfer is complete. |

    | binary | Use binary ftp as the file-transfer type. |

    | bye or quit | Terminate ftp session. |

    | cd | Change directory on the remote machine. |

    | close | End ftp connection to remote computer but keep local ftp program running.
    |

    | delete filename | Delete filename on remote computer. |

    | get filename | Get filename from the remote machine. |

    | get filename filename2 | Get filename1 from machine and save it locally as filename2.
    |

    | help | List available commands. |

    | mput filename | Copy the local filename to the remote machine. |

    | pwd | List the current directory on the remote machine. |'
  merge: -1
  pgno: 459
- img_proc: true
  md: '# CHAPTER 9: Linux and the Internet


    It''s simple to download files from a remote machine with ftp. Let''s say we want
    to grab some files from the machine named mn.kevin.com. (No, this isn''t a real
    machine.) Assuming that this is a machine on the Internet that supports anonymous
    FTP—and our fictional machine does, of course—you would merely specify its name
    on the command line:


    ```

    gilbert:$ ftp mn.kevin.com

    ```


    If the connection goes through, you will receive a verification message, along
    with a login prompt. Because this is anonymous FTP, use anonymous as a login name:


    Name: anonymous


    You''ll be asked for a password. Some systems require you to supply your electronic-mail
    address, while others require guest. Use Either. You will be presented with an
    ftp prompt.


    The remote system has been set up to give you limited access, which means that
    your maneuverability is very limited and the files you want are usually close
    at hand. If you need to change to another directory, do so with the UNIX cd command.


    Before embarking on the great file quest, you should know something about the
    files you are downloading. If they are straight C files in compressed, ASCII form,
    you can download them using the default file-transfer settings. Most larger files,
    especially binary files, are stored in compressed format so they take less time
    to transfer.


    ```

    ftp> binary

    ```


    Once you are placed in the correct directory the file to be downloaded, start
    the download process with the get command:


    ```

    ftp> get filename

    ```'
  merge: -1
  pgno: 460
- img_proc: true
  md: '# CHAPTER 9: Linux and the Internet


    As you download the file, there will be a prompt on the system, and you won''t
    be able to enter any keystrokes.


    After the file has been transferred successfully, you''ll be given a message similar
    to the following:


    ```

    Transfer complete

    ```


    You may also be told the size of the file and the transfer time. Because you''re
    through with your file needs, close the connection with the bye command:


    ```

    ftp> bye

    ```


    # What do I do with the File?


    If you download an ASCII file, you can view it using any editor, including vi
    or emacs. If it''s a sourcecode file, you can compile it for use on your own system;
    or if you''ve downloaded a compressed binary file, you will have to uncompress
    it (and perhaps unarchive it) at the command line using uncompress, unpack, tar,
    or gzip—things you learned about in Chapter 4.


    # Other Networking Commands


    In addition to ftp, which is used to transfer—copy—files from system to system,
    there are a number of other common networking commands. These commands work to
    help the connection among your computer and others on the same link. Generally,
    if you work at a site with multiple UNIX computers, these computers will be networked
    together, usually using the Ethernet network protocol. Your systems may also be
    networked with the worldwide Internet, which as you already know is a collection
    of connected networks. (Say that three times.)


    # Using the Rlogin Command


    The login command allows you to remotely login to another computer on your network
    (remember that if you''re on the Internet, you''re on a'
  merge: -1
  pgno: 461
- img_proc: true
  md: '# CHAPTER 9: Linux and the Internet


    worldwide network). You must, of course, have a valid user account on any machine
    to which you want to login. To use login, you need the name of the machine to
    login to. To login a machine named nicollet, you''d use a command line like the
    following:


    ```

    gilbert:/$ login nicollet

    Password:

    ```


    At the Password prompt, you may need to enter your password on machine nicollet,
    which may or may not be different from the password you use on your local machine.
    Once logged in, you''re computing on the remote machine and can run any standard
    UNIX command. You also logout the same way you normally logout:


    ```

    gilbert:/$ logout

    Connection closed.

    $

    ```


    After that you logout from a remote machine, you''re back to the command prompt
    at your local machine. This tends to get confusing, so be careful.


    The basic form of login is:


    ```

    login hostname

    ```


    where hostname is the name of the machine to login.


    # Using the Telnet Command


    The telnet command works much the same as login does, allowing you to connect
    directly to a remote machine. Because the telnet command is considered part of
    the toolkit used by the Internet server, it''s actually gained in popularity over
    the years.


    Telnet allows you either to run a command directly on a remote machine while displaying
    the results on your own or to run a specific command on a remote machine (many
    sites that allow Telnet put restrictions on what users can run, due to security
    concerns). With telnet, you only need to know the address of the machine you''re
    connecting to, such as sunsite.unc.edu, as illustrated by the following:'
  merge: -1
  pgno: 462
- img_proc: true
  md: '# 432  CHAPTER 9: Linux and the Internet


    ```

    gilbert:$ telnet

    telt> open sunsite.unc.edu

    Trying 198.86.40.81.

    Connected

    *********** Welcome to SunSite.unc.edu *********

    ```


    SunSite offers several public services via login. These include:


    NO MORE PUBLIC gopher login!

    Use lynx the mini WWW client to access gopher and Web areas

    For a simple WAIS client (over 500 databases), login as swais

    For WAIS search of political databases, login as politics

    For WAIS search of LINUX databases, login as linux


    For a FTP session, ftp to sunsite.unc.edu. Then login as anonymous


    For more information about SunSite, send mail to info@sunsite.unc.edu


    UNIX (R) System V Release 4.0 (calypso-2.0it.unc.edu)


    login: swais


    In this case, sunsite.unc.edu offers a variety of services to the general computing
