  md: '# 480 CHAPTER 10: Programming in Linux


    For example, let''s say we wanted to know how many workers had a value in the
    fifth field that is greater than or equal to 10:


    ```

    gilbert/:$ gawk ''$5 >= 10 ( print $0 ) '' workers

    Geisha 280 555-4221 geisha 10

    Tom 284 555-2121 spike 12

    ```


    We can also combine tests, to print out, for example, all workers who the fifth
    field less than 10 and the second field greater than 280:


    ```

    gilbert/:$ gawk ''$5 < 10 && $2 > 280 ( print $0 ) '' workers

    Eric 286 555-6674 erc 8

    ```


    While these examples are obviously contrived, you can use gawk to help pull out
    all entries that share certain postal (ZIP) codes or all employees who have a
    salary in a certain range. We''re scratching the surface with **gawk.**


    **gawk** can also be used to return entire sections of data, as long as you specify
    patterns that begin and end the section. To return the records of Eric and Kevin
    and all between, use the following:


    ```

    gilbert/:$ gawk ''$1 ~ /Eric/,/Kevin/ (print $0)'' workers

    Eric 286 555-6674 erc 8

    Geisha 280 555-4221 geisha 10

    Kevin 279 555-1112 kevin 2

    ```


    If we don''t want to print the whole record, we can print a few of the fields,
    as in this example, which prints out fields 2 and 1:


    ```

    gilbert/:$ gawk ''$1 ~ /Eric/,/Kevin/ {print $2, $1}'' workers

    280 Eric

    280 Geisha

    279 Kevin

    ```


    As with other UNIX commands, **gawk** can be used in pipes, and output can be
    directed to other files or directly to the printer. For example,'
