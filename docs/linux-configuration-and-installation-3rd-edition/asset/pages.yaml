    # Testing Your Fwm Configuration


    Now that we''ve made a change to our .fwmrc file, it''s time to test our new configuration.
    To do this, you need to restart fwm. You can either quit X and restart everything
    or call up Fwm''s root window menu, where you''ll find a Restart fwm choice.(It
    may be on a submenu.) You can access fwm''s root menu by holding down the left
    mouse button over the screen background.'
