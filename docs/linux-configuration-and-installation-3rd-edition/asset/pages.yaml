  md: '# CHAPTER 6: Basic Linux System Administration


    # # System-Administration Tools


    If you''re working on a stand alone Linux system, you''re wearing two hats: the
    hat of a user and the hat of a system administrator. Of course, when you installed
    Linux in Chapter 2 and set up a user account, you were fulfilling the role of
    a system administrator. Congratulations!


    In fact, setting up and maintaining accounts is one of the more important tasks
    you have as a system administrator. If you plan on letting other people (i.e.,
    the family or a co-worker) use your Linux system, you should set up user accounts
    for them, complete with passwords, groups, and home directories. This isn''t necessarily
    a difficult task, but it''s one you should know a little about as you continue
    your Linux education.


    There''s nothing unique about Linux system administration. All the actions detailed
    in this chapter are also true of the UNIX world, and if you have any experience
    with all UNIX system administration, you can easily make your way through Linux.


    ![](img/05da311512608405596dd882623b9142_377_0.png)


    System administration is a world unto itself. The brief introduction here scratches
    the surface of UNIX system administration. We''ve found that the best way to learn
    UNIX system administration is to just dive right in and do it. Normally, you can''t
    do much damage to a Linux system unless you start recompiling kernels or messing
    with boot records and such. The actions described in this chapter won''t lead
    to any irreversible problems.


    # # Using the Passwd File


    Linux stores information about users in the /etc/passwd file (not to be confused
    with the **passwd** command, of course). As a matter of fact, Linux stores a lot
    of system-configuration information in this file, as is evidenced by the following
    excerpt:


    ```

    halt:x:7:0:halt:/sbin:/sbin/halt

    operator:x:11:0:operator:/root:/bin/bash

    root:x:0:0::root:/bin/bash

    shutdown:x:6:0:shutdown:/sbin:/sbin/shutdown

    ```'
  merge: -1
  pgno: 377
- img_proc: true
  md: '# CHAPTER 6: Basic Linux System Administration 347


    ```

    sync:x:5:0:sync:/bin:/bin/sync

    bin:x:1:1:bin:/bin

    ftp:x:404:1::/home/ftp:/bin/bash

    daemon:x:2:2:daemon:sbin

    adm:x:3:4:adm:/var/adm

    lp:x:4:7:lp:/var/spool/lpd

    mail:x:8:12:mail:/var/spool/mail:

    postmaster:x:14:12:postmaster:/var/spool/mail:/bin/bash

    news:x:9:13:news:/usr/lib/news

    uucp:x:10:14:uucp:/var/spool/uucpublic

    man:x:13:15:man:/usr/man

    games:x:12:100:games:/usr/games

    nobody:x:65534:100:nobody:/dev/null

    kevrin:x:1000:100:Kevin Reichard,,,/home/kevrin:/bin/bash

    ```


    Most of these commands specify the paths associated with specific commands, such
    as the path for man pages. If you want to change these defaults (for example,
    if you are using uucp to connect to other systems and other systems are connecting
    to yours, this would be the place to change the uucp default path), here''s the
    place to do it.


    Our real concern, however, is with the final line of the file, concerning the
    configuration for user kevrin:


    kevrin:x:1000:100:Kevin Reichard,,,/home/kevrin:/bin/bash


    We''ll break this line down as an example of how Linux deals with entries:


    +   - kevrin refers to the user name.

    - X is the placeholder for the encrypted password. The actual encrypted text is
    kept in a separate file /etc/shadow/. To help keep the system secure, /etc/shadow
    can only be read by the root user. If this field contains an asterisk (*) instead
    of an x, this means the account is disabled (something you''ll learn about later
    in this chapter).

    - 1000 is the user ID, a numeral the system uses to track the account. Instead
    of dealing with kevrin when working with file'
  merge: -1
  pgno: 378
- img_proc: true
  md: '# 348 CHAPTER 6: Basic Linux System Administration


    permissions and such, the system deals with 1000 or the equivalent user ID.


    +   * 100 is the group ID (you’ll learn about groups later in this chapter).

    * Kevin Reichard is the full name of the user; this entry can contain additional
    information about the user.

    * /home/kevin refers to the user’s home directory.

    * /bin/bash refers to the user’s default shell.


    Not every field needs to be used, but there needs to be spaces left for them ().


    As you can see from the previous example, the root user has a slightly different
    line from a normal user; in this case, zeros are used in the user ID and group
    ID fields.


    This file is where you''d check for the current user configuration, not to add
    new users. You can make changes to this file that will be reflected in the system
    as a whole; for example, you can give the user a new ID by merely changing the
    appropriate number in the user ID field. However, there are ramifications of doing
    this; because the system tracks ownership and group membership by user ID and
    not by name, this change will mean that all the files that the user used to own
    would be in ownership limbo; you’need to manually change the ownership of the
    files with the chown command. Unless you absolutely must change the user ID for
    a user, you’re best off avoiding this maneuver.


    The adduser command, which you first encountered in Chapter 2, can be used to
    add users. This command can be run by the root or superuser at any time:


    ```

    gilbert:\# adduser

    ```


    # Deleting Accounts


    The flip side of adding accounts is, of course, deleting accounts. If you’re working
    on a smaller system, you don’t need to worry too much about deleting accounts,
    unless you have a situation where a disgruntled employee may have the opportunity
    to wreak havoc on your system.'
  merge: -1
  pgno: 379
- img_proc: true
  md: '# CHAPTER 6: Basic Linux System Administration 349


    Deleting an account is a multifaceted affair, however, as you must delete every
    reference to the user in the Linux system. This means removing the user''s entry
    from /etc/passwd, removing the user''s home directory (the rm -r command line
    will do so, although you should make sure there''s nothing valuable in the directory),
    transferring ownership of the removed user''s files (which you''ll learn about
    in the next section), ending any cron or at jobs begun by the user (both are explained
    later in this chapter), and making sure that the mail subsystem doesn''t continue
    to acknowledge the user''s existence. You''ll also want to delete the user''s
    mail file, which is kept in /usr/spool/mail, with the filename being the user''s
    name. Most of this work can be done automatically with the userdel command. For
    example, to remove the kevinr account:


    ```

    userdel -r kevinr

    ```


    You may also want to disable an account rather than delete it outright. In this
    case, you''d merely throw an asterisk (*) in the second field of the /etc/passwd
    file. The following would temporarily disable kevinr''s account:


    ```

    kevinr*:1000:100:Kevin Reich:/home/kevinr:/bin/bash

    ```


    # Managing Groups


    In the UNIX world, groups have a long history as a mechanism for dividing access
    to certain files. Anyone who''s worked with a network of any sort realizes that
    giving only some members access to a set of files enhances security and makes
    organizational chores easier.


    Linux supports groups; each file is owned by both a user and a group. By using
    the ls -l (that''s ell, one) command line, you can get the full permissions line
    for a file:


    ```

    gilbert:~$ ls -l

    -rwxr-xr--  1 kevinr users  87619 Apr 23 23:39 addresses.dat

    ```'
  merge: -1
  pgno: 380
- img_proc: true
  md: '# CHAPTER 6: Basic Linux System Administration


    This tells us that the file addresses.dat is owned by both the individual user
    kevinr and the group users; kevinr can read, write, execute the file; and that
    the users group can read and write the file. All other users can only read the
    file.


    Here are the contents of a typical /etc/group file:


    ```

    root::0:

    bin::1:root,bin, daemon

    daemon::2:root,bin, daemon

    sys::3:root,bin, adm

    adm::4:root, adm, daemon

    tty::5:

    disk::6:root,adm

    lp::7:lp

    mem::8:

    kmem::9:

    wheel::10:root

    floppy::11:root

    mail::12:mail

    news::13:news

    uuccp::14:uucp

    man::15:man

    users::100:kevinr,pat,erc

    execs::101:kevinr,pat

    nogroup:-1:

    ```


    As you can see, most of the listings in a /etc/group file have very little to
    do with a user group and more to do with applications and other ownership issues.
    You can tell which lines have to do with user groups, as they are numbered above
    100 (this is a Linux convention). In the preceding example, these two lines are
    reserved for user groups:


    ```

    users::100:kevinr,pat,erc

    execs::101:kevinr,pat

    ```'
  merge: -1
