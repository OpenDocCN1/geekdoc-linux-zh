    # Summary


    We realize that many of you are potential and practicing programmers,

    so we spent a great deal of space on the many programming tools

    available with Linux. Even so, we''ve barely touched the surface of the

    Linux programming environment, for both traditional character-based

    programs and those running under the X Window System.


    The chapter began with a discussion of the GNU C compiler, gcc, which

    sships with Linux. With gcc, you can create and compile C, C++, and

    Objective-C programs, as explained in this chapter. You learned about

    compiling the long way and the short way, using the make command.


    The chapter then discussed programming under the X Window

    System and the programming libraries you''ll need. A freeware library

    called LessTif acts as a substitute for the commercial Motif

    programming libraries. While LessTif is clearly a work in progress, it''s'
  merge: -1
