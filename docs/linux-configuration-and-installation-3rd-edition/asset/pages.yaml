    # XForms


    XForms is a C library designed to dramatically simplify the creation of X

    programs. The basic task in XForms is creating forms, XForms

    terminology for panels, windows, or dialogs. A form is really a top-level

    window containing a number of widgets. By simplifying the options and

    coming up with a good set of default values, XForms reduces much of

    the complexity in creating X applications. You do pay a price in reduced

    flexibility, but for many application needs, XForms will be the right fit.


    One of the areas of reduced freedom and complexity is widget layout.

    All widgets are placed in each position, be it in pixels, millimeters, or

    points (1/72 of an inch). Other widget sets, like Motif, provide

    extensive set of widgets that control the layout of other widgets. Of

    course, widget layout is one of Motif''s most troublesome aspects for

    developers new to the library. XForms, on the other hand, eliminates

    most of these options and confusion by placing widgets directly.


    XForms allows you to populate your forms with widgets such as

    button, sliders, and text-entry fields. Some of the more innovative

    widgets include dials, clocks, and X-Y data plots. The X-Y data plots

    will appeal to those in the academic community who want to display

    digraphically.


    Should the XForms base widget set be too confusing for your needs,

    you can create "free" objects, something like the Motif drawing area

    widget, where your application gets a blank canvas to draw in and

    callbacks to handle all events. This allows a to extend the base

    widget set. XForms includes an extensive API for adding new widgets.


    The look and feel of XForms applications varies. You can create a

    variety of push-button styles, including beveled push-buttons and

    rounded-corner buttons, so your interface can look like Motif, Open

    Look, or just about anything else.


    A lot of the look seems to come from older Silicon Graphics

    applications. Many of the widgets support near border styles, but the

    menus look strange. It took us a long time to get used to the menus in'
