    # Variables


    In Linux parlance, variables allow a user to define information with

    both a name and a value that may change over the course of time. This

    is to allow a vast number of users to do the same thing in different

    locations (for example, the $SHELL variable allows anyone to set their

    own prompt, while all the system knows is that there is a

    $SHELL variable) while giving a lot of flexibility to users.'
