  md: '# CHAPTER 5: Linux Applications


    # Using Sed


    The sed (streams editor) command isn’t really a text editor, nor is it really
    a text processor. However, it can be used as a text processor—or rather, as an
    interactive text processor. Or you can think of sed as a filtering text editor;
    procedurally, you use the sed command with the following steps:


    +   - Read in text from a file.

    - Make changes in the text.

    - Display new text on screen or save to a file.


    These procedures are all specified in one command line. A typical sed command
    line should look something like this:


    ```

    gilbert:~$ sed -n -e operation -f scriptfilename filename

    ```


    where -n refers to a specific line or lines, operation refers to one of the many
    available sed operations, scriptfilename refers to a file that contains a longer
    list of sed operations, filename refers to the file that sed works on.


    The various command-line options are explained in greater detail in Table 5.6.


    | Table 5.6 Command-Line Options |

    | Command | Result |

    | --- | --- |

    | -e | Explicitly tells sed what follows is an operation; if you only use one
    operation, you can omit the -e |

    | -f | Specifies a script file; if you plan on using many operations regularly,
    it''s best to save them in a script file for future use. |

    | -n | Specifies a specific line number or a range of line numbers to use. |


    Go ahead and create a text file called test:'
