  md: '# What is Linux?


    Linux (pronounced lih-nux) is a 32-bit operating system designed for use on Intel
    80386 (or better) PCs. Technically, Linux is a UNIX workalike, which means that
    it responds to standard UNIX commands and will run UNIX programs. You might see
    some references elsewhere to Linux as a UNIX clone, but that''s not strictly correct.
    (If it were a UNIX clone, Linux would be a lot more expensive than it is, due
    to the additional overhead of licensing fees.)


    Linux began life as the project of a single man, Linus Torvalds (then a student
    at the University of Finland at Helsinki), who wanted his own alternative to another
    UNIX alternative—namely, the Minix operating system. He designed Linux to be similar
    to Minix (the original Minix filesystem was incorporated into Linux), yet more
    stable and freely available.


    For a long time Linux was an operating system under development, as many beta
    versions of Linux circulated throughout the world—mostly distributed through the
    Internet. Version 0.2 was released to the world in the middle of 1991; in 1994,
    version 1.0 was finally released. A ready and willing group of volunteers helped
    Torvalds finish Linux; additionally, these volunteers (including one of the authors
    of this book, Patrick Volerkding) created the add-on software that makes Linux
    so popular. The CD-ROMs that accompany this book are based on Linux 2.0.


    Linux, as an operating system, is actually rather trim and fit. You could install
    Linux from a three-disk set (the a series, which you''ll learn about in Chapter
    2). So why do you need two CD-ROMs, filled to the brim with bits and bytes? Because
    the core Linux operating system, as such, doesn''t do more than offer a command
    line and respond to the core UNIX commands. You''ll need the additional software—ranging
    from utilities like diff from the Free Software to compilers and editors. Because
    this additional software is different from distribution to distribution (on the
    accompanying CD-ROMs, you''re using the highly regarded Slack distribution), there
    are differences between Linuxes (Linuci? Licenses?) available on the market. (For
    example, the installation program—so critical for many users—is'
  merge: -1
  pgno: 23
- img_proc: true
  md: '# Introduction:Welcome to Linux xxiii


    unique to Slackware.) And Linux features its own graphical interface, based on
    the X Window System.


    This leads us to one essential truth about Linux (something also true about UNIX):
    Linux is a series of tools. You use one tool to do one thing, another tool to
    perform another function. As a set of tools, the Slackware distribution is more
    than just Linux.


    # What Makes Slackware Linux Special?


    Why use Linux? The following features make Linux special in the operating system
    world:


    +   **Linux is an alternative to the commercial operating system world.** There''s
    something to be said for striking a blow against the Empire. Linux is the result
    of many hours of volunteer workers who believed that a grass-roots approach to
    software development was a more harmonic approach than commercial offerings. Whether
    you buy this into the ethos is up to you, but you cannot help be impressed that
    such an outstanding computer operating system, rich in complexity and features,
    is the work of so many.


    +   **Linux is built for the Internet and networking.** The Internet is all the
    rage, and the Linux world is part of the hubbub. Linux probably wouldn''t be where
    it is today without the Internet, as hundreds of volunteers have collaborated
    via the Internet, shipping source code and program files from machine to machine.
    In addition, Linux can be used right out of the box for Internet and networking;
    there''s no need to buy additional software. All you need to do is configure what
    you have.


    +   **Linux is completely open.** You get the source code for the Linux operating
    system on an accompanying CD-ROM. If you want to make changes to the operating
    system, you can do so. If you want a driver for your oddball peripheral, you can
    write it yourself or con someone else into writing it for you.'
  merge: -1
  pgno: 24
- img_proc: true
  md: '# Why Should You Use Linux?


    Because it runs UNIX programs—most notably through compiling original source code
    written for the many UNIX variants around the world—Linux is the ideal platform
    for many potential users:


    +   * Users who want to learn more about the UNIX operating system and the X Window
    System.

    * Internet surfers who want a powerful platform for cruising the Net.

    * System administrators who want an alternative to expensive UNIX workstations,
    either in their workplace or at home.

    * Programmers who want a cheap home or small-business platform for developing
    software that can be used on other, more powerful UNIX systems.


    There are many features to Linux that you should find attractive:


    +   * **You’ve already paid for it.** By purchasing this book, you’ve purchased
    a full implementation of Linux, complete with scads of useful programs.

    * **Linux follows standards.** For the most part, Linux and its tools follow various
    standards, such as POSIX compliance. As a programming platform, Linux can be used
    to develop and test code for a wide variety of platforms.

    * **Linux can be used for most of your everyday needs.** True, Linux lacks the
    wide range of applications found in the PC world. However, for most of your daily
    tasks (particularly if you want to use Linux for programming or the Internet),
    the accompanying CD-ROMs contain enough tools to satisfy most of your needs.

    * **Linux runs binaries created on other PC versions of UNIX.** The new iBCS capability
    allows you to run a program that was compiled for another Intel-based PC, including
    SCO UNIX and FreeBSD.


    Will Linux replace more popular operating systems, like MS/DOS and Windows? That
    depends on your needs. For basic computing tasks—word processing, spreadsheets,
    telecommunications—Linux and the Slackware distribution are a perfectly adequate
    alternative to other'
  merge: -1
