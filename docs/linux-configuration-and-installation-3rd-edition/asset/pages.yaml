    # Using LessTif


    Everyone wants to use the Motif libraries until they find out they’re an added-cost
    feature for Linux. Unfortunately, the Motif library is commercial software, which
    means you have to pay extra to get the Motif library source code or a set of binaries
    for your platforms. Add to this hassle the frustrating nature of the complex Motif
    license for software developers, where it''s almost impossible to tell if you
    can actually distribute your applications, and you''re ready to scream.


    However, we''ve run across a great programming effort called LessTif, which is
    gaining more Motif functionality each day. While it''s not in completed form,
    we thought you might want to take a look at it, so we included it in the second
    CD-ROM''s programming/lesstiff.


    LessTif is a workalike clone of Motif libraries. That is, a set of programming
    libraries that look and act like the Motif libraries (Xt and Mrm). Under the hood,
    the code is entirely different. From a programmer’s perspective, though, LessTif
    has the same API as the Motif libraries and supports a number of Motif widgets,
    supporting more Motif widgets with each release. It uses public header files with
    the same name as their Motif counterparts.


    For your programs, LessTif should allow your Motif programs to be recompiled under
    LessTif with no source code changes—at least in theory. We''ve had to make a few
    changes to get around the fact that LessTif is incomplete as we write this. Luckily,
    because LessTif is'
