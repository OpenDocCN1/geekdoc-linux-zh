    # # Compressing and Archiving Your Files


    When you start poking around the Internet and see that most of the files end with
    cryptic suffixes like .gz and .tar, you know you''ve wandered past your background
    in older versions of UNIX—and past the PC and Macintosh worlds, for that matter.


    These suffixes are important, however, if you plan on grabbing software from an
    FTP site and installing it on your Linux system. In addition, you may find the
    tools responsible for these suffixes to be very useful as you archive files or
    prepare them for transmission to other systems, either directly or via the Internet.'
  merge: -1
  pgno: 328
- img_proc: true
  md: '# CHAPTER 5: Linux Applications


    Essentially, a suffix of .gz means that a file has been compressed using the GNU
    gzip utility, and as you poke around the Linux software world, you''ll see that
    it''s very common. gzip is not the only UNIX/Linux utility for compressing files;
    the traditional compress command is also supported, while this release of Slack
    now features the zip and unzip commands, which maintain conformity with the famous
    PKZip compression format from PKWare. All of these commands do exactly the same
    thing: they take an ASCII or binary file (or a defined set of files) and shrink
    them into a smaller file. This file can then be sent via the Internet or electronic
    mailer. Most UNIX systems come with both compress and pack (and their counterparts,
    uncompress and unpack).


    Because gzip and zip come with your Linux system, they are probably the commands
    you''ll want to concentrate on. Gunzip (the counterpart to gzip) can be used on
    files compressed with compress and pack, which means it will work with the vast
    majority of compressed files in the UNIX world. Zip will work with files zipped
    up with software in the MS-DOS, Macintosh, and Windows worlds; this format is
    prevalent on the Internet, you''ll want to become familiar with it if you begin
    to surf the Internet on a regular basis. In a sense, you don''t need to worry
    about what the file was compressed with—in other words, .z versus .gz versus—gzip
    will work on them all. Similarly, you can use zip if you see a file ending with
    .zip. If you''re working with compressed files for distribution to the rest of
    the world, you''ll want to be careful about using gzip; after all, not all UNIX
    users use gzip, although most Internet users see it (judging by the number of
    gzip-compressed files on various FTP sites).


    We''re not going to get into recommendations about which compression utility to
    use. There are versions of gzip for other operating systems, such as MS-DOS, although
    they tend not to be widely distributed. Similarly, PKZip is available at becomes
    the format of choice in every major operating system, in the MS-DOS and Windows
    worlds. StuffIt, isn''t available for other operating systems.) As more Internet
    information is archived in .zip files, it become perhaps the major compression
    format overall in the computer'
  merge: -1
  pgno: 329
- img_proc: true
  md: '# CHAPTER 5: Linux Applications 299


    world. Because you have both commands available, it''s up to you to choose the
    right format for your circumstances.


    Extended documentation on gzip can be found in the GNU texinfo documentation discussed
