  md: '# CHAPTER 5: Linux Applications


    # Buffers


    In UNIX parlance, a buffer is a portion of memory set aside for a specific task.
    In emacs, a buffer can contain an existing file or a new file in progress. When
    a file is in a buffer, it exists separately from something stored on the hard
    disk; you can make changes to the buffer, but they won''t be reflected in the
    version stored on disk. Only when you explicitly save the file to the disk will
    the changes be made permanently. This sometimes trips up new computer users, assume
    that whatever appears on the screen is exactly mirrored at all times on the disk.


    Emacs allows you to view multiple buffers and to cut and paste between the buffers.
    To see which buffers are currently open, select Buffers from the menu bar (or
    type Ctrl-x Ctrl-b). You''ll see something like Figure 5.6.


    ![](img/05da311512608405596dd882623b9142_297_0.png)


    Figure 5.6 Buffers in emacs.


