    The Bourne Again Shell, bash is set up by default on Linux systems. Bash is designed
    to show the name of the machine on a prompt (in this instance, gilbert), as well
    as the current directory. A colon is used to separate the machine name and the
    current directory. As you see in the previous example, the first line shows that
    the current directory is /, or the root directory. In the second line—after running
    the cd command—the current directory is /usr.


    We''re getting ahead of ourselves here a bit, diving into UNIX commands without
    ever really describing them. For now, it suffices to say that a command is a direct
    instruction to the Linux system.


    ![](img/05da311512608405596dd882623b9142_235_1.png)


    The cd command can be used in many different ways. You can use it to make the
    root directory your current directory:


    ```

    gilbert:/usr$ cd /

    gilbert:/ $

    ```


    You can also use it to move up a single directory in the hierarchy. In the next
    example, your current directory is /usr/doc and you want to make the /usr directory
    your current directory. To do this, you''ll need to know that Linux always represents
    the current directory with a period (.) and the parent directory with two periods
    (...). The following command line, then, would move your current directory to
    the parent directory:


    ```

    gilbert:/usr/doc cd ..

    gilbert:/usr$

    ```


    The explanation probably made this example seem more complex than it is.


    You can also use cd to make a subdirectory of your current directory. The trick
    here is knowing that you''ll want to move to a directory relative to your current
    directory. Knowing that doc is a subdirect of the current directory /usr, you
    would move to the doc directory with the following command line:


    ```

    gilbert:/usr$ cd doc

    gilbert:/usr/doc$

    ```'
