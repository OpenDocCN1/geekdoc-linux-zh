    # Booting Linux from DOS Using Loadlin


    Loadlin is a handy utility for Linux users who also run MS-DOS or Windows 95.
    Using *Loadlin*, you can start Linux from a DOS prompt or set up an icon in Windows
    95 that allows you to switch to Linux. *Loadlin* is also probably the safest way
    to launch Linux from your hard drive, because it doesn''t require with the partition
    table at all—you just boot DOS normally and then use the LOADLIN.EXE command to
    start Linux when you need it.


    To use *Loadlin*, you''ll need to install it on your DOS drive. To do this, you
    need to use an unzip program, such as UNZIP.EXE or PKZIP. EXE; most DOS users
    will already have copies of it. Assuming your Slack CD is on drive E and you want
    to put *Loadlin* on drive C, unzip the file like:


    ```

    C:\> PKZIP -d E:\KERNELS\LOADLIN6.ZIP

    ```


    The -d flag tells the command to preserve the directory structure found in the
    zip archive. This will create a C:\LOADLIN directory on your machine containing
    a number of files.'
