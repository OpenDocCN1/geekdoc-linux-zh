    # Upgrading from a Previous Version of Linux


    If you''re using an older version of Slack and you want to upgrade to the version
    on the accompanying CD-ROMs, you can do so going through the agony of a full installation.


    The new versions of pkgtool (a package maintenance tool developed for the Slack
    distribution) should provide a clean upgrade path from earlier versions of Slack.
    Because pkgtool can now remove packages from your hard drive while running on
    a self-contained Linux filesystem loaded into a ramdisk, it can remove any files
    from your system, including ones, such as the shell, shared libraries, init, and
    other critical system files, that were difficult or impossible to remove running
    on the hard drive.


    > Upgrading through this method is probably more trouble than it''s worth. For
    example, several commonly reported bugs are caused by improper upgrading—mixing
    disks from different versions of the distribution and/or failing to remove old
    packages. We need to face the fact that things haven''t quite settled down yet,
    and they''s not always possible to foresee differences in filesystem structure,
    daemons, utilities, and so on that can lead to problems with the system.


    ![](img/05da311512608405596dd882623b9142_124_0.png)


    The correct and best way to upgrade to a new distribution version is to back up
    everything you saved and then reinstall from scratch. This is especially true
    for the A and N series disks. If you upgrade packages from one of those disksets,
    you should seriously consider which packages from the other one might be related
    somewhere and install those too. Again, it can be tricky to know just which packages
    are related, given the overall complexity of the Linux system. That''s why, unless
    you really know what you''re doing, there is a substantial risk of screwing up
    a system while attempting to upgrade it.'
