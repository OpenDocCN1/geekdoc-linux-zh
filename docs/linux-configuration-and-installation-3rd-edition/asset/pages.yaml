    > > The *root user* is the supreme being on a UNIX system. Most of the traditional
    security tools within the UNIX operating system don''t apply to the root—when
    logged in as **root**, you can just do anything. It''s generally not a good idea
    to use the UNIX system as the root user, however; the proscribed practice is to
    set up your own account and then save the root login only for those times when
    you''re performing system administration.


    After you''re logged in, you''ll see the following command prompt:


    ```

