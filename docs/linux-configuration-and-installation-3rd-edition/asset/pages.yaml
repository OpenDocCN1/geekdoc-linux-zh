  md: '# CHAPTER 2: Installing Linux


    sound board listed in Chapter 1, so be patient and wait for your sound board to
    be listed.


    > Be careful about sound cards that are advertised as being "compatible" with
    popular sound cards, such as the SoundBlaster from Creative Labs. Compatibility
    can mean two different things: one level of compatibility means that the hardware
    is exactly the same as a popular model, while the other means that a computer
    can be tricked, usually with special drivers, to think that it''s using a clone
