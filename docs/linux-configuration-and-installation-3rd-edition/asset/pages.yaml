    points of the Linux operating system.


    Multitasking merely means that the system can do more than one thing at a time
    and it can set priorities among these different tasks. While this may be something
    that should be easily achieved given the power of the personal computer, it''s
    not, as Macintosh and PC users are still waiting for an operating system''s truly
    multitasking (as opposed to being able to run more than one task at a given time).
