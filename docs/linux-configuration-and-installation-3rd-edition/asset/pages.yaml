    # The Fvwm Window Manager


    The window manager is one of the most important applications you''ll run, as it
    sits around every application window on the screen and can influence how the windows
    work. De facto window manager for Linux is fvwm.


    This window manager provides a great deal of control over the way you interact
    with X, especially because fvwm supports a host of configuration options. While
    you can run any window manager you want, fvwm seems to be the most popular in
    the Linux world. It''s not documented in many places or X books, so we''ll show
    you how to set up fvwm for your Linux system.


    You can run only one window manager at a time.'
  merge: -1
  pgno: 197
- img_proc: true
  md: '# CHAPTER 3: Installing and Configuring XFree86 167


    # Configuring Fvwm


    Most window managers under X support a configuration file. Usually, this file
    is located in a dot file in your home directory. Most window managers also follow
    a naming convention for their configuration file. For the mwm window manager,
    the file is named .mwmrc. For twm, it''s .twmrc. For fvwm, it''s .fvwmrc.


    At startup, fvwm will look for your customizations in a file named .fvwmrc in
    your home directory. If you have no .fvwmrc file (which is likely when you start
    out), fvwm will look for a system file named /usr/lib/X11/system.fvwmrc. If that
    file, too, is missing, fvwm will exit.


    Because fvwm is a very complex window manager, you should copy the system.fvwmrc
    or one of the example files to your home directory and name it .fvwmrc. By starting
    from a working example, you''ll find it a lot easier than creating a .fvwmrc from
    scratch.


    Once you find the fvwm system directory, you''ll see a number of sample configurations
    in the sample_configs directory. It''s easiest to configure fvwm from a working
    model, so you can either copy system.fvwmrc or one of the files in the sample_configs
    directory.


    Once you have copied a working configuration file into your home directory, the
    next step is to start customizing. The .fvwmrc file is very long, so we will provide
    an overview of the areas you''re most likely to customize and then provide an
    example .fvwmrc file—a very long example—that you can use. By browsing this example
    should give you plenty of fvwm ideas. In addition to our example, you may want
    to look at at the fvwm example files mentioned earlier and look at fvwm''s online-manual
    page.


    In the .fvwmrc file, the order of items is very important. It''s best to start
    with a working example and then search for the items we mention. Change the item''s
    value, but leave the item itself in the same relative position in the .fvwmrc
    file.'
  merge: -1
  pgno: 198
- img_proc: true
  md: "# CHAPTER 3: Installing and Configuring XFree86\n\n# Configuring Fonts and\
    \ Colors\n\nThe foremost area you'll likely customize in the .fvwmrc file is fonts\
    \ and colors.\n\nEach window manager, including fwwm, allows only one application\
    \ at a time to get keyboard input. This window, usually called the active window\
    \ or the keyboard focus window, is usually highlighted by the window manager.\
    \ In the .fvwmrc file, the HiFreeColor sets the text foreground color for the\
    \ active window's title. The HiBackColor sets the active titlebar color. The StdColor\
    \ and StdBackColor work similarly for nonactive windows.\n\nWe use the following\
    \ colors (copied from the default .fvwmrc file):\n\n```\nStdFreeColor      Black\n\
    StdBackColor     #60a0c0\n\n# this is used for the selected window\nHiFreeColor\
    \       Black\nHiBackColor      #c06077\n```\n\nWindow managers usually support\
    \ two policies for selecting which window is made active: click-to-focus and focus-follows-mouse.\
    \ Few people agree on which is better (Microsoft has decided click-to-focus is\
    \ better, though). Choose the mode you want.\n\nIf you want click-follows-mouse,\
    \ ensure that the following line is commented out:\n\n```\n#ClickToFocus\n```\n\
    \nIf you want click-to-focus, then uncomment (remove the # character) the same\
    \ line: \n\n```\nClickToFocus\n```\n\nFor fonts, you can control a control of\
    \ the fonts used by fwwm:\n\n```\nFont              -adobe-helvetica-medium-r-*-*-14-*-*-*-*-*-*\n\
    #Font             -*-times-medium-i-*-*-140-*-*-*-*-*-*\n```"
