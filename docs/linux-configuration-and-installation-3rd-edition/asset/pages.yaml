    # VGA to the Rescue


    If all the preceding methods have failed, you may want to fall back on VGA, just
    to get X up and running. This is presiding of, course, that you don''t have a
    plain old Super VGA card, for which the Super VGA modes would be most appropriate.
    Instead the theory is that if you can''t get super-duper card to run X in its
    super-duper accelerated mode, maybe you can get it running in old VGA mode. PC
    graphics boards support the VGA modes, so this method, while it won''t take advantage
    of the power of your graphics card, may at least allow you run X if you can''t
    so far.


    In the next section, we''ll show how to get a generic VGA file built. This step
    is usually much quicker than getting the file properly built for your graphics
    hardware.


    > WARNING Setting up XFree86 incorrectly can harm your system hardware, so watch
    out.


