    # Making System Backups


    In discussion of tar and gzip, we didn''t really get into making backups of your
    systems. If you''ve been exposed at all to computing (by now you should be), you
    should know to back up your system regularly. Computing systems fail, though not
    as often as they did in the past, and you should always make it a point to back
    up critical data.


    Of course, what constitutes critical data depends on your viewpoint. Some users
    feel comfortable backing up their entire system, particularly if they''ve made
    many configuration changes to their Linux installation (This would include recompiling
    the kernel). Others may feel backing up only selected system files, knowing that
    Linux is on a CD-ROM and can be easily reinstalled.


    Backups really fall into two categories: system files and data files. The system
    files, of course, are the configuration files that you''ve adapted for your own
    particular usage; these would include any hidden configuration files as well as
    the configuration files used for the X Window System. On the other hand, data
    files are your actual work; if you''ve been programming an application, for example,
    you''ll want to save those data files in a backup frequently. And you''ll probably
    want to save the files—both hidden and public—in your home directory and in the
    home directories of your users if you''re a system administrator.


    Our larger point is that there''s no rule to fit all the circumstances surrounding
    a backup. If you''re a system administrator and you need to save a large number
    of files, you should be using tar, gzip, and a tape drive to archive files. If
    you''re just looking at saving a few smaller files or a single directory, you
    can use tar and gzip to create a smaller file that can be copied directly to a
    floppy disk.


    ![](img/05da311512608405596dd882623b9142_339_0.png)'
  merge: -1
  pgno: 339
- img_proc: true
  md: '# CHAPTER 5: Linux Applications 309


    # Using a Floppy for Backups


    Linux allows you to write directly to a floppy disk. You don''t need to mount
    the disk drive or create a Linux filesystem before writing to it. Even if the
    diskette is formatted with MS-DOS, Linux will write over the existing contents
    of the file. (In other words, if you''ve got important files on a diskette and
    don''t want them to be wiped out by Linux, don''t use a device driver to access
    the floppy. Later in this chapter we''ll discuss Linux commands for accessing
    the MS-DOS-formatted floppy.)


    Linux assumes that the first drive on a PC is /dev/fd0. You can use the tar command
    to send its output to this drive instead of a file:


    ```

    gilbert:$ tar cvf /dev/fd0

    ```


    If the contents of the archived files are also too large to fit on one floppy,
    you''ll need to create a multivolume archive; you do so with the M (remembering
    that case counts in Linux; using m instead of M will yield a different result!)
    option to tar, in the following command line:


    ```

    gilbert:$ tar cvmf /dev/fd0

    ```


    In this instance, you''ll want to keep careful track of your floppies; if they
    get out of order or you accidentally lose a diskette, you run the risk of ruining
    the entire archive.


    Of course, if you use the -z option to tar, you may be able to fit an entire archive
    on a single floppy.


    # Using a Tape Drive for Backups


    You can write to a tape drive for a backup directly with the tar command. However,
    which device you write to depends on your system setup.


    If you''re using a tape drive that runs from the floppy controller (as is the
    case with most QIC-type drives, for example), you''ll need to specify /dev/rft0
    as your device:


    ```

    gilbert:$ tar cvf /dev/rft0

    ```'
  merge: -1
  pgno: 340
- img_proc: true
  md: '# 310 CHAPTER 5: Linux Applications


    This creates an archive on the tape drive.


    There''s a little more to creating this tape archive than might appear. For example,
    if you''re using a QIC-type tape drive, there''s no way to format these tapes
    under Linux; you''ll need to use the DOS utilities to format a tape (see, there
    was a reason to keep that DOS partition!) or buy preformatted tapes.


    In addition, there''s the sticky issue of exactly how much data you can throw
    on a tape. Most newer QIC-type drives rewind automatically every use. However,
    Linux can''t deal with this rewinding, and there''s no way to create a marker
    on the tape to place multiple backups on the same tape. How wasteful this depends
    on who is paying for the tape; quite honestly, you can get by with just two tapes,
    performing backups revolving the two tapes and reformatting between.


    Another option is to use a nonrewinding tape device driver, which can be specified
    as /dev/nrft0 (or another number in the sequence, depending on your system setup).
    Your command line would look like this:


    ```

    gilbert:-$ tar cvf /dev/nrft0

    ```


    In this manner you create several archives.


    When using /dev/nrft0 you''ll have to rewind the tape on your own and then look
    for separate archives. To rewind the tape after you''re finished creating archives,
    use the mt command:


    ```

    gilbert:-$ mt /dev/nrft0 rewind

    ```


    The mt command is a wonderful thing. If you''ve worked with tape drives at all,
    you know that they can run into problems when they''re partially used; they become
    “loose” and can jam. The mt command allows you to forward a tape to the end and
    then rewind, in a command line like the following:


    ```

    gilbert:-$ mt /dev/nrft0 retension

    ```


    Finally, the mt command allows you to specify files on a tape drive, in case you
    don''t want to use tar to unarchive all of them. This gets you into some tricky
    ground, however, because Linux still can''t recognize'
  merge: -1
  pgno: 341
- img_proc: true
  md: 'the file makers on a tape drive, and your efforts are in effect tracking

    Linux into accessing the correct files. Let''s say you''ve rewound the tape

    but you want to grab the second file on the tape. In this case, you must

    tell Linux to look for the next file on the tape—or in mt parlance,

    first file passed the current file. You''d use the following command line:


    ```

    gilbert:-$ mt /dev/nrf00 ffs 1

    ```


    The same thing could be used to move the tape placement to the third or

    fourth files on the tape, using the following command lines (respectively):


    ```

    gilbert:-$ mt /dev/nrf00 ffs 2

    ```


    and


    ```

    gilbert:-$ mt /dev/nrf00 ffs 3

    ```


    In addition, there''s another twist to mt. You can''t move between

    sequential files on a tape drive and then try to grab more than one file;

    with mt, you must move to the first file in question and then move to the

    next file in question. If you want to grab the fifth and sixth files in a tape,

    you first move to the fifth file, use tar to unarchive it, and then move

    to the sixth file separately, keeping in mind that mt moves in relation to

    the current file. Therefore, you''d use a sequence like the following:


    ```

    gilbert:-$ mt /dev/nrf00 ffs 4

    ```


    remembering that you''re moving in relation to the first file on the tape;

    after you use tar, you''d use the following command line:


    ```

    gilbert:-$ mt /dev/nrf00 ffs 1

    ```


    remembering that the sixth file is the first file after the fifth file.

    You can also back up to a tape drive, such as a QIC or DAT tape

    drive, connected to a SCSI board. In this case, you''ll use a command

    line like the following:


    ```

    gilbert:-$ mt /dev/rst0 .

    ```'
  merge: -1
  pgno: 342
- img_proc: true
  md: '# 312 CHAPTER 5: Linux Applications


    if you want to use a rewinding device and the SCSI device is numbered 0, or use:


    ```

    gilbert:-$ mt /dev/nrst0

    ```


    for a rewinding device and the SCSI device is numbered 0.

    The **mt** command also allows you to access tapes made by different devices.
    For the most part, you shouldn''t have problems reading the DAT tape created on
    another system. However, you can run into problems if the other UNIX system used
    a different block size when creating the tape. In this case, your attempts to
    read the file will result in error messages. To avoid these, you''ll need to use
    **mt** to specify a new block size, as in the following command line:


    ```

    gilbert:-$ mt setblk blockSize

    ```


    There are a host of additional options to the **mt** command; as always, you''re
    encouraged to peruse the online-manual page:


    ```

    gilbert:-$ man mt

    ```


    or


    ```

    gilbert:-$ xman

    ```


    # Commands Specific to the PC Architecture: MTools


    The **mt** command is one of many Linux commands that are expressly designed for
    the many quirks of the PC architecture—specifically on DOS-formatted floppy disks.
    The MTools commands are designed to take these quirks into account when performing
    many routine tasks.


    In short, the need for the *m*-series of commands exists because DOS files and
    UNIX files are structured a little differently, which is something you''ll need
    to watch for, especially if you''re using floppy drives. In fact, you can wipe
    out a good DOS floppy disk using a UNIX command to copy a file to it. (We learned
    this the hard way.)'
  merge: -1
  pgno: 343
- img_proc: true
  md: '# CHAPTER 5: Linux Applications


    Therefore, you''ll want to check out the $m$-series of commands, used specifically
    to deal with the quirks of the DOS and Linux architectures and the differences
    between them.


    # Using Mdir to View the Contents of a DOS Directory


    This straightforward command is used to list the contents of a DOS directory:


    ```

    gilbert:-$ mdir

    ```


    The default for **mdir** and the rest of the MTools, is A: (in other words, your
    first floppy drive). Because a DOS partition can be mounted from Linux, the $m$-series
    of commands won''t accept C as an input.


    # Using Mcd to Change Directories


    The **mcd** command changes directories on the floppy drive (the default is the
    root directory on A:). Without an argument, it displays the current device and
    working directory:


    ```

    gilbert:-$ mcd

    A:/

    ```


    # Using Mcopy to Copy Files


    As noted, the UNIX **cp** command can be destructive to an MS-DOS file structure
    on a floppy. To copy a file *from* within Linux to a DOS floppy, you''ll want
    to use the **mcopy** command:


    ```

    gilbert:-$ mcopy -t textfile a:textfile

    ```


    As you probably noticed, the **mcopy** command uses the DOS convention of naming
    floppy drives (as opposed to the UNIX **dev** designations).'
  merge: -1
  pgno: 344
- img_proc: true
  md: '# CHAPTER 5: Linux Applications


    Here mcopy was used to copy a file named textfile (presumably containing text)
    to the A: floppy drive. The -t option was used because UNIX and DOS have different
    ways of dealing with linefeeds, and this option is specifically for text-file
    translation.


    There are only a few other command-line options to mcopy. In a show of mercy on
    the part of its designers, mcopy will warn you if you''re overwriting an existing
    file. In order to ignore this mercy, you''d need to run mcopy with the -n option:


    ```

    gilbert:~ mcopy -n textfile:textfile

    ```


    If you want to tell about each file movement as it happens, use the verbose mode,
    as launched by the -v option:


    ```

    gilbert:~ mcopy -v textfile:textfile

    ```


    Also, remember that you must always conform to the DOS eight-dot-three naming
    convention when working with DOS files.


    The mread and mwrite commands do the same thing.


    # Using Mren to Rename DOS Files


    The mren command renames DOS files:


    ```

    gilbert:~ mren oldfile.nam newfile.nam

    ```


    Remember that you must always conform to the DOS eight-dot-three naming convention
    when working with DOS files.


    # Using Mdel to Delete DOS Files


    The mdel command, predictably enough, is used to delete files from a DOS directory.
    For example, to delete textfile from the A: floppy drive, you''d need to use the
    following command line:


    ```

    gilbert:~ mdel a:textfile

    ```'
  merge: -1
  pgno: 345
- img_proc: true
  md: '# Using Mtype to View a DOS File


    If you want to view the contents of a DOS file on a floppy, use the **mtype**
    command to display the file:


    ```

    gilbert:-$ mtype filename

    ```


    If you''re viewing an ASCII file, use the -t option:


    ```

    gilbert:-$ mtype -t filename

    ```


    # Using Mmd to Create a DOS Directory


    You can create a DOS directory with the **mmd** command:


    ```

    gilbert:-$ mmd newdirec.tor

    ```


    Remember that you must always conform to the DOS eight-dot-three naming convention
    when working with DOS directories.


    # Using Mrd to Remove a DOS Directory


    If you''re not happy with the directory you created with **mmd**, you can delete
    it with the **mrd** command:


    ```

    gilbert:-$ mrd newdirec.tor

    ```


    # Using Mread to Copy a DOS File to Linux


    The **mread** command transfers a DOS file to a Linux file, making appropriate
    conversions if necessary. This command actually works on two different levels:
    It can be used to transfer a single file to a UNIX file, or it can be used to
    transfer a set of DOS files to a Linux directory. In the first usage, you''ll
    need to specify both the DOS and UNIX filenames:'
  merge: -1
  pgno: 346
- img_proc: true
  md: '# 316 CHAPTER 5: Linux Applications


    ```

    gilbert:~$ mread dosfile unix

    ```


    To copy a set of files to a specific UNIX directory, specify the DOS files (yes,
    you can use wildcards) and then the UNIX directory:


    ```

    gilbert:~$ mread *. /home/kevinr

    ```


    If a file of the same name already exists in the destination directory, mread
    will warn you before overwriting the file.


    There are a few useful options to mread:


    +   - -t


    The mcopy command will also copy copy files between DOS and Linux.


    # Using Mwrite to Write to a UNIX File to DOS


    The mwrite command writes a UNIX file to a DOS-formatted diskette:


    ```

    gilbert:~$ mwrite unixfile dosfile

    ```


    If a file of the same name already exists in the destination diskette, mwrite
    will warn you before overwriting the file.


    There are a few useful options to mwrite:


    +   - -t


    The mcopy command will also copy copy files between DOS and Linux.'
  merge: -1
  pgno: 347
- img_proc: true
  md: '# CHAPTER 5: Linux Applications 317


    # Using Mformat to Format a Diskette


    The mformat command adds the basics of a DOS file system (FAT, boot sector, and
    a root directory) to a UNIX-formatted diskette. To format a diskette in drive
    A$; you''d use the following:


    ```

    gilbert:~$ mformat a:

    ```


    Mformat also supports a number of options:


    +   - -t, which sets the number of tracks (not sectors).

    - -h, which sets the number of heads.

    - -s, which sets the sectors per track.

    - -l, which sets the volume label.


    The mformat command will work only with a diskette that''s already formatted for
    UNIX. Its usefulness is actually more limited than may appear at first glance.


    # Using Mlabel to Designate a Volume Label


    The mlabel command displays a current DOS volume label and then asks for a new
    label; if you don''t enter anything at the prompt, mlabel merely removes the existing
    volume label without adding a new one. The only option is to mlabel, -v, runs
    the command in verbose mode (always a good thing if you''re working with an unfamiliar
    command).


    # Using Mattrib to Change the DOS File Attributes


    If you''re exchanging files with a DOS machine, you may have (however, the chance
    is pretty remote) run into conflicts with the file''s attributes (which are akin
    to the Linux file permissions). A DOS file can be read-only (r), archived (a),
    system (s), or hidden (h). You can use mattrib to change these permissions; +
    to add the attribute (highly unlikely) or - to remove the attribute (more likely,
    although you probably won''t'
  merge: -1
  pgno: 348
- img_proc: true
  md: 'messing much with DOS file attributes). For example, to change a file

    from hidden to unhidden, you''d use the following command line:


    ```

    gilbert:-$ mattrib -h filename

    ```


    To remove the read-only designation from a file, use a command line

    like the following:


    ```

    gilbert:-$ mattrib -r filename

    ```


    To make the file a regular file and not a system file, you''d use a

    command line like the following:


    ```

    gilbert:-$ mattrib -s filename

    ```


    To make the file a file that can be archived (how DOS allows files to be

    arched is a rather twisted and sordid tale; let''s just leave it at that),

    you''d use a command line like the following:


    ```

    gilbert:-$ mattrib -a filename

    ```


    To add the attributes in the preceding examples, you''d substitute + for -\.

    These commands assume that you''re working with drive A: If you''re

    working with a file on your hard drive, you can designate an absolute

    filename on the command line (using the DOS practice of a backslash

    between directories), but be sure and enclose the absolute filename in

    quotation marks or your Linux shell will choke on the filename.


    # Graphics Tools


    Much of the purpose of the X Window System is to bring graphical

    computing tools to a text-based operating system, UNIX (or, in this case,

    Linux). Hence the presence of many X-only tools designed to create and

    edit graphics of all sorts. We''ll review some of them here.'
  merge: -1
  pgno: 349
- img_proc: true
  md: '# CHAPTER 5: Linux Applications 319


    # Bitmap


    This simple program is used for creating bitmaps, small rectangular drawings that
    can be inserted directly into C programming code and can be used for icons, cursor
    shapes, tile and stipple patterns, and more. It''s shown in Figure 5.16.


    When you launch the bitmap command, you''re presented with a grid representing
    the image. You can use the accompanying settings to create shapes (like curves).
    If you''re using bitmap to create cursors, you can designate a point as a hot
    spot, which determines where the cursor is pointing. Bitmaps can be inverted or
    folded.


    ![](img/05da311512608405596dd882623b9142_350_0.png)


    Figure 5.16 The bitmap program.


    Additional utilities (bmtoa to atobm) can be used to convert the final bitmap
    file to and from ASCII strings.'
  merge: -1
  pgno: 350
- img_proc: true
  md: '# Xfig


    Xfig is a handy program for creating small drawings that use circles, squares,
    polygons, other shapes, and text (such as flowcharts). You can start with a blank
    screen or an existing file. Your work can be saved in LaTeX, PostScript, PIC,
    or PiCTEX formats.


    # Xfractint


    This program is used to generate fractals, multicolored shapes that evolve from
    a set of parameters that you provide. These parameters may include a number of
    colors and the size of a window, as well as the pattern used as the basis for
    the fractal. (Many patterns are included in xfractint).


    This is a rather odd program in that it takes input from the xterm window while
    displaying the output in a separate X window. When you run xfractint for the first
    time, you may be focused on the new X window and not on the old xterm; however,
    you see that the new window stays black and the xterm demands input, you’ll figure
    it out.


    To run xfractint, use the following command line:


    ```

    gilbert:$ xfractint

    ```


    There are several command-line options, which you can review in the online man
    pages:


    ```

    gilbert:$ man

    ```


    # Xpaint


    This simple paint program can be used to create and modify graphics files; if
    you’ve ever used MacPaint for the Macintosh, you’ll quickly get the hang of xpaint.
    (Some of the cursors used in MacPaint can also be found in xpaint, as a matter
    of fact.) Supported file formats include'
  merge: -1
  pgno: 351
- img_proc: true
  md: '# CHAPTER 5: Linux Applications 321


    Portable Bitmap (PPM), X bitmap (XBM), TIFF, GIF, PostScript, XPM, and more. Xpaint
    is shown in Figure 5.17.


    When you launch xpaint, you’re presented with a window containing painting tools,
    such as a solid brush, a paint can, editing tools, and text input. You must either
    create a new “canvas” or open an existing file, which will then open a new window.
    Basically, the use of xpaint comes down to working in these two windows (at least
    two windows, anyway; you’re welcome to open several “canvases”).


    Further information can be gleaned from the online man page.


    ![](img/05da311512608405596dd882623b9142_352_0.png)


    Figure 5.17 xpaint


    # Xv


    This is an excellent graphics-editing package from John Bradley. Basically, this
    package can be used to display GIF, JPEG, TIFF, Portable Bitmap (PBM, PGM, PPM),
    X bitmap, BMP, PCX, Iris RGB, XPM, XWD, and PostScript files. It’s shown in Figure
    5.18.'
  merge: -1
  pgno: 352
- img_proc: true
  md: '# 322 CHAPTER 5: Linux Applications


    Basically, you can use xv to view and manipulate these graphics files. For example,
    you can perform the following actions on a supported graphics file:


    +   - When you change the size of the window, you change the size of the image.
    If you change the proportions of the window, you change the proportions of the
    image. These changes will be saved to file if you want.

    - Graphics can be rotated in 90-degree increments.

    - A picture can be flipped vertically or horizontally.

    - Cropping pictures is a matter of defining one portion of the graphic and discarding
    the rest.


    ![](img/05da311512608405596dd882623b9142_353_0.png)


    Figure 5.18 xv when loading a file.


    +   - A portion of a graphic can be magnified and saved in that resolution.

    - You can change the RGB values of a graphic or produce a stippled version using
    black and white.

    - File conversions can be performed, as graphics imported in any format can be
    saved to any other format supported by xv.'
  merge: -1
  pgno: 353
- img_proc: true
  md: '# CHAPTER 5: Linux Applications 323


    The version of xv that ships with Slackware Linux is unregistered shareware. If
    you use xv we strongly encourage you to register it with Bradley. You can find
    further information about xv in usr/doc/xv/xv.blurb, while the entire documentation
    formatted in PostScript (which you must first unzip using gunzip) can be found
    at usr/doc/xvdocs.ps.gz.


    # The JPEG Utilities


    There are a series of commands that allow the manipulation and JPEG files. This
    is perhaps a more important capability than you might think; JPEG is becoming
    (along with GIF) one of the prevalent graphics file formats of the World Wide
    Web. If you''re planning on doing any Web work (surfing or publishing), you''ll
    want to know about these JPEG tools.


    # Cjpeg


    This simple command compresses a graphics file (in the GIF, Portable Bitmap [PBM],
    BMP, GIF, Targa, and RLE formats) and converts it to the JPEG format, popular
    in the World Wide Web. To convert the file image.gif to a JPEG file, you''d use
    the following command line:


    ```

    gilbert:$ cjpeg -gif image.gif > image.jpg

    ```


    # Djpeg


    This simple command decompresses a JPEG file and converts it to a format that
    can more easily be handled by Slackware Linux (Portable Bitmap [PBM], BMP, GIF,
    Targa, or RLE). You select the file format on the command line. For example, to
    convert the file image.jpg to a GIF format, you''d use the following command line:


    ```

    gilbert:$ djpeg -gif image.jpg > image.gif

    ```


    # Rdjpegcom and Wjpegcom


    The rdjcom command prints out any “comment blocks” found in a JPEG file. These
    comments are used to annotate images, both for the person'
  merge: -1
  pgno: 354
- img_proc: true
  md: '# CHAPTER 5: Linux Applications


    viewing the image and for the person managing a set of images. To view the comments
    in the file image.jpg, you''d use the following command line:


    ```

    gilbert:$ rdjpgcom image.jpg

    ```


    Conversely, the wrjpgcom command is used to add a comment block to a JPEG file.
    You can add the comment directly from the command line, but you must specify a
    new filename and the original filename (this command will not overwrite an existing
    file):


    ```

    gilbert:$ wrjpgcom -comment "This is a comment" old.jpg > new.jpg

    ```


    or add an existing file (in our example, add.txt) to the comment block:


    ```

    gilbert:$ wrjpgcom -cfile comment.txt < old.jpg > new.jpg

    ```


    # Miscellaneous Tools


    There are many more command-line and X Window tools that ship as part of Slack
    Linux. Here are some you''ll find useful.


    # Clocks


    If you want to constantly know what time it is, you can run the clock or xclock
    commands, which place a clock on your screen, displaying the current time (as
    shown in Figure 5.19).


    ![](img/05da311512608405596dd882623b9142_355_0.png)


    Figure 5.19 Oclock (left) and xclock (right).'
  merge: -1
