  md: '# 104 CHAPTER 2: Installing Linux


    # Other Configuration Procedures


    Now that you''ve got Linux basically installed and running, you can take the time
    to set up some system peripherals. These include printers, sound cards, and (for
    laptop users) PCMCIA devices.


    # Setting Up a Printer


    When you installed Slackware, you were asked about the location of your printer.
    This information was translated into the UNIX equivalent; a printer on the first
    parallel port is assigned a device name of `/dev/lp0`. Similarly, if you''re using
    a serial printer (which, thank goodness, is getting rarer and rarer), it will
    probably be assigned a device name of `/dev/ttyS1`.


    This simple configuration means that you can immediately print ASCII characters,
    with the Linux system treating your printer like a simple line printer. Printing
    is actually a more involved process than you might think. We''ll cover printing
    in Chapter 4, but you should be aware now that printing in Linux involves the
    following steps:


    +   * When your computer boots, the `lpd` daemon runs, looking at the `/etc/printcap`
    to see what printer you''re using; the process continues to run throughout your
    Linux computing session.

    * When you print a document with `lpr`, the `lpd` daemon actually handles the
    print job.

    * To change anything in the printing process (like when you want to kill or suspend
    print jobs), the `lpc` and `lprm` commands are used to talk to the `lpd` daemon.


    Obviously, you''ll want to make sure that `/etc/printcap` contains correct information
    about your printer. When you look at it in a text editor like `elvis` or `emacs`,
    you''ll see that all the lines are commented out with # characters. Most popular
    printers are listed in this file (such as HP LaserJets), and if you uncomment
    the lines specific to your printer, you should be able to use it.


    It''s important to get this information correct, because Linux printers that aren''t
    configured properly have a tendency to suffer from the "staircase effect," where
    lines are staggered at the beginning:'
  merge: -1
  pgno: 135
- img_proc: true
  md: '# CHAPTER 2: Installing Linux 105


    We hate the staircase effect.


    It makes our documents look really stupid.


    And it makes it hard for us to do our work properly.


    In fact, we find that we don''t print things out

