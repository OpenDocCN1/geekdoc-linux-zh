  md: '# CHAPTER I: Linux and PC Hardware


    Table 1.1 lists the minimum and ideal configuration guidelines for Linux.


    Table 1.1 Linux PC Configuration Guidelines


    | PC Component | Minimum | Ideal |

    | --- | --- | --- |

    | Processor | Intel 80386 or equivalent | Pentium is ideal (power, power, power!);
    i486 works fine, as do Intel clones |

    | RAM | 4MB (8MB for running X''Window) | 16MB |

    | Graphics card | VGA graphics | SVGA graphics; card explicitly supported by XFree6
    |

    | Hard drive | 125MB | 500MB or more |

    | Bus | Anything but MCA | Anything but MCA |

    | CD-ROM | Double-speed drive | Quadruple-speed drive |

    | Mouse | Microsoft, Logitech, or compatible | Microsoft, Logitech, or compatible
    |

    | Network card | None | Supported model (if networking) |


    If you''re not sure about your particular hardware setup and Linux compatibility,
    check out the Hardware Compatibility-HOWTO (see Appendix A for details).


    ![](img/05da311512608405596dd882623b9142_37_0.png)


    Watch out for hardware advertised as "plug-and-play." Most of this hardware is
    extremely difficult to use with Linux, although it can be done by first booting
    DOS and then "warm booting" into Linux with Loadbin. Some experimental kernel
    patches and a plug-and-play configuration tool are included in Slackware, but
    in general, if you can avoid plug-and-play devices (at least until Linux support
    improves) you''ll be better off.


    ![](img/05da311512608405596dd882623b9142_37_1.png)'
