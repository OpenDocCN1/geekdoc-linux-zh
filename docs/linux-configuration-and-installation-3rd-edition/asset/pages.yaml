  md: '# CHAPTER 3: Installing and Configuring XFree86


    Turning off the Virtual Desktop

    Both Free86 and fwm provide the ability to use virtual screen space, screen space
    beyond the confines of your monitor''s resolution. XFree86 calls this a virtual
    screen, and fwm calls this a virtual desktop.


    These two methods tend to conflict, and frankly, we don''t have much use for either
    kind of virtual screen space, as we don''t run that many applications at once
    and we can identify windows to get them out of the way. Furthermore, it''s easy
    to accidentally wrap to one of fwm''s virtual desktop spaces, which tends to get
    annoying.


    Because of all this, we turn off fwm''s virtual desktop in our .fwmrc file with
    the following:


    ```

    DesktopSize 1xl

    ```


    You specify the desktop value in units of the screen size; 1x1 means no virtual
    desktop.


    # Placing Icons


    Fwm''s defaults result in bizarrely placed icons, with hidden icons throughout
    the screen. We want to change this. To do so, use the IconBox command in the .fwmrc
    file. We like our icons to go across the top of the screen, but we start from
    an offset of 130 pixels to leave room for the round clock window we place in the
    upper-left corner of the screen. (See our .xinitrc file, listed earlier.)


    The IconBox specifies a rectangular area where you want the icons to appear. Here
    we our area:


    ```

    IconBox 130 5 600 15

    ```


    # Configuring the Good Stuff


    Fwm also supports called modules, add-ons that you can configure and run. The
    most popular add-on is called GoodStuff; it places a window on your screen from
    which you can launch applications or'
