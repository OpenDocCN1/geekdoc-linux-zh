    # Some Math Tools


    Linux and UNIX have wide usage in the academic world, where math tools are important.
    Most of us won''t need elaborate math tools; here are a few rudimentary tools
    that you''ll probably use.


    # The Bc Command


    Even though the proliferation of ubiquitous and inexpensive calculators has made
    this command somewhat obsolete, the bc command—especially in the Free Software
    Foundation version included with Linux—can still be used as a very functional
    calculator. Use it as follows:


    ```

    gilbert:-$ bc

    1+1

    2

    quit

    ```


    The preceding example was performed on a 486-based PC, not a Pentium. This simple
    equation shows how to use bc: Type it as a command line, hit Enter (or Return),
    enter your equation, hit Enter (or Return), read the calculation, and enter quit
    when you''re done. Obviously, other more advanced features are available, such
    as square roots, converting numbers from one base to another, determining prime
    factors, and control statements for writing programs. Consult your system documentation
    or the online man page for further information.


    # Dc


    The dc calculator uses reverse-polish calculation and provides the ability to
    define and call macros.'
