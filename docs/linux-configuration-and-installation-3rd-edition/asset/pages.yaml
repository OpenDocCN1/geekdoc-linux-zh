    # Printing Files


    When you installed Linux, you were prompted by the location of the printer connected
    to your PC. If you’re like 99 percent of the PC users out there, you have a printer
    connected to your parallel port. If you’re installing Linux on a UNIX network,
    you’ll use the previously installed printer or set up a printer per the UNIX printing
    system (which varies considerably).


    In this section, we’ll assume you’ve installed the printer on the parallel port
    and told Linux of this installation.(If this isn’t the case, check with a standard
    UNIX text to see how printers are treated on UNIX networks.) To see what printers
    Linux thinks are connected to the network, use lpc:


    ```

    gilbert~\$ lpc

    lpc>

    ```


    This command will present you with a series of options. These commands, for the
    most part, relate to printing a specific file on a specific printer.


    > NOTE This section assumes you’re printing a file directly from the command line.
    Some other applications—primarily Ghostscript—deal with printers on their own,
    which you’ll learn in Chapter 5.


    ![](img/05da311512608405596dd882623b9142_285_0.png)'
  merge: -1
  pgno: 285
- img_proc: true
  md: '# CHAPTER 4: Basic Linux Tools 255


    You can also use the standard lpr command to print files:


    ```

    gilbert:/$ lpr filename

    ```


    where filename is the name of the file you want to print. The command copies filename
    to a spool directory, and from there the file is actually printed. After you run
    the lpr command, you can edit the file you''re printing, but the changes won''t
    be reflected in the printed pages.


    To check the status of a print request, use the lpq command:


    ```

    gilbert:/$ lpq

    ```


    You''ll be given information about the printer, the status of pending print jobs
    (what''s being printed, what''s next in line), and a job ID.


    This ID is important if you want to cancel the print request; for this, you''d
    use the lprm command in conjunction with the job ID:


    ```

    gilbert:/$ lprm 213

    ```


    If you want to cancel all the print requests (in other words, your printer jammed
    and you want to begin the print sequence from scratch), use the following command
    line:


    ```

    gilbert:/$ lprm -

    ```


    # Summary


    This chapter covered the basic Linux commands and concepts, beginning with an
    explanation of how Linux organizes files and directories. There''s nothing too
    obscure about these concepts, as Linux pretty much falls in line with the rest
    of the UNIX world. But these concepts are still worth reviewing, even if you''re
    an experienced UNIX user.


    A number of Linux commands were explained: cd (for moving between directories),
    pwd (which prints the current directory), ls (which lists the contents of the
    current directory or another specified'
  merge: -1
  pgno: 286
- img_proc: true
  md: '# 256 CHAPTER 4: Basic Linux Tools


    directory), **mkdir** (which creates a directory), **rm** (which removes a file),
    **rmdir** (which removes a directory), and more.


    Quite a lot of space was spent on permissions, which can trip up even the most
    experienced of UNIX users at times. Also covered are the commands that deal with
    permissions: **chmod** (which changes permissions) and **umask** (which defines
    how permissions are set when you create a file or directory).


    How Linux deals with passwords is another important section of this chapter. When
    you installed Linux, you set up a password. Covered here is a further explanation
    of passwords, followed by coverage of the **passwd** command, which is used for
    changing passwords.


    The many tools for viewing files were covered: **more** (used to scroll through
    a file), **less** (the more flexible successor to **more**), **head** (used to
    view the beginning of a file), **tail** (used to view the end of a file), and
    **od** (which displays an octal dump of a file).


    The shell acts as the intermediary between you and the operating system. As such,
    the shell has a ton of power over your actions on the Linux operating system—it
    manages things like standard input and output, redirection, processes, and multitasking.
    The default shell under Linux is **bash** from the Free Software Foundation.


    The **el** text editor (a clone of **vi**) is a useful text editor. The basic
    operations in it were covered, although we advise the reader to check out the
    online-manual pages for this command.


    To print a file with Linux, use the **lpr** command. A set of utilities—**lpc**,
    **lpq**, **lprm**—assist in the task of managing print requests.


    This chapter covered a lot of ground, but it barely scratches the surface when
    it comes to useful Linux commands and concepts. In the next chapter, we''ll move
    on to some basic Linux applications that you''ll find useful for your everyday
    work.'
