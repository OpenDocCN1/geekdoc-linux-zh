    this last program is preceded by an exec statement. When you quit this last program,
    X stops and you''re back at the console. In our case, we use fwwm as this last—key—process,
    because you need a window manager running during your X session, making fwwm a
    natural for this last process.


    All our customizations to the .xinitrc file fit into a few simple lines:


