    # Configuring the Monitor Section


    The Monitor section describes your monitor to X. You can define a number of monitors
    in the XF86Config file, as each monitor section is named. The Screen section (discussed
    later) then connects a monitor to a video card. For example, the following abbreviated
    entry defines our NEC MultiSync XE17 monitor:


    ```

    Section "Monitor"

    Identifier "NEC MultiSync XE17"

    VendorName "NEC"

    ModelName "MultiSync 4FGe"

    HorizSync 31.5 - 64.3

    VertRefresh 55-120

    # Modes from the NEC MultiSync 4FGe monitor, a close monitor.

    ModeLine "640x480" 31 640 680 704 832 480 492 520

    ModeLine "800x600" 50 800 864 976 1040 600 637 643 666

    ModeLine "1024x768" 81 1024 1068 1204 1324 768 776 782 807

    EndSection

    ```


    For each monitor, you need to define the items listed in Table 3.13.'
  merge: -1
  pgno: 166
- img_proc: true
  md: '# 136 CHAPTER 3: Installing and Configuring XFree86


    Table 3.13 Monitor Data

    | Item | Usage |

    |---|---|

    | Identifier string | Used to identify the monitor later |

    | VendorName string | Used for your reference |

    | ModelName string | Used for your reference |

    | Bandwidth bandwidth | The bandwidth for the monitor, in MHz |

    | HorizSync range | Horizontal sync frequencies, in kHz |

    | VertRefresh range | Vertical correction range, in Hz |

    | Gamma value | Gamma correction value for your monitor |

    | Modeline values | A single resolution mode |


    The identifier is a string used to refer to the monitor later. You can define
    more than one monitor in the XF86Config file.

    The HorizSync range describes the horizontal sync frequencies for your monitor.
    It can be a set of comma-separated values or a range separated by a dash, such
    as 42-65, for multisync monitors. You should get this value from your monitor
    documentation (where you''ll find most of the key information needed here).

    The format for a Modeline is:


    Modeline "name" horizontal-values vertical values


    For example, the following sets up a standard VGA mode:


    ```

    # 640x400 @ 70 Hz, 31.5 kHz hsync

    Modeline "640x400" 25.175 640 664 760 800 400 409 411 450

    ```


    There can be a whole set of modeline values. You can get this from the probeonly
    mode of X or from documentation that comes with XFree86. Some of the relevant
    documentation is listed in Table 3.14.'
  merge: -1
  pgno: 167
- img_proc: true
  md: '# CHAPTER 3: Installing and Configuring XFree86 137


