  md: '# CHAPTER 3: Installing and Configuring XFree86


    You''ll need about 50MB of disk space for XFree86, and you should have at least
    16MB of RAM to run X effectively. You can launch X and perform some basic functions
    with 8MB of RAM, but you''ll soon run into performance problems with limited RAM.
    To compound matters, you won''t be told that you''re running low on RAM; your
    chosen window manager will simply fail to respond to your commands.


    Once you''ve determined your system configuration, the next step is to set up
    the proper X server for your graphics card. XFree86 ships with a number of X servers,
    each compiled with drivers for a certain type of graphics card or chipset. Each
    of these X server executables usually starts with the type of cards supported.
    For example, the XF86_SVGA server is built with support for standard Super VGA
    chipets. XF86_S3 is the server for S3-based graphics cards.


    You''ll need to know which chipset your card has and figure out which X server
    to use. We list the X servers in Table 3.5.


    Table 3.5 XFree86 X Servers


    | Filename | For Chipsets |

    | --- | --- |

    | XF86_8514 | 8514/A and true clones |

    | XF86_AGX | IIT AGX-014,AGX-015,AGX-016 |

    | XF86_Mach8 | ATI Mach8 |

    | XF86_Mach32 | ATI Mach32 |

    | XF86_Mach64 | ATI Mach64 |

    | XF86_Mono | Monochrome VGA, also Hercules, Hyundai HGC1280, Sigma LaserView,Visa,
    and Apollo monochrome cards |

    | XF86_P9000 | Weitek P9000 |

    | XF86_S3 | S3-based cards |

    | XF86_S3V | S3 VERGE-based cards |

    | XF86_SVGA | Super VGA |

    | XF86_VGA16 | 16-color VGA server |

    | XF86_W32 | Tseng ET4000/W32, ET4000/W32i, ET4000/W32p |


    The reason you have to know which X server to use is that the wrong server at
    best won''t work and at worst may damage your system.'
  merge: -1
  pgno: 153
- img_proc: true
  md: '# CHAPTER 3: Installing and Configuring XFree86 123


    XFree86 is set up to run only one X server, the program named X and stored in
    /usr/X1nR6/bin. Because of this, you need to link the X server you chose earlier
    to the file named X. The following command, when run as root user, links the S3
    X server we use to the standard X:


    ```

    ln -sf /usr/X11R6/bin/XF86_S3 /usr/X11R6/bin/X

    ```


    All the XFree86 files are stored in /usr/X11R6, but there are many links to other
    parts of the filesystem. For example, /usr/bin/X1 is linked to /usr/X11R6/bin,
    where the X binaries really reside. The Slack installation has taken care of these
    links for you.


    Now you have the proper X server set up to run when you start X. The next step
    is to tell XFree86 about your hardware in even more detail by filling out the
    infamous XF86Config file.


    # Setting Up the XF86Config File


    The XF86Config file, located in /usr/lib/X11 (really a link to /usr/X11R6/lib/X11),
    is read when the X server starts, it describes your hardware and other configuration
    options for XFree86.


    When you''ve gotten to this step, there are two routes for you. You can set up
    a generic XF86Config file for Super VGA graphics, or you can tune your XF86Config
    file for your particular card. We will cover both routes in this chapter. We strongly
    advise you to configure the XF86Config file for your graphics card. Unfortunately,
    this has proven (in our experience) to be the most daunting task under Linux.
    Nothing else been this difficult. So be warned—dangerous waters lie ahead.


    The main reason this is a difficult task is that virtually all graphics-card vendors
    write device drivers for Microsoft Windows, but virtually none write drivers for
    Linux. Because of this, you''re left with the task of setting up your system to
    run with the graphics card.


    # Hardware, Hardware, Hardware


    We keep repeating the mantra that you need to know your system''s hardware inside
    and out. If you know your hardware, you can get the most out of X. If you don''t,
    you run the danger of destroying your system.'
  merge: -1
