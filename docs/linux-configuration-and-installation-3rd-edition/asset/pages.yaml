  md: '# CHAPTER I: Linux and PC Hardware


    +   * CMD-640

    * DTC 2278D

    * Intel Triton (82371FB) IDE (with busmaster DMA)

    * FGI/Holtek HT-6560B

    * RZ1000


    If you''re using a hard disk with an MFM, ESDI, or RLL controller, you''ll need
    to use the ext2f file system format when installing Linux.


    ![](img/05da311512608405596dd882623b9142_43_0.png)


    Regarding how large a hard drive you''ll need—as always, the bigger the better.
    A full installation of Linux takes up a little less than 275MB, but you can do
    quite well in 100MB (40MB if you don''t install the X Window System) if you''re
    careful about what you install.


    The price of hard disks has been falling rapidly, so many people will be able
    to afford 1-gigabyte IDE drives. This is a good thing, of course; we recently
    noticed 1.2-gigabyte IDE drives advertised for less than $300. (SCSI hard drives,
    of course, cost a little more.)


    ![](img/05da311512608405596dd882623b9142_43_1.png)


    However, if you buy one of these mondo IDE hard drives, you''ll need to do a few
    things before you install Linux on them—or rather, do not a few things. MS-DOS
    can''t handle such large drives (in their infinite width, the designers of MS-DOS
    placed a cylinder limit on DOS, and newer hard drives exceed that 1023-cylinder
    limit), most manufacturers, such as Conner and Western Digital, disk-management
    software (such as Ontrack''s Disk Manager) that allow MS-DOS to deal with large
    hard drives. Don''t install this software. A program like Disk Manager is designed
    to work only with MS-DOS or a variant, not DOS or another operating system.


    Instead, change your PC''s BIOS per the directions found in the hard-disk documentation.
    Then, using the steps detailed in Chapter 2, use the DOS FDISK utility to partition
    the hard drive into two smaller partitions that can be seen by both DOS and Linux.'
