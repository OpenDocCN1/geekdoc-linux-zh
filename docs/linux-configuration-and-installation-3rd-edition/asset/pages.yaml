- img_proc: true
  md: '# 218 CHAPTER 4: Basic Linux Tools


    In the previous section covering the ls command, we covered the command''s use
    when it''s applied to single files. However, there may be times when you want
    to list a set of files that share a common characteristic, such as ending with
    .c. In this instance, you can tell ls to look for every file that ends with .c,
    using the following command line:


    ```

    gilbert:- ls *.c

    aaardvk.c  titles.c  xylophone.c

    ```


    In this instance, ls is used to substitute * for any portion of a filename preceding
    an ending of .c. And, as you can see from the list of files, the command was successful.
    The ls is used to match any number of characters in a string, including zero characters:


    ```

    gilbert:- ls titles*

    titles  titles.c

    ```


    In the case of titles, the wildcard matched zero characters. The asterisk (*)
    can be used at the beginning or end of a wildcard expression. You can also use
    more than one asterisk in an expression:


    ```

    gilbert:- ls t*.

    titles.c

    ```


    If you wanted to list the files with the string titles anywhere in the filename,
    you could use the following command line:


    ```

    gilbert:- ls *titles*

    subtitles  titles  titles.c

    ```


    The asterisk wildcard is the most expansive wildcard available. On the other end
    of the spectrum is the question-mark wildcard, which is used to match a single
    character:


    ```

    gilbert:- ls?

    titles

    ```'
