  md: '# CHAPTER 10: Programming in Linux 449


    # ELF Files


    This version of Linux uses a new object module format called ELF, short for Executable
    and Linking Format. Programs compiled with ELF differ from those compiled in the
    older a.out format. ELF provides better support for shared libraries, the primary
    reason for this migration. Shared libraries save on memory usage when you run
    more than one program at a time, especially more than one X Window program.


    Normally, you won''t have to pay attention to ELF or a.out issues, except for
    one thing: the a.out libraries are not compatible with the ELF libraries. This
    is especially true for shared libraries.


    Thus, you must be careful about any Linux programs you acquire. If you compile
    everything from source code, you''re OK, as Linux will use the libraries you have
    on your system.


    But if you pick up applications in precompiled binary format, for example, Netscape
    Navigator or NCSA Mosaic, you have to ensure that you have the proper shared libraries
    as expected by the application, or the program simply won''t.


    When you install Linux (or any time later if you run the setup program), you can
    install both the a.out and the ELF libraries. If you have the disk space, you
    should load both. If you need to choose one or the other, go with ELF, as everything
    in the Linux world is migrating to ELF.


    To see what systems your linker, ld, is configured for, try the the following
    command:


    ```

    ld -v

    ```


    You should see output like the following:


    ```

    ld version cygnus-2.6 (with BFD 2.6.0.14)

    Supported emulations:

    i386

    i386linux

    i386coff

    m68kelf

    m68klinux

    sun4

    elf32_sparc

    ```'
  merge: -1
  pgno: 480
- img_proc: true
  md: '# 450 CHAPTER 10: Programming in Linux


