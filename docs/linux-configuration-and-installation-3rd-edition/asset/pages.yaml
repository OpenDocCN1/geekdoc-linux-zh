    software written for Windows, DOS, CP/M, and Macintosh software. While on one
    level it seems rather silly to be launching a tool to run Windows applications
    when one could just run Windows anyway, it helps to know that these projects were
    launched in the days when hard disks were expensive and most people didn''t want
