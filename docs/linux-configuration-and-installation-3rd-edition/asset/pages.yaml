- img_proc: true
  md: 'interesting enough for us to include on the second accompanying CD-ROM—and
    it should be interesting enough for you to look at if you''re all interested in
    Motif programming.


    In addition, you learned about the make command, which is used by many X Window
    applications for compiling on various operating systems.


    The Tcl/Tk combination allows you to create Motif-like interfaces through the
    use of a relatively easy-to-master scripting language. We provided an example
    script that throws a toolbar on the screen.


    Perl is a hot scripting language, made hotter by its widespread use on the Internet.
    But you should be able to take advantage of its many uses, even if you never go
    near the Internet.


    In what should come as a shock to no one, Linux features yet yet another command
    from the GNU Project, gawk, which is the functional equivalent of the awk programming
    language. Gawk works best on structured commands, although it does have extended
    programming capabilities.'
