  md: '# CHAPTER I: Linux and PC Hardware


    # Data-Acquisition Equipment


    Hardware used for data acquisition is not explicitly supported in Slack Linux,
    but you can grab software from the Linux Lab Project (ftp://koala.chemie.fu-berlin.de/pub/linux/LINUX-LAB/)
    to learn about the following devices: Analog Devices RTI-800/815 ADC/DAC board,
    CED 1401, DBCC CAMAC, IEEE-488 (GPIB, HPIB) boards, Keith DAS-1200, and National
    Instruments AT-MIO-16F / Lab-PC.


    # Miscellaneous


    If a device is connected to the SCSI card and Linux has no problems with the SCSI
    card, then you should have no problems with the device. This would include CDR,
    WORM, optical, and floptical drives. Additionally, we''ve heard complains with
    proprietary drives from the likes of SyQuest and Bernoulli.


    In addition, there are other miscellaneous devices that are definitely not supported
    by Slack Linux but have drivers available on the Internet. Our favorite is a driver
    for the Mattel Powerglove (ftp://sunsite.unc.edu/pub/linux/apps/linux-powerglove.tgz);
    why mess with a simple mouse when you can grab Linux by the throat to make it
    work? Other miscellaneous device drivers include support for the AIMS Labs RadioTrack
    FM radio card (ftp://sunsite.unc.edu/pub/linux/apps/sound/radiotrack-1.1.tgz),
    Maralu chip-card reader/writer (ftp://ftp.uni-koeln.de/pub/linux/chip/), Reveal
    Radio card (ftp://magoo.uwsuper.edu/pub/fn-radio/), and Videotext cards (ftp://sunsite.unc.edu/pub/linux/apps/video/videotext-0.5.tar.gz).


    # Dealing with Some Specific Systems


    The guidelines so far in this chapter pertain to components. However, the Linux
    community has found that some specific PC configurations have posed some challenges.'
  merge: -1
  pgno: 58
- img_proc: true
  md: '# 28 CHAPTER I: Linux and PC Hardware


    David Ludwig (davidl@hol-pc.org) has been compiling a list of user experiences
    with specific hardware configurations at http://www.hol-pc.org/~davidl/linux/desktop.config.html.
    This list is quite long and getting longer, so if you''re curious about someone
    else''s experiences with your computer, you may want to check out this database.
    Be warned, however, that many of the respondents to the survey just list generic
    information, not the names of specific models.


    ![](img/05da311512608405596dd882623b9142_59_0.png)


    # Compaq Deskpro XL


    If you''re into PC hardware at—and you probably are, if you''ve gotten this far—you''ll
    recognize how old the configuration for the Compaq Deskpro XL series is: a PCI/BISA
    system with an onboard AMD SCSI/ethernetchip (AMD799674), a Microsoft Sound-compatible
    audio system built around an AD1847, and a QVision 2000 graphics card with a Matrox
    Atlas chip and a Cirrus Logic PX2085 Ramdac.


    Unfortunately, the Deskpro XL series was pretty popular. Be warned that you may
    need to jump through some hoops to get Linux up and running; those who have done
    it say that you can get pretty about any support, and you may run into additional
    problems during installation.


    Because these details can be rather technical, we''re not going to describe them
    here, but we are including the appropriate HOWTO on the CD-ROM. You can check
    for an updated HOWTO at http://www-c724.uib.ac.at/XL/


    # Linux on Laptops


    Generally speaking, Linux should run fine on most laptops with enough horsepower—that
    is, the newer breed of 486- and Pentium-based laptops on the market, decked out
    with at least 8MBB of RAM. However, you may not be able to get the full functionality
    of the laptop when running Linux; for example, most laptops feature proprietary
    power-management and graphics capabilities that Linux simply can''t use. In these
    cases, you''ll lose the advanced power management, and you''ll need to run Linux
    and XFree86 in a lower graphics mode (VGA or SuperVGA).'
  merge: -1
  pgno: 59
- img_proc: true
  md: '# CHAPTER I: Linux and PC Hardware 29


    If you''ve spent any time at all in the laptop world, however, you know that each
    laptop model tends to be a little different when it comes to hardware and assorted
    gelegaws. The Linux world has found that some laptop models present challenges
    when it comes to installation and configuration. In this section, we''ll run down
    some of the more popular laptop models and the challenges faced when using Linux
    on them. Also, Table 1.5 lists (in abbreviated form) the results of the Linux
    Laptop Survey, where users from around the world reported on laptops that successfully
    ran Linux.


    The Linux Laptop Home Page (http://www.cs.utex.edu/users/kharker/linux-laptop/)
    contains additional information on laptops and Linux, including many additional
    sites that contain information about specific laptop models beyond what is covered.
    Some of the information here is gleaned from Web site, courtesy of Kenneth E.
    Harker (kharker@cs.utexas.edu), and some is from our personal experiences. If
    you own a laptop and want to know more about using Linux on it, the Linux Laptop
    Home Page is really the place to start.


    An alternative source of information is the Portables Web site, found at http://queequeeg.ifa.hawaii.edu/linux/portables.html.


    Many laptop users are using parallel-port SCSI adapters. However, most of these
    adapters are not yet supported by Linux. (Only the parallel-SCSI adapter for the
    omega ZIP drive is supported.)


    In Table 1.5, we list whether the laptop has power conservation that works with
    Linux. This isn''t necessarily APM; it could be proprietary hardware routines
    written into the laptop''s BIOS.'
  merge: -1
