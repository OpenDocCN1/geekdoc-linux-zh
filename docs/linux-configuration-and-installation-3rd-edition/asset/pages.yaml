- img_proc: true
  md: '# CHAPTER 3: Installing and Configuring XFree86


    +   - Run multiple shell windows (xterms) at once.

    - Control the size of each xterm window.

    - Control the fonts and colors used by the xterm program.

    - Copy and paste between xterm windows and other X programs.

    - Use a scrollbar to view program output that has scrolled.


    Even though it''s called xterm, the program isn''t really a terminal emulator;
    it provides you with a UNIX shell window.


    # Controlling the Size of the Xterm Window


    The simplest way to control the size of an xterm window is through the -geometry
    command-line parameter:


    ```

    gilbert:$ xterm -geometry WidthxHeight &

    ```


    With this parameter, the Width is the number of characters wide, almost 80, and
    the Height is the number of lines to use. We find that 40 is a good number (the
    default is 24 lines).


    Just about every X program supports the -geometry command-line parameter, but
    virtually every X program treats the -geometry command-line parameter differently
    from xterm (xterm is the main exception, in other words). While you specify the
    width and height in terms of characters with xterm, just about every other X program
    treats the -geometry as the size in pixels. This is important to note if you create
    some small windows.


    For example, the command to start xterm with 80 columns (the default) and 40 lines
    is:


    ```

    $ xterm -geometry 80x40 &

    ```


    With the -geometry command-line parameter you can also specify the starting location
    in pixels. The full syntax is:


    ```

    -geometry WidthxHeight+X+Y

    ```'
  merge: -1
  pgno: 182
- img_proc: true
  md: '# CHAPTER 3: Installing and Configuring XFree86


    In this case, X and Y specify the location of the upper-left corner of the program''s
    window in pixels. In X, the origin is also in the upper-left corner of the screen,
    so the following command creates an xterm window offset 10 pixels (both in X and
    Y) from the upper-left corner:


    ```

    gilbert/:$ xterm -geometry 80x40+10+10 &

    ```


    You can skip the size (width and height) or the location (x and y). The following
    are all valid commands:


    ```

    gilbert/:$ xterm -geometry 80x40 &

    gilbert/:$ xterm -geometry +10+10 &

    gilbert/:$ xterm &

    ```


    # Setting Up a Scrollbar for Xterm


    By default, xterm does not provide for a scrollbar, although one is available.
    You can use the -sb command-line parameter:


    ```

    gilbert/:$ xterm -sb &

    ```


    This creates a scrollbar in the xterm window (usually on the left side).

    The xterm scrollbar is kind of tricky. Use the middle mouse button to move to
    the position you want. The right mouse button (assuming you have a three-button
    mouse) moves back, while the left mouse button moves forwards. We almost always
    use the middle mouse button.


    In addition to the -sb command-line parameter, you can request a scrollbar for
    xterm in an X resource file.


    # X Resource Files


    Another topic under X that is different from the Windows and Macintosh environments
    is resource files. You''ll find that X resource files are either the savior or
    bane of your existence. Like the Windows and Macintosh systems, resource files
    on X allow you to customize fonts, colors, and text messages, all without access
    to the application''s source code.'
  merge: -1
  pgno: 183
- img_proc: true
  md: '# CHAPTER 3: Installing and Configuring XFree86 153


    This concept is great. You can tell an application to use a more readable font,
    you can get rid of garish colors, you can even write Finnish messages in all of
    the English ones, or you can fix up the English messages to something more to
    your liking.


    X resource files provide a powerful mechanism to customize just every Application.
    There are many locations–within a resource file and on disk–to which you can place
    these resources files. Because many options conflict, it''s easy to get lost in
    all the details.


    Stripped of its basics, an X resource file is an ASCII text file that specifies
    some option for a program or programs. Each line of the resource file specifies
    a resource to set and its value. For example, you can specify in an X resource
    file that all xterm programs should start up with the scrollbar turned on, which
    we will show how to do so. You can also control fonts, and a lot of the text displayed
    by most X programs.


    To set up the XTerm commands for xterm in a resource file, create a file named
    XTerm (note the capitalization) in your home directory. The file name, XTerm,
    and the location (your home directory) are essential. Put in the following lines:


    ```

    XTerm*scrollBar: True

    XTerm*saveLines: 1000

    ```


    These X resource commands tell xterm to use a scrollbar and save 1000 lines in
    its scroll buffer. Save this file and start another xterm program. You should
    see a scrollbar.


    For more on X resource files, see the book list in Appendix A.


    # Controlling Fonts and Colors


    Like most options, you can control xterm’s choice of fonts and colors from both
    command-line parameters and X resource files. What we usually do is set up the
    options we always want in an X resource file and then use the command-line parameters
    only for options we rarely need.


    Normally, we’re happy with xterm’s color defaults: black text on a white background.
    It’s the font we’d like to change. By default, xterm uses the font named fixed,
    a fixed-character-size font (as opposed to a'
  merge: -1
  pgno: 184
- img_proc: true
  md: '# CHAPTER 3: Installing and Configuring XFree86


    proportional font). We find this font far too small, so we''d like to use a larger
    one.


    For setting the font, you can use the -font command-line parameter or set the
    font resource. To the latter, you can add the following line to the XTerm file
    you created:


    ```

    XTerm*font: *-courier-medium-r-normal--14-140-75-75-m-90-*

    ```


    This sets up a much more pleasing (to our eyes at least) and larger font for xterm.


    To get a list of the available fonts, use the program xlsfonts, which will present
    you with a huge list. For xterm, you want a fixed-width font. The Courier fonts
    typically are fixed-width, as are the Lucida typewriter fonts. In the very long
    font names, the fixed-width fonts should have an m or c, as shown here, after
    the two 75s:


    ```

    -adobe-courier-medium-r-normal--14-140-75-75-m-90-iso88259-1

    ```


    As usual, to test this, save the XTerm file and start another xterm program.


    For our XTerm file, we set the following resources:


    ```

    !

    !

    XTerm resource file

    !

    XTerm*foreground: black

    XTerm*cursorColor: black

    XTerm*background: white

    XTerm*scrollBar: True

    XTerm*saveLines: 1000

    XTerm*font: *-courier-medium-r-normal--14-140-75-75-m-90-*-

    ```


    Lines beginning with an exclamation mark (!) are comments. We list the most-used
    xterm command-line parameters in Table 3.15.'
