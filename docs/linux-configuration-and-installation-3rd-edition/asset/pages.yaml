  md: '# Choosing the Disk Sets to Install


    Now comes the fun part: choosing the software you want to install.


    True to its roots as a diskette-based operating system, Linux divides software
    into disk sets. Each disk set is uniquely named and corresponds to a specific
    part of the operating system. For example, the A series contains the core of Linux,
    and its installation is mandatory.


    The setup program divides disk sets and the software within mandatory and optional
    installations. Some of the elements of Linux, such as the aforementioned A series,
    is mandatory. Other installations, such as terminal packages, are optional. During
    the installation process, Linux will automatically install the mandatory packages
    and will prompt you before installing the optional packages.


    > There is a way to override this, as will be explained later in this section.


    ![](img/05da311512608405596dd882623b9142_106_0.png)


    During the initial menu menu entitled Series Selection, you''ll be presented with
    a list of the disk sets and a short explanation of what is contained on them.
    Generally speaking, you won''t want to install all the disk sets, as there are
    some disk sets that overlap and their coexistence on the hard drive is not wise
    (particularly when it comes to development tools). In addition, you don''t want
    to waste the hard disk space needed for a full installation—you really need three
    or four text editors, multiple text-formatting packages, and a slew of fonts which
    you will never use? Choose the software that you''re likely to use. You can always
    run the setup program again and install additional disk sets in the future.


    > Technically speaking, that''s all that''s needed for a minimal installation
    of Linux is the A disk set.


    ![](img/05da311512608405596dd882623b9142_106_1.png)


    The full set of disk sets is listed in Table 2.6.'
  merge: -1
  pgno: 106
