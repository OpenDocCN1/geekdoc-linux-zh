    of the Internet, is best known for electronic-mail and newsgroup distribution.


    Thousands of computers are linked—worldwide—in the loose network we call the Usenet,
    a public network of linked UNIX and non-UNIX machines, dedicated to sending information
    to companies, schools, universities, the government, research laboratories, and
    individuals. Some of these links occur over phone lines and use the uucp command
    to send messages back and forth, but most links nowadays over the Internet, using
    the NNTP, or Network News Transfer Protocol, to send messages between machines.
    No matter how the messages get passed around, you can read them the same way.


    The Usenet performs a variety of services, but perhaps the most popular service
    involves newsgroups. A newsgroup is a discussion of various topics, ranging from
    computing to sociology to boomerangs to Barney the Dinosaur. In fact, there are
    thousands of Usenet newsgroups. Some are trivial and a waste of bandwidth, others
    are of interest to only a small set of users, and others would interest a host
    of users. (Take a gander at alt.sex.bestiality.barney, and you''ll see the validity
    of this point.)


