    # Virtual Terminals


    Linux allows you to be in more one place at a time, with the notion of virtual
    terminals. UNIX, inherently, supports multiple users on a system at any given
    time. A virtual terminal allows you to login more than once on a Linux box. While
    this may not be something you would normally do, there may be times when it will
    come in handy; for example, Chapter 6 will outline a time when it''s convenient
    to login as another user using the X Window System in order to kill some errant
    processes. While doing this, you will still be logged in the initial terminal.


    To move between virtual terminals, you type Alt-Fn, where Fn is the function key
    associated with the terminal. (It is not the Fn found on most laptops. On laptops,
    the Fn key is used basically as a Shift key for the function keys.) The initial
    login to a Linux system is always associated with the F1 function key, so any
    additional logins will begin with the F2 key.


    When you''re finished in the virtual terminal, you should logout with the following
    command:


    ```

    logout

    ```'
