  md: '# CHAPTER I: Linux and PC Hardware


    # Graphics Card


    Dealing with a graphics card has been one of the most problematic areas of Linux—or
    rather, of XFree86, which serves as the X Window System graphical interface to
    Linux. XFree86 deals directly with the graphics card and must know everything
    about the card in a configuration file (such as the amount of RAM, the chipset
    features, and what modes it supports), putting more stress on you than the average
    software. Chapter 3 details how to configure XFree86, and in almost every respect
    this will be the most daunting task you will face as a budding Linux user.


    # Controllers


    If you''re a DOS/Windows user, you''re probably not tuned into what sort of controller
    your computer features, because DOS and Windows are pretty tolerant of almost
    any PC controller.

    nThis isn''t the case with Linux, which works directly with a PC controller and
    needs to really support it. In this next section, we''ll run down the controllers
    supported by Slack Linux. There''s a domino effect to the controller compatibility:
    if Linux doesn''t recognize the controller, it won''t recognize anything connected
    to the controller. And most of us have many goodies connected to the controller,
    including hard drives, CD-ROM drives, and scanners.


    # Hard-Drive Controllers


    Unlike PC-based Unices, Linux isn''t too fussy about the hard disk or hard disks
    it supports; basically, if a hard disk is supported by a PC''s BIOS, it will work
    fine under Linux. This goes for IDE, EIDE, MFM, RLL, ESDI (with controllers that
    emulate the ST-506 interface, that is), and most SCSI interfaces. In fact, the
    following Enhanced IDE (EIDE) interfaces are explicitly supported, even on systems
    with up to two IDE interfaces and up to four hard drives and/ CD-ROM drives:'
  merge: -1
  pgno: 42
