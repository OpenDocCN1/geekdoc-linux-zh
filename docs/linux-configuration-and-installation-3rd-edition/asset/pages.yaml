    # Changing the ls Colors


    Although we can''t show you, ls does indeed display different types of files in
    different colors. While you probably don''t want to change these colors, Linux
    gives you the ability to do so. (Indeed, Linux gives you the ability to do great
    many things you''ll probably never bother to, but thanks to the credit of the
    people who put Linux together.) The settings for these colors are stored in the
    file /etc/DIR_COLORS, and this file is used by all users. If you want to change
    these settings, you need to copy this file to your home directory, rename the
    file .dir_colors (making it a hidden file), and edit the listings in it. With
    many of the configuration files used with Linux, there''s enough comments in the
    default /etc/DIR_COLORS to guide you through any editing session.


    # Wildcards


    Like UNIX (and for that matter), Linux supports wildcards in command lines and
    shell scripts. A wildcard is merely shorthand for a character or a string of characters.
    Wildcards can come in handy if you''re looking for a file and you''ve forgotten
    the specific filename (geez, I know the file ends in 1996), or if you want to
    see a list of files that fall within specific parameters (such as ending with
    .c, useful if you plan on using Linux for software development).


    There are three types of Linux wildcards: *, ?, and [...]. Each will be explained.


    Technically, wildcards are the province of the shell, and in theory a discussion
    of wildcards should take place with a discussion of shells. For our purposes,
    however, we''re going to discuss wildcards at this point in the Linux discussion,
    because what we''re saying here applies to all shells.


    > NOTE'
