    # Making Script Files for Tcl


    You can put together a set of Tcl commands into a script file, just like C and
    Bourne shells. The program to execute the script is again wish. The following
    script assumes that wish is located in /usr/bin (as it is for Linux).


    To turn our first example into a working script, we do the following:


    ```

    #!/usr/bin/wish


    # example1.tcl


    # Create a button.

    button .bl \\

    -text "My first button" \\

    -command { exit }


    pack .bl


    # example1.tcl

    ```


    To show you more of a flavor of Tcl scripting, we put together the following file.
    In it, Tcl commands create a set of buttons that allow you to launch useful Linux
    programs like xman and xterm. The toolbar appears at the bottom of the screen
    and uses the override-redirect mode that prevents a window manager from placing
    a title bar over the window. Also, in honor of Windows 95, we place the current
    time at the end of the toolbar.


    In our script, we create a number of procedures, called procs in Tcl. The exec_cmd
    procedure executes a text string as a UNIX command. We use the eval statement
    to deal with text-string issues and evaluate any Tcl variables within the command.
    Try this Tcl script without the eval in'
