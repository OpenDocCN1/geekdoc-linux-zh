    # Combining the Graphics Card with the Monitor to Make a Working X Setup


    The Screen section connects a monitor with a graphics card. Your XF86Config file
    may have multiple Devices and Monitors defined. It is the Screen section that
    connects the two.


    A complicated Screen section can look something like:


    +   Section "Screen"

