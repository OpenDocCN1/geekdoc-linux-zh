    # Programmer''s Tools


    In addition to the basic compiler, Linux comes with many utility programs and
    tools to make programming easier. The first and foremost tool is a program called
    make.


    # Building Programs with Make


    Most C programs require more than one c of source code. When one of these files
    changes, at least one (and maybe more) of the files must get recompiled to have
    the executable program reflect the changes. Tending to be lazy, programmers don''t
    want to recompile all the files if just one changed. Furthermore, these lazy programmers
    don''t want to keep track of all the files that changed. This is where the tool
    make comes in.'
  merge: -1
  pgno: 487
- img_proc: true
  md: '# CHAPTER 10: Programming in Linux 457


    Make is a command that helps build or “make” UNIX programs from the C language
    source code files. make uses a set of rules, stored in a file called Makefile,
    to tell the most efficient way to rebuild a program. You keep a Makefile in each
    directory where you develop C programs.


    The Makefile contains a set of rules, using a rigid syntax, describe how to build
    the program. Most of the rules declare which parts of the program depend on other
    parts. Using these dependency rules, make determines what has changed (based on
    the file modified date) and what other things depend on the file or files that
    changed. Then make executes the commands in the Makefile to build each thing that
    needs to be rebuilt.


    The basic Makefile syntax is deceptively simple. (Linux includes the GNU make
    program, which accepts a number of rule shortcuts. For this chapter, we’ll just
    cover the basics. Use the man make command to find out about make.)


    You start with a so-called target. The target is something you want to build,
    such as our program chap10 from the earlier example.


    To create a target in the Makefile, begin with a new line and name the target—what
    you want to build—then place a colon (:) and a tab, and then list the files the
    target depends on. Starting on the next line, begin with a tab, then place the
    UNIX command used to build the target. You can have multiple commands, each of
    which should go on its own line, and every command must start with a tab.


    In the abstract, the Makefile rules look like the following:


    ```

    what_to_build:    what_it_depends_on

    command1_to_build_it

    command2_to_build_it

    command3_to_build_it

    ...

    lastcommand_to_build_it

    ```


    In the abstract, this looks confusing. Here’s a more concrete example, using the
    chap10 program we provided earlier.


    The target we want to build is the chap10 program. The chap10 program (the target)
    depends on the object module chap10.o. Once we'
  merge: -1
