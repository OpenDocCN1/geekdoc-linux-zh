    # Using Tar


    As noted, the gzip command doesn''t work with a set of files; it works only on
    a single specified file. If you want to compress a set of files, you''ll first
    need to create an archive of files and then compress the archive. The UNIX/Linux
    tar (tape archive) command does just this. It merely combines the files and retains
    the directory structure in one large archive.


    Tar doesn''t actually compress any files in the archive. Again, if you''re wandering
    around the Internet and various FTP sites, you''ll probably run into files that
    end with tar.gz; this means that a set of files has been archived with tar and
    compressed with gzip. If you decide to do system backups—which we strongly advise
    you to do—the tar command is the first step in creating that archive.


    The tar command is somewhat involved; it''s not difficult to use, but its options
    tend to be obscure. However a few examples of tar in action should clear things
    up for you.


    Let''s say you want to back up all the files in an important directory—/home/patrick—to
    make sure your work isn''t lost to the world. Before you use tar, make sure your
    current directory is /home/patrick and then use the following command line to
    back up the contents of the directory:


    ```

    gilbert:~/tar cvf archive.tar .

    ```'
  merge: -1
  pgno: 334
- img_proc: true
  md: '# 304 CHAPTER 5: Linux Applications


    This command line will create an archived file named archive.tar in the current
    directory, through the use of the following functions and options:


    +   - c, which creates the archive file.

    - v, which tells tar to be verbose (that is, to report on the files being archived)
    as it archives the contents of the directory.

    - f, which specifies that archive.tar is the filename of the archive.


    It doesn''t matter what order the functions and options are in; older versions
    of tar required that a function immediately follow the command in the command
    line, but the version of tar that ships with Linux lacks such requirement. It''s
    usually a good idea to put f as your final option, because this is where you specify
    a filename.


    Tar also leaves the existing files in the directory intact (unlike gzip, which
    removes the original file). Tar doesn''t require a hyphen (-) before functions
    and options. You can use one if you please; it won''t cause any effect to the
    command line.


    The command line ends with a period (.), which tells tar to use all the contents
    of the current directory as input for the archive file. (tar will also archive
    hidden files.) You can also use tar with wildcards (using c*) instead of. at the
    end of the command line would archive all files in the current directory beginning
    with c). In addition, you can specify a directory to be archived, giving either
    a pathname (home/patrick) or a pathname relative to the current directory (for
    instance, you can specify patrick if the current directory is /home). However
    you cannot use absolute filenames to create an archive; tar will remove the leading
    slash (/) from the pathname to make sure that important files aren''t overwritten
    when the file is unarchived. (You''ll see why later in this section.) When you
    specify a directory to be archived, tar will also archive any subdirectories and
    maintain the directory structure. In fact, it''s considered good practice to create
    a subdirectory specifically for the archived material; in that way, users won''t
    have problems when unarchiving your materials on their systems.


    After you run tar, you end up with another Linux file subject to the same rules
    that all Linux files must follow. You could copy this file to a floppy disk or
    to another directory in the Linux system, you could


    ![](img/05da311512608405596dd882623b9142_335_0.png)'
  merge: -1
  pgno: 335
- img_proc: true
  md: '# CHAPTER 5: Linux Applications 305


    save it to a tape drive or recordable CD-ROM drive, or you could compress it using
    gzip (as explained earlier in this chapter). Because all UNIX users have access
    to the tar command, you can pass the file along to other users and know that they
    can unarchive your archive. In addition, there are versions of tar for the MS-DOS
    and Macintosh operating systems, so your archive can be used by most computer
    users.


    # Functions and Options


    When we used tar in the previous section, we specified cvf on the command line.
    This bears further explanation.


    Tar requires the use of functions and options on the command line. If you enter
    a command line lacking a function, tar will report an error. In our sample command
    line, we used c as the obligatory function, following it with the optional v and
    f options.


    Important functions and options are listed in Tables 5.11 and 5.12. We present
    them in case you need some of the more obscure functions; for the most part, the
    only functions you''ll use are c, x, and t.


    # Table 5.11 Important Functions in Tar


    | Function | Result |

    |---|---|

    | A | Appends files to an existing archive. |

    | c | Creates a new archive. |

    | d | Compares existing files in the filesystem to the files in the archive, making
    sure that no existing files are overwritten. |

    | r | Appends specified files to the end of an existing archive. |

    | t | Lists of the contents of an existing archive. |

    | u | Updates files in the filesystem if the archive contains newer versions.
    |

    | x | Extracts files and directories from the archive. |'
  merge: -1
  pgno: 336
- img_proc: true
  md: '# 306 CHAPTER 5: Linux Applications


    | Table 5.12 Important Options in Tar |

    | Function | Result |

    |---|---|n| f filename | Specifies a filename for the archive. |

    | k | Keeps existing files. |

    | M | Creates a multvolume archive. |

    | v | Works in verbose mode, which means tar lists the files being archived or
    unarchived; we always use this option to make sure tar is really archiving the
    files we want archived. |

    | z | Zips a file (using gzip) while creating the archive (this option will be
    explained later in this chapter). |


    These are the major functions and options for tar, but there are many others that
    apply to other situations. For a full list of the functions and options for the
    GNU version of tar, use the following command line:


