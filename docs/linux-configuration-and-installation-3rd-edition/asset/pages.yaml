    ```


    Your numbers will undoubtedly be different. The point here is that **fdisk** automatically
    lists the first unassigned cylinder here (in this case, it was cylinder 64), and
    you should go with that.

    You''ll be asked how large you want to make the partition:


    ```

    Last cylinder or +size or +sizeM or +sizeK (64-1010): +10M

    ```


    Because we''re not into figuring out how many cylinders or kilobytes it would
    take to make up 10 megabytes, we use the easy way out and specify 10 megabytes
    directly as **+10M**.


    ![](img/05da311512608405596dd882623b9142_98_0.png)


    > This won''t apply to most users, Linux doesn''t do very well if it''s installed
