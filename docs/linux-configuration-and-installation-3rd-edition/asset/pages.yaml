  md: "# CHAPTER 8: Linux Networking 399\n\n# Setting up TCP/IP Information\n\nThe\
    \ files that control TCP/IP configuration are stored in the /etc directory. When\
    \ you first set up Linux and are asked about machine names and domain names, this\
    \ information is sent to the /etc/hosts file. While you don't need to mess with\
    \ this file if you're connected to the Internet (it does many of the same things\
