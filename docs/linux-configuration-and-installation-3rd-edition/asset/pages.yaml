  md: '# 116 CHAPTER 3: Installing and Configuring XFree86


    Most commercial UNIX systems run mwm, the Motif window manager, or a close variant.
    You''ll find this on workstations from Hewlett-Packard, SCO, IBM, Silicon Graphics,
    and even Sun Microsystems (with the Common Desktop Environment). Because mwm (and
    the rest of Motif, including the programming libraries) is a commercial product,
    you won''t see mwm on Linux unless you purchase it separately (Appendix A for
    details). Because something different on Linux, this may make getting used to
    Linux harder, especially if you work on other UNIX systems. Because of this common
    problem, we''ll show you how to configure fw, the default window manager on Linux,
    to look and act more like the Motif window manager, to help make you feel at home
    on Linux. See the section "Toward a Motif-Like Look and Feel" later in this chapter
    for the details.


    # X on Linux


    X is very hardware-dependent. In the UNIX workstation world, you don''t see many
    problems with this, because the UNIX vendors maintain tight control over the hardware
    and do the hard work of supporting X for that hardware.


    The PC realm, though, is different. You have zillions of vendors and a huge number
    of combinations of various graphics cards, monitors, buses even lowly mice. So,
    as we''ll repeat again and again, you need to know the intimate details of your
    hardware in order to get the X Window System up and running. If you''re used to
    the UNIX workstation world, this will come as a rude surprise. If you''ve already
    charted Chapters 1 and 2 of this book, it will be of a surprise.


    X on Linux is actually in the form of XFree86, a public project devoted to bringing
    X Window to PC-based Unices. While there are some changes between a straight X
    Window System installation on a workstation and XFree86, you probably won''t notice
    these differences.


    # How XFree86 Works


    Remember that X is both the X server (also named X) and a number of X application
    programs (also called clients). To get X going, you must first start the X server
    and then start a number of X applications. Almost always, one of these X applications
    will be a window manager.'
