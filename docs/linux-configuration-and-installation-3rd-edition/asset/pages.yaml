    # Other Specific Models


    Just because Linux will run on any laptop doesn''t mean that you can take full
    advantage of the laptop''s hardware features. Many dedicated Linux users have
    taken the challenge of making Linux work on their quirky laptops, and they''ve
    been gracious enough to share their solutions with the rest of the Linux community.
    We briefly run down some specific laptop models and how Linux was made to work
    on them. If there''s a FAQ mentioned here, we''ve included it on the accompanying
    CD-ROMs.


    You cannot extrapolate from the specific models presented here. The laptop world
    isn''t known for consistency among product lines, and what may be true of a specific
    model may not be true for that model''s second cousin. Use the information presented
    here for the specific model, unless the information explicity covers a wide range
    of models (as is the case with the IBM ThinkPad information).


    # AST 900N


    Basically, there are no major challenges with installing Linux on this laptop
    model, but there are some pitfalls. A HOWTO on installing Linux on the AST 900N
    is included on the CD-ROM.'
