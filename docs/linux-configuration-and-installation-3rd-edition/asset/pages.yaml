  md: '# CHAPTER 3: Installing and Configuring XFree86 155


    Table 3.15 Commonly Used Xterm Command-Line Parameters


    | Parameter | Meaning |

    |---|---|

    |-bg color | Sets background color; defaults to white |

    |-cr color | Sets color of text cursor; defaults to black |

    |-display hostname:0 | Sets name of X display to which to connect |

    |-e program [args] | Runs program instead of shell |

    |-fg color | Sets foreground color; defaults to black |

    |-fn fontname | Uses the given font |

    |-font fontname | Uses the given font |

    |-geometry geom | Uses given size and location |

    |-ls | Turns shell into login shell |

    |-sb | Turns on scrollbar |


    # Copying and Pasting between xterm Windows


    One of the best benefits of xterm over the console terminal is that you can copy
    and paste text between xterm windows. This is very handy if you edit documents.
    You can view one document in one xterm window and edit another in a different
    xterm window, copying and pasting between the two.


    Xterm is highly configurable, but in the default configuration, you select text
    by holding down the left mouse button and dragging over the text you select. Double-clicking
    over a word selects just that that word. Triple-clicking anywhere in a line selects
    the entire line.


    To paste, press the middle mouse button. The text will be inserted, just as you
    typed it.


    Xterm just presents a shell window. Inside the xterm window, you run text-based
    shell programs, few of which know anything about the mouse and selecting text.
    Therefore, you have to ensure that the program you run within the xterm window
    is ready for the pasted text. In the elvis text editor, for example, you should
    enter input mode by typing i in command mode.'
  merge: -1
  pgno: 186
- img_proc: true
  md: '# CHAPTER 3: Installing and Configuring XFree86


    Elvis does not support middle-mouse button pastes, which is very annoying. To
    paste in elvis, you must hold down the Shift key while you press the middle mouse
    button.


    ![](img/05da311512608405596dd882623b9142_187_0.png)


    Our fix is to use a different vi clone that comes with Linux, called vim. Vim
    fully supports mouse pasting in xterm windows without the hassle of elvis.


    # Other Shell Window Programs


    In addition to the ubiquitous xterm, Linux ships with a few other shell programs,
    including color_xterm, rxvt, and shelltool.


    If you want a shell with color, use color_xterm. This program acts just like xterm,
    but it presents a lot more color. For example, when you make a directory listing
    with ls, color_xterm presents directories in one color and ordinary files in another.


    the rxvt program is very similar to xterm. Many claim that rxvt uses a smaller
    memory footprint than xterm, but we find its quirks aren''t worth the difference
    (particularly with Linux shared libraries, which reduce xterm''s memory footprint
    to a reasonable level).


    If you Open Look applications on a Sun system, you will find yourself right at
    home with shelltool, found in /usr/openwin/bin.


    You must have loaded the Look applications when you installed Linux to have this
    program. We recommend you install these programs, which also include the olwm
    and olvm window managers.


    All in all, we tend to use only xterm instead of other shell window programs,
    because xterm remains constant on all the UNIX systems we use, at home and at
    work.


    # Starting X Automatically at Boot-Up and Creating an X Login Screen


    Up to now, we''ve been running startx to begin an X session. You will need to
    login at the console and start X yourself (or use the automatic method we describe).
    In addition to this set up an X login screen, using XDM. XDM stands for the X
    Display Manager; it is a means to control an X session. As such, XDM is generally
    nicer to the user, as it automatically starts the X server and presents graphical
    login window, like the one shown in Figure 3.7.'
  merge: -1
  pgno: 187
- img_proc: true
  md: '# CHAPTER 3: Installing and Configuring XFree6 157


    ![](img/05da311512608405596dd882623b9142_188_0.png)


    **Figure 3.7** A graphical login window.


    The X Display Manager is run from a program called xdm. While xdm takes a little
    getting used to it, we like it better than the startx/xinit we''ve been running
    so far. This is because startx (which runs xinit) requires you to log in to a
    text screen and then start up X (via startx). **Xdm** allows you to log directly
    into an X session.


    **Xdm** allows one program to control your workstation''s console and a number
    of X terminals. If you''re interested in this, look in Appendix A for books that
    cover **xdm.**


    To set up **xdm**, you need to edit at least one system file, a key file when
    booting Linux; this is a *serious endeavor*. *Always* back up any system file
    before you edit it.


    # UNIX Run-Levels


    **Xdm** is usually set to trigger what is called a *run-level*. With a few exceptions,
    run-levels in UNIX is an arbitrary concept that mostly follows ancient UNIX traditions.
    The run-level S implies a single-user stand-alone system.


    In Linux, run-level 1 and higher are multiuser. This means more than one user
    is allowed to login. On many systems, run-level 3 starts networking. This is also
    the default Linux run-level. Linux has special run-levels for power-fail (which
    shuts the system down) and the Vulcan death-grip (Ctrl-Alt-Backspace).'
  merge: -1
  pgno: 188
- img_proc: true
  md: '# CHAPTER 3: Installing and Configuring XFree86


    You can get some ideas about run-levels by looking in the /etc/inittab file. in
    /etc/inittab, one of the first entries will be something like the following:


    ```

    # Default runlevel.

    id:3:initdefault:

    ```


    ![](img/05da311512608405596dd882623b9142_189_0.png)


    In Slackware 2.3 (and the first edition of this book), the Linux default run-level
    was 5. The default X run-level was 6. It has changed to 3 and 4, respectively.
    Now, run-level 6 will reboot the system, a great surprise if you want it to run
    X.


    This states that the default system run-level is 3. When Linux boots up, it will
    boot into run-level 3. Later in the /etc/inittab file, you''ll find something
    like:


    ```

    x1:4:wait:/etc/rc.d/rc.4

    ```


    This states that on entry to run-level 4, /etc/rc.d/rc.4 should be run. This file,
    then, starts up the system, /etc/rc.d/rc.4 starts the following program:

    on our the X Display Manager, which presents an X login screen.


    ```

    # Tell the viewers what''s going to happen...

    echo "Starting up the X Window System V.11 R.6..."


    # Call the xdm program.

    exec /usr/X11R/bin/xdm-nodaemon

    ```


    This is what starts up xdm. To get xdm up and running, all you should really have
    to edit the /etc/inittab as root and change the following line:


    ```

    id:3:initdefault:

    ```


    to


    ```

    id:4:initdefault:

    ```'
  merge: -1
  pgno: 189
- img_proc: true
  md: '# CHAPTER 3: Installing and Configuring XFree86 159


    That''s it. Everything else comes preconfigured. You may want to change the configuration,
    but you have a good start.


    After making these changes, when you next boot Linux, you''ll boot into run-level
    4 rather than run-level 3. The process of going into run-level 4 will start xdm,
    because of what''s in the /etc/rc.4 file.


    Before doing this, make a copy of /etc/inittab. You also should test xdm before
    setting the system to boot it, because you always want to be able to boot Linux.
    (Making a mistake in /etc/inittab can result in a Linux that won''t boot.) To
    test xdm, you can type in the following command as root, to change to run-level
    4 now:


    ```

    # init 4

    ```


    This will jump you to run-level 4. Be patient; this command takes a while.

    Be sure that X is not running when you do this. You should be logged in as root
    at the console.


    If you set your .login or .profile file to automatically call start when you login
    (see "Starting X Automatically on Login") later), you must disable this. These
    two methods for starting X conflict. Quit X and then comment out those lines you
    added to the .login or .profile file, example:


    ```

