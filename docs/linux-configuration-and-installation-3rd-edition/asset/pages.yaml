    # Xlock


    The xlock command locks your system until a correct password is entered. For those
    who are into security, this gives you a tool to keep others from accessing your
    system when you step away. Be careful, however, that you don''t accidentally invoke
    xlock and forget your password.


    # Xmag


    The xmag command (as summoned from an xterm window or an fwm menu) is used to
    magnify a portion of the screen, as shown in Figure 5.20.


    ![](img/05da311512608405596dd882623b9142_358_0.png)


    Figure 5.20 Magnifying a portion of the screen with xmag.'
