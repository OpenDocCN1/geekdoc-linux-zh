  md: '# CHAPTER 3: Installing and Configuring XFree86


    documentation into your XF86Config file, the master file that describes your hardware
    to X.


    Normally located in /usr/X11R6/lib/X11, the XF86 Config is an ASCII text file,
    formatted in a special way that the XFree86 X server understands. By default,
    XFree86 searches for this file in a number of directories, in the following order:


    ```

    /etc/XF86Config

    <Root>/lib/X11/XF86Config.hostname

    <Root>/lib/X11/XF86Config

    ```


    The <Root> is shorthand for the top-level X directory. In Slack Linux this is
    /usr/X11R6. Previous to release 6 of X11 (hence the X11R6), XFree86''s config
    directory was /usr/X386.


    You can create the XF86Config file with a text editor such as vi or emacs. In
    most cases, though, you''ll want to copy an example file to avoid the whole thing.
    Undering, this example file is named XF86Config.eg. While this example is not
    ready to go, you can get a lot of useful information out of it. (See the section
    on Super VGA.)


    In the XF86Config file, each section follows the same basic pattern:


    ```

    Section "SectionName"

    data entry...

    ...

    EndSection

    ```


    The # acts as a comment character, which is very useful in documenting the odd
    syntax in the XF86Config file.


    In the next sections of this chapter, we''ll cover these six sections in depth
    and show how you can automate part of the process using a program called xf86config.


    > Never use someone else''s XF86Config file. And don''t use the examples provide
    verbatim. Always configure X for your hardware. Wrong data in the file may cause
    X to damage your hardware.


    ![](img/05da311512608405596dd882623b9142_157_0.png)'
  merge: -1
