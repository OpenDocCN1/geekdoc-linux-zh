  md: '# CHAPTER 7: Linux and Telecommunications


    How you actually use these commands will partially depend on the remote host,
    of course; some hosts, especially UNIX-based ones, require that you first start
    rz on the remote host and then run sz locally if you want to upload a file. Other
    hosts, particularly PC-based ones, have their own methods for handling a file
