    # Gawk


    Developed by three Bell Labs researchers (Alfred Aho, Peter Weinberger, and Brian
    Kernighan—the acronym *awk*, *awk* is a programming language with some strong
    similarities to the C programming language, discussed earlier in this chapter)
    but is used in the much same manner as other UNIX scripting tools. Its inclusion
    in this chapter.


    Technically speaking, *awk* doesn''t ship with Linux; instead, the GNU version,
    *gawk*, ships with Linux. (By now you shouldn''t be surprised that Linux features
    software from the GNU Project.) Because *gawk* is virtually identical to other
    implementations of *awk* (where there are a few extensions to *awk* in *gawk*,
    but you can ignore them if you choose), most users with the structure of *awk*
    will have no problems with *awk*.


    **Gawk''s** primary value is in the manipulation of structured text files, where
    information is stored in columnar form and is separated by consistent characters
    (such as tabs or spaces). **Gawk** takes these structured files and manipulates
    them through editing, sorting, and searching.


    Let''s use a data file named **workers** as an example:


    | | | | | |

    |---|---|---|---||

    | Eric | 286 | 555-6674 | erc | 8 |

    | Geisha | 280 | 555-4221 | geisha | 10 |

    | Kevin | 279 | 555-1112 | kevin | 2 |

    | Tom | 284 | 555-2121 | spike | 12 |


    Let''s sink into the trap of abstraction and compare our example file output to
    a two-dimensional graph. Each row is called a *record*, which in turn is made
    up of vertical fields or columns, almost like a database. **Gawk** allows us to
    manipulate the data in the file by either row or column. Using the *gawk* command
    is not a complicated process. The structure of the *gawk* command looks like:


    ```

    $ gawk [option] ''pattern (action)''

    ```'
  merge: -1
  pgno: 508
- img_proc: true
  md: '# 478 CHAPTER 10: Programming in Linux


    (The only options available with gawk -F, which allows you to specify a field
    separator other than the default of white space; -f, which allows you to specify
    a filename full of gawk commands instead of placing a complex pattern and action
    on the Linux command line, and -W, which runs gawk in total compatibility with
    awk.) Here we should define our terms. A pattern can be an ASCII string (which
    gawk treats numerically; instead of seeing the character e as an e, it sees it
    as the ASCII equivalent), a numeral, a combination of numerals, or a wildcard,
    while action refers to an instruction we provide. Essentially, gawk works by having
    us it to search for a particular pattern; when it has found pattern, gawk is to
    do something with it, such as printing the pattern to another file.


    The simplest gawk program merely prints out all lines in the file:


    ```

    gilbert:$ gawk ''{ print }'' workers

    Eric 286 555-6674 erc 8

    Geisha 280 555-4221 geisha 10

    Kevin 279 555-1112 kevin 2

    Tom 284 555-2121 spike 12

    ```


    Continuing our example, let''s say we want to pull all records that began with
    the string geisha. We''d use the following:


    ```

    gilbert:$ gawk ''$1 ~ /Geisha/ {print $0}'' workers

    ```


    Here''s what the command means, part by part:


    +   - $1: Tells gawk to use the first column for the basis of further action.
    gawk will perform some action on a file based on either records or fields; a number
    beginning with a s tells gawk to work on a specific field. In this case, $1 refers
    to the first field.

    - #: Tells gawk to match the following string.

    - /Geisha/: The string to search for.

    - {print $0}: Tells gawk to print out the entire record containing the matched
    string. A special use of the $ sign is with the character 0, which tells gawk
    to use all the fields possible.

    - workers: The file to use.'
