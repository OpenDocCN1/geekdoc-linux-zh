  md: '# Section III


    # Linux Communications and Networking


    No operating system is an island, which is why Linux contains so many tools for
    dealing with the outside world.


    Chapter 7 covers serial telecommunications tools such as seyon and minicom, which
    allow you to dial into online services and bulletin-board systems.


    Chapter 8 covers Linux TCP/IP. As any good UNIX does, Linux has TCP/IP networking
    built in. Chapter 8 contains an overview of TCP/IP networking.


    Chapter 9 covers the Internet in all its glory. Linux owes a lot to the Internet,
    and you''ll find that a connection to the Internet is one of the most valuable
    things you can have as a Linux user.'
