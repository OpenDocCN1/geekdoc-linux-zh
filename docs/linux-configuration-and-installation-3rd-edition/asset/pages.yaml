  md: '198 CHAPTER 4: Basic Linux Tools


    # # Linux Tools


    Because it''s a UNIXlikealike, you''d expect Linux to toe the line when it comes
    to UNIX design philosophy and user tools. Design philosophy? UNIX can be seen
    as a collection of tools, some more important than others. Because UNIX (and Linux,
    for that matter) originally evolved through the contributions of a widespread
    computing community, UNIX tools tend to spring up in response to specific situations:
    When a problem needed to be solved, either a new command was added or more options
    were added to old commands.


    This tool-based approach is what gives UNIX of its perceived complexity. Compared
    to Microsoft Windows and the Macintosh operating system, the use of UNIX tools
    like vi and ls seem to be fairly archaic and unintuitive. For the outsider, they
    are.


    But once you spend some time with UNIX and its command structure, there''s a great
    deal of logic underlying the UNIX operating system—and by extension, the Linux
    operating system. Once you''ve mastered a few Linux commands, you can move on
    to more complex command lines and more complex computing chores. We''ll begin
    this chapter with a discussion of basic UNIX/Linux commands and concepts. In the
    next chapter, we''ll discuss more advanced Linux tools. The tools in this chapter
    can be run from a command line or under the X Window System in xterm window.


    > If a computing neophyte, you may want to check out a basic UNIX text (such as
    teach yourself ... UNIX, Third Edition—MIS:Press) for a more detailed explanation
    of UNIX directories, files, commands, command lines, pipes, and standard input/output.
    See Appendix A for details.


    # # The Linux Filesystem


    Linux organizes your information in files. Files can contain text, programming
    information, shell scripts, or virtually any other kind of information.


    We''re not going to spend a lot of time on this basic concept here or on the different
    types of files under the UNIX operating system; if you''re not sure what a file
    is, you should check out one of the basic UNIX texts'
  merge: -1
  pgno: 229
- img_proc: true
  md: '# CHAPTER 4: Basic Linux Tools


    listed in Appendix A. However, there are some things you should know about how
    Linux treats files:


    +   - Linux has no practical limit on the length of filenames. While there are
    some internal limits on filename size (namely, 256 characters), you''re probably
    not going to run into these limits. If you''re frustrated by DOS''s eight-dot-three
    filename limitation, you''ll be pleased with this aspect of Linux. However, if
    you''re using Linux on a network with other forms of UNIX, you''ll probably want
    to limit your filenames to a 14-character limit, because this is the general limit
    in the UNIX world.

    - Linux has few limitations on what characters can be used in filenames. Generally
    speaking, you shouldn''t use the characters in filenames.


    ! @ # $ % ^ & ( ) [ ] } '' ? ; < > + - / .


    These characters have a tendency to conflict with the shell. In addition, you
    can''t use spaces in the middle of a filename.


    +   - With Linux, always counts, and that includes filenames. Under Linux, report,
    Report, and REPORT are three different files.


    A file can be looked at in few different ways when it comes to the name. When
    we refer to files throughout this chapter, we''re mainly speaking about the filename
    itself (like test) and not the absolute pathname. Under Linux, an absolute filename
    is the name of the file measured from the root directory. Therefore, a file that''s
    stored in a subdirect (which you''ll learn about later in this chapter) named
    /home/kevin would have an absolute pathname of /home/kevin/test. When we refer
    without a reference to the subdirectory containing it, we''re referring to its
    relative pathname. There''s a lot more rigmarole to do with relative pathnames,
    which you''ll probably not deal with it all often.


    One difference from MS-DOS that you''ll notice: With Linux, there''s no such thing
    as drive names. A single filesystem, and any differences in physical media are
    pretty much abstracted away. This is why the CD-ROM drive actually appears as
    part of the filesystem as /cdrom. Similarly, the floppy drive is represented by
    a device driver, not a physical drive letter. (There are ways Linux deals with
    floppy drives; some of them will be covered in Chapter 5.)'
