    # File Permissions and Linux


    When you first use your Linux system and are not logged in as the root user, you
    might be in for some rude surprises when you try to write to a directory that’s
    not your own home directory. Essentially, Linux will tell you that you cannot
    write to the directory.


    Because UNIX is a creature centered around security, Linux allows permissions
    to be designated for files and directories. If you lack the proper permissions,
    you can’t change files or directories. The root user, of course, has proper permissions
    to access every file in the filesystem (which means you shouldn''t expect absolute
    security if you’re working on a larger system). Under Linux, there are three different
    levels of permissions: owner, group, and world.


    Permissions are an extremely frustrating part of Linux if you’re a new user. While
    there are permissions under DOS, they are not frequently used.


    To find what permissions are applied to files, use the following command line:


    ```

    gilbert:/$ ls -l

    -rwxrxrwx 1 kevin group1 512 Apr 3 19:12 test

    -rwxrxrwx 1 kevin group1 512 Apr 3 19:27 test.bk

    drwxrxr-x 1 kevin group1 2146 Apr 1 04:41 memos

    -r------ 1 kevin group1 854 Apr 2 19:12 data

    ```


    There’s actually rhyme and reason to the mess of numbers and letters presented
    here, but it’s best explained going to left in columns (focusing on the first
    line of the listings):


    +   * The eighth column (test) lists the filename.

    * The seventh column (19:12) lists the time the file was created.

    * The sixth column (Apr 3) lists the date the file was created.

    * The fifth column (512) lists the size of the file in bytes.'
  merge: -1
  pgno: 237
- img_proc: true
  md: '# CHAPTER 4: Basic Linux Tools 207


    +   - The fourth column (group1) lists the group the file belongs to. (We''ll
    explain this later.)

    - The third column (kevin) lists the owner of the file.

    - The second column (1) shows the number of links to the file.

    - The first column (-rwxrxrwx) lists the permissions associated with the file
    and the type of the file.


    The leading hyphen (-) tells us that the file is an ordinary file, which was covered
    earlier in this section. When you do an -l, you''ll see various file-type listings,
    shown in Table 4.2.


    Table 4.2 File Types Listed with the Is -l Command Line


    | Listing | File Type |

    |---|---|

    | - | Ordinary file. |

    | d | Directory. |

    | l | Link. |


    There are other file types listed with this command, but you won''t usually see
    them with Linux.


    # Permission Lines


    The remainder of the first column, covering specific permissions, commands most
    of our attention in this discussion. Basically, the permissions are broken down
    into three groups. Remember that permissions are applied to the owner of the file
    (in this case, kevin), the group of the file (in this case, group1), and the world
    at. Applying this trinity to a permission line of -rwxrxrwx, we can see that the
    owner has the ability to read the file (indicated by r), write the file (indicated
    by w), and execute the file (indicated by x). Moving on, the group has the ability
    to read the file (indicated by r), write the file (indicated by w), and execute
    the file (indicated by x). Finally, the world has the ability to read the file
    (indicated by r), write the file (indicated by w), and execute the file (indicated
    by x). In other words, this file is free game for anyone with access to your Linux
    filesystem.


    Things are a little different with the following listing:'
  merge: -1
  pgno: 238
- img_proc: true
  md: '# 208 CHAPTER 4: Basic Linux Tools


    -rwx------ 1 kevinr groupl 854 Apr 2 19:12 data


    When there are no letters a permission—as in the case with the hyphen—the permissions
    are restricted. With this file, the owner has the ability to read the file (indicated
    by *r*), write the file (indicated by *w*), and execute the file (indicated by
    *w*). However, no one else has any permissions with this file.


    With most of the Linux operating system, you''ll see a permission like *rwxr-xr-x*,
    with *root* being the owner of the file. In this instance, an average user (that
    is, someone not logged in as *root*) has the ability to execute files (an important
    capability to have) and read the files but lacks the ability to write (that is,
    change) the file. This protection exists for many reasons, but basically it prevents
    users from wreaking unanticipated havococ.


    > When you install and configure new software on your Linux system and want to
    install it in one of the standard file locations, you''ll need to log in as *root*.


    ![](img/05da311512608405596dd882623b9142_239_0.png)


    # Changing Permissions


    The Linux command **chmod** changes file permissions. You may want to change permissions
    for some popular directories in order to avoid logging in as **root** to install
    or configure software.


    > When you have write permission for a file or directory, you can''t change the
    permissions. Of course, this means you need to be logged in as **root** to change
    permissions.


    ![](img/05da311512608405596dd882623b9142_239_1.png)


    Permissions can be changed in **numeric** or **symbolic** form. Neither method
    is what could be called intuitive, so we''ll spend some time explaining each of
    them.


    # The Numeric Method


    The numeric method uses numbers to track permissions. Like the permissions listings
    earlier in this section, the numeric method divides permissions into threes, albeit
    in a different manner.'
  merge: -1
  pgno: 239
- img_proc: true
  md: 'The numeric method forces you to add three different sets of numbers in determining
    who has which permissions. The actual types of permissions (owner, group, world)
    haven’t changed—only the method of listing them.


    You’ll use modes to track permissions, as seen in Table 4.3.


    # Table 4.3 Modes and Their Meanings


    | Mode | Meaning |

    |---|---|

    | 400 | Owner has read permission |

    | 200 | Owner has write permission |

    | 100 | Owner has execute permission |

    | 040 | Group has read permission |

    | 020 | Group has write permission |

    | 010 | Group has execute permission |

    | 004 | World has read permission |

    | 002 | World has write permission |

    | 001 | World has execute permission |


    You must now translate these numbers into the numeric form by adding them together.
    For example, using the following directory listing:


    ```

    -rwx-x--x 1 kevinr group1 854 Apr 2 19:12 test

    ```


    we arrive at a numeric permission of 711:


    +   * 400 Owner has read permission.

    * 200 Owner has write permission.

    * 100 Owner has execute permission.

    * 010 Group has execute permission.

    * 001 World has execute permission.


    711


    A file or directory that’s totally open to the world would have a permission of
    777; a file or directory inaccessible to anyone would have a permission of 000.'
  merge: -1
  pgno: 240
- img_proc: true
  md: '# 210 CHAPTER 4: Basic Linux Tools


    Changing the permissions entails the desired permissions with the chmod command.
    For example, to change the file permissions of the test command to make it totally
    accessible to all users, you''d use the following command line:


    ```

    gilbert:$ chmod 777 test

    ```


    To change the permissions so that only the owner of the file has the ability to
    totally access the file and at the same time permission is denied to every other
    user, you''d use the following command line:


    ```

    gilbert:$ chmod 700 test

    ```


    To change the permissions so that the owner of the file has the ability to totally
    access the file, but other users and the group have the ability to read and execute
    (but not change) the file, you''d use the following command line:


    ```

    gilbert:$ chmod 744 test

    ```


    # The Symbolic Method


    When using the numeric method, you don''t need to know the existing permissions
    of the file, which means that you need enter only the desired permissions. The
    other main method of setting permissions, called the symbolic method, requires
    that you know the existing permissions, as you''re setting new permissions relative
    to the existing permissions.


    The symbolic method eschews numerals and uses letters instead. And it''s very
    precise in adding or subtracting permissions relative to existing permissions.
    For example, the following command line gives execute permissions to the world
    (all users):


    ```

    gilbert:$ chmod o+x data

    ```


    Here, o refers to “others” (in parlance, the world), x refers to execute permission,
    and the plus sign (+) adds the execute permission to others. If a minus sign (-)
    were used, this command line would remove execute permission from others..'
  merge: -1
  pgno: 241
- img_proc: true
