    # Error Messages


    The previous section relied on a small section of the /var/adm/messages file;
    if you take a look, you''ll see a very large file if you''ve been using Linux
    for any amount of time. For example, you''ll see logged on and off the system,
    even if the login was unsuccessful, as in the following line:


    Mar 31 14:48:51 gilbert login: 1 LOGIN FAILURE ON tty1, root]


    To see just the messages relevant to the most recent boot, you can use the dmesg
    command. This produces a bit of output, so you''ll probably pipe your output to
    less:


    dmesg | less


    # Boot Options


    In Chapter 2, we guided you through a Linux installation and emphasized the use
    of loadlin as a way of launching Linux. If you bought the first edition of this
    book, you know that this is a change in'
  merge: -1
  pgno: 386
- img_proc: true
  md: 'The way we recommend you launch Linux, but we don''t mean to imply that loadlin
    is the only way to launch Linux. In this section, we''ll discuss some of the alternatives,
    beginning with the creation of a bootdisk and ending with a look at LILO.


    # When you installed CD-ROM, you were asked if you wanted to create a boot floppy.
    You might have refused to do so, thinking to yourself, “I don’t need a stinkin’
    boot floppy!”


    You might have had a small problem booting your Linux system. You might have made
    a small error when compiling a kernel, for example, which could lead to all sort
    of panic messages when Linux fails to load. And that’s when you smack yourself
    on the head and curse yourself for not creating a boot floppy.


    Basically, a boot floppy contains the root partition, allowing you to boot the
    Linux kernel. PCs are designed to boot from sector 0, cylinder 0 of the boot drive,
    and most PCs are configured to first look to the A: drive for the boot information.
    If the information isn’t found there—then the PC is configured to look to sector
    0, cylinder 0 of the hard drive. Check your PC BIOS configuration to see if this
    is valid. For example, the advanced setup in the popular AMD BIOS series has an
    option to change the boot drive.


    When a Linux system is booted from a floppy, all it means is that the kernel or
    LILO is configured to be in the beginning of the boot floppy, ensuring that Linux
    will be loaded. This information is stored in a file named vmlinuz; it’s a compressed
    file that’s expanded and run when you boot your system. It’s the same file that
    exists on your hard disk; the only difference is the media, the contents of the
    kernel. When you boot from floppy, you’re loading the kernel, which then looks
    to hard drive for the rest of the operating system files. This can also be useful
    if you’re testing a new kernel.


    Some people like to boot their system from floppy; this leaves the boot sector
    on a hard drive safe for another operating system. There’s nothing wrong with
    booting from floppy for Linux and leaving the boot information on the hard drive
    for DOS or Windows.'
  merge: -1
  pgno: 387
- img_proc: true
  md: '# CHAPTER 6: Basic Linux System Administration 357


    The Slackware setup program contains the tools needed to create a new boot floppy.
    The Slack makebootdisk command is useful for creating a new bootdisk without having
    to go through the reconfiguration menus in the setup program. To use it, just
    supply the name of the kernel file use:


    ```

    makebootdisk zImage

    ```


    Makebootdisk will then put up a simple menu that allows you to produce one or
    more Linux bootdisks. These may be LILO bootdisks (these contain a small root
    partition and allow more boot options) or simple bootdisks (just a kernel file
    written directly to floppy).


    You can also create a new floppy from scratch. There are many ways to go about
    it, and the BOOTDISK-HOWTO by Graham Chapman (graham@zeta.org.au) contained on
    the first accompanying CD-ROM is actually an excellent overview of the many options.


    Here, however, we will present a down-and-dirty way of creating a bootdisk. With
    Linux loaded and you logged in as the root user (superuser), you can merely use
    the rdev command to specify a kernel file and its root device. The following command
    will tell vmlinux to set the root device to drive A:


    ```

    gilbert:/home/kevin# rdev vmlinux /dev/fd0

    ```


    > It''s a good idea to make a copy of vmlinux before doing anything to it.


    ![](img/05da311512608405596dd882623b9142_388_0.png)


    You can tell rdev to use any device, including hard drives and SCSI drives. After
    that, copy vmlinux to the floppy:


    ```

    gilbert:/home/kevin# cp vmlinux /dev/fd0

    ```


    If you''re more comfortable with the dd command, you can use it in the place of
    cp. However, be warned that you have to use a few parameters (if, of) with it.
    To accomplish the same action with dd that we just performed with cp, you''d use
    the following command line:'
  merge: -1
  pgno: 388
- img_proc: true
  md: '# CHAPTER 6: Basic Linux System Administration


    ```

    gilbert:/home/kevinr# dd if=vmlinuz of=/dev/fd0

    ```


    If you''re not sure what the kernel is using for a root device, type rdev on a
    command line by itself:


    ```

    gilbert:/home/kevinr# rdev

    ```


    To learn more about the rdev command, summon its online help:


    ```

    gilbert:/home/kevinr# rdev -h

    ```


    These steps will give you a basic and functional boot floppy. There are many other
    things you can do to a boot floppy—you can include a filesystem and a set of basic
    UNIX commands or you can include a set of utilities that will allow you to restore
    a system backup from tape or other storage device. Again, the BOOTDISK-HOWTO provides
    an excellent overview of the subject and can point you to the many directions
    you can take with a boot floppy.


    # Recovery Packages


    There are several recovery packages in the Linux world that will create diskettes
    specially designed for those occasions where you need to boot from a floppy. We''ve
    included them all on the accompanying CD-ROM. Following is a list of the packages.


    # Bootkit


    Bootkit (from Scott Burkett) uses menus to create rescue disks, both for the purpose
    of booting a system and for saving the contents of a corrupted system. You can
    also grab it from sunsite.unc.edu; the file is /pub/Linux/system/Recovery/Bootkit-vvv.tar.gz.


    # CatRescue


    CatRescue (from Oleg Kibirev) creates rescue disks and provides some handy information
    on recovering from a system failure. You can also grab it via FTP at gd.cs.csufresno.edu/pub/sun4bin/src/CatRescue100.tgz.'
  merge: -1
  pgno: 389
- img_proc: true
  md: '# CHAPTER 6: Basic Linux System Administration 359


    # Rescue Shell Scripts


    Rescue Shell Scripts (from Thomas Heiling) features shell scripts for creating
    boot and boot/root diskettes. You can also grab it via FTP from sunsite.unc.edu/:pub/Linux/system/Recovery/rescue.tgz.


    # What to Do If Forget Your Password


    We''ve done all it, particularly when working on systems where we don''t login
    every day. Mere users can forget their passwords, and system administrators have
    the tools to change their passwords and set new accounts.


    On the other hand, as a system administrator, you''re supposed to be infallible.
    If you forget your password, there''s no higher entity to bail you out. Forgetting
    your password is another good reason for creating a boot floppy. In these cases,
    you can boot the system from floppy, mount the /root partition (if necessary),
    remove the existing password from the /etc/shadow file (although the password
    is encrypted, the entire entry can be deleted), and then reboot from hard disk,
    where you can create a new password.


    > This small section should serve as a cautionary note to anyone who assumes that
    their Linux system is secure—it''s not. If you can boot a system from floppy,
    you have access to the entire filesystem.


    ![](img/05da311512608405596dd882623b9142_390_0.png)


    # Using LILO


    In the first edition of this book, we advised you to install Linux using LILO,
    the LILO Loader. In this edition, the reason for the change is quite simple: We''ve
    found that using loadlin is a much better alternative for new users. LILO can
    be a tad childish and unforgiving—if you make an error when setting up LILO, you''ve
    pretty much munged up the boot record of your PC. (Yet another reason to create
    a boot floppy!) And given these days of multiple operating systems'
  merge: -1
  pgno: 390
- img_proc: true
  md: '# 360 CHAPTER 6: Basic Linux System Administration


    coexisting on PCs, we find that many users want to have the option to go to Linux
    from their other operating systems, and under these circumstances loadlin works
    best.


    However, some will want to go with LILO as their boot tool. We always give people—especially
    experienced users—an option.


    # What is LILO?


    Basically, LILO is a program that controls your boot drive''s Master Boot Record,
    or MBR. When you turn on your computer, the BIOS checks your MBR for instructions
    on how to proceed.


    When you install LILO, you''re telling the MBR to actually invoke the LILO program
    upon boot. LILO can be programmed to wait for a certain time before loading Linux,
    and it can be used to boot other operating systems, such as DOS and OS/2.


    LILO''s actually a pretty simple beast, and the configuration process makes it
    even simpler. LILO works with a configuration file that''s generated automatically
    through this setup program. You can run this program whenever you want, actually;
    you can use loadlin and then adapt LILO after you get to a certain point in your
    Linux education. Your first move will be to start the process by running the setup
    program, then marking any operating systems you want to appear in this configuration
    file. Because you want Linux to be able to boot, you''ll want to begin by specifying
    Linux. After that, you can designate another operating system (MS-DOS or OS/2)
    as a possible boot option. You''ll want to specify Linux first, however, so that
    it appears first in the configuration file.. When you''re finished running through
    these queries, you''ll end up with a file that looks like this:


    ```

    # LILO configuration file

    # generated by ''liloconfig''


    # Start LILO global section

    boot = /dev/hda

    #compact # faster, but won''t work on all systems

    delay = 50

    ```'
  merge: -1
  pgno: 391
- img_proc: true
  md: '# CHAPTER 6: Basic Linux System Administration


    ```

    vga = normal          # force sane state

    ramdisk = 0           # paranoia setting

    # End LILO global section

    # Linux bootable partition config begins

    image = /vmlinuz

    root = /dev/hda2

    label = Linux

    read-only # Non-UNIX filesystems should be mounted read-only for checking

    # Linux bootable partition config ends

    # DOS bootable partition config begins

    other = /dev/hda1

    label = DOS

    table = /dev/hda

    # DOS bootable partition config ends

    ```


    This file is stored as /etc/lilo.conf.


    You''ll also be asked about how long to wait before loading Linux. LILO is pretty
    handy in that lets you specify a period of time (5 seconds or 30 seconds) between
    when LILO loads and when the first operating system is loaded. (In the /etc/lilo.conf
    file, this appears as the numeral 50 if you chose 5 seconds, and 300 if you chose
    30 seconds.) This gives you time to specify another operating system to boot,
    should you want to boot DOS or OS/2 instead of Linux. This is done by pressing
    the Shift key after LILO loads, which gives you the prompt:


    boot:


    If you specify DOS, then DOS will boot from the DOS partition (provided, of course,
    that you''ve marked this partition as a boot partition). Pressing Tab key gives
    you a list of options.


    > If you''re using OS/2''s Boot Manager, you may want to use that for the primary
    boot loader and use LILO to boot Linux.


    ![](img/05da311512608405596dd882623b9142_392_0.png)'
  merge: -1
