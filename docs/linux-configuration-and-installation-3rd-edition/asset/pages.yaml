  md: '# CHAPTER I: Linux and PC Hardware 13


    However, there''s still a chance you could experience some problems. For example,
    the Hardware Compatibility-HOWTO reports some Conner CFP1060S drives may have
    problems with Linux when using the ext2fs file system. The systems are inode errors
    during fsck and corrupt file systems. Conner has released a firmware upgrade to
    fix this problem (call 1-800-4CONNER), but you''ll need the microcode version
    (found on the drive label, 9WA1.6x) before Conner can help you.


    In addition, center Microlis drives have problems with Adaptec and BusLogic cards.
    In these situations, contact the drive manufacturers for firmware upgrades.


    # SCSI Controllers


    In theory, you shouldn''t have any problems with a SCSI card, because all SCSI
    cards are written to exacting technical specifications.


    If you believe that, we have some swampland in Florida for you.


    The fact is that SCSI cards are not all alike, and you can''t assume that you
    have a SCSI controller on your PC, you''ll be able to use Linux with no sweat.
    Most low-end SCSI controllers are designed to interface with a CD-ROM drive, not
    necessarily a hard drive or another SCSI device.


    These SCSI controllers are explicitly supported under Linux: AMI Fast Disk VLB/ISA
    (BusLogic-compatible); Adaptec AVA-1505/1515 (ISA) (Adaptec 152x-compatible);
    Adaptec AHA-1510/152x (ISA) (AIC-6260/6360); Adaptec AHA-154x (ISA) (all models);
