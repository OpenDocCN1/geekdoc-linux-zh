    operating system or the X Window System in any depth (it takes entire forests
    to cover these topics in any depth), you may want to look for another UNIX/X book
    or two. The following list should fill most of your needs.


    # # Other Linux Books


    Running Linux, Matt Welsh and Lar Kaufman, O''Reilly & Assoc., 1995. This nonspecific
    Linux primer covers both Linux and some general UNIX commands. It''s not tied
    to any specific distribution of Linux, so some of the information won''t apply
    to the accompanying CD-ROMs. Welsh deals with some advanced topics not covered
    in this book.


    Linux Network Administrator''s Guide, Olaf Kirch, SSC, 1994. This technical overiew
    of Linux networking should cover whatever you need to know about Linux on a network.
    Although this book is'
