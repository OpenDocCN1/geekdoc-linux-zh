    # Testing Your Configuration


    Now you''re ready to start X and see if things work. Type in the following command
    and see if things start up:


    ```

    startx

    ```


    The startx shell script is the official way to start X from a user account.


    # Starting X


    The startx script runs the xinit program, which does two things: runs the X server
    (the program named X) and then runs the commands in the .xinitrc file in your
    home directory. These commands should set up the X applications you want launched
    on startup. There''s no .xinitrc file in your home directory, then xinit runs
    a default script. The system default .xinitrc file is /usr/lib/X11/xinitrc.fwwm
    (no default).


    The best way to start out with X—once you verify your XF86Config file—to copy
    the system .xinitrc into your home directory and then edit this file. The .xinitrc
    file comes from the standard XFree86 installation for Linux; it looks for certain
    files, few of which will actually exist, and it executes programs using those
    files it finds. The section at the end is where you''ll set up the X applications
    you wanted when starts.


    In our case, we use xsetroot to change the screen''s background color and then
    launch clock, a rounded clock, the fwwm window manager, and two xterms. No matter
    what, you need a window manager program, to control the display. The default window
    manager on Linux is fwm (see Figure 3.1) and you''ll find it highly customizable.'
