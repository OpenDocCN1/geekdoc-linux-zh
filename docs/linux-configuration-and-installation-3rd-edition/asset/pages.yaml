    If you''re on the Usenet, you will be surrounded by information regarding free
    software and how to get it. The trick is knowing where to look for it.


    Some universities and corporations maintain archive sites that support anonymous
    FTP. These locations are referred to regularly in the newsgroup comp.answers.'
