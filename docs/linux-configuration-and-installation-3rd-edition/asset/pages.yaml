  md: '# CHAPTER 4: Basic Linux Tools


    deviate from this standard practice, you need to specify the difference. This
    is done on the command line, mostly through the use of greater-than (>) and less-than
    (<) symbols.


    For starters, you can redirect input to use an existing file as input for a program
    rather than keyboard entry. In this case, you must point input from the file to
    the command in the following manner:


    ```

    gilbert:/$ cat < data

    ```


    Here, the file data is input for the cat command, as opposed to normal keyboard
    entry.


    In another variation of standard input/output, you can send the output of a command
    to a file. This is a very useful variation, as many commands generate output that''s
    too voluminous to read as it whizzes by your screen. For example, you may want
    to redirect the output of the ls to a file and look at that output with a text
    editor or a viewer like less. In this case, you''d direct the output to a file:


    ```

    gilbert:/$ ls > listings

    ```


    In addition, you''ve already seen how standard input and output can be used to
    append information to an existing file:


    ```

    gilbert:~$ cat >> memo

    ```


    Table 4.12 lists the major input/output commands.


    > Table 4.12 Standard Shell Input/Output Commands


    | Symbol | Usage | Result |

    | --- | --- | --- |

    | > | command > filename | Output from command is sent to filename. |

    | < | command < filename | Input from filename is sent to command. |

    | >> | command >> filename | Output from command is appended to filename. |

    | | command1 | command2 | Run command1 and send the output to command2. |'
  merge: -1
  pgno: 274
- img_proc: true
  md: '# CHAPTER 4: Basic Linux Tools


    There are many places where redirection comes in handy. For example, you can send
    output from the command directly to a printer when using standard input/output:


    ```

    gilbert~\$ ls | lp

    ```


    # Pipes


    The previous example is a pipe, and it''s what distinguishes a pipe from standard
    input/output. Redirection can only work with files and commands; a file can be
    used as input for a command, and a file is the recipient of output from a command.
    With a pipe, you can join commands, sending the output from one command to another
    command. A pipe is rather simple:


    ```

    gilbert~\$ command1 | command2

    ```


    Here, the output from command1 is piped to command2. (Naturally, the entire command
    line is called a pipeline.)


    You can combine a number of pipes on a command line, as in the following:


    ```

    gilbert~\$ ls *.c | grep arg | lp

    ```


    This command line would search for all the files ending with .c in your current
    directory and send that to the grep command, which searches these files for the
    string arg and sends all these matching lines to the lp command, which directs
    the printer to spit them out.


    # Command History


    Bash supports command history, which tracks which commands you''ve run and lets
    you choose among them when you need to run another command. For example, you may
    want to reuse a command you''ve recently run but don''t want to go through the
    trouble of typing it in. In this case, you could use the history command and scroll
    between a list of previous commands:'
  merge: -1
  pgno: 275
- img_proc: true
  md: '# CHAPTER 4: Basic Linux Tools 245


    ```

    gilbert:-$ history

    1. cal

    2. in -s addresses /home/pat

    3. in addresses /home/eric

    4. history

    ```


    With this list, you can press the Up and Down Arrow keys (↑ and ↓) to move between
    the previous command lines. If there''s a long list of previous commands and you
    want to run a specific one, you can enter its number and the command will appear
    on the command line.

    Other shells offer this capability, albeit in different forms.


    # Minimal Completion


    Although you may not use the facility too often, the bash shell''s ability to
    complete words on a command line may be convenient for you. For example, we''ve
    been working a lot with a file named test in this chapter. (In fact, you''re probably
    sick of hearing about it.) We know you want to see this file again, so run the
    cat command to view it one more time. However, instead of typing out the entire
    name of the file, stop when you have a command line that looks like this (without
    pressing the Enter key):


    ```

    gilbert:-$ cat te

    ```


    At this point, press the Tab key. Magically, the rest of the word test will appear
    on the command line. This is because you''ve given bash enough information to
    actually complete the command line for you. Bash actually goes through the directory
    and finds the filename that logically matches the beginning of the information
    you''ve entered. This capability can also be used to complete commands.

    In our case, however, there were two files that met our conditions.


    # Aliases


    The shell is responsible for administering one of the handiest things in Linux:
    setting up an alias.'
  merge: -1
  pgno: 276
- img_proc: true
  md: '# CHAPTER 4: Basic Linux Tools


    Basically, an alias is a keyboard shortcut for a longer command. Unless you''ve
    specified a directory in your PATH, you need to specify an absolute pathname to
    launch a command. Because many commands—such as some of the X Window applications—are
    buried deep within the hierarchy, you may have to enter a very long command line
    to launch them.


    That''s where you can set up an alias for that long command line. Basically, you
    use the alias command to tell the shell to use a short string in place of the
    long command line. In addition, you can use aliases to turn a potentially dangerous
    command into a less-dangerous command (as was the case in the discussion of the
    rm command earlier in this chapter). While bash supports the dir command (the
    same as in MS-DOS), you could set up aliases for your favorite DOS commands and
    their Linux counterparts. Let''s say you''re used to working with the DOS copy
    command and just can''t get to the Linux cp command. You could set up an alias
    like the following:


    ```

    gilbert:~$ alias copy=''cp''

    ```


    If you run this command line, you can use both copy or cp to do the same thing.
    You don''t lose the functionality of cp; you''re merely telling bash to call it
    when you enter cp.


    Be careful to follow the structure shown in the example. You can''t insert any
    spaces between the two commands, and you must be sure to use single quote marks.


    To turn off an alias use the unalias command:


    ```

    gilbert:~$ unalias copy

    ```


    When you run the alias command from the command line, it''s only good for the
    current session. To make it a permanent fixture, you need to add it to your .profile
    file, found in your home directory. This file is launched every time you launch
    Linux, and it''s here that you can really customize your system. Any this level
    of customization is beyond the scope of this book; see Appendix A for a list of
    books that can help you with UNIX system configuration.'
  merge: -1
