  md: '# CHAPTER 5: Linux Applications 279


    # Using TeX


    Biblical scholar and programming whiz Donald E. Knuth developed TeX (pronounced
    tech) to handle the tough typesetting chores that other computer tools couldn''t
    handle the time, such as mathematical and foreign-language formatting. TeX works
    like groff: You create the source file in elvis or emacs, and then you run the
    file through TeX. Linux also features LaTeX, a series of useful macros for use
    with TeX, as well as scads of fonts for use with TeX. (Academics will find that
    these fonts are worth the price of Linux on their own; the fonts cover all major
    and most minor dialects, even descending into the world of fantasy with fonts
    for Klingen.)


    In this book, we''re not going to spend a lot of time covering TeX. When you installed
    Linux from the CD-ROMs, you were prompted about whether you wanted to install
    TeX and the accompanying fonts. If you didn''t do so at the time, you can run
    the setup program and install the TeX disksets. The usage of is is somewhat involved;
    if your work involves this sort of precise mathematical formatting, you will want
    to check out one of the many books covering TeX. On top of that list would be
    Knuth''s own TeXbook. In addition, Leslie Lamport (the creator of LaTeX) documented
    LaTeX in the LaTeX User''s Guide and Reference Manual.


    # Using Texinfo


    Hypertext meets Linux with the texinfo text-formatting program, courtesy of the
    same folks who brought us emacs. Texinfo is a relatively new attempt in the UNIX/Linux
    world to provide useful documentation for users of all sorts. The goal of texinfo
    is to create information files that can be accessed from help systems within applications,
    from the command line, or printed in a traditional manual. The benefit, of course,
    is that documentation only needs be changed on one source file. Since this makes
    the creation of useful online documentation easier, we certainly applaud the effort—UNIX
    has a reputation for being too cryptic, and texinfo is a way to bring online help
    to the masses.


    The nice thing is that the Free Software Foundation practices what it preaches,
    placing most of its online help in texinfo files. In fact, if you use emacs, you''ll
    want to check out the texinfo files that emacs uses in the Help menu (you can
    also access these files by typing Ctrl-h I).'
  merge: -1
