    If you use kernel modules and decide later to upgrade your kernel, you''ll need
    to upgrade your kernel modules as well. When configuring the kernel, select M
    instead of Y to build drivers as kernel modules instead of building them into
    the kernel. Once you''ve compiled your kernel with:


    ```

    make dep ; make clean ; make zimage

