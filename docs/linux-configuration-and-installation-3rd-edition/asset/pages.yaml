  md: '# CHAPTER 3: Installing and Configuring XFree86 171


    menus, sort of like like a toolbar or the Windows 95 command area at the

    bottom of the screen.


    Then you can turn on GoodStuff by uncommenting the GoodStuff

    lines in the InitFunction and RestartFunctions sections:


    ```

    Function InitFunction

    #Module "I" FvwmBanner

    #Exec "I" xpmroot /usr/include/X11/pixmaps/fvwm.xpm &\nModule "I" GoodStuff

    #Module "I" FvwmPager 0 3

    #Exec "I" exec xterm -geometry 80x64+0+0 &

    #Wait "I" xterm

    #Desk "I" 0 2

    #Exec "I" exec xmh - font fixed -geometry 507x750+0+0 &

    #Wait "I" xmh

    #Desk "I" 0 0

    EndFunction

    ```


    ```

    Function RestartFunction

    #Exec "I" xsetroot -solid "#266294"

    Module "I" GoodStuff

    #Module "I" FvwmPager 0 3

    EndFunction

    ```


    Either way, the InitFunction section allows you to specify a set of

    X applications to launch at fvwm startup. Because this overlaps with

    the .xinitrc file, we typically skip starting any applications in the

    InitFunction section.


    # Toward a Motif-Like Look and Feel


    One of fvwm''s claims to fame is that it is a free window manager that

    looks a lot like the Motif window manager, mwm, used on just about

    very commercial version of UNIX. Unfortunately, while fvwm looks

    like Motif, it doesn''t act as much like mwm as you''d expect. The similar

    look of fvwm can fool you.'
