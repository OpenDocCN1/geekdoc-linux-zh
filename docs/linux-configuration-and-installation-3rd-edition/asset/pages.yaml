    Newsgroups can be open or moderated. Open newsgroups mean that anyone can post
    to them, while moderated newsgroups have someone to review the postings before
    they''re passed out to the general public. As you might surmise, moderated newsgroups
    tend to be more reliable and useful.


    The Usenet newsgroups are aggressively egalitarian. News can be posted by just
    anyone. Using it as a source of information requires some skepticism on your part.
    On the one hand, it''s a great place to find very technical, specialized information—the
    more technical and specialized the better. Many leading figures in the computing
    industry regularly post information in the newsgroups. And there''s nothing new
    under the sun, chances are that the problem that plagues you have already solved
    by someone else in the Linux world.


    On the other hand, every opinion is not created equally, and a lot of ill-founded
    opinions can be found in most newsgroups. Veterans refer to the signal-to-noise
    ratio; newsgroups with a lot of ill-founded opinions and bickering are said to
    be filled with noise. As with any other source of information, treat what you
    see on the Usenet newsgroups with a healthy dose of skepticism.


