    Abuse(abuse) is an arcade game from Crack Dot Com that pits you against a horde
    of angry aliens; your goal is to kill as many as you possibly can. In many ways,
    abuse is structured like DOOM—you get a limited version as part of the Slack Linux
    distribution, and you can register for an additional fee to get additional bells
