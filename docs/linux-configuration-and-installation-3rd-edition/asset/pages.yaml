  md: '# CHAPTER 3: Installing and Configuring XFree86 141


    # Virtual Screens


    The Virtual line allows you to define a virtual screen that is larger than the
    number of pixels supported by your monitor. The X server will automatically scroll
    the display when the mouse hits the end. If you like this effect (we don''t),
    then set the Virtual resolution to something larger than your monitor allows,
    as:


    ```

    Virtual 1152 900

    ```


    This virtual setting creates a traditional Sun Microsystems resolution. This is
    useful if you need to run older programs that were designed with Sun systems in
    mind and want grab more than the default 1024-by-768 area available on most PCs.


    The ViewPort line tells where the X server should start up. For example, a ViewPort
    of 0,0 tells X when it starts up, it should display position 0,0 in the upper-left-hand
    corner (which is what you''d expect on X). If you''d rather start in the middle
    (an unlikely option), you can change this.


    > The fvwm window manager supports a different kind of virtual screen. Don''t
    mix the two types of virtual screen or you''ll likely have trouble.


    ![](img/05da311512608405596dd882623b9142_172_0.png)


    # Running the Xf86config Program


    Now we''ve gone over the contents of the XF86Config file, we can run the xf86config
    program, or, if you''d prefer, fill in the file by hand. We recommend using xf86config
    and then checking the XF86Config file it builds by hand. The xf86config program
    isn''t flawless and needs careful supervision.


    When you run xf86config, you should not be in the /usr/X11R6/lib/X11 directory.
    Instead, put an XF86Config file in a directory in your user account and copy it
    later to /usr/X11R6/lib/X11.


    As the program starts up, it will start asking a lot of questions. The xf86config
    program will prompt you for a lot of the values necessary'
  merge: -1
  pgno: 172
- img_proc: true
  md: '# 142 CHAPTER 3: Installing and Configuring XFree86


    for the X86Config file, as type of mouse, your desires for the keyboard, and monitor
    frequencies. When you''re done, xf86config will write out the data into a file
    named X86Config in the current directory. (This is why you don''t want to be in
    /usr/lib/X11, which is a symbolic link to /usr/X11R/lib/X11, when you run it.)


    Once xf86config program finishes, you should carefully examine the X86Config file
    it generates. This file will still be incomplete, because you haven''t probed
    for the clocks yet. Edit the X86Config file. If it looks OK, then, as the root
    user, copy the file to /usr/X11R6/lib/X11, but be sure to back up any existing
    X86Config file first.


    Now you''re ready to try X in probeonly mode.


    # Probing for Dot Clocks


    The XFree86 X server has a special probeonly mode that outputs values from the
    X86Config file and values it detects. You need to run X in this mode to see if
    things are going to work and to see if it detects any problems. Run the command
    line:


    ```

    X -probeonly

    ```


    when your system has no extra load on it. Stop any unneeded programs before running
    this, as any extra system load may influence the timings X obtains.


    The following command runs X in probeonly mode and sends the output to the file
    /tmp/x.values:


    ```

    X -probeonly > /tmp/x.values 2>&

    ```


    Be sure to run X from the console. Don''t try to run X if you''re already running
    X.


    If you have some dot clocks in the X86Config file, then X -probeonly won''t try
    to detect new ones. Because of this, the first time you run X this way, you should
    comment out the clocks in your X86Config file. After you run X in probeonly mode,
    you can add the clocks to the X86Config file and try it again, seeing if things
    still seem to work.


    You can then look at the file /tmp/x.values, which should contain something like
    the following:'
  merge: -1
