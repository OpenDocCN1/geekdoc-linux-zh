    One of the monitors we have, an NEC MultiSync XE17, was not in either the modeDB.txt
    or Monitors file. We found the closest monitor in the listing, an NEC MultiSync
    4FGE, and experimented with those Modelines. Calculating the Modelines yourself
    is a real pain, so you find a monitor or a close facsimile in the Monitors or
    modeDB.txt files.


    > Having said that, be careful about using Modelines for other monitors. You can
    destroy your monitor if you''re not careful.


