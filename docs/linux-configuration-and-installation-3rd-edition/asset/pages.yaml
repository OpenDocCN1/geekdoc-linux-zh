    # Perl


    Perl is a freep scripting language developed to handle a number of system administration
    tasks. Perl stands for Practical Extraction and Report Language. The whole point
    of the language is to make it easier for you to extract data from Unix and output
    reports on things such as Usenet news disk usage and a list of all users on your
    systems, sorted in order of largest disk usage. Perl tends to excel at tasks that
    revolve around reporting system information.


    To make sure you''ve installed perl when you install Linux, type in the following:


    ```

    gilbert:$ perl -v

    ```'
