    partition visible won''t affect Linux performance, nor will it eat away at the
    size of the Linux partition. Because you find it handy to move files via the DOS
    or OS/2 partition, you probably want to make this partition visible. You''ll be
    asked to provide a name for the drive; the name doesn''t really matter, so we
    use dos or dose. When you run the ls command later in your Linux usage, you''ll
    see dos or dose listed as just another directory, and the files within will appear
    as Linux files.


    # Selecting the Source for Linux


    You have five choices for where you want to install Linux from:


    +   * hard drive partition

    * floppy disks

    * NFS

    * premounted directory

    * CD-ROM


    Because you''ve bought this book, we''ll want to use the accompanying CD-ROMs
    for installation. However, other installation methods will be discussed later
    in this chapter.'
