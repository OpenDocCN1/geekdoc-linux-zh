  md: '# # About the CD-ROMs


    There are CD-ROMs accompanying this book. These disks are formatted under ISO-9660
    standards, with Ridge extensions. You can read the contents from PCs and Unix
    workstations, however, long Unix filenames


    (image-editing package), mpeg play (MPF animations, Unix or on the Linux kernel),
    pixmap [spxm], xpd (PhotoCD viewer), and xpdf for PDF files, as Acrobat files
    (from the name of Adobe''s PDF format).


    The second CD-ROM contains useful source code (and in some cases, compiled binaries)
    for Linux/Unix utilities mentioned in the book, as well as archived from two of
    the most popular FTP sites.


    # ## networking


    Networking applications: NIST (network time synchronizer), apache (World Wide
    Web [HTTP] server), balsam (utility for using Linux), mapping and discovery (threaded
    reader with X interface), samba (a file server/printer system for Windows 95,
    or other operating systems using samba), surfird (a web browser in T/Tk), TkX,
    tkWWR (a network configuration utility in Tk).


    # ## scientific


    High-end applications: GRASS (a complex system developed by the Army for managing
    land).


    # ## communications


    Communications utilities: dialed (a daemon that provides a connection on demand)
    and slip (a SLIP/PPP emulator in a Unix shell


    # ## sunsite


    Hundreds of programs from the sunsite.uncle Unix FTP site. The directory contains
    four further directories: apps (like communications tools, text tools, math programs,
    Tex tools and video programs), (developer tools), (a host of system-level programs
    and utilities), and XI (X window programs).


    # ## email


    Email-related utilities: MH (a mail-sending server), EXMH (a head-to-end front,
    a mail delivery/filtering utility), tkMail (a mail client with the Tk toolkit,
    a decoder for extracting headers from emails that are not in any of the popular
    formats), and xm (XForms-based mail reader for X).


    # ## office


    General user items: OFRIX (drag-and-drop for the X system), TDesk (a mail editor
    in Tk), Taddress (an address book, cb-break alarm), qgroup (a library for real-time
    group applications, such as drawing and programs that can use simultaneously),
    calen (calendar/date book), ned (Motif-editor for X), and teapot (spread-sheet
    program).


    # ## sysadmin


    System-administration tools: xwatch (a program to keep an eye on systems under
    X)


    # ## experimental


    Unsupported projects in development: Wine (Windows Emulator for X, a capable of
    running some Windows 3.1 programs directly under Linux) and NTFS (a kernel patch
    to provide read-only access to NT partitions).


    # ## tsx-II


    Hundreds of programs from the hit-mill Unix FTP site. The directory contains further
    directories: the contents of the Linux Documentation Project, as well as other
    relevant documents) and what change programs for the likes of Epoch, Modula-3,
    Scilab, Eiffel, DSP processing, sound management, graphics and other development
    tools and utility programs


    # ## graphics


    Graphics programs: POV-ray for Linux (a ray-tracing program).


    # ## programming


    Programming tools and utilities: List X programming language compatible with Motif
    2 (a free distributable of OpenGL), Java (the Java Developer''s Toolkit for Linux),
    perl-5 (source for the Perl language binaries included with the first disk) as
    CGI–a perl


    # ## window-managers


    Alternative window managers: bowman (a window manager for X with a NextStep look)
    and fv95 (a window manager for X with a Windows 95 look).


