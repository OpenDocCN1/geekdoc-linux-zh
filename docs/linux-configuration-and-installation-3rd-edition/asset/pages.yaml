  md: '![](img/05da311512608405596dd882623b9142_528_0.png)


    # # XFree86 and nExtensions


    This appendix covers a frequently asked question about X on Linux: Linux doesn''t
    support an X program that requires a specific X extension, so how do you get an
    X installation to run these programs? For example, XFree86 does not come configured
    to run three-dimensional graphics programs requiring the PEX extension.


    We''ll show you how to reconfigure your X server, extending it for these new needs.
    We''ll show you how to do this and we''ll discuss memory and performance trade-offs.
    We''ll focus on the 3-D PEX extension, because it''s the-most-requested X extension
    that XFree86 doesn''t support by default on Linux. However, the principles described
    here can apply to any X extension not directly supported by default in Linux.'
  merge: -1
  pgno: 528
- img_proc: true
  md: '# Appendix B: XFree86 and Extensions


    # # What Is an X Extension?


    An X extension is a piece of program code that extends the X server by adding
    some significant new functionality missing from the core X protocol, such as direct
    support for 3-D graphics.


    Each extension needs to modify the X server and come with a programmer''s library
    so that programs can use the extension. Some of these extensions, such as Shape,
    are so standard that it''s hard to view them as add-ons. The Shape extension,
    for example, allows you to round (and other odd-shaped) windows. The oclock program
    takes advantage of this, as we show in Figure B.1.


    ![](img/05da311512608405596dd882623b9142_529_0.png)


    Figure B.I Oclock using the Shape extension.


    We list the most common X extensions in Table B.1.


    # Table B.I Common Extensions to X


    | Extension | Usage |

    |---|---|

    | LBX | Low-bandwidth (serial-line) X, removed from XIR6.I |

    | MIT-SCREEN-SAVER | Allows you to create your own screen savers |

    | MIT-SHM | MIT shared-memory Ximage extension |

    | Shape | Nonrectangular windows |

    | X3D-PEX | PHIGS 3-D extension to X |

    | XTestExtension I | Testing |

    | XIE | X Image Extension |

    | XInputExtension | Adds new input devices, like digitizing tablets |

    | XVideo | Video extension |'
  merge: -1
  pgno: 529
- img_proc: true
  md: '# Appendix B: XFree86 and Extensions 499


    To see what X extensions your system supports, run the xinfo program from within
    an xterm window (you must be running X of course). When you run xinfo, you''ll
    see a lot of output describing your X server. Part of that output will include
    a list of extensions, probably something like the following:


    ```

    number of extensions: 10

    BIG-REQUESTS

    MIT-SCREEN-SAVER

    MIT-SHM

    MIT-SUNDRY-NONSTANDARD

    Multi-Buffering

    SHAPE

    SYNC

    XC-MISC

    XFree86-VidModeExtension

    XTEST

    ```


    X server doesn''t support a lot of fun extensions, such as PEX.


    # What You Need to Extend X on Linux


    Most of the time, you''ll install XFree86 (the implementation of X for Linux)
    in binary format (meaning you won''t compile a special version designed for your
    unique needs). Because of this, you need a special package, called the X link
    kit, to extend the Linux server. The link kit allows you to compile and link a
    new X server. The version of XFree86 that ships with this book contains the link
    kit; to install it, you''ll need to run the setup program again. One of the menu
    choices should cover the link kit.


    If you don''t have this, you can get it over the Internet. Usually the file is
    called X312kit.tgz or something like that.


    The link kit allows you to rebuild the X server, adding something new: the X extension
    you''d like to add. You''ll also need the gcc compiler (which comes with Linux
    if you choose to install it) libgcc, gcc''s standard C library. You should have
    installed both when you installed Linux. To see which version of gcc you have,
    try entering the following command line:'
  merge: -1
  pgno: 530
- img_proc: true
  md: '# Appendix B: XFree86 and Extensions


    ```

    ```gcc -v

    Reading specs from /usr/lib/gcc-lib/i486-linux/2.7.2/specs

    gcc version 2.7.2```

    ```


    To really use PEX, you''ll need to load the PEX libraries, include files, and
    fonts at install time. The PEX fonts, in /usr/lib/X11/fonts/PEX, are required
    to run most PEX programs.


    In the next section, we''ll show how to use the link kit to rebuild the X server
    for the X extension that supports three-dimensional graphics. These steps are
    basically the same for adding other X extensions, such as XIE, the massive imaging
    extension. We chose PEX because we''ve seen a lot of questions regarding this
    particular X extension. Three-dimensional graphics are becoming more and more
    popular. The basic techniques, though, apply to any X extension you need to add.


    > Once again, Linux can provide a nifty short cut here. Instead of rebuilding
    the X server, PEX support can be loaded from a module. The main page for XF86Config
    has more information about how to set this up.

    NOTE


    # Configuring the Server Build


    Before you can build a new X server, you must edit a configuration file, xf86site.def,
    in the /usr/X11R/lib/Server/config/cf directory. In this directory, edit the xf86site.def
    file (always make a backup first). In this file, you need to specify a number
    of things, including (e.g., PEX), and which X server to build, such as SuperVGA,
    XF86_SVGA, or S3 XF86_S3.


    In Table B.2, we list the settings we''ve used successfully. Note that we disableable
    the creation of most of the X servers, because we only need the S3 and SVGA X
    servers. Because of this, you''ll likely want to change your settings.


    > With any X release, these settings may change and there may be many ones. Use
    Table B.2 as a guide, not as gospel. At this time, because you''re rebuilding
    the X server anyway, you may also want to build in one of the other X extensions,
    such as LBX or XIE.

    NOTE'
