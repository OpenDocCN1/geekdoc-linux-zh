    # Printing with Ghostscript Under Linux


    Printing in Linux isn''t very intuitive topic to grasp. (Of course, neither printing
    is on any PC, for that matter, thanks to a lack of standards between hardware
    and software.) Most standalone Linux users are going to connect their printers
    to their PC''s parallel port, as this is the accepted way of doing things in the
    PC world. Of course, some PC owners will be stubborn and use a serial port for
    a printer, despite all the headaches this will cause.


    On one level, printing with Linux is a simple matter, as long as your printer
    is connected to the parallel port and you don''t want to do more print simple
    ASCII text. When you installed Linux, you were asked where your printer was installed;
    if your printer was connected to the first parallel port, the answer would have
    been LPT1 in parlance.) For this level, the basic Linux printing tools (pr) will
    work just fine, which is how the topic covered in Chapter 4. The problem becomes
    a little more pronounced when you want to print graphics and fonts, especially
    those formatted with PostScript.'
  merge: -1
  pgno: 315
- img_proc: true
  md: 'Additional information about printing and Linux can be gleaned from Grant Taylor
    and Brian McCauley''s excellent PRINTING-HOWTO, contained on the accompanying
    CD-ROMs.


    # Using Ghostscript


    Many UNIX documents are distributed in the PostScript format (even the Linux Documentation
    Project uses PostScript-formatted documents, although HTML docs are also available).
    PostScript, as we all know, is a commercial product under the watchful eye of
    Adobe. Because Adobe doesn''t give away PostScript files for free, in order to
    access PostScript files on the noncommercial Linux operating system, a workaround
    was needed. Once the Free Software Foundation came to the rescue, with Ghostscript.


    Ghostscript is actually the umbrella term for many smaller programs that allow
    you to view and print PostScript-formatted documents. (Remember we told the UNIX
    operating system is merely a collection of tools?) Ghostview, is the X Window
    application program for viewing PostScript-formatted documents.) When you installed
    Slack Linux (which we covered in Chapter 2), you should have installed all the
    files necessary to run Ghostscript, including a set of fonts. These files can
    be found in /usr/lib/ghostscript on the first CD-ROM.


    Ghostscript requires the X Window System to be running, but is actually launched
    from a command line in an xterm window. As we said, Ghostscript is actually a
    set of programs, but the program you''ll end up using the most is the interpreter,
    which takes a file and displays the PostScript formatting in anticipation of printing
    the document. To launch the interpreter, use the following command line:


    ```

    $ gs filename(s)

    ```


    where filename(s) refers to the file or files that you want rendered. If you specify
    multiple files, gs will display each file in order.


    To view a PostScript file with Ghostview, just specify the file on the command
    line:


    ```

    $ ghostview file.ps

    ```'
