- img_proc: true
  md: '# CHAPTER 2: Installing Linux


    # Configuring the Mouse


    You''ll want to use a mouse if you''re using the X Window System, and this menu
    allows you to set up the proper mouse. For newer PCs, setting up mouse isn''t
    a hassle at all because they usually contain a serial port for that purpose. All
    you need to do is tell Linux what kind of mouse you''re using and its location
    (if you''re using a serial mouse, you''ll need to specify where the mouse is connected),
    and then move on from there.


    # Configuring LILO


    LILO is the Linux Loader, and it''s used to boot Linux from the hard disk. It
    can also be used to boot additional operating systems (like OS/2 and MS-DOS) from
    the hard disk.


    ![](img/05da311512608405596dd882623b9142_112_0.png)


    LILO is a tool best left to Linux veterans. If you''ve used LILO before, go ahead
    and follow these directions to install it. However, if you''re a Linux newbie
    and don''t feel up to the task of a challenging configuration,it''s best for you
    to skip LILO.


    LILO works with a configuration file that''s generated automatically through this
    Setup program. Your first move will be to start the process, then mark any operating
    system you want to appear in this configuration file. Because you want Linux to
    be able to boot, you''ll want to begin by specifying Linux. After that, you can
    designate another operating system (MS-DOS or OS/2) as a possible boot option.
    You''ll want to specify Linux first, however, so it appears first in the configuration
    file. When you''re finished running through these queries, you''ll end up with
    a file that looks like this:


    ```

    # LILO configuration file

    # generated by ''liloconfig''

    #

    # Start LILO global section

    boot = /dev/hda

    #compact      # faster, but won''t work on all systems.

    delay = 50

    vga = normal  # force sane state

    ramdisk = 0   # paranoia setting

    ```'
