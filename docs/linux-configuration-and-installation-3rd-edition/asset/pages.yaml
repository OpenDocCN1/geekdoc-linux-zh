    # Listing Files and Directories with L and Dir


    You''ll use the ls command, short for list, quite often—probably everytime you
    use Linux, as a matter of fact. You''ve already used ls in a discussion of permissions.
    The following command lists the contents of the current directory or a specified
    directory:


    ```

    gilbert:$ ls

    bin/      home/      mnt/      sbin/     var/

    boot/    dev/      lib/      proc/     tmp/      vmlinuz

    cdrom    etc/      last-found root/      usr/

    ```


    If you''re a UNIX user, this is probably not the version of ls you''re used to,
    especially if you try this command on your own Linux box. The ls version contained
    with Linux is actually the GNU version of ls. As such, it makes'
