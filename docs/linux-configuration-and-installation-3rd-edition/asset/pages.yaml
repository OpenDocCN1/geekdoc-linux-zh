  md: '# Appendix B: XFree86 and Extensions


    Once you''ve set up the xf86site.def file, you''re ready to starting building
    a new X Server.


    # Building a New X Server


    As the root user, you should perform the following steps to build your new X server:


    +   1. Back up your current X server.

    2. Build all the Makefiles.

    3. Make the new X servers.

    4. Quit X.

    5. Install the new X servers.

    6. Ensure that /usr/X11R6/bin/X links to the proper X server.

    7. Start X to verify that the new X server works.

    8. Run xdpinfo to see if the new X extensions are available.

    9. Clean the /usr/X11R6/lib/Server directory with make clean.


    Before you start, always back up your current X server. This is to allow you to
    continue processing in case the new build fails. Then change back to the /usr/X11R6/lib/Server
    directory and build all the Makefiles by running the following command:


    ```

    $ ./mkmf

    ```


    All these commands must be run in the /usr/X11R6/lib/Server directory as the root
    user. This process will take a while, as runs makedepend on a number of files.


    Once mkmf finishes successfully, run make:


    ```

    $ make

    ```


    This builds the new X servers and will take even longer than the last step. Once
    you''ve built the new X servers, you must ensure that X is'
  merge: -1
  pgno: 533
- img_proc: true
  md: '# Appendix B: XFree86 and Extensions 503


    stopped. It’s very convenient to su to the root user in one xterm window and build
    the new X servers while you have all the other windows on your screen available
    for your work—that’s what multitasking is all about. When you need to install
    the new X server, however, you must ensure that X is stopped. So quit X in the
    usual way.


    Then change back to the /usr/X11R6/lib/Server directory and return (as root):


    ```

    $ make install

    ```


    This will copy the new X servers to /usr/X11R6/bin and set up /usr/X11R6/bin/X
    as a link to the default X server (the one you configured for it). Double-check
    this essential link anyway and ensure that /usr/X11R6/bin/X links to the proper
    X server (see Chapter 3 for more on this).


    Now comes the fun part. Try to run X as a normal user (as yourself, not the root
    user), using start. This step is to ensure that X still works (presuming X worked
    before you did this all).


    If you get X up and running (it came right up for us, so if it compiled and linked
    with no problems, this step should be easy), then run dpinfo in an xterm window
    to see if the new X extensions are available. The list should look something like
    the following:


