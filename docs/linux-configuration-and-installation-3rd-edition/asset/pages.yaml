  md: '# 448 CHAPTER 10: Programming in Linux


    Table 10.2 Cc Command-Line Parameters


    | Parameter | Meaning |

    | --- | --- |

    | -Idirectory | Searches the given directory and /usr/include for include files
    |

    | -c filename.c | Compiles the filename.c and builds the object module filename.a;
    this does not create an executable command |

    | -o progname | Names the executable program progname; the default name is a.out
    |

    | -g | Compiles with debugging information |

    | -O | Optimizes the program for best performance |

    | -ILibrary | Link in the linked library |


    Most UNIX compilers don''t allow you to mix the g (include debugging information)
    and O (optimize) options, but the GNU C compiler used by Linux allows this.


    There are many cc command-line options; use man cc to see them.


    # Linking with Libraries


    For C programs, a library is a collection of commonly used routines that you can
    reuse in your programs. Most C programs require more than just the standard C
    library. If you look in /usr/lib, you''ll see most of the libraries supported
    by Linux. Table 10.3 lists the major locations for Linux libraries.


    Table 10.3 Locations for Linux Libraries


    | Directory | Libraries |

    | --- | --- |

    | /usr/lib | Main system libraries |

    | /usr/openwin/lib | Open Look libraries like the Xview libraries |

    | /usr/X11/lib | Most XWindow libraries |


    To link with a given library, use the -l command-line option to cc. To link with
    the X11 library, use -IX11; this is shorthand notion for linking in the library
    named libX11.a (or its shared-library equivalent, libX11.so).'
