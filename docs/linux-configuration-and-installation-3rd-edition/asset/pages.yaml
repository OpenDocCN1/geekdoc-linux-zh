    # Using Head and Tail to View Portions of a File


    If a file is especially large, you may not want to load all of it and try to scroll
    through it, particularly if you''re just interested in a quick glance at its contents.
    In this case, you can use the head command to view the beginning of the file,
    or tail to view the end of the file. For both commands, the default is to display
    10 lines. Therefore, to display the first 10 lines of the file report, you''d
    use the following command line:


    ```

    gilbert:- head report

    ```


    To view the last 10 lines of the file report, you''d use the following command
    line:


    ```

    gilbert:- tail report

    ```


    To change the default of 10 lines, you''d specify a new number as an argument
    to the command; the following, for example, displays the first 20 lines of the
    file report:


    ```

    gilbert:- head -20 report

    ```


    # Viewing an Octal Dump with Od


    Finally, there''s the od command, which allows you to view an octal dump of a
    file:


    ```

    $ od filename

    ```


    filename is the name of the file to be viewed.'
