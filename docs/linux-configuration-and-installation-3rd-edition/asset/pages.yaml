    More information about printing in Linux can be found on the first CD-ROM, in
    the PRINTING-HOWTO.


    # Setting Up a Sound Card


    As installed, Slack includes no support for the sound component of

    sound boards. Yet many of you installed kernels that supported sound

    bords, like the sbpcd kernel used for systems with a CD-ROM

    attached to the sound board. What gives you?


    When you install one of these kernels, you''re actually making sure

    at the CD-ROM attached to the sound board will work, not the sound

    elf. To actually use one of these sound boards, you''ll need to

    recompile a kernel that supports a sound board.


    Why would you do this? Well, maybe you''re a dedicated Internet surfer and

    you want to be able to use the RealAudio streaming-audio player on your

    machine (yes, there is a Linux version); check out http://www.realaudio.com).
    Or

    maybe you''re a dedicated gamesperson and you want to experience the audio

    gore of DOOM. Or maybe you want to play musical CDs using some of the tools

    we discuss in Chapter 4.


    To add sound support, you''ll want to recompile a Linux kernel

    specific to your needs, a process we explained earlier in the section

    titled "Recompiling a Kernel." In step 2 of that process, you''ll be

    asked to specify components that you''ll need. There will be a line

    at process requiring a positive response from you:


    ```

    Sound card support (CONFIG_SOUND) [M/n/y/?]

    ```


    You answer y (for yes).


    After that process is completed, another configuration script will be

    run, going through a list of sound cards and asking you to specify your

    sound card. The questions are very specific; you''ll be asked about every'
