    # Installing Linux from the Setup Program


    Now comes the fun part: actually installing Linux. For this, you''ll run the setup
    command from a command line:


    ```

    # setup

    ```


    You''ll then see a menu with the following choices:


    | HELP | Read the Slackware Setup Help file |

    | KEYMAP | Remap your keyboard if you''re not using a US one |

    | MAKE TAGS | Experts may customize tagfiles to preselect files |

    | ADSWAP | Set up your swap partition(s) |

    | TARGET | Set up your target partition |

    | SOURCE | Select source media |

    | DIS SETS | Decide which disk sets you wish to install |

    | INSTALL | Install selected disk sets |

    | CONFIGURE | Reconfigure your Linux system |

    | EXIT | Exit Slackware Linux Setup |


    You should first look through the help file, which is listed first. Some of the
    steps presented therein may assist you in the Linux installation process.


    To move through the selections in this menu, you use the cursor (arrow) keys or
    type the first letter in each line (such as H for help).


    Basically, the installation from CD-ROM is pretty simple. It follows these steps:'
  merge: -1
