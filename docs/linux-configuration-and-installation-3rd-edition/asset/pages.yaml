  md: '# CHAPTER 5: Linux Applications 277


    There are some things to note when using **groff**:


    +   - **Groff** automatically fills the right margin, even if you insert your
    own carriage returns in the text document. To stop this from happening, insert
    **.nf** at the beginning of the document; this is short for no fill.

    - **Groff** automatically justifies the text; spaces between words are increased
    to allow the text to be stretched across the page. We''re not fans of this spacing.
    Since it results in some awkward-looking lines, especially when you''re working
    with longer words. We usually tell **groff** to stop justifying the text, which
    means inserting **.ad** command at the beginning of the file.

    - As you can tell from Figure 5.9, we tagged some bold and italic words that begin
    with **\f**; for example, the **\fb** command turns on bold formatting, while
    the **\fl** command turns on italic formatting. These commands stay in effect
    until you explicitly them off with the **\fr** command.

    - The first line of the little message is in 12-point type, as opposed to the
    10-point type used in the rest of the message. The **\s** command, followed by
    a number, enters the point size. (This is valid only for devices that can handle
    different point sizes, of course; older printers do not.)

    - Dot commands must appear on their own line; these lines won''t appear at all
    in the document. Backslash commands, on the other hand, can appear anywhere in
    the document.


    Some useful **groff** commands are listed in Table 5.5.


    As always, you can check out the online **man** page for a command by specifying
    it on the command line:


    ```

    gilbert:~$ man groff

    ```


    # Creating Man Pages with Groff


    Programmers or system administrators on larger systems will want to check out
    the use of **groff** to create online-manual pages. To create them, you''d go
    through the same document-creation process found in the previous section: formatting
    pages in **elvis** or **emacs** and then running the'
  merge: -1
