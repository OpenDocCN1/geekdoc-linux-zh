  md: '# CHAPTER 2: Installing Linux 83


    # Miscellaneous Installation Notes


    At this time you can configure your Linux box for use on the network. However,
    because this is an advanced subject, we''ll skip it for now and revisit it in
    Chapter 8.


    There might be other configuration options presented to you, depending on what
    you installed (for example, if you installed sendmail, there will be a query regarding
    its installation). Again, these tend to be advanced topics, so we''ll revisit
    them throughout the course of this book.


    Now that the installation is finished, it''s time to actually run Linux. Before
    we get to that point, however, we''ll discuss some alternate installation methods.


    # Other Installation Methods


    You may run into situations where you are able to access a CD-ROM drive from DOS
    but not from Linux''s installation process. (This will happen if a SCSI card is
    not supported by Linux but there are drivers available for DOS or OS/2.) If this
    occurs, you can still use the accompanying CD-ROM for installation, but you''ll
    need to copy the files to your hard drive, floppy disks, or a tape drive. All
    three types of installation are explained here.


    # Installing from Hard Drive


    This installation method involves moving installation files from the CD-ROM to
    a DOS hard disk partition and installing from there. This must be a straight DOS
    partition, not altered via a disk-doubling technology such as the disk doubler
    in MS-DOS 6.x or Stacker.


    You''ll need to replicate the file structure from the CD-ROM on the DOS partition,
    keeping intact the many subdirectories (A1, A2, and so on).


    When you run the setup program and specify the source of the installation files,
    you''ll choose a hard disk partition instead of a CD-ROM.'
