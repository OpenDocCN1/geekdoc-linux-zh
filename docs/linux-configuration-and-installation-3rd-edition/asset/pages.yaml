    # Using Cat


    The **cat** command does so many things under the UNIX and Linux operating systems,
    it''s a wonder you don''t use it for everything. On a very basic level, **cat**
    can be used to view the contents of a file:


    ```

    gilbert:-$ cat filename

    ```


    where *filename* is the name of the file you want to view. For example, to view
    the contents of a file named **test**, you''d use the following command line:


    ```

    gilbert:-$ cat test

    This is our Linux test file. Big whoop.

    ```


    **Cat**, by default, displays its output to the screen. However, **cat** can be
    told to send its output elsewhere, which brings us to another of its many uses:
    It also be used to store a file under a different filename, in the manner of the
    **cp** command (which will be created later in this chapter). For example, to
    create another copy of the **test** file (which we''ll call **memo.kr**), you''d
    use the following command line:


    ```

    gilbert:-$ cat test > memo.kr

    gilbert:-$ ls

    memo.kr test

    ```


    In this example, **cat** uses the output from the **test** file as the input for
    the **memo.kr** file.'
