  md: '# CHAPTER I: Linux and PC Hardware


    # Preparing for Linux


    An ounce of preparation is worth a pound of cure, goes the old (and cliché, some
    would say) saying. However, there''s a kernel of truth to the old saying—particularly
    when it comes to installing and configuring Linux.


    Before you rush into a half-baked and ill-conceived Linux installation, there
    are a few things you should do, mostly relating to your PC''s setup and configuration.
    In this chapter, we will tell you if your PC is capable of efficiently running
    Linux and point out some potential problem areas. This should be handy if you''re
    thinking about installing Linux on an existing machine or if you''re considering
    the purchase of a new computer (laptop or desktop) for the express purpose of
    running Linux. In the next chapter, we will run through a typical Linux installation.


    We are PC-centric in our attitudes toward Linux. Linux was developed for PCs,
    and the vast majority of users work on PCs. The version of Linux on the accompanying
    CD-ROM is designed for a PC platform.


    However, there have been attempts to move Linux to non-PC hardware platforms—some
    of which have been quite successful. Appendix A lists the Linux ports to other
    platforms and ways to get more information about them.


    ![](img/05da311512608405596dd882623b9142_35_0.png)


    # Preparing Your PC for Linux


    All PC-based Unices (including SCO UNIX and BSD), Linux is pretty fussy about
    the hardware it runs on. By fussy, we mean that Linux does a lot of interacting
    directly with PC hardware. DOS, by comparison, is a very forgiving operating system,
    much more able to run and function on almost any PC. It will ignore some small
    flaws in the PC architecture.


    Linux, however, will expose those flaws. As a PC UNIX, Linux interacts very closely
    with the PC hardware, writing directly to the various PC components. If there''s
    a problem with your PC—however small—Linux will find it. The problem is somewhat
    lessened if you''re using brand-name equipment; remember (as mentioned in the
    Introduction) that Linux is a product of a virtual army of volunteers, and they''re
    like everyone when it comes to computer equipment—if half a million people bought
    a'
  merge: -1
  pgno: 35
- img_proc: true
  md: '# CHAPTER I: Linux and PC Hardware 5


    particular PC model from Compaq, chances are good that a Linux developer (or two)
    will be among the half-million buyers. This is how hardware gets supported under
    Linux; the most devout users make sure Linux works on their systems. It''s certain
    that someone out there will have experience with Linux on popular hardware—it''s
    less likely that someone out there will have experience on your sparking-new computer
    from NoNameClone Corp. in the strip mall on the outskirts of town.


    If you buy a PC from NoNameClone Corp., this puts an additional burden on you,
    you''ll need to know more about your PC than you ever thought. The ideal situation,
    of course, would be if you didn''t actually own a PC yet and you were putting
    together expressly to run Linux. (This is the way we approached it, in one instance.)
    A bad situation is if you bought a no-name clone from a local vendor and had no
    idea about its components. The worst situation is if you bought a no-name clone
    and were a UNIX workstation user, fairly ignorant of the quirks surrounding the
    PC architecture. A middling situation is if you bought a clone from the likes
    of CompUSA or Best and had decent documentation regarding the components.


    Because we don''t live in an ideal world, we''ll know little about your PC and
    need a primer on its components. We''ll run down both the minimal and ideal Linux
    PC configurations and give you a compatibility list.


    When buying a PC, the temptation is to spend as little as possible or try to squeeze
    by with lesser or inferior components. Understand the need to live on a budget—certainly
    don''t have thousands of dollars of computer equipment sitting around our home
    offices. But there comes a point when you need to make the necessary investment
    if you want to run Linux effectively. Too often we see people complaining in the
    Usenet newsgroups that Linux doesn''t run properly on their PCs or that FreeBSD8
    won''t run in high resolutions on their unsupported graphics cards. You can avoid
    this by taking an inventory of your PC before installing Linux (which may mean
    actually taking off the cover and physically poking through the components) or
    making sure a new PC meets the compatibility guidelines. Either action is a real
    pain, admit; by spending some time up front, you''ll avoid problems later in the
    installation and configuration process. You may be pleased with yourself after
    saving cash buying a new graphics card for NoNameClone Corp., but in the end you''re
    better off paying a little more for hardware that''s been thoroughly tested by
    the huge number of existing Linux users.


    ![](img/05da311512608405596dd882623b9142_36_0.png)'
