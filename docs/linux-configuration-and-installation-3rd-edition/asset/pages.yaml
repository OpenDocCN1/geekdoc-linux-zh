  md: '# 66 CHAPTER 2: Installing Linux


    This is the DOS partition you created in the previous sections.


    Before you actually create the Linux partition, you should decide if you want
    to install a swap partition.


    # Linux and a Swap Disk


    If you are using a PC with 46 megabytes of RAM, you may want to set up a swap
    partition. This partition is treated by the system as extended RAM; if you run
    low on memory (and with 4 megabytes of RAM, you''re guaranteed to), Linux can
    treat this hard disk section as RAM, or virtual memory. You''ll take a performance
    hit, as a hard disk will always be slower than real RAM, and you''ll have the
    joy of watching your hard disk churn furiously when you try to use it. However,
    a swap partition can be used only for swap space by Linux; it can''t be used for
    any other storage. Therefore, you need to weigh your RAM needs versus your hard
    disk storage needs, keeping in mind that Linux should have as much hard disk territory
    for storage as possible.


    You may also want to consider a swap partition if you have more than 4 megabytes
    of RAM. We''ve found that XFree86 is a little tight when running under only 8
    megabytes of RAM, and some swap space can''t hurt, especially if you have a very
    large hard disk (XFree86 won''t tell you that it''s low on RAM; it will simply
    refuse to do anything, such as failing to load an application.) Some Linux experts
    recommend that you have 16 megabytes of virtual memory. If you have only 8 megabytes
    of RAM, this would mean that you would want to set up at least 8MB swap partition.


    If you want to create a swap partition, read on. If you don''t, you can skip to
    the next section, "Creating the Main Linux Partition."


    Your first move is to create a swap partition with the fdisk command. You''ll
    need to decide how large to make this partition. That will depend on how much
    free space you think you can give up on your hard drive. For the purposes of this
    chapter, we''ll devote 10 megabytes to swap space.


    Run the fdisk command and choose the n option, for creating a new partition. You''ll
    see the following:


    Command action


    +   -e extended


    +   -p primary partition (1-4)'
