    ```


    However, if you run the command with the -a option, you''ll see the following:


    ```

    gilbert:$ ls -a

    ./ .bash_history .kermrc .lessrc

    ../ .emacs .less .term/

    ```


    The files beginning with the period (.) are called hidden files. Actually, they''re
    not so hidden as to be mysterious; they''re merely hidden when you use the ls
