  md: '# CHAPTER I: Linux and PC Hardware 23


    # Other Devices


    These days, it''s hard to buy a PC that''s not gussed up with a slew of additional
    components, such as sound boards and network cards. In this section, we''ll run
    down the most popular of the add-ons and other miscellaneous components.


    # Sound Boards


    Linux supports a wide range of sound cards, including: 6850 UART MIDI; Adlib (OPL2);
    Audio Excell DSP16; Aztec Sound Galaxy NX Pro; cards based on the Crystal CS4232
    (plug-and-play); ECHO-PSS (Orchid SoundWave32, Cardinal DSP16); Ensoniq SoundScape;
    Gravis Ultrasound; Gravis Ultrasound 16-bit sampling daughter; Gravis Ultrasound
    MAX; Logitech SoundMan Games (Jaz16/OPL4); Logitech SoundMan Wave (Jaz16, 44kHz
    stereo support); Logitech SoundMan 16 (PAS-16 compatible); MPU-401 MIDI; MediaTrix
    AudioTriX Pro; Media Vision Premium 3D DAC (Jaz16); Media Vision Pro Sonic 16
    (Jazz); Media Vision Pro Audio Spectrum 16; Microsoft Sound System (AD1848); OAK
    OTI-061D cards (Mozart); Opti 82C928/82C929 cards (MAD16/MAD16 Pro); Sound Blaster;
    Sound Blaster Pro; Sound Blaster 16 (not plug-and-play!); Turtle Beach Wavefront
    cards (Maui, Tropez); and Wave Blaster


    In addition, the following sound boards can be coaxed into working Linux, provided
    you install the proper patches and drivers (which can be found at the annoying
    Internet addresses: ftp://sunsite.unc.edu/pub/linux/sound/mpu401-0.2.tar.gz; PC
    speaker/parallel-port DAC (ftp://informatik.hu-berlin.de/pub/linux/sound/); and
    Turtle Beach Multisound/Tahiti/Monterey (ftp://ft.cs.colorado.edu/users/mccreath/archive/beach/multisound).


    Not every feature on every sound board is supported, however. the ASP chip on
    Sound Blaster 16 series and AWE32 is not supported, and neither is the AWE32''s
    onboard E-mu MIDI synthesizer.


    Also, the Sound Blaster 16 with DSP 4.11 and 4.12 has a hardware bug that causes
    hung/stuck notes when playing MIDI and digital audio at the same time.'
  merge: -1
  pgno: 54
- img_proc: true
  md: '# CHAPTER I: Linux and PC Hardware


    Why would you use a sound board and Linux? Well, Doom works much better when there''s
    sounds of agony to accompany the splattering bits of blood and brain tissue. In
    addition, there''s a new breed of Internet audio software that''s actually supported
    for use under Linux. Some of it''s actually pretty cool, such as the Real Audio
    real-time audio decoder. We''ll be covering sound, Linux, and the Internet throughout
    the course of this book.


    # Mouse and Joystick


    We''ve used various mice with Linux, mostly under the auspices of the X Window
    System. Basically, if you use a serial mouse with Linux and MultiMouse, you''ll
    just be telling the system to look to a specific serial port for the mouse. (You''ll
    learn this in Chapter 2 and the Linux installation.) The same goes for trackballs
    and joysticks that run off a serial port. The following mouse models are explicitly
    supported under Linux: Microsoft serial mouse, Mouse Systems serial mouse, Logitech
    Mouseman serial mouse, Logitech serial mouse, TI Import mouse, C&T 82C710 QuickPort;
    used on Toshiba, TI Travelmate laptops), Microsoft busmouse, Logitech busmouse,
    and the PS/2 (auxiliary device) mouse.


    To use other mouse models, you''ll need to grab a patch. This would include the
    Sejin-mouse (the patch is at ftp://sunite.unc.edu/pub/Linux/kernel/patches/console/jmouse.1.70-jmouse.tar.gz)
    which uses multiple devices as a single mouse (the patch is at ftp://sunite.unc.edu/pub/Linux/system/MultiMouse-1.0.tgz).


    If your joystick doesn''t work, you may want to check out one of the joystick
    drivers at ftp://sunite.unc.edu/pub/Linux/kernel/patches/console/joystick-0.7.tgz
    or ftp://sunite.unc.edu/pub/Linux/kernel/patches/joyfixed.tgz.


    In addition, touchpads that emulate a mouse (like the Glidepoint) should work
    if they precisely emulate a supported mouse.


    # Printers


    Essentially any printer connected to a parallel or serial port that works under
    DOS should work under Linux. During the installation, you''ll be asked to specify
    which port contains the printer. There are special'
  merge: -1
  pgno: 55
- img_proc: true
  md: '# CHAPTER I: Linux and PC Hardware 25


    programs that enhance the basic printing capabilities. HP LaserJet 4 users can
    grab free-lj4, a printing modes control program, at ftp://sunsite.unc.edu/pub/Linux/system/Printing/free-lj4-1.1p1.tar.gz,
    while using the BiTonic parallel port interface can grab a program at ftp://sunsite.unc.edu/pub/Linux/kernel/misc/bbt-ALPHA-0.0.1.tar.gz.


    The issue comes a bit trickier when dealing with XFree86 and Ghostscript, the
    utility used to create and print PostScript documents. Ghostscript allows you
    to print PostScript-formatted documents on non-PostScript devices; much of the
    UNIX documentation that flows down the pike is formatted with PostScript, and
    this capability is very handy. Ghostscript supports the following printers: Apple
    Imagerwriter, C. It M8510; Canon BubbleJet BJ10e, BJ200, LBP-81I, and LIPS III;
    DEC LA50/70/75/75plus, LN03, and LJ250; Epson 9 pin, 24 pin, LQ series, Stylus,
    and AP3250; HP 256B, Designjet 650, Deskjet/Plus/500, Deskjet 500C/550C/1200c
    color, LaserJet/Plus/III/IV, and PaintJet/XL/300 color; IBM Jetliner printer and
    Proprinter; Imagen Imp; Mitsubishi CP50 color; NEC P6/P6+/P60; Okidata MicroLine
    128; Ricoh 4081; SPARCprinter; Starlet 48 inkjet printer; Tektonik 4693d color
    2/4 bit and 4695/4696 inkjet plotter, and Xerox XES printers (2700, 3700, 4045,
    etc.). Those using the Canon B600 and Epson ESC/P color printers can grab a printer
    program at ftp://petole.imag.fr/pub/postscript.


    > Ghostscript will be covered in much more detail in Chapter 5.


    ![](img/05da311512608405596dd882623b9142_56_0.png)


    # Scanners


    Linux right out of the box doesn''t support any scanners. However, several folks
    have contributed scanner drivers and programs to the Linux community, and there
    may be a program available on the Internet for your particular scanner. (Be warned
    that some of the products listed here are commercial products.) Scanners with
    support software available include: A4 Tech AC 4096 (ftp://informatik.hu-berlin.de/pub/linux/ac4096.tgz),
    Epson GT6000 (ftp://sunsite.unc.edu/linux/scanners/ppic0.5.tar.gz), Genius GS-B105G
    (ftp://lsx-11.mit.edu/pub/linux/ALPHA/scanner/gs105-0.0.1.tar.gz), Genius'
