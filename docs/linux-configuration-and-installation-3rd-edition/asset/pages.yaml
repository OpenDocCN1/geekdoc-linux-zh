  md: '# CHAPTER 2: Installing Linux


    # Working with PCMCIA Devices


    The Slackware installation prompts you for the installation of PCMCIA devices
    with Card Services. This will save you many steps that are best avoided, such
    as the recompilation of a kernel.


    In fact, one of the nicest things about Card Services is that it''s relatively
    painless (thanks to David Hindi for his work on this) after you''ve installed
    a kernel. During the boot process, Card Services will avoid hardware conflicts
    and work with a wide range of PCMCIA devices automatically. The trick, of course,
    is to use a PCMCIA device that generally conforms to PCMCIA standards. In our
    experience, most new hardware conforms to these standards, but some older laptops
    were more liberal with their interpretation of PCMCIA support.


    If your PCMCIA device doesn''t work, you''ll need to look through the excellent
    PCMCIA-HOWTO on the first CD-ROM for information about recompiling a new kernel
    and adding support.


    # Working with a UPS


    Slackware supports uninterruptible power supplies, or UPSes. This support is rather
    easy to implement. First get a UPS, hook it up to your PC, and then run a Linux
    daemon called powerd that monitors the power situation and shuts down the system
    if necessary. (It will also halt the shutdown if the power appears in time).


    For more information, check out the man page for the power command and the UPS-HOWTO
    on the first CD-ROM.


    # Adaptive Technologies and Linux


    After the Americans with Disabilities Act (ADA) was passed, the corporate world
    was forced to use adaptive technologies to open the workplace to all qualified
    workers. Linux supports a number of ways to implement adaptive technologies. Some
    involve changing the settings on existing Linux tools, while others use special
    software tools, like xzoom, to magnify a portion of the screen, and emacspeak,
    to read the contents of a document in emacs (both of which we''ve included on
    the second CD-ROM).'
  merge: -1
  pgno: 138
- img_proc: true
  md: 'More information about adaptive adaptive technologies can be found in the ADAPTIVE-HOWTO
    document on the first CD-ROM.


    # Using Linux with Ham Radio


    Amazingly enough, Linux is one of the few operating systems that will work smoothly
    with ham radio (Think of ham radio as an airborne precursor to the Internet, if
    you''re unfamiliar with the concept.) You''ll want to check out the AV25-HOWTO
    (found on the first CD-ROM) for more information.


    # Making Linux Work with Your Language


    As English-speakers assume that the rest of the world speaks English (you probably
    do, to some extent at least, if you''ve gotten this far). However, if you''re
    not a native English-speaker and want to adapt Linux for your own language, you
    may want to check out the many HOWTOs on the first CD-ROM.


    Languages covered in specific HOWTOs include: Cyrillic (used in Russia), Danish,
    Finnish, German, Hebrew, Polish, and Portuguese.


    # Summary


    This chapter covered Linux installation and configuration. Basically, the process
    is:


    +   * Create boot and root floppies.

    * Prepare your hard drive for installation with DOS utilities.

    * Boot Linux from boot and root floppies.

    * Prepare your hard drive for installation with Linux utilities.

    * Install Linux from the CD-ROM.'
