    http://lwrc.epfl.ch/linux-atm.


    # Frame Relay Cards


    Work has been done on a driver for the Sangoma S502 56K Frame Relay

    card. You can grab a copy from ftp://ftp.sovereign.org/pub/wan/fr/.'
