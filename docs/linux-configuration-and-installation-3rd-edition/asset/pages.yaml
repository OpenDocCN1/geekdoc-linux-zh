  md: '# CHAPTER 7: Linux and Telecommunications


    One nice feature of Minicom is its scripting capability. While the script itself
    can be a shell script (the documentation explains how to implement this), Minicom
    allows you to set up a password with the script, preventing unauthorized usage
    of the script within Minicom. Having said this, there are some other acknowledged
    security issues with Minicom, mostly relating to its running in superuser mode.
    If security is an issue in your Linux system, you may want to rethink Minicom.


    The online-manual page for minicom is quite extensive and can probably answer
    any questions you have.


    # Using Rzsz


    If you''re a PC user and have dabbled in telecommunications, you''ve probably
    worked with software packages that did everything: managed the dialup and login
    process, oversaw the file transfers, and essentially centralized all of serial
    communications. However, Linux—being the good UNIX workalike that it is—features
    different tools for accomplishing the same thing. Dipping into the UNIX software
    chest, we can come up with a few commands that allow serial communications without
    needing any fancy programs—or even an interface, for that matter.


    The UNIX cu command is used to call another computer system. If you''re working
    on a stand-alone system, you''ll probably want to use Minicom or Seymour, but
    if you''re working on a network that has UUCP already configured, you can use
    the cu command (which is a UUCP command) for making the initial connection.


    Once you''re connected to a remote system, you can use the rzsz set of commands
    to upload and download documents. Essentially, these commands implement the Zmodem,
    Ymodem, and Xmodem protocols from the command line, assuming that a valid connection
    has been made. In addition, the remote host must support the protocol you want
    to use. As Zmodem is already popular among most online services and bulletin-board
    systems, it''s useful to have.


    There are actually six commands in the rzsz distribution. As they differ slightly
    from other rzsz distributions (the man pages and online help messages don''t match),
    we''ll list them here and then further explain each of them:'
  merge: -1
  pgno: 423
- img_proc: true
  md: '# CHAPTER 7: Linux and Telecommunications 393


    +   - rz or lrz receives files via Zmodem from a remote host.

    - rb or lrb receives files via Ymodem from a remote host.

    - rx or lrx receives files via Xmodem from a remote host.

    - sz or lsz sends files via Zmodem to a remote host.

    - sb or lsb sends files via Ymodem from a remote host.

    - sx or lsx sends files via Xmodem from a remote host.


    The skinny on each of these commands, the -h option to the command (additionally,
