    # Linux and Passwords


    When you added a user account, you set up a password for that account. Depending
    on your usage, the password you select or may not be important. On the one hand,
    it''s nice to have some security on a machine containing all your work, even if
    only to deter the mischievous actions of a fellow family member. On the other
    hand, you don''t want to be messing with an obscure (and forgettable) password,
    especially if you won''t be using Linux every day.


    So the choice about your password is really yours. If you''re installing Linux
    in a corporate environment, however, you should follow these basic rules regarding
    passwords:


    +   * Your password must be longer than two characters, but generally not more
    than eight characters long. In addition, it must begin with a lowercase letter.


    +   * Always use a password longer than six characters. The longer the password,
    the harder it is to hack.


    +   * Don''t use a password based on personal information. You may think it''s
    clever to use your dog''s name as a password, but anyone who knows you can make
    an informed guess about your password. Similarly, don''t use your spouse''s name,
    your lover''s name (however romantic it may be), your middle name, your job title,
    or any other available information about you.


    +   * Don''t use a word that can be found in a dictionary. Hackers have been known
    to throw a computer-based dictionary at login prompts, waiting for one of the
    words to open the door.


    +   * Make your password is memorable but meaningless to anyone but you. Let''s
    say that Kirby Puckett is your favorite baseball player. You were ecstatic the
    last time the Twins won the World Series. Put them together and you have puck1991
    as a password.


    +   * There''s a time-honored trick in the UNIX world to combine an easily remembered
    password with the vagaries of system security. First, choose a word that you know''ll
    remember, like the aforementioned kirby. Then look at your keyboard. For your
    real password, use the keys to the upper left of the keys for our word. In this
    case, the password becomes u84g6.'
