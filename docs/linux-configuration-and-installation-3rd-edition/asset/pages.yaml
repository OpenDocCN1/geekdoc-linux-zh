    # Other Linux Telecommunications Tools


    If none of these serial telecommunications tools strikes your fancy, you can peruse
    wider offerings on the Internet for more appropriate tools. Always popular, yet
    difficult to use and set up, is C-Kermit (available from the official kermit.columbia.edu
    FTP site, in the /kermit/c-kermit directory. Be warned that you will need to use
    a makefile to create a version for Linux.


    Another option is the pcomm telecommunications package. This package is essentially
    a Linux walkalike to the popular DOS/Windows Procomm, featuring a dialing directory,
    interactive usage, and more. We''ve included it on the second CD-ROM, or you can
    grab it from the ftp.cecer.army.mil FTP site, in the pcomm directory.


    # Summary


    This chapter covered serial communications under the Linux operating system, focusing
    on packages like seyon, minicom, xminicom, and the rzsz utilities.


    The next chapter covers networking and Linux.'
