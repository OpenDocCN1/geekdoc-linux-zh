- img_proc: true
  md: '# CHAPTER 6: Basic Linux System Administration


    # Removing LILO


    There are several ways to remove LILO. The version of LILO on the CDROM allows
    you to remove it from the boot sector with the following command line:


    ```

    gilbert~$ lilo -u

    ```


    A better way may be to use the following command when running DOS:


    ```

    C:> FDISK /MBR

    ```


    This tells DOS to install DOS, not LILO, as the controller of the MBR.


    # Scheduling Events


    Linux features a number of system-administration tools that allow you to schedule
    events at specific times; for example, you may want to schedule a system backup
    in the middle of the night. These tools are covered in the next few sections.


    # The Nice Command


    Sometimes you''ll run a command and not care too much when it''s completed, such
    as when you issue a command right before you leave for lunch. When time is not
    of the essence—especially on large, multiuser systems that may not contain quite
    enough hardware firepower to support so many users—you may want to use the nice
    command in conjunction with other commands, so named because you''re nice to the
    system. Use it at the beginning of the command line:


    ```

    gilbert~$ nice command filename

    ```


    For example, if you''re performing an extremely complicated sort with many files,
    you may want to launch the sort using nice before that typical two-hour lunch.'
  merge: -1
  pgno: 393
- img_proc: true
  md: '# CHAPTER 6: Basic Linux System Administration 363


    # The At Command


    Of course, some lunches can expand to three or even four hours, depending on the
    libations involved. If you''re not sure you''ll be back in the office to run an
    important command, you can use the at command.


    Seriously, you''re more likely to use the at command to relieve pressure on the
    system by running system-intensive commands in the middle of the night, to send
    mail messages long-distance charges when rates are lowest, or to back up a large
    hard disk at some regular interval.


    Using at is simple, as you first specify a time for execution, followed by the
    command line. To set up a specific command, type the following:


    ```

    gilbert:-$ at 1am

    ```


    At is very flexible about defining the time when the command is to run; you can
    use a time, as in our example, or you can use a more precise number based on military
    time.


    After you hit the Enter (or Return) key, you''ll be placed on the next line, without
    a prompt. As you recall, there are exceptions.) This is the Linux method of asking
    for additional input. (Usually, anyway; there are exceptions.) This is where you
    provide the command that at is to execute; end each command by hitting the Enter
    (or Return) key. When you''re finished, type Ctrl-D.


    The system''s response is a single line of information that confirms when the
    command (designated by the system with a job-ID of many digits) will be run. This
    job-ID is very valuable information. Should you need to see a list of pending
    job-IDs, use at with the -l option:


    ```

    gilbert:-$ at -1

    ```


    If you want to cancel a pending command scheduled with at, use at with the -r
    (remove) option:


    ```

    gilbert:-$ -r job-ID

    ```


    For procedures you need to perform again and again, cron, covered later in this
    chapter, is likely to be a better tool than at.'
  merge: -1
  pgno: 394
- img_proc: true
  md: '# The Batch Command


    The `batch` command combines many commands into one command line, which is then
    run in the background without any prompting of your part. Use `batch` as follows:


    ```

    gilbert:-$ batch

    ```


    End the command by hitting the **Enter** (or **Return**) key. As with at, you''ll
    be placed on a new line, as batch waits for additional input. Go ahead and type
    in the commands, ending each by hitting the **Enter (or Return)** key. When you''re
    finishing entering commands, type **Ctrl-D**.


    You''ll then be presented with a command prompt, so go ahead with your work as
    your batch commands are quietly executed by the system. If your commands require
    some sort of confirmation message or output delivered to you, the message will
    be conveyed as a mail message; you won''t find messages popping up on your screen
    while you''re in the middle of some other action.


    Elsewhere in this book, we have discussed running programs in the background using
    the ampersand. There are some fundamental differences between background tasks
    and **batch**:


    +   - Commands issued to `batch` are accorded even less priority than commands
    run in the background.


    # The Cron Command


    System administrators have all the fun—used to, anyway, as evidenced by the `cron`
    command. `cron` started life as a tool for system administration, allowing the
    system administrator to schedule regular tasks unattended.'
  merge: -1
  pgno: 395
- img_proc: true
  md: '# CHAPTER 6: Basic Linux System Administration 365


    Why use cron? As we said earlier, it allows you to schedule regular tasks unattended.
    You may want to back up your data to tape drive weekly, or even daily. You may
    want to send yourself a mail message to remind you of important noncomputer chores.
    Or you may want to send electronic mail to other Unix systems at night when the
    long-distance rates are lower.


    In some ways, the at command accomplishes the same as the cron command. So why
    may you use cron? Because you can set it up to perform regular tasks. With at,
    you can only set up a single task to be performed at one specific time. Because
    at is much easier to use, we recommend using it in one-time situations, and use
    cron in repetitive situations.


    There are two parts to cron: the crontab file and the actual cron command. We''ll
    cover each.


    # Creating a Crontab File


    As we said earlier, the crontab file contains the tasks that are to be performed
    regularly. You have your own personal crontab file, stored in the /usr/lib/crontab
    directory. Such a file is not created automatically when you install Linux; it''s
    up to you to create the file—though not directly. The crontab file installation
    and the structure of the actual file can be confusing.


    You can use vi or emacs to create a crontab file. However, you can''t save the
    file directly in the /usr/lib/crontab directory; instead, you must save it under
    a different name and use the cron command to install it. We''ll guide you through
    a typical file creation and installation.


    There are six fields to a crontab file, each separated by a space. The first five
    fields specify exactly when the command is to be run; the sixth field is the command
    itself.


    Let''s say that we wanted to run a command every morning at 8:30 a.m. The structure
    of the crontab line looks something like this:


    ```

    30 8 * * command

    ```


    The exact values associated with the five fields are listed in Table 7.1.'
  merge: -1
  pgno: 396
- img_proc: true
  md: '# 366 CHAPTER 6: Basic Linux System Administration


    Table 7.1 Fields in a Crontab


    | Field | Meaning |

    |---|--|

    | 1 | Minutes after the hour |

    | 2 | Hour, in 24-hour format |

    | 3 | Day of the month |

    | 4 | Month |

    | 5 | Day of the week |


    Some things to note when creating a crontab file:


    +   * Asterisks (*) are used to specify when commands are to be run in every instance
    of the value of the field. An asterisk in the third field means to run the command
    every day of every month, an asterisk in the fourth field means to run the command
    every month, an asterisk in the fifth field means to run the command every day
    of week.

    * Days of the week are referenced strangely. The week begins with a 0 for Sunday
    and ends with a 6 for Saturday. (Computer people, especially on UNIX, are famous
    for starting to count with 0 rather than the more common 1 used by others.)

    * Times are specified in military (24-hour) time. Thus 10 p.m. is specified as
    22.

    * Ranges can be specified, instead of specific days and times. For example, you
    can perform the command only on the 15th and 30th days of the month by using 15,30
    in the third field. (Just make sure you adjust it in February.) Or you can specify
    that a command can be run only in the fall months by using 10-12 in the fourth
    field. These two methods can be combined: running a command in spring and fall
    means using 4-6,10-12 in the fourth field.


    After creating our crontab file (which must be saved under a filename of anything
    but crontab; we''ll call it ourfile), we can then install it, using the crontab
    command:


    ```

    gilbert:-$ crontab ourfile

    ```'
  merge: -1
  pgno: 397
- img_proc: true
  md: '# CHAPTER 6: Basic Linux System Administration


    Cron takes ourfile, copies it, and saves the copy under our username in the /usr/lib/crontab
    directory, with a filename of /usr/lib/crontab/username. If we want to make changes
    to our cron configuration, we must edit our original file (which still exists—remember,
    cron only makes a copy) and then reinstall it crontab. If we want to totally remove
    the file, we must use the crontab command with the -r option:


    ```

    $ crontab -r

    ```


    To prevent mischief or some unintended damage, we are allowed access to only our
    crontab file.


    # Some Crontab Examples


    The crontab -l command lists the crontab entry for your username. For example:


    ```

    gilbert:- crontab -l

    15 3 * * /bin/sh /u/erc/my_backup

    ```


    In this example, every night at 3:15 a.m., cron will invoke the Bourne shell,
    sh, and execute a shell script my_backup that is stored in the /u/erc directory.
    Presumably, this script will back up certain directories to tape. The reason it''s''
    performed at 3:15 is because at this time the machine is mostly idle.


    If you only wanted to back up on Mondays, you''d use the following crontab entry:


    ```

    15 3 * 1 /bin/sh /u/erc/my_backup

    ```


    Again, we''ve left the time to execute the script at the arbitrary time of 3:15
    a.m.


    If you wanted to only perform backups on the first and fifteenth of each month,
    you could use the following crontab entry:


    ```

    15 3 1,15 * /bin/sh /u/erc/my_backup

    ```


    This ends our discussion of scheduling tasks under Linux.'
  merge: -1
  pgno: 398
- img_proc: true
  md: '# More on Multitasking


    We discussed running commands in the background briefly in Chapter 4. This is
    where we extend that discussion.


    Multitasking is a fancy computer-speak way of saying the operating system can
    do more than one thing at a time. While this may seem like a simple matter, it''s
    really not; personal-computer users have been screening for a multitasking operating
    system for (seemingly) years (though, ironically, for the most part OS/2, which
    handles multitasking in much the same manner as Linux).


    Linux documentation doesn''t often use the term multitasking (even though the
    rest of the computer world uses it); instead, Linux is said to be multiprocessing—the
    same thing described differently. When you run a Linux command, like Is or cat,
    you''re running a process. When you boot the Linux operating system, you are actually
    launching a series of processes without consciously doing so. (If you use a graphical
    user interface like the X Window System, you''re launching many processes.) On
    a larger multitasking system, there may be literally thousands of processes running
    at a given time.


    These processes compete with each other for resources. Running programs in the
    background, as described earlier, is a way for the Linux user to allocate resources
    efficiently. Such allocation is necessary to keep the system from bogging down,
    especially a large multiuser system if there are more processes running than can
    fit in your system''s random-access memory (RAM). Then Linux uses a hard disk
    as extended RAM in an action called swapping to disk. (You''ve already leaned
    about a swap partition in Chapter 2; in this chapter we''ll discuss how to set
    up a swapfile after Linux has been installed.) However, hard disks are much slower
    than RAM, so swapping to disk is not the most desirable of solutions; but on,
    PC, it may be the only solution you have.


    As we said, it''s important for the Linux system and to efficiently allocate resources.
    Linux does this (as it does almost everything else) in hierarchical fashion: Processes
    beget other processes (much as directories contain subdirectories), with one process
    at the top of the pyramid. When a process launches another process, it uses a
    system call entitled for a fork, which creates the new process.'
  merge: -1
  pgno: 399
- img_proc: true
  md: '# CHAPTER 6: Basic Linux System Administration 369


    When you boot a Linux system, the first process (process 1) launches a program
    called *init*, which then launches other processes. *Init* is the mother of all
    Linux processes—or, as referred to in Linuxdom, *init* is a parent to other resources,
    which in turn act as a parent to additional resources, *child* processes. *Init*
    is ultimately, the ancestor of all processes running on the system.


    When we described the shell and its importance in running programs for you, we
    were referring to the shell acting as the parent and managing child processes.
    Unless you tell it otherwise (by issuing the *kill command*), the shell waits
    while you run a child and finishes or dies. Telling it otherwise is accomplished
    through several means, background not the most common.) If a child process dies
    but this fact is not acknowledged by the parent, the child process becomes a *zombie*.
    What macabre imagery!


    It''s up to the operating system to keep track of these parents and children,
    making sure that processes do not collide. This means scheduling processes within
    a fraction of a second, ensuring that all processes have access to precious CPU
    time. It''s also up to the operating system, through the *init* program, to manage
    child processes that have been abandoned by their parents. These abandoned processes
    are called *orphans*. (Family values obviously play an important role in the Linux
    operating system, as they do in the Republican Party.)


    Although we have mockingly referred to the high level of abstraction associated
    with the UNIX operating system, using names like parent, zombie, and child to
    describe the various stages of processes is a very useful thing; it helps both
    users and programmers visualize very intangible actions.


    To see what processes are running on your system, use the ps command:


    ```

    gilbert:~# ps

    PID TTY STAT TIME COMMAND

    49 v02 S 0:00 /sbin/getty tty2 38400 console

    50 v03 S 0:00 /sbin/getty tty3 38400 console

    51 v04 S 0:00 /sbin/getty tty4 38400 console

    52 v05 S 0:00 /sbin/getty tty5 38400 console

    53 v06 S 0:00 /sbin/getty tty6 38400 console

    ```'
  merge: -1
