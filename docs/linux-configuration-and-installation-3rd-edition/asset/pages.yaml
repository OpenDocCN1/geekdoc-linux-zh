  md: '# # Summary


    This chapter outlined the hardware requirements for running Linux. Linux actually
    runs on a wide assortment of PC hardware, which tends to be unusual for PC UNIX.
    Still, there are many places where you may be tripped up by an oddball or misadvertised
    component, bringing your nascent Linux experience to a screeching halt. The point
    of this chapter was to highlight any potential problem areas and to give you some
    guidance if you''re thinking about buying a new or used computer expressly for
    Linux and want to know what hardware to purchase.


    In the next chapter, we''ll cover a typical Linux installation from beginning
    to end.'
