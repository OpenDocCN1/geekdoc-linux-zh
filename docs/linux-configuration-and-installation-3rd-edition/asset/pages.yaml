    Although all the news items are text files and could in theory be read with vi
    or emacs, there are so many of them in so many separate files that it''s not really
    feasible to read each file. A full Usenet newsfeed, that is, all the incoming
    message files from all the worldwide newsgroups, adds more than 50 megabytes of
    files from your disk each day. (Remember when we said earlier that UNIX files
    seem to propagate proportionally? Well, there''s your example.) This is how a
    type of software, called readers, evolved. Newsreaders help you sort out, with
    varying degrees of usefulness, what to read from the hundreds of new files that
    appear daily. The basic idea is to read the messages you''re interested in and
    skip the rest. There''s simply no way'
