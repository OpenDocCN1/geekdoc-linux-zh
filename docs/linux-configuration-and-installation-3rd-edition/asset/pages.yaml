  md: '# CHAPTER 2: Installing Linux 77


    At this point there''s an option to install everything. Don''t do this, unless
    you designated a small group of disk sets to be installed and know that you indeed
    want to install everything.


    ![](img/05da311512608405596dd882623b9142_108_0.png)


    Linux will begin the installation. It will tell you what''s being installed, including
    mandatory packages. When it comes to a nonmandatory piece of software, it will
    stop and ask if you do want to install the software. (It also differentiates between
    software, noting if the installation is recommended—which means you really should
    install it—or optional.) An added bonus during this process is setup will tell
    you how much disk space the nonmandatory software will use (alas, there''s no
    overall reckoning of how much space the entire installation will use). Use the
    cursor keys to move between the Yes and No, and choose Enter to move.


    We''re not going to list every piece of software that can be installed; you can
    make most of these decisions on your own. However, there are some things to note
    as the disk sets are installed:


    +   Linux will install a kernel suited for your PC configuration; most of the
    precompiled kernels should meet the needs of most users. However, during the installation
    process, you''ll be asked about installing various kernels that are not applicable
    to your PC configuration. In fact, one of the first disk sets includes support
    for a Linux kernel lacking SCSI support. Because the setup doesn''t know anything
    about your hardware, it will ask if you want to install this kernel. In most cases,
    you''ll want to install the kernel from your bootdisk—setup gives you this option
    once all the packages are installed.


    +   During the installation process you''ll be asked whether you want to install
    a package called gpm, which manages the mouse for Linux running in character mode.
    This package can cause conflicts with the X Window System and its mouse control,
    if you planning on using X, you shouldn''t install this software. (However, if
    you don''t plan on using X, you should install gpm, because it allows you to use
    better the Midnight Commander, a useful text-based disk utility.)


    +   There are many text editors available in the Linux disk sets, including emacs
    and vi clones called elvis and vim. These should'
