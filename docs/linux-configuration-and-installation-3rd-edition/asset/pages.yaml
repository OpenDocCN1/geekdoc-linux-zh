- img_proc: true
  md: '# Xman


    We have spent much time referring to **xman** throughout the course of this book
    and have assumed that you know how to use it. Basically, **xman** is very simple.
    When you launch **xman** from an xterm window or from a fvwm menu, you''ll be
    presented with a small window. It''s from here you can summon a dialog box used
    to load an online **man** page, call for help, or quit the application. When this
    window is active, you can also use Ctrl-S to summon another dialog box used to
    actually load the page. This dialog box has a text-entry field in which you enter
    the command name and two buttons used to choose whether you want to search for
    the exact **man** page (Manual Page) or for something like the string you entered
    (Apropos).


    After you decide which **man** page to load, a new window appears with the rendered
    **man** page.


    # Sc and Xspread


    The **sc** command (designed to be run in command-line mode) launches a full-screen
    spreadsheet program. There''s actually a lot of complexity to **sc**, which you''ll
    learn about if you peruse the online **man** page:


    ```

    gilbert:$ man sc

    ```


    The **xspread** spreadsheet is based on the **sc** spreadsheet. Basically, it''s
    the mechanism for using **sc** in an X window.


    # Emulators


    You''ve got to hand it to the idealistic nature of the Linux community: It envisions
    a more perfect world, where no matter what operating system your software is written
    for, you should be able to use that software under Linux in some manner.'
  merge: -1
  pgno: 359
- img_proc: true
  md: '# CHAPTER 5: Linux Applications 329


