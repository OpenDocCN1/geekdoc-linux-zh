  md: '# 72 CHAPTER 2: Installing Linux


    +   * Set up swap space for Linux.

    * Tell Linux where you want it to be installed.

    * Select the source for the files needed to install Linux (in most cases, this
    will be the CD-ROM).

    * Select the software you want to install.

    * Actually install the software.

    * Configure the installed software.


    Each of these steps will be covered in its own section.


    > NOTE Before you get started on the installation steps, you should know that
    the Slack distribution of Linux supports many different keymaps for different
    languages and setups. If you want access to another language—say, German—or another
    keyboard layout—such as the Dvorak keyboard—you should select Keymap from the
    Setup menu.


    # Setting up the Swap Space


    As you''ve probably guessed by now, a lot of Linux installation involves an actual
    installation and then additional steps, telling Linux about the installation.
    This is certainly true if you''ve installed a swap partition. (If you have not,
    you can skip this step.) You''ve already installed the partition, made it active,
    and changed its type to a Linux swap partition. However, you don''t need to format
    this partition, as you''ve already done so with the `mkswap` command.


    # Selecting the Target for Linux


    This selection should be rather simple: You''ll want to install to the Linux partition
    you set up earlier in this chapter. When you select Target from the Setup menu,
    you''ll automatically be presented with this partition. This section covers the
    choices you''ll make; for the most part, you''ll want to go with the default choices.'
