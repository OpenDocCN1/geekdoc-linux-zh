  md: 'Linux contains a number of tools for compressing and archiving files, including
    gzip, zip, and gunzip, as well as the UNIX tar command (as implemented by the
    FSF, of course). These tools can be handy when grabbing software from the Internet,
    as well as when you want to create system backups to protect against disaster.


    Linux also features a number of tools specific to the PC architecture. These commands,
    called the MTools, allow Linux to access DOS-style parts of the PC, such as the
    floppy drive that contained a DOS-formatted floppy, as well as perform basic DOS
    functions, such as creating and deleting directories. These commands, by and large,
    are for use with the floppy drive.


    The chapter also included a discussion of various emulators: dosemu and xdos,
    which emulate the MS-DOS operating system, and WINE, which runs Microsoft Windows
    applications.


    The Slackware distribution of Linux also features more than a few games, including
    the popular DOOM and the golden oldie Tetris (in both character-mode and X Window
    versions).'
