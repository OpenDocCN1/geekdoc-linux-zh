  md: '# Look for these other MIS:SqlServer Series titles:

    Linux Programming

    The Linux Database

    Linux in Plain English

    The Linux Internet Server


    linux, the leading UNIX variant, garnered loads of attention within the community
    and beyond.

    The amazing thing about Linux is that you don''t need to work it in. This book
    brings the new third edition of this book the latest version of Slackware and
    additional security coverage. XFree8 and the Internet. Third Edition lets you
    run today... all you need is a PC, CD-ROM drive, and this book. Your 2-CD-ROM
    pack offers one of the most popular Linux distributions, Slackware, and comes
    directly from Patrick Volkerding. Together with Richard and Foster-Johnson, Volkerding
    provides with documented tips and techniques for setting up, and optimizing your
    Linux.


    What will you find on the 2 CD-ROMs?


    +   - Slackware 3.2, based on Linux 2.0.29, with kernels for most PC hardware
    configurations, including support for IDE/EIDE, SCSI, PCMCIA cards, tape drives,
    Jaz and Zip drives, and CD-ROMs

    - Full set of installation tools, including easy-to-use menus and tools for upgrading
    from older versions of Linux

    - Complete installation of XFree86 3.2 including installation and configuration
    utilities, window managers (fvwm, fwm), and X for most servers

    - Full TCP/IP connectivity for the Internet, corporate networks, and intranets

    - Complete ANSI and C+C programming suites

    - Tools for connecting your PC to the Internet and to online services with SLIP,
    CSIP, PPP, and dial-up serial programs

    - Internet emails including ftp, Usenet news readers, and Web browsers

    - All major GNU commands and applications, including GNU Emacs

    - Multimedia tools for working with image files, and MIME (multimedia email)

    - UNIX applications including Midnight Commander and the spreadsheet

    - More programming tools: Java SDK, Object C, Cifless, Te/Tk, Lisp, Fortran-77,
    Ada, Xforms

    - UNIX text editing and formatting tools (elvi, vim, joe, grove, tex, info) as
    well as hundreds of tools

    - Full suite of X applications, including Ghostscript, XP, XV, Xedit, Xfig, and
    Xrift

    - Support for IBC, which allows binaries created on other x86 UNIX variants to
    run under linux

    - Games including GNU chess, text, backgam, Asteroids, Lawyers, and more

    - Bonus programs: file managers, window managers, Web browsers, programming tools
    (Eiffel, Mesa, xforms), Microsoft Windows and MS-DOS emulators, and more


    You''ll be guided through a simple Linux step-by-step. You will learn about the
    many tools that make Linux a powerful operating system, including XFree86, GNU
    Emacs, and programming languages like C++, Perl, and Te/Tk. You''ll also learn
    how to operate the Internet and how to set Linux to coexist with other operating
    systems like DOS, OS/2, and Windows. Let Linux get you you running, and productive
    in time.


    PATRICK VOLKERDING is the creator of Slackware, the highly praised Linux software
    package included on 2 CD-ROMs with this book. KEVIN RICHARD AND FOSTER-JOHNSON
    are UNIX and Internet experts, computer authors. They have top-selling books on
    UNIX including Linux in Plain English and Te/Tk, UNIX third edition. Foster-Johnson
    is also a professional programmer with Perl, and Graphical Applications with Te
