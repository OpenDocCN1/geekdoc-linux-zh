- img_proc: true
  md: 'CHAPTER 3: Installing and Configuring XFree86 127


    # Automating the Configuration

    Process


    For a number of years, various programs have attempted to automate the difficult
    creation of XF86Config files. So far, though, all have failed miserably for us—that
    is, until the most recent versions and a program called x86config. For the first
    time, xf86config seems to create a workable XF86Config file, and we don''t even
    have any odd hardware.


    Before running xf86config, read over each of the following sections which describe
    the various parts of the XF86Config file that the xf86config program will be filling
    in. By having a greater understanding of the XF86Config file, your success rate
    with the xf86config program will be greater.


    Because of this, we will discuss each of the six sections and then cover using
    xf86config.


    # Setting Up Paths in the Configuration File


    The Files section is by far the easiest to set up in your X86Config file. That''s
    because just about everybody has the same paths. In the Files section, you need
    to tell X where the RGB (Red-Green-Blue) color database file is kept and where
    the fonts are located. Because both should go in standard locations, you can simply
    use the following section in your XF86Config file (in fact, the sample version
    already comes this way):


    +   Section "Files"

    - RgbPath "usr/X11R6/lib/X11/rgb*"

    - FontPath "usr/X11R6/lib/X11/fonts/misc/"

    - FontPath "usr/X11R6/lib/X11/fonts/Typel/"

    - FontPath "usr/X11R6/lib/X11/fonts/Speedo/"

    - FontPath "usr/X11R6/lib/X11/fonts/75dpi/"

    - FontPath "usr/X11R6/lib/X11/fonts/100dpi/"

    - EndSection'
  merge: -1
  pgno: 158
- img_proc: true
  md: '# CHAPTER 3: Installing and Configuring XFree86


    This Files section tells XFree86 that your RGB database is located in /usr/X11R6/lib/X11/
    and that the fonts are located in /usr/X11R6/lib/X11/fonts/. These are the standard
    locations for both. One tricky thing to think is that you may not have loaded
    all the font directories (we recommend you do, though). Because of this, you should
    check the /usr/X11R6/lib/X11/fonts/ directory:


    ```

    $ ls /usr/X11R6/lib/X11/

    100dpi/ 75dpi/ PEX/ Speedo/ Type/ misc/

    ```


    On our system, we have all the directories listed and a PEX directory for PEX
    fonts (you can ignore this for now; see Appendix B for more on PEX, the 3D extension
    to X). What you should do is delete any entries in the XF886Config file if you
    don''t have the corresponding font directory. For example, if you did not load
    the 100-dots-per-inch fonts (the 100dpi) directory, then your Files section should
    look like:


    # "Files"


    +   - RGBPath "/usr/X11R6/lib/X11/rgb"

    - FontPath "/usr/X11R6/lib/X11/fonts/misc/*"

    - FontPath "/usr/X11R6/lib/X11/fonts/Type/*"

    - FontPath "/usr/X11R6/lib/X11/fonts/Speedo/*"

    - FontPath "/usr/X11R6/lib/X11/fonts/75dpi/*"


    # EndSection


    We removed the entry for 100dpi fonts.

    When running xf86config, you should say you do not intend to use the X font server,
    if you''d like to. If the server isn''t running before you start X, then your
    system may lock up. It''s much easier to split the problem. First, get X up and
    running. Then, configure the X font server (which provides scaled fonts). You
    may have to go back and edit the XF86Config file, but that''s a lot easier than
    having your system lock up.


    # Configuring the ServerFlags Section


    After the Files section comes the ServerFlags section. Again, you rarely have
    to do much with this. In fact, we normally have everything'
  merge: -1
