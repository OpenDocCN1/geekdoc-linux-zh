- img_proc: true
  md: '# CHAPTER 6: Basic Linux System Administration 351


    This is actually an incomplete listing, as evidenced by the double colon, which
    means that a field has been left out. Normaly the lines in the /etc/group file
    are listed in the following format:


    ```

    groupname:password:groupID:users

    ```


    This field is blank because most systems don''t bother setting up passwords for
    groups. Whether or not this is a huge security breach is debatable; to be honest,
    setting up a password for a group is a pain. Of of you won''t need to deal with
    it, and those who may want to consider investing in a more advanced UNIX system-administration
    tome.


    # Logging in as Su


    When you want to work as the root user (for the purposes of adding and deleting
    users, for example), you don''t need to logoff the system and then login again
    as root; instead, you can login as the superuser:


    ```

    gilbert:-$ su

    gilbert:/home/kevinr#

    ```


    Note that the previous home directory was listed as ~, but it is changed to /home/kevinr
    after logging in as superuser.


    There''s another important reason to login as su (in addition to having others
    on your Linux system login as superuser, in instances where there are multiple
    administrators on the network): When someone is logged in as root, the system
    only notes that root logged on the system. However, when someone uses su to login
    for root privileges, there''s a record of the login in the file /var/adm/messages:


    ```

    Apr 27 22:06:30 gilbert su: kevinr on /dev/tty

    ```


    To quit using the system as superuser, exit or by:


    ```

    gilbert:/home/kevinr# exit

    exit

    gilbert:-~$

    ```'
  merge: -1
