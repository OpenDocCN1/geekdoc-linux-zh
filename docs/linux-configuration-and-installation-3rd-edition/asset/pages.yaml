    you know what a command is and how you give a command to the computer. And you
    also know that the combination of a command and any options is called a command
    line.


    Under Linux, commands can be run at a command line or under the X Window System
    (which we covered in Chapter 3). However, there are some cases when there''s an
    X Window version of the UNIX command; for example, there''s a version of man for
    the X Window System, called xman, that you should use instead. In this chapter,
    we''ll note the X Window version.


