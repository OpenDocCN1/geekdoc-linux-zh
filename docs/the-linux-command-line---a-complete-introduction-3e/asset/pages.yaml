    ```


    In this example, we search for files with names starting with string find and
    execute the command ls -l each time it is found. Using the -ok action prompts
    the user before the command is executed.


    # Improving Efficiency


    When the -exec action is used, it launches a new instance of the specified command
    each time a matching file is found. There are times when we might prefer to combine
    all of the search results into a single instance of the command. For example,
    rather than executing the commands like this


    ```

    ls -l file1

    ls -l file2

    ```


    we may prefer to execute them this way:


    ```

    ls -l file1 file2

    ```


    This causes the command to be executed only one time rather than multiple times.

    There are two ways we can do this: the traditional way, using the external command
    xargs, and the alternate way, using a new feature in find itself. We''ll talk
    about the alternate way first.


    By changing the trailing character to a plus, we activate the ability of find
    to combine the results of the search into an argument list for a single execution
    of the command. Going back to this example, this will execute ls each time matching
    file is found:


    ```

    find -type f -name ''foo*'' -exec ls -l ''{}'' ;

    -rwxr-xr-x 1 me 2246-10-28 18:44 /home/me/bin/foo

    -rw-r--r-- 1 me 0825-09-19 12:53 /home/me/foo.txt

    ```


    By changing the command to


    ```

    find -type f -name ''foo*'' -exec ls -l ''{} +

    ```'
