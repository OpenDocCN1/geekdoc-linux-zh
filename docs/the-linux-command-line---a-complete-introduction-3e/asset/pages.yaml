- img_proc: true
  md: 'treat it as though it were already present on optical media. By adding the
    -o loop option to mount (along with -t filesystem type), we can mount the image
    file as though it were a device and attach it to the filesystem tree:


    ```

    mkdir /mnt/iso_Image

    mount -t iso9660 -o loop image.iso /mnt/iso_image

    ```


    In this example, we created a mount point named /mnt/iso_image and then mounted
    the image file.iso at that point. After the image is mounted, it can be treated
    just as though it were a real CD-ROM or DVD. Remember to unmount the image when
    it is no longer needed.


    # Blinking a Rewritable CD-ROM


    Rewritable CD-RW media needs to be erased or blanked before it can be reused.
    To do this, we can use wodin, specifying the device name for the CD writer and
    the type of blinking to be performed. The wodin program offers several types.
    The most minimal (and fastest) is the “fast” type:


    ```

    wodin dev=/dev/cdw blank=fast

    ```


    # Writing an Image


    To write an image, we use wodin, specifying the name of the optical writer device
    and the name of the image file:


    ```

    wodin dev=/dev/cdw image=image.iso

    ```


    In addition to the device name and image file, wodin supports a large set of options.
    Two common ones are -v for verbose output, and -ao, which writes the disc in disc-once
    mode. This mode should be used if we are preparing a disc for commercial reproduction.
    The default mode for wodin is track-at-once, which is useful for recording music
    tracks.


    # Verifying Data


    While we''re on the subject of ISO files, let''s look at how to verify the integrity
    of files we download. Often when we download a large file as a Linux installation
    image, we will want to make sure that image file we downloaded is complete and
    not corrupted. One tool we can use for this is sha256sum, a modern replacement
    for an earlier program called md5sum.


    There are two common ways this can be done. Let''s try them. Say we want to download
    an installation image of Linux Mint 22. We go to the Linux Mint website and get
    the linuxmint-22-cinnamon-64bit.iso file. While we are there we also download
    a checksum file called sha256sum.txt. When we look at its contents, we see three
    lines of data with long strings of hexadecimal numbers and the names of files
    available for downloading including the ISO file downloaded.'
  merge: -1
  pgno: 208
- img_proc: true
  md: '```

    [me@linuxbox ~]$ sha256sum.txt

    7a0b5483b0004e954c1eda6edec6c8c57ff49de4b33bd021a84964f298f *lin uxmint-22-cinnamon

    64bit.iso

    7ea2483436fe69a1779bc0fc8549f8dc720295d597dd720475bc6930 *lin uxmint-22-mate-64bit.iso

    5e5917b9202671856402497421b98f7a58dad8b5c4c9ff4a3cfeb4db480 *lin uxmint-22-xfce-64bit.iso

    ```


    The strings of hex are checksums, a precise mathematical representation of the
    ISO files. These numbers are special if the downloaded ISO file is altered by
    even one bit from the original file, the checksum will be significantly different.
    We will test the ISO file to see if the checksums match.


    ```

    [me@linuxbox ~]$ sha256sum -b linuxmint-22-cinnamon-64bit.iso

    7a0b5483b0004e954c1eda6edec6c8c57ff49de4b33bd021a84964f29b8f *lin uxmint-22-cinnamon

    64bit.iso

    ```


    The -c option tells sha256sum that we are looking at a binary file rather than
    text. As we can see, the checksum matches the one we saw in sha256sum.txt. However,
    looking at the checksum this way is a little tedious. Another way we can check
    the file is to have sha256sum process the sha256sum.txt file to compare its checksums
    against ones it generates from the files on the list. We can do this by running
    the sha256sum program this way:


    ```

    [me@linuxbox ~]$ sha256sum -c --ignore-missing sha256sum.txt

    linuxmint-22-cinnamon-64bit.iso: OK

    ```


    The -c option (short for "check") invokes this while mode, while the ..ignore-missing
    option tells sha256sum not to complain that the files we didn''t download, linuxmint-22-mate-64bit.iso
    and linuxmint-22-xfce-64bit.iso, aren''t present.


    # Summing Up


    In this chapter, we looked at the basic storage management tasks. There are, of
    course, many more. Linux supports a vast array of storage devices and filesystem
    schemes. It also offers many features for interoperability with other systems.'
