  md: "```\necho \"$PRONAME: usage: $PRONAME file\" >&2\nexit 1\nfi\n```\n\nThis program\
    \ displays the file type (determined by the file command) and the file status\
    \ (from the stat command) of a specified file. One interesting feature of this\
    \ program is the PRONAME variable. It is given the value that results from the\
    \ basename \"$0\" command. The basename removes the leading portion of a pathname,\
    \ leaving only the base name of a file. In our example, basename removes the leading\
    \ portion of the pathname contained in the $0 parameter, the full pathname of\
    \ our example program. This value is useful when constructing messages such as\
    \ the usage message at the end of the program. By coding this way, the script\
    \ can be renamed, and the message automatically adjusts to contain the name of\
    \ the program.\n\n# Using Positional Parameters with Shell Functions\n\nJust as\
    \ positional parameters are used to pass arguments to shell scripts, they can\
    \ also be used to pass arguments to shell functions. To demonstrate, we will convert\
    \ the file_info script into a function.\n\n```\nfile_info() {\n  # file_info:\
    \ function to display file information\n\n  if [[ -e \"$1\" ]]; then\n    echo\
    \ -e \"\\nFile Type:\"\n    file \"$1\"\n    echo -e \"\\nFile Status:\"\n   \
    \ stat \"$1\"\n  else\n    echo \"$FUNCNAME: usage: $FUNCNAME file\" >&2\n   \
    \ return 1\n  fi\n}\n```\n\nNow, if a script incorporates the file_info shell\
    \ calls the function with a filename argument, the argument will be passed to\
    \ the function.\n\nWith this capability, we can write many useful shell functions\
    \ that not only can be used in scripts but also be within our .bashrc files.\n\
    \nNotice that the PRONAME variable was changed to the shell variable FUNCNAME.\
    \ The shell automatically updates this variable to keep track of the currently\
    \ executed shell function. Note that $0 always contains the full pathname of the\
    \ first item on the command line (that is not contain the name of the shell function)\
    \ as we might expect.\n\n# Handling Positional Parameters en Masse"
