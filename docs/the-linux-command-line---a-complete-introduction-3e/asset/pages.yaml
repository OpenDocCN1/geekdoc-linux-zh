  md: "but when the command exits, the subshell and its environment are destroyed,\
    \ and the effect of the assignment is lost.\nUsing here strings is one way to\
    \ work around this behavior. Another method is discussed in Chapter 36.\n\n# Validating\
    \ Input\n\nWith our ability to have keyboard input comes an additional programming\
    \ challenge, validating input. Often the difference between a well-written program\
    \ and a poorly written one lies in the program's ability to deal with the unexpected.\
    \ Frequently, the unexpected appears in the form of bad input. We've done a little\
    \ of this with evaluation programs in the previous chapter, where we checked the\
    \ values of integers and screened out every and non-numeric characters. It is\
    \ important to perform these kinds of programming checks every time a program\
    \ receives input to guard against invalid data. This is especially important for\
    \ programs that are shared by multiple users. Omitting these safeguards might\
    \ be mistaken if a program is used once and only by the author to perform some\
    \ special task. Even then, if the program performs dangerous tasks such as deleting\
    \ files, it would be wise to include data validation, in case.\n\nHere we have\
    \ example program that validates kinds of input:\n\n```\n#/bin/bash\n\nread-validate:\
    \ validate input\n\ninvalid_input() {\n  echo \"Invalid input '$REPLY\" >&2\n\
    \  exit 1\n}\n\nread -p \"Enter a single item \" \"\n\n# input is empty (invalid)\n\
    [[ -z \"$REPLY ]] && invalid_input\n# input is multiple items (invalid)\n(( $(echo\
