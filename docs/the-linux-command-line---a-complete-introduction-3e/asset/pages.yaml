  md: 'me@linuxbox ~$ hello_world


    Hello World!


    And so it does.


    If the PATH variable does not contain the directory, we can easily add it by including
    this line in our .bashrc file.


    ```

    export PATH=$/bin:$PATH

    ```


    After this change is made, it will take effect in each new terminal session. To
    apply the change to the current terminal session, we must have the shell re-read
    the .bashrc file. This can be done by “sourcing” it.


    ```

    me@linuxbox ~$ .bashrc

    ```


    The dot (.) is a synonym for the source command, a shell builtin that reads a
    specified file of shell commands and treats it like input from the keyboard.


    # NOTE


    Ubuntu (and most other Debian-based distributions) automatically adds the ~/bin
    directory to the PATH variable if the ~/bin directory exists when the user''s
    .bashrc file is executed. So, on Ubuntu systems, if we create the ~/bin directory
    and log out and log in again, everything works.


    # Good Locations for Scripts


    The ~/bin directory is a good place to put scripts intended for personal use.
    If we write a script that everyone on a system is allowed to use, the traditional
    location is /usr/local/bin. Scripts intended for use by the system administrator
    are often located in /usr/local/bin. In most cases, locally supplied software,
    whether scripts or compiled programs, should be placed in the /usr/local hierarchy
    and not in /bin or /usr/bin. These directories are specified by the Linux Filesystem
    Hierarchy Standard to contain only files supplied and maintained by the Linux
    distributor.


    # More Formatting Tricks


    One of the key goals of serious writing script is ease of maintenance, that is,
    the ease with which a script may be modified by its author or others to adapt
    it to changing needs. Making a script easy to read and understand is one way to
    facilitate easy maintenance.


    # Long Option Names


    Many of the commands we have studied feature both short and long option names.
    For instance, the ls command has many options that can be expressed in either
    or long form. For example, the following'
