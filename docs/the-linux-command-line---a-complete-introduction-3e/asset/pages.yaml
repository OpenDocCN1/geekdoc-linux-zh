- img_proc: true
  md: '# Putting Regular Expressions to Work


    Let''s look at some of the commands we already know and see how they can be used
    with regular expressions.


    # Validating a Phone List with grep


    In our earlier example, we looked at single phone numbers and would be checking
    a list of numbers instead, for proper formatting. A more realistic scenario would
    be making a list. We''ll do this by reciting a magical incantation to the command
    line. It will be magic because we have not covered most of the commands involved,
    but worry not. We will get there in future chapters. Here is the incantation:


    ```

    $ for i in {1..10}; do echo "${RANDOM:0:3}-${RANDOM:0:3}-${RANDOM:0:4}" >> phonelist.txt;
    done

    ```


    This command will produce a file named phonelist.txt. Each time the command is
    repeated, another 10 numbers are added to the list. We can also change the value
    18 near the beginning of the command to produce more fewer phone numbers. If we
    change the contents of the file, however, we will have a problem.


    ```

    $ cat phonelist.txt

    (232) 298-226

    (624) 381-1078

    (540) 126-1980

    (874) 163-2885

    (286) 254-2860

    (292) 108-518

    (129) 44-1379

    (458) 273-1642

    (686) 299-8268

    (198) 307-2440

    ```


    +   Some of the numbers are malformed, which is perfect for our purposes, since
    we will have grep to validate them.


    One useful method of validation would be to scan the file for invalid numbers
    and display the resulting list.


    ```

    $ grep -Ev ''^([0-9]{3}\) [0-9]{3}-[0-9]{4}$'' phonelist.txt

    (292) 108-518

    (129) 44-1379

    ```


    Here we use the -v option to produce an inverse match so that we will output only
    the lines in the file that do not match the specified expression. The expression
    itself includes the anchor characters at each end to ensure that the number has
    no extra characters at either end. This expression also requires that the parentheses
    be present in a valid number, unlike our earlier phone number example.'
  merge: -1
