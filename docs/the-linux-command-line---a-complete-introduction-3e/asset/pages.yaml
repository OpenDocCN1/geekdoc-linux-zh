  md: 'program again? Ah, this is the magic of make. Rather than simply building everything
    again, make builds only what needs building. With all of the targets present,
    make determined that there was nothing to do. We can demonstrate this by deleting
    one of the targets and running make again to see what it does. Let''s get rid
    of one of the intermediate targets:


    ```

    [me@linuxbox diction-1.11]$$ make getopt.o

    [me@linuxbox diction-1.11]$$ make

    ```


    We see that make rebuilds it re-links the diction and style programs, since they
    depend on the missing module. This behavior also points out another important
    feature of make: it keeps targets up-to-date. make ensures that targets are better
    than their dependencies. Makes perfect sense, because a programmer will often
    update a bit of source code and use make to build a new version of the finished
    product. ensures that everything needs building based on the updated code is.
    If we use the touch program “update” one of the source code files, we can see
    this:


    ```

    [me@linuxbox diction-1.11]$$ ls -l diction getopt.c

    -rw-xr--x 1 me 37164 2025-03-05 06:14 diction

    -rw-r--r-- 1 me 33125 2007-03-30 17:45 getopt.c

    [me@linuxbox diction-1.11]$$ touch diction -l getopt.c

    -rw-xr--x 1 me 37164 2025-03-05 06:14 diction

    -rw-r--r-- 1 me 33125 2025-03-05 06:23 getopt

    [me@linuxbox diction-1.11]$$ make

    ```


    After make run, we see that it has restored the target to be newer than the dependency.


    ```

    [me@linuxbox diction-1.11]$$ ls -l diction.c

    -rw-xr--x 1 me 37164 2009-03-05 06:24 diction

    -rw-r--r-- 1 me 33125 2009-03-05 06:23 gotten

    ```


    The ability of make to intelligently build only what needs building is a great
    benefit to programmers. While the time savings may not be apparent with our small
    project, it is significant. The Linux kernel (a program that undergoes continuous
    modification and improvement) contains several million lines of code.


    # Installing the Program


    Well-packaged source code will often include a special make called install. This
    target will install the final product in a system directory for use. Usually,
    this directory is /usr/local/bin, the traditional location for locally built software.
    However, this directory is not normally writable by ordinary users, so we must
    become the superuser to perform the installation.


    ```

    [me@linuxbox diction-1.11]$$ sudo make install

    ```


    After the installation, we can check that the program is ready to go.'
  merge: -1
