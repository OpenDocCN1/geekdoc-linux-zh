  md: '# #2 NAVIGATION


    ![](img/58edd539af3a70704734cedc1ac0c271_39_0.png)


    The first thing we need to learn (besides how to type) is how to navigate the
    filesystem on our Linux system. In this chapter, we will introduce the following
    commands:


    +   - `pwd` Print name of current working directory.

    - `cd` Change directory.

    - `ls` List directory contents.


    # ## Understanding the Filesystem Tree


    Like Windows, a Unix-like operating system as Linux organizes its files in what
    is called a hierarchical directory structure. This means they are organized in
    a tree-like pattern of directories (sometimes folders in other systems), which
    may contain files and other directories. The first directory in the filesystem
    is the root directory. The root directory contains files and subdirectories, which
    contain more files and subdirectories.


    Note that unlike Windows, which has a separate filesystem for each storage device,
    Unix-like systems such as Linux always have a single filesystem tree, regardless
    of how many drives or storage devices are attached to the computer. Storage devices
    are attached (or more correctly, mounted) at various points on the tree according
    to the whims of the system administrator, the person (or people) responsible for
    maintaining the system.


    # ## The Current Working Directory


    Most of us are probably familiar with a graphical file manager that represents
    the filesystem tree, as in Figure 2-1.'
  merge: -1
  pgno: 39
- img_proc: true
  md: '![](img/58edd539af3a70704734cedc1ac0c271_40_0.png)


    Figure 2-1: The filesystem tree as shown by a graphical file manager


    Notice that the tree is usually shown upended (that is, with the root at the top
    and the various branches descending below).


    However, the command line has no pictures, so to navigate the filesystem we need
    to think of it in a different way.


    Imagine that the filesystem is a maze shaped like an upside-down tree and we are
    able to stand in the middle of it. At any given time, we are inside a single directory,
    and we can see the files contained in the directory and the pathway to the directory
    above us (called the *parent directory*) and any subdirectories below us. The
    directory we are standing in is called the *current working directory*. To display
    the current working directory, we use the `pwd` (print working directory) command.


    ```

    @linux~$ pwd

    /home/me

    ```


    When we first log in our system (or start a terminal emulator session), our current
    working directory is set to our *home directory*. Each user account is given its
    own home directory, and it is the only place a regular user is allowed to write
    files.


    # Listing the Contents of a Directory


    To list the files and directories in the current working directory, we use the
    `ls` command.


    ```

    @linuxbox~$ ls

    Desktop Documents Music Public Templates Videos

    ```'
