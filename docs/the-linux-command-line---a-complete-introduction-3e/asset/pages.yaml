    to read and write while removing all permissions from the group and others. Though
    remembering the binary mapping may seem inconvenient, we will usually have to
    use a few common commands: 7 (rwx), 6 (rw-), 5 (r-x), 4 (r--), and 0 (---).


    chmod also supports a symbolic notation for specifying file modes. Symbolic notation
    is divided into three parts.


    +   * Who the will will affect

    * Which operation will be performed

    * What permission will be set


    To specify which is affected, a combination of characters u, g, o, and a is used,
    as shown in Table 9-5.


    | Symbol | Meaning |

    |---|---|

    | u | Short for “user” (that is, the file or directory’s owner). |

    | g | Group owner. |

    | o | Short for “others.” |

    | a | Short for “all.” This is the combination of u, g, and o. |


    Table 9-5: chmod Symbolic Notation


    If no character is specified, all will be assumed. The operation may be a + indicating
    that a permission is to be added, a - indicating that a permission is to be taken
    away, or a = indicating that only the specified permissions are to be applied
    and all others are to be removed.


