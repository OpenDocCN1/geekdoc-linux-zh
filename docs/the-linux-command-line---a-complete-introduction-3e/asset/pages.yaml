    # NOTE


    Besides the normal (0) and bold (1) character attributes, text may be given underscore
    (4), blinking (5), and inverse (7) attributes. In the interests of good taste,
    many terminal emulators refuse to honor the blinking attribute, however.


    # Moving the Cursor


    Escape codes can be used to position the cursor. This is commonly used to provide
    a clock or some other kind of information at a different location on the screen,
    such as in an upper corner each time the prompt is drawn. Table 13-4 lists the
    escape codes that position the cursor.


    Table 13-4: Cursor Movement Escape Sequences


    | Escape code | Action |

    | \e[l;cH | Move the cursor to line $l$ and column $c$. |

    | \e[nA | Move the cursor up $n$ lines. |

    | \e[nB | Move the cursor down $n$ lines. |

    | \e[nC | Move the cursor forward $n$ characters. |

    | \e[nD | Move the cursor backward $n$ characters. |

    | \e[2J | Clear the screen and move the cursor to the upper-left corner (line
    0, column 0). |

    | \e[K | Clear from the cursor position to the end of the current line. |

    | \e[s | Store the current cursor position. |

    | \e[u | Recall the stored cursor position. |


    Using the codes in Table 13-4, we''ll construct a prompt that draws a red bar
    at the top of the screen containing a clock (rendered in yellow text) each time
    the prompt is displayed. The code for the prompt is this formidable-looking string:'
