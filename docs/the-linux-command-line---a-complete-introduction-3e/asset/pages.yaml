    # Traps


    In Chapter 10, we show how programs can respond to signals. We can add this capability
    to our scripts too (because they have very short execution times and do not create
    temporary files), larger and more complicated scripts may benefit from a signal
    handling routine.


    When we design a large, complicated script, it is important to consider what happens
    if the user logs off or shuts down the computer while the script is running. When
    such an event occurs, a signal will be sent to all affected processes. In turn,
    the programs representing those processes can perform actions to ensure a proper
    and orderly termination of the program. Let’s say, for example, that we wrote
    a script that created a temporary file during its execution. In the interests
    of good design, we would have the script delete the file when the script finishes
    its work. It would also be smart to have the script delete the file if a signal
    is received indicating that the program was going to be terminated.'
