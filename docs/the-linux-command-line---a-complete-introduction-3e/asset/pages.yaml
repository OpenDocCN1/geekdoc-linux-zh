    # Creating Our Own Commands with alias


    Now for our first experience with programming! We will create a command of our
    using the alias command. But before we start, we need to reveal a small command
    line trick. It''s possible to put more than one command on a line by separating
    each command with a semicolon. It works like this:


    ```

    command1; command2; command3...

    ```


    Here is the example we will use:


    ```

    [me@linuxbox ~]$ cd /usr; ls; cd -

    bin games include lib local share src

    /home/me

    [me@linuxbox ~]$

    ```


    As we can see, we have combined three commands on one line. First, we change directory
    to /usr, then list the directory, and finally return to the original directory
    (by cd -) we end up where we started. Let''s try this sequence into a new command
    using alias. The first thing we have to do is dream up a name for our new command.
    Let''s try it. Before we do that, it would be a good idea to find out whether
    the name test is already being used. To find out, we can use the type command:


    ```

    [me@linuxbox ~]$ type test

    test is shell builtin

    ```


    Oops! The name test is already taken. Let''s try foo:


    ```

    [me@linuxbox ~]$ type foo

    bash: type: foo: not found

    ```


    Great! foo is not taken. Let''s create our alias:


    ```

    [me@linuxbox ~]$ alias foo=''cd /usr; ls; cd -''

    ```'
