    Unix, where it was possible to mark an executable file as "not swappable." Linux
    ignores the sticky bit, but if applied to a directory, it prevents users from
    deleting or renaming files unless the user is either the owner of the directory,
    the owner of the file, or the super. This is often used to control access to a
    shared directory, such as /tmp.


