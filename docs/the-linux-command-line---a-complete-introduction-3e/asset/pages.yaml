  md: '# 12

    A GENTLE INTRODUCTION TO VI(M)


    ![](img/58edd539af3a70704734cedc1ac0c271_156_0.png)


    There is an old joke about a visitor to New York City asking a passerby for directions
    to the city''s famous classical music venue:


    Visitor: Excuse me, how do I get to Carnegie Hall?


    Passerby: Practice, practice, practice!


    Learning the Linux command line, like becoming an accomplished pianist, is not
    something that we pick up in an afternoon. It takes years of practice. In this
    chapter, we will introduce the vi (pronounced "vee eye") text editor, one of the
    core programs in the Unix tradition. vi is somewhat notorious for its unique user
    interface, but when we see a master sit down at the keyboard and begin to "play,"
    we will indeed be witness to some great art. We won''t become masters in this
    chapter, but when we are done, we will know how to play "chopsticks" in vi.


    # Why We Should Learn vi


    In this modern era of graphical editors and easy-to-use text-based editors such
    as nano, why should we learn vi? There are three reasons why:


    +   - vi is always available. This can be a lifesaver if we have a system with
