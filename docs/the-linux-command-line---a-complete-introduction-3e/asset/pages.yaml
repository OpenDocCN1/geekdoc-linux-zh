- img_proc: true
  md: '# How a Process Works


    When a system starts up, the kernel initiates a few of its activities as processes
    and launches a program called init. Init, in turn, starts systemd, which starts
    all the system services. In Linux distributions, init runs a series of shell scripts
    (in /etc) called init scripts to perform a similar function. Many systems are
    implemented as daemon programs, that sit in the background and do their thing
    without having any user interface. So, if we are not logged in, the system is
    at least a busy performing routine stuff.


    The fact that a program can launch other processes is expressed in the process
    scheme as a parent process producing a child process.


    The kernel maintains information about each process to help keep things organized.
    For example, each process is assigned a number called a process ID (PID). PIDs
    are assigned in ascending order, with always getting PID 1. The kernel keeps track
    of the memory assigned to each process, as well as the processes'' readiness to
    resume execution. Like files, processes also have owners and UIDs, effective UIDs,
    and so on.


    # Viewing Processes


    The most commonly used tool to view processes (there are several) is the ps command.
    The ps program has a lot of options, but in its simplest form it is used like:


    ```

    PID TTY TIME CMD

    5198 pts/1 00:00:00 bash

    1029 pts/1 00:00:00 ps

    ```


    The result in this lists two processes, process 5198 and 1029, which are bash
