    # A CROSSWORD PUZZLE HELPER


    Even with our limited knowledge of regular expressions at this point, we can do
    something useful.

    Mife loves crossword puzzles, and she will sometimes ask me for help with a particular
    question. Something like “What''s a five-word word whose third letter is j and
    last letter is r that means ... This kind of question got me thinking.

    Did you know that your Linux system contains a dictionary? It does. Take a look
    in the /usr/share/dict directory, and you might find one or several. The dictionary
    files located there are just lists of words, one per line, arranged in alphabetical
    order. On my system, words files contain just over 98,500 words. To find possible
    answers to my wife''s crossword puzzle question, we could this:


    ```

    [@linuxbox ~]$ grep -i ''^...j.rs'' /usr/share/dict/words

