    with bad permissions. It can''t be both at the same time. So if we expand the
    grouped expressions, we can see it this way:


    Our next challenge is to test for “bad permissions.” How do we do that? Actually,
    we don’t. What will we test for is “not good permissions” since we know what “good
    permissions” are. In the case of files, we define good as 0600, and for directories,
    we define it as 0700. The expression that we test for “not good” permissions is
    as follows:


    ```

    - type f -and -not -perm 0600

    ```


    For directories it is as follows:


    ```

    - type d -and -not -perm 0700

    ```


    As noted in Table 17-4, the -and operator can be safely removed since it is implied
    by default. If we put this back together, we get our final command.


    ```

    find - (type f -not -perm 0600) - (type d -not -perm 0700)

    ```


    However, since the parentheses have special meaning to the shell, we must escape
    them to prevent the shell from trying to interpret them. Preceding each one with
    a backslash character does the trick.


    There is another feature of logical operators that is important to understand.
    Let’s say that we have two expressions separated by a logical operator.


    ```

    expr1 -operator expr2

