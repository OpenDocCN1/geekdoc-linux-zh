  md: '# WHY I?


    You may have noticed the variable i was chosen for each of the previous for loop
    examples. Why? No specific reason actually besides tradition. The variable used
    with for can be any valid variable, i is the most common, followed by j and k.


    The basis of this tradition comes from the Fortran programming language. In Fortran,
    undeclared variables starting with the letters i, j, k, and m are automatically
    typed as integers, while variables beginning with any other letter are typed as
    reals (numbers with decimal fractions). This behavior led programmers to use the
    variables i, j, and k for loop variables since it was less to use them when a
    temporary variable (as loop variables often are) were needed.


    It also led to the following Fortran-based mysticism: "GOD is real, unless declared
    integer."


    # —C Language Form


    Recent versions of bash have added a second form of command syntax, one that resembles
    the form found in the C programming language. Many other languages support this
    form as well.


    ```

    for (( expression1; expression2; expression3 )); do

    commands

    done

    ```


    Here expression1, expression2, and expression3 are arithmetic expressions, and
    commands are the commands to be performed during each iteration of the loop.

    In terms of behavior, this form is equivalent to the following construct:


    ```

    (( expression1 ))

    while (( expression2 )); do

    commands

    (( expression3 ))

    done

    ```


    expression1 is used to initialize conditions for the loop, expression2 is used
    to determine when the loop is finished, and expression3 is carried out at the
    end of each iteration of the loop.

    Here is a typical application:


    ```

    #!/bash


    # simple_counter: demo of C style for command


    for (( i=0; i<5; i=i+1 )); do

    echo $i

    ```'
