  md: '# # 34

    # STRINGS AND NUMBERS


    ![](img/58edd539af3a70704734cedc1ac0c271_446_0.png)


    Computer programs are all about working with data. In past chapters, we have focused
    on processing data at the file level. However, many programming problems need
    to be solved using smaller units of data such as strings and numbers.


    In this chapter, we will look at several shell features that are used to manipulate
    strings and numbers. The shell provides a variety of parameter expansions that
    perform string operations. In addition to arithmetic expansion (which we touched
    on in Chapter 7), there is a well-known command line program called sc, which
    performs higher-level math.


    # ## Parameter Expansion


    Though parameter expansion came up in Chapter 7, we did not cover it in detail
    because most parameter expansions are used in scripts rather than the command
    line. We have already worked with some forms of parameter expansion, for example,
    shell variables. The shell provides many more.


    > > NOTE

    It''s always good practice to enclose parameter expansions in double quotes to
    prevent unwanted word splitting, unless there is a specific reason not to. This
    is especially true when dealing with filenames since they can often include embedded
    spaces and other assorted nastiness.


    # ## Basic Parameters


    The simplest form of parameter expansion is reflected in the ordinary use of variables.
    Here''s an example:'
