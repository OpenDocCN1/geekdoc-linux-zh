  md: 'Actually, we can use the ls command to list the contents of any directory,
    not just the current working directory, and there are many other things it can
    do as well. We''ll spend more time with ls in the next chapter.


    # Changing the Current Working Directory


    To change our working directory (where we are standing in our tree-shaped maze),
    we use the cd command. To do this, type cd followed by a path and the pathname
    of the desired working directory. A pathname is the route we take along the branches
    of the tree to get to the directory we want. We can specify pathnames in one of
    two different ways: absolute pathnames or relative pathnames. Let''s look at absolute
    pathnames first.


    # Absolute Pathnames


    An absolute begins with the root directory and follows the tree branch by branch
    until the path to the desired directory or file is completed. For example, there
    is a directory on our system with most of our system''s programs are installed.
    The directory''s pathname is /usr/bin. This means from the root directory (represented
    by the leading slash in pathname) there is a directory called usr that contains
    a directory called bin.


    ```

    [me@linuxbox]$ cd /usr/bin

    [me@linux bin]$ pwd

    /usr/bin

    [me@linux bin]$ ls

    Listing of many, many files ...

    ```


    Now we can see that we have changed the current working directory to /usr/bin
    and it is full of files. Notice how the shell prompt has changed? As a convenience,
    it is usually set up to automatically display the name of the working directory.


    # Relative Pathnames


    Where an absolute pathname starts from the root directory and leads to a destination,
    a relative pathname starts from the working directory. To do this, one uses a
    couple of special notations to represent relative positions in the filesystem
    tree. These special notations are . (dot) and .. (dot dot).


    The . notation refers to the working directory, and the .. notation refers to
    the working directory''s parent directory. For example, let''s change the working
    directory to /usr/bin


    ```

    [me@linuxbox]$ cd /usr/bin

    [me@linux bin]$ pwd

    /usr/bin

    ```


    Now let''s say that we wanted to change the working directory to the parent of
    /usr/bin, which is /usr. We could do that different ways, either using an absolute
    pathname'
  merge: -1
  pgno: 41
- img_proc: true
  md: '```

    [me@linuxbox bin]$ cd /usr

    [me@linuxbox usr]$pwd

    /usr

    ```


    or using a relative pathname:


    ```

    [me@linuxbox bin]$ cd ..

    [me@linuxbox usr]$pwd

    /usr

    ```


    Two different methods with identical results. Which one should we use? The one
    that requires the least typing!

    Likewise, we can change the working directory from /usr to /usr/bin in two different
    ways, either using an absolute pathname


    ```

    [me@linuxbox usr]$ cd /usr/bin

    [me@linuxbox bin]$pwd

    /usr/bin

    ```


    or using a relative pathname:


    ```

    [me@linuxbox usr]$ cd ./bin

    [me@linuxbox bin]$pwd

    /usr/bin

    ```


    Now, there is something important to point out here. In almost all cases, we can
    omit the ./. It is implied. Entering

    [me@linuxbox usr]$ cd bin


    does the same thing. In general, if we do not specify a pathname to something,
    the working directory will be assumed.


    # IMPORTANT FACTS ABOUT FILENAMES


    On Linux systems, files are named in a manner similar to other systems such as
    Windows, but there are some important differences.


    +   - Filenames that begin with a period are hidden. This means ls will not list
    unless you say -a. When your account was created, several hidden files were placed
    in your home directory to configure things for your account. In Chapter 11, we
    will take a closer look at some of these files to see how you can customize your
    environment. In addition, some applications place their configuration and settings
    files in your home directory as hidden files.

    - Filenames and commands in Linux, like Unix, are case sensitive. The filenames
    File1 and file1 refer to different files.'
  merge: -1
  pgno: 42
- img_proc: true
  md: '+   - Linux has no concept of a "file extension" like some operating systems.
    You may name files any way you like. The contents or purpose of a file is determined
    by other means. Although Unix-like operating systems do not use file extensions
    to determine the contents or purpose of files, many application programs do.


    +   - Though Linux supports long filenames that may contain embedded spaces and
    punctuation characters, limit the punctuation in names of files you create to
    periods, hyphens, and underscores. Most importantly, do not embed spaces in filenames.
    If you want to represent spaces between words in a filename, use underscore characters.
    You will thank yourself later.


    # Some Helpful Shortcuts


    Table 2-1: shows some useful ways the current working directory can be quickly
    changed.


    | Shortcut | Result |

    |---|---|

    | cd | Changes the working directory to your home directory. |

    | cd - | Changes the working directory to the previous working directory. |

    | cd -user_name | Changes the working directory to the home directory of user_name.
    For example, cd -bob will change the directory to the home directory of user bob.
    |


    # Summing Up


    This chapter explained how the shell treats the directory structure of the system.
    We learned about absolute and relative pathnames and the basic commands we use
    to move about that structure. In the next chapter, we will use this knowledge
    to tour a modern Linux system.'
