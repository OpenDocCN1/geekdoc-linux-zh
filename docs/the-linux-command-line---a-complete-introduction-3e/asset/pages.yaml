    # # Summing Up


    In this chapter, we saw how these three simple commands can be used to build many
    source code packages: ./configuremakake install. We also saw the important role
    that make plays in the maintenance of programs. We can use the make program for
    any task that needs to maintain a target/dependency relationship, not just for
    compiling source code.'
