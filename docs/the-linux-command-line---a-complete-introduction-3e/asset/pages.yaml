  md: '# #29

    FLOW CONTROL: LOOPING WITH WHILE/UNTIL


    ![](img/58edd539af3a70704734cedc1ac0c271_397_0.png)


    In the previous chapter, we developed a menu-driven program to produce various
    kinds of system information. The program works, but it still has a significant
    usability problem. It executes only a single choice and then terminates. Even
    worse, if an invalid selection is made, the program terminates with an error,
    without giving the user an opportunity to try again. It would be better if we
    could somehow construct the program so that it could repeat the menu display and
    selection over and over, until the user chooses to exit the program.


    In this chapter, we will look at a programming concept called looping, which can
    be used to make portions of programs repeat. The shell provides three compound
    commands for looping. We will look at two of them in this chapter and the third
    in a later chapter.


    # Looping


    Daily life is full of repeated activities. Going to work each day, walking the
    dog, and slicing a carrot are all tasks that involve repeating a series of steps.
    Let''s consider slicing a carrot. If we express this activity in pseudocode, it
    might look something like this:


    +   1. Get cutting board.

    2. Get knife.

    3. Place carrot on cutting board.

    4. Lift knife.

    5. Advance carrot.

    6. Slice carrot.

    7. If entire carrot sliced, then quit; else go to step 4.'
  merge: -1
  pgno: 397
- img_proc: true
  md: 'Steps 4 through form a loop. The actions within the loop are repeated until
    the condition, "entire carrot sliced," is reached.


    # while


    bash can express a similar idea. Let''s say we wanted to display five numbers
    in sequential order from 1 to 5. A bash script could be constructed as follows:


    When executed, this script displays the following:


    ```

    [me@linux ~]$ while-count

    1

    2

    3

    4

    5

    Finished.

    ```


    The syntax of the while command is as follows:


    commands; do commands;


    Like if, while evaluates the exit status of a list of commands. As long as the
    exit status is zero, it performs the commands inside the loop. In the previous
    script, the variable count is created and assigned an initial value of 1. The
    while evaluates the exit status of the [] compound command. As long as the []
    command returns an exit status of zero, the commands within the loop are executed.
    At the end of each cycle, the command is repeated. After five iterations of the
    loop, the value of count has increased to 6, the [] command no longer returns
    an exit status of zero, and the loop terminates. The program continues with the
    next statement following the loop.


    We can use a while loop to improve the read-menu program from the previous chapter.


    ```

    #!/bin/bash


    # while-menu: a menu driven system information program


    DELAY=3 # Number of seconds to display results

    ```'
