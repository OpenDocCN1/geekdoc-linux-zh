  md: 'This last point merits some elaboration. Shell variables are local to the current
    instance of the shell and are not copied to any children shell launches. Let''s
    demonstrate that.


    First, we''ll set a shell variable in our current shell.


    ```

    me@linuxbox ~$ foo="barbar"

    ```


    Next, we''ll launch another copy of the shell.


    ```

    me@linuxbox ~$ bash

    me@linuxbox ~$j

    ```


    Now it looks like nothing happened, but we are in fact running another instance
    of the shell. We can show this by looking at the results of the ps command.


    ```

    me@linuxbox ~$ ps

    PID TTY TIME CMD

    101638 pts/9 00:00:00 bash

    101658 pts/9 00:00:00 bash

    101662 pts/9 00:00:00 ps

    ```


    Here we see that we are running two copies of bash. Since we didn''t put the new
    instance into the background when we launched it, it is now the foreground, and
    the original instance is waiting for this new shell to finish. Now let''s try
    to view the value of the variable foo that we set a moment ago.


    ```

    me@linuxbox ~$ echo foo

    me@linuxbox ~$j

    ```


    No result indicates the foo variable is empty. The reason for this is we didn''t
    give it a value in the instance of the shell. Shell variables are not copied and
    given to a child process when the child process is created. Environment variables,
    on the other hand, are copied to become the environment of the child process.


    To demonstrate another fun characteristic of processes and their environments,
    let''s define foo in this instance of the shell.


    ```

    me@linuxbox ~$ foo="barbar"

    ```


    Next, we''ll exit this bash and return to the parent instance, which has been
    patiently waiting for the child process to terminate before proceeding as it does
    with any other program we didn''t put in the background.


    ```

    me@linuxbox ~$ exit

    me@linuxbox ~$j

    ```


    We''ll run ps again to see that we have returned to the first instance.


    ```

    me@linuxbox ~$ ps

    PID TTY TIME CMD

    101638 pts/9 00:00:00 bash

    ```'
