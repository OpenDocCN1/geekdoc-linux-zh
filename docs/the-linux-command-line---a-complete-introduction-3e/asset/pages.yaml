    # diff


    Like the comm program, diff is used to detect the differences between files. However,
    diff is a much more complex tool, supporting many output formats and the ability
    to process large collections of files at once. diff is often used by software
    developers to examine changes between different versions of program source code
    and has the ability to recursively examine directories of source code, often referred
    to as source trees. One use case for diff is the creation of diff files or patches
    that are used by programs such as patch (which we''ll discuss shortly) to convert
    one version of a file (or files) to another version.


    If we use diff at our previous example files, we see its default style of output:
    a terse of the differences between the two files.


    ```

    me@linuxbox ~]$ diff file1.txt file2.txt

    d10

    a

    4a

    e

    ```


    In the default format, each group of changes is preceded by a change command in
    the form of range operation to describe the positions and types of changes required
    to convert the first file to the second file, as outlined in Table 20-4.


    # Table 20-4: diff Change Commands


    | Change | Description |

    | --- | --- |

    | r1r2 | Append the lines at the position r2 in the second file to the position
    r1 in the first file. |

    | r1cr2 | Change (replace) the lines at position r1 with the lines at position
    r2 in the second file. |

    | r1dr2 | Delete the lines in the first file at position r1, which would have
    appeared at range r2 in the second file. |


    In this format, range is a comma-separated list of the starting line and the ending
    line. While this format is the default (mostly for POSIX compliance and backward
    compatibility with traditional Unix versions of diff), it is not as widely used
    as other, or optional formats. Two of the more popular formats are the context
    format and the unified format.


    When using the context format (the -c option), we will see:


    ```

    me@linuxbox ~]$ diff -c file1.txt file2.txt

    ```'
