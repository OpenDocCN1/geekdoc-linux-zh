    # Synchronizing Files and Directories


    A common strategy for maintaining a backup copy of a system involves keeping one
    or more directories synchronized with another directory (or directories) located
    on either the local system (usually a removable storage device of kind) or a remote
    system. We might, example, have a local copy of a website under development and
    synchronize it from time to time with the “live” copy on a web server.


    In the Unix world, the preferred tool for this is rsync. This program can synchronize
    local and remote directories using the rsync remote-update protocol, which allows
    rsync to quickly detect the differences between two directories and perform the
    minimum amount of copying required to bring them into sync. This makes rsync very
    fast and economical to use, compared to other kinds of copy programs.


    rsync is invoked like this:


    ```

    rsync options source destination

    source and destination are one of the following:

    ```


    +   - A local file or directory

    - A remote file or directory in the form of [user@]host:path]

    - A remote rsync server specified with a URI of rsync://[user@]host[:port]/path


    Note that either the source or the destination must be a local file. Remote-to-remote
    copying is not supported.

    Let’s try rsync on local files. First, let’s clean out our foo directory.


    ```

    [me@linuxbox ~]$ rm -rf foo/*

    ```


    Next, we will synchronize the playground directory with a corresponding copy in
    foo.


    ```

    [me@linuxbox ~]$ rsync -av playground foo

    ```'
