    # History Expansion


    The shell offers a specialized type of expansion for items in the history list
    using the ! character. We have already seen how the exclamation point can be followed
    by a number to insert an entry from the history list. There are a number of other
    expansion features, as described in Table 8-6.


    ### Table 8-6: History Expansion Commands

    | Sequence | Action |

    | --- | --- |

    | !! | Repeat the last command. It is probably easier to press the arrow and ENTER.
    |

    | !number | Repeat history list item number. |

    | !string | Repeat last history list item starting with string. |

    | !?string | Repeat last history list item containing string. |


    Use caution with the !string and !??string forms unless you are absolutely sure
    of the contents of the history list items. We can mitigate this problem somewhat
    by appending :p to our expansion. This tells the shell to print the result of
    the expansion and place it into the command history. Here''s an example:


    ```

    [melinuxbox ~]$ ls:

    s -l /usr/bin > ls-output.txt

    ```


    Now that the command has been recalled and placed as the most recent item on the
    history list, we can execute it with the upper arrow or ENTER !! and ENTER.


    By the way, history expansions as !! are not recorded in the history list, but
    their results are.


    Many more features are available in the history expansion mechanism, but this
    subject is already too arcane, and our heads might explode if we continue. The
    “HISTORY EXPANSION” section of the bash page goes into all the gory details. Feel
    free to explore!


