  md: '# # 10

    PROCESSES


    ![](img/58edd539af3a70704734cedc1ac0c271_127_0.png)


    Modern operating systems are usually multitasking, meaning they create the illusion
    of doing more than one thing at once by rapidly switching from one executing program
    to another. The Linux kernel manages this through the use of processes. Processes
    are how Linux organizes the different programs waiting for their turn at the CPU.


    Sometimes a computer will become sluggish or an application will stop responding.
    In this chapter, we will look at some of the tools available at the command line
    that let us examine what programs are doing and how to terminate processes that
    are misbehaving. This chapter will introduce the following commands:


    +   - `ps` Report a snapshot of current processes.

    - `top` List active jobs.

    - `jobs` Place a job in the background.

    - `fg` Place a job in the foreground.

    - `kill` Send a signal to a process.

    - `killall` Kill processes by name.

    - `nice` Run a program with modified scheduling priority.

    - `renice` Alter priority of running processes.

    - `nohup` Run a command immune to hang-ups.

    - `halt/poweroff/reboot` Halt, power off, or reboot the system.

    - `shutdown` Shut down or reboot the system.'
