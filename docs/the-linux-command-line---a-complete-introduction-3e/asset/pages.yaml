    This matches two digits, a slash, what digits, four digits, and the end of line.
    So takes care of *regexp*. To handle that, we must introduce a new regular expression
    that appears in some applications that use BRE. This feature is called *back references*
    and works like this: if the sequence *n* appears in *replacement* *n* is a number
    from 1 to 9, the sequence will refer to the corresponding subexpression in the
    preceding regular expression. To create the subexpressions, we simply enclose
    them in parentheses like so:


    ```

    $(([0-9](2))/([0-9](2))/([0-9](4))$

    ```


    We have three subexpressions. The first contains the month, the second contains
    the day of the month, and the third contains the year. Now we can construct *replacement*
    as follows:


    ```

    $\3-\1-\2$

    ```


    This gives us the year, a dash, the month, a dash, and the day. Now, our command
    looks like this:


    ```

    sed ''/(([0-9](2))/([0-9](2))/([0-9](4))/\3-\1-\2/'' distros.txt

    ```


    We have two remaining problems. The first is that the extra slashes in our regular
    expression will confuse sed. The second is that since *sed*, by default, only
    basic regular expressions, several of the characters in our regular expression
    will be taken as literals, rather than metacharacters. We can solve both problems
    with a literal application of backslashes to escape the offending characters.


    ```

    sed ''/(([0-9](2))\/([0-9](2))\/([0-9](4))/\\3-\\1-\\2/'' distros.txt

    ```


    Another feature of the *s* command is the use of optional flags that may follow
    the replacement string. The most important of these is the *g* flag, which instructs
