    \ In fact, by using\nshift, it is possible to get by with only one parameter (in\
    \ addition to $0, which never\nchanges.\n\n```\n#!/bin/bash\n```\n\n# posit-param2:\
    \ script to display all arguments\n\n```\ncount=1\n\nwhile [[ $# -gt 0 ]]; do\n\
    \  echo \"Argument Scount = $S1\"\n  count=$((count + 1))\n  shift\ndone\n```\n\
    \nEach shift is executed, the value of $2 is moved to $1, the value of $3 is moved\
    \ to $2,\nand so on. The value of $# is also reduced by one.\n\nIn the posit-param2\
    \ program, we create a loop that evaluates the number of arguments\nremaining\
    \ and continues as long as there is at least one. We display the current argument,\n\
