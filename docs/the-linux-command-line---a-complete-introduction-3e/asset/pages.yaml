    # TEMPORARY FILES


    One reason signal handlers are implemented in scripts to remove temporary files
    that the script may create to hold intermediate results during execution. There
    is something of an art to naming temporary files. Traditionally, programs on Unix-like
    systems create their temporary files in the /tmp directory, a shared directory
    intended for such files. However, since the directory is shared, this poses security
    concerns, particularly for programs running with superuser privileges. Aside from
    the obvious step of setting proper permissions for files exposed to all users
    of the system, it is important to give temporary files nonpredictable filenames.
    This avoids an exploit known as a race race. One way to create an unpredictable
    (but still descriptive) name is to do something like:


    ```

    tempfile=/tmp/$(basename $).$$RANDOM

    ```


    This will create a temporary file consisting of the program''s name, followed
    by its process ID (PID), by a random integer. However, note that the RANDOM variable
    returns only a value in the range of 1-32,767, which is not a large range in computer
    terms, a single instance of the variable is not sufficient to overcome a determined
    attacker.


    A better way is to use the mktemp (not to be confused with the nktemp standard
    library function) to both name and create the temporary file. The mktemp accepts
    a template as an argument that is used to build the filename. The template should
    include a series of uppercase x characters, which are replaced by a corresponding
    number of random letters and numbers. The longer the series of x characters, the
    longer the series of random numbers. Here is an example:


    ```

    tempfile=$mktemp /tmp/foobar.$$XXXXXXXXXX

    ```


    This creates a temporary file and assigns its name to the variable tempfile. The
    x characters in the template are replaced with random letters and numbers so that
    the final filename (which, in this example, also includes the expanded value of
    the special'
