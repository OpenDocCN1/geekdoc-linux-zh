    # Summing Up


    Most modern systems feature a mechanism for managing multiple processes. Linux
    provides a rich set of tools for this purpose. Given that Linux is the world''s
    most deployed server operating system, this makes a lot of sense. However, unlike
    some other systems, Linux relies primarily on command line tools for process management.
    Though there are graphical process tools for Linux, the command line tools are
    greatly preferred because of their speed and light footprint. While the GUI tools
    may look pretty, they often create a lot of system load themselves, which somewhat
    defeats the purpose.'
