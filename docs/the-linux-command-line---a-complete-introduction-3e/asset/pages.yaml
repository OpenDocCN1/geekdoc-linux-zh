  md: '# # 16

    NETWORKING


    ![](img/58edd539af3a70704734cedc1ac0c271_210_0.png)


    When it comes to networking, there is probably nothing that cannot be done with
    Linux. Linux is used to build all sorts of networking systems and appliances,
    including firewalls, routers, name servers, network-attached storage (NAS) boxes,
    and on and on.


    Just as the subject of networking is vast, so are the number of commands that
    can be used to configure and control it. We will focus our attention on just a
    few of the most frequently used ones. The commands chosen for examination include
    those used to monitor networks and those used to transfer files. In addition,
    we will explore the ssh program that is used to perform remote logins. This chapter
    will cover the following commands:


    +   * `ping` Send an ICMP ECHO_REQUEST to network hosts.


    +   * `traceroute` Print the route packets trace to a network host.


    +   * `ip` Show/manipulate routing, devices, policy routing, and tunnels.


    +   * `netstat` Print network connections, routing tables, interface statistics,
    masquerade connections, and multicast memberships.


    +   * `ftp` Internet file transfer program.


    +   * `curl` Transfer a URL.


    +   * `wget` Non-interactive network downloader.


    +   * `ssh` OpenSSH SSH client (remote login program).


    We’re going to assume a little background in networking. In this age—the internet
    age—everyone using a computer needs a basic understanding of networking concepts.
    To make full use of this chapter, we should be familiar with the following terms:


    +   * Internet protocol (IP) address'
