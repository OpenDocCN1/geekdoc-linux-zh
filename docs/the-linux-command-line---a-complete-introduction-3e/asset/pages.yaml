- img_proc: true
  md: '# Now let''s look at what happens when we include a variable in our command.


    ```

    [me@linuxbox ~]$ $str=abcd

    [me@linuxbox ~]$ cmd="echo $str"

    [me@linuxbox ~]$ $Scmd

    abcde

    ```


    That does what we expect, let''s see what happens when we assign a new value to
    str.


    ```

    [me@linuxbox ~]$ $str=ABCDE

    [me@linuxbox ~]$ $Scmd

    abcde

    ```


    The results didn''t change. This makes sense because we already performed parameter
    expansion on $str. But if we wanted to have the variable expanded later? We could
    enclose our command in single quotes to suppress parameter expansion during the
    initial variable assignment.


    ```

    [me@linuxbox ~]$ cmd=''echo $str''

    [me@linuxbox ~]$ $Scmd

    Sstr

    ```


    Though we didn''t get the parameter expansion during the assignment of cmd, we
    didn''t get it when we executed cmd eval. The reason for this is the shell performs
    expansion only once even when the expansion ($Scmd) results in something that
    could be further expanded ($Sstr).


    If we use eval, we get the additional level of expansion.


    ```

    [me@linuxbox ~]$ $str=abcd

    [me@linuxbox ~]$ cmd=''echo $str''

    [me@linuxbox ~]$ eval "$Scmd"

    abcde

    [me@linuxbox ~]$ $str=ABCDE

    [me@linuxbox ~]$ eval "$Scmd"

    ABCDE

    ```


    This shows us what eval does. It joins its arguments into a single string; tilde,
    parameter, and pathname expansion on the contents of the string; and then passes
    the string to the current shell (no subshell is created) for execution.


    > BE CAREFUL WITH EVAL'
