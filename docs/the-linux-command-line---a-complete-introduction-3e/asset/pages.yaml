    In previous chapters, we looked at manipulating data at the file level. In this
    chapter, we will consider data at the device level. Linux has amazing capabilities
    for handling storage devices, whether physical storage such as hard disks, network
    storage, or virtual storage devices such as Redundant Array of Independent Dis
    (RAID) and Logical Volume Manager (LVM).


    However, since this is not a book about system administration, we will not try
    to cover this entire topic in depth. What we will try to do is introduce some
    of the concepts and key commands that are used to manage storage devices.


    To carry out the exercises in this chapter, we will use a USB flash drive, a USB
    hard disk drive, and a DVD/CD-RW disc (for systems equipped with a CD-ROM burner).


    We will look at the following commands:


    +   - mount Mount a filesystem.

    - um Unmount a filesystem.

    - parted Partition manipulation program.

    - mkfs Create a filesystem.

    - fsck Check and repair a filesystem.

    - dd Convert and copy a file.

    - genisimage Create an ISO 9660 image file.

    - wodm Write data to optical storage media.

    - sha256sum Compute and check SHA256 checksums.'
