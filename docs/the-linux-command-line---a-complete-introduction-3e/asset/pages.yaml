    # Constructing Commands with eval


    The eval builtin is a strange and mysterious command. Simply described, it takes
    a list of arguments, combines them into a string, and passes it to the shell to
    execute. The question naturally becomes, what is this for? Why would we use this?


    There are certain cases in shell scripting where we need to construct a command
    dynamically at runtime, and eval allows us to do that. Let''s perform an experiment.
    While we didn''t cover it explicitly, it''s possible to place a command in a string
    variable and then rely on parameter expansion to expand the variable into a command.


    ```

    [me@linuxbox~$] cmd="echo foo"

    [me@linuxbox~$] $cmd

    foo

    ```'
  merge: -1
