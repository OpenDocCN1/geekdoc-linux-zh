    \ load $1 with the next\nargument. Here is the program at work:\n\n```\n[linux]$\
    \ posit-param2 a b c d\nArgument 1 = a\nArgument 2 = b\nArgument 3 = c\nArgument\
    \ 4 = d\n```\n\n# Simple Applications\n\nEven without shift, it is possible to\
