    |---|---|-|

    | True | | Always performed |

    | False | | Never performed |

    | True | -or | Never performed |

    | False | -or | Always performed |


    Why does this happen? It’s done to improve performance. Take -and, for example.
    We know that the expression expr1 -and expr2 cannot be true if the result of expr1
    is false, so there is no point in performing expr2. Likewise, if we have the expression
