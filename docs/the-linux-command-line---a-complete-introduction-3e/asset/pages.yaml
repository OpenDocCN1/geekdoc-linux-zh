  md: '# 20

    TEXT PROCESSING


    ![](img/58edd539af3a70704734cedc1ac0c271_269_0.png)


    All Unix-like operating systems rely rely heavily on text files for data storage.
    So, it makes sense that there are many tools for manipulating text. In this chapter,
    we will look at programs that are used to "slice and dice" text. In the next chapter,
    we will look at more text processing, focusing on programs that are used to format
    text for printing and other kinds of human consumption.


    This chapter will revisit some old friends and introduce us to some new ones:


    +   - cat Concatenate files and print on the standard output.

    - sort Sort lines of text files.

    - uniq Report or omit repeated lines.

    - cut Remove sections from each line of files.

    - paste Merge lines of files.

    - join Join lines of two files on a common field.

    - tac Concatenate and print files in reverse.

    - rev Reverse lines characterwise.

    - comm Compare two sorted files by line.

    - diff Compare lines by line.

    - patch Apply a diff file to an original.

    - tr Translate or delete characters.

    - sed Stream editor for filtering and transforming text.

    - aspell Interactive spellchecker.'
  merge: -1
  pgno: 269
- img_proc: true
  md: '# Applications of Text


    So far, we have learned a couple of text editors (nano and vim), looked at a bunch
    of configuration files, and have witnessed the output of dozens of commands, all
    in text. What else is text used for? For many things, it turns out.


    # Documents


    Many people write documents using plaintext formats. While it is easy to see how
    a small text file could be useful for keeping simple notes, it is also possible
    to write large documents in text format. One popular approach is to write a large
    document in a text format and then embed a markup language to describe the formatting
    of the finished document. Many scientific papers are written using this method,
    as Unix-based text processing systems were among the first systems that supported
    the advanced typographical layout needed by writers in technical disciplines.
    In recent years, Markdown has become a popular markup language that uses plaintext
    for document formatting.


    # Web Pages


    The world''s most popular type of electronic document is probably the web page.
    Web pages are text documents that use Hypertext Markup Language (HTML) or Extensible
    Markup Language (XML) as markup languages to describe the document''s format.


    # Email


    Email is an intrinsically text-based medium. Even non-text attachments are probably
    converted into a text representation for transmission. We can see this for ourselves
    by downloading an email message and viewing it in less. We will see that the message
    begins with a header that describes the source of the message and the processing
    it received during its journey, followed by the body of the message with its content.


    # Printer Output


    On Unix-like systems, output destined for a printer is sent as plaintext, or if
    the page contains graphics, it is usually converted into a text format page description
    language known as JavaScript, which is then sent to a printer that generates the
    graphic docs to be printed.


    # Program Source Code


    Many of the command line programs found on Unix-like systems were created to support
    system administration and software development, and text processing programs are
    no exception. Many of them are designed to solve software development problems.
    The reason text processing is important to software developers is that all software
    starts out as text. Source code, the part of the program the programmer actually
    writes, is always in text format.


    # Revisiting Some Old Friends'
  merge: -1
  pgno: 270
- img_proc: true
  md: 'In Chapter 6, we learned about some commands that are able to accept standard
    input in addition to command line arguments. We touched on them briefly then,
    but now we will take a closer look at how they can be used to perform text processing.


    # cat


    The cat has a number of interesting options. Many of them are used to help better
    visualize text content. One example is the -A option, which is used to display
    non-printing characters in the text. There are times when we want to know whether
    control characters are embedded in our otherwise visible text. The most common
    of these are tab characters (as opposed to spaces) and carriage returns, often
    present as end-of-line characters in MS-DOS style text files. Another common situation
    is a file containing lines of text with trailing spaces.


    Let''s create a test file using cat as a primitive word processor. To do this,
    we will just enter the command cat (along with specify file for redirected output)
    and type your text, followed by ENTER to produce the end line and then CTRL-D
    to indicate that we have reached end-of-file. In this example, we use a leading
    tab character and follow the line with some spaces.


    ```

    $linux -JS cat foo.txt

    The quick brown fox jumps over the lazy dog.

    $linux -JS

    ```


    Next, we will use cat with the -A option to display the text.


    ```

    $linux -JS cat -A foo.txt

    ^The quick brown fox jumps over the lazy dog.  $

    $linux -JS

    ```


    As we can see in the results, the tab character in our text is represented by
    ^. This is a common notation that, as it turns out, is the same as a tab character.
    We also see that a s appears at the true end of the line, indicating that our
    text contains trailing spaces.


    # MS-DOS TEXT VS. UNIX TEXT


    One of the reasons you may want to use cat for non-printing characters in text
    is to spot hidden carriage returns. Where do hidden carriage returns come from?
    DOS and Windows! Unix and iOS don''t define the end of a line the same way in
    text files. Unix ends a line with a linefeed (ASCII 10), while MS-DOS and its
    derivatives use the sequence carriage return (ASCII 13) and linefeed to terminate
    each line of text.


    There are several ways to convert files from dos to Unix format. On many Linux
    systems, there are programs dosunix and unix2dos, which can convert text files
    to'
  merge: -1
