    # POSIX


    During the 1980s, Unix became a popular commercial operating system, but by 1988,
    the Unix world was in turmoil. Many computer manufacturers had licensed the Unix
    source code from its creators, AT&T; and were providing various versions of the
    operating system with them. However, in their efforts to create product differentiation,
    each manufacturer added proprietary changes and extensions. This started to limit
    the compatibility of the software. As always with proprietary vendors, each was
    trying to play a winning game of “lock-in” with their customers. This dark time
    in the history of Unix is known today as “Balkanization.”


    Enter the Institute of Electrical and Electronics Engineers (IEEE). In the mid-1980s,
    the IEEE began developing a set of standards that would define how Unix (and Unix-like)
    systems would perform. These standards, formally known as IEEE 1003, define the
    application programming interfaces (APIs), shell, and utilities that are to be
    found on a standard Unix-like system. The name POSIX, which stands for “Portable
    Operating System Interface” with the X added to the end for extra swiftness, was
    suggested by Richard Stallman (yes, that Richard Stallman) and was adopted by
    the IEEE.


