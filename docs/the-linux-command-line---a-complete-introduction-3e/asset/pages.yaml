    # xargs


    The xargs command performs an interesting function. It accepts input from standard
    input and converts it into an argument list for a specified command. With our
    example, we would use it like this:


    ```

    find -type f -name ''foo'' -print | xargs ls -l

    -rw-xr-x- 1 me 224 2016-10-29 18:44 /home/ne/bin/foo

    -rw-r--r-- 1 me 0 2025-09-19 12:53 /home/ne/foo.txt

    ```


    Here we see the output of the find command piped into xargs, which, in turn, constructs
    an argument list for the ls command and executes it.


    > While the number of arguments that can be placed into a command line is large,
    it''s not unlimited. It is possible to create commands that are too long for the
    shell to accept. When a command line exceeds the maximum length supported by the
    system, xargs executes the specified command with the maximum number of arguments
    possible and then repeats this process until standard input is exhausted. To see
    the maximum size of the command line, execute xargs with the --show-units.


    # DEALING WITH FUNNY FILENAMES


    Unix-like systems allow embedded spaces (and even newlines!) in filenames. This
    causes problems for programs like find that construct argument lists for other
    programs. An embedded space will behave as a delimiter, and the resulting command
    will interpret each space-separated word as a separate argument. To overcome this,
    find and xargs allow the use of a null character as an argument separator. A null
    character is defined in ASCII as the character represented by the number zero
    (as opposed to, for example, the space character, which is defined in ASCII as
    the character represented by the number 32). The find provides the action -print
    which produces null-separated output, and the xargs command has the --null (or
    -0) option, which accepts null-separated input. Here''s an example:


    ```

    find -name ''*.jpg'' -print | xargs --null ls -l

    ```


    Using this technique, we ensure that all files, even those containing embedded
    spaces in their names, are handled correctly.'
