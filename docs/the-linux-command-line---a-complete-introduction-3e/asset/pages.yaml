  md: '# # WARNING


    In the examples that follow, it is vitally important you pay close attention to
    the actual device names in your system and do not use the names used in this text!


    Now that we have the device name of the flash drive, let''s unmount the drive
    and remount it at another location in the filesystem tree. To do this, we become
    the superuser (using the command appropriate for our system) and unmount the drive
    with the (notice the spelling) command.


    ```

    [me@linuxbox~]# sudo -i

    [sudo] password for me:

    [root@linuxbox~]# umount /dev/sdc

    ```


    The next step is to create a new mount point for the disk. A mount point is simply
    a directory somewhere on the filesystem tree. There''s nothing special about it.
    It doesn''t have to be an empty directory, though if you mount a device on a non-empty
    directory, you will not be able to see the directory''s previous contents until
    you unmount the device. For our purposes, we will create a new directory.


    ```

    [root@linuxbox~]# mkdir /mnt/flash

    ```


    Finally, we mount the flash drive at the new mount point. The -t option is used
    to specify the filesystem type.


    ```

    [root@linuxbox ~]# mount -t vfat /dev/sdc /mnt/flash

    ```


    Afterward, we can examine the contents of the flash drive via the new mount point.


    ```

    [root@linuxbox ~]# cd /mnt/flash

    [root@linuxbox cdron]# ls

    ```


    Notice when we try to unmount the drive.


    ```

    [root@linuxbox cdron]# umount /dev/sdc

    unmount: /mnt/flash: device is busy

    ```


    Why is this? The reason is that we cannot unmount a device if the device is being
    used by someone or some process. In this case, we changed our working directory
    to the mount point for the flash drive, which causes the device to be busy. We
    can easily remedy this by changing the working directory to something other than
    the mount point.


    ```

    [root@linuxbox cdron]# cd

    [root@linuxbox ~]# umount /dev/sdc

    ```


    Now the device unmount successfully.


