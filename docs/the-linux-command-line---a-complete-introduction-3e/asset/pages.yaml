    Our script currently performs the following steps to generate the HTML document:


    +   1. Open page.


    +   2. Open page header.


    +   3. Set page title.


    +   4. Close page header.


    +   5. Open page body.


    +   6. Output page heading.


    +   7. Output timestamp.


    +   8. Close page body.


    +   9. Close page.


    For our next stage of development, we will add some tasks between steps 7 and
    8. We will include the following:


    **System uptime and load** This is the amount of time since the last shutdown
    or reboot and the average number of tasks currently running on the processor over
    several time intervals.


    **Disk space** This is the overall use of space on the system''s storage devices.


    **Home space** This is the amount of storage space being used by each user.


    If we had a command for each of these tasks, we could add them to our script simply
    through command substitution.


    ```

    #!/bin/bash

    ```'
