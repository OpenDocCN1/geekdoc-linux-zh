  md: 'PS1="\e[e;0mH\e[0;41mK\e[1;33mt\t\e[0m\e[u]<u@\h w\-\$ "


    Table 13-5 outlines what part of the string does.


    # Table 13-5: Breakdown of Complex Prompt String


    | Sequence | Action |

    | --- | --- |

    | \\[ | Begin a non-printing character sequence. The purpose of this is to allow
    bash to properly calculate the size of the visible prompt. Without an accurate
    calculation, command line editing features cannot position the cursor correctly.
    |

    | \e[s | Store the cursor position. This is needed to return to the prompt location
    after the clock have been drawn at the top of the screen. *Beware that some terminal
    emulators do not recognize this code.* |

    | \e[0;H | Move the cursor to the upper-left corner, which is line 0, column 0.
    |

    | \e[0;41m | Set the background color to red. |

    | \e[K | Clear from the current cursor location (the top-left corner) to the end
    of the line. Since the background color is red, the line is cleared to that color,
    creating our bar. Note that clearing to the end of the line does not change the
    cursor position, which remains in the upper-left corner. |

    | \e[1;33m | Set the text color to yellow. |

    | \t | Display the current time. While this is a "printing" element, we still
    include it in the non-printing portion of the prompt since we don''t want bash
    to include the clock when calculating the true size of the displayed prompt. |

    | \e[0m | Turn off the color. This affects both the text and the background. |

    | \e[u | Restore the cursor position saved earlier. |

    | \] | End the non-printing characters sequence. |

    | <u@\h w\-\$ | Prompt string |


