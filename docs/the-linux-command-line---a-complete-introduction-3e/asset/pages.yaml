    # Group Commands and Subshells


    bash allows commands to be grouped together. This can be done in one of two ways,
    either with a group command or a subshell. We introduced group commands back in
    Chapter 6, and as we recall, a group command uses this syntax:


    ```

    { command1; command2; [command3; ...] }

    ```


    Subshells use a similar syntax.


    ```

    command1; command2; [command3;...]

    ```


    A group command surrounds its commands with braces and a subshell uses parentheses.
    It is important to note that, because of the way bash implements group commands,
    the braces must be separated from the commands by a space and the last command
    must be terminated with either a semicolon or a newline prior to the closing brace.


    So, what are group commands and subshells good for? While they have an important
    difference (which we will get to in a moment), both can be used to manage redirection.
    Let''s consider a script segment that performs redirection on multiple commands.


    ```

    ls -l > output.txt

    echo "Listing of foo.txt" >> output.txt

    cat foo.txt >> output.txt

    ```'
