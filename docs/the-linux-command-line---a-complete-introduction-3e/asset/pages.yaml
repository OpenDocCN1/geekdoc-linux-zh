  md: 'Let''s take a look at the mechanics of this script:


    # Line 5


    Associative arrays must be created with the declare command using the -A option.
    In this script, we create five arrays as follows:


    +   - files contains the names of files in the directory, indexed by filename.

    - file_group contains the group owner of each file, indexed by filename.

    - file_owner contains the owner of each file, indexed by filename.

    - groups contains the number of files belonging to the indexed group.

    - owners contains the number of files belonging to the indexed owner.


    # Lines 7–10


    These lines check to see that a valid directory name was passed as a positional
    parameter. If not, a usage message is displayed and the script exits with an exit
    status of 1.


    # Lines 12–20


    These lines loop through the files in the directory. Using the stat command, lines
    13 and 14 extract the names of the file owner and group owner and assign the values
    to their respective arrays (lines 16 and 17) using the name of the file as the
    array index. Likewise, the filename itself is assigned to the files array (line
    15).


    # Lines 18–19


    The total number of files belonging to the file owner and group owner are incremented
    by one.


    # Lines 22–27


    The list of files is output. This is done using the "${array[@]}" parameter expansion,
    which expands into the entire list of array elements with each element treated
    as a separate word. allow for the possibility that a filename may contain embedded
    spaces. Also note that the entire loop is enclosed in braces, forming a group
    command. This permits the output of the loop to be piped into the sort command.
    This is necessary because the expansion of the associative array elements is not
    sorted.


    # Lines 29–40


    These two loops are similar to the file list loop except that they use the "${array[@]}"
    expansion, which expands into the list of array indexes rather than the list of
    array elements.


