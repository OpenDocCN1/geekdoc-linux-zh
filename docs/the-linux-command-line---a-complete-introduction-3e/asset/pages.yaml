    # Expansions That Return Variable Names


    The shell has the ability to return the names of variables. This is used in some
    rather exotic situations.


    ```

    $!(prefix*)

    $!(prefix@)

    ```


    This expansion returns the names of variables with names beginning with prefix.
    According to the bash documentation, both forms of this expansion perform identically.
    Here, we list all variables in the environment with names that begin with bash:


    ```

    $me@linux -$ echo ${BASH*}

    BASH_ARG ARGV BASH_COMMAND BASH_COMPLETION BASH_COMPLETION_DIR

    BASH_LINEND BASH_SOURCE BASH_SHELL BASH_VERSINFO BASH_VERSION

    ```


    # String Operations


    There is a large set of expansions that operate on strings. Many of these expansions
    are well suited for operations on pathnames. The following expansion expands the
    length of the string contained by parameter:


    ```

    $$(parameter)

    ```


    Normally, parameter is a string; if parameter is either @ or *, then the expansion
    results in the number of positional parameters.


    ```

    $me@linux -$ foo="This string is long."

    $me@linux -$ echo "${foo} S$(foo) characters long."

    ''This string is long.'' is 20 characters long.

    ```


    These expansions are used to extract a portion of the string contained in parameter:


    ```

    $$(parameter:offset)

    $(parameter:offset:length)

    ```


    The extraction begins at offset characters from the beginning of the string and
    continues until the end of the string, unless length is specified.


    ```

    $me@linux -$ foo="This string is long."

    $me@linux -$ echo "${foo:5}"

    string long.

    $me@linux -$ echo "${foo:5:6}"

    string

    ```


    If the value of offset is negative, it is taken to mean it starts from the end
    of the string rather than the beginning. Note that negative values must be preceded
    by a space to prevent confusion with the s(parameter:-word) expansion. length,
    if present, must not be less than zero.'
