    process cannot alter the environment of its parent. When a child process terminates,
    it takes its environment with it. This will become important when we start writing
    shell scripts.


    # Launching a Program with a Temporary Environment


    Another handy trick the shell is the ability to execute a command and give it
    a temporary environment variable. Sometimes we want to run a program and give
    it a special environment value. A good example is the man command, which looks
    for an environment variable named MANWIDTH tells man how to format its output.
    For example, to have man format its output a maximum of 75 characters wide (a
    handy setting for easy reading), we can do this:


    ```

    me@linuxbox ~$ MANWIDTH=75 ls

    ```


    This outputs the page for the ls command nicely formatted to a comfortable width.
    By this way, it is a good thing to alias.


    ```

    me@linuxbox ~$ alias man=''MANWIDTH=75 man''

    ```


    Now whenever we use the man command, it will always limit line length to 75 characters.
    For more advanced temporary environments, see the env command.


    # Modifying the Environment


    Since we know the startup files are and what they contain, we can modify them
    to customize our environment.


    # Which Files Should We Modify?


    As a general rule, to add directories to your PATH or define additional environment
    variables, place these changes in bash_profile (or the equivalent, according to
    your distribution); for example, Ubuntu uses .profile. For everything else, place
    the changes in .bashrc.


    # NOTE


    Unless you are the system administrator and need to change the defaults for all
    users of the system, restrict your modifications to the files in your home directory.
    It is certainly possible to change the files in /etc such as profile, and in many
    cases it would be sensible to do so, for'
