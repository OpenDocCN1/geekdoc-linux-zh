  md: '# Style Command


    | Style | Command |

    |---|---|

    | Debian | apt remove package_name |

    | Red Hat | dnf erase package_name |


    For example, to uninstall the emacs package from a Debian-style system, we can
    use this command:


    ```

    apt remove emacs

    ```


    # Updating Packages from a Repository


    The most common package management task is keeping the system up-to-date with
    the latest versions of packages. The high-level tools can perform this vital task
    in a single step (see Table 14-7).


    Table 14-7: Package Update Commands


    | Style | Command(s) |

    |---|---|

    | Debian | apt update

    apt upgrade |

    | Red Hat | dnf update |


    For example, to apply all available updates to the installed packages on a Debian-style
    system, we can use this command:


    ```

    apt update; apt upgrade

