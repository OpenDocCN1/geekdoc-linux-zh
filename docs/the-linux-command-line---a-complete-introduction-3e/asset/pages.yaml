    # groff


    groff is a suite of programs containing the GNU implementation of troff. It also
    includes a script that is used to emulate roff and the rest of the family as well.


    While roff and its descendants are used to make formatted documents, they do it
    in a way that is far foreign to modern users. Most documents are produced using
    word processors that are able to perform both the composition and the layout of
    a document in a single step. Prior to the advent of the graphical word processor,
    documents were often produced in a two-step process involving the use of a text
    editor to perform composition, and a processor, such as troff, to apply the formatting.
    Instructions for the formatting program were embedded into the composed text through
    the use of a markup language. The modern analog for such a process is the web
    page, which is composed using a text editor of some kind and then rendered by
    a web browser using HTML as the markup language to describe the final page layout.


    We''re not going to cover groff in its entirety, as many elements of its markup
    language deal with arcane details of typography. Instead, we will concentrate
    on one of its macro packages that are in wide use. These macro packages condense
    many of their low-level commands into a smaller set of high-level commands that
    make using groff much easier.


    For a moment, let''s consider the humble man page. It lives in the /usr/share/man
    directory as a gzip-compressed text file. If we were to examine its uncompressed
    contents, we would see the following (the man page for section 1 is):


    ```

    [me@linuxbox~$ zcat /usr/share/man/man1/ls.gz | head

    ```


    ```

    \. DO NOT MODIFY THIS FILE! It was generated by help2man 1.47.3.

    .TH LS -1 "January 2025" "GNU coreutils 8.28" "User Commands"

    .SH NAME

    ls -l list directories

    .SH SYNOPSIS

    .B ls

    [f\|OPTION|\FR]... [f\|FILE|\FR]...

    .SH DESCRIPTION

    \. Add any additional description here

    .PP

    ```


    Compared to the man page in its normal presentation, we can begin to see a correlation
    between the markup language and its results.'
