    # Create Links


    The command is used to create either hard or symbolic links. It is used in one
    of two ways. The following creates a hard link:


    ```

    ln file link

    ```


    The following creates a symbolic link


    ```

    ln -s item link

    ```


    where item is either a file or a directory.


    # Hard Links


    Hard links are the original Unix way of creating links, compared to symbolic links,
    which are more modern. By default, every file has a single hard link that gives
    the file its name. When we create a hard link, we create an additional directory
    entry for a file. Hard links have two important limitations.'
  merge: -1
  pgno: 61
- img_proc: true
  md: '+   - A hard link cannot reference a file outside its own filesystem. This
    means a link cannot reference a file that is not on the same disk partition as
    the link itself.


    +   - A hard link may not reference a directory.


    A hard link is indistinguishable from the file itself. Unlike a symbolic link,
    when we list a directory containing a hard link we will see no special indication
    of the link. When a hard link is deleted, the link is removed, but the contents
    of the file itself continue to exist (that is, its space is not deallocated until
    all links to the file are deleted).


    It is important to be aware of hard links because you might encounter them from
    time to time, but modern practice prefers symbolic links, which we will cover.


    #  Symbolic Links


    Symbolic links were created to overcome the limitations of hard links. They work
    by creating a special type of file that contains a text pointer to the referenced
    file or directory. In this regard, they operate in much the same way as a Windows
    shortcut, though of course they precede the Windows feature by many years.


    A file pointed to a symbolic link and the symbolic link itself are largely indistinguishable
    from one another. For example, if we write to the symbolic link, the referenced
    file is written to. However, when we delete a symbolic link, only the link is
    deleted, not the file. If the file is deleted before the symbolic link, the link
    will continue to exist but point to nothing. In this case, the link is said to
    be *broken*. In many implementations, the `ls` command will display broken links
    in a distinguishing color, such as red, to reveal their presence.


    The concept of links can seem confusing, but hang in there. We''re going to try
    all this, and it will become clear.


