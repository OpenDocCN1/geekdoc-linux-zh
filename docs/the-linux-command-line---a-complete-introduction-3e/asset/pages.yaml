    can precede the command with a backslash; the alias will be ignored, and the ls
    will be executed without the color option.


    # Backslash Escape Sequences


    In addition to its role as the escape character, the backslash is also used as
    a notation to represent certain special characters called control codes. The first
    32 characters of the ASCII coding scheme are used to transmit commands to teletype-like
    devices such as our terminal. Some of these codes are familiar (tab, backspace,
    linefeed, and carriage return), while others are not (null, end-of-transmission,
    and acknowledge).'
