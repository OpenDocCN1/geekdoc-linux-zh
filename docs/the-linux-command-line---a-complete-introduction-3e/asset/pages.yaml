  md: '# Ubuntu 8.10 10/30/2008


    Though we used the long form of option for clarity, -k 1,1 -k 2 would be exactly
    equivalent. In the first instance of the key option, we specified a range of fields
    to include the first key. Since we wanted to limit the sort to just the first
    field, we specified 1,1, which means "start at field 1 and end at field 1.\ In
    the second instance, we specified zn, which means field 2 is the sort key and
    that the sort should be numeric. An option letter may be included at the end of
    a key to specify the type of sort to be performed. The other options are the same
    as the global options for the sort program: b (ignoring blanks), n (numeric sort),
    r (reverse sort), and so on.


    The third field in our list contains an inconvenient format for sorting. Computers,
    are usually formatted in YYYY-MM-DD to make chronological sorting easy, but ours
    in the American format of MM/DD/YYYY. How can we sort this list in chronological
    order?


    Fortunately, sort doesn''t provide a way. The key option provides of offsets within
    fields, so we can define keys within fields.


    ```

    $ linux -js sort -k 3.7nbr -k 3.1nbr -k 3.4nbr distros.txt

    Fedora 10 11/25/2008

    Ubuntu 8.10 10/30/2008

    SUSE 11.0 06/19/2008

    Fedora 9 05/13/2008

    Ubuntu 8.04 04/24/2008

    Fedora 8 11/08/2007

    Ubuntu 7.10 10/31/2007

    SUSE 10.3 10/04/2007

    Fedora 7 05/31/2007

    Ubuntu 7.04 04/19/2007

    SUSE 10.2 12/07/2006

    Ubuntu 6.10 10/26/2006

    Fedora 6 10/24/2006

    Ubuntu 6.06 06/01/2006

    SUSE 10.1 05/11/2006

    Fedora 5 03/28/2006

    ```


    By specifying -k 3,7 we instruct sort to use a key that begins at the seventh
    character within the third field, which corresponds to the start of the day. Likewise,
    we specify -k 3.1 and -k 3.4 to isolate the month and day portions of the date.
    We also add the n and r options to achieve a reverse numeric sort. The b option
    is included to suppress the leading spaces (whose numbers don''t vary from line
    to line, thereby affecting the outcome of the sort) in the date field.


    Some files don''t use tabs and spaces as field delimiters; for example, here''s
    the /etc/passwd file:


    ```

    $ linux head /etc/passwd

    root:x:0:0:root:/bin/bash

    daemon:x:1:1:daemon:/usr/sbin/sh

    ```'
