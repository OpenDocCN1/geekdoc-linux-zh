  md: "# 33\nFLOW CONTROL: LOOPING WITH FOR\n\nIn this final chapter on flow control,\
    \ we will look at another of the shell's looping\nconstructs. The for loop differs\
    \ from the while and until loops in that it provides a means of\nprocessing sequences\
    \ during a loop. This turns out to be useful when programming.\nAccordingly, the\
    \ for loop is a popular construct in bash scripting.\n\nA for loop is implemented,\
    \ naturally enough, with the compound command. In bash,\nfor is available in two\
    \ forms.\n\n# for—Traditional Shell Form\n\nThe original for command's syntax\
    \ is as follows:\n\n```\nfor variable [in words]; do\n  commands\n```\n\nHere,\
    \ variable is the name of a variable that will increment during the execution\
    \ of the loop,\nwords is an optional list of items that will be sequentially assigned\
    \ to variable, and commands\nt commands that are to be executed on each iteration\
    \ of the loop.\n\nThe for command is useful on the command line. We can easily\
    \ demonstrate how it\nworks:\n\n```\n$me@linuxbox ~$ for i in A B C D; echo $i;\
    \ done\nA\nB\nC\nD\n```\n\nIn this example, for is given a list of four words:\
    \ A, B, C, and D. With a list of four words,"
  merge: -1
  pgno: 440
- img_proc: true
  md: "the loop is executed four times. Each time the loop is executed, a word is\
    \ assigned to the variable i. Inside the loop, we have an echo command that displays\
    \ the value of i to show the assignment. As with the while and until loops, the\
    \ done keyword closes the loop.\n\nThe really powerful feature of for is the number\
    \ of interesting ways we can create the list of words. For example, we can do\
    \ it through brace expansion, like so:\n\n```\nmelinux -S for i in {A..D}; do\
    \ echo $i; done\n```\n\nOr we could use pathname -S, as follows:\n\n```\nmelinux\
    \ -S for i in distros*.txt; do echo \"$i\"; done\ndistros-by-date.txt\ndistros-dates.txt\n\
    distros-key-names.txt\ndistros-key-vernums.txt\ndistros-names.txt\ndistros.txt\n\
    dros.txt\ndistros-vernums.txt\ndistros-versions.txt\n```\n\nPathname expansion\
    \ provides a nice, clean list of pathnames that can be processed in the loop.\
    \ The precaution needed is to check that the expansion actually matched something.\
    \ By default, if the expansion fails to match any files, the wildcards themselves\
    \ (distros*.txt in the previous example) will be returned. To guard against this,\
    \ we would code the previous example in a script like this:\n\n```\nfor i in distros*.txt;\
    \ do\n  if [[ -e \"$i\" ]]; then\n    echo \"$i\"\nfi\ndone\n```\n\nBy adding\
    \ a test for file existence, we will ignore a failed expansion. Another common\
    \ method of word production is command substitution:\n\n```\n#!/bin/bash\n\n#\
    \ longest-word: find longest string in a file\n\nwhile [[ -n \"$1\" ]]; do\n \
    \ if [[ -r \"$1\" ]]; then\n    max_len=0\n    for i in $(strings -n \"$1\");\
    \ do\n      len=$(echo -n \"$i\" | wc -c)\n```"
