    | 7 Ubuntu | 6.10 | 10/26/2006 |

    | 8 Fedora | 7 | 05/31/2007 |

    | 9 Ubuntu | 7.10 | 10/18/2007 |

    | 10 Ubuntu | 7.04 | 04/19/2007 |


    Like cat, nl can accept multiple files as command line arguments or standard input.
    However, nl has a number of options and supports a primitive form of markup to
    allow more complex kinds of numbering.


    nl supports a concept called logical pages when numbering. This allows nl to reset
    over the numerical sequence when numbering. Using options, it is possible to set
    the starting number to a specific value and, to a limited extent, its format.
    A logical page is further broken down into a header, body, and footer. Within
    each of these sections, line numbering may be reset/or assigned a different style.
    If nl given multiple files, it treats them as a single stream of text. Sections
    in the text stream are indicated by the presence of some rather-odd-looking markup
    added to the text, as described in Table 21-1.


    # ### Table 21-1: nl Markup


    | Markup | Meaning |

    | \:|- | Start of logical page header |

    | \:\: | Start of logical page body |

    | : | Start of logical page footer |


    Each of the markup elements listed in Table 21-1 must appear on its own line.
    After processing a markup element, nl deletes it from the text stream.

    Table 21-2 lists the common options for nl.


    # ### Table 21-2: Common nl Options


    | Option | Meaning |

    | -b style | Set body numbering to style, where style is one of the following:

    a = Number all lines.

    t = Number only non-blank lines. This is the default.

    n = None.

    prexp = Number only lines matching regular expression regex. |

    | -f style | Set footer numbering to style. The default is n (none). |

    | -h style | Set header numbering to style. The default is n (none). |

    | -i number | Set page numbering increment to number. The default is 1. |'
