    [me@linux ~]$S echo "This Works." | grep -E ''^[:upper:][:lower:]*$\''

    This works.

    [me@linux ~]$S echo "This Works." | grep -E ''^[:upper:][:lower:]*$\''

    This works.

    [me@linux ~]$S echo "does not" | grep -E ''^[:upper:][:lower:]*$\''

    [me@linux ~]$

    ```


    The expression matches the two tests, not the third, since it lacks the required
    leading uppercase character and trailing period.


    # Match an Element One or More Times


    The + metacharacter works much like the *, except it requires at least one instance
    of the preceding element to cause a match. Here is a regular expression that will
    match lines consisting of groups of one or more alphabetic characters separated
    by single spaces:'
