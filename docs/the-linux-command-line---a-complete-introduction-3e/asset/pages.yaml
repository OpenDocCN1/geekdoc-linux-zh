- img_proc: true
  md: 'This is pretty straightforward. Three commands have their output redirected
    to a file named output.txt. Using a group command, we could code this as follows:


    ```

    { ls -l; echo "Listing of foo.txt"; cat foo.txt; > output.txt

    ```


    Using a subshell is similar.


    ```

    (ls -l; echo "Listing of foo.txt"; cat foo.txt) > output.txt

    ```


    Using this technique we saved ourselves some typing, but where a group command
    or subshell really shines is. When constructing a pipeline of commands, it is
    often useful to combine the results of several commands into a single stream.
    Group commands and subshells make this easy.


    ```

    { ls -l; echo "Listing of foo.txt"; cat foo.txt; } | lpr

    ```


    Here we have combined the output of our three commands and piped them into the
    input of lp to produce a printed report.


    While commands and subshells look similar and can be used to combine commands
    for redirection, there is an important difference between the two. Whereas a group
    command executes all of its commands in the current shell, a subshell (as the
    name suggests) executes its commands in a child copy of the current shell. This
    means the environment (including shell functions, aliases, and variables) is copied
    and given to a new instance of the shell. This copy of the environment is different
    from the way a process ordinarily works in the shell inherits an entire copy of
    the parent''s environment, whereas a child process inherits only the exported
    variables from the parent shell. When the subshell exits, its copy of the environment
    is lost, so any changes made to the subshell''s environment (including variable
    assignments) are lost as well.


    Most importantly, subshells, like child processes and unlike group commands, cannot
    alter the parent shell''s environment. Let''s demonstrate first with a group command:


    ```

    @linux -js foo="Original Value"

    @linux -js { "Altered Value"; echo foo; }

    Altered Value

    @linux -js echo foo

    Altered Value

    ```


    Next, we''ll do the same steps with a subshell.


    ```

    @linux -js foo="Original Value"

    @linux -js { "Altered Value"; echo foo }

    Altered Value

    @linux -js echo foo

    Original Value

    ```


    As we can see, the group command is able to modify the value of foo in the current
    shell while the subshell cannot. This characteristic of subshells is handy when
    we want to do something like change directories. When we perform a cd command
    in a subshell,'
