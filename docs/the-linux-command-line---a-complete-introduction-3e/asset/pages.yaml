    # Summing Up


    Given that text is central to the character of Unix-like operating systems, it
    makes sense that there are many tools that we use manipulate and format text.
    As we have seen, there are! The simple formatting tools like *ftnt* and *pr* will
    find many uses in scripts that produce short documents, while *groff* (and friends)
    can be used to write books. We may never write a technical paper using command
    line tools (though there are many people who do!), but it''s good to know that
    we could.'
