    Here we use find to match all the files in the playground named file-A and then,
    using the -exec action, we invoke tar in the append mode (r) to add the matching
    files to the archive playground.tar.


    Using tar with find is a good way of creating incremental backups of a directory
    tree or an entire system. By using find to match files newer than a timestamp
    file, we can create an archive that contains only files newer than the last archive,
    assuming that the timestamp file is updated after each archive is created.


    tar can also make use of standard input and output. Here is a comprehensive example:


    ```

    @linuxbox foo] $ cd

    @linuxbox -js find playground -name ''file-A'' | tar cf --files-from=- | zip

    playground.tgz

    ```


    In this example, we used the find to produce a list of matching files and pipe
    them into tar. If the filename is specified, it is taken to mean standard input
    or output is by a number of outputs too. By this convention, using the -files-from
    option (which can also be specified as -T) causes tar to read its list of filenames
    from a file rather than the command line. Lastly, the archive produced by tar
    is piped into zip to create the compressed archive playground.tgz. The .tgz extension
    is the conventional extension given to zip-compressed files. The extension.tar.gz
    is also used sometimes.


    While we used zip to externally produce the compressed archive in the previous
    example, modern versions of GNU tar support both zip and bzip2 directly with the
    z and j options. Using our previous example as a base, we can simplify it to:


    ```

    @linuxbox -js find playground -name ''file-A'' | tar czf playground.tgz -T

    ```


    If we wanted to create a bzip2-compressed archive instead, we could do this:


    ```

    @linuxbox -js find playground -name ''file-A'' | tar cjf playground.tbz -T -

    ```


    By simply changing the compression option from z to j (and changing the output
    file''s extension to .tbz to indicate a bzip2-compressed file), we enabled bzip2-compression.


