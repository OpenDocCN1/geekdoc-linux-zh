  md: '# Operators


    Even with all the tests that find provides, we may still need a better way to
    describe the logical relationships between the tests. For example, what if we
    needed to determine whether all the files and subdirectories in a directory had
    secure permissions? We would look for all the files with permissions that are
    not 0600 and the directories with permissions that are not 0700. find provides
    a way to combine tests using logical operators to create complex relationships.
    To express the affiliation, we could do this:


    ```

    me@linuxbox~$ find ~ \( -type f -not -perm 0600 \) -or \( -type d -not -perm 0700
    \)

    ```


    Yikes! That seems looks weird. What is all this stuff? Actually, the operators
    are not complicated once you get to know them. Table 17-4 describes the logical
    operators used with find.


    # Table 17-4: find Logical Operators


    | Operator | Description |

    | --- | --- |

    | -and | Match if the tests on both sides of the operator are true. This can be
    shortened to -a. Note that when no operator is present, -and is implied by default.
    |

    | -or | Match if a test on either side of the operator is true. This can be shortened
    to -. |

    | -not | Match if the test following the operator is false. This can be abbreviated
    with an exclamation point (!). |

    | ( ) | Groups tests and operators together to form larger expressions. This is
    used to control the precedence of the logical evaluations. By default, find evaluates
    from left to right. It is often necessary to override the default evaluation order
    to obtain the desired result. Even if not needed, it is helpful to include the
    grouping characters to improve the readability of the command. Note that since
    the parentheses have special meaning to the shell, they must be quoted when using
    them on the command line to allow them to be passed as arguments to find. Usually
    the backslash character is used to escape them. It is also important that the
    ( and ) characters be surrounded by spaces to separate them from other words in
    the command. For example, find ~ \ -type f \). |


    With this list of operators in hand, let''s deconstruct our find command. When
    viewed from the uppermost level, we see that our tests are arranged as two groupings
    separated by -or operator.


    ```

    ( expression 1 ) -or ( expression 2 )

    ```'
