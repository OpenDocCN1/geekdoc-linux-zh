  md: '# Slicing Dicing


    The next three programs we will discuss are used to peel columns of text out of
    files and recombine them in useful ways.


    # cut


    The cut program is used to extract a section of text from a line and output the
    extracted section to standard output. It can accept multiple file arguments or
    input from standard input.


    Specifying the section of the line to be extracted is somewhat awkward and is
    specified using the options listed in Table 20-3.


    Table 20-3: cut Selection Options


    | Option Long option | Description |

    |---|---||

    | -c list | characters=list | Extract the portion of the line defined by list.
    The list may consist of one or more comma-separated numerical ranges. |

    | -f list | --fields=list | Extract one or more fields from the line defined as
    list. The list may contain one or more fields or fields separated by commas. |

    | -d delim | --delimiter=delim | When -f is used, use delim as the field delim
    character. By default, fields must be separated by a single tab character. |

    | N/A | --complement | Extract the entire line of text, except for those portions
    specified by -c and/or -f. |


    As we can see, the way cut extracts is rather inflexible. cut is best to extract
    text from files that are produced by other programs, rather than text typed by
    humans. We''ll take a look at our distros.txt file to see whether it "clean" enough
    to be a good specimen for our examples. If we use cut with the -A option, we can
    see whether the file meets our requirements of tab-separated fields.


    ```

    $ me@linuxbox~$ cut -A distros.txt

