  md: '# About the Author


    William Shotts is the former vice president of technical services at Media Cybernetics
    LLC. Now retired, he started his computing career in 1978 when he acquired his
    first computer. Since then, he has been a teacher, a photographer, a programmer,
    and a technical manager of diverse teams of technical support specialists, software
    quality assurance testers, system administrators, and technical writers. He earned
    a bachelor of industrial design degree from Syracuse University. He has been a
    Linux user and advocate since 1996 and is the creator of LinuxCommand.org.'
  merge: -1
