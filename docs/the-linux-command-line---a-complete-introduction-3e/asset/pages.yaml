- img_proc: true
  md: '“automagically” mount the device and determine the name after the fact. But
    what if we are managing a server or some other environment where this does not
    occur? How can we figure it out?


    First, let''s look at how the system names devices. If we list the contents of
    the /dev directory (where all devices live), we can see that there are lots and
    lots of devices.

    [me@linuxbox ~]$ ls /dev


    The contents of this listing reveal some patterns of device naming. Table 15-2
    outlines one of these patterns.


    # Table 15-2: Linux Storage Device Names


    | Pattern | Device |

    | --- | --- |

    | /dev/fd* | Floppy disk drives. |

    | /dev/bd* | IDE (PATA) disks on older systems. Motherboards on these systems
    contain two IDE connectors or channels, each with a cable with two attachment
    points for drives. The first drive is called the master device, and the second
    is the slave device. The device names are ordered that /dev/hda refers to the
    master device on the first channel, /dev/bdb is the master device on the second
    channel, and so on. A trailing digit indicates the partition number on the device.
    For example, /dev/hda1 refers to the first partition on the hard drive on the
    system, /dev/bda refers to the entire device. |

    | /dev/lp* | Printers. |

    | /dev/sd* | SCSI disks. On modern Linux systems, the kernel treats all disk-like
    devices (including PATA/SATA hard disks, flash drives, and USB storage devices
    as portable music players and digital cameras) as SCSI disks. The rest of the
    naming system is similar to the older /dev/bd* naming described previously |

    | /dev/sr* | Optical drives (CD/DVD readers and burners). |


    In addition, we often see symbolic links such as /dev/cdrom, /dev/dvd, and /dev/floppy,
    which point to the actual device files, provided as a convenience.


