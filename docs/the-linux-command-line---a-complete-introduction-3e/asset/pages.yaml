    # Document Formatting Systems


    So far, we have examined the simple text-formatting tools. These are good for
    small, simple tasks, but what larger jobs? One of the reasons Unix became a popular
    operating system among technical and scientific users (aside from providing a
    powerful multitasking, multiuser environment for all kinds of software development)
    is it offered tools that could be used to produce many types of documents, particularly
    scientific and academic publications. In fact, the GNU documentation describes,
    document preparation was instrumental to the development of Unix.


    The first version of UNIX was developed on a PDF-7 which was stiring around Bell
    Labs. In 1971 the developers wanted to get a PDF-11 for other operating system.
    In order to justify the cost for the system, they proposed that they would implement
    a document formatting system for the AT&T division. This first formatting program
    was a replementation of McIlroy’s roff, written by J. Fossanna.


    Two main families of document formatters dominate the field: those descended from
    the original roff program, including noff and troff, and those based on Donald
    Knuth’s tex (pronounced “tek”) typesetting system. And, the dropped “E” in the
    middle is part of its name.


    The roff program is derived from the term roff off as in, “I’ll run off a copy
    for you.” It is used to format output for devices that use monospace fonts, such
    as character and typewriter-style printers. At the time of its introduction, this
    included all printing devices attached to computers. The later troff program formats
    documents for output on typesetters, devices used to produce “camera-ready” type
    for commercial printing. Most computer printers today are able to simulate the
    output of typesetting. The roff family also includes some programs that are used
    to prepare portions of documents. These include eq (for mathematical equations)
    and tbl.


    The TEX system (in stable form) first appeared in 1989 and, to some degree, displaced
    troff as the tool of choice for typesetter output. We’re not covering TEX here,
