- img_proc: true
  md: 'The main program we will use to work with regular expressions is our old pal
    grep. The name grep is actually derived from the phrase "global regular expression
    print", so we can see that grep has something to do with regular expressions.
    In essence, grep searches text files for the occurrence text matching a specified
    regular expression and outputs any line containing a match to standard output.


    So far, we have used grep with fixed strings, like so:


    ```

    @me@linuxbox~$ ls /usr/bin grep

    ```


    This will list all the files in the /usr/bin directory whose names contain the
    substring zip. The grep program accepts options and arguments this way, where
    regex is a regular expression:


    ```

    grep [options] regex [file...]

    ```


    Table 19-1 describes the commonly grep options.


    # Table 19-1: grep options


    | Option | Description |

    | -i | --ignore-case | Ignore case. Do not distinguish between uppercase and lowercase
    characters. |

    | -v | --invert-match | Invert match. Normally, grep prints lines that contain
    a match. This option causes grep to print every line that does not contain a match.
    |

    | -c | --count | Print the number of matches (or non-matches if the -v option
    is also specified) instead of the lines themselves. |

    | -l | --files-with-matches | Print the name of each file that contains a match
    instead of lines themselves. |

    | -L | --files-without-match | Like the -l option, but print only the names of
    files that do not contain matches. |

    | -n | --line-number | Prefix each matching line with the number of the line within
    the file. |

    | -h | --no-filename | For multi-file searches, suppress the output of filenames.
    |

    | -q | --quiet, --silent | Suppress all output. This is useful in shell scripting
    when want to test if a match was found. We''ll cover testing a command''s exit
    status in Chapter 27.


    To more fully explore grep, let''s create some text files to search.


    ```

    @me@linuxbox~$ ls /bin > dirlist-bin.txt

    @me@linuxbox~$ ls /usr/bin > dirlist-bin.txt

