  md: '# Mounting and Unmounting Storage Devices


    Recent advances in the Linux desktop have made storage device management extremely
    easy for desktop users. For the most part, we attach a device to our system and
    “just works.” In the old days (say, 2004), this had to be done manually. On non-desktop
    systems (that is, servers), this is still a largely manual procedure since servers
    often have extreme needs and complex configuration requirements.


    The first step in managing a storage device is attaching the device to the filesystem.
    This process, called mounting, allows the device to interact with the operating
    system. As we recall from Chapter 2, Unix-like operating systems, such as Linux,
    maintain a single filesystem with devices attached at various points. This contrasts
    with other operating systems as MS-DOS and Windows that maintain separate filesystems
    for each device (for example C:, and so on).


    A file named /etc/fstab (short for “filesystem table”) lists the devices (typically
    hard disk partitions) are to be mounted at boot time. Here is an example /etc/fstab
    file from an early Fedora system:


    ```

    LABEL=/           /               ext4 defaults       1 1

    LABEL=/home      /home           ext4 defaults       1 2

    LABEL=/boot      /boot           ext4 defaults       1 2

    tmpfs            /dev/shm       tmpfs   defaults       0 0

    devpts           /dev/pts       devpts  gid=5,mode=620 0 0

    sysfs            /sys            sysfs   defaults       0 0

    proc             /proc           proc        defaults       0 0

    LABEL=SWAP-sda3 swap           swap        defaults       0 0

    ```


    Most of the filesystems listed in this example are virtual and not applicable
    to our discussion. For our purposes, the interesting ones are the first three:


    ```

    LABEL=/12        /               ext4 defaults       1 1

    LABEL=/home     /home           ext4 defaults       1 2

    LABEL=/boot     /boot           ext4 defaults       1 2

    ```


    These are the hard disk partitions. Each line of the file consists of six fields,
    as described in Table 15-1.


    Table 15-1: /etc/fstab Fields


    | Field | Contents | Description |

    | --- | --- | --- |

    | 1 | Device | Traditionally, this field contains the actual name of a device
    file such as /dev/sda1 (the first partition of the first detected disk). With
    today''s computers, which have many devices that are not pluggable (like USB drives),
    many modern Linux distributions associate a device with a text label. This label
    (which is added to |'
  merge: -1
  pgno: 193
- img_proc: true
  md: 'the storage media when it is formatted can be either a simple text label or
    a randomly generated UUID (Universally Unique Identifier). This label is read
    by the operating system when the device is attached to the system. That way, no
    matter what device file is assigned to the actual physical device, it can still
    be correctly identified.


    Mount point


    The directory where the device is attached to the filesystem tree.


    Filesystem type


    Linux allows many types of filesystems to be mounted. Most Linux systems use a
    native Linux filesystem called Fourth Extended Filesystem (ext4, mdos), but many
    others are supported including FAT16, FAT32 (vfat), NTFS (ntfs), CD-ROM (iso9660),
    and so on.


    Options


    Filesystems can be mounted with various options. It is possible, for example,
    to mount filesystems as read-only or to prevent any programs being executed from
    them (a useful security feature for removable media).


    Frequency


    A single number that specifies in what order when a filesystem is to be backed
    up with the dump command.


    Order


    A single number that specifies in what order filesystems should be checked with
    the fsck command. More about that later in this chapter.


