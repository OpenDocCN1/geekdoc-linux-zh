  md: 'It is sometimes useful to manage all the positional parameters as a group.
    For example, we might want to write a “wrapper” around another program. This means
    we create a script or shell function that simplifies the invocation of another
    program. The wrapper, in this case, supplies a list of arcane command line options
    and then passes a list of arguments to the lower-level program.


    The shell provides two special parameters for this purpose. Both expand into the
    complete list of positional parameters but differ in rather subtle ways. They
    are described in Table 32-1.


    # Table 32-1: The * and @ Special Parameters


    | Parameter | Description |

    | $* | Expands into the list of positional parameters, starting with 1. When surrounded
    by double quotes, it expands into a double-quoted string containing all of the
    positional parameters, each separated by the first character of the IFS shell
    variable (by a default space character). |

    | $@ | Expands into list of positional parameters, starting with 1. When surrounded
    by double quotes, it expands each parameter into a separate word as if it was
    surrounded by double quotes. |


