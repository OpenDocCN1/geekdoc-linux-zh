- img_proc: true
  md: '# Executable Permissions


    The next thing we have to do is make our script executable. This is easily done
    using chmod


    ```

    @me@linuxbox ~$ ls -l hello_world

    -rw-r--r-- 1 me 63 2025-03-07 10:10 hello_world

    @me@linuxbox ~$ chmod 755 hello_world

    @me@linuxbox ~$ ls -l hello_world

    -rwxr-xr-x 1 me 63 2025-03-07 10:10 hello_world

    ```


    There are two common permission settings for scripts: 755 for scripts that everyone
    can execute and 700 for scripts that only the owner can execute. Note that scripts
    must be readable to execute.


    # Script File Location


    With the permissions, we can execute our script.


    ```

    @me@linuxbox ~$ ./hello_world

    Hello World!

    ```


    For the script to run, we must prefix the script with an explicit path. If we
    don''t, we get:


    ```

    @me@linuxbox ~$ hello_world

    bash: hello_world: command not found

    ```


    Why is this? What makes our script different from other programs? As it turns
    out, nothing. Our script''s location is the problem. In Chapter 11, we discussed
    the PATH environment variable and its effect on the system searches for executable
    programs. To recap, the system searches a list of directories each time it needs
    to find an executable program, if no explicit path is specified. This is how the
    system knows to execute /bin/ls when we type ls at the line. The /bin directory
    is one of the directories that the system automatically searches. The list of
    directories is held within an environment variable PATH. The PATH variable contains
    a colon-separated list of directories to be searched. We can view the contents
    of PATH.


    ```

    @me@linuxbox ~$ echo PATH

    /home/me:/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/games

    ```


    Here we see out our list. If our script were located in any of the directories
    in the list, our problem would be solved. Notice the first directory in the list,
    /home/me/bin. Most Linux distributions configure the PATH variable to contain
    a bin directory in the user''s home directory to allow users to execute their
    own programs. If we create the bin directory and place our script within it, it
    should start to work like other programs.


    ```

    @me@linuxbox ~$ mkdir bin

    @me@linuxbox ~$ mv hello_world bin

    ```'
