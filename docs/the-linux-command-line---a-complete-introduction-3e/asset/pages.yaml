    ```

    [me@linuxbox]$ unzip ../playground.zip playground/dir-087/file-Z

    Archive: ..//playground.zip

    replace playground/dir-087/file-Z? [y]es, [n],[A]ll, [N]one, [r]name: y

    extracting: playground/dir-087/file-Z

    ```


    Using the -l option causes unzip to list the contents of the archive without extracting
    it. If no files are specified, unzip will list all files in the archive. The -v
    option can be added to increase the verbosity of the output. Note that when the
    archive extraction conflicts with an existing file, the user is prompted before
    the file is replaced.


    By default, unzip extracts files into the current directory. To specify an alternate
    directory for extraction, use the -d option followed by the name of the desired
    directory.


    Like tar, unzip can use standard input and output, though its implementation is
    somewhat less loose. It is possible to pipe a list of files to unzip via the -@
    option.


    ```

    [me@linuxbox]$ cd foo

    [me@linuxbox]$ find playground -name "file-A" | zip -o file-A.zip

    ```


    Here we use find to generate a list of files matching the test -name "file-A"
    and then pipe the list into zip, which creates the archive file-A.zip containing
    the selected files.


    zip also supports writing output to stdout, but its use is limited because few
    programs can make use of the output. Unfortunately, the unzip program does not
    accept standard input. This prevents unzip from being used to perform network
    file copying like tar.


    zip can, however, accept standard input, so it can be used to compress the output
    of other programs.


    ```

