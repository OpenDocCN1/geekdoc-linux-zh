- img_proc: true
  md: 'Notice how the first letter of the listing is \l and the second seems to have
    two filenames? This is a special kind of a file called a symbolic link (also known
    as a soft link or symlink). In most Unix-like systems, it is possible to have
    a file referenced by multiple names. While the value of this might not be obvious,
    it is really a useful feature.


    Picture this scenario: a program requires the use of a shared resource of some
    kind contained in a file *foo*, but *foo* has frequent version changes. It would
    be good to include the version number in the filename so the administrator or
    other interested party could see which version of *foo* is installed. This presents
    a problem. If we change the shared resource, we have to track down every program
    that might use it and change it to look for a new resource every time the version
    of the resource is installed. That doesn''t sound like fun at all.


    Here is where symbolic links save the day. Suppose we install version 2.6 of *foo*,
    which has the filename *foo-2.6*, and create a symbolic link called *foo* that
    points to *foo-2.6*. This means when a program opens the file *foo*, it is actually
    opening the *foo-2.6*. Now everybody is happy. The programs that rely on *foo*
    can find it, and we can still see what version is installed. When it is time to
    upgrade to *foo-2.7*, we just add the file to our system, delete the symbolic
    link *foo*, and create a new symbolic link that points to the new version. Not
    only does this solve the problem of version upgrade, but it also allows us to
    keep both versions on our machine. Imagine that *foo-2.7* has a bug (damn those
    developers!) and we need to revert to the old version. Again, just delete the
    symbolic link pointing to the new version and create a new symbolic link pointing
    to the old version.


    The directory at the beginning of this section (for /usr/lib directory of a Fedora
    system) shows a symbolic link called \libc.so.6 that points to a shared library
    file called *libc-2.6.so*. This means that programs looking for \libc.so.6 will
    actually get the file *libc-2.6.so*. We will learn how to create symbolic links
    in the next chapter.


    # Hard Links


    While we are on the subject of links, we need to mention that there is a second
    type of link called a hard link. Hard links also allow files to have multiple
    names, but they do it in a different way. We''ll talk more about the differences
    between symbolic and hard links in the next chapter.


