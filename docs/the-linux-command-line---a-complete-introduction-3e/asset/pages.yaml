    # Moving Data Directly to and from Devices


    While we usually think of data on our computers as being organized into files,
    it is also possible to think of the data in "raw" form. If we look at a disk drive,
    for example, we see that it consists of a large number of "blocks" of data that
    the operating system sees as directories and files. If we could treat a disk drive
    as simply a collection of data blocks, we could perform useful tasks, such as
    cloning devices.


    The dd performs this task. It copies blocks of data from one place to another.
    It uses a unique syntax (for historical reasons) and is well used this way:


    ```

    dd if=input_file=output_file bs=block_size [count=blocks]

    ```


    # WARNING


    The dd command is powerful. Though its name derives from "data definition," it
    is sometimes called "destroy disk" because users often mistake either the it or
    of specification. Always double-check your input and output specifications before
    pressing ENTER!


    Let''s say we had two USB flash drives of the same size and wanted to exactly
    copy the first to the second. If we attached both drives to the computer and they
    are assigned to devices /dev/sdb and /dev/sdc, respectively, we could copy everything
    on the first drive to the second with the following:


    ```

    [me@linuxbox ~] sudo dd if=/dev/sdb of=/dev/sdc

    ```


    Alternatively, if only the first device were attached to the computer, we could
    copy its contents to an original file for later restoration or copying.


    ```

    [me@linuxbox ~] sudo dd if=/dev/sdb of=flash_drive.img

    ```


    # Creating CD-ROM Images


    Writing a recordable CD-ROM (either a CD-R or CD-RW) consists of two steps:


    +   1. Constructing an ISO image file is the exact filesystem image of the CD-ROM

    2. Writing the image file onto the CD-ROM media


    # Creating an Image Copy of a CD-ROM


    If we want to make an ISO image of an existing CD-ROM, we can use dd to read all
    the data'
  merge: -1
  pgno: 206
- img_proc: true
  md: 'blocks off the CD-ROM and copy them to a local file. Say we had an Ubuntu CD
    and we wanted to make an ISO file that we could later to make more copies. After
    inserting the CD and determining its device name (we''ll assume /dev/cdrom), we
    can make the ISO file like so:


    ```

    dd if=/dev/cdrom of=ubuntu.iso

    ```


    This technique works for data DVDs as well but will not work for audio CDs, as
    they do not use a filesystem for storage. For audio CDs, look at the `cddao` command.


    # Creating an Image from a Collection of Files


    To create an ISO file containing the contents of a directory, we use the `genisimage`
    program. To do this, we create a directory containing all the files we want to
    include in the image and execute the `genisimage` command to create the image
    file. For example, if we had a directory named `~/cd-rom-files` and filled it
    with files for our CD-ROM, we could create an image file named `cd-rom.iso` with
    the following command:


    ```

    genisimage -o cd-rom.iso -R -J ~/cd-rom-files

    ```


    The -R option adds metadata for the Rock Ridge extensions, which allows the use
    of long filenames and POSIX-style file permissions. Likewise, the -J option enables
    the Joliet extensions, which permit long filenames for Windows.


    # A PROGRAM BY ANY OTHER NAME . . .


    > If you look at online tutorials for creating and burning optical media like
    CD-ROMs and DVDs, you will frequently encounter two programs called `mkisofs`
    and `cdrecord`. These programs were part of a popular package called `cdtools`
    authored by Jorg Schilling. In the summer of 2006, Mr. Schilling made a license
    change to a portion of the `cdtools` package, which, in the opinion of many in
    the Linux community, created a license incompatibility with the GNU GPL. As a
    result, a fork of the `cdtools` project was started that includes replacement
    programs for `cdrecord` and `nkisofs` named `wodlin` and `genisimage`, respectively.


    # Writing CD-ROM Images


    After we have an ISO file, we can burn it onto our optical media. Most of the
    commands we will discuss in the following sections can be applied to both recordable
    CD-ROM and DVD media.


    # Mounting an ISO Image Directly


    There is a trick that we can use to mount an ISO image while it is still on our
    hard disk and'
