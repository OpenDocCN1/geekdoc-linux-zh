  md: 'and from DOS format. However, if you don''t have dos2unix on your system, don''t
    worry. The process of converting text from DOS to Unix format is simple; it involves
    the removal of the offending carriage returns. That is easily accomplished by
    a couple of the programs discussed in this chapter.


    cat also has options that are used to modify text. The two most prominent are
