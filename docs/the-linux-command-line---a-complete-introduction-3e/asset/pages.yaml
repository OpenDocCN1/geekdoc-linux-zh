  md: '# Assignment


    Although its uses may not be immediately apparent, arithmetic expressions may
    perform assignment. We have performed assignment many times, though in a different
    context. Each time we give a variable value, we are performing assignment. We
    can also do it with arithmetic expressions.


    ```

    [linux] -js foo=

    [linux] -js foo


    [linux] -js if (( foo == 5 )); then echo "It is true."; fi

    It is true.

    [linux] -js foo

    5

    ```


    In the preceding example, we first assign an empty value to the variable foo and
    verify that it is indeed true. Next, we perform an with the compound command ((
    foo = 5 )). This process does interesting things: it assigns the value of 5 to
    the variable foo, and it evaluates to true because foo was assigned a non-zero
    value.


    # NOTE


    It is important to remember the exact meaning of = in the previous expression.
    A single = performs assignment. foo = says "Make foo equal to 5," while = evaluates
    equivalence. foo == says "Does foo equal ?" This is a common feature in many programming
    languages. In the shell, this can be a little confusing because the test command
    accepts a single = string equivalence. This is yet another reason to use the more
    modern [[ ]] and (( )) compound commands in place of test.


    In addition to the notation, she also provides notations that perform some useful
    assignments, as shown in Table 34-4.


    # Table 34-4: Assignment Operators


    | Notation | Description |

    | --- | --- |

    | parameter = value | Simple assignment. Assigns value to parameter. |

    | parameter += value | Addition. Equivalent to parameter = parameter + value.
    |

    | parameter -= value | Subtraction. Equivalent to parameter = parameter - value.
    |

    | parameter *= value | Multiplication. Equivalent to parameter = parameter * value.
    |

    | parameter /= value | Integer division. Equivalent to parameter = parameter /
    value. |

    | parameter %= value | Modulo. Equivalent to parameter = parameter % value. |

    | parameter++ | Variable post-increment. Equivalent to parameter = parameter +
    1 (however, see the following discussion). |'
