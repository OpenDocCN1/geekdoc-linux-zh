    # set -e, set -u, and set -o pipefail


    One thing we note about bash is that when a script executes and a command fails
    (not including a syntax error in the script itself), the script will happily continue
    to the next command. Often this is undesirable, and the POSIX standard, and subsequently,
    bash, attempts to address this issue. bash offers a setting that will handle errors
    automatically, which simply means that with this setting enabled, a script will
    terminate if any command (with some necessary exceptions) returns a non-zero exit
    status. To invoke this setting, we place the command -e near the beginning of
    the script. Several bash coding standards insist on using this feature along with
    a couple of related settings: set -u, which terminates a script if there is an
    uninitialized variable, and set -o pipefail causes script termination if the final
    element in a pipeline fails.


    Using these features is not recommended. It is better to design proper error handling
    and not rely on set -e as a substitute for good coding practices.


    The Bash FAQ #105 (https://mwwiki.wodledge.org/BashFAQ/105) provides the following
    opinion on this:


    > set -e was an attempt to abort "automatic error detection" to the shell. Your
    goal was to cause the shell to abort when an error occurred, you don''t have to
    put exit each important command.

    That goal is non-trivial, because many commands intentionally return non-zero.
    For example,

    if [ -d foo ]; then ... else; fi

    Clearly we dont when the [ -d foo ] command returns non-zero (because the directory
    does not exist)-our script wants to handle in the else part. The implementers
    decided to make a bunch of special rules, "commands that are part of if test are
    immune," or "commands in a pipeline, other than the last one, are immune."

    These rules are extremely convoluted, and they still fail to catch some remarkably
    simple cases. Even when worse, the rules changes from one Bash Version to another,
    as bash attempts to track the extremely slippery POSIX definition of this "feature":
    When a subshell is invoked, it gets worse still—thebehavior changes depending
    on whether bash is invoked in POSIX mode.


