  md: '# Why Use the Command Line?


    Have you ever noticed in the movies when the “superhacker”—you know, the guy who
    can break into the ultra-secure military computer in less than 30 seconds—sits
    down at the computer, never touches a mouse? It''s because filmmakers realize
    that we, as human beings, instinctively know the only way to really get anything
    on a computer by typing on a keyboard!


    Most computer users today are familiar only with the graphical user interface
    (GUI) and have been taught by vendors and pundits that the command line interface
    (CLI) is a terrifying thing of the past. This is unfortunate, because a good CLI
    is a wonderfully expressive way of communicating with a computer in much the same
    way the written word is for human beings. It''s been said that “graphical user
    interfaces make easy tasks easy, while command interfaces make difficult tasks
    possible,” and this is still very true today.


    Since Linux is modeled after the Unix family of operating systems, it shares the
    same rich heritage of command line tools as Unix. Unix came into prominence during
    the early 1980s (although it was first developed a decade earlier), before the
    widespread adoption of the graphical user interface and, as a result, developed
    an extensive command line interface instead. In fact, one of the strongest reasons
    early adopters of Linux chose it over, say, Windows NT was the powerful command
    line interface that made the “difficult tasks possible.”'
  merge: -1
  pgno: 29
- img_proc: true
  md: '# What This Book Is About


    This book is a broad overview of “living” on the Linux command line. Unlike some
    books that concentrate on a single program, such as the shell program, bash, this
    book will convey how to get along with the command line interface in a larger
    sense. How does it all work? What can it do? What’s the best way to use it?


    This is not a book about Linux system administration. While any serious discussion
    of the command line will invariably lead to system administration topics, this
    book touches on only a few administration issues. It will, however, prepare the
    reader for additional study by providing a solid foundation in the use of the
    command line, an essential tool for any serious system administration task.


    This book is very Linux-centric. Many others try to broaden their appeal by including
    other platforms as generic Unix and macOS. They water down their content to feature
    only general topics. This book, on the other hand, covers only contemporary Linux
    distributions. Ninety-five percent of the content is useful for users of Unix-like
    systems, but this book is highly targeted at the modern Linux command line user.


    # Who Should Read This Book


    This book is for new Linux users who have migrated from other platforms. Most
    likely you are a “power user” of some version of Microsoft Windows. Perhaps your
    boss has you to administer a Linux server or you’re entering the exciting world
    of single-board computers (SBCs) such as the Raspberry Pi. You may just be a desktop
    user who is tired of all the security problems and wants to give Linux a try.
    That’s fine. All are welcome here.


    That being said, there is no shortcut to Linux enlightenment. Learning the command
    line is challenging and takes real effort. It’s not so hard, but rather it’s vast.
    The average Linux system has thousands of programs you can employ on the command
    line. Consider yourself warned; learning the command line is not a casual endeavor.


    Still, the Linux command line is extremely rewarding. If you think you’re a power
    user, just wait. You don’t know what real power is—yet. And, unlike other computer
    skills, knowledge of the command line is long-lasting. The skills learned today
    will still be useful 10 years from now. The command line has survived the test
    of time.


    It is also assumed that you have no programming experience, but don’t worry, we’ll
    start you down that path as well.


    # What’s in This Book


    This material is presented in a carefully chosen sequence, much like a tutor sitting
    next to you guiding through many. Many authors treat this material in a “systematic”
    fashion, exhaustively covering each topic in order. This makes sense from a writer’s
    perspective but'
  merge: -1
  pgno: 30
- img_proc: true
  md: 'can be very confusing to new users.


    Another goal is to acquaint you with the way, which is different from the Windows
    way of thinking. Along the way, we''ll go on a few side trips to help you understand
    why things work the way they do and how they get that way. Linux is not just a
    piece of software; it''s also a small part of the larger Unix culture, which has
    its own language and history. I might throw in a rant or two as well.


    This book is divided into four parts, each covering some aspect of the command
    line experience.


    +   **Part I: Learning the Shell** Starts our exploration of the basic language
    of the command line including such things as the structure of commands, filesystem
    navigation, command editing, and help and documentation for commands.


    +   **Part II: Configuration and the Environment** Covers editing configuration
    files that control the computer''s operation from the command line.


    +   **Part III: Common Tasks and Essential Tools** explores many of the ordinary
    tasks that are commonly performed from the command line. Unix-like operating systems,
    such as Linux, contain many "classic" command line programs that are used to perform
    powerful operations daily.


    +   **Part IV: Writing Shell Scripts** Introduces shell programming, an admittedly
    rudimentary but easy-to-learn technique for automating many computing tasks. By
    learning shell programming, you will become familiar with concepts that can be
    applied to many other programming languages.


    # # How to Read This Book


    Start at the beginning of the book and follow it to the end. It isn''t written
    as a reference work; it''s really more like a story with a beginning, middle,
    and end.


    # **Prerequisites**


    To use this book, all you will need a working Linux installation. You can get
    this in one of two ways.


    +   **Install Linux on a (not so new) computer** It doesn''t matter which distribution
    you choose, though most people today start with either Ubuntu, Fedora, or OpenSE.
    If doubt, try Ubuntu first. Installing a modern Linux distribution can be ridiculously
    easy or difficult depending on your hardware. I suggest a desktop computer that
    is a couple of years old and has at least 2GB of RAM and 6GB of hard disk space.
    Avoid laptops and wireless networks if all possible, as these are often more difficult
    to get working.


    +   Use a "live CD" or USB flash drive One of the cool things you can do with
    many distributions is run them directly from a CD-ROM or USB flash drive without
    installing them at all. Just go into your BIOS setup and set your computer to
    boot'
  merge: -1
  pgno: 31
- img_proc: true
  md: 'a CD-ROM drive or USB device, and reboot. Using this method is a great way
    to test a computer for Linux compatibility prior to installation. The disadvantage
    is that it may be very slow compared to having Linux installed on your hard drive.
    Both Ubuntu and Fedora (among others) have live versions.


    Regardless of how you install Linux, you will need have occasional superuser (that
    is, administrative) privileges to court the lessons in this book.


    After you have a working installation, start reading and following along with
    your own computer. Most of the material in this book is “hands on,” so sit down
    and get typing!


    # WHY I DON''T CALL IT “GNU/LINUX"


    In some quarters, it''s politically correct to call the Linux operating system
    the “GNU/Linux operating system.” The problem with “Linux” is that there is no
    completely correct way to name it because it was written by many different people
    in a vast, distinct development effort. Technically speaking, Linux is the name
    of the operating system''s kernel, nothing more. The kernel is important of course,
    since it makes the operating system go, but it''s not enough to form a complete
    operating system.


    Enter Stallman, the genius-philosopher who founded the Free Software movement,
    started the Free Software Foundation, formed the GNU Project, wrote the first
    version of the GNU C Compiler (gcc), created the GNU Public License (the GPL),
    and so on and so on. He insists that you call it “GNU/Linux” to properly reflect
    the contributions of the GNU Project. While the GNU Project predicates the Linux
    kernel and the project''s contributions are extremely deserving of recognition,
    placing them in the name is unfair to everyone else who made significant contributions.
    Besides, I think “Linux/GNU” would be more technically accurate since the kernel
    boots first and everything ever runs on top of it.


    In popular usage, “Linux” refers to the kernel and all the free and open source
    software found in the typical Linux distribution, that is, the entire Linux ecosystem,
    not just the GNU components. The operating system marketplace seems to prefer
    one-word names as DOS, Windows, macOS, Solaris, Irix, and AI. I have chosen to
    use the popular format. If, however, you prefer to use “GNU/Linux” instead, please
    perform a mental search-and-replace while reading this book. I won’t mind.


    # What''s New in the Third Edition


    While the shell itself has major version releases only every 10 years or so, hardware
    and tools constantly evolve. The evolution of The Linux Command Line has been
    modernized to reflect the changes in the command line environment. There are numerous
    small edits and'
  merge: -1
  pgno: 32
- img_proc: true
  md: 'corrections and new command coverage. All in all, there are nearly 40 pages
    of new material. For a detailed list of changes, see the release notes available
    at LinuxCommand.org. Also new with this edition is a collection of example scripts.
    These, too, can be downloaded at LinuxCommand.org.


    # Your Feedback Is Needed!


    This book is an ongoing project, like many open source software projects. If you
    find a technical error, drop me a line at lsbotts@users.sourceforge.net.


    Be sure to indicate the exact edition of the book you are reading. Your changes
    and suggestions may get into future releases.'
