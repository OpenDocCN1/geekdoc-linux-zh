    - Uniform resource identifier (URI)


    > NOTE


    Some of the commands we will cover may (depending on your distribution) require
    the installation of additional packages from your distribution''s repositories,
    and some may require superuser privileges to execute.


    # # Examining and Monitoring a Network


    Even if you''re not the system administrator, it''s often helpful to examine the
    performance and operation of a network.


    # ping


    The most basic network command is ping. The ping sends a special network packet
    called an ICMP ECHO REQUEST to a specified host. Most network devices receiving
    this packet will reply to it, allowing the network connection to be verified.


    > NOTE


    It is possible to configure most network devices (including Linux hosts) to ignore
    these packets. This is usually used for security reasons to partially obscure
    a host from a potential attacker. It is also common for firewalls to be configured
    to block ICMP traffic.


    For example, to see we can reach https://linuxcommand.org (one of our favorite
    sites), we can use ping like:


    ```

    @linuxbox ~$ ping linuxcommand.org

    ```


    Once started, ping continues to send packets at a specified interval (default
    is one second) when it is interrupted.


    ```

    @linuxbox ~$ ping linuxcommand.org

