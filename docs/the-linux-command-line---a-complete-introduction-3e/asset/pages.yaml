  md: 'diagnostics for errors, while many commands simply exit with a value of 1 when
    they fail. Man pages often include a section titled "Exit Status," describing
    what codes are used. However, a zero always indicates success.


    The shell provides two extremely simple builtin commands that do nothing except
    terminate with either a 0 or 1 exit status. The true command always executes successfully,
    and the false command always executes unsuccessfully.


    ```

    @me@linux ~$ echo true

    @me@linux ~$ echo $?

    0

    @me@linux ~$ echo false

    @me@linux ~$ echo $?

    1

    ```


    We can use these commands to see how the if statement works. What if the statement
    really does is evaluate the success or failure of commands.


    ```

    @me@linux ~$ if true; then echo "It''s true." fi

    It''s true.

    @me@linux ~$ if false; then echo "It''s true." fi

    @me@linux ~$

    ```


    The command "It''s true." is executed when the command following if executes successfully
    and is not executed when the command following if does not execute successfully.
    If a list of commands follows if, the last command in the list is evaluated.


    ```

    @me@linux ~$ if false; then echo "It''s true." fi

    It''s true.

    @me@linux ~$ if true; false; then echo "It''s true." fi

    @me@linux ~$

    ```


    # Using test


    By far, the command used most frequently with if is test. The test command performs
    a variety of checks and comparisons. It has two equivalent forms. Here is the
    first form:


    ```

    test expression

    ```


    The second, more popular form is this one:


    ```

    [ expression ]

    ```


    In these syntax descriptions, expression is an expression that is evaluated as
    either true or false. The test command returns an exit status of 0 when the expression
    is true and a status of 1 when the expression is false.


    It is interesting to note that both test and [ are actually commands. In bash
    they are builtins, but they also exist as programs in /usr/bin for use with other
    shells. The expression is actually just its arguments with the [ command requiring
    that the ] character be provided'
