    \ 0700 '{}' ';' \\\n```\n\nObviously, this is a little hard to figure out at first\
    \ glance. In a script, this command might be easier to understand if written this\
    \ way:\n\n```\nfind playground \\\n  -type f \\\n  -not -perm 0600 \\\n  -exec\
    \ chmod 0600 '{}' ';' \\\n-o \\\n  -type d \\\n  -not -perm 0700 \\\n  -exec chmod\
    \ 0700 '{}' ';'\n```\n\nBy using line continuations (backslash-linefeed sequences)\
    \ and indentation, the logic of this complex command is more clearly described\
    \ to the reader. This technique works on the command line too, though it is seldom\
