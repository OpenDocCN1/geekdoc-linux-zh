    # chmod—Change File Mode


    To change the mode (permissions) of a file or directory, the chmod command is
    used. Be aware that only the file''s owner or the superuser can change the mode
    of a file or directory. chmod supports two distinct ways of specifying mode changes:
    octal number representation and symbolic representation. We will cover octal number
    representation first.


    # WHAT THE HECK IS OCTAL?


    Octal (base 8) and its cousin, hexadecimal (base 16), are number systems often
    used to express numbers on computers. We humans, owing to the fact that we (or
    at most of us) were born with 10 fingers, counting using a base 10 number system.
    Computers, on the other hand, were born with only one finger and do all counting
    in binary (base 2). Their number system has only two numerals, 0 and 1. So, in
    binary, counting looks like this:


    ```

    0, 1, 10, 11, 100, 101, 111, 1000, 1001, 1010, ...

    ```


    In octal, counting is done with the numerals zero through seven, like so:


    ```

    0, 1, 2, 3, 4, 5, 6, 7, 10, 11, 12, 13, 14, 15, 16, 17, 20, 21 . .

    ```'
