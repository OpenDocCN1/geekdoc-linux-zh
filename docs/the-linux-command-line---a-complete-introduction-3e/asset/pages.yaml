  md: '# About the Technical Reviewer


    Mitch Frazier is a programmer who works for Emerson Electric doing mostly embedded
    systems programming in C. He also occasionally writes code in Golang, Python,
    Tcl, JavaScript, and bash. He previously worked for Linux Journal, as both a technical
    editor and a system administrator.'
