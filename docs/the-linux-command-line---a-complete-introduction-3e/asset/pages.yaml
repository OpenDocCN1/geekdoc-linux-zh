- img_proc: true
  md: 'As we can see, the uid and gid numbers are different. This is simply because
    Fedora starts its numbering of regular user accounts at 500, while groups. Ubuntu
    starts at 1,000. We can also see that the Ubuntu user belongs to a lot more groups.
    This has to be with the way Ubuntu manages privileges for system devices and services.


    So, where does this information come from? Like many things it comes from a couple
    of text files. User accounts are defined in the /etc/passwd file, and groups are
    defined in /etc/group. When accounts and groups are created, these files are modified
    along with /etc/shadow, which holds information about the user''s password. For
    each account, the /etc/passwd file defines the (login) name, uid, gid, user''s
    real name, home, directory and login shell. If we examine the contents of /etc/passwd
    and /etc/group, we notice that the regular user accounts, there are accounts for
    the superuser (uid 0) and other system users.


    In the next chapter, when we cover processes, we will see that some of these other
    “users” are, in fact, quite busy.


    While Unix-like systems assign regular users to a common group such as users,
    modern Linux practice is to create a unique, single-member group with the same
    name as the user. This makes certain types of permission assignment easier.


