    # # join


    In ways, join is like paste in that adds columns to a file, but it uses a unique
    way to do it. A join is an operation usually associated with relational databases
    where data from multiple tables with a shared key is combined to form a desired
    result. The join program performs the operation. It joins data from multiple files
    based on a shared key.


    To see how a join operation is used in a relational database, let''s imagine a
    small database of two tables, each containing a single record. The first table,
    called CUSTOMERS, has three fields: a customer number (CUSTOM), the customer’s
    first name (FNAME), and the customer’s last name (LNAME).


    | CUSTOM FNAME LNAME |

    | 4681934 John Smith |


    The second table is called ORDERS and contains four fields: an order number (ORDERNUM),
    the customer number (CUSTOMNUM), the quantity (QUAN), and the ordered item (ITEM).


    | ORDERNUM CUSTOM QUAN ITEM |

    | 3014953085 4681934 1 Blue Widget |


    Note that both tables share the field CUSTOMNUM. This is important, because it
    allows a relationship between the tables.


    Performing a join operation would allow us to combine the fields in the two tables
    to achieve a useful result, such as preparing an invoice. By matching the values
    in the CUSTOMNUM of both tables, a join operation could produce the following:


    | FNAME LNAME QUAN ITEM |

    | John Smith = Blue Widget |


    To demonstrate the join program, we''ll need to make a couple of files with a
    shared key.'
