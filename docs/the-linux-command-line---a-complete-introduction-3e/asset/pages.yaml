    # DESIGN IS A FUNCTION OF TIME


    When I was a college student studying industrial design, a wise professor stated
    that the amount of time on a project was determined by the amount of time given
    to the designer. If you were given five minutes to design a device "kills flies,"
    you designed a flyswatter. If you were given five months, you might come up with
    a laser-guided "anti-fly system" instead.


    The same principle applies to programming. Sometimes a "quick-and-dirty" script
    will do if it''s going to be used once and only. That kind of script is common
    and should be developed quickly to make the effort economical. Such scripts don''t
    need a lot of comments and defensive checks. On the other hand, if a script is
    intended for production use, a script that will be used over and over for an important
    task or by multiple users, it needs more careful development.


