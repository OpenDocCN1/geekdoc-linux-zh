    # Expansions to Manage Empty Variables


    Several parameter expansions are intended to deal with nonexistent and empty variables.
    These expansions are handy for handling missing positional parameters and assigning
    default values to parameters. The first supplies a default value for an unset
    parameter.


    $$(parameter:=word)


    If parameter is unset (that is, does not exist) or is empty, this expansion results
    in the value of word. If parameter is not unset, the expansion results in the
    value of parameter:


