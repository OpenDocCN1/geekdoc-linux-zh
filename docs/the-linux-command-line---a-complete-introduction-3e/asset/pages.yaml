    \n# Defensive Programming\n\nIt is important to verify assumptions when programming.\
    \ This means a careful evaluation of the exit status of programs and commands\
    \ that are used by a script. Here is an example, based on a true story. An unfortunate\
    \ system administrator wrote a script to perform a maintenance task on an important\
    \ server. The script contained the following two lines of code:\n\n```\ncd $dir_name\n\
    rm *\n```\n\nThere is nothing intrinsically wrong with these two lines, as long\
    \ as the directory named in the variable, $dir_name, exists. But what if it does\
    \ not? In that case, the cd command fails, and the script continues to the next\
    \ line and deletes the files in the working directory. The desired outcome at\
    \ all! The hapless administrator destroyed an important part of the server because\
    \ of this design decision.\n\nLet's look at how this design could be improved.\
    \ First, it might be wise to ensure that the $dir_name variable expands into only\
    \ one word by quoting it and make the execution of rm contingent on the success\
    \ of cd.\n\n```\ncd \"$dir_name\" && rm *\n```\n\nThis way, if the cd command\
    \ fails, the rm command is not carried out. This is better but leaves open the\
    \ possibility that the variable, $dir_name, is unset or empty, which would result\
    \ in the files in the user's home directory being deleted. This could also be\
    \ avoided by checking to see that $dir_name actually contains the name of an existing\
    \ directory.\n\n```\n[[ -d \"$dir_name\" ]] && cd \"$dir_name\" *\n```\n\nOften,\
    \ it is best to include logic to terminate the script and report an error when\
    \ a situation such as the one previously occurs.\n\n```\n# Delete files in directory\
    \ $dir_name\nif [[ ! -d \"dir_name\" ]]; then\n    echo \"No such directory: $dir_name\"\
    \ >&2\n    exit 1\nfi\n\nif ! cd \"$dir_name\"; then\n    echo \"Cannot cd to\
    \ $dir_name\" >&2\n    exit 1\nfi\n\nif ! rm *; then\n    echo \"File deletion\
    \ failed. Check results\" >&2\n    exit 1\nfi\n```"
