  md: 'Whenever you modify configuration files it''s a good idea to add comments to
    document your changes. Sure, you''ll probably remember what you changed tomorrow,
    but about six months from now? Do yourself a favor and add some comments. While
    you''re at it, it''s not a bad idea to keep a log of what changes you make.


    Shell scripts and bash startup use a # symbol to begin a comment. Other configuration
    files may use other symbols. Most configuration files will have comments. Use
    them as a guide.


    You will often see lines in configuration files that are commented out to prevent
    them from being used by the affected program. This is to give the reader suggestions
    for possible configuration choices or examples of correct configuration syntax.
    For example, the .bashrc of Ubuntu 24.04 contains these lines:


    ```

    # more ls aliases

    #alias ll=''ls -AF''

    #alias la=''ls -A''

    #alias l=''ls -CF''

    ```


    The last three lines are valid alias definitions that have been commented out.
    If you remove the # symbols from these lines, a technique called uncommenting,
    will activate them. Conversely, if you add a # symbol to the beginning of a line,
    you can deactivate a configuration line while preserving the information it contains.


    # Activating Our Changes


    The changes we have made to our .bashrc will not take effect until we close our
    session and start a new one because the .bashrc file is only read at the beginning
    of a session. However, we can force bash to reread the modified .bashrc file with
    the following command:


    ```

    me@linuxbox~$ source ~/.bashrc

    ```


    After doing this, we should be able to see the effect of our changes. Try one
    of the new aliases:


    ```

    me@linuxbox~$ ll

    ```


    # A LITTLE MORE ABOUT SOURCE


    The source command (which can be abbreviated as . ) is a shell builtin that reads
    a file directly into the current shell as if its contents have been entered at
    the keyboard. Yes, all those strange-looking things we have seen in the shell
    startup files are simply things that shell understand and act upon. Many older
    text-based operating systems (DOS, CP/M, and so on) functioned mainly as simple
    program launchers. Unix-style shells can do that, of course, as we have seen,
    but they can also do so much'
