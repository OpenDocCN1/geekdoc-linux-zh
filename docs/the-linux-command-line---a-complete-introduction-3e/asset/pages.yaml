- img_proc: true
  md: '# 24

    WRITING YOUR FIRST SCRIPT


    ![](img/58edd539af3a70704734cedc1ac0c271_345_0.png)


    In the preceding chapters, we assembled an arsenal of command line tools. While
    these tools can solve many kinds of computing problems, we are still limited to
    manually using them one by one on the command line. Wouldn''t it be great if we
    could get the shell to do more of the work? We can. By joining our tools together
    into programs of our own design, the shell can carry out complex sequences of
    tasks all by itself. We can enable it to do this by writing shell scripts.


    # What Are Shell Scripts?


    In the simplest terms, a shell script is a file containing a series of commands.
    The shell reads this file and carries out the commands as though they have been
    entered directly on the command line.


    The shell is somewhat unique, in that it is both a powerful command line interface
    to the system and a scripting language interpreter. We will see, most of the things
    that can be done on the command line can be done in scripts, and most of the things
    that can be done in scripts can be done on the command line.


    We have covered many shell features, which we have focused on those features most
    often used directly on the command line. The shell also provides a set of features
    usually (but not always) used when writing programs.


    # How to Write a Shell Script


    To successfully create and run a shell script, we need to do three things:


    +   1. Write a script. Shell scripts are ordinary text files. So, we need a text
    editor to write them. The best text editors will provide syntax highlighting,
    allowing us to see a color-'
  merge: -1
  pgno: 345
- img_proc: true
  md: 'coded view of the elements of the script. Syntax highlighting will help us
    spot certain kinds of common errors. vim, gedit, kate, and many other editors
    are good candidates for writing scripts.


    +   2. **Make the script executable.** The system is rather fussy about letting
    any old text file be treated as a program, and for good reason! We need to set
    the script file''s permissions to allow execution.


    +   3. **Put the script somewhere the shell can find it.** The shell automatically
    searches certain directories for executable files when no explicit pathname is
    specified. For maximum convenience, we will place our scripts in these directories.


    # Script File Format


    In keeping with programming tradition, we''ll create a "Hello World!" program
    to demonstrate an extremely simple script. Let''s fire up our text editors and
    enter the following script:


    ```

    #!/bin/bash

    ```


    ```

    # This is our first script.

    ```


    ```

    echo ''Hello World!''

    ```


    The last line of our script is pretty familiar; it''s just an echo command with
    a string argument. The second line is also familiar. It looks like a comment that
    we have seen used in many of the configuration files we have examined and edited.
    One thing about comments in shell scripts is that they may also appear at the
    ends of lines, provided they are preceded by at least one whitespace character,
    like so:


    ```

    echo ''Hello World!'' # This is a comment too

    ```


    > Everything from the # symbol onward on the line is ignored.

    Like many things, this works on the command line.


    ```

    [linux@]$ echo ''Hello World!'' # This is a comment too

    Hello World!

    ```


    Though comments are of little use on the command line, they will work.

    The first line of our script is a little mysterious. It looks as if it should
    be a comment since it starts with #, but it looks too purposeful to be just. The
    # character sequence is, in fact, a special construct called a shebang. The shebang
    is used to tell the kernel name of the interpreter that should be used to execute
    the script that follows. Every script should include this as its first line.


    Let''s save our script file as hello_world.'
  merge: -1
