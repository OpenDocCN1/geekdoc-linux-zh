    > NOTE Depending on your distribution, vim may or not support text search highlighting.
    Ubuntu, in particular, supplies a stripped-down version of vim by default. On
    such systems, you may want to use your package manager to install a more complete
    version of vim.


    # Summing Up


    In this chapter, we saw a few of the many uses of regular expressions. We can
    find even more if we use regular expressions to search for additional applications
    that use them. We can do that by searching the man pages.


    ```

    [me@linux ~]$$ cd /usr/share/man/man1

    [me@linux ~]$$ zgrep -EL ''regex|regular expression'' *.gz

    ```


    The zgrep program provides a front end for grep, allowing it to read compressed
    files. In our example, we search the compressed section 1 man page files in their
    usual location. The result of this command is a list of files containing either
    the string `regex` or the string `regular expression`. As we can see, regular
    expressions show up in a lot of programs.


    There is one feature found in basic regular expressions that we did not cover.
    Called references, this feature will be discussed in the next chapter.'
