    Extended regular expressions support several ways to specify the number of times
    an element is matched, as described in the sections follow.


    # -Match an Element Zero or One Time


    This quantifier means, in effect, "Make the preceding element optional.\ Let''s
    say we wanted to check a phone number for validity and we considered a phone number
    to be valid if it matched either of these two forms, where n is a numeral.


    ```

    (0-9)-0-9-nnnn

    nnnnn 0-9-0-nnnn

    ```


    We could construct a regular expression like this:


    ```

    ^([0-9][0-9][0-9])? [0-9][0-9]\.[0-9][0-9][0-9]$

    ```


    In this expression, the parentheses characters with question mark indicate that
    they are to be matched zero or one time. Again, since the parentheses are normally
    metacharacters (in ERE), we precede them with backslashes to cause them to be
    treated as literals instead.'
