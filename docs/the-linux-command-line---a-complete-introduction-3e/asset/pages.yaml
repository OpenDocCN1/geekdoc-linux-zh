    # # A Little Background


    The first version of vi was written in 1976 by Bill Joy, a University of California–Berkeley
    student who later went on to co-found Sun Microsystems. vi derives its name from
    the word visual, because it was intended to allow editing on video terminal with
    a moving cursor. Previous to visual editors, there were line editors that operated
    on a single line of text at a time. To specify change, we tell the line editor
    to go to a particular line and describe what change to make, such as adding or
    deleting text. With the advent of video terminals (rather than printer-based terminals
    like teletes), visual editing became possible. vi incorporates a powerful line
    editor ex, and we can use line editing commands while using vi.


    Most Linux distributions do not include real vi; rather, they ship with an enhanced
    replacement called vim (which is short for “vi improved”) written by Bram Moolenaar.
    vim is a substantial improvement over traditional Unix vi and is often symbolically
    linked (or aliased) to the name vi on Linux systems. In the discussions that follow,
    we will assume that we have a program called vi that is really vim.


    # # Starting and Stopping vi


    To start vi, we simply enter the following:


    ```

    [me@linuxbox ~]$ vi

    ```


    A screen like this should appear:


    VIM - Vi Improved


    version 9.1.697

    by Bram Moolenaar et al.

    Vim is open source and freely distributable


    sponsor Vim development!

    type :help sponsor<Enter>      for information


    to exit

    type :q<Enter>

    type :help<Enter> or <F1> for on-line help

    type :help version8<Enter> for version info


    Running in VI compatible mode'
