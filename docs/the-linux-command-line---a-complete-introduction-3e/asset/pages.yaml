    # Graphical Printers


    The development of GUIs led to major changes in printer technology. As computers
    moved to more picture-based displays, printing moved from character-based to graphical
    techniques. This was facilitated by the advent of the low-cost laser printer,
    which, instead of printing fixed characters, could print dots anywhere in the
    printable area of the page. This made printing proportional fonts (like those
    used by typesetters), and even photographs and high-quality diagrams.


    However, moving from a character-based scheme to a graphical scheme presented
    a formidable technical challenge. Here''s why: the number of bytes needed to fill
    a page using a character-based printer can be calculated this way (assuming 60
    lines per page containing 80 characters);


    60 × 80 = 4,800 bytes


    In comparison, a 300 dot per inch (DPI) printer (assuming an 8-by-10-inch printer
    per page) requires this many bytes:


    (8 × 300) × (10 × 300) / 8 = 900,000 bytes


    Many of the slow PC networks simply could not handle the nearly 1MB of data required
    to print a full page on a laser printer, so it was clear that a clever invention
    was needed.


    That invention turned out to be the page description language (PDL). A page description
    language is a programming language that describes the contents of a page. Basically
    it says, “Go to this position, draw the character ''a'' in 10 point Helvetica,
    to this position...” until the page is described. The first PDL was PostScript
    from Adobe Systems, which is still in use today. The PostScript language is a
    complete programming language tailored for typography and other kinds of graphs
    and imaging. It includes built-in support for 35 standard, high-quality fonts,
    the ability to add additional font definitions at runtime. At first, support for
    PostScript was built into the printers themselves. This solved the data transmission
    problem. While the typical PostScript program was very verbose in comparison to
    the simple byte stream of character-based printers, it was much smaller than the
    number of bytes required to represent the entire page.


    A PostScript printer accepted a PostScript program as input. The printer contained
    its own processor and memory (oftentimes making the printer a more powerful computer
    than'
  merge: -1
  pgno: 324
- img_proc: true
  md: 'the computer to which it was attached) and executed a special program called
    a PostScript interpreter, read the incoming PostScript program and rendered the
    results into the printer''s internal memory, forming the pattern of bits (dots)
    that would be transferred to the paper. The generic name for this process of rendering
    something into a large pattern (called a bitmap) raster image processor (RIP).


    As the years went, both computers and networks became much faster. This allowed
    the RIP to move from the printer to the host computer, which, in turn, permitted
    high-quality printers to be much less expensive


    Many printers today still accept character-based streams, but many low-cost printers
    do not rely on the host computer''s printer to provide a stream of bits as prints.
    There are still PostScript printers too.


    # Printing with Linux


    Modern Linux systems employ two software suites to perform and manage printing.
    The first, Common Unix Printing System (CUPS) provides print drivers and print-job
    management, and the second, Ghostscript, a PostScript interpreter, acts as a RIP.


    CUPS manages printers by creating and maintaining print queues. Unix printing
    was originally designed to manage a centralized printer shared by multiple users.
    Since printers are slow by nature, compared to the computers that are feeding
    them, printing needs a way to schedule multiple print jobs and keep things organized.
    CUPS also has the ability to recognize different types of data (within reason)
    and can convert files to a printable form.


    # Preparing Files for Printing


    As command line users, we are mostly interested in printing text, though it is
    certainly possible to print other data formats as well.


    # pr—Convert Text Files for Printing


