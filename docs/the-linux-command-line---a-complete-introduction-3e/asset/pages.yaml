    \ workings of a script while it is being executed. Applying additional echo statements\
    \ will usually do the trick.\n\n```\n#!/bin/bash\n\n# trouble: script to demonstrate\
    \ common errors\n\nnumber=1\n\necho \"number=$Snumber\" DEBUG\nset -x # Turn on\
    \ tracing\nif [ Snumber = 1 ]; then\n    echo \"Number is equal to 1.\"\nelse\n\
    \    echo \"Number is not equal to 1.\"\nfi\nset +x # Turn off tracing\n```\n\n\
    In this trivial example, we simply display the value of the variable number and\
    \ mark the added line with a comment to facilitate its later identification and\
    \ removal. This technique is particularly useful when watching the behavior of\
    \ loops and arithmetic within scripts."
