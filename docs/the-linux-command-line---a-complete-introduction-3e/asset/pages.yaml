    # Using Rsync Over a Network


    One of the real benefits of rsync is that it can be used to copy files over a
    network. After all, the r in rsync stands for "remote". Remote copying can be
    done in one of two ways. The first way is with another system that has rsync installed,
    with a remote shell program using ssh. Let''s say we have another system on our
    local network with a lot of available hard drive and we wanted to perform our
    backup operation using the remote system instead of an external drive. Assuming
    that it has a directory named /backup where we could deliver our files, we would
    do this:


    ```

    me@linuxbox ~/ sudo rsync -av --delete -rs=ssh /etc /home /usr/local remote-sys:/backup

    ```


    We made two changes to facilitate the network copy. First, we added the --ssh=ssh
    option, which instructs rsync to use the ssh program as its remote shell. In this
    way, we were able to use an ssh-encrypted tunnel to securely transfer the data
    from the local system to the remote host. On modern systems ssh is the default,
    so this is rarely needed. Second, we specified the remote host by prefixing its
    name (in this case the remote host is named remote-sys) to the destination pathname.'
