  md: '# # 22

    PRINTING


    ![](img/58edd539af3a70704734cedc1ac0c271_322_0.png)


    After spending the past couple of chapters manipulating text, it''s time to put
    that text on paper. In this chapter, we''ll look at the command line tools that
    are used to print files and control printer operation. We won''t be looking at
    how to configure printing, because that varies from distribution to distribution
    and is usually set up automatically during installation. That we will need a working
    printer configuration to perform the exercises in this chapter.


    We will discuss the following commands:


    +   - `pr` Convert text files for printing.

    - `lp / lpr` Print files.

    - `a2ps` Format files for printing on a PostScript printer.

    - `lstat` Show printer status information.

    - `lpq` Show printer queue status.

    - `lpr` Cancel print jobs.


    # ## Brief History of Printing


    To fully understand the printing features found in Unix-like operating systems,
    we must first learn some history. Printing on Unix-like systems goes way back
    to the beginning of the operating system. In those days, printers and how they
    were used were much different from today.


    # ## Printing in the Dim Times


    Like computers, printers in the pre-PC era tended to be large, expensive, and
    centralized.'
  merge: -1
  pgno: 322
- img_proc: true
  md: "The typical computer user of 1980 worked at a terminal connected to a computer\
    \ some distance away. The printer was located near the computer and was under\
    \ the watchful eyes of the computer's operators.\n\nWhen printers were expensive\
    \ and centralized, as they often were in the early days of Unix, it was common\
    \ practice for many users to share a printer. To identify jobs belonging to a\
    \ particular user, a banner page displaying the name of the user was often printed\
    \ at the beginning of each print job. The computer staff would then load up a\
    \ cart containing the day's print jobs and deliver them to the individual users.\n\
    \n# Character-Based Printers\n\nThe printer technology of the 1980s was very different\
    \ from today in two respects. First, printers of that period were almost always\
    \ impact printers. Impact printers used a mechanical mechanism that strikes a\
    \ ribbon against the paper to form character impressions on the page. Two of the\
    \ popular technologies of that time were daisy-wheel printing and dot-matrix printing.\n\
    \nThe second, and most important, characteristic of early printers used a fixed\
    \ set of characters intrinsic to the device. For example, a daisy-wheel printer\
    \ could print only the characters molded into the petals of the daisy wheel. This\
    \ made the printers much like high-speed typewriters. With most typewriters, they\
    \ used monospaced (fixed-width) fonts. This means that each character had the\
    \ same width. Printing was done at fixed positions on the page, and the printable\
    \ area of a page contained a fixed number of characters. Most printers printed\
    \ ten characters per inch (CPI) horizontally and six lines per inch (LPI). Using\
    \ this scheme, a US-letter sheet of paper is 85 characters wide and 66 lines high.\
    \ Taking into account a small margin on each side, 80 characters was considered\
    \ the maximum width of a print line. This explains why terminal displays (and\
    \ our terminal emulators) are normally 80 characters wide. Using a monospaced\
    \ font and an 80 character-width terminal provides a what-you-see-is-what-you-get\
    \ (WYSIWYG) view of printed output.\n\nData is sent to a typewriter-like printer\
    \ in a stream of bytes containing the characters to be printed. For example, to\
    \ print an a, the ASCII character code 97 is sent. In, low-numbered ASCII control\
    \ codes provided a means of moving the printer's carriage and page, using carriage\
    \ return, line feed, form feed, and so on. Using the control codes, it was possible\
    \ to achieve some limited effects, such as by having the printer print a character,\
    \ backspace, and the printer again to get a darker impression on the page. We\
    \ can actually use this to render a map page and the output using cat -A.\n\n\
    ```\n$me@linux~$ zcat /usr/share/man/man1/ls.gz | nroff -c -man | cat -A | head\n\
    LS(1)\n      User Commands                 LS(1)\n$\n$\n$\nM*MNA*HAN*HME*H\n```"
