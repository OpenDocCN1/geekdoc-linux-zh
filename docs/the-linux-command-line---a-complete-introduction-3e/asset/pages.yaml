    Over the last several years distribution vendors have come out with universal
    package formats that are not tied to a particular Linux distribution. These include
    Snaps (developed and promoted by Canonical), Flatpaks (pioneered by Red Hat, but
    widely available), and AppImages. Though each work a little differently, their
    goal is to have an application and all of its dependencies bundled and installed
    in a single piece. This is not an entirely new idea. In the early days of Linux
    (think the late 1990s) there was a technique called static linking that combined
    an application and its required libraries into a single large binary.


    There are some benefits to this packaging approach. First among them is reducing
    the effort to distribute an application. Rather than tailoring the application
    to work with the libraries and other support files included in a distribution''s
    base system, the application is built once and can be installed on any system.
    Some of these formats also run the application in a containerized sandbox to provide
    additional security.


    But there are some serious downsides too. Applications packaged this way are large.
    Sometimes really large. This has two effects. First, they require a lot of disk
    space to store. Their large size can make them very slow to load. This may not
    be much of an issue on modern ultra-fast hardware, but on older machines it''s
    a real problem. The next technical problem has to do with distribution integration.
    These applications bring all of their stuff with them, they don''t take advantage
    of the underlying distribution''s facilities. Sometimes the containerized application
    cannot access system resources needed for optimal performance.


    Then there are the philosophical issues. Perhaps the biggest beneficiary of these
    all-in-one application packages are proprietary software vendors. They can build
    a'
