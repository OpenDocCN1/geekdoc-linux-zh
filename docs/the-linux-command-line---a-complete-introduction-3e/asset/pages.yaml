    major

    ```


    Using this regular expression, we can find all the words in our dictionary file
    that are five letters long and have a j in the third position and an r in the
    last position.


    # Bracket Expressions and Character Classes


    In addition to matching any character at a given position in our regular expression,
    we can also match a single character from a specified set of characters using
    bracket expressions. With bracket expressions, we can specify a set of characters
    (including characters that would otherwise be interpreted as metacharacters) to
    be matched. In this example, using a two-character set, we match any that contains
    the string bzip or gzip:


    ```

    [@linuxbox ~]$ grep -h ''[bg]zip dirlist*.txt

    ```'
