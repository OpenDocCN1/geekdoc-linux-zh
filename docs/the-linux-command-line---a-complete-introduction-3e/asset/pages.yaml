    # printf—Format and Print Data


    Unlike the commands in this chapter, the printf command is not used for pipelines
    (it does not accept standard input) nor does it find frequent application directly
    on the command line (it''s mostly used in scripts). So, why is it important? Because
    it is so widely used.


    printf (from the phrase print formatted) was originally developed for the C programming
    language and has been implemented in many programming languages including the
    shell. In fact, bash, printf is a builtin.


    printf works like this:


    ```

    printf [-v var] "format" arguments

    ```


    The command is given a string containing a format description, which is then applied
    to a list of arguments. The formatted result is sent to standard output unless
    the -v option is specified in which case the formatted result is stored in variable
    var. Here is a trivial example of printf in action:


    ```

    [melinux]$ printf I formatted the string: %s\n foo

    I formatted the string: foo

    ```


    Here it is using the -v option where the result is placed in a variable rather
    than being sent to standard output:


    ```

    [me@linux]$ printf -v result "I formatted the string: %s\n" foo

    [me@linux]$ echo "$Sresult"

    I formatted the string: foo

    ```


    The format string may contain literal text (like "formatted the string:" escape
    sequences as \n, a newline character), and sequences beginning with the % character,
    which are called conversion specifications. In this example, the conversion specification
    %s is used to format the string foo and place it in the command''s output. Here
    it is again:


    ```

    [me@linux]$ printf "I formatted ''%s as a string.\n" foo

    I formatted ''foo'' as a string.

    ```


    As we can see, the %s conversion specification is replaced by the string foo in
    the command''s output. The %s is used to format string data. There are other specifiers
    for other kinds of data. Table 21-4 lists the commonly used data types.


    # Table 21-4: Common printf Data Type Specifiers


    | Specifier | Description |

    | d | Format a number as a signed decimal integer. |

    | f | Format and output a floating-point number. |'
