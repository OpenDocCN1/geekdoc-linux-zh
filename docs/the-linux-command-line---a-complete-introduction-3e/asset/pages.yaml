  md: '# 23

    COMPILING PROGRAMS


    ![](img/58edd539af3a70704734cedc1ac0c271_334_0.png)


    In this chapter, we will look at how to build programs by compiling source code.
    The availability of source code is the essential freedom that makes Linux possible.
    The entire ecosystem of Linux development relies on free exchange between developers.
    For many desktop users, compiling is a lost art. It used to be quite common, but
    today, distribution maintainers have huge repositories of precompiled binaries,
    ready to download and use. At the time of this writing, the Debian repository
    (one of the largest of any of the distributions) contains more than 68,000 packages.


    So why compile software? There are two reasons.


    **Availability** Despite the number of precompiled programs in distribution repositories,
    some distributions may not include all the desired applications. In this case,
    the only way to get the desired program is to compile it from source.


    **Timeliness** While some distributions specialize in cutting-edge versions of
    programs, many do not. This means that the latest version of a program, compiling
    is necessary.


    Compiling software from source code can become complex and technical and well
    beyond the reach of many users. However, many compiling tasks are easy and involve
    only a few steps. It all depends on the package. We will look at a simple case
    to provide an overview of the process and as a starting point for those who want
    to undertake further study.


    We will introduce one new command:


    ```

    make Utility to maintain programs.

    ```'
  merge: -1
  pgno: 334
- img_proc: true
  md: '# What Is Compiling?


    Simply put, compiling is the process of translating source code (the human-readable
    description of a program written by a programmer) into the native language of
    the computer''s processor.


    The computer''s processor (or CPU) works at an elemental level, executing programs
    in what is called machine language. This is a numeric code that describes extremely
    small operations, such as "add this byte," "point to this location in memory,"
    or "copy this byte." Each of these instructions is expressed in binary (ones and
    zeros). The earliest computer programs were written using this numeric code, which
    may explain why programmers wrote it were seen to smoke a lot, drink gallons of
    coffee, and wear thick glasses.


    This problem was overcome by the advent of assembly language, which replaced the
    numeric codes with (slightly) easier to use mnemonics such as CPY (for copy) and
    MOV (for move). Programs written in assembly language are processed into machine
    language by a program called an assembler. Assembly language is still used today
    for specialized programming tasks, such as device drivers and embedded systems.


    We come next to what are called high-level programming languages. They are because
    they allow the programmer to be less concerned with the details of what the processor
    is doing and more with solving the problem at hand. The early ones (developed
    during the 1950s) include FORTRAN (designed for scientific and technical tasks)
    and COBOL (designed for business applications). Both are still in limited use
    today.


    While there many popular programming languages, two predominate. Programs written
    for modern systems are written in either C or C++. In the examples to follow,
    we will be compiling a C program.


    Programs written in high-level languages are converted into machine language by
    processing them with another program, called a compiler. Some compilers translate
    high-level instructions into assembly language and then use an assembler to perform
    the final stage of translation into machine language.


    A process often used in conjunction with compiling is linking. There are many
    common tasks performed by programs. For instance, opening a file. Many programs
    perform this task, but it would be wasteful to have each program implement its
    own routine to open files. It makes more sense to have all programs need to share
    it. Providing support for common tasks is accomplished by what are called libraries.
    They contain multiple routines, each performing multiple programs can share. If
    we look in the /lib and /usr/lib directories, we can see many of them live. A
    program called a linker is used to form the connections between the output of
    the compiler and the libraries that the compiled program requires. The final result
    of this process is the executable program file, ready for use.


    # Are All Programs Compiled?


    No. As we have seen, there are programs as shell scripts that do not require compiling.'
