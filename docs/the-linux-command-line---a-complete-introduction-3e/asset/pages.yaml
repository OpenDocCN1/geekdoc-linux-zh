    # WHAT IS "TEXT"?


    There are many ways to represent information on a computer. All methods involve
    defining a relationship between the information and some numbers that will be
    used to represent it. Computers, after all, only understand numbers, and all data
    is converted to numeric representation.


    Some of these representation systems are complex (such as compressed video files),
    while others are simple. One of the earliest and simplest is ASCII text (pronounced
    "as-key") is short for American Standard Code for Information Interchange. This
    is an encoding scheme that was first used on Teletype machines to make keyboard
    characters to numbers.


    Text is a simple one-to-one mapping of characters to numbers. It is compact: Fifty
    characters of text translates to 50 bytes of data. It is important to understand
    that text contains only a simple mapping of characters to numbers. It is not the
    same as a word processor document such as one created by Microsoft Word or LibreOffice
    Writer. Those files, in contrast to simple ASCII text contain many non-text elements
    that are used to describe its structure and formatting. Plain ASCII text contains
    only the characters themselves and a few rudimentary control codes such as tabs,
    carriage returns, and line feeds.


    Throughout a Linux system, many files are stored in text format, and there are
    many Linux tools that work with text files. Even Windows recognizes the importance
    of this format. The well-known NOTEPAD.EXE program is an editor for plain ASCII
    text.


