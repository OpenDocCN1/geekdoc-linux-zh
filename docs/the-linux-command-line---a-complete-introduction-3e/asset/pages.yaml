  md: '# Finding Ugly Filenames with find


    The find command supports a test based on a regular expression. There is an important
    consideration to keep in mind when using regular expressions in find versus grep.
    Whereas grep will print a line when the line contains a string that matches an
    expression, find requires that the pathname exactly match the regular expression.
    In the following example, we will use find with a regular expression to find every
    pathname that contains any character that is not a member of the following:


    ```

    [-_./0-9a-zA-Z]

    ```


    Such a scan would reveal pathnames that contain embedded spaces and potentially
    offensive characters.


    ```

    me[linuxbox ~]$ find -regex ''.*[_-./0-9a-zA-Z].*''

    ```


    Because of the exact match for an entire pathname, we use . * at ends of the expression
    to match zero or more instances of any character. In the middle of the expression,
    we use a nested bracket expression containing our of acceptable pathname characters.


    # Searching for Files with locate


    The locate command supports both basic (the --regexp option) and extended (--regex)
    regular expressions. With it, we can perform many of the same operations that
    we carried out with earlier files.


