  md: '# 1

    WHAT IS THE SHELL?


    ![](img/58edd539af3a70704734cedc1ac0c271_35_0.png)


    When we speak of the command line, we are really referring to the shell. The shell
    is a program that takes keyboard commands and passes them to the operating system
    to carry out. Almost all Linux distributions supply a shell program from the GNU
    Project called bash. The name is an acronym for bourne again shell, a reference
    to the fact that bash is an enhanced replacement for sh, the original Unix shell
    program written by Steve Bourne.


    # Terminal Emulators


    When using a graphical user interface (GUI), we need another program called a
    terminal emulator to interact with the shell. If we look through our desktop menus,
    we will probably find one. KDE uses konsole, and GNOME uses gnome-terminal, though
    it''s likely called simply “terminal” on your menu. A number of other terminal
    emulators are available for Linux, but they basically do the same thing: give
    access to the shell. You will develop a preference for one or another terminal
    emulator based on the number of bells and whistles it has.


    # Making Your First Keystroke


    So let''s get started. Launch the terminal emulator. Once it comes up, we should
    see something like this:


    ```

    $me@linuxbox-$

    ```


    This is called a shell prompt, and it will appear whenever the shell is ready
    to accept input. While it may vary in appearance somewhat depending on the distribution,
    it will typically include your username@machename, followed by the current working
    directory (more about that a little bit) and a dollar sign.'
  merge: -1
  pgno: 35
- img_proc: true
  md: 'If the last character of the prompt is a bash mark (#) rather than a dollar
    sign, the terminal session has superuser privileges. This means either we are
    logged in the root user or we selected a terminal emulator that provides superuser
    (administrative) privileges.


    Assuming things are good so far, let''s try typing. Enter some gibberish at the
    prompt like so:


    ```

    [me@linuxbox ~]$ kaekjfaeifj

    ```


    Because this command makes no sense, the shell tells us so and gives us another
    chance:


    ```

    bash: kaekjfaeifj: command not found

    [me@linuxbox ~]$

    ```


    # Command History


    If we press the up arrow, we will see that the previous command kaekjfaeifj reappears
    after the prompt. This is called command history. Most Linux distributions remember
    the last 1,000 commands by default. Press the down arrow and the previous command
    disappears.


    # Cursor Movement


    Recall the previous command by pressing the up arrow again. If we try the left
    and right arrows, we''ll see how we can position the cursor anywhere on the command
    line. This makes editing commands easy.


    > A FEW WORDS ABOUT MICE AND FOCUS

    While the shell is all the keyboard, you can also use a mouse with your terminal
    emulator. A mechanism built into the windowing system (the underlying engine that
    makes the GUI go) provides a quick copy-and-paste technique. If you highlight
    text by holding down the left mouse button and dragging the mouse over it (or
    double-clicking it), it is copied into a buffer maintained by the windowing system.
    Pressing the middle button will cause the text to be pasted at the cursor location.
    Try it on most desktop environments.

    Don''t be tempted to use CTRL-C to copy and CTRL-P inside a terminal window. They
    don''t work. These control codes have different meanings and were assigned many
    years before the release of Microsoft Windows. Use SHIFT-CTRL-C and SHIFT-CTRL-V
    instead using the terminal window.

    Y graphical desktop environment (most likely KDE or GNOME), in an effort to behave
    like Windows, has its focus policy set to "click to focus.". This means for a
    window to get focus (become active), you need to click it. This is contrary'
  merge: -1
  pgno: 36
- img_proc: true
  md: 'to the traditional window system behavior of "focus follows mouse," which means
    that a window gets focus just by passing the mouse over it. The window will not
    come to the foreground until you click it, but it will be to receive input. Setting
    the focus policy to "focus follows mouse" will make the copy-and-paste technique
    even more useful. Try it if you (though some desktop environments no longer support
    it). I think if you give it a chance, you will prefer it. You will find this setting
    in the configuration program for your window manager.


    # # Try Some Simple Commands


    Now that we have learned to enter text in our terminal emulator, let''s try a
    few simple commands. Let''s begin with the date command, which displays the current
    time and date:


    ```

    @me@linuxbox date

    Thu Mar 8 15:09:41 2025

    ```


    Another handy command uptime, which displays how long the system has been running
    and the average number of processes running over periods of time:


    ```

    @me@linuxbox -s uptime

    15:12:22 up 3 days, 23:40, 7 users, load average: 0.37, 0.37, 0.64

    ```


    # ## CONSOLE BEHIND THE CURTAIN


    Even if we have no terminal emulator running, several terminal sessions continue
    to run behind the graphical desktop. We can access these sessions, called virtual
    terminals or virtual consoles, by pressing CTRL-ALT-F1 through CTRL-ALT-F6 on
    Linux distributions. When a session is started, it presents a login prompt into
    which we enter our username and password. To switch from one console to another,
    press ALT-F1 through ALT-F6. On most systems, we can return to the graphical desktop


    To see the amount of free space on our disk drives, enter df:


    ```

    @me@linuxbox -s df

    Filesystem 1-blocks Used Available% Mounted on

    /dev/sda2 15115452 9949716 64% /

    /dev/sda5 59631908 26545424 30008432 47% /home

    /dev/sda1 147764 17378 122765 13% /boot

    tmpfs 256856 0 256856 0% /dev/shm

    ```


    Likewise, to display the amount of free memory, enter the free command:


    ```

    @me@linuxbox -s free

    ```'
