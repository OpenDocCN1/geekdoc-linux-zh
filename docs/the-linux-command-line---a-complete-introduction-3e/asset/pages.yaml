  md: "```\nif (( len > max_len )); then\n  max_len=\"$1\"\n  max_word=\"$1\"\nfi\n\
    echo \"$1: '$max_word' ($max_len characters)\"\n```\n\nIn this example, we look\
    \ for the longest string found within a file. When given one or more filenames\
    \ on the command line, this program uses the strings program (which is included\
    \ in the GNU binutils package) to generate a list of readable text \"words\" in\
    \ each file. The for loop processes each word and determines whether the current\
    \ word is the longest found so far. When the loop completes, the longest word\
    \ is displayed.\n\nOne thing to note here is, contrary to our usual practice,\
    \ we do not surround the command substitution $1 with double quotes. This is because\
    \ we actually want word splitting to give us our list. If we had surrounded the\
    \ command substitution with quotes, it would produce only a single word containing\
    \ every string in the file. That's not exactly what we are looking for.\n\nIf\
    \ the optional in of the for command is omitted, for defaults to processing the\
    \ positional parameters. We will modify our longest-word script to use this method:\n\
    \n```\n#!/bin/bash\n\n# longest-word2: find longest string in a file\n\nfor i;\
    \ do\n  if [[ -r \"$i\" ]]; then\n    max_word=\n    max_len=0\n    for j in $(strings\
    \ \"$i\"); do\n      len=$(echo -n \"$j\" | wc -c)\n      if (( len > max_len\
    \ )); then\n        max_len=\"$len\"\n        max_word=\"$j\"\n      fi\n    done\n\
    \    echo \"$i: '$max_word' ($max_len characters)\"\n  fi\ndone\n```\n\nAs we\
    \ can see, we have changed the outermost loop to use in place of while. By omitting\
    \ the list of words in the for command, the positional parameters are used instead.\
    \ Inside the loop, previous instances of the variable i have been changed to the\
    \ variable j. The use of shift has also been eliminated."
