  md: 'The second way rsync can be used to synchronize files over a network is by
    using an rsync server. rsync can be configured as a daemon and listen to incoming
    requests for synchronization. This is often done to allow mirroring of a remote
    system. For example, Red Hat Software maintains a large repository of software
    packages under development for its Fedora distribution. It is useful for software
    testers to mirror this collection during the testing phase of the distribution
    release cycle. Since files in the repository change frequently (often more than
    once a day), it is desirable to maintain a local mirror by periodic synchronization,
    rather than by bulk copying of the repository. One of these repositories is kept
    at Duke University; we could mirror it using our local copy of rsync and their
    rsync server like:


    ```

    [me@linuxbox~$] mkdir fedora-devel

    [me@linuxbox~$] rsync -av --delete rsync://archive.linux.duke.edu/

    fedora/linux/development/rawhide/Everything/x86_64/os/ fedora-devel

    ```


    In this example, we used the URI of the rsync server, which consists of a protocol
    (rsync://), followed by the remote hostname (archive.linux.duke.edu), followed
    by the pathname of the repository.


    # Summing Up


    We''ve looked at the common compression and archiving programs used on Linux and
    other Unix-like operating systems. For archiving files, the tar/gzip combination
    is the preferred method on Unix-like systems, while zip/unzip is used for interoperability
    with Windows systems. Finally, we looked at the rsync program (a personal favorite),
    which is handy for efficient synchronization of files and directories across systems.'
