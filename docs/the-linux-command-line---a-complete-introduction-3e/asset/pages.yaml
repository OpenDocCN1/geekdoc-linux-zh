    0\n1\n2\n3\n4\n```\n\nIn this example, expression1 initializes the variable i\
    \ with the value of zero, expression2 allows the loop to continue as long as the\
    \ value of i remains less than 5, and expression3 increments the value of i by\
    \ 1 each the loop repeats.\n\nThe C language of for is useful anytime a numeric\
    \ sequence is needed. We will see several applications for this in the next two\
    \ chapters.\n\n# Summing Up\n\nWith our knowledge of the for command, we will\
