    of characters per line and lines per page. pr is used to adjust text on a specific
    page size, with optional page headers and margins. Table 22-1 summarizes its most
    commonly used options.


    # Table 22-1: Common pr Options


    | Option | Description |

    |---|---|

    | +first[:last] | Output a range of pages starting with first and, optionally,
    ending with last. |

    | -columns | |'
