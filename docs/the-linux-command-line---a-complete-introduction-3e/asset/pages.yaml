    expansion to examine the length of the array, using the @ notation. Finally, we
    look at the length of element 100, which contains the string foo. It is interesting
    to note that while the bash reports only one element in the array. This differs
    from the behavior of some other languages in which the unused elements of the
    array (elements 0 to 99) would be initialized with empty values and counted. In
    bash, array elements exist only if they have been assigned a value regardless
    of their subscript.


