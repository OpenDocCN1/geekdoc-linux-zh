- img_proc: true
  md: '5. Exit car.


    6. Lock car.


    The “Turn off motor” subtask could further be broken down into steps including
    “Turn off ignition,” “Remove ignition key,” and so on, until every step of the
    entire process of going to the market has been fully defined.


    This process of identifying the top-level steps and developing increasingly detailed
    views of those steps is called top-down design. This technique allows us to break
    large complex tasks into many small, simple tasks. Top-down design is a common
    method of designing programs and one that is well suited to shell programming
    in particular.


    In this chapter, we will use top-down design to further develop our report-generator
    script.


