    # Summing Up


    With this basic set of skills, we can now perform most of the text editing needed
    to maintain a typical Linux system. Learning to use vi on a regular basis will
    pay off in the long run. Since vi-style editors are so deeply embedded in Unix
    culture, we will see many other programs that have been influenced by its design.
    less is a good example of this influence.'
