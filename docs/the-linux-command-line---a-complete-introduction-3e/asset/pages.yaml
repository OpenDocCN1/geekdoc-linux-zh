    # # Assigning Values to an Array


    Values may be assigned in one of two ways. Simple values may be assigned using
    the following syntax, where name is the name of the array and subscript is an
    integer (or arithmetic expression) greater than or equal to:


    ```

    name[subscript]=value

    ```


    Note that the first element of an array is subscript zero, not one. value is a
    string or integer assigned to the array element.


    Multiple values may be assigned using the following syntax, where name is the
    name of the array and value placeholders are assigned sequentially to elements
    of the array, starting with element zero:


    ```

    name=(value1 value2 ...)

    ```


    For example, if we wanted to assign abbreviated days of the week to the array
    days, we could do this:


    ```

    me@linuxux ~$days=(Sun Mon Tue Wed Thu Fri Sat)

    ```


    It is also possible to assign values to a specific element by specifying a subscript
    for each value.


    ```

    me@linuxux ~$days[0]=Sun [1]=Mon [2]=Tue [3]=Wed [4]=Thu [5]=Fri [6]=Sat

    ```


    # # Accessing Array Elements


    What are arrays good for? Just as many data-management tasks can be performed
    with a spreadsheet program, many programming tasks can be performed with arrays.'
