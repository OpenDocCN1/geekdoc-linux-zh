  md: '# # 18

    # ARCHIVING AND BACKUP


    ![](img/58edd539af3a70704734cedc1ac0c271_237_0.png)


    One of the system administrator primary tasks is keeping the system''s data secure.
    One way this is done by performing timely backups of the system''s files. Even
    if you''re not a system administrator, it is often useful to make copies of things
    and move large collections of files from place to place and from device to device.


    In this chapter, we will look at several common programs that are used to manage
    collections of files. These are the file compression programs:


    +   - **gzip** Compress or expand files.

    - **bzip2** A block sorting file compressor.


    These are the archiving programs:


    +   - **tar** Tape archiving utility.

    - **zip** Package and compress files.


    This is the file synchronization program:


    +   - **rsync** Remote file and directory synchronization.


    # ## Compressing Files


    Throughout the history of computing, there has been a struggle to get the most
    data into the smallest available space, whether that be memory, storage devices,
    or network bandwidth. Many of the data services that we take for granted today,
    such as mobile phone service, high-definition television, or broadband internet,
    owe their existence to effective data compression techniques.'
  merge: -1
  pgno: 237
- img_proc: true
  md: 'Data compression is the process of removing redundancy from data. Let''s consider
    an imaginary example. We say we have an entirely black picture file with the dimensions
    of 100 pixels by 100 pixels. In terms of data storage (assuming 24 bits, or 3
    bytes per pixel), the image will occupy 30,000 bytes of storage.


    # 100 × 100 × 3 = 30,000


    An image that is all one color contains redundant data. If we were clever, we
    could encode the data in such a way that we simply describe the fact that we have
    a block of 10,000 black pixels. So, instead of storing a block of data containing
    30,000 zeros (black is usually represented in image files as zero), we could compress
    the data into the number 10,000, followed by a zero to represent our data. Such
    a data compression scheme is called run-length encoding and is one of the most
    rudimentary compression techniques. Today''s techniques are much more advanced
    and complex, but the basic goal remains the same—get rid of redundant data.


    **Compression algorithms** (the mathematical techniques used to carry out the
    compression) fall into two general categories.


    **Lossless compression** Preserves all the data in the original. This means that
    when a file is restored from a compressed version, the restored file is the same
    as the original, uncompressed version.


    **Lossy compression** Removes data as the compression is performed to allow more
    compression to be applied. When a lossy file is restored, it does not match the
    original version; rather, it is a close approximation. Examples of lossy compression
    are JPEG (for images) and MP3 (for music).


    In our discussion, we will look exclusively at lossless compression since most
    data on computers cannot tolerate any data loss.


    # gzip


    The gzip program is used to compress one or more files. When executed, it replaces
    the original file with a compressed version of the original. The corresponding
