    # lprm/cancel—Cancel Print Jobs


    CUPS supplies two programs to terminate print jobs and remove them from the print
    queue. One is Berkeley style (lprm), and the other is System V (cancel). They
    differ slightly in the options they support but basically the same thing. Using
    our earlier print job as an example, we could stop the job and remove it this
    way:


    ```

    [me@linux -cancel 603

