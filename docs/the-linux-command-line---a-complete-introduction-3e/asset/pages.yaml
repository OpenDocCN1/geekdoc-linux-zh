    -exec rm ''{}'' ;

    ```


    Again, since the brace and semicolon characters have special meaning to the shell,
    they must be quoted or escaped.

    It''s also possible to execute a user-defined action interactively. By using the
    -ok action in place of -exec, the prompt is executed before each specified command:


    ```

    find -type f -name ''foo*'' -ok ls -l ''{}'' ;

    - ls ... /home/me/bin/foo > y

