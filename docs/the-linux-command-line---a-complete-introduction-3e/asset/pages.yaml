  md: '# IFS


    Normally, the shell performs word splitting on the input provided to read. As
    we have seen, this means that multiple words separated by one or more spaces become
    separate items on the input line and are assigned to separate variables by read.
    This behavior is configured by a shell variable IFS for "Internal Field Separator".
    The default value of IFS contains a space, a tab, and a newline character, each
    will separate items from one another.


    We can adjust the value of IFS to control the separation of fields input to read.
    For example, the `/etc/passwd` file contains lines of data that use the column
    character as a field separator. By changing the value of IFS to a single colon,
    we can use read to input the contents of `/etc/passwd` and successfully separate
    fields into different variables. Here we have a script that does just:


    ```

    #/bin/bash


    # read-ifs: read fields from a file


    FILE=/etc/passwd


    read -p "Enter a username " user_name


    file_info=$(grep "$user_name:" $FILE)


    if [ -n "$file_info" ]; then

    IFS=": read -r pw uid gid name home shell <<< "$file_info"

    echo User = ''$User''

    echo UID = ''$Uid''

    echo GID = ''$Gid''

    echo Full Name = ''$Name''

    echo Home Dir. = ''$Home''

    echo Shell = ''$Shell''

    else

    echo "No such user $user_name" >&2

    exit 1

    fi

    ```


    This script prompts the user to enter the username of an account on the system
    and then displays the different fields found in the user''s /etc/passwd file.
    The script contains two interesting lines. The first is as follows:


    ```

    file_info=$(grep "$user_name:" $IFS)

    ```


    This line assigns the results of the grep command to the variable file_info. The
    regular expression used by grep assures that the username will match only a single
    line in the /etc/passwd file.


    The second interesting line in this is:


    ```

    IFS=": read -r pw uid gid name home shell <<< "$file_info"

    ```'
  merge: -1
  pgno: 391
- img_proc: true
  md: 'The line consists of three parts: a variable assignment, a read command with
    a list of variable names as arguments, and a strange new redirection operator.
    We''ll look at the variable assignment first.


    The shell allows one or more variable assignments to take place immediately before
    a command. These assignments alter the environment for the command that follows.
    The effect of the assignment is temporary, changing only the environment for the
    duration of the command. In our case, the value of IFS is changed to a colon character.
    Alternately, we could have coded this way:


    ```

    OLD_IFS=$IFS

    IFS=":"

    read user pw uid gid home shell <<< "$file_info"

    IFS=$OLD_IFS

    ```


    Here, we store the value of IFS, assign a new value, perform the read command,
    and then restore IFS to its original value. Clearly, placing the variable assignment
    in front of the command is a more concise way of doing the same thing. A here
    string is like a here document, only shorter, consisting of a single string.


    The <<< operator indicates a here string. In our example, the line of data from
    the /etc/passwd file is fed to the standard input of the read command. We might
    wonder why this rather oblique method was chosen rather than this:


    ```

    echo "$file_info | IFS=": read user pw uid gid name home shell

    ```


    Well, there''s a reason .


    # YOU CAN''T PIPE READ


    | While the read command normally takes input from standard input, you cannot
    do this: |

    | echo "foo" | read |


    We would expect this to work, but it does not. The command will appear to succeed,
    but the REPLY variable will always be empty. Why is this?


    The explanation has to do with the way shell handles pipelines. In bash (and other
    shells like sh), pipelines create subshells. These are copies of the shell and
    its environment that are used to execute the command in the pipeline. In our previous
    example, read is executed in a subshell.


    Subshells in Unix-like systems create copies of the environment for the processes
    to use while they execute. When the processes finishes, the copy of the environment
    is destroyed. This means that a subshell can never alter the environment of its
    parent process. read assigns variables, which then become part of the environment.
    In the previous example, read assigns the value foo to the variable REPLY in its
    subshell''s environment,'
