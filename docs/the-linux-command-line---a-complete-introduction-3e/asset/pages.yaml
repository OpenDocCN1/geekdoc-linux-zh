    # Shutting Down the System


    The process of shutting down the system involves the orderly termination of all
    the processes on the system, as well as performing some vital housekeeping chores
    (such as syncing all of the mounted filesystems) before the system powers off.
    There are four commands that can perform this function. They are halt, poweroff,
    reboot, and shutdown. The first three are pretty self-explanatory and are generally
    used without any command line options. Here''s an example:


    ```

    [me@linuxbox ~]$ sudo reboot

    ```


    > The shutdown command is a bit more interesting. With it, we can specify which
    of the actions to perform (halt, power down, or reboot) and provide a time delay
    to the shutdown event. Most often it is used like to halt the system:


    ```

    [me@linuxbox ~]$ sudo shutdown -h now

    ```


    It is usually used like this to reboot the system:


    ```

    [me@linuxbox ~]$ sudo shutdown -r now

    ```


    The delay can be specified in a variety of ways. See the shutdown man page for
    details. Once the shutdown command is executed, a message is "broadcast" to all
    logged-in users warning them of the pending event.


    # More Process-Related Commands


    Since monitoring processes is an important system administration task, there are
    lots of commands for it. Table 10-7 lists some to play with.


    Table 10-7: Other Process-Related Commands

    | Command | Description |

    |--- |--- |

    | pstree | Outputs a process listed in a tree-like pattern showing the parent-child
    relationships between processes. |

    | vmstat | |'
