    a single file. To do this, we must redirect both standard output and standard
    error at the same time. There are two ways to do this. Here is the traditional
    way, which works with old versions of the shell:


    ```

    me@linuxbox~$ ls -l /bin/ls > ls-output.txt 2>&1

    ```


