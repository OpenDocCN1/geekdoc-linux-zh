    # Watch Out for Filenames


    There is another problem with this file deletion script that is more obscure but
    could be very dangerous. Unix (or Unix-like operating systems) has, extremely
    permissive about them, a serious design flaw when it comes to filenames. In fact,
    there are only two characters that cannot be included in a filename. The first
    is the / character (a zero byte), which is used internally to mark the ends of
    strings. and the second is the null character (a zero byte). Everything else is
    legal including spaces, tabs, line feeds, leading hyphens, carriage returns, and
    so on.


    Of particular concern are leading hyphens. For example, it''s perfectly legal
    to have a file named -rf-. Consider for a moment what happens when filename is
    passed to rm.


    To defend against this problem, we want to change our rm command in the file deletion


    script from


    ```

    rm *

    ```


    to:


    ```

    rm ./*

    ```


    This will prevent a filename starting with a hyphen from being interpreted as
    a command option. As a general rule, always precede wildcards (as * and ?) with
    / to prevent misinterpretation by commands. This includes things like *.pdf and
    ???.mp3, for example.


    # PORTABLE FILENAMES


    To ensure that a filename is portable between multiple platforms (that is, different
    types of computers and operating systems), care be taken to limit which characters
    are included in a filename. There is a standard called the POSIX Portable Filename
    Character Set can be used to maximize the chances that a filename will work across
    different systems. The standard is pretty simple. The only characters allowed
    are the uppercase letters A to Z, the lowercase letters a to z, the numerals 0
    to 9, period (.), hyphen (-), and underscore (_). The standard further suggests
    that filenames should not begin with a hyphen.


