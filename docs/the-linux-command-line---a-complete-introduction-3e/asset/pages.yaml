  md: '# DON''T BE COMPRESSIVE COMPULSIVE


    I occasionally see people attempting to compress a file that has already been
    compressed with an effective compression algorithm by doing something like this:


    S grip picture.jpg


    Don''t do it. You''re probably just wasting time and space! If you apply compression
    to a file that is already compressed, you will usually end up with a larger file.
    This is because all compression techniques involve some overhead that is added
    to the file to describe the compression. If you try to compress a file that already
    contains no redundant information, the compression will most often not result
    in any savings to offset the additional overhead.


    # Archiving Files


    A common file-management task often used in conjunction with compression is archiving.
    Archiving is the process of gathering many files and bundling them together into
    a single large file. Archiving is often done as part of system backups. It is
    also used when old data is moved from a system to type of long-term storage.


    # tar


    In the Unix-like world of software, the tar program is the classic tool for archiving
    files. Its name, short for tape archive, reveals its roots as a tool for making
    backup tapes. While it is still used for traditional task, it is equally adept
    on other storage devices. We often see filenames that end with the extension .tar
    or .tgz, which indicate a "plain" tar archive and a gzipped archive. A tar archive
    can consist of a group of separate files, one or more directories, or a mixture
    of both. The command works like this:


    ```

    tar node[options] pathname...

    ```


    Here, mode is one of the following operating modes listed in Table 18-2 (only
    a partial list is shown here; see the tar man page for a complete list).


    # Table 18-2: tar Modes


    | Mode | Description |

    |---|---|

    | c | Create an archive from a list of files and/or directories |

    | x | Extract an archive. |

    | r | Append specified pathnames to the end of an archive. If the archive does
    not exist, it is created. |

    | t | |'
