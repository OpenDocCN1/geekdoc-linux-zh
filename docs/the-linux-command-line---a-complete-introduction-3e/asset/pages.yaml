    rn = Right justified, without leading zeros. This is the default.

    rz = Right justified, with leading zeros.


    -p | Do not reset page numbering at the beginning of each logical page.


    -s string | Add string to the end of each line number to create a separator. The
    default is a single tab character.


    -v number | Set first line number of each logical page to number. The default
    is 1.

    -w width | Set width of the line number field to width. The default is 6.


    Admittedly, we probably won''t be numbering lines often, but we can use nl at
    how we combine multiple tools to perform more complex tasks. We will build on
    our work in the previous chapter to produce a Linux distributions report. Since
    we will be using nl, it will be useful to include its header/body/footer markup.
    To do this, we will add it to the script from the previous chapter. Using our
