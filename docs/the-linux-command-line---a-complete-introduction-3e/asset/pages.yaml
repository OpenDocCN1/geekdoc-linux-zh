  md: '# NOTE


    Your distribution may already include some of these, but duplicates won''t hurt
    anything.


    Table 11-4 details the meaning of our additions.


    # Table 11-4: Additions to Our .bashrc


    | Line | Meaning |

    | umask 0002 | Sets the umask to solve the problem with the shared directories
    we discussed in Chapter 9 |

    | export HISTCONTROL=ignoredups | Causes the shell''s history recording feature
