  md: '# # 35

    RAYS


    ![](img/58edd539af3a70704734cedc1ac0c271_465_0.png)


    In the previous chapter, we looked at how the shell can manipulate strings and
    numbers. The data types we have looked at so far are known in computer science
    circles as *scalar variables*; that is, they are variables that contain a single
    value.


    In this chapter, we will look at another kind of data structure called an *array*,
    which holds multiple values. Arrays are a feature of virtually every programming
    language. The shell supports them too, though in a rather limited fashion. Even
    so, they can be useful for solving some types of programming problems.


    # ## What Are Arrays?


    Arrays are variables that hold more than one value at a time. Arrays are organized
    like a table. Let''s consider a spreadsheet as an example. A spreadsheet acts
    like a *two-dimensional array*. It has both rows and columns, and an individual
    cell in it is located according to its row and column address. An array has cells,
    which are called *elements*, and each element contains data. An individual array
    is accessed using an address called *index* or subscript.


    Most programming languages support multidimensional arrays. A spreadsheet is an
    example of a multidimensional array with two dimensions, width and height. Many
    languages support arrays with an arbitrary number of dimensions, though two- and
    three-dimensional arrays are probably the most commonly used.


    Arrays in *bash* are limited to a single dimension. We can think of them as a
    spreadsheet with a single column. Even with this limitation, there are many applications
    for them. Array support first appeared in *bash version 2*. The original Unix
    shell, *sh*, did not support arrays at all.'
  merge: -1
  pgno: 465
