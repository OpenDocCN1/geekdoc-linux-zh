    # The Any Character


    The first metacharacter we will look at is the dot or period character, which
    is used to match any character. If we include it in a regular expression, it will
    match any character in that character position. Here''s an example:


    ```

    me@linuxbox ~$ grep -h ''.zip'' dirlist*.txt

    bunzip2

    bzip2

    bzip2recover

    gunzip

    gzip

    funzip

    gpg -unzip

    prezip

    prezip

    prezip-bin

    unzip

    unzipsfx

    ```


    We searched for any line in our files that matches the regular expression .zip.
    There are a couple of interesting things to note about the results. Notice that
    the zip program was not found. This is because the inclusion of the dot metacharacter
    in our regular expression increased the length of the required match to four characters,
    one of which must precede the z. Also, if any files in our lists had contained
    the file extension .zip, they would have been matched as well, because the period
    character in the file extension would be matched by the "any character" too.


    # Anchors


    The caret (^) and dollar sign ($) characters are treated as anchors in regular
    expressions. This means they cause the match to occur only if the regular expression
    is found at the beginning of the line (^) or at the end of the line.


    ```

    me@linuxbox ~$ grep -h ''^zip'' dirlist*.txt

    zip

    zipcloak

    gziprep

    zipinfo

    zipnote

    zipsplit

    me@linuxbox ~$ grep -h ''zip$'' dirlist*.txt

    gunzip

    gzip

    ```'
