  md: '# 8

    ADVANCED KEYBOARD TRICKS


    ![](img/58edd539af3a70704734cedc1ac0c271_101_0.png)


    I often kindedly describe Unix as "the operating system for people who like to
    type". Of course, the fact that it even has a command line is a testament to that.
    But command line users don''t like to type that much. Why would so many commands
    have such short names like cp, ls, mv, and rn? In fact, one of the most cherished
    goals of command line is laziness: doing the most with the fewest of keystrokes.
    Another goal is never having to lift our fingers from the keyboard and reach for
    the mouse. In this chapter, we will look at bash features that make keyboard use
    faster and more efficient.


    The following commands will make an appearance:


    clear Clear the screen.


    history Display the contents of the history list.


    # Command Line Editing


    bash uses a library (a shared collection of routines that different programs can
    use) called Readline to implement command line editing. We have already seen some
    of this. We know, for example, that the arrow keys move the cursor, but there
    are many more features. These additional tools that we can employ in our work.
    It''s not important to learn all of them, but many of them are useful. Pick and
    choose as desired.


    > NOTE


    Some of the key sequences below (particularly those that use the ALT key) may
    be intercepted by the GUI for other functions. All of the key sequences should
    work properly when using a virtual console.'
