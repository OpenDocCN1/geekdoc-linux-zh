    # # Summing Up


    In the chapters that follow, we will explore many different programs covering
    a wide range of application areas. While most of these programs are commonly installed
    by default, we may need to install additional packages if the programs are not
    provided. With our newfound knowledge (and appreciation) of package management,
    we should have no problem installing and managing the programs we need.


    # # THE LINUX SOFTWARE INSTALLATION MYTH


    People migrating from other platforms sometimes fall victim to the myth that software
    is somehow difficult to install under Linux and the variety of packaging schemes
    used by different distributions is a hindrance. Well, it is a hindrance, but only
    to proprietary software vendors that want to distribute binary-only versions of
    their software.


    The Linux ecosystem is based on the idea of open source code. If a program developer
    releases source code for a program, it is likely that a person associated with
    a distribution will package the program and include it in their repository. This
    method ensures that the program is well integrated into the distribution, and
    the user is given the convenience of “one-stop shopping” for software, rather
    than having to search for each program’s website. Recently, major platform vendors
    have begun building application stores that mimic this idea.


    Device drivers are handled in the same way, except that instead of separate items
    in a distribution repository, they become part of the Linux kernel. Generally
    speaking, there is no such thing as a “driver disk” in Linux. Either the kernel
    supports a device or it doesn''t, and the Linux kernel supports a lot of devices.
    Many more, in fact, than Windows does. Of course, this is no consolation if the
    particular device you need is not supported. When that happens, you need to look
    at the cause. A lack of driver support is usually caused by one of three:


    +   - The device is too new. Since many hardware vendors don''t actively support
    Linux development, it falls upon a member of the Linux community to write the
    kernel driver code. This takes.'
  merge: -1
  pgno: 190
- img_proc: true
  md: '+   **The device is too exotic.** Not all distributions include every possible
    device driver. Each distribution builds its own kernels, and since kernels are
    very configurable (which is what makes it possible to run Linux on everything
    from wristwatches to mainframes), they may have overlooked a particular device.
    By locating and downloading the source code for the driver, it is possible for
    you (yes, you) to compile and install the driver yourself. This process is not
    overly difficult, but it is rather involved. We''ll talk about compiling software
    in a later chapter.


    +   **The hardware vendor is hiding something.** It has neither released source
    code for a Linux driver nor released the technical documentation for somebody
    one for them. This means the hardware vendor is trying to keep the programming
    interfaces to the device a secret. Since we don''t want secret devices in our
    computers, it is best that you avoid such products.'
