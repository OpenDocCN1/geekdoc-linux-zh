    # # How Is the Environment Established?


    When we log on to the system, the `bash` program starts and runs a series of configuration
    scripts called `startup files`, which define the default environment shared by
    all users. This is followed by startup files in our home directory that define
    our personal environment. The exact sequence depends on the type of shell session
    being started. There are two kinds.


    **A login shell session** One in which we are prompted for our username and password.
    This happens when we log we into a graphical environment, for example. It is also
    done when we start a virtual console session.


    **A non-login shell session** Typically occurs when we launch a terminal session
    in the GUI with our terminal emulator.


    Login shells read one or more startup files, as shown in Table 11-2.


    Table 11-2: Startup Files for Login Shell Sessions


    | File | Contents |

    | /etc/profile | A global configuration script that applies to all users. |

    | ~/bash_profile | A user’s personal startup file. This can be used to extend
    or override settings in the global configuration script. |

    | ~/bash_login | If ~/.bash_profile is not found, bash attempts to read this script.
    |

    | ~/.profile | If neither ~/.bash_profile nor ~/.bash_login is found, bash attempts
    to read this file. This is the default in Debian-based distributions, such |'
