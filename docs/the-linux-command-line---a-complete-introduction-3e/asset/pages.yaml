    # Another Option: a2ps


    The a2ps program (available in many repositories) is interesting. As we can discern
    from its name, it''s a format conversion program, but it''s also much more. Its
    name originally meant "ASCII to PostScript," and it was used to prepare files
    for printing on PostScript printers. Over the years, the capabilities of the program
    have grown, and its name means "Anything to PostScript." While its name suggests
    a format-conversion program, it is a printing program. It sends the output to
    the system''s default printer rather than standard output. The program''s default
    behavior is that of a "pretty printer," meaning that it improves the appearance
    of output. We use the program to create a PostScript file on our desktop.


    ```

    me@linuxbox~$ ls /usr/usr/bin | pr -3 -t | a2ps -o ~/Desktop/ls.ps -l 66

    [stdin (plain): 11 pages on 6 sheets]

    [Total: 11 pages on 6 sheets] saved into the file /home/me/desktop/ls.ps''

    ```


    Here we filter the stream with pr, using the -t option (omit headers and footers),
    and then with a2ps, specifying an output file (-o option) and 66 lines per page
    (-l option) to match the output pagination of pr. If we view the resulting file
    with a suitable viewer, we will see the output in Figure 22-1.'
