  md: '# 14

    PACKAGE MANAGEMENT


    ![](img/58edd539af3a70704734cedc1ac0c271_182_0.png)


    If we spend any time in the Linux community, we hear many opinions as to which
    of the many Linux distributions are “best”. Often, these discussions get really
    silly, focusing on such things as the prettiness of the desktop background (some
    people won''t use Ubuntu because of its default color scheme!) and other vital
    matters.


    The most important determinant of distribution quality is the packaging system
    and the vitality of the distribution''s support capacity. As we spend more time
    with Linux, we see that its software landscape is extremely dynamic. Things are
    constantly changing. Most of the top-tier Linux distributions release new versions
    every six months and many individual program updates every day. To keep up with
    this blizzard of software, we need good tools for package management.


    Package management is a method of installing and maintaining software on the system.
    Today, most people can satisfy all of their software needs by installing packages
    from their Linux distributor. This contrasts with the early days of Linux, when
    one had to download and compile source code to install software. There isn''t
    anything wrong with compiling source code; in fact, having to source code is the
    great wonder of Linux. It gives us (and everybody) the ability to examine and
    improve the system. It''s just that having a precompiled package is faster and
    easier to deal with.


    In this chapter, we will look at some of the command line tools used for package
    management. While all the major distributions provide powerful and sophisticated
    graphical programs for maintaining the system, it is important to learn about
    the command line programs too. They can perform many tasks that are difficult
    (or impossible) to do with their graphical counterparts.


    # Packaging Systems'
  merge: -1
  pgno: 182
- img_proc: true
  md: 'Different distributions use different packaging systems, and as a general rule,
    a package intended for one distribution is not compatible with another distribution.
    Most distributions fall into one of two camps of packaging technologies: the Debian
    *deb* camp and the Red Hat *rpm* camp. There are some important exceptions such
    as Gentoo, Slackware, and Arch, but most users use one of these two basic systems,
    as shown in Table 14-1.


    # Table 14-1: Major Packaging System Families


    | Packaging | Distributions (partial listing) |

    | :--- | :--- |

    | Debian style (.deb) | Debian, Ubuntu, Linux Mint, Raspberry Pi OS |

    | Red Hat style (.rpm) | Fedora, CentOS, Red Hat Enterprise Linux, OpenSUSE |


    # How a Package System Works


    The method of software distribution found in the proprietary software industry
    usually entails buying a piece of installation media such as an "install disk"
    or visiting a vendor''s website and downloading a product and then running an
    "installation wizard" to install a new application on the system.


    Linux does not work that way. Virtually all software for a Linux system will be
    found on the internet. Most of it will be provided by the distribution vendor
    in the form of *package files*, and the rest will be available in source code
    format that can be installed manually. We''ll talk about how to install software
    by compiling source code in Chapter 23.


    # Package Files


    The basic unit of software in a packaging system is the *package file*. A package
    file is a compressed collection of files that comprise the software package. A
    package may consist of numerous programs and data files that support the program.
    In addition to the files to be installed, the package file also includes metadata
    about the package, such as a text description of the package and its contents.
    Additionally, many packages contain pre- and post-installation scripts that perform
    configuration tasks before and after the package installation.


    Package files are created by a person known as a *package maintainer*, often (but
    not always) an employee of the distribution vendor. The package maintainer gets
    the software in source code from the *upstream provider* (the author of the program),
    compiles it, and creates the package metadata and any necessary installation scripts.
    Often, the package maintainer will apply modifications to the original source
    code to improve the program''s integration with the other parts of the Linux distribution.'
  merge: -1
  pgno: 183
- img_proc: true
  md: '# Repositories


    While some software projects choose to perform their own packaging and distribution,
    packages today are created by the distribution vendors and interested third parties.
    Packages are available to the users of a distribution in central repositories
    that may contain many thousands of packages, each specially built and maintained
    for the distribution.


    A distribution may maintain several different repositories for different stages
    of the software development life cycle. For example, there will be a "testing"
    repository that contains packages that have just been built and are intended for
    use by brave souls who are looking for bugs for the packages released for general
    distribution. A distribution will often have a "development" repository where
    work-in-progress packages destined for inclusion in the distribution''s next major
    release.


    A distribution may also have third-party repositories. These are often needed
    to supply software that, for legal reasons such as patents or DRM anti-circumvention
    issues, cannot be included with the distribution. Perhaps the best-known case
    is that of encrypted DVD support, which is not legal in the United States. The
    third-party repositories operate in countries where software patents and anti-circumvention
    laws do not apply. These repositories are usually independent of the distribution
    they support, and to use them, one must know about them and manually include them
    in the configuration files for the package management system.


    # Dependencies


    Programs are seldom "standalone"; rather, they rely on the presence of other software
    components to get their work done. Common activities, such as input/output for
    example, are handled by routines shared by many programs. These routines are stored
    in where called shared libraries, which provide essential services to more than
    one program. If a package requires a shared resource such as a shared library,
    it is said to have a dependency. Modern package management systems provide all
    method of dependency resolution to ensure that when a package is installed, all
    of its dependencies are installed too.


    # High- and Low-Level Package Tools


    Package management systems usually consist of two types of tools.


    +   - Low-level tools that handle tasks as installing and removing package files


    +   - High-level tools that perform metadata searching and dependency resolution


    In this chapter, we will look at the tools supplied with Debian-style systems
    (such as Ubuntu and many others) and those used by Red Hat projects. While all
    Red Hat-style distributions rely on the same low-level program (rpm), they use
    different high-level tools. For our discussion, we will cover the high-level package
    d, used by Red Hat Enterprise Linux, CentOS, and Fedora. Other Red Hat-style distributions
    provide high-level tools with comparable features (see Table 14-2).


    Table 14.2 Debian-System Tools'
  merge: -1
  pgno: 184
- img_proc: true
  md: '# Table 14-2: Packaging system tools


    | Distributions | Low-level tools | High-level tools |

    |---|---|---|n| Debian style | dpkg | apt, apt-get, aptitude |

    | Fedora, Red Hat Enterprise Linux, CentOS | rpm | dnf, yum |


    #  Common Package Management Tasks


    Many operations can be performed with the command line package management tools.
    We will look at the most common. Be aware that the low-level tools also support
    the creation of package files, an activity outside the scope of this book.


    In the following discussion, the term `package_name` refers to the actual name
    of a package rather than `package_file`, which is the name of the file that contains
    the package. Also, before any package operations can be performed, the package
    repository needs to be queried so that the local copy of its database can be synchronized.
    Red Hat''s `dnf` program does this automatically and updates the local database
    if much time has elapsed since the last update. On the other hand, Debian''s `apt`
    program must be run with the `update` command to explicitly update the local database.
    This needs to be done every often. In the following examples, the `apt update`
    command is done before any operations, but in real life this needs to be done
    only every few hours to stay safe.


    Since operations that involve installing or removing software on a system-wide
    basis is an administrative task, user privileges are required regardless of the
    package management tool.


    #  Finding a Package in a Repository


    Using the high-level tools to search repository metadata, a package can be located
    based on its name or description (see Table 14-3).


    # Table 14-3: Package Search Commands


    | Style | Command(s) |

    |---|---|n| Debian | apt update

    apt search search_string |

    | Red Hat | dnf search search_string |


    > For example, to search a `dnf` repository for the emacs text editor, we can
    use this command:


    ```

    dnf search emacs

    ```


    #  Installing a Package from a Repository'
  merge: -1
  pgno: 185
- img_proc: true
  md: 'High-level tools permit a package to be downloaded from a repository and installed
    with full dependency resolution (see Table 14-4).


    # Table 14-4: Package Installation Commands


    | Style | Command |

    | --- | --- |

    | Debian | apt update<br>apt install package_name |

    | Red Hat | dnf install package_name |


    For example, to install the emacs text editor from an apt repository on a Debian
    system, we can use this command:


    ```

    apt update; apt install emacs

    ```


    # Installing a Package from a Package File


    If a package file has been downloaded from a source other than a repository, it
    can be installed directly (though without dependency resolution) using a low-level
    tool (see Table 14-5).


    # Table 14-5: Low-Level Package Installation Commands


    | Style | Command |

    | --- | --- |

    | Debian | dpkg -i package_file |

    | Red Hat | rpm -i package_file |


    For example, if the emacs-22.21-7.fc7-i386.rpm package file had been downloaded
    from a non-repository site, it would be installed this way:


    ```

    rpm -i emacs-22.21-7.fc7-i386.rpm

    ```


    > NOTE

    Because this technique uses the low-level rpm program to perform the installation,
    no dependency resolution is performed. If rpm discovers a missing dependency,
    rpm will exit with an error.


    # Removing a Package


    Packages can be uninstalled using either the high-level or low-level tools. Table
    14-6 shows the high-level tools.


    # Table 14-6: Package Removal Commands'
  merge: -1
