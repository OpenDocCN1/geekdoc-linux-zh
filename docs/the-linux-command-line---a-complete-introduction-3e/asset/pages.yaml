    # Secure Communication with Remote Hosts


    For years, Unix-like operating systems had the ability to be administered remotely
    via a network. In the early days, before the general adoption of the internet,
    there were a couple of popular programs used to log to remote hosts. These programs,
    however, suffer from the same fatal flaw that the ftp telnet program does; they
    transmit all their communications (including login names and passwords) in cleartext.
    This makes them wholly inappropriate for use in the internet age.


    # ssh


    To address this problem, a new protocol called Secure Shell (SSH) was developed.
    SSH solves the two basic problems of secure communication with a remote host.


    +   * It authenticates the remote host is who it says it is (thus preventing so-called
    man-in-the-middle attacks).

    * It encrypts all of the communications between the local and remote hosts.


    SSH consists of two parts. SSH server runs on the remote host, listening for incoming
    connections, by default, on port 22, while an SSH client is used on the local
    system to communicate with the remote server.

    Most distributions ship an implementation of SSH from the OpenBSD project. Some
    distributions include both the client and the server packages by default, while
    others supply only the client. To enable a system to receive connections, it must
    have the OpenSSH-server package installed, configured, and running, and (if the
    system either is running or is behind a firewall) it must allow incoming network
    connections on TCP port 22.


