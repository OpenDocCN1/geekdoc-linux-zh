    # The getopts Option


    The positional parsing code shown previously is a good solution to the task at
    hand, but it''s not the only approach we can take. There is a shell builtin getopts
    (not to be confused with the similarly named external command getopt) that can
    do some of the work for us. Each time getopts is called (usually in a loop), it
    returns the current argument in name and increments the counter OPTIND to point
    to the next positional parameter. If an option requires an argument, the argument
    is returned in the variable OPTARG.


    The getopts syntax var [ arg ]


    ```

    getopts optstring [arg ...]

    ```


    The optstring is a string consisting of the single character option names. getopts
    does not (easily) support long-format options. In addition, if an option name
    is followed by a colon, it means that the option requires an argument.


    While getopts supports only single-character option names, it does allow multiple
    options to be strung together without intervening hyphens, as we have seen with
    many commands as ls.


    ```

    ls -la

    ```


    If the optstring begins with a colon, getopts will silence its own error messages
    when there is an invalid option or missing required argument.


    The var argument is the name of a variable that will hold the current option name.


    Normally, getopts processes positional parameters, but it may also process any
    arguments after var.


    The getopts returns a successful exit status until it runs out of arguments to
    process.


    Yes, this seems a little complicated, but it becomes clearer when we see it in
    action. Using getopts, we can code a short demo of this alternative technique.


    ```

    #!/bin/bash


    # getopts-test: process command line options using getopts


    PROGNAME=$(basename "$0")

    interactive=

    filename=

    ```'
