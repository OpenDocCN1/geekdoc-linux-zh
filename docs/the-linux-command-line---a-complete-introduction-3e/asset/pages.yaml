  md: '# Summing Up


    In this chapter, we looked at a few of the many command line tools that operate
    on text. In the next chapter, we will look at several more. Admittedly, it may
    not seem immediately how or why you might use some of these tools on a day-to-day
    basis, though we have tried to show some practical examples of their use. We will
    find in later chapters that these tools form the basis of a tool set that is used
    to solve a host of practical problems. This will be particularly true when we
    get into shell scripting, where these tools will really show their worth.


    # Extra Credit


    There are a few more interesting text-manipulation commands worth investigating.
    Among these are `split` (split files into pieces), `csplit` (split files into
    pieces based on context), and `sdiff` (side-by-side merge of file differences).'
