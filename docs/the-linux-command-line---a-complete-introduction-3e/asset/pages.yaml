    We see that this expression does not match the line a 9 because it contains a
    non-alphabetic character; nor does it match abc because more than one space character
    separates the characters c and d.


    # )—Match an a Specific Number of Times


    The { and } characters are used to express minimum and maximum numbers of required
    matches. They may be specified in four possible ways, as outlined in Table 19-3.


    Table 19-3: Specifying the Number of Matches


    | Specifier | Meaning |

    | (n) | Match the preceding element if it occurs exactly $n$ times |

    | {n,m} | Match the preceding element if it occurs at least $n$ times but more
    than $n$ times |

    | {n,} | Match the preceding element if it occurs $n$ or more times |

    | {,m} | Match the preceding element if it occurs no more than $n$ times |


    Going back to our earlier example with the phone numbers, we can use this method
    of specifying repetitions to simplify our original regular expression


    ```

    ^([0-9]{2}-[0-9]{3}\)? [0-9]{2}-[0-9]{3}-[0-9]{2}-[0-9]{3}$

    ```


    to:


    ```

    ^([0-9]{3})\)? [0-9]{3}-[0-9]{4}$

    ```


    Let''s try.


    ```

    [me@linuxbox ~]$ echo "555 123-4567" | grep -E ''^([?[0-9]{3})\)? [0-9]{3}-[0-9]{4}$''

    ```


    555 123-4567


    ```

    [me@linuxbox ~]$ echo "555 123-4567" | grep -E ''^([?[0-9]{3})\)? [0-9]{3}-[0-9]{4}$''

    ```


    ```

    [me@linuxbox ~]$

    ```


    As we can see, our revised expression can successfully validate numbers both with
    without the parentheses, rejecting those numbers that are not properly formatted.'
