    The second used setting is the setgid bit (octal 2000), which, like the setuid,
    changes the effective group ID from the real group ID of the real user to that
    of the file owner. If the setgid is set on a directory, newly created files in
    the directory will be given the group ownership of the directory rather the group
    ownership of the file''s creator. This is useful in a shared directory when members
