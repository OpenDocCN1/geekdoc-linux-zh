  md: 'We saw an example of the subshell environment problem in Chapter 28 when we
    discovered that a read command in a pipeline does not work as we might intuitively
    expect. To recap, we construct a pipeline as follows, the content of the REPLY
    variable is always empty because the read command is executed in a subshell, and
    its copy of REPLY is destroyed when the subshell terminates.


    ```

    echo "foo" | read

    echo $REPLY

    ```


    Because commands in pipelines are always executed in subshells, any command that
    assigns variables will encounter this issue. Fortunately, the shell provides an
    exotic form of expansion called process substitution that can be used to work
    around this problem.


    Process substitution is expressed in two ways. For processes that produce standard
    output, it looks like this:


    ```

    $(list)

    ```


    Or, for processes that intake standard input, it looks like this:


    ```

    $(list)

    ```


    list is a list of commands.


    To solve our problem with read, we can employ process substitution like this:


    ```

    read <(echo "foo")necho $REPLY

    ```


    Process substitution allows us to treat the output of a subshell as an ordinary
    file for the purposes of redirection. In fact, it is a form of expansion, we can
    examine its real value.


    ```

    [me@linuxbox ~$] echo <(echo "foo")/dev/fd3

    ```


    By using echo to view the result of the expansion, we see that the output of the
    subshell is being provided by a file named dev/fd6. Here is an example of a read
    loop that processes the contents of a directory listing created by a subshell:


    ```

    #!/bin/bash

    ```


    ```

    # pro-sub: demo of process substitution


    while read -r attr links group size date time filename; do

    cat <<EOF_

    Filename: Filename

    Size: Ssize

    Owner: Sowner

    Group: Sgroup

    Modified: Sdate Time

    ```'
