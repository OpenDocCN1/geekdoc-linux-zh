    # THE META KEY


    If you venture into the Readline documentation, which can be found in the “readline”
    section of the bash man page, you will encounter the term meta key. On modern
    keyboards this maps to the ALT key, but it isn''t always so.

    Back in the dim times (before PCs after Unix), everybody had their own computer.
    What they might have had a device called a terminal. A terminal was a communication
    device that featured a text display screen and a keyboard and just enough to display
    text characters and move the cursor around. It was attached (by serial cable)
    to a larger computer or the communication network of a larger computer. There
    were many different brands of terminals, and they all had different keyboards
    and display feature sets. Since they all tended to at least understand ASCII,
    developers wanting portable applications wrote to the lowest common denominator.
    Unix systems had an elaborate way of dealing with terminals and their different
    display features. Since the developers of Readline could not be sure of the presence
    of a dedicated extra control key, they invented one and called it meta. While
    ALT serves as the meta key on modern keyboards, you can also press and release
    ESC to get the same effect as holding down ALT if you''re using a terminal (which
    you can still do in Linux!).


