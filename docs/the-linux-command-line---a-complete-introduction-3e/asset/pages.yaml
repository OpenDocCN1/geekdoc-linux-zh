  md: 'syntax for &&:


    ```

    command1 && command2

    ```


    Here is the syntax for || |:


    ```

    command1 || command2

    ```


    It is important to understand the behavior of these. With the && operator, command1
    is always executed and command2 is executed if, and only if, command1 is successful.
    With the || operator, command1 is always executed and command2 is executed if,
    and only if, command1 is unsuccessful.


    In practical terms, it means that we can do something like:


    ```

    [me@linuxbox ~]$ mkdir temp && cd temp

    ```


    This will create a directory named temp, and if it succeeds, the current working
    directory will be changed to temp. The second command is attempted only if the
    mkdir command is successful. Likewise, a command like


    ```

    [me@linuxbox ~]$ [[ -d temp ]] || mkdir temp

    ```


    will test for the existence of the directory temp, and only if the test fails
    will the directory be created. This type of construct is handy for handling errors
    in scripts, a subject we will discuss more in later chapters. For example, we
    could do this in a script:


    ```

    [ -d temp ]] || exit 1

    ```


    If the script requires the directory temp and it does not exist, then the script
    will terminate with an exit status of 1.


    Remember that a command can be a group command if we are feeling the urge to do
    something complicated.


    ```

    { true && echo "true"; } && { false || echo "false"; }

    ```


    Group commands return the status of the last command in the group.


