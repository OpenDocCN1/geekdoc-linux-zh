    The :iw command may also specify an optional filename. This acts like "Save As."
    For example, if we were editing foo.txt and wanted to save an alternate version
    called fool.txt, we would enter the following:


    ```

    :iw foo.txt

    ```


    While this command saves the file under a new name, it does not change the name
    of the file we are editing. As we continue to edit, we will still be editing foo.txt,
    not fool.txt.


    # Bash Does vi Too


    In Chapter 8 we looked at the various ways we could edit the contents of the command
    line. The particular editing commands that bash uses are not arbitrary. They are
    inspired by the emacs text editor. This is the default in bash, but bash also
    supports vi-style command line editing. This feature is easily activated with
    the following command:


    ```

    me@linuxbox~\$ set -o vi

    ```


    Once this done, we can use the vi-style editing commands we have learned. Let''s
    try it. At the command prompt type the following example:


    ```

    me@linuxbox~\$ the quick brown fox jumps over the lazy dog

    ```


    We can move the cursor with the arrow keys as before, and we can type characters
    in the normal way. It behaves this way because we start a new command line, the
    editor is in insert mode and behaves as vi does. To get to the cool stuff, we
    have to switch to normal mode. We exit insert mode by pressing ESC. All the movements
    yank, delete, and paste work as if we are editing a one-line text file in vim.
    To return to insert mode, use the appropriate normal mode command such as i or
    a.


    Setting bash to vi-style command line editing is a great way to reinforce our
    keyboard skills, and it has added benefit of reducing the number of editing commands
    we have to remember. Give it a try. To make it permanent, we can add the set -o
    vi command to our .bashrc


    To return to the emacs-style editing mode, enter this command:


    ```

    me@linuxbox~\$ set -o emacs

    ```


    Many online tutorials are available for this feature, but be aware that most will
    use the traditional vi mode names (command, insert, and ex) rather than vim''s
    (normal, insert, and'
