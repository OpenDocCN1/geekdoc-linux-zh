  md: '# # Creating an Array


    Array variables are named just like other bash variables and are created automatically
    when they are accessed. Here is an example:


    ```

    me@linuxux ~$j a[1]=foo

    me@linuxux ~$j echo $${a[1]}

    ```


    We see an example of both the assignment and access of an array element. With
