  md: "The interesting part of the script is how it determines whether an integer\
    \ is even or odd. By performing a modulo 2 operation on the number, which divides\
    \ the number by 2 and returns the remainder, it can tell whether the number is\
    \ odd or even.\n\n# A More Modern Version of test\n\nModern versions of bash include\
    \ a compound command that acts as an enhanced replacement for test. It uses the\
    \ following syntax, like test, expression is an expression that evaluates to either\
    \ a true or false result:\n\n```\n[[ expression ]]\n```\n\nThe [[ ]] command is\
    \ similar to test (it supports all of its expressions) but adds an important new\
    \ string expression.\n\n```\nstring1 =~ regex\n```\n\nThis returns true if string1\
    \ is matched by the extended expression regex. This opens up a lot of possibilities\
    \ for performing tasks such as data validation. In our earlier example of the\
    \ integer expressions, the script would fail if the constant contained anything\
    \ except an integer. The script needs a way to verify that the constant contains\
    \ an integer. Using [[ ]] with the =~ string operator, we could improve this script\n\
    \n```\n# test-integer2: evaluate the value of an integer.\n```\n\n```\nINT=-5\n\
    \nif [[ \"SINT\" =~ ^[0-9]+$ ]]; then\n  if [ \"SINT\" -eq 0 ]; then\n    echo\
    \ \"INT is zero.\"\n  else\n    if [ \"SINT\" -lt 0 ]; then\n      echo \"INT\
    \ is negative.\"\n    else\n      echo \"INT is positive.\"\n    fi\n    if [\
    \ $((SINT % 2)) -eq 0 ]; then\n      echo \"INT is even.\"\n    else\n      echo\
    \ \"INT is odd.\"\n    fi\n  fi\nelse\n  echo \"INT is not an integer.\" >&2\n\
    \  exit 1\n```"
