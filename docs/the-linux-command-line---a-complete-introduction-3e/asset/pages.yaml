  md: '# # 9

    # PERMISSIONS


    ![](img/58edd539af3a70704734cedc1ac0c271_109_0.png)


    Operating systems in the Unix tradition differ from those in the MS-DOS tradition
    in that they are not only multitasking systems but also multiuser systems.


    What exactly does this mean? It means that more than one person can be using the
    computer at the same time. While a typical computer will likely have only one
    keyboard and monitor, it can still be used by more than one user. For example,
    if a computer is attached to a network or the internet, remote users can log in
    via ssh (secure shell) and operate the computer. In fact, remote users can execute
    graphical applications and have the graphical output appear on a remote display.


    The multiuser capability of Linux is a feature that is deeply embedded into the
    design of the operating system. Considering the environment in which Unix was
    created, this makes perfect sense. Years ago, before computers were “personal,”
    they were large, expensive, and centralized. A typical university computer system,
    for example, consisted of a large central computer located in one building and
    terminals that were located throughout the campus, connected to the large central
    computer. The computer would support many users at the same time.


    To make this practical, a method had to be devised to protect the users from each
    other. After all, the actions of one user could not be allowed to crash the computer,
    nor could one interfere with the files belonging to another user.


    For modern computer users, this multiuser capability is still important even for
    a single-user system as it allows a user to operate the computer with greater
    safety because system-level modifications can be performed only by a separate
    administrative account.


    In this chapter, we will look at this essential part of system security and introduce
    the following commands:


    +   - Display user identity.'
  merge: -1
  pgno: 109
- img_proc: true
  md: 'chmod Change a file''s mode.


    umask Set the default file permissions.


    su Run a shell as another user.


    sudo Execute a command as another user.


    chown Change a file''s owner.


    chgrp Change a file''s group ownership.


    addgroup Add a user or a group to the system.


    usermod Modify a user account.


    passwd Change a user''s password.


    # Users, Group Members, and Everybody Else


    When we were exploring the system in Chapter 3, we may have encountered a problem
    when trying to examine a file as /etc/shadow.


    ```

    [me@linuxbox ~js file /etc/shadow

    /etc/shadow: regular file, no read permission

    [me@linuxbox ~js less /etc/shadow

    /etc/shadow: Permission denied

    ```


    The reason for this error message is, as regular users, we do not have permission
    to read this.


    In the Unix model, a user may own files and directories. When a user owns a file
    or directory, the user has control over it. Users, in turn, belong to a group
    consisting of one or more users who have access to files and directories by their
    owners. In addition to granting access to a group, an owner may also grant some
    of access rights to everybody, which are called others (sometimes referred to
    as the world). To find information about our identity, we use the `id` command.


    ```

    [me@linuxbox ~js id

    uid=508(me) gid=508(me) groups=508(me)

    ```


    Let''s look at the output. When accounts are created, users are assigned a number
    called user ID (uid), which is, for the sake of the humans, mapped to a username.
    The user is assigned a primary group ID (gid) and may belong to additional groups.
    The previous example is from a Fedora system. On other systems, such as Ubuntu,
    the output may look like little different.


    ```

    [me@linuxbox ~js id

    uid=1088(me) gid=1088(me)

    groups=4(adn),28(dialout),24(cdrom),25(floppy),29(audio),30(dip),44(video),46(plugdev),

    108(lpadmin),114(admin),1088(me)

    ```'
  merge: -1
