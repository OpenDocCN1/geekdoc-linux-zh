    # Metacharacters and Literals


    While it may not seem apparent, grep searches using regular expressions all, albeit
    very simple ones. The regular expression bzip is taken to mean that a match will
    occur only if the line in the files contain at least four characters and that
    somewhere in the line the characters b, z, i, and p are found in that order, with
    no other characters between. The characters in the string bzip are all literal
    characters, in that they match themselves. In addition to literals, regular expressions
    may also include metacharacters that are used to specify more complex searches.
    Regular expression metacharacters consist of the following:


    ```

    ^ $ . [ } ] ? * ( ) \

    ```


    All other characters are considered literals, though the backslash character is
    used in a few cases to create meta sequences, as well as allowing the metacharacters
    to be escaped and treated as literals instead of being interpreted as metacharacters.


    # NOTE


    As we can see, many of the regular expression metacharacters are also characters
    that have meaning to the shell when expansion is performed. When we pass regular
    expressions containing metacharacters on the command line, it is vital that they
    be enclosed in quotes to'
