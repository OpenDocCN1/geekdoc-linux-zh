    ```


    `pattern` is a wildcard pattern like those used in pathname expansion. The difference
    between two forms is that the # form removes the shortest match, while the ##
    form removes the longest match.


    ```

    me@linuxbox ~$ foo=file.txt.zip

    me@linuxbox ~$ echo ${foo#.*}

    me@linuxbox ~$ echo ${foo##.*}

    ```


    The following are the same as the previous # and ## expansions, except they remove
    text from the end of the string contained in `parameter` rather than from the
    beginning:


    ```

    $$(parameter%pattern)

    $(parameter%%pattern)

    ```


    Here is an example:


    ```

    me@linuxbox ~$ foo=file.txt.zip

    me@linuxbox ~$ echo ${foo%%.*}

    me@linuxbox ~$ echo ${foo%%.*}

    ```


    These expansions perform a search-replace operation on the contents of `parameter`:


    ```

    $$(parameter/pattern/string)

    $(parameter//pattern/string)

    $(parameter#pattern/string)

    $(parameter##pattern/string)

    ```


    If text matching wildcard `pattern`, it is replaced with the contents of `string`.
    In the normal form, only the first occurrence of `pattern` is replaced. In the
    // form, all occurrences are replaced. The # form requires that the match to occur
    at the beginning of the string, and the ## form requires the match to occur at
    the end of the string. In every form, `/string` may be omitted, causing the text
    matched by `pattern` to be deleted.'
