  md: 'If the file ''~/.bashrc` exists, then read the `~/.bashrc` file.


    We can see that this bit of code is how a login shell gets the contents of `.bashrc`.
    The next thing in our startup file has to do is the PATH variable.


    Ever wonder how the shell knows to find commands when we enter them on the command
    line? For example, when we enter `ls`, the shell does not search the entire computer
    to find `/bin/ls` (the full pathname to the `ls` command); rather, it searches
    a list of directories that are contained in the PATH variable.


    The PATH variable is often (but not always, depending on the distribution) set
    by the `.bash_profile` startup file with this code:


    ```

    PATH=$PATH:$HOME/bin

    ```


    PATH is modified to add the `$HOME/bin` to the end of the list. This is an example
    of parameter expansion, which was touched on in Chapter 7. To demonstrate how
    this works, try the following:


    ```

    @@@linuxbox -ls foo="this is some"

    @@@linuxbox -ls echo Sfoo

    This is some

    @@@linuxbox -ls foo=Sfoo.text."

    @@@linuxbox -ls echo Sfoo

    ```


    This is some text.


    Using this technique, we can append to the end of a variable''s contents.

    By adding the string `$HOME/bin` to the end of the PATH variable''s contents,
    the directory `$HOME/bin` is added to the list of directories searched when a
    command is entered. This means that when we want to create a directory within
    our home directory for storing our own programs, the shell is ready to accommodate
    us. All we have to do is call it `bin`, and we''re ready to go.


    > NOTE

    Many distributions provide this PATH setting by default. Debian-based distributions,
    such as Ubuntu, text for the existence of the ~~/bin directory at login and dynamically
    add it to the PATH variable if the directory is found.


    Finally, we have:


    ```

    export PATH

    ```


    The export command tells the shell to make the contents of PATH available to child
    processes of this shell. In a sense, it converts a shell variable into an environment
    variable.


