  md: 'If you look at the output of the free command, which displays statistics about
    memory usage, you will see a statistic called buffers. Computer systems are designed
    to go as fast as possible. One of the impediments to system speed is slow devices.
    Printers are a good example. The fastest printer is extremely slow by computer
    standards. A computer would be very slow if it had to stop and wait for a printer
    to finish printing a page. In the early days of PCs (before multitasking), this
    was a real problem. If you were working on a spreadsheet or text document, the
    computer would send the data to the printer as fast as it could accept, but it
    was slow since printers aren''t very fast. This problem was solved by the advent
    of the printer buffer, a device containing some RAM memory that would sit between
    the computer and the printer. With the buffer in place, the computer would send
    the printer output to the buffer, and it would quickly be stored in the RAM so
    the computer could go back to working without. Meanwhile, the printer buffer would
    slowly spool the data from the printer''s memory at the speed at which the printer
    could accept it.


    This idea of buffering is used extensively in computers to make them faster. Don''t
    let the need to occasionally read or write data to slow devices impede the speed
    of the system. Operating systems store data that has read from and to be written
    to storage devices in memory for as long as possible actually having to interact
    with the slower device. On a Linux system, you will notice that the system fills
    up memory the longer it is. This does not mean Linux is "using" all the memory;
    it means Linux is taking advantage of all the available memory to do as much buffering
    as it can.


    This buffering allows writing to storage devices to be done very quickly because
    writing to the physical device is deferred to a future time. In the meantime,
    the data destined for the device is piling up in memory. From time to time, the
    operating system will write this data to the physical device.


    Unmounting a device entails writing the remaining data to the device so that it
    can be safely removed. If the device is removed without unmounting first, the
    possibility exists that not all the data for the device has been transferred.
    In some cases, this data may include vital directory updates, which will lead
    to filesystem corruption, one of the worst things that can happen on a computer.


    # Determining Device Names


    It''s sometimes difficult to determine the name of a device. In the old days,
    it wasn''t hard. A device was always in the same place, and it didn''t change.
    Unix-like systems work like that, but changing a disk drive involves using a forklift
    to remove a washing machine-sized device from the computer room. In recent years,
    the typical desktop hardware configuration has become quite dynamic, and Linux
    has evolved to become more flexible than its ancestors.


    In the previous examples, we took advantage of the modern Linux desktop''s ability
    to'
  merge: -1
