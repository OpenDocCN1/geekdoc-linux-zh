    # uniq


    Compared to sort, the uniq is lightweight. uniq performs a seemingly trivial task.
    When given a sorted file (or standard input), it removes any duplicate lines and
    sends the results to standard output. It is often used in conjunction with sort
    to clean the output of duplicates.


    > While uniq is a traditional Unix tool often used with sort, the GNU version
    of sort supports a -u option, which removes duplicates from sorted output.


    Let''s make a file to try this, as shown here:


    ```

    [melinuxbox ~$] cat > foo.txt

    a

    b

    c

    a

    b

    c

    ```'
