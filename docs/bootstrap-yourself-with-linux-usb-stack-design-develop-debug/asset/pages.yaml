  md: '# CHAPTER 12


    # PERIPHERAL DEVICE

    CONTROLLER DRIVER


    In This Chapter


    +   - Bootstrap Essentials: Platform Driver

    - Linux USB Peripheral Controller Driver

    - USB Device Controller Driver


    On the Linux USB gadget subsystem, the USB peripheral device controller (PDC)
    driver is the lowest driver layer and is closer to the hardware. This layer interacts
    with the USB PDC hardware and extends the hardware features to other driver layers.
    Thus, it acts as an interface for the USB driver layers and the platform drivers
    to control the USB device controller. You need to have a complete understanding
    of the USB PDC and the platform to develop the USB driver.


    Interestingly, the USB PDC driver performs minimal tasks that are USB specific,
    most of the USB-specific tasks are done in either the hardware or the USB layers
    above the PDC driver. Therefore, the functionality of the USB PDC driver is similar
    to any other kernel module that interacts directly with the hardware. Depending
    on the platform setup, a USB device controller is connected to the platform hardware
    through any of the different interfaces available in the platform. The PDC driver
    uses the platform driver framework or the PCI driver framework as the base to
    develop the driver.


    149'
