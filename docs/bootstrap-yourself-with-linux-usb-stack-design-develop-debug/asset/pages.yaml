    # # USB DEVICE CONTROLLER DRIVER


    From the preceding discussion, you know that the PDC driver acts like a hardware
    abstraction layer to export the hardware functionalities to the layers above.
    To develop this layer, you need a thorough understanding of the USB device controller
    and the way the device controller hardware is interfaced with the platform. The
    example setup uses the Renesas USB controller. This section details the development
    based on this driver, which is already in Linux, so you can easily reference the
    source.


    You can start the PDC driver with a data structure that represents the device
    controller to the other layers when the PDC driver is successful. This data structure
    generally contains member variables to represent the gadget data structure, members
    to represent the endpoints, and other resources of the device controller. The
    `struct r8a66597` defined in `<drivers/usb/gadget/r8a66597-udc.h>` is used in
    the example setup to represent the `r8a66597` USB device controller.


    From the data structure, notice that the `struct r8a66597` stores gadget, endpoint,
    and other resource details. This data structure can also hold information specific
    to your implementation, which you need in the other gadget drivers. An object
    of this data structure is passed across the USB gadget driver to manipulate.'
