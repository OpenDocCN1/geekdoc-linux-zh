- pgno: 274
  md: '# Chapter 18 = Debugging Using Linux USB


    ![](img/779a74a6577501a55983f193067274a3_274_0.png)


    Figure 18.2

    USB Monitor in kernel configuration.


    The drivers/usb/mon/ directory of the kernel contains the usmon implementation.
    The module implements a binary mon_bin.c and a text mon_text.c version of USB
    monitoring, interfaced through a main file mon_main.c. The main file also handles
    initialization and other interface functionalities with the usbcore. You can find
    the key data structures for this module in the header file usb_mon.h. In addition,
    drivers/usb/core/hcd.h contains a couple of interface declarations that facilitate
    the interaction between the usbcore and the usmon.


    The usmon module is a developer tool that captures USB Request Block (URB) activity
    between the peripheral drivers and the host controller drivers. This monitoring
    functionality consists of a kernel part that hooks the USB transfers and a user
    space part that provides access to the hooked information. From the earlier discussion,
    you know that the kernel portion of the usmon has two implementations: a raw binary
    version and a text version. This chapter focuses only on the text version of the
    kernel implementation because it provides a good start to understanding USB monitoring
    and covers most of the debugging requirement. From now on, any reference to usmon
    refers to the text version of the kernel implementation.'
  merge: -1
  img_proc: true
- pgno: 275
  md: '# Bootstrap: USB Monitor


    The usbmon operates like any other character device: it extends its resources
    (the hooked information) through file operations support. Therefore, the key data
    structures of the usbmon implementation are the file operation interfaces and
    the data structure to store hooked data. For a USB developer, it is unnecessary
    to look into the implementation details of this module, because there is no practical
    requirement to modify this code during development. To expand your understanding
    of this module and subsequently add features to the module, refer to the “More
    Reading” section at the end of this chapter, which points to additional documentation.


    The drivers/usb/mon/mon_text.c file defines the data structure mon_event_text
    that maps the URB information when any one of the following events takes place
    in the host controller driver: a URB is submitted, a URB is completed, or an error
    occurs. After carefully mapping this URB event information to the struct mon_event_text,
    you can perform the read operation to access it. Understanding this data structure
    helps to analyze the information.


    ```

    struct mon_event_text {

    ```


    Multiple URB events typically occur before a read operation from the user space.
    The e_link variable maintains a list of such events for future reading.


    ```

    struct list_head  e_link;

    ```


    The next member, type, indicates the type of URB operation that occurred. The
    three possible operations are submit, complete, or error, with values of S, C,
    or E, respectively.


    ```

    int type;

    ```


    Each event is provided with an ID and is the pointer address of the member variable
    id. The ID in this case is the address of the URB.


    ```

    unsigned long id;

    ```


    The next member variable in the data structure, timestamp, collects the time of
    URB activity.


    ```

    unsigned int timestamp;

    ```


    The busnum member variable indicates the USB bus in which the URB event took place.
    The Linux kernel assigns a unique number to each USB bus, starting from 1.


    ```

    int busnum;

    ```'
  merge: -1
  img_proc: true
- pgno: 276
  md: '# Chapter 18 = Debugging Using Linux USB


    The devnum member variable indicates the device for which URB event took place.
    The Linux kernel assigns a unique number to each USB device, starting from 1.


    ```

    char devnum;

    ```


    The epnum member variable indicates the endpoint to which the URB is processed.
    The endpoint value starts from 0.


    ```

    char epnum;

    ```


    The next variable, is_in, represents the direction of the URB event, with true
    indicating an IN USB transfer and false indicating an OUT USB transfer.


    ```

    char is_in;

    ```


    The next variable, xtype, represents different transfer types available on USB.
    The variable can hold B, I, Z, or C, representing bulk, interrupt, isochronous,
    and control transfers, respectively.


    ```

    char xtype;

    ```


    The next member, length, maps the length of data transferred in the URB. The could
    be the actual buffer length or the transferred length.


    ```

    int length;

    ```


    The next member, status, indicates the status of URB transfer. This field is valid
    for nonisochronous URB transfers. The return status is based on the values defined
    in include/linux/errno.h.


    ```

    int status;

    ```


    The interval member variable indicates the transfer period for time-bounded transfers
    as interrupt and isochronous transfers. The interval is based on the device configuration.


    ```

    int interval;

    ```


    The next member, start_frame, is specific to isochronous transfers and indicates
    the initial frame of the isochronous transfer.


    ```

    int start_frame;

    ```


    The member variable, error_count, is also specific to isochronous transfers and
    indicates the number of errors in the isochronous transfer.


    ```

    int error_count;

    ```'
