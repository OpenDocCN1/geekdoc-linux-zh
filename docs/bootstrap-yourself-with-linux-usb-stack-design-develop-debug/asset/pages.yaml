- pgno: 101
  md: '# CHAPTER 7


    # POWER MANAGEMENT


    In This Chapter


    +   - Bootstrap Essentials: Power Management

    - Linux USB Power Management

    - Setting up Linux-USB Power Management


    Power management is one of the key requirements for any embedded system. The USB
    specification defines power management methodologies for both universal serial
    bus (USB) devices and the USB host. A USB device saves power by going into suspended
    mode globally or at the interface level. The suspend occurs when there is no bus
    activity or sometimes depends on device class implementations. To resume a suspended
    host, the USB device may use remote wakeup. Not all devices support remote wakeup;
    that capability is passed on to the host with the configuration descriptor.


    The USB host power management depends greatly on the host system software’s (Microsoft
    Windows and Linux) power management framework. The Linux kernel implements the
    necessary power management framework that enables peripheral subsystems as the
    Linux USB system to effectively manage power. This chapter starts with a quick
    bootstrap on Linux power management, subsequently explores the Linux USB host
    subsystem’s power management internals and sequence of activities, and finally
    provides a practical session on its usage.'
  merge: -1
  img_proc: true
- pgno: 102
  md: '# BOOTSTRAP ESSENTIALS: POWER MANAGEMENT


    Linux power management has two different models for power management: the system
    sleep model and the runtime power management model. In the system sleep model,
    the complete system goes to a low power model by interacting with various buses,
    devices, or class drivers. Individual drivers can also go into power save mode
    when the system is running, which is referred to as runtime power management.


    The power management occurs in different phases, each having separate callbacks
    to be executed before starting the next phase. The phases involve bus, device,
    and class driver callbacks (dev->bus->pm, dev->type->pm, dev->class->pm). During
    a suspend operation, the callbacks are invoked in the following order: class,
    device, and then bus. During resume, the order of callbacks is reversed as bus,
    device, and then class. The following section explores these power management
    operations and utility functions, which are essential for subsequent Linux USB
    understanding.


    The first important data structure that registers power management callbacks is
    struct dev_pm_ops, which is defined in include/linux/pm.h of the kernel source
    package. The drivers that implement power management use this data structure.


    # Note


    It is not mandatory to implement every callback.


    ```

    struct dev_pm_ops {

    int (*prepare)(struct device *dev);

    void (*complete)(struct device *dev);

    int (*suspend)(struct device *dev);

    int (*resume)(struct device *dev);

    int (*freeze)(struct device *dev);

    int (*thaw)(struct device *dev);

    int (*poweroff)(struct device *dev);

    int (*restore)(struct device *dev);

    int (*suspend_noirq)(struct device *dev);

    int (*resume_noirq)(struct device *dev);

    int (*freeze_noirq)(struct device *dev);

    int (*thaw_noirq)(struct device *dev);

    int (*poweroff_noirq)(struct device *dev);

    int (*restore_noirq)(struct device *dev);

    ```'
  merge: -1
  img_proc: true
- pgno: 103
  md: '# Bootstrap Essentials: Power Management


    ```

    int (*runtime_suspend)(struct device *dev);

    int (*runtime_resume)(struct device *dev);

    int (*runtime_idle)(struct device *dev);

    );

    ```


    The struct dev_pm_ops also includes the device runtime power management callbacks,
    which you can use at the driver level to manage power.


    # Note


    The new runtime power management framework was introduced only in 2.6.32 of the
    kernel.


    +   - int (*runtime_suspend)(struct device *dev)

    nThe runtime_suspend callback takes the device to a low-power suspended mode that
    stops communicating with the system. The runtime_suspend can be executed only
    for active devices.


    +   - int (*runtime_resume)(struct device *dev)

    The runtime_resume callback resumes the suspended device to a normal state. You
    can execute the runtime_resume only for suspended devices. Generally, the subsystem
    runtime callback is responsible for resuming the device appropriately even without
    the runtime_resume.


    +   - int (*runtime_idle)(struct device *dev)

    The runtime_idle callback sets devices appearing to be inactive to a low-power
    suspended mode that stops communicating with the system. When runtime_suspend
    callback is executed for a device, the runtime_idle callback will not be executed
    for the same device.


    The power management framework also defines wrapper functions to interface with
    the device power management callback operations. These interface functions are
    defined in the include/linux/pm_runtime.h header file and exported from drivers/base/power/runtime.c.
    Some of the key interface functions of power management are listed here.


    +   - nt pm_runtime_suspend(struct device *dev)

    The pm_runtime_suspend method suspends the device passed on by invoking the runtime_suspend
    callback. It returns 0 when successful and appropriate error codes such as -EBUSY
    based on the device state.'
  merge: -1
  img_proc: true
- pgno: 104
  md: '+   int pm_runtime_resume(struct device *dev)


    The pm_runtime_resume method resumes the device passed on by invoking the pm_runtime_resume
    callback. It returns 0 when successful and appropriate error codes as -EAGAIN
    based on the device state.


    +   int pm_runtime_idle(struct device *dev)


    The pm_runtime_idle method notifies to suspend the device by invoking the pm_runtime_idle
    callback. It returns 0 when successful and appropriate error codes as -EINPROGRESS
    based on the device state.


    +   void pm_runtime_enable(struct device *dev)


    When the device starts, the runtime power management is disabled for all devices.
    The pm_runtime_enable method enables runtime power management for the device by
    decrementing the disable_depth field of power management info data structure.


    +   void pm_runtime_disable(struct device *dev)


    The pm_runtime_disable method disables runtime power management for the device
    and cancels all pending power management operations. Internally, the method increments
    the disable_depth field of power management info data structure to note the disable
    call.


    +   nt pm_runtime_set_active(struct device *dev)


    The pm_runtime_set_active method sets the status of the device and its children
    to power management active status. This method is unsuccessful when the runtime
    error and disable depth fields of device info are not 0 or when the device''s
    parent is not active and has set the Ignore Children field. In such a case, the
    method returns an appropriate error code as -EAGAIN or -EBUSY to indicate the
    state of the device.


    Another important data structure of the power management framework is struct dev_pm_info,
    which holds key power management framework-related information. The device data
    structure adds this power management info data structure as a member. One of the
    most often-used members is the runtime usage_count, which holds information about
    whether a callback can be executed.'
  merge: -1
  img_proc: true
