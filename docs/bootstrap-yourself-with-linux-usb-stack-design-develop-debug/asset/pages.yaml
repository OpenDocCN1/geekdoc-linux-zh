  md: '# Chapter 18 Debugging Using Linux USB


    feature is part of usbcore, Figure 18.9 illustrates the feature outside the usbcore
    to better represent its role between usbfs and usbcore.


    In the uscore, the /drivers/usb/core/devio.c file elements implement the usbfs
    file operations, an ideal location for usbfs_snoop to snoop URB operations and
    URB status information. The snoop_urb routine implemented in the devio.c handles
    this snoop activity.


    ```

    static void snoop_urb(struct usb_dev *udev, void __user *userb, int pipe, unsigned
    long length, int timeout_or_status, enum snoop_when when)

    ```


    The uscore module defines the module parameter static int usbfs_snoop; in devio.c.
    This module allows the user to configure and control the usbfs_snoop feature at
    runtime. To configure this usbfs_snoop parameter, the user should have the necessary
    privileges to update the parameter file.


    ```

    static int usbfs_snoop;

    module_param(usbfs_snoop, bool, S_IRUGO | S_IWUSRS);

    MODULE_PARM_DESC(usbfs_snoop, "true to log all usbfs traffic");

    ```


