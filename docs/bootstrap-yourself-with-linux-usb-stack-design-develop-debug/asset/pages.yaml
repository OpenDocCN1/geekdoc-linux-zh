    You can use blocking_notifier_chain_unregister, provided by the notifier framework,
    to remove the registered struct notifier_block callback from the list head:


    ```

    int blocking_notifier_chain_unregister(struct blocking_notifier_head *nh, struct_notifier_block
    *nb);

    ```


    Once you have successfully created the notifier chain, the callbacks have to be
    executed when a particular event occurs. The blocking_notifier_call_chain interface
    function calls the registered callback functions. This interface function takes
    the notifier head and traverses it to call the registered functions. With the
    other parameter, void pointer *v, is passed to the subscriber with an unsigned
    long val to indicate the type of event:


    ```

    int blocking_notifier_call_chain(struct blocking_notifier_head *nh, unsigned long
    val, void *v);

    ```


