  md: '# Chapter 13


    # Gadget Driver


    ![](img/779a74a6577501a55983f193067274a3_192_0.png)


    Figure 13.5

    Sequence of activities triggered during suspend and resume.


    # Power Management


    The gadget driver framework extends interfaces to pass on USB power management
    events, such as suspension and resumption of bus activity. Figure 13.5 illustrates
    the sequence of activity that passes on the suspend and resume events.


    The PDC driver receives the USB suspend and resume events through interrupts and
    passes them on to the gadget driver. The gadget driver invokes the callbacks suspend
    and resume of the struct usb_gadget_driver, which passes on the events to the
    class driver.


    # OUT Transfer


    When the USB enumeration is successful with a set interface, the USB gadget subsystem
    goes to a receive state. Figure 13.6 illustrates the sequence of activity that
    occurs during an OUT transfer.'
