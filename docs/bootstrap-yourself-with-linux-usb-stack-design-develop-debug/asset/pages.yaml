- pgno: 159
  md: '# CHAPTER 11


    # LINUX USB GADGET DRIVER


    In This Chapter


    +   - Overview of USB Device Stack Architecture

    - Overview of Linux USB Gadget Driver Architecture


    The universal serial bus (USB) host-device relationship is master/slave, which
    means the host controls the communication, and the device responds to the host’s
    request. Thus, the USB device implementation is simpler than the USB host implementation.
    This chapter starts with a software architecture overview of a generic USB device
    stack. This enables you to understand different layers and requirements of a USB
    device stack. The subsequent sections of the chapter explore the Linux USB gadget
    architecture, providing an overview of the gadget stack.


    # OVERVIEW OF USB DEVICE STACK ARCHITECTURE


    The USB device controller hardware implements the physical and link layers. The
    USB softwaresystems takes care of the rest of the functionality, which includes
    USB protocol and device functionality. In general, you can visualize a USB device
    stack as a simple three-layer implementation containing a firmware driver for
    the USB device controller, a USB device driver generally known as Chapter—9 implementation,
    and a USB class driver layer.'
  merge: -1
  img_proc: true
- pgno: 160
  md: '![](img/779a74a6577501a55983f193067274a3_160_0.png)


    Figure 11.1

    A generic USB device software architecture.


    Figure 11.1 illustrates a typical USB device software stack architecture. It consists
    of three major parts: a device firmware driver, a Chapter—9 driver, and a USB
    class driver.


    # Device Firmware Driver


    The device firmware driver implements hardware-specific routines that allow access
    to the registers, memory space, and interrupts. Generally, the registers help
    configure the device endpoints, control the interrupts, and control the USB activity.
    The firmware driver exports the facilities that the USB controller provides to
    the upper layers. The device firmware layer is specific to the controller for
    which the firmware driver is written. The firmware driver can also implement service
    routines for the USB interrupts and interrupt events.


    # Chapter—9: Driver/USB Device Framework


    The USB device framework, or the Chapter—9 driver, acts as an interface between
    the upper class drivers and the endpoints in the device controller through the
    firmware driver. This layer also implements the state machine defined by the USB
    specification during the enumeration process. Thus, the typical functions of this
    layer are to support the USB enumeration process and to transfer data from the
    upper layers.


    # USB Class Driver


    The USB class driver layer implements the application functionality of the device,
    which is generally independent of the USB protocol. This layer is'
  merge: -1
