    \ The HCD framework also integrates the USB host controller to the platform. That’s\
    \ why the framework includes the necessary functionality to integrate the USB\
    \ controller with the platform. Most of the HCDs are developed based on the platform\
    \ driver framework. Check out Chapter 12, “Peripheral Device Controller Driver,”\
    \ to understand the basics of the platform driver framework. This section explores\
    \ the essential HCD data structures and interface methods.\n\nThe essential data\
    \ structures for the HCD driver are struct hc_driver and struct usb_hcd, which\
    \ are defined in include/linux/usb/hcd.h.\n\nThe struct hc_driver structure has\
    \ methods that serve as an interface between the uscore and the HCD. The data\
