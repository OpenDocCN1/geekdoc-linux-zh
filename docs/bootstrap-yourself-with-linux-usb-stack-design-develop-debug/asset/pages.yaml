    \ A device supporting this feature must inform the USB host through the USB descriptors.\
    \ If the operation is successful, 0 is returned; if the operation fails, a negative\
    \ value is returned.\n\n+   * (*self_powered)(struct usb_gadget *, int is_selfpowered)\n\
    This callback method sets the device as self-powered. Interface functions usb_gadget_set_self_powered\
    \ and usb_gadget_clear_self_powered enable and disable the device to and from\
    \ the self-powered state, respectively. This operation affects the device status\
    \ and is indicated by the peripheral device controller (PDC) driver. If the operation\
    \ is successful, 0 is returned; if the operation fails, a negative value is returned."
