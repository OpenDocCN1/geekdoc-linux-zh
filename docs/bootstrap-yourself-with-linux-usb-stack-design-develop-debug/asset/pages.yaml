- pgno: 193
  md: '# Gadget Driver: Design


    ![](img/779a74a6577501a55983f193067274a3_193_0.png)


    **Figure 13.6**

    Sequence of activities in USB OUT transfer.


    Once the configuration is successful, the class driver prepares itself for data
    transfer. It allocates the necessary buffer and requests a struct usb_request
    object; subsequently, it queues it to the gadget framework using usb_ep_queue.
    The class driver is aware of the size of data expected and sees it as part of
    the struct usb_request it submits to the gadget framework where it is queued.
    The gadget framework receives the data requested as part of the interrupt routine.
    Once the data that''s requested is collected, the control is passed back to the
    class driver through a complete routine. The struct usb_request now holds the
    data received, actual read data, and the state of the request. The class driver
    then extracts the information from the request and processes it.'
