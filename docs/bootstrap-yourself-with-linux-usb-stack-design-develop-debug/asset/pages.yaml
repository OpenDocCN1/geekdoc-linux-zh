  md: '# USB SYSTEM ARCHITECTURE


    A USB system can be divided into three major areas: the USB device, the USB host,
    and the USB interconnect. The USB device refers to the physical entity that performs
    the required function. The USB host system refers to the system that installs
    the host controller to interface with the devices. Finally, the interconnect refers
    to the manner in which USB devices are connected to and communicate with the host.


    Figure 2.3 from the USB specification (Figure 5-9: USB Host/Device Detailed View)
    illustrates in detail the relationship between a USB host and a USB device. If
    you closely watch the blocks, you''ll notice three layers make up the USB system.


    The three layers—the functional layer, the USB device layer, and the USB interface
    layer as represented in the figure—are common for both the USB interface layer


    ![](img/779a74a6577501a55983f193067274a3_31_0.png)


