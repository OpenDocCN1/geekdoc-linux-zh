    The usbfs file creates two types of files. The first file is devices, which contains
    the information of all USB devices in text format. The second is a set of directories
    and files representing the USBs and devices connected to the system. The device
    tree is of structure BBB/DDD, where BBB represents the USB number and DDD represents
    the USB device number. The following sections detail both of these files and look
    into usbfs applications using them.


    # usbfs: devices File


    Sometimes during development as a system user, you may need to know the devices
    that are connected to a particular USB. Tools like the viewBox provide this topological
    view of the USB device tree with a graphical interface. The tools retrieve this
    information from the devices file and present usbfs information to the user in
    an interactive way. The following section explains how information is represented
    in the devices file.


    The devices file of usbfs contains USB- and device-related information in text
    format, as discussed earlier. This text information is arranged in a particular
    sequential order and includes details of the USB descriptors and related information.
    Each line in the file starts with a symbol (T, B, D, P, S, C, I, E)'
