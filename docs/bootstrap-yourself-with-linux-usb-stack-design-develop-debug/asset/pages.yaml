- pgno: 199
  md: '# SUMMARY


    The gadget driver framework provides an essential infrastructure to support the
    USB device requirement as defined by the USB specification. It is designed such
    that the functional driver has full control managing the device, with the infrastructure
    provided by the gadget driver.


    In the next chapter, you explore the functional driver implementation over the
    gadget driver framework and the composite framework designed to support multiple
    functional layers above the gadget driver.


    # MORE READING


    The gadget driver positioned between the functional driver and the PDC driver
    is responsible for the USB device management. It uses many Linux infrastructures,
    such as DMA management and list management. Read Documentation/DMA-API.txt before
    you program a gadget driver that supports DMA transfers. You might want to read
    about spinlock at Documentation/spinlocks.txt.


    Comprehensive coverage of the gadget driver framework is available as gadget.pdf
    on the CD that accompanies this book.'
