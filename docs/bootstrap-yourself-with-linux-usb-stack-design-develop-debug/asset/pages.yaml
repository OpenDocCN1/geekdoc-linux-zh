    \ USB chip that has no functionality available, doesn't fit into class drivers,\
    \ and needs special drivers. Also, in a typical validation setup, USB transfer\
    \ requirements could be different from the standard requests, perhaps to simulate\
    \ and send a nonstandard size of bulk data to check whether the hardware can handle\
    \ the transfer as per specification or to invalid control data to check whether\
    \ the software stack handles the situation properly. You can easily meet such\
    \ needs of a validation system using libusb instead of developing device drivers,\
    \ which are more complicated.\n\nThe following example illustrates how to write\
    \ a driver that bulk reads and writes to a USB device. Any libusb program has\
    \ to start with a call to initialization routines. The libusb library requires\
    \ three such calls so that the libusb application is ready as the driver.\n\n\
    ```\nusb_init();\nusb_find_busses();\nusb_find_devices();\n```\n\nThese steps\
    \ allow the libusb to read the system configuration and update it with device\
    \ information. Once these steps have been performed successfully, the program\
    \ must identify the device using the Vendor ID and Product ID and take control\
    \ of the device. The following code illustrates a possible method to get a USB\
    \ device handler.\n\n```\nusb_dev_handle *open_usb_device(unsigned int MY_VID,\
    \ unsigned int MY_PID)\n{\n    struct usb_bus *bus;\n    struct usb_device *dev;\n\
    \n    for (bus = usb_get_busses(); bus; bus = bus->next)\n    {\n        for (dev\
    \ = bus->devices; dev; dev = dev->next)\n        {\n            if (dev->descriptor.idVendor\
    \ == MY_VID\n                && dev->descriptor.idProduct == MY_PID)\n       \
    \ }\n    }\n```"
