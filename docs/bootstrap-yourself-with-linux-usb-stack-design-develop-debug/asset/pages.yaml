- pgno: 175
  md: '# More Reading


    After mapping the platform, the driver obtains control of the device controller
    hardware. The probe routine now initialize control of the device controller hardware
    and set it up for USB activity. The other part of the device routine is specific
    to the device controller. You can explore it from the source available in the
    kernel.


    ```

    ret = request_irq(irq, r8a66597_irq, IRQ_DISABLED | IRQ_SHARED,

    udc_name, r8a66597);

    ```


    The platform IRQ is mapped to the PDC driver handler r8a66597_irq using the request_irq
    interface function. Once the IRQ is successfully mapped, the PDC driver starts
    receiving IRQ and handles USB transfers.


    # SUMMARY


    The peripheral device controller driver is the only layer of the gadget driver
    directly interacts with the USB device hardware. Although the implementation framework
    is the same, it varies for each USB controller and the way it is integrated with
    the platform. You have to carefully read the data sheet of the USB controller
    and the platform hardware details before implementing this driver layer. In the
    next chapter, you read about the gadget layer, which sits on top of the PDC layer.
    The gadget layer handles USB-specific device operations and is independent of
    the USB controller hardware being used.


    # MORE READING


    You can collect more information on the Linux platform driver framework from the
    Linux kernel documentation Documentation/driver-model/platform.txt. When your
    platform adds extra glue logic to interact with the device controller hardware,
    additional driver frameworks such as GPIO are required to control the hardware.
    You can read more about the GPIO framework from the Linux kernel documentation
    Documentation/gpio.txt.'
