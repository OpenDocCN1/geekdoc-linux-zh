  md: "# USB Mode Driver Using libusb\n\n# A Simple USB Test Application Using libusb\n\
    \nIt’s not always necessary to use libusb for standard applications as lippptp\
    \ or isusb. Because libusb is a generic driver, it allows you to develop device\
