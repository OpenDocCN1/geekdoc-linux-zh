    USB specification defines a standard set of descriptors: device, configuration,
    endpoint, and string.


    Figure 2.8 provides a hierarchical relationship between the descriptors. Descriptors
    are passed top down from the device descriptor to the endpoint descriptor.


    A device descriptor contains information about the USB device to host. The information
    includes the device speed, USB version, vendor details, and number of configurations
    available.


    A configuration descriptor contains information about a particular configuration
    and a device support, which includes powering mechanism, power requirements, and
    interface requirements.


    An interface descriptor contains information on a configuration''s particular
    interface, which includes the class of the device and protocol details.


    An endpoint descriptor contains information about a particular endpoint, which
    includes characteristics of endpoints such as the transfer type supported, timing
    details, and address.


    Chapter 9 of the USB specification contains more details about the USB descriptor.


    ![](img/779a74a6577501a55983f193067274a3_39_0.png)'
  merge: -1
