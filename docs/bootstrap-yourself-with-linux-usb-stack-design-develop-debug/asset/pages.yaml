    ```

    root@rajaram-laptop: #modprobe g_file_storage file=/dev/sda stall=y

    ```


    After successfully loading the module, connect the USB device to a USB host system,
    which supports the protocol specified to the storage driver module. On the host,
    you can view the LUNs as a storage drive. Now you can perform normal copying and
    formatting to test the device. The http://www.linux-usb.org/gadget/file_storage.html
    link provides additional information on managing the storage gadget driver.


    # Serial USB Gadget


    The serial gadget exposes a tty-like serial interface for the host, and it uses
    a usb-serial driver to interact. The serial gadget driver also implements the
    USB-defined communication device class (CDC) requirements referred to as CDC Abstract
    Control Model (ACM). The host Linux requires the cdc-acm driver to support CDC
    ACM devices. drivers/usb/gadget/serial.c, drivers/usb/gadget/u_serial.c, drivers/usb/gadget/f_serial.c,
    and drivers/usb/gadget/f_acm.c implement the CDC requirements. Figure 19.2 illustrates
    Linux USB serial modules in simple blocks.'
