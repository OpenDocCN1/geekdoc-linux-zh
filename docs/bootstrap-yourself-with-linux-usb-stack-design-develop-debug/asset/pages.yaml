- pgno: 45
  md: '# CHAPTER 3


    # OVERVIEW OF THE LINUX USB SUBSYSTEM


    In This Chapter


    +   - Linux USB Host Subsystem

    - Linux USB Gadget Subsystem


    The Linux kernel source tree is a complex set of source codes, which the kernel
    organizes in separate folder hierarchies based on their functionalities. Each
    functional framework folder contains a makefile of its own and can be independently
    built. The kernel configuration utilities manage these sources and help create
    required kernel configuration for a kernel user. You can manage the kernel configuration
    using any one of the following commands.


    +   - make config

    - make menuconfig

    - make xconfig


    Over and above understanding the kernel source code, it is essential to know how
    to configure the kernel, which enables you to build the required features as part
    of the kernel. This chapter provides a brief overview of the Linux universal serial
    bus (USB) subsystem and explores the various configuration options available in
    the kernel to configure the Linux USB subsystem, which helps you build the necessary
    USB modules.'
  merge: -1
  img_proc: true
- pgno: 46
  md: '# Chapter 3 = Overview of the Linux USB Subsystem


    # Table 3.1 Linux USB Framework Directory Structure


    | Folder Name | Description |

    | --- | --- |

    | Core | Part of the Linux USB host framework contains sources implementing the
    USB software system, including the hub, the USB file system, and the USB protocol
    implementation of the host. |

    | Host | Part of the Linux USB host framework contains the controller drivers.
    This source code includes EHCI¹, UHCI², and OHCI³ drivers for embedded USB host
    controllers. |

    | Gadget | Contains source code that implements USB peripheral framework and drivers
    for the USB peripheral framework. The USB device part of class implementation
    and the related framework are also available in this folder. |

    | Otg | Contains source code that implements OTG⁴ driver framework and drivers
    for OTG controllers. |

    | Class | Contains source code that implements a USB class protocol as ACM⁵ for
    the USB host and others that don''t fall under any of the categories that follow.
    |

    | Storage | Contains source code that implements a USB storage driver for a USB
    host, which includes support to different memory types. |

    | Image | Contains source code implements drivers for imaging devices such as
    cameras or scanners for the USB host. |

    | Atm | Contains sources that implement drivers for modern modems for the USB
    host. |

    | Serial | Contains source code implements drivers for serial devices such as
    serial consoles or adapters for the USB host. |

    | Misc | Contains source code that implements drivers for the USB host that do
    not fall into this category, such as the USB test drivers. |


    > ¹EHCI = Enhanced Host Controller Interface

    ²UHCI = Universal Host Controller Interface

    ³OHCI = Open Host Controller Interface

    ⁴OTG = On-the-Go

    ⁵ACM = Abstract Control Interface


    You can download the Linux kernel source 2.6.34 from http://www.kernel.org/. The
    Linux USB framework is organized under the *drivers/usb* folder of the Linux kernel
    source package. The *drivers/usb* folder contains source of the USB framework,
    which can handle both USB device and host functionalities. Table 3.1 is an overview
    of the directory structure of the Linux USB framework.'
  merge: -1
  img_proc: true
- pgno: 47
  md: '# Linux USB Host Subsystem


    Having gathered a basic understanding of how the source code of the Linux USB
    subsystem is placed in the kernel tree, the following sections provide a brief
    overview of the Linux USB subsystem, with various configuration options available
    in those subsystems that can help you add specific USB functionalities to the
    platform.


    # LINUX USB HOST SUBSY


    The Linux USB host subsystem, or the system software, referred to by the USB specification,
    consists of drivers for the host controller, driver modules that implement the
    USB protocol, and functional drivers. There are additional driver modules, such
    as the file system and debugging functionalities as part of the host subsystem.
    Figure 3.1 illustrates an architectural view of the Linux USB subsystem.


    The lowermost layer of the USB host software is the driver layer of the USB host
    controller. This driver acts as an abstraction layer to the hardware and exposes
    generic interfaces to the above USB host software layer. On


    ![](img/779a74a6577501a55983f193067274a3_47_0.png)


    Figure 3.1

    A block-level representation of the Linux USB host subsystem.'
