  md: '# How to Use usbmon


    The usscore module is responsible for setting up the USB debug framework’s root
    directory during its initialization. It uses the debugfs infrastructure to initialize
    the framework for usbmon. The usbmon files are relative to its root path. When
    you mount debugfs, perhaps in /sys/kernel/debug, the usbmon files might be in
    the /sys/kernel/debug/usbmon/ directory. Thus, for usbmon to function properly,
    the kernel needs to be built up with the debugfs module.


    Thus, you need to mount the debugfs file system to view the usbmon files. Normally,
    it is mounted to /sys/kernel/debug. The following terminal activity shows how
    to mount the debug file system and its initial directory contents before you load
    the usbmon module.


    ```

    root@rajaram-laptop:~# mount -t debugfs none_debugs /sys/kernel/debug

    root@rajaram-laptop:~# cd /sys/kernel/debug/

    root@rajaram-laptop:~# ls /sys/kernel/debug#

    kprobes

    root@rajaram-laptop:~# /sys/kernel/debug#

    ```


    After ensuring a successful mount of the debug file system, you are ready to insert
    the usbmon module into the kernel. After a successful modprobe of usbmon, the
    module creates usbmon files for each USB bus registered with the kernel. The following
    terminal activity shows you the contents of the usbmon directory after a successful
    insertion of the usbmon module.


    ```

    root@rajaram-laptop:/sys/kernel/debug# modprobe usbmon

    root@rajaram-laptop:/sys/kernel/debug# cd usbmon/

    root@rajaram-laptop:/sys/kernel/debug/usbmon# ls

    0 1s 1u 2t 3s 3u 4t 5s 5u 6t 7s 7u

    0u 1t 2s 2u 3t 4s 4u 5u 6s 6u 7t

    root@rajaram-laptop:/sys/kernel/debug#

    ```


    In Linux, the USB bus number starts at 1, and usbmon creates files with the bus
    number as a prefix to capture URB transactions on the particular USB bus. usbmon
    also creates a file with a 0 (0u) prefix to capture URB transactions of all busses.
    To capture the transactions of a connected device, you should know the bus device
    is connected to. To determine the bus connection, you can'
