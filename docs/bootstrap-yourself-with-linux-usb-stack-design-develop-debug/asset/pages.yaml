    callback is invoked, and the control returns to the class driver. The class driver
    selects the necessary endpoints based on the functionality it implements. The
    usb_ep_autoconfig interface function that the framework exports is used to select
    the necessary endpoints. After successful selection of endpoints, the class driver
    allocates a buffer for Endpoint Zero using usb_ep_alloc_request to support enumeration.
    The class driver performs all the activities in the bind callback. Once the bind
    method is successful, the usb_gadget_register_driver activates Endpoint Zero and
    subsequently powers up the PDC to start the enumeration process.


