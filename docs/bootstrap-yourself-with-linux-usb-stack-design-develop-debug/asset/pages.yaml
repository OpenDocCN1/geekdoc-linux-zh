    # Gadget Driver: Design


    The gadget driver implementation is part of the Linux USB gadget subsystem; its
    implementation is generally coupled along the PDC driver implementation. These
    files are usually named after the USB device controller they are developed for
    and are placed in drivers/usb/gadget/. The data structures required for the gadget
    framework are defined in include/linux/usb/gadget.h.


    The functionality of the gadget framework can be broadly classified into three
    major categories based on the operations performed. Figure 13.1 illustrates the
    broad classification of the gadget driver framework.


    You can map the data structures and their callbacks in the previous section to
    each block for easy interpretation of the functionality that the block implements.
    Because the previous section detailed the callbacks, this section focuses on the
    sequence of activities inside the gadget driver at key stages.


    # gadget register


    The first activity in the gadget framework starts with registration of the struct
    usb_gadget_driver object using the usb_gadget_register_driver interface'
