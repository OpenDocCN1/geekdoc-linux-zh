    Once the flag is set, the URB information is snooped, and you are ready to collect
    the debug data as part of the kernel log message.


    # Note


    The major difference between the usbmon and the ubsfs_snoop is that the former
    captures URB information between the kernel drivers and the lower usbcore, and
    the latter captures the URB information between applications and the usbcore''s
    file operations.


    Another important point to remember is that you will not use ubsfs_snoop debug
    data in the kernel log unless there is a USB transaction between a user application
    and the usbcore through the ubsfs file system. For example, ubsfs_snoop does not
    capture URB transactions during enumeration; instead, any user application using
    a file operation triggers a URB snoop operation.


    To trigger snooping of URB using ubsfs_snoop, you can perform a simple exercise,
    say lusb -v, on the terminal. This user space application sends input/output control
    (IOCTL) and gathers information on the connected USB devices. After successful
    lusb -v, you can use a dmesg command to display debug messages generated by ubsfs_snoop
    because of a successful lusb.


