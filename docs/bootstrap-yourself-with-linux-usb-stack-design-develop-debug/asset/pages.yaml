- pgno: 303
  md: '# USB REGRESSION TOOL


    In This Appendix


    +   - Overview of USB Regression Tool

    - Script Definitions


    In a development environment, developers write simple unit test code, compile
    it, and create an executable to set up a scenario. If the developer needs to change
    a certain parameter, he must recompile the test code to a new program, which takes
    time. In a system environment, when you connect a device under development to
    a universal serial bus (USB) host, you do not have much control on the host transfer.
    You cannot stop the host transaction and debug the device at a certain point in
    the middle of a transaction. In such cases, tools that enable a developer to write
    unit test scenarios and use them without needing to compile anything add value.


    Defining scripting tools implements the test scenarios and generates reports more
    quickly. In a normal situation, the USB packet format is with the kernel driver,
    and you can''t much create an error. A scriptable tool makes it easy to develop
    errors because the complete control of the test is at the script level. The following
    section explores a simple scripting tool that allows you to send and receive USB
    data. Initially, the section provides a simple overview of the test tool. That''s
    followed by the tool''s usage and a brief overview of the script language.'
  merge: -1
  img_proc: true
- pgno: 304
  md: '# OVERVIEW OF USB REGRESSION TOOL


    The USB regression tool adds value to a developer and a tester by automating a
    few of their tasks. The USB regression tool integrates the most popular open source
    USB library, the libusb, with a powerful cross-platform Qt (cross-platform application
    and UI framework) environment. The tool uses the scripting power of the Qt environment,
    which is a JavaScript-like programming language. Figure A.1 provides a simple
    architectural block diagram of the tool.


    To support USB transfers, additional script commands are added, which are explained
    in the next section. The USB regression tool also captures usb activity, along
    with the script execution, which allows you to easily analyze the activity between
    the devices. Because this tool accesses different system files, you need to run
    the tool in super user mode. You can also run this tool from an embedded host
    because has cross-platform support.


    The USB regression tool includes the provision to write scripts and view the activity
    when the script is executed. Figure A.2 captures an alpha version of the USB regression
    tool.


    You can use the regression tool for four purposes.


    +   - Notice the USB devices connected to the host, and note the vendor ID and
    product ID.

    - Write a script per your requirements.


    ![](img/779a74a6577501a55983f193067274a3_304_0.png)


    Figure A.1

    The simple architecture of the USB regression tool.'
  merge: -1
  img_proc: true
- pgno: 305
  md: '![](img/779a74a6577501a55983f193067274a3_305_0.png)


    # Figure A.2


    A snapshot of the USB regression tool.


    +   - Run the script using the Run option as part of the toolbar.

    - View the results in the information and USB transaction widget, and save them
    as a report.


    A detailed user manual on how to use the USB regression tool is available at http://www.kernelkahani.com/Tools.


    # SCRIPT DEFINITIONS


    The script language is based on the ECMAScript standard, which allows you to write
    a JavaScript-like program. Over and above the functionality supported by the scripting
    language, the tool provides functionalities to implement USB test scenarios. These
    extension functions are either generic USB functions or utility functions.


    # Generic USB Functions


    The generic USB functions implement functions to control USB devices connected
    to the host and to perform data transfer.'
  merge: -1
  img_proc: true
