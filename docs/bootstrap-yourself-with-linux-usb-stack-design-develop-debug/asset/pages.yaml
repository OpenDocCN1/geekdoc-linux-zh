    The configuration then binds the functions it intends to support using add_function,
    as illustrated in Figure 14.8.


    Once the functions are added successfully, the device is ready for enumeration
    of the composite driver. The host decides which configuration to choose from the
    composite driver. The routine specific to the functionality implemented takes
    over the functional driver flow. The next section explores the composite driver.'
