    The serial gadget module, g_serial, supports generic serial, CDC ACM, and Object
    Exchange (OBEX) functionalities. These functionalities are managed through the
    module parameter, as shown here.


    +   - **use_acm**. This parameter informs the driver to support ACM when loading
    the g_serial driver. By default, the value of use_acm is set to true.

    - **use_obex**. This parameter informs the driver to support OBEX when loading
    the g_serial driver. By default, the value of use_obex is set to false.

    - **n_ports**. This parameter indicates the number of ports the driver creates.
    By default, the value of n_ports is 1.


    The following terminal activity illustrates how to load the g_serial driver module
    to support the OBEX driver.


    ```

    root@rajaram-laptop: # modprobe g_serial use_obex=y use_acm=n

    ```


    The documentation available in the path `Documentation/usb/gadget-serial.txt`
    provides additional information to configure the USB serial gadget and functionally
    test the serial gadget.'
