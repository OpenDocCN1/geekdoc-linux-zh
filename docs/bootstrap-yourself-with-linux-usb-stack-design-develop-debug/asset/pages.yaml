    # SUMMARY


    The OTG specification was introduced to enable USB devices to act as minimal USB
    hosts. The Linux USB subsystem OTG framework was integrated to the kernel sometime
    in 2004. Some transceivers for controllers, such as OMAP, have adopted the OTG
    interfaces explained in this chapter, and others have implemented OTG functionality
    interleaving with host and gadget sources. This chapter explained the OTG implementation
    based on OMAP. You can accomplish future development in a similar way with clean
    interfaces for OTG requirements. Also, you may need to modify the Targeted Peripherals
    List in drivers/usb/core/otg_whitelist.h to ensure that the Linux USB framework
    allows the device you''re interested in.


    Forcoming chapters of this book explore the way developers and other users effectively
    use the Linux USB framework for development and debugging.


