    You can infer from the figure that the Linux kernel USB framework driver takes
    care of the initial USB device enumeration. A successful enumeration of the device
    means it is available through the VFS. The VFS files are shown in user space to
    illustrate that the VFS files usbfs and /dev are mounted and accessed by user
    applications. Now from the user space you can program USB-specific transfers and
    other miscellaneous activity, such as reset. In other words, USB-specific device
    enumeration takes place at the kernel drivers, and device-specific functions are
    exported to the user space. Thus, the driver framework is generic for all USB
    devices.


    # USB User Mode Driver Using Libusb


    The libusb library is a generic USB host-side driver available on Linux. It uses
    VFS files of the USB framework, usbfs (USB device file system), and /dev or /sys
    to interact with a USB device. The libusb library acts as a wrapper between the
    USB file system and the functional driver applications. It provides application
    programming interfaces (APIs) to develop functional drivers. Figure 17.3 illustrates
    an architectural overview of how libusb, usbfs, and functional drivers interact
    with each other.'
