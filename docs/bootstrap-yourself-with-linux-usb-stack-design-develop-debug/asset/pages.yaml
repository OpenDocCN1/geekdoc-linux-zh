- pgno: 301
  md: '# SUMMARY


    The compliance testing of a USB device involves validating the device at the protocol
    and function levels. This chapter explored some of the keys for Linux USB–related
    tests available for developers.


    Unlike other operating systems, using Linux to perform these USB tests gives developers
    an edge. Linux allows developers to pinpoint the exact module when a test fails.
    This is possible because the Linux kernel can be rebuilt with additional debug
    information to isolate the cause of the problem.


    The Appendix provides a simple framework with scripting support that allows you
    to perform USB tests in a different way from user space.


    # MORE READING


    You can read more about how to perform other system-level tests such as soft connect
    and disconnect, suspend, Bluetooth, and audio from Linux USB documentation. The
    sites http://www.linux-usb.org/gadget/ and http://www.linux-usb.org/usbtest/ provide
    detailed coverage on the Linux USB tests and procedures. The site http://linux-usb-test.sourceforge.net/docs/interop-0.2/book1.html
    provides interoperability procedures available on Linux for USB devices. The source
    code of usbtest available at drivers/usb/misc/usbtest.c enables you to properly
    adapt the test cases to your needs and add new scenarios.'
  merge: -1
  img_proc: true
