- pgno: 156
  md: '# SUMMARY


    The HCD is the lowest layer of the USB host driver; thus, this layer interacts
    with USB host controller hardware. Most of the host controllers comply with one
    of the specifications, namely ECHI, OHCI, or UHCI. Sometimes, USB controllers
    deviate from these specifications and require separate drivers. In a platform,
    USB host controllers become glued to the platform hardware using interfaces such
    as PCI or General Purpose Input/Output (GPIO). Therefore, the HCDs are developed
    on top of these PCI drivers or platform drivers. Once you develop the driver for
    the glue, you can use the already-implemented HCI drivers (perhaps the EHCI driver)
    and minimize the development effort.


    # MORE READING


    You can obtain more information on EHCI and UHCI from http://www.intel.com/technology/usb/spec.htm.
    You can read further details about OHCI at http://www.compaq.com/productinfo/development/openhci.html.
    The Linux documentation also provides information on ECHI and OHCI Linux implementation
    in Documentation/usb/ehci.txt and Documentation/usb/ohci.txt. In addition, you
    should explore the Linux HCI implementation (drivers/usb/host) to broaden your
    understanding of the HCDs.'
  merge: -1
