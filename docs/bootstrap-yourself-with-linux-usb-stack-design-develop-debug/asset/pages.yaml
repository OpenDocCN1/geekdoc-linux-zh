- pgno: 74
  md: '# Chapter 5 = USB Device Notification


    implement such a requirement to cater to these needs? Like a USB framework, many
    other modules require such notification methodology to enable them to communicate
    effectively. Linux provides a kernel infrastructure called the notifier chain;
    this infrastructure provides an effective mechanism for inter-module communication.


    This chapter focuses on how the Linux USB subsystem passes information with notifier
    chains to indicate addition or removal of a USB device. The first part of this
    chapter discusses the details of the Linux notification chain framework and subsequently
    explores the implementation of Linux-USB notification, with emphasis on its key
    data structures and interface methods. It later covers the sequence of activities
    inside the Linux USB notification framework. Finally, to validate the understanding,
    there is a simple module that notifies of the addition and removal of the USB
    devices using the USB notification framework.


    # BOOTSTRAP: NOTIFIER CHAIN


    Before getting into the details of the Linux USB notification framework, you need
    to have a basic understanding of the Linux USB notification chain, because it
    acts as the backbone of the Linux USB notification framework. `kernel/notifier.c`
    implements the Linux notifier chain and provides the necessary framework for the
    publish-subscribe model. The Linux notifier chain is like a simple linked list
    data structure with function pointer members. The function pointers hold the subscriber
    callback functions.


    Based on need, the notifier chain callbacks are invoked either from a process
    context or from an interrupt/atomic context. Thus, the notifier chains are classified
    based on the context in which they execute and by the lock protection mechanism
    they use in the calling chain. The types of notification chains


    +   - Atomic

    - Blocking

    - Raw

    - Sleepable Read-Copy Update (SRCU)


    The Linux-USB framework uses a blocking notifier chain framework. This chapter
    explores only one blocking notifier chain and leaves other Linux notification
    chain features for you to explore on your own.'
  merge: -1
  img_proc: true
- pgno: 75
  md: "# Bootstrap: Notifier Chain\n\nA blocking notifier chain runs in the process\
    \ context. The calls in the blocking notification chain, as the name suggests,\
    \ can be blocked because they run in a process context. The Linux network module\
    \ uses blocking notifier chains to inform other modules of change in quality of\
    \ service (QoS) value or addition of a new device. Thus, notifications that are\
    \ not highly critical can use blocking notifier chains.\n\nThe <include/linux/notifier.h>\
    \ defines the Linux notifier chain framework's key data structures and interface\
    \ definitions. The key data structure struct notifier_block offers a framework\
    \ for the publisher module to extend events. The subscriber modules, which expect\
    \ these events, register a callback for the extended events:\n\n```\nstruct notifier_block\
    \ {\n int (*notifier_call)(struct notifier_block *, unsigned long,void *);\n struct\
    \ notifier_block *next;\n int priority;\n};\n```\n\nThe struct notifier_block\
    \ contains a function pointer for the callback functions, and the list extends\
    \ provision for multiple subscribers. The priority field creates a sorted list\
    \ of the notifier requests.\n\nThe modules (publisher) provide notification support\
    \ also have to maintain a list head to manage and traverse the notification list.\
    \ The <include/linux/notifier.h> file defines the prototype of this blocking notifier\
    \ head as struct blocking_notifier_head.\n\n```\nstruct blocking_notifier_head\
    \ {\n struct rw_semaphore rwsem;\n struct notifier_block *head;\n};\n```\n\nThe\
    \ structure maintains a head pointer pointing to the list of subscribers and a\
    \ semaphore to avoid a race condition.\n\nThe Linux notifier chain subsystem also\
    \ provides interface functions to add and delete struct notifier_block objects\
    \ and from the head of the list. Any subscriber can add to the head of the publisher\
    \ module's list by using the block_notifier_chain_register application programming\
    \ interface (API). You"
  merge: -1
