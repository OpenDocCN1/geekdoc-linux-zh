    The next step in the process of testing a USB device after checking its basic

    protocol behavior is testing the functionality of a USB device. The next section

    focus on setting up and testing some of the USB gadget functionalities.


    # LINUX USB FUNCTIONAL TEST


    The previous section involving the usbtest module provides only a USB

    protocol level test framework, which tests the uscore framework and

    the host controller driver in a USB host and the gadget layer in a USB device.

    The next stage of testing is verifying the Linux-USB as a complete system.

    following section explores some key functionalities of the Linux platform, such

    as storage, serial transfer, networking, and input devices that adapt USB

    functionality. These functionalities are implemented based on the USB class

    sification defined by the USB-IF.


    # Storage USB Gadget


    The USB-IF defines the Mass Storage Class Specification to support and

    implement USB-based storage devices. On Linux, the USB mass storage gadget

    functionality is implemented as File-backed Storage Gadget (FSG), and on the

    USB host, the storage functionality is supported by SCSI drivers, with the Linux-

    USB framework providing a USB glue layer. Figure 19.1 illustrates Linux USB

    storage modules in simple blocks.


    In a typical mass storage device setup, a device''s storage is exposed as logical
    unit

    numbers (LUNs) to the host. Internally, a LUN represents a block device or a file

    that the storage gadget driver wants to share. The drivers/usb/gadget/file-

    storage.c implements the mass storage device functional driver g_file-

    storage.ko. To successfully associate LUNs and set other characteristics of'
  merge: -1
