    # Note


    Network drivers often use the notification chain framework.


    The blocking_notifier_chain_register method operates like a simple linked list
    program. The method adds the struct_block to the blocking_notifier_tier head based
    on the priority set in the notifier block:


    ```

    int blocking_notifier_chain_register(struct blocking_notifier_head *nh, struct_notifier_block
    *nb);

