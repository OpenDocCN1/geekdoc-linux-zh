  md: '# ABOUT THE AUTHOR


    Rajaram Regupathy has more than a decade of experience in designing and managing
    embedded and programming tool products. He loves to design and program new and
    emerging technology products and has successfully engineered products based on
    universal serial bus (USB) from scratch. A Linux and open source enthusiast, Rajaram
    has published open source articles for Linux for You and Embedded.com, among others.
    In his free time, he enjoys watching National Geographic and playing with his
    daughter. Rajaram’s Web site (http://www.kernelkahani.com) is a good place to
    obtain additional resources and get in touch with him.


