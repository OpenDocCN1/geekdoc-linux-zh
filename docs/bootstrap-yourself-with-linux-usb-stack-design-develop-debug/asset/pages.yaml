    # LINUX USB HCD


    The Linux USB HCD is the lowermost part of the USB host framework that interacts
    with the USB host controller hardware. The USB host driver implements USB host
    specifications that the controller hardware supports. The Linux USB host driver
    is available in the drivers/usb/host/ folder. Its interface with the usbcore is
    through /drivers/usb/core/hcd.c.


    Figure 10.1 illustrates a simple breakdown of the functions of an HCD.


    The USB host consists of three major functionalities to make a complete framework:
    platform drivers, HCI, and HCD. The two former modules are interface functionalities
    for hardware and the usbcore module, respectively. The USB host controller hardware
    integrates with the platform hardware through glue logic. Glue logic is custom
    logic circuitry that interfaces integrated circuits. The hardware glues are supported
    through the platform driver routines. In a normal USB host system, interfaces
    such as PCI act as glue logic to interfaces. In an embedded system, the USB controllers
    are interfaced through a complex bus interface controller to GPIO and pins.


    A USB HCD is developed for every USB host controller. To control the HCD from
    usbcore, the usbcore uses interface routines that invoke the necessary callbacks
    of the HCD. The main functionality of the HCD is to implement'
