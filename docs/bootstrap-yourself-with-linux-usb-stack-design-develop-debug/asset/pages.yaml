  md: '# Chapter 13 = Gadget Driver


    ![](img/779a74a6577501a55983f193067274a3_190_0.png)


    **Figure 13.3**nSequence of activities triggered during module exit.


    When the PDC driver receives an Endpoint Zero interrupt, the gadget driver handles
    the basic control request and passes on class-specific control requests to the
    class driver through the setup callback. Some of the controls have a data phase,
    which requires data to be transferred to the host. For example, a Get Descriptor
    requires a response to the host. In such scenarios, the class driver allocates
    a struct usb_request object, updates the response, and queues it to the gadget
    framework for transfer.


    The second section of the sequence diagram illustrates the activity after a successful
    enumeration. At this stage, the host selects a particular interface for further
    activity. When the Set Interface control request is received the class driver
    enables the particular endpoints using the usb_ep_enable interface function. After
    successfully enabling the endpoints, the class driver allocates a struct usb_request
    object and gets ready for OUT transfer.'
