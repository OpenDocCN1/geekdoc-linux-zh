  md: '# Overview of usbfs


    Using usbfs, a key VFS file of the Linux USB subsystem, uscore exports USB device
    access to the user space. In the subsequent sections, you will learn about the
    usbfs file tree, which can help you understand how to develop a user space driver
    for USB on Linux. The following terminal activity displays the usbfs tree mounted
    on the /proc/bus/usb root directory.


    ```

    root@rajaram-laptop:/proc/bus/usb# ls -alt

    total 0

