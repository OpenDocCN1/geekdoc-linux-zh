  md: '# USB User Mode Driver Using libusb


    Figure 17.3 captures the internal blocks of the libusb library and its interaction
    with the Linux USB framework.


    The APIs of libusb can be categorized into four major functionalities: system
    (core) operations (Table 17.1), device operations (Table 17.2), transfer operations
    (Table 17.3), and miscellaneous operations (Table 17.4). These operations are
    implemented as part usb.c and part linux.c in the libusb package. You need to
    have an idea of APIs and their function of libusb before using them in an application.
    The following section provides a quick overview of these APIs.


    # Utilities Using libusb


    The libusb library is a decade old, and by now many applications have integrated
    it as part of their package. This is because libusb provides an efficient method
    for USB application development. Two typical applications have adopted libusb:
    USB functional drivers and USB utilities. The first example to explore is libptp,
    a prominent user functional driver developed to support Picture Transfer Protocol
    (PTP) devices such as digital cameras. The second example is a common utility
    used in most of the chapters: libusb.


    | Table 17.1 Core Operations |

    | Operation | Description |

    | usb_init | On libusb, usb_init does the necessary initialization of the libusb
    system. Any application that uses the libusb library must start this function
    before using other APIs. When called, the function checks the path of the USB
    files and initializes the variable with the mount path of the virtual files. |

    | usb_find_busses | After successful initialization of the virtual file path,
    the library must collect information on the USB busses available on the system.
    This API may be invoked after a successful usb_init call. This API finds and initializes
    internal data structures with USB busses from the virtual files. |

    | usb_find_devices | After successful execution of usb_find_busses, the library
    must collect the list of devices connected to the busses. This API finds and initializes
    internal data structures with the list of USB devices from the virtual files.
    |

    | usb_get_busses | After successful execution of find routines, the library is
    ready with the list of busses and devices. The usb_get_busses API returns the
    USB bus list created by the earlier API calls. |'
