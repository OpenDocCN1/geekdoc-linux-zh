  md: '# Linux USB Gadget Driver


    ![](img/779a74a6577501a55983f193067274a3_162_0.png)


    **Figure 11.2**

    A simple representation of the Linux USB gadget driver framework.


    implements hardware-specific routines that allow access to the registers, memory
    space, and interrupts. You can explore more about the USB controller driver in
    Chapter 12, “Peripheral Device Controller Driver.”


    # Gadget Driver


    The gadget driver is similar to the Chapter—9 driver/USB device framework discussed
    in the previous section. The gadget layer handles most of the USB protocol-specific
    requirements and passes on requests that are class specific. This layer sits between
    the hardware layer and the class layer and provides necessary USB protocol abstraction.
    You can explore more on gadget driver in Chapter 13, “Gadget Driver.”


    # Class Driver


    The class driver or the functional driver implements the actual device functionality.
    The gadget driver handles most of the USB functionality, but the gadget layer
    passes on a request specific to a class. The class driver handles USB-specific
    requests as well, along with the functional implementation. The USB Working Group
    (DWG) defines various USB class specifications, which you can reference at http://www.usb.org/developers/devclass_docs#approved.
    Chapter 13 goes into the class driver in more detail.'
