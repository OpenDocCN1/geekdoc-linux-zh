    # USB User Mode Driver Using UIO


    When USB devices are developed for products, you must develop drivers based on
    the Linux-USB framework. Development of such standard drivers can be time consuming
    and complex. User space programming using the VFS as an alternative to this constraint,
    VFS is also part of the driver in the kernel layer. Moreover, VFS provides only
    limited access to the device through IOCTL interfaces.


    Sometimes in a development environment, for example, a USB Internet Protocol (IP)
    test requirement may include validating low-level register states. To implement
    such requirements on a Linux environment, you end up developing custom kernel
    drivers or even modifying the USB core. Another scenario arises when integrating
    proprietary stacks to a Linux environment. Although this is against Linux ideology,
    a business decision might lead to proprietary software modules.


    The documentation on Linux says UIO is not a candidate for USB devices, but it
    can fit as an ideal platform for USB development needs, as described earlier.
    This is because the UIO framework exports USB hardware completely to the user
    space and helps develop custom applications.


    # Bootstrap: Linux UIO


    The initial version of the UIO framework was introduced in kernel 2.6.22, and
    it is continuously being improved. Using the UIO framework, a developer can map
    and control a device’s memory and interrupt through user space operations. A simple
    kernel driver along with the UIO framework is required for mapping the hardware
    and interrupts completely to the user space. This complete hardware access at
    user space gives developers an easy way to develop a functional application without
    crashing the kernel. Note, unlike other user space approaches, applications adopting
    UIO have fewer copy operations across memory space. Figure 17.4 illustrates a
    Peripheral Component Interconnect (PCI) driver using the UIO infrastructure.'
