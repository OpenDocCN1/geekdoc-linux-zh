  md: '# Chapter 12 = Peripheral Device Controller Driver


    When you write a device driver, cleaning and freeing up the resource is part of
    the device driver job. You can use the platform_device_unregister method of the
    platform driver framework to clean and free up the allocated resources.

    void platform_device_unregister(struct platform_device *);


    Once the device is successfully probed, the device driver must claim the resource
    allocated to the device by the platform framework. The platform driver framework
    provides the interface method platform_get_resource to retrieve the resource that
    the platform framework allocates. The types of resources that can be retrieved
    here are shown:


    ```

    #define IRESOURCE_TYPE_BITS      0x00000F00   /* Resource type */

    #define IRESOURCE_IO_10         0x00000100

    #define IRESOURCE_MEM           0x00000200

    #define IRESOURCE_IRQ          0x00000400

    #define IRESOURCE_DMA          0x00000800

    ```


    ```

    struct resource *platform_get_resource(struct platform_device *, unsigned int

    type, const char *)\struct resource *platform_get_resource_byname(struct platform_device
    *,unnsigned int,const char *)

    ```


    When successful, the method returns the resource allocated to the device; or if
    failure, a negative error number is returned. The platform framework also provides
    routines to get the IRQ assigned to the device.


    ```

    int platform_get_irq(struct platform_device *dev, unsigned int num)

    int platform_get_irq_byname(struct platform_device *dev, const char *name)

    ```


    When a resource is named, you can retrieve it by its name. platform_get_resource_byname
    and platform_get_irq_byname allow you to get the resource by name.


    The PDC is closely associated with hardware; requesting an IRQ and installing
    an IRQ handler is an essential part of the driver layer. The Linux driver framework
    provides the request_irq interface function declared in <linux/interrupt.h> for
    installing IRQ handlers. The function returns 0 when the handler is installed
    successfully and a negative error code when installation fails. When the device
    is no more in use, the IRQ should be made available for the other driver. You
    have to use free_irq to release the IRQ shared by the device.'
