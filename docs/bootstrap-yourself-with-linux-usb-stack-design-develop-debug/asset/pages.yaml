    # # BOSTRAP ESSENTIALS: LINUX USB GENERIC DRIVER


    The usbcore''s generic driver framework is responsible for managing the device,
    the device drivers, and the flow of information. The usbcore-generic framework
    uses the key data structures `struct usb_device_driver`, `struct usb_driver`,
    `struct usb_bus`, and `struct usb_device`, which are available as part of `include/linux/usb.h`.
    The framework also exports interface routines and provides callbacks to manage
    the functionalities of the usbcore-generic driver framework. This section explores
    the data structures and the interface functions of the usbcore-generic driver
    framework.


    The `struct usb_device_driver` structure identifies a USB device driver to the
    `usbcore` module. The Linux USB framework declares a `usb_device_driver` object
    `usb_generic_driver` in `drivers/usb/core/generic.c` that acts in USB device identification.


