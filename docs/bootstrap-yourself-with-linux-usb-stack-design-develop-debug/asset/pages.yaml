  img_proc: true
- pgno: 36
  md: '# Chapter 2 - USB: An Overview


    As you connect a device to a host, the host assigns it a unique address, referred
    to as a device address. Each endpoint on a device has a unique device-assigned
    number called an endpoint number. The endpoint can be referenced uniquely with
    a combination of the device address, endpoint address, and endpoint direction.
    An endpoint operates simply, supporting data flow in one direction, either from
    the device to the host or vice versa.


    Endpoint Zero is a special endpoint that all devices must implement. The USB host
    uses it to initialize and gather information about the device. An endpoint has
    a characteristic that determines the type of transfer it provides. As per USB
    specification, an endpoint describes itself by the following.


    +   - The bus access frequency/latency requirement

    - The bandwidth requirement

    - The endpoint number

    - The error-handling behavior requirements

    - The maximum packet size that the endpoint is capable of sending or receiving

    - The transfer type for the endpoint

    - The direction in which data is transferred between the endpoint and the host


    The following section provides an overview of how the USB system software maps
    these endpoints as pipes.


    # Pipes


    A pipe is a logical representation of the association between a device endpoint
    and the host software. There are two types of pipes: stream pipe and message pipe.
    The former moves data with no USB-defined format, and the latter moves data with
    no USB-defined structure.


    Figure 2.6 from the USB specification neatly illustrates the relationship between
    the endpoints, pipes, and client software running in the USB host.


    A pipe adopts the characteristics such as the transfer type and payload size of
    the endpoint it associates and claims the necessary bandwidth required from the
    USB'
  merge: -1
