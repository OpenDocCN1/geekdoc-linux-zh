  md: '# CHAPTER 19


    # TEST USING LINUX USB


    In This Chapter


    +   - Linux USB Unit Test Driver

    - Linux USB Functional Test


    Testing is an essential part of software development to ensure system quality
    quality and confirm whether a system meets its product requirements. Quality control
    and quality assurance are integral to the process and are achieved through proper
    testing. Testing a universal serial bus (USB) system involves various stages of
    evaluation and different characteristics of a USB device. Following are a few
    recommended tests that the USB-IF (Implementers Forum) recommends to a USB device
    vendor to develop a certified USB device.


    +   - Full-speed electrical tests

    - High-speed electrical tests

    - Interoperability tests

    - Functional tests


    On Linux, the essential hardware and software environments to perform USB compliance
    testing are not available and can be performed only on Microsoft Windows operating
    systems. However, Linux provides tests as separate modules to validate Linux USB
    systems. This chapter initially explores the USB tests'
  merge: -1
