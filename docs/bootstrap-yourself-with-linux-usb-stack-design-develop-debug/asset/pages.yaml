  md: '# Chapter 15 Linux USB OTG Driver


    ![](img/779a74a6577501a55983f193067274a3_222_0.png)


    **Figure 15.2**

    A simple top-level breakdown of the OTG framework.


    The OTG driver flow consists of both the host and the device driver framework,
    taking its part to switch the role by using the OTG framework. Before you can
    understand what happens inside the device driver framework, you need to understand
    the sequence of activities that occurs when the role switch takes place. Figure
    15.3, extracted from the USB OTG specification, illustrates operations when two
    OTG devices having full OTG functionality are connected.


    Figure 15.4 illustrates a simplified control flow of the OTG framework. Like any
    other driver, the OTG driver starts platform registration and is based on how
    the transceiver hardware is interfaced.


    Like the PDC driver, the OTG driver is specific to the hardware and the platform
    for which the transceiver is developed. The OTG driver starts by registering itself
    successfully with the Linux platform, along with the platform callbacks such as
    the probe routine. The platform calls the registered probe routine when it detects
    the transceiver.


    The probe routine maps the platform resource and creates `struct otg_transceiver`
    object. The probe routine also sets the callbacks of `otg_transceiver`. You can
    save the object using the `otg_set_transceiver` utility'
