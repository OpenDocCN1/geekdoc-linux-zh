    # SUMMARY


    The Linux usbcore-generic framework implements key functionalities of the USB
    host system software. This chapter covered some of the basic functionalities of
    the usbcore functionality. This framework within the usbcore module interacts
    with device drivers and manages USB devices by storing device and bus information
    in their respective data structures.


    Chapter 10, “Host Driver for Embedded Controller,” explains the role of the HCD
    and how it interacts with the usbcore.


    # MORE READING


    One of the main frameworks within the usbcore module is URB management, which
    you can learn more about in Documentation/usb/URB.txt. The Linux USB host framework
    supports URB transfer on direct memory access (DMA); see Documentation/usb/dma.txt
    for more information. If you want to control a USB device, whether connected or
    not, refer to Documentation/usb/authorization.txt. This authorization feature
    is used mainly in wireless USB devices. You can read more about the usbcore data
    structures and application programming interfaces (APIs) at http://www.lrr.in.tum.de/Par/arch/usb/usbdoc.'
