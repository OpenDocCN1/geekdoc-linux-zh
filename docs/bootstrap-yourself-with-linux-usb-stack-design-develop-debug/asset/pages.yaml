    # USB: The PATH AND THE MARKET


    USB came into the market in 1996 and has become a leading peripheral interface.
    The USB standard was formulated by industry leaders such as Intel, Microsoft,
    HP, and IBM. The objective of the USB standard is to provide an open architecture
    that enables vendors to design and build systems and peripherals that operate
    with each other. Over the years, the USB specification has matured as an interface
    protocol. Now more than six billion devices use the USB interface.


    One factor for the USB''s heavy use is that interfaces like serial ports or parallel
    ports, expansion of the ports in a personal computer (PC) is impossible. In contrast,
    USB is flexible and allows port expansion, enabling multiple peripheral devices
    to connect to a PC. The USB interface and peripherals such as keyboards and mice
    provide an easy-and-play capability, allowing end users to avoid hard restarts
    to detect a newly attached peripheral.


    Over the years, the capability of PCs also has increased, thereby the need for
    higher data transfer rates between its peripherals. Newer peripherals such as
    digital cameras and media players have emerged with larger memory capacities and
    better performance, raising the bar for USB because it is the leading PC-peripheral
    interface. The USB specification evolved to meet these by providing different
    data rates such as 1.5Mbps (low speed), 12Mbps (full speed), and 480Mbps (high
    speed). The following is a brief outline of these speeds taken from the USB specification.'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# USB: The Path and the Market


    # Note


    **Low speed.** Devices that do not transfer large amount of data fall into this
    category. These include interactive devices such as keyboards and joysticks. The
    typical transfer rate for these devices is 10–100kbps.


    **Full speed.** Applications such as microphones and broadband fall into this
    category, which requires a transfer rate of 500kbps–10Mbps. One of the important
    attributes is guaranteed bandwidth and latency.


    **High speed.** High-bandwidth devices such as imaging and storage that require
    higher and sometimes guaranteed bandwidth fall into this category. A typical transfer
    rate is 25–400Mbps.


    The year 2001 introduced a new generation of device supplement that provides a
    minimal host facility, enabling the devices to act as host and connect to other
    USB devices. These are called On-the-Go (OTG) devices. OTG mainly evolved to support
    handheld devices such as mobile phones directly connecting to other USB devices
    as printers.


    The USB specification has a complex low-level protocol implementation with strict
    timing requirements. Most of the complexity is implemented as hardware. Although
    this book concentrates on the software aspect of USB, it is important to know
    the different hardware configurations available in the market. This information
    helps you when you write drivers for these controllers. The following section
    captures in broad terms various USB hardware configurations available in the market.


    # USB Hardware


    A USB system implements the most complicated portion of the USB specification
    as part of USB hardware, which includes a physical layer, a link layer, and some
    part of the USB protocol. The physical portion characteristics that are necessary
    for data transmission, speed detection, timing, and power. The hardware protocol
    management includes bandwidth management, error handling, and packet management.


    In the market, you may find USB hardware in different configurations and casings,
    providing flexibility to a platform when adopting a USB solution. USB solutions
    extend the functionality of a platform in a shorter time to integrate,'
  merge: -1
