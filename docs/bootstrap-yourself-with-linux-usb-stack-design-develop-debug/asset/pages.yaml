  md: '# Chapter 16 = USB Virtual Systems


    debug files. They are generally mounted to /proc/driver/udc for the user space
    applications to read. Few other drivers use the debugfs infrastructure to dump
    hardware debug information. The debugfs VFS is a lightweight VFS with strict rules
    on how the data is shared; it enables easy removal when the kernel developers
    don''t require it. These debug options are configurable through the kernel configuration,
    which allows developers to use these debug files during development or debugging.


    # SUMMARY


    Linux VFS has one of the key functionalities acting as the interface between the
    kernel and user space. The host side of the Linux USB framework exports different
    files to the sysfs and proc file systems that enable you to control a USB device
    from the user space. Similarly, the Linux USB gadget framework extends gadgets
    as the programming interface. It also provides an option to configure debug file
    creation. These virtual files allow easy programming of the USB device from the
    user space and for system configurations like hot plugging. The user space drivers
    are simpler and faster to develop than the kernel drivers. The next chapter discusses
    USB user space drivers and illustrates how these VFS files are used to develop
    USB drivers (USBDs) from user space.


    # MORE READING


    Refer to Documentation/usb/proc_usb_info.txt for more details on /proc/bus/usb
    files. You can also download source code from http://www.kroah.com/linux-usb/
    to learn how to program using usbfs files. The next chapter offers additional
    tools that use these files to program USB devices. In addition, you can read drivers/usb/core/sysfs.c
    and drivers/core/inode.c, explained in Chapter 6 to discover how the files are
    created and how they operate internally. Also, you can read the Linux kernel documentation
    Documentation/usb/power-management.txt to learn how to use the sysfs files to
    manage USB power management.'
