    bus. One of the important pipes is the default control pipe, which is associated
    with Endpoint Zero and is available once the device is powered and has been reset.
    The host system software uses the default control pipe to identify and configure
    the device.


    # ## ENUMERATION


    The process of identifying the device and setting a unique address is referred
    as *bus enumeration*. The enumeration process is handled by the system software
    over the host and the USB logical layer on the device side. The enumeration process
    starts when a device is attached to the host and the device gets the power. The
    USB specification includes simple steps for enumeration.


    +   1. The USB device is attached to the host, which receives an event indicating
    a change in the pipe''s status. The USB device is in the powered state, and the
    port it is attached to is disabled.

    2. The host queries about the change in the bus.

    3. Once the host determines that a new device is attached, it waits for at least
    100ms for the device to become stable after power, after which it enables and
    resets the port.'
  merge: -1
  img_proc: true
- pgno: 38
  md: '# Chapter 2 = USB: An Overview


    +   4. After a successful reset, the USB device is in a default state and can
    draw power to a range of 100 mA from VBUS pin.


    +   5. Once the device is in a default state, the host assigns a unique address
    to the USB device, which moves the device to an address state.


    +   6. The host starts communicating with the USB device in the default control
    pipe and reads the device descriptor.


    +   7. Subsequently, the host reads the device configuration information.


    +   8. The host selects the configuration, which moves the device to a configured
    state and makes it ready for use.


    This state transition in the enumeration is an important portion of the USB logical
    layer. Figure 2.7 captures an ideal state transition during the enumeration process.


    This state machine is part of the USB logical layer software implementation of
    the USB device. The state transition forms descriptor requests and replies to
    the host. The following section offers a brief overview of the various descriptors
