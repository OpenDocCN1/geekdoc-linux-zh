    # USB Device


    A USB device to an end user provides additional capability, such as Web camera
    or printer, to a host computer through a USB interface. In fact, a USB hub is
    referred to as a device that provides additional USB attachment points to a host
    computer. A USB device is generally self-powered or bus powered (powered by the
    USB host). Figure 2.5, taken from the USB specification, is a simplified version
    of Figure 2.3 illustrating the blocks of USB device. The subsequent section provides
    an overview of these USB device layers.


    # Function


    The function layer implements the functional characteristic of the USB device.
    This layer implements the USB class specifications such as mass storage, HID,
    and communication defined by USB.org. In Figure 2.3, notice that the USB


