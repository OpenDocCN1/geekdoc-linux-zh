    # USB Transceiver


    A transceiver is a simple mechanism that sends and receives signals from the same
    circuitry. A USB transceiver enables processors to have a digital USB core integrated
    on-chip, without the analog circuitry. The USB transceiver thus supports connection
    detection functionality and provides the analog electrical signalling requirement
    defined by the USB specification. Figure 1.3 illustrates a USB system block diagram,
    demonstrating how a USB transceiver fits in a USB system.'
