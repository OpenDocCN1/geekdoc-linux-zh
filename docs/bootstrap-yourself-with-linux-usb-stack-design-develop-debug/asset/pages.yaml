    to pass on the interrupt data to the usbcore. |

    | usb_interrupt_read | User space applications require a method to perform an
    interrupt IN transfer. usb_interrupt_read allows user applications to read interrupt
    data from the device, which is an IN transfer. Internally, it uses IOCTL_USB_SUBMITURB
