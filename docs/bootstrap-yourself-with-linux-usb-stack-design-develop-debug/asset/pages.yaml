  md: 'function layer''s data is not USB specific. The data is mostly specific to
    the functionality that the USB layer implements. The function layer decides the
    configuration of the USB device that is passed on to the USB host through the
    layers below. The functional layer appears to a host system as an interface collection
    that exposes the implemented functionality.


    # USB Logical Device


    The logical device layer implements the USB-related portion of the USB device
    activity. This layer appears to the USB host system as a collection of endpoints
    that includes the default Endpoint Zero and other endpoints as required by the
    function layer. The logical device is also responsible for maintaining the state
    machine defined by the USB specification. The logical device layer performs almost
    the same functionality in all USB devices, and the host communicates with the
    logical device as if it is directly connected.


    # USB Bus Interface


    The bus interface layer is a hardware implementation for a USB device; it is commonly
    referred to as the USB device controller. The bus interface layer implements the
    physical layer, link layer, and protocol layer. The bus interface layer is common
    for the USB device and the USB host, but the device implementation is simpler
    than the host. A typical USB device controller facilitates above logical and function
    layers to transfer data and provide status information on the data transfer and
    USB-related information.


    # Communication Flow


    Having seen the USB host and the USB device details, you need to know how both
    systems are logically connected, because communication at the software level is
    logical. The two key interconnects of the USB communication are the USB device
    endpoint and the pipe. The following section discusses these two logical interconnects.


    # Endpoints


    An endpoint is a uniquely identifiable location of a USB device, which is the
    source or sink point for the communication flow between the USB host and the USB
    device. A device is made up of a number of endpoints based on its function.'
