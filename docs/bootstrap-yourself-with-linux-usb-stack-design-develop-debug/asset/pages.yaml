  md: '# Bootstrap Essentials: Gadget Driver


    interface usb_ep_queue for the class drivers to queue the data. Once a gadget
    driver submits a request, a request cannot be examined or modified until it is
    given back to gadget driver through the completion callback. On successful completion,
    the callback returns 0; on failure, it returns a negative error code.


    +   - int (*dequeue) (struct usb_ep *ep, struct usb_request *req)

    This callback method provides the necessary infrastructure to remove a USB request
    from an endpoint queue. After successful removal, it invokes the completion routine
    for the USB request with parameter ECONNRESET. The gadget layer provides an interface
    function usb_ep_dequeue for the class drivers to remove the data that was queued
    earlier. A successful completion failure returns a negative error code.


    +   - int (*set_halt) (struct usb_ep *ep, int value)

    This callback method provides the necessary infrastructure to halt a particular
    endpoint when there is a transaction error. On successful completion, the callback
    returns 0; with an error, a negative error code is returned. The gadget layer
    provides an interface function usb_ep_set_halt with a parameter value of 0 to
    set halt and an interface function of us_ep_clear_halt to clear halt with a parameter
    value of 1.


    +   - int (*fifo_status) (struct usb_ep *ep)

    This callback method provides the necessary infrastructure for the class driver
    to query the status of hardware in fin, first out (FIFO) for any garbage or unhandled
    bytes. You can use this method for error recovery or precise handling. This callback
    returns the number of bytes left out if the hardware is using or supporting FIFO.
    A negative error number is returned if the callback is not supported. The gadget
    layer provides the interface function usb_ep_fifo_status to access this callback.


    +   - void (*fifo_flush) (struct usb_ep *ep)

    This callback method provides the necessary infrastructure for the class driver
    to clear any garbage or unhandled bytes in the FIFO. The gadget layer provides
    the interface function usb_ep_ep_fifo_flush to access this callback.'
