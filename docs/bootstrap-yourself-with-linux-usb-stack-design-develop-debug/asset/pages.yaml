- pgno: 231
  md: '# CHAPTER 16


    # USB VIRTUAL FILE SYSTEMS


    In This Chapter


    +   - USB Host Virtual File Systems

    - USB Device Virtual File Systems


    A Virtual File System (VFS) or virtual file system switch is an abstraction layer
    on top of the actual file system that specifies an interface between the kernel
    and the file system. Acting as a transparent layer file, it allows uniform access
    to client applications. A VFS does not need to know the format in which the file
    system is stored. The format intricacies are handled by equivalent callback routines
    that are registered with VFS and return only the data required by the user application,
    thus providing transparency to the user application.


    Certain VFSs are categorized as special because they act as an interface to manipulate
    and control kernel data structures and devices connected to the kernel. Some special
    VFS files are mounted onto the /proc directory. These /proc files extend interfaces
    that provide access to physical devices connected to the system and provide options
    to control kernel data.


    The Linux universal serial bus (USB) framework also has special VFS files that
    allow access to the kernel part USB framework and to the USB device at the user
    space. You know by now from the previous chapters that the Linux USB framework
    has host and gadget frameworks. Figure 16.1 illustrates the USB VFS files of the
    Linux USB framework. The Linux USB framework extends two VFS'
  merge: -1
  img_proc: true
- pgno: 232
  md: '# Chapter 16 = USB Virtual File Systems


    ![](img/779a74a6577501a55983f193067274a3_232_0.png)


    **Figure 16.1**

    A simple representation of USB VFS files.


    files: usbfs, which acts as an interface to the Linux USB host framework, and
    gadgetfs, which acts as an interface to the Linux USB gadget framework. Other
    files such as devfs and sysfs offer access to the kernel data structure and the
    USB device–specific information to user space. On Linux, these files are a means
    to export kernel data structures and their attributes to the user space.


    This chapter discusses both the USB host and the device VFS files, which include
    how to set up the VFS files, followed by their file format and functionalities.
    It also explores applications that use these VFS files. Later in this chapter,
    you will learn about the devfs and the sysfs files of the Linux USB framework
    and discover how the USB devfs and sysfs directories are organized.


    # ## OVERVIEW OF UBSFS


    From the previous chapters, you know that the USB host file system is part of
    the uscore implementation. When the uscore module is loaded into the kernel, the
    USB host VFS is initialized, and it is ready to be mounted in the user space.
    The usbfs files are generally mounted to the /proc directory. The following terminal
    activity illustrates the step to mount the usbfs virtual file:

    root@rajaram-laptop:/proc/bus/usb# mount -t usbfs none /proc/bus/usb


    **Tip**


    > The VFS of uscore was initially referred to as usdevfs and later renamed to
    usbfs to avoid confusion with the devfs file system.'
