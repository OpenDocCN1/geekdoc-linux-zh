- pgno: 85
  md: '# More Reading


    Now the subscriber module can start receiving notification from the USB framework.
    Add a USB device to the computer to see a USB device debug message.


    # SUMMARY


    Although the USB notification framework is a simple part of the usbcore, it is
    vital to pass on USB events. The USB notification module effectively uses the
    Linux notifier subsystem as its base framework. This chapter provided an overview
    of the Linux notifier framework and USB notification framework followed by an
    example. In the next chapter, you will learn about the USB device file system
    and how the USB device notification framework helps the USB device create device
    files dynamically.


    # MORE READING


    The USB system architecture allows hot plugging of devices to the platform. Thus,
    when devices are added or removed at runtime, this information needs to be passed
    on other drivers in the platform. A USB notification driver module satisfies this
    need using the Linux notifier framework. For more on the notifier block framework,
    refer to linux/notifier.h. To understand how this USB notification is being used,
    read Chapter 6, “Device File System,” and Chapter 18, “Debugging Using Linux USB.”'
