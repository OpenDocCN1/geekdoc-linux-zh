    You can visualize the usbcore-generic framework as composed of three important
    functionalities: URB management, USB device driver management, and USB device
    management. The usbcore-generic framework includes essential data structures and
    routines that manage URBs submitted from the device drivers and user space applications.
    Along with the hub and host controller driver (HCD) framework, the usbcore performs
    device enumeration, the devices are managed using the `struct usb_device` driver
    and use `struct usb_bus` data structures. The framework also provides routines
    that handle interface driver requirements and registration.


    With these functionalities in the usbcore-generic framework, you need to understand
    two important activities of the usbcore-generic framework: the USB driver registration
    with usbcore-generic, and the life cycle of URB and how data flows between class
    driver/user applications in the host to USB devices.


    Figure 9.3 illustrates the device driver registration with the usbcore using the
    `usb_register` interface function.


    As part of registration, usbcore-generic updates the kernel device driver with
    its callback methods for probe and disconnect. Subsequently, it registers the
    device driver with the kernel framework. After a successful registration, the
    registration routing updates the USB device file system.'
