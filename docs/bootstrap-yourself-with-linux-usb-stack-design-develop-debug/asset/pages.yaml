  md: 'state. The function receives the new state and pointer to the device for which
    the state has to be applied. You must perform the state change with lock protection
    any time the device switches to USB_STATE_NOTATTACHED. Another framework should
    not directly set the state. It should use this interface function.


    +   - int usb_hub_clear_tt_buffer(struct urb *urb)


    This interface function clears the control/bulk TT state in a high-speed hub.
    A high-speed host controller informs the hub driver that some split control or
    bulk transaction failed and requires clearing the internal state of a transaction
    translator. This interface function is invoked from an interrupt context.


    +   - int usb_reset_device(struct usb_device *udev)


    This interface function resets a USB device after informing the registered interface
    drivers. The function performs a port reset, reassigns the device''s address,
    and sets up the configuration. When there is a change in the descriptor value
    after the reset, the hub framework is informed as if the device has been disconnected
    and reconnected. Internally, usb_reset_and_verify_device performs the USB port
    reset to reinitialize a device.


    +   - void usb_queue_reset_device(struct usb_interface *iface)


    This interface function resets a USB device in an atomic context. The reset via
    this method is delayed to a work queue but is functionally equivalent to calling
    usb_reset_device.


    # ## LINUX USB HUB FRAMEWORK


    The Linux USB hub framework is part of the uscore module that is implemented in
    the file drivers/usb/core/hub.c. Some of the hub protocol and driver data structure
    definitions are part of drivers/usb/core/hub.h, and some are visible to host controller
    drivers. The hub framework implements a hub daemon, a kernel thread, namely khud,
    which is responsible for handling hub events. The uscore hub framework contains
    four functionalities, as illustrated in Figure 8.3.'
