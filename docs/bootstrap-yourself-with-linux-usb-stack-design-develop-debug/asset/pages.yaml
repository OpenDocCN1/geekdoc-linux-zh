    # LINUX USBCORE-GENERIC DRIVER FRAMEWORK


    The uscore-generic layer provides the essential framework to implement USB device
    drivers above the usbcore module and manage the device. It sits on top of the
    Host Controller Driver Interface (HCI) within the usbcore module and acts as an
    interface to the preceding software layers. The source of framework is available
    in the folder /drivers/usb/core. Files as /drivers/usb/core/urb.c, /drivers/usb/core/generic.c,
    /drivers/usb/core/driver.c, /drivers/usb/core/usb.c, and /drivers/usb/core/message.c
    can be visualized'
