    **Figure 14.6**nSequence of activities during composite driver initialization.


    The composite driver module registers the struct usb_composite_driver to the composite
    framework. The composite framework in turn registers to the gadget framework for
    further activity; a similar sequence is followed when unregistering.


    The next sequence of activity triggered after a successful registration is of
    the driver with the gadget driver. With a composite driver, the bind callback
    adds the composite driver configuration to the composite framework, as shown in
