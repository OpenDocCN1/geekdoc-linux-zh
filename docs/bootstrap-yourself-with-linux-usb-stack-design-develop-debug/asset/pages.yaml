    These functions are the basic infrastructure of the script framework. You can
    expand this infrastructure to support additional class drivers. Furthermore, you
    can contribute and download the tool from the GIT repository git://git.kernelkahani.com.


    # Summary


    The alpha version of this test tool is available on the CD accompanying this book.
