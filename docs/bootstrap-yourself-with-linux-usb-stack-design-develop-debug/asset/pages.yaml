  md: "# Chapter 14 = Class Driver\n\nA successful registration of the struct usb_configuration\
    \ invokes its bind callback. The bind callback of the configuration is responsible\
    \ for adding the composite functions, as illustrated in Figure 14.7. The configuration\
    \ bind callback successfully initializes the struct usb_function data structure\
    \ and invokes add_function. In the loopback functional driver loopback_bind_config,\
    \ add the function to the gadget framework.\n\n```\nstatic int __init loopback_bind_config(struct\
    \ usb_configuration *c)\n{\n    struct f_loopback *loop;\n    int status;\n  \
    \  loop = kzalloc(sizeof(*loop), GFP_KERNEL);\n    if (!loop)\n        return\
    \ -ENOMEM;\n\n    loop->function.name = \"loopback\";n    loop->function.descriptors\
    \ = fs_loopback_descs;\n    loop->function.bind = loopback_bind;\n    loop->function.unbind\
    \ = loopback_unbind;\n    loop->function.set_alt = loopback_set_alt;\n    loop->function.disable\
    \ = loopback_disable;\n    status = usb_add_function(c, &loop->function);\n  \
    \  if (status)\n        kfree(loop);\n    return status;\n}\n```\n\nThe next step\
    \ in the process is to implement the bind callback of the functional driver. The\
    \ bind process involves configuring the endpoints of the device that is required\
    \ for the functionality of the functional driver. In case of the loopback functional\
    \ driver, it binds two endpoints in the bind callback loopback_bind.\n\n```\n\
    static int __init loopback_bind(struct usb_configuration *c, struct usb_function\
    \ *f)\n{\n    --cut-\n    loop->in_ep = usb_ep_autoconfig(cdev->gadget, &fs_loop_source_desc);\n\
    \    --cut-\n    loop->out_ep = usb_ep_autoconfig(cdev->gadget, &fs_loop_sink_desc);\n\
    \    return 0;\n}\n```"
