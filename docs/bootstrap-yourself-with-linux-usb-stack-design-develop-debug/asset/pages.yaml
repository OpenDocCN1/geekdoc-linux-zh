    the mass storage device, the functional driver module provides module parameters.


    +   - **file.** To name the files or block devices that back storage.

    - **ro.** To indicate whether the storage is read only. This holds a default value
    of `false`.

    - **removable.** To indicate whether the storage is removable media. This holds
    a default value of `false`.

    - **luns.** To indicate the supported LUNs.

    - **nofua.** To indicate whether the storage supports force unit access (FUA).
    This holds a default value of `false`.

    - **stall.** To indicate whether the storage driver can stall bulk endpoints.

    - **cdrom.** To indicate whether the storage device is a CD-ROM that holds a default
    value of `false`.

    - **transport.** To specify the transport protocol, namely CB (Control/Bulk),
    CBI (Control/Bulk/Interrupt), and BBB (Bulk Only). The default value is `BBB`.'
