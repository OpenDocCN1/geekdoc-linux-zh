- pgno: 271
  md: '# CHAPTER 18


    # DEBUGGING USING LINUX USB


    In This Chapter


    +   - USB Monitor: usbmon

    - Debug Using usbfs_snoop

    - Verbose Debugging for Host-Side USB


    For a developer, developing a system is simple, but debugging the same system
    to find the root cause of the problem requires extra ingenuity. This ingenuity
    can come from tools that can collect information on the system''s state at the
    time of the problem. The complexity increases when the system to be debugged is
    part of a kernel subsystem. You can use many approaches to debug a kernel subsystem.
    Printing debug information in American Standard Code for Interchange (ASCII) text
    form is a common method developers use to debug modules in the kernel space. However,
    printing this information has limitations in terms of buffer size available. Also,
    sometimes an increase in information nullifies the problem.


    So what does a protocol system such as universal serial bus (USB) need? In a protocol
    system, packet transfer detail is the key to debugging. Thus, details of USB transactions
    between a device and a host help isolate and fix the cause of a problem. Printing
    of so much information in ASCII text is not advisable from a practical standpoint.
    Moreover, it is difficult to print complete transaction information from low-level
    layers in any closed operating system.'
  merge: -1
  img_proc: true
- pgno: 272
  md: 'Linux is an ideal platform for such debugging because it provides complete
    access to the entire protocol layer. To debug a USB system, Linux uses the traditional
    ASCII text printing method, which provides limited user-readable information on
    USB transactions and a software-based USB packet capture tool usbm that can hook
    up USB packet transfers and share them to the user through the Linux debug file
    system.


    This chapter explores the tools available on Linux that assist in debugging a
    USB subsystem. Initially, you learn how to configure USB packet capture usbm on
    Linux, followed by a quick bootstrap session on the design of usbm and how to
    use it. This chapter also looks at how to use usbfs_snoop, a lighter tool available
    on Linux that can capture USB transactions occurring between the user space drivers
    and uscore module via the usbfs file system. Subsequently, you can see the kernel
    configuration option to configure verbose debug informa of the Linux-USB subsystem.


    # USB MONITOR: USBMON


    As discussed, debugging any system requires the proper tools and an approach that
    identifies the root cause of a problem. A common method of debugging a protocol
    system is to capture the packets it transmits. There are hardware sniffers and
    analyzers available for most protocols. They capture packets at the physical level
    and present the packet to the user in a human-readable form. For USB, companies
    such as LeRoy and Ellisys provide USB protocol analyzers that can capture USB
    transactions at the physical level and display the captured data in a human-readable
    form using graphical interfaces.


    A typical USB analyzer setup capturing USB protocol transaction is illustrated
    in Figure 18.1.


    Individual hackers and smaller teams generally cannot afford these hardware setups.
    An effective alternative to hardware sniffers is capturing packets using software
    at a higher layer than the physical layer. Referred to as software packet sniffers
    or packet analyzers, these act as effective alternatives to hardware tools. One
    such packet analyzer tool is the commonly used tcpdump, which enables debugging
    of networking protocols. A similar packet analyzer tool is available for USB on
    Linux to capture USB transfers between the USB host and the device. This section
    walks through implementation of a USB packet analyzer on Linux'
  merge: -1
  img_proc: true
- pgno: 273
  md: '![](img/779a74a6577501a55983f193067274a3_273_0.png)


    ### Figure 18.1

    A typical USB analyzer setup.


    and subsequently explores how to use it to capture USB packets for debugging any
    USB system.


    USB monitor, or usbmon, is the Linux implementation of a USB packet analyzer.

    The usbmon module is a developer feature that is not generally available on a
    preinstalled Linux package. You need to rebuild the kernel after enabling the
    USB monitoring option in the kernel configuration.


    Note


    > The usbmon module uses the debug file system (debugfs) feature. For usbmon to
    be functional, ensure that the debugfs feature is configured as part of the kernel.


    Figure 18.2 illustrates the USB Monitor usbmon option in the Linux kernel configuration.
    It is available from Device Drivers, USB Support, USB Monitor.


    For a platform developer, understanding how to use usbmon is the most interesting
    and useful part. However, to use usbmon effectively, it''s necessary to understand
    its features and its capability.'
