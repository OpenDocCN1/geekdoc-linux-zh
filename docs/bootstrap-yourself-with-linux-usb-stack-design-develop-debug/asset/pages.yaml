  md: '# Table 17.2 Device Operations


    | Operation | Description |

    |---|---|

    | usb_open | To interact with a device, you have to establish a proper channel.
    The usb_open API returns a handle to the device of interest. The function internally
    opens the device using the virtual file path. |

    | usb_close | The usb_close API allows you to close a particular device using
    the handle returned by the function. |

    | usb_set_configuration | A device can have multiple functionalities, as indicated
    through the configuration descriptor. The application in the host can select a
    particular configuration using this API. Internally, it uses IOCTL_USB_SETCONFIG
    to communicate the application''s requirement to the Linux USB host framework.
    |

    | usb_set_altinterface | USB devices support multiple interfaces in a single device.
    The active setting of the current interface as per the function user application''s
    requirement. Internally, it uses IOCTL_USB_SETINTF to communicate the application''s
    requirement to the uscore module of the Linux USB host framework. |

    | usb_reset | Sometimes applications require reset of a particular endpoint for
    certain needs. usb_reset allows it to use IOCTL_USB_RESET to communicate the application''s
    requirement to the Linux USB host framework. |

    | usb_clear_halt | When errors occur during transfer, endpoints are halted as
    per USB specification. An application may need to clear these halts. usb_clear_halt
    allows allows applications to clear halts that internally use IOCTL_USB_CLEAR_HALT
    to communicate the application''s requirement to the uscore module of the Linux
    USB host framework. |

    | usb_reset | This API allows you to reset the device from the user application.
    Internally, it uses IOCTL_USB_RESET to communicate the application''s requirement
    to the uscore module of the Linux USB host framework. |

    | usb_claim_interface | Applications must claim a particular interface before
    they can start a USB transfer operation. The usb_claim_interface claims an interface
    of a device for the application. Internally, it uses IOCTL_USB_CLAIMFF to communicate
    the application''s requirement to the uscore module of the Linux USB host framework.
    |

    | usb_release_interface | The usb_release_interface is to release a previously
    claimed interface after a successful transfer. Internally, it uses IOCTL_USB_RELEASEINTF
    to communicate the application''s requirement to the uscore module of the Linux
    USB host framework. |'
