- pgno: 17
  md: '# CHAPTER 1


    # USB AND LINUX:

    INTRODUCTION


    In This Chapter


    +   - USB: The Path and the Market

    - Linux USB


    Universal serial bus (USB) is one of the leading components in PC/user and device
    connectivity. More than six billion devices (http://www.intel.com/technology/usb/)
    use USB to connect to a host machine, varying from consumer devices such as cameras
    and mobile phones to networking devices such as routers, medical devices, and
