    # SUMMARY


    The USB host system software stack is complex compared to the device

    counterpart, because USB is a host-driven system. This chapter provided a

    brief overview of the Linux USB host architecture and a simple view of the USB

    host stack. The Linux USB host framework is layered and designed with clean

    interfaces that help you design similar software frameworks. The subsequent

    chapters detail the internal layers of the Linux USB host framework.


