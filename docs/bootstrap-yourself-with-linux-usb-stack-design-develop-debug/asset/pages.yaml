- pgno: 40
  md: '# USB TRANSFERS


    The USB specification defines four transfer types. The transfer type determines
    various characteristics of the communication flow. As per the USB specification,
    a transfer type determines the following characteristics of a USB communication
    flow.


    +   - Direction of communication flow

    - Constraint in the packet size

    - Bus access constraints

    - Latency constraints

    - Required data sequences

    - Error handling


    An application chooses any of the following four transfer types based on the application’s
    requirement.


    # Control Transfer


    The system software uses a control transfer with a maximum size of 64 bytes to
    retrieve information and configure the device as part of the enumeration process.
    A control transfer, which is nonperiodic, is generally used for command/status
    operations initiated by the host software. The USB system makes a best effort
    to deliver the control packet from the host to the device.


    A control transfer occurs in three stages: setup transaction, which is a request
    from host to device; optional data transaction, depending on the type of request;
    and status transaction, which provides status information of the request from
    device to host. These control transfers are performed in message pipes.


    A control transfer’s setup request is defined by Chapter 9 of the USB specification.
    It supports vendor-specific transfers that help retrieve vendor-specific information.


    # Bulk Transfer


    A bulk transfer is used by applications that transfer large amounts of data to
    and from the USB host with no strict time requirements. A USB printer or a digital
    camera is a typical user of bulk transfers. A USB bulk transfer has a'
  merge: -1
  img_proc: true
- pgno: 41
  md: '# USB Transfers


    maximum transfer size of 512 bytes, is nonperiodic, and uses any available bus
    bandwidth. Because bulk transfers occur only on the basis of the bandwidth available,
    the transfers are faster when there are large amounts of free bandwidth.


    A bulk pipe happens on a stream pipe, and the communication flow is either into
    or out of the host for a given pipe. A bulk transfer provides guaranteed data
    with no guaranteed delivery time. A bulk transfer does retry a transfer to ensure
    a guaranteed delivery of data in the case of occasional delivery failure due to
    errors on the bus.


    The data in the bulk transfer is specific to the functional driver. It is not
    defined by a USB format.


    # Interrupt Transfer


    An interrupt transfer is used for nonperiodic, small data and supports a maximum
    packet size of 1,024 bytes. It is generally used to report status information
    (such as a cursor point) or a small amount of data (such as characters from a
    keyboard). This data is delivered in a limited latency; most of the application
    lacks explicit timing requirements.


    An interrupt transfer is transferred in a stream pipe, and the data transferred
    is not USB specific. An interrupt transfer provides guaranteed delivery of data,
    in which the protocol does retry in case of any errors on the bus.


    # Isochronous Transfer


    An isochronous transfer is used for applications such as Web camera or audio transfers,
    which require periodic transfer of data from the device to the host. Because isochronous
    data is continuous and real time, on-time delivery is important. The isochronous
    transfer supports a maximum packet size of 1,024 bytes, and the on-time delivery
    is ensured by allocating a dedicated portion of USB bandwidth. However, the timely
    delivery comes at the expense of potential losses in the data stream


    An isochronous transfer is transferred in a stream pipe, and the data transferred
    is not USB specific. Because isochronous data is bound by time, no retrying attempt
    to deliver the data is made for bus errors.'
  merge: -1
  img_proc: true
- pgno: 42
  md: '# Chapter 2 = USB: An Overview


    For a complete understanding of the transfer types defined by USB specification,
    read Chapters 5 and 8 of the USB specification.


    # TERMS TO REMEMBER


    Besides the terms already introduced in this chapter, here are some others you
    will come across when you study or implement USB software.


    **Short packet.** A short packet can be defined as a packet payload shorter than
    the maximum size or zero length packet (ZLP). A short packet could indicate the
    end of a transfer.


    **Zero length packet (ZLP).** A zero length data transfer does not contain data
    part of the transfer. When the data to be sent is an exact multiple of wMaxPacketSize,
    a ZLP has to be sent after the data transfer is complete to indicate the end of
    the transfer. Sometimes a ZLP feature is implemented as part of the hardware or
    has to be taken when designing Chapter 9/USB.


    **STALL.** A STALL indicates that a function is unable to transmit or receive
    data or even a control pipe request is not supported. The state of a function
    after returning a STALL is undefined.


    # SUMMARY


    The USB specification is huge and detailed, so it is difficult to summarize in
    a small chapter. However, this chapter captures some important topics that are
    essential for an understanding of the USB software system. The device identification,
    management, and data flow constitute the major portion of the USB software system,
    and most of the complex protocols in the physical and link are implemented as
    part of USB hardware. As a USB software developer, generally if you read Chapters
    4, 5, and 9 of the specification, the functional details referred to as USB class
    are defined in separate USB class specifications, which must be read based on
    the USB function you are planning to study or implement. The “More Reading” section
    that follows provides details on the USB specifications.'
  merge: -1
  img_proc: true
