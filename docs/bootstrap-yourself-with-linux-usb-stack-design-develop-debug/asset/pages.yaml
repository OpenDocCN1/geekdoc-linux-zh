    # Host Software


    The host software module implements the USB host protocol requirements of the
    USB specification. This includes detecting the attachment and removal of devices,
    supporting the enumeration process, and transferring data. The operating systems
    running on the platform for managing devices generally provide the host software.


    # USB Driver


    The USB driver (USBD) module implements the necessary protocol interface between
    the client application and the system software—the USBDI—and provides the necessary
    interface between the HCD and the system software: the Host Controller Driver
    Interface (HCDI). The HDI is designed to provide a generic interface between the
    HCD and the system software. This allows the system to work with any HCD without
    modifying the system software design. The USBD also'
