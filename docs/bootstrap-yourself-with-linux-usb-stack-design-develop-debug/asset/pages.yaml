- pgno: 177
  md: '# CHAPTER 13


    # GADGET DRIVER


    In This Chapter


    +   - Bootstrap Essentials: Gadget Driver

    - Gadget Driver: Design

    - Gadget Driver: Implementation


    The gadget driver is an important infrastructure in the USB gadget subsystem.
    It is built in a flexible way that allows the upper class or the functional driver
    to manage the system effectively. The gadget framework is the core of the Linux
    USB gadget subsystem; it provides a framework for the USB device framework, as
    described by USB Specification (Chapter 9). It also performs other USB device
    management operations that are specific to the implementation. The gadget driver
    provides the framework required for a USB device to operate and expects intelligence
    of configuring the device from the gadget driver or the upper layer. Such a design
    offers flexibility to develop class drivers with different device configurations
    and functionality.


    This chapter first explores the essential gadget data structures defined by the
    gadget driver. From there, it discusses the gadget framework’s flow of activity
    and the way other layers use the gadget framework. Finally, this chapter analyzes
    a gadget driver implementation with a practical example.


    ![](img/779a74a6577501a55983f193067274a3_177_0.png)'
  merge: -1
  img_proc: true
- pgno: 178
  md: "# BOOTSTRAP ESSENTIALS: GADGET DRIVER\n\nThe gadget driver relies on four major\
    \ data structures: struct usb_gadget to represent a gadget device, struct usb_ep\
    \ to manage the device hardware, struct usb_gadget_driver to manage the device\
    \ function, struct usb_request to manage USB transfers. These data structures\
    \ hold key information for the gadget layer and methods that extend the gadget\
    \ infrastructure to other layers. These data structures and methods are defined\
    \ in include/linux/usb/gadget.h of the Linux kernel source. The next section explains\
    \ the methods that these key data structures extend.\n\n# USB Gadget Data Structure\
    \ and Methods\n\nThe struct usb_gadget represents the USB device within the gadget\
    \ layer. struct usb_gadget uses methods to perform hardware-specific operations\
    \ and maintains gadget-related information, such as endpoint lists. Thus, this\
    \ data structure acts as an abstraction of the hardware. Its members are most\
    \ read only.\n\n```\nstruct usb_gadget {\n    const struct usb_gadget_ops *ops;\n\
    \    struct usb_ep *ep0;\n    struct list_head ep_list;\n    enum usb_device_speed\
    \ speed;\n    unsigned is_dualspeed:1;\n    unsigned is_otg:1;\n    unsigned is_a_peripheral:1;\n\
    \    unsigned b_hnp_enable:1;\n    unsigned a_hnp_support:1;\n    unsigned a_lt_hnp_support:1;\n\
    \    const char *name;\n    struct device dev;\n};\n```\n\nNotice that struct\
    \ usb_gadget defines only a basic set of gadget information. When you are developing\
    \ a gadget layer for a USB device, you might need additional gadget-related information.\
    \ You can define a data structure that is a superset of struct usb_gadget, which\
    \ can hold additional information.\n\nThe struct usb_gadget declares the struct\
    \ usb_gadget_ops member to export the hardware-specific operations. These gadget\
    \ operations extend gadget"
