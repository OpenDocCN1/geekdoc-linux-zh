  md: '# CHAPTER 4


    # LINUX USB HOST DRIVER


    In This Chapter


    +   - Overview of a General USB Host Stack Architecture

    - Overview of Linux USB Host Stack Architecture


    The universal serial bus (USB) protocol is a host-driven software system consisting
    of three major layers: the USB interface, the USB system, and the client software.
    The USB system software is implemented as part of the Linux kernel; the rest of
    the layer is outside the scope of this chapter. The USB system software consists
    mostly of the host controller driver (HCD) and a framework for the USB protocol.
    The system software sometimes adds functionality that is specific to the implementation,
    which makes the system more functional. You will learn about additional functionality
    that the Linux USB host stack provides in the subsequent chapters of this part.


    This chapter initially explores the generic USB host software, detailing what
    a host stack looks like. It subsequently explores the Linux host stack architecture
    and provides a starting point to study the USB host stack.


    # OVERVIEW OF A GENERAL USB HOST STACK ARCHITECTURE


    On a typical USB host system, the hardware implements most of the USB protocol
    and the physical layer. The system software consists of host controller'
