  md: '# CHAPTER 5


    # USB DEVICE NOTIFICATION


    In This Chapter


    +   - Bootstrap: Notifier Chain

    - Linux USB Notification


    Request-reply (synchronous) and polling methods are common means of communication
    between software modules. Such methods reduce the performance of the system; they
    waste processor cycles. Asynchronous methods and publish-subscribe methods act
    as effective alternatives to address performance-related issues. Linux uses publish-subscribe
    methods to communicate between modules. In the publish-subscribe model, the client
    (subscriber), which requires notification of a certain event, registers a callback
    function with the server (publisher). The server informs the client whenever an
    event of interest occurs through the registered callback. Such a model reduces
    the bandwidth requirement and because the client no longer needs to periodically
    request new data.


    For a subsystem as universal serial bus (USB) that supports hot plugging of devices,
    an effective message-passing system is important. Assume a scenario in which a
    USB device is plugged in the platform, and the usbcore driver detects it. Once
    the USB device is configured to the usbcore, you need to create a Virtual File
    System (VFS) file. You then need to pass on this device addition message to the
    module that handles the USB file system. How does the Linux USB'
