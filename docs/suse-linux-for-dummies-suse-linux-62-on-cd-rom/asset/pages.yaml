  md: '# Chapter 16: Surfing the Web


    # Getting E-Mail


    Now that you can surf the Net, you probably probably want to tell people about
    your adventures. Well, Netscape can send and receive e-mail, too.


    Go to the main window of Netscape and you see one of two menu items, Communicator
    or Window. Click either of these and then click the Messenger Mailbox option.
    You are taken to the Mail side of Netscape, as shown in Figure 16-12.


    To get your mail, simply click the Get Msg icon. This tells Netscape to make contact
    with your mail server and see whether any e-mail messages are waiting for you.
    If you have no e-mail, text at the bottom of the screen tells you so. If you have
    e-mail, the subject and sender appear in the center of the screen and the e-mail
    message itself appears in the bottom of the screen, as shown in Figure 16-13.


    ![](img/96a9ce6a13d8d15ed05f867f41574278_298_0.png)


    Figure 16-12: The Netscape Mail & Discussions window.'
  merge: -1
  img_proc: true
- pgno: 299
  md: '# 272 Part V: Going Online


    ![](img/96a9ce6a13d8d15ed05f867f41574278_299_0.png)


    16-13: Receiving an e-mail message.


    If you have multiple e-mail messages, you can see each one by clicking the Subject
    line in the middle window. You may reply to, forward, or delete the particular
    message by highlighting its Subject line and clicking the appropriate icon (Reply,
    Forward, or Delete). When you click the Reply icon, the address of the person
    you''re replying to appears automatically in the To field of the reply. When you
    forward a message, a copy of the message is sent as an attachment to the address
    you specify.


    # It slices, it dices, it evens...


    Netscape can do much more than what we describe in this chapter, such as retrieve
    (downloadload) files from the Internet and keep an address book. These topics
    are beyond the scope of this book.


    For more information, we recommend The Internet For Dummies, 6th Edition, by Levine
    Young, and Baroudi (published by IDG Books Worldwide, Inc.).'
  merge: -1
  img_proc: true
- pgno: 300
  md: '# Chapter 16: Surfing the Web


    # Sending E-Mail


    To send an e-mail message, you have to know the recipient''s e-mail address.

    Just as a URL contains certain components, an e-mail address is made up of the
    person''s e-mail name (often the same as his or her login name) and domain name.
    For example, to send an e-mail to the President of the United States, you address
    it to president@whitehouse.gov.


    Your ISP should have given you an e-mail address, and you can ask your friends
    for their e-mail addresses. It''s the height of irony when people first get on
    the Internet and can send e-mail, they invariably spend a lot of time calling
    their friends on the telephone to get their e-mail addresses.


    With the Mail & Discussions window on the screen, click the New Msg icon. To the
    window like the one in Figure 16-14 appears.


    Below the row of icons near the top of the window is the word To. To the right
    is a white space where — after you click in it — you can type the e-mail address
    of the person you are trying to reach. Just for fun, sending a letter to your
    own e-mail address. Then if you receive it properly, you''ll have did everything
    correctly:


    ![](img/96a9ce6a13d8d15ed05f867f41574278_300_0.png)


    Figure 16-14: Compose window for new messages.'
