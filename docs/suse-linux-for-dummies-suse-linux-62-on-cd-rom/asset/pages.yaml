    The mail compose window of exmh(1).


    # Commercial mail interfaces


    As with the text editors, several commercial mail interface programs are available.
    Some are sold as sole programs; others are part of application suites. One such
    product is Zmail, from NetManage Software. Zmail has been ported to many UNIX
    systems and also to Windows 3.1, 95, 98, and NT. Because Zmail works across many
    systems, you can use the same mail interface on all your platforms.


    Another commercial mail interface is found in Applizware, produced by Applix,
    Inc. This product is an office suite consisting of a WYSIWYG (what-you-see-what-you-get)
    text processor, an integrated spreadsheet presentation package, a graphical editor,
    and a mail front end. In Figure 2-9, you can see the word processing package over
    to the left, the presentation package in the upper center, and the spreadsheet
    package in the lower center.


    In addition to Applizware Office suite, another office suite is popular among
    Linux users: StarOffice. StarOffice is a full-featured office suite that was gained
    by so much popularity among Linux users that it was bought by SUN Microsystems.'
