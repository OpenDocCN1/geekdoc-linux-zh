- pgno: 278
  md: '# Chapter 15: Setting Up Your Internet Connection


    After you choose your Internet service provider and arrange payment, the ISP provides
    you with certain pieces of information, including the following:


    +   - Telephone access numbers

    - A username (usually the one you supplied)

    - A password (usually the one you supplied)

    - An e-mail address, which is typically your username added to its domain name

    - A primary Domain Name Server (DNS) number, which is a large number separated
    by periods into four groups of digits

    - A secondary Domain Name Server (DNS) number, which is another number separated
    by periods into four groups of digits

    - An SMTP (mail) server name

    - An NNTP (news) server name

    - A POP3 server name, which is used to download e-mail from the ISP''s server
    to your machine


    The ISP might also give you software on a CD-ROM or a floppy to help you get your
    account working, but this software probably works only with Microsoft operating
    systems. That''s okay, because your Linux distribution has more than enough software
    to use with the Internet and to help you get your account working.


    # Connecting Your Modem


    To use Linux with the Internet, you must have at least one of these devices:


    +   - A serial modem

    - An ISDN line

    - A broadband connector of some type (such as Ethernet, FDDI, a cable modem, or
    ATM)


    For the second and third items, or someone you know (your boss, your systems administrator,
    or your 10-year-old) probably arranged for you to get the connection and even
    set up your computer for it. The serial modem is a device that you might have
    chosen yourself, or it may have come with your computer, and therefore you may
    have little knowledge of how to use it with Linux. For the rest of this chapter,
    we assume that you are connecting your system to the Internet using a serial modem
    and a telephone line.'
  merge: -1
  img_proc: true
- pgno: 279
  md: '# 252 Part V: Going Online


    Modems, quite simply, do three main functions:


    +   - Convert digital information into tones that go across telephone lines (and
    vice versa)

    - Dial the telephone number you want to reach and make the connection with a modem
    at the other end

    - Negotiate with the modem at the other end for the speed to use when sending
    bits of information


    # Types of modems


    Modems can be either internal or external. An external modem stays in its little
    box and usually plugs into a wall outlet for power, the telephone line for the
    connection, and into a serial connector on the back of your computer. An internal
    modem is usually plugged into a slot on the motherboard inside the computer case.
    (Some internal modems are built directly onto the motherboard.) To the computer
    and operating system, an internal modem appears as if it were two or more serial
    ports. Internal modems draw their power from the computer system, and they plug
    into the phone jack.


    Usually, internal modems are less expensive than their external counterparts,
    but some people like external modems because they can hook them up to different
    computer systems by simply unplugging the serial line from one system box and
    plugging it into another.


    A third type of serial line modem is a PCMCIA card (sometimes called a PC card).
    These are used most often with laptop computers.


    Internal modems come in two flavors: hardware and software. Winmodems are not
    supported by Linux.


    If you have an external modem or an internal modem that has jumpers and is jumpered
    for a specific serial port, you can skip ahead to the section titled "Finding
    the serial line." If you have a plug-and-play modem, you first have to configure
    your system, which is described in the next section.


    ![](img/96a9ce6a13d8d15ed05f867f41574278_279_0.png)


    # Configuring a plug-and-play modem


    If you have a plug-and-play modem, you need to create a configuration file for
    the modem. This must be done when you are logged in as the root user. The steps
    to do this are:


    +   - Use the pnpdump program to probe your plug-and-play devices and direct that
    output to the plug-and-play config file:'
