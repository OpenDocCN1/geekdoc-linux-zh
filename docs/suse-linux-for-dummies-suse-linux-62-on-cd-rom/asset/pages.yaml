- pgno: 217
  md: '# 190 Part III: Using Linux


    ![](img/96a9ce6a13d8d15ed05f867f41574278_217_0.png)


    The graphics server is a program that talks to the video card, keyboard, and mouse
    on your system. It receives commands from the set of graphics libraries incorporated
    into programs. Sometimes these programs are executed directly on the same system
    where the graphics device resides; other times, these programs talk across a network
    to a graphics device on another system. Using X Window System, you can run your
    program in one part of the world and someone can see the output of it in another
    part of the world over the Internet.


    The server program, often called X Server, is not part of the operating system,
    as it is in some other operating systems. Instead, X Server is a user-level program
    — a special and complex one.


    Three main types of programs use X Window System:


    +   - Window managers

    - Terminal emulators

    - General applications


    # But I don''t do windows!


    Window managers are programs that receive commands indirectly from the user through
    mouse clicks and presses. The window manager passes those commands to the set
    of graphics libraries mentioned a few paragraphs back. The graphics libraries
    then communicate with the server to manipulate windows on the graphics device,
    which is usually your screen.


    The window manager acts like a playground monitor; it''s the central point of
    control for the major windows on the screen (and even some windows that can''t
    be seen). The window manager can also serve as a desktop, where you can use it
    to launch applications. A window manager isn''t necessary, but it would be difficult
    to use more than one or two applications at once also using a window manager.
    (The applications would need to be written to allow resizing, window positioning,
    and so on.)


    Here are some typical window manipulations:


    +   - Move a window around a screen

    - Move a window smaller or larger

    - Overlap a window with another one

    - Bring an overlapped window into full visibility (called raising a window)

    - Send a window into less visibility (called lowering a window)

    - Move a window very small but still accessible (called identifying a window)'
  merge: -1
  img_proc: true
- pgno: 218
  md: '# Chapter 11: Windows on the World


    Window managers may also maintain an icon bar, which keeps icons easy to find
    and manage, as well as performs other functions. But the most important thing
    to remember about window managers in X Window System is that they are just user-level
    programs, like any other. They are not part of the system. You have a choice of
    window managers, and each has different capabilities, although a discussion of
    these window managers and capabilities is outside the scope of this book.


    # With these smarts, why should I play dumb?


    The second main category of program under X Window System is the terminal emulator,
    a program that emulates dumb character-cell terminals. You may be wondering why
    you would simulate a dumb, inexpensive terminal when you paid a lot of money for
    a graphics monitor. Shouldn''t every program be graphical?


    In the early days of X Window System, few graphical programs were available. Most
    programs were written to run on character-cell terminals and did not include the
    libraries that create graphical programs on X Server. Therefore to run both character-cell
    and graphical programs, the dumb terminal had to be emulated through software.
    The main terminal emulator in Linux is xterm. The xterm program simulates both
    a Digital VT102 and a Tektronix 4014 terminal. Most character-cell programs were
    written to drive these terminals.


    If you start xterm, it immediately executes a shell and gives you a command-line
    prompt. You type commands, and the results are output to the window containing
    xterm. You can use xterm to start the execution of a totally graphical-based program
    such as xedit or xfig by typing the name of that graphical-based program on the
    command line presented by xterm.


    # Now the good stuff!


    The third main type of program is the general application, and this can range
    from text editors such as xedit (which looks a lot like a terminal emulator but
    is much different) to applications such as xfig (which manipulates images) and
    xpaint (which enables you to draw objects) to games such as Doom. These programs
    would be impossible (or at least very hard) to run on a character-cell terminal.'
  merge: -1
  img_proc: true
- pgno: 219
  md: '# 192 Part III: Using Linux


    # Two operating system in one


    The Linux is two, two, interfaces in one. Linux consists of both a command-line
    interface (like found in MS-DOS) and a graphical interface (X Window System).
    X Window System is said to "sit on top of" the command-line operating system.
    This allows total access to the operating system through a command-line interface
    as well as through a graphical interface. (Some operating systems provide you
    with only a graphical interface.)


    The SuSE Linux For Dummies CD-ROM includes a window manager with the KDE, which
    stands for the K Desktop Environment. You can use KDE to start applications (and
    stop them of course), move windows, shrink windows, expand windows, and do everything
    but wash windows. Just think, you can use your system without ever typing a command
    line.


    ![](img/96a9ce6a13d8d15ed05f867f41574278_219_0.png)


