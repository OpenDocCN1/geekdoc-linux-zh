    # Power Incarnate


    When you want to use Linux, you must log in as a particular user with a distinct
    login name. Why? Linux is a multiuser system, and as, it uses different accounts
    to keep people from looking at other people''s secret files, erasing necessary
    files from the system, and otherwise doing bad things.


