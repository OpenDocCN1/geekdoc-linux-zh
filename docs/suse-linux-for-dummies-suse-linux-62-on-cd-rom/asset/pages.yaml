  md: 'You can have dozens or even hundreds of background processes. If they all

    accepted data from the keyboard at the same time, how would you know

    which program is receiving the data? Therefore, each program has to wait

    until you recognize it, bring it into the foreground, enter the necessary data,

    and put it back into the background, where it blissfully keeps running

    until it terminates or again needs input from the keyboard (or standard input,

    as you have come to know it). Now you know why largejob was waiting to

    accept such valuable and timely input.'
