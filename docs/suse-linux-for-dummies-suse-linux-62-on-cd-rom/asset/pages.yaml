- pgno: 268
  md: 'potential for reading or writing data? The peak potential depends on the disk
    speed, how much data you are writing, and the order in which the data is written
    back to the disks.


    In the literature that came with your disk, you should be able to find times for
    the following:


    +   - Moving the head from cylinder to cylinder

    - A full seek over the entire surface of the cylinder-to-cylinder seek

    - An average seek (average being between the cylinder-to-cylinder seek and moving
    the disk head completely across the disk)

    - One rotation; half this rotation is called the average rotational delay


    Normally, in finding out disk capacity (or the average potential through your
    disk), you add one rotational delay, plus the average seek time, plus the rotational
    delay for the data to be read under the disk head. Depending on how much data
    you are reading, this can be up to one full rotational delay. If you need to read
    more data than that, you have to move the disk head again and reinstate the read,
    which may mean waiting another average rotational delay before the disk lines
    up with the data again.


    On average, take one-half the rotational delay and one average seek for each read.
    This is your average access time. Suppose this is 100 milliseconds, or one-tenth
    of a second. Maybe the system can do 10 reads or writes to the disk, on average
    (or 600 reads or writes to the disk every minute). If you look at information
    from successive procinfo commands, you can get a feeling for how many disk I/Os
    your system is doing as opposed to how many it could be doing.


    Remember the numbers reported by procinfo are averages taken over time. If the
    numbers are close to the maximum, you may have periods in which the disk is trying
    to answer every request but is overwhelmed by the number of I/Os. The bottom line
    is that you have to wait for your disks.


    ![](img/96a9ce6a13d8d15ed05f867f41574278_268_0.png)


    Trying to reduce the number of I/Os to any one disk by spreading the load over
    several disks is important and can sometimes help a slow system — without the
    need for a CPU upgrade.


    # Multiple swap partitions


    If your system is paging and swapping heavily you want multiple swap partitions,
    rather than having just one, and distributing them across your disk drives. This
    will help alleviate disk contention because your programs will be swapped and
    paged multi-disk instead of just one. On Intel systems, Linux is limited to 128MB
    per swap partition and up to 16 swap partitions per system.'
  merge: -1
  img_proc: true
- pgno: 269
  md: '# 242 Part IV: Maintaining Your System


    # Kernel Building


    One of the items that may be slowing down your system is a kernel that is not
    tailored to your hardware or your needs. This has two major disadvantages:


    +   - You may have your kernel compiled for a processor you don''t have.

    - You have more instructions and data than you need in your kernel.


    This section describes both cases and what you can do to change the situation.


    # Tailoring a kernel for your processor


    Many Linux distribution kernels were compiled to install onto the largest range
    of systems. Therefore, they are compiled to run on the slowest processor of a
    particular architecture (Intel, Alpha, and so on). In the Intel side of the house,
    this typically means that the installation kernel (the one you install from the
    CD-ROM or the one on the boot floppy) is made for an Intel 386, not a Pentium
    Pro.


    To take advantage of the Pentium Pro''s power (for the most part), you need to
    at least rebuild the kernel portion of Linux, specifying the processor you have.
    To do this:


    +   1. Log in as root.

    2. Type code /usr/src/linux at the system prompt.

    3. Type make menuconfig.


    If this directory does not exist, you probably didn''t install the kernel sources
    from your distribution of Linux. If you followed the instructions in this book,
    utilizing the SuSE Linux For Dummies CD-ROM, these kernel sources should be in
    place.


    The screen looks like that shown in Figure 14-2.


    +   4. Use the arrow keys to reach Processor type and features: press Enter to
    select that entry.


    The General setup menu appears, similar to that shown in Figure 14-3.


    +   5. Use the arrow keys to move down to Processor family (it should be selected
    by default) and press Enter to select it.


    A menu of all supported Pentium processors appears, as shown in Figure 14-4.'
