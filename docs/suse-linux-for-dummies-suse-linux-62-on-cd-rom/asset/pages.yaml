  md: '# Chapter 5: Installation: Down to the Final Stretch


    # # All about files


    Linux, like UNIX, refers to everything as a file. In other words, the name for
    a device such as a hard drive is the file address of its driver. For example,
    `/dev/hda` is the name of the first IDE hard and `/dev/sdb` is the name of the
    second SCSI hard drive.


    referred to as *sda, sdb, sdc*, and so on. (The hd stands for hard drive, and
    the *sd* stands for SCSI.)


    Linux refers to disks and partitions using a system of letters and numbers, which
    may seem confusing to the DOS or Windows user. Following is a short description
    of the conventions for hard drives and partitions.


    Numbers designate partitions. Linux supports only four partitions, but one may
    be an extended partition, that is subdivided into more logical partitions. The
    numbers 1, 2, 3, and 4 denote primary partitions; the logical partitions start
    at a5. For example, `/dev/hdb3` is the name for the third primary partition on
    the second IDE hard drive. In a SCSI world, `/dev/sdc6` is the name for the second
    logical partition on the third


    Letters refer to the device on which the partition is located. IDE hard drives,
    for example, are named *hda, hdb, hdc*, and so on. SCSI drives are


    A happy medium that we use is to create a root partition that includes the `/usr/tmp`,
    `/usr/src`, and `/usr/local/opt` directories, another partition for swap space,
    another partition for /home. On larger systems with more disks, we create additional
    partitions. The preceding list shows the order we sometimes use when creating
    separate partitions, in priority from top to bottom, stopping when the disk space
    is becoming too fragmented.


    +   - If you have two IDE (EIDE) drives: The root partition must be on one of
    them. If one hard drive and the CD-ROM drive are on the primary controller, the
    *root* partition must be on that hard drive.


    +   - If you have one IDE drive and any SCSI drives: The root partition must be
    either the IDE drive or on the SCSI drive that is ID 0. Other SCSI IDs will not
    work.


    +   - If you have no IDE drives but have SCSI drives: The root partition must
    be on either ID 0 or ID 1; no other SCSI ID will work.


    +   - Your Linux kernel must live below cylinder 1023: This requirement exists
    because the BIOS cannot "see" far out on the disk, beyond the 1023 cylinder. The
    major booting process for Linux, called LILO, depends on the BIOS for some of
    its functions; if the Linux kernel is beyond cylinder 1023, LILO cannot find it
    and start the booting process.'
  merge: -1
  img_proc: true
- pgno: 103
  md: '# 76 Part II: Installing SuSE Linux


    On IDE devices, cylinder 1023 is generally below the 512MB mark for SCSI drives,
    it is usually below the 1GB level. If you are using smaller disks, you''re probably
    okay. Otherwise, you probably need to take this issue into account as you are
    installing the system. The easiest way to ensure the kernel is located on cylinders
    0 to 1022 is to make your entire root partition below the 1023rd cylinder level;
    you can specify this with the fdisk program when you get disk partitioning. Newer
    versions of BIOS support Logical Block Addressing (LBA), so they may not have
    this limitation. By using LBA, you can fool the BIOS into seeing the disk as having
    less than 1023 cylinders.


