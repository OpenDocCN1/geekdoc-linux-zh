- pgno: 346
  md: '# Appendix B: The linux man Pages 319


    This list has lots of environmental variables, but we can''t describe them all.

    Here are the most important ones:


    +   - PATH tells all the places to look for commands

    - HOME tells cd where to go when you don''t supply any arguments

    - OSTYPE tells the shell and what operating system they are on


    Different shells have different ways to set these variables (and create and others)
    to tell the commands what to do.


    Note that a variable not set to some value (null) is different from a variable
    that doesn''t exist (unset), and these differences vary from command to command.
    For example, in the preceding list, the first variable, USER, is set to NULL.
    The fact that it is there at all is significant. The fact that it is set to NULL
    instead of some other value is also significant to various programs.


    # Diagnostics


    Error messages or exit codes indicate that something has gone wrong in the program
    or the shell. Normally, UNIX error messages are terse. Sometimes things may seem
    to be wrong, but they are really okay. For example, most new users of UNIX think
    that when they issue an ls in an empty directory, they should get an error message
    such as directory empty or file not found. The problem? The command ls itself
    can display the filenames in any order (as opposed to ls *, which displays the
    files in alphabetical order). Therefore, if you have a directory with three files
    in it named file, not, and, found, you couldn''t determine whether the directory
    is empty or not. Granted, this is a contrived example, but the developers of UNIX
    thought less is better than more (we''re not talking about the command names less
    and more), and silence is golden (which means if you''ve ever heard old ones,
    noisy, hardcopy terminals).


    Most programs display an exit code, which you normally don''t see unless it is
    a non-zero code, which means the program ended unsuccessfully. If you are a programmer,
    you can test for this, and if you do programming or shell script writing, we encourage
    you to set and test exit codes.'
  merge: -1
  img_proc: true
- pgno: 347
  md: '# Bugs/Deficiencies


    Yes, all programs have bugs, and most Linux people are good about correcting them.
    But some bugs are so arcane that they affect only one in a million people, and
    to try to correct them would mean redesigning the entire program. Therefore, this
    type of bug is regarded as a deficiency or a limitation and is listed in the man
    page.


    # Compatibility issues


    When a new version of a command or a program comes out, it may work slightly differently
    than the old command or program. This can cause a compatibility issue with shell
    scripts that have been written to use the old command or program. If the author
    of the command or program thinks there will be a problem, it should be documented
    here.


    # Caveats


    Caveats are warnings that the programmer wants to give the user of the command
    or program. Caveats might include things to think about before executing the command
    or program, security issues, or how much file system space the program uses on
    large applications.


    # Disclaimers


    Disclaimers are usually legal statements included at the insistence of the author''s
    employer or the employer''s lawyers, telling you that if you use this program
    and it harms someone, don''t come back to them. All programs in operating systems
    have this someplace.


    # Authors


    The authors are simply the people who wrote the command or program that the manual
    page is describing. Often, this section also explains how to report bugs or discuss
    new features you may want to see.'
  merge: -1
  img_proc: true
- pgno: 348
  md: '# Acknowledgments


    The acknowledgments section, which is much more pleasant than the disclaimers
    section, recognizes the previous work put into a program that the author has built
    on. This is the essence of Linux and the GNU Public License, to allow and encourage
    people to build on the work of others.


    # Debugging options


    Some programs, as sendmail, have the capability to diagnose problems. If the manual
    page has a debugging options section, you can find information on setting and
    using these options to debug the program.


    # Configuration files


    Along with options and environmental variables, another way to tell the program
    that the manual page is describing how to operate through configuration files,
    sometimes known as startup files. These files may be in your home directory, a
    systemwide directory, or a sitwide directory. They are often looked for in a certain
    order: Sitwide files have the strongest influence. Systemwide files and local
    user (your startup) files have the second and third strongest influence, respectively.
    This enables systems administrator to set policies across companies and systems,
    while allowing you to tailor the program to your needs.


    Examples of startup files are .bashrc file, which is probably in your home directory,
    and the /etc/bashrc file in the /etc directory. Note that the file in your home
    directory starts with a period. This type of file is called a hidden, or dot file.
    Hidden files are not normally seen when you list your directory, unless you issue
    the ls -a or ls .* command.


    # Copyrights


    People think Linux code or other freeware code is not copyrighted. This is typically
    not true. The authors of the code often take great care to copyright their code
    because they want credit for their work.'
  merge: -1
  img_proc: true
- pgno: 349
  md: '# 322 Part VII: Appendixices


    # Copying permissions/distribution policy


    Most Linux code is given away by the copyright holder through the GNU Public License,
    or what is commonly called copyleft. The copyleft stipulates that those holding
    a copy of the code can use it for whatever purpose they want, as long as they
    make the code freely available to anyone who wants it. If they change the code,
    they must make the changed code (including the source code) freely available to
    those who want it.


    Sometimes, other copying and distribution policies are associated with the command
    or program that the manual page is describing. These policies could include the
    following types of permissions, which you may


    +   - Use not redistribute the code

    - Use the code, but no source code is available

    - Use and distribute the code as shareware, by paying a fee for continued use

    - Have limited use, such as educational or personal (but not commercial) use

    - Use the code on one machine only


    If you''ve bought the operating system, or a layered product distribution (a distribution
    that includes both the operating system and a commercial application), or from
    a CD-ROM vendor, their overall distribution policy is usually the strictest of
    any one on the CD-ROM (that is, you are limited to installing it on one machine
    because of its licensed software), so you don''t have to worry as long as you
    follow its overall licensing.


    # POSIX compatibility/standards conformance


    In the dark days of computer science, each vendor went off to develop its own
    operating system, with its own set of commands and programming interfaces. This
    created a Tower of Babel (not to be confused with the Tower of Hanoi, which is
    a puzzle game) among computer users and programmers. When UNIX systems first appeared,
    however, they were portable across different types of hardware, and you could
    have the same operating system, commands, and programming interfaces whatever
    you were programming a Digital Equipment Corporation system, a Sun Microsystems
    computer, an IBM computer, or others. Unfortunately, this lasted about ten minutes
    in the scope of UNIX''s life, because as UNIX escaped from Bell Labs, it went
    to the University of California, Berkeley, and poof: Two different UNIX systems
    were'
  merge: -1
  img_proc: true
- pgno: 350
  md: '# Appendix B: The Linux man Pages


    A little later, vendors bringing out their versions of UNIX, some using System
    V as a basis, others BSD (as the Berkeley version was called). Some vendors, such
    as Sun Microsystems, started out with BSD and switched to System V (to the chagrin
    of their users).


    In 1988, the IEEE developed the POSIX standard for operating systems. The IEEE
    is a great organization, but perhaps the greatest thing they did was not start
    from scratch with this specification, but rather to build on UNIX. The interfaces
    were taken from the existing System V and Berkeley versions of UNIX.


    If an operating system is POSIX compatible and a program is written to POSIX standards,
    the program should be able to run on the operating system with no problems, and
    users should be able to use that operating system with little or no retraining
    from the last POSIX operating system they learned.


    Although much work still has to be accomplished in defining what POSIX is and
    in vendors implementing POSIX, POSIX compliance and certification are worthy goals.


    Other standards should be implemented and met by manufacturers, distribution makers,
    and developers (not necessarily in that order) — standards for network communication,
    the way data is put on the CD-ROM, and so on. There are both formal standards
    and informal de facto standards, both of which help your system work better with
    the next system.


    Linux was built with POSIX compatibility as a goal, and it follows many of the
    other standards. This makes it easy to port code from one set of POSIX-compatible
    interfaces to another and from one POSIX-compatible operating system to another.
    It also allows Linux to interoperate with other operating systems. Many Linux
    people are active in standards bodies, and the move- toward standards is generally
    supported in the Linux community.


    # Files


    In addition to the startup or configuration files mentioned previously, sometimes
    the command or program that the manual page is describing using other files in
    the system and temporary files for holding intermediate work. Such files are listed
    in this section of the man page. If a command does not work, perhaps one of these
    files is missing, the wrong file permissions (or the directories they are in have
    the wrong permissions), is owned by the wrong person, or has corrupt data.'
  merge: -1
  img_proc: true
- pgno: 351
  md: '# 324 Part VII: Appendixices


    # Future work


    The future work section lists the author''s plans for the command or program that
    the manual page is describing, often in an attempt to generate interest and help
    from other people.


    # See also/related software


    The see also/related software section lists programs associated with the command
    or program that the manual page is describing. Often, several programs make up
    a system of programs to do a particular task. Some programs have similar capabilities,
    but are not quite the same. Some programs are the antithesis of the program you
    are looking at (for example, cut and paste). The see also often gives you an overall
    picture of the program is supposed to do or leads you to the right program for
    the job.


    # Finding the Right man Page


    If you do not know what command you are looking for, use the apropos command followed
    by the word you are interested in. The apropos command searches all the man pages
    looking for that word, and lists the man command names along with one-line descriptions
    of all the commands that contain that word. You should probably pipe the output
    of the apropos command into the command:


    ```

    [maddog@localhost] > apropos print |

    ```


    Note that apropos matches on partial words (called strings), which is why we suggest
    print print instead of printer. The shorter your keyword, the more matches the
    command will find.


    Second, after you have the pages you want to look at, execute the man command
    for each one. From the one-line description, you can probably decide which commands
    fit your needs.


    Third, look at the description field, which will give you a better idea of what
    the command can do. If you''re still not sure about the command''s basic functionality,
    look at the also section, to see whether any other commands fit the bill.


    After that, skip the synopsis section — it''s usually a reminder of how to type
    the command — and go directly to the options section. Read through the options
    section, trying to apply the options to the basic description of the command.'
  merge: -1
  img_proc: true
- pgno: 352
  md: '# Appendix B: The linux man Pages


    # Other places to look for help


    You can find help in several other places on the system. One place is the /usr/doc/
    packages directory.


    In addition to man pages, the info pages were created as a replacement to man
    pages but they are not very popular and have not fully replaced man pages. Some
    habits die hard, I guess. To access an info page for a particular command, type
    the info followed by the command that you want information on; for example, see
    the info page for the tar command, type tar


    Note: Some system administrators conserve space by not loading /usr/doc on their
    systems. With the abundance of inexpensive disks, this is false economy. Documentation
    such as that found in /usr/doc can be put on one system and made available to
    everyone through the magic of the Network File System (NFS). Tell your system
    administrator to do that. If you are your own system administrator, go into a
    closet and give yourself a lecture!


    To exit the page, press the Ctrl and C keys simultaneously.


    ![](img/96a9ce6a13d8d15ed05f867f41574278_352_0.png)


    After you''ve read several man pages, you''ll notice that the same options appear
    for similar commands.


    All this is pretty much passive work. To find out what a command really does,
    you should try it out. Create a small test file using an editor, or use an existing
    file, such as the /etc/passwd file, as input.


    Do not do this as root. You may inadvertently erase part of the operating system.
    It is best to do this experimentation as a unprivileged, normal user.


    ![](img/96a9ce6a13d8d15ed05f867f41574278_352_1.png)


    From time to time, we will read all the man pages in the system, concentrating
    on the command descriptions. We do this because we want to become familiar with
    new commands. Also, our memory is not what it used to be. But to be fair to our
    failing memory, the system does have close to 1,200 general-user commands and
    about 260 system administration commands.'
  merge: -1
  img_proc: true
