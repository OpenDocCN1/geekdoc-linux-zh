- pgno: 304
  md: '# Chapter 17


    # Ten Sources of Help


    In This Chapter


    +   - Read, read, read

    - Check out the Linux HOWTOs

    - Go back to school

    - Become a newshound

    - Become a groupie

    - Pay for support

    - Go the commercial route

    - Visit Web sites

    - Attend conferences

    - Try to help others


    > By now, you''re probably wondering whether an end exists to the amount of information
    and knowledge needed to run a Linux (or UNIX) system.

    The answer is yes, an end exists to the knowledge *needed* to run a system well,
    but not to the knowledge you can accumulate *if* you want to understand how things
    work and interact. In this chapter, we suggest several ways to get additional
    training and support.


    # Books and More Books


    When we started working with computers many years ago, the books about computers
    would fill one bookshelf and were mostly about the electronics of the hardware
    itself. We hardly ever saw books on computers in the popular press bookstores.
    Today, thousands of books on computers are available; most describe the software
    and its interactions, with the hardware taking a back seat.'
  merge: -1
  img_proc: true
- pgno: 305
  md: '# Part VI: The Part of Tens


    # Becoming a geek


    Susan Pink, one of my editors (a darn fine one), hates it when I say things like
    "fsck your file system." She wants me to say "run the fsck program against the
    file system." I have gone along with her for the most part, but here is why I
    tell you that UNIX (and Linux) geeks the following:


    Geeks talk about "disks" when Susan would make me say "drive drives," and geeks
    change the words X, X11, and X Window System, while Susan personally interjects
    (and every time), "Did you mean to say ''X Window System?''"


    I also want to point out that geeks are not nerds. Geeks are people who love technical
    topics, but also have a wide range of other interests. Geeks are often outgoing,
    and many (but not all) enjoy being with people.


    +   - Eff Check the file system instead of "run ES ES K on the file system


    +   - VEYE (rhymes with "EYE") instead of "VEE EYE" when talking about the editor
    "vi"


    I point out that fsck is a noun, verb, and an adjective:


    +   - I fsck.


    +   - I fscked the file system.


    +   - I put the files into the fscked file system.

    but this concept makes her shudder.


    One of my favorite T-shirts (I have more than 3,000 XL T-shirts) reads:


    It hard being a Geek, but it is getting easier.


    So, if you really start to know the Linux operating system and want to learn more,
    you may well be a closet geek. Welcome to the club.


    Perhaps you looked at other books before you bought this one and were intimidated
    by their use of technical terms. For what you wanted to do, and you wanted something
    task-oriented. You may want to look over them again because your knowledge level
    will be higher after completing this book. TCP/IP networking, compiler design,
    operating system theory, formal language theory, computer graphics, and systems
    administration training are all topics you can study in depth.


    Lots of books specific to the UNIX operating system are either partially or completely
    applicable to Linux, such as books on Perl, a comprehensive interpreter. By getting
    one (or more) books on Perl and sitting down with your Linux system, you can have
    both a new tool for doing your work and a new appreciation for a complete programming
    language. If you want to see how Perl is written, the source code is for you to
    view.'
  merge: -1
  img_proc: true
- pgno: 306
  md: '# Chapter 17: Sources of Help


    # Linux HOWTOs


    Don''t forget about the Linux HOWTOs, which are on the SuSE Linux For Dummies
    CD-ROM. These excellent guides are covered under the Linux Documentation Project
    copyleft, which means you can print them. You can also read them with more(1)
    or less(1). After you have installed SuSE Linux, the HOWTOs can be found in the
    directory /usr/doc/howto/en/


    # School Days


    Another source of information on UNIX and Linux is through formal courses, perhaps
    at a local community college. A lot of colleges have courses on UNIX, and many
    have started using Linux to teach the UNIX courses. With Linux, you can do a lot
    of your homework on your system or on your notebook anywhere. (I typed for the
    first edition of this book in a hotel in Auckland, New Zealand, and updated text
    for the second edition in the United Airlines lounge in Chicago.) What I would
    have given in college for the capability to do my computer projects sitting in
    the comfort of my own pub... dorm room. Instead, I had to sit in a room with a
    lot of punch-card machines... well, never mind. I would have been a lot more comfortable
    and productive with a Linux system.


    # In the News


    You can obtain additional information on the Linux operating system from the Internet.
    A facility called netnews has tens of thousands of newsgroups, and each newsgroup
    is about a specific topic. Note more than 30 newsgroups devoted to Linux topics.


    Access to reading netnews is usually a service provided by an ISP (Internet service
    provider). You can use a news reader (such as trn, tin, or pine) or one of several
    Web browsers (such as the Netscape browser included on your SuSE Linux For Dummies
    CD-ROM) to read netnews.'
  merge: -1
  img_proc: true
- pgno: 307
  md: '# 280 VI: The Part of Tens


    # # User Groups


    User groups are springing up all over the country. Some are more active than others,
    but most have meetings at least once a month. Some groups are Linux only; others
    are attached to a larger computer group — either UNIX or a more general computer
    user association. User groups offer a good opportunity to ask questions. Also,
    user groups tend to stimulate ideas and methods of doing things.


    You can find out whether a Linux user group is in your area by checking with GLUE
    (Groups of Linux Users Everywhere), which runs as a series by SSC (the publishers
    of the Linux Journal*). GLUE is an automated map of user groups and can be found
    at the following address:


    ```

    www.ssc.com/glue

    ```


    When you get to the site, click the button that says "Find a linux user group
    in your area."


    ![](img/96a9ce6a13d8d15ed05f867f41574278_307_0.png)


    No user group in your area? Then leave a note saying you want to start one, and
    perhaps other people in your area will join you. Terrified at trying to start
    a user group? Leaders of user groups are often not the technically knowledgeable,
    but instead are simply good planners. They organize the meeting space, find (hound)
    speakers, sending out meeting notices, locate sponsors, arrange refreshments (beer),
    and perform other organizational tasks. Sometimes it seems like a thankless job,
    but when a meeting turns really well, it makes it all worthwhile. So, as a newbie
    to Linux, you might not know `grep(1)` from `awk(1)`, but you may still make a
    very good chairperson.


    # # Bring in the Cavalry


    Some people want to be able to hire people to manage or fix their systems. This
    is what the commercial computer world calls support. A lot of times, support is
    delivered by the place where you bought your computer, whether it''s a store,
    a value-added reseller (VAR), or the manufacturer.


    Linux has been criticized for not having this level of support. Although it''s
    true that the number of hardware vendors that offers support is low, and more
    people are versed in Linux and are willing to offer some level of support, whether
    by e-mail, telephone, or on-site services.


    The first group of people that offers support are the distribution makers. Red
    Hat Software, Inc., Calder, Inc., SuSE Inc., and others sell support contracts
    for their Linux distributions. These contracts range from e-mail support to telephone
    support.'
  merge: -1
  img_proc: true
- pgno: 308
  md: '# Chapter 17: Ten Sources of Help


    Another group of people offering support are resellers of Linux systems. These
    people typically choose one or more versions of Linux and will install them on
    hardware that you purchase from them. They will repair your system when it breaks
    and help you with thorny problems (all with a fee).


    The final group of people who offer support are independent consultants who have
    learned about Linux and are now in the business of offering support for the system.
    A list of consultants is available from a document called the Consultants HOWTO,
    which is available at the following address:


    ```

    www.cyrius.com/tbm=Consultants-HOWTO

    ```


    # Commercial Applications


    While we''re talking about commercial support, we should mention something about
    commercial applications. A lot of Linux users are frugal (we prefer term rather
    than *cheap*) and often want or need to use only freely distributable software.
    And in many cases, the freely distributable software is very good and does exactly
    what they want. Other times, though, the application you want is available only
    commercially.


    Other people who use Linux buy the latest and greatest hardware and want the same
    commercial applications on Linux that they have on their other operating systems,
    no matter the price.


    For commercial application vendors everywhere may be reading this, I cannot stress
    enough that you should look at Linux like any other operating system. You can
    sell your applications to a market that is not only appreciated but also believes,
    for various reasons, that its operating system should be open.


    Take an example of functionality available from the commercial world, Applyx,
    a word processor, a spreadsheet, a presentation package, a mail front end, an
    HTML authoring program, a graphical program for drawing pictures (usually to include
    in your presentation or paper), an application building program, and a scripting
    language that allows you to tie these and other programs together.


    I wrote this book using Appercase Words. I chose to use Words instead of Microsoft
    Word because with Words I could easily cut examples of code from the screen of
    my Linux system and paste them into the text of the book. I then those presentations
    to my Digital UNIX system at work and read them into my Appercase suite here.
    After I finished a chapter, I exported it to Microsoft Word 6.0 format and e-mailed
    it to my editor.


    ![](img/96a9ce6a13d8d15ed05f867f41574278_308_0.png)'
  merge: -1
  img_proc: true
- pgno: 309
  md: '# 282 Part VI: The Part of Tens


    Likewise, I use Appligare Presentation Editor to make presentations about Linux
    on Linux. When I am talking about Linux at a show or a convention, I can demonstrate
    what I am talking about using X Window System while I have the presentation slides
    on the screen. If I used Microsoft PowerPoint, I would have to reboot the system
    into Linux to do the demo, an awkward approach at best. Appligare has many of
    the same facilities as Microsoft products. Recent editions of Appligare can read
    and create PowerPoint output, and now I can run my system truly FAT-free.


    # Visit Web Sites


    You have a variety of Web sites available for help. Some of these sites provide
    technical information, some provide news of the Linux community, and others furnish
    a bandstand for the Linux community to voice their opinions. For example:


    +   * Linux International: www.li.org

    * LinuxHQ: www.linuxhq.com

    * Linux Today: www.linuxtoday.com

    * Linux Documentation Project: www.metalab.unc.edu/LDP/

    * Linux Now: www.linuxnow.com

    * Linux Journal, Linux Gazette, Linux Resources: www.ssc.com

    * Linux Focus: www.linuxfocus.org

    * Linux Weekly News: www.lwn.net

    * Slashdot: www.slashdot.org

    * Freshmeat: www.freshmeat.net

    * File Watcher: www.filewatcher.org


    This list is not exhaustive. You can find many more URLs in some of the sites
    mentioned here.


    Opinions in some of the lists are for mature audiences only. Most of the lists
    are moderated and most of the opinions are mature, but people sometimes get carried
    away.


    ![](img/96a9ce6a13d8d15ed05f867f41574278_309_0.png)'
  merge: -1
  img_proc: true
- pgno: 310
  md: '# Chapter 17: Ten Sources of Help


    # Attend Conferences


    You can attend a number of conferences and trade shows for more information on
    Linux. All these shows are accurate as of the time I''m writing this, but events
    may change. Where possible, I''ve listed the more general Web addresses for these
    events. You might have to do a little Web surfing for the next event of the year.
    If you get stuck, try the Linux International Web site, which has an Events page
    that lists new events.


    # Linux Kongress


    Linux Kongress is the oldest Linux event. Held in Germany every year, it''s a
    technical conference with a small trade show. The Web site is www.linux-kongress.de.


    # Linux Expo


    Linux Expo is held in the Raleigh/Durham, North Carolina, area every spring. It''s
    a technical conference, trade show, and all-in-all good time. In 1998, more than
    2,000 attendees and numerous vendors were there. The Web site is www.linuxexpo.org.


    # USENIX/FREEIX


    USENIX, a technical organization that has long supported UNIX people, has several
    technical conferences and small trade shows per year on various topics. A few
    years ago, a separate set of presentations, called FREEIX, was created for freely
    distributed operating systems as Linux. If you''re interested in a good technical
    conference that attracts UNIX giants such as Dennis Ritchie or a Linux developer,
    you might want to take a look at www.usenix.org.


    # CeBIT


    CeBIT, the largest computer trade show in the world, is held yearly in Hanover,
    Germany. It often draws more than 600,000 people. Last year, Linux International
    (www.li.org) had a booth with several other Linux vendors and drew a mostly trade
    show, with very little (if any) conference sessions on Linux. To find out more
    about CeBIT, check out www.messe.de.'
  merge: -1
  img_proc: true
- pgno: 311
  md: '# 284 Part VI: The Part of Tens


    # Comdex


    For the past four years, Comdex has had a Linux Pavilion, made up of an ever-growing
    set of vendors who are trying to explain to more than 200,000 resellers, distributors,
    and other vendors that Linux is and how to use it. Comdex is held both in the
    spring and fall, and you can check it out at www.comdex.com.


    # IDG''s Linux World


    Linux World is a new show with conferences. The Web site is at www.linuxexpo.com.


    # Try to Help Others


    After you''ve exhausted all avenues of help (or maybe even before), you should
    just try to do whatever you want to do. Often, you will find that the pieces fit
    together or that the software is not as difficult as you thought. Here are some
    tips:


    +   If you are investigating a large software package, scan the documentation
    one time and then concentrate on the necessary topics.


    I still remember the first time I tried to learn groff(1), a powerful text-processing
    system. The documentation was daunting, and I thought I would never learn the
    package. It turns out was right; I learned enough to do a few simple things that
    was all I needed. With those "simple things" (less than 2 percent of the package),
    I could write letters, create overhead slides, and do the necessary text processing.
    When I needed another command, I''d look it up in a reference book.


    +   Create a small sample of what you want to do.


    If you''re working with a new command or part of Linux, create a small example
    of one part of the command or software that you don''t know and see how that works.


    +   Keep it small.


    A friend named Mike Gancarz (Hi, Mike!) wrote a book called The Philosophy of
    Unix. In this book, he talks how Unix systems were created and programmed in the
    early days, utilizing lots of the small, cryptic (I prefer the word terse) commands
    that lurk below the glossy interface of X Window System. With these commands,
    you can create


    ![](img/96a9ce6a13d8d15ed05f867f41574278_311_0.png)


    ![](img/96a9ce6a13d8d15ed05f867f41574278_311_1.png)'
  merge: -1
  img_proc: true
- pgno: 312
  md: '# Chapter 17: Ten Sources of Help 285


    powerful programs called shell scripts or just use the commands one at a time
    to transform your data. The main tenet of his book is to keep things simple and
    small.


    +   Remember Linux is only a piece of code and your computer is only a machine.


    So what if you make a mistake? You''re probably running Linux on a machine that
    has only one user, you. That''s the great thing about Linux. It runs on such inexpensive
    machinery that you can buy an old 486 computer with enough disk and memory in
    it to run Linux as a practice system for under $50.(We bought a machine at Ham
    Fest. It runs Linux very nicely.) So even if you have to reinstall your system
    due to some mistake you made, You now know how to install Linux, so no one has
    to know but when something goes wrong.


    So, give it a try!


    Our other suggestion is to help someone else. "What?" you say. "How can I help
    someone else? I''m just a beginner in this field!


    ![](img/96a9ce6a13d8d15ed05f867f41574278_312_0.png)


    We started that way. No one is born with a knowledge of computer science (except
    perhaps Sean Flynn, a former student). We all pick it over time. The way to cement
    a thought or an idea, however, is to explain it clearly to someone else. Helping
    others install Linux on their PC will help cement some of the concepts you''ve
    discovered. Another idea is to attend a Linux Install Fest, where lots of people
    go (with their machines) to install Linux. Here you not only get to help someone
    else but also can learn something from other attendees.


    A main tenet of Linux is the word open. Linux is open and is best when shared.'
