- pgno: 168
  md: '# Manipulating Files and Directories


    Linux has many ways to create, move, copy, and delete files and directories. Some
    of these are so easy to use that you need to be careful: Unlike other operating
    systems, Linux won''t tell you that you are about to overwrite a file — it just
    follows your orders and overwrites!


    We said it once but we''ll say it again: Make sure that you are not logged in
    as root when you go through these sections.


    # Creating directories


    To create a new directory in Linux, you use the mkdir command (just like in DOS).
    The command looks like this:


    ```

    maddog@shamet:~ mkdir newdirectory

    ```


    This creates a subdirectory under your current or working directory. If you want
    the subdirectory under another directory, change to that directory first and then
    create the new subdirectory.


    Create a new directory called santa_cruz. Go ahead, do it:


    ```

    mkdir santa_cruz

    ```


    (Can you tell where we would rather be right now?)


    Now create another directory called work:


    ```

    mkdir work

    ```


    and change the directory to put yourself in the santa_cruz directory:


    ```

    cd santa_cruz

    ```


    Now create a file under santa_cruz called radman, using the cat command you found
    out about earlier:


    ```

    cat >radman

    Once upon a time there lived a handsome prince.

    ^D

    ```


    Now create another file:


    ```

    cat >jewels

    Once upon a time there lived a beautiful princess.

    ^D

    ```'
  merge: -1
  img_proc: true
- pgno: 169
  md: '# 142 Part III: Using SuSE Linux


    And one more:


    ```

    cat >moody

    The handsome prince and beautiful princess had a dog named

    Moody.

    ^D

    ```


    Now you have some files to work with.


    # Moving and copying files and directories


    The commands for moving and copying directories and files are mv for move and
    cp for copy. If you want to rename a file, you can use the move command. No, you''re
    not really moving the file, but in Linux (and UNIX), the developers realized that
    renaming something was a lot moving it. The format of the move command is


    ```

    mv <source> <destination>

    ```


    With your example files, you could move the file named radman to a file named
    bryant by executing the following command:


    ```

    mv radman bryant

    ```


    This leaves the file in the santa_cruz directory but changes its name to bryant.
    So you see, the file was not really moved, just renamed.


    Now try moving the bryant file to the work directory. To do that, you have to
    first move the file up and then move it into the work directory. You can do that
    with one command:


    ```

    mv bryant ../work

    ```


    Note that the destination file uses the .. (or parent directory) designation.
    This tells Linux to go up one directory level and look for a directory called
    work, and then put the file into that directory with the name bryant, because
    you did not specify any other name. If you did insist this:


    ```

    mv bryant ../work/supersalesman

    ```


    the bryant file would have been moved to the work directory with the name supersalesman.
    Note that in both cases (with the file maintaining its name of bryant or taking
    the new name supersalesman), your current directory is still santa_cruz, and all
    your filenames are relative to that directory.'
  merge: -1
  img_proc: true
- pgno: 170
  md: '# Chapter 8: Working with Files and Commands


    # 143


    ![](img/96a9ce6a13d8d15ed05f867f41574278_170_0.png)


    Strictly speaking, the file has still not really moved. The data bits are still
    on the same part of the disk where they were originally. The file specification
    (the directory path plus the filename) that you use to talk about the file is
    different, so it appears to have moved.


    In versions of UNIX, you were not allowed to use mv to move a file from one partition
    to another; you could only copy it using the cp(1) command. Linux allows you to
    use the mv command to move a file anywhere. Normally, mv renames the data in place
    and changes the file''s name and the directory where the name is placed. But when
    the file is moved across partitions (for example, from /usr to /home in a Linux
    systems), the data is copied to the new disk partition, the new name is put in
    place in that partition''s directory structure, and the name and file''s data
    are removed from the old disk partition.


    Copying a file moves some data. The syntax is


    ```

    cp <source> <destination>

    ```


    Look familiar? It is the same syntax you use for the move command.


    Now, make a copy of the jewels file. Because you can''t have two files of the
    same name in the same directory, you have to think of a new name, such as jewels2.
    (Hey, we''re writing this early in the morning. How creative can we be?)


    ```

    cp jewels2

    ```


    If you want a copy of a file but in a different directory, you can use the same
    filename. For example, suppose that you want to duplicate a file moody to the
    ../work directory. You can keep the name moody because its full path-name work
    in it instead of santa_cruz:


    ```

    cp moody .../work

    ```


    ![](img/96a9ce6a13d8d15ed05f867f41574278_170_1.png)


    As you can see, the pathname specifications for files are similar from command
    to command, even though the file contents and commands are different.


    # Removing files


    The command for removing, or deleting, a file is rm. If you''ve been following
    along in my little story, the handsome prince now has two beautiful princesses
    (jewels and jewels2) in the santa_cruz directory. As most people know, this is
    probably one too many princesses, so let''s get rid of the second:'
