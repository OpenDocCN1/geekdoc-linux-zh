- pgno: 324
  md: '# Appendix A


    # Hardware Compatibility


    The version of Linux on the SuSE Linux For Dummies CD-ROM supports a wide range
    of hardware but, like other distributions of Linux, it doesn''t support all types
    of hardware.


    We made every attempt to present correct material in this appendix. Some equipment
    listed, however, might not work with SuSE Linux. In addition, hardware is introduced
    all the time, and some of it might work with Linux but not be here.


    The information in this appendix was taken from the Linux Hardware Compatibility
    HOWTO by Patrick Reijnen and the PCMCIA HOWTO by David Winds, as well as the XFree86
    organization.


    After you have your system running, review some of the hardware HOWTOs to see
    whether any other hardware is listed that you might want to use in your Linux
    system.


    # Hardware Architectures


    Linux runs on a variety of hardware architectures. These architectures are usually
    defined by the model name of the main CPU''s manufacturer, such as the Intel architecture,
    the Alpha (Compaq) architecture, and the SPARC (Sun) architecture. Linux has been
    ported to run on handheld devices and mainframes. Just recently, there was an
    article about an Italian company that has created a telephone that runs Linux!
    This book and its CD-ROM cover only the Intel architecture, which includes AMD
    and Cyrix CPUs from the x386 configurations all the way to the class of CPUs for
    the Pentium ils.


    In addition to the hardware architecture of the CPU, you have to consider the
    bus structure. A bus is made up of electrical paths, wires, and sockets that transmit
    electrical impulses to and from the CPU.


    ISA, EISA, VLB, and PCI buses have been around a long time and are all supported
    in Linux. Recently, the Microchannel bus has received support in the Linux kernel,
    but it''s early code, so it may not work on your system. Most modern systems are
    PCI-based, with one or two ISA slots for back-compatibility.'
  merge: -1
  img_proc: true
- pgno: 325
  md: '# 298 Appendixes


    The combination of the CPU architecture and the bus structure could loosely be
    the motherboard (often pronounced "muthaboard\). If Linux does not work on your
    system, and you suspect that the motherboard is the problem, first check with
    the manufacturer of the motherboard to see whether they have any newer BIOS, which
    is the code that tells the CPU of the bus structure and devices.


    # Laptops


    Laptops and Linux are problematic for a few reasons. First, except for the newest
    laptops, the disks are tiny for use with a Linux system (which needs at least
    80MB of disk space for character-cell support and 200MB of main memory for X Window
    System). Second, most older laptops have 4 to 8MB of main memory, with really
    expensive upgrade paths to more memory (if you can find it). Third, to make laptops
    small and lightweight, only the newest electronic devices are used, and often
    in ways not expected by Linux. Fourth, many early notebooks use graphics chips
    from vendors who didn''t give out the chips'' programming specifications, making
    it difficult for XFree8 to provide video code that works. Finally, most early
    notebooks don''t have a lot of peripherals inside, forcing you to use a PCMCIA
    card to hook up to a network or to a SCSI CD-ROM to get code from a CD-ROM and
    onto the machine''s hard disk.


    Nevertheless, as prices dropped and more manufacturers cooperated with the Linux
    community, it became easier to install Linux on a notebook. Ideally, your notebook
    should have more than 32MB of main memory, more than 700MB of free disk space,
    and a built-in CD-ROM and floppy that can both be installed and working at the
    same time.


    # SMP Systems


    The kernel on the SuSE Linux For Dummies CD-ROM does not support symmetric multiprocessors
    (SMPs) by default. If you are interested in taking advantage of your SMP machine,
    you will have to recompile your kernel with support for SMP.


    # Memory


    All memory typically found in PC computer systems works with Linux. When your
    system has large amounts of main memory, however, you must add the following to
    the /etc/lilo.conf file:


    ```

    append="mem=<number of Mb>"

    ```'
  merge: -1
  img_proc: true
