- pgno: 186
  md: 'The business of moving text around in the file usually requires the following
    general steps:


    +   1. Position the cursor at the beginning of the first line you want to move
    or copy.

    2. Type ma, marking that position with the letter a.

    3. Position the cursor at the beginning of the last line that you want to move
    or copy.

    4. Type mb, marking that position with the letter b.

    5. Position the cursor at the line where you want to insert the text.

    6. Type ''a, if you want to move the text, or ''a,bt. if you want to copy the
    text.

    Note that the single quotation marks and period are required.


    # Controlling the environment


    You may control your editing environment in vi by setting options with the :set
    command. Table 9-3 lists some common :set command options.


    | Table 9-3 Everyday :set Options |

    | Command | What It Does |

    | all | Displays a list of all :set commands and their status |

    | errorbells | Sounds the terminal bell when errors occur |

    | ignorecase | Makes searches case insensitive |

    | number | Displays line numbers in the leftmost column on the screen |

    | showmode | Displays an indicator at the bottom right of the screen indicating
    which mode you are in: input mode, change mode, replace mode, and so on |


    Note: set command options can be toggled off by prefixing the command with no,
    as in


    :set nonumber which toggles line numbering off.'
