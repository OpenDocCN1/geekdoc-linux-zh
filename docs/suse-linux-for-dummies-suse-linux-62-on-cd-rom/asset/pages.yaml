    -ENTER-: <Enter>

    D:\DOSUTILS\REWRITE>

    ```


    The two disks that you created (the boot and modules disk) do not have a normal
    MS-DOS file system. You cannot list the directory of the floppy disk that you
    made with MS-DOS. Trying to do a directory list of it results in an error message
    from MS-DOS.


    While you are doing this, you should also put a copy of FIPS.EXE on your C disk.
    Change to the directory FIPS (which is in the dosutils\fips\fips20 folder for
    your suSE Linux for Dummies CD-ROM), and use this copy command to copy the FIPS.EXE
    file to your C:\ drive. An example of this command follows. You use FIPS later
    in this chapter to partition your disk in a nondestructive partitioning. Following
