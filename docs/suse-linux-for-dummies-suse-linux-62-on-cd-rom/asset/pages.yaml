- pgno: 161
  md: '# Part III: Using SuSE Linux


    # Directories and subdirectories


    A directory contained, or nested, in another directory is called a subdirectory.
    For example, the directory called /mother may contain a subdirectory called /child.
    The relationship between the two is referred to as parent and child. The full
    name of the subdirectory is /mother/child, which would make a good place to keep
    a file containing information about a family reunion. It could be called /mother/child/reunion.


    # The root directory


    If you turned the tree so that the trunk was in the air and the branches were
    toward the ground, you would have an inverted tree — the Linux file system is
    normally drawn and represented (with the root at the top). Because we were talking
    about Mother Nature, you''d soon have a dead tree. Because this is computer technology,
    however, you have something that looks like an ever-growing, upside-down tree.


    # What''s in a name?


    You name directories in the same way that you name files, following the same rules.
    Almost the only way that you can tell whether a is a filename or a directory name
    is the way that the slash (/) is used to show directories nested in other directories.
    For example, usr/local means that local is found in the usr directory. You know
    that usr is a directory because the trailing slash character tells so, but you
    don''t know whether local is a file or a directory.


    ![](img/96a9ce6a13d8d15ed05f867f41574278_161_0.png)


    > If you issue the ls command with the -F option, directories are listed with
    a slash character at the end, as in local/, you would then know that local is
    a directory.


    The simple way to tell the slash character indicates the root directory or separates
    directories, or directories and files, is to see whether anything appears before
    the slash character in the directory path specification. If nothing appears before
    the slash, you have the root directory. For example, you would know that /usr
    is a subdirectory or a file in the root directory because it has only a single
    slash character before it.


    # Home again


    Linux systems have a directory called /home, which contains the user''s directory,
    where he or can


    ![](img/96a9ce6a13d8d15ed05f867f41574278_161_1.png)'
  merge: -1
  img_proc: true
- pgno: 162
  md: '# Chapter 8: Working with Files and Commands


    +   - Store files


    +   - Create more subdirectories


    +   - Move, delete, and modify subdirectories and files


    Linux system files as well as files belonging to other users are never in a user''s
    /home directory. Linux decides where the /home directory will be placed, and that
    location can be changed only by a superuser, not by general users. Linux is dictatorial
    because it has to maintain order and keep a handle on security.


    > /home directory is not safe from spying eyes. To be sure that your privacy is
    maintained, you need to lock your directory. (We tell you how in the "Grant You
    Permission" section of this chapter.) Anyone logging into your system as root
    (superuser), however, can see what''s in your /home directory, even if you do
    lock it up.


    ![](img/96a9ce6a13d8d15ed05f867f41574278_162_0.png)


    # Getting Around with pwd and cd


    You can navigate the Linux file system without a map or a GPS. All you need to
    know are two commands: pwd and cd.


    # Where am I?


    To find out where you are in the Linux file system, simply type pwd at the command
    prompt, as follows:


    ```

    maddog@shamet:~ ~pwd

    /home/maddog

    maddog@shamet:~

    ```


    This indicates that we are logged in as maddog and are in the /home/maddog directory.
    Unless we have an alter ego out there, you should be logged in as yourself and
    be in the /home/yourself directory, where yourself is your login name.


    The pwd command stands for print working directory. Your working directory is
    the default directory where Linux commands perform their actions. When you type
    the ls(1) command, for example, Linux shows the files in your working directory.
    Any file actions on your part occur in your working directory.'
  merge: -1
  img_proc: true
- pgno: 163
  md: '# Conventions without Shiners


    You''ll be seeing a list of commands, so you might find it helpful to review the
    syntax of Linux commands:


    +   Text inside angle brackets > must be replaced with appropriate text.


    +   Text inside braces {} indicates that you must choose one of the values that
    are inside the braces separated by the | sign.


    +   Text not surrounded by {}, {}, or > must be typed exactly as shown.


    +   Text inside brackets [] is optional.


    +   An ellipsis (...) means so and on to repeat the preceding command line as
    needed.


    Type this command:


    ```

    ls -la

    ```


    The files you see are only those in your working directory. If you want to specify
    a file that isn''t in your working directory, you must name the directory that
    contains the file, as well as the name of the file. For example, the following
    command lists the passwd file in the /etc directory:


    ```

    ls -la /etc/passwd

    ```


    # Every directory has a parent and lots of relatives


    If the file you want to read is in a subdirectory of the one you are in, you can
    reach the file by typing a relative filename. Relative filenames specify the location
    of files relative to where you are.


    In addition to what we told you about specifying directory paths, you need to
    know about these three additional rules:


    +   One dot (.) always stands for the current directory.


    +   Two dots (..) specify the parent directory of the directory you are currently
    in.


    +   All directory paths that include (.) or (..) are relative directory paths.


    You can see these files using the -a option of the ls(-1) command. Without the
    -a option, the ls(1) command does not bother to list the . or .. files, nor does
    it list any filename beginning with a period.'
  merge: -1
  img_proc: true
