- pgno: 100
  md: '# Chapter 5: Installation: Down to the Final Stretch


    +   - Scenario 3. You have one hard drive on your computer with another operating
    system on the first partition and you want to install Linux on the rest of the
    hard drive. The “rest of the hard drive” refers to space that is currently unpartitioned.
    In this case, YaST will recognize that your hard drive contains free unpartition
    space and asks whether you want to use this space for installing Linux. We recommend
    that you select Yes in the dialog box and press Enter.


    In each of the three cases, YaST partitions the appropriate hard drive (or the
    appropriate unpartitioned space on the hard drive). YaST also creates a file system
    on the partitions. The next step in the installation process is to select the
    software packages to be installed, but you may not be ready to do yet. If YaST
    successfully completed your drive, you can skip the next section and move on to
    “Selecting and Installing the Packages.” If your drive is not partitioned successfully,
    use the next section to find your way through this detailed process.


    # Partitioning Your Hard Drive Manually


    This section is for those readers who must partition their hard drive(s) manually,
    or those who are just too curious and want to learn how to do it. We discuss the
    concepts of partitioning and the procedure of partitioning using YaST. If you
    have followed our recommendation and have chosen to have YaST partition your hard
    drive, you can skip over this section.


    # Partitioning — the concepts


    Partitioning a hard drive is actually quite simple. As most things in life, if
    you have no idea what you are doing, the process may appear confusing. In this
    section, we explain the basics of partitioning and the tools that are available
    to perform basic partitioning tasks. In the next section, we walk you through
    an example of the steps necessary to partition your hard drive with YaST.


    Different people have different partitioning philosophies, and different computers
    have partitioning needs. Thus, no “correct” way to partition your system exists.
    You have a range of ways that you may choose to partition a drive. You could install
    Linux and your personal files all in one large partition, which is what YaST does
    if you tell it to partition your drive for you. The disadvantage of this option
    is that when you need to reinstall Linux (such as you get a new version), you
    have to back up and restore all your data files, because no extra partition is
    available to store files.'
  merge: -1
  img_proc: true
- pgno: 101
  md: '# 74 Part II: Installing SuSE Linux


    The other extreme of installing Linux is to create a partition for each of the
    following areas:


    +   - A root partition mounted as / (the root directory) where the kernel necessary
    to boot the system and the system configuration resides. This partition needs
    to be only 30MB to 50MB.

    - swap partition, which enables Linux to take advantage of virtual memory. Although
    not required, we strongly recommend that you have a swap partition. As a rule,
    the swap partition should be twice the size of the memory (RAM) installed in your
    computer. If you have 32MB of RAM installed on your computer, for example, your
    swap file should be 64MB. Having more swap space allows programs to run simultaneously
    or larger programs to run with more data. Linux allows for multiple partitions
    up to a total of 16 on Intel platforms. The maximum size of each partition is
    127MB. If you decided to use YaST to partition your hard drive for you, it will
    create a 127MB swap partition.

    - /home partition, where the users'' home directories go. Its size is influenced
    by how many users you have planned for the system. 100MB is a good starting point.

    - /local partition, for storing programs you want to separate from the rest of
    the SuSE Linux software.

    - /tmp partition, an additional partition for temporary files in larger multiuser
    systems and network file servers.

    - /opt partition, where third-party software will be installed. The size of this
    partition will depend on how much third-party software you will be installing.
    Such third-party applications might include StarOffice or Applicware, as KDE.

    - /usr partition, where most of the software on the Linux system resides. It should
    be about 150MB to 350MB, depending on what packages you are installing.

    - /usr/src partition, which contains much of the Linux source code.

    - /var partition, which is a good idea for servers that run continuously (generate
    logs of log files) and provide lots of e-mail services. On major servers, this
    partition can be more than a gigabyte!


    The problem with this type of setup is that you have a lot of separate partitions
    that cannot share their space. If you need a little more space in your /tmp partition,
    for example, and your /home partition is almost empty, Linux cannot easily use
    the space in /home for /tmp usage. This is particular of smaller systems that
    have fewer disks and less disk space. Another problem with this arrangement, especially
    for first-time Linux users, is that you need to know your space requirements for
    each of the partitions. It is not easily determined, because at this point you
    have not chosen the software packages that you want to install.'
  merge: -1
  img_proc: true
