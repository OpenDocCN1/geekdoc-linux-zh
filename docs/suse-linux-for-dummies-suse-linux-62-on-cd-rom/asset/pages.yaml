- pgno: 314
  md: '# Chapter 18


    # Ten Problem Areas and Solutions


    In This Chapter


    +   - I can''t boot Linux anymore

    - My disk numbers have changed since installation

    - My CD-ROM isn''t detected

    - I don''t know how to remove LILO and restore my MBR

    - I can''t use LILO to boot

    - The ls command doesn''t show files in color

    - Linux can''t find a script (or a program)

    - When I start X Windows System, I see a grey screen

    - I don''t know how to make X Windows System start at boot time

    - I never seem to have the correct time


    In any complex, technical situation, people end up having problems and issues
    that they need help. The problems in this chapter were taken from a database of
    questions and answers created after hundreds of people installed the CD-ROM. Some
    of these questions have been answered in the rest of the book, but because they
    still generate "what happened" questions, I repeat the information here.


    # I Can''t Boot Linux Anybody


    Problem: You''ve installed Linux and everything is fine (naturally). Then one
    day make a change to your Windows or Windows NT system, and Linux stops working.
    You no longer use the lilo boot prompt, so you can no longer specify that you
    want to boot Linux.


    Solution: Various operating systems tend to think that they are the only operating
    system on the disk or on the system. Therefore, when they are installed or updated,
    they write things to an area of the system called the Master Boot Record (MBR).
    This process overlays the Linux boot loader (called LILO) and stops you from booting
    Linux. The best correction requires an ounce'
  merge: -1
  img_proc: true
- pgno: 315
  md: '# 288 Part VI: The Part Tens


    prevention: Make an emergency boot floppy disk, as I instruct you to during installation.
    Keep this disk handy when you update your system (or during any other significant
    system event, such as repartitioning disks or rebuilding your kernel). Then, if
    you make a mistake, you can boot the floppy, which will enable you to reboot your
    Linux operating system. When you''ve rebooted your system using the floppy, just
    log in as root and type **lilo** on the command line. This repairs the MBR by
    reinstalling LILO.


    ![](img/96a9ce6a13d8d15ed05f867f41574278_315_0.png)


    If you are installing multiple operating systems on a new machine, do yourself
    a favor and install Linux last. Otherwise, you have to keep reinstalling LILO.


    # # My Disk Numbers Have Changed Since Installation


    **Problem:** Linux numbers disks each time it boots, counting SCSI names like
    sda, sdb, and sdc. Suppose sda holds your Microsoft system, sdb holds the bulk
    of Linux, sdc holds your user files, and sdb holds your swap space. You add another
    disk and your user files are on sdn and your swap space is on sde. The new disk
    is called sdc but has nothing on it. What happened?


    **Solution:** SCSI disks are lettered according to the SCSI IDs on each disk.
    Linux names the disks using this ordering scheme. If you insert a new disk into
    the SCSI bus with a SCSI ID that is lower than an existing disk, you rename all
    with a SCSI ID above the one you just installed. It''s best to start installing
    your SCSI disks with a SCSI ID of 0, 1, 2, and so on; then put other SCSI devices
    at the end of the SCSI bus with SCSI IDs 6, 5, 4, and so on). Note that most SCSI
    controllers are set to SCSI ID 7 by default.


    IDE disks are numbered according to the IDE controller they are on and whether
    they are a master or a slave on that controller. Therefore, adding a new disk
    to a set of IDE controllers will not change the existing names, as shown here:


    | Controller | Disk | Linux Name |

    |---|---|--|

    | ide0 | master | hda |

    | ide0 | slave | hdb |

    | ide1 | master | hdc |

    | ide1 | slave | hdd |

    | ide2 | master | hde |

    | ide2 | slave | hdf |'
  merge: -1
  img_proc: true
- pgno: 316
  md: '# Chapter 18: Ten Problem Areas and Solutions 289


    ```

    ide3 master hdg

    ide3 slave hdh

    ide0 = primary controller

    ide1 = secondary controller

    ide2 = third controller

    ide3 = fourth controller

    ```


    # My CD-ROM Isn’t Detected


    **Problem:** You''re installing Linux, but it doesn’t find your CD-ROM.


    **Solution:** Most newer CD-ROMs are either EIDE (ATAPI) or SCSI, and most newer
    computers have enough support to see either the ATAPI CD-ROMs or the SCSI CD-ROMs,
    so CD-ROM support is not quite the issue it was in the early days. In addition,
    some older systems and CD-ROMs are not supported.


    Some early CD-ROMs pretended to be other devices (such as tape drives or floppies)
    to fool the computer into using them, but these CD-ROMs were hidden from the detection
    system. If your system is one of these, don''t despair: You can supply information
    to help Linux find your CD-ROM.


    First look at the preceding section about disk numbering. This will let you figure
    out the name Linux would call your CD-ROM if Linux knew about it. If you have
    an EIDE/ATAPI CD-ROM, type the following line whenever you see the boot or l1110
    prompt while booting or installing your system:


    ```

    linux hdx=cdrom

    ```


    where $X$ is the number your CD-ROM would have if it could be detected.


    # I Don’t Know How to Remove and Restore My MBR


    **Problem:** You don’t know how to replace the boot record that was on your system
    before you installed Linux.


    **Solution:** You can log in to Linux as *root* and then type the following command:'
  merge: -1
  img_proc: true
- pgno: 317
  md: '# 290 Part VI: The Part of Tens


    ```

    /sbin/lilo -u

    ```


    Another solution is to boot MS-DOS or Windows 3.1, 95, or NT to an MS-DOS prompt
    and type the following:


    ```

    fdisk /mbr

    ```


    # I Can''t Use LILO to Boot


    **Problem:** You need to put Linux on a disk or a partition that is beyond the
    1023rd cylinder, the second IDE disk, or the second SCSI ID number, or you need
    to do something else that will make it difficult for Linux to booting LILO. Can
    you boot Linux in another way?


    **Solution:** You can use a program called LOADLIN to boot from your MS-DOS or
    Windows system:


    +   1. **Copy your configured Linux kernel to the C drive of your MS-DOS or Windows
    system.**


    The easiest way to do this is to install Linux, log in as **root** and type the
    following:


    ```

    grep image /etc/lilo.conf

    ```


    A line similar to the following appears:


    ```

    image=/boot/vmlinuz

    ```


    This points to your compressed kernel, which in this example is located at /boot/vmlinuz.


    +   2. **Copy the compressed kernel to a floppy disk, as follows:**

    mccopy /boot/vmlinuz a:\vmlinuz.gz


    The kernel name vmlinuz-2.0.36-0.7 refers to a specific version of the Linux kernel.
    Except for /boot/vmlinuz- part, which remains constant, the name might be slightly
    different on your system.


    Now you have to copy LOADLIN from the *SuSE Linux For Dummies* CD-ROM in your
    CD-ROM drive.


    +   3. MS-DOS or Windows and put the *SuSE Linux For Dummies* CD-ROM in your CD-ROM
    drive.


    +   4. Go to the DOSUTILS directory and copy LOADLIN.EXE to your C drive:


