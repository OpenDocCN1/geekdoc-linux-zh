    X Window System environment. If, on the other hand, you see a graphical interface,
    you are in a graphical environment already.


    +   2. Log in to your system.


    If you are already in a graphical environment, X Window System starts automatically
    when you log in. If you aren''t in a graphical environment, you have one more
    step.


    +   3. Run X Window System, if necessary, by typing startx at the prompt.


    You now have X Window System environment in front of you.


