  md: '# Chapter 10: Avoiding Shell Shock


    If you are logged in as superuser or root (a # appears at the end of your shell
    prompt), change over to a nonsuper account. No examples in this chapter require
    superuser privileges. And because you are experimenting with shells, limiting
    potential damage is best. Remember, it''s not called superuser for nothing.


    # Linux is at your command


    Commands in Linux usually consist of three major parts:


    +   * The command name

    * Options to the command (telling the command how to change actions for a specific
    execution)

    * Input or output files, which supply data or give the command a place to output
    data, respectively


    Commands can contain one, two, or all three parts, but the first part — the command
    name — always has to be present.


    # Regular expressions: wildcards and one-eyed jacks


    If you had to type every filename for every command, Linux would still be useful.
    But something that makes Linux more useful is the capability to use a few special
    characters — pattern-matching characters, wildcards, or regular expressions —
    to supply filenames. Just as wildcards can be substituted for any card of your
    choice in a poker game, Linux pattern-matching characters can be substituted for
    filenames and directory names, like DOS wildcards.


    Three of these special pattern-matching characters follow:


    +   * (asterisk)

    * ? (question mark)

    * \ (backslash)


    The asterisk matches at least one character or any characters in any file-name.
    For example, * matches the following filenames:


    ```

    a

    ac

    bce

    moody

    ```'
