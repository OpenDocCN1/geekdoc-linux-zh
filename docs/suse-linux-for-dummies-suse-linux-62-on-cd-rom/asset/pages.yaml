    ![](img/96a9ce6a13d8d15ed05f867f41574278_167_0.png)


    Are we confusing you? You use the cat command to concatenate files or concatenate
    input to either the beginning or the end of the file. It is the only command created
    to do this. You can also use the >> symbol to add data to the end of a file.


    The >> symbol can be used with many Linux commands. For example:


    ```

    cat file2 file3 file4 >>fileout

    ```


    joins file1, file2, file3, and file4, putting the results in fileout. In the following:


    ```

    sort file1 >>file2

    ```


    the sort command sorts the contents of file1 and appends it to a (perhaps already
    existing) file2. If file2 doesn''t exist, the system creates file2 and puts the
    sorted output into it.


