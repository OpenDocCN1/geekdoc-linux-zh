    # # Discovering Your Hardware''s True Identity


    Before you start X Window System, you need to know about your video controller
    card, monitor, and keyboard.


    For your video controller card, you need to find out


    +   - The model number (and perhaps the video chip used)

    - The amount of RAM it has


    You should be able to find this information in your system''s documentation or
    by using MS-DOS or Windows as described in Chapter 3. But now that you have Linux
    up and running, the next best method for finding that missing'
