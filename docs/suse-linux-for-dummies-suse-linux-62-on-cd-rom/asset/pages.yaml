- pgno: 28
  md: '# Introduction


    Other books about Linux contain fascinating information for UNIX system administrators
    as well as long lists of unpronounceable commands with confusing options. SuSE
    Linux For Dummies is different. The fascinating information is for you, and the
    descriptions and directions are written in plain English.


    Use this book as an entertaining and informative reference to SuSE Linux. Or buy
    a whole stack of them and use them to press flowers. (Hey, you can still use the
    top one as a reference for SuSE Linux.)


    # About This Book


    This book is designed to be a helping-hands reference. It provides a place to
    turn for help and solace in those moments when, after two hours of typing *xstart*
    fruitlessly and reloading X Window System twice, your 5-year-old tells you that
    the *x* goes at the end of the word.


    We tried our hardest to fill up this book with the things you need to know about,
    as


    +   - Installing SuSE Linux

    - Installing X Window System

    - Issuing important commands

    - Working with files and directories

    - Using text editors and other applications

    - Getting online

    - Finding help


    You''ll see troubleshooting tips throughout the book. It''s not that Linux is
    that much trouble — we just want your experience to be as trouble free as possible.'
  merge: -1
  img_proc: true
- pgno: 29
  md: '# Foolish Assumptions


    You know what they say about people who make assumptions, but this book would
    never have been written if we didn''t make a few. This book is for you


    +   - You have a SuSE Linux operating system. Surprise — one is on the SuSE Linux
    For Dummies CD-ROM in the back of the book.

    - You have a computer.

    - You want to put the SuSE Linux operating system and the computer together, and
    using duct tape hasn''t worked.

    - You don''t need to become a SuSE Linux guru — at least not yet.


    # Conventions Used in This Book


    At computer conventions, thousands of computer people get together and talk about
    deep technical issues such as


    Is Coke better than junk?


    Are Tim-Tams the ultimate for junk food?


    What is the best hardware for running Linux?


    But these aren''t the types of conventions we''re talking about in this section.
    Our conventions are ways of designating specific information, such as what is
    and isn''t a command or the meaning of certain funny-looking symbols.


    # Typing code


    Commands in the text are shown like this. Commands not in the text, but set off
    on lines by themselves, look like this:


    ```

    [maddog@local maddog]$pwd

    /home/maddog

    ```


    When you see stuff in boldface, it means it''s something you should type. The
    non-bold stuff is text that the computer displays. So, in the preceding, you type
    pwd (and press Return), the computer displays /home/maddog.'
  merge: -1
  img_proc: true
- pgno: 30
  md: '# Introduction


    Well, not quite. Notice the [maddog@localhost maddog] in the preceding

    You won''t see that on your system, unless you''re Jon''s evil, same-named twin.
    But you will see something similar. The same goes for /home/maddog;

    t maddog is replaced by the directory name on your system.


    Now for further complications. Check out the following:


    ```

    [root@localhost /root]# password <name>

    ```


    <name> is in bold, but it''s also italic. That means you should replace <name>
    with a name. In this case, you replace <name> with your logon name. How are you
    supposed to know that? Don''t worry. We tell you so in the text.


    Here''s a rundown of the command syntax in Linux:


    +   - Text not surrounded by [ ], ), or > must be typed exactly as shown.

    - Text inside brackets [ ] is optional.

    - Text inside angle brackets <> must be replaced with appropriate text.

    - Text inside braces { } indicates that you must choose one of the values that
    are inside the braces and separated by the | sign.

    - An ellipsis (...) means so on or to repeat the preceding command line as needed.


    Don''t concern yourself with this too much. For most of the book, you don''t need
    to know these particulars. And when you do need to know about a particular syntax,
    come back here for a refresher course.


    # Keystrokes and such


    Keystrokes are shown with a plus sign between the keys. For example, Ctrl+Alt+Delete
    means you should press the Ctrl, Alt key, and Delete key all at the same time.
    (No, we don''t make you press any more than three keys at the same time.)


    You may also see this from time to time:


    ```

    [maddog@localhost maddog]$ vi quagmire

    acho Report of login names and users on the Linux system date

    echo -f 1,5 -d: /etc/passwd | sed -e ''s/:/ /''

    <ESC>

    :wq *

    ```'
  merge: -1
  img_proc: true
- pgno: 31
  md: '# SuSE Linux For Dummies


    Now, you know from the "Typing code" section that the stuff in boldface needs
    to be typed as shown. When you see a key in angle brackets, as <ESC>, in code,
    it''s telling you to press the Escape key, not to type the ES C characters.


    # # How This Book Is Organized


    Like all proper ...Dummies books, this book is organized into independent parts.
    Well, that''s not quite true. This is an almost proper ...For Dummies book. If
    you don''t have SuSE Linux installed, you really have to go through Part II before
    you can do much with SuSE Linux, aside from framing the CD or using it as a neat
    Frisbee.


    For all other parts, you can read them in any order. Heck, reading them backwards
    for a real challenge, we tell you what each part contains.


    # Other uses for CD-ROMs


    | Where computers and computer programmers abound, lost of CD-ROMs arrive in the
    mail or as part of the software that someone bought. Eventually, these CD-ROMs
    become obsolete or are never installed—that''s the case with software products
    that arrive without advertising. What can ecologically-minded programmers do with
    these CDs that they don''t fill up landfills? | these clocks made out of Windows
    NT CD-ROMs—hey, can you imagine a better use for them? More exotic uses require
    high heat to melt the CD-ROMs around the base of a water tumbler, creating either
    a flowerpot, or with the hole plugged, an asht. As you can imagine, this causes
    some concern among management at these facilities, particularly after they find
    out that one of the more expensive programs they''ve purchased has ended up at
    the bottom of a flowerpot. One group of programmers I know them as coasters for
    drinks. Another group makes mobiles out of them (The sun shining off the CD-ROMs
    makes wonderful rainbows on the wall.) Still others use the CD-ROMs as clocks,
    by purchasing inexpensive quartz-crystal clock motors (complete with hands) and
    using the CD-ROM as the face of the clock. I have two of | For right now, please
    keep your SuSE Linux For Dummies CD-ROM in a safe place, such as the sleeve in
    the back of the book, when you are not using it. |'
  merge: -1
