  md: '# Chapter 6: Solving Problems with the X Window System Installation


    # 103


    ![](img/96a9ce6a13d8d15ed05f867f41574278_130_0.png)


    Older monitors, particularly VGA monitors that came with older systems, often
    aren''t multisync. These monitors could be damaged if you try to use them at a
    higher resolution than VGA, which is 640 x 480.


    Horizontal and vertical sync range numbers help X Window System determine how
    to place the dots on the screen. The resolution number tells X Window System how
    many dots can be on the screen horizontally and vertically. A resolution of 640
    x 480 is usually considered to be the worst, and 1,280 x 1024 is usually considered
    to be the best for normal use. Strive for 800 x 600 resolution as a minimum. We
    find that 1,024 x 768 is ideal for our computing needs.


    ![](img/96a9ce6a13d8d15ed05f867f41574278_130_1.png)


    Higher video resolution uses more video memory (which is on the video card and
    therefore separate from the system memory), allows fewer simultaneous colors on
    the screen (for a given amount of video memory), and typically shrinks text on
    the screen, making it harder to see. On the other hand, using a higher resolution
    means that more information can be visible on the screen at one time for the same
    size monitor (even though the window may be small that you cannot read the writing
    without a new prescription for your glasses). Some video cards can be upgraded
    to add more video memory and some.


    Most newer monitors have built-in protection mechanisms to keep them from burning
    up in what is known as overfitting, but older monitors do not. They could literally
    catch on fire. Try to find the specifications for your monitor from the manual,
    from a dealer, or from the Web pages of the monitor''s manufacturer.


    ![](img/96a9ce6a13d8d15ed05f867f41574278_130_2.png)


    If you hear noise from your monitor, smell burning components, or think that the
    screen does not look correct, press Ctrl+Alt+Backspace right away to stop X Server
    and try a lower resolution. Otherwise, you can easily damage the monitor.


