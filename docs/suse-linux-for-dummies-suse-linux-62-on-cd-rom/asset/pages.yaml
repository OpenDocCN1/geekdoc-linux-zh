    # Configuring your PPP Network


    At this point, you are ready to configure your Linux system to dial up your ISP.
    You can use the program WvDial to do this. Luckily, YaST has a dialog box for
    configuring your account information and dialing the modem. The following steps
    describe how to do this.


    +   1. Log into Linux and start the X Window system.

    2. Start YaST, which you can do by clicking the yellow icon on the panel at the
    bottom of your screen.


    If you are not logged in as root, you will be prompted for the root password.

    3. Select System Administration from the main menu and press Enter.

    4. Select Network configuration from the System Administration submenu and press
    Enter.

    5. Select Configure a PPP network from the Network configuration submenu and press
    Enter.

    6. Configure the current profile and press Enter.


    You will be presented with the WvDial configuration dialog box. You can use this
    dialog box to configure your dial-up settings.


    This dialog contains a few parameters that you need to set, including your username,
    your password and the phone number of your ISP. These three settings can easily
    be configured by highlighting them, pressing Enter, and entering the appropriate
    information into the text boxes.'
  merge: -1
  img_proc: true
- pgno: 285
  md: '# 258 Part V: Going Online


    ![](img/96a9ce6a13d8d15ed05f867f41574278_285_0.png)


    Figure 15-4:

    The Wdial main configuration screen.


    In addition to parameters, you also have the choice to select Automatic DNS, Dial
    Method, Modem on PBX (no dial tone), and Authentication Mode. Automatic DNS is
    set by default, with most ISPs, you can have your DNS setting automatically configured.
    To change the dial method from tone to pulse, highlight the option, press Enter,
    and then select Pulse from the menu option using the down-arrow key on your keyboard.
    If you are dialing from a PBX and do not have a dial tone, you will need to enable
    the Modem on PBX (no dial tone) option. You enable this by highlighting that option
    and pressing the spacebar. Finally, you may need to set the authentication method.
    Most ISPs use PAP/CHAP, but if yours does not, highlight the Authentication option
    and select the appropriate authentication method from the dialog box.


    When you are done with these configurations, use the right-arrow key on your keyboard
    to select Exit; then press Enter. You will return to the main Wdial dial box.


    +   7. If you are not using Auto DNS, configure DNS with YaST, and enter the DNS
    information in the dialog box.


    +   8. Run Wdial.


    You should hear a dial tone as your modem picks up the load, and then you hear
    your modem dialing the number. After one or a few rings, you hear a scratchy,
    squawking sound and then silence.


    After a few seconds, networking is working and your computer is tied to the Internet.
    As a test that everything is okay, bring up a terminal window and type the following
    at the command-line prompt to communicate with a major system at Compaq Computer
    Corporation:


    ```

    ping gatekeeper.dec.com

    ```'
  merge: -1
  img_proc: true
- pgno: 286
  md: '# Chapter 15: Setting Up Your Internet Connection


    If you get a message saying that the system is not found, wait a minute more and
    try again. Eventually, you should get a message back talking about how many milliseconds
    it takes for a round-trip message. Congratulations; your networking is working.


    To turn off networking, simply press the Ctrl and C keys simultaneously.


    You have now set the hardware and software to connect your system to the Internet.
    Your computer has been joined with the Force.


    Actually to surf the Internet, read e-mail, and otherwise interact with others
    on the Internet, check out Chapter 16, where you find out how to configure on
    Internet. and use a major tool of the Internet, the Netscape program.


    KDE has a dialup configuration, which is called Kppp. You can find it by clicking
    the K button in the bottom-left corner of your desktop and selecting the Internet
    submenu. The first time that Kppp starts, you need to create a new dial-up configuration.
    The information that you need to provide for your Kppp dial-up configuration is
    much the same as what is needed for WvDial. The first screen has a HELP button
    that brings up a help menu describing each of the configuration options that are
    necessary. It is beyond the scope of this book to discuss two dial-up configuration
    tools in detail, but we felt that Kppp was worth mentioning.


    ![](img/96a9ce6a13d8d15ed05f867f41574278_286_0.png)'
