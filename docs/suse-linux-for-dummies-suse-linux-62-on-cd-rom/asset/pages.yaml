    You have been looking at relative pathnames, which are relative to where you are
    in the file system. Filenames that are valid from anywhere in the file system
    are called absolute filenames. These filenames always begin with the slash character
    (/), which signifies root.


    ```

    1 ls -la /etc/passwd

    ```


    # Changing your working directory


    Sometimes, you might want to change your working directory because doing allows
    you to work with shorter relative pathnames. To do so, simply use the cd (for
    change directory) command.


    To change from your current working directory to the /usr directory, for example,
    type the following:


    ```

    cd /usr

    ```'
