- pgno: 318
  md: '# Chapter 18: Ten Problem Areas and Solutions


    5. Copy the kernel image you just made on the floppy disk to your drive.


    Now you can exit Windows and get to the MS-DOS prompt. You can then type the following
    (assuming that your root partition is on partition /dev/hda5) to boot Linux:


    ```

    C:\ loadlin vmlinux root=/dev/hda5

    ```


    # The ls Command Doesn''t Show Files in Color


    Problem: Using Linux from the suSE Linux For Dummies CD-ROM, you can''t get the
    ls command to show files in color.


    Solution: You have to edit the .bashrc file in your home directory to add the
    following line to the end of the file:


    ```

    alias ls=''ls -color=auto''

    ```


    Log off and then log back to reexecute your .bashrc file (assuming that you are
    using the bash shell), and ls shows different file types in different colors.


    # Linux Can''t Find a Shell Script (Or a Program)


    Problem: You type a command name but Linux can''t find the command, if it''s in
    the current directory.


    Solution: When you type a shell or binary command name, Linux looks for the name
    in specific places and in a specific order. To find out what directories Linux
    looks in, and in what order, type the following command:


    ```

    echo $PATH

    ```


    You see a stream similar to the following:


    ```

    /bin:/usr/bin:/usr/local/bin

    ```'
  merge: -1
  img_proc: true
- pgno: 319
  md: "# 292 Part VI: The Part of Tens\n\nThese are the directories Linux looks in\
    \ to find the command, program, or shell you want to execute. You might see more\
    \ directories, depending on your distribution or how your system administrator\
    \ (if you have one) set up your system.\n\nNow suppose that you create a shell\
    \ or a program called flobnob and want to execute it (assuming that you have set\
    \ the permissions to make flobnob executable by you). You have two choices (well,\
    \ you have more than two choices, but we're listing the safest ones). One choice\
    \ is to type the command on the line:\n\n```\n/flobnob\n```\n\nThis tells Linux\
    \ to look in this directory (/) and execute flobnob.\n\nYour second choice is\
    \ to move flobnob to one of the directories shown in\n PATH variable, such as\
    \ `/usr/local/bin`**\n\n# When I Start X Window System, I See a Grey Screen\n\n\
    **Problem:** You configured X Window System, but when you log in as a general\
    \ user (that is, not as *root*) and type startx, all you get a grey screen with\
    \ a big X in the middle. You wait a long time, but nothing happens.\n\n**Solution:**\
    \ First, recognize that you may have to wait a long time for a slow CPU with a\
    \ small amount of main memory (about 8MB). Some machines with small amounts of\
    \ memory have required as long as six minutes to start X Window System. Assuming\
    \ that you are starting Window System on a machine with a faster CPU and more\
    \ memory, you may have problems with permissions on your home directory. This\
    \ is particularly true if X Window System works when you are logged in as *root*\
    \ (that is, as *superuser*) but not when you are logged in as a general user.\n\
    \nTo correct this problem, log in as *root* and go to the home directory of the\
    \ user who is having problems. For this example, suppose that the login name of\
    \ the user is *lembee*. After you are in the user's home directory, issue the\
    \ `ls -ld` command to see who owns that directory and what the permissions are\
    \ on that directory:\n\n```\ncd ~lembee\nls -ld\ndrwxr-xr-x root 1024 Oct 31 16:00\
    \ .\n```\n\nNote that in this example, the directory is owned by *root* and the\
    \ group-ownership is *bin*, which does not allow *lembee* to have access to the\
    \ directory"
  merge: -1
  img_proc: true
- pgno: 320
