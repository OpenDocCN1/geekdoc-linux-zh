- pgno: 237
  md: 'The configuration settings in the /etc/conf.modules were chosen because they
    work for most sound cards. There is a possibility that they will not work for
    your sound card. This could be caused by either a resource conflict (interrupt
    or ioport) with another device on your computer, or in some cases a jumper setting
    on your card. In either case, you should check to see which interrupts and iports
    are currently in use. You can view the currently used interrupts using the command:


    ![](img/96a9ce6a13d8d15ed05f867f41574278_237_0.png)


    ```

    bash-2.03# cat /proc/interrupts

    ```


    which will produce an output similar to this:


    | 0: | 49893 | XT-PIC timer |

    | 1: | 206 | XT-PIC keyboard |

    | 2: | 0 | XT-PIC cascade |

    | 8: | 3 | XT-PIC rtc |

    | 12: | | XT-PIC PS/2 Mouse |

    | 13: | 1 | XT-PIC fou |

    | 14: | 57363 | XT-PIC ide0 |


    and you can view the currently used iports by using the command:


    ```

    bash-2.03# cat /proc/ioports

    ```


    which will produce an output similar to this:


    ```

    0000-001f : dma1

    0020-003f : pic1

    0040-005f : timer

    0060-006f : keyboard

    0070-007f : rtc

    0080-008f : DMA page reg

    00a0-00bf : pic2

    00c0-00df : dma2

    00f0-00ff : fpu

    01f0-017f : ide0

    02f8-02ff : serial(auto)

    03c0-03df : vga+

    03f6-036f : ide0

    03f8-03ff : serial(auto)

    e800-e807 : ide0

    e808-e80f : ide11

    ```


    If there does not appear to be a conflict with another device, you need to either
    change the jumper settings on your sound card or change the value(s) in /etc/conf.modules
    so that they correspond with the jumper settings on your card.'
