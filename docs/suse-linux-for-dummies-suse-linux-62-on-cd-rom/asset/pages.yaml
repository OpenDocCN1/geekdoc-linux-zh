    # # I Don''t Know How to Make X Window System Start at Boot Time


    **Problem:** You don''t have to log in to a command-line mode (such as DOS) and
    then type startx. Instead, you want to log in through X Window System.


    **Solution:** We set up our machine so that it starts in character-cell mode and
    allows us to switch to X Window System. (Many times, we want to make a simple
    edit or look at something on the system, and logging in- out X Window System is
    simply faster.) If you like to see a graphical interface from the beginning, however,
    do the following. In the /etc/initabb file, change this line:


    ```

    id:2:initdefault:

    ```


    to this:


    ```

    id:3:initdefault:

    ```


    Save your changes and reboot. X Window System starts at the end of the boot process,
    and you can then log in through the graphical interface. To go back to the old
    way of booting, change the line in the /etc/initabb file back to the following:


    ```

    id:2:initdefault:

    ```


    and reboot the machine. Note that the same thing can also be accomplished through
    YaST:System Administration:Login configuration.'
  merge: -1
  img_proc: true
- pgno: 321
  md: '# I Never Seem to Have the Correct Time


    **Solution:** Most UNIX systems keep their time using Universal Time (also known
    as Greenwich Mean Time, or GMT), but Microsoft systems keep their time as local
    time. When you set the time in either system, you set the CPU clock to that version
    of the time. Then when you boot the system, it interprets what is in the CPU clock
    differently and reports a different time.


    Linux enables you to store and think of the clock as either GMT or local time.
    You make this choice when you install the system. To change your choice, follow
    these steps:


    +   1. **Log in as *root*.**

    2. **Type yast.**

    Select System Administration from the YaST main menu and press Enter, then select
    Set Time Zone from the submenu and press Enter.

    3. **Select the appropriate time zone.**

    You can see the entire list by scrolling down. When you find your time zone, press
    Enter.

    4. **In the next dialog box, set your computer to GMT or local time as necessary.**'
  merge: -1
  img_proc: true
