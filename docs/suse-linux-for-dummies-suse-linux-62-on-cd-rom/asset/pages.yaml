- pgno: 110
  md: '# Chapter 5: Installation: Down to the Final Stretch


    # # Selecting and Installing the Packages


    At this point, you have successfully completed partitioning your hard drive, either
    by allowing YaST to do it automatically or by doing it as described in the previous
    section. The next menu screen that appears, the package management screen, is
    shown in Figure 5-18. At this point, you need to select what to install on your
    system. If else would you be going through all the steps in this chapter?


    ![](img/96a9ce6a13d8d15ed05f867f41574278_110_0.png)


    **Figure 5-18:**

    The package management main menu.


    The programs and files of Linux are installed as packages. The SuSE Linux For
    Dummies CD-ROM that this book contains more than 300 packages. You can use YaST
    to install and uninstall these packages. You can also use YaST to install all
    the packages on the CD-ROM, search for individual packages, and view the contents
    of a package.


    Some packages depend on the presence or absence of other packages. These interrelationships
    are called dependencies. YaST is designed to verify that all necessary package
    dependencies are satisfied before installing any packages. YaST is a powerful
    tool and you will grow to appreciate how easy it makes installing packages on
    your SuSE Linux system.


    Choosing which the 300-plus packages to install may seem like a daunting task,
    given that some are necessary and have dependencies. Luckily, the developers of
    SuSE have created a default configuration of the necessary and most useful packages.
    At this point in the installation process, the packages on this default are selected
    to be installed. If you are anxious to continue the installation, you can simply
    select the Start Installation menu to install these preselected packages, and
    then skip to the next section of this book. We recommend, that you take a few
    minutes to read about the YaST features for selecting additional packages to install.
    It is important to add more packages after you have finished installing SuSE Linux.'
  merge: -1
