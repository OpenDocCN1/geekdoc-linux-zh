  md: '![](img/96a9ce6a13d8d15ed05f867f41574278_225_0.png)


    +   3. Click the Move mouse item.


    Observant types will notice the cursor changes shape.


    +   4. Move the mouse to take the window to the next location, and click the left
    mouse button when the window is in the proper position.


    Another way to move a window is to place the cursor in the center of the window''s
    title bar, and then drag the window. Release the left mouse button when the window
    is in place.


    # # Resizing to your heart''s content


    Sometimes a window is a little too big or a little too small. Life would be much
    easier if you could just nudge that window into shape. To do just that, follow
    these steps:


    +   1. Choose a window and give it focus.


    +   2. Click the hyphen symbol.


    The Window function menu appears.


    +   3. Click Resize. Your cursor jumps to the bottom-right corner of the window
    and changes shape again.


    +   4. Move the cursor up and to the left, just a little bit.


    As you do this, you will notice that the window is changing shape. As you can
    see when you resize the window, it is divided into nine parts: four corners, four
    side sections, and one center section. The center section doesn''t do anything
    in resizing. The four side sections allow resizing in a perpendicular direction
    from their side (that is, straight in or straight out). The four corners allow
    resizing in two directions at once; by grabbing a corner, you can make the window
    both wider and taller at the same time.


    +   5. When the window is the right size and shape, click once with the left mouse
    button.'
