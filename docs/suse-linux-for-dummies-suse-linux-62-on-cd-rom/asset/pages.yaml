  md: '# 78 Part II: Installing SuSE Linux


    If you plan to have more than four partitions on your hard drive, you need to
    create an extended partition. Inside the extended partition, you can create multiple
    logical partitions. The need for this arrangement of creating one large, extended
    partition with multiple logical partitions inside it is not a limitation of Linux,
    but rather a limitation of modern hardware. As far as Linux is concerned, the
    logical partitions do not function any differently than primary partitions.


    Next you are prompted with a list of the available partitions, and you should
    select the one on the top of the list. This is example, in Figure 5-10, the first
    available partition is /dev/hda2 If you were creating a logical partition, it
