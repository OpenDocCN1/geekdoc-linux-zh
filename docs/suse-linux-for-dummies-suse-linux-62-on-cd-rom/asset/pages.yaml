- pgno: 52
  md: '# Mail Interfaces


    E-mail consists of two main parts: a front end (or interface) that you use to
    compose or read messages and a back end that delivers your messages. In addition
    to the mail-specific programs described in this section, note that some Web browsers
    can read mail, read Internet News (a series of information accessible over the
    Internet), handle FTP downloads of files, and perform other Internet-related tasks.


    # Character-cell interfaces


    The first mail interfaces were available only in character-cell mode. In this
    section, we discuss several character-cell interfaces; some are freeware and others
    are commercial packages.


    mail(1), one of the first mail interfaces, is a character-cell interface for early
    versions of UNIX. mail remains a powerful interface, and sometimes we use it when
    our system is in character-cell mode and we want to send a quick mail message
    or scan re mail messages.


    elm(1) is an interactive screen-oriented mailer that we can use in place of mail
    as a front end. It''s easy to use and presents a vim(1)-like editor for creating
    mail messages.


    pine(1) (which now means program for Internet news and e-mail was previously known
    by the friendlier name pine is not elm) is another full-screen mail interface.
    Figure 2-5 shows the initial pine screen.


    ![](img/96a9ce6a13d8d15ed05f867f41574278_52_0.png)'
  merge: -1
  img_proc: true
- pgno: 53
  md: '# 26 Part I: Introducing Linux


    pine has several of the features found in elm, plus a few more. pine uses a simple
    pico editor for composing mail and can handle MIME (Multipurpose Internet Mail
    Extensions), which enables you to send pictures, computer programs, and other
    nonexistent items through the mail. Figure 2-6 shows the screen for sending mail.
    Notice how pico formats all headers for you and enables you to include MIME attachments.


    pine runs on DOS and Windows systems as well as on any UNIX systems. It includes
    a built-in spell checker (always nice when writing messages to the boss), pine
    can read NNTP, which is used to access Internet News. Finally, pine can handle
    IMAP, which sends your mail to a holding place that you can access from anywhere
    on the Internet. This is especially nice when you are traveling with Linux on
    your notebook computer because you can connect to your Internet service provider
    (ISP) and answer your e-mail.


    mh(1), also known as the RAND Message Handling System, is a series of commands
    that enable you to manipulate mail at the command-level. mh is a comprehensive
    mail interface, enabling you to create different folders for mail, scan mail in
    those folders in several ways, reply, forward, and otherwise handle your mail.
    Because mh consists of all these different commands, it was used to build two
    useful graphical mail interfaces: xmh(1) and exmh(1). Although elm, and pine are
    on the CD-ROM that comes with this book, mh, xmh, and exmh are not.


    ![](img/96a9ce6a13d8d15ed05f867f41574278_53_0.png)


