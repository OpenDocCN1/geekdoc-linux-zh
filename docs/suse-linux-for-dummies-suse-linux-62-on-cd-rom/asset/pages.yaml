    # First, the conditions


    One series of commands is typically used not on the command line, typed in one
    line at a time, but only in a shell script to make decisions. These commands are
    flow control, or conditional, statements, and are found in many computer languages
    in different forms. The simplest one in the bash shell language is if. The statement
    is usually written as follows:


    ```

    if list1

    then

    list2

    [elif list3

    then

    list4]

    [elif list5

    then

    list6]

    [else list7]

    fi

    ```


    Seems ugly, doesn''t it? But it isn''t too bad. Note that overall it begins with
    and ends with fi, which is the backward spelling of if. Who says computer programmers
    have no sense of humor?


    The list statements represent other shell commands, statements, and so forth that
    should be tested to see whether they are true or false (list1, list3, and list5)
    or executed (list2, list4, list6, and list7).'
  merge: -1
  img_proc: true
- pgno: 211
  md: '# 184 Part III: Using Linux


    So what are some examples of list statements? You see one in the next exam, which
    is a test to see whether a file exists. In this case, the built-in function test
    -e sees whether a filename exists; if it exists, echo says so. You can try this
    out on the command line without putting it in a shell. Make sure that you have
    spaces in front of and behind each left [ and right bracket ]. A > appears after
    the first line, to show that the shell is expecting you to type some more:


    ```

    maddog@localhost:~/reports > if [ -e /etc/passwd ]

    then

    echo file exists

    else

    echo file does not exist

    fi

    file exists

    maddog@localhost:~/reports >

    ```


    Now, to test whether the if statement can detect the passwd filename, type your
    name incorrectly:


    ```

    maddog@localhost:~/reports > if [ -e /etc/passwd ]

    then

    echo file exists

    else

    echo file does not exist

    fi

    file does not exist

    maddog@localhost:~/reports >

    ```


    You can make other simple tests, such as


    +   - f for whether a file exists and is a regular file, not a directory or device
    file

    - d for whether a file exists and is a directory

    - r for whether a file exists and is readable


    You can read more about tests you can perform on filenames in the manual pages.
    You can even combine tests to check for many conditions at one time.


    # Putting your ideas together


    You are ready to put the concepts from the first shell script together with the
    concepts from the second shell script? The result is a program that selects two
    passwd files from different months and compares them. The program tests to make
    sure that all the filenames are typed correctly on the command line, and extracts
    the information from the files, compares them, and prints the differences, if
    any.'
