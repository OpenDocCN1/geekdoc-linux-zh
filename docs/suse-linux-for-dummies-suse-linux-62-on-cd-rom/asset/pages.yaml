  md: '# 274 Part V: Going Online


    +   1. Click in the To field and type your own e-mail address.

    2. Click in the Subject field and type a suitable subject.

    3. Click in the body of the message and type your message.

    4. Click the Send icon.


    If you are sending a message to yourself, it won''t appear instantaneously. It
    still has to go down the telephone line, be analyzed by the server, and sent back
    to you, so be patient.


    You can also attach a file, an image, or even a sound to your message and send
    it to friends who use Netscape (or another MIME-compliant mail reader). To attach
    a file to your letter, simply click the Attach icon at the top of the Compose
    window. A dialog box like the one in Figure 16-15 appears, allowing you to search
    the file structure of Linux looking for the file you want to send.


    ![](img/96a9ce6a13d8d15ed05f867f41574278_301_0.png)


    At this point, you can do basic functions with the Internet, but there is much
    more available. For starters, use the Help facility in Netscape to read about
    the different options. Out across the Net (despite my earlier sarcasm) is a wealth
    of data to which you now have access. Remember, however, that data can be good
    data or bad data, and you have to use your common sense to figure out whether
    your data source is knowledgeable or unreliable. Happy surfing!'
