- pgno: 13
  md: '# Authors'' Acknowledments


    Jon “maddog” Hall:


    Certainly the continued hard work and contributions of the Linux community in
    creating a truly amazing operating system that made this book necessary. Every
    time I think that I have seen the epitome of inventive genius, the community surpasses
    itself again. (For those of you reading this in a bookstore, questioning whether
    it is worth your time and effort to use the Linux operating system, my answer
    is “yes,” whether you buy this book or not.)


    And now, gentle reader, may you find Linux as interesting and rewarding as I found
    writing this edition.


    My love to you all.


    Jay Migliaccio:


    With most of our accomplishments in life, the results are rarely attributed to
    the efforts of one individual. This book is no exception. I would be gravely mistaken
    to suggest that I could name them all, but there are a few individuals who stand
    above the rest, when considering who has made possible that lies in the pages
    ahead.


    Susan Christophersen, my editor, and Stu Green, the technical editor, have proven
    to be vigilant in their pursuit of “debugging” the text. Their concise review
    and thoughtful comments have contributed greatly to the readability and technical
    accuracy of this book. Without them, this book would not be possible, and I thank
    them for their efforts!


    Jon “maddog” Hall, the main author of this book, has provided a great foundation
    on which I was able to create SuSE Linux for Dummies. His endless efforts as well
    as his passion for Linux and contributions to the Linux community are of tremendous
    value to us all. Thanks, Jon, for doing such a great job!


    Thanks to Anne Pinkowski and Emmanuel Briand, two of my greatest friends, who
    introduced me to computer networking and Linux, respectively. You are both an
    inspiration to me. I would not be where I am today without the two of you, and
    now that I am finishing up with this book, I look forward to spending more time
    with you both!'
  merge: -1
  img_proc: true
- pgno: 14
  md: 'I also owe a word of thanks to the Techncial Support Department at SuSE Linux.
    You guys are the best! There is never a day that goes by in which I have not learned
    something from one of you. Your tireless efforts to answer all those crazy questions
    from newbies does not go unnoticed.


    Last, but not least, are all of the developers that work on Linux, GNU, Xfree86,
    Samba, KDE, GNOME. It is you, the unsung heroes, who provide the foundation and
    vision for the Linux community. I continually stand in awe of your efforts and
    your vision of a world where we, the people, are no longer constrained by the
    chains of proprietary software. The words “thank you” do not come close to expressing
    the gratitude that I feel.'
  merge: -1
  img_proc: true
