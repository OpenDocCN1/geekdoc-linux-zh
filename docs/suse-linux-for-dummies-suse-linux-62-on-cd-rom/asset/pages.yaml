- pgno: 10
  md: '# About the maddog


    Jon "maddog" Hall is the Executive Director of Linux International, a vendor organization
    dedicated to promoting the use of the Linux Operating System. He has been in the
    computer industry for just more than a quarter century (somehow that sounds more
    impressive than just "25 years”), the past 18 years of which have been spent using,
    programming, and the UNIX operating system. Currently, Jon works for Compaq Computer
    Corporation, where he is helping to shape Compaq''s strategy with respect to Linux.
    Previously, Jon was the Department Head of Computer Science at Hartford State
    Technical College, where his students lovingly (he hopes) gave him the nickname
    "maddog" as he tried to teach them operating system, compiler theory, and how
    to live an honorable life.


    While working for Digital Equipment Corporation in May of 1994, maddog met Linux
    Torvalds, and was intelligent enough (his critics say maddog was just lucky) to
    recognize the potential of the Linux Operating System. Linux changed his life,
    mostly by providing him with 22-hour work days. Since maddog started working with
    Linux, however, he has also started meeting girls (in particular his two grandchildren).
    You can usually find Jon speaking at various Linux conferences and events (maddog
    just barks), and he has also been known to travel long distances to speak to local
    Linux users


    Jay Migliaccio, in his current reincarnation, is the supervisor of technical support
    at SuSE Inc., where he has answered hundreds of questions on installing SuSE Linux.
    In addition to his technical support duties, he uses his fluency in German to
    assist with the translation of technical documents, including the manual and the
    SuSE Database articles that are posted on the SuSE Web site. He has been employed
    by SuSE since March of 1999. Prior to his position at SuSE Inc., he was a network
    consultant, where he performed system upgrades and support for large corporate
    networks.


    In his previous incarnation, he put his engineering degree to work as a highway
    design engineer at the Rhode Island Department of Transportation. In that position
    he worked in the maintenance and upgrade of the Rhode Island transportation network
    — in contrast to his current position, where he works on information networks.'
  merge: -1
  img_proc: true
