- pgno: 276
  md: '# Chapter 15


    # Setting Up Your Internet Connection


    +   In This Chapter

    - Finding an Internet service provider

    - Connecting with your modem

    - Making the connection between your modem and Internet service provider

    - Starting and stopping the Internet service software


    One of the things to do these days is to surf the Internet. You connect to the
    Internet and tie up your phone line for hours, looking for obscure information
    and e-mail to people you barely know and never speak to the phone.


    Now you, too, can go to a party and drop the casual phrase "I found this while
    surfing the Net this afternoon... (which will draw bored looks) ... on my Linux
    system." The mention of Linux will immediately show that you are truly a person
    of class and standing in the Internet community.


    First, though, you have to find a good Internet service provider, hook up your
    phone to the computer (using a device called a modem), and feed a few simple commands
    to your Linux system (and the networking gods) to make the connection.


    # The Search for an ISP


    We categorize Internet service providers (ISPs) by those who specialize in Windows
    and Windows NT products and those who are good. By good, we mean ISPs who can
    also handle UNIX and Linux accounts.'
  merge: -1
  img_proc: true
- pgno: 277
  md: '# 250 Part V: Going Online


    To find a good ISP, first look in the local Yellow Pages under Internet or Internet
    Service Providers. List the names and telephone numbers of any you find. These
    companies are probably local companies, which is fine if you want to communicate
    from your home only. If you do a lot of traveling, you may want to call the following
    national providers:


    +   - AT&T WorldNet: 800-967-5363

    - Mindspring: 888-677-7464

    - Earthlink: 800-395-8425


    Next, talk to some friends who live close to you and ask them ISP they use and
    what they think of their service. If a service has used local access numbers,
    you get busy signals a lot. Also ask about the technical help, in some services
    is poor or nonexistent.


    Finally, call the ISPs and tell them you have a Linux system and are interested
    in PPP services, with e-mail and news. Find out they have access numbers in your
    local calling area. You''ll end up making a long-distance call each time you connect.
    Check their prices and whether they have unlimited service (a flat rate no matter
    how many hours you are logged). A typical price for unlimited service is $20 per
    month. ISPs that host Web pages are a plus, as are ISPs who can filter j-email,
    or spam.


    ![](img/96a9ce6a13d8d15ed05f867f41574278_277_0.png)


    This is a good time to verify that your own telephone service is flat rate and
    not metered.


    Tell the ISP the highest speed of your modem. You will probably also be asked
    for a login name and a password for the ISP''s server, so you may want to have
    these written down ahead of time.


    # The Polish connection


    | A young friend of mine from Poland to visit me. He had obtained a nationwide
    ISP service to keep in touch through the Internet with family and friends back
    home. Unfortunately, the closest number to his ISP connection site was a long-distance
    call from my house. I cautioned | him to keep his connection time down so that
    I wouldn''t have a lot of long-distance charges. He assured me he would. The month
    after he went back to Poland, I received my phone bill — with $70 in long-distance
    telephone charges to his Internet provider. Hi, Antoni! | |'
