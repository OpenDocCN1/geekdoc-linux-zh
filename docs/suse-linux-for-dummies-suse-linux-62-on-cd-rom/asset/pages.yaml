- pgno: 273
  md: '# 246 Part IV: Maintaining your System


    10. Type make bzlImage to make the new kernel.


    11. Type make bzlilo to have the new kernel moved to the /boot/ directory. This
    command will also run lilo.


    As the preceding text, you invoked the program that configures the kernel, allowed
    Linux to recognize and make all the dependencies for creating a new kernel, cleaned
    up old files lying in your kernel directory structure, and then made the kernel.


    In addition, have you run the command bzlilo, which copied the newly compiled
    kernel to the proper location (/boot/vmlinuz) and ran lilo, which updated the
    boot loader. In addition to moving /boot/vmlinuz, it took the original kernel,
    which was /boot/vmlinuz, and moved it to /boot/vmlinuz.old. When you reboot the
    system, you will boot to the new kernel.


    We recommend you be cautious and make a boot option for the kernel (the one that
    was just moved to /boot/vmlinuz.old). This can be easily done from YaST, and the
    details of how to create a boot configuration are described in Chapter 5. When
    you need to start YaST and select System Administration from the main menu. From
    the System Administration submenu, select Kernel and Boot Configuration. In this
    submenu, select LILO Configuration. The ensuing dialog box will help you configure
    LILO to have a second boot option. Please refer to Chapter 5 for details.


    ![](img/96a9ce6a13d8d15ed05f867f41574278_273_0.png)


    # Finishing the kernel rebuild


    After the kernel is rebuilt the way you want it, you''ll probably have to remake
    any modules you want to use. These are the modules that you specified in the kernel
    as loadable. The easiest way to rebuild your kernel modules is to type make modules
    and make modules_install after the basic kernel is built.


    Because of the modules that you may need have already been compiled and are available
    for your use, this step may not be necessary. However, if you elected to have
    a new module created (one that was not previously selected) when you were configuring
    your kernel in the previous section, recreating the modules is a good idea.


    After you have recreated your modules, you need to take one final important step.
    You need to recreate the modules dependency file. This is the file that specifies
    which modules have dependencies, as well as which modules they are dependent on.
    Fortunately, it is easy to be done with this command:


    ```

    depmod -a

    ```'
