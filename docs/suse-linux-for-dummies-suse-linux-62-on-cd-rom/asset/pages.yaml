- pgno: 272
  md: 'In addition, although you have recompiled the kernel, you still have not made
    it available as a boot option. This is covered in the next section; please read
    on.


    # Instructions and data not needed


    Although remaking the kernel and changing only the processor type will typically
    make your system go faster by utilizing new instructions in the CPU architecture,
    just changing the processor type will not anything for the size of the kernel,
    which may be very large if you''ve requested support for features you don''t use.
    Simply changing the CPU architecture will also not support functionality or devices
    not listed in the installation kernel.


    Fortunately, a lot of support for different kernel functionality and device drivers
    is in modular form and is available through both loadable kernel modules and loadable
    device drivers. Because of these two features, a Linux kernel out of the distribution
    handles a many devices and features without having to be rebuilt. If a specific
    feature does not seem to work, however, a look at the kernel configuration is
    probably in order.


    +   1. Log in as root.


    +   2. Change to the /usr/src/linux directory.


    +   3. Type make menuconfig.


    The screen that was shown back in Figure 14-2 appears.


    +   4. Use the arrow keys to reach General setup and press Enter to select that
    entry.


    +   5. Move the cursor to an option of interest, and type ? (question mark).


    The configuration program attempts to tell you what the option means, and what
    its pitfalls and advantages are. It also makes suggestions regarding whether to
    include it as a module or to include it at all.


    +   6. Move down all the menu items using the arrow keys and select what you want
    to include.


    Looking at the elements in Figure 14-3, you can see that the entries with square
    brackets ([ and ]) from them have two possible values. By moving the cursor to
    them, you can choose blank (which is unselected) or * (which means selected).
    If the selection has < and > brackets, you have three possible values: unselected,
    selected, or module.


    +   7. Press the Tab key to move to the exit and press Enter.


    +   8. Tell the system to save your new kernel configuration file.


    +   9. Type make dep and when command is finished and the command prompt appears
    again, type make clean. That command is finished, the command prompt will appear.'
