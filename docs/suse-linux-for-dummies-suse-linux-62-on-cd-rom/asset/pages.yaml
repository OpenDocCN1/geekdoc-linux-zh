    In all those numbers and pieces of data, we are concerned about the page in and
    page out numbers as the swap in and swap numbers in real memory. Although these
    numbers (particularly the page in and page out numbers) may never be zero, having
    numbers that are gigantic or increasing at a fast rate is not good because would
    mean your system memory starved and your CPU is waiting for virtual memory to
    be brought into real memory before it can continue processing. How much can this
    slow your computer day? In a particularly bad (and, luckily, rare) case, memory
    shortages made a program that would normally run in three minutes run ten hours.


    ![](img/96a9ce6a13d8d15ed05f867f41574278_265_0.png)


    In general, if your system seems to be very slow, at the paging and swapping numbers
    to see whether the system is constantly paging or swapping. More main memory can
    help the solution.


    # Enhancing Disk Performance


    After your system has enough main memory, you may want to look at how well your
    disks are performing. Linux (like a lot of UNIX operating systems) is very disk
    oriented. Many programs that Linux users execute from disk, execute for a short
    time (creating swap space on the disk and releasing it), and then terminate. In
    particular, when you create a pipeline in shell programming, the last few programs
    on the command line may not do any work because they depend on data flowing through
    them before they do anything. If no data reaches the last programs in the pipeline,
    they can''t do anything and terminate. Suppose that the last program is the sort
    program. Its job is to sort the output into a particular order and then allow
    the display of the output on the screen. If no data comes through the pipeline
    to sort, the sort program''s job is very short (kind of nonexistent), and all
    the work the sort program did preparing


    Linux also does a lot of work with temporary files. The C compiler generates many
    temporary files while it is compiling a program, and the sort routine does the
    same thing while sorting (that sort routine). All these temporary files flush
    data out to the disk or bring data from the disk, creating a bottleneck through
    the disk subsystem.


    Linux sets aside a certain amount of main memory in its dynamic buffer cache to
    hold data moving from the disk to the CPU and vice versa. When data is read from
    the disk, it goes into the disk cache. Usually,'
  merge: -1
  img_proc: true
- pgno: 266
  md: '# Chapter 14: Customizing Linux 239


    more data that was originally requested goes into the cache (in a process known
    as read-ahead). When more information is needed, the CPU can often just go to
    the buffer cache and get the data quickly, without having to wait for the disk.
    When data is written to the disk, it often goes only as far as the buffer cache.
    It sits there until it is needed again or until the buffer cache is told to write
    its data out to disk.


    # Sync or swim


    In the preceding section, you find out about the dynamic buffer cache, which is
    used to reduce the number of physical accesses to the disks. The operation of
    syncing the file system is a request — initiated by the user or a program in Linux
    — to write the buffer cache out to the disk (also called volatile memory) for
    safekeeping rather than leaving it in RAM (also volatile memory). If a sync was
    never performed, some data might stay in RAM forever, without ever written out
    to the disk. If this happened, when the system crashed (due to a power failure,
    of course), you wouldn''t know whether you wrote to it ever made it to the disk.
    When you execute a sync command, it writes all this data. Unless something is
    radically, most or all of this is written in the next few seconds. Then the cache
    becomes empty and starts to fill again, if necessary.


    In Linux, the processing of the dynamic buffer cache has been given to a daemon
    (a program that runs in the background and does things for the user transparently)
    bflush, which flushes data every 30 seconds or so. Smaller, smaller pieces of
    data go out every five seconds. (This is one reason that your Linux system doing
    something with the disks every few seconds, even when you''re not doing anything
    with your system.) Unless your disk fails, the work bflush means that you may
    never have a significant loss of data. bflush normally starts automatically when
    you boot Linux.


    ![](img/96a9ce6a13d8d15ed05f867f41574278_266_0.png)


    The dynamic buffer cache shares RAM with the virtual memory subsystem, and VM.
    As VM becomes more active and needs more RAM to be efficient, your dynamic buffer
    cache tends to become smaller, giving up its memory to the VM subsystem. As the
    buffer cache becomes smaller, the I/O load on the disks tends to get heavier.
    Each disk on your system will probably experience more I/Os but probably in an
    uneven fashion. When things quiet down and VM has a lot free RAM, the memory is
    automatically given back to the dynamic buffer cache.


    You can picture your disks as being the tollbooths on a highway. When a road has
    only one toll booth, all the traffic has to go through it. If traffic is light,
    no problem occurs (other than paying the toll). If traffic is heavy, however,
    the cars back up. Putting in another toll booth allows twice as many cars to be
    handled. You see almost twice as many because the cars may not'
