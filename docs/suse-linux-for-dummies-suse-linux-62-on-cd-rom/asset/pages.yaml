    \ tasks. You can use two devices to alter a command: command options and standard\
    \ input and output redirection. You find out about command first.\n\nYou can use\
    \ command options to fine-tune the actions of a Linux command. Earlier in this\
    \ chapter, we introduce the ls command so that you could see the results of actions\
    \ taken on the file system, but we don't explain in section how it worked or what\
    \ changed it did. To see how options work, in the next example you try out the\
    \ ls command several times, with different options.\n\nUse the mkdir command to\
    \ make a new directory called gregger; then, use the cd command to change your\
    \ working directory to that new directory:\n\n```\nmaddog@localhost:~/emptirectory>\
    \ mkdir gregger\nmaddog@localhost:~/emptirectory> cd gregger\n```\n\nAt the Linux\
    \ prompt, type ls as follows:\n\n```\nmaddog@localhost:~/emptirectory/gregger>\
    \ ls\nmaddog@localhost:~/emptirectory/ \n```\n\nThat didn't do much, did it? It\
    \ seems as if the account has no files. You may need an option. Try the -a option\
    \ and see what happens:\n\n```\nmaddog@localhost:~/emptirectory/gregger> ls -a\n\
    maddog@localhost:~/emptirectory/ \n```\n\nRemember to type the commands and options\
    \ exactly as shown. For example, the ls -a command has a space between the command\
    \ and the option, and no space between the hyphen and the letter a.\n\nNotice\
    \ the two files (they're actually directories, but in Linux all directories are\
    \ just files) that the ls command displayed. What? All you see are dots? Well,\
    \ the single dot represents the directory you are in; the double dot represents\
    \ the parent directory, typically the one above the directory you're in. (Linux\
    \ creates these filenames and puts them into the directory for you. If you just\
    \ installed your directory, all you have are files that begin with a period.)\n\
    \nNow we create a few additional files in the gregger directory, using the touch\
    \ command:\n\n```\nmaddog@localhost:~/emptirectory/gregger> touch file1\nmaddog@localhost:~/emptirectory/gregger>\
    \ touch .dotfile\n```\n\n![](img/96a9ce6a13d8d15ed05f867f41574278_176_0.png)"
