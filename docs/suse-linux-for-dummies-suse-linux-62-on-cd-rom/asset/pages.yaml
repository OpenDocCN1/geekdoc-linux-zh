    Most UNIX and Linux people write Ctrl+D as ''D'', which makes end of file (EOF)
    to Linux. When the cat command sees ''D'', it assumes it''s finished with that
    line and moves to the next one. If ''D'' is on an empty line by itself, the cat
    command has no other output to move to and thus exits.


    We promised we would explain the usefulness of the cat command. We

    alway try to keep our promises, so here you know three

    symbols:


    +   > is known as redirection of standard output. When you use this symbol, you
