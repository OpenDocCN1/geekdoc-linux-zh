- pgno: 244
  md: '# Chapter 13


    # File System Management


    In This Chapter


    +   - Making your files available to Linux by mounting a file system

    - Dismounting a file system

    - Playing inspector to search for other users

    - Experiencing the joys of configuration files

    - Rehabilitating corrupted files

    - Increasing disk space with a new drive

    - Using more floppies

    - Adding a CD-ROM drive


    Managing the Linux file system is one of the more important jobs in maintaining
    and updating your Linux system. You have the responsibility of creating the Linux
    file system and seeing to it that users (even if you are the only user) have access
    to secure, uncorrupted data.


    The tasks associated with file system management include the following:


    +   - Diagnosing hardware failures

    - Preventing file corruption

    - Blocking user errors

    - Connecting and configuring new hardware

    - Managing disk resources


    Some of these tasks are performed automatically, thank goodness. Others you must
    do manually as needed. In this chapter, you discover the ins and outs of managing
    your Linux file system — the easy way.'
  merge: -1
  img_proc: true
- pgno: 245
  md: '# 218 Part IV: Maintaining Your System


    # Mounting and Dismounting


    Files are important to Linux and other UNIX-like operating systems in ways that
    are different from their importance to DOS, Windows, and Macintosh operating systems.
    In Linux, everything is stored as a file in a predictable location in the directory
    structure — Linux even stores commands as files. Like other modern operating systems,
    Linux has a tree-structured, hierarchical directory organization called a file
    system.


    All-user disk space is combined in a single directory tree. The base of this system
    is the root directory, which is designated with a slash, /. The contents of a
    file system are made available to Linux by merging the file system into the system
    directory through a process called mounting.


    File systems can be mounted or dismounted, which means file systems can be connected
    or disconnected to the directory tree. The exception is the root file system,
    which is always mounted on the root directory when the system is running and cannot
    be dismounted. Other file systems may be mounted as needed, such as ones contained
    on another hard drive, a floppy disk, or a CD-ROM.


    # The command syntax


    Here''s the command syntax for manually mounting a file system:


    ```

    mount block-special-file mount-point

    ```


    where block-special-file is the device driver file for the partition of the disk
    drive (such as a hard drive or a CD-ROM) where you have made a file system, and
    mount-point is the directory where the file system is mounted.


    Want to see the mount command assign the first floppy drive, /dev/fd0, to the
    /mnt directory? Hey, did we provide a good example or what?


    ```

    mount /dev/fd0 /mnt

    ```


    A file system can be mounted in only one place at any given time.


    The directory where the file system will be mounted (mount-point) must exist before
    you issue the mount command. Otherwise, the command will not work. If you need
    to create the directory, use the mkdir command, like this:


    ```

    mkdir /canadianpolice

    mount /dev/fd0 /canadianpolice

    ```


    ![](img/96a9ce6a13d8d15ed05f867f41574278_245_0.png)'
  merge: -1
  img_proc: true
- pgno: 246
  md: '# Chapter 13: File System Management


    The first command makes a new directory called /canadianpolice. The second command
    mounts onto that new directory the file system on the disk in the floppy drive
    — /dev/fd0.


    When you are finished or fed up with the file system you have mounted on /canadianpolice,
    you must dismount it using the umount command. The syntax for the umount command
    is


    ```

    umount name=block-special-file (/dev/fd0)

    ```


    where name is either the name of the block-special-file (/dev/fd0) or the name
    of the directory that is the mount-point (/canadianpolice).


    # Sleuthing for other file users


    Because Linux is a multiauser operating system, sometimes more one user is logged
    in to the system at the same time. This may mean that multiple file systems are
    mounted and in use. The umount command works only on inactive file systems. If
    one of the files in the file system is the current directory, an error message
    says that the device is busy.


    How do you find out files are used and by whom? You use the fuser command. (Get
    it? Find user — fuser.) The command returns a lot of information, identifying
    which processes are using a particular file or file system and which user is using
    them. If you use fuser with a filename, it returns information on just that file.
    If you invoke fuser with the block special filename, fuser reports on all the
    files in that file system.


    The fuser command has two options you may find useful:


    +   - displays user names along process IDs

    - enables you to specify the file system by name


    fuser is a character-cell program. By running fuser with the -u option, you can
    get the number of programs using the file system along with the user name of the
    person using them. For example:


    ```

    [maddog@shamet p3ch92023$ /usr/sbin/fuser -u /home/

    492r(maddog) 503r(maddog)

    504r(maddog) 508r(maddog) 580r(maddog)

    581r(maddog) 585r(maddog) 586r(maddog)

    598r(maddog) 599r(maddog) 601r(maddog)

    879r(maddog) 1287r(maddog)

    [maddog@shamet p3ch92023$]

    ```'
  merge: -1
  img_proc: true
- pgno: 247
  md: '# 220 Part IV: Maintaining Your System


    Here you can see that maddog (that dirty dog!) has a series of programs using
    the /home file system. If you want to see what those programs are, you can use
    the ps command, which shows the process numbers and names of the processes running
    in the system:


    ```

    [maddog_shamelet p3ch0920]$ ps ax |grep 601

    601 po S 0:00 /opt/applic/appellix

    [maddog_shamelet p3ch0920]$

    ```


    We ran ps to see all the processes in the system in extended mode so that you
    could see additional information about them instead of just their names. Then,
    using the grep command with the process number 601 as an argument, we isolated
    one line from the output of the ps command. You can see that the program is running
    the /opt/applic/appellix program. This is just one of the programs that you have
    to shut down unmount the root file system.


    By repeating the ps and grep commands, substituting other numbers for 601, you
    can see all the processes and know which programs to shut down. You can then ask
    the people running those processes to quit their programs, or you can use the
    kill function of fuser


    To use the kill function of fuser, you simply use the -k flag on fuser when you
    list the file systems you are trying to unmount. For example:


    ```

    fuser -ku /home

    ```


    kills all the processes are shut down and no one else is using the file system,
    you can unmount the file system.


    # Configuring file systems


    Mounting all file systems manually every time you boot the system would quickly
    become annoying. To avoid this, you can have the system execute the required mount
    commands when you boot. The information needed to execute the required mount commands
    is in the standard Linux file system configuration located at /etc/fstab. The
    entries in the file usually follow this format:


    ```

    block-special-file mount-loc type opts dump-freq pass-number

    ```'
  merge: -1
  img_proc: true
- pgno: 248
  md: '# Chapter 13: File System Management


    where


    +   - block-special-file is the name of the special file where the system resides,
    a block device name such as /dev/hdal for the first partition on an IDE drive.

    - mount-loc is the directory where the file system will be mounted. If the directory
    is on a partition used for swapping, use swap for mount-loc.

    - type is the kind of partition. For a native Linux file system, type is ext2.

    - opts is the field for listing options, separated by commas. The options may
    include any of the:


    +   - rw

    Allow the file to be read and written to (read-write mode).

    Allow the file to be read only (read-only mode).


    +   - dev

    Treat special files in this file system as special files.


    +   - nodev

    Treat special files in this file system as filenames.


    +   - exec

    Permit execution of binary files from this file system.


    +   - noexec

    Prevent the execution of binary files from this file system. This is useful for
    file systems that have all data to prevent programs being introduced by system
    crackers or to prevent people from trying to execute programs that were meant
    to run on a different system, such as MS-DOS.


    +   - auto

    Allow the file system to be mounted with the -a option to the mount command.


    +   - nouser

    Forbid a non-superuser from mounting the file system.


    +   - async

    Write data to the file system asynchronously. The system is faster but you can
    lose data if a system failure occurs.


    +   - suid

    Write data to the file system synchronously.

    Permit the suid (set user id) access mode (the default).


    Theid access mode enables an executable program with the suid (setgid) permission
    bit to take on the personality and permissions of the owner (or the group) of
    the executable program. This can be a security hole; specifying the nosuid option
    prevents files in this file system from having the set user id (or setgid) access
    take effect.


    ![](img/96a9ce6a13d8d15ed05f867f41574278_248_0.png)'
  merge: -1
  img_proc: true
- pgno: 249
  md: '# 222 Part IV: Maintaining Your System


    | nosuid | Do not permit the suid access mode. |

    | noauto | Do not automatically mount this file system when the -a option is used
    with the mount command. |

    | usrquota | User quotas may be put in effect. |

    | grquota | Group quotas may be put in effect. |

    | defaults | A combination of rw, suid, dev, exec, auto, nouser, and async. |


    +   - dump-freq is the frequency with which the file system may be backed up by
    the dump utility (not all systems use this).

    - pass-number is a decimal number specifying the order in which fsck file system
    utility, checks the file systems. A pass-number of 1 indicates that this file
    system should be checked first. This is the pass-number assigned to root. All
    other file systems should have a higher number. Two systems in parallel to speed
    up, but file systems on the same drive can have different pass-numbers. For swap
    devices, the pass-number should be 0 (zero), which disables fsck checking.


    Following are examples of typical /etc/fstab entries:


    ```

    /dev/hdb1   ext2 defaults 1 1

    /dev/hdb3  none swap    sw      0 0

    /dev/hda1   /w95 mdsdos noauto  0 0

    ```


    The first line enables mounting of the first partition of the second IDE disk
    as the root system. It is a Linux file system and uses the rw, suid, dev, exec,
    auto, nouser, and async options. The first entry in /etc/fstab file indicates
    that the root file system should be dumped (backed up) once a week (using the
    man dump command for details). Finally, the first entry of the /etc/fstab file
    indicates that the root file system should be the first file system to have fsck
    performed on after booting the system.


    The second line shows that the third partition of the second IDE disk is a swap
    partition and has the format of a swap file. It should never be backed, nor should
    you perform the fsck command on the swap partition.


    The third line of the /etc/fstab file points to the first partition of the first
    disk, which is a file system to be mounted on the /w95 directory. This file system
    properly holds Microsoft Windows 95 files, and you can read and write to this
    file system. It will not be automatically mounted with the -a option of mount.
    You should never use dump to back it up, nor should you do a file system check
    on it.'
  merge: -1
  img_proc: true
- pgno: 250
  md: '# Chapter 13: File System Management


    After you set up the /etc/fstab configuration file, file systems can be mounted
    automatically at boot time. In addition after the /etc/fstab file is set up, the
    mount and ummount commands require only mount-point and block-special-file as
    their argument.


    Normally, most of the /etc/fstab file is set up during installation, so you only
    have to update it over time as you add new disks or partitions.


    In SuSE Linux, you can use YaST to update the /etc/fstab file, so that you don''t
    have to edit the file with a text editor (although you still have this option).
    YaST is one of the features of SuSE Linux and is on the SuSE Linux for Dummies
    CD-ROM; you can update the file with YaST, as follows:


    +   1. Log in as root or superuser.


    +   2. Type startx to make sure that X Window System is operating.


    +   3. Click the YaST icon on the panel.

    nThe dialog box shown in Figure 13-1 appears.


