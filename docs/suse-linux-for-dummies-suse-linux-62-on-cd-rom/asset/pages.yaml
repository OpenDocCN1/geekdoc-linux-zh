- pgno: 56
  md: '# Chapter 2: Accessorizing Linux


    ![](img/96a9ce6a13d8d15ed05f867f41574278_56_0.png)


    Figure 2-9: Some of the applications in Appluxware Office Suite.


    # # Multimedia Programs


    Linux typically comes with a series of programs for simple drawing and painting
    as well as image viewing, conversion, and manipulation. It can display still and
    animated images and can record, manipulate, and play back audio (given that your
    hardware has a supported sound card). This section gives you a sampling of some
    multimedia freeware programs that you can use with Linux.


    xpaint is a simple drawing and paint program that you can use to read in an image
    and then perform simple manipulations of the image. xfig is a some-what more sophisticated
    drawing tool. xpaint is not included on the CD-ROM.


    ImageMagick is a freely distributed program for graphical image manipulation.
    This program can read many types of images, make them larger or smaller, cut portions
    of them, transform several images into an animation, and store the images back
    to disk in a different format (if desired). ImageMagick is included on the CD-ROM.'
  merge: -1
  img_proc: true
- pgno: 57
  md: '# 30 Part I: Introducing Linux


    gimp is a graphical image-manipulation program based on plug-ins, which extend
    a program''s capabilities. A gimp feature we like is the intelligent scissors
    feature, which enables you to cut out parts of a photo and paste them onto another
    photo (as in the movie Forrest Gump). gimp is included on the CD-ROM.


    Ghostview is a program for viewing files from PostScript, an industry-standard
    page language for high-end printers. Ghostview uses a program called Ghostscript
    (Aladdin Enterprises) to print PostScript files to a dumb printer (one does not
    have a PostScript program built into it) or to put PostScript files out to a FAX
    machine. Newer versions of Ghostscript have distribution limitations, but older
    versions are freely distributable. Ghostview is included on the CD-ROM.


    maxim(1) is a program for playing back stills, animations, and video — including
    any audio — in various formats. The program can also attach audio streams of various
    formats to the video if it does not already have an audio track. maxim is included
    on the CD-ROM.


    A series of programs mix audio, play back audio, and even mail audio programs.
    For instance, cdplay(1) is a character-cell rendition of a program to play audio
    CDs (assuming that your system has a sound card). xplaycd(1), shown in Figure
    2-10, is a graphical interface for playing a CD. Unfortunately, neither cdplay
    nor xplaycd is included on the CD-ROM.


    The mixer program controls the volume of your sound. You can also mute the sound
    from the control panel, for those times when your or your teenage children come
    into the room complaining about the music you''re playing. mixer is not included
    on the CD-ROM.


    Figure 2-10: An example of the xplaycd program.


