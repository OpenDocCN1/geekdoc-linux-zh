- pgno: 172
  md: '# Chapter 8: Working with Files and Commands


    Another command specifically for removing empty directories is called rmdir. With
    the directory must be empty to be removed. If you attempt to remove the work directory
    without first deleting its files, the system displays the following message:


    ```

    maddog@shamet:~ > rmdir work

    rmdir: work: Directory not empty

    maddog@shamet:~ > rm -rf work

    ```


    # I Grant You Permission


    Files and directories in Linux have owners and are assigned a list of permissions.
    This system of ownership and permissions forms the basis for restricting and allowing
    access to files. Permissions can be used also to determine whether a file is executable
    as a command and how you can use the file or command. It is important to know
    because if you are the only one who uses your system, commands and databases are
    used by other users, including root (the superuser). Permissions on these files
    either allow or disallow you, the general user, from updating these files.


    Using the ls -l option allows you to see the permissions of the files along with
    relevant information, such as who owns the file, what group of people have permission
    to access or modify the file, the size of the file or directory, the last time
    the file was modified, and the name of the file.


    First, create a file with the touch command. The touch command is used for many
    things inside the UNIX and Linux communities, and one thing is for easily creating
    a little zero-length file:


    ```

    maddog@shamet:~ > touch partytime

    maddog@shamet:~ > ls -l partytime

    -rw-r--r-- owner group 0 Oct 31 16:00 partytime

    ```


    The -rw-r--r-- are the permissions for the partytime file; the owner is, and you
    are probably you could be someone or something else, depending on how your system
    is set up and administered.


    You might be wondering how you can become the owner of a file. Well, you are automatically
    the owner of any file you create, which makes sense. As the owner, you can change
    the default permissions — and the ownership. If you change the file ownership,
    you lose ownership privileges.


    To change the ownership of a file or a directory, use the clown command. (Get
    it?) clown — change ownership.) Suppose you''ve decided to settle down and lead
    a more contemplative life, one more in line with a new profession of haiku writing.
    Someone else will have to plan the weekend sprees and all-night bashes. So you
    give up ownership of the partytime file:'
  merge: -1
  img_proc: true
- pgno: 173
  md: '# 146 Part III: Using SuSE Linux


    ```

    maddog@shamet:~ >chown root parttime

    ```


    This changes the ownership of parttime to root. If you want to change it back,
    you can use the chown command but you have to do it as root.


    ![](img/96a9ce6a13d8d15ed05f867f41574278_173_0.png)


    Under some installations of Linux, you can''t give your file away to someone using
    the chown command. You get an error message telling you that the Operation is
    not permitted. Some systems administrators distribute think the chown command
    is a security risk. Therefore, only a superuser can execute the chown command.
    If you have one of distributions (the SuSE Linux For Dummies CD-ROM is one) and
    you want to give your file to others, we suggest that you have the other person
    copy the file, creating a file of her own that would have ownership of.


    Files and users belong to groups. In the parttime example, the group is users.
    Having groups enables you to give large numbers of users — but not all users —
    access to files. Group permissions and ownership are handy for making sure that
    the members of a special project or workgroup have access to files needed by the
    entire group.


    See which groups are available to you on your system, look at /etc/group file.
    To do so, use the more command. You''ll see a file that looks like this:


    ```

    root::0:root

    bin::1:1:root,bin,daemon

    nobody::99:

    users::100:your-user-name, maddog

    floppy:x:19:

    ...

    your-user-name:500:your-user-name

    ```


    your-user-name is the login name you use for your account. Please remember that
    the file will not look exactly like this, just similar. The names at the beginning
    of the line are the group names. The names (such as root, bin, and daemon) are
    user-group names that can belong to the user-group list.


    To change the group that the file belongs to, use the chgrp command. Its syntax
    is the same as that of the chown command. For example, to change the group that
    parttime belongs to, issue the following:


    ```

    maddog@shamet:~ >chgrp newgroup parttime

