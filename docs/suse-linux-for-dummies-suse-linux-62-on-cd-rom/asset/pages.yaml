- pgno: 81
  md: '# Part II: Installing SuSE Linux


    # Making boot and supplemental

    disks in Linux


    If you don''t have access to MS-DOS or Windows but do have access to another SuSE
    Linux system, this section is for you. To make the boot and supplemental disks
    in Linux, you must be logged in as a user with permissions to write to the 3½inch
    drive, which /dev/ refers to as /dev/fd0.


    To make the boot disk, put a blank, formatted floppy in the floppy drive. Place
    the SuSE Linux For Dummies CD-ROM into your CD-ROM drive and mount the Linux CD
    (connecting it to the rest of the file system) by typing the following:


    ![](img/96a9ce6a13d8d15ed05f867f41574278_81_0.png)


    ```

    mount /cdrom /mnt

    ```


    Change to the disks directory by typing


    ```

    cd /mnt/disks

    ```


    Finally, type the following command:


    ```

    dd if=eide0 of=/dev/fd0

    ```


    After the floppy disk light goes out, you may make the supplemental disk if needed.
    Even if you don''t need a supplemental disk, it''s a good thing to have, so place
    a blank disk in /dev/fd0 (the floppy drive) and then type this command:


    ```

    dd if=modules=/dev/fd0

    ```


    After you are finished making the floppies, you may dismount the CD-ROM (remove
    it from the rest of the file system) by typing these commands:


    ```

    cd /

    umount /cdrom

    ```


    Wait until the floppy drive light is out before removing the floppy disk.


    # Move Over and Make Room for Linux


    Before you install Linux on your system, you need to make room for it. Some people
    find space by getting rid of MS-DOS and Windows. Others don''t want to make such
    drastic changes and prefer to have both Linux and their other operating system
    peacefully coexist. If that fits the bill for you, the easiest way to go is to
    add a new hard disk — either IDE or SCSI — to your system and install SuSE Linux
    on.'
  merge: -1
  img_proc: true
- pgno: 82
  md: '# Chapter 4: Making Room for SuSE Linux


    If you don''t want to get rid of your current operating system and can''t add
    another disk to your system, your only remedy is to defragment your other operating
    system, make its disk space smaller, and then install SuSE Linux in the free space.


    MS-DOS systems usually have one big DOS partition. That''s the spot you need to
    make smaller so that you can install SuSE Linux in the leftover space. You can
    shrink the DOS partition by using destructive repartitioning, which wipes out
    all the data on the hard disk, or nondestructive repartitioning, which is not
    supposed to wipe out all the data on the hard drive. Sounds scary, but I walk
    you through both methods.


    > Note: If you decide to keep space on your hard drive for DOS, try to keep DOS
    in the first partition, doing so means managing DOS and Linux together.


    Before performing any major work on restructuring your disk, as you are about
    to do, backing up your disk is always wise in case something goes wrong. You not
    want to lose any data or programs that you worked hard to install. Please refer
    to your system''s owner''s manual to find out how to back up your system (and
    how to restore the data if necessary). We can''t stress this strongly enough.


    ![](img/96a9ce6a13d8d15ed05f867f41574278_82_0.png)


    # Nondestructive repartitioning


    If you can''t add another disk to your system and your only choices are destructive
    and nondestructive repartitioning, nondestructive repartitioning is definitely
    the better choice of the two. You still need to back up your system, in case you
    have to restore it afterwards.


    You use an MS-DOS utility called FIPS (which is a clone of fdisk) to nondestively
    realize your DOS partitions. FIPS is included on the SuSE Linux For Dummies CD-ROM
    and on most other Linux distributions. We suggest that you read the documentation
    in the fips subdirectory on the SuSE Linux For Dummies CD-ROM before you use the
    FIPS utility.


    ![](img/96a9ce6a13d8d15ed05f867f41574278_82_1.png)


    Although FIPS is supposed to be nondestructive, make sure that you always back
    up your system before using it.


    ![](img/96a9ce6a13d8d15ed05f867f41574278_82_2.png)


    Newer versions of Windows 95 have a 32-bit file allocation table (FAT) and drive
    management provides for single-disk configurations larger than 2GB. Older versions
    of Windows 95 had a 16-bit FAT; to use the space above 2GB, the drive had to be
    partitioned into logical drives of 2GB or less. Newer computers often have drives
    larger than the old 2GB limit. If the drive is repartition, the large drive management
    system is disabled and DOS and Windows partitions are once again limited to 2GB.'
  merge: -1
  img_proc: true
- pgno: 83
  md: '# Part II: Installing SuSE Linux


    The FIPS utility works by dividing the drive into two partitions. The first one
    is the DOS partition. The second, beginning at the end of the space used by DOS
    and Windows software and encompassing the rest of the drive space, is the non-DOS
    partition where Linux loads. If you want to use the FIPS utility to partition
    your drive, keep in mind that your DOS partition can hold only 2GB or less. If
    the amount of used space on your C partition is greater than 2GB, you will not
    be able to nondestructively repartition unless you delete some files or move them
    to another disk.


    # Defragmenting


    The next two steps in nondestructive partitioning are to defragment the disk (which
    moves all the data to the front of the disk segment, leaving space behind it for
    Linux) and then to use FIPS to carve the disk into segments. First things first,
    in this section, you defragment your C partition by running the defragmentation
    program.


    In Windows 3.1 and MS-DOS:


    +   1. Close all programs and windows on your system.


    +   2. If you are running Windows 3.1, exit from Windows into MS-DOS.


    To do so, go to the Program Manager window, choose File:Exit Windows, and allow
    Windows 3.1 to exit as gracefully as it can.


    +   3. Now that you are in MS-DOS, change to your C: disk and go to the c:\dos
    directory.


    To do so, type


    ```

    c:\> cd \dos

    ```


    +   Initiate the defragmentation program under MS-DOS:


    ```

    c:\dos> defrag

    ```


    The defragmentation program asks you which disk to defragment.


    +   4. Use the alphabetical keys on the keyboard to select the drive you want
    to defragment.


    The defragmentation program looks at the disk to determine whether it needs fragmentation.


    +   5. Defragment the disk — even if the program says the disk doesn''t need defragmentation.


    After what may seem like a long time, defragmentation finishes and all useful
    blocks of information are now at the beginning of the disk, making it ready for
    the FIPS program in the next section.'
  merge: -1
  img_proc: true
- pgno: 84
  md: '# Chapter 4: Making Room for SuSE Linux 57


    In Windows 95 or 98:


    +   1. Close all programs and windows on your system, leaving just the desktop-top
    and icon bar.


    +   2. Right-click the My Computer icon on the desktop and select Properties from
    the drop-down menu items.


    +   3. When the System Properties window appears, click the Performance tab in
    the upper-right corner.


    +   4. On the Performance tab, click the Virtual Memory Button in the bottom-right
    corner of the screen.


    +   5. In the virtual memory screen, click the radio button that says Let me specify
