    > is known as appending standard output. When you use this symbol, you

    tell the computer, "Capture the information that would normally go to

    the screen and append the information to an existing file. If the file

    does''t exist, create it."


    +   < is used to tell the computer, "Take the information from the specified

    file and feed it to standard (also known as standard input), acting as

    tough the information is coming from the keyboard."


    In the following example, you use the cat command to create a file by red-

    recting the output from the screen to the filename you want,

