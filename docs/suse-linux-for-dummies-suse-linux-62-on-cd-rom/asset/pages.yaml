  md: '# # Chapter 10


    # # Avoiding Shell Shock


    **In This Chapter**


    +   - Discovering bash

    - Experimenting with wildcards

    - Using bash history to find files

    - Banging around to find files

    - Writing a simple shell program

    - Writing a not-so-simple shell program

    - Just a bit on multitasking


    I imagine that you are in a foreign country and don''t know the language, so you
    hire an interpreter to accompany you on your visits to customers. You tell the
    interpreter what you want to do and where you want to go. The interpreter then
    decides what steps to take (hire a taxi or take the subway, for example), and
    in what order. When it''s time for you to talk to customers, the interpreter takes
    the statements you give in your language and changes them into the native language.


    Shells (also known as interpreters) do much the same thing. They take the English-like
    commands you type in, gather resources (such as file names and memory), and supply
    lower-level computer statements to do what you want.


    Many shells have evolved throughout the history of UNIX and Linux. Their history
    and derivation is discussed in the sidebar titled "The Bourne-again shell," which
    appears later in this chapter. For now, I''d like to simplify the issue of which
    shell is best and suggest a shell for your use.


    I recommend bash because it is widely available and has more features than you
    will ever need as a user. If you go on to become more of a programmer or if you
    like investigating shells, you might try the popular zsh or the even more popular
    Tcl/Tk or Python, which have a graphical interface.


    ![](img/96a9ce6a13d8d15ed05f867f41574278_192_0.png)'
