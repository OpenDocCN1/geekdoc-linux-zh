- pgno: 59
  md: '# In this part ...


    You''re about to embark on a journey through the SuSE Linux installation program.
    (If your SuSE system is already installed, you can skip this part and peruse another
    one.) Perhaps you know nothing about setting up your operating system on your
    computer. That''s okay. SuSE Linux is smart and reasonable. Plus, you have to
    guide you.


    In Chapter 3, you find out what SuSE Linux needs as well as what your system has
    in terms of hardware. Then, after backing up your system, you can move on to the
    next chapter, where you do more all-important preparation, such as creating a
    boot floppy disk. You also find out how to squeeze the data on your hard disk
    so that you can fit SuSE Linux there,


    Next, you get to do what you''ve been waiting for ever since you bought this book:
    install SuSE Linux. Like park rangers, we guide you along the various trails of
    the installation process, pointing out pitfalls and cautioning you about hazards.
    You get to enjoy the views, too, as you move screen-by-screen through your trek.


    Your travels through the installation may not be over yet, however. Installing
    X Window System can be tricky, which is why we provide an entire troubleshooting
    chapter on it. So, if you decide to include X Window System and have problems
    installing it, Chapter 6 is for you. If you installed X Window System without
    a hitch, break out the trail mix and enjoy a well-deserved rest.


    Finally, in Chapter 7, you reap the benefits of all your efforts and use SuSE
    Linux for the very first time. Happy trails.'
  merge: -1
  img_proc: true
- pgno: 60
  md: '# Chapter 3


    # Discovering What''s in Your System


    In This Chapter


    +   - Figuring out the resources Linux requires

    - Unearthing the type of hardware you have


    The sole function of this chapter and the three that follow is to help you install
    your system. If your SuSE Linux system is already installed, count yourself lucky
    and check out one of the chapters after Part II. If you haven''t installed your
    system, console yourself with the fact that you can find out a lot during this
    chapter and will be the better for it later. Your computer will not seem like
    such a stranger because you will find out what lies inside.


    We would like to dispel a myth that Linux is harder to install than Microsoft
    Windows. We believe that Linux is no harder to install than any other operating
    system. We''ve tried on several occasions to install Windows 95 from the beginning,
    and have met with frustration due to plug-and-pray or drivers that were always
    on the "other" disk (no matter which we had). Windows seems easy to install because
    it''s usually preinstalled; because most people only update it; and because people
    who do install it will have all the hardware-documentation.


    You can buy Linux preinstalled if you want. Most companies that sell hardware
    and specialize in Linux sales will install it for you. Then all you do is turn
    it on. If this is the way you obtain the Linux operating system, it''s as easy
    to "install" as Windows


    The next easiest way to install Linux is to buy it preinstalled on a disk. You
    put the disk in your system, boot the system, and Linux is installed.


    If you''re the rare reader who is buying a system just for Linux, look up a hardware
    supplier on the World Wide Web or in a Linux magazine and ask the to build a system
    for you.'
  merge: -1
  img_proc: true
- pgno: 61
  md: '# 34 Part II: Installing SuSE Linux


    If you''re like most readers, however,


    +   - Want to install Linux to your existing hardware

    - Want to use your existing disks

    - Want to keep MS-DOS, or Windows, or both on your system


    You''ve chosen the hardest type of installation. Don''t worry, though, because
    we''re here to guide you through it.


    # Hardware Supported by Linux


    Generally, Linux has been ported to run on many platforms, such as any Intel processor
    that is a 386 or newer, as well as on various Digital Alpha, Sun SPARC, Motorola,
    MIPS, PowerPC, and HP/PA platforms. SuSE Linux has been ported to the Intel and
    Alpha platforms and is considering additional platforms in the future. The SuSE
    Linux For Dummies CD-ROM works only on Intel PCs, and what is discussed in this
    book. If you want to install SuSE Linux onto an Alpha, don''t despair: The platforms
    aren''t that different and you can probably adapt the instructions. You''ll need
    to buy a different CD-ROM than the one in the back of the book, however, because
    it supports only the Intel line of processors.


    Linux supports symmetric multipcessing (SMP), which means that you can have more
    than one CPU per box. In fact, it supports several processors per system box.
    If your system has more than one CPU, Linux will be able to utilize those CPUs
    also, either by speeding up a specific program written to take advantage of multiple
    CPUs or by allowing more programs to execute at one time. If you have an SMP system,
    would you like to trade with me?


    The Intel processor should have the following amount of RAM (main memory):


    +   - Without graphics, Linux runs (er, walks) with 8MB.

    - With graphics, we strongly advise you to have at least 32MB of RAM.

    - With 64MB, Linux works quite well and the speed of the application (particularly
    a graphics-oriented program) increases dramatically.

    - 128MB can be found in the systems of some Linux developers because they tend
    to run many programs at a time, and each program takes up a certain amount of
    RAM when running.'
  merge: -1
  img_proc: true
- pgno: 62
  md: '# Chapter 3: Discovering What''s in Your System


    Linux can be installed in 80MB of disk space, but for the graphical part of Linux,
    you need a total of about 300MB. If you install the default system with all the
    goodies, you will have installed a total of more than 650MB of computer programs,
    data, games, and so on. When considering whether your system needs more disk space
    or more RAM, remember that as a general rule, it is usually better.


    Some early CD-ROM drives are not IDE; they attach directly to sound cards and
    other devices. Most Linux distributions tell you how to detect and use these.
    If you don''t have an IDE/ATAPI or SCSI CD-ROM drive, you need to know the make
    and model number of your CD-ROM drive and what type of controller (perhaps a specific
    sound card) the CD-ROM drive is attached to. To do this, you have to open your
    system and look for the make and model number of the CD-ROM on the physical device.


    You can install Linux, after making one or two disks, by copying files over the
    network. This is a viable way of installing Linux on the type of local area network
    used at colleges or businesses or you have a friend who has a Linux system, a
    CD-ROM drive, and a networking card of the same type as yours. If the network
    is not fast (that is, cannot pull lots of data quickly), however, the easiest
    way to install Linux is by using a CD-ROM drive attached to your system. Trust
    me.


    You can install Linux on a notebook by using the notebook''s built-in CD-ROM drive
    (if it has one), or a CD-ROM drive attached to the notebook''s docking station,
    or a SCSI CD-ROM drive attached to a PCMCIA controller. If you don''t have any
    of these, you could try to get a PCMCIA controller and do a network installation,
    given that another Linux system on the network has a CD-ROM drive.


    You also need a keyboard, a mouse, and a video card. Linux supports a wide range
    of video cards. Even if your card is not supported directly, Linux might support
    it as a standard VGA, XGA, SVGA (or other graphical hardware standard) video card.
    Most video cards that have been available for a while are supported.


    # Notebooks before PCMCIA support


    Early notebooks had no built-in CD-ROMs, and until Linux had PCMCIA support, I
    had to install Linux using floppies. I still remember the day I got my new notebook
    and the new release of Linux that had PCMCIA support. I ran out and bought a PCMCIA
    SCSI controller that night so


    that I could use my SCSI CD-ROM to do the installation.


    My life has been ever since. Having used floppies to install Linux on various
    notebooks not once or twice, seven times, I would have paid ten times the amount
    for what PCMCIA card.'
  merge: -1
  img_proc: true
- pgno: 63
  md: '# Part II: Installing SuSE Linux


    ![](img/96a9ce6a13d8d15ed05f867f41574278_63_0.png)


    Linux supports a variety of sound cards, serial line cards (for attaching a lot
    of serial printers or modems to a system), and other peripherals. The hard-ware
    components supported by the code on your SuSE Linux For Dummies are listed in
    Appendix A.


    # Finding Out What You Have


    One of the most important preliminary steps for a successful installation of Linux
    is finding out the type of hardware you have. You can find most of this information
    in the manuals that came with your computer. The manuals won''t be much help,
    however, if


    +   * You threw the manuals.

    * You lost the manuals.

    * You bought your computer secondhand from someone who threw away or lost the
    documentation.

    * You bought your PC with Windows already installed.


    The last reason is the most insidious because it means the people you bought the
    PC from did not bother buy the documentation for each part of the PC when they
    assembled it for you. That would have cost them more money. Instead, they used
    OEM parts (read that "sans documentation and colorful box\ and bought only one
    copy of the documentation for their use. With Windows already installed, they
    reasoned, why would an end user need any documentation about the system?


    Contact the place where you bought your system. Perhaps you can obtain a copy
    of the documentation from the dealer.


    If that doesn''t, open up your system and look at the components. For instance,
    a source of information about your disk is the label on top of the disk drive.
    If you don''t feel comfortable opening your system, you might want to take it
    back to where you bought it — assuming that perhaps the dealer can open it up
    and tell you what you have.


    You can also look to the World Wide Web for information. Many vendors use their
    Web site to provide technical data about their devices. For that, you need to
    know your equipment''s manufacturer, make, and model number.


    Another source of information is MS-DOS, Windows 3.1, and Windows 95. Step-by-step
    instructions in the following sections show you exactly how to use these operating
    systems to get all the information you need.'
  merge: -1
  img_proc: true
- pgno: 64
  md: '# Chapter 3: Discovering What''s in Your System


    If you don''t have any literature about your system, and you don''t have Windows
    3.1 or Windows 95 on your system (perhaps you like to run FAT free), and no dealer
    is within hundreds of miles, don''t give up hope. Linux is good at sniffing out
    and identifying hardware during the installation.


    # The Information You Need to Know


    Here are the questions you need to answer your hardware:


    +   - Disk controllers. How many do you have and what are their types (IDE, SCSI
    )? Which hard drives are connected to which controllers? If a SCSI controller
    is installed in your machine, what is its make and model number?


    +   - Hard drives. How many hard drives do you have? For each drive, what is its
    size and order (which one is first, second, and so on)?


    +   - CD-ROM. What is the interface type? Is it an IDE drive, a SCSI drive, or
    other type? For CD-ROMs other than IDE (APATI) or SCSI, what is the make and model
    number?


    +   - RAM. How much RAM is installed on the computer?


    +   - Mouse. What type of mouse do you have — a bus mouse, PS/2 mouse, or a serial
    mouse? How many buttons does it have? If you have a serial mouse, which COM port
    is it attached to and what protocol does it use (such as Microsoft or Logitech)?


    +   - Monitor. What are the make and model of the monitor? What are its vertical
    and horizontal refresh rates? You need this information only if you will be using
    the graphical portion of Linux, called X System.


    +   - Video card. What are the make and model number of the video card or video
    chip set and the amount of video RAM?


    +   - Network interface card (NIC). If you have a network connection, what are
    the make and model number of the network interface card?


    +   - Network information. If you have a network connection, what are your IP
    address,get, gateway IP address, name server addresses, and host domain names?
    If you need help, contact your network administrator or Internet service provider
    (ISP).


    To install most Linux distributions, you need to answer the questions in the preceding
    list. Now that you know what you should be looking for, the next section deals
    a bit more into how to locate and capture that information.'
  merge: -1
  img_proc: true
- pgno: 65
  md: '# 38 Part II: Installing SuSE Linux


    # Disk controllers


    The two main types of disks are IDE and SCSI, and each type has its own controller.
    IDE is more common in PCs, and newer PCs usually have two IDE controllers rather
    than one. For each IDE controller, your system can have only two hard disks: a
    master and a slave. Therefore, a PC with two IDE controllers can have up to four
    hard disks. You should know which hard drive is which. Also, if you have a Windows
    system that you want to preserve, you should know which hard drive it resides
    on. Normally, on a Windows system:


    +   - The first controller''s master disk is called C.

    - The next disk is called D and is the slave disk on the first controller.

    - The next disk is E and the master disk on the second controller.

    - The last disk is F and the slave disk on the second controller.


    Normally, Windows is located on your C disk and data is on your other disks. This
    lettering scheme is just one possibility; your disks could be set up differently
    and even include CD-ROMs as drives on your IDE controllers.


    Some high-end PCs have a SCSI controller on the motherboard or on a separate SCSI
    controller, either in addition to or instead of the IDE controllers. Older SCSI
    controllers can have up to 8 devices on them, numbered 0–7, including the controller.
    Newer SCSI controllers (known as wide controllers) can have up to 16 devices,
    including the controller.


    If all you have a SCSI disk, usually disk 0 or disk 1 is your C disk, and others
    follow in order.


    If you have a mixture of IDE and SCSI controllers, your C disk could be on any
    of them. The sections later in this chapter, "Getting Information from Windows
    95" and "Getting Information from MS-DOS or Windows 3.1," show you how to identify
    how many disks you have, what type they are, and the controllers to which they
    are attached.


    # Disk drives


    You will need to decide whether you will be putting Linux on a separate disk from
    MS-DOS and Windows or whether you want the two operating systems to share one
    disk.


    Most people think of Windows (either Windows 3.1, Windows 95, and Windows 98)
    as an operating system. All these, however, have an underlying system called MS-DOS
    that manages the disk and many hardware components of your PC. From here on, unless
    we mention a particular system, consider MS-DOS and Windows as the same thing.


    ![](img/96a9ce6a13d8d15ed05f867f41574278_65_0.png)'
  merge: -1
  img_proc: true
- pgno: 66
  md: '# Chapter 3: Discovering What''s in Your System


    # Old systems and new disks


    Disks are made up of cylinders of information, which in turn are made up of tracks
    of information, which in turn are made up of blocks of information. Newer disks
    have more than older computer systems can handle easily. Therefore, a method logical
    addressing, or LBA, was created so that older computer systems could work with
    newer disks, which have more than 1,023 cylinders.


    however, that changing your disk to LBA specification if it is not LBA already
    will make the data on the disk inaccessible. Therefore, before changing your disk
    to LBA, you should back it up if it contains any data. (You may decide that adding
    another disk is not such a bad idea as an expansion strategy.)


    Different hardware systems have different ways to enter the BIOS setup. Usually,
    you can enter the BIOS when you turn on the power and start to boot; when you
    press the Reset button on the front of the system and start to reboot; when you
    go through the normal shutdown of your Windows system and ask to reboot.


    The BIOS section for configuring hard disks typically indicates your computer
    system is capable of LBA. Your disk may already be accessed as an LBA disk. Some
    BIOS do this automatically the first time you use a disk with a large number of
    cylinders. Note,


    ![](img/96a9ce6a13d8d15ed05f867f41574278_66_0.png)


    We strongly recommend that you put Linux on a separate disk. The task of shrinking
    MS-DOS and Windows small enough to allow Linux to reside in its full glory on
    an existing disk is difficult at best and impossible at worst.


    If you follow our recommendation and buy another disk, put it the second disk
    on the first IDE controller or disk 1 on your SCSI controller, assuming that your
    existing Windows disk is either the first on your IDE controller or ID 0 on your
    SCSI controller. Adding disks is a hardware thing; the store where you buy the
    disk should be able to add it to your system for you. And while the system is
    there, you can ask the folks to tell you the details of the other hardware in
    your system.


    While installing Linux on your disks, you might be asked to supply the number
    of disk heads (or tracks), the number of cylinders, and the number of sectors
    per track. Most modern disk drives provide this information on a paper label on
    the outside of the disk. Some modern disks are set up for Windows, and Linux can
    access the number of disk heads, cylinders, and sectors.


    If you have your computer apart looking for other information (a pox on manufacturers
    who don''t supply such useful information), you may as well down all the disk
    information you can find. You should look for the number of heads, cylinders,
    and sectors. This information is used to tell the operating system where to put
    data with respect to the beginning of the disk. If you have trouble, check out
    the "Getting Information from Windows 95" and "Getting Information from MS-DOS
    or Windows 3.1" sections. SCSI disk users'
  merge: -1
  img_proc: true
- pgno: 67
  md: '# Part II: Installing SuSE Linux


    don''t have to supply this information because the SCSI controller and device
    drivers calculate it on the fly. SCSI disk owners should, however, know the size
    of their disks, which is printed on the disk or is available through the sections
    just mentioned.


    # Getting Information from Windows 95


    If you have Windows 95, you can use the msd program in MS-DOS mode as described
    in the next section to find out about the hardware in your system. Much more information
    is available, however, through the Control Panel in Windows 95.


    With pencil and paper handy, it''s time to get to the Control Panel and all that
    information. Follow along with these steps:


    +   1. Click Start:Settings:Control Panel.

    We use a shorthand method for showing menus. When you see a line such as the following:

    Start:Settings:Control Panel

    it means "Click the Start button, and then click the Settings menu item, and then
    click the Control Panel item."

    2. Double-click the System icon and then click the Device Manager tab.

    3. At the top of the screen, click to select the Devices by Connection option.

    This shows all components and how they relate to each other. The screen looks
    similar to Figure 3-1.

    If you have a printer attached to your system, at this point you can click Print
    in the System Properties dialog box. Then, under Type Report, click All Devices
    and System Summary. Click OK. This procedure prints a full report about your system.
    You will not have all the information you may need, such as which disk goes with
    which controller, but you will save a lot of writing.

    4. In the list, click Computer.

    5. Click the Properties button.

    The View Resources tab of the Computer Properties dialog box appears.

    6. Click to select the Interrupt Request (IRQ) option and write down the displayed
    information.

    The left column, Setting lists interrupt requests, as shown in Figure 3-2. The
    hardware using a particular IRQ is listed in the right column. Note that no two
    different devices can use the same IRQ.


    ![](img/96a9ce6a13d8d15ed05f867f41574278_67_0.png)


    ![](img/96a9ce6a13d8d15ed05f867f41574278_67_1.png)'
  merge: -1
  img_proc: true
- pgno: 68
  md: '# Chapter 3: Discovering What''s in your System


    ![](img/96a9ce6a13d8d15ed05f867f41574278_68_0.png)


    Figure 3-1: Use the Device Manager tab to discover hardware details.


    +   7. At the top of the screen, click to select the Direct Memory Access (DMA)
    option and copy the displayed information.

    8. At the top of the screen, click the Input/Output (I/O) option and copy the
