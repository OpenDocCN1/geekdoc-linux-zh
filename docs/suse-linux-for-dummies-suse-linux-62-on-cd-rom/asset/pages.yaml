    # Video


    In-character mode, Linux works with all video cards. Then you''ll be able to get
    your system up and running, at a minimum. Likewise, most cards in VGA or SVGA
    mode, you''ll be able to have X Window System running, although it will be a little
    slow and coarse-grained.


    As a general rule, both the earliest and latest models of video cards are not
    supported. Early video cards were obsolete before Linux was introduced, and XFree86
    (the people who provide most of the support for the video cards) never had time
    to retrofit support. The very latest cards are not supported right away because
    it takes time and effort to get the code ported to the video card. With help from
    vendors, lead times are becoming shorter.


