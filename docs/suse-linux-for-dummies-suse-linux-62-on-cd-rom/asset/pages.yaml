- pgno: 177
  md: '# 150 Part III: Using SuSE Linux


    Now if you do the same ls command (without the a option), you see the following:


    ```

    maddog@localhost:~/emptydirectory/gregger> ls

    file1

    maddog@localhost:~/emptydirectory/gregger>

    ```


    And if you redo the ls command with the -a option, you get this:


    ```

    maddog@localhost:~/emptydirectory/gregger> ls -a

    ..dotfile file1

    maddog@localhost:~/emptydirectory/gregger>

    ```


    The ls command by default doesn''t list files that begin with a period. By adding
    the -a option, you modified the action taken by ls to print file-name, whether
    or not it begins with a dot.


    The ls command has many options and you can use more than one at a time. Want
    to see how? Modify the -a option by adding -l to it. The command line becomes


    ```

    maddog@localhost:~/emptydirectory/gregger>ls -al

    total 5

    drwxr-xr-x 3 (username)(group)(filesize) Jan 10 14:33 ../

    drwxr-xr-x 6 root (filesize) Jan 04 22:15 ../

    -rw-r--r-- 1(username)(group)(filesize) Jun 18 11:30 .dotfile

    -rw-r--r-- 1(username)(group)(filesize) Apr 13 17:40 file1

    ```


    As you can see, rather than just the filenames, the l option shows a more detailed
    listing of files. If long lists won''t fit on a single line, Linux just wraps
    them to the next.


    Most of the time, Linux doesn''t care what order you type the options therefore
    considers ls -a and ls -la to be the same. Multiple option choices aren''t available
    with all commands, however, and work only with commands that have single letters
    to specify their options.


    The ls command lists files in alphabetical order as the default, but you can tailor
    the output. For example, ls -alt displays the files in order by date and time,
    with the most recent first; ls -ltr reverses that order.


    ![](img/96a9ce6a13d8d15ed05f867f41574278_177_0.png)


    # Oh Danny Boy, the Pipes...


    Linux commands generate a lot of output, and if it all went to standard output
    to the screen, without some type of control, it would scroll past. For example,
    type the following:'
