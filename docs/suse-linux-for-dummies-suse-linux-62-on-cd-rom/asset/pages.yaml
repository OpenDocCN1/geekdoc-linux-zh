    it''s a link because it''s underlined.) If you click that link, you are taken
    to a page like the one in Figure 16-8.


    Note that the near of the box is containing the following URL:


    ```

    http://www.li.org/whatlinux/index.shtml

    ```


    Use your cursor or keyboard to delete the URL and replace it with another one.
    Press the Enter key and send the browser off to another Web page. Here are a few
