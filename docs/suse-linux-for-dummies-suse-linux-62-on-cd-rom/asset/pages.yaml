- pgno: 254
  md: '# Chapter 13: File System Management 227


    After you create a partition, you must create a file system. The file system occupies
    a single space on the disk that has a unique block file (device) name. This unique
    name accesses the file system regardless of whether the data is stored on all
    or part of a physical disk, or is an aggregation of multiple physical disks.


    Linux developers are constantly supporting new file systems. The file system types
    are the major ones:


    +   - ext, ext2, hpfs

    - NFS: nfs

    - Samba: SMB

    - CD-ROM: iso9660

    - DOS: mdsdos, umsdos, vfat

    - Other: sysv, minix


    If you want to add one of these types of file system, you have to make a new partition,
    which may mean adding a new disk drive. That''s the subject of the next section.


    # Adding a Disk Drive


    The first step to increasing your disk space is to add a new disk drive. The following
    tasks are required to add a disk to your system (regardless of whether the disk
    is SCSI or IDE) and make it accessible to users:


    +   - Attach the disk drive to your computer system.

    - Provide a suitable device driver for the disk''s controller in Linux. This may
    mean rebuilding the kernel of the Linux operating system, which is detailed in
    Chapter 14.

    - Define at least one partition.

    - Create the special files for the partition(s).

    - Create a Linux file system(s) on any partition(s) to be used for user files.

    - Enter the new file systems into /etc/fstab, the configuration file.

    - Mount the file systems. (You may have to make a directory for your point.)


    The following sections step you through the process of configuring a hard disk
    drive, a CD-ROM, and a floppy drive after they are physically installed.'
  merge: -1
  img_proc: true
- pgno: 255
  md: '# 228 Part IV: Maintaining Your System


    # Configuring a drive


    The business of adding a hard disk to your microcomputer is broken down into two
    steps:


    +   - Physically adding the hard disk

    - Logically making Linux aware of it


    The first step is beyond the scope of this book because your drive may be either
    IDE or SCSI, and the setup of the physical disk is dependent on the rest of the
    hardware in the system. We suggest that you consult the hardware manual that may
    come with your system or have a reseller install your new disk. The Linux system
    is complicated by the fact that several operating systems— as DOS, Linux, and
    UNIX— may share the same disk.


    ![](img/96a9ce6a13d8d15ed05f867f41574278_255_0.png)


    To complete all the steps necessary to install and configure your new disk, you
    must know the total formatted drive capacity and the number of heads and cylinders,
    among other details. You can usually find this information in the documentation
    or from the manufacturer.


    You may want to keep a record of the data from the partition table as it is-played
    by `fdisk`, such as


    +   - Partition numbers

    - Type

    - Size

    - Starting and ending blocks


    # Installing a drive


    When the drive is attached to the system, it should be recognized when you boot.
    To review the booting messages in a slower fashion than they areplayedwhen you
    boot, use the `dmesg` command. If you added a new IDE drive, look for the mention
    of a new hdx drive, where the x is replaced with the letter `b`, `c`, or `e`.
    This tells you that your kernel “saw” the new disk as it booted, and rebuilding
    the kernel is not necessary to add this drive. Likewise, if you are adding a new
    SCSI disk drive, you see a boot message indicating a new disk that has the designation
    sdx, where the x is a letter. In either the IDE or SCSI case, you may see other
    messages with additional information.


    The messages for an IDE drive may look like this:


    ```

    hdb: HITACHI_DK227A-50, 4789MB/512KB, CHS=610/255/63

    ```'
  merge: -1
  img_proc: true
- pgno: 256
  md: '# Chapter 13: File System Management


    And sometime later, you see a message that looks like the following, which describes
    the existing partitions on the new disk (if any):


    ```

    hdb: hdb1 hdb2 < hdb5 hdb6 hdb7 hdb8 >

    ```


    A SCSI disk drive has messages that look like this:


    ```

    SCSI device sdb: hdwr device=......

    sdb: sdb1

    ```


    If you see these messages, the kernel has seen your new disk, and you don''t have
    to rebuild the kernel to use the new disk.


    ![](img/96a9ce6a13d8d15ed05f867f41574278_256_0.png)


    The Linux distribution on the SuSE Linux for Dummies CD-ROM features block special
    files for each of IDE disks (hda – hdb) with nine partitions (1 – 9). Linux also
    has block special files for seven SCSI hard disk drives (sda – sdg), which can
    have eight partitions each (1 – 8). In addition, Linux has a special file for
    a SCSI CD-ROM (scd) with eight partitions (0 – 7). If you have lots of disks,
    or if your distribution of Linux doesn''t enough partitions for your disk, you
    may have to create one or more special files for the device, like this:


    ```

    cd /dev; makedev sd

    ```


    This creates the block special files for SCSI disk 7. Note that in both IDE and
    SCSI disks, the letters and numbers correspond: a is for the first disk, b is
    for the second disk, and so on.


    If you add a SCSI disk with a lower ID number than you already have, the new disk
    drive takes on nothing. Suppose that you have SCSI disk drives with hardware ID
    numbers of 0, 2, and 3. Linux gives these disks the names sda, sdb, and sdc, respectively.
    You make your partitions and, create your entries in /etc/fstab to show where
    the file systems are mounted. Now you get a new disk drive and set the hardware
    ID to 1. When you reboot, the new disk gets the sdb designation, and the disks
    with ID numbers of 2 and 3 are renamed to sdc and sdd, respectively. For this
    reason, for the very least, it''s a good idea to add SCSI disk drives to your
    system starting with ID 0 and working up the number chain, with no gaps in the
    numbering.


    ![](img/96a9ce6a13d8d15ed05f867f41574278_256_1.png)


    # Partitioning a drive


    Now you''ve created block special files, you can use YaST to partition the drive.


    To see how to use YaST to partition a drive, please refer to Chapter 5.'
  merge: -1
  img_proc: true
- pgno: 257
  md: '# Making the file system


    Every partition is simply an empty space with a beginning and an end. Unless the
    partition is being used for swap space, you have to put some type of file system
    on the partition before it becomes useful. (for make file system) command is used
    to create the file system on the partition. Normally, the file system is a native
    Linux file system, which at this time is called ext2. The Linux version has been
    nicely streamlined and requires hardly any input. To create a file system on the
    disk partition sda1, for example, you enter the following command:


    ```

    mkfs -t ext2 /dev/sda1

    ```


    If you want to create an MS-DOS file system on the disk partition, you use this
    command:


    ```

    mkfs -t mdsos /dev/sda2

    ```


    You can continue to execute mkfs commands to create file systems for every partition
    on your new disk. Or you can leave some partitions without file systems (for future
    use), as long as you remember to perform the mkfs command on them before attaching
    them to your file system by using either the mount command or the /etc/fstab table.


    Congratulations! Your disk has been physically added to your system and partitioned,
    and you''ve added file systems to it. Now the disk is ready to join the rest of
    the file system — simply use the mount command or the /etc/fstab file, which we
    describe earlier in this chapter.


    # Living with Floppy Disks


    Floppy disks are treated a little differently than hard disks, mostly due to their
    size and fragility. They are not normally mounted and used for hours and days
    on to hold gigabytes of data. More often, floppy disks are used to transfer data
    to another computer or back to a few files.


    Although you can create Linux file systems on floppy disks, using them in other
    ways is more advantageous. For example:


    +   - Floppy disks can be mounted as DOS file systems, which can then be accessed
    with the standard Linux utilities such as cp and ls.

    - Floppy disks can be used as raw devices with commands such as tar and cp.

    - Floppy disks can permit the use of special utilities that read and write to
    disks.'
  merge: -1
  img_proc: true
- pgno: 258
  md: '# Chapter 13: File System Management


    On Linux systems, the block special file for the first floppy drive is /dev/fd0.
    The default density is 1,440 kilobytes. We assume that you are using standard,
    3-½-inch preformatted floppy disks.


    The following commands mount a floppy disk and write a DOS file to it; (replace
    any-dosfile.txt with a real filename):


    ```

    mount /dev/fd0 /floppy

    cp any-dosfile.txt /floppy

    umount /floppy

    ```


    ![](img/96a9ce6a13d8d15ed05f867f41574278_258_0.png)


    This is one way to move files back and forth to an MS-DOS (Windows 3.1, 98, or
    NT) machine. You can add the file to a floppy disk, insert the floppy in the MS-DOS
    machine, and the MS-DOS machine can read the file from the disk. By mounting a
    floppy disk created on an MS-DOS machine, you can readwise and manipulate the
    files using Linux.


    The mtools package installed on your system enables you to access DOS disks and
    files without first mounting the floppy disk and adding it to your file system.
    Table 13-1 presents some mtools commands, which are probably familiar to DOS users.


    | Table 13-1 mtools Utilities |

    | Command | What It Does |

    | mformat | Formats a floppy disk in DOS format |

    | mlabel | Labels a DOS floppy disk |

    | mcd | Changes the current directory location on a DOS floppy disk |

    | mdir | Lists the directory contents on a DOS floppy disk |

    | mtype | Displays a DOS file''s contents |

    | mcopy | Copies files between a DOS floppy disk and Linux |

    | mdel | Deletes files on a DOS floppy disk |

    | mren | Renames files on a DOS floppy disk |

    | mmd | Creates a subdirectory on a DOS floppy disk |

    | mrd | Removes a directory from a DOS floppy disk |

    | mattrib | Changes DOS file attributes |'
  merge: -1
  img_proc: true
- pgno: 259
  md: '# Configuring a CD-ROM Drive


    You treat CD-ROM drives similar to — not exactly like — disk drives. The special
    file for CD-ROMs in Linux is usually /dev/cdrom, /dev/hdc, /dev/hdd, or /dev/sr0,
    depending on factors such as the CD-ROM''s type, how it is connected to the controller,
    and its device number.


    ![](img/96a9ce6a13d8d15ed05f867f41574278_259_0.png)


    The most common type of CD-ROM is ATAPI, and Linux recognizes SCSI CD-ROMs are
    normally recognized as the kernel boots. If you installed the system from the
    SuSE Linux For Dummies CD-ROM, the CD-ROM will have been recognized by Linux and
    is probably called /dev/cdrom.


    We mention that CD-ROMs are "not exactly like" other drives because CD-ROMs are
    read-only (which means you can''t change their contents) and typically have only
    one file system to a disk. Therefore, you don''t partition a CD-ROM, nor do you
    make a file system before mounting it. The manufacturer did these things. You
    simply have to mount where you want the CD-ROM and which it is attached to. We
    assume your CD-ROM drive is /dev/cdrom, which is really just a pointer to another
    special device file. This extra pointer (called a link) enables you to call the
    CD-ROM by the name /dev/cdrom, instead of having to call it /dev/sda or /dev/hdc
    on some systems (because it happens to be an IDE-based device).


    Following is the command to mount a CD-ROM on your Linux system:


    ```

    mount -r -t iso9660 /dev/cdrom /cdrom

    ```


    Now you know about every type of disk storage that you''ll see on a Linux system.
    You know how to identify the types of disk storage and partition them. You also
    know how to create file systems for them and how to mount and dismount file systems
    while the system is running. The Linux system dismounts file systems automatically
    when you shut the machine down — if you have put all of the necessary information
    into the /etc/fstab file — automatically mounts when you start the system up.
    So, as far as disk systems go, you should be all set.'
  merge: -1
  img_proc: true
- pgno: 260
  md: '# Chapter 14


    # Customizing Linux


    In This Chapter


    +   - Finding out about different types of memory

    - Unearthing how much RAM your system has

    - Checking out the performance of your disks

    - Rebuilding your kernel


    > our Linux system is a mélange de hardware and software, and you have choices
    to make about both. So how do you tune your system for good performance? Follow
    this chapter, that''s how.


    Tuning operating systems can become a life-consuming task. If you''re obsessed
    about squeezing more from your hardware and software, you won''t have time for
    anything else. Take advantage of the tips in this chapter, take a deep breath,
    and get on with the rest of your life.


    # Tuning Your Linux System


    UNIX-like systems don''t have many knobs and buttons you can change to make them
    faster or better. Linux, however, has a few special features that you can tweak
    for better performance. More importantly, if you follow a few guidelines, you
    will help your Linux system perform at its best.


    # You can never have enough memory


    Although too much memory is theoretically possible, suppose, most people have
    too little — in their systems, that is. Today, memory is so inexpensive that few
    excuses justifying not having enough.


    Not having enough RAM is a holdover from memory prices such as $23,000 per megabyte.
    I paid $400 for 4 kilobytes (.004MB) of main memory about the same time I purchased
    a pickup truck for $2,000.


    ![](img/96a9ce6a13d8d15ed05f867f41574278_260_0.png)'
  merge: -1
  img_proc: true
- pgno: 261
  md: '# Real versus virtual memory


    When we talk about *real memory*, we are referring to the semiconductor RAM (random-access
    memory) in your machine. You may have as little as 4MB or as much as 32MB of RAM
    in your machine. Some power users have 1GB (1 billion bytes) of RAM in their PCs.


    If semiconductor RAM is the only type of memory you have, Linux and all programs
    running under Linux have to fit in that RAM. Although 32MB sounds like a lot,
    it fills up quickly.


    Virtual memory uses hard disk drive (which is cheaper than RAM) to make Linux
    think you have more RAM. Virtual memory offers two big benefits:


    +   - Programs and files can run at the same time.


    +   - Programs and files can exceed the size of actual RAM.


    The drive space that simulates real memory is called *swap space*. (When you installed
    Linux, you probably were asked to set up a swap space.) Here''s how the swap space
    is used:


    +   - When Linux needs more RAM to start a new application or open an application
    to expand, some disk space may be substituted for the necessary RAM. An existing
    RAM is copied onto the swap space. This frees RAM for the new data.


    +   - When Linux needs the information from the swap space, it must make room
    in RAM. Therefore, Linux may write some other program''s data to the swap space
    before recalling data. This is called *demand-paging*, because the data is in
    RAM only when a *demand* exists for it to be there. Otherwise, data tends to stay
    on the swap area of the disk.


    +   - When the computer doesn''t have enough RAM to do its normal tasks efficiently,
    the computer is memory bound; the CPU must wait while portions of virtual memory
    are brought back into RAM. If this happens the computer is *thrashing* and becomes
    very slow.


    # Do I have enough RAM?


    The `procinfo` and `vmstat` commands can help determine whether you have enough
    RAM. Using these commands by themselves or with each other can tell you whether
    you are over-utilizing your RAM memory. If so, your CPU is waiting for RAM to
    be available.


    Measuring performance with `vmstat`


    The `vmstat` command displays information about memory utilization, the status
    of the process, the status of the I/O system, and CPU utilization. It also'
  merge: -1
  img_proc: true
- pgno: 262
  md: '# Chapter 14: Customizing Linux 235


    tells whether the swap partition is being used, and if so, how much of it is being
    used.


    Following is some sample output of the vmstat command:


    ```

    $[maddog@puddle]$ vmstat

    procs memory swap io system cpu

    r b w swpd free buff cache si so bi bo in cs us sy id

    1 0 0 2100 2372 13248 0 0 4 1 123 52 3 2 95

    ```


    Here are the details:


    +   - The (run) number indicates the number of processes that are capable of running
    but are waiting for the CPU to pay attention to them. The more processes you have
    in this segment, the slower the system.


    +   - The (b) blocked number indicates processes waiting for something to happen
    (usually some type of I/O). The processes can''t be run, even if you have some
    CPU.


    Too many processes in the block number may mean that you have an I/O bottleneck.
    We discuss how to alleviate I/O bottlenecks later in the chapter.


    +   - The w is the number of processes that are swapped out. Processes are swapped
    out if too little memory exists to run them efficiently, or if they have been
    idle for more than 20 seconds.


    A large w value may indicate a lack of memory. Processes that are inactive for
    a long time (waiting for I/O, for example) may be swapped out to conserve real
    memory space and other system resources.


    +   - swpd is the amount of virtual memory used, in kilobytes.


    +   - free is the amount of idle memory in I/O buffers, in kilobytes.


    +   - cache is the I/O cache, in kilobytes.


    +   - si (swapped in) and so (swapped out) monitor the program pages swapped in
    and out. In a heavily loaded, memory-bound system, you have high numbers here.


    +   - bi (blocks) and bo (blocks) indicate I/O activity per second (including
    the clock).


    +   - The in value reports interrupts ranges from the low hundreds to a single-user
    system (most of these are due to the system clock) to the low hundreds on a busy
    system server.


    The number of interrupts per second is useful if you have a device that has gone
    crazy. An improperly wired serial line, for example, can eat CPU time with thousands
    of interrupts per second. Although hundreds of interrupts per second is uncommon
    on most systems today,'
  merge: -1
  img_proc: true
- pgno: 263
  md: '# 236 Part IV: Maintaining Your System


    sudden unexplained jumps in the number of interrupts (for example, thousands of
    interrupts per second on an otherwise unused machine) may be worth investigating.


    +   cs reports the number of context switches per second.


    +   us, sy, and id (user, system, and idle) CPU numbers are the percentages of
    time the CPU is running your program, doing some type of system service (perhaps
    requested by your program), or standing idle, respectively. Note that a system
    with lots of idle time is not necessarily the best tuned; the CPU may be idle
    because programs waiting on I/O.


    vmstat can output a one-line summary automatically while Linux runs. Enter a command
    in the following form (just substitute the time interval, in seconds, for x):


    ```

    vmstat x

    ```


    The number of programs you see are the programs inside the system, minus the activity
    of vmstat (although running vmstat does have some slight effect).


    # Measuring performance with procinfo


    procinfo is another program used to measure system performance. In many ways,
    it''s nicer to use vmstat because it lists more information in one place and is
    formatted better (for human eyes). vmstat still has its uses, though, because
    its lack of formatting makes it easier to use inside shell scripts.


    procinfo -a, shown in Figure 14-1, lists all information; procinfo lists a shortened
    version of that information. Note that the memory statistics at the top of Figure
    14-1 are similar to those you get with vmstat.


    Following is an explanation of all information in Figure 14-1:


    +   The Bootup section is simply when the system was last booted. You might use
    this information as a security check because it may indicate that someone has
    rebooted your system without your knowledge.


    +   Load average is the average number of programs running, followed by the average
    number of runnable processes and the total number of processes.


    +   In the next group, values report the total amount of time that the system
    has spent in user, system, and idle modes (with percentages of time), along with
    a parameter showing how much time was spent with a niced (or lower priority) user-level
    program.


    Running a command (especially in the background) at a lower priority is a nice
    thing to do, and makes the system more reactive to interactive jobs.


