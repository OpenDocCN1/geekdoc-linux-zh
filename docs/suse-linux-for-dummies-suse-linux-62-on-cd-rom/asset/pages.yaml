- pgno: 2
  md: '# # SuSE Linux For Dummies® Cheat Sheet


    # ## vi (1) Commands


    +   - vi filename: Invoke vi text editor on the filename


    +   - i: Enter insert mode, inserting before the current position


    +   - I: Enter insert mode, inserting at the beginning of the current line


    +   - a: Enter insert mode, inserting after the current position


    +   - A: Enter insert mode, inserting at the end of the current line


    +   - <Esc>: Return from insert mode to command mode


    +   - x: Delete a character in command mode


    +   - cw: Delete the word behind the current position, and put the editor in input
    mode


    +   - :w: Write the file


    +   - :q: Quit with no additional writes to the disk


    +   - :wq: Write back the file, and quit


    +   - :q!: Quit the file with impending unwritten changes


    +   - /string: Search forward through the file for string


    +   - ?string: Search backward through the file for string


    +   - n: Find the next string (either forward or backward)


    +   - u: Undo the last command


    # ## A Few System Administration Commands


    +   - mount: Mount a file system, connecting a disk or a floppy disk to the tree


    +   - umount: Unmount a file system, making it ready to be removed from the system


    +   - fsck: File system check of the structure and integrity of the specified
    file


    +   - mkfs: Put a directory structure on the low-level formatted disk


    +   - shutdown: Shut the system down, waiting for a message to be sent: Ctrl+Del
    does the same thing


    +   - vmstat: Look at the virtual memory performance


    +   - procinfo: Gather information about processes


    # ## File Permissions


    +   - rwxrwxrwx: Read, write, and execute permissions for user, group, and other
    (the world) — 777


    +   - drwxr-xr--: A directory that is open to its owner and can be read and searched
    by the group and read (but not search-) by the world — 754


    +   - crw-r--r-: A character file that the owner can read or write but that the
    group and the world can only read — 644


    +   - rw-------: A block file; only the owner can read or write to it — 600


    For Dummies®: Bestselling Book Series for Beginners'
