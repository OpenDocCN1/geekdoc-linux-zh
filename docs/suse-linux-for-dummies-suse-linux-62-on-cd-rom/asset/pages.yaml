- pgno: 288
  md: '# # Chapter 16


    # # Surfing the Web


    **In This Chapter**


    +   - Tailoring Netscape to suit it

    - Checking out Web pages

    - Getting and reading e-mail

    - Sending your first e-mail message


    Once upon a time there was a company called Netscape that created a browser called
    Mozilla. Despite the fact that the company spelled the name "Netscape," you were
    supposed to pronounce it "Mozilla." In any case, the browser was one of the best
    in the world (if not the best), and the folks at Netscape made it better by turning
    it over to the Open Source community to help them improve it.


    Over time, Mozilla not only could surf the Web but also read e-mail, gather files
    using the File Transfer Protocol (FTP), run simple programs using Java, and even
    read Netviews (a discussion group made up of thousands of categories over the
    Net), all through a single graphical interface.


    In this chapter, you set up Netscape for your system. Then, with the information
    from your ISP, you finally surf the Web and receive e-mail.


    # # Customizing Netscape


    Your SuSE Linux for Dummies CD-ROM has a copy of Mozilla, which you can activate
    by typing the following from a terminal emulator window X Window System is running:


    ```

    netscape&

    ```


    A screen like the one in Figure 16-1 appears, and Mozilla is set free!'
  merge: -1
  img_proc: true
- pgno: 289
  md: '# 262 Part V: Going Online


    ![](img/96a9ce6a13d8d15ed05f867f41574278_289_0.png)


    Mozilla (hereafter called Netscape) has three main screens:


    +   - Navigator screen, shown in Figure 16-1

    - Mail and Discussions screen

    - News screen


    The first thing to do is tailor Netscape to your preferences. You can do this
    offline, which is certainly preferable if you have only one phone line. Follow
    these steps:


    +   1. Choose EditPreferences.


    The Preferences window appears, as shown in Figure 16-2.

    Note that on the left side of the Preferences window is a map of the preference
    options that you can choose from, called the Category window. You skipped over
    the Appearance window (it''s self-explanatory) and are now concentrating on the
    Navigator window. This is where you determine what you see as the initial window
    when you start Netscape. Most people either select a home page or the last page
    they viewed.'
