    +   7. Click the OK button to save your settings; close the previous window as
    well by clicking the OK button.


    +   8. When your screen is blank again, double-click the My Computer on the desktop.


    +   9. Select your C disk by clicking it.


    +   10. Choose File:Properties Tools.


    +   11. Defragment Now.


    You may get a message telling you that it''s not necessary to defragment your
    disk is not very fragmented. Under normal circumstances this may be true, but
    in this case it is necessary to defragment your disk because you''re going to
    move the end of the file system and make it smaller. Any data outside that barrier
    is lost, so you have to move the barrier close to the front.


    +   12. Click Start.


    The defragmentation window appears.


    +   13. Click Show Details.


    The defragmentation takes to finish. As the defragmentation continues, you can
    scroll up and down the large window watching the progress, which is represented
    by different colored blocks. See Figure 4-1. You can expect to see white space
    starting to appear toward the bottom of the window, which represents the end of
    your disk. This shows that the data is being moved reward the disk. At the end
    of the defrag process, no colored blocks should be at the bottom of the window,
    and all the blocks should be compressed toward the top of the window. The white
    space is free space in your MS-DOS file system that you may now allocate to the
    Linux file system.'
