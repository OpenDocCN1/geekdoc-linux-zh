- pgno: 174
  md: '# Chapter 8: Working with Files and Commands


    # # Making Your Own Rules


    You, as the owner of a file, can specify permissions for reading, writing to,
    or executing a file. You can also determine who (whether yourself, a group of
    people, or everyone in general) can do these actions on a file. What do these
    permissions mean? Read on (you have my permission):


    +   - Read permission for a file enables you to read the file. For a directory,
    read permission allows the ls command to list the names of the files in the directory.
    You must also have execute permission for the directory name to use the -1 ls
    command or to change to that directory.


    +   - Write permission for a file means that you can modify the file. For a directory,
    you can create or delete files inside that directory.


    +   - Execute permission for a file means that you can type the name of the file
    and execute it. You can''t view or copy the file unless you also have read permission.
    This means that files containing executable Linux commands, *shell scripts*, must
    be both executable and readable by the person executing them. Programs in a compiled
    language such as C, however, must have only execute permissions, to protect them
    from being copied where they shouldn''t be.


    For a directory, execute permission means that you can change to directory (cd).
    Unless you also have read permission for the directory, ls will not work. You
    can list directories and files in the directory, but you can''t see additional
    information about the file or directory by doing an ls -1 command. This might
    seem strange, but it is useful for security.


    The first character of a file permission is a hyphen (-) if it is a file or d
    the file is a directory. The nine other characters are read, write, and execute
    positions for each of the three categories of file permissions:


    +   - Owner (also known as the user)


    +   - Group


    +   - Others


    Your playtime file, for example, might show the following permissions listed with
    the ls -1 playtime command:


    ```

    -rw--r--

    ```


    The hyphen (-) in the first position indicates that it is a regular file (not
    a directory or other special file). The next characters (rw-) are the owner''s
    permissions. The owner can read and write to the file but cannot execute it.'
  merge: -1
  img_proc: true
- pgno: 175
  md: '# 148 Part III: Using SuSE Linux


    The next three characters (r--) are the group''s permissions. The group has read-only
    access to the file. The last three characters (r--) are the others'' permissions,
    which are also read-only.


    -[rw][r--][-] illustrates the four parts of the permissions: the file type followed
    by three sets of triplets indicating the read, write, and execute permissions
    for the owner, group, and "other" users of the file.


    Specifying most permissions by using only six letters is easy:


    +   - ugo, which stands for — no, not a car — user (or owner), and group,

    - rwx, which stand for read, write, and execute.


    These six letters, and some symbols such as = and commas, are put together into
    a specification of how you want to set the permissions of the file.


    The command for changing permissions is chmod. The syntax for

    command is


    ```

    chmod <specification> filename

    ```


    Change the mode of parttime to give the user the ability to read, write, and execute
    the file:


    ```

    chmod u=rwx parttime

    ```


    That was easy enough, wasn''t it? If you wanted to give the group permission to
    only read and execute the file? You could execute the following

    command:


    ```

    chmod g=rwx parttime

    ```


    Note that this last command does not affect the permissions for owner or\other,
    just the group''s permissions.


    Now all set the permissions simultaneously. Separate each group of characters

    with a comma:


    ```

    chmod u=r,g=rw,o=rwx parttime

    ```


    This sets the user''s permissions to just read, the group''s permissions to

    and write, and the other''s permissions to read, write, and execute.


    You can set the permission bits in other ways. This way is so simple, though,

    why use any other?'
  merge: -1
  img_proc: true
