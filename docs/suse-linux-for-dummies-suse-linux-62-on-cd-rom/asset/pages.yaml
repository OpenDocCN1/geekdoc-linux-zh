    want to use it for your Linux installation. Because you want (or need) to create
    the partitions yourself, you should select No (if you select Yes, YaST creates
    the partitions for you). In the dialog box, Use Entire Disk, and you are asked
    whether you want to do the partitioning or use the entire disk. Here you need
    to select Partitioning once again. Now you are presented with the dialog box titled
    Editing the Partition Table, which is shown in Figure 5-8.


