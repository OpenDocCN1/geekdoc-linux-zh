- pgno: 197
  md: '# 170 Part III: Using Linux


    come back from your trip, everything is changed. You can''t find things easily,
    and stuff is growing in the bottom of your mug. Wouldn''t it have been nice if
    the person had left the office exactly as he or she found?


    bash creates an environment for commands to operate in. When a new command is
    executed, bash creates a clean copy of the environment, executes the command in
    it, and then throws away that environment, returning to the environment it started
    with.


    Now look at a more complex example than just the one command ls -1:


    ```

    cd /usr/11b

    ls -1 * | more

    ```


    In this case:


    +   1. bash creates a new environment for the ls command to be executed and determines
    what should be standard input and standard output to the command. You can call
    this new environment child 1; the old environment is its parent.

    2. bash creates another environment for the more command to be executed in, called
    child 2, and determines what should be standard input and standard output to the
    more command. Because the | symbol was used between the ls -1 * command and the
    more command, the standard output of the ls -1 * command is attached to the standard
    input of the more command. The standard output of more is attached to the standard
    output of the parent bash shell. The parent shell is the one into which you have
    been typing commands and information, and the standard output of that original
    bash shell is the screen.

    3. bash expands * to match all the filenames in that particular directory, before.

    4. Next, in the child 1 environment, bash searches the PATH variable looking for
    a command called ls. The same process occurs for the more command in child 2.

    5. bash executes the ls command in the child 1 environment, passing to the command
    the -1 argument and all the filenames expanded, due to the use of the * character
    in the command.

    6. more sees the output of ls -1 * as its input, and puts its standard output
    to the screen.

    7. After 1 ls runs, bash returns to the parent environment, throwing away all
    the side effects that occurred in the child 1 environment.

    8. more sees the end of its input from ls, puts the last of its data out to the
    screen, and terminates.

    9. bash returns to its parent environment, throwing away all the changes that
    may have made to the child 2 environment.'
