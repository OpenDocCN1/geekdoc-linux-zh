  md: '# Part III: Using Linux


    # Bang-bang


    The fact that the shell remembers the command lines you have typed is useful for
    reexecution of commands at a later time. Simple reexecution commands are represented
    by exclamation points. In computerese, an exclamation point is called a *bang*
    and two exclamation points are called — you guessed it — bang-bang.


    Here are two ways you can use the exclamation point:


    +   - !! reexecutes the last command

    - <partial command line> reexecutes the command line that started with <partial
    command line>


    Here is an example. Type *cat* on the command line as follows. (Cat as <partial
    command line> mentioned in the preceding line.)


    ```

    username@hostname: ~ $ cat

    ```


    bash searches backwards through the previously executed commands in this session,
    looking for the first occurrence of a command line that started with the letters
    *cat*. When the program locates it, it is reexecuted.


    A little timid about this? Perhaps your memory of which command you typed and
    when is a little faulty. (Our memory is usually that way.) Append :p to the command
    line to see what history finds. The command looks like this:


    ```

    username@hostname: ~ $ cat

    cat /etc/passwd

    ```


    To run the command that :p found, enter bang-bang, like this:


    ```

    username@hostname: ~ $ !!

    ```


    While using history to find and reexecute command lines, you can also make additions
    to the command line. Starting from the beginning with our example, if you type
    the following:


    ```

    username@hostname: ~ $ cat /etc/passwd

    ```


    The file /etc/passwd is output to standard output, which in this case is the screen.


    When you reexecute the preceding command by typing !!, you can also send the output
    to the sort command by using the pipe symbol:


    ![](img/96a9ce6a13d8d15ed05f867f41574278_199_0.png)'
