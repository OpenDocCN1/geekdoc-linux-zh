  md: '# Chapter 11


    # Windows on the World


    In This Chapter


    +   - Making X Window System get up and go

    - Moving windows

    - Resizing windows

    - Minimizing and maximizing windows

    - Understanding the virtual desktop

    - Closing and killing windows

    - Stopping X Window System


    > In 1984, MIT Project Athena was trying to develop a computer system that could
    deploy over thousands of computers tied together by networking. Bob Scheffler
    (of MIT) and Jim Gettys (of Digital Equipment Corporation) built on earlier work
    performed at Stanford University by Brian Reid and Paul Ascent (also of Digital
    Equipment Corporation). Brian and Paul''s work was called W, so of course Bob
    and Jim named their work X. This work, along with the work of thousands of other
    people and companies, eventually developed X Window System, the graphical interface
    to the Linux operating system as well as many other operating systems.


    In this chapter, you find out lets ways to work in X Window System. You start
    the system, which is always a good place to begin. Then you fool around with windows,
    moving them, changing their size, bringing them to the foreground, and hiding
    them in the background. Later, you close your windows and end your X Window System
    session.


    # The Amazing X Window System


    X Window System (also designated simply as X11 or X) has three main parts:


    +   - A graphics server

    - A set of graphics libraries

    - A set of graphics clients who normally use the graphics libraries'
