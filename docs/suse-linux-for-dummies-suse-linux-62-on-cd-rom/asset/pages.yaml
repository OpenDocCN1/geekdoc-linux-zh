  md: '# Appendix A: Hardware Compatibility 307


    Xatwv; and Xtvs. The CMOS Video Conferencing Kit comes with a video capture card
    and a CCD camera. Other boards that are supported Data Translation DT2803, Data
    Translation DT2851 Frame Grabber, Data Translation DT3155, Diamond DT2000 (based
    on BT848), Dipix XP1000/FPG/PPAMA (based on TI C40 DSP), Epix SVM, Epix Silicon
    VideoUX series of video framing boards, FAST Screen Machine II, Hauppage Wincast
    PCI (based on BT848), Imaging Technology ITI/IC-PCI ImageNation C1,ImageNCI100,
    Imaging Technology IC-PCI frame grabber, Mater Meteor, Matrop-PI102, MaxiTV/PCI
    (based on ZK36120), Miro PCV (based on BT848), MuTech MV1000 PCI, MuTech MV200,
    Pro Movie Studio, WinVision&BW video capture card, Quickcam, Sensus 700, Smart
    Video Recoder III (based on BT848), STB TV Television Tuner (based on BT848),
    Tekram C210 (based on ZR36120), Video Blaster, Rodeo Media Pro, and VT1500 TV
    cards.


    # UPS and Miscellaneous Devices


    Many people have a little surge protector on the power to their computer system.
    Although it''s better than nothing, surge protector offers only so much protection
    from surges and no protection from blacks. As you will come to know, Linux systems
    just hate their power turned off before a nice, orderly shutdown of services.
    And when the system comes back up, there is this long wait until it checks to
    see whether the file system is corrupted. An uninterruptible power supply (UPS)
    uses batteries to provide power to the computer system, allowing the computer
    system to shut down in an orderly way if the power starts to fail. Good ones also
    give you the ability to tie the computer into your UPS, and therefore have the
    UPS judge when it should go complete shutdown. Some of the units are APC SmartUPS,
    APC-BackUps 400/600, APC-SmartUPS 700/1400RM, UPS with RS-232 monitoring port
    (generic package), and MGE UPS.


    Many more hardware devices are supported, and do not fit into any other category
    than “strange” . . . er., . . . “miscellaneous.” They include Mattel Powerglove,
    AIMS Labs RadioTrack FM radio card, Reveal FM radio card, and Videotext.


    # PCMCIA Cards


    PCMCIA cards are used to get extra features into very small places. We own several
    modems and Ethernet controllers, a SCSI interface, and a sound card. All are PCMCIA
    cards, and all have support under Linux.'
