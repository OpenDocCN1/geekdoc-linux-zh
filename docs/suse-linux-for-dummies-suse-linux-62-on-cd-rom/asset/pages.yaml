    maddog@shame:- >

    ```


    This time, the cat command took the file off the disk and put the output to standard
    out (also known as standard output), in which this case is your computer screen.


    If you think of something else you want to add to the file, you can use the append
    symbol (>>) with the filename. Whatever you type is added to the end of the filename.
    Returning to dogfile:


    ```

    maddog@shame:- > cat dogfile

    Dog-eared. Doggerel.

