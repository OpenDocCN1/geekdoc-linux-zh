- pgno: 32
  md: '# Introduction


    # Part I: Introducing Linux


    In Part I, you find out about the birth of Linux and about the different types
    of Linux out there, including the one on the SuSE Linux For Dummies CD-ROM. You
    also get some tips on installing which one is right for you.


    # Part II: Installing SuSE Linux


    In Part II, you get your answer to the age-old question: How the heck do I install
    SuSE Linux? We give you detailed, step-by-step instructions. You also get lots
    of help installing X Window System, the graphical part of Linux. You may want
    a double espresso or a coffee Jolt soda (Twice the sugar! Twice the caffeine!)
    by your side for this.


    # Part III: Using SuSE Linux


    In Part III, you get the glorious particulars on actually doing something with
    Linux. We take you through the history of text editors and how to use them. You
    find out that not all shells are found on the ocean floor; Linux has one just
    for you. You can also take X Window System through its paces by moving, resizing,
    hiding, and closing windows.


    # Part IV: Maintaining Your System


    Linux isn''t a high-maintenance operating system, but it does need some care (Chocolate
    helps too.) In Part IV, you find out how to manage the Linux file system, which
    is the biggest part of the care and feeding of Linux. You also get hints on boosting
    the performance of Linux. Vroom. Vroom.


    # Part V: Going Online


    Everyone is online these days, and Linux is no exception. In Part V, you find
    out how to contact an Internet service provider to get an account for accessing
    the Internet, how to set up your Linux system to interact with that account, and
    how to use the Netscape browser with that account to surf the Web.'
  merge: -1
  img_proc: true
- pgno: 33
  md: '# SuSE Linux For Dummies


    # Part VI: The Part of Tens


    A...For Dummies book just isn''t complete without a Part of Tens. And that''s
    Part VI. You find ten all-important resources in Chapter 17. In Chapter 18, we
    provide answers to the ten most bothersome questions people have after installing
    Linux.


    # Part VII: Appendixes


    Finally, the appendices. In Appendix A, we list all the hardware that we know
    of that''s compatible with Linux. In Appendix B, you find out all you need to
    know about the Linux man pages. And in Appendix C, we tell you where in the book
    you get information on installing the CD-ROM.


    # What You''re Not to Read


    Heck, you don''t have to read any of the book if you don''t want to, but why did
    you buy it? (Not that we''re complaining.) Part I has background information.
    If you don''t want it, don''t read it. Also, text in sidebars is optional, although
    often helpful. If you''re on the fast track to using Linux, you could skip the
    sidebars and the text with a technical stuff icon. But I suggest instead that
    you slow down a bit and enjoy the experience.


    # Icons in This Book


    ![](img/96a9ce6a13d8d15ed05f867f41574278_33_0.png)


    This is particularly nerdy, technical information. You may skip it.


    ![](img/96a9ce6a13d8d15ed05f867f41574278_33_1.png)


    This icon flags discussions that relate to the CD-ROM. The CD-ROM is a copy of
    the SuSE Linux Version 6.2 distribution, the latest distribution available at
    publishing time.


    ![](img/96a9ce6a13d8d15ed05f867f41574278_33_2.png)


    Don''t let this happen to you! We hope that our experiences in UNIX and Linux
    will help you avoid the mistakes we made.'
  merge: -1
  img_proc: true
- pgno: 34
  md: '# Introduction


    ![](img/96a9ce6a13d8d15ed05f867f41574278_34_0.png)


    This signifies nifty little shortcuts and timesavers. Linux is a powerful operating
    system, and you can save unbelievable amounts of time and energy by utilizing
    its tools and programs. We hope our tips show you how.


    ![](img/96a9ce6a13d8d15ed05f867f41574278_34_1.png)


    This signifies anecdotes and bites of wisdom straight from the maddog''s mouth.


    # Where to Go from Here


    You are about to join the legions of people who have been using and developing
    Linux. We''ve been using UNIX for more than 20 years and Linux for more than 4
    years. We''ve found Linux to be a flexible, powerful operating system, capable
    of solving most problems even without a large set of commercial software. The
    future of the Linux operating system is bright. The time and energy you expend
    in becoming familiar with it will be worthwhile. Carpe Linuxum.'
  merge: -1
  img_proc: true
