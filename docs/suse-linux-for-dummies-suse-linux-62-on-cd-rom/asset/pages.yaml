- pgno: 340
  md: '# # Appendix B


    # # The Linux man Pages


    UNIX and Linux systems are largely made up of small, terse commands executed on
    the command line. Typically, each command is associated with at least one man
    page. The Linux man pages have nothing to do with gender: The man stands for manual.


    At one time, the man pages were the only documentation that came with UNIX systems.
    Somewhere I still have the thin book I received as a first-time UNIX user and
    systems administrator. All it contained were the man pages, and that I was supposed
    to install a UNIX system. Many years later, I still look at the man pages first
    to get a quick idea of what a command should do and what arguments to use on the
    command line or what values to set.


    This appendix shows you how to use the man(1) command, how to read and understand
    the man pages, and how to locate other man pages that may help you understand
    the Linux command you''re investigating.


    # # Using the man Command


    To get started using the man pages, follow these steps:


    +   1. With Linux up and running, log in as a user (either a general user or root).

    2. Type the man command.


    The system asks what manual page you want. The syntax of the man command (like
    many other commands) requires at least one argument.


    +   3. Supply an argument by typing man man.


    The first man is the command name and the second man tells Linux that you want
    information on the manual program itself. The system may tell you wait a moment
    while it formats the page to your screen, and then it displays the reference page
    for the man command.


    +   4. If a colon (:) appears at the bottom of the screen, press the spacebar
    to see the next page, or use the arrow keys to maneuver around the pages.

    5. To quit the program, press q.'
  merge: -1
  img_proc: true
- pgno: 341
  md: '# Sections in the man Pages


    The man pages are usually found in several directories throughout the system:


    Each directory is broken up into subdirectories representing sections of the manual,
    as follows:


    +   - man1: User commands

    - man2: System calls

    - man3: Library functions

    - man4: Special files

    - man5: Games (Look at everyone going to that section!)

    - man7: Miscellany

    - man8: System administration commands

    - mann: nroff, troff, and groff (and now tk) macros


    Note that most directories have more than one section.


    Two sections may have an entry for a command of the same name. For example, section
    1 has an open command and section 2 has an open system call. To make sure you''re
    reading about the right one, you can specify the command on the man command line.
    For example:


    ```

    [maddog@localhost maddog] > man 2 open

    ```


    Most sections of the man database (for that is basically what it is) has two parts:


    +   - An intro page represented by a file called intro.n, where the n corresponds
    to the section number.

    - All commands, calls, library names, and filenames, represented by files with
    the name command.n, where n is the section number.'
  merge: -1
  img_proc: true
- pgno: 342
  md: '# Appendix B: The Linux man Pages 315


    If you use cd to change to the /usr/man/man1 directory and issue the ls command,
    you see files such as cat.1 and grep.1. Oddly, you don''t find a file called cd.1,
    because the cd command is built into the different shells, and its documentation
    is covered in the bash.1 file or the csh.1 file.


    If you are using bash as a shell, you can get information about the rest of the
    built-ins as follows:


    ```

    [maddog@localhost maddog] > help

    ```


    The intro briefly describes the section of the manual and whether you need to
    know anything special about that section. Printing an intro page is simple. For
    example:


    ```

    [maddog@localhost maddog] > man 2 intro

    ```


    or


    ```

    [maddog@localhost maddog] > man 3 intro

    ```


    # Topics in the man Pages


    Each man page is made up of several sections. In this part, we list the sections
    we think are most important in your quest to figure out how to read man pages.
    Note that some man pages don''t contain all these sections, and other pages contain
    more sections than those outlined here.


    # Name


    The man is usually the command name, followed by a hyphen, followed by a one-line
    description of the command''s functionality. This is usually what you see if you
    execute a man -k or an apropos command. Either of these commands, when followed
    by a word, lists the name field from every manual page that contains that word.
    Type the following:


    ```

    [maddog@localhost maddog] > apropos cat

    ```


    Your apropos command may produce few or no commands. Perhaps no one has generated
    the database map of command names and descriptions. To do this, either you or
    your systems administrator has to become superuser or root and then execute the
    following command line:


    ```

    /usr/sbin/makethis

    ```'
  merge: -1
  img_proc: true
- pgno: 343
  md: '# 316 Part VII: Appendixices


    # Synopsis


    The synopsis is a shorthand way to describe what the command is looking for the
    way of an argument list. For example:


    ```

    lpq [-a] [-Pprinter] [job # ...] [user ...]

    ```


    is the synopsis for the lpq command (whose job is to show what is in the print
    queue). The command (lpq) is first, followed by a series of brack-eted arguments.
    If an argument is enclosed in square brackets, the argument is optional. That
    means the lpq command needs no arguments. If you type


    ```

    [maddog@local maddog] > 1pq

    ```


    you will probably get a no entries message, which means nothing is waiting to
    be printed, or a list of people''s jobs is waiting to be printed on the default
    printer.


    If you want to see what is waiting to be printed on another printer, you use the
    option -P followed by the name of the printer. For example:


    ```

    [maddog@localhost maddog] > -Pzklpsa

    ```


    Now if you type that, you probably get a message like lpq: zklpsa: unknown printer,
    showing that your system does not know about a printer named zklpsa. If you get
    something else, let me know, because that may explain why my print jobs are going
    ... , no, just kidding.


    In any case, the purpose of this section is not to show all the functional-ity
    of the lpq command. Rather, the synopsis section shows in a shorthand how the
    command should be used, including which arguments are optional.


    Another confusing thing you see is the ... notation. Looking back at the lpq command
    synopsis, you see it twice, once following the job # argument and once following
    the user argument. This notation tells you that you can list as many job numbers
    on the line as you want, separated by spaces, and as many user names as you want,
    separated by spaces.


    Sometimes you see a command that begins with one hyphen (-) or two (--). These
    are technically known as options, whereas job # and user of the lpq command are
    arguments. Options tell the command how to manipulate arguments. You might see
    an option line that looks like this:


    ```

    cat [-benstuvAET]

    ```


    or even


    ```

    ls [-abcdefghijklmnpqrstuxABCGLNQRSUX1]

    ```'
  merge: -1
  img_proc: true
- pgno: 344
  md: '# Appendix B: The linux man Pages 317


    Don''t be overwhelmed. If you deal with the options one at a time, you''ll be
    able to understand how the command works. Take heart in the fact that most of
    the time, most people use one or two options.


    If you issue the ls command, you will see that ls has many more options. That''s
    why ls has been described as “a command that went bad intentions.”


    # Description


    The description section is a brief introduction to the command''s functional-,
    which is then expanded on by what the options specify the command to do. A good
    example of a description is the manual page for man itself.


    # Options


    As stated in the “Synopsis” section, the options section tells how the command
    treats data in the arguments. Each option modifies the command''s actions, drastically
    or subtly. The options can also pass information to the command about where to
    find files. The three types of options are


    +   - No argument

    - Attached argument

    - Positional argument


    No argument means the option has a hyphen followed by one or more single-character
    options. For example:


    ```

    [maddog@localhost maddog] > ps -ax

    ```


    The a and x do not have any other values that they have to look at. However, in
    the following command:


    ```

    [maddog@localhost maddog] > 1pq -Pzk1psa

    ```


    the - P option to have an argument supplied; in this example, zk1psa.


    # Environmental variables


    Sometimes, to cut down on the information you have to give the command, you can
    set an environmental variable. Each shell (or command interpreter) has an environment
    that it works in. This environment (when it is created)'
  merge: -1
