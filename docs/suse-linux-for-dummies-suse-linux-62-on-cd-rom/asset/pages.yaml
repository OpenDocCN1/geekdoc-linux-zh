    # Getting deep into color depth


    Color depth, the number of colors your system can have active on the screen at
    any time, is loosely a function of both the amount of video memory your system
    has and the screen resolution.


    picture you are viewing will take up more of the screen, but color depth versus
    resolution is a trade-off you can make by choosing the right options in the depth
    box shown in Figure 6-7.


    If your system has a small amount of memory (such as 1MB), your screen could have
    a resolution of 1,024 x 768 pixels (dots) with 256 colors (8 bits) on the screen
    at one time. If you have 2MB, you can have 64K colors (16 bits) on the screen
    at the same time as the resolution. If you have an older video board with a small
    amount of video memory plus some video memory sockets, you may be able to upgrade
    the amount of video memory on the video card.


    When you want to display an image and the color depth is not correct, nothing
    drastic happens. The picture may look a little lackluster or not quite normal.
    The X Window System has an interesting capability to have virtual color maps,
    which allow the window to utilize all the colors of the bits of color depth, even
    if windows are turned on (it is with the SuSE Linux for Dummies distribution),
    the various windows turn off colors as you move from window to window, but the
    window mouse activates in the best color available. With newer video cards and
    larger video memory, which allow for true color at high resolution in every window,
    this option is less useful.


    If you have only 1MB and want to see 64K colors on the screen at one time, you
    can reduce your resolution from 1,024 x 768 to 800 x 600 pixels. If you want true
    color (24 bits), you can set your resolution to 640 x 480 pixels.'
