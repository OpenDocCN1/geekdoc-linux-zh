  md: '# 96 Part II: Installing SuSE Linux


    When you have completed all these steps, a screen appears indicating that all
    the network settings have been configured.


    # Sendmail configuration


    The next dialog box asks a slightly more detailed question about your network
    configuration (see Figure 5-32). If you do not have a permanent connection to
    a network but you will be using your modem, select the Host with Temporary Network
    Connection option.


    If you have a permanent connection to a network, select the Host with Permanent
    Network Connection option and press Enter. A configuration script called SuConfig
    will run and your system configuration files will be updated by your selections
    in the previous dialog boxes. When the script is finished, press Enter.


    ![](img/96a9ce6a13d8d15ed05f867f41574278_123_0.png)


    Figure 5-32:

    Selecting a

    Sendmail-configuration.


    # Setting the root password


    Linuxrc reappears and tells you that the system will be rebooted to commit the
    installation. Press Enter, and the system is rebooted.


    The installation program now prompts you to select a password to use for logging
    in to your Linux system. The password that you are entering is for the root user,
    also known as the superuser, who has access to the entire system.


    We recommend that you use a combination of uppercase and lowercase letters as
    well as numbers to make the password as difficult to compromise as possible. In
    addition, do not choose names or items that are easy to associate with you. In
    others, your name, your dog''s name, or 12346,'
  merge: -1
  img_proc: true
- pgno: 124
  md: '# Chapter 5: Installation: Down to the Final Stretch


    passwd, and the like are poor choices. Select a password and then be sure to write
    it down where it won''t get lost. Don''t write it on a sticky note attached to
    your monitor, please.


    You have to enter the password two times to make sure that you typed it correctly;
    the password doesn''t appear on the screen as you type it. Holy mol, Batman. You
    wouldn''t want someone to be able to look over your shoulder and get your password
    now, would you?


    When you''ve managed to type your password the same way twice, YaST restarts automatically
    to finish some configuration settings.


    Logging in as the root user only to do system maintenance or administrative tasks
    is best. The root user is the only one with access to critical system files. To
    avoid unwanted changes or deletions, add another user for your use.


    ![](img/96a9ce6a13d8d15ed05f867f41574278_124_0.png)


    # Creating a user account


    When YaST restarts, a dialog box appears and asks whether you want to create an
    example user. Although doing so is not required, we strongly recommend you create
    a user account and use this account when using your Linux computer. When creating
    an account, you need to enter the user name, which must be a contiguous string
    of characters. In addition to the user name, you must enter a password. We urge
    you to change the description to your full name, although you can leave this field
    blank.


    # Configuring your modem


    If you have a modem and you know which COM port it is attached to, you can configure
    this in the next dialog box. Select the appropriate COM port for your modem from
    the list. If you are not sure which COM port your modem is attached to, don''t
    worry — you can configure it later, in Chapter 15, “Setting Up Your Internet Connection.”


    # Configuring your mouse


    The mouse configuration dialog boxes are shown in Figures 5-33, 5-34, and 5-35.
    In the first screen (see Figure 5-33), you are presented with a list of mouse
    protocols. Select your mouse from the list. If you have a serial mouse, you are
    also presented with a list of COM ports to select from.'
  merge: -1
  img_proc: true
