    # Character-Cell or Graphical?


    Linux applications are available not only as free and nonfree applications, but
    also as character-cell and graphical applications. Character-cell applications
    are textual types of applications in which you type a command and the system responds.
    MS-DOS is an example of a character-cell operating system. In a graphical application,
    you use the mouse as well as the keyboard to tell the computer what to do. Microsoft
    Windows is a ubiquitous example of a graphical operating system. The graphical
    portion of Linux is called X System. Like Microsoft Windows, the graphical interfaces
    in Linux can have multiple windows, icons, and drop-down or pop-up menus, all
    of which can be manipulated with a mouse.


    ![](img/96a9ce6a13d8d15ed05f867f41574278_47_0.png)


    If you use X Window System and your system is running out of main memory or disk
    space, try switching Linux to character-cell mode.


    UNIX started as a character-cell operating system and had graphical window systems
    added to it. Linux inherited both character-cell and graphical features from UNIX.


    You will probably spend most of your time using Linux in its graphical mode. Many
    Linux character-cell applications, however, were created before the age of X Window
    System or simply work better in character-cell mode. In Chapter 10, you can see
    a bunch of applications that work very well in character-cell mode.'
  merge: -1
  img_proc: true
- pgno: 48
  md: '# Chapter 2: Accessorizing Linux


    TIP If you''re using a laptop for short periods of time (to take notes in a meeting,
    for example) and find that the startup time for X Window System and its associated
    programs is too long, you might want to opt (as we do) for character-cell mode.


    # Text Editors


    Linux systems often come with several different text editors. Text editors are
    programs that typically enable you to type and manipulate alphanumeric characters.
    Some text editors can do simple word processing tasks such as word wrap, but they
    can''t perform most word processing functions, such as spell checking or italicizing
    text.


    Text editors are good for simple text-editing tasks and for writing simple or
    complex programs. Most have built-in help functions, and some have full-scale
    documentation built in or available online. In addition, you can find books about
    a few editors, such as vi(1) and emacs(1).


    In this section, we describe character-cell text editors and graphical-based text
    editors that you can find freely available software or as shareware. We also describe
    some commercial text editors.


    # Character-cell text editors


    ed(1) is the oldest character-cell text editor and comes with every UNIX system.
    ed is difficult to use because it doesn''t normally show you the entire file,
    and it doesn''t show you the changes you''ve made until you ask it to do. Those
    who use are usually old-time UNIX users with gray beards who wear suspenders with
    their shorts. Even with these downsides, it''s useful to know how to use ed because
    it usually comes with every Linux system. ed is on the CD-ROM that this book.


    Following quickly after the introduction of ed was an extended editor called ex(1)
    and a visual front end to it called vi(1). vi was written in the mid1970s and
    allowed people to see a whole screen of text at one time! Believe it or not, this
    was big news in those days. Many Linux systems ship with a new version of vi vim(1),
    for "vi improved".


    You can execute vim by typing vim, but SuSE Linux has a link to it and ex. A link
    is to give two names to the same program. Although the same program is being executed,
    the system stands and looks at what the user types when starting the program.
    For example, if the user types vi, the program starts vim.


    ![](img/96a9ce6a13d8d15ed05f867f41574278_48_0.png)'
  merge: -1
  img_proc: true
