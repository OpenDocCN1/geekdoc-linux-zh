    \ this for each one of your file systems:\n\n```\nfsck.ext2 -a /dev/hda7\n/dev/hda7\
    \ was not cleanly unmounted, check forced\n/dev/hda7: Deleted inode 1324 has zero\
    \ dtime. FIXED\n/dev/hda7: Deleted inode 15987 has zero dtime. FIXED\nFix summary\
    \ information? Yes\n/dev/hda7: 46906/356000 files (1.6% non-contiguous),\n   \
    \   765217/1283507 blocks\n```\n\nThis is fsck with the -a option, which answers\
    \ all the questions with yes. For the most part, it corrects any errors that occur\
    \ when the power\nfails or when something breaks inside your computer, causing\
    \ it to crash.\nAfter fsck, it reports whether it modified any file systems.\n\
    \n# More Disk Storage\n\nSooner or later, you're likely to want to add more disk\
    \ storage to your Linux\nsystem to hold more programs, to hold more data, or to\
    \ enable more users\nin. Disk storage is usually added one or more disks at a\
    \ time; each disk\ncan have one or more disk partitions.\n\nThe disk partition\
    \ is Linux's basic file storage unit. First you create the\nsystems on the disk\
    \ partitions, and then you combine the file systems to\nform a single directory\
    \ tree. The directory tree structure can be on\none disk or spread across many.\n\
    \nYou can define disk partitions while adding a new disk or later. In most cases,\n\
    Linux defines disk partitions during the original Linux installation. You may\n\
    ddivide a disk into one, two, four, or more partitions, each of which may contain-na\
    \ file system or be used as a swap partition. Swap partitions allow very\nlarge\
    \ programs or many small partitions to run even if they take up more\nmemory than\
    \ you have as RAM in your computer. The total of all your swap\npartitions and\
    \ RAM is called virtual memory.\n\n![](img/96a9ce6a13d8d15ed05f867f41574278_253_0.png)"
