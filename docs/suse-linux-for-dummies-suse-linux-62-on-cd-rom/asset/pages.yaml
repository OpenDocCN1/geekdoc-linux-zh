  md: '# 90 Part II: Installing SuSE Linux


    # # Configuring LILO, the Linux Boot Loader


    The next screen asks whether you want to configure LILO. Because you will be using
    LILO to boot your Linux system, press Enter. Figure 5-25 shows the next screen,
    which has a few fields that need to be filled out. Each of the LILO configuration
    box fields is described in the following list.


    ![](img/96a9ce6a13d8d15ed05f867f41574278_117_0.png)


    Figure 5-25

    The LILO

    configuration screen.


    +   - Append line for hardware parameter. This field is usually left blank. You
    use it only in rare cases when the Linux kernel cannot recognize aspects of your
    hardware. In these cases, you have the option to specify certain features of the
    hardware. Append line parameters are given in Appendix A.


    +   - Where do you want to install LILO? For LILO to select the names of the different
    operating systems to boot and to allow you to select an operating system, LILO
    has to store itself and its boot information place. You can store the information
    in a few places:


    +   - The Master Boot Record (MBR) is the recommended place for installing LILO
    unless another operating system loader like System Commander or OS/2 Boot Manager
    is loaded here (which you should know if you installed them). If LILO is installed
    on the MBR when your machine boots, LILO starts when the BIOS finishes and displays
    the boot: prompt.


    +   - The first sector on your root partition (the partition of the disk that
    holds the beginning of the Linux file system and the kernel of the operating system)
    is the recommended place if you are using another bootstrap loader (such as System
    Commander or OS/2 Boot Manager) on your system. You set up that to boot LILO,
    then you have LILO boot Linux. To find out how to make your other bootstrap loader
    know about LILO, refer to the documentation for other bootstrap loader.'
  merge: -1
  img_proc: true
