- pgno: 332
  md: '# Appendix A: Hardware Compatibility 305


    # Modems


    Modems are simple things on the surface. They are either external to your system
    and plug into an existing serial line, or they are internal to the system and
    look like another serial line to the system. Alas, some modems are made for only
    Windows and WinModems — do not work with Linux. These are generally known as WinModems
    — keep clear of them.


    # Mice


    There is another case where you might say "Surely there are no issues with mice
    working because they''re so simple." Well, when start thinking of the vagaries
    of mice and men, we know that nothing is simple. Linux supports the following
    mice: Microsoft serial mouse, Mouse Systems serial mouse, Logitech Mouseman serial
    mouse, Logitech serial mouse, ATI XL Import bus mouse, C&T 82C710 (QuickPort)
    (Toshiba, TI Travelmate), Microsoft bus, Logitech bus, PS/2 (auxiliary device)
    mouse, and Alps Glidepoint.


    # Printers and Plotters


    All printers and plot connected to the parallel or serial port should work — except
    those printers made to work with only Microsoft products. You may see a pen in


    Many Linux programs output PostScript files. Printers can emulate PostScript Level
    2 using Ghostscript, particularly: Apple Imagerwriter, Itoh M8510, Canon BubbleJet
    BJ10 (bj1e), Canon BubbleJet BJ200, BJC-210 (B/W only), BJC-240 (B/W only), Canon
    BubbleJet BJC-600, BJC-610, BJC-4000, BJC-410, BJC-450, MultiPass C250, BJC-240,
    BJC-70 (bj600), Canon BubbleJet BJC-800 (bj800), Canon LBP-815, LIPS III, DEC
    LA570/70/75/75pls, DEC LN03, LJ250, Epson 9 pin, 24 pin, LQ series, AP3250, Epson
    Stylus Color/IJ500/800 (scalar), HP 2563B, HP DesignJet 650, HP Deskjet, Desktop
    Plus (deskjet), HP Deskjet 500 (deskjet), Desktop Portable (djet500), HP Deskjet
    400/500/5400/690/693c (cdj50), HP Deskjet 550/5600/660/682c/683c/893c/850/870Cse
    (cdj550), HP Deskjet 850/870Cse/870Cxi/680 (cdj850), HP DeskJet 600 (Lj4idth),
    HP Deskjet 500/510/520/540/550/560/855C/855C, LaserJet 5/5L (lj4pet)'
