- pgno: 146
  md: '# Chapter 7: Using SuSE Linux for the First Time


    unique identity also helps to keep the actions of one person from affecting the
    actions of another, because many people may be using the same computer at the
    same time.


    For now, you will be logging in as *root*, in Linux terms is known as superuser.
    The *superuser* is a privileged account that enables a person to go anywhere and
    do anything on the system. Superusers can add disk drives, do backups, restore
    damaged files, and turn the system off and on. They can also damage the system
    if they make a mistake. Because superusers are all-powerful, their mistakes can
    be all-bad.


    Before doing more in this chapter, you need to create another account for yourself
    that is unprivileged. In that way, when you make a mistake while becoming familiar
    with Linux — and who doesn''t? — it will be limited to the power of your account.
    You may erase your own files and data but not some else''s files or the system''s
    files. Comforting, isn''t it?


    Before you create safe, new account for yourself, though, you need to log in as
    *root*. For that, you need the superuser password that you typed during installation
    (refer to Chapter 5):


    ```

    login: root

    Password:

    ```


    You won''t see the password while you type it on the screen. The secrecy ensures
    that your coworkers, who may be watching over your shoulder, will not see the
    password and try to log in later as *root*. So much for trust in the workplace.


    If you make a mistake typing the password (or while typing the word *root*), the
    system responds with


    ```

    Login incorrect

    ```


    and gives you another chance by redisplaying


    ```

    login:

    ```


    Type **root** and then type your password.


    After you are logged on as *root*, the following appears on the screen:


    ```

    root@localhost:~ #

    ```


    with a # as the final character. The # at the end of the line indicates that you
    are a superuser with extraordinary powers, so be careful.


