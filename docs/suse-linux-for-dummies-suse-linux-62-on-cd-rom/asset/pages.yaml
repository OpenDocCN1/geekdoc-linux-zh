- pgno: 88
  md: '# Chapter 4: Making Room for SuSE Linux 61


    +   1. Make a full backup of your system.


    If you want to reinstall DOS and Windows data, follow the instructions for your
    Windows backup utility. At a minimum, copy anything you can''t reinstall from
    program disks. This data includes your files from a word processor, a spreadsheet,
    and a database, as well as e-mail you want to save. Most people customize settings
    for the programs themselves, so to save those settings too, you really need to
    back up everything.


    +   2. Make sure you have full backup of your system.


