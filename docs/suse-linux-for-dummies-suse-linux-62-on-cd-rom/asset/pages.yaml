- pgno: 178
  md: '# Chapter 8: Working with Files and Commands


    ```

    ls -al /etc

    ```


    This command lists all the files in your /etc directory. Because this directory
    holds a troubleshoot of files, the information scrolls down your screen faster
    than you — or any Evelyn Wood graduate — can read it. You can, however, correct.


    With a process called piping. Linux uses the output from one command as the input
    for another. It''s not as confusing as it might sound. In the last example, you
    had too much information — or output — to fit on one lonely screen. You can take
    that information and put — or input — into a program that divides the information
    into screen-sized pieces and displays them.


    To do this, use the more command, which is an appropriate name for this tool.
    You pipe the list command''s output to the more command. How do you pipe? You
    use the character on your keyboard. We bet you were wondering what that key was
    for. Type the command as follows:


    ```

    ls -al /etc | more

    ```


    Linux doesn''t care if spaces around the character ; , but you may want to use
    them for clarity and to get in the habit of including spaces because they are
    important at other times.


    When you press Enter, the information appears one screen at a time with the word
    more appearing at the bottom of each screen except the last. To move to the next
    screen, press the spacebar. When you finish with the last screen, the more command
    takes you back to the Linux prompt. The more command can do even more. When the
    screen fills with the word more appearing at the bottom, you can type some commands
    to the more program:


    +   - q to get out of the more command without wading through all those screens

    - h to see a list of all commands available in the more command


    Note that some commands to the more command (such as the b command) don''t work
    when you are piping into the program, as opposed to using more with a file.


    Everyone makes mistakes. Everyone changes his mind from time to time. For those
    reasons, you need to know how to delete text from the Linux line. If you want
    to start, press Ctrl-U to remove everything you have typed on the command line
    — if you have not yet pressed Enter. The Backspace key erases one character at
    a time. The left- and right-arrow keys move the cursor along the line of characters
    without erasing; when you get to the place you want to change, use the Backspace
    key to erase mistakes and retype them. In most cases, the up- and down-arrow keys
    jump the cursor back and forth through the last few commands.


    ![](img/96a9ce6a13d8d15ed05f867f41574278_178_0.png)


    ![](img/96a9ce6a13d8d15ed05f867f41574278_178_1.png)'
  merge: -1
  img_proc: true
- pgno: 179
  md: '# 152 Part III: Using SuSE Linux


    Linux sometimes uses a command called less, which duplicates the functionality
    of the more command. Originally, the less command was designed to be more robust
    than the more command, but the more command caught up and they are now almost
    the same. Some Linux systems display text with the less command instead of the
    more command, which most UNIX programs use.


    ![](img/96a9ce6a13d8d15ed05f867f41574278_179_0.png)


    The less and more commands have two apparent differences. One, the less command
    requires a q command to get back to the Linux prompt, even when you are at the
    end of the last page. Two, the more command always says More at the bottom of
    a screen, whereas less has just a : character at the bottom of the screen to indicate
    that it is waiting for you to input the next command. The SuSE Linux For Dummies
    CD-ROM, which is a SuSE distribution, uses more rather than less as a default.'
