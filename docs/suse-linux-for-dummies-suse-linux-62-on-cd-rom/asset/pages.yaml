  md: '# Chapter 6: Solving Problems with the X Window System Installation


    # # Start Your Engines


    At this point, you should have a correctly configured X Window System. To start
    the X Window System, simply type the following:


    ```

    [root@localhost X11]$ startx

    ```


    You should see the KDE (this acronym stands for the K Desktop Environment) desktop
    appear on your screen. The first time you start KDE, KDE automatically creates
    a few configuration folders in the home directory of the user who is using KDE.
    You are prompted by KDE to approve the creation of these folders and you should
    click the OK buttons as they appear. When KDE is loading, you will see some icons
    on your desktop and a panel at the bottom of your screen with a K in the left
    corner.


    # Love through the open window


    Your X Window programs come from code that was contributed to the X Window System
    project, which was first connected with Project Athena at the Massachusetts Institute
    of Technology. Later, the project became the main focus of the X Consortium, a
    nonprofit group established to develop the X Window System technology.


    love of programming. XFree86 team of programmers tries to give support to new
    video controllers as they come out. Unfortunately, this is often difficult for
    several reasons:


    +   - They have no relationship with the video controller manufacturer.


    +   - Video controller manufacturer thinks that keeping the programming interface
    secret gives them an edge against their competitors.


    +   - The video board is built into a larger system board.


    +   - The video controller is simply too new.


    Because the source code was freely distributable, a group of programmers from
    all over the world formed to give support to X Window code on low-end PC systems.
    They called themselves XFree86 after the fact that their code was free and directed
    toward PCs, which were largely based on Intel x86 compatible processors.


    Over time, they ported their code to freely distributable operating systems on
    other architectures. They did this—and continue to do this for the


    Until support is available, most people rely on SVGA compatibility to get the
    card to work.'
  merge: -1
  img_proc: true
- pgno: 141
  md: '# 114 Part II: Installing SuSE Linux


    # # It Worked!


    We congratulate you for getting X Window System working. If you knew all the issues
    involved in working with PC video hardware, you would think fantastic that the
    XFree86 developers can get it working at all. Even though XFree86 is freely distributable,
    you may want to make a donation to their development fund, listed at www.xfree86.org.


    If X Server is working and you want it to stop, press Ctrl+Alt+Backspace. You
    can then log off the root account.


    If you want to start X Window System working again, log in to an account and type
    startx. X Server starts in a few moments. If you are having problems, then you
    may want to read ahead in the section titled "What Went Wrong"


    # # Shutting Down the System


    If you are accustomed to MS-DOS or Windows 3.1, it may seem strange to have a
    section on shutting down the system. After all, shouldn''t you turn off the power
    switch? The answer is no! Linux requires a systematic process to shut down the
    operating system, after which you can turn off the power switch.


    If you have just finished installing the system, you are logged in as systems
    administrator called root. Follow these steps to shut down the system:


    +   1. If X Window System is running, press Ctrl+Alt+Backspace to stop X Window
    System.


    The system returns to character-cell mode, and the # prompt appears. The # prompt
    tells you that you have the powers of the systems administrator (don''t let it
    go to your head) and that you can shut down the operating system.


    +   2. Type shutdown -h now at the prompt.


    This tells Linux to halt the operating system now rather than later.


    ![](img/96a9ce6a13d8d15ed05f867f41574278_141_0.png)


    shutdown is a command to Linux. Some commands have options, or flags, that provide
    additional information about what the command should do. -h means to halt the
    system, rather than reboot, after it shuts down. -r means to start rebooting after
    shutdown. now means to start the process of shutting down immediately. Without
    the now, the shutdown command would hesitate and send warning messages to people
    still working on the system, telling them that the system is about to be turned
    off.'
  merge: -1
  img_proc: true
- pgno: 142
  md: '# Chapter 6: Solving Problems with the X Window System Installation


    One other method of rebooting the system is the infamous three-finger salute that
    all Microsoft users know: Ctrl+Alt+Delete. The three-finger salute simply sends
    a shutdown -r now command to Linux, and the result is the same as if you had typed
    this command.


    As a Linux user, rebooting the system should be an infrequent occurrence. Because
    the login procedure provides a Linux system with the necessary security, you don''t
    need to shut it down between sessions. Linux is stable, so it does not freeze
    out, as do other PC-based operating systems. If you have multiple operating systems
    on the same machine, however, rebooting will take you back to the LILO prompt
    (or the System Commander, or some other booting program) to allow you to boot
    another operating system.


    # What Went Wrong?


    If you are still not able to get it working, here are a few things that you may
    want to consider:


    +   - Find out more detailed information about your video card using DOS or Windows
    95 (if available), as described in Chapter 3.

    - Find a newer version of XFree86 code at www.xfree86.org.

    - Join the SuSE mailing list and post your question. To join the mailing list,
    go to www.suse.com, find the link for mailing lists, and follow the instructions.

    - Find a seasoned Linux person to help you.

    - Buy a system (a computer with Linux preinstalled).

    - Join a local Linux users group.

    - Take a cruise to Fiji, where at the University of the South Pacific they have
    a really good computer science department in which everyone Linux. (Hi, folks!)


    If you try these solutions and still do not have X Window System running, look
    around for a Linux users'' group at a local college or high school. Perhaps a
    group of computer professionals in your area may help. If you call local computer
    science department, they probably can help you find a student or staff member
    who uses Linux, and has installed it on several types of machines, and can help
    you figure out why your graphics system is not working or get a newer version
    of XFree86 that might support your video card.


    If you feel strange to ask these people to help you, remember that they were once
    new to Linux, too, and probably had to struggle through an even more difficult
    installation. When you do go, remember to take all the accumulated information
    about your system that you have detected. It will save both them and you time
    and energy.'
  merge: -1
  img_proc: true
