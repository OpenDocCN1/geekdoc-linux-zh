- pgno: 180
  md: '# Chapter 9


    # Working with Editors


    In This Chapter


    +   * Working with editors

    * Formatting text


    Every one who writes Linux books needs a good editor. But the kinds of editors
    we talk about in this chapter are text editors, not the tweedy, frazzled, publishing
    professionals who struggle mightily with books. Text editors with text files give
    you the ability to add, delete, search, and move text—everything from thousands
    of lines of text down to a single character.


    Nowadays, text files are updated with word processors, but every once in a while,
    you may have to go in and update a file with a text editor. In addition, text
    editors create small, compact files of characters, which are still the cheapest
    way to send e-mail and store character data on disk.


    Take the time to play around with these editors, getting down the basics, because
    they may be the only thing available. Also, the ed text editor is small enough
    to fit on a recovery disk, which is used to boot when all else fail. (Other editors,
    such as emacs and word processors, are too big to fit on a recovery floppy.)


    # Text Editor Basics


    A text editor is an essential tool for Linux. It enables you to create and modify
    an array of text files, including the following:


    +   * User files, such as the login file

    * System configuration files, such as /etc/fstab, /etc/inittab, and /etc/lilo.conf

    * C and C++ programs

    * Shell programs

    * Mail messages'
  merge: -1
  img_proc: true
- pgno: 181
  md: '# 154 Part III: Using Linux


    Linux comes with one but two text editors: ed and vi. The ed is a line-oriented
    text editor. It was one of the first editors for UNIX systems and traditionally
    is included with every UNIX and Linux system. It is also a small editor that can
    be included on small distributions of UNIX and Linux. You can always count on
    ed to be. The second editor included with Linux is vi. This full-screen editor
    also supports the command set of a line-oriented editor named ex. A third text
    editor for Linux is emacs; some people prefer this for most of their work.


    ![](img/96a9ce6a13d8d15ed05f867f41574278_181_0.png)


    In Linux, ed and vi are emulated by another editor named vim. The commands for
    vi work just fine with vim. In addition, vim has more capability than vi. Therefore,
    a separate program is not supplied with Linux systems. When you type vi, you are
    really using vim, but this is invisible to you.


    Although all three editors have different interfaces and capabilities, they all
    support the following standard features: reading and writing files, searching,
    inserting and deleting, and copying and moving text.


    ![](img/96a9ce6a13d8d15ed05f867f41574278_181_1.png)


    We can''t detail all the options editors offer. Before you get involved in some
    monstrous editing project, read the manual page for the editor you have. You may
    be surprised to find some handy shortcuts. Assuming you installed the manual pages
    on your Linux system, you can find the manual page on the editor by typing the
    following at a command prompt:


    ```

    man editorname

    ```


    where editorname is ed, vi, vim, or emacs.


    # Two for one


    Most editors use control keys or meta keys, which are indicated by Ctrl+ or Meta+,
    respectively in this book and sometimes shortened to C+ and M+. The Ctrl key is
    usually marked on your keyboard, but the Meta key may be hiding under an alias,
    such as the Alt key.


    When you see Ctrl-Z, for example, press and hold down the Ctrl key while pressing
    the Z key. (Don''t press Ctrl+Shift-Z). Likewise, Meta-H means to hold down the
    Meta key (in most cases, Alt) and press the H key. This is really much easier
    than rubbing your thumb and patting your head at the same time.


    ![](img/96a9ce6a13d8d15ed05f867f41574278_181_2.png)


    Most UNIX books show meta keys without the + sign. For example, Ctrl+Z in this
    book (and Microsoft books) becomes Ctrl, ctl-z, or ^Z. Another frequent occurrence
    in UNIX texts is ^d as the symbol for ending a file, which is the same as pressing
    the Ctrl key and the D key at the same time.'
  merge: -1
  img_proc: true
- pgno: 182
  md: '# Chapter 9: Working with Editors


    # 15


    # Saving yourself


    When you work with the text of a file, the text is kept in a buffer (a place in
    memory), and no changes are made to the file until you save and exit. My advice
    is to save your text early and often. Although Linux systems are stable, it would
    be just your luck to have a power failure after you''ve spent five hours typing
    a large, unsaved text file.


    Saving your file is particularly useful when you are going to execute some large,
    complex command that will transform your text file dramatically. Most editors
    have an undo command that backs out the last one or two (or) commands and text
    you have given the text editor. Writing the buffer to disk, however, is foolproof.


    When you make a mistake and you want the file back the it was when you did the
    last, must quit — rather than exit — the editor. Quitting usually means leaving
    the editor without doing one last save of the file. Exiting usually means saving
    changes that exist in the buffer and leaving the editor. Most editors have both
    functions.


    Some editors have autosave, which is a nice feature for people who are forgot
    about saving their files. Autosave counts how many commands or changes you make
    to a file, and then automatically saves the buffer to the file after a certain
    number of changes. We, however, don''t like autosave. For one, the autosave feature
    causes some editors to freeze during autosaving, and we find this annoying. Two,
    autosave can happen at the worst time. For example, if you execute a complex command
    that erases your buffer and then autosave kicks in, the undo command may be unable
    to undo that command.


    If you use autosave, we recommend that you consciously save a manu-ally (which
    resets the autosave counter) right before you do a complex command. Then you can
    recover the file if necessary by quitting the editor without saving the buffer,
    getting back to the command prompt, and restarting the editor on the file again.


    # Here''s vi


    The vi editor on your Linux system is really the vim editor, but you can invoke
    it by using vi because a symbolic link exists between vi and vim.


    Like the ed editor, the vi editor has two modes of operation and the same type
    of single-letter commands. To start vi, you type vi at the command line. The screen
    clears displays tild (~). You are looking at an empty, unnamed buffer in memory,
    into which you can enter text until you save the text to a named file.'
  merge: -1
  img_proc: true
- pgno: 183
  md: '# 156 Part III: Using Linux


    You can start the vi editor in a number of ways with different options, but the
    most common way is to start vi with only a filename as the argument, like this:


    ```

    vi tove.and.linux

    ```


    tove.and.linux is the name of either an existing file that you want to edit or
    a new file you want to create.


    The vi editor has three modes of operation:


    +   - Visual command mode

    - Colon command mode

    - Text mode


    When you invoke vi with a filename, the editor appears. At the bottom-left corner
    is the following line:


    ```

    "filename" [New File]

    ```


    This status line tells you what the editor is doing. In this case, the editor
    has opened a buffer and the save and quit option saves the contents of the buffer
    to the filename file. If you indeed invoke vi with the following command:


    ```

    vi tove.and.linux

    ```


    the bottom-left corner would display the following line:


    ```

    "tove.and.linux" [New File]

    ```


    When you first invoke vi, you are in visual command mode, which is the default.
    You can use four special commands to either locate text or transition to more
    complex commands:


    +   - Forward search

    - Backward search

    - Continue the search in whichever you are currently going

    - ex command (is the line editor included in vi)


    In command mode, the characters you type are used as commands, not as input into
    the file. To use commands, type the character on the command line. For the first
    two search commands (/ and ? the cursor moves to the bottom of the screen, where
    you then type the string you are searching for. When you press Enter, the search
    begins. If you want to search for an additional string, you can just press N to
    reexecute the search.'
  merge: -1
  img_proc: true
- pgno: 184
  md: '# Chapter 9: Working with Editors 157


    When you type the : command, the cursor moves to the bottom of the screen and
    waits for you to enter a command or a command string. You must press the Enter
    key to execute the command.


    Given that characters you type are interpreted as commands in command mode, how
    do you get from command mode to text mode? Simple. Enter a command to do something
    in text mode and vi will take you there. Here are some commands that can be used
    to illustrate how to switch from command mode to text mode:


    +   - Insert text before the cursor

    - Insert text after the cursor

    - Insert text at the beginning of the current line

    - Insert text at the end of the current line


    As soon as you type any of these commands, you are placed in text input mode.
    Do not press Enter after entering the command. Any text you type after invoke
    the command is placed in a buffer and echoed to the screen.


    You may be asking yourself (because the directions are skimpy or there is no one
    to ask), "How do I get out of text mode and back to command mode?" Again the answer
    is simple. If you want out, just press the Escape (Esc) key and you''re immediately
    whisked back to command mode. That''s pretty easy, isn''t it?


    If you don''t know whether you are in command mode, just press Esc a few times.


    ![](img/96a9ce6a13d8d15ed05f867f41574278_184_0.png)


    # Moving around in a file


    Now that you know how to open a file in vi, the commands in Table 9-1 move the
    cursor around. First, make sure you are in command mode; otherwise these keys
    are just placed in your file like any other data.


    | Table 9-1 | Moving Around in vi |

    | Command | What It Does |

    | j | Move one line down |

    | k | Move one line up |

    | h | Move one character to the left |


    (continued)'
