    # Other Controllers (Multoint)


    Some cards are used to increase the number of serial lines that a PC-style

    system can support above the one or two serial/parallel lines that come with

    ite. These cards are intelligent or nonintelligent, depending on whether they
    or

    the main CPU buffer characters into the system and handle sending

    stop and start signals to the devices. Intelligent cards can cut down on every

    verhead of thousands of characters into the system every

    second by taking a load off the main CPU. Nonintelligent cards also use

    an IRQ for every port, which can use a lot of the system''s resources for

    little gain. Try to get a card that is intelligent and uses only one IRQ.


