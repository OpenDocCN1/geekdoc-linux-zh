    mode. You may or may not have all the information needed to configure X Window
    System. A final chance to gather information is to run the SuperProbe program,
    which is in the Linux For Dummies CD-ROM. SuperProbe was installed on your computer
    during the installation.


    You may be yourself why we didn''t run SuperProbe off the bat. Well, SuperProbe
    is a great program, but it''s not perfect. It may hang your system, causing you
    to reboot. It may not give you all the information you need. It can even be fooled
    from time to time. It is, however, a extra tool.'
