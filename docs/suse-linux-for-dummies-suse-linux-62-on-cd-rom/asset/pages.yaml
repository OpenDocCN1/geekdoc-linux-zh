  img_proc: true
- pgno: 185
  md: '# Table 9-1 (continued)


    | Command | What It Does |

    | --- | --- |

    | l | Move one character to the right |

    | Ctrl+f | Scroll down a full screen |

    | Ctrl+b | Scroll up a full screen |


    If you want to go to a specific line number, you use a colon command. Type a colon
    (:) and it appears at the bottom of the screen; then type the line number where
    you want to be. For example:


    :12


    Press Enter, and the cursor moves to the beginning of line 12.


    # Deleting and moving text


    Now that you know how to enter text in vi, we show you how to work with that text.
    In this section, you delete and move your text.


    The vi editor has several commands for deleting. You can delete characters, words,
    or lines. The command for deleting a word is dw; this deletes the word to the
    right of the cursor. More words can be deleted at once by prefacing the dw command
    with the number of words you deleted from the cursor position. For example, the
    command 6dw deletes the next six words following the cursor. Table 9-2 lists additional
    deletion commands.


    # Table 9-2 Deleting in vi


    | Command | What It Does |

    | --- | --- |

    | d | Deletes up to the end of the current line |

    | dd | Deletes the current line |

    | x | Deletes the character under the cursor (4x, 5x, and so on) |


    ![](img/96a9ce6a13d8d15ed05f867f41574278_185_0.png)


    A handy command to remember is u. It''s the undo command, and edits may be undone
    immediately with it, in the unlikely event that you make a mistake.'
