    Congratulations! SuSE Linux is now on your system and raring to go. It sits in
    front of you, waiting for you to start using it. But before you find out how to
    use Linux for work — or play — you have to make an account for yourself, which
    will be the place for you to log on and do whatever heart desires.


    Linux is a multiuser system (unlike Microsoft Windows 3.1, 95, 98, or NT), so
    you — every other user — need an individual name and password to protect your
    information and keep your tasks separate from other people''s tasks. You find
    out how to create user accounts in this chapter, too.


    Names and passwords in Linux have one other advantage over those in Windows 3.1,
    95, and 98 systems. Linux has a rich file permissions strategy that keeps either
    you or others from erasing and replacing system files. This strategy is important
    both in a networked environment and even when a system is sitting idle at a desk.


    # Giving Linux the Boot


    Are you ready to boot SuSE Linux? Here goes:


    +   1. Make sure everything is turned off.

    2. Turn on all peripheral devices, such as a printer and scanner.

    3. Turn on the power to the monitor (if it''s separate from the main system box).'
