  md: '# # Introduction


    This thesis is an introduction to the portability issues of the Linux kernel.
    It is not only meant to be my Masters thesis, I hope it will actually be useful
    for people who want to port Linux to other architectures, or for people who just
    want to know the design issues and goals of Linux on different platforms (as opposed
    to the more general goals of Linux in general).


    In an attempt to make this practical, I try to explain the general issues, usually
    followed by a comment on one or more specific ports with some pointers on what
    is implemented in practice¹.


    Note that the term “Linux” is often used to denote the whole system that is built
    up from the basic kernel and all the system and user applications that are usually
    running on top of the kernel, in the context of this thesis only the kernel itself
    is considered. The portability of system and user applications is here considered
    a totally different issue, even though there are obviously some common concerns.


    Also, you should not expect this to be a line-by-line (or very low-level) explanation
    of the kernel — rather the opposite. Instead of trying to explain what all the
    specific functions do, this paper tries to explain the basic ideas, and the specific
    examples should be seen as just clarifying how Linux works on some specific hardware
    in software case.


    The thesis generally follows a common format: each section first explains the
    generic problems and potential solutions, to then be followed by an “Implementation”
    section that gives Linux-specific implementation details. The reader should be
    able to follow the text with little or no knowledge of Linux itself, although
    a general knowledge of the issues is is obviously expected.


    # # History of Linux portability


    People who have followed Linux from the very beginning may find the title of this
    paper, “Linux: a Portable Operating System”, a rather ironic statement. Being
    portable was not what Linux was initially; the early versions of Linux were extremely
    unstable.


    > ¹For the same reason this paper will also be available in an electronic version
    which I will try to keep up-to-date as people send comments or changes to the
    system occur. Linux is by no means a static system, and some of the issues, especially
    when it comes to multiple CPU’s, are so young that major changes can still happen.'
  merge: -1
