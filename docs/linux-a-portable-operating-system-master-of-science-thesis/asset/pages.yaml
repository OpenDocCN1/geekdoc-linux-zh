- img_proc: true
  md: '# 5 Example Architectures


    While Linux currently supports seven architectures to some degree or other (Digital
    Alpha, 80x86, Motorola 68k, MIPS, PowerPC, Sparc, Acorn ARM), three of those architectures
    stand out by having a fundamental impact on Linux portability.


    The original Intel platform was obviously the base of any Linux work: it offers
    cheap and ubiquitous hardware and is by far the most popular Linux platform and
    the one most development is done on.


    At the same time, the Digital Alpha platform stands out as a modern 64-bit hardware
    base, and being the first target of a Linux port. Together with the Sparc architecture,
    these two architectures have defined most of the Linux portability so far.


    # 5.1 The Alpha


    The Digital Alpha architecture is one of the most recent RISC designs in the industry,
    and thanks to extensive support from Digital Corporation, was the first non-Intel
    architecture supported popularly by Linux.


    What makes the Alpha such an intriguing platform for Linux is not only the high
    performance of Alpha-based computers, but also the fact that an Alpha port was
    the ideal second platform from a portability standpoint. Not only is the Alpha
    architecture fully 64-bit both from an arithmetic and a memory standpoint, it
    is a very aggressive RISC architecture that looks very different from the original
    platform for Linux, the Intel x86 [Dig94].


    What made the Alpha an even better portant target was the fact that while having
    a markedly different CPU architecture, Digital was one of the first to embrace
    PCI as the standard for the I/O bus hardware for non-PC markets. As a result the
    initial project did not have overly concern with device driver issues, allowing
    the project to concentrate on the design of the CPU architecture itself.


    The Linux/Alpha portant project actually started out as two separate and independent
    projects: one pilot project inside Digital itself to prove that Linux could run
    on Alpha hardware, while at the same time the author was given access to Digital
    Alpha machines for another port.


    While early portant effort inside Digital was concerned with making Linux run
    on the Alpha (somewhat akin to the original Motorola 68k Linux project), work'
  merge: -1
  pgno: 49
- img_proc: true
  md: 'at the Department of Computer Science of the University of Helsinki concentrated
    on creating the basis of a truly portable operating system. As such, the Digital
    project was working on a 32-bit port on the assumption that it would be easier,
    while the author worked on making Linux port cleanly to a 64-bit architecture
    and take full advantage of the hardware provided.


    As it turned out, the 32-bit Linux/Alpha port was bootable at an earlier date,
    and the portable 64-bit kernel rewrite was not much behind and quickly proved
    itself to be more versatile. The Digital efforts have not stopped, they have abandoned
    the 32-bit pilot project and are now working on making Linux available on different
    Alpha hardware and providing the required environment for the kernel. SMP effort
    is also underway to take advantage of multiprocessing capabilities of the Alpha.


    The main changes introduced by the Alpha port to Linux have been


    +   - Re-organization of the kernel into architecture-independent and architecture-specific
    parts. While the original kernel had inline assembly statements embedded in the
    sources, portability required a clean and well-defined interface for code needed
    to access specific hardware features.


    +   - Virtual memory management re-write. The wider address space required a deeper
    kernel page table tree, together with generic portability concerns resulted in
    the current memory management implementation.


    +   - Kernel type cleanliness. The wider data types required major cleaning up
    of the kernel internal data structures. While the original Linux kernel had worked
    with the C types “int” and “long” interchangeably and used both for them 32-bit
    values, the Alpha required a clean separation of the different data types used
    in the kernel.


    +   - Strict alignment of kernel data structures.


    In addition, the Alpha port also exposed some uncomfortable assumptions in the
    kernel itself. For example, the Linux kernel originally assumed that byte accesses
    were atomic, and in some cases used values for flagging asynchronous events. On
    the Alpha, the smallest atomic update is to a 32-bit word, and all byte accesses
    are done with multiple instructions. As a result, code that depended on atomic
    updates broke subtly.


    There were other subtle issues involved with the Linux port to the Alpha. For
    example, the absence of byte accesses is not visible to the C programming level'
  merge: -1
  pgno: 50
- img_proc: true
  md: 'as the compiler will automatically generate the correct instruction sequences,
    but for performance reasons contiguous byte accesses should be shunned in favor
    of optimized 64-bit code. Rewriting some basic library functionality as optimized
    assembly made a noticeable difference in speed for some uses.


    The Linux/Alpha port also introduced the issue of native binary compatibility
    with another operating system. Being binary compatible not only gave Linux/Alpha
    access to Digital UNIX binaries, it also sped up the system bootstrap process
    by being able to test out early versions of the operating system against binaries
    that were known to.


    The issues of different data sizes on the Alpha due to the 64-bit architecture,
    together with the binary compatibility requirements, made it important that the
    kernel interfaces were able to handle different type sizes transparently. One
    obvious example of this was the kernel access to user data.


    Before the Linux/Alpha port, writing a data item to user mode was done with the
    functions `put_fs_byte`, `put_fs_word()` and `put_fs_long()` — for 8, 16 and 32-bit
    entities respectively. This mapped well to the original data types. The strange
    naming of these functions come from the use of the `fs` segment register on the
    Intel platform to access user mode.


    On the Alpha, this obviously did not work very well. Not only was the naming non-intuitive
    on the Alpha as there is no `fs` segment register, but a data type that was 16
    or 32-bit on the Intel platform might be 32 or 64-bit on an Alpha. As such, the
    whole concept of fixed size data had to be scrapped, and the interface to access
    user mode was renamed as just `put_user()`. This macro automatically determines
    the right data size at compile time and uses the appropriate method for the access.
    These kinds of changes made it possible to use the appropriate types on different
    systems without having to worry about the actual access happens.


    Linux/Alpha, being one of the older ports of Linux, is a very stable platform,
    and is used widely in various environments that need superior floating point performance
    or access to 64-bit hardware. The port has been entirely merged with the standard
    Linux sources.


    # 5.2 The Sparc line of computers


    While the Alpha architecture lay the groundwork for Linux kernel portability,
    what cemented it down the port to the Sparc line of computers led by David Miller.'
  merge: -1
  pgno: 51
- img_proc: true
  md: 'Two things make the Sparc architecture so interesting in this context. First,
    the hardware is readily available: especially older Sparc hardware can generally
    be found in various dark corners of any university. In that sense the availability
    of hardware was to some degree similar to the availability of standard PC hardware.


    The other thing that makes the Sparc an interesting platform is that the Sparc
    architecture is one of the oldest RISC architectures, and has gone through several
    generations at the hands of several different manufacturers. And while the different
    versions of the architecture look similar to user mode programs, the differences
    on a system programming level are startling. As the Sparc port in one sense contained
    several ''micro-ports'', and brought up many issues that had not been problematic
    on the previous two architectures [SPA94a, SPA94b, Ros93].


    The Sparc, together with the Motorola 680x port, also introduced a different order
    for Linux. While both the Intel 8086 and the Digital Alpha architectures are little-endian,
    and the m68k is big-endian. Also, not only different versions of Sparc CPU''s
    used different virtual memory management techniques, they have also used virtual
    and physical caches or mixtures of both.


    While this wild variety makes ports difficult, it also makes the Sparc an excellent
    testing environment for the kernel virtual machine. The fact that the Linux/Sparc
    port not only worked, but actually was very successful is indeed a good indication
    that the Linux virtual machine is generic enough to handle any reasonable hardware
    implementation.


    The biggest changes introduced by the Sparc port to Linux were in memory management
    and byte order. The byte order changes were mostly related to file system code
    — notably the ext2 file system and the MS-DOS file system. The memory management
    changes were mainly caused by performance and cache invalidation issues. But the
    Intel 80x86 platform and the Alpha handle data cache coherency issues in hardware,
    making the Sparc port to tackle this issue in software.


    Also, while the virtual machine three-level pages turned out to be a very good
    design, performance issues required that the page table TLB invalidation be made
    much more granular for the Sparc. The original Linux invalidated the whole TLB
    whenever any invalidation was needed, and that was later extended to invalidate
    single page translations in some circumstances. However, on the Sparc this two-level
    granularity is inadequate.'
  merge: -1
  pgno: 52
- img_proc: true
  md: 'The reason for needing finer granularity invalidates on the Sparc is the size
    and complexity of the TLB. On the Intel 80x86 and the Alpha, the TLB consists
    of only the on-chip TLB that can easily and quickly be invalidated and quickly
    re-filled. As such, while some care is needed, TLB invalidation is generally not
    much of a performance issue on these architectures. In contrast, on some Sparc
    hardware the CPU uses a hash table in memory to expand the on-chip TLB, and invalidating
    this is a much more costly operation.


    As a result, an in-memory TLB extension on the Sparc and the PowerPC requires
    much finer granularity control over TLB invalidates. The in-memory TLB is much
    larger — thousands or millions of entries as compared to a on-chip TLB of hundreds
    of entries at the most.


    Similar granularity concerns the cache coherency code, resulting in the following
    interfaces for flushing caches and TLB entries:


    ```

    flush_cache_all(), flush_tlb_all(): flush all entries under exceptional circum-stances
    (at boot-up and when the kernel mapping changes itself).

    ```


    ```

    flush_cache_mm(), flush_tlb_mm(): flush a whole process and TLB when the process
    undergoes radical change like executing a new binary image.

    ```


    ```

    flush_cache_range(), flush_tlb_range(): flush a range of pages in a process, for
    use when part of the process map changes due to a new mapping.

    ```


    ```

    flush_cache_page(), flush_tlb_page(): flush a single page.

    ```


    On hardware where cache coherency is handled by hardware, the cache flush operations
    will be no-ops and will be removed by the compiler. Similarly, on most CPU''s
    with an on-chip TLB, the TLB range invalidate generally will invalidate the whole
    process TLB — the more complex partial invalidation simply is needed (nor supported
    by the hardware).


    The Linux/Sparc is now, like the Alpha port, one of the most stable platforms
    for Linux, and is used in real world situations¹²²


    > ¹²As of November 1996 of the Linux specific list tree has been handled by a
    Sparc sun4m machine running Linux at vger.rutgers.edu.'
  merge: -1
