  md: '# 2 Linux — the Design and Implementation


    Unlike most modern research operating systems, the Linux approach to operating
    systems is very pragmatic, and rather than concentrating on the *design* of a
    new kernel the focal point has been on a solid and efficient *implementation*.
    Instead of throwing away proven concepts they have been refined in new ways. [Tor93]


    The Linux design is based on three main design issues that have directly influenced
    the implementation. The main issues are:


    +   - Simplicity. The obviousness of this sometimes means that it is overlooked,
    but an operating system kernel is a complex entity that has been to work in an
    uncontrolled and potentially even hostile environment. Programming errors in the
    operating system are much less acceptable than in normal programs, and the security
    issues are paramount. A complex design is harder to verify against either errors
    or security issues, so simplicity of the basic services is required.


    +   - Efficiency. The kernel is involved with almost all activity in the machine,
    and as such the kernel must be efficient enough to *never* be seen as a performance
    constraint.


    +   - Compatibility. While the basic operations of a kernel are of supreme interest
    to researchers in the operating system area, most people do not want to know what
    is going on as long as their programs work. As such, one of the most important
    features of an operating system is the lack of surprises it offers to the user,
    be a normal end-user or a programmer. Even new features should be offered as a
    *superset*, rather than *instead* of functionality that the user is accustomed
    to.


    These design issues, coupled with a very pragmatic approach to programming, has
    led to a system that shares features of both the traditional monolithic design
    and sign of the new research projects into modern microkernels. The microkernel
    design itself was discarded due to doubts about the efficiency and simplicity
    of the approach, but during the development many of the features usually associated
    with microkernels have been implemented on top of a more traditional monolithic
    kernel.


    The design has also been strongly influenced by the general availability of Linux
    source code to anybody with access to the Internet. That has not only led to a
    very'
  merge: -1
  pgno: 10
- img_proc: true
  md: 'dynamic development community that is physically spread all over the world,
    it has also directly impacted the design itself.


    Rather than concentrate on a concept of a kernel binary that interfaces to the
    rest of the world (be it hardware or software), the Linux approach has been to
    have sources available that can be used to create the binary we. This approach
    allows the interfaces to be specified at compile time rather than at run-time.


    The more traditional link-time and run-time interfaces are naturally also available,
    and give access to more dynamic feature sets. By using run-time dynamic linking
    of modules into the kernel, the user can add and remove features as needed, but
    the availability of sources always adds the possibility of increased performance
    by specifying the configuration at compile time and letting the compiler handle
    interfacing issues.


    # 2.1 The design — compatibility


    The three main design issues — simplicity, efficiency and compatibility — have
    naturally formed the basis for the kernel implementation. The compatibility issue
    defines the external shape of the system while the issues of simplicity and efficiency
    define the internal implementation of it.


    The wish to be compatible with other UNIX-operating systems more or less defines
    the kernel interface that is exported to system and user applications. Note that
    compatibility extends to outside the machine itself: not only does the compatibility
    issue require the programming and user interface to the kernel, but also involves
    the integration of the system with other external requirements. These requirements
    include following standard protocols on external networks, but also being able
    to live together on the same machine with other operating systems. This can involve
    supporting a common disk partitioning, or a particular boot-up sequence.


    As being compatible clearly restricts the external interfaces of the system, many
    new operating system projects choose to be less compatible in order to be able
    to fully express the wishes of the designer. Instead of being constrained by what
    others have done, such a project can soar to new heights of design beauty, at
    least in the eyes of the designer.


    Sadly, those projects invariably tend to fail in real life, getting only a niche
    market (if that) due to their lack of common applications or interfaces. As mentioned'
  merge: -1
  pgno: 11
