  md: 'compile-time rather than at run-time, and will as such not impact performance
    adversely.


    As it is a monolithic kernel, there are no external entities and fixed protocols
    that have to be taken into account, so the compiler is free to optimize away operations
    that are not needed on specific architectures. More specifically, because nothing
    else depends on the internal data structures those structures can be tailored
    to a source level to match the user or hardware requirements as closely as necessary.


    The Linux kernel virtual machine is implemented through the creation of architecture-specific
    header files and a common API between the generic kernel code and the architecture-specific
    files. These header files create the image of the virtual machine that code runs
    on.


    The virtual machine header files define the machine using the C language preprocessor
    (#def directives) and by using various types and inline functions to implement
    the virtual machine on top of the physical hardware. While inline functions are
    not of standard C, they are implemented by most compilers, and the support for
    them by the normal Linux C (GNU C compiler, also known as "gcc") is extensive.
    As the GNU compiler is itself very portable, the use of C extensions is not a
    problem.


    The use of gcc also allows the architecture header files to use inline assembly
    routines to implement code that cannot be expressed efficiently with portable
    C. This, together with inline functions, allows the compiler to map the virtual
    machine semantics on top of any specific hardware, and means that the virtual
    machine abstraction results in little or no loss.


    In addition to the architecture-specific header files, each architecture has its
    own subdirectories in the arch directory in the system sources. This directory
    contains the kernel sources for rules to build for each architecture; what files
    to use, what special options the compiler needs for this architecture and so on.
    This approach allows a maximum of flexibility with regard to architecture-specific
    code, and does not impose any restrictions on what the code does.


    Even in the architecture-specific parts of the kernel, common concerns have resulted
    in a basic layout of the architecture-specific kernel sources. Most architectures
    tend to have the subdirectories containing kernel functionality (e.g., system
