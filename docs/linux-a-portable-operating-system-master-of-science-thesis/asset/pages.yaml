    memory management efficient is thus of primary importance: not only do the routines
    have to be fast, they have to be clever too, sharing physical pages aggressively
    in order to get the most out of a system.


    +   The memory management code is also fraught with race conditions and deadlocks,
    and trying to share as much of the complex memory management routines as possible
    would be a good thing in order not have to maintain multiple separate copies of
    this complexity.'
