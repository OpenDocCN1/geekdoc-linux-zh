    Alpha port, but on a more general scale. As a result, other porting efforts are
    much easier, and the original Linux/68k project has updated its base to the new
    portable layout and an integration of that work is in progress [Law97].


    In addition to the Alpha and 68k ports, the port to the Sparc architecture has
