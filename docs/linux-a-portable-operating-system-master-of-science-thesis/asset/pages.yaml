  md: 'to standards generally make it easy to port programs that have been written
    with the standards in mind, but Linux goes further than that.


    Now, being a superset of what people should expect in theory should be simple.
    Sadly, that is not the case. The main problem is that the basic UNIX operations
    are similar, the difference in details can often result in two systems doing the
    same thing in different and contradictory ways.


    For example, while the standard interface for reading the contents of a directory
    is through the readdir() interface on a C library level, the actual implementation
    of that interface at a lower level can be very different on different UNIX operating
    systems. Obviously the act of reading the directory contents has to be handled
    all of those different interfaces.


    Considering at the same time that the current default Linux sources contain no
    that 17 (!) different file systems, the duplication of code would be horrendous
    if all these file systems had to know about all the possible interfaces to read
    a directory. The directory contents has to be handled with a virtual interface
    that can do the appropriate translations for all the different systems.


    Another problem in compatibility is the different layouts of data structures and
    the different sizes of various operating system types that different UNIX operating
    systems support. This indicates that the basic kernel routines should be typeindependent,
    in order to be able to handle different layouts. While this typing can be done
    at compile time (allowing for optimal code to be produced for the primary personality),
    the sources should still be able to accommodate any type layout without becoming
    a mess of conditional compilation.


    Finally, the issue of various environment constants has to be handled. Error numbers
    change from system to system, as do the command numbers used by various system
    calls (notably ioctl() and fcntl()). All this has to be cleanly separated into
    architecture-specific header files that allow the kernel to share the basic sources
    yet differ in details.'
