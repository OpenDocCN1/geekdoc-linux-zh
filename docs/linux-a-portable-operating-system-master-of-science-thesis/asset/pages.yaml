  md: 'The problem with abstraction layers is that they add overhead when concepts
    have to be translated from layer to layer. This has generally been one reason
    hardware-abstraction layers have been shunned: they add extra processing that
    could be avoided by programming directly on the bare hardware or software interface.
    This has to be taken into account, especially as one of the goals of Linux in
    the first place was to be efficient.'
