  md: 'Another issue that is sometimes faced the existence of multiple standards on
    the same platform, with subtly different^4 and possibly even contradictory requirements.
    While this is fortunately rare, it may be one of the primary concerns for the
    system designers.


    The issue of multiple interfaces to the operating system is usually handled by
    so-called OS personalities. one personality handles the interfacing issues of
    one interface standard, and all personalities share the same common operating
    system routines.


    In one sense, the concept of OS personality is very similar to the issue of portability
    to the hardware and the virtual machine abstraction can be used to handle the
    case of multiple interfaces. The idealized kernel does not directly implement
    any of the interfaces, and the software portability is then a matter of mapping
    the wanted user interface on top of the idealized kernel image.


    One large difference between OS personalities and hardware platforms is generally
    the kernel only runs on one physical platform at a time, yet it potentially has
    to handle multiple personalities concurrently. Microkernel operating systems generally
    handle this by the addition of a personality server for each personality (see
    Figure 4).


    In this kind of personality server approach, the overhead of such personality
    handling is quite high, though, and is one of the primary reasons for work on
    migrating threads (see for example [FL94]) and moving system services into the
    kernel address space (see [LHHL93]). More importantly, when the concept of a personality
    server allows a personality-independent view of the system, most real system usage
    tends to favor one primary personality. The other personalities are mainly used
    for backwards compatibility or emulation of non-native systems.


