    machine.


    During the porting of Linux to other architectures, there have also been situations
    where a compiler error had to be fixed before work could proceed. This was true
    mainly on the Linux port to the Alpha, because the gcc port of Alpha was itself
    reasonably new when the Linux port was started.


    # 4.1.1 Different data sizes


    One of the more obvious differences between different CPU''s is the size of the
    internal data registers and the virtual address space. Thus, for example, the
    Intel 80x86 has 32-bit registers and address space, while the registers and address
    space on Alpha are 64 bits wide. This results in the standard data types in C
    being different on different architectures.


    This difference in the basic data types is often something that brought up as
    the main problem in portability. However, at least in the case of the Linux kernel
    itself, the size of the data types was mostly irrelevant, and there was much such
    nervousness about moving from a 32-bit architecture to a 64-bit architecture like
    the Alpha, it turned out not to be much of a problem in real life.


    In normal portable code, the size of the underlying hardware types generally does
    not matter. In many cases it is totally irrelevant whether a “long” in C is 32
    bits or 64, and most of the kernel code will use whatever size happens to be the
    native size for some particular machine.


    However, in some cases data size does matter, usually because the size is defined
    by some external entity — this is usually the case in file systems where the data
    layout on the physical disk has a certain machine-independent standard associated
    with it, for example. Similarly, most of the networking code depends on being
    able to work with addresses of a certain size, and hardware interfaces to device
    controllers generally have a very rigid type structure independently of the hosting
    CPU type.


    # Data sizes — implementation


    In Linux, the architecture-specific header files export a small set of specific
    types to be used when a piece of the operating system needs to use some specific
    type-size. Including the file <asm/types.h> makes the C types u8, u16 and u32
    accessible when something specifically needs a 8-, 16- or 32-bit unsigned integer.'
