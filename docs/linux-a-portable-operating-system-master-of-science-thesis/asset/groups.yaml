    # # Portability concerns


    Unlike some other software products, an operating system does not have any inherent
    reason for existing: the role of an operating system is only to be the interface
    between user who do the real work and the hardware it is to be done on. An OS
    without viable user programs is useless, and an OS that does not work with the
    hardware available is likewise pointless. The worth of an OS is measured in how
    well it supports user processes, and how well it can implement the services it
    provides on the hardware.


    As such, the kernel itself is defined by both the hardware-it runs on and the
    software it supports (Figure 1). When writing the OS and porting it to a new architecture,
    both parts of the equation should be taken into account. The person doing the
    port seldom gets to choose his or her own idealized hardware, and similarly the
    porting effort may be constrained by user level


    | User and System Software Interface |

    | The Kernel |

    | Hardware Interface: CPU and I/O |


    Figure 1: The Kernel: the Interface between user and hardware


    On the hardware side, the concerns can be roughly divided into two categories:
    the architecture of the CPU subsystem (including memory management, caches and
    optionally multiprocessing details) and the architecture of the I/O interfaces.
    On the other hand, the software side problems are generally'
