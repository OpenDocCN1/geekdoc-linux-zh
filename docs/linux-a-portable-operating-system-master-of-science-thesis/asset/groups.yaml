    However, while the introduction of separate instruction and data caches are generally
    beneficial for performance, the split caches also introduce the problem of coherency
    between the two separate caches. The issue of instruction cache coherency is a
    matter of how to keep the instruction cache up-to-date with respect to changes
    to the data it caches.


    The most obvious solution is to make sure the hardware maintains cache coherency,
    and every time memory data is changed the instruction cache contents are updated.
    This is what the original Linux platform did, and as if Linux was originally designed.


    | Bus | Data Cache | Control |

    |---|---|---|

    | Unit | Instr. Cache | and |

    | | | ALU |


    Figure 12: Harvard caches


    While hardware support for instruction cache coherency makes life simple for the
    programmer and was required for compatibility reasons on the Intel 80x86 platform,
    it is not the solution generally preferred by engineers. As a result, most other
    modern platforms do not support this kind of hardware coherency.


    The main reason for not supporting hardware instruction cache coherency is that
    the reason for split instruction and data caches in the first place is to be able
    to-couple the instruction stream logic from the data stream logic, and having
    to maintain coherency disturbs this de-coupling. In order to maintain coherency
    the instruction cache essentially has to snoop all data traffic anyway¹⁰, and
    thus incurs more complexity than necessary.


    More importantly, modern programming languages and paradigms esche the use of
    so-called self-modifying code, and as at least in theory it should never happen
    that the instruction stream is dynamically altered. The engineering standpoint
    on the issue boils down to the question whether to add complexity to support something
    that should never happen in the first place. The answer becomes self-evident.


    > ¹⁰Or, more usually, the instruction and data caches have to maintain some exclusion
    policy that guarantees that the same data cannot be in both the data and the instruction
    cache.'
  - '[PAGE 35]


    # Instruction caches under Linux


    If modern programming languages and paradigms shun self-modifying code, why is
    the issue of instruction cache coherency a problem in the first place? Why cannot
    the operating system simply ignore the issue, and just refrain from using self-modifying
    code at all?


    The reason for some form of instruction cache coherency becomes obvious after
    some thought. Even though the kernel need not modify *itself*, the kernel will
    obviously have to cause any running programs to be modified. Each time a new process
    is started and the image of the executable is loaded into the in-memory instruction
    image is modified, and some form of invalidation is required.


    As such, every time a new program is run, the operating system has to support
    a limited kind of code modifications, even though it obviously no longer a matter
    of *self-modifying code*. Similarly, each time the kernel changes the virtual
    mapping of a process it has to invalidate the old instruction caches if there
    is *any possibility* of the new mapping being tainted by old data that is no longer
    valid.


    In addition to many changes of a process, the normal way of implementing user-mode
    callbacks (*signals*, in UNIX terms) under Linux is by writing a short trampoline
    function on the stack of the process that is used for the return to kernel mode.
    While this is not the only possible implementation of user-mode callbacks, it
    is a very flexible one, and results in the kernel modifying the process instruction
    stream and thus requires the instruction cache to be made coherent with the memory
    image.


    Finally, while self-modifying code is frowned upon, no operating system should
    enforce its set of morals upon the user programs unless that enforcement is required
    by security issues. As such, self-modifying code in user space should at least
    be possible, and may require kernel support. It should be noted that the kernel
    in general cannot be expected to know when processes modify their instruction
    stream, and as such this support should not be automatic, but the user should
    have some way of requesting kernel help if the hardware does not support such
    user-level interface to support instruction cache coherency.


    However, despite all these concerns, the issue of instruction cache coherency
    is not overly problematic in the end. There are two reasons why instruction cache
    coherency can easily and efficiently be handled by software. The first reason
    is inherent in the way instruction caches work: the instruction cache never modifies
    the instruction stream. Because the instruction cache is never modified, maintain-'
  - '[PAGE 36]


    ing coherency is a simple matter of invalidating the current instruction cache
    and reading in the new modified copy. There are no conflicting write-back issues
    or any need for exclusive access to the instruction cache.


    The other reason that instruction cache coherency is reasonably simple to handle
    is the fact that the circumstances under which an instruction cache invalidates
    are needed are well-defined and easy to pinpoint. Also, while an invalidate operation
    can be costly, the circumstances under which it is needed are so rare that it
    rarely a major performance issue.


    Because the occasions where instruction cache invalidates are needed coincide
    with virtual memory management changes, the Linux kernel itself never concern
    itself with the issues of flushing the instruction cache. If the architecture
    requires special instruction flush sequences, they can be hidden in the TLB code
    itself, and as the kernel virtual machine can mostly ignore the issue.


    Similarly, the case where instruction cache flushes may be needed due to user
    callbacks can be handled within the callback code itself, as that is by nature
    architecture-specific in any case. So while the architecture-specific code needs
    to be aware of the instruction caches, they do not need to be exported to the
    virtual machine level.


    # 4.3.2 Data cache coherency


    While instruction cache coherency can be easily handled, the issues of coherency
    within the data cache itself can often be very important. While the coherency
    issues with regard to instruction caches stemmed from the fact that they were
    de-coupled from the normal data cache, the coherency issues with data caches can
    be the result of two different circumstances: multiple users of the data and cache
    aliases. In both cases the data exists in multiple places and thus data coherency
    issues arise.


    Even though the coherency issues are basically the same as with separate instruction
    caches, the matter is much more complicated by the fact that data caches are not
    static entities that do not change. As a result simple invalidate of the stale
    data is no longer acceptable — the coherency issue is complicated by the need
    to have sane semantics for the case where there are multiple writers to the same
    location.


    Additionally, while instruction caches and data caches are not supposed to overlap
    under normal circumstances, the same is by no means true when it comes to data'
  - '[PAGE 37]


    cache duplication. There are no guidelines that allow us to assume that data cache
    duplication would be an exceptional and rare occurrence, which further complicates
    the issue.


    The normal case of data cache coherency problems arises from having two sepa-rate
    entities that both access the data. If one or more of the entities cache data
    for performance reasons, the fact that the data can exist in multiple places introduces
    the problem of coherency when the data is modified.


    It should be noted that having multiple entities that access the same data does
    not necessarily imply multipcessing per se. A common concern in uni-processor
    environments is the cache coherency issues that are introduced by the use of I/O
    devices that use DMA (Direct Memory Access) to read or write the data directly
    from memory.


    While most systems support cache coherency in hardware, there are again ex-ceptions
    to the rule. The architectures that do not support hardware coherency require
    that any common data always be accessed through the main memory-system, and the
    operating system has to make sure that all caches are up-to-date and flushed to
    memory before any DMA activity occurs.


    # 4.3.3 The case against virtual data caches


    In contrast with the multiple user case, a cache alias occurs when the same location
    is found in multiple areas in the same cache, leading to the same coherency issues
    as if there were multiple entities.


    How do such cache aliases occur? A caching algorithm that places the same data
    in different locations can be considered an utterly broken caching algorithm,
    because not only it result in the aliasing problem, but can also obviously result
    in bad cache utilization if over and over again.


    While such a caching strategy with good reason be considered stupid in the extreme,
    it is something that does exist in current hardware, and as such is something
    that the kernel needs to know about. The reason for these cache aliases is generally
    a virtually indexed cache.


    One of the most basic issues in caching is how the cache is indexed, i.e. how
    the cache lookup is done. The two main cache types are virtually and physically
    indexed caches. As the names imply, the difference is whether the virtual or physical
    address of the cached data is used for cache indexing. [HP96, pp. 423]'
- md: '

    In a physically indexed cache, the cached location is looked up by the physical
    address of the memory location, and as such one physical memory address will always
    be found through the indexed index and no aliasing can occur.


    In contrast, a virtually indexed cache will use the virtual address as seen by
    the running program as the cache lookup index. This has some obvious benefits
    for CPU design: the physical address need not be computed before the cache indexing
    can take place, and cache lookups can be made faster and can happen in parallel
    with the virtual to physical address translation.


    However, the use of virtual caches directly lead to aliasing problems as different
    virtual addresses can point to the same physical memory location. As a result,
    the different virtual addresses can result in different cache locations being
    the above-mentioned aliasing problem [IKWS92].


    It should be noted that virtual indexing and the resulting aliasing is not a problem
    for instruction caches: while the aliasing may result in slightly lower utilization
    of the cache, this is also balanced by the simpler lookup, and because instruction
    caches do not modify their contents the worst effects of the aliasing problem
    in fact, virtual instruction caches can often make the issue of instruction cache
    invalidation (see 4.3.1) simpler for the operating system.


    However, in the case of data caches, the aliasing issues either require extra
    antialiasing hardware or it has to be handled by proper support by the operating
    system. As the reason for the virtual indexing in the first place was simplicity
    of hardware, it is generally left to the operating system to clean up the mess.


    The most trivial example of a dual mapping is the case when a page is available
    both in kernel space and in user space. As the kernel address space contains all
    physical memory, this happens with any user page. Happily, in only a few cases
    these mappings actually conflict in the cache.


    The reason that the double kernel-user mapping normally does not lead to aliasing
    problems is that most cases a user process gets full control of any page it uses
    and the kernel never reads or writes to that page through the kernel address.
    So the aliasing is not a problem. Care must be taken that the kernel always uses
    the virtual address for any data copies, but as is the normal mode of operation
    anyway the issue is moot (see later about memory management issues in Chapter
    6).


    Even though most common memory mappings do not result in aliasing problems, there
    are a few cases where this is not true, notably with memory mapped files. When
    a user process asks to map a file into user memory, the user-accessible page is
    usually also accessed by the kernel through the page cache that is maintained
    for the mapped file.


    As all user programs are loaded into user space as a memory mapping, this dual
    mapping of the same physical page onto multiple virtual addresses is extremely
    common. However, the overwhelming majority of all mappings are what in UNIX parlance
    is known as private mappings, i.e. the mappings are read-only mappings with regard
    to the common shared page, and if a process writes to the page, the virtual memory
    subsystem will force a trap and a new copy of the page to be allocated (so-called
    COW, copy-on-write behavior).


    With private mappings, there is still only one entity (the kernel) that can change
    the physical page associated with an aliased mapping, and UNIX memory semantics
    do not require such private mappings to be kept 100% synchronized. The aliasing
    concern still requires the kernel be the first time the kernel copy of the page
    has been read, but that is a simple matter of making sure that the copy exists
    in main memory, and not only in the kernel virtual cache.


    In short, for private mappings the data cache aliasing concerns with regard to
    cache coherency are not problematic. Because of the potential duplication of the
    same physical page in multiple locations the virtual cache should be larger than
    an equivalently physically indexed cache for the same performance [WHL93].


    What makes virtually indexed data caches really bad for UNIX (and thus Linux)
    are the semantics of shared memory mappings which allow different processes to
    map in the same physical page in multiple locations, and allow full read and write
    accesses to the page. This is mainly used for fast sharing of data between applications,
    and is used by the X server with the MIT shared memory extensions and by processes
    that want to concurrently access and change the data in memory, usually databases.


    Because processes are proposed to be able to directly access the shared memory
    without the intervention of the operating system, these shared memory mappings
    accesses are not under direct control from the OS itself. Thus the operating system
    generally cannot enforce cache coherency on these kinds of shared mappings. The
    approach normally taken by Linux is to disable cache for such pages altogether,
    which incurs a very noticeable performance overhead on using shared mappings.


    A possible approach to allow logical shared memory while avoiding disabling the
    cache is to use the page tables to serialize the access to the shared pages. The
    kernel can protect shared pages and allow only one process at a time to modify
    them. This way the kernel controls all shared resources and can make sure no aliasing
    ever happens by flushing the caches as appropriate when a new process needs to
    access the shared page. Thus the memory is not really ever physically shared,
    but the operating system makes it appear that way to user processes.


    Using the virtual memory subsystem to serialize access potentially allows distributed
    shared memory machines with this kind of software-imposed cache coherency mechanism
    (so-called shared virtual memory, [AMMR92]), the coherency overhead is huge compared
    to hardware coherency support, and performance is generally not acceptable for
    many traditional uses of shared memory (inter-thread locking, for example). In
    non-distributed systems it is generally better to disable all caching, as performance
    in that case will at least be predictable under different circumstances. For this
    reason no Linux port use page table shared memory serialization.


    In general, virtual caches for data should be avoided as far as possible. The
    problems with shared memory areas make such inherently slower to handle, however,
    while most applications do not need coherent shared memory, that do get penalized.
    Note that because cache aliases, virtual caches are also likely to incur more
    cache misses than physical caches — even without any coherency issues caused by
    writes.


    It should be noted that most architectures that have virtual caches have only
    small virtual caches close to the CPU, the latency of the address translation
    makes more of a difference. They then have larger second- or third-level caches
    that are physically indexed.


    What makes the approach of using virtual data caches even more suspect is that
    the address translation can often be hidden with judicious cache design. One approach
    used by many physically indexed caches is to have a first-level cache that is
    indexed through the lower-order bits of the virtual address that do not change
    during the virtual address translation — the page offset. This approach limits
    the size of the cache¹,, but because the index does not change during the address
    translation, the cache lookup and address translation can be done in parallel
    [HP96, p. 425].


    > ¹Maximum cache size limited to $pagesize_{CPU} \times associativity_{cache}$


    ## 4.4 Multiprocessor issues


    While multipcessing used to be the exclusive domain of supercomputing and large
    servers, advances in technology have meant that computers with more than one processor
    are becoming increasingly common. That has made these multiprocessor machines
    much more attractive to the Linux developers. At the same time, Linux itself has
    gained wider acceptance, which in turn makes Linux more attractive to people with
    very high-end multiprocessor hardware.


    As a result, Linux has during the last two years been actively developed for these
    multiprocessor machines, and the issue of “portability” has not only changed the
    underlying CPU architecture, but the possibility to run Linux on different CPU
    configurations.


    There are generally separate types of modern multipcessing environments, the decisive
    issue being how the memory bus is accessed. The memory bus is generally the main
    limit in any multipcessing environment (after the memory subsystem is the major
    design issue).


    The more common architecture is the centralized memory multiprocessor, where all
    processors share the same memory equally as in Figure 13. This is generally done
    with a common memory and I/O bus, and because all the processors have direct and
    equal access to all of the resources of the machine it is generally called SMP
    (Symmetric Multi-Processing).


    ![](img/5a9073ee2d3bb0d68f5895857e9cf9ca_41_0.png)


    While the shared bus approach is simple and thus cheap, it has the problem of
    not scaling well to a large number of CPU’s. On the same bus, the bus is quickly
    saturated and the approach generally does not scale to more than a dozen CPUs.


    ![](img/5a9073ee2d3bb0d68f5895857e9cf9ca_41_1.png)

