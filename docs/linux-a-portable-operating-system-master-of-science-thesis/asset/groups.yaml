    ## 6 Future Work


    While the portability phase of the Linux development slowly has been calming down,
    and most of the issues have been resolved, not all of them are by any means finalized.


    The basic Linux kernel has been clearly shown to be very portable, as proven by
    multiple ports to various platforms. The different platforms supported different
    CPU''s, memory interfaces and IO buses, and often have their own software binary
    standard requirements as well. All of these issues have generally been resolved
    already, and in that sense the portability effort within Linux has clearly been
    a complete success.


    However, there still exist implementation issues within the Linux kernel that
    directly impact portability concerns. These are often cross-cutting issues where
    performance requirements in other areas require new hardware interfaces and thus
    extensions to the virtual machine.


    One issue in particular is the use of the virtual memory management unit to do
    data copying in high-bandwidth applications. When memory speeds exceed the bottleneck
    for high performance computing, the use of virtual memory re-mapping can be a
    way to avoid physically copying data.


    While the current Linux memory management has proved to be an efficient and portable
    design, optimization issues like the above lead to new concerns. When is such
    an optimization worthwhile, and when should it be discarded in favor of a traditional
    physical memory copy? These issues depend not on how much of a bottleneck the
    memory copy itself is, but also on how expensive the virtual mapping change can
    be. In turn depends on the virtual memory hardware, but also on the design of
    the cache subsystem where a virtual cache can result in new cache coherency issues
    that have so far not a concern.


    Another area that needs work is the hardware abstraction of multiprocessing in
    the Linux kernel. The current SMP effort only supports the Intel x86 and the Sparc
    platforms, and further work in this area is required. What is the impact of hardware
    with no memory coherency on SMP? What is the proper locking granularity, and what
    is the impact of hardware with a larger overhead for SMP-safe locks?


    Also, while the basic design has been proven to be very portable, we expect to
    spend much of next year on low-level expansion of the ports, and getting the different
    architectures up to the same level of support that is currently offered on i386,
    Alpha and Sparc platforms. The portability work is by no means done.


    Finally, it should be noted that the portability work has in no way affected the
    original Linux/Intel version adversely. Not only is the current portable Linux
    totally compatible with the original Linux, but the porting effort has also forced
    cleaning up of the kernel code. As such the result is a cleaner kernel with much
    better abstraction of the hardware side.


    Also, good design of the virtual machine has not only avoided a negative performance
    impact — performance has actually improved. This is mainly due to other performance-related
    efforts done in parallel with the portability work, but the better abstractions
    required by portability issues have resulted in better interfaces that have been
    easier to optimize.


    The original three design goals — simplicity, efficiency, and compatibility —
    have been joined by a fourth one, portability.


