    尽管硬件基础非常不同且项目目标也不同，但这两个项目的基本方法是相似的。虽然基础内核已经添加了一些对 MPP（大规模并行处理）硬件的支持，但大部分工作是在用户空间中通过标准的并行编程接口（并行虚拟机
