    如上，不存在标准的虚拟内存映射方法。事实上，Sparc 系列 CPU 在架构的不同版本中使用了上述三种不同的映射策略。然而，尽管物理硬件存在这些根本差异，我们仍希望尽可能地使用通用代码。


