    # 4.3 Ensuring cache coherency and atomic operations


    One of the issues that the original Linux for the Intel line of computers did
    not have to concern itself with CPU cache coherency. Traditionally computers based
    on the x86 line of CPUs have always done cache coherency in hardware, and neither
    the operating system nor the programs running on the CPU have to care about cache
    consistency.


    However, the Intel CPUs are more the exception than the norm in this regard, and
    on most other architectures the operating system will have to be aware of the
    caches on the system, and make sure that coherency is maintained in software.


    # 4.3.1 Instruction cache coherency


    The simplest form of cache coherency problems arise from the common use of called
    Harvard architectures [HP96, p. 55], where the instruction and data caches are
    separate as in Figure 12.


    While a separate instruction and data cache can result in less efficient cache
    use due to imbalances in the usage patterns for caches, it also allows the chip
    designer'
- md: '

    to de-couple the instruction stream and the data stream, and thus allows for a
    simpler and more efficient implementation. Also, while a unified cache architecture
    can theoretically be more efficient in cache utilization, a Harvard style split
    cache does guarantee that the instruction cache does not completely flushed by
    data accesses (and vice versa) and as can such work as a balancing factor.


    However, while the introduction of separate instruction and data caches are generally
    beneficial for performance, the split caches also introduce the problem of coherency
    between the two separate caches. The issue of instruction cache coherency is a
    matter of how to keep the instruction cache up-to-date with respect to changes
    to the data it caches.


    The most obvious solution is to make sure the hardware maintains cache coherency,
    and every time memory data is changed the instruction cache contents are updated.
    This is what the original Linux platform did, and as if Linux was originally designed.


    | Bus | Data Cache | Control |

    |---|---|---|

    | Unit | Instr. Cache | and |

    | | | ALU |


    Figure 12: Harvard caches


    While hardware support for instruction cache coherency makes life simple for the
    programmer and was required for compatibility reasons on the Intel 80x86 platform,
    it is not the solution generally preferred by engineers. As a result, most other
    modern platforms do not support this kind of hardware coherency.


    The main reason for not supporting hardware instruction cache coherency is that
    the reason for split instruction and data caches in the first place is to be able
    to de-couple the instruction stream logic from the data stream logic, and having
    to maintain coherency disturbs this de-coupling. In order to maintain coherency
    the instruction cache essentially has to snoop all data traffic anyway¹⁰, and
    thus incurs more complexity than necessary.


    More importantly, modern programming languages and paradigms esche the use of
    so-called self-modifying code, and as at least in theory it should never happen
    that the instruction stream is dynamically altered. The engineering standpoint
    on the issue boils down to the question whether to add complexity to support something
    that should never happen in the first place. The answer becomes self-evident.


    > ¹⁰Or, more usually, the instruction and data caches have to maintain some exclusion
    policy that guarantees that the same data cannot be in both the data and the instruction
    cache.


    # Instruction caches under Linux


    If modern programming languages and paradigms shun self-modifying code, why is
    the issue of instruction cache coherency a problem in the first place? Why cannot
    the operating system simply ignore the issue, and just refrain from using self-modifying
    code at all?


    The reason for some form of instruction cache coherency becomes obvious after
    some thought. Even though the kernel need not modify *itself*, the kernel will
    obviously have to cause any running programs to be modified. Each time a new process
    is started and the image of the executable is loaded into the in-memory instruction
    image is modified, and some form of invalidation is required.


    As such, every time a new program is run, the operating system has to support
    a limited kind of code modifications, even though it obviously no longer a matter
    of *self-modifying code*. Similarly, each time the kernel changes the virtual
    mapping of a process it has to invalidate the old instruction caches if there
    is *any possibility* of the new mapping being tainted by old data that is no longer
    valid.


    In addition to many changes of a process, the normal way of implementing user-mode
    callbacks (*signals*, in UNIX terms) under Linux is by writing a short trampoline
    function on the stack of the process that is used for the return to kernel mode.
    While this is not the only possible implementation of user-mode callbacks, it
    is a very flexible one, and results in the kernel modifying the process instruction
    stream and thus requires the instruction cache to be made coherent with the memory
    image.


    Finally, while self-modifying code is frowned upon, no operating system should
    enforce its set of morals upon the user programs unless that enforcement is required
    by security issues. As such, self-modifying code in user space should at least
    be possible, and may require kernel support. It should be noted that the kernel
    in general cannot be expected to know when processes modify their instruction
    stream, and as such this support should not be automatic, but the user should
    have some way of requesting kernel help if the hardware does not support such
    user-level interface to support instruction cache coherency.


    However, despite all these concerns, the issue of instruction cache coherency
    is not overly problematic in the end. There are two reasons why instruction cache
    coherency can easily and efficiently be handled by software. The first reason
    is inherent in the way instruction caches work: the instruction cache never modifies
    the instruction stream. Because the instruction cache is never modified, maintaining
    coherency is a simple matter of invalidating the current instruction cache and
    reading in the new modified copy. There are no conflicting write-back issues or
    any need for exclusive access to the instruction cache.


    The other reason that instruction cache coherency is reasonably simple to handle
    is the fact that the circumstances under which an instruction cache invalidates
    are needed are well-defined and easy to pinpoint. Also, while an invalidate operation
    can be costly, the circumstances under which it is needed are so rare that it
    rarely a major performance issue.


    Because the occasions where instruction cache invalidates are needed coincide
    with virtual memory management changes, the Linux kernel itself never concern
    itself with the issues of flushing the instruction cache. If the architecture
    requires special instruction flush sequences, they can be hidden in the TLB code
    itself, and as the kernel virtual machine can mostly ignore the issue.


    Similarly, the case where instruction cache flushes may be needed due to user
    callbacks can be handled within the callback code itself, as that is by nature
    architecture-specific in any case. So while the architecture-specific code needs
    to be aware of the instruction caches, they do not need to be exported to the
    virtual machine level.


    ## 4.3.2 Data cache coherency


    While instruction cache coherency can be easily handled, the issues of coherency
    within the data cache itself can often be very important. While the coherency
    issues with regard to instruction caches stemmed from the fact that they were
    de-coupled from the normal data cache, the coherency issues with data caches can
    be the result of two different circumstances: multiple users of the data and cache
    aliases. In both cases the data exists in multiple places and thus data coherency
    issues arise.


    Even though the coherency issues are basically the same as with separate instruction
    caches, the matter is much more complicated by the fact that data caches are not
    static entities that do not change. As a result simple invalidate of the stale
    data is no longer acceptable — the coherency issue is complicated by the need
    to have sane semantics for the case where there are multiple writers to the same
    location.


    Additionally, while instruction caches and data caches are not supposed to overlap
    under normal circumstances, the same is by no means true when it comes to data
    cache duplication. There are no guidelines that allow us to assume that data cache
    duplication would be an exceptional and rare occurrence, which further complicates
    the issue.


    The normal case of data cache coherency problems arises from having two separate
    entities that both access the data. If one or more of the entities cache data
    for performance reasons, the fact that the data can exist in multiple places introduces
    the problem of coherency when the data is modified.


    It should be noted that having multiple entities that access the same data does
    not necessarily imply multipcessing per se. A common concern in uni-processor
    environments is the cache coherency issues that are introduced by the use of I/O
    devices that use DMA (Direct Memory Access) to read or write the data directly
    from memory.


    While most systems support cache coherency in hardware, there are again exceptions
    to the rule. The architectures that do not support hardware coherency require
    that any common data always be accessed through the main memory-system, and the
    operating system has to make sure that all caches are up-to-date and flushed to
    memory before any DMA activity occurs.


    ## 4.3.3 The case against virtual data caches


    In contrast with the multiple user case, a cache alias occurs when the same location
    is found in multiple areas in the same cache, leading to the same coherency issues
    as if there were multiple entities.


    How do such cache aliases occur? A caching algorithm that places the same data
    in different locations can be considered an utterly broken caching algorithm,
    because not only it result in the aliasing problem, but can also obviously result
    in bad cache utilization if over and over again.


    While such a caching strategy with good reason be stupid in the extreme, it is
    something that does exist in current hardware, and as such is something that the
    kernel needs to know about. The reason for these cache aliases is generally a
    virtually indexed cache.


    One of the most basic issues in caching is how the cache is indexed, i.e. how
    the cache lookup is done. The two main cache types are virtually and physically
    indexed caches. As the names imply, the difference is whether the virtual or physical
    address of the cached data is used for cache indexing.

