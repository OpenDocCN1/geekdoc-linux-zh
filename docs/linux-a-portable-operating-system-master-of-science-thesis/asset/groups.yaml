    虽然任何映射策略都是可能的，但当前的 CPU 倾向于以三种不同的方式处理虚拟内存：通过页树、哈希表或纯软件填充 TLB。但即使基本方法相似，底层细节通常也不同。


    取决于内存管理单元，页表可能包含除必要的翻译信息外的额外信息。某些架构支持脏和访问位，供系统判断用户是否写入了页面，或者该页面最近是否被访问过。其他架构则要求操作系统手动跟踪这些信息。


