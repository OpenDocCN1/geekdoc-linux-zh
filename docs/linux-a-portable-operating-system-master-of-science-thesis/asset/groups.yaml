    针对 Intel 系列电脑的原始 Linux 面的问题之一不需要担心 CPU 缓存一致性。传统上，基于 x86 系列 CPU 的计算机一直都在硬件中处理缓存一致性，操作系统和运行在
    CPU 上的程序都不需要关心缓存一致。


    然而，Intel CPU 在这方面是例外而非普通，在大多数其他架构上，操作系统必须感知系统中的缓存，并确保在软件中维护一致性。


