    ## 4 Hardware Portability Issues


    While software interface portability issues are important for any operating system,
    it is generally the hardware portability issues that most people tend to consider
    first when talking about portability. These hardware portability issues can roughly
    be divided into a few main areas.


    The first concern, and an area that is also seen in normal code outside the kernel,
    is the issue of the data representation of the CPU. Most of the CPU internal issues
    are hidden by the compiler: the programmer generally not worry about the number
    of registers of the CPU or the actual code generation. But issues often need to
    be taken into account: the byte order and alignment of values in memory and the
    width of internal registers, for example.


    Most other portability concerns are problems that generally do not impact user-level
    programs: differences in the memory management and caches in a system, and possibly
    multiprocessing details. Similarly, the differences in I/O architectures should
    never be seen by the user, but they directly impact the operating system.


    ## 4.1 Data representation portability issues


    An obvious problem with any portability issue is the CPU architecture of the hardware
    being ported to. In fact, so obvious is this problem that other problems like
    the I/O architecture are often overlooked completely.


    Much of the CPU portability is handled by using a portable language and having
    a compiler that is able to translate the code to various different architectures.
    That kind of portability is more or less required by any large project, and the
    real portability work is then in making sure that semantics are not guaranteed
    by the language will port correctly across platforms.


    With a complete enough language the compiler could handle all the issues in CPU
    portability, and porting would be a matter of recompiling everything to the new
    architecture. However, currently no such language exists that is suited for systems-level
    programming like creating an operating system.


    Linux, like most operating systems these days, is written in C, which is reasonably
    portable, while allowing a close interaction with the architecture. That close
    interaction allows the programmer to program on a very low level if required,
    but the very fact that C allows that kind of low-level programming obviously exposes
    the machine more than some other programming languages. As such, badly written
    C by no means automatically works the way you would expect on another machine.


    During the porting of Linux to other architectures, there have also been situations
    where a compiler error had to be fixed before work could proceed. This was true
    mainly on the Linux port to the Alpha, because the gcc port of Alpha was itself
    reasonably new when the Linux port was started.


    ### 4.1.1 Different data sizes


    One of the more obvious differences between different CPU''s is the size of the
    internal data registers and the virtual address space. Thus, for example, the
    Intel 80x86 has 32-bit registers and address space, while the registers and address
    space on Alpha are 64 bits wide. This results in the standard data types in C
    being different on different architectures.


    This difference in the basic data types is often something that brought up as
    the main problem in portability. However, at least in the case of the Linux kernel
    itself, the size of the data types was mostly irrelevant, and there was much such
    nervousness about moving from a 32-bit architecture to a 64-bit architecture like
    the Alpha, it turned out not to be much of a problem in real life.


    In normal portable code, the size of the underlying hardware types generally does
    not matter. In many cases it is totally irrelevant whether a “long” in C is 32
    bits or 64, and most of the kernel code will use whatever size happens to be the
    native size for some particular machine.


    However, in some cases data size does matter, usually because the size is defined
    by some external entity — this is usually the case in file systems where the data
    layout on the physical disk has a certain machine-independent standard associated
    with it, for example. Similarly, most of the networking code depends on being
    able to work with addresses of a certain size, and hardware interfaces to device
    controllers generally have a very rigid type structure independently of the hosting
    CPU type.


    ## Data sizes — implementation


    In Linux, the architecture-specific header files export a small set of specific
    types to be used when a piece of the operating system needs to use some specific
    type-size. Including the file <asm/types.h> makes the C types u8, u16 and u32
    accessible when something specifically needs a 8-, 16- or 32-bit unsigned integer.


    The corresponding signed data types (s8, s16 and s32) are also available, but
    use of them should be minimized as any object that needs to have a certain number
    of bits is generally not a normal integer.


    Due to standard C name rules, these types are only available when compiling kernel
    code. If a specific type needs to be exposed to a user-space implementation, there
    exists versions of the same types with underscores prepended to the type name
    (~u8, ~u16 etc). These are meant to be used mainly in public header files where
    the normal names for these types cannot be exposed.


    ## Unresolved issues


    While the current Linux kernel has proved to be portable to a wide variety of
    hardware, including different word sizes and endianness, the issue of data type
    portability is by no means completely handled.


    One data size problem that is often overlooked is the size of the character set.
    While an 8-bit character is currently the standard, it ignores the issues of wide
    characters used mainly in Asia. The Linux kernel sidesteps the issue by not doing
    any character translation in the kernel itself, and leaving all such issues to
    user space.


    As far as the kernel is concerned, all data is a stream of 8-bit bytes, and the
    interpretation of these bytes (possibly by combining two or more bytes into a
    wider character) is left to the user programs. The standard console driver supports
    various character translations through the use of UNIC and loadable font-sets,
    the policy of setting up the fonts and translation tables is handled at a user
    level. The tools to do this both under a graphical user environment and on the
    system console already exist, so in that sense the issues are already solved.


    Another type-related issue is the problem of machines with word-sizes that are
    not powers of two or machines that are not byte-addressable. While kinds of machines
    have existed in the past and are still in in places, it is considered unlikely
    that such machines will be created in the foreseeable future (at least for a larger
    market where a Linux port would be interesting).


    For similar reasons the problems with integer bit-level representation has not
    been considered, and it is likely that machines that implement other integer representations
    than two''s complement would require some portability work. The current portability
    efforts have not been worried about such issues.


    ### 4.1.2 The impact of alignment restrictions and byte order


    Much more complex than the size of the data is the memory access details of data
    on some specific CPU. Even when two CPUs'' share the same data types, the representation
    of that data in memory can be different and many CPUs'' restrict memory accesses
    to only aligned addresses.


    ![](img/5a9073ee2d3bb0d68f5895857e9cf9ca_25_0.png)


    Figure 6: Alignment


    In contrast, the Sun Spark line architectures are big-endian and memory accesses
