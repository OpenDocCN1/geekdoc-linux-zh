    CPU 特性，从用于进程间保护的分段到硬件辅助进程切换。


    然而，最初不容置疑的方法实际上是一个不可移植的实现，而不是一个内在不稳定的设计。与其它 UNIX 兼容的目标导致了一个具有可移植接口的系统，而实现细节是独立的。这种可移植的设计本质上让
    Linux 本身具有了相当的可移植性。


    第一个基于非 Intel 80386 架构的 Linux 是向 Motorola 680x 家族的移植，这在 Linux 开发的早期就出现得相当早。然而，原始的
    Linux/68k 项目并不真正关注可移植性，而是让 Linux 运行在基于 68k 的 Amiga 和 Atari 计算机上。


    请注意这里“可移植性”与“在不同架构上运行的能力”概念之间的根本区别。可移植程序的设计和实现方式使其能够在不同的系统上运行，而即使是非可移植的程序，也可以被强制运行在其他系统上。原始的
    Linux/68k 项目并没有尝试让 Linux 可移植，它只是尝试重写内核，以便让新版本运行在新架构而不是原始架构上。


    虽然 Linux/Alpha 项目本身是一个巨大的进步，但可移植工作始于作者获得 Digital 公司提供的 Alpha 系统，人们希望在新的 Alpha
    架构上制作 Linux。很早以前就明确了，为了能够同时维护基于 Intel 的稳定平台并支持一个新的且在某些方面有根本性不同的平台，内核需要一些重大的重构，以从根本上提高其可移植性。这些问题和最终结果正如本文所述。


    目前的状况是，Alpha 移植已完全成功，并被广泛使用且完全集成到主内核源码中。同时，可移植性问题不仅从 Alpha 移植的角度得到了考虑，还从更通用的规模进行了考虑。结果是其他移植工作变得容易得多，原始的
    Linux/68k 项目已将其基础更新新的可移植布局，该工作的集成正在进行中 [Law97]。


    除了 Alpha 和 68k 移植，到 Sparc 架构的移植也非常成功，并且处于活跃使用中并大部分集成到基础源码中。除了这四个之外，还有对其他架构的移植，包括
    MIPS [Bai96]、PowerPC [Dou96] 和 ARM (StrongARM) [Kin96] 系列 CPU。


    同时，Linux 内核已移植到虚拟环境如 Mach [App99] 和 L4 微内核 [Hoh96]。在这些环境中，Linux 内核运行在另一个内核之上，该内核提供了物理机器的另一种视图，以获得两者的优势。


    ## 可移植性关注点


    与其他某些软件产品不同，操作系统并没有内在的生存理由：操作系统的作用仅仅是执行实际工作的用户与执行任务的硬件之间的接口。没有可行用户程序的操作系统是无用的，而不能与可用硬件协同工作的操作系统同样是没有意义的。操作系统的价值取决于它支持用户进程的优劣程度，以及它在硬件上实现其提供的服务的优劣程度。


    因此，内核本身由它运行的硬件和它支持的软件共同定义（图 1）。在编写操作系统并将其移植到新架构时，应该考虑方程式中的这两个部分。负责移植的人很少能选择自己理想的硬件，同样，移植工作可能会受到用户层级的限制。


    | 用户与系统软件接口 |

    | :--- |

    | 内核 |

    | 硬件接口：CPU 和 I/O |


