    The traditional design was chosen because of serious doubts about the performance
    and simplicity of microkernel-based operating systems. While much work has been
    done on the performance front of microkernels (see for example [BGG+91]), the
    fact that such extensive work is needed in the first place indicates that the
    issues are by no means obvious.


    Also, while simplicity has been used as one of the arguments for a microkernelbased
    design, that argument seems dubious at best considering the complex interactions
    required between the different modules in a microkernel design. This matter is
    generally made worse by the complex performance issues, and the basic simplicity
    of microkernels is often overwhelmed by the complexity of these issues.


    While this is by no means to argue against microkernels per se, the author feels
    that the advantages of microkernels have been overstated in the literature, and
    that a simple and straightforward traditional approach may serve the needs of
    users better. Microkernels tend to be best suited for distributed systems rather
    than UNIX type operating conditions. Even the question remains at what level the
    distribution should be done.


    That said, the very basic UNIX design to some degree favors a microkernel approach
    to user services. A traditional monolithic UNIX kernel can be seen as only a small
    microkernel when considering all the services done by fundamental non-kernel UNIX
    daemons. While many other operating systems tend to handle user verification and
    session handling in the kernel (and in some cases even graphics services!), that
    mentality is the very philosophy of UNIX, where those services are provided through
    user-level daemons.


    # 2.3 Kernel organization


    The basic Linux kernel is directly organized around the primary services it provides:
    process handling, memory management, file system management, network access and
    the drivers for the hardware. These areas correspond to the kernel source directories
    kernel, mm, fs, net and drivers respectively. Additionally, these areas are often
    sub-divided into specific services (see Figure 3).


    The basic portability tenet in Linux is the single source concept, i.e all architectures
    share the same basic source tree. The architecture-dependent code is


