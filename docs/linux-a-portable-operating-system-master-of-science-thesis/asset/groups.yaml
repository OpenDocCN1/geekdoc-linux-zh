    # 3 Software Interface Portability Issues


    One area of concern with regard to operating system portability that is often
    overlooked is the software interface side. The issue has traditionally been ignored,
    because the operating system designer was also in charge of designing the interface
    to the system and application software, and as such the operating system kernel
    could freely implement any interface it wanted.


    However, the computer industry has matured, and most modern operating systems
    have to live with the fact that interface standards already exist, and cannot
    be ignored. Sometimes the standards are on a source level, allowing much freedom
    in actually implementing the standard. In the UNIX world, the most-known example
    of this is the POSIX (Portable Operating System Interface) [Ins96].


    More often, the standard is a binary compatibility standard that is required in
    order to run legacy applications designed for a previous operating system. In
    this case, the designer must very closely follow the exact interface details of
    the binary standard so that no legacy applications break when the system is upgraded
    to a new operating kernel.


    If no previous binary standard exists, the operating system designer is generally
    free to create any binary interface to the kernel, and in that sense a lack of
    a standard can be very liberating. However, even then the designer is generally
    limited by the hardware protection mechanisms in selecting the exact interface
    for the kernel, and as such the architecture to some degree always limits the
    interaction between user and the kernel.


    ![](img/5a9073ee2d3bb0d68f5895857e9cf9ca_17_0.png)


    Figure 4: Multiple personalities'
- md: '

    Another issue that is sometimes faced the existence of multiple standards on the
    same platform, with subtly different^4 and possibly even contradictory requirements.
    While this is fortunately rare, it may be one of the primary concerns for the
    system designers.


    The issue of multiple interfaces to the operating system is usually handled by
    so-called OS personalities. one personality handles the interfacing issues of
    one interface standard, and all personalities share the same common operating
    system routines.


    In one sense, the concept of OS personality is very similar to the issue of portability
    to the hardware and the virtual machine abstraction can be used to handle the
    case of multiple interfaces. The idealized kernel does not directly implement
    any of the interfaces, and the software portability is then a matter of mapping
    the wanted user interface on top of the idealized kernel image.


    One large difference between OS personalities and hardware platforms is generally
    the kernel only runs on one physical platform at a time, yet it potentially has
    to handle multiple personalities concurrently. Microkernel operating systems generally
    handle this by the addition of a personality server for each personality (see
    Figure 4).


    In this kind of personality server approach, the overhead of such personality
    handling is quite high, though, and is one of the primary reasons for work on
    migrating threads (see for example [FL94]) and moving system services into the
    kernel address space (see [LHHL93]). More importantly, when the concept of a personality
    server allows a personality-independent view of the system, most real system usage
    tends to favor one primary personality. The other personalities are mainly used
    for backwards compatibility or emulation of non-native systems.


    ## 3.1 The implementation of the software interface


    Because the primary goal of Linux was never to act as a platform for emulating
    other systems, the Linux approach to the software interface personality problems
    is straightforward.


    Rather than supporting the notion of multiple personalities of equal importance,
    the Linux kernel interfaces to have just one primary personality for which the
    system is optimized. Having a primary personality allows the use of compile-time
    optimizations for the common case, and means that the internal structures can
    be optimized for expected use of the system. The integration between personalities
    and the generic code is much tighter (Figure 5).


    ^4Sometimes the differences are not so subtle.


    Such a tight binding between the common code and the primary software interface
    does not preclude the use of secondary personalities, and should be seen as a
    limitation but an optimization. Also, it should be noted that the primary personality
    can be adapted to the platform and is not inherent to the virtual kernel itself.
    On the Alpha platform, for example, the primary personality is the Digital UNIX
    compatible interface, while Linux on the Spar has a primary personality that looks
    like the original Sun operating systems on the same hardware.


    In addition to the primary personality, any number of secondary personalities
    can exist. These secondary personalities can be dynamically loaded into the kernel
    at runtime as needed, as shown by the iBCS2-personality on the original Intel
    platform [91].


    iBCS2 stands for intel Binary Compatibility Specification 2, and is the binary
    format generally used by non-Linux UNIX-like operating systems on the i386 platform.


    Note that these secondary personalities have the same access to all resources
    as the primary personality, and the difference is not so much a conceptual one
    as a question of optimization: for which personality the internal data structures
    generally needs to do only minimal translation from internal kernel data structures
    for user mode requests, secondary personalities may have to translate user requests
    into a format suitable for the kernel.


    In addition to the secondary personalities, there can also be tertiary personalities:
    environments that are not directly supported by the operating system kernel, but
    can be emulated in user space, often with at least kernel support. This is how
    Linux/x86 is able to run DOS and Windows programs through an external emulator
    and minimal support from the kernel to expose the hardware features needed for
    efficient emulation.


    Similar emulators for running Macintosh, Commodore 64 and other binary formats.
    Another example of this is to run Java programs through a Java interpreter or
    just-in-time (JIT) compiler [GM95]. In the case of Java (and potentially other
    binary formats), the kernel will automatically notice a Java binary and start
    up the appropriate emulation technology for seamless integration with native programs.


    Figure 5: Primary personality


    ## 3.2 Personalities


    In the design of Linux, the basic approach has been to adhere to the standard
    UNIX semantics as closely as possible. However, as many UNIX haters will tell
    you, the concept of standard UNIX is to some degree a contradiction in terms.


    One of the problems with UNIX is while the basic approach to how things work is
    the same, different vendors have done versions of UNIX that differ in the details.
    And through the quarter century history of UNIX, quite a lot of differences have
    evolved.


    While the UNIX community has started to address this issue through various standards,
    and while the current state of UNIX is by no means splintered as was only five
    years ago, the situation is by no means perfect. As some form of UNIX is available
    for just about any computer hardware in existence, the UNIX standards obviously
    tend to be source standards rather than binary interface standards.


    In order to be really compatible with what people perceive as “UNIX”, it is not
    just enough to follow the standards. The standards are generally much more limited
    than any real UNIX is, and POSIX-branded has been a favorite pastime of many operating
    systems (not all of them even remotely UNIX-like) the fact that they follow one
    standard by no means indicates that the system behaves as the user expects it
    to behave.


    As such, the Linux compatibility issues go far beyond the paper standards, and
    rather than being a subset of all UNIXes the idea is to be a superset of the behavior
    people expect.


    While being a true superset of all UNIX behavior is not technically feasible (or
    necessarily even good idea), Linux tries to distill the basic essence of UNIX,
    and implement all the relevant features people expect from such a system. Adherence
    to standards generally make it easy to port programs that have been written with
    the standards in mind, but Linux goes further than that.


    Now, being a superset of what people should expect in theory should be simple.
    Sadly, that is not the case. The main problem is that the basic UNIX operations
    are similar, the difference in details can often result in two systems doing the
    same thing in different and contradictory ways.


    For example, while the standard interface for reading the contents of a directory
    is through the readdir() interface on a C library level, the actual implementation
    of that interface at a lower level can be very different on different UNIX operating
    systems. Obviously the act of reading the directory contents has to be handled
    all of those different interfaces.


    Considering at the same time that the current default Linux sources contain no
    17 (!) different file systems, the duplication of code would be horrendous if
    all these file systems had to know about all the possible interfaces to read a
    directory. The directory contents has to be handled with a virtual interface that
    can do the appropriate translations for all the different systems.


    Another problem in compatibility is the different layouts of data structures and
    the different sizes of various operating system types that different UNIX operating
    systems support. This indicates that the basic kernel routines should be typeindependent,
    in order to be able to handle different layouts. While this typing can be done
    at compile time (allowing for optimal code to be produced for the primary personality),
    the sources should still be able to accommodate any type layout without becoming
    a mess of conditional compilation.


    Finally, the issue of various environment constants has to be handled. Error numbers
    change from system to system, as do the command numbers used by various system
    calls (notably ioctl() and fcntl()). All this has to be cleanly separated into
    architecture-specific header files that allow the kernel to share the basic sources
    yet differ in details.

