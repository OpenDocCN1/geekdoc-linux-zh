    with regard to compatibility: to what extent (if any) we want to be compatible
    with other, possibly similar, operating systems.


    However, more important than the hardware and software porting details them-selves
    is having a general design that makes it easy to be portable. It should allow
    for easy addition of new interfaces (both on the software and the hardware side)
    without impacting existing code. In the case of Linux, this is especially important
    due to the wide development that is done: a distributed development community
    with no direct face-to-face contact between developers and little central authority
    to resolve conflicts.


    While the design porting efforts should be able to work without impacting each
    other, general maintenance concerns require extensive sharing of code. If the
    different architectures end up doing everything on their own with very little
    code, the whole goal of portability has been lost; the different platforms may
    be well considered separate projects.


    For maintenance reasons the architecture-specific code needs to be small and simple,
    and all the complex functionality should be handled by architecture-independent
    code that is shared across all platforms. This, in turn, requires a common concept
    shared across all architectures. That concept is the virtual machine.


    # The virtual machine concept


    The most common approach to creating a portable system that has to be able to
    adapt to different hardware and software requirements is to use the concept of
    a virtual machine [GC94, p. 70], [Tan92, p. 22].


    Instead of having separate architectures that all would have to be handled separately,
    the idea of the virtual machine is to create an idealized abstraction of the machine,
    and that abstraction let the common code operate on the real hardware. The common
    code does not itself be aware of the actual hardware details, and such can operate
    on any physical hardware as in Figure 2.


    The idea of a virtualized machine is not new in itself: just fact the fact that
    the operating system is generally written in some high-level language is itself
    a virtualization of the underlying hardware with the help of the compiler that
    does the translation from the high-level language to the hardware-specific code.


    With the virtual machine abstraction, we only extend the virtualization already
    offered by the high-level language to something that can handle the details needed
    to implement the kernel on top of the actual physical hardware. While most high-level'
- md: '

    languages are good for virtualizing normal level activity, we need to extend that
    to cover all the details of the hardware.


    The concept is in wide use because it is so useful: on Windows NT the virtual
    machine is called HAL (Hardware-Abstraction Layer), while SVR4 UNIX has a more
    limited HAT (Hardware Address Translation) layer to handle the machine-dependent
    virtual memory addresses [GC94, pp. 92].


    ![](img/5a9073ee2d3bb0d68f5895857e9cf9ca_8_0.png)


    Figure 2: The Virtual Machine


    With this kind of idealized kernel that does not interface directly to the virtual
    machine, the act of porting the operating system to another platform or another
    user level binary interface is no longer a matter of rewriting everything. Instead,
    the outlying interfaces to the virtual machine have to be implemented on top of
    the physical machine, and the majority of code can be left untouched.


    Obviously, the choice of virtual machine semantics is of primary importance how
    easily the system can be ported, and how efficient the resulting operating system
    is. Implementing a virtual machine that is at too a high level results in much
    architecture-specific code, while a virtual machine that specifies too much may
    not efficiently onto some specific hardware.


    ## The Linux kernel virtual machine


    While the concept of a virtual machine to handle portability issues cleanly is
    very useful and widely used, it adds a layer of abstraction to the kernel. In
    fact, depending on how this is done it can add two layers of abstraction: the
    layer between the kernel and user space, and the layer between the kernel and
    the hardware.


    In many cases, the layer between the kernel and user space can be ignored, because
    the raw kernel interfaces are often exported more-or-less directly as system calls
    to the user processes. This is the historical approach taken by most operating
    systems, simply because the operating system was made for hardware, and no previous
    standard for the user level existed.


    However, in the case of Linux, previous user level standards often exist on architectures
    Linux is ported to, and to be optimally useful Linux needs to conform to those
    standards in order to leverage off existing applications. Thus, both the hardware
    and the user-level abstraction layers are generally required.


    The problem with abstraction layers is that they add overhead when concepts have
    to be translated from layer to layer. This has generally been one reason hardware-abstraction
    layers have been shunned: they add extra processing that could be avoided by programming
    directly on the bare hardware or software interface. This has to be taken into
    account, especially as one of the goals of Linux in the first place was to be
    efficient.


    ## 2 Linux — the Design and Implementation


    Unlike most modern research operating systems, the Linux approach to operating
    systems is very pragmatic, and rather than concentrating on the *design* of a
    new kernel the focal point has been on a solid and efficient *implementation*.
    Instead of throwing away proven concepts they have been refined in new ways. [Tor93]


    The Linux design is based on three main design issues that have directly influenced
    the implementation. The main issues are:


    - Simplicity. The obviousness of this sometimes means that it is overlooked, but
    an operating system kernel is a complex entity that has to be to work in an uncontrolled
    and potentially even hostile environment. Programming errors in the operating
    system are much less acceptable than in normal programs, and the security issues
    are paramount. A complex design is harder to verify against either errors or security
    issues, so simplicity of the basic services is required.

    - Efficiency. The kernel is involved with almost all activity in the machine,
    and as such the kernel must be efficient enough to *never* be seen as a performance
    constraint.

    - Compatibility. While the basic operations of a kernel are of supreme interest
    to researchers in the operating system area, most people do not want to know what
    is going on as long as their programs work. As such, one of the most important
    features of an operating system is the lack of surprises it offers to the user,
    be a normal end-user or a programmer. Even new features should be offered as a
    *superset*, rather than *instead* of functionality that the user is accustomed
    to.


    These design issues, coupled with a very pragmatic approach to programming, has
    led to a system that shares features of both the traditional monolithic design
    and sign of the new research projects into modern microkernels. The microkernel
    design itself was discarded due to doubts about the efficiency and simplicity
    of the approach, but during the development many of the features usually associated
    with microkernels have been implemented on top of a more traditional monolithic
    kernel.


    The design has also been strongly influenced by the general availability of Linux
    source code to anybody with access to the Internet. That has not only led to a
    very dynamic development community that is physically spread all over the world,
    it has also directly impacted the design itself.


    Rather than concentrate on a concept of a kernel binary that interfaces to the
    rest of the world (be it hardware or software), the Linux approach has been to
    have sources available that can be used to create the binary we. This approach
    allows the interfaces to be specified at compile time rather than at run-time.


    The more traditional link-time and run-time interfaces are naturally also available,
    and give access to more dynamic feature sets. By using run-time dynamic linking
    of modules into the kernel, the user can add and remove features as needed, but
    the availability of sources always adds the possibility of increased performance
    by specifying the configuration at compile time and letting the compiler handle
    interfacing issues.


    ## 2.1 The design — compatibility


    The three main design issues — simplicity, efficiency and compatibility — have
    naturally formed the basis for the kernel implementation. The compatibility issue
    defines the external shape of the system while the issues of simplicity and efficiency
    define the internal implementation of it.


    The wish to be compatible with other UNIX-operating systems more or less defines
    the kernel interface that is exported to system and user applications. Note that
    compatibility extends to outside the machine itself: not only does the compatibility
    issue require the programming and user interface to the kernel, but also involves
    the integration of the system with other external requirements. These requirements
    include following standard protocols on external networks, but also being able
    to live together on the same machine with other operating systems. This can involve
    supporting a common disk partitioning, or a particular boot-up sequence.


    As being compatible clearly restricts the external interfaces of the system, many
    new operating system projects choose to be less compatible in order to be able
    to fully express the wishes of the designer. Instead of being constrained by what
    others have done, such a project can soar to new heights of design beauty, at
    least in the eyes of the designer.


    Sadly, those projects invariably tend to fail in real life, getting only a niche
    market (if that) due to their lack of common applications or interfaces. As mentioned
    earlier, the worth of an OS lies not in what the OS can do, but in what the OS
    allows others to do. Therefore a more pragmatic approach is often required.


    While compatibility clearly restricts the design of the system, it at the same
    time makes it easier to integrate with others, and potentially allows a large
    base of existing applications to be used directly on top of the new kernel. In
    the case of Linux, being compatible with generic UNIX means that a plethora of
    freely available UNIX applications were directly useful on top of Linux. So while
    the collar of compatibility may feel chafing at times, it allows the system to
    be built on top of the work done by others.


    However, while being compatible is good for the usability of the system, it tends
    also to be boring. A grey mass of compatible operating systems is not what makes
    the heart of system designers beat quicker, nor does it allow the system to show
    innovation more than an implementation layer.


    Because the Linux project has been done non-commercially by people all over the
    world connected by the Internet, a boring system would simply not work: lacking
    the money-related incentives Linux depends on being vital and interesting to attract
    developers. As a result, Linux inevitably has accumulated interesting extensions
    to the base UNIX compatibility, and one of the challenges has been to add these
    extensions in a manner that cleanly integrates with other code.


    ## 2.2 Implementation


    While the basic shape of the system is constrained by the compatibility issues,
    the designer is free to decide how that shape is in fact implemented.


    While modern operating system research tends to favor a microkernel and object-oriented
    design, Linux has leaned towards a much more traditional design. Unlike the UNIX
    that it tries to be compatible with, Linux uses a very monolithic kernel mostly
    written in portable ANSI C.


    Even though proper C is generally suited for systems programming (that was one
    of the original uses of the language, after all), the Linux kernel additionally
    uses some features offered by the GNU C that make it easier to implement certain
    features efficiently. The two notable extensions to C used are inline functions
    and inline assembly language code embedded within C.


    In addition to the code written in C, some low-level routines have been written
    directly in assembly language either due to performance reasons or due to circumstances
    where the C semantics are unable to cover the exact code generation

