  mdcn: '

    在物理索引缓存中，通过内存位置的物理地址来查找缓存位置，因此，一个物理内存地址始终能通过索引被找到，且不会发生别名（aliasing）。


    相比之下，虚拟索引缓存将使用运行程序所看到的虚拟地址作为缓存查找索引。这对于 CPU 设计具有一些显而易见的优势：在进行缓存索引之前不需要计算物理地址，缓存查找可以得更快，并能与虚拟地址到物理地址的翻译并行进行。


    然而，虚拟缓存的使用直接导致了别名问题，因为不同的虚拟地址指向同一个物理内存位置。结果是不同的虚拟地址可能导致不同的缓存位置，产生上述的别名问题 [IKWS92]。


    需要注意的是，虚拟索引由此产生的别名对于指令缓存来说并不是一个问题：虽然别名可能会导致缓存利用率略微，但可以通过更简单的查找过程来抵消，而且由于指令缓存不会修改其内容，别名问题的最坏影响实际上被避免了；事实上，虚拟指令缓存往往可以为操作系统简化指令缓存失效（见
    4.3.1）的问题。


    然而，在数据缓存的情况下，别名问题要么需要额外的反别名硬件，要么必须通过操作系统的适当支持来处理。由于虚拟索引的初衷是硬件简单化，因此通常留给操作系统来收拾这些烂摊子。


    双重映射最平凡的例子是页面同时存在于内核空间和用户空间的情况。由于内核地址空间包含了所有物理内存，这种情况会发生在任何用户页上。幸运的是，只有在少数情况下，这些映射在缓存中实际上会发生冲突。


    双内核-用户映射通常不会导致别名问题的原因是，大多数情况下，用户进程对其使用的任何页面具有完全控制权，而内核不会通过内核地址读取或写入该页面。因此，别名不是一个问题。必须确保内核在任何数据拷贝中始终使用虚拟地址，但由于这本身就是正常的运行模式，所以该问题是不值一提的（见第
    6 章关于内存管理问题的后续）。


    尽管大多数常见的内存映射不会导致别名问题，但存在少数情况并非如此，特别是在内存映射文件方面。当用户进程请求将文件映射到用户内存时，用户可访问的页通常也会通过内核通过映射文件维护的页缓存访问。


    由于所有用户程序都以内存映射的形式加载到用户空间，这种将同一个物理页映射到多个虚拟地址的双重映射是非常常见的。然而，绝大多数映射都是 UNIX 术语中所谓的“私有映射”（private
    mappings），即对于公共共享页，映射是只读的；如果进程写入该页，虚拟内存子系统将强制触发陷阱（trap）并分配一个新的页面副本（所谓的 COW，写时复制行为）。


    对于私有映射，仍然只有一个实体（内核）可以更改与别名映射关联的物理页，且 UNIX 内存语义并不要求此类私有映射保持 100% 的同步。别名问题仍然要求内核在第一次读取内核副本页面时进行处理，但这只是确保副本存在于主内存中而不仅仅存在于内核虚拟缓存中的一个简单问题。


    简而言之，对于私有映射，关于缓存一致性的数据缓存别名问题并不棘手。由于同一物理物理页可能在多个位置出现重复，为了获得相同的性能，虚拟缓存应该比同等性能的物理索引缓存更大
    [WHL93]。


    让虚拟索引数据缓存对 UNIX（以及因此是对 Linux）变得非常糟糕的是共享内存映射的语义，这种语义允许不同的进程在多个位置映射同一个物理页，并允许对该页进行完全的读写访问。这主要用于应用程序之间数据的快速共享，并被使用
    MIT 共享内存扩展的 X 服务器以及想要并发访问和更改内存数据的进程（通常是数据库）使用。


    由于进程被认为能够直接访问共享内存而无需操作系统的干预，这些共享内存映射的访问不受操作系统本身的直接控制。因此，操作系统通常无法对这类共享映射强制执行缓存一致性。Linux
    通常采用的方法是完全禁用此类页的缓存，这在在使用共享映射时会产生非常明显的性能开销。


    一种允许逻辑共享内存同时避免禁用缓存的可能方法是使用页表来对共享页的访问序列化。内核可以保护共享页，并允许一次只有一个进程修改它们。通过这种方式，内核控制了所有共享资源，并在新进程需要访问共享页时通过适时刷新缓存来确保永远不会发生别名。因此，内存并没有真正在物理上被共享，而是操作系统让用户进程看起来是那样的。


    使用虚拟内存子系统序列化访问可能允许具有这种软件强制缓存一致性机制的分布式共享内存机器（所谓的共享虚拟内存，[AMMR92]），与硬件一致性支持相比，一致性开销是巨大的，且性能对于许多共享内存的传统用途（例如线程间锁）来说通常是不可接受的。在非分布式系统中，禁用所有缓存通常更好，因为那样性能在不同情况下至少是可预测的。由于于原因，没有
    Linux 端口使用页表共享内存序列化。


    通常，应该尽可能避免数据虚拟缓存。然而，共享内存区域的问题使其处理在本质上变慢；尽管大多数应用程序不需要一致的共享内存，但那些需要的却受到了惩罚。请注意，由于缓存别名，虚拟缓存还可能比物理缓存引发更多的缓存缺失——即使没有由写入引起的任何一致性问题。


    需要注意的是，大多数具有虚拟缓存的架构只有靠近 CPU 的小容量虚拟缓存，地址翻译的延迟影响更大。它们随后拥有较大的物理索引的二级或三级缓存。


    让使用虚拟数据缓存方法更加可疑的是，地址翻译通常可以通过巧妙的缓存设计隐藏。许多物理索引缓存采用的一种方法是设置一个一级缓存，通过虚拟地址的低位进行索引，而这些位在虚拟地址翻译过程中不会改变——即页偏移（page
    offset）。这种方法限制了缓存的大小¹，但由于索引在地址翻译过程中不会改变，因此缓存查找和地址翻译可以并行完成 [HP96, p. 425]。


    > ¹ 最大缓存大小限制为 $pagesize_{CPU} \times associativity_{cache}$


    ## 4.4 多处理器问题


    虽然多处理曾是超级计算和大型服务器的专属领域，但技术的进步意味着拥有多个处理器的计算机变得越来越常见。这使得这些多处理器机器对 Linux 开发者更有吸引力。同时，Linux
    本身获得了更广泛的接受，这反过来使得 Linux 对拥有高端多处理器硬件的人更具吸引力。


    结果是Linux 在过去两年中针对这些多处理器机器进行了积极开发，“可移植性”问题不仅改变了底层的 CPU 架构，还改变了在不同 CPU 配置上运行 Linux
    的可能性。


    现代多处理环境通常有不同的类型，关键问题在于如何访问内存总线。内存总线通常是任何多处理环境的主要限制（内存子系统是主要的 {问题）。


    更常见的架构是集中式内存多处理器，所有处理器如图 13 所示平等共享内存。这通常通过公共内存和 I/O 总线实现，由于所有处理器对机器的所有资源都有直接且相等的访问，它通常被称为
    SMP（对称多处理）。


