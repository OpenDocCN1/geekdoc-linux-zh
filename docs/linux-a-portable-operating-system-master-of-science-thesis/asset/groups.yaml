    的寄存器和地址空间是 64 位的。这导致 C 语言中的标准数据类型在不同架构上不同。


    这种基本数据类型的差异往往被作为可移植性中的主要问题提出。然而，至少在 Linux 内核本身的情况下，数据类型的大小大多是无关的，尽管对于从 32 位架构移动到
    Alpha 这样的 64 位架构曾有很多紧张情绪，但事实证明在现实生活中这并不是什么大问题。


    在普通的可移植代码中，底层硬件类型的大小并不并不。在很多情况下，C 语言中的“long”是 32 位还是 64 位是完全无关的，大多数内核代码将使用某些特定机器的本地原生的大小。


    然而，在某些情况下，数据大小是重要的，通常是因为该大小是由某些外部实体定义的——例如，在文件系统中通常是这种情况，因为物理磁盘上的数据布局具有某种与机器无关的标准。同样，大多数网络代码依赖于能够处理特定大小的地址，而到设备控制器的硬件接口通常具有非常严格的类型结构，这与主机
    CPU 类型无关。


    ## 数据大小 — 实现


    在 Linux 中，特定特定的头文件导出了一小部分特定类型，供操作系统部分在需要某些特定类型大小时使用。包含 `<asm/types.h>` 文件使得当某些特定需要
    8 位、16 位或 32 位无符号整数时，可以使用 C 类型 `u8`、`u16` 和 `u32`。


    相应的有符号数据类型（`s8`、`s16` 和 `s32` 也可用，但应尽量减少它们，因为任何需要特定位数的对象通常不是普通整数。


    由于标准 C 的命名规则，这些类型仅在编译内核代码时可用。如果需要将特定类型暴露给用户空间实现，则存在在类型名称前面加有下划线的相同类型版本（`~u8`、`~u16`
    等）。这些主要用于在无法暴露这些类型正常名称的公共头文件中。


    ## 未解决的问题


    虽然当前的 Linux 内核已证明可以移植到各种硬件（包括不同的字长和字节序），但数据类型的可移植性问题绝未被完全处理。


    一个经常被忽略的数据大小问题是字符集的大小。虽然 8 位字符目前是标准，但它忽略了主要在亚洲使用的宽字符问题。Linux 内核通过不在内核本身中进行任何字符翻译来规避这个问题，并将所有此类问题留给用户空间。


    对于内核而言，所有数据都是 8 位字节流，而对这些字节的解释（可能通过将两个或多个字节组合成更宽的字符）交给用户程序。标准控制台驱动程序通过使用 UNIC
    和可加载字体集支持各种字符翻译，设置字体和转换表策略策略在用户级处理。在图形用户环境和系统控制台上执行此操作的工具已经存在，因此从这个意义上说，这些问题已经解决了。


    另一个类型相关的问题是字长不是 2 的幂的机器或不可字节寻址的机器。虽然这类机器在过去存在过并且在某些地方仍然存在，但人们认为在可预未来不太可能创建这样的机器（至少对于
    Linux 移植有意义的更大市场而言）。


    由于类似的原因，整数位级表示的问题尚未被考虑，实现补码之外其他整数表示的机器可能需要一些可移植性工作。目前的可移植性工作还没有担心此类问题。


    ### 4.1.2 对齐齐限制和字节序的影响


    比数据大小复杂得多的是某些特定 CPU 上数据内存访问的细节。即使两个 CPU 共享相同的数据类型，该数据在内存中的表示也可能是不同的，并且许多 CPU 限制内存访问仅限对齐地址。


