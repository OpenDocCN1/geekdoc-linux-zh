    | L1 Index | L2 Index | L3 Index | Offset in page |

    | --- | --- | --- | --- |

    | L1 | L2 | L3 | |

    | directory | page table | table | Physical page |


    Figure 10: Three-level page table tree


    efficient, so that the mapping information does not take up a lot of physical
    memory that could be used to better advantage for file system caching or running
    user programs. Remember that not only does the kernel have to keep the page tables
    of the virtual machine in memory, the page tables of the physical machine also
    take up space.


    There are secondary concerns: the virtual machine memory mappings must be memory-efficient.
    With all the requirements placed on the page tables of the virtual machine, the
    choice in the end is not difficult. It turns out that a multi-level page table
    tree is an approach that can be easily expanded to match large virtual memory
    spaces by adding levels. It is flexible, simple, and reasonably efficient.


    Not only is a multi-level page table a good generic answer to the page table problems,
    it can also easily be made to map closely to the actual hardware, so that the
    mapping of the page tables from the virtual machine to the physical machine is
    easy to do. In fact, by choosing the right virtual machine page table setup, the
    same page tables can be used by both the kernel virtual machine and the physical
    memory management unit. In those cases the mapping overhead is obviously zero.


    Architectures which natively use multi-level page tables include the Intel 80x86,
    the Digital Alpha and the Motorola 68k family. The Intel hardware uses two-level
    page tables [CG87, p. 465], while the 68k and the Alpha use three-level page tables
    [Dig92, p. 3-1]. As three levels is enough to map on the order of 40-45 bits of
    virtual address space, and no current hardware supports more than that, that was
    the choice for the Linux kernel virtual machine (see Figure 10).


    It is worth noting that a virtual page table of level n can easily be mapped to
    a physical page table of level n-1 by simple "hiding" one level inside another
    (Figure 11). This is actually used by Linux/x86 to create two-level page tables
    from the kernel three-level page tables. The hiding approach also allows the future
    expansion of the kernel virtual page tables without breaking any two- or three-level
    page tables.


    | L1 Index | L3 Index | Offset in page |

    | --- | --- | --- |

    | L1 | L3 | |

    | directory | L2 | |

    | Page table | | Physical |


    Figure 11: Hidden mid page table level


    Mapping a multi-level page table tree onto a pure TLB architecture like the MIPS
    or the UltraSpar is similarly trivial. The TLB refill code can just follow the
    page tables by hand, and because of the simplicity of the data structures this
    refill code can generally be written in low-level assembly directly in the TLB
    miss handler for best performance.


    The case of hashed in-memory TLB extensions like the PowerPC, the mapping is no
    longer trivial, but there is a generic approach that works for these cases or
    any other memory management setup. The algorithm is as follows:


    - 1. ON-CHIP TLB MISSES.

    - 2. HARDWARE DOES A DASH TABLE LOOKUP, IF MAPPING FOUND: FILL IN TLB AND RESTART
    THE ACCESS.

    - 3. MAPPING NOT FOUND: HARDWARE INVOKES KERNEL PAGE FAULT HANDLER.

    - 4. KERNEL PAGE FAULT HANDLER DOES A KERNEL PAGE TABLE WALK, AND INSERTS THE
    PAGE FOUND INTO THE HASH TABLES AND RETURNS.

    - 5. THE MEMORY ACCESS IS RE-TRIED, AND THIS TIME THE MAPPING IS FOUND IN THE
    HASH TABLE IN STAGE 2.


    The above algorithm can clearly be used on any hardware, and is the fall-back
    position if a simpler mapping cannot be done directly.


    ## 4.2.2 Page table mapping coherence


    While separating virtual and physical page tables is good for portability, they
    obviously also add a new problem: the problem of keeping the two page tables coherence.
    Some way of invalidating the hardware page tables when the virtual page tables
    have changed is obviously necessary.


    Even when the virtual page tables map directly to the physical page tables and
    there is just one copy of the page tables itself, the same coherency issue itself
    felt in the form of TLB coherency. The internal CPU on-chip TLB generally needs
    to be invalidated even though the external in-memory page table is updated correctly
    in synchronization with the virtual page tables.


    Because the on-chip TLB invalidation is an issue regardless of the actual layout
    of the physical page tables, we can generalize the TLB invalidate concept to cover
    the case of a separate hardware page table as well. Thus, as far as the virtual
    kernel is concerned, any hardware page table is considered only an extension of
    the TLB. This concept allows us to create an algorithm for changing the virtual
    page tables as follows:


    - 1. CHANGE THE VIRTUAL PAGE TABLES.

    - 2. INVALIDATE THE CPU ON-CHIP TLB INFORMATION.

    - 3. IF THE HARDWARE PAGE TABLES ARE SEPARATE FROM THE VIRTUAL PAGE TABLES, INVALIDATE
    THE HARDWARE PAGE TABLES.


    Again, this algorithm will work correctly with any hardware page tables. The kernel
    needs to be careful about race conditions, making sure that the hardware page
    table information is never used after the virtual page tables have been changed,
    but as the changes to the page tables are well localized this is generally not
    a problem.


    > 9Note that even when the virtual and physical page tables can be mapped to the
    same layout, they should be considered conceptually separate.


    The main problem is to find the right level of invalidation granularity: invalidating
    too much hardware state can be very expensive especially with in-memory extensions
    of the TLB. This issue is closely linked with the issue of hardware support for
    multiple address spaces: when we change the virtual mapping of process we should
    not necessarily invalidate all the hardware state associated with other running
    processes.


    All of the information that describes the kernel page tables can be found in the
    architecture-dependent header file `<asm/pgptable.h>`. This header describes the
    actions to be taken when invalidating and modifying the virtual page tables, and
    is the main architecture-specific file in the whole memory management tree apart
    from the initial setup code and the low-level trap handling.


    To give the reader some idea of the success of the virtual page table approach
    it be noted that most of the current architectures can distill the required architecture-dependent
    page table information into a `<asm/pgptable.h>` file of only around 500 lines,
    of which are comments or trivial one-line inline functions describing the hardware
    page tables.


    ## 4.3 Ensuring cache coherency and atomic operations


    One of the issues that the original Linux for the Intel line of computers did
    not have to concern itself with CPU cache coherency. Traditionally computers based
    on the x86 line of CPUs have always done cache coherency in hardware, and neither
    the operating system nor the programs running on the CPU have to care about cache
    consistency.


    However, the Intel CPUs are more the exception than the norm in this regard, and
    on most other architectures the operating system will have to be aware of the
    caches on the system, and make sure that coherency is maintained in software.


