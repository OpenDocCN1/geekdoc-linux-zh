    While the principle of the virtual machine approach is simple to grasp, the details
    are not as obvious. What mapping scheme should be used in order to make the translation
    to the hardware as efficient as possible, yet be generic enough that the scheme
    is useful as a superset of any realistic hardware? If the virtual machine is too
    limited, it cannot take advantage of large address spaces or special hardware
    features.


