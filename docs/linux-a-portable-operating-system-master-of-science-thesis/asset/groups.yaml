    请注意，这种方法与基于微内核的分布式系统有本质区别。后者不是在内核底层处理分布的复杂性，而是几乎完全在用户空间处理分布，仅有极少的内核支持。这允许了更大的灵活性，因为不同的节点并不一定运行相同的操作系统或具有相似的硬件。


    ## 4.5 设备驱动：访问 I/O 总线


    我们之前的注意力很大程度上集中在移植性问题中的 CPU 子系统上。在某种程度上，CPU 子系统是任何架构中最可见的部分，而硬件的 I/O 特性往往被忽视。因此，例如，我们谈论
    Linux/Alpha 和 Linux/x86 —— 对应 Linux 已移植的 CPU 架构 —— 但从未谈论过 Linux/sbus 和 Linux/PCI
    等。


    I/O 架构经常被忽视的一个原因是，它不应该被应用程序直接看到。虽然人们习惯了为不同的 CPU 架构准备单独的二进制版本，但在 I/O 方面情况并非如此。I/O
    细节被期望由操作系统完全隐藏，尽管 I/O 架构的差异预计会影响性能，但并不预期它会反过来影响其他方面。


    然而，尽管用户缺乏这种关注，I/O 细节很容易成为任何移植工作中最大的部分。虽然编译器和虚拟机抽象可以非常有效地隐藏 CPU 细节，但通常没有可用的“I/O
    编译器”来隐藏各种设备的细节。因此，大部分的驱动程序移植工作必须从头开始由手工完成。


    通常让此问题变得更加棘手的是缺乏对 I/O 架构细节的文档支持。虽然新 CPU 架构的所有相关细节通常可以在 CPU 制造商的一到两份架构手册中轻松获得，但
    I/O 细节往往并非如此。执行工作的人通常被迫从许多独立（且通常是不完整的）的来源收集信息。


    ### 4.5.1 专有总线


    让 I/O 架构移植变得更加困难的，与其说是架构的通用复杂性，不如说是与 I/O 子系统相关的海量细节。就在几年前，每家主要制造商都有自己的 I/O 总线标准（并有几种不同的标准），就像他们拥有自己的
    CPU 架构一样。


    但 CPU 是被良好定义的，而 I/O 架构不仅由实际驱动物理总线的细节定义，还由连接到总线上的设备定义。通常必须支持成千上万没有共同接口的设备。与 CPU
    不同，这些设备中的大多数倾向于出现必须处理和恢复的故障模式。


    事实上，设备代码的数量是如此惊人，以至于当前 Linux 内核中近一半是由设备驱动程序组成的。虽然由于驱动程序本身并不十分复杂，但它们数量庞大，移植工作的很大一部分是通过设备驱动程序工作实现的。


    让所有问题变得糟糕的是，驱动程序之间共享的通用代码非常稀少。虽然存在通用驱动层，但大部分通用驱动层与其说是关注驱动本身，不如说是关注所有驱动程序必须向世界其他部分展示的通用接口。


    通用驱动程序的一个例子是 UNIX tty 层，该层与键盘或字符终端等串行输入设备有关。该层包含了任何 tty 设备所需的通用代码——字符转换、会话处理以及在发生线路断开等异常事件时要采取的操作。然而，整个通用代码关注的是通用
    UNIX 兼容性所需的问题，而不是实际设备的低级细节。


    幸运的是，在 I/O 处理的“丛林”中确实存在一些真正的标准。主要的此类标准是 SCSI（小型计算机系统接口），它提供了一种通用的硬件总线标准，用于从磁磁盘、光盘到扫描仪和带带驱动器的各种设备。虽然
    SCSI 标准没有规定操作系统看到的实际编程接口，但通用标准允许在不同的 SCSI 适配器驱动之间共享通用代码。


    ### 4.5.2 PCI —— 新兴标准


    虽然 I/O 架构的情况非常复杂，且不同的 I/O 子系统之间通常无法共享多少代码，但过去几年引入了一种新标准，它可能会结束至少部分混乱。这个新标准是由 Intel
    和其他计算机公司引入的 PCI（外围组件互连）总线标准。


    PCI 的趣味之处不在于技术本身，而在于成为一个合理通用标准的潜力。PCI 已经具有了革命性意义，因为它吸引了许多不同的供应商使用相同的标准，而不是继续使用不与他人共享的专有标准。尽管
    PCI 起初主要被 PC 制造商采纳，但它产生的大量 PCI 兼容硬件使得 PCI 对其他供应商来说成为一个极具吸引力的提议。


    目前，PCI 同时用于基于 x86、PowerPC 和 Alpha 的系统，随后 Sun 宣布基于 PCI 的 Sparc 工作站将在 1997 年初上市。这个列表中令人印象深刻的是，这四个主要架构不仅恰好是
    Linux 的主要 Linux 平台，它们还占据了现代 CPU 市场的很大一部分。因此，PCI 可能会显著减少 I/O 架构移植的工作量。


    需要注意的是，转向 PCI 使实际 I/O 总线接口的移植问题变得更容易，而且它绝不是所有问题的答案。最值得注意的是，庞大的 PC 硬件市场不仅让 PCI
    最初成为一个可行的标准，还导致了前所未有的不同 PCI 适配器出现。因此，虽然有一个通用总线避免了一个层的移植问题，但它确实没有消除适配器的多样性，因此未来对设备驱动程序开发的需求依然存在。


    ## 5 示例架构


    虽然 Linux 目前在某种程度上支持七种架构（Digital Alpha、80x86、Motorola 68k、MIPS、PowerPC、Sparc、Acorn
    ARM），但其中三种架构因对 Linux 移植产生根本性影响而脱颖而出。


    原始的 Intel 平台显然是任何 Linux 工作的基础：它提供了廉价且无处不在的硬件，并且是迄为止最流行的 Linux 平台，也是开发工作最集的平台。


    同时，Digital Alpha 平台作为现代 64 位硬件基础脱颖而出，并且是第一个移植目标。与 Sparc 架构一起，这两个架构定义了目前大部分的 Linux。


    ### 5.1 Alpha


    Digital Alpha 架构是行业中较新的 RISC 设计之一，得益于 Digital 公司的广泛支持，它是第一个受到欢迎的非 Intel 架构。

