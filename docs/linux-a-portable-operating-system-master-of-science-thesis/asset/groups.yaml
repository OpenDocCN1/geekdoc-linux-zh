    # 4.1.2 The impact of alignment restrictions and byte order


    Much more complex than the size of the data is the memory access details of data
    on some specific CPU. Even when two CPUs'' share the same data types, the representation
    of that data in memory can be different and many CPUs'' restrict memory accesses
    to only aligned addresses.


    ![](img/5a9073ee2d3bb0d68f5895857e9cf9ca_25_0.png)


    Figure 6: Alignment


    In contrast, the Sun Spark line architectures are big-endian and memory accesses
    must be aligned; if a program tries to store a 32-bit word at a byte address that
    is not even divisible by four the CPU will trap (Figure 6). Most other modern
    architectures are also likely to trap on unaligned accesses.


    These kinds of memory access details turned out to be much more of a problem than
    the size of the data itself. The size of registers generally does not matter for
    most code, and the cases in which it does matter are well-defined and generally
    not problematic to find.


    Value 0x12345678 in memory


    | | 0x12 | 0 |

    |---|---|---|

    | 1 | 0x34 | 1 | 0x56 |

    | 2 | 0x56 | 2 | 0x34 |

    | 3 | 0x78 | 3 | 0x12 |


    Big-Endian Little-Endian


    With alignment, the problem is that while the compiler can make sure all internal
    kernel data is correctly aligned, the kernel cannot assume alignment for external
    events, notably user space arguments.


    Figure 7: Endianness


    For byte order, the problem is that the effects of byte-order are much more prevalent
    and harder to find than the size of data. The size of any data structure can often
    easily be changed by just changing the type of the C structure that is used by
    the kernel to access the data. However, when it comes to byte order there is no
    equivalent change we can make on the C language level, so any byte'
