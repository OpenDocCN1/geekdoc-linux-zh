    | Master of Science thesis | | | | | January 1997 | 52 p. | | |

    | Tiivistelmä — Abstract | | | | | | | | | number C-1997-12 |


    We explore the hardware portability issues in Linux that were uncovered when porting
    the operating system to multiple CPU and bus architectures. We also discuss software
    interface portability issues, especially with regard to binary compatibility with
    other operating systems that can share the same hardware platform. The approach
    taken in Linux is described, with a few examples covered in some more detail.


    Computing Reviews Classification:

    D.4 (Operating Systems), C.1 (Processor Architectures), D.2.7 (Software Engineering
    — Portability), D.4.7 (Operating Systems) — Organization and Design


    # Linux, Operating System, Portability, Alpha, Sparc


    Säilytpaikka — Förvaringsortälle — Where deposited


    # Department of Computer Science Library,


    Muita tietoja — Övriga uppgifter — Additional information


    # Acknowledgements


    While the Linux project has been closely associated with me personally, partly
    due to the name, I would like to make it very clear that the Linux operating system
    is a huge project done co-operatively by lots of people all over the world.


    Even if you discount all the user-level programs that are an integral part of
    any running Linux system, just the kernel contains code from hundreds of people
    from all around the world.


    Thanks to all of you.


