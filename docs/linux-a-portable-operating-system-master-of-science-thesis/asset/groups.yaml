    赫尔辛基大学计算机科学系致力于创建一个真正可移植操作系统的基础。因此，Digital 项目一直致力于开发一个 32 位的端口，假设这样会更简单；而作者则致力于将
    Linux 纯净地移植到 64 位架构，并充分利用所提供的硬件。


    事实证明，32 位的 Linux/Alpha 在较早日期就实现了启动，而可移植的 64 位内核重写紧随其后，并迅速证明了其更具通用性。Digital 的努力并没有停止，他们放弃了
    32 位试点项目，现在正致力于让 Linux 在不同的 Alpha 硬件上运行，并为内核提供所需的环境。SMP（对称多处理）工作也在进行中，以利用 Alpha
    的多处理能力。


    Alpha 为 Linux 引入的主要变化包括：


    - 将内核重新组织为与架构无关和特定架构的部分。原始内核在源码中嵌入了内联汇编语句，但可移植性要求对访问特定硬件特征的代码提供一个清晰且定义良好的接口。

    - 虚拟内存管理重写。更宽的地址空间需要更深层次的页表树，结合通用的可移植性考量，导致了目前的内存管理实现。

    - 内核类型的整洁性。更宽的数据类型要求对内核内部数据结构进行清理。虽然原始 Linux 内核交替使用 C 类型“int”和“long”，并同时使用它们来处理
    32 位值，但 Alpha 要求对内核使用的不同数据类型进行清晰分离。

    - 内核数据结构的严格对齐。


    此外，Alpha 端口还暴露了内核本身的一些不完善的假设。例如，Linux 内核最初假设字节访问是原子的，并在某些情况下使用值来标记异步事件。在 Alpha
    上，最小的原子更新是 32 位字，而所有的字节访问都是通过多条指令完成的。结果是，依赖原子更新的代码发生了细微的崩溃。


    Linux 移植到 Alpha 还涉及其他细微问题。例如，字节访问的缺失在 C 语言编程层面是不可见的，因为编译器会自动生成正确的指令序列，但出于性能考虑，应该避免连续的字节访问，转而使用优化的
    64 位代码。将一些基础库功能重写为优化的汇编代码，在某些用例中对速度有了显著的提升。


    Linux/Alpha 端口还引入了与其他操作系统的原生二进制兼容性问题。二进制兼容性不仅让 Linux/Alpha 能够访问 Digital UNIX 二进制文件，还通过对已知的二进制文件测试早期版本的操作系统，加速了系统的引导过程。


    由于 64 位架构导致 Alpha 上不同数据大小的问题，加上二进制兼容性要求，使得内核接口能够透明地处理不同类型的大小变得至关重要。一个明显的例子是内核访问用户数据。


    在 Linux/Alpha 端口之前，向用户态写入数据项是通过函数 `put_fs_byte`、`put_fs_word()` 和 `put_fs_long()`
    完成的——分别对应 8、16 和 32 位实体。这与原始数据类型映射得很好。这些函数奇特的命名源于在 Intel 平台上使用 `fs` 段寄存器来访问用户态。


    在 Alpha 上，这显然运行得并不好。不仅是因为这种命名在 Alpha 上是不符合直觉的（因为没有 `fs` 段寄存器），而且在 Intel 平台上是 16
    或 32 位的数据类型在 Alpha 上可能是 32 位或 64 位。因此，整个固定大小数据的概念必须被抛弃，访问用户态的接口被重命名为 `put_user()`。这个宏在编译时自动确定正确的数据大小，并使用适当的方法进行访问。这类更改使得在不同系统上使用适当类型成为可能，而无需担心实际发生的访问。


    Linux/Alpha 作为 Linux 较早的端口之一，是一个非常稳定的平台，被广泛应用于需要卓越浮点性能或访问 64 位硬件的各种环境中。该端口已完全合并到标准
    Linux 源码中。


    ## 5.2 Sparc 系列计算机


    虽然 Alpha 架构为 Linux 内核的可移植性奠定了基础，但由 David Miller 领导的 Sparc 系列计算机移植则巩定了这一地位。


    两点使得 Sparc 架构在这种背景下非常有趣。首先，硬件是随处可见的：旧的 Sparc 硬件通常可以在任何大学的角落找到。从这个意义上说，硬件的可用性在程度上类似于标准
    PC 硬件。另一个让 Sparc 成为有趣平台的原因是，Sparc 架构是最老的 RISC 架构之一，并在几家不同制造商手中经历了几代迭代。虽然该架构的不同版本对于用户态程序看起来相似，但在系统编程层面的差异是令人震惊的。因为
    Sparc 端口在某种意义包含了几个“微移植”，并引发了许多在前两个架构 [SPA94a, SPA94b, Ros93] 中并未出现的问题。


    Sparc 与 Motorola 680x 移植还引入了不同的 Linux 排序。虽然 Intel 8086 和 Digital Alpha 架构都是小端序（little-endian），而
    m68k 是大端（big-endian）。此外，不同版本的 Sparc CPU 使用了不同的虚拟内存管理技术，它们还使用了虚拟和物理缓存或两者的混合。


    虽然这种多变性使得移植变得困难，但也使 Sparc 成为内核虚拟机的极佳测试环境。Linux/Sparc 端口不仅运行良好，而且非常成功，这一事实确实表明
    Linux 虚拟机足够通用，可以处理任何合理的硬件实现。


    Sparc 端口为 Linux 引入的最大变化在于内存管理和字节序。字节序的变化主要与文件系统代码有关——特别是 ext2 文件系统和 MS-DOS 文件系统。内存管理的变化主要由性能和缓存失效问题引起。但
    Intel 80x86 平台和 Alpha 在硬件中处理数据缓存一致性问题，使得 Sparc 端口必须在软件中解决这个问题。


    此外，虽然虚拟机的三级页被证明是非常优秀的设计，但性能问题要求 Sparc 的页表 TLB 失效必须更加细粒度。原始 Linux 在每次需要失效时都会使整个
    TLB失效，后来在某些情况下扩展为使单页翻译失效。然而，在 Sparc 上，这种两级粒度是不够的。


    Sparc 上需要更细粒度失效的原因是 TLB 的大小和复杂性。在 Intel 80x86 和 Alpha 上，TLB 仅由片内 TLB 组成，可以快速失效并重新填充。因此，虽然需要注意，但
    TLB 失效在这些架构上通常不是性能问题。相比之下，在某些 Sparc 硬件上，CPU 使用内存中的哈希表来扩展片内 TLB，失效这种操作要昂贵得多。


    因此，Sparc 和 PowerPC 内存内 TLB 扩展对 TLB 失效需要更精细的粒度控制。内存内 TLB 大得多——有数千或数百万条目，而片内 TLB
    最多只有数百条目。


    类似的粒度问题也涉及缓存一致性代码，导致了以下刷新缓存和 TLB 条目的接口：


    ```

    flush_cache_all(), flush_tlb_all(): 在异常情况下刷新所有条目（启动时和内核映射本身改变时）。

    ```


    ```

    flush_cache_mm(), flush_tlb_mm(): 当进程发生剧烈变化（如执行新的二进制镜像）时，刷新整个进程和 TLB。

    ```


    ```

    flush_cache_range(), flush_tlb_range(): 刷新进程中的范围页，用于当进程映射部分因新映射而改变时。

    ```


    ```

    flush_cache_page(), flush_tlb_page(): 刷新单页。

    ```


    在硬件处理缓存一致性的硬件上，缓存刷新操作将为空操作（no-ops）并被编译器移除。同样，在大多数带有片内 TLB 的 CPU 上，TLB 范围失效通常会使整个进程
    TLB失效——复杂的部分失效并不需要（硬件也不支持）。


    Linux/Sparc 现在和 Alpha 端口一样，是 Linux 最稳定的平台之一，并应用于现实场景¹²


    ¹²截至 1996 年 11 月，Linux 特定的列表树已由 vger.rutgers.edu 上运行 Linux 的 Sparc sun4m 机器处理。

    '
