- md: '

    ## Introduction


    This thesis is an introduction to the portability issues of the Linux kernel.
    It is not only meant to be my Masters thesis, I hope it will actually be useful
    for people who want to port Linux to other architectures, or for people who just
    want to know the design issues and goals of Linux on different platforms (as opposed
    to the more general goals of Linux in general).


    In an attempt to make this practical, I try to explain the general issues, usually
    followed by a comment on one or more specific ports with some pointers on what
    is implemented in practice¹.


    Note that the term “Linux” is often used to denote the whole system that is built
    up from the basic kernel and all the system and user applications that are usually
    running on top of the kernel, in the context of this thesis only the kernel itself
    is considered. The portability of system and user applications is here considered
    a totally different issue, even though there are obviously some common concerns.


    Also, you should not expect this to be a line-by-line (or very low-level) explanation
    of the kernel — rather the opposite. Instead of trying to explain what all the
    specific functions do, this paper tries to explain the basic ideas, and the specific
    examples should be seen as just clarifying how Linux works on some specific hardware
    in software case.


    The thesis generally follows a common format: each section first explains the
    generic problems and potential solutions, to then be followed by an “Implementation”
    section that gives Linux-specific implementation details. The reader should be
    able to follow the text with little or no knowledge of Linux itself, although
    a general knowledge of the issues is obviously expected.


    ## History of Linux portability


    People who have followed Linux from the very beginning may find the title of this
    paper, “Linux: a Portable Operating System”, a rather ironic statement. Being
    portable was not what Linux was initially; the early versions of Linux were extremely
    unstable.


    > ¹For the same reason this paper will also be available in an electronic version
    which I will try to keep up-to-date as people send comments or changes to the
    system occur. Linux is by no means a static system, and some of the issues, especially
    when it comes to multiple CPUs, are so young that major changes can still happen.


    The original Linux was not only extremely PC-centric, wallowed in features available
    on PCs and was totally concerned with most portability issues other than at a
    user level. The original Intel 80386 architecture that Linux was written for perhaps
    the example of CISC design, and has high-level support for features other current
    CPUs would not even dream about implementing (see for example [CG87]).


    Linux did not even try to avoid the x86 features available to those early versions
    — quite the opposite. Linux started out as a project to find out what you could
    do with the CPU, and as it used just about every feature of the CPU you could
    find ranging from segments for inter-process protection to hardware assisted process
    switching.


    However, the initial undoubt approach was a case of an unportable implementation
    rather than an inherently unstable design. The goal of being compatible with other
    UNIXs resulted in a system that had portable interfaces the implementation details.
    That portable design essentially made Linux itself reasonably portable.


    The first Linux that was based on an architecture different from the Intel 80386
    was the port of Linux to the Motorola 680x family that actually got rather early
    in the development of Linux. However, the original Linux/68k project was not really
    concerned with portability, but rather with making Linux run on 68k-based Amiga
    and Atari computers.


    Please note here the fundamental difference between the concepts of "portability"
    and "ability to run on different architectures". A portable program is designed
    and implemented in such a way that it will run on different systems, while even
    a non-portable program can be forced to run on other systems. The original Linux/68k
    project did not try to make Linux portable, only it tried to re-write the kernel
    so that the new version would run on a new architecture instead of the original
    one.


    While the Linux/Alpha project was in itself a huge step forward, the portability
    work began when the author was offered an Alpha system by Digital in the hope
    of making Linux on the new Alpha architecture. Very early it became clear that
    in order to be able to maintain both the stable Intel-based platform and support
    a new and in some respects radically different platform the kernel needed some
    major re-engineering to make it fundamentally more portable. The issues and the
    end result is what is described in this paper.


    The current situation is that the Alpha port has been totally successful, and
    is in wide use and fully integrated into the main kernel sources. At the same
    time, the portability issues have not only been considered from the viewpoint
    of the Alpha port, but on a more general scale. As a result, other porting efforts
    are much easier, and the original Linux/68k project has updated its base to the
    new portable layout and an integration of that work is in progress [Law97].


    In addition to the Alpha and 68k ports, the port to the Sparc architecture has
    also been very successful and is also in active day-to-use and mostly integrated
    into the base sources. In addition to these four there are also ports to other
    architectures, including the MIPS [Bai96], PowerPC [Dou96] and the ARM (StrongARM)
    [Kin96] lines of CPUs.


    At the same time the Linux kernel has been ported to virtual environments like
    the Mach [App99] and L4 microkernels [Hoh96]. In those environments the Linux
    kernel is running on top of another kernel that provides another view of the physical
    machine, to potentially get the best of worlds.


    ## Portability concerns


    Unlike some other software products, an operating system does not have any inherent
    reason for existing: the role of an operating system is only to be the interface
    between user who do the real work and the hardware it is to be done on. An OS
    without viable user programs is useless, and an OS that does not work with the
    hardware available is likewise pointless. The worth of an OS is measured in how
    well it supports user processes, and how well it can implement the services it
    provides on the hardware.


    As such, the kernel itself is defined by both the hardware-it runs on and the
    software it supports (Figure 1). When writing the OS and porting it to a new architecture,
    both parts of the equation should be taken into account. The person doing the
    port seldom gets to choose his or her own idealized hardware, and similarly the
    porting effort may be constrained by user level


    | User and System Software Interface |

    | :--- |

    | The Kernel |

    | Hardware Interface: CPU and I/O |


    Figure 1: The Kernel: the Interface between user and hardware


    On the hardware side, the concerns can be roughly divided into two categories:
    the architecture of the CPU subsystem (including memory management, caches and
    optionally multiprocessing details) and the architecture of the I/O interfaces.
    On the other hand, the software side problems are generally with regard to compatibility:
    to what extent (if any) we want to be compatible with other, possibly similar,
    operating systems.


    However, more important than the hardware and software porting details themselves
    is having a general design that makes it easy to be portable. It should allow
    for easy addition of new interfaces (both on the software and the hardware side)
    without impacting existing code. In the case of Linux, this is especially important
    due to the wide development that is done: a distributed development community
    with no direct face-to-face contact between developers and little central authority
    to resolve conflicts.


    While the design porting efforts should be able to work without impacting each
    other, general maintenance concerns require extensive sharing of code. If the
    different architectures end up doing everything on their own with very little
    code, the whole goal of portability has been lost; the different platforms may
    be well considered separate projects.


    For maintenance reasons the architecture-specific code needs to be small and simple,
    and all the complex functionality should be handled by architecture-independent
    code that is shared across all platforms. This, in turn, requires a common concept
    shared across all architectures. That concept is the virtual machine.


    ## The virtual machine concept


    The most common approach to creating a portable system that has to be able to
    adapt to different hardware and software requirements is to use the concept of
    a virtual machine [GC94, p. 70], [Tan92, p. 22].


    Instead of having separate architectures that all would have to be handled separately,
    the idea of the virtual machine is to create an idealized abstraction of the machine,
    and that abstraction let the common code operate on the real hardware. The common
    code does not itself be aware of the actual hardware details, and such can operate
    on any physical hardware as in Figure 2.


    The idea of a virtualized machine is not new in itself: just the fact that the
    operating system is generally written in some high-level language is itself a
    virtualization of the underlying hardware with the help of the compiler that does
    the translation from the high-level language to the hardware-specific code.


    With the virtual machine abstraction, we only extend the virtualization already
    offered by the high-level language to something that can handle the details needed
    to implement the kernel on top of the actual physical hardware. While most high-level

