    多级页表不仅是解决页表问题的良好通用答案，它还可以轻松地与实际硬件紧密映射，使得从虚拟机到物理机的的页表映射易于实现。事实上，通过选择正确的虚拟机页表设置，内核虚拟机和物理内存管理单元可以使用相同的页表。在这些情况下，映射开销显然为零。


