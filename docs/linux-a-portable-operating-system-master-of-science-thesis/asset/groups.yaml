    ## 引言


    本论文旨在介绍 Linux 内核的可移植性问题。它不仅是为了作为我的硕士论文，我希望它能真正对那些想要将 Linux 移植到其他架构的人有用，或者对那些只想了解
    Linux 在不同平台上的设计问题和目标的人（相对于 Linux 本身的更通用目标）有用。


    为了使这些内容具有实践意义，我尝试解释通用问题，随后通常会针对一个或多个特定的移植案例进行评论，并对实践中实现的内容提供一些提示¹。


    请注意，在本文背景下，“Linux”一词通常指的是由基本内核以及通常运行在内核之上的所有系统和用户应用程序构建的整个系统；而在本文的语文中，仅考虑内核本身。系统和用户应用程序的可移植性在这里被视为一个完全不同的问题，尽管它们显然存在一些共同的关注点。


    此外，你不应该期望这是一篇对内核进行逐行（或非常底层）的解释——恰恰相反。本文论文并不是试图解释所有特定函数的功能，而是试图解释基本概念，具体的示例应被视为仅说明
    Linux 在软件层面如何在某些特定硬件上运行的。


    论文通常遵循一种通用格式：每个章节首先解释通用问题和潜在解决方案，然后是一个“实现”部分，给出 Linux 特有的实现细节。读者应该能够在对 Linux 本身几乎或完全不了解的情况下跟随文本，尽管显然要求读者对这些问题有通常了解。


    ## Linux 可移植性历史


    从一开始就关注 Linux 的人可能会发现这篇论文的标题“Linux：一种可移植的操作系统”是一个相当讽刺的陈述。可移植并不是 Linux 最初的特质；早期
    Linux 版本极其不稳定。


    > ¹ 出于相同的原因，本文将以电子版提供，当人们发送评论或系统发生变化时，我会尝试保持其更新。Linux 绝不是一个静态系统，某些问题（特别是涉及多路 CPU
    的问题）还非常新，仍然可能发生重大变化。


    原始的 Linux 不仅极度以 PC 为中心，沉溺于 PC 提供的功能，而且除了用户级之外，完全不关心大多数可移植性问题。为 Linux 编写的原始 Intel
    80386 架构可能是 CISC（复杂指令集）设计的范例，并且对其他当前 CPU 甚至梦都不敢想实现的功能具有高级支持（例如参见 [CG87]）。


