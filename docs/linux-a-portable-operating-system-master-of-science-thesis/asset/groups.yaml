  - '[PAGE 42]


    Because of the scaling concerns, the other main type of multiprocessor has a distributed
    main memory, with each CPU having a local memory (see Figure 14). The memory bus
    is no longer a common bottle-neck, and the CPU''s are more independent of each
    other. As a result, performance of such a machine scales to much higher number
    of processors. The common term for these machines is MPP (Massively Parallel Processing).


    It should be noted that physical distribution of memory does not necessarily imply
    that all the processors have logical address spaces. Many MPP-type machines provide
    for inter-processor communication through a globally addressable memory space.
    These kinds of distributed shared-memory machines are often called NUMAs for Non-Uniform
    Memory Access; all the memory is globally accessible, but depending on how far
    away the CPU is from the memory access differs. In that context SMP machines are
    generally called UMA (Uniform Memory Access).


    Because the two approaches to multipiprocessing result in fundamentally different
    behavior in memory accesses, the Linux kernel has two totally separate strategies
    for handling these matters.


    # 4.4.1 Symmetric multi-processing


    While porting an operating system from one CPU architecture to another at first
    appears all different from the issue of running the operating system on multiple
    CPU''s, the issues concerned are really basically the same. In both cases it is
    a matter of making the operating system run efficiently on a new hardware configuration.


    To some degree even the problems are similar: the issues of initial bootstrapping
    of the system and the hardware details regard to inter-processor signalling in
    some respects similar to a port to another architecture. Similarly, the cache
    coherency issues in an SMP environment could be seen as an extension of the cache
    coherency issues that can be seen with virtual caches and DMA on uniprocessor
    systems.


    But even there are similarities between porting an operating system to a new CPU
    architecture and a "port" from a single CPU to multiple CPU''s, multiprocessing
    adds a few unique problems. The main issues are


    +   - Data structure consistency; the need to protect internal kernel data structures
    from simultaneous accesses by multiple CPU''s, generally through some synchronizing
    primitive.'
  - '[PAGE 43]


    +   * Allowing application programs to take full advantage of the presence of
    multiple processors.


    In addition to the above, symmetric multiprocessing also exposes some other caches
    that are internal to the CPU, notably the virtual memory address translation (commonly
    known as a Translation Lookaside Buffer or TLB). Keeping the TLB synchronized
    with the current virtual memory mapping is trivial on a single-CPU system, because
    there is only one CPU that changes the translation, and it does so under very
    controlled circumstances.


    With multiple CPU''s, the virtual memory mapping changes have to be broadcast
    to any other CPU that may be using that mapping, and the CPU''s have to invalidate
    the mapping before the original CPU can be sure that it can safely drop the old
    map.


    Finally, with multiple CPU''s sharing the same memory, the ordering of memory
    accesses is important. With caches between the CPU''s and the system memory, the
    order in which any update from one CPU arrives at another CPU is is by no means
    obvious. Especially in high-speed implementations where writes can be delayed
    on one CPU and the reading CPU may do aggressive pre-fetching of memory data are
    ordering issues very important.


    #  Implementing an SMP kernel


    The most obvious problem with any multiprocessing environment is the need to protect
    internal data structures from being changed by multiple different processors in
    an unpredictable manner. What makes the problem subtler is the fact that while
    unprotected data structures can be a major problem, the actual symptoms are generally
    rarely seen and hard to reproduce.


    The basic problem is updating non-trivial data structures cannot generally be
    done atomically, and some way of protecting other processors so that they do not
    see partially done updates is needed. While in some cases the problem can be minimized
    through using appropriate data structures where the final update can be done with
    one atomic update (so-called self-locking or lock-free data structures [PLJ94]),
    the generic answer is to protect the update through the use of locking.


    However, using locks to avoid race conditions on data structures has its own set
    of problems — deadlocks and performance. Fine granularity locking can noticeably'
  - '[PAGE 44]


    impact performance if the operating system spends much time acquiring the necessary
    locks, and care must be taken that there is no possibility for circular lock dependencies
    resulting in deadlocks.


    To make matters worse the issues of deadlocks and race conditions are often not
    well understood by long-time programmers. Current programming languages and paradigms
    have well resulted in most programmers having a very linear view of what happens
    in any given program, and concurrency is generally not well understood. As a result,
    any synchronization method must be simple enough to understand that subtle pitfalls
    do not make kernel programming too hard.


    The current Linux kernel approach to kernel locks has to adapt the simplistic
    approach of just one kernel lock. This approach is similar to the non-reentrant
    approach of traditional uniprocessor UNIX — where a process running in kernel
    mode is never pre-empted by another process. The single-lock approach simply extends
    this requirement to multiple CPUs. Each time a kernel service is requested, the
    kernel lock must be acquired before entry into the kernel, and as a result internal
    data structure integrity is trivially ensured.


    While the one lock approach is sufficient for ensuring data structure integrity
    and does not lead to deadlock situations, it does have some obvious scalability
    problems. The approach is fine for a limited number of CPUs'' with computing loads
    that spend most of their time in user space with only very occasional excursions
    into kernel mode, but it scales badly and has bad behavior for kernel-intensive
    jobs.


    As a result, the current Linux kernel is not expected to be truly useful in SMP
    environments of more than 2-4 CPUs''s, and one of the current concerns is what
    the best balance of locking is in the kernel. Work is in progress to split the
    one lock first into a few smaller locks, and later pinpoint contention spots in
    those.


    It is hoped that reasonable scalability can be achieved without excessive numbers
    of locks, especially as the current goal for good scalability is for reasonably
    few processors. While bus-based hardware can scale to more processors, cost-efficiency
    seems to be much higher for few processors and four processors currently seem
    to be a good goal. For really high-end hardware the solution is generally not
    SMP in any case (see chapter 4.2).'
  - '[PAGE 45]


    # 4.4.2 Massively parallel systems


    While small-scale SMP shared uniform memory machines are becoming common, they
    do not offer the scalability required for really high performance computing. With
    tens or hundreds of processors, massively parallel processing systems fill that
    niche, and Linux is increasingly attractive for these kinds of systems too.


    However, the hardware scaling considerations that make a uniform global memory
    access machine impractical for many processors also make the software locking
    approach to SMP scale better, practical concerns about deadlocks and lock granularity
    (see the previous chapter) make it questionable whether such an approach is viable.


    The software solution to the scaling problem is exactly the same as the hardware
    solution: de-coupling the nodes from each other. Instead of running the same operating
    system image on each and every node, each node gets a local copy of the operating
    system each node has its own memory storage. The different operating kernels communicate
    with each other over the high-performance internal network, but can at the same
    time be seen as independent entities.


    Note that SMP and MPP are in no mutually exclusive approaches, and one of the
    most interesting approaches is to combine the two into a hybrid system. Such a
    hybrid system would consist of multiple independent nodes connected together a
    high-performance network, where each node would contain a small number of processors
    in an SMP configuration.


    While such a hybrid system running Linux does not yet exist, actually there are
    two separate high-performance MPP projects using Linux as the base operating system.
    The first project was Beowulf [BSS95].


    > The Beowulf project at NASA CESDIS (Center of Excellence in Space Data & Information
    Sciences) research center aims to create cheap high-performance computing hardware
    through the use of common off-the-shelf hardware, and using Linux as the operating
    system. The nodes are built up from normal PC hardware, connected together with
    10 and 100Mbps eternets.


    The second project is being developed by the CAP research project at the Australian
    National University in Canberra [TMSW96]. In contrast to the Beowulf project,
    this AP1000+ system is a decidedly non-off-the-shelf MPP made by Fujitsu, using
    50MHz SuperSpar CPU’s. Rather than using off-the-shelf networking, the AP1000+
    has a powerful internal network with very low latencies and high-'
- md: '

    bandwidth. While the maximum configuration is able to incorporate 1024 of these
    CPU''s in one machine, Linux has so far run on only 16, 32 and 64-cell machines.


    Despite the very different hardware base and the differing aims of the projects,
    the basic approach has been similar in both projects. While some support for the
    MPP hardware has been added to the basic kernel, while most of the distribution
    is done in user space through standard parallel programming interfaces (Parallel
    Virtual Machine — PVM and Message Passing Interface — MPI). This way of the real
    complexity of a distributed environment can be handled at an appropriate level,
    leaving the kernel itself reasonably simple.


    Note that this approach is fundamentally different from distributed systems based
    on microkernels. Rather than handling the complexity of distribution at a low
    level in the kernel, the distribution is almost entirely in user space with only
    minimal kernel support. This allows for much greater flexibility, as the different
    nodes need not necessarily run the same operating system or have similar hardware.


    ## 4.5 Device drivers: accessing the I/O bus


    We have far only concentrated our attention on the CPU subsystem of the portability
    issue. To some degree the CPU subsystem is the most visible part of any architecture,
    and the I/O characteristics of the hardware are often overlooked. Thus, for example,
    we talk about Linux/Alpha and Linux/x86 — corresponding to the CPU architectures
    Linux has been ported to — but never over Linux/sbus and Linux/PCI and so on.


    One reason that the I/O architecture is often overlooked is that it should never
    be seen directly by application programs. While people are used to having separate
    versions of their binaries for different CPU architectures, the same is not true
    when it comes to I/O. The I/O details are expected to be totally hidden by the
    operating system, and while differences in the I/O architecture is expected to
    make a difference for performance, it is not expected to switch itself other way.


    Yet, despite this lack of user attention, the I/O details can easily be the largest
    part of any portability effort. While compilers and virtual machine abstractions
    can hide the CPU details quite effectively, there are generally no “I/O-compilers”
    available to hide the details of various devices. As a result, much of the driver
    portability work has to be done by hand, from scratch


    What often makes the issue even thornier is the lack of documentation on the details
    of the I/O architectures. While all the relevant details of a new CPU architecture
    are generally readily available in just one or two architecture manuals from the
    manufacturer of the CPU, the same is seldom true of the I/O details. Often the
    person doing it is forced to gather the information from many separate (and often
    incomplete) sources.


    ### 4.5.1 Proprietary busses


    Making the issue of I/O architecture portability harder is not so much the general
    complexity of the architecture, as the sheer overwhelming volume of details pertaining
    to the I/O subsystem. Only a few years ago, every major manufacturer had their
    own I/O bus standards (and had several different standards), the same way they
    had their own CPU architecture.


    But the CPU is well-defined, the I/O architecture is not only defined by the details
    of actually driving the physics bus, but it is also defined by the devices connected
    to the bus. Often thousands of devices with no common interface must be supported.
    Unlike the CPU, most of these devices tend to fail modes that have to be handled
    and recovered from.


    In fact, so overwhelming is the amount of device code that almost exactly half
    of the current Linux kernels are composed of device drivers. While few of the
    drivers on their own are overly complex they are numerous, and a large portion
    of the porting effort has been won with device driver work.


    Making all the problems worse is the fact that common code shared between drivers
    is usually very scant. There exists common driver layers, but much of the common
    driver layer is not so much concerned with the driver itself as with the common
    interface all drivers have to show to the rest of the world.


    One example of a generic driver is the UNIX tty the layer concerned with serial
    input devices like a keyboard or a character terminal. This layer contains generic
    code that is required for any tty device—character translation, session handling
    and actions to be taken on exceptional events like a hang-up of the line. However,
    the entire common code is concerned with issues that are needed for generic UNIX
    compatibility, not so much the low-level details of the actual device.


    Happily, some real standards do exist in the jungle of I/O handling. The main
    such standard is the SCSI (Small Computer Systems Interface), which offers a common
    hardware bus standard used by various devices ranging from magnetic and optical
    disks to scanners and tape drives. While the SCSI standard does not specify the
    actual programming interface as seen by the operating system, the common standard
    allows for common code to be shared across different SCSI adapter drivers.


    ### 4.5.2 PCI — the emerging standard


    While the situation with respect to I/O architectures is very complex, and very
    little code can generally be shared between different I/O subsystems, the last
    few years have introduced a new standard that may put one an end to at least some
    of the chaos. That new standard is the PCI (Peripheral Component Interconnect)
    bus standard introduced by Intel and other computer companies.


    What is interesting about PCI is not the technology itself, but rather the potential
    for a reasonably common standard. Already, PCI has been revolutionary in that
    it has been to attract many different vendors to use the same standard rather
    than continue to use proprietary standards not shared with anybody else. Though
    PCI initially was embraced mainly by PC manufacturers, the large body of available
    PCI-compliant hardware that it resulted in made PCI an extremely attractive proposition
    to other vendors.


    Currently, PCI is used both by x86-, PowerPC- and Alpha-based systems, and later
    Sun has announced that PCI-based Sparc workstations are going to be available
    in early 1997. What is so impressive about this list is that these four major
    architectures not only happen to be the primary Linux platforms, they also account
    for a large portion of the modern CPU market. As such, PCI may reduce the amount
    of I/O architecture portability work noticeably.


    It should be noted that a move to PCI makes the portability issues of the actual
    I/O bus interface easier, and it is by no means the answer to all problems. Most
    notably the very large PC hardware market not only made PCI a viable standard
    in the first place, it has also resulted in unprecedented numbers of different
    adapter cards being available for PCI. As such, while there is a common bus that
    avoids one level of portability problems, it certainly has not taken away the
    wide variety of adapters, and thus the need for device driver development in the
    future.


    ## 5 Example Architectures


    While Linux currently supports seven architectures to some degree or other (Digital
    Alpha, 80x86, Motorola 68k, MIPS, PowerPC, Sparc, Acorn ARM), three of those architectures
    stand out by having a fundamental impact on Linux portability.


    The original Intel platform was obviously the base of any Linux work: it offers
    cheap and ubiquitous hardware and is by far the most popular Linux platform and
    the one most development done on.


    At the same time, the Digital Alpha platform stands out as a modern 64-bit hardware
    base, and being the first target of a Linux port. Together with the Sparc architecture,
    these two architectures have defined most of the Linux so far.


    ### 5.1 The Alpha


    The Digital Alpha architecture is one of the most recent RISC designs in the industry,
    and thanks to extensive support from Digital Corporation, was the first non-Intel
    architecture supported popularly by Linux.


    What makes the Alpha such an intriguing platform for Linux is not only the high
    performance of Alpha-based computers, but also the fact that an Alpha port was
    the ideal second platform from a portability standpoint. Not only is the Alpha
    architecture fully 64-bit both from an arithmetic and a memory standpoint, it
    is a very aggressive RISC architecture that looks very different from the original
    platform for Linux, the Intel x86.


    What made the Alpha an even better portant target was the fact while having a
    markedly different CPU architecture, Digital was one of the first to embrace PCI
    as the standard for the I/O bus hardware for non-PC markets. As a result the initial
    project did not have overly concern with device driver issues, allowing the project
    to concentrate on the design of the CPU architecture itself.


    The Linux/Alpha portant project actually started out as two separate and independent
    projects: one pilot project inside Digital itself to prove that Linux could run
    on Alpha hardware, while at the same time the author was given access to Digital
    Alpha machines for another port.


    While early portant effort inside Digital was concerned with making Linux run
    on the Alpha (somewhat akin to the original Motorola 68k Linux project), work

