    由于扩展性问题，另一种主要类型的多处理器具有分布式主内存，每个 CPU 都有自己的本地内存（见图 14）。内存总线不再是常见的瓶颈，且 CPU 之间更加独立。因此，这种机器的性能可以扩展到多得多的处理器。这些机器的通用术是
    MPP（大规模并行处理）。


    需要注意的是，内存的物理分布并不意味着所有处理器都具有逻辑地址空间。许多 MPP 类型的机器通过全局可寻址的内存空间提供处理器间的通信。这类分布式共享内存机器通常被称为
    NUMA（非统一内存访问）；所有内存都是全局可访问的，但取决于 CPU 距离内存的远近，其访问速度会有所不同。在这种背景下，SMP 机器通常被称为 UMA（均一内存访问）。


    由于两种多处理器处理方法在内存访问上导致了根本不同的行为，Linux 内核采用了两套完全不同的策略来处理这些问题。


    ## 4.4.1 对称多处理器处理


    虽然将操作系统从一个 CPU 架构移植到另一个架构起初看起来与在多个 CPU 上运行操作系统的问题完全不同，但所涉及的问题本质上是相同的。在这两种情况下，都是为了让操作系统在新的硬件配置上高效运行。


    在某种程度上，甚至问题都是相似的：系统初始引导的问题以及关于处理器间信号传递的硬件细节在某些方面与移植到另一个架构相似。同样，SMP 环境下的缓存一致性问题可以被看作是单处理器系统中虚拟缓存和
    DMA 常见的缓存一致性问题的扩展。


    但尽管如此，将操作系统移植到新的 CPU 架构与从单 CPU 到多 CPU 的“移植”之间也存在相似之处，不过多处理器处理增加了一些独特的问题。主要问题是：


    - 数据结构的一致性；需要保护内部内核数据结构免受多个 CPU 的同时访问，通常通过某些同步原语来实现。

    - 允许应用程序充分利用多个处理器的存在。


    除了上述点外，对称多处理器处理还暴露了某些 CPU 内部的其它缓存，特别是虚拟内存地址翻译（通常称为转换检测表缓冲区，即 TLB）。在单 CPU 系统上，保持
    TLB 与当前虚拟内存映射同步是轻而易举的，因为只有一个 CPU 会更改翻译，而且是在非常受控的情况下进行的。


    在多个 CPU 的情况下，虚拟内存映射的变化必须广播给任何可能使用该映射的其他 CPU，且 CPU 在原始 CPU 确定可以安全丢弃旧映射之前，必须失效该映射。


    最后，由于多个 CPU 共享相同的内存，内存访问的顺序至关重要。由于 CPU 和系统内存之间存在缓存，从一个 CPU 的任何更新到达另一个 CPU 的顺序绝非显而易见。特别是在高速实现中，写入可能在一个
    CPU 上被延迟，而读取 CPU 可能会对内存数据进行激进预取，这些问题变得非常重要。


    ## 实现 SMP 内核


    任何多处理器环境中最显而易的问题是需要保护内部数据结构不被多个不同的处理器以不可预测的方式更改。使问题变得更加微妙的事实是，虽然未受保护的数据结构可能是一个大问题，但实际症状通常罕见且难以重现。


    基本问题是，更新复杂的数据结构通常无法以原子方式完成，因此需要某种方法保护其他处理器，防止它们看到部分完成的更新。虽然在某些情况下，通过使用适当的数据结构可以将问题降至最低，其中最终更新可以通过一次原子更新完成（即所谓的自锁或无锁数据结构
    [PLJ94]），但通用的答案是通过使用锁来保护更新。


    然而，使用锁来避免数据结构上的竞态条件也有自己的问题——死锁和性能。如果操作系统花费大量时间获取必要的锁，细细粒度锁定会对性能产生显著影响，而且必须确保不会出现循环锁依赖导致死锁。


    更糟糕的是，长期从事编程的程序员往往并不很好理解死锁和竞态条件问题。目前的编程语言和范式产生了一种结果，即大多数程序员对任何给定程序中发生的情况持有非常线性的观点，而并发性通常没有被良好理解。因此，任何同步方法必须足够简单理解，以至于微妙的陷阱不会让内核编程变得太难。


    当前 Linux 内核处理内核锁的方法必须适应仅使用一个内核锁的简单方法。这种方法类似于传统单处理器 UNIX 的非重入方法——即运行在内核模式的进程永远不会被另一个进程抢占。单锁方法简单地将这一要求扩展到多个
    CPU。每当请求内核服务时，在进入内核之前必须获取内核锁，因此内部数据结构的完整性得到了轻而易举的保证。


    虽然单锁方法足以确保数据结构的完整性且不会导致死锁情况，但它确实存在明显的扩展性问题。这种方法对于 CPU 数量有限且计算负载大部分时间在用户空间运行、仅偶尔进入内核模式的系统来说是可行的，但对于内核密集型任务，它的扩展性差且表现不佳。


    因此，当前的 Linux 内核预计不会在超过 2-4 个 CPU 的 SMP 环境中真正有用，目前的关注点之一是内核中锁的最优平衡是什么。目前正在努力将一个锁首先拆分为几个较小的锁，随后确定这些锁中的竞争热点。


    希望在不使用过数量锁的情况下实现合理的扩展性，特别是目前良好扩展性的目标是针对较少量的处理器。虽然基于总线的硬件可以扩展到更多处理器，但对于少数几个处理器来说，成本效益似乎高得多，目前四个处理器似乎是一个良好的目标。对于真正的顶端硬件，解决方案在任何情况下通常都不是
    SMP（见第 4.2 节）。


    ## 4.4.2 大规模并行系统


    虽然小规模 SMP 共享均一内存机器变得常见，但它们无法提供真正高性能计算所需的扩展性。通过数十或上百个处理器，大规模并行处理系统填补了这一空白，Linux
    对于这些类型的系统也越来越具有吸引力。


    然而，使得均一全局内存访问机器对许多处理器变得 Practical 的硬件扩展性考虑，也使得 SMP 的软件锁方法扩展得更好，但关于死锁和锁粒度的实际担忧（见前一章）使得这种方法的可行性存疑。


    扩展问题的软件解决方案与硬件解决方案完全相同：将节点相互解耦。不是在每个节点上运行相同的操作系统镜像，而是每个节点获取操作系统的本地副本，每个节点都有自己的内存存储。不同的操作系统内核通过高性能内部网络相互通信，但同时可以被视为独立的实体。


    注意，SMP 和 MPP 并不是互斥的方法，最有趣的方法之一是将两者结合成一个混合系统。这种混合系统将由连接到高性能网络的多个独立节点组成，每个节点将包含处于
    SMP 配置的少量处理器。


    虽然运行 Linux 的这种混合系统尚不存在，但实际上有两个以 Linux 为基础操作系统的独立高性能 MPP 项目。第一个项目是 Beowulf [BSS95]。


    > NASA CESDIS 研究中心的 Beowulf 项目旨在通过通用现成硬件创建廉价的高性能计算硬件，并使用 Linux 作为操作系统。节点由普通 PC
    硬件构建，通过 10Mbps 和 100Mbps 以太网连接在一起。


