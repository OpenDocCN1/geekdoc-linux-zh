    Please note here the fundamental difference between the concepts of "portability"
    and "ability to run on different architectures". A portable program is designed
    and implemented in such a way that it will run on different systems, while even
    a non-portable program can be forced to run on other systems. The original Linux/68k
    project did not try to make Linux portable, only it tried to re-write the kernel
