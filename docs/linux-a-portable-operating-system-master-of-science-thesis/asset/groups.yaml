    order changes have to be handled by hand by the programmer rather than let the
    compiler sort it out.


    ## Alignment and byte order — implementation


    As with type sizes, both alignment restrictions and byte order issues have their
    own header files that allow the kernel virtual machine to use any alignment or
    byte order. The virtual machine is known to always trap on unaligned memory accesses,
    and if an access is known to be unaligned at compile time it can be handled by
    a simple inline function that does the extra work to load an unaligned datum as
    two aligned loads⁶.


    However, the alignment of many accesses cannot be known at compile time. To be
    safe, all these accesses would need to be done with the potentially complex unaligned
    access function, and would impact performance negatively especially in cases where
    unaligned accesses are rare. This is especially true with many user level accesses,
    where the user-supplied pointer is almost aligned, but can potentially be unaligned
    in some special cases.


    To handle these kinds of rarely unaligned accesses efficiently, the kernel virtual
    machine assumes accesses are aligned and if an unaligned trap occurs, the trap
    handler will fix up the occasional unaligned case. Trapping will be much more
    expensive than handling the unaligned cases explicitly, but if the unaligned accesses
    are rare this works out well. To make the user is aware of the potential performance
    degradation the system will print a warning when an unaligned fault has to be
    handled. Under normal circumstances these messages are never seen.


    Note that some code, notably the networking code, will actively try to align all
    the data but will not guarantee that the structures are always aligned. This is
    a prime example of code where the optimistic unaligned trap working effectively.


    When it comes to byte order, the virtual machine makes no assumptions about the
    native byte order of the machine. Indeed, in most cases byte order simply does
    not matter. However, in cases where byte order matters (on-disk layout with a
    specified byte order, or networking code, for example), the functions exist to
    convert the CPU byte order and from both little-endian and big-endian⁷.


    > ⁶On hardware where alignment does not matter, the inline function obviously
    needs to do any extra work, so there is no overhead for architectures that handle
    unaligned accesses in hardware.


    > ⁷Little-endian byte order is used mainly by various file systems and device
    drivers that use the standard PC byte order, while big-endian byte order is used
    by the Internet networking protocols.


    ## Unresolved issues


    Especially when it comes to alignment all the issues are still not resolved completely.
    While handling the uncommon unaligned cases through trapping is efficient and
    guarantees the correct behavior even in the presence of potentially unaligned
    data, this particular design decision may have to be re-thought.


    The problem with the current virtual machine design is that there exists various
    hardware implementations that do not conform to the hardware model expected by
    this virtual machine design. Most notably, the design *requires* that the hardware
    supports unaligned accesses through trapping, and that may not always be the case.


    While most hardware conforms to the expectations of this virtual machine model,
    there are cases where the CPU may handle unaligned memory accesses by simply ignoring
    the low address bits rather than trapping on access. This is one example of choosing
    the wrong virtual machine concept can result in problems that may require a redesign
    in the future.


    The other unresolved issue regarding unaligned data is the state of the compiler
    support for the concept of unaligned accesses. While the current virtual machine
    depends on explicit programmer action to support unaligned accesses, a future
    version might depend on compiler directives to let the compiler automatically
    create the necessary code to handle the unaligned accesses. Such compiler support
    already exists to some degree, and can be hide from the programmer the same way
    the issues of type size have been hidden.


    ## 4.2 Kernel memory management


    One of the most complex areas in the kernel in general, and with regard to portability
    in particular, is the virtual memory management.


    - Memory is one of the most fundamental resources in the system, and as such the
    performance of the memory management layer is critical to the system. Making memory
    management efficient is thus of primary importance: not only do the routines have
    to be fast, they have to be clever too, sharing physical pages aggressively in
    order to get the most out of a system.

    - The memory management code is also fraught with race conditions and deadlocks,
    and trying to share as much of the complex memory management routines as possible
    would be a good thing in order not have to maintain multiple separate copies of
    this complexity.


    However, to make matters worse, memory management is typically one of the areas
    where there are absolutely no hardware standards, and different CPU''s use very
    different means of mapping virtual addresses into physical memory pages. As such,
    memory management is one area where traditionally usually very architecture-dependent,
    and only very high-level code has been shared across architectures even though
    we would like to share a lot more.


    ### Virtual address:


    While the generic virtual to physical memory mapping can be seen as any function
    that maps a virtual address into a physical address, extreme performance requirements
    mean the function has to be reasonably simple. In fact, on a low level all CPU''s
    use a on-chip virtual memory caching usually called a TLB (Translation Lookaside
    Buffer), and in the end virtual memory mapping schemes translate into filling
    this cache with the appropriate translation information.


    | L1 Index | L2 Index | Offset in page |

    | --- | --- | --- |

    | L1 | L2 | Page table | Physical page |


    Figure 8: Two-level page table tree


    While any mapping strategy is possible, current CPU''s tend to handle the virtual
    memory translations in three different ways: with page table trees, with hash
    tables or with a pure software-fill TLB. But even when the basic approach is similar
    in two architectures, the low-level details are often different.


    Depending on the memory management unit, the page tables may contain extra information
    aside from the necessary protection and translation information. Some architectures
    support dirty and accessed bits, to be used by the VM routines to determine whether
    a user has written to a page or not, or whether the page has been recently accessed.
    Other architectures expect the operating system to keep track of this information
    by hand.


    For example, the original Linux platform, the Intel 8086, has a two-level page
    table tree (see Figure 8), and implements both dirty and accessed bits in hardware.
    In contrast, while the Digital Alpha by a system software viewpoint also has a
    normal page table tree, on the Alpha depth of the tree is two due to the larger
    virtual address space, and the Alpha lacks hardware support for dirty and accessed
    bits.


    On the other hand the Power-PC and some of the Sparc CPU''s do not have a real
    page table at all; they have a hash table that is used to look up the physical
    page that corresponds to a virtual address (Figure 9). If the page cannot be found
    in the hash table they try to swap. [Int93b]


    ### Virtual address:


    | Page Index | Offset in page |

    | --- | --- |


    Because hashed memory mappings generally cannot fully describe the virtual memory
    setup, they are more appropriately called in-memory extensions to the on-chip
    TLB so as not to confuse them with full pages.


    ![](img/5a9073ee2d3bb0d68f5895857e9cf9ca_29_0.png)


    Figure 9: Hashed-in-memory TLB extension


    Finally, MIPS CPU''s and the newest UltraSparcs from Sun do not have any architecture-specified
    page tables at all, they have the on-chip TLB and any miss in the TLB will result
    in a software trap to refill the TLB⁸ (or handle a page fault if no physical page
    is available for the offending virtual address). [Int93a]


    ## 4.2.1 Memory management through virtual page tables


    As seen above, no standard way of mapping virtual memory exists. Indeed, the Sparc
    line of CPU''s have used three different mapping strategies described above in
    different versions of the architecture. And yet, despite these fundamental differences
    in physical hardware we would like to use as much common as possible.


    The way this is achieved is by using a common virtual mapping scheme in the Linux
    kernel virtual machine (see chapter 1), and mapping that common memory management
    scheme onto the physical hardware. This allows us to share all memory management
