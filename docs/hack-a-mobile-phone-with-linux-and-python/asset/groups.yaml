    \ so that programs `minicom` can manipulate the connection effortlessly. Let's\
    \ try it out.\n\nFirst, edit /etc/bluetooth/rfcomm.conf so that it looks like\
    \ the following:\n\n```\nrfcomm0 {\n  bind no;\n  device 00:0e:6d:9a:57:48;\n\
    \  channel 1;\n  comment \"Example Bluetooth device\";n}\n```\n\nAfter stopping\
    \ and restarting the bluetooth service, run the following command:\n\n```\nrfcomm\
    \ bind /dev/rfcomm0\n```\n\nYou will see a `rfcomm0` /dev/under after executing\
    \ the above command. Now, you can set up `minicom` by running:\n\n```\nminicom\
    \ -s\n```\n\nThe only thing to do is to set the name of the device to connect\
    \ as /dev/rfcomm0. Save the new configuration as the default and invoke:\n\n```\n\
    minicom -m\n```\n\nMinicom is now ready to talk to your phone! Type in `AT` and\
    \ the program will respond with `OK`. Say you wish to make your phone number dial.\
    \ Just type:\n\n```\natdt 1234567;\n```\n\nThere are many other AT commands you\
    \ can experiment with; try googling for `mobile phone AT commands` or something\
    \ of that!\n\nAfter you have finished with your virtual port manipulations, you\
    \ should remove:\n\n```\nrfcomm release /dev/rfcomm0\n```\n\nto `release` the\
    \ serial-bluetooth link.\n\n# Python over a Bluetooth connection\n\nOnce you get\
    \ the serial port emulation working, there is another interesting hack to explore.\
    \ The Nokia Python distribution comes with a program called `bluetooth.py`. On\
    \ one console of your Linux machine, run the command:\n\n```\nrfcomm listen /dev/rfcomm0\n\
    ```\n\nNow run `bluetooth.py` on the phone. You will see that after a few seconds,\
    \ `rfcomm` will respond with a `connected` message. Once you get this message,\
    \ take another console and run:\n\n```\nminicom -m\n```"
- md: '

    # Mobile Phone with Linux and Python


    What do you do on the screen? A Python interactive interpreter prompt! You can
    now use in Python snippets and execute them on the phone-the-fly! Isn''t that
    cool?


    # Parting Thought


    I was curious to know how Microsoft''s Windows operating system works, famous
    for its ''ease of use''; would compare with Linux when it comes to interacting
    with it my Ngage QD. I installed the Windows driver for my no-name us-bluetooth
    dongle and tried it the Nokia PC suite up and running on an XP machine - maybe
    it''s because I am far more experienced in GNU/Linux than on MS operating systems,
    I found the XP experience less ''friendly'' than MS would care to admit. I believe
    that most of the ''user friendliness'' of the Microsoft operating system comes
    from hardware vendors and application developers tightly integrating the products
    with the platform rather than any inherent quality of the OS as such.


    # References


    For a general introduction to Bluetooth technology, see here http://www.dell.com/downloads/vectors/2003_bluetooth.pdf.
    An interesting paper on Bluetooth security is available at http://www.nikula.cs.ht.fi/-jiiw/bluesec.html.


    http://www.holtmann.org/ has plenty of information regarding Bluetooth and Linux;
    I found the document ''Bluetooth Programming for Linux'' (http://www.holtmann.org/papers/bluetooth/wic2003_slides.pdf)
    very informative.


    Lots of information about Python on series 60 modules is available at http://www.postneo.com/postwiki/moin.cgi/PythonForSeries60/.
    ObexFTP seems to be an interesting tool - you can get it from http://triq.net/obex/.
    There are some documents floating on the net which describe how you can do an
    NFS mount of your phone''s file system - try a google search for more info.


    Source/errata concerning this article will be available at http://pramode.net/ify-jun.

    '
  mdcn: '


    # 运行 Linux 和 Python 的手机


    你在屏幕上看到了什么？一个 Python 交互式解释器提示符！你现在可以使用 Python 代码段并在手机上即时执行！这难道不酷吗？


    # 结语


    我曾好奇微软以“易用性”闻名的 Windows 操作系统是如何运作的，并尝试在我的 Ngage QD 上将其与 Linux 的交互进行对比。我为我的无名 USB
    蓝牙适配器安装了 Windows 驱动，并尝试在 XP 机器上运行 Nokia PC 套件——也许是因为我对 GNU/Linux 的经验比对 MS 操作系统要丰富得多，我发现
    XP 的体验并没有微软所承认的那么“友好”。我相信，微软操作系统的大部分“用户友好性”实际上 实际上源于硬件供应商和应用程序开发者将产品与平台紧密集成，而不是操作系统本身的任何内在品质。


    # 参考文献


    关于蓝牙技术的一般介绍，请参阅：http://www.dell.com/downloads/vectors/2003_bluetooth.pdf。关于蓝牙安全的一篇有趣论文可以在
    http://www.nikula.cs.ht.fi/-jiiw/bluesec.html 找到。


    http://www.holtmann.org/ 有大量关于蓝牙和 Linux 的信息；我觉得《Linux 蓝牙编程》（http://www.holtmann.org/papers/bluetooth/wic2003_slides.pdf）文档非常有参考价值。


    关于 Series 60 模块上 Python 的大量信息可以在 http://www.postneo.com/postwiki/moin.cgi/PythonForSeries60/
    找到。ObexFTP 似乎是一个有趣的工具——你可以从 http://triq.net/obex/ 获取它。网上有一些文档描述了如何对手机文件系统进行 NFS
    挂载——可以尝试 Google 搜索获取更多信息。


    关于本文的来源/勘误可以在 http://pramode.net/ify-jun 获取。


    '
