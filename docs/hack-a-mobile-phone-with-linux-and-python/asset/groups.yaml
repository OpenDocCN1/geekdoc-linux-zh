- md: "\n# Hack a Mobile Phone with Linux and Python\n\nA mobile phone is a cool gadget\
    \ to play with, especially when I can run my favourite programming language (no\
    \ prize for guessing what it is!) on! That was the logic which made me purchase\
    \ a Nokia Series 60 smartphone, the N-Gage QD. This article describes experiments\
    \ I did with the mobile - setting up Bluetooth communication links, running Python/C\
    \ and emulating serial ports.\n\n## Bluetooth on Linux\n\nBluetooth is a short\
    \ distance communication standard. It is commonly used to facilitate data transfer\
    \ between PCs and cell phones/PDAs. The hardware which provides Bluetooth connectivity\
    \ to the PC is a small device called a _USB Bluetooth dongle_ which you can plug\
    \ into a spare USB port of your machine. I approached the locals electronics asking\
    \ for such a device and got one which didn't even have the manufacturer's name\
    \ on it. The driver CDM came with it which contained only Windows software. Deciding\
    \ to try my luck, I plugged the device on and booted my system Fedora Core 3 -\
    \ bluetooth service was started by executing:\n\n```bash\nsh /etc/init.d/bluetooth\
    \ start own```\n\nHere is the output when I commanded 'hcitfig' (which is similar\
    \ to the 'ifconfig' command to configure TCP/IP network interfaces):\n\n```\n\
    hci0: Type: USB\nBD Address: 00:11:B1:07:A2:B5 SCO MTU: 64:8\nUP RUNNING PSCAN\
    \ SCAN\nRX bytes:378 acl:0:0 events:16 errors:0\nTX bytes:309 acl:0:0 commands:16\
    \ errors:0\n```\n\nMy no-name Bluetooth dongle has been detected and configured\
    \ properly! The number 00:11:B1:07:A2:B5 is the Bluetooth address of the device.\n\
    \n## Detecting the mobile\n\nThe next step is to check whether Linux is able to\
    \ sense the proximity of the mobile. If your phone has bluetooth disabled, enable\
    \ it and run the following command (on the Linux machine):\n\n```bash\nhctool\
    \ scan\n```\n\nHere is the output obtained on my machine:\n\n```\nScanning ...\n\
    00:E6:6D:9A:57:48 Dijkstra\n```\n\nThe _Bluez protocol stack running on my GNU/Linux\
    \ has 'discovered' the Nokia N-Gage sitting nearby and printed its Bluetooth address\
    \ as the one which was assigned to: 'Dijkstra'.\n\n## Pairing the mobile\n\nFor\
    \ security reasons, some interactions with the mobile require the device to be\
    \ 'paired' with the one it is interacting with. First, a number (or more digits)\
    \ in the file /etc/bluetooth/pin (say 12345). Stop and restart the bluetooth service\
    \ by doing:\n\n```bash\nsh /etc/init.d/bluetooth stop\nsh /etc/init.d/bluetooth\
    \ start\n```\n\nNow initiate a 'pairing' action on the mobile (the phone will\
    \ tell you how this is). The software on the phone will detect the presence of\
    \ the Bluetooth-enabled Linux mask and ask for a code - you should enter the very\
    \ number you have stored in /etc/bluetooth/pin on the PC - the pairing process\
    \ will succeed.\n\n## Transferring files\n\nFiles are transferred to the Linux\
    \ machine using a high level protocol called OBEX (for ObjectExchange, originally\
    \ designed for Infrared links). First, you have to find out whether your mobile\
    \ supports OBEX based message transfer. Try running the following command on the\
    \ Linux machine (the number is the bluetooth address of the phone):\n\n```bash\n\
    sdptool browse 00:ee:6d:9a:57:48\n```\n\nYou might get voluminous output - here\
    \ is part of what I got:\n\n```\nService Description: OBEX Object Push\nService\
    \ RecordListHandle: 0x10005\nService Class ID List: (0x1105)\n\"OBEX Object Push\"\
    \nProtocol Descriptor List:\n\"LCG\" (0x0010)\n\"RFCOMM\" (0x0003)\nChannel: 9\n\
    \"OBEX\" (0x0008)\n```\n\nOBEX is built on top of a lower-level protocol called\
    \ RFCOMM. The ‘Object Push’ service uses RFCOMM ‘channel’ 9. Let's try to upload\
    \ a file to the phone; run the following command on the Linux machine:\n\n```bash\n\
    obex_push 00:ee:6d:9a:57:48 a.txt\n```\n\nThe phone will respond by asking you\
    \ whether to accept the message coming over the bluetooth link. The command, invoked\
    \ without any option, can be used to receive files from the mobile over the bluetooth\
    \ link (the corresponding ‘man’ page for more details).\n\n## Installing Python\n\
    \nNokia has done a port of Python to the ‘Series 60’ smartphones running the Symbian\
    \ operating system. The Python interpreter as well as a few important modules\
    \ are packaged into a single .sis file (somewhat like the Linux RPM file) which\
    \ can be obtained from http://www.forum.nokia.com/main/0_034-821.html. The file\
    \ to be installed PythonForSeries60_pre_SDK20.sis. The first step is to transfer\
    \ this file to the mobile via obex_push. Trying to open it in the Nokia installer\
    \ program running - it will ask you to install Python on the limited amount of\
    \ memory which phone has or to an additional MMC card (if one is present). Once\
    \ the installation is over, you will see a not-so-cute Python logo on the main\
    \ menu of the phone - Figure 1 is a screenshot I took of the main menu.\n\n![](img/b2912f82085f2b2d61cbed8cf3a429c5_1_0.png)\n\
    \nFigure 2 shows the interactive Python prompt at which you can try typing Python\
    \ scripts!\n\n## Python\n\n![](img/b2912f82085f2b2d61cbed8cf3a429c5_2_0.png)\n\
    \n```python\nsymbian_s60\nType 'copyright', 'credits'\nor 'license' for more\n\
    information.\n(InteractiveConsole)\n>>>\n>>>\n\nExit\n```\n\n## Running the Python\
    \ ‘Hello, World’\n\nYou can write Python scripts on the Linux mobile and upload\
    \ to the mobile with ‘obex_push’. If you try to open these scripts (on the mobile),\
    \ the ‘applications manager’ will ask you to install the header files being Python\
    \ scripts or not. Once installed as scripts, you can execute them by following\
    \ the instructions displayed on the screen when you open the ‘Python’ application\
    \ from the menu.\n\nFigure 3 shows the output obtained by installing and running\
    \ the following script on the mobile:\n\n```python\nappuiwf # The application\
    \ UI framework\nappuiwf.app.title = 'Cool Python'\nappuiwf.note(u'OK', 'info')\n\
    ```\n\n![](img/b2912f82085f2b2d61cbed8cf3a429c5_2_1.png)\n\nPython for Series\
    \ 60 -\nOK\n\n## Socket programming\n\nApplication programs running on the phone\
    \ as well as the Linux interface with the Bluetooth protocol stack via the socket\
    \ API. Listing 1 shows a simple client program running on the mobile which connects\
    \ to a server running on the Linux machine and sends it a message; the server\
    \ code is shown in Listing 2.\n\nThe Python client running on the mobile opens\
    \ a Bluetooth connection and to the PC device whose address is specified in the\
    \ variable ‘ATHLON’. The connection is established, it simply sends a string ‘Hello,\
    \ world’.\n\nThe server running on the PC opens a Bluetooth socket, binds to RFCOMM\
    \ channel 4 and calls ‘accept’ - the server is now waiting for a connection request\
    \ to arrive from the client. Once the request is received, the server comes out\
    \ of the accept, returning a ‘connected’ socket calling ‘recv’ on which will result\
    \ in the server getting the client that had transmitted.\n\nThe ‘bapy’ function\
    \ is defined as an inline function in one of the headers - so no need in any extra\
    \ library to get the executable. But there is an interesting interface to the\
    \ Bluetooth library called PyBlueZ available for download from http://org.csail.net/bluez.\
    \ It simplifies the process of writing socket programs on the Linux machine. Listing\
    \ 3\n\n## Using BlueZ\n\n(Wait, the text seems to be fragmented: Listing 3 shows\
    \ the Python implementation of the server in the previous section.)\n\n## Emulating\
    \ serial links\n\nPrograms like minicom are used to detect devices over a serial\
    \ link (a modem). There is a neat software trick to present a serial-port-like\
    \ view of a bluetooth link so that programs minicom can manipulate the connection.\
    \ Let's try it out.\n\nFirst, edit /etc/bluetooth/rfcomm.conf so that it looks\
    \ like the following:\n\n```conf\nrfcomm0 {\n  bind 00:0e:6d:9a:57:48;\n  channel\
    \ 1;\n  comment \"Example Bluetooth device\";\n}\n```\n\nAfter stopping and restarting\
    \ the bluetooth service, run the following command:\n\n```bash\nrfcomm bind /dev/rfcomm0\n\
    ```\n\nYou will see a rfcomm0 /dev/under after executing the above command. Now,\
    \ you can set up minicom by running:\n\n```bash\nminicom -s\n```\n\nThe only thing\
    \ to do is to set the name of the device to connect as /dev/rfcomm0. Save the\
    \ new configuration as the default and invoke:\n\n```bash\nminicom -m\n```\n\n\
    Minicom is now ready to talk to your phone! Type in AT and the program will respond\
    \ with OK. Say you wish to make your phone number dial.\n\n```\natdt 1234567;\n\
    ```\n\nThere are many other AT commands you can experiment with; try googling\
    \ for mobile phone AT commands or something of that!\n\nAfter you have finished\
    \ with your virtual port manipulations, you should remove:\n\n```bash\nrfcomm\
    \ release /dev/rfcomm0\n```\n\nto release the serial-bluetooth link.\n\n## Python\
    \ over a Bluetooth connection\n\nOnce you get the serial port emulation working,\
    \ there is another hack to explore. The Nokia Python distribution comes with a\
    \ program called bluetooth.py. On one console of your Linux machine, run the command:\n\
    \n```bash\nrfcomm listen /dev/rfcomm0\n```\n\nNow run bluetooth.py on the phone.\
    \ You will see that after a few seconds, rfcomm will respond with a connected\
    \ message. Once you get this message, take another console and run:\n\n```bash\n\
    minicom -m\n```\n"
