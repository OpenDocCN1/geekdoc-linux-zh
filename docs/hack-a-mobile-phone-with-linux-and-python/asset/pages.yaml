  md: '# Transferring files


    Files are transferred to the Linux machine using a high level protocol called
    OBEX (for ObjectExchange, originally designed for Infrared links). First, you
    have to find out whether your mobile supports OBEX based message transfer. Try
    running the following command on the Linux machine (the number is the bluetooth
    address of the phone):


    ```

    sdptool browse 00:ee:6d:9a:57:48

    ```


    You might get voluminous output - here is part of what I got:


    ```

    Service Description: OBEX Object Push

    Service RecordListHandle: 0x10005

    Service Class ID List: (0x1105)

    "OBEX Object Push"

    Protocol Descriptor List:

    "LCG" (0x0010)

    "RFCOMM" (0x0003)

    Channel: 9

    "OBEX" (0x0008)

    ```


    OBEX is built on top of a lower-level protocol called RFCOMM. The ‘Object Push’
    service uses RFCOMM ‘channel’ 9. Let''s try to upload a file to the phone; run
    the following command on the Linux machine:


    ```

    obex_push 00:ee:6d:9a:57:48 a.txt

    ```


    The phone will respond by asking you whether to accept the message coming over
    the bluetooth link. The command, invoked without any option, can be used to receive
    files from the mobile over the bluetooth link (the corresponding ‘man’ page for
    more details).


    # Installing Python


    Nokia has done a port of Python to the ‘Series 60’ smartphones running the Symbian
    operating system. The Python interpreter as well as a few important modules are
    packaged into a single .sis file (somewhat like the Linux RPM file) which can
    be obtained from http://www.forum.nokia.com/main/0_034-821.html. The file to be
    installed PythonForSeries60_pre_SDK20.sis. The first step is to transfer this
    file to the mobile via obex_push. Trying to open it in the Nokia installer program
    running - it will ask you to install Python on the limited amount of memory which
    phone has or to an additional MMC card (if one is present). Once the installation
    is over, you will see a not-so-cute Python logo on the main menu of the phone
    - Figure 1 is a screenshot I took of the main menu.


    ![](img/b2912f82085f2b2d61cbed8cf3a429c5_1_0.png)


    Figure 2 shows the interactive Python prompt at which you can try typing Python
    scripts!'
