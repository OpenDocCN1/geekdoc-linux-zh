  md: '# # Hack a Mobile Phone with Linux and Python


    A mobile phone is a cool gadget to play with, especially when I can run my favourite
    programming language (no prize for guessing what it is!) on! That was the logic
    which made me purchase a Nokia Series 60 smartphone, the N-Gage QD. This article
    describes experiments I did with the mobile - setting up Bluetooth communication
    links, running Python/C and emulating serial ports.


    # ## Bluetooth on Linux


    Bluetooth is a short distance communication standard. It is commonly used to facilitate
    data transfer between PC''s and cell phones/PDAs''s. The hardware which provides
    Bluetooth connectivity to the PC is a small device called a _USB Bluetooth dongle
    which you can plug into a spare USB port of your machine. I approached the locals
    electronics asking for such a device and got one which didn''t even have the manufacturer''s
    name on it. The driver CDM came with it which contained only Windows software.
    Deciding to try my luck, I plugged the device on and booted my system Fedora Core
    3 - bluetooth service was started by executing:


    ```

    sh /etc/init.d/bluetooth start

    ```


    Here is the output when I commanded ''hicconfig'' (which is similar to the ''ifconfig''
    command to configure TCP/IP network interfaces):


    ```

    hci0: Type: USB

    BD Address: 00:11:B1:07:A2:B5 SCO MTU: 64:8

    UP RUNNING PSCAN SCAN

    RX bytes:378 acl:0:0 events:16 errors:0

    TX bytes:309 acl:0:0 commands:16 errors:0

    ```


    My no-name Bluetooth dongle has been detected and configured properly! The number
    00:11:B1:07:A2:B5 is the Bluetooth address of the device.


    # ## Detecting the mobile


    The next step is to check whether Linux is able to sense the proximity of the
    mobile. If your phone has bluetooth disabled, enable it and run the following
    command (on the Linux machine):


    ```

    hctool scan

    ```


    Here is the output obtained on my machine:


    ```

    Scanning ...

    00:E6:6D:9A:57:48 Dijkstra

    ```


    The _Bluez protocol stack running on my GNU/Linux has ''discovered'' the Nokia
    N-Gage sitting nearby and printed its Bluetooth address as the one which was assigned
    to: ''Dijkstra''.


    # ## Pairing the mobile


    For security reasons, some interactions with the mobile require the device to
    be ''paired'' with the one it is interacting with. First, a number (or more digits)
    in the file/etc/bluetooth/pin (say 12345). Stop and restart the bluetooth service
    by doing:


    ```

    sh /etc/init.d/bluetooth stop

    sh /etc/init.d/bluetooth start

    ```


    Now initiate a ''pairing'' action on the mobile (the phone will tell you how this
    is). The software on the phone will detect the presence of the Bluetooth-enabled
    Linux mask and ask for a code - you should enter the very number you have stored
    in /etc/bluetooth/pin on the PC - the pairing process will succeed.'
