  md: "shows the Python implementation of the server program described in the previous\
    \ section.\n\n# Emulating serial links\n\nPrograms like `minicom` are used to\
    \ detect devices connected over a serial link (a modem). There is a neat softare\
    \ trick to present a `serial-port-like` view of a bluetooth link so that programs\
    \ `minicom` can manipulate the connection effortlessly. Let's try it out.\n\n\
    First, edit /etc/bluetooth/rfcomm.conf so that it looks like the following:\n\n\
    ```\nrfcomm0 {\n  bind no;\n  device 00:0e:6d:9a:57:48;\n  channel 1;\n  comment\
    \ \"Example Bluetooth device\";n}\n```\n\nAfter stopping and restarting the bluetooth\
    \ service, run the following command:\n\n```\nrfcomm bind /dev/rfcomm0\n```\n\n\
    You will see a `rfcomm0` /dev/under after executing the above command. Now, you\
    \ can set up `minicom` by running:\n\n```\nminicom -s\n```\n\nThe only thing to\
    \ do is to set the name of the device to connect as /dev/rfcomm0. Save the new\
    \ configuration as the default and invoke:\n\n```\nminicom -m\n```\n\nMinicom\
    \ is now ready to talk to your phone! Type in `AT` and the program will respond\
    \ with `OK`. Say you wish to make your phone number dial. Just type:\n\n```\n\
    atdt 1234567;\n```\n\nThere are many other AT commands you can experiment with;\
    \ try googling for `mobile phone AT commands` or something of that!\n\nAfter you\
    \ have finished with your virtual port manipulations, you should remove:\n\n```\n\
    rfcomm release /dev/rfcomm0\n```\n\nto `release` the serial-bluetooth link.\n\n\
    # Python over a Bluetooth connection\n\nOnce you get the serial port emulation\
    \ working, there is another interesting hack to explore. The Nokia Python distribution\
    \ comes with a program called `bluetooth.py`. On one console of your Linux machine,\
    \ run the command:\n\n```\nrfcomm listen /dev/rfcomm0\n```\n\nNow run `bluetooth.py`\
    \ on the phone. You will see that after a few seconds, `rfcomm` will respond with\
    \ a `connected` message. Once you get this message, take another console and run:\n\
    \n```\nminicom -m\n```"
