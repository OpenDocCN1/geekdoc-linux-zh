  md: '# Mobile Phone with Linux and Python


    What do you do on the screen? A Python interactive interpreter prompt! You can
    now use in Python snippets and execute

    them on the phone-the-fly! Isn''t that cool?


    # Parting Thought


    I was curious to know how Microsoft''s Windows operating system works, famous
    for its ''ease of use''; would compare with Linux

    when it comes to interacting with it my Ngage QD. I installed the Windows driver
    for my no-name us-bluetooth dongle and tried

    it the Nokia PC suite up and running on an XP machine - maybe it''s because I
    am far more experienced in GNU/Linux than on MS

    operating systems, I found the XP experience less ''friendly'' than MS would care
    to admit. I believe that most of the ''user

    friendliness'' of the Microsoft operating system comes from hardware vendors and
    application developers tightly integrating the

    products with the platform rather than any inherent quality of the OS as such.


    # References


    For a general introduction to Bluetooth technology, see here http://www.dell.com/downloads/vectors/2003_bluetooth.pdf.
    An

    interesting paper on Bluetooth security is available at http://www.nikula.cs.ht.fi/-jiiw/bluesec.html.


    http://www.holtmann.org/ has plenty of information regarding Bluetooth and Linux;
    I found the document ''Bluetooth Programming

    for Linux'' (http://www.holtmann.org/papers/bluetooth/wic2003_slides.pdf) very
    informative.


    Lots of information about Python on series 60 modules is available at

    http://www.postneo.com/postwiki/moin.cgi/PythonForSeries60/. ObexFTP seems to
    be an interesting tool - you can get it from

    http://triq.net/obex/. There are some documents floating on the net which describe
    how you can do an NFS mount of your phone''s

    file system - try a google search for more info.


    Source/errata concerning this article will be available at http://pramode.net/ify-jun.'
