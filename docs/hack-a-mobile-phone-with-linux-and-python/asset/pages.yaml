    # Running the Python ‘Hello, World’


    You can write Python scripts on the Linux mobile and upload to the mobile with
    ‘obex_push’. If you try to open these scripts (on the mobile), the ‘applications
    manager’ will ask you to install the header files being Python scripts or not.
    Once installed as scripts, you can execute them by following the instructions
    displayed on the screen when you open the ‘Python’ application from the menu.


    Figure 3 shows the output obtained by installing and running the following script
    on the mobile:


    ```

    appuiwf # The application UI framework

    appuiwf.app.title = ''Cool Python''

    appuiwf.note(u''OK'', ''info'')

    ```


    ![](img/b2912f82085f2b2d61cbed8cf3a429c5_2_1.png)


    Python for Series 60 -

    OK


    # Socket programming


    Application programs running on the phone as well as the Linux interface with
    the Bluetooth protocol stack via the socket API. Listing 1 shows a simple client
    program running on the mobile which connects to a server running on the Linux
    machine and sends it a message; the server code is shown in Listing 2.


    The Python client running on the mobile opens a Bluetooth connection and to the
    PC device whose address is specified in the variable ‘ATHLON’. The connection
    is established, it simply sends a string ‘Hello, world’.


    The server running on the PC opens a Bluetooth socket,, binds to RFCOMM channel
    4 and calls ‘accept’ - the server is now waiting for a connection request to arrive
    from the client. Once the request is received, the server comes out of the accept,
    returning a ‘connected’ socket calling ‘recv’ on which will result in the server
    getting the client that had transmitted.


    The ‘bapy’ function is defined as an inline function in one of the headers - so
    no need in any extra library to get the executable. But if you are using any of
    the other Bluetooth utility functions like ‘ba2stf’, you have to link /usr/lib/libbluetooth.so
    to your code.


    # UsingBlueZ


    There is an interesting interface to the Bluetooth library in Linux called ‘PyBlueZ’
    available for download from http://org.csail.net/bluez. It simplifies the process
    of writing bluetooth socket programs on the Linux machine. Listing 3'
