    and subprograms). To handle each piece of work, the system creates a process to
    do that work. Consequently, at a given time, a system has processes to work for
    each job of each user, as well as itself itself. To keep track and manage these
    processes, there are a variety of standard and frequently available UNIX/Linux
    processes. Next is a look at some commonly used commands.


