    \ []\n```\n\n**FIGURE 12.38** Retrieving multiple files with sc, utilizing phrase\
    \ matching.\n\n# lynx\n\nFinally, another method you can use to retrieve files\
    \ over a network involves-\ndown-based applications such as lynx and wget. The\
    \ lynx application is explained\nhere. You built it as an exercise in Chapter\
    \ 11, where you are encouraged to try wget.\nlyn is actually a text-based Web\
    \ browser, which is useful if you want to view Web\npages on a non graphical system.\
    \ More specific to this, lynx is particularly\nuseful if you want to retrieve\
    \ a file from Web server or similar system to which\ndo do not have an account.\
    \ In addition, lynx can be used to automate the retrieval of\nmiple files across\
    \ the Internet.\n\nTo retrieve a file with lynx, simply invoke lynx with the -dump\
    \ option followed\by the URL of the file. Also, because -dump causes lynx to send\
    \ the retrieved file to\nstandard output (stdout), you may wish to redirect the\
    \ output to a file. As\nexample, Figure 12.39 illustrates how to utilize lynx\
    \ to obtain an RPM file for the\nx application from the Web site www.trilon.com.\
    \ The file is saved into\nv-3.10a-13.i386.rpm.\n\n```\n550 book@computer:\"/Intro_to_UNIX/chap12\
    \ lynx -dump www.trilon.com/pub/xv/bin\nries/xv-3.10a-13.i386.rpm > xv-3.10a-13.i386.rpm\
    \ []\n```\n\n**FIGURE 12.39** Utilizing lynx to retrieve a file over the Internet."
