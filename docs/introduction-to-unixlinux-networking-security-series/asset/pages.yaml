  md: 'file rather than the keyboard, particularly if there is a large amount of input.
    To construct a command to read input from a file rather than the keyboard, you
    use input redirection. Input redirection is useful in many situations, for example,
    to refer to input that you have already stored in a file rather than retyping
    the input.


    Input redirection with < allows you to specify input from a file rather than the
    keyboard.


    As an example of input redirection, notice the grep command man page says it searches
    the input (stdin) as arguments. Suppose you want grep to search contents from
    stdin from a file and not from the keyboard. You specify the command as normal,
    by adding the input symbol followed by the name of the file used as input. Figure
    5.53 demonstrates the use of input redirection and show the lines that contain
