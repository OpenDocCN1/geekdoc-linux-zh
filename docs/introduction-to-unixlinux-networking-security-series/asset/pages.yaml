  md: '# # ON THE DVD-ROM!


    # # INTRODUCTION

    to UNIX/LINUX


    Christopher Diaz


    A Fedora™ installation to install Linux on your computer


    Introduction to UNIX/Linux provides the background and knowledge necessary to
    learn the UNIX/Linux environment and understand how to use its potential. This
    book is designed and written for IT professionals, programmers, students, and
    individuals who want to learn UNIX or Linux. The book covers a variety of topics,
    including basic file management, editing, typesetting, programming, account configuration,
    and network applications.


    Example files from the book that can be installed on your computer to provide
    a “hands-on” experience with the topics


    Written in an easy-to-follow manner, Introduction to UNIX/Linux is the essential
    resource for anyone wanting to learn the UNIX and Linux systems. The book assumes
    some level of familiarity with computing systems, and the programming chapters
    assume an understanding of C/C++ and basic program logic.


    # YOU''LL LEARN:


    +   * How to install a UNIX/Linux system and its applications

    * How to manage files in a UNIX/Linux system

    * How to use common UNIX/Linux editors to edit files and manage the content of
    a file

    * How to create and view professional-looking typeset documents that incorporate
    figures, graphs and tables

    * How to manage jobs and processes

    * How to write high-level programs using commands presented in the book

    * How to build, debug, and C/C++ programs on UNIX/Linux

    * How to maintain and configure shell accounts to work as desired

    * How to work with systems across a network


    The book also includes review questions for each chapter and PowerPoint slides
    for a course setting.


    Powerpoint presentation slides that can be used in a teaching environment


    ![](img/e3ac56d195b48617d5ae42cd57458af3_451_0.png)


    # SYSTEM REQUIREMENTS


    At least 3GB of unpartitioned hard disk space;192MB of RAM at a minimum; 400MHz
    Pentium II or better; Graphical Display; The disk space taken by example files
    and presentation slides is about 13MB.


    # AUTHOR BIO


    Christopher Diaz (Greensburg, PA) is an Associate Professor of Computer Science
    at Seton Hill University He received his Ph.D. from the University of Kentucky
    and was previously a Senior Systems Engineer at Foundation Research and Development
    Center.


