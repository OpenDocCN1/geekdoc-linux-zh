    //Intro_to_UNIX/chap06$ crontab -l

    00 * * * * uptime >> uptime.log

    30 6 * * * tar -cf backups/home.tar . backups/tar.log

    00 2 *1 * * find -name core -exec rm {};

    ```


    FIGURE 6.39 Showing the current jobs scheduled with crontab.


    Finally, to remove all scheduled jobs, you can invoke crontab with the -r option,
