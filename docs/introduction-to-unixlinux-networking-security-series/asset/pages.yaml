  md: '# Intermediate File Management 125


    gzip allows you to shrink individual files, as the compress utility does. However,
    gzip usually condenses files better than compress, so the reduced files use less
    space. Like the compress utility, gzip replaces the original file with a compressed
    file unless you specify otherwise.


    You can use gzip to shrink one file, as you did with compress. To demonstrate,
    use gzip to shrink output.tar you previously created, and ensure a long listing
    before and to show the effect, as illustrated in Figure 5.45.


    ```

    //Intro-to_UNIX/chap05/output_files$ ls -l

    total 556

    -rw-r--r-- 1 book 43 May 12:02:34 README

    -rw-r--r-- 1 book 5632000 May 12:02:34 output.tar

    /Intro-to_UNIX/chap05/output_files$ gzip output.tar

    /Intro-to_UNIX/chap05/output_files$ ls -l

    total 424

    -rw-r--r-- 1 book 43 May 12:02:34 README

    -rw-r--r-- 1 book 424852 May 12:02:34 output.tar.gz

    /Intro-to_UNIX/chap05/output_files$ []

    ```


    **FIGURE 5.45** Using gzip to shrink a file.


    To access the contents of a shrunken file with gzip, the first file must be unshrunk
    with gzip, as shown in Figure 5.46. Notice that when gzip unshrunk a file, the
    shrunken file remains with the original.


    ```

    //Intro-to_UNIX/chap05/output_files$ gzip output.tar.gz

    /Intro-to_UNIX/chap05/output_files$ ls -l

    total 556

    -rw-r--r-- 1 book 43 May 12:02:34 README

    -rw-r--r-- 1 book 5632000 May 12:02:34 output.tar

    /Intro-to_UNIX/chap05/output_files$ []

    ```


    **FIGURE 5.46** Using gzip to expand a file.


