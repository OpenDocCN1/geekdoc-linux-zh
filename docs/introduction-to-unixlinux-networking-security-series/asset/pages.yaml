  md: '# Confirming, Enabling, and the ways you repeat or recall command histories


    Before you look at the ways you repeat or recall commands, you must first ensure
    your account shell is configured correctly. The following describes how you determine
    whether command history is enabled in csh, tsh, ksh, and bash shells.


    csh and tsh


    If you are using either csh or tsh as your account shell, the environment variable
    history (notice all lowercase letters) is utilized to enable or disable the command
    history. If history contains no value or a value of 0, then commandline history
    is disabled. On the other hand, if history contains a numeric value, then the
    shell will remember many recent commands. For example, if history contains the
    value 50, then a commandline shell will remember the 50 most recent commands issued
    at command-line.


    To confirm whether your csh or tsh history is enabled, you can issue the following
    command shown in Figure 3.19. If you see a nonzero numeric value in response,
    your shell remembers many recent commands. In this example, the value is reported
    25, indicating the shell remembers the last 25 commands. Notice the prompt in
    Figure 3.19 looks a little different from other prompts so far. It is an example
    of a csh or tsh prompt, which looks different from another shell prompt, such
    as sh or bash. Chapter 11 explains how to change your command-line prompt to have
    various appearances, in detail.


    ```

    $echo history

    25

    >

    ```


    FIGURE 3.19 Confirming that command history is enabled in csh or tsh.


    If you see a value of 0 or no value at all, then your shell is currently not utilizing
    commandline history to remember recent commands, and you cannot use command repetition.
    Nevertheless, you can enable commandline history and repetition by setting a value
    of the variable history with a command like that shown in Figure 3.20. If you
    set the value of history to 50, then the shell will remember 50 commands. Not
    only does setting the value of history enable commandline history but also can
    it reset the number of commands that the shell will remember. In this example,
    your shell originally remembered the last 25 commands, but you increased that
    number to 50.


    ```

    $set history=50

    >

    ```


    FIGURE 3.20 Enabling command history in csh and tsh.'
  merge: -1
