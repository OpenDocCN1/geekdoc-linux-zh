  md: "While non-UNIX/Linux systems also employ * to specify a wildcard,\nare there\
    \ some distinctions between how those systems utilize * and how UNIX/Linux\ndso.\
    \ Other systems typically use * to match only part of a filename, say, the\npart\
    \ of a name that appears before a period or after the period, as * to match all\n\
    filenames and extensions. UNIX/Linux does not have this restriction. In UNIX/Linux,\n\
    \ will match the names of all files and/or subdirectories in a directory, where\n\
    the names have no periods, one period, or multiple periods. However, * will not\n\
    match filenames, that is, files named with a period. The name of a dot\nfile must\
    \ always be specified with a period at the beginning of its name.\n\n# ? to Match\
    \ a Single Letter, Digit, or Symbol\n\nUNIX/Linux utilizes a wildcard with the\
    \ ? symbol, digit, or symbol of a file name. This is useful when you\nare restrict\
    \ wildcard matches to a very specific range of possible names. As an ex-\\ample,\
    \ in the subdirectory/-Intro_to_UNIX/chap04/misc_files, you suppose want to\n\
    do do a full (long) listing of only the files file1, file2, . . . . . to file19\
    \ (in other\nwords, filex, where x represents any match of *exactly one* letter,\
    \ digit, or symbol).\nYou can do so by using a * wildcard, as shown in Figure\
    \ 4.20\n\n```\n//Intro_to_UNIX/chap04/misc_files -ls -1 file*\n-rw-rw-r-- 1 book\
    \ 0 Apr 16 2005 file1\n-rw-rw-r-- 1 book 0 Apr 16 2005 file2\n-rw-rw-r-- 1 book\
    \ 0 Apr 16 2005 file3\n-rw-rw-r-- 1 book 0 Apr 16 2005 file4\n-rw-rw-r-- 1 book\
    \ 0 Apr 16 2005 file5\n-rw-rw-r-- 1 book 0 Apr 16 2005 file6\n-rw-rw-r-- 1 book\
    \ 0 Apr 16 2005 file7\n-rw-rw-r-- 1 book 0 Apr 16 2005 file8\n-rw-rw-r-- 1 book\
    \ 0 Apr 16 2005 file9\n//Intro_to_UNIX/chap04/misc_files# []\n```\n\n> FIGURE\
    \ 4.20 Utilizing a wildcard for a single letter, digit, or symbol.\n\nLikewise,\
    \ if you want a (long) listing of only file10, file11, and file12 in\nother words,\
    \ fileXX where XX represents any match of exactly two letters, digits, or\n(symbols).\
    \ You can do so by utilizing two * wildcards, for each digit, at the\nend of the\
    \ file, as demonstrated in Figure 4.21.\n\nAs some other examples, look at the\
    \ files named “data” with six-trailing digits\nrepresent a certain date or range\
    \ of dates. Say you may wish to list only the files that refer to\nthe first of\
    \ every month in 2005. To accomplish this match, use two ? symbols to match\n\
    two digits that refer to the month, 05 for the year, and 01 for the date,\nas\
    \ shown in Figure 4.22."
