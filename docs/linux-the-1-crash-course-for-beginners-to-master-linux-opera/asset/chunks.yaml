    Ubuntu 的包管理器称为 `apt`。它是一个强大的工具，通过命令行管理你所有的系统软件包。使用它来更新系统确实有一个缺点：你必须不断检查更新。要使用这种方法，请打开终端窗口并输入
    `sudo apt-get upgrade`。系统会要求你输入密码。接下来，将出现一个可用更新的列表，你可以查看它们。要接受所有更新，请点击 `Y` 键并按回车。这将安装这些更新。


    # 本章总结


    在本章中，我们学习了：


    * 什么是 Linux，以及基于 Linux 内核或 shell 的操作系统被称为发行版（distro）。

    * 有许多发行版可用，其中某些设计是为了实现单一目的，例如运行服务器或作为网络交换机。

    * Linux 可以通过 USB 闪、CD-ROM 或虚拟安装安装在你的计算机系统上。

    * 什么是 Linux 命令行以及如何使用它与操作系统交互。

    * 如何更新你的 Linux 系统。


    # 练习


    以下是一些针对初学者的实践练习。


    ### 练习 1：选择一个 Linux 发行版并安装在你的 PC 上


    提示：确保你彻底阅读了提供的信息，以防止出现任何错误。仔细阅读每条安装消息，确保你成功安装操作系统。如果需要帮助，请参考本章的笔记。


    ### 练习 2：使用 `apt` 工具安装操作系统软件包


    * 使用 `apt` 命令行工具安装 `clustalw` 多序列对齐工具和 `clustalx` 图形用户界面。

    * 注意满足每个工具的强制要求需要多少额外的包。

    * 使用 `clustalx` 工具对齐 `Align_Data/reference_sequences.txt` 中的 `rRNA` 序列。

    * 你可以使用 `apt-file` 程序查看由特定软件包安装了哪些文件。使用它查看 `clustalw` 包安装了什么。

    * 使用 `apt install apt-file`（作为 root 用户）安装 `apt-file`。

    * 使用 `apt-file update` 构建文件缓存。

    * 使用 `apt-file list clustalw` 列出 `clustalw` 的文件。

    * 查看文件所在的目录。


    ### 练习 3：在虚拟机中安装 Linux


    * 选择一个 Linux 发发行版进行安装，例如 `Ubuntu live` 并下载其 `.iso` 镜像文件。

    * 接下来设置一个新的虚拟机并为其分配一些内存（2GB）和磁盘空间（20GB）。

    * 将 `ISO` 添加到虚拟 DVD 驱动器并启动逐步安装过程，直到成功安装 Linux 发行版。


    # 第 2 章：桌面环境


    Linux 最具特点的特性之一是它的定制化能力。你可以调整操作系统的任何方面来适应你的特定需求，这使得它比 Windows 或 MacOS 等其他操作系统更具优势。例如，假设你想安装
    Ubuntu，这是一个安全且用户友选择。然而，Ubuntu 大约有八种不同的官方版本（flavors），它们的行为和外观不相同，这很大程度上取决于每个版本所使用的桌面环境类型。


    在完全准确理解什么是桌面环境之前，让我们对操作系统进行进一步阐述。所有的操作系统（如 Windows、Linux 或 MacOS）都有一个内核或 shell，它直接控制你的计算机硬件，并将软件提供的任何命令转换为你的设备可以理解的内容。通过这样，它就能在执行命令时知道该做什么。内核还会智能地管理你的硬件资源（如内存管理），以供你将使用的各种软件使用。


    因此，简而言之，内核是系统的脑或引擎，充当软件和硬件之间的调解者。然而，这不是初学者应该过度担心的事情，因为与计算机系统的大部分交互将通过图形用户界面进行。这通常就是桌面环境。


    桌面环境结合了图标、菜单、工具栏和桌面小部件等各种组件来提供通用的 GUI（图形用户界面）。它们还包含一组集成计算机应用程序和实用程序，但最重要的是它们有自己的窗口管理器，尽管它可以被另一个兼容的管理器替换。计算机用户可以随心所欲地配置图形用户界面，而桌面环境提供了完成此任务的简单方法。


    用户还可以自由地混合使用多个环境的应用程序。例如，如果 `GNOME` 用户比起 `GNOME` 的 `Epiphany` 浏览器，可以运行 `KDE` 应用程序如
    `Konqueror` 浏览器。然而，使用这种混合方法的一个主要缺点是，许多此类应用程序通常高度依赖它们各自桌面环境（DE）的底层库。这意味着为了安装这些应用程序，你需要安装大量的依赖项，这可能会占用大量的磁盘空间。为了避免这种情况，用户可以坚持使用一种桌面环境，或者选择依赖较少外部库的替代方案。


    在原生环境 `DE` 提供的应用程序有一个优势：它们通常运行得更好。混合使用可能会导致视觉上的差异，例如界面使用的图标或小部件与已安装的不符，或者导入的元素无法按预期工作，这可能会导致混乱并引起系统出现异常行为。


    需要注意的是，每个环境在性质和目的上都是独特的。使用哪种 `DE` 取于于需求。此外，在安装桌面环境之前，你需要安装一个功能性的 `X server`，因为大多数环境都支持它。虽然其他环境也支持
    `Wayland` 作为 `X` 的替代方案，但许多 `DE` 仍然处于实验阶段。我们稍后将深入查看 `X window system`，你也可以访问 `X.org`
    获取更多信息。


    ## 桌面环境类型


    以下是 Linux 用户可用的一些官方支持的桌面环境示例。


    ### 1. GNOME


    这是 Linux 用户中非常流行的桌面环境。它是免费、开源、简单而强大且易于使用的。它是如此受欢迎，以至于从它开发出了被称为“分支”（forks）的其他桌面环境，包括
    `Cinnamon`、`Unity` 等。它被设计为高度可定制，从而为 Linux 桌面用户提供了愉快的计算体验。`GNOME` 的主要特性包括一个显示所有活动概览的仪表板、系统级搜索工具、强大的内置应用程序、主题、扩展支持和窗口贴靠。


    它的最新发布版本 `GNOME 3` 展示了现代、吸引人的用户界面，并旨在为触控输入设备提供更好的支持。此外，它现在使用 `Metacity` 作为默认窗口管理器，并且
    `Nautilus` 作为默认文件管理器并集成了 `Google Drive`。它支持桌面通知，通过一个你可以开启和关闭的方便的消息系统来实现。


    使用这种 DE 的优势之一包括其现代且易于触摸操作的用户界面。你还可以通过使用 `GNOME shell extensions` 来扩展它的功能，而且它是高度可定制的。一些缺点包括由于其图形化界面，与其他替代方案相比对计算机资源（如内存）消耗较大，并且某些扩展管理不尽如意。此外，为了自定义此
    DE，你需要一个 `gnome-tweaking` 工具。一些使用 `GNOME` 的主要发行版包括 `Ubuntu GNOME`、`OpenSuSE`、`Debian`
    和 `Fedora`。


    ### 2. KDE


    '
- fmt: '

    This is another popular desktop environment — and the most highly customizable
    — because it is designed to give Linux users complete control over their desktop.
    `KDE` is more than a desktop environment. It is a collection of apps that include
    the DE. Where other environments require you to have a tweaking tool installed,
    for `KDE` it is all in the system settings. This allows you to personalize your
    desktop without using third-party tools, and you can even download widgets, wallpapers,
    and themes without using the web browser.


    It offers a collection of basic applications you can use, and it is also compatible
    with other apps even if they were not developed using the `KDE Development Platform`.
    These built-in apps come bundled with a variety of essential features that are
    often absent in the alternative. `KDE` is an excellent choice whether you need
    a desktop environment that works out of the box or one that can be fully customized
    to suit your needs.


    Some of its perks include being the most advanced, powerful, and feature-rich
    DE with a polished user interface. It also gives users a highly customizable and
    flexible experience with its wide range of applications and software compatibility.
    However, it does have some slightly heavy resource usage, and some components
    appear too complicated to use.


    Its latest version, known as `Plasma`, is available in two variants: `Plasma Desktop`
    and `Plasma Netbook`. The `Plasma 5` release includes features such as the `Dolphin`
    file manager and the `Kwin` windows manager. It has a converged shell with updated
    graphics stacks to enable smoother graphics performance. There are also workflow
    improvements made in the desktop notification area, modern launchers, and better
    support for high-density display (high DPI) and more minor features. Some distros
    that use `KDE` as their default include `openSuSE` and `Kubuntu`.


    ### 3. Xfce


    The `Xfce` desktop environment truly embodies the traditional UNIX philosophy
    of modularity and reusability. It has several components that provide the full
    functionality one can expect of a modern DE while remaining relatively light.
    They are packaged separately, and you can select among the available packages
    to create your optimal working environment.


    It is lightweight and easily adaptable to old hardware. It also has a modern,
    visually appealing look, and it is highly customizable. It comes installed with
    the `Xfwm` file manager and `Thunar` file manager. The user session manager handles
    logins, power management, etc. and you can set the background image, icons, widgets,
    and more through the desktop manager. It is, however, not touch-friendly, so it
    is not ideal for devices that have touch input. `Manjaro Linux` and `Xubuntu`
    use `Xfce` as the default desktop environment.


    ### 4. Cinnamon


    `Cinnamon` was initially developed to be the default desktop environment for `Linux
    Mint`. It is a combination of several projects such as `Cinnamon` — a fork of
    the `GNOME shell`, `Cinnamon screensaver`, `Cinnamon desktop`, `Cinnamon Menus`,
    `Cinnamon Settings Daemon`, and more. `Cinnamon` has various customizable elements,
    such as panels, themes, and extensions. Since it is based on `GNOME`, it comes
    with several basic applications from `GNOME`. This DE also features the `MDM`
    display manager, `Nemo` file manager, `Muffin` window manager, `Cinnamon` session
    manager, `Cinnamon` translations, `Blueberry` — a Bluetooth configuration tool,
    and more.


    Some of `Cinnamon`ss perks include its sleek polished look, familiar interface,
    and customization capacity. Its small icons are not touch-friendly, thus it making
    it hard to use on touch devices.


    ### Desktop Environment Implementation


    A system that offers a DE, a window manager, and applications written using a
    widget toolkit are accountable for most of what the user sees. The window manager
    supports the user’s interactions with the DE, while the toolkit provides a developer
    with a library for applications that look and behave in a similar manner. A windowing
    system such as `X` or `Wayland` interfaces directly with the OS and libraries
    and provides the needed support for graphical hardware and input devices like
    keyboards.


    The window manager operates on top of this windowing system, and while the latter
    provides window management functionality, it is still seen as part of the window
    manager. Applications designed to work with a particular manager in mind are made
    using a windowing toolkit, which is provided by the OS or window manager. This
    toolkit allows the applications to access widgets that let the user interact with
    the apps.


    Some factors can influence a user’s choice of DE; these include:


    *   The look and feel of the desktop environment. Some users are comfortable with
    a certain look or feel which they are familiar with. This is especially true for
    newbies or users who are transitioning from Windows or Mac to Linux. They might
    go for DE that has similar layouts to their previous operating systems.

    *   Flexibility and configurability. Experienced users may opt for DEs that are
    more configurable or customizable so that they can tune it to work how they want.
    For beginners, many prefer an easy-to-use environment that they can get used to
    quickly.

    *   Personal software preferences. Each DE comes with default software applications
    and a default way of how things are done. A new or casual user may want a graphic-rich
    interface, while a more experienced user may opt for a more straightforward interface
    or even user command-line interface tools.


    ### The X Window System


    The `X Window System` is often referred to as the distributed, graphical method
    of working. It is an open-source, cross-platform, client-server, computer software
    program that provides a GUI in a distributed environment. It is distributed because
    you could run the display on a monitor in one location, even though the application
    is running on a computer somewhere else. The graphical aspect is brought in by
    the images and other graphics that are displayed on your screen. Despite how popular
    it is among UNIX users, it is not a UNIX product. It was developed in 1994 by
    the Massachusetts Institute of Technology (MIT) and Stanford University, and operates
    on a wide range of machines, even MS Windows-based versions. The `X.Org Foundation`
    is an open group that manages the development and standardization of `X`.


    The `X Window System`, also known as simply `X` or `X11`, provides the basic framework
    for a GUI environment. At the base level, X uses the elements of the GUI on the
    user’s screen and constructs methods for sending user interactions back to the
    software. Using application GUI development toolkits, an application developer
    can create an application interface. Because X has been designed to use a client/server
    model from the beginning, it is well suited for remote application use as well,
    letting you work from your computer directly with an application running on another
    computer. X is also hardware-independent, meaning you can run MS applications
    on a UNIX workstation. Some of its features include network transparency, customizable
    graphical capability, and the ability to link to different networks.


    ### X Architecture


    We already know that X was designed using client-server architecture, the `X.Org
    server`, and the `X terminal`. Here the applications themselves are the clients
    because they communicate with the server, issue requests, and also receive information
    from other servers. The X server, however, retains exclusive control of the display
    and service requests from the clients. Applications only need know how to talk
    to the server and not bother with the actual graphics display device. The advantages
    of utilizing this model are pretty clear here. At the fundamental level, an application
    (client) can tell the server to execute specific instructions such as “draw a
    circle.”

