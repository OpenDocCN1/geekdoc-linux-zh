    After selecting a key type, hit enter. You can also hit enter to select the default
    choice. You will be prompted to enter a key size in bits, i.e., `128`, `160`,
    `256`, etc. Press enter to accept your choice or leave it blank then hit enter
    to use the default value of `2048`. If you want to use default settings, keep
    hitting enter.


    When asked whether you really never want the keys to expire, press `Y` to confirm,
    you will then be asked to type in your name, email address, and a comment to link
    the key to you. Hit enter. When asked to change or confirm this data, go over
    it then hit enter. You will be asked for a passphrase that is used to protect
    your private key. The passphrase should contain both uppercase and lowercase letters,
    numbers, and even punctuations marks. The longer, the better, then hit enter.
    Be careful as you set the passphrase because you need to be able to remember it
    easily.


    ## Exchanging Keys


    To communicate securely, you have to give other people your public key and get
    their public keys. GPG stores your keys on your key ring, a file containing these
    keys. To list the keys on your key ring, input `gpg --list-keys`. To send your
    public key, you have to export it to a file first. The best way to document it
    is in the ASCII-armored format like this:


    ```

    gpg --armor --export spadelanny@boomee.com > spadelanny.asc

    ```


    This command will save the public key in ASCII-armored format in the `spadelanny.asc`
    file. The key is now ready to be sent. You can also receive key files which you
    will import using the `gpg --import file_name` command. The `gpg --list-keys`
    command verify the keys present in your key ring. Next, you will want to check
    the key’s fingerprint by using the following command: `gpg --fingerprint file_name`.
    This will display the messages’ fingerprints. You can then verify the fingerprint
    and validate it. This tells the system that the key is good, and you trust the
    key, but be very careful with key verification as they can make your system vulnerable.
    You can use the `gpg --sign-key file_name` command to sign the key.


    ## Signing Files


    Signing files can be used as a way of assuring the file recipient that you have
    verified the information, no one has tampered with it, and you did indeed send
    the file. For instance, you can compress and sign a file named “urgent” using
    the following command: `gpg -o urgent.sig -s urgent`. Use `gpg --verify urgent.sig`
    to verify the signature. Sometimes you still want to sign a message to show that
    it came from you even though it is not secret. You can generate and include a
    clear-text signature with the following command: `gpg -o urgent.asc --clearsign
    urgent`.


    ## Encrypting and Decrypting Files


    To encrypt a message, use `-encrypt` or `-e` in the GPG command, that is, `gpg
    -o urgent.gpg -e -r spadelanny@boomee.com message`.


    This message named `urgent` is now encrypted using `spadelanny`’s public key.
    It doesn’t have a signature, though. You can add it using ` -s` command. To decrypt
    the same file, for instance, the recipient must have the private key so that they
    can issue this command: `gpg -o message --decrypt urgent.gpg`.


    ## Network Security


    This involves dealing with issues related to threats or attacks over a network
    connection. Network security becomes relevant when you connect your system to
    a network, such as connecting to your company’s internal network, even if you
    are dealing with a single computer connected to the Internet. Albeit the latter
    situation does not warrant you to worry too much, having the internal network
    system exposed to the world can cause you quite a headache.


    You could be thinking that you can avoid putting your internal network at risk
    by connecting only the external servers such as the web or FTP servers to the
    Internet. This simplistic approach is not recommended. Liken it to an example
    of a person who will not drive because there is a chance they might get involved
    in an accident.


    Not connecting your system to the Internet can have the following disadvantages.
    First, you cannot use file transfer protocols, or `FTP`, to company files from
    your system to the web browser. Users cannot access other remote servers that
    are connected to the network. The internal network users don’t have access to
    web servers over the Internet. This makes resources such as the web inaccessible
    to you and your users.


    A practical solution would be to use a firewall and place the webserver on a very
    secure host outside the firewall. You can also enable the internet services you
    require on your system and keep away from unconfigured services. Utilize Secure
    Shell for remote access and don’t use the `r` commands such as `rlogin` or `rsh`.
    Secure and harden the internet services that you want to run on your system.


    You can apply the TCP wrapper access-control files, `/etc/hosts.allow` and `/etc/hosts.deny`,
    to secure some of these internet services. Quickly fix any known vulnerabilities
    of the internet services you choose to run. You can download and install the current
    security updates for your distro from their online update websites.


    ## Monitoring System Security


    Even a secure system requires constant monitoring of the log files periodically
    for signs of intrusion. You can use an excellent detection tool such as `Tripwire`
    to detect any changes made in the system files and monitor the integrity of critical
    system files and directories. Your Linux system may not come equipped with detection
    tools; you may have to download or purchase them. Once installed, you can configure
    the tool to monitor any log changes.


    It is essential to occasionally examine the log files in the `/var/log` directory
    and its subdirectories. Many Linux programs, such as some servers, write log data
    by using the logging capabilities of `syslogd` or `rsyslogd`. The log documents
    written by `syslogd` and `rsyslogd` are found in the `/var/log` directory in most
    Unix systems, so ensure that only the root user can read and write these files.


    ## Securing Internet Services


    For a Linux system connected to the Internet, or even one on a TCP/IP local area
    network (LAN) that is not connected to the Internet, a significant threat is that
    a user could use one of many Internet services to gain access to your system.
    These services, such as mail, web, and `FTP`, need to run a server program that
    responds to client requests arriving over the TCP/IP network. Some have vulnerabilities
    that an intruder could take advantage of to log in to your system, maybe even
    with root privileges. Luckily, Linux has facilities that you can help you secure
    your Internet services.


    ### Switching off Stand-Alone Services


    To provide internet services, such as web, email, and `FTP`, your Linux system
    has to run server programs that monitor incoming TCP/IP network requests. Some
    servers initiate when your system boots, and they run in the background all the
    time. These servers are known as stand-alone servers, and examples include web
    and mail servers.


    Another server, `xinetd`, begins other servers that are meant to work under `xinetd`.
    Some systems utilize the `inetd` server instead of `xinetd` to initiate other
    servers. Some servers can be designed to run on a stand-alone basis or under a
    super server such as `xinetd`. The `vsftpd` FTP server, for instance, can be set
    up to run as a stand-alone server or to operate under `xinetd` control.


    In certain distros such as Debian and Ubuntu, you can use the `update-rc.d` command
    to switch off stand-alone servers, and use the `invoke-rc.d` command to commence
    or terminate servers interactively. To understand more about the available services,
    type in this command: `ls /etc/init.d`, and view all the script files meant to
    turn services on or off. You have to apply these filenames whenever you want to
    switch services on or off.

