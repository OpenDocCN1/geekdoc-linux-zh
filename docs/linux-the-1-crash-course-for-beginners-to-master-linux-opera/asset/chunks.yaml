  trans: '

    机器之间交换数据的需求促成了网络产生，为了能够传输数据，计算机必须能够相互通信。然而，由于有许多不同的硬件和软件且每种都使用不同的语言，让它们进行通信似乎非常复杂。它们的相互作用是以一种预定义的方式进行的，被称为“协议”。基本上，协议是一组通信规则。这些协议定义了每个设备如何行为以及如何反应。基于
    Unix 的系统中最常见的协议是 `TCP/IP`，全称为传输控制协议/网络协议。


    # TCP/IP


    `TCP/IP` 是一个包含各种协议的协议族，这些协议旨在允许不同品牌的设备之间进行通信。`TCP/IP` 协议族基于分层模型，它侧重于实现互连性，而不是遵循功能层。这就是为什么
    `TCP/IP` 成为默认标准，而不是开放系统互连参考模型（`OSI`）。


    以你的电子邮件程序为例。它可以通过某些协议与操作系统（OS）通信，但不能与硬件通信。这需要一个特殊的程序来实现，并且还需要更多软件来促进计算机与互联网连接方法之间的通信。不要忘记网络连接硬件也需要通信以将你的电子邮件传递到目标计算机。因此，如果所有这些类型的通信都被归分为层，那么只有相邻层可以相互通信。


    这就是 `OSI` 模型的工作方式。尽管 `TCP/IP` 的结构与此相似，但如前，它允许跨层通信。正如示例所示，网络连接硬件可以与发送电子邮件的应用通信。`TCP/IP`
    协议族被认为是行业标准，是因为它的多功能性。


    以下是 `TCP/IP` 家族中一些协议的示例：


    - 传输控制协议 (`TCP`) – 一种面向连接的安全协议。程序首先将要传输的信息作为数据流发送，然后由操作系统将其转换为正确的格式。数据以其最初发送时的原始数据流格式到达目的地。`TCP`
    确保没有数据丢失或任何种的混乱。在任何对数据顺序重要的地方都实现了此协议。

    - 用户数据报协议 (`UDP`) – 一种不面向连接且不安全的协议。要传输的数据以应用程序已经产生的包形式发送。信息到达接收者处的顺序是不保证的，并且存在数据丢失的可能性。`UDP`
    协议适用于面向记录的应用，并且具有比 `TCP` 更短的延迟。例如，使用 `UDP` 的服务（如网络文件服务或 `NFS`）必须提供自己的机制来确保数据包的交付及其正确排序。由于它可以广播或多播，`UDP`
    也提供一对多多的服务。

    - 互联网控制消息协议 (`ICMP`) – 这不是面向最终用户的协议，而是一种特殊的控制协议，用于发布错误报告，并控制参与 `TCP/IP` 数据传输的机器的行为。此外，`ICMP`
    提供了一种特殊的回声模式，可以使用 `ping` 程序查看。

    - 互联网组管理协议 (`IGMP`) – 管理在实现 `IP` 多播时计算机的行为。


    大多数硬件协议都是面向包的。在硬盘与硬盘之间传输的数据被称为“数据包”（packets）的数据块。根据你正在使用的应用程序，数据包的大小可能不同；然而，它们足够小，可以快速跨网络传输，而不会因为大小而产生任何延迟。此外，由于它们传输得非常快，你可能不会注意到你的数据被拆分了。


    # TCP/IP 层


    如果我们抽象地观察网络通信过程，每个部分都支持其他部分并被其他部分支持。这些部分也称为“层”，按照下面的顺序堆叠在一起。


    ![](img/image_rsrc1FR.jpg)


    底层负责机器之间的物理连接。它被称为物理层，处理电缆类型、信号形式、编码等。紧邻其的是安全层或数据链路层。这些层处理访问程序，例如哪些主机可以发送数据、错误纠正等。第三层是网络层，处理远程数据传输并确保数据可以被递送并到达目的地。从更技术术语来说，这一层确保数据包要么留在网络上，要么传输到正确的网络，同时确保它们去往正确的网络地址。


    传输层确保数据按正确的顺序到达且不发生数据丢失。需要注意的是，数据链路层确保数据到达正确的目的地，而传输层确保不发生数据丢失。最后一层是应用程序程序生成和处理数据的地方。这是用户看到的层，例如电子邮件程序。


    每一层都与其在另一台机器上的对等层进行通信。这意味着匹配层之间的通信是概念性的。实际通信发生在每台机器的不同层之间，而不是在不同机器的匹配层之间。关于每个层的额外数据被添加到数据包中，以帮助每层执行其工作。这些信息可以在数据包头找到，每一层都会在每个生成的数据包上附加一个小型数据块，被称为协议头。


    当应用层有信息要发送时，它会带有必要信息的应用头，以便将数据送到接收应用程序的正确位置。应用程序随后调用 `TCP` 发送数据。`TCP` 将信息封装进带有
    `TCP` 头的 `TCP` 包中，并将其传递给 `IP`。这被称为封装。像之前的层一样，`IP` 封装数据包并添加 `IP` 头，创建一个 `IP` 数据报。然后，`IP`
    包被交给硬件驱动程序（如以太网），它会再次添加一个头部和一个尾部。这被称为以太网帧。


    '
- fmt: '

    The networking environment utilizes a diverse range of equipment to help unify
    them, `TCP/IP` determines an abstract interface through which the hardware is
    accessed. The interface provides a set of operations that is similar for all hardware
    types and basically handles the sending and receiving packets. Every peripheral
    networking device has a corresponding interface present in the kernel. For instance,
    Linux Ethernet interfaces in Linux are titled by such names as `eth0` and `eth1`,
    `ppp0` and `ppp1` for PPP interfaces, and `fddi0` and `fddi1` for FDDI interfaces.
    These names are used for configuration purposes when you want to specify a particular
    physical device in a configuration command, and they have no meaning beyond this
    use.


    Before use in `TCP/IP` networking, an interface must be assigned an IP address.
    It serves as its identification when communicating with other components. This
    address varies from the interface naming mentioned previously. Think of it this
    way: if you liken an interface to a door, the address is like the nameplate pinned
    on it.


    The IP networking protocol recognizes addresses as 32-bit numbers, and every machine
    is assigned a number unique to the network environment, mainly `IPv4`. These addresses
    usually appear in the format below.


    IP Address (binary): `11000000 10101000 00000000 00010100`

    IP Address (decimal): `192.168.0.20`


    The IP address is written as 4 decimal numbers each 8-bits long separated by dots.
    For instance, a machine with an IP address of `0x954C0C04` would be written as
    `149.76.12.4`. This format is also known as dotted decimal notation or dotted
    quad notation. It is increasingly going under `IPv4` because `IPv6` offers much
    more flexible addressing, as well as other modern features. The notation is split
    into a network number, which is found in the leading octets, and a host number
    found in the rest of the notation. When you apply to the `NIC` for an IP address,
    you are not assigned an address for every host you plan on using. Instead, you
    are assigned a network number and allowed to assign all valid IPs within this
    range to your hosts.


    The host part depends on the network size and to accommodate the various needs
    several network classes showing different places to split IP addresses have been
    defined. Here are the class networks:


    *   Class A – consists of networks `1.0.0.0` through `127.0.0.0` with the network
    number included in the first octet section. This class has a 24-bit host part,
    allowing roughly 1.6 million hosts per network.

    *   Class B – contains networks `128.0.0.0` through `191.255.0.0` with the network
    number in the first two octet sections. This class provides for 16,320 nets with
    65,024 hosts respectively.

    *   Class C – its networks range from `192.0.0.0` through `223.255.255.0`, with
    the network number contained in the first three octet sections. This class permits
    for nearly 2 million networks with up to 254 hosts.

    *   Classes D, E, and F – IP addresses in this classes range from `224.0.0.0`
    through `254.0.0.0` and are either experimental or are reserved for special use
    and don’t stipulate any network. IP Multicast, a service that allows data to be
    transmitted to many points on a network at one time, has been assigned addresses
    from within this range.


    You may have discerned that not all possible values in the previous list were
    allowed for each octet in the host section. This is because octets 0 and 255 are
    reserved for special purposes. An address where all host part bits are 0 refers
    to the network and an address where all the bits are 1 is known as a broadcast
    address. This refers to all hosts on a certain network concurrently. So, for instance,
    `148.79.255.255` is not a valid host address but instead refers to all the hosts
    on the `148.79.0.0` network.


    There other network addresses that are reserved for particular purposes such as
    `0.0.0.0` and `127.0.0.0`. The first one is called the default route and the latter
    a loopback address. The loopback address is reserved for IP traffic local to your
    host. The address `127.0.0.1` will be given to a special interface on your host,
    referred to as the loopback interface, which acts as a closed circuit. Any packet
    from `TCO` or `UDP` will be returned as if it has arrived from another network.


    ## Network Configuration


    Most Linux distros come with various graphical tools that allow users to easily
    set up a computer in a local network, connect it to an ISP (Internet Service Provider)
    or set it up for wireless access. These tools can be launched from the menu or
    the command line. For instance, RedHat Linux has `redhat-config-network`, which
    has both a graphical and a text-mode interface. Check your distribution’s documentation
    for more information about the tools available and their use.


    The tools referred to above edit particular network configuration files using
    several commands. The exact names and location of these files depend on your distribution.


    ### `/etc/hosts`


    The `/etc/hosts` file lists the hosts on network. It is used for naming without
    a service like the Domain Name (DNS). Here is an example of a host file:


    ```

    # Do not remove this line, or various programs

    # require network functionality will fail.

    127.0.0.1 localhost

    ```


    ### `/etc/resolve.conf`


    The `/etc/resolve.conf` file sets up access to a DNS server and contains your
    domain name and the names of servers. You can get more information on its man
    page.


    ### `/etc/nwitch.conf`


    The `/etc/nwitch.conf` file defines the order in which name services will be contacted.
    The DNS needs to appear in the host’s line if you plan to connect to the Internet.


    ### The `ip` Command


    The `ip` command is used to assign IP addresses to interfaces, set up routes to
    networks including the Internet, display TCP/IP configurations, etc. It is important
    to note that for network interfaces, even on a system with only one network interface,
    `lo` is the local loop, used for internal communication; `eth0` is a common name
    for a real interface. Wireless interfaces are normally defined as `wlan0` and
    modem interfaces as `ppp0`, but there might be other names as well. For IP addresses,
    marked with `inet`, the local loop always has `127.0.0.1` and the physical interface
    can have any other sequence. The address of your hardware interface, which might
    be needed as part of the authentication method to connect to a network, is labeled
    with `ether`. The local loop contains 6 pairs of all zeros, the physical loop
    has 6 pairs of hexadecimal characters, of which the first 3 pairs are vendor-specific.


    ### Using `netstat`


    The `netstat` command, an alternative to `ip`, is used to check the host network
    configuration. It has a lot of options and is useful in any Unix system. You can
    display the routing information by using the `-nr` option of the `netstat` command.


    Other commands you can use include:


    *   `/bin/hostname` – shows the name of current host.

    *   `/bin/ping` – sends `ICMP ECHO_REQUEST` packets to network hosts.

    *   `/etc/ftpaccess` – FTP access configuration file

    *   `/etc/ftphosts` – FTP individual host access file

    *   `/etc/ftpusers` – lists users who have been automatically denied FTP access

    *   `/etc/gated` – gateway routing daemon.

    *   `/etc/hosts` – lists the hosts on network.

    *   `/etc/hosts.equiv` – lists trusted hosts.

    *   `/etc/http/conf/*` – shows HTTP configuration files

    *   `/etc/inetd.conf` – shows the inetd configuration file.

    '
