    *   emerg – for emergency conditions such as a system crash that all users are
    informed about


    *   alert – indicates that the message condition needs to be addressed immediately


    *   crit – shows that the message condition is critical such as a hardware error


    *   err – shows a normal error message


    *   warning – shows a warning message


    *   notice – shows that even though the condition is not an error ir should be
    handled specially


    *   info – for information messages


    *   debug – for debugging messages


    *   none – for pseudo-level messages that don’t need logging.


    These facilities and their priorities help the user discern the system logs and
    knows where to find the information they need. The system logger decides what
    to keep or discard depending on the selector priority level.


    Chapter Summary


    *   You learned what system management is and a bit of what it entails.'
