    Ubuntu’s package manager is called `apt`. It is a powerful tool that manages all
    your system packages via the command line. Using it to update your system does
    have one drawback: you have to check for updates continually. To use this method,
    open a terminal window and type `sudo apt-get upgrade`. You will be requested
    to input your password. Next, a list of the available upgrades will appear, and
    you can go over them. To accept all the updates, click on the `Y` key and hit
    enter. This will install the updates.


    # Chapter Summary


    In this chapter, we have learned:


    * What Linux is and that an OS based on the Linux kernel or shell is called a
    distribution or distro.

    * There are numerous distributions available, some of which are designed to accomplish
    a sole purpose like running servers or act as network switches.

    * Linux can be installed on your computer system via USB stick, CD-ROM, or virtual
    installation.

    * What the Linux command line is and how to interact with the OS using it.

    * How to update your Linux OS.


    # Exercises


    Here are a few practical exercises for beginners.


    ### Exercise 1: Select a Linux distribution and install it on your PC


    Important tip: ensure that you read the information provided thoroughly to prevent
    causing any errors. Read every installation message carefully to make sure you
    install the OS successfully. Refer to the notes in this chapter if you need help.


    ### Exercise 2: Installing Operating System packages using the `apt` tool


    * Use the `apt` command-line tool to install the `clustalw` multiple alignment
    tool and the `clustalx` graphical user interface.

    * Take note of how many additional packages were required to satisfy the mandates
    for each tool.

    * Use the `clustalx` tool to align the `rRNA` sequences in `Align_Data/reference_sequences.txt`.

    * You can use the `apt-file` program to view which files have been installed by
    a specific package. Use this to view what was installed by the `clustalw` package.

    * Install `apt-file` with `apt install apt-file` (as root).

    * Build the file cache with `apt-file update`.

    * List the files for `clustalw` with `apt-file list clustalw`.

    * Look at the directories the files are installed into.


    ### Exercise 3: Installing Linux in a VM


    * Select a live Linux distro to install such as `Ubuntu live` and download its
    `.iso` image file.

    * Next set up a new VM and allocate some memory to it, (2GB) and on the hard disk
    (20GB).

    * Add the `ISO` to the virtual DVD drive and start the step-by-step installation
    process until you successfully install the Linux distribution.


    # CHAPTER 2: Desktop Environment


    One of Linux’s most distinctive features is its capacity for customization. You
    can adapt any aspect of the operating system to suit your specific needs, and
    this gives it a leg over other operating systems such as Windows or MacOS. For
    example, let’s assume you want to install Ubuntu, which is a safe, user-friendly
    choice. However, there are about eight official different flavors of Ubuntu that
    behave and look different, and this mostly comes down to the type of desktop environment
    each is using.


    Before you can fully understand what a desktop environment is accurately, let
    us expound a bit more on operating systems. All operating systems such as Windows,
    Linux, or MacOS have a kernel or shell which directly controls your computer hardware
    and translates any commands that are given by a piece of software into something
    that your equipment can understand. This way, it knows what to do when executing
    a command. The kernel also manages your hardware resources, such as memory management,
    for the various software you will be using intelligently.


    So, in a nutshell, the kernel is the brain or the engine of the system, and it
    acts as a mediator between the software and hardware. However, this is not something
    beginners should worry about too much, as most of the interaction with the computer
    system will be via a graphical user interface. This is typically what a desktop
    environment is.


    A desktop environment combines various components such as icons, menus, toolbars,
    and desktop widgets to provide a common GUI. They also include a set of integrated
    computer applications and utilities, but most importantly, they have their own
    windows manager, although it can be replaced with another compatible one. A computer
    user is free to configure their graphical user interface as they please, and desktop
    environments provide a simple way to accomplish this task.


    Users are also free to mix and match applications from several environments. For
    instance, a `GNOME` user can run `KDE` applications such as the `Konqueror` web
    browser if they prefer it over `GNOME`’s `Epiphany` web browser. However, one
    major drawback to using this mix and match approach is that many of these applications
    often rely heavily on the underlying libraries of their respective desktop environment
    (DE). This means that to install these applications, you will have to install
    a large number of dependencies, which can take up a lot of disk space. To avoid
    this, users can stick to using one desktop environment or choose alternatives
    that depend on fewer external libraries.


    One advantage of using `DE`-provided applications in their native environments
    is that they tend to work better. Mixing and matching can result in visual discrepancies,
    such as having interfaces that use different icons or widgets than those installed,
    or imported elements not working as they should, which can cause confusion and
    result in the system behaving unexpectedly.


    It is important to note that every environment is distinct in its nature and purpose.
    Deciding which `DE` to use will depend on your needs. Also, before installing
    a desktop environment, you need to install a functional `X server` because most
    environments support it. Although others also support `Wayland` as an alternative
    to `X`, many of these `DE` are still experimental. We shall take a more in-depth
    look into the `X window system` later on, but you can also visit `X.org` for more
    information.


    ## Types of Desktop Environments


    Below are some examples of officially supported desktop environments available
    to Linux users.


    ### 1. GNOME


    This is a prevalent desktop environment among Linux users. It is free, open-source,
    simple yet powerful, and easy to use. It is so popular that other desktop environments
    referred to as “forks” were developed from it. These include `Cinnamon`, `Unity`,
    etc. It was designed to be highly customizable, thus giving Linux desktop users
    a pleasant computing experience. `GNOME` key features include a dashboard that
    shows an overview of all your activities, a system-wide search tool, powerful
    in-house applications, themes, extension support, and window snapping.


    Its latest release, `GNOME 3`, showcases a modern, attractive user interface,
    and it also aims to provide better support for touch input devices. In addition,
    it now uses `Metacity` as its default window manager, and `Nautilus` comes as
    the default file manager with `Google Drive` integration. It supports desktop
    notifications using a convenient messaging system that you can turn on and off.


    Some of the advantages of using this DE include its modern and touch-friendly
    user interface. You can also extend its functionalities by using `GNOME shell
    extensions`, and it is highly customizable. Some drawbacks include its hefty utilization
    of computer resources, such as the memory, compared to other alternatives because
    of its heavily graphical interface, and some of its extension management is unsatisfactory.
    Also, to customize this DE, you need a `gnome-tweaking` tool. Some of the major
    distros that use `GNOME` include `Ubuntu GNOME`, `OpenSuSE`, `Debian`, and `Fedora`.


    ### 2. KDE

