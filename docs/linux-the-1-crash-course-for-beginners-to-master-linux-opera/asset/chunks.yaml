    几乎所有的 X 客户端都是可定制的。你可以设置客户端的外观、大小、位置、背景和边框颜色或模式、窗口是否带有滚动条等。某些应用程序甚至允许用户重新定义控制程序的按键或指针操作。大多数传统的
    UNIX 程序依赖命令行选项来允许用户更改其工作方式。虽然 X 应用程序支持命令行选项，但这并不适用于它们的所有功能。一个程序中的可定制功能太多了，无法通过命令行设置所有项。X
    提供了一种了一种优于通过命令行自定义应用程序的替代方案。X 服务器可以为应用程序存储多个配置值，以便在需要时随时备用。如果应用程序支持，则在每次程序运行时都将使用这些默认值。这些默认值被称为**资源（resources）**，它们在应用程序的基础上定义了用户对特定应用程序的颜色、屏幕位置和其他属性的偏好。这使得应用程序自定义变得更加简单。


    程序组件按层级命名，每个元素通过类名（class）和实例名（instance name）来标识。最顶层显示应用程序本身的类名和实例名。应用程序的类名通常与程序名相同；但首字母大写，例如
    `Emacs`。对于以 X 开头的程序，第二个字母也是大写的，例如 `XTerm`。每个定义都指定了一个具有相应资源和值的实例。在层级结构中，此项下方是构成了应用程序可定义层面的许多属性。


    这些资源变量可以是布尔值，例如 `scrollBar: False`，也可以是数值或字符串值，例如 `borderwidth: 4` 或 `foreground:
    green`。在用 X 工具包或其他对象系统编写的应用程序中，资源可以与程序的独立元素或控件（widgets）链接。有一种语法允许对一类元素和元素的单个实例进行独立控制。例如，对于一个名为
    `xclient` 的假设程序：


    ```

    xclient*Buttons.foreground: yellow

    xclient*help.foreground: green

    ```


    第一个资源规范将应用程序中所有按钮（`Buttons` 类中）的前景颜色改为黄色。第二个将帮助按钮（`Buttons` 类的一个实例）的前景颜色改为绿色。


    可以通过多种方式将资源值设置为程序默认，例如在主目录中包含资源文件，或通过 X 资源数据库 (`xrdb`) 程序。`xrdb` 将资源直接存储在服务器中，使得无论客户端运行在何种机器上，所有客户端都可以使用。将资源置于文件中允许你同时自定义多个资源，而不会遇到使用命令行时遇到的限制。除了在主目录中有一个命名为
    `.Xdefaults` 或 `.Xresources` 的主资源文件设置应用程序默认值外，你还可以创建系统级资源文件来设置程序默认值。此外，你还可以创建资源文件为本地工作站、网络机器或一个多个专用机器（如服务器）设置资源。


    资源管理器设置了按顺序自动读取和处理资源文件的例。资源规范的安排以及资源管理器处理它们的优先级规则，旨在让你以最少的文本输入获得设置资源的最大灵活性。你可以指定影响单个应用程序某个功能的资源（例如前面示例中的绿色帮助按钮），或者用一行定义一个控制许多程序中多个元素的资源变量。请注意，命令行选项通常高于高于资源设置。因此，你可以设置文件来控制应用程序正常运行的方式，并使用命令行指定针对应用程序实例所需的更改。


    ### 资源命名顺序


    资源文件的语法非常简单。每个客户端都识别特定的资源变量，这些变量可以分配其参考页中记录的值。大多数客户端都设计为使用 X 工具包，该工具包提供了一套标准的元素或控件，如菜单、对话框、命令按钮等。某些资源的命名语法与
    X 工具包程序中内置的元素层级结构并行。在资源定义文件中，你可以拥的最基础的一行包含客户端名称，后跟一个星号或句号以及变量名。冒号和空格将客户端名、变量名与资源变量的实际值隔开来。


    例如：`xterm*scrollBar: True`


    如果缺少客户端名称，该变量将适用于客户端的所有实例。如果它被同时指定为全局变量和客户端特定变量，则后者对该客户端具有优先级。然而，你应该注意，如果省略客户端名称，该行应以星号开头。


    例如：

    ```

    *scrollTtyOutput: False

    *scrollKey: True

    ```


    此外，请注意不要省略资源规范末尾的冒号，因为资源管理器不提供错误信息。如果规范中存在错误（例如语法错误或拼写错误），它将被忽略，你设置的值将不会生效。你可以在行开头使用感叹号（`!`）来在文件中包含注释，或对其中一个规范进行注释。如果最后一个字符是反斜杠（`\`），则假设该定义在下一行继续。


    例如：

    ```

    xterm*VT100.translations: #override \

    <Key>BackSpace: string(0x7F) \

    <Key>Insert: string(0x1b) string("[2~")

    <Key>Delete: string(0x1b) string("[3~")

    <Key>Home: string(0x1b) string("[1~")

    <Key>End: string(0x1b) string("[4~")

    <Key>Page_Up: string(0x1b) string("[5~")

    <Key>Page_Down: string(0x1b) string("[6~")

    <Key>Prior : scroll-back(1,page)

    <Key>Next : scroll-forw(1,page)

    ```


    ### 工具包客户端语法


    如前所述，工具包应用程序由控件组成，控件之间可以嵌套控件；例如对话框中的下拉菜单。这些工具包应用程序的资源规范语法与控件层级结构匹配。你应该认为资源规范具有以下格式：


    `object.subobject[.subobject. . .].attribute: value`


    其中 `object` 指客户端程序或其特定实例。`subobjects` 指控件层级结构，`attribute` 是最后一个子对象的特性，而 `value`
    是资源的实际设置。资源的值可以通过资源名称或参考页中的变量描述看出。例如，`background` 等资源接受颜色规范，`geometry`接受几何字符串，`font`接受字体名称等。像
    `scrollBar` 这样的逻辑值可以指定为 `yes` 或 `no`、`on` 或 `off`，或者 `True` 或 `False`。


    ### 紧绑定与松绑定


    资源规范组件之间的链接方式被称为绑定，可以通过两种方式实现。第一种是紧绑定，通过点（`.`）指示；第二种是松绑定，通过星号（`*`）表示。紧绑定意味着两侧的元素在层级结构中是相邻的。相反，松绑定（由通配符星号表示）表示两个元素之间存在多个层级。你必须非常熟悉控件层级结构才能指定紧绑定，错误使用它们的情况不少见。


    例如，这个资源规范。


    ```

    xterm.scrollBar: True

    ```

