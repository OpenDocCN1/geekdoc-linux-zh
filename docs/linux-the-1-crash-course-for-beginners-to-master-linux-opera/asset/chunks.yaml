- fmt: "\nRisk analysis helps assess the potential dangers that could harm your system.\
    \ A risk analysis defines the risk, then it identifies and establishes the priority\
    \ for handling these risks. Risk analysis looks at any possible threats, what\
    \ you are protecting your system against, the vulnerabilities and weaknesses in\
    \ your system that could be exploited by those threats, the probability or likelihood\
    \ that a threat will exploit the weakness, and the impact such a risk poses and\
    \ any mitigation measures that could be taken to reduce or remove these vulnerabilities.\n\
    \n# Threats\n\nThis is a list of typical attacks a Linux system can come under.\n\
    \n1. **A DoS attack**\n   This attack ties up the computer and network so that\
    \ legitimate users cannot use or access the system. Let’s take a company; for\
    \ instance, a DoS attack can cripple service and cause revenue losses. Since bringing\
    \ an organization down with one computer attack can be hard, a common tactic is\
    \ to redirect several computers to a single site and let them crash the system.\
    \ This is referred to as a distributed attack, or `DDoS`.\n\n2. **Unauthorized\
    \ hacking**\n   This is when an unauthorized user gains access to the system.\
    \ They can steal, corrupt, or delete data. This can have adverse effects on the\
    \ system, such as causing it to crash.\n\n3. **Disclosure of information**\n \
    \  To disclose is to release, show, or tell something that is private. A good\
    \ example would be the disclosure of a password file that shows potential hackers\
    \ your login credentials. This also applies to the leakage of sensitive data such\
    \ as financial or medical reports.\n\n# Vulnerabilities\n\nHere are some of the\
    \ areas in which systems and networks are vulnerable to attacks: by divulging\
    \ and sharing user passwords and security credentials; through unsecured access\
    \ points such as routers and network switches; the interconnections between the\
    \ system and the Internet, such as gateways; loose or bad security from 3rd party\
    \ network providers (ISPs); holes in the operating system’s security such as internet\
    \ holes associated with the `sendmail`, `named`, and `bind` commands; lastly,\
    \ weaknesses in specific applications. All these vulnerabilities are potential\
    \ entry points for security threats.\n\n# Securing Linux\n\nAfter determining\
    \ a security policy, you can move on to securing the system as per your policy.\
    \ As stated earlier, the exact steps of how you secure your system will depend\
    \ on what you want to do with the system, whether it’s a workstation or server,\
    \ and how many users are expected to use the system. Linux security is covered\
    \ in two broad categories, namely host security and network security issues, and\
    \ to secure your system you have to handle both.\n\n**Important tip**: if your\
    \ host is connected to a large network, the directory services can present some\
    \ security issues, so look into them.\n\n## Host-Security\n\nThis involves dealing\
    \ with issues related to securing the OS, files, and directories. Here are some\
    \ guidelines on how to address host-security problems.\n\n1. Don’t install software\
    \ you don’t need. For instance, if your system is a workstation, you don’t need\
    \ web or news servers.\n2. Create all the user accounts you will need in the beginning\
    \ and ensure they have strong passwords. Linux has tools you can use to enforce\
    \ strong passwords.\n3. Set file ownership and access to safeguard important files\
    \ and directories.\n4. If your system has the capability of mandatory access control,\
    \ enable it. This feature has been supported by kernels through the incorporation\
    \ of Security-Enhanced Linux (`SELinux`) since the release of kernel `2.6`. Think\
    \ of it as a layer wrapped around your system, thus adding more security.\n5.\
    \ Use the GNU Privacy Guard (`GnuPG`) to encrypt or decrypt files with sensitive\
    \ data and to authenticate downloaded files. `GnuPG` comes with most Linux distros,\
    \ and you can use the `grp` command to encrypt, decrypt and even make a digital\
    \ signature.\n6. Utilize file integrity tools to monitor any changes to crucial\
    \ system files and directories.\n7. Check various log files periodically for any\
    \ signs of tampering, break-ins, or attempted break-ins. These files can be found\
    \ in the `/var/log` directory of your system. You can install stable security\
    \ updates as soon as they are made available. They target the vulnerabilities\
    \ of the system and fix them. Make sure you test this update out before updating\
    \ your system and machines.\n8. You could spend a lot of time hardening your system\
    \ and forget the physical aspect of security. What’s the point of finally having\
    \ a secure system if someone breaks in and steals it? You can set up your system\
    \ in secure rooms where you can control access.\n\n## Using GnuPG to Encrypt and\
    \ Sign Files\n\nLinux comes equipped with the GNU Privacy Guard (`GnuPG` or `GPG`)\
    \ encryption and authentication utility. It lets you create a private and public\
    \ encryption key, then uses the key to encrypt your files and sends a digital\
    \ authentication to show that the message came from you. Someone with your public\
    \ key can verify this. The idea of using public encryption keys is basically to\
    \ have two keys that are related but cannot be used to figure out one from the\
    \ other. Anything encrypted with any of the keys can only be decrypted with the\
    \ corresponding key. You distribute the public key to other people, but keep the\
    \ private one to yourself.\n\nLet’s use an example to help illustrate the use\
    \ of encryption keys. Jane wants to send a secure message to Joe. Every user generates\
    \ a public and private key, and they swap their public keys. If Jane wants to\
    \ send Joe a message, she encrypts the data with his public key and sends the\
    \ message to him. Since the message is encrypted, it is secure from eavesdropping\
    \ because only Joe’s key can decrypt it, and only Joe has that key. Once Joe receives\
    \ the message, he used his key to decrypt the message and reads it. At this point,\
    \ you might have noticed some vulnerabilities. These include, how could Joe be\
    \ sure the message came from Jane? What if someone else has Joe’s key and sent\
    \ the message posing as Jane? This is where digital signatures come in.\n\n###\
    \ Digital Signatures\n\nThe purpose of an electronic signature is to help identify\
    \ you. Unlike pen-and-paper ones, digital signatures depend on the message you\
    \ are sending. You first start by applying a mathematical function to the message\
    \ and then reducing it to a fixed-size message digest known as a hash or fingerprint.\
    \ Despite the size of your message, the digest is either 128 or 160 bits, depending\
    \ on your hashing function. Next, you apply your public key by encrypting the\
    \ message digest with your private key and get your digital signature. It is normally\
    \ added to the end of the electronically signed message.\n\nDigital signatures\
    \ let anyone who wants to verify that you signed the message to use the public\
    \ key and decrypt it to see the message digest or encrypted hash. They can run\
    \ the same hash function on the message and match the computed value with the\
    \ decrypted one. Since your public key was used to verify and decrypt the message,\
    \ it must have been meant for you.\n\n### Using GPG\n\nThe GNU Privacy Guard (`GPG`)\
    \ contains the tools you require to use public-key encryption and digital signatures.\
    \ The first step is decryption, and you can get the hang of using `GPG` as you\
    \ progress gradually. With `GPG`, you can generate encryption keys, exchange keys,\
    \ sign files, encrypt, and decrypt documents. Let us take a look at each of these\
    \ functions.\n\n#### Generating Key Pairs\n\nType in the `gpg --gen-key` command.\
    \ If this is your first time using `GPG`, it will create a `.gnupg` directory\
    \ in your home directory, and a file named `.gpg.conf` will be created in that\
    \ directory. It will then ask what kind of key you want. Either `DSA` and `ElGamal`\
    \ (which is the default), `DSA` (sign only), or `RSA` (sign only).\n"
  raw: 'Risk analysis helps assess the potential dangers that could harm your system.
    A risk analysis defines the risk, then it identifies and establishes the priority
    for handling these risks. Risk analysis looks at any possible threats, what you
    are protecting your system against, the vulnerabilities and weaknesses in your
    system that could be exploited by those threats, the probability or likelihood
    that a threat will exploit the weakness, and the impact such a risk poses and
    any mitigation measures that could be taken to reduce or remove these vulnerabilities.


    Threats


    This is a list of typical attacks a Linux system can come under.


    1.  A DoS attack


    This attack ties up the computer and network so that legitimate users cannot use
    or access the system. Let’s take a company; for instance, a DoS attack can cripple
    service and cause revenue losses. Since bringing an organization down with one
    computer attack can be hard, a common tactic is to redirect several computers
    to a single site and let them crash the system. This is referred to as a distributed
    attack, or DDoS.


    2.  Unauthorized hacking


    This is when an unauthorized user gains access to the system. They can steal,
    corrupt, or delete data. This can have adverse effects on the system, such as
    causing it to crash.


    3.  Disclosure of information


    To disclose is to release, show, or tell something that is private. A good example
    would be the disclosure of a password file that shows potential hackers your login
    credentials. This also applies to the leakage of sensitive data such as financial
    or medical reports.


    Vulnerabilities


    Here are some of the areas in which systems and networks are vulnerable to attacks:
    by divulging and sharing user passwords and security credentials; through unsecured
    access points such as routers and network switches; the interconnections between
    the system and the Internet, such as gateways; loose or bad security from 3rd
    party network providers (ISPs); holes in the operating system’s security such
    as internet holes associated with the  sendmail,  named, and  bind  commands;
    lastly, weaknesses in specific applications. All these vulnerabilities are potential
    entry points for security threats.


    Securing Linux


    After determining a security policy, you can move on to securing the system as
    per your policy. As stated earlier, the exact steps of how you secure your system
    will depend on what you want to do with the system, whether it’s a workstation
    or server, and how many users are expected to use the system. Linux security is
    covered in two broad categories, namely host security and network security issues,
    and to secure your system you have to handle both.


    Important tip: if your host is connected to a large network, the directory services
    can present some security issues, so look into them.


    Host-Security


    This involves dealing with issues related to securing the OS, files, and directories.
    Here are some guidelines on how to address host-security problems.


    1.  Don’t install software you don’t need. For instance, if your system is a workstation,
    you don’t need web or news servers.


    2.  Create all the user accounts you will need in the beginning and ensure they
    have strong passwords. Linux has tools you can use to enforce strong passwords.


    3.  Set file ownership and access to safeguard important files and directories.


    4.  If your system has the capability of mandatory access control, enable it.
    This feature has been supported by kernels through the incorporation of Security-Enhanced
    Linux (SELinux) since the release of kernel 2.6\. Think of it as a layer wrapped
    around your system, thus adding more security.


    5.  Use the GNU Privacy Guard (GnuPG) to encrypt or decrypt files with sensitive
    data and to authenticate downloaded files. GnuPG comes with most Linux distros,
    and you can use the  grp command to encrypt, decrypt and even make a digital signature.


    6.  Utilize file integrity tools to monitor any changes to crucial system files
    and directories.


    7.  Check various log files periodically for any signs of tampering, break-ins,
    or attempted break-ins. These files can be found in the  /var/log directory of
    your system. You can install stable security updates as soon as they are made
    available. They target the vulnerabilities of the system and fix them. Make sure
    you test this update out before updating your system and machines.


    8.  You could spend a lot of time hardening your system and forget the physical
    aspect of security. What’s the point of finally having a secure system if someone
    breaks in and steals it? You can set up your system in secure rooms where you
    can control access.


    Using GnuPG to Encrypt and Sign Files


    Linux comes equipped with the GNU Privacy Guard (GnuPG or GPG) encryption and
    authentication utility. It lets you create a private and public encryption key,
    then uses the key to encrypt your files and sends a digital authentication to
    show that the message came from you. Someone with your public key can verify this.
    The idea of using public encryption keys is basically to have two keys that are
    related but cannot be used to figure out one from the other. Anything encrypted
    with any of the keys can only be decrypted with the corresponding key. You distribute
    the public key to other people, but keep the private one to yourself.


    Let’s use an example to help illustrate the use of encryption keys. Jane wants
    to send a secure message to Joe. Every user generates a public and private key,
    and they swap their public keys. If Jane wants to send Joe a message, she encrypts
    the data with his public key and sends the message to him. Since the message is
    encrypted, it is secure from eavesdropping because only Joe’s key can decrypt
    it, and only Joe has that key. Once Joe receives the message, he used his key
    to decrypt the message and reads it. At this point, you might have noticed some
    vulnerabilities. These include, how could Joe be sure the message came from Jane?
    What if someone else has Joe’s key and sent the message posing as Jane? This is
    where digital signatures come in.


    Digital Signatures


    The purpose of an electronic signature is to help identify you. Unlike pen-and-paper
    ones, digital signatures depend on the message you are sending. You first start
    by applying a mathematical function to the message and then reducing it to a fixed-size
    message digest known as a hash or fingerprint. Despite the size of your message,
    the digest is either 128 or 160 bits, depending on your hashing function. Next,
    you apply your public key by encrypting the message digest with your private key
    and get your digital signature. It is normally added to the end of the electronically
    signed message.


    Digital signatures let anyone who wants to verify that you signed the message
    to use the public key and decrypt it to see the message digest or encrypted hash.
    They can run the same hash function on the message and match the computed value
    with the decrypted one. Since your public key was used to verify and decrypt the
    message, it must have been meant for you.


    Using GPG


    The GNU Privacy Guard (GnuPG) contains the tools you require to use public-key
    encryption and digital signatures. The first step is decryption, and you can get
    the hang of using GPG as you progress gradually. With GPG, you can generate encryption
    keys, exchange keys, sign files, encrypt, and decrypt documents. Let us take a
    look at each of these functions.


    Generating Key Pairs


    Type in the  gpg --gen-key command. If this is your first time using GPG, it will
    create a .gnupg directory in your home directory, and a file named .gpg.conf will
    be created in that directory. It will then ask what kind of key you want. Either
    DSA and ElGamal (which is the default), DSA (sign only), or RSA (sign only).'
