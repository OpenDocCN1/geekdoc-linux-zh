- fmt: '

    In Fedora and SUSE, stand-alone servers can be switched on and off by using the
    `systemctl` command. Input the `ls /etc/init.d` command to acquire the service
    scripts, then switch off a service (such as `xinetd` or `Samba`) by typing `sudo
    systemctl stop smb` or the proper syntax for the `xinetd` command. If the service
    was already operating, use `/etc/init.d/smb stop` to halt the Samba service. You
    can operate scripts from the `/etc/init.d` directory with the `halt` argument
    to stop any service in a related manner.


    # Internet Super Server Configuration


    Along with stand-alone servers such as web and mail servers, the `inetd` and `xinetd`
    servers have to be configured individually. These servers are Internet super servers
    because they can launch other servers on demand. You can input `ps ax | grep inetd`
    to view which Internet super server, `inetd` or `xinetd`, your system operates.
    Debian and Ubuntu use `inetd`, and Fedora and SUSE use `xinetd`.


    The `inetd` server is set up through the `/etc/inetd.conf` file. To disable a
    service, locate the appropriate line and comment it out by putting a pound sign
    (`#`) at the beginning of that line. After saving the set up file, type in `/etc/init.d/inetd
    restart` to restart the `inetd` server.


    Setting up the `xinetd` server is a bit harder. This server reads a configuration
    file titled `/etc/xinetd.conf` at system initialization. This file, in turn, references
    configuration files saved in the `/etc/xinetd.d` directory. The files in `/etc/xinetd.d`
    show the `xinetd` command which ports to listen to and the server to launch for
    each port. Type in `ls /etc/xinetd.d` to view a list of the documents in the `/etc/xinetd.d`
    directory on your Linux system. Every file denotes a service that `xinetd` can
    launch. To switch off any of them, edit the file in a text editor, and add a `disable
    = yes` line in the file.


    After making changes in the `xinetd` set up files, a restart of the `xinetd` server
    is required for the changes to take effect. To restart the server, input `/etc/init.d/xinetd
    restart` into the command line. This will terminate the `xinetd` server and then
    restart it. When `xinetd` restarts, it reads the configuration data and effects
    the changes.


    # Configuring TCP Wrapper Security


    An essential security feature of `inetd` and `xinetd` is their usage of the TCP
    wrapper to launch various services. The TCP wrapper is a code block that provides
    an access-control facility for internet services by acting like a shielding package
    for your message. The wrapper can initiate other services, such as FTP and Telnet.
    However, before launching a service, it confers with the `/etc/hosts.allow` file
    to discern whether the host requesting the service is authorized to use that service.
    If nothing about that host emerges in `/etc/hosts.allow` file, the wrapper checks
    the `/etc/hosts.deny` file to discern whether it should deny the service. If both
    files are empty, the TCP wrapper can provide access to the requested service.


    Here are the steps on how to tighten access to the services that `inetd` or `xinetd`
    is set up to start:


    1.  Use a text editor such as `vi` to edit the `/etc/hosts.deny` file, to include
    the following line: `ALL:ALL` — this setting denies all hosts access to any Internet
    services on your system.

    2.  Edit the `/etc/hosts.allow` file and include to it the hostnames that can
    access services on your system.

    3.  To permit only hosts from the `192.168.1.0` network and the localhost (IP
    address `127.0.0.1`) to obtain the services on your system, put the following
    line in the `/etc/hosts.allow` file: `ALL: 192.168.1.0/255.255.255.0 127.0.0.1`.

    4.  If you want to authorize a specific remote host access to a specific internet
    service, use the following order for a line in `/etc/hosts.allow`: `server_program_name:
    hosts` — here, `server_program_name` is the title of the server program, and `hosts`
    is a comma-separated listing of the hosts that have access to the service. You
    can also enter `hosts` as a network address or an entire domain name, such as
    `.myplace.com`.


    # Computer Security Tools


    These are some common tools you can use as you secure your system:


    1.  `chage` – modifies the time between required password changes. You can set
    the minimum and the maximum number of days and the number of warning days to be
    given so that a change is made, and the expiration date.

    2.  `find` – one of the most powerful all-rounded tools in this system. The command
    lets you find almost anything on a machine if you have the right syntax. Among
    the many choices, you can find files created by a user, by a group, or on a certain
    date, with certain permissions.

    3.  `lsof` – an acronym for the list open files utility. Depending on the parameters
    applied, you can choose to view files opened by a process or by a user.

    4.  `netstat` – lets you view the status of the network, network connections,
    routing tables, and statistics per interface, etc. There is a similar command,
    `ss`, that is intended to replace much of the functionality here.

    5.  `nmap` – scans the network and creates a map of what’s available on it. This
    ability makes it ideal for port scanning and security auditing.

    6.  `passwd` – allows the user to change their passwords in the command line.
    It shouldn’t be confused with the file by the same name that has user account
    information. Many users don’t know of its existence and opt to change passwords
    via the graphical interface tools.

    7.  `su` – grants temporarily root access to another user, and can be used in
    the current user’s session. Another shell is made; when a user exits this second
    shell, the user reverts to the original session. This utility can be used to become
    the root user or any other user as long as you have the password.

    8.  `sudo` – instead of starting a new session (as needed in `su`) to carry out
    a job with special privileges, `sudo` lets the user just run that task with elevated
    privileges.

    9.  `ulimit` – sets the resource limits on shells to keep a single user from excessively
    hogging all the system resources.

    10. `usermod` – can be viewed as an enhanced version of `chage`. It can set or
    change password expiration parameters and used to specify a default shell, to
    lock or unlock a user account, etc.


    # Chapter Summary


    Let’s recap:


    *   We established what underlying security is and why it is crucial to secure
    your system.

    *   We took a look at risk analysis and some of the threats your system might
    face.

    *   We looked at how to protect your files and system in general by assigning
    users the appropriate ownership and permissions.

    *   We discussed some host-security issues such as access control, and how you
    could use GPG to encrypt your files.

    *   We discussed how to handle network-related security issues and some security
    tools you can use.


    Exercises


    1.  Carry out a system security audit. Have you discovered any possible threats
    or vulnerabilities in your system?

    2.  Check and see if your system is security compliant. Are there any ways you
    can reinforce your security?

    3.  Download the GNU Privacy Guard (GPG) tool and install it. Try generating encryption
    key pairs. Were you successful?

    4.  Now try to encrypt and decrypt a file. Were you successful?


    # Chapter 6: Networking with Linux


    Linux and networking go hand in hand. Not only is Linux the operating system of
    choice, but it has a wide array of tools, features and applications that allow
    integration into all types of network structures. Linux is preferred because of
    its robust nature even under heavy loads which are a result of the many years
    of debugging and testing.


    Networking is a broad subject, and we couldn’t possibly cover everything in one
    chapter. However, in this chapter, we will take a look at what networking in Linux
    entails. We will explore some of the tools and fundamental mechanisms of networking.
    We will also take a look at how to configure your network.


    ## Network Protocols

