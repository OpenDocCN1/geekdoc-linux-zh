    # 结语


    在本书中我们深入研究了 `Linux`，到目前你已经对操作系统有了浅显或深入的了解。开源软件的广泛应用催生了无数的新技术。这些包括由 `Google` 在
    `Linux kernel` 上开发的 `Android OS`，更不用说像 `Ubuntu`、`RedHat` 和 `Debian` 等许多发行版了。每天都有越来越多像你这样的人在学习开源软件的益处，以及它能够满足各种需求的能力。


    虽然我们在这书中没有讨论`物联网`，但这是 `Linux` 帮助引导走向未来的另一个领域。总而言之，物联网（或 `IoT`）是指通过`Internet` 连接的计算设备之间的互连，使它们能够相互发送和接收数据。例如，如`恒温器`或空调等智能设备。你现在可以使用手机控制这些以及更多设备。你可能会好奇这这一切是如何与
    `Linux` 联系起来的。这是因为恒温器与手机通信的结构是基于 `Linux` 及其作为云计算的各种应用。


    还有许多从开源软件中涌出的新兴技术，例如 `Blockchain`，它因 `Bitcoin` 和其他加密货币频登头条。你可以看到开源软件（特别是 `Linux`）是如何驱动创新的。学习
    `Linux` 的益处远不止能够跟上新技术。你将学习作为服务器的硬件系统是如何工作的，因为它们大部分使用 `Linux`。精通 `Linux` 你甚至可以获得一份工作，或者至少增加你的就业机会。它的应用有助于公司降低运营成本，提高面对攻击的可靠性和韧性，并促进不同设备的集成，因为
    `Linux` 是跨平台的。


    列表是无穷无尽的，海量的 `Linux` 发行版证明了这个系统实际上是多么无限制。有适合任何口味的发行版，如果你找不到，就自己构建并与世界分享。关于你可能想了解的
    `Linux` 以及各种发行版的方面，还有大量的文档。这包括阅读 `man pages` 和在线提供的各种 `HOWTOs`。


    本书适用于任何对 `Linux` 感兴趣的人，无论你对此一无所知，还是只是想磨炼某些技能。示例和练习旨在帮助你内化每一章中教授的概念。虽然在被称为 `Linux`
    大师之前可能需要一些时间，但阅读这本书是向正确方向迈出的一步。


