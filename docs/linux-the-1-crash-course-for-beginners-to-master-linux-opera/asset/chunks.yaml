    这与使用图形库来编写应用程序并无区别；然而，X 更进了一步。它并不要求应用程序与服务器位于同一台计算机上。这是因为客户端和服务器之间通信的协议可以在网络上运行，甚至可以在任何提供可靠字节流的进程间通信机制上运行。实现此点的优选方法是使用
    `TCP/IP` 协议。这里这个示例可以更好地说明 X 系统的强大之处：你可以在你的 Dell 电脑上运行一个计算密集型应用程序，在 Solaris 服务器上运行数据库监控程序，同时在某个小型
    BSD 邮件服务器上使用电子邮件应用程序，并在另一台服务器上使用可视化程序，在你的 Linux 工作站上显示所有这些信息。


    显而易见，X 服务器负责处理图形显示。由于它运行在用户使用的实际计算机或设备上，因此与用户交互是服务器的责任。这意味着读取输入设备并将这些信息传递给客户端，以便其做出相应反应。X
    还有一个名为 `Xlib` 的库，负责处理所有底层的客户端-服务器通信。客户端必须使用该库包含的函数来完成任务。


    ## 客户端/服务器关系


    X 基于客户端/服务器架构，并作为服务器和客户端程序的组合而激活。在这里，“客户端”和“服务器”术语用于指代本地和远程设备。以下是更多的客户端-服务器术语。


    *   `X server` – 指运行在本地主机上的程序，该程序连接到用户的显示器和输入设备

    *   `X client` – 指运行在远程主机上的程序，在与 `X server` 通信的同时处理数据。

    *   `Application server` – 同样运行在远程主机上的程序，处理数据并与应用程序客户端通信。

    *   `Application client` – 运行在本地主机上的程序，连接到用户的显示器和输入设备


    现代 X 服务器具有 `MIT` 共享内存扩展，并可以使用本地共享内存与其本地客户端通信。这消除了对网络透明的 `Xlib` 进程间通信的需求，并使系统能够渲染更大的图像。


    X 窗口系统的工作原理类似于所有的客户端/服务器模型，`X server` 包含了若干提供给客户端的资源。如前所述，服务器和客户端程序不必在同一台机器上，因为
    X 被包含在 `TCP/IP` 协议中。由于 X 更多像是一个协议而不是程序，即使计算机的架构不同，它们仍然可以通信。例如，一个数字 `OSF/I` 服务器可以为
    Linux 和 `AIX` 客户端提供服务，也可以为向 `OSF/I` 服务器提供的任何系统提供服务。与其他网络应用程序类似，单台机器可以作为客户端也可以作为服务器。


    服务器充当应用程序和硬件之间的接口，因此当你通过输入设备输入数据时，它负责将这些数据传递给应用程序。这被称为一个“事件”。当用户按下按键时，会触发一个应用程序必须做出响应的事件。例如，如果你点击特定的菜单项，此事件将传递给客户端程序，程序通过请求服务器显示下拉菜单来做出响应。服务器随后将此信息传递给硬件，由硬件在屏幕上显示菜单。这种功能分离的产物是，一个客户端可以在多个服务器上显示信息。


    要启动任何进程，`X server` 必须运行在客户端所在的同一台机器或网络某处。某些系统具有图形登录界面，会在启动进入桌面环境时自动启动。或者，系统可以通过
    `startx` shell 脚本启动。该命令读取主目录下的 `.xinitrc` 和 `.xserverrc` 文件，并处理方式类似于 shell 管理
    `.cshrc` 和 `.kshrc` 文件的方式。这就是终端窗口和窗口管理器等应用程序启动的地方。


    ## 配置 X 窗口系统


    在 X 窗口系统的早期，配置显示器意味着你必须对显示能力有深入的了解，并能够表达关于分辨率、位置、色深、字体等的数据。随着视频电子标准协会 (`VESA`)
    和显示器数据通道 (`DDC`) 协议的出现（这些协议允许显示器将这些能力通信给显卡，然后给计算机），配置变得更加自动化。配置硬件设备也变得简单得多；你只需将其插入并开始使用即可。


    然而，与 Linux 中的所有事物一样，存在着你可以使用的底层配置。事实上，`X.org` 的 X 实现从几个源获取这些信息，最主要的来源是 `xorg.conf`
    文件。它还包含了位于 `/etc/X11` 的 `xorg.conf.d` 目录下的文件。你可以通过命令行、桌面环境变量、自动检测或恢复默认值添加额外的配置。不过，你不需要太担心，因为大多数发行版都带有一个配置工具来为你配置
    X，或者至少以一种不那么复杂的方式呈现它。


    此外，`Xorg` 设置命令可以自动检测设备，因此消除了对高级编辑的需求。如果你的硬件或设备没有出现，你可能需要编辑该目录。请极其小心，因为在服务器中进行任何更改都可能导致你的机器无法加载甚至损坏显示器。编辑任何系统文件都存在永久损坏你计算机的可能性。


    ## 硬件与 X


    我们知道 `X server` 控制输入输出设备，由于每天都有新硬件开发，我们无法对硬件兼容性给出非常具体的说明。为了提供帮助，这里有一些常识。


    *   根据经验，如果设备使用如 `PS/1` 或 `PS/2` 等常见协议，它应该得到很好的支持。然而，如果它是新技术，很可能还没有被支持。

    *   对于显示器——Linux 不需要与任何特定的显示器兼容，因为这是显卡的工作。只要你的显卡与显示器工作，它就应该工作。

    *   对于显卡——`X server` 取决于芯片组，自然，很多显卡都是支持的。然而，修订版和新显卡可能尚未被支持。现在的显卡带有更好的支持和优化，某些甚至具有高级功能，如多头显示、3D、电视输出、`DRI`
    等。你必须进行良好的研究才能确定该显卡是否被支持。完整的支持列表列表可以在网上找到。还要注意，开源驱动是逐渐开发的，例如某个显卡在基础显示功能上运行良好，但特殊功能会在开发周期的后期出现。然而，专利驱动的开发有所不同。

    *   键盘——任何键盘都应该工作。

    *   鼠标和其他指针设备——大多数设备都应该得到支持，包括 `PS/2`、总线、串行、`USB`、光学和红外设备。多键和带滚轮的鼠标通过 `IMPS/2`
    或特定协议支持。然而，它们在某些应用程序可能需要额外的配置。


    你可以查看发行版网站上的硬件兼容性列表，查看哪些设备适用于你的版本。


    X Resources


    '
- fmt: '

    Virtually all X clients are customizable. You can set how a client looks, its
    size, placement, background and border color or pattern, whether or not the window
    has a scroll bar, and more. Some applications even let users redefine the keystrokes
    or pointer actions used to control the program. Most traditional UNIX programs
    relied on command-line options to enable users to alter how they worked. Although
    X applications support command-line options, this does not apply to all their
    features. There would be too many customizable features in a program to set them
    all via the command line. X has an alternative to customizing an application through
    the command line. The X server can store several configuration values for applications,
    so they are readily available when needed. If the application supports it, these
    defaults will be used whenever the program runs. These are known as resources,
    and they define a user’s preference on a per-application basis for colors, screen
    placement, and other attributes. This makes application customization even easier.


    Program components are named hierarchically, with each element identified by a
    class and instance name. The topmost level shows the class and instance name of
    the app itself. The class name of an application is often the same as the program
    name; however, the first letter is capitalized, such as `Emacs`. For programs
    beginning with X, the second letter is also capitalized, such as `XTerm`. Each
    definition specifies an instance with the corresponding resources and values.
    Under this, in the hierarchy, are the many attributes that comprise the definable
    aspects of an application.


    These resource variables can be Boolean such as `scrollBar: False` or have a numeric
    or string value such as `borderwidth: 4` or `foreground: green`. In applications
    written using the X toolkit or other object-oriented systems, resources can be
    linked with separate elements or widgets in a program. There is a syntax that
    allows for independent control over a class of elements and a singular instance
    of the element. For example, for a hypothetical program called `xclient`:


    ```

    xclient*Buttons.foreground: yellow

    xclient*help.foreground: green

    ```


    The first resource specification changes the foreground color of all buttons (in
    the `Buttons` class) in the application to yellow. The second one changes the
    foreground color of the help button (an instance of the `Buttons` class) to green.


    Resource values can be set as program defaults in several ways, such as including
    resource files in your home directory or through the X resource database (`xrdb`)
    program. `xrdb` stores resources directly in the server, making them available
    to all clients regardless of the machine the client is running on. Placing resources
    in files lets you customize multiple resources at once without the restrictions
    encountered when using the command line. Other than having a primary resource
    file (named `.Xdefaults` or `.Xresources`) in your home directory that sets application
    defaults, you can create system-wide resource files to set program defaults. Additionally,
    you can create resource files to set resources for the local workstation, networked
    machines, or for one or more specialized machines such as servers.


    The resource manager sets routines that automatically read and process resource
    files in a certain order. The arrangement for resource specifications and the
    rules of precedence by which the resource manager processes them are meant to
    give you the most flexibility in setting resources with the minimum amount of
    text input. You can specify a resource that affects a single feature of a single
    application such as the green help button in the earlier example or define a resource
    variable that controls a function of multiple elements within many programs with
    a single line. Take note that command-line options often take precedence over
    other resource settings. So you can set up the files to control how the application
    will work normally and use the command line to specify the changes you require
    for an instance of the application.


    ### Resource Naming Order


    The basic syntax of a resource file is quite simple. Each client recognizes specific
    resource variables that can be assigned values that are documented in its reference
    page. Most clients are designed to utilize the X toolkit, which provides a standard
    set of elements or widgets like menus, dialog boxes, command buttons, etc. The
    naming syntax of certain resources parallels the element’s hierarchy that is built
    into X toolkit programs. In a resource definition file, the most basic line you
    can have comprises the client name followed by an asterisk or a period and the
    name of the variable. A colon and space separate the client and variable names
    from the actual value of the resource variable.


    For instance: `xterm*scrollBar: True`


    If the client’s name is absent, the variable will apply to all instances of the
    client. If it is specified as a global variable and a client-specific variable,
    the latter takes precedence for that client. However, you should note that if
    the client’s name is omitted, the line should begin with an asterisk.


    For example:

    ```

    *scrollTtyOutput: False

    *scrollKey: True

    ```


    Also, take care not to omit the colon at the end of the resource specification
    because the resource manager provides no error messages. If there is an error
    in the specification, such as a syntax error or a misspelling, it is ignored,
    and the value you set will not take effect. You can use the exclamation mark (`!`)
    at the beginning of the line to include a comment in the file or comment on one
    of the specifications. If the last character is a backslash (`\`), the definition
    is assumed to continue on the next line.


    For example:

    ```

    xterm*VT100.translations: #override \

    <Key>BackSpace: string(0x7F) \

    <Key>Insert: string(0x1b) string("[2~")

    <Key>Delete: string(0x1b) string("[3~")

    <Key>Home: string(0x1b) string("[1~")

    <Key>End: string(0x1b) string("[4~")

    <Key>Page_Up: string(0x1b) string("[5~")

    <Key>Page_Down: string(0x1b) string("[6~")

    <Key>Prior : scroll-back(1,page)

    <Key>Next : scroll-forw(1,page)

    ```


    ### Toolkit Client Syntax


    As stated earlier, X toolkit apps are made of widgets, and there can be a widget
    inside a widget; for instance, a drop-down menu in a dialog box. The syntax of
    resource specifications for these toolkit applications matches the levels of widget
    hierarchy. You should think of a resource specification having the following format:


    `object.subobject[.subobject. . .].attribute: value`


    Where the `object` refers to the client program or a specific instance of it.
    The `subobjects` refer to the levels of widget hierarchy, the `attribute` is a
    feature of the last subobject, and the `value` is the actual setting of the resource.
    The value of a resource is clear from the resource name or the description of
    the variable in the reference pages. For instance, resources such as `background`
    take color specifications, `geometry` takes a geometry string, `font` takes a
    font name, etc. Logical values like those taken by `scrollBar` can be specified
    as either yes or no, on or off, or `True` or `False`.


    ### Tight and Loose Bindings


    How components of a resource specification are linked is referred to as binding,
    and it can be done in two ways. The first is by a tight binding, which is indicated
    by a dot (`.`), or secondly by a loose binding, shown by an asterisk (`*`). A
    tight binding means that the elements on either side must be next to each other
    in the hierarchy. A loose binding, on the other hand — signaled by an asterisk,
    which is a wild character — shows that there are several levels between the two
    elements. You have to be very familiar with widget hierarchy to specify tight
    bindings, and it is not uncommon for them to be used incorrectly.


    Take, for instance, this resource specification.


    ```

    xterm.scrollBar: True

    ```

    '
