  trans: "\n本规范忽略了 `xterm` 的组件层级结构，其中 `VT102` 窗口、`Tektronix` 窗口和 `menu` 都是组件。以下是正确的语法：\n\
    \n```\nxterm.vt100.scrollBar: True\n```\n\n更简单的替代方案是使用星号而不是解析组件层级结构。\n\n```\n\
    xterm*scrollBar: True\n```\n\n如果程序支持多个组件层级，你可以混合使用星号和句号。然而，仍然建议使用星号，因为它允许开发者在发布程序新版本时，自由地在层级结构中添加或移除级别。\n\
    \n### 类与实例\n\n每个资源规范组件都与一个 `class`（类）相关，且不同的组件属性也可能属于同一个类。例如，在 `xterm` 中，文本（`Foreground`）、文本光标和指针颜色都定义为\
    \ `Foreground` 类的实例（instances）。因此，你可以通过单个命令设置这三个独立项的值，如下所示：\n\n```\nxterm*foreground:\
    \ limegreen\nxterm*cursorColor: limegreen\nxterm*pointerColor: limegreen\n```\n\
    \n或者\n\n```\nxterm*Foreground: limegreen\n```\n\n首字母大写用于区分类名和实例名。`Class` 始终以大写字母开头，而\
    \ `instances` 以小写字母开头。然而，如果实例名是复合词（如 `pointer-Color`），则后者大写。\n\n类和实例命名产生在 `xterm`\
    \ 等应用中并并不明显，因为它们的组件层级结构非常简单。在用 `X Toolkit` 开发的更复杂应用中，这种命名允许你进行更多自定义。请记住，实例名规范始终会覆盖该实例的类名规范。因此，`Class`\
    \ 名称允许为特定元素的所有实例设置默认值。它也可以配合松散绑定（loose binding）为所有客户端指定一种资源。实例名则指定了类名规范的例外。\n\n\
    ### 资源规范的优先级规则\n\n资源规范即使在 `.Xresources` 等单个资源文件中也可能发生冲突。例如，你还记得之前的例子吗？\n\n```\n\
    xclient*Buttons.foreground: yellow\nxclient*help.foreground: green\n```\n\n第一条规范将\
    \ `Buttons` 类中所有按钮的前景颜色设置为黄色。第二个规范在单个实例中覆盖了第一条规范，将 `Help` 按钮的前景颜色设置为绿色。在这种冲突的情况下，有若干规则帮助资源管理器决定哪个规范生效。这些规则包括：\n\
    \n*   `Instance names`（实例名）高于 `class names`（类名）\n*   `Tight binding`（紧绑定）高于 `loose\
    \ bindings`（松散绑定）\n\n这两条规则可以看出，资源定义越具体，排名越高，优先级也越高。然而，如果你想在系统中进行非常仔细的设置，你应该了解程序如何解释资源规范。对于每个资源变量，程序都有一个完整的、完全指定的、紧绑定的实例和类名。在分析模糊的规范时，程序将其与完整的实例和类名进行比较。如果匹配，则被接受。然而，如果名称中的多个部分都匹配，除了上述规则外，还会适用以下规则：\n\
    \n*   用户指定的层级结构必须匹配程序的预期，否则将被忽略。例如，如果程序预期：\n    ```\n    xterm.vt100.scrollBar:\
    \ value instance name\n    XTerm.VT100.ScrollBar: value class name\n    ```\n\
    \    规范 `xterm.scrollBar: True` 将无法作用，因为紧绑定是不正确的。`xterm` 和 `scrollBar` 层级结构中的元素并不是相邻的。如果是松散绑定，则可以正常。\n\
    *   显式提到的类或实例名优先级高于省略的名称。例如，`xterm*scrollBar` 比 `*scrollBar` 更具体。\n*   左侧的元素权重高于右侧元素，如上面的示例所示。\n\
    \n### 本章总结\n\n在本章中，我们查看了什么是桌面环境、不同类型的 `DE`（桌面环境）以及它们的实现。我们还深入地查看了 `X windows system`\
    \ 及其组成和配置。需要注意的是，桌面环境受到青睐是因为与使用命令行相比，它们让配置系统变得容易得多。\n\n我们还学到 `X` 是一个客户端-服务器多用户系统，而不仅仅是一个图形用户界面。它没有集成在操作系统中，而是像其他服务器一样运行在操作系统之上。它还是运行在许多平台上的开放标准。你在屏幕上看到的是许多组件共同工作的结果：`OS`、`X`、`Window\
    \ manager`（窗口管理器）以及如果你安装了的话 `DE`。它们是即插即用的元素，允许你在不干扰其他部分的情况下更换你想要的内容。由于它们都有自己的配置，这使得系统非常健壮且灵活，尽管这使其变得相当复杂。\n\
    \n### 练习\n\n1.  探索你桌面环境中的菜单。发生了什么？\n2.  自定义你的终端窗口。你成功了吗？\n3.  配置你的窗口管理器并尝试不同的工作空间（虚拟屏幕）。\n\
    4.  应用不同的主题。你成功了吗？\n5.  切换到不同的窗口管理器。发生了什么？\n6.  注销并选择一种不同的会话类型，如果你之前使用的是 `Gnome`，现在可以选\
    \ `Cinnamon`。重复之前的步骤。\n\n# 第 3 章：Shell 及其实用程序\n\n到目前，作为一名 Linux 用户，你已经了解 Linux\
    \ 系统的基本组成。它由 `kernel`（内核）、`Shell`、`commands`（命令）和实用程序、`files`（文件）以及 `directories`（目录）组成。`kernel`\
    \ 是操作系统的核心。它与计算机硬件和其他核心功能（如`内存管理`、`文件管理`和`任务调度`）交互。`Shell` 是一个处理你请求的实用程序。当用户在终端输入命令时，`Shell`\
    \ 会解析命令并启动你想要运行的程序以帮助生成结果。\n"
