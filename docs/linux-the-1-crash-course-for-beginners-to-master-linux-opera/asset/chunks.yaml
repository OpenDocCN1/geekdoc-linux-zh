    INTRODUCTION


    You have probably heard Linux mentioned somewhere. However, you might not have
    given it much thought since most people think that it is too difficult and only
    meant for computer gurus or enthusiasts who want to explore their machine more.
    However, this is far from the truth. Linux is a simple system that takes a different
    approach to how an operating system should work.


    Let’s say you own a vehicle; you don’t really have to know everything about combustion
    engines to understand that they make the car move or know the principles of hydraulics
    to understand what’s wrong when stepping on the brake pedal does nothing to slow
    down the car. Just like the combustion engine, an operating system handles the
    inner workings of your computer and ensures that everything runs smoothly. Sometimes
    things go wrong; in many cases you have a helpline number you can call when problems
    arise, and they get dealt with. If your car breaks down, you can call any breakdown
    car service to assist you. The same applies to computers.


    Still, even if you get help and the problem is solved, such as with a broken-down
    car or crashed computer, many people don’t understand the explanation given as
    to why the problem occurred in the first place. If they understood this information,
    it would help them deal with this issue if it recurred.


    Having fundamental knowledge about the principles of an operating system and how
    it works gives you an upper hand and places you in a better position to understand
    and deal with problems as they arise. Also, if you know something or someone,
    you tend to have a better attitude and relationship with them. Just like with
    a car, if you hear weird noises every time you apply the brake, you know that
    you need to check on the brake pads and see if they need to be replaced. For computers,
    this is what Linux does. It gives you an all-access pass into the inner workings
    of your computer and other systems so you have a better understanding of your
    equipment. With the many advances in hardware design and performance, computers
    nowadays can process more data. With Linux, you can harness this computing power
    to the fullest.


    Linux is a fantastic technology and the basis of many systems that we use today.
    It has grown from the hobby of one man to a worldwide sensation. With its vast
    applications, it pays to know more about Linux, and even you can become a pro
    at it.


    This book is intended for anyone looking to learn more about Linux or as a reference
    guide for advanced users. It has examples and exercises to help you get a better
    understanding of the Linux system and to try things out on your own. It is structured
    to comprehensively teach you about Linux even if you are a beginner and provide
    you with the requisite skill set you require to take advantage of the versatility
    of this system. Having that in mind, let’s take a look at what you will be learning
    in this book.


    In chapter one, we will look at installing and setting up your operating system.
    You will learn about the various distributions of the Linux OS and how to select
    the right one for you. You will also learn about preparing your computer, installing
    software, setting up the system, upgrading, and more. At the close of the chapter,
    you will have enough knowledge to know which system to install and set up. In
    the second chapter, we will examine the desktop environments and dive deeper into
    the setup process. The third chapter is about system interaction. We will discuss
    how the Linux system interacts with various files, hardware, and even other system
    components. Chapter four takes a look at system administration and everything
    it entails. The fifth chapter is on security. It explains how you can secure your
    system since Linux is open-source, what the threats are, and how to deal with
    them. We will also delve into network security, and you will learn how to set
    up firewalls and how to protect yourself from hackers. Chapter six covers networking
    in Linux and all it entails. The final section is on cloud computing and how Linux
    has impacted this sector. At the end of every chapter, there will be some exercises
    you can do to help you internalize the theoretical concepts taught.


    CHAPTER 1


    Installation and Setting Up Your System


    Before getting into what Linux is, you must understand what an operating system
    is. It is common to find users who have no clue what an operating system is or
    what operating system they are using. When you turn on your computer, you see
    a screen where you can write, draw, surf the web, play music, watch videos, and
    more. Ever asked yourself what makes the computer hardware, such as the mouse,
    screen, or keyboard, work the way it does? How does your computer processor know
    that you want to play a video file?


    The operating system is responsible for how your computer works and acts as an
    interface between you and your computer. These systems are basically managers
    that are in charge of computer system resources. These resources include RAM,
    ROM, the monitor, the hard disk, or any connected devices. The operating system
    has management functions that determine who gets to access data from the hard
    disk, what appears on the screen next when you select a file, or how much memory
    a program gets.


    There are many operating systems available, such as Windows, Mac OS, iOS, and
    Linux. Some of these systems are proprietary such as Windows, while others like
    Linux are open-source. What this means is that with open-source tools, you can
    examine and analyze the source code and make any modifications you want. This
    high level of customization sets Linux apart from other operating systems because
    you have complete control over what you want your computer to do.


    In the beginning, Linux developers concentrated more on the networking and service
    aspects of the system. This made it a favorite among hobbyists but kept it from
    penetrating the desktop market. Many people still think that Linux is complicated
    because everything is done in text mode. However, the Linux community has worked
    hard to turn this system into one that can be used on a workstation as well as
    on midrange and high-end servers. '
