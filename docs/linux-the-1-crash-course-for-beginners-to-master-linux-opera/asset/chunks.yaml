    You might want to run an application or script that has been installed in another
    user’s home directory or a different location other than the default search path.
    You can run this application or script by typing in its absolute path or preceding
    its command name with a dot slash, which is a period followed by a forward slash
    and no spaces. The dot is used to show the current directory, and the slash is
    a directory separator and to distinguish file and directory names.


    ## Permissions and Access Modes


    In Linux, you have to have the right permission to gain access to a file. This
    is important because it allows you to locate, edit, and execute commands. For
    instance, if you want to read a file, you must have read permission to write or
    edit a file, write permission to execute or run a file, or execute permission.
    These authorizations or access modes are set using the `chmod` command or during
    file creation. You can view a file’s permissions via the `l` or `ls -l` commands.


    In Linux, file permissions are essential because they provide a secure method
    for file storage. Every Unix file has the following attributes: owner, group,
    and other or world permissions. Owner permissions define what the owner of the
    file can do. The group permissions show what actions can be taken by a user who
    is a member of the group that owns the file. Lastly, the other permissions show
    what actions other users can perform on a file.


    As stated before, a file’s permissions can be viewed through the `ls -l` command.
    To better comprehend what these permissions entail, let’s take a look at the following
    example:


    ```

    ls -l /home/fiona

    -rwx-r-- 1 fiona Jan 24 00:20 myfile

    drwxr-xr-- 1 fiona Jan 24 00:20 mydir

    ```


    There are ten characters at the beginning of each line, and they can be dashes
    or letters. Let’s break down each position. The first place shows the file type.
    It can be `d` for directory, `r` for regular file, `c` for character device, etc.
    The other nine places are divided into groups of three, and each group has three
    places to indicate the permissions granted to that group. The order for these
    permissions is `r` for read, `w` for write, and `x` for execute. The first group
    of three positions shows the owner’s permissions, the second one shows the group
    permissions, and the last one shows the permissions for everyone else. If certain
    permissions are not granted, there will be a dash `-` in its place. As per our
    above example:


    - `d` indicates the file type, which in this case is a directory

    - `rwx` shows that the owner has all three permissions to read, write, and execute

    - `r-x` shows that the group can only read and execute

    - `r--` indicates that all other users can only read this file


    For directories, if you don’t have read permissions, you cannot view the directory''s
    contents. If you lack write permissions, you cannot write to this directory. This
    means that you can’t create a new file in it. Execute permissions mean you can
    search the directory and list its contents; for example, if you don’t set the
    execution permissions, you can view directory. Still, you cannot execute them
    or change into that directory. Also, if you have execute permissions but no read
    permissions, a user can execute files and change directories but not view the
    files. Write permissions affect directories differently because a user must have
    these authorizations to create a new file or remove an existing one. Even without
    the write permissions for the specific file, if you have directory permissions,
    you can erase the files.


    ## Modifying Owners and Groups


    As you make an account in Linux, the system assigns both an owner and group ID.
    These IDs influence the kind of permissions you are granted as a user. Two commands
    can alter the owner and group of a file. These are `chown` and `chgrp`. The first
    command, `chown`, means change owner and it is utilized to change a file''s ownership.
    The `chgrp` stands for change group and it changes the group of a file.


    This is the basic syntax of using `chown`: `chown user file`. The value of the
    user can be the username or user id. Thus the above command will look like this:


    ```

    chown Fiona test

    ```

    This changes the file ownership to the user Fiona. It is important to note that
    superusers or root users have the unrestricted ability to change file ownership,
    while normal users can only do so for files they own.


    The syntax for `chgrp` is `chgrp group file`. Just like the previous command,
    the value can either be the group name or group id. The `chgrp` command for the
    above example would then be:


    ```

    chgrp minor test

    ```

    This changes the group of that file to minor group.


    ## Set User ID and Set Group ID


    As a command executes, it can do so with special privileges to fulfill its task.
    For instance, when you use the `passwd` command to alter your password, the new
    password is stored in the `/etc/shadow` file. As a regular user, you lack read
    and write permissions to these files because of security reasons. However, to
    change your password, you need these permissions. This means that the `passwd`
    command has to grant you this authorization to write in the `/etc/shadow` file.
    This additional permission is given to such programs through mechanisms known
    as Set User ID (SUID) and Set Group ID (SGID).


    When a program is SUID or SGID enabled, you get the permissions of the owner and
    group respectively. If they are not set, the programs use the permissions granted
    to the user who started them. These programs are indicated by the letter `s` if
    the permission is available. The `s` will appear in the slot where the owners’
    execute command is. Let us look at the following example:


    ```

    ls -l /usr/bin/passwd

    -rwsrxr-x 1 root bin 69531 May 7 15:49 /usr/bin/passwd

    ```

    As you can see, the SUID bit is set, and the command is a root command. An upper
    case `S` in place of the lowercase one would show that it is not set.


    ## Pipes and Redirection


    The `|` character — or as it is more commonly referred to, the pipe symbol — is
    quite prevalent in commands. Pipe lets you pass the output of one command through
    the input of another. For instance, let’s say you want to make a long listing,
    such as the `/bin` directory. By inputting `ls -l` and hitting enter, the list
    appears, but the names pass by too fast to read. The entries you get to see are
    the last ones. If you instead input `ls -l | more`, the results of the list command
    will be piped through `more`. This enables you to go through the results one batch
    at a time. Here the standard output of the `ls` command points to the pipe and
    becomes the standard input of the `more` command since it is also altered to point
    to the pipe.


    The pipe symbol simply tells the Shell to use the files indicated instead of the
    standard input and output files. Every Linux system has the concepts of standard
    input, output, and error. Standard input is taken when a user logs in and uses
    the command line. Both standard output and error are sent to your screen. That
    is, your system expects to receive input from a keyboard or mouse and display
    the results or error messages on the screen. As your system initiates, it opens
    these three files first. If a user, for instance, runs a command such as `find`,
    it gets its input from a file and shows the result on the screen. Even though
    it looks like the standard input is coming from the file, it’s not. It is instead
    still coming from the keyboard.


    ## Filters

