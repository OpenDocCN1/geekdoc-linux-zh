    Chapter Summary


    In this chapter, we looked at what a desktop environment is, the different types
    of DE, and their implementation. We also took a more in-depth look at the X windows
    system, its makeup, and configuration. It is important to note that desktop environments
    are preferred because they make configuring your system a lot easier compared
    to using the command line.


    We also learned that X is a client-server, multi-user system, not just a graphical
    user interface. It is not integrated into the OS but instead operates on top of
    it like other servers. It is also an open standard that runs on many platforms.
