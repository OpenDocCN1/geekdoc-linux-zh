  trans: '


    云计算在不同程序之间实现资源虚拟化和共享的能力使得服务器利用率更高。例如，假设有三个用于不同应用的平台，每个平台都运行在自己的服务器上。如果将它们迁移到云端，服务器资源将实现共享，并为操作系统和程序进行虚拟化，以便它们更好地利用服务器。这将减少服务器的数量，从而减少空间需求，进而减小数据中心规模，并降低冷却服务器所需的电力。这反过来减少了碳排放和温室气体排放，从而降低了碳足迹。该系统并非没有缺陷，但我们稍后会讨论这些问题。


    # 云计算模型


    云计算可以从两个角度来看：要么作为云提供的服务，要么基于所使用的部署模型。根据部署方法的不同，云可以分为公有云、私有云、混合云和社区云。根据提供的服务，分类如下：软件即服务
    (`SaaS`)、平台即服务 (`PaaS`) 和基础设施即服务 (`IaaS`)。


    ## 公有云

    这意味着计算基础设施由政府、学术机构或商业组织定位、拥有、治理和运行，客户对计算基础设施没有物理控制权。这种云环境由终端用户不拥有的资源创建，并且可以重新分配给其他用户。这种云用于业务对消费者（B2C）类型的交互，并且性能优异。由于其公共性，它们容易受到攻击。


    公有云服务提供商示例包括 `Amazon Web Services`、`Google`、`Microsoft` 等。这些公司还提供 `direct connect`
    服务，要求客户购买或租赁到它们提供的对等点的专用连接。


    ## 私有云

    这种云基础设施专门为单个个人或组织运行。它可以由内部管理，也可以由第三方通过内部或外部托管进行管理。它们具有与公有云相同的优点，但使用的是私有的 `hardware`。`hardware`
    不向公众共享，但 `servers` 位于远程。提供本地 `servers` 的选项，尽管它们让用户控制物理 `infrastructure`，但价格通常更高。这种云的安全性最高，尽管如果公司使用本地云基础设施，成本削减的效果非常有限。私有云供用户专用，这种方法用于许多企业内部交互。


    ## 混合云

    如名称所示，这种云根据用途合并了私有和公有云基础设施。例如，公有云可以与消费者交互，同时在私有云服务器上安全地存储其数据。公有云在处理需求波动方面具有可扩展性和灵活性。然而，特定的数据密集型或高可用性负载可能会导致性能问题。混合云可用于业务对业务
    (`B2B`) 和业务对客户 (`B2C`) 交互。


    ## 社区云

    这指的是为具有共享数据和数据管理的社区或组织提供的计算资源。例如，社区云可以属于某个政府或单家公司。计算基础设施可以位于场内，也可以位于场外。


    # 软件即服务

    如名称所示，`SaaS` 是通过互联网作为服务访问软件的能力。应用程序服务提供商 (`ASP`) 是 `SaaS` 的前身。`ASP` 提供托管在网络或通过网络交付的软件订阅。软件和收取的费用根据其使用情况而定。通过这种方式，用户并不购买软件，而是根据需要租赁。你也可以将
    `SaaS` 视为在网络使用并在远程执行的软件。软件可以以本地程序使用的服务形式存在，如 Web 服务器或通过浏览器访问的远程应用程序。这些云服务对于终端用户来说是理想的。


    远程应用程序服务的示例包括 `Google Apps`，它通过标准网络浏览器提供各种企业级应用，如文字处理器。应用程序的远程执行依赖于 `application
    server` 来提供所需的服务。使用应用程序编程接口 (`API`) 进行软件服务（如数据库访问或事务管理）的软件框架被称为 `application server`。示例包括
    `IBM` 的 `WebSphere` 应用程序、`Apache Geronimo` 等。


    ## 平台即服务

    这种服务 `PaaS` 可以被描述为整个平台的虚拟化，其中一个或多个 `servers` 在物理 `servers`、操作系统和特定程序（如 `Apache`、`MySQL`）之上被虚拟化，以供
    Web 使用。在某些情况下，这些平台是可以预定义并选择的。但在另一些情况下，用户可以提供包含所有所需用户特定程序的 `virtual machine image`
    `。换句话说，它允许用户在云基础设施上运行应用程序。基础设施完全由服务提供商控制，用户不需要担心其管理或其运行的基础设施。用户可能不知道底层平台是在 `Linux`、`Windows`、混合系统还是完全不同的系统上运行。他们只需要知道接口以及如何在虚拟化平台上运行作业。这些云服务对于软件和应用程序开发者来说是理想的。


    一个很好的例子是 `Google` 的 App Engine。该服务允许用户在 `Google` 非常稳定的架构上部署 Web 应用程序。它为用户的 `Python`
    应用程序提供了一个可以在网络上引用的沙箱。除了支持用户身份验证、图像处理和电子邮件发送外，它还提供了使用 `Google Query Language` 进行数据存储和维护的
    `Python APIs`。`sandbox` 限制了对底层操作系统的访问。即使用户应用程序可用的功能有限，`App Engine` 也支持构建实用的 Web
    服务。


    ## 基础设施即服务

    `IaaS` 是一种云计算，通过网络向组织或用户提供按需、可扩展的服务，这些负载可以根据需要扩展或缩小。它是作为服务提供的计算机分发。这允许用户在计算服务上运行操作系统或其他基础设施。用户不需要管理或控制运行基础设施的底层硬件或平台。他们只需要定义所需的服务级别并在其运行基础设施。这些云服务对于系统管理员来说是理想的。


    `IaaS` 与 `PaaS` 的区别在于，虚拟硬件不带软件栈。用户随后提供一个在一个或多个虚拟化服务器上调用的 `virtual machine image`。这使得它成为物理访问基础设施之外，计算作为服务最原始的形式。一个典型的例子是
    `Amazon` 的弹性计算云 (`EC2`)。在 `IaaS` 中，用户可以指定特定的 `VM` 并部署其应用程序，或提供其 `VM image` 在其他服务器上执行。用户只需根据使用的计算时间、存储和网络带宽付费。


    另一个例子是用于链接程序到有用系统的弹性实用计算架构，简称 `Eucalyptus project`。它是 `Amazon` `EC2` 的开源实现，与商业服务接口兼容。就像
    `EC2` 一样，它依赖于 `Linux` 并使用 `Xen` 虚拟化操作系统，它是为了云计算研究而开发的。


