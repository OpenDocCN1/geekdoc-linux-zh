  raw: 'The need to exchange data between machines gave rise to networking, and to
    be able to transfer data, computers must be able to talk to each other. However,
    with so many different pieces of hardware and software each speaking a different
    language, getting them to communicate seems complicated. How they interact is
    carried out in a predetermined manner referred to as a protocol. Basically, a
    protocol is a set of communication rules. These protocols define how each device
    behaves and how to react. The most common protocol in Unix-based systems is TCP/IP,
    which stands for Transmission Control Protocol/Internet Protocol.


    TCP/IP


    TCP/IP is a protocol suite containing various protocols that were developed to
    allow communication between different brand devices. The TCP/IP protocol suite
    is based on a layered model, and it is focused on delivering interconnectivity
    rather than adhering to functional layers. This is the reason why TCP/IP has become
    the default standard opposed to Open Systems Interconnection reference model (OSI).


    Take, for instance, your email program. It can communicate with the OS through
    certain protocols but not the hardware. It would require a special program to
    do this and still require more software to facilitate communication between the
    computer and the internet hookup method used. Don’t forget that the network connection
    hardware also needs to talk to pass along your email to the destined computer.
    So if all these types of communications are classified into layers, only adjacent
    layers can communicate with each other.


    This is how the OSI model works. Even though TCP/IP is structured similarly to
    this, as stated before, it allows for inter-layer communication. As per the example,
    the network connection hardware can communicate with the email-sending application.
    TCP/IP protocol suite is considered the industry standard because of its versatility.


    Here are some examples of the protocols in the TCP/IP family:


    *   Transmission Control Protocol (TCP) – a connection-oriented secure protocol.
    The program first sends the information to be transmitted as a data stream then
    converted by the OS to the correct format. The data arrives at its destination
    in the original data stream format in which it was originally sent. TCP ascertains
    that there was no data loss or any kind of mix-up. This protocol is implemented
    wherever the data sequence matters.


    *   User Datagram Protocol (UDP) – a connectionless, insecure protocol. The data
    to be transmitted is sent in packet form already produced by the application.
    The order in which the information arrives at the recipient is not assured, and
    there is a possibility of data loss. The UDP protocol is suitable for record-oriented
    applications and features a smaller latency period than TCP. For instance, Services,
    such as the Network File Service, or NFS, that use UDP must provide their own
    mechanisms to ensure packet delivery and their correct sequencing. Since it can
    broadcast or multicast, UDP also offers one-to-many services.


    *   Internet Control Message Protocol (ICMP)– this is not a protocol for the end-user,
    but a special control protocol that releases error reports and has control over
    how the machines participating in TCP/IP data transfer behave. Additionally, ICMP
    provides a special echo mode that can be viewed using the program ping.


    *   Internet Group Management Protocol (IGMP) – manages the computer’s behavior
    when implementing IP multicast.


    Most hardware protocols are packet-oriented. The data transferred to and from
    the hard drive is referred to in terms of data blocks known as packets. Depending
    on the application you are using the packet size can vary; however, they are small
    enough to transfer across networks quickly without any delays due to size. Also,
    since they are transferred so fast, you might not notice that your data is broken
    up.


