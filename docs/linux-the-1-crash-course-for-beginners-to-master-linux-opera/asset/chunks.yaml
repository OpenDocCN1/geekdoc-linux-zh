- fmt: '

    This command searches a file or files for lines that exhibit a specified pattern.
    Here is the syntax: `$grep pattern file(s)`. The term `grep` is derived from `g/re/p`,
    which stands for “globally search for a regular expression and print all lines
    containing it.” A regular expression consists of plain text and/or specialized
    characters used to match the patterns. The most basic use of `grep` is in searching
    for patterns containing single words. It can be added in a pipe so that only the
    input files with a certain string are output. If it doesn’t have a file name to
    read, `grep` reads its standard input. This is also how all filter programs work.


    You can also use several options with `grep`:


    - `-v` – shows all lines that don’t match the pattern

    - `-n` – shows the matched line and its number

    - `-l` – (letter “l”) only shows file names with matching lines

    - `-c` – shows the matching lines count

    - `-i` – matches either upper or lowercase


    ### The sort Command


    This command organizes text lines alphabetically or numerically. For instance:


    - `$sort cars`

    - Alpha Romeo

    - Chevy

    - Ford

    - Isuzu

    - Mercedes

    - `$`


    However, there are several options for controlling this sorting. They include:


    - `-n` – sorts the lines numerically and ignores blanks and tabs

    - `-r` – reverses the sort order

    - `-f` – sorts both upper and lowercase lines together

    - `+x` – ignores the first x fields when sorting


    You can link several commands into a pipe such as `ls -l | grep pattern file |
    sort +4n`.


    ### Chapter Summary


    In this chapter, we looked at several things:


    - The Linux Shell and what we already knew, such as its various components, and
    we got deeper into these elements.

    - Environmental variables contain everything a shell needs to operate. An example
    of an environmental variable is `PATH`.

    - We also looked at search path, absolute, and relative path too.

    - The three access modes in a Linux system: read, write, and execute. These modes
    are also permissions as to what a user is allowed to do to a file or directory.

    - There are also various commands attributed to all the actions discussed in this
    chapter and some examples of them in use.


    ### Exercises


    #### Exercise 1


    a) Run `echo $SHELL` to find out what Shell you are using.

    b) What `init` files does your shell use, and when are they used?

    c) Try out these commands and take note of the differences:

    - `ls`

    - `ls –l`

    - `ls *`

    - `ls –ld`

    d) List the contents of directories containing a 4 in their name.


    #### Exercise 2


    a) Use the `echo` command to display what is in your current `PATH` (remember
    it needs to be named `$PATH` when using it). Which of the directories are being
    searched as the command executes?

    b) Enter the following commands and observe what happens:

    - `cd blah`

    - `cd ..` remember to mind the space between “cd” and “..”!

    - `pwd`

    c) Detail the directory contents with the `ls` command. What do you see, and what
    do you think these could be? Use the `pwd` command to check.

    d) Type in the `cd` command and repeat the step twice as you observe what’s happening.

    e) Try `cd root` and observe what happens. Check to see which directories you
    have access to?

    f) Repeat the `cd` command input step, is there another way you can get to your
    directory?

    g) Read `man intro`, `man ls`, and `info passwd`.

    h) Enter the pertinent `pwd` command.

    i) Try `man` or `info` on `cd`. Which one showed more information about `cd`?


    # CHAPTER 4


    ## System Administration


    System administration encompasses a lot of areas, and thus it becomes quite hard
    to clearly define what it is precisely because all aspects of a computer fall
    under system administration. This includes software, hardware, networking, and
    even programming, to mention a few.


    System administration allows a user to get a better understanding of the system
    and thus utilize it better, from starting the system, creating and managing accounts,
    installing software, configuring hardware, device management, automating the system,
    backing it up, etc. You can see that a system administrator wears a lot of hats.
    You are your system’s administrator, and these responsibilities fall on you.


    In this chapter, we’ll examine some of those system administration tasks. We will
    not dive deep into the nitty-gritty, but we will cover the basics — i.e., the
    functional areas of system administration — so that you can use the programs and
    utilities at your disposal.


    ### System Start-Up and Shut Down


    Starting up a Linux system is quite simple, and it involves pressing the power
    button and watching your system boot. Almost all users and many system administrators
    have no idea of what is happening as the system boots. From switching the power
    on to getting to the login prompt, a lot of things must take place. Knowing what
    is happening in the boot process can be quite useful because you can easily tell
    what went wrong if a system does not start how it should. Starting up your system
    can be as easy as turning it on and letting it boot. However, you can alter this
    behavior by changing the boot process. We will not get too deep into the boot
    process, but here are some important things to keep in mind when shutting your
    system down.


    Linux is unlike the other operating systems, and even with the many efforts to
    make it look superficially like these other operating systems, they still differ,
    especially when shutting the system down. In other systems, you are always aware
    of what’s going on, and you have complete control over everything. You can decide
    to turn the computer off once you feel you are done. However, since Linux is a
    multi-user system, there are other users working or using its resources, so simply
    switching off the machine is not advised. Other than annoying other users, you
    could damage your system depending on what was running when you switched off.


    ### User Account Management


    When many people use a device such as a workstation, it’s vital to differentiate
    between the users. This, for instance, helps keep their personal files private,
    whether it is used by many users simultaneously or only by one user at a time,
    such as in microcomputers. Every user is assigned a unique identifier known as
    a username that they use to log in.

