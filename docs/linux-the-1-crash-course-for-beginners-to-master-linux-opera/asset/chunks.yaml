  raw: 'Other forms of cloud computing services include security-as-a-service, data-as-a-service,
    test environment-as-a-service, data-storage-as-a-service, desktop-as-a-service,
    and API-as-a-service.


    Anatomy of Cloud Computing


    The cloud is a collection of services grouped in different layers, which include
    application, platform, infrastructure, virtualization, server, and storage. It
    is comprised of two major components, the front and the back end. The front end
    consists of the client or user part of the cloud computing system. It includes
    interfaces, applications, and everything needed to access the cloud computing
    platform. The back end, on the other hand, contains the cloud itself. It is comprised
    of the resources needed for cloud computing services such as virtual machines,
    servers, storage, and security mechanisms like traffic control and protocols.
    This end is under the control of the cloud computing services provider.  It spreads
    the file system over multiple hard disks and machines. This means that the data
    is never stored in a singular place, and in the case a unit fails, another takes
    over automatically. In the distributed file system, the algorithm for resource
    distribution and user disk space are assigned. Since cloud computing is a distributed
    environment, it depends heavily upon a robust algorithm.


    Virtualization and Cloud Computing


    Cloud’s computing ace in the hole is virtualization; it is its main enabling technology.
    Virtualization can be defined as the partitioning of a single physical server
    into many logical servers. Once the partitioning is complete, each logical server
    behaves like a physical server and can perform the same duties as a real physical
    server. Some of these duties include running an operating system and other programs
    independently. A lot of companies provide virtualization services, where they
    let you use their servers instead of partitioning your PC for storage and computing.
    This is ideal because they are fast, consume less time, and are cost-effective.


    For software developers and testers, virtualization allows them to write and run
    code in multiple environments. It also comes quite in handy when testing code
    too.


    In cloud computing, virtualization is mainly used for three reasons; network,
    storage, and server virtualization.


    *   Network Virtualization is a way of putting together the available resources
    in a network by splitting up the available bandwidth into channels, each of which
    is independent of the others and can be assigned to a specific server or device
    in real-time.


    *   Storage Virtualization is the collection of physical storage from many network
    storage devices into what looks like a single storage device that is run from
    a central console. Storage virtualization is usually used in storage area networks
    (SAN).


    *   Server Virtualization masks server resources such as processors, RAM, operating
    system, etc., from server users. It intends to increase the resource sharing capacity
    and reduce the burden and complexity of computation from users.


    Virtualization is the key to unlocking the cloud system, and it is vital because
    it separates the hardware from the software. For example, computers can use virtual
    memory to borrow extra memory from the hard disk. Normally the hard drive has
    a lot more space than memory. Virtual disks are slower than real memory, but if
    managed properly, the substitution works perfectly.


    Cloud Security


    Even though cloud computing offers great opportunities, it is not devoid of challenges.
    There are plenty of areas at risk of being compromised and which require fortification.
    Below are some risk considerations that represent a potential area of attack or
    a source of failure. Let’s examine some of the security threats and vulnerabilities
    the cloud comes under.


    1.  Organizational Security Risks


    Organizational risks are defined as the risks that can impact the structure of
    the organization. If a cloud service provider goes out of business or gets acquired
    by another company, it can have adverse effects on their cloud services.


    2.  Physical Security Risks


    The cloud data center’s physical location must be secured by the service provider
    to prevent unauthorized on-site access to cloud service customer data. Firewalls
    and encryption cannot protect against the physical theft of data. It is upon the
    service provider to secure the data centers. They should take the appropriate
    measures such as controlling authorized personnel, the security of the physical
    location, and network firewalls. The service provider is not only responsible
    for storing and processing data but also sticking to privacy regulations.


    3.  Technological Security Risks


    These are the failures caused by the hardware, technologies, and services provided
    by the cloud service providers. These include resource sharing isolation issues
    and risks linked to changing service providers - i.e., portability. Regular maintenance
    and audit of infrastructure by the service providers is recommended.


    4.  Compliance and Audit Risks


    These are related to the law, and they include lack of information jurisdiction,
    jurisdiction changes, illegal contract clauses, and ongoing legal cases. For instance,
    in some areas, cloud service providers are required by law to hand over sensitive
    information if the court or government demands it.


    5.  Data Security Risks


    There are many data security risks involved in cloud computing, but data integrity,
    confidentiality, and availability are the main ones. This is the area most at
    risk of getting compromised, and a majority of the security efforts are focused
    here.


    At the core of all computing is the processing of raw data into meaningful information.
    When the processing of this data is outsourced to computing infrastructure owned
    and maintained by third parties, it can lead to several issues concerning the
    security of the data. With data security, these four properties have to be kept
    in check.


    *   Privacy – ensures that the personal information and identity of the cloud
    user is not revealed to unauthorized persons, especially when dealing with sensitive
    data. This is the most prominent problem when it comes to cloud security.


    *   Confidentiality – closely related to privacy. It is the service provider’s
    guarantee that the cloud user’s data will remain anonymous and safe. This can
    be especially hard in systems where many users have access to the same system.


    *   Integrity – refers to the confidence that the cloud user has that their data
    will not be corrupted or altered in any way by unauthorized persons as it is being
    retrieved.


    *   Availability – ensures that the cloud customer has access to their data and
    is not denied service due to a malicious attack on the cloud. An example of this
    would be a denial of service (DoS) attack.


    There are three stages at which the data in the cloud can be in at any given time.
    The first is data-in-transit, where it is in the process of being transferred.
    This could mean the user is uploading data to the cloud or downloading it to their
    computing device. This is where data is most at risk of interception. Encryption
    is usually used to prevent any data loss or corruption attempts. The next stage
    is data-at-rest. This refers to when the data is in cloud storage. The biggest
    risk here would be for the user to lose control over their data. This can mean
    anything from data corruption to the theft of files. It is up to the service provider
    to ensure that they keep the user’s data safe and that all four properties are
    kept intact. The last stage is data-in-use. This refers to when the raw data is
    being processed into useful information. Some of the risks here would be with
    data corruption during processing. Some of the ways service providers can secure
    their cloud computing systems are as follows.


    *   Service providers can employ the use of data encryption and authentication
    methods such as two-step authentication before granting users access to the data.'
