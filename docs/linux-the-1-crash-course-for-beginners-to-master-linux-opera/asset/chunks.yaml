- fmt: "\nThis specification ignores the widget hierarchy of `xterm`, where the `VT102`\
    \ window, `Tektronix` window, and `menu` are all widgets. Here is the correct\
    \ syntax:\n\n```\nxterm.vt100.scrollBar: True\n```\n\nA simpler alternative is\
    \ to use the asterisk instead of deciphering the widget hierarchy.\n\n```\nxterm*scrollBar:\
    \ True\n```\n\nIf the program supports multiple widget levels, you can use a mix\
    \ of asterisks and periods. However, using an asterisk is still recommended because\
    \ it allows developers the freedom to add or remove levels in the hierarchy as\
    \ they produce new releases of a program.\n\n### Classes and Instances\n\nEvery\
    \ resource specification component is associated with a `class`, and different\
    \ widget attributes can belong to the same class too. Let’s say, for instance,\
    \ in `xterm`, the text (`Foreground`), text cursor, and pointer color are all\
    \ defined as instances of the `Foreground` class. You can, therefore, set the\
    \ value of all three individuals or via a single command, as shown below:\n\n\
    ```\nxterm*foreground: limegreen\nxterm*cursorColor: limegreen\nxterm*pointerColor:\
    \ limegreen\n```\n\nor\n\n```\nxterm*Foreground: limegreen\n```\n\nCapitalizing\
    \ the first initial differentiates class and instance names. `Class` will always\
    \ begin with an uppercase letter and `instances` in a lowercase one. However,\
    \ if the instance name is a compound word such as `pointer-Color`, the latter\
    \ is capitalized.\n\nThe effect of class and instance naming cannot be felt in\
    \ applications such as `xterm` because they have a simple widget hierarchy. In\
    \ other complex applications made with the `X Toolkit`, this naming allows you\
    \ to do more customization. Just remember that the instance name specification\
    \ always overrides the class name for that instance. `Class` names, therefore,\
    \ allow for default values to be set for all instances of a particular element.\
    \ It can also be used with loose binding to specify a resource for all clients.\
    \ Instance names specify the exception to the class names specifications.\n\n\
    ### Precedence Rules for Resource Specification\n\nResource specifications can\
    \ conflict even on a singular resource file such as `.Xresources`. For instance,\
    \ do you recall this example from earlier?\n\n```\nxclient*Buttons.foreground:\
    \ yellow\nxclient*help.foreground: green\n```\n\nThe first specification makes\
    \ the foreground color for all buttons in the `Buttons` class yellow. The second\
    \ one overrides the first specification in a single instance where it makes the\
    \ foreground color of the `Help` button green. In such a case where specifications\
    \ clash, several rules assist the resource manager in deciding which specification\
    \ takes effect. These include:\n\n*   `Instance names` take precedence over `class\
    \ names`\n*   `Tight binding` takes precedence over `loose bindings`\n\nFrom the\
    \ two rules, it is clear that the more specific a resource definition is, the\
    \ higher it ranks and thus takes precedence. However, if you want to set things\
    \ up very carefully in your system, you should know how programs interpret resource\
    \ specifications. For every resource variable, a program has both a complete,\
    \ fully-specified, tightly bound instance and class name. In analyzing ambiguous\
    \ specifications, the program compares them against the full instance and class\
    \ name. If there is a match, it is accepted. However, if more than one part in\
    \ either name matches, the following rules in addition to those mentioned earlier\
    \ apply.\n\n*   The hierarchy levels specified by the user must match the program’s\
    \ expectations or be ignored. If, for instance the program expects:\n    ```\n\
    \    xterm.vt100.scrollBar: value instance name\n    XTerm.VT100.ScrollBar: value\
    \ class name\n    ```\n    The specification `xterm.scrollBar: True` won’t work\
    \ because the tight binding is incorrect. The elements in the `xterm` and `scrollBar`\
    \ hierarchies are not adjacent. It would work if it was a loose binding.\n*  \
    \ A class or instance name that is explicitly mentioned takes priority over one\
    \ that is omitted. For instance, `xterm*scrollBar` is more specific than `*scrollBar`\n\
    *   Elements on the left carry more weight over those on the right, just as in\
    \ the above example.\n\n### Chapter Summary\n\nIn this chapter, we looked at what\
    \ a desktop environment is, the different types of `DE`, and their implementation.\
    \ We also took a more in-depth look at the `X windows system`, its makeup, and\
    \ configuration. It is important to note that desktop environments are preferred\
    \ because they make configuring your system a lot easier compared to using the\
    \ command line.\n\nWe also learned that `X` is a client-server, multi-user system,\
    \ not just a graphical user interface. It is not integrated into the OS but instead\
    \ operates on top of it like other servers. It is also an open standard that runs\
    \ on many platforms. What you see on the screen is a combination of many components\
    \ working together: `OS`, `X`, `Window manager`, and a `DE` if you have installed\
    \ one. They are plug and play elements that let you interchange what you want\
    \ without interfering with the rest. Since they all have their configurations,\
    \ this makes the system very robust and flexible, although it makes it quite complex.\n\
    \n### Exercises\n\n1.  Explore the menus in your desktop environment. What happened?\n\
    2.  Customize your terminal window. Were you successful?\n3.  Configure your window\
    \ manager and try out different workspaces (virtual screens).\n4.  Apply a different\
    \ theme. Were you successful?\n5.  Switch to a different window manager. What\
    \ happened?\n6.  Log out and pick a different session type, like `Cinnamon`, if\
    \ you were using `Gnome` earlier. Repeat the previous steps.\n\n# CHAPTER 3: The\
    \ Shell and Its Utilities\n\nBy now, as a Linux user, you are already aware of\
    \ the basic makeup of a Linux system. It is comprised of a `kernel`, `Shell`,\
    \ `commands` and utility programs, `files`, and `directories`. The `kernel` is\
    \ the core of the operating system. It interfaces with the computer hardware and\
    \ other core functions such as `memory management`, `file management`, and `task\
    \ scheduling`. `Shell` is a utility program that handles your requests. When a\
    \ user enters a command into the terminal, `Shell` deciphers the commands and\
    \ initiates the program you want to helps generate the result.\n"
