    你可能想要运行安装在另一个用户主目录或默认搜索路径之外位置的应用程序或脚本。你可以通过输入其绝对路径，或者在命令名称前加上点斜杠（./，即一个点后面跟着正斜杠且没有空格）来运行该应用程序或脚本。`.`
    用于表示当前目录，而`/` 是目录分隔符，用于区分文件名和目录名。


    ## 权限与访问模式


    在 Linux 中，你必须拥有正确的权限才能访问文件。这非常重要，因为它允许你定位、编辑和执行命令。例如，如果你想读取一个文件，你必须拥有读取权限；写入或编辑文件需要写入权限；执行或运行文件则需要执行权限。这些授权或访问模式是使用
    `chmod` 命令或在创建文件期间设置的。你可以通过 `l` 或 `ls -l` 命令查看文件的权限。


    在 Linux 中，文件权限至关重要，因为它们为文件存储提供了一种安全的方法。每个 Unix 文件都具有以下属性：所有者（owner）、组（group）以及其他（other/world）权限。所有者权限定义了文件所有者可以做什么。组权限显示了文件所属组组成员可以执行的操作。最后，其他权限显示了其他用户对文件可以执行的操作。


    如前所述，可以通过 `ls -l` 命令查看文件的权限。为了更好地理解这些权限的含义，让我们来看下面的示例：


    ```

    ls -l /home/fiona

    -rwx-r-- 1 fiona Jan 24 00:20 myfile

    drwxr-xr-- 1 fiona Jan 24 00:20 mydir

    ```


    每行开头有十个字符，它们可以是横杠或字母。让我们拆解每个位置。第一个位置显示文件类型。可以是 `d` 表示目录、`r` 表示普通文件、`c` 表示字符设备等。其余九个位置分为一组，每组有三个位置来表示授予该组的权限。这些权限的顺序是
    `r` 表示读取、`w` 表示写入和 `x` 表示执行。前三个位置的位置显示所有者的权限，第二组显示组权限，最后一组显示所有其他人的权限。如果未授予某些权限，则该位置将显示一个连字符
    `-`。根据我们上面的示例：


    - `d` 表示文件类型，在此例中是一个目录

    - `rwx` 显示所有者拥有读取、写入和执行的所有三个权限

    - `r-x` 显示组只能读取和执行

    - `r--` 表示所有其他用户只能读取此文件


    对于目录，如果你没有读取权限，就无法查看目录的内容。如果缺少写入权限，你就无法向该目录写入内容。这意味着你不能在其中创建新文件。执行权限意味着你可以搜索目录并列出其内容；例如，如果你没有设置执行权限，你仍然查看目录，但你无法执行它们或切换到该目录。此外，如果你有执行权限但没有读取权限，用户可以执行文件和切换目录，但不能查看文件。写入权限对目录的影响不同，因为用户必须拥有这些授权才能创建新文件或删除现有文件。即使没有特定文件的写入权限，只要你有目录权限，你就可以删除文件。


    ## 修改所有者和组


    当你在 Linux 中创建账户时，系统会分配一个所有者 ID 和组 ID。这些 ID 影响了你作为用户所获得的权限类型。有两个命令可以更改文件的所有者和组，分别是
    `chown` 和 `chgrp`。第一个命令 `chown` 意为更改所有者，用于更改文件的所有权。`chgrp` 代表更改组，用于更改文件的所属组。


    这是使用 `chown` 的基本语法：`chown user file`。user 的值可以是用户名或用户 ID。因此，上面的命令看起来如下：


    ```

    chown Fiona test

    ```

    这会将文件的所有者更改为用户 Fiona。需要注意的是，超级用户或 root 用户具有无限制更改文件所有权的能力，而普通用户只能对他们拥有的文件进行操作。


    `chgrp` 的语法是 `chgrp group file`。与上一个命令一样，值可以是组名或组 ID。上述示例的 `chgrp` 命令将是：


    ```

    chgrp minor test

    ```

    这会将该文件的组更改为 minor 组。


    ## 设置用户 ID 和设置组 ID


    当命令执行时，它可以以特权运行以完成其任务。例如，当你使用 `passwd` 命令更改密码时，新密码被存储在 `/etc/shadow` 文件中。作为普通用户，由于安全考虑，你缺乏这些文件的读取和写入权限。然而，为了更改密码，你需要这些权限。这意味着
    `passwd` 命令必须授予你写入 `/etc/shadow` 文件的授权。这种额外的权限通过被称为设置用户 ID（SUID）和设置组 ID（SGID）的机制赋予此类程序。


    当程序启用了 SUID 或 SGID 时，你将分别获得所有者组的权限。如果未设置，程序将使用授予启动它的用户的权限。如果权限可用，这些程序将用字母 `s`
    表示。`s` 会出现在所有执行权限的位置。让我们来看下面的示例：


    ```

    ls -l /usr/bin/passwd

    -rwsxr-x 1 root bin 69531 May 7 15:49 /usr/bin/passwd

    ```

    你可以看到，SUID 已设置，且这是一个 root 命令。如果该位置是大写的 `S` 则表示未设置。


    ## 管道与重定向


    `|` 字符——或者更常被称为管道符号——在命令中非常常见。管道允许将一个命令的输出传递给另一个命令的输入。例如，假设你想对 `/bin` 目录进行长列表显示。通过输入
    `ls -l` 并按回车，列表会出现，但名称滚动得太快，无法阅读。你看到的是最后几个。如果你输入 `ls -l | more`，列表命令的结果将通过 `more`
    进行管道传输。这允许你分批查看结果。在这里，`ls` 命令的标准输出指向管道，并成为 `more` 命令的标准输入，因为后者也被修改指向管道。


    管道符号只是告诉 Shell 使用指定的文件，而不是标准输入输出文件。每个 Linux 系统都有标准输入、输出和错误的概念。标准输入在用户登录并使用命令行时获取。标准输出和错误都发送到你的屏幕。也就是说，你的系统期望从键盘或鼠标接收输入并在屏幕上显示结果或错误消息。当你的系统启动时，它首先打开这三个文件。例如，如果用户运行
    `find` 等命令，它从文件获取输入并在屏幕上显示结果。


    ## 过滤器


