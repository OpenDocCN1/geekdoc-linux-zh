- fmt: '

    The need to exchange data between machines gave rise to networking, and to be
    able to transfer data, computers must be able to talk to each other. However,
    with so many different pieces of hardware and software each speaking a different
    language, getting them to communicate seems complicated. How they interact is
    carried out in a predetermined manner referred to as a protocol. Basically, a
    protocol is a set of communication rules. These protocols define how each device
    behaves and how to react. The most common protocol in Unix-based systems is `TCP/IP`,
    which stands for Transmission Control Protocol/Internet Protocol.


    # TCP/IP


    `TCP/IP` is a protocol suite containing various protocols that were developed
    to allow communication between different brand devices. The `TCP/IP` protocol
    suite is based on a layered model, and it is focused on delivering interconnectivity
    rather than adhering to functional layers. This is the reason why `TCP/IP` has
    become the default standard opposed to Open Systems Interconnection reference
    model (`OSI`).


    Take, for instance, your email program. It can communicate with the OS through
    certain protocols but not the hardware. It would require a special program to
    do this and still require more software to facilitate communication between the
    computer and the internet hookup method. Don’t forget that the network connection
    hardware also needs to talk to pass along your email to the destined computer.
    So if all these types of communications are classified into layers, only adjacent
    layers can communicate with each other.


    This is how the `OSI` model works. Even though `TCP/IP` is structured similarly
    to this, as stated before, it allows for inter-layer communication. As per the
    example, the network connection hardware can communicate with the email-sending
    application. `TCP/IP` protocol suite is considered the industry standard because
    of its versatility.


    Here are some examples of the protocols in the `TCP/IP` family:


    - Transmission Control Protocol (`TCP`) – a connection-oriented secure protocol.
    The program first sends the information to be transmitted as a data stream then
    converted by the OS to the correct format. The data arrives at its destination
    in the original data stream format in which it was originally sent. `TCP` ascertains
    that there was no data loss or any kind of mix-up. This protocol is implemented
    wherever the data sequence matters.

    - User Datagram Protocol (`UDP`) – a connectionless, insecure protocol. The data
    to be transmitted is sent in packet form already produced by the application.
    The order in which the information arrives at the recipient is not assured, and
    there is a possibility of data loss. The `UDP` protocol is suitable for record-oriented
    applications and features a smaller latency period than `TCP`. For instance, Services,
    such as the Network File Service, or `NFS`, that use `UDP` must provide their
    own mechanisms to ensure packet delivery and their correct sequencing. Since it
    can broadcast or multicast, `UDP` also offers one-to-many services.

    - Internet Control Message Protocol (`ICMP`) – this is not a protocol for the
    end-user, but a special control protocol that releases error reports and has control
    over how the machines participating in `TCP/IP` data transfer behave. Additionally,
    `ICMP` provides a special echo mode that can be viewed using the program `ping`.

    - Internet Group Management Protocol (`IGMP`) – manages the computer’s behavior
    when implementing `IP` multicast.


    Most hardware protocols are packet-oriented. The data transferred to and from
    the hard drive is referred to in terms of data blocks known as packets. Depending
    on the application you are using the packet size can vary; however, they are small
    enough to transfer across networks quickly without any delays due to size. Also,
    since they are transferred so fast, you might not notice that your data is broken
    up.


    # TCP/IP Layers


    If we looked at the network communication process abstractly, every section supports
    and is supported by the other sections. These sections, also called layers, are
    stacked onto each other in the order below.


    ![](image_rsrc1FR.jpg)


    The bottom layer is responsible for the physical connection between the machines.
    It is known as the physical layer and deals with cable types, signal forms, codes
    etc. Next to it is the security layer or the data link layer. These layers handle
    accessing procedures such as which hosts can send data, error correction, and
    so on. The third layer, the network layer, handles remote data transfer and ensures
    that the data can be delivered and that it arrives at its destination. In more
    technical terms, this layer ensures that the packets either stay on the network
    or get transferred to the right network, all while ensuring they go to the correct
    network address.


    The transport layer ensures that the data arrives in the right order and that
    no data loss occurs. It is important to note that the data link layer ensures
    that the data gets to the right destination while the transport layer ensures
    that no data loss occurs. The final layer is where the data is generated and processed
    by the application program. This is the layer the user sees, such as an email
    program.


    Each layer is communicating with its counterpart on the other machine. This means
    that the communication between the matching layers is conceptual. The actual communication
    takes place between the different layers on each machine and not the matching
    layers on different machines. Additional data concerning each layer is added to
    the data packet to help each layer perform its job. This information is found
    in the packet header where every layer attaches a small data block, known as a
    protocol header, to every emerging packet.


    When the application layer has information to send, it attaches the application
    header with the necessary information to get the data to the right destination
    on the receiving application. The app then calls up `TCP` to send the data. `TCP`
    wraps the information into a `TCP` packet with the `TCP` header added and passes
    it to `IP`. This is called encapsulation. Like the layers before, `IP` wraps the
    data packet up and adds the `IP` header, creating an `IP` datagram. The `IP` packet
    is then handed over to the hardware driver, such as `Ethernet`, which also adds
    a header and a trailer. This is called an `Ethernet frame`.


    The network, through `TCP`, has a way of tracking what data belongs to what process.
    `TCP` ensures the packets are delivered in the right order and with all their
    content intact. It’s also responsible for error detection. This is by comparing
    the checksum information of every data packet. If the checksum doesn’t match the
    data packet contents or the packets fails to arrive, it is up to `TCP` to ensure
    the packet is resent. The `TCP` on the recipient machine must acknowledge receiving
    the packets; if not, the host `TCP` resends the packet. `TCP` is considered a
    reliable connection because of the checksum and resending data packets.


    # TCP/IP Version 6


    `IPv6`, as it is more commonly referred to, is an upgrade of the `IPv4` protocol.
    This upgrade addresses several issues regarding its predecessor such as IP address
    shortages, network layer security issues, `IPv4`’s lack of mechanisms to manage
    time-sensitive traffic, and so on.


    ## IP Addressing

