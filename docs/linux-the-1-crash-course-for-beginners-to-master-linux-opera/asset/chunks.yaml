    在 Fedora 和 SUSE 中，可以使用 `systemctl` 命令启动和关闭独立服务器。输入 `ls /etc/init.d` 命令获取服务脚本，然后通过输入
    `sudo systemctl stop smb` 或 `xinetd` 命令的正确语法来关闭服务（例如 `xinetd` 或 `Samba`）。如果服务已经在运行，请使用
    `/etc/init.d/smb stop` 停止 Samba 服务。你可以从 `/etc/init.d` 目录使用 `halt` 参数操作脚本，以类似的方式停止任何服务。


    # 互联网超级服务器配置


    除了 Web 服务器和邮件服务器等独立服务器外，`inetd` 和 `xinetd` 服务器也需要单独配置。这些服务器是互联网超级服务器，因为它们可以根据需要启动其他服务器。你可以输入
    `ps ax | grep inetd` 来查看你的系统运行的是哪个互联网超级服务器（inetd 还是 xinetd）。Debian 和 Ubuntu 使用
    `inetd`，而 Fedora 和 SUSE 使用 `xinetd`。


    `inetd` 服务器通过 `/etc/inetd.conf` 文件设置。要禁用某个服务，请找到相应的行，并在行首添加一个井号（`#`）将其注释掉。保存设置好的文件后，输入
    `/etc/init.d/inetd restart` 重启 `inetd` 服务器。


    设置 `xinetd` 服务器稍微困难一些。该服务器在系统初始化时读取名为 `/etc/xinetd.conf` 的配置文件。该文件反过来引用了存储在 `/etc/xinetd.d`
    目录下的配置文件。`/etc/xinetd.d` 中的文件显示了 `xinetd` 命令要监听哪些端口以及为每个端口启动哪个服务器。输入 `ls /etc/xinetd.d`
    可以查看你 Linux 系统上 `/etc/xinetd.d` 目录下的文档列表。每个文件都代表一个 `xinetd` 可以启动的服务。要关闭其中任何一个，请用文本编辑器编辑该文件，并在文件中添加
    `disable = yes` 一行。


    在 `xinetd` 设置文件中进行更改后，需要重启 `xinetd` 服务器才能使更改生效。要重启服务器，在命令行中输入 `/etc/init.d/xinetd
    restart`。这将终止 `xinetd` 服务器并重新启动。当 `xinetd` 重启时，它会读取配置数据并生效更改。


    # 配置 TCP Wrapper 安全


    `inetd` 和 `xinetd` 的一项基本安全特性是它们使用 TCP wrapper 来启动各种服务。TCP wrapper 是一个代码块，通过像你的消息的屏蔽包一样为互联网服务提供访问控制机制。该封装可以启动其他服务，如
    FTP 和 Telnet。然而，在启动服务之前，它会咨询 `/etc/hosts.allow` 文件，以判断请求服务的宿主机是否有授权使用该服务。如果 `/etc/hosts.allow`
    文件中没有关于该主机的信息，封装将检查 `/etc/hosts.deny` 文件，以判断是否应该拒绝该服务。如果两个文件都是空的，TCP wrapper 就可以访问请求的服务。


    以下是收紧对 `inetd` 或 `xinetd` 设置启动的服务访问的步骤：


    1.  使用 `vi` 等文本编辑器编辑 `/etc/hosts.deny` 文件，包含以下行：`ALL:ALL` —— 此设置将拒绝所有主机访问你系统上的任何互联网服务。

    2.  编辑 `/etc/hosts.allow` 文件，并在其中包含可以访问你系统服务的主机名。

    3.  要仅允许来自 `192.168.1.0` 网络和本地主机（IP 地址 `127.0.0.1`）获取你系统上的服务，请在 `/etc/hosts.allow`
    文件中放入以下行：`ALL: 192.168.1.0/255.255.255.0 127.0.0.1`。

    4.  如果你想授权特定的远程主机访问特定的互联网服务，请在 `/etc/hosts.allow` 的行中使用以下顺序：`server_program_name:
    hosts` —— 此处`server_program_name` 是服务器程序的标题，`hosts` 是具有服务权限的主机逗号分隔列表。你也可以将 `hosts`
    输入为网络地址或整个域名，例如 `.myplace.com`。


    # 计算机安全工具


    以下是你在加固系统时可以使用的一些常用工具：


    1.  `chage` – 修改强制更改密码之间的时间。你可以设置最小和最大天数、为了进行更改而提供的警告天数以及过期日期。

    2.  `find` – 该系统中最强大的全能工具之一。如果你有正确的语法，该命令可以让你找到机器上的几乎任何内容。在许多选项中，你可以找到由用户创建、由组创建或在特定日期具有特定权限的文件。

    3.  `lsof` – 打开文件列表工具的缩写。根据所应用的参数，你可以选择查看由进程或用户打开的文件。

    4.  `netstat` – 让你查看网络状态、网络连接、路由表和统计信息。

    5.  `nmap` – 扫描网络并创建网络映射，这种能力适用于端口扫描和安全审计。

    6.  `passwd` – 允许用户更改密码。许多用户不知道它的存在，但可以通过图形界面更改密码。

    7.  `su` – 临时切换另一个用户，当用户退出此 shell 时，将回到原始 shell。只要你有密码，就可以变成 root 用户。

    8.  `sudo` – 无需启动新的 shell（如 su）即可以特权执行执行任务。

    9.  `ulimit` – 设置 shell 的资源限制，防止单个用户占用所有系统资源。

    10. `usermod` – 可视作 `chage` 的增强版本。它可以设置默认 shell、锁定或解锁用户账户。


    # 本章总结


    让我们回顾一下：


    *   我们建立了什么是底层安全以及为什么对你的系统至关重要。

    *   我们查看了风险分析以及你的系统可能面临的威胁。

    *   我们研究了如何通过分配适当的所有者和权限来保护文件和系统。

    *   我们讨论了一些主机相关的安全问题，以及你如何使用 GPG 加密文件。


    练习题


    1.  执行系统安全审计。你是否发现了系统中任何潜在的威胁或漏洞？

    2.  检查你的系统是否符合安全规定。你是否有任何方法可以增强安全性？

    3.  下载并安装 GNU 隐私卫 (GPG) 工具。尝试生成加密密钥对。你成功了吗？

    4.  现在尝试加密和解密文件。你成功了吗？

