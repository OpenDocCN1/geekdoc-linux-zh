    ### Exercise 1:

    Check all the following files using the `cat` command.


    * `/etc/passwd`

    * `/etc/shadow`

    * `/etc/group`

    * `/etc/gshadow`


    ### Exercise 2:

    * Connecting and disconnecting from the system

    * Figure out if your system is in text or in graphical mode.

    * Find the login prompt and log in with the username and password you created
    during installation.

    * Log out and try logging in again, using a made-up username and observe your
    terminal.


    ### Exercise 3:

    * Log in again with your username and password and change your password to `K5js3.tt!`,
    hit enter and observe what happens.

    * Try it again but this time, set your password to something easy like `0000`
    and see what happens.

    * Change your password a third time but don’t input anything and see what happens.

    * Try using the `passwd` command instead of `passwd` and observe what happens.

    * Remember to change your password back from `K5js3.tt!`, after this exercise.
    Some systems might not allow you to recycle passwords, i.e., restore your original
    password within a certain time frame or a certain amount of password changes,
    or even both.


    # CHAPTER 5: Security


    Even though Linux has some inherent advantages over other operating systems when
    it comes to security, it is still vulnerable to security issues that need to be
    addressed just like in any other system. Regardless of the measures you may have
    in place, the concepts are the same. Think of it this way: the basic principles
    you would use to secure for your home or office will apply when it comes to computer
    security. You only want to let in authorized people and give them access to the
    areas they are allowed in. Most people think security is being risk- or danger-free.
    They also think that it includes the methods used to keep this danger or risk
    away, such as getting an alarm to keep burglars out. When it comes to computers,
    both these definitions apply, albeit depending on what you are referring to.


    If we consider computer or system security from the point of view of being risk-free,
    then we are referring to such things as having reliable software, hardware, and
    backups. While these issues are important, this is not everything is meant by
    security. Computer security also deals with preventing someone from breaking into
    your computer. That is, another user gaining unauthorized access to your system.


    ## Why Is Security Important?


    In today’s world, almost all devices are connected to a network. Whether it is
    on an isolated or public network, you have to protect the system from other users
    and the users from each other. You don’t want them altering or deleting system
    files accidentally or intentionally, or damaging their systems too. The odds are
    quite high that your Linux system will be connected to the Internet. You want
    to protect it from the danger that is present on the web. These intruders can
    impersonate a user and access a system to steal, destroy, or deny you access.
    This is referred to as a denial of service (DoS) attack.


    An internet connection makes your system open to other systems on the Internet.
    While this can be great for a multitude of services, it also puts you at risk.
    You cannot have a truly secure system as long as it is connected to a network,
    but you can work to make your system more secure and robust to deter attacks.


    There are many reasons why you should secure your system, and before undertaking
    any measure, it is important to know why you are doing so. As you look to secure
    your system, ask yourself what it means to be secure, what are the risks involved,
    the effects it will have on the users, and if there is any data on it. By considering
    these factors, you will know if you have met your goal of securing your system.


    We keep talking about security and securing a system, but what aspects of security
    should be implemented to get this security? These aspects include:


    * authorization for users, programs, etc. with the necessary permissions or access

    * authenticity to verify users, programs, etc. as who they claim to be

    * privacy to ensure personal data is not tampered with or compromised

    * integrity in upholding the privacy of the data and ensuring no corruption has
    taken place

    * non-repudiation that the data is reputable

    * availability of the system to perform its duties and functions


    Now that you know the aspects a secure system should have, let’s look at system
    hardening. This chapter goes through how to harden your system to make it more
    secure. Before we begin, let us define some terms. They embody the key concepts
    of securing a system.


    ### System Auditing


    An audit is an inspection or assessment of a system. Therefore, a security audit
    can be defined as the inspection and assessment of a system’s security capability.
    No system can be deemed as secure without testing. This is where a security audit
    comes in. You can assess the potential risks your system is under.


    ### System Compliance


    Compliance can be defined as the ability to meet specified standards. When applied
    to computer security, system compliance then refers to the measures taken to ensure
    the system meets the requirements. For instance, your baseline requires that each
    system should have a firewall. A compliance check would involve testing for the
    presence of a firewall.


    ### System Hardening


    As the name would suggest, system hardening involves strengthening your system’s
    defenses to safeguard it better. It is similar to fortification, where you add
    new defenses and improve on existing ones. This fortification can also involve
    the removal of some components to keep the system safe. For example, if you have
    a security system that protects your home from thieves, you can harden it by adding
    other security features. These can include motion sensors, infra-red cameras,
    etc. to boost your defenses.


    The first step is setting up a set of guidelines that explain what users on your
    system, even internet visitors, are allowed to do. The security level you set
    depends on how you use your system and the risk it is under if someone were to
    gain unauthorized access. A company system administrator, for instance, may want
    to involve the management in setting up these security policies. The system security
    requirements you set determine what you are securing. They identify the computer
    resources and data you have to protect, including the applicable laws such as
    privacy.


    These requirements can include enabling authorized users to access data, implementing
    rules that define who has access to what data, and limiting access to public users.
    Use a robust user-authentication system tool. Refuse the execution of malicious
    or destructive actions on the information. Secure data from end to end as it moves
    across networks. Finally, impose all security and privacy needs that applicable
    laws require.


    ## Risk Analysis

