    while communicating with the X server


    *   Application server – a program that also runs on a remote host that processes
    data and communicates with application clients


    *   Application client – a program run on a local host that is connected to the
    user’s display and input devices


    Modern X servers have the MIT shared memory extension and can talk with their
    local clients using local shared memory. This negates the need for network-transparent
    Xlib inter-process communication and enables the system to render larger images.


    The X windowing system works like all client-server models where the X server
    contains several resources that it provides to the client. As stated earlier,
    the server and the client programs don’t have to be on the same machine because
    X is included in the TCP/IP protocol. And since X is more of a protocol than a
    program, computers can still communicate even if they have different architectures.
    For instance, a digital OSF/I server can service a Linux and AIX client as well
    as either client system providing services to the OSF/I server. Similar to other
    network applications, a single machine can serve as a client or server.


