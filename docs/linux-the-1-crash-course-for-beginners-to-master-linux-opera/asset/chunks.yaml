    网络环境利用了多种设备，为了帮助统一这些设备，`TCP/IP` 确定了一个抽象接口，通过该接口访问硬件。该接口提供了一组适用于所有硬件类型的相似操作，并基本上处理数据包的发送和接收。每个外围网络设备在内核中都有相应的接口。例如，Linux
    中的以太网接口命名为 `eth0` 和 `eth1` 等名称，PPP 接口命名为 `ppp0` 和 `ppp1`，FDDI 接口命名为 `fddi0` 和
    `fddi1`。这些名称用于您在配置命令中指定特定的物理设备时的配置，除了此用途外它们没有其他意义。


    在用于 `TCP/IP` 网络之前，必须为接口分配一个 IP 地址。它在与其他组件通信时充当其标识符。该地址与之前提到的接口命名不同。可以这样想：如果你将接口比作一扇门，那么地址就像是钉在门上的门牌。


    IP 网络协议将地址识别为 32 位数字，每台机器都会被分配一个在该网络环境中唯一的数字，主要是 `IPv4`。这些地址通常以以下格式出现。


    IP 地址（二进制）：`11000000 10101000 00000000 00010100`

    IP 地址（十进制）：`192.168.0.20`


    IP 地址写为 4 个每个 8 位的十进制数用点分隔。例如，IP 地址为 `0x954C0C04` 的机器将写为 `149.76.12.4`。这种格式也称为点十进制表示或点四位表示。它越来越多用于
    `IPv4`，因为 `IPv6` 提供了更灵活的地址方案以及其他现代功能。表示法分为网络号（位于前几个字节）和主机号（位于表示法的剩余部分）。当你向 `NIC`
    请求 IP 地址时，系统并不会为你计划使用的每个主机分配地址。相反，它会为你分配一个网络号，并允许将此范围内的所有有效 IP 分配给你的主机。


    主机部分取决于网络大小，为了适应各种需求，定义了几个显示不同 IP 地址拆分位置的网络类。以下是这些类网络：


    *   A 类 – 由网络 `1.0.0.0` 到 `127.0.0.0` 组成，网络号包含在第一个字节。该类具有 24 位主机部分，每个网络允许允许 160
    万个主机。

    *   B 类 – 包含网络 `128.0.0.0` 到 `191.255.0.0`，网络号在前两个字节部分。该类提供了 16,320 个网络，每个网络有
    65,024 个主机。

    *   C 类 – 其网络范围从 `192.0.0.0` 到 `223.255.255.0`，网络号包含在前三个字节部分。该类允许近 200 万个网络，每个网络最多
    254 个主机。

    *   D、E 和 F 类 – 这些类的 IP 地址范围从 `224.0.0.0` 到 `254.0.0.0`，要么是实验性的，要么保留用于特殊用途，不规定任何网络。IP
    多播是一种允许一次性向网络上的多个点传输数据的服务，已从该范围内分配了地址。


    你可能已经发现，在前面的列表中，主机部分的每个字节并不允许所有可能的值。这是因为字节 0 和 255 被预留用于特殊用途。主机部分所有位全为 0 的地址指的是网络，而所有位全为
    1 的地址被称为广播地址。这指的是同时指向特定网络上的所有主机。例如，`148.79.255.255` 不是有效的主机地址，而是指向 `148.79.0.0`
    网络上的所有主机。


    还有其他预留用于特定用途的网络地址，例如 `0.0.0.0` 和 `127.0.0.0`。第一个被称为默认路由，后者称为回环地址。回环地址保留用于主主机本地的
    IP 流量。地址 `127.0.0.1` 将被赋予你主机上的一个特殊接口，称为回环接口，它像一个闭路电路。任何来自 `TCP` 或 `UDP` 的数据包都将返回，就像它们来自另一个网络一样。


    ## 网络配置


    大多数 Linux 发行版都带有各种图形化工具，允许用户轻松地在本地网络中设置计算机、连接到 ISP（互联网服务提供商）或设置无线访问。这些工具可以从菜单或命令行启动。例如，红帽
    Linux 拥有 `redhat-config-network`，它既有图形界面也有文本模式。请检查你发行版的文档以获取有关可用工具及其用法的更多信息。


    上述工具使用多个命令来编辑特定的网络配置文件。这些文件的确切名称和位置取决于你的发行版。


    ### `/etc/hosts`


    `/etc/hosts` 文件列出了网络上的主机。它用于在没有类似域名（DNS）服务的情况下进行命名。以下是主机文件的示例：


    ```

    # 不要删除此行，否则各种需要

    # 网络功能的程序将无法运行。

    127.0.0.1 localhost

    ```


    ### `/etc/resolve.conf`


    `/etc/resolve.conf` 文件设置对 DNS 服务器的访问，并包含你的域名和服务器名称。你可以在其帮助页（man page）上获取更多信息。


    ### `/etc/nwitch.conf`


    `/etc/nwitch.conf` 文件定义了联系域名服务的顺序。如果你计划连接互联网，DNS 必须出现在主机的行中。


    ### `ip` 命令


    `ip` 命令用于为接口分配 IP 地址、设置包括互联网在内的网络路由、显示 TCP/IP 配置等。需要注意的是，对于网络接口，即使在只有一个网络接口的系统上，`lo`
    也是本地回环，用于内部通信；`eth0` 是真实接口的常用名称。无线接口通常定义为 `wlan0`，调制解调器接口为 `ppp0`，但可能还有其他名称。对于标记为
    `inet` 的 IP 地址，本地回环始终为 `127.0.0.1`，而物理接口可以是任何序列。硬件接口地址（可能作为连接网络身份验证方法的一部分）标记为
    `ether`。本地回环包含 6 对零，物理回环包含 6 对十六进制字符，其中前 3 对是厂商特定的。


    ### 使用 `netstat`


    `netstat` 命令是 `ip` 的替代方案，用于检查主机网络配置。它有很多选项，并在任何 Unix 系统中都用。你可以通过使用 `netstat` 命令的
    `-nr` 选项来显示路由信息。


    其他可以使用的命令包括：


    *   `/bin/hostname` – 显示当前主机名称。

    *   `/bin/ping` – 向网络主机发送 `ICMP ECHO_REQUEST` 包。

    *   `/etc/ftpaccess` – FTP 访问配置文件

    *   `/etc/ftphosts` – FTP 个主机访问文件

    *   `/etc/ftpusers` – 列出被自动拒绝 FTP 访问的用户

    *   `/etc/gated` – 网关路由守护进程。

    *   `/etc/hosts` – 列出网络上的主机。

    *   `/etc/hosts.equiv` – 列出信任主机。

    *   `/etc/http/conf/*` – 显示 HTTP 配置文件

    *   `/etc/inetd.conf` – 显示 inetd 配置文件。


