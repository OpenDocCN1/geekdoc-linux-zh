    CHAPTER 4


    System Administration


    System administration encompasses a lot of areas, and thus it becomes quite hard
    to clearly define what it is precisely because all aspects of a computer fall
    under system administration. This includes software, hardware, networking, and
    even programming, to mention a few.


    System administration allows a user to get a better understanding of the system
    and thus utilize it better, from starting the system, creating and managing accounts,
    installing software, configuring hardware, device management, automating the system,
    backing it up, etc. You can see that a system administrator wears a lot of hats.
    You are your system’s administrator, and these responsibilities fall on you. 


    In this chapter, we’ll examine some of those system administration tasks. We will
    not dive deep into the nitty-gritty, but we will cover the basics — i.e., the
    functional areas of system administration — so that you can use the programs and
    utilities at your disposal.


    System Start-Up and Shut Down


    Starting up a Linux system is quite simple, and it involves pressing the power
    button and watching your system boot. Almost all users and many system administrators
    have no idea of what is happening as the system boots. From switching the power
    on to getting to the login prompt, a lot of things must take place. Knowing what
    is happening in the boot process can be quite useful because you can easily tell
    what went wrong if a system does not start how it should. Starting up your system
    can be as easy as turning it on and letting it boot. However, you can alter this
    behavior by changing the boot process. We will not get too deep into the boot
    process, but here are some important things to keep in mind when shutting your
    system down.


    Linux is unlike the other operating systems, and even with the many efforts to
    make it look superficially like these other operating systems, they still differ,
    especially when shutting the system down. In other systems, you are always aware
    of what’s going on, and you have complete control over everything. You can decide
    to turn the computer off once you feel you are done. However, since Linux is a
    multi-user system, there are other users working or using its resources, so simply
    switching off the machine is not advised. Other than annoying other users, you
    could damage your system depending on what was running when you switched off.


    On a multi-user system, there are many things that are going on without the user’s
    awareness. For instance, the system could still have data in the buffer waiting
    for a chance to write it on the hard drive. If you switch off the power, this
    data will be lost, and the data left on the drive will be inconsistent. To prevent
    this, you need to shut your system down properly. What a proper shut down consists
    of will depend on the conditions. Linux nonetheless does have tools to help with
    the shutdown; switching off the power is not considered a proper shutdown.


    User Account Management


    When many people use a device such as a workstation, it’s vital to differentiate
    between the users. This, for instance, helps keep their personal files private,
    whether it is used by many users simultaneously or only by one user at a time,
    such as in microcomputers. Every user is assigned a unique identifier known as
    a username that they use to log in.'
