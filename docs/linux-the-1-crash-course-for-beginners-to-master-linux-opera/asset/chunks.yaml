    进程（Process）是一个在自身独立位置运行的可执行应用程序。它与作业（job）或命令（command）不同，因为一个单一任务可能由多个协作运行的进程组成。单个进程执行诸如
    `ls` 之类的简单命令。例如，包含管道符号的命令是一个复合命令，需要执行多个进程。通过控制进程，你可以管理基于 Unix 的系统上的 CPU 资源。


    不要忘记 Linux 是一个多用户系统，因此你可以让多个用户在同一台系统上同时运行多个命令。这可能会带来相当严峻的挑战，因此必须采取相应措施，让 CPU 在管理所有进程的同时保留系统功能，以便用户可以在不同进程之间切换，并能够取回被中断的进程。在某些情况下，即使启动进程的用户注销，进程仍然会继续运行。


    为了更好地理解其工作原理，让我们来看看进程的结构。


    ## 进程类型


    存在多种进程；在这里，我们将介绍交互式进程、守护进程（daemons）和自动批处理进程。


    ### 交互式进程


    这些进程通过终端会话启动并控制。这意味着用户必须连接到系统才能启动它们，因为它们不会作为系统功能的一部分自动启动。它们可以在前台运行也可以在后台运行。在前台运行的进程与终端保持连接，因为它们直接与终端通信。例如，一个已经运行并等待输出的命令意味着它是一个前台进程。当前台进程运行时，只有它能从终端获取输入。


    这意味着如果你在一个大文件上运行命令，在命令结束或你用 `CTRL-C` 杀死它之前，你将无法运行另一个命令。或者，你可以将其作为后台进程运行。这样，用户在另一个程序运行时仍然可以使用终端。通过这种方式，系统就不会处于空闲状态或生成错误消息。


    Shell 有一种名为作业控制（job control）的功能，可以简化对多个进程的处理。该功能可以将进程从前台切换到后台，反之亦然。你还可以在后台启动应用程序。在后台运行进程只有当它不需要用户输入且执行可能需要一段时间时才有用。后台进程可以被恢复，并在不与启动它的终端解离关联的情况下执行。以下是大多数
    shell 中作业控制特性的几种工作方式：


    -   `regular_command` – 在前台运行命令

    -   `&` – 在普通命令后添加此符号告诉 shell 在后台运行该命令。（例如 ` $ long_cmd&`）

    -   `jobs` – 显示后台进程列表

    -   `Ctrl+Z` – 挂起，意味着临时停止——但不退出正在运行的前台进程

    -   `Ctrl+C` – 中断，意味着终止并退出前台进程

    -   `%n` – 为每个后台运行的进程分配一个数字；通过使用 `%` 表达式可以使用数字引用作业，例如 ` $ kill %4`

    -   `bg` – 重新激活已挂起的后台进程

    -   `fg` – 将进程恢复到前台

    -   `%? str` – 用于引用包含指定字符的后台作业命令

    -   `kill` – 结束进程


    ### 批处理或自动进程


    这些进程独立于终端，但它们可以在备用打印程序区域（spooler area）中队列，按照先进先出（FIFO）的原则等待执行。可以通过以下两个标准之一运行这些进程：任务在指定的日期和时间执行，或者使用
    `at` 命令完成。


    任务还可以在系统负载低到允许容纳额外作业时执行。这是通过使用 `batch` 命令完成的。默认情况下，当系统负载低于 `0.8` 时，这些进程会排队并等待执行。在较大的系统中，当有大量数据需要处理，或者任务负载对当前系统要求过高时，可以使用批处理。它也可以用于……


    ### 守护进程


    这些是持续运行的服务器进程。它们在启动时初始化，并在后台等待直到被需要。例如网络守护进程，它们在客户端应用程序需要之前一直处于休眠状态。许多 Unix 守护进程，如
    `syslogd`、`sendmail`、`lpd`、`rlpdaemon`、`crond`、`syncd`、`pagedaemon` 等。


    ## 进程属性


    可以使用 `ps` 命令查看 Linux 进程的几个特性，包括：


    -   进程 ID – 用于引用进程的唯一标识符

    -   父进程 ID 或 `PPID` – 启动当前进程的进程的 `PID`

    -   Nice 值（Nice number） – 表示当前进程与其他进程的友好程度。它不应与进程优先级混淆，优先级是根据 nice 值和进程的 CPU 使用率计算的。

    -   终端或 `TTY` – 表示进程关联的终端

    -   实际和有效用户 ID (`RUID`, `EUID`) – 进程的 `RUID` 是所有者或启动它的用户的 ID。其 `EUID` 是定义进程访问系统资源权限的用户
    ID。它们通常是相同的，并赋予进程与所有者相同的访问权限，除非设置了 `setuid` 访问模式。

    -   实际和有效组所有者 (`RGID`, `EGID`) – 实际组所有者是进程所有者的主组。决定访问的有效组所有者通常相同，除非应用了 `setgid`
    (`SGID`) 访问模式。


    ## 进程的生命周期


    当一个现有进程（其父进程）在一个名为“分叉”（forking）的程序中创建一个完全副本时，新进程就会被创建。这个新进程被称为子进程，它与父进程共享环境，但
    `PID` 不同。分叉后，子进程的位置将通过 exec 调用被覆盖。


    为了更好地理解这一工作原理，让我们来看一个例子。当用户运行诸如 `grep` 的命令时，用户的 shell 进程会分叉，创建一个新进程来执行该命令。这个新的
    shell 进程通过 exec `grep` 开始执行命令。一旦 `grep` 命令完成，进程就会死亡。


    这基本上是所有 Unix 进程的创建方式。总祖先进程 `PID 1`（init）在启动过程中创建。它通过 fork-exec 创建其他进程，其中就包括执行
    `getty` 命令的进程。

