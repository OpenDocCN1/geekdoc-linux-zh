    Today Linux is readily available either online or from local retailers. Users
    can now even purchase computers that come with a pre-installed Linux distribution.
    In the early days, you had to be an expert or have a solid background in computing
    to use Linux, but companies such as RedHat, Mandriva, and SuSE arose to provide
    versions of Linux that can be used by the masses. They integrated many components,
    such as graphic user interfaces (GUIs) developed by the Linux community to ease
    program and service management. With the addition of these user-friendly interfaces
    and MS Office-compatible programs such as word processors, Linux is quickly becoming
    an acceptable choice for everyday home or office use. Its application spans further
    than just being a workstation or a server OS. It also runs on gadgets such as
    phones, tablets, or even smartwatches. This makes Linux the only OS that interacts
    with such a wide range of hardware.


    In this section, we’ll take a look at how to select and install Linux onto your
    computer. We will also get into how to setup the system, troubleshoot, and even
    update or upgrade to a new Linux version.


    # Selecting a Linux Distribution


    As mentioned above, it was pretty hard to use Linux in the beginning. Many people
    chose not to learn it because even though documentation on every aspect of the
    system existed, the explanations were too technical for newbies to understand,
    thus discouraging them from learning the system. This realization pushed the Linux
    community to make changes to the accessibility of the system and make it more
    appealing to more non-techy people.


    This paved the way for the development of Linux distributions which did not require
    that you have an in-depth knowledge of Linux to use them or have the system comply
    with your commands. Nowadays, you can log in and start all the applications you
    want without having to type a single command and still have the ability to access
    the system core if need be. This system allows new users to get accustomed to
    the system instead of being forced to learn things the hard way.


    So what is a Linux distribution? Linux distributions are the many operating systems
    created by various programmers, organizations, or companies that are individually
    tailored to suit their needs. They combine the Linux kernel and other software
    such as the GNU core utilities, graphical servers, a desktop environment, programs,
    and more. Each distribution has a different combination of these elements as they
    are built for a specific purpose to meet the needs of its intended users.


    More and more Linux distributions are now being made for desktop users who are
    generally considered to be the least likely to know how a system works. The developers
    are working to create beautiful desktops or at least make them look like your
    former Windows or Mac workstation and compatible programs. There are a lot of
    sites with screenshots that can show you how your computer will look once you
    install Linux. Most of these distros can be downloaded for free and burned onto
    a CD or USB or installed in any machine you want. Here are some of the most popular
    Linux distributions:


    * Linux Mint

    * Manjaro

    * Debian

    * Ubuntu

    * RedHat Enterprise

    * Fedora

    * CentOS

    * Opensuse


    There are many Linux distributions available, meaning that you are sure to find
    one that suits your needs, and you don’t have to be an expert to get a suitable
    version. However, this also makes selecting a Linux distribution an overwhelming
    task. So how do you choose one?


    The distro you will use will depend on how you answer the following questions:
    How excellent are your computer skills? Do you favor a modern or a regulation
    desktop interface? Are you using Linux for a server or desktop? For someone with
    reasonably basic computer skills, you will want to stick to the more newbie-friendly
    distributions such as Linux Mint, Ubuntu, etc. However, if your skillset ranges
    further than this average range, you can go for distros such as Fedora or Debian.
    If you have mastered computers and system administration, you can pick Gentoo
    or take on a challenge and build your own Linux distribution from scratch.


    For a server-only distro, you have to choose if you need to have a desktop interface,
    or you want to use command lines only. Command-line only server distributions
    are not weighed down by graphics, but you will need to have a good understanding
    of the Linux command line. You can install a graphical user interface package
    in the server distro with the command line as well; for example, you can get Ubuntu-desktop
    by typing

    ```bash

    sudo apt-get install ubuntu-desktop

    ```

    Also, while selecting a server distribution, do you want one that offers you everything
    you need when you download it, or do you want to adapt a desktop distro to serve
    your needs?


    It is essential to consider your hardware when selecting a Linux distro. Since
    all distributions have similar basic packages based on the Linux kernel, what
    you should focus on is whether the distro you want will run on your hardware.
    For instance, LinuxPPC was made to run on Apple and other PowerPCs and does not
    work with x86 based devices. It can run on newer Mac computers, but you cannot
    use it on older machines because the technology is now obsolete.


    # Hardware Checklist


    You can install Linux on any computer; however, this also depends on the kind
    of Linux distribution you are installing and what you plan on using the computer
    for. Here are some basic requirements for any machine running a Linux distro.


    ### 1. CPU


    This is the brains of the computer, and it defines the speed at which your OS
    will run. Since Linux was initially designed to work on an Intel 386, it can pretty
    much run on any CPU. You can also run Linux on a Mac or even ARM-based machines
    such as Raspberry Pi. However, Linux distributions are popular on x64 (64 bit)
    intel or AMD PPC (G3-G5) and AMD processors, and today they are actively developed
    for these devices. The minimum requirements for a CPU are 2GHz Intel Pentium 4
    or AMD K6 with a dual-processor. This will run the OS, but the desktop experience
    will be limited. If you can, get a computer with better or higher specifications.


    ### 2. RAM (memory)


    Most distros will require about 2 GB of RAM to run any graphical interfaces. However,
    if you want to utilize it for non-graphical uses such as web page hosting, you
    can even run Linux with less than 10 MB of RAM. For better performance, the minimum
    RAM should 512 MB upwards.


    ### 3. Hard Disk Drive


    As with all things in Linux, it is possible to do it even in the smallest of setups.
    Certain distributions such as Puppy Linux can be run with a few hundred megabytes.
    However, for standard desktop installations, you will need about 20–40 GB of free
    space on your hard drive. This is enough space to let you explore the OS more.
    If you plan on converting your entire system to Linux, then the more space you
    have, the better. Newer distros now support new drive technology such as RAID
    and SATA out the box, with enterprise-grade fiber channel disk arrays supported
    by Linux server distributions.


    Typically, Windows occupies 100% of the space on your computer, so to install
    Linux, you will have to repartition your hard disk and make some room. Newer distributions
    have made it even easier to partition your drive by making use of the free space
    on your HDD. If you are resizing your drive, try to give Linux as much space as
    you can. Don’t forget to allocate some space for SWAP. SWAP is the area in which,
    if the RAM on your machine fills up, it will use this disk space instead. This
    is useful if you only have limited RAM, however on higher RAM specs, you probably
    won’t need it. You can also set up your Linux OS on a separate hard drive if you
    have one. This way you don’t mess around with system files as you are resizing
    partitions.


    ### 4. Video Cards or the Graphics Adaptor

