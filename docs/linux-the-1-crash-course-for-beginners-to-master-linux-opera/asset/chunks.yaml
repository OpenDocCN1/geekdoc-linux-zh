- fmt: '

    A process is an executable application that’s operating in its own location. It
    is distinct from a job or command as they can comprise of several processes working
    together to achieve a singular task. A singular process executes simple commands
    such as `ls`. A command containing pipe symbols, for instance, is a compound command
    and requires the execution of several processes. By controlling the processes,
    you can manage the CPU resources on Unix based systems.


    Don’t forget that Linux is a multi-user system, so you can have several users
    running multiple commands simultaneously on the same system. This can present
    quite a challenge, and measures have to be taken for the CPU to manage all these
    processes while retaining functionality so users can switch between and also retrieve
    interrupted processes. There are cases where processes continue running even after
    the user who initiated them logs out.


    To better understand how this works, let’s examine the process structure.


    ## Process Types


    Several kinds of processes exist; here, we will look at interactive, daemons,
    and automatic batch processes.


    ### Interactive Processes


    These are started and controlled through a terminal session. This means a user
    has to be connected to the system to initiate them since they are not automatically
    started as part of the system functions. They can either run in the foreground
    or background. Processes running in the foreground remain attached to the terminal
    because it communicates directly with the terminal. For instance, a command that
    has been run and is awaiting output means it is a foreground process. While a
    foreground process operates, only it can get input from the terminal.


    This means that if you run a command on a large file, you will not be able to
    run another one until the command ends, or you kill it with `CTRL-C`. Alternatively,
    you can run it as a background process. This way, the user can still use the terminal
    as the other program runs. This way, the system does not remain idle or generate
    error messages.


    The shell has a feature known as job control that eases the handling of several
    processes. This feature switches processes from the fore to the background and
    vice versa. You can also start applications in the background. Running a process
    in the background is only useful if it does not need user input and its execution
    might take a while. A background process can be resumed and executed unlinked
    to the terminal that began it. Here are some of the ways the job control feature
    works in most shells.


    - `regular_command` – runs a command in the foreground

    - `&` – adding this to a regular command tells the shell to run the command in
    the background. (e.g. ` $ long_cmd&`)

    - `jobs` – shows a list of background processes

    - `Ctrl+Z` – suspends, meaning it temporarily stops — but does not quit — a process
    running in the foreground

    - `Ctrl+C` – interrupts, meaning it terminates and quits a foreground process

    - `%n` – assigns each process running in the background a number; by using the
    `%` expression a job can be referred to using its number, for instance, ` $ kill
    %4`

    - `bg` – reactivates a suspended background process

    - `fg` – restores a process to the foreground

    - `%? str` – used to reference the background job command containing the specified
    characters

    - `kill` – ends a process


    ### Batch or Automatic Processes


    These processes are independent of the terminal, but they can be queued in a spooler
    area as they await execution on a first-in, first-out (FIFO) basis. These processes
    can be run by applying either of these two criteria: these tasks are executed
    at a specific time and date, or this is done using the `at` command.


    The tasks can also be executed when the system load is low enough to allow extra
    jobs. This is done using the `batch` command. By default, these processes are
    queued and await execution when the system load is below `0.8`. In larger systems,
    batch processing can be used when there is a lot of data that requires processing,
    or the task load is too demanding on the current system. It can also be used


    ### Daemons


    These are continuously running server processes. They are initialized at start-up
    and wait in the background until they are needed. An example would be the networking
    daemons which lay dormant until needed by a client application. There are several
    Unix daemons such as `syslogd`, `sendmail`, `lpd`, `rlpdaemon`, `crond`, `syncd`,
    `pagedaemon`, and many more.


    ## Process attributes


    Linux processes have several characteristics that can be seen using the `ps` command.
    These include:


    - The process ID or `PID` – a unique identification number used to reference a
    process

    - The parent ID or `PPID` – the `PID` of the process that initiated the current
    process

    - Nice number – indicates the friendliness of the current process to other processes.
    It should not be confused with process priority, which is calculated based on
    the nice number and the process’s CPU usage.

    - Terminal or `TTY` – indicates the terminal to which the process is linked to

    - Real and effective user ID (`RUID`, `EUID`) – a process’s `RUID` is the user
    ID of the owner or the user who started it. Its `EUID` is the user ID used to
    define the access the process has to system resources. They are usually the same
    and grant the process the same access rights as the owner, except when `setuid`
    access mode is set.

    - Real and effective group owner (`RGID`, `EGID`) – the real group owner is the
    main group of the process owner. The effective group owner, which determines access,
    is usually the same, except when `setgid` (`SGID`) access mode has been applied.


    ## The Life Cycle of a Process


    A new process is created when an existing one, its parent process, makes an exact
    copy of itself in a procedure known as forking. This new process is referred to
    as the child process and shares the same environment as the parent process but
    with a different `PID`. After forking, the child process’s location is overwritten
    with the new process through the exec call.


    Let’s use an example to help you better understand this concept. When a user runs
    a command such as `grep`, the user’s shell process forks, creating a new process
    to execute the command. This new shell process execs `grep` begins executing the
    command since it overlaps grep. Once the `grep` command completes, the process
    dies.


    This is basically how all Unix processes are created. The overall process ancestor,
    `PID 1`, `init`, is created during the boot process. It creates other processes
    through fork-and-exec, and among them are processes executing the `getty` command.
    They are assigned to different serial lines and display the login prompt, waiting
    for someone to respond to it. When a user logs in, the `getty` process execs the
    `login` program, which then validates the login credentials, among other activities.
    Once verification is done, `login` execs the user’s shell.


    You don’t always need to fork to run a new program such as is the case with the
    login program above. After logging into the system, the user’s shell is the same
    process as the `getty` that was monitoring the unused serial line. That process
    switched programs two times by execing a new executable, and it will proceed to
    create new processes to run the commands inputted by the user. When a process
    exits, it sends a signal that informs the parent process that it has been completed.
    When a user logs out, the login shell will signal its parent, `init`, as it closes,
    informing init that it should create a new `getty` process for the terminal. Then
    init forks again and initializes `getty`, and the whole cycle repeats.

