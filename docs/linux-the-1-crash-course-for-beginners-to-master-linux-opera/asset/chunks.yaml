    * `/usr/sbin/in.telnetq` – telnet 进程

    * `/usr/sbin/in.tftpd` – 易 FTP TFTP 进程

    * `/usr/sbin/in.fingerd` – finger 进程

    * `/usr/sbin/traceroute` – 追踪到远程计算机的封包路由。


    # 网络应用


    Linux 是网络服务的绝佳平台，以下是许多应用程序之一。


    ## 服务器类型


    你可以通过两种方式向用户提供服务：让服务运行在独立模式下，或者让它依赖于其他服务来激活。


    独立模式主要用于那些频繁且持续使用的网络服务。它们是独立的程序，在系统启动时启动，并等待其配置为监听的特定连接点或端口的请求。当请求通过时，它会被处理，然后程序继续监听下一次请求。一个很好的例子是
    Web 服务器。它应该始终可用，而且如果请求过多，它可以创建更多的监听实例来同时为用户提供服务。


    程序-服务激活模式适用于那些没有后台运行服务器进程的服务。互联网守护进程（`inetd`）代替它们进行监听，并在需要时调用它们，因为在一个会话中启动你需要的所有进程将导致资源和时间的浪费。这些服务包括
    FTP、Samba、Telenet、安全拷贝（scp）或 finger 服务等。超级服务器（super server）即互联网守护进程，在系统启动时进行初始化，并以两种方式实现：`inetd`
    和 `xinetd`。后者被称为扩展互联网守护进程（Extended Internet Daemon）服务，且二者中总有一个在系统运行运行。


    `inetd` 守护进程负责的服务列在它的配置文件 `/etc/inetd.conf` 和 `/etc/xinetd.conf` 中。当接收到连接请求时，中央服务器启动所需服务器的实例。因此，当用户启动
    FTP 会话时，FTP 守护进程将在会话期间一直运行。这也适用于远程服务器上的任何打开连接；要么由守护进程直接回答，或者由远程 `(x)inetd` 在需要时启动服务，并在你退出时将其关闭。


    其他应用程序还包括电子邮件程序、Web 服务器和浏览器、FTP 服务、终端仿真（Telenet）、用于聊天和会议的群组软件、新闻服务等。


    ## 章节总结


    我们查看了：

    * TCP/IP 网络协议和应用。

    * IP 地址以及如何配置你的网络。

    * 网络在 Linux 中的应用。


    ## 练习题


    * 显示你工作站的网络信息，包括 IP 地址、路由、名称服务器。

    * 你如何显示系统的 hosts 文件？

    * 你的 `/etc/hosts` 包含什么？

    * 你如何看到谁连接到了你的系统？


    # 第 7 章：Linux 与云计算


    云可以被定义为抽象的、池化的、并且在网络范围内共享可扩展资源的信息技术环境。它的创建是为了实现云计算。云计算可以被定义为通过互联网按需提供的这些计算资源，如存储、服务器、数据库、分析、网络、处理能力等。


    ###计算提供了灵活的资源并促进了更快的创新和规模经济。该术语用于描述通过互联网向许多用户提供的数据中心。在这里，云计算是一种基于应用程序的软件基础设施，将数据保留通过互联网访问的远程服务器上。


    ## 为什么云计算至关重要？


    云计算的应用非常广泛，以至于你可能在使用它但甚至没有意识到。如果你使用任何在线服务发送邮件、处理文档、流媒体、玩游戏或存储文件，这都是归功于云计算。尽管这项技术仍然较新，但你可以看到它的应用是多么巨大。云计算是人们对
    IT 资源传统观念的重要转变。以下是部分原因。


    ### 1. 成本

    云计算消除了购买计算机基础设施以及建立和运行本地数据中心的资本支出。这些包括无尽的服务器机架、昂贵的软件购买、为这些巨型机器提供电力和冷却的全天候，以及监控和管理基础设施所需的
    IT 专家。计算结果增长得很快。有了云，你只需要在需要时为应用程序付费，而且许多服务是免费的。


    这些服务的使用可以调整以适应你的需求。这种按需付费的模型消除了额外成本，例如内部维护。在某些模型下，你不需要向桌面安装软件，从而消除了购买贵软件的需求。


    ### 2. 可扩展性、敏捷性和灵活性

    与其他计算方法相比，云计算提供了更多样化、灵活和敏捷性。它允许你在任何地方、任何时间获取文件。这对于组织来说有很多优势，因为员工可以从任何地方访问他们的文件。你还可以根据需要扩展你的使用。例如，如果你有一家只有五个员工的小公司，你只需为这五个员工使用的服务付费。如果你增加了人数，你将不得不根据需要购买更多的计算能力。这在过去需要相当的时间，但有了云，只需点击一下按钮一样简单。


    ### 3. 速度

    许多云计算服务提供自助服务和按需服务。这意味着大量的计算资源可以在几分钟内完成配置，通常只需点击鼠标。这给公司和组织带来了很大的灵活性，并减轻了容量规划的压力。


    ### 4. 生产力

    现场数据中心需要大量工作，从设置硬件、修补软件到配置服务器，以及其他 IT 管理任务。云计算消除了对这些任务的需求。对于公司来说，这非常棒，因为它让 IT
    团队能够花更多时间在值得的项目上。


    ### 5. 性能

    最重要的云计算服务运行在全球范围的安全数据中心网络上，这些数据中心定期升级到最新版本的快速高效的计算硬件。这与私人公司数据中心相比提供了多处优势，包括降低网络延迟和更显著的规模经济。


    ### 6. 安全

    许多云提供商提供了广泛的策略、技术和控制，可以增强你的整体安全态势，帮助你的数据、应用程序和基础设施免受潜在威胁。云还提供所有数据的备份。它为你提供了保护数据的方法。


    ### 7. 可靠性

    云计算使得数据备份、灾难恢复和业务连续变得更容易管理且成本更低，因为可以在云提供商网络上的多个冗余站点进行数据镜像。


    ### 8. 对环境友好


