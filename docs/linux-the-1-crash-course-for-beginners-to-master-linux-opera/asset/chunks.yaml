    * They can ensure that cloud data centers are secured from damage and intruders.
    Having strong deterrents such as armed guards, or restricting access and using
    keycards or biometric scans, can help keep the servers and in turn the data safe.

    * To prevent having malicious insiders who want to use client data unlawfully,
    cloud service providers should conduct an extensive background check on their
    employees before hiring them and also have robust measures for dealing with breaches
    or data leaks.

    * Cloud service providers need to understand the legal and regulatory responsibilities
    and regulations they have and ensure that their terms of service reflect this.


    # Chapter Summary


    We have looked at quite a lot of things in this chapter, including:


    * Defining what cloud computing is, its structure, and various models

    * How `Linux` has laid the infrastructure that made cloud computing possible

    * How cloud computing is deployed as a public, private, community, or hybrid cloud

    * How virtualization is the lifeblood of cloud computing and the three kinds of
    virtualization used in cloud computing, namely network, storage, and server virtualization

    * The various security risks clouds are under, such as malicious individuals,
    bot attacks from malicious code that result in `DoS` attacks, data corruption,
    theft, and destruction

    * Some of the ways to mitigate these risks and increase security


