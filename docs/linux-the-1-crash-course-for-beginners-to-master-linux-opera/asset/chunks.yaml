  trans: '


    在 Linux 等 Unix 类系统中中，有三种类型的用户账户：root 账户、系统账户和用户账户。root 账户也称为超级用户，是在安装 Linux 操作系统时自动创建的，对系统拥有完全且不受限制的控制权。换句话说，它对所有操作系统服务具有管理权限。root
    账户可以运行任何命令，该账户通常被称为系统管理员账户。运行特定于系统的特定元素（如邮件或 `sshd` 账户）需要系统账户。这些账户用于特定的功能，任何修改都可能对系统产生负面影响。例如，游戏、邮件和打印等服务拥有各自的系统账户，允许它们与你的计算机进行交互。最后，用户账户为用户或用户组提供了系统的交互式访问。这些账户拥有执行
    Linux 系统中标准任务的必要权限，例如运行程序、在文件和数据库中存储数据等。然而，这些账户没有管理员权限，因此它们无法误删核心操作系统的配置文件。普通用户通常被分配这些账户。


    Unix 还支持组账户概念，将多个账户在逻辑上分组，使其成为组账户的一部分。这种组账户在文件权限和进程管理中起着重要作用。用户可以是多个组的成员。例如，在
    Red Hat 发行版中，当添加用户时，会创建一个私有用户组。这意味着创建了一个以用户命名的用户组，且新用户是该组唯一的成员。


    ## 创建账户


    Linux 系统将用户视为数字，每个用户被分配一个唯一的标识整数，称为用户 ID 或 `UID`。这是因为对于计算机来说，处理数字比处理文本名称更简单、更快。内核之外有一个数据库，为每个用户
    ID 提供文本名称（即用户名）。每个 `UID` 至少被分配到一个组，并指定其中一个作为其登录组。


    所有组都有一个组 ID 或 `GID`，有助于识别用户的登录组。这两组标识符有助于跟踪用户并定义他们可以访问的文件。与用户交互的应用程序和命令通过登录名或组名报告用户数据。然而，操作系统在大多数识别需求中使用
    `UID` 和 `GID`。这些是主要的管理文件：


    1. `etc/passwd` – 存储用户账户和密码数据；该文件包含有关系统账户的最信息

    2. `/etc/shadow` – 包含对应账户的加密密码；注意并非所有系统都支持此文件

    3. `/etc/group` – 该文件包含每个账户的组数据

    4. `/etc/gshadow` – 该文件包含安全的组账户数据


    如上述，`/etc/passwd` 和 `/etc/group` 文件分别定义了用户账户和组账户，每个人都可以访问它们。要创建一个用户，需要将用户信息添加到用户数据库中，并为他们创建一个主目录
    `/home/<username>`，这也是他们登录系统 后的默认目录。需要注意的是，父目录可能会有所不同。你可能需要向用户讲解几件事并为他们设置好环境。大多数发行版都提供了几种用于创建用户账户的应用程序。然而，你也可以使用命令行通过
    `adduser` 和 `useradd` 命令来创建它们。让我们看看如何操作。


    创建新账户的基本语法为 `useradd [options] username`。展开后，它看起来像这样：`useradd -d homedir -g groupname
    -m -s shell -u userid account name`


    * `-d homedir` – 为该账户定义主目录

    * `-g groupname` – 为该账户定义组账户

    * `-m` – 如果主目录不存在则创建它

    * `-s shell` – 为该账户定义默认使用的 shell

    * `-u userid` – 在此处为该账户定义用户 ID

    * `account name` – 在此处输入你想要创建的账户名称


    要使用此命令，你必须拥有 `sudo` 权限或登录 root 账户。`useradd` 命令使用命令行中详细列选项以及 `/etc/default/useradd`
    文件中的默认值创建一个新的用户账户。这些值在每个发行版中都不同；因此运行 `useradd` 命令在每个发行版上可能会显示不同的结果。该命令还会读取 `/etc/login.defs`
    文件，因为它包含影子密码套配置。这些包括创建账户时使用的用户 ID 范围、密码过期策略等。


    输入 `$ sudo useradd username` 并回车。该命令将读取默认并在 `/etc/passwd`、`/etc/shadow`、`/etc/group`
    和 `/etc/gshadow` 文件创建一个条目。例如，要为 Fiona 创建一个新的（普通）用户账户，输入 `$ sudo useradd fiona`
    或 `$ useradd -d /home/fiona -g minor -s /bin/ksh fiona`。


    在执行此命令之前，不要忘记创建 minor 组。


    ## 修改密码


    要使用你的新账户登录，必须使用 `passwd` 命令设置密码。语法如下：`$ sudo passwd username`


    运行此命令后，你将被要求输入并确认密码。确保你设置了强密码以保护你的账户。这里是基本语法和示例。


    ```

    Changing password for user username

    New password:

    Retype new password:

    passwd: all authentication tokens updated successfully

    ```


    以下是示例：


    ```

    $ passwd Fiona

    Changing password for user fiona

    New password:

    Retype new password:

    passwd: all authentication tokens updated successfully

    ```


    ## 修改账户


    你可以通过命令行使用 `usermod` 命令对现有账户进行更改。它采用了与 `useradd` 相同的参数 `-l` 允许你修改账户名称。将账户 `fiona`
    修改为 `fiona23` 并同时修改主目录，你需要输入：`$ usermod -d /home/fiona23 -m -l fiona fiona23`


    ## 删除账户


    你还可以使用 `userdel` 命令删除闲或存在的账户。请注意这是一个危险命令，应该谨慎使用。它使用一个参数 `-r` 来删除账户的邮件文件和主目录。


    例如：`$ userdel -r fiona23`


    如果你想保留主目录以便备份，可以省略 `-r` 选项。


    ## 组账户


    系统中所有的组都位于 `/etc/group` 文件中。然而，默认情况下它们是系统账户特定的，不建议用于普通账户。要创建一个新组，将使用 `groupadd`
    命令，语法如下：`groupadd [-g gid [-o]] [-r] [-f] group name`


    * `-g gid` – 代表组 ID 的数值值

    * `-o` – 该选项允许用户添加具有非唯一 GID 的组

    * `-r` – 标志指示 groupadd 命令添加系统账户

    * `-f` – 如果定义的组已存在，此选项将导致以成功提示退出。配合 `-g` 使用，如果定义的 GID 已存在，则选择其他（唯一的）GID

    * `groupname` – 这是要创建的实际组名


    要修改组，请利用 `groupmod` 命令：`$ groupmod -n new_modified_group_name old_group_name`


    例如：`$ groupmod -n minor minor_2`


    要删除组，你需要 `groupdel` 命令和组名，即：`$ groupdel group_name`。这将仅删除组而不删除文件。


    ## 进程管理


