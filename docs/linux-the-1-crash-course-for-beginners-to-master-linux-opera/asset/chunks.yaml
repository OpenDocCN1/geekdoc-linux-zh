- fmt: '

    This would be no different from using a graphics library to write the application;
    however, X goes a step further. It does not require the application to be on the
    same computer as the server. This is because the protocols used to communicate
    between the client and server can work over a network or even on any inter-process
    communication mechanism that provides a reliable octet-stream. The preferable
    way to do this is by using `TCP/IP` protocols. Here is an example to better illustrate
    how powerful the X system is: you can run a processor-intensive application on
    your Dell computer, run a database monitor on a Solaris server while using an
    email application on a small BSD mail server, and use a visualization program
    on another server to display all this information on your Linux workstation.


    It is clear that the X server is handling the graphics display. Since it runs
    on the actual computer or device the user is using, it’s the server’s responsibility
    to interact with the user. This means reading the input devices and relaying this
    information to the client so it can react appropriately. X also has a library
    named `Xlib` that handles all low-level client-server communications. The client
    has to use functions contained in the library to get tasks done.


    ## The Client/Server Relationship


    X is based off a client-server architecture and is activated as a combination
    of the server and client programs. Here the terms “client” and “server” are used
    to refer to local and remote devices. Below are more client-server terminologies.


    *   `X server` – this refers to a program run on a local host that is connected
    to the user’s display and input devices

    *   `X client` – refers to a program that runs on a remote host and processes
    data while communicating with the `X server`

    *   `Application server` – a program that also runs on a remote host that processes
    data and communicates with application clients

    *   `Application client` – a program run on a local host that is connected to
    the user’s display and input devices


    Modern X servers have the `MIT` shared memory extension and can talk with their
    local clients using local shared memory. This negates the need for network-transparent
    `Xlib` inter-process communication and enables the system to render larger images.


    The X windowing system works like all client-server models where the `X server`
    contains several resources that it provides to the client. As stated earlier,
    the server and the client programs don’t have to be on the same machine because
    X is included in the `TCP/IP` protocol. And since X is more of a protocol than
    a program, computers can still communicate even if they have different architectures.
    For instance, a digital `OSF/I` server can service a Linux and `AIX` client as
    well as either client system providing services to the `OSF/I` server. Similar
    to other network applications, a single machine can serve as a client or server.


    The server interfaces between the application and the hardware, so when you input
    data through an input device, it is responsible for relaying this data to the
    application. This is referred to as an event. When a user presses a key, it causes
    an event that the application must react to. For example, if you click on a particular
    menu item, this event is relayed to the client application, which responds by
    requesting the server to show the pull-down menu. The server then passes this
    info onto the hardware, which shows the menu on a screen. A product of this separation
    of functionality is that one client could display info on several servers.


    To start any process, an `X server` has to be running somewhere either on the
    same machine or network as the client. Some systems have a graphic login that
    starts automatically on booting in the desktop environment. Alternatively, the
    system can begin through the `startx` shell script. The command reads the `.xinitrc`
    and `.xserverrc` files in the home directory and treats them similarly to how
    the shell would manage the `.cshrc` and `.kshrc` files. This is where applications
    such as the terminal window and the window manager are initiated.


    ## Configuring the X Window System


    In the early days of the X windowing system, configuring a display meant that
    you had to have an intensive knowledge of the display’s capabilities and the ability
    to express data about the resolution, position, color depth, font, and more. Since
    the arrival of the Video Electronics Standards Association (`VESA`) and display
    data channel (`DDC`) protocols, which allow a display to communicate these capabilities
    into a graphics card and then to the computer, configuration became more automatic.
    Configuring your hardware devices has also become a lot easier; you plug them
    in and start using them.


    However, as with everything in Linux, there is an underlying configuration that
    you can use. In fact, the `X.org` implementation of X gets this information from
    several sources, the main one being the `xorg.conf` file. It also includes the
    files from the `xorg.conf.d` directory, which is located in `/etc/X11`. You can
    add additional configurations from the command line, desktop environment variables,
    auto-detection, or restoration defaults. However, you do not have to worry too
    much as most distros come with a configuration tool that configures X for you,
    or at least presents it in a less complex way.


    Also, the `Xorg` setting command can automatically detect devices, so this negates
    the need for advanced editing. You might need to edit the directory if your hardware
    or equipment does not show up. Be extremely careful, as making any changes in
    the server can cause your machine to not load or even damage your monitor. There
    is also the possibility of permanently damaging your computer that accompanies
    editing any system file.


    ## Hardware and X


    We know that the `X server` controls the input and output devices, and since new
    hardware is being developed every day, we cannot be very specific about hardware
    compatibility. To help, here are some generalities.


    *   As a rule of thumb, if the device uses a commonplace protocol such as `PS/1`
    or `PS/2`, it should be well supported. However, if it is still new tech, the
    chances are that it might not be supported yet.

    *   For monitors – Linux doesn’t have to be compatible with any specific monitor
    because this is the job of the video card. As long as your graphics card works
    with the monitor, then it should work.

    *   For video cards – the `X server` is determined by the chipset, and naturally,
    a lot of them are supported. However, revisions and newer cards might not be supported
    yet. Newer cards are now coming with better support and optimization, and some
    even have advanced features such as multi-headed displays, 3D, TV-out, `DRI`,
    and more. You have to research well to find out if the card is supported. A full
    list of supported cards can be found online. Also note that open-source drivers
    are developed incrementally, such that a card may work well for basic display
    function, but specialized features come later on in the development cycle. However,
    proprietary driver development differs.

    *   Keyboards – any keyboard should work.

    *   Mice and other pointing devices – most of these devices should be supported,
    including `PS/2`, `bus`, `serial`, `USB`, `optical`, and `infra-red` devices.
    Multi-button and wheeled mice are supported via the `IMPS/2` or other specific
    protocols. However, they may need extra configuration for some applications.


    You can check the hardware compatibility list on your distro’s website to see
    what works with your release.


    X Resources

