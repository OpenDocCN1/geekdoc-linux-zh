    There other network addresses that are reserved for particular purposes such as
    0.0.0.0 and 127.0.0.0\. The first one is called the default route and the latter
    a loopback address. The loopback address is reserved for IP traffic local to your
    host. The address 127.0.0.1 will be given to a special interface on your host,
    referred to as the loopback interface, which acts as a closed circuit. Any packet
    from TCO or UDP will be returned as if it has arrived from another network.


    Network Configuration


    Most Linux distros come with various graphical tools that allow users to easily
    set up a computer in a local network, connect it to an ISP (Internet Service Provider)
    or set it up for wireless access. These tools can be launched from the menu or
    the command line. For instance, RedHat Linux has  redhat-config-network, which
    has both a graphical and a text-mode interface. Check your distribution’s documentation
    for more information about the tools available and their use.


    The tools referred to above edit particular network configuration files using
    several commands. The exact names and location of these files are dependent on
    your distro; however, there are some common network configuration files common
    in all systems.


    /etc/hosts


    The  /etc/hosts file contains the localhost IP address used for interprocess communication.
    Do not remove this line! The file can sometimes contain addresses of additional
    hosts which can be contacted without using a naming service such as the Domain
    Name Server (DNS). You can read more about host files in the man pages, i.e.,
    man hosts.


    Here is an example of a host file:


    # Do not remove the following line, or various programs


    # that require network functionality will fail.


    127.0.0.1     localhost.localdomain   localhost


    223.168.53.10 pin.mylan.com           pin


    223.168.53.11 winxp.mylan.com         winxp


    /etc/resolve.conf


    This file sets up access to a DNS server and contains your domain name and the
    names of servers to contact. You can get more information on the man resolve.conf
    page


    /etc/nsswitch.conf


    This file defines the order in which different name services will be contacted.
    The DNS needs to appear in the host’s line if you plan to connect to the Internet.
    You can get more information on its man page.


    The  ip Command


    This command is used to assign IP addresses to interfaces, set up routes to networks
    including the Internet, display TCP/IP configurations, etc. It is important to
    note that for two network interfaces, even on a system with only one network interface
    card, “lo” is the local loop, used for internal network communication; “eth0”
    is a common name for a real interface. Don’t ever change the local loop configuration
    as it will lead to malfunctioning.


    Wireless interfaces are normally defined as “wlan0” and modem interfaces as “ppp0”,
    but there might be other names as well. For IP addresses, marked with “inet”,
    the local loop always has 127.0.0.1 and the physical interface can have any other
    sequence. The address of your hardware interface, which might be needed as part
    of the authentication method to connect to a network, is labeled with “ether”.
    The local loop contains 6 pairs of all zeros, the physical loop has 6 pairs of
    hexadecimal characters, of which the first 3 pairs are distribution vendor-specific.


    Using  netstat


    This command, an alternative to  ip, is used to check the host network configuration.
    It has a lot of options and is useful in any Unix system. You can display the
    routing information by using the  –nr option of the  netstat command.


    Other commands you can use include:


    *   /bin/hostname – shows the name of current host.


    *   /bin/ping – sends  ICMP ECHO_REQUEST packets to network hosts.


    *   /etc/ftpaccess – FTP access configuration file


    *   /etc/ftphosts – FTP individual host access file


    *   /etc/ftpusers – lists users who have been automatically denied FTP access


    *   /etc/gated – gateway routing daemon.


    *   /etc/hosts – lists the hosts on network.


    *   /etc/hosts.equiv – lists trusted hosts.


    *   /etc/http/conf/* – shows HTTP configuration files


    *   /etc/inetd.conf – shows the inetd configuration file.'
