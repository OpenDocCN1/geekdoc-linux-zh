    此命令在文件或多个文件中搜索指定模式的行。其语法为：`$grep pattern file(s)`。`grep` 一词源于 `g/re/p`，代表“全局搜索正则表达式并打印所有包含该表达式的行”。正则表达式由纯文本和/或用于匹配模式的特殊字符组成。`grep`
    最基本的用法是搜索包含单个单词的模式。它可以被添加到管道中，以便只输出包含特定字符串的输入文件。如果它没有要读取的文件名，`grep` 将读取其标准输入。这也是所有过滤程序的工作方式。


    你还可以配合 `grep` 使用以下几个选项：


    - `-v` – 显示所有不匹配模式的行

    - `-n` – 显示匹配的行及其行号

    - `-l` – （字母 “l”） 仅显示包含匹配行的文件名

    - `-c` – 显示匹配的行数

    - `-i` – 忽略区分大写或小写


    ### sort 命令


    此命令按字母顺序或数字顺序对文本行进行排序。例如：


    - `$sort cars`

    - Alpha Romeo

    - Chevy

    - Ford

    - Isuzu

    - Mercedes

    - `$`


    然而，有几个选项可以控制这种排序。它们包括：


    - `-n` – 按数字对行进行排序并忽略空格和制表符

    - `-r` – 反转排序顺序

    - `-f` – 将大和小小写行合并排序

    - `+x` – 排序时忽略前 x 个字段


    你可以将多个命令链接到管道中，例如 `ls -l | grep pattern file | sort +4n`。


    ### 本章总结


    在本章中，我们学习了以下内容：


    - Linux Shell 以及我们已经知道的知识，例如它的各种组件，并深入探讨了这些元素。

    - 环境变量包含了 shell 运行所需的一切。环境变量的一个示例是 `PATH`。

    - 我们还查看了搜索路径、绝对路径和相对路径。

    - Linux 系统中的三种访问模式：读、写和执行。这些模式也代表用户对文件或目录允许执行的操作的权限。

    - 还有许多对应本章讨论的所有操作的命令，以及它们的使用示例。


    ### 练习


    #### 练习 1


    a) 运行 `echo $SHELL` 来找出你正在使用的哪种 Shell。

    b) 你的 shell 使用哪些 `init` 文件？它们是在什么时候使用的？

    c) 尝试这些命令并注意它们的区别：

    - `ls`

    - `ls –l`

    - `ls *`

    - `ls –ld`

    d) 列出名称中包含数字 4 的目录内容。


    #### 练习 2


    a) 使用 `echo` 命令显示你当前 `PATH` 中的内容（记住在使用它时需要命名为 `$PATH`）。在命令执行时，哪些目录正在被搜索？

    b) 输入以下命令并观察发生了什么：

    - `cd blah`

    - `cd ..` 记住注意“cd”和“..”之间的空格！

    - `pwd`

    c) 使用 `ls` 命令详细列出目录内容。你看到了什么，你认为这些可能是什么？使用 `pwd` 命令检查。

    d) 输入 `cd` 命令并重复该步骤两次，观察发生的变化。

    e) 尝试 `cd root` 并观察发生了什么。检查你有权限访问哪些目录？

    f) 重复输入 `cd` 命令步骤，还有其他方法可以进入你的目录吗？

    g) 阅读 `man intro`、`man ls` 和 `info passwd`。

    h) 输入相关的 `pwd` 命令。

    i) 对 `cd` 尝试 `man` 或 `info`。哪一个显示了更多关于 `cd` 的信息？


    # 第 4 章


    ## 系统管理


    系统管理涵盖许多领域，因此很难精确地定义它是什么，因为计算机的所有方面都属于系统管理的范畴。这包括软件、硬件、网络，甚至包括编程。


    系统管理允许用户更好地理解系统并从而更好地利用它，从启动系统、创建和管理账户、安装软件、配置硬件、设备管理、系统自动化、备份等。你可以看到，系统管理员身兼多职。你就是自己系统的管理员，这些责任都落在了你身上。


    在本章中，我们将检查一些系统管理任务。我们不会深入细节，但将涵盖基础知识——即系统管理的各个领域——以便你能够使用手头的程序和工具。


    ### 系统启动与关机


    启动 Linux 系统非常简单，只需按下电源按钮并观察系统启动。几乎所有用户和许多系统管理员都不知道系统启动时发生了什么。从开启电源到出现登录提示，必须发生很多事情。了解启动过程中发生了什么是非常用的，因为如果系统没有按预期启动，你可以很容易判断哪里出了问题。启动系统可以像开启并让它启动一样简单。然而，你可以通过更改启动过程来改变这种行为。在关闭系统时，这里有一些需要记住的重要事项。


    Linux 与其他操作系统不同，尽管人们做了努力让它在表面上看起来与其相似，但它们仍然存在差异，特别是在关闭系统时。在其他系统中，你总是清楚正在发生什么，并且对一切都有完全的控制权。你可以在完成工作后决定关闭计算机。然而，由于
    Linux 是多用户系统，可能有其他用户正在工作或使用其资源，因此不建议直接关闭机器。除了打扰其他用户之外，取决于关闭时运行的内容，你可能会损坏系统。


    ### 用户账户管理


    当许多人使用工作站等设备时，区分用户是非常关重要的。例如，这有助于保持个人文件的私密性，无论它是被同时使用，还是一次只有一个用户使用（如在微型计算机中）。每个用户都被分配一个唯一的标识符，即用户名，他们用它登录。

    '
- fmt: "\nIn Unix-like systems such as Linux, there are three types of user accounts:\
    \ the root, system, and user accounts. The root account, also called the super\
    \ user, is automatically created when you install your Linux OS and has complete,\
    \ unrestricted control over the system. In other words, it has administrative\
    \ privileges for all the operating system services. A root account can run any\
    \ commands, and this account is often referred to as the system administrator\
    \ account. System accounts are required for the running of system-specific elements\
    \ such as mail or the `sshd` accounts. These accounts are required for particular\
    \ functions, and any modifications could affect the system badly. For instance,\
    \ services such as games, mail, and printing have individual system accounts that\
    \ allow them to interact with your computer. Finally, user accounts give users\
    \ or groups of them interactive access to the system. These accounts have the\
    \ necessary privileges to undertake standard tasks in a Linux system, such as\
    \ run programs, store data in files and databases, etc. These accounts, however,\
    \ do not have admin privileges, so they cannot, for example, mistakenly delete\
    \ core operating system configuration files. General users are usually assigned\
    \ these accounts.\n\nUnix also supports the group account concept, where several\
    \ accounts are logically grouped, making them part of the group account. This\
    \ group account plays an important role in file permissions and process management.\
    \ Users can be members of multiple groups. For instance, in the Red Hat Enterprise\
    \ distro, when a user is added, a private user group is created. This means that\
    \ a user group named after the user has been created and the new user is the only\
    \ member.\n\n## Creating an Account\n\nThe Linux system views users as numerals,\
    \ and each one is assigned a unique identifying integer known as the user ID or\
    \ `UID`. This is because, for a computer, numbers are easier and faster to process\
    \ compared to textual names. There is a database outside the kernel that gives\
    \ the textual name, the username, to every user ID. Every `UID` is assigned at\
    \ least one group, with one designated as their login group.\n\nAll groups have\
    \ a group ID or `GID`, which helps identify the user’s login group. These two\
    \ sets of identification help keep track of the user and define what files they\
    \ can access. Applications and commands that engage with users report user data\
    \ by logname or group name. However, the OS uses the `UID` and `GID` for most\
    \ identification requirements. These are the primary administrative files:\n\n\
    1. `etc/passwd` – stores the user account and password data; this file contains\
    \ the most information about accounts on the system\n2. `/etc/shadow` – contains\
    \ the encrypted password of the corresponding account; note that not all the systems\
    \ support this file\n3. `/etc/group` – this file has the group’s data for every\
    \ account\n4. `/etc/gshadow` – this file has secure group account data\n\nAs stated\
    \ above, the `/etc/passwd` and `/etc/group` files define both the user and group\
    \ accounts, respectively, and everyone has access to them. To create a user, information\
    \ about the user needs to be added to the user database and make a home directory\
    \ for them, `/home/<username>`, which is also their default directory once they\
    \ log into the system. It is important to note that the parent directory might\
    \ differ. You might need to teach the user about a few things and set up the environment\
    \ for them. There are several applications for creating user accounts available\
    \ with most distributions. However, you can also use the command line to create\
    \ them with the `adduser` and `useradd` commands. Let’s see how to go about it.\n\
    \nThe basic syntax for creating a new account is `useradd [options] username`.\
    \ When expanded it looks something like this: `useradd -d homedir -g groupname\
    \ -m -s shell -u userid account name`\n\n* `-d homedir` – defines the home directory\
    \ for the account\n* `-g groupname` – defines the group account for the account\n\
    * `-m` – creates the home directory if it is non-existent\n* `-s shell` – defines\
    \ the default shell to use for this account\n* `-u userid` – this is where you\
    \ define a user id for the account\n* `account name` - this is where you input\
    \ your preferred account name to be created\n\nTo use this command, you must have\
    \ `sudo` access or be logged into a root account. The `useradd` command makes\
    \ a new user account using the options detailed on the command line plus the defaults\
    \ in the `/etc/default/useradd` file. These values are different in each distro;\
    \ thus, running the `useradd` command might display varying results on each distro.\
    \ The command also reads the `/etc/login.defs` file because it contains the shadow\
    \ password suite configuration. These include user ID ranges used in creating\
    \ accounts, password expiration policies, etc.\n\nType in `$ sudo useradd username`\
    \ and hit enter. The command will read the default file and create an entry in\
    \ the `/etc/passwd`, `/etc/shadow`, `/etc/group` and `/etc/gshadow` files. So\
    \ for example, to create a new (ordinary) user account for Fiona, type in `$ sudo\
    \ useradd fiona`, or `$ useradd -d /home/fiona -g minor -s /bin/ksh fiona`. \n\
    \nDon’t forget to create the minor group before issuing this command.\n\n## Changing\
    \ Passwords\n\nTo log in using your new account, a password must be set using\
    \ the `passwd` command. Here is the syntax: `$ sudo passwd username`\n\nAfter\
    \ running this command, you will be requested to input the password and confirm\
