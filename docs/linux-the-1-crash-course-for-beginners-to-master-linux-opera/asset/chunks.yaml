  trans: '

    如今，Linux 可以在线或从本地零售商处获得。用户现在甚至可以购买预装 Linux 发行版的电脑。在早期，你必须是专家或在计算机领域拥有深厚的背景才能使用
    Linux，但 RedHat、Mandriva 和 SuSE 等公司的出现，提供了普通大众都可以使用的 Linux 版本。它们整合了许多组件，例如由 Linux
    社区开发的图形用户界面（GUI），以简化程序和服务的管理。随着这些用户友好界面以及与 MS Office 兼容程序（如文字处理程序）的加入，Linux 正在迅速成为日常家庭或办公使用的可接受选择。它的应用范围远不仅限于工作站或服务器操作系统，它还运行在手机、平板电脑甚至智能手表等小型设备上。这使得
    Linux 成为唯一与如此广泛的硬件交互的操作系统。


    在本节中，我们将查看如何选择并将 Linux 安装到你的电脑上。我们还将介绍如何设置系统、排排除故障，甚至是更新或升级到新的 Linux 版本。


    # 选择 Linux 发行版


    如上所述，最初使用 Linux 相当困难。许多人选择不学习它，因为虽然系统的各个方面都有文档，但这些解释对于新手来说技术性太强，难以理解，从而挫伤了他们学习系统的兴趣。这种认识促使
    Linux 社区改变了系统的可用性，使其对更多非技术人员更有吸引力。


    这为 Linux 发行版的开发铺平了道路，这些发行版不需要你具备深入的 Linux 知识或让系统完全遵循你的指令。现在，你可以登录并启动所有需要的应用程序，而无需输入任何命令，并在需要时仍具有访问系统内核的能力。这种系统允许新用户熟悉系统，而不是被迫通过硬核的方法来学习。


    那么什么是 Linux 发行版呢？Linux 发行版是由不同的程序员、组织或公司创建的许多操作系统，根据其需求进行单独量身定制。它们将 Linux 内核与其他软件（如
    GNU 核心实用程序、图形服务器、桌面环境、程序等）相结合。每个发行版都有这些元素的不同组合，因为它们是为了特定的目的和满足其目标用户的需求而构建的。


    现在有越来越多的 Linux 发行版面向桌面用户，而这些用户通常被认为最可能不知道系统如何工作。开发人员正努力创建精美的桌面，或者至少让它们看起来像你以前的
    Windows 或 Mac 工作站以及兼容程序。有很多网站提供了截图，可以向你展示安装 Linux 后电脑将呈现的样式。大多数这些发行版都可以免费下载并刻录到
    CD 或 USB 中，或者安装在任何你机器上。以下是一些最流行的 Linux 发行版：


    * Linux Mint

    * Manjaro

    * Debian

    * Ubuntu

    * RedHat Enterprise

    * Fedora

    * CentOS

    * Opensuse


    有很多 Linux 发行版可用，这意味着你一定能找到适合你需要的，不需要成为专家就能获得合适的版本。然而，这使得选择 Linux 发行版变成了一项巨大的任务。那么你如何选择呢？


    你将使用的发行版取决于你如何回答以下问题：你的计算机技能如何？你倾向于现代还是传统的桌面界面？你是将 Linux 用于服务器还是桌面？对于具备基本计算机技能的人，你会想要坚持对新手友好的发行版，例如
    Linux Mint、Ubuntu 等。然而，如果你的技能范围超出这个平均水平，可以选择 Fedora 或 Debian 等发行版。如果你已经精通计算机和系统管理，可以选择
    Gentoo，或者接受挑战从零构建自己的 Linux 发行版。


    对于仅限服务器的发行版，你必须选择需要桌面界面还是只想使用命令行。仅限命令行的服务器发行版没有图形负担，但你需要对 Linux 命令行有良好的理解。你也可以通过命令行在服务器发行版安装图形用户界面包；例如，你可以通过输入获取
    ubuntu-desktop

    ```bash

    sudo apt-get install ubuntu-desktop

    ```

    此外，在选择服务器发行版时，你是想要一个下载时就提供所有所需内容的，还是想要适配桌面发行版来满足你的需求？


    在选择 Linux 发行版时，考虑硬件至关重要。由于所有发行版都有基于 Linux 内核的相似基础包，你应该关注的是你想要的发行版是否运行在你的硬件上。例如，LinuxPPC
    是为 Apple 和其他 PowerPC 设计的，不支持基于 x86 的设备。它可以运行在新的 Mac 上，但你不能在旧机器上使用它，因为该技术已经过时。


    # 硬件清单


    你可以在任何电脑上安装 Linux；但取决于你安装的是哪种 Linux 发行版以及你计划如何使用电脑。以下是运行 Linux 发行版机器的基本要求。


    ### 1. CPU


    这是电脑的大脑，定义了你的操作系统运行的速度。由于 Linux 最初设计为在 Intel 386 上运行，它几乎可以运行在任何 CPU 上。你还可以在 Mac
    甚至基于 ARM 的树莓派上运行 Linux。然而，Linux 发行版在 x64（64 位）Intel 或 AMD PPC (G3-G5) 以及 AMD 处理器上非常流行，今天它们正针对这些设备积极开发。CPU
    的最低要求是 2GHz Intel Pentium 4 或双处理器的 AMD K6。这可以运行操作系统，但桌面体验将受到限制。如果可以，请获取一台规格更好或更高的电脑。


    ### 2. RAM（内存）


    大多数发行版需要约 2 GB 内存来运行任何图形界面。然而，如果你想将其用于非图形用途（如网页托管），你甚至可以用少于 10 MB 的内存来运行 Linux。为了获得更好的性能，最低内存应在
    512 MB 以上。


    ### 3. 硬盘


    与 Linux 的所有事物一样，即使在最小的配置下也可以。某些发行版（如 Puppy Linux）可以使用几百兆内存运行。然而，对于标准的桌面安装，你的硬盘需要大约
    20–40 GB 的空闲空间。这些空间足够让你深入探索操作系统。如果你计划将整个系统转换为 Linux，那么空间越大越好。新的发行版现在开箱支持 RAID
    和 SATA 等新驱动技术，Linux 服务器发行版还支持企业级光纤磁盘阵列。


    通常，Windows 占据电脑 100% 的空间，因此要安装 Linux，你必须对硬盘重新分区并腾出空间。新的发行版通过利用 HDD 的空闲空间让分区变得更加容易。在调整分区时，尽量给
    Linux 分配尽可能的空间。不要忘记为 SWAP 分配一些空间。SWAP 是当机器内存填充时转而使用此磁盘空间的区域。这对于内存有限的情况有用，但在高内存配置上，你可能不需要它。如果你有额外的硬盘，也可以在另一个硬盘上设置
    Linux 操作系统。这样在你调整分区时，就不会弄乱系统文件。


    ### 4. 显卡或图形适配器


