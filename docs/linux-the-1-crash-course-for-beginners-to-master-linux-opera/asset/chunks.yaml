    * `/etc/named.boot` – shows the server configuration file of a named server

    * `/usr/bin/rlogin` – launches the remote login program.

    * `/usr/bin/route` – lets the user manually manipulate routing tables.

    * `/usr/bin/rwho` – shows who is logged in on local network.

    * `/usr/sbin/in.rlogind` – remote login rlogin daemon

    * `/usr/sbin/in.rshd` – remote shell rsh daemon

    * `/usr/sbin/in.telnetq` – the telnet Daemon

    * `/usr/sbin/in.tftpd` – the trivial FTP TFTP Daemon

    * `/usr/sbin/in.fingerd` – the finger daemon

    * `/usr/sbin/traceroute` – traces packet routes to remote computers.


    # Networking Applications


    Linux is a great platform for networking services and here are some of the many
    applications.


    ## Server Types


    You can provide a service to users in two ways: by letting the service run in
    standalone mode or make it dependent on other services for activation.


    Standalone mode is mostly for those network services that are used frequently
    and continuously. They are independent programs that start up at system boot time,
    and they await requests on particular connection points or ports they are configured
    to listen to. When a request comes through, it is processed and the program continues
    listening for the next request. A good example is a web server. It should be available
    all the time, and if there are too many requests, it could create more listening
    instances to serve users simultaneously.


    Program-service activation mode is for services that don’t have server processes
    running in the background. The Internet Daemon (`inetd`) listens in their place
    and calls them up when needed, because starting all the processes you would need
    in a session would lead to a waste of resources and time. These services include
    FTP, Samba, Telenet, the secure copy or finger service, and more. The super server,
    Internet Daemon, is initialized at system boot and is implemented in two ways,
    `inetd` and `xinetd`. The latter is called the Extended Internet Daemon service,
    and one of the two is always running in the system.


    The services the `inetd` daemon is responsible for are listed in its configuration
    file `/etc/inetd.conf` and `/etc/xinetd.conf`. When a connection request is received,
    the central server starts an instance of the required server. Thus when a user
    starts an FTP session, for instance, an FTP daemon will be running for the duration
    of the session. This also applies to any open connection on remote servers; either
    a daemon answers directly or a remote `(x)inetd` launches the service when required
    and kills it when you quit.


    Other applications include email programs, web servers and browsers, FTP services,
    terminal emulation (Telenet), groupware applications for chatting and conferencing,
    news services, and so forth.


    ## Chapter Summary


    We looked at:

    * The TCP/IP network protocol and application.

    * IP addressing and how to configure your network.

    * Applications of networking in Linux.


    ## Exercises


    * Display the network information of your workstation that is the IP address,
    routes, name servers.

    * How do you display your system’s hosts file?

    * What does your `/etc/hosts` contain?

    * How can you see who connected to your system?


    # CHAPTER 7: Linux and Cloud Computing


    Clouds can be defined as information technology environments that are abstract,
    pooled, and that share scalable resources across a network. They are created to
    enable cloud computing. Cloud computing can then be defined as the on-demand availability
    of these computing resources such as storage, servers, databases, analytics, networking,
    processing power, and more, over the Internet. Cloud computing offers flexible
    resources and fosters faster innovation and economies of scale. The term is used
    to describe data centers that are available to many users over the Internet. Here,
    cloud computing is an application-based software infrastructure that keeps data
    on remote servers that are accessed through the Internet.


    ## Why Is Cloud Computing Critical?


    The applications of cloud computing are so vast that you could be using it and
    not even realize it. If you use any online services to send mail, work on documents,
    stream media, play games, or store files, it is all thanks to cloud computing.
    Even though the technology is still relatively new, you can see how vast the applications
    are. Cloud computing is a significant shift from the traditional way everyone
    thought about IT resources. Here are some of the reasons why.


    ### 1. Cost

    Cloud computing has eliminated the capital expense of purchasing computer infrastructure
    and setting up and operating on-premise data centers. These include the endless
    server racks, expensive software purchases, round-the-clock electricity to power
    and cool these giant machines, and the IT experts required to monitor and manage
    the infrastructure. The math adds up quickly. With the cloud, you only pay for
    applications when you need them, and many are free.


    The usage of these services can be adjusted to fit your needs. This pay-per-use
    model eliminates extra costs, such as in-house maintenance. With certain models
    you don’t need to install software to your desktop, eliminating the need to purchase
    pricey software.


    ### 2. Scalability, agility, and flexibility

    Cloud computing offers more diversity, flexibility, and agility compared to other
    computing methods. It allows you to obtain your files from any location at any
    time. This can have a lot of advantages for organizations since employees can
    access their files from anywhere. You can also scale your usage depending on your
    needs. For instance, if you have a small company with only five employees, you
    pay for the services those five employees use. If you were to add more, you would
    then have to purchase more computing power depending on your needs. This would
    have taken quite some time in the past, but with the cloud, it is as easy as clicking
    a button.


    ### 3. Speed

    Many cloud computing services are provided self-service and on-demand. This means
    that vast amounts of computing resources can be provisioned in minutes, typically
    with just a few mouse clicks. This gives companies and organizations a lot of
    flexibility and takes pressure off capacity planning.


    ### 4. Productivity

    On-site data centers need a lot of work, from setting up the hardware, to patching
    the software, to configuring the servers, among other IT management chores. Cloud
    computing eliminates the need for these tasks. For companies, this is great because
    it frees IT teams to spend more time on worthwhile projects.


    ### 5. Performance

    The most important cloud computing services run on a worldwide network of secure
    data centers, which are regularly upgraded to the latest version of fast and efficient
    computing hardware. This provides several benefits over a private corporate data
    center, including reduced network latency for applications and more significant
    economies of scale.


    ### 6. Security

    Many cloud providers offer a broad set of policies, technologies, and controls
    that strengthen your security posture overall, helping protect your data, apps,
    and infrastructure from potential threats. The cloud also offers backups of all
    your data. It provides you with a way to safeguard your data.


    ### 7. Reliability

    Cloud computing makes data backup, disaster recovery, and business continuity
    more manageable and less expensive because data can be mirrored at multiple redundant
    sites on the cloud provider’s network.


    ### 8. Good for the environment

