    只要你的电脑支持，任何图形适配器都能与 Linux 工作。最低配置是拥有一个支持 1024 x 768 分辨的标准显卡。理想情况下，带有约 256 MB 显存的
    3D 加速显卡效果更好。


    ## 安装准备工作


    一旦你选择了想要安装的发行版，就可以从各自的网站免费下载 `.iso` 文件，并查看该发行版的推荐系统要求列表。尽管许多人认为并非如此，但安装 Linux
    非常简单，因为大多数版本都有所谓的“实盘发行版”（live distribution）。这意味着操作系统将从任何设备（无论是 CD/DVD、USB 还是外部驱动）运行，而不会对你的硬盘进行任何更改。这允许你可以在不提交安装的情况下体验完整的功能。一旦你习惯了它，就可以双击安装按钮并按照向导提示来决定是否安装。


    你有多种方法可以安装你的 Linux 操作系统：


    ### 1. 使用 USB 盘

    你可以通过可启动的 USB 盘将所需的 Linux 发行版安装到电脑上。在将操作系统文件下载到电脑后，下载一个通用的 USB 安装程序使你的 USB 盘变为可启动状态。然后按照提示将
    Linux 安装到 USB 驱动器上。操作系统安装并配置完成后，将弹出一个小窗口，告知你的 USB 盘已准备就绪。


    ### 2. 使用光光盘

    就像 USB 驱动器一样，下载 `.iso` 文件并将其刻录到 CD 中，然后用它启动 Linux 下的电脑。


    ### 3. 使用虚拟机

    这是安装 Linux 的流行方法。虚拟化安装允许你在带有现有操作系统的机器上运行 Linux 操作系统。例如，你可以在同一台机器上同时运行 Windows
    和 Linux。如 `Oracle VM` 等虚拟机软件可以按照以下简单步骤安装 Linux 发行版。首先，下载并安装适合你机器的虚拟机软件。设置完成后，下载操作系统文件并创建一个虚拟机来安装操作系统。按照提示设置
    Linux 操作系统将运行的虚拟机。完成后，你可以选择安装操作系统，也可以在不安装的情况下运行它。安装过程中还有额外的步骤，例如设置用户账户，我们将在稍后进行介绍。


    ## 系统设置


    在安装过程中，你配置了一些基础项，例如选择你偏好的语言、键盘布局和时区。下一步提示你创建一个用户名和密码，并提供其他登录信息（如你的姓名和计算机名称），以启用
    Linux 发行版的安装。这是你登录账户并执行任何管理任务时所需的密码。在弹出框中，你还可以选择让系统自动登录，还是在每次登录时要求输入密码。如果你计划共享电脑，这一步至关重要。它起到了额外的保护作用，防止任何用户进行未经授权的更改。


    安装完成后，你的电脑将重启并显示其桌面环境。此时，在系统重启后你必须进行硬件检查。大多数硬件在安装了任何 Linux 发行版后都可以开箱即用，尽管你可能需要下载额外的驱动程序以确保一切正常运行。这是因为某些硬件（如显卡）需要专有驱动才能工作。有一个开源驱动可以兼容该显卡，但为了发挥最大的性能，你必须从制造商处获取驱动。


    ## 命令行界面


    Linux 命令行是一个允许你与计算机通信的文本接口，它完全基于文本输入和输出。命令是给计算机的指令，告诉它要做什么。通常通过在命令行中输入它们并按回车键来实现。全文本显示模式（也称为命令行界面）由控制台和一个显示命令提示符的终端窗口组成。命令提示符或
    shell 提示符是一个短的、自动生成的文本消息，出现在命令行开头。命令提示符或 shell 提示符是出现在命令行开头的自动生成的短文本消息。


    ```

    user@home $

    ```

