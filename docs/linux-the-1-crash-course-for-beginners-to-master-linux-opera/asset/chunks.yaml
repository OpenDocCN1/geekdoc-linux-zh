    如前所述，进程使用信号来终止。然而，有很多信号可以用于控制进程的行为。例如，你可以使用 `kill` 命令向进程发送信号。大多数信号由系统内部使用，或由编程人员在编写代码时使用。以下是一些示例：


    *   `SIGTERM` – 信号号 15 – 信号进程以有序的方式终止

    *   `SIGINT` – 信号号 2 – 中断进程；进程可以选择忽略此信号

    *   `SIGKILL` – 信号号 9 – 中断进程；此信号无法被忽略

    *   `SIGHUP` – 信号号 1 – 用于守护进程（daemons）；它指示它们重新读取配置文件


    你可以通过输入 `kill –l` 命令获取完整的信号列表。该列表根据你的发行版而异。


    ## SUID 和 SGID


    `setuid` 和 `setgid` 访问模式允许普通用户执行他们并不具备的权限和访问权限的任务。例如，在许多系统中，`write` 命令属于 `tty`
    组。该组还拥有所有终端和伪终端文件。因此，`write` 命令具有 `setgid` 访问权限，允许用户向另一个用户的终端或窗口写入消息，而他们通常没有访问权限。当用户写入时，在命令执行期间，他们的
    `EUID` 被设置为拥有可执行文件（`/usr/bin/write`）的组 ID。


    `SUID` 和 `SGID` 也被打印子系统、邮件程序和其他系统设施利用，但它们容易导致安全风险。`setuid` 几乎总是将用户 ID 设置为 `root`；你可以看到这对系统构成的危险。程序和用户可以找到执行额外未经授权操作的方法，而
    `setuid` 在激活时会在进程结束后仍保留这种访问权限。应该避免使用 `setuid`，因为它比 `setgid` 构成了更大的安全风险。通过精心设计的组，你可以使用
    `setgid` 执行任何任务。然而，这并不意味着它们完全没有风险的。


    ## 系统性能监控


    系统管理员的另一个重要职责是监控和管理系统性能。Linux 提供了帮助这些目的工具，这些工具还提供了如何诊断和修复系统性能错误的指南。有需要监控和管理的主要资源，包括
    `CPU`、内存、硬盘、通信线路、`I/O time`、网络时间和以及应用程序。


    性能组件被用于衡量系统运行情况。以下是构成系统时间的五个主要组件。


    ### 1. 用户态 CPU


    这表示 `CPU` 在用户态下运行用户应用程序所花费的实际时间。它包含了执行用户启动的进程（如库调用）所花费的时间，但不包括在内核中代表进程运行的时间。除内核以外的任何事物使用的
    `CPU` 时间都被标记为用户时间，即使用户没有启动它。例如，如果用户进程需要访问某些硬件，它必须通过内核提交请求，这意味着这将计为系统态时间。


    ### 2. 系统态 CPU


    这显示了内核占用了多少 `CPU` 时间。内核处理所有低级任务，如内存分配、操作系统进程之间的通信、运行设备驱动、管理文件系统以及与硬件交互。这意味着所有的
    `I/O` 程都需要内核服务。程序员可以在会话期间阻塞任何 `I/O` 传输来更改此值。


    ### 3. I/O 时间和网络时间


    这表示传输数据和处理来自各种进程的 `I/O` 请求所花费的时间。`iowait` 是 `I/O time` 的子类，显示了等待 I/O 操作（如对磁盘的读取或写入）所花费的时间。当处理器等待文件打开时，花费的时间被标记为
    `iowait`。高 `iowait` 时间可能表明系统中存在处理器之外的问题。


    ### 4. 虚拟内存性能


    这包括上下文切换和交换花费的时间。


    ### 5. 应用程序


    这是运行其他应用程序花费的时间。即系统未处理此应用程序，因为另一个应用程序正在使用 `CPU`。


    ## 性能工具


    记得之前提到的帮助用户测量、监控、微调和管理系统性能的工具吗？它们包括：


    *   `nice/renice` – 以修改后的调度优先级运行进程

    *   `netstat` – 打印网络连接、路由表、接口统计、掩码连接和组播成员

    *   `time` – 帮助用户为简单命令计时或评估资源使用

    *   `uptime` – 显示系统平均负载

    *   `ps` – 报告当前进程的快照

    *   `vmstat` – 报告虚拟内存统计信息

    *   `gprof` – 显示用户的调用图分析数据

    *   `prof` – 方便用户进程分析

    *   `top` – 显示所有系统任务


    你可以使用 `Manpage Help` 来获取这些及更多 Linux 命令的语法。


    ## 系统日志


    Linux 有一个极其灵活且强大的日志系统，允许用户记录或记录几乎任何内容，并操作这些记录以获取他们需要的信息。这是通过 `syslog` 设施实现的。需要记录数据的程序会将这些信息发送到
    `syslog` 设施。`syslog` 是一个主机可配置的统一系统日志设施，它使用运行 `/etc/syslogd` 或 `/etc/syslog` 文件的中央系统日志进程。


    它的工作原理是程序将日志条目发送到 `syslogd`，然后由其创建 `/etc/syslogd.conf` 或 `/etc/syslog` 配置。当找到匹配时，会将日志数据写入目标文档。以下是你应该了解的一些基础
    `syslog` 术语。


    第一个是 `facility`（设施）。它是用于定义提供日志消息程序或进程的标识符。可以是 `kernel`、`mail`、`FTP` 等。接下来是 `priority`（优先级），它是日志消息重要性的指示。`syslog`
    内部的优先级级别被定义为调试或错误报告等事件的指南。`selector`（选择器）指的是一个或多个设施和级别的组合。最后一个术语是 `action`（动作）。这当输入消息匹配选择器时发生的情况。它们可以是写入日志文件、向控制台回显消息、将日志消息发送到另一个
    syslog 服务器等。


    `syslog` 设施是用于选择器的程序，例如 `auth`，它显示任何与请求用户名和密码相关的活动，如 `getty`、`login` 等。`console`
    捕捉指向系统控制的消息。`cron` 显示来自 `cron` 调度器的消息。`FTP` 显示 `FTP` 守护进程的消息。有很多设施，并且并非在所有 Linux
    发行版中都存在。


    `syslog` 优先级显示了输入日志消息的重要性。它们包括：


    *   `emerg` – 紧急情况，例如所有用户都会通知的系统崩溃

    *   `alert` – 消息情况需要立即处理

    *   `crit` – 显示消息情况非常关键，例如硬件错误

    *   `err` – 显示普通错误消息

    *   `warning` – 显示警告消息

    *   `notice` – 显示尽管不是错误但需要特殊处理的情况

    *   `info` – 用于信息消息

    *   `debug` – 用于调试消息

    *   `none` – 用于不需要记录的伪级别消息


    这些设施和它们的优先级帮助用户识别系统日志，并知道在哪里找到他们需要的信息。系统日志记录器根据选择器优先级级别决定保留或丢弃。


    ## 总结


    *   你学习了什么是系统管理以及它包含的内容。


