  trans: '

    选择密钥类型后，按回车键。你也可以按回车键选择默认选项。系统会提示你输入以位为单位的密钥大小，例如 `128`、`160`、`256` 等。按回车键接受你的选择，或者留空按回车键使用
    `2048` 的默认值。如果你想使用默认设置，请一直按回车键。


    当被问是否真的不想让密钥过期时，按 `Y` 确认，随后你会被要求输入姓名、电子邮件地址以及一条将密钥与你关联的注释。按回车键。当询问是否要更改或确认这些数据时，检查一遍后按回车键。你会被要求输入用于保护私钥的密码。密码应该同时包含大写字母、小写字母、数字甚至标点符号。越长越好，然后按回车键。设置密码时要小心，因为你需要能够轻松记住它。


    ## 密钥交换


    为了进行安全通信，你必须向他人提供你的公钥并获取他们的公钥。GPG 将你的密钥存储在密钥环中，这是一个包含这些密钥的文件。要列出密钥环中的密钥，输入 `gpg
    --list-keys`。要发送你的公钥，你必须先将其导出到文件中。最好的记录方式是使用如下所示的 ASCII 护甲格式：


    ```

    gpg --armor --export spadelanny@boomee.com > spadelanny.asc

    ```


    此命令将把公钥以 ASCII 护甲格式保存在 `spadelanny.asc` 文件中。现在该密钥已准备好可以发送了。你也可以接收密钥文件，并使用 `gpg
    --import file_name` 命令对其进行导入。`gpg --list-keys` 命令可以验证你密钥环中存在的密钥。接下来，你将可以使用以下命令检查密钥的指纹：`gpg
    --fingerprint file_name`。这将显示消息的指纹。然后你可以验证并校验该指纹。这告诉系统该密钥是可靠的，你信任该密钥，但在验证密钥时要非常小心，因为它们可能会让你的系统变得脆弱。你可以使用
    `gpg --sign-key file_name` 命令对密钥进行签名。


    ## 文件签名


    文件签名可以作为一种确保文件接收者你已经验证过该信息、没有人篡改过它，并且你确实发送了该文件的方法。例如，你可以使用以下命令压缩并签名名为“urgent”的文件：`gpg
    -o urgent.sig -s urgent`。使用 `gpg --verify urgent.sig` 来验证签名。有时，你仍然想对消息进行签名，以显示它来自你处，即使它不是机密的。你可以使用以下命令生成并包含一个明文签名：`gpg
    -o urgent.asc --clearsign urgent`。


    ## 文件加密与解密


    要加密消息，在 GPG 命令中使用 `-encrypt` 或 `-e`，即 `gpg -o urgent.gpg -e -r spadelanny@boomee.com
    message`。


    此名为 `urgent` 的消息现在使用 `spadelanny` 的公钥进行了加密。不过，它还没有签名。你可以使用 `-s` 命令添加签名。要解密同一个文件，例如，接收者必须拥有私钥才能执行此命令：`gpg
    -o message --decrypt urgent.gpg`。


    ## 网络安全


    这涉及处理与网络连接上的威胁或攻击相关的问题。当你将系统连接到网络时（例如连接到公司内部网络），即使你处理的是一台连接到互联网的单机，网络安全也变得相关。尽管后一种情况不需要你过度担心，但将内部网络系统暴露在世界上可能会让你非常头疼。


    你可能会认为，通过只将外部服务器（如 Web 或 FTP 服务器）连接到互联网，就可以避免内部网络面临风险。这种简单的方法是不推荐的。这好比一个人因为担心可能发生事故而拒绝开车。


    不将你的系统连接到互联网会有以下缺点。首先，你无法使用文件传输协议（或 `FTP`）将文件从你的系统传输到网页浏览器。用户无法访问连接到网络的其他远程服务器。内部网络用户无法访问互联网上的
    Web 服务器。这使得 Web 等资源对你和你的用户变得不可用。


    一个实用的解决方案是使用防火墙，并将 Web 服务器放置在防火墙之外非常安全的主机上。你还可以在系统上开启所需的互联网服务，并避开未配置的服务。利用 Secure
    Shell（SSH）进行远程访问，不要使用 `rlogin` 或 `rsh` 等 `r` 命令。对你想要在系统上运行的互联网服务进行安全加加固。


    你可以应用 TCP wrapper 访问控制文件 `/etc/hosts.allow` 和 `/etc/hosts.deny` 来保护这些某些互联网服务。快速修复你选择运行的互联网服务的已知漏洞。你可以从你发行版的在线更新网站下载并安装当前的安全更新。


    ## 系统安全监控


    即使是安全的系统也需要定期持续监控日志文件，以发现入侵迹象。你可以使用如 `Tripwire` 这样优秀的检测工具来检测系统文件的任何更改，并监控关键系统文件和目录的完整性。你的
    Linux 系统可能没有配备检测工具；你可能需要下载或购买它们。一旦安装，你可以配置该工具监控任何日志更改。


    偶尔检查 `/var/log` 目录及其子目录下的日志文件是关重要的。许多 Linux 程序通过使用 `syslogd` 或 `rsyslogd` 的功能写入日志。`syslogd`
    和 `rsyslogd` 写入日志位于大多数 Unix 系统的 `/var/log` 目录下，因此确保只有 root 用户可以读写这些文件。


    ## 服务的安全


    对于连接到互联网的 Linux 系统，甚至是未连接到互联网的本地局域网 (LAN)，一个巨大的威胁是用户可以使用许多互联网服务来访问你的系统。这些服务（如邮件、Web
    和 `FTP`）需要运行服务器程序来响应通过 TCP/IP 网络到达的请求。某些服务存在漏洞，入侵者可以利用这些漏洞登录系统，甚至获得 root 权限。幸运的是，Linux
    提供了可以帮助你保护互联网服务的设施。


    ### 切换独立服务


    为了提供互联网服务（如 Web、电子邮件和 `FTP`），你的 Linux 系统必须运行监控传入 TCP/IP 请求的服务器程序。某些服务器在系统启动时就会启动，并一直在后台运行。这些服务器被称为独立服务。

