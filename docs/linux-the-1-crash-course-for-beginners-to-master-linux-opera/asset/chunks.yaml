- fmt: '

    Cloud computing’s ability to virtualize and share resources among different programs
    results in better server utilization. Take, for example, three distinct platforms
    that existed for various applications and each run on its own server. If they
    were to be shifted to the cloud, server resources would be shared, virtualized
    for the operating systems and programs to utilize the servers better. This would
    result in fewer servers, which would require less space, which reduces the data
    center size and lowers the amount of power needed to cool the servers. This, in
    turn, reduces the carbon and greenhouse gas emissions, thus reducing the carbon
    footprint. This system is not devoid of flaws, but we will take a look at those
    later on.


    # Cloud Computing Models


    Cloud computing can be viewed in two ways: either as a service the cloud is offering
    or based on the deployment model used. Based on the deployment method used, clouds
    would thus be classified as public, private, hybrid, and community. Based on services
    offered, the classification would be as follows: Software as a Service (`SaaS`),
    Platform as a Service (`PaaS`), and Infrastructure as a Service (`IaaS`).


    ## Public Cloud

    This means that the computing infrastructure is located, owned, governed, and
    run by governments, academic institutions, or business organizations, and the
    customer has no physical control over the computing infrastructure. This cloud
    environment is created from resources not owned by the end-user, and they can
    be redistributed to other users. This type of cloud is used for business-to-consumer
    type interactions and excels in performance. Due to their public nature, they
    are prone to attacks.


    Examples of public cloud service providers include `Amazon Web Services`, `Google`,
    `Microsoft`, and so on. Some of these companies also offer `direct connect` services
    that require customers to buy or lease a private connection to a peering point
    they offer.


    ## Private Cloud

    This cloud infrastructure is run solely for a singular person or organization.
    It could be managed internally or by a third party with internal or external hosting.
    They have the same benefits as public clouds, but they utilize private `hardware`.
    The `hardware` is not shared publicly, but the `servers` are located remotely.
    There are options for on-site `servers`, but these tend to be more expensive even
    though they give the user control over the physical `infrastructure`. This type
    of cloud has the highest security, although the cost reductions are minimal if
    the company uses on-site cloud infrastructure. Private clouds are solely dedicated
    to the user, and this method is used for many intra-business interactions.


    ## Hybrid Cloud

    As the name implies, this cloud merges private and public cloud infrastructure
    according to their purpose. For instance, a public cloud can interact with consumers
    while storing their data safely in a private cloud server. The public cloud is
    associated with scalability and flexibility in its ability to handle demand shifts.
    However, specific data-intensive or high-availability workloads can cause performance
    issues. Hybrid clouds can be used for business-to-business (`B2B`) and business-to-client
    (`B2C`) interactions.


    ## Community Cloud

    This refers to computing resources provided for a community or organization with
    shared data and data management. For instance, a community cloud can belong to
    a government of a single company. The computing infrastructure can be located
    both on- and off-premises.


    # Software as a Service

    As the name implies, `SaaS` is the ability to access software as a service over
    the Internet. Application Service Providers (`ASP`) were a precursor to `SaaS`.
    `ASP`s offer subscriptions to software that is hosted or delivered via the web.
    The software and fees charged are based on its use. This way, the user doesn’t
    purchase the software, but leases it as needed. You can also think of `SaaS` as
    the use of software over the web that executes remotely. The software can be in
    the form of services used by local programs such as web servers or remote applications
    accessed through a web browser. These cloud services are ideal for end-users.


    Examples of remote application services include `Google Apps`, which provide various
    enterprise applications such as word processors through a standard web browser.
    Remote execution of applications relies on an `application server` to provide
    the services needed. A software framework that uses Application Programming Interfaces
    (`API`) for software services such as database access or transaction management
    is called an `application server`. Examples include `IBM`’s `WebSphere` application
    server, `Apache Geronimo`, and more.


    ## Platform as a Service

    This service, `PaaS`, can be described as the virtualization of an entire platform
    where one or more `servers` have been virtualized over physical `servers`, operating
    systems, and specific programs such as `Apache`, `MySQL`, for web-based use. These
    platforms can be predefined and selected in some cases. However, in others, the
    user can provide a `virtual machine image` containing all the required user-specific
    programs. In other terms, it allows users to run applications on cloud infrastructure.
    The infrastructure is completely controlled by the service provider, and the user
    doesn’t need to worry about its management or the infrastructure it is running
    on. The user may not know whether the underlying platform is operating on `Linux`,
    `Windows`, a mixture of systems, or something else entirely. All they are required
    to know is the interface and how to run jobs on the virtualized platform. These
    cloud services are ideal for software and application developers.


    A good example is `Google`’s App Engine`. This service lets users deploy web applications
    on `Google`’s very stable architecture. It provides users with a sandbox for their
    `Python` applications that can be referenced over the web. It provides `Python
    APIs` for data storage and maintenance using `Google Query Language`, in addition
    to supporting user authentication, image manipulation, and email sending. The
    `sandbox` restricts access to the underlying operating system. Even with limited
    functionality available to the user’s application, the `App Engine` supports the
    building of useful Web services.


    ## Infrastructure as a Service

    `IaaS` is cloud computing that delivers on-demand, scalable services over the
    web to organizations or users who deploy workloads that can expand or shrink depending
    on their needs. It is the distribution of computer infrastructure as a service.
    This lets users run operating systems or other infrastructure over computing services.
    The users don’t managed or have control of the underlying hardware or platforms
    the infrastructure is running over. They only define what service level they require
    and run their infrastructure over it. These cloud services are ideal for system
    administrators.


    `IaaS` differs from `PaaS` because the virtual hardware comes without a software
    stack. The user then provides a `virtual machine image` invoked on one or several
    virtualized servers. This makes it the rawest form of computing as a service other
    than physically accessing the infrastructure. A prime example would be `Amazon`’s
    Elastic Compute Cloud (`EC2`). In this `IaaS`, the user can specify a certain
    `VM` and deploy their applications or provide their `VM image` to be executed
    on other servers. The user is then simply charged for computing time, storage,
    and network bandwidth used.


    Another example is the Elastic Utility Computing Architecture for Linking Your
    Programs To Useful Systems, or `Eucalyptus project` for short. It is an open-source
    implementation of `Amazon`’s `EC2` that’s interface-compatible with the commercial
    service. Just like `EC2`, it relies on `Linux` using `Xen` to virtualize the operating
    system, and it was developed for cloud computing research.

