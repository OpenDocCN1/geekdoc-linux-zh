    on the actual computer or device the user is using, it’s the server’s responsibility
    to interact with the user. This means reading the input devices and relaying this
    information to the client so it can react appropriately. X also has a library
    named Xlib that handles all low-level client-server communications. The client
    has to use functions contained in the library to get tasks done.


    The Client/Server Relationship


