    * A system administrator does a lot of things and thus should also be well informed.
    A system admin needs to know how things work, especially today, with systems being
    touted as easier to use and requiring little or no system administration. Simple-to-use
    tools are being created every day attempting to make system administration simple
    even for a novice.

    * However, if someone has to understand the nuances and details of how things
    really work, it should be you.

    * Before taking any actions, make sure to plan ahead.

    * Remember to make the process reversible and have backups. Various tools can
    assist you with this.

    * Implement any changes gradually and test out whatever tool you want to add thoroughly
    before releasing or implementing it.


