  raw: 'In Unix-like systems such as Linux, there are three types of user accounts:
    the root, system, and user accounts. The root account, also called the super user,
    is automatically created when you install your Linux OS and has complete, unrestricted
    control over the system. In other words, it has administrative privileges for
    all the operating system services. A root account can run any commands, and this
    account is often referred to as the system administrator account. System accounts
    are required for the running of system-specific elements such as mail or the sshd
    accounts. These accounts are required for particular functions, and any modifications
    could affect the system badly. For instance, services such as games, mail, and
    printing have individual system accounts that allow them to interact with your
    computer. Finally, user accounts give users or groups of them interactive access
    to the system. These accounts have the necessary privileges to undertake standard
    tasks in a Linux system, such as run programs, store data in files and databases,
    etc. These accounts, however, do not have admin privileges, so they cannot, for
    example, mistakenly delete core operating system configuration files. General
    users are usually assigned these accounts.


    Unix also supports the group account concept, where several accounts are logically
    grouped, making them part of the group account. This group account plays an important
    role in file permissions and process management. Users can be members of multiple
    groups. For instance, in the Red Hat Enterprise distro, when a user is added,
    a private user group is created. This means that a user group named after the
    user has been created and the new user is the only member.


    Creating an Account


    The Linux system views users as numerals, and each one is assigned a unique identifying
    integer known as the user ID or UID. This is because, for a computer, numbers
    are easier and faster to process compared to textual names. There is a database
    outside the kernel that gives the textual name, the username, to every user ID.
    Every UID is assigned at least one group, with one designated as their login group.


    All groups have a group ID or GID, which helps identify the user’s login group.
    These two sets of identification help keep track of the user and define what files
    they can access. Applications and commands that engage with users report user
    data by logname or group name. However, the OS uses the UID and GID for most identification
    requirements. These are the primary administrative files:


    1.  etc/passwd – stores the user account and password data; this file contains
    the most information about accounts on the system


    2.  /etc/shadow – contains the encrypted password of the corresponding account;
    note that not all the systems support this file


    3.  /etc/group − this file has the group’s data for every account


    4.  /etc/gshadow − this file has secure group account data


    As stated above, the  /etc/passwd and  /etc/group files define both the user and
    group accounts, respectively, and everyone has access to them. To create a user,
    information about the user needs to be added to the user database and make a home
    directory for them,  /home/<username>, which is also their default directory once
    they log into the system. It is important to note that the parent directory might
    differ. You might need to teach the user about a few things and set up the environment
    for them. There are several applications for creating user accounts available
    with most distributions. However, you can also use the command line to create
    them with the  adduser and  useradd commands. Let’s see how to go about it.


    The basic syntax for creating a new account is  useradd [options] username. When
    expanded it looks something like this: useradd -d homedir -g groupname -m -s shell
    -u userid account name


    *   -d homedir – defines the home directory for the account


    *   -g groupname – defines the group account for the account


    *   -m – creates the home directory if it is non-existent


    *   -s shell – defines the default shell to use for this account


    *   -u userid – this is where you define a user id for the account


    *   account name - this is where you input your preferred account name to be created


    To use this command, you must have sudo access or be logged into a root account.
    The  useradd command makes a new user account using the options detailed on the
    command line plus the defaults in the  /etc/default/useradd file. These values
    are different in each distro; thus, running the useradd command might display
    varying results on each distro. The command also reads the /etc/ login.defs file
    because it contains the shadow password suite configuration. These include user
    ID ranges used in creating accounts, password expiration policies, etc.


    Type in  $ sudo useradd username and hit enter. The command will read the default
    file and create an entry in the /etc/passwd, /etc/shadow, /etc/group and  /etc/gshadow
    files. So for example, to create a new (ordinary) user account for Fiona, type
    in  $ sudo useradd fiona,  or  $ useradd -d /home/fiona -g minor -s /bin/ksh fiona


    Don’t forget to create the minor group before issuing this command.


    Changing Passwords


    To log in using your new account, a password must be set using the passwd command.
    Here is the syntax:  $ sudo passwd username


    After running this command, you will be requested to input the password and confirm
    it. Ensure that you set a strong password to safeguard your account. Here is the
    basic syntax and an example.


    Changing password for user username


    New password:


    Retype new password:


    passwd: all authentication tokens updated successfully


    Here’s the example


    $ passwd Fiona


    Changing password for user fiona


    New password:


    Retype new password:


    passwd: all authentication tokens updated successfully


    Modifying Accounts


    You can make changes to an existing account from the command prompt via the usermod
    command. It employs the same argument as the  useradd and the  -l commands which
    allow you to alter your account name. To change the account name fiona to fiona23,
    and alter the home directory too, you will type in:  $ usermod -d /home/fiona23
    -m -l fiona fiona23


    Removing Accounts


    You can also delete a dormant, unused, or existing account using the  userdel
    command. Please note that this is a dangerous command and should be used cautiously.
    It uses only one argument or option,  .r, to remove the account’s mail file and
    home directory.


    For example:  $ usermod –r fiona23


    If you want to retain the home directories for backup, you can omit the  –r option.


    Group Accounts


    All the existing groups in your system are located in the  /etc/groups file. However,
    as defaults, they are system account specific, and they are not recommended for
    use with ordinary accounts. To create a new group, you will use the  groupadd
    command in the following syntax:  groupadd [-g gid [-o]] [-r] [-f] group name


    *   -g GID – represents the numerical value of the group’s ID


    *   -o – the option permits the user to add a group with a non-unique GID


    *   -r – the flag instructs the groupadd command to add a system account


    *   -f – this option causes an exit with success prompt if the defined group already
    exists. With  -g, if the defined GID already exists, other (unique) GID is selected.


    *   groupname – this is the actual group name to be created


    To modify a group, utilize the groupmod command in the following syntax:  $ groupmod
    -n new_modified_group_name old_group_name


    For example:  $ groupmod -n minor minor¬_2


    To delete a group, you require the groupdel command and the group’s name, i.e.,  $
    groupdel group_name. This will only remove the group and not the files.


    Process Management'
