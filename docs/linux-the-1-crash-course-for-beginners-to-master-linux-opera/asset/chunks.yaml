- fmt: '

    Any graphics adaptor will work with Linux as long as your computer supports it.
    The minimum specification is having a standard graphics card capable of 1024 x
    768 resolution. Ideally, a 3D accelerated graphics card with about 256 MB graphics
    RAM works well.


    ## Preparing for Installation


    Once you have selected the distribution you want to install, you can download
    the `.iso` files for free from their respective websites, as well as a list of
    recommended system requirements for the distro. Despite what many think, installing
    Linux is very easy, as most versions have what is called a live distribution.
    This means that the OS will run from whichever device, either a CD/DVD, USB, or
    external drive, without making changes to your hard drive. This allows you to
    get full functionality without committing to an installation. Once you have gotten
    used to it, you can decide whether to install it or not by double-clicking on
    the install button and following the wizard prompts.


    There are various ways you can install your Linux OS:


    ### 1. Using a USB Stick

    You can install your desired Linux distro onto your computer via a bootable USB
    stick. After downloading the OS files onto your computer, download a universal
    USB installer to make your USB stick bootable. Then follow the prompts to install
    Linux onto the USB drive. After the operating system has been installed and configured,
    a small window will appear to let you know that your USB stick now ready.


    ### 2. Using a CD-ROM

    Just like the USB drive, download the `.iso` files and burn them onto a CD, which
    you will then use to boot your computer in Linux.


    ### 3. Using Virtual Machine

    This is a popular method of installing Linux. The virtual installation allows
    you to run your Linux OS in a machine with an existing operating system. For instance,
    you can have both Windows and Linux running on the same machine. Virtual machine
    software such as `Oracle VM` can install Linux distributions in the following
    easy steps. First, download and install a virtual box that suits your machine.
    Once the setup is done, download the operating system files and create a virtual
    machine to install the OS. Follow the prompts to set up the virtual machine where
    your Linux OS will reside. After you are done, you have the option to install
    the operating system or run it without installing it. There are additional steps
    in the installation process, such as setting up user accounts, which we''ll examine
    later.


    ## Setting up the System


    During installation, you configured some basics, such as selecting your preferred
    language, keyboard layout, and time zone. The next step prompted you to create
    a user name and password and also provide other login information such as your
    name and the computer’s name to enable the installation of the Linux distro. This
    is the password you need to log into your account and perform any administrative
    tasks. In this pop-up box, you could also choose whether to let the system log
    you in automatically or require your password with every login. This step is vital
    if you plan on sharing your computer. It acts as an added layer of protection
    against any user making unsolicited changes.


    After installation, your computer will reboot and display its desktop environment.
    At this point, you must perform a hardware check after the system restarts. Most
    of the hardware should work right out of the box with any Linux distro that has
    been installed, although you may be required to download additional drivers to
    get everything working well. This is because some hardware, such as graphics cards,
    require proprietary drivers to work. There is an open-source driver that will
    work with the card, but to get the most out of it you will have to obtain the
    drivers from the manufacturer.


    ## Command Line Interface


    The Linux command line is a text interface that allows you to communicate with
    the computer, and it is solely based on textual input and output. A command is
    an instruction that is given to a computer instructing it on what to do. They
    are generally given by typing them in a command line and pressing enter. An all-text
    display mode, also known as the command-line interface, can consist of a console
    and a terminal window to display the command prompt. The command prompt or shell
    prompt is a short, automatically generated text message that appears at the beginning
    of the command line. It shows the user that the system is ready for the next command,
    data element, or other input and also helps the user to plan and execute the following
    operations.


    On the default shell on Linux, the `bash` shell, the command prompt contains the
    username, computer name, and the name of the current directory. For example, if
    a user named `X` is working in a directory named `research` on a computer named
    `home`, the shell prompt would look like this:

    ```

    [X@home research] $

    ```


    The terms command line, shell prompt, and command prompt are used interchangeably,
    especially when providing instructions on the commands being issued. For instance,
    an instruction might say, “Input the following at the command line,” “Input the
    following at the shell prompt,” or “Input the following at the command prompt.”


    There are two ways to obtain the shell prompt when using a GUI. Open the terminal
    window by clicking on the terminal window icon or menu item or switching from
    the graphical user interface to a console without closing any open programs, or
    press the `CTRL`, `ALT`, and `F1` keys together, and the shell prompt will appear.
    After you are done, you can restore the GUI by pressing the `ALT` and `F7` keys.


    ## Updating the System


    Even though Linux has become more user-friendly, its systems are still fundamentally
    different from Windows or Mac, and it is best to understand these systems in order
    to use them well. There are two ways you can update your system in Linux, either
    using the command line or by using the update manager. You must understand that
    when updating Linux, every distro handles this process differently. This is because
    some distros are distinctly different down to the kind of files they use for their
    package management. For instance, Ubuntu and Debian use `.deb`, Fedora and SuSE
    use `.rpm`, etc. Another difference is whether during installation the distro
    is installed from source code or pre-compiled `.bin` or `.package` files.


    Let us take Ubuntu, for instance, as an example of how you can update your Linux
    system. The Ubuntu distro uses two different tools to update the system, the `apt-get`
    command-line tool and the update manager, which is a GUI tool.


    ### 1. Using the Update Manager


    The update manager is nearly a completely automatic tool, which saves you the
    trouble of constantly monitoring your system to see if new updates are available.
    If updates are available, the update manager will pop up, depending on the urgency
    of the update. Security updates are set to appear daily and non-security updates
    weekly. You can also check for updates manually by clicking on the Administration
    sub-menu on the System menu and select the update manager. Once you open the manager,
    click on the Check button to see if there are new available.


    To update your system, check to see if the updates selected are the ones you want
    to install. By default, all updates are selected. Next, click on the Updates button,
    enter your superuser (`sudo`) password, and click OK. The system will automatically
    install the updates in the background, allowing you to continue with your work.
    Some updates such as kernel update require that you log out, log back in, or restart
    your machine. Once the updating is done, the update manager will pop up on the
    screen to report that your system is now up-to-date.


    ### 2. Using the Command-line Tool Apt-Get

