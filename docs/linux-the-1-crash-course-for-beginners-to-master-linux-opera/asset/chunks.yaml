- fmt: '

    As mentioned before, processes use signals to terminate. There are, however, a
    lot of signals that can be used to control the behavior of a process. For instance,
    you can use the `kill` command to send a process a signal. Most signals are used
    by the system internally or by programmers when they code. Here are some examples.


    *   `SIGTERM` – signal number 15 – signals a process to terminate in an orderly
    way

    *   `SIGINT` – signal number 2 – interrupts a process; a process can choose to
    ignore this signal

    *   `SIGKILL` – signal number 9 – interrupts the process; this signal cannot be
    ignored

    *   `SIGHUP` – signal number 1 – this is for daemons; it instructs them to reread
    the configuration file


    You can get the full list of signals by typing in the `kill –l` command. The list
    varies according to your distribution.


    ## SUID and SGID


    The `setuid` and `setgid` access modes enable regular users to carry out tasks
    that require privileges and access rights, which they don’t have. Take, for example,
    in many systems, the `write` command belongs to the `tty` group. This group also
    owns all the terminal and pseudo-terminal files. The `write` command, therefore,
    has `setgid` access, which allows users to write messages to another user’s terminal
    or window, which they normally have no access to. As the user writes, their `EUID`
    is set to that of the group that owns the executable file (`/usr/bin/write`) for
    the command duration.


    `SUID` and `SGID` are also utilized by the printing subsystem, mailers, and other
    system facilities, but they are prone to causing security risks. `setuid` almost
    always sets the user ID to `root`; you can see the danger this poses to the system.
    Programs and users can find ways to perform extra unauthorized actions, while
    `setuid` is active to retain this access after the process ends. `setuid` should
    be avoided since it poses a greater security risk than `setgid`. You can perform
    any task with `setgid` in conjunction with carefully designed groups. This, however,
    doesn’t make them completely risk-free.


    ## System Performance Monitoring


    Another important duty of a system administrator is to monitor and manage the
    system’s performance. Linux provides tools to help with this, and these tools
    also give guidelines on how to diagnose and fix system performance errors. There
    are major resources that require monitoring and management. These include the
    `CPU`, memory, hard drive, lines of communications lines, `I/O time`, network
    time, and application programs.


    Performance components are used to gauge how the system is working. Below are
    five major components that make up system time.


    ### 1. User State CPU


    This indicates the actual time the `CPU` spends running the users’ applications
    in the user state. It includes the time spent executing user-initiated processes
    such as library calls but doesn’t include the time spent in the kernel on behalf
    of the process. Every `CPU` time used by anything else other than the kernel is
    marked as a user time, even if the user did not launch it. If, for instance, a
    user-process needs to access some hardware, it has to put a request in through
    the kernel, meaning this would count as system state time instead.


    ### 2. System State CPU


    This shows the amount of `CPU` time is taken up by the kernel. The kernel handles
    all low-level tasks such as memory allocation, communication between operating
    system processes, running device drives, managing the file system, and interacting
    with hardware. This means that all `I/O` routines require kernel services. A programmer
    can alter this value by blocking any `I/O` transfers during a session.


    ### 3. I/O Time and Network Time


    This indicates the time spent transferring data and attending to `I/O` requests
    from various processes. An `iowait` is a subcategory of `I/O time` that shows
    the time spent waiting for `I/O` operations, such as a read or write to disk.
    As a processor awaits a file to be opened, the time spent is marked as `iowait`.
    High `iowait` times can indicate issues in the system that are outside the processor’s
    control.


    ### 4. Virtual Memory Performance


    This includes time spent context switching and swapping.


    ### 5. Application Program


    This is the time spent running other application programs. That is when the system
    is not attending to this application because another application currently has
    use of the `CPU`.


    ## Performance Tools


    Remember the tools mentioned before that help users measure, monitor, fine-tune,
    and manage system performance? They include:


    *   `nice/renice` – runs a process with modified scheduling priority

    *   `netstat` – prints network connections, routing tables, interface statistics,
    mask connections, and multicast memberships

    *   `time` – helps a user time a simple command or gauge resource usage

    *   `uptime` – shows the system load average

    *   `ps` – reports a snapshot of the current processes

    *   `vmstat` – reports statistics on virtual memory

    *   `gprof` – displays the user’s call graph profile data

    *   `prof` – facilitates user process profiling

    *   `top` – shows all the system tasks


    You can use the `Manpage Help` to get the syntax of these and more Linux commands.


    ## System Logging


    Linux has an extremely flexible and powerful logging system that enables a user
    to log or record just about anything and manipulate these records to get the information
    they need. This is through the `syslog` facility. Programs that require their
    data to be logged send this information to the `syslog` facility. `syslog` is
    a host configurable, uniform system logging facility that uses a centralized system
    logging process that runs the `/etc/syslogd` or `/etc/syslog` program files.


    The way it works is that programs send their log entries to `syslogd`, which then
    creates the `/etc/syslogd.conf` or `/etc/syslog` configuration file. When a match
    is found, it writes the log data into the wanted document. The following are some
    basic `syslog` terms you should know.


    The first one is the `facility`. It is an identifier used to define a program
    or process that presented the log message. It can be the `kernel`, `mail`, `FTP`,
    etc. Next is the `priority`, an indicator of the log message’s importance. Priority
    levels within `syslog` are defined as guides for events such as debugging or error
    reporting. The term `selector` refers to a combination of one or more facilities
    and levels. The last term is the `action`. This refers to what takes place when
    an incoming message matches a selector. They can be a write to log file, echo
    log message to console, send the log message to another syslog server, and so
    on.


    `syslog` facilities are programs for the selector, such as `auth`, which shows
    any activity related to requesting username and password, like `getty`, `login`,
    etc. `console` captures messages directed to the system console. `cron` shows
    messages from the `cron` system scheduler. `FTP` shows messages for the `FTP`
    daemon. There are quite a few facilities, and not all of them are present on all
    Linux distributions.


    `syslog` priorities show the importance of the log messages that come in. They
    include:


    *   `emerg` – for emergency conditions such as a system crash that all users are
    informed about

    *   `alert` – indicates that the message condition needs to be addressed immediately

    *   `crit` – shows that the message condition is critical such as a hardware error

    *   `err` – shows a normal error message

    *   `warning` – shows a warning message

    *   `notice` – shows that even though the condition is not an error ir be handled
    specially

    *   `info` – for information messages

    *   `debug` – for debugging messages

    *   `none` – for pseudo-level messages that don’t need logging.


    These facilities and their priorities help the user discern the system logs and
    knows where to find the information they need. The system logger decides what
    to keep or discard depending on the selector priority level.


    ## Chapter Summary


    *   You learned what system management is and a bit of what it entails.

