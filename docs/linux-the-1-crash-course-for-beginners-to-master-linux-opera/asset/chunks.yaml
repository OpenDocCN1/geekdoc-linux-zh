    5.  Switch to a different window manager. What happened?


    6.  Log out and pick a different session type, like Cinnamon, if you were using
    Gnome earlier. Repeat the previous steps.


    CHAPTER 3


    The Shell and Its Utilities


    By now, as a Linux user, you are already aware of the basic makeup of a Linux
    system. It is comprised of a kernel, Shell, commands and utility programs, files,
    and directories. The kernel is the core of the operating system. It interfaces
    with the computer hardware and other core functions such as memory management,
    file management, and task scheduling. Shell is a utility program that handles
    your requests. When a user enters a command into the terminal, Shell deciphers
    the commands and initiates the program you want to helps generate the result you
    wanted. It uses a standard order for all its commands. There are several shells
    available for Linux distros such as C shell, Bash, Korn Shell, and many more.


    The commands and service programs comprise the commands mentioned above and other
    utility programs that the user uses. These include mkdir, sudo, cp, cal, and so
    on. There are over two hundred and fifty standardized commands plus numerous troves
    of those supplied through 3rd party software. All of the data in a Linux system
    is arranged in files. These files are then arranged into directories. This organization
    structure further arranges the directories into a tree-inspired structure known
    as the file system.


    In this and subsequent chapters, we will take a more in-depth look into these
    various components and see how they work on a Linux system, as well as how you
    can utilize them. The first one you will tackle is Shell and its utilities.


    Shell


    As a refresher, the Shell is, in essence, an interface between the OS and the
    user. It is a command-line interpreter through which you can issue various instructions
    to the system. The Shell interprets these instructions, and it tells the system
    what actions to take. Therefore, the command prompt is where you input these instructions
    or commands. Before GUIs were developed, the only way to input commands was via
    the Shell prompt. All these shells have similar input attributes. You have to
    issue commands to get the device to carry out any task.'
