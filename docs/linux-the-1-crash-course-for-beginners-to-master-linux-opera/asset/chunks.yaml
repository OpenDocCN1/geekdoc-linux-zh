  trans: "\n风险分析有助于评估可能损害你系统的潜在危险。风险分析首先定义风险，然后识别并确定处理这些风险的优先级。风险分析会查看任何可能的威胁、你正在防止系统遭受的攻击、你系统中可能被这些威胁利用的漏洞和弱点、威胁利用漏洞的概率或可能性、此类风险带来的影响，以及可以采取的减少或消除这些漏洞的任何缓解措施。\n\
    \n# 威胁\n\n这是 Linux 系统可能面临的典型攻击列表。\n\n1. **DoS 攻击**（拒绝服务攻击）\n   这种攻击会占用计算机和网络，导致合法用户无法使用或访问系统。以一家公司为例；DoS\
    \ 攻击可能会瘫痪服务并导致收入损失。由于通过一次计算机攻击攻垮一个组织相当困难，因此常见的策略是将几台计算机重定向到单一站点并让它们冲击系统。这被称为分布式攻击，或\
    \ `DDoS`。\n\n2. **未经授权的黑客攻击**\n   这是指未经授权的用户获得了系统的访问。他们可以窃取、损坏或删除数据。这会对系统产生不利影响，例如导致系统崩溃。\n\
    \n3. **信息泄露**\n   泄露是指发布、显示或告诉某些私密信息。一个很好的例子是密码文件泄露，这会向潜在黑客展示你的登录凭据。这也适用于敏感数据（如财务或医疗报告）的泄漏。\n\
    \n# 漏洞\n\n以下是系统和网络容易受到攻击的某些领域：披露和共享用户密码及安全凭据；通过路由器和网络交换机等安全访问点；系统与互联网之间的相互连接（如网关）；第三方网络提供商（ISP）的安全性松散或糟糕；操作系统安全中的漏洞（例如与\
    \ `sendmail`、`named` 和 `bind` 命令相关的互联网漏洞）；最后是特定应用程序的弱点。所有这些漏洞都是安全威胁的潜在入口。\n\n\
    # 加固 Linux\n\n在确定安全策略后，你可以根据策略开始加固系统。如前所述，加固系统的具体步骤取决于你想要对系统做什么，它是一个工作站还是服务器，以及预计有多少用户使用该系统。Linux\
    \ 安全涵盖两个大类，即主机安全问题和网络安全问题，要加固你的系统，你必须处理这两者。\n\n**重要提示**：如果你的主机连接到大型网络，目录服务可能会带来一些安全问题，请对其进行研究。\n\
    \n## 主机安全\n\n这涉及处理与安全操作系统、文件和目录相关的问题。以下是关于处理主机安全问题的指南。\n\n1. 不要安装你需要的软件。例如，如果你的系统是一个工作站，你就不需要\
    \ Web 或新闻服务器。\n2. 在开始时创建你需要的所有用户账户，并确保它们有强密码。Linux 有你可以使用的工具来强制强密码。\n3. 设置文件所有权访问权限，以保护重要的文件和目录。\n\
    4. 如果你的系统具有强制访问控制的能力，请启用它。自内核 `2.6` 发布以来，内核通过集成安全增强型 Linux (`SELinux`) 支持了这一功能。将其想为包裹在你的系统周围的一层，从而增加了安全性。\n\
    5. 使用 GNU 隐私守护 (`GnuPG`）对带有敏感数据的文件进行加密或解密，并对下载的文件进行身份验证。大多数 Linux 发行版都带有 `GnuPG`，你可以使用\
    \ `gpg` 命令加密、解密甚至制作数字签名。\n6. 利用文件完整性工具监控关键系统文件和目录的任何更改。\n7. 定期检查各种日志文件，查看是否有任何篡改、入侵或尝试入侵的迹象。这些文件可以在你系统的\
    \ `/var/log` 目录中找到。一旦发布稳定的安全更新，就可以立即安装。这些更新针对系统的漏洞并对其进行修复。确保在更新你的系统和机器之前先测试这些更新。\n\
    8. 你可能会花费大量时间加固系统，却忘记了安全性的物理方面。如果有人闯入并偷走了它，那么最终拥有一个安全系统有什么意义呢？你可以将系统设置在可以控制访问的安全房间（机房）内。\n\
    \n## 使用 GnuPG 对文件进行加密和签名\n\nLinux 配备了 GNU 隐私守护 (`GnuPG` 或 `GPG`) 加密和身份验证实用。它允许你创建私钥和公钥密钥，然后使用该密钥对文件进行加密，并发送数字身份验证以显示消息来自你。拥有你公钥的人可以验证这一点。使用公钥加密的想法基本上是拥有两个相关但无法通过其中一个推算出另一个的密钥。用任何密钥加密的内容只能用相应的密钥解密。你将公钥分发给其他人，但将私钥留给自己。\n\
    \n让我们用一个例子来帮助说明加密密钥。Jane 想 给 Joe 发送一条安全消息。每个用户都会生成一对公钥和私钥，并交换他们的公钥。如果 Jane 想给\
    \ Joe 发送消息，她就用 Joe 的公钥加密数据并将消息发给他。由于消息被加密了，所以它是防窃听的，因为只有 Joe 的密钥可以解密它，而且只有 Joe\
    \ 拥有该密钥。一旦 Joe 收到消息，他就使用他的密钥解密消息并读取。此时，你可能已经注意到某些漏洞。包括：Joe 如何确定消息是来自 Jane 的？如果其他人拥有\
    \ Joe 的密钥并冒充 Jane 发送了消息怎么办？这就是数字签名大显身场。\n\n### 数字签名\n\n电子签名的目的是帮助识别身份。与纸笔签名不同，数字签名取决于你发送的消息。你首先对消息应用数学函数，然后将其还原为固定大小的消息摘要，称为哈希值或指纹。无论消息大小如何，摘要都是\
    \ 128 位或 160 位，取决于你的哈希函数。接下来，你通过用私钥加密消息摘要来应用你的公钥并获得数字签名。它通常被添加到电子签名消息的末尾。\n\n\
    ### 使用 GPG\n\nGNU 隐私守护程序包含了你使用公钥加密和数字签名所需的工具。第一步是解密，你可以随着进展逐渐学会使用 `GPG`。通过 `GPG`，你可以生成密钥、交换密钥、签名文件、加密和解密文档。让我们来看看这些功能。\n\
    \n#### 生成密钥对\n\n输入 `gpg --gen-key` 命令。如果这是你第一次使用 `GPG`，它会在你的主目录下创建一个 `.gnupg`\
    \ 目录，并在该目录下创建一个名为 `.gpg.conf` 的文件。它会询问你想要什么类型的密钥。无论是 `DSA` 和 `ElGamal`（默认值）、`DSA`（仅签名）或\
    \ `RSA`（仅签名）。\n\n"
