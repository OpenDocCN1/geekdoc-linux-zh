    Some commands do not require any input to work, such as the `date` command; however,
    others require an argument or option to work. Anything included in the command
    line after the command is an argument. An option affects this behavior, whereas
    an argument is acted upon as is by the command. It is important to note that some
    arguments are optional, and other options are needed. For instance, you don’t
    always require an argument for the `date` command, whereas the `tar` command requires
    an option.


    The basic Shell of all Unix systems is the Bourne shell, simply denoted as `(sh)`.
    Other shells such as `bash`, `csh`, `ksh`, and more have evolved from this. Every
    Shell has a certain order in which the internal functions such as the variables,
    redirection of input and output devices, etc. are executed. There are many advantages
    to learning how to use the Shell and its functions. Let’s take a look at some
    of its components below.


    ## Environment Variables

    The shell environment consists of everything it will need as it runs. These components
    are referred to as environment variables and include the search path, the user’s
    logname, and the type of terminal you are using. When a user logs in, many of
    these variables are already set by a shell mechanism.


    An environmental variable is a variable with a name and value. This value can
    be anything from the default editor, system locale settings, to even directories.
    `PATH` is an example of such a variable. New Linux users find these settings’
    management somewhat hard to handle. Environmental variables, however, offer a
    simpler way to share configuration settings among many programs and processes.
    The following are some important variables you should know and how they are set
    and accessed.


    1. `DISPLAY` – has the identifier for the default display that X11 applications
    use.

    2. `HOME` – shows the home directory of the current user, and it is the default
    argument for the built-in `cd` command.

    3. `IFS` – shows the Internal Field Separator used by the parser for word splitting
    after expansion.

    4. `LD_LIBRARY_PATH` – a Linux system containing a dynamic linker has a colon-separated
    directory list that the dynamic linker should look in for shared objects when
    constructing a process image after `exec`, before looking in other directories.

    5. `PATH` – shows the search path for commands.

    6. `PWD` – shows the current working directory as set by the `cd` command.

    7. `RANDOM` – produces an arbitrary integer within 0 and 32,767 every time it
    is referenced.

    8. `SHLVL` – increases by one every time a `bash` instance is initialized; it
    is ideal for monitoring if the built-in `exit` command ends the current session.

    9. `TERM` – indicates the display type.

    10. `TZ` – indicates the Time zone such as `CAT`, `GMT`, etc.

    11. `UID` – expands to the numeric user ID of the current user, initialized at
    the shell startup.


    With that in mind, let us dive into the `PATH` environmental variable.


    ## Paths

    `PATH` is an environmental variable used in Linux that instructs the Shell in
    which directories to look for ready-to-run files as a response to user issued
    commands. It enhances the ease and safety of Unix-like operating systems and is
    thus considered quite valuable.


    If, for instance, you know that there is a particular application in your system,
    but when you try to initialize it, the system responds with a “file not found”
    message. You might attribute this to you not remembering the right name or spelling.
    But in fact, the reason behind it is because the application was not in the search
    path. A user’s search path is a predetermined directory set where the system searches
    for the application when you typed in the command line or which was initiated
    by another command. The search path saves the system a lot of time because it
    does not have to look through all the directories for what you want. By searching
    in specific areas, you can get faster results. The downside, however, comes when
    the program is not in any of the specified directories. To instruct the Shell
    where to look for your file, you must issue explicit commands that require you
    to specify either the path to the file relative to where you are or the full command
    path.


    `PATH`, which is denoted in upper case letters, should not be confused with `path`,
    which is a file’s or directory location in a file system. A relative path is a
    location relative to the directory which the user is currently working in. An
    absolute path, also known as a full path, is a location relative to the root directory.
    The root directory is the directory at the topmost level of the file system, and
    it contains all other directories and files.


    A user’s `PATH` is therefore comprised of a series of colon-separated absolute
    paths that are kept in plain text files. Every time a user types in commands at
    the command line (CL) that isn’t built into the Shell or doesn’t include its absolute
    path and hits Enter, the Shell looks through the directories that make up the
    user’s search path until it finds an executable file with that name. By concentrating
    most executable files in a few directories and using `PATH` to find them, it removes
    the need for users to recall which directories they are in and type their absolute
    paths. This means that any application can be run by just typing its name, such
    as `ls` instead of `/bin/ls`. This execution happens regardless of whether the
    user is currently working on the file system. It also reduces the chance of causing
    damage to the data or the system by accidentally running a script named similarly
    to a standard command.


    By running the `env` command, a user can see a list of all the current environmental
    variables, their values for the current user, and all the directories in the `PATH`
    variable. This command can be run without any options or arguments. Since this
    can be quite a bit of information, you can change the command so that it only
    shows the `PATH` variable and its value. You can do this by using a pipe that
    is represented by a vertical character to switch the `env` output to the `grep`
    filter while using `PATH` as an argument, i.e., `env|grep PATH`.


    You can also use the `echo` command to view `PATH`, i.e.,

    ```

    echo $PATH

    ```

    `echo` duplicates whatever follows it on the command line. The `$` sign before
    `PATH` instructs `echo` to repeat the value of the `PATH` variable instead of
    the name.


    Every user can have a different `PATH` variable. When an OS is installed, the
    default `PATH` variable, known as the root account, is created. Another default
    is also established that will be used as a template for other normal user accounts
    as they are added. The root `PATH` variable has more directories than the user
    `PATH` variable. This is because it contains directories such as `/sbin` and `/usr/sbin`,
    which contain applications used by a particular user. `PATH` variables can be
    altered easily. You can modify them for a particular login session or alter them
    permanently. You can include a directory into a user’s `PATH` variable and thus
    into the search path by using `PATH="directory:$PATH"` command. For example, you
    can add `/usr/sbin` to the `PATH` variable. The command will look like this:


    ```

    PATH="/usr/sbin:$PATH"

    ```

    You can also use the `export` command to add a directory, i.e.,

    ```

    export PATH=$PATH:/usr/sbin

    ```

    A user’s `PATH` variable can be made permanent by including it in the user’s `.bash_profile`
    file. The `.bash_profile` file is a hidden file in each user’s home directory
    that explains any particular environmental variable and startup applications for
    that specific user. It is important to note that a colon with no spaces should
    precede each absolute path. For example,

    ```

    PATH=$PATH:$HOME/bin:/usr/test

    ```

