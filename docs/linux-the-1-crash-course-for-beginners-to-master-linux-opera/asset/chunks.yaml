  trans: '


    某些命令不需要任何输入即可工作，例如 `date` 命令；然而，其他命令则需要参数或选项才能工作。命令行中命令之后包含任何内容都是参数。选项会影响这种行为，而参数则会被命令按原样处理。需要注意的是，某些参数是可选的，而其他选项是必不可少的。例如，你并不总是需要
    `date` 命令的参数，但 `tar` 命令则需要一个选项。


    所有 Unix 系统的基础 Shell 是 Bourne shell（Bourne shell），简写为 `(sh)`。其他 Shell 如 `bash`、`csh`、`ksh`
    等都是从此演变而来的。每个 Shell 都有一个特定的顺序来执行内部函数，如变量、输入和输出设备的重定向等。学习如何使用 Shell 及其函数有许多优势。让我们下面来看看它的部分组件。


    ## 环境变量

    Shell 环境由它在运行时可能需要的所有内容组成。这些组件被称为环境变量，包括搜索路径、用户名（logname）以及你正在使用的终端类型。当用户登录时，许多这些变量已经由
    Shell 机制设置好了。


    环境变量是一个带有名称和值的变量。这个值可以是从默认编辑器、系统区域设置到目录的任何内容。`PATH` 就是此类变量的一个示例。新的 Linux 用户会发现这些设置的管理有些难以处理。然而，环境变量为许多程序和进程之间共享配置设置提供了一种更简单的方法。以下是你应该了解的一些重要变量以及如何设置和访问它们。


    1. `DISPLAY` – 具有 X11 应用程序使用的默认显示标识符。

    2. `HOME` – 显示当前用户的家目录，它是内置命令 `cd` 命令的默认参数。

    3. `IFS` – 显示解析器在扩展后用于单词拆分时使用的内部字段分隔符。

    4. `LD_LIBRARY_PATH` – 包含动态链接器的 Linux 系统包含一个由冒号分隔的目录列表，动态链接器在 `exec` 之后构建进程映像时，在查找其他目录之前，应该在这些目录查找共享对象。

    5. `PATH` – 显示命令的搜索路径。

    6. `PWD` – 显示由 `cd` 命令设置的当前工作目录。

    7. `RANDOM` – 每当引用它时都会产生一个 0 到 32,767 之间的任意整数。

    8. `SHLVL` – 每当初始化 `bash` 实例时增加一；它非常适合监控内置 `exit` 命令是否结束了当前会话。

    9. `TERM` – 指示显示类型。

    10. `TZ` – 指示时区，如 `CAT`、`GMT` 等。

    11. `UID` – 扩展为当前用户的数字 ID，在 Shell 启动时初始化。


    考虑到这些，让我们深入研究 `PATH` 环境变量。


    ## 路径

    `PATH` 是 Linux 中的一种环境变量，它指示 Shell 在响应用户发出的命令时在哪些目录中查找准备就绪运行的文件。它增强了 Unix 类操作系统的易用性和安全性，因此被认为非常有价值。


    例如，如果你知道系统中有一个特定的应用程序，但当你尝试初始化它时，系统返回了“未找到文件”的消息。你可能将此归于你没有记住正确的名称或拼写。但事实上，背后的原因是该应用程序不在搜索路径中。用户的搜索路径是一个预设的目录集，当你在命令行输入命令或由另一个命令启动时，系统会在其中搜索应用程序。搜索路径节省了系统大量时间，因为它不需要遍历所有目录来寻找你想要的内容。通过在特定区域搜索，你可以获得更快的结果。然而，当程序不在任何指定的目录中时就会出现缺点。要指示
    Shell 在何处查找你的文件，你必须发出明确命令，要求你指定相对于当前位置的文件路径或完整的命令路径。


    `PATH` 用大写字母表示，不与 `path` 混淆，`path` 是文件系统中文件或目录的位置。相对路径是相对于用户当前工作所在目录的位置。绝对路径（也称为全路径）是相对于根目录的位置。根目录是文件系统最顶层的目录，它包含了所有其他目录和文件。


    因此，用户的 `PATH` 由一系列冒号分隔的绝对路径组成，这些路径存储在纯文本文件中。每当用户在命令行（CL）输入不是 Shell 内置或不包含其绝对路径的命令并按回车时，Shell
    就会遍历构成用户搜索路径的目录，直到找到同名的可执行文件为止。通过将大多数可执行文件集中在几个目录中并使用 `PATH` 查找它们，消除了用户记住自己在哪个目录中并输入绝对路径的需求。这意味着任何应用程序都可以通过输入其名称来运行，例如输入
    `ls` 而不是 `/bin/ls`。这种执行无论用户当前是否在文件系统上工作。它减少了由于意外运行与标准命令同名的脚本而对数据或系统造成损坏的可能性。


    通过运行 `env` 命令，用户可以看到所有当前环境变量的列表、它们对于当前用户的值以及 `PATH` 变量中的所有目录。此命令可以在不带任何选项或参数的情况下运行。由于这些信息很多，你可以更改命令使其只显示
    `PATH` 变量及其值。你可以通过使用管道（由垂直字符表示）将 `env` 输出切换到 `grep` 过滤器，同时将 `PATH` 作为参数，例如 `env|grep
    PATH`。


    你也可以使用 `echo` 命令查看 `PATH`，例如

    ```

    echo $PATH

    ```

    `echo` 会复制其后的任何内容。`PATH` 前的 `$` 符号指示 `echo` 重复 `PATH` 变量的值而不是名称。


    每个用户都可以有不同的 `PATH` 变量。安装操作系统时，会创建一个默认的 `PATH` 变量，即根账户。还会建立另一个默认值，作为添加其他普通用户账户的模板。根
    `PATH` 变量比用户的 `PATH` 变量包含更多目录。这是因为它包含了如 `/sbin` 和 `/usr/sbin` 等目录，这些目录包含了特定用户使用的应用程序。`PATH`
    变量可以很容易修改。你可以针对特定的登录会话对其进行修改，也可以永久修改。你可以通过 `PATH="directory:$PATH"` 命令将目录引入用户的
    `PATH` 变量以及搜索路径中。例如，你可以将 `/usr/sbin` 添加到 `PATH` 变量中。命令如下：


    ```

    PATH="/usr/sbin:$PATH"

    ```

    你也可以使用 `export` 命令添加目录，例如

    ```

    export PATH=$PATH:/usr/sbin

    ```

    通过将 `PATH` 变量包含在用户的 `.bash_profile` 文件中，可以使其变为永久性的。`.bash_profile` 文件是每个用户家目录下的一个隐藏文件，解释了该特定用户的任何环境变量和启动应用程序。需要注意的是，每个绝对路径之前应该有一个没有空格的冒号。例如，

    ```

    PATH=$PATH:$HOME/bin:/usr/test

    ```

