    CSS3 column-count property.


    The column count property is as follows:


    +   i. number It specifies the number of columns in the multi-column element.
    If the column width is also set to a non auto value, it may indicate the maximum
    allowed number of columns.

    ii. auto It is determined by other CSS properties, like column-width. This is
    the default value.


    CSS3 column-fill property: The column-fill CSS property specifies how the column
    lengths in a multi-column element are affected by the content flow. Contents in
    a multi-column layout are either enhanced, which means that contents in all columns
    will have the same height, or just take up the room as much as the content needed,
    using the auto value.

    The syntax of this Property is given as:


    ```

    column-fill: auto | balance | initial | inherit

    ```


    **Example:**


    ```

