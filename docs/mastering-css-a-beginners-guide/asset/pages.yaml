    syntax. I will add a white area and cut into that code as follows:


    ```

    p { color: blue; }

    ```


    Both of the above examples are exactly the same about your browser. But developers
    often write CSS as the latest example to differentiate styles. CSS is a rule-based
    language – defines rules by specifying groups of styles to be applied to specific
    objects or groups of objects on your web'
