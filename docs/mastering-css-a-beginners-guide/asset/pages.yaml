  md: "CSS styles are part of the HTML object. Here are a few examples:\n\n```\n<div\
    \ style = \"border: 1px solid black; font size: 18px;\"> Style is an attribute\
    \ of division tag</div>\n```\n\nIn this example, two CSS features are used in\
    \ the div feature: border and font size structures.\n\nThe CSS layout declaration\
    \ contains the layout name and layout value. The name of the structure comes first,\
    \ then the colon, then the value. Here a common pattern for the following CSS\
    \ property-value is given below:\n\n```\nProperty-name: property-value\n```\n\n\
    If you specify more than one CSS property, each word – the cooked value is divided\
    \ into a semicolon as follows:\n\n```\nproperty1: property-value;\nproperty2:\
    \ property-value;\n```\n\nThe final local declaration does not have to end with\
    \ a semicolon, but makes it easy to add more CSS features without forgetting to\
    \ add that semicolon. There are many CSS features that you can specify in different\
    \ HTML elements. These CSS layouts are covered in their text.\n\n# CSS RULES\n\
    \nCSS rule is a set of one or more CSS elements to be applied to one or more targeted\
    \ HTML elements. CSS rule contains a CSS selector and a set of CSS layouts. The\
    \ CSS selector determines which HTML elements should be targeted by the CSS rule.\
    \ CSS features specify what styles of HTML objects are intended.\n\nThis example\
    \ creates a CSS rule that governs all div features, as well as a set of CSS locations\
    \ and size for target objects. The part of the CSS selector rule is the front\
    \ {. In the above example, it is part of the div of the CSS rule. CSS layouts\
    \ are listed within the block {...}. CSS rules must be specified within the style\
    \ element or within the external CSS file.\n\nHere is an example of CSS rule:\n\
    \n```\ndiv {\n  border: 1px solid black;\n  font size: 18px;\n}\n```"
