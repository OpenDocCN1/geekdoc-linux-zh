    \ var(--bg-color);\n  color: color(hotpink whiteness(25%));\n  @apply(--flex-center);\n\
    }\n```\n\n```\n.warn {\n  @apply(--flex-center);\n}\n```\n\ncssnext will transform\
    \ the styles into this:\n\n```\n.box {\n  background-color: #F9EC31;\n  color:\
