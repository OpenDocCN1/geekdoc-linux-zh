  md: "# CSS Functions ▆ 283\n\ncubic-bezier()\n\nThe cubic-bezier() can be used with\
    \ the transition timing function property to control how a transition will change\
    \ speed over its duration. The property accepts an easing function which describes\
    \ how the intermediate values used during a transition will be calculated.\n\n\
    The cubic-bezier() is an easing function that can provide a value for the transition-timing\
    \ function property. Some of the other easing functions include ease-in, ease-out,\
    \ linear, etc. However, the cubic-bezier() can be used to provide your own custom\
    \ curve.\n\n# Example:\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n<style>\n* {\n\
    \  padding:0;\n  margin:0;\n  box-sizing: border-box;\n}\n\n.demo_container{\n\
    \  padding:20px;\n  width:800px;\n  margin:0 auto;\n  justify-content: center;\n\
    \  align-items: center;\n}\n\n.ease {\n  transition: width 1s ease;\n}\n.cubic-bezier\
    \ {\n  transition: width 1s\n}\ncubic-bezier(.63,.05,.43,1.7);\n}\n.ease:hover,\n\
    .cubic-bezier: hover {\n  width: 80%;\nn}\n```"
