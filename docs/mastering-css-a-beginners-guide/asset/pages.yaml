    hsl()


    The hsl() function can be used to provide a color value when using CSS. It allows
    to specify that value by specifying the hue, saturation, and light components
    of the color.


    HSL (stands for Hue Saturation Lightness) is a hue-based representation of the
    RGB color space of computer graphics.


    The HSL model is considered to be more intuitive than the RGB model. The HSL model
    allows to select a base hue, and then adjust its saturation and lightness as desired.
    It accepts the HSL value as a parameter. The HSL value is provided as comma-separated
    three values that provide the hue, saturation, and light components, respectively.
    The hue can be identified by looking at the color circle.


    Here''s an example for displaying blue:


    ```

    HSL(240, 100%, 50%)

    ```'
