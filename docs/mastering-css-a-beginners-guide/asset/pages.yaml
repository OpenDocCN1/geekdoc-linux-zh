  md: "The syntax of the counter() function is as follows:\n\ncounter( <ident> [,\
    \ [<counter-style> | none ] ] )\n\n# Example:\n\n```\n<!DOCTYPE html>\n<html>\n\
    <head>\n<style>\n* {\n  padding:0;\n  margin:0;\n  box-sizing: border-box;\n}\n\
    .demo_container{\n  padding:20px;\n  width:800px;\n  margin:0 auto;\n  justify-content:\
    \ center;\n  align-items: center;\n}\nsection {\n  line-height: 0.8em;\n  counter-reset:\
    \ myCounter;\n}\nh1 {\n  font-size: 18px;\n}\np:before {\n  content: counter(myCounter)\
    \ \". \";\n  counter-increment: myCounter;\n}\n</style>\n</head>\n```"
