    # counter()


    The counter() allows you to display the counter that was generated by the element.
    Each element has a collection of multiple counters that are inherited from the
    document tree much like property values. You can create and manipulate counters
    with the counter increment, counter reset, and counter set properties. They have
    no visible effect by themselves but can be used with the counter() and counters()
    functions to display counter values in a specified format.


    For example, you can use the counter() to output an element''s counter in Upper
    Roman, Decimal, Georgian, etc. You can also specify Unicode code points to specify
    special symbols or icons to use as mark representations.


    **Syntax**: The counter() has two forms such as: counter(name) or counter(name,
    style). The text is the value of the innermost counter of the given name in scope
    at the pseudo-element; it is formatted in the indicated style (decimal by default).'
