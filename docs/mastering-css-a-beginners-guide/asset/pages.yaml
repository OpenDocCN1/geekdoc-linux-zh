  md: "# BASICS OF CSS FUNCTIONS\n\nattr()\n\nThe attr() function retrieves the value\
    \ of the selected element and can be used in the stylesheet. It can be used on\
    \ pseudo elements, in which case the value of the attribute on the pseudo element's\
    \ originating element is returned.\n\nExample:\n\n```\n<!DOCTYPE html>\n<html>\n\
    <head>\n<style>\n\n*{\n  box-sizing: border-box;\n}\n\nbody {\n  padding: 1em;\n\
    }\n.demo_container{\n  width:600px;\n  margin:0 auto;\n  justify-content: center;\n\
    \  align-items: center;\n}\nabr[title]:after {\n  content: \" (\" attr(title)\
    \ \")\";\n}\n\n</style>\n</head>\n<body>\n<div class=\"demo_container\">\n<h1>CSS\
    \ Function (:attr()) to return and display</h1>\n<p>This attr() function to return\
    \ and display the title attribute from an abbreviation given below </p>\n</div>\n\
    </body>\n</html>\n```"
