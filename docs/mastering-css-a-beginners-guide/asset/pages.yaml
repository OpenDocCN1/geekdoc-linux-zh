  md: '# CSS Functions ■ 305


    hue-rotate()


    Use the hue-rotate() to apply a hue rotation on an image. The CSS hue-rotate()
    is used with the filter property to apply a hue rotation to an image. Where you
    specify an angle around the color circle that the input samples will be adjusted.
    The hue-rotate() requires an argument to tell it how much rotate the hue.


    The syntax of the hue-rotate() function is as follows:


    ```

    hue-rotate() = hue-rotate([ <angle> | <zero> ] )

    ```


    # Does Hue Rotation Work?


    HSL (stands for Hue Saturation Lightness) is a hue-based representation of the
    RGB color space of computer graphics. The HSL model is considered to be more intuitive
    than the RGB model because, the HSL model allows to select a base hue, and then
    adjust its saturation and lightness as desired.


