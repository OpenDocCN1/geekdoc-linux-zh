  md: '# 412 Appraisal


    Your website may have thousands of pages that look similar. With CSS, you store
    style information in common files that everyone can share. When a user displays
    a web page, the browser loads the style along with the content of a page. When
    a user prints a webpage, you can provide information about a different style that
    the printed page is easy to read.


    In general, HTML is used to describe the content of a document, not its content.
    Of course, there are various exceptions to the rule, and HTML also provides some
    ways to specify style. For example, in HTML you can use the <b> tag to make text
    bold, and in the <body> tag you can specify the background color of the page.
    When you use CSS, you usually avoid using these HTML features, so all of your
    document''s styling information is in one place.


    CSS stands for Cascading Style Sheets. It is a language used to stylize a web
    page. Also, changing the look and layout of a web page using it is absolutely
    simple. You can also control how a website appears on different screens of different
    devices such as mobile phones, desktops, and tablets. You must have a thorough
    understanding of style language to use it properly.


    You can set the font, color, and size for an entire web page or a specific HTML
    element. However, a single CSS can be redirected to multiple web pages, allowing
    you to change the look of multiple pages at once. CSS is easy to learn and understand
    and provides a robust command over viewing an HTML document. Often CSS is combined
    with markup languages, that is, HTML or XHTML.


    # HOW CASCADING STYLE SHEETS WORK


    Cascading Style Sheet has a completely different approach to a web page style
    and layout. Every time an HTML document is viewed in a browser, the content comes
    with style information. Basically, the HTML file contains the content of a page
    and the style sheet contains information about the style of a page. Therefore,
    the main purpose of Cascade Style Sheets is to allow elements to appear in the
    HTML document. And these specified standards guide how content will be executed.


    There are various versions of CSS such as:


    +   - CSS1


    +   - CSS2


    +   - CSS3'
