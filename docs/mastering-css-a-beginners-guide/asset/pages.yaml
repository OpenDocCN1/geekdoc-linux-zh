  md: "# CSS Plugins ■ 399\n\nThere are official tools that allow you to use PostCSS\
    \ with build systems such as Webpack, Gulp, and Grunt. A console interface is\
    \ also available. Browserify or Webpack can use to open PostCSS in a browser.\
    \ PostCSS plugins perform a variety of CSS processing tasks, from parsing and\
    \ sorting properties to minification.\n\nA full list of plugins can be found at\
    \ postcss.parts with some examples listed below:\n\n+   - Autoprefixer for adding\
    \ and deleting browser prefixes. CSS modules for isolating CSS selectors and organizing\
    \ code. It comes as part of Webpack.\n- styleint for analyzing CSS code errors\
    \ and checking style consistency.\n- styleymtf fixes CSS code according to styleint\
    \ settings.\n- PreCSS to perform some Sass/Less preprocessing functionality.\n\
    - postcss-preset-env to emulate features from draft CSS specifications.\n- cssnano\
    \ to reduce CSS size by removing whitespace and rewriting code.\n- RTLCSS to change\
    \ the CSS code so that the design is suitable for right-to-left typing.\n- postcss-assets,\
    \ postcss-inline-svg, and postcss-sprites for working with graphics.\n\nWe discuss\
    \ some of the plugins in brief.\n\n# POSTCSS-MODULES (CSS MODULES)\n\nA Module\
    \ is a CSS file in which all class and animation names are scoped locally by default.\
    \ All URLs (url...) and @imports are in module request format (.xxx and .xxx means\
    \ relative, xxx and xxx/yyy means in modules folder, i. in node-modules).\n\n\
    CSS Modules compile to a low-level interchange format called ICSS or Interoperable\
    \ CSS but are written like normal CSS files:\n\n```\n/* style.css */\n.className\
    \ {\n  color: green;\n}\n```"
