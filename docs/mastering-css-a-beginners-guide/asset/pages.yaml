    \ and cssnano\n\nUsing npm:\n\n```\n$ npm install --save-dev postcss postcss-cli\
    \ postcss-cssnext cssnano\n```\n\nOr through Yarn command:\n\n```\n$ yarn add\
    \ postcss postcss-cli postcss-cssnext cssnano --dev\n```\n\n# Using the PostCSS-CLI\n\
    \nYou use the PostCSS command line (cmd) interface by giving the input, output\
    \ files, and PostCSS plugin(s) to use. It specifies the plugins with the -use\
    \ flag, the output file with the -output flag, and the input file is processed\
    \ without any flags using the following command:\n\n```\n$ postcss --use postcss-cssnext\
    \ --use cssnano --output styles-out.css styles.css\n```\n\nYou can use the PostCSS\
