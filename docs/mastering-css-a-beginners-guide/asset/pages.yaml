  md: "# CSS Functions ■ 331\n\nSyntax: This function uses the same syntax as the\
    \ radial-gradient() function, which is as follows:\n\n```\n<radial-gradient> =\
    \ radial-gradient(\n [ <shape> || <size> ] [ at <position>?, |\n at <position>?>\n\
    \ <color-stop>, <color-stop> ]+\n)\n```\n\nThe repeating-radial-gradient() function\
    \ accepts the following values:\n\n+   * shape: It specifies the shape of the\
    \ gradient. It can be either circle or ellipse.\n* size: It specifies the size\
    \ of the ending shape. The values are given below:\n  * closest side\n  * farthest\
    \ side\n  * closest corner\n  * length (for circles)\n  * [length | percentage]\
    \ (for ellipses)\n* position: it specifies where the gradient should be located.\
    \ The values are given below:\n  * top\n  * right\n  * bottom\n  * left\n  * center"
