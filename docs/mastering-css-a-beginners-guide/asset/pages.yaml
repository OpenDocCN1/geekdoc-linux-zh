    : \"postcss .public/css/style.css --use autoprefixer -d /public/prefixed\"\n \
    \ },\n  \"author\": \"\",\n  \"license\": \"ISC\"\n}\n```\n\nYour prefixing script\
    \ is complete.\nAdd a new key named browserslist as given below:\n\n```\n{\n \
    \ \"browserslist\":\n}\n```\n\nAnd then give browserslist a value of last four\
    \ versions:\n\n```\n{\n  \"name\": \"joeblow\",\n  \"version\": \"1.0.0\"\n}\n\
    ```"
