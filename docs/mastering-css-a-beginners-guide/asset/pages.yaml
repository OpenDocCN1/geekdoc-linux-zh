    filter()

    filter() function is used to apply a filter to an image. The filter() function
    allows you to apply filters to images. It is similar to the filter property, except
    that it''s a function, and therefore can be used as a value itself. For example,
    you can use it with the background-image property to apply a filter to the background
    image.'
