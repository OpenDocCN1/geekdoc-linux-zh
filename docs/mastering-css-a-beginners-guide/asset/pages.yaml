  md: 'There are various types of CSS such as:


    +   * Embedded CSS

    * Inline CSS

    * External CSS

    * Import CSS (link tag)


    # WHY SHOULD SOMEONE LEARN CSS?


    +   * It is must to learn the language for web development.

    * Using it you will be able to design unique looking websites.

    * Gives you access to almost any item that appears on the screen.

    * You can shape any item to your liking.

    * You can add effects to great looking web pages.

    * You can create animations such as moving objects or shapes using CSS.

    * Learning CSS lets you design responsive websites that fit any device size.

    * If you learn and understand, you can learn and work with many CSS-based frameworks
    like Bootstrap.


    # PROPERTIES OF CSS


    +   * Knowledge of CSS and HTML is essential if anyone wants to pursue a career
    in web design professionally.

    * With the use of CSS, we can control various styles such as text color, font
    style, spacing between paragraphs, column size and layout, background color and
    images, layout design, display variations for different screens and devices, and
    many other effects too.

    * CSS has control over HTML documents, so it''s easy to learn. It is integrated
    with HTML and XHTML markup languages.'
