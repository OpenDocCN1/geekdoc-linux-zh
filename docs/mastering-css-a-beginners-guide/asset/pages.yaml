    \nThe counters() enables to display nested counters that have been generated by\
    \ an element and its parent/s.\n\nEvery element has a collection of more counters,\
    \ which are inherited from the document tree in a similar way to property values.\
    \ You can create and manipulate counters with the counter-increment, counter-reset,\
    \ counter-properties. It has no visible effect itself, but it can be used with\
    \ the counters() and counter() functions, which allow the values of counters to\
    \ be displayed, in the format you specify.\n\nThe counters() have two forms: counters(name,\
    \ string) or counters(such as name, string, style). The text is the value of counters\
    \ with the given name in scope at pseudo-element, from outermost to innermost\
    \ by the specified string. The counters are rendered in the indicated style (decimal\
    \ by default)."
