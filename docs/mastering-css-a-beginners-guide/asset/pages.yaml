  md: '# DIFFERENT TYPES OF CSS YOU CAN USE


    There are three ways to write CSS for a web page. You have to decide which one
    is better for you, but we recommend using an External Style Sheet, which is the
    third type we''ll learn today.

    Here are three ways to use CSS:


    +   1. Inline styles: It is placed inside HTML elements.

    2. Internal styles: It is placed in the <head> tag section of the web page you
    are writing.

    3. External Styles: It is placed in the External Style Sheet, which is a separate
    page that links to the web page (recommended).


    An explanation of CSS methods is given below:


    +   External style sheet: The external CSS file can be created using any text
    or HTML editor like "Notepad" or "Dreamweaver." A CSS file contains no HTML elements
    tags, only CSS. You can link the file externally by keeping one of the following
    links in the head section of each (X)HTML file that you want to style with CSS
    file.


    ```

    <link type="text/css" rel="stylesheet"

    href="Path To stylesheet.css" />

    ```


    You can also use the @import method like <style type="text/css"> @import url(''Path_to_stylesheet.css'')</style>.


    Example:


    ```

    <head>

    <title> Title <title>

    <link type="text/CSS" rel="stylesheet"

    href="style.css" />

    </head>

    <body>

    or,

    <head>

    <title> Title <title>

    ```'
