  md: "Once npm has downloaded and installed the packages, need to go back into package.json\
    \ and add a script for npm to run, just like when you installed Sass. Add a new\
    \ script named \"prefix\" after the \"sass\" script:\n\n```\n{\n  \"name\": \"\
    abc\",\n  \"version\": \"1.0.0\",\n  \"description\": \"abc\",\n  \"main\": \"\
    index.js\",\n  \"scripts\": {\n    \"sass\": \"sass ./sass/main.scss:../public/css/style\"\
    ,\n    \"prefix\": \"style compressed\"\n  },\n  \"author\": \"\",\n  \"license\"\
    : \"ISC\"\n}\n```\n\nAnd inside the script need to tell npm to use the new postcss\
    \ package you just installed and also where to find your compiled CSS file:\n\n\
    ```\n{\n  \"name\": \"abc\",\n  \"version\": \"1.0.0\",\n  \"description\": \"\
    abc\",\n  \"main\": \"index.js\",\n  \"scripts\": {\n    \"sass\": \"sass ./sass/main.scss:../public/css/style\n\
    \    -w --style compressed\",\n    \"prefix\": \"postcss ./public/css/style.css\"\
    \n  },\n  \"author\": \"\",\n  \"license\": \"ISC\"\n}\n```\n\nAfter you need\
    \ to instruct npm which package to use and where to find the CSS file, to use\
    \ Autoprefixer by implementing – use flag followed by Autoprefixer as given below:\n\
    \n```\n{\n  \"name\": \"abc\",\n  \"version\": \"1.0.0\"\n}\n```"
  merge: -1
