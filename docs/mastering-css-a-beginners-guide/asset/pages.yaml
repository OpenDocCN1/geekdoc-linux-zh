  md: '# CSS PADDING


    The padding CSS property sets the margin on all four sides of the element. It
    is a property used for padding-top, padding-right, padding-bottom, and padding-left
    properties. The syntax of this property is given as:


    padding : [ length | percentage | auto ] 1 to 4 values | initial | inherit


    Example:


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <style>

    .demo_container{

    width:600px;

    margin:0 auto;

    text-align: center;

    justify-content: center;

    border:1px solid red;

    align-items: center;

    }


    text-1 {

    border-style: solid;

    padding: 25px;

    }

    .text-2{

    border-style: solid;

    padding: 20px 20px 20px 20px;

    }

    .text-3{

    border-style: solid;

    padding: 30px 30px;

    }

    .text-4{

    border-style: solid;

    padding: 30px 0px 30px 0px;

    }

    </style>

    </head>

    ```'
