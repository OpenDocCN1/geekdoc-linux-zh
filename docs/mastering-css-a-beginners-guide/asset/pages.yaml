  md: '# CSS BACKGROUND PROPERTIES


    The background is a shorthand property for setting a single background property,
    that is, background-image, background-position, background-size, background-repeat,
    background-attachment, background-origin, background-clip, and background-color
    in a single declaration.


    The syntax of this property is given as:


    ```

    background: [ the image position/size repeat attachment the origin clip color
    ] | initial | inherit

    ```


    +   1. background-attachment property: The background-attachment property defines
    whether the background image scrolls with the document or remains fixed to the
    viewing area. The syntax of this property is given as:


    ```

    background-attachment: scroll | fixed | initial | inherit

    ```


    +   2. background-color property: The background-color property sets the background
    color of an element. You can set the color of the background element through either
    a color value or the keyword transparent.


    The background of any element is the whole size of the element, including padding
    and border (not the margin). See the box model. The syntax of this property is
    given as:


    ```

    background-color: color | transparent | initial | inherit

    ```


    +   3. background-clip property: The background-clip property specifies whether
    an element''s background, either the color or image, extends it''s border or not.
    The syntax of this property is given as:


    ```

    background-clip: border-box | padding-box | content-box | initial | inherit

    ```


    Example:


    ```

    <!DOCTYPE html>

    <html lang="en">

    <head>

    ```'
