    # skew()


    The CSS skew() function is used to skew elements in two-dimensional space. The
    skew() element performs a shear transformation (also known as a shear mapping
    or a transvection), which displaces each point of an element by a given angle
    in each direction.


    Skewing an element is kind of like taking the points of an element, pushing or
    pulling them in different directions, based on a given angle. The skew() function
    works like this:


    +   * skew(ax) or

    * skew(ax, ay)


    # Example:


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <style>

    ```'
