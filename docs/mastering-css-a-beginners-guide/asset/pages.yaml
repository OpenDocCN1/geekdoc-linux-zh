  md: "# 382 Mastering CSS\n\nin which to use for prefixing if you'd like, but I'd\
    \ argue that Autoprefixer is easier, does a better job, and you don't need both.\n\
    \nWhat is the Difference Between Autoprefixer and -Prefix-Free?\nPrefix-free is\
    \ a client-side JavaScript library. It is included on your page as an additional\
    \ request. It runs, finds all the CSS it can find, figures out what prefixes may\
    \ be needed, and injects new CSS onto the page after the CSS finds.\n\n+   - Downsides:\
    \ extra request, flash-of-un-prefixed-styles, not cached, few styles it can't\
    \ do (e.g., filter).\n- Upsides: smaller CSS, only injects prefixes current browser\
    \ needs.\n\nAutoprefixer processes your CSS server-side. At least, that's how\
    \ we're doing it because it seems to be the canonical source for the project.\n\
    \n+   - Downsides: larger CSS (but not big as \"just prefixing everything\")n-\
    \ Upsides: prefixes perfectly to what you support, final CSS is cache-able, handles\
    \ tricky fallbacks (e.g., flexbox).\n\n# CSSnext\n\nPostCSS is a new tool that\
    \ makes easy to develop JavaScript plugins that transform styles. This opens up\
    \ a new world of possibilities for new plugins that make working with CSS easier\
    \ and easier. The post introduces two popular CSS plugins: cssnext andnano.\\\
    \ cssnext lets you use the future of CSS today. You can use features that are\
    \ not supported in all browsers, such as CSS variables and CSS color functions.\
    \ cssnext transforms your styles to work in all browsers. In other words, cssnext\
    \ allows us to write styles with real CSS syntax instead of another preprocessor\
    \ syntax. cssnext will automatically add vendor prefixes to your styles, so you\
    \ don't have to use the prefixes yourself when writing CSS.\n\nTo give you an\
    \ example, let's say you have the following CSS styles:\n\n```\n:root {\n  --text:\
    \ pink;\n  --bg-color: #FFEC31;\n  --flex-center: {\n```"
