  md: "# CSS MEDIA TYPES\n\n# INTRODUCTION TO MEDIA TYPES\n\nOne of the most important\
    \ features of stylesheets is that you can specify different style sheets for different\
    \ types of media. This is a good way to create Web pages ready for printer – It\
    \ provides a separate style sheet for the “print” media type.\n\nSome CSS features\
    \ are for media only. For example, the page sorting feature only applies to pages\
    \ with pages. There are other few things that can be shared by different media\
    \ types, but they may require different values for that feature. The font size\
    \ feature, for example, can be used for screen and print media, but ideally at\
    \ different values.\n\nDocumentation often requires a large font on a computer\
    \ screen compared to paper for better reading, and sans-serif fonts are considered\
    \ easy to read on screen, while serif fonts are famous for printing. It is therefore\
    \ necessary to clarify that a style sheet, or set of style rules, applies to certain\
    \ types of media.\n\n# METHOD 1: USING @MEDIA AT-RULES\n\nThe @media rule is used\
    \ to define different style rules for different media in a single style sheet.\
    \ It is followed by a comma separated list of media types and a CSS declaration\
    \ block containing targeted media style rules.\n\nExample: The style tells the\
    \ browser to display body content in 14 pixels font on the screen, but when printing\
    \ it will be in Times 12pt.\n\n```\n@media screen {\n  body {\n    color: black;\n\
    \    font-size: 12px;\n  }\n}\n@media print {\n  body {\n    color: #fff;\n  \
    \  font-size: 10pt;\n  }\n}\n```"
  merge: -1
