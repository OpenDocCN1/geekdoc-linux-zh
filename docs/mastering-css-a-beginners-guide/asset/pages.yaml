  md: '# 414 Appraisal


    +   - Understanding other associated technologies such as Angular, PHP, and JavaScript
    becomes clearer once we know some of the basics of CSS and HTML.


    In CSS, you can use various CSS properties such as:


    +   - CSS Color Codes: It is a color picker, color charts, and code examples all
    in one page. It includes hex values, RGB, color names, transparency, and opacity.


    +   - CSS @Rules: There is a list of CSS at-rules. At-rules (or @rules) defining
    rules or values for the stylesheet. They start with an @ followed by their name.


    +   - CSS3 Properties: There is a list of properties introduced in CSS3. It includes
    animations, flexbox, gradients, multi-column layouts, and more.


    +   - CSS Marquees: To create scrolling text and images in a standards-compliant
    way, we use CSS Marquees.


    +   - CSS Patterns: CSS gradients are just fading from one color to another.


    +   - CSS Media Types: It is used with media queries. You can apply a separate
    style depending on the media type that''s displaying your web page.


    +   - CSS Media Features: You can use media queries to apply a separate style
    depending on the media features available in the output device such as phone,
    tablet, and laptop.


    +   - Floating Menu: You can add a quick code to make a hovering menu.


    +   - CSS Background Color: You can also set the background color of an HTML element.


    +   - CSS Leading: You can also apply the CSS equivalent of leading to your text.


    +   - CSS Align: You can align elements vertically and horizontally.


    +   - CSS Table Width and Cellpadding: You can use CSS to set the width of your
    tables with cellpadding.'
