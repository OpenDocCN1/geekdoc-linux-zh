  md: '# Mastering CSS


    You can change the location of the HTML tag with the help of CSS. You can set
    things as an image on any part of a web page as needed.


    # DIFFERENT VERSION OF CSS


    +   - CSS1 and CSS2 (no longer applicable) – Released from W3C as a recommendation
    in December 1996. This version defines the CSS language and the visual formatting
    model for all HTML tags. These were the two versions of CSS that are no longer
    updated or maintained.

    - CSS2.1 (recommended) – W3C recommendation in May 1998 and built on CSS1. This
    version adds support for specific media style sheets, for example, audio printers
    and devices, downloadable fonts, object layouts, and tables. This version has
    many bugs and problems in CSS2 and is now the official, recommended version of
    CSS.

    - CSS3 became a W3C recommendation in June 1999 and was built on older versions
    of CSS. It is divided into texts called Modules, and here each module has new
    extension features beyond CSS2. These versions build on CSS2.1, adding new functionality
    and maintaining compliance. Some features are still being tested and may change
    in the future. Use this with caution, as it may cause problems with your site.


    CSS3 is the latest standard for CSS earlier versions (CSS2). The main differences
    between CSS2 and CSS3 are as follows:


    +   - Media Queries

    - Namespaces

    - Selectors Level 3

    - Color

    - CSS4 has never become an official version.


    # MAJOR DIFFERENCES BETWEEN CSS, CSS2, AND CSS3


    CSS was originally released in 1996 and contains features to add font layouts
    such as typeface and text color emphasis, background, and other features. CSS2
    was released in 1998 with additional styles for other media types to be used to
    design page layouts. CSS3 was released in 1999 and'
  merge: -1
  pgno: 22
- img_proc: true
  md: '# CSS: Introduction 5


    presentation style structures were added to it, allowing you to create a presentation
    from documents.


    With CSS3, designers can now use special fonts, such as those found on Google
    Fonts and Typecast. Previously, with CSS and CSS2, designers could only use "secure
    web fonts" to ensure 100% of fonts that always look the same throughout the machine.


    # CSS SPECIFICATION


    All web-level technologies (HTML, CSS, JavaScript, etc.) are defined in large
    documents called specifications (or "specs"), published by standard organizations
    (such as W3C, WHATWG, ECMA, and Chronos) and describe how those technologies should
    behave. CSS is no other – it is developed by an internal W3C team called the CSS
    Working Group. Group is made up of representatives of browser vendors and other
    companies interested in CSS. There are also other people, known as invited experts,
    who act as defendant affiliated with the member organization.


    New CSS features are developed by the CSS Working Group sometimes because a specific
    browser is interested in a specific skill, sometimes because designers and developers
    request a feature, and because the Working Group has identified a requirement.
    CSS is constantly evolving, with new features available. The important thing about
    CSS is that everyone works hard so they never change in a way that can break old
    websites. A website built in 2000 that used the limited CSS that existed then,
    should still be used in the browser today!


    As a newcomer to CSS, you may find the CSS specification too great – it is intended
    for developers to apply feature support to user agents, not for web developers
    to learn to understand CSS. Many experienced developers would prefer to look at
    MDN documents or other sources. However, it is worth knowing that these features
    exist and to understand the relationship between the CSS you are using, browser
    support (see below), and details.


    # CSS MODULES


    As there are many things you can style with CSS, the language is divided into
    modules. You will see a reference to these modules as you explore MDN. Many text
    pages are organized around a specific module. For example, you can refer to the
    MDN reference in the Background and Boundaries module to find out its purpose
    is with the properties and features it contains'
  merge: -1
