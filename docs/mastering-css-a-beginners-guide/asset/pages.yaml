  md: '# CSS: Introduction


    CSS documents are used to define a web page style, then linked to an HTML document
    (document in a different tag language) contains the content and layout of the
    page. Setting the style directly to the HTML document is possible but not recommended.
    CSS texts can be created in any text editor, such as Text Editor on Mac or Notepad
    for Windows, as well as many free paid options that you can download.


    # HOW DOES CSS WORK?


    CSS contains the rules and values that a web browser can use in the content of
    a web page to better display its content. For example, you can use to define that
    the body part of a page has a blue background, that the text is displayed in a
    white Helvetica font with a size of 18px. CSS rules are read by a specific document
    format (hence the word “cascading” in Cascading Style Spreadsheets). In general,
    the next step in a CSS document is the winner – unless the first rule is clear.
    For example, you might have two rules for your conflicting CSS file – as setting
    body font in blue and section font in green. In this case, the effective rule
    will be the category font, because it is much clearer than the body font.


    # CSS SYNTAX


    Now on to the original CSS. The first thing we do is make the paragraph content
    a different color. So the type or paste into your style file.css.


    ```

    p { color: blue; }

