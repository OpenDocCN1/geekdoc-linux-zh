    # rotate3d()


    The rotate3d() function is used to rotate elements in three-dimensional space.
    The rotate3d() function rotates the element along the x, y, and z axes using the
    angle provided as an argument.


    The syntax of the rotate3d() function is as follows:


    ```

    rotate3d() = rotate3d( <number>, <number>, <number>, <angle> ).

    ```


    The first three parameters describe the [x, y, z] direction vectors. The fourth
    parameter specifies the angle to be used. It works like this:


    +   - x: It describes the x-coordinate of the vector denoting the axis of rotation.

    - y: It describes the y-coordinate of the vector denoting the axis of rotation.

    - z: It describes the z-coordinate of the vector denoting the axis of rotation.

    - a: It represents the angle of the rotation. A positive results in a clockwise
    rotation, and a negative results in a counter-clockwise rotation.'
