  md: "# CSS Plugins ■ 381\n\n```\n\"description\": \"Joe Blow's web portfolio\",\n\
    \"main\": \"index.js\",\n\"scripts\": {\n  \"sass\": \"sass /sass/main.scss:./public/css/style.css\n\
    \  css -w --style compressed\",\n  \"prefix\": \"postcss ./public/css/style.css\
    \ --use autoprefixer -d ./public/css/prefixed/\"\n},\n\"author\": \"\",\n\"license\"\
    : \"ISC\",\n\"browserslist\": \"last 4 versions\"\n}\n```\n\nNow you are ready\
    \ to autoprefix CSS! Let's move into the terminal and run the prefix script:\n\
    \n```\n$ npm run prefix\n```\n\nTake a look at the new, prefixed, CSS in your\
    \ CSS file, a new block will be added:\n\n```\n.section {\n  background: #15DEA5;\n\
    \  height: 10rem;\n  display: -webkit-box;\n  display: -ms-flexbox;\n  display:\
    \ flex;\n  -webkit-box-align: center;\n  -ms-flex-align: center;\n  align-items:\
    \ center;\n  -ms-flex-wrap: wrap;\n  flex-wrap: wrap;\n  width: 100%;\n}\n```\n\
    \nNow our website will display properly and uniformly across all compatible browsers.\n\
    \nDoes It Run?\n\nAutoprefixer is the very last thing that runs when processing\
    \ your CSS. So if you use Sass, LESS, or Stylus, that will first process, then\
    \ Autoprefixer. You are still free to use a preprocessor add-on (e.g., Compass,\
    \ LESSHat, etc.)."
