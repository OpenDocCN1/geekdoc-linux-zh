  md: '# CSS Properties


    take parameters to determine the level of transformation (e.g., the angle to rotate
    an element).


    The syntax of transform is given below:


    ```

    transform: none | <transform-function> [ <transform-function> ]

    ```


    These are grouped by 2D (two-dimensional) and 3D (three-dimensional) functions.


    +   **matrix():** It specifies a 2D transformation in the form of a matrix of
    the six values a-f.


    The syntax of matrix is given below:


    ```

    matrix() = matrix(<number>, [<number>]{5,5} )

    ```


    +   **translate():** It moves the position of the element. It specifies a 2D translation
    by the vector [x, y], where x is the first translation-value parameter and y is
    the optional second translation-value parameter.


    The syntax of translate is given below:


    ```

    translate(<translation-value>[, <translation-value>] )

    ```


    +   **translateX():** It moves the element horizontally. It specifies a translation
    by the given amount in the X direction.


    The syntax of translateX is given below:


    ```

    translateX(<translation-value> )

    ```


    +   **translate():** It moves the element vertically. It specifies a translation
    by the amount in the Y direction.


    The syntax of translateY is given below:


    ```

    translateY(<translation-value> )

    ```


    +   **scale():** It modifies the size of the element. It specifies a 2D scale
    operation by the [sx,sy] vector described by two parameters.


    The syntax of scale is given below:


    ```

    scale(<number>[, <number>] )

    ```'
