    # ellipse()


    The ellipse() function is a CSS basic shape value that''s part of the CSS shapes
    module. The basic shapes such as ellipse() can be used as a value for properties
    such as shape-outside to control the flow of content (code) around the element,
    and clip-path to clip the element''s contents to the basic shape. It means you
    can have text flowing around the element in the shape of an ellipse, have an image
    clipped to the shape of an ellipse, etc.


    The syntax of the ellipse() function is as follows:


    ```

    ellipse() = ellipse([shape-radius{2}]? [at <position>] )

    ```'
