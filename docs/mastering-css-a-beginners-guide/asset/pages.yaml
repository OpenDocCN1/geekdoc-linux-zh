  md: '# 52 ■ Mastering CSS


    The following section consists of the complete list of standard CSS properties
    belonging to the latest CSS3 specifications. All the properties are grouped into
    categories given below:


    +   CSS animation properties: The animation property is a CSS property for animation-name,
    animation-duration, animation-direction, animation-timing-function, animation-delay,
    animation-iteration-count, animation-fill-mode, and animation-play-state. Here
    is the default value of the animation property:


    ```

    none ease 0 1 with normal none running

    ```


    It applies to all elements, before and after (::other pseudo-elements). The following
    table describes the values of animation property:


    +   1. animation-name: The animation-name CSS property defines the name of @keyframes
    defined animations that should be applied to the selected element. The syntax
    of the property is given below:

    animation-name: keyframe name | none | inherit |


    +   2. animation-duration: The animation-duration CSS property defines the number
    of seconds or milliseconds animation must take to complete one cycle. The syntax
    of this property is given as:

    animation-duration: time | initial | inherit


    +   3. animation-timing-function: : The animation-timing-function CSS property
    specifies how a CSS animation should progress over the duration of each cycle.
    The syntax of this property is given as:

    animation-timing-function: linear | ease | ease-in | ease-out | ease-in-out |
    cubic-bezier(n,n,n,n) | initial | inherit


    +   4. animation-delay: It specifies a delay before the animation will start.
    The animation-delay CSS property defines when the animation will start. The value
    of this property can be specified in seconds (s) or milliseconds (ms).'
  merge: -1
  pgno: 70
- img_proc: true
  md: 'The syntax of this property is given as:


    animation-delay: time | initial | inherit


    +   5. animation-iteration-count property: The animation iteration property defines
    the number of times an animation cycle should play before stopping.


    The syntax of this property is given as:


    animation-iteration-count: number | infinite | initial | inherit


    +   6. animation-direction property: The animation-direction CSS property specifies
    whether the animation should be played in reverse on alternate cycles or not.


    The syntax of this property is given as:


    animation-direction: normal | reverse | alternate | alternate-reverse | initial
    | inherit


    +   7. animation-fill-mode property: The animation-fill-mode property defines
    how a CSS animation apply styles to the target before and after it is executing.


    The syntax of this property is given as:


    animation-fill-mode: none | backwards | forwards | both | initial | inherit


    The following table defines the values of this property:


    | Value | Description |

    |---|---|

    | none | The animation will not apply to the target before or after it is executing.
    |

    | forwards | After the animation ends, the animation will apply the values for
    the time animation ended. |

    | backwards | The animation will apply the values defined in the keyframe that
    will start the first iteration of the animation, during the period defined by
    the property. Either of the values of from keyframe or to those to keyframe. |


    +   8. animation-play-state property: The animation-play-state property specifies
    whether an animation is playing or paused.


    The syntax of this property is given as:


    animation-play-state: paused | running | initial | inherit'
