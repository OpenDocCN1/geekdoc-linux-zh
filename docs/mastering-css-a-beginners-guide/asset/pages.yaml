    # DIFFERENT TYPES OF SELECTORS


    There are many different selectors. The examples above use item selectors that
    select all items of a given type. But we can also make specific choices. Here
    are some of the common types of selectors:


    # Selector Name


    +   - The CSS element selector: This selector selects HTML elements based on the
    element name.


    # Syntax:


    ```

    <p>

    ```


    +   - The CSS id selector: The selector uses the id attribute of an element to
    select a particular element. The id is unique in a single page, so the id is used
    to select a unique element. To select a particular element with an id, write a
    hash (#) symbol, followed by the id of the element.


    # Syntax:


    ```

    <p id="my-id"> or <a id="my-id">

    ```


    +   - The CSS class selector: The selector classes HTML elements with a specific
    class attribute. To select these elements with a particular class, write a dot
    (.) character, followed by the class name.'
