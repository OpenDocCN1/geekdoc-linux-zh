  md: '# Mastering CSS


    such as Firefox, Chrome, Edge, are designed to deliver text by a view, for example,
    on a computer screen, projector, or printer.


    Cascading Style Sheets (CSS) is a programming language that integrates all relevant
    information related to web page displays. CSS defines the style and format of
    a website or page, including layout, colors, fonts, padding (space around each
    element), and more. Along with HTML and Javascript, CSS forms the basis of how
    the Internet works. All three standards and specifications are also maintained
    by the World Wide Web Consortium (W3C).


    CSS can be used to create a very basic text style – for example, to change the
    color and size of titles and links. It can be used to build a structure, to convert
    a single column of text into a structure with the main content area and a different
    bar for related information. It can be used for effects such as animation.


    # HISTORY


    CSS is highly regarded by the Norwegian Håkon Wium Lie, who in 1994 wanted to
    create a standard style sheet for the World Wide Web. The first website Lie tried
    for CSS is the Arena web browser. Its initial creation, Lie has gone on to co-produce
    versions of CSS-1, CS-2, and RFC 2318 with Tom Berners-Lee and Robert Caillau.
    In its first decade of existence (1994–2004), CSS in all its clarity became a
    standard that had a significant impact on the look of the World Wide Web as we
    know now. CSS was released in 1999.


    CSS is one of the core technologies used on the web (the other two being HTML
    and JavaScript). CSS stands for Cascading Style Sheets – the links are actually
    in terms "cascading" and "style" with cascading describing how one style can go
    from one to another.


    One of the various benefits of CSS is that more than a single style can be used
    within a single HTML document. CSS is used to define what HTML code looks like
    on a website. HTML (Hypertext Markup Language) is used to create content, including
    text, CSS changes the way a web page will look. Thus, depending on the data they
    want to display, the developer may choose to have a page with other tabs running
    at the top of the page or on the side.


    Alternatively, some developers may choose to use titles and subtitle styles to
    ensure that words appear on the page or alter or redesign the existing web page.
    Perhaps the best way to describe what CSS does is to explain that the page would
    like to be free to use CSS. Without CSS web'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# CSS: Introduction ■ 3


    pages are clear and far from inspiring. Words scroll through the page and read
    hard. But, before CSS that was exactly what web pages looked like. The introduction
    of CSS is responsible in part for what the web looks and feels today. And, from
    being created and as a result, it is a continuously evolving language. Web standards
    are a topic close to Lie''s. Since the introduction of CSS, he has appealed to
    major technology players like Microsoft and other browsers to support the standard
    web standards and continue to improve.


    # WHY WE NEED CSS?


    First, applying CSS ensures that your web pages are consistent. If your website
    has 100 pages, now imagine that you have to enter a code to define sizes, layout,
    and other display data and all the content you want to produce a new web page.
    Also, imagine having a 100-page site and being able to change one of them while
    keeping everything the same.


    CSS also makes that possible. Using CSS brings flexibility where needed, but it
    is flexible enough to be able to make changes to an individual page or a section.


    # WHY DO WE USE CSS?


    For a website to work properly, it must have a fast download time. Nowadays, people
    usually wait a few seconds for a website to load. Therefore, it is important to
    ensure a fast pace. For companies looking to ensure fast and smooth website information,
    CSS becomes key to their success.


    CSS is easy to maintain due to the short maintenance time. This is because single-line
    code conversion affects the entire web page. Also, if upgrades are needed, make
    a small effort.


    You would not find many good and easy-to-use websites. One thing that is common
    to all of these websites is the consistency of construction. CSS empowers developers
    to ensure that style features are applied consistently across every few web pages.


    Due to its speed and easy maintenance, CSS saves a lot of time and effort in the
    web development process due to its fast loading time. Here, a little time ensures
    the good performance of the designer.


    People use different smart devices to view a particular website. It can be a smartphone,
    PC, or laptop. For this purpose, websites are required to be compatible with the
    device. CSS ensures smooth operation by providing better alignment.'
  merge: -1
  pgno: 21
