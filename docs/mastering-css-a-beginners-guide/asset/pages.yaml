    # repeating-radial-gradient()


    The CSS repeating-radial-gradient() allows to create a radial gradient that repeats
    over and over again. CSS gradients allow you to apply multiple bg colors to an
    element that blend from single color to the next. Repeating radial gradients are
    gradients where the color stops are repeated infinitely. Radial gradients have
    a circular or elliptical shape. When creating a radial gradient, indicate the
    center of the gradient as well as the size and shape.'
