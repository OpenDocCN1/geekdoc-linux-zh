  md: '# CSS Selectors


    IN THIS CHAPTER


    +   * Introduction

    * Universal Selector

    * Logical Combinations Selectors

    * Attribute Selectors

    * Pseudo-Classes

    * Combinators Selectors


    In the last chapter, we discussed various CSS properties, and now we have another
    important CSS: Selector. The selector means that the user can select any of the
    properties like classes, id, or tag names using the selector. The code can have
    various classes, but only unique id in it.


    INTRODUCTION

    Here is the list of the most common and well-supported CSS selectors. There are
    many more, but these are the ones you should know well.


    +   * Type Selector: a { }

    * ID Selector: #a { }

    * Child Selector: a > b {}

    * Descendant Selector: a b { }


