  md: '# CSS Plugins


    IN THIS CHAPTER


    +   - Introduction

    - Various CSS Plugins Based on PostCSS

    - Autoprefixer

    - CSSnext

    - CSS MarqueeMenu Plugin


    In the last chapter, we studied CSS functions. In this chapter, we will discuss
    some plugins that are based on PostCSS and also work with JavaScript or any other
    programming language. So PostCSS plays a major role in it. All other plugins are
    defined in PostCSS. PostCSS is a versatile tool that allows to transform CSS styles
    using JavaScript plugins. Its flexibility lies in the way it is built. The core
    of PostCSS is a Node.js module that you can install using npm, it has over 200
    plugins that you can choose to use in your project. PostCSS is a framework for
    developing various CSS tools. It can be used to develop template languages like
    Sass and LESS. PostCSS consists of a CSS parser that generates an abstract syntax
    tree.


    We also have pre- and post-processing scripts that run before the pre-processing
    scripts run before the value checking and validation rules are completed, and
    the postprocessing scripts run after these processes.'
  merge: -1
  pgno: 393
- img_proc: true
  md: "PostCSS is neither preprocessor nor postprocessor, as various PostCSS plugins\
    \ can fall into one or both of these categories; it's entirely up to you what\
    \ you make of it. With PostCSS, you don't have to learn another syntax like Sass\
    \ or LESS; you can start using it immediately.\nPostCSS will take your existing\
    \ CSS file and convert it to JavaScript readable data, then the JavaScript plugins\
    \ will make the modifications and PostCSS will return the modified version of\
    \ the original file.\n\n# VARIOUS CSS PLUGINS PostCSS BASED\n\nThere are various\
    \ plugins available in the market as given below:\n\n+   1. Autoprefixer\n2. CSSnext\n\
    3. CSSNano\n4. PreCSS\n5. StyleLint\n6. PostCSS Assets\n7. Font Magician\n8. Lost\
    \ Grid\n9. PostCSS\n10. PostCSS-modules\n\n# AUTOPREFIXER\n\nAutoprefixer uses\
    \ the data based on the latest browser popularity that supports to apply prefixes\
    \ for you. You can try the interactive demo of Autoprefixer.\n\nYou can write\
    \ any CSS rules without vendor prefixes as given below:\n\n```\n.container {\n\
    \  box-shadow: 0 0 10px #cecece;\n  transition: all .5s;\n}\n```\n\np{"
  merge: -1
  pgno: 394
- img_proc: true
  md: "```\ncolor: red;\n}\n\n.section a{\ndisplay: flex;\n}\n```\n\nPure CSS\nWorking\
    \ with Autoprefixer is simple, you need to forget about vendor prefixes and write\
    \ normal CSS according to the latest W3C specs. You do not need a special language\
    \ (like Sass, Less) or remember where you use mixins.\n\nAutoprefixer supports\
    \ selectors such as :fullscreen & ::selection, unit calc(), at-rules @support\
    \ & @keyframes and with properties.\nIt is a postprocessor, you can use it with\
    \ preprocessors like Sass, Stylus, or LESS.\nJust normal CSS according to the\
    \ latest W3C specs and Autoprefixer will produce the code for all browsers. Autoprefixer\
    \ changes CSS indentation to create a nice cascade of prefixes if the CSS is uncompressed.\n\
    \n```\na {\n  -webkit-box-sizing: border-box;\n  -moz-box-sizing: border-box;\n\
    \  box-sizing: border-box;\n}\n```\n\nThe output with Autoprefixer will be like\
    \ this (you can check the Autoprefixer code online using, https://tools.webdevpuneet.com/css-autoprefixer/):\n\
    \n```\n/*\n* Prefixed by:\n* PostCSS: v7.0.29,\n* Autoprefixer: v9.7.6\n* Browsers:\
    \ last 4 version\n*/\n```\n\n```\n.container {\n  -webkit-box-shadow: 0 0 10px\
    \ #cecece;\n  box-shadow: 0 0 10px #cecece;\n  -webkit-transition: all .5s;\n\
    ```"
  merge: -1
  pgno: 395
- img_proc: true
  md: "```\n-o-transition: all .5s;\n  transition: all .5s;\n```\n\n```\np{\n  color:\
    \ red;\n}\n\n.section a{\n  display: -webkit-box;\n  display: -ms-flexbox;\n \
    \ display: flex;\n}\n```\n\nThe thing is that some CSS properties will display\
    \ differently in different browsers, and you want every site visitor to have a\
    \ predictable and accurate experience. For older, more established properties,\
    \ such as a border or order, there is nothing to worry about; they have been standardized\
    \ and work across browsers. But newer features like grid or flexbox are not so\
    \ simple.\n\nThe vendors that make your browsers, like Google and Mozilla, don't\
    \ want to wait for cool new things to be standardized before implementing them,\
    \ they create their own version and add a prefix that differentiates it from other\
    \ browsers' implementations. The new property will be standardized and work the\
    \ same across all browsers, eliminating the need for prefixes. Until then, you\
    \ must use vendor prefixes in your code.\n\n> “Autoprefixer is a plugin that can\
    \ save you from the monotony of -webkit- and -moz-. It does exactly sounds like:\
    \ it automatically adds prefixes to your CSS. All you have to do is supply it\
    \ using a CSS sheet that will read and add prefixes if necessary.\n\nInstalling\
    \ Autoprefixer in Your Project Folder\nOpen terminal in VS code and use npm to\
    \ install it, well as postcss and its companion postcss-cli, the command-line\
    \ tool you'll use to run Autoprefixer. The process is the same as Sass, only you\
    \ install three packages at once. You can install many at once if you'd like,\
    \ each separated by a space as\n\n```\n$ npm install autoprefixer postcss postcss-cli\
    \ -g\n```"
