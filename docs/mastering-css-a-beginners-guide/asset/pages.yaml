    * JavaScript\n* Webpack\n* Meteor\n\n# PostCSS\n\nPostCSS plugin generates spritesheets\
    \ from your stylesheets. It is a software development tool that uses JavaScript-based\
    \ plugins to automate CSS operations. It was previously designed by Andrew Sitnik\
    \ with the idea carrying its origin in his front-end work for Evil Martians.\n\
    \nIt is a framework to develop CSS tools. It can also be used to develop a template\
    \ language such as Sass and LESS. The PostCSS has core components which are given\
    \ as below:\n\n+   * CSS parser generates an abstract syntax tree.\n* It is a\
    \ set of classes that comprise the tree.\n* CSS generator generates a line for\
    \ the object tree.\n* Code map generator for the changes made.\n\n# Features\n\
    \nPlugins are small programs working with a tree of objects. After the core transforms\
    \ the CSS string into a tree of objects, the plugins parse and modify the tree.\
    \ Then PostCSS will generate a new CSS string for the tree changed by the plugin.\
    \ PostCSS & its plugins are written in JavaScript and installed through npm, which\
    \ offers an API for various low-level JavaScript operations."
