    \ value of 0.2 has the same effect as the percentage value of 20%. The negative\
    \ values are not allowed. It is used with the filter property to adjust the brightness\
    \ of an image. The function applies a linear multiplier to the input image, making\
    \ it appear more or less bright. It requires an argument to be passed to it. It\
