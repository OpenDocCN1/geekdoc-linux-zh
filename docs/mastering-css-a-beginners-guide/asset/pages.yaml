  md: '40 ■ Mastering CSS


    # WHY FLEXBOX?


    For a long time, the only reliable browser-compatible tools available for creating
    layouts were features such as floats and positioning. These work, but in some
    ways they are limited and frustrating.


    The following building designs are difficult or impossible to achieve with such
    tools in any form of simple, flexible approach:


    +   - Vertically centering a block element of content inside its parent.

    - Making all the children of a container take up the same amount of width/height.

    - Making all columns in a multiple-column layout with the same height if it contains
    a different amount of content.


    # CSS FLEXBOX


    The flexbox layout allows you to easily format HTML. Flexbox makes it easy to
    direct objects horizontally and vertically using lines and columns. Items will
    “change” into different sizes to fill the space. It makes responsive design easier.


    CSS flexbox is ideal for standard website design or your application. It is easy
    to read, supports all modern browsers, and does not take much time to get the
    basics right. By the end of this section, you will be ready to start using flexbox
    for your web projects.


    Flexbox is a 1D layout for arranging objects in rows or columns. Items are flexible
    to fill in the blanks or shrink to smaller spaces.


    The flex container properties are:


    +   - flex-direction

    - flex-wrap

    - flex-flow

    - justify-content

    - align-items

    - align-content'
