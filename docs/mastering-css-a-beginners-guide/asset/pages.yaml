    * Types of CSS

    * Various Properties (Classes, Id, Divisions)


    In this chapter, we will learn about CSS (Cascading Sheets), its fundamental concepts,
    versions, syntax, and how we can link our HTML page with CSS files. The other
    concepts like modules, selectors, ids, borders, attributes, tables, form, colors,
    etc. will also be covered in this whole lesson. So let''s get started with the
    basics of CSS.


    # INTRODUCTION


    A document is usually a text file created using tag language – HTML is the common
    markup language, but you can also merge with other tag languages such as SVG or
    XML. It is presenting a document to other user means converting it into a form
    used by your audience. The other browsers,


