  md: "# linear-gradient()\n\nThe linear-gradient() function allows to create a linear-gradient\
    \ using CSS. CSS gradients allow to apply multiple background colors to an element\
    \ that blend from one color to the next.\n\nTo create a linear-gradient, use the\
    \ linear-gradient() as a value to any property that accepts images (such as background-image,\
    \ background, or border-image properties). Linear-gradients use these properties\
    \ to build an image of the specified gradient.\n\nThese gradients that run in\
    \ a straight line. Linear-gradients can go in any direction such as up, down,\
    \ sideways, 50 degrees, 73 degrees, or any other angle you like.\n\nThese gradients\
    \ are created by establishing an axis called the gradient line. The color stops\
    \ are placed along gradient to create a gradient that runs between each color.\n\
    \n# How to Set the Angle of a Gradient\n\nYou can also set the angle so that it\
    \ runs along that angle. You can specify with an angle value (e.g., 45deg, 90deg,\
    \ and 180deg) or with the keywords for specifying the angle (such as to top, to\
    \ bottom, top left, etc).\n\n# Example:\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n\
    <style>\n\n {\n  padding:0;\n  margin:0;\n  box-sizing: border-box;\n}\n\n.demo_container{\n\
    \  padding:20px;\n  width:900px;\n\n```"
