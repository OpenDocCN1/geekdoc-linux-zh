    circle()


    The circle() is a basic shape value that is the part of the CSS shapes module.
    Basic shapes such as circle() can be used as a value for properties such as shape-outline
    to control the flow of content (code) around the element and clip-path to clip
    the element''s contents to the basic shape. It means that you have text flowing
    around the element in the shape of a circle, has an image clipped to the shape
    of a circle.

    The syntax of the circle() function is as follows:


    ```

    circle() = circle ([<shape-radius>]? [at <position>]]? )

    ```


    How to Position the Circle


    You can specify a position for the circle by various radius argument with a valid
    CSS position. It specifies the circle''s center. Just separates the radius and
    the position like this:


    ```

    shape-outside: circle(100px at 10px 150px);

    ```


