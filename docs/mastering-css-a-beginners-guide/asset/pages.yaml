    * Introduction

    * Basics of CSS Functions

    * attr()

    * blur()

    * brightness()

    * calc()


    INTRODUCTION

    CSS functions are used for various CSS properties. For example, you can use the
    function RGB() to provide a color value (such as color: RGB(105, 0, 215)), or
    the attr() function to get the value of an HTML attribute.


    Various functions are used in CSS transforms. For example, the rotate() function
    can be used to rotate an element, the scale() function can be used to change the
    size of an element, and the translate() function can be used to move an element.


    There are also some functions, such as circle() to clip an element to a circle
    or create a circle for text to flow around, the calc() function can provide a
    calculated value for a property.'
