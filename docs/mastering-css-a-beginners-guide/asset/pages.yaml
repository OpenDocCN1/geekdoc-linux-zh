  md: "The filter() function accepts two arguments. The first argument is the image\
    \ and the second argument is a list of filter functions to apply to that image.\n\
    \nThe filter functions that it accepts are the same as those accepted by the filter\
    \ property. You can provide multiple filter functions as required.\n\n# Example:\n\
    \n```\n<!DOCTYPE html>\n<html>\n<head>\n<style>\n* {\n  padding:0;\n  margin:0;\n\
