  md: '# Enabling the root user account in Kali


    Sudo is an abbreviation for **superuser do**, which allows us to run commands
    and tools as a superuser with the highest privileges, known as root privileges.
    It can sometimes be a bit of a nuisance to have to type this before commands,
    but it becomes routine after a while.


    However, if you are new to Kali and Linux-based operating systems, I recommend
    using the default profile and typing sudo when necessary, but the choice is ultimately
    yours.


    Enabling the root account is fairly simple and can be done in just a couple of
    steps:


    +   Firstly, boot your Kali machine if it is not running and log in using the
    username and password you have created, or using the default credentials provided
    – username: *kali*, and password: *kali*.


