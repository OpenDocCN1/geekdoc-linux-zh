  md: '# Additional Kali Installations and Post-Installation Tasks


    Now that we have a root user account enabled on Kali, our last task in this chapter
    will be to add forensics tools using a forensics metapackage.


    # Adding the Kali forensics metapackage


    Kali metapackages are collections of tools that can be downloaded as a full package.
    Depending on the version of Kali you installed, it may not contain all the tools
    you expect or viewed on the tools listing page at https://www.kali.org/tools/all-tools/,
    which lists all the tools available in Kali Linux. For your DFIR purposes, a listing
    of all forensics tools can be viewed at https://www.kali.org/tools/kali-meta/#kali-tools-forensics,
    where you can click on the drop-down arrow in the Dependencies section to view
    a listing of all tools.


    All of the preceding tools are contained in the kali-tools-forensics metapackage
    and can be installed by typing the following command:


    ```

    sudo apt install kali-tools-forensics

    ```


    The following screenshot shows the execution and output of the command.


    ![](img/7489105e357b7dff3e56cd1cbb0de4fa_116_0.png)


    Figure 4.25 – installing the forensics metapackage


    > Note

    nYou should update your Kali Linux before installing any metapackage as we previously
    did, using the sudo apt update command.


    We have installed all listed forensics tools in Kali Linux, as shown in the previous
    screenshot. You can view some of the forensics tools by clicking on Applications
    | 11-Forensics on the main Kali menu.


    # Summary


    In this chapter, we learned that we can also install Kali Linux in a much simpler
    and faster manner by using the pre-configured version of Kali, specifically designed
    for VirtualBox. Just a few clicks and tweaks and we were done. We also learned
    to install Kali on a Raspberry Pi device, which can be very useful where portability
    is concerned, by simply using the Pi Imager to install Kali onto a microSD card.'
  merge: -1
  pgno: 116
- img_proc: true
  md: 'We then looked at some very important post-installation tasks that should be
    done after any installation. We learned how to find the version of Kali Linux
