    Figure 9.15 – Carved and recovered files


    Let''s move on to another popular and powerful file carving tool called Scalpel.


    # Data carving with Scalpel


    Scalpel was created as an improvement of a much earlier version of Foremost. Scalpel
    aims to address the high CPU and RAM usage issues of Foremost when carving data.


    Unlike Foremost, file types of interest must be specified by an investigator in
    the Scalpel configuration file. This file is called scalpel.conf and is located
    at etc/scalpel/


    ![](img/7489105e357b7dff3e56cd1cbb0de4fa_225_1.png)


    Figure 9.16 – The Scalpel configuration file'
  merge: -1
