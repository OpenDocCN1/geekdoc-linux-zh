- img_proc: true
  md: 'Let''s look at the first asterisk, which represents the smss.exe process with
    a PID of 386. We can see under this, there are other processes with more than
    one asterisk that have a PPID of 386, indicating they are all child processes
    of smss.exe. Similarly, if we look further down, we can see that explorer.exe
    with a PID of 1484 is the parent process of reader_sl.exe with a PPID of 1484.
    It takes some time to do that but helps simplify parent and child processes in
    DFIR.


    # The psscan plugin


    The psscan plugin displays inactive and hidden processes that could be seen by
    malware, such as rootkits, and are well known to evade discovery by users and
    antivirus programs.


    Let''s run psscan by typing the following:


    ```

    python3 vol.py -f cridex.mem windows.pscan

    ```


    The following screenshot shows the output of the preceding command when running
    the psscan plugin.


    ![](img/7489105e357b7dff3e56cd1cbb0de4fa_256_0.png)


    So far, there nothing that stands out. Let''s keep digging.


    # The modscan plugin


    The modscan plugin displays a list of all processes in the memory image. This
    helps us identify the path for processes, system files, and Dynamic Link Library
    (DLL) files.'
