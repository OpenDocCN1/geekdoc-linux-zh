- img_proc: true
  md: '# 16

    Network Forensic Analysis Tools


    We are here. Our final chapter. I believe in the concept of finishing strong,
    so let''s keep pace by continuing our DFIR journey with some Network Forensic
    Analysis Tools (NFAT), which I think you''ll find useful.


    We''ve done quite a bit of acquisition and analysis thus far including hard drive,
    storage, RAM and swap file analysis, malware analysis, and a bit of network packet
    analysis for the purpose of acquiring, documenting, and analyzing evidence in
    the hope of finding or recovering artifacts. But let''s go a step further into
    analyzing packets, protocols, and network communication, as they may also be useful
    artifacts that can aid us in our DFIR investigations.


    On recognizing that some incidents and crimes occur online over the internet or
    even the Local Area Network (LAN), capturing and analyzing network traffic should
    be an essential part of our investigative process in discovering artifacts that
    may help us understand the incident, point to sources of origin, and in some cases,
    assist in extending the scope of the investigation if it is suspected that the
    incident may not be an isolated one.


    In this chapter, we''ll cover the following topics:


    +   * Creating packet capture (PCAP) files using Wireshark

    * Packet analysis using NetworkMiner

    * Packet analysis using PcapXray

    * Online PCAP analysis using packettotal.com

    * Online PCAP analysis using apackets.com

    * Reporting and presentation'
  merge: -1
  pgno: 369
- img_proc: true
  md: "# Capturing packets using Wireshark\n\nWireshark is a very popular and well-known\
    \ tool used for network and packet analysis and troubleshooting. It comes pre-installed\
    \ in Kali and is relatively straightforward to use once you have an idea of filters,\
    \ protocols, and color codes.\n\nIf you're new to the Wireshark protocol analyzer\
    \ and packet analysis, you can find some great tutorials online, including the\
    \ official documentation at https://www.wireshark.org/docs/wsug_html_chunked/ChapterCapture.html.\n\
    \nFirst, let's see what network interfaces are and then begin using Wireshark:\n\
    \n+   1. We'll need to specify our interface when capturing packets after starting\
    \ Wireshark. To get information on your interfaces in Linux Kernel, open a Terminal\
    \ and type ifconfig:\n\n```\n$ ifconfig\neth0: flags=4163,UPCAST,RUNNING,MULTICAST\
    \  mtu 1500\n        inet 10.10.170.105  netmask 255.255.0.0  broadcast 10.10.255.255\n\
    \        inet6 fe80::71ce:bbaa:0339:0b3d  prefixlen 64  scope 0x20<link>\n   \
    \     ether 08:00:27:46:4f  tqueuelen 1000 (Ethernet)\n        RX packets 575\
    \ bytes 65699 (55.2 KiB)\n        RX errors 0 dropped overruns 0  frame 0\n  \
    \      TX packets 16 bytes 1932 (1.8 KiB)\n        TX errors 0 dropped overruns\
    \ 0  carrier 0 collisions 0\n\nlo: flags=73<UP,LOOPBACK,RUNNING>  mtu 65536\n\
    \        inet 127.0.0.1  netmask 255.255.0.0\n        inet6 :: prefixlen 128 \
    \ scope 0x10<host>\n        loop tqueuelen 1000 (local loopback)\n        RX packets\
    \ 4 bytes 240 (240.0 B)  frame 0\n        RX errors 0 dropped overruns 0  frame\
    \ 0\n        TX packets 0 bytes 240 (240.0 B)\n        TX errors 0 dropped overruns\
    \ 0  carrier 0 collisions 0\n```\n\nFigure 16.1 - ifconfig output\n\nIn the previous\
    \ screen capture, the ifconfig command displays the output for two interfaces.\
    \ The interface I will using is my Ethernet interface, listed as eth0, and there\
    \ is also the loopback interface listed as lo.\n\n> Please Note\nIf you're using\
    \ a wireless NIC to capture, it will be listed as wlan0."
