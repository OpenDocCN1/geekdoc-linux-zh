    The main question that usually arises when choosing tools is based on commercial
    versus open source. Whether you are using commercial tools or open source tools,
    the result should be the same, with the preservation and integrity of the original
    evidence being the main priority.


    > **Important note**

    Budget allows an issue, and some commercial tools (as robust, accurate, and user-friendly
    as they might be) can cost thousands of dollars.


    The open source tools are free to use under various open source licenses and should
    not be counted just because they are not backed by enterprise developers and researchers.


    Many open source tools are widely reviewed by the forensic community and may be
    open to more scrutiny, as they are available to the public and are built in non-proprietary
    code.


