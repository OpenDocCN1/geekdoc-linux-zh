  md: '# # Understanding File Systems and Storage


    It takes a lot more than just technical know-how to be a digital forensic investigator.
    There’s a lot of research, processes, and analytics that also go into the case
    itself. Consider a scenario where you need to build a house: Sure, we need wood,
    nails, cement, metal, glass, and all other raw materials, but we also require
    skilled laborers and contractors to construct the structure and piece it together.
    Apart from the materials, tools, and resources, we will also have our research
    to ensure that we understand what is needed for this to be a successful project.


    For instance, we will have to obtain permits to build, perform soil analysis,
    consider the weather, and then choose to specify types of materials based on the
    weather, location, size, and on. It goes without saying that there must be an
    understanding of fundamental concepts in the field to efficiently carry out the
    task. In the same way, we need to understand the file systems, operating systems
    (OSs), data types, and locations, as well as a thorough understanding of methods
    and procedures for preserving data, storage media, and general evidence.


    In this chapter, we will learn about the following topics:


    +   - The history of storage media

    - File systems and operating systems

    - Data types and states

    - Volatile and non-volatile data and the order of volatility

    - The importance of RAM, the paging file, and the cache in DFIR'
  merge: -1
  pgno: 137
- img_proc: true
  md: '# History and types of storage media


    The aim of this investigation is to prove whether previously existed, currently
    exists, or took place. In laptops, desktops, mobile devices, and smart devices,
    data drives must be stored somewhere, even if it''s just temporarily. Most of
    us may be familiar with hard disk drives (HDDs) within laptops, desktops, mobile
    devices, and so on, but we also need to focus on removable and portable storage
    devices regardless of age, as they may be used. These include DVDs, portable drives,
    thumb or flash drives, secure digital (SD) and microSD cards, older media such
    as CDs and floppies, and many other media types.


    We should also consider that many portable storage devices, such as flash drives,
    in many interesting shapes and sizes as novelty items and may not take the usual
    shape of the ordinary rectangular-shaped drive. Another issue is to consider that
    many of these storage media devices have changed in size over the years and may
    be smaller, usually because of evolving technology.


    # IBM and the history of storage media


    There can be no story, journey, book, or even discussion on the history of hard
    drives and storage media without mentioning three letters: IBM. We''re all familiar
    with this well-known tech giant, but we might not all be familiar with some of
    its great achievements.


    **International Business Machines (IBM)** has been around for quite some time.
    Known as the **Computing-Tabulating-Recording (CTR)** back in the early 1900s,
    IBM is better known for building the first HDD, the first PC, with its servers,
    desktops, and laptops.


    Between 1956 and 1957, IBM made major inroads with the development and release
    of the 305 Random Access Method of Accounting and Control (RAMAC), which utilized
    the first disk storage technology. This revolutionary technology weighed in approximately
    one ton and was roughly 16 square feet in size. The disk space capacity of this
    behemoth; however, was only 5 MB (megabytes, i.e megabytes)


    5 MB by today''s standard is roughly the size of a high-definition photo taken
    with a mobile device, all things considered, was really a monumental achievement
    for its time. Before IBM''s invention, data was stored on punch cards that could
    amount to as millions of cards to just a few megabytes.


    A major issue faced back then with the introduction of this digital storage was
    the size of the device. Transportation by plane and truck may not have been an
    option for many; the space to store this would also have been an issue.


    As technology progressed, IBM announced a much more portable computer in 1975,
    the IBM 5100 Portable Computer. In the 1980s, specifically 1981, we saw the birth
    of the IBM Personal Computer. Weighing in much less than its predecessor, this
    portable computer also had a much affordable price tag between $8,000 and $20,000.'
  merge: -1
  pgno: 138
- img_proc: true
  md: '# History and types of storage media


    It wasn''t until 1981 when IBM released the first personal computer, that the
    portability of computers became an actual reality. With a price tag of $1,565,
    owners were afforded a keyboard and mouse, with options for a monitor, printer,
    and floppy drives. Apart from the floppy drives, which was the standard for today''s
    personal computers.


    Along with this newer and more portable technology, there were also improvements
    in data storage over the years, which saw advancements from magnetic tape storage
    to floppy drives and diskettes, CDs, DVDs, Blu-ray Discs, and, of course, mechanical
    and **solid-state drives (SSDs)**


    # Removable storage media


    Continuing with our topic of storage media, I''d first like to start by discussing
    removable storage media, as it played a role as important as that of fixed storage
    media in today''s world.


    # Magnetic tape drives


    Introduced by IBM in the 1950s, magnetic tape was an easy and fast way to store
    data at a speed equal to its processing time. The IBM 726 magnetic tape reader
    and recorder was one of the first devices to offer this storage, with a capacity
    or density of 100 bits per linear inch of tape. Any inch of tape should have an
    indicator of the size of the tape, which was wound on a large wheel, similar to
    an old film movie tape


    With magnetic media, data is written across the width of the magnetic-coated plastic
    strip in frames separated by gaps consisting of blocks. Magnetic tape is still
    very much used today, and like many other storage media types, it has significantly
    decreased in size while increasing capacity and speed.


    To give an idea of how far tape storage has come as of 2017, IBM has developed
    newer tape storage media with **gigabits per second (Gps)** per inch on a single
    cartridge, which can record up to 333 **gigabytes (GB)** of data. These cartridges
    (for older folks like myself) are the size of a cassette tape or (for the younger
    ones) not much smaller than the average smartphone, which fits in your hand.


    # Floppy disks


    The floppy disk, introduced yet again by IBM, was first seen with its floppy disk
    drive in 1971. Although mainframe computers back then already had hard drives
    and magnetic tape storage media, there was the need for a single and cheaper means
    of saving and passing on software and instructions to the mainframes, previously
    done using the smaller punch cards.


    At the core of the floppy disk was a magnetic disk which, although far more portable
    than magnetic tape storage and HDDs at the time, stored less than other media
    we''ve mentioned.'
  merge: -1
  pgno: 139
