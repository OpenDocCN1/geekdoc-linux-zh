    the SHA- 256 output is the longest.


    ![](img/7489105e357b7dff3e56cd1cbb0de4fa_185_0.png)


    Figure 8.5 - Cryptographic algorithm output hashes


    > Important note

    When performing forensic acquisition or forensic imaging of any drive or storage
    media, the hash output of the original file must always match the output of the
    forensically acquired forensic image, which assures the integrity of the evidence
    and the copy of the evidence (the forensic image).


    Now that we''ve distinguished between drives and are certain of which drive is
    to be imaged (sdb), we can begin the forensic imaging using DC3DD. Although I
    have used an older 8-GB Pro Duo storage drive to demonstrate the use of DC3DD,
    you can use any drive (portable or otherwise) to practice using the tools in this
    chapter. Be sure to use the fdisk -l to identify your drives and partitions before
    continuing.


    # Drive acquisition using DC3DD


    The first tool we will use for acquisition is called DC3DD (developed by the department
    of Defense Cyber Crime Center). DC3DD is a patch of the very popular Data Dump
    (DD) tool, used for forensic acquisition and hashing.'
