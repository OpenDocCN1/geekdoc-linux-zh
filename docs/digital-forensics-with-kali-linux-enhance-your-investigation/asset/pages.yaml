    # PDF malware analysis


    In this section, we''ll look at PDF malware forensics and analysis. PDFs are possibly
    the most common format when sharing information as many people would rather open
    a PDF than an Office document, such as in .docx or .xls format, as they are more
    likely to contain macros and even viruses. While PDFs are more trusted document
    types, it is still common to come across some that have been infected with malware
    or contain hidden information.'
