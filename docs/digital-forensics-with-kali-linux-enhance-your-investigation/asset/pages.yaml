    our Kali Linux installation the perfect purple teaming operating system environment,
    which we will discuss later in this chapter.


    # Why is Kali Linux so popular?


    Aside from being one of the InfoSec distros (distributions), Kali Linux has a
    very large support base, and you can find thousands of tutorials on installation,
    using built-in tools, and installing additional tools on YouTube, TikTok, and
    at large, making it one of the more user-friendly platforms.


    Kali Linux also comes with over 600 tools, all of which are categorized in Kali''s
    Applications menu. Many of the tools included in Kali can perform various cybersecurity
    tasks ranging from Open Source Intelligence (OSINT), scanning, vulnerability assessments,
    exploitation and penetration testing, office and productivity tools, and of course,
    DFIR. The full list of tools can be found at https://www.kali.org/tools/all-tools/


