    ![](img/7489105e357b7dff3e56cd1cbb0de4fa_235_0.png)


    Figure 9.30 - Changing working directories


    In the preceding screenshot (Figure 9.30) that we can see my current directory
    is Desktop/Scrounge_recovery.


    Let''s now view the usage and options of scrounge_ntfs by typing the following:


    ```

    Scrounge_ntfs -h

    ```


    The following screenshot shows the output of the previously typed command.


    ![](img/7489105e357b7dff3e56cd1cbb0de4fa_235_1.png)


