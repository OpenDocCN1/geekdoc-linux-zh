    \n# Optical storage media\n\nOptical storage media is so called because how data\
    \ is written to the various media types involving the use of different types of\
    \ lasers on the surface of the disk itself.\n\nAlthough it may be somewhat difficult\
    \ to distinguishing various optical disks in the event that there are no default\
