    on the hard drive to be used as a main operating system in the same way that you
    would install Windows or another operating system. ISO files (or ISO images, as
    they are commonly called) are copies of data used when duplicating data.

    - **Virtual Machines:** These images are used on virtual platforms, such as VirtualBox
    and VMware, and are pre-configured to run straight out of the box.

    - **ARM:** These images are specifically for low-powered devices and **Single
    Board Computers (SBC)** such as Raspberry Pi, Pinecone, and Gateworks devices.

    - **Mobile:** This portable version of Kali Linux is called Kali NetHunter and
    can be installed on many more devices since its inception, including OnePlus,
