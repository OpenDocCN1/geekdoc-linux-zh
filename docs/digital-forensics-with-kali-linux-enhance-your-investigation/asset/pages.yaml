    # Looking at the swap_digger tool to explore Linux artifacts


    The swap_digger performs an automated analysis of the Linux swap file and retrieve
    artifacts such as system passwords, usernames, and form credentials, and even
    Wi-Fi information such as SSIDs and perhaps evens stored in the swap file.


    # Installing and using swap_digger


    Follow these steps to install and use swap_digger for swap analysis:


    +   1. Change directories to the desktop in the terminal and clone clone swap_digger
    to the desktop by typing the following:


    ```

    git clone https://github.com/sevagas/swap_digger.git

    ```'
