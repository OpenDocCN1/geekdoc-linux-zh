  md: '# Installing Kali Linux


    Join me as we get started with the practical aspects of Kali Linux. Some of you
    may already be familiar with the installation process and perhaps even some of
    the advanced features, such as partitioning and networking. For beginners and
    those of you who are new to Kali Linux, we encourage you to pay particular attention
    to this chapter as we begin from the absolute basics of downloading Kali Linux,
    working our way up to a successful installation.


    The topics that we are going to cover in this chapter are the:


    +   - Installing Kali Linux on portable storage media for DFIR

    - Downloading and installing Kali Linux as a standalone operating system

    - Installing Kali Linux in VirtualBox


    # Technical requirements


    As previously mentioned, Kali Linux has been around for some time. Known previously
    as BackTrack, with releases from versions one to five, Kali Linux was first seen
    in 2015 and released as Kali 1.0. From 2016 onward, Kali was named according to
    the year. So, for instance, at the time of writing this book, the version used
    is Kali 2022.3, released in August 2022.


    For those running older versions of Kali Linux or purchasing this book at a later
    date when Kali 2023 and later, may be available, you can easily update your instance
    of Kali Linux using the sudo `apt-get` update command, demonstrated in the Updating
    Kali section.


    # Downloading Kali Linux


    For safety and security reasons, it is always best to download Kali Linux directly
    from the website of its creators, **Offensive Security**. The main reason for
    this is that the downloads of Kali on other pages could be fake, or infected with
    malware, such as Trojans, rootkits, and even ransomware. Offensive Security also
    allows users to compare the hash of their downloaded version of Kali with what
    was generated and posted by Offensive Security on their website (`https://www.kali.org`).
    Once, you can click on the **Downloads** link or go directly to the Kali Linux
    **Downloads** page by visiting `https://www.kali.org/get-kali/`'
