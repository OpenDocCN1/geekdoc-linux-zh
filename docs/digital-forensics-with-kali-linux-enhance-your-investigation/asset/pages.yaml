  md: '# Flash memory cards


    Like flash drives, flash memory cards (or memory cards, as they are fondly referred
    to) also use NAND flash memory, which, as we previously learned, is non-volatile,
    solid-state memory. However, unlike USB flash drives, these cards do not come
    with a USB interface and must be used with either an adapter or a memory card
    reader.


    Over the years and decades, we''ve had formats of memory cards grace our desktops,
    laptops, mobiles, and other devices, including cameras, MP3 players, and even
    toys. Although I''ll only cover some of the more popular cards of today, it is
    important that you are at least familiar with memory cards and are also able to
    identify them.


    The following are memory card types:


    +   - Memory Stick PRO Duo (MSPD) (a proprietary card developed by Sony)

    - SD

    - MicroSD

    - Compact Flash (CF)

    - MultiMedia Card (MMC)

    - xD-Picture (xD)

    - Smart Media (SD)


