    # Enabling the root user account in Kali


    Now that all our updates and upgrades have been completed, let''s look at enabling
    the root user account in Kali Linux. You will have noticed that some versions
    of Kali, when installed, allow access with the default username and password of
    Kali. This was as a security feature to not allow unintentional changes to configurations
    or tools. If we wish to execute commands or perform various tasks using root or
    administrator privileges instead, type sudo before the respective commands.'
