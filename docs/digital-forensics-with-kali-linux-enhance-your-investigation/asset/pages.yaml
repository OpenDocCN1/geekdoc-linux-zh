  md: '# Preface


    In this third edition of this book, you''ll find that the theory and methodologies
    have remained mostly the same with updates on general technical information, best
    practices, and frameworks, as the procedures and documentation are standard throughout
    the field; however, you''ll find that the technical chapters contain new labs
    using new examples. I''ve also included a few completely new chapters that go
    deeper into artifact analysis, automated data recovery, malware, and network analysis,
    showcasing several tools with practical exercises that even beginners will find
    easy to. We utilize Wine, which will allow us to install very popular (Digital
    Forensics and Incident Response) (DFIR) tools built for the Windows platform (such
    as Autopsy 4) within Kali Linux. This book is quite useful for Red Teamers and
    penetration testers who wish to learn about or enhance their DFIR and Blue Teaming
    skills to become Purple Teamers by combining their penetration testing skills
    with the digital forensics and incident response skills that will be taught throughout
    this book.


    # Who this book is for


    The third edition of this book was carefully structured to be easily understood
    by individuals at all levels, from beginners and digital forensics novices to
    incident response professionals alike, as the first six chapters serve to get
    you acquainted with the technologies used and also guide you through setting up
    Kali Linux, before delving into forensic analysis, data recovery, malware analysis,
    automated DFIR analysis, and network forensics investigations. Red teams and penetration
    testers wanting to learn Blue Teaming skills to become Purple Teamers may find
    the contents of this book very useful.


    # What this book covers


    Chapter 1, Red, Blue, and Purple Teaming Fundamentals, informs you about the different
    types of cyber security tools to whom penetration testers and forensic investigators
    belong, and the skillset required.


    Chapter 2, Introduction to Digital Forensics, introduces you to the world of digital
    forensics and forensic methodology, and also introduces you to various forensic
    operating systems.


    Chapter 3, Installation Kali Linux, covers the various methods that can be used
    to install Kali Linux as a virtual machine or as a standalone operating system,
    which can also be run from a flash drive or SD card.


    Chapter 4, Additional Kali Installations and Post-Installation Tasks, builds upon
    the Kali installation and guides you through performing additional installations
    and post-installation tasks such as enabling a root user and updating Kali Linux.'
  merge: -1
  pgno: 15
- img_proc: true
  md: 'Chapter 5, Installing Wine in Kali Linux, shows the versatility of Linux systems,
    where you will learn how to install and use forensic tools designed to be in the
    Windows platform, in a Kali Linux system using Wine.


    Chapter 6, Understanding File Systems and Storage Media, dives into the realm
    of operating systems and the various formats for file storage, including hiding
    places not seen by the end user, or even the operating system. We also inspect
    data about data, as metadata, and look at its volatility.


    Chapter 7, Incident Response, Data Acquisitions, and DFIR Frameworks, asks what
    happens when an incident is reported or detected. Who are the responders and what
    are the procedures for maintaining the integrity of the evidence? In this chapter,
    we look at best practices, procedures, and frameworks for data acquisition and
    evidence collection.


    Chapter 8, Evidence Acquisition Tools, builds on the theory behind data acquisitions
    and best practices and teaches you to use industry-recognized tools as DC3DD,
    Guymager, FTK Imager, and RAM Captor to recover data and image acquisition while
    preserving integrity.


    Chapter 9, File Recovery and Data Carving Tools, introduces the investigative
    side of digital forensics by various tools such as Magic Rescue, Scalpel, Bulk_Extractor,
    scrounge_ntfs, and recoverjep to recover data and carve from forensically imaged
    and media.


    Chapter 10, Memory Forensics and Analysis with Volatility 3, takes us into the
    analysis of memory artifacts and the importance of preserving volatile evidence
    as the contents of the RAM and the paging file.


    Chapter 11, Artifact, Malware, and Ransomware Analysis, carries us deeper into
    artifact analysis using poof, swap_digger, and minipigenui, and, therefore, demonstrates
    how to perform malware and ransomware analysis using pdf-parser, hybrid-analysis.com,
    and Volatility.


    Chapter 12, Autopsy Forensic Browser, showcases automated file recovery and analysis
    within Kali Linux using a single tool.


    Chapter 13, Performing a Full DFIR Analysis with the Autopsy 4 GUI, dips much
    into automated file carving, data recovery, and analysis using one of the most
    powerful and free forensic tools, which takes abilities and investigations to
    a professional level, catering for all aspects of digital forensics investigations,
    from hashing to reporting.


    Chapter 14, Network Discovery Tools, showcases network scanning and reconnaissance
    tools such as netdiscover, nmap, and although not specifically designed for use
    as forensic tools, are useful in providing additional information when performing
    incident response.


    Chapter 15, Packet Capture Analysis with Xplico, gives an insightful use of automated
    packet analysis using one tool for investigating network and internet traffic.


    Chapter 16, Network Forensic Analysis Tools, ends the book by demonstrating how
    to capture and analyze packets using a variety of tools and websites including
    Wireshark, NetworkMines, packettotal.com, and apackets.com.'
  merge: -1
