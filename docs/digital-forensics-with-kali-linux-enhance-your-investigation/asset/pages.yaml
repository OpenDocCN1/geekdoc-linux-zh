  md: 'Digital forensics methodologies and frameworks 19


    The best-practices documents mentioned in this chapter are:


    +   - The Association of Chief Police Officers (ACPO) Good Practice Guide for
    Digital Evidence

    - The Scientific Working Group on Digital Evidence (SWGDE) Forensics Publications


    Although written in 2012, the ACPO, now functioning as the National Police Chiefs''
    Council (NPCO), put forth a document in a PDF file called Good Practice Guide
    for Digital Evidence, which includes best practices when carrying out digital
    investigations, particularly focusing on evidence acquisition. The ACPO Good Practice
    for Digital Evidence was then adopted and adhered to by law enforcement agencies
    in England, Wales, and Northern Ireland and can be downloaded in its entirety
    at https://www.npcc.police.uk/documents/crime/2014/Revised%20Good%20Practice%20Guide%20for%20Digital%20Evidence_Vers%205_Oct%2011_website.pdf.


    Some useful uses of this guide include:


    +   - Digital evidence locations

    - Issues relating to seizure

    - Capturing online evidence

    - Data analysis and interpretation


    Other useful and more recent document sets on best practices in digital forensics
    can be found on the SWGDE website. The SWGDE was founded in 1998 by the Federal
    Criminal Laboratory Directors Group with major members and contributors, including
    the FBI, DEA, NASA, and the Department of Defense Computer Forensics Laboratories.
    Though this document details procedures and practices within a formal computer
    forensics laboratory setting, the practices can still be applied to non-laboratory
    investigations by those not in or with access such an environment.


    The previous editions of this book referred to the SWGDE documents published between
    2006 and 2016. The older SWGDE Best publication from 2006 is no longer on the
    SWGDW website, but it sheds light on many of the topics, including:


    +   - Evidence collection and acquisition

    - Investigating devices that are powered on and powered off

    - Evidence handling

    - Analysis and reporting


    This document is publicly available at https://www.oas.org/juridico/spanish/cyb_best_pract.pdf.'
