  md: 'The need for multiple forensics tools in digital investigations 39


    Kali can operate as a live response forensic tool can also be used as a full OS,
    like Windows, macOS, and Android, as it contains several built-in tools for productivity
    and everyday use. The fact that Kali can be installed on a hard disk means that
    several other tools can be downloaded and updated regularly, giving continuous
    access to all IT security and forensic tools. This allows you to save progress
    as you use the tools and not to worry too much about restarting your machine you
    should decide to use it as a full OS.


    Using these other OSs, such as Kali, gives us a range of tools to choose from
    and with work. Many tools exist for performing the same tasks within each category
    in the distros. This is so good because our findings should be able to be replicated
    using different tools. This is especially useful in instances where the investigator''s
    work may be critiqued, and the integrity of the case and evidence questioned and
    scrutinized; using multiple tools correctly will yield consistent results. Let''s
    now look at why we may need to use more than one tool in in the next section.


    # The need for multiple forensics tools in digital investigations


    Preservation of evidence is of the utmost importance. Using commercial and open
    source tools will correctly yield results; however, for forensics sound tools,
    it is sometimes better than if one tool can produce the same results.


    Another reason to use multiple tools may simply be cost-effectiveness. Some of
    us may have a large budget to work with, while others may have a limited one or
    none at all. Commercial tools can be, especially due to research and development,
    testing, advertising, and other factors. Open source tools, those tested by the
    community, may not have the available resources and funding as with commercial
    tools.


    So, how do we know which tools to choose?


    Digital forensics is often quite time-consuming, which is one of the reasons you
    may wish to work with multiple forensic copies of the evidence. This way, you
    can use different tools simultaneously in an effort to speed up the investigation.
    While fast tools may be a good thing, we should also question the reliability
    and accuracy of the tools.


    The National Institute of Standards and Technology (NIST) has developed a Computer
    Forensic Tool Testing (CFTT) program tests digital forensic tools and makes all
    findings available to the public. Several tools are chosen based on their specific
    abilities and placed into testing categories, such as disk imaging, carving, and
    file recovery. Each category has a formal test plan and strategy for testing,
    with a validation report, again available to the public.


    More on the CFTT program can be found at https://www.cftt.nist.gov/disk_imaging.htm.
    Testing and validation reports on many of the tools covered in this book can be
    found at https://www.dhs.gov/science-and-technology/nist-cftt-reports.'
  merge: -1
  pgno: 59
- img_proc: true
  md: 'To re-enforce the importance of using multiple tools in maintaining the integrity
    of your investigations and multiple tools will be demonstrated from Chapter 7,
    Incident Response, Data Acquisitions, and DFIR Frameworks, onward within this
    book.


    Thus far, we''ve covered open tools. In the next section, I will discuss some
    popular commercial forensics tools you may come across if you are, or intend to
    be, a DFIR professional.


    # Commercial forensics tools


    Even though we''re working with open source tools, I''d like to mention some of
    the more popular commercial tools that you may be interested in using or adding
    to your arsenal as a forensic professional.


    # Belkoft Evidence Center X


    Belkoft Evidence Center (EC) X is an automated incident response and forensic
    tool that is capable of analyzing acquired images of memory dumps, virtual machines,
    cloud, mobile backups, and physical logical drives.


    Belkoft EC X is also capable of searching for, recovering, and analyzing the following
    types of artifacts:


    +   - Office documents

    - Browser activity and information

    - Email

    - Social media activity

    - Mobile applications

    - Messenger applications (WhatsApp and Facebook Messenger)

    - Cloud acquisitions


    More information on Belkoft products can be found at https://belkoft.com/.


    Belkoft also has a free acquisition tool Ram Capturer tool available along with
    a trial version of their EC, available at https://belkoft.com/get.


    # Extro Forensic Forensic Toolkit (FTK)


    Extero Forensic Toolkit (FTK) has been around for some time and is used professionally
    by forensics investigators and law enforcement agencies worldwide. FTK also integrates
    with Belkaso for a better experience. Some features of FTK include:


    +   - Fast processing with multi-core support using four engines

    - Ability to process large amounts of data

    - Indexing of data to allow faster and easier searching and analysis'
