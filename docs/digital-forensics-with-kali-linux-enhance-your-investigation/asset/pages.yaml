- img_proc: true
  md: '# Performing a Full DFIR Analysis with the Autopsy 4 GUI


    As we previously learned in Chapter 12, Autopsy Forensic Browser, when we used
    the Autopsy forensic browser, which comes with Kali Linux, Autopsy is quite a
    powerful tool when it comes to automated evidence and file analysis. However,
    the Autopsy forensic browser has some limitations, especially as it is older and
    not as frequently updated as the Graphical User Interface (GUI) version. The Autopsy
    forensic browser has been version 2.2 for many years, whereas the Autopsy GUI
    is currently, at the time of writing, up to version 4.19.


    In this chapter, we will focus on the Autopsy v4 GUI (also called the Autopsy
    4 GUI) and analyze the very same file used in the previous chapter to compare
    the usage, features, and differences in analysis findings (if any). The following
    topics will be covered in this chapter:


    +   * Autopsy 4 GUI features

    * Installing Autopsy 4 in Kali Linux using Wine

    * Downloading sample files for automated analysis

    * Creating new cases and getting acquainted with the Autopsy 4 interface

    * Analyzing directories and recovering deleted files and artifacts with Autopsy
    4


    # Autopsy 4 GUI features


    The Autopsy 4 GUI comes with many easy-to-use features for relatively simple and
    fast analysis. Autopsy 4 is one of the very few comprehensive forensic suites,
    is totally free to use, and is used by professionals and law enforcement.'
  merge: -1
  pgno: 311
- img_proc: true
  md: '# 292 Performing a Full DFIR Analysis with the Autopsy 4 GUI


    Some of the features include the following:


    +   - Simple and uncomplicated user interface

    - Case management with all files for each case stored in their respective directories

    - Available third-party add-ons and modules

    - Indexed keyword searching

    - Extraction of web artifacts from the browser, including cookies and browser
    history from Chrome and Firefox

    - Automated file recovery using PhotoRec

    - Exchangeable Image File (EXIF) data extraction using photo and video analysis

    - Advanced timeline analysis and event viewing

    - Indicators of Compromise (IoC) analysis

    - Parallel task-processing for fast analysis

    - Freely available for Windows, Linux, and Mac


    Full details of Autopsy can be found on their home page at https://www.sleuthkit.org/autopsy/#:-?text=Autopsy%C2%AB%20is%20a%20digital,from%20your%20camera%s%20memory%20card.


    Now that we''re familiar with some of the uses of the Autopsy 4 GUI, let''s install
    it in Kali using Wine.


    # Installing Autopsy 4 in Kali Linux using Wine


    In this example, we will be using Autopsy for Windows, which will be installed
    using Wine. Autopsy 4 can be downloaded for Linux; however, this may best left
    to advanced users. If you haven''t installed Wine on Kali Linux, you can revisit
    Chapter 5, Installing Wine in Kali Linux, and then return to the current chapter.


    Now, let''s get started with installing Autopsy 4 in Kali Linux using Wine:


    +   - All versions of Autopsy 4 can be found here: https://www.autopsy.com/download/


    To download Autopsy for Windows, you can click on the direct link here: https://github.com/sleuthkit/autopsy/releases/download/autopsy-4.19.3-64bit.msi


    The previous version is the most current and stable 64-bit version for Windows
    and at the time of writing is at version 4.19.3. This tutorial should also apply
    to later versions as the usage has thus remained the same over the years.'
  merge: -1
  pgno: 312
