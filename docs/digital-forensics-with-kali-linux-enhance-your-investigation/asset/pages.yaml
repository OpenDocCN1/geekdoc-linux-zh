  md: '# Understanding File Systems and Storage


    > Important note

    Laptops also use DDR RAM but are available in a more compact size called Small
    Outline DIMM (SODIMM) modules.


    Now that we''ve looked at the evolution of RAM and its various types of form factors,
    let''s look at the importance of RAM and learn about the usage of the paging file
    and cache in the next section.


    # The importance of RAM, the paging file, and cache in DFIR


    Os can use a portion of the hard disk as an extension of RAM. This is referred
    to as virtual memory and is a good idea if a computer or laptop has limited RAM.
    Although the hard drive is much slower than the RAM, the swap file or paging file
    on the disk can store files and programs that are accessed less, leaving the RAM
    available to store data that is frequently accessed. This process involves OS
    swapping pages of data less used and moving data to the dedicated paging file
    on the hard drive.


    In forensics investigations, the paging file is very important to us. Although
    not volatile as RAM itself due to being stored on the hard disk, it is a hidden
    file in Windows called pagefile. sys, and should always be inspected using tools
    of your choice, as this file may reveal passwords for encrypted areas, information
    from sites visited, documents opened, logged-in users, printed items, and so on.


    On mechanical drives data is stored in a fragmented manner; however, the advantage
    of the paging or swap file can be stored in a contiguous manner, one piece after
    the next, for faster access times.


    It is recommended that the size of the paging file is set to 1.5 times the amount
    of memory and be stored on a separate drive if possible, not just a separate partition.


    > Note on Pagefile.sys

    Pagefile.sys can be found in the HKEY_LOCAL_MACHINE\SYSTEM\CurrentSet\Control\Session
    Manager\Memory Management Windows registry path.


    I hope the importance of the paging file and cache was well received, as acquiring
    and analysis of the paging file in any DFIR investigation is crucial. Feel free
    to review the chapter and make notes on all the terms covered before proceeding
    to the next chapter.'
