  md: 'To summarize the above statements, blue and purple teams are responsible for
    several critical roles within the organization, including:


    +   * Threat intelligence

    * Threat hunting

    * Incident response

    * Monitoring and event management

    * Log reviews

    * Vulnerability assessments (red/purple team)

    * Penetration testing (red/purple team)

    * Threat simulation


    In the next section, we will look at digital forensics methodologies and frameworks,
    which we can use as best-practice guidelines when performing evidence acquisitions
    and forensic investigations.


    # Digital forensics methodologies and frameworks


    Keeping in mind that forensics is a science, digital forensics requires that you
    follow appropriate best practices and procedures in an effort to produce the same
    results time and again, providing proof of evidence, preservation, and integrity,
    which can be replicated if called upon to do so.


    Many individuals may not be performing digital forensics to be used as evidence
    in a court of law, it is best to practice DFIR in such a way as it can be accepted
    and presented in a court of law. The main purpose of adhering to best practices
    by organizations specializing in digital forensics and incident response is to
    maintain the integrity of the evidence for the duration of the investigation.
    In the event that the investigator''s work must be scrutinized and critiqued by
    another or an opinion repeated, the results found by the investigator must be
    able to be recreated, thereby proving the integrity of the investigation. The
    purpose of this is to ensure that your methods can be repeated and, if dissected
    or scrutinized, produce the same results time and again. The methodology used,
    including the procedures and findings of your investigation, should always allow
    for the maintenance of the data''s integrity, regardless of what tools are used.


    The best practices demonstrated in this book ensure that the original evidence
    is not tampered with, or in cases of investigating devices and data in a live
    or production environment, well documented proof that the necessary steps were
    taken during the investigation to avoid unnecessary tampering with the evidence,
    preserving the integrity of the. For those completely new to investigations, I
    recommend familiarizing yourself with some of the various practices and methodologies
    available and widely practiced by the professional community.


    As such, there exist several guidelines and methodologies that you should adopt,
    or at least follow, to ensure that examinations and investigations are forensically
    sound.'
  merge: -1
  pgno: 38
