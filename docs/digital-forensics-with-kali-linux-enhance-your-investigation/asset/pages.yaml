  md: '# 14

    Network Discovery Tools


    In this chapter, I''d like to go over some common tools that aid in the network
    discovery and network information gathering and reconnaissance processes and,
    overall, aid in network forensic analysis. Specific network forensic analysis
    tools such as Xplico and NetworkMiner will be covered by Chapter 15, Packet Capture
    Analysis with Xplico, and Chapter 16, Network Forensic Analysis Tools, respectively.


    In this chapter, we will first perform network discovery by detailing specifics
    of the hosts themselves, such as operating systems (OSes) and open ports, and
    then use an online tool to discover external and publicly identifiable hosts.


    In this chapter, we will learn about the following:


    +   - Using netdiscovery in Kali Linux to identify devices on a network

    - Use Network Mapper (Nmap) in Kali Linux to identify devices on a network

    - Use Nmap to fingerprint host details (ports, OSes, etc.).

    - Use Shodan.io to find external IoT devices, including firewalls, CCTV systems,
    and servers


    By the end of this chapter, you will be able to use these tools to assist in DFIR
    investigations that require you to collect information about locally and remotely
    connected devices, such as IP addresses, device types, OS details, open ports,
    and more.


    # Using netdiscovery in Kali Linux to identify devices on a network


    We''ll start off our network host discovery by first using a very simple tool
    known as netdiscovery. The netdiscovery tool comes preinstalled in Kali Linux;
    however, you can install it on almost any version of Linux using the following
    command:


    ```

    sudo apt install netdiscovery

    ```'
  merge: -1
  pgno: 333
- img_proc: true
  md: '# 314 Network Discovery Tools


    netdiscover, as the name suggests, is used to discover hosts on a wired or wireless
    network by broadcasting Address Resolution Protocol (ARP) requests. What makes
    netdiscover easy to use is that it allows users to automatically scan an entire
    range or subnet of ip addresses on a network to detect hosts. Another useful feature
    of netdiscover is that it features the Media Access Control (MAC) address along
    with the vendor of the device or Network Interface Card (NIC), which can make
    host discovery much simpler when trying to differentiate between end user, server,
    and networking devices.


    Before we start using netdiscover, we should take note of the network interfaces
    on our scanning device. This also tells us what our IP, subnet mask, and network
    range are.


    To do so, type the following:


    ```

    ifconfig

    ```


    In the following output in Figure 14.1, we can see that there are two interfaces,
    the Ethernet (eth0) and loopback (lo0) interfaces:


    ![](img/7489105e357b7dff3e56cd1cbb0de4fa_334_0.png)


    Figure 14.1 – ifconfig command output


    In the eth0 interface details, we can see that my IP address is listed as 10.10.170.105,
    with a subnet mask of 255.255.0.0. We will use this interface with the netdiscover
    command.'
  merge: -1
  pgno: 334
- img_proc: true
  md: '# Using netdiscover in Kali Linux to identify devices on a network


    Now that we know interface and IP range we will use, we can proceed to netdiscover
    to identify network hosts:


    +   1. We will first start netdiscover and use the help option to view all available
    options and switches in netdiscover. To do so, type the following:


    ```

    sudo netdiscover -h

    ```


    To use netdiscover to automatically scan for devices on our network, we will use
    the -r option to specify the subnet or range of IP addresses.


    ```

    (kali@kali ~]

    $ sudo netdiscover -h

    [sudo] password for kali:

    netdiscover 0.9 [Active/passive ARP reconnaissance tool]

    Written by: Jaime Penilha <jaimepenalba@mail.com>

    Using: netdiscover [-device] [-r file] [-p] [-m file] [-F Filter] [-s time]

    [-count] [-n node] - scan your network device

    -r range: scan a given range instead of auto scan.192.168.6.0/24,,16/8

    -f file: scan the list of ranges contained in the file

    -p passive mode: do not send any packets, only silent

    -m file: scan a list of MACs and host names

    -f filter: customize filter expression (default: "arp")

    -t time: time to wait for ARP request (milliseconds)

    -c count: number of times to send ARP request (for nets with packet loss)

    -n node: source IP offset used for scanning (from 2 to 253)

    -d ignore home config files for autoscan and fast mode

    -e extend hostname: perform reverse lookup recommended for auto

    -P print results in a format suitable for parsing by another program and stop
    after ac

    ```


    ![](img/7489105e357b7dff3e56cd1cbb0de4fa_335_0.png)


    +   2. I''ll now scan my entire 10.10.0.0 network range using the following command:


    ```

    netdiscover -i eth0 -r 10.10.0.0/16

    ```


    > Note

    Please that you are using your own network range, as yours may be different from
    mine.


    +   3. Now, press Enter. After pressing Enter, netdiscover will run. Allow a minute
    to complete and compile a list of IPs, MAC addresses, and vendor/hostnames, as
    shown in the following screenshot:


    > Note

    For privacy purposes, I have blocked parts of the MAC addresses.'
  merge: -1
