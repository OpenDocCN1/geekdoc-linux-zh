  md: '# Packet analysis using NetworkMiner


    Using Wireshark definitely take some time to learn, but I assure you that it is
    very useful just for our DFIR purposes as an NFAT but also as a network troubleshooting
    tool. Let''s move on a similar tool that finds the findings of packet analysis
    in a format that is much easier to read.


    # Packet analysis using NetworkMiner


    Analyzing data from Wireshark can be a bit of a challenge to people who may be
    new to the protocol analyzer, as it requires knowledge of protocols, filters,
    and the ability to follow data streams (all of which becomes easier with practice).


    **NetworkMiner** is an easy-to-use packet viewer that some may find easier to
    use for . packet capture (PCAP) analysis, as it extracts and sorts the found data
    into categories of hosts (with operating system fingerprinting), files, images,
    messages, sessions, and more parsing the PCAP file.


    NetworkMiner comes in a free as well as a paid professional version, and can be
    installed on Windows and Linux.


    We will now download NetworkMiner, which will be installed using Wine, and then
    analyze a sample PCAP file:


    +   You can visit the official website for NetworkMiner at this link: `https://www.netresec.com/?page=NetworkMiner`.


    You can also download the installation file at `https://www.netresec.com/?download=NetworkMiner`.


    +   Once the file has been downloaded, right-click on the file and select the
    **Extract Here** option. This extracts the NetworkMiner_2-7-3 folder. Open the
    folder to view the extracted contents.


    ![](img/7489105e357b7dff3e56cd1cbb0de4fa_377_0.png)


    Figure 16.12 - Extracted NetworkMiner files'
