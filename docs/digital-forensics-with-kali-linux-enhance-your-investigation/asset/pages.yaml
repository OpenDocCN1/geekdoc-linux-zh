  md: '# Understanding File Systems and Storage


    Info

    Older versions of Microsoft Windows supported the File Allocation Table (FAT)
    file system by default. Newer versions of Windows also support FAT and FAT32,
    but with drive size limitations (8 TB) and file size limitations (4 GB). Extensible
    File Allocation Table (exFAT) was created to remove the limitations of FAT32 but
    may not be as widely supported as FAT32.


    # Macintosh (macOS)


    Here are some brief features of the Macintosh OS (macOS):


    +   - Hierarchical File System (HFS+)

    - Supported versions: macOS up until version 10

    - Maximum volume size: 2 TB

    - Maximum supported file size: 2 GB


    Apple has since advanced to a newer 64-bit file system called Apple File System
    (APFS), which replaces HFS+ and is optimized specifically for SSDs and iOS devices.


    Here are some brief features of the APFS:


    +   - Supported versions: macOS 10.13 (and newer) and iOS 10.3 and newer

    - Maximum supported file size: 8 exbibytes (EiB)


    # Linux


    Here are some brief features of the Linux File System:


    +   - File system: Fourth Extended File System (ext4). Several file systems are
    available for Linux, but I recommend this one if you are uncertain as to which
    should be used.

    - Supported versions: Red Hat, Kali, Ubuntu, and so so on.

    - Maximum volume size: 1 EiB.

    - Maximum supported file size: 16 tebibytes (TiB).'
