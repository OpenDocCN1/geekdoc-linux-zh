  md: '# # Part 4: Automated Digital Forensics and Incident Response Suites


    In this part, we look at one of the most popular and powerful open source tools
    used by DFIR investigators and analysts, called Autopsy. Autopsy is available
    for both Linux and Windows, although we previously covered only the Linux version
    in past editions of this book, I am absolutely delighted to show you how to get
