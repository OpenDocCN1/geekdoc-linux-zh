- img_proc: true
  md: 'Over the past two decades, there have been significant changes in technology
    and IT. Added to what we traditionally thought of as Information Technology, there
    is now Operational Technology (OT). OT mainly deals with devices and machinery
    traditionally found in the manufacturing and utility sectors, which may be logically
    managed by IT processes. A good example is SCADA (Supervisory Control and Data
    Acquisition) systems, which are commonly used by gas and utility companies to
    monitor operational equipment. Disruption to services could affect millions of
    persons and businesses, and formal incident response procedures should be implemented
    to ensure business continuity and disaster recovery. NIST has published the NIST
    8428 Digital Forensics and Incident Response (DFIR) Framework for Operational
    Technology (OT) (June 2022) as a framework to address these issues, and it covers
    a detailed DFIR process on asset identification, remote data collection, process
    monitoring, field analysis, and more. The full document is available for download
    at:


    https://nvlpubs.nist.gov/nistpubs/ir/2022/NIST.IR.8428.pdf.


    I hope this session was informative, and I encourage you to download and keep
    these documents within a folder or perhaps print and bind them as reference materials
    or an entire DFIR playbook.


    # Summary


    If there was only one thing that I''d like to take away from this chapter, it
    would be to remember that the original evidence, particularly hard drives, storage
    media, and RAM images, should only be used to create forensically-sound bitstream
    copies. The original evidence is never to be worked on.


    To recap, when a breach is reported, there should be an established first responder
    who, performs the tasks of documenting and securing the scene as well as collecting
    and preserving the evidence. The first responder should have a toolkit with various
    tools and items for the acquisition of evidence, and when handing over the evidence
    to other parties, ensure that the CoC is maintained.


    Additionally, we looked at the various procedures and best practices when investigating
    devices that are powered on and powered off, and we discussed the importance of
    using a write blocker to prevent the original evidence from being tampered with
    and then using a hashing tool for integrity verification purposes. Finally, I''ve
    left you with some very useful DFIR frameworks, which, when combined with the
    SWGDE guidelines, make for an impressive DFIR playbook.


    You''ve come this far, and I know it must have been a bit of an information overload,
    but now we can get to the practical section of this book we will begin our investigation
    using digital forensics tools in Kali Linux. Let''s go!'
  merge: -1
