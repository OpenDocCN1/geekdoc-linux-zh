  md: 'For our purposes, an -A option in nmap can perform the following tasks when
    enumerating a host or an entire network:


    +   - OS detection

    - Service version detection

    - Script scanning

    - Traceroute


    The -A option can take a while to run on an entire network, so I''ll run it against
    a single host, which was shown as alive when I previously ran the ping scan on
    my network.


    To run this service scan as it is, I''ll run the following command:


    ```

    sudo nmap -A -v 10.10.10.10

    ```


    The following screenshot shows the output of the -A option within Nmap.


    ![](img/7489105e357b7dff3e56cd1cbb0de4fa_340_0.png)


    Figure 14.7 – nmap service scan


    Scrolling through the service scan output, nmap has displayed a list of open ports
    and has identified the running service and versions, as shown here.


    | PORT | STATE SERVICE | VERSION |

    | 135/tcp | open msprc | Microsoft Windows RPC |

    | 139/tcp | open netbios-ssn | Microsoft Windows netbios-ssn |

    | 445/tcp | open microsoft-ds | Windows 10 Education 10586 microsoft-ds |

