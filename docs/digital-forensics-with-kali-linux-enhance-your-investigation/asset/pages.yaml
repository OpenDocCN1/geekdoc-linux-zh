  md: '# Process identification and analysis


    This tells us that we must only use Windows plugins against this dump for our
    analysis. Let''s now attempt to identifying processes and services.


    Let''s start our DFIR memory dump analysis by attempting to identify and linked
    processes, their IDs, times started, and offset locations within the memory. We
    will be using several plugins but with the following three to get started:


    +   - pslist

    - pstree

    - psscan


    # The pslist plugin


    This tool not only lists of all running processes but also gives useful information
    such as the Process ID (PID) and the Parent PID (PPID), and shows the time the
    processes were started.


    The command to run pslist is as:


    ```

    python3 vol.py -f crindex.vmem windows.pslist

    ```


    In the following screen, we can see that the System, smss, csrss, winologon.exe,
    services, lsass.exe, svchost.exe, and explorer services were all started first
    and then a few others. Not notice any suspicious-looking services?


