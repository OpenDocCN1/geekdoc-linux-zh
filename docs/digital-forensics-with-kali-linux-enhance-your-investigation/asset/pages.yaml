  md: '# # Incident Response, Data Acquisitions, and DFIR Frameworks


    Sometimes, it''s difficult to ascertain exactly what qualifies as evidence, especially
    at the very start of an investigation when all the facts on what occurred may
    not yet been collected or stated. In any investigation, we should be aware of
    the guidelines, practices, and procedures for acquiring evidence in such a way
    that it is not tampered with, or, in a worst-case scenario, lost.


    At the scene of a crime, let''s say a shooting, there are specific items that
    may immediately qualify as evidence. The physical evidence is easily collected,
    put into bags, labeled, and then shipped off to the labs and secure storage areas
    for safekeeping. This evidence may include spent bullet casings, happens a gun,
    fingerprints, and blood samples. Let''s not forget witness statements and Closed
    Circuit Television (CCTV) footage too. It''s also of interest to consider the
    individuals from law enforcement agencies that would be at the scene and the order
    in which they may have arrived. Simple seems enough.


    However, when a breach or crime involving a computer or smart device is reported,
    collecting the evidence is sometimes not as simple, as there are many factors
    to consider before labeling any items as evidence.


    For example, if a desktop was used in the act, do we take the tower, or do we
    seize the monitor, keyboard, mouse, and speakers? What about the other peripherals
    such as printers and scanners? Are there any additional fixed or removable storage
    media at the scene, and do we also seize them?


    This chapter answers all these questions and provides guidelines and best practices
    for incident response, evidence acquisition, and other topics, including the following:


    +   - Evidence acquisition procedures


    +   - Incident response and first responders'
  merge: -1
