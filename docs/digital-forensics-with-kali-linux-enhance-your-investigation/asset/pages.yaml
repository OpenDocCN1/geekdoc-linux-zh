  md: '# Packet Capture Analysis with Xplico


    In this chapter, we''ll look into Xplico, which is an automated Network Forensic
    Analysis Tool (NFAT). Xplico can be found in Kali Linux; however, I''ve found
    that within the last few releases (2019–2022), there are issues when trying to
    run Xplico, possibly due to upgrades in Kali Linux itself.


    Although I will explain how to start Xplico in Kali Linux for those who may have
    the good fortune of running without issues, we will be using Xplico within a virtual
    machine running DEFT Linux 8.1, for those of us who may have difficulties running
    Xplico within Kali itself.


    We will be covering the main topics in this chapter:


    +   - Installing Xplico in Kali Linux

    - Installing DEFT 8.1 in VirtualBox

    - Downloading sample analysis files

    - Starting Xplico in DEFT Linux

    - Using Xplico to automatically analyze web, email, and voice traffic


    # Installing Xplico in Kali Linux


    Follow these steps to install Xplico in Kali Linux:


    +   - If Xplico does not come with the version of Kali Linux you are currently
    using, you can first update Kali Linux and install the Kali forensics repository
    by typing the following command:


    ```

    sudo apt update && sudo install kali-linux-forensics

    ```'
  merge: -1
  pgno: 349
- img_proc: true
  md: '# Packet Capture Analysis with Xplico


    +   2. Next, update your Kali by typing the following command:


    ```

    sudo apt update

    ```


    +   3. Once Kali has updated, install Xplico in Kali by typing the following command:


    ```

    sudo apt-get install xplico

    ```


    +   4. Press Y when prompted to click on Yes and download and install the necessary
    files.


    Then, we need to start the Apache and Xplico services.


    +   5. Start the apache2 service by typing the following command:


    ```

    sudo apache2 start

    ```


    +   6. Start the Xplico service by typing the following command:


    ```

    sudo xplico start

    ```


    +   7. To run Xplico with full administrative privileges as the root user, type
    the following command:


    ```

    sudo /etc/init.d/xplico start

    ```


    +   8. Type Xplico in the search bar and click on the first Xplico option:


    ![](img/7489105e357b7dff3e56cd1cbb0de4fa_350_0.png)


    Figure 15.1 – Xplico options within the search menu


    +   9. The Xplico interface will open in a browser. You can also do this manually
    by entering http://localhost:9876/ in the browser of your choice.


    If the preceding steps do not work, you can use Xplico in DEFT Linux, which we
    will cover in the next section.'
