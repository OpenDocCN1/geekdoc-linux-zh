  md: '# Memory Forensics and Volatility 3


    Let''s do a bit of registry analysis and see what we can come up with.


    # The hivelist plugin


    The hivelist plugin lists the registry hives present at the memory dump was taken
    and also show logged-in users. The hivelist command shows the details of virtual
    and physical addresses along the easiest readable plaintext names and locations.


    To run this plugin, type the following:


    ```

    vol.py -f cridex.vmem windows.registry.hivelist

    ```


    The following screenshot shows the output of the preceding command when running
    with the hivelist plugin:


    ![](img/7489105e357b7dff3e56cd1cbb0de4fa_260_0.png)


    > Figure 10.23 - hivelist plugin output


    # Password dumping


    The location of the Security Accounts Manager (SAM) file is also listed with hivelist
    plugin, showing it contains hashed passwords for usernames in Windows. The path
    to the SAM file is seen in the following screenshot: Windows\system32\config\SAM.
    This file cannot be accessed by users within Windows the system is on. This can
    be further to acquire the hashed passwords in the SAM file to crack passwords
    using with password-cracking tools such as John the Ripper, also available in
    Kali Linux:


    ![](img/7489105e357b7dff3e56cd1cbb0de4fa_260_1.png)


    > Figure 10.24 - SAM file location'
  merge: -1
