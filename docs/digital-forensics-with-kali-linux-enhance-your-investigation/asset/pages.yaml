  md: 'We''ve now covered three methods for installing Kali Linux. I''m sure you found
    this one much easier than the others. Let''s move on to another installation type
    on a portable Raspberry Pi 4.


    # Installing Kali Linux on Raspberry Pi4


    Raspberry Pi 4, also known as the Pi 4, is a low-powered, small, portable, and
    powerful device that can be used for personal, enterprise, and even Operational
    Technology (OT) purposes, as mentioned earlier in this chapter. Having Kali on
    a Pi 4 can be very useful, as it is powerful and comes with USB 3.0 ports, RJ-45
    network port, dual mini-HDMI ports, Wi-Fi, Bluetooth, and up to 8 GB of RAM, and
    it can run Kali off a bootable microSD card in just a few steps. You can learn
    more about the Pi 4 at https://www.raspberrypi.com/products/raspberry-pi-4-model-b/.


    Follow these steps to install Kali on Pi 4 (or the older Pi 2, 3, and 400):


    +   1. Install Kali on Pi 4 (or the older Pi 2, 3, and 400), we''ll need the Pi
    Imager software, which can be downloaded at https://www.raspberrypi.com/software/
    and is available for Windows, Mac, and Ubuntu (x86) devices. Pi Imager will allow
    us to install the Kali Linux ARM version on a microSD card, which will run on
    our Pi 4. I recommend using a 32 GB or larger capacity microSD card to ensure
    that you have enough space for upgrades and downloading additional tools in Kali.


    +   2. Once you have downloaded Pi Imager, insert your microSD card into your
    laptop or desktop, either directly or via a card reader, and launch Pi Imager.


    ![](img/7489105e357b7dff3e56cd1cbb0de4fa_105_0.png)


    Figure 4.6 – The Raspberry Pi Imager interface'
