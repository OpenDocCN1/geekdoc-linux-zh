  md: '# # Red, Blue, and Purple

    Teaming Fundamentals


    Welcome to the third edition of Digital Forensics with Kali Linux, and for those
    of you who may have purchased the previous editions, welcome back. I''d also like
    to sincerely thank you for once again choosing this exciting title. With the second
    edition, this third edition has been updated with new tools, easy-to-follow labs,
    and a couple of new chapters. We have an exciting journey ahead of us, and I''m
    pleased to announce the inclusion of some major additions, including the installation
    of Wine which will allow us to run Windows tools within Kali Linux and will be
    covered in its entirety in Chapter 5, Installing Wine in Kali Linux. Chapter 10,
    Memory Forensics and Analysis with Volatility 3, is also brand-new and shows how
    to perform RAM artifact analysis on newer operating systems. Another chapter on
    using the Autopsy Graphical User Interface (GUI) to perform Digital Forensics
    and Incident Response (DFIR) analysis and investigations can be found in Chapter
    13, Performing a full DFIR Analysis with Autopsy GUI.


    Besides these major additions, we will also look at some new topics, such as creating
    a Kali Linux box using Raspberry Pi 4 and learning about tools such as DD-rescue,
    scourge-ntifs, Magic Rescue, PDF-Parser, Timeliner, netiscode, and introduce Shodan
    and packets for Internet of Things (IoT) discovery and packet analysis.


    For this book, we took a very structured approach to digital forensics, as we
    will do in forensic science. First, we will start into the world of digital forensics,
    its history, and some of the tools and operating systems used for forensics, and
    we will immediately introduce you to the concepts involved in evidence preservation.


    With that said, we have a lot to cover and will start by learning about Kali and
    the cybersecurity teams and the defenses from red, blue, and purple teaming. For
    our returning and advanced readers who may have prior knowledge of Kali Linux
    and the security teams, feel free to skip through the first two chapters and get
    straight into the practical aspects in Chapter 3, Installing Kali Linux, Chapter
    4, Additional Kali Installations and Post-Installation Tasks, and Chapter 5, Installing
    Wine in Kali Linux, which detail the installations of Kali and Wine.'
  merge: -1
  pgno: 23
- img_proc: true
  md: '# Red, Blue, and Purple Teaming Fundamentals


    In this chapter we will cover the following key topics:


    +   - What is Kali Linux?

    - Understanding red teaming

    - Understanding blue teaming

    - Understanding purple teaming


    Before we started with these topics, the following is a sneak peek at how I got
    into the world of Kali Linux, as I feel some of you will be able to relate to
    my story!


    # How I got started with Kali Linux


    Digital forensics has had my attention for over 15 years. Ever since I was given
    my first PC (thanks, Mom and Dad), I''ve always wondered what happened when I
    deleted my files from my massively large 2 GB (Gigabyte) hard drive or moved my
    files to (a less-than-inconspicuous 3.5-inch floppy disk that maxed at 1.44 MB
    (Megabytes) in capacity.


    I learned later that floppy disk drives did not possess the digital immortality
    I confidently believed in. Sadly, many files, documents, and priceless art created
    in Microsoft Paint by yours truly lost to the digital afterlife, never to be retrieved
    again. Sigh The world would never know.


    It wasn''t until later that I came across an article on file recovery and associated
    tools while browsing the magical World Wide Web (WWW) on my lightning-fast 42
    Kbps dial-up internet connection (made possible by my very expensive USRobotics
    dial-up modem), which sang the tune of the technology gods every time I tried
    to connect to the realm of the internet. This process involved the stealthy ninja-like
    skill that would make even a black-ops team feel envious, as it involved doing
    without my parents, which would prevent them from using the telephone line to
    make or receive phone calls (apologies, dear Mother, Father, and older teenage
    sister).


    The previous article on data recovery wasn''t as detailed and fact-filled as the
