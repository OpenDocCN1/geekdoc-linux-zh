    Let''s look at using Nmap to perform host discovery.,


    # Using Nmap to find additional hosts and devices on a network


    Created by Gordon Lyon Fyodor, Nmap is one of the most common tools for network
    scanning and enumeration by vulnerability assessments and penetration tests. It
    is also quite useful for DFIR tasks and investigations when investigating network
    communications that require disclosure of hosts on a network.


    Nmap is also a celebrity and was used in popular movies such as Matrix Reloaded,
    The Bourne Ultimatum, Die Hard 4, and The Girl with the Dragon Tattoo, and also
    the very popular TV series Mr. Robot.


    map is a Command-Line Interface (CLI) tool and comes pre-installed in Kali Linux.
    There is also a Graphical User Interface (GUI) for Windows and Mac devices, but
    I personally think you can access more options and features using the CLI.'
  merge: -1
  pgno: 336
- img_proc: true
  md: '# Using Nmap to find additional hosts and devices on a network


    Nmap has many switches and prior knowledge of ports, Transmission Control Protocol/
    Internet Protocol (TCP/IP) protocols, and TCP flags, all of which you should read
    about before proceeding if you are unfamiliar with those topics. Please visit
    this link for more information on TCP: https://en.wikipedia.org/wiki/Transmission_Control_Protocol.

    Let''s follow these steps to use Nmap to find additional hosts and devices on
    a network:


    +   1. To start nmap and view the available switches and options, we can use the
    following command:


    ```

    sudo nmap -h

    ```


    As stated in the preceding output, the general format and usage of nmap is nmap
    [Scan Type(s)] [Options] {target specification}.


    ```

    (kali)kali:~# sudo nmap

    [password for kali]: ] Nmap 7.92 ( https://nmap.org ) [options] {target specification}

    TARGET SPECIFICATION:

    Usage: nmap [Scan Type[s]]

    Scan hosts, IP addresses, networks, etc.

    Ex: nmap.org, microsoft.com, 192.168.0.1; 10.0.0-255.1-254

    -I<filename>: Input from list of hosts

    -IR <hosts>: Choose random targets

    --exclude hosts: Exclude hosts/networks

    --excludefile: Exclude from file

    HOST DISCOVERY:

    -si List scan simply targets to scan

    -sn disable port scan

    -Pn: Treat all hosts as online skip host discovery

    -PS/PA/PY/[portlist]: TCP SYN/ACK, UDP or SCTP discovery to given ports

    -PE/PR/port range subnet mask discovery probes

    -PO[protocol]: IP Protocol

    -n/R: Never do DNS resolution/Always [default: sometimes]

    -dns-servers {server1,server2,...}: Specify custom DNS servers

    --traceroute: Trace path to host

    SCAN TECHNIQUES:

    -S/ST/SA/SW/SM: TCP SYN/Connect/(ACK)/Window/Maimon scans

    -sN/SF/sX: TCP Null, Full, and Xmas scans

    -scanflags: Custom TCP scan flags

    -i1 host(portprobe): Idle scan

    -sV SCTP INIT/COOKIE-ECHO scans

    -sO: IP protocol scan

    -b FTP relay: FTP bounce scan

    PORT SPECIFICATION AND SCAN ORDER:

    -p port ranges: Only scan specified ports

    Ex: -p22 -p1-65535; -U 53,111,137,T:21-25,129,8080,S:9

    --exclude-ports <port ranges>: Exclude the specified ports from scanning

    ```


    Figure 14.4 - A snippet of nmap help output'
  merge: -1
