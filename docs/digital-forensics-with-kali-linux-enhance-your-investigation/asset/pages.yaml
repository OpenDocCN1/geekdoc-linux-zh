  md: 'These are the features of DD:


    +   * Bitstream (raw) disk acquisition and cloning

    * Copying disk partitions

    * Copying folders and files

    * Hard drive error checking

    * Forensic wiping or forensic and secure deletion of all data on hard disks


    DC3DD is updated whenever DD updates. DC3DD offers the best of DD with more features,
    including the following:


    +   * On-the-fly hashing (or dashing instantly by the tool), using more algorithm
    choices (MD5, SHA-1, SHA-256, and SHA-512)

    * A meter to monitor progress and acquisition time

    * Writing of errors to a file

    * Splitting of output files

    * Verification of files

    * Wiping of output files (pattern wiping)


