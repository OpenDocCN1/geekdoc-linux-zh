  md: '# History and types of storage media


    There are two broad categories of CDs:


    +   - Compact Disk – Read-Only Memory (CD-ROM): This disc comes with data on it
    in the form of programs, games, music, and so on, and can only be read from a
    Compact Disk Recordable (CD-R). Data can be written to this disc, but only once.

    - Compact Disk – Reritable (CD-RW): Data can be written to this disc many times.


    # Digital versatile discs


    Digital versatile discs (DVDs), although the same size in diameter, can store
    much more data than CDs:


    +   - Diameter: 120 mm (same as a CD)

    - Type of laser used to write data: 650 nm red laser

    - Maximum capacity of a DVD: 4.7 GB and 15.9 GB (dual-layer DVD)


    The various types of DVDs are as follows:


    +   - DVD – Read-Only Memory (DVD-ROM): This DVD comes with data already written
    to it, much like a CD-ROM.

    - DVD – Recordable (DVD-R): Data can be written once to the DVD.

    - DVD + Recordable (DVD+R): Data can be written once to the DVD. DVD+Rs utilize
    advanced error detection and management technology.

    - DVD –Writable (DVD-RW): Data can be written to the DVD several times.

    - DVD – Recordable Dual Layer (DVD-R DL): This type of DVD contains dual layers
    resulting in higher storage capacities between 7.95 GB on a DVD-9 disk and 15.9
    GB on a DVD-18 disk.

    - DVD – Recordable Dual Layer (DVD+DL): Same as the DVD-R DL, but has been argued
    to be the more efficient format, resulting in fewer errors.

    - DVD – Random-Access Memory (DVD-RAM): Mainly used in video recording equipment
    due to its resiliency (lasting up to two decades) and the ability to rewrite data
    onto it. This disc is more expensive than other DVD formats and is also not compatible
    with many common DVD drives and players.'
  merge: -1
  pgno: 141
- img_proc: true
  md: '# Blu-ray Disc


    The current standard for removable disk media, the Blu-ray Disc gets its name
    from the color of the laser used to read and write to the disk. Due to the high-capacity
    storage of Blu-ray Discs, high-definition (HD) content can be easily stored on
    Blu-ray Discs without loss of quality:


    +   - Diameter: 120 mm (same as a CD and DVD)

    - Type of laser used to write: 405 nm blue laser

    - Maximum capacity of a DVD: 25 GB and 50 GB (dual-layer Blu-ray)

    - Data Transfer: up to 72 megabits per second (Mbps)


    Both capacities of Blu-ray Discs also come in rewriteable and recordable formats:


    +   - BD-RE: Blu-ray Rewritable

    - BD-RE DL: Blu-ray Rewritable Dual-layer (50 GB)

    - BD-R: Blu-ray Recordable

    - BD-R DL: Blu-ray Recordable Dual-layer (50 GB)


    # Flash memory storage


    Flash memory is so named because the data is written to and erased using electrical
    charges. You may have perhaps someone say they''ve to flash their mobile device.
    This is quite similar to erasing flash storage media on smartphones and smart
    devices, except OSs such as Android and iOS require a much more extensive procedure
    for flashing and reinstalling the OS. However, the end result is much the same
    in that the memory and storage areas are reset or wiped.


    Flash storage chips come in two types, known as NOT (NAND) and NOR flash memory,
    and are responsible for high-speed and high-capacity storage of data on flash
    storage media. They are never types of electrically erasable programmable read-only
    memory (EEPROM) chips that can wipe blocks of data or the entire drive, rather
    than just one at a time, with the slower EEPROM. This type of flash memory chip
    is non-volatile, meaning that the data is still on the chip even after power to
    the chip is lost. Data is erased when specific instructions are sent to the chip
    in the form of electrical signals via a method known as in-circuit writing, which
    alters the data accordingly.


    The following photo shows one of my 1 GB (left) flash drives and a newer 32 GB
    flash drive with NAND chips exposed (right). Notice that even the chips are similar
    in size, the one on the right has 32 times the data capacity, as they were manufactured
    over a decade apart:'
  merge: -1
  pgno: 142
