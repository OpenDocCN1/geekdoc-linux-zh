    We now know how to scan internal networks and identify live systems and details
    about those systems, such as their OS, MAC address, uptime, and open ports, all
    just using Nmap.


    Let''s move outside the local network and learn how to locate and identify external
    and IoT devices using Shodan.


    Quick think of a website that allows you to search for anything. Without being
    a psychic, I''m guessing you thought of Shodan. Maybe I''ll stick to my day job.
    In the same way that Google crawls and crawls the main parts of the internet and
    indexes websites and resources, Shodan takes a similar approach to scanning the
    internet and IP addresses and indexes useful information about devices that can
    be accessed across the web.'
  merge: -1
  pgno: 341
- img_proc: true
  md: 'IoT (short for Internet of Things) devices are those that can connect to the
    internet but may not be traditional computers, such as laptops and desktops. IoT
    devices include smart devices, such as wearable fitness devices and trackers,
    smart microwaves and ovens, Amazon Echo, doorbell cameras, and smart cars. IoT
    devices extend to industrial systems and are referred to as Industrial IoT (IIoT)
    devices. Thinking of a large drug manufacturing company as an example. There are
    systems and devices to count bottles, cans, labels, checks and facilitate communications
    between sensors that need to be networked with each other via Programmable Logic
    Controllers (PLCs), Supervisory Control and Data Acquisition (SCADA), and Industrial
    Control Systems (ICS). This applies to every industrial sector, even power plants!
    It is not uncommon to this Operational Technology (OT) with IoT, known as OT-IoT,
    or OT devices to be remotely controlled by IoT systems.


    The issue here lies in securing IoT and IIoT devices as well as access, particularly
    remote access, devices. As a penetration tester, use Shodan.io frequently to find
    systems belonging to different types, particularly larger organizations. This
    skill is also useful when conducting DFIR investigations, as information about
    external and IoT devices can be easily found using Shodan.io.


    The team at Shodan claims that Shodan can find all devices that are connected
    to the internet and reveal important metadata about the devices. This can be beneficial
    because it allows companies to use Shodan to find out whether their devices can
    be publicly accessed, but it also shows attackers the same information. This is
    not to say that Shodan is a bad or malicious tool, as there are hundreds of other
    tools that can be used together to diverge the same information. Shodan just makes
    it much easier.


    Shodan is a paid subscription; however, you can use it for free, which gives very
    limited results, or register a free account and gain access to two pages of results
    when performing IoT and IIoT searches. If you don''t want to purchase one of their
    subscription packages, you can wait for their annual sale (usually around Black
    Friday and Thanksgiving), when a limited lifetime subscription for personal use
    is available for $5. For this exercise, I will be using the $5 subscription, but
    I encourage you to register with the site so that you least have access to two
    pages of results at a time.


    # Using Shodan filters for IoT searches


    Shodan searches aren''t as clear-cut as a Google search, but it''s not difficult
    to search for Shodan filters and to search for specific devices. You can view
    the Shodan Filter Reference at https://beta.shodan.io/search/filters.


    Here are some basic filters you can use:


    +   - product: Search the name of the hardware manufacturer or software developer

    - hostname: Find devices based on the searched hostname

    - os: Search for devices by OS

    - port: Find open ports on devices'
  merge: -1
  pgno: 342
