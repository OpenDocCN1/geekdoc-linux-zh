  md: '# Red, Blue, and Purple Teaming Fundamentals


    Another reason why Kali is popular is that there are several versions available
    for a multitude of physical, virtual, mobile, and portable devices. Kali is available
    as a standalone operating system image and can also be installed virtually using
    their pre-built images for virtual platforms such as VMware and VirtualBox, which
    will be covered in Chapter 3, Installing Kali Linux, and Chapter 4, Additional
    Kali Installations and Post-Installation Tasks. There are also versions for Kali
    ARM devices, instance, and the ability to run Kali Linux in Windows 10 under the
    Windows Subsystem for Linux (WSL). As an instance, I also use the mobile version
    of Kali Linux Kali NetHunter on one OnePlus phone and on a Raspberry Pi 4, when
    connected to a power bank, as well as NetHunter (and even Kali itself in some
    case) can be installed on a variety of phones from Samsung, Nokia, OnePlus, Sony,
    Xiaomi, or ZTE. We''ll look at installing Kali Linux in VirtualBox and Raspberry
    Pi 4 in Chapter 4, Additional Kali Installations and Post-Installation Tasks.

    The fact that Kali offers all these features and can be easily upgraded with the
    addition of new tools just a couple of clicks and commands make it the perfect
    teaming solution. Let''s take a look at red, blue, and purple teaming and the
    skillset for each team.


    # Understanding red teaming


    Possibly the most commonly known name among users of Kali Linux, the red is the
    name given to the collective of individuals responsible for handling the offensive
    side of security as it relates to OSINT, vulnerability assessments, and the penetration
    testing of resources, including but not limited to individuals, companies, host
    users (desktops, mobiles), and network and critical infrastructure such as servers,
    routers, firewalls, databases, WebApps, and portals. There are also systems such
    as IoT, Operational Technology (OT) devices, and Industrial Control Systems (ICS),
    which also require assessments by highly skilled red testers.


    Red teams are generally thought of as highly skilled ethical hackers and penetration
    testers, who apart from having the skill set to conduct the assessments listed
    previously, may have the technical certifications that allow them to do so. Although
    certifications may not directly reflect the abilities of the individuals, they
    have been known to aid in obtaining jobs.


    Some red teaming certifications include (but are not limited to):


    +   - Offensive Security Certified Professional (OSCP): Developed by the creators
    of Kali Linux

    - Ethical Hacker (CEH): From the E-Council

    - Practical Network Penetration Tester (PNPT): Developed by TCM Security

    - Pentest+: By CompTIA

    - SANS SEC: Courses from the SANS Institute

    - e-Learn Junior Penetration Tester (eJPT): Developed by e-Learn Security for
    beginners interested in becoming red team'
