- img_proc: true
  md: '# File Recovery and Data Carving Tools


    To specify the file types, the investigator must remove the comments at the start
    of the line containing the file type, as all supported file types are commented
    out with a hashtag at the beginning of the file type. The following screenshot
    shows the default Scalpel configuration file (scalpel.conf) with all file types
    commented. Note that each line begins with a hashtag:


    | GIF and JPG files (very common) | | |

    |---|---|---|

    | # gif | y | 5000000 |

    | # jpg | y | 5000000 |

    | # jpg | y | 5242880 |

    | # jpg | y | 5242880 |


    | PNG | | |

    |---|---|---|

    | # png | y | 20000000 |


    | BMP | | |

    |---|---|---|

    | # bmp | y | 100000 |


    | TIFF | | |

    |---|---|---|

    | # tif | y | 200000000 |

    | # tif | y | 200000000 |


    | ANIMATION FILES | | |

    |---|---|---|

    | # | | |


    | AVI (Windows animation and DIVXPEG-4 movies) | | |

    |---|---|---|

    | # avi | y | 50000000 RIFF???AVI |


