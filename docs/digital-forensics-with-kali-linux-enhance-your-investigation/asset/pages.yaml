- img_proc: true
  md: '# 11

    # Artifact, Malware, and Ransomware Analysis


    In this chapter, we''ll cover several different tools to uncover various digital
    artifacts, malware, and ransomware, some of which reside in RAM and the swap file,
    as we learned in the previous chapter, can be quite useful in our DFIR investigations.


    To start things, we will look into artifact analysis using tools like p0f to identify
    devices and operating systems, use swap_digger for swap file analysis, and then
    use MimiPenguin for password dumping. Following this, we will dive into malware
    analysis using pdf-parser and PDFiD for PDF malware analysis, and then end things
    off by using Volatility 3 for ransomware analysis.


    The following topics will be covered in this chapter:


    +   * Identifying devices and operating systems with p0f

    * Looking at the swap_digger tool to explore Linux artifacts

    * Password dumping with MimiPenguin

    * PDF malware analysis

    * Using Hybrid Analysis for malicious file analysis

    * Ransomware analysis using Volatility 3


    # ## Identifying devices and operating systems with p0f


    Let''s get started with p0f, p0f is a small tool that can be used to passively
    scan and detect operating systems within a network. This scanning tool is considered
    passive because it does not send data to other hosts apart from Synchronize (SYN)
    packets. This is very useful when trying to quietly collect information from other
    hosts on a network in DFIR investigations.'
  merge: -1
  pgno: 265
