  md: 'Blue teams must also accept that their responsibilities do not only apply to
    internal and external resources but will be extended when considering the threat
    landscape of the assets to be protected. The threat landscape can be devices,
    persons, data, and any information that may be useful to an attacker when planning
    an attack. This is when in-depth understanding of OSINT comes in. Although previously
    mentioned as a red teaming skill, this proves equally important to the blue team
    in being able to scout the internet, social media, and the dark web for any information
    that could either pose a threat or aid the threat actor in some way.


    A good example would be to search the dark web for databases that the blue team
    (after taking all necessary precautions to protect themselves) browses the dark
    web in search of compromised emails or Virtual Private Network (VPN) credentials
    of the team they work for. The blue team may also use a site like Shodan.io, with
    which we will cover later in this book, to find accessible devices from an external
    perspective, such as access to firewalls, and CCTV cameras. All of the preceding
    scenarios the blue team developing in what is known as a threat profile, while,
    not focusing on internal and external assets, will still create potential threats
    and even Indicators of Compromise (IOC) found externally.


    A great resource for learning OSINT is TCM Academy’s 4-hour course on YouTube,
    which can be found here https://www.youtube.com/watch?v=gwA6MbebNG.


    Many of the previously mentioned skills are learned via research and countless
    hours, looking at YouTube videos, and attending specialized courses. I’ve listed
    just a few certifications that may assist in furthering your studies and career
    in blue team and DFIR.


    Some blue teaming certifications (but are not limited to):


    +   * Computer Hacking Forensic Investigator (CHFI) from EC-Council

    * Certified Cloud Security Examiner (CCSE) from EC-Council

    * Certified Forensic Computer Examiner (CFEC) from IACIS

    * GIAC Certified Forensic Examiner (GFCE) from SANS


    We will look at the tools required to be a DFIR investigator and in more detail
    throughout this book. Although we’re not going into detail about commercial tools
    used, I will mention that you may wish to look into some point when heading into
    a career in DFIR or as a blue team, the open source tools used in this book are
    more than enough to get you started and conduct DFIR investigations as long as
    the best practices are followed.


    It is also of paramount importance that DFIR investigators and analysts understand
    the importance of following best practices and procedures in evidence collection,
    acquisition, analysis, and documentation, as the integrity of the evidence and
    case could be easily compromised. Analysis of evidence and results in reports
    should be repeatable, meaning that other DFIR investigators and analysts should
    be able to repeat the tests performed and produce the same results as you.'
