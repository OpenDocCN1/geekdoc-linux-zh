  md: '# File Recovery and Data Carving Tools


    Now that we''ve learned how to create forensic images of evidence, let''s look
    at the file recovery and data carving process, using specific tools in Kali Linux.


    File carving retrieves data and files from unallocated space using specific characteristics
    such as the file structure and file headers, instead of traditional metadata created
    by, or associated with, filesystems. A simple way to think of file carving is
    to think of an ice sculpture. It starts off with a huge block of ice, which, when
    given to a skilled individual, can be chipped away into a piece of art. In the
    same previous chapter, and then use a variety of tools to extract useful data
    and files from the acquired forensic image.


    In this chapter, we''ll cover the following topics:


    +   * File basics

    * Downloading sample files for the labs in this chapter

    * Performing file recovery and data carving using Foremost

    * Performing image recovery with Magicrescue

    * Data carving with Scalpel

    * Data extraction with bulk_extractor

    * NTFS recovery using scrounge_ntfs

    * JPEG recovery with Recoverpejpeg'
  merge: -1
  pgno: 213
- img_proc: true
  md: '# File basics


    Before we get started on the practical aspects, let''s briefly go through some
    common terminology.


    When we last corrupted filesystems in Chapter 6, Understanding File Systems and
    Storage, we learned that various operating systems use their own filesystems to
    be store, access, and modify data. Storage media use file systems to the very
    same.


    Metadata, or about data, helps an operating system identify data. Metadata includes
    technical information, as the creation and modification dates, and the file type
    of the data. This data makes it much easier to locate and index files.


    As the names imply, unallocated space is an area of storage media that has been
    marked by an operating system or file table as empty, or unallocated to any file
    or data. Although the location of and information about, the file is not present
    and sometimes corrupted, there are still characteristics about the file that are
    noted in its header and footer that can identify the file, or even fragments of
    the file.


    Even if a file extension has been changed or is missing altogether, file headers
    contain information that can identify the file type and we can attempt to carve
    the file by analyzing the header and footer. Data carving is quite a lengthy process
    and should be done using automated tools to save time. It also helps if the investigator
    has an idea of what file types they are looking for, giving them a better focus
    and saving time. Nevertheless, this is forensics, and we know that time and patience
    are key.


    Some file types, as displayed within the file headers, include the following:


    +   * Joint Photographic Experts Group (JPEG): FF D8 FF E0

    * Portable Document (PDF): 25 50 44 46


    While more on the analysis of files and headers will be looked at in Chapter 12,
    Autopsy Forensic Browser, and Chapter 13, Performing a Full DFIR Analysis with
    the Autopsy 4 GUI, using Autopsy, let''s download the first sample files we will
    use for carving in Kali Linux.


    # Downloading the sample files


    Before we begin our DFIR file recovery and data carving activities, I thought
    it would be a good idea to have all sample files downloaded, which will allow
    us to jump straight into the specifics of each tool without the process being
    interrupted.


    We will be using the following sites, which generously offer free datasets and
    acquisitions to the public. A special thank to all that have compiled and indexed
    their time and resources to make this available to us:


    +   * Digital Forensics Tool Testing Images: https://dftt.sourceforge.net/

    * Computer Forensic Reference DataSets (CFREDS): https://cfreds.nist.gov/

    * Digital Corpora: https://digitalcorpora.org/'
  merge: -1
  pgno: 214
- img_proc: true
  md: '# File recovery and data carving with Foremost


