  md: 'Let''s list all drive partitions by typing the following:


    ```

    sudo scrounge-ntfs -l /dev/sdb

    ```


    The following screenshot shows the output of the previously typed command.


    ![](img/7489105e357b7dff3e56cd1cbb0de4fa_236_0.png)


    Figure 9.32 - The drive details


    Now that we can see the specific sector, cluster, and offset values (which I''ve
    also listed here for clarity), we can use the format specified in the preceding
    scrounge-ntfs -h output (Figure 9.32):


    +   - Start Sector: 16128

    - End Sector: 977680002

    - Cluster Size: 8

    - MFT Offset: 24


    The default usage for scrounge-ntfs is as follows:


    ```

    sudo scrounge-ntfs [-m offset] [-c clustersize] [-o outdir] disk start end

    ```


    Let''s break down the preceding options:


    +   - o [outdir] = the output directory to save all recovered files to

    - disk = the drive to recover

    - start = the start sector

    - end = the end sector


    For my drive, the command will be the following:


    ```

    sudo scrounge-ntfs -m 629456 -c 8 /dev/sdb/ 2048 157265292

    ```


    I did not specify an outdir or output directory command, as I am already within
    the output directory of Scrounge_recovery, which I previously created.'
