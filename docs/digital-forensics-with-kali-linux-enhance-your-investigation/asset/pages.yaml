  md: 'What is Kali Linux?


    As time passed, I researched many tools on various platforms for Windows, Macintosh,
    and many Linux distributions. I found that the tools used in digital forensics
    could be installed on various Linux distributions or flavors, and many of these
    tools were well maintained, constantly being developed, and accepted by peers
    in the field. Kali Linux is a Linux distribution or flavor, but before we go any
    further, let me explain the concept of a Linux distribution or flavor. Consider
    your favorite beverage: this beverage can be in many flavors, not without sweeteners
    or sugar, in different colors, and even in various sizes. No matter the variations,
    it''s still the basic ingredients that comprise the beverage. In this way, we
    have Linux and different types and varieties of Linux. Some more popular Linux
    distros and flavors include RedHat, CentOS, Ubuntu, Mint, KNOOPPIX, and of course,
    Kali Linux. On Kali Linux will be discussed in Chapter 3, Installing Kali Linux.


    With that said, let''s move on to our next section as we get started with exploring
    the enchanting world of Kali Linux!


    # What is Kali Linux?


    Kali Linux is a Debian-based operating system used globally by cybersecurity professionals,
    students, and IT enthusiasts. Debian is a flavor of Linux that is completely free,
    stable, constantly updated supports many types of hardware, and is also used by
    popular operating systems as Ubuntu and Zorin. Kali Linux is certainly not new
    to the cybersecurity field and even goes back to the mid-2000s, but it was known
    as BackTrack, which was a combination of two platforms called Audit Security and
    Whack. This was back in 2006, with subsequent versions of BackTrack released up
    to 2011 when BackTrack 5, based on Ubuntu 10.04, was released.


    In 2013, Offensive Security released the first version of Kali v1 (Moto), which
    was based on Debian 7 and then Kali v2 in 2015, which was based on Debian 8. This,
    Kali Rolling was released in 2016, with the names of distribution reflecting both
    the year of release and the major update of the quarterly period. For example,
    at the time of writing, I used Kali 2022. 3 and 2022. 4, both based on recent
    versions of Debian. You can find more on the open source and free Debian Project
    at https://www.debian.org/intro/about.


    As a cybersecurity professional, a Chief Information Security Officer (CISO),
    penetration tester (pentester), and now expert in DFIR, I have used BackTrack
    and now Kali Linux for over a decade since I came across it when I started studying
    for the Certified Ethical Hacker in 2006. Since then, I used a myriad of operating
    systems for testing and digital forensics, but my main tool of choice, particularly
    for testing, is Kali Linux. Kali Linux has focused on penetration testing, making
    it much easier for me to have both penetration testing and DFIR tools on one platform
    rather than having to switch between them.


    For our readers who have purchased the first and second editions of this book,
    I''d say you certainly for a treat as I''ve not updated many labs and introduced
    new tools in this edition, but I''ve also included a chapter on installing Kali
    Linux. Windows Emulator (Wine) allows'
