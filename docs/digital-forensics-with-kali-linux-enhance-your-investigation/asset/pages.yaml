  md: '# Understanding File Systems and Storage


    Some advantages come from the fact that there are no moving parts in an SSD. No
    moving parts make the SSD more durable in the event of a fall or swift foot to
    the PC tower, there are no plates or actuator arms to be scratched or struck.
    Also, the faster read/write speeds and access times greatly reduce the time taken
    for the device to boot or start and give an enhanced experience when using resource-intensive
    software and games.


    As far digital grows, SSDs are a relatively new technology that will be constantly
    improved upon some time to come. It''s important to remember that you are not
    dealing with a mechanical drive and remember to that data on an SSD, like a flash
    drive or memory card, can be lost or wiped within minutes or even seconds. Although
    traditional tools can be used to image and recover data from SSDs, I strongly
    suggest recovering any drive before performing your forensic activities to get
    a better understanding of its workings and complexities, as de-chipping and wear-leveling
