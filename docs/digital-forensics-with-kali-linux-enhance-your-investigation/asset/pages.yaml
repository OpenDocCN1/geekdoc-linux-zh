  md: '# Creating strong hashes for evidence integrity


    As seen in the previous screenshot, Kali Linux recognizes two devices:


    +   - sda: The primary hard disk with three partitions

    - sdb: The storage drive to be forensically acquired or imaged


    Users new to Kali or any Linux version or variation may find that the drive and
    partition recognition and naming conventions in Kali are different from those
    on Windows.


    A typical device in Linux can be addressed or recognized as /dev/sda, whereas
    drives in Windows are usually recognized as Disk 0 and Disk 1, and so on:


    +   - /dev: This refers to the path of all devices and drives that can be read
    from or written to, recognized by Linux

    - sda: This refers to SCSI (short for Small Computer Systems Interface), SATA,
    and USB devices


    sd stands for SCSI Mass-Storage Driver, with the following letter (for example,
    a, b, etc.) representing the drive number:


    +   - sda: Drive 0 or the first drive recognized

    - sdb: The second drive or storage media


    While Windows recognizes partitions as primary, logical, and extended, Linux partitions
    are recognized as numbers that follow the drive letter:


    +   - sda1: Partition 1 on the first disk (sda)

    - sda2: Partition 2 on the first disk

    - sdb1: Partition 1 on the second disk (sdb)

    - sdb2: Partition 2 on the second disk


    More information on Linux device naming conventions can be found at https://www.dell.com/support/kbdoc/en-tt/000132092-ubuntu-linux-terms-for-your-drive-hard-and-devices-explained=-:
    -=Under%20Linux%2C%20the%20original%2naming,address%2Dwise%20and%20on.


    Now that we can identify the drives and partitions within a Linux file system,
    let''s learn how to create hashes of the evidence for integrity purposes in the
    next section.


    # Creating strong hashes for evidence integrity


    To provide proof that evidence was not tampered with, a cryptographic algorithm
    must be run against the evidence before, during, and after a forensic acquisition.
    These algorithms produce an output string (or hash output) of hexadecimal characters
    (a-f and 0-9) of various lengths, depending on their strength.'
  merge: -1
  pgno: 183
- img_proc: true
  md: 'Common cryptographic algorithms are as follows:


    +   * MD5: Message Digest

    * SHA-1: Secure Hash Algorithm algorithm version 1

    * SHA-256: SHA-2 256-bit


    > Note

    More information on cryptographic hashes can be found at https://www.tutorialspoint.com/cryptography/cryptography_hash_functions.htm.


    In Kali Linux, we use the md5sum, shasum, or sha256sum commands, followed by the
    path of the device, to create a hash output of the evidence/input file. For example,
    to create a SHA-256 hash, we would use the following command, where sdx represents
    the drive we are trying to acquire or image:


    ```

    Sha256sum /dev/sdx.

    ```


    Although I mentioned the md5sum command, I recommend using a stronger algorithm,
    such as SHA-1 or SHA-256, as MD5 is much older and can be compromised:


    +   * MD5 strength: 128-bit hash value

    * SHA-1 strength: 160-bit hash value

    * SHA-256 strength: 256-bit value

    * SHA-3 strength: 256-bit value (but faster than SHA-2)


    To create an MD5 hash output against my Pro Du card (sdb), I used the following
    command:


    ```

    sudo md5sum /dev/sdb.

    ```


    To create a SHA-1 hash output against my Pro Du card (sdb), I used the following
    command:


    ```

    sudo sha1sum /dev/sdb.

    ```


    To create a SHA-256 hash output against my Pro Du card (sdb), I used the following
    command:


    ```

    sudo sha256sum /dev/sdb.

    ```'
  merge: -1
  pgno: 184
- img_proc: true
