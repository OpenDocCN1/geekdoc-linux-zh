- img_proc: true
  md: 'In recent times, we''ve seen several major digital breaches online, especially
    from 2011 onward. Many of these attacks allegedly came from or were claimed to
    be the work of infamous hacker groups, such as LulzSec, Anonymous, Lizard Squad,
    and many others, including individuals and hacktivists (people that hack for a
    specific cause and reason or are less concerned about doing time in prison). Some
    of these hacks and attacks not only brought down several major networks and agencies
    but also cost millions in damage, directly and indirectly; as a result, the loss
    of public confidence in the companies contributed to further increases in damages.


    These daring, creative, public attacks saw the emergence of many other new groups
    that learned from the mistakes of past breaches by Anonymous and others. Both
    social media and underground communication channels soon became the easiest forms
    of communication between like-minded hackers and hacktivists. With the internet
    and World Wide Web becoming easily accessible, this saw competition not only between
    IBs but also private companies and corporations, which led to the creation of
    free wireless hotspots on almost every street with businesses, small or large.


    The result of having internet access just about every coffee shop opened with
    a smartphone, tablet, laptop, or other devices to acquire most unauthenticated
    access to the internet. This gave them access to hacker sites and portals, along
    with the ability to download tools, upload malware, send infected emails, or even
    carry out attacks.


    We should also consider the impact of encryption techniques on our investigations,
    which we will look at next.


    # Encryption


    Adding to this scenario is the availability of more user-friendly tools to aid
    in the masking of Public Identifiable Information (PII), or any information that
    would aid in the discovery of unveiling suspects involved in cyber-crimes during
    forensic investigations. Tools used for the encryption of data and anonymity,
    such as masking of IP addresses, are available to anyone, most of which are increasingly
    more and user-friendly.


    It should be noted that many Wi-Fi hotspots can be quite dangerous, as these can
    be easily set up to intercept personal data, such as login and password information,
    together with PII (such as social security numbers, data of birth info, and phone
    numbers) from any user who may connect to the Wi-Fi and enter such information.


    The process of encryption provides confidentiality between communication parties
    and uses technology in much the same way we use locks and keys to safeguard our
    personal and private belongings. For a lock to open, there must be a matching
    key. So so, in the digital world, data is encrypted or locked using an encryption
    algorithm and must use the same key to decrypt or unlock the data. There also
    exists another scenario where one key may be used to encrypt or lock the data
    and used to decrypt the data. Two very popular encryption tools are TrueCrypt
    and VeraCrypt.'
  merge: -1
  pgno: 62
- img_proc: true
  md: '# The need for multiple forensics tools in digital investigations


    These two encryption tools use very high encryption methods that keep data very
    confidential. The main barrier to forensics is acquiring the decryption key to
    decrypt or unlock access to the data.


    > Important note

    TrueCrypt and VeraCrypt not only encrypt files but also encrypt folders, partitions,
    and entire drives!


    Added to the use of encryption tools, as those mentioned here, we should also
    consider the use of anonymity tools, such as those mentioned in the next section.


    # Online and offline anonymity


    Encryption, in particular, can investigations rather difficult, but there is also
    the concept of anonymity, which adds to the complexity of maintaining the accuracy
    of the true sources found in. Like encryption, there exist several free open source
    tools for all OS platforms, such as Windows, MacOS, Linux, and Android, which
    attempt to (most successfully) mask the hiding of someone''s digital footprint.
    This digital footprint uniquely identifies you by its IP and Media Access Control
    (MAC) address. Without going into the network aspect of things, these two digital
    addresses can be compared to a person''s full name and home address, respectively.


    Even though a person''s IP address can change according to their private network
    (home and work) and public network (internet) access, the MAC address remains
    the same.


    However, various tools are also freely available to speed or fake your IP and
    MAC addresses for the purpose of privacy and anonymity. Adding to that, users
    can use a system of routing their data through online servers and devices to make
    tracing the sources of the sent data quite difficult. This system is referred
    to as proxy chaining which does some of the user''s identity hidden.


    A example of this would be Tor Browser; it uses onion routing and proxy servers
    worldwide to route or pass the data along proxy to proxy, making the tracing of
    the source very difficult but not impossible. You can think of proxy chains as
    a relay race, but instead of having four people, one passing the baton to the
    next, the data is passed between hundreds of proxy devices worldwide.


    Now you should have a basic understanding of anti-forensics and also understand
    the use of encryption and anonymity tools to hide or obscure information and data
    that may complicate DFIR investigations. Let''s summarize the topics we just covered
    and then move to the next chapter.'
