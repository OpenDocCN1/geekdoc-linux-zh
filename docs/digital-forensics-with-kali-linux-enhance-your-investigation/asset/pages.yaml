  md: '# Integrated Drive Electronics HDDs


    Many of the first PCs in the mid-1980s were outfitted with hard drives that used
    Parallel Advanced Technology Attachment (PATA) and Integrated Drive Electronics
    (IDE) technology. As with all older devices back then, parallel transmission (sending
    multiple bits simultaneously but slowly) was the order of the day, allowing for
    very limited throughput. An easy way to identify older IDE drives is to simply
    look at the interface where the data and power cables connect to the drive.


    These older drives, as seen in the following photo, have four pins for power,
    which connect to a Molex connector, separated by eight pins used to set the device
    as a master or slave device, and then 40 pins for the IDE data cable, which transmits
    the data to the motherboard:


    ![](img/7489105e357b7dff3e56cd1cbb0de4fa_149_0.png)


    Figure 6.7 – 3.5-inch IDE hard drive


    In 1994, advancements in technology led to the release of Enhanced Integrated
    Drive Electronics (EIDE), which saw an increase in the number of pins for the
    data cable from 40 to 80, also increasing the transmission speeds from 40 Mbps
    to a possible 133 Mbps.


    IDE/EIDE was still however, limited to a maximum of four IDE/EIDE drives per computer,
    as the jumper pins on the drive only allowed for two primary and two secondary
    drives, set in a master and slave configuration. Consideration also had to be
    given to the fact that CD-ROM and RW devices and DVD-ROM and RW devices were also
    using IDE/EIDE technology at that time.'
  merge: -1
  pgno: 149
- img_proc: true
  md: '# Serial Advanced Technology HDD technology called Serial Advanced Technology
    Attachment


    In 2002, Seagate released an HDD technology called Serial Advanced Technology
    Attachment (SATA), which used serial transmission instead of a slower parallel
    transmission. Whereas PATA drives speeds of 33/66/133 Mbps, SATA drives boasted
    speeds of 150/300/600 Mbps. This meant that the lowest SATA transmission speed
    of 150 Mbps was faster than the highest PATA speed of 133 Mbps.


    The connector interfaces of the SATA drives were also different, but it was common
    at the time to see SATA drives with connectors for both SATA and PATA power cables
    for backward compatibility.


    SATA data cables are much thinner than PATA cables, as they only contain seven
    wires connecting to seven pins. unlike PATA devices, which connect two drives
    on one IDE/EIDE cable connected in a master/slave configuration.


    SATA continues to be standard for drive technology for both desktops and laptops
    and has had several revisions, as listed here. Speeds are listed in Mbps and not
    Mbps:


    +   - SATA 1: 150 Mbps

    - SATA 2: 300 Mbps

    - SATA 3: 600 Mbps


    The following photo shows two 2.5-inch drives. The drive to the left is a much
    older IDE drive, and the one to the right is a modern SATA drive:


    ![](img/7489105e357b7dff3e56cd1cbb0de4fa_150_0.png)


    Figure 6.8 – 2.5-inch IDE (left) and SATA'
