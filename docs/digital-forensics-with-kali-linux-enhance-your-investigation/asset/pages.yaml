    Now that we''ve covered some of the more popular commercial forensics tools, I''d
    like to briefly talk about anti-forensics, which you can research further in your
    own time.


    # Anti-forensics – threats to digital forensics


    As much as we like the tasks in digital forensics to be as easy as possible, we
    encounter situations that make investigations, and life as a forensics investigator,
    not-so-simple and sometimes stressful. People wishing to hide information and
    cover their tracks, and those who have malicious intent or participate in cyber
    crimes, often employ various methods to foil the attempts of forensic investigators
    with the hope of hampering or halting investigations.'
