  md: 'Incident Response, Data Acquisitions, and DFIR Frameworks


    Here is a list of guidelines for physical collection and preservation:


    +   - Label all cables and connectors

    - Used evidence collection bags as needed

    - Special stronghold bags might have to be used when storing devices with wireless
    and radio capabilities, preventing communication with other devices

    - Store sensitive equipment such as hard drives and flash drives in anti-static
    bags and protective casings

    - Label containers used for storage during transportation

    - Maintain the CoC forms when passing evidence from one person/handler to another
    (discussed later in this chapter)


    Now, let''s move to understanding the order of volatility when collecting evidence
    and also comparing live versus post-mortem acquisitions.


    # Live versus post-mortem acquisition


    In this section, we''ll look at the different procedures for live and post-mortem
    evidence acquisition. However, before we begin, first, we must understand the
    order of volatility.


    # Order of volatility


    When collecting, we should keep in mind the volatility of data. As mentioned earlier
    in this chapter, data can be easily lost or destroyed. As such, collecting data,
    a well-documented and common best practice is to collect evidence in the order
    of most volatile to the least volatile if possible.


    The Scientific Working Group on Digital Evidence (SWGDE) capture live systems
    document and lists the order of volatility from most to least volatile and crucial,
    as follows:


    +   - RAM

    - Running processes

    - Active network connections

    - System settings

    - Storage media


    # Powered-on versus powered-off device acquisition


    When investigating devices that are powered on and powered off, special consideration
    must be given to the volatility of data. Booting, rebooting, or shutting down
    a device can cause data to be written to the hard drive or even lost within RAM
    and the paging file.'
  merge: -1
  pgno: 168
- img_proc: true
  md: '# Powered-on devices


    When investigating a powered-on device, the following precautions should be taken:


    +   - Move the mouse or glide your fingers across the touchpad if you suspect
    the device might be in a sleep state. Do not click on the buttons as this might
    open or close processes and processes.

    - Photograph and record the screen and all visible programs, data, time, and desktop
    items.

    - Unplug the power cord on desktops and remove the battery, if possible, on portables.


    It is of utmost importance that data stored in RAM and paging files be collected
    with little modification to the data as possible. More on this will be covered
    in Chapter 8, Evidence Acquisition Tools, using imaging tools like FTK Imager
    and Belkaso RAM Capturer.


    There are a few reasons for imaging and acquiring RAM. In the previous chapter,
    data that have been encrypted by the user could be stored in an unencrypted state
    of RAM. Logged-in users, opened programs, accessed files, and running processes
    can all be extracted and analyzed if the RAM and paging files are analyzed.


    However, if the device is switched off or rebooted, the battery should be removed,
    if possible. However, some devices might not have a removable battery. In these
    cases, the power button should be held down for 30 to 40 seconds, which forces
    the device to power off.


    # Powered-off devices


    Powered-off devices should never be turned on unless done so by the forensic investigator.
    Special steps must be taken to ensure that existing data is not erased and new
    data is not written.


    Often, devices can seem as if they are off, but they can be in a sleep or hibernate
    state. As a simple test, the mouse can be moved and monitors (if any) can be switched
    on to determine whether they are in fact either of those states. Even if they
    are in an off state, you should photograph the screen and ports.


    When investigating portable and mobile devices in an already off state, it is
    suggested that the battery be removed (if possible) and placed in an evidence
    bag to ensure that there will be no accidental way to turn the device on when
    unplugged. According to


    NIST.SP.800-101r1—Guidelines on Mobile Forensics, it should be noted that removing
    the battery can alter contents in volatile memory, even when in an off state.


    Now that we understand the importance of taking note of the state of the device
    from which evidence must be acquired, let''s look at the CoC form, which adds
    another layer of evidence integrity.'
  merge: -1
  pgno: 169
- img_proc: true
  md: "# The CoC\n\nThe CoC is a form that legally ensures the integrity of evidence\
    \ as it is exchanged between individuals, and so it also provides a level of accountability\
    \ as personal identification is required when completing the forms. This form\
    \ gives an exact log and account of the transportation and exchange between parties,\
    \ from a collection at the scene to a presentation in a court.\n\nSome of the\
    \ typical fields on the CoC form are listed as:\n\n+   - Case number\n- Victim\
    \ and suspect names\n- Date and time seized:\n  - Item number\n  - Description\
    \ of item\n  - Signatures and IDs of individuals releasing and receiving the evidence\n\
    \  - Authorization for disposal\n  - Witness to the destruction of evidence\n\
    - Release (of evidence) to the lawful owner\n\nThe sample CoC form can be downloaded\
    \ directly from the National Institute of Standards and Technology (NIST):\nhttps://www.nist.gov/document/sample-chain-custody-formdocx\n\
    \nI urge you to download the preceding form as you might need it when working\
    \ on DFIR investigations. Now, let's look at the importance of write blockers\
    \ when acquiring data to preserve the integrity of the evidence.\n\n# The importance\
    \ of write blockers\n\nOnce our physical evidence has been properly documented\
    \ and collected, we can begin the forensic acquisition of digital evidence. I'll\
    \ mention this couple of times to drive the point home, but the original evidence\
    \ should only be used to create forensic copies or images, which will be discussed\
    \ in this chapter and in other chapters.\n\nExamination and analysis should only\
    \ be performed on forensics copies/images of the data and not on the original\
    \ data or evidence, as working on original evidence can, and usually will, modify\
    \ the contents of the medium. For instance, booting a seized laptop into its native\
    \ operating system will allow data to be written to the hard drive and may also\
    \ erase and modify contents contained in the RAM and paging file."
  merge: -1
  pgno: 170
- img_proc: true
  md: 'To prevent this from happening, the use of a write blocker must be employed.
    Write blockers, as the name suggests, prevent data from being written to the evidence
    media. Write blockers can be found in both hardware and software types. If a hardware
    write blocker is not available, software versions are readily available as standalone
    features in forensic operating systems including C.A.I.N.E, as mentioned in Chapter
    2, Introduction to Digital Forensics, and also as part of some commercial and
    open-source tools such as EnCase and Autopsy.


    Again, it is of high importance that a write blocker is used in investigations
    to protect and preserve the original evidence from being modified. The following
    photograph shows a cheap and efficient portable SATA and IDE adapter with write-blocking
    switches, used in drive acquisition and recovery:


    ![](img/7489105e357b7dff3e56cd1cbb0de4fa_171_0.png)


    Figure 7.6 – USB to SATA and IDE write-blocker device


    Now that we are familiar with the purpose and importance of write blockers, let''s
    learn about data imaging and evidence integrity algorithms.


    # Data imaging and maintaining evidence integrity


    Imaging refers to the exact copying of data as either a file, folder, partition,
    or entire storage media or drive. When doing a regular copy of files and folders,
    not all files may be copied based on their attributes set to the system or even
    hidden. To prevent files from being left out, we perform a special type of copy
    where every bit is copied or imaged exactly as it is on the current medium as
    if taking a picture or snapshot of the data.'
  merge: -1
  pgno: 171
- img_proc: true
  md: '# Incident Response, Data Acquisitions, and DFIR Frameworks


    Creating a copy of each bit of data exactly as is, is referred to as a physical
    or forensic image. Performing a bitstream copy ensures the integrity of the copy.
    To further prove this, hashing of the original evidence and the physical image
    is calculated and compared (which we will delve shortly). If the forensic copy
    is off by even one bit of data, the hash values created by the respective algorithms
    will be different.


    > Tip

    The original evidence should only be handled by qualified and authorized professionals
    and should only be used to forensically sound physical images. The original evidence
    should otherwise never be used as these compromises evidence integrity and the
    investigation.


    # Message Digest (MD5) hash


    Hash values are produced by specific algorithms and are used to verify the integrity
    of the evidence by proving that the data was not modified. Hash values can be
    thought of as digital fingerprints that they are unique and play a major role
    in the identification of evidence and physical images.


    One such algorithm, although older and mainly used to verify the authenticity
    of downloads from the internet, is the Message Digest (MD5) cryptographic algorithm,
    which produces a 128-bit hexadecimal output value.


    For a working example, let''s open a browser and head over to http://passwordgenerator.net/md5-hash-generator/.


    This site creates hashes of words and sentences as strings. For this example,
    I entered the Digital Forensics with Kali Linux string without the parentheses.
    The MD5 value automatically calculated was displayed as 7E9506C4D9DD85220FB3DF671F09DA35,
    as shown in the following screenshot:


    ![](img/7489105e357b7dff3e56cd1cbb0de4fa_172_0.png)


    MD5 Hash of your: [ Copy to clipboard ]7E9506C4D9DD85220FB3DF671F09DA35


    Figure 7 – MD5 hash generator results'
  merge: -1
  pgno: 172
- img_proc: true
  md: 'By removing K from Kali, from the string that now reads Digital Forensics with
    ali Linux, the MD5 now reads 7A4C7AA85B114E91F247779D6A0B3022, as shown in the
    following screenshot:


    ![](img/7489105e357b7dff3e56cd1cbb0de4fa_173_0.png)


    MDS Hash of your string : [Copy to clipboard]

    7A4C7AA85B114E91F247779D6A0B3022


    Figure 7.8 – Edited MD5 generator results


    As a quick comparison, we can see that removing K from Kali yields a noticeably
    different result:


    +   - Digital Forensics with Kali Linux:

    - 7E9506C4D9DD85220FB3DF671F09DA35

    - Digital Forensics with ali Linux:

    - 7A4C7AA85B114E91F247779D6A0B3022


    I encourage you to try it yourself and perhaps add a comma or period to the string
    to further compare hash values.


    # Secure Hashing Algorithm (SHA)


    Another cryptographic hash algorithm commonly used in forensics and used in the
    next chapter is Secure Hashing Algorithm-1 (SHA1). SHA1 is more secure as it produces
    a 160-bit output instead of a 128-bit output as MD5. Due to collision attacks
    against both MD5 and SHA-1, the safer and more robust option for hashing is now
    SHA-2.


    SHA-2 is a group of hashes and not just one, as with SHA-1, with the most common
    bit-length being SHA-256, which produces a 256-bit output. Alternate bit-length
    algorithms of SHA-2 are SHA-224, SHA-384, and SHA-512.'
  merge: -1
  pgno: 173
- img_proc: true
  md: '# Incident Response, Data Acquisitions, and DFIR Frameworks


    The stronger cryptographic algorithm used, the less chance of being attacked or
    compromised. This means that the integrity of the evidence and physical images
    created remain intact, which will prove useful in forensic cases and expert testimony.


    More on creating hashes will be demonstrated in Chapter 8, Evidence Acquisition
    Tools.


    Now, let''s move on best practices and frameworks for data acquisition and DFIR.


    # Data acquisition best practices and DFIR frameworks


    So far we''ve covered a general overview of the DFIR procedures when collecting
    and preserving evidence. There are several official documents that I highly recommend
    you read and become familiar with, as they give good details and guidelines on
    the documentation of the scene, evidence collection, and data acquisition.


    The SWGDE has several best practice guidelines for forensic acquisition, evidence
    collection, forensic examination, and more. These useful documents should be downloaded
    and kept as part of your DFIR playbook as are concise and summarize all the necessary
    steps, which can act as a checklist for DFIR investigations. All documents can
    be found in the SWGDE''s Forensic Publications section at https://www.swde.org/documents/published-by-committee/forensics,
    but for the purposes of this chapter, I recommend, at least, downloading and reading
    the two best practices guidelines on evidence collection and forensic acquisitions.


    The first part best practices when collecting digital evidence and the second
    best practices when performing data acquisitions from computers:


    +   - 2018-07-11 SWGDE Best Practices for Digital Evidence Collection: https://drive.google.com/file/d/1ScBeRvYikHvqu6teE_Lj3Jtb0194a5FDR?usp=sharing

    - 2018-04-25 SWGDE Best Practices for Computer Forensic Acquisitions: https://drive.google.com/file/d/1ScBeRvYikHvqu6te_Lj3Jtb0194a5FDR/?usp=sharing


    The SWGDE Capture of Live Systems document, version 2.0, was released in September
    2014. Although short and not detailed, it is still applicable to forensic investigations
    involving live (powered-on) systems. This document provides guidelines when investigating
    live systems, including the order of volatility, memory forensics including paging
    files, and live physical and filesystem acquisition.


    This document is only six pages long and can be downloaded from here: https://drive.google.com/file/d/10MJ9JEJAkjj6iXqpf3IcFb4dDPNUZ2ymH/view'
  merge: -1
  pgno: 174
- img_proc: true
  md: '# DFIR frameworks


    The practice guidelines mentioned earlier can be used in conjunction with one
    or more frameworks.

    Whatever the task, the goals should remain the same with the integrity of evidence
    always preserved

    thout the entire DFIR processes of evidence collection, analysis, and reporting.


    Although not free, there is an ISO/IEC called the ISO/IEC 27037:2021 Information

    technology — Security techniques — Guidelines for identification, collection,
    acquisition, and preservation

    of digital evidence, which serves as an excellent source of information for best
    practices on DFIR.

    A review of the document can be found at https://www.iso.org/obp/ui/#/iso:std:iso-27037:ed-1:v1en.


    The National Institute of Science and Technology (NIST) also has an order publication
    called the

    IST Special Publication (SP) 800-86 Guide to Integrating Forensic Techniques in
    Incident Response,\which contains 121 pages of very useful information about various
    types of technologies and data

    identification, acquisition, and examination. The full document can be freely
    downloaded at https://

    nlvpubs.nist.gov/nistpubs/legacy/sp/nistpublication800-86.pdf.


    Another useful publication is the NIST Special Publication (SP) 800-61 Revision
    2 Computer Security

    Incident Handling Guide, which specifically focuses on incidents and the appropriate
    responses to

    them. This document can be viewed and downloaded in its entirety at https://nvlbpubs.nist

    gov.nist.gov/specialpublications/nist.sp.800-61r2.pdf.


    Additionally, the NIST Guidelines on Mobile Device Forensics is another useful
    document that

    aplies specifically to mobile devices. Revision one of this document, released
    in 2014, goes into detail

    about the aspects of mobile forensics investigations. It contains the following:


    +   * Mobile and character characteristics

    * Evaluation and documentation of the scene

    * Device isolation and packaging

    * Device and memory acquisition

    * Examination, analysis, and reporting


    The full document can be downloaded from:


    https://nvlbpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-

    101r1.pdf


    In relation to investigating cyber-attacks, reference should be made to the D4I
    — Digital forensics

    framework for reviewing and investigating cyber-attacks as a proposed framework.
    It also references

    the Cyber Kill Chain and its associated phases with cyber-attacks. You can find
    the 8-page document at:


    https://tsapps.nist.gov/publication/get_pdf.cfm?pub_id=929147'
  merge: -1
