  md: '# Summary


    In this chapter, we learned about file recovery and data carving using popular
    open source tools in Kali Linux. We first performed file carving using the very
    impressive Foremost, which carved the entire downloaded forensic image for supported
    file types within the file header and footers. We then did the same using MagicRecourse
    and Scalpel, and we had to make slight modifications by selecting the file types
    we wanted to carve. Both Foremost and Scalpel presented us with an audit.txt file,
    summarizing the carving list and its details along with subfolders containing
    the actual evidence.


    bulk_extractor is a wonderful tool that carves data and also finds useful information,
    such as email addresses, visited URLs, Facebook URLs, credit card numbers, and
    a variety of other information. bulk_extractor is also great for investigations
    requiring file recovery and carving, together with either Foremost or Scalpel,
    or both even.


    Lastly, we looked at file recovery using scrou_NTFS and recoverjpeg to recover
    data and images from drives rather than forensic images.


    Now that we''ve covered file carving and recovery, let''s move on to something
    more analytical. In the next chapter, we''ll take a look at exploring RAM and
    the paging file as part of memory forensics, using the very powerful volatility.
    See you there!'
  merge: -1
  pgno: 242
- img_proc: true
  md: '# 10 Memory Forensics and Analysis with Volatility 3


    In the previous chapters, we looked at the various methods for data carving and
    file recovery. In this chapter, we will look at the analysis of content stored
    in Random Access Memory (RAM) using the very powerful Volatility 3. RAM is volatile,
    meaning that the data in RAM is easily lost when there is no longer an electrical
    charge or current going to the RAM. With the data on RAM being the most volatile,
    it ranks in the order of volatility and must be forensically acquired and preserved
    as a matter of high priority.


    Many types of data and forensic artifacts reside in RAM and the paging file. As
    discussed in previous chapters, login passwords, user information, running and
    hidden processes, malware, and even encrypted passwords are just some of the types
    of interesting data that can be found when performing RAM analysis, further compounding
    the need for memory forensics.


    In this chapter, we will look at the very powerful Volatility framework and its
    many uses in memory forensics, including the following topics:


    +   - What''s new in Volatility 3

    - Downloading a sample memory dump file for analysis

    - Installing Volatility 3 in Kali Linux

    - Memory dump analysis using Volatility 3


    # What''s new in Volatility 3


    The Volatility framework is an open source, cross-platform incident response framework
    that comes with many useful plugins that provide the investigator with a wealth
    of information from a snapshot of memory, also known as a memory dump. The concept
    of Volatility has been around for a decade, and apart from analyzing running and
    hidden processes, it is also a very popular choice for malware analysis.'
  merge: -1
  pgno: 243
- img_proc: true
  md: '# Memory Forensics and Analysis with Volatility


    To create a memory dump, several tools, such as Belkasoft RAM Capturer, FTK Imager,
    dd, dc3dd, CAINE, Helix, and LIME (short for Linux Memory Extractor), can be used
    to acquire the memory image or memory dump (which we previously did in Chapter
    8, Evidence Acquisition Tools) and then analyze using various tools as plugins
    within the Volatility framework.


    The Volatility framework can be run on any Operating System (OS), that is, 32-
    and 64-bit, that supports Python, including the following:


    +   * Windows XP, 7, 8, 8.1, and Windows 10

    * Windows Server 2003, 2008, 2012/R2, and 2016

    * Linux 2.61-4.2.3 (including Kali, Debian, Ubuntu, and CentOS) and macOS Leopard
    (10.5.x) and Snow Leopard (10.12.x)


    Volatility supports several memory dump formats (both 32 - and 64-bit), including
    the following:


    +   * Windows crash and hibernation dumps (Windows 7 and earlier)

    * VirtualBox

    * VMware - .vmem dump

    * VMWare saved state and suspended dumps - .vmsn/.vmsn

    * Raw physical memory - .dd

    * Direct physical memory dump over IEEE 1394 FireWire

    * Expert Witness Format (EWF) - .E01

    * QEMU (Quick Emulator)


    Volatility even allows for conversion between these formats and boasts of being
    able to accomplish similar tools.


    In previous editions of this book, we used Volatility 2, which was based on the
    now-deprecated Python 2. Volatility 3 is based on Python 3 and has the following
    changes:


    +   * Faster scans and processing of memory dumps

    * Support for newer OSs

    * More efficient plugins

    * Operating-specific plugins


    Before we begin using Volatility 3, let''s first download all the sample memory
    dump files that we will be analyzing using Volatility.'
  merge: -1
  pgno: 244
- img_proc: true
  md: '# Downloading sample memory dump files


    For this chapter, we''ll be using a memory dump called crudex.vmem, which we will
    be analyzing using a variety of Volatility plugins. The file can be downloaded
    from http://files.sempersecursus.org/dumps/crudex_memdump.zip.


    There are many other images that are publicly available for analysis at https://github.com/volatilityfoundation/volatility/wiki/Memory-Samples.
    To practice working with the Volatility framework and enhance your analytical
    skills, you may wish to download as many images as you like and use the various
    plugins in Volatility.


    Let''s first download and extract our sample memory dump, which we will later
    move to our Volatility installation folder for analysis. If you haven''t already
    downloaded the file, please do so now.


    I''ve downloaded the crudex.vmem sample file to my Downloads folder. To extract
    the file, right-click on the file and click on **Extract Here** as you have done
    with previously downloaded files.


    We will now install Volatility 3 and then copy the crudex.vmem memory dump to
    our installation folder for analysis.


    Now that we have downloaded all sample files, let''s install Volatility 3 on our
    Kali machines.


    # Installing Volatility 3 in Kali Linux


    Volatility is no longer installed in Kali Linux by default and must be manually
    installed:


    +   1. Let''s first download Volatility 3 from the official site at https://www.volatilityfoundation.org/releases-vol3


    +   2. Be sure to click the .zip file link within the Volatility 3 tab, as seen
    in the following screenshot:


    | Volatility 2 | Volatility 3 |


    # Volatility 3 v1.0.0 (Python 3 Rewrite)


    In 2020, the Volatility Foundation released a complete rewrite of the framework,
    Volatility 3. The project was intended to address many of the technical and performance
    challenges associated with the original code base since its original release in
    2017. Another benefit of the rewrite is that Volatility 3 could be released under
    a custom license that was more aligned with the goals of the Volatility community.
    The Volatility Software License and about the rewrite of Volatility 3 can be found
    in this presentation: Volatility 3 Public Beta, Insider''s Preview


    Released: February 2020


    +   * Download the Volatility 3 v1.0.0 Source Code (zip)

    * Download the Volatility 3 v1.0.0 Source Code (tar.gz)

    * View Volatility 3 documentation on Read the Docs.

