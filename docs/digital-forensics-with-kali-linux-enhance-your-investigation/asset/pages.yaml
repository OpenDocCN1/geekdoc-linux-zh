  md: '# 5

    Installing Wine in Kali Linux


    In this chapter, we will learn how to extend the functionality of our Kali Linux
    environment by adding the capability to install Windows tools within Kali Linux
    using Wine.


    We will begin by looking at the following topics in this chapter:


    +   * What is Wine and the advantages of using it in Kali Linux

    * Installing Wine

    * Testing our Wine installation


    Let''s begin by looking at Wine and its advantages.


    # What Wine is and the advantages of using it in Kali Linux


    Wine is commonly, but mistakenly, referred to as a Windows Emulator, but as stated
    on the official website, it was initially known as Wine Is Not an Emulator, hence
    the acronym. Wine allows non-Windows users to run certain Windows applications
    on Portable Operating System Interface (POSIX)-compliant systems, including macOS
    and versions of Linux and BSD, including Kali Linux.


    For our Digital Forensics and Incident Response (DFIR) purposes, this is incredibly
    useful, as we can now use industry-standard tools, specifically made for Windows
    on our Kali Linux systems, using them as standalone operating systems or virtual
    machines. This also addresses the issue of having to purchase a license for Windows,
    as we do not have to use a device running Windows. These costs are avoided when
    extending that we can now use less hardware if running all DFIR tools within your
    Kali Linux.


    By installing Wine in our Kali Linux instances, we can have an advantage not only
    from a DFIR perspective but also from a purple teaming team, we can also install
    red teaming tools for Windows in our Kali machines. Drawing from personal experience,
    I''ve always used two laptops for DFIR exercises and investigations, with one
    running Linux-based operating systems such as Kali Linux, CSI, and Ubuntu, and
    another running Windows 10. Some very important Windows applications that I use
    for almost every DFIR exercise and investigation are Belkaso RAM capturer,'
  merge: -1
  pgno: 119
- img_proc: true
  md: "# Installing Wine in Kali Linux\n\nFTK Imager, and Autopsy 4 GUI (Graphical\
    \ User Interface). These tools are highly used throughout the community, as they\
    \ are very powerful and simple to use. With Wine installed on my Kali Linux and\
    \ other Linux-based systems, I can now perform all tasks using one machine, which\
    \ saves on time, effort, and cost.\n\nIn the sections ahead within this chapter,\
    \ we will be installing Wine manually using the Terminal and then installing Google\
    \ Chrome browser as a test to ensure that our Wine installation is a successful\
    \ one. In later chapters, we will also install Bastelfisk RAM Capturer, FTK Imager,\
    \ and Autopsy 4 using Wine for DFIR purposes within Kali Linux. More information\
    \ about Wine can be found on the official site at https://www.winehq.org/\n\n\
    # Installing Wine\n\nInstalling Wine requires that we run a few commands in precise\
    \ order. Although I am sure that many of the commands used will be new to many\
    \ of you, I've outlined the exact steps in the following sequence:\n\n+   1. Be\
    \ sure that you are connected to the internet before proceeding.\n\nLet's first\
    \ download Wine by opening a new Terminal and typing the following command, followed\
    \ by pressing the Enter key: \n\n```\nsudo dpkg --add-architecture i386\n```\n\
    \nIn the following screenshot, we added the 32-bit architecture:\n\n![](img/7489105e357b7dff3e56cd1cbb0de4fa_120_0.png)\n\
    \nFigure 5.1: Running the sudo dpkg --add-architecture i386 command"
