  md: '# 2

    Introduction to

    Digital Forensics


    This chapter introduces the various aspects of the science of digital forensics.
    It introduces you, particularly those of you who may be new to Digital Forensics
    and Incident Response (DFIR), to the basics, which we will build upon as we progress
    further into the book.


    The topics we are going to cover in this chapter are:


    +   - What is digital forensics?

    - The need for blue and purple teams

    - Digital forensics methodologies and frameworks

    - Comparison of digital forensics operating systems (OSs)

    - The need for multiple forensics tools in digital investigations

    - Comparison of commercial versus open source forensics tools


    # What is digital forensics?


    The first thing I''d like to cover in this chapter is an understanding of digital
    forensics and its proper practices and procedures. At some point, you may have
    come across several books, blogs, and even videos demonstrating various aspects
    of digital forensics and the different tools used. It is great importance to understand
    that forensics itself is a science involving very well-documented best practices
    and methods to reveal whether something exists or does not.


    Digital forensics involves the preservation, acquisition, documentation, analysis,
    and interpretation of evidence from various storage media found. It is not limited
    to laptops, desktops, and mobile devices but also extends to data in transit,
    which is transmitted across public or private networks.'
  merge: -1
  pgno: 35
- img_proc: true
  md: '# Introduction to Digital Forensics


    In most cases, digital forensics involves the discovery and/or recovery of data
    using various methods and tools available to the investigator. Digital forensics
    investigations include, but are not limited to, the following:


    +   - Data recovery: Investigating and recovering data that may have been deleted,
    changed to different file extensions, and even hidden.


    +   - Identity theft: Many fraudulent activities, ranging from stolen credit card
    usage to fake social media profiles, usually involve some sort of identity theft.


    +   - Malware and ransware investigations: To date, ransomware by Trojans and
    worms across networks and the internet are some of the greatest threats to companies,
    military organizations, and individuals. Malware can also be spread to by mobile
    devices and smart devices.


    +   - Network and internet investigations: Investigating Denial-of-Service (DoS)
    and Distributed Do (DDoS) attacks and tracking down accessed devices, including
    printers and files.


    +   - Email investigations: Investigating the source and IP (internet protocol)
    origins, attached content, and geolocation information can all be investigated.


    +   - Enterprise espionage: Many companies are moving away from print copies and
    toward traditional disk media. As such, a digital footprint is always left behind;
    sensitive information may be accessed or transmitted?


    +   - Child pornography investigations: Sadly, the reality is that children are
    widely exploited on the internet and within the deep web. With the use of technology
    and highly-skilled forensic analysts, investigations can be carried out by down
    exploitation rings by analyzing internet traffic, browser history, payment transactions,
    email records, and images.


    Next, we''ll need to look for blue and purple teams and the skillsets required
    for each.


    # The need for blue and purple teams


    As discussed in Chapter 1, Red, Blue, and Purple Fundamentals, blue teams are
    more concerned with DFIR, and purple teams are those individuals who can operate
    and understand both the offensive and defensive sides of cybersecurity.


    In recent times, and especially during the Covid-19 pandemic lockdowns, you may
    have read or noticed that there was a substantial increase in cyberattacks. A
    major contributing factor to these attacks will have been the lack of awareness
    training by employees at all levels who may have fallen victim to phishing attacks.
    There were numerous phishing campaigns during the lockdown, which tricked and
    social-engineered users into opening malicious emails or divulging personal or
    corporate information. This was done by threat actors using email subjects relating
    to Covid-19 outbreaks, health updates, and even through requests for help from
    the compromised (hacked) email accounts of friends and family who may have appeared
    to be stranded in countries under lockdown and were asking for financial assistance
    to get back home.'
  merge: -1
  pgno: 36
- img_proc: true
  md: 'In the last year or two, there has also been an alarming increase in ransomware
    attacks from notorious ransomware and Advanced Persistence Threat (APT) groups,
    with ransomware being readily available for purchase on the dark web. ALPHV, Darkside,
    Revil, and BlackCat are some of the most notorious ransomware and APT groups whose
    names strike fear into the hearts of any cybersecurity professional. These groups
    are known to compromise individuals and then request a ransom be paid, ranging
    from thousands to millions of dollars. Not only is data highly encrypted, but
    many of these groups now attack the victims with DDoS attacks and also release
    exfiltrated data belonging to the victim on dark web blogs. We''ll deliver a bit
    more about this later in the book.


    Responding to an incident is one thing, as (hopefully) may have a plan or formal
    procedures to do, but if we don''t have the right mechanisms in place to even
    detect the incident, then it may be far off than initially thought. This is where
    the need for blue and purple teams arises. Hackers, malware developers, APTs,
    and the do not take off and certainly do not care about the financial state of
    companies and economies. Ransomware, in the past, is proven to be very profitable
    in some cases, and it must be considered that at any given day, malware developers
    are working on new methods of compromise.


    It is imperative that each organization have a blue team, if not a purple team,
    or at least outsource the talents and functions of a team if having one in-house.
    There are many Managed Security Services (MSS) companies that out perform that
    a company with one or two well-trained blue and/purple teams will always have
    the advantage of not knowing the technical details of the company but also having
    an understanding of the organizational culture and the level of (and sometimes
    lacks of) awareness of the staff and general human resources, which more often
    than not, may prove to be the weakest link within the organization as far as cybersecurity
    is concerned.


    Having blue teams conduct cybersecurity awareness training is just as important
    as patching infrastructure devices, such as firewalls, routers, switches, and
    servers. Cybersecurity awareness is something that must be considered as much
    as physical safety awareness, as one small mistake could potentially bring an
    entire conglomerate to its knees and cost the organization millions of dollars.
    It helps a great deal if employees are aware of the general cybersecurity threats
    to the organization and themselves, and more so if they are aware of specific
    threats instances that may have occurred in the organization. This way, the blue
    teams can create a cybersecurity awareness culture, where persons are more alert
    and understand the risks and impact of individual actions as far as the security
