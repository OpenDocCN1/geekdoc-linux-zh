  md: '# Incident response and first responders


    Let''s move on incident response and the technical roles assumed by first responders.


    # Incident response and first responders


    Preserving evidence does not begin only at the acquisition of data, but as early
    on as the physical viewing of the suspect device. There should be structured response
    to the suspected crime or breach in the same manner as a crime reported to the
    police. In the same way, a person makes a call to the emergency services who dispatch
    the police, fire services, ambulance personnel, and other first responders who
    might escalate the issue to the FBI or other agencies. There should also be a
    similar chain of command when dealing with reports that require digital investigation.


    When a breach is discovered or suspected, there should be a dedicated first responder
    who is alerted and called to the scene. Usually, this person has some knowledge
    or understanding of the workings of devices, networks, and even of the IT infrastructure
    in the organization if applicable.


    First responder personnel can include the following:


    +   * HelpDesk and IT technicians

    * Systems administrators

    * Network administrators

    * Security administrators

    * IT managers and directors


    While the individuals in the preceding roles might not be trained or skilled in
    digital forensics or digital investigations, they will be responsible for securing
    the scene and ensuring that the data, peripherals, equipment, and storage are
    not used, tampered with, removed, or compromised by unauthorized individuals.


    The duties of first responders include the following:


    +   * Being the first to respond to the scene (as the name suggests) and making
    an initial assessment

    * Documenting the scene and room fully in a circular fashion using the center
    of the room as a focal point

    * Securing the scene by not allowing unauthorized users or suspects, access to
    the devices or area, and especially to volatile data and storage media

    * Preserving and packaging evidence for transportation, ensuring the use of the
    CoC forms that allow for tracing the exchange of evidence between persons


    Now, let''s look at examples of evidence, its collection, and documentation.'
