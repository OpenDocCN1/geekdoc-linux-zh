  md: 'Now we''ve covered some of the most popular file carving tools, let''s have
    a look at a file recovery tool called scrounge-ntfs.


    # NTFS recovery scrounge-ntfs


    scrounge-ntfs is a tiny tool that comes with the default version as well as the
    Everything metapackages of Kali Linux. A tiny but powerful tool, scrounge-ntfs
    is a command-line tool for recovering drives as NTFS (short for New Technology
    File System), generally used by Windows devices. Most storage media, including
    flash drives and storage media, can also be formatted as NTFS with default formatting
    tools within Windows systems.


    It''s quite common for hard drives to have a corrupt MFT (short for Master File
    Table). This table stores information about all files, including size, permissions,
    content, and time stamps within NTFS drives. If this table becomes corrupt or
    is, the contents of the drive may be inaccessible, or the drive may not boot a
    bootable operating system.


    Regardless of the reason for an NTFS drive becoming corrupted, scrounge-ntfs was
    built for the specific purpose of recovering files within an NTFS partition. For
    this lab, I''ll be using an external drive formatted as NTFS, which has listed
    as its contents:


    +   1. Let''s see what our drive is listed as in Kali by running the following:


    ```

    sudo fdisk -l

    ```


    The following shows the output of the previously typed command:


    ![](img/7489105e357b7dff3e56cd1cbb0de4fa_234_0.png)


    Figure 9-2 - fdisk output


    As seen here, my attached drive is listed as sdb too.


    +   2. Before we begin the recovery process, I''d like to create a folder Scrounge_recovery
    on the desktop where all scrounge-ntfs-recovered files will be saved.


    To do so, I''ll switch to the Desktop directory by typing the following:


    ```

    cd Desktop

    ```'
  merge: -1
  pgno: 234
- img_proc: true
  md: 'Then, I''ll create the new directory by typing the following:


    ```

    mkdir Scrounge_recovery

    ```


    I''ll now change my output directory to avoid having to specify the directory
