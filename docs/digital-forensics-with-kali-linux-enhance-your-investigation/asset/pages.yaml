  md: '# Understanding purple teaming


    We can now have our cybersecurity moment of Zen as we get into purple teaming.
    The **purple teaming** refers to the combination of skill sets in red and blue
    teaming. The color purple can also be achieved by mixing the red and blue, hence
    the name purple teaming. Looking back at all the skill sets and certifications
    in the red and blue teaming sections, it may seem like an impossible accomplishment;
    I guarantee you there are many purple teamers who started as novices and ended
    up as professionals, myself included


    When I started my journey in cybersecurity in the early 2000s, I was far more
    interested in ethical hacking and pentesting (red teaming) at that point in time
    and spent many a night in front of my desktop reading, and using the very limited
    tools available at time. It was not until perhaps 2008 that I decided to get into
    DFIR and became became very interested in the field of forensics, to to the point
    where I started to teach the CHFI course alongside the CEH course.


    Every time I thought to myself that I specialize in I''d come across a new tool
    that would point me in the direction of the other. Frankly, this all worked out
    in my favor as I soon realized that red and blue teaming overlap in many aspects
    and also that there was never a point where I could say what I had already learned
    was enough. My point here is that cybersecurity is such a dynamic field with so
    many paths that you can never know enough. There is always some new exploit, an
    investigative tool, or an incident response procedure to learn, and its up to
    you to decide what you would like to specialize in one field or continue to learn
    and grow as I did and apply your knowledge when necessary.


    Fast forward to today, and I''m the owner of the Computer Forensics and Security
    Institute, where I not only lead a purple team but I also the lead penetration
