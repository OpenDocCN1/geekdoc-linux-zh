  md: '# Important note


    Many open source OS distros are based on Linux, including Kali Linux and Android,
    and so they use the ext2/ext3/ext4 filesystems. They are also able to use the
    FAT32 filesystem. FAT32 can be used across any platform, including older versions
    of Windows, Macintosh, and Linux, and is supported by any device with a USB port.


    For the purpose of Digital Forensics and Incident Response (DFIR) it is important
    to know about the file systems and the differences we can read. Once a file system
    is chosen (either by the drive manager or user), data can then be stored on the
    media. Let''s now look at data types and states in the next section.


    # Data types and states


    Firstly, there''s data in transit, also called data in motion. These simply describe
    the data on the move, perhaps traversing the network between devices or even between
    storage media, actively moving locations.


    There''s data in use. In this state is currently being accessed by a user or processed
    by a CPU. When data is accessed or used, it''s pulled from the hard drive and
    temporarily stored in RAM, which is much faster than the hard drive (particularly
    mechanical drives), and stored there for as long as the user accesses it and there
    is power to the device.


    When data is not in motion, transit, or in use, it is described as data at rest.
    In this state, the data rests or resides on non-volatile media, such as hard drives,
    optical media, flash drives, and memory cards.


    Now that we know the formal terms for describing data states, we will learn about
    metadata and slack space next.


    # Metadata


    Metadata is simply about data. Take an item such as a laptop stored in a warehouse,
    for example. Somewhere in the warehouse (and possibly in other locations such
    as the cloud), there may be several pieces of information that can be referred
    to as data about the laptop, or even laptop metadata, such as the following:


    +   - Location of the laptop within the warehouse

    - Laptop brand and model

    - Manufacture date

    - Warranty dates and information

    - Hardware and software specs

    - Color and size'
  merge: -1
  pgno: 155
- img_proc: true
  md: '# Understanding File Systems and Storage


    # Slack space


    Clusters are the smallest amount of disk space or allocation units on storage
    media that store data. When formatting drives, we need to define the size of these
    allocation units, or we can use the default cluster size of 4 KB. This is where
    slack comes in.


    Slack space is the empty and unused space within clusters that contain data but
    are not filled with data. To fully understand this, we need to understand the
    default cluster sizes by OSs. A drive formatted using NTFS (for Windows) has a
    default cluster size of 4 KB. Let''s say you''ve saved a file to your disk with
    a cluster size of 3 KB. This means that you still have 1 KB of unused or slack
    space within cluster.


    Slack space is of particular interest to a forensic investigator as data can be
    easily hidden in slack space. Likewise, we have several tools available, such
    as the Sleuth Kit and Autopsy, in Kali Linux to help investigate slack space and
    find hidden files.


    Be sure to familiarize yourself with the terms metadata and slack space, as they
    will constantly be referred throughout your investigations. Feel free to make
    notes on these and other terms as we progress throughout the chapter for easy
    reference. Let''s move on to get an understanding of the volatile and non-volatile
    nature of different types of memory and also look at the order of volatility in
    DFIR investigations.


    # Volatile and non-volatile data and the order of volatility


    In this section, we look at how data is lost when power to the volatile memory
    is lost.


    Data can exist if the media it is stored on can store the data. Hard drives (mechanical
    and solid-state), flash drives, and memory cards are all non-volatile storage
    media. Although SSDs offer and continue to make drastic improvements in data access
    times, RAM (typically referred to as memory) then remains the fastest type of
    memory devices.


    RAM, however, is volatile memory. Unlike volatile memory found in hard drives
    and flash drives, data stored in RAM is kept temporarily, only for as long as
    there is an electrical current provided to the chips. There are two types of RAM
    that we need to be aware of: Static RAM (SRAM) and Dynamic RAM (DRAM).


    SRAM is superior to DRAM but is far cheaper than DRAM because of the materials
    used in building the chips. SRAM is physically much larger than DRAM. SRAM can
    be found in the CPU cache (L1 or Level 1) and on some chips on the motherboard
    (L2/L3), although in very small sizes (KB) due to cost and physical size.


    Although DRAM is slower, it is much cheaper and remains one of the reasons for
    it to be the main memory in devices. What makes RAM volatile is its components,
    such as transistors and capacitors. Some of you may already be familiar with this
    topic from certification courses such as A+, but for the benefit of all of you,
    allow me to go into a bit more detail.'
  merge: -1
  pgno: 156
- img_proc: true
  md: 'DRAM uses capacitors, which store electrical charges temporarily as part of
    a refresh circuit. The chips need to be constantly refreshed to hold the data
    while being accessed. However, between refreshes, a wait state is created, which
    makes DRAM slower compared to SRAM as it uses transistors instead of capacitors,
    which do not wait states.


    Over the decades, there have been many types of DRAM or memory sticks in slightly
    varying sizes and increased pins with which to contact the motherboard. Some of
    the RAM types in order of age are follows:


    +   - Extended Data Output RAM (EDO RAM): One of the earlier types of DRAM.

    - Synchronous Dynamic RAM (SDRAM): This was the first form of RAM to synchronize
    itself with the CPU clock. It has a maximum transfer rate of 133 megatransfers
    or millions of transfers per second (MT/s). It is labeled PC100, PC133, and PC166.

    - DDR-SDRAM/DDR 1 (Double Data Rate - SDRAM): Effectively doubled the transfer
    rate of SD RAM. Maximum transfer rate of 400 MT/s.

    - DDR2: Maximum transfer rate of 800 MT/s.

    - DDR3: Consumes up to three less power than DDR2. Maximum transfer rate of 1600
    MT/s.

    - DDR4: Maximum transfer rate of 4400 MT/s (DDR4-4400).


    In today''s laptops and desktops, one might mainly across DDR3 and DDR4, but it
    may not be uncommon to run into a legacy machine with DDR2 or (miraculously) DDR1.
    The following photo shows different RAM Dual Inline Memory Modules (DIMM) types
    from top to bottom, SDRAM (top), DDR1, DDR2, and lastly DDR3:


    ![](img/7489105e357b7dff3e56cd1cbb0de4fa_157_0.png)


    Figure 6.11 - Types of RAM'
  merge: -1
