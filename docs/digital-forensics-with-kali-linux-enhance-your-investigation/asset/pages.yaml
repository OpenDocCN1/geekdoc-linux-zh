  md: '# Memory dump analysis using Volatility 3


    The PID identifies the process and the PPID the parent of the process. Looking
    at the pslist output, we can see that winlogon.exe process has a PID of 608 and
    a PID of 368. The PPIDs of the services.exe and lsass.exe processes (directly
    after the winlogon.exe process) are both 608, indicating that winlogon.exe is
    in fact the PPID for both services.exe and lsass.exe.


    For those who need PIDs and processes, a quick Google search can assist with identification
    and description information. It is also useful to become familiar with many of
    the startup processes to be able to point out processes that may be unusual or
    suspect.


    The timing and order of the processes should also be noted as they may assist
    in investigations. If we scroll down a bit, we can also tell that explorer.exe
    with a PID of 1484 is the PPID of reader_sl.exe.


    Let''s dig bit into the pstree plugin.


    # The pstree plugin


    Another identification can be used to list processes by the pstree plugin. This
    plugin shows the same list of processes as the pslist plugin but indentation is
    also used to identify child and parent processes.


    Run the pstree plugin by typing the following:


    ```

    python3 vol.py -f crixdem.mem windows.pstree

    ```


