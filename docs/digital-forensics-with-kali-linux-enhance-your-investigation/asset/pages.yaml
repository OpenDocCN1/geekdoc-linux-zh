    ![](img/7489105e357b7dff3e56cd1cbb0de4fa_257_0.png)


    Figure 10.18 - modscan plugin output


    Let''s keep looking.


    # The getsid plugin


    All users can be uniquely identified by a Security Identifier (SID). The getsid
    command has four very items in the order in which the processes were started (refer
    to the pslist and pstree command screenshots in Figures 10.15 and 10.16).


    The format for the getsid command is as follows:


    ```

    [Process] (PID) [SID] (User)

    ```


    The first result in the list, users, shows the following:


    System (4) : S - 1 - 5 - 18 (User)


    Where:


    +   * System is the process

    * (4) is the PID

    * S - 1 - 5 - 18 is the SID

    * User is the local system'
