- img_proc: true
  md: '# Autopsy Forensic Browser


    Autopsy and The Sleuth Kit go hand in hand. Both were created by Brian Carrier.
    The Sleuth Kit is a powerful suite of Command-Line Interface (CLI) forensic tools,
    whereas Autopsy is the Graphical User Interface (GUI; pronounced gooey) that sits
    on top of The Sleuth Kit and is accessed through a web browser. Autopsy supports
    image file types, including Raw Data Dump (DD), EnCase (.01), and Advanced Forensic
    Format (AFF).


    The Sleuth Kit uses CLI tools to perform the following tasks:


    +   - Find and list allocated and unallocated (deleted) files, and even files
    hidden by rootkits

    - Reveal NTFS Alternate Data Streams (ADS) where files can be concealed within
    other files

    - List files by type

    - Display metadata information

    - Create a timeline


    Autopsy can be run from a live Compact Disk (CD)/Universal Serial Bus (USB) in
    forensic mode as part of a live analysis in live mode, or it can be used on a
    dedicated Kali Linux machine to investigate analysis in dead mode.


    The topics we will cover in this chapter include the following:


    +   - Introduction to The Sleuth Kit and the Autopsy forensic browser

    - Downloading sample files for use and creating a case in the Autopsy browser

    - Evidence analysis using the Autopsy forensic browser'
  merge: -1
  pgno: 293
- img_proc: true
  md: '# Introduction to Autopsy – The Sleuth Kit


    In this chapter, we will focus on the Autopsy browser, which is based on data
    recovery and disk analysis tools found within The Sleuth Kit. Tools in The Sleuth
    Kit are all command line-based and the Autopsy browser allows us to access the
    tools and their functionality via a GUI for easy disk and file carving, recovery,
    analysis, and reporting.


    Autopsy offers GUI access to a variety of investigative command-line tools from
    The Sleuth Kit, including image analysis and file hashing, deleted file recovery,
    and case management, among other capabilities. Autopsy can be a bit tricky to
    install, but unfortunately for us, it comes built into Kali Linux, and is also
    very easy to set up and use.


    Although the Autopsy browser is based on Sleuth Kit, the features of Autopsy differ
    when using the Windows version compared to the Linux version. We will cover the
    Windows version of Autopsy using Wine in Chapter 13, Performing a Full DFIR Analysis
    with the Autopsy 4 GUI. Some of the official features offered by The Sleuth Kit
    and Autopsy 2.4 in Kali Linux include the following:


    +   **Image analysis**: Analyzing directories and files, including sorting files,
    recovering deleted files, and previewing files

    * **File activity timelines**: Creating timelines based on timestamps of when
    files were written, accessed, and created

    * **Image integrity**: Creating MD5 hashes of the image file used, as well as
    individual files

    * **Hash databases**: Matching digital hashes or fingerprints of unknown files
    (such as suspected malicious .exe files) against those in the NIST National Software
    Reference Library (NSRL)

    * **Events search**: Displaying events sorted by date and time

    * **File analysis**: Analyzing the entire image file to display directory file
    information and contents

    * **Keyword search**: Allowing searching using keyword lists and predefined expression
    lists

    * **Metadat analysis**: Allowing view metadata details and the structure of files
    that are essential for data recovery


    Now that we are familiar with some of the uses of Autopsy, let''s first download
    our sample files for analysis before we begin using the tool.'
  merge: -1
  pgno: 294
- img_proc: true
  md: '# Downloading sample files for use and creating a case in the Autopsy browser


    In this section, we will find the links to the required sample files that we will
    be analyzing using the Autopsy browser.


    Download the image file

    The image file used for analysis is publicly available for download at http://downloads.digitalcorpora.org/corpora/scenarios/2009-m57-patents/usb/

