- "# 树莓派：初学者树莓派项目编程、开发与设置入门指南\n\n\n\n![](img/Image00000.jpg)\n\n\n\n\n\n\n\n- 结语\n\
  \n## 引言\n你对这个登上 IT 行业舞台的新型设备感兴趣吗？树莓派于 2012 年 2 月 24 日发布。遗憾的是，官方网站崩溃了。然而，新款树莓派 2\
  \ 已经发布并上市。这台计算机设备运行 Linux 操作系统，并带有高定义多媒体接口（HDMI）视频输出。你可以连接一个电脑显示器或电视。但在运行之前，显示器必须具有带有\
  \ HDMI 适配器的 DVI 接口连接到系统。如果你的显示器只有 VGA 接口，树莓派可能无法工作。这种设备是一个全球现象。它适用于各种活动，如智能家电调节器和媒体中心。此外，树莓派还可以作为桌面工作站。现在，初学者可以编写或解码\
  \ Python 编程语言。同样，不熟悉树莓派的经验丰富的程序员也可以学习在不同业务中使用软件功能和特性的方法。你可以开始使用著名的 Python 语言为你的设备编写程序。你可以学习图形用户界面的基础知识。了解\
  \ pygame 模块将帮助你构建有趣有趣的的游戏。树莓派建议使用 Raspbian Wheezy 发行版。书中包含了这一现象的完美呈现。\n\n\n\n\n\n\
  # 树莓派硬件规格\n\n1. 它拥有 4.1 版本的蓝牙。\n2. 视频输出包括使用 3.5 mm 接口的 `PAL` 和 `NTSC`（复合视频）以及 `HDMI`。\n\
  3. 四个 `USB` 端口。\n4. 一个四核 64 位 `ARM Cortex A53` `CPU`，频率达到 1.2 GHz。\n5. 设备重量为 1.6\
  \ oz (45g)。\n6. 电源为 5 伏，通过 `GPIO` 引脚或 `MicroUSB`。\n7. 树莓派尺寸为 85.60 mm × 56.5 mm。\n\
  8. 内存拥有 `1 GB LPDDR-900 SDRAM`，运行 `Linux` 操作系统。频率为 900 MHz。\n9. `Raspbian` 拥有 `10/100\
  \ Mbps 以太网` 和 `802.11` 无线局域网。\n10. `GPU` 拥有 400 兆赫 (MHz) Video core IV 多媒体核心。\n\
  11. 外围设备包括具有特定功能的 `17 GPIO` 和 `HAT ID` 总线。\n12. 其他规格包括 `USB` 鼠标、`USB WiFi` 适配器。\n\
  \n![Inner components of a Raspberry.png](img/Image00003.jpg)\n\n## 树莓派规格\n\n这台微型是一个教育工具，硬件具有以下规格：`GPIO`\
  \ 引脚、电源接口、中央处理器 (`CPU`)、随机存内存 (`RAM`)、`Xbee` 插座、`GPU` 和 `UART`。\n\n树莓派使用 `SD` 闪存卡进行大规模存储。你的\
  \ PC 通过硬盘启动 `Microsoft windows`，而 `SD` 内存卡则帮助 `Raspbian` 启动。硬件规格还包括美标键盘、视频线、电源线、显示器以及一个带有\
  \ `Linux` 运行系统的 `microSD` 卡。\n\n你可能需要的其他可选规格包括设备外壳、`model A` 或 `model B`、`WiFi`\
  \ 适配器、互联网连接、`USB` 鼠标和带电源 `USB` 集线器。使用 `LAN` 缆为 `B` 型连接互联网。\n\n所有规格的详细说明包括：\n\n###\
  \ 中央处理器 (CPU)\n\n`CPU` 是系统的的大脑和枢纽。它使用逻辑和数学函数执行计算机中的指令。树莓派使用 `ARM11` 系列处理器，其功能类似于\
  \ `Samsung Galaxy`。\n\n### 以太网端口\n\n此端口设计用于通过插入你的家庭路由器来访问互联网。它是与其他设备进行交互的网关。\n\n\
  ### 图形处理器 (GPU)\n\n你可以使用 `GPU` 加速图像函数的计算。这是你树莓派板上的一个单芯片，且 `GPU` 支持 `OpenGL`。它还使用\
  \ `Broadcom video-core IV` 构建。\n\n### 通用输入/输出 (GPIO) 引脚\n\n你可以使用 `GPIO` 引脚与其他电子板进行关联和交互。取决于你编程树莓派的方式，这些引脚可以接收并处理输入输出命令。它也可以作为数字\
  \ `GPIO` 引脚工作。其他电子单元通过这些引脚连接到 `Raspbian`。例如，你可以通过将通用输入输出引脚连接到温度传感器来传输数字数据。\n\n###\
  \ 树莓派内存\n\n如果你将树莓派与其他计算机设备相比，它正是一台微型 PC。其他标准计算机的 `RAM` 以 GB 为单位，而 `Raspbian` 的 `RAM`\
  \ 至少包含 `256 MB`，最大 `Ram` 为 `512 MB`。\n\n### 通用异步收发传输器 (UART)\n\n`UART` 是一个串口输入输出端口，用于传输文本等串口数据。程序员使用它进行调试和代码转换。\n\
  \n### 显示器或电视机\n\n树莓派板使用两个显示器或电视来显示数字数据。这包括 `HDMI` 和复合（Composite）显示。使用带有 `HDMI` 公头线的廉价适配器连接多个\
  \ `LCD` 和 `HD TV` 显示器。你的树莓派支持的 `HDMI` 版本为 `1.3` 和 `1.4`，也使用 `1.4` 线缆。这些可以帮助树莓派视频和音频设置的功能。然而，它不支持\
  \ `HDMI l/p` 适配器。复合视频功能用于连接旧电视。在这种情况下，使用复合视频连接将设备到显示单元可以使音频系统可用。连接 `3.5 mm jack`\
  \ 插座并发送到你的电视。这可以使用适用于 `3.5 mm` 并转换为双 `RCA` 连接的光缆来实现。\n\n### 电源线或接口\n\n你可以使用外部电源为你的微型计算机供电。这是屏蔽层旁边的小开关。\n\
  \n### XBee 插座\n\n树莓派板上的此功能用于无线通信。\n\n## 树莓派 A 型板\n\n`model A` 板板被设计为 `Broadcom (BCM2835)`\
  \ `SOC` 板。该型号由 `ARM1176JZF-Score` `CPU` 制造。它带有 `256 MB RAM` 的 `SD` 卡，频率为 700 MHz。\n\
  \n`USB 2.0` 端口具有外部数据连接功能，这是系统中的可选工具。该板通过 `micro-USB` 适配器供电。该适配器携带的最小功率范围为 `2 W`。你还可以使用图形加速图像计算功能，这是系统中的一个特殊芯片。它是一个带有\
  \ `Broadcom video-core IV` 线的内置结构。此功能对于通过树莓派运行视频或游戏有关。\n\n### 树莓派 A 型板的特性\n\n树莓派\
  \ A 型板具有独特特性，例如：\n\n1. 它的板尺寸为 `8.6 cm × 5.4 cm × 1.5 cm`。\n2. 有一个 `SD`、`SDIO` 和\
  \ `MMC` 卡插槽。\n3. `SD` 卡 `RAM` 为 `256 MB`。\n4. 视频输出为复合式，具有 `RCA`（`NTSC` 和 `PAL`）以及具有\
  \ `1.3` 和 `1.4` 线缆版本的 `HDMI`。\n5. 它具有带有 `3.5 mm jack` 的音频输出。\n6. 它的系统功能运行 `Linux`。\n\
  7. 它具有带有 `Broadcom BCM2835` 的完整处理器。\n8. `2.0 USB` 连接是单口的。\n9. 板具有双核 `video-core\
  \ IV 多媒体协处理器处理器`。\n\n## 树莓派 B 型板\n\nB 型号具有 `Broadcom (BCM2835)` `SOC`。板带有 `512 MB\
  \ RAM` 的 `SD` 卡，频率为 700 MHz。`CPU` 核心为 `ARM1176JZF-S`。`USB 2.0` 端口具有外部数据连接功能。你可以通过以太网为\
  \ B 型与其他系统联网。该系统通过 `micro USB` 适配器供电。所需的最小功率为 `2.5 W`。图形具有一个专用芯片。这用于加速图像计算。它具有内置的\
  \ `Broadcom video-core IV` 线。\n\n### 树莓派 B 型板的特性\n\n1. 尺寸为 `8.6 cm × 5.4 cm × 1.7\
  \ cm`。\n2. 板存储具有 `SDIO`、`SD` 和 `MMC` 插槽。\n3. 它具有 `10/100 以太网 RJ45` 接口。\n4. `2.0\
  \ USB` 连接是单口的。\n5. 板具有双核 `video-core IV 多媒体协处理器`。\n\n\n\n\n\n此项目旨在使用你的 Pi 设备来控制直流电机的速度。你需要的设备包括树莓派型号、直流电机、LED、电容、电阻以及电脑显示器或电视机。其他设备包括变压器、wiring\
  \ pi 或 `PHP` 程序、电压调节器、电机驱动 IC 和二极管。\n\n### 工作原理\n你可以使用树莓派调节直流电机的速度。施在直流电机端子上的电压与其速度成正比。如果电机端子上的电压发生变化，速率也会随之变化。这就是该项目的原因。你可以通过连接键盘以不同的速度运行电机。当你按下按键时，系统会立即开始工作。\n\
  \n如果你想处理这个项目，可以编写 `PWM` 来产生输出。输出使用 `wiring pi` 或 `PHP` 启动。此功能基于占空比，占空比会导致系统平均电流和电压发生变化。当这种情况发生时，直流电机的速度就会改变。\n\
  \n在此阶段，你应该将一个电机驱动 IC 连接到电路板上。这一步将使电路板接收 `PWM` 信号。这还会向直流电机发送所需的反极性（O/P）。两个磁场之间的反转极化导致直流电机运行。\n\
  \n# 2. 使用树莓派控制路灯自动开关\n此任务的目的是让学生了解控制路灯自动开关的方法。此项目需要的物品是二极管、电阻、LED、电脑显示器或电视机和晶体。其他设备包括\
  \ `MOSFET`、变压器、`wiring Pi` 或 `PHP` 程序、电容和白色 LED。\n\n### 工作原理\n选择 LED 灯的原因是将其作为路灯，因为它们更节能。与其他灯具相比，LED\
  \ 灯的寿命更长。通过树莓派开发并使用 `PWM` 来调节光强度。此功能使 `MOSFET` 调节灯光，使其达到所需的运行水平。这将导致 LED 光强度从黄昏到黎明稳定变化。你会在高峰期注意到这种现象，那时会有全亮度。一段时间后，光的热量将逐渐减少。你可以通过脉冲宽度调制\
  \ `MOSFET` 开关在 LED 之间实现变压。\n\n### 你可以使用树莓派完成的其他项目\n这些包括\n\n*   触摸屏平板。\n*   同步音乐和圣诞灯。\n\
  *   乐高 树莓派外壳。\n*   可编程顺序切换。\n*   控制无人机。\n\n![Drones controlled with Pi.png](img/Image00004.jpg)\n\
  树莓派控制的无人机\n\n*   太阳能路灯。\n*   树莓派供电的可穿戴计算机设备。\n*   通过树莓派使用蓝牙控制实现机器人臂控制。\n\n![Controlling\
  \ Robots.png](img/Image00005.jpg)\n树莓派控制的机器人\n\n*   使用树莓派配合 Zigbee 进行业务信息化。\n\n\
  ## 设置树莓派所需的所有工具\n![Tools for Raspberry.png](img/Image00006.jpg)\n树莓派设置工具\n你设置树莓派所需的所有工具包括树莓派型号、直流电机、SD\
  \ 卡、连接线或显示电缆、鼠标、电源和键盘。其他需要的可选工具和设备包括 3.5 mm 接口耳机或耳机，以及使用 WiFi 适配器或以太网线连接互联网。\n\n\
  ### 键盘\n使用标准键盘或普通键盘在你的微型计算机输入数据。\n\n### 鼠标\n普通鼠标也用于向系统输入信息。\n\n### SD 卡\n![An SD\
  \ Card.png](img/Image00007.jpg)\n树莓派的 SD 卡\n你应该为你的 Raspbian 获取一张 8 GB Class 4 的\
  \ SD 卡。这已经安装了 `NOOBS`。大多数时候，你可以购买已经安装了 `NOOBS` 的 SD 卡。获取 [NOOBS](https://www.raspberrypi.org/downloads/)\
  \ 的另一种方法是免费下载。\n\n如果你拥有最早的树莓派 A 型或树莓派 B 型，你需要全尺寸的 SD 卡。然而，新的树莓派 A+ 型和 B+ 型设计为使用\
  \ micro SD。其他型号包括树莓派 2 B 型、树莓派 3 B 型和树莓派 Zero，它们都可以使用 micro SD。\n\n### 网络连接\n使用\
  \ WiFi 适配器或以太网线将设备连接到互联网。通过它，你可以下载软件或更新现有软件。\n\n### 电源\n树莓派所需的电源至少为 5 伏。使用 5 伏微\
  \ USB 电源为设备供电。如果你使用电压较低的输出，设备运行将异常。\n\n### 耳机或耳机\n你的微型计算机可以使用 3.5 mm 接口的耳机或耳机工作。\n\
  \n### HDMI / DVI 显示器或电视\n树莓派可以使用电视、HDMI 显示器或 DVI 显示器作为显示单元。如果你想要更清晰的图像和高质量图像，请使用带有\
  \ HDMI 输入的显示器。如果你在使用旧设备，请使用其他连接。原始以太网线是系统访问互联网的理想选择。树莓派 3 集成了无线局域网。\n\n## 安装树莓派\n\
  遵循简单的指南在你的设备上安装 Raspbian 是很容易的。树莓派运行名为 `Raspbian` 的操作系统。它源自 Linux 发行版 Debian。所有树莓派硬件都可以在\
  \ Linux 操作系统上运行。\n\n`Raspbian` 是一个多功能且专业的操作系统，让你的树莓派设备像电脑一样良好工作。它具有浏览器、命令按钮和其他几个程序。\n\
  \n树莓派可以作为家庭电脑运行，因为它是一个低成本设备。它能够无缝地执行其他任务和项目。你可以将其作为无线接入点或玩游戏。\n\n在树莓派上安装 Raspbian\n\
  在树莓派上安装 Raspbian 是一个自然的过程。\n\n### 什么是 NOOBS?\n![Download Noobs.png](img/Image00008.jpg)\n\
  NOOBS 安装\n`NOOBS` 是一个操作系统安装器。它是树莓派上安装 Raspbian 的另一种选择。某些 SD 卡预装了 `NOOBS`。如果没有预装，你可以在使用之前向\
  \ SD 卡下载 [NOOBS](https://www.raspberrypi.org/downloads/)。\n\n### 方法 1 下载 Raspbian\
  \ OS\n![Raspberry Pi Installer.png](img/Image00009.jpg)\n树莓派安装\n安装树莓派的第一种方法下载 [Raspbian](https://www.raspberrypi.org/downloads/raspberry-pi-os/)\
  \ 镜像。这是树莓派当前的操作系统版本。你可以使用 PC 或 Mac 下载 Raspbian 镜像。使用传统的下载功能可能需要一些时间。你也可以使用种子，尽管这可能需要小时。\n\
  \n### 方法 2 解压压缩文件\n下载后，下一步是解压文件。它以 ZIP64 格式存在。然而，这取决于你系统的内置功能。如果它们已更新且最新，你可以使用任何程序解压。\n\
  \n\n\n...\n\n\n\n### 循环链表程序\n\n3. 用于从循环链表中心删除数字的 Python 程序。\n4. 用于从循环链表中查找最小值和最大值节点的\
  \ Python 程序。\n5. 用于创建一个包含 `N` 个节点的循环链表并统计节点数量的 Python 程序。\n6. 用于创建和显示循环链表的 Python\
  \ 程序。\n7. 用于创建一个包含 `n` 个节点的循环链表并按反序显示的 Python 程序。\n8. 用于循环链表进行因数分解的 Python 程序。\n\
  9. 用于从循环链表中删除重复元素的 Python 程序。\n10. 用于在循环链表中查找元素的 Python 程序。\n11. 用于在循环链表中心插入新节点的\
  \ Python 程序。\n12. 用于在循环链表末尾插入节点的 Python 程序。\n13. 用于在循环链表开头插入新节点的 Python 程序。\n\n\
  ### 双向链表程序\n\n1. 用于在双向链表开头插入新节点的 Python 程序。\n2. 用于在双向链表中心插入新节点的 Python 程序。\n3. 用于在双向链表末尾插入新节点的\
  \ Python 程序。\n4. 用于从双向链表开头删除节点的 Python 程序。\n5. 用于从双向链表中心删除新节点的 Python 程序。\n6. 用于从双向链表末尾删除新节点的\
  \ Python 程序。\n7. 用于将特定的二树转换为双向链表的 Python 程序。\n8. 用于确定双向链表最小值和最大值的 Python 程序。\n9.\
  \ 用于创建三元列表双向链表 Python 程序。\n10. 用于统计包含 `n` 个节点的双向链表频率 Python 程序。\n11. 用于创建双向链表的 Python\
  \ 程序。\n12. 用于创建包含 `n` 个节点的双向链表并按反序显示的 Python 程序。\n13. 用于在双向链表中查找元素的 Python 程序。\n\
  14. 用于从双向链表中删除重复元素的 Python 程序。\n15. 用于旋转包含 `N` 个节点的双向链表的 Python 程序。\n\n### Python\
  \ 原生类型程序\n\n- 用于矩阵转置的 Python 程序。\n- 用于从字符串中删除标点的 Python 程序。\n- 用于矩阵相加的 Python 程序。\n\
  - 用于按字母顺序排序单词的 Python 程序。\n- 用于矩阵相乘的 Python 程序。\n\n### Python 条件与循环程序\n\n- 用于检查闰年的\
  \ Python 程序。\n- 用于检查水姆斯特数的 Python 程序。\n- 用于确定区间内水姆斯特数的 Python 程序。\n- 用于计算自然数和的 Python\
  \ 程序。\n- 用于检查素数的 Python 程序。\n- 用于检查数字是否为正、负或零的 Python 程序。\n- 用于检查数字奇偶的 Python 程序。\n\
  - 用于打印斐波那契序列的 Python 程序。\n- 用于打印乘法表的 Python 程序。\n- 用于计算数字阶的 Python 程序。\n- 用于打印区间内所有素数的\
  \ Python 程序。\n\n### Python 版本及其发布日期\n\n| 序号 | Python 版本 | 发布日期 |\n| :--- | :---\
  \ | :--- |\n| 1. | Python 1.0 | 1994 年 1 月 1 日 |\n| 2. | Python 1.5 | 1997 年 12\
  \ 月 31 日 |\n| 3. | Python 1.5.2 | 1999 年 4 月 1 日 |\n| 4. | Python 1.6 | 2000 年 9\
