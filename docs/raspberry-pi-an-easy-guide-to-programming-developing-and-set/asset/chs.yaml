  | 2. | `\\a` | ASCII 响铃 | `print(“\\a”)` |\n| 3. | `\\\"` | 双引号 | `print(“\\\"”)`\
  \ |\n| 4. | `\\\\` | 反斜杠 | `print(“\\\\”)` |\n| 5. | `\\b` | ASCII 退格 (BS) | `print(“Hello\
  \ \\b World”)` |\n| 6. | `\\newline` | 忽略换行 | `print(“Python1 \\ Python2 \\ Python3”)`\
