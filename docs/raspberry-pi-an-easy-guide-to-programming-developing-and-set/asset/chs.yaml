  \ i not in list2:list2.apend(i)print(list2)` |\n\n输出：\n\n| `[1, 2, 3, 55, 98, 65,\
  \ 13, 29]` |\n\n## 什么是多重赋值和多返回值？\n多重赋值允许在一行代码中同时为多个变量赋值。这一特性在初始尝试后变得简单，但你应该学习它。然而，在需要时回想起多重赋值可能是非常困难的。多重赋值等同于迭代器解包和元组解包。这三个表达式在\
  \ Python 编程中可以结合使用，但它们的意思相同。看一个 Python 中多重赋值的示例：\n\n| `>>> x, y = 10, 20` |\n\n\
  在这个示例中，`x` 被设置为 10，而 `y` 被设置为 20。在底层，我们创建了包含 10 和 20 的元组。我们可以遍历元组并从循环中获取每个项，将其顺序传递到变量\
  \ `x` 和 `y`。这在这一语法中清晰地表示：\n\n| `>>> x, y = 10, 20` |\n\n在 Python 中，括号在元组中是可选特性，在多重赋值中也是可选的。它以类似于元组的语法工作。因此，在下面的表达式中，所有的数字都是等价的。\n\
  \n| `>>> x, y = 10, 20`\n`>>> x, y = (10, 20)`\n`>>> (x, y) = 10, 20`\n`>>> (x,\
  \ y) = (10, 20)` |\n\n多重赋值称为元组解包，因为它们通常与元组一起使用。然而，多重任务可以用于任何迭代器，而不仅仅是元组。\n\n###\
  \ 使用列表使用多重赋值\n\n| `>>> x, y = [10, 20]`\n`>>> x10`\n`>>> y2o` |\n\n### 使用字符串使用多重赋值\n\
  \n| `>>> x, y = ‘hi’`\n`>>> x‘hi’`\n`>>> y‘i’` |\n\n正如我之前解释的那样，可以循环的对象可以通过多重赋值或元组解包进行解包。让我们考虑另一个模式来演示多重赋值如何在变量和其他项目（包括对象）上正常工作。\n\
  \n| `>>> point = 10, 20, 30`\n`>>> x, y, z = point`\n`>>> print(x, y, z)10 20 30`\n\
  `>>> (x, y, z) = (z, y, x)`\n`>>> print (x, y, z)30 20 10` |\n\n在最后一行中，我们交换了变量名。这是多重赋值允许你快速完成的操作。多重赋值可以提高代码的可读性和此类代码的准确性。这意味着它可以使代码更具描述性，并嵌入了关于解包迭代器大小和形状的语句。\n\
  \n### 多重赋值在 Python 中的用途\n\n*   多重赋值用于替换硬编码的切片。\n*   它替换了硬编码索引。\n*   它使用了类似于元组的语法，但作用于任何迭代器。\n\
  *   多重赋值为人类解释了代码以提高读性，为计算机设备提高了代码的正确性。\n*   多重赋值用于深度解包。\n*   它是切片的替代方案。\n*   它帮助你使用类似于列表的语法。\n\
  \n### 多返回值\n在 Python 中，函数可以通过返回序列来恢复多个数字。你可以使用多个局部赋值或多重赋值将值分配给不同的变量。当返回数字之和已知时就会发生这种情况。例如：\n\
  \n| `i1 : f = I -> (I, 1², 1³);i2 : (x,y,z) = f` 3o2 = |\n\n### 函数总结\n在 Python 中，函数是用于执行任务的代码块。Python\
  \ 带有各种功能，如 `print()`、`type()` 等。然而，请根据你的软件定义并创建自己的函数。\n\n#### 在 Python 中定义和识别函数键\n\
  \n*   函数块以关键字 `def` 开始。其后是带有括号 `()` 的函数名。\n*   每个函数都有一个冒号 `:`，并且该冒号是缩进的。\n*   使用\
  \ `return` 语句退出函数。这可以可选地传回表达式。\n*   将参数放在括号内，这些参数可以在括号内定义。\n*   可选语句可以形成函数的初始表达式。即\
  \ docstring 或 文档字符串。\n\n一个使用语法的示例\n\n```python\ndef functionname(parameters):“docstring”\n\
  return expression\n```\n\n参数默认具有位置性能。这意味着你应该按照它们被定义的顺序放置它们。一个插图如下：\n\n```python\n\
  def printme(str):“这会将传递的字符串打印到此函数中”\nprint strreturn\n```\n\n你可以定义一个函数并给它命名。通过这种方式，你可以指定嵌入到函数中的参数，还可以构建字母块。如果你完善了任务的基本结构，可以通过调用它来执行。这一过程是通过遵循\
  \ Python 的提示完成的。\n\n### 数字和字符串\n在 Python 中，数据可以使用数字和字符串等对象表示。这些是内置对象，你可以通过外部扩展语言工具创建它们。在大多数情况下，Python\
  \ 提供了这些对象。\n\n整数、复数和浮点数被程序接受。这些表示为\n\n*   `int` 用于整数\n*   浮点数，以及\n*   Python 中的多个类。\n\
  \n```python\ne = 7\nprint(type(f))\nprint(type(7.0))\ng = 7 + 3k\nprint(g + 3)\n\
  print(isinstance(g, complex))\n```\n\n输出：\n\n| `<class 'int'><class 'float'>(8+3j)True`\
  \ |\n\n\n\n\n整数在表达式中可以是任意长度。浮点数只有在具有 15 位小数时才是准确的。如果你注意到第 16 位小数，则该表达式是不正确的。这些数字是十进制计数系统中的数字。程序员通常处理二进制（2\
  \ 进制）和十六进制（16 进制）数字。他们也可以处理八进制（8 进制）数字。你可以在数字前放置前缀来在 Python 中表示这些数字。\n\n### 用于数制系统的前缀\n\
  \n| S/N | 数制系统 | 前缀 |\n| :--- | :--- | :--- |\n| 1. | 二进制数 | `0B` / `0b` |\n| 2.\
  \ | 八进制数 | `0O` / `0o` |\n| 3. | 六进制数 | `0X` / `0x` |\n\n#### 看这些示例\n\n```python\n\
  ### Output : 107\nprint(0b1101011)\n### Output : 253 (251 + 2)\nprint (0xFB + 0b10)\n\
  ### Output : 13\nprint(0o15)\n```\n\n**输出：** 运行程序，你将得到如下输出：\n\n| 107 | 253 | 13\
  \ |\n\n### Python 中的数字类型转换\n\n数字可以通过强制类型（coercion）进行转换。这是一个将一个数字转换为另一个的过程。你可以使用加法和减法操作自动将整数转换为浮点数。如果操作数中的一个是浮点数，则该操作将成功执行。例如：\n\
  \n```python\n>>> 1 + 2.0\n3.0\n```\n\n在上面的语句中，整数通过加法强制转换为 `2.0` 浮点数。这种转换的结果也是一个浮点数\
  \ `3.0`。另一个过程是通过像 `int()`、`float()` 和 `complex()` 等内置功能。我们可以使用这些功能在类型之间转换数字。此外，这些功能也可以将数字从字符串转换。\n\
  \n#### 示例\n\n```python\n>>> int(2.3)\n2\n>>> int(-2.8)\n-2\n>>> float(5)\n5.0\n\
  >>> complex('3+5j')\n(3+5j)\n```\n\n如果你是从浮点数转换为整数，则数字会被截断，小数部分会被移除。\n\n### 使用 Python\
  \ Decimal（小数）\n\n你可以使用 Python 内置的类 `float` 进行一些惊人的计算。在数学计算中，`1.1` 和 `2.2` 的和 = `3.3`。但在\
  \ Python 中存在分歧和差异。\n\n```python\n>>> (1.1 + 2.2) == 3.3\nFalse\n```\n\n这个结果意味着浮点数在计算机硬件中是以二进制分数的形式执行的。这是计算机系统唯一理解的数字类型：二进制数字\
  \ `0` 和 `1`。因此，在你的计算机系统中存储小数将是复杂的。例如，分数 `2/6` 无法在计算机中以小数的形式表示。它会给我们 `0.33333333…..`，而且这个结果很长。但答案是可以近似的。\n\
  \n然而，小数 `0.1` 将带给我们一个极其长的二进制分数 `0.000110011001100110…`。但计算机可以接受和存储的位数是有上限的。正因如此，我们可以近似\
  \ `0.1`，但它是不相等的。值得注意的是，这种缺失并不是 Python 的错误，而是由于计算机硬件的限制。\n\n```python\n>>> 1.1 +\
  \ 2.2\n3.300000000000003\n```\n\n但是，你可以使用 Python 内置的小数模块来处理这种差异。浮点数的精度高达十五位小数。它有一个允许用户设置精度的\
  \ `decimal` 模块。这两个结果之间的差异将显示：\n\n```python\nimport decimal\nprint(0.1)\nprint(decimal.Decimal(0.1))\n\
  ```\n\n**输出：**\n\n| 0.1 | 0.100000000000000055511151231257827021181583404541015625\
  \ |\n\n你可以使用这个模块执行我们在学校中学过的小数计算。这种格式保持了值的有效性。\n\n## 列表和字典\n\n列表就像其他语言中的数组，它们在 Python\
  \ 中非常重要。列表是可变的，在创建后可以被修改。例如：\n\n```python\n### 用于演示创建列表的 Python 程序\nlist = [\"Books\"\
  , \"For\", \"Books\"]\nprint(list)\n```\n**输出：**\n`['Books', 'For', 'Books']`\n\n\
  ### 字典\n\n在 Python 中，字典是无组织的数据值汇编，类似于映射（map）。与列表不同，它包含键值对。它使用冒号（`:`）创建。每个键值对用逗号（``,`）分隔。例如：\n\
  \n```python\n### 用于演示创建带有整数键字典的 Python 程序\ndict = {1: \"Books\", 2: \"For\", 3:\
  \ \"Books\"}\nprint(dict)\n```\n\n**输出：**\n`{1: 'Books', 2: 'For', 3: 'Books'}`\n\
  \n#### 使用混合键\n\n```python\n### 用于演示创建混合键字典的 Python 程序\ndict = {\"Name\": \"Books\"\
  , 1: \"For\", 2: \"Books\"}\nprint(dict)\n```\n\n**输出：**\n`{'Name': 'Books', 1:\
  \ 'For', 2: 'Books'}`\n\n### 列表与字典的区别\n\n| S/N | 列表 | 字典 |\n| :--- | :--- | :---\
  \ |\n| 1. | 列表索引是从 0 开始的整数。 | 字典的键可以是任意类型。 |\n| 2. | 你可以通过在 `[]` 中放置元素并用逗号分隔来创建列表。\
  \ | 通过在 `{}` 中放置 `\"键\":\"值\"` 并用逗号分隔来创建字典。 |\n| 3. | 列表维持元素的顺序。 | 不维护顺序。 |\n| 4.\
  \ | 通过索引访问列表元素。 | 通过键访问字典元素。 |\n\n## 第四章类、方法和模块\n\n在 Python 中，类是帮助你创建或自定义对象的模板。变量和函数被封装在单一实体中。对象从类中生成变量、特征和功能。创建类需要注意的想法是类允许你构建一个分类事物或对象的模板。创建的类可以被处理或自定义。类是用于产生这些模板的实例，在其中可以使用方法和其他操作。你可以为任何组织组织、构思并构建架构图或层次结构。类用于定义公司、工业、社会和其他环境中的程序和关系。在使用\
  \ Python 类之前，请考虑以下特性：\n\n1. 创建或开发一个类并应用它。\n2. 在将类移动到模块之前，先创建一个模块。\n3. 在新的程序中调用类之前先调用模块。\n\
  \n\n\n\n在创建一个类后，创建一个模块，并将你在类中创建的代码转移到其中。通过这种方式，你可以在任何程序中创建通用的 x、y 同步。\n\n## 什么是模块？\n\
  模块是一个包含 Python 语句和定义的文件。它也是从其他程序引用的 Python 代码。模块被用于日常任务，你不需要在每个可以使用它的程序中都重复输入它们。\n\
  \n你可以使用 `matplotlib.plot` 调用包模块。如果没有这个模块，你必须在每个使用绘图图表的程序中都声明绘图的函数。\n\n在 Python 文档中，如果你退出\
  \ Python 解释器并重新打开软件，定义（即变量和函数）将会丢失。但编写一个更扩展的程序需要你使用文本编辑器为解释器准备数据。然后，运行该文件作为输入。\n\
  \n这个过程被称为脚本编写。建议将长程序拆分为多个文件，以便维护应用程序。这可以应用一个为多个应用程序编写的方便函数。在这种情况下，你不需要在工作之前将描述复制到所有程序中。\n\
  \nPython 可以帮助你将描述组织在文件夹或文件中，并在脚本中应用它们。它也可以被用于解释器的关联场合。以这种方式组织的数据被称为模块。从模块的描述被提取到不同的模块或主模块中。这是一个变量的集合，你可以在脚本中访问它们。它们可以在上层或在计算器模式下执行。\n\
  \n通过上述分析，你可以理解为通过类的创建和特性将实例从程序转移到特定的类。你只需要通过工作和引用这个新创建的模块，就可以在当前程序中使用此功能。\n\n###\
  \ 我们上面所做的总结：\n1. 我们开发并启动了类。\n2. 创建了一个函数，可以将类实例向四个重要方向移动，如右、左、上、下。在这里，增量成为函数的参数或参数。\n\
  3. 在模块中，创建一个函数，使用图距离公式计算该类中两个请求之间的距离。\n\n## 树莓派中有哪些模块？\n树莓派包含一个计算模块（compute module1）。该设备设计用于灵活形式的工业应用。\n\
  \n## 计算机模块的规格\n模块是你的 Pi 设备的骨干，因为它包含了 512MB RAM、`BCM2835` 处理器和 4GB eMMC Flash 设备。它与微型计算机中的\
  \ SD 卡相当且相似。所有这些规格都包含在一个尺寸为 67.6 × 30 mm 的板上。该板适用于标准连接器，如 `DDR2 SODIMM`。该连接器用于笔记本电脑的内存。\n\
  \n此内存直接耦合在板上的处理器上。可以通过连接器引脚访问其他处理器接口，你将享受 `BCM2835` SoC 的灵活性。在这种情况下，与树莓派相比，可以使用更多的接口和\
  \ GPIO，使得以直观的方式设计和定制系统可能。\n\n## Python 中的库\n在 Python 编程中，你可以通过采用 Python 库和包来限制代码的使用。这些是相关模块和函数的集合，对编程很有价值，而不是代码。你将在\
  \ Python 中发现超过十万个库和一百九十个包。它们的设计和开发是为了让初学者（包括 Pythonistas 和 Pythoneers）的编程变得简单，为社会各种各种挑战提供解决方案。\n\
  \nPython 库对于机器学习非常有用，包括数据可视化、图像和数据处理，以及用于不同应用程序的数据科学。Python 包包含 Python 模块的集合，而库是用于执行特定任务的\
  \ Python 函数集合。\n\n以下是一些 Python 库及其特性：\n\n### Matplotlib 库\nMatplotlib 是一个程序员可以通过\
