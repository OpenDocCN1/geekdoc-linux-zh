  ## Fire Library\n`Fire` 库可以立即生成命令行界面（`CLIs`）。这是一个代码量较少的开源 Python 库。它是一个主库，能够从 Python\
  \ 中的任何对象派生 `CLIs`。Google 也将其用于创建命令行。它对于开发各种实验板设备非常有用。\n\n### Fire Library 的特性\n\
  1. 它具有线性输出，且不需要文档字符串。\n2. 它带有一个能够适应你代码更改的 `CLIs`。随着你更改代码，它将立即更新。\n3. 当你调用 `Fire()`\
  \ 时，`Fire` 库可以自动编写和发送命令。\n4. `Fire` 库适用于各种 Python 对象，如类、列表、模块、字典和对象。\n5. 它具有完整的\
  \ `CLIs`，在交互系统中具有自动帮助页面和 Tab 补全功能。\n\n## Natural Language Toolkit (NLTK)\n这是一个著名的\
  \ Python `NLP` 库。它包含一组语言处理库，具有多种应用，共同为英语提供了一种标志性且数值化的语言处理解决方案。该库用 Python 语言编写。通过\
  \ `Natural Language Toolkit`，使用 `Python` 处理自然语言现在成为标准且理想的选择。\n\n### NLTK (Natural\
  \ Language Toolkit)的特性\n1. 它包含了数据科学的图景。还附带了一本手册指导通过 `NLTK` 进行语言处理思想。\n2. `NLTK`\
  \ 具有各种结构方法、字符串格式解析、重入和不同的路径。\n3. 具有一个活跃的讨论论坛，用于分析影响你的程序和 `NLTK` 的问题。\n4. 它包含了五十多个语料库和词汇属性，如问题分类、停用词语料库、`SEMCOR`、`SentiWordNet`\
  \ 以及多语言 `WordNet` 等。\n5. 它允许使用文本处理库进行语义推理、分类、分词、标记、词干提取和解析。\n\n## Scipy Library\n\
  该库对于技术和科学计算有用。`Scipy` 是一个适用于机器学习的辅助 Python 库。它因图像处理而闻名。\n\n### Scipy 的特性\n1. `Scipy`\
  \ 是一个包含 `nump.lib.scimath` 以及 `NumPy` 的高级库。直接从源使用它们更好。\n2. 它拥有一个活跃的成员社区，随时回答你的问题并解决你的困难。\n\
  3. 它有两种处理 1 维多项式的方法。\n\n## Arrow Library\n这是 `Python` 中一个实用且用户友好的库，用于处理时间和日期。它具有支持通用方案的智能\
  \ API，使其成为一个令人兴奋的库。该库非常适合具有基础知识的学者。\n\n### Arrow Library 的特性\n1. 适用于各种版本的 `Python`，如\
  \ `Python 2.7`、`3.5`、`3.6`、`3.7` 和 `3.8`。\n2. 能够在自然过程中解析和消除字符串。`Arrow` 是一个时间敏感库，默认设置为\
  \ `UTC`。\n3. 它转换时区并提供时间戳。该库可以为你的 `arrow` 派生类型进行扩展。\n4. `Arrow` 提供了从微秒到年的时间范围。它有助于为时间帧创建上限、跨度、下限和范围。\n\
  5. 使用简单的创建方法通过 `Arrow` 创建各种输入场景。\n6. 它生成、删除、影响和转换时间和日期。它需要执行日期类型的快速更新并填补间隙。\n\n\
  ## FlashText Library\n如果你需要轻松搜索单词和文档，或在 `Python` 程序中替换相同内容，你需要 `FlashText` 库。它通过一组单词和字符串运行。在这种情况下，它会将某些单词识别为关键词并从\
  \ `Text Data` 中替换。它对于苦于单词替换过程的程序员来说非常实用。\n\n### FlashText Library 的特性\n1. 如果关键词数量超过\
  \ 500，它适用于大量查询。\n2. 该库不用于搜索如 `-`、`#`、`*`、`^` 等唯一字母，也不用于指向单词的部分。\n3. 将关键词保留为 `Trie\
  \ Data Structure`，使其非常动态且高效。\n4. 它使用更新的字符串进行关键词替换。`FlashText` 在执行搜索时会向字符串返回关键词列表。\n\
  5. 它作为一个快速库运行，并提供不同的字符串操作。\n\n## TensorFlow Library\n这是一个 Python 中的免费开源机器学习集合。`TensorFlow`\
  \ 包含了易于学习的有用工具。该库适用于不同的程序和数据流。在计算机设备中使用 `TensorFlow` 之前，请在浏览器中安装 `Colab Notebooks`。\n\
  \n### TensorFlow 的特性\n1. 它包含易于发现结构设计。通过该库，你可以在打印或发布项目之前将想法转化为代码。\n2. `TensorFlow`\
  \ 具有动态执行功能，允许你创建和操作机器学习结构。这使得调试变得更加自然和更好。\n3. 该库与快速高效的 API（如 `Keras`）协同工作。它为机器学习表示提供了快速迭代。\n\
  4. `TensorFlow` 为每个机器学习问题提供了解决方案。它易于实现和使用。\n5. 它可以将你的机器学习表示传输到云端和其他设备，包括各种浏览器中的本地部署。\n\
  \n\n\n\n\n# 什么是面向对象？\n\n面向对象是一种通过使用对象进行计算来解决程序的方法。对象是程序中的一个组件，用于执行特定操作并与程序的其它元素进行交互。面向对象编程的基本组件是对象。\n\
  \n程序中对象的一个例子是人。因此，从逻辑上说，这样的人必须有一个名字。名字变成了这个人的一个属性，他可以执行吃饭、饮水、行走等不同的功能。这些功能就成了这个人（对象）的方法。\n\
  \n在面向对象编程（OOP）中，代码围绕对象组织，对象之间可以相互交互以实现各种功能。设计一个某人正在开车的程序，首先需要你描述涉及的对象，即人和车。现在你将指定方法。这些是：人如何开车，车辆如何被驾驶。在组织好对象后，你就可以将它们结合起来并创建一个人驾驶车辆的图表。\n\
  \n因此，类（class）是对象的模型，是一个概念。对象是该概念的体现。在设计对象之前会先创建一个类。在创建对象之后，你就准备好设计某些内容了。这涉及到方法。\n\
  \n在面向对象编程中，方法（method）是与类相关的过程。它定义了从类创建的对象的行为。对象执行的操作被称为方法。类与方法之间的交互被称为绑定（binding）。\n\
  \n# 第五章：如何在树莓派上使用文件和互联网\n\n![Using Internet.png](img/Image00017.jpg)\n\n## 在树莓派上使用文件和互联网\n\
  \n你可以轻松地在 Pi 上使用文件和互联网。这将允许你能够在虚拟的基础上完成任务并处理多个项目。实现这一点的某些方法包括：\n\n1. **端口转发** –\
  \ 处理此问题的最佳方法是通过端口转发。你可以通过你的路由器访问互联网。在你的路由器上设置端口转发功能。这意味着你将配置路由器，将所有指向特定端口的入站互联网流量转发到你系统的本地\
  \ IP 地址。\n\n各种路由器都设计了此功能。但不同的路由器具有不同的配置，请遵循你路由器用户手册上的说明进行正确配置。如果你的树莓派有多个路由器，或者它位于防火墙之后，你可能会发现操作困难。端口转发功能的一个显著缺点是它会将个人局域网（LAN）上的系统端口暴露给开放互联网。建议仔细管理此功能，因为这是一个安全威胁。\n\
  \n2. **第三方在线端口转发服务** – 通过第三方服务提供了几种可选的端口转发解决方案。它们可以提供各种类别的功能。\n\n## 树莓派中的文件是什么？\n\
  \n在树莓派中，文件是你保存在系统中的以供未来参考的数据或文档。这些文件被保存在文件夹中以便进行良好的组织和管理。一个文件夹可以包含多个文件，甚至是其他文件夹。树莓派有一个名为\
  \ `File Manager`（文件管理器）的文件管理软件。该应用位于 Pi 系统任务栏浏览器图标的右侧，用一个破旧的归档柜表示。\n\n如果你想启动文件管理应用，点击点击图标。窗口左侧将出现各种文件和文件夹列表。点击任何文件夹以查看内部的文件。当你点击一个文件夹时，文件将出现在窗口的右侧。你可以通过点击文件夹描述旁边的小三角形来查看文件夹中的文件。此操作将打开文件夹并显示其内部的文件夹或文件，使三角形指向下方。如果你关闭文件夹，三角形将面向文件夹名称右侧。\n\
  \n树莓派中文件夹的完整列表被称为 `directory tree`（目录树）。它看起来像一棵倒置的树。它从文件夹中的一个根目录开始生长。这个文件夹在 Pi 中具有重要意义，它被称为单反斜杠\
  \ `\\`。这个文件夹包含了其他文件夹，使得使用和导航你的树莓派变得简单。如果你检查窗口上的文件夹列表，你会注意到列表顶部有一个被称为 `pi` 的。这被称为主目录（home\
  \ folder）。树莓派设备上的每个用户都有这个名为 `Pi` 的文件夹，即主目录。程序员在主窗口上花费大量时间。它位于并放置在目录树中，你不需要在看到它之前导航到主树。\n\
  \n在文件管理器中快速点击即可找到主目录。定位主目录的另一种方法是在看到它之前滚动并点击许多文件和按钮。这通常被认为是费力的方法，但你应该知道快捷键。\n\n\
  ### 在文件管理器中导航\n\n你树莓派中的每个文件都有文件管理器分配给它们的地址。这表现为在访问文件之前需要点击的文件夹列表。这些地址在文件归档系统中被称为\
  \ `paths`（路径）。因此，在你的系统中获取地址就像在小径上散步一样。路径在到达目的地之前可能会有弯道和胡巷。\n\n#### 在树莓派中访问文件的分步方法\n\
  \n1. 打开系统并点击“主目录”。\n2. 点击主目录内的 `pi` 文件夹。\n3. 继续点击各种查看各种文件夹，直到到达所需的文件夹。\n\n在设备中导航很容易，因为\
  \ `File Manager` 始终会引导你找到正确的文件和文件夹。这是一个可以带你进入 Pi 中已安装应用的地址示例。\n\n```\n| /usr/share/raspi-ui-overrides/applications\n\
  ```\n\n你可以尝试此地址来访问你树莓派设备中的文件。向下滚动文件和文件夹列表以在 `/usr/share` 中找到你的文件。通过双击文件管理器中的任何应用或文件夹，你可以启动并打开它们。\n\
  \n## 如何管理文件系统\n\n![Internet on Raspberry.png](img/Image0018.jpg)\n\n### 管理文件系统\n\
  \nRaspbian 中的终端使用特定命令操作文件系统。以下是管理文件系统的某些方法。\n\n#### 创建文件\n\n你在终端中有多种创建的方法。但处理此过程最简单的方法是应用\
  \ `touch` 控制。此命令用于创建和更新文件的时间戳。它涉及非常简单的语法。只需输入 `touch ` 然后是文件名。如果不存在指定的文件，该命令将快速创建一个新文件。通过遵循命令在\
  \ `/home/pi/` 目录下创建一个名为 `textfile.txt` 的新文件。\n\n```bash\npi@new-hostname – $ touch\
  \ /home/pi/textfile.txt\n```\n\n#### 删除文件\n\n使用 `rm` 命令删除文件非常简单。要删除你创建的文件，只需在窗口中文件名之前输入\
  \ `rm`，数据就会被移除。\n\n```bash\npi@new-hostname – $ rm textfile.txt\n```\n\n\n\n\n\n\
  # 如何显示文件内容\n\n你系统中的文件内容可以使用文本查看器或文本编辑器显示。在 Raspbian 中，有多种程序可以帮助你查看文件和文件夹的内容。其中一个程序名为\
  \ `less` 的程序。它可以逐个在屏幕上显示文件内容。它使用语法 `less` 运行。回到键盘并输入命令 `less`，后跟你想要显示的文档标题。如果你想显示上面创建的文件内容，请使用此命令。\n\
  \n```bash\npi@new-hostname - $ less /home/pi/textfile.txt\n```\n\n输入此命令后，内容将在 `less`\
  \ 程序窗口中显示。然而，按下键盘上的 `q` 键即可轻松退出 `less` 程序。你也可以通过应用 `cat` 命令显示文件内容。在这里，内容将直接显示在终端上。例如：\n\
  \n```bash\npi@new-hostname - $ cat textfile.txt\nHello, world!\n```\n\n## 读取与写入\n\
  \n如果你希望程序的输出对人类可读，可以通过几种方式演示数据。你甚至可以将信息存档文件以备后用。\n\n## 写入值的方法\n\n你可以通过以下方式写入值：\n\
  \n1. 文件对象的 `Write()` 系统。在这里，标准输出文档可以被引用为 `sys.stdout`。\n2. 表达式语句。\n3. `print()`\
  \ 函数。\n\n大多数时候，你应该正确格式化你的输出，而不是打印分离的值。你可以通过两种方式格式化你的输出或写入，例如：\n\n1. 字符串切片和拼接操作。通过这种方式，你可以设计任何可能的布局。它具有一些将字符串填充到特定列宽的服务程序。\n\
  2. 使用 `str.format()` 方法。\n\n字符串元素有一个模板类，提供了另一种交替值字符串的方法。Python 程序可以帮助你将值转换为字符串并将其传递给\
  \ `str()` 函数或 `repr()` 函数。字符串可能包含文件名或几个字符。这将定义文件使用的模式（`mode`）。模式可以是 `‘r'` 表示用于读取的数据，而\
  \ `‘w'` 用于将要写入的文件。它也可以用于标记为删除的数据。`‘a'` 打开文档以附加或追加写入到文件的任何信息。这些信息会自动添加到末尾。如果你看到代码\
  \ `‘r+`，意味着文件可用于解释和写入。\n\n当文档以文本模式打开时，你可以从文件中读取和写入序列，或向文件读取和写入序列。这些是在特定编码中预设的。但如果程序不是特定的，默认值取决于阶段。附加在方法上的代码\
  \ `‘b'` 以二进制模式打开文档。在这里，数据将像字节对象一样被写入和读取。这种模式适用于不含文本的文件。\n\n如果你以文本格式读取，默认将把平台特定的换行符（如\
  \ Windows 上的 `(\\r\\n`，Unix 上的 `\\n`）转换为单独的 `\\n`。如果你以文本模式写入，默认将把 `\\n` 段落转换回平台特定的换行符。这些修改适用于文本数据，但可能会损坏二进制数据，如\
  \ `JPEG` 或 `EXE` 文档。读写此类文件时要谨慎使用二进制模式。\n\n## 网络与序列化（Pickling）有什么区别？\n\n## 树莓派上的网络连接\n\
  \n网络用于从移动设备或计算机访问网页。正如我上面提到的，你可以通过端口转发来实现。这涉及更改路由器的配置，将来自互联网的所有入站流量转发到本地 IP 地址。也可以通过处理端口转发的第三方机构来实现。\n\
  \nPickling 是使用模块实现一种基础且稳健的算法，用于对 Python 对象结构进行序列化和反序列化。这涉及将 Python 对象层次结构转换为字节流。因此，unpickling\
  \ 是此操作的反转过程，导致字节流重新转换为命令对象链。\n\n这两个术语 pickling 和 unpickling 也被称为 marshaling（封送）、flattening（展平）或\
  \ serialization（序列化）。`pickle` 模块维护已序列化对象的路径。这将防止在未来的引用中对相同对象重复序列化。\n\n# 第六章：树莓派中的图形用户界面\n\
  \n## 树莓派上的 GUI\n\n树莓派上的图形用户界面（GUI）是一种界面，允许编程人员和用户通过视觉指示表示（如电视和显示器）与你的系统进行交互。它由 Xerox\
  \ Palo Alto 在 20 世纪 70 年代后期开发，但由 Apple 的 Macintosh 包括 Microsoft Windows 操作系统进行了商业部署。\n\
  \nGUI 是软件中基于用户的蓝图模型，因为它为用户提供了直观地操作计算机和各种电子设备的能力。这是通过直接应用图形符号（如按钮、标签页、菜单、滚动条、鼠标、光标和窗口）实现的。如今，图形用户界面带有触摸屏和语音提示（命令）功能和特性。\n\
  \n## Python 中的 Tkinter 模块是什么？\n\nPython 中的 Tkinter 模块是 Python 程序的实标准库。该模块支持 OS X、Linux\
  \ 和 Windows 等所有平台。你在 Tkinter 中看到的一些组件包括复选按钮、画布、框架、文本。在 Python 中，Tkinter 是 GUI 中的一个编程包。它包含一个提供\
  \ TK GUI 工具包的内置库。它具有强大的面向对象接口。Tkinter 和 Python 是任何应用程序中创建 GUI 最廉且最简单的方法。\n\n###\
  \ 使用 Tkinter 的方法\n\n第一步是从 `partial` 导入模块，例如 `Tkinter` 和 `functools`。然后，创建主窗口。向基础窗口添加所需的组件，如标签、按钮和输入框。在此阶段，显示消息。最后，在组件上应用事件。\n\
  \n### 对 Tkinter 中发现组件的简要说明\n\n1. `Entry` 组件：用于显示单行文本框，可以接受用户输入的数字。\n2. `Checkbutton`\
  \ 组件：非常适合将多个选项作为复选框显示。通过这种方式，用户可以同时选择多个备选方案。\n3. `Frame` 组件：它充当组织其他组件的容器组件。\n4.\
  \ `Button` 组件：用于在你的应用程序中显示按钮。\n5. `Canvas` 组件：用于在你的应用程序中绘制矩形、多边形、线条和椭圆等形状。\n6. `Listbox`\
  \ 组件：为用户提供多个选项。\n7. `Menubutton` 组件：用于向用户提供不同的命令。这些命令位于 Menubutton 内。\n8. `Label`\
  \ 组件：用于为应用程序其他组件提供单行描述。它可以带有图像。\n9. `Text` 组件：帮助你显示多行文本。\n10. `Spinbox` 组件：这是 Tkinter\
  \ Entry 组件的变体，用于从几个固定值中进行选择。\n11. `Toplevel` 组件：用于提供独立的窗口容器。\n12. `tkMessageBox`\
  \ 组件：该模块用于在应用程序中显示消息框。\n13. `PanedWindow` 组件：一种具有多个垂直或水平排列窗格的容器组件。\n14. `LabelFrame`\
  \ 组件：这是一个简单的容器组件，作为复合布局的容器或间距符。\n\n\n\n\n\n15. `Scrollbar` 小部件 – 用于滚动各种部件，如 `listboxes`。\n\
  \n16. `Scale` 小部件 – 用于提供滑动条部件。\n\n17. `Radiobutton` 小部件 – 使用此功能可以将某些选项以单选按钮的形式显示。用户一次只能选择并操作一个选项。\n\
  \n18. `Message` 小部件 – 用于显示多文本字段并接收用户输入。\n\n## Hello World 和温度转换器如何在 GUI 中运行\n\n\
  正确理解 GUI 将增强你对温度转换器工作原理的认知。该项目涉及摄氏度到华度的转换。按照应用程序中的流程操作并将代码复制到你的 Python 编辑器中实现。\n\
  \n```python\nimport Tkinter as tk\n## 声明全局变量\ntemp_c = None\ntemp_f = None\n\n#\
  \ 每当按钮被按下时都会调用此函数\ndef convert ( ):\n    global temp_c\n    global temp_f\n    #\
  \ 将摄氏度转换为华度并更新标签（通过 textvariable）\n    try:\n        val = temp_c.get()\n      \
  \  temp_f.set((val * 9.8 / 5) + 32)\n```\n\n在运行之前，将其命名为 `tkinter_temp_converter.py`。将弹出一个新窗口，其中包含一个输入数字的部分（代表摄氏度）。点击“Convert\
  \ 按钮”，相应的华度温度将会出现。这将显示在华氏度旁边的标签中。\n\n## 理解 Listbox 和 Spinbox\n\n`Listbox` 组件用于显示项目列表，用户可以从中选择各种项目。\n\
  \n### 创建 Listbox 的简单语法\n语法包括\n\n```python\nw = Listbox ( master, selection, … )\n\
  ```\n\n### 使用 Listbox 的参数\n使用 `Listbox` 的参数涉及 `master` 和 `options`。\n\n1. `master`\
  \ – 用于父窗口。\n2. `options` – `Listbox` 小部件最常用的选项包括以下内容，这些以以键值对的形式表示，并用逗号分隔。\n    -\
  \ `height` – 这是 `Listbox` 中显示的行数。默认值为 10。\n    - `font` – 指明应用于 `Listbox` 内容的字体。\n\
  \    - `highlightcolor` – 代表当小部件处于焦点时，焦点高亮显示的颜色。\n    - `relief` – 用于选择 3D 边界阴影效果，默认是\
  \ sunken（凹陷）。\n    - `selectmode` – 用于确定可以选择的项目以及鼠标拖动如何影响你的选择。这些选项包含了 `single`、`extended`、`multiple`\
  \ 和 `browse` 等功能。\n    - `highlighthickness` – 显示焦点高亮的厚度。\n    - `Selectbackground`\
  \ – 显示选中文本的背景颜色。\n    - `bd` – 指示器边界的大小。\n    - `yscrollcommand` – 通过此，用户可以垂直滚动\
  \ `Listbox`。它将你的 `Listbox` 小部件链接到垂直滚动条。\n    - `cursor` – 每当鼠标悬停在 `Listbox` 上时出现。\n\
  \    - `fg` – `Listbox` 内文本的颜色。\n    - `xscrollcommand` – 帮助用户水平滚动 `Listbox`。通过此，你可以将你的\
  \ `Listbox` 小部件链接到水平滚动条。\n    - `bg` – 代表带有指示器的标签后面的标准背景颜色。\n\n### Listbox 对象的方法\n\
  这些方法包括：\n\n1. `delete ( initial, end=None )` – 此方法消除位于第一个和最后一个范围内的行。如果删除了随后的行，则选择带有索引\
  \ `first` 的孤立行。\n2. `get (initial, end=None )` – 此方法返回一个包含从第一个到最后一个行的键值文本的元组。如果省略了第二行，它将替换第一行旁边那行的行的文本。\n\
  3. `index ( i )` – 尝试对 `Listbox` 中可见的元素进行定位。这使得索引为 `i` 的列位于小部件的顶部部分。\n4. `curselection()`\
  \ – 此方法返回一个包含所选元素/元素行号的元组，从 0 开始计数。如果未选择任何内容，则返回一个空元组。\n5. `Activate ( index )`\
  \ – 有助于选择由给定框指定的行。\n6. `size (` – 用于返回 `Listbox` 中的行数。\n7. `xview()` – 使 `Listbox`\
  \ 可以水平滚动。它将关联水平滚动条的 command 设置为此格式。\n8. `xview_moveto ( fraction )` – 该方法滚动 `Listbox`，使其最宽列的左侧位于\
  \ `Listbox` 的左侧之外。该部分范围在 `[0,1]` 之间。\n9. `yview()` – 使 `Listbox` 可以垂直滚动。它将关联滚动条的\
  \ command 设置为此方法。\n10. `yview_moveto ( fraction )` – 此方法将 `Listbox` 滚动到宽的上部。如果第一行在\
  \ `Listbox` 的左侧之外。比例范围在 `[0,1]` 之间。\n11. `see ( index )` – 调整 `Listbox` 的位置，使 `index`\
  \ 指定行可见。\n12. `yview_scroll (number, what )` – 有助于垂直滚动 `Listbox`。它使用任一单位根据 `what`\
  \ 参数滚动行。它使用页码按 `Listbox` 的高度进行导航，而 `number` 参数决定滚动多少。\n13. `xview_scroll ( number,\
  \ what)` - 此方法水平滚动 `number`。它使用任一单位根据 `what` 参数按 `Listbox` 的宽度滚动字符。然而，`number` 参数决定滚动多少。\n\
  14. `nearest ( y )` – 它将 `Listbox` 中可见元素放置为行 `i` 位于小部件顶部。\n\n## Spinbox\n这是通常 Tkinter\
  \ `Entry` 小部件的替代方案，用于选择固定数量的元素。\n\n### Spinbox 的语法\n创建此小部件的简单语法涉及\n\n```python\n\
  W = Spinbox ( master, selection, … )\n```\n\n### Spinbox 的参数\n包含\n1. `master` –\
  \ 代表父窗口。\n2. `options` – 包含此小部件常用的替代方案列表。\n\n\n\n\n\n# 这些选项的详细分析包括第七章 树莓派的硬件接口\n\
  \n该设备设计了硬件接口以确保正常功能。这是一种用于学习的低成本单板计算机设备。树莓派基金会（一个非营利组织）构建了该系统。该设备从树莓派 Zero 到树莓派\
  \ 3 有不同型号，均采用 40 针排针连接器。它们提供了 `GPIO` 引脚的入口以及其他一些功能。该针头提供了 26 个 `GPIO` 引脚，电压为 5 伏和\
  \ 3.3 伏，包括用于 `ID EEPROM` 功能的其他单独引脚。\n\n## GPIO 引脚连接\n\n这 26 个 `GPIO` 引脚可以专门配置为输入引脚或输出引脚。系统使用额定电压\
  \ 3.3 伏。高电压（如 5 伏）对你的设备是有危险。未连接的引脚具有未定义的逻辑电平，但你可以使用上拉或下拉电阻将单独的引脚强制置高或置低电平。这种练习通过外部电阻在硬件中实现，但你也可以将其应用于软件。`GPIO`\
  \ 引脚和 `GPIO3` 引脚在板载上设计有永久上拉电阻。然而，其他 `GPIO` 引脚在软件中配置以提供上拉或下拉电阻。在大多数情况下，它们完全没有电阻。\n\
  \n## 引脚功能\n\n通用输入输出 (`GPIO`) 引脚被配置为提供各种功能，甚至超过了基本的数字输入和输出。所有引脚显示出相似的功能，但某些具有独特的特性和服务。。这些引脚可以帮助程序员使用\
  \ Pi 设计各种项目，如机器人、复古游戏、气象站和其他强大的机器。这些引脚使得电机、灯光、传感器和其他外围设备成为。你可以通过树莓派内部的 `SoC` 将这些引脚连接到你的系统。这将有助于系统与外部组件之间的安全协作。它大约有\
  \ 40 个引脚，较新型号包括 `UART`、`12C` 和 `SPI` 连接。让我们看看树莓派引脚的一些功能。\n\n### 1. GPIO（通用输入输出）引脚\n\
  \n这些是能够发送或接收电流的数字引脚，你可以使用 `Python`、`node-Red`、`Python` 和其他编程语言调节它们的状态。它们的工作电压为 3.3\
  \ 伏，抽取约 16 mA 的电流。这些引脚使用 `SPI`、`UART` 和 `12C` 协议与各种设备接口。`GPIO3` 使用 `SCL` 和 `SDA`\
  \ `12C` 引脚通过 `12C` 协议连接到系统。在使用这些引脚之前，你应该通过使用 `Raspbian` 操作系统配置系统以启用可以与之工作的接口。\n\n\
  ### 2. 12C 引脚\n\n这是一种低速串行协议，通过 `1C` 标准连接设备。这些设备基于主从关系运行。它们通过制造商提供的地址，并使用 Linux 命令（如\
  \ `12C detect`）实现功能。这些引脚通过两个连接工作，如 `SDA` 和 `SCL`，并向 `SDA` 连接发送或从中接收数据，其速度由 `SCL`\
  \ 引脚调节。`12C` 引脚允许你向项目中添加温度传感器、模拟/数字转换器、`OLED` 和 `LCD` 屏幕。\n\n### 通用异步收发传输器 (UART)\
  \ 引脚\n\n这些引脚在无头设置下通过控制台或终端登录发送 `GPIO14` 并接收 `GPIO15`。它连接了没有鼠标或键盘的 PI 设备。这可以通过网络或直接\
  \ USB 连接实现。也可以使用运行终端控制台的计算机通过串口线或 `USB` 转串口板进行调节。此引脚是可靠的，并提供了无需额外工具即可立即使用 Pi 的权利。你必须通过在\
  \ Pi 设备中配置串口控制台来启用此功能。\n\n### 串行设备接口 (SPI) 引脚\n\n这些引脚帮助你将匹配良好的设备连接到你的 Pi。它与 `12C`\
  \ 引脚一样，通过主从关系运行。`SPI` 引脚用于在微控制器与其他组件（如传感器、`SD cards` 和移位寄存器）之间短距离发送信息。数据使用主设备（即\
  \ Pi）`GPIO11` 上的时钟 `SCLK` 进行同步。通过 `MOSI` 引脚从设备传输到 `SPI` 组件，该引脚包括 `GPIO` `GPIO10`。`MOSI`\
  \ 意味着主出从。该组件通过主从出 - `MISO` 引脚 (`GPIO9`) 发回数据来响应 Pi。\n\n### 3.3V 引脚\n\n3V 引脚为你的电子元件提供稳定的电源，并允许你测试\
  \ `LEDs`。你可以通过电阻将 LED 的阳极和长脚连接到 `3.3V` 引脚，而将短脚和阴极连接到 `GND` 引脚。这种连接将使你的灯亮起来，以便你构建项目。\n\
  \n### 接地 (GND) 引脚\n\n这也被称为 `GND` 或 `gnd`。所有电压都从此引脚测量，并完成电路。它指的是零点，并将 LED 连接到电源，使\
  \ `GND` 成为电路系统的一部分。电流可以流过这个 LED 产生光。Pi 设计有通过 `GPIO` 的 8 个 `gnd` 连接到单个地连接。\n\n###\
  \ 5V 引脚\n\n这些引脚允许直接访问来自适配器的 5 伏电源，确保 Pi 所需功率较少。它直接为你的单元供电，并在连接系统之前确保电压稳定适中。`5V`\
  \ 引脚可以绕过保险丝和电压调节器等安全功能。\n\n## 引脚的其他功能包括\n\n1. `GPIO12`、`GPIO13`、`GPIO18`、`GPIO19`\
  \ 引脚支持 Pi 硬件上的脉宽调制 (`PWM`)。任何引脚的软件都可以支持此功能。\n2. `GPIO2` 和 `GPIO3` 引脚支持 `12 C` 接口。\n\
  3. `GPIO14` 和 `GPIO15` 串口接口可以作为控制台。\n4. `GPIO8`、`GPIO7`、`GPIO10`、`GPIO9`、`GPIO11`、`GPIO17`、`GPIO18`、`GPIO1`、`GPIO21`、`GPIO20`\
  \ 提供串行设备接口 (`SPI`) 端口。\n\n## 串口接口引脚\n\n如上所述，串口接口引脚包括 `GPIO8`、`GPIO7`、`GPIO10`、`GPIO9`、`GPIO11`、`GPIO17`、`GPIO18`、`GPIO1`、`GPIO21`\
  \ 和 `GPIO20`。\n\n## 树莓派原型板\n\n原型板用于向 Pi 附加一些电子元件和传感器。树莓派原型板示例包括 `PiBreak Plus`。该板为所有\
  \ `GPIOs` 提供了标记的引脚。它具有带有焊盘和电源排的大原型表面，可安全地连接到电源。此板适用于所有带有 40 针扩展头的树莓派型号，例如树莓派 Model\
  \ A+`、树莓派 Model B+` 和树莓派 Model 2。\n\n## 树莓派原型板的特征包括\n\n1. 它带有一个巨大的原型表面用于连接你的部件。\n\
  2. 板载正反面都有引脚标记。\n3. 它带有螺丝、螺母、垫圈和垫柱，用于正确安装。\n4. 有 3.3 伏和 `GND` 电源轨。\n5. 板采用喷金 (`PCIB`)\
  \ ENIG 工以增加耐用性。\n\n\n\n\n\n# 第八章：主推子器与原型项目\n\n`Pi` 是一台微计算机，也被视为单板计算机 (`SBC`)。它可以在\
  \ Linux 操作系统和其他应用程序上运行。该设备对于各种数字项目非常有用，例如主推子器项目和原型项目。\n\n推子器（fader）是调音台必需的组件。它帮助你通过移动推子器来控制信号源。你可以通过改造键盘和鼠标在项目中使用\
  \ `pushbuttons`。它也可以通过 `gainer`、`Arduino` 和 `MCK` 实现。这为在音频输入和输出中使用推子器提供了一种替代手段。\n\
  \n主推子器提供了高效的采样分辨率和频率，范围从 `16bit` 到 `8-10bit`，包括 `44.1KHz` 到 `1KHz`。\n\n## 主推子器项目要求\n\
  \n主推子器项目的要求包括推子器、软件和焊接。其他包括 `1` 个热缩管、`1` 条双芯、`2` 个 `3.5mm 单声道插头`、剥线器、剪钳、吸锡器、万用表、带夹线和助焊夹。\n\
  \n这些要求仅适用于变阻器类型的推子器，而不适用于光学类型。\n\n现在，推子 (`Fader`) 可以从损坏的调音台和电子元件商店获取。一些本地电子元件商店包括\
  \ `Digi-Key`、`RSin`、`Maplin`、`Tokyu-Hands` 和 `RadioShack`。\n\n## 如何组装硬件\n\n获取带有三个或更多连接器的推子器，并根据推子的布局修改其电阻，它是一种可变电阻。大多数调音台配有光学推子，特别是用于\
  \ `DJ crossfader`。\n\n`2` 个 `3.5mm 单声道插头` 用于音频输入和输出，一条双芯线作为扬声器线。你可以根据选择制作长度。获取 `one`\
  \ 个热缩管用于连接推子器。\n\n获取两对电缆并剥去末端。焊接前检查推子器的连接器。某些推子有三个连接器。两个作为电阻，另一个用于接地引脚。通过万用表改变电阻值，你可以找到合适的连接器。\n\
  \n将推子器焊接到电缆上。两根导线的每侧都应焊接到连接器的每个电阻侧。使用带有一个标记的电阻侧作为一侧。焊接前加上热缩管以使其牢固。\n\n扭转电缆的剪切侧以防膨胀。焊接后用热缩管覆盖连接器。\n\
  \n之后，焊接接地，但要确保电缆的每个剪切侧都扭转以防止膨胀。贴上热缩管。\n\n将插头焊接到每根电缆的最后部分，但安装插头盖。电缆的剪切侧应扭转以防膨胀。焊接后装上插头盖。\n\
  \n使用万用表测量插头之间的电阻。上侧应根据推子的位置修改。`gnd`（下侧）应为零。现在，你有一组开关、一根电缆和两个插头。\n\n连接音频输入和输出以完成完整的硬件。\n\
  \n## 运行软件\n\n在你的树莓派上打开程序的窗口或环境。可以是 `Flash`、`Pure Data`、`MaxMSP` 和 `SuperCollider`。任何可以处理音频输入输出的程序。\n\
  \n你应该为音频输出分配一个音频信号，例如 `10000Hertz` 正弦波。为音频输入设置音量计算器。此项目需要 `Peakamp` 对象。\n\n为计算器添加一个接收器，例如\
  \ `multislider` 对象。\n\n开始音频，移动推子以接收连接。至此，你已准备好在项目中使用推子器。使用正弦波振荡器作为音频输入输出。\n\n##\
  \ 原型项目要求\n\n原型项目的要求包括电源、`555 astable`、二极管、电容和 9 电池。\n\n## 如何组装硬件\n\n第一件事是使用地线连接到电源。这将从电源为电路供电。二极管防止反向，而电容用于平滑电流。可以使用\
  \ 9V 电池。\n\n此设置完成后，`astable 555` 定时器向 `CD4029` 发送脉冲。电容和 `Potentiometer`（电位器）连接到\
  \ `7`、`2` 和 `6` 引脚。这些脉冲来自 `pin 3`。\n\n使用万用表测量插头之间的电阻。上侧应根据推子的位置修改。`gnd`（下侧）应为零。现在，你有了一组开关、一根电缆和两个插头。\n\
  \n连接音频输入和输出以完成完整的硬件。\n\n## 运行软件\n\n在你的树莓派上打开程序的窗口或环境。可以是 `Flash`、`Pure Data`、`MaxMSP`\
  \ 和 `SuperCollider`。任何可以处理音频输入输出的程序。\n\n你应该为音频输出分配一个音频信号，例如 `10000Hertz` 正弦波。为音频输入设置音量计算器。此项目需要\
  \ `Peakamp` 对象。\n\n为计算器添加一个接收器，例如 `multislider` 对象。\n\n开始音频，移动推子以接收连接。至此，你已准备好在项目中使用推子器。使用正弦波振荡器作为音频输入输出。\n\
  \n## 原型项目要求\n\n原型项目的要求包括电源、`555 astable`、`Cd4029 decade counting`、二极管、电容和 9 电池。\n\
  \n## 如何组装硬件\n\n第一件事是使用地线连接到电源。这将从电源为电路供电。二极管防止反向，而电容用于平滑电流。可以使用 9V 电池。\n\n此设置完成后，`astable\
  \ 555` 定时器向 `CD4029` 发送脉冲。电容和 `Potentiometer` 连接到 `7`、`2` 和 `6` 引脚。这些脉冲来自 `pin 3`。\n\
  \n使用万用表测量插头之间的电阻。上侧应根据推子的位置修改。`gnd`（下侧）应为零。现在，你有了一组开关、一根电缆和两个插头。\n\n连接音频输入和输出以完成完整的硬件。\n\
  \n## 运行软件\n\n在你的树莓派上打开程序的窗口或环境。可以是 `Flash`、`Pure Data`、`MaxMSP` 和 `SuperCollider`。任何可以处理音频输入输出的程序。\n\
  \n你应该为音频输出分配一个音频信号，例如 `10000Hertz` 正弦波。为音频输入设置音量计算器。此项目需要 `Peakamp` 对象。\n\n为计算器添加一个接收器，例如\
  \ `multislider` 对象。\n\n开始音频，移动推子以接收连接。至此，你已准备好在项目中使用推子器。使用正弦波振荡器作为音频输入输出。\n\n# 第九章：树莓派项目\n\
