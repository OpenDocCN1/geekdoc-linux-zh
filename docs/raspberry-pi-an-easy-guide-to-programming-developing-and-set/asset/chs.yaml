  \ 3.8.2 | 2020 年 2 月 24 日 |\n\n### 如何运行 Python\n\nPython 是你的 Pi 设备的一种非常棒且有用的语言。在硬件和\
  \ GPIO 引脚上进行安装和运行是非常顺畅的过程。Raspbian 可以运行 Python 程序。\n\n#### 在树莓派上运行 Python 程序的要求\n\
  \n在你的设备上运行 Python 程序的要求包括\n\n1. HDMI 显示器或电视机。\n2. 树莓派设备。\n3. 鼠标和键盘。\n4. 存储在 SD 卡上的\
  \ Raspbian 操作系统。\n\n\n\n\n\n# 关于 Python 库的详细信息\n\nPython 程序在 Raspbian 上运行之前可能需要外部库。因此，你需要使用\
  \ `PIP` 安装额外的库，`PIP` 只能为终端窗口中的程序安装库。`PIP` 是 Python 的包或模块管理器。这样做的一个良好理由是，Python IDE\
  \ 程序自带了本地副本的 Python。建议使用终端窗口运行程序，因为它可以与使用首选安装程序（`PIP`）安装的外部库协同工作。然而，`PIP` 在 3.4\
  \ 或更高版本的 Python 软件包中已默认内置。\n\nPython 程序可以通过终端、IDE 或 Thonny 进行安装。\n\n## 使用终端运行 Python\
  \ 程序\n\nPython 程序也可以通过终端窗口运行。但在打开终端之前，你应该了解程序所在的路径。你可以按照以下方法找到程序：\n\n进入 `Documents`\
  \ > `Python` > `Main.py`。此后，打开窗口并应用 `cd` 命令。这可以帮助你将工作目录更改到另一个包含 Python 程序的目录，例如：`cd\
  \ Documents/Python`。\n\n假设你想检查你的 Python 程序是否在该目录中。你可以使用命令 `dir`。这将列出该目录下的所有文件和文件夹。如果应用程序未包含在存档中，你必须返回并找到程序在目录中的位置。\n\
  \n现在，让我们使用 Python 命令并执行此 Python 程序。它将运行命令后指定的 Python 文件。例如：\n`Python yourfilename.py`\n\
  \n另一种方法是检查你的文件名是否有空格，例如：`Python your File name.py`。\n\n## 通过 IDE 运行 Python 程序\n\n\
  你的树莓派操作系统带了几个对编程非常有用的 IDE。Raspbian 的 IDE 之一是原始的 Python IDE。你可以通过打开 Raspbian 图标打开它。然后，滚动到\
  \ Programming（编程）并点击 `Python 3 (IDLE)`。\n\n加载 IDE 后，点击 `File` > `Open`。如果文件打开，导航到\
  \ Python 程序。然后，运行程序。只需点击 Run 按钮并点击 `Run Module`。另一种方法是使用键盘并按下 `F5`。\n\n## 使用 Thonny\
  \ 运行 Python 程序\n\n另一个具有许多功能的必要 Python IDE 是 Thonny。通过这个调试器，你可以观察变量并单步执行代码。它也可以通过以下方法运行\
  \ Python 程序：\n\n导航到 Raspbian 图标并点击它。向下滚动找到 Programming 并点击 `Thonny Python IDE`。\n\
  \n在此过程之后，点击 `File` 菜单。找到并点击 `Open` 按钮并滚动到程序。如果程序已下载，点击 `Run` 按钮运行当前文件。\n\n## Python\
  \ Shell\n\n它解释 Python 语言并用于按顺序执行代码。Python shell 也被称为 Python 交互式 shell，用于执行单条 Python\
  \ 命令并获取结果。\n\nPython shell 从用户处获取命令。如果程序员输入提示符，程序将执行它并显示结果。\n\n如果你正在使用 Windows，通过输入\
  \ `Python` 打开 Python shell。然后，按 `Enter`。此后，你将看到三个大于符号（`>>>`）。输入单个语句，如果你输入如 `5 +\
  \ 3` 的表达式并按 `Enter`，结果就会出现。结果将显示在下方的另一行。\n\n### 使用 Python Shell 执行 Python 脚本\n\n\
  Python shell 用于执行单条语句。然而，运行多个语句需要你使用扩展名为 `.py` 的创建一个 Python 文件。然后，在各种语句中编写 Python\
  \ 脚本。\n\n处理此问题的另一种方法是使用记事本和如下语句：\n```\nlookatPythonScript.py\nprint – \"Look at\
  \ Python Script.\"\nprint – \"Receive Python lessons from the Teacher.\"\n```\n\
  你可以将其保存为 `myPythonScript.py`。然后，导航到命令行并滚动到文件夹保存此文件。此过程可以帮助你应用 Python `lookatPythonScript.py`\
  \ 命令。Python Shell 可执行 Python 语言和命令。\n\n## 循环\n\n在任何编程语言中，程序的流默认都是顺序的。在大多数情况下，你可以更改程序的顺序。但是，特定的代码可以重复执行。编程语言提供了几种类型的循环，可以多次重复某些特定代码。\n\
  \n### 在 Python 中使用循环的原因\n\n使用循环的原因之一是它有助于简化复杂问题。Python 循环允许你更改或修改程序的顺序。通过这种方式，你不需要无数次地编写特定的代码，而是可以重复预定或固定的次数。\n\
  \n在这种情况下，为了打印十次数字，不需要应用十 `print` 语句。只需在循环内部打印即可。循环可以运行十次重复或迭代。\n\n### 使用 Python\
  \ 循环的优势\n\n在 Python 程序中使用循环具有各种益处，例如：\n\n*   循环帮助程序员重用代码。\n*   如果你使用 Python 循环，你就不需要无数次地编写特定代码。\n\
  *   Python 循环允许用户遍历数据结构（如链表或数组）的元素。\n\n### Python 程序中不同的循环语句\n\n| 序号 | Python 循环语句\
  \ | 代码描述 |\n| :--- | :--- | :--- |\n| 1. | 后测试循环或 Do-while 循环。 | 在达到特定顺序之前，do-while\
  \ 循环将继续。在编程语言中，它被称为后测试循环。该语句适用于你可以至少执行一次函数的情况。此外，它也用于菜单驱动的程序。 |\n| 2. | 前测试循环或 While\
  \ 循环 | 在预先不知道重复或迭代次数的情况下，可以在该场景应用 while 循环。在 while 循环中，执行一个表达式块，直到满足指定的条件。这种类型的循环被称为前测试循环。\
  \ |\n| 3. | 前测试循环或 For 循环 | 前测试循环用于执行循环的一部分，直到满足特定条件。这也被称为“for 循环”。在预先确定重复或迭代的情况下的情况下这种循环语句是正确的选择。\
  \ |\n\n## IDLE 和编辑器\n\n在 Python 语言中，IDLE 或 IDE 意味着集成开发环境。你也可以将其称为 Python IDLE 编辑器。初学者在使用此工具编程，直到他们获得更多经验。专业程序员使用\
  \ Komodo 或 Eclipse，它们比 IDLE 更可靠、更好。Python IDLE 是用于开发 Python 程序的 GUI。在安装 Python 时，GUI\
  \ 可以自动安装。在简单的 GUI 环境中，它可以帮助你运行、调试和编辑 Python 程序。IDE 自动化了 SDLC 中的编译、编辑和测试过程。IDLE 使用标准库中的\
  \ Tkinter GUI 工具包构建其窗口。它是一种可以在多个平台（如 Mac、Linux、Windows 操作系统等）上运行的多功能软件。\n\n\n\n\
  1.  它作为一个集成调试器工作。\n2.  IDLE 有助于语法高亮和命令历史。\n3.  此功能支持多窗口。\n4.  适用于 Python 代码的取消缩进或自动缩进。\n\
  5.  单词自动补全过程。\n\n\n\n\n\n在 Microsoft word 中，例如 windows 7 或 windows 8，`Python IDLE`\
  \ 运行非常有效。你可以在 Windows 7 的开始菜单中看到它，作为一个项目。在 Windows 8 中，进入开始菜单并输入 `IDLE`。这可以帮助你在系统中运行它。它会立即显示设备上的操作系统详细信息和\
  \ Python 版本。代码应该写在你的窗口中提示符 `>>>` 之后。按下回车键后，程序将开始执行。单行命令通过 shell 窗口执行。但这不适用于编写完整的程序。\n\
  \n`Python IDLE` 拥有一个内置的文本编辑器。它对于编写和保存你的代码非常有用。如果你点击 `File > New File`，编辑器就会开始工作。此命令会打开一个用于输入代码的窗口。但在运行之前将此代码保存到框文件中是理想的。只需点击\
  \ `File`，然后点击 `Save`。然而，请确保数据具有 `.py` 扩展名。运行代码需要点击 `Run` 按钮。这将带你进入 `Run Module`。你可以直接按\
  \ `F5`。该程序的结果将打印在带有 `IDLE` 字样的窗口上。结果将显示在 `Restart` 行下方。\n\n## Python IDE 的类型\n软件开发中使用的不同类型的\
  \ Python IDE 有 Atom、Thonny、Eric、Rode、Spyder、PyCharm、Wing、Microsoft Visual Studio、Jupyter\
  \ Notebook 和 PyDev。\n\n### Atom IDE\n`Atom IDE` 由 GitHub 构建，是一个开源跨平台工具。该框架使用 `electron`\
  \ 来增强跨平台桌面应用程序。该平台结合 `Node.js` 和 `Chromium` 运行，目前被称为可黑客化的文本编辑器。\n\n此集成开发环境的特性包括：\n\
  1. 在 Atom 上查看输出不需要打开另一个窗口。\n2. Atom 具有内置支持，可以使用名为 `Markdown Preview Plus` 的插件来查看和编辑\
  \ `Markdown` 文件。\n\n### Thonny IDE\n学习或教授编程语言需要你使用 `Thonny IDE`。该软件由塔尔图大学构建构建构建。它对于高亮语法错误和支持代码补全过程有用。此\
  \ IDE 的一些功能包括：\n1. 有用的代码自动补全和错误高亮。\n2. 它作为一个简单的调试器使用。\n\n### Eric IDE\n`Eric IDE`\
  \ 是由 Python 开发的一个编辑器程序。对于专业程序员和业余爱好者来说非常有价值。该软件的功能包括：\n1. 带有内置调试器的任务管理支持。\n2. 具有源代码折叠、编辑器和可配置的窗口布局。\n\
  3. `Eric` 用于版本控制和高级项目管理。\n\n### Rodeo IDE\n使用 `Rodeo Integrated Development Environment`\
  \ 可以从各种源检索数据和信息。它被认为是程序的理想 IDE。该软件用于代码的自动补全，并支持跨平台功能。该程序的特性包括：\n1. 语法高亮、代码自动补全和可视化文件导航。\n\
  2. 增强你绘图、交互、检查和比较数据的技能。\n\n### Spyder IDE\n`Spyder` 是数据科学的理想选择，开源且在 IDE 市场上具有很高的知名度。这意味着科学\
  \ Python 开发环境 (Spyder)。该程序接受并运行所有相关平台，如 `MacOS X`、`Windows` 和 Linux 操作系统。`Spyder\
  \ IDE` 提供多种功能，如文档查看器、集成控制台、本地代码编辑器和变量资源器。此 IDE 还支持其他科学模块，如 `SciPy`、`NumPy` 等。该程序的各种特性包括：\n\
  1. 与 `IPython` 控制台安全集成。\n2. 在代码自动补全模式和多语言编辑器中正常运行。\n3. 它提供了带有语法高亮功能的更好的代码自动补全。\n\
  \n### PyCharm IDE\n`PyCharm` 由 JetBrains 构建，一种用于跨平台的集成开发环境 (IDE) Python 软件。此 IDE\
  \ 提供免费版和付费 (PRO) 版本，它是使用最广泛的开源程序。它帮助开发者和程序员处理常规任务。`PyCharm` 是一个完整的 IDE，具有快速错误检查和纠正、数据库访问、代码自动补全、快速项目导航和远程开发支持。该程序的特性包括：\n\
  1. 它有助于高亮错误。\n2. 增强了 Python Web 开发框架，如 `Javascript`、`Angular JS` 等。\n3. `PyCharm`\
  \ 作为一个强大的调试器运行。\n4. 它对于智能代码导航非常有价值。\n\n### Wing IDE\n`Wing IDE` 包含了体面且必要的开发支持功能。这个跨平台工具为初学者提供免费版，尽管它有一个带有\
  \ 30 天试用期的 Pro 版本。这将使学习者和经验丰富的程序员尝试它。此 IDE 程序提供调试、自动补全、语法高亮和缩进等服务。`Wing IDE` 的主要特性是：\n\
  1. wing 可以通过扩展进行自定义。\n2. 此 IDE 增强了远程开发和测试驱动开发以及单元测试。\n\n### Microsoft Visual Studio\
  \ IDE\n现在，你可以使用 `Microsoft Visual Studio` 开发和调试最新的云或 Web 项目。它是一个带有扩展市场的开源代码编辑器。其特性包括：\n\
  1. 对于在 `Visual studio` 中编写程序非常有价值。\n2. 可以在免费版和 PRO 版本中找到。\n\n### Jupyter Notebook\
  \ IDE\n在数据科学行业，`Jupyter Notebook` 是一个常用的 `IPython` 笔记本编辑器。你可以用它制作和操作笔记本文档。由于 Python\
  \ 是一种解释型语言，此网络资源基于服务器-客户端结构。此 IDE 的一些特性包括：\n1. `Jupyter Notebook` 对于数据科学初学者来说是必要且合适的。\n\
  2. 它对 `markdowns` 非常有用。\n3. 此 IDE 对于创建和编辑代码非常有价值。\n\n### PyDev IDE\n`PyDev IDE`\
  \ 是 `Eclipse` 的外部插件，也是 Python 中常用的程序。如果你有 `Java` 经验，它通常是具有此类背景的 Python 开发者的自然选择。大多数程序员将其视为\
  \ Python 解释器。在 2003 年和 2004 年，Aleksander Totic 因对 Mosaic 浏览器的贡献闻名。在此期间他还参与了 `Pydev`\
  \ 项目。它是 `Django`、代码自动补全、块缩进和智能缩进的集成。此 IDE 的特性包括：\n1. `PyDev` 支持 black 格式化程序、`Mypy`\
  \ 和虚拟环境。\n2. 它具有可靠的参数，如调试、代码平均功能、代码分析和重构。\n3. 它适用于单元测试集成、`PyLint` 集成和远程调试器。\n\n\n\
  \n\n# 数字与变量\n\nPython 中的数字和变量指的是数值变量。\n\n## Python 数字\n在 `Python` 中，数字以浮点值、整数和复数的形式存储。这取决于取决于程序的需求。共有两种类型：浮点值和整数。\n\
  \n## Python 变量\n变量指的是系统内存中的位置，并被用作用于存储值的标识符。`Python` 是一种推断语言，不需要指定变量的类型。\n变量是字母和数字（数字）的组合。然而，它们以字母或下划线（`_`）开头。在编写变量时，可以使用小写字母命名变量，例如\
  \ `John` 和 `john` 是两个不同的变量。\n\n## 数值变量类型\n有两种数值变量可用。\n\n### 整数\n整数是由整数组成的数值，如 `1`、`2`、`3`、`10`、`20`、`100`、`2000`、`50,000`、`1000000`、`10,000,000`\
  \ 等。你通过编写任何整数整数在 `Python` 中应用此变量，如上所示。\n\n#### 示例\n表达式 `x = 2` 意味着整数 `2` 将存储在变量\
  \ `x` 中。`x` 是变量，`2` 是数字，因此标签为“数值变量”。如果你使用的是 64 位系统，你可以在 Python 平台的整数变量中存储于 `4000338912344092341`\
  \ 和 `4000338912344092340` 之间的整数。\n\n### 浮点值\n浮点值是带有小数点的 Python 数字。任何带有小数部分的数字都会被识别为浮点值。\n\
  因此，诸如 `x = 6.5` 的术语意味着浮点值 `(6.5)` 存储在变量 `x` 中。此外，可以通过这种方式存储巨大的数字，例如 `3.2250738585072015\
  \ × 10308` 到 `2.7976931348623157 × 10308`。\n可以使用 `float` 数字功能将整数转换为浮点数。例如：\n\n```python\n\
  X = 6\nprint(x)\nprint(float(x))\n```\n\n如果执行此表达式，代码可以产生如下输出：\n```\n5.0\n```\n\n\
  然而，你可以通过整数数字功能将浮点值转换为整数。看看除两个整数会发生什么：\n\n```python\nx = 5\ny = 2\nz = x / y\nprint(z)\n\
  ```\n输出：`2.5`\n\n在上面的表达式中，数值（数字）被定义为整数（整数）。此操作的结果是一个浮点数。这是 `Python 3.x` 的特性——`Python\
  \ 2.x` 会执行整数除法并返回结果 `2`。\n\n## 用于标识符命名的变量\n变量用于标识符命名。程序员使用它来标识程序中的字面量。以下是在表达式中命名标识符的各种方式：\n\
  \n1. 标识符名称中不应有空格和特殊字符。此类字符示例包括 `#`、`^`、`%`、=`、`!`、`&` 等。\n2. 在 `Python` 中，标识符名称对大小写敏感。这意味着\
  \ `'my book'` 和 `'MyBook'` 不是同一个表达式。\n3. 语句中有效的标识符包括 `n_9`、`_n`、`a123` 等。\n4. 语句中无效的标识符包括\
  \ `n 9`、`n%4`、`1a` 等。\n5. 标识符的名称必须与语言中表示的关键字相似。\n6. 变量必须以下划线（`_`）或字母开头。\n7. 在 `Python`\
  \ 语句中，除第一个字符外的每个字母都可以是大写字母，如 `A`、`B`、`C`、`D`……，或小写字母如 `a`、`b`、`c`、`d`。也可以是数字如 `1`、`2`、`3`、`4`……或下划线（`_`）。\n\
  \n## 如何声明变量和赋值\n你不需要在程序中使用变量之前对其进行声明。`Python` 允许你在表达式需要变量时及时创建变量。\n通过为变量赋值来立即且自动地定义和声明变量。在语句中使用符号（=`）“等于”来声明变量。此标记将值分配给变量。\n\
  \n## 如何在 Python 中引用对象\n作为程序员，你需要理解如何在 `Python` 中引用对象。这定义了在你声明变量时 `Python` 解释器运行的方式。处理变量的方式与其他编程语言不同。\n\
  有经验的程序员理解 `Python` 是一种高度面向对象的编程语言。因此，所有数据项都属于特定类型的类。例如：\n\n```python\nprint(\"James\"\
  )\n```\n输出：`James`\n\n整数由 Python 对象创建并将其显示在控制台上。我在上面的 `print` 语句中创建了一个字符串对象。确定此点的另一种方法是使用内置的\
  \ `type()` 功能。例如：\n\n```python\ntype(\"James\")\n```\n输出：`<class 'str'>`\n\n在 `Python`\
  \ 程序中，变量被分类为语句中指向对象的指针或引用的符号名称。变量用于为对象命名。例如：\n\n```python\nb = 20\n```\n`b` 是对象。\n\
  \n\n\n\n\n在此方法中，第一个单词的首字母大写。例如是 `NameOfLearner`。\n\n# 如何创建多个赋值\n\n在 Python 程序中，你可以在一条语句中为多个变量赋值。这被视为多次赋值。这些可以通过两种方式实现，例如将单个值赋给多个变量，以及将多个值传递给多个变量。以下是几个示例：\n\
  \n### 将单个因子赋值给多个变量\n\n| `a=b=c=30`<br>`print(a)`<br>`print(b)`<br>`print(c)` |\n\
  输出: | 303030\n\n### 将多个因子赋值给多个变量\n\n| `x,y,z=20,25,30`<br>`print x`<br>`print y`<br>`print\
  \ z` |\n输出: | 202530\n\n---\n\n在 Python 程序中，值按照变量在语句中出现的顺序和方式进行赋值。初学者应该注意的一些 Python\
  \ 基础知识包括注释以及程序中不同类型的标记（tokens）。标记是保留字、标点符号和其他词汇形式的表达式。特定程序中字母的最小单位被称为标记。编程语言中的标记示例包括标识符、字面量、运算符和关键字。\n\
  \n# 模拟骰子\n\n![Example of a Simulating Dice.png](img/Image00016.jpg)\n\n## 模拟骰子的示例\n\
  \n本节旨在面向 Python 初学者，教他们如何制作一个常见的骰子模拟器。你还将学习如何重复掷骰子。通过本课程，你将学习设置骰子最小值和最大值的方法。以下是处理模拟骰子需要遵循的一些关键步骤。\n\
  \n### 输出 1 到 6 之间的随机数字\n\n首先，编写一个输出 1 到 6 之间任意整数的主程序是很好的。这是一个简单的掷骰子。可以使用 Python\
  \ 的内置库来实现。通过该库，你还可以使用 `randint()` 特性生成随机变量。\n\n程序开头有一行随机数导入代码，用于使用和导入 `random` 库。如果不导入，你就无法使用该集合。因此，在继续之前，请从程序开始导入此库。\n\
  \n接下来是设置随机数字的最小值 1 和最大值 6。最小最大值将存储在这些变量中。如果你添加了代码，可以修改这些值。\n\n使用库中的 `randint()`\
  \ 功能生成随机变量非常简单。最小和最大值成为 `randint()` 方法在随机生成值时使用的参数。它将产生一个最小和最大值之间的随机数字。\n\n# 如何初始安装应用程序\n\
  \n现在，每当你运行程序时，代码都会打印一个 1 到 6 之间的随机变量。这意味着如果你运行应用程序五次，输出可能如下：\n\n| 53611 |\n\n\n\n\
  \n然而，不要忘记每次运行时都是随机的输出。如果你运行代码，输出将会有所不同。在运行程序之前，请确保你将字母保存为 `dice_roll.py`。然后，进入终端并使用此命令：`python3\
  \ dice_roll.py`。这将帮助你在编程区域安装该软件。每当你安装该程序时，按下向上方向键并进入终端。如果你想获得如所示的输出，你必须运行程序五次。\n\
  \n## 请求用户再次掷骰子\n你可以通过 `input()` 函数获取用户的输入。在这个阶段，用户将收到此提示：“想再次掷骰子吗？”此处预期的答案是 'yes'。如果不是，则应该是\
  \ 'no'。\n\n用户的输入将存储在一个变量中。这个答案可以帮助你获取他的信息支持，该信息为 'y' 或 yes。如果你想要该数据的其他变体，可以寻求更多帮助来实现。\n\
  \n`while` 循环在变量评估为真（true）时运行。程序用户将再次调用此变量。你首先将 `back` 的值固定为 `true`。通过这样，你可以拥有一个具有该设置的\
  \ `while` 循环。你可以在 `while` 循环内部向显示器发布随机掷骰子的结果。现在，你可以请求用户再次掷骰子。这有助于你在程序员不想重复掷骰子时，将\
  \ `again` 的值更改为“非真”。\n\n你甚至可以使用 `if` 语句判断输入是否为 'y' 或 'yes'。如果此表达式为真，那么 `again` 必须为\
  \ `True`。如果无效，你应该将 `again` 更改为 `False`。记住，此程序的代码是 `dice_roll.py`。\n\n## 第二次运行程序\n\
  使用命令：`python3 dice_roll.py`，你将第二次操作游戏。你会立即得到一个命中或缺失的骰子结果。你将被询问是否想要第二次掷骰子。如果你输入 'y'，你将获得第二次掷骰子。但如果你输入\
  \ 'No' 或其他 'y' 或 yes 的文本，程序将退出或结束。\n\n## 请求骰子的最小值和最大值\n请求骰子的最小值和最大值是改进程序的方法。骰子有很多面。甚至有些骰子可能有\
  \ 120 个面。使用具有许多面的骰子模拟掷骰子，你可以输入骰子的最小和最大数字。\n\n有些骰子可以有像 1 这样的小数字。但你可以请求最小最大值以使程序通用。在代码开始处，你可以请求用户输入。然后，在继续之前你可以将数据转换为整数。\n\
  \n### 输入无效输入会发生什么？\n当用户输入无效输入（非数字）时，程序将退出或结束。随后会出现一个 `Traceback` 错误。例如，有人输入了 'hi'\
  \ 等文本而不是最小值。`input` 函数无法将单词 'hi' 转换为整数。它只会抛出错误并退出程序。\n\n## 改进对输入的处理\n进行第二次掷骰子有助于你改进输入。你只需要添加输入\
  \ 'y' 或 'yes'，这是可接受的单词。在检查输入之前，可以将此数据转换为小写。这样，你将拥有 'YES'、'Y' 或 Yes，这些在程序中都是有效的。\n\
  \n在不想更改 `again` 变量的情况下，请使用 `break` 或 `continue` 命令。这允许你继续进入第二次迭代或打破循环。当用户处理第二次掷骰子时，你可以使用\
  \ `continue` 命令进入第二次迭代循环。如果程序员或用户不想再次掷骰子，则执行 `break` 命令。这将导致程序结束，因为它将退出循环。\n\n##\
  \ 如何使用 Try 和 Except 方法改进错误处理\n在程序开始时，用户可能会输入无效的最小值或最大值。这将导致应用程序显示错误并退出。可以使用此方法处理错误。你可以输出“输入无效，程序将恢复到默认程序”。然后，你应该将最小值和最大值设置为默认的\
  \ 1 和 6。\n\n玩家将被要求在 `try` 块内输入低值和高值。这些值中的任何一个显示错误将不会执行该代码块。在 `except` 代码块中将有一个 `print`\
  \ 语句。这将作为一个自定义错误消息出现，可以帮助你将骰子的最小和最大值设置为默认值一和六。\n\n此功能可以帮助你稍微改进代码的错误处理。你可以通过这些代码块为处理错误添加更多支持。\n\
  \n制作骰子模拟器有很多方法。这取决于你选择类型以及你作为程序员的经验。但你可以添加一些内容来增强你的体验。增加对输入的支持并使用 GUI 可以提高你在 Python\
  \ 中处理骰子模拟器的专业知识。\n\n# 第三章：什么是字典、列表和字符串？\nPython 中有一些内置结构。这些包括字典、列表、字符串和其他结构。\n\n\
  ### 字典\nPython 中的字典用于以键值对格式存储数据。它们是 Python 中可以模拟现实世界数据安排的数据类型。在这种情况下，某些特定键存在某些特殊值。这种数据结构是可变的。但字典是以值和元素键表示的。\n\
  \n### 值\n在 Python 中，值表示列表、整数、元组等。\n\n### 元素键\n元素键被定义为单个元素键。\n\n字典是键值对的集合，可以是任何 Python\
  \ 对象。但键是不可变的。\n\n### 如何创建字典\n你可以使用用大括号 `{}` 包围的键值对创建字典。字典中的每个键使用冒号 (:) 与数字分隔。以下是定义字典的语法：\n\
  \n```python\nDict = {\"Name\": \"John\", \"Age\": 30}\n```\n\n在这个表达式中，你将看到字典；`Name`\
  \ 和 `Age` 是字符串。创建一个字典并打印它的内容。看这个示例：\n\n```python\nEmployee = {\"Name\": \"Thompson\"\
  , \"Age\": 40, \"salary\": 35000, \"Company\": \"GOOGLE\"}\nprint(type(Employee))\n\
  print(\"printing data ... \")\nprint(Employee)\n```\n\n**输出：**\n```\n<class 'dict'>\n\
  printing data ...\n{'Name': 'Thompson', 'Age': 40, 'salary': 35000, 'Company': 'GOOGLE'}\n\
  ```\n\nPython 提供内置的 `dict()` 方法。此功能用于创建字典。没有值或对象的大括号 `{}` 用于生成空字典。\n\n```python\n\
  ## 创建空字典\nDict = {}\nprint(\"Empty Dictionary: \")\nprint(Dict)\n\n## 使用 dict()\
  \ 创建字典\nDict = dict({1: 'Java', 2: 'T', 3: 'Point'})\nprint(\"\\nCreate Dictionary\
  \ using dict(): \")\nprint(Dict)\n\n# 每个项目作为一个对的字典\nDict = ([(1, 'Devansh'), (2,\
  \ 'Sharma')])\nprint(\"\\nDictionary with each item as a pair: \")\nprint(Dict)\n\
  ```\n\n**输出：**\n```\nEmpty Dictionary:{}\nCreate Dictionary using dict(): {1: 'Java',\
  \ 2: 'T', 3: 'Point'}\nDictionary with each item as a pair: [(1, 'Devansh'), (2,\
  \ 'Sharma')]\n```\n\n### 如何访问字典的值\n在本章前面的部分，我们讨论了使用索引功能访问列表和元组的方法。但你可以使用键访问字典的值，因为这些键在\
  \ Python 字典中是独特的。通过以下步骤访问词汇的值：\n\n```python\nEmployee = {\"Name\": \"James\", \"\
  Age\": 25, \"salary\": 28000, \"Company\": \"GOOGLE\"}\nprint(type(Employee))\n\
  print(\"printing data ....\")\nprint(\"Name : %s\" % Employee[\"Name\"])\nprint(\"\
  Age : %d\" % Employee[\"Age\"])\nprint(\"Salary : %d\" % Employee[\"salary\"])\n\
  print(\"Company : %s\" % Employee[\"Company\"])\n```\n\n**输出：**\n```\n<class 'dict'>\n\
  printing data ....\nName : James\nAge : 25\nSalary : 28000\nCompany : GOOGLE\n```\n\
  \n\n\n在 Python 中，你会发现一种使用 `get()` 方法访问字典值的替代方法。你将得到的结果与使用索引访问的输出相似。\n\n## 如何添加字典值\n\
  正如我之前提到的，字典是一个可变数据类型。你可以使用特定的键来更新它的值。通过键 `Dict[key] = value` 值会随之更新。现有的值可以使用 `update()`\
  \ 方法进行更新。此功能允许你更新字典中存在的键值对。它也有助于更新字典中新添加的键。\n\n以下是如何更新字典值的示例。\n\n```python\n## 创建一个空字典\n\
  Dict = {}\nprint(“Empty Dictionary: “)\nprint(Dict)\n\n## 如何顺序向字典中添加元素\nDict[0]\
  \ = ‘Paul’\nDict [2] = ‘John’\nDict [3] = ‘Richard’\nprint(\"\\nDictionary after\
  \ adding 3 elements: “)\nprint(Dict)\n\n## 如何通过单个键添加一组值\n# The ['Emp_ages'] = 20,\
  \ 33, 24\nprint(\"\\nDictionary after adding 3 elements: “)\nprint(Dict)\n\n## 更新现有键的值\n\
  Dict[3] = ‘JavaTpoint’\nprint(\"\\nUpdated key value: “)\nprint(Dict)\n```\n\n**输出:**\n\
  ```text\nEmpty Dictionary:{}\nDictionary after adding 3 elements:{0: ‘Paul’, 2:\
  \ ‘John’, 3: ‘Richard’}\nDictionary after adding 3 elements:{0: ‘Paul’, 2: ‘John’,\
  \ 3: ‘Richard’, ‘Emp_ages’ : (20, 33, 24)}\nUpdated key value:{0: ‘Paul’, 2: ‘John’,\
  \ 3: ‘JavaTpoint’, ‘Emp_ages’ : (20, 33, 24)}\n```\n\n## 如何使用 del 关键字删除元素\n你可以使用\
  \ `del` 关键字快速删除字典中的项，例如例所示。\n\n```python\nEmployee = {\"Name\": \"James\", \"Age\"\
  : 25, \"salary\":35000, \" Company\":\" GOOGLE\"}\nprint(type(Employee))\nprint(\"\
  printing Employee data ….\")\nprint(Employee)\nprint(\"Deleting some of the employee\
  \ data\")\ndel Employee[\"Name\"]\ndel Employee[\"Company\"]\nprint(\"printing the\
  \ modified information \")\nprint(Employee)\nprint(\"Deleting the dictionary: Employee\"\
  )\ndel Employee\nprint(\"Lets try to print it again \")\nprint(Employee)\n```\n\n\
  **输出:**\n```text\n<class ‘dict’> …..Printing Employee data ….{{'Name’ : ‘James’,\
  \ ‘Age’ : 25, ‘salary’ : 25000, ‘Company’ : ‘GOOGLE’}\nDeleting some of the employee\
  \ data\nprinting the modified information{'Age’ : 25, ‘salary’ : 25000}\nDeleting\
  \ the dictionary: Employee\nLet's try to print it again\nNameError: name 'Employee'\
  \ is not defined\n```\n\n上面的打印语句出现错误，是因为被请求打印的 `Employee` 字典已经被删除了。\n\n另一种方法是通过\
  \ `pop()` 方法。该方法接受键作为参数。它还会像示例所示移除相关的值：\n\n```python\n## 创建字典\nDict = {1: ‘JavaTpoint’,\
  \ 2: ‘Paul’, 3: ‘Thompson’}\n### 使用 pop( ) 方法删除键\nPop_ele = Dict.pop(3)\nprint(Dict)\n\
  ```\n\n**输出:**\n```text\n{1: 'JavaTpoint', 2: 'Paul'}\n```\n\n在 Python 中，有内置方法如\
  \ `popitem()` 方法和 `clear()` 方法用于从字典移除移除。`popitem()` 方法从字典中移除任意元素。此外，`clear()` 功能移除整个\
  \ Python 字典中的所有元素。\n\n## 如何遍历字典\n你可以使用循环来遍历字典。查看示例：\n\n```python\n### 使用 for 循环打印字典的所有键\n\
  Employee = {“Name”,: “James”, “Age”: 29, “salary”: 25000, “Company”: “GOOGLE”\n\
  ```\n\n**输出:**\n```text\nNameAgeSalaryCompany\n```\n\n## 字典键的属性或特性\n在 Python 字典中，同一个键不能存储多个值。在给单个键分配多个值的情况下，最后分配给该键的值将成为该键的值。例如：\n\
  \n```python\nEmployee = {“Name”:”James”, “Age”:30, “salary”:35000\\. \"Company\"\
  :\" GOOGLE\",\" Name\":\" James\"}\nfor x,y in Empoyee.items ( ):\nprint(x,y)\n\
  ```\n\n**输出:**\n```text\nName James\nAge 30\nSalary 35000\nCompany GOOGLE\n```\n\
  \n第二种情况是键不是可变对象。字符串、元组和数字可以组成键。然而，列表被视为可变对象，不适合作为字典的键。例如：\n\n```python\nEmployee\
  \ = {“Name”: “John”, “Age”: 29, “salary” 35000, “Company””GOOGLE”, [100,201,301]:”Department\
  \ ID”}\nfor x,y in Employee.items ( ):\nprint(x,y)\n```\n\n**输出:**\n```text\nTraceback\
  \ (most recent call last):\n  File “dictionary.py”, line 1, in <module>\n  Employee\
  \ = {“Name”: “James” , “Age”: 30, “salary”:25000, “Company”: “GOOGLE”, [100,201,301]:”Department\
  \ ID”}\nTypeError: unhashable type: ‘list’\n```\n\n内置字典的方法和函数包括：\n\n### 字典方法\n1.\
  \ `copy()`: 返回字典的浅拷贝。\n2. `get(key, default=\"None\")`: 用于获取指定的键。\n3. `clear()`:\
  \ 用于删除字典的所有项。\n4. `fromkeys(iterable, value=None)`: 从迭代对象创建新字典。\n5. `keys()`: 返回字典的所有键。\n\
  6. `items()` 以元组形式返回键值对。\n7. `has_key(key)`: 如果字典拥有该键则返回真。\n8. `values()`: 返回字典的所有值。\n\
  9. `update(dict2)`: 通过添加 `dict2` 更新字典。\n10. `setdefault(key, default=\"None\")`:\
  \ 如果键不存在则设置。\n11. `index()`:（不是标准字典方法）。\n12. `len()`: 返回字典的长度。\n13. `count()`:（不是标准字典方法）。\n\
  14. `pop()`: 指定的键。\n15. `popitem()`: 移除任意元素。\n\n### 字典函数\n1. `len(dict)`: 用于估计字典的长度。\n\
  2. `type(variable)`: 用于打印变量类型。\n3. `cmp(dict1, dict2)`: 用于比较两个字典的项。\n4. `str(dict)`:\
  \ 将字典转换为可打印的序列。\n\n\n\n\n\n## 字符串索引与切片基础\n\n```python\nstr[0] = ‘H’\nstr[1] = ‘E’\n\
  str[2] = ‘L’\nstr[3] = ‘L’\nstr[4] = ‘O’\n```\n\n现在，你也可以检查下面的示例。\n\n```python\n\
  Str = “HELLO”\nprint(str[0])\nprint(str[1])\nprint(str[2])\nprint(str[3])\nprint(str[4])\n\
  ### 这会返回 indexError，因为第 6 个索引不存在\nprint(str[6])\n```\n\n**输出：**\n```\nHELLO\nIndexError:\
  \ string index is out of normal range\n```\n---\n\n如上面的示例所示，可以使用切片运算符 `[]` 访问字符串的单个字符。同时，在\
  \ Python 中可以使用冒号运算符 `:` 获取子字符串。看这个示例：\n\n```python\nStr = \"HELLO\"\n```\n\n| H\
  \ | E | L | L | O |\n|---|---|---|---|---|\n| 0 | 1 | 2 | 3 | 4 |\n\n```python\n\
  str[0] = ‘H’          str[:] = ‘HELLO’\nstr[1] = ‘E’          str[0:] = ‘HELLO’\n\
  str[2] = ‘L’          str[:5] = ‘HELLO’\nstr[3] = ‘L’          str[:3] = ‘HEL’\n\
  str[4] = ‘O’          str[0:2] = ‘HE’\n                      str[1:4] = ‘ELL’\n\
  ```\n\n在这些示例中，你可以看到切片运算符给出的高序列始终是不包含终点的。也就是说，如果 `str`（字符串） = `'HELLO'`，那么 `str[1:3]`\
  \ 将拥有 `str - string[1] = ‘E’` 和 `str[2] = ‘L’`，没有其他内容。\n\n### 高级切片示例\n\n```python\n\
  ## 给定字符串\nStr = “JAVAPOINT”\n### 从索引 0 开始到结束\nprint(str[0:])\n### 从索引 1 开始到索引 4\n\
  print(str[1:5])\n### 从索引 2 开始到索引 3\nprint(str[2:4])\n### 从索引 0 开始到索引 2\nprint(str[:3])\n\
  ### 从索引 4 开始到索引 6\nprint(str[4:7])\n```\n\n**输出：**\n```\nJAVATPOINT\nAVATVA\nJAVTPO\n\
  ```\n\n### 负索引\n\n序列中的负切片从最右侧的字符开始。最右侧的字符表示为 `-1`，第二个右侧显示为 `-2`，依此类推。看下面的图。\n\n\
  ```python\nStr = \"HELLO\"\n```\n\n| H | E | L | L | O |\n|---|---|---|---|---|\n\
  | -5 | -4 | -3 | -2 | -1 |\n\n```python\nstr[-1] = ‘O’\nstr[-2] = ‘L’\nstr[-3] =\
  \ ‘LL’\nstr[-4] = ‘ELL’\nstr[-5] = ‘HE’\n```\n\n```python\nStr = ‘JAVATPOINT’\n\
  print(str[-1])\nprint(str[-3])\nprint(str[-2:])\nprint(str[-4:-1])\nprint(str[-7:-2])\n\
  ## 反转给定的字符串\nprint(str[::-1])\nprint(str[-2:])\n```\n\n**输出：**\n```\nT\nINT\nPOINT\n\
  AVAT\nNIAVA\nIndexError: string index out of range\n```\n\n### 如何重新赋值字符串\n\n你可以通过更新内容并将其放在新字符串中来重新赋值字符串。字符串不支持项赋值。字符串是不可变的，不能进行交换。字符串的内容可以用新字符串替换。看这个示例：\n\
  \n```python\nStr = \"HELLO\"\nstr[0] = “h”\nprint(str)\n```\n\n**输出：**\n```\nTypeError:\
  \ 'str' or ‘string’ object doesn’t hold item assignment\n```\n\n在示例样本中，字符串可以完全转移到新内容。看这个第二个示例：\n\
  \n```python\nstr = \"HELLO\"\nstr = “hello”\nprint(str)\n```\n\n**输出：**\n```\nHELLO\n\
  hello\n```\n\n### 如何删除字符串\n\n正如我之前所说，字符串在 Python 中保持其不可变特性。因此，你无法从字符串中擦除字符。但你可以使用\
  \ `del` 关键字删除整个字符串。\n\n```python\nstr = “JAVATPOINT”\ndel str[1]\n```\n\n**输出：**\n\
  ```\nTypeError: 'str' object doesn't support the deletion of item\n```\n\n现在，要删除整个字符串，看这个示例：\n\
  \n```python\nstr1= “JAVATPOINT”\ndel str1\nprint(str1)\n```\n\n**输出：**\n```\nNameError:\
  \ name ‘str1’ is not defined\n```\n\n### 字符串运算符\n\nPython 程序中存在几种字符串运算符，例如：\n\n\
  1. **范围切片运算符 `[:]`**：用于访问指定范围内的字符。\n2. **切片运算符 `[]`**：用于访问特定字符串的子字符串。\n3. **拼接运算符\
  \ `+`**：用于连接运算符两侧提供的字符串。\n4. **成员运算符 `not in`**：用于反向包含。当指定的子字符串不在指定的字符串中时，运算符返回\
  \ `true`。\n5. **重复运算符 `*`**：用于重复指定的字符串。\n6. **格式化运算符 `%`**：用于格式化字符串。\n7. **原始字符串\
  \ `r`**：用于原始字符串。\n8. **成员运算符 `in`**：用于检查子字符串是否存在。\n\n### 使用转义序列进行字符串格式化\n\n如果我们需要编写如反斜杠（`\\\
