  110\\145\\154\\154\\157”)` |\n\n\n\n\n\n## Python 中的字符串函数\n\nPython 中有几个内置函数用于处理字符串。这些包括：\n\
  \n1. `center(width, fillchar)` – 返回一个用空格填充的原始字符串。该字符串在左右两侧填充等数量的空格并居中。\n2. `casefold()`\
  \ – 返回一个适用于不区分大小写比较的字符串版本。\n3. `count(string, begin, end)` – 计数子字符串在字符串的起始和结束索引之间出现的次数。\n\
  4. `encode()` – 使用输入的编码解码器对 `String` 进行编码。默认编码为 `‘utf-8’`。\n5. `expandtabs(tabsize\
  \ = 8)` – 将序列中的制表符替换为相应数量的空格。这里默认空格值为 8。\n6. `endswith(suffix, begin=0, end=len(string))`\
  \ – 如果序列以起始和结束位置之间的给定前缀结尾，则返回一个布尔值。\n7. `format(value)` – 该功能使用传递的值恢复一个配置过的字符串版本。\n\
  8. `isalnum()` – 如果字符串中的字符均为字母或数字，则返回 true。这意味着它包含字母和数字，且至少有一个字符。如果不是，表达式将返回 false。\n\
  9. `index(substring, beginindex, endindex)` - 如果未找到字符串，则抛出异常。它的功能类似于 `find()` 方法。\n\
  10. `isalpha()` – 如果所有字符都是字母且至少有一个字符，则该函数返回 true。如果不是，表达式返回 false。\n11. `capitalize()`\
  \ – 该函数将字符串的首字母大写。它在 Python3 中已弃用。\n12. `decode(encoding = ‘UTF8’, errors = ‘strict’)`\
  \ – 使用列出的或索引的编码解码器来解码字符串。\n13. `isdecimal()` – 如果字符串中的所有字符都是数字，则返回 true。\n14. `isnumeric()`\
  \ – 如果序列仅包含数字字符，则返回 true。\n15. `isupper()` – 如果字符串的字母均为大写，则返回 false。如果不是，字符串为 false。\n\
  16. `isprintable()` - 如果序列中的所有字符都是可打印的或序列为空，则返回 true。如果不是，则返回 false。\n17. `istitle()`\
  \ – 当字符串的首字母大写而其他字符为小写时，它是一个标题格式字符串。但如果序列标题格式正确，则返回 true。如果不是，则为 false。\n18. `isdigit()`\
  \ – 如果所有字符都是数字且至少有一个数字，则该功能返回 true。如果不是，语句返回 false。\n19. `islower()` – 如果字符串中的字母均为小写，则返回\
  \ true。如果不是，字符串为 false。\n20. `isidentifier()` – 当序列为有效标识符时，此语句返回 true。\n21. `isspace()`\
  \ – 如果字符串的字符均为空白字符，则字符串返回 true。如果不是，则为 false。\n22. `join(seq)` – 该函数合并特定字符串的序列表示表示。\n\
  23. `len(string)` – 该功能返回字符串的长度。\n24. `lower()` – 将字符串中的所有字母改为小写。\n25. `partition()`\
  \ – 在字符串中定位分隔符(`sep`) 并恢复初始部分、分隔符部分和后续部分。当序列中未看到此分隔符时，它返回包含两个空字符串的字符串。\n26. `istrip()`\
  \ – 移除字符串中所有的有效空白字符。它也可以移除字符串开头的特定字母。\n27. `replace(old, new, [count])` – 将旧字符序列替换为新序列。在这种情况下，当指定了最大值时，返回最大数量字符。\n\
  28. `rindex(str, beg=0, end=len(string))` – 工作方式与 `find()` 类似。但它是反向遍历字符串的。\n29.\
  \ `rstrip()` – 移除字符串所有的尾空白字符。\n30. `title()` – 当字符串的首字母大写而其他字符为小写时，它是一个标题格式字符串。但如果序列标题格式正确，则返回\
  \ true。如果不是，则为 false。\n31. `isupper()` – 如果字符串的所有字母均为大写。\n32. `zfill(width)` – 返回一个左侧填充零的字符串。\n\
  33. `translate(table, ...)` – 使用表翻译字符串。\n34. `swapcase()` – 反转所有字母的大小写状态。\n35. `split(sep=None,\
  \ maxsplit)` – 根据分隔符分割字符串。\n36. `splitlines()` – 返回一个在换行符处分割的行列表。\n\n\n\n\n\n上述示例包含了员工和部门的列表，以及其他相应的信息。你可以查看上面的表格以获得更好的理解。\n\
