  ## 如何组装硬件\n\n第一件事是使用地线连接到电源。这将从电源为电路供电。二极管防止反向，而电容用于平滑电流。可以使用 9V 电池。\n\n此设置完成后，`astable\
  \ 555` 定时器向 `CD4029` 发送脉冲。电容和 `Potentiometer` 连接到 `7`、`2` 和 `6` 引脚。这些脉冲来自 `pin 3`。\n\
  \n使用万用表测量插头之间的电阻。上侧应根据推子的位置修改。\n\n\n\n\n\n# 1. 安装 LÖVE 程序\n\n第一步是在设备上按照一个简单的命令来安装\
  \ LÖVE 程序。\n\n```bash\n$ sudo apt install love2d\n```\n\n如果你在树莓派上运行 [Fedora](https://opensource.com/article/17/3/how-install-fedora-on-raspberry-pi)，你可以使用\
  \ `dnf` 代替 LÖVE 软件。\n\n```bash\n$ sudo dnf install love2d\n```\n\n然而，通过安装这些应用程序中的任何一个，你已经在你的设备上引入了\
  \ `Lua`、`SDL` 或其他 LÖVE 运行所需的应用程序。\n\n## 从“Hello, World!”程序开始\n\nLÖVE 引擎作为一个框架存在，使你能够在编写游戏时使用你喜欢的任何文本编辑器。从“hello\
  \ world!”程序开始。确保该程序在你的设备上启动，它将向你介绍 LÖVE 框架和 Lua 语言的基础语法。进入你的系统，打开文本编辑器，输入以下内容：\n\
  \n```lua\ncwide = 520\nchigh = 333\nlove.window.setTitle('  Hello World ')\nlove.window.setMode(cwide,\
  \ chigh)\nfunction love.load()\n    love.graphics.setBackgroundColor(177, 106, 248)\n\
  \    -- font = love.graphics.setFont(\"SkirtGirl.ttf\", 72)\nend\nfunction love.draw()\n\
  \    love.graphics.setColor(255, 33, 78)\n    love.graphics.print(\"Hello World\"\
  , cwide/4, chigh/33)\nend\n```\n\n将上述内容保存为 `main.lua`。带有 `.love` 扩展名的文件是可分发的 LÖVE\
  \ 包。主文件应标记为 `main.lua`，你可以以这种格式创建它：\n\n```bash\n$ love main.lua\n```\n\n然后，在创建扩展后启动该程序。它应该是这样的：\n\
  \n```bash\n$ love ./hello.love\n```\n\n这将为你输出：“HELLO, WORLD!”这是一个简单易懂的代码。`cwide`\
  \ 和 `chigh` 变量是通用的，可以在整个脚本中看到。第一个代码块是设置背景颜色的函数。第二个代码块在屏幕上打印“hello world!”。包含两个连字符（`--`）的行是注释。在这种情况下，你不应使用\
  \ Skirt  。从 [FontLibrary.org](https://fontlibrary.org/) 获取字体。相应的调整代码：\n\n```bash\n\
  $ love main.lua SkirtGirl.ttf\n```\n\n然后启动程序：\n\n```bash\n$ love ./hello.love\n\
  ```\n\n## 树莓派上的游戏类型\n\n你可以在系统上安装并玩各种游戏。这些包括：\n\n1. Minetest\n2. Widelands\n3. Duke\
  \ Nukem 3D\n4. Beneath a Sky\n5. Micropolis\n6. Freeciv\n7. Which-Way-Is-Up\n8.\
  \ Openrena\n9. Quake III Arena\n10. Star Wars by Jedi Knight\n11. Battle for Wesnoth\n\
  12. Funny Boat\n13. Littlecrane\n14. Flight of the Amazon Queen\n15. Abuse\n16.\
  \ SuperTux\n17. Angry Dwarves\n18. RailWorld\n19. Dance\n20. OpenTT\n21. Simutrans\n\
  22. Quake “other”\n23. Monsterz\n24. BOOM，以及更多。\n\n## Pygame 与 Hello\n\n`Pygame`\
  \ 意味着游戏的入门。这是 Python 游戏编程。如果你作为程序员了解 `pygame`，可以使用它快速在每个平台上编写游戏。这是基于 `SDL` 库。它意味着简单的媒体层，为你的树莓派系统提供了跨平台的访问能力。这些组件包括键盘、摇杆、视频和音频。`pygame`\
  \ 作为 `SDL` 项目的替代品。你可以在支持这些应用的任何平台上编写游戏和其他程序。Hello，`pygame` 是 `pygame` 的另一个版本。什么是坐标？`Coordinates`\
  \ 作为树莓派追踪器。它不需要 GPS 即可附加到任何车辆上。它连接到 Google Maps，让你能够随时随地跟踪汽车或其他物体的位置。使用 RPi 进行车辆跟踪或位置跟踪可以使用内存卡。\n\
  \n# 第十一章：什么是树莓派机器人？\n\n树莓派机器人是使用 Pi 完成的可编程机器人套装。树莓派机器人的一个例子是 Arduino 机器人。树莓派设备的功能类似于桌面电脑，但更小、更便宜。经验程序员、爱好者和其他粉丝可以使用它来构建机器人。\n\
  \n### 树莓派机器人的要求\n\n构建树莓派机器人的要求包括：\n\n1. 2 个五伏直流电机\n2. 6 个 AA 电池及其电池盒用于为电机供电\n3.\
  \ 用于构建简单电路而无需的小面包板\n4. 粘性胶\n5. 底盘 - 6 英寸的平方形材料，例如激光切割塑料、乐高和纸板。额外的两个脚用于稳定机器人。\n6.\
  \ `L293D` 电机控制器\n7. 两个带有带抓地力的橡胶轮胎的轮子 – 这些轮胎卡在电机轴上\n8. 5 伏 USB 移动电源，为 Pi 设备供电\n9.\
  \ 连接所有设备的跳线导\n10. 用于在机器人运行前加载软件的 `microSD` 卡\n\n### 设置树莓派机器人的方法\n\n#### 连接电线\n\n\
  将设备和面包板安装在底盘上后，你可以使用像粘性胶之类的胶剂将它们固定在一起。在面包板上固定 `L293D` 电机控制器。将跳线电路连接到树莓派设备上的正确引脚，包括面包板。然后，将每个直流电机的两根线都连接电机控制器的输出引脚上。\n\
  \n#### 将系统连接到电源\n\n将电机、轮子和电池盒安装到机器人的底部。连接电源线并将它们引到面包板。然后，将它们连接到 `L293D` 的电机电源输入端。接上\
  \ 5 伏电池包并插入树莓派。\n\n#### 下载软件\n\n你需要通过下载可以帮助你通过 Pi 控制机器人的软件来准备卡。运行 Pi 的软件是 [NOOBS](https://www.raspberrypi.org/downloads/raspberry-pi-os/)。访问网站并下载。解压并将\
  \ NOOBS 的操作系统复制到 `microSD` 卡中。之后，将卡插入你的 Pi 中。将鼠标、键盘和显示器连接到树莓派。按照系统提示在你的系统上安装 Raspbian\
  \ 软件。\n\n\n\n\n你也可以通过此命令在终端中查看这个简单的 10 行 Python 程序：\n\n```bash\nnano first_move.py\n\
  ```\n\n此命令将会在 `Nano` 中打开代码，它是树莓派原生的文本编辑器。\n\n## 运行 Python 程序\n在这一阶段，是时候安装程序并让你的新机器人移动起来了。你应该使用此命令来执行代码。\n\
  \n```bash\nPython3 first_move.py\n```\n\n输入代码后，你的机器人将开始沿正方形移动。使用 `Nano` 编辑器返回程序。更改时间延迟并修改向后、向前、向右和向左的命令，以便机器人中创建你所需的移动、动作和响应。\n\
  \n## 添加传感器并编写新代码\n是时候通过添加传感器和编写新代码来挖掘机器人的潜力了。这正是使用树莓派平台控制机器人的本质。\n\n在机器人的鼻子上安装一个红外传感器。编写程序让追踪地板上的黑线。你还可以添加一个集成了计算机视觉代码的摄像头。这将帮助机器人追逐球或你想要的任何其他物体。\n\
  \n## 如何处理自主漫游车\n你可以构建一个可以与你的系统协同工作的自主漫游车。该设备对于竞赛和各种活动非常有用。你可以遵循简单的规则和方法创建此设备。\n\n\
  ## 如何组装硬件\n此项目所需的设备包括 `Raspberry Pi 3`、`Pi camera V2`、`Arduino Mega 2560` 以及 `Tensorflow`\
  \ 目标检测 API。其他还包括自定义的 3D 底盘模型、电压调节器、舵机电机、自定义的 `Mr. W` 步进电机控制器以及可以产生 21 伏的定制 `4x Lithium\
  \ 18650` 电池。\n\n## 运行软件\n该设备设计了软件用于处理和控制漫游车的所有移动。该软件作为机器人的智能单元，包含了特定的移动指令并与 `Arduino`\
  \ 通信。动作可能可能是左转三十度或向右移动二十英寸。你机器人的移动性取决于它的串行通信。\n\n## 结论\n如果你是一个 Python 程序员或 Python\
  \ 爱好者，这本书为你提供了一个难得的机会，让你理解如何成功使用 `Raspberry Pi` 平台。你可以利用你的 Pi 轻松地玩游戏并控制机器人、无人机和其他技术设备。\n\
  \n技术革命推动了这种口袋大小电脑的发展，它可以像你的台式机或笔记本电脑一样工作。然而，它更便宜，尺寸更小。\n\n`Raspbian` 是它的操作系统并与 `Linux\
  \ OS` 配合工作。正确使用此设备只需要正确的设备，如显示器、`HDMI`、电源、适配器、鼠标、键盘、互联网连接、电视以及 `Raspberry Pi` 本身。你还需要具备如何将它们连接的知识以实现有效性能。\n\
  \n`Raspberry Pi` 可以运行你所有的智能家居电器。你应该通过广泛阅读这本书并掌握其中信息来提升你的 IT 技能。通过这种方式，你可以成为一个能够处理微型设备并执行多项任务和技术项目的程序员。\n"
