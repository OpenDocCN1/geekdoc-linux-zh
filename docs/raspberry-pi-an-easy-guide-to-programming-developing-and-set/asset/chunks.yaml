    dictionary from the iterable, making the values equal to value.


    5.  dict.keys( ) – used for returning all the keys of the dictionary.


    6.  dict.items( ) – this method returns all the key-value pairs as a tuple.


    7.  dict.has_key(key) – if the glossary has the specified key, this method returns
    true.


    8.  dict.values( ) – this method returns all the values of the dictionary.


    9.  dict.update(dict2) – useful for updating the dictionary by adding key-value
    pair of dict2 to the dictionary.


    10.  dict.setdefault(key,default = "None") – this feature sets the key to the
    default figure if the specified key is not in the dictionary.


    11.  index( )


    12.  len( )


    13.  count( )


    14.  pop( )


    15.  popItem( )


    Functions of Built-in Dictionary


    1.  len(dict) – this functionality is used for estimating the length of the dictionary.


    2.  type(variable) – used for printing the type of the passed variable.


    3.  cmp(dict 1, dict2) – this is used for comparing items of both the dictionary
    and returns true, especially if the first dictionary values are greater than the
    second dictionary. Otherwise, the output will return false.


    4.  str(dict) – this feature converts the dictionary into a printable sequence
    representation.


