    \n## INTRODUCTION\nAre you interested in this new small device that has taken\
    \ stage of the IT industry? Raspberry PI made a debut on February 24th, 2012.\
    \ Unfortunately, the website of the supplying crashed. However, new models of\
    \ Raspberry PI 2, have been released and are in circulation. This computer device\
    \ has a Linux operating system and designed with a High-Definition Multimedia\
    \ Interface (HDMI) video output. You can connect a computer monitor or television\
    \ into it. But the monitor must have DVI connector with HDMI adapters connected\
    \ to the system before it can function. Your Raspberry PI may not work if your\
    \ monitor has only VGA connector. This device is a global phenomenon. It is useful\
    \ for various activities such as a regulator for smart appliances and a media\
    \ center. Additionally, the Raspberry Pi could serve as a desktop workstation.\
    \ Now beginners can code or decode python programming language. In the same vein,\
    \ experienced programmers that are not conversant with Raspberry can learn various\
    \ ways of using the features and functionalities of the software for different\
    \ businesses. You can begin to write programs for your device using the renowned\
    \ Python language. You can learn the essentials of graphical user interfaces.\
    \ Understanding pygame module will assist you in building fun and exciting games.\
    \ Raspberry PI recommended using Raspbian Wheezy distribution. The book contains\
    \ a perfect representation of this phenomenon for better understanding. It is\
    \ good to note that the original Raspian operating system was developed and designed\
    \ by Peter Green and Mike Thompson. In this book, you will learn the ABC of Raspberry\
    \ Pi and the requirements of setting it up. You will also learn basic programs\
    \ in Python. Other things that can help you navigate and use the Raspbian include\
    \ a comprehensive knowledge of string theory, lists, and dictionaries. How to\
    \ use files and the internet are necessary information every newbie in the field\
    \ needs to enjoy this. Let's dive inside the book for you to see and know more!\n\
    \n## CHAPTER ONE UNDERSTANDING RASPBERRY PI\n### Raspberry Pi Device\nRaspberry\
    \ Pi functions as a desktop computer designed to access the internet and play\
    \ games. It can help you to build spreadsheets and word-processing documents.\
    \ Additionally, the Raspbian can help you play high-definition videos. This device\
    \ can help beginners and experienced software engineers to learn skills and programming\
    \ languages such as Python and Scratch. A Pi is an affordable computer device\
    \ as small as a credit card that you can plug into a television or computer monitor.\
    \ It also functions with a mouse and standard keyboard. The system is a multipurpose\
    \ machine used for building digital projects. The Raspberry Pi is designed as\
    \ open-source technologies with multimedia web and communication features. The\
    \ Pi board launched this computer module in 2014 and integrated into a module\
    \ the board of model B Raspberry Pi. With this, you can use it as an embedded\
    \ system making the device useful.\n\n### Different Models of Raspberry PI\nThere\
    \ are two models of Raspberry Pi; the first model (A) and the second model (B).\
    \ The differentiating factor is its USB port. Model A has a port that can consume\
    \ less power, excluding the Ethernet port. But the B model, including the Ethernet\
    \ port, can use up more energy. The model B is developed in China.\n\n### The\
    \ General Features and Provisions of Raspberry PI\nRaspberry Pi exists in different\
    \ generations, such as the Pi, P2, P3, and P4. These generations cost like the\
    \ first models. But vary in the hardware and some features, which reveal upgrades\
    \ in the Raspbian technology. These latest technologies incorporate a board with\
    \ a built-in Bluetooth feature. They are enabled by a Quad-Core Broadcom BCM283764bit\
    \ ARMv8 processor. The P2 operates with 900 MHz, while P3 functions at 1.2 GHz.\
    \ All these models have four USB ports with a naked board that can be extended,\
    \ including an upgraded power system. The Raspbian is a well-designed British-made\
    \ computer device that is a bestseller on the market today, according to Eben\
    \ Upton, founder of the Raspberry Pi. With this system, you can access more opportunities\
    \ for the IoT, and accomplish more fantastic projects faster. It is useful for\
    \ various activities such as regulator for smart appliances and a media center.\
    \ Additionally, the Raspberry Pi could serve as a desktop workstation. Now beginners\
    \ can code or decode python programming language.\n\n### The General Provisions\
    \ of Raspberry Pi\n(The text provided for this section is minimal) Raspberry Pi\
    \ is a trademark from Raspberry Pi Foundation. This charity organization is registered\
    \ and located in the United Kingdom. The registration number is 1129409 It was\
    \ founded with the purpose of furthering the academic courses of children and\
    \ adults interested in acquiring technical skills in the field of computer science\
    \ and other subjects in that field. Another target market for this product is\
    \ the literate masses in developing countries, who may avail themselves of the\
    \ opportunity of learning programming.\n"
