    and moderate voltage before connecting your system.5V pins can bypass safety features
    such as fuse and voltage regulator. They could avoid these regulators from damaging
    your device.Other functionalities of these Pins include


    1.  Pins GPIO12, GPIO13, GPIO18, GPIO19 supports pulse width modulation (PWM)
    on the hardware of Raspberry Pi. The software of any pin can also support this
    functionality.


    2.  GPIO2 and GPIO3 pins support the 12 C interface.


    3.  The serial interface of GPIO14 and GPIO15 pins can be used as a serialized
    console.


    4.  GPIO8, GPIO7, GPIO10, GPIO9,GPIO11, GPIO17, GPIO18, GPIO1, GPIO21, GPIO20
    pins provides serial peripheral interface (SPI) ports.


    Pins in Serial InterfaceAs I stated above, the pins in the serial interface include
    GPIO8, GPIO7, GPIO10, GPIO9, GPIO11, GPIO17, GPIO18, GPIO1, GPIO21, and GPIO20.Prototyping
    Boards in RaspberryPrototyping boards are used for attaching some electronic components
    and sensors to a Raspberry Pi. Examples of prototyping boards in a Raspberry Pi
    include PiBreak Plus. This board provides labeled escaping pins for all GPIOs.
    It is a huge prototyping surface with solder pads and power bar for a secure connection
    to a power source. This board is well-suited with all models of Raspberry Pi and
    other boards with a 40-pin extension header such as Raspberry Pi Model A+, Raspberry
    Pi Model B+, and Raspberry Pi Model 2.Features of Prototyping Boards in Raspberry
    PiThe features of these boards include


    1.  It comes with a large prototyping surface to connect your parts.


    2.  The board has pinout markings on the top and bottom.


    3.  It has bolts, nuts, washers, and spacers for proper mounting.


    4.  There are 3.3volts and GND power rails.


    5.  The board is gold-plated (PCIB) ENIG for durability.'
