- fmt: "\nIn Python, you will find an alternative method of using the `get()` method\
    \ for accessing dictionary values. The result you would get is similar to the\
    \ output by the indexing.\n\n## How to Add Dictionary Values\nAs I said earlier,\
    \ the dictionary is a mutable data type. You can update its values using the specific\
    \ keys. The values are updated together with key `Dict[key] = value`. Existing\
    \ values can be updated using the `update()` method. This feature enables you\
    \ to update the key-values present in a dictionary. It helps to update the new\
    \ keys added in the dictionary.\n\nHere is an example of how to update dictionary\
    \ values.\n\n```python\n# Creating an Empty Dictionary\nDict = {}\nprint(“Empty\
    \ Dictionary: “)\nprint(Dict)\n\n# How to Add Elements to Dictionary Serially\n\
    Dict[0] = ‘Paul’\nDict [2] = ‘John’\nDict [3] = ‘Richard’\nprint(\"\\nDictionary\
    \ after adding 3 elements: “)\nprint(Dict)\n\n# How to Add Set of Values with\
    \ a single key\n# The ['Emp_ages'] = 20, 33, 24\nprint(\"\\nDictionary after adding\
    \ 3 elements: “)\nprint(Dict)\n\n# Updating existing Key's Value\nDict[3] = ‘JavaTpoint’\n\
    print(\"\\nUpdated key value: “)\nprint(Dict)\n```\n\n**Output:**\n```text\nEmpty\
    \ Dictionary:{}\nDictionary after adding 3 elements:{0: ‘Paul’, 2: ‘John’, 3:\
    \ ‘Richard’}\nDictionary after adding 3 elements:{0: ‘Paul’, 2: ‘John’, 3: ‘Richard’,\
    \ ‘Emp_ages’ : (20, 33, 24)}\nUpdated key value:{0: ‘Paul’, 2: ‘John’, 3: ‘JavaTpoint’,\
    \ ‘Emp_ages’ : (20, 33, 24)}\n```\n\n## How to Delete Elements using del keyword\n\
    You can quickly delete the items of the dictionary using a `del` keyword, such\
    \ as in this example.\n\n```python\nEmployee = {\"Name\": \"James\", \"Age\":\
    \ 25, \"salary\":35000, \" Company\":\" GOOGLE\"}\nprint(type(Employee))\nprint(\"\
    printing Employee data ….\")\nprint(Employee)\nprint(\"Deleting some of the employee\
    \ data\")\ndel Employee[\"Name\"]\ndel Employee[\"Company\"]\nprint(\"printing\
    \ the modified information \")\nprint(Employee)\nprint(\"Deleting the dictionary:\
    \ Employee\")\ndel Employee\nprint(\"Lets try to print it again \")\nprint(Employee)\n\
    ```\n\n**Output:**\n```text\n<class ‘dict’> …..Printing Employee data ….{{'Name’\
    \ : ‘James’, ‘Age’ : 25, ‘salary’ : 25000, ‘Company’ : ‘GOOGLE’}\nDeleting some\
    \ of the employee data\nprinting the modified information{'Age’ : 25, ‘salary’\
    \ : 25000}\nDeleting the dictionary: Employee\nLet's try to print it again\nNameError:\
    \ name 'Employee' is not defined\n```\n\nAn error is in the above print statement\
    \ because the `Employee` dictionary that was requested for printing has been deleted.\n\
    \nAnother method is through the `pop()` method. This method accepts the key as\
    \ an argument. It also removes the related value as in the example below:\n\n\
    ```python\n# Creating a Dictionary\nDict = {1: ‘JavaTpoint’, 2: ‘Paul’, 3: ‘Thompson’}\n\
    # Deleting a key using pop( ) method\nPop_ele = Dict.pop(3)\nprint(Dict)\n```\n\
    \n**Output:**\n```text\n{1: 'JavaTpoint', 2: 'Paul'}\n```\n\nIn Python, there\
    \ are built-in methods such as `popitem()` methods and `clear()` methods for removing\
    \ factors from the glossary. `popitem()` methods remove arbitrary elements from\
    \ a dictionary. Also, the `clear()` feature removes all elements from the whole\
    \ Python dictionary.\n\n## How to Iterate Dictionary\nYou can use a loop for iterating\
    \ a dictionary. Look at the example:\n\n```python\n# Using for loop to print all\
    \ the keys of a dictionary.\nEmployee = {“Name”,: “James”, “Age”: 29, “salary”:\
    \ 25000, “Company”: “GOOGLE”\n```\n\n**Output:**\n```text\nNameAgeSalaryCompany\n\
    ```\n\n## The Properties or Features of Dictionary Keys\nIn Python dictionaries,\
    \ multiple values cannot be stored for the same keys. In situations where multiple\
    \ values are assigned to a single key, the value that is assigned last to such\
    \ key becomes the value of such key. For example:\n\n```python\nEmployee = {“Name”:”James”,\
    \ “Age”:30, “salary”:35000\\. \"Company\":\" GOOGLE\",\" Name\":\" James\"}\n\
    for x,y in Empoyee.items ( ):\nprint(x,y)\n```\n\n**Output:**\n```text\nName James\n\
    Age 30\nSalary 35000\nCompany GOOGLE\n```\n\nThe second method is a situation\
    \ where the keys are not mutable objects. Strings, tuples, and numbers could form\
    \ the key. However, lists are considered as mutable objects and not useful as\
    \ the keys in the dictionary. For example:\n\n```python\nEmployee = {“Name”: “John”,\
    \ “Age”: 29, “salary” 35000, “Company”:”GOOGLE”, [100,201,301]:”Department ID”}\n\
    for x,y in Employee.items ( ):\nprint(x,y)\n```\n\n**Output:**\n```text\nTraceback\
    \ (most recent call last):\n  File “dictionary.py”, line 1, in <module>\n  Employee\
    \ = {“Name”: “James” , “Age”: 30, “salary”:25000, “Company”: “GOOGLE”, [100,201,301]:”Department\
    \ ID”}\nTypeError: unhashable type: ‘list’\n```\n\nLooking at the methods and\
    \ functions of the built-in dictionary in Python programs include:\n\n### Methods\
    \ of Built-in Dictionary\n1. `copy()`: returning a shallow copy of the dictionary.\n\
    2. `get(key, default=\"None\")`: used for getting the specified key.\n3. `clear()`:\
    \ used for deleting all items of the dictionary.\n4. `fromkeys(iterable, value=None)`:\
    \ used for creating a new dictionary from an iterable.\n5. `keys()`: returns all\
    \ keys of the dictionary.\n6. `items()`: returns key-value pairs as a tuple.\n\
    7. `has_key(key)`: returns true if the dictionary has the key.\n8. `values()`:\
    \ returns all values of the dictionary.\n9. `update(dict2)`: useful for updating\
    \ the dictionary by adding `dict2`.\n10. `setdefault(key, default=\"None\")`:\
    \ sets the key if the key is not present.\n11. `index()`: (not a standard dict\
    \ method).\n12. `len()`: returns the length of the dictionary.\n13. `count()`:\
    \ (not a standard dict method).\n14. `pop()`: removes the specified key.\n15.\
    \ `popitem()`: removes arbitrary elements.\n\n### Functions of Built-in Dictionary\n\
    1. `len(dict)`: used for estimating the length of the dictionary.\n2. `type(variable)`:\
    \ used for printing the type of variable.\n3. `cmp(dict1, dict2)`: used for comparing\
    \ items of both dictionary.\n4. `str(dict)`: converts the dictionary into a printable\
    \ sequence.\n"
