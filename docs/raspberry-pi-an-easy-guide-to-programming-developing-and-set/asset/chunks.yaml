  raw: 'This project is aimed at using a your Pi device for controlling the speed
    of DC motor.The equipment you need includes a model of Raspberry Pi, DC motor,
    LED, capacitors, resistors, and computer monitor or TV. Others are transformer,
    wiring pi or PHP program, voltage regulator, motor driver IC, and diode.How it
    WorksYou can regulate the velocity of a DC motor using your Raspberry Pi. The
    voltage applied for the terminals of a DC motor is comparative to its speed. If
    there is a varied voltage across the terminals of a motor, the rate will also
    vary consequently. This is the reason for this project. You can operate the motor
    at different speeds by connecting it to a keyboard. If you press the key, the
    system starts functioning immediately.If you want to handle this project, you
    can program the PWM to cause an output. The output is initiated using wiring pi
    or PHP. This feature is based on the duty cycle that can cause a change in the
    average current and voltage of the system.When this happens, it causes the velocity
    of the DC engine to change.At this stage, you should interface a motor driver
    IC to the board. This step will cause the board to receive the signals of PWM.
    THis will also send the required opposite polarity (O/P) to the DC motor. The
    overturn polarization between the two magnetic fields causes the DC engine to
    function.


    2.  Controlling the auto power of street lights using a Raspberry Pi


    The purpose of this task is for students to know the ways of controlling the auto
    power of street lights.The items needed for this project are diodes, resistors,
    LEDs, computer monitor or television, and crystal. Other equipment includes MOSFET,
    transformers, wiring Pi or PHP program, capacitors, and white LEDs.  How it worksThe
    reason for choosing LED lights is to use them as street lights, and they consume
    less energy. LED lights have longer life span if compared to other lights. The
    PWM signals are developed and used for regulating the intensity of lights through
    a Raspberry Pi. This feature causes a MOSFET to regulate the lights making them
    attain a desired operational level.This will cause the strength of LED lights
    to change steadily from dusk to dawn. You will notice this occurrence more during
    peak period when there will be full intensity. After some time, the heat of the
    light will gradually reduce. You can achieve a variable voltage across the LEDs
    using MOSFET switching through pulse width modulation.Other Projects you can do
    using Raspberry PiThese include


    *   Touch screen tablet.


    *   Synced music and Christmas lights.


    *   Lego Raspberry Pi enclosure.


    *   Programmable sequential switching.


    *   Controlling Drones


    ![Drones controlled with Pi.png](Image00004.jpg)Drones Controlled by Raspberry
    Pi


    *   Solar street lights.


    *   Wearable computerized devices powered by Raspberry Pi.


    *   Autonomous robot arm control through Bluetooth control using Raspberry Pi.


    ![Controlling Robots.png](Image00005.jpg)Robots controlled by Raspberry Pi


    *   Business computerization using Zigbee with Raspberry Pi.


    All the Tools Required to Setup Raspberry PI![Tools for Raspberry.png](Image00006.jpg)Tools
    for Raspberry SetupAll the tools you require to set up your Raspberry Pi technology
    include Raspberry Pi model, DC motor, SD card, connectivity or display cables,
    Mouse, power supply, and keyboard. Other optional tools and equipment needed are
    3.5 mm jack earphones or headphones and internet connectivity using a WiFi adapter
    or Ethernet cable.KeyboardUse a standard keyboard or a regular keyboard to input
    data in your microcomputer.MouseA conventional mouse is also used to input information
    into the system.SD Card![An SD Card.png](Image00007.jpg)An SD card for Raspberry
    PiYou should get an 8 GB class of 4 SD cards for your Raspbian. This is already
    installed with NOOBS. Most times, you can buy an SD card already installed with
    NOOBS. Another way to get [NOOBS](https://www.raspberrypi.org/downloads/) is by
    downloading it for free.If you have the foremost Raspberry Pi Model A or Raspberry
    Pi Model B, you need a full-size SD card. However, the new models of Raspberry
    Pi model A+ and Raspberry Pi model B+ are designed to use micro SD cards. Other
    models include model B of Raspberry Pi 2, model B of Raspberry Pi 3, and Raspberry
    Pi Zero, all function with micro SD cards.Internet ConnectionUse a WiFi adapter
    or Ethernet cable to connect your device to the internet. With this, you can download
    software or update an existing one.Power supplyThe optimal power supply required
    by your Raspberry Pi is at least 5 volts. Apply a 5-volt micro USB power supply
    to power your device. If you use a power output with a lower voltage, the device
    will function funnily.Earphones of HeadphonesYour microcomputer functions with
    earphones or headphones using a 3.5 mm jack.HDMI / DVI Monitor or TelevisionA
    Raspberry Pi functions with a television or HDMI monitor or DVI monitor as a display
    unit. If you want more explicit pictures and high-quality images, use a monitor
    with HDMI input. If you are using older devices, use other connections. An original
    Ethernet cable is ideal for internet access to the system. Raspberry Pi 3 comes
    with a integrated wireless LAN.Installing Raspberry PIInstalling Raspbian on your
    device is easy by following simple guidelines. A Raspberry Pi functions with an
    operating system called a Raspbian. This originates from the Linux distribution
    Debian. All Raspberry Pi''s hardware functions with the Linux operating system.The
    Raspbian is a multipurpose and professional operating system that makes your Raspberry
    Pi device to work well as a computer. It features a browser, command buttons,
    and several other programs.A Raspberry Pi can function as a home computer since
    it is a low-cost device with attributes of a PC. It serves as a springboard enabling
    you to perform other tasks and projects seamlessly. You can use it as wireless
    access points or play exciting video games.Installing Raspbian on a Raspberry
    PiInstalling Raspbian is a natural process. You will use a microSD card and write
    the disc image after [downloading](https://www.raspberrypi.org/downloads/) the
    Raspbian. Get an 8 GB microSD card, a PC with an opening for SD cards, a mouse,
    keyboard, power, and a Raspberry Pi, as stated above.What is NOOBS?![Download
    Noobs.png](Image00008.jpg)NOOBS Installation ManagerNOOBS is an installation manager
    for operating systems. It is another option for installing Raspbian on your Pi
    device. Some SD cards are pre-loaded with NOOBs making it easier to install Raspbian
    to your Raspberry. If it is not pre-installed, you can [download NOOBS](https://www.raspberrypi.org/downloads/)
    to your SD card before using it to download Raspberry Pi.Method 1Download Raspbian
    OS![Raspberry Pi Installer.png](Image00009.jpg)Raspberry Pi InstallerThe first
    method for installing Raspberry Pi is downloading the [Raspbian](https://www.raspberrypi.org/downloads/raspberry-pi-os/)
    disc image. This is the current version of the operating software in a Raspberry
    Pi. You can download the Raspbian disc image using a PC or Mac computer.                                          This
    process may take some time with the traditional download feature. You can also
    use the torrent, although this could take up to an hour to download to your system.
    But wait for it.Method 2Unzip the Compressed FileAfter downloading, the next step
    is to unzip the File. It exists with the ZIP64 format. However, this depends on
    how the built-in features in your system are. If they are updated and current,
    you can use any program to unzip the File.Some programs for unzipping files in
    a Raspberry Pi include


    1.  [Unzip](http://unarchiver.c3.cx/unarchiver) for persons using the Linux operating
    system.


    2.  The [Unarchiver](http://unarchiver.c3.cx/unarchiver) for Mac users.


    3.  [7-Zip](http://www.7-zip.org/) for programmers using windows software.'
