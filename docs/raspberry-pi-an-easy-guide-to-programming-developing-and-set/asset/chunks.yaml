    # 关于 Python 库的详细信息


    Python 程序在 Raspbian 上运行之前可能需要外部库。因此，你需要使用 `PIP` 安装额外的库，`PIP` 只能为终端窗口中的程序安装库。`PIP`
    是 Python 的包或模块管理器。这样做的一个良好理由是，Python IDE 程序自带了本地副本的 Python。建议使用终端窗口运行程序，因为它可以与使用首选安装程序（`PIP`）安装的外部库协同工作。然而，`PIP`
    在 3.4 或更高版本的 Python 软件包中已默认内置。


    Python 程序可以通过终端、IDE 或 Thonny 进行安装。


    ## 使用终端运行 Python 程序


    Python 程序也可以通过终端窗口运行。但在打开终端之前，你应该了解程序所在的路径。你可以按照以下方法找到程序：


    进入 `Documents` > `Python` > `Main.py`。此后，打开窗口并应用 `cd` 命令。这可以帮助你将工作目录更改到另一个包含 Python
    程序的目录，例如：`cd Documents/Python`。


    假设你想检查你的 Python 程序是否在该目录中。你可以使用命令 `dir`。这将列出该目录下的所有文件和文件夹。如果应用程序未包含在存档中，你必须返回并找到程序在目录中的位置。


    现在，让我们使用 Python 命令并执行此 Python 程序。它将运行命令后指定的 Python 文件。例如：

    `Python yourfilename.py`


    另一种方法是检查你的文件名是否有空格，例如：`Python your File name.py`。


    ## 通过 IDE 运行 Python 程序


    你的树莓派操作系统带了几个对编程非常有用的 IDE。Raspbian 的 IDE 之一是原始的 Python IDE。你可以通过打开 Raspbian 图标打开它。然后，滚动到
    Programming（编程）并点击 `Python 3 (IDLE)`。


    加载 IDE 后，点击 `File` > `Open`。如果文件打开，导航到 Python 程序。然后，运行程序。只需点击 Run 按钮并点击 `Run Module`。另一种方法是使用键盘并按下
    `F5`。


    ## 使用 Thonny 运行 Python 程序


    另一个具有许多功能的必要 Python IDE 是 Thonny。通过这个调试器，你可以观察变量并单步执行代码。它也可以通过以下方法运行 Python 程序：


    导航到 Raspbian 图标并点击它。向下滚动找到 Programming 并点击 `Thonny Python IDE`。


    在此过程之后，点击 `File` 菜单。找到并点击 `Open` 按钮并滚动到程序。如果程序已下载，点击 `Run` 按钮运行当前文件。


    ## Python Shell


    它解释 Python 语言并用于按顺序执行代码。Python shell 也被称为 Python 交互式 shell，用于执行单条 Python 命令并获取结果。


    Python shell 从用户处获取命令。如果程序员输入提示符，程序将执行它并显示结果。


    如果你正在使用 Windows，通过输入 `Python` 打开 Python shell。然后，按 `Enter`。此后，你将看到三个大于符号（`>>>`）。输入单个语句，如果你输入如
    `5 + 3` 的表达式并按 `Enter`，结果就会出现。结果将显示在下方的另一行。


    ### 使用 Python Shell 执行 Python 脚本


    Python shell 用于执行单条语句。然而，运行多个语句需要你使用扩展名为 `.py` 的创建一个 Python 文件。然后，在各种语句中编写 Python
    脚本。


    处理此问题的另一种方法是使用记事本和如下语句：

    ```

    lookatPythonScript.py

    print – "Look at Python Script."

    print – "Receive Python lessons from the Teacher."

    ```

    你可以将其保存为 `myPythonScript.py`。然后，导航到命令行并滚动到文件夹保存此文件。此过程可以帮助你应用 Python `lookatPythonScript.py`
    命令。Python Shell 可执行 Python 语言和命令。


    ## 循环


    在任何编程语言中，程序的流默认都是顺序的。在大多数情况下，你可以更改程序的顺序。但是，特定的代码可以重复执行。编程语言提供了几种类型的循环，可以多次重复某些特定代码。


    ### 在 Python 中使用循环的原因


    使用循环的原因之一是它有助于简化复杂问题。Python 循环允许你更改或修改程序的顺序。通过这种方式，你不需要无数次地编写特定的代码，而是可以重复预定或固定的次数。


    在这种情况下，为了打印十次数字，不需要应用十 `print` 语句。只需在循环内部打印即可。循环可以运行十次重复或迭代。


    ### 使用 Python 循环的优势


    在 Python 程序中使用循环具有各种益处，例如：


    *   循环帮助程序员重用代码。

    *   如果你使用 Python 循环，你就不需要无数次地编写特定代码。

    *   Python 循环允许用户遍历数据结构（如链表或数组）的元素。


    ### Python 程序中不同的循环语句


    | 序号 | Python 循环语句 | 代码描述 |

    | :--- | :--- | :--- |

    | 1. | 后测试循环或 Do-while 循环。 | 在达到特定顺序之前，do-while 循环将继续。在编程语言中，它被称为后测试循环。该语句适用于你可以至少执行一次函数的情况。此外，它也用于菜单驱动的程序。
    |

    | 2. | 前测试循环或 While 循环 | 在预先不知道重复或迭代次数的情况下，可以在该场景应用 while 循环。在 while 循环中，执行一个表达式块，直到满足指定的条件。这种类型的循环被称为前测试循环。
    |

    | 3. | 前测试循环或 For 循环 | 前测试循环用于执行循环的一部分，直到满足特定条件。这也被称为“for 循环”。在预先确定重复或迭代的情况下的情况下这种循环语句是正确的选择。
    |


    ## IDLE 和编辑器


    在 Python 语言中，IDLE 或 IDE 意味着集成开发环境。你也可以将其称为 Python IDLE 编辑器。初学者在使用此工具编程，直到他们获得更多经验。专业程序员使用
    Komodo 或 Eclipse，它们比 IDLE 更可靠、更好。Python IDLE 是用于开发 Python 程序的 GUI。在安装 Python 时，GUI
    可以自动安装。在简单的 GUI 环境中，它可以帮助你运行、调试和编辑 Python 程序。IDE 自动化了 SDLC 中的编译、编辑和测试过程。IDLE 使用标准库中的
    Tkinter GUI 工具包构建其窗口。它是一种可以在多个平台（如 Mac、Linux、Windows 操作系统等）上运行的多功能软件。




    1.  它作为一个集成调试器工作。

    2.  IDLE 有助于语法高亮和命令历史。

    3.  此功能支持多窗口。

    4.  适用于 Python 代码的取消缩进或自动缩进。

    5.  单词自动补全过程。


