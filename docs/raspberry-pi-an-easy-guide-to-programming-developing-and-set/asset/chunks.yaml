    # 这些选项的详细分析包括第七章 树莓派的硬件接口


    该设备设计了硬件接口以确保正常功能。这是一种用于学习的低成本单板计算机设备。树莓派基金会（一个非营利组织）构建了该系统。该设备从树莓派 Zero 到树莓派
    3 有不同型号，均采用 40 针排针连接器。它们提供了 `GPIO` 引脚的入口以及其他一些功能。该针头提供了 26 个 `GPIO` 引脚，电压为 5 伏和
    3.3 伏，包括用于 `ID EEPROM` 功能的其他单独引脚。


    ## GPIO 引脚连接


    这 26 个 `GPIO` 引脚可以专门配置为输入引脚或输出引脚。系统使用额定电压 3.3 伏。高电压（如 5 伏）对你的设备是有危险。未连接的引脚具有未定义的逻辑电平，但你可以使用上拉或下拉电阻将单独的引脚强制置高或置低电平。这种练习通过外部电阻在硬件中实现，但你也可以将其应用于软件。`GPIO`
    引脚和 `GPIO3` 引脚在板载上设计有永久上拉电阻。然而，其他 `GPIO` 引脚在软件中配置以提供上拉或下拉电阻。在大多数情况下，它们完全没有电阻。


    ## 引脚功能


    通用输入输出 (`GPIO`) 引脚被配置为提供各种功能，甚至超过了基本的数字输入和输出。所有引脚显示出相似的功能，但某些具有独特的特性和服务。。这些引脚可以帮助程序员使用
    Pi 设计各种项目，如机器人、复古游戏、气象站和其他强大的机器。这些引脚使得电机、灯光、传感器和其他外围设备成为。你可以通过树莓派内部的 `SoC` 将这些引脚连接到你的系统。这将有助于系统与外部组件之间的安全协作。它大约有
    40 个引脚，较新型号包括 `UART`、`12C` 和 `SPI` 连接。让我们看看树莓派引脚的一些功能。


    ### 1. GPIO（通用输入输出）引脚


    这些是能够发送或接收电流的数字引脚，你可以使用 `Python`、`node-Red`、`Python` 和其他编程语言调节它们的状态。它们的工作电压为 3.3
    伏，抽取约 16 mA 的电流。这些引脚使用 `SPI`、`UART` 和 `12C` 协议与各种设备接口。`GPIO3` 使用 `SCL` 和 `SDA`
    `12C` 引脚通过 `12C` 协议连接到系统。在使用这些引脚之前，你应该通过使用 `Raspbian` 操作系统配置系统以启用可以与之工作的接口。


    ### 2. 12C 引脚


    这是一种低速串行协议，通过 `1C` 标准连接设备。这些设备基于主从关系运行。它们通过制造商提供的地址，并使用 Linux 命令（如 `12C detect`）实现功能。这些引脚通过两个连接工作，如
    `SDA` 和 `SCL`，并向 `SDA` 连接发送或从中接收数据，其速度由 `SCL` 引脚调节。`12C` 引脚允许你向项目中添加温度传感器、模拟/数字转换器、`OLED`
    和 `LCD` 屏幕。


    ### 通用异步收发传输器 (UART) 引脚


    这些引脚在无头设置下通过控制台或终端登录发送 `GPIO14` 并接收 `GPIO15`。它连接了没有鼠标或键盘的 PI 设备。这可以通过网络或直接 USB
    连接实现。也可以使用运行终端控制台的计算机通过串口线或 `USB` 转串口板进行调节。此引脚是可靠的，并提供了无需额外工具即可立即使用 Pi 的权利。你必须通过在
    Pi 设备中配置串口控制台来启用此功能。


    ### 串行设备接口 (SPI) 引脚


    这些引脚帮助你将匹配良好的设备连接到你的 Pi。它与 `12C` 引脚一样，通过主从关系运行。`SPI` 引脚用于在微控制器与其他组件（如传感器、`SD cards`
    和移位寄存器）之间短距离发送信息。数据使用主设备（即 Pi）`GPIO11` 上的时钟 `SCLK` 进行同步。通过 `MOSI` 引脚从设备传输到 `SPI`
    组件，该引脚包括 `GPIO` `GPIO10`。`MOSI` 意味着主出从。该组件通过主从出 - `MISO` 引脚 (`GPIO9`) 发回数据来响应
    Pi。


    ### 3.3V 引脚


    3V 引脚为你的电子元件提供稳定的电源，并允许你测试 `LEDs`。你可以通过电阻将 LED 的阳极和长脚连接到 `3.3V` 引脚，而将短脚和阴极连接到
    `GND` 引脚。这种连接将使你的灯亮起来，以便你构建项目。


    ### 接地 (GND) 引脚


    这也被称为 `GND` 或 `gnd`。所有电压都从此引脚测量，并完成电路。它指的是零点，并将 LED 连接到电源，使 `GND` 成为电路系统的一部分。电流可以流过这个
    LED 产生光。Pi 设计有通过 `GPIO` 的 8 个 `gnd` 连接到单个地连接。


    ### 5V 引脚


    这些引脚允许直接访问来自适配器的 5 伏电源，确保 Pi 所需功率较少。它直接为你的单元供电，并在连接系统之前确保电压稳定适中。`5V` 引脚可以绕过保险丝和电压调节器等安全功能。


    ## 引脚的其他功能包括


    1. `GPIO12`、`GPIO13`、`GPIO18`、`GPIO19` 引脚支持 Pi 硬件上的脉宽调制 (`PWM`)。任何引脚的软件都可以支持此功能。

    2. `GPIO2` 和 `GPIO3` 引脚支持 `12 C` 接口。

    3. `GPIO14` 和 `GPIO15` 串口接口可以作为控制台。

    4. `GPIO8`、`GPIO7`、`GPIO10`、`GPIO9`、`GPIO11`、`GPIO17`、`GPIO18`、`GPIO1`、`GPIO21`、`GPIO20`
    提供串行设备接口 (`SPI`) 端口。


    ## 串口接口引脚


    如上所述，串口接口引脚包括 `GPIO8`、`GPIO7`、`GPIO10`、`GPIO9`、`GPIO11`、`GPIO17`、`GPIO18`、`GPIO1`、`GPIO21`
    和 `GPIO20`。


    ## 树莓派原型板


    原型板用于向 Pi 附加一些电子元件和传感器。树莓派原型板示例包括 `PiBreak Plus`。该板为所有 `GPIOs` 提供了标记的引脚。它具有带有焊盘和电源排的大原型表面，可安全地连接到电源。此板适用于所有带有
    40 针扩展头的树莓派型号，例如树莓派 Model A+`、树莓派 Model B+` 和树莓派 Model 2。


    ## 树莓派原型板的特征包括


    1. 它带有一个巨大的原型表面用于连接你的部件。

    2. 板载正反面都有引脚标记。

    3. 它带有螺丝、螺母、垫圈和垫柱，用于正确安装。

    4. 有 3.3 伏和 `GND` 电源轨。

    5. 板采用喷金 (`PCIB`) ENIG 工以增加耐用性。


