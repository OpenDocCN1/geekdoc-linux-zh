    # 第八章：主推子器与原型项目


    `Pi` 是一台微计算机，也被视为单板计算机 (`SBC`)。它可以在 Linux 操作系统和其他应用程序上运行。该设备对于各种数字项目非常有用，例如主推子器项目和原型项目。


    推子器（fader）是调音台必需的组件。它帮助你通过移动推子器来控制信号源。你可以通过改造键盘和鼠标在项目中使用 `pushbuttons`。它也可以通过
    `gainer`、`Arduino` 和 `MCK` 实现。这为在音频输入和输出中使用推子器提供了一种替代手段。


    主推子器提供了高效的采样分辨率和频率，范围从 `16bit` 到 `8-10bit`，包括 `44.1KHz` 到 `1KHz`。


    ## 主推子器项目要求


    主推子器项目的要求包括推子器、软件和焊接。其他包括 `1` 个热缩管、`1` 条双芯、`2` 个 `3.5mm 单声道插头`、剥线器、剪钳、吸锡器、万用表、带夹线和助焊夹。


    这些要求仅适用于变阻器类型的推子器，而不适用于光学类型。


    现在，推子 (`Fader`) 可以从损坏的调音台和电子元件商店获取。一些本地电子元件商店包括 `Digi-Key`、`RSin`、`Maplin`、`Tokyu-Hands`
    和 `RadioShack`。


    ## 如何组装硬件


    获取带有三个或更多连接器的推子器，并根据推子的布局修改其电阻，它是一种可变电阻。大多数调音台配有光学推子，特别是用于 `DJ crossfader`。


    `2` 个 `3.5mm 单声道插头` 用于音频输入和输出，一条双芯线作为扬声器线。你可以根据选择制作长度。获取 `one` 个热缩管用于连接推子器。


    获取两对电缆并剥去末端。焊接前检查推子器的连接器。某些推子有三个连接器。两个作为电阻，另一个用于接地引脚。通过万用表改变电阻值，你可以找到合适的连接器。


    将推子器焊接到电缆上。两根导线的每侧都应焊接到连接器的每个电阻侧。使用带有一个标记的电阻侧作为一侧。焊接前加上热缩管以使其牢固。


    扭转电缆的剪切侧以防膨胀。焊接后用热缩管覆盖连接器。


    之后，焊接接地，但要确保电缆的每个剪切侧都扭转以防止膨胀。贴上热缩管。


    将插头焊接到每根电缆的最后部分，但安装插头盖。电缆的剪切侧应扭转以防膨胀。焊接后装上插头盖。


    使用万用表测量插头之间的电阻。上侧应根据推子的位置修改。`gnd`（下侧）应为零。现在，你有一组开关、一根电缆和两个插头。


    连接音频输入和输出以完成完整的硬件。


    ## 运行软件


    在你的树莓派上打开程序的窗口或环境。可以是 `Flash`、`Pure Data`、`MaxMSP` 和 `SuperCollider`。任何可以处理音频输入输出的程序。


    你应该为音频输出分配一个音频信号，例如 `10000Hertz` 正弦波。为音频输入设置音量计算器。此项目需要 `Peakamp` 对象。


    为计算器添加一个接收器，例如 `multislider` 对象。


    开始音频，移动推子以接收连接。至此，你已准备好在项目中使用推子器。使用正弦波振荡器作为音频输入输出。


    ## 原型项目要求


    原型项目的要求包括电源、`555 astable`、二极管、电容和 9 电池。


    ## 如何组装硬件


    第一件事是使用地线连接到电源。这将从电源为电路供电。二极管防止反向，而电容用于平滑电流。可以使用 9V 电池。


    此设置完成后，`astable 555` 定时器向 `CD4029` 发送脉冲。电容和 `Potentiometer`（电位器）连接到 `7`、`2` 和
    `6` 引脚。这些脉冲来自 `pin 3`。


    使用万用表测量插头之间的电阻。上侧应根据推子的位置修改。`gnd`（下侧）应为零。现在，你有了一组开关、一根电缆和两个插头。


