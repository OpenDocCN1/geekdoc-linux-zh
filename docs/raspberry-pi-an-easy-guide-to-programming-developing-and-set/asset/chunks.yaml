    | 1. | Binary Numbers | ‘0B’ /   ‘0b’ |


    | 2. | Octal numbers | ‘0O’ /  ‘0o’ |


    | 3. | Hexadecimal numbers | ‘0X’ /     0x                                                                                                     
    |


    Look at these examples


    | # Output : 107print(0b1101011)#Output : 253  (251 + 2)print (0xFB + 0b10)#Output
    : 13Print(0o15) |


    Output:Run the program, you will have an output such as:


    | 10725313 |


    Types of Number Conversions in PythonNumbers can be converted through coercion.
    This is a process of converting one number into another. You can use operations
    like additions and subtractions to coerce integers to float automatically. This
    operation happens successfully if one of the operational figures is a float.For
    instance:


    | >>> 1 + 2.03.0 |


    In the statement above, I integer is coerced into 2.0 float through addition.
    The result of this coercion is also a floating-point number, 3.0.Another process
    is through integrated functionalities like int ( ), float ( ), and complex ( ).
    We can use these functionalities to convert numbers between types. Also, these
    functionalities can convert numbers from strings too.Examples


    | >>> int(2.3)2>>> int(-2.8)-2>>> float(5)5.0>>> complex(‘3+5j’)(3+5j) |


    The numbers are truncated, making the decimal parts to be removed if you are converting
    from float to integer.Using Python DecimalYou can make some amazing calculations
    using a built-in class float in Python. In Mathematical calculations, the sum
    of 1.1 and 2.2 = 3.3. However, in Python there is disagreement and discrepancy.


    | >>> (1.1 + 2.2) = 3.3False |


    This result implies that floating-point numerals are executed in computer hardware
    like binary fractions. This is the only type of figure the computer system understands:
    binary numbers 0 and 1 . Therefore, it will be complicated to store decimal fractions
    in your computer system.For instance, the fraction 2/6 cannot be represented in
    a computer as a decimal number. It will give us 0.33333333….. and this result
    is long. But the answer can be approximated.However, the decimal fraction 0.1
    will give us an incredibly long binary fraction of 0.0001100110011001100 …But
    there are the highest numbers of figures that the computer can accept and store.
    For this reason, we can approximate 0.1, and it cannot be equal. It is worthy
    of note that this shortfall is not an error from Python but due to limitations
    of the computer hardware.


    | >>> 1.1 + 2.23.300000000000003 |


    But, you can handle this discrepancy using the module for decimals built-into
    Python. Floating-point numbers have precision up to fifteen decimal places. It
    has a decimal module with user-settable accuracy.The difference between both results
    will show:


    | import decimalprint(0.1)print(decimal.Decimal(0.1)) |


    Output:


    | 0.10.100000000000000055511151231257827021181583404541015625 |


    You can use this module to perform the decimal calculations as we learned in the
    school. This format maintains the significance of values.Lists and DictionariesAs
    I said earlier, lists are like arrays used in other languages. It is a homogenous
    tool in Python making it significant in the program. A list contains datatypes
    known as integers, objects, and strings. Lists are mutable features in Python
    and can be altered after they are created.For example


    | # Python program to demonstrate# Lists# Creating a List with# the use of multiple
    valuesList = [“Books”, “For”, “Books”]print(“List containing multiple values:
    “)print(List[0])print(List[2])# Creating a Multi-Dimensional List# (By Nesting
    a list inside a List)List = [[‘Books’, ‘For’ ] ,  [‘Books’ ]]print(“\nMulti-Dimensional
    List: “)print(List) |


    Output:


    | List containing multiple values:BooksBooksMulti-Dimensional List:[[ ‘Books’
    , ‘For’], [ ‘Books’]] |


    DictionaryIn Python, the dictionary is an unorganized compilation of data values
    for storing values and characters like a map. Therefore, unlike different data
    types holding only a one value as an element, a dictionary contains the key:value
    pair. This is used for optimizing a dictionary. In a dictionary, each key-value
    pair is separated using a colon (: ). But each key in Python is divided by a comma
    (,).For example:


    | # Python program to demonstrate# dictionary#creating a Dictionary# with Integer
    KeysDict = {1: ‘Books’ , 2:  ‘For’ ,  3:  ‘Books’}print(“Dictionary with the use
    of Integer Keys: “)print(Dict)# Creating a Dictionary# with Mixed keysDict = {‘Name’
    : ‘Books’ ,  1:  [1,  2,  3,  4]}print(“\nDictionary with the use of Mixed Keys: 
    “)print(Dict) |


    Output:


    | Dictionary with the use of Integer Keys:{1:  ‘Books’ ,  2:  ‘For’ ,  3:  ‘Books’
    }{1:  [1,  2,  3,  4],   ‘Name’ :  ‘Books’} |


    Variations of List and Dictionary


    | S/N | List | Dictionary |


    | 1. | Indices of lists are integers beginning from 0.  | The keys of the dictionary
    are organized from any data type. |


    | 2. | You can create lists by placing elements in [ ] separated by “, ” comma.
    | Create a dictionary by placing elements in {} as “key”:” value,” each key-value
    pair is separated by commas “, .” |


    | 3. | Lists sustain and support the order of elements entered in the program.
    | The order is not maintained. |


    | 4. | Elements in lists can be accessed through indices. | Elements in the dictionary
    are accessed through key-values. |


    CHAPTER FOURUNDERSTANDING CLASSES, METHODS, AND MODULESIn python, classes are
    templates that can help you in creating or customizing your objects.  Variables
    and functions are encapsulated as a single entity. But objects generate their
    variables, features, and functionalities from classes.Some of the ideas to note
    for creating classes are that classes enable you to build a template for classifying
    things or objects generally. The classes created can be worked on or customized.
    Classes are objects used for producing samples of those templates where you can
    apply methods and other operations. You can organize, conceptualize, and build
    an organogram or hierarchy for any organization.Classes are used for defining
    procedures and relations for company, industrial, social, and other settings.
    This is an online data technology position.Here are features to consider before
    using classes in Python.


    1.  Create or develop a class and apply it.


    2.  Create or design a module before moving the class and launch to the module.


    3.  Go to a new program and call the module before using the class.'
