    ### What are Multiple Assignments and Multiple Return Values?

    Multiple assignments enable a person to assign multiple variables simultaneously
    in one line of code. This feature becomes easy after an initial attempt, but you
    should learn about it. However, recalling multiple assignments when you need them,
    most could be very difficult. Multiple assignments mean the same thing as iterable
    unpacking and tuple unpacking. These three expressions could be used together
    in Python programming, but they say the same thing. Look at an example of multiple
    assignments in Python:


    | `>>> x, y = 10, 20` |


    In this sample, `x` is set to 10 while `y` is set to 20. At a lower level, we
    have created tuples of 10 and 20. We can circle over the tuple and take each item
    from the looping and transferring them to the variables `x` and `y` serially.
    This is clearly expressed in this syntax:


    | `>>> x, y = 10, 20` |


    In Python, parenthesis are applied as optional features in tuples and optional
    in multiple assignments. This functions with a tuple-like syntax. Therefore, in
    these expressions below all the figures are equivalent.


    | `>>> x, y = 10, 20`

    `>>> x, y = (10, 20)`

    `>>> (x, y) = 10, 20`

    `>>> (x, y) = (10, 20)` |


    Multiple assignments are also known as tuple unpacking, as they are commonly used
    with tuples. However, multiple tasks could be used with any iterable and not just
    tuples.


    #### Using Multiple Assignments with a List


    | `>>> x, y = [10, 20]`

    `>>> x10`

    `>>> y2o` |


    #### Using Multiple Assignments with a String


    | `>>> x, y = ‘hi’`

    `>>> x‘hi’`

