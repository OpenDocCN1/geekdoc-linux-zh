    # CHAPTER THREE: WHAT ARE DICTIONARIES, LISTS, AND STRINGS?

    There are some built-in structures in Python. These include dictionaries, lists,
    strings, and other structures.


    ### Dictionaries

    Dictionaries in Python are used for storing data in a key-value pair format. They
    are the data type that can simulate real-life data arrangement in Python. In this
    case, some peculiar values exist for some specific keys. This data structure is
    mutable. But dictionaries are expressed as values and element keys.


    #### Values

    In Python, values are expressed as lists, integers, tuples, etc.


    #### Element Keys

    Element keys are defined as single element keys.


    A dictionary is the collection of key-value pairs, which can be any Python object.
    But the keys are immutable.


    ### How to Create Dictionaries

    You can create dictionaries using key-value pairs that are enclosed with curly
    brackets such as `{}`. Each key in the dictionary is separated from the figures
    using a colon (:). Here is the syntax to define the dictionary:


    ```python

    Dict = {"Name": "John", "Age": 30}

    ```


    In this expression, you will see the dictionary; `Name` and `Age` are the strings.
    Create a dictionary and print its content. Look at this example:


    ```python

    Employee = {"Name": "Thompson", "Age": 40, "salary": 35000, "Company": "GOOGLE"}

    print(type(Employee))

    print("printing data ... ")

    print(Employee)

    ```


    **Output:**

    ```

    <class ''dict''>

    printing data ...

    {''Name'': ''Thompson'', ''Age'': 40, ''salary'': 35000, ''Company'': ''GOOGLE''}

    ```


    Python offers built-in `dict()` method. This feature is used for creating a dictionary.
    The curly braces `{}` with no value or object are used for generating an blank
    dictionary.


    ```python

    # Creating an empty Dictionary

    Dict = {}

    print("Empty Dictionary: ")

    print(Dict)


    # Creating a Dictionary with dict() method

    Dict = dict({1: ''Java'', 2: ''T'', 3: ''Point''})

    print("\nCreate Dictionary using dict(): ")

    print(Dict)


    # Creating a Dictionary with each item as a Pair

    Dict = ([(1, ''Devansh''), (2, ''Sharma'')])

    print("\nDictionary with each item as a pair: ")

    print(Dict)

    ```


    **Output:**

    ```

    Empty Dictionary:{}

    Create Dictionary using dict(): {1: ''Java'', 2: ''T'', 3: ''Point''}

    Dictionary with each item as a pair: [(1, ''Devansh''), (2, ''Sharma'')]

    ```


    ### How to Access the Values of Dictionaries

    Earlier in this chapter, we have discussed the way to access lists and tuples
    using indexing features. But you can access the values in the dictionary using
    keys because these keys are peculiar in the dictionary of Python programs. The
    values of a glossary are accessed through the following steps.


    ```python

    Employee = {"Name": "James", "Age": 25, "salary": 28000, "Company": "GOOGLE"}

    print(type(Employee))

    print("printing data ....")

    print("Name : %s" % Employee["Name"])

    print("Age : %d" % Employee["Age"])

    print("Salary : %d" % Employee["salary"])

    print("Company : %s" % Employee["Company"])

    ```


    **Output:**

    ```

    <class ''dict''>

    printing data ....

    Name : James

    Age : 25

    Salary : 28000

    Company : GOOGLE

    ```

