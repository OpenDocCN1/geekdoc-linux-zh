  trans: "\n\n15. `Scrollbar` 小部件 – 用于滚动各种部件，如 `listboxes`。\n\n16. `Scale` 小部件 – 用于提供滑动条部件。\n\
    \n17. `Radiobutton` 小部件 – 使用此功能可以将某些选项以单选按钮的形式显示。用户一次只能选择并操作一个选项。\n\n18. `Message`\
    \ 小部件 – 用于显示多文本字段并接收用户输入。\n\n## Hello World 和温度转换器如何在 GUI 中运行\n\n正确理解 GUI 将增强你对温度转换器工作原理的认知。该项目涉及摄氏度到华度的转换。按照应用程序中的流程操作并将代码复制到你的\
    \ Python 编辑器中实现。\n\n```python\nimport Tkinter as tk\n# 声明全局变量\ntemp_c = None\n\
    temp_f = None\n\n# 每当按钮被按下时都会调用此函数\ndef convert ( ):\n    global temp_c\n    global\
    \ temp_f\n    # 将摄氏度转换为华度并更新标签（通过 textvariable）\n    try:\n        val = temp_c.get()\n\
    \        temp_f.set((val * 9.8 / 5) + 32)\n```\n\n在运行之前，将其命名为 `tkinter_temp_converter.py`。将弹出一个新窗口，其中包含一个输入数字的部分（代表摄氏度）。点击“Convert\
    \ 按钮”，相应的华度温度将会出现。这将显示在华氏度旁边的标签中。\n\n## 理解 Listbox 和 Spinbox\n\n`Listbox` 组件用于显示项目列表，用户可以从中选择各种项目。\n\
    \n### 创建 Listbox 的简单语法\n语法包括\n\n```python\nw = Listbox ( master, selection, …\
    \ )\n```\n\n### 使用 Listbox 的参数\n使用 `Listbox` 的参数涉及 `master` 和 `options`。\n\n1.\
    \ `master` – 用于父窗口。\n2. `options` – `Listbox` 小部件最常用的选项包括以下内容，这些以以键值对的形式表示，并用逗号分隔。\n\
    \    - `height` – 这是 `Listbox` 中显示的行数。默认值为 10。\n    - `font` – 指明应用于 `Listbox`\
    \ 内容的字体。\n    - `highlightcolor` – 代表当小部件处于焦点时，焦点高亮显示的颜色。\n    - `relief` – 用于选择\
    \ 3D 边界阴影效果，默认是 sunken（凹陷）。\n    - `selectmode` – 用于确定可以选择的项目以及鼠标拖动如何影响你的选择。这些选项包含了\
    \ `single`、`extended`、`multiple` 和 `browse` 等功能。\n    - `highlighthickness` –\
    \ 显示焦点高亮的厚度。\n    - `Selectbackground` – 显示选中文本的背景颜色。\n    - `bd` – 指示器边界的大小。\n\
    \    - `yscrollcommand` – 通过此，用户可以垂直滚动 `Listbox`。它将你的 `Listbox` 小部件链接到垂直滚动条。\n\
    \    - `cursor` – 每当鼠标悬停在 `Listbox` 上时出现。\n    - `fg` – `Listbox` 内文本的颜色。\n  \
    \  - `xscrollcommand` – 帮助用户水平滚动 `Listbox`。通过此，你可以将你的 `Listbox` 小部件链接到水平滚动条。\n\
    \    - `bg` – 代表带有指示器的标签后面的标准背景颜色。\n\n### Listbox 对象的方法\n这些方法包括：\n\n1. `delete\
    \ ( initial, end=None )` – 此方法消除位于第一个和最后一个范围内的行。如果删除了随后的行，则选择带有索引 `first` 的孤立行。\n\
    2. `get (initial, end=None )` – 此方法返回一个包含从第一个到最后一个行的键值文本的元组。如果省略了第二行，它将替换第一行旁边那行的行的文本。\n\
    3. `index ( i )` – 尝试对 `Listbox` 中可见的元素进行定位。这使得索引为 `i` 的列位于小部件的顶部部分。\n4. `curselection()`\
    \ – 此方法返回一个包含所选元素/元素行号的元组，从 0 开始计数。如果未选择任何内容，则返回一个空元组。\n5. `Activate ( index )`\
    \ – 有助于选择由给定框指定的行。\n6. `size (` – 用于返回 `Listbox` 中的行数。\n7. `xview()` – 使 `Listbox`\
    \ 可以水平滚动。它将关联水平滚动条的 command 设置为此格式。\n8. `xview_moveto ( fraction )` – 该方法滚动 `Listbox`，使其最宽列的左侧位于\
    \ `Listbox` 的左侧之外。该部分范围在 `[0,1]` 之间。\n9. `yview()` – 使 `Listbox` 可以垂直滚动。它将关联滚动条的\
    \ command 设置为此方法。\n10. `yview_moveto ( fraction )` – 此方法将 `Listbox` 滚动到宽的上部。如果第一行在\
    \ `Listbox` 的左侧之外。比例范围在 `[0,1]` 之间。\n11. `see ( index )` – 调整 `Listbox` 的位置，使\
    \ `index` 指定行可见。\n12. `yview_scroll (number, what )` – 有助于垂直滚动 `Listbox`。它使用任一单位根据\
    \ `what` 参数滚动行。它使用页码按 `Listbox` 的高度进行导航，而 `number` 参数决定滚动多少。\n13. `xview_scroll\
    \ ( number, what)` - 此方法水平滚动 `number`。它使用任一单位根据 `what` 参数按 `Listbox` 的宽度滚动字符。然而，`number`\
    \ 参数决定滚动多少。\n14. `nearest ( y )` – 它将 `Listbox` 中可见元素放置为行 `i` 位于小部件顶部。\n\n## Spinbox\n\
    这是通常 Tkinter `Entry` 小部件的替代方案，用于选择固定数量的元素。\n\n### Spinbox 的语法\n创建此小部件的简单语法涉及\n\
    \n```python\nW = Spinbox ( master, selection, … )\n```\n\n### Spinbox 的参数\n包含\n\
    1. `master` – 代表父窗口。\n2. `options` – 包含此小部件常用的替代方案列表。\n\n"
- fmt: "\n# Detailed analysis of these options includes CHAPTER SEVEN HARDWARE INTERFACES\
    \ IN RASPBERRY\n\nThis device is designed with hardware interfaces for proper\
    \ functionality. This is a low-cost single-board computer device for learning.\
    \ The Raspberry Pi Foundation, a non-profit organization built this system. This\
    \ device has different models from Raspberry Pi Zero to Raspberry Pi 3 is made\
    \ with a 40-pin heard connector. They offer entrance to the `GPIO` pins with some\
    \ other functionality. The header offers accessibility to 26 `GPIO` pins with\
    \ 5 volts and 3.3 volts, including other individual pins for an `ID EEPROM` function.\
    \ \n\n## Pin Connections in GPIO\n\nThese 26 `GPIO` pins could be configured especially\
    \ as input pins or output pins. The system uses 3.3 volts, which is the nominal\
    \ volt. Higher voltage, such as 5 volts, is dangerous to your device. Unconnected\
    \ pins come with undefined levels of logic, but you can force separate pins to\
    \ high or low level using pullup or pulldown resistors. This exercise is carried\
    \ out in hardware with external resistors, but you can apply it to the software\
    \ too. `GPIO` pins and `GPIO3` pins are designed with permanent pull-up resistors\
    \ on the board. However, other `GPIO` pins are configured in the software for\
    \ providing a pull-up or pull-down resistor. In most cases, they offer no resistance\
    \ at all.\n\n## Functions of Pins\n\nThe general purpose input and output (`GPIO`)\
    \ pins are configured to provide various functions even beyond the primary digital\
    \ input and output. All pins display similar functions, but some have unique features\
    \ and services. These pins can help a programmer to design various projects such\
    \ as robots, retro games, weather stations, and other mighty machines with a Pi.\
    \ These pins make it possible to use motors, lights, sensors, and other peripherals.\
    \ You can connect these pins to your system through the `SoC` located within the\
    \ Raspberry Pi. This will facilitate secure collaboration between your system\
    \ and external components. It has about 40 pins, including `UART`, `12C`, and\
    \ `SPI` connections for the newer models. Let’s look at some of the functions\
    \ of pins in a Raspberry Pi.\n\n### 1. GPIO (General Purpose Input Output) pins\n\
    \nthese are digital pins that can send or receive current, and you can regulate\
    \ their state using `Python`, `node-Red`, `Python`, and other programming languages.\
    \ It operates with a voltage of 3.3 volts and draws about 16 mA of current. These\
    \ pins interface with various devices using `SPI`, `UART`, and `12C` protocols.\
    \ `GPIO3` use `SCL` and `SDA` `12C` pins to connect to systems through `12C` protocols.\
    \ Before using these pins, you should enable the interfaces that can function\
    \ with them by configuring your system using the `Raspbian` operating system.\n\
    \n### 2. 12C Pins\n\nThis is a serial protocol with low speed for connecting devices\
    \ through the `1C` standard. These devices operate on a master-slave relationship\
    \ basis. They function through addresses given by the manufacturers using Linux\
    \ commands such as `12C detect`. These pins function with two connections, such\
    \ as `SDA` and `SCL`, and send data to or from the `SDA` connectivity with its\
    \ speed regulated by the `SCL` pin. `12C` pins enable you to add temperature sensors,\
    \ analog, digital converters, `OLED`, and `LCD` screens to your projects.\n\n\
    ### Universal Asynchronous Receiver or Transmitter (UART) Pins\n\nThese pins send\
    \ `GPIO14` and receive `GPIO15` with a console or terminal login headless setup.\
    \ It links your PI device without a mouse or keyboard. This is possible through\
    \ a network or direct USB connection. It can also be regulated using a serial\
    \ cable or `USB` to serial board from a computer operating a terminal console.\
    \ This pin is reliable and offers instant right to use your Pi without extra tools.\
    \ You must enable this function by configuring the serial console in your Pi device.\n\
    \n### Serial Peripheral Interface (SPI) pins\n\nThese pins help you to connect\
    \ well-matched devices to your Pi. It functions through a master-slave relationship\
    \ with devices just like the `12C` pins. `SPI` pins are used for sending info\
    \ over short ranges between microcontrollers and other components such as sensors,\
    \ `SD cards`, and shift registers. The data is synchronized using a clock such\
    \ as `SCLK` at `GPIO11` from the master, which is the Pi. This is transmitted\
    \ from the device to the `SPI` component through the `MOSI` pin, which include\
    \ `GPIO` `GPIO10` pins. `MOSI` means Master Out Slave In. This component replies\
    \ to Pi by sending back data through the Master In Slave Out - `MISO` pin (`GPIO9`).\n\
    \n### 3.3V Pins\n\n3V pins provide a stable power supply to your electrical components\
    \ and enable you to test `LEDs`. You can connect the anode, and the long leg of\
    \ the LED to the `3.3V` pin through a resistor while the shorter leg and cathode\
    \ are connected to the `GND` pins. This connection will enable your lights to\
    \ shine for you to build your projects.\n\n### Ground (GND) Pins\n\nThis is also\
    \ called `GND` or `gnd`. All voltages are measured from this pin, and it completes\
    \ an electric circuit. It refers to a zero point and connects LED to a source\
    \ of power, making the `GND` part of the circuit system. The current can flow\
    \ through this LED to produce light. A Pi is designed with 8 `gnd` connections\
    \ through the `GPIO` connecting to a single ground connection.\n\n### 5V Pins\n\
    \nThese pins enable direct access to the supply of 5 volts from the mains adaptor\
    \ ensuring less power required by the Pi. It powers your unit directly but ensures\
    \ a stable and moderate voltage before connecting your system. `5V` pins can bypass\
    \ safety features such as fuse and voltage regulator. They could avoid these regulators\
    \ from damaging your device.\n\n## Other functionalities of these Pins include\n\
    \n1. Pins `GPIO12`, `GPIO13`, `GPIO18`, `GPIO19` supports pulse width modulation\
    \ (`PWM`) on the hardware of Raspberry Pi. The software of any pin can also support\
    \ this functionality.\n2. `GPIO2` and `GPIO3` pins support the `12 C` interface.\n\
    3. The serial interface of `GPIO14` and `GPIO15` pins can be used as serialized\
    \ console.\n4. `GPIO8`, `GPIO7`, `GPIO10`, `GPIO9`, `GPIO11`, `GPIO17`, `GPIO18`,\
    \ `GPIO1`, `GPIO21`, `GPIO20` provides serial peripheral interface (`SPI`) ports.\n\
    \n## Pins in Serial Interface\n\nAs I stated above, the pins in the serial interface\
    \ include `GPIO8`, `GPIO7`, `GPIO10`, `GPIO9`, `GPIO11`, `GPIO17`, `GPIO18`, `GPIO1`,\
    \ `GPIO21`, and `GPIO20`.\n\n## Prototyping Boards in Raspberry\n\nPrototyping\
    \ boards are used for attaching some electronic components and sensors to a Raspberry\
    \ Pi. Examples of prototyping boards in a Raspberry Pi include `PiBreak Plus`.\
    \ This board provides labeled escaping pins for all `GPIOs`. It is a huge prototyping\
    \ surface with solder pads and power bar for a secure connection to a power source.\
    \ This board is well-suited with all models of Raspberry Pi and other boards with\
    \ a 40-pin extension header such as Raspberry Pi Model A+`, Raspberry Pi Model\
    \ B+`, and Raspberry Pi Model 2.\n\n## Features of Prototyping Boards in Raspberry\n\
    \nThe features of these boards include:\n\n1. It comes with a large prototyping\
    \ surface to connect your parts.\n2. The board has pinout markings on the top\
    \ and bottom.\n3. It has bolts, nuts, washers, and spacers for proper mounting.\n\
    4. There are 3.3volts and `GND` power rails.\n5. The board is gold-plated (`PCIB`)\
    \ ENIG for durability.\n"
