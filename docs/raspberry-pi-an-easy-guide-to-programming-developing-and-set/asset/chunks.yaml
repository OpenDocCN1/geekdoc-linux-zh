    # Specifications of the Hardware of Raspberry Pi


    1. It has Bluetooth of 4.1.

    2. The video outputs include `PAL` and `NTSC` (composite video) using 3.5 mm jack
    and `HDMI`.

    3. Four `USB` ports.

    4. A `CPU` with Quad-core 64-bit `ARM Cortex A53` reached at 1.2 GHz.

    5. The device weighs 1.6 oz (45g).

    6. The power source is 5 volts with `GPIO` header or `MicroUSB`.

    7. The size of the Raspberry Pi is 85.60 mm × 56.5 mm.

    8. The memory has `1 GB LPDDR-900 SDRAM` with `Linux` Operating System. That is
    900 megahertz (MHz).

    9. `Raspbian` has a network of `10/100 Mbps Ethernet` and `802.1In` Wireless LAN.

    10. The `GPU` has a 400 megahertz (MHz) Video core IV multimedia.

    11. The peripherals `17 GPIO` with specific functions and `HAT ID` bus. own12.
    Other specifications include a `USB` mouse, `USB WiFi` adaptor.


    ![Inner components of a Raspberry.png](Image00003.jpg)


    ## Specifications of a Raspberry Pi


    This microcomputer is an educational tool with hardware having the following specifications:
    `GPIO` pins, power source connector, central processing unit (`CPU`), random access
    memory (`RAM`), `Xbee` socket, `GPU`, and `UART`.


    Raspberry Pi has mass storage using an `SD` flash memory card. Your PC boots into
    `Microsoft windows` through the hard disk while an `SD` memory card helps the
    `Raspbian` to boot. Other specifications of the hardware include a US standard
    keyboard, video cable, power supply cable, monitor, and a `microSD` card having
    `Linux` operating system.


    Other optional specifications you may need include device case, `model A` or `model
    B`, `WiFI` adaptor, internet connectivity, `USB` mouse, and powered `USB` hub.
    Use a `LAN` cable for internet connectivity to the `B` model.


    Detailed explanations of all the specs include


    ### The Central Processing Unit (CPU)


    The `CPU` serves as the brain and hub of your system. It performs instructions
    in the computer using logical and mathematical functions. Raspberry Pi uses the
    `ARM11` series processor functioning in the capacity of `Samsung Galaxy`.


    ### The Ethernet Port


    This port is designed for accessing the internet by plugging your home router.
    It is the gateway for interacting with other devices.


    ### The Graphics Processing Unit (GPU)


    You can speed up calculating image functions using the `GPU`. This is a single
    chip on the board of your Raspberry Pi, and the `GPU` supports `OpenGL`. It is
    also built using a `Broadcom video-core IV`.


    ### General Purpose Input & Output (GPIO) Pins


    You can associate and interact with other electronic boards using the `GPIO` pins.
    Depending on the way you programmed your Raspberry Pi, these pins can receive
    and process input and output commands. It can function with digital `GPIO` pins
    too. Other electronic units are connected to the `Raspbian` through these pins.
    For instance, you can transmit digital data by connecting the general-purpose
    input & output pins to the temperature sensor.


    ### Raspberry Pi Memory


    If you compare Raspberry Pi to other computer devices, it is a miniature PC. Other
    standard computers have `RAM` measured in gigabytes, but the `RAM` of a `Raspbian`
    contains a minimum of `256 MB` while the maximum `Ram` is `512 MB`.


    ### The Universal Asynchronous Receiver / Transmitter (UART)


    The `UART` is a serial input and output port used for transferring serial data
    like a text. Programmers use it for debugging and converting codes.


    ### Display Monitors or TV


    Raspberry Pi board uses two monitors or television for displaying digital data.
    These include `HDMI` and `Composite` displays. Use a low-cost adaptor with an
    `HDMI` male cable to connect several `LCD` and `HD TV` monitors. The versions
    of `HDMI` supported by your Raspberry Pi are `1.3` and `1.4` using `1.4` cables
    too. These can help the functions of the video and audio settings of Raspberry
    Pi. However, it does not support the `HDMI l/p` adapter. The composite video functions
    are used for connecting old televisions. In this case, connecting the device to
    a display unit using a composite video connection can make the audio system functional.
    Connect the `3.5 mm jack` socket and send it to your television. This is possible
    using a cable that is adjustable for `3.5 mm` to double the `RCA` connection.


    ### Power Source Cable or Connector


    You can power your microcomputer using an external power source. This is a small
    switch beside the shield.


    ### XBee Socket


    This feature in the board of a Raspberry pi is used for wireless communication.


    ## The Board of Raspberry Pi Model A


    The board of `model A` is designed as a `Broadcom (BCM2835)` `SOC` board. This
    model is made with an `ARM1176JZF-Score` `CPU`. It has an `SD` card of `256 MB
    RAM` with `700 megahertz (MHz)`.


    The `USB 2.0` ports features external data connectivity, which is an optional
    tool in the system. The board is powered through a `micro-USB` adapter. This adapter
    carries a minimum power range of `2 W`. You can also speed up image calculations
    features using the graphics, which is a special chip in the system. It is a built-in
    structure with `Broadcom video-core IV` cable. This feature is relevant for running
    a video or game through the Raspberry Pi.


    ### The Features of the Board of Model A Raspberry Pi


    The board of `model A` Raspberry Pi has unique features such as:


    1. The dimensions of its board are `8.6 cm × 5.4 cm × 1.5 cm`.

    2. There is a slot for `SD`, `SDIO`, and `MMC` cards.

    3. The `SD` card `RAM` is `256 MB`.

    4. The video output is composite featuring `RCA` (`NTSC` and `PAL`), and `HDMI`
    with cables versions `1.3` and `1.4`.

    5. It has an audio output with a `3.5 mm jack`.

    6. Its system functions with `Linux`.

    7. It has a full processor with `Broadcom BCM2835`.

    8. The `2.0 USB` connector is single.

    9. The board has a dual-core `video-core IV multimedia coprocessor`.


    ## The Board of Raspberry Pi Model B


    Model B features a `Broadcom (BCM2835)` `SOC`. The board has an `SD` card of `512
    MB RAM` with `700 MHz`. The `CPU` core is `ARM1176JZF-S`. The `USB 2.0` ports
    features external data connectivity. You can only connect with other system through
    the web in model B using the Ethernet. This system is powered with a `micro USB`
    adapter. The minimum range of power needed is `2.5 W`. The graphics feature a
    specialized chip. This is used for speeding up the image calculations. Running
    a game or video using your system is possible, as it has a built-in `Broadcom
    video-core IV` cable.


    ### The Features of the Board of Model B Raspberry Pi


    1. The dimensions are `8.6 cm × 5.4 cm × 1.7 cm`.

    2. The board storage has `SDIO`, `SD`, and `MMC` slots.

    3. It has `10/100 Ethernet RJ45 jack`.

    4. The `2.0 USB` connector is single.

    5. The board has a dual-core `video-core IV multimedia coprocessor`.


    ## Functionalities of Raspberry Pi


    Raspberry Pi can be applied in various computerized projects such as controlling
    robots, `internet Radio`, `carputer`, `media streaming`, `Arcade machine`, `home
    automation`, and a `tablet computer`. Other projects include cosmic equipment,
    `coffee`, and hunting for meteorites.


    ### Detailed Explanations of these Projects


    1. Using Raspberry Pi for controlling the Velocity of a `DC motor`

