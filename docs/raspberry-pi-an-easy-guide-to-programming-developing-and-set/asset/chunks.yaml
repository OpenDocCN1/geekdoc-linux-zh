    # Numbers and Variables


    Numbers and variables in Python refer to numerical variables.


    ## Python Numbers

    In `Python`, digits are stored as floating-point values, integers, and complex
    numbers. This also depends on the requirements of the program. There are two types,
    which are the floating-point values and integer.


    ## Python Variables

    A variable refers to the position of memory in the system and as an identifier
    used for holding values. `Python` is an inferred language and doesn''t need specifying
    types of variables.

    Variables are groups of letters and digits (numbers). However, they start with
    a note or an underscore (`_`). In writing variables, you can use lower case letters
    for names of variables such as `John` and `john` are two separate variables.


    ## Types of Numerical Variables

    Two kinds of numerical variables are available.


    ### Integers

    Integers are numerical values consisting of whole numbers such as `1`, `2`, `3`,
    `10`, `20`, `100`, `2000`, `50,000`, `1000000`, `10,000,000`, etc. You apply this
    variable in `Python` by writing any whole number, as shown above.


    #### Examples

    The expression `x = 2` means that the integer number `2` will be stored in the
    variable `x`. `x` is the variable, and `2` is the number, hence the tag ''numerical
    variables''. If you are using 64-bit systems, you can store whole numbers between
    the values of `4000338912344092341` and `4000338912344092340` in an integer variable
    Python platform.


    ### Floating-Point Values

    Floating-point values are Python numbers with decimal points. Any number written
    with a decimal part is identified as a floating-point value.

    Therefore, a term like `x = 6.5` means that the floating-point value `(6.5)` is
    stored in the variable `x`. Moreover, vast numbers could be stored in this way,
    such as `3.2250738585072015 × 10308` to `2.7976931348623157 × 10308`.

    Integer numbers could be converted to floating numbers using the `float` number
    functionality. For example:


    ```python

    X = 6

    print(x)

    print(float(x))

    ```


    If this expression is executed, the code can produce an output such as:

    ```

    5.0

    ```


    However, you can convert a floating-point value to an integer number by using
    the integer-number functionality. Look at what will happen by dividing two integer
    numbers:


    ```python

    x = 5

    y = 2

    z = x / y

    print(z)

    ```

    Output: `2.5`


    In the expression above, numerical (numbers) are defined as integers (whole numbers).
    The result of this operation was a floating-point number. It is a `Python 3.x`
    feature – `Python 2.x` that would operate integer division and return the result
    of `2`.


    ## Variables Used for Identifier Naming

    Variables are applied for identifier naming. Programmers use it for identifying
    literals in the program. Here are various ways to name an identifier in an expression:


    1. There should be no whitespace and special characters in an identifier name.
    Examples of such characters include `#`, `^`, `%`, `=`, `!`, `&`, etc.

    2. In `Python`, identifier names are case sensitive. That means `''my book''`
    and `''MyBook''` is not the same expression.

    3. Valid identifiers in a statement include `n_9`, `_n`, `a123`, and so on.

    4. Invalid identifiers in a statement include `n 9`, `n%4`, `1a`, and so on.

    5. The names of an identifier must be similar to the keywords expressed in the
    language.

    6. The variable must begin with characters such as an underscore (`_`) or an alphabet.

    7. In a `Python` statement, every letter except the first character could be an
    alphabet of an upper case such as `A`, `B`, `C`, `D`, …,, or a lower case as `a`,
    `b`, `c`, `d`,’. It could also be a digit such as `1`, `2`, `3`, `4`, …, or an
    underscore (`_`).


    ## How to Declare Variables and Assign Values

    You don''t have to declare variables before applying them in the program. `Python`
    enables you to form a variable at the right time when they are needed in an expression.

    Variables are defined and declared immediately and automatically by assigning
    a value them. Use the sign (`=`), ''equals'' in a statement to declare a variable.
    This mark assigns rates to variables.


    ## How to Reference Objects in Python

    As a programmer, you need to understand how to reference objects in `Python`.
    This defines the way `Python` interpreter functions as you declare a variable.
    The way you handle variables is different from other programming languages.

    Experience programmers understand that `Python` features as a highly object-oriented
    programming language. Therefore, all data items belong to a particular type of
    class. For example:


    ```python

    print("James")

    ```

    Output: `James`


    An integer is created by the `Python` object and highlights it to the console.
    I created a string object in the above `print` statement. Another way to determine
    this is using the built-in `type()` functionality. For example:


    ```python

    type("James")

    ```

    Output: `<class ''str''>`


    In `Python` programs, variables are classified as symbolic names functioning as
    pointers or references to objects in a statement. The variables are used to assign
    names to objects. For example:


    ```python

    b = 20

    ```

    `b` is the object.

