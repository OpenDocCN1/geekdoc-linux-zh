    `F5`。该程序的结果将打印在带有 `IDLE` 字样的窗口上。结果将显示在 `Restart` 行下方。


    ## Python IDE 的类型

    软件开发中使用的不同类型的 Python IDE 有 Atom、Thonny、Eric、Rode、Spyder、PyCharm、Wing、Microsoft
    Visual Studio、Jupyter Notebook 和 PyDev。


    ### Atom IDE

    `Atom IDE` 由 GitHub 构建，是一个开源跨平台工具。该框架使用 `electron` 来增强跨平台桌面应用程序。该平台结合 `Node.js`
    和 `Chromium` 运行，目前被称为可黑客化的文本编辑器。


    此集成开发环境的特性包括：

    1. 在 Atom 上查看输出不需要打开另一个窗口。

    2. Atom 具有内置支持，可以使用名为 `Markdown Preview Plus` 的插件来查看和编辑 `Markdown` 文件。


    ### Thonny IDE

    学习或教授编程语言需要你使用 `Thonny IDE`。该软件由塔尔图大学构建构建构建。它对于高亮语法错误和支持代码补全过程有用。此 IDE 的一些功能包括：

    1. 有用的代码自动补全和错误高亮。

    2. 它作为一个简单的调试器使用。


    ### Eric IDE

    `Eric IDE` 是由 Python 开发的一个编辑器程序。对于专业程序员和业余爱好者来说非常有价值。该软件的功能包括：

    1. 带有内置调试器的任务管理支持。

    2. 具有源代码折叠、编辑器和可配置的窗口布局。

    3. `Eric` 用于版本控制和高级项目管理。


    ### Rodeo IDE

    使用 `Rodeo Integrated Development Environment` 可以从各种源检索数据和信息。它被认为是程序的理想 IDE。该软件用于代码的自动补全，并支持跨平台功能。该程序的特性包括：

    1. 语法高亮、代码自动补全和可视化文件导航。

    2. 增强你绘图、交互、检查和比较数据的技能。


    ### Spyder IDE

    `Spyder` 是数据科学的理想选择，开源且在 IDE 市场上具有很高的知名度。这意味着科学 Python 开发环境 (Spyder)。该程序接受并运行所有相关平台，如
    `MacOS X`、`Windows` 和 Linux 操作系统。`Spyder IDE` 提供多种功能，如文档查看器、集成控制台、本地代码编辑器和变量资源器。此
    IDE 还支持其他科学模块，如 `SciPy`、`NumPy` 等。该程序的各种特性包括：

    1. 与 `IPython` 控制台安全集成。

    2. 在代码自动补全模式和多语言编辑器中正常运行。

    3. 它提供了带有语法高亮功能的更好的代码自动补全。


    ### PyCharm IDE

    `PyCharm` 由 JetBrains 构建，一种用于跨平台的集成开发环境 (IDE) Python 软件。此 IDE 提供免费版和付费 (PRO) 版本，它是使用最广泛的开源程序。它帮助开发者和程序员处理常规任务。`PyCharm`
    是一个完整的 IDE，具有快速错误检查和纠正、数据库访问、代码自动补全、快速项目导航和远程开发支持。该程序的特性包括：

    1. 它有助于高亮错误。

    2. 增强了 Python Web 开发框架，如 `Javascript`、`Angular JS` 等。

    3. `PyCharm` 作为一个强大的调试器运行。

    4. 它对于智能代码导航非常有价值。


    ### Wing IDE

    `Wing IDE` 包含了体面且必要的开发支持功能。这个跨平台工具为初学者提供免费版，尽管它有一个带有 30 天试用期的 Pro 版本。这将使学习者和经验丰富的程序员尝试它。此
    IDE 程序提供调试、自动补全、语法高亮和缩进等服务。`Wing IDE` 的主要特性是：

    1. wing 可以通过扩展进行自定义。

    2. 此 IDE 增强了远程开发和测试驱动开发以及单元测试。


    ### Microsoft Visual Studio IDE

    现在，你可以使用 `Microsoft Visual Studio` 开发和调试最新的云或 Web 项目。它是一个带有扩展市场的开源代码编辑器。其特性包括：

    1. 对于在 `Visual studio` 中编写程序非常有价值。

    2. 可以在免费版和 PRO 版本中找到。


