- fmt: "\n# 1. Install the LÖVE Program\n\nThe first step is to install the LÖVE program\
    \ following an easy command on the device.\n\n```bash\n$ sudo apt install love2d\n\
    ```\n\nIf you are running [Fedora](https://opensource.com/article/17/3/how-install-fedora-on-raspberry-pi)\
    \ on your Pi, you can use `dnf` instead of LÖVE software.\n\n```bash\n$ sudo dnf\
    \ install love2d\n```\n\nHowever, by installing either of these applications,\
    \ you have introduces `Lua`, `SDL`, or other apps that LÖVE needs to run on your\
    \ device.\n\n## Begin with Hello, World! Program\n\nThe LÖVE engine exists as\
    \ a framework enabling you to use any text editor of your choice in programming\
    \ your games. Begin with the “hello world!” program. Ensure this program launches\
    \ on your device and introduces the basic syntax of both the LÖVE framework and\
    \ the Lua language. Go to your system, open a text editor, and enter this text:\n\
    \n```lua\ncwide = 520\nchigh = 333\nlove.window.setTitle('  Hello World ')\nlove.window.setMode(cwide,\
    \ chigh)\nfunction love.load()\n    love.graphics.setBackgroundColor(177, 106,\
    \ 248)\n    -- font = love.graphics.setNewFont(\"SkirtGirl.ttf\", 72)\nend\nfunction\
    \ love.draw()\n    love.graphics.setColor(255, 33, 78)\n    love.graphics.print(\"\
    Hello World\", cwide/4, chigh/3.33)\nend\n```\n\nSave those entries above as `main.lua`.\
    \ A standard zip file with `.love` extension is a distributable LÖVE package.\
    \ The main file should be labeled as `main.lua`, and it should be on top of the\
    \ zip file. You can create it in this form:\n\n```bash\n$ zip hello.love main.lua\n\
    ```\n\nThen, launch the app after creating the extension. This should be like\
    \ this:\n\n```bash\n$ love ./hello.love\n```\n\nThis will give you an out, such\
    \ as: “HELLO, WORLD!” This is an understandable code. The `cwide` and `chigh`\
    \ variables are universal and could be seen in the whole script. The first block\
    \ of code is called a function that sets the background shade of the program.\
    \ The second block of code gets the “hello world!” printed on the screen.\n\n\
    The line containing two dashes (`--`) is the comment section. It also includes\
    \ a `.ttf` in the `.love` package. This leads to the new line text `setNewFont`\
    \ with no comment. In this case, you should not use the Skirt Girl font. Get a\
    \ font from [FontLibrary.org](https://fontlibrary.org/). This will enable you\
    \ to adjust the codes accordingly. You will now have codes such as:\n\n```bash\n\
    $ zip hello.love main.lua SkirtGirl.ttf\n```\n\nThen, launch this program.\n\n\
    ```bash\n$ love ./hello.love\n```\n\n## Types of Games in Raspberry PI\n\nYou\
    \ can install and play various games on your system. These include:\n\n1. Minetest\n\
    2. Widelands\n3. Duke Nukem 3D\n4. Beneath a Steel Sky\n5. Micropolis\n6. Freeciv\n\
    7. Which-Way-Is-Up?\n8. Openrena\n9. Quake III Arena\n10. Star Wars by Jedi Knight\n\
    11. Battle for Wesnoth\n12. Funny Boat\n13. Littlecrane\n14. Flight of the Amazon\
    \ Queen\n15. Abuse\n16. SuperTux\n17. Angry Dwarves\n18. RailWorld\n19. Dance\n\
    20. OpenTT\n21. Simutrans\n22. Quake “other”\n23. Monsterz\n24. BOOM, and more.\n\
    \n## Pygame and Hello\n\n`Pygame` means a Primer on Game. This is game programming\
    \ in Python. If you understand `pygame` as a programmer, use it in writing games\
    \ on every platform language quickly. This is Python covering for `SDL` library.\
    \ It means Simple Media Layer, which provides cross-platform accessibility for\
    \ your Pi’s system. These components include keyboard, joystick, video, and sound.\
    \ `pygame` began as a substitute for `SDL` project. This program comes with cross-platform\
    \ nature convenient for `pygame`. In other words, you can write games and other\
    \ programs on any platform that supports these applications. Hello, `pygame` is\
    \ another version of `pygame`. What are coordinates? `Coordinates` serve as Raspberry\
    \ Pi tracker. It functions without GPS and can be attached to any vehicle. It\
    \ is connected to Google Maps, making it easier for you to track the location\
    \ of your car or other objects anywhere and anytime. Vehicle tracking or location\
    \ tracking using RPi is done using sim card.\n\n# CHAPTER ELEVEN: WHAT IS RASPBERRY\
    \ PI ROBOT?\n\nRaspberry Pi robot is a programmable robot kit that is done using\
    \ Pi. An example of Raspberry Pi robots is Arduino robot. Raspberry Pi devices\
    \ function like a desktop computer but smaller and cheaper. Experienced programmers,\
    \ hobbyists, and other enthusiasts can use it for building robots.\n\n### Requirements\
    \ for Raspberry Robot\n\nThe requirements for building a Raspberry Pi robot include:\n\
    \n1. 2 five-volt DC motors\n2. 6 AA batteries in a holder for powering the motors\n\
    3. Small breadboard for building simple circuits without soldering\n4. Sticky\
    \ tack adhesive\n5. Chassis - a flat and squared material measuring 6 inches,\
    \ such as laser-cut plastic, legos, and cardboard. Additional two feet needed\
    \ for stabilizing the droid.\n6. `L293D` motor controller\n7. Two wheels with\
    \ grippy rubber tires – these tires snap onto the motor shafts\n8. 5-volt USB\
    \ mobile battery pack for powering the Pi device\n9. Jumper wires for connecting\
    \ all the equipment\n10. `microSD` card for loading the BOT’s software before\
    \ it can function\n\n### Methods for Setting up a Raspberry Pi Robot\n\n#### Connect\
    \ the Wires\nAfter mounting your device and the breadboard on top of the chassis,\
    \ you can use an adhesive like Sticky Tack to hold them together. Fix the `L293D`\
    \ motor controller in the breadboard. Connect the jumper circuit to the right\
    \ pins on your Raspberry device, including the breadboard. Then, attach both wires\
    \ on each DC motor to the output pins of the motor controller.\n\n#### Connect\
    \ your System to the Power Source\nInstall the motors, wheels, and battery box\
    \ to your robot’s underside. Connect the power cables and run them up to the breadboard.\
    \ Then, connect them to the motor power input of the `L293D`. Attach the 5-volts\
    \ battery pack and plug it into the Raspberry Pi.\n\n#### Download the Software\n\
    You need to prepare the card by downloading the software that can help you to\
    \ control your robot through the Pi. The software for running and powering your\
    \ Pi is [NOOBS](https://www.raspberrypi.org/downloads/raspberry-pi-os/). Go to\
    \ the website and down it. Unzip and copy the OS of NOOBS into the `microSD` card.\
    \ After this, slot in the card into your Pi. Connect your mouse, keyboard, and\
    \ monitor to the Raspberry Pi. Follow the system prompts and install the Raspbian\
    \ software to your system.\n\n#### Hook up to the Internet\nIf your system does\
    \ not have Wi-FI, you can hook up to the internet with an Ethernet cable. Then,\
    \ type this command into the terminal:\n\n```bash\ngit clone https://github.com/the-raspberry-Pi-guy/wired\
    \ own```\n\nAfter that, you can type in:\n\n```bash\ncd wired\n```\n"
