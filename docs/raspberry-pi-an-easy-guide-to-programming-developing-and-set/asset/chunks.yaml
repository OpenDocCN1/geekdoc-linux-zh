    整数在表达式中可以是任意长度。浮点数只有在具有 15 位小数时才是准确的。如果你注意到第 16 位小数，则该表达式是不正确的。这些数字是十进制计数系统中的数字。程序员通常处理二进制（2
    进制）和十六进制（16 进制）数字。他们也可以处理八进制（8 进制）数字。你可以在数字前放置前缀来在 Python 中表示这些数字。


    ### 用于数制系统的前缀


    | S/N | 数制系统 | 前缀 |

    | :--- | :--- | :--- |

    | 1. | 二进制数 | `0B` / `0b` |

    | 2. | 八进制数 | `0O` / `0o` |

    | 3. | 六进制数 | `0X` / `0x` |


    #### 看这些示例


    ```python

    # Output : 107

    print(0b1101011)

    # Output : 253 (251 + 2)

    print (0xFB + 0b10)

    # Output : 13

    print(0o15)

    ```


    **输出：** 运行程序，你将得到如下输出：


    | 107 | 253 | 13 |


    ### Python 中的数字类型转换


    数字可以通过强制类型（coercion）进行转换。这是一个将一个数字转换为另一个的过程。你可以使用加法和减法操作自动将整数转换为浮点数。如果操作数中的一个是浮点数，则该操作将成功执行。例如：


    ```python

    >>> 1 + 2.0

    3.0

    ```


    在上面的语句中，整数通过加法强制转换为 `2.0` 浮点数。这种转换的结果也是一个浮点数 `3.0`。另一个过程是通过像 `int()`、`float()`
    和 `complex()` 等内置功能。我们可以使用这些功能在类型之间转换数字。此外，这些功能也可以将数字从字符串转换。


    #### 示例


    ```python

    >>> int(2.3)

    2

    >>> int(-2.8)

    -2

    >>> float(5)

    5.0

    >>> complex(''3+5j'')

    (3+5j)

    ```


    如果你是从浮点数转换为整数，则数字会被截断，小数部分会被移除。


    ### 使用 Python Decimal（小数）


    你可以使用 Python 内置的类 `float` 进行一些惊人的计算。在数学计算中，`1.1` 和 `2.2` 的和 = `3.3`。但在 Python
    中存在分歧和差异。


    ```python

    >>> (1.1 + 2.2) == 3.3

    False

    ```


    这个结果意味着浮点数在计算机硬件中是以二进制分数的形式执行的。这是计算机系统唯一理解的数字类型：二进制数字 `0` 和 `1`。因此，在你的计算机系统中存储小数将是复杂的。例如，分数
    `2/6` 无法在计算机中以小数的形式表示。它会给我们 `0.33333333…..`，而且这个结果很长。但答案是可以近似的。


    然而，小数 `0.1` 将带给我们一个极其长的二进制分数 `0.000110011001100110…`。但计算机可以接受和存储的位数是有上限的。正因如此，我们可以近似
    `0.1`，但它是不相等的。值得注意的是，这种缺失并不是 Python 的错误，而是由于计算机硬件的限制。


    ```python

    >>> 1.1 + 2.2

    3.300000000000003

    ```


    但是，你可以使用 Python 内置的小数模块来处理这种差异。浮点数的精度高达十五位小数。它有一个允许用户设置精度的 `decimal` 模块。这两个结果之间的差异将显示：


    ```python

    import decimal

    print(0.1)

    print(decimal.Decimal(0.1))

    ```


    **输出：**


    | 0.1 | 0.100000000000000055511151231257827021181583404541015625 |


    你可以使用这个模块执行我们在学校中学过的小数计算。这种格式保持了值的有效性。


    ### 列表和字典


    列表就像其他语言中的数组，它们在 Python 中非常重要。列表是可变的，在创建后可以被修改。例如：


    ```python

    # 用于演示创建列表的 Python 程序

    list = ["Books", "For", "Books"]

    print(list)

    ```

    **输出：**

    `[''Books'', ''For'', ''Books'']`


    #### 字典


    在 Python 中，字典是无组织的数据值汇编，类似于映射（map）。与列表不同，它包含键值对。它使用冒号（`:`）创建。每个键值对用逗号（``,`）分隔。例如：


    ```python

    # 用于演示创建带有整数键字典的 Python 程序

    dict = {1: "Books", 2: "For", 3: "Books"}

    print(dict)

    ```


    **输出：**

    `{1: ''Books'', 2: ''For'', 3: ''Books''}`


    #### 使用混合键


    ```python

    # 用于演示创建混合键字典的 Python 程序

    dict = {"Name": "Books", 1: "For", 2: "Books"}

    print(dict)

    ```


    **输出：**

    `{''Name'': ''Books'', 1: ''For'', 2: ''Books''}`


    ### 列表与字典的区别


    | S/N | 列表 | 字典 |

    | :--- | :--- | :--- |

    | 1. | 列表索引是从 0 开始的整数。 | 字典的键可以是任意类型。 |

    | 2. | 你可以通过在 `[]` 中放置元素并用逗号分隔来创建列表。 | 通过在 `{}` 中放置 `"键":"值"` 并用逗号分隔来创建字典。 |

    | 3. | 列表维持元素的顺序。 | 不维护顺序。 |

    | 4. | 通过索引访问列表元素。 | 通过键访问字典元素。 |


    ## 第四章类、方法和模块


    在 Python 中，类是帮助你创建或自定义对象的模板。变量和函数被封装在单一实体中。对象从类中生成变量、特征和功能。创建类需要注意的想法是类允许你构建一个分类事物或对象的模板。创建的类可以被处理或自定义。类是用于产生这些模板的实例，在其中可以使用方法和其他操作。你可以为任何组织组织、构思并构建架构图或层次结构。类用于定义公司、工业、社会和其他环境中的程序和关系。在使用
    Python 类之前，请考虑以下特性：


    1. 创建或开发一个类并应用它。

    2. 在将类移动到模块之前，先创建一个模块。

    3. 在新的程序中调用类之前先调用模块。

