    # CHAPTER EIGHT: LEAD FADER AND PROTOTYPING PROJECTS


    The `Pi` is a microcomputer and also regarded as a single-board computer (`SBC`).
    It can function with Linux operating system and other applications. This device
    is useful for various digital projects, such as lead lead fader projects and prototyping
    projects.


    A fader is a necessary component required for mixing console. It helps you to
    control your source through the movement of a fader. You can use `pushbuttons`
    in your projects by hacking the keyboard and mouse. It could also be done through
    `gainer`, `Arduino`, and `MCK`. This offers an alternative means of using faders
    with audio input and output.


    Lead fader provides efficient sampling resolution and frequency than `16bit` to
    `8-10bit`, including `44.1KHz` to `1KHz`.


    ## Requirements for Lead Fader Projects


    The requirements for lead fader projects are fader, software, and soldering. Others
    include `1` heat shrink tube, `1` twin cable, `2` `3.5mm Mono plug`, wire strippers,
    nippers, `solder-sucker`, `multimeter`, `clipped cables`, and `helping hands`.


    These requirements can function only on variable resistor type faders but not
    on the optical type.


    Now, a `Fader` is sourced from a broken mixing console and electronic components
    store. Some local electronic component stores include `Digi-Key`, `RSin`, `Maplin`,
    `Tokyu-Hands`, and `RadioShack`.


    ## How to Assemble the Hardware


    Get a fader with three or more connectors and modify its resistance using the
    arrangement of the fader, which is a changeable type of resistor. Most mixing
    consoles come with optical fader, especially for `DJ crossfader`.


    The `2` `3.5mm mono plug` is for acoustic input and output, and one twin cable
    is used as the loudspeaker cable. You can make the length according to your choice.
    Get `one` heat shrink tube for connecting the fader.


    Get two pairs of cables and strip the ends. Check the connector of the fader before
    soldering. Some faders have three connectors. Two functions as resistors and the
    other one for the ground pin. By changing the resistance with a `multimeter`,
    you can find a proper connector.


    Solder the fader to the cables. Each side of the two wires should be soldered
    to each resistor side of the connector. Use the side of the resistor with one
    marker for one side. Add your heat shrink tube before soldering to make it firm.


    Twist the cutting side of the cable to avoid expansion. Cover the connector with
    heat shrink tube after soldering.


    After this, solder the ground side, but ensure that each cutting side of the cables
    is twisted to prevent expansion. Attach your heat shrink tube.


    Solder the plugs to the last part of each cable but install the plug cover. The
    cutting side of the cable should be twisted to prevent expansion. Attach the cover
    of the plugs after soldering.


    Use a `multimeter` on the resistance between the plugs. The upper side should
    be modified with the location of the fader. The `gnd` (lower side) should be zero.
    Now, you have a set of switch, a cable, and two plugs.


    Connect the acoustic input and output to make complete working hardware.


    ## Running the Software


    Open the window or environment of the program in your Raspberry Pi. That could
    be `Flash`, `Pure Data`, `MaxMSP`, and `SuperCollider`. Anyone that can handle
    the audio input and output is needed.


    You should assign an audio signal such as a `10000Hertz` sine wave for audio output.
    Set the volume calculator for audio input. `Peakamp` object is needed for this
    project.


    Add a receiver for the calculator such as a `multislider` object.


    Begin the audio, move the fader to receive the connection. With this, you are
    set to use a fader with your projects. Use a sine wave oscillator for the acoustic
    input and output.


    ## Requirements for Prototyping Project


    The requirements for this project include power, `555 astable`, `Cd4029 decade
    counting`, `diode`, `capacitor`, and `9-Volt battery`.


    ## How to Assemble Prototyping Hardware


    The first thing here is using the ground rails and hooking up to the power stage.
    This will feed the circuit with power from the power source. The `diode` prevents
    reverse polarity to the system while the `capacitor` is used to even out the current.
    The circuit can be connected using a brick wall through a `9-V` battery.


    After this setup, the `astable 555 timer` stage sends a regular pulse to the `CD4029`
    from `pin3`. This is connected to the `capacitor` and `Potentiometer` and attached
    to the `7`, `2`, and `6` pins. These multiply the pulses coming from `pin 3`.


    The `Potentiometer` helps in charging the `capacitor` more or less quickly. If
    the `capacitor voltage` is at `1/3` of the main charge and the main charge is
    that of the battery. This can set `pin 3` high. When `pin 6` gets `2/3` charge,
    it causes `pin 3` to be low making the `capacitor` to reduce low through `pin
    7`. With this, the charge can dissipate.


    If the `capacitor voltage` is at `1/3` of the base charge, it regulates the `pin
    3` to high. In this way, the process is repeated.


    ## Running the Software


    `NE555 Timer` controls a regular pulse towards the `CD4029` from `pin 3` connected
    to the `15` pins of the device. The vibration begins from `pin 2` and measures
    `1/3` of the base voltage, which is `3volt`. The vibration stops when the pin
    detects `2/3` base voltage, which is `6 volts`.


    The counter stage functions in binary mode and produces `4bit` binary numbers
    between `0` and `15`. Each bit is transferred to one of the `Q` pins. A `1` turns
    on a `LED` since `A` turns it off.


    They can cause the `LED` to fade in and out rather than blinking on and off. This
    causes the `10k` resistors to delay in charging and discharging of the `capacitors`
    and `LEDs`.


    What are in Phase Two?

    [/content]


