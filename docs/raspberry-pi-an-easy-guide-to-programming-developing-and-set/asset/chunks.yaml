    In Microsoft word, such as windows 7 or windows 8, `Python IDLE` functions effectively.
    You could see it at the Start Button Menu in Windows 7, as an Entry. In Windows
    8, go to the Start Menu and type `IDLE`. This can help you for running it in the
    system. Immediately, it will show the details of the OS and Python version in
    the device. The code should be written after this prompt `>>>` on your windows.
    After pressing on the Enter button, the program will be executed. One-line commands
    are executed using shell windows. But, this is not applied for writing full-fledged
    programs.


    `Python IDLE` has a built-in text editor. It is useful for writing and saving
    your codes. Editors begin to function if you click on `File > New File`. This
    command opens a window for typing your code. But saving this code in a box file
    before running it is ideal. Simply click on `File`, then `Save`. However, ensure
    that the data has a `.py` extension. Running the code requires you tap on the
    `Run` button. This will take you to the `Run Module`. You can simply press `F5`.
    The result of this program will be printed on the window bearing `IDLE`. The result
    will show below the `Restart` line.


    ## Types of Python IDEs

    Different types of Python IDEs that could be used in software development are
    Atom, Thonny, Eric, Rodeo, Spyder, PyCharm, Wing, Microsoft Visual Studio, Jupyter
    Notebook, and PyDev.


    ### Atom IDE

    `Atom IDE` was built by GitHub as an open-source cross-platform. This framework
    uses an `electron` that enhances cross-platform desktop applications. The platform
    functions with `Node.js` and `Chromium`, which are presently known as Hackable
    Text Editor.


    The Features of this Integrated Development Environment include:

    1. Viewing outputs on Atom doesn’t require opening another window.

    2. Atom features built-in support for viewing and editing `Markdown` files using
    a plugin called `Markdown Preview Plus`.


    ### Thonny IDE

    Learning or teaching programming languages demands you to use `Thonny IDE`. Tartu
    University built this software. It is useful for highlighting syntax errors and
    supporting code completion processes. Some of the features of this IDE include:

    1. Useful auto code completion and highlighting errors.

    2. It serves as a simple debugger.


    ### Eric IDE

    `Eric IDE` is a program developed by Python as an editor. It is valuable for professional
    programmers and amateurs. The features of this software include:

    1. Task management support with built-in bugger.

    2. They are used as source code folding, editors, and configurable window layout.

    3. `Eric` is used for version control and advanced project management.


    ### Rodeo IDE

    Retrieving data and information from various sources is possible using `Rodeo
    Integrated Development Environment`. It is regarded as an ideal IDE for programs.
    This software is used for the auto-completion of codes and supports cross-platform
    functionalities. The features of this program include:

    1. Syntax highlighting, auto code completion, and visual file navigation.

    2. Enhances your skills for plotting, interacting, inspecting, and comparing data.


    ### Spyder IDE

    `Spyder` is ideal for data science with an open-source and highly recognizable
    in the IDE market. It means the Scientific Python Development Environment (Spyder).
    This program accepts and functions on all relevant platforms such as `MacOS X`,
    `Windows`, and `Linux Operating System`. `Spyder IDE` offers various functionalities
    such as document viewer, integrated console, localized code editor, and variable
    explorer. Other scientific modules, such as `SciPy`, `NumPy`, etc., are supported
    by this IDE. The various features of this program include:

    1. Secure integration with the `IPython` console.

    2. Functions correctly in automatic code completion mode and multi-language editor.

    3. It offers a better auto code completion with syntax highlighting features.


    ### PyCharm IDE

    `PyCharm` was built by the Jet Brains as software for Python with a cross-platform
    for Integrated Development Environment (IDE). This IDE is available in a free
    version and paid (PRO) version, and it is the most widely used open-source program.
    It helps developers and programmers take care of regular tasks. `PyCharm` is a
    full-fledged IDE with fast error checking and correction, database accessibility,
    auto code completion, quick project navigation, and remote development support.
    The features of this program include:

    1. It helps in highlighting errors.

    2. Enhances Python web development frameworks such as `Javascript`, `Angular JS`,
    etc.

    3. `PyCharm` functions as a powerful debugger.

    4. It is valuable for smart code navigation.


    ### Wing IDE

    `Wing IDE` is packed with decent and necessary development support features. This
    cross-platform offer free edition for beginners, although it has a Pro version
    that has 30 days trial. This will enable learners and experienced programmers
    to try it out. This IDE program offers services such as debugging, auto-completion,
    syntax highlighting, and indents. The main features of the `Wing IDE` is that:

    1. the wing is customizable with extensions.

    2. This IDE enhances remote development and test-driven development together with
    the unit test.


    ### Microsoft Visual Studio IDE

    Now, you can develop and debug the latest cloud or web projects using `Microsoft
    Visual Studio`. It is an open-source code editor with a marketplace for extensions.
    The features include:

    1. Valuable for coding programs in `Visual studio`.

    2. It could be found in a free and PRO versions.


    ### Jupyter Notebook IDE

    In the Data Science industry, `Jupyter Notebook` is a frequently used `IPython`
    notebook editor. You can use it for crafting and operating notebook documents.
    This web resource is developed on the server-client structure since Python is
    an interpreted language. Some of the features of this IDE include:

    1. `Jupyter Notebook` is necessary and suitable for beginners in data science.

    2. It is useful for `markdowns`.

    3. This IDE is valuable for creating and editing codes.


    ### PyDev IDE

    `PyDev IDE` is an outside plugin for `Eclipse` and a commonly used program in
    Python. If you have experience in `Java`, it is usually a natural choice for Python
    developers with this background. Most programmers know it as a Python interpreter.
    In the years 2003 and 2004, Aleksander Totic is renowned for his contribution
    to the Mosaic browser. He also worked on the `Pydev` project during this period.
    It is an integration of `Django`, auto code completion, block indents, and smart
    indents. The features of this IDE include:

    1. `PyDev` supports black formatter, `Mypy`, and virtual environments.

    2. It has reliable parameters such as debugging, code average functionalities,
    code analysis, and refactoring.

    3. It is suitable Unit test integration, `PyLint` integration, and remote debugger.

