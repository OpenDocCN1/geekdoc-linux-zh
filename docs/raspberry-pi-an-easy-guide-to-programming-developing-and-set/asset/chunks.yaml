    ### 什么是多重赋值和多返回值？

    多重赋值允许在一行代码中同时为多个变量赋值。这一特性在初始尝试后变得简单，但你应该学习它。然而，在需要时回想起多重赋值可能是非常困难的。多重赋值等同于迭代器解包和元组解包。这三个表达式在
    Python 编程中可以结合使用，但它们的意思相同。看一个 Python 中多重赋值的示例：


    | `>>> x, y = 10, 20` |


    在这个示例中，`x` 被设置为 10，而 `y` 被设置为 20。在底层，我们创建了包含 10 和 20 的元组。我们可以遍历元组并从循环中获取每个项，将其顺序传递到变量
    `x` 和 `y`。这在这一语法中清晰地表示：


    | `>>> x, y = 10, 20` |


    在 Python 中，括号在元组中是可选特性，在多重赋值中也是可选的。它以类似于元组的语法工作。因此，在下面的表达式中，所有的数字都是等价的。


    | `>>> x, y = 10, 20`

    `>>> x, y = (10, 20)`

    `>>> (x, y) = 10, 20`

    `>>> (x, y) = (10, 20)` |


    多重赋值称为元组解包，因为它们通常与元组一起使用。然而，多重任务可以用于任何迭代器，而不仅仅是元组。


