    在创建一个类后，创建一个模块，并将你在类中创建的代码转移到其中。通过这种方式，你可以在任何程序中创建通用的 x、y 同步。


    ## 什么是模块？

    模块是一个包含 Python 语句和定义的文件。它也是从其他程序引用的 Python 代码。模块被用于日常任务，你不需要在每个可以使用它的程序中都重复输入它们。


    你可以使用 `matplotlib.plot` 调用包模块。如果没有这个模块，你必须在每个使用绘图图表的程序中都声明绘图的函数。


    在 Python 文档中，如果你退出 Python 解释器并重新打开软件，定义（即变量和函数）将会丢失。但编写一个更扩展的程序需要你使用文本编辑器为解释器准备数据。然后，运行该文件作为输入。


    这个过程被称为脚本编写。建议将长程序拆分为多个文件，以便维护应用程序。这可以应用一个为多个应用程序编写的方便函数。在这种情况下，你不需要在工作之前将描述复制到所有程序中。


    Python 可以帮助你将描述组织在文件夹或文件中，并在脚本中应用它们。它也可以被用于解释器的关联场合。以这种方式组织的数据被称为模块。从模块的描述被提取到不同的模块或主模块中。这是一个变量的集合，你可以在脚本中访问它们。它们可以在上层或在计算器模式下执行。


    通过上述分析，你可以理解为通过类的创建和特性将实例从程序转移到特定的类。你只需要通过工作和引用这个新创建的模块，就可以在当前程序中使用此功能。


    ### 我们上面所做的总结：

    1. 我们开发并启动了类。

    2. 创建了一个函数，可以将类实例向四个重要方向移动，如右、左、上、下。在这里，增量成为函数的参数或参数。

    3. 在模块中，创建一个函数，使用图距离公式计算该类中两个请求之间的距离。


    ## 树莓派中有哪些模块？

    树莓派包含一个计算模块（compute module1）。该设备设计用于灵活形式的工业应用。


    ## 计算机模块的规格

    模块是你的 Pi 设备的骨干，因为它包含了 512MB RAM、`BCM2835` 处理器和 4GB eMMC Flash 设备。它与微型计算机中的 SD
    卡相当且相似。所有这些规格都包含在一个尺寸为 67.6 × 30 mm 的板上。该板适用于标准连接器，如 `DDR2 SODIMM`。该连接器用于笔记本电脑的内存。


    此内存直接耦合在板上的处理器上。可以通过连接器引脚访问其他处理器接口，你将享受 `BCM2835` SoC 的灵活性。在这种情况下，与树莓派相比，可以使用更多的接口和
    GPIO，使得以直观的方式设计和定制系统可能。


    ## Python 中的库

    在 Python 编程中，你可以通过采用 Python 库和包来限制代码的使用。这些是相关模块和函数的集合，对编程很有价值，而不是代码。你将在 Python
    中发现超过十万个库和一百九十个包。它们的设计和开发是为了让初学者（包括 Pythonistas 和 Pythoneers）的编程变得简单，为社会各种各种挑战提供解决方案。


    Python 库对于机器学习非常有用，包括数据可视化、图像和数据处理，以及用于不同应用程序的数据科学。Python 包包含 Python 模块的集合，而库是用于执行特定任务的
    Python 函数集合。


    以下是一些 Python 库及其特性：


    ### Matplotlib 库

    Matplotlib 是一个程序员可以通过 Python 脚本编写二维图表和图形的库。你可能需要在一个版本中使用多个于单个轴来处理科学或数学程序。你还可以使用此库一次创建多个图表。它在处理多个图形和特征方面非常有用。


    #### Matplotlib 的特性

    1. 轻松将多个第三方库与 Matplotlib 软件集成。应用程序包括用于映射和投影的 `ggplot`、`seaborn` 和 `base map`。

    2. 具有一个动态的人员群体，专业地处理你的请求。

    3. Matplotlib 允许你从 Github 的问题跟踪页面跟踪新的补丁、错误和功能需求。那是处理与此库相关的各种问题的官方页面。

    4. 它可以与 GUI 以及各种工具包配合，如 `Jupyter Notebook`、`IPython Shells` 和 `Python Scripts`。

    5. 这个 Python 库可以创建适用于出版的高质量图表。这些图形可以在各种交互平台的硬拷贝设计中可用。


    ### Requests 库

    该库在 Apache2.0 许可发布，作为一个加载的 Python HTTP 库。它有助于让 HTTP 请求变得用户友好且响应迅速。该库为初学者设计，帮助他们使用
    HTTP 的大多数功能。它很容易配置、自定义、授权和检查 HTTP 请求。


    #### Requests 库的特性

    1. 享受 HTTP 代理支持的益处。它帮助你的用户更快地找到你的文件和页面。

    2. 它具有线程安全、连接池、Unicode 响应体、基本或摘要认证、值 cookie 以及其他功能。

    3. Requests 有助于一次上传多个文档。通过这种方式，你可以在高效且更快速的环境中工作。

    4. Requests 包含几个特性，允许你处理自定义标头、向 URL 扫描参数以及执行 SSL 证书验证。

    5. 它提供自动解压缩，有助于你快速将压缩数据恢复和激活到原始格式。

    6. 这个 Python 库允许你使用基础 Python `Dictionaries`，添加参数、表单数据、复杂文档。


    ### Theano 库

    Theano 可用于编译可用程序。程序员也称其优化编译器。该库应用多维数组，使你无需担心结果和完善。它被设计用于描述、分析、影响和优化各种数学操作。


    #### Theano 的特性

    1. 使计算快了 140 倍且更简单。它可以处理数据密集型应用程序。

    2. 它提供了各种工具用于检测和分析系统中的危险错误和其他问题。

    3. Theano 有助于你成功处理表达式而没有烦恼或延迟。通过这种方式，你可以在处理图像时避免糟糕的错误。

    4. 它的功能与 Numpy 类似。因此，Theano 在其系统中集成了 `numpy.ndarrys`。

    5. 直接与 GPU 工作并完成许多部分的各种差异。


    ### Pillow 库

    Pillow 库依赖于 `PIL` 代码配置。它是 Python 图像库 (`PIL`) 的分支。它被转化为一个更好、更友好的 `PIL` 版本。这是你处理不同图像格式时的可靠伙伴。


    #### Pillow 的特性

    1. 你将获得活跃社区用户的更多支持，他们将回答你的问题并提供解决方案。

    2. 这个 Python 库帮助你创建描述的缩略图。它携带了你图形的大部分部分。

    3. 支持一组图像过滤器，如 `smooth`、`smooth_more`、`blur`、`contour`、`sharpen` 和 `find_edges`。

    4. 打开和保存图像以及影响图像环境的能力。


