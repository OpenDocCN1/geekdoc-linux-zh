    # String Functions in Python


    There are several built-in functions used for handling strings in Python. These
    include:


    1. `center(width, fillchar)` – It returns a space padded string with the original
    string. This is centered with an equal numbers on the right and left spaces.

    2. `casefold()` – returns a version of string ideal for case-less comparisons.

    3. `count(string, begin, end)` – this counts the frequency of times a substring
    occurred in a string between starting and concluding index.

    4. `encode()` – it encodes `String` using the codec entered for encoding. The
    default encoding is `‘utf-8’`.

    5. `expandtabs(tabsize = 8)` – this defines tabs in sequence to numerous spaces.
    Here, the default space value is 8.

    6. `endswith(suffix, begin=0, end=len(string))` – it restores a Boolean value
    if the sequence terminates with a given suffix existing between starting and finishing.

    7. `format(value)` – this feature restores a configured edition of string using
    the passed value.

    8. `isalnum()` – this restores true if the letters in the string are alphanumeric.
    That means it contains alphabets and numbers with at least one character. If not,
    the expression will return false.

    9. `index(substring, beginindex, endindex)` - this throws an exception if the
    string is not found. It functions as `find()` method.

    10. `isalpha()` – this function restores true if all the letters are alphabets
    with at least one character. If not, the expression returns false.

    11. `capitalize()` – this function capitalizes the first letter of the string.
    It is deprecated in Python3.

    12. `decode(encoding = ‘UTF8’, errors = ‘strict’)` – for decoding the string using
    codec listed or indexed for encoding purposes.

    13. `isdecimal()` – this feature restores true if all the letters of the string
    are decimals.

    14. `isnumeric()` – if the sequence has only figures as characters, it returns
    true.

    15. `isupper()` – if the letters of a string are in the upper case, it returns
    false. If not, the string is false.

    16. `isprintable()` - if all the letters of a sequence are printable or the series
    are empty, it returns true. If not, it returns false.

    17. `istitle()` – when the first letter of a string is in upper case and the other
    characters are in lower case. It is a titled string. But if the sequence is titled
    correctly, it returns true. If not, it is false.

    18. `isdigit()` – this functionality restores true if all the cases are digits
    with at least one number. If it is not so, the statement returns false.

    19. `islower()` – if the letters in a string are in lower case, it returns true.
    If it is not so, the string is false.

    20. `isidentifier()` – when the sequence is the valid identifier, this statement
    returns true.

    21. `isspace()` – if the letters of a string are whitespace, the string returns
    true. If not, it is false.

    22. `join(seq)` – this function merges the representation of sequence of a specific
    string.

    23. `len(string)` – the feature restores the length of a string.

    24. `lower()` – this alters all the letters of a string to lower case.

    25. `partition()` – locates the separator(`sep`) in the string and restores the
    initial part that is the separator and part. When this separator is not seen in
    the sequence, it returns Strings with double empty strings.

    26. `istrip()` – removes all the significant whitespaces of a string. It can also
    remove a particular letter from leading in a string.

    27. `replace(old, new, [count])` – replaces the old sequence of characters with
    the new sequence. In this case, maximum characters are returned when the maximum
    is specified.

    28. `rindex(str, beg=0, end=len(string))` – this works in a similar way to `find()`.
    However, it traverses the string in backward.

    29. `rstrip()` – removes all trailing whitespaces of a string.

    30. `title()` – when the first letter of a string is in upper case and the other
    characters are in lower case. It is a titled string. But if the sequence is titled
    correctly, it returns true. If not, it is false.

    31. `isupper()` – if all letters of a string are upper case.

    32. `zfill(width)` – returns a string padded with zeros on the left.

    33. `translate(table, ...)` – this translates the string using a table.

    34. `swapcase()` – inverts the case of all letters.

    35. `split(sep=None, maxsplit)` – splits the string based on the separator.

    36. `splitlines()` – returns a list of lines split at line breaks.

