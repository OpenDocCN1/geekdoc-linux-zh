    printing the modified information \")\nprint(Employee)\nprint(\"Deleting the dictionary:\
    \ Employee\")\ndel Employee\nprint(\"Lets try to print it again \")\nprint(Employee)\n\
    ```\n\n**输出:**\n```text\n<class ‘dict’> …..Printing Employee data ….{{'Name’ :\
    \ ‘James’, ‘Age’ : 25, ‘salary’ : 25000, ‘Company’ : ‘GOOGLE’}\nDeleting some\
    \ of the employee data\nprinting the modified information{'Age’ : 25, ‘salary’\
    \ : 25000}\nDeleting the dictionary: Employee\nLet's try to print it again\nNameError:\
    \ name 'Employee' is not defined\n```\n\n上面的打印语句出现错误，是因为被请求打印的 `Employee` 字典已经被删除了。\n\
    \n另一种方法是通过 `pop()` 方法。该方法接受键作为参数。它还会像示例所示移除相关的值：\n\n```python\n# 创建字典\nDict =\
    \ {1: ‘JavaTpoint’, 2: ‘Paul’, 3: ‘Thompson’}\n# 使用 pop( ) 方法删除键\nPop_ele = Dict.pop(3)\n\
    print(Dict)\n```\n\n**输出:**\n```text\n{1: 'JavaTpoint', 2: 'Paul'}\n```\n\n在 Python\
    \ 中，有内置方法如 `popitem()` 方法和 `clear()` 方法用于从字典移除移除。`popitem()` 方法从字典中移除任意元素。此外，`clear()`\
    \ 功能移除整个 Python 字典中的所有元素。\n\n## 如何遍历字典\n你可以使用循环来遍历字典。查看示例：\n\n```python\n# 使用\
    \ for 循环打印字典的所有键\nEmployee = {“Name”,: “James”, “Age”: 29, “salary”: 25000, “Company”:\
    \ “GOOGLE”\n```\n\n**输出:**\n```text\nNameAgeSalaryCompany\n```\n\n## 字典键的属性或特性\n\
    在 Python 字典中，同一个键不能存储多个值。在给单个键分配多个值的情况下，最后分配给该键的值将成为该键的值。例如：\n\n```python\nEmployee\
    \ = {“Name”:”James”, “Age”:30, “salary”:35000\\. \"Company\":\" GOOGLE\",\" Name\"\
    :\" James\"}\nfor x,y in Empoyee.items ( ):\nprint(x,y)\n```\n\n**输出:**\n```text\n\
    Name James\nAge 30\nSalary 35000\nCompany GOOGLE\n```\n\n第二种情况是键不是可变对象。字符串、元组和数字可以组成键。然而，列表被视为可变对象，不适合作为字典的键。例如：\n\
    \n```python\nEmployee = {“Name”: “John”, “Age”: 29, “salary” 35000, “Company””GOOGLE”,\
    \ [100,201,301]:”Department ID”}\nfor x,y in Employee.items ( ):\nprint(x,y)\n\
    ```\n\n**输出:**\n```text\nTraceback (most recent call last):\n  File “dictionary.py”,\
    \ line 1, in <module>\n  Employee = {“Name”: “James” , “Age”: 30, “salary”:25000,\
    \ “Company”: “GOOGLE”, [100,201,301]:”Department ID”}\nTypeError: unhashable type:\
    \ ‘list’\n```\n\n内置字典的方法和函数包括：\n\n### 字典方法\n1. `copy()`: 返回字典的浅拷贝。\n2. `get(key,\
    \ default=\"None\")`: 用于获取指定的键。\n3. `clear()`: 用于删除字典的所有项。\n4. `fromkeys(iterable,\
    \ value=None)`: 从迭代对象创建新字典。\n5. `keys()`: 返回字典的所有键。\n6. `items()` 以元组形式返回键值对。\n\
    7. `has_key(key)`: 如果字典拥有该键则返回真。\n8. `values()`: 返回字典的所有值。\n9. `update(dict2)`:\
    \ 通过添加 `dict2` 更新字典。\n10. `setdefault(key, default=\"None\")`: 如果键不存在则设置。\n11.\
    \ `index()`:（不是标准字典方法）。\n12. `len()`: 返回字典的长度。\n13. `count()`:（不是标准字典方法）。\n14.\
    \ `pop()`: 指定的键。\n15. `popitem()`: 移除任意元素。\n\n### 字典函数\n1. `len(dict)`: 用于估计字典的长度。\n\
    2. `type(variable)`: 用于打印变量类型。\n3. `cmp(dict1, dict2)`: 用于比较两个字典的项。\n4. `str(dict)`:\
    \ 将字典转换为可打印的序列。\n\n"
- fmt: "\n### String Indexing and Slicing Basics\n\n```python\nstr[0] = ‘H’\nstr[1]\
    \ = ‘E’\nstr[2] = ‘L’\nstr[3] = ‘L’\nstr[4] = ‘O’\n```\n\nNow, you can also check\
    \ this example below.\n\n```python\nStr = “HELLO”\nprint(str[0])\nprint(str[1])\n\
    print(str[2])\nprint(str[3])\nprint(str[4])\n# this is returning the indexError\
    \ because 6th index doesn’t exist\nprint(str[6])\n```\n\n**Output:**\n```\nHELLO\n\
    IndexError: string index is out of normal range\n```\n---\n\nAs shown in the example\
    \ above, the individual characters of the string can be accessed using the slice\
    \ operator `[]`. Meanwhile, the substring could be obtained using the colon operator\
    \ `:` in Python. Look at this example:\n\n```python\nStr = \"HELLO\"\n```\n\n\
    | H | E | L | L | O |\n|---|---|---|---|---|\n| 0 | 1 | 2 | 3 | 4 |\n\n```python\n\
    str[0] = ‘H’          str[:] = ‘HELLO’\nstr[1] = ‘E’          str[0:] = ‘HELLO’\n\
    str[2] = ‘L’          str[:5] = ‘HELLO’\nstr[3] = ‘L’          str[:3] = ‘HEL’\n\
    str[4] = ‘O’          str[0:2] = ‘HE’\n                      str[1:4] = ‘ELL’\n\
    ```\n\nIn these examples, you can see that the higher series given in the slice\
    \ operator is exclusive at all times. That is if `str` (string) = `'HELLO'` is\
    \ given. Then, `str[1:3]` will have `str - string[1] = ‘E’` and `str[2] = ‘L’`\
    \ with nothing else attached.\n\n### Advanced Slicing Examples\n\n```python\n\
    # Given String\nStr = “JAVAPOINT”\n# Begin 0th index to the end\nprint(str[0:])\n\
    # Begins 1th index to the 4th index\nprint(str[1:5])\n# Begins 2nd Index to the\
    \ 3rd index\nprint(str[2:4])\n# Begins 0th index to 2nd index\nprint(str[:3])\n\
    # Begins 4th index to 6th index\nprint(str[4:7])\n```\n\n**Output:**\n```\nJAVATPOINT\n\
    AVATVA\nJAVTPO\n```\n\n### Negative Indexing\n\nNegative cutting in the sequence\
    \ begins from the rightmost character. This is indicated as `-1` while the second\
    \ rightmost character is shown as `-2`, and it continues in that order. Look at\
    \ this figure below.\n\n```python\nStr = \"HELLO\"\n```\n\n| H | E | L | L | O\
    \ |\n|---|---|---|---|---|\n| -5 | -4 | -3 | -2 | -1 |\n\n```python\nstr[-1] =\
    \ ‘O’\nstr[-2] = ‘L’\nstr[-3] = ‘LL’\nstr[-4] = ‘ELL’\nstr[-5] = ‘HE’\n```\n\n\
    ```python\nStr = ‘JAVATPOINT’\nprint(str[-1])\nprint(str[-3])\nprint(str[-2:])\n\
    print(str[-4:-1])\nprint(str[-7:-2])\n# Reversing the given string\nprint(str[::-1])\n\
    print(str[-2:])\n```\n\n**Output:**\n```\nT\nINT\nPOINT\nAVAT\nNIAVA\nIndexError:\
    \ string index out of range\n```\n\n### How to Reassign Strings\n\nYou can reassign\
    \ strings by renewing the contents and placing them in a new one. Assigning items\
    \ is not supported by string. Strings are immutable and cannot be swapped. The\
    \ content of strings is replaceable by new strings. See this example:\n\n```python\n\
    Str = \"HELLO\"\nstr[0] = “h”\nprint(str)\n```\n\n**Output:**\n```\nTypeError:\
    \ 'str' or ‘string’ object doesn’t hold item assignment\n```\n\nIn this sample,\
    \ the string can be transferred completely to a new content. Look at this second\
    \ example:\n\n```python\nstr = \"HELLO\"\nstr = “hello”\nprint(str)\n```\n\n**Output:**\n\
    ```\nHELLO\nhello\n```\n\n### How to Delete Strings\n\nAs I said earlier, strings\
    \ maintain their immutable features in Python. Therefore, you cannot erase or\
    \ take away the characters from the string. But you can delete the entire string\
    \ using the `del` keyword.\n\n```python\nstr = “JAVATPOINT”\ndel str[1]\n```\n\
    \n**Output:**\n```\nTypeError: 'str' object doesn't support the deletion of item\n\
    ```\n\nNow, to delete an entire string, look at this example:\n\n```python\nstr1=\
    \ “JAVATPOINT”\ndel str1\nprint(str1)\n```\n\n**Output:**\n```\nNameError: name\
    \ ‘str1’ is not defined\n```\n\n### String Operators\n\nSeveral string operators\
    \ exist in Python programs such as:\n\n1. **Range Slice operator `[:]`**: this\
    \ is used for accessing characters from a specified range.\n2. **Slice operator\
    \ `[]`**: used for accessing the substrings of a particular string.\n3. **Concatenation\
    \ operator `+`**: this is used for joining the strings given on either side of\
    \ the operator.\n4. **Membership operator `not in`**: used for reversing in. When\
    \ a specified substring is not present in a specified string, the operator returns\
    \ `true`.\n5. **Repetition operator `*`**: used for concatenating numerous copies\
    \ of similar string.\n6. **String formatting operator `%`**: used to format strings.\
    \ It also uses format specifiers applied in C programming such as `%f` and `%d`.\
    \ These specifiers are used for mapping values in Python.\n7. **Raw string specifier\
    \ `r/R`**: for specifying raw strings used in situations where we should print\
    \ the real significance of escape letters such as “C://python.” Before you can\
    \ classify any string as unprocessed string, the letter should be followed by\
    \ the particular string.\n8. **Another membership operator `in`**: this operator\
    \ returns `true` if an individual substring is available in a particular string.\n\
    \nCheck out these operators in the following examples:\n\n```python\nstr = “Hello”\n\
    str1 = “world”\nprint(str=3) # prints HelloHelloHello\nprint(str+str1) # prints\
    \ Hello world\nprint(str[4]) # prints o\nprint(str[2:4]); # prints II\nprint('w'\
    \ in str) # prints negative or false as w is not available in str\nprint('wo'\
    \ not in str1) # prints false as wo is available in string1 or Str1\nprint(r’C://python37’)\
    \ # prints C://python37 as it is written\n```\n\n**Output:**\n```\nHelloHelloHello\n\
    Hello world\nOII\nFalseFalse\nC://python37\nThe string str : Hello\n```\n\n###\
    \ String Formatting in Python using Escape Sequence\n\nIf we need to write a text\
    \ such as, He said, “Hello, where are you going?” this could be handled using\
    \ triple quotes. The escape sequence is represented with a backslash (`\\`). Let\
    \ us check this example.\n\n```python\nstr = “”He said, “Hello, where are you\
    \ going?””\nprint(str)\n```\n\n**Output:**\n```\nSyntaxError: invalid syntax\n\
    ```\n\nHere is a list of escape sequence in Python\n\n| S/N | Escape Sequence\
    \ | Description | Examples |\n|---|---|---|---|\n| 1. | `\\'` | Single Quotes\
    \ | `print(‘\\’)` |\n| 2. | `\\a` | ASCII Bell | `print(“\\a”)` |\n| 3. | `\\\"\
    ` | Double Quotes | `print(“\\\"”)` |\n| 4. | `\\\\` | Backslash | `print(“\\\\\
    ”)` |\n| 5. | `\\b` | ASCII Backspace (BS) | `print(“Hello \\b World”)` |\n| 6.\
    \ | `\\newline` | This ignores the line | `print(“Python1 \\ Python2 \\ Python3”)`\
    \ |\n| 7. | `\\r` | ASCII Carriage Return (CR) | `print(“Hello \\r World!”)` |\n\
    | 8. | `\\n` | ASCII Linefeed | `print(“Hello\\n World!”)` |\n| 9. | `\\f` | ASCII\
    \ Formfeed | `print(“Hello \\f World!”)` |\n| 10. | `\\xHH` | Character or letter\
    \ with hex value | `print(“\\x48\\x5\\x6c\\6c\\x6f”)` |\n| 11. | `\\v` | ASCII\
    \ Vertical Tab | `print(“Hello \\v World!”)` |\n| 12. | `\\t` | ASCII Horizontal\
    \ Tab | `print(“Hello \\t World!”)` |\n| 13. | `\\ooo` | The character or letter\
    \ with octal value | `print(“\\110\\145\\154\\154\\157”)` |\n"
