  trans: "\n\n### 字符串索引与切片基础\n\n```python\nstr[0] = ‘H’\nstr[1] = ‘E’\nstr[2] = ‘L’\n\
    str[3] = ‘L’\nstr[4] = ‘O’\n```\n\n现在，你也可以检查下面的示例。\n\n```python\nStr = “HELLO”\n\
    print(str[0])\nprint(str[1])\nprint(str[2])\nprint(str[3])\nprint(str[4])\n# 这会返回\
    \ indexError，因为第 6 个索引不存在\nprint(str[6])\n```\n\n**输出：**\n```\nHELLO\nIndexError:\
    \ string index is out of normal range\n```\n---\n\n如上面的示例所示，可以使用切片运算符 `[]` 访问字符串的单个字符。同时，在\
    \ Python 中可以使用冒号运算符 `:` 获取子字符串。看这个示例：\n\n```python\nStr = \"HELLO\"\n```\n\n|\
    \ H | E | L | L | O |\n|---|---|---|---|---|\n| 0 | 1 | 2 | 3 | 4 |\n\n```python\n\
    str[0] = ‘H’          str[:] = ‘HELLO’\nstr[1] = ‘E’          str[0:] = ‘HELLO’\n\
    str[2] = ‘L’          str[:5] = ‘HELLO’\nstr[3] = ‘L’          str[:3] = ‘HEL’\n\
    str[4] = ‘O’          str[0:2] = ‘HE’\n                      str[1:4] = ‘ELL’\n\
    ```\n\n在这些示例中，你可以看到切片运算符给出的高序列始终是不包含终点的。也就是说，如果 `str`（字符串） = `'HELLO'`，那么 `str[1:3]`\
    \ 将拥有 `str - string[1] = ‘E’` 和 `str[2] = ‘L’`，没有其他内容。\n\n### 高级切片示例\n\n```python\n\
    # 给定字符串\nStr = “JAVAPOINT”\n# 从索引 0 开始到结束\nprint(str[0:])\n# 从索引 1 开始到索引 4\nprint(str[1:5])\n\
    # 从索引 2 开始到索引 3\nprint(str[2:4])\n# 从索引 0 开始到索引 2\nprint(str[:3])\n# 从索引 4 开始到索引\
    \ 6\nprint(str[4:7])\n```\n\n**输出：**\n```\nJAVATPOINT\nAVATVA\nJAVTPO\n```\n\n\
    ### 负索引\n\n序列中的负切片从最右侧的字符开始。最右侧的字符表示为 `-1`，第二个右侧显示为 `-2`，依此类推。看下面的图。\n\n```python\n\
    Str = \"HELLO\"\n```\n\n| H | E | L | L | O |\n|---|---|---|---|---|\n| -5 | -4\
    \ | -3 | -2 | -1 |\n\n```python\nstr[-1] = ‘O’\nstr[-2] = ‘L’\nstr[-3] = ‘LL’\n\
    str[-4] = ‘ELL’\nstr[-5] = ‘HE’\n```\n\n```python\nStr = ‘JAVATPOINT’\nprint(str[-1])\n\
    print(str[-3])\nprint(str[-2:])\nprint(str[-4:-1])\nprint(str[-7:-2])\n# 反转给定的字符串\n\
    print(str[::-1])\nprint(str[-2:])\n```\n\n**输出：**\n```\nT\nINT\nPOINT\nAVAT\n\
    NIAVA\nIndexError: string index out of range\n```\n\n### 如何重新赋值字符串\n\n你可以通过更新内容并将其放在新字符串中来重新赋值字符串。字符串不支持项赋值。字符串是不可变的，不能进行交换。字符串的内容可以用新字符串替换。看这个示例：\n\
    \n```python\nStr = \"HELLO\"\nstr[0] = “h”\nprint(str)\n```\n\n**输出：**\n```\n\
    TypeError: 'str' or ‘string’ object doesn’t hold item assignment\n```\n\n在示例样本中，字符串可以完全转移到新内容。看这个第二个示例：\n\
    \n```python\nstr = \"HELLO\"\nstr = “hello”\nprint(str)\n```\n\n**输出：**\n```\n\
    HELLO\nhello\n```\n\n### 如何删除字符串\n\n正如我之前所说，字符串在 Python 中保持其不可变特性。因此，你无法从字符串中擦除字符。但你可以使用\
    \ `del` 关键字删除整个字符串。\n\n```python\nstr = “JAVATPOINT”\ndel str[1]\n```\n\n**输出：**\n\
    ```\nTypeError: 'str' object doesn't support the deletion of item\n```\n\n现在，要删除整个字符串，看这个示例：\n\
    \n```python\nstr1= “JAVATPOINT”\ndel str1\nprint(str1)\n```\n\n**输出：**\n```\n\
    NameError: name ‘str1’ is not defined\n```\n\n### 字符串运算符\n\nPython 程序中存在几种字符串运算符，例如：\n\
    \n1. **范围切片运算符 `[:]`**：用于访问指定范围内的字符。\n2. **切片运算符 `[]`**：用于访问特定字符串的子字符串。\n3. **拼接运算符\
    \ `+`**：用于连接运算符两侧提供的字符串。\n4. **成员运算符 `not in`**：用于反向包含。当指定的子字符串不在指定的字符串中时，运算符返回\
    \ `true`。\n5. **重复运算符 `*`**：用于重复指定的字符串。\n6. **格式化运算符 `%`**：用于格式化字符串。\n7. **原始字符串\
    \ `r`**：用于原始字符串。\n8. **成员运算符 `in`**：用于检查子字符串是否存在。\n\n### 使用转义序列进行字符串格式化\n\n如果我们需要编写如反斜杠（`\\\
    `）这样的文本，可以使用三引号来处理。\n\n```python\nstr = “”Hello, where are going?””\nprint(str)\n\
    ```\n\n**输出：**\n```\nSyntaxError: invalid syntax\n```\n\n这里是 Python 中的转义序列列表\n\
    \n| S/N | 转义序列 | 描述 | 示例 |\n|---|---|---|---|\n| 1. | `\\'` | 单引号 | `print(‘’)`\
    \ |\n| 2. | `\\a` | ASCII 响铃 | `print(“\\a”)` |\n| 3. | `\\\"` | 双引号 | `print(“\\\
    \"”)` |\n| 4. | `\\\\` | 反斜杠 | `print(“\\\\”)` |\n| 5. | `\\b` | ASCII 退格 (BS)\
    \ | `print(“Hello \\b World”)` |\n| 6. | `\\newline` | 忽略换行 | `print(“Python1\
    \ \\ Python2 \\ Python3”)` |\n| 7. | `\\r` | ASCII 回车 (CR) | `print(“Hello \\\
    r World!”)` |\n| 8. | `\\n` | ASCII 换行 | `print(“Hello\\n World!”)` |\n| 9. |\
    \ `\\f` | ASCII 分页符 | `print(“Hello \\f World!”)` |\n| 10. | `\\xHH` | 十六进制值的字符\
    \ | `print(“\\x48\\x5\\x6c\\6c\\x6f”)` |\n| 11. | `\\v` | ASCII 垂直制表 | `print(“Hello\
    \ \\v World!”)` |\n| 12. | `\\t` | ASCII 水平制表 | `print(“Hello \\t World!”)` |\n\
    | 13. | `\\ooo` | 八进制值的字符 | `print(“\\110\\145\\154\\154\\157”)` |\n\n"
