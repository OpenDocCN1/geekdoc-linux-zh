    # 数字与变量


    Python 中的数字和变量指的是数值变量。


    ## Python 数字

    在 `Python` 中，数字以浮点值、整数和复数的形式存储。这取决于取决于程序的需求。共有两种类型：浮点值和整数。


    ## Python 变量

    变量指的是系统内存中的位置，并被用作用于存储值的标识符。`Python` 是一种推断语言，不需要指定变量的类型。

    变量是字母和数字（数字）的组合。然而，它们以字母或下划线（`_`）开头。在编写变量时，可以使用小写字母命名变量，例如 `John` 和 `john` 是两个不同的变量。


    ## 数值变量类型

    有两种数值变量可用。


    ### 整数

    整数是由整数组成的数值，如 `1`、`2`、`3`、`10`、`20`、`100`、`2000`、`50,000`、`1000000`、`10,000,000`
    等。你通过编写任何整数整数在 `Python` 中应用此变量，如上所示。


    #### 示例

    表达式 `x = 2` 意味着整数 `2` 将存储在变量 `x` 中。`x` 是变量，`2` 是数字，因此标签为“数值变量”。如果你使用的是 64 位系统，你可以在
    Python 平台的整数变量中存储于 `4000338912344092341` 和 `4000338912344092340` 之间的整数。


    ### 浮点值

    浮点值是带有小数点的 Python 数字。任何带有小数部分的数字都会被识别为浮点值。

    因此，诸如 `x = 6.5` 的术语意味着浮点值 `(6.5)` 存储在变量 `x` 中。此外，可以通过这种方式存储巨大的数字，例如 `3.2250738585072015
    × 10308` 到 `2.7976931348623157 × 10308`。

    可以使用 `float` 数字功能将整数转换为浮点数。例如：


    ```python

    X = 6

    print(x)

    print(float(x))

    ```


    如果执行此表达式，代码可以产生如下输出：

    ```

    5.0

    ```


    然而，你可以通过整数数字功能将浮点值转换为整数。看看除两个整数会发生什么：


    ```python

    x = 5

    y = 2

    z = x / y

    print(z)

    ```

    输出：`2.5`


    在上面的表达式中，数值（数字）被定义为整数（整数）。此操作的结果是一个浮点数。这是 `Python 3.x` 的特性——`Python 2.x` 会执行整数除法并返回结果
    `2`。


    ## 用于标识符命名的变量

    变量用于标识符命名。程序员使用它来标识程序中的字面量。以下是在表达式中命名标识符的各种方式：


    1. 标识符名称中不应有空格和特殊字符。此类字符示例包括 `#`、`^`、`%`、=`、`!`、`&` 等。

    2. 在 `Python` 中，标识符名称对大小写敏感。这意味着 `''my book''` 和 `''MyBook''` 不是同一个表达式。

    3. 语句中有效的标识符包括 `n_9`、`_n`、`a123` 等。

    4. 语句中无效的标识符包括 `n 9`、`n%4`、`1a` 等。

    5. 标识符的名称必须与语言中表示的关键字相似。

    6. 变量必须以下划线（`_`）或字母开头。

    7. 在 `Python` 语句中，除第一个字符外的每个字母都可以是大写字母，如 `A`、`B`、`C`、`D`……，或小写字母如 `a`、`b`、`c`、`d`。也可以是数字如
    `1`、`2`、`3`、`4`……或下划线（`_`）。


    ## 如何声明变量和赋值

    你不需要在程序中使用变量之前对其进行声明。`Python` 允许你在表达式需要变量时及时创建变量。

    通过为变量赋值来立即且自动地定义和声明变量。在语句中使用符号（=`）“等于”来声明变量。此标记将值分配给变量。


    ## 如何在 Python 中引用对象

    作为程序员，你需要理解如何在 `Python` 中引用对象。这定义了在你声明变量时 `Python` 解释器运行的方式。处理变量的方式与其他编程语言不同。

    有经验的程序员理解 `Python` 是一种高度面向对象的编程语言。因此，所有数据项都属于特定类型的类。例如：


    ```python

    print("James")

    ```

    输出：`James`


    整数由 Python 对象创建并将其显示在控制台上。我在上面的 `print` 语句中创建了一个字符串对象。确定此点的另一种方法是使用内置的 `type()`
    功能。例如：


    ```python

    type("James")

    ```

    输出：`<class ''str''>`


    在 `Python` 程序中，变量被分类为语句中指向对象的指针或引用的符号名称。变量用于为对象命名。例如：


    ```python

    b = 20

    ```

    `b` 是对象。


