  trans: "\n\n# 1. 安装 LÖVE 程序\n\n第一步是在设备上按照一个简单的命令来安装 LÖVE 程序。\n\n```bash\n$ sudo\
    \ apt install love2d\n```\n\n如果你在树莓派上运行 [Fedora](https://opensource.com/article/17/3/how-install-fedora-on-raspberry-pi)，你可以使用\
    \ `dnf` 代替 LÖVE 软件。\n\n```bash\n$ sudo dnf install love2d\n```\n\n然而，通过安装这些应用程序中的任何一个，你已经在你的设备上引入了\
    \ `Lua`、`SDL` 或其他 LÖVE 运行所需的应用程序。\n\n## 从“Hello, World!”程序开始\n\nLÖVE 引擎作为一个框架存在，使你能够在编写游戏时使用你喜欢的任何文本编辑器。从“hello\
    \ world!”程序开始。确保该程序在你的设备上启动，它将向你介绍 LÖVE 框架和 Lua 语言的基础语法。进入你的系统，打开文本编辑器，输入以下内容：\n\
    \n```lua\ncwide = 520\nchigh = 333\nlove.window.setTitle('  Hello World ')\nlove.window.setMode(cwide,\
    \ chigh)\nfunction love.load()\n    love.graphics.setBackgroundColor(177, 106,\
    \ 248)\n    -- font = love.graphics.setFont(\"SkirtGirl.ttf\", 72)\nend\nfunction\
    \ love.draw()\n    love.graphics.setColor(255, 33, 78)\n    love.graphics.print(\"\
    Hello World\", cwide/4, chigh/33)\nend\n```\n\n将上述内容保存为 `main.lua`。带有 `.love`\
    \ 扩展名的文件是可分发的 LÖVE 包。主文件应标记为 `main.lua`，你可以以这种格式创建它：\n\n```bash\n$ love main.lua\n\
    ```\n\n然后，在创建扩展后启动该程序。它应该是这样的：\n\n```bash\n$ love ./hello.love\n```\n\n这将为你输出：“HELLO,\
    \ WORLD!”这是一个简单易懂的代码。`cwide` 和 `chigh` 变量是通用的，可以在整个脚本中看到。第一个代码块是设置背景颜色的函数。第二个代码块在屏幕上打印“hello\
    \ world!”。包含两个连字符（`--`）的行是注释。在这种情况下，你不应使用 Skirt  。从 [FontLibrary.org](https://fontlibrary.org/)\
    \ 获取字体。相应的调整代码：\n\n```bash\n$ love main.lua SkirtGirl.ttf\n```\n\n然后启动程序：\n\n\
    ```bash\n$ love ./hello.love\n```\n\n## 树莓派上的游戏类型\n\n你可以在系统上安装并玩各种游戏。这些包括：\n\n\
    1. Minetest\n2. Widelands\n3. Duke Nukem 3D\n4. Beneath a Sky\n5. Micropolis\n\
    6. Freeciv\n7. Which-Way-Is-Up\n8. Openrena\n9. Quake III Arena\n10. Star Wars\
    \ by Jedi Knight\n11. Battle for Wesnoth\n12. Funny Boat\n13. Littlecrane\n14.\
    \ Flight of the Amazon Queen\n15. Abuse\n16. SuperTux\n17. Angry Dwarves\n18.\
    \ RailWorld\n19. Dance\n20. OpenTT\n21. Simutrans\n22. Quake “other”\n23. Monsterz\n\
    24. BOOM，以及更多。\n\n## Pygame 与 Hello\n\n`Pygame` 意味着游戏的入门。这是 Python 游戏编程。如果你作为程序员了解\
    \ `pygame`，可以使用它快速在每个平台上编写游戏。这是基于 `SDL` 库。它意味着简单的媒体层，为你的树莓派系统提供了跨平台的访问能力。这些组件包括键盘、摇杆、视频和音频。`pygame`\
    \ 作为 `SDL` 项目的替代品。你可以在支持这些应用的任何平台上编写游戏和其他程序。Hello，`pygame` 是 `pygame` 的另一个版本。什么是坐标？`Coordinates`\
    \ 作为树莓派追踪器。它不需要 GPS 即可附加到任何车辆上。它连接到 Google Maps，让你能够随时随地跟踪汽车或其他物体的位置。使用 RPi 进行车辆跟踪或位置跟踪可以使用内存卡。\n\
    \n# 第十一章：什么是树莓派机器人？\n\n树莓派机器人是使用 Pi 完成的可编程机器人套装。树莓派机器人的一个例子是 Arduino 机器人。树莓派设备的功能类似于桌面电脑，但更小、更便宜。经验程序员、爱好者和其他粉丝可以使用它来构建机器人。\n\
    \n### 树莓派机器人的要求\n\n构建树莓派机器人的要求包括：\n\n1. 2 个五伏直流电机\n2. 6 个 AA 电池及其电池盒用于为电机供电\n\
    3. 用于构建简单电路而无需的小面包板\n4. 粘性胶\n5. 底盘 - 6 英寸的平方形材料，例如激光切割塑料、乐高和纸板。额外的两个脚用于稳定机器人。\n\
    6. `L293D` 电机控制器\n7. 两个带有带抓地力的橡胶轮胎的轮子 – 这些轮胎卡在电机轴上\n8. 5 伏 USB 移动电源，为 Pi 设备供电\n\
    9. 连接所有设备的跳线导\n10. 用于在机器人运行前加载软件的 `microSD` 卡\n\n### 设置树莓派机器人的方法\n\n#### 连接电线\n\
    \n将设备和面包板安装在底盘上后，你可以使用像粘性胶之类的胶剂将它们固定在一起。在面包板上固定 `L293D` 电机控制器。将跳线电路连接到树莓派设备上的正确引脚，包括面包板。然后，将每个直流电机的两根线都连接电机控制器的输出引脚上。\n\
    \n#### 将系统连接到电源\n\n将电机、轮子和电池盒安装到机器人的底部。连接电源线并将它们引到面包板。然后，将它们连接到 `L293D` 的电机电源输入端。接上\
    \ 5 伏电池包并插入树莓派。\n\n#### 下载软件\n\n你需要通过下载可以帮助你通过 Pi 控制机器人的软件来准备卡。运行 Pi 的软件是 [NOOBS](https://www.raspberrypi.org/downloads/raspberry-pi-os/)。访问网站并下载。解压并将\
    \ NOOBS 的操作系统复制到 `microSD` 卡中。之后，将卡插入你的 Pi 中。将鼠标、键盘和显示器连接到树莓派。按照系统提示在你的系统上安装 Raspbian\
    \ 软件。\n\n"
- fmt: '

    You can also view at the simple 10-line Python program in the terminal with this
    command:


    ```bash

    nano first_move.py

    ```


    This command will open the code in `Nano`, which is Pi’s native text editor.


    ## Run the Python Program

    At this stage, it is time to install the program and make your new robot move
    around. You should use this command to execute the code.


    ```bash

    Python3 first_move.py

    ```


    After entering the code, your robot will begin to move around in a square. Return
    to the program using the `Nano` editor. Change the time delays and change the
    commands for backward, forward, right, and left to create your desired movements,
    actions, and responses in the robot.


    ## Add Sensors and Write New Code

    It is time to grow your robot’s potentials by adding sensors and writing new codes.
    That’s the essence of using the Pi platform for controlling your robot.


    Attach an infrared sensor to the robot’s nose. Program the bot to trail a black
    line on the floor. You can also add a camera with an integrated computer-vision
    code. This will help to get the droid in chasing after a ball or any other object
    you desire.


    ## How to Handle Autonomous Rover

    You can build an autonomous rover that can function with your system. This device
    is useful for competitions and various activities. You can create this device
    by following simple rules and approaches.


    ## How to Assemble the Hardware

    The equipment needed for this project includes `Raspberry Pi 3`, `Pi camera V2`,
    `Arduino Mega 2560`, and `Tensorflow` object detection API. Others are custom
    3D chassis model, voltage regulators, pickup servo motors, custom `Mr. W` stepper
    motor controller, and batteries such as custom-made `4x Lithium 18650` cell that
    can generate 21 volts.


    ## Running the Software

    The device is designed with software for processing and controlling all the movements
    of the rover. This software functions as the intelligence unit of the robot. It
    contains specific movement instructions and communicates with the `Arduino`. The
    motions could be like the move left thirty degrees or go to the right twenty inches.
    The mobility of your robot depends on its serial communication.


    ## CONCLUSION

    If you are a Pythonista or Pythoneer, this book provides an incredible opportunity
    for you to understand how to navigate a `Raspberry Pi` platform successfully.
    You can play games and control technological devices such as robots, drones, and
    other machines easily with your Pi.


    The revolution in technology has enhanced the development of this pocket-size
    computer that can function like your desktop or laptop computers. However, it
    is cheaper and smaller in size.


    The `Raspbian` is its operating system and works with `Linux OS`. All you need
    to use this device properly is the right equipment such as a screen like monitor,
    `HDMI`, power source, adaptor, mouse, keyboard, internet connection, a television,
    and the `Raspberry Pi` itself. You also need knowledge of how to interconnect
    them for effective performance.


    The `Raspberry Pi` can operate all your smart home appliances. You should upgrade
    your IT skills by reading this book extensively and mastering the information
    loaded inside. With this, you can become a programmer capable of handling a microcomputer
    device and performing multiple assignments and technological projects.

