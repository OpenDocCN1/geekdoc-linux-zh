    # 什么是面向对象？


    面向对象是一种通过使用对象进行计算来解决程序的方法。对象是程序中的一个组件，用于执行特定操作并与程序的其它元素进行交互。面向对象编程的基本组件是对象。


    程序中对象的一个例子是人。因此，从逻辑上说，这样的人必须有一个名字。名字变成了这个人的一个属性，他可以执行吃饭、饮水、行走等不同的功能。这些功能就成了这个人（对象）的方法。


    在面向对象编程（OOP）中，代码围绕对象组织，对象之间可以相互交互以实现各种功能。设计一个某人正在开车的程序，首先需要你描述涉及的对象，即人和车。现在你将指定方法。这些是：人如何开车，车辆如何被驾驶。在组织好对象后，你就可以将它们结合起来并创建一个人驾驶车辆的图表。


    因此，类（class）是对象的模型，是一个概念。对象是该概念的体现。在设计对象之前会先创建一个类。在创建对象之后，你就准备好设计某些内容了。这涉及到方法。


    在面向对象编程中，方法（method）是与类相关的过程。它定义了从类创建的对象的行为。对象执行的操作被称为方法。类与方法之间的交互被称为绑定（binding）。


    # 第五章：如何在树莓派上使用文件和互联网


    ![Using Internet.png](img/Image00017.jpg)


    ## 在树莓派上使用文件和互联网


    你可以轻松地在 Pi 上使用文件和互联网。这将允许你能够在虚拟的基础上完成任务并处理多个项目。实现这一点的某些方法包括：


    1. **端口转发** – 处理此问题的最佳方法是通过端口转发。你可以通过你的路由器访问互联网。在你的路由器上设置端口转发功能。这意味着你将配置路由器，将所有指向特定端口的入站互联网流量转发到你系统的本地
    IP 地址。


    各种路由器都设计了此功能。但不同的路由器具有不同的配置，请遵循你路由器用户手册上的说明进行正确配置。如果你的树莓派有多个路由器，或者它位于防火墙之后，你可能会发现操作困难。端口转发功能的一个显著缺点是它会将个人局域网（LAN）上的系统端口暴露给开放互联网。建议仔细管理此功能，因为这是一个安全威胁。


    2. **第三方在线端口转发服务** – 通过第三方服务提供了几种可选的端口转发解决方案。它们可以提供各种类别的功能。


    ## 树莓派中的文件是什么？


    在树莓派中，文件是你保存在系统中的以供未来参考的数据或文档。这些文件被保存在文件夹中以便进行良好的组织和管理。一个文件夹可以包含多个文件，甚至是其他文件夹。树莓派有一个名为
    `File Manager`（文件管理器）的文件管理软件。该应用位于 Pi 系统任务栏浏览器图标的右侧，用一个破旧的归档柜表示。


    如果你想启动文件管理应用，点击点击图标。窗口左侧将出现各种文件和文件夹列表。点击任何文件夹以查看内部的文件。当你点击一个文件夹时，文件将出现在窗口的右侧。你可以通过点击文件夹描述旁边的小三角形来查看文件夹中的文件。此操作将打开文件夹并显示其内部的文件夹或文件，使三角形指向下方。如果你关闭文件夹，三角形将面向文件夹名称右侧。


    树莓派中文件夹的完整列表被称为 `directory tree`（目录树）。它看起来像一棵倒置的树。它从文件夹中的一个根目录开始生长。这个文件夹在 Pi 中具有重要意义，它被称为单反斜杠
    `\`。这个文件夹包含了其他文件夹，使得使用和导航你的树莓派变得简单。如果你检查窗口上的文件夹列表，你会注意到列表顶部有一个被称为 `pi` 的。这被称为主目录（home
    folder）。树莓派设备上的每个用户都有这个名为 `Pi` 的文件夹，即主目录。程序员在主窗口上花费大量时间。它位于并放置在目录树中，你不需要在看到它之前导航到主树。


    在文件管理器中快速点击即可找到主目录。定位主目录的另一种方法是在看到它之前滚动并点击许多文件和按钮。这通常被认为是费力的方法，但你应该知道快捷键。


    ### 在文件管理器中导航


    你树莓派中的每个文件都有文件管理器分配给它们的地址。这表现为在访问文件之前需要点击的文件夹列表。这些地址在文件归档系统中被称为 `paths`（路径）。因此，在你的系统中获取地址就像在小径上散步一样。路径在到达目的地之前可能会有弯道和胡巷。


    #### 在树莓派中访问文件的分步方法


    1. 打开系统并点击“主目录”。

    2. 点击主目录内的 `pi` 文件夹。

    3. 继续点击各种查看各种文件夹，直到到达所需的文件夹。


    在设备中导航很容易，因为 `File Manager` 始终会引导你找到正确的文件和文件夹。这是一个可以带你进入 Pi 中已安装应用的地址示例。


    ```

    | /usr/share/raspi-ui-overrides/applications

    ```


    你可以尝试此地址来访问你树莓派设备中的文件。向下滚动文件和文件夹列表以在 `/usr/share` 中找到你的文件。通过双击文件管理器中的任何应用或文件夹，你可以启动并打开它们。


    ## 如何管理文件系统


    ![Internet on Raspberry.png](img/Image0018.jpg)


    ### 管理文件系统


    Raspbian 中的终端使用特定命令操作文件系统。以下是管理文件系统的某些方法。


    #### 创建文件


    你在终端中有多种创建的方法。但处理此过程最简单的方法是应用 `touch` 控制。此命令用于创建和更新文件的时间戳。它涉及非常简单的语法。只需输入 `touch
    ` 然后是文件名。如果不存在指定的文件，该命令将快速创建一个新文件。通过遵循命令在 `/home/pi/` 目录下创建一个名为 `textfile.txt`
    的新文件。


    ```bash

    pi@new-hostname – $ touch /home/pi/textfile.txt

    ```


    #### 删除文件


    使用 `rm` 命令删除文件非常简单。要删除你创建的文件，只需在窗口中文件名之前输入 `rm`，数据就会被移除。


    ```bash

    pi@new-hostname – $ rm textfile.txt

    ```


