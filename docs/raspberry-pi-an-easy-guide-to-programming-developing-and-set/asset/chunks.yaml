- fmt: '

    # How to Show the Content of a File


    Contents in a file on your system could be displayed using a text viewer or text
    editor. In Raspbian, various programs can help you to view the contents of your
    files and folders. One of them is called `less` program. It can show the contents
    of your files on the screen one after another. It functions using the syntax `less`.
    Go to your keyboard and type the command, `less`, followed by the title of the
    document you want to display. If you want to show the content of the document
    you created above, use this command.


    ```bash

    pi@new-hostname - $ less /home/pi/textfile.txt

    ```


    After entering this command, the content will be shown in the `less` program window.
    However, quitting the `less` program is simple by pressing the `q` button on your
    keyboard. You can also show the contents of your file by applying the `cat` command.
    Here, the content will be displayed at the terminal directly. For example:


    ```bash

    pi@new-hostname - $ cat textfile.txt

    Hello, world!

    ```


    # Reading and Writing Files


    If you want the output of your program to be readable by humans, you can present
    your data in several ways. You can even file the information for future use.


    ## Ways to Write Values


    You can write values through:


    1.  `Write()` system of file objects. Here, the regular output document can be
    referenced as `sys.stdout`.

    2.  Expression statements.

    3.  The `print()` function.


    Most times, you should format your output properly instead of printing separated
    values. You can format your output or writings in two ways such as


    1.  String slicing and concatenation operations. With this, you can design any
    possible layout. It has some procedures for performing essential services for
    stuffing strings to specific column width.

    2.  Using the `str.format()` process.


    The string element has a template class that provides another way of alternating
    value strings. Python program can help you in converting values to strings and
    transfer it to the `str()` function or `repr()` function. A string may contain
    a filename or few characters. This will define the way (`mode`) the file may be
    used. The mode could be `‘r''` indicating data meant to be read while `‘w''` for
    files that will be written. It could also be used for data marked for deleting.
    `‘a''` opens the doc for attaching or appending any info written to the file.
    This is added automatically to the end. If you see the codes `‘r+`, it means the
    files are available for interpreting and writing.


    When docs are opened in text mode, you can read and write sequences from the file
    or read and write sequence to the file. These are preset in a particular encoding.
    But if the programming is not specific, the default is dependent on the stage.
    The code `‘b''` attached to the method opens the doc in a binary mode. Here, the
    data will be written and read like bytes objects. The pattern is suitable for
    files without text.


    If you are reading in text format, the default will convert the platform-specific
    line endings such as `(\r\n` on Windows, `\n` on Unix) to just `\n`. If you are
    writing in text mode, the default will transfer episodes of `\n` back to the platform-specific
    line endings. These modifications are suitable for text data but can corrupt binary
    data such as the `JPEG` or `EXE` docs. Be cautious about using binary modes when
    reading and writing such files.


    # What are the differences between the Internet and Pickling?


    ## Internet Connection on Raspberry Pi


    The internet is used for accessing the web from a mobile device or computer. As
    I mentioned above, you can do this through port forwarding. This involves changing
    the configuration of your router to forward all inbound traffic from the internet
    on a port to a local IP address. It could also be done through third party agencies
    handling port forwarding.


    Pickling is the process of using a module to implement a fundamental and robust
    algorithm for serializing and de-serializing a Python object structure. This involves
    converting a Python object hierarchy into a byte stream. Wherefore, unpickling
    is the inversion of this operation, causing a byte stream to be reconverted into
    an object chain of command.


    These two terms, pickling and unpickling, are also referred to as marshaling,
    flattening or 1, and serialization. The `pickle` module maintains a pathway of
    the objects already serialized. This will prevent the serialization of the same
    objects in future references.


    # CHAPTER SIX: HANDLING GRAPHICAL USER INTERFACES IN RASPBERRY


    ## GUIs on Raspberry Pi


    Graphical User Interfaces on a Pi is a type of interface that enables programmers
    and users to interact with your systems using visual indicator representations
    such as TVs and monitors. It was developed by Xerox Palo Alto in the late 1970s
    but deployed commercially by Apple’s Macintosh, including Microsoft windows OS.


    GUIs are the model of user-based blueprint in software, as it offers users the
    capacity to operate computers and various electronic gadgets intuitively. This
    is possible through direct application of graphical emblems such as buttons, tabs,
    menus, scroll bars, mouse, cursors, and windows. Nowadays, graphical user interfaces
    come with touch-screen and voice-prompt (command) features and functionalities.


    The best programming language for GUIs includes Java or C#, Python, C/C++, and
    HTML5/Javascript. Various GUI libraries are available for different languages.
    Some renowned GUIs include Windows 10 Mobile, BlackBerry OS, Microsoft Windows,
    Ubuntu Unity, macOS, Firefox OS for smartphones, GNOME Shell for desktop setting,
    Android, Apple’s iOS, and Palm OS-WebOS.


    ## What is Tkinter Module in Python?


    Tkinter module in Python is the de-facto library for Python programs. This module
    is supported by all platforms such as OS X, Linux, and Windows. Some widgets you
    can see in Tkinter include check button, canvas, frames, text. In Python, Tkinter
    is a programming package in GUI. It involves a built-in library providing the
    TK GUI toolkit. It has a potent object-oriented interface. Tkinter and Python
    are the cheapest and easiest ways to create GUIs on any application.


    ### Approach on How to Use Tkinter


    The first step is to import the module, such as `Tkinter` and `functools`, from
    `partial`. Then, create the main window. Add the desired amount of widgets to
    the basic window, such as labels, buttons, and entry. At this stage, display the
    message. Lastly, apply an event on the widgets.


    ### A brief explanation of the widgets found in Tkinter


    1.  `Entry` widget: for displaying a single-line text ground that can accept figures
    from a user.

    2.  `Checkbutton` widget: ideal for displaying several options as checkboxes.
    With this, the user can choose many alternatives at a time.

    3.  `Frame` widget: it serves as a bottle widget for organizing other widgets.

    4.  `Button` widget: useful for showing buttons in your application.

    5.  `Canvas` widget: for drawing shapes such as rectangles, polygons, lines, and
    ovals within your application.

    6.  `Listbox` widget: for providing several options to the user.

    7.  `Menubutton` widget: is used for providing different commands to the user.
    These commands are within the Menubutton.

    8.  `Label` widget: available for providing a single-line description for other
    widgets in the application. It comes with various images.

    9.  `Text` widget: helps you to display text in multiple lines.

    10. `Spinbox` widget: this is a deviation of the Tkinter Entry widget for choosing
    from several fixed values.

    11. `Toplevel` widget: for providing a separate window container.

    12. `tkMessageBox` widget: the module is for displaying message boxes in your
    applications.

    13. `PanedWIndow` widget: a container widget with many panes that are organized
    vertically and horizontally.

    14. `LabelFrame` widget: this is a simple bottle widget acting as a container
    or spacer for compound casement layouts.

