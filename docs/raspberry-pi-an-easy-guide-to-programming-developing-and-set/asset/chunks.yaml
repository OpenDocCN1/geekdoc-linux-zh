    # What is object orientation?


    Object orientation is a way of solving programs through computations using objects.
    The object is a component of a program used for performing specific actions and
    interacting with other elements of the program. The basic components of object-oriented
    programming are objects.


    An example of an object in a program is a person. Therefore, logically, such a
    person must have a name. The name becomes a property of that person who can carry
    out different functions such as eating, drinking, walking, etc. these functions
    become the methods of that person (objects)


    In object-oriented programming (OOP), codes are organized around objects, which
    can interact with each other making things happen. Designing a program where someone
    is driving a car, firstly requires you to describe the objects involved, which
    are a person and car. You will now specify the methods. These are: how a person
    can drive a car, how the vehicle is to be driven. After organizing the objects,
    you can bring them together and create a diagram of a vehicle being driven by
    a person.


    Therefore, a class is a model of an object, which is an idea. The object becomes
    an embodiment of that concept. A class is created before designing an object.
    After creating objects, you are ready to design something. This involves methods.


    In object-oriented programming, a method is a process associated with a class.
    It defines the behavior of objects created from the class. Actions performed by
    objects are known as methods. The interaction between class and method is known
    as binding.


    # CHAPTER FIVE: HOW TO USE FILES AND INTERNET WITH RASPBERRY PI


    ![Using Internet.png](Image00017.jpg)


    ## Using Files and Internet on Raspberry Pi


    You can easily use files and the internet on your Pi. This will allow you to complete
    tasks and handle multiple projects on a virtual basis. Some of the ways to accomplish
    this are:


    1. **Port forwarding** – the best method of handling this issue is through port
    forwarding. You can access the internet through your router. Arrange for port
    forwarding feature on your router. That means you will configure the router to
    forward all inbound internet traffic on a particular port to the local IP address
    of your system.


    Various routers are designed with this feature. But varieties of routers are available
    with different configurations, follow the directions on your router’s user manual
    to configure it properly. You may find it difficult to manipulate if you’re your
    Raspberry Pi has more than one router, or it is behind a firewall. A significant
    disadvantage of the port forwarding feature is that it renders a system port on
    the personal LAN to the free internet. It is advisable to manage this feature
    carefully because it is a security threat.


    2. **Third-Party Online Port Forwarding Services** – several alternative solutions
    for port forwarding are available through third party services. They can offer
    various categories of functionality.


    ## What are the files in Raspberry PI?


    In a Raspberry Pi, files are the data or documents you save on your system for
    future references. These files are kept in folders for proper organization and
    management. A folder may contain several files or even other folders too. Raspberry
    Pi has file management software known as `File Manager`. This app is located at
    the right-part of the browser logo on the taskbar of the Pi system and represented
    with a battered filing cabinet.


    If you want to launch the file managing app, click the icon. Various file and
    folder lists will appear at the left-part of your window. Click on any folder
    to view the files inside. When you click on a folder, the files will appear on
    the right part of the window. You can view the files in a folder by tapping the
    small triangle beside the description of the folder. This action will cause the
    folders to open and display the folders or files inside, causing the triangle
    to point downwards. If you close the folder, the triangle will face the right
    beside the folder’s name.


    The full lists of folders in a Raspberry Pi are called a `directory tree`. This
    appears like a tree in an upside-down position. It begins to grow from a root
    in the folder. This folder has great significance in a Pi, and it is called a
    single backslash `\`. This folder incorporates other folders that make using and
    navigating through your Raspberry Pi easily. If you check the list of folders
    on the window, you will notice one referred to as `pi` at the upper part of the
    list. This one is known as the home folder. Every user on the Raspberry device
    has this folder called `Pi` folder, which is the home folder. The programmer spends
    much time at home on the window. It is located and placed in the directory tree,
    and you don’t have to navigate to the main tree before seeing it.


    The home folder could be traced in the file manager with a quick click. Another
    method to locate the home folder is by scrolling and clicking many files and buttons
    before seeing it. This often regarded as the long way, but you should know the
    short cut.


    ### Navigating in File Manager


    Every file in your Raspberry Pi has an address assigned to them by the file manager.
    This appears as a list of folders you need to click before accessing the file.
    These addresses are called `paths` in the filing system. So, obtaining an address
    in your system is like strolling down a path. The pathway could have bends and
    alleyways before reaching your destination.


    #### Step-By-Step Method of Accessing a File in a Raspberry Pi


    1. Open the system and click the Home Folder.

    2. Tap on the `pi` folder within the home folder.

    3. Continue clicking on various folders and viewing them until you arrive at the
    desired folder.


    Navigating through the device is easy since the `File Manager` will always direct
    you to the right file and folder. This is an example of an address that can take
    you to already installed apps in your Pi.


    ```

    | /usr/share/raspi-ui-overrides/applications

    ```


    You can try this address to access files in your Raspberry device. Scroll down
    the list of files and folders in the tree to locate your file within `/usr/share`,
    as it contains a lot. By double-clicking on any app or folder in the file manager,
    you can launch and open them.


    ## How to manage the file system


    ![Internet on Raspberry.png](Image00018.jpg)


    ### Organizing the file system


    The terminal in your Raspbian is used for manipulating and managing files in the
    system using specific commands. Here are some of the ways to manage the file system.


    #### How to Create Files


    You have several ways of creating a file in the terminal. But the easiest method
    of handling this process is by applying the `touch` control. This command is used
    for creating and updating timestamps in a file. It involves a very simple syntax.
    Type only `touch, ` followed by the filename. If a document with the description
    of the specified file does not exist, the command will quickly create a new file.
    Create a new file called `textfile.txt` in the `/home/pi/` directory by following
    the command.


    ```bash

    pi@new-hostname – $ touch /home/pi/textfile.txt

    ```


    #### Deleting Files


    Deleting a file is simple using the `rm` command . To delete the file you created
    above, just type `rm` before the file name on your window, and the data are removed.


    ```bash

    pi@new-hostname – $ rm textfile.txt

    ```


    #### How to Copy Files


    Copying files is a straightforward commands on the Raspberry Pi and you can do
    this using the `cp` command. Two parameters such as copy directory and destination
    directory can help you to handle it. Now, if you want to copy the `/home/pi/textfile.txt`
    to the `/tmp/` directory, you can use this command:


    ```bash

    pi@new-hostname – $ cp /home/pi/textfile.txt /tmp/

    pi@new-hostname – ls /tmp/

    ```

