- fmt: '

    # Details about Python Libraries


    A python program may need external libraries before it can work on a Raspbian.
    Therefore, you need to install extra libraries using `PIP`, which can only install
    libraries for programs in the terminal window. `PIP` is a package or module manager
    for Python. A good reason for this is that Python IDE programs come with a local
    copy of Python. Using the terminal window for running programs is recommended
    since it functions with external libraries installed using the preferred installer
    program (`PIP`). However, `PIP` is built-in by default into python packages with
    versions 3.4 or later versions.


    Python programs are installed through a terminal, IDE, or Thonny.


    ## Running Python Programs Using Terminal


    Python programs are also run using a terminal window. But you should understand
    the way to the program before opening the terminal. You can locate the program
    following this method:


    Go to `Documents` > `Python` > `Main.py`. After this, open the window and apply
    the `cd` command. This can help you to change the working directory to another
    directory containing Python program such as: `cd Documents/Python`.


    Suppose you want to check whether your Python program is in the catalog. You can
    use the command `dir`. This will also list all files and folders within that directory.
    If the application is not contained in the archives, you must go back and find
    where the program is located in the catalog.


    Now, let us use the Python command and execute this Python program. It will run
    the Python file stated after the command. For example:

    `Python yourfilename.py`


    Another method is to check if your File has spaces such as: `Python your File
    name.py`.


    ## Running Python Programs through IDE


    The Operating System of your Raspberry Pi comes with several IDEs useful for programming.
    One of the IDEs in your Raspbian is the original Python IDE. You can open this
    by opening the Raspbian logo. Then, scroll to Programming and click on `Python
    3 (IDLE)`.


    After loading the IDE, click on `File` > `Open`. If the File opens, navigate to
    the Python program. Then, Run the program. Simply tap Run button and click `Run
    Module`. Another way is to go to the keyboard and press `F5`.


    ## Running Python Program Using Thonny


    Another necessary Python IDE with several features is Thonny. With this debugger,
    you can watch variables and step through codes. It could also be applied for running
    Python programs by following these methods:


    Navigate to the logo of Raspbian and click it. Scroll down to find Programming
    and tap on `Thonny Python IDE`.


    After this process, click on the `File` menu. Locate and click the `Open` button
    and scroll to the program. If the program has downloaded, tap on the `Run` button
    to Run the present file.


    ## Python Shell


    This interprets languages in Python and used for executing the code serially.
    Python shell is also called Python Interactive Shell for executing one Python
    command and getting results.


    Python shell gets a command from the user. If the programmer types the prompt,
    the program will execute it and display the result.


    If you are using windows, open the Python shell by typing `Python`. Then, press
    `Enter`. After this, you will see three symbols of Greater than (`>>>`). Enter
    a single statement, and the result will appear if you enter an expression like
    `5 + 3`, and press `Enter`. The result will show on another line below it.


    ### Executing Python Script with Python Shell


    Python shell is applied for executing a single statement. However, running multiple
    statements requires you to create a Python file using the extension `.py`. Then,
    write Python scripts in various statements.


    Another way to handle this is by using Notepad and a statement such as:

    ```

    lookatPythonScript.py

    print – "Look at Python Script."

    print – "Receive Python lessons from the Teacher."

    ```

    You can save this as `myPythonScript.py`. Then, navigate the command button and
    scroll to the folder to save this File. This process can help you to apply the
    Python `lookatPythonScript.py` command. Python Shell could be applied for executing
    Python languages and commands.


    ## Loops


    In any programming language, the flow of programs is sequential by default. In
    most cases, you can alter the sequence of programs. But, executing a particular
    code could be done repeatedly. Programming languages offer several types of loops
    that can repeat some specific codes many times.


    ### Reasons for Using Loops in Python


    One of the reasons for using loops is that it helps in simplifying complex problems.
    Python loops enable you to alter or modify the sequence of programs. With this,
    instead of rewriting a particular code uncountable time, you can repeat it predetermined
    or fixed number of times.


    In this case, for printing a number ten times, no need to apply the `print` statement
    ten times. Simply print inside a loop. The loop can run up to ten repetitions
    or iterations.


    ### Benefits of Using Python Loops


    Using loops in Python programs come with various benefits such as:


    *   Loops help a programmer to reuse codes.

    *   If you are using python loops, you don''t have to rewrite a specific code
    uncountable times.

    *   Python loops enable a user to traverse over the elements of data structures
    such as linked lists or array.


    ### Different Loop Statements in Python Programs


    | S/N | Python Loop Statement | Description of Codes |

    | :--- | :--- | :--- |

    | 1. | Post tested loop or Do-while loop. | Until a specific order is reached,
    the do-while loop continues. In a programming language, it is called a post-tested
    loop. This statement is applied when you can perform the function at least once.
    Also, it is used for menu-driven programs. |

    | 2. | Pre-tested loop or While loop | Without knowing the number of repetitions
    or iterations in advance, you can apply the while loop for that scenario. In the
    while loop, a block of expressions are executed until the specified condition
    is satisfied in that loop. This type of loop is called the pre-tested loop. |

    | 3. | Per-tested loop or For loop | A per-tested loop is applied for executing
    some part of the circle until the specific condition is met. This is also called
    ''for a loop.'' This loop statement is the right choice where the number of repetitions
    or iterations is determined in advance. |


