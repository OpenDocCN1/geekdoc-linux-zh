  trans: '


    此项目旨在使用你的 Pi 设备来控制直流电机的速度。你需要的设备包括树莓派型号、直流电机、LED、电容、电阻以及电脑显示器或电视机。其他设备包括变压器、wiring
    pi 或 `PHP` 程序、电压调节器、电机驱动 IC 和二极管。


    ## 工作原理

    你可以使用树莓派调节直流电机的速度。施在直流电机端子上的电压与其速度成正比。如果电机端子上的电压发生变化，速率也会随之变化。这就是该项目的原因。你可以通过连接键盘以不同的速度运行电机。当你按下按键时，系统会立即开始工作。


    如果你想处理这个项目，可以编写 `PWM` 来产生输出。输出使用 `wiring pi` 或 `PHP` 启动。此功能基于占空比，占空比会导致系统平均电流和电压发生变化。当这种情况发生时，直流电机的速度就会改变。


    在此阶段，你应该将一个电机驱动 IC 连接到电路板上。这一步将使电路板接收 `PWM` 信号。这还会向直流电机发送所需的反极性（O/P）。两个磁场之间的反转极化导致直流电机运行。


    ## 2. 使用树莓派控制路灯自动开关

    此任务的目的是让学生了解控制路灯自动开关的方法。此项目需要的物品是二极管、电阻、LED、电脑显示器或电视机和晶体。其他设备包括 `MOSFET`、变压器、`wiring
    Pi` 或 `PHP` 程序、电容和白色 LED。


    ### 工作原理

    选择 LED 灯的原因是将其作为路灯，因为它们更节能。与其他灯具相比，LED 灯的寿命更长。通过树莓派开发并使用 `PWM` 来调节光强度。此功能使 `MOSFET`
    调节灯光，使其达到所需的运行水平。这将导致 LED 光强度从黄昏到黎明稳定变化。你会在高峰期注意到这种现象，那时会有全亮度。一段时间后，光的热量将逐渐减少。你可以通过脉冲宽度调制
    `MOSFET` 开关在 LED 之间实现变压。


    ### 你可以使用树莓派完成的其他项目

    这些包括


    *   触摸屏平板。

    *   同步音乐和圣诞灯。

    *   乐高 树莓派外壳。

    *   可编程顺序切换。

    *   控制无人机。


    ![Drones controlled with Pi.png](img/Image00004.jpg)

    树莓派控制的无人机


    *   太阳能路灯。

    *   树莓派供电的可穿戴计算机设备。

    *   通过树莓派使用蓝牙控制实现机器人臂控制。


    ![Controlling Robots.png](img/Image00005.jpg)

    树莓派控制的机器人


    *   使用树莓派配合 Zigbee 进行业务信息化。


    ## 设置树莓派所需的所有工具

    ![Tools for Raspberry.png](img/Image00006.jpg)

    树莓派设置工具

    你设置树莓派所需的所有工具包括树莓派型号、直流电机、SD 卡、连接线或显示电缆、鼠标、电源和键盘。其他需要的可选工具和设备包括 3.5 mm 接口耳机或耳机，以及使用
    WiFi 适配器或以太网线连接互联网。


    ### 键盘

    使用标准键盘或普通键盘在你的微型计算机输入数据。


    ### 鼠标

    普通鼠标也用于向系统输入信息。


    ### SD 卡

    ![An SD Card.png](img/Image00007.jpg)

    树莓派的 SD 卡

    你应该为你的 Raspbian 获取一张 8 GB Class 4 的 SD 卡。这已经安装了 `NOOBS`。大多数时候，你可以购买已经安装了 `NOOBS`
    的 SD 卡。获取 [NOOBS](https://www.raspberrypi.org/downloads/) 的另一种方法是免费下载。


    如果你拥有最早的树莓派 A 型或树莓派 B 型，你需要全尺寸的 SD 卡。然而，新的树莓派 A+ 型和 B+ 型设计为使用 micro SD。其他型号包括树莓派
    2 B 型、树莓派 3 B 型和树莓派 Zero，它们都可以使用 micro SD。


    ### 网络连接

    使用 WiFi 适配器或以太网线将设备连接到互联网。通过它，你可以下载软件或更新现有软件。


    ### 电源

    树莓派所需的电源至少为 5 伏。使用 5 伏微 USB 电源为设备供电。如果你使用电压较低的输出，设备运行将异常。


    ### 耳机或耳机

    你的微型计算机可以使用 3.5 mm 接口的耳机或耳机工作。


    ### HDMI / DVI 显示器或电视

    树莓派可以使用电视、HDMI 显示器或 DVI 显示器作为显示单元。如果你想要更清晰的图像和高质量图像，请使用带有 HDMI 输入的显示器。如果你在使用旧设备，请使用其他连接。原始以太网线是系统访问互联网的理想选择。树莓派
    3 集成了无线局域网。


    ## 安装树莓派

    遵循简单的指南在你的设备上安装 Raspbian 是很容易的。树莓派运行名为 `Raspbian` 的操作系统。它源自 Linux 发行版 Debian。所有树莓派硬件都可以在
    Linux 操作系统上运行。


    `Raspbian` 是一个多功能且专业的操作系统，让你的树莓派设备像电脑一样良好工作。它具有浏览器、命令按钮和其他几个程序。


    树莓派可以作为家庭电脑运行，因为它是一个低成本设备。它能够无缝地执行其他任务和项目。你可以将其作为无线接入点或玩游戏。


    在树莓派上安装 Raspbian

    在树莓派上安装 Raspbian 是一个自然的过程。


    ### 什么是 NOOBS?

    ![Download Noobs.png](img/Image00008.jpg)

    NOOBS 安装

    `NOOBS` 是一个操作系统安装器。它是树莓派上安装 Raspbian 的另一种选择。某些 SD 卡预装了 `NOOBS`。如果没有预装，你可以在使用之前向
    SD 卡下载 [NOOBS](https://www.raspberrypi.org/downloads/)。


    ### 方法 1 下载 Raspbian OS

    ![Raspberry Pi Installer.png](img/Image00009.jpg)

    树莓派安装

    安装树莓派的第一种方法下载 [Raspbian](https://www.raspberrypi.org/downloads/raspberry-pi-os/)
    镜像。这是树莓派当前的操作系统版本。你可以使用 PC 或 Mac 下载 Raspbian 镜像。使用传统的下载功能可能需要一些时间。你也可以使用种子，尽管这可能需要小时。


    ### 方法 2 解压压缩文件

    下载后，下一步是解压文件。它以 ZIP64 格式存在。然而，这取决于你系统的内置功能。如果它们已更新且最新，你可以使用任何程序解压。


    '
- fmt: '

    # Method 3: Use a MicroSD Card and Write the Disc Image


    ![Micro SD card.png](Image00010.jpg)


    Put your microSD card into your system and write the disc image to it. This may
    demand some programs such as:


    1. `Etcher` for those using the Linux OS in their devices. This program is recommended
    by the Raspberry Pi Foundation.

    2. `Win32 Disk Imager` suitable for programmers using windows operating system.

    3. Users with Mac devices can utilize the program already installed in the system
    for writing the disc image.


    It could take different processes to write the disc image to the card on those
    devices. But the procedures are self-explanatory and easy to understand. During
    the writing process, you will be requested to choose a destination in your system,
    select the microSD card. For the disc image, select the "Unzipped Raspbian file."
    Click on double-check. After this, tap the icon and write the image to your microSD
    card. With this process, the disc image will be written to the card.


    # Method 4: Boot up Your Raspberry Pi after Inserting the microSD Card


    The final stage is to insert the SD card into your device and boot your device.
    Remember to plug in the power source and the peripherals. If you have updated
    your device to the current edition of Raspbian, this will display on the desktop
    of your Raspberry Pi.


    Apply the default username and password.

    Username: `pi`

    Password: `Raspberry`


    Afterward, you can change to your username and password.


    ![Change name.png](Image00011.jpg)


    # Change Name and Password


    ## The Connections


    As I stated earlier, a Raspberry Pi is already equipped with a microSD card slot.
    Inserting an SD card into the slot is easy since it is the primary storage space
    in a Raspberry Pi board. Its function is the same as a hard disc in any computer
    device.


    The operating system is `Linux OS`, which is loaded onto the SD card. This operating
    system is bootable after plugging the Pi into a power source. A Raspberry Pi supports
    `Linux OS`, `Mac`, `ARM`, and `Qtonpi` operating systems.


    You can select any of these operating systems for your Raspberry Pi device. Then,
    you can use a disk manager application and write it to an SD card. Other external
    storage systems include a USB drive or a USB external hard drive.


    Different sizes and brands of SD cards are available on the market. However, your
    Raspberry Pi can contain an SD card with a maximum storage capacity of 64 GB.


    The connections that can make your Raspberry Pi functional include a monitor or
    TV, Mouse, and keyboard. Various output channels are needed for the display unit.
    These include `composite video`, `DSI video`, and `HDMI video`. However, the `DSI
    video` output needs specific hardware to function.


    The SD card is an essential component of a Raspberry pi board. Most times, they
    may sell a Raspberry Pi board with or without an SD card. It is used for storing
    files, documents, and other programs in this microcomputer.


    If you purchase a Raspberry pi board without an SD card, then you should buy a
    minimum of 4 GB for your device. But it can contain a total of 8 GB. With this
    system; you can manage web traffic properly. It also functions as a typical computer
    with a low-cost server, although smaller in size.


    # CHAPTER TWO: BASIC PROGRAMS IN PYTHON


    Python is a multipurpose, high-level, and interpreted programming language that
    was developed and released in 1991 by Guido van Rossum. The design philosophy
    embraces code readability and remarkable for using meaningful whitespace. The
    language is well-constructed and objects oriented in its approach. It is aimed
    at helping programmers to write clear and understandable codes for large-scale
    projects, including small-scale tasks.


    Python encourages multiple programming features, such as functional programming
    and structured programming. It is garbage collected and dynamically typed. Python
    has a comprehensive and standard library. It is also described as batteries included
    in its unique features.


    This programming concept was create and introduced in the 1980s. It became the
    follower of the ABC language. List comprehensions and garbage collections are
    features of `python 2.0`. This program was released in 2000 with reference counting.
    Also, `Python 3.0` was released in 2008. This was a review and amendment of the
    language, although not backward compatible. It is good to note that `Python 2`
    codes cannot run on `Python 3` in unmodified format.


    The language of `Python 2` was planned and initiated for 2015 but discontinued
    in 2020. `Python 2.7.18` is the last `Python 2.7` to be released. It is the last
    `Python 2` programs that will be issued. There shall be no improvements or security
    patches to be released for it. Since `Python 2` has ended, `Python 3.5.x` and
    others are supported.


    Different operating systems have Python interpreters. A community of programmers
    called Python Software Foundation directs and manages resources for `CPython`
    and Python development. Python is a free source for a reference implementation.
    It is developed and maintained this group of programmers.


    Varieties of basic Python programs abound on many topics such as basic python
    programming, functions, types of native data, and conditions and loops.


    ## Basic Python Programs


    Basic programs in Python include:


    1. Python program for showing calendar.

    2. Python program for converting kilometers to miles.

    3. Python program for arithmetical operations.

    4. Python program for converting Celsius to Fahrenheit.

    5. Python program for swapping two variables.

    6. Python program for printing "Hello Python."

    7. Python program for solving a quadratic equation.

    8. Python program for determining the area of a triangle.

    9. Python program for generating a random number.


    ## Python Programs for Functions


    1. Python program for converting decimal to binary, octal, hexadecimal.

    2. Python program for determining HCF.

    3. Python program for calculating LCM.

    4. Python program for making a simple calculator.

    5. Python program for displaying the calendar.

    6. Python program for determining the factorial of a numeral using recursion.

    7. Python program for determining the ASCII value of a character.

    8. Python program for displaying Fibonacci series through recursion.


    ## Python Programs for Numbers


    1. Python program for checking if the given number is Happy Number.

    2. Python program for determining if a specific number is a Harshad Number.

    3. Python program for printing all pronic figures between 1 and 100.

    4. Python program for printing all happy numerals between 1 to 100.

    5. Python program for checking if the particular number is Disarium Number.

    6. Python program for printing every disarium digit between 1 and 100.


    ## Python Programs for Array


    1. Python program for printing the sum of all elements in an array.

    2. Python program for printing the smallest element in an array.

    3. Python program for printing the factors of an array present on odd positions.

    4. Python program for printing the number of factors present in an array.

    5. Python program for printing the biggest factor in an array.

    6. Python program for printing the elements of an array present in an even position.

    7. Python program for printing the factors of an array in reverse order.

    8. Python program for printing the duplicate factors of an array.

    9. Python program for printing the elements of an array.

    10. Python program for sorting the digits of an array in descending order.

    11. Python program for rotating the strings of an array to the right-side.

    12. Python program for sorting the numbers of an array in ascending order.

    13. Python program for copying all elements of one array into another array.

    14. Python program for rotating the elements of an array to the left-side.

    15. Python program for calculating the frequency of each element in the array.


    ## Python Programs for Circular Linked List


    1. Python program for removing a node from the starting of the circular linked
    list.

    2. Python program for deleting a node from the end of the circular linked list.

    '
