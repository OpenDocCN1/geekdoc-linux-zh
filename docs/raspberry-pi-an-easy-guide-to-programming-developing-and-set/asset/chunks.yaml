    ## What are the modules in Raspberry Pi?

    A Raspberry Pi contains the compute module1. This device is designed for industrial
    applications in a flexible form.


    ## The Specifications of a Computer Module

    The module is the backbone of your Pi device as it contains 512MB RAM, `BCM2835`
    processor, and 4GB eMMC Flash device. It is comparable and similar to the SD card
    in a microcomputer. All these specs are included into a board measuring 67.6 ×
    30 mm. This board fits into a standard connector such as `DDR2 SODIMM`. This connector
    is also used in the memory of a laptop computer.


    This memory is coupled straight to the processor on the board. Other processor
    interfaces could be accessed through the connector pins, and you will enjoy the
    flexibility of the `BCM2835` SoC. In this case, more interfaces and GPIOs are
    available if compared to the Raspberry Pi making it possible to design and customize
    the system in a straightforward way.


    ## Libraries in Python

    In Python programming, you can limit using codes by adopting Python libraries
    and packages. These are a collection for relevant modules and functions valuable
    for programming instead of codes. You will find over one hundred thousand libraries
    and one hundred and ninety packages in Python. They have been designed and developed
    to make programming easy for beginners, including Pythonistas and Pythoneers,
    to offer solutions to various challenges in society.


    Python libraries are useful for machine learning, including data visualization,
    image, and data manipulation, and data science for different applications. Python
    packages include a collection of Python modules, and libraries are a collection
    of Python functions used for performing specific tasks.


    Here are some Python libraries and their features:


    ### Matplotlib library

    Matplotlib is a library that a programmer can use in writing two-dimensional graphs
    and plots through Python Script. You may need more than single axes in a version
    to handle scientific or Mathematical programs. You can also create numerous plots
    at a time using this library. It is useful in manipulating several figures and
    characteristics.


    #### Features of Matplotlib

    1. Easy to integrate several third-party libraries with Matplotlib software. The
    applications include `ggplot`, `seaborn`, and `base map` for mapping and projections.

    2. Features a dynamic group of people dedicated to handling your requests professionally.

    3. Matplotlib enables you to track new patches, bugs, and features requirements
    on the problem of tracker page from Github. That is the official page for handling
    various problems concerning this library.

    4. It can function with GUIs and diverse toolkits such as `Jupyter Notebook`,
    `IPython Shells`, and `Python Scripts`.

    5. This Python library can create quality figures suitable for publication. These
    figures could be available in hardcopy designs on various interactive platforms.


    ### Requests Library

    This is released under the Apache2.0 license and serves as a loaded Python HTTP
    library. It helps to make HTTP requirements user-friendly and responsive. This
    lib is made for beginners to help them to use most features of HTTP. It is easy
    to configure, customize, authorize, and inspect HTTP requests.


    #### Features of Requests Library

    1. Enjoying the benefits of HTTP proxy support. It helps your users to locate
    your files and pages faster and quickly.

    2. It features thread safety, connection pooling, Unicode response bodies, basic
    or digest authentication, value cookies, and other functionalities.

    3. Requests help to upload numerous documents at once. With this, you can work
    in an efficient and faster environment.

    4. Requests contain several features that can enable you to tackle custom headers,
    sweep parameters towards URLs, and perform SSL certificate verifications.

    5. It offers automatic decompression that helps you in restoring and reviving
    compressed data into the original format quickly.

    6. This Python lib enables you to use basic Python `Dictionaries`, add parameters,
    form data, complex documents, and headers.


    ### Theano Library

    Theano could be used for compiling available computer programs. Programmers also
    call it an optimizing compiler. This library applies multi-dimensional arrays,
    making you not to about the outcome and perfections of your projects. It is designed
    for describing, analyzing, influencing, and optimizing various Mathematical operations
    simultaneously.


    #### Features of Theano Library

    1. It makes computation 140 times faster and easier. It can handle data-intensive
    applications.

    2. It offers various essential tools for detecting and analyzing dangerous bugs
    and other issues in the system.

    3. Theano helps you to work successfully on expressions without hassles or delays.
    With this, you can avoid nasty bugs as you work with illustrations.

    4. The features and functionalities are similar to Numpy’s own. Therefore, Theano
    integrates `numpy.ndarrys` in its system.

    5. Works directly with GPUs and complete diverse emblematic differentiation of
    many parts or at least one section.


    ### Pillow Library

    Pillow library depends on the `PIL` code configuration. It is a division of Python
    Image Library (`PIL`). It was transformed into a better and more-friendly version
    of `PIL`. This is your reliable firm while working with different types of image
    formats.


    #### Features of Pillow Library

    1. You will get more support from active community users that will answer your
    inquiries and provide solutions.

    2. This Python library helps you in creating thumbnails for descriptions. It carries
    most of the important parts of your figure.

    3. Supports a group of image filters such as `smooth`, `smooth_more`, `blur`,
    `contour`, `sharpen`, and `find_edges`.

    4. The ability to open and save images and influence the image environment.

