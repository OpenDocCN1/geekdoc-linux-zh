    你可以通过 `input()` 函数获取用户的输入。在这个阶段，用户将收到此提示：“想再次掷骰子吗？”此处预期的答案是 ''yes''。如果不是，则应该是
    ''no''。


    用户的输入将存储在一个变量中。这个答案可以帮助你获取他的信息支持，该信息为 ''y'' 或 yes。如果你想要该数据的其他变体，可以寻求更多帮助来实现。


    `while` 循环在变量评估为真（true）时运行。程序用户将再次调用此变量。你首先将 `back` 的值固定为 `true`。通过这样，你可以拥有一个具有该设置的
    `while` 循环。你可以在 `while` 循环内部向显示器发布随机掷骰子的结果。现在，你可以请求用户再次掷骰子。这有助于你在程序员不想重复掷骰子时，将
    `again` 的值更改为“非真”。


    你甚至可以使用 `if` 语句判断输入是否为 ''y'' 或 ''yes''。如果此表达式为真，那么 `again` 必须为 `True`。如果无效，你应该将
    `again` 更改为 `False`。记住，此程序的代码是 `dice_roll.py`。


    ## 第二次运行程序

    使用命令：`python3 dice_roll.py`，你将第二次操作游戏。你会立即得到一个命中或缺失的骰子结果。你将被询问是否想要第二次掷骰子。如果你输入
    ''y''，你将获得第二次掷骰子。但如果你输入 ''No'' 或其他 ''y'' 或 yes 的文本，程序将退出或结束。


    ## 请求骰子的最小值和最大值

    请求骰子的最小值和最大值是改进程序的方法。骰子有很多面。甚至有些骰子可能有 120 个面。使用具有许多面的骰子模拟掷骰子，你可以输入骰子的最小和最大数字。


    有些骰子可以有像 1 这样的小数字。但你可以请求最小最大值以使程序通用。在代码开始处，你可以请求用户输入。然后，在继续之前你可以将数据转换为整数。


    ### 输入无效输入会发生什么？

    当用户输入无效输入（非数字）时，程序将退出或结束。随后会出现一个 `Traceback` 错误。例如，有人输入了 ''hi'' 等文本而不是最小值。`input`
    函数无法将单词 ''hi'' 转换为整数。它只会抛出错误并退出程序。


    ## 改进对输入的处理

    进行第二次掷骰子有助于你改进输入。你只需要添加输入 ''y'' 或 ''yes''，这是可接受的单词。在检查输入之前，可以将此数据转换为小写。这样，你将拥有
    ''YES''、''Y'' 或 Yes，这些在程序中都是有效的。


    在不想更改 `again` 变量的情况下，请使用 `break` 或 `continue` 命令。这允许你继续进入第二次迭代或打破循环。当用户处理第二次掷骰子时，你可以使用
    `continue` 命令进入第二次迭代循环。如果程序员或用户不想再次掷骰子，则执行 `break` 命令。这将导致程序结束，因为它将退出循环。


    ## 如何使用 Try 和 Except 方法改进错误处理

    在程序开始时，用户可能会输入无效的最小值或最大值。这将导致应用程序显示错误并退出。可以使用此方法处理错误。你可以输出“输入无效，程序将恢复到默认程序”。然后，你应该将最小值和最大值设置为默认的
    1 和 6。


    玩家将被要求在 `try` 块内输入低值和高值。这些值中的任何一个显示错误将不会执行该代码块。在 `except` 代码块中将有一个 `print` 语句。这将作为一个自定义错误消息出现，可以帮助你将骰子的最小和最大值设置为默认值一和六。


    此功能可以帮助你稍微改进代码的错误处理。你可以通过这些代码块为处理错误添加更多支持。


    制作骰子模拟器有很多方法。这取决于你选择类型以及你作为程序员的经验。但你可以添加一些内容来增强你的体验。增加对输入的支持并使用 GUI 可以提高你在 Python
    中处理骰子模拟器的专业知识。


    # 第三章：什么是字典、列表和字符串？

    Python 中有一些内置结构。这些包括字典、列表、字符串和其他结构。


    ### 字典

    Python 中的字典用于以键值对格式存储数据。它们是 Python 中可以模拟现实世界数据安排的数据类型。在这种情况下，某些特定键存在某些特殊值。这种数据结构是可变的。但字典是以值和元素键表示的。


    #### 值

    在 Python 中，值表示列表、整数、元组等。


    #### 元素键

    元素键被定义为单个元素键。


    字典是键值对的集合，可以是任何 Python 对象。但键是不可变的。


    ### 如何创建字典

    你可以使用用大括号 `{}` 包围的键值对创建字典。字典中的每个键使用冒号 (:) 与数字分隔。以下是定义字典的语法：


    ```python

    Dict = {"Name": "John", "Age": 30}

    ```


    在这个表达式中，你将看到字典；`Name` 和 `Age` 是字符串。创建一个字典并打印它的内容。看这个示例：


    ```python

    Employee = {"Name": "Thompson", "Age": 40, "salary": 35000, "Company": "GOOGLE"}

    print(type(Employee))

    print("printing data ... ")

    print(Employee)

    ```


    **输出：**

    ```

    <class ''dict''>

    printing data ...

    {''Name'': ''Thompson'', ''Age'': 40, ''salary'': 35000, ''Company'': ''GOOGLE''}

    ```


    Python 提供内置的 `dict()` 方法。此功能用于创建字典。没有值或对象的大括号 `{}` 用于生成空字典。


    ```python

    # 创建空字典

    Dict = {}

    print("Empty Dictionary: ")

    print(Dict)


    # 使用 dict() 创建字典

    Dict = dict({1: ''Java'', 2: ''T'', 3: ''Point''})

    print("\nCreate Dictionary using dict(): ")

    print(Dict)


    # 每个项目作为一个对的字典

    Dict = ([(1, ''Devansh''), (2, ''Sharma'')])

    print("\nDictionary with each item as a pair: ")

    print(Dict)

    ```


    **输出：**

    ```

    Empty Dictionary:{}

    Create Dictionary using dict(): {1: ''Java'', 2: ''T'', 3: ''Point''}

    Dictionary with each item as a pair: [(1, ''Devansh''), (2, ''Sharma'')]

    ```


    ### 如何访问字典的值

    在本章前面的部分，我们讨论了使用索引功能访问列表和元组的方法。但你可以使用键访问字典的值，因为这些键在 Python 字典中是独特的。通过以下步骤访问词汇的值：


    ```python

    Employee = {"Name": "James", "Age": 25, "salary": 28000, "Company": "GOOGLE"}

    print(type(Employee))

    print("printing data ....")

    print("Name : %s" % Employee["Name"])

    print("Age : %d" % Employee["Age"])

    print("Salary : %d" % Employee["salary"])

    print("Company : %s" % Employee["Company"])

    ```


    **输出：**

    ```

    <class ''dict''>

    printing data ....

    Name : James

    Age : 25

    Salary : 28000

    Company : GOOGLE

    ```

