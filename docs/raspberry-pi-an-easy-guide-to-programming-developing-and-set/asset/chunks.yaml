    # 树莓派硬件规格


    1. 它拥有 4.1 版本的蓝牙。

    2. 视频输出包括使用 3.5 mm 接口的 `PAL` 和 `NTSC`（复合视频）以及 `HDMI`。

    3. 四个 `USB` 端口。

    4. 一个四核 64 位 `ARM Cortex A53` `CPU`，频率达到 1.2 GHz。

    5. 设备重量为 1.6 oz (45g)。

    6. 电源为 5 伏，通过 `GPIO` 引脚或 `MicroUSB`。

    7. 树莓派尺寸为 85.60 mm × 56.5 mm。

    8. 内存拥有 `1 GB LPDDR-900 SDRAM`，运行 `Linux` 操作系统。频率为 900 MHz。

    9. `Raspbian` 拥有 `10/100 Mbps 以太网` 和 `802.11` 无线局域网。

    10. `GPU` 拥有 400 兆赫 (MHz) Video core IV 多媒体核心。

    11. 外围设备包括具有特定功能的 `17 GPIO` 和 `HAT ID` 总线。

    12. 其他规格包括 `USB` 鼠标、`USB WiFi` 适配器。


    ![Inner components of a Raspberry.png](img/Image00003.jpg)


    ## 树莓派规格


    这台微型是一个教育工具，硬件具有以下规格：`GPIO` 引脚、电源接口、中央处理器 (`CPU`)、随机存内存 (`RAM`)、`Xbee` 插座、`GPU`
    和 `UART`。


    树莓派使用 `SD` 闪存卡进行大规模存储。你的 PC 通过硬盘启动 `Microsoft windows`，而 `SD` 内存卡则帮助 `Raspbian`
    启动。硬件规格还包括美标键盘、视频线、电源线、显示器以及一个带有 `Linux` 运行系统的 `microSD` 卡。


    你可能需要的其他可选规格包括设备外壳、`model A` 或 `model B`、`WiFi` 适配器、互联网连接、`USB` 鼠标和带电源 `USB` 集线器。使用
    `LAN` 缆为 `B` 型连接互联网。


    所有规格的详细说明包括：


    ### 中央处理器 (CPU)


    `CPU` 是系统的的大脑和枢纽。它使用逻辑和数学函数执行计算机中的指令。树莓派使用 `ARM11` 系列处理器，其功能类似于 `Samsung Galaxy`。


    ### 以太网端口


    此端口设计用于通过插入你的家庭路由器来访问互联网。它是与其他设备进行交互的网关。


    ### 图形处理器 (GPU)


    你可以使用 `GPU` 加速图像函数的计算。这是你树莓派板上的一个单芯片，且 `GPU` 支持 `OpenGL`。它还使用 `Broadcom video-core
    IV` 构建。


    ### 通用输入/输出 (GPIO) 引脚


    你可以使用 `GPIO` 引脚与其他电子板进行关联和交互。取决于你编程树莓派的方式，这些引脚可以接收并处理输入输出命令。它也可以作为数字 `GPIO` 引脚工作。其他电子单元通过这些引脚连接到
    `Raspbian`。例如，你可以通过将通用输入输出引脚连接到温度传感器来传输数字数据。


    ### 树莓派内存


    如果你将树莓派与其他计算机设备相比，它正是一台微型 PC。其他标准计算机的 `RAM` 以 GB 为单位，而 `Raspbian` 的 `RAM` 至少包含
    `256 MB`，最大 `Ram` 为 `512 MB`。


    ### 通用异步收发传输器 (UART)


    `UART` 是一个串口输入输出端口，用于传输文本等串口数据。程序员使用它进行调试和代码转换。


    ### 显示器或电视机


    树莓派板使用两个显示器或电视来显示数字数据。这包括 `HDMI` 和复合（Composite）显示。使用带有 `HDMI` 公头线的廉价适配器连接多个 `LCD`
    和 `HD TV` 显示器。你的树莓派支持的 `HDMI` 版本为 `1.3` 和 `1.4`，也使用 `1.4` 线缆。这些可以帮助树莓派视频和音频设置的功能。然而，它不支持
    `HDMI l/p` 适配器。复合视频功能用于连接旧电视。在这种情况下，使用复合视频连接将设备到显示单元可以使音频系统可用。连接 `3.5 mm jack`
    插座并发送到你的电视。这可以使用适用于 `3.5 mm` 并转换为双 `RCA` 连接的光缆来实现。


    ### 电源线或接口


    你可以使用外部电源为你的微型计算机供电。这是屏蔽层旁边的小开关。


    ### XBee 插座


    树莓派板上的此功能用于无线通信。


    ## 树莓派 A 型板


    `model A` 板板被设计为 `Broadcom (BCM2835)` `SOC` 板。该型号由 `ARM1176JZF-Score` `CPU` 制造。它带有
    `256 MB RAM` 的 `SD` 卡，频率为 700 MHz。


    `USB 2.0` 端口具有外部数据连接功能，这是系统中的可选工具。该板通过 `micro-USB` 适配器供电。该适配器携带的最小功率范围为 `2 W`。你还可以使用图形加速图像计算功能，这是系统中的一个特殊芯片。它是一个带有
    `Broadcom video-core IV` 线的内置结构。此功能对于通过树莓派运行视频或游戏有关。


    ### 树莓派 A 型板的特性


    树莓派 A 型板具有独特特性，例如：


    1. 它的板尺寸为 `8.6 cm × 5.4 cm × 1.5 cm`。

    2. 有一个 `SD`、`SDIO` 和 `MMC` 卡插槽。

    3. `SD` 卡 `RAM` 为 `256 MB`。

    4. 视频输出为复合式，具有 `RCA`（`NTSC` 和 `PAL`）以及具有 `1.3` 和 `1.4` 线缆版本的 `HDMI`。

    5. 它具有带有 `3.5 mm jack` 的音频输出。

    6. 它的系统功能运行 `Linux`。

    7. 它具有带有 `Broadcom BCM2835` 的完整处理器。

    8. `2.0 USB` 连接是单口的。

    9. 板具有双核 `video-core IV 多媒体协处理器处理器`。


    ## 树莓派 B 型板


    B 型号具有 `Broadcom (BCM2835)` `SOC`。板带有 `512 MB RAM` 的 `SD` 卡，频率为 700 MHz。`CPU`
    核心为 `ARM1176JZF-S`。`USB 2.0` 端口具有外部数据连接功能。你可以通过以太网为 B 型与其他系统联网。该系统通过 `micro USB`
    适配器供电。所需的最小功率为 `2.5 W`。图形具有一个专用芯片。这用于加速图像计算。它具有内置的 `Broadcom video-core IV` 线。


    ### 树莓派 B 型板的特性


    1. 尺寸为 `8.6 cm × 5.4 cm × 1.7 cm`。

    2. 板存储具有 `SDIO`、`SD` 和 `MMC` 插槽。

    3. 它具有 `10/100 以太网 RJ45` 接口。

    4. `2.0 USB` 连接是单口的。

    5. 板具有双核 `video-core IV 多媒体协处理器`。


