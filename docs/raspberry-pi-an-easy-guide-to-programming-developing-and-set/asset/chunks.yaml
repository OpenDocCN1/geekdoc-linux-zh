    ### Built-in Functions in Python Lists

    Python lists come with several built-in functions such as:


    1. `len(list)` – used for determining the length of the list. Examples include
    `L1` such as `[1,2,3,4,5,6,,8]`.

    ```python

    print(len(L1))

    8

    ```


    2. `max(list)` – for returning the maximum element in a list. For example `L1
    = [12,34,26,48,72]`. own```python

    print(max(L1)) 72.

    ```


    3. `list(seq)` = this function converts any sequence to the list. For example:


    ```python

    str = “Joseph”

    s = list(str)

    print(type(s))

    <class list>

    ```


    4. `cmp(list1,list2)` – for comparing all the factors of both lists but cannot
    work in Python3.


    5. `min(list)` – restores the lowest element of a list sequence. For example `L1
    = [12,34,266,48,72]`.

    ```python

    print(max(L1))72

