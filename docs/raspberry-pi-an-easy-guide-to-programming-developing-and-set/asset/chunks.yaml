    # 如何显示文件内容


    你系统中的文件内容可以使用文本查看器或文本编辑器显示。在 Raspbian 中，有多种程序可以帮助你查看文件和文件夹的内容。其中一个程序名为 `less`
    的程序。它可以逐个在屏幕上显示文件内容。它使用语法 `less` 运行。回到键盘并输入命令 `less`，后跟你想要显示的文档标题。如果你想显示上面创建的文件内容，请使用此命令。


    ```bash

    pi@new-hostname - $ less /home/pi/textfile.txt

    ```


    输入此命令后，内容将在 `less` 程序窗口中显示。然而，按下键盘上的 `q` 键即可轻松退出 `less` 程序。你也可以通过应用 `cat` 命令显示文件内容。在这里，内容将直接显示在终端上。例如：


    ```bash

    pi@new-hostname - $ cat textfile.txt

    Hello, world!

    ```


    # 读取与写入


    如果你希望程序的输出对人类可读，可以通过几种方式演示数据。你甚至可以将信息存档文件以备后用。


    ## 写入值的方法


    你可以通过以下方式写入值：


    1. 文件对象的 `Write()` 系统。在这里，标准输出文档可以被引用为 `sys.stdout`。

    2. 表达式语句。

    3. `print()` 函数。


    大多数时候，你应该正确格式化你的输出，而不是打印分离的值。你可以通过两种方式格式化你的输出或写入，例如：


    1. 字符串切片和拼接操作。通过这种方式，你可以设计任何可能的布局。它具有一些将字符串填充到特定列宽的服务程序。

    2. 使用 `str.format()` 方法。


    字符串元素有一个模板类，提供了另一种交替值字符串的方法。Python 程序可以帮助你将值转换为字符串并将其传递给 `str()` 函数或 `repr()`
    函数。字符串可能包含文件名或几个字符。这将定义文件使用的模式（`mode`）。模式可以是 `‘r''` 表示用于读取的数据，而 `‘w''` 用于将要写入的文件。它也可以用于标记为删除的数据。`‘a''`
    打开文档以附加或追加写入到文件的任何信息。这些信息会自动添加到末尾。如果你看到代码 `‘r+`，意味着文件可用于解释和写入。


    当文档以文本模式打开时，你可以从文件中读取和写入序列，或向文件读取和写入序列。这些是在特定编码中预设的。但如果程序不是特定的，默认值取决于阶段。附加在方法上的代码
    `‘b''` 以二进制模式打开文档。在这里，数据将像字节对象一样被写入和读取。这种模式适用于不含文本的文件。


    如果你以文本格式读取，默认将把平台特定的换行符（如 Windows 上的 `(\r\n`，Unix 上的 `\n`）转换为单独的 `\n`。如果你以文本模式写入，默认将把
    `\n` 段落转换回平台特定的换行符。这些修改适用于文本数据，但可能会损坏二进制数据，如 `JPEG` 或 `EXE` 文档。读写此类文件时要谨慎使用二进制模式。


    # 网络与序列化（Pickling）有什么区别？


    ## 树莓派上的网络连接


    网络用于从移动设备或计算机访问网页。正如我上面提到的，你可以通过端口转发来实现。这涉及更改路由器的配置，将来自互联网的所有入站流量转发到本地 IP 地址。也可以通过处理端口转发的第三方机构来实现。


    Pickling 是使用模块实现一种基础且稳健的算法，用于对 Python 对象结构进行序列化和反序列化。这涉及将 Python 对象层次结构转换为字节流。因此，unpickling
    是此操作的反转过程，导致字节流重新转换为命令对象链。


    这两个术语 pickling 和 unpickling 也被称为 marshaling（封送）、flattening（展平）或 serialization（序列化）。`pickle`
    模块维护已序列化对象的路径。这将防止在未来的引用中对相同对象重复序列化。


    # 第六章：树莓派中的图形用户界面


    ## 树莓派上的 GUI


    树莓派上的图形用户界面（GUI）是一种界面，允许编程人员和用户通过视觉指示表示（如电视和显示器）与你的系统进行交互。它由 Xerox Palo Alto 在
    20 世纪 70 年代后期开发，但由 Apple 的 Macintosh 包括 Microsoft Windows 操作系统进行了商业部署。


    GUI 是软件中基于用户的蓝图模型，因为它为用户提供了直观地操作计算机和各种电子设备的能力。这是通过直接应用图形符号（如按钮、标签页、菜单、滚动条、鼠标、光标和窗口）实现的。如今，图形用户界面带有触摸屏和语音提示（命令）功能和特性。


    ## Python 中的 Tkinter 模块是什么？


    Python 中的 Tkinter 模块是 Python 程序的实标准库。该模块支持 OS X、Linux 和 Windows 等所有平台。你在 Tkinter
    中看到的一些组件包括复选按钮、画布、框架、文本。在 Python 中，Tkinter 是 GUI 中的一个编程包。它包含一个提供 TK GUI 工具包的内置库。它具有强大的面向对象接口。Tkinter
    和 Python 是任何应用程序中创建 GUI 最廉且最简单的方法。


    ### 使用 Tkinter 的方法


    第一步是从 `partial` 导入模块，例如 `Tkinter` 和 `functools`。然后，创建主窗口。向基础窗口添加所需的组件，如标签、按钮和输入框。在此阶段，显示消息。最后，在组件上应用事件。


    ### 对 Tkinter 中发现组件的简要说明


    1. `Entry` 组件：用于显示单行文本框，可以接受用户输入的数字。

    2. `Checkbutton` 组件：非常适合将多个选项作为复选框显示。通过这种方式，用户可以同时选择多个备选方案。

    3. `Frame` 组件：它充当组织其他组件的容器组件。

    4. `Button` 组件：用于在你的应用程序中显示按钮。

    5. `Canvas` 组件：用于在你的应用程序中绘制矩形、多边形、线条和椭圆等形状。

    6. `Listbox` 组件：为用户提供多个选项。

    7. `Menubutton` 组件：用于向用户提供不同的命令。这些命令位于 Menubutton 内。

    8. `Label` 组件：用于为应用程序其他组件提供单行描述。它可以带有图像。

    9. `Text` 组件：帮助你显示多行文本。

    10. `Spinbox` 组件：这是 Tkinter Entry 组件的变体，用于从几个固定值中进行选择。

    11. `Toplevel` 组件：用于提供独立的窗口容器。

    12. `tkMessageBox` 组件：该模块用于在应用程序中显示消息框。

    13. `PanedWindow` 组件：一种具有多个垂直或水平排列窗格的容器组件。

    14. `LabelFrame` 组件：这是一个简单的容器组件，作为复合布局的容器或间距符。


