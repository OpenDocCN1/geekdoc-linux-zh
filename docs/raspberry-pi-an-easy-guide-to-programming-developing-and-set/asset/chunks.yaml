    Integers can have any length in an expression. A floating-point number is only
    accurate if it has 15 decimal places. If you notice a 16th decimal place, the
    expression is not correct. These numbers have decimal numbers in base ten number
    system. Programmers usually work with binary (base 2) numbers and base 16 (hexadecimal)
    numbers. They can also work with base 8 (octal) numbers. You can place a prefix
    before the numbers to represent numbers in Python.


    ### Prefixes Used for Numbering Systems


    | S/N | Number System | Prefix |

    | :--- | :--- | :--- |

    | 1. | Binary Numbers | `0B` / `0b` |

    | 2. | Octal numbers | `0O` / `0o` |

    | 3. | Hexadecimal numbers | `0X` / `0x` |


    #### Look at these examples


    ```python

    # Output : 107

    print(0b1101011)

    # Output : 253 (251 + 2)

    print (0xFB + 0b10)

    # Output : 13

    print(0o15)

    ```


    **Output:** Run the program, you will have an output such as:


    | 107 | 253 | 13 |


    ### Types of Number Conversions in Python


    Numbers can be converted through coercion. This is a process of converting one
    number into another. You can use operations like additions and subtractions to
    coerce integers to float automatically. This operation happens successfully if
    one of the operational figures is a float. For instance:


    ```python

    >>> 1 + 2.0

    3.0

    ```


    In the statement above, the integer is coerced into a `2.0` float through addition.
    The result of this coercion is also a floating-point number, `3.0`. Another process
    is through integrated functionalities like `int()`, `float()`, and `complex()`.
    We can use these functionalities to convert numbers between types. Also, these
    functionalities can convert numbers from strings too.


    #### Examples


    ```python

    >>> int(2.3)

    2

    >>> int(-2.8)

    -2

    >>> float(5)

    5.0

    >>> complex(''3+5j'')

    (3+5j)

    ```


    The numbers are truncated, making the decimal parts be removed if you are converting
    from float to integer.


    ### Using Python Decimal


    You can make some amazing calculations using a built-in class `float` in Python.
    In mathematical calculations, the sum of `1.1` and `2.2` = `3.3`. However, in
    Python there is disagreement and discrepancy.


    ```python

    >>> (1.1 + 2.2) == 3.3

    False

    ```


    This result implies that floating-point numerals are executed in computer hardware
    like binary fractions. This is the only type of figure the computer system understands:
    binary numbers `0` and `1`. Therefore, it will be complicated to store decimal
    fractions in your computer system. For instance, the fraction `2/6` cannot be
    represented in a computer as a decimal number. It will give us `0.33333333…..`
    and this result is long. But the answer can be approximated.


    However, the decimal fraction `0.1` will give us an incredibly long binary fraction
    of `0.000110011001100110…`. But there are the highest numbers of figures that
    the computer can accept and store. For this reason, we can approximate `0.1`,
    and it cannot be equal. It is worthy of note that this shortfall is not an error
    from Python but due to limitations of the computer hardware.


    ```python

    >>> 1.1 + 2.2

    3.300000000000003

    ```


    But, you can handle this discrepancy using the module for decimals built into
    Python. Floating-point numbers have precision up to fifteen decimal places. It
    has a `decimal` module with user-settable accuracy. The difference between both
    results will show:


    ```python

    import decimal

    print(0.1)

    print(decimal.Decimal(0.1))

    ```


    **Output:**


    | 0.1 | 0.100000000000000055511151231257827021181583404541015625 |


    You can use this module to perform the decimal calculations as we learned in school.
    This format maintains the significance of values.


    ### Lists and Dictionaries


    Lists are like arrays in other languages, they are significant in Python. Lists
    are mutable and can be altered after creation. For example:


    ```python

    # Python program to demonstrate creating a List

    list = ["Books", "For", "Books"]

    print(list)

    ```

    **Output:**

    `[''Books'', ''For'', ''Books'']`


    #### Dictionary


    In Python, the dictionary is an unorganized compilation of data values like a
    map. Unlike lists, it contains key-value pairs. It is created using a colon (`:`).
    Each key-value pair is separated by a comma (`,`). For example:


    ```python

    # Python program to demonstrate creating a Dictionary with Integer Keys

    dict = {1: "Books", 2: "For", 3: "Books"}

    print(dict)

    ```


    **Output:**

    `{1: ''Books'', 2: ''For'', 3: ''Books''}`


    #### Using Mixed Keys


    ```python

    # Python program to demonstrate creating a Dictionary with Mixed Keys

    dict = {"Name": "Books", 1: "For", 2: "Books"}

    print(dict)

    ```


    **Output:**

    `{''Name'': ''Books'', 1: ''For'', 2: ''Books''}`


    ### Variations of List and Dictionary


    | S/N | List | Dictionary |

    | :--- | :--- | :--- |

    | 1. | Indices of lists are integers starting from 0. | The keys of the dictionary
    are any data type. |

    | 2. | You can create lists by placing elements in `[]` separated by `,`. | Create
    a dictionary by placing elements in `{}` as `"key":"value"` separated by `,`.
    |

    | 3. | Lists sustain and support the order of elements entered in the program.
    | The order is not maintained. |

    | 4. | Elements in lists can be accessed through indices. | Elements in the dictionary
    are accessed through keys. |


