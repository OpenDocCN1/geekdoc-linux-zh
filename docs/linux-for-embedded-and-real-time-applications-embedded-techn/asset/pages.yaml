    # The Filesystem Hierarchy Standard (FHS)


    The Linux system typically contains a very large number of files. For example,
    a typical Red Hat installation may contain around 30,000 files occupying close
    to 400 megabytes of disk space. Clearly it is imperative that these files be organized
    in some consistent, coherent manner. That''s the motivation behind the Filesystem
    Hierarchy Standard, FHS. The standard allows both users and software developers
    to "predict the location of installed files and directories." FHS is by no means
    specific to Linux. It applies to Unix-like operating systems in general.


    FHS specifies several directories and their contents directly subordinate to root.
    This is illustrated in Figure 2-7. The FHS starts by characterizing files along
    two independent axes:


    +   * Sharable vs. non-sharable. A networked system may be mount certain directories
    through NFS such that multiple users can share executables. On the other hand,
    some information is unique to a specific computer and is thus not sharable.


    > ¹ Filesystem Hierarchy Standard — Version 2.2 final, edited by Rusty Russell
    and Daniel Quinlan. Available from www.pathname.com/fhs'
  merge: -1
  img_proc: true
- pgno: 39
  md: '# Linux for Embedded and Real-time Applications


    +   Static vs. variable. Many of the files in a Linux system are executables that
    don''t change, they''re static. But the files that users create or acquire, by
    downloading or e-mail for example, are variable. These two classes of files should
    be cleanly separated.


    ![](img/e081ebf3b04d47734031d23bd4787db5_39_0.png)


    Figure 2-7: Filesystem Hierarchy


    Here is a description of the directories defined by FHS


    +   /bin Contains binary executables of commands used both by users and the system
    administrator. FHS specifies what files /bin must contain. These include among
    other things the command shell and basic file utilities. /bin files are static
    and sharable.


    +   /boot Contains everything required for the boot process except configuration
    files and the map installer. In addition to the kernel executable image, /boot
