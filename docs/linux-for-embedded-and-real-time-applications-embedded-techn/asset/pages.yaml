    # Inter-task Communication


    Although tasks are considered to be independent, the overall function of the system
    usually requires that tasks cooperate and communicate with each other. Thus, a
    key element of any real-time operating system is a set of communication and synchronization
    services.


    There are several communication and synchronization mechanisms in common use:


    +   - Semaphore: Used for synchronization and resource locking.

    - Event Flag: Shows that one or more events have occurred. This is an extension
    of the semaphore that permits synchronizing on a combination of events.

    - Mailbox, queue or pipe: Mechanisms for transferring data between tasks


    There are many other less widely used mechanisms, such as the ADA “rendezvous”
    and the “monitor” in Java.


    # Semaphores


    Consider two tasks, each of which wants to print the message “I am Task n” on
    a single shared printer as shown in Figure 8-10. In the absence of any kind of
    synchronizing mechanism, the result could be something like “II a amm TaTasskk
    12”.


    ![](img/e081ebf3b04d47734031d23bd4787db5_147_0.png)


    ```

    Code in Task n

    printf("I am Task %d\n", task);

    ```


    # Figure 8-10: Sharing Resources'
