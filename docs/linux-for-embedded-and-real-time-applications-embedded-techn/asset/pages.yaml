- pgno: 164
  md: '# Linux and Real-time


    multi-processing (SMP). In an SMP environment spinlocks prevent multiple processors
    from simultaneously executing a critical section of code. In a uni-processor environment
    the spinlocks are no ops.


    The preemption improvement strategy turns the spinlocks into the equivalent of
    EnterCritical() and ExitCritical() that we encountered in the last chapter. Whereas
    the standard kernel prevents preemption unless it''s specifically allowed, the
    preemptible kernel allows preemption unless it''s specifically blocked by a critical
    code section.


    Interrupt handling is also modified to allow for rescheduling on return from an
    interrupt if a higher priority process has been made ready. This approach is often
    coupled with a new scheduler that provides fixed overhead for real-time tasks.
    Monta Vista and TimeSys are the principal proponents of preemption improvement.


    Note, by the way, that we speak of kernel preemption, we''re referring to process
    latency, not interrupt latency. With a standard uni-processor Linux kernel, interrupt
    latency is on the order of 60 microseconds, depending on processor speed. As noted
    above, maximum process latency for a standard kernel is in the tens of milliseconds.
    The preemption improvement strategy reduces to one to two milliseconds.


    The advantage to the preemption improvement approach is that the real-time applications
    run in user space just like any Linux application using the familiar Linux/POSIX
    APIs. Real-time processes are subject to the same memory protection rules as ordinary
    processes.


    There are a couple of perceived drawbacks:


    +   - Modifying the kernel to this extent is serious business. How can you be
    sure your mods haven''t broken something else? And every time the kernel changes
    you have to reimplement your modifications.


    +   - It''s not real-time. Latency is reduced but there are simply too many execution
    paths in the kernel to permit comprehensive analysis of determinism.'
