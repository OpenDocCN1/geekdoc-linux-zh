- pgno: 81
  md: '# Linux for Embedded and Real-time Applications


    # DDD Front End


    DDD provides an X-Windows front end for GDB. You can point-and-click to set breakpoints,
    examine variables and so on. DDD translates the GUI input into commands for GDB,
    known in this environment as the "inferior" debugger.


    BlueCat includes GDB but not DDD or gdbserver. These are on the book CD in /tools.
    Copy the file gdbserver to /opt/BlueCat/bin. Untar ddd.tar.gz to /usr/local.


    # Debugging a Sample Program


    The easiest way to get started with a software tool is to try it out. So before
    getting into the details of remote debugging, let''s just try out DDD on the host
    and play with it a bit. In bookdemo/ is a subdirectory called ddd/. There is a
    small program called shellsort.


    Build the program with the following command:


    ```

    gcc -g -o shellsort shellsort.c

    ```


    The -g option adds symbol information to the executable for use by GDB. This program
    sorts and prints out in ascending order the list of numeric arguments passed to
    it. For example:


    ```

    ./shellsort 4 6 3 1 7 8

    1 3 4 6 7 8

    ```


    Most of the time it works. But there''s a subtle bug in the program. Try for example:


    ```

    ./shellsort 4000 1000 7000 6000 8000

    ```


    The arguments are sorted in the correct order but one of them has been changed.
    Let''s use DDD to find out what''s happening. Enter the command:


    ```

    ddd shellsort

    ```


    After a few seconds the display shown in Figure 5-3 appears. The various elements
    of this display are:'
