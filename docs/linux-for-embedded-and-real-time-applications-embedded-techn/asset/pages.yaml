    int rt_sem_wait(SEM* sem);


    This is the semaphore pend (sometimes known as ''take'', ''wait'' or ''P'') operation.
    It is typically called when a task enters a critical region. The semaphore value
    is decremented and tested. If it is still non-negative rt_sem_wait returns immediately.
    Otherwise the caller task is blocked and queued up. Queueing may happen in either
    priority order or FIFO order as determined by the compile time option SEM_PRIORD.
    In this case rt_sem_wait returns if


