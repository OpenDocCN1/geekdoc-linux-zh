- pgno: 78
  md: '# CHAPTER 5


    # Debugging Embedded Software


    **The Target Setup**

    Before diving into the subject of debugging, let''s review our setup so far. We
    have a minimal kernel and minimal root filesystem on diskette that allows us to
    boot other kernel images and root filesystems over the network via NFS.

    stdin, stdout and stderr on the target are connected to ttyS0, which in turn is
    physically connected to ttyS1. We communicate with the shell running on the terminal
    emulation program minicom. The boot loader script directs it to boot a kernel
    image and root filesystem named shell.

    The shell kernel is configured to start up a bash shell with a minimal set of
    command utilities in /bin and /sbin. It also mounts an NFS volume on /usr. The
    mounted volume is /opt/BlueCat on the host workstation. Consequently, every file
    in the BlueCat/ directory is accessible from the target. The implication of this,
    among other things, is that we can execute on the target program files that physically
    reside on the host''s filesystem. This allows us to test user space application
    programs without having to build and download a new root filesystem. And of course,
    programs running on the target can open files on the NFS-mounted volume. Again,
    the console device is redirected to ttyS0 via a command line option to the kernel
    so that we can communicate with bash running on the target. Figure 5-1 shows graphically
    how these elements interrelate.'
  merge: -1
  img_proc: true
- pgno: 79
  md: '# Linux for Embedded and Real-time Applications


    ![](img/e081ebf3b04d47734031d23bd4787db5_79_0.png)


    Figure 5-1: The Host and the Target


    In principle we could even use the network to communicate with the shell. We simply
    open a telnet session on the host directed at the target. But BlueCat Lite doesn''t
    include a telnet daemon, so we''ll just stick with what we have for now.


    The oldoader, introduced in the previous chapter, is primarily of value when you''re
    working on kernel code. It saves you the time of writing a diskette every time
    you build a new kernel image. But once you have a stable kernel, there''s no reason
    not to put that on a diskette to save the additional step of downloading the kernel
    and filesystem over the net. So at this point it would be useful to put the shell
    project on a diskette. Refer back to the section Making a Boot Disk in the previous
    chapter for the recipe for making a boot diskette.


    # GDB


    GDB stands for the GNU Debugger, the source-level debugging package is part of
    the GNU toolchain. Like any good debugger, it lets start your program, insert
    breakpoints to stop the program at specified points, examine and modify variables
    and processor registers. Like most Linux utilities, it is command-line driven,
    making it rather tedious to use. The solution is to front GDB with a graphical
    front end such as DDD. This combination makes a truly usable source level debugger.


    66'
