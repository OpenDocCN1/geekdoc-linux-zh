  md: '# Linux for Embedded and Real-time Applications


    its own use. Let the program continue again and another New Thread message appear.


    Delete the breakpoint and let the program continue to the while (1) statement
    at the top of the display loop. At this point all the threads have been created.
    Execute Status->Threads. You''ll see a list of all the threads and their current
    execution point. The currently executing thread is highlighted. Note that four
    of the threads, the channels, are all at the execution point.


    Execute Status->Backtrace to bring up the stack for the current thread. This shows
    that we''re in main() and that main() was called from __libc_start_main(). Select
    one of the threads that''s at sigsuspend.c:48. The Backtrace display immediately
    changes to show the stack of that thread. So you can make any thread the "active
    thread" and see its status.


    If you set a breakpoint in the data_acq() function, the program will stop when
    any of the four threads executing data_acq() reaches that point. You can then
    examine the local variables for that thread. Note, however, that only the local
    variables for the currently executing thread are visible.


    # Moving to Kernel Space


    Now it''s time to rebuild data_acq.c so it runs under RTAI Pthreads. Copy data_acq.c
    to data_acq_rt.c. main() turns into init_module(). In addition to creating the
    Command() thread, we now have to explicitly create the Display() thread. printf()
    changes to printk(). Create a dummy cleanup_module() function.


    The major complication of course is that we can''t really do any screen I/O from
    Kernel Space. Among other things, we don''t have access to the curses library
    from Kernel Space. The real functionality of Display() and Command() needs to
    be split between Kernel Space and User Space. We can use RTAI FIFOs to communicate
    between the User Space threads and their "buddies" running in Kernel Space. Remove
    the curses initialization calls from main()/init_module() and replace with two
    rtf_create() calls. data_acq.h contains #defines for the two FIFOs.'
