    It is the asynchronous external interrupt that:


    +   - Maximizes the performance and throughput of computing systems.


    +   - Creates the most problems and frustrations for programmers.


    Many years ago someone wrote in *Computer Magazine* of the IEEE Computer Society
    that “The invention of the interrupt was perhaps the greatest disaster in the
    history of computer science."


    Most processors utilize a similar interrupt scheme. Figure 8-2 shows how the Intel
    x86 architecture does it. The first 1k bytes of memory are reserved for an Interrupt
    Vector Table. Each vector is four bytes representing the FAR address (segment:offset)
    of an Interrupt Service Routine. Some of these vectors have specific meanings
    defined by the processor architecture. For example, vector 0 is the divide-by-zero
    exception, vector 3 is a breakpoint (a single-byte INT instruction), vector 13
    is the infamous General Protection Fault, and so on.


