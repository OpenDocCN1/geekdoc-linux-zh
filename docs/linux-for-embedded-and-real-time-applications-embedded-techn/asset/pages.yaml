    +   - setDigOut(int bitmask) - Turns on the bit(s) specified by bitmask.


    +   - clearDigOut(int bitmask) - Turns off the bit(s) specified by bitmask.


    Take a look at simdrive.c. This driver implementation uses a shared memory region
    to communicate with another process that displays digital outputs on accepts analog
    inputs via the keyboard. This functionality is implemented in devices.c. The shared
    memory region consists of a data structure of type shm_t (defined in driver.h)
    that includes fields for an analog input and a set of digital outputs that are
    assumed connected to LEDs. It also includes a process ID field (pid_t) set to
    the pid of the devices process that allows the thermostat process to signal when
    a digital output has changed. devices creates and initializes the shared memory
    region. In simdrive, initAD() attaches to the previously created shared memory
    region. readAD() simply returns the current value of the a2d field in shared memory.
    setDigOut() and clearDigOut() modify the leds field appropriately and then signal
    the devices process to update the screen display. Figure 5-4 illustrates the process
    graphically.


