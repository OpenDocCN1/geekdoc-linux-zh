- pgno: 42
  md: '# The Shell


    One of the last things that happens as a Linux system boots up is to invoke the
    command interpreter program known as the shell. Its primary job is to parse commands
    you enter at the console and execute the corresponding program. But the shell
    is much more than just a simple command interpreter. It incorporates a powerful,
    expressive interpretive programming language of its own. Through a combination
    of the shell script language and existing utility programs it is quite possible
    to produce very sophisticated applications without ever writing a line of C code.
    In fact this is the general philosophy of Unix programming. Start with a set of
    simple utility programs and link them together through the shell scripting language.


    There are in fact several shell programs in common use. They all serve the same
    purpose yet differ in details of syntax and features. The most popular are:


    +   - Bourne Shell - bash

    - TC Shell - tch

    - Z Shell - zsh


    The subject of shell programming is worthy of a book in itself and in fact there
    are seven books on shell programming listed on Amazon.com.


    # Resources


    Sobel, Mark G., A Practical Guide to Linux. An excellent beginner''s guide to
    Linux and Unix-like systems in general.


    tdp.org – The Linux Documentation Project. As the name implies, this is the source
    for documentation on Linux. You''ll find how-to''s, in-depth guides, FAQs, man
    pages, even an on-line magazine, the Linux Gazette. The material is generally
    well-written and useful.'
  merge: -1
