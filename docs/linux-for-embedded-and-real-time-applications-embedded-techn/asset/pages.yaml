  md: '# Linux for Embedded and Real-time Applications


    # Scheduling


    Tasks operate under the supervision of the real-time kernel that consists of:


    +   - A collection of services that implement such things as inter-task communication
    and synchronization.


    +   - A scheduler whose job is to make sure that the highest priority ready task
    is the one that''s currently executing.


    The scheduler treats each task as a state machine. While every kernel has its
    own, often more complex, state model, Figure 8-7 shows conceptually the minimum
    state diagram for a task. The states are:


    +   - Running: Only one task, the currently executing task, can be in the Running
    state. A task can voluntarily transition from Running to Blocked by waiting on
    an event. In a preemptive system (we''re coming to that), the scheduler may cause
    the Running task to Ready if a higher priority task becomes Ready. This is called
    preemption.


    +   - Ready: The task is ready to run but has a lower priority than the currently
    executing task. The task will transition from Ready to Running when it becomes
    the highest priority Ready task.


    +   - Blocked: A Blocked task is waiting for some event to occur; a message at
    a mailbox, a timeout, or. When the event occurs, the task transitions to Ready.


    ![](img/e081ebf3b04d47734031d23bd4787db5_141_0.png)


    Figure 8-7: Task States


    128'
