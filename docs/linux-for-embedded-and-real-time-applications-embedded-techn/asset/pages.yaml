- pgno: 94
  md: '# CHAPTER 6


    # Kernel Modules and Device Drivers


    For me, the fun part of embedded programming is seeing the computer interact with
    its physical environment—i.e., actually do something. In this chapter we''ll use
    the parallel port on our target machine to provide some limited I/O capability
    for the thermostat program developed in the previous chapter. But first some background.


    # Kernel Modules


    Installable kernel modules offer a very useful way to extend the functionality
    of the basic Linux kernel and add new features without having to rebuild the kernel.
    A key feature is that modules may be dynamically loaded when their functionality
    is required and subsequently unloaded when no longer needed. Modules are particularly
    useful for things like device drivers and /proc files.


    Given the range and diversity of hardware that Linux supports, it would be impractical
    to build a kernel image that included all of the possible device drivers. Instead
    the kernel includes only drivers for boot devices and other common hardware such
    as serial and parallel ports, network devices and so on. Other devices are supported
    as loadable modules and only the modules needed in a given system are actually
    loaded.


    Loadable modules are unlikely to be used in a production embedded environment
    because we know in advance exactly what hardware the system must support and so
    we simply build that support into the kernel image. Nevertheless, modules are
    still useful when testing a new driver. You don''t need to'
  merge: -1
  img_proc: true
- pgno: 95
  md: '# Linux for Embedded and Real-time Applications


    build a new kernel image every time you find and fix a problem in your driver
    code. Just load it as a module and try it.


    Keep in mind that modules execute in Kernel Space at Privilege Level O and thus
    are capable of bringing down the entire system.


    # A Module Example


    cd /opt/BlueCat/demo/bookdemo/driver and open the file hello.c. This is a trivial
    example of a loadable kernel module. It contains two functions; init_module()
    and cleanup_module(). Every module must include these functions. init_module()
    is called by insmod, the shell command that installs a module. cleanup_module()
    is called by rrmod, the command that removes module.


    In this example both functions simply print a message on the console using printk,
    the kernel equivalent of printf C library functions like printf are intended to
    run from user space making use of operating system features like redirection.
    These facilities aren''t available to kernel code. Rather than writing directly
    to the console, printk writes to a circular buffer and then wakes up by the klogd
    process to deal with the message by either printing it to the console and/or writing
    it to the system log.


    Note the “<1>” at the beginning of the printf format strings. This is a loglevel
    that determines whether or not the message appears on the console. Loglevels range
    from 0 to 7 with lower numbers having higher priority. If the loglevel is numerically
    less than the kernel integer variable console_loglevel then the message appears
    on the console. In any case, it also shows up in the file /var/log/messages.


    Oddly enough, printk messages do not appear in shell windows running under X windows
    regardless of the loglevel. You can see what printk did with the command:


    ```

    tail /var/log/messages

    ```


    This prints out the last few lines of the messages log file.'
  merge: -1
  img_proc: true
- pgno: 96
  md: '# Kernel Modules and Device Drivers


    This example also shows how to specify module parameters with the MOD_PARM() macro.


    Take a look at the Makefile for hello. Note in particular the two symbols defined
    by the environment variable K_CFLAGS. The __KERNEL__ symbol is required to compile
    code that runs as part of the kernel. The MODULE symbol is required for code that
    will be loaded as a kernel module.


    Note also the -c flag in the compiler command line. This means compile only, do
    not link with any libraries. So the resulting object file is not directly executable
    and may contain references to external symbols such as printk How do these external
    references resolve? insmod resolves them against the kernel''s symbol table, which
    is loaded in memory as part of the kernel boot process. Furthermore, any nonstatic
    symbols defined in the module are added to the kernel symbol table and are available
    for subsequently loaded modules. The only external symbols a module can reference
    are those built into the kernel image or previously loaded modules. The kernel
    symbol table is available in /proc/ksyms.


    Make hello and try it out. Enter the command


    ```

    insmod ./hello my_string="name" my_int=47

    ```


    If you''re running from the command line, i.e. not in X windows, you should see
    the message printed by init_module(). If you''re running a shell within X windows,
    in KDE for example, execute tail /var/log/messages. Note, by the way, that insmod
    doesn''t by default look in the current directory. Now try the command lsmod.
    This lists the currently loaded modules. It also gives a "usage count" for each
    module and shows what modules depend on other modules. The same information is
    available in /proc/modules. Enter the command ksyms. This lists the symbols that
    have been added to the kernel symbol table by the currently loaded modules. Now
    execute the command rmmmod hello. You should see the message printed by cleanup_module().
    Finally execute lsmod again and the list should be empty.'
  merge: -1
  img_proc: true
- pgno: 97
  md: '# Linux for Embedded and Real-time Applications


    # **Tainting** the Kernel


    If you''re running Modutils version 2.4.18 from the book CD, you saw another message
    when you installed hello:


    Warning: loading./hello will taint the kernel: no license


    See http://www.tux.org/lkml#export-tainted for information about tainted modules


    What the heck does that mean? Apparently, kernel developers were getting tired
    of trying to cope with bug reports involving kernel modules for which no source
    was available, that is, modules not released under an Open Source license such
    as GPL. Their solution to the problem was to invent a MODULE_LICENSE() whereby
    you can declare that a module is indeed Open Source. The format is:


    MODULE_LICENSE("<approved string>")


    Where approved_string() is one of the ASCII text strings found in linux/include/linux/module.h.
    Among these, not surprisingly, "GPL". If you distribute your module in accordance
    with the terms of an Open Source license such as GPL, you are permitted to include
