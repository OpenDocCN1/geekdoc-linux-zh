- pgno: 80
  md: '# Debugging Embedded Software


    In a typical desktop environment, the target program runs on the same machine
    as the debugger. But in our embedded environment DDB/GDB runs on the host and
    the program being debugged runs on the target (see Figure 5-2). Fortunately, GDB
    implements a serial protocol that allows it to work with remote targets either
    over an RS-232 link or Ethernet.


    ![](img/e081ebf3b04d47734031d23bd4787db5_80_0.png)


    Figure 5-2: Debugging with gdb


    There are two approaches to interfacing the target to the GDB serial protocol:


    +   - gdb stubs. A set of functions linked to the target program. gdb stubs is
    an RS-232-only solution.


    +   - gdbserver. This is a stand-alone program running on the target that, in
    turn, runs the program to be debugged. The advantage to gdbserver is that it is
    totally independent of the target program. In other words, the target builds the
    same regardless of remote debugging. The other major advantage of gdbserver is
    that it runs over Ethernet.'
  merge: -1
