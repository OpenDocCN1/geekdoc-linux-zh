    This is the semaphore post (sometimes known as ''give'', ''signal'', or ''V'')
    operation. It is typically called when the task leaves a critical region. The
    semaphore value is incremented and tested. If the value is not positive, the first
    task in semaphore''s waiting queue is allowed to run. rt_sem_signal does not block
    the caller task.


