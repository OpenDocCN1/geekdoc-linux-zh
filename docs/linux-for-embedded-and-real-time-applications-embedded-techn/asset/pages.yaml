    The extra level of indirection—why not simply redefine the functions? Well, suppose
    you want to restore normal Linux operation. Perhaps the system isn''t behaving
    properly and you''d like to isolate the problem either to Linux or RTAI. Simply
    removing the RTAI module restores normal Linux functionality by pointing the rt_hal
    entries back to the original kernel


    The modifications to the Linux kernel to support RTHAL are relatively confined
    and straightforward. Listing 10-2 shows a couple examples comparing the original
    code to the RTAI modified code. The sti and cli macros get redefined to function
    calls in the RTHAL. The interrupt management functions simply get "rthal." prepended
    to them. Altogether about twenty files are involved as listed in Table 10-1.


    # Listing 10-2: RTHAL Patches


    | Linux (system.h) |

    | #define __sti()_asm__ __volatile__("sti": ::"memory") |

    | #define __cli()_asm__ __volatile__("cli": ::"memory") |

    | RTAI (system.h) |

    | #define __sti() (rthal.enint()) |

    | #define __cli() (rthal.disint()) |

    | Linux (irq.c) |

    | mask_and_ack_8259A(irq); |

    | RTAI (irq.c) |

    | rthal.mask_and_ack_8259A(irq); |'
