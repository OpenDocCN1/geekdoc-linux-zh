    or GRUB (Grand Unified Bootloader) to select the specific kernel or alternate
    operating system to boot. There''s a very good reason for having the ability to
    boot multiple kernel images. Suppose you build a new kernel and it fails to boot
    properly. You can always go back and boot a known working image and then try to
    figure out what went wrong in your new one.


