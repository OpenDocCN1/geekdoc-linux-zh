  md: '# The Host Development Environment


    All the information in the configuration menus is provided by a set of text files
    named config.in. These are script files written in Config Language, which looks
    suspiciously like bash but isn''t exactly. The main config.in file is located
    in linux/arch/(ARCH) where ARCH is a variable in Makefile identifying the base
    architecture. Listing 3-1 is an excerpt.


    # Listing 3-1: Excerpt of config.in


    ```

    # For a description of the syntax of this configuration file,

    # see Documentation/kbuild/config-language.txt.

    #

    mainmenu_name "Linux Kernel Configuration"


    def_bool CONFIG_X86 y

    def_bool CONFIG_ISA y

    def_bool CONFIG_SBUS n


    def_bool CONFIG_UID16 y


    mainmenu_option next_comment

    comment ''Code maturity level options''

    bool ''Prompt for development and/or incomplete code/drivers''

    CONFIG_EXPERIMENTAL

    endmenu


    mainmenu_option next_comment

    comment ''Loadable module support''

    bool ''Enable loadable module support'' = " "y"; CONFIG_MODULES

    if [ "$CONFIG_MODULES" ]; then

    bool ''Set version information on all module symbols'' CONFIG_MODVERSIONS

    bool ''Kernel module loader'' CONFIG_KMOD

    fi

    endmenu

    ```


    Go to linux/arch/i386 and open config.in. Compare the structure of the file with
    xconfig menu and the pattern should become fairly clear. Text for each of the
    menu sections as well as the individual options within those sections is identifiable.
    There are several types of options:


    +   - bool – The option has two values, "y" or "n"

    - tristate – The option has three values, "y", "n" and "m".'
