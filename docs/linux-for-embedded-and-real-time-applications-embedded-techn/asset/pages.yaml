- pgno: 146
  md: '# Introduction to Real-time Programming


    The task create service may return a pointer to a task control block (TCB), identified
    here as type task_t. This is a data structure containing everything the kernel
    needs to know about the task. This pointer can then be used as an argument to
    other task management services.


    Note that in this implementation we are assuming that the task create service
    allocates the TCB and the stack. We also assume that the stack size is fixed and
    is initialized elsewhere. Some implementations require the user to allocate the
    TCB and/or the stack and stack size. There may be additional arguments like a
    name in ASCII or a timeslice value, for example.


    The task create service may or may not start the task executing. If it doesn''t,
    a separate start task service is provided. Once a task is executing it may be
    suspended, which simply prevents the task from being scheduled for execution until
    it is subsequently resumed. Finally, a task that is no longer needed may be deleted,
    which removes it from the list of active tasks. In general, task management functions
    other than TaskCreate return a status_t indicating whether or not the function
    succeeded.


    # Timing API


    ```

    void Delay (unsigned int ticks);

    void DelayUntil(time_t *time);

    void WaitTilNext(void);

    ```


    Every kernel has a function called something like Delay that blocks the calling
    task for the specified number of clock ticks. Some systems have a variation on
    this called DelayUntil that blocks the calling task until a specific time of day.
    The data type time_t is an unsigned long int representing seconds since midnight,
    Jan. 1, 1970.


    WaitTilNext is only found in systems that support the notion of a periodic task.
    This function blocks the calling task until the next time the task is scheduled
    for execution.'
