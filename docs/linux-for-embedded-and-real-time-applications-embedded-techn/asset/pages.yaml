- pgno: 136
  md: '# Introduction to Real-time Programming


    +   - The second byte of the INT instruction is an index into the vector table
    to find the address of the corresponding Interrupt Service Routine (ISR). The
    processor loads this address into the PC and CS registers and execution proceeds
    from this point.


    +   - The end of the ISR is indicated by an IRET instruction (Interrupt Return).
    This pops the PC, CS, and PSW off the stack so that execution resumes at the instruction
    following the INT.


    The INT instruction is like the subroutine CALL instruction but with one important
    difference: Where the destination address is embedded in the CALL instruction,
    with the INT instruction the calling program need not know the address of the
    ISR! The address is held in the Interrupt Vector Table. Thus, it is ideal for
    communication between two separately compiled and loaded programs as, for example,
    an application program and an operating system.


    External hardware interrupts operate in a similar fashion as shown in Figure 8-4.
    A device requiring service asserts an Interrupt Request (IRQ) line. The processor
    responds with Interrupt Acknowledge (IAK), the device places its interrupt vector
    number on the data bus. The processor then effectively simulates an INT instruction
    using the supplied vector index.


    ![](img/e081ebf3b04d47734031d23bd4787db5_136_0.png)


    Figure 8-4: Hardware Interrupts'
