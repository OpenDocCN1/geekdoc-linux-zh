  md: '# Posix Threads


    But it goes deeper than that. Functions could be called simultaneously by more
    than one thread must be reentrant. A function is reentrant if it doesn''t use
    any statically allocated resources like global memory. C functions tend to be
    naturally reentrant provided they reference local variables


    # Debugging Multi-threaded Programs


    The nice thing about running Pthreads in User Space is that you can debug your
    program with DDD/GDB. Multi-threading does introduce some complications to the
    debugging process but, fortunately, GDB has facilities for dealing with those.
    Run data_acq under DDD and set the initial breakpoint at the line:


    ```

    channel![i].number = i;

    ```


    near the beginning of main(). But before running the program, execute View>Execution
