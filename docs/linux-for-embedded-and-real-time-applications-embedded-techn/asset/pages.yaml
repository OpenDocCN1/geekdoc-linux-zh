- pgno: 100
  md: '# Kernel Modules and Device Drivers


    The second problem is that User Space is swappable. This means that while an I/O
    operation is in process, the user''s data buffer could get swapped out to disk.
    And when that page gets swapped back in, it will very likely be at a different
    physical address. So data to be transferred to or from a peripheral device must
    reside in Kernel Space, which is not swappable. The driver then has to take care
    of transferring that data between Kernel Space and User Space.


    # Linux Device Drivers


    Unix, and by extension Linux, divides the world of peripheral devices into three
    categories:


    +   - Character

    - Block

    - Network


    The principal distinction between character and block is that the latter, such
    as disks, are randomly accessible—that is, you can move back and forth within
    a stream of characters. Furthermore, data on block devices is usually transferred
    in one or more blocks at a time and prefetched and cached. With character devices
    move in one direction only. You can''t, for example, go back and reread a character
    from a serial port. Block devices generally have a filesystem associated with
    them, whereas character devices don''t.


    Network devices are different in that they handle "packets" of data for multiple
    protocol clients rather than a "stream" of data for a single client. Furthermore,
    data arrives at a network device asynchronously from sources outside the system.
    These differences necessitate a different interface between the kernel and the
    device driver.


