- pgno: 148
  md: '# Introduction to Real-time Programming


    What needed is some way to regulate access to the printer so that only one

    task can use it at a time.


    A semaphore acts like a key to control access to a resource. Only the task that

    has the key can use the resource. In order to use the resource (in this case a

    printer) a task must first acquire the key (semaphore) by calling an appropriate
    kernel service (Figure 8-11). If the key is available, that is the resource

    (printer) is not currently in use by someone else, the task is allowed to

    proceed. Following its use of the printer, the task releases the semaphore so

    another task may use it.


    ![](img/e081ebf3b04d47734031d23bd4787db5_148_0.png)


    Code in Task n

    acquireSem(Printer);

    printf("I am Task %d\n", task);

    releaseSem(Printer);


    Figure 8-11: Sharing Resources with a Semaphore


    If, however, the printer is in use, the task is blocked until the task that

    currently has the semaphore releases it. Any number of tasks may try to

    acquire the semaphore while it is in use. All of them will be blocked. The

    waiting tasks are queued in order of priority or in the order in which

    they called acquireSem. The choice of how tasks are queued at the semaphore may
    be built into the kernel or it may be a configuration option when

    the semaphore is created.


    acquireSem works as follows:


    +   1. Decrement the semaphore value.

    2. If the resulting value is greater than or equal to 0, the resource is available
    and the task can proceed. Otherwise, block the task until another task executes
    releaseSem.'
