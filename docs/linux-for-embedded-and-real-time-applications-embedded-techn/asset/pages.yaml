  md: '# Linux for Embedded and Real-time Applications


    on the workstation, cd /dev and ls -l hd*. You’ll get a very large number of entries.
    Notice that the first character in the flags field for all these entries is “b”.
    This indicates that the directory entry represents a “block” device. In fact all
    of these entries are hard disk devices.


    Between the Group field and the date stamp, where the file size normally appears,
    is a pair of numbers separated by a comma. These are referred to as the “major
    device number” and the “minor device number” respectively. The major device number
    turns out to be an index into a table of device driver pointers, either chrdev[]
    for character devices or blkdev[] for block devices. So, in effect, the major
    device number identifies the device driver. The minor device number is used only
    by the driver itself to distinguish among possibly different types of devices
    the driver can handle. The major and minor device numbers are each eight bits.


    Now do ls -tty*. The first character in the flags field is now “c” indicating
    that these are character devices. Character devices and block devices each have
    their table of device driver pointers. Links allow the creation of logical devices
    that can then be mapped to system-specific physical devices. Try Is -mouse. In
    my system this is a link to psaux, the device for a PS2-style mouse.


    Entries in /dev are created with the mknod command as, for example,


    ```

    mknod /dev/tty1 c 4 65

    ```


    This creates a /dev entry named tty1. It’s a character device with major device
    number 4 and minor device number 65. There’s no reference to a device driver here.
    All we’ve done with mknod is create an entry in the filesystem so programs can
    “open” the device. But before that can happen we’ll have to “register” a character
    device driver with major number 4 to fill the appropriate entry in the chrdev[]
    table.


