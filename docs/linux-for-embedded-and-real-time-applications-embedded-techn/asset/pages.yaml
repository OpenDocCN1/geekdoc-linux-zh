    function.


    Now take a look at check.c. It creates a buddy task for itself and then gets the
    address (handle) of LATMBX. Note we''re assuming that LATCAL starts first. rt_mbx_receive()
    is a blocking call that doesn''t return until it receives a message in the mailbox.
    Then it simply prints out various deviation parameters. Finally it tests the flag
    set by the signal handler to see if it''s time to go away. If so, it sends a dummy
    message to jitter and returns. main() then deletes the task.


    Let''s try it out. Make the project. In addition to rt_process and check, this
    makes a third target, jittermod.o, that we''ll look at later. You''ll need to
    be Superuser to run the programs because only Superuser processes are allowed
    to set the scheduler and lock memory.


    But before we can run each task, we need to load the LXRT module. Remember that
    rtai_lxrt depends on other modules. We could just issue individual insmod commands
    to load the required modules in order. But there''s an easier way. Enter the command


    ```

    modprobe rtai_lxrt

    ```


    This checks the dependencies of rtai_lxrt and loads any required modules if they
    aren''t already loaded.


    With the RTAI environment set up, we can now run our two tasks. There are two
    ways to do this. We could start two shell windows and run one program in each
    window. Or, we can run rt_process as a background task and run check as the foreground
    task in the same window. Enter


    ```

    ./rt_process &

    ```'
