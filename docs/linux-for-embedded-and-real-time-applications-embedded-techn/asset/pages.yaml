    # Message Handling Functions


    This set of functions implements a direct task-to-task messaging mechanism.

    The message content is restricted to a single integer.


    ```

    RT_TASK* rt_send (RT_TASK* task, unsigned int msg);

    RT_TASK* rt_send_if (RT_TASK* task, unsigned int msg);

    ```


    Sends the message msg to the task. rt_send blocks the calling task until the destination
    task, task, gets the message. If multiple tasks are sending messages to the task,
    they are queued in either priority order or FIFO order as determined by compile
    time option MSG_PRIORD. rt_send_if doesn''t block.


    # Return value


    +   - Success – task (the pointer to the task that received the message)

    - 0 – rt_send: task was killed before it could receive the message.

    rt_send_if: task was not ready to receive the message

    - MSG_ERR – task does not reference a valid task.


