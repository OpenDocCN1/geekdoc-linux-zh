- pgno: 44
  md: '# CHAPTER 3


    # The Host Development\Environment


    In many cases, the target computer on which an embedded application runs is severely
    limited in terms of its computing resources. It probably doesn''t have a full-sized
    display or keyboard. It may have at a few megabytes of mass storage in the form
    of a flash file system, hardly enough to contain a compiler, much less a decent
    IDE. Thus, embedded development usually requires at least two computers—Thus,
    the target on which the embedded program will run and a development workstation
    on which the embedded program is written and compiled. Before we begin working
    with an embedded Linux environment, we''ll have to set up an appropriate development
    workstation.


    Any modern PC will work just fine as a development host. Minimum requirements
    are 32 megabytes of RAM and 2 gigabytes of disk for Linux. Install your favorite
    Linux distribution, Red Hat, Debian, Mandrake. Modern Linux distributions resort
    reasonably clean, self-explanatory installation procedures, so I won''t duplicate
    any of that. A "workstation" class installation is adequate. If it''s not installed
    by default, you should install the kernel source code.


    I do most of my Linux work on a 300-MHz AMD K6 that I call my "lab computer" (see
    Figure 3-1). It''s a dual boot system since I also work in the Microsoft world.
    I have 2 gigabytes of disk dedicated to Win 95 and 6 gigabytes for Linux, of which
    about a third is currently used. I run Red Hat version 6.2. Of the several distributions
    that I''ve tried, I find 6.2 to be the most stable and the easiest to install
    and use.'
  merge: -1
  img_proc: true
