    # Critical Sections


    Within the operating system there are sections of code that must execute “atomically”—that
    is, they must not be interrupted under any circumstance. These are called “critical
    sections” and must be protected in much the same way as a printer is protected
    from multiple accesses by a semaphore. Whenever the kernel does a test and set
    operation on a global variable or updates a global linked list, this is a critical
    section.


    A critical section is typically bracketed by a pair of functions of the form:


    ```

    EnterCritical()

    ExitCritical()

    ```


    Code appearing between these functions is guaranteed not to be interrupted. In
    practice, these functions are often implemented as in-line language macros that
    evaluate respectively to:'
