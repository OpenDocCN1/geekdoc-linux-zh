- pgno: 46
  md: '# The Host Development Environment


    The C language. GCC has language front ends for C, C++, Objective C, Fortran,
    Java and Ada, as well as run-time libraries for these languages.


    GCC also supports a wide range of target architectures in addition to the x86.
    Supported targets include:


    +   - Alpha

    - ARM

    - M68000

    - MIPS

    - PowerPC

    - SPARC


    GCC can run in a number of operating environments including Linux and other variants
    of Unix. There are even versions that run under DOS and Windows.


    GCC can be built to run on one architecture (a PC, for example) while generating
    code for a different architecture (a PowerPC perhaps). This is the essence of
    cross development.


    # GDB


    GDB stands for the “GnuDebugger.” This is a powerful source-level debugging package
    that lets you see what''s going on inside your program. You can step through the
    code, set breakpoints, examine and change variables and so on. GDB itself is command
    line driven, making it rather tedious to use. The solution is to front GDB with
    a graphical front end such as DDD. This combination makes a truly usable source
    level debugger.


    Like GCC, GDB can be built to work with different target architectures.


    # Configuring and Building the Kernel


    One of the neatest things about Linux is that you have the source code. You''re
    free to do whatever you want with it. Most of us have no intention, or'
