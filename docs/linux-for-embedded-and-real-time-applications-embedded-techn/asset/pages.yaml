    # Interrupt Abstraction


    In a great many applications, only a small part of the system requires hard real-time
    determinism. Controlling a high-speed PID loop or moving a robot arm are examples
    of hard real-time requirements. But logging the temperature the PID loop is tricky
    to maintain, or graphically displaying the current position of the robot arm are
    generally not real-time requirements.


    The alternate, and would say more expedient, approach to real-time performance
    in Linux relies on this distinction between what is real-time and what is not.
    The technique is to run Linux as the lowest priority task (the idle task if you
    will) under a small real-time kernel. The real-time functions are handled by higher
    priority tasks running under this kernel. The non-real-time stuff, like graphics,
    file management and networking, which Linux already does very well, is handled
    by Linux.


    This approach is called "Interrupt Abstraction" because the real-time kernel takes
    over interrupt handling from Linux. The Linux kernel "thinks" it''s disabling
    interrupts but it really isn''t.


    Being much smaller and simpler, the real-time OS is amenable to execution time
    analysis that provides reliable upper bounds on latency. On the other hand, the
    RTOS introduces its own API and purists insist that this is not "true" Linux.
    And while this approach also involves modifying the kernel, the extent of the
    modifications is substantially less than the Preemption Improvement approach.


    The real-time tasks run in kernel space¹. This is a good-news, bad-news situation.
    The good news is that response times in kernel space are very


    ¹ RTAI does in fact offer real-time functionality in user space. We''ll see that
    in the next chapter.'
