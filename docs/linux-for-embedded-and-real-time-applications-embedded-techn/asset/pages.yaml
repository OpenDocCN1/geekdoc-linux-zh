- pgno: 62
  md: '# CHAPTER 4


    # BlueCat Linux


    BlueCat Linux is an Open Source Linux distribution developed by LynuxWorks¹. The
    BlueCat package provides a basic Linux kernel together with tools and utilities
    that support cross-development work to put Linux in embedded target devices. The
    commercial distribution of BlueCat supports a range of target architectures including
    x86, Power PC, ARM and its derivatives, MIPS and Super H.


    LynuxWorks also offers a free downloadable “lite” version of BlueCat that only
    supports PC-style x86 targets. The book CD includes BlueCat lite in the subdirectory/BlueCat.
    Because the target is a PC, BlueCat is an ideal tool for learning about, and experimenting
    with, embedded Linux without investing in a specialized target board.


    # The “Less Is More” Philosophy


    There are a number of companies in addition to LynuxWorks offering distributions
    that target the embedded marketplace. These include Lineo, RedHat and Monta Vista²,
    to name a few. Many of these embedded toolkits take the approach of encapsulating
    the Linux development process


    +   ¹ LynuxWorks didn''t actually begin with Linux. They''ve been around for about
    14 years providing a hard real-time version of Unix called LynxOS that is now
    ABI-compatible (Application Binary Interface) with Linux.


    +   ² Monta Vista is the only one of these vendors that is not accessible over
    the Net by the obvious web address. Their website is www.mvista.com.'
  merge: -1
  img_proc: true
- pgno: 63
  md: '# Linux for Embedded and Real-time Applications


    inside another environment intended to be easier and more intuitive for an embedded
    developer new to Linux. This is all well and good to the extent that the vendor''s
    environment fully encapsulates the Linux development process. If there are gaps
    in the encapsulating environment, you may end up having to cope with substantial
    elements of Linux development as well as the vendor''s tools and environment.


    LynuxWorks has taken the opposite approach of simply packaging the standard Linux
    kernel together with a few simple tools to support the target and cross-development
    environments. The work flow is basically that of standard Linux but the process
    is well documented in the BlueCat Users'' Guide. Minimizing the modifications
    to the standard Linux code base makes it easier to track changes in Linux.


    # Installing BlueCat Linux


    The lite version takes around 520 megabytes of disk space. Follow these steps
    to install BlueCat under the /opt directory.


    +   1. Mount the CD, usually under /mnt/cdrom. If you''re running a desktop environment
    like Gnome or KDE (why wouldn''t you?), the CD will normally be “automounted”
    as soon as it''s inserted.

    2. Go to the /opt directory on your hard disk and make a subdirectories BlueCat.

    3. In a shell window, cd /opt/BlueCat.

    4. Execute /mnt/cdrom/BlueCat_i386/install.


    This completes the BlueCat installation procedure. There is an additional tar
    file of demo code and documentation in BlueCat_i386/ named bookdemo.tar.gz. Utilize
    this in /opt/BlueCat. It creates subdirectories for several demo projects that
    we''ll be exploring in depth later. There''s a minor change to SETUP.sh and some
    modifications to the osloader demo project. Oddly enough, the downloadable distribution
    doesn''t include the users'' guide. So it''s also in this file.'
  merge: -1
  img_proc: true
- pgno: 64
  md: 'The commercial version of BlueCat can also be installed on a Windows host if
    you''re so inclined. This uses the CYGWIN execution environment from Cygnus Solutions
    (now part of Red Hat).


    # Exploring BlueCat Linux


    Take a look at the directory /opt/BlueCat (Figure 4-1). With exceptions all of
    the subdirectories have names identical to those in the standard filesystem hierarchy.
    They serve the same purpose as the standard directories except they apply to the
    target. They contain executable tools and configuration files that run on the
    target. These directories become part of the by including them in the target file
    system.


    | /opt/BlueCat | |

    |---||

    | bin | Essential command binaries |

    | boot | Static files of the boot loader |

    | cdt | Cross development tools |

    | demo | Link to target-specific demo directory |

    | demo.x86 | Sample programs for an x86 target |

    | etc | Target-specific system configuration |

    | lib | Essential shared libraries and kernel modules |

    | sbin | Essential system binaries |

    | usr | Secondary hierarchy |

    | var | Variable data |


    Figure 4-1: BlueCat Linux Directory Structure


    The directory cdt/ stands for "Cross Development Tools" and contains the tools
    necessary to build and debug a target system including, among others. The GNU
    C compiler and GDB. Under cdt/ you''ll find another tree structure that looks
    suspiciously like the standard filesystem hierarchy. Even though we''re building
    for an x86 target, we have to use the tools in cdt/ rather than the normal set
    of GNU tools.


    The directory link demo/ points to demo.x86/, which in turn contains subdirectories
    with example systems. In the directory demo/, create a new subdirectory called
    boot/. Set the access mode for this directory to r-xr-xr-x. The reason for this
    will become clear later.'
  merge: -1
  img_proc: true
- pgno: 65
  md: '# Linux for Embedded and Real-time Applications


    # The BlueCat Environment


    There is a script file in /opt/BlueCat named SETUP.sh. Its job is to set up the
    appropriate environment for running the BlueCat tools. It exports several environment
    variables and puts several paths at the beginning of the PATH environment variables
    so that the BlueCat tool chain is invoked when you make a project. You must run
    SETUP.sh before working in the BlueCat environment.


    However, you must run SETUP.sh using the "dot built-in" command as follows:


    ```

    . SETUP.sh

    ```


    where there is a space between the dot and the file name. Normally, when the bash
    shell executes a command or script it forks a new process that inherits the exported
    environment variables of the parent. If we set or change environment variables
    from the script, the changes only apply to the process executing the script. When
    it finishes, the changes vanish along with the process.


    But bash also has several "built-in" commands, among which is "dot." The dot command
    runs its script argument in the current process so that the changes take effect
    in the current process''s environment.


    > Try it out


    Try executing SETUP.sh in the normal manner. First, enter the command "set" to
    see what environment variables are currently defined.


    Now run SETUP.sh. The execute permission bit must be set and if your PATH doesn''t
    include the current directory, you''ll have to enter ./SETUP.sh. Execute set again.
    Any changes?


    Use the dot command and enter SETUP.sh. Run set again.


    # X86 Target for BlueCat Linux


    BlueCat Linux will run small systems quite nicely on a 386. This makes it relatively
    low cost and painless to set up a target for experimenting with BlueCat. Here''s
    your chance to dust off that old 486 box that''s been sitting in the closet or
    serving as a door stop and do something useful with it.'
  merge: -1
  img_proc: true
- pgno: 66
  md: '# Minimal Requirements


    We don''t need much to get up and running. In principle we don''t even need a
    keyboard or monitor because Linux can boot and run "headless.". it''s useful to
    have a keyboard and display initially to make sure the box is basically running.
    Here then are the minimal requirements for a BlueCat Linux target:


    +   - 386 or higher motherboard with at least 8 megabytes of RAM.

    - Diskette drive, preferably 3.5 inch so it''s compatible with your host system.
    This holds the boot kernel image and root filesystem.

    - Serial port.

    - Parallel port. We''ll use this for experimenting with I/O.

    - Network adapter. You can live without it but it really isn''t fun. Any common
    network adapter should suffice. Mine happens to be an NE2000-compatible, BOCALANcard
    2000 Plus Combo.


    That''s it. This configuration is roughly equivalent to a small single-board computer
    (SBC) that you might use in a real embedded project. The diskette takes the place
    of a small ROM or Flash memory device. Figure 4-2 shows my ISA and VLB³ 486 target.


    ![](img/e081ebf3b04d47734031d23bd4787db5_66_0.png)


    Figure 4-2: My BlueCat target


    ³ VESA Local Bus. Remember?'
  merge: -1
  img_proc: true
- pgno: 67
  md: '# Linux for Embedded and Real-time Applications


    # Setup


    It''s a good idea to have a bootable DOS diskette to do the initial checkout of
    your target system. If you don''t happen to have a bootable diskette, there''s
    an image of one on the book CD named /tools/W95boot.img. Use the DOS utility rewrite
    in /tools to transfer this to a diskette. Just start the program and follow the
    prompts. Note that this process overwrites the entire diskette.


    Set up your box with a keyboard and monitor. The first time you power up you should
    go into BIOS setup, which is usually accomplished by hitting the Del key when
    the RAM test is in progress. Check that the drive disk configuration matches what
    you have. Found that POST objected after I removed the hard drive but neglected
    to change the BIOS setting for Drive C. Exit BIOS setup and boot the DOS diskette.
    If the boot is successful, you''ve verified most of the motherboard logic and
    the diskette.


    To connect the serial port to your workstation, you will most likely need a “null
    modem.” This is a cable with two 9-pin female D sub connectors wired as shown
    in Figure 4-3. Transmit Data (TD) and Receive Data (RD) must be swapped so that
    TD from one end goes to RD on the other end. Likewise the control signals Data
    Set Ready (DSR) and Data Terminal Ready (DTR) must be swapped. Connect the serial
    port to COM2 on your workstation.


    ![](img/e081ebf3b04d47734031d23bd4787db5_67_0.png)


    Figure 4-3: Null Modem Cable'
  merge: -1
  img_proc: true
- pgno: 68
  md: 'W95boot.img contains a simple terminal emulator program, term, to check

    operation of the serial port. term simply echoes back anything it receives on

    aserial port at 9600 baud. Usage is:


    ```

    term <port>

    ```


    where <port> specifies the serial port number, either 1 or 2. <port> is op-

    tional and defaults to 1. Type ^C to exit the program.


    You can exercise the target serial port by running the terminal emulator

    program minicom from your host workstation. But first, you''ll need to config-

    uremin as described in the next section.


    If your network connection is twisted pair (10 Base T) then you must use a

    crossover patch cable. Like the null modem, a crossover cable swaps the signal

    pairs so that the transmitter at one end is connected to the receiver at the

    other end. There''s not much we can do about networking at this point. We''ll

    have to wait until we boot a BlueCat image.


    # Configuring the Workstation


    There are some elements on the host workstation that need to be configured

    in order to communicate with the target. You need to be the root user in

    order to make most of the changes discussed here. You can become root user

    without logging out of your normal user account. In a shell window, enter the

    command su. Respond to the password prompt with the root password.

    You''re now root user in that shell. To return to your normal user account,

    enter the command exit.


    In KDE you can open a file manager window in root (also called Super User)

    mode. Enter the start menu. Go to System->File manager (Super User

    Mode). Again you''ll be prompted for the root password. The new file man-

    ager window has root privileges allowing you to edit and change permissions

    of files and directories owned by root.'
  merge: -1
  img_proc: true
- pgno: 69
  md: '# Linux for Embedded and Real-time Applications


    # The Terminal Emulator, minicom


    minicom is a fairly simple Linux application that emulates a dumb RS-232 terminal
    through a serial port. The default minicom configuration is through a modem device,/dev/modem.
    We need to change that to talk directly to one of the PC''s serial ports.


    In a shell window as root user, enter the command minicom -s. If you''re running
    minicom for the first time you may see the following warning message:


    WARNING: Configuration file not found. Using defaults


    You will be presented with a configuration menu. Select serial port setup. Type
    "A" and replace the word "modem" with "ttyS1" the device that represents serial
    port COM2. Type "E" and type "E" again to select 9600 baud. Figure 4-4 shows the
    final serial port configuration.


    ![](img/e081ebf3b04d47734031d23bd4787db5_69_0.png)


    Figure 4-4: minicom Serial Port Settings


    Type Enter to enter Serial port setup and then select Modem and dialing. Here
    we want to delete the modem''s Init string and Reset string since they''re just
    in the way on a direct serial connection. Type "A" and backspace through the entire
    Init string. Type "B" and do the same to the Reset string.'
  merge: -1
  img_proc: true
