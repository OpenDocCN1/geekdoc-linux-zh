  md: '# Linux for Embedded and Real-time Applications


    # Socket Attributes


    The socket system call creates a socket and returns a descriptor for later use
    in accessing the socket.


    ```

    #include <sys/socket.h>

    int socket(int domain, int type, int protocol);

    ```


    A socket is characterized by three attributes that determine how communication
    takes place. The domain specifies the communication medium. The most commonly
    used domains are PF_UNIX for local file system sockets and PF_INET for Internet
    connections. The "PF" stands for Protocol Family.


    The domain determines the format of the socket name or address. PF_INET, the address
    is AF_INET and is in the form of a dotted quad. "AF" stands for Address Family.
    Generally there is a 1 to 1 correspondence between AF_ values and PF_ values.
    A network computer may support many different network services. A specific service
    is identified by a "port number". Established network services like ftp, http,
    etc have defined port numbers, usually below 1024. Local services may use port
    numbers above 1023.


    Some domains, PF_INET for example, alternate communication mechanisms. SOCK_STREAM
    is a sequenced, reliable, connection-based, two-way byte stream. The basis is
    for TCP and is the default for PF_INET domain sockets. SOCK_DGRAM is a datagram
    service. It is used to send relatively small messages with no guarantee that they
    will be delivered or that they won''t be reordered by the network. This is the
    basis of UDP. SOCK_RAW allows a process to access the IP protocol directly. This
    can be useful for implementing new protocols directly in User Space.


    The protocol is usually determined by the socket domain and you don''t have a
    choice. So the protocol argument is usually zero.


