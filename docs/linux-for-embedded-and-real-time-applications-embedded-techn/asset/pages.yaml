    # init_module() and cleanup_module()


    Let''s start near the end of the file with the init_module() function. The first
    thing the driver must do is gain exclusive access to the relevant I/O ports. First
    we check that the range of interest is not being used with a call to check_region().
    If that succeeds, we get the ports with a call to request_region().


    For the parallel port BASE represents the data register and is normally 0x378.
    BASE + 1 is the status register. For the thermostat example, the data port will
    drive a pair of LEDs representing the heater and the alarm. The status port will
    monitor a set of pushbuttons that allow us to raise or lower the measured "temperature."


    Finally, we register the device driver with a call to register_chrdev(). The arguments
    are:


    +   - A major device number, in this case 6. 6 happens to be the major device
    number normally used by the parallel port device driver.

    - A pointer to a file_operations structure. This contains pointers to the functions
    that implement the driver API for this device. The file_operations structure is
    just above init_module(). Our driver is quite simple and only implements four
    of the driver functions. The kernel takes some default action for all of the driver
    functions that are specified as NULL. register_chrdev() puts the file_operations
    pointer in chrdev[major], in this case chrdev[6].

    - A name. The principal purpose of the name is to create a mnemonic association
    with the major device number. The name shows up in /proc/devices file.


    If init_module() succeeds, the return value is zero. A non-zero return value indicates
    an error condition and the module is not loaded. Note that if init_module() fails,
    any resources successfully allocated up to the point of failure must be returned
    before exiting. In this case, failure to register the device requires us to release
    the I/O region.'
