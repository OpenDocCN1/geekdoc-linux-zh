    # printk


    Personally I''ve never been a big fan of the printf debugging strategy. On occasion
    it''s proven useful but more often than not the print statement just isn''t in
    the right place. So you have to move it, rebuild the code and try again. I find
    it much easier to probe the code and data with a high quality source level debugger.


    Nevertheless, it seems that many Unix/Linux programmers rely heavily on printf
    and its kernel equivalent printk. At the kernel level this makes good sense. Keep
    in mind, of course, that printk encara a performance hit.


    While printk statements are useful during development, they should probably be
    taken out before shipping production code. Of course as you take them out, someone
    will discover a bug or you will add a new feature and you''ll need them back again.
    An easy way to manage this problem is to encapsulate the printk''s in a macro
    as illustrated in Listing 6-1.


    # Listing 6-1


    ```

    #ifndef DEBUG

    #define PDEBUG(fmt, args...) printk (<1> fmt, ## args)

    #else

    #define PDEBUG(fmt, args...) // nothing

    #endif

    ```


    While you''re debugging, define the DEBUG macro on the compiler command line.
    When you build production code, DEBUG is not defined and the printk statements
    are compiled out.


