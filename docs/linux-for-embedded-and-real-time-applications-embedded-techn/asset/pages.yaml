- pgno: 120
  md: '# Embedded Networking


    Next, the server creates a connection queue with the listen(1) service and then
    waits for client connection requests with the accept() service. When a connection
    request is received successfully, accept() returns a new socket, which is used
    for this connection''s data transfer. The server now transfers data using standard
    read() and write() calls that use the socket descriptor in the same manner as
    a file descriptor. When the transaction is complete, the newly created socket
    is closed.


    The server may very well spawn a new process to service the connection while it
    goes back and waits for additional client requests. This allows a server to serve
    multiple clients simultaneously. Each client request spawns a new process with
    its own socket.


    # The Client Process


    Figure 7-2 shows the client side of the transaction. The client begins by creating
    a socket and naming it to match the server''s publicly advertised name. Next,
    it attempts to connect() to the server. If the connection request succeeds, the
    client proceeds to transfer data using read() and write() calls with the socket
    descriptor. When the transaction is complete, the client closes the socket.


    If the server spawned a new process to serve this client, that process should
    go away when the client closes the connection.


    ![](img/e081ebf3b04d47734031d23bd4787db5_120_0.png)


    Figure 7-2: The Client Process'
