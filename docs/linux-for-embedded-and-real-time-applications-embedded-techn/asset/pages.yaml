- pgno: 193
  md: '# Linux for Embedded and Real-time Applications


    Mutex attributes follow the same basic pattern as thread attributes. There is
    a pair of functions to create and destroy a mutex attribute object. The only mutex
    attribute in RTAI Pthreads is a Linux-specific nonportable extension called "kind.\
    The Pthreads standard explicitly allows nonportable extensions. The only requirement
    is that any symbol that is nonportable have "_np" appended to its name, as shown
    here.


    What happens if a thread attempts to lock a mutex that it has already locked?
    Normally the thread would simply hang up. Linux offers a way out of this dilemma.
    The "kind" attribute alters the behavior of a mutex when a thread attempts to
    lock a mutex that it has already locked:


    Fast – This is the default type. If a thread attempts to lock a mutex it already
    holds is blocked and thus effectively deadlocked. The fast mutex does no consistency
    or sanity checking and thus it is the fastest implementation.


    Recursive – A recursive mutex allows a thread to successfully lock a mutex multiple
    times. It counts the number of times the mutex was locked and requires the same
    number of calls to the unlock function before the mutex goes to the unlocked state.


    Error checking – If a thread attempts to recursively lock an error-checking mutex,
    the lock function returns immediately with the error code EDEADLK. Furthermore,
    the unlock function returns an error if it is called by a thread other than the
    current owner of the mutex.


    Note the "_NP" in the constant names.


    Optionally, a Pthreads mutex can implement the priority inheritance or priority
    ceiling protocols to avoid priority inversion as discussed in Chapter 8. The mutex
    attribute protocol can be set to "none," "priority inheritance" or "priority ceiling."
    The priorityceiling attribute sets the value for the priority ceiling. The protocol
    and priorityceiling attributes are not available in RTAI Pthreads.'
  merge: -1
  img_proc: true
- pgno: 194
  md: '# Communication—Condition Variables


    There are many situations where one thread needs to notify another thread about
    a change in status to a shared resource protected by a mutex. Consider the situation
    in Figure 11-1 where two threads share access to a queue. Thread 1 reads the queue
    and Thread 2 writes it. Clearly each thread requires exclusive access to the queue
    and so we protect it with a mutex.


    ![](img/e081ebf3b04d47734031d23bd4787db5_194_0.png)


    Figure 11-1: Condition Variable


    Thread 1 will lock the mutex and then see if the queue has any data. If it does,
    Thread 1 reads the data and unlocks the mutex. However, if the queue is empty,
    Thread 1 needs to block somewhere until Thread 2 writes some data. Thread 1 must
    unlock the mutex before blocking or else Thread 2 would not be to write. But there''s
    a gap between the time Thread 1 unlocks the mutex and blocks. During that time,
    Thread 2 may execute and not recognize that anyone is blocking on the queue.


    The condition variable solves this problem by waiting (blocking) with the mutex
    locked. Internally, the conditional wait function unlocks the mutex, allowing
    Thread 2 to proceed. When the condition wait returns, the mutex is again locked.'
  merge: -1
  img_proc: true
