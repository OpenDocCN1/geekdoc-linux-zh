  md: '# Linux for Embedded and Real-time Applications


    In practice, most systems incorporate a specialized peripheral called an Interrupt
    Controller to manage putting the vector index on the data bus at the correct time.
    The PC architecture includes two 8259 Interrupt Controllers, each able to handle
    up to eight interrupt inputs. The 2259 provides a mechanism to prioritize interrupts
    so that more important or critical devices have precedence over less important
    devices.


    Interrupts may also be enabled or disabled. At the processor level, interrupts
    may be globally enabled or disabled via the STI and CLI instructions. Individual
    interrupts may be selectively enabled and disabled either at the 8259 Interrupt
    Controller or at the device itself. In fact the ability to enable and disable
    interrupts is crucial to the design and implementation of real-time software.


    Not surprisingly, asynchronous interrupts are not without their problems. Consider
    a data acquisition application based on a multi-channel A/D converter as shown
    in Figure 8-5. Each time the A/D converter takes a set of readings on all channels,
    it interrupts the processor. The ISR reads the data and stores it in a memory
    buffer where it is available to the background main program.


    # Data Acquisition System


