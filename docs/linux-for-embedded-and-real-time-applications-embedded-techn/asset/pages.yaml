    # Module rtai_fifos


    #include <rtai_fifos.h>

    rtai_fifos provides a point-to-point sequenced mechanism for communicating between
    Kernel Space real-time tasks and User Space processes. The Kernel Space API is
    described here. User Space processes treat RTAI FIFOs as character devices /dev/rtfn.
    These devices are accessed from User Space using the normal open(), read() and
    write() system calls.


    Reading and writing to fifos in Kernel Space is non-blocking.


