  md: '# Linux for Embedded and Real-time Applications


    operations like move, copy, delete, rename, etc, drag-and-drop beats the miserably
    obscure Unix commands hands down. I also refuse to touch text-based editors like
    vi and emacs. Sure they''re powerful if you can remember all the obscure Unix
