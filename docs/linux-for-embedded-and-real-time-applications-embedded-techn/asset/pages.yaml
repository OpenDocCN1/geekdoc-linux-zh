  md: '# Linux for Embedded and Real-time Applications


    | Resource | Task 2 | Task 1 |

    |---|---|---|

    | Task 1 (priority 1) | Int Pend | |

    | Task 2 (priority 3) | Pend Post | Int Block |


    Priority Inversion!


    Figure 8-16: Priority Inversion Timeline


    Since the resource is held by Task 2, Task 1 blocks and Task 2 regains control.
    So everything is working as we would expect. Even though Task 1 has higher priority,
    it simply has to wait until Task 2 is finished with the resource.


    The problem arises if Task 3 should become ready while Task 2 has the resource
    locked. Task 3 preempts Task 2. This situation is called priority inversion because
    a lower priority task (Task 3) is effectively preventing a higher priority task
    (Task 1) from executing.


    A common solution to this problem is to temporarily raise the priority of Task
    2 as soon as Task 1 pends on the semaphore. Now Task 2 can''t be preempted by
    anything of lower priority than Task 1. This is called priority inheritance. If
    a kernel makes a distinction between a semaphore and a mutex, the latter will
    usually incorporate priority inheritance as an optional configuration parameter
    when the mutex is created.


    Another approach, called priority ceiling, raises the priority of Task 2 to a
    specified value higher than that of any task that may pend on the mutex as soon
    as Task 2 gets the mutex. This is considered to be more efficient because it eliminates
    unnecessary context switches. No task needing the resource can preempt the task
    currently holding it.


