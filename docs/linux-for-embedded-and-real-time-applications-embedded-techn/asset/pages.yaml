    # Intertask Communication and Synchronization


    RTAI includes an extensive set of mechanisms to facilitate communication and synchronization
    among Kernel Space tasks. These include:


    +   - Semaphores - Conventional counting semaphores as described in Chapter 8.
    The semaphore operations are signal and wait.

    - Mailboxes - RTAI mailboxes are much like the queues described in Chapter 8.
    The mailbox is created with arbitrary size and arbitrary quantities of data can
    be written to and read from a mailbox.'
