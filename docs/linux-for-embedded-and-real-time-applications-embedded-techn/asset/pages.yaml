    # Problems with Solving the Resource Sharing Problem—Priority Inversion


    Using semaphores to resolve resource conflicts can lead to subtle performance
    problems. Consider the scenario illustrated in Figure 8-15. Tasks 1 and 2 each
    require access to a common resource protected by a semaphore. Task 1 has the highest
    priority and Task 2 has the lowest. Task 3, which has no need for the resource,
    has a “middle” priority.


    ![](img/e081ebf3b04d47734031d23bd4787db5_154_0.png)


    Figure 8-15: Priority Inversion Scenario


    Figure 8-16 is an execution timeline of this system. Assume Task 2 is currently
    executing and pends on the semaphore. The resource is free so Task 2 gets it.
    Next an interrupt occurs that makes Task 1 ready. Since Task 1 has higher priority,
    it preempts Task 2 and executes until it pends on the resource semaphore.'
