- pgno: 86
  md: '# The Host as a Debug Environment


    Although remote debugging gives us a pretty good window into the behavior of our
    program on the target, there are still reasons why it might be useful to do initial
    debugging on our host development machine. To begin with, the host is available
    as soon as the project starts, probably well before any real target hardware is
    available or working. The host has a file system that can be used to create test
    scripts and document results.


    Of course, in order to use this technique, you must have both target and host
    versions of your operating system. In our current BlueCat environment that''s
    not a problem since both the host and target are x86. But even if the target is
    different, with Linux it is not a problem since we have the source code by definition.


    When you characterize the content of most embedded software, you will usually
    find something like 5% of the code deals directly with the hardware. The rest
    of the code is independent of the hardware and therefore shouldn''t need hardware
    to test it, provided that you can supply the appropriate stimulus to execute it.


    Unfortunately, all too often the 5% of hardware-dependent code is scattered randomly
    throughout the entire system. In this case you''re virtually forced to use the
    target for testing because it is so difficult to "abstract out" the hardware-dependent
    dependencies. The key to effective host-level testing is rigorous software structure.
    Specifically, you need to isolate the hardware-dependent code behind a clearly
    defined API that deals with the hardware at a higher, more abstract level. This
    is not hard to do but it does require some planning.


    If your hardware-dependent code is carefully isolated behind a well-defined API
    and confined to one or two source code modules, you can substitute a simulation
    of the hardware-dependent code that uses the host''s keyboard and screen for I/O.
    In effect, the simulated driver "feels" the application into thinking the hardware
    is really there.


    You can now exercise the application by providing stimulus through the keyboard
    and noting the output on the screen. In later stages of testing you'
  merge: -1
  img_proc: true
- pgno: 87
  md: '# Linux for Embedded and Real-time Applications


    may want to substitute a file-based "script driver" for the screen and keyboard
    to create reproducible cases.


    Think of this as a "test scaffold" that allows you to exercise the application
    code in a well-behaved, controlled environment. Among other things, you can simulate
    limit conditions that may be very difficult to create, and even harder to reproduce,
    on the target hardware.


    # The "Thermostat" Example


    While the shellshort program might be interesting, it has little to do with real
    embedded system problems. Here is a sample program closer to the real world that
    we''ll use for the remainder of this chapter and on and off throughout the rest
    of the book.


    cd /opt/BlueCat/demo/bookdemo/thermostat and open the file thermostat.c with an
    editor. This is a simple implementation of a thermostat. If the measured temperature
    drops below a specified setpoint, a "heater" turns on. When the temperature rises
    above the setpoint the heater turns off. In practice, real thermostats incorporate
    hysteresis that prevents the heater from rapidly switching on and off when the
    temperature is right at the setpoint. This is implemented in the form of a "deadband"
    such that the heater turns on until the temperature reaches setpoint + deadband
    and doesn''t turn off until the temperature reaches setpoint + deadband. Additionally,
    the program includes an "alarm" that flashes if the temperature exceeds a specified
    limit.


    thermostat.c is fundamentally a state machine that manipulates two digital outputs
    in response to an analog input and the current state of the program. Note in particular
    that thermostat.c makes no direct reference to any I/O device. The analog input
    and digital outputs are virtualized through a set of "device driver" functions.
    This allows us to have one set of driver functions that work in the host simulation
    environment (simdrive.c) and another set that work on the target (trdrive.c).


    For our purposes the driver API (Application Programming Interface) is fairly
    simple and includes the following functions:'
