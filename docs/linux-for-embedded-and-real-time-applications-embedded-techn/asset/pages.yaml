- pgno: 240
  md: '# APPENDIX B


    # Posix Threads (Pthreads) Application Programming Interface


    This is a summary of the features of Posix 1003.1c-1995 supported under RTAI.


    Unless indicated otherwise, all Pthreads functions return an integer status code
    where zero indicates the function succeeded and a negative number indicates an
    error condition. Pthreads makes a distinction between two categories of errors:


    +   1. Mandatory (“if occurs”) errors involve circumstances beyond the programmer.
    You wouldn’t be expected to know, for example, or be able to determine, that there
    isn’t sufficient virtual memory to create a new thread. So the system must always
    detect and report this kind of error.


    +   2. Optional (“if detected”) errors are conditions that are usually your mistake.
    Attempting to lock a mutex that hasn''t been initialized or trying to unlock a
    mutex that is locked by another thread are examples of this category. It may simply
    be too expensive in terms of processor time or other system resources to detect
    and report all of these potential error conditions. A competent programmer should
    be able to detect and solve these problems without help from the system.


    Some systems may provide a “debugging” mode that turns on some or all of these
    optional errors while you’re developing code. When production code is ready for
    release, you turn off the debugging mode.'
  merge: -1
  img_proc: true
