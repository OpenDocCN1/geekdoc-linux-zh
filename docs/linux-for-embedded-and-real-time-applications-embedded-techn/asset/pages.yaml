    to be invoked. There are two considerations here:


    +   - The ISR must not call any service that would cause a task to block, i.e.,
    MbxPend.


    +   - Generally, the scheduler can''t be invoked directly from within an ISR because
    the system is in a different context.


    Fundamentally, this means the kernel needs to know when it''s running in ISR context
    rather than task context.


    There are two approaches to managing interrupts. I choose to call them the "direct"
    and "indirect" methods. The top half of Figure 8-17 shows the direct method where
