    execution and invokes another stream of instructions that services the event as
    illustrated in Figure 8-1. When servicing is complete, control returns to where
    the original instruction stream was interrupted. Servicing the event happens “right
    now” and doesn''t have to wait for the main program to “get around to it.” The
    interrupt stream that services the event is called an “Interrupt Service Routine”
    or ISR.


    ![](img/e081ebf3b04d47734031d23bd4787db5_133_0.png)


    Figure 8-1: The Interrupt


    Most modern processors implement three distinct types of interrupt:


    +   - INT instruction, sometimes called a TRAP. This is like a subroutine call
    with one important difference as we''ll see shortly.

    - Processor exceptions. Fault conditions like divide by 0 or illegal memory reference
    can be handled through the interrupt mechanism.


    These two forms of interrupt are synchronous with respect to instruction execution.
    That is, INT is an instruction and fault exceptions are the direct result of instruction
    execution. The third type of interrupt is generated by events that occur external
    to the processor. These are generated by the input/output hardware and occur asynchronously
    with respect to instruction execution.


