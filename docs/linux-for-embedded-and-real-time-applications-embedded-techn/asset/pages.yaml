    In a true production kernel you would also want to remove loadable module support
    from the kernel to reduce size.


    # An Alternative—uCLinx


    Much of the complexity and runtime overhead of conventional Linux device drivers.
    In calling a device driver, the system switches from User Space to Kernel Space
    and back again. Data to be transferred to/from to a peripheral device must be
    copied from/to User Space. All of this chews up run time.


    uCLinx is a variant of Linux designed to run on processors without memory management.
    The uC stands for microcontroller. Without memory management there''s no User
    Space and Kernel Space, no privilege levels. Everything runs in one flat memory
    space effectively at Privilege Level 0. There''s no virtual memory and no swapping.'
