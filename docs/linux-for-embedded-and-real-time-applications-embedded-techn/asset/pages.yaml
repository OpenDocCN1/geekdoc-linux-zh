- pgno: 275
  md: '# # Linux for Embedded and Real-time Applications


    In some ways, Linux is the exact antithesis of an embedded/real-time operating
    system, but it offers a number of advantages--the least of which is the fact that
    it''s free and the source code is open and available. Linux is rapidly growing
    in popularity with embedded programmers and engineers, but information can be
    tough to locate. This practical, hands-on guide by a noted embedded systems programmer
    and author solves that problem. In these pages, Abbott covers the many issues
    concerning Linux in the embedded space provides different approaches to giving
    the Linux kernel deterministic characteristics.


    You''ll find information on:


    +   * GNU

    * Configuring and building the kernel

    * BlueCat Linux

    * Debugging

    * Kernel modules

    * Device drivers

    * Embedded networking

    * Real-time programming tips and techniques

    * the RTAI environment

    * Pthreads

    * and much more!


    The accompanying CD-ROM contains all the source code, a searchable e-book version
    of the text, and other resources to help you get up-to-speed quickly. This is
    one reference you''ll reach for again again!


    Related Titles in our Embedded Technology Series


    +   * Embedded Microprocessor Systems, Third Edition

    Stuart Ball

    ISBN 0750675349

    * Embedded Systems Design, Second Edition

    Steve Heath

    ISBN 0750655461

    * Designing Embedded Internet Devices

    Brian DeMath and Dan Eisenreich

    ISBN 1878070574

    * Embedded FreeBSD Cookbook

    Paul Clevi

    ISBN 1589950046

    * Programming PIC Microcontrollers with PICBasic

    Chuck Hellebouck

    ISBN 1589950011

    * Embedded Microcontrollers in C, Second Edition

    Ted VanSickle

    ISBN 1878070574


