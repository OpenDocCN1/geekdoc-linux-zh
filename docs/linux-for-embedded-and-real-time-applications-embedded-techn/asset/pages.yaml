- pgno: 14
  md: '# CHAPTER 1


    # The Embedded and Real-time Space


    # What Is Embedded?


    You''re at a party when an attractive member of the opposite sex approaches and
    asks you what you do. You could flip and say something “as little as possible,”
    but eventually the conversation will get around to the fact that you write software
    for embedded systems. Before your new acquaintance starts scanning the room for
    a lawyer or doctor to talk to, you''d better come up with a captivating explanation
    of embedded systems.


    I usually start by saying that an embedded system is a device that has a computer
    inside it, but the user of the device doesn''t necessarily know, or care, that
    the computer is there. It''s hidden. The example I usually give is the engine
    control computer in your car. You don''t drive the car any differently because
    the engine happens to be controlled by a computer. In fact the typical car today
    has more raw computing power than the Lunar Lander. You can then go on to point
    out that there a lot lot embedded computers in the world than there are PCs—by
    at least an order of magnitude. The average house contains perhaps a couple dozen
    computers even if it doesn''t have a PC.


    From the viewpoint of programming, embedded systems show a number of significant
    differences from conventional “desktop” applications. For example, most desktop
    applications deal with a fairly predictable set of I/O devices—a disk, graphic
    display, a keyboard, mouse, sound card, perhaps a network interface. And these
    devices are generally well supported by the'
  merge: -1
  img_proc: true
- pgno: 15
  md: '# Linux for Embedded and Real-time Applications


    operating system. The application programmer doesn''t need to pay much attention
    to them.


    Embedded systems on the other hand often incorporate a wider variety of input/output
    devices than typical desktop computers. A system may include user I/O in the form
    of switches, pushbuttons and various types of displays. It may have one or more
    communication channels, either asynchronous serial or network ports. It may implement
    data acquisition and control in the form of analog-to-digital (A/D) and digital-to-analog
    (D/A) converters. These devices seldom have the kind of operating system support
    that application programmers are accustomed to. The embedded systems programmer
    often has to deal directly with the hardware.


    # What Is Real-time?


    Real-time is harder to explain. The basic idea behind real-time is that we expect
    the computer to respond to its environment in time. Many people assume that real-time
    means real fast. Not true. Real-time simply means fast enough in the context with
    which the system is operating. If we''re talking about the computer that runs
    your car''s engine, that''s fast! That guy has to make decisions—about fuel flow,
    spark timing—every time the engine makes a revolution.


    On the other hand, consider a chemical refinery controlled by one or more computers.
    The computer system is responsible for controlling the process and detecting potentially
    destructive malfunctions. But chemical processes have a time constant in the range
    of seconds to minutes at the very least. So we would assume that the computer
    system should be able to respond to any malfunction in sufficient time to avoid
    a catastrophe. But suppose the computer were in the midst of printing an extensive
    report about last week''s production when the malfunction occurred. How soon would
    it be able to respond to the potential emergency?


    The essence of real-time computing is not only that the computer responds to its
    environment fast enough, but that it responds reliably fast enough. The engine
    control computer must be able to adjust fuel flow and spark timing'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'every time the engine turns over. If it''s late, the engine doesn''t perform
    right. The controller of a chemical plant must be able to detect and respond to
    abnormal conditions in sufficient time to avoid a catastrophe. If it doesn''t,
    it has failed.


    So the art of real-time programming is designing systems that reliably meet timing
    constraints in the midst of random asynchronous events. Not surprisingly, this
    is easier said than done and there is an extensive body of literature and development
    devoted to the theory of real-time systems.


    # How and Why Does Linux Fit in?


    By now just everyone in the computer business knows the history of Linux: how
    Lin Torvalds started it all in 1991 as a simple hobby project to which he invited
    other interested hackers to contribute. Back then no one could have predicted
    that this amorphous consortium of volunteer programmers and the occasional loon,
    connected only by the Internet, would produce a credible operating system to compete
    with even the Borg of Redmond.


    Of course, Linux developed as a general-purpose operating system in the model
    of Unix whose basic architecture it emulates. No one would suggest that Unix is
    suitable as an embedded operating system. It''s big, it''s a resource hog and
    its scheduler is based on "fairness" rather than priority. In short, it''s the
    exact antithesis of an embedded operating system.


    But Linux has several things going for it earlier versions of Unix lack. It''s
    free and you get the source code. There is a large and enthusiastic community
    of Linux developers and users. There''s a good chance that someone else is working
    or has worked on the same problem you''re facing. It''s all out there on the web.
    The trick is finding it.


    # Open Source


    Linux has been developed under the philosophy of Open Source software pioneered
    by the Free Software Foundation. Open Source is based on the notion that software
    should be freely available: to use, to modify, to copy.'
  merge: -1
  img_proc: true
- pgno: 17
  md: '# Linux for Embedded and Real-time Applications


    There are a number of misconceptions about the nature of Open Source software.
    Perhaps the best way to explain what it is is to start by talking about what it
    isn''t.


    +   - Open Source is not shareware. A precondition for the use of shareware is
    that you pay the copyright holder a fee. Open source code is freely available
    and there is no obligation to pay for it.


    +   - Open Source is not "public domain." Public domain code, by definition, is
    not copyrighted. Open Source code is copyrighted by its author who has released
    it under the terms of the GNU General Public License (GPL). The copyright owner
    gives you the right to use the code you adhere to the terms of the GPL.


    +   - Open Source is not necessarily free of charge. Having said that there''s
    no obligation to pay for Open Source software doesn''t preclude you from charging
    a fee to package and distribute it. A number of companies are in the specific
    business of selling packaged "distributions" Linux.


    Why would you pay someone for something you can get for free? Presumably because
    everything is in one place and you can get some support from the vendor. Of the
    quality of support greatly depends on the vendor.


    So "free" refers to freedom to use the code and not necessarily zero cost. Think
    "free speech," not "free beer."


    Open Source code is:


    +   - Subject to the terms of the GNU Public License (see below).


    +   - Subject to critical peer review. As an Open Source programmer, your code
    is out there for everyone to see and the Open Source community tends to be a very
    critical group. Open Source code is subject to extensive testing and peer review.
    It''s a Darwinian process in which only the best code survives. "Best" of course
    is a subjective term. It may be the best technical solution but it may also be
    completely unreadable.'
  merge: -1
  img_proc: true
- pgno: 18
  md: '+   - Highly subversive. The Open Source movement subverts the dominant paradigm,
    which says that intellectual property such as software must be jealously guarded
    so you can make a lot of money off it. In contrast, the Open Source philosophy
    is that software should be freely available to everyone for the maximum benefit
    of society. Richard Stallman, founder of the Free Software Foundation, is particularly
    vocal in advocating that software should not have owners (see Appendix C).


    Not surprisingly, Microsoft sees Open Source as a serious threat to its business
    model. Microsoft representatives have gone so far as to characterize Open Source
    as “un-American.” On the other hand, many leading vendors of Open Source give
    their programmers and engineers company time to contribute to the Open Source
    community. And it’s not just charity, it is good business.


    # The GNU Public License (GPL)


    Open source is released according to the terms of the GNU Public License, GPL.
    Unlike most End User License Agreements (EULA) for software, whose motivation
    is to restrict your rights, the GPL is intended to guarantee your rights to use,
    modify and copy the subject software. Along with the rights comes an obligation.
    If you modify and subsequently distribute software covered by the GPL, you are
    obligated to make available the modified source code. The changes become a “derivative
    work” which is also subject to the terms of the GPL. This allows other users to
    understand the software better and to make further changes if they wish.


    This works well for most software but there is at least one problem. Suppose,
    for example, that you write a clever application that you wish to keep proprietary.
    If you link to a C library covered by the GPL, your application becomes a derivative
    work and thus you’re required to distribute your source code.


    To get around this, and therefore promote the development of Open Source libraries,
    the Free Software Foundation came up with the “Library GPL.” The'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# Linux for Embedded and Real-time Applications


    distinction is that a program linked to a library by the LGPL is not considered
    a derivative work and so there''s no requirement to distribute the source, although
    you must still distribute the source to the library itself.


    Subsequently, the LGPL became known as the “Lesser GPL” because it offers less
    freedom to the user. So while the LGPL makes it possible to develop proprietary
    products using Open Source software, the FSF encourages developers to place their
    libraries under the GPL in the interest of maximizing openness.


    # Portable and Scalable


    Linux was originally developed for the Intel x86 family of processors and most
    of the ongoing kernel development work continues to be on x86s. Nevertheless,
    the design of the Linux kernel makes a clear distinction between processor-dependent
    code that must be modified for each different architecture, and code that can
    be ported simply by recompiling it. Consequently, Linux has been ported to a wide
    range of processor architectures:


    +   - Motorola 68k and its many variants

    - Alpha

    - Power PC

    - ARM

    - SPARC

    - MIPS


    to name just a few. So whatever 32-bit architecture you''re considering for your
    embedded project, chances there''s a Linux port available for it and a community
    of developers supporting it.


    A typical desktop Linux installation runs into several hundred megabytes of disk
    space and requires 32 megabytes of RAM to execute decently. By contrast, embedded
    targets are often limited to perhaps eight or 16 megabytes of RAM and a few megabytes
    of ROM or flash. Fortunately, Linux is highly'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# The Embedded and Real-time Space


    modular Much of that several hundred megabytes represents documentation utilities
    and options like games that simply aren''t necessary in embedded targets. It is
    not difficult to produce a fully functional, if limited Linux system occupying
    more than 2 megabytes of flash memory.


    The kernel itself is highly configurable and includes reasonably user-friendly
    tools that allow you to remove kernel functionality not required in your application.


    # Resources


    Linux resources on the web are extensive. This is a list of some sites that are
    of particular interest to embedded developers.


    linuxdev.com - A news and portal site devoted to the entire range of issues surrounding
    embedded Linux.


    embedded-linux.org - The Embedded Linux Consortium, a nonprofit, vendor-neutral
    trade association promoting Linux in the embedded space. Its major effort at present
    is the development of an embedded Linux platform specification.


    kernel.org - The Linux kernel archive. This is where you can download the latest
    kernel versions as well as virtually any previous version.


    sourceforge.net - "World''s largest Open Source development website." It provides
    free services to open source developers including project hosting and management,
    version control, bug and issue tracking, backups and archives, and communication
    and collaboration resources.


    embedded.com - The website for the Embedded Systems Programming magazine. This
    site is not specifically oriented to Linux, but is quite useful as a more general
    embedded information tool.'
  merge: -1
  img_proc: true
