- pgno: 158
  md: '# Introduction to Real-time Programming


    Disable interrupts


    Enable interrupts


    The performance of a real-time operating system is often characterized in terms
    of its interrupt latency, the maximum time from an external interrupt is asserted
    until the ISR begins executing. Interrupt latency is largely determined by the
    kernel''s critical sections. That is, how long does the kernel leave interrupts
    disabled? Consequently, kernel developers devote considerable effort to keeping
    the critical sections as short as possible.


    It is sometimes useful to implement critical sections in application tasks. Suppose
    two tasks share access to a global 32-bit counter where one task reads the counter
    and the other increments it. Incrementing the counter must be done atomically,
    but on an 8- or 16-bit processor incrementing a 32-bit memory variable requires
    multiple instructions.


    We could use a semaphore to protect the counter, but the overhead of the semaphore
    operations is probably orders of magnitude greater than the time needed to increment
    the counter. The more expedient solution is to simply:


    ```

    EnterCritical();

    counter++;

    ExitCritical();

    ```


    As long as your critical sections are no longer than the longest critical section
    in the operating system, then your code is not affecting maximum latency.


