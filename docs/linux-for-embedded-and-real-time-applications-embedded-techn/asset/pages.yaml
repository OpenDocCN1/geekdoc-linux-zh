  md: '# CHAPTER 9


    # # Linux and Real-time


    # ### Why Linux Isn’t Real-time


    Linux was conceived and built as a general-purpose multiuser operating system
    in the model of Unix. The goals of a multiuser system are generally in conflict
    with the goals of real-time operation. General-purpose operating systems are tuned
    to maximize average throughput even at the expense of latency, while real-time
    operating systems attempt to minimize, and place an upper bound on, latency, sometimes
    at the expense of average throughput.


    There are several reasons why standard Linux is not suitable for real-time use:


    +   - Coarse-grained Synchronization” – This is a fancy way of saying that kernel
    system calls are not preemptive. Once a process enters the kernel, it can''t be
    preempted until it''s ready to exit the kernel. If an event occurs while the kernel
    is executing, the process waiting for that event can''t be scheduled until the
    currently executing process exits the kernel. Some kernel calls, fork() for example,
    can hold off preemption for tens of milliseconds.


    +   - Paging – The process of swapping pages in and out of virtual memory is,
    for all practical purposes, unbounded. We have no way of knowing how long it will
    take to get a page off a disk drive and so we simply can''t place an upper bound
    on the time a process may be delayed due to a page fault.'
  merge: -1
  img_proc: true
- pgno: 161
  md: '# Linux for Embedded and Real-time Applications


    +   - “Fairness” in Scheduling – Reflecting its Unix heritage as a multi-user
    time-sharing system, the conventional Linux scheduler does its best to be fair
    to all processes. Thus, the scheduler may give the processor to a low-priority
    process that has been waiting a long time even though a higher-priority process
    is ready to run.


    +   - Request Reordering – Linux reorders I/O requests from multiple processes
    to make more efficient use of hardware. For example, hard disk block reads from
    a lower priority process may be given precedence over requests from a higher priority
    process in order to minimize disk movement or improve chances of error recovery.


    +   - “Batching” – Linux will batch operations to make more efficient use of resources.
    For example, instead of freeing one page at a time when memory gets tight, Linux
    will run through the list of pages, clearing out as many as possible, delaying
    the execution of all processes.


    You have probably already noticed the consequences of these issues using Linux
    or even Windows on your PC. Try moving the mouse while executing a compute-intensive
    function like rendering a complex graphics image, or while connecting to a dial-up
    link. The mouse occasionally stops and jumps because the computer or I/O-bound
    process has the CPU locked up. In a desktop environment this is nothing more than
    irritating. In a real-time environment it’s unacceptable and may even be catastrophic.


    The net effect of all these characteristics is that we can’t put an upper bound
    on the latency that a user task or process may encounter. By definition this is
    not real-time.


