- pgno: 138
  md: '# Introduction to Real-time Programming


    Interrupt-driven operation allows us to respond to the A/D quickly while the memory
    buffer effectively “decouples” the background program from the data source—i.e.,
    the background program doesn''t need to know where the data comes from.


    Consider the code fragment shown in Figure 8-5. Let us say that for testing purposes,
    we feed the same continuously varying signal into both channels 5 and 6. We would
    assume that the program would never fail since both channels are measuring the
    identical signal.


    In fact, the program as written is guaranteed to fail because an interrupt can
    occur between the update of Cur_temp and the update of Set_temp with the value
    for Cur_temp comes from the previous data set while the value for Set_temp comes
    from the current data set. Since the input signal is varying over time and the
    two data sets are separated by a finite time, the values will be different and
    the program will fail.


    This is the essence of the real-time programming problem; managing asynchronous
    interrupts so they don''t occur at inconvenient times.


    There is a simple, albeit inelegant, solution to the problem. We can put a Disable
    Interrupt (CLI) instruction before the update of Cur_temp and an Enable Interrupt
    (STI) instruction after the update of Set_temp. This prevents the interrupt from
    interfering with the variable updates. It turns out that judicious use of STI
    and CLI is a key element of the “correct” solution but simply scattering STI and
    CLI throughout the code is like using go to''s or global variables. It''s just
    asking for trouble.


    # Tasks


    The “correct” solution is called multitasking, which has proven to be a powerful
    paradigm for structuring real-time, interrupt-driven systems. I would go so far
    as to suggest that multitasking is first and foremost a paradigm for safely and
    reliably handling asynchronous interrupts. The basic idea is that we can break
    a large problem down into a bunch of smaller, simpler problems. Each one of these
    sub-problems becomes a task. Each task does one thing to keep it simple. Then
    we pretend all of these tasks are running'
