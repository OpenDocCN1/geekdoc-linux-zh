    # Networking


    Your workstation is probably configured to get a network address via DHCP (Dynamic
    Host Configuration Protocol). But in our network consisting of just the workstation
    and the target, there is no DHCP server, so we need to specify fixed IP addresses
    for both ends.


    Network configuration parameters are found in /etc/sysconfig/network-scripts/
    where you should find a file named something like ifcfg-eth0 that contains the
    parameters for network adapter 0. Make a copy of this file and name it dhcp-ifcfg-eth0.
    That way you''ll have a DHCP configuration file for use if needed. Now open the
    original file with an editor (as root user of course). It should look something
    like Listing 4-1a. Delete the line BOPROTO="dhcp" and add the three new lines
    shown in Listing 4-1b. The network address 192.168.0.0 is a good choice here because
    it''s one of a range of network addresses reserved for local networks. For historical
    reasons, I choose 11 for my workstation.


    | DEVICE="eth0" |

    | ONBOOT="yes" |

    | BOOTPROTO="dhcp" |


    | DEVICE="eth0" |

    | ONBOOT="yes" |

    | IPADDR="192.168.0.11" |

    | NETMASK="255.255.255.255" |

    | BROADCAST="192.168.0.255" |


    Listing 4-1a: ifcfg-eth0


    Listing 4-1b: revised ifcfg-eth0'
