    # Timer Functions


    void rt_set_oneshot_mode(void);


    void rt_set_periodic_mode(void);


    rt_set_oneshot_mode sets the timer to one-shot timing mode. It consists in a variable
    timing based on the cpu clock frequency. This allows task to be timed arbitrarily.
    It must be called before using any time related function, including conversions.


    rt_set_periodic_mode sets the timer to periodic timing mode. It consists of a
    fixed frequency timing of the tasks in multiple of the period set with a call
    to start_rt_timer. The resolution is that of the 8254 frequency (119318 Hz). Any
    timing request not an integer multiple of the period is satisfied at the closest
    period tick. This is the default mode.


    One-shot mode can also be set initially with the OneShot command line parameter
    of the rtai_sched module


    > Note: Stopping the timer by stop_rt_timer sets the timer back into its default
    (periodic) mode. Call rt_set_oneshot_mode before each start_rt_timer if it required.


    RTIME start_rt_timer (int period);


    void stop_rt_timer(void);


    start_rt_timer starts the timer with a period period. The period is in internal
    count units and is required only for the periodic mode. In the one-shot parameter
    value is ignored.


