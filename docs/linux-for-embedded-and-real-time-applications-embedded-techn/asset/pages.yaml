    # Improving Linux Latency


    There are some things we can do to improve the latency of standard Linux. Specifically,
    we can change the kernel''s “scheduling policy” and process priority for the jitter
    process and we can lock the process''s memory image into RAM so it won''t be paged
    out.


    The default scheduling policy, called SCHED_OTHER, uses a fairness algorithm and
    gives all processes using this policy priority 0, the lowest priority. This is
    for “normal” processes. The alternate scheduling policies are SCHED_FIFO and SCHED_RR.
    These are intended for time-critical processes requiring lower latency. Processes
    using alternate scheduling policies must have a priority greater than 0. Thus,
    a process scheduled with SCHED_FIFO or SCHED_RR will preempt any running normal
    process when it becomes ready.'
