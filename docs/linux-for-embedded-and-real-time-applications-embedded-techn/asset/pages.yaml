  img_proc: true
- pgno: 204
  md: "# Posix Threads\n\n```\nmq_t mq_open(char *mq_name, int oflag, mode_t permissions,\
    \ struct mq_attr\n    *mq_attr);\nint mq_close(mq_t mq);\nint mq_unlink(char *mq_name);\n\
    \nsize_t mq_receive(mq_t mq, char *msg_buffer, size_t buflen, unsigned int *msgprio);\n\
    int mq_send(mq_t mq, const char *msg, size_t msglen, unsigned int msgprio);\n\
    int mq_notify(mq_t mq, const struct mq_attr sigevent *notification);\n```\n\n\
    The message queue API is relatively simple and straightforward. A message queue\
    \ is opened and closed much like a file. When you specify access mode and permissions\
    \ by including an attributes structure. The open function also has a Pthreads\
    \ flavor Closing a message queue does not destroy it but merely destroys the link\
    \ to it. The queue and any messages in it remain available to other links and\
    \ other threads that may open links to it.\n\nA queue is destroyed, and its resources\
    \ freed, by unlinking it. However, if there are any open links to the queue when\
    \ mq_unlink() is called, the queue is marked for destruction when the last link\
    \ is closed. Once a queue has been marked for destruction no further links may\
    \ be opened to it.\n\nThe operations on a queue are just receive and send. Both\
    \ operations are blocking unless the O_NONBLOCK flag is set when the link is opened.\
    \ Messages are placed in the queue in priority order. That is, a higher priority\
    \ message will be inserted ahead of a lower priority message already there. Messages\
    \ of equal priority are queued in FIFO order.\n\nmq_notify() allows a thread to\
    \ specify an asynchronous callback to be called when a message arrives in the\
    \ queue. The struct sigevent contains, among other things, a pointer to the function\
    \ to be called. RTAI implements mq_notify() for completeness but does not in fact\
    \ do asynchronous notification."
  merge: -1
  img_proc: true
- pgno: 205
  md: '# Linux for Embedded and Real-time Applications


    The message queue API takes a different approach to attributes than Pthreads.
    Rather than having a pair of get and set functions for each attribute, the attribute
    structure fields are made explicitly visible as shown in Listing 11-1. The pair
    of get and set attributes functions takes a pointer to this structure. When creating
    a queue you can specify the maximum size of a message and the maximum number of
    messages that the queue hold. Subsequently the only thing that can be changed
    by mq_set_attr() is the blocking behavior specified in mq_flags.


    # Listing 11-1: Message Queue Attribute Structure


    The RTAI message queue implementation is another good example of Pthreads programming.
    Have a look at /usr/src/rtai/posix/src/rtai_pqueue.c.


    # Suggestions for Further Exploration


    If you''ve managed to get data_acq_rt working and had a look at pqueue.c you''ve
    gained a pretty good understanding of the Posix features of RTAI. Consider hacking
    RTAI itself. Pthreads in RTAI 24.1.9 leaves out a number of useful features.


    +   - What would it take to implement the protocol attribute for mutexes? The
    basic issue here is changing a task''s priority. RTAI doesn''t provide an API
    for this so you would have to get into the guts of rtai_sched.c to understand
    how to do it.'
