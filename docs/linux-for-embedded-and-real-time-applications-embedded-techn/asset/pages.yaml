  md: '# Linux for Embedded and Real-time Applications


    2.4.18-rthal5 to reflect not only the kernel version, but the extensions that
    we are adding. Then create the following symbolic links:


    ```

    linux -> linux-2.4.18-rthal5

    rtai -> rtai-24.1.9

    ```


    The version numbering scheme used by RTAI reflects the base kernel version that
    the RTAI version applies to. Thus, the 24 in the RTAI directory name refers to
    kernel version 2.4.xx.


    # Patching and Building the Kernel


    RTAI requires changes to the base Linux source code. The mechanism for changing
    released source code in an orderly manner is the patch utility. The input to patch
    is a text file created by the diff utility that compares two files and reports
    any differences. When an Open Source programmer wants to distribute an upgrade
    to released source code, she does a diff between the modified code and the original
    code redirecting the output of diff to a file.


    The resulting file is called a “patch file.” When you want to implement the modifications
    on your system, you start with the same original source code and apply the patch.
    Distributing patch files is generally much more efficient than distributing the
    entire modified source tree.


    Take a look at rtai/patches/. It contains patch files for several kernel versions
    including ports for ARM, MIPS and Power PC. We''ll be using patch-2.4.18-rthal5g
    to patch the 2.4.18 kernel. Take a look at that file just to get a feel for what
    a patch file looks like.


    In a terminal window, become the Superuser and cd /usr/src/linux. Now execute
    the command


    ```

    patch -p1 < /usr/src/rtai/patches/patch-2.4.18-rthal5g

    ```


    will list the files it patched.

    The -p1 flag tells patch to remove one slash and everything before it from the
    names of files to be patched. The file names in patch-2.4.18-rthal5g all begin
    with “linux-2.4.18/”. Since we''re already in linux-2.4.18-rthal5/, we use -p1
    to remove the unnecessary directory information.'
