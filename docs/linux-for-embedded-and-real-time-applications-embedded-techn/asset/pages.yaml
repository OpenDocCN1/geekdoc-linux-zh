- pgno: 91
  md: '# Linux for Embedded and Real-time Applications


    Once you have the program built, try it out under DDD. Note that you''ll be using
    the same console device to enter the command string that thermostat uses to write
    out the current temperature. This results in a certain amount of interference.


    Once you''re satisfied with the program''s operation in the host, the next step
    is to build it for the target. We''ll do that in the next chapter.


    There is another, actually somewhat simpler, approach to creating a second thread
    of execution using Posix Threads. Whereas a process carries with it a complete
    execution context and full set of protected resources, a thread is a thread of
    execution only. The only resources a thread owns are code and a stack. The distinction
    is illustrated graphically in Figure 5-5. Note that multiple threads within a
    process share the process''s data space.


    # UNIX Process Model


    | DATA | DATA | DATA |

    |---|---|---|

    | CODE | CODE | CODE |


    # Multi-threaded Process


    | DATA |

    |---|

    | THREAD | THREAD | THREAD |

    | 1 | 2 | 3 |


    > Figure 5-5: "Processes" vs. "Threads"


    The thread API is actually more like traditional multitasking programming than
    the Linux fork() model. That is, you create a thread out of a function by calling
    a thread creation service. Creating a thread is generally a lower overhead operation
    than creating a process and threads are often characterized as "light-weight multitasking".'
