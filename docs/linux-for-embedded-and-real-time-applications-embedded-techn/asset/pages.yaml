  md: '# Linux for Embedded and Real-time Applications


    convention, network address 127.0.0.1 is a "local loopback" device. Processes
    can use this address in exactly the same way they use other network addresses.


    # Try out


    Execute the command /sbin/ifconfig. This will list the properties and current
    status of network devices in your system. You should see at least two entries:
    one for eth0, the Ethernet interface and the other for lo, the local loopback
    device.


    This command should work on both your development host and your target with similar
    results. ifconfig, with appropriate arguments, is also the command that sets network
    properties.


    # The Server Process


    Figure 7-1 illustrates the basic steps that the server process goes through to
    establish communication. We start by creating a socket and then bind() it to a
    name or destination address. For local sockets, the name is a file system entry
    often in /tmp tmp. For network sockets it is a service identifier consisting of
    a "dotted quad" Internet address (as in 192.168.0.11, for example) and a protocol
    port number. Clients use this name to access the service.


    ![](img/e081ebf3b04d47734031d23bd4787db5_119_0.png)


    Figure 7-1: The Server Process'
