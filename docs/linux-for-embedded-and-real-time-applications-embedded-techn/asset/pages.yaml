- pgno: 57
  md: '# Linux for Embedded and Real-time Applications


    make dep. This creates two files of dependencies among all of the source and header
    files for your configuration. The files are .depend and .hdepend.


    make clean. Deletes all intermediate files created by a previous build. This ensures
    that everything gets built with the current configuration options. You''ll find
    that virtually all Linux makefiles have a clean target.


    make bzimage. This is the heart of the matter. This task builds the executable
    kernel image. It takes a while. Not surprisingly, this resulting compressed kernel
    image is arch/$(ARCH)/bzimage.


    make modules. Builds all of the loadable kernel modules.


    make modules_install. Copies the modules to /lib/modules/<kernel_version> where
    <kernel_version> is the string identifying the specific kernel you are building.


    cp arch/$(ARCH)/bzimage /boot/vmlinuz-<kernel_version>. This copies the kernel
    image to the /boot directory. As written here, it assumes you''re currently in
    the directory /src/linux.


    cp System.map /boot/System.map-<kernel_version>. Copies the system map file to
    /boot.


    Note, incidentally, that the build process is recursive. Every subdirectory in
    the kernel source has its own Makefile dealing with the source files in that directory.
    The top level Makefile recursively invokes all of the sub Makefiles.


