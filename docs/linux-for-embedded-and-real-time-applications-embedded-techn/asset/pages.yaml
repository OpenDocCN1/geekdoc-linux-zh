- pgno: 117
  md: '# Linux for Embedded and Real-time Applications


    The lack of privilege levels and memory protection has several implications. First
    of all, any process can directly execute I/O instructions. This further implies
    that device drivers are not really necessary. Of course as a structuring and abstraction
    tool drivers are still useful, but now they can be as simple as functions linked
    directly to a process executable image.


    The other major consequence is that any process can bring down the whole system,
    just like kernel loadable modules in conventional Linux.


