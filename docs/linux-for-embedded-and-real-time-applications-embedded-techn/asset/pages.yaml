    # Making data_acq


    Have a look at the Makefile. Ignore the commented section; we''ll come back to
    that later. The logger target also is not relevant yet. Two libraries have been
    added to the compile command for data_acq with the "-l" option. The names are
    fairly obvious. The pthread library contains the Pthreads functions and curses
    are the curses library.


    There''s also a compile symbol, _REENTRANT. The original Linux library routines
    assumed that only a single thread of execution would be running in a process.
    An example of this assumption is the global variable errno. That works fine if
    there''s only a single execution thread. But when multiple threads are executing
    "simultaneously," it would be quite possible for a function called by one thread
    to set errno only to have the value changed by a function called by a second thread
    before the first thread read the value intended for it. That''s why Pthreads functions
    return their error codes as the function value rather than using errno.'
