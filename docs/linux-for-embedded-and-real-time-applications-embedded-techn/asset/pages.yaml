    cleanup_module() does the same post processing as rt_process.c. Look at the function
    latency() starting at line 33. It first registers the mailbox name that the check
    task running in User Space can find it. Then it enters the exact same infinite
    loop as rt_process. The only difference is that it doesn''t test for a message
