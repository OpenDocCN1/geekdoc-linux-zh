  md: '# RTAI Application Programming Interface (API)


    Return Value: Task state is formed by the bitwise OR of one or more of the following
    flags:


    +   - READY Task task is ready to run (i.e. unblocked).

    - SUSPENDED Task task is suspended.

    - DELAYED Task task is waiting for its next running period or expiration of a
    timeout.

    - SEMAPHORE Task task is blocked on a semaphore.

    - SEND Task task sent a message and is waiting for the receiver task.

    - RECEIVE Task task is waiting for an incoming message.

    - RPC Task task sent a Remote Procedure Call and the receiver has not gotten it
    yet.

    - RETURN Task task is waiting for reply to a Remote Call.


    Note: the returned state is only approximate information. Timer and other hardware
    interrupts may cause a change in the state of the queried task before the caller
    can evaluate the returned value. Caller should disable interrupts if it wants
    reliable info about another task.


