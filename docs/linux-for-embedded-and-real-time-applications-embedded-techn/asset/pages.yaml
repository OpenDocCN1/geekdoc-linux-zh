  md: '# Linux for Embedded and Real-time Applications


    need, to dive in and directly hack the kernel sources. But access to the source
    code does not mean that the kernel is highly configurable. That is, you can build
    a kernel that precisely matches the requirements, or limitations, of your target
    system.


    Now again, if your role is writing applications for Linux, or if you''re a Linux
    system administrator, you may never have to touch the kernel. But as an embedded
    systems developer, you will most certainly have to build a new kernel, probably
    several times, either for the workstation or the target environment. Fortunately,
    the process of configuring and building a kernel is fairly straightforward. My
    experience has been that building a new kernel is a great confidence-building
    exercise, especially if you''re new to Linux.


    When building a new kernel, it''s generally a good idea to start with clean, "virgin,"
    source downloaded from www.kernel.org, particularly if you need to patch the kernel
    to support some added functionality as RT Linux. Patch files are generally based
    on clean kernel sources and may not execute correctly on sources that have been
    otherwise modified.


    The remainder of this section details and explains the various steps required
    to build an executable kernel image.


    # Where Is the Source Code?


    It''s not at all unusual to have several versions of the Linux kernel and corresponding
    source code on your system. How do you cope with these multiple versions? There
    is a naming strategy that makes this complexity manageable.


    Generally, Linux sources are installed as subdirectories of /usr/src. The subdirectories
    usually get names of the form linux-<version_number>-<additional_features>. <version_number>
    identifies the base version of the kernel as obtained from kernel.org and looks
    something like this: 2.4.18. The first number is the "version," in this case 2.
    This number increments only when truly major architectural changes are made to
    the kernel and its API. We''ve been at 2 for something like six years now.'
  merge: -1
  img_proc: true
- pgno: 48
  md: '# The Host Development Environment


    The second number, 4, is called the "patch level" and identifies subversions where
    the kernel API may differ but the differences aren''t enough to justify a full
    version change. An interesting policy about patch levels is that even numbers
    represent stable, production kernels and odd numbers identify the kernel currently
    under development. If you''re a hard-core kernel hacker you''ll want to keep up
    with the latest odd-numbered patch level. Those of us who want something that
    works will stick to the latest even number.


    The final number, 18 in this example, is called the "sub-level." Basically it
    represents bug fixes and enhancements that don''t change the kernel API. Applications
    built to a specific patch level should, in principle, run on any sub-level.


    <additional_features> is a way of identifying patches made to a stock kernel to
    support additional functionality. For example, the book CD includes a kernel called
    linux-2.4.18-rthal5. This represents sub-level 18 of the stock 2.4 kernel patched
    to support RTAI hardware abstraction layer version 5.


    Whatever its subdirectory name, the kernel you''re currently working with is identified
    by a symbolic link in /usr/src linux.


    # The kernel source tree


