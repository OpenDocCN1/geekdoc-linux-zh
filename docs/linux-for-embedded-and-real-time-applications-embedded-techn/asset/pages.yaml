- pgno: 122
  md: '# Embedded Networking


    socket to a specific network address. Requires filling in a sockaddr_in structure,
    server_addr. The function inet_aton() takes a string containing a network address
    as its first argument, converts it to a binary number and stores it in the location
    specified by the second argument, in this case the appropriate field of server_addr.
    Oddly, inet_aton() returns 0 if it succeeds. In this example, the network address
    is passed in through the compile-time symbol SERVER so that we can build the server
    to run either locally through the loopback device or across the network.


    The port number is 16 bits and is arbitrarily set to 4242. The function htons()
    is one of a small family of functions that solves the problem of transferring
    binary data between computer architectures with different-ordering policies. The
    Internet has established a standard “network order,” which happens to be Big Endian.
    All binary data is expected to be in network byte order when it reaches the network.
    htons() translates a short (16-bit) integer from “host byte order,” whatever happens
    to be, to network byte order. There is a companion function, ntohs() that translates
    back from network byte order to host order. Then there is a corresponding pair
    of functions that do the same translations on long (32-bit) integers.


    Now bind server_socket to server_addr with the bind() function. Finally, we create
    a queue for incoming connection requests with the listen() function. A queue length
    of one should be sufficient in this case because there''s only one client that
    will be connecting to this server.


    Now we''re ready to accept connection requests. The arguments to accept() are:


    +   - The socket descriptor.


    +   - A pointer to a sockaddr structure that accept() will fill in.


    +   - A pointer to an integer that currently holds the length of the structure
    in argument 2. accept() will modify this if the length of the client’s address
    structure is shorter.'
