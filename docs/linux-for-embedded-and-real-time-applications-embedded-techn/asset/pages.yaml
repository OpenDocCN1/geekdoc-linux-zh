- pgno: 130
  md: '# CHAPTER 8

    Introduction to

    Real-time Programming


    Fundamentally, "real-time" means that a program must respond to events in its
    environment within a specified deadline. Such systems are said to be event-driven
    and can be characterized in terms of latency, where latency is defined as the
    time interval from when an event occurs until the time the system takes action
    in response to that event. In a general-purpose operating system such as Windows
    or Unix, latency is of little concern. As a user of Windows, you probably couldn''t
    tell the difference if the system responds to a key press in 20 milliseconds or
    220 milliseconds. And if the system happens to be doing something else, it may
    take two seconds to respond. You may or may not notice, but it happens rarely
    enough that you probably won''t be to upset.


    Real-time, on the other hand, demands an upper limit on latency, also called the
    scheduling deadline. Real-time systems are roughly divided into two major classes:
    hard real-time and soft real-time. The distinction is that in hard real-time,
    the system absolutely must meet its scheduling deadline each and every time. Failure
    to meet the deadline may have catastrophic consequences including loss of life.
    A fly-by-wire aircraft control system is an example of hard real-time. The control
    algorithms depend on regular sampling intervals. If sampling is delayed, the algorithm
    could become unstable.


    Consider the aforementioned fly-by-wire system. Suppose the system senses that
    the plane is losing altitude. It responds by increasing power to the engines,
    which will reduce the rate of descent. The control algorithm is'
  merge: -1
  img_proc: true
- pgno: 131
  md: '# Linux for Embedded and Real-time Applications


    programmed with a specific relationship between power level and rate of climb
    or descent for this specific aircraft. Now suppose that the next sample is delayed,
    maybe because Windows is busy putting up the paper clip icon. The next sample
    will report a higher altitude than would have been reported if the sample had
    been taken at the correct time. The algorithm erroneously reduces engine power
    to compensate. At the next sample time the reported altitude will be lower, but
    may be too low if the sample time was delayed.


    In soft real-time, the scheduling deadline is more of a goal than an absolute
    requirement. We expect the system to meet its deadline most of the time, but nothing
    particularly bad happens if it''s occasionally late. Failure to meet the deadline
    simply results in degraded performance without catastrophic consequences. The
    automated teller network is a good example of soft real-time. Is the ATM network
    real-time? You bet it is! When you put your ATM card into the machine, you expect
    a response within a couple of seconds. But if it should take longer, the worst
    that happens is you get impatient.


    Many systems exhibit both kinds of behavior. That is, some parts are hard and
    some parts are soft.


    # Polling vs. Interrupts


    Real-time systems are said to be "event-driven," meaning that a primary function
    of the system is to respond to "events" that occur in the system''s environment.
    How does the program respond to events? There are two fundamental approaches.
    The first is polling as illustrated in Listing 8-1. The program begins with some
    initialization and then enters an infinite loop that tests each possible event
    to which the system must respond. For each event that is set, the program invokes
    the appropriate servicing function.'
