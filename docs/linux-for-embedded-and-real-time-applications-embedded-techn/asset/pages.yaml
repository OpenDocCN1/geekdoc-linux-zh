    the identity of the semaphore and an optional timeout argument to wait for expressed
    in system clock ticks. If the timeout argument is non-zero, this represents the
    maximum time that the task is willing to wait for the semaphore to be posted.
    If the timeout interval expires SemPend returns an error code.


