    output doesn''t work well in the gdb console window.


    Now run the program and when it stops at the breakpoint you''ll see the following
    messages in the gdb console window:


    > [New Thread 1024 (runnable)

    [Switching to Thread 1024 (runnable)]


    GDB has recognized that it''s running a multi-threaded environment. Let the program
    continue. When it stops at that breakpoint again, you''ll see two more “New Thread”
    messages with different numbers. One of those is the channel thread created by
    the “for” loop, the other is created by Pthreads for'
