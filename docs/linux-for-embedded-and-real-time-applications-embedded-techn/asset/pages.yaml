    # Remote Procedure Calls


    Although this mechanism is called "message Procedure Calls," in reality it is
    just a full duplex version of the message handling described above.


    ```

    RT_TASK *rt_rpc (RT_TASK *task, unsigned int msg, unsigned int *reply);

    RT_TASK *rt_rpc_if (RT_TASK *task, unsigned int msg, unsigned int *reply);

    ```


    Makes a Remote Procedure Call. RPC is like a send/receive pair. rt_rpc sends the
    message msg to the task then waits until a reply is received. The caller task
    is always blocked and queued up. (Queueing may happen in priority order or FIFO
    order as determined by compile time option MSG_PRIORD.) The receiver task may
    get the message with any rt_receive_ *function. It can send the answer with rt_return.
    reply points to a buffer provided by the caller. rt_rpc_if doesn''t block.


    # Return value


    +   * Success – task (the pointer to the task that received the message)

    * 0 – task was not ready to receive the message (rt_rpc_if) or receiver task was
    killed before receiving the message.

    * MSG_ERR – task does not reference a valid task.


