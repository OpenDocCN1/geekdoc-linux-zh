- pgno: 171
  md: '# Linux for Embedded and Real-time Applications


    To build RTAI, execute the following make commands:


    +   - make dep Builds the dependency files


    +   - make Builds the RTAI modules (takes a while)


    +   - make install Installs the modules in /lib/modules


    +   - make dev Creates nodes in /dev for FIFOs and shared memory

    - /setsup Makes the uni-processor scheduler the default scheduler


    When the build is complete, there will be a new directory called /lib/modules/2.4.18-rthal5/rtai
    containing the RTAI modules. There are quite a few of them but for our purposes
    the most important are:


    +   - rtai The RTAI interrupt handling functions. Redirects the RTHAL to point
    to these functions.


    +   - rtai_sched The scheduler for task management, messaging, semaphores, etc.


    +   - rtai_fifos Real-time FIFOs.


    +   - rtai_shm Shared memory.


    +   - rtai_lkrt User Space real-time tasks.


    +   - rtai_pthread Posix threads use


    rtai_sched uses services provided by rtai. In turn, the other modules use services
    provided by rtai_sched. So there is a definite order to the loading of RTAI modules.
    rtai must be loaded first, rtai_sched next. The remaining modules don''t depend
    on each other and can be loaded in any order.


    As the Superuser, try the following commands (you may need to add /sbin to your
    path):


    ```

    insmod rtai

    insmod rtai_sched

    lsmod

    cat /proc/rtai/scheduler

    rmmod rtai_sched

    ```'
  merge: -1
  img_proc: true
- pgno: 172
  md: '# The RTAI Architecture


    Figure 10-2 graphically illustrates the basic architecture of RTAI. The real-time
    kernel effectively intercepts hardware interrupts before they get to the Linux
    kernel. Linux no longer longer has direct control over enabling and disabling
    interrupts. So when Linux says disable interrupts, the RT kernel simply clears
    an internal software interrupt enable flag but leaves interrupts enabled. When
    a hardware interrupt occurs, the RT kernel first determines to whom it is directed:


    +   - RT Task – Schedule the task

    - Linux – Check the software interrupt flag. If enabled, invoke the appropriate
    Linux interrupt handler. If disabled, note that the interrupt occurred and deliver
    it later when Linux re-enables interrupts.


    ![](img/e081ebf3b04d47734031d23bd4787db5_172_0.png)


    Figure 10-2: RTAI Architecture


    The Linux kernel is treated as the lowest priority, or idle, task under the RT
    kernel and only runs when there are no real-time tasks ready to run.


    Of course, there will be times when the RT kernel has to disable hardware interrupts
    to manage its own critical sections, but these are of much shorter duration than
    the critical sections in Linux.'
  merge: -1
  img_proc: true
- pgno: 173
  md: "# Linux for Embedded Real-time Applications\n\nThe real-time tasks will usually\
    \ have some need to communicate with userspace processes for things like file\
    \ access, network communication or interface. RTA provides FIFOs and shared memory\
    \ implementations that provide communication with user space processes.\n\n# The\
    \ Real-Time Hardware Abstraction Layer (RTHAL)\n\nRTAI uses the concept of a Hardware\
    \ Abstraction Layer (HAL) to take over control of interrupt handling from Linux.\
    \ Listing 10-1 is an excerpt from linux include/asm-i86/system.h, one of the files\
    \ modified by the RTAI patch. struct rt_hal is basically a table of function pointers\
    \ with entries for every function in the Linux kernel that does one way or another\
    \ with interrupts. It also includes some global variables.\n\nThis structure is\
    \ built into the modified kernel that we created. When Linux first boots, the\
    \ rt_hal structure is initialized to point to the original functions in the kernel\
    \ and Linux behaves normally. Later, when the module rtai.o is installed, the\
    \ function pointers in rt_hal are changed to point to equivalent functions in\
    \ the RT kernel. Now the RT kernel is in charge of interrupt handling.\n\n# Listing\
    \ 10-1: RHAL Structure from system.h\n\n```\nstruct rt_hal {\n    struct desc_struct\
    \ *idt_table;\n    void (*disint) (void);\n    void (*enint) (void);\n    unsigned\
    \ int (*getflags) (void);\n    void (*setflags) (unsigned int flags);\n\n    void\
    \ (*mask_and_ack_8259A) (unsigned int irq);\n    void (*unmask_8259A_irq) (unsigned\
    \ int irq);\n\n    void (*ack_IO_irq) (void);\n    void (*mask_IO_APIC_irq) (unsigned\
    \ int irq);\n    void (*unmask_IO_APIC_irq) (unsigned int irq);\n\n    unsigned\
    \ long *io_apic_irqs;\n    void *irq_controller_lock;\n    void *irq_desc;\n```"
