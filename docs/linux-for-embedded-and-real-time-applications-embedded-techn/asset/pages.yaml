  md: '# Posix Threads


    Kernel Space Display() simply copies the data points it receives to a FIFO.

    The getstr() call in Command() is just replaced by a rtf_get_() call.


    The function ftime() is not available in Kernel Space so we''ll need an alternative
    for reading time. RTAI Pthreads defines the following function:


    ```

    void_gettime(int clock_id, struct timespec *current_time);

    ```


    This function does not seem to be part of the Posix standards. It doesn''t show
    up in any documentation I have access to. struct timespec is defined in time.h
    and has two long int fields:


    ```

    tv_sec - seconds since midnight Jan. 1, 1970

    tv_nsec - nanoseconds since tv_sec

    ```


    This is actually an enum the timeb structure that data_acq.c uses. clock_id is
    an enum whose value is CLOCK_REALTIME.

    data_acq() has two calls to ftime(). These need to be replaced with calls to clock_gettime().


    RTAI Pthreads has its own version of pthread.h called rtai_pthread.h. Oddly enough,
    it is not in /usr/src/rtai/include where one would expect, but rather it is in
    /usr/src/rtai/posix/include. You have a few choices:


    +   - Specify the whole path in the #include directive. Generally not a good idea.

    - Add /usr/src/rtai/posix/include to the include path in your compiler flags

    - Copy rtai_pthread.h to /usr/src/rtai/include. That''s what I did.


    logger.c implements the User Space "buddies" for Command() and Display(). Basically
    it shows what functionality has to be moved out of data_acq_rt.c.


    Now open up Makefile. The section that is commented out with ''#'' builds the
    kernel module data_acq_rt.o. Delete the ''#'' characters and run again.'
