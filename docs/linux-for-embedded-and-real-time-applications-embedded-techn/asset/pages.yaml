    # Cross-Development Tools–the GNU Tool Chain


    Not only is the target computer limited in resources, it may be a totally different
    processor architecture from your (probably) x86-based development workstation.
    We therefore need a cross-development tool chain that runs on the PC but generates
    code for a different processor. We also need a tool that will help us debug code
    running on the target.


    # GCC


    By far the most widely used compiler in the Linux world is GCC, the G Compiler
    Collection. It was originally called the Gnu C Compiler but the name was changed
    to reflect its support for more than just'
