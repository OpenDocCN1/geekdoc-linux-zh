    An internal “capabilities” data structure. The system defines a protocol

    for how applications access to the information in the capabilities data

    structure through system calls.


    A specific example of a capabilities structure is chrdevs, the table of character
    devices. The specific kernel function that manages chrdevs

    register_chrdev(). The way in which an application program gains access to

    the services of a character device driver is through the open() system call.

    This is described in more detail below.


    If a module is no longer needed and is removed with the rmmod command,

    cleanup_module() should unregister the module’s capabilities, freeing up

    the entry in the capabilities data structure.


    # What’s a Device Driver Anyway?


    There are probably as many definitions of a device driver as there are programmers\who
    write them. Fundamentally, a device driver is simply a way to

    “abstract out” the details of peripheral hardware so the application programndoesn''t
    have to worry about them.


    In simple systems a driver may be nothing more than a library of functions

    linked directly to the application. In general-purpose operating systems,

    device drivers are often independently loaded programs that communicate

    with applications through some OS-specific protocol. In multitasking systems

    like Linux the driver should be capable of establishing multiple “channels” to

    the device originating from different application processes. In all cases

    though the driver is described in terms of an API that defines the services

    the driver is expected to support.


    The device driver paradigm takes on additional significance in a protected

    mode environment such as Linux. There are two reasons for this. First, User

    Space application code is normally not allowed to execute I/O instructions.

    This can only be done in Kernel Space at Privilege Level 0. A set of device

    driver functions linked directly to the application simply won’t work. The

    driver must execute in Kernel Space. Actually, there are some hoops you can

    jump through to allow I/O access from User Space but it’s better to avoid them.'
