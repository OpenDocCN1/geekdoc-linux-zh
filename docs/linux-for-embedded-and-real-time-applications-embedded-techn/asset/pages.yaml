  md: 'Some vectors are reserved for external hardware interrupts. In the PC, vectors
    8 to 15 and 0x70 to 0x77 are reserved for hardware.


    All other vectors are accessible via 2-byte INT instructions, where the second
    byte is the vector (or interrupt) number. System software usually establishes
    conventions concerning many of these vectors. For example the PC BIOS uses several
    interrupt vectors for hardware services and Linux uses INT 0x80 to invoke kernel
    services.


    Figure 8-3 illustrates the basic process of interrupt execution using the Linux
    INT 0x80 as an example:


    +   The processor saves the current Program Counter (PC) and Code Segment (CS)
    on the stack along with the Processor Status Word (PSW).


    ![](img/e081ebf3b04d47734031d23bd4787db5_135_0.png)


    Figure 8-3: Interrupts – How They Work'
