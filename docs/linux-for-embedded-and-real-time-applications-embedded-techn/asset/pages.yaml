    6-4. This is for a driver that consists of a single object file. If your driver
    contains multiple object files, look at the Makefile in drivers/bluetooth/ as
    an example.


    # Listing 6-4


    ```

    # Makefile for Doug''s parrot driver.

    #

    parport.o: parport.c


    include $(TOPDIR)/Rules.make

    ```


    The source file requires a couple minor modifications that cause init_module()
    to be called as part of the kernel boot process. Add the include file linux/init.h.
    In the declaration of init_module() add "__init" just before init_module so that
    it looks like this:


    ```

    int __init init_module(void)

    ```


    __init causes the function to be compiled into a special segment of initialization
    functions that are called as part of the boot process. Once boot up is complete,
    this segment can be discarded and the memory reused.


    At the end of the file add the following line:


    ```

    __initcall(init_module);

    ```


    This causes a pointer to init_module() to be added to a table of initialization
    functions that are called at boot up. The upshot is that you don''t have to modify
    main.c to add a new initialization function every time you add a new driver. It
    happens automatically.


    Also, we no longer need cleanup_module() because the device will never be removed.'
