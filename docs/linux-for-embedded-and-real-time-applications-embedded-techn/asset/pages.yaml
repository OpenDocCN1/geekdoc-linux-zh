  md: '# # CHAPTER 10


    # # The RTAI Environment


    The Real-Time Application Interface, RTAI, uses the Interrupt Abstraction approach
    to adding deterministic real-time characteristics to the Linux kernel. In this
    chapter we''ll explore the RTAI environment running on the workstation. In principle,
    RTAI should run on your target with the BlueCat Linux distribution since it''s
    also x86 based. However, BlueCat is based on the version 2.4.10 kernel but RTAI
    24.1.9 only has patches back to kernel version 2.4.16. If you really want to try
    RTAI on your target, go to the RTAI download page and find a version that supports
    the 2.4.10 kernel.


    RTAI has a rather extensive set of APIs. Rather than try to describe all of them
    in detail, we will focus on some examples that illustrate the basics. The complete
    APIs are listed in Appendix A.


    # ## Installing RTAI


