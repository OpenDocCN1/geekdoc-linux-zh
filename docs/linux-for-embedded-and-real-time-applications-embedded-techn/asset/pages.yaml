    # The Linux Filesystem


    The Linux filesystem is in many ways similar to the filesystem you might find
    on a Windows PC or a Macintosh. It''s a hierarchical system that lets you create
    any number of subdirectories under a root directory identified by /. Like Windows,
    file names can be very long. However in Linux, as in most Unix-like systems, filename
    “extensions,” the part of the filename following ”, have less meaning. For example,
    while Linux executables always have the extension “.exe”, Linux executables rarely
    have an extension at all. By and large large, the contents of a file are identified
    by a file header rather than a specific extension identifier.'
  merge: -1
  img_proc: true
- pgno: 35
  md: '# Linux for Embedded and Real-time Applications


    Unlike Windows, file names in Linux are case-sensitive. Therefore, Foobar is a
    different file from foobar is different from fooBar. Sorting is also casesensitive.
    File names beginning with uppercase letters appear before those that begin with
    lowercase letters in directory listings sorted by name. File names that begin
    with "." are considered to be "hidden" and are not displayed in directory listings
    unless you specifically ask for them.


    Additionally, the Linux filesystem has a number of features that go beyond what
    you find in a typical Windows system. Let''s take a look at some of the features
    that may be of interest to embedded programmers.


    # File Permissions


    Because Linux is multi-user, every file has a set of "permissions" associated
    with it to specify what various classes of users are allowed to do with that file.
    Get a detailed listing of some Linux directory, either by entering the command
    -l in a console window or with the desktop file manager. Part of the entry for
    each file is a set of 10 flags and a pair of names that look something like:


    ```

    -rw-rw--r-- Andy physics

    ```


    In this example, Andy is the "owner" of the file and he belongs to a "group" of
    users called physics, perhaps the physics department at some university. Generally,
    but not always, the owner is the person who created the file.


    The first of the ten flags identifies the file type. Ordinary files get a dash
    here. Directories are identified by "d", links are "l" and so on. The remaining
    nine flags divide into three groups of three flags each. The flags are the same
    for all groups and represent, respectively, permission to read the file, "r",
    write the file, "w", or execute the file if it''s an executable, "x". Write permission
    also allows the file to be deleted.


    The three groups then represent the permissions granted to different classes of
    users. The first group identifies the permissions granted the owner of the file
    and virtually always allows reading and writing. The second flag gives permissions
    to other members of the same group of users. In this case'
  merge: -1
  img_proc: true
- pgno: 36
  md: "the physics group has read access to the file but not write access. The final\n\
    flag group gives permissions to the “world”—i.e., all users.\n\n# The “root” User\n\
    \nThere's one very special user, named “root,” in every Linux system. Root can\n\
    do anything to any file regardless of the permission flags. Root is primarily\n\
    intended for system administration purposes and is not recommended for\nday-to-day\
    \ use. You can clearly get in a lot of trouble if you're not careful and\nroot\
    \ privileges pose a security threat. Nevertheless, the kinds of\nthings that embedded\
    \ and real-time developers do with the system often\nrequire write or executable\
    \ access to files owned by root and thus require you\nto logged in as the root\
    \ user.\n\nIf you're logged in as a normal user, you can switch to being root\
    \ with the su,\nstitute user, command. The su command with no arguments starts\
    \ a\nshell with root privileges provided you enter the correct password. To return\n\
    to normal user status, terminate the shell by typing ^D or exit. Most of the\n\
    time I just log in as root because it's less hassle and I'm not too worried about\n\
    hackers compromising my relatively isolated system.\n\n# The /proc filesystem\n\
    \nThe /proc file system is an interesting feature of Linux. It acts just like\n\
    ordinary file system. You can list the files in the /proc directory, you can read\n\
    \ write the files, but they don't really exist. The information in a /proc file\n\
    is generated when the file is read. The kernel module that regist-\ntered a given\
    \ /proc file contains the functions that generate read data and\naccept write\
    \ data.\n\n/proc files are another window into the kernel. They provide dynamic\n\
    information about the state of the system in a way that is easily accessible to\n\
    user-level tasks and the shell. In the abbreviated directory listing of Figure\n\
    2-6, the directories with number labels represent processes. Each process gets\n\
    directory under /proc with several files describing the state of the process."
