    on the host, start two shell windows. In the first, run devices and in the second
    run thermostat.s (the .s identifies the simulation version). Change the "A/D in:"
    input in the devices window and verify that the thermostat responds correctly.
    Run thermostat.s under DDD to see how the state transitions progress.'
