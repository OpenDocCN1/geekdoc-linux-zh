  md: '# Linux for Embedded and Real-time Applications


    Timeslicing is a variation on round robin that assigns a maximum time quantum
    or "slice" to each task to prevent one task from hogging the processor. A task
    runs until it blocks, yields voluntarily or its timeslice expires. Depending on
    implementation, the timeslice may be the same for all tasks or each task may get
    its own timeslice value.


    Fundamentally, round robin scheduling is just another form of polling.


    # Kernel Services


    A multitasking kernel is largely defined by the services it provides. This set
    of services constitutes an Application Programming Interface (API) that allows
    a user to utilize the kernel''s features. When describing the functionality of
    a multitasking kernel, it is useful to present an API to show how the concepts
    map into real code. For the remainder of this chapter, I will present a simplified
    idealized API that expresses the basic functionality. Real implementations will
    differ in detail from the model presented here but will nevertheless implement
    the same functionality.


    # Task API


    Let''s begin our exploration of the kernel API by examining the services required
    to manage tasks.


    ```

    task_t *TaskCreate(void (*task)(void *data, void *data, int prior);

    status_t TaskStart(task_t *task);

    status_t TaskSuspend(task_t *task);

    status_t TaskResume(task_t *task);

    status_t TaskDelete(task_t *task);

    ```


    Absolutely nothing happens in a multitasking system until we create one or more
    tasks. To create a task we call a function with a name like TaskCreate. At minimum,
    we have to give TaskCreate:


    +   - A pointer to the function that implements the task''s code (task).

    - A pointer to the data that will be passed as the function''s argument when it
    is first called (data).

    - The task''s priority (prior).'
