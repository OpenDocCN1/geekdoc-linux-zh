    # Building the Kernel


    Before actually building the kernel, it''s important to check the version of gcc,
    the GNU C compiler, on your system. The command gcc -v will return the version
    number. The recommended compiler version for 2.4 series kernels is 2.95.3. Later
    versions (3.x.y) have been known to generate subtle bugs in the kernel even though
    the build completes successfully. Another version suited for kernel building is
    2.91.66 that was part of the Red Hat 6.2 distribution. This compiler was also
    known as “Egcc”, kernel gcc.


    A binary version of gcc 2.95.3 is on the book CD as /usr/local/gcc-2.95.3bin.tar.gz.
    If needed, install this in /usr/local and add /usr/local/bin to the front of your
    PATH.


