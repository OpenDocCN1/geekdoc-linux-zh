    source tree starting at /usr/src/linux. The directories are as follows:


    Documentation – Pretty much self-explanatory. This is a collection of text files
    describing various aspects of the kernel, problems, "gotchas," and so on. There
    are several subdirectories under Documentation for topics that require more extensive
    explanations.


    arch – All architecture-dependent code is contained in subdirectories of arch.
    Each architecture has a directory under arch with its own subdirectory structure.
    The executable kernel image will end up in arch/'
