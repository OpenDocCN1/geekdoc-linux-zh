- pgno: 176
  md: '# The RTAI Environment


    +   - Messaging - This is a direct task-to-task communication mechanism. A task
    can send a single integer directly to another task. The receiving task can wait
    for a message (integer) from a specific sender or from any task. There is also
    a full duplex version of messaging called "Remote Procedure Calls."


    All of these mechanisms are implemented in the module rtai_sched.


    # Communicating with Linux Processes


    The communication and synchronization mechanisms described above apply only to
    Kernel Space realtime tasks. RTAI also supports two mechanisms to provide communication
    between a real-time task and a User Space Linux process. These are RT FIFOs and
    shared memory.


    # RT FIFOs


    A RT FIFO is a point-to-point link connecting one real-time task to one Linux
    process. It''s very much like a Unix pipe. The implementation allows a FIFO to
    be bidirectional, but in practice that rarely makes sense. Suppose, for example,
    that one end of the FIFO writes a command and then immediately tries to read the
    result of the command it wrote. Chances are it would just read back the command
    it wrote. So in in practice, FIFOs are unidirectional where the direction is established
    by the programmer. In the example just cited, you would create two FIFOs—one to
    send the command and the other to read the response.


    User processes treat RT FIFOs as character devices, /dev/rtf0 to /dev/rtf63. A
    process opens a FIFO for reading or writing and then uses read() or write() on
    the file descriptor to transfer data. The rtf nodes are automatically added to
    your filesystem by the RTAI build process if you select FIFO support. Real-time
    tasks access the FIFO through an RTAI-specific API.


    We''ll look at the FIFO API in more detail later with a simulated data acquisition
    example.'
  merge: -1
  img_proc: true
- pgno: 177
  md: '# Linux for Embedded and Real-time Applications


    # Shared Memory


    The FIFO model is useful in situations where a relatively small amount of data
    must be transferred between one RT task and one User process more or less synchronously.
    But there are also situations where multiple processes might require access to
    data generated by a single real-time task. In this case a shared memory model
    makes more sense. Remember that we used shared memory back in Chapter 7 for the
    networked thermostat.


    There are also situations where large amounts of data, video frame buffers for
    example, must be moved quickly between a real-time task in Kernel Space and one
    or more processes in User Space. Here''s another case where shared memory makes
    sense because the data doesn''t have to be copied from one domain to the other.
    The real-time task writes the shared memory region and the processes read it at
    their leisure.


    # Real-time in User Space—LXRT


    RTAI and the real-time tasks that it manages run in Kernel Space at Privilege
    Level 0. As we''ve seen before, this leads to problems during development because
    it''s difficult to use a source level debugger like GDB kernel code. Fortunately,
    RTAI has an escape hatch called LXRT. LXRT allows you to run real-time tasks in
    User Space using the same API that is provided in Kernel Space RTAI.


    # How It Works


    You create an LXRT task as an ordinary Linux User Space process with a main()
    function. As part of the initialization, you create a "buddy" task that operates
    in Kernel Space on behalf of the User Space task. When, for example, your LXRT
    task calls rt_task_wait_period(), LXRT gets your buddy, running in Kernel Space,
    to execute the real function. Return controls to the LXRT task only when its buddy
    wakes up. Similarly you can create RTAI communication and synchronization objects
    like semaphores and mailboxes. Each of these objects is identified by a name.
    You pass the object''s name to the appropriate initialization or creation function,
    which returns a pointer to a data structure to be used in accessing the object.'
  merge: -1
  img_proc: true
- pgno: 178
  md: '# Measuring Latency with LXRT


    As an introduction to RTAI we''ll run a variation on the latency experiment of
    the previous chapter. This version is structured as a pair of LXRT tasks. One
    task, called rt_process, wakes up periodically, reads the current time, computes
    the deviation from the ideal period and checks min and max values. After some
    number of passes it sends this information via an RTAI mailbox to the other task,
    check, which simply displays the results. This is in fact a simple variation on
    one of the LXRT examples.


    cd RTdemos/Taskjitter and open rt_process.c. Scroll down to main() line 69. For
    LXRT to function correctly, you must use the SCHED_FIFO scheduling policy and
    lock the process in memory (no paging). The function rt_task_init() creates an
    LXRT task named "LATCAL" and returns a pointer to a RT_TASK structure. This is
    a handle by which we''ll refer to this task from now on. nam2num is just a way
    of "mangling" up to 6 ASCII characters into a single integer ID. rt_task_init()
    leaves the task in the suspended state.


    Next we create a mailbox named "LATMBX" with a call to rt_mbx_init(), which returns
    a pointer to a mailbox structure. Within the element oneshot, the function start_rt_timer()
    starts the system timer with the specified period, in this case 100,000 nanoseconds,
    or 100 microseconds. Note that the argument to start_rt_timer() is in internal
    timer counts. For the time being, skip over the other code in this if as well
    as the one concerning hardrt. We''ll come back to these later.


    LATCAL is a periodic task so we start it with a call to rt_task_make_periodic().
    The task starts with the same period as the timer, so it wakes up every timer
    tick.


    Inside the task''s while() loop calls rt_task_wait_period() to block until its
    next scheduled execution time as specified by rt_task_make_periodic(). Each time
    the task wakes up, it reads the current time and computes the deviation from the
    expected wakeup time. After a few thousand passes it sends a data structure to
    the mailbox with the function rt_mbx_send_if().'
  merge: -1
  img_proc: true
- pgno: 179
  md: '# Linux for Embedded and Real-time Applications


    The "if" suffix means the message will be sent only if there''s space for it in
    the mailbox. This is a nonblocking version of sending to a mailbox

    _receive_if() tests to see if the companion task "LATCHK" has sent a message.
    A non-zero return indicates a message was received. In this case the message value
