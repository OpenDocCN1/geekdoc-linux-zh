    # Two Approaches


    OK, so Linux is not real-time. What do we do about it? Well, there are at least
    two very different approaches to giving Linux deterministic behavior.


    # Preemption Improvement


    One approach is to modify the Linux kernel itself to make it more responsive.
    This primarily involves introducing additional preemption points in the kernel
    to reduce latency. An easy way to do this is to make use of the “spinlock” macros
    that already exist in the kernel to support symmetric'
