- pgno: 188
  md: '# CHAPTER 11

    Posix Threads


    One of the objections to the RTAI approach to adding real-time functional- to
    Linux is that it introduces a new, nonportable API to support the real-time kernel.
    One solution to this problem is to implement the Posix threads API, also known
    as Pthreads, as a wrapper on top of the native RTAI API.


    Posix, also written POSIX, is an acronym that means Portable Operating System
    Interface with an X thrown in for good measure. POSIX represents a collection
    of standards defining various aspects of a portable operating system based on
    UNIX. These standards are maintained jointly by the Institute of Electrical and
    Electronic Engineers (IEEE) and the International Standards Organization (ISO).
    Recently the various documents have been pulled together into a single standard
    in a collaborative effort between the IEEE and The Open Group (see the Resources
    section below).


    In general, Linux conforms to Posix. The command shell, utilities and system interfaces
    have all been upgraded over the years to meet Posix requirements. But in the context
    of real-time multitasking, in RTAI, we are specifically interested in the Posix
    Threads interface known as 1003.1c.


    There is another advantage to using the Pthreads API. Linux itself implements
    Pthreads in User Space. In effect Pthreads becomes a portable alternative to LXRT.
    You can develop your real-time application in User Space, using DDD/GDB for debugging,
    and then port it with relatively little change to Kernel Space RTAI.'
  merge: -1
  img_proc: true
- pgno: 189
  md: '# Linux for Embedded and Real-time Applications


    Unfortunately, the RTAI Pthreads implementation isn''t quite complete and some
    aspects of Pthreads behavior don''t map directly into the RTAI tasking model.
    I will describe the Pthreads API in general and point out those areas where the
    RTAI implementation doesn''t quite match.


    The header file that prototypes the Pthreads API is pthread.h and resides in the
    usual directory for library header files, /usr/include.


    # Threads


    Fundamentally a thread is the same thing we were calling a task in Chapter 8.
    It is an independent thread of execution embodied in a function. The thread has
    its own stack.


    ```

    int pthread_create(pthread_t *thread, pthread_attr_t *attr, void *(* start_routine

    (void *), void *arg);

    void pthread_exit(void *retval);

    int pthread_join(pthread_t thread, void **return);

    pthread_t pthread_self(void);

    int sched_yield(void);

    ```


    The mechanism for creating and managing a thread is analogous to creating and
    managing the tasks. A thread is created by calling pthread_create() with the following
    arguments:


    +   - pthread_t - A thread object that represents or identifies the thread.

    pthread_create() initializes this as necessary.

    - Pointer to the thread attribute object - Often it is NULL. More on it later.

    - Pointer to the start routine - The start routine takes a single pointer to void
    argument and returns a pointer to void.

    - Argument to be passed to the start routine when it is called.


    A thread may terminate by calling pthread_exit() or simply returning from its
    start function. The argument to pthread_exit() is the start function’s return
    value.'
  merge: -1
  img_proc: true
- pgno: 190
  md: '# Posix Threads


    In the same way that a parent process can wait for a child to complete by calling
    waitpid(), a thread can wait for another thread to complete by calling pthread_join().
    The arguments to pthread_join() are the ID of the thread to wait on and a place
    to store the return value. The calling thread is blocked until the target thread
    terminates. RTAI Pthreads doesn''t implement pthread_join() as the task model
    doesn''t support the notion of joining.


    A thread can determine its own ID ID by calling pthread_self(). Finally, a thread
    can voluntarily yield the processor by calling sched_yield().


    Note that most of the functions return an int value. This reflects the Pthreads
    approach to error handling. Rather than reporting errors in the global variable
    errno, Pthreads functions report errors through their return value. Appendix B
    gives a more complete description of the Pthreads API including a list of all
    error codes.


    # Thread Attributes


    POSIX provides an open-ended mechanism for extending the API through the use of
    attribute objects. For each type of Pthreads object there is a corresponding attribute
    object. This attribute object is effectively an extended argument list to the
    related object create or initialize function. A pointer to an attribute object
    is always the second argument to a create function. If this argument is NULL the
    create function uses appropriate default values. This also has the effect of keeping
    the create functions relatively simple by leaving a lot of arguments that normally
    take default values.


    An important philosophical point is that all Pthreads objects are considered to
    be "opaque.\ This means that all access is through API functions that get and
    set the member arguments of the object. This allows new arguments to be added
    to a Pthreads object type by simply defining a corresponding pair of get and set
    functions for the API. In simple implementations the get and set functions may
    be a pair of macros that access the corresponding member of the attribute data
    structure.


    177'
