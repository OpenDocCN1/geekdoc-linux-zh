  md: '# Linux for Embedded and Real-time Applications


    #include rtai_sched.h


    # Task Functions


    ```

    int rt_task_init (RT_TASK *task, void (*rt_thread)(int), int data, int

    stack_size, int priority, int uses_fpu, void(*signal)(void));

    int rt_task_init_cpuid (RT_TASK *task, void (*rt_thread)(int), int data, int

    stack_size, int priority, int uses_fpu, void(*signal)(void), unsigned int

    cpuid);

    ```


    Create a real-time task. task is a pointer to an RT_TASK type

    structure whose space must be provided by the application. It

    must be kept during the whole lifetime of the real-time task

    and cannot be an automatic variable.

    _thread is the entry point of the task function. The parent

    task can pass a single integer value to the new task.

    stack_size is the size of the stack to be used by the new task,

    and priority is the priority to be given the task. The highest

    priority is 0, while the lowest is RT_LOWEST_PRIORITY.

    uses_fpu is a flag. Nonzero value indicates that the task will

    use the floating point unit.

    signal is a function that is called, within the task environment

    and with interrupts disabled, when the task becomes the

    Current running task after a context switch.


    The newly created real-time task is initially in a suspend state.

    It is be made active either with rt_task_make_periodic,

    rt_task_make_periodic_relative_ns or rt_task_resume.


    On multiprocessor systems rt_task_init_cpuid assigns task to a

    specific CPU cid. rt_task_init automatically selects which CPU

    task will run on. This assignment may be changed by calling

    rt_set_runnable_on_cpus or rt_set_runnable_on_cpuid.

    cpuid is invalid rt_task_init_cpuid falls back to automatic

    CPU selection.'
