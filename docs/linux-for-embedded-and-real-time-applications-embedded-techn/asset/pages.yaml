- pgno: 10
  md: '# Preface


    > “You are in a maze of twisty little passages, all alike”


    Before you looms one of the most complex and utterly intimidating systems ever
    written. Linux, the free UNIX clone for the personal computer, produced by a mishmash
    team of UNIX gurus, hackers, and the occasional loon. The system itself reflects
    this complex heritage, and although the development of Linux may appear to be
    a disorganized volunteer effort, the system is powerful, fast, and free. It is
    a true 32-bit operating system solution.


    I have a confession to make. Until about three years ago, I didn''t like Unix
    and avoided it as much as possible. I always considered it deliberately obscure
    and difficult to use. I still do. Working with Linux has one of the most frustrating
    experiences in my long career as a computer engineer. I can do a Windows installation
    in about 15 minutes without ever referring to a manual. I can''t do that with
    Linux.


    But, while Linux is far from being ready for prime time in the world of consumer
    computing, there are some good things about it that have forced me to soften my
    bias and grin and bear it. In the embedded space where I work, Linux can no longer
    be ignored or avoided, nor should it be.


    Linux is indeed complex, unless you''re already a Unix guru, the learning curve
    is quite steep. The information is out there on the web but it is often neither
    easy nor readable. There are probably hundreds of books in print on Linux covering
    every aspect from beginners'' guides to the internal workings of the kernel. But
    until recently little has been written about Linux in embedded or real-time environments.


    ¹ Linux Installation and Getting Started, Matt Welsh, et al.'
  merge: -1
  img_proc: true
- pgno: 11
  md: '# Linux for Embedded and Real-time Applications


    I decided to climb the Linux learning curve partly because I saw it as an emerging
    market opportunity and partly because I was intrigued by the Open Source development
    model. The idea of programmers all over the world contributing to the development
    of a highly sophisticated operating system just for the fun of it is truly mind-boggling.
    Having the complete source code not only allows you to modify it to your heart''s
    content, it allows you (in principle at least) to understand how the code works.
    Unfortunately, my experience has been that a lot of Linux code is "write-only."
    Someone obviously wrote it, but no one else can read it.


    Open Source has the potential to be a major paradigm shift in how our society
    conducts business because it demonstrates that cooperation can be as useful in
    developing solutions to problems as competition. Yet at the time this book is
    being written, serious questions are being raised whether or not it is possible
    to actually make money with Open Source software. Is there a business model that
    works? The jury is still out.


    # Audience and Prerequisites


    This book is directed at two different audiences:


    +   - The primary audience is embedded programmers who need an introduction to
    Linux in the embedded space. This is where I came from and how I got into Linux
    so it seems like a reasonable way to structure the book.


    +   - The other audience is Linux programmers who need an introduction to the
    concepts of embedded and real-time programming.


    Consequently, each group will see some material that is review although it may
    be presented with a fresh perspective.


    This book is not a beginners'' guide. I assume that you have successfully installed
    a Linux system and have at least played around with it. You know how to log in,
    you''ve experimented with some of the command utilities and have probably fired
    up X-windows. Chapter 2 is a cursory introduction to some of the features and
    characteristics of Linux that are of interest to embedded and real-time programmers.'
  merge: -1
  img_proc: true
