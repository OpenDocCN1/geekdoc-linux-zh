    Conceptually, the kernel maintains a FIFO queue of processes for each possible
    priority value ranging from 0 to 99. To determine the next process to run, the
    scheduler finds the highest priority non-empty queue and takes the first entry.
    If a SCHED_FIFO process is preempted by a higher priority process it remains at
    the head of its priority queue. When a SCHED_FIFO process becomes runnable after
