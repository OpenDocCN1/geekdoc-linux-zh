  md: '# Posix Threads


    ```

    pthread_mutex_t t_mutex = PTHREAD_MUTEX_INITIALIZER;


    int pthread_mutex_init(pthread_mutex_t *mutex, const pthread_mutexattr_t *mutexattr);

    int pthread_mutex_destroy(pthread_mutex_t *mutex);


    int pthread_mutex_lock(pthread_mutex_t *mutex);

    int pthread_mutex_unlock(pthread_mutex_t *mutex);

    int pthread_mutex_trylock(pthread_mutex_t *mutex);

    ```


    The Pthreads mutex API follows the same pattern as the thread API. There is a
    pair of functions to initialize and destroy mutex objects and a set of functions
    to act on the mutex objects. This slide also shows an alternate way to initialize
    statically allocated mutex objects. PTHREAD_MUTEX_INITIALIZER provides the same
    default values as pthread_mutex_init().


    Two operations may be performed on a mutex: lock and unlock. The lock operation
    causes the calling thread to block if the mutex is not available. trylock allows
    you to test the state of a mutex without blocking. If the mutex is available trylock
    returns success and locks the mutex. If the mutex is not available it returns
    EBUSY.


    # Mutex Attributes


    ```

    int pthread_mutexattr_init(pthread_mutexattr_t *attr);

    int pthread_mutexattr_destroy(pthread_mutexattr_t *attr);

    ```


