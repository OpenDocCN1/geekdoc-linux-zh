  md: '# RTAI/proc Files


    Upon installing the rtai module, you''ll find a new subdirectory under /proc,
    /proc/rtai. Each RTAI module creates its own file in /proc/rtai to convey its
    status information. Just for kicks, take a look at /proc/rtai/scheduler both before
    and after installing rtai_lxrt. The scheduler file lists the real-time tasks and
    useful information about them. After installing rtai_lxrt we find 16 tasks in
    the list! Look at /proc/rtai/lxrt and you''ll find that it has created 16 tasks.
    If you start rt_process and look at /proc/rtai/lxrt again, you''ll find two more
    objects in the list, the LATCAL task and LATMBX mailbox.


    # Real-time FIFOs and Shared Memory


    cd $(HOME)/Rdemos/FIFO and open the file data_acq.c. This is a pseudo data acquisition
    application that uses an RTAI FIFO and a shared memory region to communicate with
    a logger process. data_acq supports multiple channels and we can control the acquisition
    process through a channel_t data structure defined in data_acq.h. We can, for
    example, set the "sample rate" and "gain" independently for each channel. In this
    pseudo version data_acq simply generates a sawtooth waveform on each channel at
    the specified rate and with a specified range.


    Go to the function init_module() at line 89. The first thing it does is to create
    a FIFO for transferring data from the RT task to the logger. The FIFO is identified
    by an integer and we arbitrarily set the size to 1024 bytes. Next we create a
    signal handler for the FIFO. This function is a callback that is invoked whenever
    the User End of the FIFO is accessed.


    It''s quite possible for the data_acq task to fill up, especially if the data_acq
    task is started before the logger. In that case data_acq can pend on a semaphore
    until the logger reads something out of the FIFO, thereby making room available
    again. The FIFO signal handler processes the semaphore when it is invoked by the
    data FIFO being read and if the data_acq task is pended.

    init_module() creates the semaphore.'
  merge: -1
  img_proc: true
- pgno: 185
  md: '# Linux for Embedded and Real-time Applications


    Next we allocate a shared memory region for the channel_t control structure. rtai_kmalloc()
    is the RTAI-safe version of kmalloc(). RTAI shared memory uses the same object
    name space as LXRT to allow User Space processes to access the shared memory.
    Finally init_module() initializes and starts the data_acq task as we''ve seen
    before.


    The data_acq task begins at line 45. By convention, a channel is not enabled for
    acquisition if its sample_period field is 0. All channels are initialized to disabled.
    The logger will set appropriate operational values for each channel.


    In the main loop, each time the task wakes up it loops through all the channels
    in the channel[] array to find any that require a data sample to be generated.
    For each channel whose sample period has expired, it fills in a data_point_t structure,
    including channel number, data value and time stamp, and sends this to the data
    FIFO. The function value of rtf_put() is the number of bytes written, which may
    be less than the number requested if the FIFO fills up. In this case data_acq
    pends on the semaphore.


    If in data_acq writes less than a full data_point_t record to the FIFO, it might
    be possible for the logger to get out of sync by reading a partial record. It
    works out in this instance because the data_point_t record is 16 bytes, an integral
    sub-multiple of the FIFO size. Either a full record will be written or nothing
    will be written. Likewise, on the logger''s end either a full record is read or
    the FIFO is empty. Note also that when the FIFO fills up, the current data point
    is simply thrown away. Is that good policy? Well, if the FIFO fills up, the task
    blocks and we''ll probably lose data points anyway. Better that the logger be
    able to keep up.


    Now take a look at logger.c. It starts out with an array of channel_t structures
    that initializes four channels. A signal handler intercepts Control-C to terminate
    the program gracefully. Logger writes the data it receives from data_acq to a
    disk file whose name is passed as a run-time parameter. Note how the FIFO is opened
    as an ordinary file for read-only access.'
