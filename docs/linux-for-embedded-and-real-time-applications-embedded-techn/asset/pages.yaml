  md: '# Linux for Embedded and Real-time Applications


    ```

    int pthread_attr_init (pthread_attr_t *attr);

    int pthread_attr_destroy (pthread_attr_t *attr);

    int pthread_attr_getdetachstate(pthread_attr_t *attr, int *detachstate);

    int pthread_attr_setdetachstate(pthread_attr_t *attr, int detachstate);

    ```


    Scheduling Policy Attributes

    int pthread_attr_setschedparam(pthread_attr_t *attr, const struct sched_param
    *param);

    int pthread_attr_getschedparam(const pthread_attr_t *attr, struct sched_param
    *param);

    int pthread_attr_setschedpolicy(pthread_attr_t *attr, int *policy);

    int pthread_attr_getgetchedpolicy(const pthread_attr_t *attr, int *policy);

    int pthread_attr_setinheritsched(pthread_attr_t *attr, int inherit);

    int pthread_attr_getinheritsched(const pthread_attr_t *attr, int *inherit);


    Before an attribute object can be used, it must be initialized. Any of the attributes
    defined for object may be set or retrieved with the appropriate functions. This
    must be done before the attribute object is used in a call to pthread_create().
    If necessary, an attribute object can also be "destroyed." Note that a single
    attribute object can be used in the creation of multiple threads.


    The only required attribute for thread objects is the "detach state." This determines
    whether or not a thread can be joined when it terminates. The default detach state
    is PTHREAD_CREATE_JOINABLE meaning that the thread can be joined on termination.
    The alternative is PTHREAD_CREATE_DETACHED, which means the thread can''t be joined.


    Joining is only useful if you need the thread''s return value. Otherwise it''s
    better to create the thread detached. The resources of a joinable thread can''t
    be recovered until another thread joins it, whereas a detached thread''s resources
    can be recovered as soon as it terminates. In RTAI Pthreads the only valid value
    for detach state is PTHREAD_CREATE_DETACHED and pthread_attr_setdetachstate()
    doesn''t really do anything.


    There are also a number of optional scheduling policy attributes that RTAI Pthreads
    implements. See Appendix B for more details on these.


    # Synchronization—Mutexes


    Pthreads uses the mutex as its primary synchronization mechanism.'
