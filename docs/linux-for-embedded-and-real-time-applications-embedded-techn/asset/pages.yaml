- pgno: 180
  md: '# The RTAI Environment


    The "&" directs bash to spawn a process for rt\_process but then immediately come
    back for another command rather than waiting for rt\_process to finish. Now enter


    ```

    ./check

    ```


    The results are displayed in nanoseconds. Fire up Netscape and watch what it does
    to the maximum deviation. It''s pretty bad, isn''t it? In fact, it''s not any
    better than what we saw in the last chapter with straight Linux. So conventional
    LXRT is just "soft" real-time. Its useful as a debugging tool before you move
    your tasks into Kernel Space, but it doesn''t buy you anything in terms of deterministic
    performance.


    When you''re finished, type <Enter> into the window running check and it will
    terminate both processes.


    # Hard Real-time in LXRT


    But that''s not the end of the story. Later releases of LXRT include a feature
    that allows you to get hard real-time performance in User Space. The function
    rt\_make\_hard\_real\_time() turns a User Space into a hard real-time process
    (perhaps the more accurate term is harder). It does this by playing games with
    the scheduler and blocking/blocking hardware interrupts while a hard real-time
    process is executing. You can return the process to normal soft real-time by calling
    rt\_make\_soft\_real\_time().


    rt\_process provides a couple of run-time parameters, beginning respectively with
    "h" and "o", to alter its behavior. The "h" stands for hard real-time. If you
    execute ./rt\_process h, the program invokes rt\_make\_hard\_real\_time(). Try
    it out. You should see substantially better results, down the range of tens of
    microseconds or less even when starting up Netscape.


    # One Shot vs. Periodic Timing


    RTAI supports two modes of timer tick interrupt, called periodic and one-shot.
    In periodic mode you set the timer to interrupt at a specified period. When the
    timer counter overflows and generates the interrupt, it is automatically'
  merge: -1
  img_proc: true
- pgno: 181
  md: '# Linux for Embedded and Real-time Applications


    reloaded with the correct starting number and starts over. Thus, there is no overhead
    in socalled the timer chip itself.


    In fact this is the way operating systems work. The downside is that periodic
    tasks can only be scheduled in increments of the tick interval. If the tick interval
    is one millisecond, for example, the shortest task period is one millisecond.
    Of course if you need granularity you can decrease the tick interval to, say,
    100 microseconds, or maybe even 10 microseconds. The problem here is that servicing
    the timer chip imposes some fixed overhead and the shorter the tick interval,
    the higher percentage of processor time is devoted to tick servicing. At a tick
    interval of 10 microseconds, you would probably find almost entirely devoted to
    servicing the timer interrupt, leaving little time to do real


    RTAI''s one-shot timing mode is a solution to this problem. Whereas periodic mode
    just lets the timer free, interrupting at the specified interval, one-shot mode
    reprograms the timer each time it interrupts. That is to say, at every tick interrupt,
    we compute the time to the next "event" and program the timer for that interval.
    The resolution of the timing interval is now determined by the clock driving the
    timer and not the periodic interval of timer interrupts.


    Consider a simple example involving the following three periodic tasks:


    | Task | Interval |

    |---|--|

    | Task1 | 1.3 milliseconds |

    | Task2 | 600 microseconds |

    | Task3 | 2.1 milliseconds |


    Assume for the sake of simplicity that all three tasks are started simultaneously.
    They will be ordered on a waiting list with the shortest interval first and the
    other tasks expressed as time remaining after the first interval expires:


    | Task | Remaining Interval (microseconds) |

    |---|--|

    | Task2 | 600 |

    | Task1 | 700 |

    | Task3 | 1500 |


    The timer is set for 600 microseconds. When the interrupt occurs, Task2 is made
    ready and the list is updated to reflect the next interval. In this case,'
  merge: -1
  img_proc: true
- pgno: 182
  md: 'Task2''s 600-microsecond period is still less than the remaining intervals
    for the other tasks and so the timer is again set for 600 microseconds and the
    list is updated as follows:


    | Task | Remaining Interval (microseconds) |

    | Task2 | 600 |

    | Task1 | 100 |

    | Task3 | 900 |


    At the next timer interrupt, Task2 is again made ready, the list is updated as
    follows and the timer is set for 100 microseconds:


    | Task | Remaining Interval (microseconds) |

    | Task1 | 100 |

    | Task2 | 500 |

    | Task3 | 800 |


    The tradeoff for this flexibility is more time overhead due to the need to recalculate
    remaining intervals and reprogram the timer at each tick interrupt. To give a
    feel for the overhead, the RTAI group claims that on a 233-MHz Pentium III, periodic
    mode supports tick rates up to 90 kHz while one-shot mode supports up to about
    30 kHz.


    One-shot mode is invoked by calling rt_set_one_shot_mode(). There is also a function
    rt_set_periodic_mode(), which happens to be the default.


    The "o" run-time parameter for rt_process sets up one-shot timing mode. Take a
    look at the source code of rt_process down around line 85. When one-shot mode
    is invoked the argument to start_rt_timer() is not used. In principle, the translation
    from nanoseconds to counts could be different in one-shot mode. In practice, on
    Intel processors, it''s the same. Note that we could pull the two lines,


    ```

    period = nano2count (PERIOD);

    start_rt_timer (period);

    ```


    outside the if statement. But it was done this way to make the above distinctions
    clearer.'
