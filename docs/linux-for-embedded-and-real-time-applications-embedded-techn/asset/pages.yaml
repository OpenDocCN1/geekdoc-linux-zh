  md: '# Linux for Embedded and Real-time Applications


    # Aperiodic Scheduling


    Other tasks must respond to events occurring at random times. An event may be
    the arrival of a network packet, the closure of a switch that indicates a tank
    is full, or perhaps a conversion is complete on an analog to digital converter.
    Very often these asynchronous events are communicated to the computer via interrupts.
    The interrupt service routine (ISR) must have some way to communicate the occurrence
    of the interrupt to a task that is responsible for servicing the event. We''ll
    see an example of that in the section on inter-task communication.


    # Preemptive vs. Non-preemptive Scheduling


    There are two fundamental strategies for task scheduling: preemptive and non-preemptive.
    Consider two tasks with the lower priority task currently Running and the higher
    priority task Blocked, waiting for an event that will be signaled by an interrupt.


    The upper half of Figure 8-9 shows what happens in the non-preemptive case. The
    ISR causes the higher priority task to transition to the Ready state but at the
    end of the ISR, control returns to the lower priority task where it was interrupted.
    Later when the lower priority task blocks waiting for an event, the higher priority
    task becomes the Running task.


    The lower half of Figure 8-9 shows the pre-emptive case. The difference is that
    the scheduler is invoked at the end of the ISR. It determines that the higher
    priority task is Ready and switches tasks accordingly. The lower priority task
    is thus pre-emptive.


    A non-preemptive system depends on all tasks being “good citizens” by voluntarily
    giving up the processor to be all tasks get a chance. Early versions of Windows
    were non-preemptive. Linux is preemptive although standard Linux is not considered
    real-time due to excessively long periods during preemption is disabled.


    Preemptive systems provide for more predictable response times because a high-priority
    event is serviced immediately. This is the essence of real-time—'
  merge: -1
  img_proc: true
- pgno: 144
  md: '# Introduction to Real-time Programming


    ![](img/e081ebf3b04d47734031d23bd4787db5_144_0.png)


    Figure 8-9: Scheduling: Non-Preemptive vs. Preemptive


    being able to guarantee the maximum time it takes to respond to an event. In the
    non-preemptive case there is no guarantee how long it will be before the currently
    running task gives up the processor. On the other hand, preemptive systems are
    subject to resource conflict problems that may be carefully considered. We''ll
    see tools for dealing with those problems shortly.


    Two other scheduling strategies are employed among tasks of equal priority. In
    round robin scheduling, a task runs until it either blocks waiting for an event
    or voluntarily yields the processor. The distinction between blocking and yielding
    is in the latter case the task is still Ready.


    Consider that the Ready List contains three tasks, A, B and C, of equal priority
    in order. Task A, at the head of the list, is the Running task. When task A yields,
    task B becomes the Running task and the Ready List looks like this:


    B C A


    When task B yields, task C becomes the Running task and the list looks like this:


    C A B


    Thus, all tasks "get a turn" provided that they all yield. Ready tasks of lower
    priority do not get to execute until all tasks at this level block.'
