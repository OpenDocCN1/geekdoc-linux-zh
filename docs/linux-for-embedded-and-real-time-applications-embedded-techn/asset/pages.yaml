- pgno: 22
  md: '# CHAPTER 2


    # # Introducing Linux


    > Software is like sex, it''s better when it''s free.

    — Linus Torvalds


    For those who may be new to Unix-style operating systems, this chapter provides
    an introduction to some of the salient features of Linux, especially those of
    interest to embedded developers. This is by no means a thorough introduction and
    there are many books available that delve into these topics in much greater detail.


    Feel free to skim, or skip this chapter entirely, if you are already comfortable
    with Unix concepts.


    # Features


    Here are some of the important features of Linux, and Unix-style operating systems
    in general.


    +   * Multitasking - The Linux scheduler implements true, preemptive multitasking
    in the sense that a higher priority process made ready by the occurrence of an
    asynchronous event will preempt the currently running process. However, the stock
    kernel itself is not preemptible! So a process may not be preempted while it is
    executing a kernel service. Some kernel services can be rather long and the resulting
    latencies make Linux generally unsuitable for real-time applications.


    Is it "preemptible" or "preemptive" Word''s spelling checker says they''re both
    wrong. A debate on linuxdevices.com while back seemed to come down on the side
    of "ible" but not conclusively. I think I''ll stick with preemptible.'
  merge: -1
  img_proc: true
- pgno: 23
  md: '# Linux for Embedded and Real-time Applications


    +   - Multi-user – Unix evolved as a time-sharing system that allowed multiple
    users to share an expensive (at that time anyway) computer. Thus there are a number
    of features that support privacy and data protection. Linux preserves this heritage
    and puts it to good use in server environments.


    +   - Multi-processing – Linux offers extensive support for true symmetric multi-processing
    (SMP).


    +   - Protected Memory – Each Linux process operates in its own private memory
    space and is not allowed to directly access the memory space of another process.
    This prevents a wild pointer in one process from damaging the memory space of
    another process. The err access is trapped by the processor’s memory protection
    hardware and the process is terminated with appropriate notification.


    +   - Hierarchical File System – Yes, all modern operating systems—even DOS—have
    hierarchical file systems. But the Linux/Unix model adds a couple of nice wrinkles
    on top of what we’re used to with traditional PC operating systems:


    +   Links A link is simply a file system entry that points to another file rather
    than being a file itself. Links can be a useful way to share files among multiple
    users and find extensive use in configuration scenarios for selecting one of several
    files.


    +   Device-Independent I/O – Again, this is nothing new, but Linux takes the concept
    to its logical conclusion by treating every peripheral device as an entry in the
    file system. From an application’s viewpoint, there is absolutely no difference
    between writing to a file and writing to, say, a printer.'
  merge: -1
  img_proc: true
- pgno: 24
  md: '# Protected Mode Architecture


    The implementation of protected mode memory in contemporary Intel processors first
    made its appearance in the 8086. It utilizes a full 32-bit address for an addressable
    range of 4 gigabytes. Access is controlled such that a block of memory may be:
    Executable, Read or Read/Write.


    The processor can operate in one of four privilege levels. A program running at
    the highest privilege level, level 0, can do anything it wants—execute instructions,
    enable and disable interrupts, modify descriptor tables. Lower privilege levels
    prevent programs from performing operations that might be "dangerous". A word
    processing application probably shouldn''t be missing with interrupt flags, for
    example. The job of the operating system


    So application code typically runs at the lowest level while the operating system
    runs at the highest level. Device drivers and other services may run at the intermediate
    levels. In practice, however, Linux and other operating systems for Intel processors
    use only levels 0 and 3. In Linux level 0 is called "Kernel Space" while level
    3 is called "User Space"


    # Real Mode


    To begin our discussion of protected mode programming in the x86, it''s useful
    to review how "real" address mode works. Back in the late 70s, when Intel was
    designing the 8086, the designers faced the dilemma of how to access a megabyte
    of address space with only 16 bits. At the time a megabyte was considered an immense
    amount of memory. The solution they came up with for better or worse builds a
    20-bit (1 mega-byte) address out of two called the segment and offset. Shifting
    the segment value four bits to the left and adding it to the offset creates the
    20-bit linear address (see figure 2-1).


    In real mode, x86 processors have four segment registers. Every reference to memory
    derives its segment value from one of these registers. By default, instruction
    execution is relative to the Code Segment (CS). Most data references (MOV for
    example) are relative to the Data Segment (DS) and instructions that reference
    the stack relative to the Stack Segment (SS).'
  merge: -1
  img_proc: true
- pgno: 25
  md: '# Linux for Embedded and Real-time Applications


    # Segment Registers


    | 15 | 0 | Shift 4 bits |

    |---|---|---|

    | Segment | | CS: Code |

    | 18 | 0 | DS: Data |

    | + Offset | | SS: Stack |

    | 19 | 0 | ES: Extra |

    | Physical Address | |


    Figure 2-1: X86 Real Mode Addressing


    The Extra Segment (ES) is used in string move instructions and can be used whenever
    an extra data segment is needed. The default segment selection can be overridden
    with segment prefix instructions.


    A segment can be up to 64 kilobytes long and is aligned on 16-byte boundaries.
    Programs less than 64 kilobytes are inherently position-independent and can be
    easily relocated anywhere in the 1 megabyte address space. Programs larger than
    64 kilobytes, either in code or data, require multiple segments and must explicitly
    manipulate the segment registers.


    # Protected Mode


    Protected mode still makes use of the segment registers, but instead of providing
    a piece of the address directly, the value in the segment register (now called
    the selector) becomes an index into a table of segment descriptors. The segment
    descriptor fully describes a block of memory including, among other things, its
    base and limit (see Figure 2-2). The linear address in physical memory is computed
    by adding the offset in the logical address to the base contained in the descriptor.
    If the resulting address is greater than the limit specified in the descriptor,
    the processor signals a memory protection fault.


    A descriptor is an 8-byte object that tells us everything we need to know about
    a block of memory.'
  merge: -1
  img_proc: true
- pgno: 26
  md: '# Introducing Linux


    ![](img/e081ebf3b04d47734031d23bd4787db5_26_0.png)


    Figure 2-2: Protected Mode Address Calculation


    **Base Address[31:0]** Starting address for this block/segment.


    **Limit[19:0]** Length of this segment. This may be either the length in bytes
    (up to 1 megabyte) or the length in 4 kilobyte pages. The interpretation is defined
    by the Granularity bit.


    **Type** A 4-bit field that defines the kind of memory that this segment describes


    S 0 = This descriptor describes a "System" segment. 1 = This descriptor describes
    a code or data segment.


    **DPL** Descriptor Privilege Level. A 2-bit field that defines minimum privilege
    level required to access this segment.


    **P** Present. 1 = The block of memory represented by this descriptor is present
    in memory. Used in paging.


    **G** Granularity. 0 = Interpret Limit as bytes. 1 = Interpret Limit as 4 kilobyte
    pages


    Note that with the Granularity bit set to 1, a single segment descriptor can represent
    the entire 4 gigabyte address space.'
  merge: -1
  img_proc: true
- pgno: 27
  md: '# Linux for Embedded and Real-time Applications


    Normal descriptors (S bit = 1) describe memory blocks representing data or code.
    The Type field is four bits where the most significant bit distinguishes between
    code and data segments. Code segments are executable, data segments are not. A
    code segment may or may not also be readable. A data segment may be writable.
    Any attempted access that falls outside the scope of the Type field—attempting
    to execute a data segment for example—causes a memory protection fault.


    # “Flat” vs. Segmented Memory Models


    Because a single descriptor can reference the full 4-gigabyte address space, it
    is possible to build your system by reference to a single descriptor. This is
    known as “flat” model addressing and is, in effect, a 32-bit equivalent of the
    addressing model found in most 8-bit microcontrollers as well as the “tiny” memory
    model of DOS. All memory is equally accessible and there is no protection.


    In order to take advantage of the protection features built into Protected Mode,
    you must allocate different descriptors for the operating system and applications.
    Figure 2-3 illustrates the difference between flat model and segmented model.


    ![](img/e081ebf3b04d47734031d23bd4787db5_27_0.png)


    Figure 2-3: “Flat” vs. Segmented Addressing'
  merge: -1
  img_proc: true
- pgno: 28
  md: '# Paging


    Paging is the mechanism that allows each task to pretend that it owns a very large
    flat address space. That space is broken down into 4 kilobyte pages. Only the
    pages currently being accessed are kept in main memory. The others reside on disk.


    As shown in Figure 2-4, paging adds another level of indirection. The 32-bit linear
    address derived from the selector and offset is divided into three fields. The
    high-order ten bits serve as an index to the Page Directory. The Page Directory
    Entry (PDE) points to a Page Table. The next ten bits in the linear address provide
    an index into that table. The Page Table Entry (PTE) provides the base address
    of a 4 kilobyte page in physical memory called a Page Frame. The low-order twelve
    bits of the original linear address supplies the offset into the page frame. Each
    task has its own Page Directory pointed to by processor control register CR3.


    | 31 | 22 21 | 12 11 | 0 |

    | Linear Address | Directory | Page | Offset |


    ![](img/e081ebf3b04d47734031d23bd4787db5_28_0.png)


    Figure 2-4: Paging


    At either stage of this lookup process may turn out that either the Page Table
    or the Page Frame is not present in physical memory. This causes a Page Fault,
    which in turn causes the operating system to find the corresponding page on disk
    and load it into an available page in memory. This in turn may require “swapping
    out” the page that currently occupies that memory.'
  merge: -1
  img_proc: true
- pgno: 29
  md: '# Linux for Embedded and Real-time Applications


    A further advantage of paging is that it allows multiple tasks or processes to
    easily share code and data by simply mapping the appropriate sections of their
    individual address spaces into the same physical pages.


    Paging optional—you don''t have to use it, although Linux does. Paging is controlled
    by a bit in processor register CR0.


    Page Directory and Page Table entries are each four bytes long, so the Page Directory
    and Page Tables are a maximum of 4 kilobytes, which also happens to be the Page
    Frame size. The high-order 20 bits point to the base of a Page Table or Page Frame.
    Bits 9 to 11 are available to the operating system for its own use. Among other
    things, these could be used to indicate that a page is to be “locked” in memory—i.e.,
    not swappable.


    Of the remaining control bits the most interesting are:


    +   P Present. 1 = this page is in memory. If this bit is 0, referencing this
    Page Directory or Page Table entry causes a page fault. Note that when P == 0
    the remainder of the entry is not relevant.


    +   A Accessed. 1 = this page has been read or written. Set by the processor but
    cleared by the OS. By periodically clearing the Accessed bits, the OS can determine
    which pages haven''t been referenced in a long time and are therefore being swapped
    out.


    +   D Dirty. 1 = this page has been written. Set by the processor but cleared
    by the OS. If a page has not been written to, there is no need to write it back
    to disk when it has to be swapped out.


    # The Linux Process Model


    The basic structural element in Linux is a process consisting of executable code
    and a collection of resources like data, file descriptors and so on. The resources
    are fully protected so that one process can''t directly access the resources of
    another. In order for two processes to communicate with each other, they must
    use the inter-process communication mechanisms defined by Linux, such as shared
    memory regions or pipes.'
  merge: -1
  img_proc: true
- pgno: 30
  md: '# Introducing Linux


    This is all well and good as it establishes a high degree of protection in the
    system. An errant process will most likely be detected by the system and thrown
    out before it can do any damage to other processes (see Figure 2-5). But there''s
    a price to be paid in terms of excessive overhead in creating processes and using
    the inter-process communication mechanisms.


    # UNIX Process Model


    | DATA | DATA | DATA |

    | --- | --- | --- |

    | CODE | CODE | CODE |


    # Multi-threaded Process


    | DATA |

    | THREAD | THREAD | THREAD |

    | 1 | 2 | 3 |


    Figure 2-5: "Processes" vs. "Threads"


    A thread on the other hand is code only. Threads only exist within the context
    of a process and all threads in one process share its resources. Thus, all threads
    have equal access to data memory and file descriptors. This model is sometimes
    called lightweight multitasking to distinguish it from the Unix/Linux process
    model.


    The advantage of lightweight taxing is that inter-thread communication is more
    efficient. The drawback, of course, is that any thread can clobber any other thread''s
    data. Historically, most real-time operating systems have been structured around
    the lightweight model. In recent years the cost of memory protection hardware
    has dropped dramatically. In response, many RTOS vendors now offer protected mode
    versions of their systems that look like the Linux process model.'
  merge: -1
  img_proc: true
- pgno: 31
  md: "# Linux for Embedded and Real-time Applications\n\n# The fork() function\n\n\
    Linux starts life with one process, the init process, created at boot time. Every\
    \ other process in the system is created by invoking fork(). The process calling\
    \ fork() is termed the parent and the newly created process is termed the child.\
    \ Every process has ancestors and may have descendants, depending on who created\
    \ who.\n\nIf you've grown up with multitasking operating systems where tasks are\
    \ created from functions by calling a task creation service, the fork process\
    \ can seem downright bizarre. fork() creates a copy of the parent process—code,\
    \ data, file descriptors and any other resources the parent may currently hold.\
    \ This could add up to megabytes of memory space to be copied. To avoid copying\
    \ a lot of stuff that may be overwritten anyway, Linux employs a copy-on-write\
    \ strategy.\n\nfork() begins by making a copy of the process data structure and\
    \ giving it a new process identifier (PID) for the child process. Then it makes\
    \ a new copy of the Page Directory and Page Tables. Initially the page table entries\
    \ all point to the same physical pages as the parent process. All pages for both\
    \ processes are set to read-only. When one of the processes tries to write, that\
    \ causes a page fault, which in turn causes Linux to allocate a new page for that\
    \ process and copy over the contents of the existing page.\n\n# Listing 2-1: Trivial\
    \ Example of Fork\n\n```\n#include <unistd.h>\n#include <>\n\npid_t pid;\n\nvoid\
    \ do_child_thing(void)\n{\n    printf(\"I am the child. My PID is %d\\n\", pid);\n\
    }\nvoid do_parent_thing(void)\n{\n    printf(\"I am the parent. My child's PID\
    \ is %d\\n\", pid);\n}\n```\n\n18"
  merge: -1
  img_proc: true
- pgno: 32
