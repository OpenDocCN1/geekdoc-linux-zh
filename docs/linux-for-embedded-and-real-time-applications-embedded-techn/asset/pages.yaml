    leaving copying facilities unguarded and failing to censor them)


    All their practices resemble those used in the former Soviet Union, where every
    copying machine had a guard to prevent forbidden copying, and where individuals
    had to copy information secretly and pass it from hand to hand as "samizdat".
    There is of course a difference the motive for information control in the Soviet
    Union was political; in the US the motive is profit. But it is the actions that
    affect, not the motive. Any attempt to block the sharing of information whatever
    leads to the same methods and the same harshness.


    Owners make several kinds of arguments for giving them the power to control how
    we use information:


    +   - Name calling

    Owners use swear words such as "piracy" and "theft," as well as expert terminology
    such as "intellectual property" and "damage," to suggest a certain law of thinking
    in the public—a simplistic analogy between programs and physical objects.

    Our ideas and notions about property for material objects are about whether it
    is right to take an object away from someone else. They don''t directly apply
    to making a copy of something. But the owners ask us to apply them anywhere.


    +   - Exaggeration

    Owners say that they suffer "harm" or "economic-loss" when users copy programs
    themselves. But the copying has no direct effect on the owner and it harms no
    one. The owner can lose only if the person who made the copy would otherwise have
    paid for one from the owner.'
  merge: -1
  img_proc: true
- pgno: 258
  md: '# Why Software Should Not Have Owners


    A little thought shows that most people would not have bought copies. Yet the
    owners compute "losses" as if and every one would have bought a copy. That is
    exaggeration—to put it kindly.


    +   - The law.


    Owners often describe the current state of the law, and the harsh penalties they
    can threaten us with. Implicit in this approach is the suggestion that today''s
    law reflects an unquestionable view of morality—yet at the same time, we are urged
    to regard these penalties as facts of nature that cannot be blamed on anyone.


    This line of persuasion isn''t designed to stand up to critical thinking; it''s
    intended to reinforce a habitual mental pathway.


    It''s elementary that laws do not decide right and wrong. Every American should
    know that, forty years ago, it was against the law in many states for a black
    person to sit in the front of a bus; but only racists sitting there was wrong.


    +   - Natural rights.


    Authors often claim a special connection with programs they have written, and
    go on to assert that, as a result, their desires and interests concerning the
    program simply outweigh those of anyone else—or even those of the whole rest of
    the world. (Typically companies, authors, hold the copyrights on software, but
    we are expected to ignore this discrepancy.)


    To those who propose this as an ethical axiom—the author is more important than
    you—I can only say that I, a notable software author myself, call it bunk.


    But people in general are only likely to feel any sympathy with the natural rights
    claims for two reasons.


    One reason is an overstretched analogy with material objects. When I cook spaghetti,
    I do object if someone else eats it, because then I cannot eat it. His action
    hurts me exactly as much as it benefits him;'
  merge: -1
  img_proc: true
- pgno: 259
  md: '# Linux for Embedded and Real-time Applications


    only one of us can eat the spaghetti, so the question is, which? The smallest
    distinction between us is enough to tip the ethical balance.


    But whatever you run or change a program I wrote affects you directly and me only
    indirectly. Whether you give a copy to your friend affects you and your friend
    much more than it affects me. I shouldn''t have the power to tell you not to do
    these things. No one should.


    The second reason is that people have been told that natural rights for authors
    is the accepted and unquestioned tradition of our society.


    As a matter of history, the opposite is true. The idea of authors was proposed
    and decisively rejected by the US Constitution was drawn up. That''s why the Constitution
    only permits a system of copyright and does not require one; that''s why it says
    that copyright must be temporary. It also states that the purpose of copyright—not
    to reward authors. Copyright does reward authors somewhat, and publishers more,
    but that is intended as a means of modifying their behavior.


    The real established tradition of our society is that copyright cuts into the
    natural rights of the public—and that this can only be justified for the public''s
    sake.


    +   Economics.


    The final argument made for having owners of software is that this leads to production
    of more software.


    Unlike the others, this argument at least takes a legitimate approach to the subject.
    It is based on a valid goal—satisfying the users of software. And it is empirically
    clear that people will produce more of something if they are well paid for doing
    so.


    But the economic argument has a flaw: it is based on the assumption that the difference
    is only a matter of how much money we have to pay. It assumes that “production
    of software” is what we want, whether the software has owners or not.


    246'
  merge: -1
  img_proc: true
- pgno: 260
  md: '# Why Software Should Not Have Owners


    People readily accept this assumption because it accords with our experiences
    with material objects. Consider a sandwich, for instance. You might be able to
    get an equivalent sandwich either free or for a price. Whether or not you have
    to buy it, the sandwich has the same taste, the same nutritional value, and in
    either case you can only eat it once. Whether you get the sandwich from an owner
    or not cannot directly affect anything but the amount of money you have afterwards.


    This is true for any kind of material object—whether or not it has an owner does
    not directly affect what it is, or what you can do with it


    But if a program has an owner, this very much affects what it is, and what you
    can do with a copy if you buy one. The difference is not just a matter of money.
    The system of owners of software encourages software owners to produce something—but
    not what society really needs. And it causes intangible pollution that affects
    us all.


    What does society need? It needs information that is truly available to its citizens—for
    example, programs that people can read, fix, adapt, and improve, not just operate.
    But what software owners typically deliver is a black box that we can''t study
    or change.


    Society also needs freedom. When a program has an owner, the users lose freedom
    to control part of their own lives.


    And above all society need to encourage the spirit of voluntary cooperation in
    its citizens. When software owners tell us that helping our neighbors in a natural
    way is "piracy", they pollute our society''s civic spirit.


    This is why we say that free software is a matter of freedom, not price.


    The economic argument for owners is erroneous, but the economic issue is real.
    Some people use useful software for the pleasure of writing it or for admiration
    and love; but if we want more software than those people write, we need to raise
    funds.'
  merge: -1
  img_proc: true
- pgno: 261
  md: 'For ten years now, free software developers have tried various methods of finding
    funds, with some success. There''s no need to make anyone rich: the median US
    family income, around $35k, proves to be enough incentive for many jobs that are
    less satisfying than programming.


    For years, until a fellowship made it unnecessary, I made a living from custom
    enhancements of the free software I had written. Each enhancement was added to
    the standard released version and then eventually became available to the general
    public. Clients paid me so that I would work on the enhancements they wanted,
    rather than on the features I would otherwise have considered highest priority.


    The Free Software Foundation (FSF), a tax-exempt charity for free software development,
    raises funds by selling GNU CD-ROMs, T-shirts, manuals, and deluxe distributions
    (all of which users are free to copy and change), as well as donations. It now
    has a staff of five programmers, plus three employees who mail orders.


    Some free software developers make money by selling support services. Cygnus Support,
    with around 50 employees [when this article was written], estimates that about
    15 per of its activity is free software development—a respectable percentage for
    a software company.


    Companies including Intel, Motorola, Texas Instruments and Analog Devices have
    combined to fund the continued development of the free GNU compiler for the language
    C. Meanwhile, the GNU compiler for the Ada language is being funded by the US
    Air Force, which believes this is the most cost-effective way to get a high quality
    compiler. [Air Force funding ended some time ago; the GNU Ada Compiler is now
    in service, and its maintenance is funded commercially.]


    All these examples are small; the free software movement is still small, and still
    young. But the example of listener-supported radio in this country [the US] shows
    it''s possible to support a large activity without forcing each user to pay.'
  merge: -1
  img_proc: true
- pgno: 262
  md: '# Why Software Should Not Have Owners


    As a computer user today, you may find yourself using a proprietary program. If
    your friend asks you to make a copy, it would be wrong to refuse. Cooperation
    is more important than copyright. But underground, closet cooperation does not
    make for a good society. A person should aspire to live an upright life openly
    with pride, and this means saying “No” to proprietary software.


    You deserve to be able to cooperate openly and freely with other people who use
    software. You deserve to be able to learn how the software works, and to teach
    your students with it. You deserve to be able to hire your favorite programmer
    to fix it when it breaks.


    You deserve free software.


    Copyright 1994 Richard Stallman Verbatim. Copying and distribution of this entire
    article is permitted in any medium, provided this notice is preserved.


    Updated: $Date: 2001/09/15 20:14:02 $Author: fsl $'
