- pgno: 203
  md: '# Linux for Embedded and Real-time Applications


    data_acq_rt.o requires the following modules:


    +   - rtai

    - rtai_sched

    - rtai_utils Provides utility functions for pthread

    - rtai_pthread

    - rtai_fifos


    The easiest way to get all of these modules loaded is to execute:


    ```

    modprobe rtai_pthread

    insmod rtai_fifos

    insmod ./data_acq_rt.o

    ```


    rtai_pthread and rtai_fifos are mutually independent so one of them can be loaded
    with insmod after the other is loaded with modprobe. OK, the second could be loaded
    with modprobe too.


    Then run ./logger. If everything is working correctly you should be able to enter
    "c < 0 < 500" and see channel 0 start "acquiring data." If not, it''s time to
    add rt_printk() statements at strategic points in data_acq_rt.c to see what''s
    going on.


    # Message Queues


    Message queues are an element of the overall POSIX standard defined as part of
    the optional Real-time extensions. The Real-time extensions are not part of standard
    Linux, least not in the version 2.4 kernels, but Posix message queues have been
    implemented in RTAI. It seems reasonable to include them in this chapter as an
    element of RTAI''s "POSIXness." The corresponding header file is called rtai_pqueue.h
    and like rtai_pthread.h it is located in /usr/src/rtai/posix/include rather than
    /usr/src/rtai/include.


    Message queues are very similar to RTAI FIFOs except that they are full duplex
    and they deal in discrete messages rather than continuous streams of bytes. Unfortunately,
    they only work between tasks in Kernel Space.'
