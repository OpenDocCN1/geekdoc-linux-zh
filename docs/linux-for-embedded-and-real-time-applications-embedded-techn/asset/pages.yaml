- pgno: 71
  md: '# Linux for Embedded and Real-time Applications


    We''ll use NFS (Network File System) to download images to our target. That means
    we have to "export" one or more directories on the workstation the target can
    mount on its filesystem. Exported directories are specified in the file /etc/exports.
    Initially this file is present but empty. Open it with an editor and insert the
    following lines:


    +   - /opt/BlueCat

    - /opt/BlueCat/demo/boot 192.168.0.200 (r, no_root_squash)


    We''ll deal with the first line in the next chapter. The second line represents
    the location from which the target will try to download a kernel image and a root
    filesystem. The IP address is that of the target. Again, for historical reasons
    I choose 200 as the node address for the target.


    Finally, we have to start the NFS server. This is accomplished with the command
    /etc/rc.d/init.d/nfs start. You can execute this command from a shell window or,
    better yet, add it near the end of /etc/rc.d/rc.local. This is the last script
    executed at boot up.


    # First Test Program


    We''re finally ready to download and run something on our target. The best place
    to start is the osloader demo. This will show how demo systems are organized and
    built. also give us a boot loader that can boot other kernel images over the network.


    # A Demo Directory Roadmap


    All of the demo directories are organized with essentially the same files and
    subdirectories. Take a look at /opt/BlueCat/demo/osloader as an example. In the
    following descriptions <project> is the name of the project and the subdirectory
    under demo/. The project directory breaks down as follows:


    # Directories


    local/ – Configuration files specific to this project. These generally end up
    in /etc or its subdirectories on the target.'
  merge: -1
  img_proc: true
- pgno: 72
  md: '# BlueCat Linux


    src/ – Source files of applications or kernel extensions specific to this project.


    # Configuration Files


    <project>,config – Config file for this project''s kernel. When you make xconfig
    this file is copied to .config in the kernel source tree. The modifications are
    made there and then the file is copied back to <project>.config. When you execute
    make kernel this file is again copied to .config in the kernel source tree.


    <project>.spec – This file provides information to build the root file system.
    The syntax looks like shell commands to create directories and nodes and config
    files. It is interpreted by the BlueCat utility mkrootfs.


    cl.txt – I added this one. It contains a command line argument for the kernel
    to redirect the console to ttyS0.


    # Makefile


    The project Makefile supports a number of targets as follows:


    +   xconfig – Copies <project>.config to usr/src/linux/.config and invokes xconfig
    from there. Then it copies the resulting .config file back to <project>.config.


    +   kernel – Builds the kernel based on <project>.config.

    rootfs – Builds the root file system based on <project>.spec.

    kdi – Builds the <project>.kdi target. See below.

    this – Builds the custom programs in src/

    all – Builds all of the above targets except xconfig.

    clean – Removes all of the target files.


    # Target Files


    These files are the result of building the Makefile targets.'
  merge: -1
  img_proc: true
- pgno: 73
  md: '# Linux for Embedded and Real-time Applications


    <project>.kernel – Compressed kernel image suitable for booting onto a target
    board over a network using the BlueCat Linux OS loader. Built by make kernel.


    <project>.disk – Compressed kernel image suitable for copying onto a floppy hard
    disk. Built by make kernel.


    <project>.rfs – Compressed RAM disk root file system image for booting onto a
    target board over a network using the BlueCat Linux OS loader, or for loading
    from a floppy disk or hard disk. Built by make roots.


    <project>.tar – Image of the root file system suitable for copying on a hard disk
    partition or for NFS-mounting. Built by make roots.


    <project>.kdi – This target contains the compressed kernel image (.disk) and the
    compressed RAM disk root file system (.rfs). It is suitable for booting onto a
    target board from a network using firmware, or programming into ROM/flash memory
    on the target. Built by make kdi.


    # Making a Boot Disk


    Once the targets are made, it’s time to create a bootable diskette. For that we
    use several invocations of the BlueCat utility mkboot. With a clean, or otherwise
    unnecessary, diskette in the drive, execute the following set of commands in the
    directory /opt/BlueCat/demo/osloader:


    mkboot -b /dev/fd0 – Writes a boot sector to the diskette.


    mkboot -k osloader.disk/dev/fd0 – Copies the kernel image to the diskette.


    mkboot -c cl.txt /dev/fd0 – Creates a command line for the kernel using the contents
    of cl.txt.


    mkboot -f osloader.rfs /dev/fd0 – Copies the root filesystem to the diskette.


    mkboot -r /dev/fd0/dev/fd0 – Sets the device node on the target board to mount
    as the root file system or uncompress the file system image.


    After each of these operations mkboot will report on the current status of the
    diskette. The first time you build a bootable diskette it is important that you
    do these steps in the order shown. Later on you may find it necessary to'
  merge: -1
  img_proc: true
- pgno: 74
  md: 'modify one or more elements of the root filesystem. You may then execute the
    mkboot -f command without executing any of the commands that came before it.


    However, if you change the kernel and have to rebuild it, you will have to reexecute
    the mkboot -k command. More than likely the new kernel is larger than the old
    one and this will overwrite part of the root filesystem. You will then have to
    re-execute the mkboot -f command.


    # Executing the Target Image


    Take the diskette created in the previous section and insert it into your target
    system. Turn on power or reboot and while the target is coming up, execute minicom
    beast (or whatever name you saved the minicom configuration under) in a shell
    window on the workstation. You should see the normal stream of messages that come
    out of a Linux kernel booting up.


    This particular system doesn''t do a lot. About all it can do, in fact, is to
    boot another kernel image and root filesystem through NFS using BLOSH, the BlueCat
    Linux Loader. BLOSH is a shell-like utility with a small set of built-in commands
    for downloading and executing file images.


    When the target finishes booting it presents the BLOSH prompt, ">". Type "set"
    to see the BLOSH environment variables. These define the target parameters such
    as network interface and IP address, NFS host, kernel image and root filesystem
    (see Figure 4-5). BLOSH gets these values from a startup file called shell.rc.


    On your workstation go to /opt/BlueCat/demo/bookdemo/shell and copy the files
    shell.kernel and shell.rfs to ... Note in Figure 4-5 that these are the files
    that BLOSH expects to download as the kernel image and root filesystem respectively.


    Back in the shell window with minicom running, enter the command boot. This will
    cause the files shell.kernel and shell.rfs to be downloaded through NFS. The Linux
    kernel contained in shell.kernel will then start and it will mount the root filesystem
    contained in shell.rfs.'
