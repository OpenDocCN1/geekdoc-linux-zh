    # Mailbox functions


    Mailboxes are a flexible method of task-to-task communication. Tasks are allowed
    to send arbitrary size messages by using any mailbox buffer size. Clearly you
    should use a buffer sized at least as big as the largest message you envision.
    However, if you expect a message larger than the average message size very rarely,
    you can use a smaller buffer without much loss of efficiency. In such a way you
    can set up your own mailbox usage protocol, e.g. using fixed size messages with
    a buffer that is an integer multiple of such size guarantees that each message
    is sent/received automatically to/from the mailbox. Multiple senders and receivers
    are allowed and each will get the service it requires in turn, according to its
    priority.


    ```

    int rt_mbx_init (MBX* mbx, int size);

    ```


    Initializes a mailbox of size size. mbx points to a statically allocated mailbox
    structure. RTAI will dynamically allocate the buffer space.


