  md: '# A Hardware Platform for Network Intrusion Detection and Prevention


    Chris Clark,¹ Wenke Lee,² David Schimmel,¹ Didier Contis,¹ Mohamed Koné,² Ashley
    Thomas²


    ¹School of Electrical and Computer Engineering

