    While ratio is an ideal algorithm for our purposes, it has one main flaw. It is
    NP-complete (for see Ref. [19]). Basically, it is necessary to consider an exponential
    number of potential clusterings in each step. This makes a practical implementation
    infeasible. The heuristics that have been proposed in Ref. [19] are also not suitable
    as they assume and require the graph to be undirected, which is not the case for
    our ADAG.


    To address this problem, we propose a heuristic that uses the ratio metric, but
    is less computationally complex.


    # 13.3.3 Maximum Local Ratio Cut


    Instead of using the top-down approach that requires the exploration of possible
    clusterings that grows exponentially with $n$, we propose to use a bottom-up approach
    in our heuristic, we call *maximum local ratio cut* (MLRC). It is called “local”
    ratio cut, as MLRC makes a local decision when merging nodes. MLRC operates as
    follows:


    +   1. Start with ADAG, $A_i$ that has all nodes separated.

    2. For each pair $(i,j)$ compute the local ratio cut $r_{ij}$.

    3. Find the pair $(i_{max},j_{max})$ that has the maximum ratio cut.

    4. If the maximum ratio cut drops below the threshold ($r_{imax} < r_{terminate}$)
    stop the algorithm. $A_i$ is the final result.

    5. Merge $i$ and $j$ into a clustering in $A_{new} = A_{i-1}$.

    6. Set $A_i = A_{new}$ and repeat steps 2 through 6.


    The intuition behind MLRC is to find the pair of nodes that should be least separated
    (i.e., one that has a lot of dependency and does little processing). As a result,
    clusters will be merged and the process applied recursively. This pair is then
    merged and show that a lot of internal dependencies and little dependencies with
    other clusters.


    Of course, this is a heuristic and therefore cannot find the best solution for
    all possible ADAGs. The following argues why MLRC performs well:


    +   If two nodes show a large ratio between them, it is likely that they belong
    to the same cluster in the optimal ratio cut solution.'
