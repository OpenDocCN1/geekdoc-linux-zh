    # Mode of operation


    We have so far considered only the Electronic Codebook (ECB) mode of encryption.
    This allows each data block to be processed independently, in parallel. However,
    a particular plaintext will always be encrypted to the same ciphertext. Therefore
    a codebook can be obtained and the privacy will be compromised once the relation
    between the ciphertext and plaintext is known.


    More sophisticated modes offer protection from repeated plaintext-ciphertext pairs,
    and still allow packets to be processed in parallel. The Counter Mode (CTR) is
    one such mode that was recently added to NIST’s approved list [16]. As proposed
    on the NIST’s recent call for modes-of-operation [17], the Offset Codebook mode
    (OCB) [18] and the Carter-Wegman + Counter dual-use mode (CWC) [19] can also be
    operated in parallel.


    Another publication [15] discusses the details of our implementation of OCB mode.
