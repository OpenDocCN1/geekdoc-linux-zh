  md: '# 13 Application Analysis and Resource Mapping for Heterogeneous Network Processor
    Architectures


    Ramaswamy Ramaswamy, Ning Weng, Tilman Wolf

    Department of Electrical and Computer Engineering, University of Massachusetts
    at Amherst


    Computer networks have progressed from simple store-and-forward communication
    networks to more complex systems. Packets are not only forwarded, but also processed
    on routers in order to implement increasingly complex protocols and applications.
    Examples for such processing are network address translation (NAT) [1], firewalls
    [2], web switches [3], TCP/IP offloading for high-performance storage servers
    [4], and encryption for virtual private networks (VPN).


    To handle the increasing functional and performance requirements, router designs
    have moved away from hard-wired ASIC engines. Instead, software-programmable network
    processors (NPs) have been developed in recent years. These NPs are typically
    single-chip multiprocessors with high-performance I/O components. A network processor
    is usually located on each input port of a router. Packet-processing tasks are
    performed on the network processor before the packets are passed through the router
    switching fabric and to the next network link. This is illustrated in Figure 13.1.
    Conceptual examples for such systems are the Intel XP2800 [5], IBM PowerNP [6],
    and EZChip NP-1 [7].


    Due to the performance demands on NP systems, not only general-purpose RISC coprocessors
    are used, but also a number of specialized coprocessors. It is common to find
    coprocessors for checksum computation, address lookup, hash computation, encryption
    and authentication, and memory management functions. This leads to network processor
    architectures with a number of different processing resources. The trend towards
    more heterogeneous NP architectures will continue with the advances in CMOS technology
    as an increasing number of processing resources can be put on an NP chip. This
    allows for NP'
