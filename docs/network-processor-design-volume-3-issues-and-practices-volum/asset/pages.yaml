  md: '# RNOS—A Middleware Platform for Low-Cost Packet-Processing Devices


    Jonas Greutert

    NetModule AG, Switzerland

    Lothar Thiele

    Department of Electrical Engineering and Information Technology,

    ETH Zurich, Switzerland


    A lot of focus has been put and is being put on research for high-performance
    core and edge network devices. The research objective is mainly the processing
    power, that is, the number of packets per second that can be processed, and the
    extensibility of those systems. The issues that are addressed are optimal design,
    new architectures, better algorithms, and implementation methods and tools, for
    see example Refs. [1–3].


    There is another class of devices with different objectives. Small embedded devices,
    that have simple architectures and low performance, are deployed in large numbers.
    They are gateways of any type and sensor/actuator devices with network attachment,
    providing a variety of services. Although these devices do not have a high capacity
    to process packets, they often have stringent demands to the real-time processing
    of certain flows. The keeping of deadlines is more important than the actual number
    of packets that can be processed. Just being faster would not help in most cases.
    Typically, these devices are low cost and are built around a standard communication
    controller, that they do not contain a highly specialized network processor. Packet
    processing is usually only part of the complete application that is running on
    these devices, although a critical part with respect to predictability.


    Significant work has been done in developing architectures for software-based
    routers. In Click [4] applications are composed of elements, which is a natural
    way to design networking applications. Click, however, lacks the concept of flows
    and does not provide any mechanism to schedule the available resources. The Scout
    OS [5] has explicit paths to improve resource allocation'
  merge: -1
