    system utility, stored in OS kernel buffers, and then copied to NIDS application
    buffers for processing and analysis.


    We use Snort [16] as an example to describe the main stages of packet processing
    and analysis in NIDS. In the Snort software, each captured packet goes through
    the following steps:


    +   1. *Packet decoding.* Decodes the header information at the different protocol
    layers and stores the information in data structures. All packets go through this
    step.


    +   2. *Preprocessing.* Calls each preprocess function in order, if applicable.
    The preprocessors used by default include IP fragment reassembly and TCP stream
    reassembly.


    +   3. *Detection.* First, the values in a packet''s header are used to select
    an appropriate subset of rules for further inspection. This subset consists of
    all rules that are applicable to that packet. Second, the selected rules are evaluated
    sequentially.


    +   4. *Decision.* When there is a match with one of the detection rules, its
    corresponding action, alert, or logging function is carried out.


    A NIDS can be considered a queuing system where the buffers are the queues and
    the NIDS is the service engine. Obviously, if the NIDS processes the packets slower
    than their arrival, the buffers can be filled and the newlyarriving packets will
    be dropped (i.e., not stored). If this occurs, the NIDS may not have sufficient
    information to accurately analyze the traffic and will fail to detect intrusions.
    Therefore, it is very important to design and implement NIDS to minimize (or eliminate)
    dropped packets.


    In our benchmarking experiments where the service ratios of the above steps are
    roughly: 3 for decoding, 10 for processing, and 30 for detection. Logging can
    be very slow because of network or I/O. We also observe packet drops when the
    traffic rate goes above 50 Mbps.


    In preprocessing, the bulk of compute-time is spent on bookkeeping and requires
    frequent memory accesses. For example, fragments of IP packets and segments of
    TCP streams need to be stored in data structures and spent testing the conditions
    of the detection rules by one. A typical NIDS can have thousands of detection
    rules, and each rule can have several conditions that require pattern (or keyword)
    matching or statistics computation. Another system factor that slows down NIDS
    is the inefficiency of the network data path. Packet data is captured'
