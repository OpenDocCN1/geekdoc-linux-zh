    # 6.2.2 Snort Hardware Implementation


    We use Snort [16], a popular open-source NIDS software package, as the basis of
    our prototype NNIDS because it is loosely-coupled and easy to customize. Here,
    we briefly describe the main components of the Snort software. The capturing and
    filtering module is based on libpcap[21]. The packets are passed to the decoder
    to process the various packet headers. Each packet then passes through a series
    of preprocessors, including IP fragment reassembly and TCP stream reassembly.
    Then the packets are checked by the detection engine. Snort rules are organized
    in two phases. The first phase assigns a packet to a group based on the values
    of some header fields. The set of rules loaded at configuration time determines
    the number of groups and the header values associated with each group. The second
    phase performs analysis that depends on the assigned group, but usually includes
    a full search of the packet payload for a large number of patterns. Finally, the
    decision engine uses the results of the detection phase to take appropriate action.


    Our task was to modify and reconstruct the sequential Snort software to create
    a multithreaded, pipelined hardware implementation. To do this, we followed two
    important design principles. The first principle is to intelligently structure
    the pipeline so that unwanted (or uninteresting) data can be filtered out as early
    as possible. In our design, when it is appropriate according to the site-specific
    configuration policy, the first phase of rule-matching is moved ahead of several
    preprocessors to reduce the amount of subsequent processing for packets that do
    not trigger a match. The second principle is to split a Snort module if it has
    multiple processing stages with very different service times. Assigning the stages
    to different processing engines increases packet-level parallelism in'
