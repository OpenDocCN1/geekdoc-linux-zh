    algorithm [13]. Boyer-Moore is similar to Aho-Corasick, but is limited to searching
    for a single pattern at a time.


    # 10.5 CONCLUSIONS


    In this chapter, it was demonstrated that NPUs are a promising platform for implementing
    certain algorithms in bio-informatics that could benefit from the NPU''s parallelism.
    We have shown how the Blast algorithm was successfully implemented on a fairly
    slow IXP NPU. The performance was equivalent to an implementation on a Pentium
    running at a much higher clock rate. As we have made few attempts to optimize
    our solution, there can be no doubt that NPUs are an interesting platform in fields
    other than networking in general and in DNA processing in particular.


    Although the Aho-Corasic algorithm itself is fairly efficient, many improvements
    of Blast have been proposed in the literature. Moreover, several simple changes
    to IXPBlast are expected to boost performance significantly. First, a trivial
    improvement for IXPBlast is to switch to amino acids (effectively looking at three
    nucleotides at a time). Second, the Aho-Corasic algorithm that was used in IXPBlast
    can itself be improved. Research projects exist that make the algorithm even faster
    or more memory efficient (e.g., Ref. [9]). So far, we have not exploited any of
    these optimizations. While, implementing the feedback mechanism between sender
    and IXP will not change the number of cycles spent on processing the data, it
    will decrease the duration of the process'
