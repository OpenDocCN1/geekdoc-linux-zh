    # TABLE


    Recall of the three types of uniprocessor cache misses, conflicts are the only
    type we can manipulate further for a given segment size (some compulsory misses
    are avoided via preloading, and capacity misses are determined by segment size).
    Since they can be manipulated, we discuss the sources of conflicts and techniques
    for reducing them in the following sections.


    # 2.3.3 Sources of Conflict Misses


    Cache conflict misses can result when two or more addresses map to the same set;
    this can be called a spatial conflict. Spatial conflicts are a necessary but insufficient'
  merge: -1
  pgno: 38
- img_proc: true
  md: '# 2.3 Experimental Evaluation


    condition for conflict misses: there must also be a temporal conflict between
    the addresses (i.e., the references must be interleaved with one another over
    time). If the addresses are not referenced near one another in time, then few,
    if any, conflict misses will result.


    In a multithreaded processor, there are two possible sources of conflict misses:
    intrarread and interthread. Intrarread conflicts arise when addresses within one
    thread conflict. Interthread conflicts are possible when different threads share
    a segment and their address request patterns conflict; we consider segment sharing
    like this in Section 2.3.6.


    If we know in advance which paths are most likely to be executed, then it is possible
    for us to schedule our program into memory in such a way to minimize spatial conflicts
    between instructions on the frequently executed paths; we consider this topic
    in the following section. There are also well-known hardware techniques for reducing
    conflict misses as well, and we consider them in Section 2.3.3.


    # 2.3.4 Profile-Driven Code Scheduling to Reduce Misses


    As can be seen in Figure 2.3, a fraction of static instructions are responsible
    for a majority of the dynamic references. By using profile information, we can
    identify those instructions that occur most frequently and position them in memory,
    so that they conflict with other infrequently executed (or ideally nonexistent)
    instructions. This general technique is called code-scheduling or code-reordering
    and is well studied [10].


    Code scheduling is a particularly appropriate technique for NP programs because
    so is known and statically fixed at compile time. Using this approach, we can
    schedule the code in our benchmark programs. The resulting effect on miss rate
    is shown in Table 2.4. There are again, several points to be:


    +   * Miss rates always decrease as segment sizes increase.

    * All locality 80 preloaded miss rates are at or below 10 percent.

    * Conflict misses rarely dominate the other types, and only do so at very low
    miss rates. It appears that conflicts have been avoided.


    2.4 directly compares miss rates for the locality 60 segment-sizing strategy,
    the only strategy we evaluate in the remainder of the paper. All miss rates for
    that strategy are now below 26 percent with most being below 10 percent.'
