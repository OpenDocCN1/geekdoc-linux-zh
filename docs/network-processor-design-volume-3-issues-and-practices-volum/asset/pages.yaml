    One way around this is to use cache line pinning to keep high-priority code from
    being evicted. When a cache line is pinned, it will not be replaced on a miss.
    This works well to keep important code in place, but always causes misses in the
    lower-priority conflicting code. There are other approaches to consider, and we
    discuss these in Section 2.4. As an alternative that does not require these unavoidable
    conflicts, we propose the segmented instruction cache.


    # 2.2 SEGMENTED INSTRUCTION CACHE


    In a segmented instruction cache, each thread is assigned a segment, and this
    provides two key benefits beyond the unrestricted program sizes afforded by caches.
    First, real-time programs that cannot tolerate misses can allocate segments equal
    to their program size; this is equivalent to the fixed control case. The second
    benefit is that threads are insulated from one another and cannot conflict; most
    notably, real-time segments cannot be disturbed by other threads. This is illustrated
    in the third part of Figure 2.1.


    To implement segments, we modify the cache mapping function to include a thread-specific
    segment size and offset. In other words, rather than having a constant N entries,
    the cache is to have N(t) entries by thread t, and offset(t) indicates the position
    of the first set in the segment. Thus, the address mapping function becomes:


    ```

    (a mod N(t)) + offset(t),

    ```


    where a is the address and N(t) and offset(t) are thread t’s segment size and
    offset within the cache, respectively.


    Note that there is no change in programming model for a real-time program. The
    program gets compiled; the required segment size is equal to the program size
    and thus is known. The program must be mapped to a data processor with a sufficiently
    large segment available. In fact, one would probably map all real-time programs
    on a given data processor to the same segment, and assign unique segments only
    to nonreal-time code (since, as we will see, interthread conflicts can be problematic).


    The data processor can now support arbitrarily large nonlocal-time programs. For
    such programs, however, we must determine a segment size.'
