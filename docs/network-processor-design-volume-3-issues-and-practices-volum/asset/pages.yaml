  md: '# # 3 Efficient Packet Classification with Digest Caches


    CHAPTER


    Francis Chang, Wu-chang Feng, Wu-chi Feng

    Department of Computer Science, Portland State University

    Kang Li

    Department of Computer Science, University of Georgia


    As the number of hosts and network traffic continues to grow, the need to efficiently
    handle packets at line speed becomes increasingly important. Packet classification
    is one technique that allows in-network devices such as firewalls, network address
    translators, and edge routers provide differentiated service and access to network
    and host resources by efficiently determining how the packet should be processed.
    These services require a packet to be classified so that a set of rules can be
    applied to network header information as the destination address, flow identifier,
    port number, or layer-4 protocol type. The development of more efficient classification
    algorithms has been the focus of many research papers [1–6]. However, the hardware
    requirements of performing a full classification on each packet at current line
    rates can be overwhelming [7]. Moreover, there does not appear to be a good algorithmic
    solution for multiple classifiers containing more than two fields [8].


    A classic approach to managing data streams that exhibit temporal locality is
    not different [9]. Such caches have been shown to increase the performance of
    route lookups significantly [10, 11]. How well a cache design performs is measured
    by its hit rate for a given cache size. Generally, as additional capacity is added
    to the cache, the hit rates and performance of the packet classification engine
    should increase. Unlike caches that need to store only destination address information,
    packet classification caches require the storage of full packet headers. Unfortunately,
    due to the increasing size of packet headers (the eventual deployment of IPv6
    [12]), storing full header information can be prohibitively expensive given the
    high-speed memory that would be required to implement such a cache.'
  merge: -1
  pgno: 49
- img_proc: true
  md: '# Efficient Packet Classification with Digest Caches


    Recently, we proposed a third axis for designing packet classification algorithms:
    accuracy [13]. That is, given a certain amount of error allowed in packet classification,
    can packet classification speed be significantly increased? In a previous paper,
    we proposed the use of a modified Bloom filter [14] for packet classification.
    In that approach, classified packets satisfying a binary predicate are inserted
    into the filter that caches the decision. For instance, a network bridge would
    add flows that it has identified it should forward to the Bloom filter. Subsequent
    packets query the filter to quickly test membership before being processed. Packets
    that hit in the filter are processed immediately, based on the predicate, while
    packets that miss go to the slower full packet lookup process.


    There are three limitations of this Bloom filter cache design. First, N independent
    memory caches, where N is the number of hash levels of the Bloom filter. For a
    Bloom filter optimized for a one in a billion packet misclassification probability,
    N=30. Second, no mechanism exists to recover the current elements in a Bloom filter,
    preventing it from using efficient cache replacement mechanisms like LRU. Finally,
    a Bloom cache is effective only in storing less than 256 binary predicates. Thus,
    it is not an appropriate data structure to attach an arbitrary amount of data,
    due to the increasing number of Bloom filters required to support the data.


    In this work, we propose the notion of digest caches for efficient packet classification.
    The goal of digest caches is similar to Bloom-filter caches in that they trade
    some accuracy in packet classification in exchange for increased performance.
    Digest caches, however, allow traditional cache management policies such as LRU
    to be employed to better manage the cache over time. Instead of storing a Bloom
    filter signature of a flow identifier (source and destination IP addresses and
    protocol type), it is necessary to store a hash of the flow identifier, allowing
    for smaller-sized cache entries. We also discuss how to extend this to accelerate
    exact caching strategies by building multilevel caches with digest caches.


    Section 3.1 covers related work while Section 3.2 outlines the design of our architecture.
    Section 3.3 evaluates the performance of our design using sample network traces,
    while Section 3.4 discusses the performance overhead incurred by our algorithm
    as measured on the IXP1200 network processor platform.


    # 3.1 RELATED WORK


    Due to the high processing costs of packet classification, network appliance designers
    have resorted to using caches to speed up packet processing time. Early'
