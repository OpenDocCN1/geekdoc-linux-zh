    0 & & & 0 \ & d_{21} & & \ & & \vdots & \ d_{n1} & & \dots & d_{n,n-1} & 0 \end{pmatrix}
    \quad (13.1)$


    The goal of the clustering process is to generate a new ADAG, $A_{n''}$, that
    is based on $A_n$, but smaller ($n''<n$). Sets of nodes from $A_n$ can be combined
    to clusters, which become nodes in $A_{n''}$. If $m$ nodes $i_1 \dots i_m$ are
    combined to a cluster node $j$, $p_j = \sum_{k=1}^m p_{ik}$. The nodes $x$ on
    which $j$ depends are updated such that $d_{jx} = \sum_{k=1}^m d_{kx}$. The dependencies
    of $j$ are updated accordingly'
