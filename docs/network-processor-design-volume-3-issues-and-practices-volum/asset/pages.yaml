    the common architectural features found in most NPs and packet-processing systems.
    In Section 8.2, we describe the overall design of our programming environment,
    with Section 8.3 providing details of each component of our design, focusing particularly
    on the key research challenges and requirements. Finally, Section 8.4 summarizes
    our contributions and current status.


    # 8.1 PROBLEM DOMAIN


    Our objective is to design a programming environment that facilitates rapid development
    of portable, high-performance packet-processing applications on multicore, lightweight
    threaded packet-processing systems in general and current NP-based systems in
    particular. In what follows, we expose the characteristics of packet-processing
    applications and describe some of the architectural features found in most NPs
    and packet-processing systems. We argue that NP and packet-processing system architectures
    are qualitatively different from general-purpose systems and have a more complex
    structure. Further, packet-processing applications are structurally different
    from other applications where high performance (throughput) is required.


    # 8.1.1 Packet-Processing Applications


    Packet-processing applications receive, process, and transmit data units—generally
    referred to as packets or cells.¹ To understand the requirements these applications
    impose on system architectures and programming environments, we have analyzed
    several packet-processing applications and derived their fundamental characteristics:


    +   Packet-processing applications can be described using cyclic data-flow graphs
    [9]. Most of these graphs possess the following characteristics:


    +   - Many packet-processing functions (i.e., data-flow actors) are stateful—they
    maintain per-flow state. The state is accessed and updated while packets belonging
    to the flow. The statefulness of functions when combined with burstiness of traffic
    ensures that the number of packets belonging to different flows and of different
    types processed by the application can vary greatly over time; hence, the system
    does not reach a steady-state of operation.


    > ¹ In this chapter, the term *packet* is used to refer to any unit of network
    data transfer, including, but not limited to datagram, frame, cell, and packet.'
  merge: -1
  pgno: 163
- img_proc: true
  md: '# 8 A Programming Environment for Packet-Processing Systems


    The execution of processing functions in the data-flow graph is triggered by packet
    arrivals, timers, or other hardware events (e.g., link failure). The sequence
    of functions executed for a packet depends on its type (determined based on its
    header and content) and the state of the system.


    Packet-processing functions can be represented as M-in, N-out flows. On processing
    a packet, some functions generate multiple output packets (e.g., multicast routing);
    some functions process multiple packets and generate one output packet (e.g.,
    IP defragmentation); while some other functions generate output packets (e.g.,
    keep alive) without consuming any packets.


    +   In most applications, there is little or no dependence between packets belonging
    to different flows². Hence, packet-processing applications exhibit a high degree
    of parallelism while packets from different flows. However, within flows, many
    packet-processing applications require—because of shared flow state or other constraints—packets
    belonging to a flow to be processed and transmitted in a particular order.


    +   Throughput, as opposed to delay, is the primary performance metric for many
    packet-processing applications. Further, individual functions in most packet-processing
    applications are not compute-intensive; their performance is dominated by memory-access
    latencies (resulting from operations such as compression table lookup, routing
    table lookups, etc.). Emerging packet-processing applications often make hundreds
    of memory accesses per packet and hiding those memory access latencies to achieve
    better throughput is paramount.


    # 8.1.2 Network Processor and System Architectures


    To explore the inherent flow-level parallelism in this class of applications,
    NPs support multiple cores for processing packets. Many NPs also include general-purpose
    processors to support infrequent bursts but complex operations, and special-purpose
    units to perform operations such as encryption and checksum computation.


    To hide memory access latencies, NPs often support hardware multithreading. With
    hardware multithreading, when a thread blocks, on a memory access for example,
    another thread within the same processing unit takes over and processes a different
    packet. Further, to reduce the memory access latencies and


    > ² Flows refer to a sequence of related packets (generally transmitted between
    two application endpoints).'
