  md: "# 13.5 Mapping Application DAGs to NP Architectures\n\ncluster) or best resource\
    \ usage (i.e., highest utilization of used resources). We use minimum delay in\
    \ our example.\n\nUnfortunately, this problem, too, is NP complete. Malloy et\
    \ al. established that producing a schedule for a system that includes execution\
    \ and communication cost is NP-complete, even if there are only two processing\
    \ elements [14]. Therefore, we need to develop a heuristic to find an approximate\
    \ solution.\n\nMapping of tasks to multiprocessors has been researched extensively\
    \ and is surveyed by Kwok and Ahmad [15]. However, most of the previous work is\
    \ targeted for homogeneous multiprocessor systems. Here, we consider the mapping\
    \ of ADAGs onto a set of heterogeneous processing resources.\n\n# 13.5.2 Mapping\
    \ Algorithm\n\nIn our example, we consider the mapping of a single ADAG onto the\
    \ processing resources. The goal is to map it in such a way to minimize the overall\
    \ finish time of the last cluster. This mapping also yields maximum use of the\
    \ application's parallelism. We consider only one packet in this, but the approach\
    \ can easily be extended to the scheduling of multiple packets.\n\nThere are two\
    \ parts to our mapping and scheduling algorithm. First, we identify the nodes\
    \ that are most critical to the timely execution of the packet (i.e., the nodes\
    \ that lie on the critical path). For this purpose we introduce a metric criticality\
    \ of a node $i$. The criticality is determined by finding the critical path (bottom-up)\
    \ in the ADAG. The criticality is determined by looking at the processing time\
    \ of each cluster when using a general-purpose processor (assume that this is\
    \ resource 1). For each node $e$ (no children), the criticality is its default\
    \ processing time: $c_e = \rho_e$. For all other nodes $i$, the criticality is\
    \ the maximum criticality of its children plus its own finish time: $c_i = \\\
    max_{j \\in i} (c_j + \rho_{ij})$, where $d_{ij} > 0$.\n\nThe clusters are then\
    \ scheduled in order of their criticality that each assignment achieves the minimum\
    \ increase in overall finish time. This requires the current finish time of each\
    \ node and resource to be maintained. When determining the finish time of a cluster,\
    \ $f_i$, the finish time of all its parents (on which it depends) needs to be\
    \ considered as well as the delay due to data transfers between different processing\
    \ resources over the interconnect.\n\nThus, the mapping and scheduling algorithm\
    \ to heuristically find the earliest finish time of a processing application is:\n\
    \n+   1. Calculate each node's criticality $c_i$ as defined previously.\n\n+ \
    \  2. Sort the nodes into a list $L$ by decreasing criticality.\n\n+   3. Dequeue\
    \ $N$ with highest criticality from $L$."
  merge: -1
  pgno: 319
- img_proc: true
  md: "# 13 Application Analysis and Resource Mapping\n\n+   4. For each resource\
    \ $r_i$ determine the finish time for $N$ by adding the maximum finish time of\
    \ all parents (plus interconnect overhead) to the processing time, $\beta_{ni}$,\
    \ of $n$ on resource $r_i$. Assign $N$ to the resources that minimizes the finish\
    \ time.\n\n+   5. Repeat steps 3 through 5 until $L$ is empty.\n\nThe algorithm\
    \ is developed based on the following observation: the critical path of the ADAG\
    \ with minimal delay and all noncritical paths meet their deadlines, then the\
    \ resulting schedule is optimal. So, the critical path gives us a global view\
    \ of the ADAG, but mapping is done by local decisions to avoid exponential complexity.\n\
    \nThis algorithm uses a greedy approach: Given node $n$ tries to identify the\
    \ processing element that yields the earliest finishing time by (1) reducing communication\
    \ cost and using the same resources as its parents or (2) using a faster coprocessor\
    \ and paying for communication delay.\n\nOur mapping and scheduling algorithm\
    \ is based on the list scheduling techniques that are well explored under different\
    \ assumptions and terminology. The criticality metric is similar to assigning\
    \ a priority to the task as proposed by El-Rwin and Lewis [16] where it is static\
    \ *bottom level*. However, we use a similar algorithm and metric in the context\
    \ of a heterogeneous system. Our, the early finishing time instead of early starting\
    \ time, helps us explore the option of the fastest processor when assigning one\
    \ task to a potential processing element.\n\n# 13.5.3 Mapping and Scheduling Results\n\
    \nWe show the results of this mapping and scheduling algorithm in Figure 13.8.\
    \ It uses the $A_{20}$ ADAG for Flow Classification and an architecture with four\
    \ processors: three general-purpose processors and one coprocessor that requires\
    \ only half the instructions for the clusters (for illustration, these were picked\
    \ randomly and don't reflect actual application behavior).\n\nThe schedule in\
    \ Figure 13.8 completes the processing of the packet at time 102. This is shorter\
    \ than the original criticality of the start node due to the use of the coprocessor.\
    \ Overall, it can be that the application parallelism is exploited and the processing\
    \ resources of the network processor are used efficiently.\n\nA further exploration\
    \ of this algorithm and its impact on a scenario, where the optimization criterion\
    \ is system throughput, is currently in progress."
