    own program counters and register sets (allowing it to switch between contexts
    at zero cycle overhead). Each ME runs its code from a small (1 K) instruction
    store.


    MEs control the transfer of network packets to SDRAM in the following way. Ethernet
    frames are received at the MACs and transferred over the proprietary IX bus to
    an NPU in 64-byte chunks, known as mpackets. From these buffers (called RIFOs
    by Intel, even though they are not real FIFOs at all) the mpackets can be transferred
    to SDRAM. MEs can subsequently read the packet data from SDRAM in their registers
    in order to process it. While this description is correct as a high-level overview
    of packet reception, the actual reception process is a bit more involved.


    In Section 10.1.3, a detailed explanation of packet reception in IXPblast is given.


    On-chip there is also a small amount of RAM, known as scratch memory (4 KB on
    the IXP200) that is somewhat faster than SRAM, but considerably slower than registers.
    Table 10.1 summarizes the memory hierarchy and the access time for the most important
    types of memory (timings obtained from Ref [7]). Interestingly, the differences
    in access times between Scratch and SRAM (and SRAM and SDRAM), is only a factor
    of 1.5–2. All buses are shared and while the IX bus is fast enough to sustain
    multiple gigabit streams, memory bandwidth might become a bottleneck. Fortunately,
    the IXP provides mechanisms for latency hiding, by allowing programs to access
    memory in a nonblocking, asynchronous way.'
