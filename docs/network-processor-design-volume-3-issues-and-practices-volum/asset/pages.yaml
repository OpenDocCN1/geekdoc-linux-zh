    # 13.3.4 MLRC Complexity


    The maximum local ratio cut algorithm has a complexity that is tractable and feasible
    to implement. The algorithm runs over at most n iterations (in case terminate
    is not reached until the last step). In each iteration the ratio for i^2 pairs
    needs to be computed (which takes O(1)). Finding the maximum can easily be done
    during the computation. Thus, the total complexity is:


    ```

    $$\sum_{i=1}^{n} i^2 \times O(1) = O(n^3)$

    ```


    The space requirement for MLRC is O(n^2), which is the same complexity that is
    required to represent A_n. Thus, MLRC is a feasible solution to the NP-complete
    ratio cut algorithm. In the following section, we show the performance of MLRC
    on a set of network processing applications.


