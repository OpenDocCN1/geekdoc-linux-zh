    One of the most computationally-intensive tasks performed by Snort is pattern-matching
    on packet content [23]. Despite improved software pattern-matching algorithms
    [23, 24], pattern-matching is still the limiting factor in the analysis of high-speed
    traffic. Furthermore, the NP does not have the processing resources to handle
    this task. We eliminate this bottleneck by off-loading all the pattern-matching
    tasks to a Field-Programmable Gate Array (FPGA) coprocessor.


    The task of pattern-matching in NIDS consists of comparing a large number of known
    patterns against a stream of packets. An FPGA is well-suited for this task because
    it can implement thousands of pattern operators in parallel. We have developed
    an FPGA design that compares a packet''s content against every pattern in the
    Snort rules (over 1500 patterns) simultaneously [25]. This design provides high
    character density and high throughput, enabling the entire ruleset to fit into
    a low-end FPGA device while handling up to 1 Gbps of data.


    A block diagram of the FPGA pattern-matching coprocessor is shown in Figure 6.6.
    The design is pipelined to process one character of data per clock cycle. An input
    buffer stores 32-bit data words and serializes the bytes to output 8-bit characters.
    Next, the current decoder is


