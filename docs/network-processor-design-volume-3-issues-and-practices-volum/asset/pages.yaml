    # 12.6 A DESIGN SPACE EXPLORATION EXAMPLE


    The designed methods have resulted in a software tool called Network Application
    Mapper (NetMap). It can map the characterized packet flow graph to multiprocessors
    that use different NoC architectures. The tool makes use of the data types and
    algorithms library LED [22] to implement the introduced models and methods. To
    demonstrate the feasibility of this approach, we have analyzed the two architecture
    variants outlined in Figure 12.1 We first describe the applied system parameters
    and their origins. We present the results of the design space exploration.


    # 12.6.1 Application and System Parameters


    The resource consumption of the implementation was measured in the profiling environment
    PERFMON [21] with the profiling support available in the packet processing library
    PPL. The network simulator SAHNE [4] was used for generating the traffic. The
    received packets from one node in the simulation were handed over to a PE (equipped
    with the S-Core processor) that was simulated in a VHDL simulator. The PE executed
    all packet methods and handed over the output flow segments back to SAHNE. With
    PERFMON, the execution cycles and memory accesses of the packet methods were measured.
    Please note that only the maximum execution cycles obtained from this execution
    trace were used. Worst-case execution cycles are normally necessary since we need
    to analyze the worst-case performance of our system. As no tool was available
    to determine the worst-case execution cycles, only the results from the execution
    trace could be used. The packet sizes and bandwidth requirements of the flow segments
    were measured with the PPL profiler. The annotated flow graph in Figure 12.2 shows
    the results. The numbers at the flow segments and packet methods can be converted
    as follows (see the legend of the figure for definition of the variables):


    ```

    $B_i = \alpha_1 B_{lp}, \quad p_{min} = 8\alpha_2, \quad p_{max} = 8\alpha_3,\nEC_m
    = \beta_1, \quad MA_m = \beta_2 \cdot EC_m$ (12.20)

    ```'
