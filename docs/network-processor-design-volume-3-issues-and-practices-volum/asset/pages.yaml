    received packet. Since the transfer time of the new packet has to be equal to
    the transfer time of the old one, the bandwidth of the outgoing flow segments
    has to be increased if the packet becomes larger or decreased if it becomes smaller.
    The scaling factor can be computed by dividing the size of the modified packet
    by the size of the original packet. The bandwidth requirements of the flow to
    the $ipp$ method of the network layer is decreased since the medium access removes
    the additional information and its own header from the packet it forwards a received
    data packet to the network layer.


