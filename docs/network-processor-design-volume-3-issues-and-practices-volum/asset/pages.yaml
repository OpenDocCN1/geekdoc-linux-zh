    Emerging new communication protocol standards, such as PCI Express and RapidIO,
    give new momentum to the still unresolved search for the right set of standardized
    interfaces for network processors (NPUs).


    Network processors are often deployed on line cards in network core and access
    equipment [1]. Line cards manage the connection of the equipment to the physical
    network. They are connected to a backplane that allows packets to be distributed
    to other line cards or to control processors. Due to this usage, NPUs require
    a number of dedicated interfaces: *network interfaces* connect the processor to
    the physical network, a *switch fabric interface* connects the backplane, a *control
    plane interface* connects to an external processor that handles the control plane
    and also maintains the NPU and its peers on, *memory interfaces* for packets and
    table lookup data, and *coprocessor interfaces* are used for classification, quality-of-service,
    and cryptography accelerators. While some of these interfaces, for example, memory
    and network interfaces, are well covered and documented by different I/O standards,
    others, especially the switch fabric interface, still lack sufficient standardization
    [2].


    The recently announced enhancements to packet-oriented, link-to-link communication
    protocols, such as RapidIO, Hypertransport, and PCI Express, are aimed at addressing
    this issue [3]. Initially these interfaces were developed for host-centric systems
    with strong support of storage semantics similar to the original PCI specification.
    In the network domain, we find them deployed in their traditional role, either
    as control-plane or coprocessor interface [4].'
