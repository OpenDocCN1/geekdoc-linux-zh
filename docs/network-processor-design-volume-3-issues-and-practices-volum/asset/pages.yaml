    throughput as more are shared between flows. The decrease is over 35 percent when
    one moves from 0 percent sharing to 100 percent sharing. In a full design analysis,
    this would be balanced against the potential gains noted earlier.


    # 11.3.3 Task Partitioning


    For many applications that can be implemented in a pipelined manner, there is
    a choice concerning the task partitioning of the application. Having more tasks
    generally results in having greater flexibility in assigning the tasks to the
    hardware pipeline and in being able to use longer pipelines. This usually results
    in higher throughput.


    However, there are two potential drawbacks. First, it can be difficult to divide
    tasks beyond basic application partitioning and thus there may be a nontrivial
    personnel cost associated with this job. Second, greater task partitioning often
    results in larger communications that may increase latency and reduce throughput.
    However, in order to make a judgement it is first necessary to determine the performance
    gains that might result from such an endeavor. *Greedypipe* permits one to consider
