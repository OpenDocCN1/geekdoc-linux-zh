  md: '# 10.1.1 Scoring and Aligning


    IXPBlast is an implementation on Intel IXP1200 NPUs of the most time-consuming
    stage of the Blast algorithm for genome searches. Blast (Basic Local Alignment
    Search Tool) allows a molecular biologist to search nucleotide and protein databases
    with a specific query [2]. For illustration purposes, we assume in this chapter
    that all relevant information consists of DNA nucleotides of which there exist
    exactly four, denoted by A, C, G, and T, respectively. Nevertheless, the same
    implementation can be used for other types of sequences as well (e.g., amino acids
    or proteins).


    Blast is designed to discover the similarity of a specific sequence to the query,
    by attempting to align the two. For example, if the query exactly matches a subset
    of the sequence in the database, this will be a perfect match, resulting in the
    highest possible score in the similarity search. However, even if two sequences
    differ at various places, they might still be “similar” and hence interesting
    to the molecular biologist. For instance, researchers have located a gene (a sequence
    of DNA nucleotides) on the DNA of a zebrafish controls, the thickness of the zebrafish''s
    spinal cord and whether a similar gene exists in the human genome. Even though
    the match may not be perfect, a strong similarity might hint on functional similarity.
    The differences might be very small (e.g., the sequences are basically the same
    for a few strands of “dead”—nonfunctional—DNA), or more complicated (e.g., while
    most of the DNA is present, some subsets of the nucleotides have moved). Such
    sequences should also score high on the similarity test.


    Denoting the large sequence in the database as DNA_db (e.g., the human or zebrafish
    genome), and the (smaller) sequence that is searched for in the DNA_db as the
    query (e.g., the DNA sequence of a specific gene), we can now distinguish two
    phases in the Blast algorithm. In Phase 1, the scoring is done. Given a query,
    this phase will keep track of the alignment (a possibly small) subset of the query
    that matches a subset of DNA_db to which it is compared. In genome searches, this
    phase is the most compute intensive and exhibits high parallelism. For example,
    given n processors, each processor could be used to score one of nth. In Phase
    2 the scores are used to perform the actual alignment by searching for the area
    with maximum overall score (for instance, because a number of consecutive subsets
    have matched). This area represents the part of DNA_db that is most “similar”
    to the query and the overall score indicates how similar the two sequences are.
    By its nature, this phase is predominantly sequential. We therefore concentrate
    solely on Phase 1 of the Blast algorithm, and do not consider Phase 2 at all,
    other than to remark that it is handled using a conventional implementation on
    a Pentium processor.'
