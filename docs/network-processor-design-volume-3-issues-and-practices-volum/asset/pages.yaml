    increasing communication cost and the number of processor cores allocated in the
    pipeline. Since the pipelined tasks can be replicated as multiple threads on one
    or more MEs to process multiple packets in parallel, it is important to balance
    the rate ofipelined tasks (i.e., the number of packets processed in the pipeline
    within a given time) and the available amount of parallelism to currently process
    the packets in replicated pipelines. The ultimate objective is to maximize the
    number of packets processed in the complete system within a given period of time.


    There is a large body of parallel programming research on mapping computation
    onto multiprocessors [21-27]. The research can be broadly classified into two
    categories. The first category of research focuses on the problem of mapping parallel
    (data- and task-parallel) computations onto multiprocessors [21, 22, 24, 27].
    Most of these techniques derive a mapping such that the execution time of a single
    instance of the program is minimized. For packet-processing applications, on the
    other hand, the optimization criterion is maximization of average- or worst-case
    packet-processing throughput. The second category of research addresses the problem
    of mapping pipelined computations (e.g., streaming and DSP applications) onto
    multiprocessors [28-30]. This work is more closely related to the problem at hand.
    However, most of the prior work makes assumptions that all the units of work through
    computationally intensive tasks (when two pipeline stages are fused to create
    a new pipeline stage, its execution time requirement can be estimated simply as
    the sum of the execution time of the component stages). These assumptions do not
    hold for packet-processing applications. As we have argued earlier, at any instant,
    a packet-processing system may process multiple packets, each of which may execute
    a different sequence of functions. Therefore, in this work, we are investigating
    novel algorithms for clustering, allocation, and mapping of packet-processing
    applications onto heterogeneous, multiprocessor architectures.


    Although it is widely known that packet data structures (e.g., packet header,
