    # FPGA coprocessor


    Field-Programmable Gate Arrays (FPGAs) have been used to accelerate many different
    algorithms, often achieving orders-of-magnitude better performance than software
    implementations. This is made possible by their ability to be programmed with
    circuits customized to the given application and their capacity to perform massively-parallel
    computations. The FPGA platform consists of a board containing a Xilinx Virtex-1000
    FPGA [20], which is capable of implementing circuits with the equivalent of up
    to one million logic gates. The FPGA has a PCI interface for I/O as well as its
