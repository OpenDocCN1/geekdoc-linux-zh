    # 4.1.2 System Environment


    The communication interface interacts with its environment in two directions:
    to the outside world via the physical interface and to the network processor core
    system via the translation interface. Both directions can also be used to access
    and configure the internal state of the interface.


    The physical link is formed by one or more lanes. A lane consists of two unidirectional
    point-to-point connections for duplex communication. The bandwidth of the link
    can be scaled easily by changing the number of lanes (see Figure 4.1). In the
    case of serial, such as RapidIO and PCI Express, a lane contains only the differential
    data signals. A Hypertransport lane contains an explicit clock signal, and the
    link an additional control signal.


    The translation interface allows the NPU core either to issue a request (posted,
    nonposted) or to respond to an incoming request by returning a completion transaction
    (split transaction model). Depending on the protocol, up to four distinct address
    spaces (memory, IO, configuration, and message) can be defined to support different
    communication semantics in the system. Each interface provides a configuration
    space that holds the configuration and status information of the interface. Access
    to this space is possible via configuration transactions from both directions.
    A separate internal interface to the core can be provided for lean and direct
    access.


    # 4.1.3 Common Tasks


    The set of elementary tasks, which are required in order to provide the different
    communication interfaces, is described in Table 4.1, starting from the physical
    layer upwards. Table 4.2 groups the tasks according to their appearance at the
    different layers in RapidIO, Hypertransport, and PCI-Express. Implementations
    of the same task may vary from interface to interface due to protocol specifics.


