    that large data transfers are more efficient than small transfers. The FPGA must
    be able to obtain enough compute-time improvement over the NP to justify the cost
    of moving across the PCI bus. One task that we have successfully off-loaded to
    the FPGA—packet payload searching—will be discussed in Section 6.2.4. We are also
    pursuing a more tightly-coupled NP-FPGA interface to improve performance and enable
    a broader class of tasks to be off-loaded to the coprocessor. This would also
    allow the system to adapt to changing conditions by dynamically reallocating tasks
    between the NP and FPGA. An ideal architecture would be to have the coprocessor
    attached to the NP’s SRAM memory bus and mapped into the NP’s address space as
    shown in Figure 6.3.'
