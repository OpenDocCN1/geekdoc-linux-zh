    of a multithreading-capable processor inside the PE can be advantageous to minimize
    switching times.


    The weight $\phi_{s,PE}$ that a flow segment $s$ requires to be processed has
    to be set in such a way that the processing time is below the reception time of
    the next shortest packet $p_{s,min}$ of the flow segment. The processing time
    depends on the frequency $f_{PE}$ of the PE and the execution cycles $EC_{m_s,PE}$
    of the packet method on the PE. By knowing length of the shortest packet and the
    bandwidth requirement of the flow segment, the necessary weight $\phi_{s,PE}$
    for the GPS scheduler can compute:


