    **Example 9.2.** In our scenario, we have a flow for the VoIP data receive and
    transmit traffic, a flow for the VoIP control receive and transmit traffic, and
    a best effort flow for all other input packets.


    The SLA for the VoIP data receive traffic is very stringent if a quality comparable
    to traditional PSTN quality should be reached [13]. The SLA for VoIP-data (unidirectional)
    could be specified as follows:


    +   - Minimum bandwidth 100 kb/s

    - Maximum delay 160 ms

    - Loss probability <1%

    - Maximum jitter 120 ms


    The minimum bandwidth can be calculated by adding headers to the payload and multiply
    it by the number of packets per second. For G.711 [19] with a packet period of
    10 ms this gives 138 packets per packet which is about 108 K bit/s per direction
    (14 to 18 bytes Ethernet header, 20 bytes IP header, 8 bytes UDP header, 12 bytes
    RTP header, 80 bytes payload, and 4 bytes ERC).


    From the SLA we determine an arrival curve and a deadline. The arrival curve gives
    the lower and upper bounds for the number of packets to be processed in any time
    window. The bandwidth itself is not considered here. All the tasks in the application
    have a per- execution time only. The SLA defines a maximum jitter of 120 ms, which
    means that we could receive a burst of 12 VoIP data packets at line rate. The
    line in our scenario is 10 MB/s. A packet of size of 138 bytes requires about
    10 µs on the line. Figure 9.5 shows the arrival function for the VoIP data receive
    traffic. The total delay a user will experience consists of the network delay
    introduced by the end-systems. As we want to minimize the delay of VoIP-data traffic
    introduced by our system, we set the deadline to the execution time for the task
    path on the target system. Therefore, the flow will have maximum priority.'
