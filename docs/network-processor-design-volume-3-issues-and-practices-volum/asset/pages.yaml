    # 11.4.3 Data Compression—A Pipelined Implementation


    With compression (DC) a string of characters is transformed into a new reduced-length
    string having the same information. In this way the bandwidth required for passing
    a string is reduced. LZW is a DC method that takes advantage of recurring patterns
    of strings that occur in data files. The original LZW method was created by Ziv
    and Lempel [23] and was further refined by Welch [24].


    LZW is a "dictionary”-based compression algorithm that encodes input data by referencing
    a dictionary. Encoding a substring requires that only a single code number corresponding
