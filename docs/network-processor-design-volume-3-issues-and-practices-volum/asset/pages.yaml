    # 3.4 HARDWARE OVERHEAD


    A preliminary implementation on Intel''s IXP1200 Network Processor [28] was constructed
    to estimate the amount of processing overhead cache would add. The hardware tested
    was an IXP1200 board, with a 200 MHz StrongARM, 6 packet-processing microengines,
    and 16 ethernet ports.


    A simple micro own level layer-three forwarder was implemented as a baseline measurement.
    A cache implementation was then grafted onto the layer-three codeword base. A
    non-classifier was used, so that we could isolate the overhead associated with
    the cache routines. The cache was placed into SRAM, because scratchpad memory
    does not have a pipelined memory access queue, and the SDRAM interface does not
    support atomic bit-set operations.


    The simulation was written entirely in microengine C and performance tests were
    run in a simulated virtual machine. A tri-based longest prefix match on the destination
    address is always performed, regardless of the outcome of the cache operation.


    # 3.4.1 IXP Overhead


    The performance of our implementation was evaluated on a simulated IXP1200 system,
    with 16 virtual ports. The implementation''s input buffers were kept constantly
    filled, and we monitored the average throughput of the system.'
