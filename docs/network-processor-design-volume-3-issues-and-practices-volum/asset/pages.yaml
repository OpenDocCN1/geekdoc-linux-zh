  md: '# 9.2 Analysis Model of RNOS


    # 9.2.2 Input Model—SLA, Flows, and Microflows


    The input model has capture packet flows that are specified using service level
    agreements (SLA) and packet flows, for which we do not know exactly (or know nothing
    about) how they arrive at the system inputs.


    A service level agreement specifies end-to-end quality of service properties for
    a flow. A flow is identified by a set of common properties derived from data in
    the packet. Typically these are the incoming interface, ranges of source and destination
    IP addresses, transport protocol, and ports or port ranges. A service level agreement
    usually contains parameters as minimum bandwidth, maximum delay, loss probability,
    and maximum jitter. Another form of a T-Spec model of IETF [11].


    Each packet that received by our application belongs to a flow. There is a service
    agreement for each flow, which specifies the end-to-end properties of that flow
    and therefore how we should treat the packet inside our application, for example,
    with what priority the packet should traverse the task graph. All the packets
    that do not match a flow are associated with the best effort flow. The best effort
    flow has no-to-end quality of service properties and has lowest priority.


    Packets of the same flow might not traverse the same path in the task tree. A
    flow specification might cover a larger set of connections, a connection defined
    as having the same incoming and outgoing interface, same source and destination
    IP address, the same transport protocol, and the same source and destination port.
    In our such connection is called microflow. Packets that belong to the same microflow
    will traverse exactly the same path through the task tree. Figure 9.4 shows a
    flow that consists of two microflows; each of them traverses a different task
    path.


    Service level agreements can easily be formalized as arrival curves and deadlines
    [8, 12].


    ![](img/e172ff28bf6e0a7a974849165330f450_195_0.png)


    9.4 Flow and microflow.


