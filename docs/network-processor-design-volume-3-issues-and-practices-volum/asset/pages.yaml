  md: '# 2.5 CONCLUSIONS AND FUTURE WORK


    to provide reliable cache performance—and the code-scheduling techniques

    describe here would also work for these other proposals.


    In this chapter, we proposed the use of segmented instruction caches along with

    profile-driven code scheduling to provide flexible instruction delivery to real-

    time and nonrealtime threads running on the same multithreaded processor.

    This technique is particularly useful in NP data processors, which are multi-

    threaded yet inhibited by a fixed-size control store. The segmented instruction

    cache allows real-time programs to map into a private segment large enough

    to avoid misses while allowing nonreal-time programs to suffer misses while

    keeping all cache conflicts limited to within individual segments. This removes

    program restrictions on nonreal-time code without sacrificing guaranteed

    delivery to real-time programs. Several program-specific segment-\sizing strategies
    were evaluated, and code scheduling was seen to be an effective

    method for removing a majority of conflict misses and often reducing rates

    a selection of programs by a range of 10 to 60 percent.


    We plan to consider a number of additional topics in future work: avoid-

    ing indexing calculations and tag checks (completely for real-time segments,

    and via speculation otherwise), mechanisms to shape instruction fetch band-

    width, improving shared-segment rates, measuring sensitivity to cache

    parameters (e.g., block size), investigating the benefits of dynamically chang-

    ing segments at run-time (both for these statically-composed threads as

    well as dynamically-composed scenarios), providing sharing between segments

    data (e.g., for shared code libraries), and exploring the use of segmentation
    in data

    caches.


