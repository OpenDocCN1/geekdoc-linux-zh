    # 13.3.1 Clustering Problem Statement


    Before discussing the algorithm, let us formalize the problem that we address
    here. The ADAG, $A_n = (P_n, D_n)$, consists of a processing vector, $P_n$, and
    a dependency matrix, $D_n$. The processing vector contains the number of instructions
    that are executed in each of the $n$ processing blocks. The dependency matrix
    contains the data values that need to be transferred between pair of blocks. If
    $d_{ij}$ is nonzero, the block $i$ depends on block $j$ because it reads $d_{ij}$
    data values that are written by block $j$. (Control dependencies are considered
    to be one-value dependencies). The $n$ blocks in $A_n$ are ordered such that way
    the upper right of the dependency matrix is zero, which ensures that $A_n$ is
    a directed acyclic graph. Thus, we have:


