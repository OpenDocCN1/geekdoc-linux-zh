    FPGAs are not suitable for rapid development of new types of DNA processing tools.
    Moreover, NPUs expect to increase their clock rates at roughly the same pace as
    current microprocessors, meaning that the same code execution performs a performance
    boost for the. The clock speeds of FPGAs, on the other hand, are not expected
