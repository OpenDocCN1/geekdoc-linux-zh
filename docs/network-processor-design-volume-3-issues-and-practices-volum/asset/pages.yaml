  md: '# 4 Towards a Flexible Network Processor Interface


    capture inherent parallelism and dependencies among elements. Furthermore, Click''s
    abstraction level and the extensible element library allow us to focus on interface
    specifics.


    In Click, applications are composed in a domain-specific language from elements
    that can be linked by directed connections. The elements, written in C++, describe
    computational network operations, whereas connections specify the flow of packets
    between elements. Packets are the only data type that can be communicated. All
    application state is kept local within elements. Two patterns of packet communication
    are distinguished in Click: push and pull. Push communication is initiated by
    a source element and models the reward of packets into the system. Pull communication
    is initiated by a sink and models state that becomes available in an outbound
    source.


    Click was originally implemented on Linux using C++. Recent extensions to Click
    include Refs. [11] and [12]. In Ref. [11], a multithreaded Linux implementation
    is shown that exploits Click''s parallelism in processing packet flows. In Ref.
    [12], Shah et al. show Click, augmented with some abstract features, can be used
    as a programming model for network processors. This will become important as soon
    as we map our functional models onto a target architecture.


    To use Click for our purposes, a number of issues had to be addressed and resolved:


    +   * Flow of control information. In some packet flows, state information generated
    downstream needs to be fed back into an upstream element. To achieve the proper
    granularity, we explicitly model such dependencies using tokens. Push connections
    to a token represents the state change event. A pull token indicates reading access
    state.


    +   * Nonpacket data types. Besides transaction and link layer packets, state
    tokens and symbols are used. Both of them are also represented internally by Click
    packets. Elements convert packets into tokens or symbols and vice versa.


    +   * Multir elements. Interfaces require elements with different input and output
    rates. The Framer, for instance, converts incoming link layer packets into a sequence
    of symbols.


