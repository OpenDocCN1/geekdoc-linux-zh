    a tri used to organize IP route tables into an efficiently searchable structure)
    exhibit considerable locality of access. Because of the inherent differences in
    their locality properties, these different types of data structures often interfere
    with each other and thereby lower the hit rate of the memory subsystem. Hence,
    a single hardware-based mechanism for managing the cache hierarchy is ineffective
    for packet-processing applications. In our system, the π-compiler uses the access
