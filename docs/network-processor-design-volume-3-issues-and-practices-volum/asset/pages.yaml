    # 3.3.1 Reference Cache Implementations


    A Bloom filter [13] was simulated, using optimal dimensioning. Both cold paging
    and double-buffered aging strategies were run on the benchmark datasets. Optimal
    dimensioning for a misclassification probability of one in a billion requires
    30 independent hash functions, meaning each cache lookup and insertion operation
    requires 30 independent one-bit memory accesses.


    The digest cache in this chapter was chosen to be a four-way associative hash
    table, with 32-bit flow identifier digits. Each lookup and insertion operation
    requires a 16-bit memory request. An LRU cache replacement algorithm was chosen,
    due to its low complexity and near-optimal behavior [10].


    A four-way set-associative cache was chosen, which performs almost as well as
    a fully associative cache [21] Figure 3.6 graphs the behavior of digest caches
    with different set-associativities.


    We compare our cache against a traditional four-way-layer IPv4- and IPv6-based
    hash tables. Each lookup and insertion operation requires a 512-byte or 148-byte
    memory request, respectively.


    Hashing for all results presented here was accomplished with a SHA-1 [26] hash.
    It is important to note that the cryptographic strength of the SHA-1 hash is not
    an important property of an effective hashing function in this domain. It is sufficient
    that it is a member of the class of universal hash functions [27].'
