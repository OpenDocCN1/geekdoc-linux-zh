    with Segmented Instruction Cawhes


    Patrick Crowley

    Department of Computer Science and Engineering, Washington University in St. Louis


    Program size limitations are a hindrance in current network processors (NPs).
    NPs, such as the Intel IX [1] network processor family, consist of two types of
    on-chip programmable microprocessors: a control processor, which is a standard
    embedded microprocessor (the ARM-based XScale), and multiple data processors,
    which are microprocessors designed to efficiently support networking and communications
    tasks. The control processor is used to handle device management, error handling,
    and other so-called slow-path functionality. The data processors implement those
    packet processing tasks as applied to most packets, which are, the fast-path functionality,
    and, therefore, the key to high performance. In current NPs, each data processor
    executes a program stored in a private on-chip control store that is organized
    as a RAM. This fixed-size control store limits program size (e.g., the IX280 control
    store has 4 Entries), which consequently limits the variety of applications implementable
    on the NP and complicates the programming model. In this chapter, we describe
    and evaluate a technique that removes this limitation without violating any of
    the tacit NP requirements that inspired the limitation in the first place.


    Two questions arise immediately: Do NP data processors need to execute large programs,
    and if so, are instruction caches not used? The answer to the first question can
    be seen in the large number of application areas in which NPs are being deployed:
    traditional protocol and network processing systems such as wired and wireless
    routers, gateways, and switches; nontraditional networking tasks such as web-server
    load balancing, virus and worm detection and prevention, and denial-of-service
    prevention systems; and other applications'
  merge: -1
  pgno: 25
- img_proc: true
  md: '# 2 Supporting Mixed Real-Time Workloads


    including cell-phone base stations, video distribution and streaming, and storage
    systems. This broad deployment is driven by the considerable processing and I/O
    bandwidths available on NPs, which are organized as heterogeneous chip multiprocessors
    and therefore better to exploit coarse-grained parallelism than are general-purpose
    processors. On the other hand, further deployment is hindered by program size
    limitations and the associated increase in software engineering costs.


    At the second question, while instruction caches are used in all general-purpose
    processors and most embedded processors, NPs have at least two characteristics
    that complicate their use. First, networking systems are typically engineered
    to handle worst-case conditions [2]. This leads to real-requirements for programs
    executing on NPs that are designed to meet worst-case specifications. Caches,
    on the other hand, are used to speed up average-case performance (and, in the
    worst case when all references miss, can actually slow down performance). Since
    caches rely on locality, and locality may not be present under worst-case conditions,
    their inclusion cannot always be justified if a system is designed for worst-case
    conditions. Second, NP data processors typically feature software-controlled,
    hardware-supported, coarse-grained multithreading. The presence of multithreading
    complicates instruction delivery in a processor, particularly when trying to provide
    a system for a certain performance target.


    In this chapter, we propose the use of a segmented instruction cache along profile-driven
    code scheduling to provide flexible instruction delivery to both real-time and
    non-real-time (i.e., best-effort) programs, even when these programs are executing
    on the same multithreaded processor. Our proposed segmented instruction caches
    partition the instruction cache (via a thread-specific mapping function) such
    that each thread is allocated a fixed number of blocks in the cache and threads
    cannot conflict with one another. In this way, real-time programs can be tailored
    to fit into their assigned slots and best-effort code, which can tolerate misses,
    can map larger more complex control flows into their own segments without impair
    the instruction delivery of other threads. To improve the performance of best-effort
    code, profile-driven code scheduling is used to reduce conflicts. Profiling is
    also used to explore a variety of program-specific sizing strategies. The proposed
    design is evaluated on a selection of programs running on both direct-mapped and
    associative segmented instruction caches.


