  md: '# 13.5 MAPPING APPLICATION DAGS TO NP ARCHITECTURES


    Once application DAGs have been derived, they can be used in multiple ways.

    One way of employing the information from DAGs is for network processor design.
    With a clear description of the workload and its parallelism and pipel characteristics,
    a matching system architecture can be derived. Another example is the use of application
    DAGs to map instruction blocks to NP processing resources. In this section, we
    discuss this mapping and scheduling in more detail.


    # 13.5.1 Problem Statement


    The mapping and scheduling problem is the following: Given a packet-processing
    application and a heterogeneous network processor architecture, which processing
    task should be assigned to which processing resource (mapping) and at what time
    should the processing be performed (scheduling)?

    For this, we assume that a network processor has $m$ different resources $r_1
    \dots r_m$. These processors can be all of the same kind (e.g., all general-purpose
    processors or coprocessors). All processing resources are connected with each
    other over an interconnect. Transferring data via the interconnect incurs a delay
    proportional to the amount of data transferred. Thus, if the application uses
    multiple resources in parallel, the communication cost for the data transfer needs
    to be considered.


    An application is represented by a DAG with $n$ clusters $c_1 \dots c_n$ and their
    processing costs and dependencies. Since we have processing resources with different
    performance characteristics, the cost for a cluster is represented by a vector
    $p_i = (p_1, \dots p_m)$. This vector contains the processing cost for the cluster
    for each possible processing resource. If a cluster cannot be executed on a particular
    processing resource (e.g., checksum computation performed on a table-lookup coprocessor),
    the processing cost is $\infty$.


    The mapping solution, $M$, consists of $n$ pairs that indicate the assignment
    of all clusters $c_1 \dots c_n$ to a resource $r_i$: $M = ((c_1, r_{i_1}), \dots,
    (c_n, r_{i_n}))$. The schedule, $S$, is similar, except that it also contains
    a time $t$ that indicates the start time of the execution of a cluster on a resource:
    $S = ((c_1, t_{i_1}), \dots, (c_n, t_{i_n}))$.


    Finally, a performance criterion needs to be defined to find the best solution.
    This could be shortest delay (i.e., earliest finish time of last'
