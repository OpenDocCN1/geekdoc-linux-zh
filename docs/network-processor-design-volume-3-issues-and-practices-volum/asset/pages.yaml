  md: '# 3.5 Conclusions


    Let us consider this memory for implementing a packet classification cache on
    this architecture. If we used this memory for an exact IPv4 cache, we would be
    able to store a maximum of 196 flow identifiers. An equivalent IPv6 cache would
    be able to store only 69 flows. Using this memory in a 32-bit four-way set-associative
    digest cache will allow each micro own to cache 640 flows.


    If we use an 8-bit four-way set-associative digest cache, we can just use 1 KB
    of on-chip memory, and 38 KB of SRAM, to store over 1000 flows per microengine.


    The ability for this algorithm to reduce the amount of memory required is especially
    important in this architecture, because of the limited nature of memory transfer
    registers. Each microengine has access to 16 32-bit memory transfer registers,
    which means that fetching more than one IPv flow identifier requires multiple,
    independent memory accesses, which must be serialized. Since independent memory
    accesses are significantly more expensive than single, longer memory accesses,
    this significantly penalizes the performance of a traditional set-associative
    cache. Coupled with the fact that these memory accesses must be serialized (the
    first access must complete before the second one can be initiated) the performance
    benefit of avoiding SRAM memory accesses becomes overwhelmingly important.


    For comparison, a modern TCAM implementation can perform 100 million lookups per
    second [32]. The IP2000 can perform 233 million memory accesses per second [31].
    Without even considering the cost or power required to maintain a TCAM, a digest
    cache becomes a promising alternative.


    These arguments make our proposed techniques a prime candidate for creating efficient
    caches for use on future network processors.


    # 3.5 CONCLUSIONS


    Typical packet classification caches trade off size and performance. In this chapter,
    we have proposed a novel cache architecture that efficiently and effectively uses
    memory, giving a slightly relaxed accuracy requirement. Performance of any existing
    flow-caching solution that employs exact caching algorithms can be improved dramatically
    by employing our technique, at the sacrifice of a small amount of accuracy.


    Our technique is superior to previous Bloom filter approximate-caching algorithms,
    in both theoretical and practical performance, while also addressing the shortcomings
    in the previous Bloom filter cache design without introducing any additional drawbacks.'
