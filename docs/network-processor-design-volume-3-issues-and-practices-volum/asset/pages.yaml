    The current generation of network intrusion detection systems (NIDS) have several
    limitations on their performance and effectiveness. Many of these limits arise
    from some inherent problems with the traditional placement of the NIDS sensors
    within the network infrastructure. Sensors are typically positioned at the aggregation
    points between the internal and external networks and monitor for a large number
    of internal hosts. However, there may be other entry points that go unmonitored,
    such as dial-up and wide-area wire-cellular data connections to the endpoints.
    Also, a sensor at the gateway typically does not monitor traffic between internal
    hosts, so it cannot detect internal attacks. The performance problems with this
    type of centralized NIDS placement include limited throughput and poor scalability.
    Recent studies [1–3] have shown that modern NIDS have difficulty dealing with
    high-speed network traffic. [4, 5] have shown how attackers can use this fact
    to hide their exploits by overloading a NIDS with extraneous information while
    executing an attack. Furthermore, centralized NIDS do not scale well as network
    speed and the number of attacks increases. Since network traffic is faster than
    computer performance and new attacks appear almost daily, these problems will
    only get worse with time. Therefore, it is important to explore different architectures
    for deploying intrusion detection sensors.


    We suggest that, in order for a network intrusion detection system to accurately
    detect attacks in a large, high-speed network environment, the bulk of'
  merge: -1
  pgno: 115
- img_proc: true
  md: '# 6 A Hardware Platform for Network Intrusion Detection and Prevention


    analysis should be performed by distributed and collaborative network node IDS
    (NNIDS) running at the end hosts. Advantages of this approach over centralized
    analysis include a large reduction in the quantity of data to be analyzed by each
    IDS, the ability to analyze end-to-end encrypted traffic, the ability to adapt
    the analysis based on knowledge of the end system, and the capability to actively
    control the types and rates of traffic received and sent by a host. An NNIDS is
    in the unique position to prevent incoming attacks from reaching the operating
    system or applications. In addition, an NNIDS can prevent outgoing attacks or
    quarantine an infected host from infecting other internal or external hosts. On
    the other hand, a distributed architecture increases the difficulty of managing
    the sensors and detecting distributed attacks. However, these issues have been
    addressed in related contexts [7–13].


    Our research aims to develop NNIDS that can keep (i.e., avoid packet drop) with
    the traffic rate that an end host can accept. These NNIDS should be able to reliably
    generate timely and accurate alerts as intrusions occur and have the intrinsic
    ability to scale as network infrastructure and attack sophistication evolve. Research
    in algorithms for attack analysis and traffic profiling are important components
    of this goal. However, our current research focus is another essential component:
    design and implementation of a hardware platform that enables high-speed, reliable,
    and scalable network intrusion detection.


    # 6.1 DESIGN RATIONALES AND PRINCIPLES


    In this section, we discuss some considerations in the design and implementation
    of high-speed, reliable, and scalable network intrusion detection systems.


    # 6.1.1 Motivation for Hardware-Based NNIDS


    In addition to the problems mentioned previously, centralized NIDS have other
    weaknesses. A common and serious issue is that they typically do not have sufficient
    knowledge of the network topology and which operating systems are running on the
    network hosts. As a consequence, the NIDS and a host might interpret the same
    traffic differently. This vulnerability allows attackers to evade detection by
    sending attack traffic to a host that looks harmless from the perspective of the
    NIDS [4, 5]. In addition, NIDS generally do not have the necessary keys (or resources)
    to examine end-to-end encrypted traffic for every host. This means that data sent
    over protocols such as SSL or SSH cannot be analyzed by a centralized NIDS, giving
    attackers another means to evade detection.


    One remedy to these problems is to use network node IDS (NNIDS) that each monitor
    the traffic to a single host. An NNIDS can unambiguously analyze'
