  md: '# Preface


    This volume is the third in a series of texts on network processors. The series
    is an outgrowth of the annual Workshop on Network Processors and Applications,
    the third of which (NP-3) was held in conjunction with the 10th International
    Symposium on High-Performance Computer Architecture (HPCA10), in Madrid, Spain,
    on February 14 and 15, 2004. The book begins with a chapter that summarizes the
    twelve chapters that make up the remainder of the book. Our goal is to provide
    a useful text that balances current academic and industrial research and practice.
    Our target audience includes scientists, engineers, and students interested in
    network processors, related components, and applications.


    Interest in network processor-related research is growing, as illustrated by the
    robust and sustained workshop attendance and manuscript submission rates, particularly
    during a difficult economic climate. Therefore, we have decided to organize an
    international symposium tentatively titled "Symposium on Architectures for Networking
    and Communications Systems" in Fall 2005.


    This book owes a great debt to the many people who made NP-3 possible. The program
    committee consisted of the four editors of this volume, along with 15 distinguished
    researchers and practitioners in the fields of networking and computer architecture:
    Alan Bernoulli (Agere), Brad Calder (UC-San Diego), Andrew Campbell (Columbia
    University), Jordi Domingo (UP, Spain), Jorge Garcia (UP, Spain), Marco Heddes
    (Transwitch Corporation), Manolis Katevenis (FORTH and University of Crete, Greece),
    Bill Mangione-Smith (UC-Los Angeles), Kenneth Mackenzie (Reservoir Labs), John
    Marshall (Cisco Systems), Lothar Thiele (ETH-Zürich, Switzerland), Jonathan Turner
    (Washington University in St. Louis), Mateo Valero (UP, Spain), Tilman Wolf (University
    of Massachusetts) and Raj Yavatkar (Intel).


    The workshop program also included a keynote address by Nick McKown of Stanford
    University, an invited talk by Marco Heddes of Transwitch Corporation, and an
    industry panel session moderated by Mark Franklin. The panelists were: Mitch Gusat
    (IT, Zürich, Switzerland), Marco Heddes (Transwitch, USA), Jakob Carlstrom (Xelerated,
    Sweden), Peter Onufryk (IDT, USA), and Raj Yavatkar (Intel, USA).


    We would like to extend our thanks to the workshop program committee members,
    the speakers, the panelists, the workshop authors, and HPCA-10 organizers. Without
    their help and dedication, this book would not exist.'
