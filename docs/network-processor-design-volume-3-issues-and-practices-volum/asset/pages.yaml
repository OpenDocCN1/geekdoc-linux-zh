    500 and 1000 and eight times between 1500 and 2000).


    Figure 13.7 is a good indicator for repetitive instruction execution. For Flow
    Classification, there are almost no repeated instructions. In IPSec, however,
    there are several instruction blocks that are executed multiple times (sixteen
    times for instructions with unique address 350 to 450). If these instructions
    can be implemented in dedicated hardware, a significant speed-up can be achieved
    due to the high utilization of this function.


    Again, this method of coprocessor identification requires no knowledge or deep
    understanding of the application. Instead the presented methodology extracts all
    information from a simple instruction run-time trace. One problem with this methodology
    is that processing blocks that execute non-repetitive functions are not identified
    as suitable for coprocessors, even though they could be (as it is the case for
    Flow Classification). Such functions still need to be identified manually by the
    programmer.'
