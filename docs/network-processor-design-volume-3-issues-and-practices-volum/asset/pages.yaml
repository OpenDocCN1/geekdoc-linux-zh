  md: '# A Programming Environment for Packet-Processing Systems: Design Considerations


    Harrick Vin, Jayaram Mudigonda

    Department of Computer Sciences, University of Texas at Austin

    Jamie Jason, Erik J. Johnson, Roy Ju, Aaron Kunze

    Intel Research and Development

    Ruiqi Lian

    Institute of Computing Technology, Chinese Academy of Sciences,

    Beijing, PRC


    The design of packet-processing systems is required to meet two, often-conflicting,
    requirements: (1) support a large number of high-bandwidth links, and hence large
    system throughputs, and (2) offer a wide range of services as varied as conventional
    forwarding functions, VPN, intrusion detection, differentiated services, and overlay
    network processing. To simultaneously meet these requirements, a new breed of
    processors, referred to as network processors (NPs), has emerged [1–6]. Network
    processors, which like general-purpose processors, are programmable and include
    mechanisms—such as multiple processor per chip and multiple hardware contexts
    per processor core—that enable them to process packets at high rates. These mechanisms
    foreshadow a more general trend toward the design of multicore, multithreaded
    architectures targeted for high-throughput computing environments. NPs, combined
    with general-purpose processors, fixed-function coprocessors, and other reconfigurable
    logic elements, create a powerful hardware platform for designing packet-processing
    systems.


    Unfortunately, the methodologies needed to map NP-based packet-processing systems
    are unfamiliar to many programmers, and the tools to perform such mappings are
    in their infancy. Today, programmers are often required to manually partition
    each network application into components at design time and map these components
    into different types'
