    architectures with more coprocessors; particular those that implement specialized,
    less frequently used functions.

    The heterogeneity of NP platforms poses a particularly difficult problem for application
    development. Current software development environments (SDKs) are already difficult
    to use and require an in-depth understanding of the hardware architecture of the
    NP system (something that traditionally has been abstracted by SDKs). Emerging
    NP systems with a large number of heterogeneous processing resources will make
    this problem increasingly difficult as the program developer will have choices
    on which hardware units to use for which tasks. Such decisions can have significant
    impact on the overall performance of the system as poor choices can cause contention
    on resources. One way to alleviate this problem is to profile and analyze the
    NP applications and make static or run-time decisions on how to assign processing
    tasks to a particular NP architecture. This process of identifying and mapping
    processing tasks to resources is the topic of this chapter.'
