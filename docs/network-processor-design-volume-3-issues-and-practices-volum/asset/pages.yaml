    # 4.2.4 Hypertransport


    Hypertransport is a parallel, packet-oriented, point-to-point data transfer protocol
    for chip-to-chip links [17, 18]. The most recent payload update [17] of the specification
    extends the protocol with communication system-specific features, such as link-level
    error recovery, message passing semantics, and direct peer-to-peer transfer. In
    this chapter, we primarily use the preceding version described in Ref. [18].


    Unlike RapidIO and PCI-Express, the packet transfer portion of a link groups of
    parallel, unidirectional data signals with explicit clocks and an additional sideband
    signal to separate control from packets. Control packets are used to exchange
    information, including the request and response transactions, between the two
    communicating nodes. Data packets that carry the raw payload are always associated
    with a leading control packet. To improve the information exchange, the transmitter
    can insert independent control packets into a long data transfer.


    The base functionality of the Hypertransport protocol is comparable to PCI-Express
    and RapidIO. However, Table 4.2 reveals two main differences: (1) At the PHY layer,
    Hypertransport does not require framing, channel coding, and clock recovery over
    the parallel interface; and (2) in nonstop mode,¹ there is no acknowledgement/not-acknowledge
    protocol at the link layer and a periodic CRC inserted every 512 transferred bytes.


