  md: '# Pipeline Task Scheduling on Network Processors


    11

    CHAPTER


    Mark A. Franklin, Seema Datar

    Department of Computer Science and Engineering

    Washington University in St.Louis


    The continuing increase in the logic and memory capacities associated with single
    VLSI chips chips has led to the development of chip multiprocessors (CMPs) where
    multiple, relatively simple processors are placed on a single chip. Such CMPs
    permit the effective exploitation of application-level parallelism and thus significantly
    increase the computational power available to an application. These developments
    have been exploited by the networking industry where growth in the capacity, speed,
    and functionality of networking infrastructure, have required fast, flexible,
    and efficient computing architectures. This has led to the development of network
    processors (NPs) [1, 2].


    Processors within NPs are often arranged so that they can be used in a pipelined
    manner. In some cases [2, 3] the NP may contain one or more processor pipelines.
    A typical architecture that has been analyzed (in a simpler form) from the perspective
    of obtaining "optimal" power and cache-size designs [4–6] is shown in Figure 11.1.
    Packets of information arrive from the network and are classified and routed by
    a scheduler [7] to one of number of processor pipeline clusters. The clusters
    are sized so that bandwidth to off-chip memory meets performance requirements,
    and each cluster contains a number of processor pipelines.


    Applications may be associated with one or more of the processor pipelines. The
    application itself may pipelined and may utilize multiple processors within a
    pipeline. A packet, after being routed to a cluster and pipeline, invokes one
    or more of the applications associated with the pipeline (e.g., routing, compression,
    etc.) and, traversing the pipeline, returns to the scheduler where it is transferred
    to a switch fabric for transmission to the next node in the network.


    Given a number of applications that have processor pipeline implementations specified
    as a series of sequential tasks, a number of issues arise relating to the assignment
    of application tasks to the pipeline stages/processors. Since the'
