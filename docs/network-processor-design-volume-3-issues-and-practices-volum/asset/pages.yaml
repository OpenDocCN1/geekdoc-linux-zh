    In the absence of misclassifications, this scheme behaves exactly as a four-way
    set-associative cache with 14,560 entries (3640 cache lines).


    Using an equivalent amount of memory (64 KB) a cache storing IPv4 flow identifiers
    will be able to store 4852 entries, and a cache storing IPv6 flow identifiers
    will be able to store 1744 entries.


    The benefit of using digest cache is two-fold. First, it increases the effective
    storage capacity of cache memory, allowing the use of smaller, faster memory.
    Second, it reduces the memory bandwidth required to support a cache by reducing
    the amount of data required to match a single packet.


    As intuition and previous studies would indicate, a larger cache will improve
    cache performance [10, 21, 22]. To that end, in this example, the deployment of
    a digest cache would have an effect of increasing the effective cache size by
    factor of two.


    # 3.2.5 Exact Classification with Digest Caches


    Digest caches can also be used to accelerate exact caching systems, by employing
    a multilevel cache (see Figure 3.4). A digest cache is constructed, in conjunction
    with an exact cache that shares the same dimensions. While the digest cache stores
    only a hash of flow identifiers, the exact cache stores the full flow identifier.
    Thus, the two hierarchies can be thought of as “mirrors” of each other.


