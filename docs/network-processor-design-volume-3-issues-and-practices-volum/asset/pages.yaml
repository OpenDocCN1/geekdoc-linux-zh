    Decomposing a task into balanced steps and mapping tasks to multiple processors
    is a form of software-pipelining; this can be, and indeed, is, a performance enhancement
    when the control store size is not a consideration. However, while certain algorithms
    and programs lend themselves to balanced pipeline implementations, the efficient
    pipelining of general-purpose code is difficult. Thus, a method for flexible instruction
    delivery can alleviate the need to fragment a program when it is inconvenient
    or unnecessary to do so.


    # 2.1.2 Using a Cache as a Fixed-Size Control Store


    As previously mentioned, a cache can alleviate program restrictions. Furthermore,
    a cache can be used as a fixed-size control store provided that the aggregate
    program size does not exceed the cache capacity and that code is laid out contiguously
    at the start of the address space. Given a cache with N entries, or sets, or an
    address $a$, $a \pmod N$ yields the entry address to which $a$ maps. Thus, if
    the total number of instructions is less than N, then each will map to its own
    set. Given this scenario, the cache can be accessed without incurring misses,


    First, it is necessary to preload the cache with instructions as is done in the
    fixed control store case. Now, consider the three possible sources of uniprocessor
    cache misses [3]: compulsory, capacity, and conflict. Given that the program fits
    in the cache: preloading avoids compulsory misses, there will be no capacity misses
    and conflict misses be avoided by laying out the code sequentially in memory without
    any gaps. In this way, a cache can be used to implement a fixed-size RAM. Note
    that no change is required in the programming model or compiler structure. However,
    a cache does involve some overhead in both access time and size; we return to
    these topics in Section 2.2.2.


