  md: '# About the Editors


    Patrick Crowley received his B.A. from Illinois Wesley University, where he studied
    Mathematics, Physics, and Computer Science; and his M.S. and Ph.D. degrees, both
    in Computer Science and Engineering, from the University of Washington. Crowley''s
    research interests are in the area of computer systems architecture, with a present
    focus on the design and analysis of programmable packet-processing systems. He
    is an active participant in the architecture research community and a reviewer
    for several conferences and journals. He was an organizer and member of the program
    committee of the HPCA Workshop on Network Processors in 2002, 2003 and 2004. In
    Autumn 2003, Dr. Crowley joined the faculty of the Department of Computer Science
    and Engineering at Washington University in St. Louis as an Assistant Professor.


    Mark A. Franklin received his B.A., B.S.E.E., and M.S.E.E. from Columbia University,
    and his Ph.D. in Electrical Engineering from Carnegie-Mellen University. He is
    currently at Washington University in St. Louis where he is in the Department
    of Computer Science and Engineering, and is the Hugo F. and Ina Champ Urbanbauer
    Professor of Engineering. He founded the Computer and Communications Research
    Center and, until recently, was the Director of the Undergraduate Program in Computer
    Engineering.


    Dr. Franklin is engaged in research, teaching, and consulting in the areas of
    computer and communications architectures, ASIC and embedded processor design,
    parallel and distributed systems, and systems performance evaluation.


    He is a Fellow of the IEEE, a member of the ACM, and has been an organizer for
    numerous professional conferences including the Workshops on Network Processors
    2002, 2003 and 2004. He has been Chair of the IEEE TCCA (Technical Committee on
    Computer Architecture), and Vice-Chairman of the ACM SIGARCHCH (Special Interest
    Group on Computer Architecture).


    Haldun Hadimioglu received his B.S. and M.S. degrees in Electrical Engineering
    at Middle East Technical University, Ankara, Turkey and his Ph.D. in computer
    science from Polytechnic University in New York. He is currently an Industry Associate
    Professor in the Computer and Information Science Department at the Polytechnic
    University. From 1980 to 1982, he worked as a research engineer at PETAS, Ankara,
    Turkey. Dr. Hadimioglu''s research and teaching interests include computer architecture,
    parallel and distributed systems, networking, and ASIC design. He was a guest
    editor of the special issue'
