  md: '# Towards a Flexible Network Processor Interface


    **Clock recovery** Serial interfaces encode the transmit clock into the bitstream.
    At the receiver, the clock needs to be recovered from data transitions in the
    bitstream using a Phase-Locked Loop. To establish lock, the transmitter sends
    specialized training sequences at initialization time.


    **Clock compensation** The PHY layer has to compensate frequency differences between
    the received clock and its own transmitter clock to avoid clock shifts.


    **Lane-skewing** Data on different lanes of a multiline link may experience different
    delays. This needs to be compensated at the receiver.


    **Serialization/Deserialization** The width of the internal data path has to be
    adjusted to the width of the lane. Serial interfaces also need to lock the bitstream
    onto symbol boundaries.


    **8b/1b encoding/decoding** Data bytes are encoded into 10-bit symbols to create
    the bit transitions necessary for clock recovery.


    **Scrambling/Descrambling** Scrambling removes repetitive patterns in the bitstream.
    This reduces the EMI noise generation of the link.


    **Striping/unstripping** In multiline links, the data is distributed to/gathered
    from individual lanes byte-wise encoding to a set of alignment rules.


    **Framing/Deframing** Packets received at the physical layer are framed with start
    and end symbols. In addition, PHY layer can command sequences (e.g., link training)
    may be retransmitted.


    **Cyclic redundancy check (CRC)** The link layer protects data by calculation
    of a CRC checksum. Different versions may be required depending on data type and
    protocol version.


    **Ack/Nak protocol** In order to establish a reliable communication link, the
    receiver acknowledges every-free packet using a sequence number. In the case of
    transmission errors, a not-acknowledge is recognized and the packet is retransmitted.


    **Classification** The classification by packet types may be based on multiple
    fields (e.g., address, format, type) of the header.


    **Packet assembly/disassembly** The transaction layer assembles payload and header
    and forms outgoing packets according to the transaction type. The link layer may
    add an additional envelope (e.g., CRC, sequence number). The link layer may generate
    information packets flow to update the link status of its peer.


    **Flow control** A transaction is transmitted to the receiver only if sufficient
    buffer space is available at the receiver. The receiver updates the transmitter
    periodically with the amount of available buffer space.


    **Address validation** Incoming transactions should be addressed only to the device
    or its memory spaces, respectively.


    **Buffers and scheduling** At least one¹ set of individually flow-controlled buffers
    is required for all transaction types (posted, nonprofit, and completion) to prevent
    head of line blocking.


    **Configuration space** The configuration space stores the identity of the device
    that is determined during the initialization phase and the negotiated link parameter.
    It also allows access to internal state and error logs.


    > ¹ Devices may provide additional sets for quality-of-service purposes.


