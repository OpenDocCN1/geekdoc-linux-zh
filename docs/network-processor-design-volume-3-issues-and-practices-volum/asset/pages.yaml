    # Pipeline compiler


    The pipeline compiler ($\pi$-compiler) partitions a packet-processing application
    into a series of tasks (called aggregates), which form the processing stages in
    a pipeline. IXP-based NPs, for example, these pipeline stages can be mapped to
    multiple chained microengines (MEs) as well as the Intel XScale® processor. The
    $\pi$-compiler has two primary functions: (1) it manages the memory hierarchy
    to minimize memory access times; and (2) it groups packet-processing functions
    into aggregates that those aggregates, mapped onto the multiple processor cores,
    can maximize the overall throughput.


    While the $\pi$-compiler derives aggregates, it is important to have a well-engineered
    cost model to reasonably guide each aggregation step. The cost model includes
    factors such as the cost of communication, synchronization overhead, memory access
    latencies, CPU execution times, and code size. Although it may sound appealing
    to simply minimizing the processing time of the dominant stage in the partitioned
    tasks to maximize the rate of packet processing in the pipeline, this tends to
    split the PPFs of an application into too many aggregates,'
