    # 13.2.4 ADAG Reduction


    A practical concern of this methodology is that the number of processing blocks
    is large (in the order of the total instructions executed) and the representation
    of the DAG becomes unwieldy. Therefore, we take a simplifying step that significantly
    reduces the number of processing steps: instead of considering individual instructions,
    we consider basic blocks. A basic block is a group of instructions that are executed
    in sequence and no internal control flow change. That is, the execution of a program
    can jump only to the beginning of a basic block and cannot jump elsewhere until
    the end of the basic block is reached. All necessary dependencies are considered,
    the smallest code fragment that can be parallelized or pipelined is a basic block.
    In Figure 13.2, basic blocks are separated by dashed lines.


    Even with a reduction to basic blocks, the resulting ADAG is not a suitable representation
    of an application, because it does not capture any higher-level application properties.
    The dependency between processing blocks can be very different depending on the
    nature of the application. Most applications show a “natural” separation between
    parts of the application (e.g., checksum verification and destination address
    lookups in IP forwarding), while showing a strong dependency within a particular
    part (e.g., all basic blocks of checksum computation). In order to consider “clustering,”
