    Performance of Bloom filter caches in worst-case data flows, on a simulated IXP1200.


    The IXP1200 has a three-level memory hierarchy, scratchpad, SRAM and SDRAM, having
    4 KB, 16 MB, and 256 MB, respectively. Scratchpad memory is the fastest of the
    three, but does not support queued memory access—subsequent scratchpad memory
    accesses block until the first access is complete. The IXP micro-code allows for
    asynchronous memory access to SRAM and SDRAM. The typical register allocation
    schema allows for a maximum of 32 bytes to be read per memory access.


    The cache implementation we constructed was designed in a way to ensure that no
    flow identifier was successfully matched, and each packet required an insertion
    of its flow ID into the cache. This was done so that the worst performance of
    a Bloom filter cache could be ascertained. The code was structured in a way to
    disable any shortcutting or negative membership confirmation. The performance
    results of the IXP implementation are presented in Table 3.3, using a cache composed
    entirely of 64-byte packets. By comparison, a four-way set-associative digest
    was able to maintain a sustained throughput of 803 Mb/s.


    The IXP is far from an ideal architecture to implement a Bloom filter, in large
    part due to its lack of small, high-speed, bit-addressable, on-chip memory. Ideally,
    a Bloom filter would be implemented in hardware that supports parallel access
    on bit-addressable memory [29]. Nevertheless, the performance results here serve
    to underscore the flexibility of our new cache design; specialized hardware is
    not required.


    # 3.4.2 Future Designs


    The next generation IXP2000 hardware will feature 2560 bytes of on-chip memory
    per microengine, improving access latencies by a factor of fifteen [30, 31].'
