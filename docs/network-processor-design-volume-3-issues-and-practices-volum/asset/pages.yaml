    # 4.2.3 RapidIO


    RapidIO is a packet-oriented, point-to-point data transfer protocol. Like PCI-Express,
    RapidIO is a layered architecture [16]. The logical layer (our transaction layer)
    specifies the transaction models of RapidIO, that is, I/O, message-passing, and
    global shared memory. The transport layer specifies the routing of packets through
    the network (our transaction layer covers the part which concern devices: the
    device identification). The physical layer defines the interface between two devices
    (our physical layer) as well as the transport and flow control mechanisms (our
    data link layer).


    Since there are only minor differences between PCI-Express and RapidIO, we refrain
    from presenting the complete implementation here. Instead, we list the differences
    of each layer. The transport layer implements a different buffer scheme with four
    prioritized transaction queues that are jointly flow-controlled. At the link layer,
    an explicit acknowledge for each packet is required, whereas PCI Express allows
    the acknowledge of a packet sequence. The acknowledge provides the cause of an
    error that is used for individual reactions at the transmitter. The PHY layer
    uses slightly different control symbols than PCI Express.'
