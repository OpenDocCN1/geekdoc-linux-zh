    would enable storage of thread state in private (local) memory. True hardware
    multithreading takes this step further by implementing the multiple thread mechanism
    entirely in hardware. A TCP-aware scheduler handles the tasks of thread suspension,
    scheduling, synchronizing, and save/restore of thread state and the conditions
    that trigger them. TCP stack analysis shows that there are a finite number of
