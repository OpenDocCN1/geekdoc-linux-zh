    # 13 Application Analysis and Resource Mapping


    ![](img/e172ff28bf6e0a7a974849165330f450_296_0.png)


    # 13.1


    FIGURE


    Packet data path on network router. Packets are shown as shaded boxes. Packet
    processing is performed on a network processor that is located at the input port
