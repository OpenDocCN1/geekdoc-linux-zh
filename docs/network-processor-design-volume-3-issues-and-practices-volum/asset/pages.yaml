    # 13.3.2 Ratio Cut


    The basic concept of ratio cut is to cluster together nodes that show some natural
    cohesiveness, as described in detail in Ref. [19]. In our context, ratio cut clusters
    instruction blocks such that:


    +   * clusters perform a significant amount of processing

    * clusters have little dependencies between them.


    The metric to determine these properties is the ratio cut, $r_{ij}$, for two clusters
    $i$ and $j$, which is defined as:$1$


    $r_{ij} = \frac{d_{ij} + d_{ji}}{p_i \times p_j}. \quad (13.2)$


    The ratio cut algorithm will cluster the graph that $r_{ij}$ is *minimized*. This
    means the dependencies between $i$ and $j$ are small and the amount of processing
    is done by $i$ and $j$ is large. Note that either $d_{ij}$ or $d_{ji}$ has to
    be zero due to the acyclic property of ADAG.


    Ratio cut operates in a top-down fashion. Starting from one cluster that contains
    all nodes (i.e., $A_1$), the ratio cut is applied to find two groups that minimize
    $r_{ij}$. This process is applied recursively within each group. The minimum ratio
    cut will increase (because the clusters will have fewer and fewer separations).
    The clustering process can be terminated when the ratio cut exceeds a certain
    threshold ($r_{ij} > t_{terminate}$). The value of this threshold determines how
    tightly clustered the result. If $t_{terminate}$ is small, then only a few clusters
    will be found, but the separations between them will be


