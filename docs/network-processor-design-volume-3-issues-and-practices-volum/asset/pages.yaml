    which has a typical one-to-one mapping to ME instructions. The memory optimizations
    generate efficient code sequences to access memory, for example, to combine multiple
    loads that adjacent data fields into one load with a register aggregate target.
    Control Flow Optimization (CFO) and Extended Basic-Block Optimization (EBO) phases
    perform simplification on control flow and classical optimizations on the scope
    of extended blocks, respectively. Loop optimizations, such as unrolling, on loop
    structures. The global scheduling may reduce instruction schedule lengths across
    basic blocks. Register allocation colors all virtual registers with proper registers
    and banks. If there are register spills, local instruction scheduling is invoked
    to resolve the instructions in the affected basic blocks. The code emission phase
    emits assembly code with the annotations to RTS.


    The system model abstracts architectural and micro-architectural details, such
    as latency, instruction opcode, the number of MEs, and the size of level of memory
    hierarchy, into a separate module. Such information is used throughout the entire
    compiler. When the current code size approaches its physical limit, optimizations
    that may increase code size, such as loop unrolling and scheduling with code duplication,
    are restricted, and optimizations that reduce code size, such as redundancy elimination,
    are made more aggressive. The heuristics to make intelligent tradeoff between
    code size and performance remain an important subject to explore.


