    An existing home access router shall be extended with Voice over IP (VoIP) functionality.
    The hardware shall remain the same, with the only exception an additional module
    that will be plugged to an existing extension port. That additional module, called
    VoIP-module, has the necessary DSP resources to code/decode the voice packets
    and detect/play DTMF tones and it has all the physical'
