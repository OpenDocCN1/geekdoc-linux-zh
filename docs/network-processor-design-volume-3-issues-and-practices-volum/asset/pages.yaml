    # 4.3.3 Mapping and Implementation Details


    Queue management. Although the Click model of computation assumes that full packets
    are handed over from element to element, a one-to-one implementation of this behavior
    will quickly overloads where a wide range of packet sizes must be supported. In
    the case of PCI-Express, packets can range from 6 to 4096 bytes. As it is done
    for IPv4 forward solutions—Refs. [22] and [23] for two examples where queuing
    is supported in hardware—we therefore split the packet from the payload and store
    them in separate queues. The packet descriptor, including the header, can be managed
    in statically reserved arrays, whereas the payload queues for PCI-Express need
    for segments and linked lists in order to efficiently enqueue and dequeue operations.
    In contrast, the maximum size of a Hypertransport packet is only 64 bytes. There,
    we also use statically allocated arrays to manage Hypertransport payload since
    the amount of possibly wasted memory is small. All queues are stored in the data
    memory of the packet-processing engine. The free list for payload segments is
    implemented as a stack of addresses of free segments. A segment contains 64 bytes
    of data plus one pointer to the next segment. The free list and the queues are
    implemented in separate memory areas which cannot overlap, that is, the free-list
    memory space cannot be used by the queues in times of congestion. This separation
    of memory areas greatly simplifies the management of the list.


    Optimizations. Click elements mapped to the same thread of the processing engine
    share temporary registers, for example, a pointer to the current packet descriptor
    does not need to be explicitly transferred to the next Click element. Code from
    Click elements within push and pull chains can be concatenated so that jumps on
    the same thread are avoided.'
