    # # CONCLUSIONS


    This volume presents the latest research on network processor architectures, hardware,
    modeling, software environments, and application development. While considerable
    progress has been made in this field of study, it is far from mature. New application
    areas, such as network security and TCP offload, are challenging the basic architecture
    of current network processors. Continued opportunity exists for enhancing tools,
    environments, and techniques for programming and performance estimation of these
    devices.


    In the few years that the field has existed, we have already seen the application
    domain for network processors move far beyond trader-line applications. The rapid
    convergence of networking and computing is likely to challenge the fundamental
    existence of stand-alone, general-purpose network processors as we know them today.
    It is quite likely that concepts and techniques used in today''s network processors
    will find their way into general purpose, such as those found in workstations
    and servers. The convergence in LAN, storage, and server interconnects continues,
    it is also likely that the concepts and techniques used in today''s network processors
    will find their way into deeply embedded application-specific devices such as
    network adaptors, switches, and peripherals. Finally, networking speeds will continue
    to grow and raw performance will continue to be an important component of network
    processor design. Thus, we believe that the opportunities for research and innovative
    new products in this field are greater today than they have ever been in the past.


