  md: '# 8 A Programming Environment for Packet-Processing Systems


    deployed in a residential environment where web surfing may be the dominant application.
    It would be impossible to come up with a set of packet traces that would accurately
    represent both of these environments.


    Even if the packet traces used for profile-driven compilation are accurate with
    respect to the actual workload, workloads are rarely static over time. Network
    traffic characteristics change from hour to hour, minute to minute, and to second.
    If a packet-processing application is to keep up with performance demands when
    confronted with workloads that differ during profiling, it may need to adapt the
    allocation of resources to software constructs at runtime.


    Besides performance, other benefits may also come from the ability to adapt. For
    example, if a network device could dynamically power off or reduce the clock frequency
    of unused or underused hardware resources, the average power consumption and heat
    dissipation of the device could be reduced. Also, in an environment where with
    malicious intent may try to deny service to users the ability to adapt resource
    allocations at runtime may allow a device to prevent such denials of service.


    Supporting runtime adaptation requires a runtime system with two important properties:
    resource-awareness and dynamic resource adaptation.


    In this context, resource-awareness means the runtime system must know which resources
    are being used by the application, and how effectively they are being used. The
    RTS provides resource-awareness through a abstraction layer (RAL) that is linked
    to the application code at runtime. For each resource type, the RAL defines an
    interface and includes one or more implementations of that. For instance, the
    RAL supports a queue resource type with enqueue and dequeue methods. A RAL implementation
    may support multiple implementations (e.g., on the IX2800 network processor, queues
    can be implemented using next-neighbor registers, on-chip scratch memory, off-chip
    SRAM or DRAM). This decomposition allows the runtime system to select the best-suited
    implementation based on the mapping of aggregates onto processors (e.g., for aggregates
    mapped to neighboring microagents, the runtime system selects the queue implementation
    that uses next-neighbor registers; for other cases, the runtime system selects
    the scratch memory or SRAM/DRAM implementations). Since RAL interfaces are linked
    at runtime, the resource allocations can be modified at runtime without recompiling
    the code.


    Designing an abstraction layer for a network device is a challenge for two reasons.
    First, although the packet-processing domain is a narrower domain than general
    computing, different applications found in this domain still require varied hardware
    services. For example, an Ethernet switch may require the ability to compute hashes
    very efficiently, whereas a VPN offload device may require'
  merge: -1
  pgno: 182
- img_proc: true
  md: '# 8.3 Design Details and Challenges


    the ability to perform encryption and decryption very efficiently. Second, the
    spectrum of hardware platforms used in these applications is also broad, many
    requiring different methods of performing the same computational tasks.


    To support dynamic resource adaptation, the runtime system monitors performance
    and traffic conditions and adapts resource allocations across aggregates. The
    system monitor allows users or higher levels of the system to define triggers
    based on predicates defined over runtime measures. At runtime, the monitor receives—either
    through a polling interface or through asynchronous event notifications—system
    statistics (e.g., queue lengths) from the resources, evaluates the predicates,
    and generates events if any of the predicates are satisfied. Based on the performance
    requirement of the application and the current traffic conditions, the resource
    allocator determines and enforces the new allocation.


    The design and implementation of such a distributed monitoring and resource adaptation
    framework is challenging for two reasons. First, the performance-sensitive nature
    of packet-processing applications means the monitoring infrastructure as well
    as the runtime system should impose little overhead as possible. Second, the inherent
    heterogeneity and widely-varying capabilities of the resources available in NP-based
    systems makes the task of determining an optimal mapping of pipeline stages to
    processor resources complex.


    When a packet-processing pipeline is mapped onto multiple processors, a packet
    migrates from one processor to another, with each processor providing a portion
    of the total service requested by the packet. Further, each processor may simultaneously
    service packets belonging to multiple flows. Providing performance guarantees
    in distributed, shared environments requires sophisticated techniques for coordination
    and scheduling of multiple resources [32, 33]. These techniques determine (1)
    the mapping of flows to resource instances, in the event that multiple resources
    with the same functional capability but different performance characteristics
    are available in the packet-processing system; (2) the relative priority for processing
    packets from different flows at each resource; and (3) guidelines for gracefully
    degrading performance (or at least the performance observed by some flows) in
    the presence of persistent overload. Such a resource allocation framework is to
    construct packet-processing systems that are robust to denial-of-service attacks.


    In addition to supporting runtime adaptation, the RTS supports features necessary
    for running and debugging code on an embedded network device. These features include
    the ability to load code, run code, and debug code. The design decomposition of
    the RTS is shown in Figure 8.6.'
