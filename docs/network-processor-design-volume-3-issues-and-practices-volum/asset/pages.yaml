    +   1. Packet reception. In this step, DNA$_{db}$ is sent to the NPU across a
    network in fixed-length IP packets (of approximately 500 bytes payload) and received
    (in chunks of 64-byte packets) first in the NPU''s RIFO and subsequently in SDRAM.
    We have dedicated one ME (ME$_0$) to the task of packet reception. The ME is responsible
    for (a) checking whether a packet has arrived from the network, (b) transferring
    the DNA material to a circular buffer in SDRAM, and (c) indicating to the remaining
    five MEs that there is DNA material to process.


    +   2. Query in SRAM (or Scratch). The query is stored in faster memory than the
    packets. In the implementation Aho-Corasic the query is stored in SRAM (2a), it
    does not fit in the 4 KB scratch memory, except for very small queries. In the
    naive implementation (IXPBlast$_{direct}$), the entire query is stored in on-chip
    memory for efficiency (2b). As Scratch memory is only 4 KB on IXP1200, this limits
    the size of the query. In our implementation, as discussed in Section 10.2, we
    are able to store more than $10^4$ nucleotides in scratch memory, far exceeding
    the length of most queries in practice.


    +   3. Scoring. While ME$_0$ is dedicated to packet reception, the threads on
    the remaining MEs implement the scoring algorithm described in Section 10.1.1,
    that is, every window in the query is compared to every window in DNA$_{db}$,
    and the status is kept for all matches). Phase 2 of the Blast algorithm (the alignment,
    which takes place on a Pentium processor) starts only after the DNA$_{db}$ has
    been scored.


    Note that when processing a packet, a thread really needs to access two packets.
    The reason is that the last few windows in a packet in DNA$_{db}$ straddle a boundary.
    For example, assume the window size is 12 nucleotides and a thread $T$ processing
    packet $i$ is about to process the 11 nucleotides in packet. In this case, the
    window spills into packet $p_{i+1}$. As a result, $T$ must access up to 11 nucleotides
    of $p_{i+1}$. Conversely, all packets except the first need to be accessed by
    two threads: the one responsible for the packet and the one responsible for the
    previous packet. We call these the packet''s main thread and spill thread, respectively.


    Processing takes place in batches of $B$ packets. For example, if $B=100,000$,
    this means that 100,000 packets are received and processed in their entirety before
    the next batch is received (this is not to say, however, that all $B$ batches
    first have to be received before the processing can start). For purpose, every
    thread maintains a packet index in scratch memory. Each of these indices has to'
