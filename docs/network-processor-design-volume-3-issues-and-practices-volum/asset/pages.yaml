    # 11.5 CONCLUSIONS


    This chapter has presented Greedypipe, a heuristic approach that quickly performs
    near optimal task-to-pipeline stage assignments in a multiple flow, multiple pipeline
    environment. Though obtaining optimal assignments is an NP hard problem, Greedypipe
    obtains very good assignments quickly.


    While Greedypipe can be used in obtaining throughput performance in a variety
    of pipeline environments, its development was motivated by the growing importance
    of embedded processor systems that are based on having multiple pipelines on a
    single chip. This sort of design is used extensively in current network processors.


    In addition to presenting the Greedypipe heuristic, the chapter also illustrates
    how Greedypipe can be employed as a design tool in situations where the effects
    of pipeline depth, task sharing, and task partitioning are explored as part of
    the design process. This is done for both a generic design case, and a case where'
