  md: '# Packet Processing on a SIMD Stream Processor


    7 CHAPTER


    Jathin S. Rai, Yu-Kuen Lai, Gregory T. Byrd

    Department of Electrical and Computer Engineering,

    North Carolina State University


    The current generation of commercial network processors (NPs) [1] use chip multiprocessing
    to take advantage of packet-level parallelism. Memory latency is tolerated with
    the help of hardware multithreading. To improve performance, many NPs use dedicated
    hardware units called coprocessors, which implement important tasks in hardware.
    The nonprocessor approach is a more flexible solution—all the packet processing
    tasks are performed in software, with the help of specialized instruction sets
    to satisfy the performance requirement. Both of these architectures are extremely
    successful, but they do present some inefficiencies, previously discussed by Seshadri
    and Lipati [2]:


    +   - The coprocessor approach lacks flexibility and does not scale well to different
    architectures and protocols, because certain functions are fixed in hardware.


    +   - In both approaches, unsynchronized and arbitrary memory references by different
    processing elements fail to extract the maximum memory bandwidth.


    +   - The processing elements normally access shared data structures, which requires
    extra synchronization logic to provide for mutual exclusion. This complicates
    the programming model and can result in a performance bottleneck.


    To address these issues, this chapter explores the use of a SIMD stream architecture
    for packet processing. Stream processors are designed to support the stream programming
    model [3]. A stream program applies a consistent set of operations (compound operations)
    to each of a sequence (stream) of elements. For packet processing, each stream
    element could be a packet, or the contents of a packet could be viewed as a stream
    of data elements. A set of complex operations'
  merge: -1
  pgno: 135
- img_proc: true
  md: 'is performed on the stream elements, with all temporary data being generated
    and consumed locally, thereby reducing the number of trips to the memory.


    Stream programs exploit SIMD (Single Instruction stream, Multiple Data stream)
    mode of parallelism, since the same complex operation is performed on every stream
    element. SIMD execution simplifies access to shared data, because explicit synchronization
    is not required. Memory operations can be coordinated and optimized for high bandwidth,
    using vector primitives like indexed memory and scatter-gather. Unlike traditional
    SIMD applications, however, network applications exhibit load imbalance and control
    variations, due to variable packet sizes and nonuniform processing requirements.
    Conditional streams [4] provide one approach for coping with these issues.


    After a brief introduction to the stream programming model and the Imagine architecture
    (Section 7.1), we present the implementation and performance of two applications:
    AES packet encryption (Section 7.2) and IPv4 packet forwarding (Section 7.3).
    These applications represent the extremes of computation-intensive (encryption)
    and memory-intensive (forwarding) applications. With some minor architectural
    changes, we find that a 500-MHz Imagine processor can deliver 1.6 Gb/s throughput
    for encryption and 2.9 Gb/s for forwarding on real packet traces.


    # BACKGROUND: STREAM PROGRAMS AND ARCHITECTURES


    For this performance and feasibility study, we have chosen the Imagine stream
    processor [5], designed by Kapasi et al. for media processing applications. Imagine
    provides eight multi-ALU compute clusters, operating in SIMD mode, and a stream-oriented
    memory hierarchy.


    # Stream Programming Model


    The stream programming model [3] expresses data as streams, which are sent to
    the kernels responsible for the processing of this data. The kernels consume a
    set of streams from the stream program, perform compound operations on the stream
    elements, and produce a set of output streams. The stream program is responsible
    for sending the input streams to the kernels, invoking them, and storing the output
    streams generated by the kernels. Figure 7.1 illustrates the data flow for a sample
    stream application.'
  merge: -1
  pgno: 136
- img_proc: true
  md: '# 7.1 Background: Stream Programs and Architectures


    ![](img/e172ff28bf6e0a7a974849165330f450_137_0.png)


    # 7.1


    Data flow of a sample stream application.


    FIGURE


    The stream programming model exposes the inherent parallelism in applications
    like packet processing so that it can be exploited by the stream architecture.
    This helps in maintaining high performance densities, while also providing programmability.
    This study relies on a set of stream programming tools developed at Stanford University
    for the Imagine processor [5]. These tools include the StreamC and KernelC programming
    languages and a stream scheduler for Imagine.


    # 7.1.2 Imagine Stream Architecture


    Imagine [5] is a processor designed to support the stream programming model for
    media processing applications. The block diagram of the Imagine stream processor
    is shown in Figure 7.2. It consists of eight VLIW clusters operating in a SIMD
    fashion, controlled by a microcontroller. Each cluster contains three adders,
    two multipliers, one divider, a 25-word scratchpad for temporary storage, and
    an interconnect communication unit. An attached host processor executes the high-level
    stream program, which deals with the creation and coordination of streams and
    kernels. Kernels are executed on the arithmetic


    The arithmetic clusters are supported by a three-level memory hierarchy. The highest
    level in the hierarchy is the local memory for each cluster, known as the Local
    Register File (LRF). There is a centralized register file (SRF), which is used
    to store and share data (streams) to/from the clusters and the memory. The lowest
    level consists of a streaming memory system that controls four DRAM chips. The
    stream programming model encourages the use of the LRF and SRF. A kernel produces
    and consumes local temporary values in the LRF; these values are never stored
    in main memory. Longer-lived values, passed between kernels, are expressed as
    streams, which are stored in the SRF. The main memory is needed only for the initial
    and final stream values, or for streams that are too large to fit in the SRF.'
