    ratio cut [19]. Ratio cut has the nice property of identifying “natural” clusters
    within a graph without the priori knowledge of the final number of clusters.


    The ratio cut algorithm is unfortunately NP-complete and thus not tractable for
    ADAGs with the number of nodes that we need to consider. Therefore, we propose
    a heuristic that is based on ratio cut and reduces the computational complexity
    while still achieving good results. Our heuristic is called maximum ratio cut
