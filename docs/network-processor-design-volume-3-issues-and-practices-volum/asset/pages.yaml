    # 8.4 CONCLUSIONS


    The programming environments—languages, compilers, and runtime systems—for NPs
    are in their infancy. At the same time, NPs represent a much larger trend in the
    processor industry: multicore, lightweight architectures designed for throughput-driven
    applications. This trend hits the main-stream programming marketplace, the need
    for a programming environment that is as easy to use as the programming environments
    for today’s workstations and servers will become universally important to programmers.
    The Shangri-La architecture represents a complete programming environment for
