    The GagaNetIC aims at developing high-speed components for networking applications
    based on massively parallel architectures. A central part of this project is the
    design, evaluation, and realization of a parameterizable network-processing unit.
    The proposed architecture is based on massively parallel processing, enabled by
    many processors, that form a homogeneous array of processing elements arranged
    in a hierarchical system topology with a powerful communication infrastructure.
    Four processing elements are connected via an on-chip bus to a “switch” (Section
    12.2.2), that allows an arbitrary forming of on-chip topologies. Hardware accelerators
    support the processing elements to achieve a higher throughput and help to reduce
    energy consumption. Following a top-down approach, network applications are analyzed
    and partitioned into smaller tasks. The tasks are mapped to dedicated parts of
    the system, where a parallelizing compiler exploits inherent level parallelism.
