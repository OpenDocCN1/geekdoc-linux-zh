    The analysis part of RNOS consists of formal models for the application, the input
    scenarios in terms of packet streams, the available hardware and software resource,
    and a calculus that allows determining the throughput and delaying as experienced
    by the input streams. The basic model is taken from Ref. [8] and extended toward
    the networking domain and small embedded devices.


    # 9.2.1 Application Model


    The application model defines the required functionality of the system. To be,
    the application model has to be easy to use and has to capture the domain-specific
    functionality [9]. One way of modeling the whole application is based on a partitioning
    into small processing units that will be denoted as tasks. In addition, the application
    model will be based on the notion of events, for example, a packet has been received
    or a timer elapsed. The combination of these concepts leads to the natural model
    that each event in the system has its own “program” that is triggered for execution
    when the event occurs and that consists of tasks.


    # Tasks


    Tasks are nonpreemptive execution blocks of code. Packers are received and delivered
    through, at most, one input and an arbitrary number of outputs, respectively.
    When a task executes, it takes the packet from the input, processes it, and depending
    on the content of the packet, puts the packet on one of its outputs. A source
    task has no inputs and will receive its packets from a driver, for example, from
    an Ethernet driver. A sink task has no outputs and will either consume the packet
    or it will pass the packet to a driver for transmit, for example, or pass it to
    the user mode, for example, to the socket interface. The worst case and best execution
    times of each task need to be known, either by formal analysis or by simulation
    in case of soft real-time constraints.


    # Task trees


    A whole application contains a set of task trees, which consist of connected tasks.
    In particular, each output of a task is connected to one input of another task
    and'
