    # 12.2 MODELING PACKET-PROCESSING SYSTEMS


    As mentioned in the beginning of the chapter, the application program and the
    hardware architecture of the multiprocessor are modeled in this framework. This
    section describes the two models and gives examples.


    # 12.2.1 Flow Processing Graph


    The packet-processing modeling technique is based on a task graph model, as proposed
    by Thiele at [15]. The functionality that the SoC has to provide is described
    by a flow processing graph FPG = (M,S) (see Figure 12.2). The nodes m $\in$ M
    represent packet methods. The edges s $\in$ S represent flow segments. The methods
    generate and process the packets, and the flow segments describe how the packets
    are forwarded between the methods.


    Each flow segment has a specific bandwidth B, as well as a minimum packet size
    $p_{min}$ and a maximum packet size $p_{max}$. An instance l $\in$ L of a protocol
    layer consists of a set of methods M$_\in$ M that share a common state Z. The
    state contains data structures that are shared by the methods of the corresponding
    layer. It can also be used to store information if the packets of the flow segment
    are not independent. For example, packet reordering in the transport layer can
    be implemented by storing a packet inside the state that is sorted according to
    the sequence number of the received packets. Once all packet fragments have been
    collected, the complete packet can be forwarded to the application layer. A packet
    flow pf $\in$ PF is a list of flow segments that describes'
