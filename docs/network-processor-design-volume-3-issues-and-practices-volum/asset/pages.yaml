    # 7.3 IPv4 FORWARDING


    Routing and forwarding applications tend to be memory-intensive, involving a series
    of pattern matches and table lookups. Since IPv4 is the most widely used protocol
    for Layer 3 routing and involves the most amount of processing time (compared
    to other switching schemes like MPLS), we use an IPv4 forwarding algorithm proposed
    by Mehhtra [23] as a case study. This algorithm involves a series of lookups from
    a small, compact table, followed by a single lookup in a larger table to determine
    the output port. The benchmark includes only the route lookup portion of IPv4
    forwarding.


    The IP forwarding algorithm proposed by Mehhtra [23] employs a tri-based scheme,
    wherein the routing table is compacted enough to be stored in the on-chip SRAM
    of a day processor (around 512 KB to 1 MB). The table containing the next-hop
    values is stored in the DRAM (DRAM table). For this study, we use a 16-degree
    tri (i.e., each node has 16 children) with eight levels. The SRAM table is built
    by storing a 1 or 0 for every node of the tri, depending on whether it has nodes
    or not. Correspondingly, each of the child nodes will be represented by 1 or 0
    in the SRAM table, based on whether it has child nodes or not. Thus, only the
    leaf nodes of the tri structure will be represented by 0s in the SRAM table.


    The route lookup is done in two stages. The first stage involves only SRAM lookups
    using four bits of the address to index into each level of the SRAM table.'
