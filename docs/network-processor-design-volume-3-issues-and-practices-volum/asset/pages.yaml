  md: '# 10 On the Feasibility of Using Network Processors for DNA Queries


    Although Blast resembles certain algorithms in networking (e.g., programs that
    scan the contents of a packet for the signature of a worm), there are some differences.
    Whereas signature algorithms often try to find an exact match for an entire string,
    Blast also performs partial matches. In other words, when a substring of a certain
    minimum size in the query matches a substring of the same size in DNAdb, this
    is logged. In this chapter, this minimum size is referred to as the window size.


