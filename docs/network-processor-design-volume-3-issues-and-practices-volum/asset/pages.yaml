    a set of SBs $SB_{G,c}$, and a set of physical ports $PP_c$. For each physical
    port $PP$, a set of assigned local ports $LPP$ is also created. In Figure 12.3,
    each processing cluster has a width of two PEs and a depth of one PE. The figure
    shows how the logic layers are assigned to physical ports. In processing cluster,
    only the local layers that are related to the physical ports in the cluster are
    executed.


    For communication cost computation, a shortest-path algorithm is used where the
    links are weighted with the resource that has to be minimized (energy or delay
    for forwarding a maximum-sized packet, see Section 12.5). All local layers that
    work for a logical port are assigned to the processing cluster the port belongs
    to. In Figure 12.3, the physical and medium access layers 1 and 2 are assigned
    to processing cluster 1; and 4 to processing cluster 2; etc. In order to be able
    to compute communications costs between clusters, the local layers are initially
    assigned to the physical ports. Global layers are not assigned to processing clusters.


    Now, for every cluster, the layers that belong to the cluster are assigned to
    their PEs by solving an integer linear-optimization problem, defined in Ref. [19].
