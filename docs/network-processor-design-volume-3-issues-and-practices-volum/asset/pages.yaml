  md: '# Application Analysis and Resource Mapping


    Our approach to this problem is to analyze the run-time characteristics of NP
    applications and develop an abstract representation of the processing steps and
    their dependencies. This creates an annotated directed acyclic graph (ADAG), which
    is an architecture-independent representation of an application. The annotations
    indicate the processing requirements of each block and the strength of the dependency
    between blocks. The basic idea is that we build the application representation
    bottom-up. We consider each individual data and control dependency between instructions
    and group them into larger clusters, which make up the ADAG. The ADAG can then
    be used to determine an optimal allocation of processing blocks to any arbitrary
    NP architecture. Our contributions are as follows:


    +   1. A methodology for automatically identifying processing blocks from a run-time
    analysis of NP applications.


    +   2. An algorithm to group cohesive processing blocks into processing clusters
    and a heuristic to efficiently approximate this NP-complete problem. The result
    is an application graph (ADAG) that is an architecture-independent description
    of the processing requirements.


    +   3. A mapping (or scheduling) algorithm to dynamically allocate processing
    clusters to processing resources on arbitrary network architectures.


    We present the results for all these points using four realistic applications.
    One of the key points of this work is that the ADAG can be created automatically
    from a run-time instruction trace of the program on a uniprocessor


    The results from this work can help in to support high-level programming abstractions
    on heterogeneous NP platforms. Also, quantitative descriptions of the processing
    steps in terms of processing complexity and amount of communication between processing
    steps are the basis for any efficient scheduling. Further, the ADAG representation
    of an application gives very intuitive insights into the type of parallelism present
    in the application (e.g., multiprocessing vs. pipelining). Finally, the proposed
    scheduling algorithm can map packets at run-time to processing resources, which
    is superior to static approaches, that are dependent on a priori knowledge of
    traffic patterns.


    In Section 13.1, we briefly discuss related work. Section 13.2 discusses the run-time
    analysis of NP applications and how we obtain the necessary profiling information.
    To get from the profiling information to an ADAG representation, we use a clustering
    algorithm that is discussed in Section 13.3. The results of the application analysis
    and the resulting ADAGs are presented for four applications in Section 13.4. The
    scheduling algorithm that maps the ADAGs to processing'
  merge: -1
  pgno: 297
- img_proc: true
  md: 'resources is presented in Section 13.5. Finally, Section 13.6 summarizes and
    concludes this chapter.


    # 13.1 RELATED WORK


    There has been some work in the area of application analysis and programming abstraction
    for network processors. Shah et al. have proposed NP-Click [8] as an extension
    to the Click modular router [9] that provides architecture and program abstractions
    for network processors. And similar approaches require a priori understanding
    of application details in order to derive application modules. The problem with
    this approach is two-fold:


    +   1. It assumes that the application developer can identify all properties,
    which requires a deep understanding and careful analysis of the application. This
    will become an increasing problem as programming for network processors move towards
    higher-level and more complex abstractions. In systems the application developer
    has less understanding on how a piece of code can be structured to match the underlying
    hardware infrastructure.

    2. No run-time information is involved in application analysis. This is a crucial
    piece of information to use in making scheduling decisions. Using static application
    information only biases the results towards particular programming abstractions.


    Therefore, we feel that it is crucial that application characteristics can be
    derived automatically as we propose in our work.


    In NEPAL [10], Memik and Gagne-Smith propose a run-time system that controls the
    execution of applications on a network processor. Applications are separated into
    modules at the task level using the NEPAL API and modules are mapped to execution
    cores dynamically. There is an extra level of translation during which the application
    code is converted to modules. We avoid this translation and work directly with
    the dynamic trace to generate basic blocks at a fine-grained level.


    The problem of partitioning and mapping applications has been studied previously
    in the context of grid computing. Taura and Chien [11] present an approach that
    is similar to ours, but is used at a very high level to map an application on
    several heterogeneous computing resources over the Internet.


    Our work is similar to some of the ideas used in trace scheduling [12] and superblocks
    [13], but is applied to a different domain. Trace scheduling aims to generate
    optimized code for VLIW architectures by exploiting more'
  merge: -1
  pgno: 298
- img_proc: true
  md: '# 13.2 Application Analysis


    instruction-level parallelism. Linear sequences of basic blocks are grouped to
    form larger basic blocks and dependencies are updated. We use a clustering algorithm
    for this purpose, which works on a dynamic instruction trace after all basic blocks
    have been identified.


    The exploration of application characteristics, modularization, and mapping to
    resources has also been studied extensively in the context of multiprocessor systems.
    An example for scheduling of DAGs on multiprocessors is Ref. [14]. In the network
    processing environment, applications are much smaller and a more careful analysis
    can be performed. The bottom-up approach that we propose in Section 13.3 is not
    feasible for large applications, but yields detailed application properties for
    packet-processing functions. Another difference between multiprocessors and NPs
    is that NPs at achieving high throughput without short delay in execution.


    Mapping and scheduling of DAGs or task graphs has been surveyed by Kwok and Ahmad
    [15] and we propose a scheduling algorithm similar to that introduced by El-Rewini
    and Lewis [16]. The main difference in both cases is that we are considering a
    heterogeneous processing platform, where tasks can take different amounts of processing
    time (e.g., depending on the purpose processors versus coprocessors). Similar
    algorithms have also been used in the VLSI CAD area. Clustering approaches similar
    to ours have been surveyed by Alpert and Kahng [17]. The methodology of clustering
    functionality proposed by Karypis et al. [18] is similar to ours, but applied
    to the VLSI domain.


    # 13.2 APPLICATION ANALYSIS


    Our goal is to generate workload models that can be used for network scheduling
    independent of the underlying hardware architecture. There are a number of approaches
    that have been developed for multiprocessor systems, real-time systems, and compiler
    optimization that characterize applications, and our approach uses some of these
    well-known concepts. The main difference is that network processing applications
    are very simple and execute a relatively small number of instructions (as compared
    to workstation applications). This allows us to use more detailed analysis methods
    that would be infeasible for large programs. Also, there are a few issues that
    are specific to the NP domain and usually are not considered for workstation applications.
    When exploiting parallelism in NP applications, we do not necessarily have to
    use multiple parallel processors for one packet, but we can also use pipelining.
    Additionally, the heterogeneity of processing resources requires that we can identify
    the portions of an application that can be executed on specialized coprocessors.'
