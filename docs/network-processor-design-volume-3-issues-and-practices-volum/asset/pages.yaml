    # 11.3 PIPELINE DESIGN WITH GREEDPYIPE


    In systems, such as network processors, with multiple pipelines and flows, determining
    the best pipeline and algorithm partitioning and pipeline stage assignment is
    difficult. The designer typically has a number of tradeoffs to consider, including
    the following:


    +   **Number of pipeline stages and number of pipelines.** Given applications,
    and associated flows, that have been partitioned into a number of ordered tasks,
    a designer can select the number of pipeline stages to implement. Up to a point,
    more stages generally result in higher throughput; however, more stages also require
    more chip area and high power consumption. Greedypipe can be used to determine
    just what throughput can be achieved with a varying number of stages and pipelines.


    +   **Algorithm sharing.** When multiple flows and associated applications are
    present, there is often an opportunity for the sharing of applications or of individual
    tasks across flows. This may result in smaller overall code space being required,
    which in turn, may reduce the cost of on-chip memory, or increase performance
    due to reduced instruction cache miss rates. However, when tasks are shared, there
    is less flexibility in task-to-task assignment and generally lower overall throughput
    results. Greedypipe permits fast determination of the performance effects related
    to task sharing.


