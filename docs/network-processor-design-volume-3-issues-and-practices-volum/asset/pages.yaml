  md: '# 6 A Hardware Platform for Network Intrusion Detection and Prevention


    and character-match signals are distributed to the pattern-matching units. A pattern-matching
    unit is instantiated for each pattern in the ruleset. The pattern matches use
    a nondeterministic finite automata (NFA) to track matches between the input data
    and the stored patterns. Each pattern-matching unit has an output indicating that
    a complete pattern match has occurred. Rules with multiple patterns, all of the
    corresponding pattern-matching outputs are passed through an AND gate to generate
    a rule match output. The rule signals for all N rules are stored in a match vector.
    After the last character of a packet is processed, the output encoder packs the
    match results into 32-bit words and sends them to the IDS decision engine.


    We have developed a software tool that translates a Snort rule into an FPGA circuit
    description for matching pattern strings. The circuit description is then sent
    over the network to the NNIDS where it is used to reconfigure the FPGA pattern-matcher.
    The circuit generator software supports all the standard Snort options for pattern-matching
    [26]. Each pattern in a Snort rule can be specified to allow a certain number
    of character mismatches (substitutions, insertions, or deletions) between the
    pattern and the packet''s content. This is useful for detecting an attack pattern
    that is expected to contain some variable content, but the exact variants are
    unknown or too numerous to list as separate patterns. It can also help detect
    new exploits that are similar to known exploits.


    # 6.2.5 Reusable IXP Libraries


    Programming the microengines is difficult because there is no operating system
    or support library. In the course of this project, we have developed a set of
    libraries and development tools that are essential for building NIDS on the IXP.
    These include a memory management library, a queue management library, a multithreaded
    packet capturing and filtering library, an IP fragment reassembly library, and
    a tool that converts standard pcap captures to the format used by the IXP simulator.


    # 6.3 EVALUATION AND RESULTS


    We have evaluated the prototype system by performing functional verification,
    micro-benchmarks, and system-level benchmarks. The results are presented and analyzed
    in this section.'
