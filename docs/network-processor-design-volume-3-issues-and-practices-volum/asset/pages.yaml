    # 2.4 RELATED WORK


    There is a considerable body of work in the independent areas of real-time cache
    analysis and multithreaded/multiprogrammed cache analysis and design.


    In the real-time literature, several groups have studied worst-case execution
    time (WCET) cache analysis [12–14]. Each of these techniques propose analytical
    methods for bounding the performance of a given program on a given processor and
    cache organization. The methods are descriptive and do not prescribe improvements
    in program structure should the WCET to be great.


    Instruction delivery in multithreaded processors were first considered in the
    design of the first multithreaded computers [15] and multicputers [16]. More recent
    studies evaluate workstation and server cache performance and requirements [17]
    on multithreaded architectures, as well as the previously worked on compilation
    for instruction cache performance on multithreaded processors [11].


    Column caching [18] is a dynamic cache partitioning technique in which individual
    associates are allocated for various purposes, such as threads or programs for
    guaranteed performance. The drawback is that high associativity are needed for
    a high degree of allocation. In any case, segmentation, which does not require
    set-associativity, orthogonal to column caching and could be used to increase
    the granularity of allocation.


    Other approaches [19, 20] have also considered allocating portions of a cache
    at varying granularities, from individual data objects to processes. The overall
    aim of these projects is the same as ours—to use distinct cache regions'
  merge: -1
