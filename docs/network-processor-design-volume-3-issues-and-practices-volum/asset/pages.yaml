  md: '# 5.2 Architecture of TOE Solution


    could be safely moved to hardware. The motivation is to free the programmer from
    the responsibility of maintaining and scheduling threads and to mitigate human
    error. This model is thus simpler than the common model of a programmer- or compiler-generated
    multithreaded code that runs on a single-threaded engine can run unmodified on
    this engine with greater efficiency. The overhead penalty for switching between
    threads is kept minimal to achieve better throughput. The architecture also provides
    instructions to support legacy manual multithreaded programming.


    Hardware multithreading is best illustrated with an example. TCP packet processing
    requires several memory accesses as well as synchronization points with the DMA
    engine that can cause the core to stall, while waiting for a response from long
    latency operations. If such trigger are identified (A-F) in pipeline diagrams
    in Figure 5.7. If core processing occurs prior to DMA, thread switch back to update
    the context with processed results and the updated context is written back to
    the TCB. Thread switches can happen on both transmit and receive processing. Unlike
    typical multithreading where thread switch, lock/unlock, and yield points are
    manually controlled, the TCP-aware scheduler controls the switching and synchronization
    between different threads in all the above cases.


    A single thread is associated with each network packet being processed, both incoming
    and outgoing. This differs from other approaches that associate threads with each
    task to be performed, irrespective of the packet. The scheduler spawns a thread
    when a packet belonging to a new connection needs to be processed. A second packet
    for that connection will not be assigned a thread until the first packet is completely
    processed and the updated context has written back to TCB. This is under the control
    of the scheduler. When the processing of a packet in the core is stalled, the
    scheduler will spawn a thread for a packet on a different connection. It could
    also wake up a thread for a previously suspended packet by restoring its state
    and allow it to run to completion. In this approach, the scheduler also spawns
    special maintenance threads for global tasks like gathering statistics on Ethernet
    traffic.


    The priority mechanism to determine which packet to schedule next is programmed
    into the scheduler. The scheduler has to arbitrate between events that wake up
    or spawn threads from the following categories (as shown in Figure 5.9):


    +   New packets on fresh connections, or on existing connections with no active
    packets in the engine.'
