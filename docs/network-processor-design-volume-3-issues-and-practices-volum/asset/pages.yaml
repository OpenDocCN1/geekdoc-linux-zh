    # 11.3.2 Sharing of Tasks Between Flows


    Task sharing between flows leads to an interdependence between the flows. This
    may be advantageous and result in better memory utilization and lower instruction
    miss rates; however, it also restricts the number of assignment options and thus
    reduces the maximum throughput.


    Experiments were conducted for the case of six flows, 20 tasks per flow and a
