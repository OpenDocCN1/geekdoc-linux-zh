    The rising interest in new interconnect standards has recently been covered by
    several articles [2, 5, 6]. Although in Ref. [5] some details have been compared,
    no comprehensive picture has been drawn of the essential elements of the interfaces.
    A thorough survey of I/O adapters and network technologies in general is presented
    in Ref. [7]. The paper particularly focuses on requirements for server I/O.


    We are interested in the higher-level interface and protocol aspects. To us, it
    is especially interesting to see how much we can gain from the fact that network
    processors already deal with packet-oriented communication protocols in a flexible
    way. In Ref. [8], an architecture is described that realizes low-performance communication
    interfaces in software on a specialized processor with custom operating system.
    A major obstacle to a flexible solution is obviously the different physical characteristics
    of the protocols. This issue, already addressed by initiatives, such as the Unified
    10 Gbps Physical-Layer Initiative (UXPI), and individual companies, such as Magnus


    Apart from comparing and analyzing three selected communication standards, the
    goal of this chapter is to clarify tradeoffs involved with implementing RapidIO,
    Hypertransport, and PCI-Express. For this purpose, we focus on the part of single
    end-point interfaces that is traditionally implemented in hardware using ASICs.


    This chapter is organized as follows. In the next section we introduce and compare
    the set of fundamental tasks performed by our interfaces. In Section 4.2, we describe
    the functional models of RapidIO, Hypertransport, and PCI-Express using Click.
    In Section 4.3, we evaluate the feasibility of implementing the communication
    standards in a flexible manner using existing network processor infrastructure.
    We summarize and conclude in Section 4.4.


    # 4.1 INTERFACE FUNDAMENTALS AND COMPARISON


    Since all three communication protocols are packet-oriented and based on point-to-point
    links, their endpoint interfaces are fairly similar with respect to function and
    structure. In this section, we describe common concepts and identify fundamental
    tasks that are shared among them.


    # 4.1.1 Functional Layers


    The structure of communication interfaces can be defined in three functional layers
    following the OSI/ISO reference model, as shown in Figure 4.2. Each layer provides
    a service to the above layer by using the service of the layer below. Peer layers
    on different nodes communicate with each other using protocols, which'
