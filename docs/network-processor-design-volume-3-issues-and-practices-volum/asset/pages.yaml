  md: '# 6 A Hardware Platform for Network Intrusion Detection and Prevention


    We have also described our experience in implementing a prototype NNIDS based
    on Snort, an Intel IX 1200, and a Xilinx Virtex-1000 FPGA. We also developed,
    and will make available, several libraries that are essential for building IDS
    on the IX We have conducted benchmarking experiments to study the performance
    characteristics of the NNIDS components. These experiments help us identify the
    performance bottlenecks and gain insights on how to improve our design. System
    stress tests showed that our embedded NNIDS can handle high-speed traffic without
    packet drops and achieve the same performance as the Snort software running on
    a dedicated high-end computer system.


    Our ongoing work includes optimizing the performance of our NNIDS, developing
    strategies for sustainable operation of the NNIDS under attacks through adaptation
    and active countermeasures, studying algorithms for distributed and collaborative
    intrusion detection, and further developing the analytical models for buffer and
    processor allocation. We are in the process of porter our design to the next generation
    of IX processors and plan to utilize higher-performance and more tightly-integrated
    FPGA resources. We expect our system to reach multigabit performance on the IX
    2400 and IX 2800. We have tested FPGA pattern-matching designs to approach 10
    Gbps throughput with the Snort rules using a Xilinx Virtex2 device. At rates beyond
    10 Gbps, with top-of-the-line FPGAs, it is not possible to fit all the Snort patterns
    into a single chip. However, we have developed designs capable of pattern-matching
    up to 100 Gbps with a smaller ruleset, and multiple FPGAs can be used in parallel
    to increase capacity [28].


    In summary, we have provided a better understanding of the design principles and
    implementation techniques for building high-speed, reliable, and scalable network
    intrusion detection systems.


