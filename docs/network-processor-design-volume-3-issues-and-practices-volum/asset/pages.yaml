  md: '# 2.3 Experimental Evaluation


    # 2.2.4 Enforcing Instruction Memory Bandwidth Limits


    Since the path to memory where the rest of the program is stored (i.e., from which
    misses are serviced) is likely to be a resource shared by real-time activities
    (e.g., data or I/O accesses), it might be necessary to limit interference from
    instruction cache misses. There are two considerations. First is to keep the required
    instruction memory bandwidth at a level sufficient to meet any time constraints.
    The second is to keep the required instruction memory bandwidth deterministic
    so that adequate provisioning of system resources can be performed.


    To both of these ends, one could employ an instruction fetch throttle that determines
    the bandwidth allocated to instruction fetches. In this way, the instruction request
    rate can be set by the system and thread bounded for the purpose of system provisioning.
    One policy, for example, would be to give instruction access priority over all
    other memory transactions. The actual amount of instruction memory bandwidth allocated
    will be a system-level query, while the bandwidth required will be a consequence
    of program size, execution pattern, thread scheduling pattern, and region size.
    We plan to explore mechanisms to support such policies in future work.


