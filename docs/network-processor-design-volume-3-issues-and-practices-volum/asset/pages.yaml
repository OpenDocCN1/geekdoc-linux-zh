  md: '# 3.2 Our Approach


    work in network cache design borrowed concepts from computer architecture (LRU
    stacks, set-associative multilevel caches) [10]. Some caching strategies rely
    on CPU L1 and L2 caches [7] while others attempt to map the IP address space to
    memory address space in order to take advantage of the hardware TLB [15]. Another
    approach is to add explicit timeout to an LRU-associative cache to improve performance
    by reducing thrashing [11]. More recently, in addition to leveraging the temporal
    locality of packets observed on networks, improving improving cache performance
    have applied techniques to compress and cache IP ranges to take advantage of the
    spatial locality in the address space of flow identifiers [16, 17]. This effectively
    allows multiple flows to be cached in a single cache entry, so that the entire
    cache may be placed into small high-speed memory such as a processor’s L1/L2 cache.
    There has been work using Bloom filters for prefix-matching schemes [18].


    Much of this work is not applicable to higher-level flow identification, which
    is the motivation for our work. Additionally, all of these work are fundamentally
    different from the material presented in this chapter, because they consider only
    exact caching strategies. Our approach attempts to maximize performance given
    constrained resources and an allowable error rate.


    # OUR APPROACH


    Network cache designs typically employ simple set-associative hash tables, ideas
    that are borrowed from their traditional memory management counterparts. The goal
    of the hash tables is to quickly determine the operation or forwarding interface
    that should be used, given the flow identifier. Hashing the flow identifier allows
    traditional network processors to determine what operation or forwarding interface
    should be used while examining only a couple of entries in the cache. We believe
    one limitation of exact matching caches for flow identifiers is the need to store
    quite large flow identifiers (e.g., 37 bytes for an IPv6 flow). This limits the
    amount of information can cache or increases the time necessary to find information
    in the cache.


    In this chapter, we propose the notion of digest caches. The most important property
    of a digest cache is that it stores only a hash of the flow identifier instead
    of the entire flow identifier: The goal of the digest is to significantly reduce
    the amount of information stored in the cache, in exchange for a small amount
    of error in cache lookups. As will be described later in this section, digest
    caches can be used as the only cache for the packet'
