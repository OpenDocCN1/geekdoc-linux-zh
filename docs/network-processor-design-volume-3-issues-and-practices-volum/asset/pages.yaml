- img_proc: true
  md: 'classifier; allowing the packet classifier caches to be small. Second, they
    can be used as an initial lookup in an exact classification scenario. This allows
    a system to quickly partition the incoming packets into those that are in the
    exact cache and those that are not.


    In the rest of this section, we will motivate approximate algorithms for packet
    classification caches. We will then focus on properties of the digest cache, comparing
    it to previously proposed Bloom-filter-based packet classifiers, and using it
    to speed up exact packet classifiers.


    Digest caches are superior to Bloom caches in two ways. Cache lookups can be performed
    in a single memory access, and they allow direct addressing of elements, which
    can be used to implement efficient cache eviction algorithms, such as LRU.


    # 3.2.1 The Case for an Approximate Algorithm


    For the purposes of this study, we use a misclassification probability of one
    in a billion. Typically, TCP checksums will fail for approximately 1 in 1100 to
    1 in 32,000 packets, even when link-level CRCs admit error rates of only 1 in
    4 billion errors. On average, 1 in 16 to 1 in 10 billion TCP packets will contain
    an undetectable error! We contend that a misclassification probability of this
    magnitude will not meaningfully degrade network reliability. It is the responsibility
    of the system to detect and compensate for errors that may occur in the network
    [20].


    Errors in the network are typically self-healing in the sense that misdirected
    flows will be evicted from the cache as they have. Moreover, the network already
    guards against misconfigurations and mistakes made by the hardware. For example,
    the IP TTL fields are used to protect against routing loops in the network.


    Another argument underscores the unreliability of the network is that TCP flows
    that are in retransmission timeout (RTO) mode are of no use web browser. Flows
    that are stalled in RTO mode often result in the user establishing a web connection.
    In the case that a reload is necessary, a new ephemeral port will be chosen by
    the client, and thus a new flow identifier is constructed. If an approximate cache
    has misclassified a previous flow, it will have no impact on the classification
    of the new flow.


    In some cases, such as firewalls, it is undesirable for the cache systems to have
    errors. To "harden" approximate caching hardware, layer-4 hints such as TCP SYN
    flags can be used to force a full packet classification pass to ensure that new
    flows are not misclassified.'
