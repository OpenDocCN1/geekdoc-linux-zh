    150


    +   packet-processing applications (control- and data-path functions) without
    partitioning them across different types of processors.


    +   2. The programming environment should automate the allocation of processor,
    memory, and communication resources available in packet-processing systems to
    packet-processing functions.


    +   3. The programming environment should support mechanisms for dynamic adaptation
    of resources allocated to applications. These mechanisms should allow packet-processing
    systems to provide performance guarantees under fluctuating traffic conditions
    as well as ensure robustness of the system under attacks.


    +   4. The programming environment should enable packet-processing systems to
    achieve performance comparable to hand-tuned systems.


    +   5. The programming environment itself should be retargetable and extensible.


    In what follows, we describe our approach to designing a programming environment
    for packet-processing systems.


    # 8.2 SHANGRI-LA: A PROGRAMMING ENVIRONMENT FOR PACKET-PROCESSING SYSTEMS


    We apply the classic divide-and-conquer methodology of system design to develop
    a programming environment that meets our requirements. The architecture of our
    overall system, referred to as Shangri-La, is illustrated in Figure 8.1.


    To facilitate the development of packet-processing applications, Shangri-La defines
    Baker, a modular, domain-specific programming language that allows a network application
    to be specified as a composition of packet-processing functions (PPF). Baker allows
    unified specification of entire packet-processing applications (control and data
    path). A Baker is compiled to an abstract machine [captured by an Intermediate
    Representation (IR)], and is fed into the compilation system of Shangri-La.


    The compilation system of Shangri-La consists of three components: the profiler,
    pipeline compiler (or π-compiler), and aggregate compiler.


    The profiler (1) derives code and data profiles—such as the locality properties
    of data structures, frequencies of executions of different PPFs, the amount of
    communication between each pair of PPFs, etc.—by emulating the execution of the
    network application under representative traffic conditions; and (2) annotates
    the IR with the resulting profiles. It is important to note that the profiler
    emulates the abstract machine without any knowledge of the target'
