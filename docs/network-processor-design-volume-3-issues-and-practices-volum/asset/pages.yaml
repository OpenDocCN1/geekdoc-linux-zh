  md: '# 9 RNOS—A Middleware Platform for Low-Cost Packet-Processing Devices


    188


    is characterized by two properties:


    +   1. The middleware is constructed in a way that matches the analysis model.
    Therefore, the performance properties of the resulting implementation are within
    the calculated bounds.


    +   2. The programming interface reflects the abstraction provided by the application
    structure, that is, path trees and task paths, and the input model, is flows and
    microflows.


    In addition to the application, input, and resource models described in Section
    9.2, further concepts are provided to build the implementation model. One is the
    path-thread, which links packets (which are part of a flow and belong to a microflow)
    with a task path. The task path is defined by the microflow packet belongs to.
    The second element is the scheduler, which decides which path-thread and therefore
    which task is executed.


    # 9.3.1 Path-Threads


    For each packet that is to processed, a path-thread is created. A path-thread
    has a task counter; a packet, an associated flow and microflow description, and
    therefore uniquely identifies a task path. The task counter points to the next
    task to be executed. Figure 9.12 gives the complete picture of the elements of
    our implementation model.


    **Example 9.5.** In our scenario we have a source path-thread that matches the
    incoming packet to a microflow. If the microflow is known, the source path-thread
    will create a new path-thread for the packet of that microflow. Otherwise, it
    will create a path-thread for the default nonexistent-flow. Figure 9.13 shows
    the source path-thread and three path-threads that might be created by the source
    path-thread.


    # 9.3.2 Scheduler


    The scheduler decides which path-thread runs next. The selected path-thread will
    execute one task and surrender control back to the scheduler. We use an EDF scheduler
    to schedule the path-threads. As the tasks are nonpreemptive, the granularity
    of the tasks provides the preemption points for the EDF scheduler. Nonrealtime
    flows have an infinite deadline and therefore get executed only when there is
    no pending packet of a real-time flow.'
