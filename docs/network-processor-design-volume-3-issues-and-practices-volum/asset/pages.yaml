  md: '# 5 A High-Speed, Multithreaded TCP Offload Engine for 10 Gb/s Ethernet


    # Input processing


    TOE inbound packets from the NIC are buffered in header and payload queue. A splitter
    parses to separate packets payload from the header and forward the header to the
    scheduler unit. The execution engine performs a hash-based table lookup against
    the TCB cache, and on a hit, loads the context into the working register in the
    execution core. On a cache miss, the engine queues a processing under programmed
    control at high speed. The processing steps are summarized in the pipeline diagram
    in Figure 5.7a. The core also programs the DMA control unit and queues the DMA
    requests. Payload data is transferred from internal receive buffers to postings
    in host memory using DMA. This low latency DMA transfer is critical for high performance.
    Careful design allows the TCP processing to continue in parallel with the DMA
    operation. On completion of TCP processing, the context is updated with the processing
    results written back to the TCB cache. The scheduler also updates CQ with the
    completion descriptors and EQ with the status of completion, which can generate
    a host interrupt. This queuing mechanism enables events and interrupts to be coalesced
    for more efficient servicing by the CPU. The core also generates acknowledgement
    (ACK) headers as part of processing.


    # Output processing


    The host places doorbell descriptors in DBQ. The doorbell contains pointers to
    transmit or receive descriptors'' buffers, which reside in host memory. The TOE
    is responsible for fetching and loading the descriptors in the TCB cache. The
    output processing steps are summarized in the pipeline diagram in Figure 5.7b.
    Scheduling a lookup against the local TCB identifies the connection with the corresponding
    context text loaded into the working register, starting core processing. The core
    programs the DMA control unit to queue the DMA requests. This provides autonomous
    transfer of data from payload locations in host memory to internal transmit buffers
    using DMA. Processed results are written back to the TCB cache. Completion notification
    of send is accomplished by polling CQ and EQ to signal end of transmit


