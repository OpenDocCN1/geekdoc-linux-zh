    # 4.2 Tasks on protocol layers for the different interfaces.


    In this section, we first discuss the use of Click for the functional description.
    Then, we present the individual models and discuss important communication scenarios.
    Our models capture the complete data and control flow for the steady state of
    a single-link device. Initialization, configuration, and status reporting are
    simplified. Since we are not interested in physical properties, we do not model
    clock recovery, or any synchronization on the physical layer. We verify our models
    by simulation using communication patterns that have been derived from the specifications.


    # 4.2.1 Click for Packet-Based Interfaces


    We implement our functional interface models in Click, a domain-specific framework
    for describing network applications [10]. We have chosen Click for several reasons:
    Click models are executable, implementation-independent, and'
  merge: -1
