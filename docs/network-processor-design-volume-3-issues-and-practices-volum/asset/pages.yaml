    # 6.3.3 System Benchmarks


    We run system-level benchmarks to determine how the components of the detection
    pipeline perform together. The testing environment was the same as described in
    Section 6.3.1. We modeled our experiments after tests described in a report issued
    by the NSS Group [27], a testing lab for commercial IDS products. These tests
    are designed to measure the performance of the system under varying levels of
    load. We used a traffic generator to send different rates of fixed-size UDP packets
    to the NNIDS sensor. Because of limitations of the software and hardware in our
    packet-generating computer, we were not able to run tests at maximum rate with
    minimum-sized packets.


    Because there is a fixed overhead for each packet, tests small packets generally
    yield lower performance since there are more packets being sent per. Due to our
    design goal of ending the analysis of a packet as early as possible in the pipeline,
    the cost of the packets has an effect on the performance. The most significant
    factor is the outcome of the Detection-1 stage. If a packet''s header matches
    the values of certain fields in one the Snort rules, it must be further checked
    by the Detection-2 phase. Otherwise, no further processing is necessary. Due to
    the communication bottleneck in Detection-2, it can become the limiting component
    under high utilization. To determine the effects of packet size and Detection-1
