    # 11.1.2 Performance Metrics


    While we have defined the set of possible legal assignments, to determine an optimal
    assignment, it is necessary to specify a performance metric. The metric of interest
    in the network processor environment generally relates to maximizing pipeline
    throughput (i.e., the number of packets per second flowing through the pipeline).


    We consider the case where there are one or more flows that may share tasks and
    (for simplicity) a single pipeline. Assume pipeline throughput is limited by the
    maximum execution time over all stages in the pipeline. The execution time for
    a stage is determined by the tasks assigned to each stage. Thus, the execution
    time for a single flow $j$, on stage $k$ is given by:


    ```

    $s_{jk} = \sum_{i=1}^{M_j} X_{ijk}t_{ij} \quad (11.2)$

    ```


    and the maximum execution time for flow $j$ across all the $R$ stages:


    ```

    $P_j = \max_{k=1}^R [s_{jk}] = \max_{i=1}^{M_j} [X_{ijk}t_{ij}] \quad (11.3)$

    ```'
