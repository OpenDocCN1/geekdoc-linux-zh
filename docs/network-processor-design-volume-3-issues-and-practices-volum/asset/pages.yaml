  md: '# 10 On the Feasibility of Using Network Processors for DNA Queries


    Again, there are only ways of streaming DNAdb into the NPU: (1) across the PCI
    bus, (2) via the network ports. We have chosen the latter solution for a number
    of reasons. IXPBlast is intended as a network service for molecular biologists.
    For this reason, the ability to stream network packets to cards from various places
    on the network is convenient. Second, in our case, the PCI bus that connects the
    IXP1200 to the Pentium is not very fast (64/66) and hence might be stretched by
    the gigabit speeds provided by 2 Gb network ports. Third, if a faster bus had
    been available, it is commonly stated (or not) that network service would outgrow
    fast bus (for example, OC-768 operates at 40 Gb/s, which is beyond the capacity
    of next-generation PCI buses like PCI-X 533). As our aim was to evaluate NPUs
    with an engine applying in a variety of DNA processing fields, not just Blast,
    the solution that (in potential) provides the highest throughput seemed best.
    Fourth, this decision seems in line with what NPUs were intended for: processing
    data coming from the network. Future versions of NPUs might try to optimize the
    network packets even more and we should therefore aim for a design that would
    benefit from such new features.


    The price we pay for this, is that we now have to dedicate valuable processing
    time on the IXP to packet reception, stripping off protocol headers, etc. Since
    the Blast algorithm performs a fair amount of computation per chunk of data (and
    an IXP1200 is not able to cope with gigabit speeds anyway), it would have been
    significantly faster, retrospect to, let the Pentium write the data in the IXP''s
    SDRAM directly.


    It should be mentioned that in IXBlastdirect the naive implementation, the encoding
    is deliberately suboptimal in size. although nucleotide can be encoded with as
    few as two bits, we found that this might yield less than optimal performance,
    as a result of all the extra shifting/bit extraction that is required. This is
    explained in more detail in Section 10.1.5.


    # Accessing the query


    While DNAdb does not fit even in the IXP''s SDRAM, this is not the case for the
    query. Meaningful queries are generally smaller than full DNAdb. Ideally, the
    query would be fully contained in the NPU''s registers. However, this is possible
    only for very small queries. In practice, query sizes range from a hundred to
    a few thousands nucleotides. This will easily fit in SRAM and possibly even in
    a 4 KB of scratch memory, depending on how nucleotides are encoded.


    +   We use 128 general-purpose registers and a 2-bit encoding for the nucleotides,
    the theoretical upperbound would be a query of 128 × 32/2 = 2048 nucleotides,
    which is still realistic. However, this would leave no registers for the computation.'
