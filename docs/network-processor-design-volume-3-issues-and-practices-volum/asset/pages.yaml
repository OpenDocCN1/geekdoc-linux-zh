    implies using services from the layer below. The three layers are as follows:


    +   **Physical layer (PHY).** Transmits data over the physical link by converting
    bits into electrical signals.

    * **Data link layer (DLL).** Manages the direct link between peer nodes and reliably
    transmits pieces of information across this link.

    * **Transaction layer (TA).** Establishes a communication stream between a pair
    of systems and controls the flow of information. Since switched networks require
    routing, different variants of the transaction layer may be used in endpoints
    and switches.


    Data flows through these layers in two independent directions: the transmit path
    (Tx), which sends data from the device core to the link, and the receive path
    (Rx), which propagates from the link to the device core. At each layer, additional
    control and status information for the peer layer of the opposite device is inserted
    (Tx side) into the data stream or sent by the peer layer is filtered (Rx side)
    out of the stream by the layer management block. A transaction at the transaction
    layer is represented as a packet. The data link layer forwards these transaction
    packets and generates its own data link layer packets for state information exchange.
    The physical layer first converts all packets into a stream of symbols, which
    are then serialized to the final bitstream.


    The terminology of the layers follows the PCI-Express specification. RapidIO uses
    a similar layered structure (logical, transport, and physical).'
