  md: '# A Framework for Design Space Exploration of Resource Efficient Network Processing
    on Multiprocessor SoCs


    12 CHAPTER


    Matthias Grünewald, Jörg-Christian Niemann, Mario Porrmann, Ulrich Rückert


    Heinz Nixdorf Institute and Department of Electrical Engineering, University of
    Paderborn, Germany


    In networking applications, a large number of users utilize different kinds of
    communication services, resulting in a large number of independent, parallel packet
    flows between their stationary or mobile devices. Additionally, network protocols
    are constantly changing, and the need to quickly adapt to these changes has resulted
    in the development of network processors (NPUs). NPUs contain a set of programmable
    and application-specific execution units that are connected via an efficient interconnect
    structure. Most commercially available NPUs are targeted for wired core and edge
    network applications, they are optimized for throughput. Research mainly concentrates
    on modeling and benchmarking existing NPUs. However, there exist only a few approaches
    that aid the design of NPUs as a microprocessor-based system-on-chip (SoC). This
    chapter presents a network packet-processing framework that focuses on the processor
    parallelism available and how it can be exploited to improve performance.


    The framework contains a programming model that allows a parallel description
    of the protocol stack, a system model to describe the hardware architecture of
    the microprocessor, and a nonblocking scheduling strategy for executing the implementation
    on the microprocessor. The software can be developed independently from the hardware
    with the help of a software library that contains interface functions to abstract
    the underlying hardware. The interface functions can also be used to obtain an
    integration with existing network simulators such as ns-2 [1] to allow a verification
    of the implementation.'
