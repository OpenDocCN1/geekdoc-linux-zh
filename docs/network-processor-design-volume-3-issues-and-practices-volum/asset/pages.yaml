  md: '# 12.3 Scheduling


    The use of GPS allows the forwarding of several flow segments over the same link
    with a bounded delay. Compared to the approaches in Refs. [6, 10] GPS scheduling
    removes the need to use bandwidth reservation or compute the schedule offline.
    If no packets are received from one flow segment, a higher service rate $B_i$
    is available for the other flow segments [Equation (12.1)]. Hence, they can be
    forwarded with a reduced delay.


    For this approach, each flit has a size of $q$ bits and contains a header of size
    $\hat{q}$ that indicates the flow segment to which the flit belongs. It is used
    inside the SBs to compute the correct finish time. PGPS is used to forward the
    flows on the links. The weight $\phi_{s,h}$ that segment $s$ requires on link
    $h$ is set in a way that the delay of the current received flit is below the reception
    time of the next flit from the same flow segment. The weight can be computed from
    the segment $B_h$ and link data rate $B_h$ by taking the flow header into account:


    ```

    $$\phi_{s,h} = \frac{1}{B_h(1-\frac{\hat{q}}{B_j})}$$

    ```


    The delay $D(s,h)$ per flit is equal to GPS:


    ```

    $D(s,h) \leq \frac{q}{\phi_{s,h} \cdot B_h} \sum_{s \in S_h} \phi_{s,h}$

    ```


    where the set $S_h$ contains the flow segments that forwarded on link $h$. To
    ensure that a link is not overloaded, its utilization $U_h$ has to be below one:


    ```

    $U_h = \sum_{s \in S_h} \phi_{s,h} \leq 1$

    ```


    This guarantees that the flit forwarding time is below the reception time of the
    next flit of the segment. Hence, each SB has to hold, at most, two flits per segment
    in its buffer. Since the flits can have a length that is only a fraction of the
    maximum packet size, the buffer requirements can be kept low. This tackles one
    important problem of NoC design since on-chip memory has high area requirements.
    However, the drawback of this method is that the reception time points of all
    links have to be synchronized in each SB.


