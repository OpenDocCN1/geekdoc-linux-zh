    in computer networks and enable a packet-based communication scheme. The usage
    of NoCs can solve many of the design problems found when implementing SoCs with
    deep submicron fabrication technologies [5]. NoCs structure interconnect links
    and hence allow a better prediction of their electrical properties, for example,
    delay and power requirements. The wires can also be reused for communication between
    different units, the number of wires can be reduced and their utilization can
    be increased. The input and output buffers also decouple the functional units,
    hence a locally globally asynchronous design style can be applied, reducing the
    problem of clock distribution. Since the interconnect topology can be arbitrary,
    NoCs scale better than topologies. However, there also exist new design challenges.
    Compared to traditional bus-multih interconnects, NoCs introduce an increased
    delay due to the multipih communication. Compared to LANs and WANs, the buffer
    space inside the routing nodes has to be kept low since on-chip memory has large
    area requirements. There already exists a large variety of hardware architectures
    for NoCs. They differ in the applied connection topology (folded torus [6], fat-tree
    [7], grid [8, 9, 10], butterfly fat-tree [11]), area requirements, and the communication
    services provided. However, none of these approaches has yielded the influence
    of the specific communication characteristic of the application on the performance
    of the NoC. In this chapter it is shown


    to close this gap.


    For mapping applications to microprocessor SoCs, there exist only a few comparable
    approaches. Crowley and Baer have presented a modeling framework for NPUs [12]
    that use the Click Modular Router to describe the application. Their framework
    is able to model devices (e.g., processors) and channels (e.g., memory and I/O
    buses) of the system. The framework has been used to analyze the performance of
    PC-based systems for packet forwarding in terms of throughput and delay. However,
    it lacks a method to map protocol functions to devices in an automated way. The
    method in this chapter takes the special design problems of SoCs such as area
    and power consumption into account. Franklin and Wolf [13, 14] have developed
    an analytical performance and power consumption model for an NPU that consists
    of a number of processor clusters each cluster has its own external memory. The
    received packet flows are uniformly distributed by a packet demultiplexer. This
    approach allows a more fine-grained distribution of protocol parts to processors
    that are equipped with smaller, faster and less energy-consuming on-chip memory.


