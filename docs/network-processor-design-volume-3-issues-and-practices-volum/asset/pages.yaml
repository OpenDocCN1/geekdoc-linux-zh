    contention (and thereby limit the number of hardware threads needed to utilize
    processor cores fully), NPs often support a multilevel memory hierarchy.


    To enable multiple processor cores to communicate effectively, NPs typically contain
    at least one, but usually many, forms of interprocessor communication (IPC) mechanisms.
    For example, threadsharing mechanisms are generally fast, but convey only a coarse
    granularity of information, whereas atomic shared memory operations can be quite
    fine grained, but have higher access latencies. NPs often provide hardware support
    for rings, queues, and blocking and nonblocking forms of synchronization. NP architectures
    from multiple vendors instantiate these architectural features [1–6].


    Depending on the types of applications to be supported, a packet-processing system
    may combine one or more NPs, general-purpose processors, and programmable logic
    elements. Thus, from a programmer''s perspective, NPs and packet-processing systems
    contain processors with heterogeneous capability—some processors may be fully
    programmable (e.g., the microengines and the Intel XCScale processors in the Intel
    IXP800 network processor), some may only support configuration (e.g., a classification
    coprocessor), while others may be fixed-function (e.g., a hash/crypto unit). Processors
    may communicate with each other using several different communication mechanisms
    (e.g., shared memory and message passing) with different bandwidth and latencies
    of communication. Finally, the memory system may support specialized functional
    capabilities (e.g., atomic increment/decrement operation, ternary CAM).


    # 8.1.3 Solution Requirements


    The unique characteristics of packet-processing applications, when combined with
    the sophitation of NP hardware, have resulted in a lack of good tools to automatically
    map such applications onto NPs. Today, application designers map applications
    to hardware manually at design. The complexity of such mappings and their variability
    across applications, architectures, and workloads makes programming NPs complex,
    tedious, and error-prone. Furthermore, when applications developed for one are
    ported to other platforms the performance does not scale as expected, and packet-processing
    systems so designed cannot adapt to dynamic changes in traffic conditions.


    These observations lead to five requirements for designing a programming environment
    for packet-processing systems:


    +   1. The programming environment should abstract away architectural details
    from the programmers. It should allow programmers to specify entire'
