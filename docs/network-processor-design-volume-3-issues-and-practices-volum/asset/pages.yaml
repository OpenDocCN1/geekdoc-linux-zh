    tnetwork data and have access to the key(s) to examine encrypted data. Some NNIDSs
    have been implemented as kernel- application-level software. However, the overhead
    of intrusion detection analysis can severely degrade the performance of other
    applications running on the host. Furthermore, if an attacker manages to compromise
    the host, he can also disable the NNIDS so that all of his malicious activities
    go undetected. We believe that these shortcomings can be adequately addressed
    by implementing the NNIDS on the network interface rather than on top of the host
    operating system.


    Network processors will be widely available and affordable in the near future
    and can be integrated into a network interface card (NIC) with a cost similar
    to other high-NICs. Having a NNIDS run on a NIC with a network processor has several
    advantages over a software NNIDS. These include minimal performance on the host
    system and much stronger protection for both the host and the IDS itself. A hardware
    NNIDS runs independently of the host operating system and can be “subversion-resistant”
    so that it continues to function even if the attached host is compromised. An
    attacker cannot disable the NNIDS if he penetrates the host because control flows
    to the network interface can be very restrictive. These facts make it desirable
    to install hardware NNIDS in critical systems or even all of the nodes on the
    network. This deployment scheme can scale to large and complex networks because
    NNIDS runs on an affordable NIC and analyzes only the traffic for its attached
    node.


    There are other research issues with NNIDS in addition to the placement of the
    analysis agent. The security policy that dictates network intrusion detection
    functions must be managed and enforced in a distributed fashion. This problem
    is similar to managing distributed firewalls [9]. We can learn from the research
    in distributed firewalls to develop a (perhaps similar) solution to the problem.
    The NNIDS also needs to perform event-sharing and collaborative analysis techniques
    to detect distributed attacks and share the workload when necessary. This problem
    is not necessarily unique to NNIDS because an NIDS using load-balancing techniques
    needs to deal with the same issue [14, 15]. In other words, we can borrow ideas
    from other research to address the issues with distributed NNIDS.


    # 6.1.2 Characterization of NIDS Components


    Before we design and implement an NIDS on a network processor, we must first analyze
    the performance characteristics of NIDS analysis. A real-time NIDS monitors network
    traffic by sniffing (capturing) network packets and analyzing the traffic data
    according to intrusion-detection rules. Typically, NIDS runs as application-level
    software. Network traffic data is captured using an operating'
