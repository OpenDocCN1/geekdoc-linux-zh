    # 6.1.3 Hardware Architecture Considerations


    It is clear from our discussion that there are potential performance gains if
    the NIDS components are implemented in a network processor where packet processing
    can take place close to the data source and can be carried out with a pipeline
    of processing engines. However, there are challenges to realize these performance
    gains.


    Intrusion detection is an interesting application from an NP (network processor)
    hardware architecture perspective because of its substantial resource requirements.
    Intrusion-detection analysis requires considerably more cycles and memory accesses
    per packet than required by traditional NP applications, such as IP routing and
    QoS scheduling. The analysis consists of several tasks with varying resource usage
    patterns; some tasks are compute-bound and some are memory-bound. Furthermore,
    the amount of work done for each packet is not constant.


    When designing the NNIDS system architecture, we considered both the requirements
    of the various analysis tasks as well as the capabilities of each hardware component.
    Based on these properties and experimental testing, our goal was to determine
    the most efficient allocation of tasks to hardware resources. Some of these tasks
    fit well into existing NP architectures and some do not. Figure 6.1 summarizes
    our criteria for mapping tasks to hardware processing elements. On the IXP, processing
    requiring relatively few or simple operations as applied to high-rate data can
    be implemented on the microengines. We put packet capturing and filtering, decoding,
    and preprocessing on the microengines. Each of these tasks naturally runs as one
    or more microengine


