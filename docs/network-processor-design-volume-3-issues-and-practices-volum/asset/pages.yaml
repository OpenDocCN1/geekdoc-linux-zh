  md: 'Acknowledgments


    # 12.7 CONCLUSIONS


    We have described a framework for implementing network protocols on multiprocessor
    SoCs. We have shown how to model the network protocol and the hardware architecture,
    how to schedule the execution to guarantee a user-defined protocol per port, how
    to assign the protocol functions to processors, and how to estimate the resource
    consumption of the final mapping with a component-based estimation model. During
    the mapping, either delay or error consumption per packet can be minimized. The
    methods can be applied in an early design phase and can be used to explore the
    design space created by different system parameters. A detailed exploration example
    has been presented to show how a medium access protocol for mobile ad hoc networks
    can be mapped to a multiprocessor SoC with up to 64 processors. The analysis has
    shown that such a system can achieve reasonable data rates for the examined application
    at a low power consumption. This methodology can also be used to identify the
    bottlenecks of the system as protocol functions whose computational complexity
    presents a higher throughput.


    The framework cannot yet handle external memories. A way to include them is to
    add memory interfaces to border PEs and to form groups of border PEs that share
    one memory. The external memory can be used to store large data structures such
    as packet queues or filter tables. By knowing the access pattern of the packet
    methods and the contention resolution mechanism on the shared memory channel,
    the worst-case memory access times can be determined analytically. Hence, the
    influence of the external memories on the execution time of the packet methods
    can be modeled and included in the scheduling scheme. In our future work, we want
    to implement the analyzed systems to prove the described concepts and to enhance
    our framework by adding more details, for example, external memories or overhead
    for task switching. We will also analyze those protocols for wired networks that
    are used in the network access domain.


