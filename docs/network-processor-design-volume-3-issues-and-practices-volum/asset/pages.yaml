  md: '# AES Encryption


    of the stream architecture for general packet processing. The computation-intensive
    application is packet encryption, using the AES (Advanced Encryption Standard)
    [6] symmetric-key cipher. AES has been implemented on all kinds of platforms,
    and it has proved to be versatile and fast. The Wireless LAN 802.1i working group
    is adopting AES to replace the existing vulnerable WEP algorithm. Moreover, the
    iSCSI protocols for Storage Area Network (SAN) relying on IPSec use AES for the
    key to secure data protection. For this benchmark, a sequence of packets is provided,
    along with a sequence of keys, and the payload of each packet is encrypted with
    the corresponding key.


    AES operates on 128-bit blocks of data, while the key can be any one of three
    sizes: 128, 192, and 256-bits. For this work, we choose a 128-bit combination
    of block size and key size, the cipher algorithm performs ten rounds of cryptographic
    operations in the main loop. There are four major functions within the round loop:
    SubBytes(), ShiftRows(), MixColumns(), and XORRoundKey(). Following the main loop
    is the final round, where only SubBytes(), ShiftRows(), and XORRoundKey are applied.


    There is a very efficient way of implementing the cipher by a lookup table, known
    as the T-table [7], on a 32-bit processor. The T-table is the result of one complex
    transformation on SubBytes(), ShiftRows(), MixColumns(), and XORRoundKey(). Hence,
    the main loop (without the final round) of encryption can be done in a table-lookup
    fashion. Each T-table (T$_i$) is a rotated version of the previous T-table (T$_{i-1}$).
    Therefore, with the expense of an extra rotation operation, storing only one T-table
    is enough. For the final round, the S-box [substitution table used in the SubBytes()
    function] has to be used instead of the T-table, due to the absence of the MixColumns()
    operation [6]. The S-box is not explicitly used in our work in order to save space.
    Instead, the S-box is derived by an extra mask operation over the T-table.


