    # 8.3.2 Profile-Guided, Automated Mapping Compiler


    The compiler complex of Shangri-La consists of the profiler, π-compiler, and aggregate
    compiler.


    Profiler


    In the Shangri-La architecture, the runtime characteristics of a network application—such
    as the locality properties of data structures, frequencies of executions between
    each pair of PPFs, the amount of communication between each PPF, etc.—are used
    to guide the allocation of processor, communication, and memory resources of packet-processing
    systems to applications. Such profile-driven compiler optimizations are not new;
    code layout, for example, has previously been improved through profile-guided
    optimizations, the profile data has been driven by first compiling the code without
    profile information, and then executing this code with instrumentation to gather
    the profile information, and finally recompiling the code with the newly gathered
    profile information. In the Shangri-La architecture, we do not believe this approach
    is feasible because it requires a reasonable first compilation and mapping of
    profile information. In addition, collecting profile information in hardware requires
    intrusive instrumentation of the code, or is restricted to statistics available
    through hardware-based performance monitoring units.


    Instead, the Shangri-La profiler derives data profiles by emulation the execution
    of the network application using the IR produced by the Baker parser. In addition
    to the IR produced from the runtime characteristics of a network application,
    the profiler needs application state that contains any persistent state that the
    network application uses to determine actions performed on packets—this includes,
    for instance, a route flow, flow-classification data structures, and any per-flow
    state; and a packet trace that identifies a representative mix and arrival pattern
    for packets at the targetpacket-processing system. The profiler derives statistics
    for the properties of interest through a functional emulation of the application
    under these representative conditions. Because the profiler emulates the abstract
    machine with sample packet traces, the compilation time is certainly increased
