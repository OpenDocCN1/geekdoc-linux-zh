  md: '# 8 A Programming Environment for Packet-Processing Systems


    instances of processors within a packet-processing system. The different types
    of processors available within a packet-processing system (and even within an
    NP) are often programmed using separate programming environments. In most cases,
    general-purpose processor cores included in packet-processing systems are programmed
    using conventional programming languages (e.g., C), compilers (e.g., the GNU C
    compiler), and operating systems (e.g., Linux). Programming environments for special
    cores in NPs, on the other hand, have their own tools and development methodologies
    that usually expose hardware details within the programming language and provide
    limited, if any, runtime systems for managing resources. The programmer, in turn,
    is required to develop hand-tuned code that carefully manages a variety of resources
    ensuring that the system can process incoming traffic at the line rate.


    Such hand-tuned,resource-mapping decisions are made at design time and are based
    on the performance expectations of the application, expected workload, and exact
    hardware configuration of the system. Consequently, when an application is ported
    from one platform to another, the performance rarely scales as expected due to
    mismatches between the mappings, workloads, and the new hardware.


    Even recent attempts at complete programming environments for NPs expose the hardware
    details to the programmer and involve the programmer in applications to packet-processing
    system resources [7, 8]. We predict that future generations of packet-processing
    systems will support a larger number and more types of processors, more diverse
    memory hierarchies, and more complex processor interconnects; hence, the difficulty
    in programming packet-processing systems will only increase over time.


    In this chapter, we describe our vision and design of a programming environment
    aimed at making future generations of packet-processing systems as easily programmable
    as today''s workstations and servers. Our programming environment consists of:
    (1) a domain-specific programming language for specifying packet-processing applications,
    (2) a compiler that incorporates profile-guided techniques for mapping packet-processing
    applications onto complex system architectures, and (3) a runtime system that
    dynamically adapts resource allocations to create systems that are more robust
    against attacks, achieve higher performance, and consume less power than current
    systems on similar hardware. The resulting environment facilitates rapid development
    of portable, high-performance packet-processing applications on programmable packet-processing
    systems.


    The rest of the chapter is organized as follows. In Section 8.1, we expose the
    characteristics of packet-processing applications and describe some of'
