    # CONCLUSIONS


    We have discussed the need for building high-speed NIDS that can reliably generate
    alerts as intrusions occur and have the intrinsic ability to scale as network
    infrastructure and attack sophistication evolves. We have analyzed the key design
    principles and argued that network intrusion-detection functions should be carried
    out by distributed and collaborative NNIDS at the end hosts. We have shown that
    an NNIDS running on the network interface instead of the host operating system
    can provide increased protection, reduced vulnerability to circumvention, and
    much lower overhead.'
