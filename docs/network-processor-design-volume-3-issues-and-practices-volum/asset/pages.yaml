    # 12.6.2 Results


    Architectures A and B differ in the total number of links (A has more links than
    B), the resulting number of SBs (B has four times less SBs than A), and the number
    of physical ports (B has fewer ports than A). Since a shared-memory SB is used,
    the memory bandwidth limits the data rate that the SB can handle per link. For
    the applied Virtual Silicon memory inside the SB, the available transfer bandwidth
    to the memory is utilized by 22 percent for five links and 36 percent for eight
    links. This means the data rate can be further increased. However, since memory
    bandwidth is reserved inside the PE for storing and reading the packets [Equation
    (12.17)], a higher data rate results in reduced computational power inside the
    PE. For the applied link data rate of 1 Gb/s, 27 percent of the memory bandwidth
    of the PE has to be reserved for the link interface.


    For the experiments, the number of PEs for the two system variants and the port
    data rate (see Table 12.2) were changed. Figure 12.7 shows the system configurations
    that are able to process the packets at the given data rate. Starting with a data
    rate of 4.05 Mb/s, the system computational power of a single PE is not enough
    to execute a single local MAC layer, hence the packet flow graph cannot be executed.
    An example is that the optimization strategy not meets its goals is the system
    B with 16 PEs. It has enough computational power to execute the flow processing
    graph. However, the optimization fails. This is due to the fact that the optimization
    is only optimal per cluster. During the delay-optimization, the PEs in the cluster
    are underutilized to achieve the least delay. When the global layers are assigned
    to PEs, all PEs are already utilized and have not left enough computational power
    to execute the global layers. Hence, the global layers cannot be assigned and
    the mapping fails. For the energy optimization, as few PEs as possible are used
