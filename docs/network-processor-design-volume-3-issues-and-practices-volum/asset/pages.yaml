  md: '# 13 Application Analysis and Resource Mapping


    # 13.6 CONCLUSIONS


    In this chapter, we have introduced an annotated, directed, acyclic graph characteristics
    and dependencies in an architecture-independent fashion. We have developed a methodology
    to automatically derive this ADAG from run-instruction traces that can be obtained
    from simulations. To consider the natural clustering of instances within an application,
    we have used maximum local ratio cut (MLRC) to group instruction blocks and reduce
    the overall ADAG size. For four network processing applications, we have presented
    such ADAGs and shown how the inherent parallelism (multiprocessing or pipelining)
    can be observed. Using the ADAG representation, processing steps can be allocated
    to processing resources using a heuristic that has node criticality as a metric.
    We have presented such a mapping and scheduling result to show its behavior.


    We believe this is an important step towards automatically analyzing applications
    and mapping processing tasks to heterogeneous architectures. For future work,
    we plan to further explore the issue of differences in run-time execution of packets
    and how it impacts the results from the analysis. We also want to compare the
    quality of the clustering obtained from minimum ratio cut with that of other sundry
    cut heuristics. Finally, it is necessary to develop a robust methodology for automatically
    identifying processing blocks for coprocessors and hardware accelerators.


