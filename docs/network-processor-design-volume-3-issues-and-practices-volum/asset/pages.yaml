  md: '# 3.2 Our Approach


    # 3.2.2 Dimensioning a Digest Cache


    The idea of our work is simply the direct comparison of hashed flow identifiers
    to match cached flows. In this sense, we will trade the accuracy of a cache for
    a reduced storage requirement. We will partition memory into a traditional, set-associative
    cache.


    When constructing our digest cache, we first need to decide how to allocate memory.
    Previous work has demonstrated that higher cache associativity yields better cache
    hit rates [10, 21]. However, in the case of the digest cache, an increase in the
    degree of associativity must be accompanied by an increase in the size of the
    flow''s hash, to compensate for the additional probability of collision.


    If the digest is a $c$-bit hash, and we have a $d$-way set-associative cache,
    then the probability of cache misidentification is


    ```

    $p \approx \frac{d}{2^c}

    ```


    The equation can be described as follows: Each cache line has $d$ entries, each
    entry of which can take $2^c$ values. A misclassification occurs when a new entry
    has coincidentally the same hash value as any of the existing $d$ entries. We
    must employ a strong hash to compensate for increasing collision opportunities
    (associativity).


    Figure 3.1 graphs the number of flows that a four-way set-associative cache can
    store, assuming different misclassification probability tolerances. The maximum
    number of addressable flows increases linearly with the amount of memory and decreases
    logarithmically with the packet misclassification rate.


    # 3.2.3 Theoretical Comparison


    To achieve a misclassification probability of one in a billion, a Bloom filter
    cache must use 30 independent hash functions to optimally use this memory. This
    allows us to store a maximum of $k$ flows in our cache [13].


    ```

    $k_{Bloomcache} = \frac{\ln(1 - p^{1/L})}{\ln(1 - L/M)}$

    ```


    where $L = 30$, the number of hash functions; $M$, the amount of memory, in bits;
    and $p$, the misidentification probability. To compare directly with a digest
    cache, the maximum number of flows that our scheme can store, independent of the'
