    # Forwarding kernel


    The forwarding kernel performs the essential task of obtaining the row and column
    addresses of the DRAM table for every packet. The kernel takes a stream of extracted
    packet data and outputs streams of processed and unprocessed packets. The forwarding
    kernel calculates the row and column address of each packet based on the information
    stored in the SRAM table. The row and column address calculation primarily involves
    a sum-of-1 operation, performed for every packet at every level of the table,
    which demands a lot of computation power: Mehrotra [22] satisfies the computational
    requirement of this sum-of-1 by dedicating a cascade of adders. However, we have
    used software optimizations to enhance the performance. First, two SRAM table
    nodes, each 16 bits, are packed into a 32-bit location in the SRAM. This maximizes
    the memory utilization and provides for a faster implementation, it reduces the
    number of trips to the SRAM. Second, the sum-of-1 is calculated with the help
    of scratchpad reads each bit at a time, from an array precomputed sums-of-1 for
    all possible combinations of eight bits. Four scratchpads are needed to obtain
    the sum-of-1 for one SRAM location (i.e., two SRAM table nodes), which improves
    performance dramatically to a software implementation using a shifter and an adder.


