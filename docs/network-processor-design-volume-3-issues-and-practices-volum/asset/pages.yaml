  md: '# On the Feasibility of Using Network Processors for DNA Queries


    10

    CHAPTER


    Herbert Bos

    Department of Computer Science, Vrije Universiteit Amsterdam,

    The Netherlands


    Kaiming Huang

    Leiden Institute of Advanced Computer Science, Universiteit Leiden,

    The Netherlands


    The term network processor unit (NPU) is used to describe novel architectures
    designed explicitly for processing large volumes of data at high rates. Although
    the first products became available only in the late 1990s, a huge interest, both
    industrial and academic, has led to there being over thirty different vendors
    worldwide, including major companies such as Intel, IBM, Motorola, and Cisco [1].
    The prime application area of NPUs has been network systems such as routers and
    network monitors that need to perform increasingly complex operations on data
    traffic at increasingly high link speeds. Indeed, to our knowledge, this has been
    the only application domain for NPUs to date. We observe, however, that bio-computing
    fields such as DNA processing share many of the properties and problems of high-speed
    networks. For example, in well-known algorithms like Blast and Smith-Waterman,
    a huge amount of data (e.g., the human genome) is scanned for particular DNA patterns
    [2]. This is similar to inspecting the content of each and every packet on a network
    link for the occurrence of the signature of an “Internet worm” (a typical, albeit
    rather demanding detection application [3]).


    We also observe that many bio-computing fields suffer from poorly performing software
    when run on common processors, which to a large extent can be attributed to the
    fact that the hardware is not geared for high throughput or the exploitation of
    parallelism. For example, in our lab the performance of the Blast algorithm was
    improved significantly when implemented on an FPGA compared to the identical algorithm
    on a state-of-the-art Pentium [4]. Similarly,'
  merge: -1
  pgno: 213
- img_proc: true
  md: '# 10 On the Feasibility of Using Network Processors for DNA Queries


    using an array of 16 FPGAs in the Bioceller project, the Smith-Waterman algorithm
    improved by a factor of 100-1000 [5]. Unfortunately, FPGAs are hard to program
    and VHDL programmers are scarce.Us are an interesting compromise between FPGAs
    and general-purpose processors; they can be programmed in C and exploit parallelism
    to deal with high rates. Indeed, the design is optimized to deal with such data
    streams.


    For this reason, we evaluated the suitability of NPUs for implementing known DNA
    algorithms, in particular Blast. To achieve a realistic performance measure, the
    first (parallelizable) stage of the Blast algorithm has been implemented on an
    Intel IXP1200 network processor and used to process realistic queries on the DNA
    of arafish. The implementation will be referred as IXP Blast throughout this chapter.


    The contribution of this chapter is two-fold. First, to know it is the first to
    apply NPUs in an application domain that is radically different from network systems.
    Second, it explores in detail the design and implementation of one particular
    algorithm in bio-informatics on a particular platform (the IXP1200). The hardware
    that we have used in the evaluation is a mere 232 MHz and provides no more than
    24 hardware contexts, while more modern NPUs of the same family operate at speeds
    that are almost an order of magnitude higher and offer up to 128 hardware contexts.
    Nevertheless, we feel confident that the results, bottlenecks identified, and
    lessons learned, apply to many different types of NPU, including the state of
    the art. The ultimate goal of this work, which the results presented in this chapter
    represent only a first step, is to empower molecular biologists so that they will
    be able to execute complicated DNA analysis algorithms on relatively cheap NPU
    boards plugged into their desktop computers. whereas contrasts often have to send
    their queries to a specialized department which then runs the algorithm on a costly
    cluster (such as the BlastMachine2 [6]) and subsequently returns the results.


    The remainder of this chapter is organized as follows. The software and hardware
    architecture are discussed in Section 10.1. Section 10.2 discusses implementation
    details. The implementation is evaluated in Section 10.3, while related work is
    described in Section 10.4. In Section 10.5, we conclude and attempt to evaluate
    the suitability of (future generations of) NPUs for DNA processing.


    # 10.1 ARCHITECTURE


    In this section, we discuss the problem area and the Blast algorithm, as well
    as the hardware and software configuration to implement the algorithm.'
