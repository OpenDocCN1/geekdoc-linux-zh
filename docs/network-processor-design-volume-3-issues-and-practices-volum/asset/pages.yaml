  md: '# A High-Speed, Multithreaded TCP Offload Engine for 10 Gb/s Ethernet


    Yatin Hoskote, Sriram Vangal, Vasantha Erraguntla, Nitin Borkar Processor Technology
    Labs, Hillsboro, OR 97124, USA


    Transmission Control Protocol (TCP) is a connection-oriented reliable protocol
    accounting for over eighty percent of network traffic. Today TCP processing is
    performed almost exclusively through software. Even with the advent of GHz processor
    speeds, there is a need for a dedicated TCP offload engine (TOE) to support high
    bandwidths of 10 Gb/s and beyond [1]. Several studies have shown that even state-of-the-art
    servers are forced to completely dedicate their CPUs to TCP processing when bandwidths
    exceed a few Gb/s [2]. At 10 Gbs, there are 14.8 M minimum-size Ethernet packets
    arriving every second, with a new packet arriving every 67.2 ns. Allowing a few
    nanoseconds for overhead, wire-speed TCP processing requires several instructions
    to be executed approximately 50 ns. Given that a majority of TCP traffic is composed
    of small packets [3], this is an overwhelming burden on the CPU. A generally accepted
    rule of thumb for network processing is 1 GHz CPU processing frequency is required
    for a 1 Gb/s Ethernet link. For smaller packets on saturated links, this requirement
    is often higher [4]. Ethernet bandwidth is slated to increase at a much faster
    rate than the processing power of leading edge microprocessors. Clearly, general-purpose
    MIPS will not be able to provide the required computing power in generations.
    One solution is to provide hardware support in the form of a TOE to offload some
    of this processing from the CPU. Figure 5.1 shows computer system consisting of
    a processor with a memory unit, a chipset, and a network interface card (NIC).
    The TOE can be physically part of the processor, the chipset, or the NIC. Of the
    three possible options, the TOE as part of the chipset would provide better access
    to host memory.'
