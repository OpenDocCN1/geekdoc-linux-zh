    # 9.3.3 Implementation


    The RNOS is implemented on top of an existing real-time operating system. It runs
    in one thread of the RTOS. The only precondition to the RTOS is that it must be
    capable of providing a predefined amount of processing power to the RNOS. In our
    implementation, the RNOS gets 6 ms of processing power in each interval of 10
    ms; see Example 9.3. RNOS is implemented in Embedded C++ +. A complete set of
    APIs and base classes allow an efficient implementation of networking applications.
    Figure 9.14 depicts the elements of the RNOS and that runs in a thread of the
    underlying RTOS.


    Programming with RNOS is different than programming with a standard RTOS. Applications
    are built from a set of existing and new tasks. Since the analysis cannot be completed
    without having the worst-case and best-case execution times of all the tasks,
    the tasks themselves have to be programmed first. The RNOS supports the measurement
    of worst-case and best-case execution times. The best-case execution time is measured
    while executing the task on an idle system while all the interrupts are disabled
    and the task has been preloaded into the cache. The worst-case execution time
    is more difficult to determine. To that, the worst-case'
