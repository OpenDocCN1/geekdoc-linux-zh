    # Aggregate compiler


    The aggregate compiler receives from the re-compiler a set of aggregates, their
    mappings to hardware processing cores, as well as a policy for managing the memory
    hierarchy. The aggregate compiler performs both machine-dependent and machine-independent
    optimizations with the objectives of maximizing performance and throughput of
    each aggregate. For each aggregate mapped to a target processing core, the aggregate
    compiler produces the output in the form of assembly or object code with a set
    of annotations by the RTS. It is common for an NP to contain multiple types of
    processing cores. The aggregate compiler needs to generate multiple versions of
    aggregate code in each aggregate that may be mapped to multiple types of processing
    cores.


    Many compiler analysis and optimization techniques developed for general-purpose
    compilation are applicable to compiling packet-processing applications on NPs.
    For example, interprocedural analysis performs various types of analysis functions
    to sharpen analysis results to many subsequent optimizations. Memory optimizations,
    such as placing prefetches and reordering data layout or object fields, can hide
    the latency in memory accesses or improve the spatial locality of accessed data.
    Full or partial redundancy elimination can remove redundant computation and memory
    references appearing on all or some execution paths.


    Most of the Shangri-LA components introduced this far are independent of target
    hardware. However, the code generation (CG) component, where native code is generated
    and many processor-dependent optimizations are performed, is expected to vary
    significantly from one processing core to another, the different types of processing
    cores on each NP often have dramatically different ISAs and micro-architectural
    implementations. By the IX NPs, the Intel Scale® is a general-purpose processing
    core and has been adopted in the designs of various embedded systems. Here, we
    leverage technologies and tools to generate code for the aggregate mapped to the
    Intel Scale® processor. On the other hand, new technologies are being developed
    to optimize the aggregates on MEs which have a major impact on the overall throughput
    of packet-processing applications running on IX NPs. Furthermore, the design of
    the MEs, which target the efficient processing of packets, poses a number of challenges
    to compilation. We discuss several of these challenges next:


