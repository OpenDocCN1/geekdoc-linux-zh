  md: '# Application Analysis and Resource Mapping


    # 13.2.1 Static vs. Dynamic Analysis


    One key question is whether to use a static or a dynamic application analysis
    as the basis for this. With a static analysis, detailed information about every
    potential processing path can be derived. All processing blocks can be analyzed—even
    the ones that are not used or hardly used during run-time. A static analysis results
    in a call-graph, which shows the static control dependencies (i.e., which function
    can call which function). This gives a good basic understanding of the application
    structure, but does not yield any information on its run-time behavior. But run-time
    behavior is exactly what is crucial for network processor performance.


    A run-time analysis of the application (e.g., an instruction trace) shows which
    instructions were executed and which blocks were not used at all. In addition,
    all actual load and store addresses are available, which can be used for an accurate
    data dependency analysis. The drawbacks of runtime analysis is that each packet
    could potentially cause a different sequence of execution. In a few cases, certain
    blocks are executed a different number of times depending on the size of the packet
    (we show this effect later in the context of packet encryption). Thus, the results
    are specific to a particular packet. To generalize these to match arbitrary network
    traffic, a large number of packets can be analyzed and the union of all common
    execution paths can be used for the application analysis and scheduling. Less
    common execution paths can be handled as exceptions in the slow path of a network
    processor.


    We have chosen to follow the path of run-time analysis due to the fact that it
    accurately reflects the actual processing as provides actual load and store addresses,
    which are important when determining data dependencies. To address the issue of
    variations in network traffic processing even within the same application (e.g.,
    different packet services or number of loop executions), there are several solutions.
    One is to assume the packets use the most common execution path and if not, an
    exception is raised and processing is continued on the control processor. This
    is currently done on some network processors (e.g., if IP options are detected
    in an IP forwarding application). Another approach is to analyze a large number
    of packets and find the union of all execution paths. By scheduling the union
    on the network processor system, it is guaranteed that all packets can be processed,
    but the drawback is a lower system utilization as not all components will be used
    at all times. In this work, we focus on the analysis of a single packet for each
    application with the understanding that the work can be extended to consider a
    range of network traffic.


    Another issue that arises from a run-time analysis is that it is necessarily done
    on compiled code. This introduces a certain bias toward a particular'
  merge: -1
  pgno: 300
- img_proc: true
  md: '# 13.2 Application Analysis


    compiler and instruction set architecture. In our analysis, we used only compiler
    optimizations that are independent of the target system (e.g., no loop unrolling).
    Together with the use of a general RISC instruction set, the assumption is that
    the analysis yields results that are generally applicable to most processing engines
    in current network processors.


    # 13.2.2 Annotated Directed Acyclic Graphs


    The result of the application analysis needs to yield an application representation
    that is independent of the underlying architecture and can be used later for mapping
    and scheduling. For this purpose, we use an annotated directed acyclic graph,
    which we call ADAG. The ADAG represents processing steps (or blocks) as vertices
    and dependencies as edges. The processing steps are dynamic processing steps;
    they, represent the instructions that are actually executed and loops cause the
    generation of processing blocks for each iteration. Only by considering the dynamic
    instances of each processing block can we obtain an acyclic graph. Also it is
    desirable to consider only the instructions that are actually executed rather
    any "dead code." The dependencies that we consider data dependencies as well as
    control dependencies. There are two key parameters in an ADAG:


    +   1. Node weights. These indicate the amount of processing that is performed
    on each node (e.g., number of RISC instructions).

    2. Edge weights. These indicate the amount of state that is transferred between
    processing blocks.


