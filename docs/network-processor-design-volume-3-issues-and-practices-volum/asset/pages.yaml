  md: '# 9 RNOS—A Middleware Platform for Low-Cost Packet-Processing Devices


    scheduling. It is a soft real-time system that provides admission control with
    respect to CPU load and memory, but it does not provide mechanisms to calculate
    backlog and delay of individual flows. A concept that provides QoS to certain
    flows in a software-based router while optimizing the throughput for effort traffic
    has been described in Ref. [6]. Although the concept is based on scheduling the
    CPU resource, it does not provide any real-time guarantees. Estimation-based Fair
    Queuing (EFQ) algorithm that is used to schedule resources has been described
    in Ref. [7]. It also contains a concept for online estimation of processing times
    and an admission control. Again, no real-time guarantees can be provided. Summarizing,
    there are solutions available for various issues in software-based routers. A
    unifying approach for small embedded devices is missing that enables us a formal
    analysis as an implementation that matches the predicted behavior.


    This chapter describes RNOS (Real-time Network Operating System), a middleware
    platform for low-cost packet-processing devices with real-time requirements. The
    RNOS consists of an analysis model and an implementation model. The analysis model
    allows the exploration of packet-processing applications for different input and
    resource scenarios with real-time requirements. The implementation model allows
    a seamless implementation of the analysis on a single CPU system and guarantees
    the real-time behavior provided by the formal analysis of the model. As a result
    of the matching analysis and implementation model, we obtain a platform for the
    design of predictable embedded devices.


    The remainder of the chapter is organized as follows: Section 2 describes the
    scenario we use throughout the sections of the approach. Section 3 presents the
    analysis model and Section 4 describes the implementation model of the software
    platform. In Section 5 we report measurement results and compare them with analysis
    results. Finally, we summarize and comment on future work in Section 6.


