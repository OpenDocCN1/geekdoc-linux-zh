  md: '# 3 Efficient Packet Classification with Digest Caches


    # 3.3.2 Results


    In evaluating the performance of the caching systems, we must consider two criteria:
    we must examine the overall hit rate as well as the smoothness of the cache miss
    rate. A cache that has large bursts of cache misses is of no use, because it places
    strain on the packet classification engine.


    Figure 3.7 graphs the hit rate of various caching strategies, the digest cache
    hits rates equivalent to an IPv6-based cache ten times its size. More importantly,
    the digest cache large misses to outperform a Bloom filter cache. The digest cache
    yields an equivalent hit rate of a cold-catching Bloom filter 50-80 percent its
    size, and outperforms a double-buffered Bloom filter cache two-three times its
    size.


    Figure 3.8 graphs the variance of cache miss rates of the different caching approaches,
    aggregated over 100 ms intervals. As be observed from the two traces, a digest
    cache gives superior performance, minimizing the variance in aggregate cache misses.


    It is interesting to note that for extremely small cache sizes, the digest cache
    exhibits a greater variance in hit rate than all other schemes. This can be attributed
    to the fact that the other algorithms in this interval behave uniformly poor by
    comparison.


    As the cache size increases, this hit-rate performance improves and the variance
    of cache miss rates decreases to a very small number. This is an important observation
    because it implies that cache misses, in these traces, are not dominated by burst
    activity patterns.


    To consider a more specific example, we have constructed a 2600 byte four-way
    set-associative digest cache. This number was chosen to coincidental with the
    amount of local memory available to a single IXP2000 family microengine.


    Figure 3.9 presents a trace of the cache miss rate, aggregated over one-second
    intervals. This graph represents the number of packets a packet classification
    engine must process within one second to keep pace with the traffic load. As be
    observed from the plot, a packet classification engine must be able to classify
    roughly 60 packets per second (pps) in the worst case for the Bell trace, and
    260 pps in the worst case for the OGI trace. Average packet load during the entire
    time is 270.7 and 4335.4 pps for the Bell and OGI traces, respectively. Peak packet
    rate for the Bell trace approached 1400 pps, while the peak rate for the OGI trace
    exceeds 8000 pps.


    By employing a 2600-byte digest cache, the peak stress level on the packet classification
    engine has been reduced by a factor of 20 and 30 for the observed traces.'
