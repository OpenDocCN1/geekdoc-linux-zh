  md: '# Network Processor Design: Issues and Practices


    Editors: Patrick Crowley, Washington University; Mark A. Franklin, Washington
    University; Haldun Hadimioglu, Polytechnic University, Peter Z. Onufryk, Integrated
    Device Technology, Inc.


    Responding to ever-escalating requirements for performance, flexibility, and economy,
    the networking industry has opted to build products around network processors.
    To help meet the formidable challenges of this emerging field, the editors of
    these volumes created the Workshop on Network Processors, a forum for scientists
    and engineers to discuss the latest research in architecture, design, programming,
    and use of these devices.


    Network Processor Design: Issues and Practices Volume 1, ISBN: 1558608753 Edited
    by Patrick Crowley, Mark A. Franklin, Haldun Hadimioglu, Peter Z. Onufryk


    Volume 1 contains not only the results of the first workshop but also specially
    commissioned material that highlights industry''s latest network processors.


    Network Processor Design: Issues and Practices Volume 2, ISBN: 0121981576 Edited
    by Patrick Crowley, Mark A. Franklin, Haldun Hadimioglu, Peter Z. Onufryk


    Volume 2 contains 20 chapters written by the field''s leading academic and industrial
    researchers, with topics ranging from architectures to programming models, from
    security to quality of service.


    Network Processor Design: Issues and Practices Volume 3, ISBN: 0120884763 Edited
    by Patrick Crowley, Mark A. Franklin, Haldun Hadimioglu, Peter Z. Onufryk


    Volume 3 is devoted to the latest academic and industrial research, investigating
    recent advances in networking, telecommunications, and storage.'
