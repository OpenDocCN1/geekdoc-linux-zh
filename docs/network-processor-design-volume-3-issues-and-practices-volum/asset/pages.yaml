  md: '# # Network Processors: New Horizons


    CHAPTER


    Patrick Crowley, Mark A. Franklin

    Washington University in St. Louis


    Haldun Hadimioglu

    Polytechnic University


    Peter Z. Onufryk

    Integrated Device Technology, Inc.


    The objective of this third volume on network processor (NP) design is the same
    as that of its predecessors [1, 2]: to survey the latest research and practices
    in the design, programming, and use of network processors. As in the past, network
    processor used in the most generic sense and is meant to encompass any programmable
    device targeted at networking applications; including application-specific processors
    such as those used in programmable search, inspection, security, and traffic management
    applications; RISC-based devices found in consumer networking equipment, such
    as DSL and gate gateways; and high-performance microcoded multiprocessors such
    as those found on router line cards. While the cost, power, and performance requirements
    of these applications may differ, they share the common thread of programmable
    packet processing.


    The main theme of the first volume was the meeting challenges of high-speed networking.
    The primary goal was to replace fixed-function ASICs with programmable processors
    with the policy of allowing vendors to adapt to evolving network protocols and
    applications as well as improving time-to-market. Fueled by the dot com and telecommunications
    bubbles, a large number of start-ups as well as large, established companies entered
    the market. With relatively little theoretical foundation, industry led the way
    in the development of network processor architectures. The result was a diverse
    set of architectures that have ignored years of research and experience in the
    architecture and programming of parallel processors.


    The main theme of the second volume shifted from the sole goal of meeting the
    real-time performance required for high-speed networking to other aspects,'
  merge: -1
  pgno: 17
- img_proc: true
  md: '# Network Processors: New Horizons


    such as ease of programming and application development. As vendors evaluated
    network processors, they quickly realized that a rush to market caused many network
    processor vendors to focus on performance with little thought given to how these
    devices would be programmed or evaluated. While most vendors announced an elaborate
    development and simulation environments, the fact remained that these devices
    were often complex multiprocessors with highly specialized hardware accelerators
    that had to be programmed at the microcode level. In addition, while benchmarking
    methodologies emerged, they were often system-and-application-dependent and offered
    limited insight into how a device would perform in a vendor''s particular situation.


    The themes in this third volume are similar to that of the second volume. The
    goal of achieving ever increasing levels of packet processing performance has
    given way to other factors such as ease programming, application development,
    power, and performance prediction. In fact, many vendors have positioned their
    products toward lower-performance, higher-volume markets such as DSL access multiplexors
    (DSLAMs), cellular base stations, and cable-modem termination systems (CMTS).
    In addition, opportunities for programmable processors have emerged in areas such
    as networked storage, TCP offload engines, and security.


    Since the market for high-end network processors anticipated the dot com communications
    bubbles never materialized, the industrial landscape has seen dramatic changes
    since the writing of the first volume [1]. Faced with little opportunity for revenue
    and virtually no acquisition, most startups formed during the gold rush years
    have shut their doors. In addition, a number of established companies have either
    exited the market or discontinued future development. The remaining vendors have
    shifted their focus toward evolving current architectures rather than parallel
    processing. Thus, as has occurred in the past with RISC architectures and parallel
    processing, subsequent consolidation have opened the door for academic research
    to lead the way in the formation of theoretical foundation for the architecture,
    evaluation, and programming of network processors.


    Unlike Volumes 1 and 2, this book has only one part and is entirely focused on
    the latest research in the design, programming, and use of network processors.
    Our goal has been to emphasize forward-looking and sometimes theoretical leading-edge
    research rather than the incremental enhancements of existing architectures. Conceptually
    the contributions in this book fall roughly into three domains: architecture;
    tools and techniques;'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# 1.1 Architecture


    and applications. The remainder of this introduction reviews this book''s contributions
    in these areas.


    # 1.1 ARCHITECTURE


    As discussed, the rapid pace of industrial innovation and product announcements
    have declined. Instead, vendors have focused on evolving and enhancing their existing
    products. Examples of this include OC-192 announcements by companies as AMCC [3],
    EZ Chip [4], and Intel [5]. While economic conditions have slowed the introduction
    of commercial networking architectures and ideas, academic researchers have continued
    to develop new techniques and approaches.


    As the deployment of network processors in application areas beyond router line
    cards has continued, it has been observed that the limited control store found
    in many network processor architectures has presented challenges in more complex
    applications. In Chapter 2, segmented instruction caches for multithreaded processors
    are proposed. Such a cache is shared by real-time and non-real threads with real-time
    threads being mapped and preloaded into segments large enough to avoid misses,
    while nonrealtime threads being mapped to the segments with normal cache behavior.


    Packet classification forms an important component of virtually all packet processing
    applications. Chapter 3 presents the challenges associated with packet classification
    at high line rates. The authors propose a novel cache design, digest cache, which
    traces accuracy for speed. They argue that it is possible to keep misclassifications
    extremely low, at the same time, providing performance unobtainable by an exact
    cache. The digest cache keeps a hash of portions of the header (the flow identifier),
    rather than the complete flow identifier, significantly reducing storage area
    and increasing speed.


    Many of today''s network processors are based on a chip processor (CMP) architecture
    in which packet-processing tasks may be pipelined on multiple processors. Such
    capabilities raise the question of how to assign tasks to the pipeline stages.
    In Chapter 11, a heuristic approach is proposed, called GreedyPipe, which performs
    near-optimal task-to-stage assignment, in the presence of multiple flows and multiple-pipeline
    environments. The possibility of using a stream architecture for packet processing
    is explored in Chapter 7. Originally designed for running media applications,
    the stream architecture exploits single-instruction stream, multiple-data stream
    (SIMD) type'
  merge: -1
  pgno: 19
- img_proc: true
  md: '# 1 Network Processors: New Horizons


    parallelism. A modified version of the stream architecture is explored where packets
    are streams and complex operations are performed on them in a SIMD fashion.


    # 1.2 TOOLS AND TECHNIQUES


    A challenge in deploying network processors continues to be performance prediction
    and programming. Network processors, which often consist of a collection of heterogeneous
    compute and memory resources with varying degrees of flexibility, require a different
    set of tools and techniques than the ones used in traditional programming models.
