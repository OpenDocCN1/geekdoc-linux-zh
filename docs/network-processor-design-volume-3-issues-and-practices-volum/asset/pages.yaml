    # 6.2.1 Hardware Platform


    A block diagram of our hardware platform is shown in Figure 6.2. It uses the Radysis
    ENP-2500 development board [17] with four 100 Mbps Ethernet ports. The main computational
    components are an Intel XP network processor and a Xilinx Vertex FPGA. The FPGA
    board attached to a PCI mezzanine connector (PMC) and communicates with the NP
