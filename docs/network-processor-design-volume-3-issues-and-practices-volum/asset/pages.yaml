    assignment in an automated way. Finally, a component-based resource model is provided
    to assess the quality of the software-hardware combinations. This allows exploration
    of the design space created by different system parameters. In the System & Circuit
    Technology research group at the Heinz Nixdorf Institute, the framework is used
