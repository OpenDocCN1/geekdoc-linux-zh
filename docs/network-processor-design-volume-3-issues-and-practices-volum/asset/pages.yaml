  md: '# 2 Supporting Mixed Real-Time Workloads


    Since segments are shared, our simulation methodology must change somewhat. If
    threads are sharing a segment, each of those threads is likely to be at different
    points of program execution. In our experiments, we begin simulation by assigning
    each thread a random start location in the instruction trace. Each thread then
    executes, one at a time in round-robin fashion, until a predetermined number of
    instructions have been fetched. In these experiments, we limit each thread to
    1/7th of the total number of instructions in the original trace (so a segment-sharing
    profile runs as many instructions as a stand-alone profile run). In addition to
    a round-robin scheduling policy (which is the one implemented in the Intel XP
    NPs), each thread executes a random number of instructions (sampled from a set
    of run-lengths normally distributed around seven instances) before swapping output.


    Figure 2 reports miss rates when segments are shared between multiple threads.
    Results are shown direct-mapped and four-way caches sharing two, four, and eight
    threads.


