    3. Completion events for suspended threads.

    4. Maintenance and other global events.


    The design provides a tightly coupled 4 KB thread cache, running at core speed,
    which enables intermediate architecture state to be saved and restored for each
    thread. This cache is 8 threads deep and 512 B. The width of the cache is determined
    by the amount of context information that needs to be saved for each packet. The
    depth of the cache is determined by the packet arrival and completion rates. Analysis
    shows that for 256-byte packets on a 10 Gb/s line for both receives and transmits,
    an 8-deep cache is sufficient because it is more than the number of packets that
    could be active at any point in time. The high-bandwidth connection between the
    thread cache and the working register ensures that the overhead penalty for thread
    switches is minimal. At the design frequencies shown here, the overhead penalty
    per switch is about 2 ns. The execution execution, and scratch registers are completely
    dedicated to the packet currently being processed. This is again different from
    other approaches where the resources are split a priori and dedicated to specific
    threads. This ensures adequate resources for each packet without having duplicate
    resources and increase engine area.


    Efficient multithreading is critical to the ability of the offload engine to scale
    up to multigabit Ethernet rates. The design and validation of the TOE is simpler
    in this approach than conventional approaches to multithreading. It also simplifies
    requirements on the compiler and the programming model.'
