  md: '# 5 A High-Speed, Multithreaded TCP Offload engine for 10 Gb/s Ethernet


    the host CPU. The architecture uses a high-speed processing engine at its core,
    with interfaces to the peripheral units. A dual frequency design is used, with
    the processing engine clocked several faster (core clock) than the peripheral
    units (slow clock). This approach results in minimal input buffering, enabling
    wire-speed processing. The design uses 1 MB of on-die cache to store TCP connection
    context, which provides temporal locality for 2 K connections, with additional
    contexts residing in host memory. The context is a portion of the transmission
    control block (TCB) that TCP is required to maintain for each connection. Caching
    this context on-chip is critical for 10 Gb/s performance. In addition, to avoid
    packet copies on receives and transmits, the design includes an integrated direct
    memory access (DMA) controller. This enables a low latency transfer and supports
    direct placement of data in application buffers without substantial buffering.
    A central scheduler provides global control to the processing engine at a packet
    level granularity. A transmit queue buffers NIC bound. The architecture presents
    three queues as a hardware mechanism to interface with the host CPU [8]. An inbound
    double queue (DBQ) is used to initiate (or receive) requests. An outbound completion
    queue (CQ) and an exception/event queue (EQ) are used to communicate results and
    events back to the host. A timer unit provides hardware offload for seven frequently
    used timers associated with TCP processing. The TOE includes hardware assist for
    virtual to physical (V2P) address translation.


    The DMA engine supports four independent, concurrent channels and provides a low-latency/high-throughput
    path/to memory. The TOE constructs a list of descriptors (commands for read and
    write), programs the DMA engine, and initiates the DMA start operation. The DMA
    engine transfers data from source to destination per list. Upon completion of
    the commands, the DMA engine notifies the TOE, which updates the completion queue
    to notify the host.


    A micro-architecture diagram of the processing engine is detailed in Figure 5.6,
    and features a high-speed fully pipelined ALU at its heart, communicating with
    a working register. TCB context for the current scheduled active connection is
    loaded into the 512 B working register for processing. The execution core performs
    TCP processing under direction instructions issued by the instruction cache. A
    control instruction is read every core cycle and loaded into the instruction register
    (IR). The execution core reads instructions from the IR, decodes them if necessary,
    and executes them every cycle. The functional units in the core are arithmetic
    and logic units, shifters and comparators—all optimized for high-frequency operation.
