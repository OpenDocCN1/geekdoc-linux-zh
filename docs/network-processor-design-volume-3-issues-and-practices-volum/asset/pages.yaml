    # 10.2 IMPLEMENTATION DETAILS


    DNA$_{bf}$ is sent to the IXP from a neighboring host across a gigabit link. The
    sender uses mmap to slide a memory-mapped window over the original DNA$_{bf}$
    file. The contents of the file that is currently in the window are mapped to the
    sending address, allowing the sender to read and send the data efficiently. Packets
    are sent in fixed-size UDP/IP Ethernet frames of 544 bytes where the UDP header
    is immediately followed by a 6-byte pad. The pad ensures that the DNA payload
    starts at an 8-byte boundary (14 B Ethernet + 20 B IP + 8 B UDP + 6 B pad = 48),
    which is convenient as the minimum addressable unit of SDRAM is 8 bytes.


    Careful readers may have noticed that this UDP setup is problematic. As we have
    said that the current IXP1200 cannot keep up with the lines, without some feedback
    mechanism the sender has no way of knowing how fast it can send the data without
    swapping the receiver. In the current version, we have ignored this problem and
    manually tuned the sender in such way that packets are never dropped by the receiver.


    In the implementation of IXBlast, two threads on ME$_0$ are dedicated to receiving
    packets from the network and storing them in SDRAM. A third thread synchronizes
    with the remaining MEs. Dedicating more than two threads to packet reception does
    not improve performance. The implementation is simpler than in most networking
    applications: ME$_0$ loads data in SDRAM in batches of 100,000 packets. As soon
    as packets are available, the processing threads start processing. They synchronize
    with ME$_0$ by reading a counter each time they have finished processing a packet.
    If no packet is available, they wait. On ME1–ME5, this is essentially the only
    synchronization that is necessary for a block of 100,000 packets to be processed.
    In network systems, like routers, such simplistic synchronization is generally
    not permitted.


