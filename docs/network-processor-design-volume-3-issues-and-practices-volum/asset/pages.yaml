  md: '# Segment Sizing Strategies


    When choosing a segment size, we first determine if a choice is available. It
    may be the case that other considerations dictate that a given nonreal-time program
    must run in a particular amount of available space (e.g., whatever remains the
    real-time code has been allocated). In this case there is no decision.


    On the other hand, there may be some choice in the size of the allocation; in
    some fashion, a number of blocks needs to be determined. For example, there may
    be multiple nonreal-time programs to be mapped to a particular data processor
    and appropriate segment sizes must be chosen. Accordingly, consider the three
    segment sizing strategies.


    +   * Choose a segment size equal to the number of instructions in the program.
    No possible execution will result in a miss. This is the strategy used for real-time
    code.


    +   * Choose a segment size equal to the number of unique references seen during
    a profiled execution run. In this case, misses will only occur when program execution
    takes place outside the profiled paths.


    +   * Locality. Choose a segment size equal to some fraction of unique references
    seen during profiling. It is frequently the case that a small fraction of unique
    references account for a large majority of the dynamic references. In this case,
    misses are possible but will be few if the profiled data is representative to
    real executions. In this chapter, we will consider fractions representing 20,
    40, 60, and 80 percent of the total unique references seen during profile runs.


    The profile and locality strategies use execution profiling to determine what
    instructions are likely to be executed. Note that this is an incomplete methodology
    for real-time code, but is sufficient for best-effort code in which we seek to
    improve the expected case. As we will see, we can also use profile information
    to intelligently lay out code to reduce conflict misses.


