    # 2.3.6 Segment Sharing


    As discussed in Section 2.3.3, it is possible, and indeed common, for multiple
    thread contexts to execute the same program. In this case, it makes sense to assign
    each context to the same cache segment. While economizing on instruction cache
    space, this situation raises the possibility of interthread conflicts. In this
    section, we measure the effect of this type of sharing on miss rate. (Another
    possibility includes mapping different programs into the same segment for programs
    to share, but we leave this to future work.)'
