    The assumptions on the micro-architecture of the processing engine, our mapping
    and implementation decisions, and our profiling procedure are described in the
    following subsections. We then discuss our results and reveal the sensitivity
    of feasibility study on memory latency and processing engine sensitivity.


    # 4.3.1 Micro-Architecture Model


    We describe the simplified micro-architecture model of the packet-processing engine
    used for our performance analysis. As an application-specific instruction set
    processor targeted at network processing tasks, it is clear that we need specialized
    instructions for bit-level masking and logical operations [19]. We also assume
    support for several threads of execution and a large number of general-purpose
    registers (GPRs) per thread. Intel''s current processing engine [20], provides
    64 GPRs per thread. Therefore we do not believe that the size of the register
    file is a limiting factor of our application. Our analysis does not discuss the
    influence of register spills in this context.


    The data path is assumed to be 32-bit as in all major network processors. The
    size of the code memory is not taken into account as a constraint. Although the
    size of the code memory was a concern for the early generations of network processors
    (e.g., see Ref. [21]), we do not believe that this constraint still holds for
    current engines, which incorporated greatly increased code memory areas due to
    former, negative design experience.


    Since we consider reliable protocols, the support for timers is mandatory in order
    to provide better retransmissions. Hardware timers are implemented using special
    registers and can thus quickly accessed.


    # 4.3.2 Simplified Instruction Set with Timing


    The following instruction classes are used to statically derive the execution
    profile of our Click elements. An application-specific, register-to-register instruction
    set is assumed to support bit-level masks with logical, arithmetic, load, and
    store operations to quickly access and manipulate header fields.


    +   * Arithmetic operations (A). Additions and subtractions take one cycle.

    * Logical operations (L). For example, and, or, xor, shift, and compare (cmp),
    take one cycle.'
