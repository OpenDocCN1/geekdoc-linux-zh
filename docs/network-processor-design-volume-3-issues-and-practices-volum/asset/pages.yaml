    # 11.1.3 Related Work


    The assignment problem is similar to a number of problems considered in the literature.
    At the most basic level, a straightforward method of finding the task assignment
    that minimizes $P$ is to perform a complete enumeration of all possible assignments,
    identifiable feasible assignments, and select the optimum one. However, this suffers
    from a combinatorial explosion of choices. Additionally, optimally efficient solutions
    are unavailable since the problem has been shown to be NP Hard [8, 9].


    There is a long history associated with related problems in deterministic job-shop
    scheduling [9] and these problems have been investigated by a variety of perspectives
    including integer programming, of heuristics, and other approaches. Similar problems
    have also been dealt with in the context of compilation techniques for general-purpose
    parallel languages on multiprocessors [10, 11]. The primary objective of the compilation
    techniques is to minimize the response time while simultaneously reducing overhead
    due to synchronization and communication over a general processor.


    Real-time packet scheduling problems have also been considered in the text of
    network processors [6]. In this case, packets were assumed to be completely processed
    on a single processor. A primary concern in work was to assign packets to processors
    in a manner that minimized the effect of cache-cold misses on performance.


    Our work is aimed at maximizing the throughput of a pipelined multiprocessor by
    effective assignment of flow tasks to pipeline stages. It differs from prior work
    in a number of ways. Primarily, the problem definition differs from those considered
    in the past that we consider multiple flows and pipelines, sharing of tasks on
    pipeline stages, and a bandwidth performance metric associated with the requirements
    of the computer pipeline environment. Greedpipe, the heuristic developed, takes
    these factors into account in its development.'
