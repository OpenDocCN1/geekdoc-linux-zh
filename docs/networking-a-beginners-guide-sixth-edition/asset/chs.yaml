  \n### su：切换用户\n\n一旦你以一个用户登录系统，你就不需要注销再重新登录以切换另一个身份（例如，如果你以自己的身份登录并想变成 root 用户）。只需使用\
  \ `su` 命令切换到另一个用户。该命令只有两个参数，两者都是可选的。\n\n默认情况下，运行带任何参数的 `su` 将尝试成为 root 用户。例如，如果你以自己的身份登录并想切换到\
