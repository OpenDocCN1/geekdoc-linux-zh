  \ 引用原始文件的。一个文件系统上的 i-node 所引用的文件，无法指向另一个文件系统上的文件。 |\n\n\n\n\n\n![image](img/box.jpg)\n\
  \n### 符号链接 (Symbolic links)\n与硬链接通过其 i 节点指向文件不同，符号链接通过名称指向另一个文件。因此，`symbolic links`（通常缩为\
  \ `symlinks`）可以指向位于其他分区甚至其他网络驱动器上的文件。\n\n![image](img/box.jpg)\n\n### 块设备 (Block\
  \ devices)\n由于所有设备驱动程序都通过文件系统访问，因此 `block device` 类型的文件用于与磁盘等设备建立接口。\n\n![image](img/box.jpg)\n\
  \n### 字符设备 (Character devices)\n字符设备类似于块设备，是特殊文件，允许你通过文件系统访问设备。块设备和字符设备之间明显的区别在于，块设备以大块的形式与实际设备通信，而字符设备一次处理一个字符。硬盘是块设备，而调制解调器器是字符设备。\n\
  \n![image](img/box.jpg)\n\n### 命名管道 (Named pipes)\n命名管道是一种特殊类型的文件，允许进程间通信。使用 `mknod`\
  \ 命令（后文将在“文件管理与操作”章节中讨论），你可以创建这种特殊文件，一个进程可以打开进行读取，另一个进程可以打开进行写入，从而允许两个进程相互通信。当软件包拒绝接受来自命令行管道的输入、你有另一个程序需要提供数据，且没有磁盘空间创建临时文件时，命名管道的效果非常出色。\n\
  \n块设备、字符设备和命名管道具有某些识别其文件类型的特征。块设备的三个识别特征是：它有一个主设备（major number）、有一个次设备号（minor number），并且在使用\
  \ `ls -l` 命令查看时，权限的首字符显示为 `b`。以下是一个示例：\n\n![image](img/p317-01.jpg)\n\n在这种情况下，`b`\
  \ 位于文件权限的开头，8 是主设备，1 是次设备。主设备的意义在于它标识了该文件代表哪个设备驱动程序。当系统访问此文件时，次设备号将作为参数传递给设备驱动程序，告诉驱动程序正在访问的是哪个设备。（例如，如果有两个串口，它们将共享相同的设备驱动程序以及相同的主设备，但每个串口将具有唯一的次设备号。）\n\
  \n字符设备的区别特征是其权限以 `c` 开头，且设备具有主设备号和次设备号。以下是一个示例：\n\n![image](img/p317-02.jpg)\n\n\
  你可以通过文件权限的首字符为 `p` 来判断一个文件是否为命名管道，如下例：\n\n![image](img/p317-03.jpg)\n\n### chown:\
  \ 更改所有者 (Change Ownership)\n`chown` 命令允许你将文件的所有权更改给他人。只有 root 用户可以更改此所有权。（普通用户可能不能“送出”或“窃取”其他用户的所有权。）命令的格式如下：\n\
  \n![image](img/p317-04.jpg)\n\n其中 `username` 是你想要更改所有权的用户登录名，`filename` 是将更改所有权的文件名。文件名也可以是一个目录。\n\
  \n当指定的文件名是目录名时，适用 `-R` 选项。它告诉命令递归地遍历目录树，不仅将新所有权应用于目录本身，还应用于其内部的所有文件和子目录。\n\n###\
  \ chgrp: 更改用户组 (Change Group)\n`chgrp` 是另一个命令行实用程序，允许你更改文件的组设置。该命令的工作方式与 `chown`\
  \ 非常相似。命令的格式如下：\n\n![image](img/p317-05.jpg)\n\n其中 `groupname` 是你想要更改 `filename`\
  \ 所属的组。文件名也可以是一个目录。当指定的文件名是目录名时，适用 `-R` 选项。与 `chown` 一样，该选项告诉 `chgrp` 命令递归地遍历目录树，不仅将新组应用于目录本身，还应用于其内部的所有文件和子目录。\n\
  \n### chmod: 更改模式 (Change Mode)\n权限分为四个部分。第一部分是权限的首字符。如果文件是普通文件，它将没有值，并用连字符 (-)\
  \ 表示。如果文件具有特殊属性，则将用字母表示。你最感兴趣的两个特殊文件是用 `d` 表示的目录和用 `l` 表示的符号链接。\n\n第二、第三和第四部分以三个字符为一组表示。第一部分是文件所有者的权限。第二部分是用户组的权限。最后一部分是所有人（world）的权限。在\
  \ UNIX 的语境下，“所有人”指的是系统中所有的用户，无论他们的组设置如何。\n\n用于表示权限的字母是 `R` 代表读，`W` 代表写，`X` 代表执行。每个权限都有一个对应的值。读属性等于\
  \ 4，写属性等于 2，执行属性等于 1。当你组合属性时，会将它们的值相加。这些属性需要值的原因是为了确保你可以使用 `chmod` 命令设置它们。虽然 `chmod`\
  \ 命令确实有更易读的方式来设置权限，但理解这种数字方案是非常重要的，因为它用于编程。此外，并不是每个人都使用命名方案，Linux 用户通常认为，如果你理解文件权限，你就理解了它们的数字含义。\n\
  \n最常见的三位组及其含义列在 表 19-3 中。\n\n![images/line.jpg)![image](img/tab19-3.jpg)\n![](img/line.jpg)\n\
