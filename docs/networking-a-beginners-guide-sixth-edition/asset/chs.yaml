  \ **图 14-12。**\n\nInternet 协议版本 4 (TCP/IPv4) 属性对话框现在您可以点击“使用以下 IP 地址”选项，然后填写您想使用的\
  \ IP 地址、子网掩码和默认网关值。点击“确定”保存您的更改并关闭对话框![](img/line1.jpg)\n\n\n\n\n\n| ![image](img/common.jpg)\
