  \n## 章节总结\n在本章中，你学习了 Windows Server 2012 的安装和配置，并了解了作为域控制器的 NetBIOS 名称。你了解了 Windows\
  \ Server 2012 的安全策略，包括强制密码更改、设置最小长度以及禁止使用旧密码。你了解了由于这些策略的严格性，用户可能会忘记密码，从而需要网络管理员的帮助。对于这些问题。\n\
  \n在本章中，你了解了 Windows Server 2012 的安全策略，包括强制密码更改、设置最小长度以及禁止使用旧密码。你了解了由于这些策略的严格性，用户可能会忘记密码，从而需要网络管理员的帮助。对于这些问题。\n\
  \n## 思考安全\n在深入学习管理操作之前，你应该花时间思考网络安全，并确定合适的网络安全措施，以便在日常管理网络时能够考虑到它。网络安全不需要占用你太多时间，只要你设置了管理程序，使其预设你所需的安全水平。例如，如果你知道网络的密码策略是什么，只需几秒钟就能为新用户设置这些策略。如果你知道你维护了安全组更改的纸质日志，那么在更改成员关系时，只需几秒即可遵循此程序。未能早期确定这些安全实践和策略，会导致在安全审查或审计时需要承担更大的项目。\n\
  \n## 使用用户账户\n对于任何人（包括管理员）要访问运行 Windows Server 2012 的服务器，用户必须在服务器或域中建立账户。（*域*本质上是\
  \ Windows 服务器共享的安全信息集合。）账户定义了*用户名*（系统识别用户的名称）和用户密码，以及每个用户相关的其他信息。使用 Windows Server\
  \ 2012 创建、维护和删除用户账户非常简单。\n\n\n\n\n\n| ![image](img/common.jpg) | `NOTE` 为 Windows\
  \ Server 2012 域创建的每个帐户都分配了一个特殊的数字，称为安全标识 (SID)。服务器实际上通过此数字来识别用户。SID 被称为“在时空上都是唯一的”。这意味着任何两个用户都不会拥有相同的\
  \ SID，即使他们拥有相同的用户名甚至相同的密码也是如此。这是因为 SID 由分配给域的唯一数字，以及随后分配给每个创建的账户的顺序数字组成（有数十亿个唯一的用户特定数字可供使用如果你有一个名为\
  \ Frank 的用户，删除该账户，然后再次创建一个名为 Frank 的账户，这两个账户将具有不同的 SID。这确保了任何用户账户都不会意外地获得最初分配给同名另一个用户的权限。\
  \ |\n\n要维护用户账户，您需要使用“Active Directory 用户和计算机”（Active Directory Users And Computers）控制台。您可以进入启动屏幕并点击“Active\
  \ Directory 用户和计算机”来打开此控制台。或者，从服务器管理器（Server Manager）打开“工具”菜单，并从菜单中选择“Active Directory\
  \ 用户和计算机”。要在控制台中执行操作，您首先需要选择左侧窗格中的容器或右侧窗格中的对象，然后右键点击该容器或对象，或者打开“操作”下拉菜单并从可用选项中进行。由于可用选项会根据所选容器或对象而变化，因此首先选择要操作的对象是非常重要的。\n\
  \n### 添加用户\n\n要使用“Active Directory 用户和计算机”控制台添加用户，首先在左侧窗格中选择“用户”容器（树形结构展开到您正在管理的域），如图\
  \ 15-1 所示。然后，右键点击“用户”容器，从弹出菜单中选择“新建”，并从子菜单中选择“用户”。您将看到“新建对象 - 用户”对话框，如图 15-2 所示。填写“名”（First\
  \ Name）、“姓”（Last Name）和“用户登录名”（User Logon Name）字段。然后点击“下”按钮进入下一个对话框。\n\n![](img/line.jpg)![image](img/fig15-1.jpg)![](img/line.jpg)\n\
  **图 15-1.** “Active Directory 用户和计算机”控制台允许您管理用户账户。\n\n![](img/line.jpg)![image](img/fig15-2.jpg)![](img/line.jpg)\n\
  **图 15-2.** 使用“新建对象 - 用户”对话框添加新用户。\n\n![](img/line.jpg)\n\n| ![image](img/common.jpg)\
  \ | `TIP` 您应该建立一套标准，在网络上分配登录名。小型网络（用户少于 50 人的网络）通常只使用人们的名字，在发生冲突时加上姓氏的首字母。对于规模稍大的公司，常见的惯例是使用用户的姓，后跟名的首字母。对于更大的公司，通常会看到人的完整名和姓，并用句号分隔姓名。后者的这种标准在发生冲突之前允许产生更多的组合，然后您可以通过添加人的中间名首字母、数字或其他更改来解决任何出现的冲突，以确保系统在任何时刻的所有用户名都是唯一的。\
  \ |\n\n\n\n\n\n在第二个对话框中（如图 15-3 所示），您输入账户将使用的初始密码。您还可以选择几个适用于账户的选项，如下：\n\n![](img/line.jpg)![image](img/fig15-3.jpg)![](img/line.jpg)\n\
  **图 15-3.** 设置用户的密码！\n\n![image](img/box.jpg) **用户必须在下次登录时更改密码**\n选择此复选框将强制用户在首次登录系统时选择自己的密码。\n\
  \n![image](img/box.jpg) **用户无法更改密码**\n如果您不想允许用户更改密码，可以对资源账户选择此选项。（例如，您可能会为某台执行特定功能的计算机建立一个特定的用户账户，该账户供许多人使用。）但通常情况下，你不应该选择此选项；大多数站点允许用户更改自己的密码，而且如果您设置了密码自动过期，您也希望允许他们这样做。\n\
  \n![image](img/box.jpg) **密码永不过期**\n选择此选项允许密码在用户选择使用期间一直保持有效。对大多数用户激活此选项通常被认为是一种糟糕的安全实践。\n\
  \n![image](img/box.jpg) **账户已禁用**\n选择此选项将禁用新账户。管理员可以在需要时通过取消勾选复选框来启用账户。输入密码并选择所需的选项后，点击\
  \ `Next` 继续。随后您将看到确认屏幕。最后点击一次 `Next` 创建账户，或点击 `Back` 返回到任一对话框进行修改。\n\n### 修改用户账户\n\
  用于修改用户账户信息的对话框包含许多与创建账户时没有的字段。您可以使用这些字段来记录账户并设置某些其他安全选项。\n\n要修改现有的用户账户，右键点击您想要修改的用户对象，并在弹出菜单中选择\
  \ `Properties`。然后您将看到如图 15-4 所示的标签页对话框。\n\n![](img/line.jpg)![image](img/fig15-4.jpg)![](img/line.jpg)\n\
  **图 15-4.** 设置用户账户的属性！\n\n在前两个标签页 `General`（常规）和 `Address`（地址）中，您可以输入有关用户的额外信息，例如职位、邮寄地址、电话号码、电子邮件账户等。由于\
  \ Active Directory 还与 `Exchange Server` 集成，这些信息对于您的网络来说可能是重要的。\n\n在图 15-5 所示的 `Account`（账户）标签页中，您可以设置一些重要的用户账户选项。在标签页顶部，可以看到用户的登录名称以及用户具有主要成员关系的\
  \ Windows 域。下方是用户的 Windows NT 登录名称（称为 Windows 2000 之前的登录名称），用户可以选择使用它从 Windows NT\
  \ 计算机登录域，或使用尚未支持 Active Directory 登录的应用程序。（尽管您可以将这两个登录名称设置得不同，但这样做很少好主意。）\n\n![](img/line.jpg)![image](img/fig15-5.jpg)![](img/line.jpg)\n\
  **图 15-5.** 用户属性对话框中的 Account 标签页允许您设置一些重要的用户账户选项。\n\n点击 `Logon Hours` 按钮将显示如图 15-6\
  \ 所示的对话框。在此对话框中，您选择标准周内不同的时间段，然后点击相应的选项按钮来许可或拒绝在该时间段内访问网络。在图 15-6 中，设置允许了正常工作日的登录时间，并在这些时间前后留了一些缓冲，以允许略有不同的工作时间。默认情况下，允许用户在每周的任何时间登录网络。对于大多数网络，特别是较小的网络，允许用户在任何时间登录通常是可以接受的。\n\
  \n![](img/line.jpg)![image](img/fig15-6.jpg)![](img/line.jpg)\n**图 15-6.** 为用户设置登录时间限制！\n\
  \n在 `Account` 标签页上点击 `Log On To` 按钮将打开如图 15-7 所示的 `Logon Workstations` 对话框。默认情况下，用户可以登录域内的任何工作站，并由域对其进行验证。在某些情况下，系统可能需要更严格的安全，此时您可以指定用户账户可以登录的计算机。例如，您可能会设置一个用于备份网络的网络备份账户，然后让此账户一直登录在您的锁定机房中。由于备份账户具有访问网络上所有文件的权限（执行工作所必需），一个好主意是将该账户限制为仅登录机房内指定的为此目的计算机。您使用\
  \ `Log On To` 功能来设置此类限制。（注意，`Log On To` 功能仅在网络使用 `NetBIOS` 或 `NetBEUI` 协议时有效；除非在网络上设置了\
  \ Windows 命名服务，否则它无法用于仅使用 `TCP/IP` 的网络。）\n\n![](img/line.jpg)![image](img/fig15-7.jpg)![](img/line.jpg)\n\
  **图 15-7.** 限制用户可以登录的计算机！\n\n| ![image](img/common.jpg) | **注意** 允许用户登录另一个用户的计算机并不意味着该用户可以使用另一个用户的权限登录，或访问只有另一个用户才能访问的任何内容。这仅意味着用户可以使用列出的物理计算机从该计算机登录他自己的账户。\
  \ |\n\n\n\n\n\n`Account` 选项卡中的 `Account Options` 部分允许你选择各种二元化（开启/关闭）账户选项。在添加账户时，你可以设置某些选项，例如要求用户在下次登录时更改密码。列出的某些选项是用户\
  \ `Properties` 对话框特有的。这些附加选项中，最重要的两个是 `Account Is Disabled`（账户已禁用）和 `Account Is\
  \ Trusted for Delegation`（账户可用于委派）。如果选择了 `Account Is Disabled`，将禁用该用户账户，同时保留其在 `Active\
  \ Directory` 中的设置。如果你需要拒绝该用户账户访问网络，但将来可能需要重新启用该账户，则此选项非常有用。（`Account Is Disabled`\
  \ 在域内被视为高优先级更改进行处理，并立即生效，即使跨越大量的域控制器也是如此。）由于删除账户也会删除该用户可能拥有的任何权限，如果你以后可能需要再次授予该用户网络访问，应始终禁用账户而不是删除。例如，如果有人正在休假，你可以在他们离开期间禁用用户账户，等他们回来时再清除\
  \ `Account Is Disabled` 复选框。\n\n如果你想指定用户账户管理域的某些部分，则必须选择 `Account Is Trusted For\
  \ Delegation` 选项。`Windows Server 2012` 允许向 `Active Directory` 树的部分授予管理权限，而无需授予整个域管理权限。\n\
  \n用户 `Properties` 对话框中 `Account` 选项卡的最后一个选项是过期日期设置，`Account Expires`（账户过期）。默认情况下，设置为\
  \ `Never`。如果你希望定义过期日期，可以在 `End Of` 字段中进行。当达到指定的日期时，账户将自动禁用（但不会删除，因此如果你愿意，可以重新启用它）。\n\
  \n你在 `Properties` 对话框中经常使用的另一个选项卡是 `Member Of` 选项卡，你在其中为用户定义安全组，如图 15-8 所示所示。安全组将在描述删除或禁用用户账户后进行讨论。\n\
  \n![](img/line.jpg)![image](img/fig15-8.jpg)![](img/line.jpg)\n**图 15-8。** 控制用户的组成员关系\n\
  \n## 删除或禁用用户账户\n\n使用 `Active Directory Users And Groups` 控制台删除用户账户非常简单。在左窗格中，选择\
  \ `Users` 文件夹，然后在右窗格中选择该用户。右键点击该用户并选择 `Delete`，或者打开 `Action` 下拉菜单并选择 `Delete`。\n\
  \n禁用账户同样简单。选择用户账户，右键点击它，并选择 `Disable Account`（或打开 `Action` 下拉菜单并选择 `Disable Account`）。\n\
  \n![](img/line1.jpg)\n\n| ![image](img/common.jpg) | 提示 如果你需要删除大量账户，可以在选择 `Delete`\
  \ 或 `Disable Account` 命令之前全部选中它们，这样可以节省时间。只需确保你没有选择不想删除或禁用的账户即可！ |\n\n## 与 Active\
  \ Directory 安全组一起\n\n在任何网络中，你通常需要管理许多不同文件夹和文件的权限。如果你只能通过用户账户来授予访问权限，在尝试跟踪所有必要信息时你很快就会疯掉。\n\
  \n例如，假设一组人员（例如会计部门）对访问服务器上的 20 个不同文件夹具有特定权限。当招聘一名新会计师时，你是否需要记住或查找所有 20 个文件夹，以便给该会计师与部门其他人相同的权限？或者，假设一个拥有许多不同权限的用户更换了部门。你是否需要找到每项权限，以确保他仅拥有新部门的相应权限？\n\
  \n为了解决这些问题，网络操作系统支持 `security groups`（安全组，或简称 `groups`）的概念。你首先创建组，然后将所有适当的用户分配给该组，以便更轻松地管理他们的权限。当你授予服务器上文件夹的权限时，是通过授予该组网络权限来实现的。组的所有成员会自动\
  \ `inherit`（继承）这些权限。这种继承使得长期维护网络权限变得简单得多。事实上，你不应该尝试在不使用组的情况下管理网络权限。否则，你可能会很快因为试图跟踪一切而应接不暇，并且随着时间的推移几乎会出错。\n\
  \n用户不仅可以是组的成员，组也可以是其他组的成员。例如，假设你为公司的每个部门定义了一个组。其中一半部门属于一个名为研发部（R&D）的较大部门，另一半属于销售、行政和管理部（SG&A）。在你的网络中，某些文件夹特定于每个部门，某些特定于整个\
  \ R&D 或 SG&A，有些可以被网络上的每个用户访问。在这种情况下，你首先创建部门组，然后创建 R&D 和 SG&A 组。每个部门组将成为 R&D 或 SG&A\
  \ 的成员。最后，你使用内置的 `Domain Users` 组或你创建的代表所有人的组，然后将 R&D 和 SG&A 分配给每个用户的顶层组。\n\n一旦设置好组，就可以以最逻辑的方式授予权限。如果资源仅供特定部门使用，你就将该部门组分配给该资源。如果资源属于\
  \ R&D 或 SG&A，你就将这些部门分配给该资源；然后该部门内的所有个人部门组将继承访问该资源的权限。如果资源适用于所有人，你就将主顶层组分配给该资源。\n\
  \n使用这种分级组结构使权限管理变得更加简单，这种方法对于拥有数百或数千用户的大型网络来说实际上是必需的。\n\n### 创建组\n\n你使用 `Active\
  \ Directory Users And Computers` 控制台创建组。组出现在域的两个容器中：`Builtin` 和 `Users`。\n\n如图 15-9\
  \ 所示，内置组是固定的。它们不能被删除也不能成为其他组的成员。内置组已经分配了某些重要权限，你创建的其他组可以被赋予内置组的成员身份。同样，如果你想禁用特定的内置组，只需移除其所有的成员组即可。\n\
  \n![](img/line.jpg)![image](img/fig15-9.jpg)![](img/line.jpg)\n**图 15-9.** 查看内置组列表\n\
  \n![](img/line1.jpg)\n\n| ![image](img/common.jpg) | 注意 谨慎更改内置组的成员关系。对于大多数网络来说，虽然了解这些组是什么以及它们如何工作很重要，但你通常希望保持它们原样。\
  \ |\n\n\n\n\n\n通常，你仅操作“用户”（Users）容器中定义的组。图 15-10 显示了用户容器中的默认组，你可以通过双人图标和类型标记将它们与帐户区分开来。\n\
  \n![](img/line.jpg)![image](img/fig15-10.jpg)![](img/line.jpg)\n**图 15-10。** 用户容器中的默认组\n\
  \n要添加新组，请在左侧窗格中选择“用户”容器。然后打开“操作”（Action）下拉菜单，选择“新建”（New），并选择“组”（Group）。你将看到“新建对象\
  \ – 组”对话框，如图 15-11 所示。在第一个字段中输入组名称。你会看到输入的名称回显在第二个字段中。此字段允许你为 Windows NT（Windows\
  \ 2000 之前的）计算机指定不同的组名。然而，使用不同的组名通常不是好主意，因为这很快会让你的系统变得混乱。\n\n![](img/line.jpg)![image](img/fig15-11.jpg)![](img/line.jpg)\n\
  **图 15-11。** 创建新组\n\n命名组后，你可以从对话框下半部分的可用选项按钮中选择。“组范围”（Group Scope）部分涉及组在整个域中的填充范围：\n\
  \n![image](img/box.jpg)\n*域本地*Domain local 组仅存在于单个域内，并且仅包含来自该域的成员。\n\n![image](img/box.jpg)\n\
  *全局*Global 组仅包含其所在域的成员。然而，你可以将全局组权限分配给网络中的任何域，甚至是跨多个域。\n\n![image](img/box.jpg)\n\
  *通用*Universal 组存在于整个组织中，即使该组织的网络是由许多独立的域组成的。通用组还可以包含来自组织网络中任何域的成员。\n\n![](img/line1.jpg)\n\
  \n| ![image](img/common.jpg) | **提示** 如果你创建了一个范围错误的组，请不要担心。只要其成员没有违反新范围的成员规则，你就可以轻松更改组的范围。要更改域范围，请选择该组并打开其“属性”对话框（右键点击并从弹出菜单选择“属性”）。如果组成员允许该更改，你可以选择不同的“组范围”选项按钮。\
  \ |\n\n\n\n\n\n在设置完组的范围后，你还可以选择将其作为安全组或分发组。分发组仅用于为 Microsoft Exchange Server 等电子邮件应用程序维护邮件分发列表。在\
  \ Windows Server 2012 中，它们没有安全影响。最后，点击 `OK` 创建该组。现在，你可以按照下一节的描述向向组中添加成员了。\n\n##\
  \ 维护组成员关系\n\n新组在创建时不包含任何成员。要设置组的成员关系，请按照以下步骤操作：\n\n1. 选择该组，右键点击它，并在弹出菜单中选择`Properties`（属性）。出现`Properties`对话框。然后点击`Members`（成员）选项卡，如图图\
  \ 15-12 所示。\n2. 点击`Add`（添加）按钮。你会看到`Select Users, Contacts, Computers, Or Groups`（选择用户、联系人、计算机或组）对话框，如图图\
  \ 15-13 所示。\n![](img/line.jpg)![image](img/fig15-12.jpg)![](img/line.jpg) **图 15-12.**\n\
  一个新组没有任何成员。![](img/line.jpg)![image](img/fig15-13.jpg)![](img/line.jpg) **图 15-13.**\n\
  向组添加成员\n3. 输入足够的用户或其他组的名称以识别它，然后点击`Check Names`（检查名称）按钮。如果你输入的字符太少，无法唯一标识用户或组，Windows\
  \ 将显示一个可能的匹配列表，你可以从中选择正确的项。\n4. 选择要添加的成员，然后点击`OK`。\n5. 重复步骤 3 和 4 以完成组成员关系的设置。\n\
  \n## 使用共享\n\nWindows Server 2012 下的驱动器和文件夹以网络共享资源的形式提供给用户，在 Windows 网络术语中简单称为 `shares`（共享）。你选择一个驱动器或文件夹，启用共享，然后为共享设置权限。\n\
  \n## 理解共享安全\n\n你可以将驱动器和文件夹都设置为不同的共享资源，无论它们是位于文件分配表 (FAT) 格式的驱动器还是 NT 文件系统 (NTFS)\
  \ 格式的驱动器上。对于 NTFS 格式的驱动器（而非 FAT 格式的驱动器），你还可以对共享内的文件夹和文件设置权限，这些权限与共享本身的权限是独立的。理解\
  \ Windows Server 2012 如何处理 NTFS 驱动器上共享、文件夹和文件的安全性非常重要。\n\n假设你创建一个名为 `RESEARCH` 的共享，并赋予\
  \ R&D 安全组只读访问该共享。在共享内部，你对名为 `PROJECTS` 的文件夹设置了权限，允许 R&D 安全组完全读写访问（称为 `change permission`，更改权限）。R&D\
  \ 组对该文件夹是只读权限还是更改权限？该组将具有只读权限。这是因为共享的安全权限定义了共享内所有内容允许的最大权限。\n\n设置共享权限更好的方法是允许所有人（Everyone）对共享具有更改权限，然后通过设置共享内部文件夹的权限来控制实际权限。通过这种方式，你可以分配任何所需的权限组合；然后用户将获得你在这些文件夹上设置的权限，即使共享被设置为更改权限。\n\
  \n此外，记住用户是根据他们所属的组接收权限的，且这些权限是累加的。因此，如果你是某个特定文件具有只读权限的 `Everyone` 组成员，但你也是对该文件具有完全控制权限的\
  \ `Admins` 组成员，在实际上你拥有完全控制权限。这是一个重要的规则：在文件夹和文件上设置的权限总是累加的，并考虑了单独为用户设置的权限，以及用户所属的任何安全组。\n\
  \n另一个重要点是，你可以在共享内部（有时称为 `NTFS 权限`）对文件夹和文件都设置权限，这些权限也是累加的。例如，你可以为某个用户设置文件夹的只读权限，但对某些特定文件设置更改权限。这样该用户就有了读取、修改甚至删除这些文件的能力，而对同一文件夹中的其他文件没有该能力。\n\
  \n有一种名为 `no access`（无访问）的特殊权限，它可以覆盖所有其他权限，无论如何。如果你对文件或文件夹上的用户设置 `no access` 权限，那么就这样——该用户将无法访问该文件或文件夹。该规则一个极其重要的推论是，`no\
  \ access` 也是累加且覆盖的。因此，如果 `Everyone` 安全组对某个文件具有更改权限，但你将某个特定用户对该文件设置为 `no access`，那么该用户将获得\
  \ `no access` 权限。然而，如果你对 `Everyone` 组设置了 `no access` 权限，那么该组的所有成员也将获得无访问权限，因为覆盖了他们拥有的任何其他权限。在使用安全组使用\
  \ `no access` 时小心！\n\n总结一下，如果你记住这里讨论的规则，就可以解决大多数权限问题：\n![image](img/box.jpg) 共享权限定义了共享内生效的最大权限。当共享中的文件或文件夹授予的权限比共享本身多时，共享的权限优先。\n\
  ![image](img/box.jpg) 除了上述规则外，权限是累加的，考虑了分配给用户、组以及文件和文件夹的权限。\n![image](img/box.jpg)\
  \ 当发生权限冲突时，如果设置了 `no access`，它始终优先。\n\n## 创建共享\n\n作为网络管理员，你将经常创建和管理网络共享。以下步骤将引导你创建一个新共享。\n\
  \n1. 在服务器上打开 `My Computer`（我的计算机）或 `Windows Explorer`（资源资源管理器）。\n2. 右键点击你想共享的文件夹或驱动器，然后在弹出菜单中选择`Share`（共享）。你会看到\
  \ `File Sharing`（文件共享）对话框，如图图 15-14 所示。\n![](img/line.jpg)![image](img/fig15-14.jpg)![](img/line.jpg)\
  \ **图 15-14.** 创建共享\n3. 在提供的字段中，输入足够的用户名以识别系统中的该人员，然后点击`Add`（添加）。\n4. 点击用户名旁边的箭头设置该用户的权限级别。可用的权限级别有\
  \ `Owner`（所有者），具有完全读写访问以及授予其他用户权限的能力；`Read/Write`（读写），完全读写访问；以及 `Read`（读取），只读访问。\n\
  5. 点击`Share`按钮创建共享。你会看到一个确认对话框。点击`OK`，共享将创建。默认情况下，共享使用文件夹名称作为共享名称。\n\n一旦创建共享且共享信息已传播到域（通常在几分钟内），用户就可以通过\
  \ `Network Neighborhood`（网络邻域，Windows 9x* 和 NT）、`My Network Places`（我的网络场所，Windows\
  \ 2000 和 XP）或 `Network`（网络，Windows Vista 及更高版本）浏览它。双击共享将打开它（如果权限允许）。\n\n## 映射驱动器\n\
  \n你可以通过 `Network Neighborhood`、`My Network Places` 或 `Network` 打开共享来使用它们，它们的功能与\
  \ `My Computer` 中的文件夹一样。然而，你可能经常想通过网络共享在计算机上模拟一个连接的硬盘。例如，许多将文件存储在网络上的应用程序要求网络文件夹可以作为普通驱动器号访问。使用网络共享模拟驱动器的过程被称为\
  \ `mapping`（映射）。你需要在要使用的驱动器号与实际网络共享之间创建一个映射（链接），以保持连接到该驱动器号。\n\n你可以通过多种方式创建驱动器映射。最简单的方法是从客户端计算机上打开\
  \ `Network`，找到想要映射的共享，右键点击它，并选择`Map Network Drive`（映射网络驱动器）。在出现的对话框中，域和共享的名称已经为你填好。只需为映射选择一个合适的驱动器号并点击`OK`。从那时起，该共享将以该驱动器号的形式出现在你的计算机上，用户将在\
  \ `My Computer` 中看到此共享的盘符。\n\n你也可以使用名为 `NET` 的命令行实用程序映射驱动器。`NET` 命令有多种形式，可以根据你提供的参数满足许多不同的需求。要映射驱动器，你使用\
  \ `NET USE` 命令。单独输入 `NET USE` 并按回车将列出所有当前映射的驱动器。（你可以输入 `NET HELP USE` 获取有关该命令的更详细帮助）。要添加新的驱动器映射，你应该输入以下：\n\
  ```\n![image](img/p255-01.jpg)\n```\nWindows 网络中的大多数网络资源使用一种称为 `Universal Naming\
  \ Convention (UNC)` 的命名系统。要提供 UNC，以两个反斜杠开始，然后是服务器名称、另一个反斜杠，以及共享名称。（额外的反斜杠和名称可以指向共享内部的文件夹和文件。）例如，要将\
  \ `G:` 映射到位于 `SERVER` 上名为 `EMPLOYEES` 的共享，使用以下命令：\n```\n![image](img/p255-02.jpg)![](img/line1.jpg)\n\
  NET USE G: \\\\SERVER\\EMPLOYEES\n```\n\n\n\n\n| ![image](img/common.jpg) | 提示：你可以从任何\
  \ Windows 客户端使用 `NET` 命令来操作任何 Windows 网络。单独输入 `NET` 可以列出该命令的所有不同形式。输入 `NET command\
  \ HELP` 可以查看有关不同 `NET` 命令的详细帮助信息。 |\n\n## 使用打印机\n\n在网络上设置和使用打印机之前，你能够了解网络打印涉及的组件以及它们是如何相互作用的。\n\
  \n### 了解网络打印\n`print job`（打印任务）是从网络工作站发送到网络打印机的一组二进制数据。打印任务与计算机发送到本地连接打印机的数据相同——它被重定向到网络进行打印。\n\
  \n将打印任务发送到打印队列的网络工作站负责为打印机正确地格式化打印数据。这是通过安装在工作站上的软件实现的，该软件被称为 `print driver`（打印驱动程序），它针对每种类型的打印机。打印机驱动程序也适用于使用它的每个操作系统。换句话说，适用于\
  \ `Windows XP` 计算机的 `HP LaserJet 5si` 驱动程序与适用于 `Windows 2000` 工作站计算机的 `HP LaserJet\
  \ 5si` 驱动程序不同。更麻烦的是，相同操作系统的不同版本有时使用不同的驱动程序，因此 `Windows XP` 计算机的驱动程序可能无法在 `Windows\
  \ Vista` 上工作，反之亦然。\n\n打印任务通常通过捕获的打印端口发送到网络。网络客户端软件将网络工作站上的某个打印端口（如 `LPT1`）重定向到网络。将打印端口重定向到网络打印机的过程称为\
  \ `capturing`（捕获）。通常，捕获端口是持久的，并在多次登录期间持续有效直到关闭。\n\n发送到网络的打印任务进入一个名为 `print queue`（打印队列）的地方。打印任务留在队列中，直到网络能够处理该任务并将其发送到打印机。打印队列可以包含来自许多不同用户的许多任务，通常按照先进先出的方式管理。\n\
  \n`print servers`（打印服务器）从打印队列中移除任务并发送到打印机。在将完整任务发送到打印机后，打印服务器从队列中移除该任务。你可以通过许多不同的方式实现打印服务。如果你使用的打印机连接到网络上的服务器或工作站，该服务器或工作站就会承担打印服务器的职责。如果打印机直接连接到网络（它有自己的网络端口），那么打印机通常作为其网络硬件的一部分内置了打印服务器。这个内置打印服务器具有登录网络并处理特定打印队列的智能。\n\
  \n打印任务始于打印应用程序，该应用程序将其打印机输出发送到本地操作系统。本地操作系统使用应用程序请求的打印机驱动程序来为目标打印机格式化实际打印任务。本地操作系统与已安装的网络客户端软件协作，将格式化后的打印任务发送到打印队列，任务将留在队列中直到打印机可用。然后，打印服务器将打印任务从队列发送到实际打印机。\n\
  \n这涉及许多步骤，但一旦一切设置完成，运行就会非常顺畅，正如你将在下一节中看到的。图 15-15 显示了网络打印原理的概述。\n\n![](img/line.jpg)![image](img/fig15-15.jpg)![](img/line.jpg)\n\
  **图 15-15.** 网络打印过程概述\n\n### 设置网络打印机\n你可以轻松地设置连接到服务器（或工作站）的打印机，以便其他网络用户访问它。然而，对于用户超过\
  \ 20 人的网络，最好购买带有网络接口和内置打印服务器的打印机（大多数适用于业务用途的激光打印机已具备这些功能）。\n\n此外，带有内置打印服务器的打印机在网络上移动要容易得多。它们可以去任何有网络连接和有电源的地方。一旦在新位置连接到网络，打印机就会登录网络并立即开始工作。\n\
  \n如果你想共享直接连接到 `Windows Server 2012` 服务器的打印机，这是很容易实现的。首先，打开服务器的 `Devices And Printers`（设备和打印机）文件夹，它列出了所有已安装的打印机。右键点击你想共享的打印机，从弹出菜单中选择\
  \ `Printer Properties`（打印机属性）。打印机的 `Properties`（属性）对话框将出现。选择 `Sharing`（共享）选项卡，将显示图\
  \ 15-16![image](img/fig15-16.jpg)![](img/line.jpg)\n**图 15-16.** 启用打印机共享\n\n![](img/line1.jpg)\n\
  \n| ![image](img/common.jpg) | 注意：在本示例中，打印机及其驱动程序已正确安装，就像它们在安装 `Windows Server 2012`\
  \ 时通常的那样。如果它们没有正确安装，请打开 `Printers`（打印机）文件夹并使用 `Add Printers`（添加打印机）图标在服务器本身上设置打印机。\
  \ |\n\n\n\n\n\n在“共享”（Sharing）选项卡上，勾选 `Share This Printer` 复选框，然后为打印机分配一个共享名称，客户端计算机将通过该名称识别打印机。此时，你可以点击\
  \ `OK` 按钮，因为共享打印机的默认权限允许 `Everyone` 组进行打印。或者，如果你想为共享打印机设置其他权限，请使用打印机“打印属性”（Printer\
  \ Properties）对话框中的“安全”（Security）选项卡。\n\n在“安全”选项卡中分配的组是共享打印机的默认分配，显示了 `Administrators`\
  \ 权限。每个实体都分配了三个主要权限：`Print`打印、`Manage Printers`管理打印机和`Manage Documents`管理打印文档。`Everyone`\
  \ 组具有打印权限，但不能管理队列中的文档。然而，名为 `Creator Owner` 的特殊组具有管理文档的权限。这意味着发送打印作业的用户权限修改或删除自己的打印作业，但不能操作队列中的其他作业。\n\
  \n对于高吞吐量需求，你可能希望使用名为 `printer pooling`（打印机池）的功能，它允许你设置多台相同的打印机，它们都连接到同一个打印机队列，在网络上显示为一台打印机。用户打印到列出的打印机，由第一台可用的真实打印机提供服务。使用\
  \ `printer pooling`，你可以让整组打印机对用户显示为一台打印机，并大幅增加你能处理的打印请求数量。请记住，池打印机必须是相同的，因为它们将使用相同的打印驱动程序。图\
  \ 15-17 显示了启用打印机池的 `Ports`选项卡。![](img/line.jpg)![image](img/fig15-17.jpg)![](img/line.jpg)**图\
  \ 15-17。启用打印机池**\n\n如你所示，使用 `Windows Server 2012` 设置网络打印机是一个相对简单的过程，让你在设置和管理共享打印机方面具有相当的灵活性。同时记住，其他打印模型也是可能的，例如网络连接打印机。请参阅此类打印机附带文档文档，有关如何在网络上设置它们的详情。\n\
  \n## 章节总结\n\n没有任何一个章节能够涵盖专业管理 `Windows Server 2012` 所需的所有工具和知识。本章简要介绍了如何处理最常见和最重要的任务。如果你正在或将管理\
  \ `Windows Server 2012` 系统，你应该针对本章讨论的话题以及你需要掌握许多其他主题追求更详细的知识。\n\n特别是，从研究和学习这些重要工具开始：\n\
  \n![image](img/box.jpg)\n- `Reliability And Performance Monitor`（可靠性和性能监控器）用于故障排除、性能调优和重要服务器统计数据的持续监控。`Reliability\
  \ And Performance Monitor` 可以配置在你设置的触发器发生时执行某些操作，例如向你发送短信或向网络上的其他计算机发送警报消息。它也是解决你遇到的任何性能问题的极工具。\n\
  ![image](img/box.jpg)\n- `Event Viewer`（事件查看器）是你发现和诊断 `Windows Server 2012` 问题的关键。你应该定期使用\
  \ `Event Viewer`（我建议每天使用）来查看新事件并决定它们是否需要你立即关注。你可以使用 `Event Viewer` 定期保存事件日志，在日志中创建错误和信息消息的长期记录。\n\
  ![image](img/box.jpg)\n- `Task Scheduler`（任务计划程序）可用于调度你希望在服务器上频繁运行的循环任务，例如病毒扫描（使用第三方病毒软件）、磁盘碎片整理和磁盘测试。\n\
  \n这些是你为基础 `Windows Server 2012` 管理而应学习的一些核心工具。\n![image](img/common4.jpg)\n\n| 第\
  \ 16 章 | ![image](img/line-1.jpg) | 介绍 Exchange Server 2013 |\n\n![image](img/common5.jpg)![image](img/line1.jpg)\n\
  微软提供了多种专门的服务器系统，包括广泛使用的 `Exchange Server` 应用程序。`Exchange Server` 是微软的电子邮件解决方案，旨在处理几乎任何机构的电子邮件需求。本章介绍了\
  \ `Exchange Server`。你将学习如何安装它、执行基本配置任务，并使用 `Exchange Server` 的 `Outlook Web App`\
  \ 功能访问信箱。\n\n## Exchange Server 2013 特性\n\n`Exchange Server` 是适用于各种规模组织的综合电子邮件解决方案，从小型公司到大型跨国集团体。它具有极高的可靠性和可扩展性，多年来一直广泛使用。`Exchange\
  \ Server` 的某些功能包括：\n\n![image](img/box.jpg)\n- 用户获取电子邮件的多种访问方法，包括通过如 `Microsoft\
  \ Outlook` 等电子邮件客户端应用程序、移动设备（如智能手机或平板电脑）、网页浏览器，甚至是语音响应系统！\n![image](img/box.jpg)\n\
  - `Unified Messaging`（统一消息），不仅可以将电子邮件投递到用户的收件箱，还可以处理语音信箱和传真！\n![image](img/box.jpg)\n\
  - 支持协作功能，例如日历、共享资源调度（如会议室或设备）、会议安排和离岗通知！\n![image](img/box.jpg)\n- 支持用户定义的规则，允许常规电子邮件任务的自动化![](img/line1.jpg)\n\
  \n| ![image](img/common.jpg) | 提示：自动化电子邮件任务非常有用。例如，你可以设置一个人力资源部门信箱，求职者向其发送简历，在收到每份简历时，服务器都会向发送者回复即时确认。它还可能自动将简历转发给相应的人员。\
  \ |\n\n\n\n\n\n![image](img/box.jpg)\n\n与 `Active Directory` 深度集成，这意味着你可以在一个中心化位置维护用户账户及其关联的邮箱！\n\
  \n![image](img/box.jpg)\n\n包含反垃圾邮件和反杀病毒技术，并可以方便地为这些任务添加第三方插件软件。无论你是为小型组织需要一个基础的内部电子邮件系统，还是需要一个处理成千上万用户的用户的复杂、强大的系统，`Exchange\
  \ Server` 都能满足这些需求。\n\n## 安装 Exchange Server 2013\n\n如果你刚刚开始学习 `Exchange Server\
  \ 2013` 或正在对其进行评估，可以从微软下载一个功能完备的试用版本，该版本可以运行 120 天。然而，在安装 之前，请先查阅以下前提条件：\n\n![image](img/box.jpg)\n\
  \n- `Windows Server 2008 R2` 或 `Windows Server 2012`（未配置为服务器核心模式）\n\n![image](img/box.jpg)\n\
  \n- 兼容 `Intel 64` 或 `AMD64` 架构的 64 位处理器\n\n![image](img/box.jpg)\n\n- 一个 `Active\
  \ Directory` 域，且森林功能级别至少设置为 `Windows Server 2003` \n\n![image](img/box.jpg)\n\n\
  - `Client Access` 角色至少需要 4GB RAM，`Mailbox` 角色至少需要 8GB RAM，或者两个角色合计需要！\n\n![image](img/box.jpg)\n\
  \n- 安装分区上至少有 30GB 空闲磁盘空间\n\n![image](img/box.jpg)\n\n- 每个将安装的 `Unified Messaging`\
  \ 语言包额外需要 0.5GB 磁盘空间！\n\n![image](img/box.jpg)\n\n- 系统分区上至少有 200MB 空闲空间\n\n![image](img/box.jpg)\n\
  \n- 所有磁盘分区均已格式化为 NTFS 文件系统\n\n除了这些，还有许多其他详细要求，但 `Exchange Server` 安装程序将调查你的系统，并通知你必须满足的任何额外要求。\n\
  \n对于本示例安装，你可以使用在第 14 章中讨论过的 `Windows Server 2012` 安装程序。在开始之前，你应该运行 `Windows Update`\
  \ 以确保已所有所有的系统补丁。\n\n当你首次启动 `Exchange Server` 安装程序时，系统会提示你在运行安装之前检查 `Exchange` 的更新。这始终是一个好主意，你应该在点击\
  \ `Next` 继续之前执行操作。\n\n接下来，系统会提示你想要在服务器上安装哪些角色。在 `Exchange Server 2013` 中，角色数量已简化为两个主要角色：`Mailbox`\
  \ 角色和 `Client Access` 角色，如图图 16-1 所示。\n\n![](img/line.jpg)\n![image](img/fig16-1.jpg)\n\
  ![](img/line.jpg)\n**图 16-1。** 选择在服务器上安装的角色\n\n`Mailbox` 角色持有包含用户邮箱和公共文件夹的数据库，而\
  \ `Client Access` 角色充当客户端连接并使用 `Exchange Server` 的主要功能。对于大型安装，你可能希望分离这些角色，以平衡你正在使用的服务器的负载。\n\
  \n对于较小的安装，特别是为了熟悉而设置系统，你应该同时安装 `Mailbox` 角色和 `Client Access` 角色。\n\n接下来，在安装过程中，系统会提示你想要安装\
  \ `Exchange Server` 的位置，如图图 16-2 所示。如果接受默认值，点击 `Next` 继续。否则，在点击 `Next` 继续之前，输入或浏览到你想安装\
  \ `Exchange Server` 的文件夹。\n\n![](img/line.jpg)\n![image](img/fig16-2.jpg)\n![](img/line.jpg)\n\
  **图 16-2。** 选择 `Exchange Server` 的安装位置\n\n安装程序随后要求你指定 `Exchange` 组织的名称，如图图 16-3\
  \ 所示。通常，这将是你的公司名称，尽管允许使用的字符有限制，这些字符必须是\n\n![](img/line.jpg)\n![image](img/fig16-3.jpg)\n\
  ![](img/line.jpg)\n**图 16-3。** 指定 `Exchange Organization` 名称！\n\n- A 到 Z（允许大小写均可）\n\
  - 0 到 9\n- 空格，但不能是开头或结尾空格！\n- 连字符\n\n输入组织名称后，点击 `Next` 继续。\n\n现在系统询问你是否在 `Exchange\
  \ Server` 中禁用恶意软件扫描。默认情况下，`Exchange Server` 包含自身的恶意软件保护，但如果你将使用另一公司的反恶意软件软件，可以禁用它。做出选择并点击\
  \ `Next` 继续。\n\n安装程序现在扫描你的系统，并将指示任何尚未满足的安装条件。如果需要安装额外的软件，安装程序将提供缺失软件位置的链接以便你进行安装。安装程序还会突出显示你应该注意的任何警告。图\
  \ 16-4 显示就绪检查屏幕的示例。\n\n![](img/line.jpg)\n![image](img/fig16-4.jpg)\n![](img/line.jpg)\n\
  **图 16-4。** Exchange Server 就绪检查屏幕\n\n一旦满足了任何未决的前决条件，你就可以点击 `Install` 开始实际安装。\n\n\
  当安装完成后（大约需要 15 到 30 分钟，取决于服务器硬件），你将看到如图图 16-5 所示的完成界面。\n\n![](img/line.jpg)\n![image](img/fig16-5.jpg)\n\
  **图 16-5。** Exchange Server 已安装。\n\n## 设置邮箱\n\n`Exchange Server 2013` 使用了一种新的基于\
  \ Web 的管理工具 `Exchange Admin Center`。你通过导航到以下地址访问该工具，并将 `<exchange_server_name>`\
  \ 替换为 `Exchange Server` 的 IP 地址或服务器名称：\n\n![image](img/p268-01.jpg)\n\n一旦 `Exchange\
  \ Admin Center` 打开，你将看到如图图 16-6 所示的屏幕。\n\n![](img/line.jpg)\n![image](img/fig16-6.jpg)\n\
  **图 16-6。** Exchange Admin Center\n\n### 创建邮箱\n\n要在 `Exchange` 中创建邮箱，请遵循以下步骤：\n\n\
  1. 在 `Exchange Admin Center` 的左窗格中，导航到 `Recipients`。在中间窗格中，确保选中了 `Mailboxes`（你的屏幕看起来应该像图\
  \ 16-6）。然后，要创建邮箱，点击 `Mailboxes` 下方的加号。你将看到如图图 16-7 所示的屏幕。\n\n![](img/line.jpg)\n\
  ![image](img/fig16-7.jpg)\n![](img/line.jpg)\n**图 16-7。** 在 `Exchange Admin Center`\
  \ 中添加邮箱\n\n2. 如果你为现有域用户创建邮箱，点击 `Existing User` 选项，然后点击 `Browse` 选择用户。如果你想为新用户创建邮箱，请点击\
  \ `New User` 选项并完成所需信息。\n\n3. 在在 `Exchange Admin Center` 中打开后，你将看到如图图 16-6 所示的界面。如图图\
  \ 16-7 所示。\n\n![](img/line.jpg)\n![image](img/fig16-6.jpg)\n![](img/line.jpg)\n\
  **图 16-6。** Exchange Admin Center\n\n4. 完成编辑后，点击 `Save`。\n\n5. 在 `Exchange` 中，你可以选择要创建的邮箱，如图图\
  \ 16-8 所示。\n\n![](img/line.jpg)\n![image](img/fig16-8.jpg)\n![](img/line.jpg)\n\
  **图 16-8。** 添加邮箱\n\n6. 邮箱创建后，点击 `Save`。\n\n## 测试邮箱\n\n要访问你创建的邮箱，你将使用服务器上的 Outlook\
  \ Web Access (`OWA`)。Internet Explorer 可能会提示证书与名称不匹配。打开 Internet Explorer 并输入 `https://*local_name*/owa/`。当你首次登录\
  \ `OWA` 时，系统会提示你设置默认语言和时区，如图图 16-9 所示。\n\n![](img/line.jpg)\n![image](img/fig16-9.jpg)\n\
  ![](img/line.jpg)\n**图 16-9。** 首次访问 OWA 时设置选项\n\n如果你告诉 Internet Explorer 继续，它就可以工作。你现在处于\
  \ `OWA` 中，如图图 16-10 所示。\n\n![](img/line.jpg)\n![image](img/fig16-10.jpg)\n**图 16-10。**\
  \ 你已进入！Outlook Web Access\n\n花时间探索 `OWA`。虽然本地用户通常使用 Microsoft Outlook 与 `Exchange\
  \ Server` 交互，但你会发现 `OWA` 是一个极佳的远程访问解决方案，允许用户从任何联网设备访问存储在 `Exchange Server` 上的电子邮件、日历和联系人。\n\
  \n### 章总结\n\n在本章中，你在带有 `Active Directory` 的 `Windows Server 2012` 服务器上安装了 `Exchange\
  \ Server 2013`。你还创建了带有邮箱的用户账户并成功通过 `OWA` 访问了它。这一演示说明安装并不困难。如果你将处理生产系统，你无疑需要更多信息。一个起点是从微软的文档，你可以在这里[`technet.microsoft.com/exchange/`](http://technet.microsoft.com/exchange/)找到它。\n\
  \n虽然 `Windows Server 2012` 有许多应用程序和服务，但下一章描述的服务是几乎每个网络都会使用的基础服务。在第 17 章中，你将学习 `DHCP`、`DNS`、远程访问、`Internet\
  \ 信息服务`以及远程桌面服务，这些都是 `Windows Server 2012` 的组成部分。\n\n![image](img/common4.jpg)\n\
  \n\n\n\n\n# 第 17 章：理解其他 Windows Server 2012 服务\n\nWindows Server 2012 的优势之一是它可以执行许多功能并承担许多角色。Windows\
  \ Server 2012 不仅是一个强大且高效的文件服务器和打印服务器，而且开箱即用即可胜任许多其他任务。第 14 章和第 15 章解释了如何将 Windows\
  \ Server 2012 设置为基础文件服务器和打印服务器，以及如何日常管理 Windows Server 2012。要充分利用 Windows Server\
  \ 2012 的优势，你需要了解还有哪些可用服务、它们是如何工作的以及它们的用途。本章介绍了 Windows Server 2012 自带的一些服务。你可以在专用于\
  \ Windows Server 2012 的书籍中找到实现这些服务的详细说明。\n\n## 探索 DHCP\n\n如果你从事计算机领域多年，可能还记得手动管理\
  \ `TCP/IP` 地址是什么样子。你需要访问网络上的每台计算机来设置其 `TCP/IP` 地址。你还必须跟踪哪些计算机使用了哪些地址，因为你可用的地址数量有限。此外，正如你可能知道，当网络上的两台计算机尝试使用相同的\
  \ `TCP/IP` 地址时，麻烦很快随之而来，你必须花时间解决这些问题。\n\n正如第 6 章所示，动态主机配置协议（`DHCP`）在这些情况下解决了问题。`DHCP`\
  \ 服务器是网络上的一个计算机，负责跟踪哪些 `TCP/IP` 地址是可用的，并将它们分配给启动并向服务器请求 `TCP/IP` 地址的计算机和其他设备。有了\
  \ `DHCP` 服务器，你就不需要担心地址冲突，或者在你的 `TCP/IP` 地址范围发生变化时对计算机上使用的地址进行重新编号。\n\n> **注意**：由于\
  \ `TCP/IP` 是基于 Windows Server 2012 网络的默认协议，且 Windows Server 2012 设计为在仅限 `TCP/IP`\
  \ 的网络上正常运行，因此 `DHCP` 服务随 Windows Server 2012 默认安装。但是，DHCP 服务默认未启用，因为你不应该在网络上设置冲突的\
  \ `DHCP` 服务器。\n\n要使用 `DHCP`，你必须定义范围（scope）以及服务器提供给客户端计算机的相关 `TCP/IP` 设置。`范围`简单是指服务器允许分配的\
  \ `TCP/IP` 地址范围（或多个范围）。在服务器分发的关联 `TCP/IP` 设置中，还包括网络上其他域名系统（`DNS`）或 Windows 内部命名服务（`WINS`）服务器的地址。当\
  \ `DHCP` 服务器向客户端计算机分配 `TCP/IP` 地址时，该地址被认为已“租约”（leased），它将在一段时间内保留分配给该客户端计算机。租约通常配置为持续二到七天（Windows\
  \ Server 2012 的默认设置为八天）。在此期间，分配的 `TCP/IP` 地址不会提供给其他计算机。\n\n当客户端计算机启动并加入网络时，如果它被配置为寻找\
  \ `DHCP` 服务器，客户端计算机将在初始化其 `TCP/IP` 协议栈时执行此操作。任何可用的 `DHCP` 服务器都会用 `DHCP` 服务器地址数据库中的可用地址响应客户端对地址的请求。然后，客户端计算机将在租期内使用该地址。\n\
  \n管理员可以根据需要取消并重新分配 `TCP/IP` 信息（通常在下班后进行，此时客户端计算机已关闭）。管理员随后对 `DHCP` 范围信息进行更改，并在客户端重新连接网络时将这些更改通信给客户端。通过这种方式，你可以轻松地更改如\
  \ `DNS` 服务器地址甚至 `TCP/IP` 地址范围等信息，而无需访问所有计算机。\n\n尽管 `DHCP` 是管理 `TCP/IP` 地址的强大工具，但你应该仅将其用于不向其他计算机提供任何\
  \ `TCP/IP` 服务的客户端计算机。例如，你不会希望设置 Web 服务器使用 `DHCP` 来获取动态 `TCP/IP` 地址，因为想要连接到 Web 服务器的客户端计算机在地址更改时将无法找到它。相反，你应该为向本地网络或通过\
  \ Internet 提供启用 `TCP/IP` 服务的计算机分配固定地址。你可以通过两种方式之一分配这些地址：\n\n-   你可以简单地在本地为这些计算机分配固定的\
  \ `TCP/IP` 地址，然后对 `DHCP` 服务器管理的范围设置`排除范围`（exclusion ranges），这可以防止 `DHCP` 服务器使用这些地址或向其他计算机提供这些地址。\n\
  -   你你可以在 `DHCP` 服务器上设置`预留`（reservation），这会强制服务器始终将预留地址分配给特定的计算机。\n\n> **提示**：为网络打印机使用静态\
  \ IP 地址是一个好主意。这样做可以让打印机连接问题的故障排除变得更容易。\n\n\n\n\n\n# 调查 DNS\n\n如第 6 章所述，DNS 是一种允许将易记的名称映射到\
  \ TCP/IP 地址和端口的技术。例如，当你使用网络浏览器并输入地址 [www.yahoo.com](http://www.yahoo.com) 时，你正在使用\
  \ DNS 服务器将域名 [www.yahoo.com](http://www.yahoo.com) 解析为特定的 TCP/IP 地址。你的网络浏览器透明地使用该\
  \ TCP/IP 地址与相关服务器进行通信。DNS 系统让互联网比没有它时易用得多。（想象一下，广告商如果说“请访问 http://65.193.55.38 访问我们的网站！”，他们该有多兴奋”。）\n\
  \nWindows Server 2012 包含一个完整的 DNS 服务器。事实上，Active Directory（活动目录）的运行需要 DNS 服务器。如果你将第一台\
  \ Active Directory 服务器安装到 Windows Server 2012 域中，DNS 服务将同时自动安装；否则，你必须手动选择并添加它们。\n\
  \n运行 DNS 服务的 Windows Server 2012 器可以管理你自己的域和子域，你还可以设置多个 DNS 服务器，每个服务器管理域命名空间的一部分。当然，在小型网络中，仅使用单个\
  \ DNS 服务器是可能的，由于成本问题，这可能也是理想的。\n\n你通过 DNS 微软管理控制台（MMC）插件来管理 DNS 服务，通过打开服务器管理器、然后点击“工具”菜单并选择“DNS”来访问它。图\
  \ 17-1 显示了 DNS 管理器窗口。\n\n![](img/line.jpg)\n![image](img/fig17-1.jpg)\n![](img/line.jpg)\n\
  **图 17-1.** 使用 DNS 管理器管理 DNS 服务。\n\n当你为组织设置 DNS 时，首先要建立根命名空间（存储域名的虚拟位置），通常使用你为互联网注册的域名，例如\
  \ [omh.com](http://omh.com)。然后，你可以通过在前面添加组织单元或地理单元来创建你自己的子域，例如 [italy.omh.com](http://italy.omh.com)\
  \ 或 [accounting.omh.com](http://accounting.omh.com)。\n\n每个 DNS 服务器负责存储其所管理的命名空间中使用的所有\
  \ DNS 名称，并向其他 DNS 服务器传送任何更改。当你使用多个 DNS 服务器管理 DNS 命名空间的不同部分时，每个 DNS 服务器管理一个 `zone`。不同区域之间的更新被称为\
  \ `zone transfers`。Windows Server 2012 DNS 服务支持完整区域传输和增量区域传输。（增量区域传输仅交换更新的信息，这可以显著减少大型\
  \ DNS 命名空间网络上的流量。）\n\n由于 DNS 是 Active Directory 的不可或的一部分，因此为你的 DNS 服务器建立冗余至关重要。微软建议每个域控制器也充当\
  \ DNS 服务器，并且你必须为每个管理的区域至少设置一个主备用 DNS 服务器。\n\n# 理解远程访问\n\nWindows 早期版本支持一种名为路由和远程访问服务（RRAS，发音为“ar-razz”）的服务用于远程访问。在\
  \ Windows Server 2012 中，它现在被称为远程访问。它包含了路由功能，允许通过虚拟专用网络（VPN）技术（在第 8 章中讨论）通过公共网络（如互联网）连接网络。VPN\
  \ 的原理是在客户端和远程访问服务器之间建立一个安全的“隧道”，加密数据包通过该隧道传输。客户端计算机拨号其普通的互联网服务提供商（ISP），然后通过互联网与远程访问服务器建立安全的\
  \ VPN 连接。\n\nWindows Server 2012 下的远程访问服务是安全的且具有相当灵活性，因此你可以根据组织的需要对其进行设置。\n\n在使用或管理远程访问之前，你必须首先在服务器上安装远程访问角色。如第\
  \ 15 章所述，你通过服务器管理器执行此操作。然后，按照第 15 章中讨论的步骤添加角色。\n\n要管理远程访问，打开服务器管理器，选择“工具”，然后从菜单中选择“远程访问”。远程访问管理器启动后，你可以运行“启动向导”进行初始配置。向导会引导你完成过程，并允许你选择仅启用远程访问、仅启用路由/远程访问或两者都要。图\
  \ 17-2 显示了启用远程访问后的远程访问控制台。\n\n![](img/line.jpg)\n![image](img/fig17-2.jpg)\n![](img/line.jpg)\n\
  **图 17-2.** 使用远程访问控制台管理远程访问。\n\n首先，你必须启用用户访问网络，这可以通过编辑用户属性框来实现（用户属性在第 15 章中讨论）。然后，你可以配置远程访问使用许多功能来确保远程访问的安全，包括：\n\
  \n*   设置远程访问运行的时间段。\n*   设置特定用户或组可以使用远程访问的时间段。\n*   将访问限制为远程访问服务器或网络上的特定服务。\n* \
  \  根据远程计算机名称或 TCP/IP 设置访问策略。\n\n通过使用远程访问，你可以轻松地让 Windows Server 2012 通过拨号连接和互联网为远程用户提供重要的访问服务。\n\
  \n# 探索 IIS\n\nWindows Server 2012 包含一组作为信息服务（IIS）运行的的服务，包括：\n\n*   **Web**：IIS Web\
  \ 服务提供全面的网站托管软件。你可以使用 IIS 定义多个网站，并对其进行单独管理。对于每个网站，你可以指定网站文件所在的目录，以及网站的安全设置和优化网站性能的参数。\n\
  *   **文件传输协议 (FTP)**：IIS FTP 服务允许你在 Windows Server 2012 计算机上设置 FTP 站点。你可以定义 FTP\
  \ 目录，以及目录列表以 UNIX 还是 MS-DOS 格式显示。你还可以设置安全设置以允许不同的客户端计算机或网络访问 FTP 服务器，并指定是否允许匿名 FTP\
  \ 登录。\n*   **简单邮件传输协议 (SMTP)**：SMTP 服务器允许运行 IIS 的系统与远程 SMTP 系统之间建立连接。SMTP 是互联网上交换电子邮件的标准协议。\n\
  \n这些服务的每一个都可以独立启动或停止。IIS 通过服务器管理器“工具”菜单中的信息服务程序进行管理。图 17-3 显示了信息服务（IIS）管理器窗口。\n\n\
  ![](img/line.jpg)\n![image](img/fig17-3.jpg)\n![](img/line.jpg)\n**图 17-3.** 信息服务管理器提供了管理服务。\n\
  \n# 理解远程桌面服务\n\n远程桌面服务（以前称为 Windows 服务）可能是本章讨论的最强大的服务之一。使用远程桌面服务，你可以让 Windows Server\
  \ 2012 服务器像大型机一样工作——计算机可以连接到虚拟桌面，且所有工作都在中央计算机上完成（在这种情况下，中央计算机将是 Windows Server 2012\
  \ 计算机）。\n\n客户端使用 TCP/IP 连接（通过局域网 (LAN) 或广域网 (WAN））连接到远程桌面服务器并登录。从那时起，客户端仅负责显示屏幕和接受键盘鼠标输入——所有工作实际上都是通过在服务器上创建虚拟机完成的。远程桌面服务器可以创建许多虚拟机，每个虚拟机都执行自己的任务并运行自己的程序。\n\
  \n何时使用网络远程桌面连接而不是远程节点连接（例如通过 RRAS 提供的远程节点连接）？答案取决于多个因素，包括：\n\n*   **资源不足**：远程计算机没有足够的资源运行某些应用程序或执行某些任务。通过在远程桌面服务器上运行程序，远程计算机可以利用远程桌面服务器的资源。例如，假设某个应用程序在具有\
  \ 16GB RAM 时运行最佳。具有 4GB RAM 的 Windows 7 客户端可以连接到远程桌面服务器（例如有 64GB RAM）并运行该程序。同样，某些应用程序可能需要许多处理器或直接访问磁盘阵或其他中央资源，而远程桌面服务器访问这些资源的速度更快。\n\
  *   **低带宽连接**：在低带宽连接（如低速 DSL 连接）上，某些应用程序使用远程控制方法比远程节点方法有效得多（这些方法在第 8 章中解释）。大多数远程访问连接都是低带宽的，但某些应用程序需要高带宽才能正常工作。由于连接到远程桌面服务器的远程计算机只需要传输显示和输入信息，远程桌面服务器上运行的应用程序比通过远程节点连接运行时快得多。\n\
  *   **需求密集型应用程序**：某些应用程序和任务（如 Windows Server 2012 的管理）无法由另一台计算机完全完成，即使其连接速度达到 LAN。如果计算机具有适当权限，远程桌面服务允许远程计算机运行此类应用程序。例如，假设你的公司在亚洲某地有一个远程网络，但该网络规模不足以支持一名本地管理员。使用远程桌面服务，你可以通过公司\
  \ WAN 连接到该网络并执行必要的管理任务，如配置硬盘、共享、其他网络协议等。\n\n\n\n\n\n| ![image](img/common.jpg) |\
  \ **注意** 如果你实施远程桌面服务，请务必仔细检查微软的许可协议和定价模型，这些模型在运行远程桌面服务时会有所不同。 |\n\n## 章节总结\nWindows\
  \ 服务器家族（包括 Windows Server 2012）可能是当今可用最丰富的网络操作系统环境。虽然其他产品也可以完成本章描述的所有任务，但没有一个产品是开箱即用包含所有这些功能的；需要额外购买。由于\
  \ Windows Server 2012 的功能非常丰富，你可以更轻松地组出一台服务器来满足你可能需要的任何需求。而且由于各种 Windows Server\
  \ 2012 服务之间的协作非常出色，你可以轻松地在单台服务器上实现几乎所有的这些高级服务！\n\n这种开箱即用的灵活性和易于管理的特性是 Windows 网络操作系统获得市场领先份额的原因两个，这也是为什么我们确信\
  \ Windows Server 2012 将继续这一趋势的原因。\n\n尽管 Windows 服务器可能运行着大多数公司的大多数服务器，但另一个流行的选择是运行\
  \ Linux 的服务器。在接下来的三个章节中，你将学习安装和管理 Oracle Linux，以及在 Oracle Linux 安装下安装 Apache Web\
  \ 服务器。![image](img/common4.jpg)\n\n| **第 18 章** | ![image](img/line-1.jpg) | **安装\
  \ Linux** |\n\n![image](img/common5.jpg)![image](img/line1.jpg)\nLinux 成功的关键因素之一是安装工具的显著改进。多年前是一个令人生畏的过程，现在已变得几乎微而易举。\n\
  \n大多数安装 Linux 的默认配置已经具备创建服务器的能力。遗憾的是，这是由于一个略显幼稚的设计决策：服务器提供所有服务，从磁盘服务到邮件。通常，所有这些服务从开始就会开启（取决于你使用的发行版以及它是作为工作站还是服务器安装的）。如你所知，大多数服务器专门用于执行一或两个任务，任何其他安装的服务只会占用内存并减慢性能。\n\
  \n本章讨论了与服务器相关的 Oracle Linux 安装过程。该过程有两个目标：将服务器与客户端工作站区分开来，并根据服务器的专用用途简化服务器的操作。\n\
  \n你可能会奇怪，在所有可用的 Linux 发行版中，我为什么选择关注 Oracle 的 Linux。答案很简单：Oracle Linux 非常受欢迎，与 Red\
  \ Hat Linux 兼容，并提供企业级使用的支持合同和其他高级功能。此外，它既受欢迎在技术上也是稳健的。它对许多不同类型的用户都很友好，并适用于许多用途。（整个发行版都可以从互联网免费获取也是一个加项！）随着你对\
  \ Linux 的经验越来越丰富，你可能会发现其他发行版很有趣并应该研究它们。毕竟，各地 Linux 用户的口号之一就是选择自由至关重要。你不应该觉得自己被锁死在一个专有系统中。\n\
  \n## 为 Linux 配置计算机硬件\n在进入实际安装阶段之前，你需要考虑运行该系统的硬件，以及如何配置服务器以提供你所需的服务。让我们从检查硬件问题开始。\n\
  \n### 硬件兼容性\n与任何操作系统一样，在开始安装过程之前确定哪些硬件配置可用是明智的。每个商业供应商都会发布一份兼容硬件列表并在网站上提供。请确保获取这些列表的最新版本，以便确认供应商完全支持你正在使用的硬件。通常情况下，大多数基于\
  \ Intel 的配置都能顺利运行。对于 Oracle Linux，你可以在 [`linux.oracle.com/hardware-certifications`](http://linux.oracle.com/hardware-certifications)\
  \ 检查认证硬件。Red Hat 的认证硬件列表位于 [`bugzilla.redhat.com/hwcert`](http://bugzilla.redhat.com/hwcert)。对于\
  \ Novell 的 SUSE Linux，你可以在 [`developer.novell.com/yessearch/Search.jsp`](http://developer.novell.com/yessearch/Search.jsp)\
  \ 查询兼容性。![](img/line1.jpg)\n\n| ![image](img/common.jpg) | **提示** 一些制造商销售预装 Linux\
  \ 的电脑。当你购买此类电脑时，通常可以确信制造商已确保硬件与已安装的 Linux 版本完全兼容，并且适当的 Linux 驱动程序已加载并正常工作。 |\n\n\
  \n\n\n\n适用于所有操作系统的通用建议是避免使用尖端的（bleeding-edge）硬件和软件配置。虽然这些配置看起来很高级，但它们还没有经过某些稍旧的硬件所经历的成熟过程。对于服务器来说，使用尖端配置的诱惑通常不是问题，因为服务器不需要最新最先进的玩具，例如华丽的显卡。毕竟，主要目标是为网络用户提供一个高可用服务器，而不是玩最新的游戏。\n\
  \n## 服务器设计\n\n当一个系统变成服务器时，其稳定性、可用性和性能就是重大问题。这三个问题通常通过购买更多硬件来解决，这非常遗憾。如果通过对现有硬件进行微调就能达到所需的性能水平，却额外花费数千美元获得一个能够实现这三个目标的系统，那是浪费。在\
  \ Linux 中，在不超支的情况下实现这些目标并不困难。更好的是，其收益是惊人的！\n\n在管理服务器配置时，你做出的最重要的设计决策不是技术性的，而是管理性的。你应该设计一个服务器*不要*对普通用户友好。这意味着不需要任何可爱的多媒体工具、声卡支持或华丽的\
  \ 浏览器（在可能的情况下）。事实上，你的组织应该制定一项规定，严禁随意使用服务器。这项规则不仅适用于站点用户，也应适用于站点管理员。\n\n设计服务器的另一个重要方面是确保它有一个良好的环境。作为系统管理员，你必须通过将服务器放在独立的、物理安全的房间内来确保服务器的物理安全。非管理人员人员访问服务器的唯一途径应该是网络。服务器房本身应该通风良好、凉爽并锁。未能确保这种物理环境将导致事故的发生。系统过热以及那些“自认为”知道如何修复问题的热心用户，对服务器稳定性的危害可能与糟糕软件一样大（甚至认为更大）。此外，Linux\
  \ 在命令行提示符处特别容易受到黑客攻击。\n\n一旦系统在锁门后得到了良好的保护，安装电池备份也至关重要。这种备份有两个关键用途。第一个目的是在断电期间保持系统运行，以便能够优雅地关机，从而避免任何文件的丢失。第二个目的是确保电压尖峰、波动和电气“噪声”不会干扰系统的健康。\n\
  \n为了改善你的服务器状况，你可以采取以下具体行动：\n\n![image](img/box.jpg)\n\n- 利用图形用户界面（GUI）与核心操作系统解耦的特性，除非有人需要坐在控制台上运行应用程序，否则避免启动\
  \ GUI。毕竟，系统的 GUI 与任何其他应用程序一样，需要内存和中央处理器（CPU）时间来工作，而这两者最好都留给服务器进程。\n\n![image](img/box.jpg)\n\
  \n- 确定你想要服务器执行哪些功能，并禁用所有其他功能。未使用的功能不仅浪费内存和 CPU 时间，它们还是你需要解决的另一个安全问题。\n\n![image](img/box.jpg)\n\
  \n- Linux 与其他某些操作系统不同，它允许你选择内核中你需要的特性。你获得的默认内核已经调优得相当好，所以你不需要调整它。不过，如果你确实更改某个功能或升级内核，请对添加和删除的内容进行挑剔。在包含某个功能之前，确保你确实需要它。\n\
  \n## 服务器运行时间\n\n所有关于照顾服务器和确保错误不会导致其崩溃的讨论都源于一种 UNIX 哲学：*运行时间是好。运行时间越长越好*。\n\n`uptime`\
  \ 命令告诉用户系统自上次启动以来运行了多久，当前有多少用户登录，以及系统承受了多少负载。后两个统计数据是日常系统健康和长期规划的必要衡量。例如，如果服务器负载一直保持在高位，你应该考虑一台性能更强的服务器。\n\
  \n但最重要的数字是服务器自上次重启以来运行了多久。长时间的运行时间是妥善照顾、维护以及从实际角度来看系统稳定性的标志。你经常会发现 UNIX 管理员像汽车迷吹嘘马力一样，吹嘘他们服务器的运行时间。这种对运行时间的关注也是为什么你听到\
  \ UNIX 管理员对每一个细微更改都需要重启的 Windows 安装大不口的原因。相比之下，你很难找到任何需要重启才能生效的 UNIX 系统更改。\n\n##\
  \ 双启动问题\n\n如果你是 Linux 的新手，你可能还没有准备好为了“试驾”而投入使用整个系统。因为构建 Linux 的人理解我们生活在一个异构世界中，所以所有的\
  \ Linux 发行版都设计为可以安装在硬盘的独立分区上，而不影响其他分区。通常，这意味着 Microsoft Windows 可以与同样运行 Linux 的计算机上共存。此外，许多\
  \ Linux 发行版可以从可启动的“现场”CD 光盘运行，这让你能够运行功能完备的 Linux 发行版，而不影响计算机上已安装的操作系统。如果你喜欢这个 Linux\
  \ 发行版，通常可以在现场 CD 环境中运行一个简单的程序，将该发行版安装到硬盘上。\n\n由于本章的重点是服务器安装，所以本节不会涵盖构建双启动系统的细节。任何在磁盘上创建分区有一定经验的人都应该学会如何构建这样的系统。如果你遇到困难，可以参考发行版附带的安装指南或许多\
  \ Linux 入门指南之一。\n\n要对已安装了 Windows 的系统进行重新分区而不重新格式化磁盘并从头开始，你可以使用分区管理软件。\n\n## 安装\
  \ Oracle Linux\n\n本节描述了如何在独立系统上安装 Oracle Linux（版本 6.4）。本节对该过程采用了简单的方法，重点是以后桌面配置安装系统，这样你就可以获得\
  \ GUI 和用户程序供你的 Linux 探索。不过，别担心；特定的服务器程序（如 Apache）可以添加到其中，系统在各方面仍然作为服务器运行。\n\n在开始实际安装程序之前，你需要决定将如何运行安装程序。\n\
  \n## 选择安装方法\n\n随着局域网和互联网连接连接性和速度的提高，日益受欢迎的选项是通过网络进行安装，而不是使用本地 DVD-R。在安装大量主机时，网络安装是一个极大的便利。\n\
  \n![](img/line1.jpg)\n\n| ![image](img/common.jpg) | **提示** | 在 UNIX（或 Linux）术语中，*主机*（host）是指网络上的任何计算机，无论该计算机是作为某种服务器还是作为工作站运行。\
  \ |\n\n\n\n\n通常，服务器安装并不适合自动化，因为每台服务器通常都有独特的任务，因此配置也略有不同。例如，一个专门用于处理通过网络发送的日志信息的服务器，将为适当的日志目录设置特别大的分区。这与不进行自身日志记录的文件服务器形成对比。\n\
  \n由于服务器通常不是使用“一刀切”的方法设置的，本节的重点将完全是从 DVD-R 安装系统的技术。一旦你完成过一次从 DVD-R 的安装过程，就会发现执行基于网络的安装将非常简单。\n\
  \n## 开始安装\n\n通常，你将通过下载 Oracle Linux 副本并将其刻录 DVD-R 上开始安装。以下是安装该副本的步骤：\n\n1. 要开始安装过程，请从\
  \ DVD-R 启动。这将以安装模式启动 `Oracle Linux`，如图 18-1 所示。\n   ![](img/line.jpg)![image](img/fig18-1.jpg)![](img/line.jpg)\n\
  \   **图 18-1.** 以安装模式启动的 Oracle Linux\n2. 使用方向键或按 `I` 键从菜单中选择“Install or upgrade\
  \ an existing system”（安装或升级现有系统）。这将启动 `Oracle Linux` 安装程序。\n3. 系统提示测试你的安装介质。由于在下载或刻录\
  \ DVD 盘的过程中可能会发生错误，你应该执行此操作。在 `OK` 按钮高亮时按回车键测试介质。\n4. 接下来，你将看到安装程序的启动界面。点击 `Next`（下一步）按钮继续。\n\
  5. 系统提示选择安装时使用的语言。默认选择英语（English）。点击 `Next` 继续。\n6. 现在提示你选择合适的键盘布局。默认选择美国英语（U.S.\
  \ English）。点击 `Next` 继续。\n7. 接下来，系统提示你将将用于安装的存储设备类型，如图 18-2 所示。你可以选择“Basic Storage\
  \ Devices”（基础存储设备，包括硬盘）或“Specialized Storage Devices”（专用存储设备，包括廉价磁盘冗余阵列 `RAID`、存储区域网络\
  \ `SANs` 以及其他企业级存储设备）。选择 `Basic Storage Devices` 并点击 `Next` 继续。\n   ![](img/line.jpg)![image](img/fig18-2.jpg)![](img/line.jpg)\n\
  \   **图 18-2.** 选择你将使用的存储设备类型\n8. 安装程序现在将扫描计算机的存储设备。你将看到一个警告对话框，说明如果继续，存储设备将被覆盖，其上的任何数据都将丢失。在确保系统中没有需要保留的数据后，点击\
  \ `Yes` 按钮丢弃任何数据。\n9. 系统提示以 `computer_name.domain*` 的格式命名计算机，如图 18-3 所示。为你的计算机输入合适的名称，然后点击\
  \ `Next` 继续。\n   ![](img/line.jpg)![image](img/fig18-3.jpg)![](img/line.jpg)\n \
  \  **图 18-3.** 为计算机命名\n10. 选择你所在的时区，如图 18-4 所示。你可以点击地图直到定位到你处于同一时区的城市，或者也可以从下拉菜单中的可用选项中进行选择。选择时区后，点击\
  \ `Next` 继续。\n    ![](img/line.jpg)![image](img/fig18-4.jpg)![](img/line.jpg)\n\
  \    **图 18-4.** 选择时区\n11. 系统提示为系统的 `root account` 输入密码，该账户是一个名为 `root` 的用户，具有更改系统任何内容的完全且完整的访问权限。这类似于\
  \ Windows 服务器上的管理员密码。因此，你应该为 `root account` 选择一个良好且强力的密码。在提示处输入密码，并在确认字段中再次输入。点击\
  \ `Next` 继续。\n12. 你现在需要为计算机划分硬盘分区。此示例假设你正在带有空白硬盘的系统上安装 `Oracle Linux`。你将在图 18-5\
  \ 所示的整体分区菜单中看到许多可选择的选项。对于此示例，选择 `Use All Space`（使用所有空间），这将清除硬盘并为 `Linux` 设置好它。\n\
  \    ![](img/line.jpg)![image](img/fig18-5.jpg)![](img/line.jpg)\n    **图 18-5.**\
  \ 选择分区方法\n13. 如果你想查看默认分区方案，请在点击 `Next` 继续之前勾选 `Review And Modify Partitioning Layout`检查并修改分区布局）复选框。图\
  \ 18-6 显示了 12GB 磁盘上的默认分区方案示例。\n    ![](img/line.jpg)![image](img/fig18-6.jpg)![](img/line.jpg)\n\
  \    **图 18-6.** 12GB 磁盘的默认分区方案\n    ![](img/line1.jpg)\n\n| ![image](img/common.jpg)\
  \ | **注意** | 虽然 Oracle Linux 安装程序允许你以多种方式自定义分区方案，但对于大多数用途，默认选择效果最好。如果你决定为生产环境安装\
  \ Linux，你将希望探索分区中的其他选项，例如设置 RAID 磁盘阵列。 |\n\n\n\n\n\n14. 在确认了所选择的分区方案创建后，你将看到一个菜单，从中可以选择你想要执行的安装类型，如图图\
  \ 18-7 所示。如果你是对不需要 GUI 界面的生产系统进行安装，将从各种服务器类型的安装中选择。然而，由于你正在设置一个既可以使用 GUI 又能执行服务器任务的系统，请从列表中选择\
  \ `Desktop`，然后点击 `Next` 继续。![](img/line.jpg)![image](img/fig18-7.jpg)![](img/line.jpg)\
  \ **图 18-7.** 选择桌面安装类型\n\n此时，`Oracle Linux` 将被安装到硬盘上。通常情况下，该过程非常快，大约需要五到十分钟。完成后，系统会提示你重启。系统重启后，你将需要按照下一节的描述进行一些初始配置。\n\
  \n## 初始配置 Oracle Linux\n\n当你的新 `Oracle Linux` 系统在主安装完成后首次启动时，系统将引导你完成各种初始配置选项。最初，你将看到如图\
  \ 18-8 所示的屏幕。左侧面板列出了基本配置区域![](img/line.jpg)![image](img/fig18-8.jpg)![](img/line.jpg)\
  \ **图 18-8.** 初始配置 Oracle Linux\n\n以下是完成 `Oracle Linux` 初始配置的步骤：\n\n1. 首先，系统提示你接受软件许可。正如你所读到的，使用、复制或修改\
  \ `Oracle Linux` 代码没有任何限制。然而，对代码的重新发行、`Oracle` 商标的使用以及其他事项存在限制。\n2. 接下来，系统将提示配置软件更新。你安装时的网络连接可能尚未生效。如果是这样，请跳过此步骤并点击\
  \ `Forward`。（你可以以后再设置）。\n3. 系统提示你创建一个用户账户，如图 18-9 所示。除非绝对需要，否则应避免使用 `root` 账户。相反，请为自己创建一个供使用的用户账户，即使你是该系统的唯一使用者![](img/line.jpg)![image](img/fig18-9.jpg)![](img/line.jpg)\
  \ **图 18-9.** 创建你的非管理用户账户\n4. 检查系统的时间日期，如图 18-10 所示。如果这台计算机不连接互联网，请根据需要更新时间和日期。否则，勾选\
  \ `Synchronize Date And Time Over The Network` 复选框，然后点击 `Forward`![](img/line.jpg)![image](img/fig18-10.jpg)![](img/line.jpg)\
  \ **图 18-10.** 调整系统的日期和时间\n5. 最后，系统提示你选择是否启用 `Kdump`，它会在后台收集系统状态信息并创建一个用于诊断可能发生的任何崩溃的转储文件。`Kdump`\
  \ 在运行时会一直占用系统的一些随机内存（RAM）。对于生产服务器，启用此选项是好的。但如果你是为了自己的学习目的而设置系统，可能不需要启用此功能。根据你的喜好做出任何选择，然后点击\
  \ `Finish` 完成配置。\n\n## 登录 Oracle Linux\n\n完成配置后，你将看到 `Oracle Linux` 的正常登录界面，如图 18-11\
  \ 所示。此屏幕将显示系统上所有可用的普通账户。如果你遵循了本章概述的步骤，你将只有一个用户账户（默认未显示的 `root` 账户之外![](img/line.jpg)![image](img/fig18-11.jpg)![](img/line.jpg)\
  \ **图 18-11.** 登录 Oracle Linux\n\n要选择账户登录，双击登录屏幕上的名称。系统会提示输入密码。成功登录后，你将看到 `Oracle\
  \ Linux` 桌面。\n\n在你的安装中，网络连接可能尚未启用。如果没有启用（参见图 18-12），你可以通过点击标题栏中的网络图标（两个重叠电脑旁边有一个红色的\
  \ `X`）快速启用它，并从出现的菜单中选择 `System eth0`。红色 `X` 将片刻后消失，表示系统的网络连接现在处于激活状态![](img/line.jpg)![image](img/fig18-12.jpg)![](img/line.jpg)\
  \ **图 18-12.** Oracle Linux 桌面\n\n## 你大功告成了！\n\n就这样！安装过程结束了。建议你花时间探索 `Oracle Linux`\
  \ 的菜单和各种功能。请记住，如果你进行了了对全局有效且被视为系统管理级的更改，系统将提示你输入安装期间设置的 `root` 密码。对于重要的系统更改提示 `root`\
  \ 密码，是大多数 Linux 发行版确保更改是由有效的系统管理员执行的，而不是某个通过网络远程连接到计算机的随机人员执行。\n\n## 如果它就是无法正常工作\n\
  \n你已经过了安装程序，也许运行了多次。这本书说它应该行。安装手册说它应该行。你上周交流的 Linux 大师也说应该行。但它就是不行。\n\n用 Douglas\
  \ Adams 不朽的话说：“不要慌！”没有任何操作系统是 100% 顺利安装的。（是的，即使是 Mac OS 也不是！）硬件并不总是如广告所示，硬件组合之间可能会冲突，或者你朋友为你刻录的\
  \ DVD-ROM 有错误。（记住，朋友为你刻录大多数 Linux 发行版的副本是合法的！）或者，正如你所希望的那样，软件存在 Bug。\n\n对于 Linux，你可以通过几种途径寻求帮助。如果你购买了\
  \ `Oracle` 的支持合同，可以拨打他们的技术支持热线，与专业的专士交流并共同解决问题。如果你没有购买支持合同，大多数 Linux 发行版都有丰富的在线帮助。\n\
  \n对于 `Oracle Linux`，你可以在 [www.oracle.com/technetwork/server-storage/linux/overview/index.html](http://www.oracle.com/technetwork/server-storage/linux/overview/index.html)\
  \ 许多帮助文档，包括讨论论坛。\n\n## 章节总结\n\n在本章中，你学习了安装一种流行且强大的 Linux 发行版的过程。安装 `Oracle Linux`\
  \ 的步骤非常简单。如果你曾见过以前版本的步骤，你就会意识到过程变得简单了多少，开始使用操作系统之前需要做的配置选择少了。Linux 的奇妙之处在于，尽管这些选项不再是安装过程的一部分，一旦你完成安装并启动系统，你仍然可以根据自己的喜好对其进行更改和调整。\n\
  \n下一章将基于此处安装的系统继续，并向你展示如何在 `Oracle Linux` 中执行基本的管理任务![image](img/common4.jpg)\n\n\
  | **第 19 章** | ![image](img/line-1.jpg) | **Linux 系统管理简介** |\n\n\n\n\n\n![image](img/common5.jpg)![image](img/line1.jpg)\n\
  \n当 Linux 在 1991 年刚世，你必须是一个有大量时间的系统管理员，或者是一个出色的黑客，才能有效地使用该系统。虽然对于愿意付出努力的人来说这没问题，但对于大多数看到了\
  \ Linux 潜力但又望畏学习曲线的人来说，这并不理想。幸运的是，许多 Linux 发行版开发人员已经意识到这一缺点，并付出了巨大努力让 Linux 不仅易安装，而且管理也相对轻松。\n\
  \n本章概述了保持 Linux 服务器顺畅运行所需的某些基本管理工作。虽然这绝不是系统管理的完整指南，但本章将引导你进入正确的方向。本章假设你已经安装了 Oracle\
  \ Linux 并配置了图形用户界面。本章还假设你正以 `root` 用户登录系统并运行所有程序。\n\n![](img/line1.jpg)\n\n| ![image](img/common.jpg)\
  \ | 注意 `root` 用户在 Linux 下是无所不能的。如果你熟悉 Windows 服务器，可以将 `root` 认为等同于管理员账户。有了 `root`\
  \ 权限，你对系统拥有完全控制权，包括破坏它的能力。如果你是 Linux 新手，在对你的系统用户进行尝试之前，一定要花些时间在非生产系统上进行练习。 |\n\n\
  本章分为两个主要部分。第一部分涉及使用图形工具配置 Oracle Linux 的系统管理功能。第二部分涉及命令行界面。虽然这一部分本身不是关于系统管理，但它涵盖的命令是基本系统管理任务的基础。\n\
  \n## 使用图形工具管理 Oracle Linux\n\n图形化工具是你需要执行的大多数管理任务的基础。它们处理用户管理、网络管理、磁盘管理等。这些工具特别有用的之处在于，它们为\
  \ Linux 管理任务提供了非常一致的界面。唯一的缺点是，与其他图形用户界面（GUI）一样，这些工具具有局限性。你可能会发现，对于更高级的任务，你需要使用本章后面提到的命令行界面。\n\
  \n## 管理用户\n\n为了利用 Linux 的多用户特性，你能够在系统中添加、编辑和删除用户。你可以通过以下用户管理器程序执行所有这些操作：\n\n1. 打开系统菜单，选择\
  \ `Administration`（管理），然后选择 `Users And Groups`（用户和组）。在提示输入系统 `root` 密码后，你将看到所示图\
  \ 19-1 中的用户管理器窗口。![](img/line.jpg)![image](img/fig19-1.jpg)![](img/line.jpg) **图\
  \ 19-1.** 用户管理器处理用户管理。\n2. 点击窗口顶部工具栏上的 `Add User`（添加用户）按钮，打开 `Create New User`（创建新用户）对话框，所示图\
  \ 19-2 所示![](img/line.jpg)![image](img/fig19-2.jpg)![](img/line.jpg) **图 19-2.**\
  \ 创建新用户\n3. 在 `Create New User` 对话框中，你至少必须填写用户的登录名和密码。用户的家目录和 shell 类型将自动填充，你可以接受那些默认选项。点击\
  \ `OK` 创建用户账户。![](img/line1.jpg)\n\n| ![image](img/common.jpg) | 提示如第 9 章 所示，选择一个好的密码意味着不要使用字典单词（包括外语单词）。一种技巧是取短语中每个单词的首字母。例如，“Snacking\
  \ on Oatmeal Squares is good for you”翻译为 `SoOSigfy`。这个短语很容易记忆，而生成的密码很晦涩。另一种策略是取一个六字母或以上的单词，用两个或多个字母替换为数字。例如，密码\
  \ `le11ers`（用 1 代替字母 `l`）不是一个坏密码。但请注意，复杂的密码破解程序通常会尝试对字典单词进行此类数字替换。 |\n\n\n\n\n\n\
  账户创建后，你可以在用户帐户列表中双击该账户，通过 `User Properties` 对话框为账户设置一些额外属性，如图图 19-3 所示：![](img/line.jpg)![image](img/fig19-3.jpg)![](img/line.jpg)\
  \ **图 19-3.** 设置用户属性![image](img/box.jpg)\n\n`User Data` 标签页允许你更改用户的用户名、密码、主目录和登录\
  \ shell。![image](img/box.jpg)\n\n`Account Info` 标签页允许你为用户设置账户过期日期，并在由于任何原因时锁定用户账户。![image](img/box.jpg)\n\
  \n`Password Info` 标签页允许你为所选的用户账户设置密码过期设置。![image](img/box.jpg)\n\n`Groups` 标签页允许你为所选的用户账户分配安全组成员身份。\n\
  \n要删除用户，在主 `User Manager` 窗口中，选择要删除的用户账户，然后点击工具栏上的 `Delete` 按钮。\n\n### 更改 root 密码\n\
  如前面的章节所述，`root` 用户是一个在系统中拥有巨大权限的特权用户。显然，一个拥有如此权限的账户需要良好的密码来保护。如果你认为有人可能获取了 root\
  \ 密码，或者曾经拥有 root 密码的人不应再拥有它（例如，离职员工），你应该立即更改它。\n\n要更改系统的 root 密码，首先确保你已以 `root`\
  \ 身份登录系统。然后，从应用程序菜单选择 `System Tools`，然后选择 `Terminal`。这将在桌面上打开一个终端窗口。输入命令 `passwd`\
  \ 并按回车，然后按照提示更改 root 密码。图 19-4 展示了这一更改过程。如果两个条目不完全匹配，程序将不允许你更改 root 密码。（记住 Oracle\
  \ Linux 与所有 UNIX 操作系统一样，密码是区分大小写的。）点击 OK 完成更改。![](img/line.jpg)![image](img/fig19-4.jpg)![](img/line.jpg)\
  \ **图 19-4.** 更改 root 密码\n\n### 配置常用网络设置\nLinux 在网络环境中非常游刃有余。事实上，它从设计之初就支持在网络中使用。网络是动态的，Linux\
  \ 可以轻松更改网络配置以适应任何变化。\n\n你通过 `Network Connections` 对话框管理网络设置，如图图 19-5 所示。要访问此对话框，打开\
  \ `System` 菜单，选择 `Preferences`，然后选择 `Network Connections`。(images/line.jpg)![image](img/fig19-5.jpg)![](img/line.jpg)\
  \ **图 19-5.** 使用 Network Connections 对话框更改网络配置。\n\n### 更改你的 IP 地址\n在大多数情况下，如果系统配置为使用动态主机配置协议（DHCP）获取\
  \ IP 地址，你不应该更改 IP 地址设置。然而，有时你需要在系统中设置静态 IP 地址。要更改系统的 IP 地址，在 `Network Connections`\
  \ 对话框中选择你正在使用的 `Ethernet` 接口，并点击 `Edit` 按钮。在弹出的对话框中，选择 `IPv4 Settings` 标签页，这将弹出\
  \ `Ethernet Device` 对话框，如图图 19-6 所示。(images/line.jpg)![image](img/fig19-6.jpg)![](img/line.jpg)\
  \ **图 19-6.** 更改以太设备设置\n\n点击 `Method` 按钮并选择 `Manual`。然后点击 `Add` 按钮，并在对话框的 `Addresses`\
  \ 区域输入相应的 IP 地址信息。完成所有选择后，点击 OK 接受更改。\n\n### 掌握 Linux 命令行基础\n从历史上看，UNIX 强大且灵活的方面是通过命令行提供的选项。UNIX\
  \ 大师的偶然观察者往往会对少数几个精心输入的命令就能产生强大的操作感到惊讶。遗憾的是，这种力量是以牺牲易用性为代价的。出于这个原因，GUI 泛滥并已成为许多工具的事实标准。\n\
  \n然而，随着你经验的增加，你会发现 GUI 很难向用户展示所有可用选项，因为这样做会让界面变得与命令行等界面一样复杂。因此，GUI 保持了过度简化，而经验用户则需要求助于命令行。(images/line1.jpg)\n\
  \n| ![image](img/common.jpg) | *提示* | 在与人陷入“哪种界面更好”的圣战之前，请记住两种类型的界面都有其用途，各自都有缺点和优点。最终，选择精通两者的的人将胜出。\
  \ | |\n\n\n\n\n\n本节涵盖了日常工作中至关重要的某些 Linux 命令行工具。本节中讨论的所有命令都将在终端窗口中执行。你可以通过打开“应用程序”菜单，选择“系统工具”，然后选择“终端”来打开终端窗口。该窗口显示类似于\
  \ `[root@*hostname* /root]#` 的提示符，其中 `hostname` 是你的机器名称。\n\n## 命令行工作\n转向 Linux 命令行界面的困难之一（特别是习惯于使用\
  \ `cmd.exe` 等 Windows 命令行工具的用户），在于要处理一个拥有大量快捷键的 shell，如果你不小心，这些快捷键可能会让你感到惊讶。本节将回顾这些快捷键中最常用的。\n\
  \n### 文件名扩展\n在如 `bash` 等基于 UNIX 的 shell 中，你会在将通配符作为参数传递给应用程序*之前*，对命令行上看到的通配符进行扩展。这与基于\
  \ DOS 的工具的默认运行模式形成鲜明对比，后者工具通常需要执行自己的通配符扩展。这意味着你必须在使用通配符字符的地方保持小心。\n\n通配符字符本身与 `cmd.exe`\
  \ 中的相同。星号（`*`）匹配所有文件名，问号（`?`）匹配单个字符。如果你需要将这些字符作为另一个参数的一部分，可以在它们前面放置一个反斜线（`\\`）来对其进行“转义”。该字符将导致\
  \ shell 将通配符解释为普通字符。\n\n### 环境变量作为参数\n你可以将环境变量作为命令行上的参数。这意味着发布参数 `$FOO` 将导致传递 `FOO`\
  \ 环境变量的值，而不是字符串“$FOO”。\n\n### 多条命令\n在 `bash` shell 下，可以通过分号（`;`）分隔多个命令，从而在同一行执行它们。例如，假设你想在一行中执行以下命令序列：\n\
  ![image](img/p311-01.jpg)\n你也可以输入以下内容：\n![image](img/p311-02.jpg)\n\n### 反引号\n这种操作*很妙吧*：你可以让一个程序的输出成为另一个程序的参数。听起来很诡异？好吧，是时候习惯它了——这是所有\
  \ UNIX shell 中极具创造性的使用功能之一。\n\n反引号（`` ` ``）允许你将命令作为参数嵌入其他命令中。该字符的一个常见用法是将文件中的数字作为参数传递给\
  \ `kill` 命令。这种情况典型实例发生在名为 *named* 的 DNS 服务器上。当此服务器启动时，它会将进程标识码写入文件 `/var/run/named.pid`。因此，杀死\
  \ `named` 进程的通用方法是使用 `cat` 命令查看 `/var/run/named.pid` 中的数字，然后使用该值发布 `kill` 命令，如下例所示：\n\
  ![image](img/p311-03.jpg)\n\n用这种方法杀死 `named` 进程的一个问题是，你无法实现自动化杀死，因此你只能依靠人类来读取 `/var/run/named.pid`\
  \ 中的值然后杀掉该进程号。第二个问题与其说是个问题，不如说是一个麻烦——停止域名系统（DNS）服务器需要两个步骤。\n\n然而，使用反引号，你可以将这些步骤合并为一步，并以可以自动化的方式进行。这里是反引号版本：\n\
  ![image](img/p311-04.jpg)\n当 `bash` shell 看到此命令时，它会首先运行 `cat /var/run/named.pid`\
  \ 并存储结果。然后它将运行 `kill` 命令并将存储的结果传递给它——这一切都在一个优雅步骤步骤完成。\n\n### 环境变量\n环境变量的概念在 Linux\
  \ 下与在 Windows 下几乎相同。唯一的区别在于设置、查看和删除变量的方式。\n\n### 打印环境变量\n要列出所有的环境变量，请使用 `printenv`\
  \ 命令，例如所示：\n![image](img/p312-01.jpg)\n要显示特定的环境变量，请将变量指定为 `printenv` 的参数。例如，要查看环境变量\
  \ `USER`，输入以下内容：\n![image](img/p312-02.jpg)\n\n### 设置环境变量\n要设置环境变量，请使用以下格式：\n![image](img/p312-03.jpg)\n\
  其中 `variable` 是变量名，`value` 是你想要赋予变量的值。例如，要设置值为 `BAR` 的环境变量 `FOO`，请输入以下内容：\n![image](img/p312-04.jpg)\n\
  设置值后，使用 `export` 命令最终生效。`export` 命令的格式如下：\n![image](img/p312-05.jpg)\n其中 `variable`\
  \ 是变量名。在设置 `FOO` 的示例中，输入以下内容：\n![image](img/p312-06.jpg)\n你可以将设置环境变量的步骤与 `export`\
  \ 命令结合，如下：\n![image](img/p312-07.jpg)\n如果你要设置的环境变量值包含空格，你需要用引号括起变量。例如，将 `FOO` 设置为“Welcome\
  \ to the BAR of FOO”，输入以下内容：\n![image](img/p312-08.jpg)\n\n### 清除环境变量\n要移除环境变量，请使用\
  \ `unset` 命令：\n![image](img/p313-01.jpg)\n其中 `variable` 是你想要移除的变量。例如，要移除环境变量 `FOO`，输入以下内容：\n\
  ![image](img/p313-02.jpg)\n\n## 文档工具\nLinux 自带了两个使文档易于获取非常有用的工具：`man` 和 `info`。目前，这两个文档系统之间有大量的重叠，因为许多应用程序正在将文档迁移到\
  \ `info` 格式。`info` 被认为优于 `man`，因为它允许文档以类似于网页的方式进行超链接连接，而实际上并非以 HTML 格式编写。另一方面，`man`\
  \ 格式已经存在了几十年。数以千计的工具只有 man 页作为其文档源。此外，许多应用程序继续以 man 格式发布文档，因为许多如 Sun Solaris 等其他类\
  \ Unix 操作系统默认使用 man 格式作为其文档。因此，这两个文档系统在未来很长一段时间内都会存在。强烈建议熟练掌握两者。\n\n### man: 查看\
  \ man 手页\nMan（*manual* 的缩写）页是在网上找到的文档，涵盖工具的用法及其相应的配置文件。`man` 命令的格式如下：\n![image](img/p313-03.jpg)\n\
  其中 `program_name` 是你想要阅读手册的程序名称。这里有一个示例：\n![image](img/p313-04.jpg)\n在阅读关于 UNIX\
  \ 和 UNIX 相关的信息源（如新闻组）时，你可能会发现命令后面跟着括号里的数字的引用，例如 `ls(1)`。该数字代表手册页的*章节*（section）；每个章节涵盖不同的主题领域。章节号对于某些工具非常有用，例如\
  \ `printf`，它既是 C 语言中的命令，也是命令行命令。因此，这样的命令在两个不同的章节下会有两个条目。\n\n要引用特定章节，只需将章节号指定为第一个参数并将命令作为第二个参数。例如，要获取\
  \ C 程序员关于 `printf` 的信息（假设已安装 C 语言手册文件），输入以下内容：\n![image](img/p314-01.jpg)\n要获取命令行信息，输入以下内容：\n\
  ![image](img/p314-02.jpg)\n默认情况下，首先打印最小章节号的手册页。章节号的含义见表 19-1。\n![](img/line.jpg)\n\
