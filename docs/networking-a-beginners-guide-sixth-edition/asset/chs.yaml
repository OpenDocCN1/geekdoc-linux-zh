- "# 网络入门指南，第六版\n\n\n\n![](img/mycover.jpg)\n\n\n\n\n\n\n## 关于作者\n**布鲁斯·哈尔伯格（Bruce\
  \ Hallberg）**拥有 30 年信息技术经验，包括执行管理、系统实施以及为财富 1000 强企业提供全球网络咨询。他编写了 30 多本关于各种计算主题的书籍，包括操作系统、网络以及服务器和桌面应用。他拥有赫里奥·瓦特大学（Heriot\
  \ Watt University）的 MBA 学位，与两个女儿居住在加利福尼亚州的硅谷地区。\n\n## 关于技术编辑\n**史夫·兰福德（Steve Langford）**在多个行业拥有超过\
  \ 17 年的网络管理经验，例如生物技术、化学制造和风险投资。他目前就职于一所私立学校，担任软件升级和新建筑建设的 IT 项目经理。\n\n![image](img/common1.jpg)\n\
  \n![image](img/pub.jpg)\n纽约、芝加哥、旧金山、雅典、伦敦、马德里、墨西哥城、米兰、新德里、新加坡、悉尼、多伦多\n\n\n\n\n\n\
  \n\n## 使用条款\n\n\n**带着我所有的爱，送给 Bonnie Gordon 以及我的两个女儿 Vivian 和 Maxine。**\n\n![image](img/common1.jpg)\n\
  \n## 概览\n![image](img/line.jpg)\n\n\n\n![](img/line.jpg)![image](img/fig3-6.jpg)![](img/line.jpg)\n\
  **图 3-6.** 同轴电缆\n\n光纤电缆使用玻璃纤维并通过光传输数据信号。以前高速网络需要光纤电缆，但这种情况正在发生变化，通常可以使用 `UTP` 或\
  \ `STP`。这是一个好消息，因为光纤电缆的购买、安装和维护极其昂。然而，光纤电缆可以做到铜缆做不到的：跨越极距离。光纤电缆在 `100 Mbps` 下可以轻松达到两英里。由于这个原因，光纤电缆通常用于连接园区中的建筑物。但除了需要跨越非常长的距离外，你应该避免使用光纤电缆。\n\
  \n## 双绞线布线：网络电缆之王\n\n多年来，几乎所有新网络都是使用某种形式的双绞线布线构建的。通常使用 `Cat-5` 级双绞线，尽管你可能会看到一些安装了\
  \ `Cat-3` 级电缆的老网络。在大多数情况下，`UTP` 代替 `STP`，因为它更便宜、更容易安装和维护，而且受电气干扰的影响不大（即使没有屏蔽）。以太网和环形网络都使用双绞线布线。当安装新的双绞线网络时，许多布线组件构成了从工作站到集线器的完整线路。\n\
  \n\n\n\n| ![image](img/common.jpg) | 注意：某些网络接口（例如网络交换机上的接口）可以感知端口连接到外部 DTE 还是 DCE\
  \ 设备，并能自动调整端口作为哪种设备运行，从而消除对交叉线的需求。你必须检查所用交换机的文档以确认情况是否如此，而且有时特定交换机上的所有端口并不支持此。 |\n\
  \n![](img/line1.jpg)\n\n| ![image](img/common.jpg) | 提示：你可以轻松购买制作双绞线/RJ-45 电缆所需的所有工具和零件，如果你管理的网络具有相当规模（超过\
  \ 50 台工作站），你应该这样做。了解如何使用这些工具和零件来制作跳线或更换故障电缆是价值无量的的。通过这种方式，你可以快速制作所需的任何长度的电缆。然而，尽管你本可以这样做，而且它能帮你快速解决燃眉，但购买预制的双绞线/RJ-45\
  \ 电缆用于你的网络会更好。专业制造的电缆更可靠，出现的问题也比你自己制作的要少。仅在紧急情况下再自己制作电缆。 |\n\n## 电缆类别到底是什么？\n\n\
  双绞网络电缆根据其传输网络流量的能力分级。这些分由电子工业联盟（EIA）和电信行业协会（TIA）定义，称为 Level 1 和 Level 2，以及类别 3、4、5\
  \ 和 6。不同的类别级别简单地称为 `Cat-3` 到 `Cat-6`。表 3-3 显示了这些每个级别的额定性能。\n\n![](img/line.jpg)![image](img/tab3-3.jpg)![](img/line.jpg)\n\
  \n**表 3-3.** 双绞线性能标识。在实践中达到特定的性能等级，你不仅需要经过该性能水平认证的电缆，还必须遵守其他要求，包括使用同样符合该性能标准的连接器和跳线。例如，对于\
  \ `Cat-5` 安装，你必须使用 `Cat-5` 电缆、连接器、配线架和跳线。从客户端计算机连接到另一端集线器连接端口的整个电路，都需要根据你需要实现的性能水平进行测试和认证。\n\
  \n## 同轴电缆\n\n一些较旧的网络（约 1992 年之前建立的）仍然安装了同轴电缆。大部分此类同轴电缆是细体，即 `RG-58`，用于细以太网（Thin\
  \ Ethernet）。少少数可能还会使用较粗的 `RG-8` 电缆用于粗以太网（Thick Ethernet），但这非常罕见。\n\n细以太网布线采用总线型布线，每个网络段都从一个连接到电缆末端的终端器开始，依次运行到每个节点，最后在另一端以另一个终端器结束。终端器包含特殊的\
  \ 50 欧姆电阻，除非两端都安装，否则网络电缆将无法工作。\n\n细以太网系统中的所有连接器都是 `BNC` 连接器，这是一种快速释放插拔式连接器，既可靠又于使用。`BNC`\
  \ 连接器有多种样式，使你能够在总线沿创建所需的任何网络连接。T 型连接器在 `T` 型横梁的每侧有一个母头 `BNC` 连接器，在 `T` 型轴的末端有一个公头\
  \ `BNC` 连接器。两个母头连接器用于进入和离开节点的 `RG-58` 电缆，而公头连接到节点网卡上的母头 `BNC` 连接器。桶型接头（Barrel connectors）有两个用于连接两根细以太网线的母头。桶型接头还有不同的形状，包括弯头和\
  \ U 型弯，但通常使用简单的直头接头。章节前面的图 3-2 显示了细以太网 `BNC` 电缆系统的各个部分。\n\n同轴电缆有一个中心*导体*，可以是实心单铜线，也可以是绞股线。白色塑料材料包裹着中心导体，导体外面包裹有一层金属箔，然后是编织线*屏蔽层*。屏蔽层最后包裹在塑料电缆护套中。\n\
  \n## 吊顶与非吊顶电缆\n\n在建筑中，房间天花板与建筑屋顶之间的区域被称为*吊顶空间*（plenum space）。大多数建筑使用风道（大型柔性软管）为房间提供空调空气，并利用开放的吊顶空间作为房间返回空气的通道。通常，从房间返回的空气会被空调单元部分重复以节省能量，因为它们已经根据需要进行了冷却或加热。有时，建筑会使用风道作为返回风，但办公空间的标准仅仅是直接使用开放的吊顶空间。\n\
  \n为什么在关于电缆的章节中讨论办公楼空气处理很重要？因为要在使用吊顶空间作为返回风的建筑天花板上布网络电缆，你必须将电缆安装在特殊的*管道*（conduit\
  \ piping）内（这极其昂贵），或使用吊顶级电缆。非吊顶电缆和吊顶电缆的区别在于，吊顶级电缆使用的塑料在火灾发生时不会产生毒烟雾。由于大多数办公楼重复利用吊顶空间的空气，你最不希望发生的是建筑屋顶或吊顶空间某处起火时，电缆产生有毒烟雾并通过空气处理系统扩散到整个建筑。由于这些通风系统的工作原理，极小区域的火灾可能导致燃烧电缆产生的烟雾扩散到建筑大部分——这绝对是坏事。\n\
  \n确保咨询你的电缆承包商了解安装网络电缆所在市的细节，但在美国几乎所有的当地法规都要求带吊顶风的建筑使用管道或吊顶级电缆。电缆安装人员必须能够处理任何穿越一小时防火等级走廊或建筑防火区的要求的墙体穿孔。这些墙体穿孔必须正确密封，以维持建筑的防火等级。\n\
  \n![](img/line1.jpg)\n\n| ![image](img/common.jpg) | 注意：任何同轴网络中都应禁混合电缆类型。如果网络使用例如\
  \ `RG-58A/U`，那么你必须始终使用它——而不是任何其他同轴电缆。不混合 `RG-58A/U` 和 `RG-58/U` 也是一个好主意，因为它们的信号特性略有不同。（A/U\
  \ 电缆使用绞股线导体，而 /U——有时称为 C/U——使用实心导体。） |\n\n\n\n\n\n借助两种特殊工具，制作带有 BNC 接头的同轴电缆轻而易举。首先，你需要一把剥线器，它可以将电缆的不同部分切割到合适的长度。许多优质剥线器都可以自动完成这项工作；请咨询您的电缆供应商订购一个。你还需要一把压接钳，它可以既将中心\
  \ BNC 针脚压接在电缆的中心导体上，又能压接将整个连接器固定在电缆上的金属护套。同样，你可以购买可以轻松同时完成这两项工作的专用压接钳。最好的压接钳使用棘轮机构，使其更容易施加适当的力量，以实现稳固、可靠的连接。\n\
  \n## 安装与维护网络布线\n\n不仅选择网络电缆类型很重要，布线还必须正确安装。布线系统的安装应包含以下所有内容：\n\n![image](img/box.jpg)\
  \ \n- 适用于该网络类型的合适电缆和连接器，包括所选和使用组件的文档。（这样做是为了让未来向网络添加设备的人员确保与这些选择匹配。）\n\n![image](img/box.jpg)\
  \ \n- 对网络的所有部分进行完整标记，标记应包括墙面板、电缆、配线架端口、跳线和集线器端口分配。这对于故障排除至关重要。\n\n![image](img/box.jpg)\
  \ \n- 建筑竣工图，显示所有布线路径和位置。\n\n![image](img/box.jpg) \n- 认证报告，显示使用特殊的网络电缆测试设备证明所有安装的电缆运行正常。\n\
  \n![](img/line1.jpg)\n\n| ![image](img/common.jpg) | 注意：对于总线型网络，应让用户意识到出于任何原因都不要触摸同轴电缆。如果电缆断开，将导致分段内的所有其他节点失效。确保设施人员也知道这一点。\
  \ |\n\n确保新的布线系统安装妥当且记录良好，从长远来看将为您节省时间。网络将更加可靠，并且更容易维护和维修。\n\n## 选择布线承包商\n\n在构建新网络时，选择布线承包商至关重要。提供高质量、文档完备工作的承包商是理想的，遗憾的是这很难找到。确保你选择的承包商在安装类似于你正在安装的网络类型方面拥有丰富经验。此外，在选择时要评估以下问题：\n\
  \n![image](img/box.jpg) \n- 承包商将如何记录布线系统？承包商的标准是什么，你认为这些文档标准能满足你的需求吗？（记住，布线系统不存在文档记录过多的问题。）\n\
  \n![image](img/box.jpg) \n- 承包商是否会提供一套显示电缆如何在建筑中安装的竣工图？\n\n![image](img/box.jpg)\
  \ \n- 承包商如何安装电缆以避免天花板和墙壁中的电干扰源？\n\n![image](img/box.jpg) \n- 承包商是否推荐将电信布线与数据布线相结合的解决方案？通常情况下，保持这两个布线系统分离是最好的。它们有不同的需求，对各种建筑状况的反应也不同。适用于电话可能可能适用于网络电缆，反之亦然。\n\
  \n![image](img/box.jpg) \n- 承包商是否做过任何你可以访问并查看的本地安装项目？\n\n![image](img/box.jpg) \n\
  - 承包商是否为新的布线点提供快速的安装后支持？这很重要，因为许多专门从事新建布线的承包商并不擅长返回为新节点位置提供偶尔的单点服务。请就这一重要信息索取推荐。\n\
  \n![image](img/box.jpg) \n- 承包商使用什么设备对布线系统进行认证？完成后，承包商将提供哪些认证文档？\n\n![image](img/box.jpg)\
  \ \n- 承包商是否也提供安装后的故障排除服务？\n\n确保花时间寻找你当地最好的电缆承包商并对其进行仔细比较。你可能想联系与你类似的其他公司或当地计算机用户组成员，寻求建议并了解他们与承包商合作的经验。尽量不要只依赖承包商提供的推荐；即使是工作粗糙的公司，通常也能凑出几个不错的推荐。![](img/line1.jpg)\n\
  \n| ![image](img/common.jpg) | 提示：对于大型布线工程，务必协商一个合适的支付计划。你的目标应该是：启动时支付 30%；完成后支付\
  \ 50%；交付竣工图、认证报告和任何其他最终交付物时支付 20%。确保为这些最终交付物保留至少 15% 的款项，以确保电缆承包商及时提供它们。承包商以在布线工作完成后在这些事情上拖延而闻名，因此你需要确保你有办法来激励他们完成所有工作。\
  \ |\n\n\n\n\n\n## 解决电缆问题\n\n电缆问题的诊断和修复可能极其困难。许多电缆问题是间歇性的，或者会导致受影响节点的网络带宽降低。追踪问题的根源可能很困难。有时，你甚至没有意识到电缆出了问题！\n\
  \n网络布线问题通常表现为以下几种形式：\n\n![image](img/box.jpg)\n* 网络性能异常缓慢，特别是当一个节点比其他相似节点慢得多（对于星型拓扑），或者当一个网段上的所有节点性能都低于其他网段的节点时（对于总线型拓扑）\n\
  ![image](img/box.jpg)\n* 网络间歇性断开\n![image](img/box.jpg)\n* 网络连接完全丢失，这可能也是一个间歇性问题。\n\
  \n### 星型网络故障排除\n\n星型网络最容易进行故障排除。因为每个节点都有自己的连接到集线器的独立网络电缆，你通常可以快速地将问题定位到几段电缆上。\n\n\
  如果你在星型拓扑网络的某个节点上遇到问题，首先确定是计算机还是布线出了问题。将计算机移动到建筑物的另一个位置，看看是否还会出现相同的问题。如果问题依旧，那么可以肯定问题出在计算机上，例如\
  \ `NIC` 损坏。\n\n如果计算机在另一个位置的网络性能正常，请尝试更换从节点到墙壁的跳线线。这些电缆在家具或电脑移动过程中，往往会发生轻微的损坏。\n\n\
  接下来，在配线间内，你可以尝试使用不同的跳线线，将节点位置的配线架连接到集线器上的另一个端口。虽然配线间的配线架因为不经常移动而不太可能故障，但它们仍然可能连接不良，或者布线随时间推移而出现问题。\n\
  \n最后，如果你排除了所有其他因素，请考虑更换从配线间到节点位置的电缆。此时，聘请一名专业的网络布线承包商协助你将非常有帮助。承包商拥有设备可以测试墙内的电缆，并在通过建筑内部拉设替换电缆之前确定其是否完好。对于故障排除协助，你预计需要支付约\
  \ 150 美元让承包商上测试一段电缆。如果承包商必须将新电缆一直拉到目标位置，你还需要支付该工作的人工和材料费用。\n\n### 同轴网络故障排除\n\n同轴网络可能很难故障排除，因为许多节点共享同一个网段。通常，网段某部分的问题会类似地影响网段上的所有节点。\n\
  \n到目前为止，同轴网络上最常见的问题是网段内所有节点的网络连接丢失。有人断开了网络电缆导致线路不连续，这无疑会导致这种丢失。查一下谁正在搬到另一个办公室、重新布置办公室、粉刷办公室或在建筑内进行其他类型的工作。问题极有可能就在那里。如果这种方法无效，故障排除工作将变得更加困难。\n\
  \n为了追踪不明显的电缆断路，你可以尝试使用同轴电缆扫描仪。这些是手持仪器，可以连接到同轴网络电缆上，以检测电缆沿何时发生了短路或断路。在不同的位置将电缆扫描仪连接到网络电缆，直到你能追踪到问题为止。\n\
  \n另一种方法是使用额外的网络终端器进行测试。断开特定位置的电缆并接入终端器。看看新的、较小的网段上的计算机是否可以登录服务器（同一网段内必须有一个可用服务器；否则，如果你在计算机上使用\
  \ `TCP/IP` 协议，可以使用 `PING` 命令尝试 `ping` 整个网段中的另一个工作站）。如果它们可以登录，你就知道问题在电缆更远的地方。移动到一个新位置，接入额外的终端器并再次尝试。最终，你会发现两个相邻的位置，终端器允许网络在某一点正常但在下一点不正常。你应该在那两个节点位置之间的某处发现电缆问题。这种方法需要耐心，但在急情况下非常有效。\n\
  \n在同轴网络上，更棘手的是导致网络性能不佳但没有导致任何节点实际上从网络上断开的问题。这类问题通常是间歇性的，并且很难用电缆扫描仪发现。当你遇到这类问题时，最好的方法是进行一项测试，能够快速告诉你节点与网络通信的速度。例如，你可以计时计时从服务器拷贝特定文件所需的时间。接下来，使用终端器封闭网段的大部分并再次测试。不断移动终端器并重试测试，直到你发现电缆的哪部分降低了网段的网络性能。然后，要么替换所有这些部分，要么进一步缩小搜索范围。这类问题通常是由一个公头电缆末端\
  \ `BNC` 接头的连接不良引起的，尽管不稳定的 `T-connector`（T 型接头）或桶型接头也可能是罪魁祸首。只要你将问题缩小到足够小的区域，直接更换该位置的所有电缆和接头是最快的方法。\n\
  \n让第二个人帮助你排除同轴电缆问题的故障会让工作变得容易得多。一个人留在网段一端的固定位置使用测试计算机，另一个人带着终端器在各个位置之间移动。当移动的故障排除人员使用终端器标出网段部分时，固定位置的人可以快速测试网段的任何单个部分是否证明是问题源（通过手机或便携式无线电台通信）。![images/line1.jpg)|\
  \ ![image](img/common.jpg) | **提示** 在费力穿过墙壁拉设一段新电缆或更换各种电缆和接头之前，尝试简单地从一个位置到另一个位置运行额外的电缆，例如从一个房间门出去，经过走廊进入另一个房间。然后测试这种对可疑网段部分的“排查”是否解决了问题。如果是的话，尽管在墙内布设新线吧。如果问题仍然存在，在更换电缆和接头之前你还需要进一步查找。\
  \ |\n\n\n\n\n\n![image](img/common5.jpg)![image](img/line1.jpg)\n\n如果说网络布线构成了网络的神经系统，那么本章讨论的设备就代表了各种器官。这些网络设备——中继器、路由器、集线器等——负责将数据从一根网络电缆传输到另一根电缆。每个设备都具有不同的属性和用途。良好的网络设计会为网络必须完成的每项任务选择正确的设备。\n\
  \n在本章中，你将学习基本的网络硬件，包括：\n\n![image](img/box.jpg)\n- 中继器 (images/box.jpg)\n- 集线器 (images/box.jpg)\n\
  - 集中器 (images/box.jpg)\n- 交换机 (images/box.jpg)\n- 桥接 (images/box.jpg)\n- 路由器 (images/box.jpg)\n\
  - 网关 (images/box.jpg)\n- 防火墙 (images/box.jpg)\n- 短距离连接器 (images/box.jpg)\n- 调制解调器\
  \ (images/box.jpg)\n\n了解这些网络组件如何构建网络至关重要，以及它们各自的功能。\n\n## 引导流量\n\n网络设计的关键在于将流量从一个节点引导到另一个节点。你必须以尽可能有效的方式，将各种设备连接到网络中，并考虑网络类型和连接需求。以下是用于这种连接的几类基础设备：\n\
  \n![image](img/box.jpg)\n- **中继器** (images/box.jpg)：用于扩展网络介质的传输信号距离。\n- **集线器和集中器**\
  \ (images/box.jpg)：在星型拓扑中使用，通常是 `100Base-T`。\n- **交换机** (images/box.jpg)：在星型拓扑中使用，用于连接网段。\n\
  - **桥接器** (images/box.jpg)：当需要将一个网络连接到另一个网络时使用。\n- **路由器** (images/box.jpg)：以智能方式引导网络流量。\n\
  - **交换机** (images/box.jpg)：通过端口连接网络，通常是点对点拓扑的。\n- **集线器** (images/box.jpg)：以星型方式布线，但实际表现上更像总线型。\n\
  \n将所有集线器连接在一起通常会产生较大的冲突域。这一规则的例外是将集线器连接到交换机（见下一节），从而为每个集线器创建一个独立的冲突域。\n\n将这些设备正确组合是网络设计的艺术。第\
  \ 13 章 讨论了这些设备如何工作，但首先你需要了解它们在构建网络时所承担的职责。\n\n## 中继器\n\n`repeater` 是一种扩展网络介质传输距离的设备。它从一侧接收信号，放大后发送到另一侧。对于\
  \ `100Base-T` 网络，中继器通常用于线缆，接收并放大信号，然后将其发送到另一侧。中继器在 OSI 模型中工作于物理层。它们并不具备智能，只是简单地放大信号。例如，为了实现桥接或路由功能，可以使用额外的设备。中继器可以支持\
  \ `10Base-T` 或 `100Base-T` 速度，并自动检测速度。中继器可以以中继器十倍的速度运行上行链路。它们通常不需要使用额外的设备来实现桥接或路由。中继器可以数据包，而不是流量。网络交换机就像场地经理，只不过它引导的是数据包而不是火车，并且使用以太网电缆而不是火车轨道来运输货物。\n\
  \n![image](img/line.jpg)\n**图 4-1** 使用中继器的网络示例。(image](images/line.jpg)![image](img/line.jpg)\n\
  \n## 集线器和集中器\n\n*智能局域网集中器*——通常被称为*集中器*或更简单地称为*集线器*——用于连接网络骨干。节点以星型方式连接到集线器，或者使用环形拓扑（见第\
  \ 3 章）。简单的网络可能只需要一个集线器。集线器通常通过可更换模块支持多种介质类型。\n\n每个集线器都是一个*冲突域*，即网络中可能发生冲突的区域。将所有集线器连接在一起通常会产生包含所有集线器的冲突域。这一规则的例外是将集线器连接到交换机（见下一节），这将每个集线器保持在自己的冲突域内。图\
  \ 4-2 显示了使用集线器的网络示例。\n\n集线器具有许多高级功能，包括：\n\n![image](img/box.jpg)\n- 内置管理：可以通过简单网络管理协议\
  \ (`SNMP`) 或网络管理软件对集线器进行集中管理。\n- 速度自动感：例如，以太网集线器可以自动检测并运行 10 Mbps (`10Base-T`) 或\
  \ 100 Mbps (`100Base-T`)。\n- 高速上行链路：连接集线器到骨干。其速度通常是集线器的十倍（例如，对于 100 Mbps 集线器，上行端口可能是\
  \ 1 Gbps）。\n- 内置桥接和路由功能：无需使用独立的设备进行桥接和路由。\n- 内置交换：集线器上的节点可以交换而不是共享。\n\n在订集线器时，了解你想连接多少个节点、每个节点需要多少带宽以及使用的是什么类型的网络骨干是非常重要的。\n\
  \n## 交换机\n\n交换机顾其名，可以将连接从一个端口切换到另一个端口，且速度极快。它们是面向连接的，并在各个端口之间动态切换以创建这些连接。想象一个火车站，许多火车从某些轨道进入，并从另一些轨道离开。场地经理调度轨道“切换”的发生，以便火车到达目的地。网络交换机就像场地经理，只不过它引导的是数据包而不是火车，并且使用以太网电缆而不是火车轨道来运输货物。\n\
  \n\n\n\n\n| ![image](img/common.jpg) | **注意** 交换机非常像网桥，不同之处它们有很多端口，且外观上像集线器。你可以将交换机视为具有多个端口的网桥。\
  \ |\n\n由于交换机在任意两个端口之间形成一对一的连接，因此进入交换机的所有端口并不属于同一个冲突域。从这个意义上说，交换机充当了超级桥的角色（桥将在下一节讨论）。交换机可将多个集线器连接到更快的骨干网。例如，假设你有\
  \ 10 个集线器，每个连接了 24 个工作站节点。如果你简单地将所有集线器连接到公共骨干网上，所有 240 个工作站将共享同一个冲突域，这会严重损害性能。相反，更好的方法是安装一个\
  \ 12 端口交换机，并将每个集线器连接到交换机上的任一个端口。例如，工作站连接通常使用 `100Base-T` 以太网，而骨干网则使用 `1000Base-T`（或其他更快的网络连接）。这使得\
  \ 10 个集线器产生的所有流量都能继续以约 `100 Mbps` 的连接速度传输服务器，尽管所有集线器都在共享骨干网。图 4-3 展示了这种方法。![](img/line.jpg)![image](img/fig4-3.jpg)![](img/line.jpg)\
  \ **图 4-3.** 使用集线器和交换机构建的网络![](img/line1.jpg)\n\n| ![image](img/common.jpg) | **注意**\
  \ 交换机仅用于连接两个给定的端口（例如从端口 5 到端口 21 的流量），但它们足够智能，可以同时向所有端口回某些类型的广播包。 |\n\n交换机变得廉价且速度极快。对于局域网（LAN）连接，交换机比集线器更有意义，部分原因在于它们的成本和相对简单性。此外，大多数新网络都放弃了集线器，转而采用百分之百的交换式方法。事实上，现在几乎买不到集线器了，因为制造商通常只提供交换机。（你可能仍然买到只有\
  \ 4 到 8 个端口的微型集线器，但即使在这些小型应用中，交换机也是优选且价格并不贵多少。）理解集线器和交换机之间的区别很重要，因为你可能在现有网络中遇到安装的集线器。对于新网络，你可能会完全使用交换机。这样做可以大大减少网络数据包冲突的机会，而冲突在集线器结构中更容易发生。\n\
  \n### 桥\n简单来说，桥是中继器的更智能版本。桥可以连接两个网络段，但它们具有足够的智能，*仅当流量的目标是另一个段时*才会将流量从一个段传递到另一个段。桥用于将网络分成更小的部分。某些桥可以跨越不同的网络系统和介质，例如从同轴细以太网到双线令牌环网。\n\
  \n正如你可能记得，中继器工作在 OSI 网络模型的物理层（第 1 层）。桥工作在更高一层，即链路层（第 2 层）。桥检查它们遇到的每个数据包的媒体访问控制（MAC）地址，以决定是否应该将数据包转发到另一个网络。桥包含关于你网络所有部分的地址信息，可以通过你编写的静态路由表，也可以可以通过自动发现网络上所有设备和地址的动态学习树系统获取。\n\
  \n### 使用较少数大型交换机还是更多小型交换机更好？\n在一个机箱内托管数百个连接的大型交换机通常比其较小的 24 端口同类产品强大得多，它们往往具有更多内置冗余，例如单元内的冗余电源等。然而，有时使用较小的\
  \ 24 端口或 48 端口交换机构建网络更简单、更便宜。你只需购买一个额外的 24 端口或 48 端口单元作为热插拔备份（一种可以在故障发生时快速交换替换故障单元的备份单元），你可以在需要时手动实施。这种方法唯一的真正缺点是冗余不是自动的。如果一个交换机故障，你需要将它的连接移动到备份交换机上。相比之下，较大的单元可以自动切换到冗余功能。一如既往，请根据贵公司的特定情况及其需求仔细考虑此类权衡。![](img/line1.jpg)\n\
  \n| ![image](img/common.jpg) | **注意** 因为它们的工作层位于定义 `TCP/IP` 和 `IPX/SPX` 等协议的网络层之下，所以桥不在乎它们承载的网络协议。它们只在乎在链路层运行所需的信息。这意味着数据是否通过桥传输取决于其的\
  \ MAC 地址。 |\n\n你应该只在较小的网络上使用桥，或者在原本本会使用中继器但希望通过保持一个段的流量不被必要的传输到另一个段来从中获益的情况下使用。通常，路由器或交换机提供的性能更好且产生问题更少的解决方案，因此在选择桥之前请检查其他选项。\n\
  \n### 路由器\n正如桥本质上是更智能的中继器，路由器是更智能的桥。路由器工作在 OSI 模型的网络层（第 3 层），它们在将传入的数据包发送到目的地方面比桥智能得多。由于路由器工作在网络层，跨越路由器的连接只需要上层使用相同的协议。路由器可以从第\
  \ 1 层到第 3 层的任何协议翻译到第 1 层到第 3 层的任何其他协议（前提是路由器配置并设计如此）。路由器可以连接相似和不同的网络。它们通常被用于广域网（WAN）链路。\n\
  \n路由器实际上是网络中的节点，并有自己的网络地址。其他节点将数据包发送给路由器，路由器随后检查数据包内容并进行适当转发。由于由于原因，路由器通常内置快速的微处理器（通常是精简指令集\
  \ RISC 类型）和内存来执行此工作。路由器还可以确定到目的地的最短路径并使用。它们还可以执行其他技巧来最大化网络带宽，并动态适应网络变化的问题或流量模式![](img/line1.jpg)\n\
  \n| ![image](img/common.jpg) | **注意** 为了了解它们连接的网络以及如何正确路由各种类型的数据包，路由器使用一种称为*发现*的过程。在发现过程中，路由器仔细“监听”其端口上的流量，并发出广告包让其他设备知道路由器的存在。\
  \ |\n\n路由器构成了互联网的骨干。当你使用 `TRACERT` 命令跟踪从节点到目的地的路由时，跳跃中出现的多数地址实际上是不同的路由器，每个路由器都将数据包转发给下一个，直到到达目的地。![](img/line1.jpg)\n\
  \n| ![image](img/common.jpg) | **注意** 路由器只能路由可路由的协议。AppleTalk、NetBIOS 和 NetBEUI\
  \ 是不可路由协议的示例，而 `TCP/IP` 和 `IPX/SPX` 是可路由的。 |\n\n\n\n\n\n路由器必须经过编程才能正常工作。它们需要为每个端口分配分配地址，并必须配置各种网络协议设置。路由器通常通过以下几种方式之一进行编程：\n\
  \n![image](img/box.jpg)\n\n大多数路由器包含一个 `RS-232C` 端口。你可以将带有终端仿真软件的终端或 PC 连接到此端口，并在文本模式下对路由器编程。![image](img/box.jpg)\n\
  \n大多数路由器具有基于网络的软件，允许你对路由器进行编程，通常使用图形化工具。![image](img/box.jpg)\n\n路由器通常内置一个小型 Web\
  \ 服务器，通过可以通过连接的计算机使用 Web 界面对路由器进行编程。例如，家用无线路由器内置了此功能。你使用的方法取决于路由器以及你的安全需求。（你可能希望禁用基于网络的路由器编程，以防止未经授权的用户更改路由配置。）图\
  \ 4-4 显示了一个使用路由器的网络示例。![](img/line.jpg)![image](img/fig4-4.jpg)![](img/line.jpg)**图\
  \ 4-4.**  使用路由器的网络**\n\n## 网关\n\n网关是特定应用的接口，当 OSI 模型的任何一层或所有层不同时，它们会将这七层连接起来。例如，如果你需要将使用某种\
  \ OSI 网络模型的网络连接到使用 IBM 系统网络架构 (SNA) 模型的网络，请使用网关。网关还可以将以太网翻译为令牌环（Token Ring），尽管如果你需要这种翻译，也存在比网关更简单的解决方案。由于网关必须翻译大量内容，它们往往比其他解决方案慢，特别是在高负载状态下。\n\
  \n今天网关的主要用途是处理电子邮件。邮局协议 3 (`POP3`) 和简单邮件传输协议 (`SMTP`) 是由网关处理的两种协议示例。大多数可以连接到异系统的电子邮件系统要么使用设置了网关的计算机处理这项工作，要么让电子邮件服务器自己处理网关工作。\n\
  \n## 使用防火墙保护网络\n\n防火墙是执行你的网络安全策略的硬件设备。它们通常与路由器一起安装。例如，防火墙有时与路由器一起安装以创建跨网络连接。在大多数为小型办公/家庭办公（SOHO）设计的路由器中，防火墙是路由器本身的一部分。然而，较大网络的设备仍然将这些职责保留在独立的设备中。\n\
  \n防火墙是一个硬件设备（可以是为了该任务而运行防火墙软件的计算机，或者是内置计算机的专用防火墙设备），它位于两个网络之间并执行网络安全策略。通常，防火墙位于公司局域网（LAN）和互联网之间，但也可以用于局域网或广域网（WAN）之间。\n\
  \n基本上有两种不同类型的防火墙：\n\n![image](img/box.jpg)\n\n基于网络的防火墙运行在网络层（`Layer 3`），通常实现一种称为数据包过滤的技术，在允许数据包跨越两个网络的边界之前，会将网络之间的数据包与防火墙中编写的规则集进行比较。数据包过滤规则可以根据源目的地址、时间或\
  \ `TCP/IP` 端口允许或拒绝数据包。![image](img/box.jpg)\n\n基于应用的防火墙通常在两个网络之间充当代理，使得网络流量不会直接在两个网络之间传输。相反，防火墙（通常称为代理防火墙）作为一个网络用户的代理，与另一个网络上的服务进行交互。这种代理交互通常使用网络地址转换\
  \ (`NAT`) 技术完成，其中内部网络上的网络地址不会直接暴露给外部网络。在应用模型中，代理防火墙负责翻译地址以便连接能够建立。![](img/line1.jpg)\n\
  \n| ![image](img/common.jpg) | **注意** 防火墙并不是网络安全的万灵药。世界上最好的防火墙也无法保护你的网络免受其他安全威胁，例如第\
  \ 9 章中讨论的一些。然而，它们是网络安全的重要部分，特别是对于连接到互联网的局域网。 |\n\n防火墙有各种形状大小，价格从几百美元到几千美元不等。事实上，现在通常家用无线路由器都内置了防火墙。你还可以购买大约\
  \ 40 美元的可以安装在计算机上的防火墙软件。\n\n不同的防火墙设备具有各种功能，并可能涵盖基于网络和基于应用的技术来保护网络。防火墙通常还作为两个网络之间流量的审计点，使用日志和报告工具帮助管理员检测并处理不适当的网络流量。在第\
  \ 9 章的网安全范围内讨论了防火墙。\n\n## 使用短程调制解调器连接 RS-232 设备\n\n虽然人可能认为短程调制解调器不是真正的网络设备，但它是你的网络可能需要的设备，用于提供工作站或终端与另一个设备之间的对点连接。短程调制解调器（有时称为\
  \ `line drivers`）允许你将两个远程 `RS-232C` 设备连接在一起。标准的 `RS-232C` 线缆距离限制为 15 到 30 米（50 到\
  \ 100 英）。短程调制解调器允许使用简单的电话级双线使相同的连接运行五英里。\n\n当计算机需要访问远程设备时，短程调制解调器通常是完美的解决方案。例如，用户可能需要访问私分支交换\
  \ (`PBX`) 电话系统上的终端，该系统使用 `RS-232C` 端口。你有两种方案来提供这种远程访问：\n\n![image](img/box.jpg)\
  \ 在每端安装普通调制解调器，并使用电话连接从工作站连接到 PBX。![image](img/box.jpg) 使用两个短程调制解调器并在两点之间铺设双线。\n\
  \n取决于访问的频率和设备的远近，这两种方法都可以是的。通常，当两个设备经常或总是需要连接，且在位置之间铺设双线的成本并不昂贵或困难时，首选短程调制解调器。短程调制解调器相当便宜，每个约\
  \ 100 美元。\n\n在大多数短程调制解调器系统中，两对线连接每个短程调制解调器，尽管存在单线变体。对于双线型号，一对线用于传输数据，另一对用于接收数据。大多数短程调制解调器是全双的，允许在两个方向进行传输。\n\
  \n要使用短程调制解调器连接两个设备，你使用标准的 `RS-232C` 线将每个设备连接到其短程调制解调器。然后根据调制解调器随附的说明将双线接到短程调制解调器。最后，大多数短程调制解调器需要外部电源，因此你需要将它们插入电源插座。图\
  \ 4-5 显示了一个短程调制解调器连接的示例。![](img/line.jpg)![image](img/fig4-5.jpg)![](img/line.jpg)**图\
  \ 4-5.**  短程调制解调器连接![](img/line1.jpg)\n\n\n\n\n\n| ![image](img/common.jpg) | 提示如果你经常进行\
  \ RS-232C 接口，你应该投资一种名为分接箱（breakout box）的设备。这种小型设备在两端都有 RS-232C 连接器。在箱内，每个 RS-232C\
  \ 引脚信号都由发光二极管（LED）表示。分接箱中的特殊接柱和开关允许你动态重新配置 RS-232C 连接。对于实现两个无法通信的设备之间的 RS-232C 通信，分接箱非常有价值。它们可以显示信号的实际情况，并让你动态尝试不同的电缆配置。一旦你使用分接箱确定如何让设备通信，就可以按照这些规格制作永久电缆。\
  \ |\n\n## 章节总结\n在本章中，你学习了构成大多数网络的关键硬件。熟悉所有此类网络硬件的能力对你来说很重要，这将任何网络设计或性能调优工作的基础。请注意，你还需要了解其他类型的网络硬件。后续章节将讨论其他重要的网络硬件。特别是，你还应该了解远程访问硬件、支持\
  \ WAN 链路的硬件，以及在不同类型的网络服务器上执行的某些网络功能。第五章讨论了用于将网络连接到其他网络的不同技术，通常跨越远距离。WAN 连接用于连接互联网，以及在局域网（LAN）之间建立临时或全时的连接，例如从一个公司地点到另一个地点。![image](img/common4.jpg)\n\
  \n| **第 5 章** | ![image](img/line-1.jpg) | **建立 WAN 连接** |\n\n![image](img/common5.jpg)![image](img/line1.jpg)许多公司有多个需要共享网络资源的地点。例如，公司的会计系统可能运行在会计和信息技术（IT）人员所在的总部大楼，但位于镇另一侧的仓库仍然需要访问会计系统进行库存捡货单据、数据输入以及其他订单履行和库存任务。或者，公司可能使用如\
  \ Lotus Notes 这样的群软件系统，它需要定期从一个站点到另一个站点更新信息和消息。现实世界中，情况可能会更加复杂。有些公司在世界各地设有办公室，每个办公室在访问和更新其他位置的数据方面都有不同的需求。\n\
  \n所有这些都是广域网（WAN）可以派上用场的情况。当然，在紧急关头，多个办公室可以使用联邦快递（Federal Express）以及相同的磁带机、蓝光光盘、外部通用串行总线（USB）硬盘或其他媒体交换数据。像这样来回发送数据是可能的（假设应用程序支持这种方式的数据交换），但这种安排有一些缺点——最大的缺点就是速度非常慢。\n\
  \n有很多种方法可以将一个地点的局域网（LAN）连接到另一个地点的局域网，建立此类连接是本章的主题。但在研究不同的 WAN 技术之前，你应该评估你的网络需求。由于实施和维护\
  \ WAN 的成本和时间，除非它是满足你需求的唯一或最佳方式，否则你通常不想安装。\n\n### 确定 WAN 需求\nWAN 链路的维护通常非常昂贵。带宽需求随时间增长而增加，这些升级成本很高。此外，WAN\
  \ 链路通常比 LAN 更容易出现问题，因为存在许多额外的故障点。出于这些原因，仔细评估 WAN 的需求非常重要，然后研究不同的可用方案、成本以及涉及的权衡。成本在不同技术、速度和其他因素（包括你的位置）之间可能存在巨大，因此你需要严重依赖本地提供商的成本和可用性数据来进行你自己的\
  \ WAN 分析。此外，价格和可用性几乎每周都会变化，因此在决定特定的 WAN 技术之前，确保从你的本地提供商处获取最新数据![](img/line1.jpg)\n\
  \n| ![image](img/common.jpg) | 提示通常可以使用被称为虚拟专用网络（VPN）的技术通过互联网满足 WAN 的需求。VPN 之被称为“私有”，是因为两点之间的所有数据包都经过加密，因此尽管数据包通过公共网络传输，其信息仍然是安全的。由于互联网提供了传输介质，它们通常比专用\
  \ WAN 链路便宜得多，而且它们通常可以使用现有的 Internet 连接连接两个（或更多）地点。第 8 章 详细讨论了 VPN。 |\n\n\n\n\n#\
  \ 需求分析\n\n公司的第一条广域网（WAN）通常是由特定的应用程序驱动的，例如会计系统。一旦 WAN 开始运行，公司就会开始将 WAN 用于其他应用程序。如果你未能考虑到公司对\
  \ WAN 可能产生的所有用途，你可能会发现自己投入了大量资金购买了一个一个无法满足你所有需求的解决方案。以下是一些问题，可以帮助你确定公司 WAN 的需求：\n\
  \n![image](img/box.jpg)\n\n* 哪些位置将参与 WAN？它们可以获得什么种 WAN 服务？例如，位于大提的销售办事处在购买千兆比特 WAN\
  \ 链路可能会遇到困难。![image](img/box.jpg)\n* 每个站点与站点之间需要传输多少数据？在什么时间范围内传输？![image](img/box.jpg)\n\
  * 数据需要多快传输？![image](img/box.jpg)\n* 数据传输需要是同步的，还是可以是异步的？例如，直接在另一个地点的会计系统中输入记录的仓库管理员需要同步（实时）连接，而需要每天每天晚上某个时间向总部上传销售数据的餐厅则只需要异步连接。![image](img/box.jpg)\n\
  * 数据传输需要在何时完成？它们需要每天 24 小时、每周 7 天运行吗？还是需要每 30 分钟一次，或者遵循其他计划？![image](img/box.jpg)\n\
  * 预算限制是什么？不同的可用替代方案成本是多少？\n\n一旦你得到了这些问题的答案，就可以确定你需要交换链路还是专用链路，以及它应该是公有的还是私有的。这些问题将在后续章节中讨论。\n\
  \n## 交换还是专用？\n\n`switched`（交换）WAN 链路不是一直处于激活状态。例如，从一个位置到另一个位置的拨号调制调器连接或综合业务数字网络（`ISDN`）都是交换连接。这些连接仅在你需要时才形成，你通常为连接开启的时间付费，而不是为通过连接能够传输的数据量付费。图\
  \ 5-1 是交换 WAN 链路的一个示例。\n\n![](img/line.jpg)![image](img/fig5-1.jpg)![](img/line.jpg)\n\
  \n**图 5-1.** 交换 WAN 链路\n\n交换链路可以是基于连接的，也可以是基于分组的。基于连接的交换链路根据需要形成连接，并在该链路范围内提供固定数量的带宽。基于分组的交换链路将数据包发送到网络云中，数据包在云中可以通过多条路径到达目的地，然后从云中出来。分组交换网络可能更可靠，因为数据可以采取许多不同的路径，但无法保证每个数据包在特定时间内到达。基于连接的交换链路只是为你提供了一条从源地到目的地的单一“管道”，但你可以控制进入管道的内容以及到达目的地需要多长时间。\n\
  \n`dedicated`（专用）WAN 链路是始终开启并运行的。专用 WAN 连接的示例包括 `DS1` 或 `DS3`（`T-1` 或 `T-3`）线路、`xDSL`\
  \ 线路、基于以太网的电信链路或光纤电信链路。当你需要连接一直处于开启状态或者当整体经济效益显示此类连接比交换链路更便宜时，你就使用专用连接。图 5-2 说明了专用\
  \ WAN 链路。\n\n![](img/line.jpg)![image](img/fig5-2.jpg)![](img/line.jpg)\n\n**图 5-2.**\
  \ 专用 WAN 链路\n\n## 私有还是公有？\n\n`private network`（私有网络）是由特定公司运行的。通常，私有网络指的是大型电信供应商维护的全球网络，例如\
  \ `AT&T`、`Verizon`、`Level3`、`CenturyLink`、`XO` 等。它也可以指使用公司完全私有的网络，例如当你通过你完全控制的电缆或无线连接将校园内的建筑连接时。\n\
  \n私有网络的优点是数据是安全的，网络使用和容量可以管理，并且你可以预测可用带宽是多少。`public network`（公有网络），如互联网，是许多公司数据通过的网络。公有网络的安全性低于私有网络，但优点是公有网络成本较低。\n\
  \n在以下情况下使用公有网络：\n\n![image](img/box.jpg)\n\n* 你不在乎数据偶尔需要更长时间才能到达目的地，或者站点之间的延迟相对相对不可的。![image](img/box.jpg)\n\
  * 你希望获得尽可能廉价的网络连接。![image](img/box.jpg)\n* 数据不需要安全，或者你有能力在公有网络上使其安全。（如虚拟私有网络或某些类型的数据加密技术可以提供这种安全性。）\n\
  \n## WAN 传输质量\n\n你应该熟悉以下几个关于 WAN 网络传输质量的术语：\n\n![image](img/box.jpg)\n\n* `Latency`（延迟）指的是任何数据包穿越网络所需的时间量。通常以往返延迟（`RTD`）表示，单位为毫秒。![image](img/box.jpg)\n\
  * `Dropped packets`（丢包）可能发生在数据溢出时![image](img/box.jpg)\n* `Packet errors`（分组错误）发生在数据损坏时![image](img/box.jpg)\n\
  * `Jitter`（抖动）发生在数据到达变异时![image](img/box.jpg)\n* `Out-of-order`（乱序）发生在数据采取不同路径时![image](img/box.jpg)\n\
  \n## 比较连接类型\n\n现在你了解了 WAN 链路的一些基础知识：\n\n### 普通电话服务 (POTS)\n\n普通电话服务 (`POTS`) 传输模拟信号，而不是数字。通过\
  \ `modem`（调制解调器）将数字转换为模拟。`modem` 这个词实际上是基于其功能的缩写——调制/解调器。在连接的末端，发送系统的 `modem` 将数字调制为模拟信号并通过电话线发送。在接收端，`modem`\
  \ 将模拟信号解调回数字数据。\n\nPOTS 通常用于传输数据，除非在极少数情况下。然而，考虑到你可能会遇到使用 `POTS` 的系统，你应该熟悉它。\n\n\
  `POTS` 的最大理论速度为 `36 Kbps`。许多因素会降低这种速度，其中主要是线路质量。`POTS` 目前使用双绞线。`POTS` 可以支持通话。\n\n\
  ### 综合业务数字网络 (ISDN)\n\n`ISDN` 代表综合业务数字网络。它是一种基于现有电话服务的高速数字通信网络。尽管它已经存在多年，但由于电信局局（`COs`）需要大量的升级，它最近才变得广泛可用。`ISDN`\
  \ 连接仍用于语音电路以及低容量数据电路，但总体上 `ISDN` 已被 `xDSL` 和其他连接类型所取代。\n\n`ISDN` 有两种基本形式：基本速率接口（`BRI`）和初速率接口（`PRI`）。`ISDN-BRI`\
  \ 连接由三个通道组成。两个是 `bearer channels`（传输通道），以每个通道 `64 Kbps` 的速度传输数据。传输通道也可以携带语音通话——即口头电话通话。（每个传输通道一次携带一次通话。）第三个通道称为\
  \ `data channel`（数据通道），携带调用设置信息以及管理两个传输通道所需的其他通信。数据通道携带 `16 Kbps` 的数据。传输通道简称 `B-channels`；数据通道简称为\
  \ `D-channel`。因此，`ISDN-BRI` 连接通常被称为 `2B+D` 连接。\n\n`ISDN-PRI` 连接由 24 个 `B-channels`\
  \ 和一个 `D-channel` 组成。`PRI` 连接总共可以携带 `1.544 Mbps`——与 `T-1` 线路相同。\n\n![](img/line1.jpg)\n\
  \n\n\n\n| ![image](img/common.jpg) | **注意** 世界不同地区提供不同类型的 PRI 配置。名为 24B+D 的配置很常见，你还可能看到其他变体，例如带有\
  \ 64 Kbps D 通道的 22 个 B 通道、24 个 56 Kbps 的 B 通道，甚至有 30 个标准 B 通道（总计 1.92 Mbps）。 |\n\
  \nISDN 连接通常根据需要建立建立——它们是交换式的。对于 WAN 链路，你在两端都使用按需连接的 ISDN 路由器，当有数据待处理时，它们可以“拨号”另一端的路由器。由于\
  \ ISDN 的呼叫建立速度极快，ISDN 连接的形成比 POTS 连接快得多——通常小于一秒。\n\n![](img/line1.jpg)\n\n| ![image](img/common.jpg)\
  \ | **注意** 尽管许多系统也可以使用互联网或私有 WAN 链路进行视频会议，但 ISDN 仍然是此类通话的主要连接类型。如果你正在设置视频会议系统，你应该计划至少安装两个\
  \ BRI 连接（三个更好），并购买支持至少 256 Kbps 带宽的视频会议系统。通过单个 BRI (128 Kbps) 进行视频会议的质量相当差；两个 BRI\
  \ (256 Kbps) 效果好得多，三个 BRI (384 Kbps) 连接的效果非常好。请注意，通话的两端都需要支持相同的速度和 BRI 数量。 |\n\n\
  \n\n\nISDN 定价经常发生变化。在不同地区，价格也有很大差异。在选择 ISDN 之前，从你所属的区域贝尔运营公司（`RBOC`）获取完整的定价信息很重要。然后，根据你预测的使用数据，你应该能够计算出使用\
  \ ISDN 的成本。通常情况下，在假设不需要更改布线的情况下，安装一条 ISDN-BRI 线的成本约为 150 美元。如果你签署协议将 ISDN 线路保留一到两年，某些\
  \ `RBOCs` 可能会免除安装费。每月的 ISDN 使用费用和长途 ISDN 拨号费用与 POTS（普通电话电话服务）费用相似。但请记住，连接两个 `B-channels`\
  \ 等同于拨打两次电话，当你同时使用两个 `B-channels` 时，单次通话的任何费用都会翻倍。\n\n## 数字用户线路\n\n数字用户线路（`DSL`）连接类型已经广泛可用。存在多种不同类型的\
  \ DSL。每种类型都以不同的首字母或首字母组合开头，这就是为什么 DSL 通常被称为 `x`DSL。可用的类型包括以下：\n\n![image](img/box.jpg)\n\
  \n### ADSL\n非对称 DSL 之所以这样命名，是因为传输速度（称为 `upstream direction`）和接收速度（称为 `downstream\
  \ direction`）是不相同的。ADSL 线的下行带宽几乎远高于上行带宽。ADSL 线路非常常见，特别是对于消费者上网接入。\n\n![image](img/box.jpg)\n\
  \n### HDSL\n高速 DSL 允许比 ADSL 更高的速度并提供对称连接，这意味着可用的上行带宽和下行带宽是相同的。\n\n![image](img/box.jpg)\n\
  \n### RADSL\n速率适应 DSL 允许接收 600 Kbps 到 12 Mbps 的数据，并发送 128 Kbps 到 1 Mbps 的数据。RADSL\
  \ 是非对称的，其带宽可以通过软件进行调整。例如，如果连接遇到噪声和丢包，RADSL 可以减少带宽以尝试提高数据包的交付率。\n\n![image](img/box.jpg)\n\
  \n### SDSL\n对称 DSL 允许从 160 Kbps 到 2.048 Mbps 不等的双向速率。\n\n![image](img/box.jpg)\n\
  \n### VDSL\n极高速 DSL 允许下行带宽高达约 52 Mbps。VDSL 可以是对称的，也可以是非对称的。\n\n![image](img/box.jpg)\n\
  \n### IDSL\n基于 ISDN 的 DSL 速度与 ISDN 相似。IDSL 几乎专门用于数据，因为它是到单一目的地的在线连接（如前所述，ISDN 可用于拨打到其他\
  \ ISDN 连接的电话）。\n\n`x`DSL 已变得无处不在，部分原因是每兆字节传输传输的成本远低于 POTS，甚至比 ISDN 便宜得多。目前，`x`DSL\
  \ 在美国大多数城市都是可用的。在本节中，你将学习 `x`DSL 如何工作，以及你何时可能实现其高带宽能力。本讨论重点关注 ADSL，因为它是最流行且最便宜的。然而，对于\
  \ WAN 链路，如果你的 WAN 数据需求在下行和上行方向上相似，你应该考虑 SDSL。\n\n## xDSL 如何工作\n\n承载 POTS 的双绞铜线能够传输频率范围高达\
  \ 1 MHz 的信号。然而，POTS 仅使用了该频率带宽的 8 KHz。`RBOC` 的局端办公室（CO）交换机包含一张卡，用于与双绞线发送到电话公司数字网络的模拟信号接口。此接口卡在每个方向仅允许\
  \ 4 KHz 的信号频率，尽管电线本身能够携带宽得多的频率范围。这种限制之所以存在于标准电话业务中，是因为 4 KHz 为语音通信提供了合理的清晰度，而且大部分电话系统都是围绕这类电路设计的。\n\
  \n`x`DSL 的工作原理是通过使用新的 `x`DSL 接口卡来开启那 1 MHz 的最大能力，`RBOCs` 将这些卡安装在他们的 CO 交换机中，取代用于语音线的卡。然而，计算机设备到\
  \ CO 交换机的距离限制了数据速率。大多数 `x`DSL 实现在最高 3,600 米（12,000 英尺，或约 2 英里）的范围内运行最佳。特别是高带宽版本的\
  \ DSL 通常只有在距离 CO 3,600 米以内时才能以峰值速度运行。更远的距离是可行的，但无法达到该全可能的数据速率。例如，在 5,500 米（18,000\
  \ 英尺）的距离运行 ADSL 连接——这是 95% 电话位置相对于其 CO 交换机的距离——会导致下行方向的下降到约 1.5 Mbps（最理想）。只有估计 50%\
  \ 的美国位置位于 `RBOC` CO 交换机的 3,600 米范围内。\n\n好消息是，较新的 `x`DSL 实现改进了这些距离限制。此外，还有扩展设备（本质上是中继器），`RBOCs`\
  \ 可以安装它们为更偏远的农村地区提供 DSL 连接。ADSL 的具体实现数据速率各异。某些较慢的实现仅以下行 1.5 Mbps 和上行 256 Kbps 。在某些情况下，这种速度甚至可能降低到下行\
  \ 384 Kbps 和上行 64 Kbps。\n\n## T-1/T-3 (DS1/DS3) 连接\n\n40 年前，贝尔实验室开发了一套可以携带数字信号的分级系统。在这个分级结构的最底层是\
  \ `DS0` 连接（DS 代表 Digital Signal），它携带 64 Kbps 的带宽。`DS1` 连接聚合了 24 个 `DS0` 通道，可以携带高达\
  \ 1.544 Mbps 的带宽。下一级是 `DS3`，它携带 72 个 `DS0` 通道，总计 44 Mbps。`DS1` 连接通常被称为 `T-1` 连接，实际上指的是通过四线双绞线传输的中继器系统。`DS1`\
  \ 只需要双绞线，而不是光电缆。\n\n## 为什么使用非对称 DSL？\n\n许多数据访问需求是非对称的。也就是说，在任何时刻，系统接收的数据比发送的数据多，反之亦然。大多数远程接入（特别是互联网连接）是非对称的。重点在于快速接收数据而非发送数据。由于如此，ADSL\
  \ 在 `x`DSL 实现中最流行，因为它在相同的总带宽内提供了更多优势。某些 `x`DSL 实现是对称的，例如 SDSL 和 HDSL。这些连接类型适用于数据交换大致相等的情况，例如相互连接的远程\
  \ LAN。`DS1` 连接通常用于程程交换机（PBX）与运营商接入点（POP）之间。`DS1` 连接可以同时处理 24 个语音通话或 24 个数据连接。或者，通过复用器使用\
  \ `DS1`，你可以形成 1.544 Mbps 的连接。一种流行的分时 T-1（fractional T-1）技术也存在，安装了完整的 `DS1` 但只有你付费的通道被开启并可用。分时\
  \ T-1 很好，因为你只需要购买所需的带宽，增加带宽到最大 `DS1` 只需一个电话的距离！在你的 `DS1` 连接端，有两个关键设备：将 `DS1` 信号转换为网络信号的信道单元/数据单元（CSU/DSU），以及在\
  \ `DS1` 和 LAN 之间引导数据的路由器。\n\n## 异步传输模式 (ATM)\n\n异步传输模式（通常简称 ATM）是一种用于位置之间传输数据的高速技术。ATM\
  \ 是一种基于单元的复用网络技术，将数据收集到称为单元的实体中，然后通过 ATM 网络传输这些单元。ATM 网络可以携带语音和数据。ATM 非常快，速度从 155\
  \ Mbps 到 622 Mbps 不等，某些情况下可以达到 10 Gbps。通常，ATM 只供需要 WAN 链路 ATM 速度的大型公司，或需要通过网络发送大量数据（如视频数据）的公司使用。\n\
  \n## 企业 WAN 网络\n\n在本节中，你将学习实践中的企业 WAN 网络，包括 WAN 连接的组件、服务质量和服务类别、冗余 WAN 链路以及 WAN\
  \ 网络链路的成本组件。\n\n### 组件\n\n若干组成部分构成了公司到 WAN 的连接。图 5-3](#ch05.html_fig-3) 说明了公司位置的连接，这适用于连接到同一网络的所有其他公司位置。组件部分将在后续章节描述。\n\
  \n![](img/line.jpg)\n![image](img/fig-3.jpg)\n[](images/line.jpg)\n**图 5-3。**\n\n\
  ### 个体 WAN 链路的组件\n\n#### 环路\n从公司建筑出的连接最初通过被称为环路的东西传输，在你的建筑与本地运营商（`LEC`）的局端办公室之间建立连接。这种连接通常被称为“末端”，因为它通常构成了线路的最后一里（或左右）。环路通常通过铜线或光电缆传输，但在某些情况下也可以使用微波传输等无线技术传输。在你的建筑内，环路将连接到\
  \ `router`，有时称为用户楼设备（`CPE`）。\n\n#### 局端办公室\n在世界大部分地区，单一公司（在较大地区为两或三家）安装并拥有现有的电话和数据布线。这些运营商被称为现有本地运营商（`ILEC`，或通常简称\
  \ `LEC`）。在美国，这通常是 AT&T，但在不同地区也有其他也是 LEC，例如 Verizon。这些本地网络最初是为了支持交换电话，但随着时间的推移，它们一直在增长，现在也携带特定区域内所有的数据连接。当任何人拨打交换电话时，信号会被传输到\
  \ `LEC` 的局端办公室，随后它们被路由到目的地。在 WAN 连接的情况下，信号被传输到局端办公室，随后被路由到主运营商的接入点。\n\n#### 接入点\n\
  接入点（通常称为 `POP`）是作为运营商私有网络边缘点的建筑。在 `POP` 建筑内安装了各种 `routers` 和交换机，它们聚合了来自 `CO` 建筑的所有连接，并作为运营商私有网络与客户之间的接口。\n\
  \n#### 私有网络\nWAN 链路连接的 `POP` 而连接到私有网络部分的其他 `POP`。在运营商在某个地区拥有强大存在的情况下，他们通常会有多个 `POP`。\n\
  \n\n\n\n### 提示\n如果你选择使用单个 POP 点（在世界上某些地区，取决于运营商，你可能被迫这样做），那么请务必确保运营商将每个 WAN 电路连接到该\
  \ POP 内部不同的提供商设备（PE）。PE 路由器和交换机可能会发生故障，因此通过确保运营商将 WAN 电路连接到不同的设备，你可以缓解这种潜在的单点故障。请注意，并非所有运营商都会自动确保来自同一客户的多条电路连接到不同的交换机或路由器，因此请务必提出此请求并让运营商提供书面确认。好消息是，设备多样性通常不会产生额外费用。\n\
  \n除了确定希望哪些 WAN 组件具有冗余外，你还应该考虑你希望的整体冗余形式。例如，如果通往特定地点的主链路中断，备份电路可以比主电路小。或者，你也可以通过负载共享安排将特定地点的带宽使用分配在两条电路之间，这样通常情况下每条电路都承担该地一半的带宽，如果其中一条发生故障，该地将以\
  \ 50% 的带宽继续运行，直到故障电路恢复。\n\n### 注意\n我见过的另一种冗余形式是针对那些拥有全球网络但有两个位置相对较（距离 20 到 50 英里以内）的公司。在这种情况下，你可以让这两个的地点都通过单条电路接入\
  \ WAN 网络，但随后这两个地点之间额外增加一条私线电路相互连接。然后，对两个局域网（LAN）进行配置，以便如果任何一个地点的 WAN 连接中断，该地点的流量将自动通过私线路由到另一个地点，然后出到\
  \ WAN 网络。\n\n### 章总结\n在本章中，你学习了与 WAN 相关的概念和技术，包括不同类型的链路和不同类型的连接，以及如何为特定应用程序指定特定的\
  \ WAN 技术。虽然许多选择可能会让这个领域变得困惑，但当你将问题分解成较小的部分时，就会变得简单。基本上，确保你仔细、彻底地识别你的 WAN 需求，然后与当地的各种\
  \ WAN 供应商合作，分析他们的解决方案如何满足你的需求。你还学习了 WAN 网络的主要组件，以及在 WAN 网络中需要冗余时需要注意的一些事项。\n\n下一章将进入网络协议，如\
  \ `TCP/IP` 和 `IPX/SPX`。你将学习这些网络协议是如何工作的、它们数据包是如何构造的，以及每种类型网络协议的各种特性。你还学习了其他一些常用协议，特别是与\
  \ `TCP/IP` 协议，如 `SMTP`、`HTTP` 和 `WINS`。\n\n## 第 6 章：理解网络协议\n\n\n\n\n\n![image](img/common5.jpg)![image](img/line1.jpg)\n\
  \n网络 `protocol`（协议）是一组数据通信在网络上遵循的规则，用于完成各种网络事务。例如，`TCP/IP` 定义了一组用于将数据从网络上的一个节点发送到另一个节点的规则。`SMTP`\
  \ 是一组用于将电子邮件和附件从一个节点传输到另一个节点的规则和标准。动态主机配置协议（`DHCP`）是一组用于为网络动态分配 IP 地址的规则和标准，这样每个站就不需要为每个工作站手动设置地址。\n\
  \n网络中使用了许多协议。事实上，从某种意义上说，网络上的几乎*每一个*活动都遵循某种程度的协议。某些协议在 OSI 网络模型中低层运行，另一些运行在高层，而另一些则运行在两者之间。在本章中，你将学习用于跨网络传输和接收数据的关键网络协议。\n\
  \n## 理解 TCP/IP 和 UDP\n\n正如其名称所示，`TCP/IP` 实际上是两个协同使用的协议。网协议（`IP`）定义了网络数据如何从源到目的进行编址，以及数据在另一端按什么顺序重组。`IP`\
  \ 运行在 OSI 模型的网络层。传输控制协议（`TCP`）运行在 `IP` 高一层，即传输层。`TCP` 管理计算机之间的连接。`TCP` 消息被封装（封载）在\
  \ `IP` 数据报文中。\n\n用户数据报协议（`UDP`）的作用与 `TCP` 相同，但提供的功能较少。`TCP` 和 `UDP` 包都封装在 `IP` 包中，但\
  \ `UDP` 支持的唯一可靠性功能是重发任何在目的地未收到的包（`UDP` 被称为一种*无连接*协议）。`UDP` 的主要优势是对于简单的网络通信，速度快得多，例如将网页发送到客户端计算机。由于\
  \ `UDP` 不提供许多错误检查或错误处理功能，因此仅当数据在点之间偶尔发生损坏并需要重发并不重要，或者应用程序提供了了自己的详尽的错误检查和错误处理函数时，才应该使用它。\n\
  \n## DEFINE-IT！数据报文、帧和包\n\n`packet`（数据包）是通过网络发送的任何数据集合，该术语通常泛指发送到 OSI 模型任何层级的数据单元。例如，人们谈论\
  \ `IP packets`，尽管在技术上正确的术语是 `IP datagrams`（IP 数据报）。在书中，`packet` 是泛指的。对包的严格定义仅适用于在\
  \ OSI 模型顶层（应用层）发送的消息。\n\n网络层的数据单元（如 `IP` 携带的单元）被称为 `datagrams`（数据报）。在数据链路层（第 1 层）携带的数据单元被称为\
  \ `frames`（帧）。所有这些术语都指的是作为单一单元传输的数据集合。\n\n## TCP 和 UDP 端口\n\n`TCP` 和 `UDP` 都支持`ports`（端口）的概念，即特定应用程序地址，包被指向任何给定的接收机器上的这些端口。例如，大多数\
  \ Web 服务器运行在服务器机器上，并通过 `port 80` 接收请求。当机器接收到任何用于 Web 服务器的包（例如提供网页的请求）时，请求机器会将这些包导向该端口号。当你从\
  \ Web 服务器请求网页时，你的计算机会将请求发送到 Web 服务器计算机，并指定其请求应发往 `port 80`，这是超文本传输协议（`HTTP`）请求导向的地方。\n\
  \n数百个不同的端口具有标准化的用途。在服务器上为特定应用程序定义自己的端口很容易的。名为 `SERVICES` 的文本文件定义了计算机上的端口。下面是 Windows\
  \ `SERVICES` 文件部分的示例。（由于空间限制，仅显示了选条目；以下不是完整的 `SERVICES` 文件，但它说明了文件中包含的内容。）\n\n![image](img/p87-01.jpg)![image](img/p88-01.jpg)\n\
  \n如你所示，你可能熟悉的大多数 Internet 服务实际上都是通过使用 `TCP` 和/或 `UDP` 端口工作的，例如用于 Web 的 `HTTP`（`port\
  \ 80`）、用于电子邮件的 `SMTP`（`port 25`）、用于 Usenet 的网络新闻传输协议（`NNTP`）（`port 119`）等。端口的使用确保用于特定目的的网络通信与可能同时到达同一台机器的其他通信发生混淆。\n\
  \n端口允许接收机器适当地导向到达的数据。例如，一个托管网页并同时接收和处理电子邮件的服务器。到达 `port 80` 的包将发送到 Web 服务软件，而到达\
  \ `port 25` 的包将进入电子邮件软件。机器上的其他服务（如 `Telnet` 和 `FTP`）也可以通过此机制并发运行。\n\n## IP 包和 IP\
  \ 寻址\n\n`IP` 包包含了唯一定义连接到 Internet 的每台计算机的地址（参见图 6-1）。这些地址用于将数据包从发送节点路由到接收节点。因为 Internet\
  \ 上的所有路由器都知道它们连接的网络地址，因此它们可以准确地转发指向远程网络的包。\n\n![](img/line.jpg)![image](img/fig6-1.jpg)![](img/line.jpg)\n\
  \n**图 6-1.** 显示 IP 包布局的示意图。\n\n除了携带其数据外，每个 `IP` 包还包含若干字段，按以下顺序组织：\n\n![image](img/box.jpg)\
  \ **Version（版本）** 该字段表示使用的 `IP` 协议版本。\n![image](img/box.jpg) **Header length（头部长度）**\
  \ 该字段表示包中数据之前的头部长度。\n![image](img/box.jpg) **Type of service（服务类型）** 该字段用于不同供应商的不同用途。它可以用于请求优先级路由、请求最高可靠性等。\n\
  ![image](img/box.jpg) **Total length（总长度）** 该字段表示包的总长度。\n![image](img/box.jpg) **Identification,\
  \ flags, and fragment offset（标识、标志和分偏移）** 这三个字段用于重组在传输过程中某处被拆分的 IP 包。\n![image](img/box.jpg)\
  \ **Time to live（存活时间）** 该字段（在图 6-1](#ch06.html_fig6-1)中定义了包在失效之前可以经过多少次跳。发送包时设置此数字，每个处理包的路由器减一。当数字达到零时，包失效不再传输。\n\
  ![image](img/box.jpg) **Protocol（协议）** 该字段表示 `IP` 包内部是 `TCP` 包还是 `UDP` 包。\n![image](img/box.jpg)\
  \ **Header checksum（头部校验）** 头部校验用于帮助确保包的头部数据（此列表中讨论的字段）未损坏。\n![image](img/box.jpg)\
  \ **Source IP address（源 IP 地址）** 该字段包含发送计算机的地址，在包必须重传到接收节点时需要它。\n![image](img/box.jpg)\
  \ **Destination IP address（目的 IP 地址）** 该字段包含接收节点的地址。\n![image](img/box.jpg) **Options\
  \ and padding（选项和填充）** IP 包头部的最后两个字段用于请求任何路由指令或指定包发送的时间。\n![image](img/box.jpg)\
  \ **Data（数据）** IP 包的最后一个字段是实际发送的数据。\n\nIP 地址长度为 32 位，理论最大地址数量为 $2^{32}$，约 43 亿。为了方便处理和高效路由它们，它们被分成四个\
  \ `octets`（字节），每个字节长度相等。因此，在十进制法中，IP 地址表示为 `xxx.xxx.xxx.xxx`，其中每个 `xxx` 代表 0 到 255\
  \ 的数字。0、127 和 255 通常保留特殊用途，因此通常不可分配给节点。每个字节剩余的 253 个唯一地址可分配。Internet 上的地址通过目前由 Internet\
  \ 地址与数字机构（`ICANN`）管理的地址注册服务保证是唯一的。域名和地址的实际注册通过许多注册商处理，包括 InterNIC、Network Solutions\
  \ 等公司。\n\n## 帮助！地址快用完了！\n\n当前的 IP 实现称为 IP 版本 4（`IPv4`），正接近地址耗尽的边缘。1994 年，发布了一项建议来解决这一限制。被称为下一代\
  \ IP（`IPng`，现在称为 IP 版本 6（`IPv6`））的新版本 IP 将地址长度从 32 位增加到 128 位来解决寻址限制。这提供了 $3.4 \\\
  times 10^{38}$（34 后跟 37 个零，或约 340 万亿亿）唯一地址，应该为所有可能的 Internet 地址留出足够的空间，甚至允许冰箱、烤面包机和汽车拥有自己的\
  \ IP 地址！\n\n`ICANN` 如下分配三大类地址，分别为 A、B 和 C：\n\n![image](img/box.jpg) 对于 A 类地址，`ICANN`\
  \ 在第一个字节为所有者分配一个数字。然后所有者可以自由使用剩余三个字节中的所有组合。例如，A 类地址可能是 `57.xxx.xxx.xxx`。A 类地址允许所有者寻址约\
  \ 1650 万个唯一节点。\n![image](img/box.jpg) B 类地址定义前两个字节，留下两个字节供所有者使用。例如，`223.55.xxx.xxx`\
  \ 将是一个有效的 B 类地址分配。B 类地址允许持有者拥有约 65,000 个唯一节点。\n![image](img/box.jpg) C 类遵循此规律，定义前三个字节，仅留最后一个字节供\
  \ C 类所有者分配。所有者可以分配最多 255 个唯一地址。\n\n互联网服务提供商（`ISP`）可能拥有 A 类或 B 类地址，然后可以在自己的地址结构内处理若干\
  \ C 类地址。更换 ISP 即使对于拥有有效 C 类地址的公司，也意味着将公司的地址从第一个 `ISP` 可提供的 C 类地址更改为新 `ISP` 可提供的\
  \ C 类地址。\n\n如之前所述，地址 0、127 和 255 是保留的。通常，地址 0——如 `123.65.101.0`——保留给网络本身。127 是用于某些类型测试的*回环地址*。255\
  \ 指向网络上的所有计算机，因此指向 `223.65.101.255` 的广播消息将到达 `223.65.101.xxx`。\n\n## IP 子网划分\n\n\
  假设一家公司有三个通过以太链路连接的网络。每个网络有大约 25 个节点。每个楼都有自己的服务器和打印机。网络之间的以太链路传输信息是必要的，例如电子邮件或会计交易。在这种情况下公司如何分配\
  \ IP 地址？\n\n公司可以请求一组 C 类地址，然后以某种方式将这些地址分配到三个网络。这看起来是一个简单的解决方案，但由于几个原因，实际上是一个很糟糕的想法。通常，大量的网络流量发送到单个\
  \ netid 内的每个 hostid。在这种情况下，建筑之间的慢以太链路将变成巨大的瓶颈，整个网络的功能将非常糟糕。\n\n另一个主意是为每个楼使用独立的 C\
  \ 类地址（netid）。这是一个相对简单的解决方案，而且运行良好，但问题是 ISP 可能无法分配三个独立的 C 类地址。此外，这将极大地浪费可用的 IP 地址池。在这种情况下，每个楼无缘地浪费了\
  \ 200 多个地址。\n\n如果有一种方法可以划分 C 类地址，以便每个楼都有自己的*虚拟*netid 呢？这种解决方案正是子网划分（subnetting）的核心。*子网划分*允许你将一个（通常是\
  \ C 类地址的）*hostid* 范围划分到两个或多个网络中。子网划分通过使用子网掩码来实现，子网掩码将在下一节讨论。\n\n\n\n\n\n| ![image](img/common.jpg)\
  \ | **注意** 要理解子网划分，你首先需要理解 IP 地址的二进制表示。若要快速了解二进制数的工作原理，请参第 1 章。 |\n\n## IP 地址：公有还是私有？\n\
  \n由 ICANN 管理的 IP 地址用于公共互联网。大多数公司仅拥有——或需要——几个公有地址，即使它们的本地局域网（LAN）上有数百台计算机。\n\n公有\
  \ IP 地址是计算机需要在公共互联网上访问的地址。例如，一家小公司可能只需要几个地址——例如，一个用于公司的整体互联网连接，一个用于公司面向公众的 Web 服务器，还有一个一个用于公司的电子邮件系统。较大的公司可能需要多一些，但对于大多数公司来说，数量通常不会很大。\n\
  \n公司内部所有其他需要 IP 地址的计算机、服务器和其他设备通常都使用私有地址，该地址仅在公司的局域网内可访问。这些地址通常以 `10.xxx.xxx.xxx`\
  \ 或 `192.168.xxx.xxx` 开头。这些范围被定义为私有 IP 地址范围，它们在公共互联网路由器上是不可路由的。然而，在特定的私网络内部，它们是可以路由的，并且可以像下一节那样进行子网划分。\n\
  \n如果你的家用计算机连接到无线路由器，它将使用私有 IP 地址。在 Windows 中，你可以打开命令提示符并输入命令 `IPCONFIG` 来获取你的计算机使用的具体地址。\n\
  \n## 子网掩码\n\n如果你查看计算机的 IP 配置，你会发现计算机始终拥有 IP 地址（例如 `205.143.60.109`）和`子网掩码`（例如 `255.255.255.0`）。子网掩码定义了计算机\
  \ IP 地址的哪些是网络 ID（netid），哪部分是主机 ID（hostid）。为了清楚地看到这一点，你需要用二进制形式表示地址：\n\n![image](img/p94-01.jpg)\n\
  \n地址的 netid 由子网掩码定义，是地址中在对应子网掩码中二进制为 1 的部分。在上例中，netid 是完整的前三个字节（前 24 位），而 hostid\
  \ 是最后一个字节（后 8 位）。现在你明白为什么`255`（十）在子网掩码中被如此频繁使用了：`255` 对应于 8 位数中的所有位都设置为 1。\n\n![](img/line1.jpg)\n\
  \n| ![image](img/common.jpg) | **注意** 子网掩码应始终使用连续的 1，从左向右开始。子网掩码的 hostid 部分应包含所有连续的\
  \ 0，从右向左回溯。虽然在理论上可以构建具有交替 1 和 0 的子网掩码，但在实践中绝不会这样做，因为这会使管理迅速变得过于复杂，而且没有实际理由去这样做。此外，hostid\
  \ 地址中被子网掩码的部分不能由全 0 或全 1 组成。虽然某些 IP 实现允许全 0，但这种配置不属于被接受的标准 IP 规则部分，因此使用此类 hostid\
  \ 地址是有风险的，因为网络上的某些设备可能无法识别它。 |\n\n现在让我们回到那个拥有三栋大楼的公司的示例。如果公司可以划分单个 C 类地址，以便每栋大楼都能使用自己的部分，并且连接大楼的路由器能够理解哪些传输应该转发到其他大楼，哪些不应该呢？这种配置正是子网掩码有用之处。\n\
  \n子网掩码允许你从 hostid 中“借用”一些位，然后使用这些位来创建新的 netid。例如，你需要从 C 类地址（第四个字节）借用三位，并使用该地址创建四个独立的\
  \ netid。检查此配置在二进制格式下的工作原理：\n\n![image](img/p94-02.jpg)\n\n使用这种配置，公司可以创建多达 6 个 netid，每栋大楼可以提供\
  \ 30 个可用的 hostid 地址。通过使用子网划分指定每个独立的 netid，公司可以对路由器，仅在数据包应该路由时在网络之间发送数据包。\n\n由于子网掩码本身应始终使用连续位创建，因此只有九种可能的子网掩码，如表\
  \ 6-1 所示。\n\n![](img/line.jpg)\n![image](img/tab6-1.jpg)\n![](img/line.jpg)\n\n\
  **表 6-1. 常见子网掩码** 在表 6-1 中，某些配置标记为 N/A（不适用）。由于 netid 的子网部分不能全为 0 或全为 1 的规则，这些子网掩码将导致没有可用地址。例如，考虑掩码\
  \ `224`，它使用三个 hostid 位作为 subnetid。理论上，这种配置应产生八个子网。然而，由 `000` 和 `111` 代表的子网是的。同样，`128`\
  \ 不是有效的子网掩码，因为那一个位始终是 1 或者是 0。![](img/line1.jpg)\n\n| ![image](img/common.jpg) |\
  \ **提示** 域名按照先到先得原则发放。然而，如果发生冲突，ICANN 会优先考虑有效商标的持有者。在收到有效商标信息和侵犯该商标的域名通知后，ICANN\
  \ 将通过一个过程来评估主张的真实性，并在必要时将域名从当前持有者处收回，并将名称转移给合法所有者。 |\n\n## 理解其他协议\n\n互联网上使用的相当多的其他协议也依赖于或使用了\
  \ TCP/IP。在本节中，你将学习这些协议\n\n## 域名系统 (DNS)\n\n如果你只能通过 IP 地址数字来在互联网上标识计算机，尝试跟踪它们可能会让你发疯。例如，要访问\
  \ Google 网页，你需要记住它们的主主地址，如 `209.85.171.100`。为了解决这个问题，开发了一种名为域名系统（DNS）的系统。DNS 允许人们向\
  \ ICANN——或受 ICANN 管理的有效注册局——注册域名，然后使用它们来访问互联网上的特定节点。因此，DNS 是允许你打开网页浏览器并输入 `http://www.google.com`\
  \ 来连接到互联网上特定计算机的服务。在这种情况下，`google.com` 就是域名。![](img/line1.jpg)\n\n| ![image](img/common.jpg)\
  \ | (已删除冗余提示文本内容) |\n\n域名以树状结构组织，类似于磁盘驱动器上的目录树。顶层定义了不同的*域名类型*，称为*顶级域名*（TLD）。常见的是\
  \ .com 域名类型，通常用于营利性商业实体。以下是其他常见的域名类型：\n\n![image](img/box.jpg)\n- .edu 用于教育机构![image](img/box.jpg)\n\
  - .gov 用于政府实体![image](img/box.jpg)\n- .mil 用于军事实体![image](img/box.jpg)\n- .net 用于互联网相关实体![image](img/box.jpg)\n\
  - .org 用于非营利实体![image](img/box.jpg)\n- .*xx* 用于不同的国家，例如用于意大利的 .it 和用于德国的 .de (Deutschland)![](img/line1.jpg)\n\
  \n\n\n\n\n| ![image](img/common.jpg) | `NOTE`   近年来，系统增加了许多其他 TLD（顶级域名），例如 .biz、.info\
  \ 和 .name。你 可以在 [`www.icann.org`](http://www.icann.org) 找到 TLD 的完整列表。 |\n\n在域名内部，实体可以自由地在域名开始之前添加其他名称，这些名称通常指的是特定的主机或服务器，有时也指该域名的特定类型的服务。例如，如果你拥有\
  \ `bedrock.gov` 域名，你就可以自由地创建额外的名称，如 `quarry.bedrock.gov` 和 `flintstone.bedrock.gov`。根据标准，实际域名之前的域名名称第一部分指示了连接的是什么类型的服务。例如，[www.bedrock.gov](http://www.bedrock.gov)\
  \ 将用于 `bedrock.gov` 域名的万维网服务器，而 `ftp.bedrock.gov` 将用于 FTP 服务器。域名内部的类型类型通常会遵循这些标准，但并非总是如此。域名所有者可以自由地发明满足其特殊需求的服务类型名称。例如，某些域名持有者将他们的电子邮件服务器称为\
  \ `smtp.domain.org`；另一些人可能倾向于使用 `mail.domain.org`，还有一些人甚至使用 `mercury .domain.org`（Mercury\
  \ 是罗马神中的信使神等）。\n\n域名通过使用*域名服务器*（`DNS`）解析为 IP 地址，DNS 是接受输入的域名、执行数据库查询并然后返回应用于该域名的实际地址的服务器。通常，每个\
  \ ISP（互联网服务提供商）都维护自己的 `DNS`（许多公司和组织也维护自己的 `DNS`）。任何更改都会迅速传播到整个互联网的 `DNS` 中，通常在一个小时内完成。\n\
  \n| ![image](img/common.jpg) | `NOTE`   DNS 条目的更改过去需要几天时间才能传播到整个互联网，但现在的系统更新允许更改传播得快得多——通常在更改发布后的几分钟内即可完成。\
  \ |\n\n## 动态主机配置协议\n\n在基于 TCP/IP 的网络早期，管理员在文本文件或对话框中定义每个节点的地址。从那时起，除非有人更改，否则地址是固定的。问题是管理员偶尔会误将将冲突的地址放入网络上的其他节点中，导致网络版本的混乱。为了解决这个问题并使分配\
  \ TCP/IP 地址变得更容易，发明了一种名为动态主机配置协议（`DHCP`）的服务。\n\n`DHCP` 服务运行在 `DHCP` 服务器上，它们在那里控制一组称为*范围*（*scope*）的\
  \ IP 地址。当节点连接到网络时，它们联系 `DHCP` 服务器以获取一个它们可以使用的分配地址。来自 `DHCP` 服务器的地址被认为*租用*给使用它的客户端，这意味着在它们过期并供其他节点使用之前，它们在一段特定时间内会一直被分配给某个特定的节点。通常，租用期仅为几天，但网络管理员可以设置他们想要的任何时间段。\n\
  \n`DHCP` 服务器使用*动态分配*分配大多数地址，即地址从可用地址池中自动分配，并且对于特定的计算机，分配的地址可能会随时间而变化。`DHCP` 服务器还可以使用*静态分配*分配地址，你将特定计算机的\
  \ `MAC` 地址与特定的 IP 地址配对，然后该特定计算机将始终拥有相同的地址。\n\n你不应该为提供网络服务的节点使用 `DHCP` 动态分配，特别是为在互联网上提供服务的服务器。这是因为更改\
  \ TCP/IP 地址将导致无法可靠地连接到这些计算机。相反，使用 `DHCP` 动态分配来支持不需要为其他节点托管服务的客户端工作站，并对应为给定设备保持固定的\
  \ IP 地址使用静态分配。\n\n## 主机\n\n你可能认为*主机*（*host*）是一个服务器，在某些网络上下文中，你是正确的。然而，在互联网名称和地址的术语中，每个具有\
  \ IP 地址的计算机都被称为*主机*（*host*），因此得名为动态主机配置协议。记住每台计算机都被称为主机在 UNIX 和 Linux 世界中尤为重要，在那里的该术语比\
  \ Windows 或 Macintosh 世界要常见得多。\n\n## 超文本传输协议\n\n万维网由使用称为超文本标记语言（`HTML`）的格式语言的文档组成。这些文档由显示的文本、图形图像、格式命令以及指向\
  \ Web 某处其他文档的超链接组成。`HTML` 文档通常使用网络浏览器显示，例如 Mozilla Firefox 或 Microsoft Internet\
  \ Explorer。\n\n一种称为超文本传输协议（`HTTP`）的协议控制网络客户端和网络服务器之间的事务。`HTTP` 是一种应用层协议。`HTTP` 协议透明地利用\
  \ `DNS` 和其他互联网协议在网络客户端和网络服务器之间建立连接，使用使用户只感知到网站的域名和文档本身的名字。\n\n`HTTP` 从根本上是不安全的协议。基于文本的信息在客户端和服务器之间以“明文”发送。为了满足安全网络网络的需求，提供了替代方案，例如安全超文本传输（`HTTPS`）和安全套接层（`SSL`）。\n\
  \n从网络客户端到网络服务器的请求是面向连接的，但它们不是持久的。一旦客户端收到 `HTML` 页面的内容，连接就不再激活状态。点击 `HTML` 文档中的超链接将重新激活链接，指向原始服务器（如果链接指向那里）或指向其他地方服务器。\n\
  \n## 文件传输协议\n\n`FTP` 缩写代表两个含义：文件传输协议和文件传输程序（使用文件传输协议的程序）。它就像，“它既是甜点酱料*又是*地板抛光剂”（出自《周六夜现场》电视节目）。由于\
  \ `FTP`（程序）使用 `FTP`（协议），可能会混淆所讨论的是哪一个。本节将讨论协议。（当我指的是程序时，我会说明。）\n\n`FTP` 是一种用于在 `FTP`\
  \ 客户端和 `FTP` 服务器之间发送和接收文件的应用层协议。通常，这通过 `FTP` 程序或其他也可以使用该协议的程序完成（有很多可用）。`FTP` 传输可以是文本的或二进制的，并且它们可以处理任何大小的文件。\n\
  \n当你连接到 `FTP` 服务器传输文件时，你使用有效的用户名和密码登录 `FTP` 服务器。然而，某些站点被设定为允许*匿名 FTP*，你输入用户名 `anonymous`，然后输入你的电子邮件地址作为密码。例如，Mozilla\
  \ 维护一个你可以使用的 `FTP` 站点来下载 Firefox 浏览器和其他产品的开发版本，位于 `ftp.mozilla.org`，它允许匿名 `FTP`。\n\
  \n\n\n\n\n| ![image](img/common.jpg) | `TIP` 最新版本的 Windows 还支持使用 Internet Explorer\
  \ 进行 FTP 连接。只需打开 Internet Explorer，不要在地址栏中输入 `http://address`，而是输入以 `ftp://` 开头的地址。例如，要连接到\
  \ Mozilla 的 FTP 服务器，您将使用地址 `ftp://ftp.mozilla.org`。这种技巧在大多数其他当前的浏览器（如 Mozilla Firefox）中也有效。请注意，对于需要登录的\
  \ FTP 站点，浏览器必须支持登录。在 Internet Explorer 中，浏览到 FTP 站点后，文件菜单中提供“登录为”（Logon As）选项。 |\n\
  \n## 网络新闻传输协议\n\nUsenet (NetNews) 是一系列致力于极其广泛主题的讨论组。目前存在超过 100,000 个这样的组。Usenet\
  \ 会话被发布到 Usenet 服务器上，然后由这些服务器将消息回传到全球的所有其他 Usenet 服务器。一条发布的消息可以在几小时内传输到所有 Usenet\
  \ 服务器，并供访问任何特定 Usenet 服务器的用户使用。\n\nUsenet 讨论组被松散地组织成树形结构的分支。以下是一些主要分支：\n\n![image](img/box.jpg)\n\
  \n- `Alt`，用于替代生活方式和其他杂杂主题的讨论！\n- ![image](img/box.jpg) `Comp`，用于计算机相关的讨论！\n- ![image](img/box.jpg)\
  \ `Gov`，用于政府相关的讨论！\n- ![image](img/box.jpg) `Rec`，专注于娱乐！\n- ![image](img/box.jpg)\
  \ `Sci`，用于科学相关的讨论。\n\nUsenet 组可以是公开的（回传到其他 Usenet 服务器），也可以是私有的（通常由特定组织托管，并要求用户在阅读和发布消息之前输入正确的登录凭据）。\n\
  \n网络新闻传输协议 (`NNTP`) 协议是让 Usenet 可能的关键。它允许 Usenet 阅读器（也称为 `news reader`）与 Usenet\
  \ 服务器之间建立连接。它还提供了消息格式支持，因此消息可以是文本的，也可以包含二进制附件。Usenet 发布内容中的二进制附件通常使用多用途互联网邮件编码 (`MIME`)\
  \ 进行编码，该标准也用于大多数电子邮件附件。一些旧系统使用不同的方法来编码附件，包括一种名为 `UUEncode/UUDecode` 的方法，以及在 Macintosh\
  \ 上一种名为 `BinHex` 的方法。\n\n## Telnet\n\n`Telnet` 定义了一种协议，允许与 Internet 主机建立远程终端会话，使得远程用户可以获得类似于直接连接到主机计算机的终端的访问权限。通过\
  \ `Telnet`，用户可以控制远程主机，执行诸如管理文件、运行应用程序或甚至（在适当权限的情况下）管理远程系统等任务。`Telnet` 是 OSI 模型中的会话层协议。\n\
  \n为了让 `Telnet` 正常工作，服务器和客户端计算机都必须运行 `Telnet` 软件。你在客户端计算机上运行 `Telnet` 程序，并在服务器计算机上运行\
  \ `Telnetd` 程序以允许连接。`Telnet` 专门针对 `TCP` 协议，并通常运行在端口 `23` 上（尽管它可以运行在服务器系统上启用的任何端口上）。一旦用户使用\
  \ `Telnet` 连接，他们必须使用与从直接连接的终端工作时相同的凭据登录远程系统。\n\n## 简单邮件传输协议\n\n电子邮件在互联网上的起步有些波折，早期的电子邮件程序与其他电子邮件程序共享的标准较少，特别是在处理附加二进制数据方面。好消息是，这种情况现在已经解决，所有当前的电子邮件软件都支持所有广泛接受的标准。\n\
  \n简单邮件传输协议 (`SMTP`) 用于从一个电子邮件服务器向另一个发送和接收电子邮件消息。`SMTP` 协议定义了发送系统与接收系统之间的对话。\n\n\
  `SMTP` 对话始于发送系统连接到接收系统的端口 `25`。连接建立后，发送系统发送一条 `HELO` 命令，紧接着是其自己的地址。接收系统确认 `HELO`\
  \ 命令并提供其自己的地址。对话继续，发送系统发出一个命令指示该系统想要发送消息，并识别目标消息的接收者。如果接收系统知道收件者，它将确认请求，然后发送系统传输消息正文以及任何附件。最后，一旦接收系统确认已收到整条消息，两个系统之间的连接就会终止。图\
  \ 6-2 解释了这一过程。\n\n![](img/line.jpg)![image](img/fig6-2.jpg)![](img/line.jpg)\n\n\
  **图 6-2.** 系统之间 SMTP 对话的示例\n![](img/line1.jpg)\n\n| ![image](img/common.jpg) | `TIP`\
  \ 关于 SMTP 的细节可以在 RFC 821 ([`www.faqs.org/rfcs/rfc821.html`](http://www.faqs.org/rfcs/rfc821.html))\
  \ 中找到。 |\n\n\n\n\n\n# 语音 IP (Voice over IP)\n\n一组重要的新兴 IP 协议涉及在基于 IP 的网络上传输语音和传真信息，被称为\
  \ `Voice over IP`，简称为 `VoIP`（发音为“voyp”）。`VoIP` 是一种允许将用于电话通话的模拟语音数据数字化，然后封装成 IP 数据包并在网络上进行传输的协议。`VoIP`\
  \ 可用于在任何 IP 网络（如公司的本地局域网 (LAN) 或广域网 (WAN) 或互联网）上传输语音电话通话。\n\n## VoIP 的优势\n\n在 IP\
  \ 网络上发送语音数据具有非常吸引人的潜在收益。之一是更高效地利用可用连接。\n\n考虑一家拥有两个主要办公室的大型公司。在任何时刻，这两个办公室之间可能正在进行数百次语音对话。每个传统的语音连接都会占用一条\
  \ `DS0` 线路（一次可以携带一次通话的电话线），如果以数字方式使用该线路，它可以携带高达 56 Kbps 的数据。每次对话并没有使用该线路上的所有可用带宽。部分原因是因为大多数对话有很多沉默空白期——词语或句子之间的停顿、一方停止说话另一方开始说话的时刻等等。此外，大多数对话如果经过数字编码，可以被大幅压缩。将所有因素加起来，每次语音对话可能只使用单个\
  \ `DS0` 电路可用带宽的三分之一到二分之一。\n\n如果你能够以数字方式承载所有这些语音对话，所需的带宽将少得多。例如，对于 100 组两人对话，不需要\
  \ 200 条 `DS0` 线路；如果对这些对话进行数字封装，同样的对话可能可能只占用相当于 25 到 33 条 `DS0` 线路。此外，这些对话不再消耗交换电话连接，而是可以作为大型数据连接的一部分、甚至通过互联网进行传输。许多公司通过使用\
  \ `VoIP` 可以节省大量的资金。\n\n`VoIP` 的另一个优势是连接是面向包的。当用户拨打电话时，呼叫者和接收者之间会形成一个单一连接。该连接在通话期间是静态的。然而，如果对话被数字化并通过面向包的网络发送，则每个数据包都将有许多可能的路径，并且会自动获得更多的冗余性。例如，如果两点之间的网络部分出现故障，数据包仍然可以通过替代路由到达目的地，就像数据包在互联网上传输一样。此外，可用电路将得到更有效的利用，允许在特定的地理区域内路由更多的通话。\n\
  \n## VoIP 的劣势\n\n`VoIP` 也有一些你需要考虑的劣势：\n\n![image](img/box.jpg)\n\n### 不保证交付\n`VoIP`\
  \ 不保证 IP 数据包在互联网上的交付。对于数据的数字传输来说，这并不是大问题；如果数据包未被确认收到，只需重新传输即可。然而，对于实时语音对话，数据包丢失会直接干扰对话，而且你无法回到过去去重传丢失的数据包。（不过，在私有\
  \ `WAN` 上，是可以保证交付的。）\n\n![image](img/box.jpg)\n\n### 数据包乱序\nIP 数据包不仅偶尔可能无法到达目的地，有时由于其他互联网流量和其他原因导致它们乱序到达。这对于传输文件等内容是可以接受的，因为数据包在全部接收后，可以在另一端按照正确的顺序重新组装。然而，对于语音等实时应用，数据包乱序到达会导致传输变得无法挽救地混乱，从而毫无用。\n\
  \n![image](img/box.jpg)\n\n### QoS 未广泛实现\n互联网的实时用途，如 `VoIP` 或多媒体流传输和时间敏感型传输，应优先于对时间不敏感的传输，例如电子邮件的传输。幸运的是，`IP`\
  \ 有一个服务质量 (`QoS`) 字段，允许用户为此原因对流量进行排序。然而，`QoS` 在互联网上并没有广泛实现。相反，`QoS` 通常需要点之间的私有 `WAN`\
  \ 连接才能得到保证。\n\n## 结论\n\n`VoIP`是一项热门的新兴技术，几乎确定成为互联网和大多数公司网络的重要部分。然而，在广泛实现这项技术以及解决本节概述的问题方面仍有许多工作要做。换句话说，如果你正在学习网络，你应该了解\
  \ `VoIP`——它是什么以及它的作用。\n\n![](img/line1.jpg)\n\n| ![image](img/common.jpg) | **注意**\
  \ 有许多公司为住宅客户提供 `VoIP` 服务，包括 AT&T、Vonage、Verizon 和许多有线电视供应商。这些公司提供的套餐允许每月仅额外支付 30\
  \ 美元即可通过现有的高带宽互联网连接进行几乎无限的通话。他们通常将必要的 `VoIP` 硬件与订阅协议包在一起。 |\n\n\n\n\n\n# 重要的专有协议比较\n\
  \n虽然基于微软、Novell 和苹果的网络都可以与 `TCP/IP` 以及之前之前讨论的所有协议协同工作，但每种类型的网络最初都是通过支持该公司独特的专有协议开始的，而且这些协议中的每一个在当前网络仍然可以找到。所有这些公司都接纳了\
  \ `TCP/IP` 并对服务器和网络客户端提供了完全支持。\n\nNovell 网络最初使用`网络数据包交换/顺序数据包交换`（`IPX/SPX`）协议。它们与\
  \ `TCP/IP` 不同，但具有可比性。`IPX`类似于 `IP`，而 `SPX` 类似于 `TCP`。\n\n微软网络最初基于由 IBM 开发的名为`网络基本输入输出系统`（`NetBIOS`）的协议。`NetBIOS`\
  \ 是一个相对高级的协议，本质上是将 `DOS` 的功能扩展到网络。微软还使用了 IBM 的`NetBIOS 扩展用户界面`（`NetBEUI`），这是 `NetBIOS`\
  \ 的增强版。\n\n苹果 Macintosh 计算机网络最初仅支持 `AppleTalk`。该协议专门设计用于在小型工作组内通过名为 `LocalTalk`\
  \ 的低带宽（原始为 230 Kbps）网络媒体共享 `Apple LaserWriter` 打印机。随着时间的推移，苹果在程度上扩展了 `AppleTalk`\
  \ 以实现文件共享和其他网络功能。然而，`AppleTalk` 仍然是一种极其低效的网络协议，即使在 `Ethernet`（在苹果的实现中称为 `EtherTalk`）上运行速度也很慢。\n\
  \n## Novell 的 IPX/SPX\n\nNovell 的 `IPX/SPX` 协议最初是 `Xerox 网络系统`（`XNS`）架构的派生物，并且与其相似。虽然\
  \ `IPX/SPX` 可以用于任何流行的网络媒体（`Ethernet`、`Token Ring` 等），但它最初是为 `Ethernet` 网络设计的，并且与该介质配合得最好。事实上，`IPX/SPX`\
  \ 协议依赖 `Ethernet MAC` 地址来生成其部分地址。`IPX/SPX` 地址是动态的，并在登录时与服务器自动协商，而不是像没有 `DHCP` 服务的\
  \ `TCP/IP` 那样进行静态设置。\n\n一个 `IPX/SPX` 网络地址由 32 位的网络地址和 48 位的节点地址组成。此外，另外 16 位用于`连接\
  \ ID`，这允许客户端与服务器之间产生最多 65,000 个唯一连接。`IPX/SPX` 的地址设计理论上允许在 1600 万个网络中的每个拥有约 281 万亿个节点。\n\
  \n`IPX/SPX` 最初仅为 `LAN` 设计，但它已经增强以支持 `WAN` 连接。虽然它通常被认为是一种“话多”协议，需要大量的发送/确认事务，但 `IPX/SPX`\
  \ 增强了突发模式能力，这增加了指向 `WAN` 的包的大小，并减少了所需的往返通信次数。`IPX/SPX` 可以路由，但前提是网络包含具备 `IPX/SPX`\
  \ 能力的路由器。\n\n## NetBIOS 和 NetBEUI\n\nIBM 最初开发 `NetBIOS` 和 `NetBEUI`是为了支持小型网络。微软作为\
  \ `LAN Manager` 的一部分采用了这些协议，`LAN Manager` 是一种构建在早期版本 `OS/2` 操作系统之上的网络操作系统。\n\n这两种协议都是不可路由的，因此每种协议仅适用于不同\
  \ `LAN` 段之间不依赖路由器的小型 `LAN`。然而，在 Windows 网络中，`NetBIOS` 可以通过名为 `NetBIOS over TCP/IP`（简称\
  \ `NBT`）的服务封装在 `TCP/IP` 包中。\n\nWindows 2000 之前的微软 `LAN` 依赖于名为 `NetBIOS Names` 的\
  \ `NetBIOS` 服务来唯一标识每个工作站。在简单的 `NetBIOS` 实现中，名称通过广播消息在所有工作站上注册。如果没有计算机已注册某个特定名称，则注册成功。但在同样使用\
  \ `TCP/IP` 的更复杂的 Windows 网络中，`NetBIOS` 名称通过使用 `Windows 内部命名服务`（`WINS`）解析为 `TCP/IP`\
  \ 地址。名称也可以使用包含在名为 `LMHOSTS`（`LAN Manager HOSTS`）的文件中的静态名称定义条目进行解析。\n\n由于某些旧的网络应用程序仍使用\
  \ `NetBIOS 名称`，`WINS` 或 `LMHOSTS` 允许此类应用程序在仅限 `TCP/IP` 的网络中继续运行。对于应用程序而言，它仍然在与 `NetBIOS`\
  \ 工作，而 `TCP/IP` 在后台执行实际工作。\n\n## AppleTalk\n\n`AppleTalk` 已经扩展为 `AppleTalk Phase\
  \ 2`，现在允许对 `AppleTalk` 包进行路由（假设具有 `AppleTalk Phase 2` 能力的路由器）。Phase 2 变体可以在 `Ethernet`、`Token\
  \ Ring` 或苹果的 `LocalTalk` 媒体上运行。在 `Ethernet` 下，`AppleTalk` 使用名为`以太网子网络接入点`（`SNAP`）的\
  \ `802.2` 帧类型变体。\n\n`AppleTalk` 在苹果 Macintosh 网络的历史，但苹果现在完全支持并推荐其计算机使用 `TCP/IP`。\n\
  \n### 本章总结\n\n本章建立在你之前章节中获得的知识之上，深入探讨了涉及几乎所有网络（包括互联网）的各种重要协议。你主要学习了 `TCP/IP` 协议，它基本上取代了\
  \ `IPX/SPX` 和 `NetBIOS/NetBEUI` 等旧协议（尽管这些旧协议在某些情况下仍在使用）。你还学习了某些特定的应用层 Internet 协议，如\
  \ `SMTP`、`DHCP` 和 `HTTP`。任何网络专业人员理解这些协议都是关重要的。\n\n如果本章讨论的协议是你唯一需要应对的那就好了，但遗憾的是，还有更多协议。某些协议针对特定功能，例如对网络的远程访问，并在本书的相应章节中讨论。其他协议仍在开发中，现在不是考虑因素，但在不久的将来可能会是。你一定会希望关注可能对网络变得重要的新兴协议。\n\
  \n下一章将关于目录服务，它使得复杂的网络更容易使用和管理。\n\n\n\n\n\n![image](img/common5.jpg)![image](img/line1.jpg)\n\
  \n在局域网（LAN）的早期，寻找服务器资源非常简单。大多数组织最初只启动文件服务器或一两个打印服务器，因此知道哪些文件、打印机和其他服务位于局域网的哪个位置是非常容易的。\n\
  \n如今，情况变得复杂得多。即使是规模较小的组织也可能有多台服务器，它们执行着不同的任务——存储不同的文件集并提供不同的互联网或内网服务，例如电子邮件服务器、Web\
  \ 托管、数据库服务器、网络服务等。\n\n目录服务的作用是为杂乱的网络环境带来条理。在本章中，你将学习目录服务的功能以及其工作原理。你还将学习目前使用的目录服务以及计划在未来使用的服务。随着目录服务在网络管理中变得日益核心，学习这些信息已成为设计、部署和管理网络日益重要的一部分。\n\
  \n## 什么是目录服务？\n\n在大多数网络中，你通过在不同的计算机上托管不同的服务来优化这些服务的功能。这样做是有意义的。将所有服务都放在一台计算机上就像把所有的鸡蛋都放在一个篮子里——如果你掉掉了篮子，所有的鸡蛋都会碎掉。此外，通过各种方式隔离网络服务，你可以获得最佳的性能、更高的可靠性和更高的安全性。\n\
  \n大多数网络都有许多需要提供的服务，这些服务通常运行在不同的服务器上。即使是相对简单的网络，现在也提供以下服务：\n\n* ![image](img/box.jpg)\
  \ 文件存储与共享\n* ![image](img/box.jpg) 打印机共享\n* ![image](img/box.jpg) 电子邮件服务\n* ![image](img/box.jpg)\
  \ 针对互联网和内网的 Web 托管\n* ![image](img/box.jpg) 数据库服务器服务\n* ![image](img/box.jpg) 特定应用服务器\n\
  * ![image](img/box.jpg) 互联网连接\n* ![image](img/box.jpg) 拨入和拨出服务\n* ![image](img/box.jpg)\
  \ 传真服务\n* ![image](img/box.jpg) 域名系统 (DNS) 服务、Windows 命名服务 (WINS) 以及动态主机配置协议 (DHCP)\
  \ 服务\n* ![image](img/box.jpg) 集中病毒检测服务\n* ![image](img/box.jpg) 备份与恢复服务\n\n这只是一个短列表。较大的组织在每项功能上都有多台共享服务器——在每栋建筑或位置通过不同的方式提供不同的服务——并且可能拥有此处列出的之外的其他服务。\n\
  \n所有这些复杂性会让网络管理迅速变得混乱。如果每台独立的服务器都需要单独管理（例如，拥有单独的用户列表、密码、组、打印机、网络配置等），那么这项工作很快就会变得几乎无法完成。\n\
  \n`Directory services` 发明是为了给网络带来条理。基本上，目录服务的工作原理就像电话簿。你不再通过名称在电话簿中查找地址和电话号码，而是向目录服务查询服务名称（例如网络文件夹或打印机的名称），目录服务会告诉你该服务所在的位置。你也可以通过属性查询目录服务。例如，如果你向目录服务查询所有为“打印机”的项目，它可以返回一个完整的列表，无论这些打印机位于组织的何处。更棒的是，目录服务让你能够轻松地浏览网络上的所有资源，并以一个按树形结构组织的统一列表的形式呈现。\n\
  \n目录服务的一个重要优势是它们消除了管理网络上任何重复内容的需要，因为目录在所有服务器之间自动共享。例如，你不需要在每台服务器上维护单独的用户列表。相反，你只需管理一组存在目录服务中的用户账户，然后为它们分配对任何服务器上特定资源的各种权限。其他资源也是一样，并在目录服务中进行集中管理。这不仅意味着你只需要管理一组对象，而且意味着用户拥有更简单的网络体验。从用户的角度来看，他们只有一个带密码的网络账户，不需要担心资源位于何处，也不需要为不同的网络服务或服务器记住多个密码。\n\
  \n![](img/line1.jpg)\n\n| ![image](img/common.jpg) | **注意** 在章中，`network resource`（网络资源）一词是指网络上的任何离散资源，例如用户账户、安全组定义、电子邮件分配列表、存储卷、文件夹或文件。`directory`（目录）是指目录服务使用的目录，而不是硬盘上的目录。\
  \ |\n\n\n\n\n为了提供冗余，目录服务通常运行在组织内的多台服务器上，每台服务器都拥有一整个目录服务数据库的完整副本。由于目录服务是网络运行的核心，这种方法可以确保当任何一台运行目录服务的服务器发生故障时，整个网络能够继续运行。并未实际托管目录服务副本的服务器，仍然通过与目录服务器进行通信来使用该目录服务。例如，如果用户尝试打开一个托管在并未实际托管目录服务的服务器上的文件，该服务器将自动查询另一台服务器上的目录服务，以验证用户的访问请求。对于用户来说，这一切都是在后台完成的。\n\
  \n你应该了解五种重要的目录服务：Novell eDirectory、微软的 Windows NT 域、微软的 Active Directory（活动目录）、X.500\
  \ 目录访问协议（DAP）以及轻量级目录访问协议（LDAP）。这些将在本章稍后部分介绍。\n\n## 森林、根节点、树和叶节点\n\n所有目录服务的共同点是基于树的组织结构（树通常以倒置方式表示，根节点位于顶部），这与磁盘上目录的组织方式相似。`forest`（森林）是一个共同管理的树的集合。每个目录树的顶部是\
  \ `root`（根节点）项，它包含其他项。这些其他项可以是容器或叶节点。`container object`（容器对象）是指包含其他对象的对象，其中也可以包括更多的容器和叶节点。`leaf\
  \ object`（叶节点对象）代表网络上的实际资源，如工作站、打印机、共享目录、文件或用户账户。叶节点对象不能包含其他对象。图 7-1 显示了一个典型的目录树。\n\
  \n![](img/line.jpg)![image](img/fig7-1.jpg)![](img/line.jpg)\n\n**图 7-1.** 典型的目录树\n\
  \n目录树中的所有对象都具有`attributes`（属性，有时称为属性），这些属性取决于所依附属性的对象类型。例如，`printer leaf object`（打印机叶节点对象）可能包含描述打印机、谁可以管理打印机、打印机在网络上的名称等属性。`user\
  \ account leaf object`（用户账户叶节点对象）可能包含用户账户全名、密码以及用户可以访问的资源在内的属性。附加到各个叶节点或容器对象上的属性细节在所有目录服务中有所不同，尽管它们通常使用相似的属性。\n\
  \n## 冗余部门\n\n对于任何依赖目录服务的网络来说，保持目录服务的运行至关重要。由于它们包含了有关账户、资源和安全的所有细节，目录服务的缺失意味着网络将完全无法工作！由于目录服务对网络变得如此重要，你必须通过某种程度的冗余来保护它们。正如前面提到的，在多台服务器上保留目录的重复副本提供了必要的冗余。这通过两种方法之一来实现：\n\
  \n![image](img/box.jpg)\n\n在`primary/backup model`（主/备模型）中，单个主数据库包含位于某台服务器上的主（或“真实”）目录，而其他服务器持有一个或多个备份副本。如果主副本由于某些原因停止工作，备份副本可以继续为网络提供目录服务，用户甚至完全不知道主副本不可用。Windows\
  \ NT 域使用了主/备方法。\n\n![image](img/box.jpg)\n\n在`multimaster model`（多主节点模型）中，存在多个目录服务器，但它们彼此是对等关系。如果其中一台宕机，其他对等节点将继续正常运行。多主模型的优势在于，每个目录服务器都可以完全参与目录服务的工作。Windows\
  \ 2000 Server 及更高版本的 Active Directory 使用了多主节点方法。\n\n目录服务器——无论使用主/备方法还是多主节点方法——必须与网络上的变化保持同步。各个数据库通过一个名为`replication`（复制）的过程保持同步，在此过程中，对任何单个目录数据库的更改都会透明地更新到所有其他目录服务数据库。\n\
  \n然而，任何复制过程都存在一个潜在问题：如果对两个不同的目录服务器上对同一个叶节点对象进行了两次更改，且这些更改不同，当更改在复制过程中发生“冲突”时，系统会做什么？不同的目录服务处理此问题的方式略有不同。在\
  \ Novell eDirectory 的情况下，更改的时间戳决定了两个冲突更改中哪一个胜出。（正因如此，运行 eDirectory 的服务器必须仔细保持时间同步；这种同步也在复制过程中进行处理。）微软的\
  \ Active Directory 不使用时间戳，而是使用一种巧妙方案中的序列号来避免时间戳方法带来的潜在问题。（尽管 eDirectory 服务器会同步时间，但时间在两次同步之间仍然可能变得不同步。）\n\
  \n某些目录服务还允许名为 `partitioning`（分区）的概念，即不同的目录服务器保留整个目录树的不同部分。在这种情况下，一个控制目录服务器通常管理整个树（在\
  \ Active Directory 中称为 `global catalog` 全局目录），然后其他目录服务器可以管理总树的较小部分。分区对于通过广域网（WAN）连接的多个局域网（LAN）的网络非常重要。在这种情况下，你希望在本地托管与特定\
  \ LAN 相关的分区，但仍允许通过 WAN 访问的资源访问整个树。每个 LAN 托管自己的分区，但在需要时仍访问总树。你安排分区（并设置计划复制时间）以最有效地利用\
  \ WAN 的性能，而 WAN 的速度通常比 LAN 慢。\n\n## 学习特定的目录服务\n\n有许多不同的目录服务可用。选择其中一种通常与选择主网络操作系统同步进行，尽管情况并不总是如此。eDirectory\
  \ 和 Active Directory 分别都可以处理非 Novell 和非微软的服务器。因此，即使是目前主要使用服务器的网络，可能在某些事情上仍然依赖 eDirectory。在不同的操作系统上使用单一目录服务通常是因为一个组织最初倾向于某种特定的操作系统，然后发现自己被迫支持额外的操作系统，但该组织仍然希望维护一个连贯的、单一的目录服务来管理网络。以下是主要的目录服务：\n\
  \n`Novell eDirectory`（以前称为 Novell Directory Services，或 `NDS`）是可用时间最长的网络目录服务。eDirectory\
  \ 运行在 `NetWare 4.x` 及更高版本的服务器上，也适用于其他服务器系统（如 Solaris、Linux 和 Windows），让你能够将 eDirectory\
  \ 作为单一目录服务来管理多厂商网络。\n\n![image](img/box.jpg)\n\n`Windows NT 域`（随 Windows NT 4 引入）实际上并不是完整的目录服务，但它们提供了目录服务的一些功能和优势。![image](img/box.jpg)\n\
  \n`Microsoft 的 Active Directory` 随着 Windows 2000 Server 系列首次发布。这是一个真正的目录服务，它为主要使用\
  \ Windows 服务器构建的网络带了目录服务的全完整功能。Active Directory 可能是目前使用最广泛的目录服务。![image](img/box.jpg)\n\
  \n`X.500 目录访问协议`（DAP）是一项功能丰富的国际标准目录服务。然而，X.500 提供的功能如此之，以至于其开销使得部署和管理变得望而却畏。因此，X500\
  \ 处于一个有趣的地位：它是一项重要的标准，但矛盾的是，它实际上并没有被使用。![image](img/box.jpg)\n\n`轻量级目录访问协议`（LDAP）由供应商联盟作为\
  \ X500 的子集开发，以提供一种复杂度更低的替代方案。LDAP 广泛用于电子邮件目录，并适用于其他目录服务任务。最新版本的 eDirectory 和 Active\
  \ Directory 都与 LDAP 兼容。\n\n### eDirectory\n\nNovell eDirectory 自 1993 年以来可用，作为 `NetWare\
  \ 4.x` 的一部分以 `NDS` 引入。该产品是一个真正的福音，并在 Novell 网络中被迅速实施，特别是在拥有许多 NetWare 服务器并急需其功能的大型组织中。eDirectory\
  \ 是一个可靠、健壮的目录服务。eDirectory 对目录服务器使用主/备方法，并允许对树进行分区。除了运行在 Novell 操作系统上，eDirectory\
  \ 还适用于 Windows、AIX 和 Linux。该产品与此类系统的兼容性使其成为在单一目录结构下管理所有平台的良好选择。你从一个登录网络并具有管理权限的客户端计算机上管理\
  \ eDirectory 树。你可以使用设计用于管理树的图形化工具，如 Novell Identity Manager，或其他模拟其运行的操作系统外观和感受的工具（这些工具也由\
  \ Novell 提供）。eDirectory 树包含许多不同类型的对象。标准目录服务——国家、组织和组织单元——都被包含在内。系统还有表示安全组、NetWare\
  \ 服务器卷的对象。eDirectory 可以管理树中超过十亿个对象。\n\n### Windows NT 域\n\nWindows NT 域模型将组织分为称为\
  \ `domains`（域）的区块，所有这些区块都是组织的一部分。域通常按地理位置组织，这有助于跨 WAN 链路的域与域通信，尽管你可以根据意愿组织域。每个域都由一个\
  \ `primary domain`（主域）控制，所有这些都是组织的一部分。一个主数据库包含某台服务器上的主（或“真实”）目录，而其他服务器持有一个或多个备份副本。如果主副本由于某些原因停止工作，备份副本可以继续为网络提供目录服务，用户甚至完全不知道主副本不可用。Windows\
  \ NT 域使用了主/备方法。\n\n在`multimaster model`（多主节点模型）中，存在多个目录服务器，但它们彼此是对等关系。如果其中一台宕机，其他对等节点将继续正常运行。多主模型的优势在于，每个目录服务器都可以完全参与目录服务的工作。Windows\
  \ 2000 Server 及更高版本的 Active Directory 使用了多主节点方法。\n\n目录服务器——无论使用主/备方法还是多主节点方法——必须与网络上的变化保持同步。各个数据库通过一个名为`replication`（复制）的过程保持同步，在此过程中，对任何单个目录数据库的更改都会透明地更新到所有其他目录服务数据库。\n\
  \n然而，任何复制过程都存在一个潜在问题：如果对两个不同的目录服务器上对同一个叶节点对象进行了两次更改，且这些更改不同，当更改在复制过程中发生“冲突”时，系统会做什么？不同的目录服务处理此问题的方式略有不同。在\
  \ Novell eDirectory 的情况下，更改的时间戳决定了两个冲突更改中哪一个胜出。（正因如此，运行 eDirectory 的服务器必须仔细保持时间同步；这种同步也在复制过程中进行处理。）微软的\
