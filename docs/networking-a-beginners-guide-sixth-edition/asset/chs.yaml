  - **登录**：向计算机或网络提供账户和身份验证信息（如密码）以访问其资源的过程。\n- **登录脚本**：当用户登录计算机或网络时自动运行的一系列命令。\n\
  - **MAC**：介质访问控制。OSI 网络模型的一个子层（第二层）。`IEEE 802.x` 网络将第二层分为 `MAC` 层和逻辑链路控制 (`LLC`)\
