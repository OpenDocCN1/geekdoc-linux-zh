  \n## 管理 Apache Web 服务器\n\n你需要对 Apache 服务器执行许多基本管理任务，尤其是是将网站发布到新安装的 Apache 服务器上。本节简要描述基本管理任务。\n\
  \n### 停止和启动 Apache\n\n你使用名为 `apachectl` 的脚本文件来启动和停止服务器。对于默认 Oracle Linux 安装，`apachectl`\
  \ 文件位于 `/usr/sbin` 目录下，并接受三个主要参数：`start`、`stop` 和 `restart`。例如，以下命令将重启服务器：![image](img/p340-01.jpg)\n\
  \n### 修改 Apache 配置\n\n在本章前面所述，Apache 本质上通过文本配置文件控制，其中主文件名为 `httpd.conf`。`httpd.conf`\
  \ 文件位于 `/etc/httpd/conf/` 目录下。\n\n`httpd.conf` 文件通过文件中包含的文本指令以及相关设置来实现。例如，以下指令定义了\
