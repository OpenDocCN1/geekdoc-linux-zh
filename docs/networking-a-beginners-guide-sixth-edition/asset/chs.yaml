  \ `RAM` 出现奇偶错误的消息，或服务器在安装期间意外死机。即使这些问题没有再次出现，也要咨询服务器制造商。（如果发生此类情况，请务必仔细记录下你注意到的任何信息或其他情况。）服务器往往在最不恰宜的时间发生故障，因此在将其提供给用户之前，确保你对服务器有完全信心。在投入使用之前，让服务器运行其生产软件配置几天作为额外的测试也可能是有意义的。特别要确保在测试过程中让所有潜在的\
