  \ `partitioning`（分区）的概念，即不同的目录服务器保留整个目录树的不同部分。在这种情况下，一个控制目录服务器通常管理整个树（在 Active Directory\
  \ 中称为 `global catalog` 全局目录），然后其他目录服务器可以管理总树的较小部分。分区对于通过广域网（WAN）连接的多个局域网（LAN）的网络非常重要。在这种情况下，你希望在本地托管与特定\
  \ LAN 相关的分区，但仍允许通过 WAN 访问的资源访问整个树。每个 LAN 托管自己的分区，但在需要时仍访问总树。你安排分区（并设置计划复制时间）以最有效地利用\
