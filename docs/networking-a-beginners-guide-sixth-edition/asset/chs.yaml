  \n`uname` 打印操作系统名称等信息可能看起来奇怪，因为用户显然知道该名称是 Linux。然而，这种信息实际上非常有用，因为你可以在几乎所有的 UNIX\
  \ 类操作系统中找到 `uname`。因此，如果你在 SGI 工作站上并输入 `uname -s`，工具将返回 IRIX；如果你在 Sun 工作站上输入该命令，它将返回\
  \ SunOS；依此类推。在异构环境中工作的人经常发现，编写脚本使其根据操作系统类型表现出不同的行为是有用的，而 `uname` 提供了一种非常一致的方法来确定这些信息。\n\
  \n### who：查找谁登录了\n\n在管理允许人们登录到他人机器或设置服务器的系统时，你会想要知道谁登录了。要生成列出当前登录用户的报告，请使用 `who`\
