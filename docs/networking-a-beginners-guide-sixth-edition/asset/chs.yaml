  \ `partitioning`（分区）的概念，即不同的目录服务器保留整个目录树的不同部分。在这种情况下，一个控制目录服务器通常管理整个树（在 Active Directory\
  \ 中称为 `global catalog` 全局目录），然后其他目录服务器可以管理总树的较小部分。分区对于通过广域网（WAN）连接的多个局域网（LAN）的网络非常重要。在这种情况下，你希望在本地托管与特定\
  \ LAN 相关的分区，但仍允许通过 WAN 访问的资源访问整个树。每个 LAN 托管自己的分区，但在需要时仍访问总树。你安排分区（并设置计划复制时间）以最有效地利用\
  \ WAN 的性能，而 WAN 的速度通常比 LAN 慢。\n\n\n\n\n| ![image](img/common.jpg) | 注意：互联网上的许多标准是由称为“意见请求”（RFC）的文档控制的。这些文档描述了提议的标准，并提交给互联网工程任务组（IETF）。你可以在该小组的主页\
  \ [`www.ietf.org`](http://www.ietf.org) 上了解更多关于该小组的信息，并查阅本书（或其他处）中提到的任何网络 RFC。 |\n\
  \nLDAP 树从根节点开始，然后包含多个条目（entries）。每个条目可以有一个或多个`attributes`（属性）。每个属性都有与其关联的 `type`\
  \ 和 `values`。一个例子是通用名称（CN），它包含至少两个属性：`FirstName` 和 `Surname`。LDAP 中的所有属性都使用字符串数据类型。条目被组织成树，并按地理位置以及每个组织内部进行管理。以下四个基本模型描述了\
  \ LDAP 标准：\n\n![image](img/box.jpg)\n\n### 信息模型\n该模型定义了存储在目录中的数据结构。它描述了目录的多个方面，包括模式（schema）、类（classes）、属性（attributes）、属性语法（attribute\
  \ syntax）和条目（entries）。目录的 `schema` 是目录及其条目的模板。`Classes` 是所有条目所属的类别。`Attributes`\
  \ 是描述这些类的数据项，如 `CN` 和 `OU`。属性的 `syntax`（语法）精确规定了属性如何命名和存储，以及它们允许包含什么类型的数据（如数字、字符串文本、日期时间等）。最后，`entries`\
  \ 是不同的数据单元（类似于对象），它们可以是容器也可以是叶子节点。\n\n![](img/line1.jpg)\n\n| ![image](img/common.jpg)\
  \ | 注意：微软描述 LDAP 的术语与 RFC 中定义的术语不同。最值得注意的是，微软将 `entry` 称为 `object`，将 `attribute`\
  \ 称为 `property`。这些名称指的是相同的内容，当你在阅读 RFC 或其他关于 LDAP 的文档并将这些信息与微软文档中的信息进行比较时，应该意识到这一点。\
  \ |\n\n![image](img/box.jpg)\n\n### 命名模型\n该模型描述了如何引用和组织数据。它定义了作为目录条目主键的：`distinguished\
  \ names`（DNs，区分名，即条目的全名）以及 `relative distinguished names`（RDNs，相对区分名，即 DN 的组件）。DN\
  \ 的每个组件（例如 `CD`、`OU` 或 `O` 条目）都是一个 RDN。这是一个 LDAP DN 的示例：\n\n![image](img/p114-01.jpg)\n\
  \n![image](img/box.jpg)\n\n### 功能模型\n该模型描述了如何处理数据。它定义了 LDAP 如何完成三种类型的操作：认证（authentication）、查询（interrogation）和更新（updates）。`Authentication`\
  \ 是用户向目录证明身份的过程。`Interrogation` 是查询目录信息的过程。`Updates` 是向目录提交更改的操作。\n\n![image](img/box.jpg)\n\
  \n### 安全模型\n该模型定义了如何保持目录中数据的安全。对于大多数 LDAP 实现，使用一种名为简单身份验证与安全层（SASL）的安全协议。`RFC 2222`\
  \ 描述了 `SASL`。LDAP 的一个很棒的功能是，组织可以使用名为 `referral`（引用）的功能构建全局目录结构，由不同 LDAP 服务器管理的 LDAP\
  \ 目录查询将透明地路由到该服务器。由于每个 LDAP 服务器都知道其父级服务器和子服务器，网络中任何地方的用户都可以访问整个 LDAP 树。事实上，用户甚至不知道他们正在访问位于不同位置的不同服务器。\n\
  \n**章节总结**\n在本章中，你学习了目录服务的重要性以及驱动这种重要性的因素。你还学习了目录服务是如何运作的、它们实现了什么，以及在几乎所有目录服务中常见的共同功能。最后，逐一回顾了最重要的目录服务，包括\
  \ Novell 的 `eDirectory`、微软的域服务以及 Active Directory（活动目录）服务。\n\n下一章将继续讨论核心网络技术和服务，通过教你学习远程访问服务，通过该服务，偏远地区的用户可以从世界任何地方访问局域网（LAN）。实现一个让每个人都满意的远程访问系统是最困难的事情之一——特别是对于具有许多不同需求的大型组织来说——因此文中讨论了多种方法。\n\
  \n![image](img/common4.jpg)\n\n| **第 8 章** | ![image](img/line-1.jpg) | **远程连接：远程网络访问**\
  \ |\n\n\n\n\n\n![image](img/common5.jpg)![image](img/line1.jpg)\n\n在前面的章节中，你已经一起通过局域网（LAN）和广域网（WAN）学习了网络系统，并学习了这两种类型网络所涉及的技术。你还需要了解另一种重要的网络连接类型：网络的远程访问。在如今这种乐于旅行的企业文化下，加上公司需要支持居家办公和小型远程办公室等需求，远程访问已比以往任何时候都更加重要。遗憾的是，正如本章将看到的，正确实现它可能是一个困难的部分。\n\
  \n远程访问的大问题之一是，似乎所有的远程用户都有不同的需求，各种解决方案解决不同的需求，而没有一种解决方案能满足*所有*需求。找到满足这些需求的稳妥解决方案通常不是易事，需要花费大量的时间和精力。本章描述了你可能如何分析公司的需求，然后讨论可以为你的网络提供解决方案（或方案）的远程访问技术。\n\
  \n## 确定远程访问需求\n\n每家公司的远程用户构成都不同，他们的具体需求可能因公司而异。此外，即使需求相同，你采用的解决方案也可能根据其他标准而改变。例如，取决于远程访问的会计系统是客户端/服务器架构还是单体应用，你处理从远程访问该系统的方式可能会有所不同。\n\
  \n## 理解应用对远程访问的影响\n\n客户端/服务器应用程序由运行在服务器端和客户端的进程（程序）组成并协同工作。例如，数据库服务器为客户端执行查询，然后只向客户端传输查询结果。客户端的工作只是显示结果，并可能为了打印对其进行格式化。\n\
  \n另一方面，单体应用在单台计算机（通常是客户端计算机）上执行所有工作。单体应用的服务器仅提供应用程序运行所需的文件以及应用程序处理的数据文件。\n\n通常情况下，与单体应用相比，客户端/服务器应用程序以可接受的速度运行所需的带宽要少得多。一个较慢的网络连接对于客户端/服务器应用程序（如会计系统）可能是充足的，但对于同样设计为单体结构的相同应用程序，这种连接将完全不适用。\n\
  \n## 你需要支持什么类型的远程用户？\n\n需要远程访问的用户通常属于以下四类：\n\n![image](img/box.jpg) 广谱旅行者\n![image](img/box.jpg)\
  \ 狭窄旅行者\n![image](img/box.jpg) 远程办公室用户\n![image](img/box.jpg) 远程办公室小组\n\n每类远程用户都有不同的需求，通常需要不同的技术和远程访问解决方案才能完全满足这些需求。寻找远程访问解决方案的第一步是确定你必须支持哪几类远程用户。因此，让我们来看看这每一个远程访问用户类别。\n\
  \n*广谱旅行者*是最常见的远程访问用户类型。这类人通常在具有 LAN 访问能力的办公工作，但经常出差。旅行会将此人带到世界上几乎任何地方，因此旅行者必须应对不同的电话系统、长途运营商和其他地理挑战（参见图\
  \ 8-1）。通常，这种类型的用户主要需要电子邮件访问，偶尔访问存储或通过电子邮件发送的文件。用户可能在 LAN 上使用台式电脑，但旅行时带有笔记本电脑；可能在\
  \ LAN 上和旅行时都使用笔记本笔记本；可能在有旅行需求时从共享池中借用笔记本电脑；甚至可能为了偶尔的旅行需求租笔记本电脑。这些不同的方法进一步增加了为广谱旅行者提供服务的复杂性。\n\
  \n![](img/line.jpg)![image](img/fig8-1.jpg)![](img/line.jpg) **图 8-1.** 典型的远程访问会话\n\
  \n*狭窄旅行者*是指访问地点相对较少的人，例如从公司总部到公司的制造工厂或配送中心。由于你可以预测用户可能需要访问数据的站点，因此可以提供本地支持来帮助。例如，你可能有一种方法让用户登录分销中心的\
  \ LAN，并通过现有的 WAN 链路访问总部地点的电子邮件和文件，如图 8-2 所示。这种类型的用户需要电子邮件、文件访问，可能还需要访问集中式应用程序（如会计系统）。\n\
  \n![](img/line.jpg)![image](img/fig8-2.jpg)![](img/line.jpg) **图 8-2.** “狭窄旅行者”使用的\
  \ WAN\n\n*远程办公室用户*位于单一地点，需要访问公司 LAN 以进行电子邮件和应用程序访问（参见图 8-3）。此人通常不需要文件访问，除非通过电子邮件系统发送文件，因为此人维护着本地文件存存。由于该用户位于单一地点，因此你可以追求某些对于旅行者来说不可行的高速链路。从家里居家办公的人员属于远程办公室用户类别。\n\
  \n![](img/line.jpg)![image](img/fig8-3.jpg)![](img/line.jpg) **图 8-3.** 远程办公室用户的网络设置\n\
  \n有时，驻在远程地点的小组（二到五人）需要公司 LAN 的某些服务。这些服务对于该小组来说在本地部署并不高效，但这些用户有一个用于打印机和文件共享的小 LAN，如图\
  \ 8-4 所示。这些用户属于*远程办公室小组*类别，需要组合的服务。他们结合了 LAN 用户和远程办公室用户的特点。为了获得适当支持，他们通常需要两种类型解决方案的混合。\n\
  \n![](img/line.jpg)![image](img/fig8-4.jpg)![](img/line.jpg) **图 8-4.** 支持需要 LAN\
  \ 访问的远程办公室\n\n你通常需要不同的策略来支持这些类型的用户。当然，如果你在小公司工作，可能不需要一开始就支持所有类别。\n\n## 需要什么类型的远程访问？\n\
  \n在实施任何远程访问系统之前，你必须清晰定义用户所需的访问类型。以下是一些远程访问需求的示例：\n\n- 轻松远程访问存储在电子邮件中的邮件和文件！\n- 远程访问\
  \ LAN 上的存储或共享文件！\n- 远程访问集中式应用程序，如会计系统或销售订单系统！\n- 远程访问协作软件或自定义应用程序！\n- 互联网访问！\n-\
  \ 内网/外网访问，包括任何托管的 Web 应用程序！\n- 从固定地点远程访问的任何功能，例如远程办公室！\n- 从世界上任何地方远程访问任何功能\n\n要理解你特定的远程访问需求，必须访谈所有潜在用户（或至少是代表性用户），找出如何对他们进行分类，正如上一节所述。由于支持超过一种机制，你对用户及其需求的分类将决定哪种机制是合理的。在访谈用户时，仔细探测所有可能的需求。例如，如果你问他们是否需要访问\
  \ LAN 中存储的文件，而他们回答“不需要”，这并不是充分的答案。通过询问以下问题来确定他们：“你是否会需要访问文件？”“如果你只需要电子邮件访问怎么办？”一旦你构思了不同的远程访问需求，尝试调查用户以询问他们的具体需求。你不仅获得了不模糊的答案，还获得了关于获取和设置远程访问系统的成本的重要文档。\n\
  \n## 你需要多少带宽？\n\n在检查远程访问需求时，你需要估计不同用户的带宽需求和容忍度。对于规划以及适当设置用户预期至关重要。例如，如果销售人员需要分钟级访问跟踪系统，并且经常下载大文件包进行报价，你可能需要解释他们用于获取这些服务的可能带宽限制。或者，你可以找到与你可以提供的带宽一致的各种解决方案。\n\
  \n你可以通过实际测量应用程序使用的带宽来估计特定应用程序的带宽需求。在 LAN 上，你可以监控发送到特定节点的数据量。对于 Windows PC，你可以在客户端上运行\
  \ `System Monitor` 或 `Performance Monitor` 来查看 PC 消耗的网络流量（参见图 8-5）。对于 Windows 服务器，你可以使用\
  \ `Performance Monitor` 测量传输到客户端的数据。\n\n![](img/line.jpg)![image](img/fig8-5.jpg)![](img/line.jpg)\
  \ **图 8-5.** 使用 Windows System Monitor 查看应用程序使用的带宽\n\n如果应用程序的带宽需求太大，无法通过现有的远程连接类型（如慢速调调器连接）处理，你需要探索其他替代方案。这些包括使用远程控制解决方案（本章稍后讨论）或以不同方式使用。例如，你可能会将应用程序文件加载到远程计算机，而不是跨\
  \ LAN 使用它。此外，可能用户不需要频繁更新数据，你可以设置一种程序，让用户每周或每天晚上下载更新。\n\n满足远程访问需求的方法几乎是无限的。然而，关键在于根据你可用或建议的远程访问技术，仔细评估这些需求并工作。\n\
  \n多种不同的方法来实现用户的远程访问连接。有时这些不同的技术适用于某些用户但不适用于其他。有时你的选择受限于用户访问数据的方式。例如，单一地点的远程用户可以很容易建立到公司\
  \ LAN 的高速链路，而旅行中的远程用户可能受限于使用调速器甚至是世界其他地区的电话连接。\n\n接下来的章节将讨论不同的技术和方法，以及每种优缺点。你实施哪种取决于你确定的需求、预算以及网络的现有基础设施。\n\
  \n## 远程节点与远程控制\n\n远程用户可以通过两种基本方式连接到网络：远程节点和远程控制。*远程节点连接*是指远程计算机成为网络上的节点。数据在远程节点和网络之间的流动就像连接\
  \ LAN 用户一样，尽管通常速度较慢。当你连接到互联网提供商（ISP）来访问互联网时，你使用的是远程节点连接。*远程控制连接*是指远程用户控制另一台直接连接到\
  \ LAN 的计算机，仅传输屏幕、键盘和鼠标数据。因为托管远程服务的计算机直接连接到 LAN，其网络性能与任何 LAN 工作站一样快。实际传输的信息——屏幕信息、键盘数据和鼠标数据——通常不需要带宽。（此规则的例外是高度图形应用程序，例如计算机辅助设计程序。）远程控制连接还有在远程计算机和控制计算机之间传输文件的方法，因此仍然可以从\
  \ LAN 下载文件反之亦然。远程控制通过使用为此设计的特殊应用程序来实现。你在 LAN 连接的计算机和远程计算机上运行远程控制软件。连接通过拨号线或互联网建立。有两种类型的远程控制应用程序。第一种运行在单台计算机上并一次支持一台远程计算机。Anywhere\
  \ 和 GoToMyPC 是这种类型的示例。另一种类型允许单台计算机上运行多个会话，因此你可以允许多个用户使用连接到 LAN 的单台计算机。`NT Terminal\
  \ Server`、`Windows Terminal Services` 和 `Citrix Server` 是这种类型的示例。多用户解决方案使用 LAN 计算机的多任务处理能力构建多个\
  \ PC、窗口和桌面，类似于带有多个终端会话的主机。\n\n任何远程连接技术都可以与远程节点和远程控制共同工作。你可以通过直接连接到远程计算机的调制解调器、集成服务网络（ISDN）线路、互联网甚至通过\
  \ LAN 或 WAN 链路连接到远程控制系统。你如何判断是选择远程节点还是远程控制？考虑以下点：\n\n- 当远程用户只需要 LAN 访问和电子邮件访问时，远程节点连接可以满足这些需求，并且在连接的两端设置和维护通常更简单。\n\
  - 如果远程用户需要运行连接到 LAN 的应用程序，请选择远程控制。少数应用程序可以在远程节点连接上运行良好，前提是应用程序本身已安装在远程计算机上，且应用程序必须通过链路访问相对少的数据。例如，通过\
  \ `Outlook` 访问电子邮件在远程节点连接上运行良好，只要远程用户在本地计算机上安装了 `Outlook`。\n\n\n\n\n\n| ![image](img/common.jpg)\
  \ | **注意** Windows Server 2008 和 2012 还包含一种名为 DirectAccess 的远程访问功能。它要求远程计算机是 Active\
  \ Directory 域成员。在 Windows Server 2008 中，`RRAS` 和 `DirectAccess` 无法在域内的同一服务器上共存。然而，Windows\
  \ Server 2012 为 `DirectAccess` 了一系列改进，包括一个新的统一 `RRAS` 和 `DirectAccess` 服务器角色，该角色可以在单个服务器上运行并简化管理。\
  \ |\n\nVPN 连接主要有两种重要用途：![image](img/box.jpg)\n\n- 使用 VPN 技术在两个网络之间建立 WAN 连接，这两个网络可能相隔数千英里，但都通过某种方式访问互联网。这些通常被称为对站点\
  \ VPN 连接，在每个端端的具备能力的路由器上进行配置。![image](img/box.jpg)\n- 建立远程访问连接，允许远程用户通过互联网访问公司网络。本章的重点是远程访问，但重要的是，VPN\
  \ 支持 WAN 连接的方式与其支持远程访问连接的方式非常相似。WAN VPN 连接的主要区别在于，它是连接两个网络，而不是一个用户和一个网络，并且所使用的硬件（通常）与远程访问连接不同。WAN\
  \ VPN 连接利用两个局域网现有的互联网连接，并可能每天运行 24 小时。而远程访问连接通常在需要时建立，并在远程端使用较廉的硬件，例如拨号调制器或可能更高速度的互联网连接，如\
  \ `x`DSL、`ISDN` 或电缆调制器。![](img/line1.jpg)\n\n| ![image](img/common.jpg) | **提示**\
  \ 在某些情况下，VPN 甚至是通过公司内网托管 VPN 隧道来隔离同一位置用户与其他用户的合适方法。这种方案可能是合适的，例如，如果一组用户访问的数据非常敏感，必须以某种方式与公司其他部分分开。在这种情况下，敏感网络可以与公司局域网隔离，但防火墙允许从敏感局域网到公司局域网的\
  \ VPN 连接，反之则。这种配置仍然允许敏感局域网上的用户访问通用公司网络服务。 |\n\n### VPN 连接有若干要求：![image](img/box.jpg)\n\
  \n- VPN 连接的双方必须连接到互联网，通常使用点对点协议（`PPP`）。（其他公共或私有网络也可以传输 VPN，但讨论将集中于互联网，因为它是此目的最常用的网络。）![image](img/box.jpg)\n\
  - 双方必须具有共同的网络网络协议。该协议通常是 `TCP/IP`，也可以是 `IPX`、`NetBEUI` 或 `AppleTalk`。![image](img/box.jpg)\n\
  - 双方必须通过其现有的 `PPP` 连接建立一个隧道，数据包将该隧道通过。隧道是使用隧道协议形成的。![image](img/box.jpg)\n- 双方必须就用于穿越隧道的数据加密技术达成共识。有多种不同的加密技术可用。\n\
  \n因此，VPN 连接的双方必须运行使用兼容协议的兼容 VPN 软件。对于远程访问 VPN 解决方案，你安装的软件取决于 VPN 本身。专用 VPN 解决方案还销售客户端软件，你可以将其分发给用户。通常，此软件按副本收费，每个支持的远程端计算机费用通常在\
  \ 25 到 50 美元之间。（某些 VPN 解决方案包含无限客户端许可，但 VPN 设备的许可仅允许同时接受特定数量的连接。）\n\n如果你正在使用 Windows\
  \ 服务器以及服务器上的 `RRAS` 服务，以及远程计算机上的某个版本的 Windows，你可以利用这些网络操作系统免费附带的 VPN 软件。然而，此软件必须在每个客户端计算机上进行设置。\n\
  \n### VPN 协议\n\n用于 VPN 的最流行的三种隧道协议是点对点隧道协议（`PPTP`）、数据层隧道协议（`L2TP`）和 IP 协议安全（`IPSec`）。\n\
  \n- `PPTP` 是由微软设计的协议，可以处理 `IP`、`IPX`、`NetBEUI` 和 `AppleTalk` 数据包。`PPTP` 从 Windows\
  \ 95 开始就包含在 Windows 中，并且受到 Windows `RRAS`（`RAS` 的免费升级）以及后续版本 Windows 服务器的支持。对于面向\
  \ Windows 的网络，`PPTP` 是首选。\n- `L2TP` 是一种较新的协议，是互联网工程任务组的标准。它可能会成为最受支持的隧道协议，因为它运行在\
  \ OSI 模型的第 2 层，因此可以处理所有第 3 层协议，如 `IP`、`IPX` 和 `AppleTalk`。\n- `IPSec` 虽然可能是最安全的隧道协议，但由于其对\
  \ `IP` 的依赖，似乎在局域网到局域网 VPN 以及面向 UNIX 的 VPN 中最为流行。IPSec` 是一个第 3 层协议，限于处理 `IP` 流量![](img/line1.jpg)\n\
  \n| ![image](img/common.jpg) | **注意** 虽然 `IPSec` 仅适用于 `IP` 数据包，但 `L2TP` VPN 也可以携带产生的\
  \ `IPSec` 数据包，因为它们可以像其他主要的第 3 层数据包（如 `IP`、`IPX` 和 `AppleTalk` 数据包）一样被处理。 |\n\n\n\
  \n\n\n# VPN 的类型\n\n今天主要有四种类型的 VPN。一种类型是带有额外 VPN 功能的路由器。`VPN routers` 不仅可以处理正常的路由职责，还可以配置为通过互联网与位于远程网络上的其他类似路由器建立\
  \ VPN。这种方法用于在互联网上创建 VPN 广域网链路，通常位于多个公司地点之间。\n\n另一种主要类型的 VPN 是内置在防火墙设备中的。大多数流行的防火墙，如\
  \ `Check Point 的 Firewall-1`、`Cisco 的 ASA` 产品线线或 `WatchGuard 的 Firebox`，不仅作为防火墙设备，还作为\
  \ `VPN hosts` 使用。`Firewall VPNs` 既可以支持远程用户，也可以提供 WAN VPN 链路。使用基于防火墙的 VPN 的用处是，你完全可以在防火墙内部管理你的网络安全——包括标准的防火墙安全和\
  \ VPN 安全。例如，你可以配置防火墙，仅当连接作为有效 VPN 连接的一部分时才允许连接到网络。\n\n第三种主要类型的 VPN 包括作为网络操作系统的一部分提供的\
  \ VPN。这种类型的最佳示例是 `Windows RRAS` 和 `Novell 的 BorderManager` 软件。这些 VPN 通常用于支持远程访问，而且购买和安装的通常是最的。\n\
  \n第四种主要类型是 `SSL VPN`，这是一个相对新的类别。这实际上是我在远程访问支持中最喜欢的类型。`SSL VPN` 利用了大多数网络浏览器内置的 `Secure\
  \ Sockets Layer (SSL)` 加密技术，通过网络浏览器提供 VPN 服务。`SSL` 与加密使用 `https://` 前缀的网页（例如购物或在线银行网站）中的信息时使用的是相同的技术。\n\
  \n## SSL VPN 的益处\n\nSSL VPN 为支持远程访问用户带来了许多吸引人的益处：\n\n![image](img/box.jpg)\n\n-\
  \ 远程计算机上不需要安装客户端软件，通常一个自动安装到浏览器中的 `ActiveX` 或 `Java` 插件外。\n\n![image](img/box.jpg)\n\
  \n- 远程系统基本上不需要任何配置或管理。这是一个重要点，因为大多数 VPN 客户端软件对于帮助台人员的支持可能会出现问题。\n\n![image](img/box.jpg)\n\
  \n- 只要用户知道 `SSL VPN` 服务器的网页地址并拥有正确的身份验证（登录）系统信息，他们就可以从世界上几乎任何连接互联网的计算机上登录，并通过简单的网页访问广泛的网络服务。\n\
  \n![image](img/box.jpg)\n\n- 因为许多常见功能（如文件管理）可以使用网页执行，`SSL VPNs` 在低带宽连接上的工作比其他 VPN\
  \ 替代方案好得多。`HTML` 设计的初衷是为了节省网络带宽，因此许多在传统 VPN 连接上缓慢的任务在 `SSL VPN` 上运行要快得多。\n\n![image](img/box.jpg)\n\
  \n- 大多数 SSL VPN 除了基于网页的访问功能外，允许用户根据需要启动远程节点连接，这种远程节点连接使用自动安装和配置的浏览器插件运行。\n\n`SSL\
  \ VPNs` 通常以设备的形式提供——这是一种机架安装式设备，包含了运行 VPN 所需的所有硬件和软件。它们的价格差异很大，取决于它们能够支持的并发用户数量。\n\
  \n## SSL VPN 供应商\n\n在编写此时，有许多 SSL VPN 供应商。该领域的先驱是 `Juniper Networks` 的 `NetScreen`\
  \ 产品族（它收购了一家名为 `Neoteris` 的公司最初发布的产品，该公司开创了 SSL VPN）。另一个领导者是 `F5 Networks` 的 `FirePass`\
  \ 系列产品。`AEP Networks`、`SonicWALL` 和 `Nokia` 是其他一些提供 SSL VPN 的公司。由于该产品领域演变迅速，你应该对符合你需求的产品进行仔细搜索。\n\
  \n为了让你了解 SSL VPN 对远程访问用户看起来是什么样，本节展示了 `F5 Network’s FirePass 4000` 演示版本的一些屏幕。图 8-7\
  \ 显示了浏览到 SSL VPN 的 URL 后典型的登录界面。（如果你部署了 SSL VPN，此屏幕将使用你公司的 Logo 和其他信息进行自定义。）\n\n\
  ![](img/line.jpg)![image](img/fig8-7.jpg)![](img/line.jpg)\n\n**图 8-7.** SSL VPN\
  \ 登录界面\n\n## SSL 身份验证技术\n\nSSL VPN 可以通过多种不同技术验证用户，包括以下技术：\n\n![image](img/box.jpg)\n\
  \n- 通过 SSL VPN 中为每个用户定义的用户名和密码。\n\n![image](img/box.jpg)\n\n- 通过与现有的身份验证系统集成，例如\
  \ `Windows Active Directory`。选择此选项让远程用户使用他们正常的网络用户名和密码，然后 SSL VPN 将与网络上预存在的身份验证系统集成。\n\
  \n![image](img/box.jpg)\n\n- 通过双因子身份验证系统的集成。双因子身份验证系统通常包括每个用户一个小型设备，显示一个每分钟左右变化一次的数字。用户在登录时输入设备上的数字，加上一个只有他们知道的额外数字（类似于\
  \ ATM 机密码）。双因子身份验证系统极其安全，因为设备使用只有安装在网络中的安全服务器才知道的随机数字序列。\n\n一旦用户登录到 SSL VPN，他们将看到一个主页，主页显示了他们可以使用的所有连接选项，如\
  \ 图 8-8 所示所示。\n\n![image](img/box.jpg)\n\n**图 8-8.** SSL VPN 示例主页\n\n\n\n\n\n# 第\
  \ 9 章：保障网络安全\n\n大多数网络任务都相对简单。你需要一个新的新文件服务器和打印服务器吗？你只需安装并设置它，它要么可以工作，要么无法工作。如果无法工作，你就继续进行故障排除、修复任何问题，并最终完成任务。\n\
  \n相比之下，网络安全则是另一回事。你永远无法真正完成网络安全项目，也永远无法确定一个网络是完全安全的。你在网络安全上投入了多少金钱、投入了多少时间，以及安装了多少华华的安全硬件和软件其实并不重要——没有任何网络是完全安全的。尽管如此，网络安全是任何网络管理员面临的最重要工作之一。良好的网络安全有助于防止以下情况发生：\n\
  \n- 公司机密（如专有设计或流程）落入他人之手（包括内部和外部）\n- 员工个人信息落入他人之手\n- 重要信息和软件的丢失\n- 网络本身或网络任何部分无法使用\n\
  - 重要数据的损坏或不恰当修改\n\n这些只是网络安全应该尝试防止的一些较重要的损失。如果你花时间考虑你工作网络中存储并流经这些网络的所有信息（你确实应该花时间考虑这些），你可能会想出其他需要规避的危险。\n\
  \n本章提供了网络安全主题的概述。其目的是让你熟悉重要的网络安全思想和概念，以及涉及网络安全的各种技术。如果你负责一个网络的安全，你应该寻求更详细的信息，并应该认真考虑聘请该领域的专家来帮助你保障网络安全。即使你不是维护网络安全的主要负责人，网络安全也是每个人的责任。如果你是一名\
  \ IT 专业人员，安全是你工作中一个更为重要的部分。\n\n## 理解内部安全\n\n*内部安全*是保护网络免受内部威胁的过程，而内部威胁通常比外部威胁常见得多。内部威胁的示例包括：\n\
  \n- 内部用户不恰当地访问工资记录、会计记录或业务开发信息等信息。\n- 内部用户访问他们不应访问的其他用户的文件。\n- 内部用户冒充其他用户并制造麻烦，例如以他名义发送电子邮件。\n\
  - 内部用户访问系统实施犯罪活动，例如贪资金。\n- 内部用户破坏网络安全，例如无意（或故意）向网络引入病毒。（病毒将在本章随后的章节中专门讨论。）\n- 内部用户在网络上“嗅探”数据包以发现用户账户和密码。\n\
  \n为了对此类威胁，你需要勤勉地管理网络安全。你应该假设在内部用户群体中，至少有一些人具备足够的复杂性来探索网络中的安全漏洞，而且这些人中至少有几会在某时刻尝试这样做。\n\
  \n> **注意**：管理安全最不愉快的部分之一是，你需要对人们有最坏的打算，然后必须采取措施防止你预期的那些行为。换句话说，需要某种程度的偏执。虽然这不是一种愉悦的心态，但在安全领域做好工作是必不可少的。同时记住，如果你聘请外部公司帮助管理网络安全，你可能会获得更好的结果。外部公司不仅在这一领域的技能水平更高，其员工还习惯于从安全人员的角度进行思考，并且他们从解决其他公司的安全问题中积累了宝贵的经验。可能更重要的是，使用外部公司不会让员工与其他同事之间处于敌对关系。\n\
  \n## 账户安全\n\n*账户安全*是指管理网络上启用的用户账户的过程。妥善管理用户账户需要许多任务，并且应该定期对账户进行审计（最好由不是日常管理账户的人员执行），以确保没有漏洞。以下是你在管理通用账户安全时应采取的一系列通用步骤：\n\
  \n- 大多数网络操作系统启动时带有一个名为 `Guest` 的用户账户。你应该立即删除此账户，因为它是破解客（crackers）频繁攻击的目标（`hacker`\
  \ 是喜欢探索和理解系统的人，而 `cracker` 是带有恶意意图入侵系统的人）。你还应该避免创建明显用于测试目的的账户，例如 `Test`、`Generic`\
  \ 等。\n- 大多数网络操作系统启动时管理员账户都有一个默认名称。在 Windows 服务器操作系统下，该账户被称为 `Administrator`；在 NetWare\
  \ 下，它被称为 `Supervisor` 或 `Admin`（取决于你使用的版本）。你应该立即重命名此账户，以避免针对该账户的定向攻击。\n\n> **提示**：作为安全措施，还要创建一个新账户作为你管理员账户的备份。你可以给它起任何名字（尽管不那么明显的名称更好），赋予该账户与管理员账户同等的安全权限，并安全地存储密码。如果发生了导致你被锁在管理员账户之外的情况，你可以使用备份账户重新访问并修正问题。\n\
  \n\n\n\n\n![image](img/box.jpg)\n\n你应该了解如何从任何用户账户中快速移除网络资源访问权限的步骤，并确保探索所有可能包含自带安全系统的网络资源。例如，账户不仅会在网络操作系统（可能在每台服务器上）中管理，还会在特定的应用程序中，例如数据库服务器或会计系统。确保你了解系统如何处理已删除或禁用的账户。如果你为了移除访问而删除了用户账户，某些系统并不会立即拒绝该用户的访问；相反，用户只是无法再次登录，但任何当前的会话可能会继续，至少持续一段时间。\n\
  \n![image](img/box.jpg)\n\n与人力资源（HR）部门紧密合作。确保 HR 员工乐于与你合作处理与员工离职相关的安全问题，并制定一份清单，用于处理影响\
  \ IT 的标准用工变更。人力资源部门可能无法为你提供太多（甚至根本不）提前通知，但他们需要理解，你需要立即获知任何终止信息，以便采取适当措施。同样，你还应该制定一套程序，说明如何处理累积的电子邮件、文件和其他用户访问权限——无论是针对友好离职还是终止雇。你与\
  \ HR 部门相关人员的关系对于良好处理安全至关重要，因此请确保你建立并维护相互信任。\n\n![image](img/box.jpg)\n\n考虑建立一种程序，让网络上的新用户的分配权限由其主管进行审核和批准。这样，你就不会错误地赋予人们他们不应拥有的权限。\n\
  \n![image](img/box.jpg)\n\n对于上市公司而言，2002 年《萨班斯-奥克斯莱法案》（在第 1 章中讨论过）的出现意味着你可能需要建立一个系统，记录如何向系统中添加、修改和从系统中移除网络用户。这种系统通常涉及一组由相关部门（HR、会计等）发起的申请表，由该个人主管以及任何其他需要授权访问特定系统的相关方签署，然后记录\
  \ IT 人员的操作。这些表单将被归档，并由公司审计师进行检查。\n\n## 密码安全\n\n账户安全的另一个重要方面是账户密码安全。大多数网络操作系统都允许你设置与密码安全相关的策略。这些策略控制系统强制用户更改密码的频率、密码的长度、密码的复杂性（字母数字、大写字母或符号）、用户是否可以重复使用以前用过的密码等。至少，请考虑这些密码策略建议：\n\
  \n![image](img/box.jpg)\n\n要求用户（通过网络密码策略设置）每 90 到 180 天更改一次主网络密码。（实际上，30 天是一个常见的建议，但在大多数环境中这可能太频繁了。）\n\
  \n![image](img/box.jpg)\n\n设置重复策略，使密码在至少一年内不能重复使用。\n\n![image](img/box.jpg)\n\n\
  要求密码长度至少为 8 个字符。对于不区分大小写且不允许特殊字符的密码，这将产生产生 36⁸ 种可能的排列，或者说近 3 万亿种可能。如果网络操作系统使用区分大小写的密码，可能性将大得多：62⁸（218\
  \ 万亿）。对于允许特殊字符作为密码一部分的系统（如空格、逗号、句号、星号等字符），可能的组合数量会更高。![](img/line1.jpg)\n\n| ![image](img/common.jpg)\
  \ | 注意：即使是密码有 20 亿种可能的组合也很多了。如果破解者每秒能尝试一次密码，他们需要花费 63 年才能尝试完这么多排列。或者，使用每秒可以尝试 500\
  \ 万种可能性的优化程序，使用暴力破解一个 8 字符的混合大小写密码大约需要一年。 |\n\n\n\n\n\n![image](img/box.jpg)\n\n\
  鼓励用户创建在任何语言中都不是单词的密码；或者，如果是单词，也要让他们在单词的某处插入数字或其他非字母数字字符，这样“字典攻击”就无法轻易破解。（许多密码破解程序依赖于常用单词和名称的字典，以大幅减少它们需要尝试的可能性范围。）此外，对于支持大小写混合密码的网络，鼓励用户使用此类密码。\n\
  \n![image](img/box.jpg) 确保你开启了任何监控并处理用户输入错误密码的策略。这种策略通常被称为 `intruder detection`（入侵检测），它会监控错误的密码输入尝试。如果在设定的时间内发生了过多的尝试，系统可以锁定用户账户，以防止进一步的尝试。我通常将此类功能设置为：在一小时内输入了五次错误密码，就锁定账户，直到管理员重置该账户才解锁。这样一来，如果用户输入了大量错误密码，他们就需要联系管理员重新开放账户。通常，这种情况发生在用户忘记密码时，但也可能是其他人在尝试猜测密码，因此值得检查。许多公司还设置了入侵检测，在输入了过多错误密码后锁定账户一段时间，用户用户在一个小时后才能再次尝试登录。\n\
  \n![image](img/box.jpg) Windows 服务器允许你对用户何时以及何地登录网络建立限制。你可以设定用户允许登录的时间段，也可以将用户账户限制在特定的网络计算机。对网络上的所有用户执行此操作通常是多此的，但你可能希望将管理账户限制在几个不同的工作站上，这样不同工作站（或通过\
  \ WAN 连接接入）的人即使通过某种方式知道了密码，也无法登录该账户。\n\n网络安全策略中有一个有趣的“两难困境”：如果你让它们变得 `too` 严格，实际上反而会\
  \ `reduce` 你的网络的安全性。例如，假设你设置网络要求 12 字符密码，强制每周更改一次密码并不允许重复使用密码。大多数用户将无法周周都记得自己使用的是什么密码，他们自然会转而将密码写在办公室的某处。当然，写在纸上的密码安全性远低于记在里的密码。网络安全的诀窍在于安全性和易用性之间取得平衡。\n\
  \n## 密码有替代方案吗？\n\n目前有很多新兴的密码替代方案，这些方案可以使网络更安全，同时也让网络安全对用户来说变得更容易。第一种替代方案被称为双因子身份验证。这种系统要求用户随身携带一个名为\
  \ `fob`（口令）的小型电子设备，其大小类似于通用串行总（`USB`）密钥。（较新的系统也有手机手机 App 来实现相同的功能。）`fob` 显示一组不断变化的数字，这些数字特定于该特定的\
  \ `fob`。用户只需记住一个四位的 `PIN`。当用户登录系统时，他们输入 `fob` 上当前显示的任何数字，加上他们的 `PIN`。由于系统的网络端有一份匹配的\
  \ `fobs` 及其数字序列清单，并且有一种验证用户 `PIN` 的方法，因此用户可以被非常安全地识别。如果丢失了 `fob`，可以在系统中轻松禁用并颁发一个新的。双因子身份验证通常用于远程访问识别。\n\
  \n某些 Web 系统也开始提供双因子身份验证。这些系统通常通过在用户使用用户名和密码登录后，向其手机发送一条短信（`SMS`），其中包含一个 `PIN`。用户然后输入此\
  \ `PIN` 作为额外的验证来确认其身份。另一种新兴的密码替代方案是使用生物识别数据，例如指纹识别器。一些笔记本电脑现在配备了集成指纹识别器，可以快速扫描用户的指纹并将其登录系统。其他公司也销售类似的独立设备。然而，通常供应商会特别说明这些设备不供企业使用。因此，尽管此类设备尚不适用于企业环境，但安全性正朝着这个方向快速发展。我相信，计算机惯常配备指纹识别器的日子已不远了，用户只需将大拇指触碰识别器即可安全地向系统识别身份。\n\
  \n## 文件和目录权限\n\n你需要维护的网络信息内部另一种内部安全类型涉及用户对文件和目录的访问权限。这些设置实际上比比用户账户更难管理，因为你通常为网络上的每个用户至少提供\
  \ 20 个目录和数百个文件。目录和文件的巨大数量使得管理这些设置成了一项艰巨的工作。解决方案是建立常规程序并遵循这些程序，然后定期对目录树的部分进行抽检审计，特别是包含敏感文件的区域。此外，对整个网络目录进行结构化，这样你大多数情况下只需要在顶层分配权限即可。这些权限会自动“向下流动”到子目录，这使得检查谁有权访问哪些目录变得容易。。操作系统操作系统设置文件和目录权限方面允许相当大的灵活性。使用内置权限，你可以为任何给定目录的用户启用不同的角色。这些\
  \ `roles` 控制用户在该目录内可以做什么和不能做什么。通用目录角色的示例包括：\n\n![image](img/box.jpg) **仅创建 (Create\
  \ only)**\n这种角色允许用户向目录中添加新文件，但限制他们查看、编辑或删除现有文件（包括他们创建的任何文件）。这种角色适用于允许用户向他们原本无权访问的目录添加新信息。该目录变得就像街角的邮箱箱：你只能往里面放新东西。当然，至少会有另一个用户拥有对该目录的完全访问权限，以便检索和处理文件。\n\
  \n![image](img/box.jpg) **只读 (Read only)**\n这种角色允许用户查看目录中的文件，甚至可以将文件调到他们的计算机上查看。然而，用户无法以任何方式编辑或更改存储的文件。这种角色适用于允许用户查看他们不更改的信息。（具有读取权限的用户可以将文件从只读目录复制到另一个目录，然后对他们创建的副本做任何他们想做的事。他们只是无法更改只读目录本身中的副本。）\n\
  \n![image](img/box.jpg) **更改 (Change)**\n这种角色让用户对目录中的文件做任何他们想做的事，`except` 允许其他用户访问该目录。\n\
  \n![image](img/box.jpg) **完全控制 (Full control)**\n通常为目录的“所有者”保留，这种角色允许所有者对目录中的文件做任何他们想做的事，并授予其他用户访问目录的权限。\n\
  \n这些角色在不同的网络操作系统上以不同的方式创建。第 15 章提供了有关 Windows 服务器如何处理目录权限的更多细节。正如你可以为目录设置权限一样，你也可以为特定文件设置安全性。文件权限的工作方式与目录权限类似。对于特定文件，你可以控制用户读取、更改或删除文件的权限。文件权限高于目录权限。例如，如果用户对某个目录具有更改权限，但你将他们对该内特定文件的访问权限设置为只读，那么他们对该文件就只有只读权限。![](img/line1.jpg)\n\
  \n\n\n\n\n| ![image](img/common.jpg) | **提示** 对于任何规模的网络，我建议除非极少数情况下，否则避免使用针对特定文件的网络权限。要记住每个用户对哪些文件拥有特殊权限，以及新入职员工需要对哪些文件赋予特定权限，很快就会变成一个难以管理的混乱。\
  \ |\n\n## 实践与用户教育\n\n任何网络中最不安全的部分都是使用网络的人。你需要建立良好的安全实践和习惯来帮助保护网络。如果你不在日常工作中进行良好管理，仅仅设计并实施一个优秀的安全方案是不够的。为了建立良好的实践，你需要记录与安全相关的程序，然后建立某种流程以确保员工定期遵守这些程序。事实上，拥有一个被严格执行的简单安全设计，比拥有一个优秀但复杂且执行不力的安全设计要好得多。因此，在保持与公司需求一致的同时，尽可能让整体网络安全设计保持简单。\n\
  \n你还需要确保——在最大范围内——用户正在遵循审慎的程序。你可以轻松地通过网络操作系统的设置来强制某些程序，但其他程序必须通过教育来处理。以下是一些让这一过程变得简单的技巧：\n\
  \n![image](img/box.jpg)\n- 为用户明确说明他们在安全方面的预期。提供一份描述网络安全以及他们需要做什么来维护安全的文档。用户指南的示例包括：选择安全的密码、不将密码给任何人、在登录网络时不要长时间离开电脑、不安装从公司外部下载的软件等。\n\
  \n![image](img/box.jpg)\n- 当新员工加入公司并接受网络使用入职培训时，确保你与他们讨论安全问题。\n\n![image](img/box.jpg)\n\
  - 根据公司的文化，考虑让用户签署一份表格，承认他们理解了公司要求他们遵守的重要安全程序。\n\n![image](img/box.jpg)\n- 定期审计用户的安全行为。如果用户对目录具有完全控制访问权限，检查他们是如何向其他用户分配权限的。\n\
  \n![image](img/box.jpg)\n- 确保你审阅了所使用的网络操作系统的安全日志。调查并跟进任何报告的问题。\n\n\n\n![](img/line1.jpg)\n\
  \n| ![image](img/common.jpg) | **注意** 记录你所调查的任何安全相关问题是一个好主意。虽然大多数问题是无害的，但偶尔你可能会发现用户具有不当意图的情况。在这种情况下，你对发现的内容和所采取行动的记录可能变得重要。\
  \ |\n\n虽然在设计和管理网络安全时为最坏的情况做好计划很重要，但你还需要意识到，大多数安全问题源于无知或其他无意的原因，而非恶意。\n\n## 理解外部威胁\n\
  \n外部安全是保护网络免受外部威胁侵害的过程。在互联网之前，这个过程并不困难。大多数网络只有外部调制解调器用于拨入网络，保持这些访问点的安全很容易。然而，现在几乎所有的网络都连接到了互联网，外部安全变得更加重要，也变得更加困难。\n\
  \n在本章开头，我说过没有任何网络是绝对安全的。对于处理连接到互联网的网络安全来说，尤其如此。黑客几乎每天都会发现可以通过互联网连接突破网络安全的新技术。即使你找到了一本讨论特定类型网络所有威胁的书，这本书在印刷后很快就会过时。\n\
  \n存在三种基本的外部安全威胁：\n\n![image](img/box.jpg)\n- **正门威胁**：当公司外部的人员某种某种发现、猜测或破解用户密码并登录网络时，就会产生此类威胁。实施者可能是曾经与公司有关的人，也可能是与公司完全无关的人。\n\
  \n![image](img/box.jpg)\n- **后门威胁**：网络操作系统和硬件中的软件硬件漏洞允许外部人员破解网络安全的威胁。在实现目标后，外部人员通常会找到登录管理账户的方法，然后可以随心所欲。后门威胁也可以被刻意编写到你运行的软件中。\n\
  \n![image](img/box.jpg)\n- **拒绝服务 (DoS)**：`S attacks` 拒绝网络服务。示例包括执行已知会导致不同类型服务器崩溃的特定操作，或用无用流量（如大量的\
  \ ping 请求）淹没公司的互联网连接。\n\n\n\n![](img/line1.jpg)\n\n| ![image](img/common.jpg) |\
  \ **注意** 存在另一种类型的外部威胁：来自公司外部的计算机病毒、木洛马、蠕虫和其他恶意软件。这些威胁将在本章稍后的章节中专门介绍。 |\n\n\n\n\n\
  幸运的是，你可以采取许多措施来实施强大的外部安全防护。这些措施可能无法挡住意志坚定且技术极其高明的黑客，但它们可以增加足够的难度，让大多数黑客放弃并转向他处。\n\
  \n## 定义它！重要的网络安全设备\n\n以下是你应该熟悉的一些重要安全设备：\n\n![image](img/box.jpg)\n\n`firewall`（防火墙）是一个在两个网络之间（例如局域网\
  \ LAN 和 Internet 之间）执行安全策略的系统。防火墙可以使用许多不同的技术来执行安全策略。\n\n![image](img/box.jpg)\n\n\
  `proxy server`（代理服务器）充当代理（匿名中间人），通常为网络用户服务。例如，它可以作为浏览网页的代理，使用户计算机不通过代理服务器就不连接到远程系统。在提供网页访问的过程中，代理服务器还可以通过缓存已访问的网页来加快访问速度，以便其他用户能够更快地从本地代理服务器获取这些页面，并可能为局域网提供某些防火墙保护。\n\
  \n![image](img/box.jpg)\n\n`packet filter`（数据包过滤器）通常内置在路由器或防火墙中，它允许你为允许和禁止的数据包、源\
  \ IP 地址、目的 IP 地址以及 IP 端口设置标准。\n\n## 正门威胁\n\n`Front-door threats`（正门威胁）是指公司外部的人员能够访问用户账户，这可能是你最需要防护的最可能的威胁。这些威胁有许多形式。其中最主要的是曾经拥有网络访问权限的不满或被解雇的员工。另一个例子是猜测或发现网络上有效账户的密码，或者通过某种方式从所有者那里获得有效密码。\n\
  \n内部人员（无论是现职还是前员工）从总体上来说可能是最危险的。这些人拥有某些随机黑客不具备的许多优势。他们已经知道网络上的重要用户名，因此他们知道应该攻击哪些账户。他们可能在公司工作期间知道了其他用户的密码。他们还了解网络结构、服务器名称以及其他使破解网络安全变得更容易的信息。\n\
  \n防御正门威胁的关键在于强大的内部安全防护，因为在这种情况下，内部和外部安全是紧密相连的。对于这类威胁，内部安全章节中讨论的所有策略和实践都能帮助防止问题的发生。\n\
  \n防止正门威胁的另一种有效方法是，尽可能将应该从局域网访问的网络资源与应该从局域网外部访问的资源分开。例如，如果你永远不需要为外部用户提供公司会计服务器的访问，你可以让该系统几乎无法从局域网外部访问。\n\
  \n![](img/line1.jpg)\n\n| ![image](img/common.jpg) | 注意 | 有一个公司的趣故事：他们聘请了一家外部安全公司试图入侵他们的网络以测试其安全性。他们拥有最新的防火墙、入侵检测系统、代理服务器等，并真的挑战外部公司尝试闯入。当发现外部公司在一天之内就获得了网络访问权限时，他们震惊了。他们是怎么做到的？他们在停车场丢了几个\
  \ USB 闪存，闪存里的有一个程序允许从网络外部进行远程控制。一个好奇的员工注意到了其中一个，并将其放入电脑以试图识别应该还给谁，而这就足够了。 |\n\n\
  你可以通过多种措施分离网络资源。你可以设置防火墙路由器拒绝任何通过路由器访问该服务器 IP 地址的请求。如果服务器不需要 IP，你可以移除该协议。你可以设置服务器在正常工作时间之外不允许访问。根据服务器上运行的网络操作系统，你可以将访问限制为局域网内能够访问服务器的机器的以太网媒体访问控制（MAC）地址。你还可以设置服务器每个用户一次仅登录一次。你可以采取的特定步骤取决于具体的服务器、其运行的应用程序及其操作系统，但原理是通用的：尽可能将内部资源与外部资源隔离。\n\
  \n以下是你可能采取的其他一些阻碍正门威胁的步骤：\n\n![image](img/box.jpg)\n\n控制哪些用户可以从局域网外部访问局域网。例如，你可能会为出差或居家的用户运行虚拟专用网络（VPN）软件，让他们通过\
  \ Internet 远程访问局域网。你应该只为需要的用户开启此访问，而不是所有人。\n\n![image](img/box.jpg)\n\n考虑为远程用户设置与其普通账户分开的远程访问账户，并使这些账户比他们的普通局域网账户更具限制。这在所有情况下可能并不可行，但这是一个很有帮助的策略，特别是对于通常拥有广泛局域网安全权限的用户来说。\n\
  \n![image](img/box.jpg)\n\n如果拥有广泛访问权限的员工离开公司，请检查他们可能知道过密码的用户账户。考虑在员工离开后立即强制此类账户更改密码。\n\
  \n![](img/line1.jpg)\n\n| ![image](img/common.jpg) | 注意 | 内部和外部安全的一个重要方面都是物理安全。确保你服务器所在的房间在物理上是锁好且安全的。\
  \ |\n\n试图访问网络但曾与公司没有任何关联的人员通常会尝试一种被委婉称为 `social engineering`（社会工程）的技术，即他们使用非技术手段来获取公司内部的用户账户和密码。这些技术在大型公司中最为危险，因为并不是所有员工彼此认识。社会工程技术的一个例子是给员工打电话，假装成网络管理员，声称正在追踪某个问题并临时需要员工的密码。另一个例子是翻公司的垃圾，寻找可能帮助罪犯破解密码的记录。务必仔细指示公司员工绝不要通过电话向任何人泄露密码，而且\
  \ IT 人员通常不需要询问任何人的密码。\n\n## 后门威胁\n\n`Back-door threats`（后门威胁）通常针对网络操作系统本身的问题或网络基础设施的其他点，例如路由器。事实是，所有的网络操作系统和大多数网络组件都有安全漏洞。防止这些问题的最好方法是保持软件以及任何发布的安全相关补丁的更新。你还应该定期查看有关你使用的软件中发现的安全漏洞的新信息。\n\
  \n![](img/line1.jpg)\n\n| ![image](img/common.jpg) | 提示 | 不要仅依赖供应商的网站获取有关软件安全漏洞的最佳信息。用于跟踪安全漏洞动态的良好网站是由计算机应急响应小组（CERT）维护的网站，地址为\
  \ `www.cert.org`。除了发现安全漏洞公告外，你还可以在该网站上发现许多有价值的安全信息。 |\n\n\n\n\n\n# Web 服务器是黑客频繁攻击的目标。请考虑以下提示以帮助保护\
  \ Web 服务器免受威胁：\n\n![image](img/box.jpg)\n\n如果将公司网站托管在外部服务器上（例如互联网服务提供商 ISP 的系统），而不是在你自己的网络上，你的处境会更好。ISP\
  \ 不仅能更好地为服务器提供每天 24 小时、每周 7 天的服务，而且安全性可能也更高。此外，你不需要担心允许从公司外部访问你的局域网（LAN）Web 服务器，这有时会留下其他的漏洞。![image](img/box.jpg)\n\
  \n确保为你的网络实施一个强大的防火墙路由器。防火墙路由器将在第 4 章中进行详细讨论。你还应该让熟悉你所实施的特定防火墙和 Web 服务器的人员来测试你的配置或协助进行配置。记住，防火墙的软件也需要保持最新版本。![image](img/box.jpg)\n\
  \n务必确保你已经仔细审查了适用于你的 Web 服务器的安全设置并实施了所有设置，并且定期对这些设置进行审计。![image](img/box.jpg)\n\n\
  考虑将为公司外部人员设计的 Web 服务器放置在防火墙之外（换句话之，放在防火墙与连接到互联网的路由器之间——该区域被称为*非军事化区*，大多数防火墙都有一个专门用于此目的以太端口）。这样，即使黑客能够攻入\
  \ Web 服务器，他们也无法进入你网络的其他部分。![image](img/box.jpg)\n\n安全地保护你的电子邮件流量。电子邮件是病毒或木马程序进入公司最常用的手段之一。确保你运行了适用于你电子邮件服务器的病毒扫描软件，并至少*每天*更新病毒特征——每小时更新一次更好。**\n\
  \n## DEFINE-IT! 非军事化区\n\n当你将计算机放置在防火墙（网络的另一侧）与与外部网络（如互联网）的连接之间时，这两个设备之间的区域被称为非军事化区，简称\
  \ `DMZ`。通常，组织会将公共 Web 服务器放置在 `DMZ` 中，这台计算机上不会有任何机密信息。这样，如果该计算机的安全性被破坏，攻击者也没有进入网络本身。\n\
  \n## DoS 威胁\n\nDoS 攻击是指拒绝合法用户使用网络资源的攻击。这些攻击通常针对电子邮件服务器和 Web 服务器，但它们可能会影响整个网络。DoS\
  \ 攻击通常有两种形式：它们要么通过向网络泛入无用流量来拒绝服务，要么利用网络软件中的漏洞（这些漏洞可导致服务器崩溃）。针对电子邮件服务器的 DoS 攻击通常会向服务器发送大量邮件，直到电子邮件服务器拒绝为合法用户服务或在承受的负载下崩溃。\n\
  \n这里是一些帮助防止 DoS 攻击的方法：![image](img/box.jpg)\n\n- 确保保持你的各种网络软件程序为最新版本。![image](img/box.jpg)\n\
  - 使用防火墙上的设置阻止互联网控制消息协议 (`ICMP`) 流量服务（处理 ping 请求）进入网络。![image](img/box.jpg)\n- 对于不需要从局域网外部访问的服务器，拒绝来自外部外部的访问。例如，公司的财务系统服务器可能不需要从局域网外部访问。在这种情况下，你将配置防火墙或数据包过滤路由器拒绝所有进入或离开该服务器\
  \ IP 地址的外部流量。\n\n## 病毒和其他恶意软件\n\n遗憾的是，越来越多的恶意软件正在世界范围内流传。存在许多不同类型的软件，包括以下：![image](img/box.jpg)\n\
  \n### 病毒\n计算机*病毒*是一种通过在其他文件中感染自身的副本来传播的程序。可以被病毒感染的文件包括程序文件（`COM`、`EXE` 和 `DLL`）以及支持足够复杂的宏语言以允许病毒行为的应用程序文档文件。（Microsoft\
  \ Word 和 Excel 是基于宏的病毒的常见目标。）有时像 JPEG 图像文件等数据文件也可能被复杂的病毒感染。![image](img/box.jpg)\n\
  \n### 蠕虫\n*蠕虫*是一种通过向其他计算机发送自身的副本来传播的程序，这些计算机运行蠕虫，然后将副本发送给其他计算机。有时，蠕虫会像野火一样通过遍世界的电子邮件系统传播。它们传播的一种方式是附在电子邮件上，并附带诱导收件者打开附件的消息。附件包含蠕虫，蠕虫随后向用户电子邮件地址簿中定义的其他人发送自身的副本，而用户并不知道这正在发生。那些收件者随后会发生同样的事情。这种蠕虫可以在几小时内通过互联网在世界范围内迅速扩散。![image](img/box.jpg)\n\
  \n### 木马程序\n*木马*是一个声称要执行某些有趣或实用的程序，并在用户与主程序交互时在后台执行恶意操作！![image](img/box.jpg)\n\n\
  ### 逻辑炸弹\n*逻辑炸弹*是插入到原本正常程序中的恶意编程代码。它们通常由程序的原始作者或参与开发源代码的其他人员包含。逻辑炸弹可以设定在特定时间执行，删除关键文件或执行其他操作。\n\
  \n已知的病毒数量巨大，每天都有更多的病毒被编写和发现。这些病毒是对任何网络的主要威胁，而防御病毒是网络管理的一个重要方面。\n\n\n\n\n\n| ![image](img/common.jpg)\
  \ | `TIP` | 考虑针对网络的不同部分使用不同公司的杀毒软件。例如，你可以在邮件服务器上使用某公司的杀毒软件，而在其他计算机上使用另一公司的软件。虽然这种情况很少见，但我见过某些案例：某家杀毒公司的病毒数据库无法检测某些病毒，而另一家公司的数据库可以；或者新病毒在某个数据库中的添加速度远比其他数据库快得多。\
  \ |\n\n你还应该在工作站上运行杀毒软件，但不应将此软件作为你主要的防御手段。\n\n## 章节总结\n\n在本章中，你学习了常见的安全威胁，并阅读了可以帮助你制定和实施良好安全实践的级建议。你应该认真考虑聘请一名外部安全顾问，来帮助你制定安全计划，并定期对其进行审查和审计。\n\
  \n即使是在整本专门介绍网络安全的主书中，你也无法学到使网络尽可能安全所需的所有知识。新威胁不断被发现，而不断变化的软件格局会使此类信息迅速过时。如果你负责网络安全，你应该知道这是一项永不休息的工作，你对它的了解永远是不够的。你需要花时间学习更多网络安全的方方面，特别是针对你网络中所使用的操作系统。以下书籍可以帮助进一步你的网络安全教育：\n\
  \n![image](img/box.jpg) *Network Security: A Beginner’s Guide, Third Edition*, Eric\
  \ Maiwald 著 (McGraw-Hill Education, 2012)\n![image](img/box.jpg) *Hacking Exposed\
  \ 7: Network Security Secrets & Solutions, Seventh Edition*, Stuart McClure, Joel\
  \ Scambray 和 George Kurtz 著 (McGraw-Hill Education, 2012)\n![image](img/box.jpg)\
  \ *Information Security: The Complete Reference* Mark Rhodes-Ousley 著 (McGraw-Hill\
  \ Education, 2013)\n\n你可能还会读 *Internet Firewalls and Network Security, Second Edition*,\
  \ Chris Hare 和 Karanjit Sayan 著 (New Riders Publishing, 1996)。这是一本较旧的书，但对真正的“安全”（即国防部级）有极好的解释。书中还描述了如何在公司制定网络安全策略，并解释了数据包过滤和防火墙技术。\n\
  \n最后，*The Happy Hacker: A Guide to (Mostly) Harmless Computer Hacking, Fourth Edition*,\
  \ Carolyn P. Meinel 著 (American Eagle Publishing, 2002) 是一本非常佳的黑客入门指南。这本书采用了“教程型”的方法，教导新手和中等经验的网络安全人员每天应该关注什么。\n\
  \n![image](img/common4.jpg)\n\n| **第 10 章** | ![image](img/line-1.jpg) | **网络灾难恢复**\
  \ |\n\n\n\n\n\n![image](img/common5.jpg)\n\n网络服务器包含了公司的核心资源，形式包括信息、知识以及公司员工投入的劳动成果。如果这些资源突然且永久地被剥夺，大多数公司将无法维持不中断的运营，并将面临巨大的资金损失，这种损失表现为数据丢失以及这些损失所产生的影响。因此，建立网络灾难恢复计划并制定及实施网络备份策略——在我看来——网络管理中最重要的两个任务。\n\
  \n在本章中，你将学习在灾难恢复计划中应该处理的问题，还将学习网络备份策略和系统。然而，在进入这些主题之前，你应该阅读关于西雅图市灾难恢复经验的内容。\n\n\
  ## 实地笔记：西雅图市\n\n本书第一至第三版的技术编辑托尼·莱恩（Tony Ryan）拥有网络灾难恢复的亲身经历。托尼曾在西雅图市政府的 IT 部门工作。2001\
  \ 年 2 月 28 日，西雅图发生了一次地震，导致该市的灾难恢复计划了测试。以下是托尼对西雅图市灾难恢复操作以及他们如何处理地震后出现问题的讨论。这是一个极佳的例子，说明了为什么你需要一个涵盖灾难发生期间可能发生的所有事件的灾难恢复计划。\n\
  \n## 关于 2001 年西雅图地震及其灾难恢复的笔记\n\n### 作者：托尼·莱恩\n\n过去几年里，西雅图经历了一些非常异常且引人注目的事件。其中最注目的是\
  \ 1999 年的世界贸易组织（WTO）会议以及随之发生的激烈抗议，这些活动通过电视和互联网进行了全球直播。此外，2000 年狂欢节节（Mardi Gras）庆祝期间还爆发了骚乱。然而，没有任何事情能与\
  \ 2001 年 2 月 28 日周三发生的 6.8 级地震所造成的潜在及已实现的损害相比可比拟的。\n\n### EOC 状况\n\n西雅图市设有应急指挥中心，简称\
  \ `EOC`。当发生任何对公共安全产生潜在影响，或可能影响城市向市民提供的任何服务的事件或危机时，`EOC` 就会激活。有时 `EOC` 可以提前激活；例如，针对\
  \ `Y2K` 年事件和 WTO 抗议活动纪念日。通过观察为这些活动所做的准备，并将其与地震等非计划事件期间发生的情况进行对比，有助于说明关于 IT 灾难恢复和灾难准备的一些重要原则。\n\
  \n### 永远不要假设\n\n在准备 `Y2K` 期间，我的员工成员被要求增加通常负责支持 `EOC` 台式电脑、笔记本电脑和打印机的人员。通常支持 `EOC`\
  \ 的员工来自与我们不同的 IT 组织，正如预期的那样，出于许多合理原因，他们的工作方式与我们不同。然而，一旦我的员工有机会查看了 `EOC` 的环境，他们就能分享一些新的视角和方法，这些方法被\
  \ `EOC` 支持人员欢迎并采纳，所有参与者对于配置 `EOC` 电脑的“标准”方式都有了新想法。例子包括：对某些型号的 PC 网络接口卡（`NICs`）进行硬编码，以便其在布线间间的交换机上运行得更好；或者为所有部署在楼内的笔记本电脑开发并实施一个基础镜像。结果，`Y2K`\
  \ 事件被誉为 IT 组之间理想合作以及整体准备良好的典范。那是一个非常平静的周六上午！\n\n### 变更管理？\n\n然而，在事件之间，有大量的时间机会让发生变化。设施可能被用于其他业务目的；笔记本电脑等设备可能被借出，或者客户可能进来使用设备；除了我们之外的其他\
  \ IT 组也可能协助了员工并对配置进行了更改，而这些更改没有记录，或未通知所有相关人员。\n\n### 结果\n\n无论发生了什么，目前仍然未知。我们在地震后发现的是，当通常在紧急情况下使用\
  \ `EOC` 的客户去使用设备时，在某些情况下，机器并没有按照预期工作。这台 PC 无法加载软件；那台笔记本电脑不再能连接到网络；某些 PC 与之前不同了，或者被更换了性能较弱的处理器。情况发生了变化，结果是像网络支持技术人员这样的\
  \ IT 专业人员执行的某些紧急工作比我们预想的要花费得多。讽刺的是，网络在我们的整体通信“策略”中起了至关重要的作用。设备无法立即运行的影响当时还未显现；但以下事件说明了这种影响可能是怎样的。\n\
  \n地震发生几分钟后，西雅图市员工工作的几栋市中心大楼由于担心结构损坏而疏散。没有人员受伤，令人惊讶的是，在我们提供支持的所有大楼中，只有两个键盘坏了。但请想象一下，几千个非常惊恐和担心的人涌入人行道和街道，疯狂试图联系亲人导致手机网络崩溃，并寻找任何可能的通信焦点——特别是像我这样的经理和其他主管人员，我们所有人都在灾难准备方面都接受了不同程度的培训。\n\
  \n幸运的是，市长办公室已派代表前往员工在在此类事件中步行指定的集合地点，并通知了受直接影响的核心大楼的所有人员他们可以回家。随着这一公告，首席技术官（`CTO`）向所有人宣布“查看网络”以获取信息，即市的内部网站。但如果\
  \ `EOC` 的 PC 被换掉了，比如换成了一台带有 `64MB RAM` 的 `Pentium 133`，而这台 PC 无法运行微软的 `FrontPage\
  \ 2000` 呢？如果该网站必须定期更新新闻和官方信息，那么结果充其量可能只会导致不便和困惑。\n\n### 应急计划与成本\n\n由于我们是公共资金资助的实体，我们对如何花费客户的资金非常谨慎，因为这受到严格的审查（理所应当）。客户通常没有资金既购买运行最新版本\
  \ `Windows` 的现代 PC 设备，又购买放在柜里“以防万一”的备用 PC。地震后，几栋大楼暂时无法入住，直到检查员有机会检查损坏以判断建筑对员工是否安全。其中一栋建筑实际上容纳了我们大量的\
  \ IT 员工，结果是，我们不仅在为客户寻找办公空间时寻找“备用 PC”，作为 IT 支持人员，我们发现自己也在做同样。直接影响是，在某些情况下，我们很难按照我们的服务水平协议（`SLAs`）要求的速度支持客户，特别是因为我们无法立即进入大楼收集我们的\
  \ PC 或其他必要设备。\n\n### 教训：保持备用\n\n无论发生了什么，目前仍然未知。我们在地震后发现的是，当通常在紧急情况下使用 `EOC` 的客户去使用设备时，在某些情况下，机器并没有按照预期工作。这台\
  \ PC 无法加载软件；那台笔记本电脑不再能连接到网络；某些 PC 与之前不同了，或者被更换了性能较弱的处理器。情况发生了变化，结果是像网络支持技术人员这样的\
  \ IT 专业人员执行的某些紧急工作比我们预想的要花费得多。讽刺的是，网络在我们的整体通信“策略”中起了至关重要的作用。设备无法立即运行的影响当时还未显现；但以下事件说明了这种影响可能是怎样的。地震发生几分钟后，西雅图市员工工作的几栋市中心大楼由于担心结构损坏而疏散。没有人员受伤，令人惊讶的是，在我们提供支持的所有大楼中，只有两个键盘坏了。但请想象一下，几千个非常惊恐和担心的人涌入人行道和街道，疯狂试图联系亲人导致手机网络崩溃，并寻找任何可能的通信焦点——特别是像我这样的经理和其他主管人员，我们所有人都在灾难准备方面都接受了不同程度的培训。\n\
  \n幸运的是，市长办公室已派代表前往员工在此类事件中步行指定的集合地点，并通知了受直接影响的核心大楼的所有人员他们可以回家。随着这一公告，首席技术官（`CTO`）向所有人宣布“查看网络”以获取信息，即市的内部网站。但如果\
  \ `EOC` 的 PC 被换掉了，比如换成了一台带有 `64MB RAM` 的 `Pentium 133`，而这台 PC 无法运行微软的 `FrontPage\
  \ 2000` 呢？如果该网站必须定期更新新闻和官方信息，那么结果充其量可能只会导致不便和困惑。\n\n由于我们是公共资金资助的实体，我们对如何花费客户的资金非常谨慎，因为这受到严格的审查（理所应当）。客户通常没有资金既购买运行最新版本\
  \ `Windows` 的现代 PC 设备，又购买放在柜里“以防万一”的备用 PC。地震后，几栋大楼暂时无法入住，直到检查员有机会检查损坏以判断建筑对员工是否安全。其中一栋建筑实际上容纳了我们大量的\
  \ IT 员工，结果是，我们不仅在为客户寻找办公空间时寻找“备用 PC”，作为 IT 支持人员，我们发现自己也在做同样。直接影响是，在某些情况下，我们很难按照按照我们的服务水平协议（`SLAs`）要求的速度支持客户，特别是因为我们无法立即进入大楼收集我们的\
  \ PC 或其他必要设备。\n\n### 教训：保持备用\n\n看来你要么预付，要么事后。为了这些事件，保留一定百分比的备用 PC 是合理的。在任何情况下，企业都有义务进行“分类”，确定哪些功能是最关键的，哪些可以推迟——直到库存可以重新连接或更换——保留\
  \ 10% 到 15% 是合理的。\n\n### 制定通信计划\n\n在 `CTO` 的公告之后，有人询问：“如果网站必须定期更新新闻和官方信息怎么办？”还有人问：“那些没有访问权限的人怎么办？”作为\
  \ IT 员工，我们问：“如果服务器本身被毁了怎么办？”（事实上，房间里的碎片离服务器很近，但服务器本身没有损坏。）还有人问道：“那些错过了信息且不知道如何检查的人怎么办？”这些问题以及“在……发生时怎么办？”可以通过一个清晰的计划来解决。另一个点是：如前提到的，我们的员工并不负责在常规基础上支持\
  \ `EOC`。需要时，我们乐意指导。\n\n## 灾难恢复计划\n\n灾难恢复计划是一份探索网络如何从危及数据或停止其功能的灾难中恢复的文档。公司的外部审计人员通常要求灾难恢复计划，因为数据对业务的重要性以及此类故障会对公司产生的影响。此外，灾难恢复计划也很重要，因为它们迫使经理考虑所有可能的灾难场景。通过考虑到这些场景，经理可以制定更有效的计划来保护网络数据不受丢失，并尽快恢复业务运营。\n\
  \n大多数公司没有极长的灾难恢复计划。对于几百个节点和 15 台服务器的网络，此类计划通常由 10 到 20 页或更少，尽管其长度取决于公司的复杂性。例如，财富\
  \ 500 强公司在考虑所有站点时，可能有长数百页的灾难恢复计划。\n\n保持灾难恢复计划简洁并最大化其用处的一种策略，是关注那些至少可能发生的问题。或者，你可以关注灾难结果——而不是试图涵盖灾难原因。将你的计划重点放在灾难结果上，意味着考虑单台服务器的丢失、整个服务器房的丢失、所有工作站的丢失等问题。根据你自己的公司情况，你的计划可能需要处理额外的问题。\n\
  \n## 评估恢复需求\n\n在起草实际计划之前，你应该首先评估计划必须满足的需求。这些需求将取决于谁需要参与灾难恢复计划以及计划想要解决的问题。考虑以下类型的需求：\n\
  \n-   正式为应急情况制定计划，并确保所有可能的灾难都已考虑在内！\n-   让公司的外部审计人员确保公司已经考虑并制定了处理灾难的计划！\n-   告知公司高层关于网络及其数据在不同情况下存在的风险，以及你预计需要多少时间来解决发生的任何问题！\n\
  -   从公司高层获取关于恢复优先级和重新建立服务的最低要求的建议！\n-   为公司的关键业务区域（例如，制造、客户服务和销售）正式制定计划，以应对各种计算机相关的灾难或严重问题！\n\
  -   确保公司的业务运营免受灾难影响。识别这些需求不仅将给你提供一个计划必须解决的清晰愿景，还会说明公司其他部分的哪些应该参与计划过程。\n\n## 考虑灾难场景\n\
  \n你应该通过考虑不同的可能的灾难场景来开始计划过程。例如，考虑以下灾难：\n\n-   服务器房或建筑内其他地方火灾摧毁了电脑和磁带！\n-   记住洪水可能由建筑内部引起，例如附近的房间发生漏水或触发喷淋系统的火灾！\n\
  -   某种电气问题导致电源故障！\n-   某些问题导致与外部世界的连接完全丢失。例如，关键区域网络（`WAN`）或互联网链路可能会中断！\n-   某种结构性故障影响网络或其服务器！\n\
  -   任何上述问题影响建筑内其他对公司至关重要的电脑。例如，此类事件可能发生在制造区域、客户服务中心或电话房。虽然这些事件中没有哪个是非常可能发生的，但考虑所有它们仍然重要的。灾难恢复计划的目的是防止或最小化损失，如果你只考虑你认为最可能发生的，那么这个过程将没用得多。考虑了上述灾难后，你接下来应该考虑可能影响运营的严重故障。这里有一些例子：\n\
  \n-   关键服务器的主板损坏，且供应商在三天或更多无法提供备件！\n-   你的服务器中的一个磁盘以数据丢失的方式损坏。\n-   如果你运行某种冗余磁盘阵列（`RAID`），为镜像的两端同时故障制定计划。\n\
  -   如果你使用 `RAID 1`，为两个驱动器同时框架故障制定计划。\n-   如果你使用 `RAID 5`，为任何驱动器同时故障制定计划。\n-   你的备份驱动器损坏并在两周内无法修复。\n\
  \n虽然这本身不会导致数据丢失，但它增加了你面临此类事件的风险。你应该计划如何应对这些以及其他可能的故障。为了应对磁盘故障，你应该设计一个计划，让你能够重建磁盘并尽快从备份中恢复数据。关于你的备份驱动器，你可能想找出多快可以获得一个驱动器来更换你损坏的驱动器。对于所有这些故障，你还希望考虑备用零件甚至整个服务器可用，以便你迅速恢复运营。\n\
  \n## 处理通信\n\n任何灾难恢复计划的一个重要部分涉及你将如何处理通信。没有有效的通信，你处理灾难的尝试将受到阻碍，其他人无法像他们可能可以那样完成工作。\n\
  \n从列出所有可能需要通知问题、解决进展及其最终结果的不同方开始。你的列表看起来可能像这样：\n\n-   董事会\n-   首席执行官或总裁\n-   所有区域的副总裁\n\
  -   受影响区域的副总裁或负责人！\n-   你的主管！\n-   受问题影响的员工\n\n对于这些人员——以及你可能识别出的其他人员——你接下来需要考虑什么级别的问题需要他们的通知。例如，董事会可能在灾难可能对公司绩效产生重大影响时才需要通知。相反，你的主管可能想被通知每一个问题，而受影响的员工当然需要被通知。\n\
  \n\n\n\n\n| ![image](img/common.jpg) | **提示** | 我并不是说直接通知（例如，通知公司董事会）是你的责任。相反，你的责任是在计划中说明沟通机制以及相关决策的运作方式，并确保链条中的人员都了解该计划。你对高层管理的沟通责任可能仅包括通知你的直接主管，然后由他们来决定是否通知下一级管理人员，依此类推。\
  \ |\n\n书面灾难恢复计划应包含上述所有信息。\n\n## 异地存储的规划\n\n异地存储是保护备份磁带的重要方式，以防物理灾难（如火灾）摧毁所有的本地副本。由于异地存储是灾难防护的一个非常重要的方面，应该在你的灾难恢复计划中进行讨论。![](img/line1.jpg)\n\
  \n| ![image](img/common.jpg) | **笔记** | 如果你还没有异地存储流程，应该认真考虑采用一套。虽然防火文件柜可以保护磁带媒介免受小火灾的影响，但它们并不一定能抵御大型或高温火灾。此外，磁带对烟雾和热量的敏感程度高于防火文件柜设计用于保护的纸。\
  \ |\n\n提供文件异地存储的公司通常还提供标准的磁带存储实践。这些做法通常以轮换的方式进行，存储公司的员工会定期（通常是每周）来到你的办公室，送入一组磁带并带走另一组磁带。这些公司通常使用不锈钢箱存放磁带，由\
  \ `network administrator` 负责锁好箱子并保管钥匙。你需要决定哪些磁带应该保留在本地，哪些应该发送到异地。一个经验法准则是：始终在本地保留最近的两个完整备份（以便能够快速恢复意外删除的文件），并将较旧的磁带发送到异地。这样，你手头就留了经常需要的磁带，并最大限度地减少了遭受灾难影响的风险。毕竟，如果灾难摧毁了你的服务器机房和其中所有的磁带，你可能不会太担心仅仅丢失几天的数据。![](img/line1.jpg)\n\
  \n| ![image](img/common.jpg) | **笔记** | 你能够接受暴露于灾难的数据量会有很大差异，这取决于你公司业务的性质和数据的性质。某些操作非常敏感，即使是丢失几分钟的数据也将是灾难性的。例如，银行机构绝不能丢失任何交易。需要保护超敏感数据的企业有时会聘请第三方供应商提供异地在线数据存储。此类供应商通过高速连接（例如从电信运营商处购买的\
  \ `Ethernet` 连接，速度可达千兆比特）将企业数据复制到其服务器上。这些供应商通常还提供故障转移服务，即当你的计算机发生故障时，他们的计算机可以接替你计算机的任务。或者，如果企业经营多个站点，它可能会建立软件和流程，使其能够自己的站点完成相同的服务。\
  \ |\n\n\n\n\n\n# 描述关键组件\n你的计划应该描述如果整栋大楼丢失，重新恢复运营所需的计算机设备和软件。此列表应粗略估算设备成本，以及如何快速获取这些设备。通过准备这样一份列表，你可以缩短在临时设施中恢复运营所需的时间。此外，如果你的公司购买了业务中断保险，你将需要这些保单中使用这些估算数据。\n\
  \n## 网络备份与恢复程序\n如果没有某种恢复存储在服务器上数据的方法，网络灾难恢复计划将一文不值。这就是网络备份和恢复程序大显用场。如果你是一名网络管理员，或者渴望成为一名管理员，你应该已经知道对系统和重要数据进行良好备份的重要性。如果你还不知道这一点，那么这可能是你从这本书中学到的最重要的教训。在使用计算机时，进行定期备份是一项要求——没有例外。\n\
  \n你不需要工作很长时间，就能亲眼观察到良好备份的重要性。计算机会且确实会故障，而且它们故障的方式有时会导致存储在上面的数据无法恢复。此外，某些情况的发生可能会导致某些重要文件被删除或损坏。在这种情况下，任务的保存或丢失取决于现有备份的质量以及恢复这些重要数据的能力。\n\
  \n## 评估备份需求\n在设计网络备份程序之前，你必须理解公司的备份和恢复需求。以下问题可能有助于评估你必须满足的需求：\n\n![image](img/box.jpg)\n\
  - 服务器上存储的数据动态性有多大？它们多久变化一次，以什么种方式变化？\n![image](img/box.jpg)\n- 需要备份多少数据？数据增长的速率是多少？\n\
  ![image](img/box.jpg)\n- 有多少时间进行备份？确保你避免出现这种情况：需要使用一个每小时只能处理兆兆数据的系统来备份数太级的数据。\n\
  ![image](img/box.jpg)\n- 如果需要从备份进行部分或完全恢复，必须多快完成？根据经验，恢复数据花费的时间大约备份时间的两倍，尽管在某些情况下，时间可能相相等。换句话说，如果你的备份系统一夜需要\
  \ 10 小时备份整个网络，那么就需要 10 到 20 小时来恢复这些数据——而且这个估算并不包括解决导致必须恢复数据的任何问题所需的时间。\n![image](img/box.jpg)\n\
  - 备份的数据一致性要求有多高？换句话说，一组数据文件是否需要作为一个单元来处理？例如，一个包含大量文字处理文件的目录一致性并不高；你可以恢复其中一个、多个或全部文件，而不必太担心这些恢复将如何影响其他文件。另一方面，高端数据库的数据库文件集合通常是用的，除非你能够从*精确*相同的时间点恢复集合中的*所有*文件，否则它是没有用处的。（高端数据库——如\
  \ Oracle——需要这种备份的数据库将有其自己的关于如何进行备份的详细说明，并且通常包含可以用于创建特殊备份文件的实用程序，通常甚至不需要数据库不可用。）\n\
  ![image](img/box.jpg)\n- 成本和可恢复性之间的所需权衡是什么？你可以设计每分钟运行的备份系统，这样如果发生故障，系统将不会丢失任何数据，管理层可以对这一事实有高度的信心。（例如，银行就需要这种高端备份系统。）然而，此类备份系统耗费大量资金并需要大量的管理。大多数公司乐意用这种极端成本换取较低程度的可恢复性，例如系统的每日备份。你的公司需要什么，愿意为此支付多少钱？\n\
  ![image](img/box.jpg)\n- 公司的备份需要多少级别的冗余？大多数备份是到磁带和使用 RAID 阵列的支持服务器上，因此磁带实际上是*次*级保护。在某些情况下，可能需要多盘磁带，每盘磁带都有备份的独立副本。另一种实现最大冗余的方法是通过某种网络连接将备份复制到离线存储公司。\n\
  \n在进行评估时，将公司的高级管理参与到过程中。。至少，你应该展示你的发现并寻求管理层的同意或建议。\n\n## 获取备份介质和技术\n一旦你对备份需求有了了解，就可以继续获取必要的硬件和软件来创建和管理你的备份。如果你需要为系统购买新的备份硬件，可以根据实际需求从许多经过验证的良好系统中进行选择。在选择备份技术时，考虑以下因素：\n\
  \n![image](img/box.jpg)\n- 硬件和介质的可靠性！\n![image](img/box.jpg)\n- 硬件和介质的成本！\n![image](img/box.jpg)\n\
  - 存储容量！\n![image](img/box.jpg)\n- 可能的恢复频率！\n![image](img/box.jpg)\n- 将整个备份放入单个介质中的重要性\n\
  \n表 10-1 回顾了不同类型的备份技术、它们的近似成本以及各自的优缺点。注意，表 10-1 中的驱动器、介质价格和每兆成本是估值。\n\n![](img/line.jpg)\n\
  **表 10-1。**\n\n### 备份技术类型\n如果你的公司负担得起数字磁带 (DLT) 或线性带开放 (LTO) 系统并能利用它们的容量，你绝对应该考虑购买这种技术。DLT\
  \ 和 LTO 磁带非常稳固，可以使用百万次，并据称寿命为 30 年。此外，驱动器在备份和恢复方面都很快。最后，DLT 和 LTO 驱动器提供机器人更换器，这意味着如果你超过了驱动器的尺寸，会有充足的空间。此外，机器人系统相对廉价，范围从可以容纳五盘磁带的小系统到可以容纳数百盘磁带的大型库。\n\
  \n一些较新的备份技术，例如 DLT S4（每盘磁带 800GB）和 LTO-6（每盘磁带 500GB），对于较大的网络是有意义的。DLT 和 LTO 都是可靠的磁带格式，得到了各种供应商的大力。\n\
  \n## 选择备份策略\n在获取所有必要信息后，你可以制定备份策略，解决如何轮换备份介质。备份轮转旨在实现以下目标：\n\n![image](img/box.jpg)\n\
  - 使用尽可能最近的数据重建系统，以防灾难性故障！\n![image](img/box.jpg)\n- 从可能被擦除或损坏的旧磁带中恢复文件，而无人察觉到数据的丢失！\n\
  ![image](img/box.jpg)\n- 防止备份介质故障！\n![image](img/box.jpg)\n- 防止数据受环境故障（如火灾，破坏原始系统和数据）的影响。\n\
  \n大多数网络操作系统为系统上的每个文件维护特殊位。其中一个称为归档位（archive bit），它指示文件的备份状态。当用户修改文件时，其归档位被设置为开启，表示该文件应该被备份。当备份完成后，归档位会被清除。使用此归档位和你的备份软件，你可以进行以下类型的备份：\n\
  \n![image](img/box.jpg)\n- **全备份**：所有选定的目录和文件都将被备份，无论其归档位状态如何。全备份会清除所有备份文件的归档位。\n\
  ![image](img/box.jpg)\n- **增量备份**：仅备份归档位为开启的文件。使用此归档位和你的备份软件，你可以进行以下类型的备份（不，此处此处逻辑应更正）：增量备份仅备份自上次备份以来归档位为开启的文件。当增量备份完成后，归档位会被清除。在恢复时，需要按顺序恢复所有磁带以获取所有数据。在这种情况下，增量备份通常减少了每天备份所需的时间，但增加了恢复时介质故障的风险。\n\
  ![image](img/box.jpg)\n- **差异备份**：与增量备份类似，它备份自上次全备份以来所有更改的文件。差异备份的关键区别在于其归档位一直保持开启。后续的差异备份都会备份相同的文件。差异备份制作时间较长，但可以减少恢复所需的时间。\n\
  \n在理想情况下，总是执行全备份是最好的。如果系统发生故障，你只需要最近的备份磁带即可完全恢复系统。然而，由于许多原因，每天执行全备份可能并不可行。原因之一可能是每天没有足够的时间执行全备份。另一个原因是通过减少它们的工作量来延长介质的寿命。你需要权衡这些考虑与从全备份结合增量或差异备份恢复所需的增加的时间，以及无法正确恢复备份的可能性。\n\
  \n混合这些备份类型的一种常用方法是每周执行一次系统全备份，每天只执行增量或差异备份。查看以下示例：\n\n![image](img/box.jpg)\n\n\
  ### 每周五晚上全备份，周一至周四增量备份\n如果系统在周一早上输入任何数据之前发生故障，你只需要上周五晚上的全备份。如果系统在周四早上发生故障，你需要顺序恢复四盘磁带以检索所有数据：上周五的全备份，然后周一、周二和周三晚上的增量磁带。此外，为了保证数据的完整性，你必须能够按顺序恢复所有这些磁带，否则你将面临文件不匹配的风险。在这种情况下，你有四个介质故障点，这可能意味着比你愿意承担的风险更大。\n\
  \n### 周周五晚上全备份，周一至周四差异备份\n在这种情况下，如果系统在周一早上输入任何数据之前发生故障，你只需要上周五晚上的全备份。如果系统在周四早上发生故障，你只需要恢复两盘磁带：上周五的全备份和周三晚上的差异备份。由于差异备份备份了自上次全备份以来所有更改的文件，你永远不需要恢复超过两盘磁带，从而减少了可能的故障点。\n\
  \n\n\n\n\n| ![image](img/common.jpg) | `TIP` 如果你的数据极其关键且难以重构，你通常可以每晚执行全量备份，并在中午期间插入一次快速的增量备份。这样，你丢失的数据将不会超过半天。\
  \ |\n\n你也可以选择比 GFS 更简单的轮转方案。例如，你可能只使用两或三张磁带，然后按顺序轮转它们，每次轮转时都覆盖旧数据。这让你能够恢复前三天内任何某一天的数据。该方案的缺点是，你可能需要追溯到更早的时间才能恢复那些被擦除或损坏且未被立即察觉的数据。你可以通过使用几块磁带并每周或每月轮转一次来解决这个问题。\n\
  \n在考虑不同的磁带轮转方案时，需要记住的一个因素是备份的`granularity`（粒度）。通常，粒度是指你保留的从早早磁带中恢复数据的灵活性。在标准的 GFS\
  \ 方案中（始终进行全量备份），你可以恢复过去一周内任何一天的文件，也可以恢复过去一个月内任何特定周末（周五）的任何文件，或者恢复过去一年内任何特定月份的任何文件。然而，你无法恢复三个月前在月中创建并在该月结束前被擦除（或损坏）的文件，因为在`任何`备份磁带上都不存在该文件的干净副本。\n\
  \n为重要数据选择轮转方案的最佳建议是：除非有理由不这样做（如前文所述），否则请使用带有全量备份的 GFS 方案。这可以最大程度地提高数据的安全性，最大化你的恢复灵活性，并最小化介质故障的风险。如果由于其他因素迫使你选择不同的方案，请参考本章的讨论为你的情况找到最佳折中方案。\n\
  \n### 粒度与数据损坏：微妙的平衡\n\n仔细考虑粒度的原因之一是数据可能会发生损坏而这种情况未被察觉。例如，我曾处理过一个数据库文件，它在几周前就已经损坏了，但一直在运行且看起来很正常。然而，在问题开始出现后，数据库供应商的技术支持人员发现数据库中某个不经常使用的部分已经丢失且无法修复。该问题是由数据库硬盘上的一个坏道引起的。支持人员恢复数据库并确保其纯净的唯一方法是恢复备份，越往回追溯，直到找到一个没有损坏的数据库副本。然后他们重新输入了自该无损坏副本创建以来添加的数据。由于支持人员回溯的时间得越远，备份之间的时间跨度不断增加，我们需要重新输入的数据量迅速增长。\n\
  \n### 近线备份 (Near-Line Backups)\n\n如今许多公司（特别是运行大型网络的公司）正在转向每天（或更频繁）将公司数据备份到磁盘存储的解决方案。此类解决方案有很多供应商，例如\
  \ EMC 的 `Avamar` 和 `Commvault`。这些解决方案通常采用压缩和去重技术，以比通常情况更紧凑地存储备份数据，并且它们通常可以保留几周的数据，包括每次运行备份程序时产生的多个版本（当数据被修改时）。\n\
  \n此类系统在日常运行有很多有很多，而且与磁带相比，它们备份和恢复数据的速度快得多。然而，在使用此类解决方案时，必须考虑到公司数据面临位置性灾害的风险。例如，如果你的服务器和备份系统都位于同一个数据中心，那么公司的数据就会面临该数据中心发生灾害的风险，如火灾或洪水。\n\
  \n缓解位置性灾害风险有两种方法：\n\n![image](img/box.jpg)\n\n磁盘备份系统通常具有“磁带输出”（tape-out）功能，可以将备份内容写入磁带，然后存储在安全的离线存储地中。这种方案可能是两种缓解策略中更经济的的一种。\n\
  \n![image](img/box.jpg)\n\n你的公司可以将其备份方案托管在 `colocation`（托管）设施中，这是一个远程数据中心，你的公司在那里租赁空间，并为你的设备提供电力数据连接。然后，你通过数据中心和托管设施之间的数据连接进行备份。这种方案可能贵得多，特别是如果你的公司有大量需要定期备份的数据，因为数据中心和托管设施之间的\
  \ `WAN` 链路可能会非常贵，并且可能需要大量的带宽。\n\n### 本章总结\n\n你可以成为世界上最精通网络的人，但如果你没有为公司创建并仔细管理一个适当的灾难恢复计划，你就没有尽职。这个领域的重要性怎么强调都不为过。除了本章，你还应该学习涵盖你的网络操作系统和数据库特定备份恢复指令的材料，以及你所选择的备份硬件设备和备份软件的文档。\n\
  \n下一章将讨论在选择、安装和管理服务器时你应该了解的关键信息。服务器是任何网络的核心，选择可靠、高效的服务器不仅能消除网络中的潜在故障点，还能帮助你避免实际使用你所设计的灾难恢复计划和策略。\n\
  \n![image](img/common4.jpg)\n\n| **第 11 章** | ![image](img/line-1.jpg) | **网络服务器：你想知道但不敢问的一切**\
  \ |\n\n\n\n\n\n![image](img/common5.jpg)![image](img/line1.jpg)存在许多不同类型的服务器：文件服务器和打印服务器、应用服务器、Web\
  \ 服务器、通信服务器等。然而，所有服务器的共同点是都有许多个人依赖它们，而且它们通常是某种网络服务的不可或缺的一部分。由于服务器供几十、上百（甚至数千！）个人使用，因此你用于服务器的计算机需要比普通的工作站高出一两个两个水平。服务器需要比工作站更可靠、更容易维护。此外，它们的运行方式也与工作站不同。本章将介绍网络服务器硬件。你将学习服务器与工作站的区别、不同的服务器硬件配置，以及如何为你的网络准备服务器投入使用。\n\
  \n## 服务器与工作站的区别是什么？\n\n随着高性能桌面电脑的售价达到 750 美元到 1500 美元之间，很难理解为什么一台拥有相同处理器的计算机仅仅因为被设计为“服务器”，费用就会超过\
  \ 7000 美元。然而，服务器计算机确实与工作站不同，它们包含了许多桌面级计算机不具备的功能。这些功能对于服务器的工作至关重要，其工作是尽可能可靠地为大量用户提供数据或服务。\n\
  \n## 服务器处理器\n\n服务器的很大性能源于其中央处理单元，即 `CPU`。虽然服务器对其他组件的性能也敏感（比桌面电脑更敏感），但处理器仍然是决定服务器运行速度快慢的关键。服务器可以使用单个处理器或多个处理器运行。你为服务器选择多少个处理器取决于多种因素。第一点是你正在使用的网络操作系统（`NOS`）。如果你希望使用多处理器处理，则需要仔细研究你拟议使用的\
  \ `NOS` 支持多少个处理器。\n\n如果你计划使用 Windows 系列服务器之一，可以根据你计划运行的版本和版本使用多个处理器。`Windows Server\
  \ 2012` 可以处理从 1 个处理器（基础版）到多 64 个处理器（标准版和数据中心版）。![](img/line1.jpg)\n\n| ![image](img/common.jpg)\
  \ | 注意：如今，大多数处理器在同一块芯片上都有多个处理器核心。给出的允许 Windows 服务器处理器数值是指处理器芯片的数量（换句话说，主板上的插槽数量）。\
  \ |\n\n如果你计划使用 `UNIX`，则取决于情况——某些版本的 `UNIX` 支持多个处理器，而另一些则不支持。另一个需要考虑的因素是服务器执行的任务，以及服务器的任务目前是否受到处理器的限制。文件和打印服务器可能不需要多个处理器。虽然它们从快速的处理器中受益，但这种优势并没有你想象的那么大。对于文件和打印服务器来说，拥有大量的随机访问内存（`RAM`）和快速的磁盘系统要重要得多。相反，数据库服务器是处理器密集型的，无疑从尽可能多且尽可能快速度运行的处理器中受益。（将数据库服务器软件配置为能够优化利用多个处理器也很重要。）Web\
  \ 服务器对处理器的要求通常较低——它们依赖于快速总线、快速的网络连接、大量的 `RAM`、快速磁盘，仅此如此。快速的处理器（或多个处理器）对于大多数 Web\
  \ 服务器来说是很好的，但也可能是过分的。\n\n管理多个处理器需要操作系统承担大量的开销工作。由于由于，在计算机中增加一倍的处理器并不会使其处理能力翻倍；相反，处理器翻倍可能将计算机的速度提高约\
  \ 50% 到 70%。取决于你的操作系统，存在一个收益递减点，超过该点后，增加处理器将不会带来太多的额外性能。这部分与操作系统如何处理多个处理器有关。另一部分与操作系统中执行工作的线程数有关。（线程不能在处理器之间共享，因此如果只有两个主线程在系统中执行所有工作，那么两个两个处理器将不会实质性地提高你的性能。）\n\
  \n## 定义！什么是线程？\n\n多任务操作系统通常使用一种称为“线程”（thread）的机制来实现。事实上，所有现代操作系统都使用线程，包括 Windows（从\
  \ Windows 95 开始）、NetWare 和某些特定版本的 `UNIX`。在利用线程的操作系统中，每个运行的程序都作为一个进程运行，它有自己的内存资源，并与计算机中的其他进程隔离。然而，进程被划分为不同的工作单元，称为线程。这些线程可以访问其运行进程的所有资源，并且是进程内部实际的“工作代理”。例如，像\
  \ `Microsoft Word` 这样的文字处理器可能有一个线程接收用户的打字输入并将其显示在屏幕上，另一个线程处理任何打印任务，还有其他线程在用户工作时在后台检查拼写和语法。在这个示例中，应用程序\
  \ `Word` 是具有多个线程的单进程。在多线程操作系统中，每个进程始终至少有一个线程。\n\n要确定任何特定任务应使用多少个处理器，你应该咨询你计划使用的\
  \ `NOS` 制造商以及你计划在服务器上运行的主要应用程序的制造商。你可能还想与其他在使用拟议服务器应用程序进行类似工作其他公司讨论这些问题。例如，对于一个支持数百名用户的会计系统数据库服务器，你应该与使用相同软件且用户数量大致相同的其他站点的人员交流，了解他们的经验和建议。通过这种方式双重检查你拟议的服务器配置至关重要，因为服务器的不同用途可能需要比你估计的多得多或少得多的硬件资源。\n\
  \n## 英特尔奔腾家族\n\n英特尔奔腾家族有各种不同的处理器，从基础的 Pentium 到 Pentium Xeon 处理器。目前的服务器级计算机通常配备\
  \ Pentium Xeon 处理器。Xeon 系列处理器针对服务器型任务进行了优化，并且更适合在多处理器系统中运行。Pentium Xeon 处理器目前的速度可达\
  \ 3.80 GHz，单芯片上有多达十个核心。Xeon 处理器的设计允许在 Pentium Xeon 系统中使用最多 8 个处理器（在某些第三方系统设计中支持多\
  \ 256 个处理器）。对于某些应用程序，拥有如此数量的处理器可能是一个优势![](img/line1.jpg)\n\n| ![image](img/common.jpg)\
  \ | 注意：通常你不能通过比较一个处理器家族的时钟频率与另一个家族处理器的时钟频率来获取其相对性能的概念。不同家族和来自不同制造商的处理器工作方式完全不同。一个处理器家族需要\
  \ 4 到 6 个指令周期才能完成，另一个处理器家族可能只需要 1 个指令周期。相反，仅使用时钟频率来了解单个家族内部处理器之间的相对速度差异。 |\n\n\n\
  \n\n\n## Intel 克隆产品\n超威微半器件（AMD）制造 `Opteron` 系列处理器，该系列本质上模拟了英特尔家族处理器的功能。AMD 在生产模拟\
  \ Intel 的处理器方面取得了成功，在某些情况下，它们的性能甚至可以超越特尔。\n\n像 `AMD` 这样的克隆芯片的问题在于，尽管其声称并非如此，但它们永远无法与\
  \ Intel 处理器实现 100% 兼容。由于软件供应商*通常*仅针对 Intel 处理器对其软件进行认证，这些供应商在应对克隆芯片出现的任何问题时反应可能会很迟缓。由于这个问题，克隆芯片通常不用于服务器级机器，因为在这些机器中，可靠性和维护性至关重要。\n\
  \n![](img/line1.jpg)\n\n| ![image](img/common.jpg) | **提示** 在选择任何服务器硬件之前，确保你计划使用的网络操作系统（NOS）制造商对整个系统（包括处理器）进行了认证。此外，确保你计划在服务器上运行的任何应用程序的制造商对你所选择的硬件进行了认证也是明智的。（大多数服务器应用程序制造商仅要求硬件通过操作系统的认证，但双重检查是明智的。）\
  \ |\n\n## PowerPC\n最初，摩托罗拉、IBM 和苹果合作设计并使用 `PowerPC` 处理器，这是一种基于精简指令集计算机（RISC）的处理器，由摩托罗拉制造，但很大程度上基于\
  \ IBM 的设计。`PowerPC` 曾用于 Apple Macintosh （现在的 Mac 使用 Intel 处理器）以及 IBM 和摩托罗拉的一些基于\
  \ UNIX 的服务器。\n\n## 总线能力\n对于大多数服务器来说，核心在于移动数据——通常是*大量*数据。文件和打印服务器可能需要同时向数百名用户提供数百个文件，并协调处理所有这些用户的数据需求。数据库服务器可能管理大小为数\
  \ GB 或 TB 的数据库，它们必须从数据库中检索大块数据并在毫秒内提供给用户。应用程序服务器在为用户提供服务的同时，可能执行处理器密集型和密集密集的操作。\n\
  \n正如网络通常有快速的骨干段连接许多较慢的段一样，计算机依靠其总线来完成类似的工作。`bus` 是计算机系统的数据传输“骨干”，处理器、内存和所有安装设备都连接在上面。\n\
  \n在任何给定时刻，服务器在执行任务时都可能将数 GB 的数据从磁盘移动到网卡、处理器、系统内存，然后返回磁盘。所有这些组件都通过系统总线连接在一起，因此尽可能地优化计算机的这部分是有意义的。总线处理的数据量可能是系统中任何单个组件的五倍，而且它需要快速完成。虽然传统的外围组件接口（`PCI`）总线可以处理\
  \ 33 MHz/32 位的数据，但这对于高端服务器来说是不够的。许多服务器必须处理多个网络接口卡（`NICs`）（每个运行速度高达 10 Gbps）和多个运行速度高达\
  \ 9.6 Gbps 的磁盘控制器。如果这些设备同时忙碌，即使是 `PCI` 总线也会迅速饱和。\n\n因此，服务器制造商需要解决总线速度限制。制造商使用了几种方案来实现这一点。其中一种方法是在单个系统中使用多个总线。例如，某些服务器使用三条\
  \ `PCI` 总线，它们可以同时以全速运行。只需在在不同总线上放置某些外设设备上稍加规划，就可以大幅提高系统的整体速度。\n\n## RAM\n任何服务器的另一个重要部分是其安装内存。服务器从网络和服务器磁盘缓存数据以获得最佳性能，它们严重依赖\
  \ `RAM` 来实现这一点。例如，大多数 `NOSs` 会缓存它们存储的整个文件目录以便快速访问。它们还会将请求的文件在缓存中保留较长时间，以防再次需要文件中的数据。它们还通过\
  \ `RAM` 中的写入缓存缓冲到系统磁盘的写入操作，并异步执行实际的磁盘写入，这样磁盘就不会像通常那样成为瓶颈。\n\n对于大多数服务器来说，4 到 8GB\
  \ 的 `RAM` 应该被认为是最低限额。对于支持数百名用户的重型数据库服务器，你可能需要数 GB 的 `RAM` 来获得获得最佳性能。（某些高端服务器可以支持高达\
  \ 768GB 的 `RAM`）。![](img/line1.jpg)\n\n| ![image](img/common.jpg) | **提示** 你的服务器到底需要多少\
  \ RAM？这很难说，因为很大程度上取决于服务器如何使用。好消息是，Windows 系列服务器提供了显示系统内存使用情况的统计数据。你可以利用这些信息来帮助判断何时增加内存会更有益。对于\
  \ Windows 系列服务器操作系统，使用 `Performance Monitor`（性能监视器）查看内存和系统交换文件的使用情况。此外，大多数高端数据库（如\
  \ `Oracle`）将提供内存使用信息，帮助你确定多少 `RAM` 能帮助数据库发挥最佳性能。 |\n\n`RAM` 有三种类型：非校验（nonparity）、校验（parity）和纠错码（`ECC`）。校验\
  \ `RAM` 为每个字节使用一个额外的位来存储字节内容的校验和。如果当读取内存时校验和不匹配，系统将停止运行并报告内存错误。非校验内存消除了校验位，因此无法检测到任何内存错误。廉价的桌面电脑有时为了降低成本而使用非校验\
  \ `RAM`，尽管即使在桌面电脑上，你也应该尽可能避免使用它。\n\n基于校验的内存有两个问题。首先，系统只能检测内存错误，而无法修正它们。其次，由于只使用一个位来存储校验，可能用更严重的错误来“欺骗”校验机制。例如，如果两个位同时改变极性，校验系统将检测不到该问题。`ECC`\
  \ 内存旨在解决这些问题。使用 `ECC` 内存的系统可以检测多达两位错误，并自动修正一位错误。\n\n## 磁盘子系统\n服务器的第三个关键性能子系统是它的磁盘驱动器。硬盘通常是任何系统中最慢的组件，由于服务器的大部分工作涉及硬盘，因此它们是最可能成为系统瓶颈的组件。此外，存储在服务器上的数据通常对公司至关重要，因此拥有你负担范围内的最可靠磁盘配置非常重要。\n\
  \n## 磁盘接口：SCSI vs. SATA\n今天有两种磁盘接口被广泛使用：串行接口（`SATA`）和小型计算机系统接口（`SCSI`）（一种较新的 `SCSI`\
  \ 形式称为 `SAS`，代表串连接 SCSI。`SAS` 在中端服务器中很流行。）对于使用 Windows 7 的工作站，`SATA` 的性能与基于 `SCSI`\
  \ 的磁盘系统相当。然而，对于运行 Windows 或 Linux 的服务器，`SCSI` 提供了明显的性能优势。当 `SCSI` 系统同时访问多个硬盘，并且运行在能够充分利用\
  \ `SCSI` 特性的操作系统（如 Windows 服务器系列或 UNIX/Linux）上时，其性能会好得多![](img/line1.jpg)\n\n| ![image](img/common.jpg)\
  \ | **注意** SCSI 的发音是“scuzzy”。曾有一段时间，Macintosh 用户尝试将其发音为“sexy”，但并没有流行起来。（SCSI 首次在\
  \ Macintosh 上广泛使用，至少在个人电脑领域。） |\n\n\n\n\n\n有多种基于 SCSI 的磁盘系统可用，如下：![image](img/box.jpg)\n\
  \n### SCSI-1\n基础 SCSI 规范可以使用 8 位传输宽度以约 5 MBps 的速度在磁盘之间传输数据。SCSI 技术的进步使得 SCSI-1 过时，它在当前系统中不再使用。（这是一件好事，因为大多数\
  \ SCSI-1 实现之间互不兼容。）![image](img/box.jpg)\n\n### SCSI-2\n这是目前使用的基础 SCSI 接口。它扩展了 SCSI\
  \ 规范并为 SCSI 增加了许多功能，还允许更 SCSI 连接。此外，SCSI-2 大大提高了不同 SCSI 设备制造商之间的 SCSI 兼容性。![image](img/box.jpg)\n\
  \n### Fast SCSI\n通过 Fast SCSI，基础 SCSI-2 规范得到增强，将总线速度从 5 MHz 提高到 10 MHz，吞吐量从 5 MBps\
  \ 提高到 10 MBps。Fast SCSI 也称为快速窄 SCSI（Fast Narrow SCSI）。![image](img/box.jpg)\n\n\
  ### Wide SCSI\nWide SCSI 也基于 SCSI-2，将 SCSI-2 数据路径从 8 位增加到 16 或 32 位。使用 16 位时，Wide\
  \ SCSI 可以处理高达 20 MBps。![image](img/box.jpg)\n\n### Ultra SCSI\n也称为 SCSI-3，该规范将 SCSI\
  \ 总线速度进一步提高到 20 MHz。使用窄的 8 位总线时，Ultra SCSI 可以处理 20 MBps。它还可以在 16 位总线运行运行，将速度进一步提高到\
  \ 40 MBps。![image](img/box.jpg)\n\n### Ultra2 SCSI\n这是 SCSI 标准的另一项增强，Ultra2 SCSI\
  \ 再次使 Ultra SCSI 的性能翻倍。Ultra2 SCSI 子系统可以使用 16 位总线扩展到 80 MBps。![image](img/box.jpg)\n\
  \n### Ultra160 SCSI\n现在你应该知道这个故事了：Ultra160 SCSI 再次将 Ultra2 SCSI 的性能翻倍。Ultra160 SCSI（以前称为\
  \ Ultra3 SCSI）以其 160 MBps 的吞吐量命名。![image](img/box.jpg)\n\n### Ultra320 SCSI\nUltra320\
  \ SCSI 可以以 320 MBps 的速率移动数据。![image](img/box.jpg)\n\n### Ultra640 SCSI\nSCSI 接口速度再次翻倍，Ultra640\
  \ SCSI 于 2003 年初作为新标准发布。![](img/line1.jpg)\n\n| ![image](img/common.jpg) | **注意**\
  \ 一种称为光纤（Fibre Channel）的存储连接技术可以使用光纤或铜缆，是一种比 SCSI 灵活得多的连接方案，并承诺吞吐量比 Ultra640 SCSI\
  \ 快许多倍。光纤松地基于网络范式，最初实现成本很高，但大型数据中心将从其相对于 SCSI 的进步中极大获益。 |\n\n从前面的列表中可以看出，市场上有令人眼目的\
  \ SCSI 选择。由于存在所有不同的标准，在构建 SCSI 磁盘子系统或作为服务器的一部分购买时，确保购买匹配的组件是一个好主意。确保你计划使用的控制器卡与你将使用的驱动器兼容，使用适当的电缆，并且与你将使用的服务器计算机和网络操作系统（NOS）均兼容。好消息是，一旦你运行了\
  \ SCSI 磁盘子系统，它将可靠地运行并具有出色的性能。\n\n## 磁盘拓扑：它是 RAID！\nRAID 缩写代表独立磁盘冗余阵（redundant array\
  \ of independent disks）。RAID 是一种使用许多磁盘完成一个磁盘工作的技术，与使用较少较大的磁盘相比，它提供了许多优势。\n\nRAID\
  \ 的基本思想是将服务器的数据无缝地分布在许多磁盘上。例如，单个文件的一部分可能分布在四或五块磁盘上。RAID 系统管理所有这些部分，因此你永远不知道它们实际上分布在所有磁盘上。你打开文件，RAID\
  \ 系统访问所有适当的磁盘并“重组”文件，向你提供整个文件。\n\n你获得的直接益处是，多个磁盘的执行速度比单个磁盘快得多。这是因为所有磁盘都可以独立地寻找自己的数据并将其发送到控制器进行组装。单个磁盘驱动器会受到单个磁头的限制，收集相同的数据需要更长的时间。随着你增加磁盘的数量，RAID\
  \ 系统的性能就会提高，因为有了所有磁盘磁头独立工作检索所需数据的益处。\n\n如果你考虑数据分布在许多磁盘上的简单 RAID 阵列，你可能会注意到，虽然它提高了性能，但也增加了磁盘故障的可能性。使用五块磁盘来完成一块磁盘的工作意味着磁盘故障的可能性增加了五倍。由于数据分布在所有磁盘中，如果其中一块坏了，你可能不得不丢掉所有剩余磁盘上的数据，因为如果丢失了一大部分，数据就没用了。在某些\
  \ RAID 方案中有许多组合使用多个磁盘的方法，因此定义了许多 RAID 级别，每种级别描述了一种不同的技术，如下：![image](img/box.jpg)\n\
  \n### RAID 0\n这种方案是将数据分布（条带）在多个磁盘上的配置，但没有冗余。在 RAID 0 中丢失一个驱动器会导致所有磁盘上的数据丢失。RAID\
  \ 0 仅适用于提高性能，应该只用于非本质数据。RAID 0 阵列可以在两个或多个磁盘上进行数据条带化，如图 11-1 所示。![](img/line.jpg)![image](img/fig11-1.jpg)![](img/line.jpg)![image](img/fig11-2.jpg)![](img/line1.jpg)\n\
  \n\n\n\n\n![image](img/box.jpg)\n\n## RAID 2\n\n你可能在现实世界中看不到 RAID 2 的实现。RAID 2 是一种技术规范，它将数据分布在多个磁盘上进行条带化，然后使用哈明码（Hamming\
  \ Code）ECC 将其写入一组 ECC 磁盘中。RAID 2 中 ECC 磁盘与数据磁盘的比例非常高：每四个数据磁盘就对应三个 ECC 磁盘。RAID 2\
  \ 因为效率低下而没有被广泛使用。\n\n![image](img/box.jpg)\n\n## RAID 3\n\n这就是 RAID 开始变得有趣的地方。RAID\
  \ 3 的实现曾经相当常见，尽管现在 RAID 3 极其罕见；你看到的 RAID 5 远比 RAID 3 多。RAID 3 将数据在多个数据磁盘上进行条带化，然后对每个数据磁盘上的所有存储数据进行“异或”（XOR）位运算以生成\
  \ ECC 数据，并将其写入单个 ECC 驱动器中。例如，你有四个数据驱动器和一个 ECC 驱动器来对它们进行备份。图 11-3 显示了一个包含五个磁盘的 RAID\
  \ 3 阵列。\n\nXOR 数据具有有趣的数学属性。如果你移除其中一个数据驱动器，可以利用剩余数据加上 ECC 驱动器上的数据，重建出故障驱动器丢失的内容。RAID\
  \ 3 阵列中丢失哪个磁盘都无所谓；只要其他磁盘仍正常工作，你始终可以重建数据。如果驱动器发生，RAID 磁盘控制器会自动执行此操作，但由于需要实时重建数据的开销，驱动器的运行速度会比正常情况下慢。更实用的技术是更换故障驱动器，然后使用\
  \ ECC 数据来重建丢失的数据。\n\n![](img/line.jpg)![image](img/fig11-3.jpg)![](img/line.jpg)\n\
  \n**图 11-3.** RAID-3 阵列将数据跨多个磁盘进行条带化处理，并有一个 ECC 磁盘来保护数据。![](img/line1.jpg)\n\n|\
  \ ![image](img/common.jpg) | 注意：如果 RAID 3 或 RAID 5 阵列丢失了多个驱动器，整个阵列的数据都将丢失。尽管如此，这些阵列以相对较低的增量成本提供了良好的保护。\
  \ |\n\n\n\n\n\n![image](img/box.jpg)\n\n## RAID 4\n这是另一种在大多数服务器中并不经常使用的 RAID 标准，尽管它有时会在专用存储设备中使用。`RAID\
  \ 4` 与 `RAID 3` 类似，不同在于在不同数据驱动器之间分布的数据块比 `RAID 3` 大得多。`RAID 4` 仍然为所有数据驱动器使用单个 ECC\
  \ 磁盘。\n\n![image](img/box.jpg)\n\n## RAID 5\n图 11-4 所示的 `RAID 5` 是目前 RAID 系统的标准。（`RAID\
  \ 1` 仍然是当前标准，但它有不同的应用。）回想 `RAID 3` 的工作原理，数据分布到一组数据磁盘，并将 ECC 代码写入单个 ECC 磁盘。`RAID\
  \ 5` 通过将数据和 ECC 信息交叉分布在所有磁盘上改进了这一方案。这种方法相比 `RAID 3` 的优点是它不再依赖单个 ECC 驱动器进行所有的写入操作，这在\
  \ `RAID 3` 系统中会成为瓶颈。因为所有驱动器共享 ECC 工作，所以 `RAID 5` 的性能比 `RAID 3` 更好。不过，这也有一些某些评论者忽略的小缺点。在\
  \ `RAID 3` 中，如果你丢失了一个数据驱动器，系统会变慢（通常是剧减），因为数据正在实时重建。然而，如果你丢失了 ECC 驱动器，系统的运行速度仍然像没有丢失磁盘一样快。在\
  \ `RAID 5` 中，如果你丢失了一个驱动器，你就始终在丢失 ECC 驱动器的一部分，因为它的工作分布在所有磁盘上，所以无论如何你都会变慢。\n\n![](img/line.jpg)![image](img/fig11-4.jpg)![](img/line.jpg)\n\
  \n**图 11-4.** `RAID 5` 阵列将数据跨多个磁盘进行分布，并交替使用所有磁盘进行 ECC！\n\n![image](img/box.jpg)\n\
  \n## RAID 6\n`RAID 6` 的工作与 `RAID 5` 相同，但它将校验数据存储在两个交叉的驱动器上，而不是 `RAID 5` 的一个。`RAID\
  \ 6` 也称为“双数据保护”，可以在从单个驱动器故障中恢复时保持你的数据安全。（在 `RAID 5` 中，如果你在从另一个驱动器故障恢复时驱动器故障，你将丢失阵列的数据。）\n\
  \n![image](img/box.jpg)\n\n## 嵌套 RAID 组合\n为了增加性能和数据保护，对于高度关键的高性能磁盘存储系统（如存储区域网络磁盘系统），将\
  \ RAID 级别组合是非常常见的。最常见的组合有 `RAID 1` 和 `0`（`RAID 10`）、`RAID 5` 和 `0`（`RAID 50`）以及\
  \ `RAID 6` 和 `0`（`RAID 60`）。例如，一个 `RAID 50` 阵列由三个或多个 `RAID 0` 条带驱动组组成，每组看起来就像整个\
  \ `RAID 5` 阵列中的一个驱动器。在这个例子中，`RAID 0` 阵列被认为是**嵌套**在整个 `RAID 5` 阵列中。\n\n你应该在网络服务器上使用哪种级别的\
  \ RAID？大多数网络管理员倾向于使用 `RAID 5`，因为冗余功能只需要总磁盘容量的 20% 到 25%（取决于阵列中磁盘的数量），但它的性能良好并提供了一定的安全性。然而，`RAID\
  \ 3` 和 `RAID 5` 阵列偶尔无法正确恢复数据（尽管它们极少丢失数据）。出于如此，对于存储重要数据的网络服务器，你通常应该选择 `RAID 1` 或\
  \ `RAID 10` 阵列。\n\n通常，不同的 RAID 配置提供不同级别的可靠性。纯从系统丢失数据的概率来看，从最好到最坏依次是 `RAID 1`、`RAID\
  \ 10`、`RAID 6`、`RAID 5` 和 `RAID 3`。不过，总是存在权衡。一个仅使用 `RAID 1` 的 20 磁盘系统将难以管理，因为你有\
  \ 10 个逻辑驱动器需要管理和高效使用。然而，如果你将这同样的 20 磁盘配置为两个 `RAID 5` 阵列，你就能更有效地管理由此产生的两个逻辑磁盘。但是，对于\
  \ 20 个磁盘，你的整体故障率是使用 5 个磁盘构建的阵列的四倍。\n\n你必须根据数据重要性、所需的性能水平、服务器的能力以及你的可用预算做出自己的决定。然而，你**永远**不要做的一件事是相信任何\
  \ RAID 级别都可以替代常规、经过测试且可靠的网络数据磁带备份！\n\n## 服务器状态监控\n大多数服务器的一个重要功能是监控其内部组件的能力，并在出现任何问题或可能出现问题时通知你。高级服务器通常可以监控以下内容：\n\
  \n![image](img/box.jpg) 风扇运行正常！\n![image](img/box.jpg) 系统电压！\n![image](img/box.jpg)\
  \ 内存错误，即使被 ECC 内存修正！\n![image](img/box.jpg) 磁盘错误，即使被自动修正！\n![image](img/box.jpg)\
  \ 外壳温度！\n![image](img/box.jpg) 操作系统挂死！\n![image](img/box.jpg) 机箱打开\n\n这些错误中的任何一个都可能指示服务器当前或即将出现的问题。例如，被系统\
  \ ECC 内存修正的 1 位内存错误可能不会给服务器带来问题，因为它被修正了，但它可能表明某个 `RAM` 芯片或一组 `RAM` 正在开始出现故障。同样，机箱内温度升高可能不会立即导致问题，但可能表明风扇运行不正常、进气口堵塞或面临其他问题，最终高于服务器设计允许的温度将导致故障。\n\
  \n服务器状态监控解决方案可以通过电子邮件、传真机或短信息（SMS）向你警报问题。某些甚至在服务器或机房断电时也能运行（这被称为“离机运行”能力）。许多高级服务器还提供“预故障”保修，规定制造商将更换任何报告即使是轻微错误的组件，以便你可以在严重问题发生之前对其进行更换。对于那些你依赖其尽可能可靠的服务器，此类监控和保修功能可能是真正的救命稻草。\n\
  \n## 热插组件\n大多数现代服务器都包含热插组件，你可以在系统继续运行时对其进行更换。通常，热插组件限于磁盘、电源供应和风扇，它们都以冗余配置运行。例如，系统可能有两个电源；如果其中一个故障，系统仍正常运行，你可以在不需要关闭服务器的情况下更换故障的电源。同样，大多数\
  \ RAID 磁盘配置允许你在不关闭服务器的情况下更换故障的驱动器，前提磁盘是安装在热插配置中的。\n\n![](img/line1.jpg)\n\n| ![image](img/common.jpg)\
  \ | 提示：许多 RAID 磁盘系统允许你安装备用磁盘，系统本身会使用该备用磁盘自动替换任何故障驱动器。当然，随后你应该尽快更换实际故障的磁盘，更换后的磁盘将成为磁盘阵列的新备用磁盘。\
  \ |\n\n\n\n\n\n# 为 Windows 选择服务器\n\n在本节中，你将学习定义服务器需求、选择服务器以及购买服务器的各种知识。\n\n## 定义服务器需求\n\
  \n在查看不同的服务器模型之前，你需要清楚地理解服务器必须满足的需求。否则，你可能会面临硬件购买过剩或购买不足的风险，这两种情况都可能导致问题，并可能导致你花费比实际需要的费用。购买不足会导致额外的、未计划的购买，这可能包括添加更多磁盘或更多内存，甚至可能需要过早地更换服务器。购买过剩意味着你为服务器花费了比必要的更多的费用，这可能导致你的公司拒绝你对某个特定服务器的请求。相反，你需要找到一个“平衡点”，为你的需求指定一台恰好合适的服务器；这样，你就可以对你所要求的配置及其成本提供辩护。除非你明确定义了自己的需求，否则你无法完成任何这些操作。\n\
  \n为了清楚地界定服务器的需求，你必须能够回答以下所有问题：\n\n![image](img/box.jpg)\n\n*   **服务器的使用寿命是多久？**\
  \ 你预计使用该服务器多久？你计划在两年、三年还是四年后更换它？（大多数服务器在更换之前使用大约三年的。）所有人应该对这个时间范围达成共识，因为如果你计划在两年后更换服务器，那么与需要服务器运行三四年相比，你可以使用一台较小的服务器。然而，如果你指定了一台能够满足两年需求的服务器，你可希望在两年结束时才发现你的公司不批准更换。\n\
  \n![image](img/box.jpg)\n*   **服务器将执行什么任务？** 它将是文件和打印机服务器、Web 服务器、数据库服务器，还是其他其他类型的服务器？\n\
  \n![image](img/box.jpg)\n*   **服务器将支持多少用户，这些用户的需求是什么？** 例如，对于文件和打印机服务器，你必须估计满足所有计划用户请求所需的存储和带宽需求。对于数据库服务器，你必须知道服务器需要多快地响应各种数据库操作。\n\
  \n![image](img/box.jpg)\n*   **服务器的可靠性要求有多高？** 如果服务器宕机一或几小时，或者两天，会有什么后果（成本和影响）？\n\
  \n![image](img/box.jpg)\n*   **你会对服务器使用集群技术吗？** 集群是一种多台服务器共享相同核心任务的技术。如果其中一台故障，所有工作将继续进行，尽管速度较慢。一旦故障的服务器修复，它就可以重新添加到集群中。\n\
  \n![image](img/box.jpg)\n*   **服务器上的数据防丢失安全性有多高？** 这与上一个问题不同，因为可能会遇到某些情况，服务器绝不能丢失数据，即使服务器宕机几小时也没什么大。在这种情况下，你会使用\
  \ `RAID 1` 或 `RAID 10` 配置，但你可能不太在意，比如冗余电源。你还可能探索某种分层存储方案，将数据实时复制到磁带或光盘上，或者你每天每天对文件进行多次实时增量备份。\n\
  \n![image](img/box.jpg)\n*   **如果服务器故障，你的恢复计划是什么？** 你是计划保留一台热备服务器（即随时准备好交换以替换故障服务器的服务器），还是计划简单地依靠服务器制造商的服务能力？此外，有时如果一台服务器故障，现有的其他服务器可能临时满足它的部分需求。例如，在\
  \ Windows 网络中，如果域控制器发生故障，你可以让其他域控制器为整个网络提供这种必要的功能。或者你可能在另一台服务器上定义了冗余的打印队列，准备在主打印服务器故障时可用。\n\
  \n![image](img/box.jpg)\n*   **你计划如何备份服务器？** 你是计划在服务器本身上配备磁带驱动器，还是计划通过网络将其备份到其他服务器的备份设备上？你是计划在服务器使用期间进行备份，还是在晚上不使用时进行备份？这些是需要回答的重要问题，因为如果你将备份设备托管在服务器上，你还需要在服务器上安装备份软件。如果你计划在服务器使用期间备份服务器，你需要一个连接到快速服务器总线的快速备份系统，以最大限度地减少对白天期间对用户的影响。如果你计划通过网络连接备份服务器，你需要足够快的网络连接来处理服务器上的数据量。在指定服务器时，请仔细考虑你的备份计划。\n\
  \n![image](img/box.jpg)\n*   **对服务器提出的需求如何随时间发生变化？** 公司是否正在激进地招聘更多员工，以便服务器在一年后可能需要支持两倍的用户，两年后需要支持四倍的用户？确保你理解了公司的整体计划，并将其纳入你对服务器需求的评估中。此外，即使在用户数量相对静态的公司中，每个用户所需的存储量仍会快速增长。一个经验法是，在其他条件相同的情况下，估计当前的存储需求每\
  \ 18 个月翻倍。如果你有关于用户消耗存储的历史数据，这些数据可以帮助你更准确地估计你的系统需求。（不要忘记预测任何可能快速增加你存储需求的新服务！）\n\n\
  ![image](img/box.jpg)\n*   **新服务器需要与任何现有硬件配合吗？** 例如，如果你需要重用备份设备，你应该确保新服务器能够正确支持它（反之亦然）。\n\
  \n![image](img/box.jpg)\n*   **你有多少可用物理空间来放置服务器？** 你是否由于空间要求的迫使而选择最小的服务器？一旦你回答了这些问题以及出现的任何其他问题，你就可以开始查看可以满足需求的各种服务器了。\n\
