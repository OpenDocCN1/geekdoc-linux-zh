  \ `NOS` 厂商的认证）。\n\n大多数服务器制造商都已让安装其服务器以及在服务器上安装 `NOS` 变得非常简单。`HP` 和 `Dell` 等公司甚至随服务器附带了特殊的\
  \ `CD-ROMs`，可以自动实现在服务器上安装各种 `NOS` 的过程，并安装 `NOS` 与服务器硬件优化工作所需的任何支持文件。在服务器上安装 `NOS`\
  \ 之前，请确保仔细阅读服务器文档，并利用服务器制造商提供的任何自动化工具。\n\n![](img/line1.jpg)\n\n| ![image](img/common.jpg)\
  \ | `TIP` | 顶级服务器制造商（例如 `HP` 和 `Dell`）维护着电子邮件通知系统，让你了解他们发布的任何新补丁或特定型号的任何严重问题。这些电子邮件服务非常有用，因此你应该计划在收到任何新服务器后立即订阅。\n\
  \n还有一点需要考虑的：有时服务器在制好后，会在库存中存放几个月才被售出。因此，服务器可能没有配备最新的软件。在安装服务器之前，检查制造商网站是否有任何软件包中未包含的更新，并考虑在实施过程中安装这些更新。\n\
  \n## 服务器的维护与故障排除\n\n为了最好地完成服务器的维护和故障排除，你需要采取措施来完成两件事：降低故障概率，以及提高快速解决任何发生故障的概率。问题是不可避免的，但通过在实际出现问题*之前*采取措施，你可以大大减少遇到问题的几率，并大大提高快速解决问题的几率。\n\
  \n### 以降低故障概率\n\n确保遵循之前提供的所有建议：使用可靠、经过测试的服务器和组件。你还应该采取这些额外步骤：\n\n![image](img/box.jpg)\n\
  \n- 尽可能尽可能尝试减少服务器必须执行的任务数量。虽然构建一台既是文件和打印服务器，又是数据库服务器、电子邮件服务器和 Web 服务器的单台服务器是可能的，但从整体可靠性来看，将这些职责分离到较小的、独立的服务器上会好得多。\n\
  \n![image](img/box.jpg)\n\n- 养成频繁查看服务器错误日志的习惯。如果服务器 `NOS` 支持错误通知（例如发送到传真机或 `SMS`\
  \ 短信），考虑实现此功能。许多故障始于错误消息，这些消息可能比实际故障早出现几个小时，因此尽早警报可能帮助你保持服务器运行，或者至少让你能够在最佳时机解决问题。\n\
  \n![image](img/box.jpg)\n\n- 如果服务器支持监控服务器状况的管理软件，请确保安装该软件。\n\n![image](img/box.jpg)\n\
  \n- 大多数支持故障驱动器热插的 `RAID` 阵列也要求 `NOS` 安装特殊软件以完全支持此功能。请确保在任何故障发生之前安装此软件。\n\n![image](img/box.jpg)\n\
  \n- `NOS` 软件是可用软件中 Bug 最少的软件之一，但完全没有 Bug 的软件这种事是不存在的。随着时间的推移，任何 `NOS` 最终都会失效。虽然许多服务器运行一年而不需要重启，但你最好养成定期关闭并重新启动服务器的习惯。这种做法可以消除可能累积并最终导致服务器崩溃的小型瞬态错误，例如\
  \ `NOS` 中的内存泄漏。此类重启的最佳频率是每月一次。\n\n![](img/line1.jpg)\n\n| ![image](img/common.jpg)\
  \ | `CAUTION` | 在关闭并重启服务器之前，请确保已进行备份。硬件故障最大的概率发生在系统再次通电的时候。 |\n\n\n\n\n在实现服务器以替换现有服务器时，在将服务器投入使用之前进行三次良好的备份并测试恢复是一个好主意。这似乎是多此一举，但你不知道何时可能需要恢复数据，而且知道你的备份和恢复实践能够正常运行至关重要。\n\
  \n你还可以做一些通用工作，以提高你快速解决任何服务器故障的能力。最重要的是为每台服务器维护一个详尽的活夹（或文件盒），我称之为“重建工具包”。这个活夹应该包含以下内容：\n\
  \n![image](img/box.jpg)\n- 服务器的所有购买数据，包括你的购买订单和供应商发票的副本。\n![image](img/box.jpg)\n\
  - 服务器配置的打印件。大多数服务器的设置程序都能生成一份包含所有组件及其版本的详细列表。HP 的 `Insight Manager` 在此方面非常出色。\n\
  ![image](img/box.jpg)\n- 从零开始完全重建服务器所需的所有软件。这包括服务器的安装软件、`NOS` 软件、设备驱动程序磁盘以及你需要的或已应用的任何补丁盘。记住将你在服务器生命周期内获得的任何新驱动程序或补丁加入箱中，以便它们随时可用。\n\
  ![image](img/box.jpg)\n- 服务器服务的联系信息，包括任何扩展保修合同编号或其他获取服务所需的信息。\n![image](img/box.jpg)\n\
  - 用于记录服务器配置的所有更改和出现的任何错误信息的记事纸。清楚地写下所有信息，注明日期、时间以及你（或其他人）在服务器故障时修复它可能需要的任何细节。\n\
  ![image](img/box.jpg)\n- 一份打印件或文档，记录关于服务器的任何特殊之处或你如何配置磁盘驱动器的说明，包括 `NOS` 设置。如果你必须从零开始重建，就需要这些设置。了解这些设置可能让你能够恢复服务器磁盘上的数据，从而让你无需从备份磁带中恢复数据。![](img/line1.jpg)\n\
  \n| ![image](img/common.jpg) | 注意：对于任何服务器，都需要一个强大的备份计划，配合适当的磁带轮换，并定期测试你从制作的磁带中恢复数据的能力。目标是永远不需要使用这些磁带，但当磁盘崩溃并丢失存储的数据时，它们将为你提供绝对至关重要的安全网。\
  \ |\n\n即使你是世界上最擅长排除计算机故障的人，也应该计划与服务器制造商的售后部门合作来排除任何问题。这样做可以节省你的精力，因为该部门的人拥有丰富的数据库，记录了他人遇到过的问题。他们还熟悉在你努力排除故障时帮助防止数据丢失的必要步骤。无论你多么富有经验和知识，独立排除服务器故障通常通常是一个错误，因为即使是一个微小的错误，其后果也可能是巨大的。\n\
  \n## 章节总结\n在构建网络时，你应该最关注的组件是服务器。虽然网络的其他部分（如布线、网络架构或工作站）也很重要，但服务器是最容易随着时间推移而出现问题的组件。服务器是你必须花费最多时间进行管理的单一组件。因此，在选择、实施和维护服务器时要格外小心。如果你照顾好你的服务器，服务器就会照顾你。\n\
  \n下一章涉及网络工作站计算机，并讨论了台式计算机的不同需求、你应该如何购买和管理它们，以及如何为其提供支持。\n\n![image](img/common4.jpg)\n\
  \n| 第 12 章 | ![image](img/line-1.jpg) | 购买和管理客户端计算机 |\n\n\n\n\n\n![image](img/common5.jpg)![image](img/line1.jpg)\n\
  \n在网络领域，台式电脑才是真正的“实战金石”。这些机器是用户访问网络的主要接口，也是用户完成工作最依赖的资源。事实上，网络的设计是为了支持台式电脑的工作，而不是相反。维护台式电脑也是你在管理网络时经常花费最多任务，因此它们的购买、实施和管理至关重要。你可以拥有世界上最好的网络，但如果你的台式电脑无法胜任，网络的用户就无法高效生产。\n\
  \n本章专注于台式电脑的管理。你可能已经熟悉了构成台式电脑和台式操作系统的位和字节。你可能已经是 Windows 或 Mac 的高手，并且能够熟练地安装新电脑硬件并修复台式电脑的问题。如果你还不了解这些内容，可以找到许多详细介绍台式电脑技术的优秀书籍。在本章中，主要的关注点是台式电脑如何与网络集成，以及在管理或设置网络时如何充分发挥它们的效能。\n\
  \n## 选择台式电脑\n选择台式电脑涉及许多考量。在这里做出良好的选择将随着时间的推移产生丰厚的回报。在购买新的台式电脑时，你有机会选择机器来减轻支持负担、提高终端用户的生产力，并总的来说节省公司的资金。以下章节将探索选择台式电脑的各种因素。\n\
  \n### 台式电脑平台\n你需要知道自己将使用哪种台式电脑平台。通常，公司倾向于选择基于 PC 或 Mac 的台式电脑。（如今，很少发现有公司将 Mac 作为其台式电脑配置的主要部分并产生依赖。）在极少数情况下，公司可能会倾向于选择基于\
  \ Linux 或 UNIX 的台式电脑，但你通常会在 PC 和 Mac 之间进行选择。\n\n每个平台都有其优缺点。无论具体的优劣如何，如果你能让公司统一使用单一的台式电脑平台，你的处会好得多。根据个人用户偏好购买台式电脑的公司（用户自由选择\
  \ PC、Mac 或其他）最终会面临真正的支持头疼问题，这些问题源于多个方面。支持两个台式电脑平台的难度是支持一个平台的倍倍。为什么？请考虑以下因素：\n\n\
  ![image](img/box.jpg)\n\n你需要保持对两个平台的专业知识，以及对它们的应用程序和平台特定特性的专业知识。在小型公司中，与只需要支持一个平台相比，你需要更多的人来在两个平台上都保持所需的专业水平。\n\
  \n![image](img/box.jpg) 你需要储备更多的备件和扩展硬件。通常，在 PC 上运行的组件在 Mac 上无法运行，反之亦然。\n\n![image](img/box.jpg)\
  \ 你需要许可并库存更多的软件版本（平均而言是两倍）。\n\n![image](img/box.jpg) 当你必须支持两个平台时，在其中一个平台上永远不会出现的问题发生了，即使是在网络本身中。支持两个平台比支持一个平台更复杂，因此服务器必须运行额外的软件，允许每个平台运行的不同方式等。所有这一切都增加了网络的复杂性，而复杂性的增加意味着每个人的可靠性降低。\n\
  \n![image](img/box.jpg) 平台之间的不兼容性会给必须共同工作的用户带来问题。即使他们在 PC 和 Mac 上使用相同的应用程序（如 Microsoft\
  \ Word），平台差异仍然存在。例如，同名的 Adobe 字体在 Mac 和 PC 上的显示和分页方式可能不同。用户可能在 Word、Excel、InDesign\
  \ 或另一个两个平台通用的应用程序中苦力地格式化文档，结果发现另一个平台呈现工作的方式并不完全相同。当经常相互互动的用户的文件针对多种平台进行格式化时，不兼容性就变成了一个真正的问题。\n\
  \n![image](img/box.jpg) 在某些情况下，你可能无法为两个平台都找到匹配版本的软件。这通常意味着使用特定应用程序的用户将无法与另一个平台功能等应用程序的用户进行交互。例如，Microsoft\
  \ Access 仅适用于 Windows。\n\n![image](img/box.jpg) 你可以开发用于广泛使用的程序范围将受到限制。例如，尝试开发一个基于\
  \ Microsoft Access 的应用程序，然后让 Mac 用户使用它。他们不能这样做，因为 Mac 上不存在 Microsoft Access，而且在这种情况下没有办法在两个平台上使用同一个数据库应用程序。你可能可以数据，但无法交换用\
  \ Access 编写的程序。几乎所有的编程语言都存在相同的情况：尽管开发者努力使其具有平台中立性，但它们几乎无一不是平台特定的。（对该规则的一个例外是使用类似\
  \ Oracle 数据库服务器的更高级的 SQL 应用程序。）\n\n这些示例应该能够说服你：运行一个错误的台式电脑平台比运行两个台式平台要好。如果你在一个使用两个台式平台的公司中，你应该努力实施标准平台。这个过程可能很困难且耗时，但对于提高公司整体生产力和将\
  \ IT 成本保持在合理水平都至关重要。\n\n在决定是否在单一平台上标准化之后，你的下一个决定是选择哪一个。大多数情况下，公司对某个平台有历史，因此除非有充分的理由，否则坚持该平台通常是最简单的解决方案。如果你足够幸运，第一次为公司设置网络，那么你就可以帮助选择平台。这种选择应该始终由用户需要完成的任务、他们需要运行的应用程序以及最支持这些应用程序的平台驱动。对于大多数公司来说，这意味着你强烈倾向于将\
  \ PC 作为标准。然而，对于某些公司来说，Mac 仍然是一个好主意。通常，对于那些具有浓厚艺术或图形倾向的公司，使用 Mac 是合理的，例如网页设计公司、平面设计工作室等。images/line1.jpg)\n\
  \n| ![image](img/common.jpg) | 注意 正你可能已经注意到的，许多人想根据他们最喜欢的平台做出平台决策。很多人乐意于称自己为“PC\
  \ 狂热分子”或“Mac 狂热分子”。对于这些人中的一些，这个问题对他们来说重要性几乎等同于宗教。这种热烈的品牌忠诚度绝不影响你做出明智的商业决策。然而，这种强烈意见的存在也意味着，当你与系统用户讨论平台问题时必须谨慎行事！\
  \ |\n\n\n\n\n\n如果没有强烈建议使用某个特定平台的理由，那么出于多种原因，你应该倾向于选择 PC 电脑。它们最具价格竞争力，使用范围最广，吸引了大量的软件和硬件开发者，并且拥有更丰富的基础设施提供支持。此外，对于某些重要的业务应用软件类别，PC\
  \ 平台上有良好的解决方案，而在 Mac 平台上则没有。随着业务应用程序越来越多地基于客户端-服务器数据库和基于浏览器的用户界面，这种情况正在发生改变，但仍然会有一些应用程序并非真正的跨平台。![](img/line1.jpg)\n\
  \n| ![image](img/common.jpg) | **注意**：过去几年中一个很有帮助的进展涉及此类产品，允许用户在 Mac 上设置虚拟化环境并在该环境中运行\
  \ Windows 及其应用程序。像 `Parallels Desktop`、`VMWare Fusion` 或 `VirtualBox` 这样的产品都可以让你实现这一点。此外，你可以使用像\
  \ `Apple Bootcamp` 这样的产品在 Mac 上设置双启动安装。这些产品确实增加了桌面的复杂性，但在你确实必须支持两个平台的情况下，它们可以帮助为用户解决兼容性和应用程序可用性问题。\
  \ |\n\n##可靠性与可维护性\n\n在任何台式电脑中，要寻找的最重要特征是其可靠性和可维护性。研究表明，台式电脑的实际价格仅占其寿命成本的一小部分比例，这包含了软件成本、培训成本和支持成本。在评估可靠性时，你需要考虑全局。可靠性来自以下几个方面：![image](img/box.jpg)\
  \ 电脑使用了经过测试的高质量组件。![image](img/box.jpg) 这些组件的设计旨在良好地协同工作。你可以用最好的食材制作蛋糕，但如果你的配方不好，你仍然会得到一个坏的蛋糕。电脑也是如此。即使是最好的组件也不总是能够良好工作。顶级制造商会测试进入其系统的所有组件，并确保它们相互兼容。![image](img/box.jpg)\
  \ 设备上使用了可靠的软件组合，并且在可能的情况下，软件已经在电脑上通过了认证。\n\n可维护性与可靠性密切相关。`Serviceability`（可维护性）简单意味着对特定电脑进行操作或维修相对快速容易。增强可维护性的特征包括易于打开的机箱（无需工具）、可快速更换的内部组件（如需要简单或无需工具的硬盘、内存或显卡）以及易于更新的\
  \ `基础输入输出系统`（`BIOS`）。可维护性也受到电脑制造商提供的服务的影响：![image](img/box.jpg) 电脑制造商是否持续为其电脑提供更新？![image](img/box.jpg)\
  \ 其网站是否提供查询功能，让你根据序列号或服务 ID 确定电脑配置？![image](img/box.jpg) 关于系统的技术信息是否易于获取，还是供应商倾向于回避任何发现的问题？![image](img/box.jpg)\
  \ 你能多快获得更换零件？![image](img/box.jpg) 制造商是否包含了定时间的上门服务以减轻你的支持负担？![image](img/box.jpg)\
  \ 任何给定电脑的保修期是多少？![image](img/box.jpg) 供应商是否足够成功和稳定，让你预计公司在设备的整个使用寿命内一直存在？![image](img/box.jpg)\
  \ 如果发生问题，还提供哪些增值服务？\n\n其他强烈影响可维护性的因素往往被忽视。制造商销售了多少台电脑，你购买的特定型号是否被广泛使用？这些因素很重要，因为当新软件或硬件出现时，广泛使用的电脑更有可能获得支持。制造软件和硬件的公司知道，他们必须确保其产品与流行的电脑品牌和型号正常工作。\n\
  \n### 作者备注\n\n我曾加入过一家公司，该公司一直为台式电脑购买“无名”克隆机。在我的第一周，我拆箱并设置了五台全新的设备，结果发现其中三台到货即损坏（`DOA`）。同一周，公司的首席财务官（`CFO`）正在处理一项重要的融资活动，他的电脑反复崩溃，每次都会丢失未保存的工作，直到我最终将他的整个电脑换了一台实际上可以运行的新设备。在这些电脑上省下的那些钱（每台约\
  \ 400 美元）值得吗？这些意外给公司带来了多大的成本？答案很简单：比公司节省的钱多得多。我立即将公司的品牌更换为更可靠的品牌（`CFO` 表示了同情！），并尽快处理了现有的机器。教训是，购买电脑时你不应该“小钱上吝啬，在大钱上吃亏”。\n\
  \n假设你使用来自小型本地公司的电脑（或者更糟的是，自己组装电脑），一两年后出行的某个软件包或操作系统在你的机器上无法正常运行。软件或硬件制造商可能会说：“嗯，我们没有在那台电脑上测试过，所以我们不知道为什么我们的产品没有正常工作。”虽然制造商可能出于诚意尝试解决问题，但修复问题所需的时间可能比广泛使用的系统长得多，而且可能永远无法解决。另一方面，如果你使用的是顶级电脑，例如来自\
  \ `Dell`、`Lenovo` 或 `HP`（或其他顶级品牌）的，新产品的供应商可能知道如何解决任何出现的问题，并在产品发货之前已经解决了。![](img/line1.jpg)\n\
  \n| ![image](img/common.jpg) | **提示**：如果你的公司运行一个对业务至关重要但未被广泛使用的应用程序，有时找出该应用程序厂家使用的是哪种电脑是值得的。如果你知道应用程序厂家是使用特定品牌构建应用程序的，你可以通过考虑在你的组织中使用相同的品牌，来减少在使用应用程序时遇到麻烦的风险。\
  \ |\n\n如果你标准化使用特定的制造商，你也可以提高可维护性，因为这样你可以将资源集中在支持该系列电脑上。公司里支持台式电脑的人员发现更容易跟进该制造商的特性，并在处理这些电脑时变得更加自如。此外，你公司的支持人员能够解决一个问题，然后将解决方案应用到许多电脑上，而不是必须在许多不同类型的电脑上调试许多不同类型的问题。最后，当你与电脑制造商建立强大且持续的关系时，可能会获得服务质量收益。![](img/line1.jpg)\
  \ |\n\n\n\n\n\n| ![image](img/common.jpg) | **注意** 如果你需要支持许多台计算机，请确保它们尽可能一致。你不仅要确保（尽可能地）它们是相同的型号和配置，还要确保制造商为特定型号的所有计算机使用相同的组件。某些制造商在这一方面并不够细心；他们会在不通知任何人的插入不同的主板或网络接口卡（NIC）。对于购买单台计算机的人来说，这不是一个问题。但当你需要支持\
  \ 500 台或 5000 台本该完全相同但并非如此的计算机时，就会变成一个巨大的问题，因为你还必须跟踪不同的驱动程序和配置信息。此外，如果你通过磁盘镜像（如使用\
  \ `Norton Ghost` 创建）安装和维护计算机，你需要为计算机的所有不同子型号维护不同的镜像。 |\n\n## 价格与性能\n一旦满足了上述优先级，你就可以在性能和价格之间取得适当平衡。你需要考虑为新计算机的使用寿命，并确保购买的系统在使用寿命内能够发挥效率。在确定这种平衡时，不要只看特定配置处理今天需求的能力如何，要看它处理明天需求的能力如何。\n\
  \n有些人可能持不同意，但我坚信，购买计算机时，价格不应该是你的首要任务。虽然购买价格很重要，但你首先需要确定你的需求，然后找到价格合理且最能满足这些需求的计算机。\n\
  \n获取最佳价格有不同的策略。这些策略从直接的议价和竞争性竞标，到在性能方面略微低配，但计划在需要时升级现有计算机（至少在 `RAM` 和硬盘空间方面，这两者的价格随时间推移会迅速下降）。![](img/line1.jpg)\n\
  \n| ![image](img/common.jpg) | **注意** 不要忘记估计更换或升级计算机所涉及的成本。如果考虑到人工成本和生产力，购买性能强大的计算机在整体上可能更划算。\
  \ |\n\n## 使用寿命\n`useful life`（使用寿命）一术是指特定资产（如计算机）能够执行有用工作的时间。计算机的使用寿命取决于计算机本身、其运行所需的软件、使用者以及用于升级或更换计算机的可用预算。\n\
  \n总是需要最新、最强硬件和软件的程序员，其计算机的使用寿命相对较短；而一个只用计算机进行文字处理或电子邮件、不在乎运行最新软件的人，其计算机的使用寿命要长得多。对于大多数桌面计算机，其使用寿命约为三到四年，尽管这种经验法则的例外随处可见。例如，假设你已经确定现在的用户需要\
  \ `200GB` 的磁盘空间、`4GB` 的 `RAM` 和双核处理器。在 24 个月后，你的用户可能会要求 `400GB` 的磁盘空间、`8GB` 的 `RAM`\
  \ 和四核处理器。在另一个 24 个月（购买购买年后），这些需求将再次翻倍，达到 `800GB` 的磁盘空间、`16GB` 的 `RAM` 以及等同于八核处理器。这些预测需求现在看起来可能不可能，但当你回顾四年前的需求时，这些预测似乎是合理的。\n\
  \n通过这种估计性能需求的方法，你应该能够在价格、性能和使用寿命之间找到一个“甜点”，使你的成本最小化并将用户收益最大化。\n\n## 章节总结\n管理网络工作站计算机是一项艰巨的任务。许多计算机必须频繁管理，每个用户可能有不同的需求，而且由于使用方式的原因，网络工作站最容易出现问题。在本章中，你学习了关于网络客户端计算机的通用信息，以及如何为你的网络选择合适的客户端计算机。\n\
  \n在下一章中，你将学习如何从零开始设计网络的基础知识。通常，网络设计的过程是首先彻底理解网络必须满足的需求，考虑网络预期的增长，然后开始规划网络结构以及需要哪些技术。![image](img/common4.jpg)\n\
  \n| **第 13 章** | ![image](img/line-1.jpg) | **设计网络** |\n\n\n\n\n\n![image](img/common5.jpg)![image](img/line1.jpg)\n\
  \n网络专业人员很少有机会进入一家公司并从零开始设计新网络，但那些有此机会的人无疑是幸运的。诚然，这种努力投入了大量的时间、压力、截止日期，以及对可能遗漏某些东西的牵牵挂虑。但作为回报，你将塑造大量用户的计算环境，而且在许多公司中，还决定了公司未来几年运行效率的基调。在某些高度依赖信息技术的公司，网络的顺畅运行甚至可能决定公司的成败。这是一项巨大的责任，但也是一份非常有成就感的工作。\n\
  \n在实践中，你通常从某种现有的网络开始。网络通常从小开始，随着时间的推移逐渐增长。网络几乎就像皮肤，你肯定每隔几年就会更换每一个细胞，但一次只更换一部分。这个过程通常是进化的，而不是革命性的。不过，这一规则也有例外。例如，一家公司可能会搬到新大楼，在此过程中决定放弃旧网络并安装一个完全全新的网络。同样，一家资金充足的初创公司在六个月内员工从\
  \ 5 人增加到 500 人，很可能会产生新网络的需求。\n\n无论你是从零构建一个全新的网络，还是翻新现有网络，你使用的工具大大相同，设计网络的过程也大相同。概念其实很简单：你评估网络必须满足的需求，然后进行设计以满足这些需求。在实践中，这个过程要复杂得多，但核心思想是直观的。即使在演进中的网络中，使用网络规划来制定翻新网络的长期计划也是有意义的。\n\
  \n本章描述了如何设计网络。它依赖于你在前面章节中学到的所有信息。将本章看作是将你已经学习的所有信息整合成一个整体。前面的章节关注网络的比特（bits）和字节（bytes），而本章则是从\
  \ 30,000 英的高空视角，开始观察万物是如何协同工作的。\n\n## 网络设计流程\n\n网络设计不是一门精确的科学。即使拥有最先进的设计工具和资源，第一次就\
  \ `exactly`（完全）正确几乎是不可能的。这是因为每个网络都有不同的需求，而这些需求往往以出意想不到的方式相互作用。此外，预测随着时间的推移网络产生哪些新需求、用户将如何使用网络资源以及你可能需要进行的其他更改几乎是不可能的。整个局面既是流动的又是混沌的。诀窍在于做好需求估算，然后尽可能创建一个满足这些需求的设计。\n\
  \n拥有备选方案（fallback plans）同样重要，以防网络某些部分没有按照你的预期方式运行。例如，一旦网络运行，你可能会发现分段之间的带宽分配不均。你希望预先知道如何衡量和解决此类类型的问题。你可能还会发现存储需求远高于或低于你的预期。你需要知道发生这种情况时该怎么办。关键在于，网络设计是一个过程，通常是迭代的过程。作为网络设计师，你的工作是尽可能接近所需的设计，然后根据需要对设计进行微调。\n\
  \n网络设计过程中很大程度上取决于你如何定义。既有简单的网络设计流程，也有极其复杂的流程，涉及数十人、复杂的统计建模，甚至还要使用网络仿真软件来测试计划的设计，看它在负载下是否保持稳定。在本章中，你将学习一个相对全面且直观简单的流程。利用本章中的信息，结合丰富的经验，将产生一个灵活的网络，它应该轻松地满足数百名用户的需求。\n\
  \n![](img/line1.jpg)\n\n| ![image](img/common.jpg) | `TIP` 如果没有丰富的运行类似网络的经验，你就无法设计任何规模的网络。你可以通过理解方法论来管理整个过程，但如果没有实操经验，你就无法创造良好的设计。如果你是网络领域的新手并被要求设计网络，确保团队中拥有经验丰富的人员——无论是作为顾问还是作为供应商领导团队的一员——并仔细听取他们的建议。\
  \ |\n\n## 评估网络需求\n\n“量两次，切一刀”（Measure twice and cut once）是一句传达规划重要性的常用格言。“准备、开火、再瞄准”（Ready,\
  \ fire, aim）是一句讽刺那些没有正确设定目标的人的说法。评估网络必须满足的需求，对应于在射击之前尽可能地进行这些测量和瞄准。\n\n在你考虑任何具体细节之前——网络拓扑；网络操作系统（NOS）平台；集线器、网桥和路由器的结构；或布线等级——你必须首先知道网络需要实现什么。评估需求是你在设计过程中应该最重点关注的地方。不这样做几乎会导致一个对用户来说没有效率的网络。\n\
  \n![](img/line1.jpg)\n\n| ![image](img/common.jpg) | `NOTE` 许多 IT 专业人士本质上是热爱玩最新技术的专家。围绕“热点”技术来设计网络是非常诱惑力的，然后尝试思考需求如何适应到这些技术中。然而，这并不是设计网络的方法。相反，应该从需求开始，然后找出哪些技术支持这些需求。\
  \ |\n\n\n\n\n\n在评估需求时，你正在尝试对以下问题给出详细的答案：\n\n![image](img/box.jpg) 需要多少存储空间？\n![image](img/box.jpg)\
  \ 需要多少带宽？\n![image](img/box.jpg) 需要哪些网络服务？\n![image](img/box.jpg) 项目的预算是多少？\n\n\
  这些基础问题作为一个整体来回答相对容易，但你需要对它们进行进一步拆解，以确保网络设计中没有可能导致问题的漏洞。例如，确定网络必须支持高达 100 Mbps 的带宽可能很容易，但你需要知道这些带宽是在何时、何时以及在何处被使用的。例如，如果财务部门在与财务服务器通信时占用了\
  \ 90% 的带宽，那么你自然希望将财务系统服务器及其用户放在他们自己的子网中。除非你的评估能让你在某种程度上详尽地确定网络资源将如何被使用，否则你无法识别此类问题以及如何解决它们。\n\
  \n接下来的章节将讨论在你了解特定网络必须能够做什么时应该检查哪些内容。检查这些问题没有特定的顺序要求，你可能会发现自己需要反复查看列表几次以获得完整的视图。你还可能发现特定公司的需求在每个类别中需要更多或更少的分析。设计网络时需要常识。以下建议是引导你进入正确道路的指南。\n\
  \n## 应用程序\n\n网络设计的良好起点是列出并理解将在网络上运行的应用程序。归根结底，一个网络的好坏取决于它帮助人们完成的工作，而人们最直接的工作是通过他们使用的应用程序软件来完成的。如果应用程序运行不正常，用户的工作也无法正常。\n\
  \n大多数网络既有通用应用程序，也有部门和用户特定的应用程序。大多数公司通常通过一套桌面应用程序（如 Microsoft Office）来满足通用应用程序的需求。以下是大多数公司为所有用户安装的应用程序列表，无论每个用户是否需要其中的每一个：\n\
  \n![image](img/box.jpg) 文字处理器\n![image](img/box.jpg) 电子表格\n![image](img/box.jpg)\
  \ 终端数据库\n![image](img/box.jpg) 演示图表\n![image](img/box.jpg) 电子邮件\n![image](img/box.jpg)\
  \ 个人信息管理器（日历、联系人列表等）\n![image](img/box.jpg) 病毒扫描软件\n\n你的首要任务是确定这些通用应用程序将如何被使用。确定是否所有用户都需要安装整个套件、不同用户计划多久使用一次不同的应用程序、他们将创建和存储多少文件、这些文件可能有多大，以及这些文件如何在用户之间共享。\n\
  \n例如，在 1,000 人的人口中，你可能确定 90% 的人将使用文字处理每月平均生成十份文档，每份文档平均为 100KB，且用户可能在任何时候都会保留两年的文档。是的，这些将是经验性的猜测，但得出合理的估算是非常重要的。对于类似用户群体和公司的经验在确定这些估算时可以获得丰厚的回。仅凭这些信息，你就立即知道每个用户大约需要\
  \ 24MB 的存储空间，或者对于 900 人的文字处理群体来说，仅文字处理文档就需要 21.6GB。对于用户会频繁共享文件的应用程序，你可能需要考虑大多数用户会保留他们也与他人共享的某些文件的个人副本。\n\
  \n![](img/line1.jpg)\n\n| ![image](img/common.jpg) | 提示 你可以通过建立共享目录，让不同小组的人可以存储和访问共享文件，从而帮助减少整体网络存储需求。\
  \ |\n\n然后你对其他应用程序得出相同的估算，并考虑到它们的预期大小、创建频率和长期存储需求。\n\n在确定通用应用程序后，转向部门特定的应用程序。对于新公司的新网络来说，这一步变得棘手，因为你可能不知道哪些应用程序会被使用。对于现有公司，你的优势在于已经知道必须支持哪些部门应用程序。\n\
  \n不同的部门应用程序对网络可能产生截然不同的影响。例如，围绕共享数据库文件设计的财务系统与使用客户端/服务器数据库设计的系统需要不同的网络设计。前者更多地依赖文件服务器的性能，并且比运行在专用服务器上的高效客户端/服务器应用程序对带宽敏感。如果尚未选择部门应用程序，请与该部门的经理，获取他们的最佳估算，然后继续。\n\
  \n以下是你应该考虑的常见部门应用程序：\n\n![image](img/box.jpg) 财务\n![image](img/box.jpg) 分配与库存控制\n\
  ![image](img/box.jpg) 制造/物料需求计划 (MRP)\n![image](img/box.jpg) 信息技术\n![image](img/box.jpg)\
  \ 电子商务\n![image](img/box.jpg) 人力资源\n![image](img/box.jpg) 工资与股票管理\n![image](img/box.jpg)\
  \ 出版\n![image](img/box.jpg) 营销支持\n![image](img/box.jpg) 法律\n![image](img/box.jpg)\
  \ 其他特定于公司行业的业务应用程序\n\n对于你识别的每个部门应用程序，你都需要问几个问题：它们将消耗多少存储？应用程序从哪里运行（从带有服务器数据的本地计算机运行，还是完全集中，即数据和应用程序都运行在中央计算机上）？它们会有自己的专用服务器吗？应用程序需要多少网络带宽？随着公司的增长，所有因素将如何变化？\n\
  \n最后，虽然你可能不会正式将它们纳入计划，但请考虑可能运行的用户特定应用程序。例如，你可能估计公司研发组的人员可能会作为工作的一部分运行两三个未知应用程序。如果你决定用户特定应用程序将对网络产生重大影响，那么你应该像估计其他类型应用程序那样估计它们的需求。如果你认为它们的影响微乎其微，那么你可能决定为它们留出小额额度或者完全不留。\n\
  \n![](img/line1.jpg)\n\n| ![image](img/common.jpg) | 提示 不要陷入“分析瘫痪”中，担心你是否能从科学上证明你的估算是准确的。相反，要确保估算对其他网络专业人员来说是合理的。在某个点，你需要为网络设计和成本提供理由，而拥有合理的估算是做到这一点的必要的。只需避免过度即可。\
  \ |\n\n\n\n\n\n# 用户\n一旦你确定了网络必须支持的应用程序，就可以估计需要支持的用户数量，以及每个用户将使用哪些应用程序。估计总用户数可能会更容易，因为公司可能已经有一份业务计划或长期预算，你可以从中推导出这些估算值。你的用户用户估算应具有合理的粒度：了解公司内每个部门的用户数，以及公司的总用户数。\n\
  \n你应该估计在立即、一年后、三年后和五年后分别需要支持多少用户。虽然五年对于估算来说是一个很遥远的时间，但在设计过程中，了解这些信息至关重要。不同的增长率意味着不同的网络设计，即使在网络建设之初也是如此。如果一家公司估计立即会有\
  \ 100 个用户，一年后有 115 个，三年后有 130 个，五年后有 150 个，其所需的网络设计与另一家估计立即有 100 人、一年后有 115 人、三年后有\
  \ 300 人、五年后有 1,000 人的公司不同。在后的情况下，你必须投入更多资金设计一种扩展性更强的方案，尽管在网络运行的前两年，其用户数量是相同的，你在构建网络初期可能会花费多得多。\n\
  \n然而，仅仅知道用户数量是不够的。你还需要更多关于用户的信息。至少要考虑以下问题，以确定以下任何因素是否会对普通用户或用户小组产生重要影响：\n\n![image](img/box.jpg)\n\
  \n### 带宽需求\n除了保存和检索文件、发送接收电子邮件以及进行常规互联网浏览所需的带宽外，是否有用户需要大量的带宽？例如，科学家是否会每周从互联网下载一份最新的人类基因组副本？某些用户组是否需要在不同站点之间交换大量数据？是否有任何用户会在你的网络连接上运行视频会议软件？你预计用户会进行多大量的网页浏览？人们是否会频繁发送大型邮件附件？\n\
  \n![image](img/box.jpg)\n\n### 存储需求\n是否某个用户组对存储容量的需求远高于平均水平？例如，一个电子成像小组是否会将数百万文档分类为图像文件存储在服务器上？如果是这样，有多少人需要访问这些数据？会计小组是否需要将过去十年的财务信息保持在线？公司是否会使用或安装执行信息系统，使所有经理都具备对公司会计、分销和制造系统的查询能力？如果是，这种能力可能需要多少额外的带宽或服务器性能？\n\
  \n![image](img/box.jpg)\n\n### 服务需求\n是否某些用户组需要大多数用户不需要的额外网络服务？例如，公司部分部门的工作具有此类敏感性，应该通过网络防火墙与局域网（LAN）的其他部分隔离开？部分用户是否需要直接的入站传真功能？\n\
  \n在检查用户带宽需求时，请记住查看带宽需求的及时性。如果某些已知活动需要大量带宽且必须在正常工作期间进行，那么这种高带宽使用可能会干扰网络其他部分的性能。因此，请确保同时估算平均和峰值带宽需求。\n\
  \n# 网络服务\n接下来，你应该查看网络必须提供的服务。这些服务在不同公司之间差异很大。一个基础的网络可能只需要文件和打印服务，外可能还有互联网连接。更复杂的网络将需要许多额外服务。考虑你正在设计的网络需要提供以下哪些类型的服务，以及其他特定于公司的服务：\n\
  \n![image](img/box.jpg)\n- 文件和打印服务！\n![image](img/box.jpg)\n- 备份和恢复服务！\n![image](img/box.jpg)\n\
  - 互联网网页浏览！\n![image](img/box.jpg)\n- 电子邮件！\n![image](img/box.jpg)\n- 网络安全服务！\n![image](img/box.jpg)\n\
  - 通过虚拟专用网络（VPN）远程访问局域网！\n![image](img/box.jpg)\n- 局域网传入传出（手动分配或自动分配）！\n![image](img/box.jpg)\n\
  - 动态主机配置协议（DHCP）服务！\n![image](img/box.jpg)\n- 集中病毒防护服务！\n![image](img/box.jpg)\n\
  - 通往其他地地的广网（WAN）服务！\n![image](img/box.jpg)\n- 视频会议！\n![image](img/box.jpg)\n- IP\
  \ 语音（VoIP）\n\n对于每项服务，你必须回答若干问题。首先，你需要知道每个服务的存储和带宽需求以及它们可能产生的任何其他影响。例如，入真服务本身可能需要少量的存储空间，但用户最终存储的所有传真位图可能会对总存储需求产生巨大影响。\n\
  \n其次，你需要知道如何提供该服务。通常，这意味着你需要知道哪台服务器将托管该服务。某些服务的开销极小，你可以轻松地将其托管在运行其他工作的服务器上。一个资源需求极微的\
  \ `DHCP` 服务器就是此类服务的良好例子。另一方面，电子邮件系统可能需要极高的资源，以至于你必须计划在专用的服务器上托管它，甚至在多台服务器上运行。\n\n\
  第三，你需要知道哪些用户或用户组需要哪些服务。这是因为为了最小化骨干流量，你可能需要将网络划分为更小的子网，并将特定用户群体频繁使用的服务定位在这些服务用户所在的同一段内。\n\
  \n# 安全与防护\n之前的考虑都与网络不同部分所需的位和字节有关。安全与防护涉及到公司对保持信息安全的需要——无论是在组织内部还是外部——以及确保公司数据免于丢失的需要。在尝试在纸上拟定网络设计之前，你必须了解这两个问题有多重要。\n\
  \n对于这两个考虑，在成本和有效性之间存在权衡。正如前面的章节中提到的，没有任何网络是完全安全的，没有任何数据是完全免于丢失风险的。然而，不同的公司和部门对这些问题的敏感性不同，这表明在这些领域投入的资金多或少。\n\
  \n某些应用程序可能非常适合将其数据存储在条带化的 `RAID 0` 磁盘阵列上，相对于其他 `RAID` 级别，其丢失风险较高，因为数据可能是静态的，如果磁盘阵列丢失，可以从磁带中恢复。其他应用程序可能需要最高级的数据丢失安全性，每个备用服务器都具有镜像\
  \ `RAID 1` 或 `RAID 10` 阵列，并且在线磁带备份系统每小时或每笔交易更新一次备份磁带，或者实时复制到热托管地点。同样，某些公司处理的数据如此敏感，以至于他们必须安装最好的防火墙，甚至是两层防火墙，并聘佣全职专业人士专门维护数据安全。而其他公司只要达到基本的安全水平就会感到满意。\n\
  \n关键点在于，你必须确定这些问题对于你正在设计的网络公司有多重要。然后你就可以提出不同的解决方案来满足这些需求，并将它们纳入你设计的其余部分。\n\n# 增长与容量规划\n\
  要考虑的最后一个领域是网络的预期增长，特别是如果公司预计这种增长是巨大的。正如本章前面提到的的，为快速增长的公司设计的网络与缓慢增长的公司设计的网络看起来不同，即使两家公司的起始规模相同。在前一种情况下，你希望设计一种可以快速方便扩展的设计，而不需要更换大部分现有硬件和软件。在后的情况下，你可以使用简单的网络设计。\n\
  \n考虑增长对你已经检查的网络不同部分（应用程序、用户和服务）的影响，因为线性增长并不总是意味着对网络的影响也是线性的。假设是线性的，对网络的影响可能比显示的要低或高得多。\n\
  \n例如，你在第 3 章中看到 `Ethernet` 如何使用冲突检测机制管理网络流量。在该章中，你还学到 `Ethernet` 是线性扩展的，但仅限于某一点。一旦网络开始饱和，由于\
  \ `Ethernet` 冲突检测方案的混沌本质，性能就会迅速下降。考虑一个传输 `30 Mbps` 流量的 `100 Mbps Ethernet` 网络。这种流量可能流畅运行，很少冲突和重传。然而，将网络需求推到\
  \ `50` 或 `60 Mbps`，由于网络饱和，性能将停滞，你将面临与数据量相同的冲突和重传。事实上，在饱和的 `Ethernet` 上流过的有效数据总量将少于在未饱和网络上流动的量。\n\
  \n你也可以发现某些情况下，需求的增加不会导致网络或服务器负载相应增加。例如，如果用户数量翻倍，复杂电子邮件系统的服务器负载可能只增加很小，因为系统的开销产生了大部分负载。如果你在系统中保留了倍倍的数据，会计系统的存储需求可能不会翻倍，因为开销可能占据了大部分现有空间。相反，如果将数据存储增加一倍，同一个会计系统可能会消耗四倍的存储空间，因为它的索引方案可能相对无效。关键在于，你需要了解不同的应用程序如何随着使用量的增加而扩展。你将使用的主要应用程序供应商应该能够在这方面提供有用的数据。![](img/line1.jpg)\n\
  \n\n\n\n\n| ![image](img/common.jpg) | **提示** 注意，不仅要考虑应用在扩展时的行为，还要考虑它们在您规划的网络环境中进行缩放时的表现。不同的网络操作系统（NOS）、网络拓扑以及客户端和服务器计算机都会影响特定应用程序支持增长的能力。\
  \ |\n\n\n\n\n\n# 满足网络需求\n\n一旦你完成了评估（到此时，你可能已经厌倦了评估过程！），你就可以开始寻找满足你所识别的所有需求的方法。这个过程在很大程度上是整体性的，而不是通过遵循一系列步骤并得出单一答案（如方程式）来完成的。相反，你应该从规划网络的各个部分开始，考虑本节讨论的三个主要主题，并“构建出”网络设计的“蓝图”。你创建的设计将整合你在评估过程中学到的所有内容，结合你的经验和收到的建议，制定出一个具体的设计，最终形成设备列表、规格说明和配置。\n\
  \n向其他网络专业人士寻求对设计的批评是非常重要的，他们可能拥有有价值的经验，你可以将其纳入设计中。没有哪一个网络专业人士见过并处理过所有可能的设计需求，因此你希望尽可能结合资深人士的建议。\n\
  \n## 选择网络类型\n\n你可能想从选择网络类型开始设计。这应该是一个相对简单的决定，基于网络的整体带宽需求。对于大多数新网络，你几乎肯定会决定使用某一种类型的以太网。以太网是目前安装的最常见的网络类型，也是一个易选的默认选择。\n\
  \n你还需要决定你需要什么种级别的以太网。对于桌面布线，如今你应该选择基于 `Cat5E` 线缆的 `1000Base-T`。它是可靠的，并为大多数需求提供了足够的容量。\n\
  \n## 网络结构\n\n接下来，决定你如何规划网络。换句话说，你如何安排和连接网络所需的各种集线器、交换机和路由器？这可能是最难确定的部分，因为很难预测从一组节点到另一组节点必须传输多少数据。你基于评估工作的估计将会有帮助。如果你能识别出预期的高流量模式，应该画一张标出这些模式的网络图，帮助你理清思路。记住以下提示：\n\
  \n![image](img/box.jpg)\n\n- 以太网的 `CDMA/CD` 冲突处理意味着以太网网络只能处理其额定速度的三分之一。换句话说，额定为\
  \ `100 Mbps` 的 `100Base-T` 分段在开始下降之前，只能处理约 `33 Mbps` 的实际数据。\n\n![image](img/box.jpg)\n\
  \n- 尽可能对所有节点使用“直连”布线（即每根网络电缆都从每个工作站运行到单一位置的配线间或机房）。这样做可以让你在需求变化时更容易地更改网络结构（例如，将分段拆分为更小的分段）。\n\
  \n![image](img/box.jpg)\n\n- 除了最小的网络外，请计划安装一个交换机连接的网络骨干。你仍然必须计划将每个分段的流量保持在以太网饱和点以下，但这种结构将为你提供足够的灵活性来实现这一目标。\n\
  \n![image](img/box.jpg)\n\n- 物理建筑可能会决定你如何构建网络。例如，任何维度上大于 200 米（约 600 英尺）的建筑可能意味着你无法为所有节点采用直连布线方案。这是因为双绞以太网通常只有\
  \ 100 米（约 300 英尺），这包含了绕过建筑障碍、跳线线以及其他导致实际电缆长度比你在建筑地图上测得更长的因素。\n\n![image](img/box.jpg)\n\
  \n- 对于大到无法采用直连布线方案的多层建筑，考虑将骨干垂直跨楼层，然后在每层楼设置一个配线间，其中包含服务该楼层节点的交换机。每层楼配线间的布线然后发散到该楼的每个节点。\n\
  \n![image](img/box.jpg)\n\n- 大多数情况下，大多数节点的大部分通信是针对网络上一两台服务器的。如果你正在计划部门特定的服务器，或者如果你能识别出类似的模式，请确保每台服务器与其主要服务的节点处于同一子网中。\n\
  \n![image](img/box.jpg)\n\n- 如果你的服务器倾向于不分配给支持部门而是支持整个公司，请确保服务器直接连接到骨干网交换机。\n\n![image](img/box.jpg)\n\
  \n- 如果你有任何高带宽用户，考虑将他们保持在与网络其余部分隔离的分段中（如果合适的话），并考虑升级该分段的速度。\n\n![image](img/box.jpg)\n\
  \n- 当你开始实施网络时，仔细观察冲突包与数据包的比例。如果任何分段的冲突数量上升到总数据包数的 5% 到 7%，性能就会开始受影响，因此你需要调查原因并找到降低此比例的方法。你通常可以通过将分段拆分为更小的部分（子网），或通过将功能强大的交换机配置为虚拟局域网（`VLAN`）来实现。\n\
  \n## 选择服务器\n\n如 第 12 章 所示，列出你的服务器必须提供的各种网络服务。你需要寻找高效的方法在你的服务器上托管这些各种服务，平衡多个因素：\n\
  \n![image](img/box.jpg)\n\n- 在其他条件相同的情况下，从软件角度来看，使用更多小型服务器每台托管较少服务，比使用较少的大型服务器每台托管多项服务更具可靠性。\n\
  \n![image](img/box.jpg)\n\n- 反之，拥有更多的小型服务器会增加硬件故障的可能性（尽管它也可以限制特定服务器宕机的影响范围）。\n\n\
  ![image](img/box.jpg)\n\n- 使用更多小型服务器比使用较少的大型服务器更贵且需要更多的维护。\n\n![image](img/box.jpg)\n\
  \n- 考虑哪些服务应该在另一台服务器上进行冗余，或者你计划如何处理任何服务器的故障。\n\n利用你的评估信息，你可以确定服务器需要多少存储容量。然而，要知道每台服务器在处理器能力、安装的\
  \ `RAM` 以及其他功能（如总线配置）方面应具有什么样的能力要困难得多。对于这些规格，你需要依靠网络操作系统（NOS）供应商以及你正在考虑的服务器制造商的建议。\n\
  \n### 章总结\n\n设计整个网络可能极其复杂。如果你处于设计网络这种羡慕的地位，你最好的办法是从本章描述的框架开始，并使用其他资源来回答特定问题。有许多资源可以帮助你做到这一点，从专门研究网络设计、服务器管理、网络性能调优和特定\
  \ NOS 管理的书籍，到对类似网络以及你在任何计划采购中与之合作的各种供应商具有丰富经验的顾问和网络工程师。始终记住在任何网络设计中都留出一些余地，以便你能够快速响应新需求或更改的需求，其中许多需求会在你最终确定设计时发生。好消息是，如果你遵循了本章和书中其余部分的建议，以及提到的其他资源，可以很有把握地说，你最终将获得一个稳健、可扩展、易维护的网络设计，它满足了公司的需求，并让你感到自豪。![image](img/common2.jpg)\n\
  \n| **第二部分** | ![image](img/line-1.jpg) | **实战知识** |\n\n![image](img/common3.jpg)![image](img/common4.jpg)\n\
  \n| **第 14 章** | ![image](img/line-1.jpg) | **安装和设置 Windows Server 2012** |\n\n\n\
  \n\n\n![image](img/common5.jpg)![image](img/line1.jpg)\n\n在本章中，你将学习如何安装 Windows\
  \ Server 2012。然而，在安装 Windows Server 2012 之前，你必须进行各种安装前的检查，为安装过程做好准备。接下来，你将执行实际安装，并提供安装程序所需的信息。最后，通过让客户端计算机正确登录服务器并执行一些基础网络任务来测试安装情况。本章将详细描述所有这些步骤。\n\
  \n## 理解 Windows Server 2012 版本\n\nWindows Server 2012 是一个整个系列的产品，它们本质上都基于相同的编程代码，但在功能和调优方面存在显著差异。\n\
  \n`Standard Edition`（标准版）是 Windows Server 2012 的主流服务器版本。它包含了 Active Directory 的所有功能以及以下特性：\n\
  ![image](img/box.jpg) 新的管理工具；基于图形用户界面 (GUI) 的服务器管理器，以及大量的基于 PowerShell 的脚本（称为 `cmdlets`）\n\
  ![image](img/box.jpg) 远程桌面服务（以前称为终端服务），它允许 Windows Server 2012 提供虚拟化的远程桌面计算机\n![image](img/box.jpg)\
  \ Internet 和网络服务，包括动态主机配置协议 (DHCP)、域名系统 (DNS)、互联网信息服务 (IIS) 和索引服务器！\n![image](img/box.jpg)\
  \ 远程访问和虚拟专用网络 (VPN) 服务！\n![image](img/box.jpg) 事务和消息服务！\n![image](img/box.jpg) 支持最多\
  \ 640 个处理器！\n![image](img/box.jpg) 支持高达 4TB 的内存！\n![image](img/box.jpg) 支持最新版本的标准网络协议！\n\
  ![image](img/box.jpg) Hyper-V 虚拟计算，每个标准版许可证支持最多两个正在运行的虚拟机（你可以安装多个许可证来增加此值）\n\n`Datacenter\
  \ Edition`（数据中心版）本质上与标准版相同，区别在于它包含了虚拟机的无限许可权，并且可以运行无限数量的虚拟机（仅限于硬件能力）。\n\n微软极大地改变了其处理\
  \ Windows Server 版本和许可的方式。对于标准版和数据中心版，对于你安装到服务器中的每两个物理处理器，都需要一个额外的服务器许可证。例如，如果你在一台有六个物理处理器的服务器上安装标准版或数据中心版，你将需要三个许可证。\n\
  \n对于标准版，如果你想运行更多的虚拟机，可能还需要额外的许可证。每个许可证包含两个虚拟机。因此，如果你想在一台只有两个物理处理器的服务器上运行八个虚拟机，将需要四个标准版许可证。对于物理处理器和虚拟机的各种组合，你需要数量足以覆盖这两个值中较高者的标准版许可证。\n\
  \n对于较小的企业，有两种了新的 Windows Server 版本：\n![image](img/box.jpg) `Essentials Edition`（精简版）限制为不超过\
  \ 25 个用户和 50 台计算机。它可以运行在带有最多两个处理器的服务器上，且使用该服务器不需要客户端访问许可 (CAL)。精简版专为内部 IT 资源极少或没有的企业设计，并包含了简化管理的功能。\n\
  ![image](img/box.jpg) `Foundation Edition`（基础版）限制为不超过 15 个用户，且仅由服务器制造商作为购买服务器的一部分提供。\n\
  \n精简版和基础版都可以升级到标准版。\n\n## 为安装做准备\n\n在安装 Windows Server 2012 之前，你必须首先准备好将使用的服务器计算机，并对安装做出重要决策。这一准备阶段由许多任务组成，包括：\n\
  ![image](img/box.jpg) 确保服务器硬件已通过 Windows Server 2012 认证。\n![image](img/box.jpg)\
  \ 确保服务器已正确配置以支持 Windows Server 2012。\n![image](img/box.jpg) 在服务器硬件上进行任何必要的安装前测试。\n\
  ![image](img/box.jpg) 在执行安装之前对硬件情况。\n![image](img/box.jpg) 在收集完安装期间所需的所有配置信息后，决定将如何安装\
  \ Windows Server 2012。\n![image](img/box.jpg) 在升级之前备份系统。\n\n这些将在后续章节中讨论。\n\n## 检查硬件兼容性\n\
  \n微软维护着一份广泛的硬件兼容性列表 (HCL)，列出了不同的硬件组件及其在各种微软产品（如 Windows Server 2012）上的测试状态。为了避免服务器出现问题，请确保服务器本身以及任何安装的外围设备都已通过\
  \ Windows Server 2012 的测试并运行正常。可以在 [www.windowsservercatalog.com](http://www.windowsservercatalog.com)\
  \ 最新版本的 HCL。你也可以在 Windows Server 2012 的 CD-光盘上找到文本版本。然而，建议使用基于网页的 HCL，因为它可能包含比安装\
  \ CD 光盘上包含的文件更实时的数据。\n\n如果你计划的服务器中的特定硬件组件未列在 HCL 上，并不意味着无事可做。其一，HCL 可能没有最新的数据，你想要使用的硬件可能通过了认证但尚未列出。最好向硬件制造商确认，因为该公司知道硬件认证的当前状态。![](img/line1.jpg)\n\
  \n| ![image](img/common.jpg) | **注意** 未列在 HCL 中的产品可能在 Windows Server 2012 上运行良好。如果你是为了测试目的或支持有限服务而部署服务器，并且你习惯于这样做，那么你仍然可以继续安装\
  \ Windows Server 2012 并开始使用。但是，你不应该对许多人依赖的生产服务器这样做。因为不仅未发现的不兼容性可能会给未认证的服务器带来严重问题，而且对于尚未认证的硬件，你将无法从微软处获得最高级别的支持。出于此原因，你应该避免部署尚未通过微软认证的重要服务器。\
  \ |\n\n\n\n\n\n# 检查硬件配置\n\n购买计算机作为服务器可能是一项复杂的任务。你必须处理已安装内存（RAM）、处理器配置、磁盘配置等无数细节，并结合你的预估需求，以给出一个合理的服务器配置。（第\
  \ 11 章 包含了有关不同服务器技术以及如何为通用用途指定服务器的信息。）\n\nWindows Server 2012 需要以下最低硬件配置：\n\n![image](img/box.jpg)\n\
  - 一个 1.4 GHz (x64 处理器) 或更高规格\n- 512MB 内存\n- 至少 32GB 的空闲磁盘空间\n- 可用于安装 Windows Server\
  \ 2012 的 DVD-ROM 或网络连接\n\n对于任何类型的服务器（即使是仅支持少数用户的服务器），你都应该考虑使用比微软规定的最低配置更强大的硬件。以下是为\
  \ Windows Server 2012 配置服务器的一些建议：\n\n- **处理器**：从至少一个运行频率在 2.4 GHz 或更高的 Intel Core\
  \ i5 处理器开始。Intel Xeon 处理器在服务器中具有优势，你应该根据预期的性能提升仔细考虑此类系统的价格。此外，如果你正在考虑带有两个或更多处理器的系统，只有\
  \ Xeon 系列处理器支持多个处理器。\n- **内存 (RAM)**：Windows Server 2012 在具有充足内存的系统上运行得最好。对于服务器，确保你至少有\
  \ 1GB 内存。如果你计划支持 Windows Server 2012 提供的所有不同服务（如远程桌面服务、路由和远程访问服务、DHCP、DNS 等），那么\
  \ 2GB 到 4GB 内存可能比 1GB 更好。\n- **磁盘**：快速的基于小型计算机接口 (SCSI) 的磁盘子系统非常重要，特别是对于存储大量数据的服务器。（请参见\
  \ 第 11 章 获取有关选择 SCSI 系统、使用不同的冗余磁盘阵列 [RAID] 级别以及其他重要磁盘信息的更多信息。）使用 第 11 章 中的信息来帮助确定服务器规模，但请记住这条经验法则：购买你负担得起的最强大的服务器，并确保它可以通过添加更多内存、更多处理器和更多磁盘空间进行扩展以满足你的未来需求。尽管如此，服务器在投入使用的三到四年后进行更换也是很常见的。\n\
  \n# 测试服务器硬件\n\n你已经发现所有服务器硬件都在 Windows Server 2012 的硬件性列表 (HCL) 中，确保了服务器配置足够，购买了它，并且手里正拿着崭新的\
  \ Windows Server 2012 DVD-ROM，准备好进行安装。现在可以开始安装了吗？嗯，还不完全。在安装任何网络操作系统 (NOS) 之前，特别是用于生产环境的服务器，请确保在安装\
  \ Windows Server 2012 之前对服务器进行硬件测试（也称为老化测试）。\n\n计算机硬件在运行一段时间后往往最可靠。换句话说，故障往往发生在设备较新的，而在硬件运行\
  \ 30 到 90 天后，硬件故障的概率会迅速下降。因此，在继续安装操作系统之前，对新服务器进行至少一周的测试（测试两周更好）。这样做有助于在易于修复的时间内诱发设备的任何早期故障，且不会影响任何用户或网络。此外，许多服务器的制造商提供\
  \ 30 天退货或换货政策，所以如果你发现了问题，你还有机会退回系统并可能从不同的型号重新开始。\n\n你使用服务器计算机自带的或服务器制造商提供的诊断软件来测试硬件。大多数此类诊断软件允许你选择测试系统的哪些组件，并允许你无限循环地测试它们，将发现的错误记录到软盘、USB\
  \ 闪盘或屏幕上。你应该将测试集中在以下组件上：\n\n- 处理器\n- 主板组件，如中断控制器、直接内存访问 (DMA) 控制器和其他主板支持电路\n- 内存\
  \ (RAM)\n- 磁盘表面\n\n| ![image](img/common.jpg) | **提示** | 服务器测试软件通常允许你在对磁盘进行非破坏性测试和破坏性测试之间进行选择。（破坏性意味着测试期间磁盘上的任何数据都将被擦除。）破坏性测试是发现磁盘上任何错误的最佳方法。这也是你想在安装操作系统之前进行此项测试的原因之一。\
  \ |\n\n如果诊断软件允许，你通常可以安全跳跳键盘或显示器等组件的测试。你主要关心的是该单元在长时间负载下是否继续正常运行。你还想确保内存工作正常，并且在测试期间磁盘上没有出现坏道。测试期间，多次开机关机设备也是个好主意，因为初始通电对设备的影响往往会引发任何边缘组件的故障，特别是如果允许设备先冷却的话。\
  \ |\n\n# 做出安装决策\n\n在对硬件进行配置、检查、准备和测试之后，你就可以开始安装 Windows Server 2012 了。在此过程中，你首先需要时间做出许多重要的安装前决策，你必须准备在安装期间指定这些内容。以下章节将讨论这些选择。\n\
  \n| ![image](img/common.jpg) | **注意** | 本章和下一章提供了 Windows Server 2012 的总体介绍。这里没有描述某些高级安装场景和技术。要了解在安装、管理或使用\
  \ Windows Server 2012 时可用的其他功能和选择，请参阅专用于 Windows Server 2012 的书籍。 |\n\n\n\n\n\n\
  # 升级还是安装？\n\n你可以将运行 Windows Server 2008 的服务器升级到 Windows Server 2012，也可以进行全新安装，后者会擦除服务器上任何现有的网络操作系统（NOS）。升级的主要益处是，你在\
  \ Windows Server 2008 下的所有现有设置都将保留，并自动迁移到你的 Windows Server 2012 安装中。这些包括网络细节（如 TCP/IP\
  \ 配置信息）以及你可能随着时间推移费琐设置的安全设置。事实上，如果服务器可以升级，你应该计划进行升级，除非你需要对服务器进行某些根本性的更改。\n\n# 域控制器、成员服务器还是独立服务器？\n\
  \n你另一个需要做出的决定是在你在何种模式下配置服务器。为了做出这一决定，你需要理解两个重要概念：Windows Server 2012 域和工作组。\n\n\
  `domain` 是 Windows 网络上计算机的一种复杂的管理性分组，它使得从单点管理网络资源以及实施强安全性成为可能。域允许你更轻松地管理多台 Windows\
  \ 服务器。`workgroup` 是网络上计算机的简单集合，仅适用于纯对等网络。\n\n你可以通过以下三种模式之一来配置 Windows Server 2012\
  \ 以支持域或工作组：\n\n![image](img/box.jpg)\n\n* `Domain controllers` 存储域的 Active Directory\
  \ 信息，并验证用户及对资源的访问。大多数 Windows Server 2012 网络至少有一个域，因此至少需要一个域控制器。\n![image](img/box.jpg)\n\
  * `Member servers` 是域的一部分，但不持有 Active Directory 信息的副本。\n![image](img/box.jpg)\n\
  * `Stand-alone servers` 不参与域，而是参与工作组。\n\n早版本的 Windows 服务器（NT 和 2000 版本）需要被指定为主域控制器\
  \ (PDC) 或备域控制器 (BDC)。PDC 执行所有管理任务，而 BDC 仅保留域信息的只读副本，以便在 PDC 发生故障时继续对网络进行安全验证。\n\n\
  较新版本的 Windows 服务器（例如运行 Windows Server 2008 或 2012 的服务器）简化了这些问题，使得所有的 Windows Server\
  \ 2012 域控制器仅仅是其名——域控制器。每个域控制器都持有 Active Directory 数据的副本，并可以执行其他域控制器的所有功能。Windows\
  \ Server 2012 使用 `multimaster domain controllers` 概念，所有的控制器都无缝地与其他域控制器相同的方式运行。\n\
  \n![](img/line1.jpg)\n\n| ![image](img/common.jpg) | **提示** | 除极规模最小的网络外，拥有两个域控制器是一个非常好的主意。这样，即使其中一个域控制器崩溃，所有的域信息也能被保留并供网络使用。域信息会在可用的域控制器之间自动同步。\
  \ |\n\n\n\n\n\n## 按席还是按服务器许可？\n\n在安装 Windows Server 2012 时，另一个重要的选择是服务器将如何管理其客户端访问许可证（CALs）。Windows\
  \ Server 2012 支持两种不同的 CAL 管理方式：![image](img/box.jpg)\n\n*按服务器许可*将 CAL 分配给特定服务器，该服务器允许的计算机连接数将仅同于该服务器上安装的\
  \ CAL 数量。![image](img/box.jpg)\n\n*按用户和按设备许可*需要为您的每个用户或每个客户端计算机（包括用户和设备的组合）各购买一个\
  \ CAL，这使他们有权访问任意数量的 Windows 服务器；服务器将不会监控连接数。\n\n通常，微软建议您在运行单台服务器时使用按服务器许可，在运行多台服务器时使用按席许可。如果您不确定使用哪种模式，微软建议您选择按服务器许可，因为微软允许您免费更改一次从按设备或按用户模式切换到按服务器模式（但从按席更改为按服务器是需要付费的）。请与您的\
  \ Windows Server 2012 售销商仔细审查许可选项，以确定正确许可您的网络服务器的最经济方式。\n\n## 等等！升级前请备份！\n\n如果您是将\
  \ Windows Server 2012 作为其他网络操作系统（NOS，如 Windows Server 2008）的升级，那么在安装 Windows Server\
  \ 2012 之前对服务器进行完全备份至关重要。（制作两个相同的备份是个好主意。）您应该使用通常为现有 NOS 使用的任何备份软件，确保该软件在您需要“撤销”升级过程并恢复起点时能够妥还原还原先的\
  \ NOS。\n\n即使您正在执行升级且不会格式化任何磁盘，进行安装前备份也是一种防患万一的好保险。\n\n## 安装 Windows Server 2012\n\
  \n要开始安装 Windows Server 2012，您可以配置服务器计算机从 Windows Server 2012 DVD-ROM 启动，或者在运行 Windows\
  \ Server 2008 时插入 Windows Server 2012 DVD-ROM。大多数服务器都可以从 DVD-ROM 驱动器启动，这是开始安装的最佳方式。\n\
  \n## 运行 Windows Server 2012 安装程序\n\n以下步骤概述了运行 Windows Server 2012 安装程序并将其安装到服务器上的过程。如果您正在学习\
  \ Windows Server 2012 并且有一台合适的电脑，您应该花时间安装 Windows Server 2012，以便理解该过程是如何工作的。或者，如果您愿意，也可以通过阅读以下步骤来熟悉安装过程。（我建议实际执行一次此处描述的安装，然后玩玩生成的服务器，以此更快速、更完整地学习\
  \ Windows Server 2012。）![image](img/box.jpg)\n\n当您从 Windows Server 2012 DVD-ROM\
  \ 启动时，程序首先显示一个屏幕，让您选择安装语言、时间和货币显示使用的格式，以及键盘或输入法（参见图 14-1）。做出相应选择，然后点击“下一步”继续![](img/line.jpg)![image](img/fig14-1.jpg)![](img/line.jpg)\
  \ **图 14-1。** 选择语言和其他偏好![image](img/box.jpg)\n\n您将看到如图 14-2 所示的屏幕。如果您启动 Windows\
  \ Server 2012 DVD-ROM 是为了尝试修复现有的安装，可以选择“修复您的计算机”。要开始安装，点击“现在安装”继续![](img/line.jpg)![image](img/fig14-2.jpg)![](img/line.jpg)\
  \ **图 14-2。** 选择安装软件！！image\n\n接下来，系统会提示您选择想安装标准版（Standard Edition）还是数据中心版（Datacenter\
  \ Edition），以及是否想要安装 GUI（参见图 14-3）。通常，您会希望带有 GUI 安装。只有当您将安装生产服务器 *并且* 将完全使用远程工具管理服务器时，才使用服务器核心版（无\
  \ GUI）安装选项![](img/line.jpg)![image](img/fig14-3.jpg)![](img/line.jpg) **图 14-3。**\
  \ 选择安装哪个版本以及是否安装 GUI 管理工具！！image\n\n在选择了要安装的版本后，系统将提示您接受许可条款。如果您接受许可许可条款，请勾选“我接受许可条款”复选框并点击“下一步”继续![image](img/box.jpg)\n\
  \n接下来，选择您是执行对现有系统的升级还是进行全新安装，如图 14-4 所示。请参本章早前的讨论以获取更多关于做出此决策的信息![](img/line.jpg)![image](img/fig14-4.jpg)![](img/line.jpg)\
  \ **图 14-4。** 选择安装类型！！image\n\n现在系统提示您选择要安装 Windows Server 的位置。从可用选项中选择合适的目标磁盘并点击“下一步”继续![image](img/box.jpg)\n\
  \n安装现在进行，您将看到一个与图 14-5 所示相似的安装屏幕![](img/line.jpg)![image](img/fig14-5.jpg)![](img/line.jpg)\
  \ **图 14-5。** 安装进度对话框！！image\n\n接下来，系统会提示您为系统内置的 Administrator 账户分配密码，如图 14-6 所示。选择强密码很重要，还要确保它不会丢失![](img/line.jpg)![image](img/fig14-6.jpg)![](img/line.jpg)\
  \ **图 14-6。** 设置密码！！image\n\n在密码密码并点击“完成”后，您现在已登录。此时，Windows Server 2012 图形界面启动，如图\
  \ 14-7 所示![](img/line.jpg)![image](img/fig14-7.jpg)![](img/line.jpg) **图 14-7。**\n\
  \n## 执行初始配置\n\n要完成 Windows Server 2012 的设置，您可以使用图 14-7 中的链接。但是，在此之前，您应该运行 Windows\
  \ Update 以确保服务器的所有内容都是最新的。\n\n在服务器管理器中，首先点击左侧窗格中的“本地服务器”。然后，在右侧的属性窗格中，您将看到一行标记为\
  \ Windows Update 的项，如图 14-8 所示。点击右侧标记为“检查更新”的超链接，这将弹出图 14-9 所示的 Windows 更新对话框。点击“检查更新”按钮，然后按照提示下载并安装任何可用的更新![](img/line.jpg)![image](img/fig14-8.jpg)![](img/line.jpg)\
  \ **图 14-8。**\n\n本地服务器的属性窗格![](img/line.jpg)![image](img/fig14-9.jpg)![](img/line.jpg)\
  \ **图 14-9。**\n\nWindows 更新对话框\n\n如果您安装 Windows Server 2012 仅仅是为了学习，并且它的网络已经有了 DHCP\
  \ 服务器，Windows 将自动获取 IP 地址，因此您不需要更改网络设置。然而在生产环境中，大多数服务器都分配了静态 IP 地址。\n\n要分配静态 IP，点击服务器管理器左侧窗格中的“本地服务器”。在主窗格中，找到“以太网”项，点击其右侧的超链接。这将打开图\
  \ 14-10 所示的网络连接窗口![](img/line.jpg)![image](img/fig14-10.jpg)![](img/line.jpg) **图\
  \ 14-10。**\n\n网络连接窗口在网络连接窗口中右键点击“以太网”对象，选择“属性”。这将激活图 14-11 所示的以太网属性对话框![](img/line.jpg)![image](img/fig14-11.jpg)![](img/line.jpg)\
  \ **图 14-11。**\n\n以太网属性对话框现在点击列表中的“Internet 协议版本 4 (TCP/IPv4)”，点击“属性”按钮。您将看到如图 14-12\
