  \ (`RRAS`)。 |\n| `Remote Authentication Dial In User Service (RADIUS)` | 一种网络协议，为连接并使用网络服务的计算机提供集中的认证、授权和计费\
  \ (AAA) 管理。 |\n| `repeater` | 一种扩展网络段运行距离的设备（中继）。 |\n| `requestor` | 运行在客户端计算机上的特殊网络软件，在计算机操作系统和网络操作系统之间建立接口。`Requestors`\
  \ 特定于每种不同的 `NOS`。 |\n| `ring topology` | 网络节点在环形配置中的电气排列（环拓结构）。 |\n| `RJ-45` | 一种用于某些网络介质的插拔连接器，类似于家庭使用的模块化电话连接器（称为\
  \ `RJ-11`），但更大。 |\n| `router` | 一种将网络流量从一个网络路由到另一个网络的设备（路由器）。 |\n| `Routing Information\
  \ Protocol (RIP)` | 一种允许 `routers` 相互通信以发现网络之间最佳路径的协议（路由协议）。 |\n| `SCSI` | 小型计算机系统接口。一种主要用于将硬盘连接到网络服务器的高速接口。\
  \ |\n| `segment` | 连接两个或多个计算机的网络各个部分（网段）。 |\n| `server` | 网络上的计算机，为客户端计算机提供某种网络服务（服务器）。\
  \ |\n| `session layer` | `OSI` 网络模型的第五层。会话层控制两个网络设备或程序之间的持久连接。 |\n| `share` | 一个\
  \ `Windows NT` 或 `UNIX` 共享目录，在用户具有权限的情况下，可在网络上供使用。 |\n| `SMTP` | 简单邮件传输协议。一种用于互联网上系统之间交换电子邮件的互联网标准。\
  \ |\n| `SNMP` | 简单网络管理协议。一种允许特殊管理软件管理网络设备的协议。 |\n\n\n\n\n\n- **SONET**: 同步光网络（Synchronous\
  \ Optical Networking）的缩写，一种定义光纤上数字传输的协议。通常用于极高速电信数据网络连接。\n- **SPX**: 顺序数据包交换（Sequenced\
  \ Packet Exchange）。一种与 `IPX` 配合使用的 NetWare 协议。\n- **SSL VPN**: 通过网页浏览器的安全套接层（Secure\
  \ Sockets Layer）功能工作的虚拟专用网络技术。\n- **星型拓扑**: 一种网络布局，其中单个电缆将中央集线器与其服务的节点连接起来。\n\n\
  - **switch**: 一种在两个或多个网段之间切换流量的以太网设备。\n- **TB**: `terabyte`（字节）的缩写，即一万亿字节。\n- **TDM**:\
  \ 分时复用（Time Division Multiplexing）的缩写。通常指使用 `DS1/DS3` (`T1/T3`) 或 `E1/E3` 电路的电信接入连接。\n\
  \n- **token**: 在令牌环网络中循环的电信号。只有“持有令牌”的计算机才能在令牌环网络上进行传输。\n\n- **Token Ring**: 由 IBM\
  \ 设计的网络，使用环形拓扑并通过循环令牌来管理网络流量。\n\n- **transceiver**: 将计算机连接到网络电缆的设备。收发器通常被内置在网卡（NIC\
  \ cards）中。\n\n- **传输控制协议/网协议 (TCP/IP)**: 一种用于互联网和许多私有网络的标准网络协议。\n\n- **transport\
  \ layer**: OSI 网络模型的第 4 层。传输层协调网络节点之间的数据包交换。传输层协议的示例包括 `TCP` 和 `SPX`。\n\n- **twisted\
  \ pair**: 使用共同护套内扭绞在一起的小线径导线的电缆，用于传输网络或电话信号。双绞电缆有非屏蔽 (`UTP`) 和屏蔽 (`STP`) 两种类型。\n\
  \n- **UPS**: 不间断电源。一种由电池驱动的电源，允许服务器在建筑供电中断时继续运行。\n\n- **URL**: 统一资源定位符（Uniform resource\
  \ locator）。一种允许定位和访问互联网上资源的地址。\n\n- **Virtual Private Network (VPN)**: 在公共网络（如互联网）上建立的安全虚拟网络连接。\n\
  \n- **wiring closet**: 汇集建筑网络所需所有电缆的间室或房间。某些建筑在每层都设有独立的配线间，或者每 100 米的水平距离设置一个。\n\
  \n- **workstation**: 网络上的通用计算机客户端。有时也是用于工程目的的高性能计算机。\n\n\n\n\n\n![image](img/common1.jpg)索引![image](img/line.jpg)\n\
