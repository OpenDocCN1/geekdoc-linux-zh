  \ `.` 是缩写，表示“当前目录”，就像在 DOS 下一样）：![image](img/p328-05.jpg)\n\n以人类可读的格式显示 `/tmp` 所在文件系统的剩余空间，请输入：![image](img/p328-06.jpg)\n\
  \n### sync: 同步磁盘\n\n与大多数其他现代操作系统一样，Linux 尝试通过维护磁盘缓存来提高效率。这意味着，在任何给定时刻，并不是你想写入磁盘的所有内容都已写入磁盘。\n\
  \n使用 `sync` 命令调度磁盘缓存写入磁盘。如果 `sync` 检测到已经调度了将缓存写入磁盘的操作，工具将导致内核立即刷新缓存。例如，为了确保磁盘缓存已刷新，请输入：![image](img/p329-01.jpg)\n\
  \n`sync` 命令没有任何命令行参数。\n\n## 进程操作\n\n在 Linux（以及通义的 UNIX）中，每个运行的程序至少由一个进程组成。从操作系统的角度来看，每个进程都是独立的，除非你明确要求进程之间共享资源，否则它们被限制在分配给它们的内存和\
  \ CPU 分配中。超出其内存分配额的进程（这可能会损坏另一个运行的程序并导致系统不稳定）会被立即杀死。这种处理进程的方法是 UNIX 能够长期维持其系统稳定性声明的关键原因之一——用户应用程序无法损坏其他用户程序或操作系统。\n\
  \n本节讨论了用于列出和操作进程的工具。这些信息对于系统管理员非常有用，因为监控正在发生的情况始终重要。\n\n### ps: 列出进程\n\n`ps` 命令列出系统中的所有进程，以及它们的状态、大小、名称、所有者、CPU\
  \ 时间、挂钟时间等。该命令有很多命令行选项。表 19-10 列出了 `ps` 的某些选项![](img/line.jpg)![image](img/tab19-10.jpg)![](img/line.jpg)\n\
  \n**表 19-10。常用的 ps 选项**\n\n例如，列出当前用户拥的所有进程，请输入：![image](img/p330-01.jpg)\n\n以 Unix\
  \ 格式列出所有进程，请输入：![image](img/p330-02.jpg)\n\n以 BSD 格式列出所有进程，请输入：![image](img/p330-03.jpg)\n\
  \n列出特定用户的所有进程，请输入：![image](img/p330-04.jpg)\n\n\n\n\n| ![image](img/common.jpg)\
  \ | 注意：终止进程的能力显然是一项非常强大的功能。`kill` 命令的开发者意识到了这一点，并确保了安全措施的存在，以便用户只能杀死他们有权限杀的进程。例如，非\
  \ root 用户只能向他们自己的进程发送信号。如果非 root 用户尝试向其不拥有的进程发送信号，系统将返回错误信息。另一方面，root 用户可以向系统中的所有进程发送信号。这意味着在使用\
  \ `kill` 命令时，root 用户需要格外加小心，以避免误杀错误的进程！ |\n\n## 杂项工具\n\n如果这本书专门介绍你 Linux 系统中可用的命令，那么本节讨论的工具每个都将符合某个特定的类别。但由于本概述侧重于日常管理工作中最重要的工具，因此以下工具被统统归在“杂项”下。然而，尽管本节拒绝了将它们归类到自己的特定类别下，但这并不意味着这些工具不重要！\n\
  \n### uname：显示系统名称\n\n`uname` 程序允许你了解系统的一些细节。当你成功远程登录到几十台不同的计算机并忘记了自己所在位置时，这个工具通常非常有帮助。该工具对于脚本编写者也很有帮助，因为它允许他们根据系统信息更改脚本的路径。`uname`\
  \ 的命令行参数列在表 19-12 中![](img/line.jpg)![image](img/tab19-12.jpg)![](img/line.jpg)\n\
