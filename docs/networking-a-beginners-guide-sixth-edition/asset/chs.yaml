  \ 主服务器配置![image](img/box.jpg) 虚拟主机\n\n这些每个部分都包含大量控制 Apache 工作方式的指令。在学习 Apache 时，你应该花些时间研究\
  \ `httpd.conf` 文件的内容并阅读其中包含的详细注释。你还应该在在线 Apache 文档（[`httpd.apache.org/docs/`](http://httpd.apache.org/docs/))中查询各种指令，以获取比\
  \ `httpd.conf` 文件注释提供的更详细的信息。\n\n## 发布网页\n默认情况下（对于 Apache 2 版本），由 Apache 发布的主网站位于\
  \ `/var/www/html` 目录，该目录是空的。一旦你准备好发布一个完整的网站，就可以将文件放入 `/var/www/html` 中，并将首页存储为 `index.html`。实现此操作最简单的方法是使用\
  \ FTP 程序连接到运行 Apache 的计算机，然后将网站文件直接上传到 `/var/www/html` 目录或服务器硬盘上的临时目录。进入临时目录后，你可以使用\
  \ `mv` 或 `cp` 命令将它们移动到服务器本身的正确位置（这些是许多其他实用 Linux/UNIX 命令之一，在第 19 章中有介绍）。\n\n## 章节总结\n\
  大多数网络专业人员在工作中都需要设置和维护 Web 服务器。所有服务器平台都提供了可用的 Web 服务器。Apache Web 服务器是一个几乎适用于所有平台的优秀\
  \ Web 服务器。正如你在本章看到的，Apache 易于安装、管理和运行。如果你遵循了前面的章节说明并在测试系统上安装了 Oracle Linux，我建议你也按照本章的步骤设置并运行\
  \ Apache。然后为它添加一些简单网站的文件，并浏览 Web 服务器，首先从运行它的计算机进行访问，然后从网络上的另一台计算机进行访问。本章旨在让你开始使用\
  \ Apache Web 服务器。如果你希望在该领域获得更深知识，你将在专注于 Apache 服务器的资源中找到更多细节。![image](img/common4.jpg)\n\
  \n| 第 21 章 | ![image](img/line-1.jpg) | 虚拟化简介 |\n\n![image](img/common5.jpg)![image](img/line1.jpg)过去几年网络领域最令人兴奋的发展领域之一是虚拟化，这是在单台计算机上创建多个虚拟机的方法。这些虚拟机运行起来就像运行在它们自己的计算机上一样，计算机的实际资源——其处理器、硬盘空间、网络连接和其他硬件——都虚拟化了，以便它们可以在各个虚拟机之间共享。本章介绍了虚拟化。它讨论了虚拟化的一些主要优势，然后提供了对微软和\
  \ VMware 虚拟化产品的概述。为了让你快速上手，本章将带你完成 Oracle VirtualBox 的安装（一种个人用途免费的虚拟化产品）以及 Oracle\
  \ Linux 虚拟机的设置。\n\n## 虚拟化的益处\n虚拟化计算机的能力可以带来丰厚的回报。以下是虚拟化的一些主要优势：![image](img/box.jpg)\n\
  \n**更高效地利用服务器资源**\n正如前面的章节所述，每台计算机专用一个服务器应用程序是提供服务最可靠的方法，也更易维护。然而，你通常会有一些并不消耗多少服务器资源的应用程序。例如，你可能有一个\
  \ Web 服务器，供组织内的 30 到 40 人偶尔使用。但是，通过虚拟化，你可以在单台服务器上运行多个相互完全独立的虚拟机，从而更有效地利用服务器资源。![image](img/box.jpg)\n\
  \n**在单台计算机上运行多个操作系统的能力**\n通过虚拟化，存在一个主机操作系统（即安装在计算机本身上的操作系统）和客操作系统（即安装在每个虚拟机内部的操作系统）。例如，你可以在计算机上安装\
  \ Windows Server 2012 主机操作系统，然后在虚拟机内部运行如 Windows（包括桌面版和服务器版）、Linux 或 Solaris 等操作系统。或者你也可以在计算机上安装\
  \ Linux，然后在虚拟机中运行各种 Linux 和 Windows 操作系统。你甚至可以没有主机操作系统，而是安装所谓的 Hypervisor（虚拟机监视器），它是一种仅支持虚拟机的极其精简版操作系统。![image](img/box.jpg)\n\
  \n**便于移动虚拟机**\n你可以轻松地将虚拟机从一台服务器移动到另一台服务器，以便更好地管理和平衡磁盘空间、内存和处理器利用率等资源。![image](img/box.jpg)\n\
  \n**降低功耗需求**\n你可以减少运行 IT 基础设施所需的能量。通过整合服务器，你的功耗需求会降低。![image](img/box.jpg)\n\n**简化维护**\n\
  当你将许多应用程序放在单台服务器操作系统上时，很难在不影响其他程序的情况下维护每个单独的应用。例如，如果你升级了一个应用程序并需要重启服务器，你必须重启整个服务器，这将影响它可能执行的所有其他任务。在虚拟机设置下，你可以轻松地重启单个虚拟机，而不会影响其他机器的运行，也不会中断它们的服务。\n\
  \n## 引入 Windows Server 2012 Hyper-V\n微软现在在 Windows Server 2012 中提供了 Hyper-V 技术。Hyper-V\
  \ 是一个功能全的监视器，运行在 Windows Server 2012 环境中，允许你在 Windows Server 2012 中创建和管理虚拟机。这为基于\
  \ Windows Server 2012 的组织轻松开始使用虚拟化提供方便的方法![](img/line1.jpg)\n\n| ![image](img/common.jpg)\
  \ | 注意：Windows Server 2012 标准版包含每种 Windows Server 2012 许可对应最多两台虚拟机的授权权。你可以购买额外的\
  \ Windows Server 2012 标准版许可来增加许可限制，每种许可包含额外两台虚拟机的授权权。Windows Server 数据中心版包含无限数量虚拟机的授权权。\
  \ |\n\n\n\n\n\n微软的 Hyper-V 仅支持单一主机操作系统，即：`Windows Server 2012`。（Windows Server 2008\
  \ 也包含了较早版本的 Hyper-V）。它支持以下客户操作系统：\n\n![image](img/box.jpg) Windows Server 2012![image](img/box.jpg)\
  \ Windows Server 2008 (64 位和 32 位)![image](img/box.jpg) Windows Server 2003 (64\
  \ 位和 32 位)![image](img/box.jpg) Windows Server 2000 SP4![image](img/box.jpg) CentOS![image](img/box.jpg)\
  \ Red Hat Enterprise Linux (64 位和 32 位)![image](img/box.jpg) SUSE Linux Enterprise\
  \ Server (64 位和 32 位)![image](img/box.jpg) Windows 7 (64 位和 32 位)![image](img/box.jpg)\
  \ Windows Vista (64 位和 32 位)![image](img/box.jpg) Windows XP 专业版 (64 位和 32 位)\n\n\
  这些是支持的客户操作系统。请注意，变体（例如其他 Linux 发行版）可能——而且通常能够运行良好。自从 Hyper-V 作为 Windows Server 2008\
  \ 的一部分以来，微软对其进行了大幅改进，它现在被认为是 VMware 的有力竞争对手。\n\n## 介绍 VMware 虚拟化产品\n\n目前，VMware\
  \ 拥有最成熟的虚拟化基础设施。VMware 提供了多种产品，帮助各种规模的公司管理虚拟机。免费提供两个强大的虚拟化产品：\n\n![image](img/box.jpg)\
  \ VMware Server，这是一种全虚拟化产品，旨在安装在各种主机操作系统上![image](img/box.jpg) VMware vSphere Hypervisor（基于\
  \ VMware ESXi 构建），这是一个很小的（144MB）虚拟化程序，直接安装在裸机计算机上，并可以高效地托管客户操作系统\n\nVMware Server\
  \ 的优秀特性之一是它支持多种主机操作系统，包括许多设计为客户端操作系统的系统。这意味着你可以将 VMware Server 安装在例如 Windows 7 上，然后在虚拟机中安装系列客户操作系统。这允许\
  \ IT 专业人员运行各种操作系统，或测试各种操作系统和应用程序的组合，而无需从服务器操作系统开始。\n\nVMware Server 和 vSphere Hypervisor\
  \ 要求安装在具有支持虚拟化处理器的计算机上。幸运的是，如今几乎所有可用 Intel 或 AMD 处理器都支持虚拟化。VMware Server 也可以安装在\
  \ 32 位或 64 位处理器上。然而，请记住，如果你想在虚拟机中安装 64 位客户操作系统，主机操作系统也必须是 64 位。\n\nVMware Server\
  \ 支持以下主机操作系统：\n\n![image](img/box.jpg) Windows Server 2008 (64 位和 32 位)![image](img/box.jpg)\
  \ Windows Server 2003 (64 位和 32 位，包括小型业务服务器)![image](img/box.jpg) Windows 2000 Server![image](img/box.jpg)\
  \ 各种 64 位和 32 位的 Red Hat, SUSE, Ubuntu, Mandrake 和 Mandriva Linux 操作系统（支持版本的详细列表会发生变化，请咨询\
  \ VMware 文档获取您要安装的版本）\n\nVMware Server 支持以下客户操作系统：\n\n![image](img/box.jpg) Windows\
  \ Server 2008 (64 位和 32 位)![image](img/box.jpg) Windows Server 2003 (64 位和 32 位，包括小型业务服务器)![image](img/box.jpg)\
  \ Windows 2000 Server![image](img/box.jpg) Windows Vista (64 位和 32 位)![image](img/box.jpg)\
  \ Windows XP 专业版 (64 位和 32 位)![image](img/box.jpg) Mandrake, Mandriva, Red Hat,\
  \ SUSE, openSUSE, Open Enterprise Server 和 Ubuntu Linux![image](img/box.jpg) Sun\
  \ Solaris![image](img/box.jpg) Novell NetWare\n\n与 Hyper-V 列表一样，这些是支持的操作系统。变体（例如其他\
  \ Linux 发行版）也可以运行。\n\n## 介绍 Oracle VM VirtualBox\n\nVirtualBox 最初由一家名为 Innotek GmbH\
  \ 的公司开发，在 2008 年被 Sun Microsystems 收购，随后在 2010 年 Oracle 收购 Sun 时被收购。\n\nOracle VM\
  \ VirtualBox 的主要部分（我从起将简称为 `VirtualBox`）根据 GNU 通用公共许可提供，某些专有组件根据个人使用和评估许可提供。结果是，VirtualBox\
  \ 供个人、教育或评估使用是免费的。\n\nVirtualBox 是一个非常强大的虚拟化解决方案，其功能与 VMware Server 类似。它支持 Windows、OS\
  \ X、Linux 和 Solaris 主机操作系统。它还支持多种客户操作系统，包括多个 Windows Server 和桌面版本、Linux、Solaris、FreeBSD、OpenBSD，据报道甚至还有某些版本的\
  \ OS/2 Warp。特别注意的是，尽管存在某些限制，即使 `VirtualBox` 在 32 位主机操作系统中运行，它也支持 64 位客户操作系统。你可以在\
  \ [www.virtualbox.org](http://www.virtualbox.org) 下载 `VirtualBox` 并获取用户手册。\n\n##\
  \ VirtualBox 许可如何定义“个人使用”？\n\nVirtualBox 许可常见问题对“个人使用”有非常宽松的解释，允许在商业环境中使用，如下：\n\n\
  “个人使用是指你自己在一或多台 PC 上安装该产品并使用它（甚至是你的朋友、姐姐和奶奶）。无论你只是为了好玩，还是用它运行你数百万欧元的业务，都没有关系。同样，如果你在某大公司的工作\
  \ PC 上安装它，这仍然属于个人使用。然而，如果你是管理员并想将其部署到公司的 500 台台机上，这就不再符合个人使用了。”\n\n`VirtualBox`\
  \ 的安装非常简单。系统会提示你希望安装在何处，以及是否安装某些可以支持虚拟机 USB 设备的附加组件、用于桥接网络的的额外网络驱动程序以及 Python 支持。对于所有这些组件，你都可以接受提供的默认选项。\n\
  \n一旦 `VirtualBox` 安装完成，你需要重启系统。\n\n## 为 Oracle Linux 创建虚拟机\n\n在示例中，你将看到创建一个运行 Oracle\
  \ Linux 的虚拟机是多么简单。你将从光盘镜像（ISO 文件）安装 Oracle。你可以从 [`edelivery.oracle.com`](http://edelivery.oracle.com)\
  \ 下载当前的 Oracle 版本。\n\n以下是步骤：\n\n1. **启动虚拟机**：\n   在 `VirtualBox` 内部点击 `New` 图标，如图\
  \ 21-1 所示。\n![image](img/box.jpg)\n\n2. **命名和版本**：\n   接下来你看到 `Type` 和 `Version`，如图\
  \ 21-2 所示。\n![image](img/box.jpg)\n\n3. **分配内存**：\n   接下来你会被提示为虚拟机分配多少内存，如图 21-3\
  \ 所示。\n![image](img/box.jpg)\n\n4. **创建硬盘**：\n   接下来你会被提示创建一个硬盘，如图 21-3 所示。\n![image](img/box.jpg)\n\
  \n5. **选择文件格式**：\n   你现在选择虚拟驱动器使用的格式，如图 21-4 所示。\n![image](img/box.jpg)\n\n6. **选择分配方法**：\n\
  \   接下来你选择虚拟器空间的分配方式，如图 21-5 所示。\n![image](img/box.jpg)\n\n7. **选择位置和大小**：\n   你的下一步是选择虚拟硬盘文件的位置和大小，如图\
  \ 21-6 所示。\n![image](img/box.jpg)\n\n完成设置并创建虚拟硬盘\n![image](img/box.jpg)\n\n\n\n\n\
  \n| **提示** | 虚拟硬盘，无论使用动态分配还是固定大小分配方法，如果需要，以后可以使用 VirtualBox 命令进行扩展：![image](img/p351-01.jpg)\
  \ |\n\n8. 你现在已返回到 VirtualBox 主界面，你可以在图 21-7 中看到它。虚拟机已被选中，其详细信息在主显示区域中可见。虽然虚拟机已准备就绪运行，但你还没有完全准备好启动它。你首先需要将虚拟机设置为使用\
  \ Oracle Linux 安装 ISO 文件作为虚拟 DVD-ROM。要这样做，请在左窗格中选择虚拟机，并点击 VirtualBox 中的设置图标。![](img/line.jpg)![image](img/fig21-7.jpg)![](img/line.jpg)\
  \ **图 21-7.** 已创建的虚拟机\n\n9. 你将看到设置对话框。左侧是虚拟机的各种设置类别。选择`Storage`，然后点击标记为 `Empty`（空）的\
  \ CD 图标。点击窗口右侧（紧邻 CD/DVD 驱动器字段）的 CD 图标，并选择 `Choose A Virtual CD/DVD Disk File`（选择虚拟\
  \ CD/DVD 磁盘文件）选项。你将看到一个标准文件选择对话框，可以选择你下载的 Oracle Linux ISO 文件，如图 21-8 所示。![](img/line.jpg)![image](img/fig21-8.jpg)![](img/line.jpg)\
  \ **图 21-8.** 设置虚拟机从 Oracle Linux ISO 启动\n\n### 在虚拟机中运行 Oracle Linux\n\n现在你已经创建了\
  \ Oracle 虚拟机，在 VirtualBox 主界面，点击左窗格中的虚拟机，这将显示虚拟机的详细信息。如果你犯了任何错误，可以使用设置对话框更改虚拟机参数。否则，你只需要点击\
  \ VirtualBox 中的启动图标来虚拟地“通电”虚拟机即可。\n\n由于虚拟机的虚拟硬盘是空的，而且你已经将 Oracle Linux ISO 镜像文件连接到虚拟机，虚拟机将从该镜像文件启动，就像任何计算机在这种情况下（插入了可启动的\
  \ CD 或 DVD 且硬盘为空）一样。Oracle 镜像文件将用于启动并显示安装程序，如图 21-9 所示。你现在可以按照第 18 章中讨论的内容继续安装 Oracle\
  \ Linux。![](img/line.jpg)![image](img/fig21-9.jpg)![](img/line.jpg) **图 21-9.**\
  \ 虚拟机中的 Oracle Linux 安装![](img/line1.jpg)\n\n| **注意** | 当你在虚拟机中安装客户操作系统时，就像安装在裸机计算机上一样。安装期间，你需要对虚拟硬盘进行分区和格式化，因为虚拟硬盘最初是完全空白。第一次在虚拟机中安装客户操作系统时，你可能担心所有关于删除硬盘内容的典型警告可能会影响主机计算机。然而，只要你运行在虚拟机中，只有虚拟硬盘可以被客户操作系统分区和格式化；你的主机系统与虚拟机完全隔离。\
  \ |\n\n此时，你应该了解一些与 VirtualBox 虚拟机控制台交互的细节。当你点击控制台内部时，控制台将“拥有”主机的鼠标和键盘。要释放鼠标和键盘以便与主机系统交互，请按下右侧的\
  \ `CTRL` 键。当返回控制台时，只需点击它即可。此外，对于虚拟机，不需要按 `CTRL-ALT-DELETE`，而是按下键盘上的右侧 `ctrl` 键和删除键。`CTRL-ALT-DELETE`\
  \ 总是被 VirtualBox 解释为针对主机操作系统的。\n\n### 备份虚拟机数据\n\n在生产环境中，你需要考虑打算如何备份虚拟机上的数据。有几种方法：![image](img/box.jpg)\n\
  \n你可以关闭或挂起虚拟机，并将整个虚拟机文件从主机计算机硬盘上的位置复制到某种备份介质。如果虚拟机包含许多已安装应用程序但变化的数据很少，那么这是一个很好的备份策略。（另注意，虚拟机可以在计算机之间移动，因此要恢复虚拟机，你只需要将其移动到运行有兼容版本虚拟化软件的计算机上。）![image](img/box.jpg)\n\
  \n在虚拟机内部，你可以设置一个过程将其数据文件复制到网络上的另一个位置，然后该位置可能会备份到磁带或其他备份介质上。![image](img/box.jpg)\n\
  \n大多数高端备份软件解决方案都会销售附加产品，允许你从 `VMware` 或 `Hyper-V` 虚拟机内部备份文件。\n\n### 本章总结\n\n在本章中，你学习了虚拟化的核心知识以及它能为网络带来的益处。你学习了微软和\
  \ VMware 的企业虚拟化解决方案，以及 Oracle VM VirtualBox，并学习了如何在 VirtualBox 中设置一个运行 Oracle Linux\
  \ 的虚拟机。\n\n虚拟化在业务网络中已变得非常重要，因为最终它帮助公司用更少的资源做更多的事（一种常见的企业格言）。因此，让网络领域的人员理解虚拟化、它带来的益处以及如何与其配合是非常重要的。如果你没有按照本章概述的方法实际设置\
  \ VirtualBox 系统，我强烈建议你找机会这样做。亲身体验虚拟机有多强大且有用是无可替代的。![image](img/common1.jpg)\n\n\
  ### 术语表\n\n| 术语 | 说明 |\n| :--- | :--- |\n| **10Base-2** | 通过同轴电缆传输 10 Mbps（基带）的规范。也称为细以太网（Thin\
  \ Ethernet）或细网（Thinnet）。 |\n| **10Base-5** | 通过厚同轴电缆传输 10 Mbps（基带）的规范。也称为粗以太网（Thick\
  \ Ethernet）或粗网（Thicknet）。 |\n| **10Base-Fx** | 通过光纤传输传输 10 Mbps（基带）的规范。 |\n| **10Base-T**\
  \ | 通过双线电缆传输 10 Mbps（基带）的规范。 |\n| **100Base-Tx** | 通过双线电缆传输 100 Mbps（基带）的规范。 |\n\
  | **1000Base-T** | 通过双线电缆传输 1,000 Mbps（千兆比特）的规范。 |\n| **802.x** | 各种类型以太网网络的规范。\
  \ |\n| **AAUI** | 苹果附件单元接口（Apple Attachment Unit Interface）。用于将旧版 Mac 连接到以太网。 |\n\
  | **访问** | 在电信语境下，这指的是客户位置与提供者更广泛的网络之间连接的方法和成本组成部分。它适用于语音和广域数据网络。 |\n| **访问控制列表\
  \ (ACL)** | Windows 服务器文件、目录和其他资源的安全权限列表。访问控制列表也用于其他设备，本质上是谁可以访问什么的内容的列表。 |\n| **访问权限**\
  \ | 控制用户对特定网络资源可以做什么和不能做什么的权利。 |\n| **账户** | 在服务器上，对服务器服务的用户的定义。没有有效账户，用户无法访问服务器或网络。\
  \ |\n| **地址解析协议 (ARP)** | 一种根据 Internet 协议（IP）地址解析目标媒体访问控制（MAC）地址的协议。 |\n| **管理员**\
  \ | 网络的主管理员。管理员通常有权在网络上执行任何任务并访问任何资源，并可以为网络用户分配权限。有时称为*主管*和*超级用户*。 |\n\n\n\n\n\n\
  | **AFP** | Apple 文件协议（Apple Filing Protocol）。一种通过网络处理文件的访问协议。 |\n| **analog** |\
  \ 模拟。一种多状态电信号，通常具有无限数值。例如，收音机上的音量旋钮通常就是模拟调节。 |\n| **ANSI** | 美国国家标准协会。一家协调美国标准的私营非营利组织。\
  \ |\n| **AppleTalk** | 一套用于 Macintosh 计算机的网络协议。 |\n| **application layer** | 应用层。OSI\
  \ 网络模型中的第七层，也是最高层。它处理跨网络应用程序之间的通信。应用层经常在网络上执行用户身份验证。 |\n| **archive bit** | 归档位。一种用于指示哪些文件需要归档（备份）的标志位。在完成完整备份后，归档位会被清除。文件的任何后续更改都会导致归档位被设置为开启，表示需要归档。\
  \ |\n| **ARCnet** | 一种如今很少使用的令牌传递网络协议。 |\n| **ATM** | 异步传输模式（Asynchronous Transfer\
  \ Mode）。一种高速交换和多路用网络规范。 |\n| **attributes (file)** | 文件属性。赋予文件的特性的。例如，在 DOS 文件中，属性包括只读、系统、隐藏和归档。网络系统通常会增加诸如可共享和禁止删除等属性。\
  \ |\n| **AUI** | 附加单元接口（Attachment Unit Interface）。一种用于将网络电缆连接到收发器的盒子。 |\n| **backbone**\
  \ | 骨干。网络分段共享的公共电缆。通常，网络骨干部分的运行速度比单个分段快，因为它必须承载所有连接分段的大部分流量。 |\n| **bandwidth**\
  \ | 带宽。网络可以携带的数据量，通常以每秒百万比特（Mbps）表示。有时带宽也以赫兹表示，例如 10 兆赫兹（MHz）。 |\n| **baseband**\
  \ | 基带。一种一次只能携带一个信号的网络电缆。参见 *Broadband（宽带）*。 |\n| **Basic Rate Interface (BRI)**\
  \ | 基本速率接口。一组 ISDN 服务，包括两个速率各为 56 或 64 Kbps 的承载通道（美国常用 64 Kbps），以及一个承载 16 Kbps 数据的单数据信道。BRI\
  \ 有时也称为 `2B + D`。 |\n| **baud rate** | 波特率。模拟信号传输的速率。波特率类似于每秒比特（bps）。因此，2400 波特约等于\
  \ 2400 bps。 |\n| **B-channel** | B 信道。ISDN 连接中传输（通常为）64 Kbps 数据的通道。 |\n| **bindery**\
  \ | 一个包含 Novell 网络（4 及更早版本）账户和安全信息的数据库。 |\n| **bit** | 位。二进制数字（*binary digit*）的缩写，值为\
  \ 0 或 1 的单个数字。 |\n| **BNC connector** | BNC 连接器。用于 10Base-2（细型）以太网网络的插口式连接器。 |\n\
