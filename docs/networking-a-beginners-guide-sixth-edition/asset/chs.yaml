  配置好网络后，你可能还想分配计算机名称，如果存在现有域，还要将此服务器连接到该域。回到`Server Manager`主界面，在左侧窗格中选择`Local Server`，然后点击`Computer\
  \ Name`条目右侧的链接，显示如图 14-13 所示的`System Properties`对话框![](img/line.jpg)![image](img/fig14-13.jpg)![](img/line.jpg)**图\
  \ 14-13.** 系统属性对话框\n\n接下来，点击对话框中的`Change`按钮，这将弹出如图 14-14 所示的`Computer Name/Domain\
  \ Changes`对话框![](img/line.jpg)![image](img/fig14-14.jpg)![](img/line.jpg)**图 14-14.**\
  \ 设置服务器名称和工作组或域\n\n在此对话框中，为新服务器输入适当的名称。我通常建议使用较短且易于记忆和输入的名称。如果你想将此服务器连接到现有的 Active\
  \ Directory 域，点击`Domain`选项并输入正确的域名。（你需要目标域的管理员帐户和密码才能将此计算机加入其中。）如果你只是在学习`Windows\
  \ Server 2012`，或者你正准备创建一个 Active Directory 域，此时可以保持服务器处于工作组模式。点击`OK`保存新的服务器名称，这将需要重启服务器。\n\
  \n## 添加角色和功能\n\nWindows Server 2012 让设置服务器执行不同角色变得极其简单。在`Server Manager`中，确保你处于左侧窗格的`Dashboard`部分，然后点击`Add\
  \ Roles And Features`，这将激活如图 14-15 所示的`Add Roles And Features Wizard`向导![](img/line.jpg)![image](img/fig14-15.jpg)![](img/line.jpg)**图\
  \ 14-15.** 添加角色和功能向导\n\n当你首次点击`Next`通过向导时，你将看到向导的`Installation Type`部分，在其中你可以选择执行基于角色的安装、基于功能的安装，或执行远程桌面服务安装。在本例中，选择基于角色的或基于功能的安装，并点击`Next`继续。\n\
  \n随后系统会提示你选择一个要在其安装角色和功能的服务器。由于此示例针对单台服务器，列表中应该只列出你正在操作的这台服务器。选择`Select A Server\
  \ From The Server Pool`选项，确保选中了正在设置的服务器，并点击`Next`继续。\n\n接下来，你将看到一个可以选择安装的角色列表，如图\
  \ 14-16 所示。你通过勾选每个角色旁边的复选框来选择想要安装的角色。你可以点击每个角色来阅读该角色作用的简短描述![](img/line.jpg)![image](img/fig14-16.jpg)![](img/line.jpg)**图\
  \ 14-16.** 添加角色和功能向导中的服务器角色部分\n\n如果你将服务器配置为文件服务器，只需确保已安装`File And Storage Services`，如图\
  \ 14-16 所示。若要使用`IIS`将其配置为 Web 服务器，请勾选`Web Server (IIS)`复选框。你可以选择所需的任何角色组合，向导将引导你以最少的麻烦完成任何必要的额外设置。在本例中，我们正将`Windows\
  \ Server 2012`作为独立域控制器安装，因此请勾选`Active Directory Domain Services`旁边的复选框，这将立即激活一个对话框告知你需要安装额外功能，并提议为你安装它们，如图\
  \ 14-17 所示。点击`Add Features`安装这些功能并继续，这将返回到`Select Server Roles`屏幕。从那里，点击`Next`继续主向导![](img/line.jpg)![image](img/fig14-17.jpg)![](img/line.jpg)**图\
  \ 14-17.** 为 Active Directory Domain Services 角色添加所需功能\n\n接下来，你将看到向导的`Select Features`部分，如图\
  \ 14-18 所示。功能是你可以选择安装在服务器上的各种附加能力。在学习学`Windows Server 2012`的过程中，熟悉此列表是有意义的。对于本例，`Group\
  \ Policy Management`应该已经是一个选中的待安装功能，因此点击`Next`继续![](img/line.jpg)![image](img/fig14-18.jpg)![](img/line.jpg)**图\
  \ 14-18.** 向导中的选择功能部分\n\n本例中向导的下一步是一个描述与`Active Directory Domain Services`安装相关的额外信息的屏幕，并说明任何依赖功能将在主安装过程中自动安装。点击`Next`继续，这将进入最后的确认屏幕，在那里你可以点击`Install`按钮开始实际安装。\n\
  \n安装完成后，你应该重启服务器。重启后，还需要一些额外的步骤。如果你查看`Server Manager`仪表板顶部，你会看到一个带有黄色警告标志的图标。点击该图标将显示警报，在这种情况下它告知你需要将服务器提升为域控制器（见图\
  \ 14-19）![](img/line.jpg)![image](img/fig14-19.jpg)![](img/line.jpg)**图 14-19.**\
  \ 告知你需要提升服务器的警告\n\n要执行提升，点击警报窗口中的`Promote This Server To Domain Controller`链接，这将激活`Active\
  \ Directory Domain Services Configuration Wizard`向导，如图 14-20 所示。由于这是一个独立的服务器和域，选择`Add\
  \ A New Forest`，输入你想用于根域的名称，并点击`Next`继续![](img/line.jpg)![image](img/fig14-20.jpg)![](img/line.jpg)**图\
  \ 14-20.** 使用配置导配置 Active Directory\n\n现在选择 Active Directory 森林和域的功能级别。（森林是域的组合。即使是\
  \ Active Directory 中的单个域也需要属于森林。）由于这是一个演示系统，请将森林和域的功能级别都设置为`Windows Server 2012`。`Domain\
  \ Name System (DNS)`服务器和`Global Catalog (GC)`的复选框也应该勾选，因为 Active Directory 域需要安装这两个资源才能正常运行。最后，输入一个在需要`Directory\
  \ Services Restore Mode (DSRM)`时可以使用的密码。图 14-21 显示了向导中此步骤的样式。完成后，点击`Next`继续![](img/line.jpg)![image](img/fig14-21.jpg)![](img/line.jpg)**图\
  \ 14-21.** 设置域控制器选项\n\n\n\n\n\n接下来，你可能会看到一个警告，提示无法创建 DNS 服务器的委托。你可以忽略此警告，因为你正在以演示模式下设置此系统，它不需要与其他\
  \ DNS 区域集成。点击“下一步”继续。\n\n现在，你会被提示验证分配给域的 NetBIOS 名称，向导通常会自动建议该名称。在示例中，我使用的 NetBIOS\
  \ 名称是 `NABG-AD`。点击“下一步”继续。\n\n最后的设置将提示你输入目录位置，系统将在这些位置上存储三个资源。默认情况下，Active Directory\
  \ 数据库文件和日志文件将存储在 `C:\\Windows\\NTDS`，而在 `C:\\Windows\\SYSVOL` 处将创建一个名为 `SYSVOL`\
  \ 的文件夹。点击“下一步”接受这些默认设置并继续。\n\n最后，向导将确认你所做的所有选择。点击“下一步”后，向导将验证系统是否满足域控制器所需的所有先决条件，之后你就可以点击“安装”进行安装，安装过程应该在几分钟内完成。完成后，系统将自动重启。完成后，恭喜！通过这些步骤，你已经完成了域控制器的安装和配置，并能够作为域控制器的\
