  ## 章节总结\n\n在本章中，你首先学习了如何使用 Linux 内置的图形化工具设置一些关键服务器设置。然后你学习了 Linux 命令行以及如何使用它控制系统。\n\
  \n当然，本章并没有涵盖你对 Linux 系统管理所需要的所有知识。但根据你在这里学到的内容，你应该能够执行基本的管理职责并在操作系统中找到方向。\n\n获取更多信息的简单方法是花时间尝试命令行工具和各种系统工具程序。图形化工具的功能比这里显示的强大得多。事实上，对于简单的服务器，仅使用图形化工具就可以执行系统维护！另一方面，命令行是\
  \ Linux 灵活性的核心。\n\n如果你想学习更多关于 Linux 系统管理的知识，请一定要查看 Steven Graham 写的 *Linux Administration:\
  \ A Beginner’s Guide*, *Sixth Edition* (McGraw-Hill Education, 2012)。\n\n现在你已经学习了安装\
  \ Linux 和管理 Linux 系统，在下一章中，你将学习安装 Linux 下运行的最常见的网络服务之一：Apache Web 服务器。![image](img/common4.jpg)\n\
  \n\n\n\n\n![image](img/common5.jpg)![image](img/line1.jpg)\n\n最流行的 Web 服务器应用程序之一是\
  \ Apache Web 服务器，它是一个运行在多种操作系统（包括 Linux、Windows、Mac OS X 和 Solaris）上的免费程序。Apache\
  \ Web 服务器是一个稳健且经过验证的平台，用于托管网站。它是开源且免费提供的，并运行在通常也可以免费获取的类 Unix 系统 Linux 上，这本身就是一个巨大的优势，毫无疑问，这推动了它持续的流行行度。本章将介绍\
  \ Apache Web 服务器。你将学习安装它所需的各种知识、查找支持它的 Web 资源，以及在 Fedora Linux 系统上建立一个基础网站。\n\n\
  ## Apache Web 服务器概述\n\nApache Web 服务器最初是 20 世纪 90 年代初美国国家超级计算机应用中心（NCSA）的一项小型开发项目。它最初是一个非常简单的\
  \ UNIX `daemon`（发音与“demon”相同），由 Rob McCool 首次编写。McCool 于 1994 年离开了 NCSA，之后该项目开始由许多位不同的程序员进行扩展，其中一些人向核心程序添加了包（模块），以支持新的\
  \ Web 技术。在那个时代，Web 服务器被称为“patchy”（补丁化的），因为它不断获得新的补丁（patches）来修复问题或扩展功能。最终，它被称为 Apache\
  \ Web 服务器。\n\nApache Web 服务器 1.0 版本于 1995 年末向公众发布，到 1996 年已成为互联网上最流行的 Web 服务器。本章撰写时的最新统计（可从\
  \ [`news.netcraft.com/archives/web_server_survey.html`](http://news.netcraft.com/archives/web_server_survey.html)\
  \ 获取）显示，Apache 被用于托管互联网上约 53%（超过 3.59 亿个）的活跃网站。微软的 Internet 信息 Server（IIS）位居第二，占比约为\
  \ 17%（约 1.12 亿网站）。Apache HTTP 服务器项目目前通过 Apache 基金会（[www.apache.org](http://www.apache.org））进行协调，该会是一家成立于\
  \ 1999 年的非营利机构。\n\nApache 与大多数其他服务器应用程序不同，因为它不是一个图形化程序（尽管它的主要目的是提供图形化的 Web 页面），并且没有图形化的安装程序。相反，Apache\
  \ 作为操作系统上的后台进程（或守护进程，daemon）运行。该后台进程通常被称为 `httpd`（超文本传输协议守护进程）。Apache Web 服务器的管理通过编辑其文本格式的配置文件完成，并通过停止和启动守护进程来使对配置文件的任何更改生效。\n\
  \nApache 是基于文本且通过命令行界面管理的这一事实不应该让你感到畏惧。安装和管理 Apache Web 服务器非常简单，你在操作时应该不会遇到困难。事实上，如果你遵循了第\
  \ 18 章中的 Oracle Linux 安装说明，你已经在该电脑上安装了 Apache，你只需要按照下一节所述对其进行激活即可（在 Oracle Linux\
  \ 安装中，它默认是不开启的）。\n\n## 在 Oracle Linux 下激活 Apache Web 服务器\n\n在 Oracle Linux 下安装 Apache\
