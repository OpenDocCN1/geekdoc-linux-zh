    controls and the volume control from the system. However, you may want to adjust
    the volume. The simplest method is to use the opensaver. Then use the `amixer`
    configuration tool. You will see that the sound card is named `rpi_hifberry_dac`.
    You can adjust the required level by using the up arrow key to increase it and
    the down arrow key to decrease it until you reach the preferred volume.


    One line then checks the volume - this time, check if it is greater or equal to
    zero, the level is it, then increase the volume by 0.10, using `level = level
    + 0.10`, then play the next five lines. As with the previous step, if the level
    is less or equal to zero, the level is zero, therefore pass and return to the
    main loop.


    # ## 15 End the loop


    Once the program has looped through all the songs or you have ahead used, the
    program breaks out of the loop and prints that the end of the list has been reached.
    The `else` statement must be in the line `playing_song = false;` which we specified
    in `Step 9`. Finally, the function will wait for a button press and then run the
    next MP3


    # ## Additional buttons


    Extra buttons can be added by following: Steps 8 and 9 and setting up `button3`.
    Then, under the code in `Step 14`, also add that statement and the required response.
    For example, add a button to mute the volumes, play the previous song and even
    shut down the Raspberry Pi.


    * Winebit'
