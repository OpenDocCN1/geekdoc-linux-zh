  md: '# Review Remote desktop clients


    # In brief: compare and contrast our verdicts


    | Remote | Remmina | TigerVNC | TightVNC | Vinagre |

    |---|---|---|---|---|

    | features | One of the clients that pick up VNC servers running on the network.
    | Supports various encryption schemes and enables users to create view-only sessions.
    | The feature set is very similar to that in TigerVNC due to shared ancestry.
    | The other multi-protocol client that can sniff VNC servers on the network. |

    | Interface | Asks to you details in a profile for quicker reconnects. | A simple
    and intuitive interface that exposes various tunable options. | Exposes a good
    number of options without intimidating the user. | Very similar to Remmina but
    doesn''t offer as many controls. |

    | settings | Offers options to be flexible without misleading. | Another client
    that doesn''t have provision for global settings. | Sadly, no options besides
    while connecting. | No extra tweakable options |

    | control | Provides useful options to tweak the connection during an active session.
    | The FB menu offers various options to influence the active connection. | The
    connection can be easily modified and tweaked. | Unlike the others needs to change
    colour depth. |

    | Overall | Has enough features to be useful for occasional and regular VNC users.
    | A wonderful performer that doesn''t quite up to some others. | Looks good on
    paper but needs second help in its Windows version. | A decent client for occasional
    users, not for advanced features.


    # AND THE WINNER IS...


    # Remmina


    It was really a close contest between four desktop clients that virtually offer
    the same features and are very closely matched in terms of usage.

    TigerVNC feels bit out of contention since the Java-based client feels not at
    home on Linux. While works with all VNC servers, it performs best with its own
    server that''s tuned to make the most of limited resources. Unfortunately, the
    corresponding server is available for Windows only.

    Vinagre joins the fight but performs pretty well. It also supports multiple protocols,
    but the client doesn''t offer the same features as the others during use. A disadvantage
    is that since it''s used for occasional use it lacks the controls offered by Remmina.

    TigerVNC comes close to Remmina. Both perform well irrespective of the VNC server
    at the other end. Remmina outperforms TigerVNC in terms of usability. It has a
    broad range of features that


    ![](img/69deeba7290e54cc2d9b0be00f232820_83_0.png)


    > Sunset Tower, Los Angeles


    > Remmina really thanks to its impressive list of desktop tools, features and
    performance and


    meets the requirements of newcomers and experienced-tuned VNC-users. Remmina supports
    the widest range of protocols and scales well in the performance department. In
    addition, it offers the flexibility to change the quality settings of the connection
    on the


    fly. All things considered, Remmina is a wonderful desktop client and would serve
    you well if you can live without extra features such as the ability to transfer
    files, which really isn''t the primary function of a VNC client in any case.


    Mayank Sharma


