  md: "# # Other ways to parallelisation\n\n```\neventl1()\n\ndef func2():\n    if\
    \ eventl1():\n        print('I got a flag\nfrom func1')\n```\n\nuse the multiprocessing\
    \ module. The module uses subprocesses to bypass the GIL in order to get true\
    \ parallel processing. In most cases, you could use the code below to get behaviour\
    \ similar to what you get with:\n\nWe've looked at how to handle parallel tasks\
    \ within a Python program. Sometimes you need to run other pieces of code asynchronously.\
    \ In these cases, you might need to execute external code and interact with it.\
    \ In an example, we will look at how you could use the ls program and its output.\n\
    \n```\nimport multiprocessing\ndef func(name):\n    print('hello', name)\n\np\
    \ = multiprocessing.Process(target=func, args=('bob',))\nnp.start()\nnp.join()\n\
    ```\n\nSometimes, the only communication you need to know is how many of the threads\
    \ have completed some of their work. Sometimes, multiple threads load until everyone\
    \ is done before moving on the next stage. In this case, you can do so with a\
    \ barrier. For example, you could add a barrier to the two threads (above).\n\n\
    ```\nimport subprocess\nsubprocess.run([\"ls\", \"-l\"], stdout=subprocess.PIPE)\n\
    ```\n\n```\nbarrier = threading.Barrier(2)\ndef func1():\n    barrier.wait()\n\
    df func2():\n    barrier.wait()\n```\n\nThe run method accepts input as arguments\
    \ for the external program it runs. By default, it does not send the output of\
    \ the external program back to the main Python code. In this example, we will\
    \ set the input parameter and capture the output using PIPE. You might also want\
    \ to capture the output through a shell.\n\nIn the code above, you need to know\
    \ how many threads will take part of the barrier you want to create. When threads\
    \ reach the barrier, they call the wait method, which will block until all of\
    \ the threads call it.\n\n```\nproc = subprocess.Popen(\"ls\", \"-l\", stdout=subprocess.PIPE)\n\
    ```\n\nThe threading is a light, fast and easy method to add the divide up the\
    \ process within your code. However, it might suffer from some issues because\
    \ it shares a single core: the GIL (global interpreter lock). The GIL is used\
    \ to control access to Python objects.\n\nThe run method is a simplified interface\
    \ for running external programs. When you need to wait for the program to finish\
    \ before continuing your Python programs, use the communicate method.\n\n```\n\
    stdout, stderr = proc.communicate()\n```\n\nThis means that at all points, your\
    \ threads will run only one at a time. This can introduce a bottleneck if you\
    \ are in them situations. If so you may need to\n\nIf you also want to send input\
    \ to the external process, you can pass a parameter input with the data. This\
    \ blocks until the external process finishes. If you want to read streams without\
    \ waiting for the external process to finish, you can use pipes to stdout and\
    \ stderr.\n\n+   - multiprocessing.set_start_method(\"spawn\")\n\nIf you need\
    \ to start many subprocesses, you might need to change your code. The set_start_method\
    \ should only be called once before joining any process.\n\n```\nproc = subprocess.Popen(\"\
    ls\", \"-l\", stdout=subprocess.PIPE)\nproc2 = subprocess.Popen(\"ls\", \"-l\"\
    , stdout=subprocess.PIPE)\nprint(proc2_output.read())\n```\n\nHopefully, this\
