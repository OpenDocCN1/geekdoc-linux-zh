    # JavaFX concepts


    When we loaded the new App Java (the App that we created in last month), we notice
    that JavaFX uses some terminology for its core concepts. The top-level container
    in a JavaFX application is known as a ''stage'' and it has the capacity to hold
    one or more ''scenes''. Scenes are seen within stages, and they allow the interface
    to change completely; for example, when we are moving from the welcome screen
    to the main application, the welcome screen will take up one scene and the main
    application in another.


    On top of the scene, we place GUI components - for example, text boxes, buttons,
    and images. In JavaFX, these components are called ''nodes'', and they are organised
    into a free tree called the ''scene graph'', in which nodes are designated as
    children.


    > JavaFX allows us to style graphical elements using CSS, a language designed
    specifically for purpose


    of other nodes. JavaFX streamlines the process of writing GUI code so you do not
    have to worry about hiding or showing different components. The rule is simple:
    if a parent is shown, all its children are shown. For example, an HBox is a box
    that lays its children in a horizontal line. If you hide the HBox it no longer
    appears, all its children will disappear too. We needed to handle the layout of
    some kind; we added the Parent class. The Parent class stores the children in
    an ObservableList of nodes, which we can retrieve using the getChildren() method.
    ObservableList implements the List interface, so we can add


    ![](img/69deeba7290e54cc2d9b0be00f232820_44_0.png)


    remove using the same methods we use to add and remove elements from order lists.
    See Figure 3 for the ''root'' node placed directly on the scene. The root node
    is the ancestor for all nodes on the GUI. If a node is not a descendant of the
    root node, it will not be displayed.


    +   Last, there are some steps to follow when creating a JavaFX application:

    1. Create a root (normally some kind of Pane).

    2. Use getChildren().add() to add more nodes to the root (normally more Panes)
    to handle different sections of your application, or perhaps some buttons or images.


    # Your IDE is a power tool


    The Eclipse IDE provides lots of tools which you can use when you are developing
    JavaFX programs. As the last time, the IDE makes it easy to implement interfaces
    of scenes, help you implement code from the new classes, and help you manage the
