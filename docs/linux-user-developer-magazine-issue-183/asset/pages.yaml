    # Extra battery monitor


    The Powerboost 1000 charger has a low-battery output (LBO) which can be used to
    signal that the battery is dead. Vorketter wanted after more battery monitor information
    to display a status change "just like an off-the-shelf would have", so he added
    a battery voltage monitor.


    # Added time


    The Raspberry Pi doesn''t know the time if it lacks internet. It doesn''t have
    a real-time clock. So he tried to connect the Pi to an RTC, via the internet and
    if it''s not 1970... you can get add-RTC clocks to fix this - but as Vorketter
    had removed the GPIO pins, he wired in a DS3231 RTC chip instead.


