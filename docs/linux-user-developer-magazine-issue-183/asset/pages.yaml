    # MARKDOWN PARSER & CONVERTER

    CommonMark.c0.28


    # Fast Markdown converter


    It''s likely you''ve written all sort Markdown, or parsed a README, for a GitHub
    page. But have you looked at what lies beneath? Ambiguities in the original CommonMark
    spec, and bugs in the reference implementation led to an effort to standardize
    Markdown in 2014; this is the reference implementation.

    If you only have to convert a few documents from Markdown to HTML, then you won''t
    mind a few milliseconds here and in the conversion process, and will use Pandoc,
    or whatever tool you have to hand. If you have a static blog, you''ll need its
    build. But if you have a substantial number of documents – particularly one constant
    revision – CommonMark''s speed is reason enough to give it a try.

    The program provides a library to render documents to HTML, grep, LaTeX, representation
    of the abstract syntax tree (AST). There''s also mark, command-line parser and
    renderer for free – which has been measured at 10,000 times faster than Markdown.pl!
