  md: "# Conditional expression\n\n# Returns true if\n\n```\n[[ num1 -eq num2 ]]\n\
    ```\n\n```\nnum1 and num2 are equal\n```\n\n```\n[[ num1 -ne num2 ]]\n```\n\n\
    ```\nnum1 and num2 are not equal\n```\n\n```\n[[ num1 -lt num2 ]]\n```\n\n```\n\
    num1 is less than num2\n```\n\n```\n[[ num1 -le num2 ]]\n```\n\n```\nnum1 is less\
    \ than or equal to num2\n```\n\n```\n[[ num1 -gt num2 ]]\n```\n\n```\nnum1 is\
    \ greater than num2\n```\n\n```\n[[ str1 -ge num2 ]]\n```\n\n```\nstr1 is greater\
    \ than or equal to num2\n```\n\n```\n[[ str1 = str2 ]]\n```\n\n```\nstr1 is the\
    \ same as str2\n```\n\n```\n[[ str1 != str2 ]]\n```\n\n```\nstr1 is different\
    \ from str2\n```\n\nAbove Bash's if provides many comparison operators\n\nfollow\
    \ with else commands and finish the block with. if we want to add additional branches\
    \ (corresponding to the else if construct from others), then use the keyword\n\
    \n> Most languages provide a simple-for-loop, and Bash scripting is no exception\n\
    \n```\n#!bin/bash\nnumber_files=$($1 | wc -l)\nif [ \"$number_files\" -gt 100\
    \ ]; then\n  echo \"ten more files in the working directory\"\nelif [ \"$number_files\"\
    \ -gt 10 ]; then\n  echo \"10 more files in the working directory\"\nelse\n  echo\
    \ \"ten fewer files in the working directory\"\nfi\n```\n\n![](img/69deeba7290e54cc2d9b0be00f232820_36_0.png)\n\
    \nAs with assignment, the use of Spaces is important when writing conditions;\
    \ you must leave a space after the opening and before the closing )) or the script\
    \ will not work. Similarly, it is important to include the keyword after each\
    \ if or elif (but not the else clause); otherwise, you will get a syntax error.\n\
    \n# for loops\n\nMost languages provide a simple-for-loop, and Bash scripting\
    \ is not. The basic operation of a for-loop in Bash is to repeat through a sequence\
    \ of:\n\n```\nfor s in list\necho $s\ndone\nive\n```\n\nHere, the first line set\
    \ the variable s to execute each of the strings, it is best and in then executing\
    \ the body of the loop (between do and done) each time that particular value of\
    \ s. This might not seem very useful on its own, but we can combine it with globbing,\
    \ the results can be powerful for.\n\nThe operator -gt stands for 'greater than'\
    \ and can be used to compare integers. For example, if [[ -f name ]] tests if\
    \ a file name exists in the working directory, or if [[ -d name ]] tests if the\
    \ file called name is\n\nYou can combine conditions using the AND-&& or OR operator\
    \ || just as in other languages, e.g.:"
