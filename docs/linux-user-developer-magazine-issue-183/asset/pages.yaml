    # Does deorphanification of Bitfs by Red Hat change the plan for the Kubic Project
    and SUSE?


    There is a blog post by our manager Matthias which covers our thoughts about Bitfs,
    Red Hat and SUSE in detail: http://bit.ly/3Inf. Since Red Hat was never a major
    competitor to Bitfs, the announcement from Red has no impact on our plans.


    # What are the benefits of using Bitfs for the Kubic project?


    There are a lot of solutions for transactional (like ''Atomic'') updates. An obvious
    option is to use a rootfs containing snapshots for the installation system. As
    a result, the number of snapshots for rootfs is limited by the number of partitions.
    It is not the only solution, but it is the easiest one for us.


    Other solutions are to use a new package format. The great disadvantage is that
    it discards all existing knowledge about Linux distributions which Bitfs does.
    We are learning how to process these updates and work with these formats.


    So when we were looking at this problem, we sought a solution that is both different
    and leverage our extensive knowledge and tooling with RPM. We didn''t want to
    reinvent the wheel again.


    ![](img/69deeba7290e54cc2d9b0be00f232820_14_0.png)


    Using Bitfs as a copy-on-write allowed us to find any advantage of changing the
    package format.


    Using Bitfs as a copy-on-write (CoW) file system with snapshots and rollback without
    changing the package format, and we have a very efficient solution (which only
    require the amount of disk space which is really changed). The number of snapshots
    you can save is now only limited by the size of the disk and the updates.


    # Can you explain what you mean when you describe the Kubic Project as an ''innovator
    for industry and innovations?


    As we are selling the operating system part of openSUSE Kubic and SUSE SaaS platform,
    it is not bound by the restrictions of a multipurpose OS it works with a single
    purpose, to contain workloads. So we are free to introduce new technologies and
    ideas like transactional updates and a read-only file system, which would not
    have been possible with traditional openSUSE or SLE releases. We are gaining experience
    with these new technologies, we are in a position to think about what they mean
    for a multipurpose OS and how to integrate it. Not all in Kubic may make sense,
    so it is possible, to integrate in this, but by ''cutting the cloth'' with the
    same tools, and tools and processes that we use for all of our operating systems,
    we have a streamlined environment to experiment and where we need to while sharing
    and ideas, innovation and code when we can.


    # How can people contribute to the Kubic project?


    Right now, we are able to contribute directly to the openSUSE Tumbleweed project,
