  md: '# Doomsday switch


    # Raspberry Pi doomsday switch


    Cement your Bond villain status using a Raspberry Pi and the handy Pibrella board
    and create a switch of Doom


    ![](img/69deeba7290e54cc2d9b0be00f232820_73_0.png)


    Any evil genius worth their salt knows that a key part of their arsenal, besides
    a secret base inside a volcano, is a doomsday device which triggered will release
    nuclear launch tones. Not all of us have aspirations of world domination, but
    we can appreciate the usefulness of a doomsday device which at a moment''s notice.
    In this project, we''ll be using the versatile Pibrella add-on board to build
    your very own device.

    Aside from having the big red button, the board also comes with a buzzer which
    can be programmed to signal a countdown when you activate the doomsday switch.
    The Pibrella also has built-in LEDs (green, yellow and red), which we''ll also
    use.\ Once the switch is pressed, a Python script is launched to capture audio
    samples (the LUID and display) to allow you to send an email or data to your Pi,
    which you can configure using the guide below. But we encourage you to customize
    it as you see fit..


    +   01 Prepare your Pi

    Using any model of Pi with GPIO pins, you''ll need to create a clean install of
    the latest version of Raspberry – so it''s up to date. Open a terminal and run
    sudo


    +   02 Connect your Pibrella

    The Pibrella has its anti-static bag and connect it to your Raspberry Pi. If you''re
    using a Raspberry 3, you may notice that there are more than corresponding pins
    on the Pibrella. The Pibrella must be connected to first 26 GPIO pins – this is
    the end furthest from the USB ports (see photo above to check correct positioning):'
