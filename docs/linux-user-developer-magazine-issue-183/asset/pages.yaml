  md: '# HARDWARE


    # Nimbusisoft launched PCs featuring Ubuntu Budgie


    # A range of laptops and desktops


    Following in the footsteps of US Reseller System76, Newcastle-upon-Tyne company
    Nimbusisoft is launching a range of desktop and laptop computers that switch with
    Ubuntu Budgie pre-installed.


    Five PCs range from the Cern at £299 up to the heavy-duty Vulcan at £1299 – alongside
    a pair of all-in-one desktops at £699. All are available in various configurations
    and can be built with the preferred CPU, RAM, storage, graphics card and operating
    system within elegant chassis and backlit keyboards, multi-touch tracks and USB
    3.0 ports. These devices are designed by Nimbusisoft using high-quality hardware
    designs.


    Tware OEM is providing the hardware. While Ubuntu Budgie 17.04 is the default
    choice, Ubuntu is available on all devices. Launched in November 2016 as Budget-Mixie,
    Ubuntu Budgie is a lightweight version of Ubuntu with the Budgie edition, developed
    by the team behind Solus project. After its initial release, Ubuntu


    Budgie was adopted as an official community flavour of Ubuntu in April 2017.


    Three PCs (two laptops, one desktop) are available purely with Ubuntu Budgie.
    These Ubuntu Budgie Edition devices are key highlights of the range.


    > Nimbusisoft MD Chris Harvey tells “We’re excited to be partnering with Ubuntu
    Budgie which we think is a great thing to do with our hardware. We are making
    a Linux distro that is both easy and reliable to pre-install on all our hardware
    models. Ubuntu Budgie will also receive a percentage of the revenue from which
    he will fund its content and development.”


    Nimbusisoft is also planning another Linux distro. Our OS will be based on Plasma
    5, and no more details than we are currently working on.


    A one-year parts and labour warranty is available with each PC from Newcastle
    payment is via credit card or PayPal. Head out to https://nimbusisoft.com to see
    the full range.


    # TOP FIVE


    # Top 5 Linux editing tools


    ![](img/69deeba7290e54cc2d9b0be00f232820_6_0.png)


    # 1 Audacity


    Probably the default choice for most Linux users, Audacity can do everything from
    recording and multi-track music to picking up audio from radio, editing audio
    and other voice work. Audacity can be given extra functionality, with community-developed
    plugins.


    ![](img/69deeba7290e54cc2d9b0be00f232820_6_1.png)


    # 2 Ardour


    Capable of recording, editing, and mixing, Ardour (http://ardour.org) is intended
    for musicians, composers and sound designers, and supports hundreds of plugins.
    A free version is available as one-off payment or soundtrack for the packaged
    version, or as free, compile-it-yourself option.


    ![](img/69deeba7290e54cc2d9b0be00f232820_6_2.png)


    # 3 LMMS


    Download LMMS for free at http://lmms.io, where the purpose is to make music.
    With multi-track instrument, it supports automated routing, unlimited tracks and
    effects support for most keys, and VST support for Wine.


    ![](img/69deeba7290e54cc2d9b0be00f232820_6_3.png)


    # 4 The OpenOctave Project


    Being designed for a religious project, OpenOctave MIDI (OM) is a free MIDI-based
    music and film score composer, that works for voice-acting or recording a band.
    Find out more at http://openoctave.org.'
