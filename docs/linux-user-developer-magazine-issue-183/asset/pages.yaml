    Your source of Linux news & views.


    # SMALL COMPUTER


    # Raspberry Pi gets Raspberry Stretch


    Security, enhanced Bluetooth support and username support are among improvements
    to


    Following the launch of Debian Stretch, Raspberry Pi users can now get hold of
    Raspberry Stretch, the dedicated distro from the Raspberry Foundation. Still wielding
    the PIXEL desktop, Raspberry Stretch comes with a number of improvements, especially
    for the Raspberry Pi.

    The differences between Jessie and Stretch are mostly-under-hood optimizations,
    and you really shouldn''t notice any differences between the two sets of desktop
    and applications.

    Most notable are the improvements to Chromium which include improved memory usage
    and efficiency, enabling the browser to run faster. There''s also a change to
    the browser''s appearance. Regular users will notice


    some additions to input and output, including MIDI and OSC.

    Along with these, the update addresses security issues, Bluetooth support and
    username issues.

    The Broadplay, which mainly affects Android and iOS devices, can be executed on
    a Raspberry Pi. To deal with this, a patch is included in the update which prevents
    the BCM28xx chips from being hacked via a vulnerability in the chip''s firmware.

    Bluetooth support for audio devices has flipped from PulseAudio, in favour of
    a more direct connection with ALSA. To this end, the bluetooth also included in
    Raspberry Stretch, which should give better audio results. PulseAudio can still
    be installed manually.

    Also the update username handling has been improved. Now, applications will not
    assume that pi is the default user and run into problems when this is not the
    case. sudo has been similarly improved.


    ![](img/69deeba7290e54cc2d9b0be00f232820_7_0.png)


    +   Most are the improvements to Chromium (v60), enabling the browser to run faster


    > Raspberry Stretch brings some security improvements to the Pi


    > Advice for upgrading Raspberry Stretch is straightforward: for the best results,
    use freely downloaded.


    # SECURITY


    # Virus spreading via Facebook Messenger


    Cross-platform malware hides in video links


    Cross-platform users are targeted with a new Facebook Messenger scam, which exploits
    a vulnerability to advertise. This fake attack targets users by name and a link
    to load malware that runs on their operating and system. While Windows users see
    a landing page that encourages them to install extra software, Linux users get
    a landing page that encourages them to add to a PPA before the Facebook Messenger
    box will pop up.


    addressed you, followed by a ''Video'', an email, and the link to a landing page.
    There is no reason to click anything but a scam, as video clips are not shown
    anyway.


    For veteran users, the dangers of malware are well known. With Linux''s increasing
    use —via workplaces embracing open source, and the Raspberry Pi — there are increasing
    number of users who are unaware of the risks. The scammers have put the effort
    into producing a Linux attack, after all.


    The simplest way to avoid this attack is to ignore the message. If you clicked,
    it likely requires repair to add Pi. If you''re already infected, or know who
    is is, the steps to help, then:


    Troubleshooting Firefox: use the ''Refresh'' button to reset the browser and remove
    any add-ons. Use Chrome > Settings > Advanced > Reset. You should also check your
    Facebook account for unwanted apps and plug-ins, in Settings > Apps.


    8'
