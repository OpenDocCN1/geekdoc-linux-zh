    # Purism confirms Linux smartphone\n\nEncrypted calls for Linux-based smartphones\
    \ are a key feature of security-focused handset\n\nThe tale of Linux-based smartphones\
    \ is not a happy one. While Android might be based on the Linux kernel, the libraries\
    \ and almost everything else is different. It's easy to port an application to\
    \ a Linux smartphone, but this is overly simplistic. After all, there's very little\
    \ that is open source in the latest Samsung handsets.\nFollowing the unprecedented\
    \ freedom of the mobile space, Social Purpose Purism Corporation is launching\
    \ its new Linux-based phone, which is better than the Librem 5 that Purism will\
    \ deliver next year.\nLaunched through a crowdfunding campaign (with a $1.5 million\
    \ funding goal) at Purism.com, the Librem 5 will be fully declassified, encrypted\
    \ by design; Purism's Pro63 will be preloaded, with convergence technology enabling\
    \ the device to be truly secure.\nChating exclusively with LUAD, Purism chief\
    \ told us that the Librem 5 is built from completely free and open software, with\
    \ decentralised IP-based communication, which offers the users\n\nbest possible\
    \ hardware and user control. The creates a future where people can control their\
    \ mobile experience similar to how we control our laptop experience when using\
    \ Linux and free/libre open source.\nIn short, if you're frustrated by the lack\
    \ of privacy on Android and iOS, then you might just be interested in the Librem\
    \ 5. It is a smartphone that does not track you, and includes open Wi-Fi and Bluetooth,\
    \ and the basic telephony/mobile data.\nPlan to offer unprecedented privacy and\
    \ security on a mobile device is no easy task. As such, Purism aims to provide\
    \ the world with the first ever Matrixox-powered smartphone, and with native end-to-end\
    \ encryption for the decentralised data and messaging apps.\nBut from other Linux\
    \ smartphone projects? Weaver says \"Purism has learned from every story before\
    \ the Librem 5, and to mitigate risk, they're 'supporting all GNU/Linux distributions\
    \ out-of-the-box,' and 'taking an\n\nAbove: Convergence technology enables desktop-like\
    \ functionality with the Librem\n\nupstream-first development approach, rather\
    \ than creating a separable mobile OS.\nFrom a manufacturing point of view, Purism\
    \ plans \"fabricating in smaller quantities to mitigate upfront cost requirements,\
    \ while leveraging hardware to create a depth of credibility by security, privacy,\
    \ and freedom for the wider audience.\" \nWe have gained from previous experience\
    \ with product delivery of smaller security-focused tablets and tablets that Purism\
    \ has a trusted supply chain.\nIn short, everything is looking good for the Librem\
    \ 5, with funding at 10.84% with 52 days to go as this went to press.\n\n6"
