    # GROUP TEST


    # # Remote desktop clients


    These clients will enable you to take charge of all computers in your network
    without leaving the comfort of your recliner, but which is the best?


    # ### Remmina


    It came to life as a result of a developer being dissatisfied with the usability
    of his Eee PC. Self-styled as a feature-rich desktop client, Remmina supports
    many protocols and is in the repositories of virtually every Linux distro.

    www.remmina.org


    # ### TigerVNC


    TigerVNC is a cross-platform unbranched branch of TigerVNC forked in 2009 and
    with Fedora''s default VNC implementation shortly thereafter. It claims to provide
    performance and is capable of rendering 3D apps and video from the network.

    http://tigervnc.org


    # ### TightVNC


    Written in Java, this cross-platform client was once very popular for its connection
    flexibility and ''tight encoding'' that helped performance over a low-bandwidth
    connection. However, TightVNC has lost some of its shine over the years.

    www.tightvnc.com


    # ### Vinagre


    Vinagre is the default GNOME desktop interface. It has an interface that is drawn
    over all the functionality it provides. Vinagre supports multiple clients and
    it''ll be of interest to pick it apart later to offer more features and functionality.

    http.ly/GNOMEVinagre'
