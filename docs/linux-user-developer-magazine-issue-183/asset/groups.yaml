    \ at the right, navigate to find the eggsExtra_lt.tar on the cover disc, then\
    \ under 'folder' near the bottom, select 'Browse...', click on the eggs project\
    \ and click 'OK' to merge the new files into the existing project. This will add\
    \ a new package, `load.eggs`, to the project, containing some new files. It will\
