    ## 终极发行版与应用


    ## 最适合企业的发行版


    ### Red Hat Enterprise Linux (RHEL)


    对于企业领域稳如磐石的支持，Red Hat 是极极的选择。


    为企业选择 Linux 发行版与其说是为了功能，不如说是为了支持。Linux 已经是企业服务器市场的强大力量，且其数量稳定增长，作为运行业务的系统，在各种场景下都非常可靠
    - Linux 领域很少比 Red Hat 更好的。该公司的产品被超过 90% 的世界百强公司使用。


    Fedora 的生命周期与其他发行版完全不同 - 版本于 2014 年发布，版本 21（也称为 7）于 2014 年 8 月发布。Fedora 通常每 18
    到 36 个月发布一次，并对所有版本提供支持。Red Hat 提供十年或更长的支持合同。主要版本并不按固定周期运行。通常会发布最新版本，就像版本 6 一样，这反映了
    Red Hat 在发布版内更新内核的策略，而不是维护其稳定版本，以提供强大的安全性和防御威胁。


    Fedora 是一个 Red Hat 支持的项目，Fedora 17 实际上是 Fedora 19 和 20 的分支，Fedora 开源项目作为未来 RPM
